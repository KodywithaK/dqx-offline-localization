"0":
  de: "@a@b%0%a00120 sieht sich die Bücherregale an.\n@c0@"
  en: "@a@b%0%a00120 looks at the bookshelves.\n@c0@"
  es: "@a@b%0%a00120 mira los estantes.\n@c0@"
  fr: "@a@b%0%a00120 examine les étagères.\n@c0@"
  it: "@a@b%0%a00120 osserva gli scaffali.\n@c0@"
  ja: "@a@b%a00120は　本だなを調べた。\n@c0@"
"1":
  de: "@a@bDa ist ein Buch mit dem Titel ⓞBurland ⓚⓛ damals und heuteⓟ. %0%a00120 nimmt es und überfliegt ein paar Zeilen.\n@c0@"
  en: "@a@bThere's a book called ⓗA History of Bonnie Burlandⓘ. %0%a00120 takes it from the shelf and reads an excerpt.\n@c0@"
  es: "@a@bHay un libro llamado ''La historia del hermoso reino de Burlandia''. %0%a00120 lo coge de la estantería y lee un fragmento.\n@c0@"
  fr: "@a@bElles contiennent un livre intitulé ⓥHistoire du beau pays de Bastioneⓦ.\n%0%a00120 le prend et en lit un extrait.\n@c0@"
  it: "@a@bC'è un libro dal titolo ⓕStoria del Regno di Burlandiaⓖ. %0%a00120 lo prende dallo scaffale e ne legge un passaggio...\n@c0@"
  ja: "@a@b「バトランドの歴史」と\n書かれた本がある。\n%a00120は　手にとって読んだ。\n@c0@"
"2":
  de: "@a@bⓞBurlands Gründer, Roburt der Burleske, schützte sein Reich vor Ungeheuern, als es noch ein winziger Weiler war.\n@c0@"
  en: "@a@bⓗRoburt the Burruce, founder of Burland, protected his domain from monsters when it was little more than a wee hamlet.\n@c0@"
  es: "@a@b''Leovigildo I, fundador de Burlandia, protegió su tierra de los monstruos cuando no era más que una diminuta aldea.''\n@c0@"
  fr: "@a@bⓥRobert le Bavard, fondateur de Bastione, protégea son domaine des monstres quand celui-ci n'était encore qu'un petit hameau.\n@c0@"
  it: "@a@bⓕRoburt il Burlando, fondatore di Burlandia, protesse dai mostri il suo territorio quando questo era poco più che un minuscolo villaggio.ⓖ\n@c0@"
  ja: "@a@bバトランドの開祖　バトレアは\nまだ集落でしかなかった　当時の\nバトランドを　魔物たちから守った。\n@c0@"
"3":
  de: "@a@bEs hieß, kein Angriff habe ihm etwas anhaben können, weil ein Schild der himmlischen Mächte ihn beschützt habe.ⓟ\n@c0@"
  en: "@a@bⓗIt's said that he was invincible tae any attack because of a special shield bestowed upon him from on high.ⓘ\n@c0@"
  es: "@a@b''Se cuenta que era inmune a cualquier ataque gracias a un escudo especial que le fue concedido desde las alturas.''\n@c0@"
  fr: "@a@bOn raconte qu'il pouvait résister à toutes les attaques grâce à un bouclier spécial qui lui avait été remis par une instance supérieure.ⓦ\n@c0@"
  it: "@a@bⓕSi narra che uno scudo speciale donatogli da una divinità celeste lo rendesse praticamente invulnerabile.ⓖ\n@c0@"
  ja: "@a@bその際　天の神から　さずかった盾で\nバトレアは　魔物の　あらゆる攻撃から\n身を守ったという……。\n@c0@"
"4":
  de: "@a@bDa steht auch ein Haushaltsbuch. Man sieht auf den ersten Blick, dass die Leute hier kein Geld haben.\n@c0@"
  en: "@a@bThe account book of the household is on one of them. A quick peek inside shows the people here are very poor.\n@c0@"
  es: "@a@bEn una de ellas se encuentra el libro de cuentas de la casa. Un rápido vistazo a su interior muestra que sus gentes viven en la pobreza.\n@c0@"
  fr: "@a@bSur l'une d'entre elles se trouve le livre de comptes de la maison. Un rapide coup d'œil suffit à voir que ses habitants sont très pauvres.\n@c0@"
  it: "@a@bQui c'è il libro delle spese e degli incassi di questa famiglia. Basta dare una rapida occhiata per capire che si tratta di gente molto povera.\n@c0@"
  ja: "@a@bこの家の　家計簿がある。\n中を見ると　まずしい暮らしぶりが\n伝わってくるようだ。\n@c0@"
"5":
  de: "@a@bMitten zwischen den Büchern steht auch das Tagebuch des Schuldirektors. %0%a00120 überfliegt ein paar Zeilen.\n@c0@"
  en: "@a@bThere's a headmasters's diary slotted between a couple of the books. %0%a00120 reads a small section.\n@c0@"
  es: "@a@bEntre los libros se esconde el diario de un profesor. %0%a00120 lee un pequeño fragmento.\n@c0@"
  fr: "@a@bLe journal d'un maître d'école est coincé entre deux livres. %0%a00120 en lit un court passage.\n@c0@"
  it: "@a@bNascosto fra due libri si intravede il diario di un preside. %0%a00120 ne legge un breve passaggio...\n@c0@"
  ja: "@a@b本の間に　校長の日記がはさまっている。\n%a00120は　校長の日記を読んだ。\n@c0@"
"6":
  de: "@a@bⓞDiese Schlingel sind schwerer zu hüten als ein Sack Flöhe. Sie schleichen sich aus dem Dorf und haben nichts als Unfug im Kopf.ⓟ\n@c0@"
  en: "@a@bⓗThose kiddies don't listen to a word I say.\nThe wee rascals have been sneaking out of the village and getting up to all sorts of mischief.ⓘ\n@c0@"
  es: "@a@b''Esos chiquillos no escuchan lo que les digo.\nLos granujas han estado saliendo a hurtadillas del pueblo y se han dedicado a todo tipo de fechorías.''\n@c0@"
  fr: "@a@bⓥCes gosses n'écoutent pas un mot de ce que je leur dis. Ces petits voyous se faufilent hors du village et préparent toutes sortes de bêtises.ⓦ\n@c0@"
  it: "@a@bⓕQuei ragazzini non ascoltano mai quello che dico loro. I birbanti escono dal villaggio e ne combinano di tutti i colori.ⓖ\n@c0@"
  ja: "@a@b子供たちは　言うことを聞こうとしない。\n学校や親の目を盗んで　村の外へ出て\n遊びまわっているようだ。\n@c0@"
"7":
  de: "@a@bDa ist ein Buch über Theologie mit dem Titel ⓞGlauben und Gebetⓟ. Irgendetwas scheint zwischen die Seiten gerutscht zu sein.\n@c0@"
  en: "@a@bThere's a book on theology entitled ⓗFaith and Prayerⓘ. Something seems to be hidden between the pages.\n@c0@"
  es: "@a@bHay un libro sobre Teología titulado ''Fe y oración''. Parece que hay algo oculto entre las páginas.\n@c0@"
  fr: "@a@bElles contiennent un livre sur la théologie intitulé ⓥFoi et prièreⓦ. On dirait que quelque chose a été glissé entre les pages.\n@c0@"
  it: "@a@bC'è un libro di teologia dal titolo ⓕFede e preghieraⓖ. Fra le sue pagine c'è qualcosa...\n@c0@"
  ja: "@a@b「信仰と祈り」という　神学の本がある。\n本の間に　何か　はさまっているようだ。\n@c0@"
"8":
  de: "@a@bEs ist ein heimlich gemaltes Bild von Alena!\n@c0@"
  en: "@a@bIt's a secretly-drawn picture of Alena!\n@c0@"
  es: "@a@b¡Es un retrato de Alena hecho a escondidas!\n@c0@"
  fr: "@a@bC'est un portrait volé d'Alinaⓠ\n@c0@"
  it: "@a@bÈ un'immagine di Alena ritratta di nascosto!\n@c0@"
  ja: "@a@bなんと　アリーナの　かくしどり\nブロマイドが出てきた！\n@c0@"
"9":
  de: "@a@bHier stehen säuberlich aufgereiht Titel wie ⓞDisziplin in der Erziehungⓟ, ⓞKönigliche Traditionenⓟ und ⓞLässig sein leicht gemachtⓟ.\n@c0@"
  en: "@a@bBooks such as ⓗDiscipline in Educationⓘ, ⓗRoyal Traditionsⓘ and ⓗLearning the Laid-Back Wayⓘ are lined up neatly.\n@c0@"
  es: "@a@bVolúmenes como ''Disciplina en la educación'', ''Tradiciones reales'' y ''Aprendizaje sin preocupaciones'' se encuentran en perfecto orden.\n@c0@"
  fr: "@a@bDes livres tels que ⓥÉducation et disciplineⓦ, ⓥLes Traditions royalesⓦ et ⓥApprendre sans se fatiguerⓦ y sont soigneusement alignés.\n@c0@"
  it: "@a@bLibri quali ⓕLa disciplina nell'educazioneⓖ, ⓕTradizioni regaliⓖ e ⓕImparare a prendersela comodaⓖ sono allineati ordinatamente.\n@c0@"
  ja: "@a@b「しつけと教育」「王家のしきたり」\n「のびのび学習のすすめ」などの本が\nきちんと　並べられている。\n@c0@"
"10":
  de: "@a@bDa steht ein Buch mit dem Titel ⓞGewusst wo: Tipps für Weltenbummlerⓟ. %0%a00120 nimmt es heraus und liest.\n@c0@"
  en: "@a@bThere's a book entitled ⓗTravelling the Curious Wonders of the Worldⓘ. %0%a00120 takes it from the shelf and reads it.\n@c0@"
  es: "@a@bHay un libro titulado ''Viajes por las extrañas maravillas del mundo''. %0%a00120 lo coge de la estantería y lo lee.\n@c0@"
  fr: "@a@bElles contiennent un livre intitulé ⓥÀ la Découverte des merveilles et des curiosités du mondeⓦ. %0%a00120 le prend et le lit.\n@c0@"
  it: "@a@bC'è un libro dal titolo ⓕVisitare le meraviglie del mondoⓖ. %0%a00120 lo estrae dallo scaffale e ne legge un passaggio...\n@c0@"
  ja: "@a@b「世界の不思議を旅しよう！」と\n書かれた本がある。\n%a00120は　手にとって読んだ。\n@c0@"
"11":
  de: "@a@bⓞÜberall auf der Welt gibt es faszinierende Sehenswürdigkeiten, die man sich nach Möglichkeit nicht entgehen lassen sollte.\n@c0@"
  en: "@a@bⓗThere are all sorts of intriguing things scattered about the world that everyone should see if they have the chance.\n@c0@"
  es: "@a@b''El mundo está plagado de fascinantes sorpresas que todo humano debería descubrir si se le presenta la oportunidad de hacerlo.''\n@c0@"
  fr: "@a@bⓥIl existe toutes sortes de choses étonnantes dispersées à travers le monde et que chacun devrait voir, pour peu qu'il en ait l'occasion.\n@c0@"
  it: "@a@bⓕIl mondo è pieno di meraviglie che vale senz'altro la pena visitare.ⓖ\n@c0@"
  ja: "@a@b世界には　さまざまな不思議が\nわれわれを　待ち受けている。\n@c0@"
"12":
  de: "@a@bEine riesige heilige Statue, ein Baum, der bis in den Himmel ragt, Leute, die auf Booten leben, zahllose Städte, die auf keiner Karte verzeichnet sind.\n@c0@"
  en: "@a@bⓗA giant holy statue, a tree reaching to the heavens, folk who live aboard boats, and countless towns that never appear on maps.\n@c0@"
  es: "@a@b''Una estatua sagrada gigante, un árbol que asciende hasta los cielos, gente que vive en barcos y multitud de ciudades que no aparecen en los mapas.''\n@c0@"
  fr: "@a@bUne statue sacrée géante, un arbre montant jusqu'au ciel, des gens vivant à bord de bateaux...\n㈡\n... et d'innombrables villes qui n'apparaissent jamais sur les cartes.\n@c0@"
  it: "@a@bⓕUn'enorme statua sacra, un albero che si protende verso il cielo, genti che vivono su imbarcazioni e molti villaggi che non compaiono sulle carte geografiche.ⓖ\n@c0@"
  ja: "@a@b巨大な神の像　天をつく大樹\n岩山に閉ざされた王国\n地図にはのらない　いくつもの町。\n@c0@"
"13":
  de: "@a@bIhr meint, das alles klinge zu weit hergeholt? Nun, dann zieht doch los und überzeugt Euch selbst!\n@c0@"
  en: "@a@bⓗIf that all sounds too far-fetched to be true, then you should go and see it with your own eyes.\n@c0@"
  es: "@a@b''Si todo esto parece demasiado descabellado como para ser cierto, deberían comprobarlo con sus propios ojos.''\n@c0@"
  fr: "@a@bSi cela vous semble trop incroyable pour être vrai, alors allez voir tout ça de vos propres yeux.\n@c0@"
  it: "@a@bⓕSe tutto ciò vi sembra incredibile, vi invitiamo a verificare con i vostri occhi.ⓖ\n@c0@"
  ja: "@a@bわたしの言葉が　真実かどうかは\n自分の目で　確かめてみるといい。\n@c0@"
"14":
  de: "@a@bMan muss es gesehen haben, um es zu glauben! Also schnürt Euer Bündel, denn auf Euch wartet eine aufregende Welt...ⓟ\n@c0@"
  en: "@a@bⓗSeeing is believing! So pack your bags now, because a fascinating world awaits you...ⓘ\n@c0@"
  es: "@a@b''¡Hay que ver para creer! Preparen su equipaje, porque les espera un mundo fascinante...''\n@c0@"
  fr: "@a@bOn ne croit que ce qu'on voitⓠ Faites donc vos valises à l'instant, car un monde fascinant vous attend...ⓦ\n@c0@"
  it: "@a@bⓕVedere per credere! Preparate i bagagli: c'è un mondo affascinante che aspetta solo di essere esplorato...ⓖ\n@c0@"
  ja: "@a@b旅はいい！　さあ　旅に出よう！\n世界が　キミを待っている！\n@c0@"
"15":
  de: "@a@bZwischen einigen anspruchsvollen Titeln findet sich ein Buch namens ⓞVom Langweiler zum Herzensbrecher in sieben Tagenⓟ.\n@c0@"
  en: "@a@bAmong a collection of high-brow publications is one book entitled ⓗThe Beginner's Guide to Becoming a Casanova in Seven Daysⓘ.\n@c0@"
  es: "@a@bEntre una colección de obras selectas se encuentra un libro titulado ''Guía básica para convertirse en un casanova en siete días''.\n@c0@"
  fr: "@a@bParmi une collection d'ouvrages très intellectuels se trouve un livre intitulé ⓥGuide du débutantⓢ Comment devenir un Casanova en sept joursⓦ.\n@c0@"
  it: "@a@bFra una serie di pubblicazioni molto serie c'è un libro intitolato ⓕCome diventare un Casanova in sette giorniⓖ.\n@c0@"
  ja: "@a@bむずかしそうな本の間に　一冊だけ\n「めざせモテモテ男！　初級編」と\n書かれた本がある……。\n@c0@"
"16":
  de: "@a@bZwischen den Seiten eines der Bücher steckt ein Brief. %0%a00120 liest ihn.\n@c0@"
  en: "@a@bThere's a letter in between the pages of one of the books. %0%a00120 reads it.\n@c0@"
  es: "@a@bEntre las páginas de uno de los libros hay una carta. %0%a00120 la lee.\n@c0@"
  fr: "@a@bUne lettre est glissée entre les pages d'un des livres.\n%0%a00120 la lit.\n@c0@"
  it: "@a@bSeminascosta fra le pagine di un libro c'è una lettera. %0%a00120 la legge...\n@c0@"
  ja: "@a@bなんと　本の間に手紙がはさまっていた。\n%a00120は　手紙を読んだ。\n@c0@"
"17":
  de: "@a@bⓞUnd wie geht es dir, Vater? Ich hoffe, du machst den Laden bald zu und ziehst endlich bei uns ein.\n@c0@"
  en: "@a@bⓗHow are things going, Dad?\nI hope you'll shut up shop soon\nand come to live with us.\n@c0@"
  es: "@a@b''¿Cómo va todo, padre? Espero que cierres la tienda pronto y te vengas a vivir con nosotros.''\n@c0@"
  fr: "@a@bⓥComment ça va, papaⓡ\n J'espère que tu fermeras bientôt le magasin\n pour venir vivre avec nous.\n@c0@"
  it: "@a@bⓕCaro Papà, come stai?\nSpero che chiuderai presto bottega e che verrai ad abitare con noi.ⓖ\n@c0@"
  ja: "@a@bお父さん　お元気ですか？\nそろそろ店をたたんで　私たちと\nいっしょに　暮らしましょうよ。\n@c0@"
"18":
  de: "@a@bDu bist ja schließlich nicht mehr der Jüngste. Da solltest du wirklich nicht immer allein sein. \nBis bald, alles Liebe, deine Mona.ⓟ\n@c0@"
  en: "@a@bⓗYou're not getting any younger, you know.\nI'm worried about you being on your own.\n            From your loving daughter, Monaⓘ\n@c0@"
  es: "@a@b''Los años no pasan en balde, deberías saberlo.\nMe preocupa que estés tú solo.\nDe tu hija que te quiere, Mona''\n@c0@"
  fr: "@a@bTu ne rajeunis pas, tu sais.\nJe m'inquiète que tu sois tout seul.\n            Ta fille qui t'aime, Monaⓦ\n@c0@"
  it: "@a@bⓕGli anni passano per tutti, sai.\nMi preoccupa saperti lì da solo.\nCon affetto, tua figlia Moniaⓖ\n@c0@"
  ja: "@a@bもう　年なんだし\nお父さんひとりでは　心配だわ。\n\t　　　　　あなたの愛する娘より\n@c0@"
"19":
  de: "@a@bDa steht ein Buch mit dem Titel ⓞLiebesgeflüsterⓟ. %0%a00120 nimmt es herunter und liest.\n@c0@"
  en: "@a@bThere's a book entitled ⓗDiary of Secret Communicationsⓘ. %0%a00120 takes it from the shelf and reads it.\n@c0@"
  es: "@a@bHay un libro titulado ''Diario de comunicaciones secretas''. %0%a00120 lo coge de la estantería y lo lee.\n@c0@"
  fr: "@a@bElles contiennent un livre intitulé ⓥJournal de communications secrètesⓦ.\n%0%a00120 le prend et le lit.\n@c0@"
  it: "@a@bC'è un libro dal titolo ⓕDiario delle comunicazioni segreteⓖ. %0%a00120 lo prende dallo scaffale e inizia a leggere...\n@c0@"
  ja: "@a@b「ひみつの　交換日記」と\n書かれた本がある。\n%a00120は　手にとって読んだ。\n@c0@"
"20":
  de: "@a@bⓞMeine herzallerliebste Vroni,\nheute habe ich schon 35 Male an dich denken müssen, und das noch vor dem zweiten Frühstück!\n@c0@"
  en: "@a@bⓗMy dearest Ronnie,\nI've already thought of you at least four dozen times today, and it's not yet elevenses.\n@c0@"
  es: "@a@b''Mi quierida Vero,\nHe pensado en ti unas cuarienta veces en el día de hoy y ni siquiera es la hora del almuerzo.''\n@c0@"
  fr: "@a@bⓥMa Nini adorée,\nJ'ai déjà pensé à toi au moins trois douzaines de fois aujourd'hui, et il n'est pas encore onze heures.\n@c0@"
  it: "@a@bⓕMia amata Veronica,\nda stamattina sei una presenza fissa nella mia mente. Ti ho già pensato 79 volte.ⓖ\n@c0@"
  ja: "@a@bかわいいモニカ。\n今日は　もう５０回も君のことを\n思い出したよ。\n@c0@"
"21":
  de: "@a@bMeine Spiegeleier zum Frühstück, die Säulen der Burg, eine Katze im Park, die Fische im Teich, die Ziegel auf dem Dach... \n㈡\nIn allem sehe ich immer nur dein Gesicht!\n@c0@"
  en: "@a@bⓗMy fried eggs at breakfast, the castle pillars, a cat in the grounds, fish in the pond, the tiles on the roof... I saw your face in all of them.\n@c0@"
  es: "@a@b''En los huevos fritios del desayuno, en las columnas del castillio, en un gato por los pasillios, en los pieces del estanquie, en las tiejas del tiecho...''\n㈡\n''Veo tu rostro por tiodas partes.''\n@c0@"
  fr: "@a@bMes œufs frits au petit déjeuner, les piliers du château, un chat dans le parc, un poisson dans la mare, les tuiles sur le toit...\n㈡\n... Dans chaque chose, j'ai vu ton visage.\n@c0@"
  it: "@a@bⓕNelle uova fritte a colazione, nelle colonne del castello, in un gatto nei campi, nei pesci dello stagno, nelle tegole sul tetto... Vedo il tuo volto ovunque.ⓖ\n@c0@"
  ja: "@a@b朝ごはんの目玉やきも　お城の柱も\n庭のネコも　池の魚も　屋根のカワラも\nみーんな　君の顔に見えるんだ。\n@c0@"
"22":
  de: "@a@bAlles, alles erinnert mich immer nur an dich ⓚⓛ oh schöne, oh wunderbare Welt!\nEin dreifach Hoch auf meine Prinzessin Veronica!\n@c0@"
  en: "@a@bⓗThis beautiful world is full of your image.\nThree cheers for my dear Princess Veronica!\n@c0@"
  es: "@a@b''Este biello mundo proyecta tu imagien por doquier.\n¡Tres hurras por mi amada, la princiesa Vierónica!''\n@c0@"
  fr: "@a@bCe monde magnifique est rempli de ton image.\nHourra pour ma très chère princesse Véronicaⓠ\n@c0@"
  it: "@a@bⓕQuesto mondo meraviglioso è pieno della tua immagine.\nTre urrà per la mia cara principessa Veronica!ⓖ\n@c0@"
  ja: "@a@b世界は　モニカであふれている！\nモニカばんざい！\n@c0@"
"23":
  de: "@a@bAuf immer und ewig, in Liebe...\n㈡\nPS: Ich schicke dir dies Büchlein über die üblichen geheimen Kanäle nach Endor. Ich hoffe, es kommt heil bei dir an.ⓟ\n@c0@"
  en: "@a@bⓗYours, with love...\nP.S. I'll send this diary to Endor via the usual secret channels. I hope it reaches you.ⓘ\n@c0@"
  es: "@a@b''Siempre tuyo, con tiodo el amor...''\n㈡\n''P.D. Enviaré este diario a Endor, a traviés de los canales secrietos habituales. Espiero que lliegue a tus manos.''\n@c0@"
  fr: "@a@bAvec tout mon amour...\nP.S.ⓢ J'enverrai ce journal à Chandor par les voies secrètes habituelles. J'espère qu'il te parviendra.ⓦ\n@c0@"
  it: "@a@bⓕIl tuo amato...\nP.S. T'invierò questo diario a Endor tramite i soliti canali segreti. Spero che tu lo riceva senza problemi.ⓖ\n@c0@"
  ja: "@a@bこの日記は　いつもどおり\n秘密のルートで　エンドールへ\n送るからね。　　愛をこめて\n@c0@"
"24":
  de: "@a@bDa steht ein Buch namens ⓞFeste feiern im Kolosseumⓟ. %0%a00120 nimmt es aus dem Regal und liest.\n@c0@"
  en: "@a@bThere's a book entitled ⓗCelebrating the Colosseumⓘ. %0%a00120 takes it from the shelf and reads it.\n@c0@"
  es: "@a@bHay un libro titulado ''Halago del Coliseo''. %0%a00120 lo coge de la estantería y lo lee.\n@c0@"
  fr: "@a@bElles contiennent un livre intitulé ⓥCélébration du Coliséeⓦ. %0%a00120 le prend et le lit.\n@c0@"
  it: "@a@bC'è un libro dal titolo ⓕCelebrazione dell'Arenaⓖ. %0%a00120 lo prende e inizia a leggere...\n@c0@"
  ja: "@a@b「すばらしいコロシアム」と\n書かれた本がある。\n%a00120は　手にとって読んだ。\n@c0@"
"25":
  de: "@a@bⓞDas Kolosseum von Endor wurde von unserem derzeitigen König erbaut.\n@c0@"
  en: "@a@bⓗThe Colosseum of Endor was built by our present king.\n@c0@"
  es: "@a@b''El Coliseo de Endor fue construido por nuestro actual monarca.''\n@c0@"
  fr: "@a@bⓥLe Colisée de Chandor a été édifié par notre roi actuel.\n@c0@"
  it: "@a@bⓕL'Arena di Endor fu costruita dal nostro attuale re.ⓖ\n@c0@"
  ja: "@a@bわがエンドールのコロシアムは\n現在の王により　建てられました。\n@c0@"
"26":
  de: "@a@bEs ist weit und breit berühmt für die vielen vergnüglichen Veranstaltungen seiner Majestät, insbesondere das Turnier von Endor.\n@c0@"
  en: "@a@bⓗIt's become a great hit far and wide for the many fun events His Majesty conceives of, particularly the grand Endor Tourney.\n@c0@"
  es: "@a@b''Se ha convertido en parada obligada para visitantes de todos los rincones debido a los eventos que organiza el Rey, como el gran Torneo de Endor.''\n@c0@"
  fr: "@a@bSa renommée s'est étendue très loin grâce aux nombreux divertissements proposés par Sa Majesté, notamment le célèbre tournoi de Chandor.\n@c0@"
  it: "@a@bⓕGrazie ai numerosi eventi organizzati da sua Maestà, fra cui il grande Torneo di Endor, l'Arena è diventata famosa in tutto il mondo.ⓖ\n@c0@"
  ja: "@a@b武術大会をはじめ　さまざまな\n王の思いつきによる　催し物で\n国民の人気を　あつめています。\n@c0@"
"27":
  de: "@a@bSpannende Kämpfe, die den Zuschauern den Atem verschlagen, romantische Theaterstücke um Liebe und Herzschmerz...\n㈡\n... im Kolosseum von Endor gibt es für jeden etwas!ⓟ\n@c0@"
  en: "@a@bⓗBlood-curdling fights, plays filled with dreams and romance... It's all here at the Endor Colosseum!ⓘ\n@c0@"
  es: "@a@b''Combates espeluznantes, representaciones repletas de sueños y romanticismo... ¡El Coliseo de Endor lo tiene todo!''\n@c0@"
  fr: "@a@bDes combats à glacer le sang, des pièces pleines de rêve et de romance... Vous trouverez tout cela au Colisée de Chandorⓠⓦ\n@c0@"
  it: "@a@bⓕIntense battaglie, opere teatrali piene di sogni e romanticismo... Tutto questo, accade proprio qui nell'Arena di Endor!ⓖ\n@c0@"
  ja: "@a@b血わき　肉おどる　戦い！\n夢とロマンあふれる　お芝居！\n娯楽のすべては　コロシアムに！\n@c0@"
"28":
  de: "@a@bDa ist ein Kindermalbuch. Auf jeder Seite sind Bilder mit knuffigen Tieren.\n@c0@"
  en: "@a@bThere's a children's drawing book. Every page is filled with pictures of cute animals.\n@c0@"
  es: "@a@bHay un libro de dibujo para niños. Todas las páginas están repletas de imágenes de bonitos animales.\n@c0@"
  fr: "@a@bElles contiennent un livre de coloriages d'enfants.\nChaque page est couverte de jolis dessins d'animaux.\n@c0@"
  it: "@a@bC'è un libro illustrato per bambini... Su ogni pagina sono raffigurati tantissimi animaletti carini.\n@c0@"
  ja: "@a@b子供の　らくがき帳がある。\nどのページにも　かわいい動物の絵が\nいっぱい描かれている。\n@c0@"
"29":
  de: "@a@bDa ist ein Buch namens: ⓞSchauerliche wahre Begebenheytenⓟ. %0%a00120 nimmt es herunter und liest.\n@c0@"
  en: "@a@bThere's a book entitled ⓗThe Scariest True Stories Ever!ⓘ. %0%a00120 takes it from the shelf and reads it.\n@c0@"
  es: "@a@bHay un libro titulado ''¡Las historias reales más espeluznantes!''. %0%a00120 lo coge de la estantería y lo lee.\n@c0@"
  fr: "@a@bElles contiennent un livre intitulé ⓥLes plus Effrayantes Histoires vraiesⓠⓦ.\n%0%a00120 le prend et le lit.\n@c0@"
  it: "@a@bC'è un libro intitolato ⓕLe storie più spaventose di sempre!ⓖ. %0%a00120 lo prende dallo scaffale e inizia a leggere...\n@c0@"
  ja: "@a@b「本当にあった　おそろしい話」と\n書かれた本がある。\n%a00120は　手にとって読んだ。\n@c0@"
"30":
  de: "@a@bⓞIn dunkler Nacht irrte eyn Hausierer wohl durch den finstren Thann und stieß unversehens auf einen Weyler, welchen er zuvor noch nie gesehen.\n@c0@"
  en: "@a@bⓗOne dark night, a peddler found himself lost in the woods where he came upon a village he'd never seen before.\n@c0@"
  es: "@a@b''Una noche cerrada, un buhonero se perdió en el bosque y se topó con un pueblo que nunca antes había visto.''\n@c0@"
  fr: "@a@bⓥPar une nuit sombre, un marchand itinérant se perdit dans les bois. Il arriva finalement dans un village qu'il n'avait encore jamais vu.\n@c0@"
  it: "@a@bⓕIn una notte buia e tempestosa, un venditore ambulante si perse in una foresta e si ritrovò in un villaggio sconosciuto.ⓖ\n@c0@"
  ja: "@a@bある旅の商人が　行商の途中\n夜の森で　道に迷い\n見知らぬ村に　入りこみました。\n@c0@"
"31":
  de: "@a@bUnd es zeigeten sich die Eynwohner des Weylers gar zutraulich und gastlich.\n㈡\nUnd obzwar sie ihn nicht kannten, luden sie ihn dennoch eyn, bey ihnen zu nächthigen.\n@c0@"
  en: "@a@bⓗThe people of the village were exceptionally friendly and, although he was a perfect stranger to them, they invited him to stay.\n@c0@"
  es: "@a@b''Los habitantes del pueblo eran extraordinariamente amables y, aunque era un forastero, le invitaron a quedarse.''\n@c0@"
  fr: "@a@bLes habitants se montrèrent particulièrement amicaux et bien qu'il leur fût totalement étranger, ils l'invitèrent à rester chez eux.\n@c0@"
  it: "@a@bⓕGli abitanti del villaggio furono estremamente ospitali e, sebbene fosse un completo estraneo, lo invitarono a restare.ⓖ\n@c0@"
  ja: "@a@bその村の村人たちは　みな親切で\n赤の他人の商人をもてなし\n泊めてくれるとまで申し出ます。\n@c0@"
"32":
  de: "@a@bHöchlichst erleychterten Gemüths willigte der brave Handelsmann ein und verbrachte die Nacht bei ihnen im Weyler.\n@c0@"
  en: "@a@bⓗWith great relief, the peddler accepted their hospitality and spent the night there in the village.\n@c0@"
  es: "@a@b''Con gran alivio, el vendedor ambulante aceptó su hospitalidad y decidió pasar la noche en el pueblo.''\n@c0@"
  fr: "@a@bLe marchand accepta leur hospitalité avec un grand soulagement et passa donc la nuit au village.\n@c0@"
  it: "@a@bⓕL'ambulante, sollevato, accettò la loro ospitalità e trascorse lì la notte.ⓖ\n@c0@"
  ja: "@a@b困っていた商人は　その申し出を\nありがたく受けることにし\nその日は　村に泊まることにしました。\n@c0@"
"33":
  de: "@a@bAls aber der Morgen graute und der Hausierer aus dem Schlafe erwachte, erblickete er ringsumher nichts als Eynödnis und keine Spur des Weylers.ⓟ\n@c0@"
  en: "@a@bⓗThen morning came, and the peddler awoke to find nothing but wasteland. The village had disappeared without a trace.ⓘ\n@c0@"
  es: "@a@b''Al amanecer, el buhonero se despertó y lo único que encontró a su alrededor fue un páramo desierto. El pueblo había desaparecido sin dejar rastro.''\n@c0@"
  fr: "@a@bMais au petit matin, à son réveil, il ne trouva autour de lui qu'une étendue déserte. Le village avait disparu sans laisser de trace.ⓦ\n@c0@"
  it: "@a@bⓕAl suo risveglio, però, si ritrovò nel bel mezzo del deserto... Del villaggio non c'era più alcuna traccia!ⓖ\n@c0@"
  ja: "@a@bそして　次の日の朝……。\n目を覚ますと　そこは　ただの荒れ地。\n村は　跡形もなく消えていたそうです。\n@c0@"
"34":
  de: "@a@bOrdentlich nebeneinander aufgereiht stehen da verschiedene Sachbücher über das Reich und seine Geschichte.\n@c0@"
  en: "@a@bThere's a collection of history and imperial studies books neatly lined up.\n@c0@"
  es: "@a@bHay una colección de libros de Historia y de Estudios Imperiales perfectamente alineados.\n@c0@"
  fr: "@a@bSur celles-ci est soigneusement alignée toute une collection d'études historiques et impériales.\n@c0@"
  it: "@a@bUna raccolta ben ordinata di libri di storia sugli imperi del mondo.\n@c0@"
  ja: "@a@b帝王学の本や　歴史書などが\n整然と　ならべられている。\n@c0@"
"35":
  de: "@a@bDa steht ein Band mit dem Titel ⓞFanzeitschrift: Tänzerinnenⓟ. %0%a00120 nimmt ihn herunter und sieht ihn sich genauer an.\n@c0@"
  en: "@a@bThere's a volume entitled ⓗDancing Girl Fanzineⓘ. %0%a00120 takes it from the shelf and examines it more closely. \n@c0@"
  es: "@a@bHay un volumen titulado ''Revista de bailarinas''. %0%a00120 lo coge de la estantería y lo examina más atentamente. \n@c0@"
  fr: "@a@bElles contiennent un volume intitulé ⓥFanzine des danseusesⓦ. %0%a00120 le prend et le regarde de plus près.\n@c0@"
  it: "@a@bC'è un volume dal titolo ⓕRivista della ballerina provettaⓖ. %0%a00120 lo prende e inizia a sfogliarlo.\n@c0@"
  ja: "@a@b「踊り子　ファンブック」と\n書かれた本がある。\n%a00120は　手にとってみた。\n@c0@"
"36":
  de: "@a@bEs scheint sich um ein Buch über berühmte Tänzerinnen im Lauf der Jahrhunderte zu handeln.\n@c0@"
  en: "@a@bIt looks to be a publication about famous dancers through the ages.\n@c0@"
  es: "@a@bParece que se trata de una publicación sobre bailarinas famosas de todos los tiempos.\n@c0@"
  fr: "@a@bCela ressemble à un ouvrage sur les danseuses célèbres à travers les époques.\n@c0@"
  it: "@a@bSembra una pubblicazione sulle più famose ballerine di tutti i tempi.\n@c0@"
  ja: "@a@b歴代の　人気ダンサーを\n紹介する本のようだ。\n@c0@"
"37":
  de: "@a@bDie nächste Ausgabe soll einen Artikel mit dem verheißungsvollen Titel ⓞMaya ⓚⓛ Auf Tuchfühlung mit einem Superstarⓟ enthalten.\n@c0@"
  en: "@a@bThe next edition promises the intriguing article, ⓗMaya: Up Close and Personal with a Superstar!ⓘ.\n@c0@"
  es: "@a@bPara la siguiente edición se anuncia un interesante artículo, ''Maya, entrevista personal con una superestrella''.\n@c0@"
  fr: "@a@bL'édition à suivre promet un article intéressant, ⓥMayaⓢ rencontre personnelle et confidentielle avec une superstarⓠⓦ.\n@c0@"
  it: "@a@bL'edizione successiva promette un articolo intrigante: ⓕIncontro con la superstar Maya!ⓖ.\n@c0@"
  ja: "@a@b次号特集に　スーパーアイドル\nマーニャちゃんのすべて！\nという記事が　予定されている……。\n@c0@"
"38":
  de: "@a@bDa steht ein Buch mit dem Titel ⓞKreaturen unserer Weltⓟ.\n%0%a00120 nimmt es herunter und liest es.\n@c0@"
  en: "@a@bThere's a book entitled ⓗCreatures of Our Worldⓘ.\n%0%a00120 takes it from the shelf and reads it.\n@c0@"
  es: "@a@bHay un libro titulado ''Criaturas de nuestro mundo''.\n%0%a00120 lo coge de la estantería y lo lee.\n@c0@"
  fr: "@a@bElles contiennent un livre intitulé ⓥCréatures de notre mondeⓦ.\n%0%a00120 le prend et le lit.\n@c0@"
  it: "@a@bC'è un libro dal titolo ⓕCreature del nostro mondoⓖ.\n%0%a00120 lo prende dallo scaffale e inizia a leggere...\n@c0@"
  ja: "@a@b「この世界に　生きる命」と\n書かれた本がある。\n%a00120は　手にとって読んだ。\n@c0@"
"39":
  de: "@a@bⓞAuf dieser Welt gibt es nicht nur uns Menschen ⓚⓛ nein, hier leben ganz unterschiedliche Lebewesen.\n@c0@"
  en: "@a@bⓗThe world we live in is full of all sorts of creatures, not just us humans.\n@c0@"
  es: "@a@b''El mundo en el que vivimos está repleto de todo tipo de criaturas, no estamos nosotros, los humanos, solos.''\n@c0@"
  fr: "@a@bⓥLe monde dans lequel nous vivons est rempli de créatures de toutes sortes, et pas seulement d'humains, comme nous.\n@c0@"
  it: "@a@bⓕIl mondo in cui viviamo è pieno di creature di ogni tipo. Noi umani non siamo gli unici abitanti di queste terre.ⓖ\n@c0@"
  ja: "@a@bこの世界には　私たち人間だけでなく\nさまざまな命が　ともに\n生活をしています。\n@c0@"
"40":
  de: "@a@bManche sind uns nicht besonders zugetan, andere wiederum wollen uns im Grunde nichts Böses.\n@c0@"
  en: "@a@bⓗSome of them don't seem at all inclined to get along with us, but there are plenty of others who basically mean us no harm.\n@c0@"
  es: "@a@b''Algunas de estas criaturas no parecen dispuestas a convivir con nosotros, pero existen muchas otras que son pacíficas.''\n@c0@"
  fr: "@a@bCertaines d'entre elles ne semblent pas bien disposées du tout à notre égard, mais beaucoup d'autres ne nous veulent généralement aucun mal.\n@c0@"
  it: "@a@bⓕAlcune di esse ci sono decisamente ostili, ma ce ne sono tantissime altre che non sono affatto pericolose.ⓖ\n@c0@"
  ja: "@a@b中には　人間とわかりあえない\n種族もいますが　本来は仲良くすべき\n種族も　数多くいるのです。\n@c0@"
"41":
  de: "@a@bSo Ihr denn also einen Zwerg oder eine Elfe auf Euren Reisen seht, so gebt Acht, dass Ihr ihnen kein Leid antut.ⓟ\n@c0@"
  en: "@a@bⓗSo if you happen upon a dwarf or an elf on your travels, be sure not to do them a mischief.ⓘ\n@c0@"
  es: "@a@b''Por ello, si en uno de tus viajes te encuentras con un enano o un elfo, no le hagas daño.''\n@c0@"
  fr: "@a@bAinsi, si vous croisez un nain ou un elfe au cours de vos voyages, ne leur causez surtout aucun tort.ⓦ\n@c0@"
  it: "@a@bⓕSe durante i suoi viaggi un esploratore incontrasse un elfo o un nano, non dovrebbe avere un atteggiamento aggressivo nei suoi confronti.ⓖ\n@c0@"
  ja: "@a@bもしも　ホビットやエルフなどを\nどこかで見かけたら　絶対に\nいじめたりしてはいけません。\n@c0@"
"42":
  de: "@a@bDa steht ein Buch mit dem Titel ⓞGesänge unter Tage ⓚⓛ Bergarbeiterweisen im Wandel der Zeitenⓟ. %0%a00120 nimmt es und liest.\n@c0@"
  en: "@a@bThere's a book entitled ⓗMining Songs: The Full Lyric Collectionⓘ. %0%a00120 takes it from the shelf and reads. \n@c0@"
  es: "@a@bHay un libro titulado ''Canciones de las minas: colección de letras completas''. %0%a00120 lo coge de la estantería y lo lee. \n@c0@"
  fr: "@a@bElles contiennent un livre intitulé ⓥChansons de mineursⓢ la Collection musicale complèteⓦ. %0%a00120 le prend et le lit.\n@c0@"
  it: "@a@bC'è un libro intitolato ⓕCanzoni della miniera: il paroliere completoⓖ. %0%a00120 lo prende dallo scaffale e inizia a leggere...\n@c0@"
  ja: "@a@b「鉱山の男の歌　歌詞全集」と\n書かれた本がある。\n%a00120は　手にとって読んだ。\n@c0@"
"43":
  de: "@a@bⓞWir schippen, schippen, schippen! Ⓠ\nWas soll uns öder Sonnenschein? Ⓠ\n㈡\nWir schippen, schippen, schippen! Ⓠ\nUnter Tage woll'n wir sein! Ⓠⓟ\n@c0@"
  en: "@a@bⓗWe dig, we dig, and then we dig some more Ⓠ\nWe really dig our diggin' Ⓠ\nOh yeah, that's for sure Ⓡⓘ\n@c0@"
  es: "@a@b''Soy minero, Ⓠ\ny templé mi corazón, Ⓠ\ncon pico y barreeeena Ⓡ''\n@c0@"
  fr: "@a@bⓥEt on creuse, creuse, creuse, Ⓠ\n Et on creuse toujours, Ⓠ\n Un peu plus profond chaque jour. Ⓡⓦ\n@c0@"
  it: "@a@bⓕScaviam, scaviam, scaviam Ⓠ\nIn miniera noi scendiaaam! Ⓠ\n㈡\nScaviam, scaviam, scaviam,\nPoi in alto risaliaaam! Ⓡⓖ\n@c0@"
  ja: "@a@bオレたちゃ掘るぜ♪\nどこまでも　掘るぜ♪\n掘って～掘って～掘りぬいて～♪\n@c0@"
"44":
  de: "@a@bAber %a00120 kennt die Melodie nicht und kann darum nicht einstimmen.\n@c0@"
  en: "@a@bBut %a00120 doesn't know how the tune goes, so %A120%Xhe%Z%B120%Xshe%Z%C120%X%Z can't sing along.\n@c0@"
  es: "@a@bPero %a00120 desconoce la melodía, por lo que no puede cantarla.\n@c0@"
  fr: "@a@bMais %a00120 ne connaît pas l'air de la chanson et ne peut pas la chanter.\n@c0@"
  it: "@a@bMa %a00120 non conosce la melodia, quindi non può cantare.\n@c0@"
  ja: "@a@b……しかし　メロディーが\nわからないので　%a00120には\n歌えなかった。\n@c0@"
"45":
  de: "@a@bDa sind jede Menge Seekarten. Sie haben alle Eselsohren, als wären sie viel benutzt worden.\n@c0@"
  en: "@a@bThere are lots of nautical charts.\nThe corners of them are bent and creased as if they've been very well-used.\n@c0@"
  es: "@a@bHay multitud de cartas náuticas.\nLas esquinas están dobladas y desgastadas, seguramente debido al uso.\n@c0@"
  fr: "@a@bElles contiennent de nombreuses cartes marines.\nLeurs coins sont cornés et abîmés, comme si elles avaient beaucoup servi.\n@c0@"
  it: "@a@bQui ci sono molte carte nautiche...\nHanno gli angoli piegati e consumati, come se fossero state consultate parecchie volte...\n@c0@"
  ja: "@a@bたくさんの　海図がある。\nよく使い込まれていて\n本の角が　ボロボロになっている。\n@c0@"
"46":
  de: "@a@bDa ist ein Buch mit dem Titel ⓞMit Frohsinn durchs Leben ⓚⓛ schlechte Laune war gesternⓟ. %0%a00120 nimmt es und liest.\n@c0@"
  en: "@a@bThere's a book entitled ⓗA Pun-Filled Life is a Fun-Filled Life!ⓘ. %0%a00120 takes it from the shelf and reads it.\n@c0@"
  es: "@a@bHay un libro titulado ''Una vida con juegos de palabras, palabra que da juego''. %0%a00120 lo coge de la estantería y lo lee.\n@c0@"
  fr: "@a@bElles contiennent un livre intitulé ⓥUne Vie de jeux de motsⓠⓦ. %0%a00120 le prend et le parcourt.\n@c0@"
  it: "@a@bC'è un libro dal titolo ⓕDivertiti con i giochi di parole!ⓖ. %0%a00120 lo prende dallo scaffale e inizia a leggere...\n@c0@"
  ja: "@a@b「だじゃれで　ハッピーライフ」と\n書かれた本がある。\n%a00120は　手にとって読んだ。\n@c0@"
"47":
  de: "@a@bⓞBringt dein Anblick Kinder zum Flennen\nUnd die Nachbarn dazu wegzurennen,\n@c0@"
  en: "@a@bⓗHey! The secret to health, happiness, a successful marriage and a booming business is simple. All you need is puns!\n@c0@"
  es: "@a@b''¡Eh! El secreto de la salud, la felicidad, un matrimonio duradero y un negocio próspero es muy sencillo. ¡Solo se necesitan juegos de palabras!''\n@c0@"
  fr: "@a@bⓥSalutⓠ Le secret de la santé, du bonheur, de l'amour et des affaires est simple.\nTout ce qu'il vous faut, ce sont des jeux de motsⓠ\n@c0@"
  it: "@a@bⓕEhilà! Il segreto per essere felici, in buona salute e avere successo negli affari e nel matrimonio è uno solo: i giochi di parole!ⓖ\n@c0@"
  ja: "@a@b健康のひけつ　幸福のひけつ\n夫婦円満　商売はんじょう\nすべての源は　だじゃれにあり。\n@c0@"
"48":
  de: "@a@bReagier schnell wie der Blitz:\nUnd erzähl gleich 'nen Witz!\n@c0@"
  en: "@a@bⓗNo more trotting out boring old\nⓕGood morningⓖ and ⓕGoodnightⓖ.\n㈡\nⓗWhen you greet people, do it with a\nsmile and a bit of horseplay. Try a ⓕGood mareningⓖ or a ⓕGoodneightⓖ!\n@c0@"
  es: "@a@b''Basta de pasearse con los consabidos y aburridos\nⓗBuenos díasⓘ y ⓗBuenas nochesⓘ.''\n㈡\n''Cuando saludes a alguien, hazlo con una sonrisa y una pizca de alegría. ¡Prueba con ⓗBuenas tíasⓘ o con ⓗBuenos cochesⓘ!''\n@c0@"
  fr: "@a@bFini de débiter l'éternelⓢ\n ⓗAu revoir et merciⓘ.\n㈡\nLorsque vous saluez quelqu'un, faites-le avec le sourire et un calembour. Essayez un ⓗArmoire et persilⓘⓠ\n@c0@"
  it: "@a@bⓕBasta con le solite frasi fredde e convenzionali! Svecchiate la vostra conversazione!ⓖ\n㈡\nⓕSe incontri un drago, salutalo chiedendogli se ha da accendere, e se ti imbatti in un Killer Skorpion digli che le sue battute sono davvero... pungenti!ⓖ\n@c0@"
  ja: "@a@bおはようのかわりに\nおやすみのかわりに\nナイスなだじゃれで　明るい笑いを。\n@c0@"
"49":
  de: "@a@bUnd schon will jeder dich kennen!ⓟ\n@c0@"
  en: "@a@bⓗBefore long, you'll be the most popular punner in town, neigh, the world!\n㈡\nⓗRemember: you'll be galloping your way towards happiness with laughter as your steed.ⓘ\n@c0@"
  es: "@a@b''Antes de que te des cuenta, serás famoso por tus juegos de palabras, el más gracioso de la ciudad, qué digo, ¡del planeta!''\n㈡\n''Recuerda: ábrete paso en el mundo a carcajada limpia.''\n@c0@"
  fr: "@a@bTrès vite, vous ferez les meilleurs jeux de mots de la ville, que dis-je, du mondeⓠ\n㈡\nSouvenez-vousⓢ vous filerez vers le bonheur avec le rire pour monture.ⓦ\n@c0@"
  it: "@a@bⓕIn men che non si dica, diventerai la persona più simpatica del villaggio, anzi, del mondo intero!ⓖ\n㈡\nⓕRicorda che la felicità è a portata di battuta... Basta scegliere le parole giuste!ⓖ\n@c0@"
  ja: "@a@bめざせ　町の人気者！\n笑う門には　福きたる。\n@c0@"
"50":
  de: "@a@bDa ist ein Buch mit dem Titel ⓞHundert Ideen, wie man ein Sparschwein mästetⓟ. %0%a00120 nimmt es herunter und liest.\n@c0@"
  en: "@a@bThere's a book entitled ⓗOne Hundred Handy Hints to a Healthy Piggy Bankⓘ. %0%a00120 takes it from the shelf and reads it.\n@c0@"
  es: "@a@bHay un libro titulado ''Cien consejos útiles para tener la hucha llena''. %0%a00120 lo toma de la estantería y lo lee.\n@c0@"
  fr: "@a@bElles contiennent un livre intitulé ⓥCent Astuces pratiques pour remplir votre tirelireⓦ.\n%0%a00120 le prend et le lit.\n@c0@"
  it: "@a@bC'è un libro dal titolo ⓕCento modi per avere un succoso conto in bancaⓖ. %0%a00120 lo prende dallo scaffale e inizia a leggere con interesse...\n@c0@"
  ja: "@a@b「お金をためる１００のコツ」と\n書かれた本がある。\n%a00120は　手にとって読んだ。\n@c0@"
"51":
  de: "@a@bⓞSchaut beim Gehen auf die Straße. Wenn Ihr Geld seht, hebt es auf und steckt es ein. Verkauft Fundgegenstände zurück an die Läden.\n@c0@"
  en: "@a@bⓗTry to look down when you're out walking. If you spot some money, put it in your pocket. Sell any lost property you find back to the shops.\n@c0@"
  es: "@a@b''Intenta mirar al suelo cuando salgas a caminar. Si encuentras dinero, métetelo en el bolsillo. Vende en las tiendas todos los objetos perdidos que encuentres.''\n@c0@"
  fr: "@a@bⓥLorsque vous marchez, regardez par terre. Si vous trouvez une pièce, empochez-la. Revendez en magasin tous les objets perdus que vous trouvez.\n@c0@"
  it: "@a@bⓕQuando cammini, guarda sempre in basso: se vedi dei soldi, prendili e mettiteli in tasca. Rivendi tutti gli oggetti smarriti che trovi.ⓖ\n@c0@"
  ja: "@a@b道を歩くときは　うつむいて歩け。\nお金が落ちていたら　ポケットへ。\n落し物は　お店に売ろう。\n@c0@"
"52":
  de: "@a@bVerleiht nichts! Wer Geld verleiht, kann es auch gleich verschenken. Weg ist weg! Wenn schon, dann leiht höchstens Ihr Euch von anderen.\n@c0@"
  en: "@a@bⓗNever lend money to other people. Money lent is money spent. You'll never get it back. You should be the one doing the borrowing.\n@c0@"
  es: "@a@b''Nunca prestes dinero a otras personas. Ya se sabe que ⓗAl fiar lo asesinó el mal pagarⓘ. Nunca lo recuperarás. Intenta ser tú el que pide prestado.''\n@c0@"
  fr: "@a@bNe prêtez jamais d'argent aux autres. De l'argent prêté est de l'argent gâché. Vous ne le récupérerez jamais. L'emprunteur, c'est vous.\n@c0@"
  it: "@a@bⓕNon prestare mai soldi a nessuno. I soldi prestati sono soldi scordati! Cerca, invece, di farti dare denaro da parenti, amici, conoscenti ed estranei.ⓖ\n@c0@"
  ja: "@a@b絶対に　人にお金を貸すな。\n貸した金は　まず返ってこない。\nそれくらいなら　逆に借りよう。\n@c0@"
"53":
  de: "@a@bDrückt den Preis, so weit es nur geht! Und keine Angst vor Tränen oder Wutausbrüchen des Ladenbesitzers! Was geht das Euch an?\n㈡\nHauptsache, Ihr zahlt nur die Hälfte!ⓟ\n@c0@"
  en: "@a@bⓗBarter as much as you can when shopping. Reduce the shopkeeper to tears or tantrums if you must.\n㈡\nⓗAnything to get your item at half price.ⓘ\n@c0@"
  es: "@a@b''Cuando compres algo, regatea todo lo que puedas. Si es necesario, consigue que el vendedor llore o tenga un berrinche.''\n㈡\n''Lo que sea para conseguir tu compra a mitad de precio.''\n@c0@"
  fr: "@a@bNégociez autant que vous pouvez lorsque vous faites des achats. Poussez le vendeur à bout s'il le faut.\n㈡\nTout est bon pour obtenir votre objet à moitié prix.ⓦ\n@c0@"
  it: "@a@bⓕQuando compri qualcosa, mercanteggia a più non posso. Il commesso va ridotto in lacrime o all'esaurimento nervoso, se necessario.ⓖ\n㈡\nⓕOgni mezzo è valido per ottenere un forte sconto!ⓖ\n@c0@"
  ja: "@a@b買い物は　なるべく　ねぎろう。\n店主が泣いても　怒っても\n値段の半額まで　あきらめるな。\n@c0@"
"54":
  de: "@a@bDa ist ein Buch mit dem Titel ⓞAuf der Suche nach dem Zauberstab: Band Einsⓟ. %0%a00120 nimmt es und liest.\n@c0@"
  en: "@a@bThere's a book entitled ⓗMy Quest for the Magical Staff: Chapter Oneⓘ. %0%a00120 takes it from the shelf and reads it. \n@c0@"
  es: "@a@bHay un libro titulado ''Mi búsqueda del báculo mágico: capítulo uno''. %0%a00120 lo coge de la estantería y lo lee. \n@c0@"
  fr: "@a@bElles contiennent un livre intitulé ⓥMa Quête du bâton magiqueⓢ Chapitre unⓦ.\n%0%a00120 le prend et le parcourt. \n@c0@"
  it: "@a@bC'è un libro intitolato ⓕLa mi' ricerca del Bastone magiho: Capitolo Unoⓖ. %0%a00120 lo prende dallo scaffale e inizia a leggere...\n@c0@"
  ja: "@a@b「魔法の杖をもとめて　第１章」と\n書かれた　古い本がある。\n%a00120は　手にとって読んだ。\n@c0@"
"55":
  de: "@a@bⓞIch heiße Samuel. Man nennt mich Samuel den Stabsammler. Ich bin ein Magier aus Lakanaba.\n@c0@"
  en: "@a@bⓗMy name is Rowand.\nPeople call me Rowand the Wandering Wandsman.\nI'm a magician from Lakanaba.\n@c0@"
  es: "@a@b''Mi nombre es Tristón.\nLa gente me llama Tristón Buscavaritas.\nSoy mago y vengo de Lakanaba.''\n@c0@"
  fr: "@a@bⓥJe m'appelle Siméon.\nLes gens me surnomment Siméon le Chercheur de bâtons. Je suis un magicien de Lakanaba.\n@c0@"
  it: "@a@bⓕIl mi' nome è Chercus, ma tutti\nmi chiamano Chercus il cercatore cerchiato.\nSono un mago e vengo da Lacanata.ⓖ\n@c0@"
  ja: "@a@bわが名は　マドルエ。\nレイクナバ出身の魔法使いである。\n@c0@"
"56":
  de: "@a@bAber jetzt lebe ich natürlich nicht mehr dort. Ich bin von zu Hause fortgegangen und diene jetzt der königlichen Familie von Samokswa.\n@c0@"
  en: "@a@bⓗNot that I live there any more, of course.\nNo, I left my hometown some time ago.\nI serve the royal family of Zamoksva nowadays.\n@c0@"
  es: "@a@b''No es que viva allí, evidentemente.\nNo, dejé mi ciudad natal hace tiempo.\nAhora sirvo a la familia real de Zamoksva.''\n@c0@"
  fr: "@a@bMais je ne vis plus là-bas.\nNon, j'ai quitté ma ville natale il y a un certain temps. Désormais, je sers la famille royale de Zamoksva.\n@c0@"
  it: "@a@bⓕAdesso 'unn abito più lì.\nHo lasciato il mi' villaggio natale un po' di tempo fa, e ora sono al servizio della famiglia reale di Zamoskva.ⓖ\n@c0@"
  ja: "@a@bとはいえ　今は\n寄る辺なき　故郷を捨て\nサントハイム王家に　仕えている。\n@c0@"
"57":
  de: "@a@bDiese Aufzeichnung enthält meine privaten Erinnerungen an meine Suche nach einem magischen Stab, den zu finden der Zar mir aufgetragen hat.\n@c0@"
  en: "@a@bⓗThese memoirs are a personal account of my hunt for a magical staff, something I've been ordered to find by the Tsar.\n@c0@"
  es: "@a@b''Estas memorias constituyen el relato personal de mi búsqueda de un báculo mágico, empresa encomendada por el Zar.''\n@c0@"
  fr: "@a@bCes mémoires sont le récit personnel de ma quête. La quête d'un bâton magique, que le tsar m'a donné l'ordre de trouver.\n@c0@"
  it: "@a@bⓕHuesto è il mi' racconto sulla ricerca del bastone magiho, che lo Zar m'ha ordinato di rintraccia'.ⓖ\n@c0@"
  ja: "@a@bこの手記は　サントハイム王の命令で\n魔法の杖を　捜し求め　旅をする\n私の個人的な記録である。\n@c0@"
"58":
  de: "@a@bJa, eigentlich sind meine Erinnerungen sogar so privater Natur, dass sie niemand aus Samokswa je zu Gesicht bekommen darf.ⓟ\n@c0@"
  en: "@a@bⓗIn fact, this is such a personal account of my experiences that I must be careful not to let anyone from Zamoksva lay eyes upon it.ⓘ\n@c0@"
  es: "@a@b''En realidad, es un relato tan personal de mis experiencias que debo impedir que llegue a manos de nadie de Zamoksva.''\n@c0@"
  fr: "@a@bEn réalité, ce récit de mes expériences est tellement personnel que je dois faire attention à ce que personne de Zamoksva ne le lise.ⓦ\n@c0@"
  it: "@a@bⓕIn huesto mio diario fò delle honsiderazioni tanto personali che devo sta' attento che nessun abitante di Zamoskva lo legga.ⓖ\n@c0@"
  ja: "@a@b……で　あまりに個人的であるため\n特に　サントハイム関係者には\n知られないよう　気をつけようと思う。\n@c0@"
"59":
  de: "@a@bDa ist ein Buch mit dem Titel ⓞAuf der Suche nach dem Zauberstab: Band Zweiⓟ. %0%a00120 nimmt es und liest.\n@c0@"
  en: "@a@bThere's a book entitled ⓗMy Quest for the Magical Staff: Chapter Twoⓘ. %0%a00120 takes it from the shelf and reads it. \n@c0@"
  es: "@a@bHay un libro titulado ''Mi búsqueda del báculo mágico: capítulo dos''. %0%a00120 lo coge de la estantería y lo lee. \n@c0@"
  fr: "@a@bElles contiennent un livre intitulé ⓥMa Quête du bâton magiqueⓢ Chapitre deuxⓦ.\n%0%a00120 le prend et le parcourt. \n@c0@"
  it: "@a@bC'è un libro intitolato ⓕLa mi' ricerca del Bastone magiho: Capitolo Dueⓖ. %0%a00120 lo prende dallo scaffale e inizia a leggere... \n@c0@"
  ja: "@a@b「魔法の杖をもとめて　第２章」と\n書かれた　古い本がある。\n%a00120は　手にとって読んだ。\n@c0@"
"60":
  de: "@a@bⓞIch heiße Samuel der Stabsammler. Auf Befehl des Zaren von Samokswa reise ich durch die Welt und suche nach einem magischen Stab.\n@c0@"
  en: "@a@bⓗI am Rowand the Wandering Wandsman. By the Tsar of Zamoksva's orders, I'm travelling the world in search of a magical staff.\n@c0@"
  es: "@a@b''Me llamo Tristón Buscavaritas. Por orden del Zar de Zamoksva, recorro el mundo en busca de un báculo mágico.''\n@c0@"
  fr: "@a@bⓥJe suis Siméon le Chercheur de bâtons. Sur ordre du tsar de Zamoksva, je parcours le monde à la recherche d'un bâton magique.\n@c0@"
  it: "@a@bⓕIl mi' nome è Chercus il cercatore cerchiato. Giro pe' i'mmondo per ordine dello zar di Zamoskva, alla ricerca d'un bastone magiho.ⓖ\n@c0@"
  ja: "@a@b私は　魔法使いマドルエ。\n主君サントハイム王の命令で\n世界中の　魔法の杖を探している。\n@c0@"
"61":
  de: "@a@bUnd warum tue ich das wohl, fragt sich der geneigte Leser. Nun, ganz einfach: Weil der Zar ganz erpicht darauf zu sein scheint.\n@c0@"
  en: "@a@bⓗYou may well ask why I'm doing such a thing.\nThe short answer is that it seems to be a favourite hobby of the Tsar's.\n@c0@"
  es: "@a@b''Seguramente te preguntes por qué me dedico a tal cosa. Para abreviar, digamos que parece tratarse de uno de los pasatiempos favoritos del Zar.''\n@c0@"
  fr: "@a@bVous vous demandez sans doute pourquoi je fais cela. Pour faire court, cela semble être le loisir favori du tsar.\n@c0@"
  it: "@a@bⓕTi chiederai forse perché io faccia una hosa simile. Per farla breve, pare che questa sia una vera fissazione per lo zar.ⓖ\n@c0@"
  ja: "@a@bそもそも　なぜ\nそんなことをしているかというと\nこれがもう　王の道楽だからである。\n@c0@"
"62":
  de: "@a@bNatürlich ist daran nichts Schlimmes.\n㈡\nEs bereitet mir nur etwas Sorge, dass ein Staatsman sich mit derart trivialen Dingen beschäftigt, Friedenszeiten hin oder her.\n@c0@"
  en: "@a@bⓗI don't mean to badmouth him, of course.\nI just can't help worrying that a leader is so absorbed in such frivolity, peacetime or not.\n@c0@"
  es: "@a@b''No se trata de una crítica, evidentemente.\nPero me preocupa un poco que un dirigente se centre en tales frivolidades, corran tiempos de paz o no.''\n@c0@"
  fr: "@a@bJe n'ai évidemment pas l'intention de dire du mal de lui. Mais je ne peux m'empêcher de m'inquiéter qu'un dirigeant soit si absorbé par de telles futilités.\n㈡\nEt cela, que l'on soit ou non en temps de paix.\n@c0@"
  it: "@a@bⓕPer carità, 'un voglio miha parla' male di lui! Solo che 'un riesco a capi' come un sovrano tanto 'mportante possa preoccuparsi d'una hosa hosì frivola!ⓖ\n@c0@"
  ja: "@a@b主君のことを　悪く言いたくはないが\n平和な時代とは言え　王たる者が\nシュミに没頭するのは　どうかと思う。\n@c0@"
"63":
  de: "@a@bAber es geziemt sich nicht für mich, das zu hinterfragen.\n㈡\nPflicht ist Pflicht, und meine führt mich, einem Hinweis folgend, von meiner Heimatstadt aus in Richtung Westen.\n@c0@"
  en: "@a@bⓗBut it isn't my place to question him.\nDuty is duty, and now I must travel west of my hometown to follow up a possible lead.\n@c0@"
  es: "@a@b''Claro, que no soy el más indicado para cuestionarlo. El deber es el deber y ahora debo partir hacia el oeste de mi hogar para seguir una posible pista.''\n@c0@"
  fr: "@a@bMais mon rôle n'est pas de le juger. Le devoir reste le devoir et je dois à présent voyager à l'ouest de ma ville natale pour suivre une piste éventuelle.\n@c0@"
  it: "@a@bⓕMa 'unn è mi' hompito mette' 'ndubbio i su' ordini. Il dovere è dovere, e ora mi dirigerò a ovest, al mi' villaggio natale, per segui' un possibile indizio.ⓖ\n@c0@"
  ja: "@a@b……とグチはこれくらいにして　仕事だ。\n魔法の杖のウワサを　聞きつけて\nわが故郷の西の町に　行くことになった。\n@c0@"
"64":
  de: "@a@bBisher war meine Suche wenig erfolgreich. Ich kann nur hoffen, dass meiner Suche nach dem magischen Stab dieses Mal Erfolg beschieden sein wird.ⓟ\n@c0@"
  en: "@a@bⓗIt's been a fruitless search so far.\nI can only hope that this time I'll find the magical staff I've been charged with locating.ⓘ\n@c0@"
  es: "@a@b''Hasta ahora, ha sido una búsqueda infructuosa.\nEspero que en esta ocasión pueda encontrar el báculo mágico, la misión que me han encomendado.''\n@c0@"
  fr: "@a@bJusqu'à présent, ma quête s'est révélée vaine. J'espère seulement que cette fois, je localiserai le bâton magique que je suis chargé de trouver.ⓦ\n@c0@"
  it: "@a@bⓕFinora la ricerca l'è stata 'nfruttuosa.\nSpero solo che questa volta troverò il bastone magiho, che m'è stato ordinato di individua'.ⓖ\n@c0@"
  ja: "@a@b今まで　さんざん　ムダ骨をおった。\n今度こそ　本当に　魔法の杖が\n見つかればよいのだが……。\n@c0@"
"65":
  de: "@a@bDa ist ein brandneues Schiffslogbuch, noch ganz ohne Einträge.\n@c0@"
  en: "@a@bThere's a brand new ship's logbook that hasn't been written in yet.\n@c0@"
  es: "@a@bHay un cuaderno de bitácora totalmente nuevo en el que nadie ha escrito nada todavía.\n@c0@"
  fr: "@a@bElles contiennent un journal de bord flambant neuf, encore vierge.\n@c0@"
  it: "@a@bC'è un diario di bordo nuovo di zecca.\n@c0@"
  ja: "@a@bまだ使われていない\n新品の　航海日誌がある。\n@c0@"
"66":
  de: "@a@bDa ist ein Buch mit dem Titel ⓞAuf der Suche nach dem Zauberstab: Band Dreiⓟ. %0%a00120 nimmt es und liest.\n@c0@"
  en: "@a@bThere's a book entitled ⓗMy Quest for the Magical Staff: Chapter Threeⓘ. %0%a00120 takes it from the shelf and reads it. \n@c0@"
  es: "@a@bHay un libro titulado ''Mi búsqueda del báculo mágico: capítulo tres''. %0%a00120 lo toma de la estantería y lo lee. \n@c0@"
  fr: "@a@bElles contiennent un livre intitulé ⓥMa Quête du bâton magiqueⓢ Chapitre troisⓦ.\n%0%a00120 le prend et le parcourt. \n@c0@"
  it: "@a@bC'è un libro dal titolo ⓕLa mi' ricerca del Bastone magiho: Capitolo Treⓖ. %0%a00120 lo prende dallo scaffale e inizia a leggere...\n@c0@"
  ja: "@a@b「魔法の杖をもとめて　第３章」と\n書かれた　古い本がある。\n%a00120は　手にとって読んだ。\n@c0@"
"67":
  de: "@a@bⓞIch bin Samuel der Stabsammler. Ich bin jetzt in einer Stadt, in der es eine Verbindung zu dem Stab geben soll, den ich suche.\n@c0@"
  en: "@a@bⓗI am Rowand the Wandering Wandsman.\nI now find myself in a town rumoured to have links to the magical staff I'm searching for.\n@c0@"
  es: "@a@b''Me llamo Tristón Buscavaritas.\nMe encuentro en una ciudad que, según se rumorea, está vinculada con el báculo mágico que busco.''\n@c0@"
  fr: "@a@bⓥJe suis Siméon le Chercheur de bâtons.\n Je me trouve actuellement dans une ville qui pourrait être liée au bâton magique que je recherche.\n@c0@"
  it: "@a@bⓕIl mi' nome è Chercus il cercatore cerchiato. Ora mi trovo in un villaggio che, a quanto pare, ha qualcosa a che fa' col bastone magiho che sto cercando.ⓖ\n@c0@"
  ja: "@a@b私は魔法使いマドルエ。\n魔法の杖を探して　ウワサの町まで\nやってきたところである。\n@c0@"
"68":
  de: "@a@bSofort nach meiner Ankunft habe ich begonnen, die Leute hier zu befragen, aber meine Reise ist leider noch nicht zu Ende.\n@c0@"
  en: "@a@bⓗI asked around the moment I arrived to see if the townsfolk knew where I could find it. Unfortunately my journey isn't over yet.\n@c0@"
  es: "@a@b''Cuando llegué, pregunté a los lugareños si sabían dónde podría encontrarlo. Por desgracia, mi viaje todavía no puede darse por finalizado.''\n@c0@"
  fr: "@a@bDès mon arrivée, j'ai demandé aux habitant s'ils savaient où je pourrais le trouver. Malheureusement, mon voyage n'est pas encore fini.\n@c0@"
  it: "@a@bⓕQuando sono arrivato ho fatto hualche domanda 'ngiro pe' sape' se gli abitanti de i'pposto sapevano dove si trovasse.ⓖ\n㈡\nⓕPurtroppo sembra che il mi' viaggio 'un sia ancora giunto al termine.ⓖ\n@c0@"
  ja: "@a@bさっそく　聞きこみをしてみたが\nどうやら　今回こそは\n私の苦労も　むくわれそうだ。\n@c0@"
"69":
  de: "@a@bDas Ziel meiner Wünsche ist wohl doch nicht hier in der Stadt. Nein, es befindet sich offenbar in einer Höhle in der Nähe.\n@c0@"
  en: "@a@bⓗIt seems that the object of my quest isn't here in town after all. No, apparently it's hidden in a cave nearby.\n@c0@"
  es: "@a@b''Parece que, después de todo, el objeto de mi periplo no se encuentra en esta ciudad. No, parece que está oculto en una cueva cercana.''\n@c0@"
  fr: "@a@bIl semble que finalement, l'objet de ma quête ne se trouve pas ici, en ville. Non, il serait caché dans une grotte des alentours.\n@c0@"
  it: "@a@bⓕPare che l'oggetto della mi' ricerca non si trovi affatto 'nquesto villaggio, ma che sia nascosto in una grotta vicina.ⓖ\n@c0@"
  ja: "@a@b探し求める　魔法の杖は\nこの町にこそ　なかったものの\n町の近くの洞くつに　あるらしい。\n@c0@"
"70":
  de: "@a@bAlso wirklich! Wer kommt denn bloß auf die alberne Idee, so wertvolle Dinge ausgerechnet in einer Höhle verwahren zu wollen?!\n@c0@"
  en: "@a@bⓗI ask you! Whatever is the world coming to? Whyever do people insist on hiding such precious things in caves of all places!?\n@c0@"
  es: "@a@b''¡Y yo os pregunto! ¿Adónde iremos a parar? ¿Por qué insiste la gente en ocultar tesoros así en sitios como cuevas?''\n@c0@"
  fr: "@a@bFranchementⓠ Où va le mondeⓡ Pourquoi les gens tiennent-ils absolument à cacher des objets aussi précieux dans des grottesⓠⓑ\n@c0@"
  it: "@a@bⓕMa io mi domando e diho: perché mai la gente continua a nasconde' oggetti preziosi nelle grotte, hon tanti posti sihuri che ci so' 'ngiro?!ⓖ\n@c0@"
  ja: "@a@bまったく　世の人々は　どうして\n貴重な宝物を　洞くつなんかに\nしまい込んでしまうのか？\n@c0@"
"71":
  de: "@a@bJetzt sitze ich wirklich in der Klemme. Etwas Abscheulicheres und Garstigeres als eine Höhle gibt es gar nicht, so viel ist mal sicher.ⓟ\n@c0@"
  en: "@a@bⓗNow I'm in a real fix. There's nothing I loathe and detest more than caves, and that's a fact.ⓘ\n@c0@"
  es: "@a@b''Ahora sí que estoy en un aprieto. No hay nada que odie y deteste más que una cueva, os lo puedo asegurar.''\n@c0@"
  fr: "@a@bJe me retrouve dans un beau pétrin, à présent.\nIl n'y a rien que je déteste plus au monde que les grottes, c'est indéniable.ⓦ\n@c0@"
  it: "@a@bⓕOra mi trovo davanti a un bel problema: 'un c'è cosa ch'io detesti di più delle grotte! L'è più forte di me!ⓖ\n@c0@"
  ja: "@a@bおかげで　私のような者が\n苦労するハメになる。\n洞くつなんて　大キライだ～！\n@c0@"
"72":
  de: "@a@bDa ist ein Buch mit dem Titel ⓞAuf der Suche nach dem Zauberstab: Band Vierⓟ. %0%a00120 nimmt es und liest.\n@c0@"
  en: "@a@bThere's a book entitled ⓗMy Quest for the Magical Staff: Chapter Fourⓘ. %0%a00120 takes it from the shelf and reads it. \n@c0@"
  es: "@a@bHay un libro titulado ''Mi búsqueda del báculo mágico: capítulo cuatro''. %0%a00120 lo toma de la estantería y lo lee. \n@c0@"
  fr: "@a@bElles contiennent un livre intitulé ⓥMa Quête du bâton magiqueⓢ Chapitre quatreⓦ.\n%0%a00120 le prend et le parcourt. \n@c0@"
  it: "@a@bC'è un libro dal titolo ⓕLa mi' ricerca del Bastone magiho: Capitolo Quattroⓖ. %0%a00120 lo prende dallo scaffale e inizia a leggere...\n@c0@"
  ja: "@a@b「魔法の杖をもとめて　第４章」と\n書かれた　古い本がある。\n%a00120は　手にとって読んだ。\n@c0@"
"73":
  de: "@a@bⓞIch bin Samuel der Stabsammler. Und das macht mich gerade überhaupt nicht glücklich. Aber die Pflicht ruft, und so bleibt mir diese Höhle wohl nicht erspart.\n@c0@"
  en: "@a@bⓗI am Rowand the Wandering Wandsman.\nI'm not happy about it in the slightest, but work is work and so I must venture to that cave.\n@c0@"
  es: "@a@b''Me llamo Tristón Buscavaritas.\nLa idea no me hace ni pizca de gracia, pero el deber es el deber, por lo que me aventuraré en esa cueva.''\n@c0@"
  fr: "@a@bⓥJe suis Siméon le Chercheur de bâtons.\n Cela ne me réjouit pas du tout, mais le travail, c'est le travail. Je dois donc me rendre dans cette grotte.\n@c0@"
  it: "@a@bⓕIl mi' nome è Chercus il cercatore cerchiato. 'Unn impazzisco certo di gioia, ma il dovere è dovere e devo avventurarmi 'nquella grotta.ⓖ\n@c0@"
  ja: "@a@b私は魔法使いマドルエ。\n気は進まぬが　これも仕事とわりきって\n洞くつに　もぐることにした。\n@c0@"
"74":
  de: "@a@bOffenbar muss ich, um den magischen Stab zu finden, erst die Schatzkiste im tiefsten Teil der Höhle finden und ihren Boden untersuchen.\n@c0@"
  en: "@a@bⓗIt seems that, in order to find the magical staff, I must locate the treasure chest in the deepest part of the cave and examine the bottom of it.\n@c0@"
  es: "@a@b''Parece que para localizar el báculo mágico debo encontrar el cofre del tesoro en lo más profundo de la cueva y examinar el fondo de dicho cofre.''\n@c0@"
  fr: "@a@bApparemment, pour trouver le bâton magique, je dois découvrir le coffre au trésor caché au plus profond de la grotte et en examiner le fond.\n@c0@"
  it: "@a@bⓕA quanto pare, per trova' il bastone magiho devo individua' uno scrigno nella parte più profonda della grotta ed esaminarne il fondo.ⓖ\n@c0@"
  ja: "@a@bなんでも　魔法の杖を　見つけるには\nもっとも奥の宝箱の　底を調べるべし\n……とのことだ。\n@c0@"
"75":
  de: "@a@bAusgerechnet im tiefsten Teil der Höhle, also wirklich! Das hat mir gerade noch gefehlt! Was hab ich der Welt denn getan?!\n@c0@"
  en: "@a@bⓗOf all the places! The deepest part of the cave, I ask you!\nSomebody up there must really hate me.\n@c0@"
  es: "@a@b''¡De todos los sitios posibles! ¡En lo más profundo de la cueva, qué os parece!\nDebe haber alguien que me odia mucho.''\n@c0@"
  fr: "@a@bParmi tous les endroits au mondeⓠ La partie la plus profonde de la grotteⓠ Je vous demande un peuⓠ Quelqu'un, là-haut, doit vraiment me détester.\n@c0@"
  it: "@a@bⓕCon tutti i posti che ci sono, proprio 'nfondo alla grotta!\nHualcuno lassù deve proprio odiarmi a morte!ⓖ\n@c0@"
  ja: "@a@bまったく　よりにもよって\n一番奥の部屋とは　念の入ったことだ。\nそんなに私がキライか？　ムキッ～！！\n@c0@"
"76":
  de: "@a@bOh jemine, das Ganze bringt mich ganz aus der Fassung. Vielleicht sollte ich, wenn ich den Stab gefunden habe, doch lieber den Beruf wechseln.\n@c0@"
  en: "@a@bⓗOh dear. I'm getting quite agitated by the whole thing. Once I find this magical staff, I think it might be time for a career change.\n@c0@"
  es: "@a@b''¡Oh!, vaya. Todo este asunto empieza a ponerme nervioso. En cuanto encuentre ese báculo mágico creo que irá siendo hora de cambiar de trabajo.''\n@c0@"
  fr: "@a@bAh là là, tout ceci me rend vraiment très nerveux. Une fois que j'aurai trouvé ce bâton magique, j'envisage sérieusement de changer de métier.\n@c0@"
  it: "@a@bⓕMaremma bastonata! Huesta situazione mi dà l'ansia. Dopo che avrò trovato il bastone magiho, credo proprio che cambierò mestiere...ⓖ\n@c0@"
  ja: "@a@b……いや　少々取り乱した。\nとにかく　この魔法の杖を見つけたら\nもう　こんな仕事は　やめてしまおう。\n@c0@"
"77":
  de: "@a@bMal sehen, vielleicht kehre ich in meine Heimatstadt zurück und mache mich mit meinem Ersparten selbstständig.\n㈡\nEs wird Zeit, dass ich zur Abwechslung mal etwas tue, was mir Spaß macht.ⓟ\n@c0@"
  en: "@a@bⓗMaybe I'll go back to my hometown and use what little savings I have to start some kind of business.\n㈡\nⓗIt's about time I did what I wanted for a change.ⓘ\n@c0@"
  es: "@a@b''Puede que regrese a mi hogar y abra un negocio con los ahorros que he acumulado.''\n㈡\n''Ya es hora de que haga lo que siempre he querido, para variar.''\n@c0@"
  fr: "@a@bPeut-être que je retournerai dans ma ville natale et que j'utiliserai mes maigres économies pour lancer une affaire.\n㈡\nIl est grand temps que je fasse enfin ce dont j'ai envie, pour changer.ⓦ\n@c0@"
  it: "@a@bⓕMagari me ne tornerò al mi' villaggio e userò i pohi risparmi che ho per apri' una salumeria...ⓖ\n㈡\nⓕÈ arrivato il momento di da' una svolta alla mi' vita!ⓖ\n@c0@"
  ja: "@a@b故郷に帰り　今までコツコツためた金で\nなにか商売でも　始めよう。\nこれからは　気ままに生きてやるんだ！\n@c0@"
"78":
  de: "@a@bDa ist ein Buch mit dem Titel ⓞDie Geschichte von dem geflügelten Mannⓟ. %0%a00120 nimmt es und liest.\n@c0@"
  en: "@a@bThere's a book called ⓗThe Tale of the Winged Manⓘ. %0%a00120 takes it from the shelf and reads it.\n@c0@"
  es: "@a@bHay un libro titulado ''La historia del hombre alado''. %0%a00120 lo toma de la estantería y lo lee.\n@c0@"
  fr: "@a@bUn livre intitulé ⓥLe Conte de l'homme ailéⓦ s'y trouve.\n%0%a00120 le prend et le parcourt.\n@c0@"
  it: "@a@bC'è un libro intitolato ⓕLa favola dell'uomo alatoⓖ. %0%a00120 lo prende dallo scaffale e inizia a leggere...\n@c0@"
  ja: "@a@b「翼人伝」と　書かれた本がある。\n%a00120は　手にとって読んだ。\n@c0@"
"79":
  de: "@a@bⓞIch sah, wie ein Mann mit schrecklichen Wunden am Rücken an den Strand gespült wurde. Ich brachte den Armen in mein Haus.\n@c0@"
  en: "@a@bⓗI once saw a man washed up on the beach with the most terrible wounds on his back. I helped the poor fellow back to my house.\n@c0@"
  es: "@a@b''En una ocasión encontré un hombre abandonado en la playa, con terribles heridas en su espalda. Ayudé al pobre desgraciado y lo llevé hasta mi casa.''\n@c0@"
  fr: "@a@bⓥUn jour, j'ai trouvé un homme rejeté sur la plage et dont le dos portait de terribles blessures. J'ai aidé le pauvre homme à se rendre jusque chez moi.\n@c0@"
  it: "@a@bⓕTanto tempo fa, trovai sulla spiaggia un uomo con delle orribili ferite sulla schiena. Soccorsi il poverino e lo portai a casa mia.ⓖ\n@c0@"
  ja: "@a@b砂浜に流れついた男は　背中に\nひどいケガを負っていた。\n私は男を　連れ帰った。\n@c0@"
"80":
  de: "@a@bZum Glück konnte ich ihn wieder gesund pflegen, und sein Rücken verheilte gut.\n@c0@"
  en: "@a@bⓗThankfully, I was able to nurse him back to health, and his back healed nicely.\n@c0@"
  es: "@a@b''Por fortuna, conseguí que recuperara las fuerzas y que su espalda sanara y cicatrizara.''\n@c0@"
  fr: "@a@bHeureusement, mes soins réussirent à lui rendre la santé, et son dos guérit sans problème.\n@c0@"
  it: "@a@bⓕGrazie alle mie cure, lo sventurato si riprese e la sua schiena guarì completamente.ⓖ\n@c0@"
  ja: "@a@b手当てのかいがあり　男は命を\nとりとめ　背中のケガも回復した。\n@c0@"
"81":
  de: "@a@bDann, eines Abends, wuchsen ihm direkt vor meinen Augen zwei Flügel aus dem Rücken ⓚⓛ genau dort, wo seine Wunden gewesen waren!\n@c0@"
  en: "@a@bⓗThen, one evening, right before my eyes, two white wings appeared from where his wounds had been!\n@c0@"
  es: "@a@b''Entonces, una noche, ante mis propias narices, en el lugar donde tenía las heridas, ¡le crecieron dos alas blancas!''\n@c0@"
  fr: "@a@bPuis un beau soir, juste sous mes yeux, deux ailes blanches apparurent à l'endroit même où se trouvaient ses blessuresⓠ\n@c0@"
  it: "@a@bⓕUna sera, però, lì dove prima c'erano le ferite, spuntarono due ali bianche! E tutto proprio sotto i miei occhi!ⓖ\n@c0@"
  ja: "@a@bある晩のことだ。\nなんと　私の目の前で　男の背中の\nきずあとから　白い翼がはえた！\n@c0@"
"82":
  de: "@a@bDer Mann sagte, er sei von einem schwebenden Schloss gekommen.\n㈡\nUnd dann flog er auf und davon in den Abendhimmel. Zurück blieb nur ein schimmernder weißer Helm.ⓟ\n@c0@"
  en: "@a@bⓗThe man explained that he had come from a floating castle.\n㈡\nⓗWith that, he flew off into the night sky, leaving behind a gleaming white helmet.ⓘ\n@c0@"
  es: "@a@b''El hombre me explicó que provenía de un castillo flotante.''\n㈡\n''Y sin más, partió hacia el cielo nocturno, dejando tras de sí un brillante yelmo blanco.''\n@c0@"
  fr: "@a@bL'homme m'expliqua qu'il était venu d'un château volant.\n㈡\nSur ces mots, il s'envola dans le ciel, laissant derrière lui un casque blanc brillant.ⓦ\n@c0@"
  it: "@a@bⓕAllora l'uomo mi spiegò che proveniva da un castello volante.ⓖ\n㈡\nⓕDopodiché spiccò il volo, lasciando dietro di sé un elmo bianco scintillante.ⓖ\n@c0@"
  ja: "@a@b男は　空に浮かぶ城から　来たという。\nそして　白く輝く　かぶとを残し\n夜空へ羽ばたいていった。\n@c0@"
"83":
  de: "@a@bDa ist ein Buch mit dem Titel ⓞAuf der Suche nach dem Zauberstab: Band Fünfⓟ. %0%a00120 nimmt es und liest.\n@c0@"
  en: "@a@bThere's a book entitled ⓗMy Quest for the Magical Staff: Chapter Fiveⓘ. %0%a00120 takes it from the shelf and reads it. \n@c0@"
  es: "@a@bHay un libro titulado ''Mi búsqueda del báculo mágico: capítulo cinco''. %0%a00120 lo toma de la estantería y lo lee. \n@c0@"
  fr: "@a@bElles contiennent un livre intitulé ⓥMa Quête du bâton magiqueⓢ Chapitre cinqⓦ.\n%0%a00120 le prend et le parcourt. \n@c0@"
  it: "@a@bC'è un libro dal titolo ⓕLa mi' ricerca del Bastone magiho: Capitolo Cinqueⓖ. %0%a00120 lo prende dallo scaffale e inizia a leggere...\n@c0@"
  ja: "@a@b「魔法の杖をもとめて　第５章」と\n書かれた　古い本がある。\n%a00120は　手にとって読んだ。\n@c0@"
"84":
  de: "@a@bⓞMeine ganze Suche ist vergeblich gewesen! Ich habe in der Höhle zwar eine verborgene Treppe und eine Schatztruhe gefunden.\n@c0@"
  en: "@a@bⓗAfter all that, I didn't manage to find the magical staff. I did find a hidden staircase and a treasure chest in the cave, mind you.\n@c0@"
  es: "@a@b''Después de todo, no conseguí encontrar el báculo mágico. Lo que sí encontré en la cueva fue una escalera oculta y un cofre del tesoro.''\n@c0@"
  fr: "@a@bⓥAu terme de tout cela, je n'ai finalement pas réussi à trouver le bâton magique. Ceci dit, j'ai trouvé un escalier caché et un coffre dans la grotte.\n@c0@"
  it: "@a@bⓕDopo tutta huella fatica, 'un sono riuscito a trova' il bastone magiho. Eppure nella grotta ho trovato delle scale nascoste e uno scrigno!ⓖ\n@c0@"
  ja: "@a@b結局　魔法の杖を　見つけることは\nできなかった。　たしかに洞くつの奥には\n隠し階段があり　宝箱もあったのだ。\n@c0@"
"85":
  de: "@a@bAber die Truhe war auf der anderen Seite eines Gitters. Direkt vor meinen Augen und doch so unerreichbar fern.\n@c0@"
  en: "@a@bⓗBut the chest was on the other side of some bars. It was right before my eyes, and yet impossible to reach.\n@c0@"
  es: "@a@b''Pero el cofre se encontraba tras unos barrotes. Estaba delante de mis narices y no podía alcanzarlo.''\n@c0@"
  fr: "@a@bMais le coffre se trouvait derrière des barreaux.\nIl était juste devant mes yeux et pourtant hors d'atteinte.\n@c0@"
  it: "@a@bⓕMa lo scrigno era dall'altro lato d'una grata. Era proprio davanti a me, ma m'è stato 'mpossibile raggiungerlo.ⓖ\n@c0@"
  ja: "@a@bしかし　その宝箱は　鉄格子の向こう。\n目の前に見える　宝箱までの距離は\n絶望的に　遠かった……。\n@c0@"
"86":
  de: "@a@bIch habe keine Wahl, ich muss diese Truhe aufgeben und mich auf die Suche nach einem anderen magischen Stab machen.\n@c0@"
  en: "@a@bⓗI've no choice but to give up on that chest now, and set off again in search of a different magical staff.\n@c0@"
  es: "@a@b''No tuve otra opción que renunciar al cofre y proseguir en búsqueda de un báculo mágico diferente.''\n@c0@"
  fr: "@a@bÀ présent, je n'ai pas d'autre choix que d'abandonner ce coffre et de repartir à la recherche d'un autre bâton magique.\n@c0@"
  it: "@a@bⓕ'Unn ho altra scelta: devo lascia' perde' huesto scrigno e parti' alla ricerca d'un altro bastone magiho.ⓖ\n@c0@"
  ja: "@a@b私は　もう　その宝箱のことは\nすっぱり忘れて　今はまた\n新たな魔法の杖を探す　旅の空である。\n@c0@"
"87":
  de: "@a@bOb ich wohl jemals diese Arbeit aufgeben und etwas anderes machen kann? Ach, was gäbe ich nicht für einen Teller von Mutters Eintopf!\n@c0@"
  en: "@a@bⓗI wonder if I'll ever be able to give up this job and do something else. What I'd give for a bowl of my old ma's stew.\n@c0@"
  es: "@a@b''Me pregunto si alguna vez podré dejar este trabajo y dedicarme a otra cosa. Lo que daría por un cuenco del estofado que hacía mi anciana madre.''\n@c0@"
  fr: "@a@bJe me demande si j'arriverai un jour à laisser tomber ce travail et à faire autre chose.\n㈡\nJe donnerais n'importe quoi pour une assiette de ragoût de ma vieille maman.\n@c0@"
  it: "@a@bⓕChissà se riuscirò mai ad abbandona' huesto lavoro e ad occuparmi d'altro... Cosa non darei per una bella ribollita preparata dalla mi' mamma!ⓖ\n@c0@"
  ja: "@a@bしかし　いつになったら　この仕事を\nやめられるのだろうか？\nああ　母さんのシチューが食べたい……。\n@c0@"
"88":
  de: "@a@bIch bin Samuel der Stabsammler. Auf Befehl des Zaren von Samokswa habe ich mich auf die Suche nach einem magischen Stab gemacht.ⓟ\n@c0@"
  en: "@a@bⓗI am Rowand the Wandering Wandsman. By the Tsar of Zamoksva's orders, I'm travelling the world in search of a magical staff.ⓘ\n@c0@"
  es: "@a@b''Me llamo Tristón Buscavaritas. Por orden del Zar de Zamoksva, recorro el mundo en busca de un báculo mágico.''\n@c0@"
  fr: "@a@bJe suis Siméon le Chercheur de bâtons. Sur ordre du tsar de Zamoksva, je parcours le monde à la recherche d'un bâton magique.ⓦ\n@c0@"
  it: "@a@bⓕIl mi' nome è Chercus il cercatore cerchiato. Giro pe' i'mmondo per ordine dello zar di Zamoskva, alla ricerca d'un bastone magiho.ⓖ\n@c0@"
  ja: "@a@b私は　魔法使いマドルエ。\nわが主君　サントハイム王の命令で\n魔法の杖を探している。\n@c0@"
"89":
  de: "@a@bDa ist ein kleines Schild. Darauf steht: ⓞLesen im Stehen ist nicht gestattet.ⓟ\n@c0@"
  en: "@a@bThere's a small sign which reads,\nⓗReading while standing up is prohibitedⓘ.\n@c0@"
  es: "@a@bHay un pequeño letrero que dice:\n''Se prohíbe leer de pie''.\n@c0@"
  fr: "@a@bUn petit panneau indiqueⓢ\nⓥLire debout est strictement interditⓦ.\n@c0@"
  it: "@a@bSu un piccolo cartello c'è scritto:\nⓕÈ proibito leggere in piediⓖ.\n@c0@"
  ja: "@a@b「立ち読み　おことわり」の\nはりがみが　貼ってあった。\n@c0@"
"90":
  de: "@a@bDa ist ein Buch mit dem Titel ⓞLutz Langfingers Tagebuch! Pfoten weg!ⓟ. %0%a00120 nimmt es und liest.\n@c0@"
  en: "@a@bThere's a book entitled ⓗKirk Buzzer's Diary: Keep Out!ⓘ. %0%a00120 takes it from the shelf and reads it. \n@c0@"
  es: "@a@bHay un libro titulado ''Diario de Rob A. Conventos: ¡prohibido leer!'' %0%a00120 lo toma de la estantería y lo lee. \n@c0@"
  fr: "@a@bElles contiennent un livre intitulé ⓥJournal d'Arsène Lutrinⓢ ne pas toucherⓠⓦ.\n%0%a00120 le prend et le parcourt. \n@c0@"
  it: "@a@bC'è un libro dal titolo ⓕDiario di Lester Fant: giù le mani!ⓖ. %0%a00120 lo prende dallo scaffale e inizia a leggere...\n@c0@"
  ja: "@a@b「バコタの日記」と　書かれた本がある。\n%a00120は　手にとって読んだ。\n@c0@"
"91":
  de: "@a@bⓞTag 3, Monat des Drachen. Es ist Zeit, in Femischü... äh, Femiski... na, also in Femiscyra klebrige Finger zu kriegen.\n@c0@"
  en: "@a@bⓗDay 3, Month of the Dragon\nThe time's finally come for me to get me 'ands dirty at Femisky...Femisigh...er, Femiscyra.\n@c0@"
  es: "@a@b''Día 3, mes del dragón\nPor fin ha llegado el momento de ponerme manos a la obra en Femisky... Femisigh... eh, Feministia.''\n@c0@"
  fr: "@a@bⓥMois du Dragon, 3e jour\nLe moment est venu d'aller me salir les mains au château de Fémisky... Fémisigu... euh, Fémiscyra.\n@c0@"
  it: "@a@bⓗGiorno 3, mese del Drago.\nFinalmente è arrivato il momento di mettermi al lavoro a Femuschio... Femischia... ehm, Femiscyra.ⓖ\n@c0@"
  ja: "@a@b竜の月三日\nいよいよ　ガーデンブルグ城での\n仕事に　とりかかろうと思う。\n@c0@"
"92":
  de: "@a@bIch hab's auf diesen Zenithiaschild abgesehen. Ich wette, den ha'm die irgendwo in der Burg versteckt.\n@c0@"
  en: "@a@bⓗWot I'm after is that Zenithian Shield they reckon they've got 'idden somewhere in the castle.\n@c0@"
  es: "@a@b''Ando detrás del Escudo de Zenithia ese y parece que lo tienen escondido por algún sitio del castillo.''\n@c0@"
  fr: "@a@bJe cherche le Bouclier zénithien et on dit qu'il est caché quelque part dans ce château.\n@c0@"
  it: "@a@bⓕQuello che cerco è lo Scudo Zenithiano, che pare sia nascosto da qualche parte nel castello.ⓖ\n@c0@"
  ja: "@a@bねらいは　もちろん\nあの城に　かくされているという\n伝説の　天空の盾だ。\n@c0@"
"93":
  de: "@a@bWenn ich den in die Finger kriegen könnt, würd ich glatt noch selbst zur Legende, fast wie der große Hotzenplotz persönlich... Wär das nicht 'ne Wucht!ⓟ\n@c0@"
  en: "@a@bⓗIf I manage to get me mitts on that, I'll be like the legend'ry bandit 'imself, Robbin' Hood. Cor blimey, that'll be the day!ⓘ\n@c0@"
  es: "@a@b''Si consiguiera hacerme con él, sería como el famoso bandido, Luis Candelas. ¡No iba yo a presumir ni nada!''\n@c0@"
  fr: "@a@bSi je parviens à m'en emparer, je serai aussi célèbre que le légendaire bandit Robin des Bois. Saperlipopette, ça serait un sacré trucⓠ\n@c0@"
  it: "@a@bⓕSe riuscissi a impossessarmene, diventerei un ladro più famoso di Ruban Hood. Oh, sarebbe davvero fantastico!ⓖ\n@c0@"
  ja: "@a@bこの仕事に　成功すれば\n私も　カンダタ　ラゴスといった\n伝説の大盗賊に　肩を並べるだろう。\n@c0@"
"94":
  de: "@a@bⓞTag 5, Monat des Drachen. Hab mich in die Burg Femiscyra geschlichen, aber keine Spur von dem blöden Zenithiaschild.\n@c0@"
  en: "@a@bⓗDay 5, Month of the Dragon\nI snuck meself into Femiscyra Castle, but that Zenithian Shield weren't nowhere to be seen.\n@c0@"
  es: "@a@b''Día 5, mes del dragón\nHe conseguido entrar en el Castillo de Feministia pero no encuentro el maldito Escudo de Zenithia ese.''\n@c0@"
  fr: "@a@bMois du Dragon, 5e jour\nJe me suis glissé dans le château de Fémiscyra, mais impossible de dénicher ce Bouclier zénithien.\n@c0@"
  it: "@a@bⓕGiorno 5, mese del Drago.\nSono riuscito a intrufolarmi nel castello di Femiscyra, ma di quello Scudo Zenithiano non c'è neanche l'ombra!ⓖ\n@c0@"
  ja: "@a@b竜の月五日\nガーデンブルグ城に　潜入したものの\nついに　天空の盾は　見つからなかった。\n@c0@"
"95":
  de: "@a@bHab bloß 'ne popelige Gebetskette abgreifen können. Also, 'n üppiger Fischzug ist was anderes!\n@c0@"
  en: "@a@bⓗThe only thing I managed to swipe was some measly rosary. That ain't a good day's loot in no one's book!\n@c0@"
  es: "@a@b''Lo único que he conseguido birlar es un miserable rosario. ¡No es un botín demasiado valioso para un ladrón que se precie!''\n@c0@"
  fr: "@a@bLa seule chose que j'ai réussi à faucher, c'est un rosaire minable. Tu parles d'un butinⓠ\n@c0@"
  it: "@a@bⓕL'unica cosa che sono riuscito a racimolare è un misero rosario. Questo non è di certo un giorno da ricordare nei miei annali ladreschi!ⓖ\n@c0@"
  ja: "@a@b結局　盗めたのは\nブロンズでできた十字架だけ。\nまったく　なんてことだ！\n@c0@"
"96":
  de: "@a@bAber diese Gitterstäbe... Ach, was soll's. Feierabend! Morgen ist auch noch 'n Tag. Zeit für 'n Nickerchen.ⓟ\n@c0@"
  en: "@a@bⓗI can't 'elp wonderin' about them bars, mind... Huh! I've 'ad enough o' this for one day. Time for some shut-eye.ⓘ\n@c0@"
  es: "@a@b''No puedo dejar de pensar en esos barrotes... ¡uh! Ya he tenido bastante por hoy. Hora de planchar la oreja.''\n@c0@"
  fr: "@a@bJe ne peux pas m'empêcher de me poser des questions sur ces barreaux... Pfffⓠ Allez, ça suffit pour aujourd'hui. C'est l'heure de se coucher.ⓦ\n@c0@"
  it: "@a@bⓕNon riesco a non pensare a quelle sbarre... Pazienza! Ho avuto una giornata pesante, ed è arrivato il momento di schiacciare un pisolino.ⓖ\n@c0@"
  ja: "@a@bあの鉄格子が　怪しいのだが……。\nああ　いまいましい！\n今日は　もう　寝ることにする。\n@c0@"
"97":
  de: "@a@bDa ist ein seltsam aussehendes Buch ohne Titel. %0%a00120 nimmt es und liest.\n@c0@"
  en: "@a@bThere's a curious-looking book without a title. %0%a00120 takes it from the shelf and reads it.\n@c0@"
  es: "@a@bHay un libro de aspecto curioso sin título. %0%a00120 lo toma de la estantería y lo lee.\n@c0@"
  fr: "@a@bElles contiennent un livre sans titre, à l'apparence bizarre. %0%a00120 le prend et le parcourt.\n@c0@"
  it: "@a@bC'è un libro dall'aspetto curioso e senza titolo. %0%a00120 lo prende dallo scaffale e inizia a leggere...\n@c0@"
  ja: "@a@bタイトルのない　あやしげな本がある。\n%a00120は　手にとって読んだ。\n@c0@"
"98":
  de: "@a@bⓞVerzweifelt versuche ich mich loszureißen, aber ich spüre sie an meinen Kleidern zerren. Ich werde unsanft zurückgezogen und stürze zu Boden.\n@c0@"
  en: "@a@bⓗI try to run away, but feel my clothes being torn at. I'm pulled back sharply and I fall to the ground.\n@c0@"
  es: "@a@b''Intento huir, pero siento que me desgarran las ropas. Siento que tiran de mí con fuerza y caigo al suelo.''\n@c0@"
  fr: "@a@bⓥJ'essaie de fuir, mais je sens qu'on déchire mes vêtements. Je suis violemment tiré en arrière et je tombe au sol.\n@c0@"
  it: "@a@bⓕProvo a scappare, ma sento che qualcuno mi afferra i vestiti. Vengo trascinato indietro e cado a terra.ⓖ\n@c0@"
  ja: "@a@bそいつは　逃げる私の服をつかみ\n左右に引き裂いた。　はずみで　私は\n地面に　ねころんでしまった。\n@c0@"
"99":
  de: "@a@bNoch einmal versuche ich zu entkommen. Aber diese Arme ⓚⓛ sie umklammern mich wie gewaltige Baumstämme ⓚⓛ sie drücken mir die Luft ab!\n@c0@"
  en: "@a@bⓗOnce more I try to escape. But those arms like tree trunks engulf me and steal away my freedom.\n@c0@"
  es: "@a@b''Una vez más intento escapar. Pero esos brazos, fuertes como el acero, me rodean y se adueñan de mi libertad.''\n@c0@"
  fr: "@a@bUne fois de plus, j'essaie de m'enfuir. Mais ces bras larges comme des troncs m'engloutissent et me volent ma liberté.\n@c0@"
  it: "@a@bⓕProvo di nuovo a scappare, ma braccia grosse come tronchi d'albero mi bloccano, impedendomi di muovermi.ⓖ\n@c0@"
  ja: "@a@bなおも逃げようとするが　丸太のような\nそいつの腕が　私をとらえ\n抱きしめるかたちで　自由をうばう。\n@c0@"
"100":
  de: "@a@bGepeinigt schreie ich heraus: So verzeih mir doch, Barbara! Ich will dir nie mehr untreu sein, ehrlich!\n@c0@"
  en: "@a@bⓗI cry out in agony, ⓕForgive me, Barbara! I promise I'll never be unfaithful again!ⓖ\n@c0@"
  es: "@a@b''Grito sumido en la agonía, ⓗ¡perdóname, Bárbara! ¡Prometo que nunca volveré a serte infiel!ⓘ''\n@c0@"
  fr: "@a@bDans ma souffrance, je crieⓢ ⓗPardonne-moi, Barbaraⓠ Je promets de ne plus jamais t'être infidèleⓠⓘ\n@c0@"
  it: "@a@bⓕUrlo disperato: ⓗPerdonami, Barbara! Te lo prometto, non ti tradirò mai più!ⓘ Ehm...ⓖ\n@c0@"
  ja: "@a@bたまらず私は　悲鳴をあげた。\n「許してくれ　マチョー！\nもう二度と　浮気なんかしないよ」\n@c0@"
"101":
  de: "@a@bAber sie umklammert mich nur noch fester, wie eine Schraubzwinge, unversöhnlich, unerbittlich.\n@c0@"
  en: "@a@bⓗBut she just squeezes those arms tighter around me, unforgiving, relentless.\n@c0@"
  es: "@a@b''Pero ella aprieta más y me ahoga, sin clemencia, implacable.''\n@c0@"
  fr: "@a@bMais elle se contente de serrer plus fort encore ses bras autour de moi, implacable et sans merci.\n@c0@"
  it: "@a@bⓕMa le sue braccia mi stringono sempre di più, senza pietà.ⓖ\n@c0@"
  ja: "@a@b彼女　マチョーは　私をしめあげる腕に\nなお　いっそうのチカラをこめる。\n@c0@"
"102":
  de: "@a@bUnd indem mir die Sinne schwinden, fasse ich den Entschluss, mit ihr Schluss zu machen, diesmal endgültig...ⓟ\n@c0@"
  en: "@a@bⓗAnd as my consciousness fades, I make the decision to break up with her once and for all...ⓘ\n@c0@"
  es: "@a@b''Y, mientras mi conciencia se desvanece, tomo la decisión de romper con ella de una vez por todas...''\n@c0@"
  fr: "@a@bEt tandis que je perds conscience, je prends la décision de rompre avec elle une bonne fois pour toutes...ⓦ\n@c0@"
  it: "@a@bⓕMentre perdo conoscenza, prendo una decisione: devo lasciarla una volta per tutte...ⓖ\n@c0@"
  ja: "@a@bうすれゆく意識の中で　私は\nこの女と別れようと決心した……。\n@c0@"
"103":
  de: "@a@bDa ist eine große Sammlung von Büchern über heilige Lehren, Wahrsagerei und Mythologie.\n@c0@"
  en: "@a@bThere's a large collection of books on holy teaching, prophecy and mythology.\n@c0@"
  es: "@a@bHay una importante colección de libros sobre enseñanzas sagradas, profecías y mitología.\n@c0@"
  fr: "@a@bElles contiennent une vaste collection de livres sur les enseignements religieux, la prophétie et la mythologie.\n@c0@"
  it: "@a@bC'è una vasta raccolta di libri sugli insegnamenti sacri, le profezie e la mitologia.\n@c0@"
  ja: "@a@b神の教えや　予言\n世界の神話についての本が\nきちんと　並べられている。\n@c0@"
"104":
  de: "@a@bDa stehen viele Wörterbücher ordentlich aufgereiht.\n@c0@"
  en: "@a@bThere are lots of dictionaries neatly lined up.\n@c0@"
  es: "@a@bHay una gran cantidad de diccionarios, perfectamente ordenados.\n@c0@"
  fr: "@a@bDe nombreux dictionnaires y sont soigneusement alignés.\n@c0@"
  it: "@a@bCi sono tanti dizionari allineati ordinatamente.\n@c0@"
  ja: "@a@bたくさんの辞典が\nきちんと　並べられている。\n@c0@"
"105":
  de: "@a@bDa ist ein Tagebuch, geschrieben von einem Zenithianer. Es ist in Zeichen geschrieben, die %a00120 versteht.\n@c0@"
  en: "@a@bThere's a diary there written by a Zenithian.\nIt's penned in characters %a00120 can understand.\n@c0@"
  es: "@a@bHay un diario escrito por un habitante de Zenithia.\nEstá escrito en caracteres que %a00120 puede leer.\n@c0@"
  fr: "@a@bElles contiennent un journal écrit par un Zénithien.\nIl est rédigé avec des caractères %G120%Xqu'%Yque %Z%a00120 est capable de déchiffrer.\n@c0@"
  it: "@a@bC'è un diario curato da uno Zenithiano.\nÈ scritto in una lingua che %a00120 riesce a leggere.\n@c0@"
  ja: "@a@b天空人の日記があった。\n%a00120にも　読める文字で\n書かれてあった。\n@c0@"
"106":
  de: "@a@bⓞIch fürchte, der Zenithdrache wird jener nicht vergeben, die gesündigt hat und zur Welt hinabgestiegen ist, wie viel Zeit auch vergehen mag. \n@c0@"
  en: "@a@bⓗIt is my belief that the Zenith Dragon shall not forgive she who sinned and went to the world below, no matter how much time doth pass.\n@c0@"
  es: "@a@b''Considero que el Dragón de Zenithia no perdonará a la pecadora que se adentró en el mundo inferior, sin importar el tiempo que pase.''\n@c0@"
  fr: "@a@bⓥJe crois que le Dragon du Zénith ne pardonnera point à celle qui a péché et s'est rendue dans le monde d'en bas. Même le temps n'y fera rien.\n@c0@"
  it: "@a@bⓕRitengo che il Drago di Zenithia non perdonerà mai colei che ha peccato scendendo nel mondo di sotto.ⓖ\n@c0@"
  ja: "@a@b禁をおかして　地に下りた彼女を\nマスタードラゴンは　どんなに時が\nたとうとも　お許しにならないだろう。\n@c0@"
"107":
  de: "@a@bDer allmächtige Zenithdrache wird sie auf unbarmherzige Weise auf ihren Platz verweisen und ihr Glück wird ihr genommen werden.\n@c0@"
  en: "@a@bⓗThe Almighty Zenith Dragon will surely admonish her in the cruellest of fashions, and divest her of her happiness.\n@c0@"
  es: "@a@b''El todopoderoso Dragón de Zenithia la castigará con toda su crueldad y la despojará de todo ápice de felicidad.''\n@c0@"
  fr: "@a@bLe Dragon du Zénith tout-puissant la punira sans doute de la plus cruelle des manières et la privera de son bonheur.\n@c0@"
  it: "@a@bⓕL'onnipotente Drago di Zenithia la punirà sicuramente nel modo più crudele, e la priverà della felicità, per tutta la vita.ⓖ\n@c0@"
  ja: "@a@b今に　マスタードラゴンは　もっとも\n残酷なやり方で　彼女のしあわせを\nうばうことだろう。\n@c0@"
"108":
  de: "@a@bIch muss tun, was in meiner Macht steht, damit keine Tragödie geschieht. Es kümmert mich nicht, welche Strafe mir dafür beschieden wird.ⓟ\n@c0@"
  en: "@a@bⓗI must do my utmost to bring her back into the fold lest tragedy occur. I care not what judgement I shall face.ⓘ\n@c0@"
  es: "@a@b''Debo hacer todo lo posible para que regrese al rebaño y evitar una tragedia. No importa el castigo que reciba.''\n@c0@"
  fr: "@a@bJe dois faire tout ce qui est en mon pouvoir pour la ramener parmi nous si je désire éviter une tragédie. Peu importe le jugement que j'encourrai.ⓦ\n@c0@"
  it: "@a@bⓕDevo fare tutto ciò che posso per riportarla indietro, prima che avvenga una tragedia. Non m'importa delle conseguenze che dovrò affrontare.ⓖ\n@c0@"
  ja: "@a@b悲劇がおこる前に　地に下りた彼女を\n私は　なんとしても連れ戻すつもりだ。\nそれで　どんなに憎まれようとも……。\n@c0@"
"109":
  de: "@a@bDa ist ein altes Tagebuch über Drachenaufzucht. Es ist in Zeichen geschrieben, die %a00120 verstehen kann.\n@c0@"
  en: "@a@bThere's an old journal there on dragon-rearing. It's written in characters %a00120 can understand.\n@c0@"
  es: "@a@bHay un antiguo diario sobre la cría de dragones. Está escrito en caracteres que %a00120 puede leer.\n@c0@"
  fr: "@a@bElles contiennent un vieux journal sur l'élevage de dragons. Il est rédigé avec des caractères %G120%Xqu'%Yque %Z%a00120 est capable de déchiffrer.\n@c0@"
  it: "@a@bC'è un vecchio diario sull'allevamento dei draghi. È scritto in una lingua che %a00120 riesce a leggere.\n@c0@"
  ja: "@a@b古びたドラゴン育成日誌があった。\n%a00120にも　読める文字で\n書かれてあった。\n@c0@"
"110":
  de: "@a@bⓞHeute jährt sich zum achten Mal der Tag von Fünkchens Geburt. Orifiela und Fünkchen haben im selben Jahr das Licht der Welt erblickt.\n@c0@"
  en: "@a@bⓗToday marks the anniversary of the birth of Sparkie. Orifiela and Sparkie came into this world in the same year, now eight years agone.\n@c0@"
  es: "@a@b''Hoy es el aniversario del nacimiento de Sparkie. Orifiela y Sparkie llegaron a este mundo el mismo día, ya hace ocho años.''\n@c0@"
  fr: "@a@bⓥC'est aujourd'hui l'anniversaire de la naissance de Braséro. Orifiela et Braséro sont venus au monde la même année, il y maintenant huit ans de cela.\n@c0@"
  it: "@a@bⓕOggi è il compleanno di Scyntill. Orifiela e Scyntill sono nati entrambi otto anni fa.ⓖ\n@c0@"
  ja: "@a@b今日は　ドランの誕生日なのです。\n同じ年に生まれたので　ルーシアも\nドランも　今日で　八才です。\n@c0@"
"111":
  de: "@a@bUnd doch wirkt Fünkchen beträchtlich reifer. Offenbar werden Drachen früher erwachsen als Zenithianer.ⓟ\n@c0@"
  en: "@a@bⓗYet Sparkie would appear considerably more mature. It seemeth dragons conclude their journey to adulthood faster than Zenithians.ⓘ\n@c0@"
  es: "@a@b''Sin embargo, Sparkie parece mucho más maduro. Puede que los dragones concluyan su paso a la edad adulta más aprisa que los habitantes de Zenithia.''\n@c0@"
  fr: "@a@bPourtant, Braséro semble considérablement plus mature. On dirait que les dragons parviennent à l'âge adulte plus vite que les Zénithiens.ⓦ\n@c0@"
  it: "@a@bⓕEppure Scyntill appare molto più maturo. Sembrerebbe proprio che i draghi raggiungano l'età adulta più in fretta degli Zenithiani.ⓖ\n@c0@"
  ja: "@a@bでもドランは　もう大人らしいのです。\nどうも　天空人とドラゴンは\n大人になる早さが　ちがうようです。\n@c0@"
"112":
  de: "@a@bDie Bücher sind mit Zeichen geschrieben, die %a00120 noch nie zuvor gesehen hat.\n@c0@"
  en: "@a@bThe books are filled with words in a script %a00120 has never seen before.\n@c0@"
  es: "@a@bLos libros están repletos de palabras en un idioma que %a00120 nunca ha visto antes.\n@c0@"
  fr: "@a@bLes livres sont rédigés dans une écriture %G120%Xqu'%Yque %Z%a00120 n'avait encore jamais vue.\n@c0@"
  it: "@a@bI libri sono scritti con dei simboli che %a00120 non ha mai visto prima.\n@c0@"
  ja: "@a@b本には　見たことのない文字が\nぎっしりと書かれている。\n@c0@"
"113":
  de: "@a@bDie Bücher sehen alle ziemlich langweilig aus.\n@c0@"
  en: "@a@bThere don't seem to be any particularly interesting books.\n@c0@"
  es: "@a@bParece que no hay ningún libro de especial interés.\n@c0@"
  fr: "@a@bIl ne semble y avoir aucun livre particulièrement intéressant.\n@c0@"
  it: "@a@bNon sembrano esserci libri particolarmente interessanti...\n@c0@"
  ja: "@a@bとくに　かわった本は　ないようだ。\n@c0@"
"114":
  de: "@a@b%0%a00120 sieht sich die Bücherregale an.\n@c0@"
  en: "@a@b%0%a00120 looks at the bookshelves.\n@c0@"
  es: "@a@b%0%a00120 mira los estantes.\n@c0@"
  fr: "@a@b%0%a00120 examine les étagères.\n@c0@"
  it: "@a@b%0%a00120 esamina gli scaffali.\n@c0@"
  ja: "@a@b%a00120は　本だなを見た。\n@c0@"
"115":
  de: "@a@bHoppla!\n%A120%XEr bemerkt, dass er%Z%B120%XSie bemerkt, dass sie%Z sie von der falschen Seite betrachtet!\n@c0@"
  en: "@a@bOops! %A120%XHe%Z%B120%XShe%Z was looking at the back of them!\n@c0@"
  es: "@a@b¡Uy! ¡Los estaba mirando por atrás!\n@c0@"
  fr: "@a@bOupsⓠ %A120%XIl%Z%B120%XElle%Z les regardait du mauvais côtéⓠ\n@c0@"
  it: "@a@bOps!\nLi stava guardando da dietro!\n@c0@"
  ja: "@a@bなんと　うら側だった！\n@c0@"
