"0":
  de: "@a@bEs ist ein Spielautomat.\nWillst du eine Runde spielen?\n@c0@"
  en: "@a@bIt's a slot machine.\nDo you want to give it a spin?\n@c0@"
  es: "@a@bEs una máquina tragaperras.\n¿Quieres jugar unas partidas?\n@c0@"
  fr: "@a@bC'est une machine à sous.\nVous voulez jouerⓡ\n@c0@"
  it: "@a@bÈ una slot machine.\nVuoi tentare la sorte?\n@c0@"
  ja: "@a@bスロットマシーンがあります。\nやってみますか？\n@c0@"
"1":
  de: "@a@bDu hast offenbar keine Kasino-Jetons. Komm zurück, wenn du welche gekauft hast!\n@c0@"
  en: "@a@bIt looks like you don't have any casino tokens. Come back again when you've bought some!\n@c0@"
  es: "@a@bParece que no tienes ninguna ficha de casino. ¡Compra unas cuantas y vuelve de nuevo!\n@c0@"
  fr: "@a@bApparemment, vous n'avez pas de jetons de casino.\nRevenez quand vous en aurez achetésⓠ\n@c0@"
  it: "@a@bNon hai gettoni. Torna dopo che ne avrai comprato qualcuno.\n@c0@"
  ja: "@a@bコインが　ありませんので　コインを\nおかいもとめのうえ　またおこしください！\n@c0@"
"2":
  de: "@a@bBenutze das Steuerkreuz, um Jetons einzuwerfen, und drücke den A-Knopf, damit die Räder sich drehen. Drücke den B-Knopf, um aufzuhören.\n@c0@"
  en: "@a@bUse the +Control Pad to put in your tokens, and then press the A Button to start the wheels spinning. Press the B Button to stop playing.\n@c0@"
  es: "@a@bUtiliza el + Panel de Control para introducir las fichas y pulsa el Botón A para que giren las ruedas. Pulsa el Botón B para dejar de jugar.\n@c0@"
  fr: "@a@bIntroduisez vos jetons à l'aide de la manette + et appuyez sur le bouton A pour lancer la machine à sous.\n㈡\nAppuyez sur le bouton B pour arrêter de jouer.\n@c0@"
  it: "@a@bUsa la pulsantiera + per decidere quanti gettoni inserire. Premi il pulsante A per far partire la slot machine e il pulsante B per smettere di giocare.\n@c0@"
  ja: "@a@b十字ボタンでコインをいれて\nＡボタンでスタートです。\nＢボタンで　スロットをやめます。\n@c0@"
"3":
  de: "@a@bGut gemacht!\nDu hast soeben %a00720 Jetons gewonnen.\n@c0@"
  en: "@a@bWell done!\nYou've just won yourself %a00720 tokens.\n@c0@"
  es: "@a@b¡Muy bien!\nAcabas de ganar %a00720 fichas.\n@c0@"
  fr: "@a@bBien jouéⓠ\nVous venez de gagner %a00720 jetons.\n@c0@"
  it: "@a@bOttimo! Hai vinto %a00720 gettoni.\n@c0@"
  ja: "@a@bおめでとうございます！\n%a00720まいのコインが　あたりました。\n@c0@"
"4":
  de: "@a@bPech gehabt!\n@c0@"
  en: "@a@bBad luck!\n@c0@"
  es: "@a@b¡Mala suerte!\n@c0@"
  fr: "@a@bDommageⓠ\n@c0@"
  it: "@a@bChe sfortuna!\n@c0@"
  ja: "@a@bざんねんでした！\n@c0@"
"5":
  de: "@a@bWillst du's noch einmal probieren?\n@c0@"
  en: "@a@bHow about another go?\n@c0@"
  es: "@a@b¿Por qué no vuelves a probar?\n@c0@"
  fr: "@a@bVoulez-vous réessayerⓡ\n@c0@"
  it: "@a@bVuoi riprovare?\n@c0@"
  ja: "@a@bもういちど　スロットを　やりますか？\n@c0@"
"6":
  de: "@a@bDie Geschäftsleitung sieht es vielleicht nicht so gerne, wenn irgendwelche Leute hinten an ihren Geräten herumfummeln!\n@c0@"
  en: "@a@bThe management might not be too happy if they\ncatch someone fiddling around in the back of one\nof their machines!\n@c0@"
  es: "@a@bPuede que a la dirección no le haga demasiada\ngracia que alguien ande hurgando en la parte\ntrasera de las máquinas.\n@c0@"
  fr: "@a@bLa direction risque de ne pas être contente si elle surprend quelqu'un en train de farfouiller à l'arrière d'une des machinesⓠ\n@c0@"
  it: "@a@bLa direzione non sarà affatto contenta, se\nscoprirà qualcuno che armeggia\nsul retro di una delle loro macchine.\n@c0@"
  ja: "@a@bうら側を　調べていると\n怒られてしまうかもしれない。\n@c0@"
