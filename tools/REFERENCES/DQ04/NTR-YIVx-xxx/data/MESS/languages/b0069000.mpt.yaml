"0":
  de: "@a@b*: Willkommen in der Stadt Endor.\n@c2@"
  en: "@a@b*: Welcome to Endor.\n@c2@"
  es: "@a@b*: %H860%XTe%YOs%Z doy la bienvenida a la ciudad de Endor.\n@c2@"
  fr: "@a@b*ⓢ Bienvenue dans la ville de Chandor.\n@c2@"
  it: "@a@b*: %H860%XTi%YVi%Z do il benvenuto a Endor.\n@c2@"
  ja: "@a@b＊「エンドールの城下町に　ようこそ。\n@c2@"
"1":
  de: "@a@b*: In diesem Moment findet drüben in der Burg die Hochzeit von Prinzessin Veronica und Prinz Hinz statt!\n@c1@"
  en: "@a@b*: Princess Veronica and Prince Regan's wedding ceremony is happening over at the castle as we speak!\n@c1@"
  es: "@a@b*: ¡La boda entre la Princesa Verónica y el Príncipe Alí se está celebrando en el castillo!\n@c1@"
  fr: "@a@b*ⓢ La cérémonie de mariage de la princesse Véronica et du prince Réginald se déroule en ce moment même au châteauⓠ\n@c1@"
  it: "@a@b*: Proprio adesso si sta celebrando il matrimonio tra la Principessa Veronica e il Principe Vitellozzo!\n@c1@"
  ja: "@a@b＊「お城では今　リック王子とモニカ姫の\n\t結婚式をやってるのよ。\n@c1@"
"2":
  de: "@a@b*: Wachestehen ist nicht so einfach wie es aussieht, wisst Ihr. Da freu ich mich auf einen kühlen Schluck oder zwei heut Abend.\n@c2@"
  en: "@a@b*: Being on guard duty isnⓙt as easy as it looks, you know. Iⓙll certainly be enjoying a drink or two when evening rolls around.\n@c2@"
  es: "@a@b*: Estar de guardia no es tan fácil como parece. Cuando llegue la noche me tomaré un par de cervezas.\n@c2@"
  fr: "@a@b*ⓢ Être de garde n'est pas aussi facile qu'il y paraît, vous savez. J'irai sans doute boire un verre ou deux ce soir.\n@c2@"
  it: "@a@b*: Stare di guardia non è semplice come sembra. Stasera andrò a bere qualcosa per rilassarmi dalla fatica...\n@c2@"
  ja: "@a@b＊「かあ～　見回りも　楽じゃねえぜ。\n\t早く　酒場にでもいって\n\tいっぱい　やりたいなあ。\n@c2@"
"3":
  de: "@a@b*: Nach dem Turnier von Endor ging's hier ein bisschen ruhiger zu. Aber jetzt sind die Monster wieder da.\n@c2@"
  en: "@a@b*: We had a brief respite after the Endor Tourney, you know. But now the monsters are back with a vengeance.\n@c2@"
  es: "@a@b*: Después del Torneo de Endor tuvimos un breve respiro, ¿sabes? Pero ahora los monstruos han regresado con sed de venganza.\n@c2@"
  fr: "@a@b*ⓢ Nous avons eu un petit moment de répit après le tournoi de Chandor, mais les monstres sont de retour et ils ne sont pas tendres.\n@c2@"
  it: "@a@b*: Dopo il Torneo di Endor abbiamo avuto un po' di calma, ma ora i mostri sono tornati più forti e aggressivi che mai.\n@c2@"
  ja: "@a@b＊「武術大会の後　しばらくは\n\t怪物も　出なかったのに\n\tまた　出るようになったのよ。\n@c2@"
"4":
  de: "@a@b*: Ich weiß auch nicht! Die Welt ist verrückt geworden!\n@c2@"
  en: "@a@b*: I wonder whatⓙs behind it all. Itⓙs a funny old world we live in, isnⓙt it?\n@c2@"
  es: "@a@b*: No sé.\n¡El mundo se ha vuelto loco!\n@c2@"
  fr: "@a@b*ⓢ Je ne sais pas ce qui se passe.\nLe monde est devenu fouⓠ\n@c2@"
  it: "@a@b*: Proprio non capisco! Chissà dove andremo a finire!\n@c2@"
  ja: "@a@b＊「なにが　どうなってんだか……。\n\tぶっそうな世の中だねえ。\n@c2@"
"5":
  de: "@a@b*: Zur Burg Endor geht es hier durch dieses Tor.\n@c2@"
  en: "@a@b*: Youⓙll find Endor Castle just through this gate.\n@c2@"
  es: "@a@b*: El Castillo de Endor se encuentra al otro lado de esta puerta.\n@c2@"
  fr: "@a@b*ⓢ Le château de Chandor se trouve juste de l'autre côté de cette porte.\n@c2@"
  it: "@a@b*: Il castello di Endor è appena oltre questo passaggio.\n@c2@"
  ja: "@a@b＊「この門を　くぐった先に\n\tエンドールのお城がある。\n@c2@"
"6":
  de: "@a@b*: Wenn Ihr der königlichen Hochzeit beiwohnen wollt, begebt Euch bitte zum Kolosseum.\n@c2@"
  en: "@a@b*: If youⓙre here to attend the royal wedding, please make your way to the Colosseum.\n@c2@"
  es: "@a@b*: Si %H860%Xha%Yhan%Z venido a presenciar la boda real, %H860%Xle%Yles%Z ruego que %H860%Xcontinúe%Ycontinuen%Z hasta el Coliseo.\n@c2@"
  fr: "@a@b*ⓢ Si vous êtes là pour assister au mariage royal, veuillez vous diriger vers le Colisée.\n@c2@"
  it: "@a@b*: Se %H860%Xsei%Ysiete%Z qui per partecipare alle nozze reali, %H860%Xdirigiti%Ydirigetevi%Z verso l'Arena.\n@c2@"
  ja: "@a@b＊「姫さまの結婚式を見たいなら\n\tコロシアムへ　行くがいい。\n@c2@"
"7":
  de: "@a@b*: Nun, da Mina mir meine Zukunft vorhergesagt hat, weiß ich genau, was ich mit meinem Leben anfangen sollte.\n@c2@"
  en: "@a@b*: Now that Meenaⓙs told my fortune, I know exactly what I should do with my life.\n@c2@"
  es: "@a@b*: Ahora que Meena me ha leído el futuro, sé exactamente lo que tengo que hacer con mi vida.\n@c2@"
  fr: "@a@b*ⓢ Maintenant que Mina m'a dévoilé mon avenir, je sais exactement quoi faire de ma vie.\n@c2@"
  it: "@a@b*: Ora che Myra mi ha predetto il futuro, so esattamente cosa fare della mia vita.\n@c2@"
  ja: "@a@b＊「ミネアさんの　占いのおかげで\n\tどう生きればいいのか　わかったよ。\n@c2@"
"8":
  de: "@a@b*: Schon komisch, wenn man daran denkt, wozu all diese Leute auf der Welt sind und dass alle ihr vorbestimmtes Schicksal haben.\n@c2@"
  en: "@a@b*: Itⓙs funny when you think of all the reasons people were brought into this world, of all the destinies we each have.\n@c2@"
  es: "@a@b*: Resulta curioso pensar en los motivos por los que la gente llega a este mundo, en el destino tan diferente que tenemos cada uno.\n@c2@"
  fr: "@a@b*ⓢ C'est drôle de penser à toutes les raisons qui font que les gens viennent au monde, à la destinée de chacun d'entre nous.\n@c2@"
  it: "@a@b*: Certo che è strano pensare a tutti i motivi per cui le persone sono venute al mondo, e a tutto quello che il destino ha in serbo per loro...\n@c2@"
  ja: "@a@b＊「人は　それぞれ　いろんな\n\t使命を持って　この世に\n\t生まれてくるんだなあ。\n@c2@"
"9":
  de: "@a@b*: Vor einiger Zeit jagte eine schwarze Wolke in einem unglaublichen Tempo nach Osten über den Himmel.\n@c1@"
  en: "@a@b*: Some time ago now, a black cloud went billowing across the sky to the east at an incredible speed.\n@c1@"
  es: "@a@b*: Hace mucho tiempo, una nube negra atravesó el firmamento hacia el este a gran velocidad.\n@c1@"
  fr: "@a@b*ⓢ Il y a de cela un certain temps, un nuage noir est passé dans le ciel à toute vitesse, en direction de l'est.\n@c1@"
  it: "@a@b*: Qualche tempo fa, una nuvola nera attraversò il cielo verso est, spostandosi a velocità impressionante.\n@c1@"
  ja: "@a@b＊「ずいぶん前　黒い雲が　東の空に\n\tすごい速さで　流れていったんです。\n@c1@"
"10":
  de: "@a@b*: Und dann gab es Gerüchte, dass %A090%Xder erkorene Held, der%Z%B090%Xdie erkorene Heldin, die%Z die Welt retten sollte, gestorben sei.\n@c1@"
  en: "@a@b*: And then there were rumours that the chosen %A090%Xhero%Z%B090%Xheroine%Z, who was destined to save the world, had died.\n@c1@"
  es: "@a@b*: Fue entonces cuando surgieron los rumores de que %A090%Xel héroe elegido%Z%B090%Xla heroina elegida%Z que estaba %A090%Xdestinado%Z%B090%Xdestinada%Z a salvar el mundo había muerto.\n@c1@"
  fr: "@a@b*ⓢ Et l'on a ensuite entendu des rumeurs selon lesquelles %A090%Xle héros élu pour sauver le monde était mort%Z%B090%Xl'héroïne élue pour sauver le monde était morte%Z.\n@c1@"
  it: "@a@b*: Quel giorno qualcuno disse che %A090%Xl'eroe destinato a salvare il mondo era morto%Z%B090%Xl'eroina destinata a salvare il mondo era morta%Z.\n@c1@"
  ja: "@a@b＊「そして　しばらくして\n\t世界を救うはずの勇者さまが\n\t死んだという　うわさを聞きました。\n@c1@"
"11":
  de: "@a@b%0%a00120 liest das Schild.\n@c0@"
  en: "@a@b%0%a00120 reads the sign.\n@c0@"
  es: "@a@b%0%a00120 lee el cartel.\n@c0@"
  fr: "@a@b%0%a00120 lit l'écriteau.\n@c0@"
  it: "@a@b%0%a00120 legge il cartello.\n@c0@"
  ja: "@a@b%a00120は　立て札を　読んだ。\n@c0@"
"12":
  de: "@a@bⓞGlückwünsche an das glückliche Paar, Prinzessin Veronica und Prinz Hinz!ⓟ\n@c0@"
  en: "@a@bⓗCongratulations to the royal couple,\nPrincess Veronica and Prince Regan!ⓘ\n@c0@"
  es: "@a@b''¡Enhorabuena a la pareja real,\n la Princesa Verónica y el Príncipe Alí!''\n@c0@"
  fr: "@a@bⓥFélicitations au couple royal, la princesse Véronica et le prince Réginaldⓠⓦ\n@c0@"
  it: "@a@bⓕAuguri vivissimi alla coppia reale, la Principessa Veronica e il Principe Vitellozzo!ⓖ\n@c0@"
  ja: "@a@bご成婚　おめでとう！\nリック王子　モニカ姫\n@c0@"
"13":
  de: "@a@b*: Es ist eine solche Last, sich jeden Tag ein Menü ausdenken zu müssen. Zum Glück nimmt meine Magd mir wenigstens das Kochen ab.\n@c1@"
  en: "@a@b*: Itⓙs such a worry having to think up menus every day. Thank goodness I have the maid to actually cook it all for me.\n@c1@"
  es: "@a@b*: Es un agobio tener que pensar cada día en un menú. Gracias a la Diosa que tengo a la doncella para que lo cocine todo.\n@c1@"
  fr: "@a@b*ⓢ C'est un tel souci d'avoir à élaborer des menus chaque jour. Heureusement que j'ai une servante qui se charge de les préparer pour moi.\n@c1@"
  it: "@a@b*: Che seccatuva dovev pensave ogni giovno a un menu divevso. Gvazie al cielo ho la cuoca che poi pvepava tutto.\n@c1@"
  ja: "@a@b＊「ほんとに　毎晩のおこんだてを\n\t考えるのって　大変なのよ。\n\t作るのはメイドだけど……。\n@c1@"
"14":
  de: "@a@b*: Die junge Dame des Hauses starrt anscheinend immer nur in den Himmel.\n@c1@"
  en: "@a@b*: The young lady of the house always seems to be staring up at the sky.\n@c1@"
  es: "@a@b*: La señorita de la casa siempre parece estar mirando al cielo.\n@c1@"
  fr: "@a@b*ⓢ La jeune dame de la maison semble passer son temps à fixer le ciel.\n@c1@"
  it: "@a@b*: La giovane donna che abita nella casa sta sempre con la testa in su a fissare il cielo.\n@c1@"
  ja: "@a@b＊「ここん家の　おじょうさんは\n\tいっつも　空ばかり\n\tながめてるだよ。\n@c1@"
"15":
  de: "@a@b*: Ich frage mich, was daran so interessant sein soll.\n@c1@"
  en: "@a@b*: I wonder whatever could be so interesting\nabout it.\n@c1@"
  es: "@a@b*: Me pregunto qué puede tener de interesante.\n@c1@"
  fr: "@a@b*ⓢ Je me demande ce qu'elle peut y trouver de si intéressant.\n@c1@"
  it: "@a@b*: Chissà cosa avrà di tanto interessante da guardare...\n@c1@"
  ja: "@a@b＊「いったい　空なんか見て\n\tなにが　おもしろいんだっぺなあ。\n@c1@"
"16":
  de: "@a@bDa steht eine kostbar aussehende Rüstung.\n@c0@"
  en: "@a@bSome expensive-looking armour is on display.\n@c0@"
  es: "@a@bSe expone una armadura con aspecto de ser muy cara.\n@c0@"
  fr: "@a@bUne armure, vraisemblablement de grand prix, est exposée.\n@c0@"
  it: "@a@bC'è un'armatura molto preziosa in esposizione.\n@c0@"
  ja: "@a@b高価そうなヨロイが　かざられている。\n@c0@"
"17":
  de: "@a@b*: Habt Ihr schon von Psaro dem Metzler gehört? Er hat vor Kurzem am Turnier von Endor teilgenommen, und es scheint, er ist kein Mensch.\n@c2@"
  en: "@a@b*: Have you heard talk of Psaro the Manslayer? He was in the Endor Tourney a while back, and apparently, he isnⓙt human.\n@c2@"
  es: "@a@b*: ¿%H860%XHas%YHabéis%Z oído hablar de Psaro el Carnicero? Participó hace tiempo en el Torneo de Endor y se dice que no es humano.\n@c2@"
  fr: "@a@b*ⓢ Avez-vous entendu parler de Psaro l'Exterminateurⓡ Il a participé au tournoi de Chandor il y a quelque temps.\n㈡\n*ⓢ Apparemment, il ne serait pas humain.\n@c2@"
  it: "@a@b*: Mai sentito parlare di Psaro il Massacratore? Tempo fa partecipò al Torneo di Endor. In giro si vocifera che non sia un essere umano.\n@c2@"
  ja: "@a@b＊「あなた　知ってましたか？\n\tこの前　武術大会に出ていた\n\tデスピサロは人間ではなかったとか。\n@c2@"
"18":
  de: "@a@b*: Tja, das ist nur ein Gerücht. Allerdings ist er wirklich verdächtig stark.\n@c2@"
  en: "@a@b*: Well, thatⓙs just a rumour.\nBut he certainly seemed suspiciously strong.\n@c2@"
  es: "@a@b*: Bueno, aunque solo es un rumor.\nPero sí que parecía sospechosamente fuerte.\n@c2@"
  fr: "@a@b*ⓢ Enfin, ça n'est qu'une rumeur.\nMais effectivement, il avait l'air étrangement fort.\n@c2@"
  it: "@a@b*: Beh, questo è solo un pettegolezzo.\nIn ogni caso, la sua forza incredibile può dar adito a dei sospetti.\n@c2@"
  ja: "@a@b＊「ただの　うわさ話ですが\n\tたしかに　普通の人間にしては\n\t強すぎると思いましたよ。\n@c2@"
"19":
  de: "@aTessa@bMein Mann ist gerade verreist. Er hat sich auf die Suche nach einem legendären Schwert gemacht.\nKönnt Ihr Euch das vorstellen?!\n@c1@"
  en: "@aTessie@bMe fellaⓙs away at the moment. He went off trav'llinⓙ in search of a legendⓙry sword, would ye believe?\n@c1@"
  es: "@aTrakiba@bEn estos momientos mi miarido no está. Ha piartido de viaje, en busca de una liegendaria espada, ¿%H860%Xpuedes%Ypodéis%Z crieér%H860%Xte%Yos%Zlo?\n@c1@"
  fr: "@aLucille@bMon mari n'est pas là en ce moment. Il est parti en voyage, à la recherche d'une épée légendaire, vous vous rendez compteⓡ\n@c1@"
  it: "@aBeatrice@bIl mi' marito 'un c'è. L'è andato a cerca' una spada leggendaria. Roba da 'un credersi!\n@c1@"
  ja: "@a@bネネ「わたしの夫　トルネコは\n\t伝説の剣を探して　旅に出ています。\n@c1@"
"20":
  de: "@aTessa@bAber die Leute sagen, die Ungeheuer wären hinter ihm her.\n@c1@"
  en: "@aTessie@bBut thereⓙs talk about that monsters are huntinⓙ him down.\n@c1@"
  es: "@aTrakiba@bPero si rumiorea que los monstruos lo están piersiguiendo.\n@c1@"
  fr: "@aLucille@bMais on raconte qu'il est pourchassé par des monstres.\n@c1@"
  it: "@aBeatrice@bPerò ho sentito di' che ci so' dei mostri che gli danno la haccia.\n@c1@"
  ja: "@a@bネネ「でも　うわさでは魔物たちに\n\tねらわれているらしくて……。\n@c1@"
"21":
  de: "@aTessa@bIch hoffe nur, er hat ein paar gute, starke Freunde gefunden, die auf ihn aufpassen.\n@c1@"
  en: "@aTessie@bI just hope heⓙs found some good, strong feens to be lookinⓙ after him...\n@c1@"
  es: "@aTrakiba@bSolo espiero que haya encontrado buenos y fuertes compiañeros que le priotejan...\n@c1@"
  fr: "@aLucille@bJ'espère seulement qu'il a trouvé de bons compagnons bien costauds pour le protéger...\n@c1@"
  it: "@aBeatrice@bSpero solo che abbia trovato qualche persona forte e di buon cuore che l'aiuti...\n@c1@"
  ja: "@a@bネネ「だれか　強い人と一緒に\n\t旅をしていればいいのですが……。\n@c1@"
"22":
  de: "@aTessa@bDa bist du ja, alter Rumtreiber! Willkommen daheim!\n@c1@"
  en: "@aTessie@bThere yⓙare, yⓙole feen!\nWelcome back!\n@c1@"
  es: "@aTrakiba@b¡Ahí estiás, viejo criápula!\n¡Bienvienido de nuevo!\n@c1@"
  fr: "@aLucille@bTe voilà, mon vieux compagnonⓠ\nBienvenue à la maisonⓠ\n@c1@"
  it: "@aBeatrice@bToh! Chi 'un more si rivede!\nSei di ritorno, eh? Era ora!\n@c1@"
  ja: "@a@bネネ「あなた！　あなたなのね！\n\tお帰りなさい！\n@c1@"
"23":
  de: "@aTessa@bFreilich ist's mir gut ergangen. Ich sitz hier ja auch nur dumm rum und werd alt und grau, während der Herr hinter seinen Träumen herjagt!\n@c1@"
  en: "@aTessie@bOh, aye. Iⓙve been grand altogether.\nIⓙm only waitinⓙ here watchinⓙ me hairs turn grey while ye go off huntinⓙ yer dreams!\n@c1@"
  es: "@aTrakiba@b¡Oh!, sí. Todo ha sido estupiendo.\n¡Aquí estoy, espierando, viendo cómo el pielo se me vuelve blanco mientras tú vas a cumplir tus sueñios!\n@c1@"
  fr: "@aLucille@bOh oui, moi aussi, j'ai du mérite.\nJe suis restée là à regarder mes cheveux devenir gris pendant que tu partais chasser tes rêvesⓠ\n@c1@"
  it: "@aBeatrice@bBeh, 'un me la so' miha havata male, anche se sono rimasta qui a invecchia' mentre te n'andavi a' giro a insegui' i tu' sogni!\n@c1@"
  ja: "@a@bネネ「ううん　わたしは大丈夫よ。\n\tあなたが　早く夢をかなえて\n\t帰ってくる日を　待っているわ。\n@c1@"
"24":
  de: "@aTimo@bNachdem mein Papa weg war, hat meine Mama keine neuen Waren für den Laden mehr bekommen, darum hat sie stattdessen eine Bank eröffnet.\n@c1@"
  en: "@aTipper@bAfter Da went away, me mam didnⓙt have any stock for the shop, so she opened a bank instead.\n@c1@"
  es: "@aTarik@bCuando papá si miarchó, mi miadre no tenía giénero para la tienda, por lo que abrió un bianco.\n@c1@"
  fr: "@aAchille@bAprès le départ de p'pa, m'man n'a plus eu de stock pour le magasin, alors elle a ouvert une banque à la place.\n@c1@"
  it: "@aBalduccio@bDopo che il mi' babbo l'è andato via, la mamma è rimasta senza più roba da vende' in bottega, e così ha aperto una banca.\n@c1@"
  ja: "@a@bポポロ「パパが　旅に出ちゃって\n\t売り物を仕入れられないから\n\tママは　銀行を始めたんだよ。\n@c1@"
"25":
  de: "@aTimo@bPapa! Da bist du ja wieder! Ich bin ganz brav gewesen, ehrlich!\n@c1@"
  en: "@aTipper@bDa! Yeⓙre home again!\nI-Iⓙve been a good lad, Da. I promise!\n@c1@"
  es: "@aTarik@b¡Papi! ¡Has vuelto a casa!\nMi he piortado muy bien, papá. ¡Lo juro!\n@c1@"
  fr: "@aAchille@bPapaⓠ T'es revenu à la maisonⓠ\nJe... J'ai été bien sage, p'pa. J'te jure que c'est vraiⓠ\n@c1@"
  it: "@aBalduccio@bBabbone! Sei tornato!\nHo fatto il bravo, te lo giuro!\n@c1@"
  ja: "@a@bポポロ「あっ　パパ！　お帰りなさーい！\n\tうん。　ボク　いい子にしてたよ。\n@c1@"
"26":
  de: "@aTimo@bWenn ich groß bin, dann werde ich ganz, ganz reich. Dann könnt ihr alles haben, was ihr nur wollt.\n@c1@"
  en: "@aTipper@bIⓙm gonna make a mountain oⓙ gold when Iⓙm older. You anⓙ Ma will have everytinⓙ ye could ever want.\n@c1@"
  es: "@aTarik@bCuando sea miayor voy a consieguir una miontaña de oro. Tú y mamá vais a tiener todo lo que siemprie habéis quierido.\n@c1@"
  fr: "@aAchille@bQuand je serai grand, je gagnerai une montagne d'or. Toi et m'man, vous aurez tout ce que vous voudrez.\n@c1@"
  it: "@aBalduccio@bQuando sarò grande guadagnerò un mucchio di quattrini, così te e la mamma avrete tutto quello ch'avete sempre sognato!\n@c1@"
  ja: "@a@bポポロ「ボク　大きくなったら\n\tパパみたいになって　お金をもうけて\n\tパパやママに　楽させてあげるからね！\n@c1@"
"27":
  de: "@a@b*: He! Was %H860%Xwillst du%Ywollt ihr%Z denn hier?\nRaus mit %H860%Xdir%Yeuch%Z, aber dalli, ja?!\n@c3@"
  en: "@a@b*: Oi! Wot dⓙya think youⓙre doinⓙ?\nGet out anⓙ leave us alone, will ya!?\n@c3@"
  es: "@a@b*: ¡Eh! ¡Eh! Pero qué %H860%Xhaces%Yhacéis%Z.\n¡%H860%XDate%YDaos%Z el piro!\n@c3@"
  fr: "@a@b*ⓢ Oh làⓠ Vous faites quoi, làⓡ\nDégagez et laissez-nous tranquille, d'accordⓠⓑ\n@c3@"
  it: "@a@b*: Ehi! Cosa %H860%Xpensi%Ypensate%Z di fare?\n%H860%XEsci subito e lasciaci%YUscite subito e lasciateci%Z in pace, è chiaro?!?\n@c3@"
  ja: "@a@b＊「ちょっとちょっと。\n\t中に入ってこられちゃ　迷惑だよ。\n\tとっとと　出ていってくれ！\n@c3@"
"28":
