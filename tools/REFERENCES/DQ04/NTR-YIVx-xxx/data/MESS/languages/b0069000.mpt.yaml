  fr: "@a@b*ⓢ Mais ce n'est qu'une rumeur, bien sûr. Les gens adorent causerⓠ Enfin, j'espère que c'est juste des ragots...\n@c2@"
  it: "@a@b*: Sono solo delle voci, intendiamoci. Alla gente piace parlare! Comunque, spero sia solo un pettegolezzo...\n@c2@"
  ja: "@a@b＊「でも　ウワサだからねえ……。\n\tどこまで　本当だか……。\n@c2@"
"57":
  de: "@a@b*: Geht doch nichts über ein kühles Schlückchen nach der Arbeit.\n@c2@"
  en: "@a@b*: You canⓙt beat a nice cold drink after work.\n@c2@"
  es: "@a@b*: No hay nada como una buena cerveza bien fría después del trabajo.\n@c2@"
  fr: "@a@b*ⓢ Rien ne vaut une boisson bien fraîche après le travail.\n@c2@"
  it: "@a@b*: Dopo il lavoro, non c'è niente di meglio di una buona bibita!\n@c2@"
  ja: "@a@b＊「仕事のあとの　一杯は\n\tさいこーですなあ。\n@c2@"
"58":
  de: "@a@b*: Urgh. Warum seh ich doppelt?\nVielleicht hab ich zu viel getrunken.\n@c1@"
  en: "@a@b*: Urgh. Why am I seeing double?\nMaybe I drank too much.\n@c1@"
  es: "@a@b*: Argh. ¿Por qué veo doble?\nQuizá me he pasado con la bebida.\n@c1@"
  fr: "@a@b*ⓢ Oh... Pourquoi je vois doubleⓡ\nPeut-être que j'ai trop bu.\n@c1@"
  it: "@a@b*: Chi siamo? Da dove veniamo? Dove andiamo? Dove ho messo il portamonete? Queste sono le grandi domande della vita... \n@c1@"
  ja: "@a@b＊「ひっく！\n\tやだわー　酔ってきちゃった。\n@c1@"
"59":
  de: "@a@b*: Die königliche Hochzeit war einfach wunderbar.\n@c2@"
  en: "@a@b*: The royal wedding was absolutely splendid.\n@c2@"
  es: "@a@b*: La boda real ha sido realmente espléndida.\n@c2@"
  fr: "@a@b*ⓢ Le mariage royal était absolument splendide.\n@c2@"
  it: "@a@b*: Il matrimonio reale è stato assolutamente splendido.\n@c2@"
  ja: "@a@b＊「さすが　お姫さまと王子さまの\n\t結婚式は　豪華だったねえ。\n@c2@"
"60":
  de: "@a@b*: Davon habe ich immer geträumt ⓚⓛ dass mein großer Tag einmal so sein würde.\n@c2@"
  en: "@a@b*: I always dreamt that my big day would be like that.\n@c2@"
  es: "@a@b*: Siempre soñé con que mi gran día fuera así.\n@c2@"
  fr: "@a@b*ⓢ J'ai toujours rêvé que mon mariage se passe comme ça.\n@c2@"
  it: "@a@b*: Avrei voluto che anche le mie nozze fossero state tanto belle...\n@c2@"
  ja: "@a@b＊「あたしも　あんな結婚式を\n\tあげたかったよ。\n@c2@"
"61":
  de: "@a@b*: Selbst wenn die Welt jetzt untergeht ⓚⓛ ihre Liebe wird für immer sein... Da könnte man ja gleich ganz feuchte Augen kriegen.\n@c3@"
  en: "@a@b*: Even if the world comes to an end, their love will last forever... Itⓙs enough to bring tears to the eyes.\n@c3@"
  es: "@a@b*: Aunque el mundo llegue a su fin, su amor durará eternamente... Solo de pensarlo se me saltan las lágrimas.\n@c3@"
  fr: "@a@b*ⓢ Même si la fin du monde arrive, leur amour durera éternellement... Ça suffit à mettre les larmes aux yeux.\n@c3@"
  it: "@a@b*: Anche se il mondo dovesse svanire, il loro amore durerà per sempre... Che storia commovente.\n@c3@"
  ja: "@a@b＊「たとえ　世界が滅びようとも\n\tふたりの愛を　いつまでもか……。\n\t泣かせるよなあ。\n@c3@"
"62":
  de: "@a@b*: Seid Ihr wegen der königlichen Hochzeit hier?\n@c2@"
  en: "@a@b*: Have you come to see the royal wedding?\n@c2@"
  es: "@a@b*: ¿%H860%XHa%YHan%Z venido a presenciar la boda real?\n@c2@"
  fr: "@a@b*ⓢ Vous êtes là pour assister au mariage royalⓡ\n@c2@"
  it: "@a@b*: %H860%XSei%YSiete%Z qui per assistere al matrimonio reale?\n@c2@"
  ja: "@a@b＊「結婚式を見にきたのかな？\n@c2@"
"63":
  de: "@a@b*: Tretet einfach durch eine der Türen links oder rechts, um in die Burg zu kommen.\n@c2@"
  en: "@a@b*: Just take one of the doors to the left or right and go on inside the castle.\n@c2@"
  es: "@a@b*: %H860%XElija%YElijan%Z una de las puertas, a la izquierda o a la derecha, para entrar en el castillo.\n@c2@"
  fr: "@a@b*ⓢ Prenez l'une des portes sur la gauche ou sur la droite et entrez dans le château.\n@c2@"
  it: "@a@b*: %H860%XPrendi%YPrendete%Z una delle porte a destra o sinistra e %H860%Xprosegui%Yproseguite%Z all'interno del castello.\n@c2@"
  ja: "@a@b＊「ならば　左右にあるトビラより\n\t城内に入るがいい。\n@c2@"
"64":
  de: "@a@b*: Die prunkvollen königlichen Hochzeitszeremonien von Endor sind in der ganzen Welt berühmt.\n@c2@"
  en: "@a@b*: The royal marriage ceremonies of Endor are renowned across the world for their splendour.\n@c2@"
  es: "@a@b*: Las bodas reales de Endor son conocidas en todo el mundo por su esplendor.\n@c2@"
  fr: "@a@b*ⓢ Les cérémonies de mariage royales de Chandor sont célèbres dans le monde entier pour leur splendeur.\n@c2@"
  it: "@a@b*: I matrimoni reali di Endor sono rinomati in tutto il mondo per il loro sfarzo.\n@c2@"
  ja: "@a@b＊「エンドール王家の　結婚式といえば\n\t世界一　豪勢なことで有名なのだ。\n@c2@"
"65":
  de: "@a@b*: Ihr solltet die Gelegenheit nutzen und sie Euch ansehen, so lange Ihr hier seid. Viele würden gern dabei sein.\n@c2@"
  en: "@a@b*: You should take the opportunity to go and have a look while youⓙre here. Plenty of people would love to be able to say theyⓙd seen it.\n@c2@"
  es: "@a@b*: %H860%XDebería%YDeberían%Z aprovechar la oportunidad y echar un vistazo, mientras %H860%Xestá%Yestán%Z aquí. A mucha gente le gustaría poder decir que han estado presentes.\n@c2@"
  fr: "@a@b*ⓢ Vous devriez profiter de l'occasion pour y jeter un œil, tant que vous êtes là. Des tas de gens aimeraient pouvoir dire qu'ils ont vu ça.\n@c2@"
  it: "@a@b*: Visto che %H860%Xsei qui, facci%Ysiete qui, fateci%Z un salto. Un sacco di gente vorrebbe poter dire ⓕIo c'eroⓖ.\n@c2@"
  ja: "@a@b＊「またとない機会だから\n\tあなたも　ぜひ見ていくといい。\n\tきっと　みんなに　じまんできるぞ。\n@c2@"
"66":
  de: "@a@b*: Willkommen auf Burg Endor. Die Tore Endors stehen allen offen, jeder darf hier sein Glück versuchen.\n@c2@"
  en: "@a@b*: Welcome to Endor Castle. Our doors are always open to all, commoners and royalty alike.\n@c2@"
  es: "@a@b*: %H860%X%A120%XBienvenido%Z%B120%XBienvenida%Z%Y%R000%XBienvenidas%YBienvenidos%Z%Z al Castillo de Endor. Las puertas de Endor están abiertas para todos, para que todos puedan prosperar.\n@c2@"
  fr: "@a@b*ⓢ Bienvenue au château de Chandor. Les portes de Chandor sont grandes ouvertes à tous ceux qui aspirent à la prospérité. \n@c2@"
  it: "@a@b*: %H860%XTi%YVi%Z do il benvenuto al castello di Endor. Le porte di Endor sono aperte a chiunque agisca per il bene della comunità.\n@c2@"
  ja: "@a@b＊「エンドール城へ　ようこそ。\n\tわが国の城門は　民衆のために\n\t広く　開かれております。\n@c2@"
"67":
  de: "@a@b*: König Norberts Thronsaal? Einfach die Treppe hoch.\n@c2@"
  en: "@a@b*: King Norman's throne room is just upstairs.\n@c2@"
  es: "@a@b*: La sala del trono del rey Norman se encuentra arriba.\n@c2@"
  fr: "@a@b*ⓢ La salle du trône du roi Norbert est juste en haut.\n@c2@"
  it: "@a@b*: La sala del trono di Re Norman è di sopra.\n@c2@"
  ja: "@a@b＊「この上は　王さまのお部屋です。\n@c2@"
"68":
  de: "@a@b*: Wenn Ihr zum Kolosseum wollt, folgt einfach diesem Korridor und geht die Treppe hinunter.\n@c2@"
  en: "@a@b*: If you're headed for the Colosseum, just follow this corridor and take the stairs down.\n@c2@"
  es: "@a@b*: Si %H860%Xquieres dirigirte%Yqueréis dirigiros%Z al Coliseo, %H860%Xsigue%Yseguid%Z este pasillo y %H860%Xbaja%Ybajad%Z las escaleras.\n@c2@"
  fr: "@a@b*ⓢ Si vous voulez rejoindre le Colisée, suivez ce couloir et prenez les escaliers qui descendent.\n@c2@"
  it: "@a@b*: Per raggiungere l'Arena, %H860%Xsegui%Yseguite%Z questo corridoio e %H860%Xscendi%Yscendete%Z le scale.\n@c2@"
  ja: "@a@b＊「コロシアムへ　行きたいなら\n\tこの廊下をまっすぐ進み\n\t階段を　降りるといい。\n@c2@"
"69":
  de: "@a@b*: Ich hab ja gar nicht gewusst, dass die Prinzessin heimlich verliebt ist.\n@c1@"
  en: "@a@b*: I never realised the Princess had a secret love.\n@c1@"
  es: "@a@b*: Nunca me imaginé que la Princesa tuviera un amor secreto.\n@c1@"
  fr: "@a@b*ⓢ Je ne m'étais jamais rendu compte que la princesse avait un amour secret.\n@c1@"
  it: "@a@b*: Non mi ero mai resa conto che la Principessa avesse un amore segreto.\n@c1@"
  ja: "@a@b＊「お姫さまに　好きな人が\n\tいたなんて……。\n@c1@"
"70":
  de: "@a@b*: Und nun kann sie ihn sogar heiraten ⓚⓛ die Glückliche!\n@c1@"
  en: "@a@b*: Sheⓙs so lucky, being able to marry him like this.\n@c1@"
  es: "@a@b*: Qué afortunada, poder casarse con él de esta forma.\n@c1@"
  fr: "@a@b*ⓢ Elle a tellement de chance de pouvoir l'épouser comme ça.\n@c1@"
  it: "@a@b*: È stata fortunata a riuscire a sposarlo!\n@c1@"
  ja: "@a@b＊「でも　その人と結婚できたんだから\n\tよかったわよねえ。\n@c1@"
"71":
  de: "@a@b*: Weit im Osten von Casabranca soll sich eine riesige Wüste befinden.\n@c2@"
  en: "@a@b*: Folk say thereⓙs an enormous desert far to the east of Casabranca.\n@c2@"
  es: "@a@b*: Se dice que al este de Casablanca hay un extenso desierto.\n@c2@"
  fr: "@a@b*ⓢ Les gens racontent qu'il y a un immense désert loin à l'est de Casabranca.\n@c2@"
  it: "@a@b*: Pare che a est di Casabianca ci sia un deserto enorme.\n@c2@"
  ja: "@a@b＊「はるか　ブランカの東には\n\t大きな砂漠があるそうじゃ。\n@c2@"
"72":
  de: "@a@b*: Wenn man die Wüste durchquert und in die Hafenstadt im Süden kommt, kann man dort angeblich Schiffe und alles Mögliche kaufen!\n@c2@"
  en: "@a@b*: They also say that if you cross the desert and visit the port town to the south, they have ships for sale and everything!\n@c2@"
  es: "@a@b*: También se dice que si se cruza el desierto y se visita la ciudad portuaria hacia el sur, ¡se pueden comprar barcos y todo eso!\n@c2@"
  fr: "@a@b*ⓢ Ils disent aussi que si on traverse le désert et qu'on rejoint la ville portuaire, au sud, on y trouve des bateaux à vendre, et tout çaⓠ\n@c2@"
  it: "@a@b*: Inoltre, se si attraversa il deserto, si arriva al villaggio portuale che si trova a sud, dove vendono navi e altre merci!\n@c2@"
  ja: "@a@b＊「そして　砂漠をこえた先の\n\t南にある港町では　なんと\n\t船まで売ってるというぞ。\n@c2@"
"73":
  de: "@a@b*: Irgendwo da draußen erwacht gerade der Herr der Unterwelt.\n@c2@"
  en: "@a@b*: Somewhere out there, the Lord of the Underworld is in the process of reawakening.\n@c2@"
  es: "@a@b*: En algún lugar, el Señor del Inframundo está listo para resucitar.\n@c2@"
  fr: "@a@b*ⓢ Quelque part dans le monde, le Seigneur des Enfers est en train de se réveiller.\n@c2@"
  it: "@a@b*: Da qualche parte lì fuori, il Signore degli Inferi sta per risvegliarsi.\n@c2@"
  ja: "@a@b＊「世界のどこかで　地獄の帝王が\n\tよみがえりつつあるらしい。\n@c2@"
"74":
  de: "@a@b*: Leider denkt König Norbert nicht immer nach, ehe er den Mund aufmacht. Das bringt ihn manchmal etwas in Schwierigkeiten.\n@c2@"
  en: "@a@b*: Unfortunately, King Norman doesn't always think before he speaks and it can get him into a spot of bother every now and then.\n@c2@"
  es: "@a@b*: Desgraciadamente, el rey Norman no siempre piensa antes de hablar, lo que le causa problemas de vez en cuando.\n@c2@"
  fr: "@a@b*ⓢ Le roi Norbert ne réfléchit malheureusement pas toujours avant de parler, et cela le met parfois dans des situations délicates.\n@c2@"
  it: "@a@b*: Purtroppo, Re Norman a volte non riflette prima di parlare, e così finisce per mettersi nei guai.\n@c2@"
  ja: "@a@b＊「困ったことに　ここの王様は\n\t軽はずみで　思ったことを　すぐに\n\t実行しちゃうんです。\n@c2@"
"75":
  de: "@a@b*: Aber diese Hochzeitsfeier war von Anfang bis Ende einfach perfekt.\n@c2@"
  en: "@a@b*: But this wedding ceremony has been perfect from start to finish.\n@c2@"
  es: "@a@b*: Pero este enlace matrimonial ha sido perfecto, de principio a fin.\n@c2@"
  fr: "@a@b*ⓢ Mais cette cérémonie de mariage a été parfaite du début à la fin.\n@c2@"
  it: "@a@b*: Ma questa cerimonia è stata perfetta dall'inizio alla fine.\n@c2@"
  ja: "@a@b＊「でも　今回の結婚だけは\n\tほんとに　正解だと思いますよ。\n@c2@"
"76":
  de: "@a@b*: Dies ist der königliche Thronsaal. Ich muss Euch bitten, nicht herumzurennen und keinen unnötigen Lärm zu machen.\n@c2@"
  en: "@a@b*: This is the royal throne room. I must ask that you donⓙt run or make any unnecessary noise.\n@c2@"
  es: "@a@b*: Esta es la sala real del trono. %H860%XLe%YLes%Z tengo que pedir que no %H860%Xcorra ni haga%Ycorran ni hagan%Z ruidos innecesarios.\n@c2@"
  fr: "@a@b*ⓢ Ceci est la salle du trône royal. Je dois vous demander de ne pas courir ni faire de bruit.\n@c2@"
  it: "@a@b*: Questa è la sala del trono. %H860%XTi%YVi%Z prego di non correre e di non fare rumori molesti.\n@c2@"
  ja: "@a@b＊「ここは　玉座の間です。\n\tむやみに走ったり　大声を出して\n\tわめいたり　しないでくださいよ。\n@c2@"
"77":
  de: "@a@b*: Seid Ihr wegen einer Audienz mit König Norbert gekommen? Tut mir leid, er wohnt gerade der königlichen Hochzeit bei.\n@c2@"
  en: "@a@b*: Have you come for an audience with King Norman? Iⓙm afraid heⓙs attending the royal wedding at present.\n@c2@"
  es: "@a@b*: ¿%H860%XHas%YHabéis%Z venido a solicitar una audiencia con el rey Norman? Me temo que en estos momentos se encuentra en la boda real.\n@c2@"
  fr: "@a@b*ⓢ Vous êtes là pour une audience avec le roi Norbertⓡ Je regrette, mais il est en train d'assister au mariage royal.\n@c2@"
  it: "@a@b*: %H860%XSei%YSiete%Z qui per avere un'udienza con Re Norman? Mi spiace, ma il Re sta partecipando al matrimonio reale.\n@c2@"
  ja: "@a@b＊「王さまに　会いに来たのか？\n\tしかし　わが王は　今は\n\t結婚式に出席しておるのだ。\n@c2@"
"78":
  de: "@a@b*: Laut einigen uralten Dokumenten hat der Herr der Unterwelt die ultimative Stufe der Evolution erreicht.\n@c2@"
  en: "@a@b*: According to some ancient documents Iⓙve been reading, the Lord of the Underworld achieved the ultimate state of evolution.\n@c2@"
  es: "@a@b*: Según unos antiguos documentos que he consultado, el Señor del Inframundo alcanzó el estado supremo de la evolución.\n@c2@"
  fr: "@a@b*ⓢ D'après certains documents anciens que j'ai pu lire, le Seigneur des Enfers avait atteint le stade ultime de l'Évolution.\n@c2@"
  it: "@a@b*: Secondo alcuni antichi documenti che ho consultato, il Signore degli Inferi riuscì a raggiungere l'ultimo stato evolutivo.\n@c2@"
  ja: "@a@b＊「古い書物によると　地獄の帝王とは\n\t究極の進化をとげた生物らしい。\n@c2@"
"79":
  de: "@a@b*: Seine Macht war für diese Welt zu gewaltig geworden, und so beschlossen die Götter, er müsse weggesperrt werden.\n@c2@"
  en: "@a@b*: His powers were too formidable for this world, so the gods decided he must be sealed away.\n@c2@"
  es: "@a@b*: Sus poderes eran tan superiores a este mundo que los dioses decidieron que debían encerrarlo.\n@c2@"
  fr: "@a@b*ⓢ Ses pouvoirs étaient devenus trop extraordinaires pour ce monde, alors les dieux ont décidé de l'enfermer.\n@c2@"
  it: "@a@b*: I suoi poteri erano troppo spaventosi per questo mondo, quindi gli dei decisero di imprigionarlo per sempre.\n@c2@"
  ja: "@a@b＊「その能力の　あまりのすごさに\n\tこの世に存在してはならぬものと\n\t神々が封じこめた……とある。\n@c2@"
"80":
  de: "@a@b*: Das Ganze hört sich seltsam an ⓚⓛ fast so, als ob die Naturgesetze für ihn nicht gelten.\n@c2@"
  en: "@a@b*: It sounds like he was a creature to whom the laws of evolution mysteriously didnⓙt apply.\n@c2@"
  es: "@a@b*: Parece como si se tratara de una criatura ajena a las leyes de la evolución, misteriosamente.\n@c2@"
  fr: "@a@b*ⓢ Il semblait s'agir d'une créature à laquelle, pour des raisons mystérieuses, les lois de l'Évolution ne s'appliquaient pas.\n@c2@"
  it: "@a@b*: Pare che fosse una creatura misteriosamente immune alle leggi dell'evoluzione.\n@c2@"
  ja: "@a@b＊「いわば　進化論から外れた\n\t生物だったというわけだな。\n@c2@"
"81":
  de: "@a@b*: Dieser Tisch muss so sauber sein, dass König Norbert davon essen könnte.\n@c2@"
  en: "@a@b*: This table has to be clean enough that King Norman could eat his supper off it.\n@c2@"
  es: "@a@b*: Esta mesa tiene que quedar tan limpia que el propio rey Norman pueda comer en ella.\n@c2@"
  fr: "@a@b*ⓢ Cette table doit être assez propre pour que le roi Norbert puisse prendre son souper dessus.\n@c2@"
  it: "@a@b*: Questo tavolo dev'essere tanto pulito che Re Norman dovrebbe potervi mangiare sopra direttamente, se volesse farlo.\n@c2@"
  ja: "@a@b＊「テーブルを　きれいにふかないと。\n\tせっせ　せっせ。\n@c2@"
"82":
  de: "@a@b*: Also wirklich! Ich muss Euch bitten zu gehen. Dies ist das königliche Ankleidezimmer.\n@c1@"
  en: "@a@b*: I say! I must ask you to take your leave.\nThis is the royal dressing room.\n@c1@"
  es: "@a@b*: ¡Bueno! Tengo que %H860%Xpedirle que se marche%Ypedirles que se marchen%Z.\nEste es el vestidor real.\n@c1@"
  fr: "@a@b*ⓢ Mais enfinⓠ Veuillez partir, s'il vous plaît.\nCeci est le dressing royal.\n@c1@"
  it: "@a@b*: Ma insomma! Sono costretta a %H860%Xchiederti%Ychiedervi%Z di uscire da qui.\nQuesto è il guardaroba reale.\n@c1@"
  ja: "@a@b＊「お引き取りください！\n\tここは　王さまと姫さまの\n\t衣裳部屋です。\n@c1@"
"83":
  de: "@a@b*: Ein gewisser Torneko soll es geschafft haben, die Wüste drüben im Osten zu durchqueren.\n@c2@"
  en: "@a@b*: I hear that a man called Torneko managed to cross the desert in the far east.\n@c2@"
  es: "@a@b*: Me han dicho que un hombre llamado Torneko consiguió cruzar el desierto en el lejano oriente.\n@c2@"
  fr: "@a@b*ⓢ J'ai entendu dire qu'un homme appelé Torneko avait réussi à traverser le désert, loin à l'est.\n@c2@"
  it: "@a@b*: Ho saputo che un uomo di nome Baldo Baldini è riuscito ad attraversare il deserto a est.\n@c2@"
  ja: "@a@b＊「トルネコという男が\n\tはるか東の砂漠を　越えたらしい。\n@c2@"
"84":
  de: "@a@b*: Vielleicht ging es ihm nur ums Geld, aber ich finde, es war tapfer von ihm, eine solche Reise auf sich zu nehmen.\n@c2@"
  en: "@a@b*: He may just be doing it to make money, but I admire him for being brave enough to attempt a journey like that.\n@c2@"
  es: "@a@b*: Puede que solo lo hiciera para ganar dinero, pero le admiro por tener el valor de intentar un viaje como ese.\n@c2@"
  fr: "@a@b*ⓢ Peut-être qu'il l'a fait juste pour gagner de l'argent, mais je l'admire quand même d'avoir été assez courageux pour tenter un voyage pareil.\n@c2@"
  it: "@a@b*: Forse lo fa solo per soldi, ma comunque lo ammiro per il coraggio dimostrato nell'affrontare un simile viaggio.\n@c2@"
  ja: "@a@b＊「金もうけのためとはいえ\n\tなかなか　勇気のあるヤツだな。\n@c2@"
"85":
  de: "@a@b*: Oh du liebe Güte. So viel Wäsche und so wenig Zeit, um sie zu waschen!\n@c2@"
  en: "@a@b*: Dearie me. So many things to wash and not enough minutes in the day to wash them in!\n@c2@"
  es: "@a@b*: Ay, por la Diosa. ¡Tanto por lavar y tan poco tiempo para lavarlo!\n@c2@"
  fr: "@a@b*ⓢ Pauvre de moi. Tant de choses à laver et si peu de temps dans la journée pour le faireⓠ\n@c2@"
  it: "@a@b*: Un'intera giornata di lavoro non mi basterà per lavare tutta questa roba! Povera me...\n@c2@"
  ja: "@a@b＊「よいしょ　よいしょ。\n\t洗い物が多くて　たいへん！\n@c2@"
"86":
  de: "@a@b*: Dies ist die Küche der Burg.\n@c1@"
  en: "@a@b*: This is the castle kitchen.\n@c1@"
  es: "@a@b*: Esta es la cocina del castillo.\n@c1@"
  fr: "@a@b*ⓢ Vous êtes dans la cuisine du château.\n@c1@"
  it: "@a@b*: Questa è la cucina del castello.\n@c1@"
  ja: "@a@b＊「ここは　お城の台所よ。\n@c1@"
"87":
  de: "@a@b*: Seid vor Psaro dem Metzler auf der Hut, ja?\n@c2@"
  en: "@a@b*: Watch out for that Psaro the Manslayer!\n@c2@"
  es: "@a@b*: %H860%XTen%YTened%Z cuidado con Psaro el Carnicero, ¿me %H860%Xoyes%Yoís%Z?\n@c2@"
  fr: "@a@b*ⓢ Méfiez-vous de ce Psaro l'Exterminateur, surtoutⓠ\n@c2@"
  it: "@a@b*: %H860%XFai%YFate%Z attenzione a Psaro il Massacratore, mi raccomando!\n@c2@"
  ja: "@a@b＊「デスピサロに　気をつけるんだ！\n@c2@"
"88":
  de: "@a@b*: Das ist das Kolosseum.\nHier findet die königliche Hochzeit statt.\n@c2@"
  en: "@a@b*: This is the Colosseum.\nThe royal wedding is taking place here.\n@c2@"
  es: "@a@b*: Este es el Coliseo.\nLa boda real se está celebrando aquí.\n@c2@"
  fr: "@a@b*ⓢ Ceci est le Colisée.\nC'est ici que se déroule le mariage royal.\n@c2@"
  it: "@a@b*: Questa è l'Arena.\nIl matrimonio reale si svolge qui.\n@c2@"
  ja: "@a@b＊「ここは　コロシアム。\n\t結婚式の会場です。\n@c2@"
"89":
  de: "@a@b*: Dies ist das Vorbereitungszimmer von Braut und Bräutigam. Hier dürfen nur Familienangehörige hinein.\n@c2@"
  en: "@a@b*: This is the bride and groom's preparation room. Only family members are allowed inside.\n@c2@"
  es: "@a@b*: Esta es la sala de preparativos de los novios. Solo se permite el paso a los familiares.\n@c2@"
  fr: "@a@b*ⓢ C'est là que se préparent les futurs époux.\nSeuls les membres de la famille sont autorisés à entrer.\n@c2@"
  it: "@a@b*: Questa è la stanza in cui si preparano gli sposi. Solo i membri della famiglia hanno il permesso di entrare.\n@c2@"
  ja: "@a@b＊「奥は　新郎新婦の控え室です。\n\t親族以外　入れないことになってます。\n@c2@"
"90":
  de: "@a@b*: Ah, Ihr seid wegen der königlichen Hochzeit hier, nicht wahr? Geht einfach die Treppe rechts hinauf zu den Zuschauerplätzen.\n@c2@"
  en: "@a@b*: Ah, youⓙve come to see the royal wedding, have you? Just take the steps to the right up to the spectators' seats.\n@c2@"
  es: "@a@b*: ¡Oh!, ¿%H860%Xha%Yhan%Z venido para presenciar la boda real, verdad? %H860%XSiga%YSigan%Z la escalera de la derecha, hasta los asientos de los espectadores.\n@c2@"
  fr: "@a@b*ⓢ Ah, vous êtes là pour assister au mariage royal, n'est-ce pasⓡ Prenez les escaliers à droite, jusqu'aux sièges des spectateurs.\n@c2@"
  it: "@a@b*: Ah, %H860%Xsei%Ysiete%Z qui per assistere al matrimonio reale, vero? Per raggiungere le tribune riservate al pubblico, %H860%Xprendi%Yprendete%Z le scale a destra. \n@c2@"
  ja: "@a@b＊「結婚式を　見に来たのですね。\n\tでは　右の階段より\n\t観客席に　あがってください。\n@c2@"
"91":
  de: "@a@b*: Es geht doch nichts über eine schöne Hochzeit!\n@c2@"
  en: "@a@b*: You canⓙt beat a good wedding!\n@c2@"
  es: "@a@b*: ¡No hay nada mejor que una buena boda!\n@c2@"
  fr: "@a@b*ⓢ Rien ne vaut un beau mariageⓠ\n@c2@"
  it: "@a@b*: Adoro assistere ai matrimoni!\n@c2@"
  ja: "@a@b＊「結婚式というのは\n\tいつ見ても　いいものだな。\n@c2@"
"92":
  de: "@a@b*: Gut gemacht, Prinz Hinz! Wir Seeleute haben die Prinzessin ja schon immer verehrt.\n@c0@"
  en: "@a@b*: Bully for Prince Regan! The Princess was the idol of us sailors first, you know.\n@c0@"
  es: "@a@b*: ¡Bravo por el Príncipe Alí! La Princesa siempre fue nuestro ídolo, ¿%H860%Xsabes%Ysabéis%Z?\n@c0@"
  fr: "@a@b*ⓢ Le prince Réginald est vraiment verniⓠ\nVous savez, au départ, la princesse était notre idole à tous, nous autres marins.\n@c0@"
  it: "@a@b*: E bravo il Principe Vitellozzo! Si è preso in moglie la Principessa, l'idolo di noi marinai.\n@c0@"
  ja: "@a@b＊「くそーっ！\n\tモニカ姫は　オレたち船乗りの\n\tアイドルだったのにぃ。\n@c0@"
"93":
  de: "@a@b*: Ach, ich wünschte, die glückliche Braut wäre ich!\n@c1@"
  en: "@a@b*: Oh, I wish I was the one getting married!\n@c1@"
  es: "@a@b*: ¡Oh, cómo desearía ser yo la que me casara!\n@c1@"
  fr: "@a@b*ⓢ Oh, si seulement c'était moi, la mariéeⓠ\n@c1@"
  it: "@a@b*: Oh, quanto vorrei essere io la sposa!\n@c1@"
  ja: "@a@b＊「あ～あ　わたしも\n\t結婚したくなっちゃった。\n@c1@"
"94":
  de: "@a@b*: Das ist bestimmt die längste Hochzeit, auf der ich je war.\n@c2@"
  en: "@a@b*: This must be the longest wedding Iⓙve ever been to in my life.\n@c2@"
  es: "@a@b*: Esta debe ser la boda más larga en la que he estado nunca.\n@c2@"
  fr: "@a@b*ⓢ C'est probablement le mariage le plus long que j'ai jamais vu de ma vie.\n@c2@"
  it: "@a@b*: Questo dev'essere il matrimonio più lungo a cui io abbia mai partecipato.\n@c2@"
  ja: "@a@b＊「しかし　この結婚式は\n\tいったい　いつまで続くのだろう。\n@c2@"
"95":
  de: "@a@b*: Seht sie Euch nur an! Wie sie herumschnäbeln! Also ich weiß ja nicht. Und jetzt liegen sie sich auch noch in den Armen!\n@c3@"
  en: "@a@b*: Look at ⓙem! Kissinⓙ they are! I dunno.\nAnⓙ now theyⓙve got their arms ⓙround each other anⓙ everyfinⓙ!\n@c3@"
  es: "@a@b*: ¡Míralos! ¡Se están besando! No sé.\n¡Y ahora incluso se abrazan y todo!\n@c3@"
  fr: "@a@b*ⓢ Regardez-lesⓠ Ils s'embrassentⓠ Ça alors.\nEt maintenant, ils se prennent dans les bras, et toutⓠ\n@c3@"
  it: "@a@b*: Si stanno baciando! Pensa te.\nE ora si stanno abbracciando!\nEh! Eh! Eh! Chissà cosa faranno dopo... \n@c3@"
  ja: "@a@b＊「それー！　そこでキスをするんだ！\n\tああっ　イライラするなあ！\n\tほら！　肩をだきよせて！\n@c3@"
"96":
  de: "@a@b*: Hick! Die Ehe isch des Mannes Untergang, das sach ich Euch. Meine Alte isch eischkalt. Eischkalt!\n@c2@"
  en: "@a@b*: Hic! Marriage is the death of a man, I tell you.\nMy old lady's as cold as ice these days.\n@c2@"
  es: "@a@b*: ¡Hip! El matrimonio es la muerte de los hombres, te lo aseguro. Mi mujer está fría como el hielo últimamente.\n@c2@"
  fr: "@a@b*ⓢ Hicⓠ Le mariage, c'est la mort d'un homme, j'vous l'dis. Ma vieille femme est un vrai glaçon, aujourd'hui.\n@c2@"
  it: "@a@b*: Hic! Il matrimonio è la tomba dell'amore. Mia moglie è fredda come il ghiashio ormai. Hic!\n@c2@"
  ja: "@a@b＊「ウィ～ック。\n\t結婚なんて　人生の墓場でっせ。\n\tカミさん　最近　冷たくてさ……。\n@c2@"
"97":
  de: "@a@b*: Wisst Ihr, wenn mir der Richtige begegnen und um meine Hand anhalten würde, dann könnte ich...\n@c1@"
  en: "@a@b*: You know, if the right person came along and proposed to me, I might just...\n@c1@"
  es: "@a@b*: Bueno, si la persona adecuada apareciese y se me declarase, quizás yo...\n@c1@"
  fr: "@a@b*ⓢ Vous savez, si la bonne personne se présentait pour demander ma main, je crois que...\n@c1@"
  it: "@a@b*: Eppure, se incontrassi la persona giusta, forse potrei... \n@c1@"
  ja: "@a@b＊「わたくしも　もしステキな人に\n\t求婚されたら……\n@c1@"
"98":
  de: "@a@b*: Nun, falls es dazu käme, könnte dies ja nur der Wille der Göttin sein. Dann müsste ich wohl mein Ordensleben aufgeben.\n@c1@"
  en: "@a@b*: Well, if it happened thus, it could only be the will of the Goddess. I might just have to give up the life of the cloth, I suppose.\n@c1@"
  es: "@a@b*: En fin, si algo así pasase, sería voluntad de la Diosa. Tendría que dejar los hábitos, supongo...\n@c1@"
  fr: "@a@b*ⓢ Enfin, si cela se produisait, ce ne pourrait qu'être la volonté de la Déesse. Dans ce cas, je n'aurais plus qu'à quitter l'habit, je suppose.\n@c1@"
  it: "@a@b*: Certo, se una cosa del genere dovesse mai accadere, sarebbe solo per volere della dea! In tal caso, non potrei fare a meno di dire addio alla vita ecclesiastica.\n@c1@"
  ja: "@a@b＊「それも　神のお導き。\n\tシスターは辞めちゃうかも。\n@c1@"
"99":
  de: "@a@b*: Meine Frau war jung und strahlend schön, als ich sie zum Altar geführt habe. Ach, waren das noch Zeiten...\n@c2@"
  en: "@a@b*: My wife was a beautiful young thing when I married her. Ah, those were the days...\n@c2@"
  es: "@a@b*: Mi mujer era muy hermosa cuando me casé con ella. Ah, qué tiempos aquellos...\n@c2@"
  fr: "@a@b*ⓢ Ma femme était une magnifique jeune fille, quand je l'ai épousée. Ah, c'était le bon temps...\n@c2@"
  it: "@a@b*: Quando l'ho sposata, mia moglie era un bellissimo fiore. Ora, invece, è un ramo secco... Sigh!\n@c2@"
  ja: "@a@b＊「結婚した当時は　わしの妻も\n\tピチピチしとったのにのう。\n@c2@"
"100":
  de: "@a@b*: Ha-püh... Ha-püh...\nNichts... zu... berichten...\nHa-püh...\n@c2@"
  en: "@a@b*: Ah-phew... Ah-phew...\nNo-thing...to-report...\nAh-phew...\n@c2@"
  es: "@a@b*: Ah, fiuuu... Ah-fiuuu...\nNa-da... que de-cir...\nAh-fiuuu...\n@c2@"
  fr: "@a@b*ⓢ Ron-pfff... Ron-pfff...\nRien... à... signaler...\nRon-pfff...\n@c2@"
  it: "@a@b*: Ronf... fiuuu... Ronf... fiuuu... Niente da segnalare... Ronf... fiuuu...\n@c2@"
  ja: "@a@b＊「むにゃむにゃ……。\n\t異常なーし……むにゃ。\n@c2@"
"101":
  de: "@a@b*: Was schleicht Ihr denn mitten in der Nacht in der Burg herum?\n@c2@"
  en: "@a@b*: What do you think you're doing prowling about the castle at this time of night?\n@c2@"
  es: "@a@b*: ¿Qué %H860%Xcrees que estás haciendo%Ycreéis que estáis haciendo%Z merodeando por el castillo a estas horas de la noche?\n@c2@"
  fr: "@a@b*ⓢ Que faites-vous à rôder dans le château à une heure pareilleⓡ\n@c2@"
  it: "@a@b*: Che ci %H860%Xfai%Yfate%Z al castello a quest'ora di notte?\n@c2@"
  ja: "@a@b＊「こんな夜更けに\n\tお城に　入ってくるとは！\n@c2@"
"102":
  de: "@a@b*: Ich kann Euch nicht einfach so hier herumlaufen lassen. Na los, raus mit Euch!\n@c2@"
  en: "@a@b*: I canⓙt let you just wander about as you please. Go on now, get out!\n@c2@"
  es: "@a@b*: No puedo permitir que %H860%Xte pasees%Yos paseéis%Z por donde %H860%Xte%Yos%Z apetezca. ¡Vamos, largo de aquí!\n@c2@"
  fr: "@a@b*ⓢ Je ne peux pas vous laisser vous promener comme ça, à votre guise. Allons, sortez maintenantⓠ\n@c2@"
  it: "@a@b*: È vietato stare qui. %H860%XVai%YAndate%Z via, forza!\n@c2@"
  ja: "@a@b＊「わたしが　見つけた以上\n\t黙っているわけには　ゆかぬ。\n\tささ　立ち去られよ！\n@c2@"
"103":
  de: "@a@b*: Ha-püh... Ha-püh...\n@c2@"
  en: "@a@b*: Ah-phew... Ah-phew...\n@c2@"
  es: "@a@b*: Ah-fiuuu... Ah-fiuuu...\n@c2@"
  fr: "@a@b*ⓢ Ron-pfff... Ron-pfff...\n@c2@"
  it: "@a@b*: Ronf... Ronf...\n@c2@"
  ja: "@a@b＊「ぐうぐう……。\n@c2@"
"104":
  de: "@a@b*: Na toll!\nDer alte Mann redet schon wieder wirres Zeug.\n@c2@"
  en: "@a@b*: Here we go.\nThe old manⓙs talking rubbish again.\n@c2@"
  es: "@a@b*: Ya estamos.\nEl viejo está diciendo tonterías otra vez.\n@c2@"
  fr: "@a@b*ⓢ Et c'est reparti.\nL'ancêtre recommence à dire n'importe quoi.\n@c2@"
  it: "@a@b*: Ci risiamo... Il vecchio sta blaterando di nuovo le sue solite sciocchezze.\n@c2@"
  ja: "@a@b＊「やれやれ　また　じいさんの\n\tたわ言が始まったよ。\n@c2@"
"105":
  de: "@a@b*: König Norbert und Prinzessin Veronica haben sich bereits in ihre Gemächer zurückgezogen.\n@c2@"
  en: "@a@b*: King Norman and Princess Veronica have already retired to their chambers.\n@c2@"
  es: "@a@b*: El rey Norman y la princesa Verónica ya se han retirado a sus aposentos.\n@c2@"
  fr: "@a@b*ⓢ Le roi Norbert et la princesse Véronica se sont déjà retirés dans leurs chambres.\n@c2@"
  it: "@a@b*: Re Norman e la Principessa Veronica si sono già ritirati nelle loro stanze.\n@c2@"
  ja: "@a@b＊「王様と　お姫さまは\n\tすでに　お休みでございます。\n@c2@"
"106":
  de: "@a@b*: Ich räume besser ein wenig auf. Es gibt immer was zu tun, nicht wahr?\n@c2@"
  en: "@a@b*: Iⓙd better get things tidied up.\nItⓙs a busy old life.\n@c2@"
  es: "@a@b*: Mejor será que me ponga a recogerlo todo.\nEs una vida muy ajetreada.\n@c2@"
  fr: "@a@b*ⓢ Je ferais bien de tout nettoyer.\nVous parlez d'une vie activeⓠ\n@c2@"
  it: "@a@b*: Sarà meglio che faccia un po' di pulizie.\nChe vita da cani!\n@c2@"
  ja: "@a@b＊「さあ　かたづけなきゃ。\n\tせっせ　せっせ……。\n@c2@"
"107":
  de: "@aPrinzessin Veronica@bZzz... Vergib mir, Vater... Zzz...\n@c1@"
  en: "@aPrincess Veronica@bZzz... Forgive me, Father... Zzz...\n@c1@"
  es: "@aPrincesa Verónica@bZzz... Perdóname, padre... Zzz...\n@c1@"
  fr: "@aPrincesse Véronica@bZzz... Pardonne-moi, Père... zzz...\n@c1@"
  it: "@aPrincipessa Veronica@bZzz... Perdonami, padre... Zzz...\n@c1@"
  ja: "@a@bモニカ「すやすや……。\n\tお父さま　ごめんなさい……。\n\tすやすや……。\n@c1@"
"108":
  de: "@aPrinz Hinz@bAch, du meine Vroni... Du mein Augenstern... Zzz...\n@c2@"
  en: "@aPrince Regan@bOh, Ronnie... I love you... Zzz...\n@c2@"
  es: "@aPríncipe Alí@bOh, Vero... Ti quiero... Zzz...\n@c2@"
  fr: "@aPrince Réginald@bOh, Nini... je t'aime... zzz...\n@c2@"
  it: "@aPrincipe Vitellozzo@bOh, Veronica... Ti amo... Zzz...\n@c2@"
  ja: "@a@bリック「モニカ……\n\t愛してるよ……。\n\tぐうぐう……。\n@c2@"
"109":
  de: "@aKönig Norbert@bHa ha. Darauf wäre ich ja nie gekommen, dass die Prinzessin schon so bald heiraten würde.\n@c2@"
  en: "@aKing Norman@bHa ha. I never imagined for one minute that the Princess would be wed so soon.\n@c2@"
  es: "@aRey Norman@b¡Ja, ja! Ni por un minuto imaginé que la Princesa se casaría tan pronto.\n@c2@"
  fr: "@aRoi Norbert@bHa ha. Je n'aurais jamais cru une seule seconde que la princesse serait mariée si tôt.\n@c2@"
  it: "@aRe Norman@bAh! Ah! Ah! Non avrei mai immaginato che la Principessa si sarebbe sposata tanto presto!\n@c2@"
  ja: "@a@b王「わっはっはっ。\n\tまさか　こんなに早く　姫が\n\t結婚するとは思わなかったわい。\n@c2@"
"110":
  de: "@aKönig Norbert@bUnd nun wurde mir wohl auch noch mein Schlafgemach abspenstig gemacht. Ha ha!\n@c2@"
  en: "@aKing Norman@bNow I seem to be without a sleeping chamber all of a sudden. Ha ha!\n@c2@"
  es: "@aRey Norman@bAhora parece que de repente me he quedado sin aposentos para dormir. ¡Ja, ja!\n@c2@"
  fr: "@aRoi Norbert@bOn dirait que je me retrouve d'un seul coup privé de chambre à coucher. Ha haⓠ\n@c2@"
  it: "@aRe Norman@bE invece, all'improvviso, eccola maritata. Ah! Ah! Ah!\n@c2@"
  ja: "@a@b王「わしの寝るところが\n\tなくなってしまったのじゃよ。\n\tわっはっはっ。\n@c2@"
"111":
  de: "@a@b*: Alles deutet darauf hin, dass Psaro der Metzler ein Ungeheuer ist! Schließlich ist er mitten im Turnier verschwunden.\n㈡\n*: Vielleicht ist an den Gerüchten ja was dran...\n@c2@"
  en: "@a@b*: It looks like Psaro the Manslayer was a monster! He did disappear halfway through the tournament. Maybe the rumours are true...\n@c2@"
  es: "@a@b*: ¡Parece que Psaro el Carnicero era un monstruo! Desapareció a mitad del torneo. Puede que los rumores sean ciertos...\n@c2@"
  fr: "@a@b*ⓢ Il paraît que Psaro l'Exterminateur était un monstreⓠ Il a disparu au beau milieu du tournoi. Peut-être que les rumeurs sont vraies...\n@c2@"
  it: "@a@b*: Si dice che Psaro il Massacratore in realtà sia un mostro! In effetti è scomparso inspiegabilmente durante il torneo.\n㈡\n*: Chissà, forse le voci sono fondate...\n@c2@"
  ja: "@a@b＊「デスピサロが　魔物だったなんて……。\n\t途中でいなくなったし　やっぱり\n\tこのうわさは　ホントなのかねえ。\n@c2@"
"112":
  de: "@a@b*: Psaro hat das Turnier abgebrochen, weil er etwas Wichtiges zu erledigen hatte. Warum sollte er sonst einfach so verschwinden?\n@c1@"
  en: "@a@b*: Psaro the Manslayer must have disappeared because he had more important things to do than fight in the Endor Tourney.\n@c1@"
  es: "@a@b*: Psaro se retiró del torneo porque tenía asuntos urgentes que resolver. ¿Por qué si no habría desaparecido de ese modo?\n@c1@"
  fr: "@a@b*ⓢ Psaro a sûrement abandonné le tournoi parce qu'il avait quelque chose d'urgent à faire. Sinon, je ne vois pas pourquoi il aurait disparu.\n@c1@"
  it: "@a@b*: Psaro si è ritirato dal torneo perché aveva da sbrigare degli affari molto urgenti.\n㈡\n*: Altrimenti, per quale altro motivo avrebbe mai abbandonato la competizione? Aveva la vittoria in tasca!\n@c1@"
  ja: "@a@b＊「デスピサロが　いなくなったのは\n\t武術大会に出るよりも\n\t大事な用が　できたからよ！\n@c1@"
"113":
  de: "@a@b*: Die Frauen plaudern den lieben langen Tag über dies und das und jenes. Da komm ich nicht mehr mit.\n@c2@"
  en: "@a@b*: The women ramble on about this and that all day long. I can't keep up.\n@c2@"
  es: "@a@b*: Las mujeres se pasan todo el día cotilleando. No consigo mantenerme al día.\n@c2@"
  fr: "@a@b*ⓢ Les femmes n'arrêtent pas de parler de tout et de rien à longueur de journée. Je n'arrive pas à suivre.\n@c2@"
  it: "@a@b*: Le donne non fanno altro che parlare tutto il giorno. Non ne posso più!\n@c2@"
  ja: "@a@b＊「どうも　女たちのおしゃべりは\n\tとりとめがなくて\n\tついてゆけんな。\n@c2@"
"114":
  de: "@a@b*: Die Hochzeitsfeierlichkeiten finden nur tagsüber statt.\n@c2@"
  en: "@a@b*: The wedding celebrations only take place during the day.\n@c2@"
  es: "@a@b*: Las celebraciones nupciales solo tienen lugar durante el día.\n@c2@"
  fr: "@a@b*ⓢ Les cérémonies de mariage ne se déroulent que pendant la journée.\n@c2@"
  it: "@a@b*: Le nozze si celebrano esclusivamente di giorno.\n@c2@"
  ja: "@a@b＊「結婚式は　昼間だけだ。\n@c2@"
"115":
  de: "@a@b*: In Endor werden Hochzeiten normalerweise mehrere Tage lang gefeiert.\n@c2@"
  en: "@a@b*: Itⓙs custom in Endor for a wedding to go on for several days.\n@c2@"
  es: "@a@b*: En Endor, es costumbre que las bodas duren varios días.\n@c2@"
  fr: "@a@b*ⓢ À Chandor, la coutume veut qu'un mariage dure plusieurs jours.\n@c2@"
  it: "@a@b*: A Endor è tradizione che il matrimonio si festeggi per più giorni.\n@c2@"
  ja: "@a@b＊「この国のしきたりで\n\t結婚式は　何日も続く。\n@c2@"
"116":
  de: "@a@b*: Also könnt Ihr morgen wiederkommen und Euch das Ganze dann ansehen.\n@c2@"
