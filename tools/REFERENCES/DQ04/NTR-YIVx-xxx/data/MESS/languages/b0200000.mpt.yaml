"0":
  de: "@a@b*: Was ist denn, %a00090?\nHast du genug?\n@c2@"
  en: "@a@b*: What's the matter, %a00090?\nHave you had enough?\n@c2@"
  es: "@a@b*: ¿Qué ocurre, %a00090?\n¿Estás %A090%Xcansado%Z%B090%Xcansada%Z?\n@c2@"
  fr: "@a@b*ⓢ Eh bien alors, %a00090ⓡ\nTu en as assezⓡ\n@c2@"
  it: "@a@b*: Che succede, %a00090?\nNe hai già abbastanza?\n@c2@"
  ja: "@a@b＊「どうした？　%a00090。\n\tもう　降参かい？\n@c2@"
"1":
  de: "@a@b*: Gut, dann soll's das für heute gewesen sein.\n@c2@"
  en: "@a@b*: Very well, let us call it a day.\n@c2@"
  es: "@a@b*: Muy bien, lo podemos dejar por hoy.\n@c2@"
  fr: "@a@b*ⓢ Très bien. Dans ce cas, c'est terminé pour aujourd'hui.\n@c2@"
  it: "@a@b*: D'accordo. Per oggi basta così.\n@c2@"
  ja: "@a@b＊「そうだな。　今日は　このくらいに\n\tしておこう……。\n@c2@"
"2":
  de: "@a@b*: Es ist meine Aufgabe, aus dir so schnell wie möglich %A090%Xeinen Krieger%Z%B090%Xeine Kriegerin%Z zu machen. Aber Eile mit Weile, wie man sagt.\n@c2@"
  en: "@a@b*: 'Tis my job to make a warrior of you as swiftly\nas possible, but soon enough, if well enough, as\nthey say.\n@c2@"
  es: "@a@b*: Mi labor es hacer de ti %A090%Xun guerrero%Z%B090%Xuna guerrera%Z lo antes posible pero como se suele decir, vísteme despacio que tengo prisa.\n@c2@"
  fr: "@a@b*ⓢ Mon travail consiste à faire de toi %A090%Xun combattant%Z%B090%Xune combattante%Z le plus vite possible, mais comme dit le proverbeⓢ ⓥPlus on se hâte, moins on avanceⓦ.\n@c2@"
  it: "@a@b*: Il mio dovere è insegnarti l'arte del combattimento in tempi brevi, ma anche nel miglior modo possibile. Sarà meglio non strafare.\n@c2@"
  ja: "@a@b＊「私の役目は　はやく　お前を\n\t一人前に　育てることだが\n\tあせっても　しかたあるまい。\n@c2@"
"3":
  de: "@a@b*: Ich will mich dann mal auf den Weg machen. Du solltest nach Hause gehen und dich ausruhen, %a00090.\n@c2@"
  en: "@a@b*: I shall be on my way, then. You should run along home and rest yourself, %a00090.\n@c2@"
  es: "@a@b*: Entonces me voy. Deberías volver a casa y tomarte un descanso, %a00090.\n@c2@"
  fr: "@a@b*ⓢ Je te laisse. Tu devrais rentrer chez toi pour te reposer un peu, %a00090.\n@c2@"
  it: "@a@b*: Io vado via. Vai a casa, %a00090, e riposati.\n@c2@"
  ja: "@a@b＊「さて　もどるとするか。\n\t%a00090も　家で　ゆっくり\n\t休むといいだろう。\n@c2@"
"4":
  de: "@a@b*: Oho! Na, das nenne ich Kampfgeist!\n@c2@"
  en: "@a@b*: Oho! You're a spirited one!\n@c2@"
  es: "@a@b*: ¡Oh! ¡Eso es echarle ganas!\n@c2@"
  fr: "@a@b*ⓢ Ho hoⓠ Tu es %A090%Xplein%Z%B090%Xpleine%Z d'entrain, dis-moiⓠ\n@c2@"
  it: "@a@b*: Ah! Certo che ne hai di energie, eh?\n@c2@"
  ja: "@a@b＊「おお！！　なかなか頑張るな。\n@c2@"
"5":
  de: "@a@b*: Aber vielleicht sollten wir es für heute gut sein lassen.\n@c2@"
  en: "@a@b*: But perhaps we should call it a day.\n@c2@"
  es: "@a@b*: Pero mejor será que lo dejemos por hoy.\n@c2@"
  fr: "@a@b*ⓢ Mais je crois qu'il vaut mieux s'arrêter là pour aujourd'hui.\n@c2@"
  it: "@a@b*: D'accordo. Direi che per oggi può bastare.\n@c2@"
  ja: "@a@b＊「しかし　今日は　このくらいに\n\tしておこう。\n@c2@"
"6":
  de: "@a@b*: Heda, kommt doch mal auf einen Sprung hier rüber, %A090%Xoh mächtiger Held%Z%B090%Xoh mächtige Heldin%Z!\n@c2@"
  en: "@a@b*: Hey, hop on over here a second, %A090%Xo mighty hero%Z%B090%Xo mighty heroine%Z!\n@c2@"
  es: "@a@b*: Eh, venga un segundo, ¡%A090%Xoh, poderoso héroe%Z%B090%Xoh, poderosa heroína%Z!\n@c2@"
  fr: "@a@b*ⓢ Hé, faites un saut par ici, %A090%Xô grand héros%Z%B090%Xô grande héroïne%Zⓠ\n@c2@"
  it: "@a@b*: Salve, %A090%Xcoraggioso eroe%Z%B090%Xcoraggiosa eroina%Z! Fai un salto qui!\n@c2@"
  ja: "@a@b＊「勇者さま　勇者さま……。\n@c2@"
"7":
  de: "@a@b*: Hierher, %A090%Xgroßer Held%Z%B090%Xgroße Heldin%Z! Doch Obacht ⓚⓛ tretet nicht auf mich!\n@c2@"
  en: "@a@b*: Over here, o great one! Step on it!\nOh, but not on me!\n@c2@"
  es: "@a@b*: ¡Por aquí, oh, %A090%XMagnífico%Z%B090%XMagnífica%Z! ¡Pisa ahí!\n¡Pero no me pises a mí!\n@c2@"
  fr: "@a@b*ⓢ Par ici, ô votre Grandeurⓠ D'un bondⓠ\nEnfin... pas sur moiⓠ\n@c2@"
  it: "@a@b*: Qui, %A090%Xvaloroso guerriero%Z%B090%Xvalorosa guerriera%Z! Fai un salto qui! Ma non saltare su di me...\n@c2@"
  ja: "@a@b＊「勇者さま　勇者さま……。\n@c2@"
"8":
  de: "@a@b*: Ich bitte Euch inständig: Ach, helft mir doch aus meiner bitteren Not!\n@c2@"
  en: "@a@b*: You must help me, kind %A090%Xsir%Z%B090%Xlady%Z!\n@c2@"
  es: "@a@b*: ¡Debe ayudarme, amable %A090%Xcaballero%Z%B090%Xdama%Z!\n@c2@"
  fr: "@a@b*ⓢ Vous devez m'aider, %A090%Xgentil damoiseau%Z%B090%Xgentille damoiselle%Zⓠ\n@c2@"
  it: "@a@b*: Devi aiutarmi, %A090%Xmio prode amico%Z%B090%Xmia prode amica%Z!\n@c2@"
  ja: "@a@b＊「勇者さま　どうか　たすけて……。\n@c2@"
"9":
  de: "@a@b*: Seht mich doch nicht so entsetzt an. In Wahrheit bin ich gar kein Frosch.\n@c2@"
  en: "@a@b*: Do not look so alarmed, I am not really a frog.\n@c2@"
  es: "@a@b*: No se asuste, en realidad no soy una rana.\n@c2@"
  fr: "@a@b*ⓢ N'ayez crainte, je ne suis pas vraiment une grenouille.\n@c2@"
  it: "@a@b*: Non essere %A090%Xstupito%Z%B090%Xstupita%Z. In realtà, io non sono ciò che sembro.\n@c2@"
  ja: "@a@b＊「あ！　おどろかないで……。\n\tわたしは　カエルでは　ありません。\n@c2@"
"10":
  de: "@a@b*: Gebt es zu, Ihr habt gedacht, ich sei ein Frosch, nicht wahr?\n@c2@"
  en: "@a@b*: Be honest, you thought I was a frog, did you not?\n@c2@"
  es: "@a@b*: Diga la verdad, pensó que era una rana, ¿no es cierto?\n@c2@"
  fr: "@a@b*ⓢ Soyez %A090%Xfranc%Z%B090%Xfranche%Z, vous me preniez pour une grenouille, n'est-ce pasⓡ\n@c2@"
  it: "@a@b*: Di' la verità... Credevi che io fossi una rana, vero?\n@c2@"
  ja: "@a@b＊「あ！　今　どう見ても　カエルだって\n\t思いましたね？\n@c2@"
"11":
  de: "@a@b*: Ich sehe schon, Ihr seid ein ehrlicher Mensch. Nun, ich möchte Euch mit Eurem ehrlichen Herzen um etwas bitten.\n@c2@"
  en: "@a@b*: You are a very honest person, I see. Well, I would ask a favour of your honest heart.\n@c2@"
  es: "@a@b*: Es una persona muy honesta, ya veo. Me gustaría pedirle un favor a su honesto corazón.\n@c2@"
  fr: "@a@b*ⓢ Je vois que vous êtes quelqu'un d'honnête.\nEh bien, j'aurais une requête à faire à ce cœur si sincère.\n@c2@"
  it: "@a@b*: Sento che sei una persona di buon cuore. Molto bene. Ascoltami, devi aiutarmi...\n@c2@"
  ja: "@a@b＊「あなたは　正直な人ですね。\n\tその正直さを　みこんで\n\tお願いがあります。\n@c2@"
"12":
  de: "@a@b*: Wie Ihr sicher bereits erraten habt, bin ich in Wahrheit die Prinzessin eines mächtigen Reiches.\n@c2@"
  en: "@a@b*: As you have probably already guessed, I am in truth the princess of a mighty kingdom.\n@c2@"
  es: "@a@b*: Como seguramente habrá adivinado, en realidad soy la princesa de un poderoso reino.\n@c2@"
  fr: "@a@b*ⓢ Comme vous l'avez sans doute déjà deviné, je suis en réalité la princesse d'un grand royaume.\n@c2@"
  it: "@a@b*: Come probabilmente avrai già intuito, io sono in realtà una principessa proveniente da un regno lontano.\n@c2@"
  ja: "@a@b＊「もう　さっしているとは思いますが\n\tじつは　わたしは　ある国の姫でした。\n@c2@"
"13":
  de: "@a@b*: Aber der böse Fluch einer gemeinen Hexe hat mich in das verwandelt, was Ihr hier vor Euch seht.\n@c2@"
  en: "@a@b*: But a wicked witch's horrible spell turned me into the form you see before you now.\n@c2@"
  es: "@a@b*: Pero el hechizo de una malvada bruja me convirtió en lo que tiene ante sus ojos.\n@c2@"
  fr: "@a@b*ⓢ Mais une horrible sorcière m'a jeté un sort et m'a transformée en ce que vous voyez maintenant devant vous.\n@c2@"
  it: "@a@b*: Un brutto giorno, però, una strega malvagia mi ha scagliato contro un'orribile magia che mi ha trasformato in una rana.\n@c2@"
  ja: "@a@b＊「しかし　悪い魔法使いに　のろいを\n\tかけられ　このような姿に\n\tされてしまったのです。\n@c2@"
"14":
  de: "@a@b*: Ich kann nichts tun, um die Gestalt zu ändern, die mir aufgezwungen wurde, und das Dasein als Frosch ist nicht so übel, wie man meinen könnte.\n@c2@"
  en: "@a@b*: I can do nothing to change the shape I have been forced to take, and, in fact, being a frog is not so terrible as one might imagine.\n@c2@"
  es: "@a@b*: No puedo hacer nada para cambiar la forma que me han obligado a adoptar y, de hecho, ser una rana no es tan horrible como muchos piensan.\n@c2@"
  fr: "@a@b*ⓢ Je ne puis rien faire pour changer cette apparence.\n㈡\n*ⓢ Néanmoins, je dois admettre qu'être une grenouille n'est pas aussi terrible que l'on pourrait croire.\n@c2@"
  it: "@a@b*: Purtroppo, io non posso nulla per cancellare questo sortilegio! Anche se, devo confessarlo, essere una rana non è poi tanto male, sai?\n@c2@"
  ja: "@a@b＊「まあ　なってしまったものは\n\tしかたがないし　カエルも思ったほど\n\tわるくは　ありません。\n@c2@"
"15":
  de: "@a@b*: Eigentlich führe ich ein sehr sorgenfreies Leben, aber...\n@c2@"
  en: "@a@b*: I live a very carefree life, but...\n@c2@"
  es: "@a@b*: Llevo una vida muy tranquila, pero...\n@c2@"
  fr: "@a@b*ⓢ Je mène une existence très insouciante, mais...\n@c2@"
  it: "@a@b*: Vivo all'aria aperta, in mezzo alla natura, e saltello libera dove più mi piace. Tuttavia...\n@c2@"
  ja: "@a@b＊「そんなわけで　毎日\n\tのんきに暮らしていたのですが……\n@c2@"
"16":
  de: "@a@b*: ... aber ein Problem habe ich doch, und zwar...\nEs ist nur so, dass...\n@c2@"
  en: "@a@b*: ...but there is just one problem...\nIt's just that...\n@c2@"
  es: "@a@b*: ... pero hay un pequeño problema...\nEs que...\n@c2@"
  fr: "@a@b*ⓢ ... mais il y a quand même un petit problème...\nC'est juste que...\n@c2@"
  it: "@a@b*: Ecco, c'è un problema.\nIl punto è che...\n@c2@"
  ja: "@a@b＊「こまったことが　あります。\n\tそれは…………\n@c2@"
"17":
  de: "@a@b*: Es...\n@c2@"
  en: "@a@b*: ...It's...\n@c2@"
  es: "@a@b*: ... Es...\n@c2@"
  fr: "@a@b*ⓢ ... C'est...\n@c2@"
  it: "@a@b*: ... Il punto è che...\n@c2@"
  ja: "@a@b＊「それは………………。\n@c2@"
"18":
  de: "@a@b*: ...\n@c2@"
  en: "@a@b*: ...\n@c2@"
  es: "@a@b*: ...\n@c2@"
  fr: "@a@b*ⓢ ..............................\n@c2@"
  it: "@a@b*: ...\n@c2@"
  ja: "@a@b＊「…………………………。\n@c2@"
"19":
  de: "@a@b*: Oh nein! Da kommt jemand!\n@c2@"
  en: "@a@b*: Oh no! Someone's coming!\n@c2@"
  es: "@a@b*: ¡Oh no! ¡Alguien viene!\n@c2@"
  fr: "@a@b*ⓢ Oh nonⓠ Quelqu'un arriveⓠ\n@c2@"
  it: "@a@b*: Oh, no! Sta arrivando qualcuno!\n@c2@"
  ja: "@a@b＊「あ！　いけない　誰か　来るわ！\n@c2@"
"20":
  de: "@a@b*: Ich sehe, Ihr seid ein guter Mensch. Nun, ich möchte Euch mit Eurem gütigen Herzen um etwas bitten.\n@c2@"
  en: "@a@b*: You are a very kind person, I see. Well, I would ask a favour of your kind heart.\n@c2@"
  es: "@a@b*: Es una persona muy amable, ya veo. Me gustaría pedirle un favor a su amable corazón.\n@c2@"
  fr: "@a@b*ⓢ Vous êtes une personne pleine de cœur, je vois. Eh bien, j'aurais une requête à faire à ce cœur si bon.\n@c2@"
  it: "@a@b*: Sento che sei una persona di buon cuore. Molto bene. Ascoltami, devi aiutarmi...\n@c2@"
  ja: "@a@b＊「あなたは　やさしい人ですね。\n\tその　やさしさをみこんで\n\tお願いがあります。\n@c2@"
"21":
  de: "@a@b*: Hallo, %a00090. So wie es aussieht, wird bald die Dämmerung hereinbrechen.\n@c2@"
  en: "@a@b*: Good day to you, %a00090. 'Twill be gettin' dark before long, it seems.\n@c2@"
  es: "@a@b*: Que tengas un buen día, %a00090. Parece que pronto va a anochecer.\n@c2@"
  fr: "@a@b*ⓢ Bonjour, %a00090. On dirait qu'il va bientôt faire nuit.\n@c2@"
  it: "@a@b*: Salve, %a00090. Tra poco farà buio...\n@c2@"
  ja: "@a@b＊「おや　%a00090だがや。\n\tそろそろ　日も暮れるべな。\n@c2@"
"22":
  de: "@a@b*: Ich komme zum Abendbrot nach Hause.\n@c2@"
  en: "@a@b*: I should be returnin' home for supper myself.\n@c2@"
  es: "@a@b*: Yo también debo volver a casa a cenar.\n@c2@"
  fr: "@a@b*ⓢ Je ferais bien de rentrer chez moi pour le dîner.\n@c2@"
  it: "@a@b*: Credo proprio che me ne andrò a casa.\nOrmai è quasi ora di cena.\n@c2@"
  ja: "@a@b＊「どれ　おいらも　家にもどって\n\tめしにするべか。\n@c2@"
"23":
  de: "@a@b*: Na, %a00090, du siehst aber wirklich ein bisschen erschöpft aus. Wie? Schwertübungen, sagst du?\n@c2@"
  en: "@a@b*: Well, %a00090, you look a mite weary, and no mistake. What's that? Sword practice, you say?\n@c2@"
  es: "@a@b*: Vaya, %a00090, pareces realmente %A090%Xcansado%Z%B090%Xcansada%Z. ¿Cómo? ¿De practicar con la espada dices?\n@c2@"
  fr: "@a@b*ⓢ Dis-moi, %a00090, tu m'as l'air un peu %A090%Xfatigué%Z%B090%Xfatiguée%Z. Que dis-tuⓡ Un entraînement à l'épéeⓡ\n@c2@"
  it: "@a@b*: Cosa c'è, %a00090? Mi sembri un po' %A090%Xstanco%Z%B090%Xstanca%Z. Come dici? Ti stai allenando con la spada?\n@c2@"
  ja: "@a@b＊「やや　%a00090。\n\tつかれた顔をしているな。\n\tそうかい　剣のけいこを……。\n@c2@"
"24":
  de: "@a@b*: Ja, das ist harte Arbeit, %A090%Xmein Junge%Z%B090%XKind%Z. Aber nicht aufgeben! Auf deinen schmalen Schultern ruhen die Hoffnungen des gesamten Dorfes.\n@c2@"
  en: "@a@b*: 'Tis hard work indeed, young one, but you must not give up. You've the hopes of the whole village on your narrow shoulders.\n@c2@"
  es: "@a@b*: Es bastante duro, cierto, pero no debes rendirte. Las esperanzas de todo el pueblo recaen ahora sobre tus hombros.\n@c2@"
  fr: "@a@b*ⓢ C'est effectivement beaucoup de travail, jeune %A090%Xhomme%Z%B090%Xfille%Z, mais tu dois t'accrocher. L'espoir de tout le village repose sur tes frêles épaules.\n@c2@"
  it: "@a@b*: Capisco. Beh, in effetti è un lavoro duro, ma devi insistere! Sulle tue spalle ancora gracili grava il peso delle speranze dell'intero villaggio.\n@c2@"
  ja: "@a@b＊「大変そうだけど　くじけるなよ。\n\tなんせ　%a00090は　オレたちの\n\t希望なんだから。\n@c2@"
"25":
  de: "@a@b*: Aber davon weißt du wohl noch nichts, nicht wahr? Achte am besten gar nicht auf mich.\n@c2@"
  en: "@a@b*: But I don't suppose you know much about that yet, eh? Pay no mind to my ramblings.\n@c2@"
  es: "@a@b*: Pero no creo que sepas mucho de eso, ¿verdad? No prestes atención a mis tonterías.\n@c2@"
  fr: "@a@b*ⓢ Mais tu ne dois pas savoir grand-chose de tout ça, n'est-ce pasⓡ Ne fais pas attention à mes élucubrations.\n@c2@"
  it: "@a@b*: Ma queste sono cose che non sai, e che ancora non devi sapere. Dimentica le mie parole.\n@c2@"
  ja: "@a@b＊「といっても　今の　お前には\n\tなんのことだか　わからないよな。\n\t気にしなくて　いいぜ。\n@c2@"
"26":
  de: "@a@b*: Aah, das erfrischt. Du kommst gerade rechtzeitig, %a00090. Du willst sicher auch deinen Durst löschen, nicht wahr?\n@c2@"
  en: "@a@b*: Aah, how very refreshing. Well met, %a00090. You've come to quench your thirst too, eh?\n@c2@"
  es: "@a@b*: ¡Ah, qué refrescante! %A090%XBienhallado%Z%B090%XBienhallada%Z, %a00090. También has venido a saciar tu sed, ¿eh?\n@c2@"
  fr: "@a@b*ⓢ Ah, c'est vraiment rafraîchissant. Te revoilà, %a00090. Tu es %A090%Xvenu%Z%B090%Xvenue%Z étancher ta soif, toi aussiⓡ\n@c2@"
  it: "@a@b*: Ah, che refrigerio! Ciao, %a00090. Anche tu sei %A090%Xvenuto%Z%B090%Xvenuta%Z a dissetarti?\n@c2@"
  ja: "@a@b＊「ぷはーーっ！！\n\tおお　%a00090　お前も\n\t水を飲みにきたのか？\n@c2@"
"27":
  de: "@a@b*: Nun, nach den heutigen Übungen ist das nicht weiter überraschend. Es ging ja hoch her, um es mal milde auszudrücken.\n@c2@"
  en: "@a@b*: Well, 'tis no surprise after today's practice. 'Twas a lively session to say the least.\n@c2@"
  es: "@a@b*: No me sorprende después del entrenamiento de hoy. Hay que admitir que ha sido una sesión intensa.\n@c2@"
  fr: "@a@b*ⓢ Pas étonnant après ton entraînement d'aujourd'hui. C'était une séance pour le moins animée, n'est-ce pasⓡ\n@c2@"
  it: "@a@b*: Beh, è normale che ti sia venuta sete, visto l'impegno con cui ti sei %A090%Xallenato%Z%B090%Xallenata%Z oggi. Ci hai dato dentro come non mai!\n@c2@"
  ja: "@a@b＊「今日の　剣のけいこは\n\t少々　あらっぽかったからな。\n\tわっはっはっは。\n@c2@"
"28":
  de: "@a@b*: Du und Elisa, ihr seid immer noch ein Herz und eine Seele, wie ich sehe.\n@c2@"
  en: "@a@b*: Eliza and yourself are as close as ever, I see.\n@c2@"
  es: "@a@b*: Veo que Elisa y tú os lleváis mejor que nunca.\n@c2@"
  fr: "@a@b*ⓢ Élisa et toi êtes toujours aussi proches, à ce que je vois.\n@c2@"
  it: "@a@b*: Ho notato che Elisa tiene molto a te. Dovete essere davvero %A090%Xottimi amici%Z%B090%Xottime amiche%Z.\n@c2@"
  ja: "@a@b＊「ところで　シンシアとは\n\tあいかわらず　仲がいいみたいだな。\n@c2@"
"29":
  de: "@a@b*: Das naseweise junge Ding war doch vorhin sogar schon bei mir, um mich zu schelten ⓚⓛ ich solle dich weniger hart rannehmen.\n@c2@"
  en: "@a@b*: The brazen young thing even came to my house to tell me I should be less hard on you.\n@c2@"
  es: "@a@b*: La muy descarada incluso vino a mi casa para decirme que tenía que ser menos duro contigo.\n@c2@"
  fr: "@a@b*ⓢ Cette petite effrontée est même venue chez moi me dire que je devrais être moins dur avec toi.\n@c2@"
  it: "@a@b*: Quell'adorabile mascalzoncella è persino venuta a casa mia per dirmi che non dovrei essere troppo severo con te!\n@c2@"
  ja: "@a@b＊「つい先日も　オレのところに来て\n\t%a00090を　あまり　いじめるなだと。\n@c2@"
"30":
  de: "@a@b*: Ich gebe zu, dass ich dir in den letzten Wochen viel abverlangt habe, aber das zahlt sich allmählich aus. Eines Tages wirst du es mir danken.\n@c2@"
  en: "@a@b*: I'll own that I've been working you harder than ever these last few weeks, but you're all the hardier for it. You'll thank me one day.\n@c2@"
  es: "@a@b*: Ya sé que te he hecho trabajar más de lo normal estas últimas semanas, pero eso te ha hecho más fuerte. Algún día me lo agradecerás.\n@c2@"
  fr: "@a@b*ⓢ Je reconnais que je t'ai fait travailler plus dur que jamais ces dernières semaines, mais tu n'en es que plus %A090%Xrésistant%Z%B090%Xrésistante%Z. Un jour, tu m'en remercieras.\n@c2@"
  it: "@a@b*: Riconosco di averti %A090%Xsottoposto%Z%B090%Xsottoposta%Z a un addestramento durissimo negli ultimi tempi, ma l'ho fatto solo per il tuo bene. Un giorno mi ringrazierai...\n@c2@"
  ja: "@a@b＊「まあ　たしかに最近は　けいこが\n\tすぎたかも知れんが　それはそれだけ\n\tお前も　強くなってきたということだぞ。\n@c2@"
"31":
  de: "@a@b*: Das ist der Eingang zum Dorf. Ich stehe hier Wache, um sicherzustellen, dass keine ungebetenen Gäste unsere Grenze übertreten.\n@c2@"
  en: "@a@b*: This is the village entrance.\nI am standing guard here to ensure unwelcome visitors do not breach our borders.\n@c2@"
  es: "@a@b*: Esta es la entrada al pueblo.\nEstoy aquí montando guardia para evitar que intrusos indeseables atraviesen la frontera.\n@c2@"
  fr: "@a@b*ⓢ Ceci est l'entrée du village.\nJe monte la garde pour m'assurer qu'aucun visiteur indésirable ne pénètre chez nous.\n@c2@"
  it: "@a@b*: Questo è l'ingresso del villaggio.\nSono di guardia qui per evitare che visitatori indesiderati turbino la nostra pace.\n@c2@"
  ja: "@a@b＊「ここは　村の入り口\n\tあやしいヤツが　入ってこぬよう\n\t見張っているのだ。\n@c2@"
"32":
  de: "@a@b*: Möchtest du das Dorf verlassen, %a00090?\n@c2@"
  en: "@a@b*: Do you wish to leave the village, %a00090?\n@c2@"
  es: "@a@b*: ¿Te gustaría abandonar el pueblo, %a00090?\n@c2@"
  fr: "@a@b*ⓢ Souhaites-tu quitter le village, %a00090ⓡ\n@c2@"
  it: "@a@b*: Desideri uscire dal villaggio, %a00090?\n@c2@"
  ja: "@a@b＊「ところで　%a00090。\n\t村のそとへ　出たいか？\n@c2@"
"33":
  de: "@a@b*: Ich fürchte, es ist noch nicht an der Zeit.\nDu bist noch nicht stark genug.\n@c2@"
  en: "@a@b*: I am afraid the time is not yet right.\nYou are still too weak.\n@c2@"
  es: "@a@b*: Me temo que todavía no es el momento adecuado.\nAún eres demasiado débil.\n@c2@"
  fr: "@a@b*ⓢ Je regrette, mais il est encore trop tôt. Tu n'es pas encore assez %A090%Xfort%Z%B090%Xforte%Z.\n@c2@"
  it: "@a@b*: Mi spiace, ma non puoi ancora farlo.\nNon sei ancora sufficientemente forte.\n@c2@"
  ja: "@a@b＊「しかし　まだ　その時ではない。\n\t今のお前では　まだまだ\n\tちから不足なのだよ。\n@c2@"
"34":
  de: "@a@b*: Eine kluge Antwort. Du darfst das Dorf erst verlassen, wenn du stark genug bist.\n@c2@"
  en: "@a@b*: A wise answer. You shall leave the village only when you are strong enough.\n@c2@"
  es: "@a@b*: Una respuesta inteligente. Solo podrás abandonar el pueblo cuando seas lo bastante fuerte.\n@c2@"
  fr: "@a@b*ⓢ Voilà une réponse pleine de sagesse. Tu ne quitteras le village que lorsque tu seras assez %A090%Xfort%Z%B090%Xforte%Z.\n@c2@"
  it: "@a@b*: La tua risposta denota grande saggezza. Lascerai il villaggio quando sarai %A090%Xdiventato%Z%B090%Xdiventata%Z più forte.\n@c2@"
  ja: "@a@b＊「うむ　そうだな。\n\t%a00090が　村を出るには\n\tもっともっと　強くならなくてはな。\n@c2@"
"35":
  de: "@a@b*: Ah, da bist du ja, %a00090!\nHeute wollte ich dich eigentlich den Brutzel-Zauber lehren!\n@c2@"
  en: "@a@b*: Ah, there you are, %a00090!\nToday I was planning to teach you how to perform the Sizzle spell!\n@c2@"
  es: "@a@b*: ¡Ah, ahí estás, %a00090!\n¡Hoy he pensado en enseñarte a lanzar el conjuro Incendio!\n@c2@"
  fr: "@a@b*ⓢ Ah, te voilà, %a00090ⓠ\nAujourd'hui, j'avais prévu de t'apprendre à lancer le sort Supercrameⓠ\n@c2@"
  it: "@a@b*: Oh, eccoti qua, %a00090!\nOggi avrei voluto insegnarti l'incantesimo ⓕIncendioⓖ...\n@c2@"
  ja: "@a@b＊「おお　よう来たな。　%a00090よ。\n\t今日は　そなたに　ベギラマの呪文を\n\t教えてしんぜよう。\n@c2@"
"36":
  de: "@a@b*: Doch die Abenddämmerung rückt unerbittlich näher. Wir werden den Unterricht morgen fortsetzen.\n@c2@"
  en: "@a@b*: But dusk draws inexorably closer. We will commence the lesson tomorrow.\n@c2@"
  es: "@a@b*: Pero está a punto de anochecer. Comenzaremos la lección mañana.\n@c2@"
  fr: "@a@b*ⓢ Mais il va bientôt faire nuit. Nous commencerons la leçon demain.\n@c2@"
  it: "@a@b*: Ma si è fatto tardi, e sta per calare il buio. Ne riparleremo domani.\n@c2@"
  ja: "@a@b＊「と　いきたいところだが　今日はもう\n\t日も暮れかけておる。\n\t授業は　また明日にしようぞ。\n@c2@"
"37":
  de: "@a@b*: Zzz... Heda, was ist da los? In dieses göttinverlassene Dorf verirrt sich nie jemand! Zzz...\n@c3@"
  en: "@a@b*: Zzz...what's goin' on, eh? No one ever comes to this Goddessforsaken village! Zzz...\n@c3@"
  es: "@a@b*: Zzz... Eh, ¿qué pasa? ¡Nadie se acerca a este pueblo dejado de la mano de la Diosa! Zzz...\n@c3@"
  fr: "@a@b*ⓢ Zzz... Qu'est-ce qui se passe, heinⓡ Personne ne vient jamais dans ce village perduⓠ Zzz...\n@c3@"
  it: "@a@b*: Zzz... Ma come mai, eh? Come mai non viene nessuno in questo villaggio dimenticato dalla dea e dagli uomini...? Zzz...\n@c3@"
  ja: "@a@b＊「ぐがー　ぐがー。\n\tこの村には　誰もいれねえぜ！！\n\tむにゃむにゃ……。\n@c3@"
"38":
  de: "@a@b*: Oh, du bist's, %a00090. Ich bringe hier nur schnell alles auf Vordermann.\n@c2@"
  en: "@a@b*: Oh, 'tis you, %a00090. I was just giving the place a quick spruce.\n@c2@"
  es: "@a@b*: ¡Ah!, eres tú, %a00090. Estaba dándole un repasito a este lugar.\n@c2@"
  fr: "@a@b*ⓢ Oh, c'est toi %a00090. Je faisais juste un peu de ménage.\n@c2@"
  it: "@a@b*: Oh, %a00090. Stavo giusto dando una bella pulitina.\n@c2@"
  ja: "@a@b＊「おや　誰かと思ったら　%a00090さん。\n\tいや　ちょっと部屋の　そうじをね。\n@c2@"
"39":
  de: "@a@b*: Obwohl die Göttin allein weiß, wozu ich mir die Mühe mache. Hierher verirrt sich ja doch niemand, und selbst wenn, dürfte er nicht hierbleiben.\n@c2@"
  en: "@a@b*: Goodness knows why I bother, though. Nobody ever comes all the way out here to visit, and even if they did, we could not allow them to stay...\n@c2@"
  es: "@a@b*: Sabe la Diosa para qué me preocupo. Nadie viene aquí de visita e incluso aunque lo hicieran, no podríamos dejar que se quedaran...\n@c2@"
  fr: "@a@b*ⓢ Je me demande bien pourquoi je me donne du mal, d'ailleurs. Personne ne vient jamais jusqu'ici.\n㈡\n*ⓢ Et même si quelqu'un venait, on ne pourrait pas le laisser rester...\n@c2@"
  it: "@a@b*: Chissà perché perdo il mio tempo a farlo! Qui non viene mai nessuno! E se anche avessimo dei visitatori, non permetteremmo loro di restare, perché...\n@c2@"
  ja: "@a@b＊「といっても　こんな山奥の村に\n\t客なんぞ　来やしないし　もし来たって\n\tまさか　泊めるわけには……。\n@c2@"
"40":
  de: "@a@b*: Oh! Ähm, ich meine, äh... Ich räume einfach ein bisschen auf, wie immer. Alte Gewohnheit, weißt du.\n@c2@"
  en: "@a@b*: Oh! Um, I mean, er...I'm just cleaning out the rooms like I always do. Old habits die hard, you know.\n@c2@"
  es: "@a@b*: ¡Ah! Um, esto, eh... estaba limpiando las habitaciones como siempre hago. Las viejas costumbres nunca se pierden, ¿sabes?\n@c2@"
  fr: "@a@b*ⓢ Ohⓠ Euh, je veux dire, hum... Je nettoie les chambres comme d'habitude, c'est tout.\nLes habitudes ont la vie dure, tu sais.\n@c2@"
  it: "@a@b*: Ops! Ehm, volevo dire che sto pulendo le stanze come faccio di solito... È un'abitudine che mi porterò dietro finché campo.\n@c2@"
  ja: "@a@b＊「あ！　いえ　その　まあ……\n\t昔の習慣ってヤツですな。\n\tあはははは……。\n@c2@"
"41":
  de: "@a@b*: Ach, da bist du ja, %a00090. Du bist sicher schon am Verhungern. Gleich gibt's Essen.\n@c2@"
  en: "@a@b*: Oh, there you are, %a00090. You must be famished. Sit down and I'll bring you your supper.\n@c2@"
  es: "@a@b*: ¡Ah!, ahí estás, %a00090. Debes de estar %A090%Xhambriento%Z%B090%Xhambrienta%Z. Te serviré la cena enseguida.\n@c2@"
  fr: "@a@b*ⓢ Oh, te voilà %a00090. Tu dois mourir de faim. Je viens de mettre ton dîner en route.\n@c2@"
  it: "@a@b*: Eccoti qui, %a00090. Scommetto che hai una fame da lupi, vero? Preparo subito da mangiare.\n@c2@"
  ja: "@a@b＊「あら　おかえり　%a00090。\n\tおなかが　すいただろ。\n\t今　食事にするからね。\n@c2@"
"42":
  de: "@a@b*: Oh, da bist du ja wieder, %a00090. Bist du unterwegs Elisa begegnet?\n@c2@"
  en: "@a@b*: Oh, you're back, %a00090. Did you come across Eliza on your travels?\n@c2@"
  es: "@a@b*: ¡Ah!, has vuelto, %a00090. ¿Te has cruzado con Elisa mientras deambulabas por ahí?\n@c2@"
  fr: "@a@b*ⓢ Oh, te voilà de retour %a00090.\nAs-tu croisé Élisa en cheminⓡ\n@c2@"
  it: "@a@b*: %A090%XBentornato%Z%B090%XBentornata%Z, %a00090. Hai per caso incontrato Elisa?\n@c2@"
  ja: "@a@b＊「おお　もどったか　%a00090。\n\t時に　シンシアの姿が見えんようだが。\n@c2@"
"43":
  de: "@a@b*: Sie hat sich schon vor einiger Zeit auf die Suche nach dir gemacht. Ihr müsst euch wohl verpasst haben.\n@c2@"
  en: "@a@b*: She went out to look for you some time back.\nI suppose you must just have missed each other somewhere.\n@c2@"
  es: "@a@b*: Salió hace algún tiempo a buscarte.\nImagino que os habréis cruzado en algún punto del camino.\n@c2@"
  fr: "@a@b*ⓢ Elle est passée ici il y a un moment, elle te cherchait. Vous avez dû vous rater quelque part.\n@c2@"
  it: "@a@b*: Prima ti stava cercando.\nProbabilmente vi siete %A090%Xmancati%Z%B090%Xmancate%Z per un soffio.\n@c2@"
  ja: "@a@b＊「さきほど　%a00090を呼びにいくと\n\t出ていったのだが　どこかで\n\tすれちがいに　なったのかも知れん。\n@c2@"
"44":
  de: "@a@b*: Dann ist das arme Mädchen immer noch irgendwo da draußen und hält Ausschau nach dir. Kannst du sie bitte suchen gehen?\n@c2@"
  en: "@a@b*: The poor girl must still be out there looking for you. Go on and find her, won't you?\n@c2@"
  es: "@a@b*: La pobre debe seguir ahí fuera en tu busca. ¿Por qué no vas a ver?\n@c2@"
  fr: "@a@b*ⓢ La pauvre doit encore être en train de te chercher dehors. Va la retrouver, d'accordⓡ\n@c2@"
  it: "@a@b*: Credo che quella poverina sia ancora in giro a vedere dove sei %A090%Xfinito%Z%B090%Xfinita%Z. Perché non le vai incontro?\n@c2@"
  ja: "@a@b＊「もし　まだ　さがしているようなら\n\tかわいそうだから　お前　そのあたりを\n\tさがしてきておやり。\n@c2@"
"45":
  de: "@aElisa@bHallo, %a00090. Bist du jetzt mit deinen Schwertübungen fertig?\n@c1@"
  en: "@aEliza@bHello, %a00090. You've finished your sword practice now, have you?\n@c1@"
  es: "@aElisa@bHola, %a00090. Ya has terminado de practicar con la espada, ¿verdad?\n@c1@"
  fr: "@aÉlisa@bBonjour, %a00090. Tu as terminé ton entraînement à l'épée, n'est-ce pasⓡ\n@c1@"
  it: "@aElisa@bCiao, %a00090. Per oggi hai finito il tuo addestramento con la spada, vero?\n@c1@"
  ja: "@a@bシンシア「あ　%a00090　剣のけいこ\n\tもう　終わったみたいね。\n@c1@"
"46":
  de: "@aElisa@bWas? Ein riesiger Frosch? Was? Wovon redest du denn da bloß?\n@c1@"
  en: "@aEliza@bWhat's that? A giant frog? What? What on earth are you talking about?\n@c1@"
  es: "@aElisa@b¿Qué? ¿Una rana gigante? ¿Cómo? ¿De qué demonios estás hablando?\n@c1@"
  fr: "@aÉlisa@bHeinⓡ Une grenouille géanteⓡ Mais... Mais enfin, de quoi est-ce que tu parlesⓡ\n@c1@"
  it: "@aElisa@bChe cosa? Una rana gigante?! Ma che stai dicendo?!\n@c1@"
  ja: "@a@bシンシア「ん？　どうしたの？\n\tえ？　おおきなカエル？\n\tなんのことかしら……。\n@c1@"
"47":
  de: "@aElisa@bIch bin die ganze Zeit hier gewesen, und ich habe nichts dergleichen ge-\n@c1@"
  en: "@aEliza@bI've been here the whole time, and I certainly haven't seen any such thi-\n@c1@"
  es: "@aElisa@bNo me he movido de aquí y te puedo asegurar que no he visto nada igu...\n@c1@"
  fr: "@aÉlisa@bJe n'ai pas bougé d'ici et je n'ai rien vu qui...\n@c1@"
  it: "@aElisa@bSono qui da un pezzo, e non ho visto niente del gener...\n@c1@"
  ja: "@a@bシンシア「わたしは　ずっとここにいたけど\n\tカエルなんて　見な……\n@c1@"
"48":
  de: "@aElisa@bNichts dergleichen ge-\n@c1@"
  en: "@aEliza@bAny such thi-\n@c1@"
  es: "@aElisa@bNada igu...\n@c1@"
  fr: "@aÉlisa@bRien qui...\n@c1@"
  it: "@aElisa@bAh! Ah! Ah!\n@c1@"
  ja: "@a@bシンシア「見　見なか……\n@c1@"
"49":
  de: "@aElisa@bHi hi hi! Nein, ich kann dabei einfach nicht ernst bleiben! Hi hi hi!\n@c1@"
  en: "@aEliza@bTee hee hee! Oh, I can't keep this up!\nTee hee hee!\n@c1@"
  es: "@aElisa@b¡Ji, ji, ji! ¡Oh, no puedo seguir!\n¡Ji, ji, ji!\n@c1@"
  fr: "@aÉlisa@bHi hi hiⓠ Oh, je ne peux pas tenir plus longtempsⓠ\nHi hi hiⓠ\n@c1@"
  it: "@aElisa@bAh! Ah! Ah!\nBasta, non ce la faccio!\nAh! Ah! Ah!\n@c1@"
  ja: "@a@bシンシア「うぷ！　あはははは\n\tあははは……　もう　だめ！！\n@c1@"
"50":
  de: "@aElisa@bIch glaube, vielleicht war das hier der Frosch, den du gesehen hast, %a00090!\n@c1@"
  en: "@aEliza@bI think this may be the frog you saw, %a00090.\n@c1@"
  es: "@aElisa@bCreo que esta puede ser la rana que viste, %a00090.\n@c1@"
  fr: "@aÉlisa@bJe crois que c'est ça, la grenouille que tu as vue, %a00090.\n@c1@"
  it: "@aElisa@bDimmi, %a00090... \nForse è questa la rana che hai visto?\n@c1@"
  ja: "@a@bシンシア「%a00090が　見たのは\n\tこのカエルでしょう。\n@c1@"
"51":
  de: "@a@bElisa wirkt Metamorphose!\n@c1@"
  en: "@a@bEliza casts Morph!\n@c1@"
  es: "@a@b¡Elisa lanza el conjuro Metamorfosis!\n@c1@"
  fr: "@a@bÉlisa lance le sort Morph...\n@c1@"
  it: "@a@bElisa lancia Trasphorma!\n@c1@"
  ja: "@a@bシンシアは　モシャスをとなえた！！\n@c1@"
"52":
  de: "@aElisa@bEigentlich führe ich ein sehr sorgenfreies Leben, aber... aber ein Problem habe ich doch, und zwar...\n@c1@"
  en: "@aEliza@bI live a very carefree life, but...but there is just\none problem...\n@c1@"
  es: "@aElisa@b Llevo una vida muy tranquila pero... pero tengo un pequeño problema...\n@c1@"
  fr: "@aÉlisa@bJe mène une existence très insouciante, mais... il y a quand même un petit problème...\n@c1@"
  it: "@aElisa@bVivo all'aria aperta, in mezzo alla natura, e saltello libera dove più mi piace. Tuttavia...\n@c1@"
  ja: "@a@bシンシア「のんきに暮らしていたのですが\n\tこまったことが　あります。\n\tそれは……\n@c1@"
"53":
  de: "@aElisa@bEs ist nur so, dass...\n@c1@"
  en: "@aEliza@bIt's just that...\n@c1@"
  es: "@aElisa@bEs que...\n@c1@"
  fr: "@aÉlisa@bC'est juste que...\n@c1@"
  it: "@aElisa@bEcco, c'è un problema.\nIl punto è che...\n@c1@"
  ja: "@a@bシンシア「それは…………\n@c1@"
"54":
  de: "@aElisa@bEs ist nur, dass mir an der Stelle nichts Gescheites mehr einfallen wollte!\n@c1@"
  en: "@aEliza@bIt's just that I couldn't think of anything good to say after that!\n@c1@"
  es: "@aElisa@b¡Es que no se me ocurre nada bueno que decir después de eso!\n@c1@"
  fr: "@aÉlisa@bC'est juste qu'après ça, je n'ai pas réussi à trouver une bonne suiteⓠ\n@c1@"
  it: "@aElisa@bIl punto è che non sapevo più cosa dire, per continuare la mia storiella!\n@c1@"
  ja: "@a@bシンシア「って　ごめんなさい。\n\tじつは　その先のセリフが\n\t思いうかばなかったの。\n@c1@"
"55":
  de: "@aElisa@bHätte ich meine Geschichte ein bisschen sorgfältiger ausgedacht, dann wäre mir bestimmt was ganz Tolles eingefallen.\n@c1@"
  en: "@aEliza@bIf I had spent a little more time preparing my story,\nI could have come up with something wonderful,\nbut I just couldn't wait to show you.\n@c1@"
  es: "@aElisa@bSi hubiera dedicado más tiempo a inventar una historia, se me habría ocurrido algo maravilloso, pero es que no podía esperar a enseñártelo.\n@c1@"
  fr: "@aÉlisa@bSi j'avais passé un peu plus de temps à préparer mon histoire, j'aurais trouvé quelque chose de formidable, mais j'avais trop hâte de te montrer ça.\n@c1@"
  it: "@aElisa@bAvrei dovuto impegnarmi di più per inventare una favoletta convincente, ma non vedevo l'ora di mostrarti questa meraviglia!\n@c1@"
  ja: "@a@bシンシア「もうすこし　ちゃんと先の話まで\n\t考えてから　やればよかったんだけど\n\t%a00090に　はやく見せたかったのね。\n@c1@"
"56":
  de: "@aElisa@bAber du warst überrascht, oder? Jetzt, wo ich Metamorphose gelernt habe, kann ich mich in alles Mögliche verwandeln.\n@c1@"
  en: "@aEliza@bYou were surprised though, weren't you? Now that I've learned Morph, I can change into all kinds\nof things.\n@c1@"
  es: "@aElisa@bAunque te habrá sorprendido de todas formas, ¿verdad? Ahora que he aprendido el conjuro Metamorfosis, puedo transformarme en todo tipo de cosas.\n@c1@"
  fr: "@aÉlisa@bMais je t'ai %A090%Xeu%Z%B090%Xeue%Z, heinⓡ Maintenant que je connais le sort Morph, je peux me transformer en toutes sortes de choses.\n@c1@"
  it: "@aElisa@bSei %A090%Xsorpreso%Z%B090%Xsorpresa%Z, vero? Ora che ho imparato a lanciare Trasphorma, posso mutarmi in tutto ciò che voglio!\n@c1@"
  ja: "@a@bシンシア「びっくりしたでしょ！\n\tわたし　いろんなものに姿を変えられる\n\tモシャスの呪文をおぼえたのよ！\n@c1@"
"57":
  de: "@a@bElisa wirkt Metamorphose!\n@c1@"
  en: "@a@bEliza casts Morph!\n@c1@"
  es: "@a@b¡Elisa lanza el conjuro Metamorfosis!\n@c1@"
  fr: "@a@bÉlisa lance le sort Morph...\n@c1@"
  it: "@a@bElisa lancia Trasphorma!\n@c1@"
  ja: "@a@bシンシアは　モシャスをとなえた！！\n@c1@"
"58":
  de: "@aElisa@bIch bin auf dem Sprung ⓚⓛ ich muss los.\n@c1@"
  en: "@aEliza@bI'll just be hopping along then.\n@c1@"
  es: "@aElisa@bMe quedaré por aquí al fresco.\n@c1@"
  fr: "@aÉlisa@bBon, je repasserai faire un saut dans le coin.\n@c1@"
  it: "@aElisa@bFaccio un salto di là.\n@c1@"
  ja: "@a@bシンシア「じゃあ　わたし　いくわ！\n@c1@"
"59":
  de: "@aElisa@bAch, fast hätte ich's vergessen. Deine Mutter hat dich gesucht. Du sollst zum Essen kommen. Ich glaube, ich rieche Möhrchen!\n@c1@"
  en: "@aEliza@bOh, I almost forgot. Your mother was looking for\nyou. She said to tell you it's supper time. I think I smelt carrots!\n@c1@"
  es: "@aElisa@b¡Ah!, casi se me olvida. Tu madre te estaba buscando. Me pidió que te dijera que ya es hora de cenar. ¡Creo que olía a zanahorias!\n@c1@"
  fr: "@aÉlisa@bOh, j'ai failli oublier. Ta mère te cherchait. Elle m'a dit de te prévenir que c'était l'heure de dîner.\nÇa sent les carottes, je croisⓠ\n@c1@"
  it: "@aElisa@bOh, quasi me ne dimenticavo! Tua madre ti stava cercando. Mi ha detto di riferirti che la cena è pronta. Credo che ti abbia preparato delle carote.\n@c1@"
  ja: "@a@bシンシア「あ！　そうそう！\n\t%a00090の　お母さんがよんでたわよ。\n\tもう　夕食だって。\n@c1@"
"60":
