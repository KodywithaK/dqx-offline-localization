  es: "@a@b*: Comprendo. Puede que se cansara de buscarte y se fuera a casa. De todos modos, seguro que está bien.\n@c2@"
  fr: "@a@b*ⓢ Je vois. Peut-être qu'elle a arrêté de te chercher et qu'elle a fini par rentrer chez elle. Quoi qu'il en soit, je suis sûre qu'elle va bien.\n@c2@"
