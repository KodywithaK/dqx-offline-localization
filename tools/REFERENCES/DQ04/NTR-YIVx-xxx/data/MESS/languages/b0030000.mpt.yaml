  es: "@a@b*: A lo miejor no puedes ver al tipo de esa celda, pero sieguro que está dentro. Estiará durmiendo ahí atrás.\n@c2@"
  fr: "@a@b*ⓢ Vous ne voyez peut-être pas le gars dans le cachot à côté, mais il est là. Il doit être au fond en train de dormir.\n@c2@"
