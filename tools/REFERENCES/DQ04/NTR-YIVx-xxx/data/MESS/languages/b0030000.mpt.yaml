  fr: "@aPrince Réginald@bAh, un marchand ambulant, c'est çaⓡ Dans ce cas, j'ai un service à vous demander, mon brave...\n@c2@"
  it: "@aPrincipe Vitellozzo@bAh, te sei un venditore ambulante? Bene, allora n'approfitto pe' chiederti un favore.\n@c2@"
  ja: "@a@bリック「あなたを　旅の商人と見込んで\n\tたのみたいのですが……。\n@c2@"
"94":
