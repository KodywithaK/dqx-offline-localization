  ja: "@a@bリック「ボクは　リック。\n\tこの国の王子です。\n@c2@"
"93":
  de: "@aPrinz Hinz@bAh, ein reisender Händler, wie ich sehe? Nun, in diesem Fall möchte ich dich gerne um einen Gefallen bitten...\n@c2@"
