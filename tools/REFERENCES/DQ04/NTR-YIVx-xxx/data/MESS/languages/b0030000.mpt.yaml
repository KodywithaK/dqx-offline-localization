  it: "@aPrincipe Vitellozzo@bI'ddestino dei nostri du' regni dipende da huesta lettera! Conto su di %H860%Xte%Yvoi%Z!\n@c2@"
  ja: "@a@bリック「ふたつの国の運命が\n\tかかっているのです！\n\tくれぐれも　おたのみします！\n@c2@"
"116":
  de: "@a@bⓞMeine liebste Vroni,\nich habe es immer noch nicht gewagt, meinem Vater von unserer Liaison zu berichten.\n@c0@"
  en: "@a@bⓗMy beloved Ronnie,\nI still daren't mention anything about our affair to Da.\n@c0@"
  es: "@a@b''Mi amada Vero,\nAún no mi atrievo a hablar de lo nuestro con papi.''\n@c0@"
  fr: "@a@bⓥMa petite Nini,\nJe n'ai toujours rien dit de notre amour à mon père.\n@c0@"
  it: "@a@bⓕMia amata Veronica, non ho ancora osato parlare a mio padre del nostro amore.ⓖ\n@c0@"
  ja: "@a@b愛する　エンドールの姫　モニカよ。\nキミのことを　父に　話せぬまま\nいく日も　すぎてしまった。\n@c0@"
"117":
  de: "@a@bAußerdem habe ich gerade herausgefunden, dass er plant, in Endor einzufallen.\n@c0@"
  en: "@a@bⓗAnd I'm just after finding out that he plans to invade your dear land of Endor.\n@c0@"
  es: "@a@b''Y mi acabo de enterar de que tiene piensado invadir vuestro querido país de Endor.''\n@c0@"
  fr: "@a@bEt je viens de découvrir qu'il envisage d'envahir ton cher pays.\n@c0@"
  it: "@a@bⓕCome se non bastasse, ho appena scoperto che lui vuole invadere il regno di Endor, la tua cara terra.ⓖ\n@c0@"
  ja: "@a@bしかも　恐ろしいことに　父は\nキミの国　エンドールに\n攻め込むつもりらしい。\n@c0@"
"118":
  de: "@a@bIch musste einfach etwas tun. Bitte informiere deinen Vater von der Sache, bevor es zu spät ist.ⓟ\n@c0@"
  en: "@a@bⓗI had to do something before that happened. Please, inform your father before it's too late.ⓘ\n@c0@"
  es: "@a@b''Tenía que hacer algo para evitiarlo, sí. Por fiavor, informa a tu padre antes de que sea diemasiado tarde.''\n@c0@"
  fr: "@a@bJe ne pouvais pas rester sans rien faire. Parles-en à ton père avant qu'il ne soit trop tard.ⓦ\n@c0@"
  it: "@a@bⓕDobbiamo fare qualcosa prima che si verifichi una tale catastrofe. Ti prego, informa subito tuo padre!ⓖ\n@c0@"
  ja: "@a@bそうなる前に　なんとかしなくては\nならない。　どうか　このことを\nキミの父上に　お知らせして……。\n@c0@"
"119":
  de: "@a@b... aber die Prinzessin von Endor ist nicht zugegen!\n@c0@"
  en: "@a@b...but the Princess of Endor isn't around to listen!\n@c0@"
  es: "@a@b¡Pero la princesa de Endor no está aquí para escucharlo!\n@c0@"
  fr: "@a@b... Mais la princesse de Chandor n'est pas là pour entendre celaⓠ\n@c0@"
  it: "@a@bMa Veronica, la Principessa di Endor, non può sentire queste parole...!\n@c0@"
  ja: "@a@bしかし　ここには\nエンドールの姫は　いなかった。\n@c0@"
