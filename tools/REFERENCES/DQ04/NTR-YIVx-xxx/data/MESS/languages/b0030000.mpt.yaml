  ja: "@a@bリック「おお　来てくれましたね。\n\tボクです。　この城の王子の　リックです。\n@c2@"
"110":
  de: "@aPrinz Hinz@bIch möchte dich um einen Gefallen bitten, wie ich schon sagte. Ich möchte, dass du für mich nach Endor gehst, sobald die Brücke repariert ist.\n@c2@"
  en: "@aPrince Regan@bSo, I've a favour to ask, like I said. I want you to go to Endor for me as soon as the bridge is fixed.\n@c2@"
  es: "@aPríncipe Alí@bComo ti dije, debo piedirte un favor.\nQuiero que vayas a Endor por mí en cuanto arrieglen el puente.\n@c2@"
  fr: "@aPrince Réginald@bComme je vous le disais, j'ai un service à vous demanderⓢ je veux que vous vous rendiez à Chandor dès que le pont sera reparé.\n@c2@"
  it: "@aPrincipe Vitellozzo@bCome ho già detto, ho un favore da %H860%Xchiederti%Ychiedervi%Z. Vorrei che %H860%Xtu andassi%Yvoi andaste%Z a Endor non appena i'pponte sarà sistemato.\n@c2@"
