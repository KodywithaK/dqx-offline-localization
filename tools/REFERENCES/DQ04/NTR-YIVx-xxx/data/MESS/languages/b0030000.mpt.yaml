  en: "@aPrince Regan@bAh, it is yourself.\nYou remember me, of course?\nPrince Regan.\n@c2@"
  es: "@aPríncipe Alí@b¡Ah, eres tú!\nMi recuerdas, ¿vierdad?\nSoy el príncipe Alí.\n@c2@"
  fr: "@aPrince Réginald@bAh, c'est vous.\nVous vous souvenez de moi, n'est-ce pasⓡ\nLe prince Réginald.\n@c2@"
