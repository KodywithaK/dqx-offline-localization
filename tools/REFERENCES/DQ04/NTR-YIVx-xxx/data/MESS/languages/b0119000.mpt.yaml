"0":
  de: "@aSchwester Esther@bEr regt sich. Estark, der 'err der Unterwelt, der in den Tiefen der Vergessen'eit verschollen war.\n@c1@"
  en: "@aNun the Wiser@bⓙE is stirring. Estark, Lord of ze Underworld, who ⓙad disappeared into ze depths of oblivion.\n@c1@"
  es: "@aSor Sabionde@bEstá despegrtando. Estagrk, Señogr del Infgramundo, que había desapagrecido en las pgrofundidades del olvidó.\n@c1@"
  fr: "@aNonne Obstante@bIl s'éveille. Estark, le Seigneur des Enfers, lui qui avait disparu dans les profondeurs de l'oubli.\n@c1@"
  it: "@aSuor Sagesse@bSi sta agitando. Estark, Signore degli Inferi, che era scomparso dans les profondità dell'oblio.\n@c1@"
  ja: "@a@b＊「よみがえりしはずの\n\t地獄の帝王　エスタークは\n\t深き暗闇へと　沈みゆきました。\n@c1@"
"1":
  de: "@aSchwester Esther@bMais maintenant, neue Samen der Zestörung bedro'en diese wunderschöne Welt, die die Göttin für uns erschaffen 'at.\n@c1@"
  en: "@aNun the Wiser@bNow new seeds of destruction threaten zis beautiful world ze Goddess ⓙas bestowed upon us.\n@c1@"
  es: "@aSor Sabionde@bAhogra nuevas simientes de destgrucción amenazan este bonito mundo que la Diosa nos concedió.\n@c1@"
  fr: "@aNonne Obstante@bAujourd'hui, la destruction menace à nouveau ce magnificent monde que la Goddess nous a confié.\n@c1@"
  it: "@aSuor Sagesse@bOra nuovi semi di distruzione minacciano le monde merveilleux che la dea ci ha donato.\n@c1@"
  ja: "@a@b＊「しかし　今　ふたたび\n\tこの世界に　新しい恐怖の芽が\n\t育ちつつあります……。\n@c1@"
"2":
  de: "@aSchwester Esther@bDie himmlische Schutzherrin, die von dort oben über %H860%Xdisch%Yeusch%Z wacht, wird %H860%Xdir%Yeusch%Z den Weg aufzeigen, den %H860%Xdu gehen musst%Yihr gehen müsst%Z.\n@c1@"
  en: "@aNun the Wiser@bBut ze protection divine zat shields you from on ⓙigh will show you ⓙow to proceed.\n@c1@"
  es: "@aSor Sabionde@bPegro la pgrotección divina que cuida de %H860%Xusted%Yustedes%Z %H860%Xle%Yles%Z mostgragrá el camino.\n@c1@"
  fr: "@aNonne Obstante@bMais la puissance divine qui vous protège depuis les cieux vous montrera le chemin à suivre.\n@c1@"
  it: "@aSuor Sagesse@bMa lo sguardo divino che %H860%Xti%Yvi%Z protegge dall'alto %H860%Xti%Yvi%Z mostrerà le chemin da percorrere. \n@c1@"
  ja: "@a@b＊「天のかなたより　あなたがたを\n\t見つめる　大いなる守りが\n\t必ずや　道をひらくはず。\n@c1@"
"3":
  de: "@aSchwester Esther@b%H860%XDu darfst%YIhr dürft%Z nicht ruhen. Non. Ça ne va pas! %H860%XGeh%YGeht%Z jetzt! Denn %H860%Xdu bist %A120%Xder Erkorene%Z%B120%Xdie Erkorene%Z%Yihr seid die Erkorenen%Z!\n@c1@"
  en: "@aNun the Wiser@bYou must not pause. Non. You cannot!\nGo, now! For you are ze Chosen!\n@c1@"
  es: "@aSor Sabionde@bNo %H860%Xdebe%Ydeben%Z detenegrse. Non. ¡No %H860%Xpuede%Ypueden%Z!\nAhogra, %H860%Xmágrchese%Ymágrchense%Z. Pogrque %H860%Xforma pagrte de los Elegidos%Yforman parte de los Elegidos%Z.\n@c1@"
  fr: "@aNonne Obstante@bVous ne devez pas vous arrêter.\nNo. Vous ne pouvez pasⓠ Vous devez continuerⓠ\nParce que vous êtes l'Élu%A090%X%Z%B090%Xe%Zⓠ\n@c1@"
  it: "@aSuor Sagesse@bNon c'è tempo da perdere! Allez, devi andare! Tu sei %A090%Xil vero Prescelto%Z%B090%Xla vera Prescelta%Z!\n@c1@"
  ja: "@a@b＊「立ち止まってはいけません。\n\t行きなさい。　導かれし者たちよ。\n@c1@"
"4":
  de: "@a@b*: He he he! Heute ist mein Glückstag! Menschenfleisch!\n@c2@"
  en: "@a@b*: Heh heh heh! My lucky day!\nA tasty human to devour!\n@c2@"
  es: "@a@b*: ¡Je, je, je! ¡Hoy es mi día de suerte!\n¡%H860%X%A120%XUn sabroso humano%Z%B120%XUna sabrosa humana%Z%Y%R000%XUnas sabrosas humanas%YUnos sabrosos humanos%Z%Z para devorar!\n@c2@"
  fr: "@a@b*ⓢ Hé hé héⓠ C'est mon jour de chanceⓠ\n%H860%X%A120%XUn humain%Z%B120%XUne humaine%Z%Y%R000%XDes humaines%YDes humains%Z%Zⓠ Rien de tel pour m'ouvrir l'appétitⓠ\n@c2@"
  it: "@a@b*: Eh! Eh! Eh! Questo è il mio giorno fortunato!\nUna saporita creatura umana tutta da sgranocchiare!\n@c2@"
  ja: "@a@b＊「く～っふっふっ！\n\tこいつは　ついてる！\n\tうまそうな人間だわい！\n@c2@"
"5":
  de: "@a@b*: %H860%XEin Mensch%YMenschen%Z! Wohl aus den Zellen entwischt, was?\n@c2@"
  en: "@a@b*: %H860%XA human%YHumans%Z! Escaped from the cells, did you!?\n@c2@"
  es: "@a@b*: ¡%H860%X%A120%XUn humano%Z%B120%XUna humana%Z%Y%R000%XHumanas%YHumanos%Z%Z! ¡%H860%XTe has%YOs habéis%Z escapado de la celda, ¿eh?!\n@c2@"
  fr: "@a@b*ⓢ %H860%X%A120%XUn humainⓠ Vous vous êtes échappé%Z%B120%XUne humaineⓠ Vous vous êtes échappée%Z%Y%R000%XDes humainesⓠ Vous vous êtes échappées%YDes humainsⓠ Vous vous êtes échappés%Z%Z de la prison, c'est çaⓡ\n@c2@"
  it: "@a@b*: %H860%XUn umano%YDegli umani%Z! %H860%X%A120%XSei scappato%Z%B120%XSei scappata%Z%Y%R000%XSiete scappate%YSiete scappati%Z%Z dalle celle, non è così?!\n@c2@"
  ja: "@a@b＊「お！　人間め！\n\t牢屋から　逃げ出したな！\n@c2@"
"6":
  de: "@a@b*: Halt! Stopp!\nMir gefällt gar nicht, was ich sehe!\n@c2@"
  en: "@a@b*: You! Stop!\nI don't like the look of you!\n@c2@"
  es: "@a@b*: ¡%H860%XTú%Y%R000%XVosotras%YVosotros%Z%Z! ¡Alto!\n¡No me gusta %H860%Xtu%Yvuestro%Z aspecto!\n@c2@"
  fr: "@a@b*ⓢ Vous, làⓠ Arrêtezⓠ\nJ'aime pas %H860%Xvotre tête%Yvos têtes%Zⓠ\n@c2@"
  it: "@a@b*: Ehi, %H860%Xtu%Yvoi%Z! Altolà!\nNon mi %H860%Xpiaci%Ypiacete%Z per niente!\n@c2@"
  ja: "@a@b＊「むむむっ！！\n\tおのれ！　くせ者め！\n@c2@"
"7":
  de: "@a@b*: Keine Neuigkeiten von Fürst Psaro, seit er zur Mamonmine aufgebrochen ist.\n@c3@"
  en: "@a@b*: There's been no word of Lord Psaro since he left for Mamon Mine.\n@c3@"
  es: "@a@b*: No tenemos noticias de Lord Psaro desde que partió hacia la Mina de Mammon.\n@c3@"
  fr: "@a@b*ⓢ Personne n'a eu de nouvelles du Seigneur Psaro depuis qu'il est ressorti de la mine d'Alpion.\n@c3@"
  it: "@a@b*: Da quando è purrrtito alla volta della Miniera di Mamon, Lord Psaro non ha piurrr dato notizie di sé.\n@c3@"
  ja: "@a@b＊「デスピサロさまが\n\tアッテムトに　向かったきり\n\tお戻りに　ならないのだ！\n@c3@"
"8":
  de: "@a@b*: Ich hoffe, dass Fürst Estark nicht...\nNein, bestimmt nicht. Wer könnte dem Herrn der Unterwelt schon etwas anhaben?\n@c3@"
  en: "@a@b*: I hope Lord Estark isn't...\nNo, surely not. What harm could come to the Lord of the Underworld, the King of Beasts?\n@c3@"
  es: "@a@b*: Espero que Lord Estark no...\nNo, seguro que no. ¿Qué le podría pasar al Señor del Inframundo, el Rey de las Bestias?\n@c3@"
  fr: "@a@b*ⓢ J'espère que le Seigneur Estark n'est pas...\nNon, ça m'étonnerait. Qui pourrait arriver à toucher le Seigneur des Enfers, le Roi des Monstresⓡ\n@c3@"
  it: "@a@b*: Spero che Lord Estark non sia... Oh, ma che dico?! Nessuno può farrre del male al grrroarande Signore degli Inferi, il Rrre delle Belve!\n@c3@"
  ja: "@a@b＊「まさか　帝王エスタークの身に\n\tなにか……　いや\n\tそんなはずは　あるまい。\n@c3@"
"9":
  de: "@a@b*: N-Nein! Ich will nicht gefangen werden! Nicht jetzt! Ich bin so weit gekommen!\n@c2@"
  en: "@a@b*: N-No! I can't get caught now!\nI'd got so far!\n@c2@"
  es: "@a@b*: ¡N-No! ¡No me pueden atrapar ahora!\n¡Con lo lejos que había llegado!\n@c2@"
  fr: "@a@b*ⓢ N... Nonⓠ Je ne peux pas me faire attraper maintenantⓠ Pas après tous ces effortsⓠ\n@c2@"
  it: "@a@b*: N-No! Non posso farmi prendere proprio adesso!\nSono riuscito ad arrivare fin qui!\n@c2@"
  ja: "@a@b＊「ひ…　ひえ～！\n\tやっと　ここまで逃げてきたのに\n\t見つかってしまうなんてぇ！\n@c2@"
"10":
  de: "@a@b*: Was? Doch kein Monster? Mit dem Mutationsstab in Monster verwandelt? Oh, der Göttin sei Dank!\n@c2@"
  en: "@a@b*: What? You're not a monster at all?\nYou used the mod rod to change into one?\nOh, thank the Goddess for that!\n@c2@"
  es: "@a@b*: ¿Qué? ¿Que no %H860%Xeres un monstruo%Ysois monstruos%Z?\n¿Que %H860%Xhas%Yhabéis%Z utilizado la vara meta para convertir%H860%Xte%Yos%Z en %H860%Xmonstruo%Ymonstruos%Z? ¡Oh, menos mal, gracias a la Diosa!\n@c2@"
  fr: "@a@b*ⓢ Quoiⓡ Vous n'êtes pas un vrai monstreⓡ\nVous avez juste utilisé le morphobâton pour en prendre l'apparenceⓡ\n㈡\n*ⓢ La Déesse soit louéeⓠ\n@c2@"
  it: "@a@b*: Cosa? Hai usato la Bacchetta mutatrice per trasformarti in un mostro, ma in realtà non lo sei?\nOh, dea ti ringrazio!\n@c2@"
  ja: "@a@b＊「え？　へんげの杖で\n\t魔物に　化けてるんだって？\n\tああ　びっくりした……。\n@c2@"
"11":
  de: "@a@b*: Ihr seid sehr mutig, Euch einfach hier bei den Monstern einzuschleichen.\n@c2@"
  en: "@a@b*: You're certainly brave, sneaking into this place right under the monsters' noses.\n@c2@"
  es: "@a@b*: %H860%XEres muy valiente%YSois muy valientes%Z para entrar a escondidas en este lugar en las mismas narices de los monstruos.\n@c2@"
  fr: "@a@b*ⓢ Vous ne manquez pas de courage pour entrer dans cet endroit sous le nez de ces monstres.\n@c2@"
  it: "@a@b*: %H860%XHai%YAvete%Z certamente fegato ad %H860%Xintrufolarti%Yintrufolarvi%Z in questo posto passando proprio sotto il naso di queste belve.\n@c2@"
  ja: "@a@b＊「あんた　この城に忍びこんで\n\tよく食べられずに　出てこれたね！\n@c2@"
"12":
  de: "@a@b*: Oh, ich weiß! Ihr habt bestimmt den Mutationsstab, richtig?\n@c2@"
  en: "@a@b*: Oh, I get it! You must've been using that mod rod, were you?\n@c2@"
  es: "@a@b*: ¡Ah, ya entiendo! %H860%XDebes%YDebéis%Z de haber estado usando la vara meta, ¿verdad?\n@c2@"
  fr: "@a@b*ⓢ Ah, j'ai comprisⓠ Vous avez dû utiliser le morphobâton, c'est çaⓡ\n@c2@"
  it: "@a@b*: Oh, ho capito! %H860%XHai%YAvete%Z usato la Bacchetta mutatrice, giusto?\n@c2@"
  ja: "@a@b＊「わかった！　へんげの杖で\n\t魔物に　化けていたんだろう？\n@c2@"
"13":
  de: "@a@b*: Das dachte ich mir.\n@c2@"
  en: "@a@b*: I thought as much.\n@c2@"
  es: "@a@b*: Eso me parecía.\n@c2@"
  fr: "@a@b*ⓢ Je me disais aussi...\n@c2@"
  it: "@a@b*: Proprio come pensavo.\n@c2@"
  ja: "@a@b＊「やっぱりそうか。\n\tそうだと思ったよ。\n@c2@"
"14":
  de: "@a@b*: Nein? Dann erzähl ich Euch mal was. Der Mutationsstab ist ein magischer Stab, mit dem Ihr Euer Aussehen verändern könnt.\n@c2@"
  en: "@a@b*: No? Then let me tell you something.\nThe mod rod's supposed to be this magical staff that changes how you look.\n@c2@"
  es: "@a@b*: ¿No? Entonces %H860%Xdeja%Ydejad%Z que %H860%Xte%Yos%Z cuente algo.\nSegún se dice, la vara meta es ese báculo mágico capaz de cambiar tu aspecto.\n@c2@"
  fr: "@a@b*ⓢ Nonⓡ Dans ce cas, laissez-moi vous expliquerⓢ le morphobâton est un bâton magique qui vous permet de changer d'apparence.\n@c2@"
  it: "@a@b*: No? Lascia che %H860%Xti%Yvi%Z racconti una cosa.\nLa Bacchetta mutatrice è uno strumento magico che ha il potere di cambiare il tuo aspetto.\n@c2@"
  ja: "@a@b＊「なら　教えてあげよう。\n\tへんげの杖ってのは　なんにでも\n\t姿を変えられる　魔法の杖だ。\n@c2@"
"15":
  de: "@a@b*: Ich hab gehört, dass er irgendwo in der Königlichen Krypta bei Endor begraben ist, aber gesehen hab ich ihn nie.\n@c2@"
  en: "@a@b*: I heard it was buried somewhere in the Royal Crypt around Endor, but I've never actually seen it myself.\n@c2@"
  es: "@a@b*: Había oído que estaba enterrada en algún lugar de la cripta real, cerca de Endor, pero en realidad nunca la he visto.\n@c2@"
  fr: "@a@b*ⓢ Il paraît qu'il est enterré dans la Crypte royale près de Chandor, mais je ne l'ai jamais vu de mes propres yeux.\n@c2@"
  it: "@a@b*: Ho sentito dire che è sepolta da qualche parte nella Cripta Reale che si trova vicino a Endor, ma io non l'ho mai vista.\n@c2@"
  ja: "@a@b＊「聞いた話じゃあ\n\tエンドール地方の　王家の墓に\n\t眠っているそうだよ。\n@c2@"
"16":
  de: "@a@b*: Im Namen aller Monster möchte ich %H860%Xdich%Yeuch%Z in Teufelsheim begrüßen!\n@c2@"
  en: "@a@b*: On behalf of all monsters, I welcome you to the grrrand Diabolic Hall!\n@c2@"
  es: "@a@b*: ¡En nombrrre de todos los monstrrruos, %H860%Xte%Yos%Z doy la bienvenida al grrran Conciliábulo Demoníaco!\n@c2@"
  fr: "@a@b*ⓢ Au nom de tous les monstres, je vous souhaite la bienvenue dans le palais du Démonⓠ\n@c2@"
  it: "@a@b*: A nome di tutti i mostrrri, %H860%Xti%Yvi%Z do il benvenuto nell'Antrrro del Male!\n@c2@"
  ja: "@a@b＊「ここは　われら魔物たちの城\n\tデスパレスだ！\n@c2@"
"17":
  de: "@a@b*: Die große Liebe Psaros, die Elfe namens Rosi, wurde von Menschen entführt.\n@c3@"
  en: "@a@b*: The love of Lord Psaro's life, the elf called Rose, has been kidnapped by those pesky humans.\n@c3@"
  es: "@a@b*: El amor de Lord Psaro, la elfa llamada Rosa, ha sido secuestrada por esos malditos humanos.\n@c3@"
  fr: "@a@b*ⓢ Le grand amour du Seigneur Psaro, l'elfe Rose, a été kidnappée par ces sales humains.\n@c3@"
  it: "@a@b*: Rosa, l'elfa di cui Lord Psaro è tanto innamorato, è stata rapita da quei malvagi umani.\n@c3@"
  ja: "@a@b＊「デスピサロさまが　かわいがってた\n\tエルフのロザリーが　おろかな\n\t人間に　連れ去られたらしい。\n@c3@"
"18":
  de: "@a@b*: Ich will mir gar nicht vorstellen, wie wütend Fürst Psaro sein wird, wenn er davon hört.\n@c3@"
  en: "@a@b*: I can't even imagine how furious Lord Psaro will be when he hears the news.\n@c3@"
  es: "@a@b*: No quiero ni imaginarme lo furioso que se pondrá Lord Psaro cuando esta noticia llegue a sus oídos.\n@c3@"
  fr: "@a@b*ⓢ Je n'ose même pas imaginer la colère du Seigneur Psaro quand il l'apprendra.\n@c3@"
  it: "@a@b*: Non oso neanche immaginare quanto sarà furioso Lord Psaro quando cornoscerà la notizia. Ops! Volevo dire quando conoscerà la notizia.\n@c3@"
  ja: "@a@b＊「このことを知ったら\n\tデスピサロさまは　どれほど\n\tお怒りになることか！？\n@c3@"
"19":
  de: "@a@b*: Allein die Vorstellung lässt mich schon erschaudern...\n@c3@"
  en: "@a@b*: Just thinking about it sends shivers down my horn...\n@c3@"
  es: "@a@b*: Solo de pensarlo siento escalofríos por todo mi cuerno...\n@c3@"
  fr: "@a@b*ⓢ Rien que d'en parler, j'en ai des frissons dans la corne...\n@c3@"
  it: "@a@b*: Al solo pensiero, il mio corno freme per la rabbia... \n@c3@"
  ja: "@a@b＊「ああ　考えただけで\n\t恐ろしいよ……。\n@c3@"
"20":
  de: "@a@bKeine Antwort.\nDas ist nur ein Skelett.\n@c2@"
  en: "@a@bNo reply.\nItⓙs just a skeleton.\n@c2@"
  es: "@a@bNo hay respuesta.\nNo es más que un esqueleto.\n@c2@"
  fr: "@a@bPas de réponse.\nCe n'est qu'un squelette.\n@c2@"
  it: "@a@bNessuna risposta.\nÈ solo uno scheletro.\n@c2@"
  ja: "@a@b返事がない。\nただの　しかばねのようだ……。\n@c2@"
"21":
  de: "@a@bOh, nein, ist es nicht! Es lebt!\n@c2@"
  en: "@a@bOh no it isn't! It's alive!\n@c2@"
  es: "@a@b¡Oh, no, no lo es! ¡Está vivo!\n@c2@"
  fr: "@a@bEn fait, nonⓠ Il est vivantⓠ\n@c2@"
  it: "@a@bOh no, niente affatto! È vivo!\n@c2@"
  ja: "@a@bと　思ったら\nがい骨のお化けだった！\n@c2@"
"22":
  de: "@a@b*: %H860%XLass%YLasst%Z mich allein. Ich will in Frieden ruhen! Ist das denn zu viel verlangt?!\n@c2@"
  en: "@a@b*: Leave me alone. I'm trying to rest in peace!\nYou don't want to rattle my ribcage!\n@c2@"
  es: "@a@b*: %H860%XDéjame%YDejadme%Z en paz. ¡Estoy intentando descansar!\n¡No me %H860%Xtoques%Ytoquéis%Z las costillas!\n@c2@"
  fr: "@a@b*ⓢ Laissez-moi tranquille.\nJ'essaie de reposer en paixⓠ\nCommencez pas à me briser les métatarsesⓠ\n@c2@"
  it: "@a@b*: %H860%XLasciami%YLasciatemi%Z in pace. Voglio far riposare un po' queste mie quattro ossa!\n@c2@"
  ja: "@a@b＊「起こすんじゃね―よ！\n\t眠いんだから。　むにゃむにゃ……。\n@c2@"
"23":
  de: "@a@b*: Die Menpfen find ja fo erbärmlich! Fie können nicht mal fliegen!\n@c1@"
  en: "@a@b*: Humanth are pathetic! They can't even fly!\n@c1@"
  es: "@a@b*: ¡Loz humanoz zon patéticoz! ¡Ni ziquiera pueden volar!\n@c1@"
  fr: "@a@b*ⓢ Les humains sont pathétiquesⓠ\nIls ne savent même pas volerⓠ\n@c1@"
  it: "@a@b*: Gli umani fono patetici! Non fanno neanche volare!\n@c1@"
  ja: "@a@b＊「なあ　おい。　人間てのは\n\t空も飛べないなんざ　まったく\n\tあわれな生き物だと　思わんか？\n@c1@"
"24":
  de: "@a@b*: Fie haben aber waf erfunden, mit dem fie fliegen können. Heift Ballon oder fo. Vielleicht find fie doch nicht fo dumm, wie ich dachte.\n@c1@"
  en: "@a@b*: Mind you, they did invent thomething called a balloon that they can fly around in. Maybe they're not ath thtupid ath I thought.\n@c1@"
  es: "@a@b*: Ezo zí, inventaron una coza llamada globo, y pueden volar zubidoz en ella. A lo mejor no zon tan eztúpidoz como creía.\n@c1@"
  fr: "@a@b*ⓢ En même temps, ils ont inventé quelque çose appelé ⓥballonⓦ et avec, ils volent. Ils sont peut-être pas si bêtes que ça.\n@c1@"
  it: "@a@b*: Però hanno inventato una cofa che fi chiama mongolfiera che ufano per folcare i cieli. Magari non fono stupidi come penfavo...\n@c1@"
  ja: "@a@b＊「もっとも　むかしは\n\t人間たちも　気球ってやつで\n\t空を　飛んでいたらしいがな。\n@c1@"
"25":
  de: "@a@b*: Sehet den Thron des großen Psaro!\n@c3@"
  en: "@a@b*: Behold the throne of the great Psaro the Manslayer!\n@c3@"
  es: "@a@b*: ¡He aquí el trono del gran Psaro el Carnicero!\n@c3@"
  fr: "@a@b*ⓢ Voici le trône du grand Psaro l'Exterminateurⓠ\n@c3@"
  it: "@a@b*: Ecco il trono del grande Psaro il Massacratore!\n@c3@"
  ja: "@a@b＊「ここにあるは\n\tわれらがデスピサロさまの\n\t玉座である！\n@c3@"
"26":
  de: "@a@b*: Allerdings gibt es Gerüchte, irgendwelche Halunken würden versuchen, unseren Fürsten zu stürzen.\n@c3@"
  en: "@a@b*: But there are rumours of some cheeky scoundrels trying to unseat our lord.\n@c3@"
  es: "@a@b*: Hay rumores de que algunos bribones caraduras pretenden destronar a nuestro señor.\n@c3@"
