  en: "@aHank Hoffman Jr.@bWell then, I guess that's your pioneer primed an' prepared to propagate your proclamation o' partnership, ain't it now!\n@c2@"
  es: "@aJuanchito@bOk, supongo que %H860%Xha%Yhan%Z preparado a su %A280%Xpionero%Z%B280%Xpionera%Z%C280%XpionerⓅ%Z para que proclame a los cuatro vientos las virtudes de nuestra asociación.\n@c2@"
  fr: "@aHank Hoffman Jr@bBien, dans ce cas, j'crois que votre émissaire peut maintenant aller annoncer au monde votre message de partenariatⓠ\n@c2@"
