  fr: "@aHank Hoffman Jr@bVous avez changé d'avis, heinⓡ J'crois qu'on ferait bien de tout reprendre depuis l'début une fois d'plus.\n@c2@"
  it: "@aJohn Dwayne Jr.@b%H860%XHai%YAvete%Z cambiato idea, eh? Forse sarà meglio ricominciare daccapo...\n@c2@"
  ja: "@a@bホフマン「おや　変えるのですね。\n\tでは　もう一度　はじめから\n\tお願いします。\n@c2@"
"115":
  de: "@a@bDiese Botschaft geht leider nicht.\n@c0@"
