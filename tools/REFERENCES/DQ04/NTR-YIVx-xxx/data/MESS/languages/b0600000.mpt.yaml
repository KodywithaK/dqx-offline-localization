  es: "@aJuanchito@b%H860%XHa%YHan%Z cambiado de opinión, ¿eh? Lo que %H860%Xusted diga, %A120%Xsocio%Z%B120%Xsocia%Z%Yustedes digan, %R000%Xsocias%Ysocios%Z%Z.\n@c2@"
