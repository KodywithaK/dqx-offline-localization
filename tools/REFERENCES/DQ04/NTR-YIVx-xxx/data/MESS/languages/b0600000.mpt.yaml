"0":
  de: "@a@b%0%a00120 liest das Schild.\n@c0@"
  en: "@a@b%0%a00120 reads the sign.\n@c0@"
  es: "@a@b%0%a00120 lee el cartel.\n@c0@"
  fr: "@a@b%0%a00120 lit l'écriteau.\n@c0@"
  it: "@a@b%0%a00120 legge il cartello.\n@c0@"
  ja: "@a@b%a00120は　立て札を　読んだ。\n@c0@"
"1":
  de: "@a@b            ⓞDer Wüstenbasar ist zu Ende. \n              Wir danken unseren Kunden. \n     Bitte beehrt uns beim nächsten Mal wieder.ⓟ\n@c0@"
  en: "@a@b  ⓗThe desert bazaar done finished an' moved on.\n         We traders would like to thank y'all\n                 for yer patronage.ⓘ\n@c0@"
  es: "@a@bⓕEl bazar del desierto ha cerrado y se ha trasladado. Queremos darles las gracias a todos por haber comprado aquí.ⓖ\n@c0@"
  fr: "@a@b       ⓥLe bazar du désert a repris la route.\n       Tous les commerçants vous remercient\n                  pour votre soutien.ⓦ\n@c0@"
  it: "@a@bⓕIl Desermercato ha chiuso i battenti e si è spostato altrove. Ringraziamo i nostri clienti per la fiducia accordataci.ⓖ\n@c0@"
  ja: "@a@b砂漠のバザーは　終了しました。\n長らくのご愛顧\nまことに　ありがとうございました。\n@c0@"
"2":
  de: "@aHank Hoffman Jr.@bTagchen%H860%X%Y mit'nander%Z. Lange nicht gesehen. Ich bin's. Hank Hoffman Jr., wisst Ihr noch?\n@c2@"
  en: "@aHank Hoffman Jr.@bHowdy, y'all. It's been a while, ain't it?\nIt's me, Hank Hoffman Jr., remember? \n@c2@"
  es: "@aJuanchito@bSaludos. Pues hace ya tiempo que no nos vemos, ¿eh?\nSoy yo, Juanchito, ¿%H860%Xrecuerda%Yrecuerdan%Z? \n@c2@"
  fr: "@aHank Hoffman Jr@bSalut tout l'monde. Ça faisait un bail, heinⓡ\nC'est moi, Hank Hoffman Jr, vous vous souvenezⓡ\n@c2@"
  it: "@aJohn Dwayne Jr.@bSalve, %H860%Xvecchia pellaccia%Yvecchie pellacce%Z! È un pezzo che non ci si vede! Sono io, John Dwayne Jr.!\n@c2@"
  ja: "@a@bホフマン「みなさん　おひさしぶりです！\n\tミントスの町でお別れした\n\tホフマンです。　覚えておいでですか？\n@c2@"
"3":
  de: "@aHank Hoffman Jr.@bHab' meine Lehre beim alten Dämler abgeschlossen und will jetzt auf eigenen Füßen stehen.\n@c2@"
  en: "@aHank Hoffman Jr.@bI done finished my apprenticeship with ol' Ilton, an' now I'm a-settin' up by myself.\n@c2@"
  es: "@aJuanchito@bRecién terminé mi formación con el viejo Gilton y ahorita trabajo por mi cuenta.\n@c2@"
  fr: "@aHank Hoffman Jr@bJ'ai fini mon apprentissage avec le vieux Ilton, et maintenant, j'm'installe à mon compte.\n@c2@"
  it: "@aJohn Dwayne Jr.@bHo finito il mio apprendistato con il vecchio Jolly Etchelsior, e ho deciso di mettermi in proprio.\n@c2@"
  ja: "@a@bホフマン「ヒルタン先生のもとでの\n\t修行を終え　私も　いよいよ\n\t独立することになりました。\n@c2@"
"4":
  de: "@aHank Hoffman Jr.@bIch dachte mir, ich mach's wie der Alte und gründe meine eigene Stadt, genau wie das gute alte Mintos.\n@c2@"
  en: "@aHank Hoffman Jr.@bI figured I might as well follow in the ol' coot's footsteps and set me up a boom town like dear\nol' Mintos.\n@c2@"
  es: "@aJuanchito@bSupongo que bien podría seguir los pasos del viejito y levantar una floreciente ciudad como Mintos.\n@c2@"
  fr: "@aHank Hoffman Jr@bJe m'suis dit que j'pourrais marcher dans les traces du vieil original et faire moi-même pousser une ville champignon comme Ringys.\n@c2@"
  it: "@aJohn Dwayne Jr.@bProprio così! Anch'io fonderò una città sul modello della cara, vecchia Mintos.\n@c2@"
  ja: "@a@bホフマン「そこで　先生にならって\n\t私も　ひとつ　ミントスのような\n\t町を作ろうと　決心したんですよ。\n@c2@"
"5":
  de: "@aHank Hoffman Jr.@bAber ich kann in dieser Wildnis ja nicht mutterseelenallein 'ne ganze Stadt aus dem Hut zaubern.\n@c2@"
  en: "@aHank Hoffman Jr.@bBut I cain't very well jes' make a town out in this here wilderness all on my lonesome now, can I?\n@c2@"
  es: "@aJuanchito@bPero no puedo construir ni tan siquiera un pueblito en este paraje yo solo, ¿a que no?\n@c2@"
  fr: "@aHank Hoffman Jr@bMais j'peux difficilement faire sortir une ville de terre au milieu d'nulle part si j'suis tout seul, heinⓡ\n@c2@"
  it: "@aJohn Dwayne Jr.@bCerto, non posso fare tutto da solo... Solo qualcuno matto come un cavallo penserebbe di fondare una città senza nemmeno un briciolo di aiuto.\n@c2@"
  ja: "@a@bホフマン「とはいえ　この不毛の地に\n\t私ひとりで　町を作るのは\n\tとても　ムリというもの……。\n@c2@"
"6":
  de: "@aHank Hoffman Jr.@bUnd da seid Ihr mir eingefallen, Ihr Weltenbummler.\n@c2@"
  en: "@aHank Hoffman Jr.@bWhich is why I thought I might ask you globe-trottin' varmints a little favour.\n@c2@"
  es: "@aJuanchito@bRazón por la que quisiera %H860%Xpedirle%Ypedirles%Z un favorcito, %H860%Xsagaz trotamundos%Ysagaces trotamundos%Z.\n@c2@"
  fr: "@aHank Hoffman Jr@bC'est pour ça que j'me suis dit que j'pourrais vous demander une p'tite faveur, à vous autres globe-trotters.\n@c2@"
  it: "@aJohn Dwayne Jr.@bEcco perché ho deciso di %H860%Xchiederti%Ychiedere a voi giramondo%Z di darmi una mano.\n@c2@"
  ja: "@a@bホフマン「そこで　世界中を旅する\n\tみなさんに　お願いがあるんです。\n@c2@"
"7":
  de: "@aHank Hoffman Jr.@bWenn Ihr unternehmungslustige Leute trefft, könnt Ihr ihnen nicht von meiner Pionierstadt erzählen, die so rasant wächst?\n@c2@"
  en: "@aHank Hoffman Jr.@bCan y'all git out there and find some folks with itchy feet, and tell 'em about the newest town in town?\n@c2@"
  es: "@aJuanchito@b¿%H860%XPodría%YPodrían%Z andarse por el mundo y buscar aventureros y hablarles de la ciudad que voy a comenzar?\n@c2@"
  fr: "@aHank Hoffman Jr@bEst-ce que vous pourriez aller voir un peu partout s'il n'y a pas des gens que l'envie d'bouger démange et leur parler d'ma toute nouvelle villeⓡ\n@c2@"
  it: "@aJohn Dwayne Jr.@bChe ne %H860%Xdiresti%Ydireste%Z di spargere la voce che qui è nata una nuova città? Nei %H860%Xtuoi viaggi incontrerai%Yvostri viaggi incontrerete%Z di certo un mucchio di gente che ha voglia di cambiare vita!\n@c2@"
  ja: "@a@bホフマン「まずは　どなたか　新しい土地に\n\t移りたがっている人を　さがして\n\tここを　すすめてくれませんか？\n@c2@"
"8":
  de: "@aHank Hoffman Jr.@bZum Beispiel in dem Dorf Laissez Fayre ⓚⓛ soll's da nicht einen geben, der am liebsten weg will? Hängt dort wohl in der Kirche rum.\n@c2@"
  en: "@aHank Hoffman Jr.@bI seem to recall hearin' about someone who was jes' itchin' fer a new life hangin' around in the church down there in little ol' Laissez Fayre.\n@c2@"
  es: "@aJuanchito@bRecuerdo que me hablaron de alguien que andaba buscando una nueva vida y que estaba en la iglesia, allá en Laissez Fayre.\n@c2@"
  fr: "@aHank Hoffman Jr@bJ'crois m'souvenir d'avoir entendu parler de quelqu'un qui voulait changer d'vie du côté d'la p'tite ville de Teafortwo.\n@c2@"
  it: "@aJohn Dwayne Jr.@bPer esempio, ricordo che, nei pressi della chiesa di Laissez Fayre, c'era qualcuno che voleva tagliare con il passato e ricominciare altrove.\n@c2@"
  ja: "@a@bホフマン「そういえば　モンバーバラの町の\n\t教会で　新天地をもとめる\n\t旅人を見たという人が　いたとか……。\n@c2@"
"9":
  de: "@aHank Hoffman Jr.@bWenn wir nur genügend Leute in die Prärie locken können, bauen wir uns hier in null Komma nix 'n schmuckes neues Städtchen hin.\n@c2@"
  en: "@aHank Hoffman Jr.@bIf we can git us together a sizeable crowd on this here prairie, we'll be able to build us a mighty fine metropolis in no time flat.\n@c2@"
  es: "@aJuanchito@bSi reunimos a suficiente gente acá en esta llanura, pues podremos construir una metrópolis rebonita reterápido.\n@c2@"
  fr: "@aHank Hoffman Jr@bSi à nous tous, on rassemblait suffisamment d'monde sur cette prairie, on pourrait s'construire une sacrée jolie ville en un rien d'temps.\n@c2@"
  it: "@aJohn Dwayne Jr.@bSe riuscissi ad attirare qui un po' di gente, questo pezzo di prateria si trasformerebbe in una città coi fiocchi in un batter d'occhio.\n@c2@"
  ja: "@a@bホフマン「人が集まれば　きっと\n\tこの不毛の地にも　立派な町が\n\t生まれるはずですよ！\n@c2@"
"10":
  de: "@aHank Hoffman Jr.@bIch brauch' nur 'n paar Leute, die sich fürs Anpacken nicht zu schade sind, um die Sache ins Rollen zu bringen.\n@c2@"
  en: "@aHank Hoffman Jr.@bI need me a couple o' helpin' hands to git this here town o' mine started.\n@c2@"
  es: "@aJuanchito@bNomás que necesito un par de manos acá para levantar esta ciudad.\n@c2@"
  fr: "@aHank Hoffman Jr@bJ'aurais b'soin de quelques volontaires pour m'aider à faire naître cette ville.\n@c2@"
  it: "@aJohn Dwayne Jr.@bMi serve un po' d'aiuto per aumentare la popolazione della mia nuova città.\n@c2@"
  ja: "@a@bホフマン「この地に　町を作るには\n\tとにかく　人手が必要です。\n@c2@"
"11":
  de: "@aHank Hoffman Jr.@bZum Beispiel in dem Dorf Laissez Fayre ⓚⓛ soll's da nicht einen geben, der am liebsten weg will? Hängt dort wohl in der Kirche rum.\n@c2@"
  en: "@aHank Hoffman Jr.@bI seem to recall hearin' about someone who was jes' itchin' fer a new life hangin' around in the church down there in little ol' Laissez Fayre.\n@c2@"
  es: "@aJuanchito@bRecuerdo que me hablaron de alguien que andaba buscando una nueva vida y que estaba en la iglesia, allá en Laissez Fayre.\n@c2@"
  fr: "@aHank Hoffman Jr@bJ'crois m'souvenir d'avoir entendu parler de quelqu'un qui voulait changer d'vie du côté d'la p'tite ville de Teafortwo.\n@c2@"
  it: "@aJohn Dwayne Jr.@bPer esempio, ricordo che, nei pressi della chiesa di Laissez Fayre, c'era qualcuno che voleva tagliare con il passato e ricominciare altrove.\n@c2@"
  ja: "@a@bホフマン「そういえば　モンバーバラの町の\n\t教会で　新天地をもとめる\n\t旅人を見たという人が　いたとか……。\n@c2@"
"12":
  de: "@aHank Hoffman Jr.@bWenn Euch so jemand über den Weg läuft, erzählt ihnen einfach von meiner kleinen Pionierstadt hier, ja?\n@c2@"
  en: "@aHank Hoffman Jr.@bIf y'all come across anyone like that, you'll tell 'em all about my little frontier town here, won't you now?\n@c2@"
  es: "@aJuanchito@bSi %H860%Xse encuentra%Yse encuentran%Z con alguien así, %H860%Xháblele%Yháblenle%Z de esta pequeña ciudad fronteriza, ¿ok?\n@c2@"
  fr: "@aHank Hoffman Jr@bSi jamais vous croisez des gens comme ça, parlez-leur de ma p'tite ville pionnière, d'accordⓡ \n@c2@"
  it: "@aJohn Dwayne Jr.@bQuando %H860%Xti%Yvi%Z capiterà di incontrare altre persone che hanno voglia di iniziare una nuova vita, %H860%Xdi'%Ydite%Z loro di questa nuova città di frontiera. D'accordo?\n@c2@"
  ja: "@a@bホフマン「もし　そんな人に　出会ったら\n\tどうか　この地のことを\n\tすすめてくださいませんか？\n@c2@"
"13":
  de: "@aHank Hoffman Jr.@bWenn wir nur genügend Leute in die Prärie locken können, bauen wir uns hier in null Komma nix 'n schmuckes neues Städtchen hin.\n@c2@"
  en: "@aHank Hoffman Jr.@bIf we can git us together a sizeable crowd on this here prairie, we'll be able to build us a mighty fine metropolis in no time flat.\n@c2@"
  es: "@aJuanchito@bSi reunimos a suficiente gente acá, en esta llanura, pues podremos construir una metrópolis bien bella en un santiamén.\n@c2@"
  fr: "@aHank Hoffman Jr@bSi à nous tous, on rassemblait suffisamment d'monde sur cette prairie, on pourrait s'construire une sacrée jolie ville en un rien d'temps.\n@c2@"
  it: "@aJohn Dwayne Jr.@bSe riuscissi ad attirare qui un po' di gente, questo pezzo di prateria si trasformerebbe in una vera metropoli in un batter d'occhio.\n@c2@"
  ja: "@a@bホフマン「人が集まれば　きっと\n\tこの不毛の地にも　立派な町が\n\t生まれるはずですよ！\n@c2@"
"14":
  de: "@a@b*: Friede sei mit Euch. Ich bin eine Wandernonne und hierhergekommen, um den Bedürftigen auf jede erdenkliche Weise zu helfen.\n@c1@"
  en: "@a@b*: Peace be with you. I am an itinerant nun. I set out from my motherland to aid those in need in any way I could.\n@c1@"
  es: "@a@b*: La paz sea contigo. Soy una monja misionera. Dejé mi hogar para ayudar a los necesitados en todo aquello en que pudiera.\n@c1@"
  fr: "@a@b*ⓢ La paix soit avec vous. Je suis une religieuse itinérante. J'ai quitté mon pays d'origine pour aider du mieux que je peux tous ceux qui en ont besoin .\n@c1@"
  it: "@a@b*: Che la pace sia con %H860%Xte%Yvoi%Z! Sono una suora errante, partita dalla mia terra natale per portare il mio aiuto ovunque ci sia bisogno.\n@c1@"
  ja: "@a@b＊「私は　旅の尼。\n\t人さまの　お役に立ちたいと願い\n\t故郷を出てまいりました。\n@c1@"
"15":
  de: "@a@b*: Gäbe es nur irgendwo eine Pionierstadt, dann könnte ich ihren Bewohnern sicher gute Dienste leisten.\n@c1@"
  en: "@a@b*: If I could find myself a fledgling settlement somewhere, I am sure I could be of great use to\nits inhabitants.\n@c1@"
  es: "@a@b*: Si lograra encontrar un nuevo asentamiento en algún lugar, estoy segura de que podría ser de gran ayuda para sus habitantes.\n@c1@"
  fr: "@a@b*ⓢ Si je pouvais me trouver une petite localité toute nouvelle quelque part, je suis sûre que je pourrais être d'un grand secours à ses habitants.\n@c1@"
  it: "@a@b*: Sarei felicissima di fornire supporto spirituale a una nuova comunità, agli abitanti di una cittadina di nuova fondazione.\n@c1@"
  ja: "@a@b＊「どこか　新しくできた町ならば\n\t私のような者でも　なにか\n\tお役に立てるかも知れないのですが……。\n@c1@"
"16":
  de: "@a@bMöchtest du ihr von Hank Hoffman Jr.s Pionierstadt erzählen?\n@c1@"
  en: "@a@bDo you want to tell her about Hank Hoffman Jr.'s frontier town?\n@c1@"
  es: "@a@b¿Deseas hablarle de la ciudad fronteriza de Juanchito?\n@c1@"
  fr: "@a@bVoulez-vous lui parler de la ville pionnière de\nHank Hoffman Jrⓡ\n@c1@"
  it: "@a@bVuoi dirle della nuova città di frontiera fondata da John Dwayne Jr.?\n@c1@"
  ja: "@a@bこの人に　ホフマンの町のことを\n教えてあげますか？\n@c1@"
"17":
  de: "@a@b*: Dann baut dieser Mr. Hoffman also gerade eine ganz neue Stadt auf?\n@c1@"
  en: "@a@b*: So this Mr. Hoffman is establishing a town of\nhis own?\n@c1@"
  es: "@a@b*: ¿De modo que ese tal Juanchito está fundando una ciudad propia?\n@c1@"
  fr: "@a@b*ⓢ Alors comme ça, ce M. Hoffman est en train de créer sa propre villeⓡ\n@c1@"
  it: "@a@b*: E così un certo signor Dwayne ha fondato una nuova città?\n@c1@"
  ja: "@a@b＊「まあ！　ホフマンさんという方が\n\t町づくりを　始めるのですね。\n@c1@"
"18":
  de: "@a@b*: Da danke ich Euch von Herzen! Ich mache mich sofort dorthin auf den Weg.\n@c1@"
  en: "@a@b*: My humblest thanks! I shall make my way there forthwith.\n@c1@"
  es: "@a@b*: Mi más sincero agradecimiento. Emprenderé mi camino hacia allá inmediatamente.\n@c1@"
  fr: "@a@b*ⓢ Je vous remercie humblementⓠ Je vais m'y rendre immédiatement.\n@c1@"
  it: "@a@b*: Oh, grazie per l'informazione! Mi dirigerò immediatamente lì! Magari potrei svolgere la mia missione in quel nuovo insediamento.\n@c1@"
  ja: "@a@b＊「ありがとうございます！\n\tさっそく　その地へ\n\tうかがわせていただきますわ。\n@c1@"
"19":
  de: "@a@b*: Lebt wohl. Ich bete darum, dass auch Ihr auf Euren Reisen Euer gelobtes Land finden werdet.\n@c1@"
  en: "@a@b*: Farewell, travellers. I pray that you settle in your promised land.\n@c1@"
  es: "@a@b*: Adiós, %H860%X%A120%Xviajero%Z%B120%Xviajera%Z%Y%R000%Xviajeras%Yviajeros%Z%Z. Rezaré para que %H860%Xencuentre su%Yencuentren su%Z tierra prometida.\n@c1@"
  fr: "@a@b*ⓢ Au revoir, %H860%X%A120%Xvoyageur%Z%B120%Xvoyageuse%Z%Y%R000%Xvoyageuses %Yvoyageurs%Z%Z. Je vous souhaite de trouver votre terre promise.\n@c1@"
  it: "@a@b*: Addio, e che la dea vegli su di %H860%Xte! Ti%Yvoi! Vi%Z auguro di trovare molto presto la %H860%Xtua%Yvostra%Z terra promessa.\n@c1@"
  ja: "@a@b＊「さようなら　旅のお方。\n\tあなたも　ふさわしい土地に\n\t出会えますように。\n@c1@"
"20":
  de: "@a@b%0%a00120 liest das Schild.\n@c0@"
  en: "@a@b%0%a00120 reads the sign.\n@c0@"
  es: "@a@b%0%a00120 lee el cartel.\n@c0@"
  fr: "@a@b%0%a00120 lit l'écriteau.\n@c0@"
  it: "@a@b%0%a00120 legge il cartello.\n@c0@"
  ja: "@a@b%a00120は　立て札を　読んだ。\n@c0@"
"21":
  de: "@a@bⓞHier entsteht eine neue Stadt!ⓟ\n@c0@"
  en: "@a@bⓗThe pioneering done gone got started!ⓘ\n@c0@"
  es: "@a@bⓕ¡La colonización ya ha comenzado!ⓖ\n@c0@"
  fr: "@a@bⓥLes pionniers sont partis ouvrir la voieⓠⓦ\n@c0@"
  it: "@a@bⓕIl lavoro dei pionieri è iniziato!ⓖ\n@c0@"
  ja: "@a@b“すれちがい通信　はじめました”\n@c0@"
"22":
  de: "@aHank Hoffman Jr.@bTut mir leid, Partner. Muss erst noch ein bisschen was vorbereiten.\n@c2@"
  en: "@aHank Hoffman Jr.@bSorry, pardner, I'm still gittin' a few things ready for the git-go.\n@c2@"
  es: "@aJuanchito@bLo siento, %H860%X%A120%Xsocio%Z%B120%Xsocia%Z%Y%R000%Xsocias%Ysocios%Z%Z, pues nomás aún ando preparando algunas cositas para poner esto en marcha.\n@c2@"
  fr: "@aHank Hoffman Jr@bDésolé, part'naire. J'suis encore en train d'préparer un ou deux trucs pour l'grand début.\n@c2@"
  it: "@aJohn Dwayne Jr.@b%H860%XScusa%YScusate%Z, ma ci sono ancora alcune cose a cui devo lavorare.\n@c2@"
  ja: "@a@bホフマン「あっ　すみません。\n\tまだ　じゅんび中でして……。\n@c2@"
"23":
  de: "@aHank Hoffman Jr.@bWarum seht Ihr Euch nicht noch 'n bisschen in der Stadt um, bis ich so weit bin?\n@c2@"
  en: "@aHank Hoffman Jr.@bWhy don'tcha have %D120%Xyourself%Yyourselves%Z a stroll around town there, 'til such time as I'm fully prepared?\n@c2@"
  es: "@aJuanchito@b¿Por qué no %H860%Xva%Yvan%Z a dar un paseo por allá hasta que acabe de completar esto?\n@c2@"
  fr: "@aHank Hoffman Jr@bSi vous alliez faire un tour en ville, jusqu'à c'que j'aie fini mes préparatifsⓡ\n@c2@"
  it: "@aJohn Dwayne Jr.@bPerché non %H860%Xfai%Yfate%Z un giro in città mentre %H860%Xaspetti%Yaspettate%Z che io finisca?\n@c2@"
  ja: "@a@bホフマン「せっかくですから　もう少し\n\t町の様子を見ていらしては\n\tどうでしょう。\n@c2@"
"24":
  de: "@aHank Hoffman Jr.@bIch hab' da draußen am Teich 'n mächtig merkwürdigen Frosch gesehen.\n@c2@"
  en: "@aHank Hoffman Jr.@bI seen me a mighty strange frog down by the\npond there.\n@c2@"
  es: "@aJuanchito@bVi un extraño ranito allá abajo en el estanque.\n@c2@"
  fr: "@aHank Hoffman Jr@bJ'ai vu un sacré drôle de crapaud près d'la mare, là-bas.\n@c2@"
  it: "@aJohn Dwayne Jr.@bChe strano... Ho visto una rana davvero bizzarra vicino a quello specchio d'acqua.\n@c2@"
  ja: "@a@bホフマン「そういえば　池のほとりで\n\tめずらしいカエルを　見たような……。\n@c2@"
"25":
  de: "@aHank Hoffman Jr.@bTja, ich schätze, 'ne Oase mitten in der Wüste lockt alle möglichen Viecher an ⓚⓛ auch Frösche.\n@c2@"
  en: "@aHank Hoffman Jr.@bI guess an oasis way out in a desert such as this'll bring all manner o' critters out to play, even froggies.\n@c2@"
  es: "@aJuanchito@bSupongo que este oasis en mitad del desierto atraerá todo tipo de animales, incluso ranitos.\n@c2@"
  fr: "@aHank Hoffman Jr@bJ'suppose qu'une oasis au fin fond d'un désert pareil attire toutes sortes de créatures, même des crapauds.\n@c2@"
  it: "@aJohn Dwayne Jr.@bMa perché mi stupisco? È normale che un'oasi in mezzo al deserto attiri animali di ogni genere, e le rane non sono certo escluse!\n@c2@"
  ja: "@a@bホフマン「砂ばくでも　オアシスがあると\n\tカエルみたいな　生き物も\n\tいるんですね。\n@c2@"
"26":
  de: "@aHank Hoffman Jr.@bDann können wir uns ja endlich an die Arbeit machen!\n@c2@"
  en: "@aHank Hoffman Jr.@bNow, let's git down to the real business at hand!\n@c2@"
  es: "@aJuanchito@bAhorita, manos a la obra.\n@c2@"
  fr: "@aHank Hoffman Jr@bMaintenant, passons aux choses sérieusesⓠ\n@c2@"
  it: "@aJohn Dwayne Jr.@bD'accordo. C'è un'altra cosa di cui volevo %H860%Xparlarti%Yparlarvi%Z...\n@c2@"
  ja: "@a@bホフマン「では　そろそろ　本題に\n\t入りましょう！\n@c2@"
"27":
  de: "@aHank Hoffman Jr.@bUm ehrlich zu sein, ich hatte 'n paar Zufallsbegegnungen.\n@c2@"
  en: "@aHank Hoffman Jr.@bTruth o' the matter is, I been havin' me some chance encounters.\n@c2@"
  es: "@aJuanchito@bLa verdad es que he tenido algunos encuentros al azar.\n@c2@"
  fr: "@aHank Hoffman Jr@bLa vérité, c'est qu'y faut faire des rencontres aléatoires.\n@c2@"
  it: "@aJohn Dwayne Jr.@bRecentemente mi è capitato di fare degli incontri a sorpresa.\n@c2@"
  ja: "@a@bホフマン「じつは　私\n\tすれちがい通信を　はじめたんです。\n@c2@"
"28":
  de: "@aHank Hoffman Jr.@bIch hab 'n paar mächtig alte Bücher gelesen, weil ich dachte, ich finde dort vielleicht 'n paar Tipps für uns aufstrebende Pioniere.\n@c2@"
  en: "@aHank Hoffman Jr.@bI done me some readin' of some mighty old books, thinkin' I might find some stuff us pioneers could make good use of.\n@c2@"
  es: "@aJuanchito@bPues leí algunos libros antiguos porque pensé que podría encontrar algo de utilidad para nosotros, los pioneros.\n@c2@"
  fr: "@aHank Hoffman Jr@bJ'ai lu d'vieux bouquins drôlement intéressants en m'disant que j'pourrais y trouver des trucs utiles pour nous autres, pionniers.\n@c2@"
  it: "@aJohn Dwayne Jr.@bMentre leggevo un vecchio libro per imparare qualcosa che possa aiutare noi pionieri, ho fatto una scoperta interessante.\n@c2@"
  ja: "@a@bホフマン「町づくりに　協力してくださる\n\tみなさんの　お役に立てばと\n\t古い書物を　調べましてね。\n@c2@"
"29":
  de: "@aHank Hoffman Jr.@bTja, jetzt haben wir schon eine Herberge, und jeden Tag kommen mehr Leute hierher.\n@c2@"
  en: "@aHank Hoffman Jr.@bWhy, we got us an inn now, an' more 'n' more folks're comin' here every day.\n@c2@"
  es: "@aJuanchito@bPues ya tenemos posada nomás y todos los días está bien repleta de visitantes.\n@c2@"
  fr: "@aHank Hoffman Jr@bEh ben, on a une auberge maintenant, et il arrive de plus en plus de gens tous les jours.\n@c2@"
  it: "@aJohn Dwayne Jr.@bAdesso qui c'è anche una locanda, e ogni giorno che passa arriva altra gente.\n@c2@"
  ja: "@a@bホフマン「宿屋もできて　住民も\n\tだいぶ　ふえたようですよ。\n@c2@"
"30":
  de: "@aHank Hoffman Jr.@bIch kann Euch gar nicht genug danken, %a00140! Sucht nur immer schön weiter nach Zufallsbegegnungen, ja?\n@c2@"
  en: "@aHank Hoffman Jr.@bI can't thank you enough, %a00140. You keep on havin' them chance encounters now, y'hear?\n@c2@"
  es: "@aJuanchito@bJamás podré agradecérselo lo suficiente, %a00140. Siga teniendo esos encuentros al azar, ¿me oye?\n@c2@"
  fr: "@aHank Hoffman Jr@bJ'vous remercierai jamais assez, %a00140. Continuez les rencontres aléatoires, d'accordⓡ\n@c2@"
  it: "@aJohn Dwayne Jr.@bNon so proprio come %H860%Xringraziarti, %a00140! Mi stai%Yringraziarvi! Mi state%Z aiutando davvero tantissimo! E mi raccomando... %H860%XContinua%YContinuate%Z a fare incontri a sorpresa!\n@c2@"
  ja: "@a@bホフマン「さすが　%a00140さん！\n\tすれちがい通信は　どんどん\n\t私に　言いつけてくださいね。\n@c2@"
"31":
  de: "@aHank Hoffman Jr.@bWas kann ich für Euch tun?\n@c2@"
  en: "@aHank Hoffman Jr.@bAlrighty, what can I do for y'all?\n@c2@"
  es: "@aJuanchito@bOk, ¿qué puedo hacer por %H860%Xusted%Yustedes%Z?\n@c2@"
  fr: "@aHank Hoffman Jr@bBon, dites-moi un peu, qu'est-ce que j'peux faire pour vousⓡ\n@c2@"
  it: "@aJohn Dwayne Jr.@bAllora, cosa posso fare per %H860%Xte%Yvoi%Z?\n@c2@"
  ja: "@a@bホフマン「さて　何を　いたしましょう？\n@c2@"
"32":
  de: "@aHank Hoffman Jr.@bTagchen, %a00140! Wir haben den Grundstein für eine richtige Pionierpension gelegt!\n@c2@"
  en: "@aHank Hoffman Jr.@bWell, howdy, %a00140! We done gone an' started buildin' us a gosh-durned Pioneeratorium!\n@c2@"
  es: "@aJuanchito@b¡Qué onda, %a00140! ¡Lo hicimos, ya comenzamos a construir un tremendo pioneratorio!\n@c2@"
  fr: "@aHank Hoffman Jr@bSalut, %a00140ⓠ On a commencé à construire un super pionnieratoriumⓠ\n@c2@"
  it: "@aJohn Dwayne Jr.@bCome va%H860%X, %a00140? Sai%Y? Sapete%Z? Abbiamo iniziato a costruire l'Ostello dei Pionieri!\n@c2@"
  ja: "@a@bホフマン「やあ　%a00140さん！\n\t町では　とうとう　迎ひん館の建設が\n\t始まったようですね。\n@c2@"
"33":
  de: "@aHank Hoffman Jr.@bDas haut mich doch glatt aus den Latschen! %a00260 ist ja mächtig gewachsen! Kaum zu fassen!\n@c2@"
  en: "@aHank Hoffman Jr.@bWell, don't that just beat all! %a00260's gotten so big an' all, I can't barely believe it!\n@c2@"
  es: "@aJuanchito@bVaya, ¡esto supera todo lo demás! ¡%0%a00260 ha crecido tanto que ni siquiera puedo creerlo!\n@c2@"
  fr: "@aHank Hoffman Jr@bFranchement, c'est du tonnerreⓠ %a00260 est devenue tellement grande que j'ai du mal à y croireⓠ\n@c2@"
  it: "@aJohn Dwayne Jr.@bChe spettacolo fantastico! Se penso a quanto è cresciuta la mia cara %a00260, mi commuovo come un vitello...\n@c2@"
  ja: "@a@bホフマン「%a00260が\n\tあれだけ　大きな町に　育ってくれて\n\t私は　感無量です……！\n@c2@"
"34":
  de: "@aHank Hoffman Jr.@bUnd das alles nur dank Euch. Ich weiß gar nicht, was ich sagen soll! Aber 's ist schon noch ein bisschen Platz zum Weiterwachsen da, wisst Ihr!\n@c2@"
  en: "@aHank Hoffman Jr.@bAn' it's all thanks to y'all. Why, I don't rightly know what to say. But there's still room for the ol' girl to grow, you know!\n@c2@"
  es: "@aJuanchito@bY es todo gracias a %H860%Xusted%Yustedes%Z. Pues no sé ni qué decir. Pero sigue habiendo sitio para que la cosa crezca, ¡ya %H860%Xsabe%Ysaben%Z!\n@c2@"
  fr: "@aHank Hoffman Jr@bEt tout ça grâce à vous. Franchement, j'sais pas quoi dire. Mais bon, il reste quand même assez d'place pour qu'elle continue à pousser, vous savezⓠ\n@c2@"
  it: "@aJohn Dwayne Jr.@bE il merito è tutto %H860%Xtuo%Yvostro%Z! Non so come %H860%Xesprimerti%Yesprimervi%Z la mia riconoscenza! E non è mica finita qui, %H860%Xsai%Ysapete%Z? Questo posto può crescere ancora tanto!\n@c2@"
  ja: "@a@bホフマン「これも　みんな\n\t%a00140さんたちの　おかげです。\n\tこの町は　まだまだ　発展しますよ！\n@c2@"
"35":
  de: "@aHank Hoffman Jr.@bWas kann ich für Euch tun?\n@c2@"
  en: "@aHank Hoffman Jr.@bAlrighty, what can I do for y'all?\n@c2@"
  es: "@aJuanchito@bOk, ¿qué puedo hacer por %H860%Xusted%Yustedes%Z?\n@c2@"
  fr: "@aHank Hoffman Jr@bBon, dites-moi un peu, qu'est-ce que j'peux faire pour vousⓡ\n@c2@"
  it: "@aJohn Dwayne Jr.@bAllora, cosa posso fare per %H860%Xte%Yvoi%Z?\n@c2@"
  ja: "@a@bホフマン「さて　何を　いたしましょう？\n@c2@"
"36":
  de: "@aHank Hoffman Jr.@bTagchen! Willkommen zurück!\n@c2@"
  en: "@aHank Hoffman Jr.@bHowdy y'all! Welcome back!\n@c2@"
  es: "@aJuanchito@b¡Saludos! ¡%H860%X%A120%XBienvenido%Z%B120%XBienvenida%Z%Y%R000%XBienvenidas%YBienvenidos%Z%Z de nuevo!\n@c2@"
  fr: "@aHank Hoffman Jr@bSalutⓠ Content d'vous r'voirⓠ\n@c2@"
  it: "@aJohn Dwayne Jr.@bEhilà! Sono felice di %H860%Xrivederti%Yrivedervi%Z!\n@c2@"
  ja: "@a@bホフマン「いや～　みなさん\n\tようこそ　いらっしゃいました。\n@c2@"
"37":
  de: "@aHank Hoffman Jr.@bWas sagt Ihr nun? Eine Burg! Ich hatte ja große Pläne mit dieser Stadt, aber eine Burg? Damit hätte ich nie gerechnet!\n@c2@"
  en: "@aHank Hoffman Jr.@bWhaddya make o' the ol' place now, huh? A castle!\nI had me some high hopes for this town, but a castle? Why, I never expected that!\n@c2@"
  es: "@aJuanchito@b¿Qué %H860%Xme dice%Yme dicen%Z de la ciudad?, ¿eh? ¡Un castillo!\nPues tenía muchas esperanzas para este lugar, ¿pero un castillo? ¡Nunca lo hubiera imaginado!\n@c2@"
  fr: "@aHank Hoffman Jr@bQu'est-ce que vous dites de cet endroit, heinⓡ Il y a un châteauⓠ Cette ville, j'y croyais dur comme fer, mais un châteauⓡ J'aurais jamais imaginé çaⓠ\n@c2@"
  it: "@aJohn Dwayne Jr.@bBello, eh? Ora qui c'è addirittura un castello! Sapevo che ci saremmo ingranditi, ma non avrei mai pensato che avremmo avuto un castello!\n@c2@"
  ja: "@a@bホフマン「町のようすは　どうでしたか？\n\tお城が　できるなんて\n\t私も　びっくりですよ！\n@c2@"
"38":
  de: "@aHank Hoffman Jr.@bWas kann ich für Euch tun?\n@c2@"
  en: "@aHank Hoffman Jr.@bAlrighty, what can I do for y'all?\n@c2@"
  es: "@aJuanchito@bOk, ¿qué puedo hacer por %H860%Xusted%Yustedes%Z?\n@c2@"
  fr: "@aHank Hoffman Jr@bBon, dites-moi un peu, qu'est-ce que j'peux faire pour vousⓡ\n@c2@"
  it: "@aJohn Dwayne Jr.@bAllora, cosa posso fare per %H860%Xte%Yvoi%Z?\n@c2@"
  ja: "@a@bホフマン「さて　何を　いたしましょう？\n@c2@"
"39":
  de: "@aHank Hoffman Jr.@bIhr müsst mal 'n bisschen rasten, wenn wir ein paar Zufallsbegegnungen haben wollen. Lasst die Abenteurerei mal 'ne Weile sein.\n@c2@"
  en: "@aHank Hoffman Jr.@bY'all are gonna have to cool your heels awhile if we're gonna have us some chance encounters. It'll mean layin' off the adventurin' for a spell.\n@c2@"
  es: "@aJuanchito@bPues tendremos todos que esperar un poco si queremos tener encuentros al azar. Habrá que posponer las aventuras un poco nomás.\n@c2@"
  fr: "@aHank Hoffman Jr@bIl va falloir vous poser un peu si vous voulez faire des rencontres aléatoires. Autrement dit, faudrait faire une p'tite pause dans votre aventure.\n@c2@"
  it: "@aJohn Dwayne Jr.@bSe %H860%Xvuoi%Yvolete%Z fare degli incontri a sorpresa, %H860%Xti conviene fermarti%Yvi conviene fermarvi%Z per un po'. Proprio così: %H860%Xdevi interrompere temporaneamente la tua%Ydovete interrompere temporaneamente la vostra%Z avventura.\n@c2@"
  ja: "@a@bホフマン「すれちがい通信をするには\n\tみなさんの冒険を　いったん\n\tお休みしなければなりません。\n@c2@"
"40":
  de: "@aHank Hoffman Jr.@bWär's denn okay für Euch, wenn ich Eure Geschichte in einem Abenteuertagebuch aufzeichnen würde?\n@c2@"
  en: "@aHank Hoffman Jr.@bWould it be okay with y'all if I recorded your story so far in an adventure log?\n@c2@"
  es: "@aJuanchito@b¿Quiere que nomás guarde su historia en un registro de aventuras?\n@c2@"
  fr: "@aHank Hoffman Jr@bVous seriez d'accord pour que j'enregistre votre aventure dans un journalⓡ\n@c2@"
  it: "@aJohn Dwayne Jr.@bChe ne %H860%Xdici di salvare i tuoi%Ydite di salvare i vostri%Z progressi nel diario dell'avventura?\n@c2@"
  ja: "@a@bホフマン「これまでの旅を\n\t冒険の書に　記録しますが\n\tよろしいですか？\n@c2@"
"41":
  de: "@aHank Hoffman Jr.@bWo wollt Ihr Eure Geschichte speichern, Partner?\n@c2@"
  en: "@aHank Hoffman Jr.@bWhich slot d'you wanna save this sucker\nin, pardner?\n@c2@"
  es: "@aJuanchito@b¿En qué ranura quiere guardarlo?\n@c2@"
  fr: "@aHank Hoffman Jr@bOù voulez-vous que j'la sauvegarde, part'naireⓡ\n@c2@"
  it: "@aJohn Dwayne Jr.@bDove %H860%Xvuoi%Yvolete%Z effettuare il salvataggio?\n@c2@"
  ja: "@a@bホフマン「では　なんばんの\n\t冒険の書に　記録しますか？\n@c2@"
"42":
  de: "@aHank Hoffman Jr.@bKann ich wirklich dieses Abenteuerbuch hier überschreiben:\n%a00660: %a00090 %a00240?\n@c2@"
  en: "@aHank Hoffman Jr.@bYou sure you're alright with me savin' over this here adventure log:\n%a00660: %a00090　%a00240?\n@c2@"
  es: "@aJuanchito@b¿Seguro que quiere sobrescribir este registro de aventuras:\n%a00660: %a00090 %a00240?\n@c2@"
  fr: "@aHank Hoffman Jr@bVous êtes sûr que vous voulez que j'écrase le journal suivantⓢ\n%a00660ⓢ %a00090　%a00240ⓡ\n@c2@"
  it: "@aJohn Dwayne Jr.@bPosso salvare i %H860%Xtuoi%Yvostri%Z progressi nel diario dell'avventura\n%a00660: %a00090　%a00240?\n@c2@"
  ja: "@a@bホフマン「それでは\n\t%a00660：%a00090　%a00240の\n\t記録に上書きして　よろしいですか？\n@c2@"
"43":
  de: "@a@bAbenteuertagebuch wird gespeichert.\nBitte das Gerät nicht abschalten und die DS-Karte nicht entfernen!\n@c0@"
  en: "@a@bSaving adventure log.\nDo not turn the power OFF\nor remove the DS Game Card!\n@c0@"
  es: "@a@bGuardando registro de aventuras.\nNo apagues la consola\nni extraigas la tarjeta DS.\n@c0@"
  fr: "@a@bSauvegarde du journal en cours.\nNe pas éteindre la console ni retirer\nla carte de jeu DSⓠ\n@c0@"
  it: "@a@bSalvataggio del diario dell'avventura.\nNon spegnere la console\ne non rimuovere la scheda di gioco DS!\n@c0@"
  ja: "@a@b冒険の書に　記録しています。\n電源を切らないで下さい。\nカードを引き抜かないで下さい。\n@c0@"
"44":
  de: "@a@bAbenteuertagebuch konnte nicht gespeichert werden.\nBitte das Gerät abschalten und die DS-Karte erneut einstecken.\n@c2@"
  en: "@a@bThe adventure log could not be\nsaved. Please turn the power OFF\nand reinsert the DS Game Card.\n@c2@"
  es: "@a@bNo se ha podido guardar el registro de aventuras.\nApaga la consola y vuelve a\ninsertar la tarjeta DS.\n@c2@"
  fr: "@a@bÉchec de la sauvegarde du journal.\nVeuillez éteindre la console et réinsérer\nla carte de jeu DS.\n@c2@"
  it: "@a@bNon è stato possibile salvare il diario dell'avventura. Spegni la console e inserisci nuovamente la scheda di gioco DS.\n@c2@"
  ja: "@a@b冒険の書に　記録できませんでした。\n電源を切って　カードを差し込み\n直してください。\n@c2@"
"45":
  de: "@aHank Hoffman Jr.@bDamit hätten wir das gespeichert, Partner! Bereit, %a00280 als Pionier zu entsenden?\n@c2@"
  en: "@aHank Hoffman Jr.@bThat's 'er saved, pardner! You ready to send ol' %a00280 out a-pioneerin'?\n@c2@"
  es: "@aJuanchito@b¡Ándale, se ha guardado! ¿Está listo para enviar a %a00280 a colonizar nuevos territorios?\n@c2@"
  fr: "@aHank Hoffman Jr@bVoilà, la sauvegarde est faite, part'naireⓠ Vous êtes prêt à envoyer %a00280 jouer les émissairesⓡ\n@c2@"
  it: "@aJohn Dwayne Jr.@bSalvataggio completato! Che ne %H860%Xdici%Ydite%Z di mandare %a00280 un po' in giro a fare il suo dovere di %A280%Xpioniere%Z%B280%Xpioniera%Z%C280%Xpioniere%Z?\n@c2@"
  ja: "@a@bホフマン「たしかに　記録しました。\n\tでは　%a00280さんに　すれちがいを\n\tはじめてもらって　いいですか？\n@c2@"
"46":
  de: "@aHank Hoffman Jr.@bWir können erst einen Pionier entsenden, wenn Ihr Euer Know-How und so weiter aufgezeichnet habt, damit der Pionier sie weiterverbreiten kann.\n@c2@"
  en: "@aHank Hoffman Jr.@bWe can't send a pioneer out unless you've recorded all yer know-how an' yer story an' suchlike for the varmint to take with 'em.\n@c2@"
  es: "@aJuanchito@bNo se puede enviar un pionero hasta que guarde toda su aventura y sus progresos, para que este se los pueda llevar.\n@c2@"
  fr: "@aHank Hoffman Jr@bOn ne peut envoyer d'pionniers nulle part tant qu'on n'a pas enregistré toutes vos connaissances et votre histoire pour qu'ils puissent les emmener avec eux.\n@c2@"
  it: "@aJohn Dwayne Jr.@bNon %H860%Xpuoi%Ypotete%Z mandare gente in giro prima di aver salvato i %H860%Xtuoi%Yvostri%Z progressi nell'avventura. Altrimenti, quali conoscenze porterebbe con sé il pioniere?\n@c2@"
  ja: "@a@bホフマン「冒険の書を　大使に\n\tもたせなければ　すれちがいの世界と\n\t通信ができません。\n@c2@"
"47":
  de: "@aHank Hoffman Jr.@bWollt Ihr damit sagen, diese Zufallsbegegnungsgeschichte ist doch nicht Euer Ding? Möchtet Ihr das lieber lassen?\n@c2@"
  en: "@aHank Hoffman Jr.@bAre y'all sayin' y'aint so keen on this chance encounter business now? You wanna quit it?\n@c2@"
  es: "@aJuanchito@b¿Me está diciendo nomás que no le gusta todo eso de los encuentros al azar? ¿Quiere abandonar?\n@c2@"
  fr: "@aHank Hoffman Jr@bVous m'dites que finalement, cette histoire de rencontres aléatoires vous tente plus tropⓡ\nVous voulez vous retirer de l'affaireⓡ\n@c2@"
  it: "@aJohn Dwayne Jr.@bMi %H860%Xstai dicendo che ora non hai%Ystate dicendo che ora non avete%Z voglia di fare incontri a sorpresa? %H860%XPreferisci%YPreferite%Z lasciar perdere per il momento?\n@c2@"
  ja: "@a@bホフマン「すれちがい通信を\n\t中止しても　よろしいですか？\n@c2@"
"48":
  de: "@aHank Hoffman Jr.@bNa schön, dann immer schön vorsichtig da draußen, %a00280. Und viel Spaß!\n@c2@"
  en: "@aHank Hoffman Jr.@bAlright then, you go careful now, %a00280.\nHave yourself a whale of a time out there!\n@c2@"
  es: "@aJuanchito@bDe acuerdo entonces, que la Diosa me %A280%Xlo%Z%B280%Xla%Z%C280%XlⓅ%Z bendiga, %a00280.\n¡Páselo chido mientras esté por ahí!\n@c2@"
  fr: "@aHank Hoffman Jr@bBon, et prudence, hein, %a00280ⓠ\nAmuse-toi bien, là-basⓠ\n@c2@"
  it: "@aJohn Dwayne Jr.@bPerfetto, %a00280. Ora tocca a te.\nFai buon viaggio, e divertiti! In bocca al lupo!\n@c2@"
  ja: "@a@bホフマン「では　%a00280さ～ん\n\tいってらっしゃい！\n@c2@"
"49":
  de: "@a@bDS-Datenübertragung wird initiiert.\nBitte das Gerät nicht abschalten und die DS-Karte nicht entfernen!\n@c0@"
  en: "@a@bInitiating DS Wireless Communications.\nDo not turn the power OFF\nor remove the DS Game Card!\n@c0@"
  es: "@a@bIniciando la comunicación inalámbrica DS.\nNo apagues la consola\nni extraigas la tarjeta DS.\n@c0@"
  fr: "@a@bDébut de la communication sans fil DS.\nNe pas éteindre la console ni retirer\nla carte de jeu DSⓠ\n@c0@"
  it: "@a@bAvvio della comunicazione wireless DS.\nNon spegnere la console\ne non rimuovere la scheda di gioco DS!\n@c0@"
  ja: "@a@b通信を始めます。\n電源を切らないで下さい。\nカードを引き抜かないで下さい。\n@c0@"
"50":
  de: "@a@bZufallsbegegnungs-Modus aktiv. Wenn du willst, kannst du dein DS-System schließen.\nDrücke den A-Knopf, um den Modus zu beenden.\n@c0@"
  en: "@a@b         Now in Chance Encounter mode...\n   You can close your Nintendo DS if you wish.\n             Press the A Button to quit.\n@c0@"
  es: "@a@b Modo Encuentros al azar...\n Puedes cerrar la consola Nintendo DS si lo deseas.\n Pulsa el Botón A para salir.\n@c0@"
  fr: "@a@bVous êtes en mode Rencontres aléatoires... Vous pouvez fermer votre console si vous le désirez. Appuyez sur le bouton A pour quitter ce mode.\n@c0@"
  it: "@a@bÈ stata attivata la modalità Incontri a sorpresa. Se lo desideri, puoi chiudere la tua console Nintendo DS. Premi il pulsante A per uscire.\n@c0@"
  ja: "@a@b　　　　　　すれちがい通信中！！\n　ＤＳシリーズ本体を閉じても大丈夫です。\n\t　Ａボタンで　通信を中止できます。\n@c0@"
"51":
  de: "@a@bDrahtlose DS-Datenübertragung fortsetzen?\n@c0@"
  en: "@a@bDo you want to resume DS Wireless Communications?\n@c0@"
  es: "@a@b¿Quieres reanudar la comunicación inalámbrica DS?\n@c0@"
  fr: "@a@bVoulez-vous reprendre la\ncommunication sans fil DSⓡ\n@c0@"
  it: "@a@bVuoi riprendere la comunicazione wireless DS?\n@c0@"
  ja: "@a@bすれちがい通信を　中止しますか？\n@c0@"
"52":
  de: "@a@bPionierkollege gefunden!\nTauschen Daten aus...\n@c0@"
  en: "@a@bFellow pioneer located!\nExchanging data...\n@c0@"
  es: "@a@b¡Pionero localizado!\nIntercambiando datos...\n@c0@"
  fr: "@a@bAutre pionnier localiséⓠ\nÉchange des données en cours...\n@c0@"
  it: "@a@bHai incontrato un pioniere!\nScambio dei dati in corso...\n@c0@"
  ja: "@a@b別世界の　すれちがい大使が\nみつかりました！\nただ今　通信中です。\n@c0@"
"53":
  de: "@a@bDatenaustausch war erfolgreich.\n@c0@"
  en: "@a@bData exchanged successfully.\n@c0@"
  es: "@a@bDatos intercambiados con éxito.\n@c0@"
  fr: "@a@bDonnées échangées avec succès.\n@c0@"
  it: "@a@bScambio dei dati completato.\n@c0@"
  ja: "@a@b通信が　無事　完了しました。\n@c0@"
"54":
  de: "@a@bIn %a00260 ist ein neuer Mitbürger angekommen!\n@c0@"
  en: "@a@bA new citizen has arrived in %a00260!\n@c0@"
  es: "@a@b¡Un nuevo ciudadano ha llegado a %a00260!\n@c0@"
  fr: "@a@bUn nouveau citoyen est arrivé à %a00260ⓠ\n@c0@"
  it: "@a@bA %a00260 è arrivata una faccia nuova!\n@c0@"
  ja: "@a@b%a00260に　新しい住民が\nやって来たようです！\n@c0@"
"55":
  de: "@a@bAbenteuertagebuch konnte nicht gelesen werden.\nBitte das Gerät abschalten und die DS-Karte erneut einstecken.\n@c0@"
  en: "@a@bThe adventure log could not be\naccessed. Please turn the power OFF\nand reinsert the DS Game Card.\n@c0@"
  es: "@a@bNo se pudo leer el registro de aventuras.\nApaga la consola y vuelve a\ninsertar la tarjeta DS.\n@c0@"
  fr: "@a@bImpossible de lire le journal.\nVeuillez éteindre la console et réinsérer\nla carte de jeu DS.\n@c0@"
  it: "@a@bNon è stato possibile leggere il diario dell'avventura. Spegni la console e inserisci nuovamente la scheda di gioco DS.\n@c0@"
  ja: "@a@b冒険の書を　読み込めませんでした。\n電源を切って　カードを差し込み\n直してください。\n@c0@"
"56":
  de: "@aHank Hoffman Jr.@bDa brat' mir doch einer 'nen Kojoten! In %a00260 ist mehr los als in 'ner Goldgräberstadt im Goldrausch.\n@c2@"
  en: "@aHank Hoffman Jr.@bHold your horses, seems %a00260's fuller'n a boom town in gold rush season!\n@c2@"
  es: "@aJuanchito@b¡Momentito!\n㈡\n¡En %a00260 hay más gente que en una ciudad minera durante la fiebre del oro!\n@c2@"
  fr: "@aHank Hoffman Jr@bTout doux... Apparemment, %a00260 est aussi bondée qu'une ville en pleine ruée vers l'orⓠ\n@c2@"
  it: "@aJohn Dwayne Jr.@bPer mille carovane! Un formicaio è meno affollato di %a00260! Non c'è più spazio!\n@c2@"
  ja: "@a@bホフマン「あれ？　%a00260は　\n\tもう　すれちがいで来られる住民が\n\tいっぱいみたいですよ。\n@c2@"
"57":
  de: "@aHank Hoffman Jr.@bWenn Ihr neue Leute in die Stadt holen wollt, müssen sich wohl ein paar Alteingesessene auf die Suche nach 'ner neuen Bleibe machen.\n@c2@"
  en: "@aHank Hoffman Jr.@bGuess you gotta give someone the ol' heave ho if y'all wanna see some new faces in town.\n@c2@"
  es: "@aJuanchito@bIgual tendrá que mandar a alguien a paseo si quiere ver nuevos habitantes en la ciudad.\n@c2@"
  fr: "@aHank Hoffman Jr@bJ'crois qu'il va falloir dire adieu à quelqu'un si vous voulez que d'nouveaux visages apparaissent en ville.\n@c2@"
  it: "@aJohn Dwayne Jr.@bSe %H860%Xhai%Yavete%Z voglia di vedere qualche faccia nuova, %H860%Xdovrai%Ydovrete%Z dire a qualcuno degli attuali abitanti della città che è giunta l'ora di togliere le tende.\n@c2@"
  ja: "@a@bホフマン「すれちがい通信をしたい場合は\n\t町から　だれかに　退去してもらうしか\n\tありませんね……。\n@c2@"
"58":
  de: "@aHank Hoffman Jr.@bIst gar nicht so leicht, sich von Pionieren zu trennen, die für uns den weiten Weg hierher auf sich genommen haben.\n@c2@"
  en: "@aHank Hoffman Jr.@bIt does seem an awful shame, havin' to part with one o' them pioneers done us the favour o' comin' all the way out here in the first place.\n@c2@"
  es: "@aJuanchito@b¡Ay! Tener que deshacerse uno de un pionero después de que se tomase la molestia de haber venido hasta aquí.\n@c2@"
  fr: "@aHank Hoffman Jr@bC'est sûr, ça paraît dommage de devoir se séparer d'un des pionniers qui nous a fait l'honneur d'venir jusqu'ici pour s'installer.\n@c2@"
  it: "@aJohn Dwayne Jr.@bLo so, non è affatto bello dover cacciar via uno dei pionieri che sono venuti qui e hanno contribuito a costruire questo posto...\n@c2@"
  ja: "@a@bホフマン「せっかく　%a00260に\n\tやって来てくれた人と　別れるのは\n\tなごりおしいですけど……。\n@c2@"
"59":
  de: "@aHank Hoffman Jr.@bAber da kann man wohl nichts machen ⓚⓛ die Stadt braucht nun mal ständig neue Leute, um zu wachsen und sich zu verbessern.\n@c2@"
  en: "@aHank Hoffman Jr.@bBut I guess we can't help that this ol' town an' the people in 'er need all kinds movin' through to keep\non gettin' bigger an' better.\n@c2@"
  es: "@aJuanchito@bPero supongo que nomás no podemos evitar que esta ciudad y sus habitantes tengan que renovarse para seguir creciendo y mejorando.\n@c2@"
  fr: "@aHank Hoffman Jr@bMais y'a pas moyen d'faire autrement. Et puis cette ville et ses habitants ont besoin d'mouvement pour continuer à grandir et à s'améliorer.\n@c2@"
  it: "@aJohn Dwayne Jr.@bMa questo è il destino degli abitanti della frontiera: bisogna spostarsi di continuo, per favorire lo sviluppo e soddisfare le necessità di tutti.\n@c2@"
  ja: "@a@bホフマン「町の発展のためには\n\t人の入れかわりも　必要なこと。\n\tまあ　仕方ないですよね。\n@c2@"
"60":
  de: "@aHank Hoffman Jr.@bMal sehen, wen wir jetzt in den Sonnenuntergang reiten lassen könnten...\n@c2@"
  en: "@aHank Hoffman Jr.@bLet's have a look-see who we can maybe send off into the prairie sunset...\n@c2@"
  es: "@aJuanchito@bVeamos a quién podemos enviar a pasear bajo la puesta de sol en las praderas...\n@c2@"
  fr: "@aHank Hoffman Jr@bVoyons voir qui pourrait bien être le prochain à partir dans la prairie, au soleil couchant...\n@c2@"
  it: "@aJohn Dwayne Jr.@bVediamo un po' a chi possiamo dare il benservito...\n@c2@"
  ja: "@a@bホフマン「さて　今のところ\n\t町から　出ていってもらえる人は…。\n@c2@"
"61":
  de: "@aHank Hoffman Jr.@bDa brat' mir doch einer 'nen Kojoten. Anscheinend will keiner hier weg.\n@c2@"
  en: "@aHank Hoffman Jr.@bWell I'll be. Seems there ain't nobody willin' to up\nan' leave.\n@c2@"
  es: "@aJuanchito@b¡Ay, caramba! Pues parece que nomás nadie está dispuesto a marcharse.\n@c2@"
  fr: "@aHank Hoffman Jr@bEh ben, on dirait qu'personne veut partir d'ici. \n@c2@"
  it: "@aJohn Dwayne Jr.@bUhm... Mi pare che non ci sia nessuno che abbia voglia di filarsela da questo posto... \n@c2@"
  ja: "@a@bホフマン「おや？\n\tだれも　いませんね。\n@c2@"
"62":
  de: "@aHank Hoffman Jr.@bIch schätze, die wollen unbedingt alle hierbleiben. Und wer könnt's ihnen verdenken?\n@c2@"
  en: "@aHank Hoffman Jr.@bI guess all the folks in town right now're dead set on stickin' around. An' who can blame 'em, huh?\n@c2@"
  es: "@aJuanchito@bImagino que todos los de la ciudad están decididos a quedarse. Y ni modo de culparles, ¿eh?\n@c2@"
  fr: "@aHank Hoffman Jr@bJ'suppose que tous les gens d'la ville sont décidés à rester dans l'coin. Et qui pourrait leur en vouloir, heinⓡ\n@c2@"
  it: "@aJohn Dwayne Jr.@bPare proprio che siano tutti felici di vivere qui. E ci sarebbe da stupirsi del contrario!\n@c2@"
  ja: "@a@bホフマン「今　町にいる住民は\n\tどうやら　ずっと　この町に\n\t住みたいと思っているようです。\n@c2@"
"63":
  de: "@aHank Hoffman Jr.@b%0%a00290 also? Ihr wisst ja, dass Ihr %a00290 womöglich nie wiederseht?\n@c2@"
  en: "@aHank Hoffman Jr.@b%0%a00290, huh? Now, y'all know it might be that you never come across ol' %a00290 again, don't you now?\n@c2@"
  es: "@aJuanchito@b¿%0%a00290, eh? Puede que ya no %H860%Xvuelva%Yvuelvan%Z a ver a %a00290, ¿%H860%Xsabe%Ysaben%Z?\n@c2@"
  fr: "@aHank Hoffman Jr@b%0%a00290, heinⓡ Vous savez, il s'pourrait que vous ne vous recroisiez jamais...\n@c2@"
  it: "@aJohn Dwayne Jr.@b%0%a00290, eh? %H860%XSai che potresti%YSapete che potreste%Z non rivedere mai più %a00290, vero?\n@c2@"
  ja: "@a@bホフマン「%a00290さんですね。\n\t町を出てゆくと　再びすれちがうのは\n\t大変かもですが　いいですか？\n@c2@"
"64":
  de: "@aHank Hoffman Jr.@bNa schön. Dann schicke ich %a00290 gleich mal den Marschbefehl per Pony-Express.\n@c2@"
  en: "@aHank Hoffman Jr.@bAlrighty, then. I'll send down ol' %a00290's marchin' orders on the pony express.\n@c2@"
  es: "@aJuanchito@bDe acuerdo. Enviaré la orden de viaje para %A280%Xel pobre%Z%B280%Xla pobre%Z%C280%X%Z %a00290 por el Pony Express.\n@c2@"
  fr: "@aHank Hoffman Jr@bTrès bien. Alors j'vais donner l'signal du départ à %a00290 par le pony express.\n@c2@"
  it: "@aJohn Dwayne Jr.@bD'accordo. Dirò a %a00290 che dovrà smammare. Non sarà una cosa piacevole, ma qualcuno deve pur farlo...\n@c2@"
  ja: "@a@bホフマン「では　%a00290さんに\n\t町を出るように　伝えておきます。\n@c2@"
"65":
  de: "@aHank Hoffman Jr.@bWollt Ihr sonst noch wen rausschmeißen, wo Ihr gerade so schön in Schwung seid?\n@c2@"
  en: "@aHank Hoffman Jr.@bAnyone else you wanna give the boot while\nyou're here?\n@c2@"
  es: "@aJuanchito@b¿%H860%XQuiere%YQuieren%Z darle la patada a alguien más mientras %H860%Xestá%Yestán%Z aquí?\n@c2@"
  fr: "@aHank Hoffman Jr@bTant que vous y êtes, y'a d'autres personnes à qui vous voulez demander d'partirⓡ\n@c2@"
  it: "@aJohn Dwayne Jr.@b%H860%XVuoi%YVolete%Z mandar via altra gente?\n@c2@"
  ja: "@a@bホフマン「他にも　だれか　出しますか？\n@c2@"
"66":
  de: "@aHank Hoffman Jr.@bHabt's nicht übers Herz gebracht, was? Ich sag Euch was ⓚⓛ sich von seinen Partnern zu trennen ist gar nicht so einfach.\n@c2@"
  en: "@aHank Hoffman Jr.@bCouldn't bring yourself to do it, huh? I tell you, partin' from your pards ain't so easy as you\nmight think.\n@c2@"
  es: "@aJuanchito@bNo se %H860%Xve capaz%Yven capaces%Z de hacerlo, ¿verdad? %H860%XLe%YLes%Z dije que despedirse de los compadres no es tan sencillo como parece.\n@c2@"
  fr: "@aHank Hoffman Jr@bVous n'avez pas pu vous y résoudre, heinⓡ Croyez-moi, se séparer de ses part'naires n'est pas aussi facile qu'on pourrait croire.\n@c2@"
  it: "@aJohn Dwayne Jr.@bNon ce la %H860%Xfai%Yfate%Z, vero? Lo sapevo. Separarsi da un amico fedele è molto più difficile di quanto non si possa pensare.\n@c2@"
  ja: "@a@bホフマン「やっぱり　やめときます？\n\tせっかく　来てくれた人と\n\t別れるなんて　つらいですもんね。\n@c2@"
"67":
  de: "@aHank Hoffman Jr.@bWie? Ihr gebt auf, was?\n@c2@"
  en: "@aHank Hoffman Jr.@bWhat's that? Quitter, huh?\n@c2@"
  es: "@aJuanchito@b¿Qué? %H860%XAbandona%YAbandonan%Z, ¿eh?\n@c2@"
  fr: "@aHank Hoffman Jr@bHeinⓡ Alors on se dégonfle, c'est çaⓡ\n@c2@"
  it: "@aJohn Dwayne Jr.@bChe %H860%Xfai%Yfate%Z? %H860%XLasci%YLasciate%Z perdere, eh?\n@c2@"
  ja: "@a@bホフマン「あれ？\n\tやめるのですね。\n@c2@"
"68":
  de: "@aHank Hoffman Jr.@bKann ich sonst noch was für Euch tun, wo Ihr schon mal hier seid?\n@c2@"
  en: "@aHank Hoffman Jr.@bAnythin' else I can do while you're here?\n@c2@"
  es: "@aJuanchito@b¿Puedo hacer algo más por %H860%Xusted%Yustedes%Z antes de que se %H860%Xmarche%Ymarchen%Z?\n@c2@"
  fr: "@aHank Hoffman Jr@bJ'peux faire autre chose pour vous, tant qu'vous êtes làⓡ\n@c2@"
  it: "@aJohn Dwayne Jr.@bC'è altro che posso fare per %H860%Xte%Yvoi%Z?\n@c2@"
  ja: "@a@bホフマン「ほかに　何か　ご用でしょうか？\n@c2@"
"69":
  de: "@aHank Hoffman Jr.@bHabt Eure Meinung geändert, was?\n@c2@"
  en: "@aHank Hoffman Jr.@bChanged your mind, huh?\n@c2@"
  es: "@aJuanchito@b%H860%XCambió%YCambiaron%Z de opinión ¿eh?\n@c2@"
  fr: "@aHank Hoffman Jr@bVous avez changé d'avis, heinⓡ\n@c2@"
  it: "@aJohn Dwayne Jr.@b%H860%XHai%YAvete%Z cambiato idea?\n@c2@"
  ja: "@a@bホフマン「おや　そうですか。\n@c2@"
"70":
  de: "@aHank Hoffman Jr.@bIch vertraue Euch die Zukunft von %a00260 an. Enttäuscht mich jetzt nicht!\n@c2@"
  en: "@aHank Hoffman Jr.@bI'm trustin' the future o' %a00260 to y'all. Don't go lettin' me down, now!\n@c2@"
  es: "@aJuanchito@bLes confío a todos el futuro de %a00260. ¡No me decepcionen!\n@c2@"
  fr: "@aHank Hoffman Jr@bC'est à vous que j'confie %a00260 et son avenir. Ne m'laissez pas tomber maintenantⓠ\n@c2@"
  it: "@aJohn Dwayne Jr.@bIl futuro di %a00260 è nelle %H860%Xtue%Yvostre%Z mani. Mi raccomando... Non %H860%Xdeludermi%Ydeludetemi%Z!\n@c2@"
  ja: "@a@bホフマン「みなさん。　これからも\n\t%a00260をお願いします。\n\t信じてますからね！\n@c2@"
"71":
  de: "@a@b*: Die Schönheit dieses Gartens schenkt mir inneren Frieden. Ich bete darum, dass ich Euch auf irgendeine Weise von Nutzen sein kann.\n@c1@"
  en: "@a@b*: The beauty of this garden sets my mind at peace.\nI pray that I can be of use to you in some way.\n@c1@"
  es: "@a@b*: La belleza de este jardín brinda paz a mi espíritu.\nRezo para poder ayudar%H860%Xle%Yles%Z de alguna forma.\n@c1@"
  fr: "@a@b*ⓢ La beauté de ce jardin apaise mon âme.\nJe prie pour pouvoir vous être utile d'une manière ou d'une autre.\n@c1@"
  it: "@a@b*: La bellezza di questo giardino rasserena il mio spirito. Spero di poter essere utile a tutti, in qualche modo.\n@c1@"
  ja: "@a@b＊「この庭は　美しくて　心が安らぎますわ。\n\t私のチカラで　お役に立てれば\n\tよいのですが……\n@c1@"
"72":
  de: "@aHank Hoffman Jr.@bNa, wen haben wir denn da! Wenn das mal nicht %a00120 ist! Ich wär' dann jetzt so weit!\n@c2@"
  en: "@aHank Hoffman Jr.@bWell, if it ain't little ol' %a00120. I jes' done got finished gittin' everythin' ready.\n@c2@"
  es: "@aJuanchito@bMuy bien, %a00120. Ahoritita mismo terminé.\n@c2@"
  fr: "@aHank Hoffman Jr@bTiens, mais c'est %a00120 que v'làⓠ J'viens juste de finir de tout préparer.\n@c2@"
  it: "@aJohn Dwayne Jr.@bMa guarda un po' se non è %a00120! Stavo giusto ultimando i preparativi...\n@c2@"
  ja: "@a@bホフマン「あっ　%a00120さん\n\tちょうど今　私のじゅんびが\n\t終わったところです。\n@c2@"
"73":
  de: "@aHank Hoffman Jr.@bAlso gut, als Erstes brauchen wir 'nen Namen, auf den die Leute fliegen wie Schmeißfliegen auf Kuhmist.\n@c2@"
  en: "@aHank Hoffman Jr.@bWell, alright then. First thing we gotta do's give this place the kinda name'll git folks flockin' here like flies on fertilizer.\n@c2@"
  es: "@aJuanchito@bVeamos. Lo primero de todo, nomás, es darle a este lugar un nombre que atraiga a la gente como moscas a la miel.\n@c2@"
  fr: "@aHank Hoffman Jr@bBon, très bien. La première chose à faire, c'est de donner à cet endroit un nom qui y attirera les gens comme des mouches sur du fumier.\n@c2@"
  it: "@aJohn Dwayne Jr.@bD'accordo. Come prima cosa, dobbiamo pensare a un nome per la nuova città. Ne serve uno che attiri gente come mosche sulla... marmellata.\n@c2@"
  ja: "@a@bホフマン「さてと……　まずは\n\tあの集落が　早く発展するよう\n\tよい名前をつけていただきましょうか。\n@c2@"
"74":
  de: "@aHank Hoffman Jr.@bIch hatte ja schon selbst 'n paar Ideen, aber ich kann mich einfach nicht entscheiden.\n@c2@"
  en: "@aHank Hoffman Jr.@bI done had a few ideas myself, but I jes' cain't settle on one for certain.\n@c2@"
  es: "@aJuanchito@bTengo algunas ideas, pero soy incapaz de decidirme por ninguna.\n@c2@"
  fr: "@aHank Hoffman Jr@bJ'ai bien quelques idées d'mon côté, mais j'arrive pas à m'décider.\n@c2@"
  it: "@aJohn Dwayne Jr.@bLa mia zucca ha partorito qualche idea, ma non mi sono ancora deciso.\n@c2@"
  ja: "@a@bホフマン「私が　いくつか　\n\t候補を考えたんですけど　\n\tどうにも　決めかねていましてね。\n@c2@"
"75":
  de: "@aHank Hoffman Jr.@bUnd Ihr habt mir so geholfen ⓚⓛ da überlass' ich die Entscheidung einfach Euch!\n@c2@"
  en: "@aHank Hoffman Jr.@bTell you what, y'all have been helpin' me git the place together an' all. How's about I let you decide?\n@c2@"
  es: "@aJuanchito@b¿Sabe una cosa? Pues como conté con su ayudita a la hora de montar todo esto, ¿qué le parecería decidir usted?\n@c2@"
  fr: "@aHank Hoffman Jr@bVous savez quoiⓡ Vu que vous m'avez aidé à mettre ce patelin sur pied et tout, j'vais vous laisser lui choisir un nom.\n@c2@"
  it: "@aJohn Dwayne Jr.@bSai che %H860%Xti%Yvi%Z dico? Visto che mi %H860%Xhai%Yavete%Z aiutato a mettere in piedi questo posto, lascerò che %H860%Xsia tu%Ysiate voi%Z a scegliere.\n@c2@"
  ja: "@a@bホフマン「かくなる上は　移民集めに\n\t協力してくれている　みなさんに\n\t決めてもらおうと　思うんですよ。\n@c2@"
"76":
  de: "@aHank Hoffman Jr.@bIch mache Euch ein paar Vorschläge, dann könnt Ihr mir sagen, welche Ihr am besten findet. Los geht's:\n@c2@"
  en: "@aHank Hoffman Jr.@bI'll rattle off a couple o' my ideas, an' y'all can tell me which one ya like best. Here goes:\n@c2@"
  es: "@aJuanchito@bLe daré un par de ideas nomás y usted pues me dice cuál le agrada. Allá van...\n@c2@"
  fr: "@aHank Hoffman Jr@bJ'vais vous donner quelques-unes de mes idées et vous m'direz celle que vous préférez.\nC'est parti...\n@c2@"
  it: "@aJohn Dwayne Jr.@b%H860%XAscolta%YAscoltate%Z qualcuno dei nomi che ho pensato, e %H860%Xdimmi quale ti piace di più. Senti qua%Yditemi quale vi piace di più. Sentite qua%Z...\n@c2@"
  ja: "@a@bホフマン「それじゃ　まずは\n\t私の考えた候補を　言いますね。\n\tよく考えて　決めてくださいよ。\n@c2@"
"77":
  de: "@aHank Hoffman Jr.@bAls Erstes ist mir ⓞ%a00090dorfⓟ eingefallen. Ist doch 'n mächtig feiner Name, was?\n@c2@"
  en: "@aHank Hoffman Jr.@bOkay, well first off, I thought about ⓗ%a00090townⓘ. It's a mighty purdy name,\nain't it?\n@c2@"
  es: "@aJuanchito@bMi primera idea fue ⓕ%0%a00090landiaⓖ. Un nombre mítico y bien chulo, ¿no es cierto?\n@c2@"
  fr: "@aHank Hoffman Jr@bBon, d'abord, j'ai pensé à ⓥ%a00090villeⓦ.\nC'est chouette comme nom, heinⓡ\n@c2@"
  it: "@aJohn Dwayne Jr.@bIl primo a cui ho pensato è ⓕ%a00090 Cityⓖ. Niente male, eh?\n@c2@"
  ja: "@a@bホフマン「まずは　%a00090タウン。\n\tどうです　気に入りましたか？\n@c2@"
"78":
  de: "@aHank Hoffman Jr.@bWusste ich's doch! Also abgemacht! %a00090dorf soll's sein! Yippieh!\n@c2@"
  en: "@aHank Hoffman Jr.@bWell, I jes' knew it! Ain't that swell!\n%a00090town it is, then! Yeehaw!\n@c2@"
  es: "@aJuanchito@bBien, ¡lo sabía! ¡Fantástico!\n¡%a00090landia se llamará! ¡Yujuuu!\n@c2@"
  fr: "@aHank Hoffman Jr@bAh, je l'savaisⓠ C'est superⓠ Alors elle s'appellera %a00090villeⓠ Yeehaaⓠ\n@c2@"
  it: "@aJohn Dwayne Jr.@bSapevo che %H860%Xti%Yvi%Z sarebbe piaciuto! Corpo di mille bisonti, è un nome fantastico! Allora è deciso! La città si chiamerà %a00090 City! Yippiii!\n@c2@"
  ja: "@a@bホフマン「やあ　思ってた通りだ。\n\tやっぱり　%a00090タウンですか。\n\tそれ　一番の自信作だったんです。\n@c2@"
"79":
  de: "@aHank Hoffman Jr.@bTja, ich schätze, der beste Name war's wohl nicht. Also weiter im Text.\n@c2@"
  en: "@aHank Hoffman Jr.@bWell, I guess it ain't the excitinest I ever did hear.\nOkay, try this next one for size:\n@c2@"
  es: "@aJuanchito@bBueno, supongo que no es de lo mejor.\nOk, probemos con este otro:\n@c2@"
  fr: "@aHank Hoffman Jr@bOuais, c'est sûr que c'est pas le nom l'plus original qu'on ait entendu.\nBon, essayons le suivant...\n@c2@"
  it: "@aJohn Dwayne Jr.@bUhm, forse %H860%Xhai%Yavete%Z ragione... Non è certo il miglior nome che si sia mai sentito al mondo. D'accordo, allora %H860%Xsenti%Ysentite%Z quest'altro...\n@c2@"
  ja: "@a@bホフマン「あっ　やっぱり！\n\t私も　いまいちだと思ってたんです。\n\tじゃあ　次のはどうです？\n@c2@"
"80":
  de: "@aHank Hoffman Jr.@bWie wär's mit ⓞ%a00090stadtⓟ? Nach Euch natürlich, %a00090! Was haltet Ihr davon?\n@c2@"
  en: "@aHank Hoffman Jr.@bHow's about ⓗ%a00090svilleⓘ?\nIt's named fer yourself there, %a00090.\nHow about it?\n@c2@"
  es: "@aJuanchito@b¿Qué tal ⓕ%0%a00090villaⓖ?\nBautizada en su honor, %a00090.\n¿Qué le parece?\n@c2@"
  fr: "@aHank Hoffman Jr@bQu'est-ce que vous pensez de ⓥ%a00090cityⓦⓡ\n@c2@"
  it: "@aJohn Dwayne Jr.@bChe mi %H860%Xdici%Ydite%Z di ⓕ%a00090poliⓖ? È in %H860%Xtuo onore, vecchia pellaccia%Yvostro onore, vecchie pellacce%Z! Allora? Che %H860%Xte%Yve%Z ne pare?\n@c2@"
  ja: "@a@bホフマン「%a00090ランド。\n\tなかなか　いいでしょ。\n\t気に入ってもらえましたか？\n@c2@"
"81":
  de: "@aHank Hoffman Jr.@bWusste ich's doch! Dann ist es abgemacht! %a00090stadt soll's sein! Yippieh!\n@c2@"
  en: "@aHank Hoffman Jr.@bWell, I jes' knew it! Ain't that swell!\n%0%a00090sville it is, then!\nYeehaw!\n@c2@"
  es: "@aJuanchito@bBien, ¡lo sabía! ¡Fantástico!\n¡%0%a00090villa se llamará entonces!\n¡Yujuuu!\n@c2@"
  fr: "@aHank Hoffman Jr@bAh, je l'savaisⓠ C'est superⓠ Alors elle s'appellera %a00090cityⓠ Yeehaaⓠ\n@c2@"
  it: "@aJohn Dwayne Jr.@bSapevo che lo %H860%Xavresti%Yavreste%Z gradito! Corpo di mille vacche, è un nome fantastico! Perfetto! La città si chiamerà %a00090poli! Yippiii!\n@c2@"
  ja: "@a@bホフマン「やあ　思ってた通りだ。\n\tやっぱり　%a00090ランドですか。\n\tそれ　一番の自信作だったんです。\n@c2@"
"82":
  de: "@aHank Hoffman Jr.@bTja, dachte mir schon, dass Euch das nicht so gefallen würde, drum hab ich mir das Beste für den Schluss aufgehoben:\n@c2@"
  en: "@aHank Hoffman Jr.@bWell, I thought as much. I knew you wouldn't be\nnone to keen on that one, so I saved the best 'til\nthe very last:\n@c2@"
  es: "@aJuanchito@bEso me parecía. Sabía que ese no sería de su agrado, así que dejé el mejor para el final:\n@c2@"
  fr: "@aHank Hoffman Jr@bOuais, j'suis assez d'accord. Je m'doutais que vous aimeriez pas trop celui-là, alors j'ai gardé le meilleur pour la fin...\n@c2@"
  it: "@aJohn Dwayne Jr.@bProprio come temevo. Avevo il sospetto che nemmeno questo %H860%Xti%Yvi%Z sarebbe piaciuto, e per questo motivo ho lasciato il nome migliore per ultimo.\n@c2@"
  ja: "@a@bホフマン「やはり　そうきましたか。\n\tそうおっしゃると思って　本命は\n\t最後に　とっておいたんですよ。\n@c2@"
"83":
  de: "@aHank Hoffman Jr.@bTadaaa... Wie findet Ihr ⓞSt. %a00090sburgⓟ? Nicht schlecht, was? Auf den bin ich mächtig stolz!\n@c2@"
  en: "@aHank Hoffman Jr.@bHere goes...\nHow's about...ⓗSt. %a00090sburgⓘ?\nNot bad, huh? I'm mighty proud o' that one!\n@c2@"
  es: "@aJuanchito@bAhí va eso...\n¿Qué tal... ⓕSan %0%a00090burgoⓖ?\nNo está mal, ¿eh? Estoy bien orgulloso de este.\n@c2@"
  fr: "@aHank Hoffman Jr@bAllons-y...\nQue diriez-vous de... ⓥSt %a00090bourgⓦⓡ Pas mal, heinⓡ J'suis assez fier de celui-làⓠ\n@c2@"
  it: "@aJohn Dwayne Jr.@bCome %H860%Xti suona%Yvi suona%Z ⓕ%a00090burgoⓖ? È una meraviglia, no? Nomi del genere non si sentono mica tutti i giorni!\n@c2@"
  ja: "@a@bホフマン「では　いきますよ。\n\t%a00090横丁！\n\tフフフ。　どうだ　まいったか！\n@c2@"
"84":
  de: "@aHank Hoffman Jr.@bIhr macht Witze! St. %a00090sburg gefällt Euch? Hätte nie gedacht, dass Ihr damit einverstanden wärt! Tja, dann vielen Dank!\n@c2@"
  en: "@aHank Hoffman Jr.@bYou're kiddin'! You actually like St. %a00090sburg? I never thought you'd go for that one! Well, I'm much obliged.\n@c2@"
  es: "@aJuanchito@bNomás me está vacilando, ¿no? ¿Realmente le gusta San %0%a00090burgo? Nunca creí que elegiría ese. Bueno, le estoy reteagradecido.\n@c2@"
  fr: "@aHank Hoffman Jr@bSans rireⓠ Vous aimez vraiment St %a00090bourgⓡ J'aurais jamais cru qu'vous choisiriez celui-làⓠ J'suis très flatté.\n@c2@"
  it: "@aJohn Dwayne Jr.@bEh?! Davvero %H860%Xti%Yvi%Z piace %a00090burgo?! Beh, meglio così...\n@c2@"
  ja: "@a@bホフマン「えっ　%a00090横丁ですか？\n\tいや　本当は　自信がなかったのですが\n\t気に入ってもらえて　よかったです。\n@c2@"
"85":
  de: "@aHank Hoffman Jr.@bVerflixt. Bei Städtenamen hab ich wohl kein glückliches Händchen.\n@c2@"
  en: "@aHank Hoffman Jr.@bAww, shucks. Seems I ain't cut out fer the town namin' game. \n@c2@"
  es: "@aJuanchito@b¡Caramba! Parece que no se me da bien el tema de los nombres. \n@c2@"
  fr: "@aHank Hoffman Jr@bPfff, flûte. On dirait que j'suis pas doué pour donner des noms aux villes.\n@c2@"
  it: "@aJohn Dwayne Jr.@bPer mille serpenti! Forse non sono tagliato per dar nomi alle città!\n@c2@"
  ja: "@a@bホフマン「うう。　やっぱり　私なんかには\n\tかっこいい町の名前を　考えるなんて\n\tムリだったんですね……。\n@c2@"
"86":
  de: "@aHank Hoffman Jr.@bDann müsst Ihr mir wohl einen Namen suchen helfen.\n@c2@"
  en: "@aHank Hoffman Jr.@bI guess there ain't nothin' left to do but let you varmints decide.\n@c2@"
  es: "@aJuanchito@bSupongo que nomás tengo que dejarle decidir a usted.\n@c2@"
  fr: "@aHank Hoffman Jr@bBon, ben il me reste plus qu'à vous laisser choisir, alors.\n@c2@"
  it: "@aJohn Dwayne Jr.@bLascerò che %H860%Xsia tu%Ysiate voi%Z a decidere. Ne %H860%Xhai%Yavete%Z viste talmente tante, che %H860%Xti%Yvi%Z ci vorrà un attimo a scegliere un nome adatto!\n@c2@"
  ja: "@a@bホフマン「まあ　しかたありません。\n\tこの上は　%a00140さんたちに\n\t頼るのみです。\n@c2@"
"87":
  de: "@aHank Hoffman Jr.@bSucht einen aus, der ordentlich was hermacht. Jau, 'nen echten Knüller!\n@c2@"
  en: "@aHank Hoffman Jr.@bCome on now an' gimme a name that'll have 'em cheerin' fit to beat the band. I mean a real humdinger!\n@c2@"
  es: "@aJuanchito@bVamos, apúrese, encuentre un nombre con el que hacer famosa a esta ciudad. ¡Y me refiero a algo realmente impactante!\n@c2@"
  fr: "@aHank Hoffman Jr@bAllez, trouvez-moi un nom qui déchaîne l'enthousiasme. J'veux dire, un truc qui casse vraiment la baraqueⓠ\n@c2@"
  it: "@aJohn Dwayne Jr.@bAvanti, %H860%Xspara%Ysparate%Z un nome! Ma me ne serve uno che funzioni, uno che faccia accorrere gente a frotte! Questo posto deve crescere in fretta!\n@c2@"
  ja: "@a@bホフマン「どうか　私なんかには　\n\t考えつかないような　かっこいい\n\t町の名前を　決めてくださいよ。\n@c2@"
"88":
  de: "@a@bDieser Name geht leider nicht.\n@c0@"
  en: "@a@bSorry, but you can't have that name.\n@c0@"
  es: "@a@bNo puedes utilizar ese nombre.\n@c0@"
  fr: "@a@bDésolé, mais vous ne pouvez pas choisir ce nom.\n@c0@"
  it: "@a@bMi spiace, ma questo nome non può essere usato.\n@c0@"
  ja: "@a@b申し訳ありませんが　その名前は\n入力できません。\n@c0@"
"89":
  de: "@aHank Hoffman Jr.@bWas?! Nach all dem Hin und Her entscheidet Ihr Euch doch noch für einen von meinen Namen?\n@c2@"
  en: "@aHank Hoffman Jr.@bWhat the!? After all yer dilly-dallyin', y'up an' went fer one o' my names anyways?\n@c2@"
  es: "@aJuanchito@b¡¿Qué diablos...?! ¿Después de darle tantas vueltas, nomás acaba por elegir uno de mis nombres?\n@c2@"
  fr: "@aHank Hoffman Jr@bQuoiⓡⓐ Après avoir chipoté pendant tout c'temps, vous avez fini par choisir un d'mes nomsⓡ\n@c2@"
  it: "@aJohn Dwayne Jr.@bPer tutti i diavoli! %H860%XHai%YAvete%Z deciso che, tutto sommato, i nomi che avevo pensato non erano poi tanto male?!\n@c2@"
  ja: "@a@bホフマン「おや？　結局　私が考えた\n\t%a00260で　いいんですか？\n@c2@"
"90":
  de: "@aHank Hoffman Jr.@bNa ja, die waren aber auch kaum zu schlagen. Ich kann's Euch nicht verdenken.\n@c2@"
  en: "@aHank Hoffman Jr.@bWell gee, I guess they was some pretty unbeatable names an' all. I can't rightly blame y'all for pickin' one!\n@c2@"
  es: "@aJuanchito@bBien, supongo que es que eran inmejorables. No puedo culparle por elegir uno.\n@c2@"
  fr: "@aHank Hoffman Jr@bEnfin, j'dois reconnaître que c'était difficile de faire mieux qu'ces noms-là. J'peux pas vous en vouloir d'en avoir choisi unⓠ\n@c2@"
  it: "@aJohn Dwayne Jr.@bSai che %H860%Xti dico? Ci hai visto giusto%Yvi dico? Ci avete visto giusto%Z! Quelli che mi erano venuti in mente erano nomi di prim'ordine!\n@c2@"
  ja: "@a@bホフマン「まあ　私としても　\n\t自分の考えた名前になるなら\n\tうれしい限りですけど。\n@c2@"
"91":
  de: "@aHank Hoffman Jr.@b%0%a00260 also? Gefällt mir! Auf so was Schickes wär ich nie gekommen!\n@c2@"
  en: "@aHank Hoffman Jr.@b%0%a00260, is it?\nWhy, that's a purdy name! I could never have thought o' somethin' so grand!\n@c2@"
  es: "@aJuanchito@b%0%a00260, ¿no?\nEs un nombre bien chulo. No se me ocurre nada más grandioso.\n@c2@"
  fr: "@aHank Hoffman Jr@b%0%a00260, c'est çaⓡ\nC'est un super nomⓠ J'y aurais jamais penséⓠ\n@c2@"
  it: "@aJohn Dwayne Jr.@b%0%a00260, %H860%Xdici%Ydite%Z? Questo sì che è un nome bello tosto! A me non sarebbe mai venuto in mente qualcosa di tanto grandioso!\n@c2@"
  ja: "@a@bホフマン「%a00260ですか。\n\tうん　いい名前です。\n\t私じゃ　とても　考えつかない！\n@c2@"
"92":
  de: "@aHank Hoffman Jr.@bSchön, dann bleibt's also bei %a00260 für unser Städtchen, ja?\n@c2@"
  en: "@aHank Hoffman Jr.@bAlright then, we'll name our little ol' township %a00260, agreed?\n@c2@"
  es: "@aJuanchito@bOk, llamaremos a nuestra ciudad %a00260, ¿de acuerdo?\n@c2@"
  fr: "@aHank Hoffman Jr@bEntendu, on va donc appeler notre p'tite ville %a00260, c'est d'accordⓡ\n@c2@"
  it: "@aJohn Dwayne Jr.@bAllora è andata: questo posto si chiamerà %a00260! Siamo d'accordo?\n@c2@"
  ja: "@a@bホフマン「では　あの集落の名前は\n\t%a00260ということで\n\t決まりですね？\n@c2@"
"93":
  de: "@aHank Hoffman Jr.@bPrima! Unsere Stadt hat jetzt einen Namen!\n@c2@"
  en: "@aHank Hoffman Jr.@bAlright! We got ourselves a town name!\n@c2@"
  es: "@aJuanchito@b¡Muy bien! ¡Ya tenemos un nombre para la ciudad!\n@c2@"
  fr: "@aHank Hoffman Jr@bParfaitⓠ On a l'nom d'la villeⓠ\n@c2@"
  it: "@aJohn Dwayne Jr.@bFantastico! Adesso la mia città ha un nome!\n@c2@"
  ja: "@a@bホフマン「よし　これで\n　町の名前が決まった……と。\n@c2@"
"94":
  de: "@aHank Hoffman Jr.@bAnscheinend gibt's in der großen weiten Welt jede Menge Leute, die das gleiche Ziel haben wie Ihr.\n@c2@"
  en: "@aHank Hoffman Jr.@bSeems that out there in the big ol' world, there's plenty o' folks on the same quest as y'all are.\n@c2@"
  es: "@aJuanchito@bParece que en el viejo mundo hay muchos que andan en pos de lo mismo que %H860%Xusted%Yustedes%Z, nomás.\n@c2@"
  fr: "@aHank Hoffman Jr@bIl paraît que partout dans l'vaste monde, il y a des tas d'gens qui se sont lancés dans le même genre de quête que vous.\n@c2@"
  it: "@aJohn Dwayne Jr.@bMi sono reso conto che in giro per il mondo ci sono molte altre persone impegnate nella %H860%Xtua%Yvostra%Z stessa avventura.\n@c2@"
  ja: "@a@bホフマン「どうやら　この広い世界には\n\t%a00090さんたちのように　使命をもって\n\t旅をしている人たちが　いるようです。\n@c2@"
"95":
  de: "@aHank Hoffman Jr.@bBei Zufallsbegegnungen geht's darum, solche Leute zu finden, ein Schwätzchen zu halten, was von ihnen zu lernen und sie zu Partnern zu machen.\n@c2@"
  en: "@aHank Hoffman Jr.@bChance encounters is all about grabbin' a hold o' them folks, shootin' the breeze, learnin' a thing or two, and makin' new pardners while you're at it.\n@c2@"
  es: "@aJuanchito@bLos encuentros al azar pues consisten en encontrar a unas cuantas personas, platicar, aprender un par de cosas y, de paso, hacer compadres.\n@c2@"
  fr: "@aHank Hoffman Jr@bLes rencontres aléatoires, ça revient à mettre la main sur ces gens-là, à discuter avec eux, à apprendre un ou deux trucs...\n㈡\n... et à s'faire de nouveaux part'naires au passage.\n@c2@"
  it: "@aJohn Dwayne Jr.@bGli incontri a sorpresa consistono nell'imbattersi in qualcuno di questi tipi, scambiarci quattro chiacchiere, imparare qualcosa e fare nuove amicizie.\n@c2@"
  ja: "@a@bホフマン「そんな人たちと　交流して\n\t友だちの輪を　広げるのが\n\tすれちがい通信　なのですよ。\n@c2@"
"96":
  de: "@aHank Hoffman Jr.@bUnd wenn wir 'n paar Leute fortschicken oder welche hierher mitbringen können, kann das unserem Städtchen nur helfen.\n@c2@"
  en: "@aHank Hoffman Jr.@bAn' if we can send a few folks over an' bring a few folks back from other places, our own town here'll see the benefit, an' no mistake.\n@c2@"
  es: "@aJuanchito@bY si nomás pudiéramos enviar unos cuantos ciudadanos que trajeran gentes de otros lugares, pues sin duda que nuestra ciudad se beneficiaría.\n@c2@"
  fr: "@aHank Hoffman Jr@bEt si on arrive à envoyer une ou deux personnes dans d'autres villes et à en faire venir autant dans la nôtre, ben ce sera bénéfique, y'a pas de doute.\n@c2@"
  it: "@aJohn Dwayne Jr.@bSe potessimo mandare in giro un po' di gente per far arrivare qui persone da altri posti, la nostra città crescerebbe più rapidamente!\n@c2@"
  ja: "@a@bホフマン「もし　すれちがい通信で\n\t別世界の人たちと　交流できたら\n\t町もどんどん発展するでしょう！\n@c2@"
"97":
  de: "@aHank Hoffman Jr.@bAlso, was sagt Ihr? Wollt Ihr Euch 'nen abenteuerlustigen Pionier suchen, der 'n bisschen Reklame für uns macht?\n@c2@"
  en: "@aHank Hoffman Jr.@bSo, whaddaya say? You reckon you might wanna pick a pioneerin' soul to send off ambassadeerin'?\n@c2@"
  es: "@aJuanchito@b¿Qué %H860%Xme dice%Yme dicen%Z? ¿%H860%XCree que podría%YCreen que podrían%Z encontrar un alma inquieta que nos hiciera de embajador?\n@c2@"
  fr: "@aHank Hoffman Jr@bAlors, qu'est-ce que vous en ditesⓡ\nÇa vous dirait d'choisir un pionnier pour l'envoyer ailleurs comme ambassadeurⓡ\n@c2@"
  it: "@aJohn Dwayne Jr.@bAllora, che ne %H860%Xpensi? Vuoi%Ypensate? Volete%Z scegliere un pioniere da mandare per il mondo come ambasciatore della nostra nuova città?\n@c2@"
  ja: "@a@bホフマン「どうです？\n\t別世界のだれかに　あなたの\n\tすれちがい大使を　送ってみませんか？\n@c2@"
"98":
  de: "@aHank Hoffman Jr.@bNa schön! Ich erklär' Euch, worum es bei dieser ganzen Pioniergeschichte geht.\n@c2@"
  en: "@aHank Hoffman Jr.@bWell alright then! I'll git on an' explain what this pioneerin' game's all about.\n@c2@"
  es: "@aJuanchito@bPues muy bien. Ahorita %H860%Xle explico%Yles explico%Z qué es esto de los pioneros.\n@c2@"
  fr: "@aHank Hoffman Jr@bParfaitⓠ Dans ce cas, j'vais continuer à vous expliquer en quoi consiste ce jeu avec les pionniers.\n@c2@"
  it: "@aJohn Dwayne Jr.@bSplendido! %H860%XLascia che ti spieghi%YLasciate che vi spieghi%Z come funziona la cosa...\n@c2@"
  ja: "@a@bホフマン「うん　そうこなくっちゃ！\n\tでは　さっそく　大使について\n\tご説明しましょう。\n@c2@"
"99":
  de: "@aHank Hoffman Jr.@bWollt Ihr nicht? Tja, ich kann Euch ja nicht dazu verdonnern, oder?\n@c2@"
  en: "@aHank Hoffman Jr.@bYou wouldn't, huh? Well, I guess I cain't very well make you do it now, can I?\n@c2@"
  es: "@aJuanchito@bNo %H860%Xpodría%Ypodrían%Z, ¿eh? Bueno, pues supongo que no puedo %H860%Xpedirle que lo haga%Ypedirles que lo hagan%Z ahorita mismo, ¿no es cierto?\n@c2@"
  fr: "@aHank Hoffman Jr@bÇa vous tente pasⓡ Bon, ben j'peux quand même pas vous forcer à l'faire maintenant, heinⓡ\n@c2@"
  it: "@aJohn Dwayne Jr.@bNon %H860%Xti%Yvi%Z va? Beh, non posso certo %H860%Xcostringerti%Ycostringervi%Z a fare quello che non %H860%Xvuoi%Yvolete%Z!\n@c2@"
  ja: "@a@bホフマン「そうですか……\n\t気が向かなければ　しかたありませんね。\n@c2@"
"100":
  de: "@aHank Hoffman Jr.@bAber wenn Ihr Eure Meinung ändert, sagt mir Bescheid.\n@c2@"
  en: "@aHank Hoffman Jr.@bIf y'ever git around to changin' yer mind, jes' you come an holler.\n@c2@"
  es: "@aJuanchito@bSi alguna vez %H860%Xcambia%Ycambian%Z de opinión, %H860%Xavíseme%Yavísenme%Z nomás.\n@c2@"
  fr: "@aHank Hoffman Jr@bSi jamais vous changez d'avis, revenez me voir.\n@c2@"
  it: "@aJohn Dwayne Jr.@bSe per caso %H860%Xcambiassi idea, fammelo%Ycambiaste idea, fatemelo%Z sapere!\n@c2@"
  ja: "@a@bホフマン「では　もし\n\tすれちがい大使を　任命したくなったら\n\t私に　声をかけてくださいね。\n@c2@"
"101":
  de: "@aHank Hoffman Jr.@bNa schön, dann fangen wir am besten noch mal ganz von vorn an.\n@c2@"
  en: "@aHank Hoffman Jr.@bWell, alright then, I guess we better go back and start over.\n@c2@"
  es: "@aJuanchito@bPues bien, supongo que es mejor empezar de nuevo.\n@c2@"
  fr: "@aHank Hoffman Jr@bBon, vaut mieux que j'reprenne tout depuis l'début.\n@c2@"
  it: "@aJohn Dwayne Jr.@bD'accordo. Cominciamo dall'inizio.\n@c2@"
  ja: "@a@bホフマン「そうですか。\n\tでは　もういちど　はじめから。\n@c2@"
"102":
  de: "@aHank Hoffman Jr.@bEin Pionier ist einer, den Ihr sorgfältig aussucht, damit er in die Welt zieht und alles lernt, was es in fremden Ländern so zu lernen gibt.\n@c2@"
  en: "@aHank Hoffman Jr.@bA pioneer's a body hand-picked by yourself to head on out into the world to learn all there is to learn from folks in foreign lands.\n@c2@"
  es: "@aJuanchito@bUn pionero es alguien pues que se elige para que vaya por el mundo aprendiendo todo lo necesario de las gentes de tierras lejanas.\n@c2@"
  fr: "@aHank Hoffman Jr@bUn pionnier, c'est quelqu'un que vous envoyez à travers le monde pour apprendre tout c'qu'il y a à savoir des habitants des autres pays.\n@c2@"
  it: "@aJohn Dwayne Jr.@bUn pioniere è un individuo che gira il mondo per imparare dagli abitanti di terre lontane un mucchio di cose nuove e interessanti.\n@c2@"
  ja: "@a@bホフマン「すれちがい大使　というのは\n\t%a00090さんの指令で　別世界の人と\n\t交流する専門家です。\n@c2@"
"103":
  de: "@aHank Hoffman Jr.@bWenn Ihr einen Pionier losschickt, bekommt Ihr im Gegenzug ebenfalls einen Pionier von dort, wo Ihr Euren hingeschickt habt.\n@c2@"
  en: "@aHank Hoffman Jr.@bWhen you send a pioneer on out there, you get a pioneer back from wherever you sent the varmint to.\n@c2@"
  es: "@aJuanchito@bCuando se envía a un pionero al mundo, pues viene otro del lugar al que se envía a este emisario.\n@c2@"
  fr: "@aHank Hoffman Jr@bQuand vous envoyez un pionnier à l'extérieur, vous recevez en échange un pionnier de l'endroit où vous avez envoyé l'vôtre.\n@c2@"
  it: "@aJohn Dwayne Jr.@bQuando %H860%Xmandi%Ymandate%Z un pioniere da qualche parte, in cambio ne %H860%Xottieni uno dal luogo dove hai spedito il tuo%Yottenete uno dal luogo dove avete spedito il vostro%Z inviato.\n@c2@"
  ja: "@a@bホフマン「%a00090さんの　大使が\n\t別世界の誰かの　大使と\n\tすれちがうと……\n@c2@"
"104":
  de: "@aHank Hoffman Jr.@bDieser Pionier siedelt sich dann hier in %a00260 an und baut sich hier ein neues Leben auf.\n@c2@"
  en: "@aHank Hoffman Jr.@bThat pioneer, well they'll jes' settle on down and start makin' a new life for themselves here in %a00260.\n@c2@"
  es: "@aJuanchito@bEse pionero extranjero se asentará nomás y pues empezará una nueva vida acá en %a00260.\n@c2@"
  fr: "@aHank Hoffman Jr@bCe pionnier, eh bien, il s'installe, tout simplement, et commence une nouvelle vie ici, à %a00260.\n@c2@"
  it: "@aJohn Dwayne Jr.@bIl nuovo arrivato si trasferirà qui a %a00260.\n@c2@"
  ja: "@a@bホフマン「その人の大使が　%a00090さんの\n\t%a00260へ　やって来て\n\t住みはじめますよ。\n@c2@"
"105":
  de: "@aHank Hoffman Jr.@bJe mehr Leuten Ihr da draußen über den Weg lauft, desto mehr könnt Ihr hierher schicken, damit sie sich in unserer Stadt niederlassen.\n@c2@"
  en: "@aHank Hoffman Jr.@bSo, the more folks you git on out there an' have chance encounters with, the more folks you'll end up bringin' in to populate this here fair city.\n@c2@"
  es: "@aJuanchito@bDe modo que, cuanta más gente %H860%Xse encuetre%Yse encuentren%Z y más encuentros al azar %H860%Xtenga%Ytengan%Z más pioneros llegarán acá para poblar la ciudad.\n@c2@"
  fr: "@aHank Hoffman Jr@bEn somme, plus vous faites de rencontres aléatoires avec d'autres personnes, plus vous ramenez de monde pour peupler notre belle ville.\n@c2@"
  it: "@aJohn Dwayne Jr.@bIn altre parole, più gente si manda in giro e più incontri a sorpresa si fanno, maggiore è il numero di persone che vengono in questa città.\n@c2@"
  ja: "@a@bホフマン「そうやって　どんどん\n\tいろんな人と　すれちがうと\n\t町も　さらに発展してゆくはず！\n@c2@"
"106":
  de: "@aHank Hoffman Jr.@bUnd die Pioniere, die Ihr in neue Städte schickt, machen sich dort natürlich genauso nützlich.\n@c2@"
  en: "@aHank Hoffman Jr.@bAn' it goes without sayin' that the pioneers you send off to new towns'll make useful citizens of themselves wherever they happen to end up, too.\n@c2@"
  es: "@aJuanchito@bNo hace falta decir que cualquier pionero que %H860%Xenvíe%Yenvíen%Z a nuevas ciudades pues se comportará como un ciudadano ejemplar allá donde vaya.\n@c2@"
  fr: "@aHank Hoffman Jr@bEt il va d'soit que les pionniers que vous envoyez dans d'autres villes deviennent aussi des citoyens très utiles sur place.\n@c2@"
  it: "@aJohn Dwayne Jr.@bOvviamente, i pionieri che %H860%Xavrai%Yavrete%Z inviato diventeranno nuovi abitanti dei luoghi dove sono stati spediti, e si renderanno utili lì.\n@c2@"
  ja: "@a@bホフマン「もちろん　%a00090さんの大使も\n\tすれちがった別世界で　町の発展に\n\t役立つはずですよ。\n@c2@"
"107":
  de: "@aHank Hoffman Jr.@bAlso, dann wollen wir Euch mal den perfekten Pionier raussuchen.\n@c2@"
  en: "@aHank Hoffman Jr.@bAlright now, let's git on an' find you the\nperfect pioneer.\n@c2@"
  es: "@aJuanchito@bEstá bien, ahorita busquemos al pionero perfecto.\n@c2@"
  fr: "@aHank Hoffman Jr@bBon, maintenant, nous allons chercher l'pionnier idéal.\n@c2@"
  it: "@aJohn Dwayne Jr.@bForza, andiamo a cercare un bravo pioniere!\n@c2@"
  ja: "@a@bホフマン「さて……\n\tそれでは　いよいよ　すれちがい大使を\n\t任命していただきましょうか。\n@c2@"
"108":
  de: "@aHank Hoffman Jr.@bZuerst müsst Ihr Euch entscheiden, was für einen Pionier Ihr ausschicken wollt.\n@c2@"
  en: "@aHank Hoffman Jr.@bFirst you gotta choose yourself the type o' varmint you wanna send on out there a-pioneerin'.\n@c2@"
  es: "@aJuanchito@bPrimero %H860%Xha%Yhan%Z de elegir el tipo de aventurero que %H860%Xdesea%Ydesean%Z enviar como pionero.\n@c2@"
  fr: "@aHank Hoffman Jr@bD'abord, vous d'vez choisir le type de personne que vous voulez envoyer comme pionnier à l'extérieur.\n@c2@"
  it: "@aJohn Dwayne Jr.@bInnanzitutto, %H860%Xscegli%Yscegliete%Z il tipo di persona che %H860%Xvuoi%Yvolete%Z inviare.\n@c2@"
  ja: "@a@bホフマン「まずは　どんなタイプの人を\n\tすれちがい大使に　任命したいか\n\tえらんでください。\n@c2@"
"109":
  de: "@aHank Hoffman Jr.@bDenkt daran, %a00090, dieser Pionier wird da draußen Eure Interessen vertreten, also trefft Eure Wahl mit Bedacht.\n@c2@"
  en: "@aHank Hoffman Jr.@bRemember, %a00090, this sucker'll be representin' your interests out there, so choose careful now.\n@c2@"
  es: "@aJuanchito@bRecuerde, %a00090, quien envíe representará sus intereses allá, así que ándese con cuidado.\n@c2@"
  fr: "@aHank Hoffman Jr@bSouv'nez-vous, cette personne va représenter vos intérêts à l'extérieur, alors réfléchissez bien avant de faire votre choix.\n@c2@"
  it: "@aJohn Dwayne Jr.@b%H860%XRicorda%YRicordate%Z: il pioniere girerà il mondo per conto di %a00090, quindi è necessario sceglierlo con cura.\n@c2@"
  ja: "@a@bホフマン「%a00090さんの　代理を\n\tつとめる専門家ですから\n\tしんちょうに　決めてくださいね。\n@c2@"
"110":
  de: "@aHank Hoffman Jr.@bGut, und jetzt gebt Eurem Pionierkumpel den absolut coolsten Namen, der Euch einfällt!\n@c2@"
  en: "@aHank Hoffman Jr.@bOkay, now it's time to give your pioneerin' pal the rootinest, tootinest name yer melon can muster!\n@c2@"
  es: "@aJuanchito@bOk, pues llegó el momento de encontrar el nombre más chido que %H860%Xpueda%Ypuedan%Z encontrar para su %A280%Xpionero%Z%B280%Xpionera%Z%C280%XpionerⓅ%Z.\n@c2@"
  fr: "@aHank Hoffman Jr@bBon, maintenant, l'moment est venu de donner à votre pionnier un nom qui sonnera l'mieux possibleⓠ\n@c2@"
  it: "@aJohn Dwayne Jr.@bPerfetto! Adesso %H860%Xdai %A280%Xal tuo pioniere%Z%B280%Xalla tua pioniera%Z%C280%Xall'ambiguo personaggio%Z%Ydate %A280%Xal vostro pioniere%Z%B280%Xalla vostra pioniera%Z%C280%Xall'ambiguo personaggio%Z%Z il miglior nome che %H860%Xti%Yvi%Z viene in mente!\n@c2@"
  ja: "@a@bホフマン「それでは　この人に\n\t名前を　つけてあげてください。\n@c2@"
"111":
  de: "@a@bDieser Name geht leider nicht.\n@c0@"
  en: "@a@bSorry, but you can't have that name.\n@c0@"
