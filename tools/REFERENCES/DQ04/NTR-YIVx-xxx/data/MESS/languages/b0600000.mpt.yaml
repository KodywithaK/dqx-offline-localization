  es: "@a@b¡Te has encontrado al azar un pueblo de donde ya habías acogido a un pionero!\n@c0@"
  fr: "@a@bVous venez de tomber par hasard sur une ville dont vous aviez déjà accueilli un pionnierⓠ\n@c0@"
  it: "@a@bHai trovato la città da cui proviene uno dei pionieri che hai incontrato in precedenza!\n@c0@"
  ja: "@a@bいぜん　大使を送ってくれた人と\nふたたび　すれちがいました！\n@c0@"
"130":
  de: "@a@bIn %a00260 ist ein weiterer neuer Mitbürger angekommen!\n@c0@"
  en: "@a@bAnother new citizen has arrived in %a00260!\n@c0@"
  es: "@a@b¡Ahora %a00260 tiene más habitantes!\n@c0@"
  fr: "@a@bUn autre nouveau citoyen est arrivé à %a00260ⓠ\n@c0@"
  it: "@a@bA %a00260 è arrivata un'altra faccia nuova!\n@c0@"
  ja: "@a@b%a00260に　また\n新しい住民が　やって来たようです！\n@c0@"
"131":
  de: "@aHank Hoffman Jr.@bÜbrigens, keine Bange, dass sich Euer Pionier übernehmen könnte! Ihr könnt ihn zu so vielen Orten schicken, wie Ihr wollt.\n@c2@"
  en: "@aHank Hoffman Jr.@bBy the way, y'all can send your pioneer out to as many other places as you like, so don't go worryin' about spreadin' 'em too thin!\n@c2@"
  es: "@aJuanchito@bPor cierto, %H860%Xpuede%Ypueden%Z enviar a sus pioneros a tantos lugares como %H860%Xdesee%Ydeseen%Z, así que no es problema desperdigarlos por toditos los lados.\n@c2@"
  fr: "@aHank Hoffman Jr@bÀ propos, vous pouvez envoyer votre pionnier dans autant d'endroits qu'vous voulez, alors n'ayez pas peur de voir grandⓠ\n@c2@"
  it: "@aJohn Dwayne Jr.@b%H860%XPotrai%YPotrete%Z mandare i pionieri dove %H860%Xti%Yvi%Z pare. Sono persone sane, volenterose e robuste, e non si stancano tanto facilmente.\n@c2@"
  ja: "@a@bホフマン「ところで　すれちがい大使は\n\t自分の分身を　何人でも\n\tすれちがった世界に　送れます。\n@c2@"
"132":
  de: "@aHank Hoffman Jr.@bUnd %a00280 hier ist immer und überall zu einem Schwätzchen aufgelegt, darum braucht Ihr Euch also auch keine Sorgen zu machen.\n@c2@"
  en: "@aHank Hoffman Jr.@bAn' ol' %a00280'll always be here ready to shoot the breeze with you no matter where you send the varmint, so don't you worry 'bout that neither.\n@c2@"
  es: "@aJuanchito@bAdemás %a00280 estará siempre acá %A280%Xlisto%Z%B280%Xlista%Z%C280%XlistⓅ%Z para platicar con %H860%Xusted%Yustedes%Z %A280%Xlo%Z%B280%Xla%Z%C280%XlⓅ%Z %H860%Xmande%Ymanden%Z donde %A280%Xlo%Z%B280%Xla%Z%C280%XlⓅ%Z %H860%Xmande%Ymanden%Z, así que no se %H860%Xpreocupe%Ypreocupen%Z por eso.\n@c2@"
  fr: "@aHank Hoffman Jr@bEt vous trouverez toujours %a00280 ici pour discuter, peu importe où vous l'envoyez, alors vous inquiétez pas pour ça non plus.\n@c2@"
  it: "@aJohn Dwayne Jr.@bInoltre, %a00280 sarà sempre qui, e %H860%Xpotrai%Ypotrete%Z parlarci tutte le volte che %H860%Xvorrai%Yvorrete%Z. I pionieri hanno sempre un mucchio di cose da raccontare!\n@c2@"
  ja: "@a@bホフマン「だから　%a00280さんが\n\t別世界に行っても　そのまま　ここで\n\tお話ができますから　安心してくださいね。\n@c2@"
"133":
  de: "@aHank Hoffman Jr.@bUnd ich würd' glatt 'ner Hyäne die Hinterbeine langziehen, wenn uns das genug Zufallsbegegnungen verschaffte, um sie fertigzubauen!\n@c2@"
  en: "@aHank Hoffman Jr.@bWhy, I'd tear the hind legs off a hyena, long as it would git us enough chance encounters we could find the folks we need to finish the thing!\n@c2@"
  es: "@aJuanchito@b¡Pues le arrancaría las patas traseras a una hiena por tener suficientes encuentros al azar y encontrar más gente y ya acabarlo de una vez!\n@c2@"
  fr: "@aHank Hoffman Jr@bJ'serais prêt à porter plusieurs pattes de lapin si ça pouvait provoquer assez de rencontres aléatoires pour trouver les gens qu'il nous faut pour l'terminerⓠ\n@c2@"
  it: "@aJohn Dwayne Jr.@bDomerei un bisonte a mani nude, se servisse a farci fare tanti incontri a sorpresa e a portar qui tutte le braccia che servono per costruirlo!\n@c2@"
  ja: "@a@bホフマン「私も　はりきって\n\tすれちがい通信の　お手伝いをしますよ。\n@c2@"
"134":
  de: "@aHank Hoffman Jr.@bWas kann ich für Euch tun?\n@c2@"
  en: "@aHank Hoffman Jr.@bAlrighty, what can I do for y'all?\n@c2@"
  es: "@aJuanchito@bOk, ¿qué puedo hacer por %H860%Xusted%Yustedes%Z?\n@c2@"
  fr: "@aHank Hoffman Jr@bBon, dites-moi un peu, qu'est-ce que j'peux faire pour vousⓡ\n@c2@"
  it: "@aJohn Dwayne Jr.@bAllora, cosa posso fare per %H860%Xte%Yvoi%Z?\n@c2@"
  ja: "@a@bホフマン「さて　何を　いたしましょう？\n@c2@"
"135":
  de: "@aHank Hoffman Jr.@bAnscheinend hat %a00280 da draußen ein wenig Pionierarbeit geleistet, wenn ich mir die neuen Gesichter in der Stadt ansehe.\n@c2@"
  en: "@aHank Hoffman Jr.@bSeems %a00280's been out there doin' a spot o' pioneerin', judgin' by the new faces in town.\n@c2@"
  es: "@aJuanchito@bParece que %a00280 ha hecho rebién su trabajo de %A280%Xpionero%Z%B280%Xpionera%Z%C280%XpionerⓅ%Z a juzgar por las caras nuevas que se ven por acá.\n@c2@"
  fr: "@aHank Hoffman Jr@bApparemment, %a00280 a déjà joué son rôle d'émissaire dans quelques endroit, à en juger par les nouvelles têtes qu'on voit en ville.\n@c2@"
  it: "@aJohn Dwayne Jr.@bSembrerebbe che %a00280 stia svolgendo egregiamente il suo dovere di %A280%Xpioniere%Z%B280%Xpioniera%Z%C280%Xpioniere%Z, a giudicare dalle facce nuove che si vedono in città.\n@c2@"
  ja: "@a@bホフマン「さっそく　%a00280さんが\n\t別世界の大使と　すれちがったようですね。\n@c2@"
"136":
  de: "@aHank Hoffman Jr.@bWarum schlendert Ihr nicht 'n bisschen durch unser schönes %a00260 und lernt ein paar von ihnen kennen?\n@c2@"
  en: "@aHank Hoffman Jr.@bWhy don'tcha have %D120%Xyourself%Yyourselves%Z a stroll around little ol' %a00260 an' get yourselves acquainted with some of 'em?\n@c2@"
  es: "@aJuanchito@b¿Por qué no %H860%Xva%Yvan%Z a dar una vuelta por %a00260 y pues %H860%Xse da%Yse dan%Z a conocer a algunos habitantes nomás?\n@c2@"
  fr: "@aHank Hoffman Jr@bEt si vous alliez faire un tour dans %a00260 pour faire connaissance avec certains d'entre euxⓡ\n@c2@"
  it: "@aJohn Dwayne Jr.@bPerché non %H860%Xfai un giro per %a00260 e ti presenti%Yfate un giro per %a00260 e vi presentate%Z agli ultimi arrivati?\n@c2@"
  ja: "@a@bホフマン「その世界の人が\n\t%a00260に　来ているはず。\n\t見にいってみては　どうでしょう？\n@c2@"
"137":
  de: "@aHank Hoffman Jr.@bWas haltet Ihr von der Stadt, hm? Legt ein ganz schönes Tempo vor, was?\n@c2@"
  en: "@aHank Hoffman Jr.@bWhaddya make o' the ol' town, huh? I figure she'll be up an' bustlin' in no time flat, the rate we're goin'.\n@c2@"
  es: "@aJuanchito@b¿Qué %H860%Xle%Yles%Z parece la ciudad?, ¿eh? Pues nomás que, al paso que vamos, esto estará recontraanimado en un suspiro.\n@c2@"
  fr: "@aHank Hoffman Jr@bAlors, qu'est-ce que vous dites de notre belle villeⓡ J'parie qu'en un rien de temps, ça sera une vraie fourmilière, au rythme où ça va.\n@c2@"
  it: "@aJohn Dwayne Jr.@bScommetto un cavallo contro una moneta bucata che questo posto non ci metterà molto a diventare una vera metropoli!\n@c2@"
  ja: "@a@bホフマン「町のようすは　どうでした？\n\tこれなら　町もすぐ　発展しそうですよ。\n@c2@"
