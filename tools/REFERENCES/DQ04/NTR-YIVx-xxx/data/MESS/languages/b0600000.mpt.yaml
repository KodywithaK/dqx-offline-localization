  it: "@aJohn Dwayne Jr.@b%H860%XVuoi%YVolete%Z cambiarlo? Come %H860%Xpreferisci%Ypreferite%Z.\n@c2@"
  ja: "@a@bホフマン「おや　変えるのですね。\n\tしょうちいたしました。\n@c2@"
"119":
  de: "@aHank Hoffman Jr.@bNa, dann nichts wie her mit Eurem Pionier!\n@c2@"
