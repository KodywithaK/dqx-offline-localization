"141":
  de: "@aHank Hoffman Jr.@bIhr wollt Euch wohl einen neuen Pionier suchen? Wir müssen den Suchprozess ganz von vorn beginnen. Okay?\n@c2@"
  en: "@aHank Hoffman Jr.@bYou wanna pick yourself another pioneer, huh?\nWe'll have to start the whole pickin' process over. Y'all okay with that?\n@c2@"
  es: "@aJuanchito@b¿Quiere elegir personalmente a otro pionero?\nTendremos que empezar de nuevo todito el proceso de selección. ¿Le parece bien?\n@c2@"
  fr: "@aHank Hoffman Jr@bVous voulez choisir un autre pionnier, heinⓡ\nOn va devoir recommencer tout l'processus de choix depuis l'début. Ça vous vaⓡ\n@c2@"
