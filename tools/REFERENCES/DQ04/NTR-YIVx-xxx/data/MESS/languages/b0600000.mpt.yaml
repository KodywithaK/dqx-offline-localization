"121":
  de: "@aHank Hoffman Jr.@bTja, %a00280 hier scharrt schon mit den Hufen, also sagt Bescheid, wenn's mit der Pionierreise losgehen soll.\n@c2@"
  en: "@aHank Hoffman Jr.@bWell, %a00280's here an' rarin' to go, so y'all jes' come by an' holler whenever you wanna git the pioneerin' started.\n@c2@"
  es: "@aJuanchito@bBien, %a00280 está aquí %A280%Xansioso%Z%B280%Xansiosa%Z%C280%XansiosⓅ%Z por partir así que nomás %H860%Xindíquele por dónde quiere%Yindíquenle por dónde quieren%Z que empiece.\n@c2@"
  fr: "@aHank Hoffman Jr@bBon, %a00280 n'attend plus que l'signal du départ, alors vous n'avez plus qu'à faire signe quand vous voulez qu'on commence.\n@c2@"
  it: "@aJohn Dwayne Jr.@bBene, %a00280 è qui, e non vede l'ora di partire. Quando %H860%Xvorrai%Yvorrete%Z che si metta in marcia, non %H860%Xavrai%Yavrete%Z che da dirlo!\n@c2@"
  ja: "@a@bホフマン「%a00280さんが　来ましたね。\n\tでは　すれちがい通信を　はじめるときは\n\t私に声をかけてくださいね。\n@c2@"
"122":
  de: "@a%0%a00280@b%a00331\n%a00332\n%a00333\n@c0@"
