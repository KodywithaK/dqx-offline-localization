  it: "@aJohn Dwayne Jr.@bD'accordo. Con quali parole %H860%Xvuoi%Yvolete%Z che %a00280 si presenti?\n@c2@"
  ja: "@a@bホフマン「それでは　%a00280さんに　\n\tどんなセリフを　言わせたいですか？\n@c2@"
"114":
  de: "@aHank Hoffman Jr.@bIhr habt Eure Meinung geändert? Dann fangen wir besser noch mal von vorne an.\n@c2@"
