  ja: "@a@bホフマン「%a00090さんの\n\tすれちがい大使の任命\n\tたしかに　うけたまわりました！\n@c2@"
"118":
  de: "@aHank Hoffman Jr.@bIhr wollt die Botschaft ändern? Wie Ihr wollt, Partner.\n@c2@"
