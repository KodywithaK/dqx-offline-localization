  es: "@aJuanchito@b¿Seguro nomás que %H860%Xquiere%Yquieren%Z enviar a %a00280 como %A280%Xpionero?%Z%B280%Xpionera?%Z%C280%XpionerⓅ?%Z\n@c2@"
  fr: "@aHank Hoffman Jr@bVous êtes %A090%Xsûr%Z%B090%Xsûre%Z que c'est cette personne que vous voulez envoyer en tant que pionnierⓡ\n@c2@"
  it: "@aJohn Dwayne Jr.@b%H860%XConfermi%YConfermate%Z che è questo il personaggio che %H860%Xvuoi%Yvolete%Z mandare in giro per il mondo?\n@c2@"
  ja: "@a@bホフマン「%a00090さんの\n\tすれちがい大使は　この人でいいですか？\n@c2@"
"113":
