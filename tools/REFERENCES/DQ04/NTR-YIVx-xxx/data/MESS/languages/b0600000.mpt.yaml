  ja: "@a@bホフマン「では　さっそく\n\t%a00280さんを　お呼びします。\n@c2@"
"120":
  de: "@aHank Hoffman Jr.@bHE, %a00280! LOS, BEWEGT EURE KNOCHEN MAL HIER RÜBER! %0%a00140 BRAUCHT EURE HILFE!\n@c2@"
  en: "@aHank Hoffman Jr.@bHEY, %a00280! GIT YOUR SORRY CARCASS DOWN HERE RIGHT NOW! %0%a00140 NEEDS YOUR HELP!\n@c2@"
  es: "@aJuanchito@b¡Eh, %a00280! ¡VENGA ACÁ INMEDIATAMENTE! ¡%0%a00140 NECESITA SU AYUDA!\n@c2@"
