"0":
  de: "@a@b*: Willkommen in der Stadt Endor.\n@c2@"
  en: "@a@b*: Welcome to the town of Endor.\n@c2@"
  es: "@a@b*: %H860%XTe%YOs%Z doy la bienvenida a la ciudad de Endor.\n@c2@"
  fr: "@a@b*ⓢ Bienvenue dans la ville de Chandor.\n@c2@"
  it: "@a@b*: %H860%XTi%YVi%Z do il benvenuto a Endor.\n@c2@"
  ja: "@a@b＊「エンドールの城下町に　ようこそ。\n@c2@"
"1":
  de: "@a@b*: Habt Ihr vom Turnier von Endor gehört? Es wurde hier in der Burg ausgetragen.\n@c1@"
  en: "@a@b*: Did you hear about the Endor Tourney?\nIt took place here in the castle.\n@c1@"
  es: "@a@b*: ¿Has oído hablar del Torneo de Endor?\nSe celebró aquí, en el castillo.\n@c1@"
  fr: "@a@b*ⓢ Avez-vous entendu parler du tournoi de Chandor qui a été organisé au châteauⓡ\n@c1@"
  it: "@a@b*: %H860%XHai%YAvete%Z sentito parlare del Torneo di Endor? S'è svolto qui nel castello.\n@c1@"
  ja: "@a@b＊「ねえ　知ってる？\n\tこのまえ　お城で\n\t武術大会が　開かれたのよ。\n@c1@"
"2":
  de: "@a@b*: Wachestehen ist nicht so einfach wie es aussieht, wisst Ihr. Da freu ich mich auf einen kühlen Schluck oder zwei heut Abend.\n@c2@"
  en: "@a@b*: Aaah... Being on patrol's no soft option, you know. I can't wait to get off duty and down the pub.\n@c2@"
  es: "@a@b*: Estar de guardia no es tan fácil como parece. Cuando llegue la noche me tomaré un par de cervezas.\n@c2@"
  fr: "@a@b*ⓢ Être de garde n'est pas aussi facile qu'il y paraît, vous savez. J'irai sans doute boire un verre ou deux ce soir.\n@c2@"
  it: "@a@b*: Stare di guardia non è semplice come sembra. Stasera andrò a bere qualcosa per rilassarmi dalla fatica...\n@c2@"
  ja: "@a@b＊「かあ～　見回りも　楽じゃねえぜ。\n\t早く　酒場にでもいって\n\tいっぱい　やりたいなあ。\n@c2@"
"3":
  de: "@a@b*: Nach dem Turnier von Endor ging's hier ein bisschen ruhiger zu. Aber jetzt sind die Monster wieder da.\n@c2@"
  en: "@a@b*: We had a brief respite after the Endor Tourney, you know. But now the monsters are back with a vengeance.\n@c2@"
  es: "@a@b*: Después del Torneo de Endor tuvimos un breve respiro, ¿sabes? Pero ahora los monstruos han regresado con sed de venganza.\n@c2@"
  fr: "@a@b*ⓢ Nous avons eu un petit moment de répit après le tournoi de Chandor, mais les monstres sont de retour et ils ne sont pas tendres.\n@c2@"
  it: "@a@b*: Dopo il Torneo di Endor abbiamo avuto un po' di calma, ma ora i mostri sono tornati più forti e aggressivi che mai.\n@c2@"
  ja: "@a@b＊「武術大会の後　しばらくは\n\t怪物も　出なかったのに\n\tまた　出るようになったのよ。\n@c2@"
"4":
  de: "@a@b*: Ich weiß auch nicht! Die Welt ist verrückt geworden!\n@c2@"
  en: "@a@b*: I don't know! The world's gone mad!\n@c2@"
  es: "@a@b*: No sé.\n¡El mundo se ha vuelto loco!\n@c2@"
  fr: "@a@b*ⓢ Je ne sais pas ce qui se passe.\nLe monde est devenu fouⓠ\n@c2@"
  it: "@a@b*: Proprio non capisco! Chissà dove andremo a finire!\n@c2@"
  ja: "@a@b＊「なにが　どうなってんだか……。\n\tぶっそうな世の中だねえ。\n@c2@"
"5":
  de: "@a@b*: Dieses Tor führt zur Burg Endor.\n@c2@"
  en: "@a@b*: Endor Castle is just through this gate.\n@c2@"
  es: "@a@b*: El Castillo de Endor se encuentra tras esta puerta.\n@c2@"
  fr: "@a@b*ⓢ Le château de Chandor est juste derrière cette porte.\n@c2@"
  it: "@a@b*: Il castello di Endor si trova oltre questo cancello.\n@c2@"
  ja: "@a@b＊「この門を　くぐった先に\n\tエンドールのお城がある。\n@c2@"
"6":
  de: "@a@b*: Das Kolosseum ist auch dort. Aber sie haben es nach dem Turnier abgeschlossen.\n@c2@"
  en: "@a@b*: The Colosseum's inside there, too. But now the Endor Tourney has finished, it's locked.\n@c2@"
  es: "@a@b*: El Coliseo también está en el interior.\nPero ahora que el Torneo de Endor ha concluido, está cerrado.\n@c2@"
  fr: "@a@b*ⓢ Le Colisée aussi d'ailleurs, mais il est fermé depuis la fin du tournoi de Chandor.\n@c2@"
  it: "@a@b*: Anche l'Arena si trova all'interno. Ma ora il Torneo di Endor si è concluso, e quindi non si può entrare.\n@c2@"
  ja: "@a@b＊「コロシアムへも　行けるが\n\t今は　武術大会も終わったゆえ\n\t閉鎖中だそうだ。\n@c2@"
"7":
  de: "@aWumms@bEs warten unglaubliche Reichtümer an den seltsamsten Orten auf dich. In Höhlen zum Beispiel. Dort, wo die gefährlichsten Monster leben!\n@c2@"
  en: "@aHardie@bThere are amazing treasures in all sorts of strange places. Deep inside caves, for example. Just where the most vicious monsters live!\n@c2@"
  es: "@aManolo@bExisten tesoros ocultos en los sitios más recónditos. Como en el interior de cuevas. ¡Justo donde están los monstruos más fieros!\n@c2@"
  fr: "@aHardi@bOn trouve des trésors incroyables dans plein d'endroits bizarres.\n㈡\nAu fond de certaines grottes, par exemple, là où vivent les monstres les plus férocesⓠ\n@c2@"
  it: "@aBrando@bI tesori più preziosi si possono trovare nei luoghi più strani, ad esempio nelle caverne dove vivono mostri molto aggressivi.\n@c2@"
  ja: "@a@bスコット「洞くつなどには　まだまだ\n\tすごい宝が　あるらしいが\n\t恐ろしい怪物も　住んでいるのだ。\n@c2@"
"8":
  de: "@aWumms@bWenn du willst, kannst du mich als Leibwächter einstellen. Fünf Tage für 400 Goldmünzen. Was sagst du?\n@c2@"
  en: "@aHardie@bYou could hire me as your personal bodyguard if you're interested. I'd do five days for 400 gold coins. What d'you say?\n@c2@"
  es: "@aManolo@bSi te interesa, podrías contratarme como guardaespaldas personal. 400 monedas de oro por cinco días. ¿Qué te parece?\n@c2@"
  fr: "@aHardi@bJe peux entrer à votre service comme garde du corps, si vous voulez. Cinq jours pour 400 pièces d'or. Qu'est-ce que vous en ditesⓡ\n@c2@"
  it: "@aBrando@bSe la cosa %H860%Xti interessa, puoi%Yvi interessa, potete%Z assumermi come guardia del corpo personale. Chiedo 400 monete d'oro per cinque giorni. %H860%XChe ne dici%YChe ne dite%Z?\n@c2@"
  ja: "@a@bスコット「どうだ？\n\t５日間　４００Ｇで\n\tこのオレを　用心棒に　やとわないか？\n@c2@"
"9":
  de: "@aWumms@bDu willst mich wirklich einstellen? Das ist wunderbar. Ich werde dir stets ein treuer Diener sein!\n@c2@"
  en: "@aHardie@bReally? You'll employ me?\nThat's great. Right, well, I'll be your faithful servant wherever you go!\n@c2@"
  es: "@aManolo@b¿En serio? ¿Me quieres contratar?\nEstupendo. De acuerdo, entonces, ¡seré tu fiel sirviente y te seguiré a todas partes!\n@c2@"
  fr: "@aHardi@bVraimentⓡ Vous me prenezⓡ C'est génial.\nBien, je serai un serviteur loyal où que vous alliezⓠ\n@c2@"
  it: "@aBrando@b%H860%XDici davvero? Mi assumi?%YDite davvero? Mi assumete?%Z Fantastico! Svolgerò il mio dovere di fedele servitore in qualunque circostanza!\n@c2@"
  ja: "@a@bスコット「そうか！　やとってくれるか。\n\tさあ　どこへでも　ついてゆくぞ！\n@c2@"
"10":
  de: "@a@bWumms schließt sich %a00120 an.\n@c2@"
  en: "@a@bHardie joins %a00120.\n@c2@"
  es: "@a@bManolo se une a %a00120.\n@c2@"
  fr: "@a@bHardi se joint à %a00120.\n@c2@"
  it: "@a@bBrando si unisce %F120%Xad%Ya%Z %a00120.\n@c2@"
  ja: "@a@bスコットが　仲間にくわわった！\n@c2@"
"11":
  de: "@aWumms@bOh, ich mag aber keine Hunde.\n@c2@"
  en: "@aHardie@bOh, but I don't like dogs.\n@c2@"
  es: "@aManolo@b¡Oh!, pero no me gustan los perros.\n@c2@"
  fr: "@aHardi@bEuh... mais je n'aime pas les chiens.\n@c2@"
  it: "@aBrando@bUhm, non mi piacciono i cani.\n@c2@"
  ja: "@a@bスコット「しかしオレは\n\t犬が　きらいなのだ。\n@c2@"
"12":
  de: "@aWumms@bIch komm nur mit, wenn der Hund verschwindet. Kannst du ihn nicht zurückbringen?\n@c2@"
  en: "@aHardie@bI'll only do it if the dog goes.\nCan't you take it back where it came from?\n@c2@"
  es: "@aManolo@bSolo lo haré si el perro se marcha.\n¿No puedes devolverlo adonde lo recogiste?\n@c2@"
  fr: "@aHardi@bJe ne vous suivrai que si le chien s'en va. Vous ne pouvez pas le ramener là où vous l'avez prisⓡ\n@c2@"
  it: "@aBrando@bAccetto il lavoro solo se il cane se ne va. Non %H860%Xpuoi%Ypotete%Z riportarlo dove %H860%Xl'hai preso%Yl'avete preso%Z?\n@c2@"
  ja: "@a@bスコット「もし　借りてきた犬なら\n\t返してくることだな。\n@c2@"
"13":
  de: "@aWumms@bDu hast nicht genug Geld. Komm wieder, wenn du etwas gespart hast.\n@c2@"
  en: "@aHardie@bBut you haven't got enough money.\nCome back once you've saved up some cash.\n@c2@"
  es: "@aManolo@bPero no tienes suficiente dinero.\nVuelve cuando hayas ahorrado algo más.\n@c2@"
  fr: "@aHardi@bMais vous n'avez pas assez d'argent.\nRevenez me voir quand vous aurez les moyens.\n@c2@"
  it: "@aBrando@bMa non %H860%Xhai denaro a sufficienza! Ne riparleremo quando avrai%Yavete denaro a sufficienza! Ne riparleremo quando avrete%Z più soldi...\n@c2@"
  ja: "@a@bスコット「しかし　お金が\n\t足りないようだな。\n\t出直してくるがよい。\n@c2@"
"14":
  de: "@aWumms@bNein? Na gut. Falls du es dir anders überlegst, kannst du ja wiederkommen.\n@c2@"
  en: "@aHardie@bNo? Oh, well. If you change your mind, just come and find me.\n@c2@"
  es: "@aManolo@b¿No? Perfecto, entonces. Si cambias de parecer, vuelve y pregunta por mí.\n@c2@"
  fr: "@aHardi@bNonⓡ Tant pis. Si vous changez d'avis, n'hésitez pas à revenir me voir.\n@c2@"
  it: "@aBrando@bNo? Beh, non importa. Se %H860%Xcambi idea, sai%Ycambiate idea, sapete%Z dove trovarmi!\n@c2@"
  ja: "@a@bスコット「そうか　残念だな。\n\t気が変わったら　また　来るがよい。\n@c2@"
"15":
  de: "@a@b*: Schaut, wie schnell die Wolken über den Himmel jagen.\n@c1@"
  en: "@a@b*: Look how fast the clouds scud across the sky.\n@c1@"
  es: "@a@b*: Fíjate con qué rapidez se desplazan las nubes por el cielo.\n@c1@"
  fr: "@a@b*ⓢ Regardez comme les nuages vont vite.\n@c1@"
  it: "@a@b*: Le nuvole si spostano nel cielo molto velocemente.\n@c1@"
  ja: "@a@b＊「ほら　あんなに早く　雲が　\n\t流れてゆくわ。\n@c1@"
"16":
  de: "@a@b*: Das ist bestimmt ein Zeichen. Irgendwo passiert gerade etwas Böses.\n@c1@"
  en: "@a@b*: It could be a sign, you know.\nThat something bad is happening somewhere.\n@c1@"
  es: "@a@b*: Podría tratarse de una señal, ¿sabes?\nDe que en alguna parte está pasando algo horrible.\n@c1@"
  fr: "@a@b*ⓢ À mon avis, c'est un signe.\nQuelque chose de terrible se prépare.\n@c1@"
  it: "@a@b*: Forse questo è un segno che sta succedendo qualcosa di brutto da qualche parte...\n@c1@"
  ja: "@a@b＊「どこかで　よくないことが\n\t起こっているのかしら……。\n@c1@"
"17":
  de: "@a@b%0%a00120 liest das Schild.\n@c0@"
  en: "@a@b%0%a00120 reads the sign.\n@c0@"
  es: "@a@b%0%a00120 lee el cartel.\n@c0@"
  fr: "@a@b%0%a00120 lit l'écriteau.\n@c0@"
  it: "@a@b%0%a00120 legge il cartello.\n@c0@"
  ja: "@a@b%a00120は　立て札を　読んだ。\n@c0@"
"18":
  de: "@a@bⓞDas Turnier von Endor ist vorbei. Alena ist die Siegerin!ⓟ\n@c0@"
  en: "@a@bⓗEndor Tourney Now Over.\nTsarevna Alena Declared Victorious!ⓘ\n@c0@"
  es: "@a@b''El Torneo de Endor ha finalizado.\n¡La zarevna Alena ha resultado ganadora!''\n@c0@"
  fr: "@a@bⓥLe tournoi de Chandor est désormais terminé.\nLa tsarine Alina a remporté la victoireⓠⓦ\n@c0@"
  it: "@a@bⓕIl Torneo di Endor si è concluso. La Zarina Alena ha conquistato la vittoria!ⓖ\n@c0@"
  ja: "@a@b武術大会　終わる！\n優勝者　アリーナ姫！\n@c0@"
"19":
  de: "@a@b*: Unsere Familie war schon immer reich. Was meinen Mann natürlich veranlasst, seiner Sammlung immer neue Seltenheiten hinzuzufügen.\n@c1@"
  en: "@a@b*: We've always had money in the family.\nIt only encourages my husband to buy ever more peculiar things for his collection.\n@c1@"
  es: "@a@b*: Siempre hemos sido una familia de posibles. A mi marido únicamente le sirve para añadir nuevos objetos curiosos a su colección.\n@c1@"
  fr: "@a@b*ⓢ Notre famille a toujours été riche. C'est pourquoi mon mari peut se permettre d'ajouter des objets toujours plus étranges à sa collection.\n@c1@"
  it: "@a@b*: La nostva famiglia è sempve stata molto vicca.\n㈡\n*: Mio mavito è un collezionista di oggetti vavi, ed è sempve alla vicevca di pezzi unici pev avvicchive la sua vaccolta.\n@c1@"
  ja: "@a@b＊「ウチは　古くからの　お金持ちなので\n\t主人たら　変なものばかり\n\t買い集めますのよ。\n@c1@"
"20":
  de: "@a@b*: Aber wir haben ja mehr, als wir überhaupt ausgeben können. Ha ha ha ha!\n@c1@"
  en: "@a@b*: But we've got more than even he can spend. Ha ha ha ha ha!\n@c1@"
  es: "@a@b*: Pero tenemos más de lo que puede gastar. ¡Ja, ja, ja, ja, ja!\n@c1@"
  fr: "@a@b*ⓢ Mais nous avons plus d'argent qu'il ne pourra jamais en dépenser.\n@c1@"
  it: "@a@b*: Devo ammetteve che abbiamo più denavo di quanto possiamo spendevne. Ah! Ah! Ah!\n@c1@"
  ja: "@a@b＊「それでも　お金を\n\t使い切れなくって……。　おほほほほ。\n@c1@"
"21":
  de: "@a@b*: Die junge Dame des Hauses ist total merkwürdig. Die tut anscheinend nie was anderes, als in den Himmel zu starren.\n@c1@"
  en: "@a@b*: The young lady of the house spends all her time starin' at the sky. I just don't know what it is she finds so interestin' about it.\n@c1@"
  es: "@a@b*: La joven señora de la casa es una persona extraña. Parece que no hace más que mirar al cielo el día entero.\n@c1@"
  fr: "@a@b*ⓢ La jeune dame de la maison est vraiment très bizarre. On dirait qu'elle passe son temps à regarder le ciel.\n@c1@"
  it: "@a@b*: La ragazza che sta in questa casa è sempre così strana... Non fa altro che guardare il cielo...!\n@c1@"
  ja: "@a@b＊「この家の　おじょうさんは\n\tいっつも　空ばっか見て\n\tおかしな人だなや～。\n@c1@"
"22":
  de: "@a@bDa steht eine kostbar aussehende Rüstung.\n@c0@"
  en: "@a@bSome expensive-looking armour is on display.\n@c0@"
  es: "@a@bSe expone una armadura con aspecto de ser muy cara.\n@c0@"
  fr: "@a@bUne armure, vraisemblablement de grand prix, est exposée.\n@c0@"
  it: "@a@bC'è un'armatura molto preziosa in esposizione.\n@c0@"
  ja: "@a@b高価そうなヨロイが　かざられている。\n@c0@"
"23":
  de: "@a@b*: Ich bin Sammler, wisst Ihr. Ich sammle Antiquitäten und Kuriositäten aller Art.\n@c2@"
  en: "@a@b*: I'm a collector, you know. Of antiques and curios from days gone by.\n@c2@"
  es: "@a@b*: Soy coleccionista, ¿sabes?\nDe antigüedades y curiosidades del pasado.\n@c2@"
  fr: "@a@b*ⓢ Je suis un grand collectionneur.\nLes antiquités et les raretés d'autrefois m'intéressent tout particulièrement.\n@c2@"
  it: "@a@b*: Sono un collezionista di oggetti antichi e bizzarri.\n@c2@"
  ja: "@a@b＊「私は　古い物を　集めるのが\n\t趣味なのです。\n@c2@"
"24":
  de: "@a@b*: Ich habe von einer Statue gehört, der Silbernen Göttin, die immer noch ⓞirgendwo dort draußenⓟ ist.\n@c2@"
  en: "@a@b*: I've come to hear of a silver Goddess statue that's still ⓗout in the wildⓘ, as it were.\nUp for grabs, if you like!\n@c2@"
  es: "@a@b*: Ha llegado hasta mis oídos que existe una estatua de la Diosa, que permanece ''en la espesura''. ¡Al alcance de la mano!\n@c2@"
  fr: "@a@b*ⓢ J'ai entendu parler d'une statuette en argent de la Déesse qui serait encore ⓥdans la natureⓦ.\nIl suffirait de la trouver.\n@c2@"
  it: "@a@b*: Ho saputo che, da qualche parte, c'è la ⓕDea d'argentoⓖ, una preziosa statua della nostra amata dea.\n㈡\n*: È lì, pronta per essere presa da chiunque la trovi.\n@c2@"
  ja: "@a@b＊「ウワサでは　どこかに　銀の女神像が\n\t眠っていると　聞きました。\n@c2@"
"25":
  de: "@a@b*: Ich würde jeden Preis für sie zahlen. Gebt mir bitte Bescheid, falls Ihr sie findet.\n@c2@"
  en: "@a@b*: I'd pay anything for it. Anything at all.\nSo if you come across it, don't hesitate to bring it to me.\n@c2@"
  es: "@a@b*: Pagaría cualquier cosa por conseguirla. Cualquier cosa.\nSi llegas a encontrarla, no dudes en traérmela.\n@c2@"
  fr: "@a@b*ⓢ Je donnerais tout ce que j'ai pour l'avoir.\nSi vous mettez la main dessus, sachez que vous avez un acheteurⓠ\n@c2@"
  it: "@a@b*: Pagherei qualsiasi prezzo per averla. Qualsiasi cifra. Se dovesse %H860%Xcapitarti%Ycapitarvi%Z di vederla, non %H860%Xesitare%Yesitate%Z a portarmela.\n@c2@"
  ja: "@a@b＊「いやいや\n\tいくら出してもいいから\n\t手に入れたいものですなあ……。\n@c2@"
"26":
  de: "@a@b*: Das ist... Ist das wirklich... die Silberne Göttin?\n@c2@"
  en: "@a@b*: That'sⓚⓛ Can it really be...the silver Goddess statue?\n@c2@"
  es: "@a@b*: Es... No puede ser cierto... ¿la estatua de la Diosa?\n@c2@"
  fr: "@a@b*ⓢ C'est... C'est impossible... Il s'agit vraiment de la statuette en argent de la Déesseⓡ\n@c2@"
  it: "@a@b*: Quella... No, non può essere! Quella è la Dea d'argento?\n@c2@"
  ja: "@a@b＊「やや！　そこに　持っているのは\n\tもしや　銀の女神像では！？\n@c2@"
"27":
  de: "@a@b*: Ich... Ich zahle zwanzig... nein, fünfundzwanzigtausend Goldmünzen für sie! Was ist nun? Verkauft Ihr sie mir?\n@c2@"
  en: "@a@b*: I'll... I'll pay 20ⓚⓛ No, 25000 gold coins for it! Well, then?\nWill you sell it to me?\n@c2@"
  es: "@a@b*: Yo... Te pagaré veinte... No, ¡veinticinco mil monedas de oro! ¿Qué dices? ¿Estás dispuesto a venderla?\n@c2@"
  fr: "@a@b*ⓢ Je... Je vous en donne 20... non, 25000 pièces d'orⓠ Alorsⓡ Vous me la vendezⓡ\n@c2@"
  it: "@a@b*: %H860%XTi%YVi%Z offro venti... No, venticinquemila monete d'oro per la statua! Allora, me la %H860%Xvendi%Yvendete%Z? \n@c2@"
  ja: "@a@b＊「２００００……\n\tいや　２５０００Ｇ出そう！\n\tそれを　売ってくれまいか？\n@c2@"
"28":
  de: "@a@b*: Wunderbar! Hier. Nun gehört sie mir!\n@c2@"
  en: "@a@b*: Wonderful! Here you are. Now it's mine!\n@c2@"
  es: "@a@b*: ¡Estupendo! Aquí tienes. ¡Ya es mía!\n@c2@"
  fr: "@a@b*ⓢ Parfaitⓠ Marché conclu. Elle est à moiⓠ\n@c2@"
  it: "@a@b*: Magnifico! Ecco qui i soldi. Ora è mia!\n@c2@"
  ja: "@a@b＊「おお　ありがたい！\n\tたしかに　受け取ったぞ！\n@c2@"
"29":
  de: "@a@b%0%a00120 erhält fünfundzwanzigtausend Goldmünzen!\n@c2@"
  en: "@a@b%0%a00120 receives 25000 gold coins!\n@c2@"
  es: "@a@b%0%a00120 recibe 25.000 monedas de oro.\n@c2@"
  fr: "@a@b%0%a00120 reçoit 25000 pièces d'orⓠ\n@c2@"
  it: "@a@b%0%a00120 riceve venticinquemila monete d'oro!\n@c2@"
  ja: "@a@b%a00120は　２５０００Ｇ\n手に入れた！\n@c2@"
"30":
  de: "@a@b*: Was? Ihr verkauft sie nicht? Aber... Na gut. Kommt aber sofort zu mir, wenn Ihr es euch anders überlegt.\n@c2@"
  en: "@a@b*: What? You won't sell it? But...\nOh, well. If you change your mind, don't hesitate to come back to me.\n@c2@"
  es: "@a@b*: ¿Qué? ¿No la quieres vender? Pero...\nPerfecto, entonces. Si cambias de opinión no dudes en volver a verme.\n@c2@"
  fr: "@a@b*ⓢ Commentⓡ Vous ne voulez pas la vendreⓡ Mais...\nBon, je n'insiste pas, mais si vous changez d'avis, revenez me voir.\n@c2@"
  it: "@a@b*: Cosa? %H860%XNon vuoi%YNon volete%Z venderla? Oh, capisco. Beh, se %H860%Xcambi idea, non esitare%Ycambiate idea, non esitate%Z a tornare da me.\n@c2@"
  ja: "@a@b＊「う～ん　ダメなのか……。\n\tしかし　もし　気が変わったら\n\tいつでも　売りにきてくだされよ！\n@c2@"
"31":
  de: "@a@b*: Schaut sie Euch an. Ich kann es gar nicht fassen. Welch einen Schatz habe ich hier gefunden!\n@c2@"
  en: "@a@b*: Just look at it! I can't tear my eyes away from it. What a treasure this statue of the Goddess is!\n@c2@"
  es: "@a@b*: ¡Fíjate bien! No puedo levantar la mirada. ¡Esta estatua de la Diosa es una verdadera joya!\n@c2@"
  fr: "@a@b*ⓢ Regardez-laⓠ Je n'arrive pas à détacher mon regard de cet objet. Cette statuette de la Déesse est une merveilleⓠ\n@c2@"
  it: "@a@b*: Che splendore! Non riesco a staccare lo sguardo da questo capolavoro... La Dea d'argento è una vera meraviglia!\n@c2@"
  ja: "@a@b＊「いやいや　この女神像は\n\tいつ見ても　ホレボレしますな。\n@c2@"
"32":
  de: "@a@b*: Doch genug davon. Ich habe kürzlich von einem anderen Schatz gehört, dem Zenithiaschwert.\n@c2@"
  en: "@a@b*: But enough of that. I've heard mention of another great treasure recently, called the Zenithian Sword.\n@c2@"
  es: "@a@b*: Pero ya es suficiente. He oído rumores de otro gran tesoro, la llamada Espada de Zenithia.\n@c2@"
  fr: "@a@b*ⓢ Sinon, j'ai entendu parler d'un autre trésor inestimable. Il s'agit de l'Épée zénithienne.\n@c2@"
  it: "@a@b*: Però non sono ancora soddisfatto. Ho sentito parlare di un altro tesoro: la Spada Zenithiana.\n@c2@"
  ja: "@a@b＊「しかし　ウワサでは　その昔\n\t天空のつるぎとかいうのが\n\tあったそうです。\n@c2@"
"33":
  de: "@a@b*: Ich würde jeden Preis für sie zahlen. Gebt mir bitte Bescheid, falls Ihr sie findet.\n@c2@"
  en: "@a@b*: I'd pay anything for it. Anything at all.\nSo if you come across it, don't hesitate to bring it to me.\n@c2@"
  es: "@a@b*: Pagaría cualquier cosa por conseguirla. Cualquier cosa.\nSi llegas a encontrarla, no dudes en traérmela.\n@c2@"
  fr: "@a@b*ⓢ Je donnerais tout ce que j'ai pour l'avoir.\nSi vous mettez la main dessus, sachez que vous avez un acheteurⓠ\n@c2@"
  it: "@a@b*: Pagherei qualsiasi prezzo per averla. Qualsiasi cifra. Se dovesse %H860%Xcapitarti%Ycapitarvi%Z di vederla, non %H860%Xesitare%Yesitate%Z a portarmela.\n@c2@"
  ja: "@a@b＊「いやいや\n\tいくら出してもいいから\n\t手に入れたいものですなあ……。\n@c2@"
"34":
  de: "@aTessa@bOh, es ist so schön, dich zu sehen, Torneko! Du arbeitest ja so hart in letzter Zeit.\n@c1@"
  en: "@aTessie@bOh, 'tis grand altogether to see ye, Torneko! 'Tis brutal, you workin' yerself so hard every day.\n@c1@"
  es: "@aTrakiba@b¡Ah, qué placier verte, Torneko! Ti matas a triabajar cada día, es muy cruel, sí.\n@c1@"
  fr: "@aLucille@bJe suis bien contente de te voir, Tornekoⓠ\nTu travailles tellement dur en ce moment.\n@c1@"
  it: "@aBeatrice@bBaldo, home so' contenta di vederti! Ultimamente 'un fai altro che lavora'! Ma mi pensi un pohino ogni tanto?\n@c1@"
  ja: "@a@bネネ「あなた　おかえりなさい！\n\t毎日　毎日　本当に\n\tおつかれさま。\n@c1@"
"35":
  de: "@aTessa@bHaste schon vom Kasino gehört? Es hat gerade wieder aufgemacht. Ähm... hab ich gehört.\n@c1@"
  en: "@aTessie@bDid ye hear about the casino?\n'Tis just after openin' up again.\nEm...so I've heard.\n@c1@"
  es: "@aTrakiba@b¿Has oído lo del casino?\nQuieren volvier a abrir.\nBueno... Eso dicen.\n@c1@"
  fr: "@aLucille@bTu as entendu pour le casinoⓡ\nIl vient de rouvrir.\nEnfin... hum... c'est ce qu'on m'a dit.\n@c1@"
  it: "@aBeatrice@bTe tu ha' saputo de i'ccasinò? L'hanno appena riaperto. Ehm... così ho sentito di'!\n@c1@"
  ja: "@a@bネネ「そういえば　なんでも\n\tカジノが　ひらいたんですって！\n@c1@"
"36":
  de: "@aTessa@bGeh doch mal hin, das tät dir bestimmt gut.\n@c1@"
  en: "@aTessie@bIt'd do y'a power o' good to have a bit of a gas in the place sometimes, so it would.\n@c1@"
  es: "@aTrakiba@bNo ti viendría nada mal darte alguna vuelta que otra por ahí de vez en cuando, sí.\n@c1@"
  fr: "@aLucille@bÇa te ferait sûrement du bien d'aller y faire un tour.\n@c1@"
  it: "@aBeatrice@bCerto ti farebbe bene riposarti ogni tanto, invece d'anda' sempr'a giro!\n@c1@"
  ja: "@a@bネネ「たまには　息ぬきしても\n\tいいんじゃないかしら？\n@c1@"
"37":
  de: "@aTessa@bWillkommen zu Hause, Liebling. Ich hab eine Nachricht für dich. Ich soll dir sagen, dass der Tunnel fertig ist.\n@c1@"
  en: "@aTessie@bWelcome home, love. I've a message to pass on to ye. I was asked would I tell ye that the tunnel's after bein' finished.\n@c1@"
  es: "@aTrakiba@bBienvienido a casa, cariñio. Tiengo un miensaje para ti. Mi han dicho que ti diga que van a acabar el túnel.\n@c1@"
  fr: "@aLucille@bBienvenue à la maison, mon chéri.\nQuelqu'un a laissé un message pour toi.\nJe dois te dire que le tunnel est terminé.\n@c1@"
  it: "@aBeatrice@bBentornato, amore mio. C'ho un messaggio per te. M'hanno detto di farti sape' che i' tunnel sta pe' esse' hompletato.\n@c1@"
  ja: "@a@bネネ「あなた　おかえりなさい！\n\t今　知らせがきて\n\t洞くつが　開通したって！\n@c1@"
"38":
  de: "@aTessa@bIch hab zwar keine Ahnung, was das heißen soll, aber das soll ich dir sagen.\n@c1@"
  en: "@aTessie@bI haven't the foggiest idea what it's all about, but that was the message, so it was.\n@c1@"
  es: "@aTrakiba@bNo tiengo ni la más remota idea de qué quiere decir, pero ese era el mensaje, sí.\n@c1@"
  fr: "@aLucille@bJe comprends rien à ce que ça veut dire, mais c'était le message, en tout cas.\n@c1@"
  it: "@aBeatrice@bUn so che signifihi, ma m'hanno chiesto di dirtelo.\n@c1@"
  ja: "@a@bネネ「でも　わたしには\n\tなんのことだか　わからなくて……。\n@c1@"
"39":
  de: "@aTessa@bJetzt sag nicht, dass du schon wieder weg musst. Wo wir doch endlich unser eigenes Geschäft haben... Verreist du wieder?\n@c1@"
  en: "@aTessie@bNow don't tell me ye're off on yer travels again. Not now we finally own the shop we've always dreamed of. Are ye now?\n@c1@"
  es: "@aTrakiba@bNo mi digas que vias a empiezar a viajar otra vez, ahora que finalmiente tienemos la tienda con la que siempre hemos soñiado. ¿Ti vias a ir?\n@c1@"
  fr: "@aLucille@bMe dis pas que tu vas repartir en voyageⓠⓑ\nPas maintenant qu'on a le magasin qu'on a toujours voulu. Heinⓡ\n@c1@"
  it: "@aBeatrice@bE 'un mi di' che stai pe' metterti di novo in viaggio, eh? Proprio ora che ci s'ha la nostra bottega, te parti e te ne vai?\n@c1@"
  ja: "@a@bネネ「まさか　あなた……。\n\tせっかく　お店を持ったのに\n\tまた　旅に出るつもりなの？\n@c1@"
"40":
  de: "@aTessa@bIch hätt's wissen müssen. Na ja, egal. Wenn du gehen musst, musst du gehen.\n@c1@"
  en: "@aTessie@bAye, I might o' known. Well, I won't say nuttin' more, then. If ye've made up yer mind, then that's that.\n@c1@"
  es: "@aTrakiba@bDebí habierlo sabido. Bueno, no diré nada más. Si ya ti has decidido, no hay nada que decir.\n@c1@"
  fr: "@aLucille@bBen voyons... j'aurais dû m'en douter.\nJe n'ai rien à ajouter.\nSi tu as pris ta décision, n'en parlons plus.\n@c1@"
  it: "@aBeatrice@bBeh, dovevo immaginarmelo. 'Un dirò più nulla. Se te tu ha' deciso, fa' come ti pare!\n@c1@"
  ja: "@a@bネネ「わかったわ　あなた。\n\tわたしは　もう　なにも言わないわ。\n@c1@"
"41":
  de: "@aTessa@bDu jagst immer einem Traum hinterher, was, Torneko? Aber dafür biste ja auch ein feiner Kerl.\n@c1@"
  en: "@aTessie@bAlways chasin' a dream, aren't ye, Torneko Taloon? Aye, 'tis that that makes ye the fine feen that y'are.\n@c1@"
  es: "@aTrakiba@bSiempre dietrás de tus sueños, ¿verdad, Torneko Taloon? En riealidad, eso es lo que hace que seas un hombrie tan interiesante.\n@c1@"
  fr: "@aLucille@bToujours à courir après un rêve, pas vrai, Torneko Taloonⓡ Eh oui, c'est ce qui fait tout ton charme.\n@c1@"
  it: "@aBeatrice@bTe tu c'ha' sempre de' sogni da realizza', vero Baldo Baldini? È anche per questo che sei una hosì bella persona. \n@c1@"
  ja: "@a@bネネ「あなたは　いつも\n\tなにか　夢を　持っていないと\n\t生きられない人……。\n@c1@"
"42":
  de: "@aTessa@bUnd lieben tu ich dich auch dafür.\n@c1@"
  en: "@aTessie@bAn' 'tis that that makes me love ye, so it is.\n@c1@"
  es: "@aTrakiba@bY es lo que hace que ti quiera, sí.\n@c1@"
  fr: "@aLucille@bEt c'est aussi pour ça que je t'aime.\n@c1@"
  it: "@aBeatrice@bE ed è pure pe' questo motivo che ti amo.\n@c1@"
  ja: "@a@bネネ「そんな　あなただから\n\tわたしも　好きになったのね。\n@c1@"
"43":
  de: "@aTessa@bViel Glück. Und sei vorsichtig. Ich kümmer mich um alles hier, solang du weg bist.\n@c1@"
  en: "@aTessie@bGood luck. An' be careful, now. I'll take care o' things around here while ye're away.\n@c1@"
  es: "@aTrakiba@bBuena suerte. Y ten mucho cuidado. Yo mi encargaré de todo mientras tú estás de viaje.\n@c1@"
  fr: "@aLucille@bBonne chance. Et fais attention à toi.\nJe m'occuperai de tout pendant ton absence.\n@c1@"
  it: "@aBeatrice@bMentre te starai via, m'occuperò io della bottega, 'un ti preoccupa'.\nBuona fortuna! E mi raccomando, fa' attenzione!\n@c1@"
  ja: "@a@bネネ「いってらっしゃい　あなた！\n\tわたし　いつまでも　待ってるわ！\n@c1@"
"44":
  de: "@aTessa@bIch weiß, du willst mich beschützen und so, aber anflunkern brauchst du mich nicht.\n@c1@"
  en: "@aTessie@bI know ye're only tryin' to protect me, but ye don't have to be tellin' me fibs.\n@c1@"
  es: "@aTrakiba@bYa sé que solo quieres protiegerme, pero no tienes por qué diecirme mentirijillas.\n@c1@"
  fr: "@aLucille@bJe sais que t'essaies de me protéger, mais c'est pas la peine de me raconter des bobards.\n@c1@"
  it: "@aBeatrice@bSo bene che te 'un mi voi fa' veni' l'ansia, ma 'un mi racconta' bischerate, eh.\n@c1@"
  ja: "@a@bネネ「いいのよ。\n\tそんなウソを　ついて\n\tわたしを　なぐさめなくても……。\n@c1@"
"45":
  de: "@aTessa@bIch hab auch von diesem Zenithiaschwert gehört, weißt du. Ich wusste, dass du früher oder später danach suchen würdest.\n@c1@"
  en: "@aTessie@bI've heard about the Zenithian Sword as well, ye know. I knew ye'd be goin' after it sooner or later.\n@c1@"
  es: "@aTrakiba@bYo también he oído habliar de la Espada de Zenithia, sí. Ya sabía que, tiarde o tiemprano, tú irías a busquiarla.\n@c1@"
  fr: "@aLucille@bMoi aussi, j'ai entendu parler de l'Épée zénithienne, tu sais. Je savais que tu partirais à sa recherche un jour ou l'autre.\n@c1@"
  it: "@aBeatrice@bAnch'io ho sentito parla' della Spada Zenithiana, e sapevo che prima o poi te saresti partito pe' anda' a cercarla.\n@c1@"
  ja: "@a@bネネ「わたしも　天空のつるぎのウワサを\n\t耳にしたわ。\n\tそれを　探すつもりなのね……。\n@c1@"
"46":
  de: "@aTimo@bToll, Papa! Du hast immer gesagt, dass wir mal unseren eigenen Laden haben, und jetzt ist es so weit!\n@c1@"
  en: "@aTipper@bYe're amazin', Da! Y'always told me we'd have our own shop one day, an' now we do!\n@c1@"
  es: "@aTarik@b¡Eres magnífico, papi! ¡Siempre mi diecías que tendríamos nuestra priopia tienda, y ya la tienemos!\n@c1@"
  fr: "@aAchille@bT'es génial, p'paⓠ T'avais toujours dit qu'on aurait un magasin et maintenant, on en a unⓠ\n@c1@"
  it: "@aBalduccio@bBabbone, te tu se' un genio! L'hai sempre detto che un giorno s'avrebbe avuto la nostra bottega, e ora ce l'abbiamo pe' davvero!\n@c1@"
  ja: "@a@bポポロ「わーい　パパ　すごいや！\n\tとうとう　自分のお店を\n\t持ったんだね！　わーい　わーい！\n@c1@"
"47":
  de: "@a@b*: Was? Du bist nach Endor gekommen, um ... Hick!... Geld zu verdienen?\n@c3@"
  en: "@a@b*: You what? You came here to Endor to ⓚⓛ Hic! ⓚⓛ earn some cash?\n@c3@"
  es: "@a@b*: ¿Que tú qué? ¿Has venido hasta aquí para... ¡hip!... ganar dinero?\n@c3@"
  fr: "@a@b*ⓢ De quoiⓡ Z'êtes venu à Chandor pour ⓚ hicⓠ ⓚ gagner de l'argentⓡ\n@c3@"
  it: "@a@b*: Come dishi? Hic! Shei venuto a Endor per guadagnare qualche sholdo? Hic!\n@c3@"
  ja: "@a@b＊「へー　このエンドールに\n\t金もうけに　来たのかい？\n@c3@"
"48":
  de: "@a@b*: Ja, stimmt. Es gibt viele... Hick!... Wege, um hier Geld zu machen.\n@c3@"
  en: "@a@b*: Yeah, you got that right. There's loads o'...er ⓚⓛ Hic! ⓚⓛ ways to earn cash here.\n@c3@"
  es: "@a@b*: Claro, tienes razón. Hay muchísimas formas... eh... ¡hip!... de ganar dinero aquí.\n@c3@"
  fr: "@a@b*ⓢ Ouais, z'avez raison.\nY'a plein de... euh... ⓚ hicⓠ ⓚ ... de manières de gagner de l'argent ici.\n@c3@"
  it: "@a@b*: Oh... Hic! Ottima shelta! Hic! Qui shi shono molti modi per fare quattrini!\n@c3@"
  ja: "@a@b＊「たしかに　この町にゃ\n\tいろんな　もうけ話が　あるからな。\n@c3@"
"49":
  de: "@a@b*: Jetzt trink erst mal einen mit mir. Alles der... Hick!... Reihe nach...\n@c3@"
  en: "@a@b*: Have a drink an' think it over first, though. Take it slow. One ⓚⓛ Hic! ⓚⓛ at a time...\n@c3@"
  es: "@a@b*: Primero, tómate un trago y piénsatelo, anda. Despacio. De una... ¡hip!... en una...\n@c3@"
  fr: "@a@b*ⓢ Prenez un verre et réfléchissez-y d'abord.\nPas trop vite. Un ⓚ hicⓠ ⓚ à la fois...\n@c3@"
  it: "@a@b*: Ma prima %H860%Xbevi%Ybevete%Z un goshetto... Un shorsho per volta, shensha avere fretta...! Hic!\n@c3@"
  ja: "@a@b＊「自分で　よく考えて\n\tひとつずつ　こなしてゆくことだな。\n\tひっく……。\n@c3@"
"50":
  de: "@a@b*: Guten Tag. Fühlt Euch wie zu Hause und trinkt ein Gläschen oder drei.\n@c1@"
  en: "@a@b*: Hello there. Make yourself comfortable and have a nice drink or three.\n@c1@"
  es: "@a@b*: Hola. %H860%XSiéntate y toma%YSentaos y tomad%Z una cerveza, o dos.\n@c1@"
  fr: "@a@b*ⓢ Bonjour. Installez-vous confortablement et prenez un verre, ou trois.\n@c1@"
  it: "@a@b*: Salve! %H860%XAccomodati%YAccomodatevi%Z e %H860%Xprendi%Yprendete%Z qualcosa da bere!\n@c1@"
  ja: "@a@b＊「いらっしゃい。\n\tゆっくり　飲んでいってね。\n@c1@"
"51":
  de: "@a@b*: Ah, ein Händlerkollege! Ihr seid wohl wegen der Silbernen Göttin hier, was?\n@c2@"
  en: "@a@b*: Ah, a fellow trader! You're here for the silver Goddess statue too, I suppose?\n@c2@"
  es: "@a@b*: ¡Ah, un compañero comerciante! Imagino que habrás venido por la estatua de la Diosa, ¿verdad?\n@c2@"
  fr: "@a@b*ⓢ Tiens, un confrèreⓠ Vous êtes là pour la statuette en argent de la Déesse, vous aussiⓡ\n@c2@"
  it: "@a@b*: Ah, un collega! Anche tu sei qui per la Dea d'argento, immagino...\n@c2@"
  ja: "@a@b＊「おや　あなたも　商人ですな。\n\tすると　あなたも　銀の女神像を\n\t手に入れるために？\n@c2@"
"52":
  de: "@a@b*: Kann's Euch nicht verübeln. Die Statue wird ganz schön was einbringen. Möge der Beste gewinnen! Ha ha ha!\n@c2@"
  en: "@a@b*: Can't say I blame you. We all know it'd sell for a tidy profit, that gem. May the best man win! Ha ha ha!\n@c2@"
  es: "@a@b*: No te puedo culpar. Todo el mundo sabe que esa joya se vendería por un buen precio.\n¡Que gane el mejor postor! ¡Ja, ja, ja!\n@c2@"
  fr: "@a@b*ⓢ Je vous jette pas la pierre. On sait tous qu'il y a une sacrée marge à se faire dessus.\nQue le meilleur gagneⓠ Ha ha haⓠ\n@c2@"
  it: "@a@b*: Lo sapevo. Quell'oggetto è un vero tesoro! Vale un mucchio di soldi. Beh, che dire? Che vinca il migliore! Ah! Ah! Ah!\n@c2@"
  ja: "@a@b＊「じつは　わたしもなんです。\n\tもし　手に入れたら　きっと　高く\n\t売れるでしょうなあ。　わっはっはっ。\n@c2@"
"53":
  de: "@a@b*: Oh, verstehe... Tja, also... Ha ha ha! Ach, nichts! Vergesst, was ich gesagt hab...\n@c2@"
  en: "@a@b*: Oh. I see... Well, er...justⓚⓛ Ha ha ha! It's nothing! Forget I said anything...\n@c2@"
  es: "@a@b*: ¡Oh! Comprendo... Bueno, er... solo... ¡Ja, ja, ja!\n¡No es nada! Olvida lo que he dicho...\n@c2@"
  fr: "@a@b*ⓢ Ah. Oui... je vois. Bien, euh... ha ha haⓠ\nC'est rienⓠ Oubliez ce que je viens de dire...\n@c2@"
  it: "@a@b*: Oh. capisco... Ehm... Ah! Ah! Ah!\nNiente! Non ho detto niente.\n@c2@"
  ja: "@a@b＊「あわわ　そうでしたか……。\n\t今の話は　聞かなかったことに\n\tしてください。　わっはっはっ。\n@c2@"
"54":
  de: "@aWalther@bEin reisender Poet bin ich... aber Gold zu verdienen ist damit nich'. Daher habe ich auch Magie studiert.\n@c2@"
  en: "@aLaurel@bI'm an itinerant poet, but... Well, wouldn't you know it...there's not much money in it. So I've been studying magic as well.\n@c2@"
  es: "@aBenito@bSoy poeta ambulante, pero... bueno, no tienes por qué saberlo... pero no da muchos beneficios que digamos. Así que también estudio magia.\n@c2@"
  fr: "@aLaurel@bJe suis un poète itinérant, mais... vous ne le savez peut-être pas... on ne gagne pas grand-chose.\nC'est pour ça que j'étudie aussi la magie.\n@c2@"
  it: "@aEncanto@bIo sono un poeta errante, ma, come %H860%Xsaprai%Ysaprete%Z, non è che si facciano molti soldi con questo lavoro, così ho deciso di diventare anche un esperto in arti magiche.\n@c2@"
  ja: "@a@bロレンス「私は　旅の詩人ですが\n\t修行をつみ\n\t魔法も　使えるようになりました。\n@c2@"
"55":
  de: "@aWalther@bMeine Dienste steh'n dir zur Verfügung, keine Frage, nur 600 Goldmünzen für fünf Tage.\n@c2@"
  en: "@aLaurel@bMy services are for hire, if you so desire. 600 gold coins for five days.\n@c2@"
  es: "@aBenito@bPuedes contratar mis servicios, si lo deseas.\n600 monedas de oro por cinco días.\n@c2@"
  fr: "@aLaurel@bJe vous propose mes services, si vous voulez.\nCinq jours pour 600 pièces d'or.\n@c2@"
  it: "@aEncanto@bSe %H860%Xvuoi, puoi avermi al tuo%Yvolete, potete avermi al vostro%Z servizio. Cinque giorni %H860%Xti%Yvi%Z costeranno 600 monete d'oro.\n@c2@"
  ja: "@a@bロレンス「５日間　６００Ｇで\n\tこの私を　やとってみませんか？\n@c2@"
"56":
  de: "@aWalther@bDu stellst mich ein? Wie wunderbar! ...So lang du mich nicht feuerst, ist doch klar!\n@c2@"
  en: "@aLaurel@bYou'll hire me? Splendid!\n...As long as you don't fire me!\n@c2@"
  es: "@aBenito@b¿Me quieres contratar? ¡Estupendo!\n... ¡Siempre que no me despidas!\n@c2@"
  fr: "@aLauriel@bVous m'embauchezⓡ Génialⓠ\n... Tant que vous ne me virez pasⓠ\n@c2@"
