  de: "@a@b*: Ich versteh das nicht... Wenn er doch weiß, dass die Statue in der Höhle ist, warum holt er sie sich dann nicht einfach?!\n@c2@"
  en: "@a@b*: I don't know. If he knows the Goddess statue is in that cave, why can't he just go and get it!?\n@c2@"
  es: "@a@b*: No sé. Si sabe que la estatua de la Diosa está en esa cueva, ¿por qué no va hasta allí y la coge?\n@c2@"
  fr: "@a@b*ⓢ Je ne comprends pas. S'il sait que la statuette de la Déesse se trouve dans cette grotte, pourquoi il n'y va pasⓠⓑ\n@c2@"
  it: "@a@b*: Proprio non capisco! Se lui sa che la statua della dea si trova in quella caverna, perché non va a prenderla?\n@c2@"
  ja: "@a@b＊「むにゃむにゃ……。\n\t女神像が　洞くつにあるなら\n\t早く　取ってくればいいのに……。\n@c2@"
"87":
  de: "@a@b*: Oh, er ist so ein Feigling. Also echt!\n@c2@"
  en: "@a@b*: Oh, he's such a coward! Honestly!\n@c2@"
  es: "@a@b*: ¡Es un auténtico cobarde! ¡En serio!\n@c2@"
  fr: "@a@b*ⓢ Vraimentⓠ Quel trouillardⓠ\n@c2@"
  it: "@a@b*: È un vero codardo!\n@c2@"
  ja: "@a@b＊「まったく　ウチの人ったら\n\tおくびょうなんだから……。\n\tぐうぐう……。\n@c2@"
"88":
  de: "@a@b*: Habt Ihr von Samokswa gehört, diesem Land im Westen? Es heißt, dass dort Leute verschwinden. Ich weiß nicht, was ich davon halten soll...\n@c3@"
  en: "@a@b*: Have you heard of Zamoksva, the country over in the west? They say people are going missing there. I don't know what it's all about...\n@c3@"
  es: "@a@b*: ¿Has oído hablar de Zamoksva, el país que se encuentra al oeste? Dicen que la gente está desapareciendo. No sé a qué se debe todo esto.\n@c3@"
  fr: "@a@b*ⓢ Vous avez entendu parler de Zamoksva, le pays à l'ouestⓡ Il paraît que des gens disparaissent là-bas. Je ne sais pas ce qui se passe...\n@c3@"
  it: "@a@b*: %H860%XHai%YAvete%Z sentito parlare di Zamoskva, il regno che si trova a ovest?\n㈡\n*: Pare che lì siano misteriosamente scomparse delle persone...\n@c3@"
  ja: "@a@b＊「ウワサでは　西の国サントハイムから\n\t人々が　消えたとか。\n\tなにが　起こったのであろうか……。\n@c3@"
"89":
  de: "@a@b*: Torneko! Ich hab's nur dir zu verdanken, dass mein Tunnel endlich fertig ist.\n@c2@"
  en: "@a@b*: Ah, Torneko! 'Tis thanks to you that me tunnel, me pride an' joy, is finally complete.\n@c2@"
  es: "@a@b*: ¡Ah, Torneko! Gracias a ti he podido completar mi túnel, la niñia de mis ojos.\n@c2@"
  fr: "@a@b*ⓢ Torneko, c'est grâce à vous que j'ai pu finir mon fantastique tunnel.\n@c2@"
  it: "@a@b*: Oh, Baldo! È a te che devo di' grazie, se so' riuscito finalmente a completa' il mi' tunnel, e a realizza' il sogno della mi' vita.\n@c2@"
  ja: "@a@b＊「おお　トルネコさん！\n\tあんたのおかげで　このように\n\t洞くつが　開通しましたぞ！\n@c2@"
"90":
  de: "@a@b*: Du sollst den Rest meines Traums verwirklichen, Torneko. Bereise die Welt und such all die verborgenen Schätze.\n@c2@"
  en: "@a@b*: Now I want ye to live out the rest o' me dream. Travel the world in search o' treasure like I always wanted to.\n@c2@"
  es: "@a@b*: Ahora quiero que tú disfrutes del resto de mi sueñio. Riecorre el mundo en busca de tiesoros, como siempre he quierido hacer yo.\n@c2@"
  fr: "@a@b*ⓢ Maintenant, vous allez vivre mon autre rêveⓢ vous allez parcourir le monde à la recherche de précieux trésors.\n@c2@"
  it: "@a@b*: E ora vorrei che te mi facessi un altro piacere... Va' e gira per i'mmondo in cerca di tesori, home ho sempre desiderato di fa' io!\n@c2@"
  ja: "@a@b＊「どうか　わしの夢をついで\n\t世界中の宝を　集めてくだされよ！\n@c2@"
"91":
  de: "@a@b*: Viele Leute durchqueren diesen Tunnel, und sie alle haben unterschiedliche Träume.\n@c2@"
  en: "@a@b*: Many different people pass through this tunnel with as many different dreams between them.\n@c2@"
  es: "@a@b*: Muchas personas pasan por este túnel, cada uno con su propio sueño.\n@c2@"
  fr: "@a@b*ⓢ De nombreuses personnes passent par ce tunnel et elles ont chacune leur rêve.\n@c2@"
  it: "@a@b*: Tante persone attraversano questo tunnel, e ognuna di loro c'ha un sogno diverso da realizza'.\n@c2@"
  ja: "@a@b＊「いろんな　人たちが\n\tいろんな　夢を持って\n\tここを　通ってゆきます。\n@c2@"
"92":
  de: "@a@b*: Sei vorsichtig, Torneko Talun!\n@c2@"
  en: "@a@b*: Be careful on your way, Mr. Taloon!\n@c2@"
  es: "@a@b*: ¡Ten cuidado en tu camino, Taloon!\n@c2@"
  fr: "@a@b*ⓢ Faites attention à vous, Monsieur Taloonⓠ\n@c2@"
  it: "@a@b*: Fa' attenzione, Baldo!\n@c2@"
  ja: "@a@b＊「トルネコどの！\n\tお気をつけて　行かれますように！\n@c2@"
"93":
  de: "@a@b*: Hallo. Ich bin auf der Suche nach einer legendären Waffe.\n@c3@"
  en: "@a@b*: Hello there.\nMe? I'm travellin' in search of a legendary weapon.\n@c3@"
  es: "@a@b*: Eh, hola.\n¿Yo? Estoy viajando en busca de un arma legendaria.\n@c3@"
  fr: "@a@b*ⓢ Bonjour.\nCe que je fais iciⓡ Je suis en quête d'une arme légendaire.\n@c3@"
  it: "@a@b*: Salve. Che sto facendo? Sto cercando un'arma leggendaria.\n@c3@"
  ja: "@a@b＊「わたしは　伝説の武器を　探して\n\t旅をしている。\n@c3@"
"94":
  de: "@a@b*: Und jetzt, wo der Tunnel offen ist, kann ich endlich nach Osten. Dort finde ich bestimmt, was ich suche.\n@c3@"
  en: "@a@b*: Now that the tunnel's open, I can finally head east. I've a quare feelin' that I'll find sometin' useful out over that way.\n@c3@"
  es: "@a@b*: Ahora que el túnel está abierto puedo ir por fin hacia el este. Tengo la sensación de que encontraré algo útil si voy hacia allí.\n@c3@"
  fr: "@a@b*ⓢ Maintenant que le tunnel est ouvert, je peux enfin aller vers l'est. Je suis convaincu que je trouverai quelque chose d'intéressant par là-bas.\n@c3@"
  it: "@a@b*: Ora che i'ttunnel è aperto, finalmente posso anda' verso est. So' certo che da quella parte troverò hualche indizio utile!\n@c3@"
  ja: "@a@b＊「この　洞くつを　抜けて\n\t東の国に　行けば\n\tきっと　手がかりが　得られるであろう。\n@c3@"
"95":
  de: "@a@b*: Wir reisen zur Stadt Endor.\n@c3@"
  en: "@a@b*: We're travelling to the city of Endor.\n@c3@"
  es: "@a@b*: Vamos hacia la ciudad de Endor.\n@c3@"
  fr: "@a@b*ⓢ Nous allons à Chandor.\n@c3@"
  it: "@a@b*: Noi andiamo a Endor.\n@c3@"
  ja: "@a@b＊「オレたちは　エンドールに　行くつもりだ。\n@c3@"
"96":
  de: "@a@b*: Es heißt, dort gäbe es eine Schänke und ein Kasino, und ich hoffe, dort Arbeit zu finden.\n@c1@"
  en: "@a@b*: People say that Endor has a pub and a casino, so I hope we'll be able to find work there.\n@c1@"
  es: "@a@b*: Dicen que en Endor hay una taberna y un casino, así que supongo que encontraremos trabajo allí.\n@c1@"
  fr: "@a@b*ⓢ Il paraît qu'il y a une taverne et un casino à Chandor. Avec un peu de chance, on y trouvera du travail.\n@c1@"
  it: "@a@b*: Ho saputo che a Endor ci sono un locale e un casinò, quindi speriamo di trovare lavoro là.\n@c1@"
  ja: "@a@b＊「エンドールには　カジノや　酒場が\n\tあるらしいから\n\tわたしたちも　やとってもらえるはずよ！\n@c1@"
"97":
  de: "@a@bUnd so macht sich Torneko zu einem Abenteuer gen Osten auf, auf der Suche nach der legendären Waffe...\n@c0@"
  en: "@a@bAnd so Torneko sets off on an adventure to the east, in search of the legendary weapon...\n@c0@"
  es: "@a@bY así, Torneko se pone en marcha hacia el este para vivir una aventura en busca de un arma legendaria...\n@c0@"
  fr: "@a@bEt Torneko met le cap à l'est, en quête de l'arme légendaire...\n@c0@"
  it: "@a@bE così Baldo inizia una nuova avventura, e si dirige verso est, alla ricerca dell'arma leggendaria...\n@c0@"
  ja: "@a@bこうして　トルネコは\n伝説の武器　宝物を　探すため\n東に　旅だったのでした。\n@c0@"
"98":
  de: "@a@b... und um seinen Traum zu verwirklichen: der beste Waffenhändler aller Zeiten zu werden.\n@c0@"
  en: "@a@b...and in search of fulfilment of his dream: to become the greatest arms merchant in the whole world.\n@c0@"
  es: "@a@b... y de la realización de su sueño: convertirse en el mayor mercader de armas del mundo entero.\n@c0@"
  fr: "@a@b... et d'un moyen de réaliser son rêveⓢ devenir le plus grand marchand d'armes du monde.\n@c0@"
