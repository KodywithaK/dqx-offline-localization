"5":
  de: "@a@b*: Wie könnt Ihr es wagen, die Evolution des Meisters zu stören?!\n@c3@"
  en: "@a@b*: How dare you attempt to disturb the evolution of Psaro the Manslayer!\n@c3@"
  es: "@a@b*: ¡¿Cómo %H860%Xosas%Yosáis%Z perturbar la evolución de Psaro el Carnicero?!\n@c3@"
  fr: "@a@b*ⓢ Comment osez-vous perturber l'évolution de Psaro l'Exterminateurⓠⓑ\n@c3@"
  it: "@a@b*: Come %H860%Xosi%Yosate%Z disturbare l'evoluzione di Psaro il Massacratore?\n@c3@"
  ja: "@a@b＊「お前たちか\n\tデスピサロさまの進化を\n\tじゃましようという　ふとどき者は。\n@c3@"
"6":
  de: "@a@b*: Ihr Menschen seid alle wertlos. Und jetzt bereitet Euch auf Euren Tod vor!\n@c3@"
  en: "@a@b*: You humans are all worthless.\nPrepare to meet your demise!\n@c3@"
  es: "@a@b*: Los humanos sois todos despreciables.\n¡%H860%XPrepárate%YPreparaos%Z a morir!\n@c3@"
  fr: "@a@b*ⓢ Votre race n'est qu'une source de problèmes.\nPréparez-vous à mourirⓠ \n@c3@"
  it: "@a@b*: Gli umani sono creature indegne!\n%H860%XPreparati! La tua fine%YPreparatevi! La vostra fine%Z è vicina!\n@c3@"
  ja: "@a@b＊「こざかしい人間どもめ！\n\tオレさまが　成敗してくれるわ！\n@c3@"
"7":
  de: "@aBarbatos@bUff! Ihr seid stärker, als ich dachte.\n@c3@"
  en: "@aBarbatos@bUgh! You are stronger than you appear.\n@c3@"
  es: "@aBarbatos@b¡Agh! %H860%XEres más fuerte%YSois más fuertes%Z de lo que parece.\n@c3@"
  fr: "@aBarbatos@bVous étes plus puissants que je ne l'imaginais.\n@c3@"
  it: "@aBarbatos@bArgh! %H860%XSei più forte%YSiete più forti%Z di quanto credessi...\n@c3@"
  ja: "@a@b＊「く……。\n\tよくぞ…　このオレさまを倒した。\n@c3@"
"8":
  de: "@aBarbatos@bSchon gut. Ich bin besiegt und werde mich zurückziehen. Es ist egal.\n@c3@"
  en: "@aBarbatos@bVery well. I will step back in defeat this time.\nIt matters not.\n@c3@"
  es: "@aBarbatos@bMuy bien. Me batiré en retirada en esta ocasión.\nNo importa.\n@c3@"
  fr: "@aBarbatos@bTrès bien, j'accepte la défaite.\nPeu m'importe.\n@c3@"
  it: "@aBarbatos@bCosì sia... Accetto la sconfitta e mi faccio da parte.\nMa non %H860%Xfarti%Yfatevi%Z illusioni...\n@c3@"
  ja: "@a@b＊「ひとときの　勝利を\n\tせいぜい　かみしめるがいい。\n@c3@"
"9":
  de: "@aBarbatos@bDer hochentwickelte Psaro wird Euch mit Leichtigkeit Eurem Schicksal zuführen, das aus ewigen Qualen und Schmerzen besteht.\n@c3@"
  en: "@aBarbatos@bThe evolved Psaro will easily send you to your destiny of eternal pain and suffering.\n@c3@"
  es: "@aBarbatos@bEl Psaro evolucionado %H860%Xte%Yos%Z enviará con facilidad a %H860%Xtu%Yvuestro%Z destino de dolor y sufrimiento.\n@c3@"
  fr: "@aBarbatos@bMaintenant que Psaro est au faîte de son évolution, il fera en sorte que votre souffrance soit éternelle.\n@c3@"
  it: "@aBarbatos@bGrazie alla sua evoluzione, Psaro avrà facilmente la meglio su di %H860%Xte e ti%Yvoi e vi%Z condannerà a un destino di sofferenze e dolore eterni!\n@c3@"
  ja: "@a@b＊「どのみち　お前たちは\n\t進化した　デスピサロさまに\n\t滅ぼされてしまうのだからな。\n@c3@"
