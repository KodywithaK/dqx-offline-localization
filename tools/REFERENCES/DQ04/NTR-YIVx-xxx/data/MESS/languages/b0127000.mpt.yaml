"0":
  de: "@a@b*: Ich bin der Wächter dieser Barriere.\n@c3@"
  en: "@a@b*: I am defender of this barrier.\n@c3@"
  es: "@a@b*: Yo soy el defensor de esta barrera.\n@c3@"
  fr: "@a@b*ⓢ Je suis chargé de défendre cette barrière.\n@c3@"
  it: "@a@b*: Io sono il guardiano di questa barriera.\n@c3@"
  ja: "@a@b＊「わたしは　この結界を守る者。\n@c3@"
"1":
  de: "@a@b*: Eher lasse ich mein Leben, als dass ich es irgendeinem Eindringling gestatte, sie zu zerstören. Und jetzt lasst uns kämpfen!\n@c3@"
  en: "@a@b*: I will lay my life down before allowing any intruder to destroy it. So now you must fight!\n@c3@"
  es: "@a@b*: Daré mi vida antes que permitir a ningún intruso que la destruya. ¡Así que ha llegado el momento de luchar!\n@c3@"
  fr: "@a@b*ⓢ Je repousse, au péril de ma vie, tous les intrus qui essaient de la détruire.\nAlors vous allez devoir me combattreⓠ\n@c3@"
  it: "@a@b*: Lotterò fino alla morte per difenderla dagli attacchi di chiunque voglia distruggerla! %H860%XPreparati%YPreparatevi%Z a combattere!\n@c3@"
  ja: "@a@b＊「命に　かえても\n\t結界を破らせるわけには　いかぬ！\n\tさあ　来るがよい！\n@c3@"
"2":
  de: "@aRashaverak@bUrgh! Psaro hat lange genug um Rosi getrauert.\n@c3@"
  en: "@aRashaverak@bGurgh! Psaro has been mourning Rose for long enough.\n@c3@"
  es: "@aRashaverak@b¡Gargh! Psaro ha guardado luto por Rosa durante demasiado tiempo.\n@c3@"
  fr: "@aRashaverak@bUuurghⓠ Psaro pleure la disparition de Rose depuis assez longtemps, maintenant.\n@c3@"
  it: "@aRashaverak@bArgh! Psaro ha pianto la morte di Rosa per troppo tempo.\n@c3@"
  ja: "@a@b＊「うぐぐ……。\n\tロザリーさまを失い　ピサロさまが\n\tどれほど　なげいたことか。\n@c3@"
"3":
  de: "@aRashaverak@bEs wird nun Zeit, dass er die Menschheit vernichtet. Lang lebe Psaro! Lang lebe Psaro! Lang leⓚⓛ Urgh...\n@c3@"
  en: "@aRashaverak@bNow it is time for him to eliminate all humans. Long live Psaro! Long live Psaro! Long liⓚⓛ Gurgh...\n@c3@"
  es: "@aRashaverak@bAhora ha llegado el momento de que acabe con todos los humanos. ¡Larga vida a Psaro! ¡Larga vida a Psaro! Larga vi... Gargh...\n@c3@"
  fr: "@aRashaverak@bIl est temps qu'il élimine tous les humains.\nLongue vie à Psaroⓠ Longue vie à Psaroⓠ\nLongue v... aaargh...\n@c3@"
  it: "@aRashaverak@bOra è giunto il momento che egli annienti tutti gli esseri umani! Lunga vita a Psaro! Lunga vita a Psaro! Lunga vit... Argh...!\n@c3@"
  ja: "@a@b＊「人間など　滅びてしまうがいい……。\n\tデスピサロさま　ばんざい！\n\tぐふっ！\n@c3@"
"4":
  de: "@a@bEine der Barrieren löst sich auf...\n@c0@"
  en: "@a@bOne of the barriers disappears...\n@c0@"
  es: "@a@bUna de las barreras desaparece...\n@c0@"
  fr: "@a@bL'une des barrières disparaît...\n@c0@"
  it: "@a@bLa barriera scompare!\n@c0@"
