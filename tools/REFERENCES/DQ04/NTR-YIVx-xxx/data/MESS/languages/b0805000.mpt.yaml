"1":
  de: "@a@bⓞWer hier verdächtige Gestalten herumlungern sieht, möge sie sofort zur Burg bringen!\nGezeichnet: König Burkhard von Burlandⓟ\n@c0@"
  en: "@a@bⓗIf you spot any suspicious bodies lurking about,\nbring them to the castle at once!\n                         King Burnard of Burlandⓘ\n@c0@"
  es: "@a@b''Si se hallara algún sospechoso al acecho,\ndeberá ser llevado al castillo de inmediato.\nFirmado, Rey Recaredo de Burlandia''\n@c0@"
  fr: "@a@bⓥSi vous voyez des gens louches rôder dans les environs, amenez-les immédiatement au châteauⓠ\n                 Roi Bastien de Bastioneⓦ\n@c0@"
  it: "@a@bⓕChiunque noti degli individui sospetti deve\nimmediatamente portarli al castello!\nRe Basilio di Burlandiaⓖ\n@c0@"
  ja: "@a@bあやしい者を　見つけたら\nお城まで！　バトランド王\n@c0@"
