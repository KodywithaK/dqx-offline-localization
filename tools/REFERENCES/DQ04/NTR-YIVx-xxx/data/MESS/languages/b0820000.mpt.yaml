"7":
  de: "@aKönig Minikin@bGute Güte! All Eure Mühe, um mir mehr Minimedaillen zu bringen.\n㈡\nDas erinnert mich an meine Jugend, als auch ich auf Wanderschaft ging, um diese herrlichen kleinen Dingerchen zu suchen.\n@c2@"
  en: "@aKing Minikin@bGoodness! Fancy going to such an effort to bring me more mini medals. It's reminiscent of myself, going to such lengths for the delightful little things.\n@c2@"
  es: "@aRey Ecito@b¡Cielitos! Es curioso que %H860%Xte esfuerces%Yos esforcéis%Z tanto para traerme más minimedallas. \n㈡\nMe recuerda a mí mismo, enfrentándome a cualquier miniriesgo para hacerme con esas pequeñas minipreciosidades.\n@c2@"
  fr: "@aRoi Minimus@bBonté divineⓠ Je vous suis reconnaissant de vous donner tant de mal pour m'en apporter d'autres.\nCes mini médailles sont mon péché ⓥmini-onⓦ.\n@c2@"
  it: "@aRe Minikin@bSanti numi! Fare tanta strada solo per portarmi altre minimedaglie... La %H860%Xtua%Yvostra%Z caparbietà nella ricerca di questi oggettini deliziosi è da lodare!\n@c2@"
  ja: "@a@bメダル王「わっはっは！\n\t%a00110よ　よくぞここまで\n\tちいさなメダルを　集めてくれた！\n@c2@"
"8":
  de: "@aKönig Minikin@bEs bricht mir das Herz, Euch mitteilen zu müssen, dass ich Euch nichts als Belohnung geben kann. Nicht mal eine Winzigkeit.\n@c2@"
  en: "@aKing Minikin@bI'm afraid to have to tell you, though, that I have nothing to give you in reward. Not even a miniscule thing.\n@c2@"
  es: "@aRey Ecito@bMe temo que debo decir%H860%Xte%Yos%Z que no tengo nada que conceder%H860%Xte%Yos%Z como minirecompensa. Ni el más mínimo detallito.\n@c2@"
  fr: "@aRoi Minimus@bMalheureusement, je dois vous dire que je n'ai rien à vous donner pour vos efforts.\nPas même une mini récompense.\n@c2@"
  it: "@aRe Minikin@bTemo, però, di non avere più alcuna ricompensa con cui premiare i %H860%Xtuoi%Yvostri%Z sforzi. Nemmeno un premio piccino piccino.\n@c2@"
  ja: "@a@bメダル王「これで　もう　わしから\n\tそなたに　さずける品もない。\n\tまことに見事であったぞよ！\n@c2@"
"9":
  de: "@aKönig Minikin@bIch hoffe jedoch sehr, dass die Belohnungen, die ich Euch bisher gab, ein Trost sind für all den Ärger, mit dem Ihr auf Euren Reisen konfrontiert wurdet.\n@c2@"
  en: "@aKing Minikin@bStill, I hope that the rewards I've administered thus far are helping to minimise the troubles you encounter on your travels.\n@c2@"
  es: "@aRey Ecito@bSin embargo, espero que las minirecompensas que %H860%Xte%Yos%Z he entregado hasta ahora sirvan para minimizar %H860%Xtus%Yvuestros%Z problemas durante %H860%Xtus%Yvuestros%Z miniviajes.\n@c2@"
  fr: "@aRoi Minimus@bEnfin, j'ose espérer que les cadeaux que je vous ai offerts jusque-là minimisent les problèmes que vous rencontrez lors de vos voyages.\n@c2@"
  it: "@aRe Minikin@bTuttavia, spero che ciò che ho elargito finora %H860%Xti%Yvi%Z sia d'aiuto per superare gli ostacoli che %H860%Xdovrai affrontare nei tuoi%Ydovrete affrontare nei vostri%Z viaggi.\n@c2@"
  ja: "@a@bメダル王「わしが　託した品々が\n\tこれからの　そなたたちの旅に\n\t役立つことを　願っておる。\n@c2@"
"10":
  de: "@aKönig Minikin@bMögen Eure Anstrengungen zum Wohle unserer Welt und der Menschheit den maximalen Erfolg haben! Ha ha ha!\n@c2@"
  en: "@aKing Minikin@bI hope your continued efforts for our world and humankind will be...at their maximum! Ha ha ha!\n@c2@"
  es: "@aRey Ecito@bEspero que %H860%Xtus%Yvuestros%Z continuos miniesfuerzos en pro de nuestro mundo y de la humanidad sean... maxi. ¡Ja, ja, ja!\n@c2@"
  fr: "@aRoi Minimus@bMais je sais que pour sauver le monde et l'humanité, vous ferez le... maximumⓠ\nHa ha haⓠ\n@c2@"
  it: "@aRe Minikin@b%H860%XI tuoi%YI vostri%Z sforzi per aiutare il mondo e tutta l'umanità produrranno certamente risultati... giganteschi! Ah! Ah! Ah!\n@c2@"
  ja: "@a@bメダル王「世界のため　人のため\n\tこれからも　がんばってくれよ！\n\tわっはっは！\n@c2@"
