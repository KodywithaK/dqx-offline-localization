  fr: "@aRoi Minimus@bBonté divineⓠ\nJe me trompe ou vous avez des médailles sur vousⓡ\nLaissez-moi les regarder, %H860%Xmon ami%A120%X%Z%B120%Xe%Z%Ymes ami%R000%Xes%Ys%Z%Zⓠ\n@c2@"
  it: "@aRe Minikin@bSanti numi! Mi sembra che %H860%Xtu ne abbia qualcuna con te%Yne abbiate qualcuna con voi%Z, non è così? %H860%XLasciami%YLasciatemi%Z dare un'occhiata, per favore.\n@c2@"
