"43":
  de: "@a@b*: König Hunfried hat sich bereits in sein Schlafgemach zurückgezogen. Bitte kommt morgen früh wieder.\n@c2@"
  en: "@a@b*: King Humphrey has already retired to his chamber. Please come back again in the morning.\n@c2@"
  es: "@a@b*: El rey Humphrey ya se ha retirado a sus aposentos. %H860%XVuelve%YVolved%Z de nuevo por la mañana.\n@c2@"
