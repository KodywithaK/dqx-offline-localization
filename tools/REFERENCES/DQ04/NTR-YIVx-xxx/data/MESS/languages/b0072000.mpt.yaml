"0":
  de: "@a@bHier ist ein Knopf. Drücken?\n@c0@"
  en: "@a@bThere's a button here.\nPress it?\n@c0@"
  es: "@a@bHay un botón.\n¿Quieres pulsarlo?\n@c0@"
  fr: "@a@bVous voyez un bouton.\nVoulez-vous appuyer dessusⓡ\n@c0@"
  it: "@a@bQui c'è un interruttore.\nVuoi premerlo?\n@c0@"
  ja: "@a@bボタンがあります　おしてみますか？\n@c0@"
"1":
  de: "@a@b*: Du bist wohl auch auf der Suche nach dem Stahlkasten, was?\n@c3@"
  en: "@a@b*: Has yerself come lookin' for the steel strongbox, too?\n@c3@"
  es: "@a@b*: ¿También %H860%Xhas%Yhabiéis%Z vienido a buscar la caja fuerte de aciero?\n@c3@"
  fr: "@a@b*ⓢ Z'êtes aussi %A120%Xvenu%Z%B120%Xvenue%Z pour le coffre-fort de fer, c'est çaⓡ\n@c3@"
  it: "@a@b*: Pure %H860%Xte cerchi%Yvoi cercate%Z la Salvarisparmi?\n@c3@"
  ja: "@a@b＊「あんたも　鉄の金庫を\n\t探しにきたんだな？\n@c3@"
"2":
  de: "@a@b*: Irgendwas stimmt nicht mit diesem rollenden Felsbrocken, wenn du mich fragst. Aber ich hol mir den Schatz, koste es, was es wolle!\n@c3@"
  en: "@a@b*: Aye, well, there's sometin' not quite right about that rollin' boulder if y'ask me. But I'll get meself me treasure still an' all!\n@c3@"
  es: "@a@b*: Pues a mí mi pariece que lo de esa piedra rodante no es muy niormal. ¡Pero aún así me haré con mi tiesoro!\n@c3@"
  fr: "@a@b*ⓢ Ce gros rocher qui bouge me paraît bizarre. Mais c'est pas ça qui m'empêchera de mettre la main sur le trésorⓠ\n@c3@"
  it: "@a@b*: Quella roccia rotolante l'è un po' strana. Ma 'un sarà certo un masso bizzarro a impedirmi di trova' i'ttesoro!\n@c3@"
  ja: "@a@b＊「オレは　あの　転がってくる岩が\n\tどうも　怪しいと思うんだが……。\n\tまあ　お宝は　オレが　いただくぜ！\n@c3@"
"3":
  de: "@a@b%0%a00120 prüft den Boden zu %A120%Xseinen%Z%B120%Xihren%Z Füßen.\n@c0@"
  en: "@a@b%0%a00120 examines the ground at %A120%Xhis%Z%B120%Xher%Z feet.\n@c0@"
  es: "@a@b%0%a00120 examina el suelo alrededor de sus pies.\n@c0@"
  fr: "@a@b%0%a00120 examine le sol devant %A120%Xlui%Z%B120%Xelle%Z.\n@c0@"
  it: "@a@b%0%a00120 esamina il terreno ai suoi piedi...\n@c0@"
  ja: "@a@b%a00120は　足元を　調べた！\n@c0@"
"4":
  de: "@a@bEs ist etwas in den Boden geritzt.\n%0%a00120 liest, was dort steht...\n@c0@"
  en: "@a@bA message has been carved in the floor.\n%0%a00120 reads what it says...\n@c0@"
  es: "@a@bHay un mensaje grabado en el suelo.\n%0%a00120 lee el mensaje...\n@c0@"
  fr: "@a@bUn message a été gravé à même la pierre.\n%0%a00120 déchiffre ce qui est écrit...\n@c0@"
  it: "@a@bPer terra è inciso un messaggio.\n%0%a00120 lo legge...\n@c0@"
  ja: "@a@b床の上に　何か文字がきざんである。\n%a00120は　文字を読んだ。\n@c0@"
"5":
  de: "@a@bⓞGierig ist der Reisende, der nach dem Schatz sich sehnt! Lege zurück, was unrechtmäßig du genommen!\n@c0@"
  en: "@a@bⓗGreedy is the traveller who seeketh treasure! Put back that which thou hast unlawfully taken!\n@c0@"
  es: "@a@b''¡La avaricia es pecado, viajero buscatesoros!\n¡Devuelve lo que has tomado de forma ilegítima!''\n@c0@"
  fr: "@a@bⓥAvide est le pèlerin qui cherche fortuneⓠ\nRemets en place ce que tu as voléⓠ\n@c0@"
  it: "@a@bⓕAvido è colui che va in cerca del tesoro!\nRestituisci ciò che hai illegittimamente sottratto!ⓖ\n@c0@"
  ja: "@a@b宝を求め　旅する者よ。\nそなたの盗んだ宝を\nこの場所に　戻すがよい。\n@c0@"
"6":
  de: "@a@bLege es zurück, und der Pfad des Rückzugs wird sich dir auftun.ⓟ\n@c0@"
  en: "@a@bⓗPut it back, and the path of retreat shall become open to thee.ⓘ\n@c0@"
  es: "@a@b''Devuélvelo, y la salida se abrirá para ti.''\n@c0@"
  fr: "@a@bRepose ton butin et le chemin salvateur s'ouvriraⓦ.\n@c0@"
  it: "@a@bⓕRestituiscilo, e un sentiero si aprirà per te!ⓖ\n@c0@"
  ja: "@a@bさすれば　そなたの\n戻りゆく道が　開かれよう……。\n@c0@"
"7":
  de: "@a@bMöchtest du den Stahlkasten zurückstellen?\n@c0@"
  en: "@a@bDo you want to put the steel strongbox back?\n@c0@"
  es: "@a@b¿Quieres volver a poner en su sitio la caja fuerte de acero?\n@c0@"
  fr: "@a@bVoulez-vous remettre le coffre-fort de fer en placeⓡ\n@c0@"
  it: "@a@bVuoi rimettere a posto la Salvarisparmi?\n@c0@"
  ja: "@a@b鉄のきんこを　もとに戻しますか？\n@c0@"
"8":
  de: "@a@b%0%a00120 stellt den Stahlkasten zurück an seinen Platz.\n@c0@"
  en: "@a@b%0%a00120 puts the steel strongbox back in its place.\n@c0@"
  es: "@a@b%0%a00120 vuelve a poner la caja fuerte de acero en su lugar.\n@c0@"
  fr: "@a@b%0%a00120 remet le coffre-fort de fer en place.\n@c0@"
  it: "@a@b%0%a00120 rimette a posto la Salvarisparmi.\n@c0@"
  ja: "@a@b%a00120は　鉄のきんこを\nもとに戻した。\n@c0@"
"9":
  de: "@a@b*: Dies ist die Burg Casabranca.\n@c2@"
  en: "@a@b*: This is Casabranca Castle.\n@c2@"
  es: "@a@b*: Este es el Castillo de Casablanca.\n@c2@"
  fr: "@a@b*ⓢ Ceci est le château de Casabranca.\n@c2@"
  it: "@a@b*: Questo è il castello di Casabianca.\n@c2@"
  ja: "@a@b＊「ここは　ブランカのお城だ。\n@c2@"
"10":
  de: "@a@b*: Das Ende der Welt ist nahe!\n@c2@"
  en: "@a@b*: The end of the world is nigh!\n@c2@"
  es: "@a@b*: ¡El fin del mundo está cerca!\n@c2@"
  fr: "@a@b*ⓢ La fin du monde est procheⓠ\n@c2@"
  it: "@a@b*: La fine del mondo è vicina!\n@c2@"
  ja: "@a@b＊「この世は　もう　おしまいじゃ！\n@c2@"
"11":
  de: "@a@b*: %A090%XDer erkorene Held, der%Z%B090%XDie erkorene Heldin, die%Z den Herrn der Unterwelt besiegen sollte, ist von Ungeheuern getötet worden.\n@c2@"
  en: "@a@b*: The chosen %A090%Xhero%Z%B090%Xheroine%Z who was supposed to defeat the Lord of the Underworld has been killed by monsters.\n@c2@"
  es: "@a@b*: %A090%XEl héroe elegido%Z%B090%XLa heroína elegida%Z que supuestamente debía derrotar al Señor del Inframundo ha perecido a manos de los monstruos.\n@c2@"
  fr: "@a@b*ⓢ %A090%XLe héros élu%Z%B090%XL'héroïne élue%Z, qui devait vaincre le Seigneur des Enfers, a été %A090%Xtué%Z%B090%Xtuée%Z par des monstres.\n@c2@"
  it: "@a@b*: %A090%XIl Prescelto%Z%B090%XLa Prescelta%Z che doveva sconfiggere il Signore degli Inferi è %A090%Xstato ucciso%Z%B090%Xstata uccisa%Z dai mostri.\n@c2@"
  ja: "@a@b＊「地獄の帝王を倒すはずだった\n\t勇者さまが　魔物たちに\n\t殺されたそうじゃからなっ。\n@c2@"
"12":
  de: "@a@b*: Dank dem Tunnel, den dieser Torneko gebaut hat, könnt Ihr jetzt bis nach Endor im Westen reisen.\n@c2@"
  en: "@a@b*: You can travel all the way to Endor in the west now, thanks to the tunnel that Torneko chap built.\n@c2@"
  es: "@a@b*: Ahora se puede viajar hasta Endor, hacia el oeste, gracias al túnel que ha construido un tal Torneko.\n@c2@"
  fr: "@a@b*ⓢ À présent, on peut voyager vers l'ouest jusqu'à Chandor, grâce au tunnel construit par un certain Torneko.\n@c2@"
  it: "@a@b*: Grazie alla galleria fatta costruire da un certo Baldo Baldini, si può viaggiare verso ovest fino a Endor.\n@c2@"
  ja: "@a@b＊「トルネコという男が　掘ってくれた\n\t洞くつのおかげで　西のエンドールにも\n\t行けるようになりました。\n@c2@"
"13":
  de: "@a@b*: Der arme Torneko kann einem wirklich leid tun.\n@c1@"
  en: "@a@b*: It's such a shame for that poor fellow Torneko.\n@c1@"
  es: "@a@b*: Una pena lo que le ha ocurrido a ese pobre de Torneko.\n@c1@"
  fr: "@a@b*ⓢ C'est tellement dommage pour ce pauvre type, Torneko.\n@c1@"
  it: "@a@b*: Quanto mi spiace per il povero Baldo...\n@c1@"
  ja: "@a@b＊「トルネコという商人は\n\tまったく　かわいそうですね。\n@c1@"
"14":
  de: "@a@b*: Jetzt sind die Ungeheuer hinter ihm her, nur weil er einen Tunnel gebaut hat, um zwei Reiche miteinander zu verbinden.\n@c1@"
  en: "@a@b*: Monsters are hunting him down just because he built a tunnel to connect one kingdom with another.\n@c1@"
  es: "@a@b*: Los monstruos le persiguen solo por haber construido un túnel para comunicar un reino con otro.\n@c1@"
  fr: "@a@b*ⓢ Les monstres le pourchassent juste parce qu'il a construit un tunnel permettant de relier un royaume à un autre.\n@c1@"
  it: "@a@b*: I mostri gli danno la caccia solo perché ha costruito una galleria che collega un regno all'altro.\n@c1@"
  ja: "@a@b＊「洞くつを掘って　国と国とを\n\tつないだりしたもんだから\n\t魔物どもに　ねらわれているとか。\n@c1@"
"15":
  de: "@a@b*: Seine Majestät ist oben. König Hunfried empfängt jeden, ungeachtet seines Ranges oder Standes.\n@c2@"
  en: "@a@b*: His Majesty is upstairs. King Humphrey will meet with anyone, regardless of rank or class.\n@c2@"
  es: "@a@b*: Su Majestad se encuentra arriba. El rey Humphrey recibe a todo el mundo, sin importar su clase ni su rango.\n@c2@"
  fr: "@a@b*ⓢ Sa Majesté est à l'étage. Le roi Humbert reçoit tout le monde, sans distinction de rang ou de classe.\n@c2@"
  it: "@a@b*: Sua Maestà è al piano di sopra. Re Humphrey riceve chiunque, senza distinzione di rango né di classe.\n@c2@"
  ja: "@a@b＊「王さまは　この上におられる。\n\tブランカ王は　身分に関係なく\n\t誰にでも　お会いになる方なのだ。\n@c2@"
"16":
  de: "@a@b*: Die Leute sagen, ein Typ namens Torneko habe einen Führer engagiert, der ihn durch die östliche Wüste bringen sollte.\n@c2@"
  en: "@a@b*: Rumour has it that a fellow called Torneko employed a guide to take him across the eastern desert.\n@c2@"
  es: "@a@b*: Se rumorea que un tal Torneko contrató a un guía para que le ayudara a cruzar el desierto oriental.\n@c2@"
  fr: "@a@b*ⓢ Des rumeurs racontent qu'un homme appelé Torneko aurait employé un guide pour lui faire traverser le désert, à l'est.\n@c2@"
  it: "@a@b*: A quanto pare, un tizio di nome Baldo ha assunto una guida per farsi accompagnare nel deserto a est.\n@c2@"
  ja: "@a@b＊「うわさでは　トルネコという男が\n\tキャラバン隊をやとって\n\t東の砂漠を　越えたそうだ。\n@c2@"
"17":
  de: "@a@b*: Eine Drehung, noch eine Drehung, Sprung und Drehung... Ⓠ\n@c1@"
  en: "@a@b*: One spin, two spin, jump and spin... Ⓠ\n@c1@"
  es: "@a@b*: Un giro, dos giros, salto y giro... Ⓠ\n@c1@"
  fr: "@a@b*ⓢ Un tour, deux tours, saut et tour... Ⓠ\n@c1@"
  it: "@a@b*: Giro, giro, salto e giro... Ⓠ\n@c1@"
  ja: "@a@b＊「クルリン　クルリン\n\tランランラン……。\n@c1@"
"18":
  de: "@a@b*: Hey! Hab ich Euch nicht schon mal irgendwo gesehen?\n@c1@"
  en: "@a@b*: Hey! Haven't I seen you before somewhere?\n@c1@"
  es: "@a@b*: ¡Eh! ¿%H860%XTe%YOs%Z conozco de algo?\n@c1@"
  fr: "@a@b*ⓢ Héⓠ On ne se connaîtrait pas déjàⓡ\n@c1@"
  it: "@a@b*: Ehi! Ma non ci siamo già visti da qualche parte?\n@c1@"
  ja: "@a@b＊「あれ？　あなた　どこかで\n\tお会いしたかしら……？\n@c1@"
"19":
  de: "@a@b*: Einer alten Legende nach ist einmal ein Engel vom Himmel zu den nördlichen Bergen herabgeschwebt.\n@c1@"
  en: "@a@b*: There's an old, old legend of an angel swooping down from the sky to the northern mountains.\n@c1@"
  es: "@a@b*: Existe una leyenda muy antigua que cuenta cómo un ángel bajó del cielo hasta las montañas del norte.\n@c1@"
  fr: "@a@b*ⓢ Une vieille, très vieille légende raconte qu'un ange serait descendu du ciel dans les montagnes du nord.\n@c1@"
  it: "@a@b*: Secondo quanto navva un'antica leggenda, una donna angelo cadde dal cielo sulle montagne a novd.\n@c1@"
  ja: "@a@b＊「むかし　むかし　北の山奥に\n\t天女が舞い降りたそうです。\n@c1@"
"20":
  de: "@a@b*: Sie verliebte sich in einen jungen Holzfäller, und schließlich wurde den beiden ein wunderschönes Kind geboren. Haaach...\n@c1@"
  en: "@a@b*: She fell in love with a young woodcutter, and a beautiful baby was born to them. Aaah...\n@c1@"
  es: "@a@b*: Se enamoró de un joven leñador y fruto de ese amor nació %A090%Xun niño%Z%B090%Xuna niña%Z. Aaah...\n@c1@"
  fr: "@a@b*ⓢ Cet ange, une femme, tomba amoureuse d'un jeune bûcheron, et elle donna naissance à un magnifique bébé... (soupir rêveur)\n@c1@"
  it: "@a@b*: Si innamovò di un giovane taglialegna, e dalla loro unione nacque %A090%Xun bellissimo bambino%Z%B090%Xuna bellissima bambina%Z.\nAh, che cosa vomantica!\n@c1@"
  ja: "@a@b＊「そして　木こりの若者と恋に落ち\n\tふたりの間には　それはそれは\n\tかわいい赤ちゃんが生まれたとか。\n@c1@"
"21":
  de: "@a@b*: Hm? Was mit dem Kind geschah? Keine Ahnung. Aber es ist ja auch nur ein Märchen.\n@c1@"
  en: "@a@b*: Hm? What happened to the baby?\nI have absolutely no idea.\nI'm sure it's just a faerie story, anyway.\n@c1@"
  es: "@a@b*: ¿Mmm? ¿Qué le pasó a%A090%Xl niño%Z%B090%X la niña%Z?\nNo tengo ni la menor idea.\nDe todos modos, es solo un cuento de hadas.\n@c1@"
  fr: "@a@b*ⓢ Mmmⓡ Ce qui est arrivé au bébéⓡ\nJe n'en ai aucune idée. De toute façon, je suis sûre que ce n'est qu'un conte de fées.\n@c1@"
  it: "@a@b*: Come? Cosa accadde %A090%Xal bambino%Z%B090%Xalla bambina%Z?\nNon ne ho la più pallida idea.\nE, comunque, questa è solo una favola.\n@c1@"
  ja: "@a@b＊「え？　その赤ちゃん？\n\tうふふ　イヤですわ。　こんなの\n\tおとぎ話に　決まっていますわ。\n@c1@"
"22":
  de: "@a@b*: Wir haben hier in Casabranca eine alte Redensart...\n@c2@"
  en: "@a@b*: We have an old saying here in Casabranca...\n@c2@"
  es: "@a@b*: Aquí en Casablanca, tenemos un viejo dicho...\n@c2@"
  fr: "@a@b*ⓢ Nous avons un ancien proverbe, ici, à Casabranca...\n@c2@"
  it: "@a@b*: Qui a Casabianca abbiamo un vecchio proverbio...\n@c2@"
  ja: "@a@b＊「この国には　古くから伝わる\n\t言い伝えがありましてね。\n@c2@"
"23":
  de: "@a@b*: Wenn der Böse erwacht, erwacht auch der Erkorene.\n@c2@"
  en: "@a@b*: When the Evil One reawakens, so too will the Chosen Ones.\n@c2@"
  es: "@a@b*: Cuando el mal se despierte, también lo hará %A090%Xel Elegido%Z%B090%Xla Elegida%Z.\n@c2@"
  fr: "@a@b*ⓢ Lorsque le mal se réveillera, l'%A090%XÉlu%Z%B090%XÉlue%Z apparaîtra.\n@c2@"
  it: "@a@b*: Quando il Male si risveglia, così farà anche il Prescelto.\n@c2@"
  ja: "@a@b＊「邪悪なる者　目覚めるとき\n\t勇者も　また　目覚めん……と。\n@c2@"
"24":
  de: "@a@b*: Das ist der königliche Thronsaal. Ich verlasse mich darauf, dass Ihr Seiner Majestät mit Respekt begegnet.\n@c2@"
  en: "@a@b*: This is the royal throne room. I trust that you'll show proper respect to His Majesty.\n@c2@"
  es: "@a@b*: Esta es la sala del trono. Confío en que %H860%Xmuestres%Ymostréis%Z el respeto que Su Majestad se merece.\n@c2@"
  fr: "@a@b*ⓢ Voici la salle du trône royal.\nJe compte sur vous pour montrer à Sa Majesté le respect qui lui est dû.\n@c2@"
  it: "@a@b*: Questa è la sala del trono. So che %H860%Xmostrerai%Ymostrerete%Z il dovuto rispetto a Sua Maestà.\n@c2@"
  ja: "@a@b＊「ここは　玉座の間である。\n\tくれぐれも　我らがブランカ王に\n\tそそうのないようにな。\n@c2@"
"25":
  de: "@a@b*: Östlich von hier erstreckt sich eine große Wüste über viele Meilen hinweg.\n@c2@"
  en: "@a@b*: A vast desert stretches for many miles to the east of these lands.\n@c2@"
  es: "@a@b*: Hay un gran desierto de varios kilómetros de extensión al este de estas tierras.\n@c2@"
  fr: "@a@b*ⓢ Un immense désert s'étend sur plusieurs kilomètres à l'est de ces terres.\n@c2@"
  it: "@a@b*: A est di quest'area c'è una zona desertica che si estende per molte miglia.\n@c2@"
  ja: "@a@b＊「この国より　東にいけば\n\tそこには　広大な砂漠が\n\tひろがっておるのじゃ。\n@c2@"
"26":
  de: "@a@b*: Ich fürchte, ohne eine Pferdekutsche samt Pferd werdet Ihr es wohl kaum schaffen, sie zu durchqueren.\n@c2@"
  en: "@a@b*: I'm afraid you'll find it impossible to cross without a horse and cart.\n@c2@"
  es: "@a@b*: Me temo que %H860%Xte%Yos%Z será imposible cruzarlo sin un caballo y un carromato.\n@c2@"
  fr: "@a@b*ⓢ Je crains qu'il ne vous soit impossible de le traverser sans un chariot et un cheval.\n@c2@"
  it: "@a@b*: Temo sia impossibile attraversarla senza un carro e un cavallo.\n@c2@"
  ja: "@a@b＊「しかし　馬車でもないかぎり\n\tとても砂漠は越えられまいぞ！\n@c2@"
"27":
  de: "@aKönig Hunfried@bWillkommen in meiner Burg, %A120%XaufstrebenderHeld%Z%B120%Xaufstrebende Heldin%Z! Sicher wollt auch Ihr die Welt retten.\n@c2@"
  en: "@aKing Humphrey@bWelcome to my castle, aspiring %A120%Xhero%Z%B120%Xheroine%Z! No doubt you're another one out to save the world.\n@c2@"
  es: "@aRey Humphrey@b%A120%XBienvenido%Z%B120%XBienvenida%Z a mi castillo, aspirante a %A120%Xhéroe%Z%B120%Xheroína%Z. Imagino que serás %A120%Xotro de esos%Z%B120%Xotra de esas%Z que viene a salvar el mundo.\n@c2@"
  fr: "@aRoi Humbert@bBienvenue dans mon château, %A120%Xhéros%Z%B120%Xhéroïne%Z en puissanceⓠ Vous faites sans doute partie de tous ces volontaires pour sauver le monde.\n@c2@"
  it: "@aRe Humphrey@bTi do il benvenuto al mio castello, aspirante %A120%Xeroe%Z%B120%Xeroina%Z! Immagino che anche tu sia qui per salvare il mondo.\n@c2@"
  ja: "@a@b王「よくぞ来た！　勇者を目指すものよ！\n\tそなたも　また　世界を救うため\n\t旅をしているのであろう。\n@c2@"
"28":
  de: "@aKönig Hunfried@bIhr seid %a00120? Das ist ein guter aussagekräftiger Name.\n@c2@"
  en: "@aKing Humphrey@bYou're %a00120?\nThat's a nice strong name.\n@c2@"
  es: "@aRey Humphrey@b¿Eres %a00120? Es un nombre con mucha fuerza.\n@c2@"
  fr: "@aRoi Humbert@bVous êtes %a00120ⓡ\nVoilà un nom qui sonne fort bien.\n@c2@"
  it: "@aRe Humphrey@bTi chiami %a00120? Un nome di carattere.\n@c2@"
  ja: "@a@b王「ほほう　%a00140と申すか？\n\tよい名前じゃな。\n@c2@"
"29":
  de: "@aKönig Hunfried@bNun, ich will Euch sagen, was von Euch erwartet wird.\n@c2@"
  en: "@aKing Humphrey@bNow, let me tell you what's required of you.\n@c2@"
  es: "@aRey Humphrey@bTe contaré lo que se espera de ti.\n@c2@"
  fr: "@aRoi Humbert@bMaintenant, laissez-moi vous expliquer ce que nous attendons de vous.\n@c2@"
  it: "@aRe Humphrey@bBene, lascia che ti spieghi cosa ti viene richiesto.\n@c2@"
  ja: "@a@b王「では　そなたがするべき事を\n\t教えてしんぜよう。\n@c2@"
"30":
  de: "@aKönig Hunfried@bDer Herr der Unterwelt darf auf gar keinen Fall wiedererwachen.\n@c2@"
  en: "@aKing Humphrey@bIt's imperative that the Lord of the Underworld is prevented from reawakening.\n@c2@"
  es: "@aRey Humphrey@bEs de suma importancia impedir a toda costa que el Señor del Inframundo se despierte.\n@c2@"
  fr: "@aRoi Humbert@bIl faut absolument empêcher le Seigneur des Enfers de se réveiller.\n@c2@"
  it: "@aRe Humphrey@bBisogna impedire a tutti i costi che il Signore degli Inferi si risvegli.\n@c2@"
  ja: "@a@b王「地獄の帝王がよみがえるのを\n\tなんとしてでも　阻止するのだ！\n@c2@"
"31":
  de: "@aKönig Hunfried@bDarum sollt Ihr durch die Welt reisen, um so viele Informationen wie möglich über ihn zu sammeln.\n@c2@"
  en: "@aKing Humphrey@bSo I'd like you to travel the world to collect as much information as you can about him.\n@c2@"
  es: "@aRey Humphrey@bPor ese motivo, me gustaría que viajaras por el mundo para recopilar toda la información que puedas sobre él.\n@c2@"
  fr: "@aRoi Humbert@bJ'aimerais donc que vous voyagiez à travers le monde pour rassembler autant d'informations que possible sur lui.\n@c2@"
  it: "@aRe Humphrey@bQuindi vorrei che andassi in giro per il mondo a raccogliere quante più informazioni è possibile sul suo conto.\n@c2@"
  ja: "@a@b王「そのためには　世界中を旅して\n\t帝王についての　言い伝えを\n\t集めなければならぬであろう。\n@c2@"
"32":
  de: "@aKönig Hunfried@bIhr werdet eine wichtige Rolle dabei spielen, diesen Tyrannen aufzuhalten, %a00140. Ich zähle auf Euch!\n@c2@"
  en: "@aKing Humphrey@bYou're going to play an important part in stopping this tyrant, %a00140.\nI'm counting on you!\n@c2@"
  es: "@aRey Humphrey@bTu papel será fundamental para poder detener a ese tirano, %a00140. ¡Cuento contigo!\n@c2@"
  fr: "@aRoi Humbert@bVous allez jouer un rôle important pour arrêter ce tyran, %a00140. Je compte sur vousⓠ\n@c2@"
  it: "@aRe Humphrey@bIl tuo ruolo sarà fondamentale per l'eliminazione di questa minaccia, %a00140. Conto su di te!\n@c2@"
  ja: "@a@b王「そなたの　かつやくを\n\t期待しているぞ！　%a00140よ！\n@c2@"
"33":
  de: "@aKönig Hunfried@bEs wird sicher nicht leicht für ein junges Mädchen wie Euch, aber ich bin sicher, Ihr werdet Euch gut in Acht nehmen, %a00140.\n@c2@"
  en: "@aKing Humphrey@bI know it'll be difficult for a young girl like you, but I trust you'll be sure to stay safe, %a00140.\n@c2@"
  es: "@aRey Humphrey@bAsumo que para una joven como tú será complicado, pero confío en que harás todo lo posible por actuar de forma segura, %a00140.\n@c2@"
  fr: "@aRoi Humbert@bJe sais que cela sera difficile pour une jeune fille telle que vous, mais je suis certain que vous serez prudente, %a00140.\n@c2@"
  it: "@aRe Humphrey@bSo che sarà un compito arduo per una giovane donna come te, ma sono certo che te la caverai, %a00140.\n@c2@"
  ja: "@a@b王「そなたのような　若い娘には\n\tつらいことかも知れぬが\n\t気をつけてゆくのじゃ　%a00140よ！\n@c2@"
"34":
  de: "@a@b*: Die Leute sagen, die Prinzessin von Endor und der Prinz von Bruckstetten seien im Begriff zu heiraten. Ach, man könnte glatt neidisch werden!\n@c1@"
  en: "@a@b*: The Princess of Endor and the Prince of Ballymoral are going to be married soon. Oh, I'm so envious!\n@c1@"
  es: "@a@b*: La Princesa de Endor y el Príncipe de Alcazaba van a contraer matrimonio. ¡Oh, qué envidia!\n@c1@"
  fr: "@a@b*ⓢ D'ici peu, la princesse de Chandor et le prince de Ballimore seront mariés. Oh, comme je les envieⓠ\n@c1@"
  it: "@a@b*: La Principessa di Endor e il Principe di Balmontone stanno per sposarsi. Oh, che invidia!\n@c1@"
  ja: "@a@b＊「うわさでは　エンドールの姫と\n\tボンモールの王子が　近く\n\t結婚するとか。　おうらやましいわ。\n@c1@"
"35":
  de: "@a@b*: Die königliche Hochzeit findet in diesem Moment statt, wisst Ihr. Ich würde ja gern hingehen und bei den Feiern ein wenig zuschauen.\n@c1@"
  en: "@a@b*: The royal wedding is taking place as we speak, you know. I'd love to go and see all the lovely festivities.\n@c1@"
  es: "@a@b*: La boda real se está celebrando en este preciso momento. Me encantaría poder asistir y ver esa maravillosa celebración.\n@c1@"
  fr: "@a@b*ⓢ Le mariage royal a lieu en ce moment même, vous savez. J'adorerais aller assister à toutes ces belles festivités.\n@c1@"
  it: "@a@b*: Anzi, se non erro, il matrimonio reale si sta svolgendo proprio in questo momento.\nQuanto vorrei assistere alla cerimonia!\n@c1@"
  ja: "@a@b＊「えっ？　今ちょうど　結婚式を\n\tあげている最中なんですの？\n\tわたしも　見にいきたいわ……。\n@c1@"
"36":
  de: "@a@b*: Es ist einfach schön, nachts spazieren zu gehen.\n@c2@"
  en: "@a@b*: It feels good to go for a walk at night.\n@c2@"
  es: "@a@b*: Estos paseos nocturnos sientan muy bien.\n@c2@"
  fr: "@a@b*ⓢ C'est agréable de faire une petite balade la nuit.\n@c2@"
  it: "@a@b*: Che bello passeggiare di notte.\n@c2@"
  ja: "@a@b＊「夜の散歩は　気持ちがいいわい。\n@c2@"
"37":
  de: "@a@b*: Zu sehen, wie der Mond sich im See spiegelt, erinnert mich an meine Jugend.\n@c2@"
  en: "@a@b*: Watching the moon reflected in the lake like that reminds me of my younger years.\n@c2@"
  es: "@a@b*: Al ver la luna reflejada sobre el lago recuerdo mis años de juventud.\n@c2@"
  fr: "@a@b*ⓢ Quand je regarde la lune se refléter ainsi dans le lac, cela me rappelle mes jeunes années.\n@c2@"
  it: "@a@b*: Guardare la luna riflessa nel lago mi riporta indietro alla mia giovinezza.\n@c2@"
  ja: "@a@b＊「こうして　池にうつった月を\n\t見ておると　昔のことを\n\t思い出すのう。\n@c2@"
"38":
  de: "@a@b*: Vor langer Zeit lebte einmal ein Vater mit seinem Sohn im nördlichen Wald. Sie waren beide Holzfäller.\n@c2@"
  en: "@a@b*: A long time ago now, there used to be a father and son living in the northern forest.\nBoth of them woodcutters, they were.\n@c2@"
  es: "@a@b*: Hace mucho tiempo, había un padre que vivía junto a su hijo en el bosque del norte.\nLos dos eran leñadores.\n@c2@"
  fr: "@a@b*ⓢ Il y a bien longtemps maintenant, un père et son fils vivaient dans la forêt du nord.\nIls étaient tous les deux bûcherons.\n@c2@"
  it: "@a@b*: Tanto tempo fa, nella foresta a nord abitavano due taglialegna, padre e figlio.\n@c2@"
  ja: "@a@b＊「その昔　北の森の中に\n\t木こりの親子が　住んでおった。\n@c2@"
"39":
  de: "@a@b*: Eines Tages lernte der Sohn im Wald ein wunderschönes Mädchen kennen, und die beiden verliebten sich und heirateten.\n@c2@"
  en: "@a@b*: The son met a beautiful girl in the forest one day, and the two of them fell in love and were married.\n@c2@"
  es: "@a@b*: Un día, el hijo conoció a una bella joven en el bosque, y los dos se enamoraron y se casaron.\n@c2@"
  fr: "@a@b*ⓢ Un jour, le fils rencontra une magnifique jeune fille dans la forêt. Ils tombèrent amoureux l'un de l'autre et se marièrent.\n@c2@"
  it: "@a@b*: Un giorno, il figlio incontrò una bellissima ragazza nella foresta, se ne innamorò e la sposò.\n@c2@"
  ja: "@a@b＊「木こりの息子は　森の中で\n\t美しい娘と出会って\n\t結婚までしたのじゃが……。\n@c2@"
"40":
  de: "@a@b*: Aber dann, eines Tages, wurde er vom Blitz erschlagen.\n@c2@"
  en: "@a@b*: But then, one day, he was killed outright by a bolt of lightning.\n@c2@"
  es: "@a@b*: Pero, de repente, un buen día, un rayo le alcanzó y murió en el acto.\n@c2@"
  fr: "@a@b*ⓢ Mais peu de temps après, le jeune homme fut tué net par la foudre.\n@c2@"
  it: "@a@b*: Poi accadde un evento terribile: il giovane boscaiolo venne ucciso da un fulmine.\n@c2@"
  ja: "@a@b＊「ある日　雷にうたれて\n\t死んでしまったのじゃ。\n@c2@"
"41":
  de: "@a@b*: Der Vater lebt immer noch dort.\nJetzt ist er ganz allein. Und fällt immer noch Bäume, hab ich gehört.\n@c2@"
  en: "@a@b*: The father still lives there, though.\nAll alone, he is.\nAnd still chopping wood, so I hear.\n@c2@"
  es: "@a@b*: El padre sigue viviendo allí, creo. Solo, sin nadie. Y sigue cortando árboles, al menos eso he oído.\n@c2@"
  fr: "@a@b*ⓢ Le père vit toujours là-bas, tout seul désormais. Et il coupe toujours du bois, à ce qu'on dit.\n@c2@"
  it: "@a@b*: Si dice che il padre viva sempre lì. È tutto solo e, per quanto ne so, fa ancora il taglialegna.\n@c2@"
  ja: "@a@b＊「息子は死んでしもうたが\n\t親父のほうは　今でもひとりで\n\t木こりをしておるそうじゃ……。\n@c2@"
