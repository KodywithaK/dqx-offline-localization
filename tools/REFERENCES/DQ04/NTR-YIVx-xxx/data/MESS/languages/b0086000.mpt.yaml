"17":
  de: "@a@b*: Ham-hm, (keuch) HAM-HM!\nIch weiß nicht mal, ob ich ⓚⓛ uff ⓚⓛ morgen noch hier sein werde.\n@c2@"
  en: "@a@b*: Ahem, (splutter) AHEM!\nI donⓙt even know if Iⓙll ⓚⓛ Uuurgh! ⓚⓛ be here tomorrow...\n@c2@"
  es: "@a@b*: ¡Ejem, (tos) EJEM!\nNi siquiera sé si... ¡Auurgh!... estaré aquí mañana...\n@c2@"
  fr: "@a@b*ⓢ Hum, (crachotements) HUMⓠ\nJe ne sais même pas si ⓚ aaaarghⓠ ⓚ je serai encore là demain...\n@c2@"
  it: "@a@b*: Ehm! Coff!\nNon so nemmeno... se sarò ancora qui domani... Aaargh! Coff! Coff!\n@c2@"
  ja: "@a@b＊「ごほっ　ごほっ……。\n\t明日は　生きているかのう……。\n@c2@"
