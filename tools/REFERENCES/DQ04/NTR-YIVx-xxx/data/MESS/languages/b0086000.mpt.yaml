"0":
  de: "@aSchwester Esther@bWillkommen in der Prophètisserie, %H860%Xmein Kind%Ymeine Kinder%Z. Dies ist ein 'eiliger Ort, an dem die Göttin zu uns spricht.\n@c1@"
  en: "@aNun the Wiser@bWelcome to zis prophètisserie, my %H860%Xchild%Ychildren%Z.\nAn ⓙoly place where ze Goddess speaks to us from above.\n@c1@"
  es: "@aSor Sabionde@b%H860%XTe%YOs%Z doy la bienvenida a está prophètisserie, %H860%X%A120%Xmi pequeño%Z%B120%Xmi pequeña%Z%Y%R000%Xmis pequeñas%Ymis pequeños%Z%Z.\n㈡\nUn lugagr sagrado en el que la Diosa nos habla desde los cielos.\n@c1@"
  fr: "@aNonne Obstante@bBienvenue dans cette prophétissery, %H860%Xmon enfant%Ymes enfants%Z.\nUn saint endroit où la Goddess nous parle d'en haut.\n@c1@"
  it: "@aSuor Sagesse@bBienvenue à l'Oracoleria, %H860%Xfedele%Yfedeli%Z.\nQuesto è un luogo sacro in cui la dea ci parla dall'alto.\n@c1@"
  ja: "@a@b＊「ここは　お告げ所。\n\t神のお告げがくだる　聖なるほこら。\n@c1@"
"1":
  de: "@aSchwester Esther@bEinmal kam ein ruhmreischer Soldat, Ragnar Rauhbein von Burland, auf der Suche nach %A090%Xeinem 'elden%Z%B090%Xeiner 'eldin%Z 'ier'er.\n@c1@"
  en: "@aNun the Wiser@bA soldier of great fame, Ragnar McRyan of Burland, came ⓙere once in search of a great %A090%Xⓙero%Z%B090%Xⓙeroine%Z.\n@c1@"
  es: "@aSor Sabionde@bUn soldat muy famoso, Gragnagr McGryan de Bugrlandia, pasó pogr aquí una vez en busca de %A090%Xun gran hégroe%Z%B090%Xuna gran hegroína%Z.\n@c1@"
  fr: "@aNonne Obstante@bUn soldat de grande célébrité, Ragnar McRyan de Bastione, est venu here une fois, à la recherche d'%A090%Xun great héros%Z%B090%Xune great héroïne%Z.\n@c1@"
  it: "@aSuor Sagesse@bTempo fa, un soldato très célèbre di nome Galiardo de' Guglielmi venne qui per cercare %A090%Xun grande héros%Z%B090%Xuna grande héroine%Z.\n@c1@"
  ja: "@a@b＊「バトランドの戦士　ライアンが\n\t勇者を　さがし求めて\n\tこのほこらに　やってきたのです。\n@c1@"
"2":
  de: "@aSchwester Esther@bUnd die Göttin beschrieb Ragnar das Ausse'en dieser verehrungswürdigen Person.\n@c1@"
  en: "@aNun the Wiser@bAnd ze Goddess described to Ragnar what zis great one looked like.\n@c1@"
  es: "@aSor Sabionde@bY la Diosa le descgribió a Gragnagr el aspecto de esta gran pegrsona.\n@c1@"
  fr: "@aNonne Obstante@bEt la Goddess a décrit à Ragnar à quoi ressemblait cette great personne.\n@c1@"
  it: "@aSuor Sagesse@bE la dea ne descrisse il volto a Galiardo.\n@c1@"
  ja: "@a@b＊「神の示された　勇者の姿を\n\tライアンに伝えておきました。\n@c1@"
"3":
  de: "@aSchwester Esther@bDas Licht gewinnt an Stärke.\nEs naht die Zeit, zu der %A090%Xder 'eld%Z%B090%Xdie 'eldin%Z erscheinen wird.\n@c1@"
  en: "@aNun the Wiser@bZe light is growing stronger.\nZe time is near when ze %A090%Xⓙero%Z%B090%Xⓙeroine%Z will appear.\n@c1@"
  es: "@aSor Sabionde@bLa luz se está haciendó cada vez más bgrillante.\nPgronto llegagrá el momento en que hagrá su apagrición %A090%Xeste hégroe%Z%B090%Xesta hegroína%Z.\n@c1@"
  fr: "@aNonne Obstante@bLa lumière devient plus forte.\nLa temps est proche où the %A090%Xhéros%Z%B090%Xhéroïne%Z apparaîtra.\n@c1@"
  it: "@aSuor Sagesse@bLa luce diventa più forte.\nSi avvicina il momento della venuta %A090%Xdell'héros%Z%B090%Xdell'héroine%Z...\n@c1@"
  ja: "@a@b＊「光が　いちだんと\n\t輝きを増しています。\n\tやがて　出会いの時が来るでしょう。\n@c1@"
"4":
  de: "@a@b*: Willkommen in der Mamonmine. Oder vielleicht sollte ich besser sagen: Viel Glück in der Mamonmine? Dies ist ein ziemlich unwirtlicher Ort.\n@c1@"
  en: "@a@b*: Welcome to Mamon Mine. Or should I say, good luck to you in Mamon Mine? This is no place for people now.\n@c1@"
  es: "@a@b*: %L000%XBienvenidas%YBienvenida%Z a la Mina de Mammon.\n¿O debería decir, que la suerte %H860%Xte%Yos%Z acompañe en la Mina de Mammon? No es lugar para humanos.\n@c1@"
  fr: "@a@b*ⓢ Bienvenue à la mine d'Alpion... ou plutôt bonne chanceⓠ Ce n'est pas un endroit très recommandé.\n@c1@"
  it: "@a@b*: %H860%XTi%YVi%Z do il benvenuto alla miniera di Mamon! Anche se, ora come ora, la gente farebbe meglio a stare lontana da questo posto...\n@c1@"
  ja: "@a@b＊「ここは鉱山の町　アッテムト。\n\tとは言っても　今では　とても\n\t人の住めるところじゃないわ。\n@c1@"
"5":
  de: "@a@b*: Früher stand an diesem Grab immer ein trauernder Mann. Aber jetzt ist er seiner Frau nachgefolgt.\n@c1@"
  en: "@a@b*: There was a man mourning by this grave before. But heⓙs gone the same way as his wife now...\n@c1@"
  es: "@a@b*: Antes, un hombre venía a lamentarse a esta tumba. Pero se ha ido al mismo lugar a donde fue su esposa...\n@c1@"
  fr: "@a@b*ⓢ Avant, il y avait un homme qui venait se recueillir sur cette tombe. Mais aujourd'hui, il a rejoint sa femme...\n@c1@"
  it: "@a@b*: Fino a poco tempo fa un uomo piangeva disperato su questa tomba, ma ora ha raggiunto la sua povera moglie...\n@c1@"
  ja: "@a@b＊「ここのお墓の人も　とうとう\n\t先立たれた奥さんのところに\n\t行ってしまったし……。\n@c1@"
"6":
  de: "@a@b*: Aus der Mine strömt ein seltsamer Gasgeruch. Die Leute kippen reihenweise um. Wir haben alle die Nase voll davon!\n@c2@"
  en: "@a@b*: There's a funny-smellin' gas comin' out o' the mine. People are droppin' like flies. We've all 'ad it!\n@c2@"
  es: "@a@b*: Del interior de la mina proviene un extraño olor a gas. La gente cae como moscas. ¡Todos nos hemos visto afectados!\n@c2@"
  fr: "@a@b*ⓢ Il y a des gaz bizarres qui sortent de la mine et les gens tombent comme des mouches. On respire tous çaⓠ\n@c2@"
  it: "@a@b*: Dalla miniera viene fuori uno strano gas che fa stramazzare la gente al suolo come sacchi di patate. Non ne possiamo più di questa situazione!\n@c2@"
  ja: "@a@b＊「鉱山から　変なガスがわいてきて\n\t人が　バタバタと倒れたんだ。\n\tここももう　おしまいだな。\n@c2@"
"7":
  de: "@a@b*: Uuuuhh...\n@c1@"
  en: "@a@b*: Grrr...\n@c1@"
  es: "@a@b*: Aaargh...\n@c1@"
  fr: "@a@b*ⓢ Miaeuuurgh...\n@c1@"
  it: "@a@b*: Aaargh...\n@c1@"
  ja: "@a@b＊「にゃ～ん……。\n@c1@"
"8":
  de: "@a@bKeine Reaktion.\nAus diesem Körper ist alles Leben längst entwichen.\n@c2@"
  en: "@a@bNo reply.\nItⓙs just a corpse.\n@c2@"
  es: "@a@bNo hay respuesta.\nEs un cadáver.\n@c2@"
  fr: "@a@bPas de réponse.\nCe n'est qu'un cadavre.\n@c2@"
  it: "@a@bNon risponde...\nÈ solo un cadavere.\n@c2@"
  ja: "@a@b返事がない。\nただの　しかばねのようだ……。\n@c2@"
"9":
  de: "@a@bDie skelettierte Hand umklammert immer noch einen Brief...\n@c2@"
  en: "@a@bBut a letter remains tightly clasped in one of its hands...\n@c2@"
  es: "@a@bEn una de sus manos sostiene firmemente una carta...\n@c2@"
  fr: "@a@bMais l'une de ses mains est refermée sur une lettre...\n@c2@"
  it: "@a@bTiene ancora stretta una lettera in pugno.\n@c2@"
  ja: "@a@bしかし　その手には\n手紙が　にぎりしめられている。\n@c2@"
"10":
  de: "@a@bⓞLieber Vater,\nbitte komm bald nach Hause.\nKarl und ich sind sehr einsam.\n㈡\nWir werden dich bald besuchen kommen.\nIn Liebe,\nLieslⓟ\n@c2@"
  en: "@a@bⓗDear Dad,\nPlease come home soon.\nJack and I are so lonely.\n㈡\nⓗWe'll both come to visit you soon.\nLove,\nJillⓘ\n@c2@"
  es: "@a@b''Querido papá,\nPor favor, vuelve pronto a casa.\nMarco y yo nos sentimos muy solos.''\n㈡\n''Pronto vendremos los dos a verte.\nCon cariño,\nHeidi''\n@c2@"
  fr: "@a@bⓥCher papa,\nReviens vite à la maison.\nJim et moi, on se sent seuls.\n㈡\nOn viendra bientôt te voir.\nGros bisous,\nJulieⓦ\n@c2@"
  it: "@a@bⓕCaro papà,\ntorna a casa presto.\nIo e Giulio ci sentiamo così soli.ⓖ\n㈡\nⓕVerremo presto a trovarti.\nTi abbracciamo con affetto,\nNeneⓖ\n@c2@"
  ja: "@a@bおとうさん　早く帰ってきてね。\n弟のピピンも　寂しがってるわ。\n今度　ふたりで会いに行きます……。\n@c2@"
"11":
  de: "@a@b%0%a00120 liest das Schild.\n@c0@"
