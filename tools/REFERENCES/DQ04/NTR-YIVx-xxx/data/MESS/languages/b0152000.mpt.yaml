"62":
  de: "@a@bDer Gefängniswärter ist im Stehen eingeschlafen.\n@c2@"
  en: "@a@bThe prison guard has managed to fall asleep standing up.\n@c2@"
  es: "@a@b¡El guardia del presidio se ha quedado dormido de pie!\n@c2@"
  fr: "@a@bLe gardien de prison a réussi à s'endormir debout.\n@c2@"
  it: "@a@bIl soldato di guardia alla prigione è riuscito nella non facile impresa di addormentarsi in piedi.\n@c2@"
  ja: "@a@b牢番は　立ったまま　器用に寝ている。\n@c2@"
"63":
  de: "@a@bAus dem Nichts spricht plötzlich eine Stimme %H860%Xzu %a00120%Yzur Gruppe%Z...\n@c0@"
  en: "@a@bOut of nowhere, %H860%X%a00120 hears%Ythe party hear%Z a voice...\n@c0@"
  es: "@a@bDe repente, %H860%X%a00120 escucha%Yel grupo escucha%Z una voz...\n@c0@"
  fr: "@a@b%H860%X%a00120%YL'équipe%Z entend une voix sortie de nulle part...\n@c0@"
  it: "@a@bAll'improvviso, %H860%X%a00120 ode%Yil gruppo ode%Z una voce...\n@c0@"
  ja: "@a@bどこからともなく　こえが　きこえる……。\n@c0@"
"64":
  de: "@a@b*: Ihr steht am Fuße der Treppe nach Zenithia. Doch allein %H860%X%A120%Xder Erkorene%Z%B120%Xdie Erkorene%Z darf%Ydie Erkorenen dürfen%Z ihre Stufen betreten...\n@c2@"
  en: "@a@b*: %H860%XThou standeth%YYou stand%Z at the foot of the Stairway to Zenithia. The Chosen alone may scale its steps...\n@c2@"
  es: "@a@b*: %H860%XPermanece%YPermaneced%Z al pie de la Escalera a Zenithia. Solo los Elegidos pueden ascender por sus peldaños...\n@c2@"
  fr: "@a@b*ⓢ Vous êtes au pied des Marches de Zénithia. Seul%A090%X l'Élu%Z%B090%Xe l'Élue%Z peut gravir ces marches...\n@c2@"
  it: "@a@b*: %H860%XTi trovi%YVi trovate%Z ai piedi della Scala per Zenithia. Solo i Prescelti possono salirne i gradini...\n@c2@"
  ja: "@a@b＊「ここは　天空の城。\n\t選ばれた者だけが\n\t入ることを許される……。\n@c2@"
"65":
  de: "@a@b*: Verschwindet nun, %H860%X%A120%Xunwürdiger Reisender%Z%B120%Xunwürdige Reisende%Z%Yunwürdige Reisende%Z!\n@c2@"
  en: "@a@b*: Leave now, unworthy %H860%Xtraveller%Ytravellers%Z!\n@c2@"
  es: "@a@b*: ¡%H860%XMárchate, %A120%Xviajero indigno%Z%B120%Xviajera indigna%Z%YMarchaos, %R000%Xviajeras indignas%Yviajeros indignos%Z%Z!\n@c2@"
  fr: "@a@b*ⓢ Alors partez, %H860%X%A120%Xvoyageur%Z%B120%Xvoyageuse%Z indigne%Y%R000%Xvoyageuses%Yvoyageurs%Z indignes%Z de ce privilègeⓠ\n@c2@"
  it: "@a@b*: %H860%XLascia questo luogo, viandante%YLasciate questo luogo, viandanti%Z!\n@c2@"
  ja: "@a@b＊「資格なき者よ\n\t立ち去るがよい！\n@c2@"
"66":
  de: "@aPsaro@bWartet!\n@c2@"
  en: "@aPsaro@bWait!\n@c2@"
  es: "@aPsaro@b¡%H860%XEspera%YEsperad%Z!\n@c2@"
  fr: "@aPsaro@bAttendezⓠ\n@c2@"
  it: "@aPsaro@b%H860%XAspetta%YAspettate%Z!\n@c2@"
  ja: "@a@bピサロ「待て！\n@c2@"
"67":
  de: "@aPsaro@bDie Leute halten mich immer noch für ein Monster.\nIch bin nicht willkommen in Zenithia.\n@c2@"
  en: "@aPsaro@bPeople still think of me as a monster.\nI wouldn't be welcome in Zenithia.\n@c2@"
  es: "@aPsaro@bLa gente aún piensa que soy un monstruo.\nNo seré bienvenido en Zenithia.\n@c2@"
  fr: "@aPsaro@bLes gens pensent toujours que je suis un monstre.\nJe ne serais pas le bienvenu à Zénithia.\n@c2@"
  it: "@aPsaro@bSono ancora tutti convinti che io sia un mostro... Non sarei il benvenuto a Zenithia.\n@c2@"
  ja: "@a@bピサロ「わたしは　仮にも\n\t魔族を束ねる者だ。　天空城に\n\t入ることはできない。\n@c2@"
"68":
  de: "@aPsaro@bIch warte im Wagen auf Euch.\n@c2@"
  en: "@aPsaro@bI'll wait for you in the wagon.\n@c2@"
  es: "@aPsaro@bOs esperaré aquí en el carromato.\n@c2@"
  fr: "@aPsaro@bJe vous attendrai dans le chariot.\n@c2@"
  it: "@aPsaro@b%H860%XTi%YVi%Z aspetterò nel carro.\n@c2@"
  ja: "@a@bピサロ「お前たちの馬車で\n\t待っていよう。\n@c2@"
"69":
  de: "@a@b*: Dies ist das imposante Schloss von Zenithia.\n@c2@"
  en: "@a@b*: Behold the mighty castle of Zenithia.\n@c2@"
  es: "@a@b*: He aquí el legendario castillo de Zenithia.\n@c2@"
  fr: "@a@b*ⓢ Voici le grand château de Zénithia.\n@c2@"
  it: "@a@b*: Questo è il mitico castello di Zenithia.\n@c2@"
  ja: "@a@b＊「ここは　天空城。\n@c2@"
"70":
  de: "@a@b*: Ihr befindet Euch im Reich des großen Drachengottes.\n@c2@"
  en: "@a@b*: You stand in the domain of the great Dragon God.\n@c2@"
  es: "@a@b*: %H860%XSe halla%YSe hallan%Z en los dominios del magnífico Dios Dragón.\n@c2@"
  fr: "@a@b*ⓢ Vous êtes dans le domaine du Dieu-dragon.\n@c2@"
  it: "@a@b*: %H860%XTi trovi%YVi trovate%Z nella terra del grande Drago Divino.\n@c2@"
  ja: "@a@b＊「ここは　竜の神さまが\n\tおさめているお城です。\n@c2@"
"71":
  de: "@a@b*: Oh! Viele Jahre sind ins Land gezogen, seit flügellose Freunde zuletzt die Wolken unseres Reiches betraten.\n@c1@"
  en: "@a@b*: Oh! Many years have passed since wingless friends did tread the clouds of our realm.\n@c1@"
  es: "@a@b*: ¡Oh! Incontables años han pasado desde que los últimos amigos no alados se aventuraron más allá de las nubes de nuestros dominios.\n@c1@"
  fr: "@a@b*ⓢ Ohⓠ Cela faisait bien des années que des êtres dépourvus d'ailes n'avaient pas foulé le sol de notre royaume.\n@c1@"
  it: "@a@b*: Oh! Molto tempo è trascorso dall'ultima volta che amici privi di ali erano giunti tra le nuvole del nostro regno...\n@c1@"
  ja: "@a@b＊「あら？　翼のない人が\n\t天空城にやってくるなんて\n\t何百年ぶりかしら……。\n@c1@"
"72":
  de: "@a@b*: Die Nachrichten, die uns von der Erde ereilen, stimmen uns besorgt. Es scheint, als stehe ein teuflischer Feind kurz vor der Wiedergeburt.\n@c2@"
  en: "@a@b*: The word from the earth below is of a terrible evil. A wicked foe about to be reborn.\n@c2@"
  es: "@a@b*: Llegan noticias de un terrible mal allá abajo en la tierra. Un maligno enemigo a punto de renacer.\n@c2@"
  fr: "@a@b*ⓢ Des rumeurs effrayantes viennent d'en bas.\nUn être maléfique serait sur le point de renaître.\n@c2@"
  it: "@a@b*: Giungono voci orribili dalla terra di sotto... Un essere malvagio sta per tornare in vita.\n@c2@"
  ja: "@a@b＊「地上では　とてつもなく邪悪な者が\n\t生まれようと　しているらしいな。\n@c2@"
"73":
  de: "@a@b*: Der jüngste Stoß war äußerst furchteinflößend. So stelle ich mir die Erdbeben vor, die ihr Menschen erleiden müsst...\n@c2@"
  en: "@a@b*: The recent tremor was most terrifying.\nSuch must be the earthquakes you humans suffer on the earth below.\n@c2@"
  es: "@a@b*: El reciente temblor ha sido aterrador.\nAsí deben de ser los terremotos que vosotros los humanos padecéis abajo en la tierra.\n@c2@"
  fr: "@a@b*ⓢ Ce dernier soubresaut a été vraiment terrifiant.\nC'est sans doute à cela que doivent ressembler les tremblements de terre qui agitent votre monde.\n@c2@"
  it: "@a@b*: La scossa di poco fa è stata terrificante. Immagino che fosse simile ai sismi che voi umani avvertite sulla terra.\n@c2@"
  ja: "@a@b＊「さっきの揺れは　すごかったな。\n\t地上でおこる地震ってのは　きっと\n\tさっきみたいな　感じなんだろうな。\n@c2@"
"74":
  de: "@a@b*: Diese Welle der Bosheit... Die Burg ist zwar unbeschadet, doch hat die Welle ein Loch in die Wolkendecke getrieben.\n@c2@"
  en: "@a@b*: But the wave of malice...\nThough the castle is unharmed, alack, it has pierced a hole in the clouds.\n@c2@"
  es: "@a@b*: Pero la onda de maldad...\nAunque por suerte el castillo no ha resultado dañado, ha abierto un agujero en las nubes.\n@c2@"
  fr: "@a@b*ⓢ Mais l'onde maléfique...\nLe château est intact, mais elle a percé un trou dans les nuages.\n@c2@"
  it: "@a@b*: Ma l'onda malefica, nonostante non abbia danneggiato il castello, ha creato, ahimè, uno squarcio tra le nuvole.\n@c2@"
  ja: "@a@b＊「しかし　あの邪悪な波動……。\n\t城には被害を　与えなかったけど\n\t雲に穴をあけたんだよ。\n@c2@"
"75":
  de: "@a@b*: Oh, diese Angst!\n@c1@"
  en: "@a@b*: Oh, but the fear!\n@c1@"
  es: "@a@b*: ¡Oh, pero el temor!\n@c1@"
  fr: "@a@b*ⓢ Quelle frayeurⓠ\n@c1@"
  it: "@a@b*: Oh, che paura!\n@c1@"
  ja: "@a@b＊「ああ　恐ろしい！\n@c1@"
"76":
  de: "@a@b*: Die Welle der Bosheit aus der Welt unter uns hat ein Loch in die Wolken gerissen.\n@c1@"
  en: "@a@b*: The wave of malice from the land below has pierced a hole in the clouds.\n@c1@"
  es: "@a@b*: La onda de maldad procedente de la tierra ha abierto un agujero en las nubes.\n@c1@"
  fr: "@a@b*ⓢ L'onde maléfique venue du monde d'en bas a percé un trou dans les nuages.\n@c1@"
  it: "@a@b*: L'onda malefica proveniente dalla terra di sotto ha aperto un varco tra le nuvole.\n@c1@"
  ja: "@a@b＊「ちょうど　この下の地上から\n\t邪悪な波動が　発せられ\n\t雲を　つらぬいていたのです。\n@c1@"
"77":
  de: "@a@b*: Sie hat diesen großen Riss im sanften Gewebe unserer Heimat verursacht.\n@c1@"
  en: "@a@b*: It was the cause of this gross tear in the soft fabric of our homeland.\n@c1@"
  es: "@a@b*: Esa fue la causa del tremendo desgarro que ha sufrido la suave estructura de nuestro hogar.\n@c1@"
  fr: "@a@b*ⓢ C'est ce qui a provoqué cette horrible déchirure dans la structure harmonieuse de notre pays.\n@c1@"
  it: "@a@b*: È stata l'onda a provocare quest'ampio squarcio nel soffice velo che ci sostiene.\n@c1@"
  ja: "@a@b＊「この大きな穴は　そのとき\n\tできたものですわ。\n@c1@"
"78":
  de: "@a@b*: Grrr...\n@c3@"
  en: "@a@b*: Grrr...\n@c3@"
  es: "@a@b*: Grrr...\n@c3@"
  fr: "@a@b*ⓢ Grrr...\n@c3@"
  it: "@a@b*: Grrr...\n@c3@"
  ja: "@a@b＊「グルルルー。\n@c3@"
"79":
  de: "@a@b*: In naher Zukunft werdet Ihr zu seltsamen Orten reisen.\n@c2@"
  en: "@a@b*: You will be travelling to strange places in the near future.\n@c2@"
  es: "@a@b*: %H860%XViajará%YViajarán%Z a extraños lugares en el futuro.\n@c2@"
  fr: "@a@b*ⓢ Dans un avenir proche, vous allez visiter des endroits étranges.\n@c2@"
  it: "@a@b*: Presto %H860%Xvisiterai%Yvisiterete%Z strani luoghi.\n@c2@"
  ja: "@a@b＊「お前さんたち\n\tこれから　大変なところに\n\t行くんだろう。\n@c2@"
"80":
  de: "@a@b*: Daher muss ich Euch fragen: Besitzt Ihr schon das Horn des Barons?\n@c2@"
  en: "@a@b*: So I must ask you.\nHave you already obtained the baron's bugle?\n@c2@"
  es: "@a@b*: Así que debo %H860%Xpreguntarle%Ypreguntarles%Z. ¿%H860%XDispone%YDisponen%Z ya del cuerno del barón?\n@c2@"
  fr: "@a@b*ⓢ Alors j'ai une question à vous poserⓢ avez-vous déjà récupéré le clairon du Baronⓡ\n@c2@"
  it: "@a@b*: Quindi %H860%Xti%Yvi%Z chiedo: %H860%Xhai%Yavete%Z già ottenuto la Tromba del barone?\n@c2@"
  ja: "@a@b＊「ところで　バロンの角笛を\n\tもう手に　いれなさったか？\n\tもし　まだだったら……\n@c2@"
"81":
  de: "@a@b*: Falls nicht, müsst Ihr es finden. Es heißt, dass es sich im Baronenschrein östlich des Azimuth befindet.\n@c2@"
  en: "@a@b*: If not, you must find it. It is said to reside in Baron's Folly, to the east of the Azimuth.\n@c2@"
  es: "@a@b*: En caso contrario %H860%Xdebe%Ydeben%Z encontrarlo. Se dice que se encuentra en el Capricho del Barón, al este de El Azimut.\n@c2@"
  fr: "@a@b*ⓢ Si ce n'est pas le cas, vous devez le trouver. D'après ce que j'ai entendu dire, il devrait être dans la Folie du Baron, à l'est de l'Azimut.\n@c2@"
  it: "@a@b*: Se la risposta è no, %H860%Xdevi%Ydovete%Z trovarla. Si dice che sia conservata nel Capriccio del Barone, il bizzarro edificio che si trova a est dell'Azimut.\n@c2@"
  ja: "@a@b＊「なんでもゴットサイドちゅう町の\n\t東のほこらに　ねむっとるって\n\tうわさだよ。\n@c2@"
"82":
  de: "@a@b*: Grrruuu...\n@c2@"
  en: "@a@b*: Grrrooo...\n@c2@"
  es: "@a@b*: Grrrooo...\n@c2@"
  fr: "@a@b*ⓢ Grrrooo...\n@c2@"
  it: "@a@b*: Grrrooo...\n@c2@"
  ja: "@a@b＊「グオーン　グオーン。\n@c2@"
"83":
  de: "@a@b*: Der Zenithdrache hat uns gesagt, dass die Barrieren, die Psaro der Metzler errichtete, nun niedergerissen wurden.\n@c1@"
  en: "@a@b*: The Zenith Dragon tells us that Psaro the Manslayer's barriers of protection have been rent asunder.\n@c1@"
  es: "@a@b*: El Dragón de Zenithia nos dijo que se habían roto las barreras de protección de Psaro el Carnicero.\n@c1@"
  fr: "@a@b*ⓢ Le Dragon du Zénith nous a dit que les barrières de protection de Psaro l'Exterminateur avaient été brisées.\n@c1@"
  it: "@a@b*: Il Drago di Zenithia ci ha comunicato che le barriere protettive di Psaro il Massacratore sono state abbattute.\n@c1@"
  ja: "@a@b＊「我らが　マスタードラゴンが\n\tおっしゃるには　デスピサロの張った\n\t地底の結界が　消滅したとか。\n@c1@"
"84":
  de: "@a@b*: Doch soll jetzt ein Anderer das Geheimnis der Evolution besitzen und es zu noch viel größerem Unheil missbrauchen.\n@c1@"
  en: "@a@b*: Yet another now possesses the Secret of Evolution, and doth use it for still more evil.\n@c1@"
  es: "@a@b*: Alguien más está ahora en posesión del Secreto de la Evolución y lo utiliza para causar un mal aún mayor.\n@c1@"
  fr: "@a@b*ⓢ Pourtant, un autre possède désormais le Secret de l'Évolution, et il s'en sert pour engendrer un mal encore plus grand.\n@c1@"
  it: "@a@b*: Ora un altro essere è entrato in possesso del Segreto dell'Evoluzione, e mira a servirsene per compiere atti malvagi.\n@c1@"
  ja: "@a@b＊「しかし　まだ何者かが　進化の秘法を\n\tもちいて　邪悪な進化をとげようと\n\tしているらしいのです。\n@c1@"
"85":
  de: "@a@b*: Ich flehe Euch an, %a00090... Befreit uns von diesem Teufelswerk und setzt der Bedrohung durch das Geheimnis der Evolution ein für alle Mal ein Ende.\n@c1@"
  en: "@a@b*: Prithee, %a00090... Rid us of this evil wight, and the menace of this Secret of Evolution.\n@c1@"
  es: "@a@b*: Se lo ruego, %a00090... Líbrenos de este maléfico ser y de la amenaza que supone ese Secreto de la Evolución.\n@c1@"
  fr: "@a@b*ⓢ Nous vous en prions, %a00090... Débarrassez-nous de cet être maléfique et de la menace de ce Secret de l'Évolution.\n@c1@"
  it: "@a@b*: Ti supplico, %a00090... Liberaci da questo essere nefasto e dalla minaccia del Segreto dell'Evoluzione che incombe sul mondo intero.\n@c1@"
  ja: "@a@b＊「勇者　%a00090よ……どうか\n\tその者の野望を　進化の秘法もろとも\n\t打ち砕いてください。\n@c1@"
"86":
  de: "@aOrifiela@bUnser Schicksal liegt nun in Euren Händen.\n@c1@"
  en: "@aOrifiela@bWe are all depending on you now.\n@c1@"
  es: "@aOrifiela@bAhora nuestro destino está en sus manos.\n@c1@"
  fr: "@aOrifiela@bNotre sort à tous dépend de vous.\n@c1@"
  it: "@aOrifiela@bOra il nostro destino è nelle %H860%Xtue%Yvostre%Z mani.\n@c1@"
  ja: "@a@bルーシア「あなたたちの　かつやくを\n\t期待していますわ！\n@c1@"
"87":
  de: "@a@b*: Es ist so weit!\n@c2@"
  en: "@a@b*: It has begun!\n@c2@"
  es: "@a@b*: ¡Ya ha comenzado!\n@c2@"
  fr: "@a@b*ⓢ Ça a commencéⓠ\n@c2@"
  it: "@a@b*: È iniziato!\n@c2@"
  ja: "@a@b＊「大変だ　大変だ！\n@c2@"
"88":
  de: "@a@b*: Eine große, bedrohliche Wolke verdunkelt langsam aber sicher die Welt!\n@c2@"
  en: "@a@b*: A wicked cloud doth begin to spread across the world below!\n@c2@"
  es: "@a@b*: ¡Una nube tenebrosa comienza a extenderse sobre el mundo inferior!\n@c2@"
  fr: "@a@b*ⓢ Un affreux nuage commence à recouvrir le monde d'en basⓠ\n@c2@"
  it: "@a@b*: Una nube maligna comincia ad avvolgere il mondo sottostante!\n@c2@"
  ja: "@a@b＊「まがまがしい雲が\n\t地上を　おおいはじめているぞ！\n@c2@"
"89":
  de: "@a@b*: Vor vielen, vielen Jahren stieg ein junger Engel von Zenithia hinab und verliebte sich in einen Menschen, einen Holzfäller.\n@c1@"
  en: "@a@b*: Many years ago, a young angel did descend from Zenithia and fell in love with a human woodcutter.\n@c1@"
  es: "@a@b*: Hace muchos años, un joven ángel descendió de Zenithia y se enamoró de un leñador humano.\n@c1@"
  fr: "@a@b*ⓢ Il y a de nombreuses années, un ange est descendu de Zénithia et elle est tombée amoureuse d'un bûcheron humain.\n@c1@"
  it: "@a@b*: Tanti anni fa, una donna angelo discese da Zenithia e si innamorò di un uomo, un taglialegna. I due si sposarono ed ebbero un bambino.\n@c1@"
  ja: "@a@b＊「その昔　地上に落ちて\n\t木こりの若者と\n\t恋をした　娘がおりました。\n@c1@"
"90":
  de: "@a@b*: Doch das göttliche Gesetz verbietet eine Beziehung zwischen Engeln und Menschen.\n@c1@"
  en: "@a@b*: But the divine law doth say that no angel and no human shall together be.\n@c1@"
  es: "@a@b*: Pero las leyes divinas dicen que los ángeles no pueden relacionarse con los humanos.\n@c1@"
  fr: "@a@b*ⓢ Mais la loi divine interdit à tout ange de vivre aux côtés d'un humain.\n@c1@"
  it: "@a@b*: Ma, secondo la legge divina, un angelo e un essere umano non possono stare insieme.\n@c1@"
  ja: "@a@b＊「しかし　天空人と人間は\n\t夫婦になれぬのが　さだめ。\n@c1@"
"91":
  de: "@a@b*: So wurde der Holzfäller vom Blitz erschlagen, und die untröstliche Engelsfrau wurde nach Zenithia zurückgebracht.\n@c1@"
  en: "@a@b*: The woodcutter was struck down by a bolt of lightning and the grief-stricken angel was returned to Zenithia.\n@c1@"
  es: "@a@b*: El leñador fue fulminado por un rayo, que le mató, y el ángel, abatida por el dolor, regresó a Zenithia.\n@c1@"
  fr: "@a@b*ⓢ Le bûcheron fut frappé par la foudre et l'ange, folle de chagrin, revint à Zénithia.\n@c1@"
  it: "@a@b*: Il taglialegna fu colpito da un fulmine, e la donna angelo, distrutta dal dolore provocatole dalla perdita dell'amato, fu riportata a Zenithia.\n@c1@"
  ja: "@a@b＊「木こりの若者は　雷にうたれ\n\t娘は　悲しみに　うちひしがれたまま\n\tこの城に　連れ戻されたのでした。\n@c1@"
"92":
  de: "@a@b*: Es ist ihr allerdings nie gelungen, das Kind zu vergessen, das sie auf der Erde zurücklassen musste.\n@c1@"
  en: "@a@b*: Woebegone, she could not put from her mind the memory of the child she was forced to leave behind.\n@c1@"
  es: "@a@b*: Rota por la pena, no podía dejar de pensar en %A090%Xel niño%Z%B090%Xla niña%Z que se vio obligada a abandonar.\n@c1@"
  fr: "@a@b*ⓢ Effondrée, elle ne put chasser de son esprit le souvenir de cet enfant qu'elle dut laisser sur terre.\n@c1@"
  it: "@a@b*: Da quell'istante in poi, l'angelo non fece altro che pensare al sangue del suo sangue, che era stata costretta ad abbandonare.\n@c1@"
  ja: "@a@b＊「しかし　娘はどんなときでも\n\t地上に残してきた　子どものことを\n\t忘れたことはありません。\n@c1@"
"93":
  de: "@a@b*: Wenn sie heute ihr Kind, %a00090, sehen könnte... Welche Macht wäre stark genug, ihre Tränen versiegen zu lassen...? (Schluchz)\n@c1@"
  en: "@a@b*: If today she were to see her %a00090 once more, what force could be powerful enough to stop her, her tears...? (sob sob)\n@c1@"
  es: "@a@b*: Si hoy pudiera ver a su %a00090 una vez más, ¿qué fuerza podría detener sus, sus lágrimas...? (snif, snif)\n@c1@"
  fr: "@a@b*ⓢ Si elle devait revoir %a00090 aujourd'hui, quelle force serait assez puissante pour l'empêcher de verser des larmes...ⓡ (snif, snif)\n@c1@"
