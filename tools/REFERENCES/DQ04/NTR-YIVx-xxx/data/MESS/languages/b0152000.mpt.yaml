"117":
  de: "@a@b*: ⓞVor vielen Monden förderte Estark, der Meister der Monster, etwas unglaublich Böses zu Tage: das Geheimnis der Evolution.\n@c1@"
  en: "@a@b*: ⓗMany moons ago, Estark, the Master of Monsterkind, unearthed a terrible evil: the Secret of Evolution.\n@c1@"
  es: "@a@b*: ''Hace muchas lunas, Estark, el Señor de los Monstruos, desenterró un terrible mal: el Secreto de la Evolución.''\n@c1@"
  fr: "@a@b*ⓢ ⓥIl y a de nombreuses lunes, Estark, le Maître des monstres, fit une découverte terribleⓢ le Secret de l'Évolution.\n@c1@"
  it: "@a@b*: ⓕMolte lune fa, Estark, il Signore della Mostruosità, scoprì un terribile male: il Segreto dell'Evoluzione.ⓖ\n@c1@"
  ja: "@a@b＊「はるか昔　魔族の王エスタークは\n\t恐ろしいものを　造りだした。\n\tそれは　進化の秘法。\n@c1@"
"118":
  de: "@a@b*: Mithilfe dieser teuflischen Macht verwandelte sich Estark in eine derart mächtige Kreatur, dass er selbst die Götter herausforderte.\n@c1@"
  en: "@a@b*: ⓗUsing this awesome power, Estark evolved into a creature so mighty that he would rival even the gods.\n@c1@"
  es: "@a@b*: ''Con este asombroso poder, Estark se convirtió en una criatura poderosísima, capaz de combatir a los propios dioses.''\n@c1@"
  fr: "@a@b*ⓢ Utilisant cette arme incroyable, Estark devint si puissant qu'il pouvait même rivaliser avec les dieux.\n@c1@"
  it: "@a@b*: ⓕServendosi di questo potere incredibile, Estark divenne una creatura talmente forte da riuscire a competere persino con le divinità.ⓖ\n@c1@"
  ja: "@a@b＊「エスタークは　そのチカラで\n\t自らを　神をも越える\n\t究極の生物に進化させた。\n@c1@"
"119":
  de: "@a@b*: Doch die Zenithianer waren sich Estarks Plänen bewusst und bekämpften ihn gemeinsam mit dem Zenithdrachen.\n@c1@"
  en: "@a@b*: ⓗBut the Zenithians were aware of Estark's designs and, alongside the Zenith Dragon, engaged him in battle.\n@c1@"
  es: "@a@b*: ''Pero los habitantes de Zenithia conocían los designios de Estark y, junto con el Dragón de Zenithia, se enfrentaron a él.''\n@c1@"
  fr: "@a@b*ⓢ Mais les Zénithiens avaient eu vent des plans d'Estark et l'affrontèrent aux côtés du Dragon du Zénith.\n@c1@"
  it: "@a@b*: ⓕMa gli abitanti di Zenithia erano a conoscenza dei piani di Estark, e decisero di allearsi con il Drago di Zenithia per combatterlo.ⓖ\n@c1@"
  ja: "@a@b＊「しかし　事態を知った天空人は\n\tマスタードラゴンとともに\n\tエスタークと戦った。\n@c1@"
"120":
  de: "@a@b*: Nach einem langen und blutigen Krieg wurde Estark schließlich weggesperrt, tief unter der Erde.\n@c1@"
  en: "@a@b*: ⓗAfter a long and bloody war, Estark was finally sealed away deep underground.\n@c1@"
  es: "@a@b*: ''Tras una larga y sangrienta guerra, Estark fue finalmente encerrado en las profundidades de la tierra.''\n@c1@"
  fr: "@a@b*ⓢ Après une guerre longue et sanglante, Estark fut finalement emprisonné au plus profond de la terre.\n@c1@"
  it: "@a@b*: ⓕDopo una guerra lunga e sanguinosa, Estark fu imprigionato nelle profondità della terra.ⓖ\n@c1@"
  ja: "@a@b＊「長い戦いの後\n\tついに　エスタークは\n\t地の底に　封じ込められた。\n@c1@"
"121":
  de: "@a@b*: Denn selbst der mächtige Zenithdrache war nicht stark genug, um Estark ganz zu vernichten.\n@c1@"
  en: "@a@b*: ⓗFor even the mighty Zenith Dragon was not powerful enough to completely destroy Estark.\n@c1@"
  es: "@a@b*: ''Porque ni siquiera el legendario Dragón de Zenithia era lo suficientemente poderoso como para acabar completamente con Estark.''\n@c1@"
  fr: "@a@b*ⓢ Car même la force du puissant Dragon du Zénith n'était pas suffisante pour éliminer définitivement Estark. \n@c1@"
  it: "@a@b*: ⓕTuttavia, nemmeno la potenza del grande Drago di Zenithia fu sufficiente per distruggere completamente Estark.ⓖ\n@c1@"
  ja: "@a@b＊「マスタードラゴンでさえも\n\tエスタークを　封じ込めるだけで\n\t消滅させることまでは　できなかった。\n@c1@"
"122":
  de: "@a@b*: Möge er niemals geweckt, möge er niemals wachgerüttelt werden.\n@c1@"
