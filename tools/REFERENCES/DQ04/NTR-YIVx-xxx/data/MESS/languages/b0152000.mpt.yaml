  it: "@a@b*: Zzz... \n@c1@"
  ja: "@a@b＊「すやすや……。\n@c1@"
"54":
  de: "@a@b*: Erst das ganze Geschwätz über diesen komischen Traum, und jetzt labern die Leut' dauernd über den Herrn der Unterwelt und seine Wiederauferstehung.\n@c2@"
  en: "@a@b*: First there was all that blether aboot that funny dream, an' noo folk are on aboot the Lord o' the Underworld reawakenin'.\n@c2@"
  es: "@a@b*: Primero fue toda esa algarabía con aquel extraño sueño y, ahora, hablan del despertar del Señor del Inframundo. \n@c2@"
  fr: "@a@b*ⓢ D'abord, il y a eu toutes ces sottises sur ce rêve bizarre et maintenant, tout le monde ne parle plus que du réveil du Seigneur des Enfers.\n@c2@"
  it: "@a@b*: Prima tutti erano preoccupati per quello strano sogno, e adesso non fanno altro che parlare del risveglio del Signore degli Inferi!\n@c2@"
  ja: "@a@b＊「奇妙な夢の話が　終わったら\n\t今度は地獄の帝王が\n\t復活するというウワサが……。\n@c2@"
"55":
  de: "@a@b*: Herrschaftszeiten! Werd ich denn nie meinen Frieden haben?!\n@c2@"
  en: "@a@b*: Mon, it feels like we're destined never tae hae another peaceful moment again!\n@c2@"
  es: "@a@b*: ¡Cielos, parece que estamos predestinados a no volver a tener otro momento de paz!\n@c2@"
  fr: "@a@b*ⓢ Eh bien, j'ai l'impression que la Déesse ne veut pas nous accorder de répitⓠ\n@c2@"
  it: "@a@b*: Accipicchia! Ma quand'è che torneremo ad avere un po' di tranquillità?\n@c2@"
  ja: "@a@b＊「いつになったら　安心して\n\t暮らせるのだろうか……。\n@c2@"
"56":
  de: "@a@b*: Ah geh, Herr Schulleiter.\n@c1@"
  en: "@a@b*: Dinnae fret there, Headmaster.\n@c1@"
  es: "@a@b*: No se enfade, señor profesor.\n@c1@"
  fr: "@a@b*ⓢ Ne vous en faites pas, Monsieur le Directeur.\n@c1@"
  it: "@a@b*: Non preoccuparti, direttore.\n@c1@"
  ja: "@a@b＊「まあまあ　校長先生。\n@c1@"
"57":
  de: "@a@b*: Wir machen alle mal schwere Zeiten durch.\nHab ich nicht Recht, %H860%X%A120%XReisender%Z%B120%XReisende%Z%YReisende%Z?\n@c1@"
  en: "@a@b*: Folk always hae tae face troubles like this, an' they always pull through.\nIsnae that right, %H860%Xtraveller%Ytravellers%Z?\n@c1@"
  es: "@a@b*: La gente siempre tiene que enfrentarse a problemas como estos y siempre sale adelante. ¿No es cierto, %H860%X%A120%Xviajero%Z%B120%Xviajera%Z%Y%R000%Xviajeras%Yviajeros%Z%Z?\n@c1@"
  fr: "@a@b*ⓢ Tout le monde est confronté à ce genre de problème, mais on s'en sort toujours, n'est-ce pas %H860%X%A120%Xvoyageur%Z%B120%Xvoyageuse%Z%Y%R000%Xvoyageuses%Yvoyageurs%Z%Zⓡ\n@c1@"
  it: "@a@b*: Ognuno di noi ha dei problemi. L'importante è riuscire a superarli. Non è così, %H860%Xviandante%Yviandanti%Z?\n@c1@"
  ja: "@a@b＊「いつの時代でも\n\t心配ごとは　つきぬものですわ。\n\tねえ　旅の人。\n@c1@"
"58":
  de: "@a@b*: Ich krieg langsam Kopfweh, so viele Leut' beschweren sich, dass sie diesen komischen Traum nimmer haben.\n@c1@"
  en: "@a@b*: I'm startin' tae get quite a headache from all the folk complainin' aboot not haein' that funny dream any more.\n@c1@"
  es: "@a@b*: Toda esa gente que protesta por no tener ese extraño sueño me está empezando a producir una insufrible migraña.\n@c1@"
  fr: "@a@b*ⓢ Ces gens vont me donner la migraine à force de se plaindre de ne plus faire ce fameux rêve.\n@c1@"
  it: "@a@b*: Tutti si lamentano perché non fanno più quello strano sogno. Mi stanno facendo venire il mal di testa!\n@c1@"
  ja: "@a@b＊「最近　夢が見られなくなったことで\n\t文句を言ってくる　お客さんに\n\t困っているのですが。\n@c1@"
"59":
  de: "@a@b*: Aber wenigstens hab ich jetzt meine Ruh und kann meinem kleinen Spatz beim Schlafen zuschauen.\n@c1@"
  en: "@a@b*: At least I get some peace an' quiet noo, watchin' ma lovely wee bairn sleepin'.\n@c1@"
  es: "@a@b*: En cualquier caso, así puedo disfrutar de algo de paz y sosiego viendo a mi pequeño dormir.\n@c1@"
  fr: "@a@b*ⓢ Mais au moins, j'ai la paix et je peux regarder mon petit dormir tranquillement.\n@c1@"
  it: "@a@b*: Almeno, però, ora c'è un po' di tranquillità, e posso godermi beata la vista di mio figlio che dorme.\n@c1@"
  ja: "@a@b＊「子どもの寝顔を見ていると\n\t嫌なことも　忘れられますわ。\n@c1@"
