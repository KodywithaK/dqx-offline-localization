  es: "@a@b*: ''Jamás deberá ser despertado.\nJamás deberá ser invocado.''\n@c1@"
  fr: "@a@b*ⓢ Il ne doit jamais être réveillé.\n@c1@"
  it: "@a@b*: ⓕNon dovrà mai essere destato. Non dovrà mai essere disturbato.ⓖ\n@c1@"
  ja: "@a@b＊「エスタークを　起こしてはならぬ。\n\t彼に　近づいてはならぬ。\n@c1@"
