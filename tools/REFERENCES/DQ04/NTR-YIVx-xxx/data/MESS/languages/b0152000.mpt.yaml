  it: "@a@b*: ⓕUno strumento del genere non può essere tramandato ai propri figli, e ai figli dei propri figli, ma dev'essere tenuto nascosto.ⓖ\n@c1@"
  ja: "@a@b＊「……と　書かれています。\n@c1@"
"124":
  de: "@a@b*: Erst viel später erfuhr man die ganze Wahrheit. Das von Estark genutzte Geheimnis der Evolution war unvollständig.\n@c1@"
  en: "@a@b*: It was only in hindsight that the truth was known. The Secret of Evolution used by Estark was incomplete.\n@c1@"
  es: "@a@b*: Solo después se conocería la verdad. El Secreto de la Evolución utilizado por Estark estaba incompleto.\n@c1@"
  fr: "@a@b*ⓢ Ce n'est qu'après coup que la vérité fut connue. Le Secret de l'Évolution tel qu'Estark l'avait utilisé n'était pas complet.\n@c1@"
  it: "@a@b*: Solo successivamente la verità venne alla luce. Il Segreto dell'Evoluzione usato da Estark non era completo...\n@c1@"
  ja: "@a@b＊「しかし　あとで分かったのですが\n\tエスタークの進化の秘法は\n\tまだ　不完全だったとか。\n@c1@"
"125":
  de: "@a@b*: Das Wandlungsarmband, das die dunklen Mächte zusätzlich verstärkt, wurde nie von Estark eingesetzt.\n@c1@"
  en: "@a@b*: The armlet of transmutation, needed to augment the dark powers necessary for the process, was never employed by Estark.\n@c1@"
  es: "@a@b*: Estark nunca empleó el brazalete de transmutación, imprescindible para aumentar los poderes de la oscuridad necesarios para el proceso.\n@c1@"
  fr: "@a@b*ⓢ Ce dernier n'avait pas utilisé le brassard étincelant, censé augmenter les pouvoirs maléfiques nécessaires au procédé.\n@c1@"
  it: "@a@b*: Estark non aveva utilizzato la Fascia crisalidea, necessaria per ampificare le forze oscure richieste per il processo.\n@c1@"
  ja: "@a@b＊「闇のチカラを増幅させる\n\t黄金の腕輪が　あのときは　まだ\n\t使われていなかったのです。\n@c1@"
"126":
  de: "@a@b*: Wie Ihr wünscht. Vielleicht ein anderes Mal...\n@c1@"
  en: "@a@b*: Very well. Perhaps at another time...\n@c1@"
  es: "@a@b*: Muy bien. Quizás en otro momento...\n@c1@"
  fr: "@a@b*ⓢ Bien. Peut-être une autre fois, alors...\n@c1@"
  it: "@a@b*: Non c'è problema. Sarà per un'altra volta...\n@c1@"
  ja: "@a@b＊「そうですか。　では　いずれまた……。\n@c1@"
"127":
  de: "@a@b*: Manche der Bücher auf den Regalen sind Euch nicht erlaubt.\n@c2@"
  en: "@a@b*: There are books on these shelves that you cannot read.\n@c2@"
  es: "@a@b*: Hay libros en estos estantes que no %H860%Xpuede%Ypueden%Z leer.\n@c2@"
  fr: "@a@b*ⓢ Il y a, sur ces étagères, des livres que vous ne pouvez pas feuilleter.\n@c2@"
  it: "@a@b*: Su questi scaffali ci sono dei volumi la cui lettura è vietata.\n@c2@"
  ja: "@a@b＊「ここにある本の中には　そなたらに\n\t読めぬものもあるだろう。\n@c2@"
"128":
  de: "@a@b*: Doch Ihr könnt einen der beiden dort bitten, Euch vorzulesen.\n@c2@"
  en: "@a@b*: You can ask one of those two to read them to you, though.\n@c2@"
  es: "@a@b*: No obstante, %H860%Xpuede%Ypueden%Z solicitar que %H860%Xle%Yles%Z sean leídos estos dos.\n@c2@"
  fr: "@a@b*ⓢ Vous pouvez toutefois demander à l'un de ces deux-là de les lire.\n@c2@"
  it: "@a@b*: È possibile, tuttavia, chiedere che qualcuno li legga.\n@c2@"
  ja: "@a@b＊「そこにいる　ふたりに\n\t読んでもらうといい。\n@c2@"
"129":
  de: "@a@b*: Ihr steht unserem Herrn und Meister, dem Zenithdrachen, gegenüber!\n@c2@"
  en: "@a@b*: You are in the presence of the Zenith Dragon, our lord and master!\n@c2@"
  es: "@a@b*: %H860%XSe encuentra%YSe encuentran%Z en presencia del Dragón de Zenithia, ¡nuestro señor y maestro!\n@c2@"
  fr: "@a@b*ⓢ Vous êtes devant le Dragon du Zénith, notre seigneur et maître.\n@c2@"
  it: "@a@b*: %H860%XTi trovi%YVi trovate%Z al cospetto del Drago di Zenithia, nostro signore e padrone!\n@c2@"
  ja: "@a@b＊「ここに　おわすのは　我らが王\n\tマスタードラゴンであられる！\n@c2@"
"130":
  de: "@a@b*: %0%a00090!? %A090%XDer, in dem%Z%B090%XDie, in der%Z sowohl menschliches als auch zenithianisches Blut fließt!\n@c2@"
  en: "@a@b*: %0%a00090!? %A090%XHe%Z%B090%XShe%Z who shares the blood of human and Zenithian alike!\n@c2@"
  es: "@a@b*: ¡¿%0%a00090!? ¡%A090%XÉl%Z%B090%XElla%Z por cuyas venas corre por igual sangre humana y de Zenithia!\n@c2@"
  fr: "@a@b*ⓢ %0%a00090ⓠⓑ\n%A090%XLe héros qui porte en lui%Z%B090%XL'héroïne qui porte en elle%Z du sang zénithien et du sang humainⓠ\n@c2@"
  it: "@a@b*: %0%a00090?! %A090%XColui%Z%B090%XColei%Z che ha nelle vene sangue umano e Zenithiano!?\n@c2@"
  ja: "@a@b＊「ほほう　%a00090が\n\tわれら天空人と　人間たちの\n\t血を引く　勇者であられるか！？\n@c2@"
"131":
  de: "@a@b*: Euer Wohlergehen hat dem Zenithdrachen stets am Herzen gelegen.\n@c2@"
  en: "@a@b*: Your well-being has always weighed heavy on the Zenith Dragon's mind.\n@c2@"
  es: "@a@b*: Vuestro bienestar siempre ha ocupado mucho tiempo en los pensamientos del Dragón de Zenithia.\n@c2@"
  fr: "@a@b*ⓢ Le Dragon du Zénith a toujours été très soucieux de votre bien-être.\n@c2@"
  it: "@a@b*: Il Drago di Zenithia ha sempre vegliato su di te.\n@c2@"
  ja: "@a@b＊「わが　マスタードラゴンは\n\tいつも　%a00090のことを\n\t気にかけて　おられたようだ。\n@c2@"
"132":
  de: "@aZenithdrache@bAus diesen himmlischen Höhen beobachte ich alles, was sich in der Welt zuträgt. Auch die Menschen unterstehen meinem wachsamen Auge.\n@c3@"
  en: "@aZenith Dragon@bFrom my lofty dominion here, I observe all that takes place below. All that afflicts the human world occurs under my watchful eye.\n@c3@"
  es: "@aDragón de Zenithia@bDesde mis dominios observo todo aquello que acontece en el mundo inferior. Todo lo que afecta a los humanos sucede bajo mi vigilante mirada.\n@c3@"
  fr: "@aDragon du Zénith@bDu haut de mon vaste domaine, j'observe tout ce qui se passe sur la terre. Rien de ce qui affecte le monde des hommes ne m'échappe.\n@c3@"
  it: "@aDrago di Zenithia@bDa quassù osservo ogni cosa e vigilo su ciò che accade nel mondo di sotto. Nulla di ciò che avviene sulle terre degli umani sfugge al mio occhio infallibile!\n@c3@"
  ja: "@a@bマスタードラゴン「居ながらにして\n\tここより　世に起こる　すべての事を\n\t知ることのできる私だ。\n@c3@"
"133":
  de: "@aZenithdrache@bIch wurde Zeuge Eurer Heldentaten.\n@c3@"
  en: "@aZenith Dragon@bYour deeds I have witnessed also.\n@c3@"
  es: "@aDragón de Zenithia@bTambién he sido testigo de %H860%Xtus%Yvuestras%Z hazañas.\n@c3@"
  fr: "@aDragon du Zénith@bJ'ai également assisté à vos actions.\n@c3@"
  it: "@aDrago di Zenithia@bHo anche visto le gesta che %H860%Xhai%Yavete%Z compiuto.\n@c3@"
  ja: "@a@bマスタードラゴン「お前たちのした事も\n\t当然　知っている……。\n@c3@"
"134":
  de: "@aZenithdrache@bAber seid Euch bewusst, dass wir nicht vor dem Bösen geschützt sind, solange das Geheimnis der Evolution in unserer Welt weilt.\n@c3@"
  en: "@aZenith Dragon@bBut know this! There is no lee from evil while the Secret of Evolution remains in the world.\nNot for any of us.\n@c3@"
  es: "@aDragón de Zenithia@b¡Pero ahora esto! El mal no concederá tregua alguna mientras el Secreto de la Evolución permanezca en el mundo. Al menos, a ninguno de nosotros.\n@c3@"
  fr: "@aDragon du Zénith@bMais sachez-leⓠ Rien ne saurait être protégé du mal tant que le Secret de l'Évolution restera dans le monde. Rien ni personne.\n@c3@"
  it: "@aDrago di Zenithia@bMa %H860%Xricorda%Yricordate%Z una cosa! Non v'è modo di annientare il male, fino a quando il Segreto dell'Evoluzione rimarrà al mondo. Nessuno di noi può fare nulla!\n@c3@"
  ja: "@a@bマスタードラゴン「だが　進化の秘法が\n\tあるかぎり　世界に真の安らぎが\n\tおとずれることは　ないだろう。\n@c3@"
"135":
  de: "@aZenithdrache@bNutzt das Zenithiaschwert, %a00090! Und verbannt das Geheimnis der Evolution ein für alle Mal aus dieser Welt!\n@c3@"
  en: "@aZenith Dragon@bUse the Zenithian Sword, %a00090!\nBanish the Secret of Evolution once and for all!\n@c3@"
  es: "@aDragón de Zenithia@b¡Utiliza la Espada de Zenithia, %a00090!\n¡Acaba con el Secreto de la Evolución de una vez para siempre!\n@c3@"
  fr: "@aDragon du Zénith@bServez-vous de l'Épée zénithienne, %a00090ⓠ\nFaites disparaître le Secret de l'Évolution une fois pour toutesⓠ\n@c3@"
  it: "@aDrago di Zenithia@bUsa la Spada Zenithiana, %a00090! Distruggi il Segreto dell'Evoluzione, una volta e per tutte!\n@c3@"
  ja: "@a@bマスタードラゴン「%a00090よ！\n\tその天空のつるぎで　進化の秘法を\n\tこの世から　ほうむりさるのだ！\n@c3@"
