"0":
  de: "@a@b*: Willkommen in Auenfelde!\n@c2@"
  en: "@a@b*: Welcome tae Strathbaile!\n@c2@"
  es: "@a@b*: %H860%X%A120%XSea bienvenido%Z%B120%XSea bienvenida%Z%Y%R000%XSean bienvenidas%YSean bienvenidos%Z%Z a Candonga.\n@c2@"
  fr: "@a@b*ⓢ Bienvenue à Strattbourgⓠ\n@c2@"
  it: "@a@b*: Salve! Questa è Bellavalle!\n@c2@"
  ja: "@a@b＊「イムルの村に　ようこそ！\n@c2@"
"1":
  de: "@a@b*: Bis vor Kurzem hatten die Leut' hier seltsame Träume, aber das hat jetzt aufgehört.\n@c2@"
  en: "@a@b*: Folk were haein' really weird dreams here until a wee while back, but that's all stopped noo.\n@c2@"
  es: "@a@b*: La gente tenía sueños realmente extraños aquí hasta hace poco, pero todo eso ya ha acabado.\n@c2@"
  fr: "@a@b*ⓢ Jusqu'à tout récemment, les gens faisaient des rêves vraiment bizarres. Mais cela s'est arrêté, à présent.\n@c2@"
  it: "@a@b*: Fino a una settimana fa, la gente qui faceva dei sogni davvero strani. Ora, però, questa stramberia non si verifica più.\n@c2@"
  ja: "@a@b＊「少し前まで　この村では\n\tおかしな夢が　見られたのですが\n\tそれも　過去の話。\n@c2@"
"2":
  de: "@a@b*: Obwohl wir immer noch nicht wissen, was da eigentlich los war.\n@c2@"
  en: "@a@b*: We still dinnae ken whit it was all aboot, though.\n@c2@"
  es: "@a@b*: No obstante, aún desconocemos la causa de tan extraño suceso.\n@c2@"
  fr: "@a@b*ⓢ N'empêche, nous ne savons toujours pas de quoi il s'agissait.\n@c2@"
  it: "@a@b*: E non siamo ancora riusciti a capire il perché di quei sogni bizzarri!\n@c2@"
  ja: "@a@b＊「今となっては\n\tあれは　なんだったのかと\n\t首を　かしげるばかりです。\n@c2@"
"3":
  de: "@a@b*: In der Herberge gegenüber geht's drunter und drüber. Schon erstaunlich, wie neugierig die Leut' manchmal sein können.\n@c2@"
  en: "@a@b*: Och, the inn opposite is in real trouble.\nIt's amazin' hoo many folk there are in the world wi' so much curiosity in 'em.\n@c2@"
  es: "@a@b*: ¡Cáspita! La posada que está frente a nosotros tiene problemas. Es sorprendente que haya gente en el mundo con tal grado de curiosidad.\n@c2@"
  fr: "@a@b*ⓢ L'auberge d'en face a de sacrés ennuis.\nC'est incroyable le nombre de gens dans le monde qui sont aussi curieux.\n@c2@"
  it: "@a@b*: Nella locanda qui di fronte c'è un viavai incredibile! È proprio vero che la curiosità della gente non ha limiti... \n@c2@"
  ja: "@a@b＊「向かいの宿屋も　災難だよな。\n\tまったく　世の中には\n\t物好きな客が　いるもんだぜ。\n@c2@"
"4":
  de: "@a@b*: Ich bin hier, um meinen Bub abzuholen. Hoffentlich sind sie bald fertig.\n@c1@"
  en: "@a@b*: I'm here tae collect ma wee bairn.\nHopefully they should be done afore long.\n@c1@"
  es: "@a@b*: He venido a recoger a mi pequeñín.\nEspero que terminen pronto.\n@c1@"
  fr: "@a@b*ⓢ Je suis venue chercher mon petit garçon.\nLes enfants ne devraient pas tarder à sortir de l'école.\n@c1@"
  it: "@a@b*: Sono qui per prendere mio figlio. Credo che finiranno tra poco.\n@c1@"
  ja: "@a@b＊「子どもを　むかえに来たんです。\n\tもうそろそろ　終わりかしら……。\n@c1@"
"5":
  de: "@a@b*: Das ist die Schule. Wir sind gerade mitten im Unterricht.\n@c2@"
  en: "@a@b*: This is the toon school.\nWe're in the middle of a class the noo.\n@c2@"
  es: "@a@b*: Esta es la escuela de la ciudad.\nAhora estamos en mitad de clase.\n@c2@"
  fr: "@a@b*ⓢ C'est l'école de la ville.\nIl y a cours en ce moment.\n@c2@"
  it: "@a@b*: Questa è la scuola del villaggio. In questo momento stanno facendo lezione.\n@c2@"
  ja: "@a@b＊「ここは　学校です。\n\t今は　まだ　授業中ですよ。\n@c2@"
"6":
  de: "@a@b*: Was wohl aus dem Mann geworden ist, der im Gefängnis gesessen hat...\n@c1@"
  en: "@a@b*: I wonder whit's become o' that chap who was doon in the jail afore.\n@c1@"
  es: "@a@b*: Me pregunto qué habrá sido de ese caballero que estaba en prisión.\n@c1@"
  fr: "@a@b*ⓢ Je m'demande ce qu'est devenu le monsieur qu'était en prison.\n@c1@"
  it: "@a@b*: Chissà cosa sarà successo a quel tizio che prima era in carcere... \n@c1@"
  ja: "@a@b＊「地下の牢屋にいた　おじちゃん\n\t今ごろ　どうしてるかなあ……。\n@c1@"
"7":
  de: "@a@b*: Wenn das nicht der gute alte Ragnar ist! Ich bin froh, dass es dir gut geht!\n@c3@"
  en: "@a@b*: Well, if it isnae Ragnar McRyan! Whit a pleasure it is tae see ye lookin' so fightin' fit!\n@c3@"
  es: "@a@b*: ¡Vaya, que me aspen si no es Ragnar McRyan! ¡Qué gran placer verle en tan buena forma para el combate!\n@c3@"
  fr: "@a@b*ⓢ Mais c'est Ragnar McRyanⓠ\nÇa fait plaisir de vous revoir en pleine formeⓠ\n@c3@"
  it: "@a@b*: Oh, guarda chi c'è! Galiardo de' Guglielmi! Che piacere vederti così in forma!\n@c3@"
  ja: "@a@b＊「やや　ライアンでは　ないか！\n\t元気そうで　なにより！\n@c3@"
"8":
  de: "@a@b*: Hast lang nichts von dir hören lassen. König Burkhard hat schon angefangen, sich Sorgen zu machen.\n@c3@"
  en: "@a@b*: There was no news o' ye for a wee while.\nKing Burnard was startin' tae fret aboot yer wellbein'.\n@c3@"
  es: "@a@b*: No tuvimos noticias de usted durante algún tiempo.\nEl rey Recaredo empezaba a preocuparse por su bienestar.\n@c3@"
  fr: "@a@b*ⓢ On n'a pas eu de nouvelles de vous pendant un certain temps. Le roi Bastien commençait à se demander comment vous alliez.\n@c3@"
  it: "@a@b*: Era da un pezzo che non avevamo notizie di te. Persino Re Basilio si stava chiedendo cosa ti fosse capitato.\n@c3@"
  ja: "@a@b＊「しばらく　おとさたがないので\n\t王さまも心配しておられたぞ。\n@c3@"
"9":
  de: "@a@b*: Ihr seid Freunde von Ragnar?\n@c3@"
  en: "@a@b*: Pals o' Ragnar, are youse?\n@c3@"
  es: "@a@b*: %H860%XUna amistad%YAmistades%Z de Ragnar, ¿no es cierto?\n@c3@"
  fr: "@a@b*ⓢ Vous êtes %H860%X%A120%Xun ami%Z%B120%Xune amie%Z%Y%R000%Xdes amies%Ydes amis%Z%Z de Ragnarⓡ\n@c3@"
  it: "@a@b*: Voi siete amici di Galiardo?\n@c3@"
  ja: "@a@b＊「なんと　そなたたちは\n\tライアンのお仲間でござるか！？\n@c3@"
"10":
  de: "@a@b*: Dann sagt ihm doch, dass er mal in der Burg vorbeischauen soll, wenn's recht ist.\n@c3@"
  en: "@a@b*: Then maybe youse could tell him tae drop in on the castle every once in a while, eh?\n@c3@"
  es: "@a@b*: Entonces, quizá %H860%Xpueda%Ypuedan%Z decirle que se pase por el castillo de vez en cuando, ¿de acuerdo?\n@c3@"
  fr: "@a@b*ⓢ Dans ce cas, vous pourriez lui dire de passer au château de temps en temps.\n@c3@"
  it: "@a@b*: Allora ditegli di farsi vedere al castello ogni tanto, eh?\n@c3@"
  ja: "@a@b＊「では　ライアンに伝えてくだされ。\n\tたまには　お城にもどるようにと。\n@c3@"
"11":
  de: "@a@b*: Das hübsche junge Mädel, das allen im Traum erschienen ist, drüben in der Herberge, ist wohl fort.\n@c2@"
  en: "@a@b*: The dream folk were haein' at the inn o' that lovely wee lassie doesnae seem tae be happenin' no more.\n@c2@"
  es: "@a@b*: Parece que la gente que duerme en la posada ya no tiene ese sueño en el que aparecía esa encantadora muchacha.\n@c2@"
  fr: "@a@b*ⓢ Apparemment, les gens qui séjournent à l'auberge ne rêvent plus de cette jolie fille.\n@c2@"
  it: "@a@b*: A quanto pare, le persone che soggiornavano nella locanda non sognano più quella giovane fanciulla.\n@c2@"
  ja: "@a@b＊「宿屋に泊まると　見られた\n\tべっぴんさんの夢が\n\t見られなくなったそうじゃな。\n@c2@"
"12":
  de: "@a@b*: Hätt ich doch auch mal dort übernachtet, dann hätt ich's mit eigenen Augen gesehen.\n@c2@"
  en: "@a@b*: Och, I wish I'd stayed there once an' seen it for maself.\n@c2@"
  es: "@a@b*: ¡Recórcholis! Me hubiera gustado haberme hospedado una vez en ella para haberlo visto con mis propios ojos.\n@c2@"
  fr: "@a@b*ⓢ Quel dommage, j'aurais bien aimé y dormir une fois pour voir ça.\n@c2@"
  it: "@a@b*: Oh, quanto avrei voluto fare anch'io quel sogno...\n@c2@"
  ja: "@a@b＊「こんなことなら　一度泊まって\n\t見ておくんじゃった……。\n@c2@"
"13":
  de: "@a@b*: Aber so ist das immer mit mir. Ich trauere im Leben immer nur den Sachen hinterher, die ich versäumt hab.\n@c2@"
  en: "@a@b*: It's always the way wi' me, though. Ma life's full of regrets for all the things I didnae do.\n@c2@"
  es: "@a@b*: En cualquier caso, siempre me ocurre lo mismo. Mi vida está llena de reproches por todo lo que nunca hice.\n@c2@"
  fr: "@a@b*ⓢ Mais c'est toujours comme ça que ça se passe.\nMa vie est pleine de regrets pour toutes les choses que je n'ai pas faites.\n@c2@"
  it: "@a@b*: D'altra parte, è sempre stato così... Nella mia vita ho sempre avuto rimpianti per tutte le esperienze che non ho vissuto! \n@c2@"
  ja: "@a@b＊「はぁ～あ。　わしの人生\n\tいつも　やらなかったことを\n\t後で　後悔するばっかりじゃ。\n@c2@"
"14":
  de: "@a@b*: Ach, was bin ich bloß für 'n komischer Kauz!\n@c2@"
  en: "@a@b*: Losh! Whit a galoot I am, eh?\n@c2@"
  es: "@a@b*: ¡Cielos! Menudo bobo estoy hecho, ¿no es cierto?\n@c2@"
  fr: "@a@b*ⓢ Pfffⓠ Quel idiot je fais, heinⓡ\n@c2@"
  it: "@a@b*: Sono proprio un fallito!\n@c2@"
  ja: "@a@b＊「わしのバカ　バカ　バカ……。\n@c2@"
"15":
  de: "@a@b*: Ich mache meinem Kind was zu essen.\n@c2@"
  en: "@a@b*: I'm makin' a snack for ma wee bairn.\n@c2@"
  es: "@a@b*: Estoy preparando un bocado para mi pequeño.\n@c2@"
  fr: "@a@b*ⓢ Je prépare à manger pour mon petit.\n@c2@"
  it: "@a@b*: Sto preparando uno spuntino per mio figlio.\n@c2@"
  ja: "@a@b＊「今　子どものために\n\tおやつを作ってるところなんだよ。\n@c2@"
"16":
  de: "@a@b*: In Zeiten wie diesen ist es wirklich schön, Mutter zu sein.\n@c2@"
  en: "@a@b*: Och, it's a real joy bein' a mother at times like this.\n@c2@"
  es: "@a@b*: ¡Vaya! Es una auténtica alegría ser madre en momentos como este.\n@c2@"
  fr: "@a@b*ⓢ C'est tellement agréable d'être une mère, maintenant que tout est redevenu normal.\n@c2@"
  it: "@a@b*: Certo, le preoccupazioni non mancano, ma essere madre dà anche tante belle soddisfazioni!\n@c2@"
  ja: "@a@b＊「こういう時って　なんだか無性に\n\t母親のよろこびってのを\n\t感じちまうんだよね。\n@c2@"
"17":
  de: "@a@b*: Nä, nä, nä, nä, nä, ne!\nDu kriegst mich nicht, du kriegst mich nicht!\n@c1@"
  en: "@a@b*: Na na na na naaah!\nYe cannae catch me, ye cannae catch me!\n@c1@"
  es: "@a@b*: ¡Chincha rabiña!\n¡A que no me pillas!\n@c1@"
  fr: "@a@b*ⓢ Na na na na nère-euhⓠ\nTu m'attraperas pasⓠ Tu m'attraperas pasⓠ\n@c1@"
  it: "@a@b*: Na na na na naa!\nNon mi prendi!\nNon mi prendi!\n@c1@"
  ja: "@a@b＊「やだよ～だ！\n\t絶対　つかまんないからね！\n@c1@"
"18":
  de: "@a@b*: Warte! So warte doch! Verflixt! Kann denn keiner das Mädel zur Vernunft bringen?!\n@c1@"
  en: "@a@b*: Wait! Didnae I tell ye tae wait, child! Jings! Will somebody catch that wee brat for me!?\n@c1@"
  es: "@a@b*: ¡Espere! ¡Espere un momento, haga el favor! ¡Demonios! ¡¿Es que no puede alguien hacer que esta muchacha se esté quieta?!\n@c1@"
  fr: "@a@b*ⓢ Attendsⓠ Arrête-toi, tu veuxⓠⓑ\nPar la Déesse, personne ne peut donc empêcher cette gamine de faire des bêtisesⓠⓑ\n@c1@"
  it: "@a@b*: Ferma! Fermati!\nAccidenti! Chi mi aiuta a prendere quella piccola peste?!\n@c1@"
  ja: "@a@b＊「お待ちなさい　待ちなさいったら！\n\tああ　もうっ！　誰か\n\tその子を　つかまえてくださいな。\n@c1@"
"19":
  de: "@a@b*: Der da vorne dreht sich ständig um und lenkt mich ab. Ich kann gar nicht arbeiten.\n@c1@"
  en: "@a@b*: The kid in front keeps turnin' roond an' distractin' me. I cannae get any work done.\n@c1@"
  es: "@a@b*: El niño de delante sigue dando vueltas y distrayéndome. Resulta imposible trabajar así.\n@c1@"
  fr: "@a@b*ⓢ Celui qui est devant moi arrête pas de se retourner. J'arrive pas à me concentrer.\n@c1@"
  it: "@a@b*: Il bambino davanti a me continua a muoversi, e io mi distraggo! Non riesco a fare niente!\n@c1@"
  ja: "@a@b＊「前の子が　すぐに　ふり向くから\n\tぜんぜん　勉強できないや！\n@c1@"
"20":
  de: "@a@b*: Kämpft Ihr auch gegen Monster und so? Das ist ja toll!\n@c1@"
  en: "@a@b*: D'ye gae after monsters an' fight them an' everythin'? That's brilliant!\n@c1@"
  es: "@a@b*: ¿%H860%XVa%YVan%Z tras los monstruos y se %H860%Xenfrenta%Yenfrentan%Z a ellos y todo eso? ¡Maravilloso!\n@c1@"
  fr: "@a@b*ⓢ Vous poursuivez les monstres et vous vous battez contre euxⓡ C'est génialⓠ\n@c1@"
  it: "@a@b*: Ma %H860%Xtu combatti%Yvoi combattete%Z contro i mostri? Che forza!\n@c1@"
  ja: "@a@b＊「ねえ　魔物たちを退治してるの？\n\tかっこいいなあ！\n@c1@"
"21":
  de: "@a@b*: Wenn ich groß bin, werd ich ein Monsⓚⓛ\nAch, Schmarr'n, ich werd natürlich Palastwächter!\n@c1@"
  en: "@a@b*: When I grow up, I'm gonna be a monⓚⓛ\nNo, that's not right. I'm gonna be a palace guard!\n@c1@"
  es: "@a@b*: Cuando crezca, seré un mons...\nNo, eso no está bien. ¡Seré un guardia de palacio!\n@c1@"
  fr: "@a@b*ⓢ Quand je serai grand, je serai un mon...\nNan, c'est pas ça... Je serai un garde du palaisⓠ\n@c1@"
  it: "@a@b*: Da grande voglio fare il mostro! Anzi, ho cambiato idea. Voglio essere una guardia di palazzo.\n@c1@"
  ja: "@a@b＊「ぼくも大きくなったら　魔物に……\n\tじゃなかった！\n\tお城の戦士に　なるんだ！\n@c1@"
"22":
  de: "@a@b*: Peterchen von der Herberge hat gesagt, er kann fliegen! Das will ich auch!\n@c1@"
  en: "@a@b*: Guess what!? Willy Wally from the inn says he's been flyin' in the sky! I wish I could do that.\n@c1@"
  es: "@a@b*: ¡¿%H860%XSabes%YSabéis%Z qué?! ¡Pelayo de la posada dice que ha volado por el cielo! Ojalá pudiera hacerlo yo también.\n@c1@"
  fr: "@a@b*ⓢ Vous savez quoiⓠⓑ Hugues Esclin, le garçon de l'auberge, il dit qu'il a volé dans le cielⓠ\nJ'aimerais bien, moi aussi.\n@c1@"
  it: "@a@b*: Lo %H860%Xsai%Ysapete%Z? Giacomino, il figlio del gestore della locanda, dice di esser volato su in cielo! Anch'io voglio farlo!\n@c1@"
  ja: "@a@b＊「知ってる？　宿屋のププルは\n\t空を飛んだこと　あるんだよ！\n\tぼくも　飛びたかったなあ。\n@c1@"
"23":
  de: "@aPeterchen@bIch heiß Peterchen.\n@c1@"
  en: "@aWilly Wally@bMa name's Willy Wally.\n@c1@"
  es: "@aPelayo@bMe llamo Pelayo.\n@c1@"
  fr: "@aHugues Esclin@bJe m'appelle Hugues Esclin.\n@c1@"
  it: "@aGiacomino@bIo sono Giacomino.\n@c1@"
  ja: "@a@bププル「ぼく　ププル。\n@c1@"
"24":
  de: "@aPeterchen@bDie Leut' hatten in letzter Zeit ganz komische Träume, wenn sie in der Herberge abgestiegen sind, in der ich leb.\n@c1@"
  en: "@aWilly Wally@bFolk were havin' these weird dreams when they stayed at the inn where I live in lately.\n@c1@"
  es: "@aPelayo@bLa gente tenía esos sueños extraños cuando pernoctaba en la posada en la que solía vivir.\n@c1@"
  fr: "@aHugues Esclin@bIl n'y a pas longtemps, les gens qui venaient à l'auberge de mes parents faisaient de drôles de rêves.\n@c1@"
  it: "@aGiacomino@bQualche tempo fa, le persone che dormivano nella locanda dove vivo facevano tutte lo stesso sogno.\n@c1@"
  ja: "@a@bププル「ぼくんちの宿屋に泊まると\n\tおかしな夢が　見られたんだけど\n\t今はもう　見られないんだ。\n@c1@"
"25":
  de: "@aPeterchen@bAber damit ist es jetzt vorbei. Hoffentlich seid Ihr nicht extra deswegen hergekommen.\n@c1@"
  en: "@aWilly Wally@bBut it doesnae happen no longer, so I hope ye've no made a special journey or nothin'.\n@c1@"
  es: "@aPelayo@bPero, esto ha dejado de suceder... Espero que no %H860%Xhaya%Yhayan%Z venido de lejos por este motivo.\n@c1@"
  fr: "@aHugues Esclin@bMais ça n'arrive plus, alors j'espère que vous n'étiez pas %H860%X%A120%Xvenu%Z%B120%Xvenue%Z%Y%R000%Xvenues%Yvenus%Z%Z exprès.\n@c1@"
  it: "@aGiacomino@bOra questa cosa non succede più. Spero che %H860%Xtu non abbia%Yvoi non abbiate%Z fatto il viaggio apposta per il sogno comune!\n@c1@"
  ja: "@a@bププル「もし　あの夢を\n\t見るために　来たんだったら\n\t残念だったね。\n@c1@"
"26":
  de: "@a@b*: Es ist so gemein, dass so was Tolles immer nur dem Peterchen passiert!\n@c1@"
  en: "@a@b*: Hoo come all the excitin' stuff only ever happens tae Willy Wally? It's no fair.\n@c1@"
  es: "@a@b*: ¿Cómo es posible que Pelayo siempre viva aventuras tan sumamente emocionantes? ¡No es justo!\n@c1@"
  fr: "@a@b*ⓢ Pourquoi les trucs sympas n'arrivent qu'à Hugues Esclinⓡ C'est pas juste.\n@c1@"
  it: "@a@b*: Ma perché tutte le cose più divertenti capitano sempre e solo a Giacomino? Non è giusto!\n@c1@"
  ja: "@a@b＊「どうして　ププルばかりに\n\t面白いことが起きるんだろ？\n\tいいなあ……。\n@c1@"
"27":
  de: "@a@b*: Ich wäre Euch sehr verbunden, wenn Ihr nicht weiter den Unterricht stört. Die Kinderchen lassen sich so leicht ablenken.\n@c2@"
  en: "@a@b*: If ye could try not tae disturb oor class, I'd be much obliged. The wee kiddies are easily distracted.\n@c2@"
  es: "@a@b*: Si %H860%Xpudiera%Ypudieran%Z dejar de interrumpir tanto la clase, estaría muy agradecido. Los pequeños se distraen fácilmente.\n@c2@"
  fr: "@a@b*ⓢ Si vous pouviez éviter de déranger la classe, je vous en serais reconnaissant. Les petits sont faciles à distraire.\n@c2@"
  it: "@a@b*: Per favore, non %H860%Xdisturbare%Ydisturbate%Z la lezione. %H860%XSai com'è%YSapete com'è%Z, i bambini si distraggono facilmente.\n@c2@"
  ja: "@a@b＊「授業のジャマを　せぬように！\n\t子供たちが\n\tよろこんでしまうではありませんか。\n@c2@"
"28":
  de: "@a@b%0%a00120 untersucht die Wand.\n@c0@"
  en: "@a@b%0%a00120 examines the wall.\n@c0@"
  es: "@a@b%0%a00120 examina la pared.\n@c0@"
  fr: "@a@b%0%a00120 inspecte le mur.\n@c0@"
  it: "@a@b%0%a00120 esamina il muro.\n@c0@"
  ja: "@a@b%a00120は　カベを　調べた！\n@c0@"
"29":
  de: "@a@bDa hängen Bilder, die von den Kindern gemalt wurden.\n@c0@"
  en: "@a@bThere are pictures drawn by the children hanging\non it.\n@c0@"
  es: "@a@bHay dibujos hechos por los niños.\n@c0@"
  fr: "@a@bDes dessins faits par les enfants y sont accrochés.\n@c0@"
  it: "@a@bSulla parete ci sono dei disegni fatti dai bambini.\n@c0@"
  ja: "@a@bカベには子供たちの絵が\nかけられている。\n@c0@"
"30":
  de: "@a@b*: Hier ist's für 'ne Weile ganz ruhig gewesen, als die Leut' aufgehört haben, diesen komischen Traum zu träumen.\n@c2@"
  en: "@a@b*: It was peaceful for a wee while, when people stopped haein' that funny dream.\n@c2@"
  es: "@a@b*: Las cosas estuvieron en calma durante cierto tiempo, cuando la gente dejó de tener ese extraño sueño.\n@c2@"
  fr: "@a@b*ⓢ Nous avons eu un court moment de répit lorsque les gens ont arrêté de faire ce rêve.\n@c2@"
  it: "@a@b*: La situazione si era calmata un po', dopo che le persone avevano smesso di fare lo stesso sogno.\n@c2@"
  ja: "@a@b＊「ようやく　あの奇妙な夢を\n\t見ないようになって\n\t本当に　安心していたんです。\n@c2@"
"31":
  de: "@a@b*: Aber jetzt kommen sie her, um mal zu gucken, was es mit der ganzen Sach' auf sich hat, und dann meckern sie, weil's nimmer passiert!\n@c2@"
  en: "@a@b*: But noo folk are comin' here especially tae see what it's all aboot, an' lambastin' me 'cause it doesnae happen no more!\n@c2@"
  es: "@a@b*: Pero viene gente nueva para investigar sobre el tema... Y la toman conmigo porque ya no sucede.\n@c2@"
  fr: "@a@b*ⓢ Mais maintenant, tout le monde vient ici pour voir de quoi il retourne et ils s'en prennent à moi quand je leur dis qu'il ne se passe plus rien.\n@c2@"
  it: "@a@b*: Ma ora la gente viene qui per sapere cosa sia successo, e tutti se la prendono con me perché quello strano fenomeno non accade più!\n@c2@"
  ja: "@a@b＊「そしたら　今度は\n\tその夢を見にきたっていう\n\tお客さんに　なじられて……。\n@c2@"
"32":
  de: "@a@b*: Also ehrlich! Dieser blöde Traum hat uns hier 'nen ziemlichen Ärger eingebrockt.\n@c2@"
  en: "@a@b*: Losh! That dream has caused all sorts o' stramash here.\n@c2@"
  es: "@a@b*: ¡Maldición! Ese sueño no ha traído más que problemas.\n@c2@"
  fr: "@a@b*ⓢ Bon sangⓠ Ce rêve aura vraiment causé toutes sortes d'ennuis dans le coin.\n@c2@"
  it: "@a@b*: Diamine! Quel sogno ha creato un bel po' di scompiglio!\n@c2@"
  ja: "@a@b＊「ああ　もう\n\tあの夢のおかげで　さんざんです！\n@c2@"
"33":
  de: "@a@b*: Ich bin extra hergekommen, um auch diesen komischen Traum zu haben, von dem die Leute reden.\n@c2@"
  en: "@a@b*: I came here especially so I could hae that funny dream folk were talkin' aboot.\n@c2@"
  es: "@a@b*: Vine aquí exclusivamente para poder tener ese sueño bizarro que andaba en boca de todos.\n@c2@"
  fr: "@a@b*ⓢ Je suis venu ici exprès pour faire ce drôle de rêve dont tout le monde parlait.\n@c2@"
  it: "@a@b*: Ero venuto qui per sognare la cosa di cui tutti parlavano...\n@c2@"
  ja: "@a@b＊「この宿屋で　不思議な夢が\n\t見られると聞いて\n\tわざわざ　やって来たのに……！\n@c2@"
"34":
  de: "@a@b*: Aber ich hab gar nix gesehen, und jetzt werd ich wohl auch nicht mehr die Gelegenheit dazu haben. Bin halt 'n echter Glückspilz!\n@c2@"
  en: "@a@b*: But I didnae see a thing, an' noo it sounds like I willnae get another chance. Just ma luck!\n@c2@"
  es: "@a@b*: Pero no he visto nada y, por lo que oigo, no voy a tener oportunidad de hacerlo. ¡Vaya suerte!\n@c2@"
  fr: "@a@b*ⓢ Mais il ne s'est rien passé du tout, et apparemment, je n'ai plus aucune chance que ça arrive. C'est bien ma veineⓠ\n@c2@"
  it: "@a@b*: Ma non ho fatto nessun sogno, e pare che quello strano fenomeno non si ripeterà più. Che sfortuna!\n@c2@"
  ja: "@a@b＊「わしが　泊まってみたら\n\tもう　その夢が　見られないとは\n\tなにごとじゃっ！　プンプン！\n@c2@"
"35":
  de: "@a@b*: Bis vor Kurzem hatte jeder, der hier übernachtete, 'nen ganz komischen Traum.\n@c2@"
  en: "@a@b*: Until just recently, everyone who stayed the night here had funny dreams.\n@c2@"
  es: "@a@b*: Hasta hace bien poco, todo el que pernoctaba aquí tenía extraños sueños.\n@c2@"
  fr: "@a@b*ⓢ Jusqu'à il y a peu de temps, tous les gens qui passaient la nuit ici faisaient un rêve bizarre.\n@c2@"
  it: "@a@b*: Fino a poco fa, tutte le persone che pernottavano qui facevano lo stesso sogno.\n@c2@"
  ja: "@a@b＊「こん間まで　この宿屋に\n\t泊まった客は　み～んな\n\t同じ夢を　見とったとよ。\n@c2@"
"36":
  de: "@a@b*: Aber damit ist's jetzt wohl vorbei.\n@c2@"
  en: "@a@b*: It doesnae seem tae be happenin' no more, though.\n@c2@"
  es: "@a@b*: Pero parece que esto ya no sucede.\n@c2@"
  fr: "@a@b*ⓢ Mais il semblerait que ça n'arrive plus.\n@c2@"
  it: "@a@b*: Ora, però, sembra che questa stranezza non si ripeta più.\n@c2@"
  ja: "@a@b＊「それが　いつの間にか\n\t夢を見なくなって……。\n@c2@"
"37":
  de: "@a@b*: Und es kann sich auch keiner mehr dran erinnern, worum's in dem Traum überhaupt ging!\n@c2@"
  en: "@a@b*: Come tae think of it, no one can actually seem tae remember whit the dream was aboot anyhoo.\n@c2@"
  es: "@a@b*: Y... ahora que lo pienso, aparentemente, nadie parece poder recordar el tema de dicho sueño, por algún extraño motivo.\n@c2@"
  fr: "@a@b*ⓢ En plus, personne ne réussit à se souvenir de ce qui se passait dans ce rêve. \n@c2@"
  it: "@a@b*: Inoltre, nessuno ricorda niente di quel sogno. Che cosa stramba, eh?\n@c2@"
  ja: "@a@b＊「気がついたら　だ～れも\n\t夢の内容を　はっきりと\n\t思い出せなくなったんばい。\n@c2@"
"38":
  de: "@a@b*: Miau.\n@c1@"
  en: "@a@b*: Meow.\n@c1@"
  es: "@a@b*: Miau.\n@c1@"
  fr: "@a@b*ⓢ Miaou.\n@c1@"
  it: "@a@b*: Miao.\n@c1@"
  ja: "@a@b＊「にゃ～ん。\n@c1@"
"39":
  de: "@a@b*: Das Gefängnis ist leer, seit dieser Alfons vor einiger Zeit hier war.\n@c2@"
  en: "@a@b*: We havnae used this jail since that fella Angus was here a while back noo.\n@c2@"
  es: "@a@b*: No hemos hecho uso de este presidio desde que ese tal Angustio estuvo aquí hace algún tiempo.\n@c2@"
  fr: "@a@b*ⓢ La prison n'a pas servi depuis bien longtemps. La dernière fois, c'était pour ce fameux Angus.\n@c2@"
  it: "@a@b*: La prigione è vuota da quando Attilio è stato rilasciato.\n@c2@"
  ja: "@a@b＊「だいぶ前に　アレクスとかいうヤツが\n\tぶち込まれたのを最後に　ここの牢屋は\n\tしばらく　使われていないんだ。\n@c2@"
"40":
  de: "@a@b*: Friedlich war's, doch dann ist ein Monster mit ganz vielen Beinen aufgetaucht, das immer unser Essen raubt.\n@c2@"
  en: "@a@b*: Ye cannae beat it when itⓙs peaceful.\nBut lately thereⓙs this strange monster wiⓙ lots oⓙ legs cominⓙ anⓙ chegginⓙ oor food.\n@c2@"
  es: "@a@b*: Lo mejor es que reine la paz,\npero últimamente está ese extraño monstruo con muchas patas que viene y nos roba la comida.\n@c2@"
  fr: "@a@b*ⓢ J'aime bien quand tout est calme. Quoique, ces derniers temps, il y a un monstre bizarre avec plein de pattes qui vient piquer notre nourriture.\n@c2@"
  it: "@a@b*: Di solito questa zona è tranquilla, ma negli ultimi tempi un mostro con un mucchio di zampe ha cominciato a rubarci il cibo.\n@c2@"
  ja: "@a@b＊「平和で　なによりだが　最近\n\t足のたくさんある　妙なバケモノが\n\t盗み食いをするって　通報があってな。\n@c2@"
"41":
  de: "@a@b*: Ich hab versucht, es zu erwischen, aber mit seinen vielen wuseligen Beinen war es zu schnell für mich.\n@c2@"
  en: "@a@b*: I tried ma best tae catch the thing, but wiⓙ that many legs, I just cannae keep up.\n@c2@"
  es: "@a@b*: He hecho lo imposible por atrapar a esa cosa, pero con tantas patas soy incapaz de alcanzarlo.\n@c2@"
  fr: "@a@b*ⓢ J'ai fait tout ce que j'ai pu pour attraper ce truc, mais vu le nombre de pattes qu'il a, je ne fais pas le poids.\n@c2@"
  it: "@a@b*: Ho provato a catturare quella strana bestia, ma non riesco a raggiungerla. Ha troppe zampe!\n@c2@"
  ja: "@a@b＊「とっつかまえてやろうとしたが\n\tなかなか　逃げ足の速いヤツでよ。\n\tいつもギリギリで　逃げられるんだ。\n@c2@"
"42":
  de: "@a@b*: Die Leut' sagen, dass es in der königlichen Schatzkammer von Burland einst einen ziemlich kostbaren Schild gegeben hat.\n@c3@"
  en: "@a@b*: Folk say the Burland royal treasure collection once included a verra expensive shield.\n@c3@"
  es: "@a@b*: Dicen que la colección del tesoro real de Burlandia incluía, en tiempos, un escudo de gran valor.\n@c3@"
  fr: "@a@b*ⓢ Il paraît que, dans le temps, il y avait un bouclier inestimable dans le trésor royal de Bastione.\n@c3@"
  it: "@a@b*: Un tempo c'era un prezioso scudo nella collezione di tesori del regno di Burlandia.\n@c3@"
  ja: "@a@b＊「なんでも　バトランド王家には\n\tすごく高価な盾が\n\t伝わっているそうだぜ。\n@c3@"
"43":
  de: "@a@b*: Ich weiß allerdings nicht, ob er noch dort ist.\n@c3@"
  en: "@a@b*: I dinnae ken if they still hae it or no, though.\n@c3@"
  es: "@a@b*: No obstante, desconozco si sigue estando o no allí.\n@c3@"
  fr: "@a@b*ⓢ Je ne sais pas s'il y est encore.\n@c3@"
  it: "@a@b*: Ora, però, non so se quell'oggetto ne faccia ancora parte.\n@c3@"
  ja: "@a@b＊「今でも　あるのかどうかは\n\t知らないけどな。\n@c3@"
"44":
  de: "@a@b*: Hick! Gibt doch nix Besseres als 'n kleines Schlückchen, wenn man zu den Sternen hochsieht.\n@c2@"
  en: "@a@b*: Hic! Ye cannae beat a wee dram while ye're lookin' up at the stars.\n@c2@"
  es: "@a@b*: ¡Hip! No hay nada como una copita para acompañarte mientras miras las estrellas.\n@c2@"
  fr: "@a@b*ⓢ Hicⓠ Rien ne vaut une bonne rasade en contemplant les étoiles.\n@c2@"
  it: "@a@b*: Hic! Non sh'è niente di meglio che un goshetto di quello buono mentre guardi le shtelle!\n@c2@"
  ja: "@a@b＊「ぐびぐび　ぷはー。\n\t星を見ながら　飲む酒は\n\t最高ですな。\n@c2@"
"45":
  de: "@a@b*: Das ist schon recht merkwürdig, dass sich jetzt keiner mehr an den Traum erinnern kann.\n@c3@"
  en: "@a@b*: Jings! 'Tis powerful strange that not a single soul can remember a thing aboot that dream.\n@c3@"
  es: "@a@b*: ¡Demonios! Es tremendamente extraño que nadie sea capaz de recordar nada de ese sueño.\n@c3@"
  fr: "@a@b*ⓢ Mince alorsⓠ C'est drôlement bizarre que pas une seule personne n'arrive à se souvenir de ce rêve.\n@c3@"
  it: "@a@b*: Accidenti! È strano che nessuno ricordi nulla di quel sogno...\n@c3@"
  ja: "@a@b＊「ふーむ……。　誰ひとり\n\t夢の内容を　思い出せないとは\n\t奇妙なこともあるものだな。\n@c3@"
"46":
  de: "@a@b*: Vor einiger Zeit hat sich mein Bruder ganz schön in die Nesseln gesetzt, aber es scheint ihm nicht viel ausgemacht zu haben.\n@c1@"
  en: "@a@b*: Ma brother got himself intae a right pickle a wee while back, but it doesnae seem tae hae bothered him one little bit.\n@c1@"
  es: "@a@b*: Mi propio hermano se metió en un lío hace algún tiempo, pero no parece haberle preocupado ni un ápice.\n@c1@"
  fr: "@a@b*ⓢ Mon frère s'est retrouvé dans un sacré pétrin il n'y a pas longtemps, mais visiblement, ça l'a pas dérangé.\n@c1@"
  it: "@a@b*: Un po' di tempo fa mio fratello si è ficcato in un bel pasticcio, ma sembra che la cosa non gli sia affatto servita da lezione.\n@c1@"
  ja: "@a@b＊「ウチのお兄ちゃん　前に\n\tひどい目にあったのに\n\tちっとも　こりてないみたいなの。\n@c1@"
"47":
  de: "@a@b*: Bald wird er bestimmt schon wieder mit Peterchen spielen.\n@c1@"
  en: "@a@b*: I'm sure he'd gae off playin' wi' that Willy Wally again without a second thought.\n@c1@"
  es: "@a@b*: Seguro que se iría a jugar con ese Pelayo otra vez sin dudarlo.\n@c1@"
  fr: "@a@b*ⓢ Je suis sûre qu'il retournerait jouer avec Hugues Esclin sans hésiter une seconde.\n@c1@"
  it: "@a@b*: Sono certa che tornerebbe a giocare con Giacomino anche subito, e senza pensarci su due volte!\n@c1@"
  ja: "@a@b＊「きっと　また　ププルと\n\t外に　遊びに行く気なんだわ。\n@c1@"
"48":
  de: "@a@b*: ... und da würd ich so gern mitspielen...\n@c1@"
  en: "@a@b*: ...I just wish they'd let me gae along sometimes, too.\n@c1@"
  es: "@a@b*: ... Ojalá me dejaran acompañarles alguna vez.\n@c1@"
  fr: "@a@b*ⓢ ... Et j'aimerais bien qu'ils me laissent venir aussi, des fois.\n@c1@"
  it: "@a@b*: Oh, quanto vorrei che mi lasciassero andare con loro qualche volta!\n@c1@"
  ja: "@a@b＊「……たまには　あたしとも\n\t遊んでくれないかな。\n@c1@"
"49":
  de: "@a@b*: Ha-püh...\n@c2@"
  en: "@a@b*: Ah-phew...\n@c2@"
  es: "@a@b*: Ah, fiuu...\n@c2@"
  fr: "@a@b*ⓢ Ron-pfff...\n@c2@"
  it: "@a@b*: Ronfff!\n@c2@"
  ja: "@a@b＊「ぐうぐう……。\n@c2@"
"50":
  de: "@a@b*: Hm, welche Höhle soll ich denn heut erkunden...?\n@c1@"
  en: "@a@b*: Right then, which cave shall I gae explorin' today...?\n@c1@"
  es: "@a@b*: Bien, bien. ¿Qué cueva exploraré hoy...?\n@c1@"
  fr: "@a@b*ⓢ Bon, quelle grotte je vais explorer aujourd'hui...ⓡ\n@c1@"
  it: "@a@b*: Bene, quale grotta posso esplorare oggi?\n@c1@"
  ja: "@a@b＊「今度は　どこの洞くつを\n\t探検しようかなあ……。\n@c1@"
"51":
  de: "@a@b*: Ich frag mal das Peterchen, dem fällt bestimmt was ein.\n@c1@"
  en: "@a@b*: I'd better ask Willy Wally if he's got any ideas.\n@c1@"
  es: "@a@b*: Será mejor preguntarle a Pelayo a ver si él tiene alguna idea.\n@c1@"
  fr: "@a@b*ⓢ Je vais demander à Hugues Esclin. Il a peut-être une idée...\n@c1@"
  it: "@a@b*: Lo chiederò a Giacomino. Magari lui può darmi qualche suggerimento.\n@c1@"
  ja: "@a@b＊「ププルと　相談しなくちゃ！\n@c1@"
