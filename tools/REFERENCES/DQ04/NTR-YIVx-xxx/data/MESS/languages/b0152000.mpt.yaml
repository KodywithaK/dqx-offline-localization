"108":
  de: "@a@b*: ⓞDas Geheimnis der Evolution ist ein okkulter Mechanismus, durch den der normale Verlauf der Evolution beeinträchtigt wird.\n@c2@"
  en: "@a@b*: ⓗThe Secret of Evolution is an occult mechanism to corrupt the normal course of evolution.\n@c2@"
  es: "@a@b*: ''El Secreto de la Evolución es un mecanismo oculto que posibilita alterar el curso normal de la evolución.''\n@c2@"
  fr: "@a@b*ⓢ ⓥLe Secret de l'Évolution est un procédé occulte permettant de modifier le cours normal de l'Évolution.\n@c2@"
  it: "@a@b*: ⓕIl Segreto dell'Evoluzione è un meccanismo occulto che permette di alterare il normale corso evolutivo.ⓖ\n@c2@"
  ja: "@a@b＊「この秘法を使えば\n\tこの世にあらざるべき　生き物を\n\t生み出すことができるであろう。\n@c2@"
"109":
  de: "@a@b*: Durch Anwendung dieses Mechanismus können Kreaturen entstehen, die nie für unsere Welt vorgesehen waren.\n@c2@"
  en: "@a@b*: ⓗWhen this mechanism is used, creatures may be born that were never intended to appear in our world.\n@c2@"
  es: "@a@b*: ''Cuando se hace uso de este mecanismo, es posible que nazcan criaturas que jamás hubieran estado destinadas a habitar nuestro mundo.''\n@c2@"
  fr: "@a@b*ⓢ Avec ce procédé, des créatures qui n'ont rien à faire dans notre monde peuvent être amenées à voir le jour.\n@c2@"
  it: "@a@b*: ⓕQuando tale meccanismo viene utilizzato, è possibile dar vita a creature che altrimenti non sarebbero mai comparse su questo mondo.ⓖ\n@c2@"
  ja: "@a@b＊「進化の秘法は\n\tすべての災いの元なり。\n@c2@"
"110":
  de: "@a@b*: Das Geheimnis der Evolution ist das Übel allen Übels.\n@c2@"
  en: "@a@b*: ⓗThe Secret of Evolution is the evil of all evils.\n@c2@"
  es: "@a@b*: ''El Secreto de la Evolución es el peor de todos los males.''\n@c2@"
  fr: "@a@b*ⓢ Le Secret de l'Évolution est le mal suprême.\n@c2@"
  it: "@a@b*: ⓕIl Segreto dell'Evoluzione è il peggiore tra tutti i mali che siano mai esistiti.ⓖ\n@c2@"
  ja: "@a@b＊「進化の秘法を　のちの世に\n\t伝えてはならぬ。\n\t地底ふかくに　封じこめよ……。\n@c2@"
"111":
  de: "@a@b*: Solch eine gefährliche Macht darf unseren Kindern und Kindeskindern nicht zugänglich sein. Sie gehört weggesperrt...ⓟ\n@c2@"
  en: "@a@b*: ⓗSuch potency cannot be inherited by our children and children's children. It must be sealed away...ⓘ\n@c2@"
  es: "@a@b*: ''Tal poder no debe ser heredado por nuestros hijos ni los hijos de nuestros hijos.\nDebe permanecer sellado...''\n@c2@"
  fr: "@a@b*ⓢ Une telle puissance ne doit pas être laissée en héritage à nos enfants et aux enfants de nos enfants.\n㈡\n*ⓢ Il faut la faire disparaître...ⓦ\n@c2@"
  it: "@a@b*: ⓕUno strumento del genere non può essere tramandato ai propri figli, e ai figli dei propri figli, ma dev'essere tenuto nascosto.ⓖ\n@c2@"
  ja: "@a@b＊「……と　書かれています。\n@c2@"
"112":
  de: "@a@b*: Und doch wurde dieses Geheimnis nach so vielen Jahren wieder entdeckt.\n@c2@"
  en: "@a@b*: And yet, after many years, it was discovered again.\n@c2@"
  es: "@a@b*: Pero transcurridos muchos años, ha sido descubierto de nuevo.\n@c2@"
  fr: "@a@b*ⓢ Et pourtant, de nombreuses années après, elle a été redécouverte.\n@c2@"
  it: "@a@b*: Tuttavia, dopo molti anni, esso è tornato alla luce...\n@c2@"
  ja: "@a@b＊「しかし　永い年月のすえ\n\t再び　発見されてしまったのです。\n@c2@"
"113":
  de: "@a@b*: Vielleicht ist ja das Böse, das sich durch Estarks Experimente in die Evolution einschlich, dafür verantwortlich, dass das Geheimnis jetzt auftaucht.\n@c2@"
  en: "@a@b*: Perhaps it was the evil streak introduced by Estark's meddling in evolution that caused it to surface once again.\n@c2@"
  es: "@a@b*: Quizás fuera el elemento maligno que introdujo la aparición de Estark lo que hizo que saliera de nuevo a la superficie.\n@c2@"
  fr: "@a@b*ⓢ Peut-être est-ce l'aura maléfique générée par les manipulations d'Estark sur l'Évolution qui a entraîné sa réapparitionⓡ\n@c2@"
  it: "@a@b*: Probabilmente, la sua ricomparsa è dovuta al diabolico intervento di Estark, che ha modificato le leggi naturali dell'evoluzione.\n@c2@"
  ja: "@a@b＊「進化の道すじから　はずされた\n\t生き物たちの怨念が\n\tそうさせたのかも知れませんね。\n@c2@"
