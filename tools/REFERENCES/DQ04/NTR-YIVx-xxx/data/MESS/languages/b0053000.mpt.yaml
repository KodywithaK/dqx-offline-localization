"26":
  de: "@a@b*: Der Mann, gegen den Ihr gekämpft habt, war mein Sohn... Nun ja, er hat seine Seele an eine teuflische Macht verkauft.\n㈡\n*: Er spricht jetzt sogar mit einem seltsamen Akzent.\n@c2@"
  en: "@a@b*: The man you just fought is my son, but, well... He's bargained away his soul to a terrible force of evil.\n㈡\n*: He even speaks strangely now.\n@c2@"
  es: "@a@b*: El hombre al que os habéis enfrentado es mi hijo, bueno, en realidad... Ha vendido su alma a las terribles fuerzas del mal.\n㈡\n*: Incluso ahora habla raro.\n@c2@"
  fr: "@a@b*ⓢ L'homme que vous avez combattu est mon fils, mais... il a vendu son âme à un monstre.\nIl parle même bizarrement maintenant.\n@c2@"
  it: "@a@b*: L'uomo con cui %H860%Xhai%Yavete%Z appena combattuto è mio figlio, ma... Ha ceduto l'anima a una forza terribile e malvagia.\n㈡\n*: Parla persino in maniera strana adesso.\n@c2@"
  ja: "@a@b＊「お前たちが　戦った相手は\n\tわしの息子じゃ……。　しかし　やつめ\n\t悪魔に　魂を　ゆずりわたし……。\n@c2@"
"27":
  de: "@a@b*: Ihr könnt ihn jetzt noch nicht bezwingen. Ihr seid noch nicht mächtig genug. Verlasst dieses Land, solange Ihr noch könnt, und baut Eure Kraft auf.\n@c2@"
