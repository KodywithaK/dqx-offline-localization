  ja: "@a@b＊「私には　何も見えないし\n\t何も聞こえては　いない……。\n@c2@"
"25":
  de: "@a@b*: Ähem... Ich bin der ehemalige König dieses Landes. Mein Volk... Ähem!... glaubt, ich sei tot.\n@c2@"
  en: "@a@b*: Ahem...\nI am the former king of this land. My people ⓚⓛ Ahem! ⓚⓛ all believe that I'm dead.\n@c2@"
  es: "@a@b*: Ejem...\nSoy el antiguo rey de esta tierra. Mi pueblo, ¡ejem! todos creen que he muerto.\n@c2@"
  fr: "@a@b*ⓢ Hum... Je suis l'ancien roi de ce pays.\nMes sujets ⓚ humⓠ ⓚ pensent tous que je suis mort.\n@c2@"
  it: "@a@b*: Ahem...\nIo sono l'ex Re di questa terra. La mia gente... Ahem! Ecco, tutti credono che io sia morto.\n@c2@"
