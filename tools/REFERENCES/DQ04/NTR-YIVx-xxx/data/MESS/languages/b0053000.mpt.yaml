  fr: "@aDickenz@bVotre père était an idiotⓠ\nIl ne savait même pas ce qu'il avait découvert.\nLe Secret of Évolutionⓠ\n@c2@"
  it: "@aBalzack@b%L000%XVostro%YTuo%Z padre era un imbécile! Non ha nemmeno capito quale immensa scoperta avesse fatto... Il Segreto dell'evoluzione!\n@c2@"
  ja: "@a@bバルザック「お前たちの父　エドガンは\n\t偶然に発見した　進化の秘法を\n\t何を思ったか　闇に葬ろうとしたのだ。\n@c2@"
"12":
