"6":
  de: "@a@b*: Sacré bleu! Wer %H860%Xbist du%Yseid ihr%Z?! Und was %H860%Xmachst du%Ymacht ihr%Z in der chambre privée des Marquis Régent Balzack?!\n@c2@"
