"24":
  de: "@a@b*: Hmm. Isch kann nischts Ungewöhnlisches erkennen. Und isch 'öre auch nischts Ungewöhnlisches...\n@c2@"
  en: "@a@b*: Hmm... I do not see anything out of ze ordinary. And I do not 'ear anything out of ze ordinary...\n@c2@"
  es: "@a@b*: Mmm... No veo nada gragro ni oigo nada gragro...\n@c2@"
  fr: "@a@b*ⓢ Mmm... Je ne vois rien qui sorte de l'ordinary.\nEt je n'entends nothing spécial non plus...\n@c2@"
