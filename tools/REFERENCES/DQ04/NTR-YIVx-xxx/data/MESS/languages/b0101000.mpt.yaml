"51":
  de: "@a@b*: Die Leut' drüben in Auenfelde haben komische Träume in letzter Zeit.\n@c3@"
  en: "@a@b*: Folk over in Strathbaile are haein' funny dreams just lately.\n@c3@"
  es: "@a@b*: Últimamente, las gentes de Candonga tienen extraños sueños.\n@c3@"
  fr: "@a@b*ⓢ Les habitants de Strattbourg font des rêves bizarres ces derniers temps.\n@c3@"
  it: "@a@b*: Gli abitanti di Bellavalle stanno facendo degli strani sogni negli ultimi tempi.\n@c3@"
  ja: "@a@b＊「最近　イムルの村では\n\tおかしな夢が　見られるそうだ。\n@c3@"
"52":
