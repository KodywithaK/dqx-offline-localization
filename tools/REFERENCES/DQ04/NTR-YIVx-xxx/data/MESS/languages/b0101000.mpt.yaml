  es: "@a@b*: Me pregunto en qué estará pensando el rey Jarturo para lanzar tan extraordinario llamamiento.\n@c1@"
  fr: "@a@b*ⓢ Je me demande ce qui lui est passé par la tête quand le roi Larfour a lancé cet étrange appel.\n@c1@"
