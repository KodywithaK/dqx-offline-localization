  fr: "@a@b*ⓢ Agnès commençait à se ronger les sangs.\nElle se demandait s'il n'avait pas fait des bêtises.\n@c2@"
  it: "@a@b*: Agnese si stava ammalando per la paura che il marito si fosse cacciato nei guai.\n@c2@"
  ja: "@a@b＊「夫の帰りを　待ちつづける\n\tフレアの様子は\n\t見てられなかったからねえ。\n@c2@"
"61":
  de: "@a@b*: Wenn Ihr nach Auenfelde wollt, müsst Ihr nach Westen zur Auenfelde-Passage und auf der anderen Seite dann weiter nach Nordosten.\n@c1@"
  en: "@a@b*: If ye're headed for Strathbaile, ye need tae gae west tae Strathbaile Burrow, an' then north-east when ye get tae the other side.\n@c1@"
  es: "@a@b*: Si se %H860%Xdirige%Ydirigen%Z a Candonga, %H860%Xdeberá%Ydeberán%Z cruzar por la Madriguera de Candonga y, cuando %H860%Xllegue%Ylleguen%Z al otro lado, ir hacia el nordeste.\n@c1@"
  fr: "@a@b*ⓢ Pour rejoindre Strattbourg, vous devez d'abord aller vers l'ouest jusqu'à la Caverne de Strattbourg. Une fois de l'autre côté, partez vers le nord-est.\n@c1@"
  it: "@a@b*: Per andare a Bellavalle, %H860%Xdevi%Ydovete%Z andare a ovest, verso la Galleria di Bellavalle, e poi, una volta dall'altro lato, a nord-est.\n@c1@"
  ja: "@a@b＊「イムルの村でしたら　お城の\n\t西にある　洞くつを抜けて\n\t北東に歩くと　たどりつけますわ。\n@c1@"
"62":
  de: "@a@b*: Ha... Ha... Hatschiiii! Puh, es ist ein wenig kalt heute, um draußen Wache zu stehen.\n@c2@"
  en: "@a@b*: Ah... Ah... Aaaah-choo!\nOch, it's a wee bit chilly for standin' oot on guard the day.\n@c2@"
  es: "@a@b*: Ah... Ah... ¡Aaaat-chissss!\nCanastos, hace un poco de fresco para estar montando guardia todo el día.\n@c2@"
  fr: "@a@b*ⓢ Aaa... Aaa... Atchoumⓠ\nIl fait un peu frais pour rester de garde dehors.\n@c2@"
  it: "@a@b*: Etciù! Accipicchia... Con questo freddo, fare servizio di guardia è una vera seccatura.\n@c2@"
  ja: "@a@b＊「へっ…へっ…ヘクシッ！\n\t……うう。　門番をするには\n\t少々　はだ寒い日ですな。\n@c2@"
"63":
  de: "@a@b*: Ach, du bist es, Ragnar. Geh ruhig rein.\n@c2@"
  en: "@a@b*: Och, it's you, Ragnar. Gae on by.\n@c2@"
  es: "@a@b*: ¡Ah!, es usted, Ragnar. Adelante, pase.\n@c2@"
  fr: "@a@b*ⓢ Oh, c'est vous, Ragnar. Allez-y, passez.\n@c2@"
  it: "@a@b*: Ah, sei tu, Galiardo. Passa pure.\n@c2@"
  ja: "@a@b＊「誰かと思えば　ライアンどのか。\n\tどうぞ　お通りください。\n@c2@"
"64":
  de: "@a@b*: Die Tore von Burg Burland stehen allen offen, Einheimischen wie Fremden.\n@c2@"
  en: "@a@b*: The gates o' Burland Castle are open tae all folk, be they from these parts or no.\n@c2@"
  es: "@a@b*: Las puertas del Castillo de Burlandia están abiertas a todas las gentes, tanto de aquí como de fuera.\n@c2@"
  fr: "@a@b*ⓢ Les portes du château de Bastione sont ouvertes à tous, que vous soyez d'ici ou non...\n@c2@"
  it: "@a@b*: Le porte del castello di Burlandia sono aperte a tutti, abitanti del luogo e forestieri.\n@c2@"
  ja: "@a@b＊「わがバトランドの城門は\n\tよその国からの客人にも\n\tへだてなく　開かれております。\n@c2@"
"65":
  de: "@a@b*: Geht jetzt weiter.\n@c2@"
  en: "@a@b*: Gae on by noo.\n@c2@"
  es: "@a@b*: Adelante, %H860%Xpuede%Ypueden%Z pasar.\n@c2@"
  fr: "@a@b*ⓢ Allez-yⓠ\n@c2@"
  it: "@a@b*: %H860%XEntra%YEntrate%Z pure.\n@c2@"
  ja: "@a@b＊「どうぞ　お通りください。\n@c2@"
"66":
  de: "@aAgnes@bJeden Tag schicke ich Dankgebete an Ragnar Rauhbein, so glücklich bin ich.\n@c1@"
  en: "@aAigneas@bI wake up every day an' send thanks tae Ragnar McRyan for hoo happy I am, ye know.\n@c1@"
  es: "@aAdalberta@bCada día, cuando me despierto, agradezco a Ragnar McRyan ser tan feliz.\n@c1@"
  fr: "@aAgnès@bIl n'y a pas un matin où je ne remercie pas Ragnar McRyan en me réveillant, vous savezⓡ\n@c1@"
  it: "@aAgnese@bOgni mattina, appena mi sveglio, ringrazio Galiardo de' Guglielmi per avermi restituito la serenità.\n@c1@"
  ja: "@a@bフレア「わたしが　こうして\n\t幸せでいられるのは\n\tライアンさまの　おかげです。\n@c1@"
"67":
  de: "@aAgnes@bIch frag mich, wo er jetzt nur steckt, der Gute.\n@c1@"
  en: "@aAigneas@bI wonder whereaboots he is noo, lovely man that he is.\n@c1@"
  es: "@aAdalberta@bMe pregunto por dónde andará ahora esa bellísima persona.\n@c1@"
  fr: "@aAgnès@bJe me demande où il peut bien être maintenant.\nC'est un homme si gentil.\n@c1@"
  it: "@aAgnese@bChissà dov'è adesso, quel brav'uomo.\n@c1@"
  ja: "@a@bフレア「今ごろ　ライアンさまは\n\tどうなさっているのかしら……。\n@c1@"
"68":
  de: "@aAgnes@bRagnar! Ihr seid's! Ihr wisst ja gar nicht, wie dankbar ich Euch immer noch bin für das, was Ihr getan habt.\n@c1@"
  en: "@aAigneas@bRagnar! It's you! I cannae tell ye hoo grateful I am tae ye still for what ye did.\n@c1@"
  es: "@aAdalberta@b¡Ragnar! ¡Es usted! ¡No puedo expresar con palabras mi eterno agradecimiento por lo que hizo!\n@c1@"
  fr: "@aAgnès@bRagnarⓠ C'est vousⓠ Vous ne pouvez pas savoir à quel point je vous suis reconnaissante pour ce que vous avez fait.\n@c1@"
  it: "@aAgnese@bGaliardo! Ma sei proprio tu?! Non riuscirò mai a dirti quanto io ti sia grata!\n@c1@"
  ja: "@a@bフレア「ああ　ライアンさま！\n\tそのせつは　ありがとうございました！\n@c1@"
"69":
  de: "@aAgnes@bEs ist so schön, meinen Mann Alfons wieder bei mir zu Hause zu haben.\n@c1@"
  en: "@aAigneas@bIt's so lovely tae hae my husband Angus back wi' me at home again.\n@c1@"
  es: "@aAdalberta@bEs maravilloso tener a mi esposo Angustio conmigo en casa de nuevo.\n@c1@"
  fr: "@aAgnès@bJe suis tellement heureuse que mon mari Angus soit revenu à la maison.\n@c1@"
  it: "@aAgnese@bSono così felice che il mio Attilio sia tornato a casa!\n@c1@"
  ja: "@a@bフレア「今は　夫のアレクスと　ふたり\n\t幸せに暮らしております。\n@c1@"
"70":
  de: "@a@b*: Das ist wirklich alles sehr interessant.\n@c2@"
  en: "@a@b*: Och, it's all verra intriguin' indeed.\n@c2@"
  es: "@a@b*: Sí, es todo muy fascinante.\n@c2@"
  fr: "@a@b*ⓢ C'est vraiment bizarre...\n@c2@"
  it: "@a@b*: Certo che la storia è intrigante... \n@c2@"
  ja: "@a@b＊「いや～　びっくりしました。\n@c2@"
"71":
  de: "@a@b*: Dieses ganze Gerede über Leute, die Rüstungen und Waffen aus Zenithia sammeln, um damit zum Himmel emporzusteigen...\n@c2@"
  en: "@a@b*: This talk of folk tryin' tae collect Zenithian Armour an' weapons so they can climb up intae the sky...\n@c2@"
  es: "@a@b*: Esos rumores sobre las personas que intentan conseguir la Armadura de Zenithia para poder llegar al cielo...\n@c2@"
  fr: "@a@b*ⓢ Il paraît qu'un groupe de personnes essaie de récupérer tout l'Équipement zénithien pour pouvoir aller dans le ciel...\n@c2@"
  it: "@a@b*: Pare che ci siano delle persone che cercano l'Armatura e le armi Zenithiane per salire fino in cielo.\n@c2@"
  ja: "@a@b＊「天空の　武器　防具を集めて\n\t天空にのぼろうと\n\tしている人たちがいるとか。\n@c2@"
"72":
  de: "@a@b*: Das bringt einen ganz schön ins Grübeln, gell? Aber ich glaube ja nicht, dass dieses Himmelsschloss wirklich existiert.\n@c2@"
  en: "@a@b*: It certainly makes ye think, eh? But I amn't sure this sky castle even exists maself.\n@c2@"
  es: "@a@b*: Da que pensar, no hay duda. Pero yo no estoy muy seguro de la existencia de ese castillo en el cielo.\n@c2@"
  fr: "@a@b*ⓢ Y'a de quoi se poser des questions, heinⓡ\nEt puis je suis même pas sûr que ce château dans le ciel existe vraiment.\n@c2@"
  it: "@a@b*: La cosa è senza dubbio affascinante, eh? Ma poi chissà se questo castello nel cielo esiste davvero!\n@c2@"
  ja: "@a@b＊「しかし　天空の城など\n\tほんとに　あるのでしょうか……。\n@c2@"
"73":
  de: "@a@b*: Habt Ihr von diesem Schlüssel gehört? Der Schlüssel, mit dem man sogar Kerkertüren aufsperren kann?\n@c2@"
  en: "@a@b*: D'ye know aboot the key?\nThe key that can even open jail doors!?\n@c2@"
  es: "@a@b*: ¿%H860%XHa%YHan%Z oído hablar de la llave?\n¡¿Esa llave que puede abrir puertas de prisión?!\n@c2@"
  fr: "@a@b*ⓢ Vous avez entendu parler de cette clefⓡ\nMais si... celle qui peut ouvrir toutes les portes, même celles des cellules de prisonⓠ\n@c2@"
  it: "@a@b*: %H860%XHai%YAvete%Z sentito parlare di quella strana chiave?\nLa chiave che può aprire persino le celle delle prigioni?\n@c2@"
  ja: "@a@b＊「知っておるか？\n\t牢屋の　鉄格子さえも開く\n\tカギのことを！？\n@c2@"
"74":
  de: "@a@b*: Es heißt, dass eine Königin ihn hat, irgendwo in einer Burg.\n@c2@"
  en: "@a@b*: Folk say it's owned by a queen in a castle somewhere.\n@c2@"
  es: "@a@b*: Se cuenta que está en poder de la reina de un castillo.\n@c2@"
  fr: "@a@b*ⓢ Les gens disent qu'elle est entre les mains d'une reine qui habite dans un château quelque part.\n@c2@"
  it: "@a@b*: Pare che ce l'abbia una regina, in un castello da qualche parte.\n@c2@"
  ja: "@a@b＊「うわさでは　そのカギは\n\tどこかのお城の　女王さまが\n\t持っているらしいぞ。\n@c2@"
"75":
  de: "@a@b*: Ah! Ihr seid auf Einkaufstour, was? Macht es Euch was aus, außen herum zu gehen?\n@c2@"
  en: "@a@b*: Ach! Here for a wee bit o' shoppin', are ye? Then maybe ye could away ootside an' 'round tae the counter if it's no too much trouble.\n@c2@"
  es: "@a@b*: ¡Vaya! Veo que %H860%Xha%Yhan%Z venido a hacer algunas compras. Entonces no %H860%Xle%Yles%Z importará salir de aquí y dirigirse al mostrador, si %H860%Xes tan amable%Yson tan amables%Z.\n@c2@"
  fr: "@a@b*ⓢ Tiensⓠ Vous venez faire quelques emplettesⓡ Alors il faudrait ressortir et passer de l'autre côté du comptoir, si vous voulez bien.\n@c2@"
  it: "@a@b*: Ehilà! %H860%XSei%YSiete%Z qui per acquisti? Allora %H860%Xesci fuori e vai%Yuscite fuori e andate%Z dall'altro lato del bancone, se non %H860%Xti%Yvi%Z dispiace.\n@c2@"
  ja: "@a@b＊「おや？　お買い物ですか？\n\tだったら　店のそとに出て\n\tカウンターごしに　話しかけて下さい。\n@c2@"
"76":
  de: "@a@b*: Die Monster meiden Orte, an denen viele Leute sind. Also sind wir hier sicher.\n@c1@"
  en: "@a@b*: Ye never get monsters comin' tae places where there are lots o' people, so we're safe here.\n@c1@"
  es: "@a@b*: Los monstruos nunca vienen a lugares muy poblados, de modo que estamos a salvo aquí.\n@c1@"
  fr: "@a@b*ⓢ Les monstres ne s'aventurent jamais dans les endroits où il y a du monde.\nAlors on est en sécurité ici.\n@c1@"
  it: "@a@b*: Di solito i mostri non vanno mai dove ci sono molte persone, quindi noi dovremmo essere al sicuro.\n@c1@"
  ja: "@a@b＊「魔物だって　人が大勢いる\n\t町の中までは\n\t入ってこれないわよ。\n@c1@"
"77":
  de: "@a@b*: Aber vielleicht nicht mehr lange. Denn anscheinend ist der Herr der Unterwelt wieder erwacht.\n@c1@"
  en: "@a@b*: But maybe not for much longer. Folk are sayin' the Lord o' the Underworld is awake again noo.\n@c1@"
  es: "@a@b*: Pero puede que no por mucho tiempo. Se dice que el Señor del Inframundo se ha despertado de nuevo.\n@c1@"
  fr: "@a@b*ⓢ Le problème, c'est que ça ne durera peut-être pas longtemps. Il paraît que le Seigneur des Enfers est ressuscité.\n@c1@"
  it: "@a@b*: La pacchia però potrebbe finire presto. In giro corre voce che presto il Signore degli Inferi si risveglierà.\n@c1@"
  ja: "@a@b＊「ウワサにきく　地獄の帝王が\n\t復活したってんなら\n\tそうも言ってられないけど……。\n@c1@"
"78":
  de: "@a@b*: Brrr. Mir läuft es schon eiskalt den Rücken runter, wenn ich nur daran denke.\n@c1@"
  en: "@a@b*: Brrrr. I'm makin' maself scared just talkin' aboot it.\n@c1@"
  es: "@a@b*: Brrrr. Tiemblo solo de pensar en ello.\n@c1@"
  fr: "@a@b*ⓢ Ça me fait peur rien que d'en parler.\n@c1@"
  it: "@a@b*: Brrrrr! Mi vengono i brividi solo a pensarci!\n@c1@"
  ja: "@a@b＊「……ブルブル。\n\t自分で　言ってて\n\t怖くなってきちゃったわ。\n@c1@"
"79":
  de: "@a@b*: Ich nehm die Dinge selbst in die Hand. Bin schließlich kein kleiner Bub mehr!\n@c1@"
  en: "@a@b*: I'm takin' care o' things all by maself.\nI amn't just a wee laddie no more!\n@c1@"
  es: "@a@b*: Yo mismo me encargo de todo.\n¡Ya no soy ningún párvulo!\n@c1@"
  fr: "@a@b*ⓢ Maintenant, j'me débrouille tout seul.\nJ'suis plus un p'tit bébéⓠ\n@c1@"
  it: "@a@b*: Sto imparando a fare tutto da me. Adesso non sono più un bambino!\n@c1@"
  ja: "@a@b＊「ひとりで　お留守番してるんだ！\n\tえらいでしょ！\n\tぼく　もう子供じゃないもんね。\n@c1@"
"80":
  de: "@a@b*: Die Kinderchen, die vor einiger Zeit verschwanden, wurden von Monstern entführt, die hinter einem Helden her waren.\n@c3@"
  en: "@a@b*: The wee kiddies who went missin' a while back were snatched by some monster who was after a legendary hero.\n@c3@"
  es: "@a@b*: Los chiquillos que desaparecieron hace un tiempo fueron secuestrados por un monstruo que buscaba a un héroe legendario.\n@c3@"
  fr: "@a@b*ⓢ Savez quoiⓡ Les gamins qu'ont été enlevés y a pas longtemps... Eh bah, ils ont été kidnappés par un monstre qui cherchait un héros légendaire.\n@c3@"
  it: "@a@b*: I fanciulli che scomparvero un po' di tempo fa erano stati rapiti da un mostro che stava dando la caccia a un eroe leggendario.\n@c3@"
  ja: "@a@b＊「以前　子供が消えていたのは\n\t伝説の勇者を　見つけだそうと\n\t魔物が　さらっていたんだってよ。\n@c3@"
"81":
  de: "@a@b*: Diese Art von Suche erscheint mir nicht sehr einleuchtend. So gescheit können diese Monster also nicht sein.\n@c3@"
  en: "@a@b*: It soonds like a silly way tae look for someone if ye ask me.\nMonsters cannae be all that clever.\n@c3@"
  es: "@a@b*: No parece una forma muy inteligente de buscar a alguien.\nEsos monstruos no deben de ser muy astutos.\n@c3@"
  fr: "@a@b*ⓢ Ça me paraît pas vraiment un moyen très intelligent de chercher quelqu'un. Mais les monstres sont pas réputés pour leur intelligence, remarquez.\n@c3@"
  it: "@a@b*: Secondo me, ci sono modi meno stupidi di cercare una persona. Questi mostri dovrebbero imparare a usare la testa!\n@c3@"
  ja: "@a@b＊「でも　そんな方法で\n\t勇者を　探そうとするなんて\n\t魔物も　けっこう　マヌケだよな。\n@c3@"
"82":
  de: "@a@b*: Ach, hätte ich nur ein eigenes Haus, mit einem Dach und mit Wänden, die den Regen abhalten.\n@c2@"
  en: "@a@b*: Och, whit I'd gie tae be able tae sleep in a hoose o' ma own, wi' a roof an' walls tae keep oot the rain.\n@c2@"
  es: "@a@b*: Ah, qué no daría yo por poder dormir en mi propia casa, con paredes y techo para protegerme de la intemperie.\n@c2@"
  fr: "@a@b*ⓢ Oh, qu'est-ce que je ne donnerais pas pour pouvoir dormir dans ma propre maison, avec un toit et des murs pour me protéger de la pluieⓠ\n@c2@"
  it: "@a@b*: Oh, quanto vorrei poter dormire in una casa tutta mia, con tanto di tetto e pareti per non bagnarmi quando piove... \n@c2@"
  ja: "@a@b＊「……ううっ。\n\tはやく　雨つゆをしのげる家で\n\t寝られるようになりたいです。\n@c2@"
"83":
  de: "@a@b*: Miau!\n@c1@"
  en: "@a@b*: Meow!\n@c1@"
  es: "@a@b*: ¡Miau!\n@c1@"
  fr: "@a@b*ⓢ Miaouⓠ\n@c1@"
  it: "@a@b*: Miao!\n@c1@"
  ja: "@a@b＊「キシャー！\n@c1@"
"84":
  de: "@a@b*: Klar kannst du in die Burg, aber König Burkhard wirst du wohl kaum sprechen können. Der empfängt abends niemanden mehr.\n@c2@"
  en: "@a@b*: Ye can gae inside the castle by all means, but ye cannae see King Burnard. No one sees His Majesty of a night, I'm afraid.\n@c2@"
  es: "@a@b*: Claro que %H860%Xpuede%Ypueden%Z entrar en el castillo, pero no %H860%Xpuede%Ypueden%Z ver al rey Recaredo. Nadie puede visitar a Su Majestad de noche, lo lamento.\n@c2@"
  fr: "@a@b*ⓢ Vous pouvez entrer dans le château, mais vous ne pouvez pas voir le roi Bastien. Personne ne rencontre Sa Majesté de nuit, je regrette.\n@c2@"
  it: "@a@b*: %H860%XPuoi%YPotete%Z entrare nel castello, ma temo che non sia possibile incontrare Re Basilio a quest'ora. Di notte, Sua Maestà non riceve nessuno.\n@c2@"
  ja: "@a@b＊「城には入れますが\n\t王には　会えませんよ。\n\t夜の決まりっす。\n@c2@"
"85":
  de: "@a@b*: Ihr wollt König Burkhard sprechen? Also, falls es nicht so dringend ist, kommt Ihr am besten morgen wieder.\n@c2@"
  en: "@a@b*: Ye want tae see King Burnard? Well, if there's no hurry, it'd be better if ye come back the morra.\n@c2@"
  es: "@a@b*: ¿%H860%XQuiere%YQuieren%Z ver al rey Recaredo? Bueno, si no es muy urgente, será mejor que %H860%Xvuelva%Yvuelvan%Z por la mañana.\n@c2@"
  fr: "@a@b*ⓢ Vous voulez rencontrer le roi Bastienⓡ\nS'il n'y a pas d'urgence, je crois que vous feriez mieux de revenir demain.\n@c2@"
  it: "@a@b*: %H860%XVuoi%YVolete%Z parlare con Re Basilio? A meno che non si tratti di una cosa di estrema urgenza, %H860%Xti%Yvi%Z chiedo di tornare domattina.\n@c2@"
  ja: "@a@b＊「王に　なにかご用ですかな？\n\tだが　急ぎの用でなければ\n\t明日にしていただきたい。\n@c2@"
"86":
  de: "@a@b*: Nach der heutigen Aufregung sei ihm zumindest eine gute Nachtruhe gegönnt.\n@c2@"
  en: "@a@b*: After the stramash of a day he's had, the least we can dae is let him get a good night's sleep.\n@c2@"
  es: "@a@b*: Después del día tan agitado que ha tenido, lo menos que podemos hacer es procurarle una noche de sueño reparador.\n@c2@"
  fr: "@a@b*ⓢ Après la journée éprouvante qu'il a eue, le moins que l'on puisse faire, c'est de le laisser profiter d'une bonne nuit de sommeil.\n@c2@"
  it: "@a@b*: Oggi ha avuto una giornata pesantissima. Sarà meglio lasciarlo riposare.\n@c2@"
  ja: "@a@b＊「昼間は多忙ゆえ　夜ぐらいは\n\t王には　しっかり身体を\n\t休めていただきたいのだ。\n@c2@"
"87":
  de: "@aAgnes@bDie Sterne leuchten so hell... Oh, schau, mein Liebling, da ist unser Stern!\n@c1@"
  en: "@aAigneas@bThe stars are so bright...\nOch! Look, ma love.\nThere's oor one!\n@c1@"
  es: "@aAdalberta@bLas estrellas lucen tanto hoy...\n¡Oh! Mira, amor mío.\n¡Ahí está la nuestra!\n@c1@"
  fr: "@aAgnès@bLes étoiles sont si brillantes...\nOhⓠ Regarde, mon chéri.\nVoici la nôtreⓠ\n@c1@"
  it: "@aAgnese@bCome risplendono gli astri su nel cielo...\nOh! Guarda lì, amore mio!\nQuella è la nostra stella!\n@c1@"
  ja: "@a@bフレア「ほら　星があんなに光って……。\n\t見て　あなた！\n\tあれが　わたしたちの星よ！\n@c1@"
"88":
  de: "@aAgnes@bHuch! Tut mir leid. Ich dachte, Ihr wärt mein Alfons. Das ist mir jetzt aber unangenehm.\n@c1@"
  en: "@aAigneas@bGads! I'm sorry. I thought ye were ma Angus.\nI feel all embarrassed noo.\n@c1@"
  es: "@aAdalberta@b¡Sapristi! Lo siento. Pensé que era mi Angustio.\nMe siento muy avergonzada.\n@c1@"
  fr: "@aAgnès@bOhⓠ Je suis désolée.\nJe croyais que vous étiez Angus.\nJe suis très gênéeⓠ\n@c1@"
  it: "@aAgnese@bOh! Mi spiace! Ero convinta che tu fossi Attilio!\nDea mia, che imbarazzo... \n@c1@"
  ja: "@a@bフレア「あら？\n\tアレクスじゃなかったの？\n\tいやだ　恥ずかしいわ……。\n@c1@"
"89":
