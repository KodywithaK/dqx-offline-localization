  ja: "@a@b＊「まあ　夢なんて　たいがい\n\tおかしなもんだと　思うんだけどな。\n@c3@"
"53":
  de: "@a@b*: Wisst Ihr, ich wollte damals auch immer zur Palastwache.\n@c2@"
  en: "@a@b*: I wanted tae be a palace guard back in ma day, ye ken.\n@c2@"
  es: "@a@b*: En mis tiempos yo quería ser guardia de palacio, %H860%X¿sabe?%Y¿saben?%Z\n@c2@"
  fr: "@a@b*ⓢ Vous savez, à une époque, je voulais devenir garde royal.\n@c2@"
  it: "@a@b*: Lo sai? Da giovane volevo essere una guardia di palazzo.\n@c2@"
  ja: "@a@b＊「わしも　若かったころは\n\t王宮の戦士に　あこがれたものじゃ。\n@c2@"
"54":
  de: "@a@b*: Ihr helft Burland und ich helfe Euch. Na, was sagt Ihr? Kann ich mit Euch mitkommen?\n@c2@"
  en: "@a@b*: If ye're helpin' Burland, then I want tae help ye. What dae ye say? Can I tag along wi' ye?\n@c2@"
  es: "@a@b*: Si %H860%Xestá%Yestán%Z ayudando a Burlandia, quisiera acompañar%H860%X%A120%Xle%Z%B120%Xla%Z%Y%R000%Xlas%Yles%Z%Z. ¿Qué %H860%Xcontesta%Ycontestan%Z? ¿Puedo acompañar%H860%X%A120%Xle%Z%B120%Xla%Z%Y%R000%Xlas%Yles%Z%Z?\n@c2@"
  fr: "@a@b*ⓢ Si vous aidez Bastione, je veux vous aider aussi. Qu'en dites-vousⓡ Je peux vous accompagnerⓡ\n@c2@"
  it: "@a@b*: Se sei in missione per il bene del regno di Burlandia, voglio essere al tuo fianco! Che ne dici? Posso unirmi a te?\n@c2@"
  ja: "@a@b＊「この　じいも　バトランドを守る\n\t戦士さまの　手伝いがしたいんじゃ。\n\tどうじゃろう？　つれていってはくれぬか？\n@c2@"
"55":
  de: "@a@b*: Pfundig! Ich darf? Dann nix wie los!\n@c2@"
  en: "@a@b*: Hoots! I can!? Then let's away!\n@c2@"
  es: "@a@b*: ¡Repámpanos! ¡¿Puedo?! ¡Entonces, en marcha!\n@c2@"
  fr: "@a@b*ⓢ C'est vrai, je peuxⓠⓑ Allons-y, alorsⓠ\n@c2@"
  it: "@a@b*: Perbacco! Posso? Partiamo subito!\n@c2@"
  ja: "@a@b＊「おお　まことか！？\n\tでは　ついてゆくとしよう！\n@c2@"
"56":
  de: "@a@b*: Allerdings ist Kämpfen nicht gerade meine starke Seite, also verlasst Euch da nicht allzu sehr auf mich.\n@c2@"
  en: "@a@b*: Och, but I amn't much of a fighter, so dinnae count on me too much there.\n@c2@"
  es: "@a@b*: Solo que, por desgracia, no soy un gran guerrero, así que no %H860%Xva%Yvan%Z a poder contar conmigo en ese sentido.\n@c2@"
  fr: "@a@b*ⓢ Mais je ne suis pas un grand combattant, alors ne comptez pas trop sur moi pour ça.\n@c2@"
  it: "@a@b*: Comunque, sappi che io non sono un grande guerriero... Quindi non fare troppo affidamento sulle mie capacità in battaglia, intesi?\n@c2@"
  ja: "@a@b＊「ちなみに　わしは戦闘は苦手じゃ。\n\tまったく　戦力にならんから\n\tそのつもりでな。\n@c2@"
"57":
  de: "@a@b*: Höhh... Höhh... Ich bin ganz außer Puste. Ich bin ja doch nicht mehr der Jüngste. Geht lieber ohne mich weiter.\n@c2@"
  en: "@a@b*: Haah... Haah... I cannae get ma breath.\nMaybe I'm too old for this.\nYe should gae on without me.\n@c2@"
  es: "@a@b*: Ufff... Ufff... Me cuesta respirar. Quizá estoy demasiado viejo para esto. Será mejor que %H860%Xsiga%Ysigan%Z adelante sin mí.\n@c2@"
  fr: "@a@b*ⓢ Han... Han... Je suis tout essoufflé. Je suis peut-être trop vieux pour ça. Continuez donc sans moi.\n@c2@"
  it: "@a@b*: Anf... Anf... Mi manca il respiro... Sono troppo vecchio per questo genere di cose. Forse dovresti continuare senza di me... \n@c2@"
  ja: "@a@b＊「はあはあ……息が切れる……。\n\tやっぱり　年寄りには　つらいのう。\n\t気にせず　行ってくだされ。\n@c2@"
"58":
  de: "@a@b*: Wie dumm von mir zu glauben, ich könnt mit einem Soldaten mithalten. Tut mir leid, dass ich Euch aufgehalten hab.\n@c2@"
  en: "@a@b*: I cannae say I'm surprised.\nSorry tae take up yer time like that.\n@c2@"
  es: "@a@b*: No puedo decir que me sorprenda.\nSiento haber%H860%Xle%Yles%Z hecho perder el tiempo.\n@c2@"
  fr: "@a@b*ⓢ Quel idiot je suis de me croire capable de suivre un soldat. Désolé de vous avoir fait perdre votre temps.\n@c2@"
  it: "@a@b*: Ma come ho potuto pensare che sarei riuscito a tenere il passo di un soldato ben addestrato?! Scusami... Mi spiace farti perdere tanto tempo.\n@c2@"
  ja: "@a@b＊「やっぱりのう。\n\tいや　ムリをいって\n\tすまんかったわい。\n@c2@"
"59":
  de: "@a@b*: Ich bin froh, dass Alfons gesund und munter zurück ist.\n@c2@"
  en: "@a@b*: It's a relief that Angus is back home safe an' sound.\n@c2@"
  es: "@a@b*: Es un alivio que Angustio haya vuelto a casa sano y salvo.\n@c2@"
  fr: "@a@b*ⓢ Je suis tellement soulagée qu'Angus soit rentré sain et sauf.\n@c2@"
  it: "@a@b*: Mi fa proprio piacere che Attilio sia tornato a casa sano e salvo.\n@c2@"
  ja: "@a@b＊「アレクスのやつが　帰ってきて\n\t本当に　よかったよ。\n@c2@"
"60":
