  it: "@aZar Stepan@bNyet! Non è ammissibile, ti dico! Perché ti uostini a essere cuosì testarda?\n@c2@"
  ja: "@a@b王「ならぬっ。　ならぬぞ！\n\tどうして　お前は\n\tそう　おてんばなのじゃ……。\n@c2@"
"9":
  de: "@aZar Stepan@bHör, was ich dir sage! Mehr ich will nicht. Nun geh auf dein Zimmer.\n@c2@"
  en: "@aTsar Stepan@bYou listen to reasoning! This is all of what I wish. Now, repose yourself to your chamber.\n@c2@"
  es: "@aZar Stepan@b¡Tú escuchaя a la яazóи! Yo deseaиdo solo eso. Tú maяchaя ahoяa a aposeиtos tuyos.\n@c2@"
  fr: "@aTsar Stepan@bÉcoute la voix de la яaisoиⓠ C'est tout ce que je souhaite. À pяéseиt, va te яeposeя daиs ta chambяe.\n@c2@"
  it: "@aZar Stepan@bAscolta voce di ragione! Obbedisci a uordine di tuo padre! Tuorna in tua stanza... \n@c2@"
