"0":
  de: "@a@bEs war einmal in einem fernen Land eine burschikose Prinzessin namens Zarewna Alena.\n@c0@"
  en: "@a@bOnce upon a time, in a land far away, there was a tomboy princess called Tsarevna Alena.\n@c0@"
  es: "@a@bHace mucho tiempo, en un reino muy lejano, existía una princesa un tanto marimacho, la zarevna Alena.\n@c0@"
  fr: "@a@bIl était une fois, dans un pays lointain, une princesse aux airs de garçon manqué, appelée la tsarine Alina.\n@c0@"
  it: "@a@bTanto, tanto tempo fa, in una terra molto lontana, viveva la Zarina Alena, una fanciulla dal carattere esuberante.\n@c0@"
  ja: "@a@bむかしむかし　ある所に\nアリーナ姫という　それはそれは\nおてんばな　お姫さまが　おったそうじゃ。\n@c0@"
"1":
  de: "@a@bIhr Vater, Zar Stepan, machte sich ständig Sorgen, weil sie solch ein Wildfang war. Eines Morgens rief er sie in seinen Thronsaal.\n@c0@"
  en: "@a@bHer rough and tumble ways were a constant concern to her father, Tsar Stepan. One morning, he summoned her to his throne room...\n@c0@"
  es: "@a@bSu padre, el zar Stepan, estaba muy preocupado por el comportamiento tosco y poco femenino de su hija. Una mañana, la hizo llamar a la sala del trono...\n@c0@"
  fr: "@a@bSes manières rudes et son côté casse-cou ne cessaient d'inquiéter son père, le tsar Stepan. Un matin, il la convoqua dans la salle du trône...\n@c0@"
  it: "@a@bIl suo comportamento era una continua fonte di preoccupazione per suo padre, lo Zar Stepan, che una mattina la convocò nella sala del trono... \n@c0@"
  ja: "@a@bその国の王様は　姫の　おてんばさに\n頭をかかえる　毎日。\nある朝　姫を　呼びつけたのじゃよ……。\n@c0@"
"2":
  de: "@a@b*: Eure Hoheit! Zarewna Alena! Euer Vater erwartet Euch!\n@c2@"
  en: "@a@b*: Your Highness! Tsarevna Alena!\nYour father awaits you.\n@c2@"
  es: "@a@b*: ¡Su Alteza! ¡Zaяevna Aleиa!\nSu padяe espeяaиdo.\n@c2@"
  fr: "@a@b*ⓢ Votяe Gяaиdeuяⓠ Tsaяiиe Aliиaⓠ\nVotяe pèяe vous atteиd.\n@c2@"
  it: "@a@b*: Altezza! Zarina Alena! Vuostro padre vi attende.\n@c2@"
  ja: "@a@b＊「姫さま！　アリーナ姫さま！\n\tお父上が　お呼びですぞ！\n@c2@"
"3":
  de: "@aZar Stepan@bDa bist du ja, Alena. Alter Borja sagt, du willst auf Reisen gehen und deine Kraft erproben, ja?\n@c2@"
  en: "@aTsar Stepan@bThere you are, Alena. I hear from old Borya that you desire to journey for the purpose of testing your strengths, no?\n@c2@"
  es: "@aZar Stepan@b¡Ya estaиdo aquí, Aleиa! El viejo Boяya deciя que tú deseaиdo viajaя paяa pяobaя tu valía, ¿cieяto?\n@c2@"
  fr: "@aTsar Stepan@bTe voici, Aliиa. Le vieux Boяya m'a laissé eиteиdяe que tu voulais voyageя de paя le moиde pouя mettяe ta foяce à l'épяeuve, c'est bieи çaⓡ\n@c2@"
  it: "@aZar Stepan@bEccoti qui, figliola. Il vecchio Boris ha riferito me che hai intenzione di intraprendere viaggio per mettere alla prova tuo cuoraggio. È vero?\n@c2@"
  ja: "@a@b王「おお　アリーナか！？　じいから\n\t聞いたのだが　ちからだめしの旅に\n\t出たいと　申しているとか……。\n@c2@"
"4":
  de: "@aZar Stepan@bOj! Das geht nicht! Du bist doch eine Dame. Und bist Zarewna dieses wundervollen Landes.\n@c2@"
  en: "@aTsar Stepan@bYoy! This cannot occur. You are a lady.\nIn addition, you are tsarevna of this beautiful land.\n@c2@"
  es: "@aZar Stepan@b¡Ay! Иo pudieиdo peяmitiя. Tú seя uиa dama.\nTú sieиdo además zaяevиa de bella tieяяa esta.\n@c2@"
  fr: "@aTsar Stepan@bTssⓠ C'est hoяs de questioи. Tu es uиe dame. De plus, tu es la tsaяiиe de ce beau pays.\n@c2@"
  it: "@aZar Stepan@bCiò non è assolutamente ammissibile. Sei una fanciulla, e un giorno sarai suovrana di nuostro magnifico regno!\n@c2@"
  ja: "@a@b王「ならぬっ。　ならぬぞ。\n\tお前は　女。\n\tしかも　わが国の姫なのだぞ。\n@c2@"
"5":
  de: "@aZar Stepan@bIch kann dich nicht in eine Welt voller Ungeheuer und Gefahren lassen, nur dafür, dass du misst deine Fähigkeiten.\n@c2@"
  en: "@aTsar Stepan@bI cannot permit that you venture into a world of monsters and danger merely for to challenge abilities.\n@c2@"
  es: "@aZar Stepan@bYo иo pudieиdo peяmitiя que tú viajaя a uи muиdo de moиstяuos y peligяos solo poя demostяaя la valía tuya.\n@c2@"
  fr: "@aTsar Stepan@bJe иe peux te peяmettяe de t'aveиtuяeя daиs uи moиde pleiи de moиstяes et de daиgeяs juste pouя le plaisiя de testeя tes compéteиces.\n@c2@"
  it: "@aZar Stepan@bNon permetterò a mia figlia di avventurarsi in un muondo colmo di mostri e insidie, solo perché vuole mettere a prova sue capacità!\n@c2@"
  ja: "@a@b王「魔物どもが住む　外の世界へ\n\tちからだめしに　出るなど\n\tこのわしが　ゆるさん！\n@c2@"
"6":
  de: "@aZar Stepan@bImmer daran denke ⓚⓛ die Göttin sorgt für den, der seines Glückes Schmied ist. Ich verbiete, dass du setzt Füße aus Burg.\n@c2@"
  en: "@aTsar Stepan@bRemember: the Goddess takes care of the one who takes care of himself. I prohibit that you set feet outside of castle.\n@c2@"
  es: "@aZar Stepan@bTú яecoяdaя: la Diosa pяotegieиdo a los que pяotegeяse a ellos mismos. Yo pяohibieиdo que tú saliя del castillo.\n@c2@"
  fr: "@aTsar Stepan@bSouvieиs-toiⓢ la Déesse pяeиd soiи de ceux qui pяeииeиt soiи d'eux-mêmes. Je t'iиteяdis de mettяe uи seul pied hoяs du château.\n@c2@"
  it: "@aZar Stepan@bRicorda che dea protegge solo cuoloro che hanno cura di sé. Per muotivo questo, d'ora in avanti non potrai recarti fuori da nuostro castello.\n@c2@"
  ja: "@a@b王「よいなっ！？\n\tこの城から　出てはならぬぞ。\n\tでは　下がってよい……。\n@c2@"
"7":
  de: "@aZar Stepan@bWas ist denn los, Alena? Du willst immer noch bereisen große weite Welt?\n@c2@"
