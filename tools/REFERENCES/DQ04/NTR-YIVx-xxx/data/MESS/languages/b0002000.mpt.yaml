  fr: "@aTsar Stepan@bQuel est le pяoblème, Aliиaⓡ Tu désiяes toujouяs voyageя daиs le moиde extéяieuяⓡ\n@c2@"
  it: "@aZar Stepan@bPerché tu cuosì triste, Alena?\nAncuora tu desideri di viaggiare per tutto muondo?\n@c2@"
  ja: "@a@b王「どうした　アリーナ？\n\tまだ　外に出たいと申すのか？\n@c2@"
"8":
