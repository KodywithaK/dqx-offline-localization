  de: "@a@b*: Und vergiss nicht, dass ich dich auf Provision bezahle. Also steh nicht dumm rum, sondern tu was!\n@c2@"
  en: "@a@b*: Don't forget that I'm payin' y'on commission, now. So no guffin' an' idlin'!\n@c2@"
  es: "@a@b*: No ti olvides quie ti pago pior comisión. ¡Así que no hagas el viago!\n@c2@"
  fr: "@a@b*ⓢ N'oublie pas que je te paie à la commission. Je veux pas de rigolo ou de tire-au-flanc ici.\n@c2@"
  it: "@a@b*: Rihordati che sei pagato in base a quanto riesci a vende'... Perciò ti honviene 'un perde' tempo 'nchiacchiere!\n@c2@"
  ja: "@a@b＊「給料は　ちゃんと　歩合で払うから\n\tしっかり　はたらくんだぜ。\n@c2@"
"50":
  de: "@a@b*: Gut. Dann lass ich dich mal allein. Ich bin unten, wenn was ist.\n@c2@"
  en: "@a@b*: Right. So, then... I'll leave ye to it.\nI'll be down below, if ye need me.\n@c2@"
  es: "@a@b*: De acuerdo. Muy bien, pues... Aquí ti diejo.\nSi mi neciesitas, estaré abiajo.\n@c2@"
  fr: "@a@b*ⓢ Parfait. Bon... je te laisse travailler.\nJe suis en bas, si tu as besoin de moi.\n@c2@"
  it: "@a@b*: Ora ti lascio al tu' lavoro. Se hai bisogno di hualcosa, mi trovi di sotto.\n@c2@"
  ja: "@a@b＊「じゃあ　まかせたよ。\n\tオレは　下に　いるからな。\n@c2@"
"51":
  de: "@a@b*: Bist du nicht? Na gut. Dann hast du wohl eigene Pläne.\n@c2@"
  en: "@a@b*: Ye're not? Fair play.\nI s'pose ye've things of yer own to be doin'.\n@c2@"
  es: "@a@b*: ¿Cómo que no? Pues niada.\nSupongo que tienes cosas que hacier por tu cuenta.\n@c2@"
  fr: "@a@b*ⓢ Nonⓡ Bien.\nJ'imagine que tu dois t'occuper de tes affaires.\n@c2@"
  it: "@a@b*: Ah, no? D'accordo. Immagino che tu voglia homincia' a lavora' per conto tuo.\n@c2@"
  ja: "@a@b＊「そうかい。\n\tまっ　お前さんにも　いろいろと\n\tやりたいことは　あるだろうからな。\n@c2@"
"52":
  de: "@a@b*: Du kannst ja auch nicht dein ganzes Leben für Typen wie mich arbeiten, stimmt's?\n@c2@"
  en: "@a@b*: Ye can't spend yer life workin' fer the likes o' me now, can ye?\n@c2@"
  es: "@a@b*: No puedes pasiarte la vida triabajando para gente como yo, ¿no?\n@c2@"
  fr: "@a@b*ⓢ On ne peut pas passer sa vie à travailler pour les autres, pas vraiⓡ\n@c2@"
  it: "@a@b*: 'Un vorrai miha sta' tutta la vita al servizio di qualcun altro!?\n@c2@"
  ja: "@a@b＊「いつまでも　オレに使われていても\n\t仕方ないし……。\n@c2@"
"53":
  de: "@a@b*: Ich wünsche dir alles Gute. Und falls du mal knapp bei Kasse bist, kannst du jederzeit wieder bei mir anfangen.\n@c2@"
  en: "@a@b*: Well all the best to ye, then.\nAn' if ye're needin' to earn a few bob, ye can always have yer job back here.\n@c2@"
  es: "@a@b*: Bueno, ti dieseo lo mejor.\nY si neciesitas ganar un poco de diniero, siempre puedes volvier a tu puesto aquí.\n@c2@"
  fr: "@a@b*ⓢ Eh bien, bonne chance alors. Et si tu as besoin de te renflouer un peu, tu peux toujours revenir travailler ici.\n@c2@"
  it: "@a@b*: Beh, ti fò tanti auguri! Se avessi bisogno di guadagna' un po' di huattrini, poi sempre torna' qui a lavora'!\n@c2@"
  ja: "@a@b＊「わかった！　がんばるんだぜ。\n\tそして　ここで　はたらきたくなったら\n\tまた　いつでも　もどってきなよ。\n@c2@"
"54":
  de: "@a@b*: Das ist doch ein Waffengeschäft hier, oder?\n@c2@"
  en: "@a@b*: 'Tis a weapon shop ye're runnin' here, is it not?\n@c2@"
  es: "@a@b*: ¿Viendes armas, vierdad?\n@c2@"
  fr: "@a@b*ⓢ Vous vendez des armes ici, c'est bien çaⓡ\n@c2@"
  it: "@a@b*: Questo l'è un negozio di armi, 'unn è vero?\n@c2@"
  ja: "@a@b＊「ここは　武器の店かね？\n@c2@"
"55":
  de: "@a@b*: Könnte ich mir Eure Waren ansehen?\n@c2@"
  en: "@a@b*: Will ye give me a look at yer wares, then?\n@c2@"
  es: "@a@b*: ¿Mi enseñas que armas viendes?\n@c2@"
  fr: "@a@b*ⓢ Alors est-ce que je peux jeter un coup d'œil à la marchandiseⓡ\n@c2@"
  it: "@a@b*: Posso dare un'occhiata alla merce?\n@c2@"
  ja: "@a@b＊「売っている物を　見せてくれるかね？\n@c2@"
"56":
  de: "@a@b*: Ich hätte gern %a73100, bitte.\nDafür biete ich Euch %a00620 Goldmünze%H620%X%Yn%Z.\n@c2@"
  en: "@a@b*: I'll take %a04100, please.\nI can offer ye %a00620 gold coin%H620%X%Ys%Z for it.\n@c2@"
  es: "@a@b*: Mi llievaré %a04100.\nTi puedo ofrecer %a00620 moneda%H620%X%Ys%Z de oro. ¿Viendes?\n@c2@"
  fr: "@a@b*ⓢ Je vais vous prendre %a04100.\nJe peux vous en donner %a00620 pièce%I620%X%Ys%Z d'or.\n@c2@"
  it: "@a@b*: Vorrei %a04100, per favore.\nPosso paga' %a00620 %H620%Xmoneta%Ymonete%Z d'oro.\n@c2@"
  ja: "@a@b＊「%a00100を　買おう。\n\t%a00620Ｇで　いいんだね？\n@c2@"
"57":
  de: "@a@b*: Ihr seid mir ja ein ganz Lustiger, was?\n@c2@"
  en: "@a@b*: Ye're a proper comedian, aren't ye?\n@c2@"
  es: "@a@b*: Eres un briomista, ¿eh?\n@c2@"
  fr: "@a@b*ⓢ Vous êtes un comique, vous, heinⓡ\n@c2@"
  it: "@a@b*: Ma che, mi prendi 'ngiro?!\n@c2@"
  ja: "@a@b＊「あんた　冗談が　好きだなあ……。\n@c2@"
"58":
  de: "@a@b*: Es war eine Freude, mit Euch Geschäfte zu machen. Ich komme auf jeden Fall mal wieder vorbei.\n@c2@"
  en: "@a@b*: It's been a pleasure doin' business with ye.\nI'll be showin' me face in here again, so I will.\n@c2@"
  es: "@a@b*: Ha sido un placier hacer niegocios contigo.\nVolvieré a pasar por esta tienda, eso sieguro.\n@c2@"
  fr: "@a@b*ⓢ C'était un plaisir de faire affaire avec vous.\nJe repasserai vous voir. Vous pouvez me croire.\n@c2@"
  it: "@a@b*: È un piacere fa' affari hon te! Tornerò sihuramente a farti visita.\n@c2@"
  ja: "@a@b＊「いや　いい買い物をした。\n\tありがとう。　また来るよ。\n@c2@"
"59":
  de: "@a@b*: Ihr lasst es mir billiger? Das ist wunderbar! Wie viel würde denn %a04100 kosten? Wäre%H750%X%Yn%Z %a00750 Goldmünze%H750%X%Yn%Z genug?\n@c2@"
  en: "@a@b*: Ye'll knock some money off? That's grand!\nHow much for %a04100, then?\nWould %a00750 gold coin%H750%X%Ys%Z cover it?\n@c2@"
  es: "@a@b*: ¿Mi vas a hacer una riebaja? ¡Genial!\n¿Cuánto por %a04100, entonces? ¿%a00750 monieda%H750%X%Ys%Z de oro?\n@c2@"
  fr: "@a@b*ⓢ Vous me faites un petit rabaisⓡ Excellentⓠ Alors combien pour %a04100ⓡ\nEst-ce que %a00750 pièce%I750%X%Ys%Z ferai%I750%Xt%Yent%Z l'affaireⓡ\n@c2@"
  it: "@a@b*: Mi fai lo sconto? Magnifiho!\nAllora huanto mi hosta %a04100?\n㈡\n*: Se 'un mi fai paga' più di %a00750 %H750%Xmoneta%Ymonete%Z d'oro, si fa l'affare.\n@c2@"
  ja: "@a@b＊「なんと　まけてくれるのかい！\n\t%a00100を　いくらで買える？\n\t%a00750Ｇで　いいのかね？\n@c2@"
"60":
  de: "@a@b*: Es war eine Freude, mit Euch Geschäfte zu machen. Ich komme auf jeden Fall mal wieder vorbei.\n@c2@"
  en: "@a@b*: It's been a pleasure doin' business with ye.\nI'll be showin' me face in here again, so I will.\n@c2@"
  es: "@a@b*: Ha sido un placier hacer niegocios contigo.\nVolvieré a pasar por esta tienda, eso sieguro.\n@c2@"
  fr: "@a@b*ⓢ C'était un plaisir de faire affaire avec vous.\nJe repasserai vous voir. Vous pouvez me croire.\n@c2@"
  it: "@a@b*: È un piacere fa' affari hon te! Tornerò sihuramente a farti visita.\n@c2@"
  ja: "@a@b＊「いや　いい買い物をした。\n\tありがとう。　また来るよ。\n@c2@"
"61":
  de: "@a@b*: Was? Ihr seid mit dem Preis %a61100 raufgegangen? Und wollt jetzt %a00750 Goldmünze%H750%X%Yn%Z das Stück haben?\n@c2@"
  en: "@a@b*: What? Ye've put up the price of %a01100? You charge %a00750 gold coin%H750%X%Ys%Z a piece now, ye say?\n@c2@"
  es: "@a@b*: ¿Cómo? ¿Qué has subido el priecio de %A100%Xlos%Z%B100%Xlas%Z%C100%Xlas%Z %a01100?¿Dices que ahora cobrias %a00750 moneda%H750%X%Y%Zs de oro por unidad?\n@c2@"
  fr: "@a@b*ⓢ Comment çaⓡ %0%a03100 ont augmentéⓡ Maintenant, vous en voulez %a00750 pièce%I750%X%Ys%Z d'or, c'est çaⓡ\n@c2@"
  it: "@a@b*: Cosa? %0%a03100 costano di più adesso?\nOra voi %a00750 %H750%Xmoneta%Ymonete%Z d'oro a pezzo?\n@c2@"
  ja: "@a@b＊「なんだって？　値上げをしたって？\n\t%a00100は　今日から\n\t%a00750Ｇに　なったって？\n@c2@"
"62":
  de: "@a@b*: Tja, ich werde es trotzdem kaufen. Danke.\n@c2@"
  en: "@a@b*: Well, I s'pose I'll stump up for it still an' all.\nThanks very much.\n@c2@"
  es: "@a@b*: Bueno, supiongo habriá que comprar igual.\nCompro.\n@c2@"
  fr: "@a@b*ⓢ J'imagine que j'ai pas trop le choix.\nMerci beaucoup.\n@c2@"
  it: "@a@b*: Va bene, chiudiamo l'affare, va! Grazie.\n@c2@"
  ja: "@a@b＊「しかたないから　その値段で　買おう。\n\tどうも　ありがとよ。\n@c2@"
"63":
  de: "@a@b*: Bei dem Preis komme ich auch ohne aus! Man sieht sich...\n@c2@"
  en: "@a@b*: Well I can live without it at that kind o' price!\nI'll be seein' y'around, then...\n@c2@"
  es: "@a@b*: ¡Bueno, eso mi pariece un precio excesivo!\nNo compro, sí...\n@c2@"
  fr: "@a@b*ⓢ À ce prix-là, je préfère encore m'en passerⓠ\nÀ la prochaine...\n@c2@"
  it: "@a@b*: Beh, visto il prezzo, posso vive' anche senza! Ci si rivede...\n@c2@"
  ja: "@a@b＊「だったら　いらねえや。\n\tじゃあ　またな！\n@c2@"
"64":
  de: "@a@b*: Ich glaube, ich habe nicht genug Geld bei mir.\n@c2@"
  en: "@a@b*: Looks like I'm a wee bit short of odds for it.\n@c2@"
  es: "@a@b*: Pariece que mi falta un poco para que mi alcance.\n@c2@"
  fr: "@a@b*ⓢ Je crois que je n'ai pas assez d'argent.\n@c2@"
  it: "@a@b*: Temo di 'unn ave' tanti huattrini da spende'.\n@c2@"
  ja: "@a@b＊「おっと　それを買うには\n\tお金が　足りなかったよ。\n@c2@"
"65":
  de: "@a@b*: Entschuldigung für die Umstände. Bin schon weg.\n@c2@"
  en: "@a@b*: Sorry fer disturbin' ye.\nI'll be on me way now.\n@c2@"
  es: "@a@b*: Pierdona que ti haya molestado.\nNo compro.\n@c2@"
  fr: "@a@b*ⓢ Désolé pour le dérangement. Je vous laisse.\n@c2@"
  it: "@a@b*: Chiedo scusa pe' i'ddisturbo. Vò via.\n@c2@"
  ja: "@a@b＊「邪魔をしたな。　また　来るよ。\n@c2@"
"66":
  de: "@a@b*: Moment mal... Mein Beutel ist voll, wie ich sehe.\n@c2@"
  en: "@a@b*: Hang on. Hold yer hour...\nLooks like me bag's full, so it is.\n@c2@"
  es: "@a@b*: A ver, espiera un momento...\nPariece que mi bolsa está llena.\n@c2@"
  fr: "@a@b*ⓢ Mais... attendez un peu... On dirait que mon sac est plein.\n@c2@"
  it: "@a@b*: Aspetta un attimo... Ho di già la borsa piena.\n@c2@"
  ja: "@a@b＊「おや？　待ってくれ。\n\tどうも　持ち物が　いっぱい\n\tだったようだ。\n@c2@"
"67":
  de: "@a@b*: Ich muss erst was verkaufen oder wegwerfen, dann komm ich aber zurück.\n@c2@"
  en: "@a@b*: I'll have to sell sometin' or throw sometin' away.\nThen I'll be back to make me purchase.\n@c2@"
  es: "@a@b*: Tiendré que vendier o deshacierme de algo.\nLuego ya volvieré para hacer mis compras.\n@c2@"
  fr: "@a@b*ⓢ Je vais devoir vendre ou jeter quelque chose, et après je m'occuperai de mes achats.\n@c2@"
  it: "@a@b*: Devo prima vende' o butta' via hualcosa. Dopo tornerò pe' fa' acquisti...\n@c2@"
  ja: "@a@b＊「どこかで　売るか　捨てるか\n\tしてくるから　よろしくな！\n@c2@"
"68":
  de: "@a@b*: Unglaublich! Damit kann ich leider gar nichts anfangen, aber würdet Ihr mir das Teil vielleicht trotzdem verkaufen?\n@c2@"
  en: "@a@b*: Unbelievable!\n'Tis only impossible for me to use!\nBut would ye sell it to me still an' all?\n@c2@"
  es: "@a@b*: ¡Increíble!\n¡No puedo utilizar%A100%Xlo%Z%B100%Xla%Z%C100%Xla%Z!\n¿Piero mi %A100%Xlo%Z%B100%Xla%Z%C100%Xla%Z vas a viender de todos modos?\n@c2@"
  fr: "@a@b*ⓢ C'est fouⓠ Impossible de m'en servirⓠ\nMais accepteriez-vous de me %A100%Xle%Z%B100%Xla%Z%C100%X%Z vendre quand mêmeⓡ\n@c2@"
  it: "@a@b*: 'Un ci posso crede'! 'Un posso usa' huest'oggetto! Ma 'unn è che me lo venderesti ugualmente?\n@c2@"
  ja: "@a@b＊「なんと！\n\t私は　これを　装備できないようだ。\n\tそれでも　売ってくれるかね？\n@c2@"
"69":
  de: "@a@b*: Danke schön.\nIch kenne da ein paar Leute, die daran bestimmt Interesse hätten. Auf Wiedersehen.\n@c2@"
  en: "@a@b*: Thanks very much.\nI'm sure I've a friend or two that'd like one o' these.\nBye, now.\n@c2@"
  es: "@a@b*: Muchias gracias.\nSieguro que a alguno de mis amigos le gustará.\nCompro.\n@c2@"
  fr: "@a@b*ⓢ Merci beaucoup. M'est avis que ça pourrait faire plaisir à quelques-uns de mes amis.\nAu revoir.\n@c2@"
  it: "@a@b*: Grazie molte. Di sicuro honosco hualcuno a cui potrebbe servi'! Ci si vede!\n@c2@"
  ja: "@a@b＊「どうも　ありがとう。\n\t知り合いにでも　あげることにするよ。\n\tじゃあ　またな。\n@c2@"
"70":
  de: "@a@b*: Das dachte ich mir. Dann gehe ich wohl besser...\n@c2@"
  en: "@a@b*: I thought as much.\nI'll be off out of yer hair now, then...\n@c2@"
  es: "@a@b*: Eso mi había pariecido.\nBueno, pues no compro...\n@c2@"
  fr: "@a@b*ⓢ C'est bien ce qu'il me semblait.\nJe vous laisse tranquille dans ce cas...\n@c2@"
  it: "@a@b*: Lo immaginavo. Famm'andà via, va!\n@c2@"
  ja: "@a@b＊「やっぱり　ダメか……。\n\t邪魔をしたな。\n@c2@"
"71":
  de: "@a@b*: Das ist ja alles sehr lustig, aber zeigt Ihr mir jetzt, was Ihr verkaufen wollt, oder nicht?\n@c2@"
  en: "@a@b*: Sure an' that's mighty funny, an' all, but would ye show me what ye're sellin' now, would ye?\n@c2@"
  es: "@a@b*: Sí, es muy diviertido, ya sé, pero ¿quieres hacierme el fiavor de enseñarme lo que tienes para vendier?\n@c2@"
  fr: "@a@b*ⓢ C'est vrai que c'est drôle, mais sérieusement, vous voulez pas me montrer ce que vous vendezⓡ\n@c2@"
  it: "@a@b*: Te sei proprio un simpatihone, 'un c'è che di'! Allora, me la mostri la merce 'nvendita?\n@c2@"
  ja: "@a@b＊「おい　おい。\n\t冗談言わないで　見せてくれよ。\n@c2@"
"72":
  de: "@a@b*: Ist es nicht? Oh, entschuldigt bitte die Störung...\n@c2@"
  en: "@a@b*: 'Tis not? Well I'm sorry fer botherin' ye, then...\n@c2@"
  es: "@a@b*: ¿No? Pues entoncies, perdona por moliestarte.\n@c2@"
  fr: "@a@b*ⓢ Ah nonⓡ Excusez-moi pour le dérangement alors...\n@c2@"
  it: "@a@b*: Ah, no? Scusa per averti disturbato, eh!\n@c2@"
  ja: "@a@b＊「なんだ　ちがうのか。\n\tどうも　邪魔をしたな。\n@c2@"
"73":
  de: "@a@b*: Das ist doch ein Waffengeschäft hier, oder?\n@c2@"
  en: "@a@b*: 'Tis a weapon shop ye're runnin' here, is it not?\n@c2@"
  es: "@a@b*: ¿Viendes armas, vierdad?\n@c2@"
  fr: "@a@b*ⓢ Vous vendez des armes ici, c'est bien çaⓡ\n@c2@"
  it: "@a@b*: Questo l'è un negozio di armi, 'unn è vero?\n@c2@"
  ja: "@a@b＊「ここは　武器の店かね？\n@c2@"
"74":
  de: "@a@b*: Ich hab hier eine Waffe, die ich gern verkaufen würde. Wärt Ihr interessiert?\n@c2@"
  en: "@a@b*: I've a weapon I'm lookin' to sell.\nWould ye be interested in it at all?\n@c2@"
  es: "@a@b*: Tiengo un arma que quiero vendier.\n¿Ti interesaría compriarla?\n@c2@"
  fr: "@a@b*ⓢ J'ai une arme à vendre et je me disais que vous seriez peut-être intéresséⓡ\n@c2@"
  it: "@a@b*: Avrei un'arma da vende'. T'interessa la hosa?\n@c2@"
  ja: "@a@b＊「じつは　武器を売りたいんだが\n\tかってくれるかね？\n@c2@"
"75":
  de: "@a@b*: Es ist %a04100. Ein seltenes Stück. Und ich möchte auch nur %a00620 Goldmünze%H620%X%Yn%Z dafür. Sind wir im Geschäft?\n@c2@"
  en: "@a@b*: 'Tis %a04100, so it is. A rare piece. An' I only want %a00620 gold coin%H620%X%Ys%Z for it. Will ye buy it?\n@c2@"
  es: "@a@b*: Se trata de %a04100, eso es. Un ejiemplar muy raro. Y mi confiormo con %a00620 moneda%H620%X%Ys%Z de oro. ¿Comprias?\n@c2@"
  fr: "@a@b*ⓢ C'est %a04100. Une pièce rare. J'en demande seulement %a00620 pièce%I620%X%Ys%Z d'or. Vous êtes preneurⓡ\n@c2@"
  it: "@a@b*: Si tratta di %a04100. L'è una rarità. Chiedo solo %a00620 %H620%Xmoneta%Ymonete%Z d'oro.\n㈡\n*: Allora, che ne dici?\n@c2@"
  ja: "@a@b＊「%a00100なんだが\n\tこいつは　ちょっと　手に入らないぜ。\n\t%a00620Ｇ　でどうだい？\n@c2@"
"76":
  de: "@a@b*: Ja, ja, Ihr habt ein gutes Auge, wirklich. Aus Euch wird noch ein großer Geschäftsmann, ganz sicher. Bis später.\n@c2@"
  en: "@a@b*: Aye, ye've a keen eye, so ye have.\nYe'll be a grand salesman one day, I'm sure o' that.\nSee ye 'round, then.\n@c2@"
  es: "@a@b*: Tienes buen ojo, eso sieguro.\nUn día sierás un gran comierciante.\nViendo, sí.\n@c2@"
  fr: "@a@b*ⓢ On peut dire que vous avez l'œil. Vous deviendrez un grand marchand, je vous le garantis.\nÀ bientôt.\n@c2@"
  it: "@a@b*: Te c'hai fiuto! Te sì che sai home si fanno l'affari! Ci si rivede!\n@c2@"
  ja: "@a@b＊「いやあ　お目が　高い！\n\tあんた　いい商売人になるぜ！\n\tじゃあ　ありがとよ。\n@c2@"
"77":
  de: "@a@b*: Nein? Dann werd ich's irgendwo anders versuchen.\n@c2@"
  en: "@a@b*: You wouldn't?\nI'll have to try somewhere else, then.\n@c2@"
  es: "@a@b*: ¿No compras?\nTiendré que intientarlo en otro sitio.\n@c2@"
  fr: "@a@b*ⓢ Nonⓡ\nDans ce cas, je vais aller voir la concurrence.\n@c2@"
  it: "@a@b*: L'artiholo 'un ti garba? 'Unn importa, troverò qualcuno a cui interessi!\n@c2@"
  ja: "@a@b＊「なんだ　いらないのか……。\n\tそれじゃあ　他をあたってみるか。\n@c2@"
"78":
  de: "@a@b*: Nein? Das ist aber schade. Na ja, dann muss ich's in einem anderen Geschäft versuchen.\n@c2@"
  en: "@a@b*: You wouldn't?\nWell that's a shame, so it is. I'll try another shop.\n@c2@"
  es: "@a@b*: ¿No compras?\nVaya, es una piena. Priobaré en otra tienda.\n@c2@"
  fr: "@a@b*ⓢ Vraiment pasⓡ\nC'est bien dommage pour vous. Je vais aller dans un autre magasin.\n@c2@"
  it: "@a@b*: 'Un t'interessa l'affare? 'Un fa nulla. Andrò in un altro negozio!\n@c2@"
  ja: "@a@b＊「そうか　仕方ないな。\n\t別の店に　行くとしよう。\n@c2@"
"79":
  de: "@a@b*: Oh, dann entschuldigt bitte die Störung.\n@c2@"
  en: "@a@b*: It isn't?\nWell I'm sorry fer botherin' ye then.\n@c2@"
  es: "@a@b*: ¿No?\nVaya, entoncies perdona por moliestarte.\n@c2@"
  fr: "@a@b*ⓢ C'est pas le casⓡ\nBon bah, excusez le dérangement.\n@c2@"
  it: "@a@b*: No? D'accordo, e scusa per averti fatto perde' tempo!\n@c2@"
  ja: "@a@b＊「なんだ　ちがうのか。\n\tどうも　邪魔をしたな。\n@c2@"
"80":
  de: "@a@b*: Was ist das nur für ein Laden hier? Wie lang wollt Ihr mich denn noch warten lassen?\n@c2@"
  en: "@a@b*: D'ye want to do any business at all at all?\nHow long are ye goin' to keep me waitin' here?\n@c2@"
  es: "@a@b*: ¿Estás interiesado en hacier niegocios?\n¿Cuánto tiempo piensas tienerme esperando?\n@c2@"
  fr: "@a@b*ⓢ Vous voulez vendre quelque chose ou pasⓡ\nVous allez me faire attendre encore longtempsⓡ\n@c2@"
  it: "@a@b*: Ma te voi lavora' oppure no? Huanto tempo mi voi tene' qui ad aspetta' i comodi tua?\n@c2@"
  ja: "@a@b＊「この店は　商売する気が\n\tあるのかい？\n\tいつまで　待たせるつもりだ！\n@c2@"
"81":
  de: "@a@b*: Was ist los, Talun? Schon genug gearbeitet für heute?\n@c2@"
  en: "@a@b*: What is it, Taloon?\nAre ye knockin' off for the day already?\n@c2@"
  es: "@a@b*: ¿Qué pasa, Taloon?\n¿Ya ti vuelves a casa?\n@c2@"
  fr: "@a@b*ⓢ Qu'est-ce qu'il y a, Taloonⓡ\nTu as déjà fini ta journée de travailⓡ\n@c2@"
  it: "@a@b*: Che c'è, Baldo? Hai già smesso di lavora' per oggi?\n@c2@"
  ja: "@a@b＊「どうした？\n\t今日は　もう　おしまいにするかい？\n@c2@"
"82":
  de: "@a@b*: Dann möchtest du bestimmt deinen Lohn haben. Ich zähl mal gerade...\n@c2@"
  en: "@a@b*: Right. I s'pose ye'll be wantin' yer pay, then.\nI'll just tot it up now...\n@c2@"
  es: "@a@b*: De acuerdo. Supongo que quierrás tu paga, entonces.\nDieja que haga mis cuentas...\n@c2@"
  fr: "@a@b*ⓢ Bien. Je suppose que tu veux ta paie.\nJe vais faire les comptes...\n@c2@"
  it: "@a@b*: Bene, allora vorrai esse' pagato. Ora ti fò il conto...\n@c2@"
  ja: "@a@b＊「そうかい。　ごくろうだったな。\n\tじゃあ　今　給料を計算するからな。\n@c2@"
"83":
  de: "@a@b*: Hier, bitte schön. Dein Verdienst für heute.\n@c2@"
  en: "@a@b*: Here y'are. This is what ye've earned today.\n@c2@"
  es: "@a@b*: Aquí estiá. Esto es lo que has ganado hoy.\n@c2@"
  fr: "@a@b*ⓢ Tiens. Voici ce que tu as gagné aujourd'hui.\n@c2@"
  it: "@a@b*: Ecco qui. Huesto è quanto hai guadagnato oggi.\n@c2@"
  ja: "@a@b＊「ほれ　今日の給料だ。\n@c2@"
"84":
  de: "@a@bTorneko hat %a00630 Goldmünze%H630%X%Yn%Z verdient.\n@c2@"
  en: "@a@bTorneko earns %a00630 gold coin%H630%X%Ys%Z.\n@c2@"
  es: "@a@bTorneko gana %a00630 moneda%H630%X%Ys%Z de oro.\n@c2@"
  fr: "@a@bTorneko reçoit %a00630 pièce%I630%X%Ys%Z d'or.\n@c2@"
  it: "@a@bBaldo riceve %a00630 %H630%Xmoneta%Ymonete%Z d'oro.\n@c2@"
  ja: "@a@bトルネコは　%a00630Ｇを　手に入れた！\n@c2@"
"85":
  de: "@a@b*: Bis morgen früh, dann. Und komm nicht wieder zu spät!\n@c2@"
  en: "@a@b*: I'll see ye back here in the mornin', then.\nDon't be late!\n@c2@"
  es: "@a@b*: Ti vieré mañiana por la mañiana.\n¡No llegues tarde!\n@c2@"
  fr: "@a@b*ⓢ À demain matin.\nEt ne sois pas en retardⓠ\n@c2@"
  it: "@a@b*: Allora ci si vede domattina. E vedi di 'unn arriva' tardi home al solito!\n@c2@"
  ja: "@a@b＊「明日も　よろしくたのむぜ。\n@c2@"
"86":
  de: "@a@b*: Bis morgen früh, dann. Und komm nicht wieder zu spät!\n@c2@"
  en: "@a@b*: I'll see ye back here in the mornin', then.\nDon't be late!\n@c2@"
  es: "@a@b*: Ti vieré mañiana por la mañiana.\n¡No llegues tarde!\n@c2@"
  fr: "@a@b*ⓢ À demain matin.\nEt ne sois pas en retardⓠ\n@c2@"
  it: "@a@b*: Allora ci si vede domattina. E vedi di 'unn arriva' tardi home al solito!\n@c2@"
  ja: "@a@b＊「明日も　よろしくたのむぜ。\n@c2@"
"87":
  de: "@a@b*: Ach, du meine Güte! Wir haben ja überhaupt nichts eingenommen heute, du faules Stück!\n@c2@"
  en: "@a@b*: ...Janey Mac!\nYe've done not an ounce o' work today, ye worthless lump!\n@c2@"
  es: "@a@b*: ¡Por las ciejas de la profieta!\n¡No has triabajado ni una pizca hoy, gandul inútil!\n@c2@"
  fr: "@a@b*ⓢ C'est pas possibleⓠ\nTu n'as rien fait de la journée, espèce de bon à rienⓠ\n@c2@"
  it: "@a@b*: Maremma pigra! Ma oggi 'unn hai hombinato nulla! Sei un incapace!\n@c2@"
  ja: "@a@b＊「……って　おいおい。\n\tお前さん　今日は　ちっとも\n\t働いてねえじゃないか！\n@c2@"
"88":
  de: "@a@b*: Und dann willst du auch noch bezahlt werden?! Das ist wirklich dreist von dir!\n@c2@"
  en: "@a@b*: An' still ye come lookin' to be paid, so ye do!\nSure an' ye've a hard neck on ye, so ye have!\n@c2@"
  es: "@a@b*: ¿Y mi vienes a piedir la paga?\n¡Qué cara más dura, hay quie ver!\n@c2@"
