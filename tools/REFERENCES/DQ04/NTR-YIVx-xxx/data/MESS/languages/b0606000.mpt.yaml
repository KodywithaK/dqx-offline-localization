"0":
  de: "@a@b*: He, Ihr da! Habt Ihr schon gehört?\n@c2@"
  en: "@a@b*: You there! Have you heard?\n@c2@"
  es: "@a@b*: ¡Eh, %H860%Xtú%Y%R000%Xvosotras%Yvosotros%Z%Z! ¿Lo %H860%Xhas%Yhabéis%Z oído?\n@c2@"
  fr: "@a@b*ⓢ Hé, vous, làⓠ Vous avez entenduⓡ\n@c2@"
  it: "@a@b*: Ehi, %H860%Xtu! Hai saputo%Yvoi! Avete saputo%Z?\n@c2@"
  ja: "@a@b＊「旅の人！　知ってますか？\n@c2@"
"1":
  de: "@a@b*: Ha! Dachte ich mir's doch, dass Ihr das sagen würdet!\n@c2@"
  en: "@a@b*: Ha! That's just what I thought you'd say. Anyway...\n@c2@"
  es: "@a@b*: ¡Ja! Es justo lo que pensé que %H860%Xdirías%Ydiríais%Z. No importa...\n@c2@"
  fr: "@a@b*ⓢ Haⓠ J'étais sûr que vous répondriez ça.\nEnfin bref...\n@c2@"
  it: "@a@b*: Hah! Sapevo che %H860%Xmi avresti%Ymi avreste%Z risposto così!\n@c2@"
  ja: "@a@b＊「やっぱりなあ。\n\tあなたは　そう言うと思いましたよ。\n\tさて……\n@c2@"
"2":
  de: "@a@b*: Ich hab mal gehört, dass der Mond nur existiert, wenn man ihn ansieht.\n@c2@"
  en: "@a@b*: I heard somewhere that the moon only exists when you're looking at it.\n@c2@"
  es: "@a@b*: En alguna parte he escuchado que la luna solo existe cuando la miras.\n@c2@"
  fr: "@a@b*ⓢ J'ai entendu dire quelque part que la lune n'existe que lorsqu'on la regarde.\n@c2@"
  it: "@a@b*: Ma sarà vero che la luna esiste solo quando qualcuno la guarda?\n@c2@"
  ja: "@a@b＊「なんでも　お月さまは\n\t見ているときにしか\n\t存在していないらしいですよ！\n@c2@"
"3":
  de: "@a@b*: Aber ich glaube, solche Gedanken bringen die Leute bloß durcheinander. Nun ja...\n@c2@"
  en: "@a@b*: But I think that kind of thing is just people getting their minds in a muddle. Anyway...\n@c2@"
  es: "@a@b*: Pero creo que simplemente se trata de la gente, que se hace líos. No importa...\n@c2@"
  fr: "@a@b*ⓢ À mon avis, les gens qui réfléchissent à ça s'embrouillent le cerveau pour rien. Enfin bref...\n@c2@"
  it: "@a@b*: Mah! Secondo me, si tratta di una di quelle domande zen che servono solo a far perdere tempo alla gente...\n@c2@"
  ja: "@a@b＊「まあ　そんな話は\n\t誰かの　かんちがい　でしょうけどね。\n\tさて……\n@c2@"
"4":
  de: "@aKarl Oink@b%a00260 ist eine mächtig feine Stadt, die schwer im Kommen ist.\n@c2@"
  en: "@aPrelvis Esley@bThis here's the finest little boom town in all the world. Viva %a00260!\n@c2@"
  es: "@aPrelvis Esley@bEsta es la ciudad más boyante del mundo. ¡Viva %a00260!\n@c2@"
  fr: "@aGino Allaydi@bCette petite ville champignon est la plus rock n' roll que j'aie jamais vue.\nVive %a00260ⓠ\n@c2@"
  it: "@aElvis Bresly@bNon sarà Greislend, ma questa è certamente la più entusiasmante città di frontiera che abbia mai visto. Viva %a00260!\n@c2@"
  ja: "@a@bガライ「ここは　すれちがいの町\n\t%a00260。\n@c2@"
"5":
  de: "@aKarl Oink@bSie hat sich im Handumdrehen von ein paar Hütten zu einer richtigen kleinen Stadt gemausert.\n@c2@"
  en: "@aPrelvis Esley@bShe's gone from a couple o' shacks to a serious settlement in no time flat. Ain't nobody livin' in the ghetto in this city o' dreams.\n@c2@"
  es: "@aPrelvis Esley@bHa pasado de tener un par de chozas a convertirse en un verdadero asentamiento, oh yeaaaah. En esta ciudad de ensueño no hay guetos que valgan.\n@c2@"
  fr: "@aGino Allaydi@bEn un rien de temps, ses quelques bicoques se sont transformées en une véritable agglomération. Et personne ne vit dans le ghetto, ici.\n@c2@"
  it: "@aElvis Bresly@bNel giro di poco tempo, quello che era un villaggio di quart'ordine si è trasformato in una città sfavillante. Qui tutti hanno un posto in prima fila!\n@c2@"
  ja: "@a@bガライ「ちいさな集落から\n\t発展した　自由と希望の都さ。\n@c2@"
"6":
  de: "@aKarl Oink@bÜbrigens, alle meine Entchen sind noch am Teich, aber die Unke dort habe ich schon ewig nicht mehr gesehen. Wo sie wohl abgeblieben ist?\n@c2@"
  en: "@aPrelvis Esley@bBy the way, I ain't seen hide nor hair o' that little hound frog used to hang out by the pond there for a while now. I wonder where's he's got to...\n@c2@"
  es: "@aPrelvis Esley@bPor cierto, no le he vuelto a ver el pelo a ese ranito que solía descansar junto al estanque. Me pregunto adónde habrá ido...\n@c2@"
  fr: "@aGino Allaydi@bAu fait, ça fait un moment que je n'ai pas vu le petit crapaud qui traînait là-bas, près de la mare. Je me demande où il est passé...\n@c2@"
  it: "@aElvis Bresly@bA proposito, è un pezzo che non vedo un membro del mio amato pubblico... La rana che girava dalle parti dello stagno è sparita. Dove sarà andata?\n@c2@"
  ja: "@a@bガライ「ところで　池のそばにいた\n\tカエルの姿を　見かけないけど\n\tどこに行ったのかな……？\n@c2@"
"7":
  de: "@a@b*: Beim Klabautermann! Das hier ist unsere prima Pionierpension! Hier können sich müde Pioniere von ihren Reisestrapazen erholen!\n@c2@"
  en: "@a@b*: Arrr. This 'ere be the Pioneeratorium. 'Twas built to welcome weary pioneers like a port at the end of a long and perilous voyage.\n@c2@"
  es: "@a@b*: Arrr. Esto es el pioneratorio. Se ha construido para acoger a los cansados pioneros, como un puerto al final de un largo y peligroso viaje.\n@c2@"
  fr: "@a@b*ⓢ Grrr. Ceci est le pionnieratorium. Il a été construit pour accueillir les pionniers fatigués, un peu comme un port à la fin d'un long et périlleux voyage.\n@c2@"
  it: "@a@b*: Questo è l'Ostello dei Pionieri, costruito per accogliere i viaggiatori stanchi. È un porto sicuro in cui tutti possono gettare l'ancora.\n@c2@"
  ja: "@a@b＊「ここは　すれちがい大使たちを\n\tもてなすための　迎ひん館だ。\n@c2@"
"8":
  de: "@a@b*: Setzt ruhig Euren Kurs dort hinein und seht Euch um!\n@c2@"
  en: "@a@b*: Sail on in an' have yourself a look, me hearty!\n@c2@"
  es: "@a@b*: ¡%H860%XAcércate%YAcercaos%Z y %H860%Xecha%Yechad%Z un vistazo, %H860%Xgrumete%Ygrumetes%Z!\n@c2@"
  fr: "@a@b*ⓢ Mettez le cap dessus et allez voir par %H860%Xvous-même%Yvous-mêmes%Z.\n@c2@"
  it: "@a@b*: Forza! %H860%XVai%YAndate%Z a dare un'occhiata! È il più bell'ostello che abbia mai solcato i sette mari! Ehm... Volevo dire che è un vero splendore...\n@c2@"
  ja: "@a@b＊「さあ　入ってくれや！\n@c2@"
"9":
  de: "@a@b*: (Winsel) Wuff!\n@c2@"
  en: "@a@b*: (whine) Arf!\n@c2@"
  es: "@a@b*: ¡(auuuu) Arf!\n@c2@"
  fr: "@a@b*ⓢ (gémissement) Ouarfⓠ\n@c2@"
  it: "@a@b*: Arf!\n@c2@"
  ja: "@a@b＊「ワン　ワン！\n@c2@"
"10":
  de: "@a@b*: Wau!\n@c2@"
  en: "@a@b*: Ruff!\n@c2@"
  es: "@a@b*: ¡Gruff!\n@c2@"
  fr: "@a@b*ⓢ Ououffⓠ\n@c2@"
  it: "@a@b*: Wuff!\n@c2@"
  ja: "@a@b＊「ク～ン。\n@c2@"
"11":
  de: "@aFrieder Niete@bGuten Tag. Ich bin Frieder Niete. Ich sitze hier und denke über die anderen Welten nach, auf die wir bei unseren Zufallsbegegnungen stoßen.\n@c2@"
  en: "@aStreo Louse@bHowdy, I'm Streo Louse. I been sittin' here havin' me a good ol' think about the other worlds we come across when we have them there chance encounters.\n@c2@"
  es: "@aHortera y Casset@bQué onda, me llamo Hortera y Casset. \n㈡\nPues estaba aquí pensando en esos otros mundos que encontramos cuando tuvimos esos encuentros al azar.\n@c2@"
  fr: "@aAmédée Carte@bSalut, j'm'appelle Amédée Carte. J'me suis assis ici pour réfléchir sérieusement aux autres mondes qu'on découvre lors des rencontres aléatoires.\n@c2@"
  it: "@aProfessor Mente@bEhilà! Sono il Professor Mente, e stavo pensando agli altri mondi che incrociamo quando abbiamo la fortuna di fare un incontro a sorpresa.\n@c2@"
  ja: "@a@bソクラス「ぼくは　ソクラス。\n\tいま　すれちがいの世界について\n\t考えていました。\n@c2@"
"12":
  de: "@aFrieder Niete@bWas, wenn Ihr und Euer Gegenüber glaubt, Ihr lebt in derselben Welt, aber in Wahrheit lebt Ihr in ganz anderen Welten?\n@c2@"
  en: "@aStreo Louse@bWhat if you an' the varmint next to you seemed like you was livin' in the same world, when in fact you wasn't in the same world at all...\n@c2@"
  es: "@aHortera y Casset@bQué pasaría si %H860%Xusted%Yustedes%Z y los que %H860%Xle%Yles%Z rodean creyeran que están viviendo en el mismo mundo cuando en realidad no estuvieran en el mismo mundo...\n㈡\nY ustedes no fueran ustesdes y sus circunstancias no fueran sus circunstancias.\n@c2@"
  fr: "@aAmédée Carte@bC'est vrai, qu'est-ce qui s'passe quand vous croyez que vous et votre voisin, vous vivez dans le même monde, alors que ce n'est pas vrai du tout...\n@c2@"
  it: "@aProfessor Mente@bCosa accadrebbe se il viandante in cui ci imbattiamo, e che pensiamo provenire dal nostro stesso mondo, in realtà giungesse da un altro pianeta?\n@c2@"
  ja: "@a@bソクラス「あなたと　あなたの隣にいる人は\n\t同じ世界にいるようで　じつは\n\t別の世界に　暮らしているとしたら？\n@c2@"
"13":
  de: "@aFrieder Niete@bOder was, wenn die Welt, wie Ihr sie seht, ganz anders ist als so, wie die anderen sie sehen?\n@c2@"
  en: "@aStreo Louse@bOr what if the world as you see it is entirely different to how others see the durned thing?\n@c2@"
  es: "@aHortera y Casset@b¿O qué pasaría si el mundo que %H860%Xpercibe%Yperciben%Z fuera totalmente diferente al que ven los demás?\n@c2@"
  fr: "@aAmédée Carte@bOu bien si le monde que vous voyez est en fait complètement différent de celui que les autres voient.\n@c2@"
  it: "@aProfessor Mente@bOppure se il nostro mondo, così come lo vediamo noi, fosse visto dagli altri in maniera totalmente differente?\n@c2@"
  ja: "@a@bソクラス「自分に見えている世界が\n\t他人には　まったく　ちがう世界に\n\t見えているとしたら？\n@c2@"
"14":
  de: "@aFrieder Niete@bHerrje! Je mehr ich darüber nachdenke, desto wirrer wird's mir im Gemüt!\n@c2@"
  en: "@aStreo Louse@bSheesh! Once I start thinkin' like that, the more I think, the less I seem to understand...\n@c2@"
  es: "@aHortera y Casset@b¡Ay! ¡Caramba! Cuanto más pienso en esas cosas, pues más bola me hago...\n@c2@"
  fr: "@aAmédée Carte@bAïe... Quand je commence à réfléchir comme ça, plus je pense, moins je comprends...\n@c2@"
  it: "@aProfessor Mente@bOh, diamine! Quando comincio ad avere questi pensieri, mi va il cervello in bambola! Più ci rifletto, meno mi ci raccapezzo!\n@c2@"
  ja: "@a@bソクラス「……そんなふうに\n\t考えれば　考えるほど\n\t分からないことだらけで……\n@c2@"
"15":
  de: "@aSeñor Paco@bHola! Iss bin Señor Paco, der spressende Mustang!\n@c2@"
  en: "@aMr. Ned@bWhy howdy there, I'm Mr. Ned, the talkin' horse.\n@c2@"
  es: "@aSr. Jaco@bQué onda, soy el Sr. Jaco, el caballo parlante.\n@c2@"
  fr: "@a@bSaluhuhu, je suis M. Ned, le cheval qui parle.\n@c2@"
  it: "@aQuirino@bHola! Yo soy Quirino, el caballo parlantes.\n@c2@"
  ja: "@a@bエド「わたしは　しゃべる馬のエド。\n@c2@"
"16":
  de: "@aSeñor Paco@bWie iss hierherkam? Und wiesso iss die Sprache der Menssen spresse? Iss erinnere miss niss. Aber iss bin hier, das ist die Hauptsache.\n@c2@"
  en: "@aMr. Ned@bHow on earth did I come to be here? An' how comes I kin talk like a human bean? Why, I don't remember nothin'. But at least I'm here, that's the mane thing.\n@c2@"
  es: "@aSr. Jaco@b¿Cómo llegué aquí? ¿Y cómo es que puedo platicar como un humano? Pues no me recuerdo nada nomás. Pero estoy aquííí y eso es lo que importa.\n@c2@"
  fr: "@aM. Ned@bQu'est-ce que je fais iciⓡ Et comment ça se fait que je parle comme un humainⓡ Eh bien, je ne me souviens de rien. En tout cas, je suis là, c'est le principal.\n@c2@"
  it: "@aQuirino@bComo soy finitos aqui? Y por qué un caballo parlas como un hombre? Non me lo ricordos... Però yo soy aqui, y questo è quellos que contas.\n@c2@"
  ja: "@a@bエド「なぜ　この地に　やって来たのか……\n\tなぜ　話すことができるのか……\n\t何もおぼえていないのです。\n@c2@"
"17":
  de: "@aSeñor Paco@bIss habe nur eine versswommene Erinnerung an eine prässtige Burg und eine Riesenssar von Leuten.\n@c2@"
  en: "@aMr. Ned@bI got me a fuzzy memory of a mighty purdy castle, an' a whole herd o' people...\n@c2@"
  es: "@aSr. Jaco@bTengo recuerdos de un castillo, bien repleto de gente por todas partes...\n@c2@"
  fr: "@aM. Ned@bJ'ai le souvenir assez confus d'un grand château et de tout un troupeau de gens...\n@c2@"
  it: "@aQuirino@bYo tengo un ricordos de un castillo muy grandes e bellos. Y c'era tanta tanta gentes...\n@c2@"
  ja: "@a@bエド「ただ　うっすらと　おぼえているのは\n\t美しいお城と　たくさんの人びと……。\n@c2@"
"18":
  de: "@aSeñor Paco@bAber, caramba! Würde iss die Burg wiederssehen, würde mir sisser noch mehr wieder einfallen.\n@c2@"
  en: "@aMr. Ned@bI guess if I seen that castle again, I could maybe remember me a little mareⓚⓛ uh, a little more, I mean. \n@c2@"
  es: "@aSr. Jaco@bSi volviera a ver el castillo, pues me recordaría otras cosas, nomás. \n@c2@"
  fr: "@aM. Ned@bJe parie un picotin que si je revoyais le château, jument, euh... je m'en souviendrais et que d'autres choses me reviendraient en mémoire.\n@c2@"
  it: "@aQuirino@bForse, si yo potessi vederes el castillo un'altra voltas, la mia memorias tornerebbe a funzionares...\n@c2@"
  ja: "@a@bエド「ふたたび　あの　お城を見れば\n\t思い出すかも知れないのですが。\n@c2@"
"19":
  de: "@aRocky@bIch bin zum Teich gegangen, um diese verflixte Unke zu fangen, aber ich muss den kleinen Kerl wohl verpasst haben.\n@c2@"
  en: "@aRocky@bI went down to the pond to catch that freakin' frog, but I guess I just missed the little guy.\n@c2@"
  es: "@aRoque@bMe acerqué hasta el estanque para capturar a ese maldito ranito, pero imagino que llegué demasiado tarde.\n@c2@"
  fr: "@aRocky@bJ'suis descendu jusqu'à la mare pour attraper ce crapaud bizarre, mais j'ai dû le rater.\n@c2@"
  it: "@aRocco@bVolevo catturare la rana che vive nei pressi dello stagno, ma non sono riuscito a trovarla!\n@c2@"
  ja: "@a@bロッコ「池のほとりにいた　カエルを\n\tとりに行ったら　ひとあしちがいで\n\tいなくなっちゃったんです。\n@c2@"
"20":
  de: "@aRocky@bIch kann einfach nicht arbeiten, wenn es meiner Adrian nicht gut geht. Ich kann an gar nichts anderes mehr denken.\n@c2@"
  en: "@aRocky@bI just can't do no work if my Adrian ain't feelin' good. I can't keep my mind on nothin' else.\n@c2@"
  es: "@aRoque@bNo puedo trabajar en nada si mi Adriana no se siente bien. No me la puedo quitar de la cabeza.\n@c2@"
  fr: "@aRocky@bJe peux pas travailler quand mon Adrienne se sent pas bien. J'arrive pas à me concentrer sur autre chose.\n@c2@"
  it: "@aRocco@bNon riesco a lavorare se la mia Adriana è triste. Quando non la vedo sorridere mi sento come un pugile suonato. Adriaaanaaaaa!\n@c2@"
  ja: "@a@bロッコ「妻のきげんが　悪いと\n\t仕事が　はかどらないんですよね……。\n@c2@"
"21":
  de: "@aAdrian@bIch wollte meinem Rocky ein leckeres Unkenfrikassee kochen...\n@c1@"
  en: "@aAdrian@bI wanted to make my Rocky a beautiful froggy fricassée for his dinner...\n@c1@"
  es: "@aAdriana@bQuería hacerle a mi Roque unas deliciosas ancas de rana para cenar...\n@c1@"
  fr: "@aAdrienne@bJe voulais préparer à mon Rocky une belle fricassée de cuisses de grenouilles pour le dîner...\n@c1@"
  it: "@aAdriana@bAvrei voluto preparare al mio Rocco il suo piatto preferito: un bell'arrosto di rana...\n@c1@"
  ja: "@a@bナナ「今日の　ごはんは\n\tカエルの　からあげに　しようと\n\t思っていたんだけど……\n@c1@"
"22":
  de: "@aAdrian@b... aber ich konnte die verflixte Frikassee-Grundzutat nicht finden: eine Unke! Nicht mal das kann ich! Waaah! (Schluchz)\n@c1@"
  en: "@aAdrian@b...but I couldn't find the freakin' fricassée's fundamental fixin': a frog! Oh, I'm a failure!\nWaaah! (sob)\n@c1@"
  es: "@aAdriana@b... pero no fui capaz de encontrar el ingrediente esencial del plato: ¡la rana! ¡Oh, no valgo para nada!\n¡Aaah! (snif)\n@c1@"
  fr: "@aAdrienne@b... mais je n'ai pas réussi à mettre la main sur l'ingrédient principalⓢ une grenouilleⓠ Oh, je ne suis bonne à rienⓠ Ouuiinⓠ (sanglot)\n@c1@"
  it: "@aAdriana@bMa non sono riuscita a trovare l'ingrediente fondamentale: la RANA! Sigh! Sono disperaaataaa! Waaah!\n@c1@"
  ja: "@a@bナナ「かんじんの　材料が\n\tみつからないのよねぇ。\n\tぷんぷん。\n@c1@"
"23":
  de: "@a@bDa ist ein Buch namens ⓞPioniria-Chronikenⓟ. %0%a00120 nimmt es vom Regal und liest einen Abschnitt daraus.\n@c0@"
  en: "@a@bThere's a book called ⓗChronicles of Pioniriaⓘ. %0%a00120 takes it from the shelf and reads\nan excerpt.\n@c0@"
  es: "@a@bHay un libro titulado ⓕLas Crónicas de Pioniriaⓖ. %0%a00120 lo coge de la estantería y lee un fragmento.\n@c0@"
  fr: "@a@bL'un des livres s'intitule ⓥChroniques de Pioniriaⓦ. %0%a00120 le prend sur l'étagère et en lit un passage.\n@c0@"
  it: "@a@bC'è un libro intitolato ⓕCronache di Castromercatumⓖ. %0%a00120 lo prende dallo scaffale e ne legge un brano...\n@c0@"
  ja: "@a@b「マーリブの伝説」と\n書かれた本がある。\n%a00120は　手にとって読んだ。\n@c0@"
"24":
  de: "@a@bⓞWenn die Stadt wieder zur Burg wird, wird sein Körper aus dem Gefäß im südöstlichen Raum wieder auferstehen.\n@c0@"
  en: "@a@bⓗWhen the town once more becomes a castle, his\nbody shall rise again from the pot in the south-western room.\n@c0@"
  es: "@a@bⓕCuando la ciudad sea de nuevo un castillo, su cuerpo volverá a través de la tinaja de la sala sudoriental.ⓖ\n@c0@"
  fr: "@a@bⓥLorsque la ville redeviendra un château, son corps s'élèvera de la jarre située dans la pièce du sud-est.\n@c0@"
  it: "@a@bⓕQuando la città tornerà a essere un castello, il suo corpo sorgerà nuovamente dalla giara che si trova nella sala sud-orientale.ⓖ\n@c0@"
  ja: "@a@b“この町が　城となれば　南西の部屋\n　つぼに　かこまれた　つぼに\n　その者の　カラダは　復活すべし。\n@c0@"
"25":
  de: "@a@bDann wird aus den Tiefen des Schlosses, aus den Tiefen einer Truhe voller Schmerzen, auch sein Herz wiederauferstehen.\n@c0@"
  en: "@a@bⓗThen, from the depths of the castle, from deep within a treasure chest filled with pain, his heart also shall rise.\n@c0@"
  es: "@a@bⓕDespués, en lo más recóndito del castillo, de las profundidades de un cofre del tesoro repleto de dolor, se elevará su corazón.ⓖ\n@c0@"
  fr: "@a@bPuis, des profondeurs du château, des profondeurs d'un coffre au trésor empli de douleur, son cœur s'élèvera lui aussi.\n@c0@"
  it: "@a@bⓕPoi sarà la volta del suo cuore, che emergerà dalle profondità del castello, dagli abissi di un forziere colmo di dolore.ⓖ\n@c0@"
  ja: "@a@b“そして　城のはるか地下　深く\n　痛みをともなう宝箱に\n　その者の　心は　復活するであろう。\n@c0@"
"26":
  de: "@a@bUnd schließlich der größte Schatz der Sultana von Pioniria... die Truhe vor dem Kerker... das Geschenk ihres geliebten Königs.ⓟ\n@c0@"
  en: "@a@bⓗAnd finally, the Sultana of Pioniria's most treasured possession...in a treasure chest locked in a cell...the gift of her beloved king.ⓘ\n@c0@"
  es: "@a@bⓕY finalmente, la posesión más codiciada de la Sultana de Pioniria... el cofre del tesoro en el exterior de la cárcel... el regalo de su amado rey.ⓖ\n@c0@"
  fr: "@a@bEt enfin, le bien le plus précieux de la sultane de Pioniria... le coffre au trésor à l'extérieur de la prison... le cadeau de son bien-aimé roi.ⓦ \n@c0@"
  it: "@a@bⓕInfine toccherà al tesoro più caro alla Sultana di Castromercatum... Fuori dalla prigione, lo scrigno donato dal suo amato sovrano.ⓖ\n@c0@"
  ja: "@a@b“そして　最後に　マーリブ王妃の宝物……\n　ろうやの先の　宝箱。\n　愛しい王の　おくりもの。\n@c0@"
"27":
  de: "@a@b*: Wie geht's? Ich bin Archi O. Loge und bin in diese schöne Stadt gekommen, um ein bisschen nach alten Schätzen zu wühlen.\n@c2@"
  en: "@a@b*: How d'ye do? I'm Archie O'Logist, an' I've come to this fine ole town to do me some diggin' fer ancient treasures, so I have.\n@c2@"
  es: "@a@b*: ¿Cómo estiás? Mi lliamo Al-Queb-Ologo y he vienido a esta ciudad en biusca de antiguos tiesoros ocultos, sí.\n@c2@"
  fr: "@a@b*ⓢ Comment allez-vousⓡ Je suis Hervé Stige et je suis venu dans cette belle ville pour faire quelques fouilles et tenter de trouver d'anciens trésors.\n@c2@"
  it: "@a@b*: Come va? Io so' Dino Gionz, e so' venuto huì pe' cerca' un po' di tesori perduti.\n@c2@"
  ja: "@a@bオロジス「わたしは　オロジス。\n\t発掘のため　この町へ来た\n\t考古学者です。\n@c2@"
"28":
  de: "@aArchi O. Loge@bWo ich schon mal hier bin, wollt Ihr die Geschichte des alten Pioniria hören, der Stadt, die vor vielen Jahren hier gestanden hat?\n@c2@"
  en: "@aArchie O'Logist@bWhile I'm here, are ye wantin' to hear the tale of ole Pioniria, the town that stood here many moons ago?\n@c2@"
  es: "@aAl-Queb-Ologo@bYa que estoy aquí, ¿%H860%Xti%Yos%Z gustiaría escuchar la histioria de Pioniria, la ciudad que aquí se erigía hace muchas liunas?\n@c2@"
  fr: "@aHervé Stige@bPendant que j'y suis, avez-vous envie d'entendre l'histoire de l'antique Pioniria, la ville qui se dressait ici il y a de cela de nombreuses lunesⓡ\n@c2@"
  it: "@aDino Gionz@bVisto che ci siamo, che %H860%Xt'andrebbe%Yv'andrebbe%Z d'ascolta' la storia di Castromercatum, la città fortificata che sorgeva proprio huì tant'anni fa?\n@c2@"
  ja: "@a@bオロジス「せっかくですから　この地に\n\t伝わる　マーリブの伝説を\n\tお聞かせしましょうか？\n@c2@"
"29":
  de: "@aArchi O. Loge@bDie Sultane der Stadt Pioniria hatten ein höchst heiliges und magisches Gefäß, das von einer Generation an die nächste weitergegeben wurde.\n@c2@"
  en: "@aArchie O'Logist@bThe sultans of the city o' Pioniria had a most holy an' magical pot that was passed from one generation to the next.\n@c2@"
  es: "@aAl-Queb-Ologo@bLos siultanes de la ciudad de Pioniria poseían una tinaja sagrada y mágica que se triansmitía de genieración en genieración.\n@c2@"
  fr: "@aHervé Stige@bLes sultans de la ville de Pioniria possédaient une jarre sacrée et magique, qu'ils se transmettaient de génération en génération.\n@c2@"
  it: "@aDino Gionz@bI regnanti di Castromercatum custodivano gelosamente una giara magiha, che si passavano di generazione 'ngenerazione.\n@c2@"
  ja: "@a@bオロジス「伝説の都　マーリブ王国には\n\t先代の王から伝わる\n\t神器のつぼが　あったそうな。\n@c2@"
"30":
  de: "@aArchi O. Loge@bAber auf dem Gefäß muss ein schrecklicher Fluch gelegen haben.\n@c2@"
  en: "@aArchie O'Logist@bBut it seems the pot was afflicted by some sort o' terrible curse, so it was.\n@c2@"
  es: "@aAl-Queb-Ologo@bPero dicen que la tinaja sufría una tierrible maldición, sí.\n@c2@"
  fr: "@aHervé Stige@bMais cette jarre semblait être sous l'emprise d'une terrible malédiction.\n@c2@"
  it: "@aDino Gionz@bMa la leggenda narra che quell'oggetto fosse maledetto. Proprio hosì!\n@c2@"
  ja: "@a@bオロジス「しかし　そのつぼは　本当は\n\t呪いのつぼ　だったのです。\n@c2@"
"31":
  de: "@aArchi O. Loge@bEines Tages nun wollten Eknu, der junge Sultan von Pioniria, und seine Gemahlin das Gefäß öffnen, ohne zu wissen, was es enthielt.\n@c2@"
  en: "@aArchie O'Logist@bNow, one day, Farog, the young sultan o' Pioniria, an' his lady wife were after openin' that pot, not knowin' o' course o' the curse it contained.\n@c2@"
  es: "@aAl-Queb-Ologo@bUn día, Rainierito III, el joven siultán de Pioniria, y su espiosa, decidieron abrir la tinaja, evidientemente sin saber la maldición que contienía.\n@c2@"
  fr: "@aHervé Stige@bUn jour, Carapo, le jeune sultan de Pioniria, et son épouse tentèrent d'ouvrir cette jarre. Bien sûr, ils ignoraient tout de la malédiction qui l'entourait.\n@c2@"
  it: "@aDino Gionz@bUn giorno, Ran Sultan e la su' giovane moglie decisero d'apri' la giara, 'un sapendo della maledizione che gravava su di essa...\n@c2@"
  ja: "@a@bオロジス「マーリブの若き王　レオンと\n\t王妃は　呪いのつぼと知らずに\n\tフタを　開けてしまいました。\n@c2@"
"32":
  de: "@aArchi O. Loge@bUnd als sie es öffneten, erschien ein grausiger Geist und beschwor einen furchtbaren Sandsturm herauf.\n@c2@"
  en: "@aArchie O'Logist@bNo sooner did they pop it open than a most horrible genie appeared, an' summoned up a swirlin' great sandstorm.\n@c2@"
  es: "@aAl-Queb-Ologo@bEn el momiento en que la abrieron, de su intierior surgió un malviado genio que invocó una tierrible tiormenta de arena.\n@c2@"
  fr: "@aHervé Stige@bÀ peine l'eurent-ils ouverte qu'un horrible génie apparut et déclencha une gigantesque tempête de sable.\n@c2@"
  it: "@aDino Gionz@bAppena l'aprirono, saltò fori un genio terribile, che scatenò una potentissima tempesta di sabbia.\n@c2@"
  ja: "@a@bオロジス「すると　つぼの中から\n\t封印されていた魔物が　現れ\n\tとてつもない砂嵐を　呼びよせました！\n@c2@"
"33":
  de: "@aArchi O. Loge@bDer Sturm toste und wütete. Er verschlang die Stadt Pioniria und vergrub sie tief im Wüstensand.\n@c2@"
  en: "@aArchie O'Logist@bThe storm raged an' rumbled an' swallowed up the city o' Pioniria, buryin' it deep beneath the desert sands.\n@c2@"
  es: "@aAl-Queb-Ologo@bLa tiormenta asoló, diestruyó y engulló la ciudad de Pioniria, y la siepultó bajo las arienas del desierto.\n@c2@"
  fr: "@aHervé Stige@bLa tempête se déchaîna pendant longtemps et ses tourbillons finirent par engloutir la cité de Pioniria, l'enterrant au plus profond des sables du désert.\n@c2@"
  it: "@aDino Gionz@bLa tempesta fu talmente devastante che tutta Castromercatum fu 'nghiottita dalla sabbia. Della grande città-castello 'un restò più traccia!\n@c2@"
  ja: "@a@bオロジス「マーリブの都は　みるみる\n\t砂嵐に　飲み込まれ\n\tくずれ落ち……\n@c2@"
"34":
  de: "@aArchi O. Loge@bDer tapfere Eknu, der sich dem Geist entgegenstellte, um sein geliebtes Reich zu verteidigen, wurde dazu verflucht, eine grauenvolle neue Gestalt anzunehmen.\n@c2@"
  en: "@aArchie O'Logist@bAn' the gallant Farog, who tried his best to stand up to the genie an' protect his beloved kingdom, was cursed to take on a terrible new form.\n@c2@"
  es: "@aAl-Queb-Ologo@bY el valiente Rainierito III, que hizo friente al genio para prioteger su amado reino, fue priesa de una maldición y se convirtió en algo horrible.\n@c2@"
  fr: "@aHervé Stige@bLe vaillant Carapo avait fait de son mieux pour s'opposer au génie et protéger son royaume bien-aimé.\n㈡\nPour cet acte de bravoure, il fut maudit et transformé en une terrible créature.\n@c2@"
  it: "@aDino Gionz@bE il povero Ran Sultan, che aveva cercato di protegge' il su' regno e di ferma' il genio, fu colpito da un sortilegio, e mutato in una strana creatura...\n@c2@"
  ja: "@a@bオロジス「さらに　ゆうかんにも　魔物に\n\t立ち向かった　レオン王は\n\t呪いで　姿を変えられてしまったとか。\n@c2@"
"35":
  de: "@aArchi O. Loge@bKein Interesse, was? Auch gut. Vielleicht ein andermal, hm?\n@c0@"
  en: "@aArchie O'Logist@bNot interested, eh? Fair enough. Maybe another\ntime, eh?\n@c0@"
  es: "@aAl-Queb-Ologo@bNo %H860%Xti%Yos%Z interiesa, ¿verdad? Mi piarece bien. Puede que en otra ocasión, ¿sí?\n@c0@"
  fr: "@aHervé Stige@bÇa ne vous intéresse pas, heinⓡ Très bien. Une autre fois, peut-être.\n@c0@"
  it: "@aDino Gionz@bMa come?! 'Un %H860%Xt'interessa%Yv'interessa%Z?! Peggio per %H860%Xte%Yvoi%Z, perché la storia l'è bella!\n@c0@"
  ja: "@a@bオロジス「そうですか。\n\tでは　また　べつの機会に。\n@c0@"
"36":
  de: "@aPrissi@bGuten Tag. Ich bin Prinzessin Prissi. Das Leben im Palast hat mich fürchterlich gelangweilt, also bin ich hierher geflüchtet.\n@c1@"
  en: "@aPrincess Pam@bGood day to you, I am Princess Pam. I was bored\nof life in the palace, so I decided to escape and\ncome here.\n@c1@"
  es: "@aPrincesa Vanessa@bHola, caracola, soy la Princesa Vanessa. Estaba tan, tan, aburrida de la vida en palacio que decidí escaparme y venir aquí.\n@c1@"
  fr: "@aPrincesse Pam@bBonjour, je suis la princesse Pam. La vie de château m'ennuyait, alors j'ai décidé de m'enfuir et de venir ici.\n@c1@"
  it: "@aPrincipessa Locca@bSalute a %H860%Xte%Yvoi%Z! Io sono la Principessa Locca. Stufa degli agi della vita di corte, ho deciso di venire qui, dove potrò condurre un'esistenza modesta e misurata.\n@c1@"
  ja: "@a@bデイジー「わたしは　デイジー。\n\tお城の生活が　たいくつで\n\t抜け出してきたのよ。\n@c1@"
"37":
  de: "@aPrissi@bEs ist hier so wunderbar friedlich ohne den schwatzhaften alten Trottel ⓚⓛ ich glaube, hier will ich für immer bleiben.\n@c1@"
  en: "@aPrincess Pam@bIt's so peaceful without that old fool prattling on at me all the time. I think I could live here forever.\n@c1@"
  es: "@aPrincesa Vanessa@bEstoy tan, tan, a gusto sin ese viejo loco echándome discursos todo el rato... Creo que podría vivir aquí para siempre.\n@c1@"
  fr: "@aPrincesse Pam@bTout est si tranquille quand je n'ai pas ce vieux radoteur sur le dos. Je crois que je pourrais vivre ici pour toujours.\n@c1@"
  it: "@aPrincipessa Locca@bNon ne potevo più di avere intorno schiere di servitori pronti a esaudire qualsiasi mio desiderio! Era un vero stress! Qui, invece, sto proprio bene!\n@c1@"
  ja: "@a@bデイジー「うるさい　じいやもいないし\n\tこのまま　ずっと　ここに\n\t住もうかしら……。\n@c1@"
"38":
  de: "@aKarl Oink@bDas ist das geschäftigste Örtchen auf der Welt! Es lebe %a00260!\nDie Stadt wächst im Sauseschritt!\n@c2@"
  en: "@aPrelvis Esley@bThis here's the finest little boom town in all the world. Viva %a00260!\nThis place's gone from zip to hip in no time at all!\n@c2@"
  es: "@aPrelvis Esley@bEsta es la ciudad más boyante del mundo. ¡Viva %a00260!\n¡Este lugar ha prosperado de la noche a la mañana!\n@c2@"
  fr: "@aGino Allaydi@bCette petite ville champignon est la plus rock n' roll que j'aie jamais vue.\nVive %a00260ⓠ\n㈡\nElle a poussé en un rien de tempsⓠ\n@c2@"
  it: "@aElvis Bresly@bQuesta è la più entusiasmante città di frontiera che abbia mai visto. Viva %a00260! In breve tempo diventerà una vera metropoli!\n@c2@"
  ja: "@a@bガライ「ここは　すれちがいの都\n\t%a00260。\n\t小さな集落から　成長した町さ。\n@c2@"
"39":
  de: "@aKarl Oink@bÜbrigens, alle meine Entchen sind noch am Teich, aber die Unke dort habe ich schon ewig nicht mehr gesehen. Wo sie wohl abgeblieben ist?\n@c2@"
  en: "@aPrelvis Esley@bBy the way, I ain't seen hide nor hair o' that little hound frog used to hang out by the pond there for a while now. I wonder where's he's got to...\n@c2@"
  es: "@aPrelvis Esley@bPor cierto, no le he vuelto a ver el pelo a ese ranito que solía descansar junto al estanque. Me pregunto adónde habrá ido...\n@c2@"
  fr: "@aGino Allaydi@bAu fait, ça fait un moment que je n'ai pas vu le petit crapaud qui traînait là-bas, près de la mare. Je me demande où il est passé...\n@c2@"
  it: "@aElvis Bresly@bA proposito, è un pezzo che non vedo un membro del mio amato pubblico... La rana che girava dalle parti dello stagno è sparita. Dove sarà andata?\n@c2@"
  ja: "@a@bガライ「ところで　池のそばにいた\n\tカエルの姿を　見かけないけど\n\tどこに行ったのかな……？\n@c2@"
"40":
  de: "@aKarl Oink@bWas? Ein Monster aus der Tiefe hat ihn verscheucht? Ach du lieber Augustin!\n@c2@"
  en: "@aPrelvis Esley@bWhat? He was bein' all shook up by some kind o' monster down underground there?\n@c2@"
  es: "@aPrelvis Esley@b¿Cómo? ¿Le preocupaba no sé qué monstruo de las profundidades?\n@c2@"
  fr: "@aGino Allaydi@bQuoiⓡ Il a été effrayé par un monstre et s'est cachéⓡ Je n'y crois pasⓠ\n@c2@"
  it: "@aElvis Bresly@bChe cosa? Si è spaventata perché ha visto un mostro sbucato dal sottosuolo?!\n@c2@"
  ja: "@a@bガライ「え？　地下で　変な生き物に\n\tおそわれてたって？\n@c2@"
"41":
  de: "@aKarl Oink@bOch! Etwa die kleine Zini? Ich war ja überrascht, als die Kleine in die Stadt kam, aber ich habe sie sofort erkannt.\n@c2@"
  en: "@aPrelvis Esley@bAw shucks! You mean little ol' Mary Curey? I was surprised myself when that little sister came to town, but I knew it was her, soon as I seen 'er.\n@c2@"
  es: "@aPrelvis Esley@b¡Que me corten el tupé! ¿%H860%XTe refieres%YOs referís%Z a la pequeña Mari Curi? Me sorprendió verla llegar a la ciudad, pero supe que era ella desde el momento en que la vi.\n@c2@"
  fr: "@aGino Allaydi@bMince, vous voulez parler de la petite Médée Médocⓡ\n㈡\nJ'ai en effet été surpris quand elle est arrivée en ville, mais je savais que c'était elle dès que je l'ai vue.\n@c2@"
  it: "@aElvis Bresly@bAh, %H860%Xvuoi%Yvolete%Z dire la cara Dolores Tecuro! L'ho riconosciuta subito. È una delle mie fan più fedeli.\n@c2@"
  ja: "@a@bガライ「ああ　ベホイミンか！\n\t彼が　この町に来たときは　おどろいたけど\n\tなんだか　他人に思えなくて……。\n@c2@"
"42":
  de: "@aFrieder Niete@bAber das ist wohl eines der Dinge, die das Leben zu einer Herausforderung und einem Vergnügen zugleich machen.\n@c2@"
  en: "@aStreo Louse@bBut I guess that's one o' the things makes this ol' life a challenge an' a pleasure all at once.\n@c2@"
  es: "@aHortera y Casset@bPero imagino que es una de las cosas que hacen a esta vida pues un puro reto y un puro placer.\n@c2@"
  fr: "@aAmédée Carte@bMais j'suppose que ça fait partie d'ces choses qui font que la vie est à la fois un défi et un plaisir.\n@c2@"
  it: "@aProfessor Mente@bEppure tali riflessioni sono utilissime per tenere in allenamento la testa! Ehm... forse farei meglio a concedere un po' di riposo al mio cervello...\n@c2@"
  ja: "@a@bソクラス「だからこそ　人生は面白いって\n\tぼくは　思うのです。\n@c2@"
"43":
  de: "@aRocky@bIch bin zum Teich gegangen, um diese verflixte Unke zu fangen, aber ich muss den kleinen Kerl wohl verpasst haben.\n@c2@"
  en: "@aRocky@bI went down to the pond to catch that freakin' frog, but I guess I just missed the little guy.\n@c2@"
  es: "@aRoque@bMe acerqué hasta el estanque para capturar a ese maldito ranito, pero imagino que llegué demasiado tarde.\n@c2@"
  fr: "@aRocky@bJ'suis descendu jusqu'à la mare pour attraper ce crapaud bizarre, mais j'ai dû le rater.\n@c2@"
  it: "@aRocco@bVolevo catturare la rana che vive nei pressi dello stagno, ma non sono riuscito a trovarla!\n@c2@"
  ja: "@a@bロッコ「池のほとりにいた　カエルを\n\tとりに行ったら　ひとあしちがいで\n\tいなくなっちゃったんです。\n@c2@"
"44":
  de: "@aRocky@bHe, übrigens, ich hab von so 'nem Typen in einer Bar in Havre Léon gehört, der König werden will oder so.\n@c2@"
  en: "@aRocky@bHey, by the way, I been hearin' about a guy in some bar in Havre Léon, talkin' about wantin' to be a king or somethin'.\n@c2@"
  es: "@aRoque@bPor cierto, he escuchado algo sobre un tipo de un bar de Havre Léon, que quiere convertirse en rey o algo así.\n@c2@"
  fr: "@aRocky@bHé, au fait, j'ai entendu parler d'un gars dans une taverne, à Port Lionel, qui raconte qu'il veut devenir roi, ou quelque chose comme ça.\n@c2@"
  it: "@aRocco@b%H860%XHai%YAvete%Z saputo di quel tizio che frequenta un locale a Port Léon, e dice di voler diventare un re? Certo che ce n'è di gente strana in giro, eh?\n@c2@"
  ja: "@a@bロッコ「ところで　旅の人から聞いたんですが\n\tハバリアの町の酒場に　王さまに\n\tなりたがっている人が　いたとか。\n@c2@"
"45":
  de: "@aRocky@bUnser Kuhkaff ist zu einer echten Stadt geworden. Wenn wir uns jetzt noch einen König holen, wird die Burg nicht mehr lange auf sich warten lassen.\n@c2@"
  en: "@aRocky@bThis town's gone from nuttin' to bein' a real contender. I figure we get us a king now, and the castle won't be too long followin'.\n@c2@"
  es: "@aRoque@bEsta ciudad se ha convertido en un verdadero atractivo. Imagino que si conseguimos un rey, el castillo no tardará en llegar.\n@c2@"
  fr: "@aRocky@bPartie d'rien, cette ville rivalise maintenant avec les meilleures. On n'a plus qu'à s'trouver un roi, et le château devrait suivre rapidement.\n@c2@"
  it: "@aRocco@bQuesta città è diventata un vero peso massimo! Sono certo che, se avessimo un re, qui ci sarebbe anche un castello!\n@c2@"
  ja: "@a@bロッコ「この町も　ずいぶん発展したし\n\tあとは　王さまでも　いれば\n\tお城っぽく　なるんじゃないでしょうか。\n@c2@"
"46":
  de: "@aPrissi@bGuten Tag. Ich bin Prinzessin Prissi. Das Leben im Palast hat mich fürchterlich gelangweilt, also bin ich hierher geflüchtet.\n@c1@"
  en: "@aPrincess Pam@bGood day to you, I am Princess Pam. I was bored\nof life in the palace, so I decided to escape and\ncome here.\n@c1@"
  es: "@aPrincesa Vanessa@bHola, caracola, soy la Princesa Vanessa. Estaba tan, tan, aburrida de la vida en palacio que decidí escaparme y venir aquí.\n@c1@"
  fr: "@aPrincesse Pam@bBonjour, je suis la princesse Pam. La vie de château m'ennuyait, alors j'ai décidé de m'enfuir et de venir ici.\n@c1@"
  it: "@aPrincipessa Locca@bSalute a %H860%Xte%Yvoi%Z! Io sono la Principessa Locca. Stufa degli agi della vita di corte, ho deciso di venire qui, dove potrò condurre un'esistenza modesta e misurata.\n@c1@"
  ja: "@a@bデイジー「わたしは　デイジー。\n\tお城の生活が　たいくつで\n\t抜け出してきたのよ。\n@c1@"
"47":
  de: "@aPrissi@bEs ist hier so wunderbar friedlich ohne den schwatzhaften alten Trottel ⓚⓛ ich glaube, hier will ich für immer bleiben.\n@c1@"
  en: "@aPrincess Pam@bIt's so peaceful without that old fool prattling on at me all the time. I think I could live here forever.\n@c1@"
  es: "@aPrincesa Vanessa@bEstoy tan, tan, a gusto sin ese viejo loco echándome discursos todo el rato... Creo que podría vivir aquí para siempre.\n@c1@"
  fr: "@aPrincesse Pam@bTout est si tranquille quand je n'ai pas ce vieux radoteur sur le dos. Je crois que je pourrais vivre ici pour toujours.\n@c1@"
  it: "@aPrincipessa Locca@bNon ne potevo più di avere intorno schiere di servitori pronti a esaudire qualsiasi mio desiderio! Era un vero stress! Qui, invece, sto proprio bene!\n@c1@"
  ja: "@a@bデイジー「うるさい　じいやもいないし\n\tこのまま　ずっと　ここに\n\t住もうかしら……。\n@c1@"
"48":
  de: "@aPrissi@bAber wenn ich schon hier bleibe, hätte ich doch ganz gern ein ordentliches Schlafgemach in einem Palast und auch ein paar Wachen.\n@c1@"
  en: "@aPrincess Pam@bBut if one is to live here for good, it would be preferable to have a well-appointed palatial bedchamber, and perhaps some guards also.\n@c1@"
  es: "@aPrincesa Vanessa@bPero si tengo que vivir aquí para siempre, estaría súper, súper bien tener una habitación palaciega completamente amueblada...\n㈡\n... y puede que también algunos guardias.\n@c1@"
  fr: "@aPrincesse Pam@bMais pour envisager une installation définitive dans cet endroit, il serait préférable d'avoir une chambre confortablement meublée dans un palais.\n㈡\nEt peut-être aussi quelques gardes.\n@c1@"
  it: "@aPrincipessa Locca@bOra, per essere davvero felice, non mi serve altro che un palazzo sontuosamente arredato, trentasette domestici e un plotone di guardie del corpo...\n@c1@"
  ja: "@a@bデイジー「でも　ずっと暮らすなら\n\tゴージャスな　お城の部屋が　いいわね。\n\tそれと　おつきの　兵士もいるし。\n@c1@"
"49":
  de: "@aPrissi@bAch, wo wir gerade dabei sind: In Laissez Fayre bin ich einem jungen Mann begegnet, der eine Ausbildung zur Wache durchlief.\n@c1@"
  en: "@aPrincess Pam@bSpeaking of which, when I was passing through Laissez Fayre, I did chance across a young man who was training as a guardsman.\n@c1@"
  es: "@aPrincesa Vanessa@bPor cierto, el otro día, cuando pasaba por Laissez Fayre me crucé con un chico que estaba entrenando para ser guardia real.\n@c1@"
  fr: "@aPrincesse Pam@bEn parlant de cela, tandis que je traversais la ville de TeaforTwo, j'ai croisé par hasard un jeune homme qui s'entraînait pour devenir garde.\n@c1@"
  it: "@aPrincipessa Locca@bA tal proposito, mi sovviene che a Laissez Fayre ho incontrato un giovanotto che si stava giusto addestrando per diventare una guardia del corpo...\n@c1@"
  ja: "@a@bデイジー「そういえば　モンバーバラに\n\tよった時　兵士みならいの男の子を\n\t見たわよ。\n@c1@"
"50":
  de: "@aHoss@bTut mir mächtig leid, aber ich bin noch nicht ganz fertig.\n@c2@"
  en: "@aZack@bMighty sorry, I ain't quite done it jes' yet.\n@c2@"
  es: "@aZacarías@bLo siento, pero va a ser que todavía no he terminado con esto.\n@c2@"
  fr: "@aIsaac@bJ'suis vraiment désolé, mais j'ai pas encore tout à fait fini.\n@c2@"
  it: "@aGiango@bSpiacente, ma non ho ancora finito.\n@c2@"
  ja: "@a@bドン・モハメ「すまぬ！\n\tまだ　できぬのじゃ。\n@c2@"
"51":
  de: "@aHoss@bGebt mir nur noch ein Momentchen, ich bin bald so weit!\n@c2@"
  en: "@aZack@bIf you'll gimme jes' a little more time, I'll have it done real soon!\n@c2@"
  es: "@aZacarías@b¡Si me %H860%Xdas%Ydais%Z un poco más tiempo, lo acabaré cuanto antes! ¿vale?\n@c2@"
  fr: "@aIsaac@bSi vous m'laissez encore un tout p'tit peu de temps, ça sera terminé très bientôtⓠ\n@c2@"
  it: "@aGiango@bMi ci vorrà ancora un po' di tempo. Porta pazienza, amico...\n@c2@"
  ja: "@a@bドン・モハメ「もうちょっと\n\t待ってくれい！\n@c2@"
"52":
  de: "@aHoss@bUnd ich ⓚⓛ Hey! Ihr seid's!\n@c2@"
  en: "@aZack@bAn' Iⓚⓛ Hey! It's you!\n@c2@"
  es: "@aZacarías@bY me..., ¡eh! ¡Si %H860%Xeres tú%Ysois %R000%Xvosotras%Yvosotros%Z%Z!\n@c2@"
  fr: "@aIsaac@bEt je... Hé, mais c'est vousⓠ\n@c2@"
  it: "@aGiango@bE se non te ne vai, ti mollo un pugno sul... Oh, %H860%Xsei tu%Ysiete voi%Z...\n@c2@"
  ja: "@a@bドン・モハメ「……と\n\tそなたたちで　あったか。\n@c2@"
"53":
  de: "@aHoss@bAch, schon gut, es war nichts. Ich hatte Euch für jemand anderen gehalten, das ist alles.\n@c2@"
  en: "@aZack@bOh, uh, it was nothin'. Never you mind. Jes' thought you was someone else, that's all.\n@c2@"
  es: "@aZacarías@bOh, eh, no pasa nada. Es igual. Creí que %H860%Xeras otra persona%Yerais otros%Z, eso es todo.\n@c2@"
  fr: "@aIsaac@bOh, euh, rien. Faites pas attention. J'vous ai pris%A120%X%Z%B120%Xe%Z pour quelqu'un d'autre, c'est tout.\n@c2@"
  it: "@aGiango@bBah! Pensavo che fosse un'altra persona...\n@c2@"
  ja: "@a@bドン・モハメ「いや　ひとちがいじゃ。\n\t忘れてくだされ。\n@c2@"
"54":
  de: "@aUnke@b%0%a00140, Ihr seid wahrlich ein Lebensretter!\n@c2@"
  en: "@aFrog@b%0%a00140, you are truly a saver of lives!\n@c2@"
  es: "@aRanito@b¡%0%a00140, eres %A120%Xun auténtico salvador%Z%B120%Xuna auténtica salvadora%Z!\n@c2@"
  fr: "@aCrapaud@b%0%a00140, vous m'avez sauvé la vieⓠ\n@c2@"
  it: "@aRana@b%H860%X%0%a00140! Mi hai%YMi avete%Z salvato la vita!\n@c2@"
  ja: "@a@bカエル「あっ　%a00140さん\n\t助かったよ！\n@c2@"
"55":
  de: "@aUnke@bIch wollte nur auf einen Sprung in die Stadt, um mir anzusehen, wie prächtig sie sich entwickelt hat, und da...\n@c2@"
  en: "@aFrog@bI had stepped out for a hop around town to look at the magnificent developments that have occurred, and then...\n@c2@"
  es: "@aRanito@bMe decidí a realizar una incursión por la ciudad para disfrutar de los magníficos avances, cuando de repente...\n@c2@"
  fr: "@aCrapaud@bJ'étais parti faire un saut en ville pour voir sa merveilleuse évolution, et soudain...\n@c2@"
  it: "@aRana@bEro andato a dare un'occhiata alla città, per vedere come stia divenendo sempre più grande e maestosa, quando all'improvviso...\n@c2@"
  ja: "@a@bカエル「町が　発展したから\n\tいろいろ　見てまわってたんだけど……\n@c2@"
"56":
  de: "@aUnke@bNicht auszudenken ⓚⓛ im nächsten Moment wäre ich aufgegessen und meine Knochen in alle Winde verstreut worden!\n@c2@"
  en: "@aFrog@bTo think, I was mere moments from being eaten up, and my bones scattered to the four winds!\n@c2@"
  es: "@aRanito@b¡Pensar que estuve a punto de ser devorado y mis huesos desperdigados a los cuatro vientos!\n@c2@"
  fr: "@aCrapaud@bQuand j'y repense, j'ai été à deux doigts de me faire dévorer et de voir mes os dispersés aux quatre ventsⓠ\n@c2@"
  it: "@aRana@bBrrr! Se ci penso mi vengono i brividi! Questa volta c'è mancato davvero poco che ci lasciassi la pelle!\n@c2@"
  ja: "@a@bカエル「あやうく　食べられて\n\t骨を　埋められちゃうとこだったかも。\n@c2@"
"57":
  de: "@aZini@b(Grummel) Rülps! Ach, die sieht aber lecker aus, die Unke! Die könnte ich jetzt glatt wegschlabbern... oh! Äh, hallo!\n@c1@"
  en: "@aMary Curey@b(rumble) Burp! Ooh, that frog looks so tasty! I just want to globble him upⓚⓛ Oh! Um, hello...\n@c1@"
  es: "@aMari Curi@b(gruñido) ¡Burp! ¡Ah, qué buena pinta tiene ese ranito! Me lo comería de un bocado, ¡ah! Um, hola...\n@c1@"
  fr: "@aMédée Médoc@b(gargouillis) Beurpⓠ Oh, ce crapaud a l'air si appétissantⓠ J'ai juste envie de le gooober tout cru... Oh, euh... Bonjour...\n@c1@"
  it: "@aDolores Tecuro@bBurp! Oh, quella rana è così appetitosa! Voglio slurparmela al volo! Ne farò un sol boccone! Gnaaa... Ehm! Salve, come va?\n@c1@"
  ja: "@a@bベホイミン「うぃ～　ひっく……\n\tうまそうな　カエルじゃねえか……　ん！\n\tあ　あんたらは！？\n@c1@"
"58":
  de: "@aZini@bEs ist, äh... ja, die Stadt ist einfach, äh... ja, wirklich schön hier... Ich wollte gerade, äh...\n@c1@"
  en: "@aMary Curey@bIt's, er...yes, the town is, um...yes, it's a lovely place...I was just, er...\n@c1@"
  es: "@aMari Curi@bEs, eh... claro, la ciudad es, um... sí, un sitio precioso... yo solo, eh...\n@c1@"
  fr: "@aMédée Médoc@bEuh, oui, cette ville est... hum.. oui, vraiment un beeel endroit... J'étais juste en train de, euh...\n@c1@"
  it: "@aDolores Tecuro@bEhm, certo... La città è proprio, uhm, sì, è proprio bella... Stavo appunto facendo un giro per ammirarla in tutto il suo slurplendore...\n@c1@"
  ja: "@a@bベホイミン「いや～　へっへっへ\n\tここは　いい町ですなあ。\n@c1@"
"59":
  de: "@aZini@bJa, ich wollte gerade meinen neuen Nachbarn begrüßen. Herrn Unke hier. Ist er nicht zum Anbeißen? Äh? (Schlürf) (Grummel)\n@c1@"
  en: "@aMary Curey@bYes, I was just saying hello to my new neighbour,\nMr. Frog there. Isn't he deliciⓚⓛ I mean, um...delightful? (slurp) (rumble)\n@c1@"
  es: "@aMari Curi@bEso, solamente estaba saludando a mi nuevo vecino, el Sr. Ranito de ahí. ¿Verdad que es una deli... digo, estupendo?\n㈡\n(slurp) (gruñido)\n@c1@"
  fr: "@aMédée Médoc@bEh bien, je disais justement bonjouuur à mon nouveau voisin, monsieur Crapaud, que voici. N'est-il pas... délicieux... euh, hum... adoraaableⓡ (slurp) (gargouillis)\n@c1@"
  it: "@aDolores Tecuro@bE così ho incontrato questa simpatica ranocchietta. Ma %H860%Xguardala%Yguardatela%Z, non è deliziosa? Eh, sì... scommetto che è proprio deliziosa... Sluuurp!\n@c1@"
  ja: "@a@bベホイミン「いまも　そのカエルさんに\n\tひっこしの　あいさつを\n\tしてたとこなんですぜ。\n@c1@"
"60":
  de: "@aZini@b(Grummel) Rülps? Ich? Die nette kleine Unke essen?\n@c1@"
  en: "@aMary Curey@b(rumble) Burp? Me? Eat lovely Mr. Froggy?\n@c1@"
  es: "@aMari Curi@b(gruñido) ¿Burp? ¿Yo? ¿Comerme al adorable Sr. Ranito?\n@c1@"
  fr: "@aMédée Médoc@b(gargouillis) Beurpⓡ Moiⓡ Manger ce chaaarmant monsieur Crapaudⓡ\n@c1@"
  it: "@aDolores Tecuro@bBurp? Iooo? Mangiare questa deliziosa ranocchiettaaa?\n@c1@"
  ja: "@a@bベホイミン「うぃ～　ひっく……\n\tえ？　オレが　このカエルを\n\t食べるって！？\n@c1@"
"61":
  de: "@aZini@bAber natürlich nicht! Ihr solltet wirklich nicht herumlaufen und die schrecklichen Dinge glauben, die die Leute schlabbern.\n@c1@"
  en: "@aMary Curey@bDon't be silly! You really shouldn't goo around listening to the terrible things people say all the slime.\n@c1@"
  es: "@aMari Curi@b¡No %H860%Xdigas%Ydigáis%Z tonterías! No %H860%Xdeberías%Ydeberíais%Z escuchar todas esas cosas horribles que la gente dice sobre los limos.\n@c1@"
  fr: "@aMédée Médoc@bQuelle idée, voyonsⓠ Vous ne devriez pas écouter les horribles ragooots que les gens colportent en permanence.\n@c1@"
  it: "@aDolores Tecuro@bCerto! Cioè, no! Volevo dire certo che no! Non bisogna credere a tutto quello che si dice in giro sul conto di noi Slime!\n@c1@"
  ja: "@a@bベホイミン「人聞きの　わるいこと\n\t言わんでくださいや！\n@c1@"
"62":
  de: "@aZini@bIhr wisst sehr gut, dass ich hier bin, um meine schrecklichen Verfehlungen hinter mir zu lassen.\n@c1@"
  en: "@aMary Curey@bYou know very well I came here to start a new life away from the terrible slimes of my past.\n@c1@"
  es: "@aMari Curi@b%H860%XSabes%YSabéis%Z perfectamente que he venido aquí para empezar una nueva vida lejos de mis lodosos errores del pasado.\n@c1@"
  fr: "@aMédée Médoc@bVous savez très bien que je suis venuuue ici pour commencer une nouvelle vie, loin de mon passé peu regluisant.\n@c1@"
  it: "@aDolores Tecuro@bE poi %H860%Xsai%Ysapete%Z bene che sono venuta a vivere qui proprio per lasciarmi alle spalle il mio passato criminale! Slurp!\n@c1@"
  ja: "@a@bベホイミン「オレは　ここで\n\t人生リセットして　まっとうに\n\t生きていくんでさあ。\n@c1@"
"63":
  de: "@a@b*: Es muss jetzt zehn Jahre her sein, seit ich beschloss, König zu werden.\n@c2@"
  en: "@a@b*: It must be ten years now since I decided to become a king.\n@c2@"
  es: "@a@b*: Hace ya más de diez años que decidí convertirme en rey.\n@c2@"
  fr: "@a@b*ⓢ Cela doit bien faire dix ans maintenant que j'ai décidé de devenir roi.\n@c2@"
  it: "@a@b*: Ormai sono trascorsi dieci anni da quando ho deciso che sarei diventato un re...\n@c2@"
  ja: "@a@b＊「王さまになる　決意をして\n\tかれこれ　１０年……\n@c2@"
"64":
  de: "@a@b*: Ich habe die ganze Welt bereist, konnte aber noch kein Reich finden, über das ich hätte herrschen dürfen.\n@c2@"
  en: "@a@b*: I've travelled all over the world, but I never found a kingdom yet that would let me rule over it.\n@c2@"
  es: "@a@b*: He viajado por todos los rincones del mundo sin encontrar aún un reino que poder gobernar.\n@c2@"
  fr: "@a@b*ⓢ J'ai voyagé partout dans le monde, mais je n'ai toujours pas trouvé de royaume qui m'accepte comme souverain.\n@c2@"
  it: "@a@b*: Ho girato il mondo in lungo e in largo, ma non sono riuscito a trovare un regno che mi offrisse il trono.\n@c2@"
  ja: "@a@b＊「あちこちの国を　まわったが\n\t王さまを　やとってくれるところは\n\tないもんじゃのう。\n@c2@"
"65":
  de: "@a@b*: Es muss doch irgendwo ein Königreich geben, dem noch ein König fehlt...\n@c2@"
  en: "@a@b*: There must be a kingdom somewhere lacking\na king...\n@c2@"
  es: "@a@b*: En alguna parte debe haber un reino que no tenga rey...\n@c2@"
  fr: "@a@b*ⓢ Il doit bien y avoir quelque part un royaume en manque de roi...\n@c2@"
  it: "@a@b*: Eppure deve pur esserci un paese che ha bisogno di un re!\n@c2@"
  ja: "@a@b＊「どこかに　王さまの　たりない国が\n\tあればいいんじゃが……。\n@c2@"
"66":
  de: "@a@bMöchtest du ihm von Hank Hoffman Jr.s Pionierstadt erzählen?\n@c2@"
  en: "@a@bDo you want to tell him about Hank Hoffman Jr.'s frontier town?\n@c2@"
  es: "@a@b¿Deseas hablarle de la ciudad fronteriza de Juanchito?\n@c2@"
  fr: "@a@bVoulez-vous lui parler de la ville pionnière de Hank Hoffman Jrⓡ\n@c2@"
  it: "@a@bVuoi dirgli della nuova città di frontiera fondata da John Dwayne Jr.?\n@c2@"
  ja: "@a@bこの人に\n%a00260　のことを\n教えてあげますか？\n@c2@"
"67":
  de: "@a@b*: %0%a00260? So eine aufstrebende Stadt braucht sicher einen König. Oder einen demokratisch gewählten Präsidenten!\n@c2@"
  en: "@a@b*: %0%a00260, eh? An up-and-coming town like that is sure to need a king. Or a democratically-elected president!\n@c2@"
  es: "@a@b*: ¿%0%a00260, eh? Una próspera ciudad como esa seguro que necesita un rey. ¡O un presidente elegido democráticamente!\n@c2@"
  fr: "@a@b*ⓢ %0%a00260, dites-vousⓡ Une ville en plein essor comme celle-là doit sûrement avoir besoin d'un roi.\n㈡\n*ⓢ Ou d'un président élu démocratiquementⓠ\n@c2@"
  it: "@a@b*: %0%a00260, eh? Una città fondata da poco ha certo bisogno di un sovrano abile e ambizioso che la guidi verso la grandezza!\n@c2@"
  ja: "@a@b＊「ほほう　%a00260！\n\tそのように　どくりつした町なら\n\tこれから王さまが　必要になるはず。\n@c2@"
"68":
  de: "@a@b*: Vielen Dank! Ich werde mich sofort auf den Weg dorthin machen!\n@c2@"
  en: "@a@b*: Thank you so much! I'll make my way there straight away.\n@c2@"
  es: "@a@b*: ¡Muchísimas gracias! ¡Me dirigiré inmediatamente hacia allí!\n@c2@"
  fr: "@a@b*ⓢ Merci infinimentⓠ Je m'y rends de ce pas.\n@c2@"
  it: "@a@b*: Grazie per l'informazione! Mi precipito sul posto!\n@c2@"
  ja: "@a@b＊「いやはや　ありがとう！\n\tすぐにでも　出発するとしようぞ。\n@c2@"
"69":
  de: "@a@b*: (Seufz) Manchmal wünschte ich, ich hätte nie beschlossen, König zu werden. Ob ich je mein Königreich finden werde?\n@c2@"
  en: "@a@b*: (sigh) Sometimes I wish I'd never decided to become a king in the first place. When will I ever find my kingdom?\n@c2@"
  es: "@a@b*: (suspiro) A veces desearía no haber decidido nunca querer convertirme en rey. ¿Cuándo encontraré por fin mi reino?\n@c2@"
  fr: "@a@b*ⓢ (soupir) Parfois, j'aurais préféré n'avoir jamais pris cette décision de devenir roi. Quand trouverai-je enfin mon royaumeⓡ\n@c2@"
  it: "@a@b*: Sigh! Maledetto il giorno in cui ho deciso che sarei diventato un re! Riuscirò mai a trovare un paese che mi accetti come sovrano?\n@c2@"
  ja: "@a@b＊「王さまに　なるなんて\n\t決めなきゃ　よかったのう……。\n@c2@"
"70":
  de: "@aSchütze Spieß@bGuten Tag! Spieß, Schütze Spieß! Melde mich zum Dienst!\n@c2@"
  en: "@aPartz@bGreetings, %A120%XSir!%Z%B120%XMa'am!%Z Partz, Private, First Class, reporting for duty, %A120%XSir!%Z%B120%XMa'am!%Z\n@c2@"
  es: "@aJoe@b¡Saludos, %A120%Xseñor!%Z%B120%Xseñora!%Z Soldado de primera Joe, ¡a sus órdenes, %A120%Xseñor!%Z%B120%Xseñora!%Z\n@c2@"
  fr: "@aPayer@bBonjour, %A120%XMonsieurⓠ%Z%B120%XMadameⓠ%Z Payer, soldat première classe, au rapport, %A120%XMonsieur%Z%B120%XMadame%Zⓠ\n@c2@"
  it: "@aRambolotto@bAt-tenti! Soldato Rambolotto agli ordini, %A120%Xsignore!%Z%B120%Xsignora!%Z\n@c2@"
  ja: "@a@bポルタ「こんにちはっ。\n\tボクは　ポルタ。　兵士みならいです。\n@c2@"
"71":
  de: "@aSchütze Spieß@bStähle schon seit Jahren meinen Körper, um ihn in den Dienst des Vaterlandes zu stellen ⓚⓛ suche nur noch ein Vaterland!\n@c2@"
  en: "@aPartz@bFor many years now, my body has been a weapon ready for use in service of its country, but I have not yet identified which country, %A120%XSir!%Z%B120%XMa'am!%Z\n@c2@"
  es: "@aJoe@bDurante años mi cuerpo ha sido un arma letal al servicio del país, ¡pero aún no he podido identificar qué país es ese, %A120%Xseñor!%Z%B120%Xseñora!%Z\n@c2@"
  fr: "@aPayer@bDepuis plusieurs années, mon corps est une arme prête à servir son pays, mais je ne sais pas encore quel pays, %A120%XMonsieur%Z%B120%XMadame%Zⓠ\n@c2@"
  it: "@aRambolotto@bSono un prode guerriero e un fedele servitore del mio paese... ma non ho ancora capito quale sia il mio paese, %A120%Xsignore!%Z%B120%Xsignora!%Z\n@c2@"
  ja: "@a@bポルタ「子どもの頃から　タルをこわして\n\tきたえた　このウデを　生かせる国は\n\tないものでしょうか。\n@c2@"
"72":
  de: "@a@bMöchtest du ihm von Hank Hoffman Jr.s Pionierstadt erzählen?\n@c2@"
  en: "@a@bDo you want to tell him about Hank Hoffman Jr.'s frontier town?\n@c2@"
  es: "@a@b¿Deseas hablarle de la ciudad fronteriza de Juanchito?\n@c2@"
  fr: "@a@bVoulez-vous lui parler de la ville pionnière de Hank Hoffman Jrⓡ\n@c2@"
  it: "@a@bVuoi dirgli della nuova città di frontiera fondata da John Dwayne Jr.?\n@c2@"
  ja: "@a@bこの人に\n%a00260　のことを\n教えてあげますか？\n@c2@"
"73":
  de: "@aSchütze Spieß@b%0%a00260, zu Befehl! Bin bereit zum Abmarsch!\n@c2@"
  en: "@aPartz@b%0%a00260, %A120%XSir!%Z%B120%XMa'am!%Z Understood, %A120%XSir!%Z%B120%XMa'am!%Z\n@c2@"
  es: "@aJoe@b¡%0%a00260, %A120%Xseñor!%Z%B120%Xseñora!%Z ¡Entendido, %A120%Xseñor!%Z%B120%Xseñora!%Z\n@c2@"
  fr: "@aPayer@b%0%a00260, %A120%XMonsieur%Z%B120%XMadame%Zⓡ Compris, %A120%XMonsieur%Z%B120%XMadame%Zⓠ\n@c2@"
  it: "@aRambolotto@b%0%a00260, %A120%Xsignore%Z%B120%Xsignora%Z? Ricevuto, %A120%Xsignore%Z%B120%Xsignora%Z!\n@c2@"
  ja: "@a@bポルタ「えっ　%a00260　ですか？\n\tへえ～　まさに今\n\t発展中の　町なんですね！\n@c2@"
"74":
  de: "@aSchütze Spieß@bSchütze Spieß bittet um die Erlaubnis, abmarschieren zu dürfen! Jawoll! Zu Befehl! Danke!\n@c2@"
  en: "@aPartz@bPartz, Private, First Class, requesting permission to move out, %A120%XSir!%Z%B120%XMa'am!%Z Thank you, %A120%XSir!%Z%B120%XMa'am!%Z\n@c2@"
  es: "@aJoe@bSoldado de primera Joe, ¡solicito permiso para partir, %A120%Xseñor!%Z%B120%Xseñora!%Z ¡Gracias, %A120%Xseñor!%Z%B120%Xseñora!%Z\n@c2@"
  fr: "@aPayer@bPayer, soldat première classe, demande permission de partir, %A120%XMonsieur%Z%B120%XMadame%Zⓠ Merci, %A120%XMonsieur%Z%B120%XMadame%Zⓠ\n@c2@"
  it: "@aRambolotto@bChiedo di partire immediatamente per la mia destinazione, %A120%Xsignore%Z%B120%Xsignora%Z!\n@c2@"
  ja: "@a@bポルタ「それは　ぜひ　行ってみたいです！\n\tがんばって　タルを……　じゃなくて\n\t住民を　守ってみせますよ！\n@c2@"
"75":
  de: "@aSchütze Spieß@bSchütze Spieß. Stehe bequem, bis ein passender Aufgabenbereich gefunden ist! Zu Befehl!\n@c0@"
  en: "@aPartz@bPartz, Private, First Class, standing easy until such time as a suitable destination is identified, %A120%XSir!%Z%B120%XMa'am!%Z\nThank you, %A120%XSir!%Z%B120%XMa'am!%Z\n@c0@"
  es: "@aJoe@b¡Soldado de primera Joe, descansando armas hasta identificación positiva de destino, %A120%Xseñor!%Z%B120%Xseñora!%Z\n¡Gracias, %A120%Xseñor!%Z%B120%Xseñora!%Z\n@c0@"
  fr: "@aPayer@bPayer, soldat première classe, au repos en attendant qu'une destination convenable soit identifiée, %A120%XMonsieur%Z%B120%XMadame%Zⓠ Merci %A120%XMonsieur%Z%B120%XMadame%Zⓠ\n@c0@"
  it: "@aRambolotto@bAspetterò che mi venga comunicata la mia destinazione, %A120%Xsignore%Z%B120%Xsignora%Z! Speriamo solo che non ci voglia molto, %A120%Xsignore%Z%B120%Xsignora%Z...\n@c0@"
  ja: "@a@bポルタ「う～ん。\n\tさあ　王さまが　お待ちかねですぞ！\n\t……って　言ってみたいのになあ。\n@c0@"
"76":
  de: "@a@b*: Wuff! Wau wau!\n@c2@"
  en: "@a@b*: Arf! Woof woof!\n@c2@"
  es: "@a@b*: ¡Arf! ¡Guau, guau!\n@c2@"
  fr: "@a@b*ⓢ Grrrⓠ Ouaf, ouafⓠ\n@c2@"
  it: "@a@b*: Arf! Bau! Bau!\n@c2@"
  ja: "@a@b＊「ワン　ワン　ワン！\n@c2@"
"77":
  de: "@aFrieder Niete@bGuten Tag. Ich bin Frieder Niete. Ich sitze hier und denke über diese Zufallsbegegnungen nach.\n@c2@"
  en: "@aStreo Louse@bHowdy, I'm Streo Louse. I been sittin' here havin' me a good ol' think about them there chance encounters.\n@c2@"
  es: "@aHortera y Casset@bHola, me llamo Hortera y Casset. Estaba aquí sentando pensando nomás en esos encuentros al azar y sus circunstancias.\n@c2@"
  fr: "@aAmédée Carte@bSalut, j'm'appelle Amédée Carte. J'me suis assis ici pour réfléchir sérieusement aux rencontres aléatoires.\n@c2@"
  it: "@aProfessor Mente@bSalve! Sono il Professor Mente, e stavo pensando alle enormi opportunità che ci vengono offerte dagli incontri a sorpresa.\n@c2@"
  ja: "@a@bソクラス「ぼくは　ソクラス。\n\tいま　すれちがい通信について\n\t考えていました。\n@c2@"
"78":
  de: "@aFrieder Niete@bAuf der Welt leben so viele Menschen wie Sterne am Himmel stehen, aber man begegnet nur ganz wenigen von ihnen.\n@c2@"
  en: "@aStreo Louse@bThere's as many people in this world as there are stars in that big ol' sky, but you'll only ever come across a few.\n@c2@"
  es: "@aHortera y Casset@bEn este mundo hay tanta gente como circunstancias, pero nomás te cruzas con algunas personas en tu vida.\n@c2@"
  fr: "@aAmédée Carte@bIl y a dans c'monde autant de personnes que d'étoiles dans l'ciel, mais on n'en croise que quelques-unes.\n@c2@"
  it: "@aProfessor Mente@bQuesto mondo è abitato da tante persone quante stelle ci sono in cielo ma, durante la nostra vita terrena, noi non ne incontriamo che alcune...\n@c2@"
  ja: "@a@bソクラス「世界には　星の数ほど\n\tたくさんの人が　いますけど\n\tめぐり会えるのは　ほんのわずか……\n@c2@"
"79":
  de: "@aFrieder Niete@bOffenbar muss man diese Begegnungen nutzen, so gut man nur kann.\n@c2@"
  en: "@aStreo Louse@bSeems you gotta make the most o' them encounters when they happen.\n@c2@"
  es: "@aHortera y Casset@bPues habrá que aprovechar esos encuentros cuando sucedan.\n@c2@"
  fr: "@aAmédée Carte@bÀ mon avis, il faut tirer le meilleur parti de ces rencontres aléatoires quand elles se produisent.\n@c2@"
  it: "@aProfessor Mente@bProprio per questo motivo dovremmo cercare di trarre ogni beneficio possibile dagli incontri che facciamo! Che riflessione profonda, vero?\n@c2@"
  ja: "@a@bソクラス「そんな　出会いを\n\t大切にしたいものですね。\n@c2@"
"80":
  de: "@aSeñor Paco@bHola! Iss bin Señor Paco, der spressende Mustang!\n@c2@"
  en: "@aMr. Ned@bWhy howdy there, I'm Mr. Ned, the talkin' horse.\n@c2@"
  es: "@aSr. Jaco@bQué onda, soy el Sr. Jaco, el caballo parlante.\n@c2@"
  fr: "@aM. Ned@bSaluhuhu, je suis M. Ned, le cheval qui parle.\n@c2@"
  it: "@aQuirino@bHola! Yo soy Quirino, el caballo parlantes.\n@c2@"
  ja: "@a@bエド「わたしは　しゃべる馬の　エド。\n@c2@"
"81":
  de: "@aSeñor Paco@bWisst Ihr was? Iss weiß jetzt wieder, wie iss hierhergekommen bin und warum iss spresse wie ein Menss! Fällt mir alles wieder ein!\n@c2@"
  en: "@aMr. Ned@bHey, guess what? I done remembered how I come to be here, an' how comes I kin talk like a human bean!\nIt all come gallopin' back to me!\n@c2@"
  es: "@aSr. Jaco@b¿%H860%XSabe%YSaben%Z qué? ¡Ya me acuerdo de cómo llegué hasta aquí y por qué platico como un humano!\n¡Me vino todo de repente!\n@c2@"
  fr: "@aM. Ned@bHé, vous savez quoiⓡ J'ai fini par me souvenir pourquoi j'étais là et pourquoi je parlais comme un être humainⓠ Tout m'est revenu au galopⓠ\n@c2@"
  it: "@aQuirino@bYo me soy ricordatos de como soy arrivatos aqui, y el motivo que yo hablo la linguas degli uominis. Mi sono ricordatos todo!\n@c2@"
  ja: "@a@bエド「なぜ　この地に　やって来たのか……\n\tなぜ　話すことができるのか……\n\tすべてを　思い出しました！\n@c2@"
"82":
  de: "@aSchütze Spieß@bGuten Tag! Willkommen in der Burg %a00260! Willkommen, jawoll!\n@c2@"
  en: "@aPartz@bGreetings, %A120%XSir%Z%B120%XMa'am%Z, and welcome to %a00260 Castle. %A120%XSir, welcome, Sir!%Z%B120%XMa'am, welcome, Ma'am!%Z\n@c2@"
  es: "@aJoe@bSaludos, %A120%Xseñor, bienvenido%Z%B120%Xseñora, bienvenida%Z al Castillo de %a00260. %A120%X¡Señor, bienvenido, señor!%Z%B120%X¡Señora, bienvenida, señora!%Z\n@c2@"
  fr: "@aPayer@bBonjour, %A120%XMonsieur%Z%B120%XMadame%Z, et bienvenue au château %G260%Xd'%Yde %Z%a00260.\n@c2@"
  it: "@aRambolotto@bSalve, %A120%Xsignore!%Z%B120%Xsignora!%Z Questo è il castello, %A120%Xsignore!%Z%B120%Xsignora!%Z\n@c2@"
  ja: "@a@bポルタ「われらが\n\t%a00260の城へ\n\tようこそ！\n@c2@"
"83":
  de: "@aSchütze Spieß@bDer König kann Euch jetzt empfangen!\n@c2@"
  en: "@aPartz@b%A120%XSir%Z%B120%XMa'am%Z, the King will see you now, %A120%XSir!%Z%B120%XMa'am!%Z\n@c2@"
  es: "@aJoe@b%A120%X¡Señor%Z%B120%X¡Señora%Z, el Rey %A120%Xle%Z%B120%Xla%Z recibirá ahora mismo, %A120%Xseñor!%Z%B120%Xseñora!%Z\n@c2@"
  fr: "@aPayer@b%A120%XMonsieur%Z%B120%XMadame%Z, le roi va vous recevoir, %A120%XMonsieur%Z%B120%XMadame%Zⓠ\n@c2@"
  it: "@aRambolotto@bIl re mi ha dato l'ordine di farti passare, %A120%Xsignore!%Z%B120%Xsignora!%Z\n@c2@"
  ja: "@a@bポルタ「さあ　王さまが　お待ちかねですぞ。\n@c2@"
"84":
  de: "@aSchütze Spieß@bHerrlich! Das hab ich immer schon mal sagen wollen!\n@c2@"
  en: "@aPartz@bAww, man, I always wanted to say that!\n@c2@"
  es: "@aJoe@b¡Aah, siempre quise decir eso!\n@c2@"
  fr: "@aPayer@bAaaah, j'ai toujours rêvé de dire çaⓠ\n@c2@"
  it: "@aRambolotto@bAdoro sentire il tono perentorio e marziale della mia voce!\n@c2@"
  ja: "@a@bポルタ「……くぅ～～っ！\n\tこのセリフ　しゃべるの\n\t夢だったんですよ！\n@c2@"
"85":
  de: "@a@b*: He, Ihr da! Habt Ihr schon gehört?\n@c2@"
  en: "@a@b*: You there! Have you heard?\n@c2@"
  es: "@a@b*: ¡Eh, %H860%Xtú%Y%R000%Xvosotras%Yvosotros%Z%Z! ¿Lo %H860%Xhas%Yhabéis%Z oído?\n@c2@"
  fr: "@a@b*ⓢ Hé, vous, làⓠ Vous avez entenduⓡ\n@c2@"
  it: "@a@b*: Ehi, %H860%Xtu! Hai saputo%Yvoi! Avete saputo%Z?\n@c2@"
  ja: "@a@b＊「旅の人！　知ってますか？\n@c2@"
"86":
  de: "@a@b*: Ach, hab ich das etwa schon erzählt? Hahaha, ich bin einfach überglücklich! Nun ja...\n@c2@"
  en: "@a@b*: Oh, did I tell you already? Hahaha, oh, I don't know, I'm just so happy! Anyway...\n@c2@"
  es: "@a@b*: ¡Oh!, ¿%H860%Xte%Yos%Z lo había dicho? ¡Ja, ja, ja, oh, no lo sé, estoy tan feliz! No importa...\n@c2@"
  fr: "@a@b*ⓢ Oh, je vous l'ai déjà ditⓡ Ha ha ha, oh, je ne sais plus où j'en suis, je suis tellement contentⓠ Enfin bref...\n@c2@"
  it: "@a@b*: Eh? %H860%XTe%YVe%Z l'avevo già detto? Devo avere la testa altrove... Beh, non importa.\n@c2@"
  ja: "@a@b＊「あれ？　もう話しましたっけ？\n\tわっはっは　つい　うれしくて！\n\tでは……\n@c2@"
"87":
  de: "@a@b*: Zur Feier des Tages, weil die Stadt in so eine prachtvolle Burg verwandelt wurde, will ich meinen Laden umbenennen.\n@c2@"
  en: "@a@b*: To commemorate the city becoming a magnificent castle, I decided to give my shop a fittingly celebratory name.\n@c2@"
  es: "@a@b*: Para celebrar que la ciudad se ha convertido en un magnífico castillo, he decidido ponerle a mi tienda un nombre conmemorativo.\n@c2@"
  fr: "@a@b*ⓢ Pour célébrer la transformation de la ville en un magnifique château, j'ai décidé de donner à ma boutique un nom approprié à la circonstance.\n@c2@"
  it: "@a@b*: Visto che la città si è trasformata in un meraviglioso castello, ho deciso di dare al mio negozio un nome adeguato alla grandiosità del posto.\n@c2@"
  ja: "@a@b＊「ここが　りっぱな城に\n\t発展した記念に　わたしの店にも\n\t名前をつけてみたんです！\n@c2@"
"88":
  de: "@a@b*: Ich nenne ihn... Handelspalast!\n@c2@"
  en: "@a@b*: I called it...ⓗWar-Martⓘ! What do you think?\nPretty good, eh? Anyway...\n@c2@"
  es: "@a@b*: La llamaré... ¡ⓕEl Cante Inglésⓖ! ¿Qué %H860%Xte%Yos%Z parece?\nEs bueno, ¿verdad? Esto...\n@c2@"
  fr: "@a@b*ⓢ Je l'ai appelée...ⓥGalerie Lafolietteⓦⓠ Qu'est-ce que vous en ditesⓡ\nPas mal, heinⓡ Enfin bref...\n@c2@"
  it: "@a@b*: L'ho chiamato ⓕArmi e contorniⓖ! Niente male, eh?\n@c2@"
  ja: "@a@b＊「その名も　ハッピー屋！\n\tどうです？　いい名前でしょう。\n\tさて……\n@c2@"
"89":
  de: "@aRocky@bWir mussten uns mit vielen Problemen herumschlagen, aber ich bin froh, dass wir hierher gezogen sind.\n@c2@"
  en: "@aRocky@bWe been through all kinds o' problems, but I'm glad we moved out here.\n@c2@"
  es: "@aRoque@bHemos padecido muchos problemas pero me alegro de haberme mudado aquí.\n@c2@"
  fr: "@aRocky@bOn a connu toutes sortes d'ennuis, mais j'suis content qu'on se soit installés ici.\n@c2@"
  it: "@aRocco@bAbbiamo fatto bene a trasferirci qui, anche se gli inizi non sono stati facili. Ora, però, anche Adriana è contenta di vivere in questo posto.\n@c2@"
  ja: "@a@bロッコ「いろいろあったけど\n\tこの町に　ひっこしてきて\n\tよかったです。\n@c2@"
"90":
  de: "@aRocky@bJetzt hat sich anscheinend auch Adrian eingelebt, und bald bekommen wir ein Kind. Ach, ich fühle mich wie ein Schwergewichtsweltmeister!\n@c2@"
  en: "@aRocky@bSeems Adrian's kinda used to it now, too, an' we got a baby comin' soon. Man, I feel like the heavyweight champion o' the freakin' world!\n@c2@"
  es: "@aRoque@bY parece que Adriana ya se ha acostumbrado y estamos esperando un niño.\n㈡\n¡%H860%XTe%YOs%Z juro que me siento como el campeón de los pesos pesados del mundo mundial!\n@c2@"
  fr: "@aRocky@bAdrienne a fini par s'y habituer aussi, et on attend même un bébé pour bientôt. J'ai vraiment l'impression d'être un champion du monde poids lourdsⓠ\n@c2@"
  it: "@aRocco@bE così, abbiamo deciso di avere un bambino! Spero che Adriana non ingrassi troppo durante la gravidanza, altrimenti dovrà cambiare categoria...\n@c2@"
  ja: "@a@bロッコ「妻も　ここでの　生活に\n\tなれてきたみたいだし\n\tそろそろ　子供がほしいかなあ。\n@c2@"
"91":
  de: "@aAdrian@bIch bin mit meinem Leben hier jetzt rundum zufrieden.\n@c1@"
  en: "@aAdrian@bYa know, I guess I'm pretty happy with my life\nright now.\n@c1@"
  es: "@aAdriana@b%H860%XSabes%YSabéis%Z, supongo que ahora estoy más que satisfecha con mi vida.\n@c1@"
  fr: "@aAdrienne@bVous savez, je crois que ma vie actuelle me convient bien.\n@c1@"
  it: "@aAdriana@bAdesso sono proprio contenta... Anzi, non potrei essere più felice!\n@c1@"
  ja: "@a@bナナ「いまの　生活に\n\tとっても　まんぞくしているの。\n@c1@"
"92":
  de: "@aAdrian@bIch hoffe, mein Rocky und ich leben bis ans Ende unseres Lebens so zusammen. Ich bin so stolz auf ihn!\n@c1@"
  en: "@aAdrian@bI just hope I can spend the rest o' my days like this with my Rocky. He's my hero!\n@c1@"
  es: "@aAdriana@bSolo espero que pueda pasar el resto de mis días así, con mi Roque. ¡Es mi héroe!\n@c1@"
  fr: "@aAdrienne@bJ'espère juste pouvoir passer le reste de ma vie avec Rocky. C'est mon hérosⓠ\n@c1@"
  it: "@aAdriana@bNon voglio altro che trascorrere il resto della mia vita con Rocco! Forse pensa troppo al suo lavoro, ma è l'uomo che amo!\n@c1@"
  ja: "@a@bナナ「いつまでも　ロッコと　二人で\n\t暮らしていきたいわね。\n@c1@"
"93":
  de: "@a@b*: Ah, guten Tag! Ich bin der König, dem Ihr in der Kneipe in Havre Léon von %a00260 erzählt habt.\n@c2@"
  en: "@a@b*: Hello there! It's me! I'm the king you told about %a00260 in the pub in Havre Léon.\n@c2@"
  es: "@a@b*: ¡Saludos! ¡Soy yo! Soy el rey al que le %H860%Xhablaste%Yhablasteis%Z de %a00260 en el bar de Havre Léon.\n@c2@"
  fr: "@a@b*ⓢ Bonjourⓠ Je suis le roi à qui vous avez parlé %G260%Xd'%Yde %Z%a00260 à la taverne de Port Lionel.\n@c2@"
  it: "@a@b*: Ehi! Sono io! Non mi %H860%Xriconosci%Yriconoscete%Z? Sono la persona a cui avete parlato di %a00260 a Port Léon!\n@c2@"
  ja: "@a@b＊「わしじゃよ！　ハバリアの酒場で\n\t%a00260のことを\n\t教えてもらった　王さまじゃ！\n@c2@"
"94":
  de: "@a@bIch bin froh, dass ich hierher gekommen bin. Ich bin ja so glücklich, seit man mich zum König gemacht hat!\n@c2@"
  en: "@a@b*: I'm so glad I came here. I've been so happy since I became king!\n@c2@"
  es: "@a@b*: Me alegra tanto haber venido. ¡Soy tan feliz desde que soy rey!\n@c2@"
  fr: "@a@b*ⓢ Je suis si content d'être venu ici. Je suis tellement heureux depuis que je suis devenu roiⓠ\n@c2@"
  it: "@a@b*: Sono davvero contento di essermi trasferito qui! Finalmente ho potuto realizzare il mio sogno di cingermi la testa con una corona reale!\n@c2@"
  ja: "@a@b＊「いやはや　こうして　玉座につけて\n\tじつに　幸せじゃよ！\n@c2@"
"95":
  de: "@aÖhi@bTja, mal sehen... wenn die Chancen für dieses Rennen...\n@c2@"
  en: "@aSnowy@bWell now, let's see...if the odds for that race are gonna be...\n@c2@"
  es: "@aBianco@bMuy bien, veamos... si las probabilidades de esa carrera van a ser...\n@c2@"
  fr: "@aFlocon@bBon, voyons un peu... si les paris pour cette course sont à...\n@c2@"
  it: "@aSabyo@bAllora, vediamo un po'... Come andrà a finire la prossima corsa?\n@c2@"
  ja: "@a@bゆきのふ「う～む　やはり\n\tあのレースの　オッズは\n\tこのくらいで……\n@c2@"
"96":
  de: "@aÖhi@bHe, was soll das denn? Seht Ihr nicht, dass ich beschäftigt bin? Kommt später wieder.\n@c2@"
  en: "@aSnowy@bHey, whaddya think you're doin'? Can't you see I'm busy? Talk to me later.\n@c2@"
  es: "@aBianco@bEh, ¿qué %H860%Xcrees%Ycréeis%Z que %H860%Xestás%Yestáis%Z haciendo? ¿No %H860%Xves%Yvéis%Z que estoy ocupado? %H860%XVuelve%YVolved%Z más tarde.\n@c2@"
  fr: "@aFlocon@bHé, qu'est-ce que vous faitesⓡ Vous ne voyez pas que j'suis occupéⓡ Revenez me parler plus tard.\n@c2@"
  it: "@aSabyo@bEhi! Ma non %H860%Xvedi%Yvedete%Z che sono occupato?! Ora non ho tempo di parlare con %H860%Xte%Yvoi%Z! Ma guarda un po' che modi...\n@c2@"
  ja: "@a@bゆきのふ「な　なんだね　キミは！\n\t今は　いそがしいので\n\t後にしてくれ。\n@c2@"
"97":
  de: "@aPrissi@bEinen schönen guten Tag wünsche ich. Ich bin Prinzessin Prissi. Es ist herrlich, einen neuen Palast kennenzulernen! Ich habe ein wundervolles Gemach!\n@c1@"
  en: "@aPrincess Pam@bGood day to you, I am Princess Pam. It's so lovely to come from one palace to another! And I have such a gorgeous room!\n@c1@"
  es: "@aPrincesa Vanessa@bHola, caracola, soy la Princesa Vanessa. ¡Me encanta ir de un sitio a otro! ¡Y tengo una habitación taaan mona!\n@c1@"
  fr: "@aPrincesse Pam@bBonjour, je suis la princesse Pam. C'est tellement appréciable de passer d'un palais à un autreⓠ\nEt ma chambre est si belleⓠ\n@c1@"
  it: "@aPrincipessa Locca@bOh, salve! Io sono la Principessa Locca. %H860%XSai%YSapete%Z? Ho finalmente trovato una umile sistemazione che soddisfi le mie modeste necessità.\n@c1@"
  ja: "@a@bデイジー「お城から　抜け出してきて\n\tまた　お城に暮らすことになったけど\n\tゴージャスな部屋で　幸せ～♪\n@c1@"
"98":
  de: "@aPrissi@bAch, gäbe es doch bloß auch einen schönen jungen Prinzen, das wäre einfach perfekt!\n@c1@"
  en: "@aPrincess Pam@bIf only there was a handsome prince as well, everything would be perfect...\n@c1@"
  es: "@aPrincesa Vanessa@bSi también tuviera un hermoso príncipe, todo sería ideal de la muerte...\n@c1@"
  fr: "@aPrincesse Pam@bSi seulement il y avait aussi un beau prince, tout serait absolument parfait...\n@c1@"
  it: "@aPrincipessa Locca@bOra, per completare la mia felicità, mi serve solo un uomo alto, bello, forte, coraggioso, sensibile, potente, intelligente, ricco e di sangue reale!\n@c1@"
  ja: "@a@bデイジー「あとは　ステキな\n\t王子さまが　いるといいけどね……。\n@c1@"
"99":
  de: "@aKarl Oink@bHatte ich ein Glück, dass ich gleich hier war, als hier so richtig die Post abging!\n@c2@"
  en: "@aPrelvis Esley@bI can't believe I been lucky enough to be here right from when this place started way down as a little village to now, when it's a bona fide boom city!\n@c2@"
  es: "@aPrelvis Esley@b¡No puedo creerme que haya tenido la suerte de estar aquí para ver cómo este lugar ha pasado de ser un pequeño pueblo...\n㈡\n ... a ser una ciudad con todas las letras! ¡Oh yeah!\n@c2@"
  fr: "@aGino Allaydi@bJe n'arrive pas à croire que j'ai eu la chance d'être là au tout début, quand cet endroit n'était qu'un petit village, et de l'avoir vu grandir.\n㈡\nMaintenant, cette ville-là... elle est terribleⓠ\n@c2@"
  it: "@aElvis Bresly@bEbbene sì! Posso dirlo con orgoglio! Sono state le mie meravigliose canzoni a trasformare un misero villaggiucolo in una città sfavillante!\n@c2@"
  ja: "@a@bガライ「ちいさかった集落が\n\tこんな　りっぱな都になるなんて\n\tステキな奇跡だね。\n@c2@"
"100":
  de: "@aKarl Oink@bIrgendwann suche ich mir mein eigenes lauschiges Plätzchen und gründe meine eigene Stadt im schönsten Wiesengrunde!\n@c2@"
  en: "@aPrelvis Esley@bI guess if one night I happen across a real nice spot, I might build a town o' my own, an' do it my way!\n@c2@"
  es: "@aPrelvis Esley@bImagino que si una noche encuentro el lugar adecuado, puede que construya mi propia ciudad, ¡a mi manera!\n@c2@"
  fr: "@aGino Allaydi@bJe crois que si un jour je tombais sur un coin super, je pourrais m'arrêter là et y construire ma propre ville sans demander rien à personneⓠ\n@c2@"
  it: "@aElvis Bresly@bUn giorno anch'io fonderò una città, e la chiamerò Greislend! Non so perché, ma adoro questo nome! Anche se forse si scrive in modo diverso...\n@c2@"
  ja: "@a@bガライ「きっと　いつか　詩にするよ。\n\t%a00260の　伝説を……。\n@c2@"
"101":
  de: "@a@b*: Hallo, mein Name ist Hannibal. Ich war Kommandeur eines Elite-Einsatzkommandos in Pioniria.\n@c2@"
  en: "@a@b*: Hi, I'm Hannibal. I used to be the leader of a crack Pionirian commando unit.\n@c2@"
  es: "@a@b*: Hola, soy Aníbal. Antes era el cabecilla de un equipo de pioneros de élite que fue acusado de un crimen que no había cometido.\n@c2@"
  fr: "@a@b*ⓢ Salut, j'm'appelle Hannibal. Avant, j'étais à la tête d'une unité de commando d'élite de Pioniria.\n@c2@"
  it: "@a@bCiao! Io sono Hannibal, l'ex-capo di una squadra di pionieri d'élite.\n@c2@"
  ja: "@a@bハンビル「かつては　将軍として\n\tマーリブの軍隊を　ひきいていた\n\tハンビルと申す。\n@c2@"
"102":
  de: "@aHannibal@bEigentlich hätte ich bei dem Sandsturm zusammen mit der Burg untergehen sollen.\n@c2@"
  en: "@aHannibal@bBy rights, I should've been swallowed down with the castle when that sandstorm happened.\n@c2@"
  es: "@aAníbal@bCuando se desató la tormenta de arena, tendría que haber quedado sepultado junto con el castillo.\n@c2@"
  fr: "@aHannibal@bDe fait, j'aurais dû être englouti avec le reste du château quand la tempête de sable a eu lieu.\n@c2@"
  it: "@aHannibal@bTempo fa mancò poco che io fossi inghiottito dal deserto insieme al castello, ma pare proprio che le sabbie non mi abbiano voluto. Ah! Ah! Ah!\n@c2@"
  ja: "@a@bハンビル「たしか　城が　ほろんだとき\n\t私も　砂嵐にまきこまれたはずだが……。\n@c2@"
"103":
  de: "@aHannibal@bIch kann's kaum erwarten, mein Team aus dem Militärgefängnis zu holen und an die Arbeit zu gehen. Ich liebe es, wenn ein Plan funktioniert!\n@c2@"
  en: "@aHannibal@bAnyway, I'm back now, and I just can't wait to knuckle down, break the rest of my unit out of their maximum security stockade, and get to work.\n@c2@"
  es: "@aAníbal@bDa igual, he vuelto, y no puedo esperar a tener un plan, liberar al resto de mi unidad de su cautiverio en la prisión de máxima seguridad...\n㈡\n... y volver al trabajo como soldado de fortuna.\n@c2@"
  fr: "@aHannibal@bQuoi qu'il en soit, j'suis d'retour et j'ai hâte de m'y remettre, de libérer le reste de mon unité de leur prison de haute sécurité et de retourner au travail.\n@c2@"
  it: "@aHannibal@bHo girato per il mondo, poi m'ha preso la nostalgia e sono tornato qui! Non vedo l'ora di liberare il resto del mio team e di rimettermi in azione!\n@c2@"
  ja: "@a@bハンビル「まあ　そんなことより　いまは\n\tこの地にて　生まれ変わったつもりで\n\tせいいっぱい　おつとめ申す！\n@c2@"
"104":
  de: "@a@b*: Beim Klabautermann, vom Glücksspiel lass ich jetzt die Finger, und in jedem Hafen ein Mädchen ⓚⓛ das gibt's auch nicht mehr!\n@c2@"
  en: "@a@b*: Arr, I've washed me hands of the gamblin' game, so I have, along with all me sinnin' ways.\n@c2@"
  es: "@a@b*: Arr, me he retirado del juego, y también he abandonado todos mis vicios.\n@c2@"
  fr: "@a@b*ⓢ Grrr, j'ai arrêté de parier, vous savez.\nJe ne suis plus le pécheur que j'ai été autrefois.\n@c2@"
  it: "@a@b*: Da quando ho cambiato vita, ho gettato fuori bordo tutti i vizi che avevo, incluso il gioco d'azzardo.\n@c2@"
  ja: "@a@b＊「オレは　もう　ギャンブルからは\n\t足を　洗ったぜ。\n@c2@"
"105":
  de: "@a@b*: Ich war ein echter Zocker, das könnt Ihr mir glauben. Einmal habe ich mit nur 40 Goldmünzen 838861 Jetons gewonnen... das waren noch Zeiten!\n@c2@"
  en: "@a@b*: But I was a fine gambler in me day, an' no mistake. Why, once I won me 838861 casino tokens off just 40 gold coins... Arr, them were the days.\n@c2@"
  es: "@a@b*: Pero en mi época fui un gran jugador, sin duda.\n㈡\n*: Una vez conseguí ganar 838.861 fichas de casino con tan solo 40 monedas de oro... Arrr, qué tiempos aquellos.\n@c2@"
  fr: "@a@b*ⓢ Mais à l'époque, j'étais un sacré joueur, nom d'une pipe. Une fois, j'ai même gagné 838861 jetons de casino en partant de seulement 40 pièces d'or...\n㈡\n*ⓢ Grrr, c'était le bon temps.\n@c2@"
  it: "@a@b*: Ero un giocatore veramente in gamba, %H860%Xsai%Ysapete%Z? Una volta vinsi 838861 gettoni del casinò con sole 40 monete d'oro! Ah, bei tempi, quelli...\n@c2@"
  ja: "@a@b＊「昔は　コイン　８３８８６１まいを\n\t４０Ｇ　で　手に入れたりも\n\tしたけどよ……。\n@c2@"
"106":
  de: "@a@b*: Hallo. Soll ich Euch ein bisschen was über die einarmigen Banditen erzählen?\n@c2@"
  en: "@a@b*: Hello there. Shall I tell you a little about the slot machines?\n@c2@"
  es: "@a@b*: Hola. ¿%H860%XDeseas que te%YDeseáis que os%Z explique algo sobre las tragaperras?\n@c2@"
  fr: "@a@b*ⓢ Bonjour. Voulez-vous que je vous parle un peu des machines à sousⓡ\n@c2@"
  it: "@a@b*: Oh, salve! %H860%XPermettimi di darti%YPermettetemi di darvi%Z qualche informazione sulle slot machine...\n@c2@"
  ja: "@a@b＊「お客さん　スロットについて\n\t教えましょうか。\n@c2@"
"107":
  de: "@a@b*: Bei den einarmigen Banditen kann man groß absahnen, aber nur alle Jubeljahre mal. Man verliert viel, aber wenn man gewinnt, dann richtig.\n@c2@"
  en: "@a@b*: The slot machines offer big prizes, but only every once in a while. You'll lose a lot, but when you do win, you'll win big.\n@c2@"
  es: "@a@b*: Las máquinas tragaperras ofrecen grandes premios, pero solo de vez en cuando. Se pierde mucho pero cuando se gana, se gana muchísimo.\n@c2@"
  fr: "@a@b*ⓢ Les machines à sous offrent de grosses récompenses, mais seulement une fois de temps en temps.\n㈡\n*ⓢ On perd donc beaucoup, mais quand on gagne, on gagne beaucoup aussi.\n@c2@"
  it: "@a@b*: Le slot machine offrono grossi premi, però le vincite non sono frequenti. Si perde molto ma, quando si è fortunati, la ricompensa è grande.\n@c2@"
  ja: "@a@b＊「ちょこちょこ当たる　あそび台。\n\tはずしは多いが　\n\t当たれば大きい　大穴台。\n@c2@"
"108":
  de: "@a@b*: Jedes Gerät hat seine Eigenheiten. Die Auswahl des richtigen Gerätes ist also genauso wichtig wie alles andere.\n@c2@"
  en: "@a@b*: Each machine has its own peculiarities too, so machine selection is as important a skill as any other.\n@c2@"
  es: "@a@b*: Además, cada máquina tiene sus propias peculiaridades, de modo que elegir la correcta es todo un arte.\n@c2@"
  fr: "@a@b*ⓢ Chaque machine a ses propres particularités, alors savoir choisir sa machine est aussi important que n'importe quel autre talent.\n@c2@"
  it: "@a@b*: Ogni slot machine ha le proprie particolarità, quindi scegliere l'apparecchio giusto è una parte importante della strategia di gioco.\n@c2@"
  ja: "@a@b＊「台によって　いろいろ違うので\n\t台えらびも　大切ですね。\n@c2@"
"109":
  de: "@a@b*: Ⓠ Was macht dich so schnell wie der Wind?\nEine Meteorarmschiene, das weiß jedes Kind! Ⓠ\n@c1@"
  en: "@a@b*: Ⓠ Oh with a meteorite bracer up your sleeve,\nyou'll be sped up like you would never believe! Ⓠ\n@c1@"
  es: "@a@b*: ¡Oh, con un brazalete de meteorito y valor,\nsurcarás los cielos y encontrarás el amor! Ⓠ\n@c1@"
  fr: "@a@b*ⓢ Ⓠ Oh, avec un brassard de météore au bras,\nvous atteindrez des vitesses que vous n'imaginiez pasⓠ Ⓠ\n@c1@"
  it: "@a@b*: Ⓠ Se il bracciale del lampo indosserai,\nveloce come e più del vento andrai! Ⓠ\n@c1@"
  ja: "@a@b＊「ラララ♪\n\tほしふるうでわを　つけたなら\n\tすばやさ　あがって　うれしいな～。\n@c1@"
"110":
  de: "@a@b*: Tagchen, Schätzchen. Ich bin Dolly, die Songprinzessin. Ich hab mich nur aus Spaß so rausgeputzt.\n@c1@"
  en: "@a@b*: Howdy, honey. I'm Dolly, princess o' song. I'm jes' dressed like this right now for a little bit o' fun.\n@c1@"
  es: "@a@b*: Hola, %H860%X%A120%Xquerido%Z%B120%Xquerida%Z%Y%R000%Xqueridas%Yqueridos%Z%Z. Soy la Panto, la reina de la canción. Estoy así vestida simplemente para pasar un buen rato.\n@c1@"
  fr: "@a@b*ⓢ Salut, mon chou. Je suis Dolly, la diva du chant. Je suis habillée comme ça parce que c'est plus amusant.\n@c1@"
  it: "@a@b*: Ciao! Io sono Eliva, la Vera Diva! Che %H860%Xte%Yve%Z ne pare del mio stile? Bello, no?\n@c1@"
  ja: "@a@b＊「わたしは　歌姫のアンナよ。\n\tこのかっこうは　コスプレなの。\n@c1@"
"111":
  de: "@a@b*: Was kann ich für Euch tun, Schätzchen? Ein kleines Liebeslied, vielleicht?\n@c1@"
  en: "@a@b*: What can I do for you, honey?\nA love song, maybe?\n@c1@"
  es: "@a@b*: ¿Puedo ayudar%H860%Xte%Yos%Z en algo, %H860%X%A120%Xquerido%Z%B120%Xquerida%Z%Y%R000%Xqueridas%Yqueridos%Z%Z?\n¿Una canción de amor, quizás?\n@c1@"
  fr: "@a@b*ⓢ Qu'est-ce que je peux faire pour toi, mon chouⓡ\nTu veux une chanson d'amour, peut-êtreⓡ\n@c1@"
  it: "@a@b*: Cosa posso fare per %H860%Xte? Vuoi%Yvoi? Volete%Z ascoltare un brano d'amore?\n@c1@"
  ja: "@a@b＊「お客さん　何かごよう？\n\tもしかして　ラブソング　探してる？\n@c1@"
"112":
  de: "@a@b*: Oder vielleicht ist Euch nach einem Tänzchen. Wie wäre es hiermit?\n@c1@"
  en: "@a@b*: Or maybe you're after somethin' you can dance to. How's about this little number?\n@c1@"
  es: "@a@b*: ¿O %H860%Xprefieres%Ypreferís%Z algo con lo que %H860%Xpuedas%Ypodáis%Z bailar? ¿Qué %H860%Xte%Yos%Z parece este numerito?\n@c1@"
  fr: "@a@b*ⓢ Ou peut-être que tu cherches quelque chose de plus dansant. Qu'est-ce que tu dis de çaⓡ\n@c1@"
  it: "@a@b*: O forse %H860%Xti%Yvi%Z andrebbe qualcosa di più vivace? Che ne %H860%Xdici%Ydite%Z di questo pezzo?\n@c1@"
  ja: "@a@b＊「それとも　ジプシーダンスを\n\t期待していたのかしら……？\n@c1@"
"113":
  de: "@a@b*: Tag. Ich bin Hoss. Hab mich hierher zurückgezogen und wollte eigentlich nur meinen Frieden haben.\n@c2@"
  en: "@a@b*: Howdy. I'm Zack, an' I done retired to this here town to git me some peace.\n@c2@"
  es: "@a@b*: Qué pasa. Me llamo Zacarías y me he retirado a esta ciudad para estar tranquilo.\n@c2@"
  fr: "@a@b*ⓢ Salut. J'm'appelle Isaac et j'me suis retiré dans cette ville pour être tranquille. \n@c2@"
  it: "@a@b*: Io sono Giango, e ho deciso di venire in questo posto per riposarmi un po', dopo aver faticato tutta la vita sui pascoli di mezzo mondo.\n@c2@"
  ja: "@a@bドン・モハメ「わしは　ドン・モハメ。\n\tこの城で　いんきょするもの。\n@c2@"
"114":
  de: "@aHoss@bIch dachte, ich setz' mich hier zur Ruhe, verbringe noch ein paar friedliche Jährchen und mache mich dann zufrieden vom Acker.\n@c2@"
  en: "@aZack@bI thought I'd be retirin' here an' then livin' a few years before makin' my peace an' passin' on quietly.\n@c2@"
  es: "@aZacarías@bPensé en retirarme aquí y vivir unos años en paz antes de hacer balance y estirar la pata sin agobios.\n@c2@"
  fr: "@aIsaac@bJ'pensais me retirer ici et y vivre quelques années tranquilles avant de m'éteindre paisiblement.\n@c2@"
  it: "@aGiango@bHo pensato di trascorrere gli ultimi anni della mia esistenza qui, in santa pace, prima di montare in sella per il viaggio finale, quello da cui nessuno fa ritorno...\n@c2@"
  ja: "@a@bドン・モハメ「しかし　長生きは\n\tするもんじゃな。\n@c2@"
"115":
  de: "@aHoss@bHättet Ihr mir erzählt, ich würde noch erleben, dass die Burg aus der Wüste neu erstehen könnte, hätte ich Euch für verrückt erklärt!\n@c2@"
  en: "@aZack@bIf you'd've ever told me I'd live to see the day the castle came back from from under that there desert, I'd've called you crazy!\n@c2@"
  es: "@aZacarías@bSi alguna vez me %H860%Xhubieras%Yhubierais%Z dicho que un día vería que el castillo resurgiría del desierto, ¡hubiera dicho que %H860%Xestabas%Yestabais%Z mal de la azotea!\n@c2@"
  fr: "@aIsaac@bSi on m'avait dit que je vivrais assez longtemps pour voir le château ressurgir des sables du désert, je n'y aurais jamais cruⓠ\n@c2@"
  it: "@aGiango@bSe qualcuno mi avesse detto che sarei vissuto tanto a lungo da veder risorgere il castello sprofondato nel deserto, gli avrei dato del matto!\n@c2@"
  ja: "@a@bドン・モハメ「まさか　この目で\n\tお城が　ふっかつするところを\n\t見られるとは　思わんかったぞ。\n@c2@"
"116":
  de: "@aSeñor Paco@bIss habe früher hier gearbeitet, in el castillo der besten ciudad der Welt: Pioniria!\n@c2@"
  en: "@aMr. Ned@bI used to work here, in the castle o' the greatest city in all the world: Pioniria! \n@c2@"
  es: "@aSr. Jaco@bAntes trabajaba aquí, en el castillo de la más grande ciudad del mundo: ¡Pioniria! \n@c2@"
  fr: "@aM. Ned@bAutrefois, je travaillais ici, dans le château de la plus grande ville du mondeⓢ Pioniriaⓠ\n@c2@"
  it: "@aQuirino@bYo lavoravos aqui, nel castillo della più grandes città del mondos, Castromercatum!\n@c2@"
  ja: "@a@bエド「わたしは　かつて\n\t偉大なる都　マーリブの城に\n\t仕える者　だったのです。\n@c2@"
"117":
  de: "@aSeñor Paco@bUnd diese Burg ssieht genauso aus wie die, die früher hier stand. Das genaue Ebenbild!\n@c2@"
  en: "@aMr. Ned@bAn' this castle we got here now is jes' the spit o' the one we had in them days. They couldn't be mare alike!\n@c2@"
  es: "@aSr. Jaco@bY el castillo que tenemos ahora es el retrato del que teníamos antes nomás. ¡No podrían ser más parecidos!\n@c2@"
  fr: "@aM. Ned@bEt le château qui se dresse ici aujourd'hui est la réplique exacte de celui qu'on avait à l'époque. Ils ne pourraient pas être plus semblablesⓠ\n@c2@"
  it: "@aQuirino@bY el castillo que c'è aqui oras è proprio como quellos que c'era un tempos! Sono igualos!\n@c2@"
  ja: "@a@bエド「そう　まさに　ここにある城は\n\tマーリブの都に　うりふたつ！\n@c2@"
"118":
  de: "@aSeñor Paco@bIss wusste von dem verfluchten Gefäß, also wollte iss Ssultan Eknu davor warnen, aber der bösse Ssauberer, der hat miss im Galopp erwisst, und...\n@c2@"
  en: "@aMr. Ned@bAnyways, I knowed about that there cursed pot, so I done trotted up to try an' tell Sultan Farog, but that evil sorcerer caught me on the hoof, an'...\n@c2@"
  es: "@aSr. Jaco@bPues descubrí lo de la tinaja maldita y corrí a contárselo al sultán Rainierito III pero el brujo malvado me tomó de la pezuña y ya...\n@c2@"
  fr: "@aM. Ned@bBref, moi, j'étais au courant de cette histoire de jarre maudite, alors je suis parti au petit trot pour le dire au sultan Carapo.\n㈡\nMais ce maudit sorcier m'a coupé l'herbe sous le sabot...\n@c2@"
  it: "@aQuirino@bYo sapevos della giara maledetta, y volevos parlarne a Ran Sultan, ma quellos stregones malvagio mi sorpreses primas que potessi farlos...\n@c2@"
  ja: "@a@bエド「わたしは　呪いのつぼのことを知り\n\t王さまに　お知らせしようとしたところ\n\t悪しき魔法使いに　見つかってしまい……\n@c2@"
"119":
  de: "@aSeñor Paco@bAy, und auf einmal war iss in einen Mustang verwandelt. Aber iss kann reden, und irgendwie gefällt mir mein Leben als Hengst!\n@c2@"
  en: "@aMr. Ned@bWell, that's when I got turned into a horse. But hay, I kin talk now, an' I kinda like livin' stallion style.\n@c2@"
  es: "@aSr. Jaco@bPues así nomás que me convertí en un puro caballo. Pero eh, ya puedo platicar y me gusta vivir esta vida de semental.\n@c2@"
  fr: "@aM. Ned@bC'est comme ça que j'ai été transformé en cheval. Mais bon, pas la peine d'en faire tout un foin. Je peux parler et je mène une vie d'étalon, maintenant.\n@c2@"
  it: "@aQuirino@bFu alloras que mi trasformò in un caballo. Però so ancoras parlares! Y comunque, me gusta viveres como un caballo! Aqui è pienos de puledras!\n@c2@"
  ja: "@a@bエド「馬に変えられてしまったのでした。\n\tしかし　いまは　こうして言葉も話せますし\n\t馬でいるのも　わるくないです。\n@c2@"
"120":
  de: "@aSeñor Paco@bHola! Iss bin Señor Paco, der spressende Mustang!\n@c2@"
  en: "@aMr. Ned@bWhy howdy there, I'm Mr. Ned, the talkin' horse.\n@c2@"
  es: "@aSr. Jaco@bQué onda, soy el Sr. Jaco, el caballo parlante.\n@c2@"
  fr: "@aM. Ned@bSaluhuhu, je suis M. Ned, le cheval qui parle.\n@c2@"
  it: "@aQuirino@bHola! Yo soy Quirino, el caballo parlante.\n@c2@"
  ja: "@a@bエド「わたしは　しゃべる馬の　エド。\n@c2@"
"121":
  de: "@aSeñor Paco@bIss kann es kaum erwarten, wieder die gute alte Burg ssu bewachen. Caramba!\n@c2@"
  en: "@aMr. Ned@bI'm jes' geed up to be able to watch over the ol' castle again.\n@c2@"
  es: "@aSr. Jaco@bYa estoy bien listo para volver a vigilar el castillo.\n@c2@"
  fr: "@aM. Ned@bJe suis simplement content de pouvoir de nouveau veiller sur le château.\n@c2@"
  it: "@aQuirino@bAh, como soy felices di poter vederes el castillo di nuovos!\n@c2@"
  ja: "@a@bエド「この美しい城を　ふたたび\n\t見守ることができて　幸せです。\n@c2@"
"122":
  de: "@a@b*: Hallo, Schnuckelchen. Ich bin Psaro, Königin der Wüste, und ich bin den weiten Weg von Femiscyra hierher gekommen.\n@c3@"
  en: "@a@b*: Hello there, lovie. I'm Psaro, Queen of the Desert, and I've come all the way down from dear old Femiscyra.\n@c3@"
  es: "@a@b*: Hola, %H860%X%A120%Xguapo%Z%B120%Xmona%Z%Y%R000%Xmonas%Yguapos%Z%Z. Soy Psaro, Reina del Desierto, y vengo de muy lejos, de Feministia.\n@c3@"
  fr: "@a@b*ⓢ Salut, toi. Je suis Psaro, Reine du désert.\nJe suis venue jusqu'ici depuis Fémiscyra.\n@c3@"
  it: "@a@b*: Ciao, %H860%Xbellezza%Ybellezze%Z. Io sono Psaro, la Regina del Deserto, appena arrivata da Femiscyra.\n@c3@"
  ja: "@a@bクインローザ「あーら　こんにちはっ。\n\tアタシ　ガーデンブルグから来た\n\tクインローザよ。　オホホホホ！\n@c3@"
"123":
  de: "@aPsaro, Königin der Wüste@bWie bitte? Ihr kennt mich von irgendwoher?\nOh, so ein Frechdachs! Wer wird denn so vorwitzig sein?\n@c3@"
  en: "@aPsaro, Queen of the Desert@bWhat's that? Do you know me from somewhere?\nOoh, cheeky! You're very forward, aren't you, love?\n@c3@"
  es: "@aPsaro, Reina del desierto@b¿Qué? ¿Me %H860%Xconoces%Yconocéis%Z de antes?\n¡Uy, %H860%X%A120%Xbribón%Z%B120%Xdescarada%Z%Y%R000%Xdescaradas%Ybribones%Z%Z! %H860%X%A120%XEres muy lanzado, ¿verdad que sí guapo?%Z%B120%XTe equivocas de hombre, cari.%Z%Y%R000%XOs equivocáis de hombre, monas.%YSois muy lanzados, ¿verdad que sí?%Z%Z\n@c3@"
  fr: "@aPsaro, Reine du désert@bQu'est-ce qu'il y aⓡ On se connaît, tu disⓡ\nOh, %A120%Xpetit coquin%Z%B120%Xpetite coquine%Zⓠ Tu es du genre %A120%Xdirect%Z%B120%Xdirecte%Z, mon chou, nonⓡ\n@c3@"
  it: "@aPsaro, la Regina del Deserto@bCome %H860%Xdici? Pensi%Ydite? Pensate%Z di avermi già incontrata da qualche parte? Certo che %H860%Xvai dritto al sodo, tu%Ynon perdete tempo, voi%Z! Adoooro le persone intraprendenti...\n@c3@"
  ja: "@a@bクインローザ「なーに？　どこかで私に\n\t会ったことが　あるですって？\n\tうふふっ　ナンパはおことわりよ！\n@c3@"
"124":
  de: "@aArchi O. Loge@bWie geht's? Ich bin Archi O. Loge. Wollt Ihr die Geschichte von Pioniria hören, der Stadt, die vor vielen Monden hier gestanden hat?\n@c2@"
  en: "@aArchie O'Logist@bHow d'ye do? I'm Archie O'Logist. Are ye wantin' to hear the tale of ole Pioniria, the town that stood here so many moons ago?\n@c2@"
  es: "@aAl-Queb-Ologo@b¿Cómo %H860%Xestiás%Yestiáis%Z? Mi llamo Al-Queb-Ologo. ¿%H860%XTi%YOs%Z gustiaría escuchar la histioria de Pioniria, la ciudad que aquí si erigía hace muchas liunas?\n@c2@"
  fr: "@aHervé Stige@bComment allez-vousⓡ Je suis Hervé Stige.\n㈡\nVoulez-vous entendre l'histoire de l'antique Pioniria, la ville qui se dressait ici il y a de cela de nombreuses lunesⓡ\n@c2@"
  it: "@aDino Gionz@bCiao! Come va? %H860%XT'andrebbe%YV'andrebbe%Z d'ascolta' la storia di Castromercatum, la città-castello che sorgeva proprio huì tant'anni fa?\n@c2@"
  ja: "@a@bオロジス「私は　考古学者の　オロジス。\n\tこの地に伝わる　マーリブの伝説を\n\tお聞かせしましょうか？\n@c2@"
"125":
  de: "@aArchi O. Loge@bDie Sultane der Stadt Pioniria hatten ein höchst heiliges und magisches Gefäß, das von einer Generation an die nächste weitergegeben wurde.\n@c2@"
  en: "@aArchie O'Logist@bThe sultans of the city o' Pioniria had a most holy an' magical pot that was passed from one generation to the next.\n@c2@"
  es: "@aAl-Queb-Ologo@bLos siultanes de la ciudad de Pioniria poseían una tinaja sagrada y mágica que se triansmitía de genieración en genieración.\n@c2@"
  fr: "@aHervé Stige@bLes sultans de la ville de Pioniria possédaient une jarre sacrée et magique, qu'ils se transmettaient de génération en génération.\n@c2@"
  it: "@aDino Gionz@bI regnanti di Castromercatum custodivano gelosamente una giara magiha, che si passavano di generazione 'ngenerazione.\n@c2@"
  ja: "@a@bオロジス「伝説の都　マーリブ王国には\n\t先代の王から伝わる\n\t神器のつぼが　あったそうな。\n@c2@"
"126":
  de: "@aArchi O. Loge@bAber auf dem Gefäß muss ein schrecklicher Fluch gelegen haben.\n@c2@"
  en: "@aArchie O'Logist@bBut it seems the pot was afflicted by some sort o' terrible curse, so it was.\n@c2@"
  es: "@aAl-Queb-Ologo@bPero dicen que la tinaja sufría una tierrible maldición, sí.\n@c2@"
  fr: "@aHervé Stige@bMais cette jarre semblait être sous l'emprise d'une terrible malédiction.\n@c2@"
  it: "@aDino Gionz@bMa la leggenda narra che quell'oggetto fosse maledetto. Proprio hosì!\n@c2@"
  ja: "@a@bオロジス「しかし　そのつぼは　本当は\n\t呪いのつぼ　だったのです。\n@c2@"
"127":
  de: "@aArchi O. Loge@bEines Tages nun wollten Eknu, der junge Sultan von Pioniria, und seine Gemahlin das Gefäß öffnen, ohne zu wissen, was es enthielt.\n@c2@"
  en: "@aArchie O'Logist@bNow, one day, Farog, the young sultan o' Pioniria, an' his lady wife were after openin' that pot, not knowin' o' course o' the curse it contained.\n@c2@"
  es: "@aAl-Queb-Ologo@bUn día, Rainierito III, el joven siultán de Pioniria, y su espiosa, decidieron abrir la tinaja, evidientemente sin saber la maldición que contienía.\n@c2@"
  fr: "@aHervé Stige@bUn jour, Carapo, le jeune sultan de Pioniria, et son épouse tentèrent d'ouvrir cette jarre. Bien sûr, ils ignoraient tout de la malédiction qui l'entourait.\n@c2@"
  it: "@aDino Gionz@bUn giorno, Ran Sultan e la su' giovane moglie decisero d'apri' la giara, 'un sapendo della maledizione che gravava su di essa...\n@c2@"
  ja: "@a@bオロジス「マーリブの若き王　レオンと\n\t王妃は　呪いのつぼと知らずに\n\tフタを　開けてしまいました。\n@c2@"
"128":
  de: "@aArchi O. Loge@bUnd als sie es öffneten, erschien ein grausiger Geist und beschwor einen furchtbaren Sandsturm herauf.\n@c2@"
  en: "@aArchie O'Logist@bNo sooner did they pop it open than a most horrible genie appeared, an' summoned up a swirlin' great sandstorm.\n@c2@"
  es: "@aAl-Queb-Ologo@bEn el momiento en que la abrieron, de su intierior surgió un malviado genio que invocó una tierrible tiormenta de arena.\n@c2@"
  fr: "@aHervé Stige@bÀ peine l'eurent-ils ouverte qu'un horrible génie apparut et déclencha une gigantesque tempête de sable.\n@c2@"
  it: "@aDino Gionz@bAppena l'aprirono, saltò fori un genio terribile, che scatenò una potentissima tempesta di sabbia.\n@c2@"
  ja: "@a@bオロジス「すると　つぼの中から\n\t封印されていた魔物が　現れ\n\tとてつもない砂嵐を　呼びよせました！\n@c2@"
"129":
  de: "@aArchi O. Loge@bDer Sturm toste und wütete. Er verschlang die Stadt Pioniria und vergrub sie tief im Wüstensand.\n@c2@"
  en: "@aArchie O'Logist@bThe storm raged an' rumbled an' swallowed up the city o' Pioniria, buryin' it deep beneath the desert sands.\n@c2@"
  es: "@aAl-Queb-Ologo@bLa tiormenta asoló, diestruyó y engulló la ciudad de Pioniria, y la siepultó bajo las arienas del desierto.\n@c2@"
  fr: "@aHervé Stige@bLa tempête se déchaîna pendant longtemps et ses tourbillons finirent par engloutir la cité de Pioniria, l'enterrant au plus profond des sables du désert.\n@c2@"
  it: "@aDino Gionz@bLa tempesta fu talmente devastante che tutta Castromercatum fu 'nghiottita dalla sabbia. Della grande città-castello 'un restò più traccia!\n@c2@"
  ja: "@a@bオロジス「マーリブの都は　みるみる\n\t砂嵐に　飲み込まれ\n\tくずれ落ち……\n@c2@"
"130":
  de: "@aArchi O. Loge@bDer tapfere Eknu, der sich dem Geist entgegenstellte, um sein geliebtes Reich zu verteidigen, wurde dazu verflucht, eine grauenvolle neue Gestalt anzunehmen.\n@c2@"
  en: "@aArchie O'Logist@bAn' the gallant Farog, who tried his best to stand up to the genie an' protect his beloved kingdom, was cursed to take on a terrible new form.\n@c2@"
  es: "@aAl-Queb-Ologo@bY el valiente Rainierito III, que hizo friente al genio para prioteger su amado reino, fue priesa de una maldición y se convirtió en algo horrible.\n@c2@"
  fr: "@aHervé Stige@bLe vaillant Carapo avait fait de son mieux pour s'opposer au génie et protéger son royaume bien-aimé.\n㈡\nPour cet acte de bravoure, il fut maudit et transformé en une terrible créature.\n@c2@"
  it: "@aDino Gionz@bE il povero Ran Sultan, che aveva cercato di protegge' il su' regno e di ferma' il genio, fu colpito da un sortilegio, e mutato in una strana creatura...\n@c2@"
  ja: "@a@bオロジス「さらに　ゆうかんにも　魔物に\n\t立ち向かった　レオン王は\n\t呪いで　姿を変えられてしまったとか。\n@c2@"
"131":
  de: "@aArchi O. Loge@bKein Interesse, was? Auch gut. Vielleicht ein andermal, hm?\n@c0@"
  en: "@aArchie O'Logist@bNot interested, eh? Fair enough. Maybe another\ntime, eh?\n@c0@"
  es: "@aAl-Queb-Ologo@bNo %H860%Xti%Yos%Z interiesa, ¿verdad? Mi piarece bien. Puede que en otra ocasión, ¿sí?\n@c0@"
  fr: "@aHervé Stige@bÇa ne vous intéresse pas, heinⓡ Très bien. Une autre fois, peut-être.\n@c0@"
  it: "@aDino Gionz@bMa come?! 'Un %H860%Xt'interessa%Yv'interessa%Z?! Peggio per %H860%Xte%Yvoi%Z, perché la storia l'è bella!\n@c0@"
  ja: "@a@bオロジス「そうですか。\n\tでは　また　べつの機会に。\n@c0@"
"132":
  de: "@aPrissi@bSultan Eknu ist doch ein gut aussehender Mann, nicht wahr? Und sehr jung. Ich muss ihn einfach für mich gewinnen!\n@c1@"
  en: "@aPrincess Pam@bSultan Farog's a handsome man, isn't he? And very young, too. I absolutely must make him mine!\n@c1@"
  es: "@aPrincesa Vanessa@bRainierito III es monísimo, ¿a qué sí? Y joven también. ¡Voy a hacer todo lo posible para que sea mío!\n@c1@"
  fr: "@aPrincesse Pam@bLe sultan Carapo est bel homme, n'est-ce pasⓡ Et jeune, de surcroît. Il faut absolument qu'il soit à moiⓠ\n@c1@"
  it: "@aPrincipessa Locca@bCerto che Ran Sultan è proprio un bel fustacchione, eh? Oh! Volevo dire che è un uomo affascinante e di gran classe. Dev'essere mio!\n@c1@"
  ja: "@a@bデイジー「ねえねえ　レオン王って\n\t若いし　カッコいいし　ステキね～♪\n\tきっといつか　モノにしてみせるわ！\n@c1@"
"133":
  de: "@aHannibal@bIhr meint, diese Unke war in Wirklichkeit Sultan Eknu?\n@c2@"
  en: "@aHannibal@bYou're telling me that frog that was there was actually Sultan Farog?\n@c2@"
  es: "@aAníbal@b¿Me %H860%Xestás%Yestáis%Z diciendo que esa rana era en realidad Rainierito III?\n@c2@"
  fr: "@aHannibal@bVous m'dites que ce crapaud qu'il y avait là-bas était en fait le sultan Carapoⓡ\n@c2@"
  it: "@aHannibal@b%H860%XVorresti%YVorreste%Z dire che quella rana in realtà era Ran Sultan?!\n@c2@"
  ja: "@a@bハンビル「なんと　そこにいたカエルが\n\tレオン王だったとは！\n@c2@"
"134":
  de: "@aHannibal@bIch schätze, wir schulden Euch was, Soldat!\n@c2@"
  en: "@aHannibal@bI guess we owe you one, soldier!\n@c2@"
  es: "@aAníbal@bImagino que %H860%Xte%Yos%Z debemos una, %H860%Xsoldado%Ysoldados%Z.\n@c2@"
  fr: "@aHannibal@bOn vous doit une fière chandelle, soldatⓠ\n@c2@"
  it: "@aHannibal@bQuesta sì che è un'informazione utile! Grazie!\n@c2@"
  ja: "@a@bハンビル「まったく　何と　お礼を\n\t申せばよいのやら……。\n@c2@"
"135":
  de: "@aHannibal@bIch und mein H-Team werden uns umgehend bei der Armee des Sultans melden und sie bei der Bewachung der Stadt unterstützen.\n@c2@"
  en: "@aHannibal@bMe and my unit, the H-Team, will attach ourselves to Sultan Farog's outfit immediately, and assist in guarding %a00260.\n@c2@"
  es: "@aAníbal@bMis hombres y yo, el Equipo H, nos uniremos en persona a la guardia de Rainierito III y...\n㈡\n... ayudaremos a proteger %a00260 de tramperos y demás.\n@c2@"
  fr: "@aHannibal@bMoi et mon unité, l'Agence du risque, on va tout de suite se mettre au service du sultan Carapo...\n㈡\n... pour l'aider à protéger %a00260.\n@c2@"
  it: "@aHannibal@bIo e il mio gruppo, il famoso Ehi!-Team, ci recheremo subito dal Sultano. Siamo pronti a servire fedelmente lui e %a00260!\n@c2@"
  ja: "@a@bハンビル「今度こそ　レオン王と　ともに\n\t%a00260を\n\t守り通しますぞ！\n@c2@"
"136":
  de: "@aHoss@bAch, übrigens, habt Ihr schon gehört, was in diesem Buch mit der Legende geschrieben steht? Ich erzähl's Euch...\n@c2@"
  en: "@aZack@bOh, by the by, you heard what it says in that there book with the legend about this ol' town?\nWell, I'll tell y'all...\n@c2@"
  es: "@aZacarías@b¡Ah!, oye, ¿%H860%Xsabes%Ysabéis%Z lo que dicen en un librajo de no sé qué leyenda de esta ciudad?\nVale, %H860%Xcolega, te%Ycolegas, os%Z lo cuento...\n@c2@"
  fr: "@aIsaac@bOh, à ce propos, vous savez ce qui est dit dans le livre qui raconte la légende de cette villeⓡ Eh bien, j'vais vous l'dire...\n@c2@"
  it: "@aGiango@bA proposito, %H860%Xhai%Yavete%Z letto il libro che racconta la leggenda di questa vecchia città? Ecco cosa dice...\n@c2@"
  ja: "@a@bドン・モハメ「ところで　お前さん\n\t知っておるかな？　かつて\n\tこの町にあった　伝説の書を。\n@c2@"
"137":
  de: "@a@bⓞWenn die Stadt wieder zur Burg wird, wird sein Körper aus dem Gefäß im südöstlichen Raum wieder auferstehen.\n@c2@"
  en: "@a@bⓗWhen the town once more becomes a castle, his\nbody shall rise again from the pot in the south-western room.\n@c2@"
  es: "@a@bⓕCuando la ciudad sea de nuevo un castillo, su cuerpo volverá a través de la tinaja de la sala sudoriental.ⓖ\n@c2@"
  fr: "@a@bⓥLorsque la ville redeviendra un château, son corps s'élèvera de la jarre située dans la pièce du sud-est.\n@c2@"
  it: "@a@bⓕQuando la città tornerà a essere un castello, il suo corpo sorgerà nuovamente dalla giara che si trova nella sala sud-orientale.ⓖ\n@c2@"
  ja: "@a@b“この町が　城となれば　南西の部屋\n　つぼに　かこまれた　つぼに\n　その者の　カラダは　復活すべし。\n@c2@"
"138":
  de: "@a@bDann wird aus den Tiefen des Schlosses, aus den Tiefen einer Truhe voller Schmerzen, auch sein Herz wiederauferstehen.\n@c2@"
  en: "@a@bⓗThen, from the depths of the castle, from deep within a treasure chest filled with pain, his heart also shall rise.\n@c2@"
  es: "@a@bⓕDespués, en lo más recóndito del castillo, de las profundidades de un cofre del tesoro repleto de dolor, se elevará su corazón.ⓖ\n@c2@"
  fr: "@a@bPuis, des profondeurs du château, des profondeurs d'un coffre au trésor empli de douleur, son cœur s'élèvera lui aussi.\n@c2@"
  it: "@a@bⓕPoi sarà la volta del suo cuore, che emergerà dalle profondità del castello, dagli abissi di un forziere colmo di dolore.ⓖ\n@c2@"
  ja: "@a@b“そして　城のはるか地下　深く\n　痛みをともなう宝箱に\n　その者の　心は　復活するであろう。\n@c2@"
"139":
  de: "@a@bUnd schließlich der größte Schatz der Sultana von Pioniria... die Truhe vor dem Kerker... das Geschenk ihres geliebten Königs.ⓟ\n@c2@"
  en: "@a@bⓗAnd finally, the Sultana of Pioniria's most treasured possession...in a treasure chest locked in a cell...the gift of her beloved king.ⓘ\n@c2@"
  es: "@a@bⓕY finalmente, la posesión más codiciada de la Sultana de Pioniria... el cofre del tesoro en el exterior de la cárcel... el regalo de su amado rey.ⓖ\n@c2@"
  fr: "@a@bEt enfin, le bien le plus précieux de la sultane de Pioniria... le coffre au trésor à l'extérieur de la prison... le cadeau de son bien-aimé roi.ⓦ \n@c2@"
  it: "@a@bⓕInfine toccherà al tesoro più caro alla Sultana di Castromercatum... Fuori dalla prigione, lo scrigno donato dal suo amato sovrano.ⓖ\n@c2@"
  ja: "@a@b“そして　最後に　マーリブ王妃の宝物……\n　ろうやの先の　宝箱。\n　愛しい王の　おくりもの。\n@c2@"
"140":
  de: "@aHoss@bSo steht's da, so wahr mir die Göttin helfe.\n@c2@"
  en: "@aZack@bYessiree, that's what it says.\n@c2@"
  es: "@aZacarías@bSí, %H860%Xcolega%Ycolegas%Z, eso es lo que dice.\n@c2@"
  fr: "@aIsaac@bOuaip, c'est comme j'vous dis.\n@c2@"
  it: "@aGiango@bSissignore! Dice proprio così!\n@c2@"
  ja: "@a@bドン・モハメ「……と　その書には\n\t書かれておったな。\n@c2@"
"141":
  de: "@aZini@bWas ist denn hier los? Wo ist denn meine Lieblingsmatschstelle hin?\n@c1@"
  en: "@aMary Curey@bWhat's going on? Where did my favourite damp\nspot goo?\n@c1@"
  es: "@aMari Curi@b¿Qué está pasando? ¿Dónde está mi lodazal favorito?\n@c1@"
  fr: "@aMédée Médoc@bQu'est-ce qui se passeⓡ Où est passée ma maaare favoriteⓡ\n@c1@"
  it: "@aDolores Tecuro@bEh? Ma cosa è successo? Che fine ha fatto il mio posto umido slurpreferito?\n@c1@"
  ja: "@a@bベホイミン「なんでい　なんでい！\n\tオレの好きな　じめじめした場所が\n\tここしか　なくなっちまったよ……。\n@c1@"
"142":
  de: "@aZini@bOoooch. Rüüüüllllpsss...\n@c1@"
  en: "@aMary Curey@bOhhhh... Buuuurrrrrp...\n@c1@"
  es: "@aMari Curi@bOhhhh... Buuuurrrrrp...\n@c1@"
  fr: "@aMédée Médoc@bOoooh.... Beeeeuuuuurp...\n@c1@"
  it: "@aDolores Tecuro@bOh... Burp!\n@c1@"
  ja: "@a@bベホイミン「うぃ～　ひっく……。\n@c1@"
"143":
  de: "@aUnke@bGuten Tag, %a00140! Ihr habt dieser Stadt aus ihren bescheidenen Anfängen zu ihrer jetzigen Pracht verholfen.\n@c2@"
  en: "@aFrog@bGreetings, %a00140! You have finally brought the city from its humble origins to this most stately and palatial form.\n@c2@"
  es: "@aRanito@b¡Saludos, %a00140! Finalmente has conseguido que la ciudad supere sus humildes orígenes y se convierta en un palacio.\n@c2@"
  fr: "@aCrapaud@bBonjour, %a00140ⓠ Vous avez finalement fait de cette ville aux modestes origines une véritable citadelle royale.\n@c2@"
  it: "@aRana@bSalve%H860%X, %a00140%Y%Z! È con immenso piacere che vedo che %H860%Xhai%Yavete%Z saputo trasformare in un vero castello quello che era solo un piccolo villaggio nel deserto.\n@c2@"
  ja: "@a@bカエル「やあ　%a00140さん！\n\tとうとう　町を　お城にまで\n\t発展させてくれたね。\n@c2@"
"144":
  de: "@aUnke@bDie Burg gleicht jener aus den Tagen Pionirias wie ein Straußenei dem anderen.\n@c2@"
  en: "@aFrog@bIt is the very image of the castle that once stood on this spot in the days of Pioniria.\n@c2@"
  es: "@aRanito@bEs la viva imagen del castillo que hace tiempo se erigía aquí, en la época de Pioniria.\n@c2@"
  fr: "@aCrapaud@bElle est la réplique exacte du château qui se dressait exactement au même endroit à l'époque de Pioniria.\n@c2@"
  it: "@aRana@bÈ identico a Castromercatum, la città fortificata che sorgeva qui tanti anni fa.\n@c2@"
  ja: "@a@bカエル「ここは　まるで　昔の\n\tマーリブの城と　そっくりさ。\n@c2@"
"145":
  de: "@aUnke@bVielleicht lässt sich auch das, was mir einst von den Monstern gestohlen wurde, irgendwo tief in diesem Schloss wiederfinden.\n@c2@"
  en: "@aFrog@bPerhaps that which was stolen from me by the monsters can be located somewhere in the depths\nof this castle also.\n@c2@"
  es: "@aRanito@bPuede que lo que los monstruos me arrebataron se encuentre en alguna parte de las profundidades del castillo.\n@c2@"
  fr: "@aCrapaud@bPeut-être que ce qui m'a été dérobé par les monstres pourrait aussi être retrouvé quelque part dans les profondeurs de ce château-ci.\n@c2@"
  it: "@aRana@bForse, proprio in questo nuovo maniero, è custodito ciò che i mostri mi sottrassero tanto tempo fa...\n@c2@"
  ja: "@a@bカエル「もしかしたら　ボクが\n\t魔物に　うばわれたものも\n\tお城のどこかで　見つかるかも……\n@c2@"
"146":
  de: "@aUnke@bIch kann jetzt nicht mehr dazu sagen, aber ich hoffe inbrünstig, dass Ihr mir helfen könnt.\n@c2@"
  en: "@aFrog@bI can tell you no more at the moment, but I believe most fervently that you can help me.\n@c2@"
  es: "@aRanito@bPor el momento no puedo contarte más pero creo fervientemente que puedes ayudarme.\n@c2@"
  fr: "@aCrapaud@bJe ne peux vous en dire davantage pour l'instant, mais je crois très sincèrement que vous pouvez m'aider.\n@c2@"
  it: "@aRana@bPurtroppo, in questo momento non mi è possibile aggiungere altro. Sono però convinto che %H860%Xtu possa%Yvoi possiate%Z ancora aiutarmi...\n@c2@"
  ja: "@a@bカエル「わけあって　ボクからは\n\tこれ以上　話せないけど……　きっと\n\t助けてくれると　信じてるよ。\n@c2@"
"147":
  de: "@aSultan Eknu@bSeid mir gegrüßt, %a00140! Ich bin überglücklich, Euch... äh, kennenzulernen.\n@c2@"
  en: "@aSultan Farog@bGreetings, %a00140! I am very pleased to meet you for this, the...ah, first time. I am Sultan Farog.\n@c2@"
  es: "@aRainierito III@b¡Saludos, %a00140! Es un verdadero placer veros una vez... eh, por primera vez. Mi nombre es Rainierito III.\n@c2@"
  fr: "@aSultan Carapo@bBonjour, %a00140ⓠ Je suis ravi de vous rencontrer pour cette, euh... pour la première fois.\nJe suis le sultan Carapo.\n@c2@"
  it: "@aRan Sultan@bSalve%H860%X, %a00140%Y%Z! Questa... Ehm, questa è la prima... ehm... Sì, questa è la prima volta che ci incontriamo. Io sono Ran Sultan.\n@c2@"
  ja: "@a@bレオン「やあ　%a00140さん！\n\tはじめまして……　かな？\n\tボクは　レオン。\n@c2@"
"148":
  de: "@aSultan Eknu@bEinst herrschte ich über diese Burg, doch in meiner Verblendung verlor ich die Frau, die ich liebte, und mein Heim wurde von der Wüste verschlungen.\n@c2@"
  en: "@aSultan Farog@bI once ruled over this castle, but in my foolishness, I lost the woman I loved, and my home was swallowed by the sands of the desert.\n@c2@"
  es: "@aRainierito III@bHace tiempo gobernaba este castillo, pero cegado por mi insensatez, perdí a la mujer que amaba y mi hogar quedó sepultado por las arenas del desierto.\n@c2@"
  fr: "@aSultan Carapo@bJe régnais autrefois sur ce château, mais mon inconscience m'a fait perdre ma bien-aimée et j'ai vu ma demeure engloutie par les sables du désert.\n@c2@"
  it: "@aRan Sultan@bUn tempo governavo su questo castello ma, a causa della mia stupidità, persi la donna che amavo, e il mio regno fu inghiottito dal deserto.\n@c2@"
  ja: "@a@bレオン「かつては　マーリブ城を　治める王…\n\tそして　呪いのつぼで　城をほろぼされ\n\t愛する王妃も失った　バカな男さ。\n@c2@"
"149":
  de: "@aSultan Eknu@bDoch dieses neue Leben, das Ihr mir geschenkt habt, %a00140 ⓚⓛ das werde ich nicht mehr verschwenden.\n@c2@"
  en: "@aSultan Farog@bBut this new life you have given to me, %a00140 ⓚⓛ this I shall not waste.\n@c2@"
  es: "@aRainierito III@bPero ahora se me ha concedido una nueva vida, %a00140... y no pienso volver a echarlo todo a perder.\n@c2@"
  fr: "@aSultan Carapo@bMais sachez, %a00140, que cette nouvelle vie que vous m'avez offerte... celle-là, je ne la gâcherai pas.\n@c2@"
  it: "@aRan Sultan@bMa %H860%Xtu, %a00140, mi hai%Yvoi mi avete%Z donato una nuova vita! E questa volta non mi comporterò come uno sciocco.\n@c2@"
  ja: "@a@bレオン「けれど　%a00140さんに\n\tもらった　この命　ムダにはしない！\n@c2@"
"150":
  de: "@aSultan Eknu@bIch werde den guten Bürgern von %a00260 Freund und Helfer sein.\n@c2@"
  en: "@aSultan Farog@bI shall help the most excellent townsfolk of %a00260 to protect and serve their humble homeland.\n@c2@"
  es: "@aRainierito III@bAyudaré a los extraordinarios habitantes de %a00260 a proteger su humilde tierra natal.\n@c2@"
  fr: "@aSultan Carapo@bJ'aiderai les fantastiques habitants %G260%Xd'%Yde %Z%a00260 à protéger et à servir leur terre d'adoption.\n@c2@"
  it: "@aRan Sultan@bFarò tutto ciò che è in mio potere per aiutare la brava gente di %a00260 a rendere il loro paese ancora più ricco e fiorente.\n@c2@"
  ja: "@a@bレオン「これからは　町のみなさんと共に\n\t%a00260を　守っていくよ。\n@c2@"
"151":
  de: "@aSultan Eknu@bWäre %a00260 niemals gegründet worden, wären wir uns niemals zufällig begegnet.\n@c2@"
  en: "@aSultan Farog@bHad %a00260 never been established, the chance encounter that led to our meeting would never have occurred.\n@c2@"
  es: "@aRainierito III@bSi %a00260 no hubiera prosperado, el encuentro al azar que propició nuestra amistad nunca se habría producido.\n@c2@"
  fr: "@aSultan Carapo@bSi %a00260 n'avait pas été créée, notre rencontre aléatoire n'aurait jamais eu lieu.\n@c2@"
  it: "@aRan Sultan@bSe %a00260 non fosse stata fondata, l'incontro a sorpresa che ha fatto incrociare le nostre vite non sarebbe mai avvenuto.\n@c2@"
  ja: "@a@bレオン「ここに　%a00260が\n\tできなければ　すれちがいも\n\tしなかっただろう　ボクたちが……\n@c2@"
"152":
  de: "@aSultan Eknu@bAlles hätte ganz anders ausgehen können. Ich danke Euch von ganzem Herzen für alles, was Ihr getan habt.\n@c2@"
  en: "@aSultan Farog@bFate is truly a fickle mistress. I thank you from the bottom of my heart for all you have done.\n@c2@"
  es: "@aRainierito III@bEl destino es verdaderamente caprichoso. Os agradezco desde lo más profundo de mi corazón todo lo que habéis hecho.\n@c2@"
  fr: "@aSultan Carapo@bLe destin est vraiment une maîtresse inconstante.\nJe vous remercie du fond du cœur pour tout ce que vous avez fait.\n@c2@"
  it: "@aRan Sultan@bIl destino è un compagno di viaggio misterioso e affascinante, e indirizza le nostre vite in modo imperscrutabile. %H860%XTi ringrazio per ciò che hai%YVi ringrazio per ciò che avete%Z fatto per me.\n@c2@"
  ja: "@a@bレオン「こうして　出会ったなんて\n\t運命って　ふしぎな　ものだね。\n\t本当に　ありがとう。\n@c2@"
"153":
  de: "@aSultan Eknu@bIch wünschte nur, ich könnte Euch ein angemessenes Zeichen meiner Dankbarkeit überreichen, doch dies ist alles, was ich habe.\n@c2@"
  en: "@aSultan Farog@bI only wish I could bestow upon you a fitting token of my gratitude, but I am afraid this is all I have.\n@c2@"
  es: "@aRainierito III@bDesearía poder corresponderos como os merecéis pero me temo que lo único que tengo es esto.\n@c2@"
  fr: "@aSultan Carapo@bJ'aimerais pouvoir vous offrir un présent à la mesure de ma gratitude, mais je crains de n'avoir que ceci.\n@c2@"
  it: "@aRan Sultan@bVorrei %H860%Xricompensarti%Yricompensarvi%Z con un dono meraviglioso per %H860%Xdimostrarti%Ydimostrarvi%Z tutta la mia gratitudine, ma con me non ho che questo modesto oggetto.\n@c2@"
  ja: "@a@bレオン「そうそう　何かお礼をしたいけど……\n\tいまのボクには　こんなものしかなくて\n\t申しわけない。\n@c2@"
"154":
  de: "@aSultan Eknu@bIch fand es im Teich, als ich noch eine Unke war. Es ist nur eine Kleinigkeit, aber ich bitte Euch, sie von mir anzunehmen.\n@c2@"
  en: "@aSultan Farog@bI chanced upon it in the pond when I was in my froggy form. It is a mere trifle, but please\naccept it.\n@c2@"
  es: "@aRainierito III@bLo encontré de casualidad en el estanque cuando era un ranito. Es una fruslería pero os ruego que la aceptéis.\n@c2@"
  fr: "@aSultan Carapo@bJe l'ai trouvé par hasard dans la mare où je vivais sous ma forme de crapaud. C'est bien peu de choses, mais je vous en prie, acceptez ce présent.\n@c2@"
  it: "@aRan Sultan@bL'ho trovato nello stagno, quando ancora avevo forma di batrace. So che non è molto, ma %H860%Xti%Yvi%Z prego di accettarlo comunque.\n@c2@"
  ja: "@a@bレオン「カエルになっていたとき　池の中で\n\t見つけたんだ。　さあ　受けとってくれ！\n@c2@"
"155":
  de: "@a@bSultan Eknu holt eine glänzende Medaille aus der Tasche. Bei näherem Hinsehen stellt sie sich als Minimedaille heraus!\n@c2@"
  en: "@a@bSultan Farog takes a brightly shining medal from\nhis pocket. On closer inspection, it turns out to be\na mini medal!\n@c2@"
  es: "@a@bRainierito III extrae una radiante medalla de su bolsillo. Al mirarla más de cerca, ¡resulta ser una minimedalla!\n@c2@"
  fr: "@a@bLe sultan Carapo sort de sa poche une médaille très brillante. En y regardant de plus près, il s'agit d'une mini médailleⓠ\n@c2@"
  it: "@a@bRan Sultan tira fuori dalla tasca un piccolo oggetto lucente... È una Minimedaglia!\n@c2@"
  ja: "@a@bレオンは　ポケットから\nキラリと光るメダルを　差し出した。\nなんと　ちいさなメダルだった！\n@c2@"
"156":
  de: "@a@b%0%a00120 erhält eine Minimedaille.\n@c2@"
  en: "@a@b%0%a00120 receives a mini medal.\n@c2@"
  es: "@a@b%0%a00120 recibe una minimedalla.\n@c2@"
  fr: "@a@b%0%a00120 reçoit une mini médaille.\n@c2@"
  it: "@a@b%0%a00120 riceve una Minimedaglia!\n@c2@"
  ja: "@a@bレオン「%a00140さんたちの\n\t幸運を　祈っているよ。\n@c2@"
"157":
  de: "@aHank Hoffman Jr.@bNa, wen haben wir denn da! %a00140! Schönen Tag auch, Partner%H860%X!%Y und Anhang!%Z\n@c2@"
  en: "@aHank Hoffman Jr.@bWell, if it ain't ol' %a00140%H860%X! Howdy, pardner!%Y\nand comp'ny! Howdy, y'all!%Z\n@c2@"
  es: "@aJuanchito@b¡Ándale, si es %a00140%H860%X%Y\ny con todos sus cuates%Z!\n@c2@"
  fr: "@aHank Hoffman Jr@bTiens, mais on dirait %a00140%H860%Xⓠ Salut part'naireⓠ%Y\net son équipeⓠ Salut tout l'mondeⓠ%Z\n@c2@"
  it: "@aJohn Dwayne Jr.@bGuarda chi si vede! %0%a00140%H860%X%Y\ne compagnia%Z!\n@c2@"
  ja: "@a@bホフマン「あ！　%a00140さん。\n\tみなさんも　こちらへ\n\tいらしてたんですね。\n@c2@"
"158":
  de: "@aHank Hoffman Jr.@bBin sofort hergesaust, sobald ich sah, was mit meiner guten alten Stadt passierte.\n@c2@"
  en: "@aHank Hoffman Jr.@bI came a-runnin' on up here soon as I seen what was happenin' to my dear ol' town.\n@c2@"
  es: "@aJuanchito@bPues nomás que escuché lo que pasaba en mi querida ciudad, me apresure a venir aquí.\n@c2@"
  fr: "@aHank Hoffman Jr@bJ'suis venu ici en courant dès que j'ai vu c'qui arrivait à ma chère ville.\n@c2@"
  it: "@aJohn Dwayne Jr.@bMi sono precipitato qui a spron battuto non appena ho saputo cos'era successo alla mia città.\n@c2@"
  ja: "@a@bホフマン「私も　町の変化に　気付いて\n\tあわてて　やって来たのですよ。\n@c2@"
"159":
  de: "@aHank Hoffman Jr.@bIch wollte, dass daraus die mächtigste Stadt wird, die die Welt je gesehen hat. Und stattdessen hat sie sich in 'ne richtig große Burg verwandelt!\n@c2@"
  en: "@aHank Hoffman Jr.@bI wanted it to grow into the mightiest city the world ever saw. Instead, it done gone and turned into a big ol' castle!\n@c2@"
  es: "@aJuanchito@bMi deseo era convertirla en la ciudad más poderosa del mundo. ¡Y resulta que desaparece y se convierte en un castillo, híjole!\n@c2@"
  fr: "@aHank Hoffman Jr@bJ'voulais qu'elle devienne la ville la plus puissante que l'monde ait jamais vue. À la place, elle s'est envolée et transformée en un grand châteauⓠ\n@c2@"
  it: "@aJohn Dwayne Jr.@bSognavo di farla diventare la più bella metropoli che il mondo avesse mai visto, e invece ecco che mi ritrovo davanti a un castello!\n@c2@"
  ja: "@a@bホフマン「しかし　大きな町にしたいとは\n\t思っていましたが　こんなりっぱな\n\tお城になるとは！\n@c2@"
"160":
  de: "@aHank Hoffman Jr.@b... Tja, da kann man wohl nichts mehr machen, was? (Seufz)\n@c2@"
  en: "@aHank Hoffman Jr.@b...Well, ain't much I can do about that now, huh? (sigh)\n@c2@"
  es: "@aJuanchito@b... Pues ya no hay nada que pueda hacer, ¿verdad? (suspiro)\n@c2@"
  fr: "@aHank Hoffman Jr@b... Enfin, j'peux plus y faire grand-chose, maintenant, heinⓡ (soupir)\n@c2@"
  it: "@aJohn Dwayne Jr.@bNon voglio certo lamentarmi, eh! Va bene anche così!\n@c2@"
  ja: "@a@bホフマン「いやはや　まいりましたね。\n\tはっはっは……。\n@c2@"
"161":
  de: "@aHank Hoffman Jr.@bNa schön. Ich mach mich mal wieder auf den Heimweg.\n@c2@"
  en: "@aHank Hoffman Jr.@bAlright then, I'm off back to my little ol' shack.\n@c2@"
  es: "@aJuanchito@bBueno, me regresaré a mi vieja chocita.\n@c2@"
  fr: "@aHank Hoffman Jr@bTant pis. J'vais retourner dans ma petite cabane, dans ce cas.\n@c2@"
  it: "@aJohn Dwayne Jr.@bAnzi, forse così è persino più bella di quanto io abbia mai sognato! Beh, me ne torno a casa.\n@c2@"
  ja: "@a@bホフマン「さて　私は　自分の小屋へ\n\t戻るとします。\n@c2@"
"162":
  de: "@aHank Hoffman Jr.@bUnd Ihr schaut mal vorbei, ja? Macht Euch nicht immer so rar. Also dann, alles Gute, Partner!\n@c2@"
  en: "@aHank Hoffman Jr.@bY'all be sure an' come on by an' see me once in a while, y'hear? Don't be %H860%Xa stranger%Ystrangers%Z now. So long, %H860%Xpardner%Ypardners%Z!\n@c2@"
  es: "@aJuanchito@bÁndele, no %H860%Xolvide%Yolviden%Z pasar a verme de vez en cuando. Ya no %H860%Xes un %A120%Xextraño%Z%B120%Xextraña%Z%Y%R000%Xson unas extrañas%Yson unos extraños%Z%Z. ¡Hasta pronto, %H860%X%A120%Xcompadre%Z%B120%Xcomadre%Z%Y%R000%Xcomadres%Ycompadres%Z%Z!\n@c2@"
  fr: "@aHank Hoffman Jr@bPassez m'voir de temps en temps, d'accordⓡ\nNe faites pas comme si on s'connaissait plus.\nAdieu, %H860%Xpart'naire%Ypart'naires%Zⓠ\n@c2@"
  it: "@aJohn Dwayne Jr.@b%H860%XMi raccomando, non dimenticarti di me. Torna a trovarmi, quando passi%YMi raccomando, non dimenticatevi di me. Tornate a trovarmi, quando passate%Z da queste parti. A presto!\n@c2@"
  ja: "@a@bホフマン「みなさんも　ご用のときは\n\tいらしてくださいね。\n\tではっ！\n@c2@"
"163":
  de: "@a@b%0%a00120 öffnet die Schatztruhe.\n@c0@"
  en: "@a@b%0%a00120 opens the treasure chest.\n@c0@"
  es: "@a@b%0%a00120 abre el cofre del tesoro.\n@c0@"
  fr: "@a@b%0%a00120 ouvre le coffre au trésor.\n@c0@"
  it: "@a@b%0%a00120 apre il forziere.\n@c0@"
  ja: "@a@b%a00120は　宝箱を　調べた。\n@c0@"
"164":
  de: "@a@bEin helles Licht strahlt tief aus der Truhe hervor.\n@c0@"
  en: "@a@bA bright light shines forth from the depths of\nthe chest.\n@c0@"
  es: "@a@bUna intensa y brillante luz emana de las profundidades del cofre.\n@c0@"
  fr: "@a@bUne vive lueur jaillit du fond du coffre.\n@c0@"
  it: "@a@bIl forziere si illumina di una luce intensa!\n@c0@"
  ja: "@a@b宝箱の中から　キラキラした光が\n立ちのぼる……！\n@c0@"
"165":
  de: "@a@b%0%a00120 befreit Sultan Eknus Herz aus seinem Kerker!\n@c0@"
  en: "@a@b%0%a00120 releases Sultan Farog's heart from\nits prison!\n@c0@"
  es: "@a@b¡%0%a00120 libera el corazón de Rainierito III de su prisión!\n@c0@"
  fr: "@a@b%0%a00120 libère le cœur du sultan Carapo de sa prisonⓠ\n@c0@"
  it: "@a@b%0%a00120 ha liberato il cuore di Ran Sultan!\n@c0@"
  ja: "@a@b%a00120は　レオン王の心を\n封印から　解きはなった！\n@c0@"
"166":
  de: "@a@bEin helles Licht strahlt tief aus dem Gefäß hervor.\n@c0@"
  en: "@a@bA bright light shines forth from the depths of the pot.\n@c0@"
  es: "@a@bUna intensa y brillante luz emana de las profundidades de la tinaja.\n@c0@"
  fr: "@a@bUne vive lueur jaillit du fond de la jarre.\n@c0@"
  it: "@a@bIl recipiente si illumina di una luce intensa!\n@c0@"
  ja: "@a@bなんと　つぼから　キラキラした光が\n立ちのぼる……！\n@c0@"
"167":
  de: "@a@b%0%a00120 befreit Sultan Eknus Körper aus seinem Kerker!\n@c0@"
  en: "@a@b%0%a00120 releases Sultan Farog's body from its prison!\n@c0@"
  es: "@a@b¡%0%a00120 libera el cuerpo de Rainierito III de su prisión!\n@c0@"
  fr: "@a@b%0%a00120 libère le corps du sultan Carapo de sa prisonⓠ\n@c0@"
  it: "@a@b%0%a00120 ha liberato il corpo di Ran Sultan!\n@c0@"
  ja: "@a@b%a00120は　レオン王のカラダを\n封印から　解きはなった！\n@c0@"
"168":
  de: "@a@bSobald auch sein Körper befreit ist, kann der Sultan wieder zurückkehren.\n@c0@"
  en: "@a@bOnce his body is released also, the Sultan can\nfinally return.\n@c0@"
  es: "@a@bCuando se haya liberado también su cuerpo, el Sultán podrá regresar de nuevo.\n@c0@"
  fr: "@a@bUne fois que son corps aura lui aussi été libéré, le sultan pourra réapparaître.\n@c0@"
  it: "@a@bQuando anche il suo corpo sarà libero, Ran Sultan potrà finalmente tornare.\n@c0@"
  ja: "@a@bあとは　カラダを　解きはなてば\nレオン王が　復活するだろう。\n@c0@"
"169":
  de: "@a@bSobald auch sein Herz befreit ist, kann der Sultan wieder zurückkehren.\n@c0@"
  en: "@a@bOnce his heart is released also, the Sultan can\nfinally return.\n@c0@"
  es: "@a@bCuando se haya liberado también su corazón, el Sultán podrá regresar de nuevo.\n@c0@"
  fr: "@a@bUne fois que son cœur aura lui aussi été libéré, le sultan pourra réapparaître.\n@c0@"
  it: "@a@bQuando anche il suo cuore sarà libero, Ran Sultan potrà finalmente tornare.\n@c0@"
  ja: "@a@bあとは　心を　解きはなてば\nレオン王が　復活するだろう。\n@c0@"
