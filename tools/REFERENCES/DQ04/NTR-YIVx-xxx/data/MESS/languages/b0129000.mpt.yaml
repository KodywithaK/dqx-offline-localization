"0":
  de: "@aPsaro der Metzler@bGrrraaahhh!\n@c3@"
  en: "@aPsaro the Manslayer@bGrraaargh!\n@c3@"
  es: "@aPsaro el Carnicero@b¡Aaaaargh!\n@c3@"
  fr: "@aPsaro l'Exterminateur@bGrrraaarghⓠ\n@c3@"
  it: "@aPsaro il Massacratore@bGrraaargh!\n@c3@"
  ja: "@a@bデスピサロ「ぐはあぁぁぁっ……！\n@c3@"
"1":
  de: "@aPsaro der Metzler@bIhr wagt es, mich zu stören?! Ich bin Psaro der Metzler. Gerade wurde ich als Meister der Monster wieder erweckt.\n@c3@"
  en: "@aPsaro the Manslayer@bHow dare you people disturb me!? I am Psaro the Manslayer. I have just reawakened as the Master of Monsterkind.\n@c3@"
  es: "@aPsaro el Carnicero@b¡¿Cómo osáis molestarme?! Soy Psaro el Carnicero. He vuelto a despertar como Señor de los Monstruos.\n@c3@"
  fr: "@aPsaro l'Exterminateur@bComment osez-vous me dérangerⓠⓑ\nJe suis Psaro l'Exterminateur. Je viens tout juste de me réveiller et je suis le Maître des monstres.\n@c3@"
  it: "@aPsaro il Massacratore@bCome osate disturbarmi?! Io sono Psaro il Massacratore! Sono il Signore della Mostruosità, appena risvegliato da un lunghissimo sonno!\n@c3@"
  ja: "@a@bデスピサロ「何者だ　お前たちは……？\n\tわたしの名は　デスピサロ。\n\t魔族の王として　目覚めたばかりだ。\n@c3@"
"2":
  de: "@aPsaro der Metzler@bGrrraaahhh! Ich weiß nichts von meiner Vergangenheit. Ich kann mich an nichts erinnern.\n@c3@"
  en: "@aPsaro the Manslayer@bGrraaargh! I know nothing of my past.\nI remember nothing.\n@c3@"
  es: "@aPsaro el Carnicero@b¡Aaaaargh! No sé nada de mi pasado.\nNo recuerdo nada.\n@c3@"
  fr: "@aPsaro l'Exterminateur@bGrrraaarghⓠ Je ne sais rien de mon passé.\nJe ne me souviens plus de rien.\n@c3@"
  it: "@aPsaro il Massacratore@bGrraaargh!\nNon ricordo niente del mio passato. Niente!\n@c3@"
  ja: "@a@bデスピサロ「うぐおぉぉぉ……！\n\tわたしには　何も　わからぬ……。\n\t何も　思い出せぬ……。\n@c3@"
"3":
  de: "@aPsaro der Metzler@bAber ich weiß sehr wohl, was ich zu tun habe.\n@c3@"
  en: "@aPsaro the Manslayer@bBut I know what it is I must do.\n@c3@"
  es: "@aPsaro el Carnicero@bPero sé lo que debo hacer.\n@c3@"
  fr: "@aPsaro l'Exterminateur@bMais je sais ce que je dois faire.\n@c3@"
  it: "@aPsaro il Massacratore@bMa so bene cosa devo fare...\n@c3@"
  ja: "@a@bデスピサロ「しかし　何をやるべきか\n\tそれだけは　わかっている……。\n@c3@"
"4":
  de: "@aPsaro der Metzler@bGrrraaahhh! Ich muss die gesamte Menschheit auslöschen!\n@c3@"
  en: "@aPsaro the Manslayer@bGrraaargh! I must eradicate all of humankind!\n@c3@"
  es: "@aPsaro el Carnicero@b¡Aaaaargh! ¡Debo erradicar a toda la raza humana!\n@c3@"
  fr: "@aPsaro l'Exterminateur@bGrrraaarghⓠ Je dois détruire l'humanitéⓠ\n@c3@"
  it: "@aPsaro il Massacratore@bGrraaargh!\nDevo distruggere l'umanità!\n@c3@"
  ja: "@a@bデスピサロ「ぐはあぁぁぁっ！\n\tお前たち　人間どもを\n\t根絶やしにしてくれるわっ！！\n@c3@"
"5":
  de: "@a@bPsaro verliert einen Arm!\n@c0@"
  en: "@a@bPsaro autotomises his arm!\n@c0@"
  es: "@a@b¡Psaro se autoamputa el brazo!\n@c0@"
  fr: "@a@bPsaro se sépare de son brasⓠ\n@c0@"
  it: "@a@bIl braccio di Psaro si stacca dal corpo!\n@c0@"
  ja: "@a@bデスピサロの　うでを　きりとばした！\n@c0@"
"6":
  de: "@a@bPsaro verliert seinen Kopf!\n@c0@"
  en: "@a@bPsaro autotomises his head!\n@c0@"
  es: "@a@b¡Psaro se autoamputa la cabeza!\n@c0@"
  fr: "@a@bPsaro se sépare de sa têteⓠ\n@c0@"
  it: "@a@bLa testa di Psaro scompare nel nulla!\n@c0@"
  ja: "@a@bデスピサロの　あたまは　しょうめつした！\n@c0@"
"7":
  de: "@a@bPsaros Bauch wölbt sich gefährlich!\n@c0@"
  en: "@a@bPsaro's abdomen writhes ominously!\n@c0@"
  es: "@a@b¡El abdomen de Psaro se retuerce de forma espantosa!\n@c0@"
  fr: "@a@bL'abdomen de Psaro se distordⓠ\n@c0@"
  it: "@a@bL'addome di Psaro si contorce orribilmente!\n@c0@"
  ja: "@a@bデスピサロの　はらが　あやしく　うごめいた！\n@c0@"
"8":
  de: "@aPsaro der Metzler@bGrrraaahhh!\n@c3@"
  en: "@aPsaro the Manslayer@bGrraaargh!\n@c3@"
  es: "@aPsaro el Carnicero@b¡Aaaaargh!\n@c3@"
  fr: "@aPsaro l'Exterminateur@bGrrraaarghⓠ\n@c3@"
  it: "@aPsaro il Massacratore@bGrraaargh!\n@c3@"
  ja: "@a@bデスピサロ「ぐはあああ……！\n@c3@"
"9":
  de: "@aPsaro der Metzler@bMein, mein Körper ist so heiß... Ich, ich bin besiegt.\nMeine körperliche Gestalt ist, ist zerstört.\n@c3@"
  en: "@aPsaro the Manslayer@bMy, my body is so hot... I, I am defeated.\nMy physical form is, is destroyed.\n@c3@"
  es: "@aPsaro el Carnicero@bMi... mi cuerpo... El calor... He sido derrotado.\nMi forma física ha sido destruida.\n@c3@"
  fr: "@aPsaro l'Exterminateur@bMon... Mon corps est si chaud...\nJe... Je suis vaincu.\nMa forme physique a été détruite.\n@c3@"
  it: "@aPsaro il Massacratore@bIl mio corpo brucia... S-Sono stato sconfitto...\nIl mio corpo... è stato distrutto...\n@c3@"
  ja: "@a@bデスピサロ「身体が　熱い……。\n\tわたしは　敗れたのか……。\n\tわたしの身体が　くずれてゆく……。\n@c3@"
"10":
  de: "@aPsaro der Metzler@bGaaaaahhhh!\n@c3@"
  en: "@aPsaro the Manslayer@bGuuurrrgh!\n@c3@"
  es: "@aPsaro el Carnicero@b¡Aaarrrgh!\n@c3@"
  fr: "@aPsaro l'Exterminateur@bUuurghⓠ\n@c3@"
  it: "@aPsaro il Massacratore@bGuaaarrrgh!\n@c3@"
  ja: "@a@bデスピサロ「うぐおぉぉぉっ……！\n@c3@"
"11":
  de: "@aPsaro der Metzler@bGrrraaahhh!\n@c2@"
  en: "@aPsaro the Manslayer@bRraaargh!\n@c2@"
  es: "@aPsaro el Carnicero@b¡Rraaargh!\n@c2@"
  fr: "@aPsaro l'Exterminateur@bRrraaarghⓠ\n@c2@"
  it: "@aPsaro il Massacratore@bAaargh!\n@c2@"
  ja: "@a@bデスピサロ「……ぐふっ！\n@c2@"
"12":
  de: "@aZenithdrache@bIch... bin der Zenithdrache.\n@c3@"
  en: "@aZenith Dragon@bI...am the Zenith Dragon.\n@c3@"
  es: "@aDragón de Zenithia@bYo... soy el Dragón de Zenithia.\n@c3@"
  fr: "@aDragon du Zénith@bJe... Je suis le Dragon du Zénith.\n@c3@"
  it: "@aDrago di Zenithia@bIo... sono il Drago di Zenithia.\n@c3@"
  ja: "@a@bマスタードラゴン「……わたしは\n\tマスタードラゴン。\n@c3@"
"13":
  de: "@aZenithdrache@bAus diesen himmlischen Höhen beobachte ich alles, was sich in der Welt zuträgt. Auch die Menschen unterstehen meinem wachsamen Auge.\n@c3@"
  en: "@aZenith Dragon@bFrom my lofty dominion here, I observe all that takes place below. All that afflicts the human world occurs under my watchful eye.\n@c3@"
  es: "@aDragón de Zenithia@bDesde mis dominios observo todo aquello que acontece en el mundo inferior. Todo lo que afecta a los humanos sucede bajo mi vigilante mirada.\n@c3@"
  fr: "@aDragon du Zénith@bDu haut de mon vaste domaine, j'observe tout ce qui se passe sur la terre. Rien de ce qui affecte le monde des hommes ne m'échappe.\n@c3@"
  it: "@aDrago di Zenithia@bDa quassù osservo ogni cosa e vigilo su ciò che accade nel mondo di sotto. Nulla di ciò che avviene sulle terre degli umani sfugge al mio occhio infallibile!\n@c3@"
  ja: "@a@bマスタードラゴン「居ながらにして\n\tここより　この世界のすべてを\n\t知ることのできる者。\n@c3@"
"14":
  de: "@aZenithdrache@bHier steht %A090%Xder Eine, der%Z%B090%Xdie Eine, die%Z das Blut der Menschen und der Zenithianer eint: %A090%Xder große Held%Z%B090%Xdie große Heldin%Z, %a00090!\n@c3@"
  en: "@aZenith Dragon@bBehold the one who shares the blood of human and Zenithian alike: the great %A090%Xhero%Z%B090%Xheroine%Z, %a00090!\n@c3@"
  es: "@aDragón de Zenithia@bHe aquí quien comparte la sangre de los hombres y de Zenithia: ¡%A090%Xel gran héroe%Z%B090%Xla gran heroína%Z, %a00090!\n@c3@"
  fr: "@aDragon du Zénith@bFaites place %A090%Xau héros%Z%B090%Xà l'héroïne%Z qui porte en %A090%Xlui%Z%B090%Xelle%Z le sang mêlé des humains et des Zénithiens.\n%A090%XLe grand%Z%B090%XLa grande%Z %0%a00090ⓠ\n@c3@"
  it: "@aDrago di Zenithia@bEcco %A090%Xcolui%Z%B090%Xcolei%Z che ha nelle sue vene sangue umano e Zenithiano: %A090%Xil grande eroe%Z%B090%Xla grande eroina%Z, %a00090!\n@c3@"
  ja: "@a@bマスタードラゴン「天空人と人間の\n\t血を引きし　勇者　%a00090よ！\n@c3@"
"15":
  de: "@aZenithdrache@bIch wurde Zeuge, wie Ihr sowohl Psaro den Metzler als auch das Geheimnis der Evolution niedergerungen habt.\n@c3@"
  en: "@aZenith Dragon@bI witnessed how your efforts drove both Psaro the Manslayer and the Secret of Evolution deep into oblivion.\n@c3@"
  es: "@aDragón de Zenithia@bHe sido testigo de cómo %H860%Xtus%Yvuestros%Z esfuerzos han enviado a Psaro el Carnicero y al Secreto de la Evolución al más profundo de los olvidos.\n@c3@"
  fr: "@aDragon du Zénith@bJ'ai vu comment, grâce à vos efforts, Psaro l'Exterminateur et le Secret de l'Évolution ont été plongés dans l'oubli.\n@c3@"
  it: "@aDrago di Zenithia@bSono stato testimone degli sforzi che %H860%Xhai%Yavete%Z compiuto per eliminare la minaccia costituita da Psaro il Massacratore e dal Segreto dell'Evoluzione.\n@c3@"
  ja: "@a@bマスタードラゴン「そなたらの　働きで\n\t進化の秘法は　デスピサロともども\n\t地の底ふかくに　沈んでいった。\n@c3@"
"16":
  de: "@aZenithdrache@bDie Menschheit braucht nun nichts mehr zu fürchten. Es herrscht wieder Frieden in Eurer Welt.\n@c3@"
  en: "@aZenith Dragon@bNo fear may now afflict you or your kind.\nPeace reigns once more over your domain.\n@c3@"
  es: "@aDragón de Zenithia@bNi %H860%Xtú%Y%R000%Xvosotras%Yvosotros%Z%Z ni %H860%Xtu%Yvuestra%Z raza debéis ya temer nada.\nLa paz reina de nuevo en vuestros dominios.\n@c3@"
  fr: "@aDragon du Zénith@bAucune peur ne pourra plus vous atteindre, vous et les vôtres. Une fois de plus, la paix est revenue dans votre monde.\n@c3@"
  it: "@aDrago di Zenithia@bD'ora in avanti la paura non attanaglierà più i cuori delle creature della %H860%Xtua razza%Yvostra razza%Z. La pace è finalmente tornata a regnare sovrana nel vostro mondo.\n@c3@"
  ja: "@a@bマスタードラゴン「もはや　人々が\n\tおびえることは　なく\n\t世界に平和が　おとずれたのだ！\n@c3@"
"17":
  de: "@aZenithdrache@bIhr Acht ⓚⓛ die Erkorenen ⓚⓛ habt somit Eure Aufgabe erfüllt und das Ende dieser Geschichte erreicht. \n㈡\nIch verbeuge mich vor Eurem Mut und Eurer Entschlossenheit!\n@c3@"
  en: "@aZenith Dragon@bYou eight ⓚⓛ the Chosen ⓚⓛ have thus completed your quest, and reached the end of your chapters.\n㈡\nI applaud your courage and determination.\n@c3@"
  es: "@aDragón de Zenithia@bVosotros ocho, los Elegidos, habéis completado vuestra misión y alcanzado el final de vuestras historias.\n㈡\nAplaudo vuestro coraje y determinación.\n@c3@"
  fr: "@aDragon du Zénith@bVous huit, les Élus, vous avez mené à bien votre quête et clos le dernier chapitre de votre histoire.\n㈡\nJe rends hommage à votre courage et à votre détermination.\n@c3@"
  it: "@aDrago di Zenithia@bVoi, gli otto Prescelti, avete completato questa affannosa ricerca, e siete riusciti a raggiungere il capitolo finale della vostra avventura.\n㈡\nSia lode al vostro coraggio e alla vostra determinazione!\n@c3@"
  ja: "@a@bマスタードラゴン「８人の\n\t導かれし者たちよ！\n\t心から　礼を言うぞ！\n@c3@"
"18":
  de: "@aZenithdrache@bRagnar Rauhbein! Bravo! Ihr habt tapfer und ehrenvoll gekämpft.\n@c3@"
  en: "@aZenith Dragon@bRagnar McRyan!\nWell done. You have fought bravely and resolutely.\n@c3@"
  es: "@aDragón de Zenithia@b¡Ragnar McRyan!\nBuen trabajo. Has luchado con valor y resolución.\n@c3@"
  fr: "@aDragon du Zénith@bRagnar McRyanⓠ\nFélicitations. Vous avez combattu avec bravoure et détermination.\n@c3@"
  it: "@aDrago di Zenithia@bI miei complimenti, Galiardo de' Guglielmi!\nHai condotto la battaglia con audacia e risolutezza.\n@c3@"
  ja: "@a@bマスタードラゴン「ライアン！\n\tお前は　本当に良くやってくれたな。\n@c3@"
"19":
  de: "@aZenithdrache@bAlena! Für eine Prinzessin habt Ihr große Stärke und wahren Mut bewiesen.\n@c3@"
  en: "@aZenith Dragon@bAlena!\nThough you were raised a princess, you have shown great strength and courage.\n@c3@"
  es: "@aDragón de Zenithia@b¡Alena!\nA pesar de haber sido criada como una princesa, has demostrado gran fortaleza y coraje.\n@c3@"
  fr: "@aDragon du Zénith@bAlinaⓠ\n㈡\nVotre éducation de princesse ne vous a pas empêchée de faire preuve d'un grand courage et d'une grande résistance.\n@c3@"
  it: "@aDrago di Zenithia@bAlena... È raro che una principessa possegga la forza e il coraggio che tu hai dimostrato di avere!\n@c3@"
  ja: "@a@bマスタードラゴン「アリーナよ。\n\tそなたも　女でありながら\n\tよく　がんばってくれた。\n@c3@"
"20":
  de: "@aZenithdrache@bBorja und Kyrill! Die Unterstützung, die Ihr Alena habt zuteil werden lassen, ist wahrlich beispiellos.\n@c3@"
  en: "@aZenith Dragon@bBorya and Kiryl!\nThe support you have provided to Alena has been exemplary.\n@c3@"
  es: "@aDragón de Zenithia@b¡Borya y Kiryl!\nEl apoyo que habéis proporcionado a Alena ha sido ejemplar.\n@c3@"
  fr: "@aDragon du Zénith@bBorya et Kirylⓠ\nVous avez apporté à Alina un soutien exemplaire.\n@c3@"
  it: "@aDrago di Zenithia@bBoris e Kiryl... L'aiuto che avete fornito ad Alena si è rivelato prezioso!\n@c3@"
  ja: "@a@bマスタードラゴン「ブライにクリフトも\n\tアリーナを助けし　そのはたらき\n\tまことに見事なり。\n@c3@"
"21":
  de: "@aZenithdrache@bMina und Maya! Seid versichert, dass Euer Vater sehr stolz auf Euch ist und seine Seele nun in Frieden ruhen kann.\n@c3@"
  en: "@aZenith Dragon@bMeena and Maya!\nBe assured that your miraculous feats will have set your father's soul at rest.\n@c3@"
  es: "@aDragón de Zenithia@b¡Meena y Maya! No os quepa duda de que, con vuestras proezas milagrosas, el alma de vuestro padre alcanzará el descanso eterno.\n@c3@"
  fr: "@aDragon du Zénith@bMina et Mayaⓠ\nSoyez assurées que vos exploits seront d'un grand réconfort pour l'âme de votre père.\n@c3@"
  it: "@aDrago di Zenithia@bMyra e Maya... Sono certo che le gesta incredibili che avete compiuto faranno finalmente trovare all'anima di vostro padre la pace che essa merita.\n@c3@"
  ja: "@a@bマスタードラゴン「マーニャにミネアよ。\n\t今の　そなたたちを見れば\n\t父上もきっと　うかばれるであろう！\n@c3@"
"22":
  de: "@aZenithdrache@bTorneko Talun! Die Leute werden auch weiterhin auf Euer außerordentliches Handelsgeschick vertrauen.\n@c3@"
  en: "@aZenith Dragon@bTorneko Taloon!\nPeople will continue to rely on your extraordinary gift for commerce.\n@c3@"
  es: "@aDragón de Zenithia@b¡Torneko Taloon!\nLas personas seguirán confiando en tu don extraordinario para el comercio.\n@c3@"
  fr: "@aDragon du Zénith@bTorneko Taloonⓠ\nLa population continuera à faire confiance à votre don extraordinaire pour le commerce.\n@c3@"
  it: "@aDrago di Zenithia@bBaldo Baldini... La gente continuerà a fidarsi delle tue straordinarie capacità di commerciante!\n@c3@"
  ja: "@a@bマスタードラゴン「トルネコよ。\n\tこれからも　世のため　人のため\n\t商売に　せいを出すのだぞ。\n@c3@"
"23":
  de: "@aZenithdrache@bUnd zu guter Letzt...\n%0%a00090!\n@c3@"
  en: "@aZenith Dragon@bAnd last, but by no means least...\n%0%a00090!\n@c3@"
  es: "@aDragón de Zenithia@bY por último, pero no por ello menos importante...\n¡%0%a00090!\n@c3@"
  fr: "@aDragon du Zénith@bEt enfin...\n%0%a00090ⓠ\n@c3@"
  it: "@aDrago di Zenithia@bE in ultimo, ma di certo non per importanza, ci sei tu... %0%a00090!\n@c3@"
  ja: "@a@bマスタードラゴン「そして　%a00090よ！\n@c3@"
"24":
  de: "@aZenithdrache@bWorte reichen nicht aus, um Eure Größe und einzigartigen Heldentaten zu beschreiben.\n㈡\nSolch %A090%Xeinem Helden%Z%B090%Xeiner Heldin%Z, wie Ihr es seid, steht ein Platz in Zenithia zu.\n@c3@"
  en: "@aZenith Dragon@bWords cannot describe the greatness of your comportance. Such an exalted %A090%Xhero%Z%B090%Xheroine%Z belongs here with us.\n@c3@"
  es: "@aDragón de Zenithia@bNo es posible describir con palabras la magnificencia de tu conducta. %A090%XUn héroe%Z%B090%XUna heroína%Z de tamaña categoría merece estar aquí con nosotros.\n@c3@"
  fr: "@aDragon du Zénith@bLes mots me manquent pour décrire votre grandeur d'âme et votre courage. %A090%XUn héros tel%Z%B090%XUne héroïne telle%Z que vous a assurément sa place parmi nous.\n@c3@"
  it: "@aDrago di Zenithia@bNon ci sono parole per definire le tue prodezze. Siamo in presenza di %A090%Xun eroe%Z%B090%Xun'eroina%Z dalle qualità realmente eccezionali. Il tuo posto è qui, insieme a noi.\n@c3@"
  ja: "@a@bマスタードラゴン「おまえは　見事\n\tやりとげたのだ！　もはや\n\t地上に　戻ることもあるまい……。\n@c3@"
"25":
  de: "@aZenithdrache@bDaher lade ich Euch herzlichst ein, von nun an hier in Zenithia zu leben!\n@c3@"
  en: "@aZenith Dragon@bHenceforth, you will live here in Zenithia among the Zenithians!\n@c3@"
  es: "@aDragón de Zenithia@b¡A partir de ahora vivirás aquí, en Zenithia!\n@c3@"
  fr: "@aDragon du Zénith@bC'est pour cela que vous vivrez ici, à Zénithia, parmi les Zénithiensⓠ\n@c3@"
  it: "@aDrago di Zenithia@bD'ora innanzi ti sarà concesso di vivere qui a Zenithia, tra gli Zenithiani!\n@c3@"
  ja: "@a@bマスタードラゴン「これからは\n\t私とともに　この天空城に\n\t天空人として住むがよかろう！\n@c3@"
"26":
  de: "@aZenithdrache@bHm? Eure Begeisterung hält sich aber in Grenzen...\n@c3@"
  en: "@aZenith Dragon@bHm?\nDo I detect an air of disappointment?\n@c3@"
  es: "@aDragón de Zenithia@b¿Mmm?\n¿Es una cierta decepción lo que noto?\n@c3@"
  fr: "@aDragon du Zénith@bMmmⓡ\nSerait-ce une pointe de déception que je vois làⓡ\n@c3@"
  it: "@aDrago di Zenithia@bEh? Leggo forse un'espressione di disappunto sul tuo volto?\n@c3@"
  ja: "@a@bマスタードラゴン「ん？\n\tどうした　その顔は……？\n@c3@"
"27":
  de: "@aZenithdrache@bIhr wünscht, in die Welt der Menschen zurückzukehren und bei Euren Freunden zu leben? Ich verstehe...\n@c3@"
  en: "@aZenith Dragon@bYou desire to return to the world below and live among your friends?\nI see...\n@c3@"
  es: "@aDragón de Zenithia@b¿Dices que deseas regresar al mundo inferior y vivir %A120%Xrodeado%Z%B120%Xrodeada%Z de tus amigos?\nComprendo...\n@c3@"
  fr: "@aDragon du Zénith@bVous voulez retourner sur terre et vivre avec vos amisⓡ Je vois...\n@c3@"
  it: "@aDrago di Zenithia@bDesideri tornare nel mondo di sotto e vivere insieme ai tuoi amici? Capisco...\n@c3@"
  ja: "@a@bマスタードラゴン「その者たちと\n\tともに地上に戻ると　申すか？\n\t……………。\n@c3@"
"28":
  de: "@aZenithdrache@bAlso gut! Wenn Ihr dies wünscht, so sei es denn!\n@c3@"
  en: "@aZenith Dragon@bVery well! If you wish it thus, then so shall it be.\n@c3@"
  es: "@aDragón de Zenithia@b¡Muy bien! Si ese es tu deseo, entonces, que así sea.\n@c3@"
