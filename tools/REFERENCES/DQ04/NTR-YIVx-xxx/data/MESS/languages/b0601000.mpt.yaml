"0":
  de: "@aHank Hoffman Jr.@bTagchen! Ich hab schon auf Euch gewartet!\n@c2@"
  en: "@aHank Hoffman Jr.@bHowdy there! I been waitin' for y'all to come on by!\n@c2@"
  es: "@aJuanchito@b¡Holita! ¡Pues ya %H860%Xle%Yles%Z estaba esperando nomás!\n@c2@"
  fr: "@aHank Hoffman Jr@bSalutⓠ J'attendais que vous passiez nous rendre visiteⓠ\n@c2@"
  it: "@aJohn Dwayne Jr.@bEhilà! Salve! Qual buon vento?\n@c2@"
  ja: "@a@bホフマン「やあ　みなさん！\n\tお待ちしていましたよ。\n@c2@"
"1":
  de: "@aHank Hoffman Jr.@bHab gerade ein Schwätzchen mit der Nonne gehalten, die Ihr mir geschickt habt, %a00090.\n@c2@"
  en: "@aHank Hoffman Jr.@bI jes' been shootin' the breeze with that there sister you done sent on down here, %a00090.\n@c2@"
  es: "@aJuanchito@bEstaba aquí platicando con esta hermana que envió hace un rato, %a00090.\n@c2@"
  fr: "@aHank Hoffman Jr@bJ'viens juste de taper la causette avec la religieuse que vous nous avez envoyée, %a00090.\n@c2@"
  it: "@aJohn Dwayne Jr.@bStavo scambiando quattro chiacchiere con la suora che %H860%Xhai mandato qui, %a00090%Yavete mandato qui%Z.\n@c2@"
  ja: "@a@bホフマン「ちょうど今　%a00090さんたちの\n\t紹介で　この町に来た　あの方と\n\tウワサをしていたところです。\n@c2@"
"2":
  de: "@aHank Hoffman Jr.@bUnd 'n paar Leute hab ich auch selbst schon eingeladen. Allmählich kommt hier richtig Leben in die Bude!\n@c2@"
  en: "@aHank Hoffman Jr.@bAn' there's a few folks in town I done invited myself, too. Looks like this place is finally startin' to git a-hustlin' an' a-bustlin'.\n@c2@"
  es: "@aJuanchito@bYo también he invitado a otros de la ciudad, ¿sabe? Parece que ya este lugar comienza a prosperar y a verse animado.\n@c2@"
  fr: "@aHank Hoffman Jr@bEt il y a aussi quelques personnes en ville que j'ai invitées moi-même. On dirait qu'il commence enfin à y avoir de l'animation dans cet endroit.\n@c2@"
  it: "@aJohn Dwayne Jr.@bAnch'io mi sono dato da fare, e ho invitato un po' di gente. Questo posto sta iniziando ad animarsi, eh?\n@c2@"
  ja: "@a@bホフマン「他にも　私が　声をかけた人が\n\t来たりして　ついに　町づくりが\n\tはじまりましたよ。\n@c2@"
"3":
  de: "@aHank Hoffman Jr.@bAber noch gibt's hier nicht viel mehr als 'nen Schuppen und 'n Klohäuschen.\n@c2@"
  en: "@aHank Hoffman Jr.@bBut it still ain't nothin' much more 'n a cowshed an' an outhouse right about now.\n@c2@"
  es: "@aJuanchito@bPero por ahora no hay mucho más que un establo y una letrina.\n@c2@"
  fr: "@aHank Hoffman Jr@bMais toujours pas grand-chose d'plus qu'une étable et un cabanon, pour l'instant.\n@c2@"
  it: "@aJohn Dwayne Jr.@bPerò non è che qui ci sia un granché...\n@c2@"
  ja: "@a@bホフマン「とはいえ　今は　ただの\n\tちいさな集落にすぎません。\n@c2@"
"4":
  de: "@aHank Hoffman Jr.@bIhr müsst mir helfen, mehr Leute hierher zu lotsen, %a00120.\n@c2@"
  en: "@aHank Hoffman Jr.@bYou jes' gotta help me keep on bringin' the folks\na-flockin' into town, now, %a00120.\n@c2@"
  es: "@aJuanchito@bTiene que ayudarme a atraer a más gente aquí a la ciudad nomás, %a00120.\n@c2@"
  fr: "@aHank Hoffman Jr@bIl va falloir m'aider à faire venir les gens en nombre, maintenant, %a00120.\n@c2@"
  it: "@aJohn Dwayne Jr.@bSe vogliamo trasformare questo buco in una vera città, %H860%Xdovrai darmi una mano, %a00120%Ydovrete darmi una mano%Z.\n@c2@"
  ja: "@a@bホフマン「どうか　%a00120さん\n\tこの地が　栄えるよう\n\tおチカラを　かして下さい！\n@c2@"
"5":
  de: "@aHank Hoffman Jr.@bUnd ich weiß auch schon, wie man sie am besten hierherlockt.\n@c2@"
  en: "@aHank Hoffman Jr.@bAn' I done thought o' the perfect way to git 'em down here, too.\n@c2@"
  es: "@aJuanchito@bY ya se me ha ocurrido la forma perfecta de atraerlos hasta aquí.\n@c2@"
  fr: "@aHank Hoffman Jr@bEt j'ai réfléchi au moyen idéal d'les amener ici.\n@c2@"
  it: "@aJohn Dwayne Jr.@bTra l'altro, ho escogitato un ottimo modo per far venire qui un mucchio di gente!\n@c2@"
  ja: "@a@bホフマン「じつは　この町を\n\t早く発展させる　よい方法を\n\t思いついたのですが……\n@c2@"
"6":
  de: "@aHank Hoffman Jr.@bAber ich kann nicht die ganze Zeit hier rumstehen und Euch einen vom Pferd erzählen. Schaut einfach mal in meiner Hütte vorbei, wenn Ihr Zeit habt.\n@c2@"
  en: "@aHank Hoffman Jr.@bBut I cain't very well stand 'round out here an' tell y'all about it. Drop on by my little house on the prairie when you got yourself a minute.\n@c2@"
  es: "@aJuanchito@bPero ahora no puedo perder el tiempo y contárselo todo. Puede pasarse por mi casa de la pradera cuanto tenga un momento.\n@c2@"
  fr: "@aHank Hoffman Jr@bMais j'peux pas vous en parler ici, comme ça. Passez m'voir quand vous aurez une minute. J'habite la p'tite maison dans la prairie.\n@c2@"
  it: "@aJohn Dwayne Jr.@bQuesto non è il luogo adatto per parlarne, però. %H860%XVieni%YVenite%Z a trovarmi nella mia casa nella prateria, quando %H860%Xhai un attimo, e ti%Yavete un attimo, e vi%Z spiegherò tutto.\n@c2@"
  ja: "@a@bホフマン「ここで　立ち話もなんですから\n\t後で　私の家に　来て下さい。\n@c2@"
"7":
  de: "@aHank Hoffman Jr.@bIch hab mir ganz in der Nähe ein Häuschen gebaut. Kommt mal vorbei, dann besprechen wir die Sache.\n@c2@"
  en: "@aHank Hoffman Jr.@bI done built me a little place jes' nearby. Y'all come on by there an we'll have us a talk all about it.\n@c2@"
  es: "@aJuanchito@bMe construí una casita bien cerca. Pásese por allí y se lo contaré todo.\n@c2@"
  fr: "@aHank Hoffman Jr@bJ'me suis construit une p'tite bicoque, pas loin. Passez m'voir là-bas et on en parlera.\n@c2@"
  it: "@aJohn Dwayne Jr.@bMi sono costruito un bel posticino non lontano da qui. %H860%XPassa da me, e ti%YPassate da me, e vi%Z dirò quale idea ha partorito la mia zucca.\n@c2@"
  ja: "@a@bホフマン「先ほど　すぐ近くに\n\t小さい家を　建てましたから\n\tそこで　お話ししましょう。\n@c2@"
"8":
  de: "@aHank Hoffman Jr.@bIch muss aber erst noch 'n bisschen aufräumen. Seht Euch doch so lange in der Stadt um.\n@c2@"
  en: "@aHank Hoffman Jr.@bI'll need me a little while to make ready for y'all, so jes' you have a mosey 'round town in the meantime.\n@c2@"
  es: "@aJuanchito@bNecesito un tiempo para preparar las cosas, %H860%Xándese%Yándense%Z a dar una vueltita por aquí mientras %H860%Xespera%Yesperan%Z.\n@c2@"
  fr: "@aHank Hoffman Jr@bMais y va m'falloir un p'tit moment pour tout préparer avant que vous veniez, alors allez donc faire un tour en ville en attendant.\n@c2@"
  it: "@aJohn Dwayne Jr.@bOra ho da fare, ma tra un po' sarò libero, e potremo fare quattro chiacchiere. Perché non %H860%Xfai%Yfate%Z un giro qui intorno, per ingannare l'attesa?\n@c2@"
  ja: "@a@bホフマン「少し　じゅんびが必要ですので\n\t%a00120さんは　この町を\n\tゆっくり見てから　いらして下さいね。\n@c2@"
"9":
  de: "@a@b*: He, Ihr da! Habt Ihr schon gehört?\n@c2@"
  en: "@a@b*: You there! Have you heard?\n@c2@"
  es: "@a@b*: ¡Eh, %H860%Xtú%Y%R000%Xvosotras%Yvosotros%Z%Z! ¿Lo %H860%Xhas%Yhabéis%Z oído?\n@c2@"
  fr: "@a@b*ⓢ Hé, vous, làⓠ Vous avez entenduⓡ\n@c2@"
  it: "@a@b*: Ehi, %H860%Xtu! Hai saputo%Yvoi! Avete saputo%Z?\n@c2@"
  ja: "@a@b＊「旅の人！　知ってますか？\n@c2@"
"10":
  de: "@a@b*: Aber ich hab Euch doch noch gar nichts erzählt!\nNa schön, wie Ihr wollt.\n@c2@"
  en: "@a@b*: But I haven't even told you anything yet.\nFine, whatever.\n@c2@"
  es: "@a@b*: Pero si todavía no %H860%Xte%Yos%Z he contado nada.\nBueno, da igual.\n@c2@"
  fr: "@a@b*ⓢ Mais, je ne vous ai encore rien dit.\nEnfin bref.\n@c2@"
  it: "@a@b*: Ma se non %H860%Xti ho ancora detto niente?! Bah! Fa' come ti%Yvi ho ancora detto niente?! Bah! Fate come vi%Z pare...\n@c2@"
  ja: "@a@b＊「……。\n\tまだ　何も　話していないのに。\n\tま　いいか。\n@c2@"
"11":
  de: "@a@b*: Das ist eine ganz neue Stadt, gegründet von einem Typen namens Hoffman. Der hat was auf dem Kasten!\n@c2@"
  en: "@a@b*: This is a new town, founded by a visionary fellow by the name of Hoffman.\n@c2@"
  es: "@a@b*: Esta es una nueva ciudad, creada por un genio visionario llamado Juanchito.\n@c2@"
  fr: "@a@b*ⓢ Cette nouvelle ville a été fondée par un visionnaire du nom d'Hoffman.\n@c2@"
  it: "@a@b*: Questa è una nuova città, fondata da un tipo di nome Dwayne.\n@c2@"
  ja: "@a@b＊「ここは　新しくできたばかりの町。\n\tホフマンさんっていう人の\n\t夢の土地だとか。\n@c2@"
"12":
  de: "@a@b*: Ich bin auch neu hier, hab aber schon einen kleinen Laden aufmachen dürfen.\n@c2@"
  en: "@a@b*: I'm new around here too, but they've let me set up a little shop.\n@c2@"
  es: "@a@b*: Yo también soy nuevo por aquí pero me han permitido abrir un pequeño negocio.\n@c2@"
  fr: "@a@b*ⓢ Moi aussi, j'suis nouveau, mais ils m'ont permis d'installer une petite boutique.\n@c2@"
  it: "@a@b*: Sono qui da poco, ma direi che è un bel posto... E mi hanno anche permesso di aprire un negozietto!\n@c2@"
  ja: "@a@b＊「わたしも　新参者ですが\n\tさっそく　商売させて\n\tもらってますよ。\n@c2@"
"13":
  de: "@aUnke@b(Gähn) Liebe Güte. Der schlaftrunkene Fuchs ergattert selten ein gefiedertes Frühstück, doch lockt nicht auch ein Schlummer den nächsten herbei?\n@c2@"
  en: "@aFrog@b(yawn) Goodness me. I know it is said that the sleepy fox seldom has feathered breakfasts, but is it not also true that one slumber invites another?\n@c2@"
  es: "@aRanito@b(bostezo) Por la Diosa. Dicen que oveja que bala bocado que pierde, ¿pero no es cierto también que boca que bosteza, estómago que hambrea?\n@c2@"
  fr: "@aCrapaud@b(bâillement) Bon sang, je sais que l'avenir appartient à ceux qui se lèvent tôt, mais le rire et le sommeil ne sont-ils pas les meilleurs remèdes du mondeⓡ\n@c2@"
  it: "@aRana@bOh, mi pare di essermi svegliato da un sonno lungo una vita. Come si dice? ⓕRana che dorme non piglia insettiⓖ...\n@c2@"
  ja: "@a@bカエル「ふぁ～あ……。\n\t春眠　あかつきを　おぼえず\n\tとは　よく言ったものだね。\n@c2@"
"14":
  de: "@aUnke@bMir ist, als sei ich nach tausendundeinem Jahr aus einem tiefen Schlummer erwacht...\n@c2@"
  en: "@aFrog@bI feel as if I have awoken from a slumber of one thousand and one years...\n@c2@"
  es: "@aRanito@bSiento como si hubiera despertado de un letargo de mil y un años...\n@c2@"
  fr: "@aCrapaud@bJ'ai l'impression de me réveiller d'un sommeil de mille et une nuits...\n@c2@"
  it: "@aRana@bEppure, nonostante il tanto dormire, avrei ancora voglia di schiacciare un pisolino...\n@c2@"
  ja: "@a@bカエル「まるで　一千年の冬眠から\n\tめざめたような……\n@c2@"
"15":
  de: "@aUnke@bOh, seid mir gegrüßt. Wer seid Ihr?\n@c2@"
  en: "@aFrog@bOh, good day. And who might you be?\n@c2@"
  es: "@aRanito@b¡Oh!, buenos días. ¿Quiénes %H860%Xeres%Ysois%Z?\n@c2@"
  fr: "@aCrapaud@bOh, bonjour. À qui ai-je l'honneurⓡ\n@c2@"
  it: "@aRana@bOh, salve! Con chi ho il piacere di parlare?\n@c2@"
  ja: "@a@bカエル「ん？\n\tキミは　だれだい？\n@c2@"
"16":
  de: "@aUnke@b%0%a00140%H860%X%Y und werte Gefährten%Z, ich fühle mich geehrt, Eure Bekanntschaft zu machen.\n@c2@"
  en: "@aFrog@b%0%a00140%H860%X%Y and esteemed companions%Z, I am most honoured to make your acquaintance.\n@c2@"
  es: "@aRanito@b%H860%X%0%a00140%Y%0%a00140 y compañía%Z, encantado de %H860%Xconocerte%Yconoceros%Z.\n@c2@"
  fr: "@aCrapaud@b%0%a00140%H860%X%Y et sa respectable escorte%Z, je suis très honoré de faire votre connaissance.\n@c2@"
  it: "@aRana@b%0%a00140%H860%X%Y e la sua onorata compagnia%Z? Sono assolutamente felice di fare la %H860%Xtua%Yvostra%Z conoscenza.\n@c2@"
  ja: "@a@bカエル「……そうか。\n  　%a00140さんと　その仲間だね。\n@c2@"
"17":
  de: "@aUnke@bIch bin... nur eine einfache Unke, die zufällig die Sprache der Menschen erlernt hat.\n@c2@"
  en: "@aFrog@bI am...but a simple frog, who has by chance learned the language of humankind.\n@c2@"
  es: "@aRanito@bSoy... una simple rana que, por designios del destino, ha aprendido el idioma de los humanos.\n@c2@"
  fr: "@aCrapaud@bJe ne suis... qu'un simple crapaud qui, par chance, a appris le langage des humains.\n@c2@"
  it: "@aRana@bIo sono... Ehm, ecco, io sono una semplice rana che ha appreso il linguaggio degli uomini...\n@c2@"
  ja: "@a@bカエル「ボクは　ええと……\n\tただの　カエル。　たまたま\n\t人間の言葉が　話せるだけのね。\n@c2@"
"18":
  de: "@aUnke@bWusstet Ihr, dass an genau dieser Stelle einst eine glanzvolle Burg gestanden hat?\n@c2@"
  en: "@aFrog@bWere you aware of the rumour that a magnificent castle once stood upon this very spot?\n@c2@"
  es: "@aRanito@b¿%H860%XHabías oído%YHabíais oído%Z el rumor de que hace tiempo, en este mismo lugar, se erigía un magnífico castillo?\n@c2@"
  fr: "@aCrapaud@bÊtes-vous au courant de la rumeur qui dit qu'un magnifique château se dressait autrefois à cet endroit précisⓡ\n@c2@"
  it: "@aRana@b%H860%XConosci%YConoscete%Z la storia del castello che un tempo si ergeva maestoso proprio in questo luogo?\n@c2@"
  ja: "@a@bカエル「この地に　りっぱなお城が\n\tあったという言い伝えは\n\tキミも　耳にしたことがあるだろう？\n@c2@"
"19":
  de: "@aUnke@bFrüher gab es hier einen geschäftigen Basar für die Söhne und Töchter der Wüste.\n@c2@"
  en: "@aFrog@bIndeed, in ancient times, this was a thriving bazaar, alive with nomadic peoples.\n@c2@"
  es: "@aRanito@bDe hecho, en tiempos inmemoriales, este lugar era un animado bazar, repleto de gentes nómadas.\n@c2@"
  fr: "@aCrapaud@bEn effet, dans les temps anciens, ce lieu était un bazar florissant, rempli de nomades.\n@c2@"
  it: "@aRana@bMolto tempo fa, in questo posto si svolgeva un ricco mercato, affollato da visitatori provenienti da ogni parte del mondo.\n@c2@"
  ja: "@a@bカエル「うん。　はるか昔\n\tここは　多くの旅人たちで\n\tにぎわう都だったんだ。\n@c2@"
"20":
  de: "@aUnke@bFürwahr, einst war hier ein Königreich, dessen Reichtum auf dem Handel mit fernen Ländern beruhte.\n@c2@"
  en: "@aFrog@bOh yes, this surely was once a kingdom whose fortune was built on trade with distant lands.\n@c2@"
  es: "@aRanito@bSí, este fue un reino cuya fortuna se construyó gracias al comercio con tierras lejanas.\n@c2@"
  fr: "@aCrapaud@bMais oui, ce lieu était autrefois un royaume dont la richesse était bâtie sur le commerce avec des contrées lointaines.\n@c2@"
  it: "@aRana@bEh, sì... Qui c'era un florido regno che aveva costruito le proprie fortune sul commercio con paesi vicini e lontani.\n@c2@"
  ja: "@a@bカエル「そう……。\n\t大昔　ここには　交易でさかえた\n\t王国が　あったはずだけど。\n@c2@"
"21":
  de: "@aUnke@bDoch jetzt ist es nichts mehr als die ausgedörrte Ödnis, die Ihr vor Euch seht.\n@c2@"
  en: "@aFrog@bBut now it is no more than the arid expanse you see before you.\n@c2@"
  es: "@aRanito@bPero ahora no es más que la llanura desierta que %H860%Xves%Yveis%Z ante %H860%Xti%Y%R000%Xvosotras%Yvosotros%Z%Z.\n@c2@"
  fr: "@aCrapaud@bMais aujourd'hui, ce n'est plus que l'étendue désertique que vous avez sous les yeux.\n@c2@"
  it: "@aRana@bOra, invece, non c'è altro che un'arida distesa...\n@c2@"
  ja: "@a@bカエル「今じゃ　この通り\n\tただの　荒地……。\n@c2@"
"22":
  de: "@aUnke@bDoch Ihr wollt diesem bescheidenen Weiler ja mit Eurem jugendlichem Schwung zu seinem früheren Glanz verhelfen, nicht wahr?\n@c2@"
  en: "@aFrog@bBut you youngsters are aiding in the efforts to restore this humble hamlet to its former magnificence, are you not?\n@c2@"
  es: "@aRanito@bAunque la juventud está prestando su ayuda para devolver a esta humilde aldea su antigua gloria, ¿no es cierto?\n@c2@"
  fr: "@aCrapaud@bMais vous participez aux efforts faits pour rendre à ce hameau sa magnificence passée, n'est-ce pas %H860%X%A120%Xjeune homme%Z%B120%Xjeune fille%Z%Y%R000%Xjeunes filles %Yjeunes gens%Z%Zⓡ\n@c2@"
  it: "@aRana@bPerò ho saputo che %H860%Xti stai prodigando%Yvi state prodigando%Z per riportare questa landa al suo antico splendore... È così, vero?\n@c2@"
  ja: "@a@bカエル「ところで　%a00140さんたちは\n\tこの町づくりに　協力しているとか。\n@c2@"
"23":
  de: "@aUnke@bJetzt verbringe ich meine Tage meist müßig an diesem Teich. Bitte kommt wieder und sprecht mit mir, wenn die Stadt weiter aufgebaut wird! Quaak!\n@c2@"
  en: "@aFrog@bI do little but while away my days in idleness here by this pond. Pray, come and speak to me again when the town is further restored. Rrrribbit!\n@c2@"
  es: "@aRanito@bYo hago poco más que pasar mis días en este estanque sin hacer nada.\n㈡\n%H860%XTe%YOs%Z ruego que cuando la ciudad se recupere del todo %H860%Xvuelvas%Yvolváis%Z a contármelo. ¡Croac!\n@c2@"
  fr: "@aCrapaud@bJe ne fais que couler des jours oisifs près de cette mare. Je vous en prie, revenez me parler lorsque la restauration de la ville aura avancé. Croâââⓠ\n@c2@"
  it: "@aRana@bIo sono sempre qui, presso questo specchio d'acqua. Sarò lieto se %H860%Xtornerai%Ytornerete%Z a parlare con me, una volta che la città si sarà ulteriormente ingrandita.\n@c2@"
  ja: "@a@bカエル「ボクはずっと　ここにいるから\n\t町が発展したら　また　話をしに\n\t来ておくれ。　ケロケロ……。\n@c2@"
"24":
  de: "@aUnke@bAber ich darf Euch nicht länger aufhalten. Mr. Hoffman erwartet Euch bereits in seinem Heim, nicht wahr?\n@c2@"
  en: "@aFrog@bBut I must detain you no longer. Mr. Hoffman awaits you in his dwelling-place, does he not?\n@c2@"
  es: "@aRanito@bNo %H860%Xte%Yos%Z entretendré más. Juanchito %H860%Xte%Yos%Z espera en su morada, ¿no es cierto?\n@c2@"
  fr: "@aCrapaud@bMais je ne dois pas vous retenir plus longtemps.\nM. Hoffman vous attend dans sa ville en plein essor, n'est-ce pasⓡ\n@c2@"
  it: "@aRana@bOh, ma non voglio %H860%Xtrattenerti%Ytrattenervi%Z oltre. Immagino che lo stimato signor Dwayne %H860%Xti%Yvi%Z attenda nella sua residenza...\n@c2@"
  ja: "@a@bカエル「そういえば　ホフマンさんが\n\t家で　待っているんじゃないかな。\n@c2@"
"25":
  de: "@aUnke@bEr sprach davon, wie sehr er Eurer Mitarbeit an der weiteren Entwicklung dieser bescheidenen Siedlung bedarf.\n@c2@"
  en: "@aFrog@bHe spoke of the necessity of your cooperation in the further development of this humble settlement.\n@c2@"
  es: "@aRanito@bDecía que necesitaba de %H860%Xtu%Yvuestra%Z cooperación para impulsar el desarrollo de este humilde asentamiento.\n@c2@"
  fr: "@aCrapaud@bIl a précisé que votre coopération était nécessaire au développement à venir de cet humble village.\n@c2@"
  it: "@aRana@bMi ha riferito dell'importante ruolo che %H860%Xsvolgi%Ysvolgete%Z nel progetto di sviluppo del suo insediamento.\n@c2@"
  ja: "@a@bカエル「この町が　もっと発展するには\n\t%a00090さんたちの　協力が\n\t必要だって　言ってたよ。\n@c2@"
"26":
  de: "@aUnke@bIch bleibe hier und harre des Wiederaufstiegs der Stadt aus dem Wüstensand voll geduldiger Vorfreude. Quaak!\n@c2@"
  en: "@aFrog@bI shall sit here and await the town's rising from the desert sands with patient anticipation. Rrrribbit!\n@c2@"
  es: "@aRanito@bEsperaré aquí, sentado pacientemente, el resurgimiento de la ciudad de las arenas del desierto. ¡Croac!\n@c2@"
  fr: "@aCrapaud@bJe vais rester assis ici à attendre patiemment qu'une ville émerge petit à petit de ce désert de sable. Croâââⓠ\n@c2@"
  it: "@aRana@bIo aspetterò qui che la città cresca, stagliandosi sulle sabbie del deserto, ed espandendosi sempre di più, sempre di più...\n@c2@"
  ja: "@a@bカエル「ボクも　ここで\n\t町の発展を　楽しみに待つことにしよう。\n\tケロケロ……。\n@c2@"
"27":
  de: "@a@b*: Hey, ich bin Rocky. Mr. Hoffman hat mich und meine Frau Adrian eingeladen, aus der Großstadt herzuziehen, um ein neues Leben anzufangen.\n@c2@"
  en: "@a@b*: Hey, I'm Rocky. Mr. Hoffman invited me and my lady Adrian to move down here from the big city to start us a new life.\n@c2@"
  es: "@a@b*: Hola, me llamo Roque. Juanchito nos ha invitado a mí y a mi señora a mudarnos aquí desde la gran ciudad para comenzar una nueva vida.\n@c2@"
  fr: "@a@b*ⓢ Salut, je m'appelle Rocky. M. Hoffman m'a invité avec ma femme Adrienne à quitter la grande ville pour m'installer ici et commencer une nouvelle vie.\n@c2@"
  it: "@a@b*: Salve! Io sono Rocco! Il signor Dwayne ha invitato me e mia moglie Adriana a lasciare la città dove vivevamo e a trasferirci qui.\n@c2@"
  ja: "@a@bロッコ「ぼくは　ロッコ。\n\tホフマンさんに　さそわれ\n\t妻のナナと　引っ越して来ました。\n@c2@"
"28":
  de: "@aRocky@bWenn ich nur hart genug arbeite, werden sich all unsere Träume erfüllen. Ich will nur, dass meine Adrian glücklich ist.\n@c2@"
  en: "@aRocky@bAll's I gotta do is work hard, an' all our dreams'll come true. All I want is for Adrian to be happy.\n@c2@"
  es: "@aRoque@bLo único que tengo que hacer es trabajar duro y todos nuestros sueños se harán realidad. Tan solo deseo la felicidad de Adriana.\n@c2@"
  fr: "@aRocky@bTout ce que j'ai à faire, c'est travailler dur et tous nos rêves se réaliseront. Tout ce que je veux, c'est qu'Adrienne soit heureuse.\n@c2@"
  it: "@aRocco@bQuesto posto offre mille possibilità! Se mi allenerò duramente, vincerò qualsiasi incontr... Ehm! Se lavorerò sodo potrò realizzare tutti i miei sogni.\n@c2@"
  ja: "@a@bロッコ「いっしょうけんめい　働いて\n\t妻を　幸せにするのが\n\tぼくの夢なんです。\n@c2@"
"29":
  de: "@aAdrian@bDieser Rocky! Rackert sich von morgens bis abends auf dem Feld ab.\n@c1@"
  en: "@aAdrian@bThat darned Rocky! From mornin' 'til night he's out there in the fields slavin' away.\n@c1@"
  es: "@aAdriana@b¡Ese Roque! Se pasa todo el día de sol a sol trabajando duro en el campo.\n@c1@"
  fr: "@aAdrienne@bSacré Rockyⓠ Du matin au soir, il est dans les champs à trimer comme un esclave.\n@c1@"
  it: "@aAdriana@bAh, Rocco, marito mio! È sempre al lavoro, giorno e notte! Non si ferma mai!\n@c1@"
  ja: "@a@bナナ「まったく　ロッコったら\n\t朝から　晩まで\n\t畑で　働いているのよ！\n@c1@"
"30":
  de: "@aAdrian@bUnd das, obwohl wir doch erst ganz frisch verheiratet sind. Tja, es liegt ihm wohl im Blut. Er war immer schon eine Kämpfernatur. (Seufz)\n@c1@"
  en: "@aAdrian@bHere we are nooly married, and we're straight into the hard life. I guess it's in his nature. \nHe always was a fighter. (sigh)\n@c1@"
  es: "@aAdriana@bAquí estamos, recién casados y él venga a trabajar como un mulo. Imagino que es que él es así. \nSiempre ha sido un luchador. (suspiro)\n@c1@"
  fr: "@aAdrienne@bOn vient juste de se marier et on a déjà la vie dure. Enfin, je suppose que c'est dans son caractère.\nC'est un battant. (soupir)\n@c1@"
  it: "@aAdriana@bSiamo sposati da poco, ma lui ha tempo solo per il suo lavoro... Del resto, è fatto così: quando inizia qualcosa, non si ferma fino al gong finale!\n@c1@"
  ja: "@a@bナナ「新婚ほやほや　なのに\n\t早くも　すれちがいの生活だわ。\n\tぷんぷん。\n@c1@"
"31":
  de: "@aHank Hoffman Jr.@bBis später.\n@c2@"
  en: "@aHank Hoffman Jr.@bSee y'all in a little while.\n@c2@"
  es: "@aJuanchito@b%H860%X%A120%XLo%Z%B120%XLa%Z%Y%R000%XLas%YLos%Z%Z veo dentro de un rato pues.\n@c2@"
  fr: "@aHank Hoffman Jr@bÀ tout à l'heure.\n@c2@"
  it: "@aJohn Dwayne Jr.@bA dopo!\n@c2@"
  ja: "@a@bホフマン「では　後ほど……。\n@c2@"
"32":
  de: "@a@b*: Friede sei mit Euch. Ich bin eine Wandernonne. Ich danke Euch von Herzen, dass Ihr mir von diesem Ort erzählt habt.\n@c1@"
  en: "@a@b*: Peace be with you. I am a wandering nun.\nMy heartfelt thanks go to you for teaching me\nof this place.\n@c1@"
  es: "@a@b*: La paz sea %H860%Xcontigo%Y%R000%Xcon vosotras%Ycon vosotros%Z%Z. Soy una monja misionera.\nMi más sentido agradecimiento por haberme hablado de este lugar.\n@c1@"
  fr: "@a@b*ⓢ La paix soit avec vous. Je suis une religieuse itinérante. Je vous remercie du fond du cœur de m'avoir parlé de cet endroit.\n@c1@"
  it: "@a@b*: Che la pace sia con %H860%Xte! Ti%Yvoi! Vi%Z sono infinitamente grata per avermi detto di questo luogo.\n@c1@"
  ja: "@a@b＊「私は　旅の尼。\n\tこの地を　教えて下さって\n\tありがとうございました。\n@c1@"
"33":
  de: "@a@b*: Ich habe mich mit Mr. Hoffman beraten, und er meint auch, ich solle Euch nach besten Kräften unterstützen.\n@c1@"
  en: "@a@b*: I have consulted with Mr. Hoffman, and he agrees that I should help you to the best of my ability.\n@c1@"
  es: "@a@b*: He consultado con Juanchito y está de acuerdo en que %H860%Xte%Yos%Z ayude en la medida de lo posible.\n@c1@"
  fr: "@a@b*ⓢ J'ai parlé à M. Hoffman et il est d'accord pour que je vous aide du mieux que je peux.\n@c1@"
  it: "@a@b*: Ho parlato con il signor Dwayne, e mi ha detto che dovrei %H860%Xaiutarti%Yaiutarvi%Z in tutti i modi possibili.\n@c1@"
  ja: "@a@b＊「ホフマンさんとも　ご相談したのですが\n\t私は　%a00140さんたちの\n\tお役に立ちたいと　思っております。\n@c1@"
"34":
  de: "@a@b*: Ich glaube, ich kann Euch in Mr. Hoffmans Heim am besten zu Diensten sein, also werde ich dorthin zurückkehren und auf Eure Anweisungen warten.\n@c1@"
  en: "@a@b*: I believe I can be of most use to you at Mr. Hoffman's home, so I shall retire there and await your orders.\n@c1@"
  es: "@a@b*: Considero que %H860%Xte%Yos%Z seré de más ayuda desde la residencia de Juanchito, así que me retiraré hasta nueva orden.\n@c1@"
  fr: "@a@b*ⓢ Je crois que je vous serai d'une grande utilité chez M. Hoffman, je vais donc m'y retirer et attendre vos ordres.\n@c1@"
  it: "@a@b*: Ora andrò a casa del signor Dwayne. Se %H860%Xvorrai chiedermi qualcosa, mi troverai%Yvorrete chiedermi qualcosa, mi troverete%Z lì.\n@c1@"
  ja: "@a@b＊「ホフマンさんの家に　いたほうが\n\t皆さんの　おチカラになれそうですので\n\t先に行って　お待ちしていますね。\n@c1@"
"35":
  de: "@a@b*: Bitte nehmt Euch die Zeit, um Euch auszuruhen und Spaß zu haben. Die Göttin sei mit Euch.\n@c1@"
  en: "@a@b*: Please, take your time to relax and enjoy yourselves. Goddess go with you.\n@c1@"
  es: "@a@b*: %H860%XTómate tu%YTomaos vuestro%Z tiempo para descansar y disfrutar. Que la Diosa %H860%Xte%Yos%Z acompañe.\n@c1@"
  fr: "@a@b*ⓢ Je vous en prie, prenez le temps de vous détendre et de vous amuser.\nQue la Déesse vous accompagne.\n@c1@"
  it: "@a@b*: Adesso %H860%Xriposa e rilassati%Yriposate e rilassatevi%Z. Possa la protezione della dea non %H860%Xabbandonarti%Yabbandonarvi%Z mai.\n@c1@"
  ja: "@a@b＊「どうぞ　後から　ごゆっくり\n\tいらして下さい。\n\tそれでは……。\n@c1@"
"36":
  de: "@a@b*: He, Ihr da! Ahoi! Ihr reist doch durch die Welt, oder nicht? Habt Ihr auch schon mal von dieser fantastischen neuen Glitzerstadt gehört?\n@c3@"
  en: "@a@b*: Arrr, you there! Ye be a traveller unless I'm much mistaken. So have ye heard tell of this fabulous new city of plunder and wonder?\n@c3@"
  es: "@a@b*: ¡Arrr, ah del barco! Si no me equivoco %H860%Xdebes ser %A120%Xun viajero%Z%B120%Xuna viajera%Z%Y%R000%Xdebéis ser viajeras%Ydebéis ser viajeros%Z%Z. ¿%H860%XTe han%YOs han%Z llegado rumores sobre una nueva y fabulosa ciudad repleta de riquezas y maravillas?\n@c3@"
  fr: "@a@b*ⓢ Grrr, vous làⓠ Vous êtes %A120%Xun voyageur%Z%B120%Xune voyageuse%Z, si j'me trompe pas.\n㈡\n*ⓢ Alors vous avez dû entendre parler de cette nouvelle ville fabuleuse, pleine de richesses et de merveillesⓡ\n@c3@"
  it: "@a@b*: Ehi, %H860%Xtu%Yvoi%Z! Scommetto la mia ultima vela che %H860%Xgiri%Ygirate%Z il mondo alla ventura! %H860%XHai sentito parlare anche tu%YAvete sentito parlare anche voi%Z di una splendida città fondata da poco?\n@c3@"
  ja: "@a@b＊「あんた　旅の人だね。\n\tだったら　知らないかい？\n\t新しくできた町の　ウワサを……。\n@c3@"
"37":
  de: "@a@b*: Ich überlege schon lange, ob ich nicht den Anker lichten und zu neuen Ufern aufbrechen soll.\n@c3@"
  en: "@a@b*: I've been itchin' to weigh anchor and set sail for new shores, so I have.\n@c3@"
  es: "@a@b*: Me muero de ganas por levar anclas y desplegar velas en busca de nuevos puertos.\n@c3@"
  fr: "@a@b*ⓢ Sacrebleu, ça fait un moment que j'ai envie de lever l'ancre pour aller découvrir de nouveaux rivagesⓠ\n@c3@"
  it: "@a@b*: Se quel posto esistesse davvero, salperei l'ancora e dirigerei immediatamente la prua lì! Ho voglia di visitare posti nuovi!\n@c3@"
  ja: "@a@b＊「いや　ちょっと思うところあって\n\t旅をしててさ……　どこかで\n\t人生を　やりなおすのもいいかなと。\n@c3@"
"38":
  de: "@a@bWillst du ihm von Hank Hoffman Jr.s Pionierstadt erzählen?\n@c3@"
  en: "@a@bDo you want to tell him about Hank Hoffman Jr.'s frontier town?\n@c3@"
  es: "@a@b¿Deseas hablarle de la ciudad fronteriza de Juanchito?\n@c3@"
  fr: "@a@bVoulez-vous lui parler de la ville pionnière de Hank Hoffman Jrⓡ\n@c3@"
  it: "@a@bVuoi dirgli della nuova città di frontiera fondata da John Dwayne Jr.?\n@c3@"
  ja: "@a@bこの人に\n%a00260　のことを\n教えてあげますか？\n@c3@"
"39":
  de: "@a@b*: Beim Klabautermann! So einen Ort gibt's tatsächlich? Da setz ich doch gleich Kurs darauf!\n@c3@"
  en: "@a@b*: Arrr! Ye're yankin' me anchor! Such a place really does exist? I'll set me a course for that there town right away. \n@c3@"
  es: "@a@b*: ¡Arrr! ¡Me %H860%Xestás%Yestáis%Z tomando el mástil! ¿Existe realmente ese lugar? Pondré rumbo inmediatamente hacia esa ciudad. \n@c3@"
  fr: "@a@b*ⓢ Grrrⓠ Nom d'une jambe de boisⓠ Ça existe vraiment, un endroit pareilⓡ Je mets les voiles tout de suite pour foncer vers cette ville.\n@c3@"
  it: "@a@b*: Per tutte le ancore! Ma allora non è solo una storia inventata da qualche marinaio ubriaco! Voglio approdare subito in quel paradiso!\n@c3@"
  ja: "@a@b＊「へえ～！　そんな町が！？\n\tこれは　さっそく\n\t行かせてもらうぜ。\n@c3@"
"40":
  de: "@a@b*: Verflixt, jetzt hätte ich doch fast den Schiffskameraden vergessen, den ich noch im Schlepptau hab!\n@c3@"
  en: "@a@b*: But shiver me timbers, I'm forgettin' I've got a shipmate in tow!\n@c3@"
  es: "@a@b*: ¡Rayos y centellas, me olvidaba de que llevo tripulación!\n@c3@"
  fr: "@a@b*ⓢ Ventrebleu, j'en oublie que j'ai un moussaillon avec moiⓠ\n@c3@"
  it: "@a@b*: Mi portasse via un uragano! Quasi dimenticavo di non essere da solo...\n@c3@"
  ja: "@a@b＊「……と　思ったけど　いけねえ！\n\t連れが　いるんだったよ。\n@c3@"
"41":
  de: "@a@b*: Die olle Landratte treibt sich bestimmt in der Herberge rum. Könnt Ihr da auch noch Bescheid sagen?\n@c3@"
  en: "@a@b*: The lubber should be down there in the inn.\nBe a mate an' pass on the glad tidings.\n@c3@"
  es: "@a@b*: Ese grumete estará seguramente en la posada.\n%H860%XHazme%YHacedme%Z el favor de comunicarle las buenas noticias.\n@c3@"
  fr: "@a@b*ⓢ Le bougre doit être à l'auberge.\nVous seriez bien aimable d'aller lui annoncer la bonne nouvelle.\n@c3@"
  it: "@a@b*: La persona che viaggia con me dovrebbe essere alla locanda. %H860%XFammi un favore: passaci e dalle%YFatemi un favore: passateci e datele%Z la buona notizia.\n@c3@"
  ja: "@a@b＊「たぶん　宿屋にいるはずだから\n\tよかったら　あんたからも\n\t声を　かけてくれや。\n@c3@"
"42":
  de: "@a@b*: Tja, war ja eigentlich klar. Wär' auch zu schön gewesen, um wahr zu sein, was?\n@c3@"
  en: "@a@b*: O' course such a fabulous land don't really exist. Arr well.\n@c3@"
  es: "@a@b*: Es evidente que un lugar tan fantástico no existe realmente. Arr, vaya.\n@c3@"
  fr: "@a@b*ⓢ Bien sûr, un endroit aussi fabuleux ne peut pas exister. Grrr, tant pis.\n@c3@"
  it: "@a@b*: Ah, corpo di una balena guercia! Lo sapevo che un posto del genere poteva esistere solo nelle favole...\n@c3@"
  ja: "@a@b＊「まあ　そんな　都合のよい場所が\n\tあるはずもねえか……。\n@c3@"
"43":
  de: "@aKarl Oink@bTagchen, Ihr %H860%XBergvagabund%YBergvagabunden%Z. Ich bin Karl Oink und bereise mit meiner Begleitung die Welt.\n@c2@"
  en: "@aPrelvis Esley@bHowdy there, hound dog.\nI'm Prelvis Esley, an' I've been travellin' this little ol' world with a companion o' mine.\n@c2@"
  es: "@aPrelvis Esley@bHola, bipapulula.\nMe llamo Prelvis Esley, y recorro el mundo con un acompañante.\n@c2@"
  fr: "@aGino Allaydi@bHé, salut %A120%Xfrangin%Z%B120%Xfrangine%Z.\nJe m'appelle Gino Allaydi et je voyage à travers le monde avec un compagnon.\n@c2@"
  it: "@aElvis Bresly@bSalve, mio amato pubblico! Sono Elvis Bresley, e giro il mondo per deliziare le folle con le mie canzoni!\n@c2@"
  ja: "@a@bガライ「ぼくは　旅の詩人　ガライ。\n\tふとした縁で　ある男を連れて\n\t旅をしているんだ。\n@c2@"
"44":
  de: "@aKarl Oink@bAber das Wandern ist des Müllers Lust, und ich bin schließlich kein Müller, sondern ein Barde.\n@c2@"
  en: "@aPrelvis Esley@bBut lately I been gettin' tired of this ol' travellin' game. I'm hankerin' for a little less navigation, little less action.\n@c2@"
  es: "@aPrelvis Esley@bAunque últimamente se me está haciendo pesado tanto viaje. Me muero de ganas de dejar de menear las caderas de aquí para allá, oh yeah.\n@c2@"
  fr: "@aGino Allaydi@bMais je commence à en avoir assez de voyager tout le temps. Ça ne change pas un homme... J'aspire à me poser quelque part.\n@c2@"
  it: "@aElvis Bresly@bMa ora sono stufo di viaggiare, e vorrei trovare un palcoscenico più tranquillo dove riposare un po'.\n@c2@"
  ja: "@a@bガライ「けど　そんな旅にも　つかれてきて\n\tどこか　見知らぬ町に\n\t落ち着きたいんだけど……。\n@c2@"
"45":
  de: "@a@bWillst du ihm von Hank Hoffman Jr.s Pionierstadt erzählen?\n@c2@"
  en: "@a@bDo you want to tell him about Hank Hoffman Jr.'s frontier town?\n@c2@"
  es: "@a@b¿Deseas hablarle de la ciudad fronteriza de Juanchito?\n@c2@"
  fr: "@a@bVoulez-vous lui parler de la ville pionnière de Hank Hoffman Jrⓡ\n@c2@"
  it: "@a@bVuoi dirgli della nuova città di frontiera fondata da John Dwayne Jr.?\n@c2@"
  ja: "@a@bこの人に\n%a00260　のことを\n教えてあげますか？\n@c2@"
"46":
  de: "@aKarl Oink@b%0%a00260? Soll ich denn, soll ich denn ins Städtele hinein? Klingt ja gar nicht schlecht!\n@c2@"
  en: "@aPrelvis Esley@b%0%a00260, huh? You know, they say anyplace is paradise, but that sounds mighty fine to me.\n@c2@"
  es: "@aPrelvis Esley@b¿%0%a00260, eh?\n㈡\nYa %H860%Xsabes, %A120%Xnene%Z%B120%Xnena%Z%Ysabéis, %R000%Xnenas%Ynenes%Z%Z, cualquier sitio es bueno para un viejo roquero, pero lo que me %H860%Xcuentas%Ycontáis%Z hace que me dé vueltas el tupé.\n@c2@"
  fr: "@aGino Allaydi@b%0%a00260, ah ouaisⓡ Vu comme vous en parlez, je mettrais ma main au feu que c'est un endroit super.\n@c2@"
  it: "@aElvis Bresly@b%0%a00260? Mi suona giusto! Non sarà Greislend, ma scommetto che mi ci troverò bene.\n@c2@"
  ja: "@a@bガライ「なるほど\n\t%a00260　か……。\n\t不思議と　心にひびく名の町だね。\n@c2@"
"47":
  de: "@aKarl Oink@bMich brennt's in meinen Reiseschuh'n! Dann brechen wir doch gleich auf! Vielen Dank auch!\n@c2@"
  en: "@aPrelvis Esley@bI'll grab my travellin' buddy an' head on down there.\nThank you very much!\n@c2@"
  es: "@aPrelvis Esley@bSe lo diré a mi compañero de viaje e iremos allí.\n¡Muchas gracias!\n@c2@"
  fr: "@aGino Allaydi@bJe vais aller chercher mon vieux copain de voyage et y aller directement.\nMerci beaucoupⓠ\n@c2@"
  it: "@aElvis Bresly@bVado a prendere il mio compagno di tour e mi precipito lì! Grazie, %H860%Xsei%Ysiete%Z un pubblico magnifico!\n@c2@"
  ja: "@a@bガライ「さそってくれて　ありがとう。\n\t連れの男と　その町へ\n\t行ってみるよ。\n@c2@"
"48":
  de: "@aKarl Oink@bVerborgen ist das Ziel...\n@c2@"
  en: "@aPrelvis Esley@bAw shucks. When will I ever find my promised land?\n@c2@"
  es: "@aPrelvis Esley@b¡Oh! ¡No! ¡No! ¡No! ¿Cuándo encontraré por fin mi tierra prometida? ¿Dónde estará mi auambabulubabalambambú?\n@c2@"
  fr: "@aGino Allaydi@bPfff, tant pis. Je vais continuer à chercher la terre promise. S'il n'est pas trop tard...\n@c2@"
  it: "@aElvis Bresly@bAh, baby! Quando troverò la mia terra promessa?\n@c2@"
  ja: "@a@bガライ「ああ　どこか\n\t心にひびく町は　ないものか。\n@c2@"
"49":
  de: "@aRocky@bHe, neulich ist plötzlich ein reisender Krämer aufgetaucht und hat mir von diesem Kerl erzählt.\n@c2@"
  en: "@aRocky@bHey, some travellin' salesman comes outta nowhere the other day an' starts tellin' me about this guy.\n@c2@"
  es: "@aRoque@bEh, el otro día apareció un mercader ambulante de la nada y empezó a hablarme de un tipo.\n@c2@"
  fr: "@aRocky@bÀ propos, l'autre jour, un marchand ambulant est arrivé de nulle part et a commencé à me parler d'un type.\n@c2@"
  it: "@aRocco@bComunque, anche qui ce ne sono di persone suonate, eh! Per esempio, l'altro giorno un venditore ambulante mi ha raccontato una strana storia...\n@c2@"
  ja: "@a@bロッコ「この間　ふらっとやって来た\n\t旅の商人が　こんな話を\n\tしてましたよ。\n@c2@"
"50":
  de: "@aRocky@bDer sitzt angeblich in der Kirche drüben in Burland und redet von nichts anderem als davon, sich irgendwo ein neues Leben aufzubauen.\n@c2@"
  en: "@aRocky@bSays he sits around in the church down there in Burland talkin' about how he wants to start himself a noo life someplace else.\n@c2@"
  es: "@aRoque@bDijo que se pasa el día en la iglesia de Burlandia hablando de cuánto desearía comenzar una nueva vida en otro lugar.\n@c2@"
  fr: "@aRocky@bÀ ce qu'il dit, ce type est assis dans l'église, à Bastione, et dit à tout le monde qu'il veut recommencer une nouvelle vie ailleurs.\n@c2@"
  it: "@aRocco@bPare che, dalle parti della chiesa di Burlandia, ci sia un tizio che non fa altro che parlare di quanto voglia iniziare una nuova vita in un posto diverso.\n@c2@"
  ja: "@a@bロッコ「どこか　見知らぬ町で\n\t人生をやりなおしたい男が\n\tバトランド城下町の教会にいたとか……。\n@c2@"
"51":
  de: "@a@b*: He, Ihr da! Habt Ihr schon gehört?\n@c2@"
  en: "@a@b*: You there! Have you heard?\n@c2@"
  es: "@a@b*: ¡Eh, %H860%Xtú%Y%R000%Xvosotras%Yvosotros%Z%Z! ¿Lo %H860%Xhas%Yhabéis%Z oído?\n@c2@"
  fr: "@a@b*ⓢ Hé, vous, làⓠ Vous avez entenduⓡ\n@c2@"
  it: "@a@b*: Ehi, %H860%Xtu! Hai saputo%Yvoi! Avete saputo%Z?\n@c2@"
  ja: "@a@b＊「旅の人！　知ってますか？\n@c2@"
"52":
  de: "@a@b*: Aber ich hab Euch doch noch gar nichts erzählt!\nNa schön, wie Ihr wollt.\n@c2@"
  en: "@a@b*: But I haven't even told you anything yet.\nFine, whatever.\n@c2@"
  es: "@a@b*: Pero si todavía no %H860%Xte%Yos%Z he contado nada.\nBueno, da igual.\n@c2@"
  fr: "@a@b*ⓢ Mais, je ne vous ai encore rien dit.\nEnfin, bref.\n@c2@"
  it: "@a@b*: Ma se non %H860%Xti ho ancora detto niente?! Bah! Fa' come ti%Yvi ho ancora detto niente?! Bah! Fate come vi%Z pare...\n@c2@"
  ja: "@a@b＊「……。\n\tまだ　何も　話していないのに。\n\tま　いいか。\n@c2@"
"53":
  de: "@a@b*: Ich bin von meinem früheren Königreich hierher ins Land der unbegrenzten Möglichkeiten gekommen!\n@c2@"
  en: "@a@b*: I moved from my previous kingdom to this land of the free ⓚⓛ free trade, that is!\n@c2@"
  es: "@a@b*: Me trasladé desde mi reino anterior a esta tierra de libre... libre comercio, ¡eso es!\n@c2@"
  fr: "@a@b*ⓢ J'ai quitté mon précédent royaume pour cette terre de liberté... de liberté du commerce, s'entendⓠ\n@c2@"
  it: "@a@b*: Ho lasciato il regno dove vivevo per trasferirmi qui, nella terra della libertà. Cioè, nella terra dove c'è la libertà di commerciare e di arricchirsi!\n@c2@"
  ja: "@a@b＊「わたし　昔は　ドラゴンの角\n\tと呼ばれる　ふたごの塔で\n\tガイドの仕事を　していたんですよ。\n@c2@"
"54":
  de: "@a@b*: Hoffentlich finden sie in den Nachbarländern Öl oder so, damit wir dort einmarschⓚⓛ äh, ich meine, Handel treiben können.\n@c2@"
  en: "@a@b*: I hope one of the surrounding countries finds oil or some other resource we need, so we can go invaⓚⓛ er, I mean, democratise them too.\n@c2@"
  es: "@a@b*: Ojalá alguno de los países fronterizos descubra petróleo o algún otro recurso que necesitemos para que podamos inva... esto... invitarlos a la democracia.\n@c2@"
  fr: "@a@b*ⓢ J'espère qu'un des pays qui nous entourent trouvera du pétrole ou toute autre ressource dont on a besoin.\n㈡\n*ⓢ Comme ça, on pourrait les envah... euh, leur apporter la démocratie.\n@c2@"
  it: "@a@b*: E quando un altro paese troverà il petrolio, lo invaderemo per impadronircen... Ehm, volevo dire che esporteremo lì la nostra democrazia!\n@c2@"
  ja: "@a@b＊「でも　場所がら　おとずれる人も\n\t少なくなってきて　転職したんです。\n\tま　それは　さておき……\n@c2@"
"55":
  de: "@aUnke@bDieser furchteinflößende Herr, der kürzlich in der Stadt eintraf, wäre beinahe auf mich getreten!\n@c2@"
  en: "@aFrog@bThat most terrifying-looking gentleman who\narrived in town recently almost trod upon me\nmere moments ago!\n@c2@"
  es: "@aRanito@b¡Ese caballero de aspecto terrorífico que llegó hace poco a la ciudad casi me pisa!\n@c2@"
  fr: "@aCrapaud@bLe gentilhomme à l'air terrifiant qui est récemment arrivé en ville a failli me marcher dessus il y a quelques instants à peineⓠ\n@c2@"
  it: "@aRana@bProprio poco fa stavo per essere calpestato da un galantuomo dall'aspetto inquietante appena giunto in città.\n@c2@"
  ja: "@a@bカエル「それにしても　荒っぽい男が\n\t来たものだね。　さっき　あやうく\n\tふみつけられそうになったよ……。\n@c2@"
"56":
  de: "@aUnke@bDas ist nun das zweite Mal, dass ich mit knapper Not dem Sensenmann entfliehen konnte!\n@c2@"
  en: "@aFrog@bThis is only the second time I have endured such a hair-raising brush with death.\n@c2@"
  es: "@aRanito@bEs la segunda ocasión que me enfrento cara a cara con la muerte tan de cerca.\n@c2@"
  fr: "@aCrapaud@bCe n'est que la deuxième fois de ma vie que je frôle la mort d'aussi près.\n@c2@"
  it: "@aRana@bQuesta è la seconda volta che l'impietosa mietitrice dalla lunga falce mi sfiora con la sua mano gelida e ossuta...\n@c2@"
  ja: "@a@bカエル「あやうく　死にかけたのは\n\tこれで二度目かな？\n@c2@"
"57":
  de: "@aUnke@bBeim ersten Mal fand ich mich versehentlich am Grunde eines Brunnens eingekerkert.\n@c2@"
  en: "@aFrog@bThe first time was when I became accidentally entombed at the bottom of a well.\n@c2@"
  es: "@aRanito@bLa primera fue cuando accidentalmente quedé sepultado en el fondo de un pozo.\n@c2@"
  fr: "@aCrapaud@bLa première fois, c'est lorsque je me suis accidentellement retrouvé enterré au fond d'un puits.\n@c2@"
  it: "@aRana@bIn precedenza, la morte mi mancò di poco quando rimasi intrappolato in fondo a un pozzo.\n@c2@"
  ja: "@a@bカエル「まえは　井戸の底で\n\t生き埋めになって……\n@c2@"
"58":
  de: "@aUnke@bNach diesem grauenhaften Erlebnis musste ich erst einmal einen langen Winterschlaf machen, um wieder zu Kräften zu kommen.\n@c2@"
  en: "@aFrog@bIt was necessary to hibernate for a considerable period after undergoing such a harrowing ordeal.\n@c2@"
  es: "@aRanito@bMe vi obligado a hibernar durante un prolongado periodo tras sufrir tan traumática experiencia.\n@c2@"
  fr: "@aCrapaud@bJ'ai dû hiberner pendant un temps considérable après avoir traversé une épreuve si douloureuse. \n@c2@"
  it: "@aRana@bPer riprendermi da un'esperienza tanto terrificante, sono stato costretto a un periodo di letargo insolitamente lungo.\n@c2@"
  ja: "@a@bカエル「それから　長い間\n\t休眠じょうたい　だったんだ。\n@c2@"
"59":
  de: "@aUnke@bWie lange ich wohl geschlafen habe? Quaak!\n@c2@"
  en: "@aFrog@bI wonder how long I slept for altogether... Rrrrrribbit!\n@c2@"
  es: "@aRanito@bMe pregunto cuánto tiempo estuve dormido... ¡Croac!\n@c2@"
  fr: "@aCrapaud@bJe me demande pendant combien de temps j'ai dormi au total... Croâââⓠ\n@c2@"
  it: "@aRana@bA essere sincero, nemmeno io so quanto tempo ho dormito!\n@c2@"
  ja: "@a@bカエル「いったい　どれだけ\n\t眠りつづけていたのやら……？\n\tケロケロ。\n@c2@"
"60":
  de: "@aUnke@bEinst verkauften mächtige Kaufleute in der Burg, die früher an diesem Ort stand, einen wahren Schatz seltener Kleinode.\n@c2@"
  en: "@aFrog@bGreat merchants once sold a veritable treasure trove of rare artefacts at the castle that stood in this place.\n@c2@"
  es: "@aRanito@bGrandes mercaderes llegaron a vender un auténtico tesoro de extraordinarios objetos en el castillo que ocupaba este lugar.\n@c2@"
  fr: "@aCrapaud@bAutrefois, de grands marchands vendaient de véritables trésors et des objets rares au château qui se dressait ici.\n@c2@"
  it: "@aRana@bMolto tempo fa, alcuni grandi mercanti vendettero dei manufatti rari al castello che sorgeva in questa zona.\n@c2@"
  ja: "@a@bカエル「かつて　ここにあった城には\n\t旅の商人たちが　めずらしい品を\n\tいろいろ　売りに来たものだよ。\n@c2@"
"61":
  de: "@aUnke@bUnd mehr noch ⓚⓛ auch die Botschafter ferner Länder brachten den Bewohnern der Burg kostbare Gaben dar.\n@c2@"
  en: "@aFrog@bAnd not only that, envoys from distant lands also brought great offerings to present to the castle's inhabitants.\n@c2@"
  es: "@aRanito@bY no solo eso, sino que emisarios de tierras lejanas trajeron ofrendas para los habitantes del castillo.\n@c2@"
  fr: "@aCrapaud@bEt de surcroît, des émissaires venus de pays lointains apportaient également de sublimes présents aux habitants du château.\n@c2@"
  it: "@aRana@bInoltre, gli abitanti del maniero ricevettero doni preziosi da numerosi ambasciatori provenienti da paesi lontani.\n@c2@"
  ja: "@a@bカエル「それだけじゃなく　お城への\n\tけんじょう品を　もってくる人たちも\n\tいたしね……。\n@c2@"
"62":
  de: "@aUnke@bWürde aus der Stadt wieder eine mächtige Burg entstehen, würden vielleicht auch hier wundersame Läden und herrliche Schätze auftauchen.\n@c2@"
  en: "@aFrog@bIf this town were to develop into a mighty castle also, wondrous shops and splendid treasures too might appear.\n@c2@"
  es: "@aRanito@bSi esta ciudad volviera a tener un gran castillo, quizás también aparecerían magníficas tiendas y espléndidos tesoros.\n@c2@"
  fr: "@aCrapaud@bSi cette ville devait elle aussi posséder un jour un puissant château, de merveilleuses échoppes et de splendides trésors pourraient apparaître.\n@c2@"
  it: "@aRana@bSe anche in questa città fosse eretto un castello, ben presto sorgerebbero negozi ben forniti, e magari salterebbe fuori persino qualche tesoro!\n@c2@"
  ja: "@a@bカエル「この町も　発展して\n\tお城みたいになれば　お店も増えるし\n\t宝物も　出てくるかもしれないよ。\n@c2@"
"63":
  de: "@aUnke@bOh, wonnevolle Zeiten, die wir hoffentlich irgendwann wieder erleben werden! Quaak!\n@c2@"
  en: "@aFrog@bI look forward to such a felicitous day. Rrrribbit!\n@c2@"
  es: "@aRanito@bEspero ansiosamente que llegue tan feliz día. ¡Croac!\n@c2@"
  fr: "@aCrapaud@bJ'ai hâte de voir venir des jours aussi heureux. Croâââⓠ\n@c2@"
  it: "@aRana@bQuanto vorrei che ciò accadesse davvero!\n@c2@"
  ja: "@a@bカエル「ボクは　そのときを\n\t楽しみにしているからね。\n\tケロケロ。\n@c2@"
"64":
  de: "@aKarl Oink@bTagchen, %H860%X%A120%XWandergesell%Z%B120%XWandergesellin%Z%YWandersleut'%Z. Mein Name ist Karl Oink und ich bin ein lustiger Musikant. Es tönen die Lieder!\n@c2@"
  en: "@aPrelvis Esley@bHowdy there, hound dog.\nI'm Prelvis Esley, an' I spend my days travellin' this little ol' world an' spreadin' the joy o' song.\n@c2@"
  es: "@aPrelvis Esley@bHola, bipapulula.\nMe llamo Prelvis Esley y recorro este viejo mundo difundiendo la alegría de la música, oh yeah.\n@c2@"
  fr: "@aGino Allaydi@bHé, salut %A120%Xfrangin%Z%B120%Xfrangine%Z.\nJe m'appelle Gino Allaydi et je voyage à travers le monde pour faire connaître la musique que j'aime.\n@c2@"
  it: "@aElvis Bresly@bCome va, mio amato pubblico? Sono Elvis Bresly, e giro il mondo per inebriare le folle adoranti con la mia musica.\n@c2@"
  ja: "@a@bガライ「ぼくは　ガライ。\n\t各地を　うたいながら　旅してる　\n\t吟遊詩人さ。\n@c2@"
"65":
  de: "@aKarl Oink@b%a00260 ist eine mächtig feine Stadt, die schwer im Kommen ist.\n@c2@"
  en: "@aPrelvis Esley@bThis here's the finest little boom town in all the world. Viva %a00260!\n@c2@"
  es: "@aPrelvis Esley@bEsta es la ciudad más boyante del mundo. ¡Viva %a00260!\n@c2@"
  fr: "@aGino Allaydi@bCette petite ville champignon est la plus rock n' roll que j'aie jamais vue.\nVive %a00260ⓠ\n@c2@"
  it: "@aElvis Bresly@bNon sarà Greislend, ma questa è certamente la più entusiasmante città di frontiera che abbia mai visto. Viva %a00260!\n@c2@"
  ja: "@a@bガライ「ここは　すれちがいの町\n\t%a00260。\n@c2@"
"66":
  de: "@aKarl Oink@bUnd kein Wunder, bei so vielen Pionieren! Wer will fleißige Handwerker sehn?\n@c2@"
  en: "@aPrelvis Esley@bThere ain't no suspicious minds 'round these parts, just proud pioneers makin' an honest livin'.\nIt fair fills my heart with song just to be here.\n@c2@"
  es: "@aPrelvis Esley@bPor aquí no encontrarás gente sin marcha, solo orgullosos pioneros que se ganan la vida honestamente.\n㈡\nSolo con estar aquí se me llena el corazón de música. ¡Yeah! ¡Yeah!\n@c2@"
  fr: "@aGino Allaydi@bPas de signes extérieurs de richesse ici, seulement de fiers pionniers gagnant honnêtement leur vie.\nC'est vraiment un monde à part.\n@c2@"
  it: "@aElvis Bresly@bQuesti pionieri lavorano sodo tutto il giorno! Oh, quanto vorrei sudare insieme a loro! Uhm... Ripensandoci, preferisco rallegrarli con la mia musica.\n@c2@"
  ja: "@a@bガライ「旅人が　風と　出会い\n\tメロディーが　思い出と　すれちがう\n\tそぼくな町だよ。\n@c2@"
"67":
  de: "@a@b*: Beim Klabautermann, in meiner Jugend war ich ein ziemlicher Hitzkopf. Ein echter Unruhestifter.\n@c2@"
  en: "@a@b*: Arr, I was a rash one in me younger days an' no mistake. A real loose cannon.\n@c2@"
  es: "@a@b*: Arr, yo era un grumete temerario en mis años mozos, sin duda. Un bala perdida.\n@c2@"
  fr: "@a@b*ⓢ Grrr, J'étais sacrément dur quand j'étais plus jeune, vous savez. Une vraie tête brûlée.\n@c2@"
  it: "@a@b*: Da giovane ero uno scavezzacollo come ce ne sono pochi, una vera mina vagante!\n@c2@"
  ja: "@a@b＊「オレも　昔は　ずいぶんと\n\t無茶を　したもんよ。\n@c2@"
"68":
  de: "@a@b*: Ich plünderte Kronen von Gold... und auch für die eine oder andere Entführung war ich mir nicht zu schade...\n@c2@"
  en: "@a@b*: I plundered a crown o' gold...why, I even did me a little kidnappin'...\n@c2@"
  es: "@a@b*: Conseguí una corona de oro en mis saqueos... Incluso hice mis pinitos como secuestrador...\n@c2@"
  fr: "@a@b*ⓢ J'ai volé une couronne en or... et j'ai même fait un petit enlèvement...\n@c2@"
  it: "@a@b*: Misi le mani su una corona d'oro, e rapii anche qualche persona qua e là.\n@c2@"
  ja: "@a@b＊「金のかんむりを　盗んだり\n\t人さらいをしたり……。\n@c2@"
"69":
  de: "@a@b*: Aber dann traf ich einen, der mächtiger ist als jeder Kapitän, und ich sah das Licht und wurde zu dem, der ich jetzt bin.\n@c2@"
  en: "@a@b*: But then I met me a fellow, greater even than the greatest sea cap'n, who set me on the right course, an' now I'm a changed man.\n@c2@"
  es: "@a@b*: Pero conocí a un tipo, más grande que el más grande de los capitanes, que me mostró el buen camino y ahora soy un hombre nuevo.\n@c2@"
  fr: "@a@b*ⓢ Et puis un jour, j'ai rencontré quelqu'un de fantastique, qui surpassait n'importe quel loup de mer.\n㈡\n*ⓢ Et cette personne m'a remis sur le droit chemin. Aujourd'hui, j'ai totalement changé.\n@c2@"
  it: "@a@b*: Poi il destino mi ha fatto incontrare una persona speciale, e da allora ho cambiato vita.\n@c2@"
  ja: "@a@b＊「でも　あるお方との　出会いで\n\tすっかり　改心して\n\t真人間になっちまった。\n@c2@"
"70":
  de: "@a@b*: Ich tue Gutes, ich baue eine Kirche, die wie ein Leuchtturm verirrten Wanderern und anderen den Weg weist.\n@c2@"
  en: "@a@b*: I been performin' good works, buildin' a church to stand like a beacon for travellers who've strayed off-course an' such.\n@c2@"
  es: "@a@b*: Me he dedicado a las buenas obras y he construido una iglesia que sirve de faro a los viajeros que van a la deriva.\n@c2@"
  fr: "@a@b*ⓢ J'ai participé à des bonnes œuvres, j'ai construit une église qui sert de phare aux voyageurs égarés, et tout.\n@c2@"
  it: "@a@b*: Mi sono dedicato alle opere di bene, e ho persino costruito una chiesa dove accolgo i pellegrini che hanno smarrito la retta via.\n@c2@"
  ja: "@a@b＊「こうして　教会を建てて\n\t人さまの役に　立てようってんだからよ！\n@c2@"
"71":
  de: "@a@b*: Natürlich wird auch mein Glaube manchmal auf die Probe gestellt. Heute wäre ich beinahe einer armen kleinen Unke auf dem Kopf herumgetanzt.\n@c2@"
  en: "@a@b*: 'Course, me faith is still tested once in a while. Why, only today I had to stop meself dancin' a hornpipe on a poor little froggy's head.\n@c2@"
  es: "@a@b*: Pero de vez en cuando, todavía tengo tentaciones.\n㈡\n*: Precisamente hoy tuve que resistirme a bailar una chirimía sobre la cabeza de un pobre ranito.\n@c2@"
  fr: "@a@b*ⓢ Bien sûr, ma foi est mise à l'épreuve de temps en temps...\n㈡\n*ⓢ Rien qu'aujourd'hui, par exemple, j'ai dû me retenir de danser une gigue sur la tête d'un pauvre p'tit crapaud.\n@c2@"
  it: "@a@b*: Certo, ogni tanto ho ancora voglia di fare qualche mascalzonata... Oggi, per esempio, mi era venuto il ghiribizzo di ballare il tip-tap sulla testa di una rana.\n@c2@"
  ja: "@a@b＊「まっ　さっきも　カエルを\n\tふみつけるのを　すんでのところで\n\tやめたしな。\n@c2@"
"72":
  de: "@a@b*: Übrigens habe ich von einer großen Stadt gehört, die hier einst gestanden haben soll. Sie hieß Pioniria.\n@c2@"
  en: "@a@b*: By the by, I heard tell of a great city once stood on this spot, name o' Pioniria.\n@c2@"
  es: "@a@b*: Por cierto, me han dicho que sobre este mismo lugar se erigía antes la ciudad de Pioniria.\n@c2@"
  fr: "@a@b*ⓢ À propos, j'ai entendu dire qu'une grande cité se dressait autrefois à cet endroit.\nElle s'appelait Pioniria.\n@c2@"
  it: "@a@b*: Ho saputo che, molto tempo fa, in questa zona sorgeva una città fortificata chiamata Castromercatum.\n@c2@"
  ja: "@a@b＊「ところで　オレの聞いた話じゃ\n\tこの地には　昔　マーリブという\n\tでっかい都が　あったらしいな。\n@c2@"
"73":
  de: "@a@b*: Aber ein böser Zauberer ließ die mächtige Stadt im Wüstensand versinken und hieß ihren König, eine fremde Gestalt anzunehmen.\n@c2@"
  en: "@a@b*: But that great castle town was sunk beneath the sandy waves o' the desert by an evil sorcerer, and its king cursed to take a strange new form.\n@c2@"
  es: "@a@b*: Pero un malvado hechicero hizo desaparecer su majestuoso castillo bajo las arenas del desierto...\n㈡\n*: ... y una maldición cayó sobre el rey de aquellas tierras transformándolo en un ser horripilante.\n@c2@"
  fr: "@a@b*ⓢ Mais un sorcier maléfique a englouti ce grand château dans les vagues de sable du désert.\n㈡\n*ⓢ Il a aussi jeté un sort à son roi, à qui il a donné une nouvelle apparence très étrange.\n@c2@"
  it: "@a@b*: Era un castello bellissimo, ma un perfido stregone lo seppellì sotto una montagna di sabbia, e trasformò il suo sire in qualcosa di molto strano!\n@c2@"
  ja: "@a@b＊「けど　都は　悪しき魔法使いによって\n\tほろぼされ……　若き王も　呪いで\n\t姿を変えられちまったとか。\n@c2@"
"74":
  de: "@a@b*: (Winsel) Wuff!\n@c2@"
  en: "@a@b*: (whine) Arf!\n@c2@"
  es: "@a@b*: ¡(auuuu) Arf!\n@c2@"
  fr: "@a@b*ⓢ (gémissement) Ouarfⓠ\n@c2@"
  it: "@a@b*: Arf!\n@c2@"
  ja: "@a@b＊「ワン　ワン！\n@c2@"
"75":
  de: "@a@b*: Wau!\n@c2@"
  en: "@a@b*: Ruff!\n@c2@"
  es: "@a@b*: ¡Gruff!\n@c2@"
  fr: "@a@b*ⓢ Ououffⓠ\n@c2@"
  it: "@a@b*: Wuff!\n@c2@"
  ja: "@a@b＊「ク～ン。\n@c2@"
"76":
  de: "@aRocky@bIch weiß nicht, wieso, aber Adrian gefällt mir in letzter Zeit gar nicht.\n@c2@"
  en: "@aRocky@bI can't figure out why, but lately Adrian don't seem too good.\n@c2@"
  es: "@aRoque@bNo sé por qué, pero parece que últimamente Adriana no está muy contenta.\n@c2@"
  fr: "@aRocky@bJe ne sais pas pourquoi, mais ces derniers temps, Adrienne n'a pas l'air très bien.\n@c2@"
  it: "@aRocco@bHo l'impressione che, ultimamente, Adriana non sia di ottimo umore. Proprio non riesco a spiegarmene il motivo...\n@c2@"
  ja: "@a@bロッコ「なぜか　最近\n\tナナの　キゲンが悪いんだ。\n@c2@"
"77":
  de: "@aRocky@bHoffentlich habe ich sie nicht irgendwie verärgert.\n@c2@"
  en: "@aRocky@bI sure hope I ain't done nuttin' to upset her.\n@c2@"
  es: "@aRoque@bEspero que no haya hecho nada para disgustarla.\n@c2@"
  fr: "@aRocky@bJ'espère que je n'ai rien fait qui l'ait contrariée.\n@c2@"
  it: "@aRocco@bSpero che non sia per colpa mia... Quando va in collera diventa intrattabile, e io non posso fare altro che ritirarmi nel mio angolo...\n@c2@"
  ja: "@a@bロッコ「ボク　何か　いけないこと\n\tしちゃったのかなあ……？\n@c2@"
"78":
  de: "@aAdrian@bIch hab dir doch gesagt, ich will jetzt nicht mit dir reden! (Schluchz)\n@c1@"
  en: "@aAdrian@bI told ya I don't wanna talk to you right now! (sob)\n@c1@"
  es: "@aAdriana@b¡Te he dicho que ahora no quiero hablar contigo! (snif)\n@c1@"
  fr: "@aAdrienne@bJe t'ai dit que je ne voulais pas te parler pour le momentⓠ (sanglot)\n@c1@"
  it: "@aAdriana@bTi ho detto che non voglio parlare con te! Sob!\n@c1@"
  ja: "@a@bナナ「もう！\n\tあなたとは　話したくないって\n\t言ってるでしょ！　ぷんぷん。\n@c1@"
"79":
  de: "@aAdrian@bWas? Ach, tut mir leid, ich dachte, es wäre Rocky.\n@c1@"
  en: "@aAdrian@bHuh? Oh, sorry. I thought you were Rocky.\n@c1@"
  es: "@aAdriana@b¿Eh? ¡Ah!, lo siento. Creí que era Roque.\n@c1@"
  fr: "@aAdrienne@bHeinⓡ Oh, pardon. Je croyais que c'était Rocky.\n@c1@"
  it: "@aAdriana@bEh? Oh, %H860%Xscusa%Yscusate%Z... Credevo che fosse arrivato Rocco...\n@c1@"
  ja: "@a@bナナ「あら……？\n\tごめんなさい。\n\t主人と　かんちがいしちゃったわ。\n@c1@"
"80":
  de: "@aAdrian@bMänner kapieren's einfach nicht, oder? (Schluchz)\n@c1@"
  en: "@aAdrian@bGuys just don't get it, do they? (sob)\n@c1@"
  es: "@aAdriana@bLos hombres no entienden nada, ¿verdad? (snif)\n@c1@"
  fr: "@aAdrienne@bLes garçons ne comprennent vraiment rien, heinⓡ (sanglot)\n@c1@"
  it: "@aAdriana@bSigh! Ma perché gli uomini non capiscono niente, eh?! Sob!\n@c1@"
  ja: "@a@bナナ「けっきょく　男って\n\tなんにも　わかってないのよねぇ……。\n\tぷんぷん。\n@c1@"
"81":
  de: "@a@bDa ist ein Buch namens ⓞPioniria-Chronikenⓟ. %0%a00120 nimmt es vom Regal und liest einen Abschnitt daraus.\n@c0@"
  en: "@a@bThere's a book called ⓗChronicles of Pioniriaⓘ. %0%a00120 takes it from the shelf and reads\nan excerpt.\n@c0@"
  es: "@a@bHay un libro titulado ⓕLas Crónicas de Pioniriaⓖ. %0%a00120 lo coge de la estantería y lee un fragmento.\n@c0@"
  fr: "@a@bL'un des livres s'intitule ⓥChroniques de Pioniriaⓦ. %0%a00120 le prend sur l'étagère et en lit un passage.\n@c0@"
  it: "@a@bC'è un libro intitolato ⓕCronache di Castromercatumⓖ. %0%a00120 lo prende dallo scaffale e ne legge un brano...\n@c0@"
  ja: "@a@b「マーリブの伝説」と\n書かれた本がある。\n%a00120は　手にとって読んだ。\n@c0@"
"82":
  de: "@a@bⓞWenn die Stadt wieder zur Burg wird, wird sein Körper aus dem Gefäß im südöstlichen Raum wieder auferstehen.\n@c0@"
  en: "@a@bⓗWhen the town once more becomes a castle, his\nbody shall rise again from the pot in the south-western room.\n@c0@"
  es: "@a@bⓕCuando la ciudad sea de nuevo un castillo, su cuerpo volverá a través de la tinaja de la sala sudoriental.ⓖ\n@c0@"
  fr: "@a@bⓥLorsque la ville redeviendra un château, son corps s'élèvera de la jarre située dans la pièce du sud-est.\n@c0@"
  it: "@a@bⓕQuando la città tornerà a essere un castello, il suo corpo sorgerà nuovamente dalla giara che si trova nella sala sud-orientale.ⓖ\n@c0@"
  ja: "@a@b“この町が　城となれば　南西の部屋\n　つぼに　かこまれた　つぼに\n　その者の　カラダは　復活すべし。\n@c0@"
"83":
  de: "@a@bDann wird aus den Tiefen des Schlosses, aus den Tiefen einer Truhe voller Schmerzen, auch sein Herz wiederauferstehen.\n@c0@"
  en: "@a@bⓗThen, from the depths of the castle, from deep within a treasure chest filled with pain, his heart also shall rise.\n@c0@"
  es: "@a@bⓕDespués, en lo más recóndito del castillo, de las profundidades de un cofre del tesoro repleto de dolor, se elevará su corazón.ⓖ\n@c0@"
  fr: "@a@bPuis, des profondeurs du château, des profondeurs d'un coffre au trésor empli de douleur, son cœur s'élèvera lui aussi.\n@c0@"
  it: "@a@bⓕPoi sarà la volta del suo cuore, che emergerà dalle profondità del castello, dagli abissi di un forziere colmo di dolore.ⓖ\n@c0@"
  ja: "@a@b“そして　城のはるか地下　深く\n　痛みをともなう宝箱に\n　その者の　心は　復活するであろう。\n@c0@"
"84":
  de: "@a@bUnd schließlich der größte Schatz der Sultana von Pioniria... die Truhe vor dem Kerker... das Geschenk ihres geliebten Königs.ⓟ\n@c0@"
  en: "@a@bⓗAnd finally, the Sultana of Pioniria's most treasured possession...in a treasure chest locked in a cell...the gift of her beloved king.ⓘ\n@c0@"
  es: "@a@bⓕY finalmente, la posesión más codiciada de la Sultana de Pioniria... el cofre del tesoro en el exterior de la cárcel... el regalo de su amado rey.ⓖ\n@c0@"
  fr: "@a@bEt enfin, le bien le plus précieux de la sultane de Pioniria... le coffre au trésor à l'extérieur de la prison... le cadeau de son bien-aimé roi.ⓦ \n@c0@"
  it: "@a@bⓕInfine toccherà al tesoro più caro alla Sultana di Castromercatum. Fuori dalla prigione, lo scrigno donato dal suo amato sovrano...ⓖ\n@c0@"
  ja: "@a@b“そして　最後に　マーリブ王妃の宝物……\n　ろうやの先の　宝箱。\n　愛しい王の　おくりもの。\n@c0@"
"85":
  de: "@aKarl Oink@bTagchen, %H860%X%A120%XWandergesell%Z%B120%XWandergesellin%Z%YWandersleut'%Z. Mein Name ist Karl Oink und ich bin ein lustiger Musikant. Es tönen die Lieder!\n@c2@"
  en: "@aPrelvis Esley@bHowdy there, hound dog.\nI'm Prelvis Esley, an' I spend my days travellin' this little ol' world an' spreadin' the joy o' song.\n@c2@"
  es: "@aPrelvis Esley@bHola, bipapulula.\nMe llamo Prelvis Esley y recorro este viejo mundo difundiendo la alegría de la música, oh yeah.\n@c2@"
  fr: "@aGino Allaydi@bHé, salut %A120%Xfrangin%Z%B120%Xfrangine%Z.\nJe m'appelle Gino Allaydi et je voyage à travers le monde pour faire connaître la musique que j'aime.\n@c2@"
  it: "@aElvis Bresly@bCome va, mio amato pubblico? Sono Elvis Bresly, e giro il mondo per inebriare le folle adoranti con la mia musica.\n@c2@"
  ja: "@a@bガライ「ぼくは　ガライ。\n\t各地を　うたいながら　旅してる　\n\t吟遊詩人さ。\n@c2@"
"86":
  de: "@aKarl Oink@bEin Mann und eine Frau sollen irgendwo in einer großen Höhle auf Schatzsuche gegangen sein. Ja ja, Gold und Silber lieben alle sehr!\n@c2@"
  en: "@aPrelvis Esley@bI heard tell that some hard-headed woman an' her big hunk o' love done went in search o' pirate treasure in a big ol' cave somewhere.\n@c2@"
  es: "@aPrelvis Esley@bMe han contado que una nena peleona y su marchoso marido han emprendido la búsqueda de un tesoro pirata oculto en alguna cueva.\n@c2@"
  fr: "@aGino Allaydi@bJ'ai entendu dire qu'une femme et son mari étaient partis à la recherche d'un trésor pirate dans une caverne des environs.\n@c2@"
  it: "@aElvis Bresly@bHo saputo che una tipa e il suo tipo sono andati a cercare un tesoro dei pirati in una grotta da qualche parte. Stanno cercando... fama e fortuna!\n@c2@"
  ja: "@a@bガライ「ウワサでは　ある夫婦が\n\t海賊の宝をもとめて\n\t洞くつに　入ったらしいよ。\n@c2@"
"87":
  de: "@aKarl Oink@bWunder gibt es immer wieder, aber vielleicht sollten sie ihr Glück doch lieber in dieser Pionierstadt suchen.\n@c2@"
  en: "@aPrelvis Esley@bIf they done had a dream, an' they wanted to follow that dream, they coulda done worse than invest their hopes in this here beautiful boom town.\n@c2@"
  es: "@aPrelvis Esley@bSi tienen un sueño y quieren cumplirlo no habrían hecho mal en poner sus esperanzas en esta ciudad, yeah, yeah, oh yeah.\n@c2@"
  fr: "@aGino Allaydi@bL'aventure c'est l'aventure.\nIls ont eu bien raison de mettre tous leurs espoirs dans cette magnifique ville champignon.\n@c2@"
  it: "@aElvis Bresly@bSì, quei due hanno un sogno, e vogliono provare a realizzarlo qui, in questa fantastica città! Ti adoro, %a00260! Yeah, baby!\n@c2@"
  ja: "@a@bガライ「夢を追いかけるなら\n\tこの町の発展に　夢をたくすのも\n\tいいものだと思うけど。\n@c2@"
"88":
  de: "@a@b*: Ach, ach, ach. Ich hab dieses Herumwandern so satt.\n@c1@"
  en: "@a@b*: Oh me oh my, I'm tired of the wanderin' life.\n@c1@"
  es: "@a@b*: Buff, estoy cansada de viajar de un sitio a otro.\n@c1@"
  fr: "@a@b*ⓢ Oh, pauvre de moi. Je suis fatiguée de cette vie d'errance.\n@c1@"
  it: "@a@b*: Oh, non ne posso più di spostarmi da un paese all'altro!\n@c1@"
  ja: "@a@b＊「あ～あ　もう　さすらいの生活には\n\tつかれちゃったわ。\n@c1@"
"89":
  de: "@a@b*: Mein Mann hat mich hierhergeschleppt. Er wollte versuchen, den Piratenschatz zu finden.\n@c1@"
  en: "@a@b*: My husband brought me here, said he wanted to try and find the pirates' treasure.\n@c1@"
  es: "@a@b*: Mi marido me trajo aquí y me dijo que quería buscar un tesoro pirata.\n@c1@"
  fr: "@a@b*ⓢ Mon mari m'a conduite ici, en me disant qu'il voulait essayer de trouver le trésor des pirates.\n@c1@"
  it: "@a@b*: Mio marito ha voluto che ci trasferissimo qui perché vuole cercare un fantomatico ⓕtesoro dei piratiⓖ...\n@c1@"
  ja: "@a@b＊「うちの人が　海賊の宝を\n\t見てみたいって言うから\n\tこんなところまで　来たけど……。\n@c1@"
"90":
  de: "@a@b*: Gibt es hier nicht irgendwo eine Stadt, in der ich mich niederlassen und ein einfaches Leben führen kann?\n@c1@"
  en: "@a@b*: Ain't there a town somewhere I can settle down and live the simple life?\n@c1@"
  es: "@a@b*: ¿No existirá una ciudad en la que podamos establecernos y llevar una vida normal nomás?\n@c1@"
  fr: "@a@b*ⓢ N'y a-t-il pas une ville quelque part où je pourrais m'installer pour mener une vie simpleⓡ\n@c1@"
  it: "@a@b*: Quanto vorrei trovare un bel posto dove potermi stabilire e condurre un'esistenza tranquilla!\n@c1@"
  ja: "@a@b＊「どこか　おちついて生活のできる町は\n\tないかしらね～。\n@c1@"
"91":
  de: "@a@bMöchtest du ihr von Hank Hoffman Jr.s Pionierstadt erzählen?\n@c1@"
  en: "@a@bDo you want to tell her about Hank Hoffman Jr.'s frontier town?\n@c1@"
  es: "@a@b¿Deseas hablarle de la ciudad fronteriza de Juanchito?\n@c1@"
  fr: "@a@bVoulez-vous lui parler de la ville pionnière de Hank Hoffman Jrⓡ\n@c1@"
  it: "@a@bVuoi dirle della nuova città di frontiera fondata da John Dwayne Jr.?\n@c1@"
  ja: "@a@bこの人に\n%a00260　のことを\n教えてあげますか？\n@c1@"
"92":
  de: "@a@b*: %0%a00260? Wenn das eine Stadt mit Zukunft ist, könnte ich dort doch vielleicht einen Laden aufmachen...\n@c1@"
  en: "@a@b*: %0%a00260? If it's a town that's on the up-and-up, maybe I could open up a shop there...\n@c1@"
  es: "@a@b*: ¿%0%a00260? Si es una ciudad tan prometedora, quizás podría abrir una tiendita allí...\n@c1@"
  fr: "@a@b*ⓢ %0%a00260ⓡ\nSi c'est une ville en pleine construction, je pourrais peut-être y ouvrir un commerce...\n@c1@"
  it: "@a@b*: %0%a00260? Beh, se si tratta di una città in espansione, forse potrei aprirci un negozio...\n@c1@"
  ja: "@a@b＊「ふ～ん　%a00260？\n\tこれから発展する町なら　お店を\n\t仕事にするのも　いいかもね。\n@c1@"
"93":
  de: "@a@b*: Aber was würde mein Mann dazu sagen? Er ist dort hinuntergegangen, um zu sehen, was dort zu finden ist.\n@c1@"
  en: "@a@b*: But what would my husband say? He went down into the depths there to see what he could find.\n@c1@"
  es: "@a@b*: ¿Pero qué diría mi marido? Se ha adentrado en las profundidades de la cueva para ver qué encuentra.\n@c1@"
  fr: "@a@b*ⓢ Mais qu'en dirait mon mariⓡ Il s'est enfoncé là-dedans pour voir ce qu'il pouvait trouver.\n@c1@"
  it: "@a@b*: Ma cosa ne penserà mio marito? Glielo chiederei subito se potessi, ma è andato lì dentro per vedere se trovava qualcosa di interessante...\n@c1@"
  ja: "@a@b＊「でも　うちの人が　なんて言うかしら？\n\tさっき　ひとりで　奥へ\n\t行っちゃったのよ。\n@c1@"
"94":
  de: "@a@b*: Ich frage mich, wo er sich jetzt schon wieder reingeritten hat.\n@c1@"
  en: "@a@b*: I wonder where he's gone and got himself to now.\n@c1@"
  es: "@a@b*: Me pregunto dónde estará ahora y qué andará haciendo.\n@c1@"
  fr: "@a@b*ⓢ Je me demande bien où il est passé, à présent.\n@c1@"
  it: "@a@b*: Oh, chissà cosa sta facendo adesso! Speriamo che non si sia cacciato in qualche guaio...\n@c1@"
  ja: "@a@b＊「それにしても　うちの人ったら\n\tどこまで　行っちゃったのかしら……。\n@c1@"
"95":
  de: "@aFrieder Niete@bGuten Tag. Ich bin Frieder Niete. Ich hab hier unten beim Klang des Wasserfalls gesessen und ein bisschen nachgedacht.\n@c2@"
  en: "@aStreo Louse@bHowdy, I'm Streo Louse. I been sittin' down here\nin the sound o' this here waterfall an' havin' me a good ol' think.\n@c2@"
  es: "@aHortera y Casset@bHola, me llamo Hortera y Casset. Recién me senté aquí al sonido de esta cascada y empecé a pensar en mis circunstancias.\n@c2@"
  fr: "@aAmédée Carte@bSalut, j'm'appelle Amédée Carte. J'me suis assis là, isolé par le bruit de cette cascade, pour réfléchir sérieusement.\n@c2@"
  it: "@aProfessor Mente@bSalve! Io sono il Professor Mente. Sto osservando questa cascata, il cui incessante fluire stimola i processi logici del mio cervello.\n@c2@"
  ja: "@a@bソクラス「ぼくは　ソクラス。\n\t滝の音につつまれながら　ずっと\n\t考えていました。\n@c2@"
"96":
  de: "@aFrieder Niete@bIch hab drüber nachgedacht, was diese Piraten wohl sehen, wenn sie endlich den Schatz in die Hände kriegen, den sie gesucht haben.\n@c2@"
  en: "@aStreo Louse@bI been thinkin' on what them pirates must see when they finally git their hands on a treasure they done set out to look for.\n@c2@"
  es: "@aHortera y Casset@bPues estaba pensando qué verían los puros piratas cuando finalmente descubrieron el tesoro que con tanto anhelo buscaban.\n@c2@"
  fr: "@aAmédée Carte@bJe réfléchissais à ce que peuvent bien voir les pirates quand ils finissent par mettre la main sur un trésor qu'ils étaient partis chercher.\n@c2@"
  it: "@aProfessor Mente@bMi chiedevo quali pensieri attraversino la mente di un pirata quando, dopo incredibili peripezie, può finalmente mettere le mani su un tesoro a lungo agognato...\n@c2@"
  ja: "@a@bソクラス「宝をもとめて　旅をする海賊が\n\t宝を手に入れた先に　見るものは\n\tなんなのだろうかと。\n@c2@"
"97":
  de: "@a@bMöchtest du ihm von Hank Hoffman Jr.s Pionierstadt erzählen?\n@c2@"
  en: "@a@bDo you want to tell him about Hank Hoffman Jr.'s frontier town?\n@c2@"
  es: "@a@b¿Deseas hablarle de la ciudad fronteriza de Juanchito?\n@c2@"
  fr: "@a@bVoulez-vous lui parler de la ville pionnière de Hank Hoffman Jrⓡ\n@c2@"
  it: "@a@bVuoi dirgli della nuova città di frontiera fondata da John Dwayne Jr.?\n@c2@"
  ja: "@a@bこの人に\n%a00260　のことを\n教えてあげますか？\n@c2@"
"98":
  de: "@aFrieder Niete@bHmm. %0%a00260? Tja, wir sind auf unseren Reisen schon durch viele Orte gekommen, aber der war noch nicht dabei.\n@c2@"
  en: "@aStreo Louse@bHmm. %0%a00260, you say? Well, we visited a few places on our travels, but we ain't fetched up there yet.\n@c2@"
  es: "@aHortera y Casset@bMmm... ¿%0%a00260, eh? Pues sí que hemos visitado parajes en nuestros viajes pero ahí como que todavía no llegamos.\n@c2@"
  fr: "@aAmédée Carte@bMmm. %0%a00260, vous ditesⓡ\n㈡\nOn a visité bien des endroits au cours de nos voyages, mais on n'est encore jamais allés là-bas.\n@c2@"
  it: "@aProfessor Mente@b%H860%XHai%YAvete%Z detto %a00260? Beh, abbiamo toccato ogni angolo di mondo durante i nostri viaggi, ma lì non ci siamo ancora stati.\n@c2@"
  ja: "@a@bソクラス「ほう。\n\t%a00260　ですか。\n\tそこはまだ　行ったことがないですね。\n@c2@"
"99":
  de: "@aFrieder Niete@bVielen Dank! Wir werden uns gleich dorthin auf den Weg machen.\n@c2@"
  en: "@aStreo Louse@bThank you kindly, traveller. We'll head off\nright away.\n@c2@"
  es: "@aHortera y Casset@b%H860%XSe%YOs%Z lo agradezco, %H860%X%A120%Xviajero%Z%B120%Xviajera%Z%Y%R000%Xviajeras%Yviajeros%Z%Z. Ahorita mismo vamos para allá.\n@c2@"
  fr: "@aAmédée Carte@bUn grand merci, %H860%X%A120%Xvoyageur%Z%B120%Xvoyageuse%Z%Y%R000%Xvoyageuses%Yvoyageurs%Z%Z. On va se mettre en route sur le champ.\n@c2@"
  it: "@aProfessor Mente@b%H860%XTi%YVi%Z ringrazio per il suggerimento. Credo proprio che %a00260 sarà la nostra prossima tappa.\n@c2@"
  ja: "@a@bソクラス「ありがとう　旅の人。\n\tさっそく　妻と　出発しますよ。\n@c2@"
"100":
  de: "@aFrieder Niete@bMeine arme Frau. Sie will nichts als irgendwo ein Städtchen finden, in dem sie einen Laden aufmachen kann. Könnte ich ihr nur geben, was sie will...\n@c2@"
  en: "@aStreo Louse@bMy poor wife. All she wants is to find a little town somewhere she can set up a little shop. If only I could give her what she wants...\n@c2@"
  es: "@aHortera y Casset@bMi pobrecita esposa. Nomás anhela encontrar un pueblito para abrir una tienda. Si pudiera darle lo que tanto quiere...\n@c2@"
  fr: "@aAmédée Carte@bMa pauvre femme. Tout ce qu'elle souhaite, c'est trouver une p'tite ville où ouvrir une boutique.\nSi seulement j'pouvais lui offrir ce qu'elle veut...\n@c2@"
  it: "@aProfessor Mente@bLa mia cara moglie non cerca altro che un luogo tranquillo per vivere. Lì potrebbe aprire un negozietto... Ah, quanto vorrei accontentarla!\n@c2@"
  ja: "@a@bソクラス「妻は　どこかの町で\n\tお店を　やりたいと言ってるのです。\n\t希望をかなえてあげたいものですが……。\n@c2@"
"101":
  de: "@aFrieder Niete@bAber ich weiß es einfach nicht. Wahrscheinlich, weil ich selbst kein Pirat bin.\n@c2@"
  en: "@aStreo Louse@bI jes' don't know the answer. Guess it's 'cause I ain't a pirate myself.\n@c2@"
  es: "@aHortera y Casset@bPero nomás no sé la respuesta. Imagino pues que yo no soy un pirata entonces.\n@c2@"
  fr: "@aAmédée Carte@bMais j'connais pas la réponse. Je suppose que c'est parce que j'suis pas pirate moi-même.\n@c2@"
  it: "@aProfessor Mente@bOvviamente, non ne ho idea. Non sono mica un pirata, io.\n@c2@"
  ja: "@a@bソクラス「その答えは　わかりません。\n\tなぜなら　ぼくは　海賊ではないからです。\n@c2@"
"102":
  de: "@aFrieder Niete@bUnd ich habe überlegt, ob es einen Ort gibt, an dem meine Frau und ich uns niederlassen können. Ich hab sie durch die ganze Welt gezerrt, das arme Ding.\n@c2@"
  en: "@aStreo Louse@bAnyhow, I also been wonderin' if there ain't somewhere me and my lady wife can settle down.\nI been draggin' her every which way, poor thing.\n@c2@"
  es: "@aHortera y Casset@bTambién andaba pensando si no habría un lugar donde poder establecerme con mi señora.\n㈡\nLa pobre me tiene que andar siguiendo a todas partes.\n@c2@"
  fr: "@aAmédée Carte@bQuoi qu'il en soit, je m'demandais s'il n'y avait pas un endroit où on pourrait s'installer, ma femme et moi.\n㈡\nJe l'ai emmenée avec moi à peu près partout, la pauvre.\n@c2@"
  it: "@aProfessor Mente@bMi stavo anche chiedendo dove mia moglie e io potremmo stabilirci. Sono anni che giriamo senza sosta, e forse è giunta l'ora di fermarci da qualche parte.\n@c2@"
  ja: "@a@bソクラス「さて……　旅へ連れまわした妻に\n\tおちついた生活を　させてあげるには\n\tどこがいいものか……。\n@c2@"
