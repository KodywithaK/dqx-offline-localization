"0":
  de: "@a@b*: Ach, könnte ich doch auch heiraten. Da draußen muss doch irgendwo ein gutaussehender reicher Mann für mich herumlaufen.\n@c1@"
  en: "@a@b*: I wish I could get married. There must be a rich handsome man out there for me somewhere...\n@c1@"
  es: "@a@b*: Ojalá mi pudiera casar. En alguna parte diebe habier un hombre rico y apuesto para mí...\n@c1@"
  fr: "@a@b*ⓢ Si seulement je pouvais me marier. Je suis sûre qu'il existe un bel homme riche pour moi, quelque part...\n@c1@"
  it: "@a@b*: Ah, huanto vorrei sposarmi... Dev'esserci pure un omo ricco e bello che m'aspetta da qualche parte...\n@c1@"
  ja: "@a@b＊「あたしも　結婚したいな～。\n\tどこかに　かっこよくて\n\tお金持ちの男　いないかしら？\n@c1@"
"1":
  de: "@a@b*: Willkommen auf Burg Bruckstetten!\n@c2@"
  en: "@a@b*: Welcome to Ballymoral Castle.\n@c2@"
  es: "@a@b*: ¡%H860%X%A120%XBienvienido%Z%B120%XBienvienida%Z%Y%R000%XBienvienidas%YBienvienidos%Z%Z al Castillo de Alcazaba!\n@c2@"
  fr: "@a@b*ⓢ Bienvenue au château de Ballimoreⓠ\n@c2@"
  it: "@a@b*: Salve, %H860%Xviandante%Yviandanti%Z! Questo è il castello di Balmontone!\n@c2@"
  ja: "@a@b＊「ボンモールのお城に　ようこそ。\n@c2@"
"2":
  de: "@a@b*: Habt Ihr die Hochzeit in Endor gesehen? Ich wette, das ist 'ne mächtig große Sache.\n@c3@"
  en: "@a@b*: You seen the weddin' over in Endor?\nI'll bet it's a right grand ol' affair.\n@c3@"
  es: "@a@b*: ¿%H860%XHas%YHabéis%Z estiado en la boda que si cielebraba en Endor?\nSeguro que ha sido algo griande.\n@c3@"
  fr: "@a@b*ⓢ Z'avez vu le mariage là-bas, à Chandorⓡ\nJ'parie que c'était un truc sacrément impressionnant.\n@c3@"
  it: "@a@b*: Visto il matrimonio a Endor? Scommetto che hanno organizzato una roba di gran lusso!\n@c3@"
  ja: "@a@b＊「あんた　エンドールの結婚式は\n\tもう見たかい？\n\tきっと　ごうせいなんだろうな。\n@c3@"
"3":
  de: "@a@b*: Jetzt findet gerade Prinz Hinzens Hochzeitsfeier in Endor statt.\n@c2@"
  en: "@a@b*: Prince Regan's wedding ceremony is taking place over in Endor at the moment.\n@c2@"
  es: "@a@b*: La ceriemonia nupcial del Príncipe Alí si está cielebrando en estos momientos en Endor.\n@c2@"
  fr: "@a@b*ⓢ La cérémonie de mariage du prince Réginald se déroule en ce moment même à Chandor.\n@c2@"
  it: "@a@b*: In questo momento a Endor si stanno celebrando le nozze tra i'Pprincipe Vitellozzo e la Principessa Veronica.\n@c2@"
  ja: "@a@b＊「今ごろ　エンドールでは\n\tリック王子の結婚式が　盛大に\n\t開かれているのだろうな……。\n@c2@"
"4":
  de: "@a@b*: Der Prinz und König Kunz sind beide dort, darum ist es in der Burg gerade ziemlich ruhig.\n@c2@"
  en: "@a@b*: The Prince and King Shamus are both absent because of it, so the castle's feeling a bit quiet at the moment.\n@c2@"
  es: "@a@b*: El Príncipe y el sah Cha Cha se han ausientado, por lo que el castillo pariece un tanto vacío estos días.\n@c2@"
  fr: "@a@b*ⓢ Le roi Chamtu et le prince sont tous les deux absents pour cette raison. Le château est donc plutôt calme, en ce moment.\n@c2@"
  it: "@a@b*: I'Pprincipe e Re Torus so' assenti per questo motivo, huindi il castello l'è mezzo voto.\n@c2@"
  ja: "@a@b＊「王さまも　王子さまも\n\tエンドールに　おられるので\n\tこの城は　さみしいかぎりだ。\n@c2@"
"5":
  de: "@a@b*: Offenbar hat Prinz Hinz seine Hochzeit einem Waffenhändler zu verdanken.\n@c2@"
  en: "@a@b*: Apparently, it's thanks to a weapon trader that Prince Regan has been able to get married.\n@c2@"
  es: "@a@b*: Aparientemente, el Príncipe Alí ha consieguido casiarse gracias a un comierciante de armas.\n@c2@"
  fr: "@a@b*ⓢ Apparemment, c'est grâce à un marchand d'armes que le prince Réginald a pu se marier.\n@c2@"
  it: "@a@b*: A quanto pare, i'Pprincipe Vitellozzo è riuscito a sposarsi grazie all'aiuto d'un mercante d'armi.\n@c2@"
  ja: "@a@b＊「リック王子が　結婚できるのは\n\tなんでも　ひとりの武器商人の\n\tおかげなんだってさ。\n@c2@"
"6":
  de: "@a@b*: Keine Ahnung, was ein Waffenhändler und eine königliche Hochzeit miteinander zu tun haben, aber das habe ich jedenfalls so gehört.\n@c2@"
  en: "@a@b*: I've no idea what a weapon trader and a royal wedding have to do with each other, but that's what people are saying.\n@c2@"
  es: "@a@b*: No tiengo ni idea de qué tiene que ver un comierciante de armas con una boda real, pero es lo que la gente va diciendo.\n@c2@"
  fr: "@a@b*ⓢ Je ne vois vraiment pas ce qu'un marchand d'armes et un mariage royal peuvent avoir en commun, mais c'est ce que les gens racontent.\n@c2@"
  it: "@a@b*: 'Un so cosa c'entri un mercante d'armi con un matrimonio reale, ma 'ngiro si dice che le hose siano andate proprio hosì.\n@c2@"
  ja: "@a@b＊「王族の結婚と　武器商人に\n\tいったい　どういう関係が\n\tあるのかねえ？\n@c2@"
"7":
  de: "@a@b*: Die Ungeheuer werden stärker, darum kaufen viele Burgstädte jetzt Waffen und Rüstungen dazu.\n@c2@"
  en: "@a@b*: The monsters are becoming stronger now, so lots of castle towns are starting to buy up weapons and armour.\n@c2@"
  es: "@a@b*: Los monstruos si están haciendo fuertes y muchos rieinos han empeziado a acumular armas y armadiuras.\n@c2@"
  fr: "@a@b*ⓢ Les monstres deviennent plus forts, ces temps-ci. C'est pourquoi de nombreuses villes fortifiées commencent à acheter des armes et des armures.\n@c2@"
  it: "@a@b*: I mostri stanno diventando più forti, huindi tante città stanno iniziando a fa' incetta d'armi e armature.\n@c2@"
  ja: "@a@b＊「最近　怪物たちも強くなって\n\tそのため　多くのお城では\n\t武器　防具を買い集めているようです。\n@c2@"
"8":
  de: "@a@b*: Mir macht es jedoch Sorgen, dass unsere menschlichen Waffen und Rüstungen gegen manche dieser Kreaturen nichts ausrichten können.\n@c2@"
  en: "@a@b*: What worries me is that our human weapons and armour won't be able to stand up to some of these fiends.\n@c2@"
  es: "@a@b*: Lo que más mi prieocupa es que con nuestras armas y armaduras humanas no podriemos hacer friente a muchos de esos sieres diabólicos.\n@c2@"
  fr: "@a@b*ⓢ Ce qui m'inquiète, c'est que nos armes et armures humaines ne seront pas assez solides contre certains de ces ennemis.\n@c2@"
  it: "@a@b*: Ciò che mi preoccupa è che l'armi e l'armature umane 'un riusciranno a resiste' all'attacchi di huesti demoni...\n@c2@"
  ja: "@a@b＊「しかし　邪悪な怪物を相手に\n\t普通の武器　防具が\n\tどこまで役に立つことやら……。\n@c2@"
"9":
  de: "@a@b*: Meine Rüstungen sind ausverkauft, seit die Ungeheuer aufgetaucht sind.\n㈡\n*: Ich hab meinen Laden sogar schon eine Weile dichtmachen müssen.\n@c2@"
  en: "@a@b*: I sold out of armour when those monsters started appearing. I even had to shut up shop for a while.\n@c2@"
  es: "@a@b*: Cuando apariecieron esos monstruos vendí todas las armiaduras. Incluso tiuve que cerrar la tienda duriante un tiempo.\n@c2@"
  fr: "@a@b*ⓢ J'ai vendu toutes mes armures quand ces monstres ont commencé à apparaître.\nJ'ai même dû fermer boutique quelque temps.\n@c2@"
  it: "@a@b*: Dopo la homparsa di quei mostri, ho finito tutte l'armature. Ho dovuto persino chiude' bottega per un periodo!\n@c2@"
  ja: "@a@b＊「怪物たちが　現れてから\n\t防具が　売り切れちまって\n\tしばらく　店を閉めてたんです。\n@c2@"
"10":
  de: "@a@b*: Jetzt bekomme ich endlich wieder Lieferungen aus Endor, also konnte ich meinen Laden öffnen.\n@c2@"
  en: "@a@b*: I'm finally starting to get in supplies now from Endor, so I can start trading again.\n@c2@"
  es: "@a@b*: Pariece que ahora vuelvo a riecibir suministros desde Endor, para pioder continuar mi negocio.\n@c2@"
  fr: "@a@b*ⓢ Je commence enfin à être réapprovisionné par Chandor, je peux donc reprendre mon commerce.\n@c2@"
  it: "@a@b*: Finalmente mi stanno arrivando rifornimenti da Endor, così posso ricomincia' a vende'.\n@c2@"
  ja: "@a@b＊「エンドールからの　仕入れで\n\tようやく　商売が\n\t再開できるようになりましたよ。\n@c2@"
"11":
  de: "@a@b*: Entschuldigt bitte. Es wäre sehr lieb, wenn Ihr die Sachen anderer Leute nicht kaputtmachen würdet.\n@c2@"
  en: "@a@b*: If ye'll excuse me, %A120%Xsir%Z%B120%Xma'am%Z. I'd ask ye not to go banjaxin' other people's property if ye don't mind.\n@c2@"
  es: "@a@b*: %H860%XPierdone%YPierdonen%Z, %H860%X%A120%Xamigo%Z%B120%Xamiga%Z%Y%R000%Xamigas%Yamigos%Z%Z. Si no %H860%Xle%Yles%Z importa, prieferiría que no si %H860%Xcargase%Ycargasen%Z las posiesiones de otras persionas.\n@c2@"
  fr: "@a@b*ⓢ Excusez-moi, %A120%XMonsieur%Z%B120%XMadame%Z, mais j'aimerais autant que vous démolissiez pas ce qui vous appartient pas, si ça vous dérange pas.\n@c2@"
  it: "@a@b*: %H860%XScusa%YScusate%Z, ma che maniere sono queste?! 'Un si va a giro a rompe' le hose dell'altri, eh!\n@c2@"
  ja: "@a@b＊「お客さん……\n\tあんまり　ひとの家のモノ\n\tこわさないでくださいよ。\n@c2@"
"12":
  de: "@a@b*: Prinzessin Veronica von Endor ist schön wie ein Engel.\n@c2@"
  en: "@a@b*: Princess Veronica of Endor is as beautiful as an angel.\n@c2@"
  es: "@a@b*: La Princiesa Verónica de Endor es tan bella como los ángeles.\n@c2@"
  fr: "@a@b*ⓢ La princesse Véronica de Chandor est belle comme un ange.\n@c2@"
  it: "@a@b*: La Principessa Veronica di Endor è bella come un angelo.\n@c2@"
  ja: "@a@b＊「エンドールの　モニカ姫は\n\t天女のように　美しいらしい。\n@c2@"
"13":
  de: "@a@b*: Ach, bei Engeln fällt mir ein, in Casabranca im Osten gibt es eine Legende von einem Engel.\n@c2@"
  en: "@a@b*: Talking of angels, they have a legend about one over at Casabranca, a long way east from here.\n@c2@"
  es: "@a@b*: Habliando de ángeles, en Casablanca, una zona muy liejana al oriente de aquí, circula una leyenda sobrie uno.\n@c2@"
  fr: "@a@b*ⓢ En parlant d'ange, on raconte une légende à Casabranca, loin à l'est d'ici.\n@c2@"
  it: "@a@b*: A proposito d'angeli! A Casabianca, un posto lontano che si trova a est di huì, si narra la leggenda della donna angelo.\n@c2@"
  ja: "@a@b＊「天女といえば\n\tはるか東の国　ブランカに\n\tこんな言い伝えがあるそうですね。\n@c2@"
"14":
  de: "@a@b*: Dieser Engel soll aus dem Himmel gekommen sein und sich in einen Holzfäller verliebt haben. Sie bekamen ein Kind.\n@c2@"
  en: "@a@b*: Apparently, this angel came down from the sky and fell in love with a woodcutter. She became pregnant with his baby.\n@c2@"
  es: "@a@b*: Pariece que un ángel bajó del cielo y se eniamoró de un lieñador. Si quiedó encinta y tuvo %A090%Xun hijo suyo%Z%B090%Xuna hija suya%Z.\n@c2@"
  fr: "@a@b*ⓢ Apparemment, un ange, une femme arrivée du ciel, serait tombée amoureuse d'un bûcheron et ils auraient eu un enfant ensemble.\n@c2@"
  it: "@a@b*: A quanto pare, huesta donna angelo scese giù dal cielo e si innamorò d'un taglialegna. Da quell'amore nacque %A090%Xun cittino%Z%B090%Xuna cittina%Z.\n@c2@"
  ja: "@a@b＊「天空より舞いおりた天女が\n\t木こりの若者と恋に落ち\n\tやがて　身ごもったとか。\n@c2@"
"15":
  de: "@a@b*: Stellt Euch nur vor, was das für ein Kind sein müsste, wenn an der Geschichte etwas dran wäre!\n@c2@"
  en: "@a@b*: Imagine what the child would be like if that were a true story!\n@c2@"
  es: "@a@b*: ¡Imagina cómo sería %A090%Xel niñio%Z%B090%Xla niñia%Z si la historia fuera cierta!\n@c2@"
  fr: "@a@b*ⓢ Imaginez un peu à quoi ressemblerait l'enfant si c'était une histoire vraieⓠ\n@c2@"
  it: "@a@b*: Se huesta storia fosse vera, 'unn oso nemmeno immagina' che aspetto potesse ave' %A090%Xun bimbo nato%Z%B090%Xuna bimba nata%Z da una relazione del genere!\n@c2@"
  ja: "@a@b＊「もし　それが本当なら\n\tその子供は\n\tどうなったんでしょうね？\n@c2@"
"16":
  de: "@a@b*: Eine Weile habe ich vergeblich versucht, eine Rüstung zu ergattern, aber jetzt habe ich eine.\n@c2@"
  en: "@a@b*: I was desperately trying to get hold of armour for a while, but I'm all set now.\n@c2@"
  es: "@a@b*: Diurante un tiempo busqué desespieradamente una armadura, pero ya no la neciesito.\n@c2@"
  fr: "@a@b*ⓢ Cela faisait un moment que j'essayais désespérément de mettre la main sur une armure, mais le problème est réglé, à présent.\n@c2@"
  it: "@a@b*: 'Un %H860%Xsai%Ysapete%Z huanto ho penato per ave' dell'armature, ma ora sono a posto.\n@c2@"
  ja: "@a@b＊「かつて　ここでは\n\t防具を　必死に買い集めていたが\n\tその必要もなくなったのじゃ。\n@c2@"
"17":
  de: "@a@b*: Alles, was ich brauche, kann ich aus Endor beziehen. Eine Sorge weniger, das kann ich Euch sagen!\n@c2@"
  en: "@a@b*: I can get whatever I need from Endor.\nIt's quite a relief, I can tell you!\n@c2@"
  es: "@a@b*: En Endor puedo conseguir tiodo lo que neciesito.\n%H860%XTi%YOs%Z puedo asiegurar que es un grian alivio.\n@c2@"
  fr: "@a@b*ⓢ Je peux obtenir tout ce que je veux depuis Chandor. C'est un vrai soulagement, croyez-moiⓠ\n@c2@"
  it: "@a@b*: Da Endor posso riceve' qualsiasi hosa.\nUn bel sollievo, devo dire!\n@c2@"
  ja: "@a@b＊「これからは　エンドールから\n\tいくらでも防具を　輸入できる！\n\tやれ　良かったわい。\n@c2@"
"18":
  de: "@a@b*: Seine Majestät wohnt der Hochzeit von Prinz Hinz bei. Vielleicht solltet Ihr ein andermal wiederkommen.\n@c2@"
  en: "@a@b*: His Majesty is attending Prince Regan's wedding. Perhaps you could come back another time.\n@c2@"
  es: "@a@b*: Su Majestad si encuentra en la boda del Príncipe Alí. Quizás %H860%Xpodría%Ypodrían%Z volvier en otria ocasión.\n@c2@"
  fr: "@a@b*ⓢ Sa Majesté assiste au mariage du prince Réginald. Vous pourriez peut-être revenir une autre foisⓡ\n@c2@"
  it: "@a@b*: Sua Maestà sta partecipando a i'mmatrimonio de i'Pprincipe Vitellozzo. %H860%XTi%YVi%Z honsiglio di torna' un'altra volta.\n@c2@"
  ja: "@a@b＊「王さまは　リック王子さまの\n\t結婚式に出ておられる。\n\tまた　日をあらためて来るがよい。\n@c2@"
"19":
  de: "@a@b*: Ich habe Prinz Hinz ja praktisch aufgezogen, wisst Ihr.\n@c1@"
  en: "@a@b*: I practically raised Prince Regan, you know.\n@c1@"
  es: "@a@b*: Prácticamiente fui yo quién educó al Príncipie Alí.\n@c1@"
  fr: "@a@b*ⓢ Dans les faits, c'est moi qui ai élevé le prince Réginald, vous savez.\n@c1@"
  it: "@a@b*: I'Pprincipe Vitellozzo l'ho pratihamente cresciuto io.\n@c1@"
  ja: "@a@b＊「リック王子さまは\n\tわたしが　お育てしたんです。\n@c1@"
"20":
  de: "@a@b*: Ich hoffe, er wird mal ein weiser und wahrer Monarch.\n@c1@"
  en: "@a@b*: I do hope he'll become a wise and true king.\n@c1@"
  es: "@a@b*: Solo espiero que si convierta en un rey justo y sabio.\n@c1@"
  fr: "@a@b*ⓢ J'espère sincèrement qu'il deviendra un roi juste et sage.\n@c1@"
  it: "@a@b*: Spero diventi un sovrano saggio e leale verso il su' popolo.\n@c1@"
  ja: "@a@b＊「どうか　りっぱな王さまに\n\tならせられますように……。\n@c1@"
"21":
  de: "@a@b*: Dies ist das Gefängnis von Bruckstetten.\n@c2@"
  en: "@a@b*: This is Ballymoral jail. If you don't want to be put behind bars, I suggest you go elsewhere.\n@c2@"
  es: "@a@b*: Esta es la cárciel de Alcazaba. Si no %H860%Xquieres%Yqueriéis%Z acabiar entre riejas, %H860%Xti%Yos%Z sugiero que%H860%X ti marchies%Y os marchiéis%Z a otra parte.\n@c2@"
  fr: "@a@b*ⓢ Ceci est la prison de Ballimore. Si vous ne voulez pas vous retrouver de l'autre côté des barreaux, je vous conseille d'aller voir ailleurs.\n@c2@"
  it: "@a@b*: Questo è il carcere di Balmontone. Se non %H860%Xvuoi%Yvolete%Z fini' 'ncella, %H860%Xfarai%Yfarete%Z meglio a gira' al largo.\n@c2@"
  ja: "@a@b＊「ここは　牢獄。\n\t牢屋に入れられたくなければ\n\t出てゆくがよい。\n@c2@"
"22":
  de: "@a@b*: Mann! Ist das laaangweilig im Kittchen!\n@c2@"
  en: "@a@b*: Oh! Bein' in jail is just so boooring!\n@c2@"
  es: "@a@b*: ¡Ah! ¡Qué aburrido es esto de estar en la cárciel!\n@c2@"
  fr: "@a@b*ⓢ Pfffⓠ On s'ennuie teeeeellement en prisonⓠ\n@c2@"
  it: "@a@b*: Oh! La prigione è una noia mortaaaaale!\n@c2@"
  ja: "@a@b＊「ふぁ～……牢屋くらしは\n\tたいくつで　しょうがねえや！\n@c2@"
"23":
  de: "@a@b*: Hah, wie es wohl dem ollen Lutz Langfinger geht? Der war mal ein Kumpel von mir, damals, wo ich noch geklaut habe.\n@c2@"
  en: "@a@b*: Eh, I wonder 'ow old Kirk Buzzer's doin'.\nHe was a mate o' mine back in me thievin' days.\n@c2@"
  es: "@a@b*: Mi pregunto que será del bueno de Rob A. Conventos.\nFue compañiero mío en mi época de malieante.\n@c2@"
  fr: "@a@b*ⓢ Hé, j'me d'mande ce que devient ce bon vieux Arsène Lutrin. C'était un copain à moi, du temps où j'étais voleur.\n@c2@"
  it: "@a@b*: Eh, chissà come se la passa il buon vecchio Lester Fant.\nEravano amici, o meglio, colleghi!\n@c2@"
  ja: "@a@b＊「そういえば　ドロボウ時代に\n\t相棒だったバコタのヤツ……\n\t今ごろ　どうしてっかなあ？\n@c2@"
"24":
  de: "@a@b*: Es ist verboten, die Burg bei Nacht zu betreten.\n@c2@"
  en: "@a@b*: You're not permitted to enter the castle at this hour!\n@c2@"
  es: "@a@b*: Está prohibido entrar de nochie en el castillo.\n@c2@"
  fr: "@a@b*ⓢ Interdiction d'entrer dans le château la nuit.\n@c2@"
  it: "@a@b*: Di notte 'un si pole entra' ne i'ccastello.\n@c2@"
  ja: "@a@b＊「このような　夜ふけに\n\tお城に入ること　まかりならん！\n@c2@"
"25":
  de: "@a@b*: Komm morgen früh wieder, wenn es hell ist und wir dich im Auge behalten können.\n@c2@"
  en: "@a@b*: You should come back again in the daytime.\n@c2@"
  es: "@a@b*: %H860%XVuelve%YVolved%Z por la mañana diespués de salir el sol para que podiamos vigiliar%H860%Xte%Yos%Z.\n@c2@"
  fr: "@a@b*ⓢ Revenez demain matin. Il fera jour et on pourra vous avoir à l'œil.\n@c2@"
  it: "@a@b*: %H860%XTorna%YTornate%Z domattina, huando con la luce potremo %H860%Xtenerti%Ytenervi%Z d'occhio facilmente.\n@c2@"
  ja: "@a@b＊「また　明日\n\t出直してくるが　よろしかろう。\n@c2@"
"26":
  de: "@a@b*: Prinz Hinz ist nachts offenbar oft allein hier spazieren gegangen.\n@c1@"
  en: "@a@b*: Prince Regan often used to walk alone here at night, apparently.\n@c1@"
  es: "@a@b*: Pariece que, por las noches, el Príncipe Alí solía deambiular por aquí.\n@c1@"
  fr: "@a@b*ⓢ Le prince Réginald avait souvent l'habitude de se promener par ici la nuit, il paraît.\n@c1@"
  it: "@a@b*: A quanto pare, di notte il Principe Vitellozzo spesso passeggiava da queste parti da solo.\n@c1@"
  ja: "@a@b＊「リック王子さまって　夜になると\n\tひとりで　この辺りを\n\t散策していたんですって。\n@c1@"
"27":
  de: "@a@b*: Ach Mann, bin ich eine Transuse!\nDie Chance meines Lebens ⓚⓛ verpasst! Jetzt ist es zu spät, ihm näher zu kommen.\n@c1@"
  en: "@a@b*: What a fool I am!\nI missed my chance to get close to him.\n@c1@"
  es: "@a@b*: ¡Qué tionta soy!\nPierdí mi oportiunidad de aciercarme a él, sí.\n@c1@"
  fr: "@a@b*ⓢ Quelle idiote je faisⓠ\nJ'ai raté l'occasion de me rapprocher de lui.\n@c1@"
  it: "@a@b*: Che sciocca sono stata... Ho perso l'occasione di avvicinarlo!\n@c1@"
  ja: "@a@b＊「失敗したわ～。\n\t王子さまと　お近づきになる\n\t絶好のチャンスだったのに！\n@c1@"
"28":
  de: "@a@b*: Ha-püh... Ha-püh... Gold... Gold... Gold... Mehr Monster... Mehr Rüstungen... Ha-püh...\n@c2@"
  en: "@a@b*: Ah-phew... Ah-phew... Gold...gold...gold...\nMore monsterzzz... More armour... Ah-phew...\n@c2@"
  es: "@a@b*: Ah-fiuu... Ah-fiuu... Oro... oro... oro...\nMás monstruozzz... Más armaduras... Ah-fiuu...\n@c2@"
  fr: "@a@b*ⓢ Ron-pfff... ron-pfff... de l'or... de l'or... plus de monstres... plus d'armures... ron-pfff...\n@c2@"
  it: "@a@b*: Ronf... Ronf... Oro... Oro... Oro...\nAltri mostri... Altre armature... Ronf...\n@c2@"
  ja: "@a@b＊「むにゃむにゃ……。\n\t怪物のおかげで　防具が\n\t売れて　売れて……ぬふふふ。\n@c2@"
"29":
  de: "@a@b*: Zivilisten haben nur tagsüber Zutritt zur Burg. Geh jetzt und komm morgen früh wieder!\n@c2@"
  en: "@a@b*: I can't allow you inside the castle at night. Come back in the morning.\n@c2@"
  es: "@a@b*: Los civilies solo pueden entrar al castillo de día. ¡Largo de aquí! ¡%H860%XVuelve%YVolved%Z por la mañiana!\n@c2@"
  fr: "@a@b*ⓢ Les civils ne sont admis dans le château que de jour. Circulez et revenez demain matinⓠ\n@c2@"
  it: "@a@b*: L'accesso a i'ccastello è consentito a' civili solo durante i'ggiorno. %H860%XVa'%YAndate%Z via e %H860%Xtorna%Ytornate%Z domattina!\n@c2@"
  ja: "@a@b＊「夜の間　城内への立ち入りは\n\t禁じられておる。\n\tまた　明日　来るがよい。\n@c2@"
"30":
  de: "@a@b*: Willkommen in Lakanaba!\n@c2@"
  en: "@a@b*: Welcome to Lakanaba!\n@c2@"
  es: "@a@b*: ¡%H860%X%A120%XBienvenido%Z%B120%XBienvenida%Z%Y%R000%XBienvenidas%YBienvenidos%Z%Z a Lakanaba!\n@c2@"
  fr: "@a@b*ⓢ Bienvenue à Lakanabaⓠ\n@c2@"
  it: "@a@b*: Benvenuto a Lacanata!\n@c2@"
  ja: "@a@b＊「レイクナバの町に　ようこそ！\n@c2@"
"31":
  de: "@a@b*: Oh, du bist's, Talun. Die Leute halten mich noch für verrückt, wenn ich dich wie einen Fremden begrüße.\n@c2@"
  en: "@a@b*: Oh, 'tis you, Taloon.\nThey'll be sayin' I'm gone in the head welcomin' ye like some kind o' stranger, so they will.\n@c2@"
  es: "@a@b*: ¡Ah!, eres tú, Taloon. Van a diecir que mi he vuelto chialado por saludarte como si fueses algún extriaño.\n@c2@"
  fr: "@a@b*ⓢ Ah, c'est toi, Taloon. Ils vont tous dire que je suis en train de perdre la boule si je t'accueille comme un client.\n@c2@"
  it: "@a@b*: Toh! Ma sei te, Baldo! 'Un t'avevo rihonosciuto...\n㈡\n*: Scommetto che ora hominceranno a di' che ho perso hualche rotella, a prenderti per un forestiero!\n@c2@"
  ja: "@a@b＊「あれ？　なんだ　トルネコかぁ。\n\tようこそなんて言って\n\t損しちゃったなあ。\n@c2@"
"32":
  de: "@a@b*: Na, wenn das nicht der olle Torneko höchstpersönlich ist! Siehst gut aus. Hab dich fast nicht erkannt!\n@c2@"
  en: "@a@b*: Well, if it isn't yerself, Torneko!\nYe're lookin' grand. I could hardly recognise ye.\n@c2@"
  es: "@a@b*: ¡Que mi aspien si no es el viejo Torneko en piersona!\nEstiás estupiendo. Casi no ti había rieconocido.\n@c2@"
  fr: "@a@b*ⓢ Tiens, mais c'est vous, Tornekoⓠ\nVous avez l'air en pleine forme.\nJ'ai eu du mal à vous reconnaître.\n@c2@"
  it: "@a@b*: Toh! Guarda un po' chi si rivede... Baldo! Sei 'ngran forma! Huasi 'un ti rihonoscevo!\n@c2@"
  ja: "@a@b＊「やあ　トルネコさんじゃないか！\n\tりっぱになったなあ。\n\tすっかり　見ちがえたよ。\n@c2@"
"33":
  de: "@aDer Alte Hans@bDank Du-weißt-schon-wem hat mein Sohn endlich angefangen, sich seinen Lebensunterhalt ehrlich zu verdienen.\n@c2@"
  en: "@aOld Man Finn@bMe son's started makin' an honest livin' fer himself, thanks to you-know-who.\n@c2@"
  es: "@aViejo Bin@bMi hijo ha empiezado a ganiarse la vida de forma honiesta, gracias a quien ya sabiemos.\n@c2@"
  fr: "@aFlinn l'Ancien@bMon fils a commencé à gagner honnêtement sa vie, grâce à vous-savez-qui.\n@c2@"
  it: "@aIl vecchio Santino@bIl mi' figliolo l'è diventato un omo onesto. E lo so' io chi c'ho da ringrazia'!\n@c2@"
  ja: "@a@bトム「ある人の　おかげでのう\n\t息子も　まじめに働くように\n\tなったのじゃ。\n@c2@"
"34":
  de: "@aDer Alte Hans@bAh, Torneko! Die Dankbarkeit verknotet mir die Zunge, nein, ernsthaft. Mir fehlen die Worte.\n@c2@"
  en: "@aOld Man Finn@bAh, Torneko! I still can't thank y'enough, I can't. I've no words for it.\n@c2@"
  es: "@aViejo Bin@b¡Ah, Torneko! No sé cómo puedo agradiecértelo. No tiengo pialabras siuficientes.\n@c2@"
  fr: "@aFlinn l'Ancien@bAh, Tornekoⓠ Je ne te remercierai jamais assez, vraiment. Je ne trouve pas les mots...\n@c2@"
  it: "@aIl vecchio Santino@bAh, Baldo! 'Un smetterò mai di ringraziarti. 'Un c'ho parole pe' esprimerti la mi' rihonoscenza!\n@c2@"
  ja: "@a@bトム「おお！　トルネコ！\n\tあんたには　ほんとに\n\tなんと　お礼を言ってよいやら……。\n@c2@"
"35":
  de: "@aDer Alte Hans@bMein Sohn ist jetzt verheiratet, mit allem Drum und Dran. Hoffentlich kann ich bald ein Enkelchen auf den Knien schaukeln! Ein kleines Hänschenchen!\n@c2@"
  en: "@aOld Man Finn@bMe son's married an' ev'rytin' now.\nI can't wait fer a grandchild, so I can't.\nFinneganegan, we'll have to call the little one!\n@c2@"
  es: "@aViejo Bin@bMi hijo si ha casiado y tiodo.\nEstoy disieando tiener nietos, qué ilusión.\n¡Bin Ben Ben tiendremos que llamar al rietoño!\n@c2@"
  fr: "@aFlinn l'Ancien@bMon fils est marié et tout, maintenant.\nJ'ai hâte d'être grand-père.\nEt on l'appellera Flinn le Nouveauⓠ\n@c2@"
  it: "@aIl vecchio Santino@bIl mi' figliolo ora ha messo la testa a posto e s'è sposato.\n㈡\n'Un vedo l'ora d'ave' un nipotino.\nLo chiameremo Ducciolo! Sarà il... cucciolo di casa!\nAh! Ah! Ah!\n@c2@"
  ja: "@a@bトム「息子は　まじめに働くし\n\t結婚までしてのう。\n\t孫の顔が　楽しみじゃわい。\n@c2@"
"36":
  de: "@aDer Alte Hans@bHe! Was soll das?! Wohin %H860%Xbringst du%Ybringt ihr%Z mich?\n@c2@"
  en: "@aOld Man Finn@bNow just what d'ye think ye're doin'?\nWhere are ye takin' me?\n@c2@"
  es: "@aViejo Bin@b¿Qué %H860%Xcriees que estiás haciendo?%Ycrieeis que estiáis haciendo?%Z \n¿A diónde mi %H860%Xllevas%Ylleváis%Z?\n@c2@"
  fr: "@aFlinn l'Ancien@bMais enfin, qu'est-ce que %O965%Xtu fabriques%Yvous fabriquez%Zⓡ\nOù est-ce que %O965%Xtu m'emmènes%Yvous m'emmenez%Zⓡ\n@c2@"
  it: "@aIl vecchio Santino@bMa che %H860%Xstai%Ystate%Z facendo?! Dove mi %H860%Xstai%Ystate%Z portando?\n@c2@"
  ja: "@a@bトム「これこれ　このわしを\n\tどこへ連れていこうというのじゃ！\n@c2@"
"37":
  de: "@a@b*: Wuff, wuff! Wuff, wuff!\n@c2@"
  en: "@a@b*: Woof, woof! Woof, woof!\n@c2@"
  es: "@a@b*: ¡Guau, guau! ¡Guau, guau!\n@c2@"
  fr: "@a@b*ⓢ Ouaf, ouafⓠ Ouaf, ouafⓠ\n@c2@"
  it: "@a@b*: Bau, bau! Bau, bau!\n@c2@"
  ja: "@a@b＊「わんわんわん！\n@c2@"
"38":
  de: "@a@b*: Wuff, wuff! Wuff, wuff!\n@c2@"
  en: "@a@b*: Woof, woof! Woof, woof!\n@c2@"
  es: "@a@b*: ¡Guau, guau! ¡Guau, guau!\n@c2@"
  fr: "@a@b*ⓢ Ouaf, ouafⓠ Ouaf, ouafⓠ\n@c2@"
  it: "@a@b*: Bau, bau! Bau, bau!\n@c2@"
  ja: "@a@b＊「わんわんわん！\n@c2@"
"39":
  de: "@a@b*: Wuff, wuff! Wuff, wuff!\n@c2@"
  en: "@a@b*: Woof, woof! Woof, woof!\n@c2@"
  es: "@a@b*: ¡Guau, guau! ¡Guau, guau!\n@c2@"
  fr: "@a@b*ⓢ Ouaf, ouafⓠ Ouaf, ouafⓠ\n@c2@"
  it: "@a@b*: Bau, bau! Bau, bau!\n@c2@"
  ja: "@a@b＊「わんわんわん！\n@c2@"
"40":
  de: "@a@b*: Unser Mann aus Lakanaba hier ist jetzt berühmt, wisst Ihr. Der erfolgreichste Kaufmann der ganzen Welt, sagen die Leute.\n@c3@"
  en: "@a@b*: Our man here from Lakanaba is famous now, ye know. The most successful merchant in all the world, that's what they're sayin'.\n@c3@"
  es: "@a@b*: Un amigo de Lakanaba si ha hecho fiamoso... El miercader más próspiero de tiodo el mundo, es lo que dicen de él.\n@c3@"
  fr: "@a@b*ⓢ Cet homme, originaire de Lakanaba, est célèbre maintenant. Le marchand le plus talentueux au monde, à ce qu'on dit.\n@c3@"
  it: "@a@b*: I'nnostro honcittadino di Lacanata l'è diventato famoso. L'è i'ppiù grande mercante de i'mmondo!\n@c3@"
  ja: "@a@b＊「この町出身の　商人で\n\tたいそう　出世した男が\n\tいるそうだな。\n@c3@"
"41":
  de: "@a@b*: Ich vergesse bloß dauernd seinen Namen. Hieß er nicht so was wie Deko-Salon? Oder Tonno mit Huhn...? \n@c3@"
  en: "@a@b*: I just can't recall his name.\nTall Buffoon, was it...?\nOr Gecko Tycoon, perhaps...?\n@c3@"
  es: "@a@b*: Solo que no riecuerdo su nombre.\n¿Si lliamaba Torcuato Balloon...?\n¿O era Tiornado Ataúd...?\n@c3@"
  fr: "@a@b*ⓢ Mais je n'arrive pas à me rappeler son nom. Thor Saloon, c'est ça...ⓡ\nOu Nico Boboon, peut-être...ⓡ\n@c3@"
  it: "@a@b*: 'Un mi ricordo il su' nome però. Brindo Buzzurro, forse...? Oppure Bracco Bifolco...?\n@c3@"
  ja: "@a@b＊「名前は　たしか　トラネコ……\n\tありゃ？　トネリコだったかな？\n@c3@"
"42":
  de: "@a@b*: Na so was! Reisende sieht man hier nicht jeden Tag, wisst Ihr.\n@c2@"
  en: "@a@b*: Well! 'Tis not every day we see %H860%Xa trav'ller%Ytrav'llers%Z in these parts.\n@c2@"
  es: "@a@b*: ¡En fin! No tiodos los días viemos %H860%X%A120%Xun viajiero%Z%B120%Xuna viajiera%Z%Y%R000%Xviajieras%Yviajieros%Z%Z por estos lares.\n@c2@"
  fr: "@a@b*ⓢ Eh bienⓠ Ça n'est pas souvent que l'on voit %H860%X%A120%Xun voyageur%Z%B120%Xune voyageuse%Z%Y%R000%Xdes voyageuses%Ydes voyageurs%Z%Z, dans le coin.\n@c2@"
  it: "@a@b*: Bene bene. 'Un si vedono molti viaggiatori da queste parti!\n@c2@"
  ja: "@a@b＊「おや？\n\t旅の人とは　めずらしい。\n@c2@"
"43":
  de: "@a@b*: Ihr müsst ja ganz schön neugierig sein, wenn Ihr den weiten Weg bis zu unserem kleinen Lakanaba gekommen seid.\n@c2@"
  en: "@a@b*: Ye must have a woeful curious nature with ye to be comin' all the way up the boreen to a tiny place like Lakanaba.\n@c2@"
  es: "@a@b*: %H860%XDiebes%YDiebéis%Z tiener una natiuraleza muy inquieta para habier viajado tiodo este trayiecto hasta un sitio tan liejano y diminuto como Lakanaba.\n@c2@"
  fr: "@a@b*ⓢ Vous devez être d'une nature drôlement curieuse pour avoir fait tout ce pénible chemin jusqu'à un minuscule village comme Lakanaba.\n@c2@"
  it: "@a@b*: %H860%XDevi%YDovete%Z ave' un carattere molto hurioso pe' veni' a visita' un buho come Lacanata.\n@c2@"
  ja: "@a@b＊「こんな　何もない町に\n\tわざわざ　来るなんて\n\tあんた　そうとう物好きだな。\n@c2@"
"44":
  de: "@a@b*: Bist du das, Torneko? Lange nicht gesehen, was? Wie geht's denn noch immer?\n@c2@"
  en: "@a@b*: Is that yerself, Torneko?\nIt's been yonks, so it has. How's she cuttin'?\n@c2@"
  es: "@a@b*: ¿Eres tú, Torneko?\nHa piasado mucho tiempo, ya lo crieo. ¿Cómo ti va la vida?\n@c2@"
  fr: "@a@b*ⓢ C'est vous, Tornekoⓡ\nÇa fait une paye, dites donc.\nQu'est-ce que vous devenezⓡ\n@c2@"
  it: "@a@b*: Ma sei proprio te, Baldo? Ne è passato di tempo! Come ti va?\n@c2@"
  ja: "@a@b＊「おお　トルネコじゃないか！\n\tひさしぶりだなあ。\n@c2@"
"45":
  de: "@a@b*: Und wie geht's Tessa? Alles in Butter?\n@c2@"
  en: "@a@b*: An' how's Tessie gettin' along?\nIs she well, is she?\n@c2@"
  es: "@a@b*: ¿Y quié tal está Trakiba?\n¿Está bien?\n@c2@"
  fr: "@a@b*ⓢ Et comment va Lucilleⓡ\nBien, j'espère.\n@c2@"
  it: "@a@b*: E come sta Beatrice? Sta bene?\n@c2@"
  ja: "@a@b＊「ところで　ネネさんは\n\t元気にしてるかい？\n@c2@"
"46":
  de: "@a@b*: Ich kapier immer noch nicht, wie ein Prachtweib wie Tessa so einen nichtsnutzigen Sumpfheini wie dich nehmen konnte.\n@c2@"
  en: "@a@b*: I still can't understand why a fine article like Tessie married a good-fer-nuttin' bog-trotter like you.\n@c2@"
  es: "@a@b*: Todavía no puedo entiender cómo una joya como Trakiba si casó con un vago gañián como tú.\n@c2@"
  fr: "@a@b*ⓢ Je ne comprends toujours pas comment une belle fille comme elle a pu épouser un bon à rien comme vous, qui, en plus, a la bougeotte.\n@c2@"
  it: "@a@b*: Ancora 'un hapisco come ha fatto un bocconcino come Beatrice a sposa' un bischero come te!\n@c2@"
  ja: "@a@b＊「まったく　あんな美人が\n\tどうして　お前みたいなのと\n\t結婚したのか　不思議だぜ。\n@c2@"
"47":
  de: "@a@b*: Im Moment stecke ich bis zu den Ohren in Arbeit. Kommt später wieder, ja?\n@c2@"
  en: "@a@b*: I'm tied up with work at the minute.\nCome back later, would ye?\n@c2@"
  es: "@a@b*: Ahiora mismo estoy muy liado.\n¿%H860%XPuedes%YPiodiéis%Z volvier más tiarde?\n@c2@"
  fr: "@a@b*ⓢ Je suis débordé de travail, pour l'instant.\nRevenez plus tard, voulez-vousⓡ\n@c2@"
  it: "@a@b*: Son pieno di lavoro fino a' hapelli. %H860%XTorna%YTornate%Z dopo, va bene?\n@c2@"
  ja: "@a@b＊「今　仕事で　いそがしんだ。\n\t用事だったら　後にしてくんな。\n@c2@"
"48":
  de: "@a@b*: Da brat mir doch einer 'nen Storch, wenn das nicht Torneko ist! Nun sieh sich nur einer an, was der für 'n feiner Pinkel geworden ist!\n@c2@"
  en: "@a@b*: By the hokey, if it isn't yerself, Torneko!\nLook at the fine gent ye've become!\n@c2@"
  es: "@a@b*: ¡Que me aspien si no es el viejo Torneko en piersona!\n¡Fíjate, ti has conviertido en todo un caballiero!\n@c2@"
  fr: "@a@b*ⓢ Nom d'une pipe, mais c'est vous, Tornekoⓠ\nRegardez-moi un peu quel monsieur vous êtes devenuⓠ\n@c2@"
  it: "@a@b*: Che mi prenda 'ncolpo, Baldo! Ma sei diventato proprio un damerino!\n@c2@"
  ja: "@a@b＊「やあ　トルネコじゃないか！\n\tりっぱになったなあ。\n@c2@"
"49":
  de: "@a@b*: Dass diese lahme Ente von einem Schiff, das du dir da zugelegt hast, es auch nur bis Lakanaba geschafft hat, grenzt an ein Wunder.\n@c2@"
  en: "@a@b*: Talk o' that ship ye bought yerself even made it up the bogway to Lakanaba here, ye know.\nI can hardly believe it.\n@c2@"
  es: "@a@b*: Habliábamos de ese barco que compriaste y que consieguiste traer hasta el mismo Lakanaba, sabes.\n¡No puedo crieerlo!\n@c2@"
  fr: "@a@b*ⓢ On a même entendu parler du bateau que vous avez acheté jusqu'ici, à Lakanaba.\nJ'ai du mal à le croire.\n@c2@"
  it: "@a@b*: La notizia che tu ha' homprato una nave è arrivata fino a Lacanata, Maremma marina... Huasi 'un ci credo!\n@c2@"
  ja: "@a@b＊「あんたが　船を買ったってウワサは\n\tこの村にも届いているよ。\n\tたいしたもんだ！\n@c2@"
"50":
  de: "@a@b*: Du suchst meinen Mann? Der ist auf der Arbeit, da musst du schon abends kommen, wenn du ihn sprechen willst.\n@c1@"
  en: "@a@b*: Are ye lookin' fer me fella, are ye?\nHe's out to work at the mo, so ye'll have to come back in the evenin'.\n@c1@"
  es: "@a@b*: %H860%XEstiás%YEstiáis%Z buscando a mi miarido, ¿vierdad? Ha salido a triabajar, así que %H860%Xtiendrás%Ytiendréis%Z que volver por la noche.\n@c1@"
  fr: "@a@b*ⓢ Vous cherchez mon mariⓡ\nIl est au travail. Faudra que vous repassiez ce soir.\n@c1@"
  it: "@a@b*: %H860%XStai%YState%Z cercando il mi' marito? 'Un c'è, è a lavora'. %H860%XTorna%YTornate%Z stasera.\n@c1@"
  ja: "@a@b＊「おや　何か用かい？\n\tウチの人だったら　昼間は店だから\n\t夜にでも　来ておくれよ。\n@c1@"
"51":
  de: "@a@b*: Herr Talun! Wisst Ihr, ich bin Eurem Vorbild gefolgt und auch nach Endor gegangen.\n@c2@"
  en: "@a@b*: Mr. Taloon! Ye know, I followed in yer footsteps an' headed to Endor meself.\n@c2@"
  es: "@a@b*: ¡Sr. Taloon! ¿Sabe que sieguí sus piasos e incluso lliegué hasta Endor?\n@c2@"
  fr: "@a@b*ⓢ Monsieur Taloonⓠ Vous savez, j'ai suivi vos traces et je suis allé jusqu'à Chandor.\n@c2@"
  it: "@a@b*: Oh, Baldo! Sai, ho seguito le tu' orme. Anch'io so' andato a Endor!\n@c2@"
  ja: "@a@b＊「やや！　トルネコさん！\n\tじつは　わたしもエンドールに\n\t行ってみたのですが……。\n@c2@"
"52":
  de: "@a@b*: Allerdings habe ich mein ganzes Geld im Kasino verspielt. Aber das war mir eine Lehre. Ich halte mich jetzt nur noch an ehrliche Arbeit.\n@c2@"
  en: "@a@b*: Only, I used all me money up at the casino.\nBut I learnt me lesson, so I did.\nHonest hard work's the only way to go.\n@c2@"
  es: "@a@b*: El único prioblema es que mi gastié todo el diniero en el casino. Piero apriendí la liección, vaya si lo hice.\nLo único bueno es triabajar duro y ser honiesto, sí.\n@c2@"
  fr: "@a@b*ⓢ Seulement, j'ai dépensé tout mon argent au casino. Mais j'ai retenu la leçon, croyez-moi. Travailler dur et honnêtement est la seule façon d'avancer.\n@c2@"
  it: "@a@b*: Però ho perso tutti i soldi a' i'ccasinò. Ma la lezione l'ho imparata... Eccome se l'ho 'mparata! L'unica cosa che paga è i'llavoro onesto.\n@c2@"
  ja: "@a@b＊「カジノでお金をすってしまって……。\n\tやはり　地道に働くのが\n\t一番ですな。　とほほ……。\n@c2@"
"53":
  de: "@a@b*: Schließt Euch mir an im Gebet. Wir wollen die Göttin um Frieden im ganzen Land bitten.\n@c1@"
  en: "@a@b*: Come together with me in prayer as we ask the Goddess for peace throughout the land.\n@c1@"
  es: "@a@b*: %H860%XÚnete%YUníos%Z a mí en oración para piedir a la Diosa que nos conceda la paz para esta tierra.\n@c1@"
  fr: "@a@b*ⓢ Joignez-vous à moi pour prier la Déesse afin que la paix règne dans tout le pays.\n@c1@"
  it: "@a@b*: %H860%XPrega%YPregate%Z hon me affinché la dea porti la pace ne i'nnostro paese.\n@c1@"
  ja: "@a@b＊「あなたも　わたしと一緒に\n\t世界の平和を　神さまに\n\t祈ってくださいまし。\n@c1@"
"54":
  de: "@a@b*: Ah! Torneko Talun! Was Ihr für den alten Herrn Hans getan habt, war einfach großartig. Er ist Euch ja so dankbar.\n@c1@"
  en: "@a@b*: Ah! Torneko Taloon!\n'Twas a grand thing ye did fer old Mr. Finn.\nHe's ever so grateful to ye.\n@c1@"
  es: "@a@b*: ¡Ah! ¡Torneko Taloon!\nEstiuvo muy bien lo que hicistie por el Viejo Bin.\nEstá muy agradiecido por ello.\n@c1@"
  fr: "@a@b*ⓢ Ahⓠ Torneko Taloonⓠ C'est vraiment bien ce que vous avez fait pour Monsieur Flinn l'Ancien. Il vous en est tellement reconnaissant.\n@c1@"
  it: "@a@b*: Ah... Baldo Baldini! Che gran gesto te tu ha' fatto pe' i'vvecchio Santino... Lui t'è davvero tanto rihonoscente!\n@c1@"
  ja: "@a@b＊「あら？　トルネコさん！\n\tトムじいさんは　本当に\n\tあなたに　感謝していますわ。\n@c1@"
"55":
  de: "@a@b*: Und ich auch, hi hi hi.\n@c1@"
  en: "@a@b*: An' so am I, of course. Hee hee hee.\n@c1@"
  es: "@a@b*: Y yo tiambién lo estoy. Ji, ji, ji.\n@c1@"
  fr: "@a@b*ⓢ Et moi aussi, bien sûr. Hi hi hi.\n@c1@"
  it: "@a@b*: E anch'io lo sono, naturalmente. Eh! Eh! Eh!\n@c1@"
  ja: "@a@b＊「もちろん　わたくしもですけど……。\n\tポッ……。\n@c1@"
"56":
  de: "@aHänschen@bTorneko? Torneko Talun? Ja, seh ich denn recht? Ich bin's! Der Sohn vom Alten Hans... Hänschen!\n@c2@"
  en: "@aFinnegan@bTorneko? Torneko Taloon? I'm right, aren't I? 'Tis meself, look! Old Man Finn's son...Finnegan.\n@c2@"
  es: "@aBen Bin@b¿Torneko? ¿Torneko Taloon? ¿Tiengo razón, vierdad? ¡Sioy yo, mira! El hijo del Viejo Bin... Ben Bin.\n@c2@"
  fr: "@aFlinn le Jeune@bTornekoⓡ Torneko Taloonⓡ C'est bien vous,\nn'est-ce pasⓡ Vous me reconnaissezⓡ\nJe suis Flinn le Jeune, le fils de Flinn l'Ancien...\n@c2@"
  it: "@aDuccio@bBaldo? Baldo Baldini? Sei te, vero? So' Duccio, i'ffigliolo de i'vvecchio Santino!\n@c2@"
  ja: "@a@b＊「トルネコ！　トルネコさんだろ？\n\tオレだよ　オレ！\n\tそそそ　トムじいさんの息子だよ。\n@c2@"
"57":
  de: "@aHänschen@bIch dachte, es ist Zeit, dass ich mein Brot auf ehrliche Art und Weise verdiene, also hab ich den Boss gefragt, ob er mich einstellt.\n@c2@"
  en: "@aFinnegan@bI decided it's time I made an honest livin' fer meself, so I asked the boss would he take me on.\n@c2@"
  es: "@aBen Bin@bDiecidí que ya era hora de ganiarme la vida honradamiente, así que le piedí al jiefe que me contriatara.\n@c2@"
  fr: "@aFlinn le Jeune@bCette fois, j'ai décidé de gagner honnêtement ma vie, alors j'ai demandé au patron de m'embaucher.\n@c2@"
  it: "@aDuccio@bHo deciso di guadagnarmi da vive' onestamente, così ho chiesto a i'ccapo d'assumermi!\n@c2@"
  ja: "@a@b＊「オレも　そろそろ\n\tまじめに働こうと思ってさ。\n\t親方に　やとってもらったんだよ。\n@c2@"
"58":
  de: "@a@b*: Kann ich Euch behilflich sein? Ihr seht mir nicht wie ein Händler aus...\n@c2@"
  en: "@a@b*: Is there sometin' I can be doin' fer ye?\nYe don't look like much of a trader to me...\n@c2@"
  es: "@a@b*: ¿Hay algo que pueda hacier por %H860%Xti%Y%R000%Xvosotras%Yvosotros%Z%Z?\nNo %H860%Xtienes%Ytenéis%Z mucha pinta de %H860%Xcomierciante%Ycomerciantes%Z...\n@c2@"
  fr: "@a@b*ⓢ Puis-je faire quelque chose pour vous aiderⓡ\nVous ne m'avez pas l'air d'être %A120%Xun commerçant%Z%B120%Xune commerçante%Z...\n@c2@"
  it: "@a@b*: Posso fa' qualcosa per %H860%Xte%Yvoi%Z?\n'Un %H860%Xc'hai proprio la faccia da commerciante%Yc'avete proprio la faccia da commercianti%Z...\n@c2@"
  ja: "@a@b＊「なにか用かね？\n\tあんた　商売人にはみえないが……。\n@c2@"
"59":
  de: "@a@b*: Wenn Ihr eine Waffe sucht, müsst Ihr mit meinem Angestellten oben reden.\n@c2@"
  en: "@a@b*: If ye're after a weapon, ye'll have to talk to me man upstairs.\n@c2@"
  es: "@a@b*: Si lo que %H860%Xbuscas%Ybuscáis%Z son armas, %H860%Xtiendrás%Ytiendréis%Z que hablar con el hombrie del piso de arriba.\n@c2@"
  fr: "@a@b*ⓢ Si vous cherchez une arme, il faudra vous adresser à l'homme qui se trouve à l'étage.\n@c2@"
  it: "@a@b*: Se %H860%Xcerchi%Ycercate%Z un'arma, allora %H860%Xdevi rivolgerti%Ydovete rivolgervi%Z al tizio che lavora di sopra.\n@c2@"
  ja: "@a@b＊「武器を　買いに来たのなら\n\t上の店に　行っとくれ。\n@c2@"
"60":
  de: "@a@b*: Bei allen Heiligen, na, wenn das nicht Torneko Talun ist! Was macht denn dein Laden in Endor? Läuft er?\n@c2@"
  en: "@a@b*: By the holies, if it isn't Torneko Taloon!\nSo how's yer shop in Endor comin' along?\nIs she makin' ye a few bob, is she?\n@c2@"
  es: "@a@b*: ¡Por todas las profietas, si es Torneko Taloon!\n¿Cómo ti va tu niegocio en Endor?\n¿Ya ti has asientado?\n@c2@"
  fr: "@a@b*ⓢ Par tous les saints, mais c'est Torneko Taloonⓠ\nAlors tu as fini par poser tes valises à Chandorⓡ\nTon magasin marche bienⓡ\n@c2@"
  it: "@a@b*: Maremma armaiola, Baldo Baldini! Come vanno gli affari a Endor? Te la passi bene, vero?\n@c2@"
  ja: "@a@b＊「よう！　トルネコじゃないか！\n\tどうだい　エンドールの店は\n\tもうかってるか？\n@c2@"
"61":
  de: "@a@b*: Ja, großartig, großartig. Ich bin froh, dass es so gut für dich läuft. Ich wette, deiner Frau geht es genauso.\n@c2@"
  en: "@a@b*: Aye, that's grand.\nI'm glad ye're makin' a go of it.\nI bet yer wife's mighty pleased, too.\n@c2@"
  es: "@a@b*: ¡Ah!, eso es estiupendo.\nMi aliegro de que tiodo ti viaya bien.\nImiagino que tu espiosa también estará contienta.\n@c2@"
  fr: "@a@b*ⓢ Ah, c'est une bonne nouvelle. Je suis content que tu t'en sortes bien. Je parie que ta femme est drôlement contente, elle aussi.\n@c2@"
  it: "@a@b*: Ah, che bella notizia! Mi fa piacere che ti vada tutto bene... Immagino che pure la tu' mogliettina sia hontenta!\n@c2@"
  ja: "@a@b＊「そうか！　まあ　がんばれよ！\n\tお前には　かわいい奥さんが\n\tいるんだしな。\n@c2@"
"62":
  de: "@a@b*: Was sagst du? Du bist auf der Suche nach einem legendären Schwert?\n@c2@"
  en: "@a@b*: What's that ye say? Ye're lookin' fer a legendary sword now, are ye?\n@c2@"
  es: "@a@b*: ¿Cómo? ¿Dicies que ahora buscas una espada legiendaria?\n@c2@"
  fr: "@a@b*ⓢ Qu'est-ce que tu racontesⓡ À présent, tu cherches une épée légendaireⓡ\n@c2@"
  it: "@a@b*: Sempr'a lamentarti te, eh? Cosa ci fai queste parti? Ah, ora sei alla ricerca d'una spada leggendaria?\n@c2@"
  ja: "@a@b＊「え？　なんだって？\n\t伝説の剣をさがして\n\t旅をしてるって！？\n@c2@"
"63":
  de: "@a@b*: Willst du eigentlich immer weiter so durch die Weltgeschichte schwirren? Oder irgendwann als Tattergreis auch mal sesshaft werden? \n@c2@"
  en: "@a@b*: Will ye be actin' the maggot all yer life now, or were ye plannin' to settle down by the time ye're a hundred?\n@c2@"
  es: "@a@b*: ¿Vas a sieguir dando tiumbos toda la vida o tienes piensado bajar de la nube un día de estos?\n@c2@"
  fr: "@a@b*ⓢ Mais est-ce que tu vas faire le zouave toute ta vie ou as-tu l'intention de te poser quelque part avant d'avoir cent ansⓡ\n@c2@"
  it: "@a@b*: Pensi di fa' i'ggiramondo tutta la vita, o ti voi ferma' da qualche parte, prima di diventa' vecchio come la mi' nonna?\n@c2@"
  ja: "@a@b＊「そんな　おかしなことを言ってないで\n\tそろそろ　落ち着いたらどうだ。\n@c2@"
"64":
  de: "@a@b*: Ich kann's gar nicht glauben! Selbst der Junge vom Alten Hans ist mir noch zuvorgekommen!\n@c2@"
  en: "@a@b*: I can't believe it! Even old Finn's lad's stolen a march on me...\n@c2@"
  es: "@a@b*: ¡No puedo crieerlo! Incluso el muchiacho del viejo Bin si mi ha adielantado...\n@c2@"
  fr: "@a@b*ⓢ Je n'arrive pas à le croireⓠ Même le fils de Flinn l'Ancien m'est passé devant le nez...\n@c2@"
  it: "@a@b*: 'Un ci posso crede'! Pure i'ffigliolo de i'vvecchio Santino s'è sistemato prima di me...!\n@c2@"
  ja: "@a@b＊「トムじいさんの息子にまで\n\t先をこされちまった……。\n@c2@"
"65":
  de: "@a@b*: Wenn ich nicht bald heirate, wird mir auf dem Weg zum Altar noch mein eigener Sarg in die Quere kommen.\n@c2@"
  en: "@a@b*: If I don't get married soon, I'll pass me coffin on the way down the aisle.\n@c2@"
  es: "@a@b*: Si no mi caso prionto, mi tioparé con mi priopio ataúd de camino al altar.\n@c2@"
  fr: "@a@b*ⓢ Si je ne me marie pas bientôt, c'est dans un cercueil que j'avancerai vers l'autel.\n@c2@"
  it: "@a@b*: Maremma scapola... Se 'un mi sbrigo a sposarmi, 'un mi piglia più nessuna!\n@c2@"
  ja: "@a@b＊「あ～あ　オレも　早く\n\t結婚してえよ～！\n@c2@"
"66":
  de: "@a@b*: Es scheint, mein alter Freund Torneko hat sich ein Schiff gekauft!\n@c2@"
  en: "@a@b*: I've an old friend by the name of Torneko who's only bought himself a ship, so they say!\n@c2@"
  es: "@a@b*: Tiengo un viejo amigo, llamado Torneko, que si comprió un biarco, eso es lo que dicen.\n@c2@"
  fr: "@a@b*ⓢ L'un de mes vieux amis, appelé Torneko, se serait acheté un bateau à ce qu'il paraîtⓠ\n@c2@"
  it: "@a@b*: Ho un vecchio amico di nome Baldo che s'è comprato una nave... O almeno così si dice 'ngiro!\n@c2@"
  ja: "@a@b＊「昔なじみの　トルネコって男が\n\t船を買ったって　ウワサを\n\t耳にしたよ。\n@c2@"
"67":
  de: "@a@b*: Vor Kurzem hat er hier noch für jemanden gearbeitet und hatte etwa so viel Aussicht auf Reichtum wie eine stillgelegte Goldmine.\n@c2@"
  en: "@a@b*: Aye, 'twas not long ago that he was just workin' for some feen here, with about as much in the way of prospects as a used gold mine.\n@c2@"
  es: "@a@b*: Cierto, no hace mucho tiempo andiaba triabajando por aquí piara un tipo, con las mismas pierspectivas de fiuturo que una camella coja.\n@c2@"
  fr: "@a@b*ⓢ Eh bien, il n'y a pas si longtemps que ça, il travaillait encore pour un type d'ici... avec autant de perspectives d'avenir qu'une mine d'or abandonnée.\n@c2@"
  it: "@a@b*: Se penso che fino a poco tempo fa lavorava qui e 'un c'aveva i'bbecco d'un quattrino...! \n@c2@"
  ja: "@a@b＊「ちょっと前まで　この町で働いてた\n\tあいつが　ずいぶん\n\t出世したもんだ。\n@c2@"
"68":
  de: "@a@b*: Ich freue mich natürlich für ihn. Aber ich wünschte, er käme gelegentlich mal auf Besuch. Die alte Nebelkrähe fehlt uns allen.\n@c2@"
  en: "@a@b*: I'm happy fer him, of course.\nBut I wish he'd come back once in a while.\nWe all miss the ole stock.\n@c2@"
  es: "@a@b*: Piero me aliegro por él.\nAunque mi hiubiera gustiado que viniera de viez en cuando. Tiodos lo echamos de mienos.\n@c2@"
  fr: "@a@b*ⓢ Bien sûr, je suis content pour lui. Mais j'aimerais bien qu'il revienne ici de temps à autre.\nIl nous manque à tous, le bougre.\n@c2@"
  it: "@a@b*: Mi fa piacere per lui, diho davvero... Ma vorrei che ogni tanto tornasse a trovarci. Ci manca, quel bischero!\n@c2@"
  ja: "@a@b＊「知り合いとして　うれしいことだが\n\t遠くにいっちまったみたいで\n\tなんだか　さびしい気もするな。\n@c2@"
"69":
  de: "@a@b*: Zzzz...\n@c1@"
  en: "@a@b*: Zzzz...\n@c1@"
  es: "@a@b*: Zzzz...\n@c1@"
  fr: "@a@b*ⓢ Zzzz...\n@c1@"
  it: "@a@b*: Zzz...\n@c1@"
  ja: "@a@b＊「すやすや……。\n@c1@"
"70":
  de: "@a@b*: Ha-püh... Ha-püh...\n@c2@"
  en: "@a@b*: Ah-phew... Ah-phew...\n@c2@"
  es: "@a@b*: Ah-fiuuu... Ah-fiuuu...\n@c2@"
  fr: "@a@b*ⓢ Ron-pfff... Ron-pfff...\n@c2@"
  it: "@a@b*: Ronf... Ronf...\n@c2@"
  ja: "@a@b＊「ぐうぐう……。\n@c2@"
"71":
  de: "@a@b*: Mir hat so ein Kerl erzählt, in einem Laden in Endor könnte man erstklassige Rüstungen bekommen.\n@c3@"
  en: "@a@b*: A fella told me there was a shop in Endor sellin' top-notch armour.\n@c3@"
  es: "@a@b*: Un tipo mi contó que en Endor hay una tienda que viende armiaduras de primiera.\n@c3@"
  fr: "@a@b*ⓢ Un type m'a dit qu'à Chandor, il y avait un magasin qui vendait des armures de grande qualité.\n@c3@"
  it: "@a@b*: Un tizio m'ha detto che a Endor c'è un negozio dove vendono armature di prima qualità.\n@c3@"
  ja: "@a@b＊「エンドールの国には\n\t強力な防具を　売っている店が\n\tあると　聞いていたのだが……。\n@c3@"
"72":
  de: "@a@b*: Na, ich also los nach Endor, aber wo ich da ankomme, weiß kein Mensch, wovon ich rede. Ich war baff! Die müssen mich verulkt haben.\n@c3@"
  en: "@a@b*: I went all the way there, so I did, an' no one knew what I was on about. I reckon I was diddled. Taken fer a ride, like.\n@c3@"
  es: "@a@b*: Mi fui hastia allí y nadie pariecía sabier nada de lo que les diecía. Reconozco que mi la jugaron. Mi tomiaron el pielo.\n@c3@"
  fr: "@a@b*ⓢ Je suis allé jusque là-bas, mais personne ne savait de quoi je parlais. Je me suis fait avoir.\nOn m'a mené en bateau, quoi.\n@c3@"
  it: "@a@b*: Io sono andato fin lì, ma nessuno sapeva di huesta bottega! Mi sa che m'ha preso 'ngiro, quel bischero...\n@c3@"
  ja: "@a@b＊「以前　行った時には\n\tそんな店は　見当たらなかった。\n\tまったく　だまされたよ。\n@c3@"
"73":
  de: "@aDer Alte Hans@bZzz... Zzz...\n@c2@"
  en: "@aOld Man Finn@bZzz... Zzz...\n@c2@"
  es: "@aViejo Bin@bZzz... Zzz...\n@c2@"
  fr: "@aFlinn l'Ancien@bZzz... zzz...\n@c2@"
  it: "@aIl vecchio Santino@bZzz... Zzz...\n@c2@"
  ja: "@a@bトム「こっくり　こっくり……。\n@c2@"
"74":
  de: "@a@b*: Ha-püh... Ha-püh...\n@c2@"
  en: "@a@b*: Ah-phew... Ah-phew...\n@c2@"
  es: "@a@b*: Ah-fiuuu... Ah-fiuuu...\n@c2@"
  fr: "@a@b*ⓢ Ron-pfff... Ron-pfff...\n@c2@"
  it: "@a@b*: Ronf... Ronf...\n@c2@"
  ja: "@a@b＊「ぐうぐう……。\n@c2@"
"75":
  de: "@a@b*: Ich weiß, ich sollte nur an die Göttin allein denken, aber... Der Mann will mir einfach nicht mehr aus dem Sinn! Ich komme nicht dagegen an.\n@c1@"
  en: "@a@b*: I know me duty is to the Goddess, but...\nI can't help meself! I'm in love with the man, an' there's nuttin' I can do about it!\n@c1@"
  es: "@a@b*: Asumo que mi diebo a la Diosa, pero...\n¡No lo puedo evitar! ¡Estoy enamiorada de ese hombre y no puedo hacier nada para evitiarlo!\n@c1@"
  fr: "@a@b*ⓢ Je sais que je dois servir la Déesse, mais...\nJe ne peux pas m'en empêcherⓠ Je suis amoureuse de cet homme et je ne peux rien y faireⓠ\n@c1@"
  it: "@a@b*: So che ho giurato di dediha' tutta la mi' vita alla dea, ma... 'Un ci posso fa' nulla... Mi so' innamorata di huell'omo là. L'è più forte di me!\n@c1@"
  ja: "@a@b＊「わたしは　神につかえる身ですが\n\tこの人を愛してしまって……。\n\tポッ……。\n@c1@"
"76":
  de: "@aHänschen@bTorneko!\n@c2@"
  en: "@aFinnegan@bTorneko!\n@c2@"
  es: "@aBen Bin@b¡Torneko!\n@c2@"
  fr: "@aFlinn le Jeune@bTornekoⓠ\n@c2@"
  it: "@aDuccio@bBaldo!\n@c2@"
  ja: "@a@b＊「やあ　トルネコさん！\n@c2@"
"77":
  de: "@aHänschen@bIch bin's, sieh doch nur! Der Sohn vom alten Hans... Hänschen! Deine Frau war so nett, mir euer Haus hier zu überlassen.\n@c2@"
  en: "@aFinnegan@bⓙTis meself, look! Old Man Finn's son...Finnegan. Yer wife was kind enough to let me take over yer house here.\n@c2@"
  es: "@aBen Bin@b¡Soy yo, mira! El hijo del Viejo Bin... Ben Bin. Tu esposa fue muy amiable y mi diejó quiedarme en tu casa.\n@c2@"
  fr: "@aFlinn le Jeune@bC'est moiⓠ Flinn le Jeune... le fils de Flinn l'Ancien.\nTon épouse a eu la gentillesse de me laisser reprendre ta maison.\n@c2@"
  it: "@aDuccio@bSo' io! I'ffigliolo de i'vvecchio Santino... Duccio! La tu' moglie l'è stata hosì gentile da farmi sta' a casa tua...\n@c2@"
  ja: "@a@b＊「オレだよ　トムの息子だよ！\n\tあんたの奥さんから\n\tこの家を　ゆずってもらったんだ。\n@c2@"
"78":
  de: "@aHänschen@bMal ein richtig guter Händler zu werden, so wie du, das ist mein Traum! Und irgendwann werde ich es auch schaffen. Das weiß ich einfach!\n@c2@"
  en: "@aFinnegan@bⓙTis me dream to become a fine merchant, just like yerself. I know I can do it. I know I can.\n@c2@"
  es: "@aBen Bin@bMi sueño siemprie ha sido conviertirme en un comierciante, como tú. Sé que puedo lliegar a sierlo. Sé que puedo.\n@c2@"
  fr: "@aFlinn le Jeune@bC'est mon rêve de devenir un bon marchand, comme toi. Je sais que je peux y arriver. J'en suis sûr.\n@c2@"
  it: "@aDuccio@bIl mi' sogno è diventa' un mercante bravo come te. So che posso riuscirci... Ne so' convinto!\n@c2@"
  ja: "@a@b＊「オレも　あんたのような\n\tりっぱな商人に　なってみせるぜ！\n@c2@"
