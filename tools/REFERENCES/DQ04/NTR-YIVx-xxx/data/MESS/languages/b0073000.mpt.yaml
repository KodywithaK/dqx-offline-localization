"0":
  de: "@a@b*: Wieher.\n@c2@"
  en: "@a@b*: Neigh.\n@c2@"
  es: "@a@b*: Iiiii.\n@c2@"
  fr: "@a@b*ⓢ Hiiiiiii.\n@c2@"
  it: "@a@b*: Iiiiihhh.\n@c2@"
  ja: "@a@b＊「ヒヒーン。\n@c2@"
"1":
  de: "@a@bDie Wüste erstreckt sich in die Ferne, so weit das Auge reicht.\n@c0@"
  en: "@a@bA desert stretches off into the distance as far as the eye can see.\n@c0@"
  es: "@a@bUn desierto se pierde en la distancia, en la lejanía, hasta donde la vista puede alcanzar\n@c0@"
  fr: "@a@bUn désert s'étend à l'horizon, aussi loin que porte le regard.\n@c0@"
  it: "@a@bIl deserto si estende a perdita d'occhio.\n@c0@"
  ja: "@a@bはるか　かなたまで　砂漠が広がっている。\n@c0@"
"2":
  de: "@a@bZu Fuß, ohne eine Kutsche, kann man solche Weiten unmöglich bewältigen.\n@c0@"
  en: "@a@bIt would be impossible to cross such a large expanse without a wagon.\n@c0@"
  es: "@a@bSin un carromato, resultaría imposible atravesar una distancia así.\n@c0@"
  fr: "@a@bIl est impossible de traverser une telle étendue sans un chariot.\n@c0@"
  it: "@a@bÈ impossibile attraversarlo senza un carro.\n@c0@"
  ja: "@a@b馬車でもなければ　この広大な砂漠を\n越えることは　できないだろう。\n@c0@"
"3":
  de: "@aHank Hoffman Jr.@bIhr braucht meinen Planwagen, um die Welt zu retten?\n@c2@"
  en: "@aHank Hoffman Jr.@bYou want me to give you my wagon so ya can carry on your journey to save the world?\n@c2@"
  es: "@aJuanchito@b¿Nomás %H860%Xquiere%Yquieren%Z que %H860%Xle%Yles%Z preste mi carromato para emprender un viaje para salvar el mundo?\n@c2@"
  fr: "@aHank Hoffman Jr@bVous voulez que j'vous donne mon chariot pour qu'vous puissiez continuer de voyager pour sauver l'mondeⓡ\n@c2@"
  it: "@aJohn Dwayne Jr.@b%H860%XVuoi che ti dia%YVolete che vi dia%Z il mio carro per proseguire il %H860%Xtuo%Yvostro%Z viaggio per salvare il mondo?\n@c2@"
  ja: "@a@bホフマン「世界を救うたびをしてるから\n\t馬車を　ゆずってくれだって？\n@c2@"
"4":
  de: "@aHank Hoffman Jr.@bTja, klingt ja mächtig komisch, wenn Ihr mich fragt.\n@c2@"
  en: "@aHank Hoffman Jr.@bSounds mighty fishy to me. You can't expect me to believe a tall old tale like that.\n@c2@"
  es: "@aJuanchito@bNi modo, me huele un poco mal. ¿No %H860%Xpretenderá%Ypretenderán%Z que me crea un cuento chino como ese?\n@c2@"
  fr: "@aHank Hoffman Jr@bÇa m'paraît drôl'ment louche. Vous croyez quand même pas que j'vais gober une histoire pareilleⓡ\n@c2@"
  it: "@aJohn Dwayne Jr.@bLa cosa puzza come un branco di capre bagnate. Non %H860%Xti aspetterai%Yvi aspetterete%Z mica che creda a una storiella del genere?!\n@c2@"
  ja: "@a@bホフマン「はん　ダメだダメだ。\n\tウソのにおいがする。\n\t信用できないな。\n@c2@"
"5":
  de: "@aHank Hoffman Jr.@bWie auch immer. Hab jetzt keinen Bock auf Fremde, okay? Macht, dass Ihr wegkommt.\n@c2@"
  en: "@aHank Hoffman Jr.@bNever mind. I ain't in the mood for people right now. Get outta here, will ya?\n@c2@"
  es: "@aJuanchito@bEs igual. Ahorita mismo no tengo ánimos para platicar con nadie. %H860%XMárchese%YMárchense%Z, por favor.\n@c2@"
  fr: "@aHank Hoffman Jr@bEt puis flûte, j'ai pas envie d'voir du monde, pour l'instant. Sortez d'ici, d'accordⓡ\n@c2@"
  it: "@aJohn Dwayne Jr.@bNe ho abbastanza. %H860%XSparisci%YSparite%Z, intesi?\n@c2@"
  ja: "@a@bホフマン「あんたには悪いが\n\tオレは　誰にも会いたくないんだ。\n\tさっさと　帰ってくれ！\n@c2@"
"6":
  de: "@aHank Hoffman Jr.@bLasst mich in Ruhe, okay?\n@c2@"
  en: "@aHank Hoffman Jr.@bLeave me alone, y'hear?\n@c2@"
  es: "@aJuanchito@b%H860%XDéjeme%YDéjenme%Z en paz, ¿me %H860%Xoyó%Yoyeron%Z?\n@c2@"
  fr: "@aHank Hoffman Jr@bLaissez-moi tranquille, j'vous disⓠ\n@c2@"
  it: "@aJohn Dwayne Jr.@b%H860%XLasciami%YLasciatemi%Z in pace, chiaro?\n@c2@"
  ja: "@a@bホフマン「もう　来るなよ！\n@c2@"
"7":
  de: "@aHank Hoffman Jr.@bMächtig langsam im Oberstübchen, wie? Schön, wenn Ihr ums Verrecken nicht locker lasst, erzähl ich Euch eben 'ne Geschichte...\n@c2@"
  en: "@aHank Hoffman Jr.@bYou're pretty slow, ain't ya? Well, maybe I'll share a little story with you if you ain't budgin'.\n@c2@"
  es: "@aJuanchito@bParece que %H860%Xanda%Yandan%Z un poco %H860%X%A120%Xlento%Z%B120%Xlenta%Z%Y%R000%Xlentas%Ylentos%Z%Z. Bueno, puede que %H860%Xle%Yles%Z cuente una historia si se %H860%Xqueda ahí %A120%Xparado%Z%B120%Xparada%Z%Yquedan ahí %R000%Xparadas%Yparados%Z%Z.\n@c2@"
  fr: "@aHank Hoffman Jr@bVous comprenez pas vite, heinⓡ\nBon, puisque vous voulez pas bouger, j'vais vous raconter une petite histoire.\n@c2@"
  it: "@aJohn Dwayne Jr.@bSiamo un po' duri di comprendonio, eh? Allora, già che ci siamo, %H860%Xti%Yvi%Z racconterò una storiella.\n@c2@"
  ja: "@a@bホフマン「わからない人だな　あんた。\n\tそこまで　くいさがるなら\n\tオレの話を　聞かせてやるよ。\n@c2@"
"8":
  de: "@aHank Hoffman Jr.@bVor einer Weile bin ich auch durchs Land gereist, so wie Ihr jetzt.\n@c2@"
  en: "@aHank Hoffman Jr.@bA long while back now, I was travellin' around just like you are.\n@c2@"
  es: "@aJuanchito@bHace ahorita bastante tiempo, yo también me fui de viaje, como %H860%Xusted%Yustedes%Z nomás.\n@c2@"
  fr: "@aHank Hoffman Jr@bIl y a très longtemps d'ça, je voyageais à travers le monde, tout comme vous.\n@c2@"
  it: "@aJohn Dwayne Jr.@bTanto tempo fa ero in viaggio, proprio come %H860%Xte%Yvoi%Z.\n@c2@"
  ja: "@a@bホフマン「これでもオレは　昔は\n\tあんたみたいに　旅をしていたのさ。\n@c2@"
"9":
  de: "@aHank Hoffman Jr.@bHab die Leute von dem bedeutendsten Schatz der Welt schwatzen hören. Sollte in irgend so 'ner Höhle versteckt sein.\n@c2@"
  en: "@aHank Hoffman Jr.@bI heard talk of the world's most important treasure bein' hidden in some cave.\n@c2@"
  es: "@aJuanchito@bEscuché rumores de que en una cueva se encontraba oculto el tesoro más magnífico del mundo.\n@c2@"
  fr: "@aHank Hoffman Jr@bJ'ai entendu dire que l'plus grand trésor du monde était caché dans une caverne.\n@c2@"
  it: "@aJohn Dwayne Jr.@bSentii dire che il tesoro più prezioso del mondo era nascosto in una grotta.\n@c2@"
  ja: "@a@bホフマン「あるとき　世界で一番\n\t大切な宝物が　隠されているという\n\t洞くつの　うわさを聞いたんだ。\n@c2@"
"10":
  de: "@aHank Hoffman Jr.@bAlso bin ich mit 'nem Freund hin. Wollten uns mal 'n bisschen umgucken.\n@c2@"
  en: "@aHank Hoffman Jr.@bA friend and I moseyed on down there to see what we could find.\n@c2@"
  es: "@aJuanchito@bJunto con un amigo, fuimos allá para ver qué encontrábamos.\n@c2@"
  fr: "@aHank Hoffman Jr@bAvec un ami à moi, on y est allés, pour voir de plus près ce qu'on pouvait y trouver.\n@c2@"
  it: "@aJohn Dwayne Jr.@bIo e un amico ci precipitammo lì per vedere se ci riusciva di trovarlo.\n@c2@"
  ja: "@a@bホフマン「オレは　友だちと　ふたりで\n\tその洞くつに入ったよ。\n@c2@"
"11":
  de: "@aHank Hoffman Jr.@bEr war mein bester Kumpel... dacht ich jedenfalls. Und dann versetzt er mir doch glatt 'nen Dolchstoß in den Rücken.\n@c2@"
  en: "@aHank Hoffman Jr.@bHe was my best buddy...or so I thought.\nBut then he went an' stabbed me in the back.\n@c2@"
  es: "@aJuanchito@bEra mi cuate..., o al menos eso pensaba yo.\nPero cuando llegamos allá, me traicionó.\n@c2@"
  fr: "@aHank Hoffman Jr@bC'était mon meilleur ami... du moins, je l'croyais.\nMais ensuite, il m'a poignardé dans le dos.\n@c2@"
  it: "@aJohn Dwayne Jr.@bEra il mio miglior amico... O almeno così credevo. E fu proprio allora che mi pugnalò alla schiena.\n@c2@"
  ja: "@a@bホフマン「でも　いちばんの友だちと\n\t思っていたのに　突然　オレを\n\tうらぎって……ちくしょう！\n@c2@"
"12":
  de: "@aHank Hoffman Jr.@bPah! Macht mich ganz fuchsig, wenn ich nur drüber rede. Ich trau keinem mehr. Und jetzt raus hier, aber fix!\n@c2@"
  en: "@aHank Hoffman Jr.@bHuh! It makes me mad just talkin' about it.\nI ain't never trustin' no one again.\nNow get outta here!\n@c2@"
  es: "@aJuanchito@b¡Bua! Me vuelvo loco solo de recordarlo.\nNunca volveré a confiar en nadie.\n¡Ahora largo de aquí!\n@c2@"
  fr: "@aHank Hoffman Jr@bTsssⓠ Ça m'rend dingue, rien que d'en parler.\nDepuis, je fais plus confiance à personne.\nMaintenant, dégagezⓠ\n@c2@"
  it: "@aJohn Dwayne Jr.@bAh! Solo a pensarci mi sento come se un serpente a sonagli mi stesse mordendo!\n㈡\nNon mi fiderò mai più di nessuno.\nE ora fuori di qui!\n@c2@"
  ja: "@a@bホフマン「くそっ　イヤなことを\n\t思い出したじゃないか。\n\tもう誰も信じない！　帰ってくれ！\n@c2@"
"13":
  de: "@aHank Hoffman Sr. @bHabt Ihr den Typ mit dem Planwagen getroffen? Ist mein Sohn, wisst Ihr. Hank Hoffman Junior.\n@c2@"
  en: "@aHank Hoffman Sr.@bDid you meet the guy with the wagon?\nThat kid's my only son, y'know. Hank Hoffman Junior.\n@c2@"
  es: "@aJuancho@b¿%H860%XHa%YHan%Z conocido al tipo del carromato?\nEs m'hijo, para que lo %H860%Xsepa%Ysepan%Z, Juanchito.\n@c2@"
  fr: "@aHank Hoffman Sr@bVous avez rencontré l'homme au chariotⓡ\nEn fait, c'gamin est mon fils unique. Hank Hoffman Junior.\n@c2@"
  it: "@aJohn Dwayne Sr.@b%H860%XHai%YAvete%Z conosciuto il ragazzo col carro?\nQuello è il mio unico figlio, John Dwayne Junior.\n@c2@"
  ja: "@a@b＊「馬車の持ち主に　会いましたか？\n\tあいつは私の　ひとり息子でして。\n@c2@"
"14":
  de: "@aHank Hoffman Sr. @bVor 'ner Weile ging er mit 'nem Freund zur Höhle im Osten.\n@c2@"
  en: "@aHank Hoffman Sr.@bHe went off with a friend to the eastern cave a while back now.\n@c2@"
  es: "@aJuancho@bHace un tiempito ahora, se fue de viaje a la cueva del este junto a uno de sus compadres.\n@c2@"
  fr: "@aHank Hoffman Sr@bIl est parti avec un ami dans la caverne à l'est d'ici, ça fait un bail maintenant.\n@c2@"
  it: "@aJohn Dwayne Sr.@bTanto tempo fa andò con un amico in una grotta a est di qui.\n@c2@"
  ja: "@a@b＊「あいつは以前　仲間と一緒に\n\t東の洞くつへ行ったんです。\n@c2@"
"15":
  de: "@aHank Hoffman Sr. @bSein Pferd Mary Lou brachte ihn nach Hause. Mann, er war über und über voller Blut!\n@c2@"
  en: "@aHank Hoffman Sr.@bIt was his horse Mary Lou who brought him back, though. Sakes alive, he was covered in blood!\n@c2@"
  es: "@aJuancho@bSin embargo, fue su jaca, Paca, quien lo trajo de vuelta. ¡Híjole, estaba cubierto de sangre nomás!\n@c2@"
  fr: "@aHank Hoffman Sr@bMais c'est son canasson, Marylou, qui l'a ramené. Vivant, heureusement, mais couvert de sangⓠ\n@c2@"
  it: "@aJohn Dwayne Sr.@bFu la sua cavalla Marilù a riportarlo indietro, vivo per miracolo e tutto insanguinato!\n@c2@"
  ja: "@a@b＊「でも　馬のパトリシアが\n\t血まみれの　あいつを背中に乗せて\n\t戻ってきて……。\n@c2@"
"16":
  de: "@aHank Hoffman Sr. @bHat seither keiner Menschenseele mehr vertrauen können.\n@c2@"
  en: "@aHank Hoffman Sr.@bHe ain't been able to trust a soul ever since.\n@c2@"
  es: "@aJuancho@bDesde entonces ha sido incapaz de confiar en nadie.\n@c2@"
  fr: "@aHank Hoffman Sr@bDepuis, y fait plus confiance à personne.\n@c2@"
  it: "@aJohn Dwayne Sr.@bDa allora, non si fida più di nessuno.\n@c2@"
  ja: "@a@b＊「それ以来　あいつは人を　まったく\n\t信じなくなってしまったのです。\n@c2@"
"17":
  de: "@aHank Hoffman Sr. @bIch weiß immer noch nicht, was in der Höhle mit ihm geschehen ist. Er will's nicht mal seinem eigenen Dad erzählen.\n@c2@"
  en: "@aHank Hoffman Sr.@bI still don't know what happened to him at that cave. He won't even tell his own daddy.\n@c2@"
  es: "@aJuancho@bTodavía no sé qué le pudo ocurrir en aquella cueva. Ni siquiera se lo cuenta a su padrecito.\n@c2@"
  fr: "@aHank Hoffman Sr@bJ'sais toujours pas c'qui lui est arrivé dans cette caverne. Il veut même pas en parler à son père.\n@c2@"
  it: "@aJohn Dwayne Sr.@bNon ho mai saputo cosa sia successo in quella grotta. Non lo ha raccontato nemmeno a me che sono suo padre.\n@c2@"
  ja: "@a@b＊「洞くつで　仲間と何があったのか\n\t私にも話してくれんのです。\n\t親父である　私にも……。\n@c2@"
"18":
  de: "@a@b*: Jetzt sitze ich in der Patsche. Ich wollte den Planwagen ausleihen, um durch die Wüste zu kommen, aber der Kerl ist echt 'ne harte Nuss.\n@c2@"
  en: "@a@b*: Now I'm in a pickle. I was hoping to borrow a wagon to cross the desert, but that guy's a real hard nut.\n@c2@"
  es: "@a@b*: Ahora tengo un serio problema. Esperaba poder pedir prestada una carreta para cruzar el desierto pero ese tipo es duro de roer.\n@c2@"
  fr: "@a@b*ⓢ Me voilà dans le pétrin. J'espérais emprunter un chariot pour traverser le désert, mais ce type est une vraie tête de bois.\n@c2@"
  it: "@a@b*: Sono nei guai. Speravo di prendere in prestito un carro per attraversare il deserto, ma quel tizio non vuole proprio saperne di darmelo.\n@c2@"
  ja: "@a@b＊「困ったなあ。　この砂漠も\n\t馬車でなら　越えられると思ったのに。\n\t持ち主が　あれではなあ……。\n@c2@"
"19":
  de: "@a@bDas ist eine brüchig aussehende Wand, durch die kreuz und quer Risse verlaufen.\n㈡\nAber um sie zu durchbrechen, sind mindestens drei Personen erforderlich.\n@c0@"
  en: "@a@bIt's a fragile-looking wall with cracks all over it. But it would still take at least three people to break it down.\n@c0@"
  es: "@a@bEs una pared de aspecto frágil cubierta de grietas. Pero harían falta al menos tres personas para derribarla.\n@c0@"
  fr: "@a@bIl s'agit d'un mur apparemment fragile, couvert de fissures. Mais il faudrait néanmoins trois personnes minimum pour l'abattre.\n@c0@"
  it: "@a@bIl muro è pieno di crepe e sembra molto fragile. Tuttavia, per abbatterlo servirebbero almeno tre persone.\n@c0@"
  ja: "@a@bヒビの入った　もろそうなカベだ。\nしかし　３人以上いなくては\nこのカベを　壊せそうにない。\n@c0@"
"20":
  de: "@a@bDas ist eine starke Eisentür. Eine Person allein könnte sie niemals öffnen.\n@c0@"
  en: "@a@bIt's a strong iron door. It would be impossible for one person to open it alone.\n@c0@"
  es: "@a@bEs una pesada puerta de hierro. Una persona sola sería incapaz de abrirla.\n@c0@"
  fr: "@a@bIl s'agit d'une solide porte en fer.\nUne personne seule ne peut pas l'ouvrir.\n@c0@"
  it: "@a@bÈ una porta di ferro molto resistente. Una sola persona non potrebbe mai aprirla.\n@c0@"
  ja: "@a@bがんじょうそうな鉄のトビラだ。\nひとりでは　とても開けられない。\n@c0@"
"21":
  de: "@a@bDas ist eine Statue der Göttin, die kalt lächelt.\n@c0@"
  en: "@a@bIt's a statue of the Goddess with a merciless smile.\n@c0@"
  es: "@a@bEs una estatua de la Diosa con una sonrisa inmisericorde.\n@c0@"
  fr: "@a@bIl s'agit d'une statue de la Déesse, qui affiche un sourire impitoyable.\n@c0@"
  it: "@a@bUna statua della dea che sorride in maniera fredda ed enigmatica.\n@c0@"
  ja: "@a@b残酷な笑みをうかべた　女神像だ。\n@c0@"
"22":
  de: "@aMaya@bAch, welch glückliches Geschick! Ihr seid gekommen, um uns zu retten.\n@c1@"
  en: "@aMaya@bOh, thank goodness!\nYou've come to rescue us.\n@c1@"
  es: "@aMaya@b¡Oh, gracias Diosa!\nHa venido en nuestra ayuda.\n@c1@"
  fr: "@aMaya@bOh, par la Déesseⓠ\nVous êtes %H860%X%A120%Xvenu%Z%B120%Xvenue%Z%Y%R000%Xvenues%Yvenus%Z%Z à notre secours.\n@c1@"
  it: "@aMaya@bOh, grazie al cielo!\nFinalmente %H860%Xvieni%Yvenite%Z a salvarci!\n@c1@"
  ja: "@a@bマーニャ「ああ　よかった！\n\t助けにきてくれたのね。\n@c1@"
"23":
  de: "@aMina@bWir verharren hier schon eine lange Weile. Aber wir wussten, Ihr würdet uns früher oder später entdecken.\n@c1@"
  en: "@aMeena@bWe've been waiting here for so long time.\nBut we knew you would be coming to find us sooner or laters.\n@c1@"
  es: "@aMeena@bHemos esperado durante mucho tiempo.\nPero sabíamos que, tarde o temprano, vendría en nuestra busca.\n@c1@"
  fr: "@aMina@bCela fait si longtemps que nous attendons ici.\nMais nous savions que vous viendriez nous retrouver, tôt ou tard.\n@c1@"
  it: "@aMyra@bÈ un pezzo che aspettiamo! Ma sapevamo che prima o poi %H860%Xci avresti%Yci avreste%Z soccorso...\n@c1@"
  ja: "@a@bミネア「私たち　あなたが　きっと\n\t私たちを探しているだろうと思って\n\tずっと　待ってたんですよ。\n@c1@"
"24":
  de: "@aMaya@bUnd wie! Wir verharren hier schon eine sehr endlose Weile...\n@c1@"
  en: "@aMaya@bArey, yes! We've been waiting a long, long time...\n@c1@"
  es: "@aMaya@b¡Eso es! ¡Llevamos esperando mucho, mucho tiempo...\n@c1@"
  fr: "@aMaya@bArey, ouiⓠ Nous avons attendu très, très longtemps...\n@c1@"
  it: "@aMaya@bMeno male! Da quanto tempo aspettavamo...\n@c1@"
  ja: "@a@bマーニャ「そうそう。\n\tどんなに　待ちこがれたことか。\n@c1@"
"25":
  de: "@aMina@b... damit Ihr uns in die Falle geht!\n@c1@"
  en: "@aMeena@b...for you to fall into our trap!\n@c1@"
  es: "@aMeena@b... a que cayera en nuestra trampa!\n@c1@"
  fr: "@aMina@b... que vous tombiez dans notre piègeⓠ\n@c1@"
  it: "@aMyra@b... che %H860%Xcadessi%Ycadeste%Z... nella nostra trappola!\n@c1@"
  ja: "@a@bミネア「あなたが　地獄に落ちるのをね。\n@c1@"
"26":
  de: "@a@b*: Ka ka ka! \nWenn ich diese hier verschlungen habe, dann %H860%Xkommst du%Ykommt ihr%Z dran!\n@c1@"
  en: "@a@b*: Ka ka ka!\nWhen I've gobbled these up, you'll be next!\nJust wait your turn quietly.\n@c1@"
  es: "@a@b*: ¡Ja, ja, ja!\n¡Cuando las haya engullido, serás %A120%Xel próximo%Z%B120%Xla próxima%Z!\nEspera pacientemente tu turno.\n@c1@"
  fr: "@a@b*ⓢ Niark, niark, niarkⓠ\nQuand j'aurai avalé ces deux-là, ce sera à vousⓠ\nAttendez tranquillement votre tour.\n@c1@"
  it: "@a@b*: Ka! Ka! Ka!\nQuando avrò finito di spolparle, sarà il %H860%Xtuo%Yvostro%Z turno!\nNon %H860%Xavere fretta%Yabbiate fretta%Z, su!\n@c1@"
  ja: "@a@b＊「ケケケ！\n\tあいつらを食ったら　次はお前だ。\n\tそこで　おとなしく待っていろよ！\n@c1@"
"27":
  de: "@a@b*: Ka ka ka! \nEuer Menschenblut gibt uns Ungeheuern köstliche Kraft.\n@c1@"
  en: "@a@b*: Ka ka ka!\nYour human blood feeds us monsters with delicious power.\n@c1@"
  es: "@a@b*: ¡Ja, ja, ja!\nLa sangre humana nos concede a los monstruos un delicioso poder.\n@c1@"
  fr: "@a@b*ⓢ Niark, niark, niarkⓠ\nLe sang humain nous donne une délicieuse puissance, à nous autres monstres.\n@c1@"
  it: "@a@b*: Ka! Ka! Ka!\nIl sangue degli umani dà a noi mostri poteri incredibili.\n@c1@"
  ja: "@a@b＊「ケケケ！\n\t人間の生き血は　われら魔族の\n\tチカラのみなもとナリ。\n@c1@"
"28":
  de: "@aMaya@bWarum habt Ihr solch endlose Weile gebraucht? Wir würden jetzt wirklich gern gerettet werden!\n@c1@"
  en: "@aMaya@bWhat has been taking you so long?\nWe're really needing your rescuing here.\n@c1@"
  es: "@aMaya@b¿Por qué ha tardado tanto?\nRealmente necesitábamos su ayuda.\n@c1@"
  fr: "@aMaya@bPourquoi avez-vous mis autant de tempsⓡ\nNous avons vraiment besoin de votre aide, ici.\n@c1@"
  it: "@aMaya@bPerché ci %H860%Xhai%Yavete%Z messo tanto?\nAbbiamo bisogno del %H860%Xtuo%Yvostro%Z aiuto!\n@c1@"
  ja: "@a@bマーニャ「やっと　助けに来たのね。\n\tいったい　何やってたのよ！\n@c1@"
"29":
  de: "@aMaya@bWas? Ihr habt oben gegen ein paar Ungeheuer gefochten, die uns glichen? Also bitte, seid Ihr nicht mehr ganz bei Verstand?\n@c1@"
  en: "@aMaya@bWhat? You were fighting some monsters who looked like us upstairs? Are you crazy, please?\n@c1@"
  es: "@aMaya@b¿Qué? ¿Que estaba luchando en el piso de arriba con unos monstruos que se parecían a nosotras? ¿Está bien de la cabeza?\n@c1@"
  fr: "@aMaya@bQuoiⓡ Vous combattiez des monstres qui nous ressemblaient, là-hautⓡ Vous avez perdu la têteⓡ\n@c1@"
  it: "@aMaya@bCosa? %H860%XEri%YEravate%Z al piano di sopra a combattere con dei mostri che ci somigliavano? Ma roba da matti!\n@c1@"
  ja: "@a@bマーニャ「えっ！？　さっき上で\n\tあたしたちのニセ者に　おそわれて\n\t来るのが　おくれたですって？\n@c1@"
"30":
  de: "@aMaya@bKommt schon! Wenn wir uns nicht sputen, werden wir noch bei lebendigem Leibe aufgefressen!\n@c1@"
  en: "@aMaya@bCome on! If you don't get moving, we will all be eaten alive.\n@c1@"
  es: "@aMaya@b¡Vamos! Si no se mueve, nos comerán vivos a todos.\n@c1@"
  fr: "@aMaya@bViteⓠ Si vous ne bougez pas, nous allons nous faire dévorer.\n@c1@"
  it: "@aMaya@bForza! Se non %H860%Xti dai%Yvi date%Z una mossa, finiremo in pasto a queste orribili creature!\n@c1@"
  ja: "@a@bマーニャ「あー　もうっ！\n\tそんなこと　どうでもいいわ！\n\tこのままじゃ　食べられちゃうわ。\n@c1@"
"31":
  de: "@aMina@bMaya ist im Recht. Die Ungeheuer werden uns erst in Ruhe lassen, wenn sie den letzten Tropfen Blut rausgesaugt haben...\n@c1@"
  en: "@aMeena@bMaya is right. The monsters won't stop until they've sucked every last drop of blood...\n@c1@"
  es: "@aMeena@bMaya tiene razón. ¡Los monstruos no pararán hasta que hayan chupado hasta la última gota de sangre de...\n@c1@"
  fr: "@aMina@bMaya a raison. Les monstres ne s'arrêteront pas tant qu'il n'auront pas aspiré jusqu'à la dernière goutte...\n@c1@"
  it: "@aMyra@bMaya ha ragione. I mostri non si fermeranno finché non avranno succhiato l'ultima goccia di sangue...\n@c1@"
  ja: "@a@bミネア「そうそう　あいつらに\n\t一滴のこらず　生き血を吸われて\n\t死んでしまうわ。\n@c1@"
"32":
  de: "@aMaya@b... und zwar aus %H860%Xdir%Yeuch%Z!\n@c1@"
  en: "@aMaya@b...out of you!\n@c1@"
  es: "@aMaya@b... su cuerpo!\n@c1@"
  fr: "@aMaya@b... de votre sangⓠ\n@c1@"
  it: "@aMaya@bIl %H860%Xtuo%Yvostro%Z sangue!\n@c1@"
  ja: "@a@bマーニャ「……あたしらじゃなく\n\tあんただけがね！\n@c1@"
"33":
  de: "@aMaya@bWie konntet Ihr uns das antun?! Wir warten schon seit einer endlosen Ewigkeit hier unten!\n@c1@"
  en: "@aMaya@bHow could you be doing this to us!?\nWe've been down here forever!\n@c1@"
  es: "@aMaya@b¿Por qué nos hace esto?\n¡Llevamos una eternidad aquí abajo!\n@c1@"
  fr: "@aMaya@bComment avez-vous pu nous faire çaⓠⓑ\nCela fait une éternité que nous sommes làⓠ\n@c1@"
  it: "@aMaya@bPerché ci %H860%Xhai%Yavete%Z messo tutto questo tempo?!\nSiamo qui sotto da una vita!\n@c1@"
  ja: "@a@bマーニャ「ひどいわ！　見捨てるなんて。\n@c1@"
"34":
  de: "@aMaya@bWie bitte?! Ob es in der Tat wir sind?! Ihr seid von Ungeheuern angegriffen worden, die uns gleichen?\n㈡\nUnd nun hegt Ihr den Verdacht, wir seien auch Ungeheuer?\n@c1@"
  en: "@aMaya@bWhat? Is it really us!?\nYou were attacked by monsters looking like us, and now you think we are monsters, too?\n@c1@"
  es: "@aMaya@b¿Qué? ¿Que si somos realmente nosotras? ¿Le atacaron unos monstruos que se parecían a nosotras y ahora cree que somos monstruos?\n@c1@"
  fr: "@aMaya@bQuoiⓡ Si c'est vraiment nousⓠⓑ\nVous avez été %H860%X%A120%Xattaqué%Z%B120%Xattaquée%Z%Y%R000%Xattaquées%Yattaqués%Z%Z par des monstres qui nous ressemblaient...\n㈡\n... et à présent, vous croyez que nous sommes des monstres, nous aussiⓡ\n@c1@"
  it: "@aMaya@bCosa? Se siamo davvero noi?! Delle creature malefiche che ci somigliavano %H860%Xti%Yvi%Z hanno aggredito e ora %H860%Xpensi%Ypensate%Z che anche noi siamo dei mostri?\n@c1@"
  ja: "@a@bマーニャ「えっ！？　さっき上で\n\tあたしらのニセ者に　おそわれたから\n\tあたしたちも　ニセ者じゃないかって？\n@c1@"
"35":
  de: "@aMaya@bIhr verwahrt wirklich nicht mehr alles Kristall in der Vitrine, oder?\n㈡\nRedet doch nicht solchen Unfug ⓚⓛ helft uns! Sonst werden wir noch bei lebendigem Leibe aufgefressen.\n@c1@"
  en: "@aMaya@bYou are really off your nut, no? Stop talking all this silly-billy nonsense and help us! Otherwise we will all be eaten alive.\n@c1@"
  es: "@aMaya@bVerdaderamente, ha perdido la cabeza. ¡Deje de decir esa sarta de sandeces y ayúdenos! Si no lo hace, nos comerán vivas.\n@c1@"
  fr: "@aMaya@bMais vous avez perdu la tête ou quoiⓡ Arrêtez de raconter toutes ces bêtises et aidez-nousⓠ Sinon nous allons %R000%Xtoutes%Ytous%Z nous faire dévorer.\n@c1@"
  it: "@aMaya@bMa %H860%Xti%Yvi%Z ha dato di volta il cervello? Basta cavolate e %H860%Xtiraci%Ytirateci%Z fuori dai guai, o quei mostri ci mangeranno vive!\n@c1@"
  ja: "@a@bマーニャ「バカね　そんなわけないでしょ。\n\tそれより　はやく　助けてよ！\n\tこのままじゃ　食べられちゃうわ。\n@c1@"
"36":
  de: "@aMaya@bWaah, %a00090! Ihr seid da, um uns zu retten! Haha! Aber so dumm sind wir nicht mehr!\n@c1@"
  en: "@aMaya@bWaah, %a00090! You've come to save us!\nWell! We're not so stupid any more!\n@c1@"
  es: "@aMaya@b¡Aaah, %a00090! ¡Ha venido en nuestra ayuda!\n¡Bueno! ¡Esta vez no nos engañará!\n@c1@"
  fr: "@aMaya@bOuais, %a00090ⓠ Vous êtes %A090%Xvenu%Z%B090%Xvenue%Z nous sauver, bien sûrⓠ Sauf que nous ne sommes plus aussi naïvesⓠ\n@c1@"
  it: "@aMaya@bOh, %a00090! Sei %A090%Xvenuto%Z%B090%Xvenuta%Z a prenderci, vero?\nBene! Ma non siamo più così stupide!\n@c1@"
  ja: "@a@bマーニャ「ああ　%a00090\n\tよかった　助けにきてくれたのね！\n\tて　言うと思ったでしょ……。\n@c1@"
"37":
  de: "@aMaya@bWir wiegen uns in der Sicherheit, dass %H860%Xdu nur ein Ungeheuer bist, das so aussieht wie %a00090%Yihr nur ausseht wie %a00090 und die anderen, aber in Wirklichkeit Ungeheuer seid%Z!\n㈡\nDiesmal geht's %H860%Xdir%Yeuch%Z an den Kragen!\n@c1@"
  en: "@aMaya@bWe know you're just %H860%Xa monster who is looking like %a00090%Ylooking like %a00090 and the others. But really you are monsters%Z. You're dead meat this time!\n@c1@"
  es: "@aMaya@bSabemos que %H860%Xes un monstruo con el aspecto de %a00090%Yos parecéis a %a00090 y compañía. Pero que en realidad sois monstruos%Z. ¡Esta vez será %H860%Xsu%Yvuestro%Z fin!\n@c1@"
  fr: "@aMaya@bNous savons que %H860%Xvous n'êtes qu'un monstre ressemblant à %a00090%Yvous ressemblez à %a00090 et aux autres. Mais en réalité, vous êtes des monstres%Z. Cette fois, c'en est fini de vousⓠ\n@c1@"
  it: "@aMaya@bSappiamo che %H860%Xsei solo un mostro che ha preso le sembianze di %a00090%Ysiete solo dei mostri che hanno preso le sembianze di %a00090 e degli altri%Z! Stavolta non %H860%Xte la caverai%Yve la caverete%Z!\n@c1@"
  ja: "@a@bマーニャ「でも　もうだまされないわよ！\n\t%a00090に化けた　ニセ者め！\n\t今度は　こっちからいくわよ！\n@c1@"
"38":
  de: "@aMina@bNein! Warte, Maya! Ich glaube, diesmal ist es wirklich %a00090. Das spüre ich.\n@c1@"
  en: "@aMeena@bNo! Wait, sis.\nI think this is really %a00090.\nI can feel it.\n@c1@"
  es: "@aMeena@b¡No! Espera, hermana.\nCreo que realmente es %a00090.\nPuedo sentirlo.\n@c1@"
  fr: "@aMina@bNonⓠ Attends, sœurette.\nJe crois que cette fois, c'est vraiment %a00090.\nJe le sens.\n@c1@"
  it: "@aMyra@bNo! Aspetta, sorellina.\nCredo che sia davvero %a00090.\nLo sento.\n@c1@"
  ja: "@a@bミネア「待って　姉さん！\n\tこの人は本物の　%a00090みたい。\n\t私には　わかるわ……。\n@c1@"
"39":
  de: "@aMaya@bHm. Ja, vielleicht. Na gut. Ich mache eine Erkundigung, auf die nur %a00120 antworten kann.\n㈡\nIm Kasino von Endor, da war es doch Mina, die das ganze Geld verspielt hat, nicht wahr?\n@c1@"
  en: "@aMaya@bHm. Maybe... Okay, then. I'll ask a question that only %a00120 would know the answer to.\n㈡\nMeena was the one wasting all the money at the Endor casino, right?\n@c1@"
  es: "@aMaya@bMmm. Puede... Muy bien. Le formularé una pregunta que solo %a00120 podría contestar.\n㈡\nMeena fue la que se gastó todo el dinero en el casino de Endor, ¿no es cierto?\n@c1@"
  fr: "@aMaya@bMmm... Peut-être... Très bien. Alors je vais poser une question à laquelle %A120%Xseul%Z%B120%Xseule%Z %a00120 pourra répondre.\n㈡\nC'est Mina qui dépensait tout l'argent au casino de Chandor, exactⓡ\n@c1@"
  it: "@aMaya@bUhm. Forse... Ok, allora farò una domanda a cui solo %a00120 saprebbe rispondere.\n㈡\nEra Myra che sprecava tutti i soldi al casinò, vero?\n@c1@"
  ja: "@a@bマーニャ「ほんとかなあ…んじゃ　問題。\n\tエンドールのカジノで　スッてたのは\n\tミネアである。　どう？　あってる？\n@c1@"
"40":
  de: "@aMaya@bNein! Ich war es! %H860%XDu bist ein%YIhr seid%Z Ungeheuer, das habe ich doch gewusst!\n@c1@"
  en: "@aMaya@bNo! It was me!\nYou're %H860%Xa monster%Ymonsters%Z, just like I was thinking!\n@c1@"
  es: "@aMaya@b¡No! ¡Fui yo!\n¡%H860%XEs un monstruo%YSois monstruos%Z, tal y como pensaba!\n@c1@"
  fr: "@aMaya@bNonⓠ C'était moiⓠ\nVous êtes %H860%Xun monstre%Ydes monstres%Z, c'est bien ce que je pensaisⓠ\n@c1@"
  it: "@aMaya@bNo! Ero io!\n%H860%XSei un mostro%YSiete dei mostri%Z, proprio come sospettavo!\n@c1@"
  ja: "@a@bマーニャ「ほら　やっぱり！\n\tこいつは　魔物が化けてるのよ！\n@c1@"
"41":
  de: "@aMina@bNein, Maya. Das glaube ich nicht. Ihr seid es doch wirklich, nicht, %a00090? Ihr wollt uns doch nur veräppeln, oder?\n@c1@"
  en: "@aMeena@bNo, sis. I don't think so.\nIt is you, isn't it, %a00090?\nYou're just joking with us, no?\n@c1@"
  es: "@aMeena@bNo, hermana. No lo creo.\nEs usted, ¿verdad, %a00090?\nSolo quiere bromear con nosotras, ¿no?\n@c1@"
  fr: "@aMina@bNon, sœurette. Je ne crois pas.\nC'est bien vous, n'est-ce pas, %a00090ⓡ\nVous nous faites juste une blague, nonⓡ\n@c1@"
  it: "@aMyra@bNo, sorellona. Non credo.\nSei davvero tu, %a00090, giusto?\nCi stai solo prendendo in giro, vero?\n@c1@"
  ja: "@a@bミネア「そんなはずは　ないわ。\n\tねえ　%a00090　ウソでしょ。\n\tあなた　%a00090よね！\n@c1@"
"42":
  de: "@aMaya@bHmpf. Die Frage war ja auch ziemlich leicht. Aber dann seid Ihr wohl %A120%Xder%Z%B120%Xdie%Z echte %a00120.\n@c1@"
  en: "@aMaya@bHmph. It was an easy-peasy question.\nBut...I suppose you must be the real %a00120.\n@c1@"
  es: "@aMaya@bUmpf. Era una pregunta demasiado fácil.\nPero... imagino que sois %a00120 de verdad.\n@c1@"
  fr: "@aMaya@bMmpf. C'était une question très facile.\nMais bon... je suppose que vous devez être %A120%Xle vrai%Z%B120%Xla vraie%Z %a00120.\n@c1@"
  it: "@aMaya@bUhm... Era una domanda facilissima.\nMa... Credo che tu sia davvero %a00120.\n@c1@"
  ja: "@a@bマーニャ「いちおう　正解だわね。\n\tどうやら　本物みたい。\n@c1@"
"43":
  de: "@aMina@bBitte verzeiht, dass wir an Euch zweifelten. Wir wurden bereits von so vielen Ungeheuern angegriffen, die sich für Euch ausgaben.\n@c1@"
  en: "@aMeena@bI'm sorry we doubted you, please.\nIt's just that we were attacked by so many monsters pretending to be you.\n@c1@"
  es: "@aMeena@bSiento haber dudado, lo siento.\nHemos sido atacadas por tantos monstruos que pretendían ser quien no eran.\n@c1@"
  fr: "@aMina@bPardon d'avoir douté de vous. C'est juste que nous avons été attaquées par tellement de monstres qui se faisaient passer pour vous.\n@c1@"
  it: "@aMyra@bMi spiace aver dubitato di %H860%Xte%Yvoi%Z.\nIl fatto è che siamo state aggredite da tantissimi mostri che %H860%Xti%Yvi%Z somigliavano.\n@c1@"
  ja: "@a@bミネア「うたがって　ごめんなさい。\n\t私たち　あなたのニセ者に\n\tいやってほど　襲われたから……。\n@c1@"
"44":
  de: "@aMaya@bAber wir können ja nicht für immerdar an Euch zweifeln. Ich nehme an, wir müssen einfach unser Vertrauen in Euch setzen.\n@c1@"
  en: "@aMaya@bWe can't go on doubting you forever.\nI suppose we have to trust you.\n@c1@"
  es: "@aMaya@bNo podemos seguir dudando siempre.\nImagino que habrá que confiar.\n@c1@"
  fr: "@aMaya@bNous ne pouvons pas continuer à douter éternellement. Je crois que nous devons vous faire confiance.\n@c1@"
  it: "@aMaya@bNon possiamo passare la vita a sospettare di chiunque! Non ci rimane che fidarci...\n@c1@"
  ja: "@a@bマーニャ「まー　うたがったらキリないし\n\tとりあえず　信じてみよっか。\n@c1@"
"45":
  de: "@aMina@bAlso gut. Ziehen wir los!\n@c1@"
  en: "@aMeena@bOkay, then. Let's go!\n@c1@"
  es: "@aMeena@bBueno, pues entonces... ¡En marcha!\n@c1@"
  fr: "@aMina@bBien. Alors, allons-yⓠ\n@c1@"
  it: "@aMyra@bD'accordo. Andiamo.\n@c1@"
  ja: "@a@bミネア「さあ　行きましょう！\n@c1@"
