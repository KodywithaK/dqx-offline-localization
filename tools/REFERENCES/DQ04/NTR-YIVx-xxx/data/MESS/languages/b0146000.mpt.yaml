"0":
  de: "@a@b*: Was hat das zu bedeuten...?\n@c2@"
  en: "@a@b*: What is the meaning ofⓚⓛ\n@c2@"
  es: "@a@b*: ¿Qué significa...?\n@c2@"
  fr: "@a@b*ⓢ Que signifie...\n@c2@"
  it: "@a@b*: Cosa significa...\n@c2@"
  ja: "@a@b＊「うーむ　あれはいったい……。\n@c2@"
"1":
  de: "@a@b*: Seiet voller Ehrfurcht angesichts des irdischen Gartens der Göttin, %H860%X%A120%XReisender%Z%B120%XReisende%Z%YReisende%Z! Dies ist der Azimuth, das Tor nach Zenithia!\n@c2@"
  en: "@a@b*: Behold, %H860%Xa traveller%Ytravellers%Z of the Goddess's earthly garden! Stand humbled at the Azimuth, gateway to Zenithia!\n@c2@"
  es: "@a@b*: ¡%H860%X%A120%XViajero%Z%B120%XViajera%Z%Y%R000%XViajeras%YViajeros%Z%Z del terrenal jardín de la Diosa! ¡%H860%XPóstrate%YPostraos%Z ante el Azimut, la puerta de entrada a Zenithia!\n@c2@"
  fr: "@a@b*ⓢ Voici %H860%X%A120%Xun voyageur%Z%B120%Xune voyageuse%Z%Y%R000%Xdes voyageuses%Ydes voyageurs%Z%Z du jardin terrestre de la Déesseⓠ Que votre présence à l'Azimuth, porte de Zénithia, vous emplisse d'humilitéⓠ\n@c2@"
  it: "@a@b*: %H860%XPecorella%YPecorelle%Z del gregge della dea! %H860%XProstrati%YProstratevi%Z dinanzi all'Azimut, ingresso per Zenithia!\n@c2@"
  ja: "@a@b＊「おお！　旅の者か。\n\tここは　天空にいちばん近い町\n\tゴットサイド。\n@c2@"
"2":
  de: "@a@b*: Es heißt, dass ein unheilvoller Riss den himmlischen Altar dieses heiligen Ortes entweiht hat.\n@c2@"
  en: "@a@b*: There is talk of an unearthly rupture that has rent the divine altar of this sacred place.\n@c2@"
  es: "@a@b*: Se habla sobre una ruptura sobrenatural que ha desgajado el altar divino de este lugar sagrado.\n@c2@"
  fr: "@a@b*ⓢ On dit qu'une rupture surnaturelle aurait fendu l'autel divin de cet endroit sacré.\n@c2@"
  it: "@a@b*: Circola voce di un empio squarcio che ha fatto cedere l'altare divino di questo luogo sacro.\n@c2@"
  ja: "@a@b＊「この町の祭壇に　とつぜん\n\t大きな穴が　開いたのだ。\n@c2@"
"3":
  de: "@a@b*: Steht uns denn das Ende der Welt bevor? Werden die Götter uns alle vors letzte Gericht stellen? \n㈡\n*: Oder stehen wir kurz davor, die Segnung zu erfahren? Ach, was hat das zu bedeuten?!\n@c2@"
  en: "@a@b*: Is this the Day of Judgement? Do the gods today preside over the Holy Court of Justice?\nOr are we led now to benediction?\n㈡\n*: What is the meaning of this!?\n@c2@"
  es: "@a@b*: ¿Es este el Día del Juicio? ¿Están hoy los dioses reunidos en el Sagrado Tribunal de la Justicia?\n¿O es acaso una bendición lo que debemos esperar?\n㈡\n*: ¡¿Cuál es el significado de todo esto?!\n@c2@"
  fr: "@a@b*ⓢ Est-ce le Jour du Jugementⓡ Les dieux président-ils aujourd'hui la Cour de la Justice sacréeⓡ Ou bien allons-nous vers une bénédictionⓡ\n㈡\n*ⓢ Que signifie tout ceciⓠⓑ\n@c2@"
  it: "@a@b*: È forse arrivato il giorno del giudizio? Gli dei oggi presiedono la corte della giustizia celeste? Stiamo per raggiungere la benedizione eterna?\n㈡\n*: Quale può essere il significato di tutto ciò?!\n@c2@"
  ja: "@a@b＊「あれは　神の裁き　いや\n\t栄光への導きなのか……？\n\tわれわれにも　わからぬのだ。\n@c2@"
"4":
  de: "@a@b*: Die Göttin wird Ihre Schäflein schützen. Folgt Ihrem göttlichen Licht, und Wunder werden Euren Weg pflastern.\n@c2@"
  en: "@a@b*: The Goddess will guide Her sheep.\nFollow Her divine light, and miracles will bless your eyes.\n@c2@"
  es: "@a@b*: La Diosa guiará a Su rebaño.\n%H860%XSigue%YSeguid%Z Su divina luz y %H860%Xtus%Yvuestros%Z ojos se verán bendecidos con milagros.\n@c2@"
  fr: "@a@b*ⓢ La Déesse guidera Ses brebis.\nSuivez Sa lumière divine et les miracles béniront vos yeux.\n@c2@"
  it: "@a@b*: La dea guiderà il cammino delle sue pecorelle. %H860%XSegui%YSeguite%Z la sua luce divina, e miracoli portentosi accadranno sotto i %H860%Xtuoi%Yvostri%Z occhi.\n@c2@"
  ja: "@a@b＊「神の導きのまま　進むなら\n\tあなたの前に　奇跡が\n\t示されることもあるでしょう。\n@c2@"
"5":
  de: "@a@b*: Und obgleich der Weg manches Mal steinig ist, dürft Ihr nicht den Glauben verlieren, %H860%Xmein Kind%Ymeine Kinder%Z! Es erwarten Euch große Wunder.\n@c2@"
  en: "@a@b*: Though the path is ever treacherous, have faith, my %H860%Xchild%Ychildren%Z! Great wonders await you.\n@c2@"
  es: "@a@b*: ¡Aunque el camino es traicionero, %H860%Xdebes%Ydebéis%Z tener fe, %H860%X%A120%Xhijo mío%Z%B120%Xhija mía%Z%Y%R000%Xhijas mías%Yhijos míos%Z%Z! Maravillas sin igual %H860%Xte%Yos%Z esperan.\n@c2@"
  fr: "@a@b*ⓢ Même si le chemin est semé d'embûches, gardez la foi, %H860%Xmon enfant%Ymes enfants%Zⓠ De grandes merveilles vous attendent.\n@c2@"
  it: "@a@b*: Anche se il cammino si rivelerà impervio, %H860%Xabbi fede%Yabbiate fede%Z! Indicibili meraviglie %H860%Xti%Yvi%Z attendono.\n@c2@"
  ja: "@a@b＊「道は　いつでも険しいもの。\n\tだが恐れず進みなさい。\n\t奇跡は　あなたを待っています。\n@c2@"
"6":
  de: "@a@b*: Nehmt Euch in Acht vor Trauer und Sorge. Denn jene mit schwerem Herzen beflügeln das Böse.\n@c1@"
  en: "@a@b*: Beware the dangers of sorrow and grief. Those with heavy hearts are vessels of the Wicked One.\n@c1@"
  es: "@a@b*: %H860%XGuárdate%YGuardaos%Z de los peligros que conllevan la pena y el sufrimiento. Aquellos que llevan un peso en el corazón son prisioneros del Maligno.\n@c1@"
  fr: "@a@b*ⓢ Ne vous laissez pas aller au chagrin et à la tristesse. Les êtres au cœur lourd sont les émissaires du Malin.\n@c1@"
  it: "@a@b*: %H860%XFai%YFate%Z attenzione ai pericoli derivanti dal dolore e dalla sofferenza. Chi ha il cuore affannato diviene messaggero del malvagio.\n@c1@"
  ja: "@a@b＊「深いなげきは　やがて\n\tその者の心を　闇に染めます。\n@c1@"
"7":
  de: "@a@b*: Doch wir alle sind gesegnet in diese Welt geboren worden. Gesegnet von der wahren Gottheit, der Allmächtigen Göttin!\n@c1@"
  en: "@a@b*: But all are born into this world blessed. Blessed by the one true deity, the Almighty Goddess!\n@c1@"
  es: "@a@b*: Pero todos nacemos con una bendición. Bendecidos por la única divinidad verdadera, ¡la Diosa todopoderosa!\n@c1@"
  fr: "@a@b*ⓢ Mais tous sont nés bénis. Bénis par la seule véritable divinité, la Toute-puissante Déesseⓠ\n@c1@"
  it: "@a@b*: Ma tutti sono nati su questo mondo che è stato benedetto dalla sola e unica divinità, la dea onnipotente!\n@c1@"
  ja: "@a@b＊「けれど　この世に\n\t生まれ落ちた時は　誰もが\n\t光に　つつまれていたのです。\n@c1@"
"8":
  de: "@a@b*: Estark, der den lodernden Flammen Nadirias entstieg, wurde von %A090%Xeinem großen Helden%Z%B090%Xeiner großen Heldin%Z besiegt, so wie es die Prophezeiung vorausgesagt hatte.\n@c1@"
  en: "@a@b*: Estark, born of the fiery flames of Nadiria, was struck down by a great %A090%Xhero%Z%B090%Xheroine%Z, just as the prophecy foretold.\n@c1@"
  es: "@a@b*: Estark, nacido de las ardientes llamas de Nadiria, fue derrotado por %A090%Xun gran héroe%Z%B090%Xuna gran heroína%Z, tal y como predijo la profecía.\n@c1@"
  fr: "@a@b*ⓢ Estark, né des flammes ardentes de Nadiria, a été terrassé par un%A090%X grand héros%Z%B090%Xe grande héroïne%Z, comme la prophétie l'avait prédit.\n@c1@"
  it: "@a@b*: Estark, generato dalle ardenti fiamme di Nadiria, è stato sconfitto da %A090%Xun eroe%Z%B090%Xun'eroina%Z, proprio come aveva preconizzato la profezia.\n@c1@"
  ja: "@a@b＊「地獄から復活した　エスタークは\n\t予言通り　勇者によって\n\t倒されたそうです。\n@c1@"
"9":
  de: "@a@b*: Doch nun strebt er nach Wiedergeburt. In seiner gequälten und gepeinigten Seele regt sich eine neue Teufelsmacht.\n@c1@"
  en: "@a@b*: But now he strives to be reborn. A new evil stirs within his condemned and tormented soul.\n@c1@"
  es: "@a@b*: Pero ahora él lucha por renacer. Un nuevo poder maligno habita en su alma atormentada y condenada.\n@c1@"
  fr: "@a@b*ⓢ Mais maintenant, il n'aspire qu'à une choseⓢ se réveiller à nouveau. Un nouveau plan maléfique a été élaboré par son âme damnée.\n@c1@"
  it: "@a@b*: Tuttavia, egli sta tentando con ogni mezzo di tornare in vita. Un nuovo male si agita nella sua anima triste e tormentata. \n@c1@"
  ja: "@a@b＊「しかし　今　まさに\n\t第二のエスタークが\n\t生まれようとしているのです！\n@c1@"
"10":
  de: "@a@b*: Was war das nur...?\n@c2@"
  en: "@a@b*: What was it...?\n@c2@"
  es: "@a@b*: ¿Cómo era...?\n@c2@"
  fr: "@a@b*ⓢ Qu'était-ce...ⓡ\n@c2@"
  it: "@a@b*: Cos'è stato...?\n@c2@"
  ja: "@a@b＊「いったい　あれは……？\n@c2@"
"11":
  de: "@a@b*: Wie bei Vollmond die Erde gebebt hat... Und dann, d-dieser gottlose Riss im Podium über uns...\n@c2@"
  en: "@a@b*: On the night of the full moon, those tr-tremors from the ground...\n㈡\n*: And then, th-there was an unholy ru-rupture formed in the dais above...\n@c2@"
  es: "@a@b*: En noche de luna llena, esos temblores de tierra...\n㈡\n*: Y ahora, esa impía ruptura del altar ahí arriba...\n@c2@"
  fr: "@a@b*ⓢ La nuit de la pleine lune, ces gron-grondements venus du sol...\n㈡\n*ⓢ Puis il y eu cette ru-rupture surnaturelle dans l'autel au-dessus...\n@c2@"
  it: "@a@b*: Qu-quelle scosse provenienti dal suolo in una notte di luna piena...\n㈡\n*: E quell'empia c-crepa che si è formata nella piattaforma in alto...\n@c2@"
  ja: "@a@b＊「この前の　満月の夜のことじゃ。\n\tおそろしい　地響きがしたかと\n\t思うたら　なんと　あの上に……！\n@c2@"
"12":
  de: "@a@b*: Unser Unwissen macht uns gänzlich machtlos! Ist dies das Werk der Götter, oder treiben die Monster ein falsches Spiel mit uns?\n@c2@"
  en: "@a@b*: Our ignorance leaves us impotent! Is this the work of the gods, or the trickery of monsters?\n@c2@"
  es: "@a@b*: ¡Nuestra ignorancia nos hace impotentes! ¿Es esto obra de los dioses, o una añagaza de los monstruos?\n@c2@"
  fr: "@a@b*ⓢ Notre ignorance nous condamne à l'impuissanceⓠ Est-ce là l'œuvre des dieux ou une ruse des monstresⓡ\n@c2@"
  it: "@a@b*: La nostra ignoranza ci rende impotenti! È opera degli dei, o forse si tratta di un maleficio dei mostri?\n@c2@"
  ja: "@a@b＊「これは　神のおちからか\n\tそれとも魔物のしわざか\n\tうーむ……。\n@c2@"
"13":
  de: "@a@b*: Habt Ihr von dem heiligen Altar gehört? Habt Ihr gesehen, was mit ihm geschah?\n@c2@"
  en: "@a@b*: Have you laid eyes on the holy altar?\nHave you seen what hath befallen it?\n@c2@"
  es: "@a@b*: ¿%H860%XTe has%YOs habéis%Z fijado en el altar sagrado?\n¿%H860%XHas%YHabéis%Z visto lo que le ha sucedido?\n@c2@"
  fr: "@a@b*ⓢ Avez-vous posé les yeux sur l'autel sacréⓡ\nAvez-vous vu ce qui lui est arrivéⓡ\n@c2@"
  it: "@a@b*: %H860%XHai%YAvete%Z rivolto lo sguardo verso il sacro altare? %H860%XHai%YAvete%Z visto cosa è accaduto?\n@c2@"
  ja: "@a@b＊「もう　祭壇の上を\n\tごらんになりましたか？\n@c2@"
"14":
  de: "@a@b*: Ihr seid wahrlich mutig.\nOh, ich muss mit meinen eigenen Augen sehen, was dieses Omen zu bedeuten hat.\n@c2@"
  en: "@a@b*: You are brave indeed.\nOh, I must see for myself what this omen that has been sent to us means.\n@c2@"
  es: "@a@b*: %H860%XEres%YSois%Z realmente %H860%Xuna persona valerosa%Ypersonas valerosas%Z.\nDebo averiguar por mí mismo el significado de este signo que nos ha sido enviado.\n@c2@"
  fr: "@a@b*ⓢ Vous faites preuve d'un réel courage.\nOh, je dois voir par moi-même ce que signifie ce présage qui nous a été envoyé.\n@c2@"
  it: "@a@b*: %H860%XDimostri%YDimostrate%Z molto coraggio, non c'è che dire. Oh, devo sforzarmi di comprendere il significato del presagio che ci è stato inviato.\n@c2@"
  ja: "@a@b＊「なんと　勇気のある方でしょう。\n\tああっ　何が起きているのか\n\tわたしもこの目で確かめたい！\n@c2@"
"15":
  de: "@a@b*: Aber... das kann ich nicht.\nOh, Allmächtiger Hirte, verleih mir die Kraft, diese Stufen hochzusteigen!\n@c2@"
  en: "@a@b*: Yet...I cannot.\nAlmighty Guardian, give me courage to mount these steps!\n@c2@"
  es: "@a@b*: Pero... No puedo.\n¡Custodio todopoderoso, dame el valor para ascender estos peldaños!\n@c2@"
  fr: "@a@b*ⓢ Mais... je n'y arrive pas.\nPuissante Gardienne, donnez-moi le courage de grimper ces marchesⓠ\n@c2@"
  it: "@a@b*: Tuttavia... Non ce la faccio. Guardiana onnipotente, dammi il coraggio di salire questi gradini.\n@c2@"
  ja: "@a@b＊「し　しかしおそろしくて\n\tとても　階段を登れないです。\n\tブルブル……。\n@c2@"
"16":
  de: "@a@b*: Es heißt, etwas Schreckliches habe sich zugetragen! Geht! Seht es selbst!\n@c2@"
  en: "@a@b*: They say something terrible has occurred!\nGo! See for %H860%Xyourself%Yyourselves%Z!\n@c2@"
  es: "@a@b*: ¡Dicen que ha sucedido algo terrible!\n¡Vamos! ¡%H860%XCompruébalo %A120%Xtú mismo%Z%B120%Xtú misma%Z%YComprobadlo %R000%Xvosotras mismas%Yvosotros mismos%Z%Z!\n@c2@"
  fr: "@a@b*ⓢ On dit que quelque chose de terrible s'est produitⓠ Allez-yⓠ Allez voir par %H860%Xvous-même%Yvous-mêmes%Zⓠ\n@c2@"
  it: "@a@b*: Dicono che sia accaduto qualcosa di terribile!\n%H860%XVai%YAndate%Z e %H860%Xguarda con i tuoi%Yguardate con i vostri%Z stessi occhi!\n@c2@"
  ja: "@a@b＊「なにか　たいへんなことが\n\t起きているようですよ！\n\t見てきては　いかがですか？\n@c2@"
"17":
  de: "@a@b*: Selbst ein Herz wie das von Psaro dem Metzler, welches von Hass erkaltet ist, würde bei wahrer Liebe auftauen.\n@c1@"
  en: "@a@b*: Even a heart such as that of Psaro the Manslayer, frozen by hatred, would be thawed by the virtue of true love.\n@c1@"
  es: "@a@b*: Incluso un corazón como el de Psaro el Carnicero, helado por el odio, se derretiría ante la virtud del amor verdadero.\n@c1@"
  fr: "@a@b*ⓢ Même un cœur comme celui de Psaro l'Exterminateur, glacé par la haine, fondrait grâce à la vertu du véritable amour.\n@c1@"
  it: "@a@b*: Anche il cuore gonfio d'odio del perfido Psaro il Massacratore si scioglierebbe, se fosse toccato dalla forza del vero amore.\n@c1@"
  ja: "@a@b＊「憎しみに　いてついた\n\tデスピサロの心も\n\t真実の愛ならば　とかせましょう。\n@c1@"
"18":
  de: "@a@b*: Doch seine wahre Liebe ist bereits rettungslos verloren...\n@c1@"
  en: "@a@b*: Yet his one true love is already beyond salvation.\n@c1@"
  es: "@a@b*: Y sin embargo, su verdadero amor está más allá de toda posibilidad de salvación.\n@c1@"
  fr: "@a@b*ⓢ Mais son unique amour se trouve déjà hors de portée de tout salut.\n@c1@"
  it: "@a@b*: Ma il suo vero amore non può più essere salvato...\n@c1@"
  ja: "@a@b＊「しかし　彼の愛する者は\n\tすでに……。\n@c1@"
"19":
  de: "@a@b*: Vernehmet die Stimme der Göttin, wie ich es getan habe!\n@c3@"
  en: "@a@b*: Open your ears to the voice of the Goddess as I have done!\n@c3@"
  es: "@a@b*: ¡%H860%XAbre tus%YAbrid vuestros%Z oídos a la voz de la Diosa como he hecho yo!\n@c3@"
  fr: "@a@b*ⓢ Accueillez la voix de la Déesse comme je l'ai faitⓠ\n@c3@"
  it: "@a@b*: %H860%XApri il tuo%YAprite il vostro%Z cuore alle parole della dea, così come ho fatto io!\n@c3@"
  ja: "@a@b＊「わたしは　神の声を聞く者。\n@c3@"
"20":
  de: "@a@b*: Ein Pfad hat sich uns geöffnet! \n㈡\n*: In der Nacht, als dieses ohrenbetäubende Beben den Boden unter unseren Füßen erzittern ließ, schenkte uns der Allmächtige einen Pfad!\n@c3@"
  en: "@a@b*: A path has been opened before us!\n㈡\n*: On that very night, the night of the deafening roar that shook the ground under our feet, the Almighty One forged a path!\n@c3@"
  es: "@a@b*: ¡Se ha abierto un camino ante nosotros!\n㈡\n*: ¡Esa misma noche, la noche en que un rugido ensordecedor hizo temblar la tierra bajo nuestros pies, la Todopoderosa abrió un camino!\n@c3@"
  fr: "@a@b*ⓢ Un chemin s'est ouvert devant nousⓠ\n㈡\n*ⓢ Cette nuit même, cette nuit pendant laquelle un grondement assourdissant a ébranlé le sol sous nos pieds, la Toute-Puissante a ouvert un cheminⓠ\n@c3@"
  it: "@a@b*: Davanti a noi si è aperto un sentiero!\n㈡\n*: Proprio la notte in cui si udì il rombo assordante che fece tremare la terra sotto i nostri piedi, l'onnipotente tracciò il cammino!\n@c3@"
  ja: "@a@b＊「ある夜　大地をゆるがす音とともに\n\tこの祭壇に　道は開かれた。\n@c3@"
"21":
  de: "@a@b*: Doch wohin führt er uns? Der heilige Bote der Göttin, der Meister von Zenithia, trägt mir keine Antwort zu!\n@c3@"
  en: "@a@b*: But whither does it lead!?\nThe Holy Envoy of the Goddess, the Master of Zenithia, will not answer me!\n@c3@"
  es: "@a@b*: Pero ¡¿adónde conduce?!\n¡El Sagrado Emisario de la Diosa, el Señor de Zenithia, se niega a responderme!\n@c3@"
  fr: "@a@b*ⓢ Mais où conduit-ilⓠⓑ\nL'Émissaire sacré de la Déesse, le Maître de Zénithia, ne veut pas me répondreⓠ\n@c3@"
  it: "@a@b*: Ma dove ci condurrà questo sentiero?! Il sacro messaggero della dea, il Signore di Zenithia, non vuole rispondere alla mia domanda!\n@c3@"
  ja: "@a@b＊「しかし　この道が\n\tどこへ続くのか　天空の神は\n\t答えてはくださらぬ……。\n@c3@"
"22":
  de: "@a@b*: Zenithdrache, was soll all dies bedeuten?\n@c3@"
  en: "@a@b*: Zenith Dragon, what does this mean?\n@c3@"
  es: "@a@b*: Dragón de Zenithia, ¿qué significa esto?\n@c3@"
  fr: "@a@b*ⓢ Dragon du Zénith, qu'est-ce que cela signifieⓡ\n@c3@"
  it: "@a@b*: Drago di Zenithia, cosa significa ciò?\n@c3@"
  ja: "@a@b＊「おお　天空の神よ！\n\tいったい　どうしたと言うのですか？\n@c3@"
"23":
  de: "@a@b*: Wohin führt uns der Pfad? Welche Mysterien erwarten uns, wenn wir von unserem Altar in das Unbek...\n@c3@"
  en: "@a@b*: Whither would this path lead us?\nWhat holy mysteries await us should we step forth from this altar into the voiⓚⓛ\n@c3@"
  es: "@a@b*: ¿A dónde nos conducirá este camino?\nQué sagrados misterios nos esperan si avanzamos unos pasos desde este altar y...\n@c3@"
  fr: "@a@b*ⓢ Où ce chemin nous conduirait-ilⓡ\nQuels saints mystères nous attendent si nous plongeons depuis l'autel dans le vid...\n@c3@"
  it: "@a@b*: Dove ci porterà questo sentiero?\nQuali sacri misteri ci troveremo di fronte,\nse lasceremo questo altare per...\n@c3@"
  ja: "@a@b＊「この祭壇より続く道は\n\tはたして　いずこへわれらを\n\t導くのか……ん？\n@c3@"
"24":
  de: "@a@b*: Was? Er führt zu einem Henne-Ei-Problem?\n@c3@"
  en: "@a@b*: What? It leads to a chicken and egg situation, you say?\n@c3@"
  es: "@a@b*: ¿Cómo? ¿Que conduce a una de esas situaciones de ''qué fue antes, el huevo o la gallina'', %H860%Xdices%Ydecís%Z?\n@c3@"
  fr: "@a@b*ⓢ Quoiⓡ Vous dite que ça mène à un problème sans quœuf ni crêteⓡ\n@c3@"
  it: "@a@b*: Cosa? Ci troveremmo davanti a un uovo e a una gallina!?\n@c3@"
  ja: "@a@b＊「なに？　この向こうには\n\tニワトリと卵がいる…だと？\n@c3@"
"25":
  de: "@a@b*: Solch eine Absurdität habe ich ja noch nie gehört! Wagt es nicht, den Allmächtigen zu verhöhnen! \n㈡\n*: Sonst werdet Ihr noch vom himmlischen Blitz getroffen!\n@c3@"
  en: "@a@b*: I've never heard such absurdity! Deride a messenger of the Almighty One at your peril!\nLest you be struck down by heavenly lightning!\n@c3@"
  es: "@a@b*: ¡Pero qué broma es esta! ¡Si %H860%Xte burlas%Yos burláis%Z de un mensajero de la Todopoderosa, %H860%Xatente%Yateneos%Z a las consecuencias!\n㈡\n*: ¡Ojo avizor, no sea que un rayo celestial %H860%Xte%Yos%Z fulmine!\n@c3@"
  fr: "@a@b*ⓢ Je n'ai jamais entendu de telles absurditésⓠ\nVous vous moquez d'un messager de la Toute-Puissante à vos risques et périlsⓠ\n㈡\n*ⓢ Que l'éclair divin vous foudroieⓠ\n@c3@"
  it: "@a@b*: Non ho mai sentito niente di più assurdo! %H860%XNon osare farti%YNon osate farvi%Z beffe di un servitore dell'onnipotente! Che il cielo %H860%Xti%Yvi%Z fulmini!\n@c3@"
  ja: "@a@b＊「何を　バカなことを！\n\t神の声を聞くものをからかうと\n\tバチが当たるぞ！\n@c3@"
"26":
  de: "@a@b*: Ich habe von einem Turm gehört, irgendwo auf dieser Insel, der direkt nach Zenithia führen soll!\n@c2@"
  en: "@a@b*: I have heard tell of a tower somewhere on this island that leads to Zenithia itself!\n@c2@"
  es: "@a@b*: ¡He oído hablar de una torre en algún lugar de esta isla que conduce hasta la misma Zenithia!\n@c2@"
  fr: "@a@b*ⓢ J'ai entendu parler d'une tour quelque part sur cette île. Elle permettrait de se rendre à Zénithiaⓠ\n@c2@"
  it: "@a@b*: Ho sentito dire che da qualche parte, su quest'isola, c'è una torre che conduce a Zenithia!\n@c2@"
  ja: "@a@b＊「この島の　どこかに\n\t天空に通じる塔が\n\tあるらしいと　聞いたのだが。\n@c2@"
"27":
  de: "@a@b*: Selbst wenn die Treppe nach Zenithia tatsächlich existieren sollte, öffnet sie sich nicht jedem.\n@c1@"
  en: "@a@b*: But even if the Stairway to Zenithia really does exist, it is not open to all.\n@c1@"
  es: "@a@b*: Pero aún en el caso de que la Escalera a Zenithia realmente exista, no está abierta a todo el mundo.\n@c1@"
  fr: "@a@b*ⓢ Mais même si les Marches de Zénithia existent vraiment, le passage n'est pas ouvert à tous.\n@c1@"
  it: "@a@b*: Ma anche se la Scala per Zenithia esistesse davvero, non tutti potrebbero percorrerla.\n@c1@"
  ja: "@a@b＊「たとえ　天空への塔にのぼっても\n\t誰もが　天空にゆけるとは\n\t限りません。\n@c1@"
"28":
  de: "@a@b*: In den alten Schriften steht geschrieben, dass nur derjenige, welcher im Besitz der gesamten legendären Zenithia-Ausrüstung ist, Zutritt erhält.\n@c1@"
  en: "@a@b*: It is written in the ancient scriptures that only one with all of the legendary Zenithian Equipment would be granted access.\n@c1@"
  es: "@a@b*: Está escrito en las antiguas escrituras que solo podrá acceder a ella la persona que porte todo el legendario Equipo de Zenithia.\n@c1@"
  fr: "@a@b*ⓢ Il est dit dans les anciennes écritures que seule une personne disposant de l'Équipement zénithien pourra y accéder.\n@c1@"
  it: "@a@b*: Secondo le antiche scritture, può accedervi solo chi possiede il leggendario Equipaggiamento Zenithiano.\n@c1@"
  ja: "@a@b＊「古い書物によれば　天空の武器と防具\n\tすべてを　手に入れた者にだけ\n\tその資格があるとか。\n@c1@"
"29":
  de: "@a@b*: Eure Füße müssen gesegnet sein, denn Ihr steht im Azimuth, und das ist Zenithia so nah, wie man als Sterblicher nur kommen kann.\n@c1@"
  en: "@a@b*: Your feet are blessed, for you stand at the Azimuth, the closest mortals can be to Zenithia.\n@c1@"
  es: "@a@b*: %H860%XTus%YSus%Z pies se hallan bendecidos, porque se %H860%Xencuentra%Yencuentran%Z en Azimut, lo más próximo que los mortales pueden estar de Zenithia.\n@c1@"
  fr: "@a@b*ⓢ Vos pieds sont bénis car vous êtes à l'Azimut. Un mortel ne peut pas s'approcher plus près de Zénithia.\n@c1@"
  it: "@a@b*: I %H860%Xtuoi%Yvostri%Z piedi sono benedetti, perché %H860%Xti trovi%Yvi trovate%Z davanti all'Azimut. Nessun mortale può avvicinarsi di più a Zenithia.\n@c1@"
  ja: "@a@b＊「ここは\n\t天空に　いちばん近い島。\n@c1@"
"30":
  de: "@a@b*: Doch lasset Vorsicht walten, denn Nadiria, die Unterwelt, ist nicht allzu fern von hier.\n@c1@"
  en: "@a@b*: But beware, for Nadiria, the underworld, is not far distant either.\n@c1@"
  es: "@a@b*: Pero, cuidado, porque Nadiria, el Inframundo, no se encuentra tampoco a mucha distancia.\n@c1@"
  fr: "@a@b*ⓢ Faites cependant bien attention, car Nadiria, le pays des Enfers, n'est pas très éloigné.\n@c1@"
  it: "@a@b*: Ma attenzione! Nemmeno Nadiria, la terra degli inferi, è lontana da qui!\n@c1@"
  ja: "@a@b＊「しかし　また\n\t闇の世界にも　近いのです。\n@c1@"
"31":
  de: "@a@b*: Im Nordwesten dieser Insel befindet sich eine Höhle, die tief in die Erde hinabreicht. Eine Höhle, die kein Mensch betreten darf.\n@c1@"
  en: "@a@b*: In the north-west of this very island is a cave so deep that it touches the abyss.\nA cave that no human may approach.\n@c1@"
  es: "@a@b*: En el noroeste de esta misma isla hay una cueva tan profunda que se hunde en el abismo. Una cueva a la que no puede acercarse humano alguno.\n@c1@"
  fr: "@a@b*ⓢ Au nord-ouest de cette île se trouve une caverne abyssale qui plonge dans les entrailles de la terre. Aucun humain ne doit s'en approcher.\n@c1@"
  it: "@a@b*: A nord-ovest di quest'isola c'è una grotta tanto profonda da raggiungere l'abisso. Nessun umano può accedervi.\n@c1@"
  ja: "@a@b＊「この島の北西には\n\t人を　誰も寄せつけぬ\n\t深き深き　洞くつがあります。\n@c1@"
"32":
  de: "@a@b*: Nur Zenithianern und Monstern ist der Zutritt in die Höhle gestattet. So besagt es die Legende.\n@c1@"
  en: "@a@b*: Only Zenithians and monsterkind may enter the cave. That is what the legend says.\n@c1@"
  es: "@a@b*: Solo los habitantes de Zenithia y los monstruos pueden entrar en la cueva. Eso es lo que afirma la leyenda.\n@c1@"
  fr: "@a@b*ⓢ Seuls les Zénithiens et les monstres peuvent pénétrer dans cette grotte.\nC'est ce que dit la légende.\n@c1@"
  it: "@a@b*: Secondo la leggenda, solo gli Zenithiani e i mostri possono entrare in quella caverna.\n@c1@"
  ja: "@a@b＊「そして　その洞くつに入れるのは\n\t魔族と天空人のみ……。\n\t言い伝えは　そう語っています。\n@c1@"
"33":
  de: "@a@b*: Die Frau, die dort schlief, ist nicht mehr da.\n@c2@"
  en: "@a@b*: The woman who was sleeping there is gone.\n@c2@"
  es: "@a@b*: La mujer que dormía aquí se ha ido.\n@c2@"
  fr: "@a@b*ⓢ La femme qui dormait ici est partie.\n@c2@"
  it: "@a@b*: La donna che riposava qui non c'è più.\n@c2@"
  ja: "@a@b＊「そこで　寝ていたお人は\n\t出ていったよ。\n@c2@"
"34":
  de: "@a@b*: Sie sagte, sie würde in eine Burg im Himmel zurückkehren. Meint Ihr, sie war bloß krank, oder könnte sie doch die Wahrheit gesagt haben?\n@c2@"
  en: "@a@b*: She spoke of returning to a castle in the sky.\nDo you suppose she was delirious, or could what she said have been true?\n@c2@"
  es: "@a@b*: Decía algo sobre regresar a un castillo en el cielo.\n¿%H860%XCrees%YCreéis%Z que deliraba, o quizá fuera cierto lo que decía?\n@c2@"
  fr: "@a@b*ⓢ Elle a parlé de retourner dans un château dans le ciel. Vous croyez qu'elle délirait ou est-ce que ce dont elle parlait pouvait être vraiⓡ\n@c2@"
  it: "@a@b*: Diceva di voler tornare nel castello su nel cielo. %H860%XPensi%YPensate%Z che stesse delirando? O forse diceva il vero?\n@c2@"
  ja: "@a@b＊「なんでも　空のお城に\n\t帰るとか言っていたが\n\tほんとうかのう？\n@c2@"
"35":
  de: "@a@b*: Hallo, hallo! Welch eine Überraschung, Leute hier zu sehen.\n@c2@"
  en: "@a@b*: Ho ho ho! I'm surprised to see folk all the way out here.\n@c2@"
  es: "@a@b*: ¡Jo, jo, jo! Qué sorpresa ver gente por estos lares.\n@c2@"
  fr: "@a@b*ⓢ Ho ho hoⓠ Je suis surpris de voir du monde par ici.\n@c2@"
  it: "@a@b*: Oh! Oh! Oh! Mi sorprende vedere qualcuno da queste parti!\n@c2@"
  ja: "@a@b＊「ほっほっほっ！\n\tこんな所まで来る者が　まだ\n\tおったとはな……。\n@c2@"
"36":
  de: "@a@b*: Ich geb Euch einen guten Rat, einverstanden? Schaut Euch mal den Baumstumpf dort an.\n@c2@"
  en: "@a@b*: How's about I give you a piece of advice? Have yourself a look at that tree stump over there.\n@c2@"
  es: "@a@b*: ¿%H860%XQuieres que te%YQueréis que os%Z dé un consejo? %H860%XFíjate%YFijaos%Z en ese tocón de árbol de ahí.\n@c2@"
  fr: "@a@b*ⓢ Que diriez-vous d'un petit conseilⓡ\nJetez un œil à la souche d'arbre, là-bas.\n@c2@"
  it: "@a@b*: %H860%XVuoi%YVolete%Z un consiglio? %H860%XVai%YAndate%Z a dare un'occhiata a quel ceppo laggiù.\n@c2@"
  ja: "@a@b＊「わしからの心づけじゃ。\n\tそこの木の根っこを調べなされ。\n@c2@"
"37":
  de: "@a@b*: Oh! Sehr gut! Ihr müsst schon clever sein, um so weit zu kommen. Ich wünsche Euch viel Glück!\n@c2@"
  en: "@a@b*: Oh! You beat me to it! I suppose you must have some nous about you to get this far. Good luck from here on in!\n@c2@"
  es: "@a@b*: ¡Ah! ¡Me %H860%Xhas%Yhabéis%Z pillado! Supongo que si %H860%Xhas%Yhabéis%Z llegado tan lejos quiere decir que no %H860%Xte%Yos%Z falta sentido común. ¡Buena suerte a partir de ahora!\n@c2@"
  fr: "@a@b*ⓢ Vous me coupez l'herbe sous le piedⓠ Je suppose que vous devez avoir un peu de jugeotte pour avoir pu arriver jusqu'ici. Bonne chance pour la suiteⓠ\n@c2@"
  it: "@a@b*: Oh! %H860%XDevi%YDovete%Z avere un'intelligenza molto fervida per aver raggiunto questo punto! %H860%XTi%YVi%Z auguro buona fortuna per il prosieguo dell'avventura!\n@c2@"
  ja: "@a@b＊「ほう！　もう　とっていなさったか？\n\tやはり　ここまで来る者はちがうのう。\n\t先は長い。　気をつけていきなされよ。\n@c2@"
"38":
  de: "@a@b*: Es liegt noch ein langer Weg vor Euch, und die Monster hier in der Gegend sind ganz schön zäh.\n@c2@"
  en: "@a@b*: You've still got a long way to go, and the monsters around here are ever so strong.\n@c2@"
  es: "@a@b*: Aún %H860%Xte%Yos%Z queda mucho por recorrer, y los monstruos de por aquí son realmente fuertes.\n@c2@"
  fr: "@a@b*ⓢ Vous avez encore une longue route à parcourir et les monstres sont vraiment très forts par ici.\n@c2@"
  it: "@a@b*: La strada che %H860%Xdovrai%Ydovrete%Z percorrere è ancora lunga, e questa zona pullula di mostri molto forti.\n@c2@"
  ja: "@a@b＊「先は長いし　ここらにいる魔物も\n\tはんぱな強さじゃないぞ。\n@c2@"
"39":
  de: "@a@b*: Also übt Euch in Geduld und überstürzt nichts.\n@c2@"
  en: "@a@b*: Make sure you take it nice and slow and don't push it too much.\n@c2@"
  es: "@a@b*: %H860%XTómatelo%YTomáoslo%Z con mucha calma y sin agobios.\n@c2@"
  fr: "@a@b*ⓢ Allez-y tranquillement et ne forcez pas trop.\n@c2@"
  it: "@a@b*: %H860%XCerca%YCercate%Z di non strafare! %H860%XProcedi%YProcedete%Z con cautela.\n@c2@"
  ja: "@a@b＊「あまり　いそがず　じっくりと\n\t進んでゆくことじゃな。\n@c2@"
"40":
  de: "@a@b*: Ah! Wo kommt Ihr denn her?! Habt mir einen ganz schönen Schrecken eingejagt!\n@c2@"
  en: "@a@b*: Wah! Where did you spring from!?\nYou gave me quite a fright there!\n@c2@"
  es: "@a@b*: ¡Aah! ¡¿De dónde %H860%Xhas%Yhabéis%Z salido?!\n¡Me %H860%Xhas%Yhabéis%Z dado un susto de muerte!\n@c2@"
  fr: "@a@b*ⓢ Ouahⓠ Mais d'où vous sortez comme çaⓠⓑ\nVous m'avez fichu une sacrée trouilleⓠ\n@c2@"
  it: "@a@b*: Uaaahhh! E %H860%Xtu%Yvoi%Z da dove %H860%Xsalti%Ysaltate%Z fuori?! Mi %H860%Xhai%Yavete%Z fatto prendere uno spavento...!\n@c2@"
  ja: "@a@b＊「はいやー！　あんたたち\n\tどこから来たあるよ？\n\tおったまげたなーや！\n@c2@"
"41":
  de: "@a@b*: Geht doch in die Kirche und legt Eure Beichte ab, wo Ihr schon mal hier seid.\n@c2@"
  en: "@a@b*: You should go and confess in the church just there while you're around these parts.\n@c2@"
  es: "@a@b*: %H860%XDeberías ir a confesarte%YDeberíais ir a confesaros%Z a esa iglesia de allí mientras %H860%Xandas%Yandáis%Z por aquí.\n@c2@"
  fr: "@a@b*ⓢ Vous devriez aller vous confesser dans l'église qui est là pendant que vous êtes dans le coin.\n@c2@"
  it: "@a@b*: Perché non %H860%Xvai a confessarti%Yandate a confessarvi%Z in chiesa, già che %H860%Xti trovi%Yvi trovate%Z da queste parti?\n@c2@"
  ja: "@a@b＊「まあ　せっかく来たからには\n\tそこの教会で　おいのりするっぺ。\n@c2@"
"42":
  de: "@a@b*: Danach könnt Ihr jederzeit wieder hierher kommen.\n@c2@"
  en: "@a@b*: Then you'll be able to come back here again any time you like.\n@c2@"
  es: "@a@b*: Así %H860%Xpodrás%Ypodréis%Z regresar siempre que %H860%Xquieras%Yqueráis%Z.\n@c2@"
  fr: "@a@b*ⓢ Comme ça, vous pourrez revenir ici à n'importe quel moment.\n@c2@"
  it: "@a@b*: Così poi %H860%Xpotrai%Ypotrete%Z tornare qui ogni volta che lo %H860%Xvorrai%Yvorrete%Z.\n@c2@"
  ja: "@a@b＊「したら　いつでも　ここまで\n\tもどって来られるだーよ。\n@c2@"
"43":
  de: "@a@b*: Hallo! Wie geht's denn so? Ich bin kein Priester.\n@c1@"
  en: "@a@b*: Hello! How do you goo!?\nI'm not the priest, you know.\n@c1@"
  es: "@a@b*: ¡Hola! ¡¿Qué tal todo?!\nNo soy el sacerdote, ¿%H860%Xsabes%Ysabéis%Z?\n@c1@"
  fr: "@a@b*ⓢ Saluuutⓠ Comment ça vaaaⓠⓑ\nCe n'est pas moi le prêtre, hein.\n@c1@"
  it: "@a@b*: Salve! Come va? Glob! Nel caso %H860%Xtu non l'avessi%Ynon l'aveste%Z notato, io non sono il sacerdote.\n@c1@"
  ja: "@a@b＊「ぴぴぴ～～！\n\tボクは　神父さんじゃないよ。\n@c1@"
"44":
  de: "@a@b*: Nein, der Priester ist drinnen. %H860%XSieh%YSeht%Z ruhig mal nach.\n@c1@"
  en: "@a@b*: No, the priest's over there.\nGoo and see him if you like.\n@c1@"
  es: "@a@b*: No, el sacerdote está dentro.\n%H860%XEntra%YEntrad%Z a verle si %H860%Xquieres%Yqueréis%Z.\n@c1@"
  fr: "@a@b*ⓢ Non, le prêtre est à l'intérieur.\nAllez le voir, si vous voulez.\n@c1@"
  it: "@a@b*: No, il sacerdote è dentro. Se %H860%Xvuoi%Yvolete%Z, %H860%Xpuoi%Ypotete%Z andare a globarlo.\n@c1@"
  ja: "@a@b＊「神父さんなら　この奥にいるよ。\n@c1@"
"45":
  de: "@a@b*: AaAaaHH! Ich liEbe es zu KOChen.\n@c2@"
  en: "@a@b*: AaAaarGH! I reAlly LURrrrghVE cOOking.\n@c2@"
  es: "@a@b*: ¡AaAaarGH! Me GusTa MuuuCHo CociNarRRrrRr.\n@c2@"
  fr: "@a@b*ⓢ AaAaarGHⓠ J'aDooOOre cUisInEr.\n@c2@"
  it: "@a@b*: Uaaaaaargh! Co-me mi pia-ce cu-ci-na-re!\n@c2@"
  ja: "@a@b＊「うち　お料理　好きだぽんよ。\n@c2@"
"46":
  de: "@a@b*: AaaAaHH! AbER keiNer wiLL meIn EssEN habEn. iCh fühlE MIch so LEBlos unD traUrig.\n@c2@"
  en: "@a@b*: AaarGH! BuT noBODY wilL eAT my fOOD.\nI feEL So LIfeLEss anD Sad.\n@c2@"
  es: "@a@b*: ¡Aaargh! PeRo NadiE qUieRe mI ComIDa.\nMe sIenTo tAn DeSaNImAdo Y tRiSTe.\n@c2@"
  fr: "@a@b*ⓢ AaarGHⓠ MaIs PERsoNne nE vEUt MAnGer cE Que JE PréPARe.\nJe mE SEnS Si TrISte ET Sans VIE.\n@c2@"
  it: "@a@b*: Uaaaa! Ma nes-suno man-gerà il mio ci-bo! Ho il mo-ra-le sot-to i pie-di, an-zi, sot-to ter-ra...!\n@c2@"
  ja: "@a@b＊「そやけど　だれも　うちの料理\n\t食べないのねん。\n\tかなしいのねんねん。\n@c2@"
"47":
  de: "@a@b*: Grrr! Zzz... Aarrrr!\n@c2@"
  en: "@a@b*: Grrrrrr! Zzzz... Aarrrrr!\n@c2@"
  es: "@a@b*: ¡Grrrrrr! Zzzz... ¡Aarrrrr!\n@c2@"
  fr: "@a@b*ⓢ Grrrrrrⓠ Zzz.... Aarrrrrⓠ\n@c2@"
  it: "@a@b*: Roarrr! Zzzz... Roarrrrrr!\n@c2@"
  ja: "@a@b＊「ぐががが～～！\n\tすぴーすぴー……。\n\tうごごごごごおおお。\n@c2@"
"48":
  de: "@a@bDer Gewaltiger scheint zu schlafen.\n@c2@"
  en: "@a@bThe tigergram seems to be asleep.\n@c2@"
  es: "@a@bEl tigretón parece estar dormido.\n@c2@"
  fr: "@a@bLe tigroar semble endormi.\n@c2@"
  it: "@a@bTygra sta dormendo.\n@c2@"
  ja: "@a@bどうやら　ねむっているようだ。\n@c2@"
"49":
  de: "@a@b*: Ich hoffe, Rosi geht es gut (schlürf).\n@c1@"
  en: "@a@b*: I hope Rose is all right. (slurp)\n@c1@"
  es: "@a@b*: Espero que Rosa se encuentre bien (slurp).\n@c1@"
  fr: "@a@b*ⓢ J'espère que Rooose va bien (slurp).\n@c1@"
  it: "@a@b*: Spero che Rosa stia bene... Slurp!\n@c1@"
  ja: "@a@b＊「ロザリーさま　大丈夫かなあ……。\n@c1@"
"50":
  de: "@a@b*: Aamon hat seinen Schergen befohlen, den Manschen zu erzählen, wo sie steckt.\n@c1@"
  en: "@a@b*: Aamon sent out an order to his goons to tell the goomans where she was.\n@c1@"
  es: "@a@b*: Aamon dio la orden a sus esbarros de que le dijesen a los humanos dónde estaba.\n@c1@"
  fr: "@a@b*ⓢ Aamon a donné l'ooordre à ses brutes de dire aux huuumains où elle était.\n@c1@"
  it: "@a@b*: Aamon ha ordinato ai suoi seguaci di dire agli umani dove si trovava... Slurp!\n@c1@"
  ja: "@a@b＊「エビルプリーストが命令して\n\tロザリーさまの居場所を人間たちに\n\t教えちゃったみたいなのね。\n@c1@"
"51":
  de: "@a@b*: Sabberlot! Das ist mir jetzt so rausgeschlürft. %H860%XDu hast%YIhr habt%Z nichts gehört, verstanden?\n@c1@"
  en: "@a@b*: Gooness! I wasn't slurposed to tell you that.\nYou didn't hear one slimy little thing, okay?\n@c1@"
  es: "@a@b*: ¡Limas! Se suponía que no debía contarlo.\n%H860%XTú no has%Y%R000%XVosotras%YVosotros%Z no habéis%Z oído ninguna vis-cosa, ¿vale?\n@c1@"
  fr: "@a@b*ⓢ Glouanpsⓠ Je n'aurais pas dû dire çaaa.\nDisons que vous n'avez rien entenduuu, d'accordⓡ\n@c1@"
  it: "@a@b*: Per tutti gli Slime! Non avrei dovuto dirlo... Slurp! %H860%XTu non hai%YVoi non avete%Z sentito nulla, d'accordo?\n@c1@"
  ja: "@a@b＊「あ！\n\t今のは　言っちゃいけなかったんだ！\n\t聞かなかったことにしておいてね。\n@c1@"
"52":
  de: "@a@b*: (Schlürf!) Psaro! Entschuldigt, aber wo ist Rosi?\n@c1@"
  en: "@a@b*: (slurp) Psaro! Excooze me, but where's Rose?\n@c1@"
  es: "@a@b*: (¡slurp!) ¡Psaro! Disculpa, pero ¿dónde está Rosa?\n@c1@"
  fr: "@a@b*ⓢ (Slurpⓠ) Psaroⓠ Excuuusez-moi, mais où est Roseⓡ\n@c1@"
  it: "@a@b*: Glob! Psaro! Scusami, ma dove si trova Rosa?\n@c1@"
