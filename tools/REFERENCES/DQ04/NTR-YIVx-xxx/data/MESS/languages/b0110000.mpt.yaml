  fr: "@a@b*ⓢ De quoiⓡ Vouuus n'êtes pas %A120%Xvenu%Z%B120%Xvenue%Z lui faire du maaalⓡ\n㈡\n*ⓢ Désolé, je vouuus ai accusé à tort. Pouuur me faire pardonner, je vais vouuus faire une révélaaation.\n@c1@"
