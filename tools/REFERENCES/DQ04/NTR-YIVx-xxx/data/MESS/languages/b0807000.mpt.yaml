  es: "@aMeena@bBien, bien. Le leeré las cartas y le diré qué le depara la fortuna hoy.\n@c1@"
  fr: "@aMina@bSuperⓠ\nAlors je vais vous tirer les cartes pour vous dire à quoi va ressembler votre journée.\n@c1@"
  it: "@aMyra@bMolto bene!\nAllora ti leggerò le carte e ti dirò cosa ti succederà oggi.\n@c1@"
  ja: "@a@bミネア「わかりました。\n\tでは　今日の　あなたの運命を\n\tこのタロットに　聞いてみましょう。\n@c1@"
