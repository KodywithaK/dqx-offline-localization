"130":
  de: "@aMina@bDer Schlüssel ist ⓚⓛ huch! Die letzte Karte der größeren Arkana, die Welt, aufrecht stehend! Das ist die beste Karte, die %O966%Xdu ziehen kannst%YIhr ziehen könnt%Z.\n@c1@"
