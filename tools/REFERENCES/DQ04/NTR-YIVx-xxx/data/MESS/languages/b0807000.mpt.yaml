"20":
  de: "@aMina@bOoh ⓚⓛ heute %O966%Xwirst du%Ywerdet Ihr%Z verdrießlich sein, sehr viel verdrießlich, und das %O966%Xlässt du%Ylasst Ihr%Z an allen aus. Und Fehler sind allgegenwärtig.\n@c1@"
  en: "@aMeena@bOof, you will be in a foul mood today, and you will be taking it out on everyone. You will also be doing many errors.\n@c1@"
  es: "@aMeena@bUuf, hoy estará de pésimo humor y la tomará con todo el mundo. También cometerá muchos errores.\n@c1@"
  fr: "@aMina@bOuh, quelle humeur massacrante, aujourd'hui.\n%O966%XTu passeras tes%YVous passerez vos%Z nerfs sur tout le monde.\n%O966%XTu feras%YVous ferez%Z aussi beaucoup d'erreurs.\n@c1@"
  it: "@aMyra@bOggi sarai di pessimo umore e te la prenderai con chiunque ti capiterà a tiro. Commetterai anche molti errori.\n@c1@"
  ja: "@a@bミネア「やけに　イライラして\n\tやつあたりして　しまいそう。\n\tまた　万事　油断しがちです。\n@c1@"
"21":
  de: "@aMina@b%O966%XDeine%YEure%Z Glückszahl ist die Zwei und %O966%Xdeine%YEure%Z Glücksfarbe ist Himmelblau. Jetzt ist die Zeit günstig, um eine Stufe aufzusteigen.\n@c1@"
  en: "@aMeena@bYour lucky number is being two, and your lucky colour is being sky blue. It is wise time for levelling up now.\n@c1@"
  es: "@aMeena@bSu número de la suerte es el dos y su color de la suerte, el azul claro. Es un buen momento para subir de nivel.\n@c1@"
