  fr: "@aMina@bAujourd'hui, égoïsme et excès de confiance en %O966%Xtoi%Yvous%Z sèmeront le désastre. Ne %O966%Xte fais pas remarquer et évite%Yvous faites pas remarquer et évitez%Z de faire des vagues.\n@c1@"
  it: "@aMyra@bOggi l'egoismo e la presunzione ti causeranno molti danni. Mantieni un profilo basso ed evita di sollevare polveroni inutili.\n@c1@"
