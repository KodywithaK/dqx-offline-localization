"36":
  de: "@aMina@b%O966%XDeine%YEure%Z Glückszahl ist die Neun und %O966%Xdeine%YEure%Z Glücksfarbe ist Tiefblau. Und nicht vergessen: Dankbarkeit ist eine Zier.\n@c1@"
