"135":
  de: "@aMina@b%O966%XDeine%YEure%Z Glückszahl ist die Vier und %O966%Xdeine%YEure%Z Glücksfarbe ist Grün. %O966%XPass auf, dass dir%YPasst auf, dass Euch%Z nicht schlecht wird.\n@c1@"
