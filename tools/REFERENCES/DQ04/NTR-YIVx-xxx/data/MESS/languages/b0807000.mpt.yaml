  de: "@aMina@b%O966%XDeine%YEure%Z Lügen kommen ans Licht, und %O966%Xdu kannst dich%YIhr könnt Euch%Z auf gar nichts konzentrieren. Oh, %O966%Xdu musst%YIhr müsst%Z besonders gut Acht geben, bitte.\n@c1@"
