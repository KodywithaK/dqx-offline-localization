"42":
  de: "@aMina@b%O966%XDeine%YEure%Z Glückszahl ist die Eins und %O966%Xdeine%YEure%Z Glücksfarbe ist Orange. Ja, heute wachen die Engel nur über Euch!\n@c1@"
