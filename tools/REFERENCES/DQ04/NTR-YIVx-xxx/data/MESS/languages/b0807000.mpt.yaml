"32":
  de: "@aMina@bSelbstsucht und übergroße Selbstsicherheit führen heute zu einer Katastrophe. %O966%XHalte dich%YHaltet Euch%Z im Hintergrund und macht nicht zu viel Lärm.\n@c1@"
