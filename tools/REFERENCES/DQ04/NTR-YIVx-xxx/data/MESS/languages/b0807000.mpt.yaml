  it: "@aMyra@bLa tua carta è ⓕGli Amantiⓖ, il settimo degli Arcani maggiori, in posizione dritta. Wooow! Ti attendono dei momenti molto romantici!\n@c1@"
  ja: "@a@bミネア「あなたの　運命を示すカードは\n\t恋人の　正位置です。\n\t恋愛運が　最高の日。\n@c1@"
"41":
  de: "@aMina@bVielleicht %O966%Xtriffst du%Ytrefft Ihr%Z heute ja das Glück %O966%Xdeiner%YEurer%Z Zukunft... Und es ist auch ein guter Tag, um wichtige Entscheidungen zu treffen. \n@c1@"
  en: "@aMeena@bMaybe you will be meeting a would-be today, no? And this is a fine day for making important decisions, too.\n@c1@"
  es: "@aMeena@bPuede que hoy encuentre a su media naranja, ¿sabe? Y también es un día perfecto para tomar decisiones importantes.\n@c1@"
  fr: "@aMina@bPeut-être %O966%Xrencontreras-tu un prétendant%Yrencontrerez-vous %A120%Xune prétendante%Z%B120%Xun prétendant%Z %Z aujourd'huiⓡ C'est également une bonne journée pour prendre des décisions importantes.\n@c1@"
  it: "@aMyra@bOggi forse incontrerai una persona molto presuntuosa. Questo è un giorno perfetto per prendere decisioni importanti. \n@c1@"
