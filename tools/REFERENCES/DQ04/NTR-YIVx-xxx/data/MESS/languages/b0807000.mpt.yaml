"22":
  de: "@aMina@bDer Schlüssel ist die vierte Karte der großen Arkana, die Herrscherin, aufrecht stehend. Oh, wie schön! Das wird ein Glückstag!\n@c1@"
  en: "@aMeena@bYour key is being the fourth card of the major arcana, The Empress, in its normal position. Waah! What a lucky-lucky day is it for you!\n@c1@"
  es: "@aMeena@bSu carta clave es la cuarta carta de los arcanos mayores, La Emperatriz, en su posición normal. ¡Aaah! Le espera un día repleto de fortuna.\n@c1@"
  fr: "@aMina@b%O966%XTa%YVotre%Z lame est la quatrième carte des arcanes majeurs, l'Impératrice, à l'endroit. Ouaahⓠ C'est vraiment un jour de très grande chanceⓠ\n@c1@"
  it: "@aMyra@bLa tua carta è ⓕL'Imperatriceⓖ, il quarto degli Arcani maggiori, in posizione dritta. Wow! Oggi per te sarà una giornata fortunatissima!\n@c1@"
  ja: "@a@bミネア「あなたの　運命を示すカードは\n\t女帝の　正位置。\n\tなんとも　ラッキーな一日です。\n@c1@"
"23":
  de: "@aMina@bLiebe, Gesundheit und Wohlstand. Alles wird sich nach %O966%Xdeinen%YEuren%Z Wünschen ordnen. Ein Lächeln bringt %O966%Xdir%YEuch%Z ein großes Glücksgefühl.\n@c1@"
  en: "@aMeena@bLove, health and wealth. Everything will be how are you wanting it to be. A smile will bring you great happiness.\n@c1@"
  es: "@aMeena@bAmor, salud y riqueza. Todo será como siempre ha esperado %A120%Xel señor%Z%B120%Xla señora%Z. Una sonrisa le concederá una gran felicidad.\n@c1@"
  fr: "@aMina@bAmour, santé et richesse. Tout se passera comme %O966%Xtu le souhaiteras%Yvous le souhaiterez%Z. Un sourire %O966%Xt'%Yvous %Zapportera beaucoup de bonheur.\n@c1@"
  it: "@aMyra@bTutto ciò che desideri riguardo ad amore, salute e ricchezza oggi si realizzerà. Un sorriso ti darà tanta gioia.\n@c1@"
  ja: "@a@bミネア「恋愛　金運　健康。\n\tすべて　望みのままに。\n\t笑顔が　幸せを呼びます。\n@c1@"
"24":
  de: "@aMina@b%O966%XDeine%YEure%Z Glückszahl ist fünf, und %O966%Xdeine%YEure%Z Glücksfarbe ist Gelb. %O966%XTrage%YTragt%Z immerfort ein Lächeln auf dem Gesicht.\n@c1@"
  en: "@aMeena@bYour lucky number is being five, and your lucky colour is being yellow. Keep a happy expression on your face at all times.\n@c1@"
  es: "@aMeena@bSu número de la suerte es el cinco y su color de la suerte, el amarillo. Mantenga una expresión de felicidad en su rostro en todo momento.\n@c1@"
