"39":
  de: "@aMina@b%O966%XDeine%YEure%Z Glückszahl ist die Neun und %O966%Xdeine%YEure%Z Glücksfarbe ist Purpur. Geduld ist eine Tugend, bis diese schwierige Zeit vorüber ist.\n@c1@"
