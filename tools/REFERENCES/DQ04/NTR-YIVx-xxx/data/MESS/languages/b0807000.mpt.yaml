  it: "@aMyra@bIl tuo numero magico è l'otto e il tuo colore fortunato è il rosso. Sfrutta questo momento per riflettere su te %A120%Xstesso%Z%B120%Xstessa%Z.\n@c1@"
  ja: "@a@bミネア「ラッキーナンバーは　８。\n\tラッキーカラーは　赤。\n\t自分を　よく見つめ直して。\n@c1@"
"34":
