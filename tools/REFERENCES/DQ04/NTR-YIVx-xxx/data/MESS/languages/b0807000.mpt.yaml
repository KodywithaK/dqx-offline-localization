  fr: "@aMina@b%O966%XTon%YVotre%Z chiffre porte-bonheur est le neuf cent trente et un et %O966%Xta%Yvotre%Z couleur de chance est vaguement marron.\n㈡\nLa peur du danger est pire que le danger lui-même.\n@c1@"
  it: "@aMyra@bIl tuo numero magico è il novecentotrentuno e il tuo colore fortunato è il grigio topo-di-fogna. Ricorda: la paura del pericolo è peggiore del pericolo stesso.\n@c1@"
  ja: "@a@bミネア「ラッキーナンバーは　９３１。\n\tラッキーカラーは　えびちゃ色。\n\t案ずるより産むがやすしです。\n@c1@"
"145":
