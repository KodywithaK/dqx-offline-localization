  es: "@aMeena@bSu número de la suerte es el nueve y su color de la suerte, el morado. Deberá ser paciente y esperar a que pase esta mala racha.\n@c1@"
  fr: "@aMina@b%O966%XTon%YVotre%Z chiffre porte-bonheur est le neuf et %O966%Xta%Yvotre%Z couleur de chance est le violet.\nPatience, cette période pénible finira par passer.\n@c1@"
  it: "@aMyra@bIl tuo numero magico è il nove e il tuo colore fortunato è il viola. Porta pazienza e aspetta che questo periodo critico passi.\n@c1@"
