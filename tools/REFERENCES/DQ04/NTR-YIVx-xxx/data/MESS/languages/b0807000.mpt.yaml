  en: "@aMeena@bYou are very lucky, no?\n@c1@"
  es: "@aMeena@bQué suerte tiene, ¿verdad?\n@c1@"
  fr: "@aMina@bC'est une chance, nonⓡ\n@c1@"
  it: "@aMyra@bChe fortuna, vero?\n@c1@"
  ja: "@a@bミネア「よかったですね。\n@c1@"
"150":
  de: "@aMina@bDie Wahrsagerei erleuchtet nur einen der vielen Wege vor uns.\n㈡\nDen Ausschlag für Glück oder Unglück geben aber %O966%Xdeine%YEure%Z Taten und Wünsche.\n@c1@"
  en: "@aMeena@bFortune-telling only illuminates one of the many paths before us.\n㈡\nIt is your actions and desires that will be steering you between fortune and misfortune.\n@c1@"
  es: "@aMeena@bLa adivinación solo nos muestra uno de los muchos caminos que nos aguardan.\n㈡\nSon nuestras acciones y deseos los que nos conducen a la fortuna o la desgracia.\n@c1@"
  fr: "@aMina@bLa voyance ne fait qu'éclairer l'un des nombreux chemins qui s'ouvrent devant nous.\n㈡\nCe sont %O966%Xtes actes et tes désirs qui te%Yvos actes et vos désirs qui vous%Z guideront vers la chance ou la malchance.\n@c1@"
  it: "@aMyra@bLa chiaroveggenza non fa altro che illuminare uno dei tanti sentieri che ci troviamo davanti.\n㈡\nSaranno le tue azioni e i tuoi desideri a indirizzarti verso la fortuna o verso la sfortuna.\n@c1@"
  ja: "@a@bミネア「占いは　道を示すだけ。\n\t心がけや　行動しだいで\n\t運命は　良くも悪くも変わります。\n@c1@"
"151":
  de: "@aMina@bSetzen wir unseren Weg also jetzt fort.\n@c1@"
  en: "@aMeena@bSo let us be continuing on our way now.\n@c1@"
  es: "@aMeena@bAsí pues, prosigamos con nuestro camino.\n@c1@"
  fr: "@aMina@bAlors continuons notre chemin, à présent.\n@c1@"
  it: "@aMyra@bAvanti, proseguiamo il nostro viaggio.\n@c1@"
  ja: "@a@bミネア「さあ　旅を続けましょう。\n@c1@"
"152":
  de: "@a@bMina kann jetzt nicht wahrsagen.\n@c0@"
  en: "@a@bMeena cannot perform the fortune-telling now.\n@c0@"
  es: "@a@bMeena no puede ejercer la adivinación ahora.\n@c0@"
  fr: "@a@bMina ne peut pas pratiquer la voyance pour l'instant.\n@c0@"
  it: "@a@bMyra non può predire il futuro in questo momento.\n@c0@"
  ja: "@a@b今　ミネアは　占いができない。\n@c0@"
"153":
  de: "@aMina@bDie Wahrsagerei ist eine heilige Handlung. Man kann sie nicht öfter als einmal am Tag durchführen.\n@c1@"
  en: "@aMeena@bFortune-telling is holy-holy.\nYou cannot be doing it more than one time in each day.\n@c1@"
  es: "@aMeena@bLa adivinación es una ciencia divina.\nNo se puede ejercitar más de una vez al día.\n@c1@"
  fr: "@aMina@bLa voyance est sacrée.\nIl n'est pas possible de la pratiquer plus d'une fois par jour.\n@c1@"
  it: "@aMyra@bLa lettura del futuro è qualcosa di sacro. Non è possibile farla più di una volta nello stesso giorno.\n@c1@"
  ja: "@a@bミネア「占いは　神聖なもの。\n\t日に一度だけと　決まっています。\n@c1@"
"154":
  de: "@aMina@bWenn %O966%Xdu wünschst%YIhr wünscht%Z, dass ich %O966%Xdir%YEuch%Z die Karten noch einmal lege, %O966%Xmusst du%Ymüsst Ihr%Z erst die Nacht in einer Herberge verbringen, in Ordnung?\n@c1@"
  en: "@aMeena@bIf you are wanting me to read the tarot for you again, you must be staying the night at an inn first, okay?\n@c1@"
  es: "@aMeena@bSi %A120%Xel señor%Z%B120%Xla señora%Z desea que le vuelva a leer el tarot, antes tendrá que pasar la noche en una posada, ¿de acuerdo?\n@c1@"
  fr: "@aMina@bSi %O966%Xtu veux que je te lise une nouvelle fois les cartes, tu dois%Yvous voulez que je vous lise une nouvelle fois les cartes, vous devez%Z d'abord passer une nuit dans une auberge, d'accordⓡ\n@c1@"
  it: "@aMyra@bSe vuoi che ti legga nuovamente i tarocchi, dovrai prima trascorrere la notte in una locanda, capito?\n@c1@"
  ja: "@a@bミネア「また　占ってほしいなら\n\tいったん　宿屋に泊まって\n\t次の日にしてくださいね。\n@c1@"
