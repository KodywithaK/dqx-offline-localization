  ja: "@a@bミネア「あなたの　運命を示すカードは\n\t法皇の　正位置です。\n@c1@"
"35":
  de: "@aMina@bHeute wird %O966%Xdir%YEuch%Z jemand helfen, der älter ist als %O966%Xdu. Hör%YIhr. Hört%Z auf jeden Rat, den man %O966%Xdir%YEuch%Z gibt.\n@c1@"
