  it: "@aMyra@bIl tuo numero magico è il sei e il tuo colore fortunato è il giallo. Oggi le tue buone intenzioni saranno fraintese.\n@c1@"
  ja: "@a@bミネア「ラッキーナンバーは　６。\n\tラッキーカラーは　黄色。\n\t好意のおしつけは　嫌われます。\n@c1@"
"28":
  de: "@aMina@bDer Schlüssel ist die fünfte Karte der größeren Arkana, der Herrscher, aufrecht stehend.\n@c1@"
