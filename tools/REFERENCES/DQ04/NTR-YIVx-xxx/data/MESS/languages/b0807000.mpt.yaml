  fr: "@aMina@b%O966%XTon%YVotre%Z chiffre porte-bonheur est le un et %O966%Xta%Yvotre%Z couleur de chance est le orange. Arey, les anges veillent sur %O966%Xtoi et toi seule%Yvous et vous %A120%Xseul%Z%B120%Xseule%Z%Zⓠ\n@c1@"
