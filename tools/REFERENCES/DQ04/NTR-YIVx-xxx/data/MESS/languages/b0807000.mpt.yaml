"11":
  de: "@aMina@bHeute %O966%Xsprühst du%Ysprüht Ihr%Z geradezu vor Klugheit! Fast alles ist möglich. Der ideale Zeitpunkt, um etwas Neues zu beginnen.\n@c1@"
  en: "@aMeena@bYour mental capacities will be sizzling today. You can be able to do almost anything. The perfect time to be starting something new.\n@c1@"
  es: "@aMeena@bSu capacidad mental estará hoy al rojo vivo. Podrá hacer prácticamente todo lo que se proponga. Es el momento idóneo para comenzar algo nuevo.\n@c1@"
  fr: "@aMina@b%O966%XTes capacités intellectuelles seront remarquables, aujourd'hui. Tu pourras faire presque tout ce que tu voudras.%YVos capacités intellectuelles seront remarquables, aujourd'hui. Vous pourrez faire presque tout ce que vous voudrez%Z.\n㈡\nC'est le moment idéal pour commencer quelque chose de nouveau.\n@c1@"
  it: "@aMyra@bLe tue facoltà mentali oggi saranno al massimo, e realizzerai quasi tutti gli obiettivi prefissati. È il momento giusto per iniziare una nuova attività.\n@c1@"
  ja: "@a@bミネア「頭の回転が　よくなる日。\n\tなんでも器用にこなせるでしょう。\n\t新しいことを始めるにも　最適です。\n@c1@"
"12":
  de: "@aMina@b%O966%XDeine%YEure%Z Glückszahl ist die Eins und %O966%Xdeine%YEure%Z Glücksfarbe ist Orange. Den Verstand zu gebrauchen, ist heute der Schlüssel zum Glück.\n@c1@"
  en: "@aMeena@bYour lucky number is being one, and your lucky colour is being orange. Exercising your brain is the key to good fortune for you today.\n@c1@"
  es: "@aMeena@bSu número de la suerte es el uno y su color de la suerte, el naranja. Para tener fortuna en el día de hoy, la clave será ejercitar el cerebro.\n@c1@"
