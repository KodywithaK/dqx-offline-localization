  it: "@aMyra@bLa tua carta è ⓕIl Papaⓖ, il sesto degli Arcani maggiori, in posizione rovesciata. Purtroppo, non ci sono buone notizie in vista...\n@c1@"
  ja: "@a@bミネア「あなたの　運命を示すカードは\n\t法皇の　逆位置です。\n\tあまり　よくないですね。\n@c1@"
"38":
  de: "@aMina@bÜbermäßige Abhängigkeit sollte man vermeiden. Wie sehr %O966%Xdu dich%YIhr Euch%Z auch anstrengt, heute ist alle Liebesmüh vergebens.\n@c1@"
