"140":
  de: "@aMina@bJemand, der %O966%Xdeine%YEure%Z Laken wäscht, bereitet %O966%Xdir%YEuch%Z ein lecker-delikates Essen. Und %O966%Xdu musst%YIhr müsst%Z versuchen, eine Katze zu finden, die einen Handstand macht.\n@c1@"
