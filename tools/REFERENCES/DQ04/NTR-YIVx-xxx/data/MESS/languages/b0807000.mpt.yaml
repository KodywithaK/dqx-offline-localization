  ja: "@a@bミネア「今日は　ムダづかいが多く\n\tだらけた一日に　なりがちです。\n\t気をつけてください。\n@c1@"
"27":
  de: "@aMina@b%O966%XDeine%YEure%Z Glückszahl ist die Sechs und %O966%Xdeine%YEure%Z Glücksfarbe ist Gelb. Gute Absichten sind heute schlecht beraten.\n@c1@"
  en: "@aMeena@bYour lucky number is being six, and your lucky colour is being yellow. Good intentions will be taken in a negative way today.\n@c1@"
