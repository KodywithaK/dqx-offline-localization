"143":
  de: "@aMina@bEtwas, nach dem %O966%Xdu suchst%YIhr sucht%Z, wird auftauchen, wenn %O966%Xdu%YIhr%Z ein Nickerchen %O966%Xhältst%Yhaltet%Z, aber es ist ganz verfallen und verfault.\n㈡\nUnd %O966%Xdich%YEuch%Z plagen Wollkügelchen an %O966%Xdeinen%YEuren%Z Pullovern.\n@c1@"
