  ja: "@a@bミネア「ラッキーナンバーは　１。\n\tラッキーカラーは　オレンジ。\n\t天使が　あなたを見守っています。\n@c1@"
"43":
  de: "@aMina@bDer Schlüssel ist die siebte Karte der größeren Arkana, die Liebenden, auf dem Kopf stehend.\n@c1@"
