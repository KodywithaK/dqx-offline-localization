  it: "@aMyra@bIl tuo numero magico è il cinque e il tuo colore fortunato è il giallo. Cerca di sorridere sempre, in ogni circostanza.\n@c1@"
  ja: "@a@bミネア「ラッキーナンバーは　６。\n\tラッキーカラーは　黄色。\n\t常に　笑顔をたやさないで。\n@c1@"
