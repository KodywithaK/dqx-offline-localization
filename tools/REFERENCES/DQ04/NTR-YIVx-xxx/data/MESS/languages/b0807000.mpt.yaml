"33":
  de: "@aMina@b%O966%XDeine%YEure%Z Glückszahl ist die Acht und %O966%Xdeine%YEure%Z Glücksfarbe ist Rot. Jetzt ist Zeit, über %O966%Xdich%YEuch%Z selbst nachzudenken, bitte.\n@c1@"
  en: "@aMeena@bYour lucky number is being eight, and your lucky colour is being red. Now it is a time for reflection about your good self, please.\n@c1@"
