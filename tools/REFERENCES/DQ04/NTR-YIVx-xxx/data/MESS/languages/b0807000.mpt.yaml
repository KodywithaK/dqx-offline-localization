  es: "@aMeena@bSu carta clave es la séptima carta de los arcanos mayores, Los Amantes, invertida.\n@c1@"
  fr: "@aMina@b%O966%XTa%YVotre%Z lame est la septième carte des arcanes majeurs, l'Amoureux, à l'envers.\n@c1@"
  it: "@aMyra@bLa tua carta è ⓕGli Amantiⓖ, il settimo degli Arcani maggiori, in posizione rovesciata.\n@c1@"
  ja: "@a@bミネア「あなたの　運命を示すカードは\n\t恋人の　逆位置です。\n@c1@"
"44":
  de: "@aMina@bDas heißt, %O966%Xdu wirst dich%YIhr werdet Euch%Z verirren. Entscheidungen treffen ist gerade sehr schwierig und %O966%Xdu leidest%YIhr leidet%Z an Verwirrung.\n@c1@"
  en: "@aMeena@bThis means you are going to lose your way.\nYou cannot be able to make decisions, and you will be suffering from confusions.\n@c1@"
