  fr: "@aMina@bCela signifie que %O966%Xtu vas perdre ta route.\nTu seras incapable de prendre des décisions et tu feras%Yvous allez perdre votre route.\nVous serez incapable de prendre des décisions et vous ferez%Z preuve de confusion.\n@c1@"
