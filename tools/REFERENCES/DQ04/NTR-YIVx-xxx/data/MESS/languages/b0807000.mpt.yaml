"4":
  de: "@aMina@bDer Schlüssel ist die erste Karte der großen Arkana, der Narr, aufrecht stehend.\n@c1@"
  en: "@aMeena@bYour key is being the first card of the major arcana, The Fool, in its normal position.\n@c1@"
  es: "@aMeena@bSu carta clave es la primera carta de los arcanos mayores, El Loco, en su posición normal.\n@c1@"
  fr: "@aMina@b%O966%XTa%YVotre%Z lame est la première carte des arcanes majeurs, le Mat, à l'endroit.\n@c1@"
  it: "@aMyra@bLa tua carta è ⓕIl Mattoⓖ, il primo degli Arcani maggiori, in posizione dritta.\n@c1@"
  ja: "@a@bミネア「あなたの　運命を示すカードは\n\t愚者の　正位置です。\n@c1@"
"5":
  de: "@aMina@b%O966%XLass dich%YLasst Euch%Z von der Vernunft nicht in die Irre führen. %O966%XFolge nur deinem%YFolgt nur Eurem%Z Herzen. Dadurch %O966%Xwirst du%Ywerdet Ihr%Z vorankommen.\n@c1@"
  en: "@aMeena@bDo not be tricked by common senses, and follow your heart only. This will be opening the way forward for you.\n@c1@"
  es: "@aMeena@bNo se deje engañar por el sentido común y siga sólo el dictado de su corazón. De este modo se abrirá el camino que tiene ante sí.\n@c1@"
  fr: "@aMina@bNe %O966%Xte laisse pas abuser par tes sens et ne suis que ton cœur%Yvous laissez pas abuser par vos sens et ne suivez que votre cœur%Z. C'est ce qui %O966%Xt'%Yvous %Zouvrira le chemin.\n@c1@"
  it: "@aMyra@bNon farti ingannare dalle apparenze e segui il tuo cuore. Solo così ti sarà chiaro quale sentiero dovrai seguire.\n@c1@"
  ja: "@a@bミネア「常識に　とらわれず\n\t心のままに行動してください。\n\tきっと　道が開けます。\n@c1@"
"6":
  de: "@aMina@b%O966%XDeine%YEure%Z Glückszahl ist die Null und %O966%Xdeine%YEure%Z Glücksfarbe ist Weiß. %O966%XBehandle%YBehandelt%Z Höherstehende mit Respekt!\n@c1@"
  en: "@aMeena@bYour lucky number is being zero, and your lucky colour is being white. Treat your superiors with respect.\n@c1@"
  es: "@aMeena@bSu número de la suerte es el cero y su color de la suerte, el blanco. Trate a sus superiores con respeto.\n@c1@"
  fr: "@aMina@b%O966%XTon%YVotre%Z chiffre porte-bonheur est le zéro et %O966%Xta%Yvotre%Z couleur de chance est le blanc. %O966%XTraite tes%YTraitez vos%Z supérieurs avec respect.\n@c1@"
  it: "@aMyra@bIl tuo numero magico è lo zero e il tuo colore fortunato è il bianco. Tratta i tuoi superiori con rispetto.\n@c1@"
  ja: "@a@bミネア「ラッキーナンバーは　０。\n\tラッキーカラーは　白。\n\t目上の人には　ていねいに接して。\n@c1@"
"7":
  de: "@aMina@bDer Schlüssel ist die erste Karte der großen Arkana, der Narr, auf dem Kopf stehend. Impulsive Handlungen sind jetzt nicht das Richtige!\n@c1@"
  en: "@aMeena@bYour key is being the first card of the major arcana, The Fool, reversed. You must avoid all of your impulsive actions.\n@c1@"
  es: "@aMeena@bSu carta clave es la primera carta de los arcanos mayores, El Loco, invertida. Debe evitar toda acción impulsiva.\n@c1@"
  fr: "@aMina@b%O966%XTa%YVotre%Z lame est la première carte des arcanes majeurs, le Mat, à l'envers. %O966%XTu dois%YVous devez%Z éviter toute action impulsive.\n@c1@"
  it: "@aMyra@bLa tua carta è ⓕIl Mattoⓖ, il primo degli Arcani maggiori, in posizione rovesciata. Devi evitare di commettere azioni impulsive.\n@c1@"
  ja: "@a@bミネア「あなたの　運命を示すカードは\n\t愚者の　逆位置。\n\t思いつきで動くのは　やめましょう。\n@c1@"
"8":
  de: "@aMina@bAllzu große Frechheit ist nicht immer der richtige Weg. Manche in %O966%Xdeinem%YEurem%Z Umfeld können komisch reagieren. Und %O966%Xdu wirst%YIhr werdet%Z heute sehr, sehr arglos sein.\n@c1@"
  en: "@aMeena@bIf you are too much cocky, you will only make people around you funny with you. And for today, you will be very very gullible.\n@c1@"
  es: "@aMeena@bSi es demasiado %A120%Xengreído%Z%B120%Xengreída%Z, solo conseguirá que la gente que le rodea se ría. Hoy le engañarán fácilmente.\n@c1@"
  fr: "@aMina@bSi %O966%Xtu fais preuve de trop d'assurance, les gens qui t'entourent ne feront que se moquer de toi%Yvous faites preuve de trop d'assurance, les gens qui vous entourent ne feront que se moquer de vous%Z. Aujourd'hui, %O966%Xtu es%Yvous êtes%Z particulièrement crédule.\n@c1@"
  it: "@aMyra@bSe sei troppo arrogante, le persone che ti circondano si prenderanno gioco di te. Nella giornata di oggi dimostrerai grande ingenuità.\n@c1@"
  ja: "@a@bミネア「いいかげんな言動が\n\tまわりの人を　怒らせています。\n\tまた　だまされやすい一日です。\n@c1@"
"9":
  de: "@aMina@b%O966%XDeine%YEure%Z Glückszahl ist die Drei und %O966%Xdeine%YEure%Z Glücksfarbe ist Weiß. %O966%XGib gut Acht, wo du hintrittst%YGebt gut Acht, wo Ihr hintretet%Z.\n@c1@"
  en: "@aMeena@bYour lucky number is being three, and your lucky colour is being white. Be careful where are you treading.\n@c1@"
  es: "@aMeena@bSu número de la suerte es el tres y su color de la suerte, el blanco. Deberá andarse con ojo.\n@c1@"
  fr: "@aMina@b%O966%XTon%YVotre%Z chiffre porte-bonheur est le trois et %O966%Xta%Yvotre%Z couleur de chance est le blanc. %O966%XFais attention où tu mets%YFaites attention où vous mettez%Z les pieds.\n@c1@"
  it: "@aMyra@bIl tuo numero magico è il tre e il tuo colore fortunato è il bianco. Fai attenzione a dove metti i piedi, nel viaggio della tua vita.\n@c1@"
  ja: "@a@bミネア「ラッキーナンバーは　３。\n\tラッキーカラーは　白。\n\t足元には　気をつけて。\n@c1@"
"10":
  de: "@aMina@bDer Schlüssel ist die zweite Karte der großen Arkana, der Magier, aufrecht stehend.\n@c1@"
