"137":
  de: "@aMina@bDas Glück... lacht %O966%Xdir, wenn du dich des Nachts auf ein Abenteuer begibst%YEuch, wenn Ihr Euch des Nachts auf ein Abenteuer begebt%Z. Und... %O966%Xverbringst du%Yverbringt Ihr%Z die Nacht in einer Herberge, so widerfährt %O966%Xdir%YEuch%Z Gutes.\n@c1@"
