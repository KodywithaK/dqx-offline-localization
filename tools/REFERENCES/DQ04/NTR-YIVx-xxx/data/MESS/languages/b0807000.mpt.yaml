"147":
  de: "@aMina@bDie Chance %O966%Xdeines%YEures%Z Lebens wird zum Greifen nahe sein, aber %O966%Xdu wirst sie an dir%YIhr werdet sie an Euch%Z vorüberziehen lassen.\n@c1@"
