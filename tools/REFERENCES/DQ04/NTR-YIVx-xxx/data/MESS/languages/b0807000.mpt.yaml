"29":
  de: "@aMina@bHeute ist Führung entscheidend. %O966%XDu musst%YIhr müsst%Z den Stier bei den Hörnern packen. %O966%XHandle%YHandelt%Z bei allem, was %O966%Xdu tust%YIhr tut%Z, an vorderster Stelle!\n@c1@"
  en: "@aMeena@bLeadership is important today. You must take that bull by the horns. Act first in everything that you are doing.\n@c1@"
  es: "@aMeena@bHoy el liderazgo será importante. Deberá coger el toro por los cuernos. La acción debe ser primordial en todo lo que haga.\n@c1@"
  fr: "@aMina@bLe commandement est le maître mot de la journée.\nIl faudra prendre le taureau par les cornes. %O966%XFais%YFaites%Z preuve d'initiative dans tout ce que %O966%Xtu fais%Yvous faites%Z.\n@c1@"
  it: "@aMyra@bOggi è fondamentale la determinazione: il toro va preso per le corna. Muoviti prima degli altri, qualunque sia l'attività che stai svolgendo.\n@c1@"
  ja: "@a@bミネア「リーダーシップをとって\n\t積極的に　行きましょう。\n\t何事も　先手必勝がカギです。\n@c1@"
"30":
  de: "@aMina@b%O966%XDeine%YEure%Z Glückszahl ist die Eins und %O966%Xdeine%YEure%Z Glücksfarbe ist Rot. Der Durchsetzungsfähige kommt leichter ans Ziel!\n@c1@"
  en: "@aMeena@bYour lucky number is being one, and your lucky colour is being red. Act tough, and you will be killing!\n@c1@"
  es: "@aMeena@bSu número de la suerte es el uno y su color de la suerte, el rojo. ¡Actúe con decisión y será imparable!\n@c1@"
  fr: "@aMina@b%O966%XTon%YVotre%Z chiffre porte-bonheur est le un et %O966%Xta%Yvotre%Z couleur de chance est le rouge. En agissant avec détermination, %O966%Xtu feras%Yvous ferez%Z un malheurⓠ\n@c1@"
  it: "@aMyra@bIl tuo numero magico è l'uno e il tuo colore fortunato è il rosso. Agisci con decisione e te la caverai alla grande!\n@c1@"
  ja: "@a@bミネア「ラッキーナンバーは　１。\n\tラッキーカラーは　赤。\n\t強気なあなたが　大人気です。\n@c1@"
"31":
  de: "@aMina@bDer Schlüssel ist die fünfte Karte der größeren Arkana, der Herrscher, auf dem Kopf stehend.\n@c1@"
