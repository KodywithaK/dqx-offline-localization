  fr: "@aMina@b%O966%XTon%YVotre%Z chiffre porte-bonheur est le neuf et %O966%Xta%Yvotre%Z couleur de chance est le bleu foncé. %O966%XN'oublie%YN'oubliez%Z pas de manifester de la reconnaissance.\n@c1@"
  it: "@aMyra@bIl tuo numero magico è il nove e il tuo colore fortunato è il blu cobalto. Dimostrati riconoscente verso chi ti ha dato una mano.\n@c1@"
  ja: "@a@bミネア「ラッキーナンバーは　９。\n\tラッキーカラーは　紺色。\n\t感謝の気持ちを　忘れないで。\n@c1@"
"37":
  de: "@aMina@bDer Schlüssel ist die sechste Karte der größeren Arkana, der Hierophant, auf dem Kopf stehend.\n@c1@"
