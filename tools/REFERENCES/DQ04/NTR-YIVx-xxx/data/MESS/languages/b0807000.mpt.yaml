"144":
  de: "@aMina@b%O966%XDeine%YEure%Z Glückszahl ist die Neunhunderteinunddreißig und %O966%Xdeine%YEure%Z Glücksfarbe ist eine Art Kastanienbraun.\n㈡\nDie Furcht vor der Gefahr ist schlimmer als die Gefahr selbst.\n@c1@"
  en: "@aMeena@bYour lucky number is being nine hundred and thirty one, and your lucky colour is being a kind of maroon.\n㈡\nFear of danger is worse than the danger itself.\n@c1@"
