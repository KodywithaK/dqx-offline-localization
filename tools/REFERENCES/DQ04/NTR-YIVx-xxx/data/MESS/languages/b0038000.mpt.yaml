"47":
  de: "@a@b*: Das Turnier von Endor wurde beinahe von Psaro dem Metzler gewonnen. Er hatte es schon so gut wie in der Tasche.\n@c2@"
  en: "@a@b*: The Endor Tourney was very nearly won by a man calling himself Psaro the Manslayer. He practically had it in the bag.\n@c2@"
  es: "@a@b*: Un hombre que se hacía llamar Psaro el Carnicero estuvo a punto de ganar el Torneo de Endor. Prácticamente ya lo había conseguido.\n@c2@"
  fr: "@a@b*ⓢ Le tournoi de Chandor a failli être remporté par un certain Psaro l'Exterminateur. Il était à deux doigts de la victoire.\n@c2@"
  it: "@a@b*: Il Torneo di Endor stava per essere vinto da un certo Psaro il Massacratore. Aveva il titolo praticamente in tasca.\n@c2@"
  ja: "@a@b＊「この前の　武術大会では\n\tデスピサロという男が\n\t優勝しかけたのですが……。\n@c2@"
"48":
  de: "@a@b*: Doch dann ist er mittendrin verschwunden. Einfach so...\n@c2@"
  en: "@a@b*: But he disappeared half way through the proceedings. I wonder who he was...\n@c2@"
  es: "@a@b*: Pero desapareció a mitad del torneo. Me pregunto quién sería...\n@c2@"
  fr: "@a@b*ⓢ Mais il a disparu au beau milieu de l'épreuve.\nJe me demande qui c'était...\n@c2@"
  it: "@a@b*: Ma a metà gara è scomparso. Chissà chi era...\n@c2@"
  ja: "@a@b＊「デスピサロは　途中で\n\tいなくなったんですよ。\n\tいったい　何者だったのでしょうね。\n@c2@"
"49":
  de: "@a@b*: Das hier ist König Norberts Thronsaal.\n@c2@"
  en: "@a@b*: This is King Norman's throne room.\n@c2@"
  es: "@a@b*: Este es el salón del trono del rey Norman.\n@c2@"
  fr: "@a@b*ⓢ Ceci est la salle du trône du roi Norbert.\n@c2@"
  it: "@a@b*: Questa è la stanza del trono di Re Norman.\n@c2@"
  ja: "@a@b＊「ここは　エンドール王の\n\tお部屋です。\n@c2@"
"50":
  de: "@a@b*: Unser König gewährt wirklich jedem Audienz und schert sich nicht um seine Sicherheit. Wo soll das bloß noch hinführen...\n@c2@"
  en: "@a@b*: Our king would grant an audience with anyone, without the slightest regard for his own safety. I just hope he doesn't come unstuck.\n@c2@"
  es: "@a@b*: Nuestro rey concede audiencia a todo el mundo, sin la menor preocupación por su propia seguridad. Solo espero que no tenga problemas.\n@c2@"
  fr: "@a@b*ⓢ Notre roi accorde des audiences à n'importe qui, sans même se soucier de sa propre sécurité.\nJ'espère simplement qu'il ne lui arrivera rien.\n@c2@"
  it: "@a@b*: Il nostro Re concederebbe un'udienza a chiunque, senza curarsi minimamente della propria incolumità.\n㈡\n*: Spero che non debba mai pentirsi della propria magnanimità.\n@c2@"
  ja: "@a@b＊「わが王は　身分を問わず\n\tどんな者とも　お会いなさる。\n\tそそうのないようにな。\n@c2@"
"51":
  de: "@aKönig Norbert@bAh, Herr Talun. Ich habe gehört, dass Euer Geschäft bereits eröffnet ist.\n@c2@"
  en: "@aKing Norman@bAh, Mr. Taloon. I hear you've already set up your shop here.\n@c2@"
  es: "@aRey Norman@b¡Ah!, señor Taloon. Me han dicho que ya ha abierto su tienda aquí.\n@c2@"
  fr: "@aRoi Norbert@bAh, Monsieur Taloon. J'ai entendu dire que votre magasin était déjà ouvert.\n@c2@"
  it: "@aRe Norman@bAh, Baldo Baldini. Ho saputo che hai già aperto il tuo negozio.\n@c2@"
  ja: "@a@b王「おお　トルネコ！\n\tついに　店を　出したそうじゃな。\n@c2@"
"52":
  de: "@aKönig Norbert@bMeinen Glückwunsch. Ich würde Euch sehr gerne einen Auftrag erteilen, falls es Euch recht ist.\n@c2@"
  en: "@aKing Norman@bCongratulations. You'll permit me to place an order with you straight away, I hope.\n@c2@"
  es: "@aRey Norman@bEnhorabuena. Espero que no tenga inconveniente en que le haga un pedido ya mismo.\n@c2@"
  fr: "@aRoi Norbert@bFélicitations. J'espère que vous me permettrez de vous passer une commande sur-le-champ.\n@c2@"
  it: "@aRe Norman@bComplimenti. Spero che mi permetterai subito di fare un ordine!\n@c2@"
  ja: "@a@b王「わしからの祝いじゃ！\n\t早速　そなたに注文しよう！\n@c2@"
"53":
  de: "@aKönig Norbert@bIch möchte einen Teil meiner Truppen neu ausrüsten. Die Lieferung geht nach unten an meinen Kommandeur.\n@c2@"
  en: "@aKing Norman@bI wish to re-equip some of the castle troops. You can make your deliveries to my commander downstairs.\n@c2@"
  es: "@aRey Norman@bDeseo cambiar el equipo de algunas de las tropas de mi castillo. Puede efectuar las entregas a mi comandante, en el piso de abajo.\n@c2@"
  fr: "@aRoi Norbert@bJ'aimerais renouveler l'équipement de certains soldats du château. Vous pouvez effectuer les livraisons auprès du commandant, en bas.\n@c2@"
  it: "@aRe Norman@bVorrei acquistare del nuovo equipaggiamento per le truppe del castello. Potrai consegnare la merce al comandante, di sotto.\n@c2@"
  ja: "@a@b王「お城の兵士の　武器　防具を\n\t買いそろえ　下の部屋の者に\n\t納めてほしい。\n@c2@"
"54":
  de: "@aKönig Norbert@bIch brauche sechs Stahlbreitschwerter und sechs Eisenrüstungen.\n@c2@"
  en: "@aKing Norman@bI require six steel broadswords and six suits of iron armour.\n@c2@"
  es: "@aRey Norman@bNecesito seis espadas de acero y seis armaduras de hierro.\n@c2@"
  fr: "@aRoi Norbert@bIl me faut 6 épées larges d'acier et 6 armures de fer.\n@c2@"
  it: "@aRe Norman@bTi chiedo di procurarmi sei spade d'acciaio e sei armature di ferro.\n@c2@"
  ja: "@a@b王「注文は　はがねのつるぎ　６本\n\t鉄のよろい　６着じゃ！\n@c2@"
"55":
  de: "@aKönig Norbert@bMein Kommandeur wird Euch alle Einzelheiten erläutern.\n@c2@"
  en: "@aKing Norman@bMy commander will fill you in on the exact details.\n@c2@"
  es: "@aRey Norman@bMi comandante le indicará los detalles exactos.\n@c2@"
  fr: "@aRoi Norbert@bMon commandant vous donnera tous les détails.\n@c2@"
  it: "@aRe Norman@bIl comandante ti spiegherà tutto nei particolari.\n@c2@"
  ja: "@a@b王「くわしい話は　下の部屋におる\n\t兵士長から　聞くがよい。\n@c2@"
"56":
  de: "@aKönig Norbert@bIch habe mir lange genug anhören müssen, dass meine Truppen schlecht ausgerüstet seien.\n@c2@"
  en: "@aKing Norman@bIt has long been said that my kingdom's troops are ill-equipped.\n@c2@"
  es: "@aRey Norman@bDurante mucho tiempo se ha comentado que las tropas de mi reino estaban mal equipadas.\n@c2@"
  fr: "@aRoi Norbert@bCela fait trop longtemps que les gens disent que mes soldats sont sous-équipés.\n@c2@"
  it: "@aRe Norman@bDa troppo tempo si dice che le truppe del mio regno siano male equipaggiate.\n@c2@"
  ja: "@a@b王「以前から　わが国の兵士の\n\tそうびが　たよりないという話は\n\tあったのじゃ。\n@c2@"
"57":
  de: "@aKönig Norbert@bIch hoffe, dass Eure Lieferungen diesen Verleumdungen ein Ende setzen, Herr Talun.\n@c2@"
  en: "@aKing Norman@bWell, Mr. Taloon, I trust your supplies of armour and weapons will change all that.\n@c2@"
  es: "@aRey Norman@bPues bien, señor Taloon, espero que sus suministros de armas y armaduras sirvan para cambiar la situación.\n@c2@"
  fr: "@aRoi Norbert@bEh bien, Monsieur Taloon, j'espère que vos armes et vos armures remédieront à ce problème.\n@c2@"
  it: "@aRe Norman@bBene, Baldo Baldini. Sono certo che le armi e le armature che ci porterai porranno fine a queste maldicenze.\n@c2@"
  ja: "@a@b王「トルネコよ。\n\t武器　防具の調達のこと\n\tよいはたらきを　期待しておるぞ。\n@c2@"
"58":
  de: "@aKönig Norbert@bGute Arbeit, Herr Talun! Eure Rüstungen und Waffen sind ausgezeichnet.\n@c2@"
  en: "@aKing Norman@bMr. Taloon! You've done a fine job of supplying my men with armour and weapons.\n@c2@"
  es: "@aRey Norman@b¡Señor Taloon! Su trabajo de suministrar armas y armaduras para mis hombres ha sido excelente.\n@c2@"
  fr: "@aRoi Norbert@bMonsieur Taloonⓠ Je dois vous féliciter pour les armures et les épées de mes hommesⓠ\n@c2@"
  it: "@aRe Norman@bBaldo Baldini, hai reso un ottimo servizio alle mie truppe, fornendo loro armi e armature!\n@c2@"
  ja: "@a@b王「トルネコよ！\n\t兵士たちの　武器　防具の調達\n\tまことに　ご苦労であった！\n@c2@"
"59":
  de: "@aKönig Norbert@bIch nehme an, dass Ihr als Waffenhändler die Gerüchte über das Zenithiaschwert kennt?!\n@c2@"
  en: "@aKing Norman@bBeing an arms merchant, I expect you're privy to the recent rumours concerning the Zenithian Sword.\n@c2@"
  es: "@aRey Norman@bSiendo mercader de armas, supongo que tendrá conocimiento de los rumores acerca de la Espada de Zenithia.\n@c2@"
  fr: "@aRoi Norbert@bÉtant marchand d'armes, je suppose que vous avez eu vent de ce qui se dit sur l'Épée zénithienne.\n@c2@"
  it: "@aRe Norman@bSicuramente, visto che vendi armi, avrai sentito parlare della Spada Zenithiana.\n@c2@"
  ja: "@a@b王「ところで　そなたも　武器屋なら\n\t天空のつるぎのウワサを\n\t聞いたことが　あるであろう。\n@c2@"
"60":
  de: "@aKönig Norbert@bEs heißt, dass diese allmächtige Waffe Felsgestein durchschlagen kann.\n@c2@"
  en: "@aKing Norman@bIt is said to be an almighty blade that can carve through solid rock.\n@c2@"
  es: "@aRey Norman@bSegún cuentan, se trata de una espada invencible capaz de hendir la roca maciza.\n@c2@"
  fr: "@aRoi Norbert@bC'est, paraît-il, une épée si puissante qu'elle peut trancher la roche.\n@c2@"
  it: "@aRe Norman@bSi dice che sia in grado di perforare persino le rocce.\n@c2@"
  ja: "@a@b王「いかなる　岩をも　くだく\n\t最強のつるぎ　だそうじゃ。\n@c2@"
"61":
  de: "@aKönig Norbert@bWenn solch ein Schwert tatsächlich existiert, wäre es von unschätzbarem Wert.\n@c2@"
  en: "@aKing Norman@bIf such a sword really were to exist, it would be a sought-after weapon indeed.\n@c2@"
  es: "@aRey Norman@bSi realmente existiese una espada así, muchos andarían tras ella.\n@c2@"
  fr: "@aRoi Norbert@bSi une telle épée existait, les gens donneraient cher pour l'avoir.\n@c2@"
  it: "@aRe Norman@bTutti vorrebbero possedere una simile arma, se esistesse davvero!\n@c2@"
  ja: "@a@b王「もし　そんなものが　本当にあるなら\n\tぜひとも　手に入れたいものじゃな……。\n@c2@"
"62":
  de: "@aPrinzessin Veronica@bIch kann es noch gar nicht glauben! Unserer Liebe steht nichts mehr im Wege! Wir können endlich heiraten!\n@c1@"
  en: "@aPrincess Veronica@bI can hardly believe it! For our love to be recognised at last! I can marry my dear Regan!\n@c1@"
  es: "@aPrincesa Verónica@b¡No puedo creerlo! ¡Nuestro amor ha sido reconocido al fin! ¡Puedo casarme con mi querido Alí!\n@c1@"
  fr: "@aPrincesse Véronica@bJ'ai du mal à y croireⓠ\nEnfin nous n'avons plus besoin de nous cacherⓠ\nJe vais épouser mon cher Réginaldⓠ\n@c1@"
  it: "@aPrincipessa Veronica@bNon ci posso credere! Alla fine il nostro amore è stato riconosciuto, e finalmente io e il mio caro Vitellozzo potremo sposarci!\n@c1@"
  ja: "@a@bモニカ「愛する　リックとの結婚を\n\t許してもらえるなんて\n\tまるで　夢のよう！\n@c1@"
"63":
  de: "@aPrinzessin Veronica@bEuer Name ist Torneko, richtig? Ich danke Euch, Torneko, aus tiefstem Herzen.\n@c1@"
  en: "@aPrincess Veronica@bYour name's Torneko, isn't it? Thank you, Torneko. From the bottom of my heart.\n@c1@"
  es: "@aPrincesa Verónica@bSe llama Torneko, ¿cierto?\nGracias, Torneko.\nDesde lo más profundo de mi corazón.\n@c1@"
  fr: "@aPrincesse Véronica@bVous vous appelez Torneko, c'est çaⓡ\nMerci, Torneko.\nMerci de tout cœur.\n@c1@"
  it: "@aPrincipessa Veronica@bIl tuo nome è Baldo, vero? Grazie di cuore, Baldo...\n@c1@"
  ja: "@a@bモニカ「トルネコと　いいましたね。\n\t心から　感謝しますわ。\n@c1@"
"64":
  de: "@a@b*: Meine Nachforschungen haben ergeben, dass es einst eine Klinge mit dem Namen Zenithiaschwert gab.\n@c2@"
  en: "@a@b*: According to my research, there was once in existence a blade known as the Zenithian Sword.\n@c2@"
  es: "@a@b*: Según mis indagaciones, hace tiempo existía una espada que recibía el nombre de Espada de Zenithia.\n@c2@"
  fr: "@a@b*ⓢ Si j'en crois mes recherches, il existait autrefois une épée appelée l'Épée zénithienne.\n@c2@"
  it: "@a@b*: Dalle mie ricerche risulta che un tempo è esistita un'arma conosciuta col nome di Spada Zenithiana.\n@c2@"
  ja: "@a@b＊「その昔　天空のつるぎというものが\n\tあったそうじゃな。\n@c2@"
"65":
  de: "@a@b*: Es heißt, dass der Schwertträger in den Himmel aufsteigen könne. Natürlich weiß ich nicht, ob an diesen Geschichten etwas Wahres ist.\n@c2@"
  en: "@a@b*: They say the person who possessed it could climb up to the heavens. Of course, I don't know what the truth is behind the tales.\n@c2@"
  es: "@a@b*: Se dice que la persona que la posea podrá ascender hasta los cielos. Evidentemente, desconozco si estas historias son reales o no.\n@c2@"
  fr: "@a@b*ⓢ On dit que la personne qui la détiendrait pourrait toucher les Cieux. Bien entendu, je ne sais pas quelle est la part de vérité dans cette légendeⓠ\n@c2@"
  it: "@a@b*: La leggenda narra che chi ne entra in possesso possa raggiungere il cielo. Chissà se è vero...!\n@c2@"
  ja: "@a@b＊「そのつるぎを　手にした者は\n\t天に　上ることが　できたそうじゃ。\n\tいったい　どういうことじゃろうか？\n@c2@"
"66":
  de: "@a@b*: Dieser Tisch muss so sauber sein, dass König Norbert davon essen könnte.\n@c2@"
  en: "@a@b*: I've got to wipe this table down.\nIt's all work, work, work around here.\n@c2@"
  es: "@a@b*: Esta mesa tiene que quedar tan limpia que el propio rey Norman pueda comer en ella.\n@c2@"
  fr: "@a@b*ⓢ Cette table doit être assez propre pour que le roi Norbert puisse prendre son souper dessus.\n@c2@"
  it: "@a@b*: Questo tavolo dev'essere tanto pulito che Re Norman dovrebbe potervi mangiare sopra direttamente, se volesse farlo.\n@c2@"
  ja: "@a@b＊「テーブルを　きれいにふかないと。\n\tせっせ　せっせ。\n@c2@"
"67":
  de: "@a@b*: Da ist so ein Typ mit einem komischen Namen... Arche Defekt oder so ähnlich... der repariert überall Brücken.\n@c2@"
  en: "@a@b*: There's a fellow with a funny name ⓚⓛ Arch Defect or something like that ⓚⓛ who's been fixing bridges all over the place.\n@c2@"
  es: "@a@b*: Hay un tipo de nombre un tanto curioso... Al Defecto o algo parecido, que se encarga de arreglar puentes por todas partes.\n@c2@"
  fr: "@a@b*ⓢ Un gars avec un nom pas du coin... Hector Boyaux ou quelque chose comme ça... a réparé tous les ponts de la région.\n@c2@"
  it: "@a@b*: C'è un tizio con un nome buffo... Arco Difett, o qualcosa di simile... che va in giro a sistemare ponti.\n@c2@"
  ja: "@a@b＊「なんでも　ドン・ガアデとかいう者が\n\tあちこちの橋を　直したそうだな。\n@c2@"
"68":
  de: "@a@b*: Und jetzt sind die Wege nach Norden und Osten wieder offen.\n@c2@"
  en: "@a@b*: Now both the way north and the way east are open again.\n@c2@"
  es: "@a@b*: Ahora tanto el paso hacia el norte como hacia el este están abiertos de nuevo.\n@c2@"
  fr: "@a@b*ⓢ Maintenant, les routes vers le nord et vers l'est sont à nouveau praticables.\n@c2@"
  it: "@a@b*: Ora le vie che conducono a nord e a est sono di nuovo percorribili.\n@c2@"
  ja: "@a@b＊「おかげで　北にも　東にも\n\t行けるようになったのだ。\n@c2@"
"69":
  de: "@a@b*: Oh du liebe Güte. So viel Wäsche und so wenig Zeit, um sie zu waschen!\n@c2@"
  en: "@a@b*: Dearie me. So many things to wash and not enough minutes in the day to wash them in!\n@c2@"
  es: "@a@b*: Ay, por la Diosa. ¡Tanto por lavar y tan poco tiempo para lavarlo!\n@c2@"
  fr: "@a@b*ⓢ Pauvre de moi. Tant de choses à laver et si peu de temps dans la journée pour le faireⓠ\n@c2@"
  it: "@a@b*: Un'intera giornata di lavoro non mi basterà per lavare tutta questa roba! Povera me...\n@c2@"
  ja: "@a@b＊「よいしょ　よいしょ。\n\t洗い物が多くて　たいへん！\n@c2@"
"70":
  de: "@a@b*: Seid Ihr der Gemüsehändler? Was, Ihr verkauft Waffen? Dann seid Ihr hier falsch, das ist nämlich die Küche.\n@c1@"
  en: "@a@b*: Oh, are you the greengrocer?\nWhat? You sell weapons? I'm sorry, but you're in the wrong place, then. This here's the kitchen.\n@c1@"
  es: "@a@b*: ¡Oh!, ¿eres el tendero?\n¿Qué? ¿Vendes armas? Lo siento, pero has venido al lugar equivocado. Esta es la cocina.\n@c1@"
  fr: "@a@b*ⓢ Oh, vous êtes le maraîcherⓡ\nPardonⓡ Vous vendez des armesⓡ \n㈡\n*ⓢ Désolée, mais dans ce cas, vous avez frappé à la mauvaise porte.\nC'est une cuisine iciⓠ\n@c1@"
  it: "@a@b*: Oh, sei il fruttivendolo? Come...? Vendi armi? Mi spiace, ma temo che ti trovi nel posto sbagliato: questa è la cucina.\n@c1@"
  ja: "@a@b＊「あら　あなた　八百屋さん？\n\tえ？　武器屋さんなの？\n\tまあ！　ここは　台所なのよ！\n@c1@"
"71":
  de: "@a@b*: Seid vor Psaro dem Metzler auf der Hut, ja?\n@c2@"
  en: "@a@b*: Be careful of that Psaro guy!\n@c2@"
  es: "@a@b*: %H860%XTen%YTened%Z cuidado con Psaro el Carnicero, ¿me %H860%Xoyes%Yoís%Z?\n@c2@"
  fr: "@a@b*ⓢ Méfiez-vous de ce Psaro l'Exterminateur, surtoutⓠ\n@c2@"
  it: "@a@b*: %H860%XFai%YFate%Z attenzione a Psaro il Massacratore, mi raccomando!\n@c2@"
  ja: "@a@b＊「デスピサロに　気をつけるんだ！\n@c2@"
"72":
  de: "@a@b*: Das Turnier ist vorbei, deshalb ist der Zutritt jetzt verboten.\n@c2@"
  en: "@a@b*: The tourney's over now, so there'll be no more public access to this place for a while.\n@c2@"
  es: "@a@b*: El torneo ha finalizado, por lo que durante un tiempo no se podrá acceder al recinto.\n@c2@"
  fr: "@a@b*ⓢ Maintenant que le tournoi est terminé, personne ne pourra rentrer ici avant longtemps.\n@c2@"
  it: "@a@b*: Il torneo si è concluso, quindi per un po' di tempo il pubblico non potrà entrare qui.\n@c2@"
  ja: "@a@b＊「武術大会も　終わったので\n\tここは　しばらくの間\n\t閉じられることになったのだ。\n@c2@"
"73":
  de: "@a@b*: Hier könnt Ihr leider nicht rein. Ihr müsst umkehren.\n@c2@"
  en: "@a@b*: I'm afraid you can't come in here.\nYou'll have to turn back.\n@c2@"
  es: "@a@b*: Me temo que no puedes entrar aquí.\nTendrás que darte la vuelta.\n@c2@"
  fr: "@a@b*ⓢ Désolé, mais vous ne pouvez pas entrer.\nVous devez faire demi-tour.\n@c2@"
  it: "@a@b*: Spiacente, qui non si può entrare. %H860%XVai%YAndate%Z via, per favore.\n@c2@"
  ja: "@a@b＊「残念だが\n\tここに　入ることはできぬ。\n\t立ち去るがいい。\n@c2@"
"74":
  de: "@a@b*: Ha-püh... Ha-püh...\nNichts... zu... berichten...\nHa-püh...\n@c2@"
  en: "@a@b*: Ah-phew... Ah-phew...\nNo-thing...to-report...\nAh-phew...\n@c2@"
  es: "@a@b*: Ah, fiuuu... Ah-fiuuu...\nNa-da... que de-cir...\nAh-fiuuu...\n@c2@"
  fr: "@a@b*ⓢ Ron-pfff... Ron-pfff...\nRien... à... signaler...\nRon-pfff...\n@c2@"
  it: "@a@b*: Ronf... fiuuu... Ronf... fiuuu... Niente da segnalare... Ronf... fiuuu...\n@c2@"
  ja: "@a@b＊「むにゃむにゃ……。\n\t異常なーし……むにゃ。\n@c2@"
"75":
  de: "@a@b*: Was schleicht Ihr denn mitten in der Nacht in der Burg herum?\n@c2@"
  en: "@a@b*: What do you think you're doing prowling about the castle at this time of night?\n@c2@"
  es: "@a@b*: ¿Qué %H860%Xcrees que estás haciendo%Ycreéis que estáis haciendo%Z merodeando por el castillo a estas horas de la noche?\n@c2@"
  fr: "@a@b*ⓢ Que faites-vous à rôder dans le château à une heure pareilleⓡ\n@c2@"
  it: "@a@b*: Che ci %H860%Xfai%Yfate%Z al castello a quest'ora di notte?\n@c2@"
  ja: "@a@b＊「こんな夜更けに\n\tお城に　入ってくるとは！\n@c2@"
"76":
  de: "@a@b*: Ich kann Euch nicht einfach so hier herumlaufen lassen. Na los, raus mit Euch!\n@c2@"
  en: "@a@b*: I can't let you just wander about as you please. Go on now, get out!\n@c2@"
  es: "@a@b*: No puedo permitir que %H860%Xte pasees%Yos paseéis%Z por donde %H860%Xte%Yos%Z apetezca. ¡Vamos, largo de aquí!\n@c2@"
  fr: "@a@b*ⓢ Je ne peux pas vous laisser vous promener comme ça, à votre guise. Allons, sortez maintenantⓠ\n@c2@"
  it: "@a@b*: È vietato stare qui. %H860%XVai%YAndate%Z via, forza!\n@c2@"
  ja: "@a@b＊「わたしが　見つけた以上\n\t黙っているわけには　ゆかぬ。\n\tささ　立ち去られよ！\n@c2@"
"77":
  de: "@a@b*: Es ist die Rede davon, dass %A090%Xein großer Held%Z%B090%Xeine große Heldin%Z die Welt retten wird.\n@c2@"
  en: "@a@b*: There's talk in the air of a great %A090%Xhero%Z%B090%Xheroine%Z who's going to save the world.\n@c2@"
  es: "@a@b*: Circulan rumores sobre %A090%Xun gran héroe%Z%B090%Xuna gran heroína%Z que vendrá para salvar el mundo.\n@c2@"
  fr: "@a@b*ⓢ Les gens parlent d'%A090%Xun grand héros%Z%B090%Xune grande héroïne%Z qui viendrait sauver le monde.\n@c2@"
  it: "@a@b*: Corre voce che ci sia %A090%Xun eroe%Z%B090%Xun'eroina%Z che sta cercando di salvare il mondo.\n@c2@"
  ja: "@a@b＊「ウワサでは　世界を救う　勇者が\n\tどこかで　育っているようじゃ。\n@c2@"
"78":
  de: "@a@b*: Aber das glaube ich nicht. Was kann schon so Besonders an %A090%Xeinem Mann%Z%B090%Xeiner Frau%Z sein, dass %A090%Xer%Z%B090%Xsie%Z die ganze Welt retten kann?\n@c2@"
  en: "@a@b*: But I can't really see it. I mean, what could be so special about one %A090%Xman%Z%B090%Xwoman%Z that they could save the whole world?\n@c2@"
  es: "@a@b*: Pero no lo veo claro. Quiero decir, ¿qué podría tener de especial %A090%Xun hombre%Z%B090%Xuna mujer%Z para que pudiera salvar al mundo entero?\n@c2@"
  fr: "@a@b*ⓢ Mais pour l'instant, aucune trace %A090%Xde lui%Z%B090%Xd'elle%Z.\nEn plus, qu'est-ce qu'%A090%Xil%Z%B090%Xelle%Z aurait de si spécial pour pouvoir sauver le mondeⓡ\n@c2@"
  it: "@a@b*: Mah, a me sembra una sciocchezza... Voglio dire, come può %A090%Xun solo uomo%Z%B090%Xuna sola donna%Z salvare tutto il mondo?\n@c2@"
  ja: "@a@b＊「しかし　世界を救う　勇者とは\n\tどのような人物なのやら……。\n\tどうも　うさんくさい話じゃな。\n@c2@"
"79":
  de: "@a@b*: Es heißt, die Monster sind so wild in letzter Zeit, weil jemand, der sich Herr der Unterwelt nennt, wieder auferstanden ist.\n@c2@"
  en: "@a@b*: People are saying the monsters are so ferocious recently because someone called the Lord of the Underworld has been resurrected.\n@c2@"
  es: "@a@b*: La gente dice que la ferocidad de los monstruos ha aumentado últimamente por que alguien al que llaman Señor del Inframundo ha resucitado.\n@c2@"
  fr: "@a@b*ⓢ Il paraîtrait que les monstres sont devenus encore plus méchants parce qu'un soi-disant Seigneur des Enfers aurait été ressuscité.\n@c2@"
  it: "@a@b*: Si dice in giro che i mostri siano diventati tanto aggressivi perché un certo Signore degli Inferi è tornato in vita.\n@c2@"
  ja: "@a@b＊「最近の　怪物たちの　あばれようは\n\t地獄の帝王が　よみがえるため\n\tとかいう　ウワサもあるし……。\n@c2@"
"80":
  de: "@a@b*: Verrückt. Man weiß nicht, welchen Gerüchten man Glauben schenken soll.\n@c2@"
  en: "@a@b*: Things are getting crazy. I just don't know which rumours I can believe these days.\n@c2@"
  es: "@a@b*: El mundo se está volviendo loco. Ya no sé qué rumores creerme.\n@c2@"
  fr: "@a@b*ⓢ Le monde devient complètement fou.\nOn ne sait plus qui croire, ces temps-ci.\n@c2@"
  it: "@a@b*: Il mondo sta impazzendo. Se ne sentono di tutti i colori, di questi tempi...\n@c2@"
  ja: "@a@b＊「いったい　どのウワサが　本当なのか\n\t見当が　つきませんね……。\n@c2@"
"81":
  de: "@a@b*: Ha-püh... Ha-püh...\n@c2@"
  en: "@a@b*: Ah-phew... Ah-phew...\n@c2@"
  es: "@a@b*: Ah-fiuu... Ah-fiuu...\n@c2@"
  fr: "@a@b*ⓢ Ron-pfff... Ron-pfff...\n@c2@"
  it: "@a@b*: Ronf... Ronf...\n@c2@"
