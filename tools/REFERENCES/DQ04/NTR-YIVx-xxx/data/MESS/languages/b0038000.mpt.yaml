"83":
  de: "@a@b*: König Norbert und Prinzessin Veronica haben bereits ihr Abendessen eingenommen und sich zurückgezogen. Ich räume mal lieber weiter auf.\n@c2@"
  en: "@a@b*: King Norman and Princess Veronica had supper and retired to their chambers already. I'd better get on with the clearing up.\n@c2@"
  es: "@a@b*: El rey Norman y la princesa Verónica ya han cenado y se han retirado a sus aposentos. Será mejor que despeje esto.\n@c2@"
  fr: "@a@b*ⓢ Le roi Norbert et la princesse Véronica ont déjà soupé et se sont retirés dans leurs chambres. Je ferais bien de continuer à nettoyer.\n@c2@"
  it: "@a@b*: Re Norman e la Principessa Veronica hanno già cenato e ora si trovano nelle loro stanze. Sarà meglio mettere tutto in ordine.\n@c2@"
  ja: "@a@b＊「王様と　姫さまは\n\t食事も終わって　お休みです。\n\tさあ片付けなきゃ。　せっせ　せっせ。\n@c2@"
"84":
  de: "@a@b*: Ich war mir sicher, dass dieser Psaro das Turnier gewinnen würde.\n@c2@"
  en: "@a@b*: I was sure that Psaro gentleman was going to win the Endor Tourney.\n@c2@"
  es: "@a@b*: Estaba convencido de que ese tal Psaro iba a hacerse con el Torneo de Endor.\n@c2@"
  fr: "@a@b*ⓢ J'étais persuadée que ce charmant Psaro allait remporter le tournoi de Chandor.\n@c2@"
  it: "@a@b*: Avrei scommesso qualunque cifra sulla vittoria di Psaro.\n@c2@"
  ja: "@a@b＊「この前の　武術大会では\n\tデスピサロさまが　ぜったいに\n\t優勝だと　思っていたのに……。\n@c2@"
"85":
  de: "@a@b*: Doch er verschwand noch vor Ende des Wettkampfs. Wo ist er nur hin...?\n@c2@"
  en: "@a@b*: But he vanished before the end of the competition. I wonder where he got to...\n@c2@"
  es: "@a@b*: Pero desapareció antes de que terminara la competición. Me pregunto a dónde iría...\n@c2@"
  fr: "@a@b*ⓢ Mais il a disparu avant la fin de la compétition.\nJe me demande bien où il est parti...\n@c2@"
  it: "@a@b*: Ma è sparito prima che il torneo si concludesse. Chissà che fine ha fatto...\n@c2@"
  ja: "@a@b＊「大会の途中で　急に　姿を\n\t消しちまうなんて　いったい\n\tどこに　行ったんだろうねえ？\n@c2@"
"86":
  de: "@a@b*: Psaro hat das Turnier abgebrochen, weil er etwas Wichtiges zu erledigen hatte. Warum sollte er sonst einfach so verschwinden?\n@c1@"
  en: "@a@b*: Psaro pulled out of the tourney because he had some urgent business to attend to. Why else would he have disappeared like that?\n@c1@"
  es: "@a@b*: Psaro se retiró del torneo porque tenía asuntos urgentes que resolver. ¿Por qué si no habría desaparecido de ese modo?\n@c1@"
  fr: "@a@b*ⓢ Psaro a sûrement abandonné le tournoi parce qu'il avait quelque chose d'urgent à faire. Sinon, je ne vois pas pourquoi il aurait disparu.\n@c1@"
  it: "@a@b*: Psaro si è ritirato dal torneo perché aveva da sbrigare degli affari molto urgenti.\n㈡\n*: Altrimenti, per quale altro motivo avrebbe mai abbandonato la competizione? Aveva la vittoria in tasca!\n@c1@"
  ja: "@a@b＊「デスピサロが　いなくなったのは\n\t武術大会に出るよりも\n\t大事な用が　できたからよ！\n@c1@"
"87":
  de: "@a@b*: Die Frauen plaudern den lieben langen Tag über dies und das und jenes. Da komm ich nicht mehr mit.\n@c2@"
  en: "@a@b*: The women ramble on about this and that all day long. I can't keep up.\n@c2@"
  es: "@a@b*: Las mujeres se pasan todo el día cotilleando. No consigo mantenerme al día.\n@c2@"
  fr: "@a@b*ⓢ Les femmes n'arrêtent pas de parler de tout et de rien à longueur de journée. Je n'arrive pas à suivre.\n@c2@"
  it: "@a@b*: Le donne non fanno altro che parlare tutto il giorno. Non ne posso più!\n@c2@"
  ja: "@a@b＊「どうも　女たちのおしゃべりは\n\tとりとめがなくて\n\tついてゆけんな。\n@c2@"
