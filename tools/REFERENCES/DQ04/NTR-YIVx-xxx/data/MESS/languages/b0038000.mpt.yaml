  de: "@a@b*: Beeilt Euch mit der Lieferung. Seine Majestät der König wird sonst sehr ungehalten sein.\n@c2@"
  en: "@a@b*: Hurry up and deliver the goods.\nYou wouldn't want to let His Majesty down.\n@c2@"
  es: "@a@b*: Date prisa en entregar la mercancía.\nNo querrás decepcionar a Su Majestad.\n@c2@"
  fr: "@a@b*ⓢ Dépêchez-vous de nous livrer ça.\nVous ne voudriez pas décevoir Sa Majesté.\n@c2@"
  it: "@a@b*: %H860%XSbrigati%YSbrigatevi%Z a consegnare la merce. Non %H860%Xvorrai%Yvorrete%Z mica far aspettare Sua Maestà!\n@c2@"
  ja: "@a@b＊「がんばって　集めてくるようにな。\n\tでは　行くがよい。\n@c2@"
"41":
  de: "@a@b*: Was? Ihr habt überhaupt nichts dabei?\n@c2@"
  en: "@a@b*: What? You haven't brought anything?\n@c2@"
  es: "@a@b*: ¿Qué? ¿Que no has traído nada?\n@c2@"
  fr: "@a@b*ⓢ Quoiⓡ Vous n'avez encore rien livréⓡ\n@c2@"
  it: "@a@b*: Cosa? Non %H860%Xhai%Yavete%Z portato niente?\n@c2@"
  ja: "@a@b＊「なんと！\n\tまだ　持って来てなかったか！？\n@c2@"
