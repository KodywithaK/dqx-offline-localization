"0":
  de: "@aTessa@bAh, du bist's, Torneko. Haste neue Sachen zum Verkaufen mitgebracht?\n@c1@"
  en: "@aTessie@bThere y'are, Torneko.\nHave ye brought any new items we can sell?\n@c1@"
  es: "@aTrakiba@b¿Ya has vuelto, Torneko?\n¿Has traído algún objeto que piodamos viender?\n@c1@"
  fr: "@aLucille@bTe voilà, Torneko.\nTu as rapporté quelque chose à vendreⓡ\n@c1@"
  it: "@aBeatrice@bEccoti huì, Baldo. Te tu ha' portato hualche oggetto da vende'?\n@c1@"
  ja: "@a@bネネ「おかえりなさい　あなた。\n\t品物を　仕入れてきてくれた？\n@c1@"
"1":
  de: "@aTessa@bWirklich? Gut, aber bevor ich sie nehm, geb ich dir erstmal all unsere Einnahmen.\n@c1@"
  en: "@aTessie@bYe have? Right, well before I take them from ye, let me give ye the recent takings.\n@c1@"
  es: "@aTrakiba@b¿Has traído? Muy bien, piero dieja que ti dé los últimos bieneficios antes de hacerme cargo de eso.\n@c1@"
  fr: "@aLucille@bOuiⓡ Attendsⓠ Avant que tu me donnes ça, voilà l'argent des dernières ventes.\n@c1@"
  it: "@aBeatrice@bSì? Bene, prima di prende' huello che te tu ha' portato, ti devo da' l'incasso.\n@c1@"
  ja: "@a@bネネ「じゃあ　品物を　預かる前に\n\tこれが　昨日の売上げよ。\n@c1@"
"2":
  de: "@a@bTorneko erhält %a00540 Goldmünze%H540%X%Yn%Z.\n@c1@"
  en: "@a@bTorneko receives %a00540 gold coin%H540%X%Ys%Z.\n@c1@"
  es: "@a@bTorneko recibe %a00540 moneda%H540%X%Ys%Z de oro.\n@c1@"
  fr: "@a@bTorneko reçoit %a00540 pièce%I540%X%Ys%Z d'or.\n@c1@"
  it: "@a@bBaldo riceve %a00540 %H540%Xmoneta%Ymonete%Z d'oro.\n@c1@"
  ja: "@a@bトルネコは　%a00540Ｇを\n受け取った。\n@c1@"
"3":
  de: "@aTessa@bSo. Dann lass mal sehen, was du da hast...\n@c1@"
  en: "@aTessie@bSo, then. Let's see what ye've brought us...\n@c1@"
  es: "@aTrakiba@bMuy bien. A ver qué has traído...\n@c1@"
  fr: "@aLucille@bMaintenant, voyons voir ce que tu as ramené...\n@c1@"
  it: "@aBeatrice@bAllora, fammi un po' vede' huello che te tu ha' portato...\n@c1@"
  ja: "@a@bネネ「さあ　どれを　売り物に\n\t出しておくのかしら？\n@c1@"
"4":
  de: "@aTessa@bDann komm her und kümmer dich mal um deine arme Frau. Ich war sehr einsam in letzter Zeit...\n@c1@"
  en: "@aTessie@bThen come 'round here an' give yer poor wife a bit of attention, would ye?\nI've been awful lonely, so I have.\n@c1@"
  es: "@aTrakiba@bEntionces ven aquí y diedícale un poco de atiención a tu pobre mujercita.\nHe estiado muy solita, sí.\n@c1@"
  fr: "@aLucille@bAlors viens t'occuper un peu de ta petite femme, veux-tuⓡ\nJe me suis sentie très seule.\n@c1@"
  it: "@aBeatrice@bAllora da' un po' d'attenzioni alla tu' mogliettina, 'un so se mi spiego... Te tu m'ha' lasciata sola pe' troppo tempo...\n@c1@"
  ja: "@a@bネネ「じゃあ　そんな所に　いないで\n\tこっちへ　いらっしゃいよ。\n\tさびしいわ……。\n@c1@"
"5":
  de: "@aTessa@b%0%a04100? Oh, dafür kann ich mindestens %a00750 Goldmünze%H750%X%Yn%Z verlangen. Einverstanden?\n@c1@"
  en: "@aTessie@b%0%a04100? Aye, I'll be able to charge at least %a00750 gold coin%H750%X%Ys%Z for %M100%Xthem%Yit%Z. Are y'all right with that?\n@c1@"
  es: "@aTrakiba@b¿%0%a04100? Sí, podré cobrar al menos %a00750 moneda%H750%X%Ys%Z de oro por %M100%X%A100%Xellos%Z%B100%Xellas%Z%C100%Xellas%Z%Y%A100%Xél%Z%B100%Xella%Z%C100%Xella%Z%Z. ¿Estás de acuerdo?\n@c1@"
  fr: "@aLucille@b%0%a04100ⓡ Je pourrai en tirer au moins %a00750 pièce%I750%X%Ys%Z d'or.\nQu'est-ce que t'en pensesⓡ\n@c1@"
  it: "@aBeatrice@b%0%a04100? Bene, ci si rihaverà perlomeno %a00750 %H750%Xmoneta%Ymonete%Z d'oro. Che ne dici?\n@c1@"
  ja: "@a@bネネ「%a00100ね。\n\tこれなら　%a00750Ｇ以上で\n\t売ってみせるわ！　それでいい？\n@c1@"
"6":
  de: "@aTessa@bIch stell's dann zum Verkauf.\n@c1@"
  en: "@aTessie@bI'll put it up fer sale, then.\n@c1@"
  es: "@aTrakiba@b%M100%X%A100%XLos%Z%B100%XLas%Z%C100%XLas%Z%Y%A100%XLo%Z%B100%XLa%Z%C100%XLa%Z%Z pondrié a la venta, entonces.\n@c1@"
  fr: "@aLucille@bJe vais l'ajouter au stock alors.\n@c1@"
  it: "@aBeatrice@bAllora metto in vendita la roba che te tu ha' portato.\n@c1@"
  ja: "@a@bネネ「じゃあ　お店に　置いておくね。\n@c1@"
"7":
  de: "@aTessa@bHast du denn noch was zum Verkaufen?\n@c1@"
  en: "@aTessie@bHave y'anytin' else we can sell at all?\n@c1@"
  es: "@aTrakiba@b¿Tienes alguna otra cosa para viender?\n@c1@"
  fr: "@aLucille@bAs-tu autre chose à mettre en venteⓡ\n@c1@"
  it: "@aBeatrice@bHai altro che si pole vende'?\n@c1@"
  ja: "@a@bネネ「他に　なにか　売り物にする？\n@c1@"
"8":
  de: "@aTessa@bSo, du kannst dich also nicht davon trennen? Dann behalt %M100%Xsie%Ydas Ding%Z doch einfach.\n@c1@"
  en: "@aTessie@bSo ye don't want to part with %M100%Xthem%Yit%Z?\nYe'd better hang on to %M100%Xthem%Yit%Z yerself, then.\n@c1@"
  es: "@aTrakiba@b¿Dices que no quieres siepararte de %M100%X%A100%Xellos%Z%B100%Xellas%Z%C100%Xellas%Z%Y%A100%Xél%Z%B100%Xella%Z%C100%Xellos%Z%Z?\nPues entionces no %M100%X%A100%Xlos%Z%B100%Xlas%Z%C100%Xlas%Z%Y%A100%Xlo%Z%B100%Xla%Z%C100%Xla%Z%Z sueltes.\n@c1@"
  fr: "@aLucille@bAlors comme ça, tu ne veux pas t'en séparerⓡ\nDans ce cas, tu te débrouilles avecⓠ\n@c1@"
  it: "@aBeatrice@bUn voi disfartene? Allora ti honviene porta' hon te quello che 'un voi lascia' huì.\n@c1@"
  ja: "@a@bネネ「あら　売りたくないの。\n\tだったら　あなたが　持っていてね。\n@c1@"
"9":
  de: "@aTessa@bDas können wir nicht verkaufen. Du behältst %M100%Xsie%Ydas Ding%Z besser.\n@c1@"
  en: "@aTessie@bWe can't be sellin' %M100%Xthose%Ythat%Z %a00100. You hold on to %M100%Xthem%Yit%Z yerself.\n@c1@"
  es: "@aTrakiba@bNo piodemos vender %M100%X%A100%Xesos%Z%B100%Xesas%Z%C100%Xesas%Z%Y%A100%Xese%Z%B100%Xesa%Z%C100%Xesa%Z%Z %a00100. Quédate con %M100%X%A100%Xellos%Z%B100%Xellas%Z%C100%Xellas%Z%Y%A100%Xél%Z%B100%Xella%Z%C100%Xella%Z%Z.\n@c1@"
  fr: "@aLucille@bComment veux-tu que je vende %M100%Xces%Y%A100%X%G100%Xcet%Yce%Z%Z%B100%Xcette%Z%C100%X%Z%Z %a00100 si tu ne veux pas me %M100%Xles%Y%A100%Xle%Z%B100%Xla%Z%C100%X%Z%Z donner.\n@c1@"
  it: "@aBeatrice@bHuesta roba huì 'un si pole vende'. Tienila con te.\n@c1@"
  ja: "@a@bネネ「あら　%a00100は\n\t売ってしまうには　惜しいと思うわ。\n\tだから　あなたが　持っていてね。\n@c1@"
"10":
  de: "@aTessa@bTut mir leid, Liebling...\n@c1@"
  en: "@aTessie@bI'm sorry, love...\n@c1@"
  es: "@aTrakiba@bLo siento, cariñio...\n@c1@"
  fr: "@aLucille@bJe suis désolée, mon chéri...\n@c1@"
  it: "@aBeatrice@bMi dispiace, amore mio...\n@c1@"
  ja: "@a@bネネ「あなた　ごめんなさい……。\n@c1@"
"11":
  de: "@aTessa@bDa biste so weit gereist, um Sachen zum Verkaufen zu finden, und ich hab keinen Platz mehr, sie unterzubringen.\n@c1@"
  en: "@aTessie@bYe've gone to all that trouble findin' things to sell, an' I haven't freed up any space in the stores for it at all.\n@c1@"
  es: "@aTrakiba@bDespués de las molestias que ti has tomado para buscar cosas para viender, no he podido hacer sitio en los almacienes.\n@c1@"
  fr: "@aLucille@bTu t'es donné du mal pour trouver des marchandises à vendre et je n'ai pas fait de place pour les mettre dans le magasin.\n@c1@"
  it: "@aBeatrice@bTe tu ha' durato tanta fatiha pe' trova' cose da vende', e io 'unn ho fatto spazio per metterla 'nbottega!\n@c1@"
  ja: "@a@bネネ「せっかく　仕入れてきてくれたけど\n\tわたしが　いたらなくて\n\tお店は　もう　いっぱいなの！\n@c1@"
"12":
  de: "@aTessa@bNichts? Wenn du mir nichts zum Verkaufen bringst, kann auch kein Geld reinkommen!\n@c1@"
  en: "@aTessie@bNuttin'? If ye don't bring me anytin' to sell, I can't very well make a profit now, can I?\n@c1@"
  es: "@aTrakiba@b¿Niada? Si no mi traes niada para vendier, no tengo forma de obtiener ningún bieneficio, ¿no crees?\n@c1@"
  fr: "@aLucille@bRienⓡ Si tu me rapportes rien, je vois pas comment je peux gagner de l'argent, heinⓡ\n@c1@"
  it: "@aBeatrice@bNulla? Se te 'un mi porti nulla da vende', 'un si guadagna!\n@c1@"
  ja: "@a@bネネ「あら？　今日は　なにも\n\t持ってかえってこなかったみたいね。\n@c1@"
"13":
  de: "@aTessa@bGut, ich hab jetzt alles eingeräumt. Willste mal sehen, was wir momentan so verkaufen?\n@c1@"
  en: "@aTessie@bRight, well that's the restockin' boxed off, then. D'ye want to see all that we're sellin' at the moment?\n@c1@"
  es: "@aTrakiba@bMuy bien, ya he riepuesto las existiencias. ¿Quieres ver lo que tienemos para viender?\n@c1@"
  fr: "@aLucille@bBien, on a fini de remplir les stocks.\nTu veux jeter un œil sur ce qu'on a en magasin, en ce momentⓡ\n@c1@"
  it: "@aBeatrice@bBene, e con quello che hai portato te siamo a posto. Vuoi vede' tutto huello che ci s'ha da vende' ora?\n@c1@"
  ja: "@a@bネネ「仕入れは　おしまいね。\n\t今　お店にある　売り物を\n\t見てみたい？\n@c1@"
"14":
  de: "@aTessa@bÜberlass den Laden ruhig mir, Liebling. Ich arbeite so hart, wie ich kann. Such du nur schöne neue Sachen für den Verkauf.\n@c1@"
  en: "@aTessie@bLeave the shop to me, then, love.\nI'm workin' as hard as I can at it.\nGood luck findin' more stock.\n@c1@"
  es: "@aTrakiba@bDiéjame a mí la tienda, cariño.\nTriabajo tanto como puedo en ella.\nBuena suerte con la búsquieda de artículos.\n@c1@"
  fr: "@aLucille@bLaisse-moi m'occuper du magasin, mon chéri.\nJe vais travailler du mieux que je peux.\nBonne chance pour tes recherches.\n@c1@"
  it: "@aBeatrice@bM'occupo io della bottega, amore mio. Farò del mi' meglio. Te va' a cerca' altra roba da vende', huì ci penso io.\n@c1@"
  ja: "@a@bネネ「じゃあ　わたし　一生けんめい\n\t売ってみせるわ。\n\tあなたも　がんばってね。　ちゅっ。\n@c1@"
"15":
  de: "@aTessa@bUnser Lager ist völlig leer, Torneko! Such schnell was zum Verkaufen!\n@c1@"
  en: "@aTessie@bBe the hokey, we're out o' stock altogether!\nHurry up an' find us more things to sell, Torneko.\n@c1@"
  es: "@aTrakiba@b¡Maldición, nos hemos quiedado sin existiencias!\nDate prisa y busca algo que piodamos vender, Torneko.\n@c1@"
  fr: "@aLucille@bOh non, on n'a plus rien à vendreⓠ Dépêche-toi de trouver de nouvelles marchandises, Torneko.\n@c1@"
  it: "@aBeatrice@bMa 'un fa i'bbischero, Baldo. 'Un ci s'ha quasi più merce da vende'! Moviti, e va' a cerca' hualcosa che si pole mette' sugli scaffali!\n@c1@"
  ja: "@a@bネネ「あら？\n\tお店には　売り物が　なかったわ！\n\t早く　仕入れてきてねっ。\n@c1@"
"16":
  de: "@aTessa@bÜberlass den Laden ruhig mir, Liebling. Ich arbeite so hart, wie ich kann. Such du nur schöne neue Sachen für den Verkauf.\n@c1@"
  en: "@aTessie@bLeave the shop to me, then, love.\nI'm workin' as hard as I can at it.\nGood luck findin' more stock.\n@c1@"
  es: "@aTrakiba@bDiéjame a mí la tienda, cariño.\nTriabajo tanto como puedo en ella.\nBuena suerte con la búsquieda de artículos.\n@c1@"
  fr: "@aLucille@bLaisse-moi m'occuper du magasin, mon chéri.\nJe vais travailler du mieux que je peux.\nBonne chance pour tes recherches.\n@c1@"
  it: "@aBeatrice@bM'occupo io della bottega, amore mio. Farò del mi' meglio. Te va' a cerca' altra roba da vende', huì ci penso io.\n@c1@"
  ja: "@a@bネネ「じゃあ　わたし　一生けんめい\n\t売ってみせるわ。\n\tあなたも　がんばってね。　ちゅっ。\n@c1@"
"17":
  de: "@a@b*: Seid Ihr ein offizieller Hoflieferant?\n@c2@"
  en: "@a@b*: You're one of His Majesty's regular merchants, are you?\n@c2@"
  es: "@a@b*: Eres uno de los mercaderes habituales de Su Majestad, ¿no es cierto?\n@c2@"
  fr: "@a@b*ⓢ Êtes-vous l'un des marchands attitrés de Sa Majestéⓡ\n@c2@"
  it: "@a@b*: Sei uno dei commercianti da cui Sua Maestà si serve regolarmente? \n@c2@"
  ja: "@a@b＊「お城　ご用達の商人か？\n@c2@"
"18":
  de: "@a@b*: Dann dürft Ihr eintreten.\n@c2@"
  en: "@a@b*: Then you may enter through here.\n@c2@"
  es: "@a@b*: Entonces puedes entrar por aquí.\n@c2@"
  fr: "@a@b*ⓢ Dans ce cas, vous pouvez entrer.\n@c2@"
  it: "@a@b*: Allora puoi passare di qua.\n@c2@"
  ja: "@a@b＊「ならば　このトビラより\n\t中に　入るがよい。\n@c2@"
"19":
  de: "@a@b*: Aber Ihr kommt, um Eure Waren zu verkaufen, nicht?\n@c2@"
  en: "@a@b*: But you've come to sell your wares, I suppose?\n@c2@"
  es: "@a@b*: Pero imagino que habrás venido a vender tu mercancía.\n@c2@"
  fr: "@a@b*ⓢ Mais vous venez pour vendre vos marchandises, j'imagineⓡ\n@c2@"
  it: "@a@b*: Sei qui per vendere la tua merce, esatto?\n@c2@"
  ja: "@a@b＊「では　売りこみに　来たのだな。\n@c2@"
"20":
  de: "@a@b*: Tut mir leid, König Norbert lässt keine neuen Händler zu, außer in besonderen Fällen. Versucht es anderswo.\n@c2@"
  en: "@a@b*: I'm sorry, but King Norman doesn't accept new tradesmen other than in exceptional circumstances. You'll have to try elsewhere.\n@c2@"
  es: "@a@b*: Lo siento, pero el rey Norman no acepta nuevos mercaderes, solo en casos excepcionales. Tendrás que intentarlo en otra parte.\n@c2@"
  fr: "@a@b*ⓢ Désolé, mais, sauf cas exceptionnel, le roi Norbert ne reçoit plus de nouveaux marchands. Allez voir ailleurs.\n@c2@"
  it: "@a@b*: Spiacente, ma Re Norman riceve nuovi commercianti solo in circostanze eccezionali. Dovrai provare a piazzare la tua mercanzia altrove.\n@c2@"
  ja: "@a@b＊「しかし　よほどのことがない限り\n\t新しい商人は　使わぬ。\n\tあきらめることだな。\n@c2@"
"21":
  de: "@a@b*: Willkommen auf Burg Endor. Die Tore Endors stehen allen offen, jeder darf hier sein Glück versuchen.\n@c2@"
  en: "@a@b*: Welcome to Endor Castle. The gates of Endor are open to all people so that all people may prosper.\n@c2@"
  es: "@a@b*: %H860%X%A120%XBienvenido%Z%B120%XBienvenida%Z%Y%R000%XBienvenidas%YBienvenidos%Z%Z al Castillo de Endor. Las puertas de Endor están abiertas para todos, para que todos puedan prosperar.\n@c2@"
  fr: "@a@b*ⓢ Bienvenue au château de Chandor. Les portes de Chandor sont grandes ouvertes à tous ceux qui aspirent à la prospérité. \n@c2@"
  it: "@a@b*: %H860%XTi%YVi%Z do il benvenuto al castello di Endor. Le porte di Endor sono aperte a chiunque agisca per il bene della comunità.\n@c2@"
  ja: "@a@b＊「エンドールの城へ　ようこそ。\n\tわが国の城門は　民衆のために\n\t広く　開かれております。\n@c2@"
"22":
  de: "@a@b*: König Norbert ist oben.\n@c2@"
  en: "@a@b*: King Norman's throne room is at the top of the stairs.\n@c2@"
  es: "@a@b*: Arriba %H860%Xencontrarás%Yencontraréis%Z al rey Norman.\n@c2@"
  fr: "@a@b*ⓢ Vous trouverez le roi Norbert à l'étage.\n@c2@"
  it: "@a@b*: Re Norman si trova al piano superiore.\n@c2@"
  ja: "@a@b＊「王様は　この上におわします。\n@c2@"
"23":
  de: "@a@b*: Ich höre dauernd munkeln, dass es zwischen der Burg und der Stadt einen Geheimgang gäbe.\n@c2@"
  en: "@a@b*: Every now and then I hear murmurings about a secret passageway connecting the castle and the town.\n@c2@"
  es: "@a@b*: De vez en cuando, se oyen rumores de un pasadizo secreto que comunica el castillo y la ciudad.\n@c2@"
  fr: "@a@b*ⓢ De temps en temps, des gens parlent d'un passage secret qui relierait le château et la ville.\n@c2@"
  it: "@a@b*: Ogni tanto mi è capitato di sentir parlare di un passaggio segreto che collega il castello alla città.\n@c2@"
  ja: "@a@b＊「なんでも　このお城のどこかに\n\t城下町への　抜け道が\n\tかくされているそうだが……。\n@c2@"
"24":
  de: "@a@b*: Dabei arbeite ich hier seit Jahren, und mir ist nie etwas aufgefallen.\n@c2@"
  en: "@a@b*: But I've been working here for years.\nI've never come across anything like that.\n@c2@"
  es: "@a@b*: Pero llevo años trabajando aquí.\nY nunca me he encontrado con nada semejante.\n@c2@"
  fr: "@a@b*ⓢ Mais ça fait des années que je travaille ici et je n'ai jamais rien vu qui y ressemblerait.\n@c2@"
  it: "@a@b*: Ma lavoro qui da anni, e non ho mai visto nulla di simile.\n@c2@"
  ja: "@a@b＊「わたしは　長年　ここに\n\t仕えているが　そんな抜け道など\n\t見たこともないな。\n@c2@"
"25":
  de: "@a@b*: Eigentlich tratsche ich ja nicht, aber es heißt, dass Prinzessin Veronica einen heimlichen Geliebten hat!\n@c1@"
  en: "@a@b*: I don't like to gossip, but they say Princess Veronica's got a secret lover, you know!\n@c1@"
  es: "@a@b*: No me gusta cotillear pero se dice que la princesa Verónica tiene un amante secreto ¡qué fuerte!\n@c1@"
  fr: "@a@b*ⓢ Je n'aime pas les ragots, mais il paraît que la princesse Véronica a un amoureux secretⓠ\n@c1@"
  it: "@a@b*: Non mi piacciono i pettegolezzi, ma corre voce che la Principessa Veronica abbia un amante segreto!\n@c1@"
  ja: "@a@b＊「この国の姫君　モニカ姫には\n\tひそかに　想いをよせる殿方が\n\tいるらしいわよ。\n@c1@"
"26":
  de: "@a@b*: Ich habe keine Ahnung, wer das sein könnte, aber natürlich interessiert mich das auch nicht. Geht mich ja nichts an.\n@c1@"
  en: "@a@b*: I can't begin to imagine who it could be.\nOf course, I wouldn't want to pry.\nWell, it's not my place, is it?\n@c1@"
  es: "@a@b*: No me puedo imaginar que sea cierto.\nEvidentemente, no quiero parecer indiscreta.\nBueno, no es asunto mío, ¿verdad?\n@c1@"
  fr: "@a@b*ⓢ Je me demande qui ça peut bien être.\nEn même temps, je ne veux pas être indiscrète.\nJe dois rester à ma place, n'est-ce pasⓡ\n@c1@"
  it: "@a@b*: Non riesco a immaginare chi possa essere, e non mi va di fare inciuci. Non sono mica affari miei, no?\n@c1@"
  ja: "@a@b＊「いったい　どこの誰なのか……。\n\tあ～　もう　気になって\n\t仕事が　手につかないわ。\n@c1@"
"27":
  de: "@a@b*: Der König muss sich über viele Dinge Gedanken machen. Die Bewaffnung seiner Truppen hat da nicht unbedingt oberste Priorität.\n@c2@"
  en: "@a@b*: His Majesty the King has a lot to think about.\nHis troops' weapons probably aren't at the forefront of his mind.\n@c2@"
  es: "@a@b*: Su Majestad el Rey tiene muchos asuntos de los que preocuparse. Seguramente, las armas de sus tropas no sean su máxima preocupación.\n@c2@"
  fr: "@a@b*ⓢ Sa Majesté a beaucoup de soucis. Je ne pense pas que l'armement de ses troupes soit la première de ses préoccupations.\n@c2@"
  it: "@a@b*: Sua Maestà ha molti pensieri per la testa in questo momento. Probabilmente, l'equipaggiamento del suo esercito non è la sua prima preoccupazione.\n@c2@"
  ja: "@a@b＊「王さまも　いろいろと\n\t考えることが　多いので\n\t武器まで　気が回らんのじゃろう。\n@c2@"
"28":
  de: "@a@b*: Ihr werdet bezahlt, sobald Ihr alle Rüstungen und Waffen geliefert habt. Je eher Ihr liefert, desto schneller bekommt Ihr auch das Gold.\n@c2@"
  en: "@a@b*: You'll be paid once you've delivered all the armour and weapons. The faster you supply them, the sooner you'll get your gold.\n@c2@"
  es: "@a@b*: Se te pagará la entrega de todas las armas y armaduras. Cuanto más rápido las traigas, antes recibirás tu oro.\n@c2@"
  fr: "@a@b*ⓢ Vous serez payé une fois que vous aurez livré les armes et les armures. Plus vite vous livrerez, plus vite vous aurez votre or.\n@c2@"
  it: "@a@b*: %H860%XRiceverai il tuo compenso quando avrai%YRiceverete il vostro compenso quando avrete%Z portato tutte le armi e le armature. Più velocemente veranno consegnate, prima %H860%Xotterrai%Yotterrete%Z i soldi.\n@c2@"
  ja: "@a@b＊「武器　防具の代金は\n\tすべて　納め終わってからじゃ。\n\tがんばって　集めなされよ。\n@c2@"
"29":
  de: "@a@b*: Schau sich das einer an! Da habt Ihr ja ein schönes Sümmchen verdient, was?\n@c2@"
  en: "@a@b*: Look at you! You've earned yourself quite a handsome sum, haven't you?\n@c2@"
  es: "@a@b*: ¡Vaya, fíjate! Parece que has conseguido una buena suma, ¿eh?\n@c2@"
  fr: "@a@b*ⓢ Eh bienⓠ Ça vous fait un joli petit pactole, pas vraiⓡ\n@c2@"
  it: "@a@b*: Ehi, %H860%Xhai%Yavete%Z guadagnato una discreta sommetta, visto?\n@c2@"
  ja: "@a@b＊「ほっほっほっ。\n\tかなりの大金を　手に入れたのう。\n@c2@"
"30":
  de: "@a@b*: Es gehört natürlich Euch. Ihr könnt damit machen, was Ihr wollt. Aber ich geb Euch einen guten Rat: Denkt auch an die Zukunft.\n@c2@"
  en: "@a@b*: Well, it's yours, of course. You can spend it on whatever you like. But think of the future when you do. That's my advice.\n@c2@"
  es: "@a@b*: Bueno, por supuesto que es tuya, y puedes gastarla en lo que te apetezca. Pero, cuando lo hagas, piensa en el futuro. Es un consejo que te doy.\n@c2@"
  fr: "@a@b*ⓢ Cet argent est à vous. Vous pouvez le dépenser comme vous voulez, mais, si vous voulez un conseil, pensez à votre avenir.\n@c2@"
  it: "@a@b*: Certo che è %H860%Xtua%Yvostra%Z. %H860%XPuoi%YPotete%Z spenderla come %H860%Xti%Yvi%Z pare. %H860%XAl posto tuo%YAl posto vostro%Z metterei qualcosa da parte per il futuro.\n@c2@"
  ja: "@a@b＊「その金を　どう使おうと\n\tそなたの自由じゃが\n\t将来のために　使いなされよ。\n@c2@"
"31":
  de: "@a@b*: Ein Waffenhändler seid Ihr also? Ja, heutzutage gibt es schon großartige Waffen.\n@c2@"
  en: "@a@b*: Ah, so you're a weapons merchant, are you? Yes, there are a lot of powerful weapons on the market these days.\n@c2@"
  es: "@a@b*: ¡Ah!, entonces es vendedor de armas, ¿no? Cierto, actualmente existe una gran oferta de potentes armas en el mercado.\n@c2@"
  fr: "@a@b*ⓢ Comme ça, vous êtes marchand d'armesⓡ\nOn trouve beaucoup d'armes puissantes sur le marché, en ce moment.\n@c2@"
  it: "@a@b*: Ah, e così sei un mercante d'armi, dico bene? Sì, di questi tempi si trovano in giro molte armi potenti.\n@c2@"
  ja: "@a@b＊「ほほう　そなた　武器屋か？\n\t近ごろは　いろいろ　強い武器も\n\tあるそうだな。\n@c2@"
"32":
  de: "@a@b*: Leider sind meine Soldaten hier auf der Burg nur mit einfachen Kupferschwertern ausgerüstet. Das ist wirklich traurig.\n@c2@"
  en: "@a@b*: Meanwhile, my soldiers here in the castle are still being equipped with nothing but copper swords. It's a sorry state of affairs.\n@c2@"
  es: "@a@b*: Mientras tanto, aquí en el castillo mis soldados solo cuentan con espadas de cobre. Una situación un tanto desoladora.\n@c2@"
  fr: "@a@b*ⓢ Et pendant ce temps-là, les soldats du château n'ont que de simples épées de cuivre.\nC'est assez désolant, si vous voulez mon avis.\n@c2@"
  it: "@a@b*: Tuttavia, i soldati in servizio all'interno del castello sono equipaggiati con delle semplici spade di rame.\n㈡\n*: Non è che possano far molto, con quegli stuzzicadenti!\n@c2@"
  ja: "@a@b＊「しかし　この城では　兵士たちは\n\tいまだに　どうのつるぎを　使っている。\n\t情けないことだ……。\n@c2@"
"33":
  de: "@a@b*: Ihr seid sicher hier, um meinen Truppen Rüstungen und Waffen zu liefern, so wie König Norbert es Euch aufgetragen hat?\n@c2@"
  en: "@a@b*: You've come to give me some of the weapons and armour King Norman asked you to supply us with, have you?\n@c2@"
  es: "@a@b*: Has venido a suministrarme las armas y armaduras que te ha encargado el Rey Norman, ¿no es así?\n@c2@"
  fr: "@a@b*ⓢ Vous êtes là pour me remettre une partie des armes et armures que le roi Norbert vous a demandées, n'est-ce pasⓡ\n@c2@"
  it: "@a@b*: %H860%XSei qui per darmi le armi che Re Norman ti%YSiete qui per darmi le armi che Re Norman vi%Z ha chiesto per le mie truppe, esatto?\n@c2@"
  ja: "@a@b＊「王さまから　たのまれて\n\t兵士たちの　武器　防具を\n\t納めにきたのだな？\n@c2@"
"34":
  de: "@a@b*: Sehr gut! Ich nehme alle Stahlbreitschwerter und Eisenrüstungen, die Ihr habt.\n@c2@"
  en: "@a@b*: Right! I'll be taking any steel broadswords and iron armour you have off your hands, then.\n@c2@"
  es: "@a@b*: ¡Muy bien! Me quedaré todas las espadas de acero y armaduras de hierro que tengas.\n@c2@"
  fr: "@a@b*ⓢ Parfaitⓠ Je vous prends toutes les épées larges d'acier et les armures de fer que vous avez.\n@c2@"
  it: "@a@b*: Perfetto! Allora mi servono tutte le spade d'acciaio e le armature di ferro che %H860%Xpuoi%Ypotete%Z procurarmi.\n@c2@"
  ja: "@a@b＊「では　さっそく\n\tはがねのつるぎと　鉄のよろいを\n\t受け取ろう。\n@c2@"
"35":
  de: "@a@b*: %H791%XEin Stahlbreitschwert%Y%a00791 Stahlbreitschwerter%Z und %H792%Xeine Eisenrüstung%Y%a00792 Eisenrüstungen%Z. Danke.\n@c2@"
  en: "@a@b*: %H791%XA steel broadsword%Y%a00791 steel broadswords%Z and %H792%Xa suit%Y%a00792 suits%Z of iron armour. Thank you.\n@c2@"
  es: "@a@b*: %H791%XUna espada de acero%Y%a00791 espadas de acero%Z y %H792%Xuna armadura de hierro%Y%a00792 armaduras de hierro%Z. Gracias.\n@c2@"
  fr: "@a@b*ⓢ %I791%X%a00791 épée large%Y%a00791 épées larges%Z d'acier et %I792%X%a00792 armure%Y%a00792 armures%Z de fer. Merci.\n@c2@"
  it: "@a@b*: Uhm, %H791%Xuna spada d'acciaio%Y%a00791 spade d'acciaio%Z e %H792%Xun'armatura di ferro%Y%a00792 armature di ferro%Z. Grazie.\n@c2@"
  ja: "@a@b＊「はがねのつるぎが　%a00791本！\n\t鉄のよろいが　%a00792着！\n\tたしかに　受け取ったぞ。\n@c2@"
"36":
  de: "@a@b*: Ausgezeichnet. Hier ist Euer Geld, wie versprochen.\n@c2@"
  en: "@a@b*: Excellent. That's the lot.\nHere's your pay, as promised.\n@c2@"
  es: "@a@b*: Excelente. Eso es todo.\nAquí está el pago convenido.\n@c2@"
  fr: "@a@b*ⓢ Excellent, c'est ce que je voulais.\nVoici ce que je vous dois, comme promis. \n@c2@"
  it: "@a@b*: Eccellente. Quella è la merce, e questo è il compenso pattuito.\n@c2@"
  ja: "@a@b＊「よし！　これで　すべて　そろった。\n\t約束どおり　代金を支払おう。\n@c2@"
"37":
  de: "@a@bTorneko verdient 60.000 Goldmünzen!\n@c2@"
  en: "@a@bTorneko earns 60000 gold coins!\n@c2@"
  es: "@a@b¡Torneko gana 60.000 monedas de oro!\n@c2@"
  fr: "@a@bTorneko reçoit 60000 pièces d'orⓠ\n@c2@"
  it: "@a@bBaldo incassa 60000 monete d'oro!\n@c2@"
  ja: "@a@bトルネコは　６００００Ｇを\n手に入れた！\n@c2@"
"38":
  de: "@a@b*: Sehr gut. Ihr werdet es noch weit bringen, da hab ich keine Zweifel.\n@c2@"
  en: "@a@b*: Well done, merchant.\nYou'll go a long way, I've no doubt.\n@c2@"
  es: "@a@b*: Bien hecho, amigo.\nLlegarás lejos, no tengo la menor duda.\n@c2@"
  fr: "@a@b*ⓢ Bravo, mon ami.\nVous irez loin. J'en suis sûr.\n@c2@"
  it: "@a@b*: Perfetto, amico. Diventerai un grande commerciante, non ho dubbi.\n@c2@"
  ja: "@a@b＊「ご苦労であった！\n\tこれからも　ますます　商売に\n\tはげむようにな。\n@c2@"
"39":
  de: "@a@b*: Ihr müsst immer noch %H791%Xein Stahlbreitschwert%Y%a00791 Stahlbreitschwerter%Z und %H792%Xeine Eisenrüstung%Y%a00792 Eisenrüstungen%Z liefern.\n@c2@"
  en: "@a@b*: You still have %H791%Xone steel broadsword%Y%a00791 steel broadswords%Z and %H792%Xone suit%Y%a00792 suits%Z of iron armour left to deliver.\n@c2@"
  es: "@a@b*: Aún te quedan %H791%Xuna espada de acero%Y%a00791 espadas de acero%Z y %H792%Xuna armadura de hierro%Y%a00792 armaduras de hierro%Z por entregar.\n@c2@"
  fr: "@a@b*ⓢ Vous devez encore livrer %I791%X%a00791 épée large%Y%a00791 épées larges%Z d'acier et %I792%X%a00792 armure%Y%a00792 armures%Z de fer.\n@c2@"
  it: "@a@b*: %H860%XDevi%YDovete%Z ancora consegnare %H791%Xuna spada d'acciaio%Y%a00791 spade d'acciaio%Z e %H792%Xun'armatura di ferro%Y%a00792 armature di ferro%Z.\n@c2@"
  ja: "@a@b＊「注文したのは　あと\n\tはがねのつるぎが　%a00791本！\n\t鉄のよろいが　%a00792着！\n@c2@"
