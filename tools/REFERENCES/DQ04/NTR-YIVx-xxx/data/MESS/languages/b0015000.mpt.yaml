"0":
  de: "@a@b*: Dies ist das Königreich Endor. Die Burg liegt ein Stück südöstlich von hier.\n@c2@"
  en: "@a@b*: This is the kingdom of Endor. The castle is just a little way east of here.\n@c2@"
  es: "@a@b*: Este es el reino de Endor. El castillo está un poco más al este de aquí.\n@c2@"
  fr: "@a@b*ⓢ Vous êtes dans le royaume de Chandor. Le château se trouve un peu plus loin, à l'est.\n@c2@"
  it: "@a@b*: Questo è il regno di Endor. Il castello si trova a est, non lontano da qui.\n@c2@"
  ja: "@a@b＊「ここは　エンドールの国。\n\t東に行くと　お城があります。\n@c2@"
"1":
  de: "@a@b*: Es soll hier irgendwo ein Teleportal geben, das nach Maestral führt.\n@c2@"
  en: "@a@b*: Folk say there's a teleportal around here somewhere that leads to Maestral.\n@c2@"
  es: "@a@b*: Dicen que hay un portal de teletransporte por aquí que conduce a Mistral.\n@c2@"
  fr: "@a@b*ⓢ Les gens racontent qu'il y a quelque part dans le coin un téléportail menant au Mistral.\n@c2@"
  it: "@a@b*: Corre voce che da queste parti ci sia un portale che conduce a Maystrale.\n@c2@"
  ja: "@a@b＊「このあたりに\n\tサントハイムに通じる\n\t旅の扉があるそうですね。\n@c2@"
"2":
  de: "@a@b*: Zzzz...\n@c2@"
  en: "@a@b*: Zzzz...\n@c2@"
  es: "@a@b*: Zzzz...\n@c2@"
  fr: "@a@b*ⓢ Zzzz...\n@c2@"
  it: "@a@b*: Zzz... \n@c2@"
  ja: "@a@b＊「ぐうぐう……。\n@c2@"
"3":
  de: "@a@b*: Ich bin Ragnar Rauhbein, ein Soldat aus dem schönen Burland. Ich reise umher auf der Suche nach dem erkorenen Helden.\n@c3@"
  en: "@a@b*: I'm Ragnar McRyan, a soldier from bonnie Burland. I'm travellin' aboot lookin' for the chosen hero.\n@c3@"
  es: "@a@b*: Soy Ragnar McRyan, soldado de la hermosa Burlandia. Viajo en busca del héroe elegido.\n@c3@"
  fr: "@a@b*ⓢ Je suis Ragnar McRyan, un soldat de la belle ville de Bastione. Je voyage un peu partout à la recherche du héros élu.\n@c3@"
  it: "@a@b*: Mi chiamo Galiardo de' Guglielmi e sono un soldato di Burlandia. Sto viaggiando in cerca %A120%Xdell'eroe prescelto%Z%B120%Xdell'eroina prescelta%Z.\n@c3@"
  ja: "@a@b＊「わたしは\n\tバトランドの戦士　ライアン。\n\t勇者を探して　旅をしている。\n@c3@"
"4":
  de: "@aRagnar@bAch, aber ich will Euch nicht mit meinen Geschichten langweilen. Achtet einfach nicht auf mich, ja?\n@c3@"
  en: "@aRagnar@bOch, but there's no use blitherin' on tae youse aboot it. Dinnae mind me, will ye?\n@c3@"
  es: "@aRagnar@b¿Pero qué hago %H860%Xcontándole%Ycontándoles%Z todo esto? No me %H860%Xhaga%Yhagan%Z caso, por favor.\n@c3@"
  fr: "@aRagnar@bEnfin, inutile de vous ennuyer avec ça. Ne faites pas attention à moi, voulez-vousⓡ\n@c3@"
  it: "@aGaliardo@bChe sciocco che sono! Perché mai parlo con %H860%Xte%Yvoi%Z di certe cose? %H860%XFa' conto che non ti%YFate conto che non vi%Z abbia detto nulla, d'accordo?\n@c3@"
  ja: "@a@bライアン「と　こんな話をしても\n\tおぬしらには　分かるまいな……。\n\t失礼　つかまつった。\n@c3@"
"5":
  de: "@a@b*: Willkommen in der Stadt Endor.\n@c2@"
  en: "@a@b*: Welcome to the town of Endor.\n@c2@"
  es: "@a@b*: %H860%XTe%YOs%Z doy la bienvenida a la ciudad de Endor.\n@c2@"
  fr: "@a@b*ⓢ Bienvenue dans la ville de Chandor.\n@c2@"
  it: "@a@b*: %H860%XTi%YVi%Z do il benvenuto a Endor.\n@c2@"
  ja: "@a@b＊「エンドールの城下町に　ようこそ。\n@c2@"
"6":
  de: "@a@b*: Ah, Ihr wisst es vielleicht nicht, aber zurzeit findet in der Burg das Turnier von Endor statt.\n@c1@"
  en: "@a@b*: Ooh, maybe you don't know, but the Endor Tourney's going on at the castle at the moment.\n@c1@"
  es: "@a@b*: ¡Oh!, quizá no lo %H860%Xsepas%Ysepáis%Z, pero en el castillo está teniendo lugar el Torneo de Endor.\n@c1@"
  fr: "@a@b*ⓢ Oh, vous n'êtes peut-être pas au courant, mais le tournoi de Chandor se déroule au château en ce moment même.\n@c1@"
  it: "@a@b*: Oh, forse non lo %H860%Xsai%Ysapete%Z, ma in questo momento presso il castello si sta svolgendo il Torneo di Endor.\n@c1@"
  ja: "@a@b＊「ねえ　知ってる？\n\t今　お城で\n\t武術大会が　開かれてるのよ。\n@c1@"
"7":
  de: "@a@b*: Wachestehen ist nicht so einfach wie es aussieht, wisst Ihr. Da freu ich mich auf einen kühlen Schluck oder zwei heut Abend.\n@c2@"
  en: "@a@b*: Being on guard duty isn't as easy as it looks, you know. I'll certainly be enjoying a drink or two when evening rolls around.\n@c2@"
  es: "@a@b*: Estar de guardia no es tan fácil como parece. Cuando llegue la noche me tomaré un par de cervezas.\n@c2@"
  fr: "@a@b*ⓢ Être de garde n'est pas aussi facile qu'il y paraît, vous savez. J'irai sans doute boire un verre ou deux ce soir.\n@c2@"
  it: "@a@b*: Stare di guardia non è semplice come sembra. Stasera andrò a bere qualcosa per rilassarmi dalla fatica...\n@c2@"
  ja: "@a@b＊「かあ～　見回りも　楽じゃねえぜ。\n\t早く　酒場にでもいって\n\tいっぱい　やりたいなあ。\n@c2@"
"8":
  de: "@a@b*: Wohin ist dieser nichtsnutzige Faulpelz diesmal wieder verschwunden?! Also wirklich!\n@c2@"
  en: "@a@b*: I wonder where that useless layabout's got to this time. Honestly!\n@c2@"
  es: "@a@b*: Me pregunto dónde se habrá metido ese vago esta vez. ¡Hay que ver!\n@c2@"
  fr: "@a@b*ⓢ Je me demande où ce fainéant est encore allé, cette fois-ci. Franchementⓠ\n@c2@"
  it: "@a@b*: Chissà che sta combinando quello scansafatiche!\n@c2@"
  ja: "@a@b＊「うちの　ろくでなし\n\tどこへ　行ったのかしらね。\n\tまったく……。\n@c2@"
"9":
  de: "@a@b*: Seid Ihr wegen einer Audienz mit König Norbert hier?\n@c2@"
  en: "@a@b*: Have you come for an audience with King Norman?\n@c2@"
  es: "@a@b*: ¿%H860%XHas%YHabéis%Z venido por una audiencia con el rey Norman?\n@c2@"
  fr: "@a@b*ⓢ Êtes-vous là pour obtenir une audience auprès du roi Norbertⓡ\n@c2@"
  it: "@a@b*: %H860%XSei%YSiete%Z qui per un'udienza con Re Norman?\n@c2@"
  ja: "@a@b＊「王様に　会いに来たのか？\n@c2@"
"10":
  de: "@a@b*: Geht einfach weiter durch das Tor, und schon seid Ihr in der Burg Endor.\n@c2@"
  en: "@a@b*: Just go on through the gate and you'll find yourself at Endor Castle.\n@c2@"
  es: "@a@b*: %H860%XPasa%YPasad%Z por el portal y %H860%Xestarás%Yestaréis%Z en el Castillo de Endor.\n@c2@"
  fr: "@a@b*ⓢ Franchissez le portail et vous vous retrouverez au château de Chandor.\n@c2@"
  it: "@a@b*: %H860%XAttraversa%YAttraversate%Z il cancello e %H860%Xarriverai%Yarriverete%Z al Castello di Endor.\n@c2@"
  ja: "@a@b＊「ならば　門をくぐった先が\n\tエンドールのお城だ。\n@c2@"
"11":
  de: "@a@b*: Ah, Ihr seid sicher wegen des Turniers von Endor hier. Geht einfach weiter und dann durch eine der kleinen Türen links oder rechts.\n@c2@"
  en: "@a@b*: Ah, you must've come for the Endor Tourney. Just go on through and take one of the little doors to the left or right.\n@c2@"
  es: "@a@b*: ¡Ah!, %H860%Xdebes%Ydebéis%Z de haber venido por el Torneo de Endor. Adelante, %H860%Xelige%Yelegid%Z una de las puertas, a la izquierda o a la derecha.\n@c2@"
  fr: "@a@b*ⓢ Ah, vous devez venir pour le tournoi de Chandor. Passez et prenez l'une des petites portes sur la droite ou sur la gauche.\n@c2@"
  it: "@a@b*: Ah, %H860%Xsei%Ysiete%Z qui per il Torneo di Endor, vero? %H860%XVai%YAndate%Z avanti e %H860%Xprendi%Yprendete%Z una delle porte a sinistra o a destra.\n@c2@"
  ja: "@a@b＊「では　武術大会に来たのだな？\n\tならば　門をくぐり\n\t左右の小さな扉から入るがよい。\n@c2@"
"12":
  de: "@a@b*: Die Leute kommen von weither, um das Turnier von Endor zu sehen.\n@c2@"
  en: "@a@b*: People are flocking here from far and wide to watch the Endor Tourney.\n@c2@"
  es: "@a@b*: Vienen gentes de todos los rincones para ver el Torneo de Endor.\n@c2@"
  fr: "@a@b*ⓢ Les gens affluent de très loin pour assister au tournoi de Chandor.\n@c2@"
  it: "@a@b*: Il Torneo di Endor attira spettatori da ogni parte del mondo.\n@c2@"
  ja: "@a@b＊「武術大会を　見るため\n\t多くの人々が　ここ　エンドールに\n\t集まってきているのだ。\n@c2@"
"13":
  de: "@a@b*: Seht Euch nur diese Wolken an! Warum ziehen die bloß so schnell nach Westen?\n@c1@"
  en: "@a@b*: Just look at those clouds! I wonder what's making them blow west at such a pace.\n@c1@"
  es: "@a@b*: ¡%H860%XMira%YMirad%Z qué nubes! Me pregunto por qué se mueven hacia el oeste así de rápido.\n@c1@"
  fr: "@a@b*ⓢ Regardez un peu ces nuagesⓠ Je me demande ce qui les pousse vers l'ouest à une telle vitesse.\n@c1@"
  it: "@a@b*: %H860%XDai%YDate%Z un'occhiata a quelle nuvole... Stanno spostandosi verso ovest a una velocità impressionante!\n@c1@"
  ja: "@a@b＊「ほら　あんなに早く\n\t雲が　西に流れてゆくわ。\n\tどうしたのかしら？\n@c1@"
"14":
  de: "@a@b%0%a00120 liest das Schild.\n@c0@"
  en: "@a@b%0%a00120 reads the sign.\n@c0@"
  es: "@a@b%0%a00120 lee el cartel.\n@c0@"
  fr: "@a@b%0%a00120 lit l'écriteau.\n@c0@"
  it: "@a@b%0%a00120 legge il cartello.\n@c0@"
  ja: "@a@b%a00120は　立て札を　読んだ。\n@c0@"
"15":
  de: "@a@bⓞDas Turnier von Endor hat begonnen!ⓟ\n@c0@"
  en: "@a@bⓗEndor Tourney Now On!ⓘ\n@c0@"
  es: "@a@b''¡El Torneo de Endor está en marcha!''\n@c0@"
  fr: "@a@bⓥLe tournoi de Chandor est ouvertⓠⓦ\n@c0@"
  it: "@a@bⓕIl Torneo di Endor è in corso!ⓖ\n@c0@"
  ja: "@a@b武術大会　開催中！\n@c0@"
"16":
  de: "@a@b*: Meine Familie ist sehr wohlhabend. Ja, das geht schon seit Generationen so.\n@c1@"
  en: "@a@b*: My family's ever so well-to-do, I'll have you know. Yes, we've been in the money for generations now.\n@c1@"
  es: "@a@b*: %H860%XTe%YOs%Z informo de que mi familia ha tenido siempre una posición acomodada. Sí, ya llevamos generaciones siendo ricos.\n@c1@"
  fr: "@a@b*ⓢ Ma famille est vraiment très riche, vous savez. Nous faisons partie des nantis depuis plusieurs générations, maintenant.\n@c1@"
  it: "@a@b*: %H860%XSai%YSapete%Z, io pvovengo da una famiglia molto vicca. Eh, sì... Siamo vicchi da genevazioni.\n@c1@"
  ja: "@a@b＊「うちは　先祖代々\n\tずーっと　お金持ちですの。\n\tおほほほほ。\n@c1@"
"17":
  de: "@a@b*: Die junge Dame des Hauses ist total merkwürdig. Die tut anscheinend nie was anderes, als in den Himmel zu starren.\n@c1@"
  en: "@a@b*: The young lady of the house spends all her time starin' at the sky. I just don't know what it is she finds so interestin' about it.\n@c1@"
  es: "@a@b*: La joven señora de la casa es una persona extraña. Parece que no hace más que mirar al cielo el día entero.\n@c1@"
  fr: "@a@b*ⓢ La jeune dame de la maison est vraiment très bizarre. On dirait qu'elle passe son temps à regarder le ciel.\n@c1@"
  it: "@a@b*: La ragazza che sta in questa casa è sempre così strana... Non fa altro che guardare il cielo...!\n@c1@"
  ja: "@a@b＊「この家の　おじょうさんは\n\tいっつも　空ばっか見て\n\tおかしな人だなや～。\n@c1@"
"18":
  de: "@a@bDa steht eine kostbar aussehende Rüstung.\n@c0@"
  en: "@a@bSome expensive-looking armour is on display.\n@c0@"
  es: "@a@bSe expone una armadura con aspecto de ser muy cara.\n@c0@"
  fr: "@a@bUne armure, vraisemblablement de grand prix, est exposée.\n@c0@"
  it: "@a@bC'è un'armatura molto preziosa in esposizione.\n@c0@"
  ja: "@a@b高価そうなヨロイが　かざられている。\n@c0@"
"19":
  de: "@a@b*: Seid Ihr auch wegen des Turniers von Endor hier? Ich mache mir schon seit einer Weile darüber Gedanken.\n@c2@"
  en: "@a@b*: Are you here for the Endor Tourney as well? I've been puzzling over it for a while now.\n@c2@"
  es: "@a@b*: ¿También %H860%Xestás%Yestáis%Z aquí por el Torneo de Endor? Ese torneo es un misterio para mí.\n@c2@"
  fr: "@a@b*ⓢ Vous aussi, vous êtes là pour le tournoi de Chandorⓡ Je m'interroge là-dessus depuis un certain temps, maintenant.\n@c2@"
  it: "@a@b*: Anche %H860%Xtu sei%Yvoi siete%Z qui per il Torneo di Endor? È da un po' che penso a una cosa...\n@c2@"
  ja: "@a@b＊「やや　あなた方も　武術大会に？\n\tしかし　思うのですが……。\n@c2@"
"20":
  de: "@a@b*: Es muss doch einen Grund haben, warum König Norbert hier unbedingt so viele starke Kämpfer versammeln will.\n@c2@"
  en: "@a@b*: There must be some reason why King Norman has gone to such lengths to assemble so many strong fighters.\n@c2@"
  es: "@a@b*: Tiene que haber un motivo para que el rey Norman se haya tomado tantas molestias para reunir a tantos guerreros.\n@c2@"
  fr: "@a@b*ⓢ Il doit y avoir une raison pour que le roi Norbert se soit démené à ce point pour rassembler tant de puissants guerriers.\n@c2@"
  it: "@a@b*: Come mai Re Norman ha voluto riunire qui tanti guerrieri così forti?\n@c2@"
  ja: "@a@b＊「王様が　こうまでして\n\t強い者を　集めるのには\n\t何か　わけがありそうですな。\n@c2@"
"21":
  de: "@a@b*: Wie bitte? Der Laden unten ist geschlossen?\n@c2@"
  en: "@a@b*: Sorry? Is the shop downstairs closed, you say?\n@c2@"
  es: "@a@b*: ¿Cómo? ¿Que la tienda de abajo está cerrada?\n@c2@"
  fr: "@a@b*ⓢ Commentⓡ Vous voulez savoir si le magasin au rez-de-chaussée est ferméⓡ\n@c2@"
  it: "@a@b*: Come %H860%Xdici%Ydite%Z? Il negozio qui sotto è chiuso?\n@c2@"
  ja: "@a@b＊「え？　下の店は　休みかじゃと？\n@c2@"
"22":
  de: "@a@b*: Ja, nun, ich werde ja nicht jünger. Wenn's nach mir ginge, würde ich verkaufen und irgendwo hinziehen, wo es schön ist.\n@c2@"
  en: "@a@b*: Yes, well, I'm not getting any younger. In an ideal world, I'd sell up and use the money to retire somewhere nice.\n@c2@"
  es: "@a@b*: Bueno, está claro que me hago viejo. En un mundo ideal, lo vendería todo y me retiraría a algún lugar bonito.\n@c2@"
  fr: "@a@b*ⓢ Eh bien oui, je me fais vieux. Dans un monde idéal, je le vendrais et j'utiliserais l'argent pour prendre ma retraite dans un lieu agréable.\n@c2@"
  it: "@a@b*: Beh, visto che ormai ho una certa età, sto pensando di vendere tutto e andarmene a vivere di rendita in qualche bel posto... \n@c2@"
  ja: "@a@b＊「ああ　わしも　もう年でな。\n\tこの店を売って　そのお金で\n\t隠居でも　したいんじゃが……。\n@c2@"
"23":
  de: "@a@b*: Aber ich werde wohl kaum jemanden finden, der hier ein Geschäft übernehmen will.\n@c2@"
  en: "@a@b*: But I doubt I'll find anyone who wants to take over the business around these parts.\n@c2@"
  es: "@a@b*: Pero dudo que encontrase a alguien para hacerse cargo del negocio aquí.\n@c2@"
  fr: "@a@b*ⓢ Mais je crois que je ne trouverai personne pour reprendre l'affaire, par ici.\n@c2@"
  it: "@a@b*: Ma dubito che da queste parti troverò mai qualcuno a cui cedere la mia attività!\n@c2@"
  ja: "@a@b＊「ここで　商売をしたいという人が\n\tどこかに　おらんかのう。\n@c2@"
"24":
  de: "@a@b*: Wie bitte? Ihr wollt meinen Laden kaufen? Aber Ihr seid doch keine Kaufleute. Ihr wüsstet doch gar nicht, wie man so was anfängt! Ha ha ha.\n@c2@"
  en: "@a@b*: Sorry? You want to buy my shop, you say? But you're not traders. You wouldn't have the first idea! Ha ha ha.\n@c2@"
  es: "@a@b*: ¿Cómo? ¿%H860%XDices%YDecís%Z que %H860%Xquieres%Yqueréis%Z comprar mi tienda? Pero no %H860%Xeres comerciante%Ysois comerciantes%Z. ¡No %H860%Xsabrías%Ysabríais%Z por dónde empezar! ¡Ja, ja, ja!\n@c2@"
  fr: "@a@b*ⓢ Pardonⓡ Vous voulez acheter ma boutiqueⓡ Mais vous n'êtes pas dans le commerce, vous ne sauriez pas comment faireⓠ Ha ha ha.\n@c2@"
  it: "@a@b*: Come? %H860%XVuoi%YVolete%Z comprare il mio negozio? Ma %H860%Xlo sai%Ylo sapete%Z come si porta avanti un'attività del genere? Non %H860%Xhai%Yavete%Z la minima idea di come si gestiscano gli affari!\n@c2@"
  ja: "@a@b＊「なに？　店を買いたい？\n\t商人でもない　あんたらには　\n\tムリじゃ。　やめときなされ。\n@c2@"
"25":
  de: "@a@b*: Mist! Schon wieder verloren! Was sag ich denn jetzt meinem Muttchen?\n@c3@"
  en: "@a@b*: Huh! I only went an' lost again. What am I gonna tell me old ma?\n@c3@"
  es: "@a@b*: ¡Bua! Pues he vuelto a perder. ¿Qué le voy a contar a mi madre?\n@c3@"
  fr: "@a@b*ⓢ Pfffⓠ J'me suis encore perdu. Qu'est-ce que j'vais dire à ma mèreⓡ\n@c3@"
  it: "@a@b*: Diamine! Ho perso di nuovo... Ora che vado a raccontare a mia madre?\n@c3@"
  ja: "@a@b＊「うい～。　また　負けちまった。\n\tかあちゃんに　なんて言おう……。\n@c3@"
"26":
  de: "@a@b*: Guten Tag. Fühlt Euch wie zu Hause und trinkt ein Gläschen oder drei.\n@c1@"
  en: "@a@b*: Hello there. Make yourself comfortable and have a nice drink or three.\n@c1@"
  es: "@a@b*: Hola. %H860%XSiéntate y toma%YSentaos y tomad%Z una cerveza, o dos.\n@c1@"
  fr: "@a@b*ⓢ Bonjour. Installez-vous confortablement et prenez un verre, ou trois.\n@c1@"
  it: "@a@b*: Salve! %H860%XAccomodati%YAccomodatevi%Z e %H860%Xprendi%Yprendete%Z qualcosa da bere!\n@c1@"
  ja: "@a@b＊「いらっしゃい。\n\tゆっくり　飲んでいってね。\n@c1@"
"27":
  de: "@a@b*: Wart Ihr schon unten im Kasino?\n@c2@"
  en: "@a@b*: Have you been to the casino downstairs yet?\n@c2@"
  es: "@a@b*: ¿%H860%XHas%YHabéis%Z estado ya en el casino de abajo?\n@c2@"
  fr: "@a@b*ⓢ Avez-vous déjà fait un tour au casino, en basⓡ\n@c2@"
  it: "@a@b*: %H860%XHai%YAvete%Z già visitato il casinò qui sotto?\n@c2@"
  ja: "@a@b＊「地下にある　カジノには\n\t行きましたか？\n@c2@"
"28":
  de: "@a@b*: Ich hab heute schon wieder ein schönes Sümmchen gewonnen. Nicht schlecht, was?\n@c2@"
  en: "@a@b*: I made a pretty packet down there again today, so I did. Woo hoo!\n@c2@"
  es: "@a@b*: Hoy he ganado un fortunón allí otra vez, sí señor. ¡Yuju!\n@c2@"
  fr: "@a@b*ⓢ Je m'y suis fait un joli paquet, aujourd'hui.\nWou-houⓠ\n@c2@"
  it: "@a@b*: Anche oggi ho vinto un po' di soldi! Già, proprio così! Ah! Ah! Ah!\n@c2@"
  ja: "@a@b＊「いや～　今日は\n\tもうけちゃいましたよ。\n\tわっはっはっ。\n@c2@"
"29":
  de: "@a@b*: Ich bin von weither angereist, um die starken Krieger zu sehen, wie sie ihre Kräfte miteinander messen.\n@c2@"
  en: "@a@b*: I travelled a great distance to watch the mighty warriors pit their strengths against one another.\n@c2@"
  es: "@a@b*: He viajado desde muy lejos para ver a los poderosos guerreros enfrentarse en la arena.\n@c2@"
  fr: "@a@b*ⓢ J'ai parcouru un long chemin pour venir voir les puissants guerriers s'affronter et rivaliser de force.\n@c2@"
  it: "@a@b*: Ho fatto molta strada per vedere questi potenti guerrieri combattere tra loro!\n@c2@"
  ja: "@a@b＊「戦士たちの戦いを　見るため\n\tはるばる　やってきました。\n@c2@"
"30":
  de: "@a@b*: Wollt Ihr mein Lied für den Sieg hören?\n@c2@"
