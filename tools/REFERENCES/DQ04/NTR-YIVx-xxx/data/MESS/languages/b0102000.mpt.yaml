  fr: "@a@b*ⓢ Pfiouⓠ C'est sacrément fatiguant de monter la garde dans un château.\n@c2@"
  it: "@a@b*: Diamine! Certo che montare di guardia al castello è proprio un lavoraccio!\n@c2@"
  ja: "@a@b＊「ふぅー　やれやれ。\n\tお城の見回りも　楽じゃないな。\n@c2@"
"50":
  de: "@a@b*: König Burkhard hat sich bereits zur Nacht zurückgezogen.\n@c2@"
  en: "@a@b*: King Burnard's already retired for the evening.\n@c2@"
