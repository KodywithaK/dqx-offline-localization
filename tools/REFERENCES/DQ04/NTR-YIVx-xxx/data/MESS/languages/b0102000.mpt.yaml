  es: "@a@b*: Espero que no se avecine nada extraño.\n@c2@"
  fr: "@a@b*ⓢ J'espère juste qu'il ne se prépare rien de bizarre.\n@c2@"
  it: "@a@b*: Spero che non stia per succedere nulla di strano!\n@c2@"
  ja: "@a@b＊「何事もなければ　よいのだが……。\n@c2@"
"49":
  de: "@a@b*: Mann... So eine Burgwache macht ganz schön müde.\n@c2@"
  en: "@a@b*: Losh! It's a tirin' auld business standin' guard of a castle.\n@c2@"
