"0":
  de: "@a@b*: Dies ist die schöne Burg Burland.\n@c2@"
  en: "@a@b*: This is bonnie Burland Castle.\n@c2@"
  es: "@a@b*: Este es el soberbio Castillo de Burlandia.\n@c2@"
  fr: "@a@b*ⓢ Ceci est le beau château de Bastione.\n@c2@"
  it: "@a@b*: Questo è il nostro amato castello di Burlandia.\n@c2@"
  ja: "@a@b＊「ここは　バトランドのお城。\n@c2@"
"1":
  de: "@a@b*: Zwielichtige Gestalten kommen mir hier nicht rein.\n@c2@"
  en: "@a@b*: I willnae allow any suspicious-lookin' folk tae set one foot inside.\n@c2@"
  es: "@a@b*: No permitiré que ningún individuo sospechoso ponga un pie en él.\n@c2@"
  fr: "@a@b*ⓢ Je ne laisserai aucune personne suspecte mettre un seul pied à l'intérieur.\n@c2@"
  it: "@a@b*: Non lascerò entrare nessun tipo sospetto.\n@c2@"
  ja: "@a@b＊「あやしい者は　一歩たりとも\n\t通しはせぬ！\n@c2@"
"2":
  de: "@a@b*: König Burkhard ist oben.\n@c2@"
  en: "@a@b*: King Burnard is just upstairs.\n@c2@"
  es: "@a@b*: El rey Recaredo está arriba.\n@c2@"
  fr: "@a@b*ⓢ Le roi Bastien est à l'étage.\n@c2@"
  it: "@a@b*: Re Basilio si trova al piano di sopra.\n@c2@"
  ja: "@a@b＊「王さまは　この上におわします。\n@c2@"
"3":
  de: "@a@b*: Es ist schön zu sehen, dass es dir gut geht, Ragnar.\n@c2@"
  en: "@a@b*: It's good tae see ye lookin' so well there, Ragnar.\n@c2@"
  es: "@a@b*: Me alegro mucho de verle tan ufano, Ragnar.\n@c2@"
  fr: "@a@b*ⓢ Ça fait plaisir de vous voir en pleine forme, Ragnar.\n@c2@"
  it: "@a@b*: Sono felice di vedere che stai bene, Galiardo.\n@c2@"
  ja: "@a@b＊「おお！　ライアンどの\n\tお元気そうで　なによりです。\n@c2@"
"4":
  de: "@a@b*: Wir waren alle ein wenig besorgt um dich, auch Seine Majestät. Und jetzt geh schon zu ihm.\n@c2@"
  en: "@a@b*: We've all been a wee bit concerned for ye, His Majesty included. Gae on through wi' ye.\n@c2@"
  es: "@a@b*: Todos estábamos algo inquietos por usted, incluso Su Majestad. Adelante, haga el favor de pasar.\n@c2@"
  fr: "@a@b*ⓢ Tout le monde s'est fait du souci pour vous. Même Sa Majestéⓠ Allez-y, passezⓠ\n@c2@"
  it: "@a@b*: Siamo stati tutti un po' preoccupati per te, il Re in primis. %H860%XPassa%YPassate%Z pure.\n@c2@"
  ja: "@a@b＊「王さまも　ライアンどののことを\n\t気にしておられましたぞ。\n\tどうぞ　お目通りなさい。\n@c2@"
"5":
  de: "@a@b*: König Burkhard empfängt jeden. Aber immer schön Respekt zeigen, wenn's recht ist.\n@c2@"
  en: "@a@b*: King Burnard is always willin' tae meet wi' folk. Just be sure ye dinnae show any disrespect, eh?\n@c2@"
  es: "@a@b*: El rey Recaredo está siempre dispuesto a recibir a cualquier persona. Pero no %H860%Xolvide%Yolviden%Z que le %H860%Xdeberá%Ydeberán%Z mostrar el debido respeto, ¿de acuerdo?\n@c2@"
  fr: "@a@b*ⓢ Le roi Bastien est toujours heureux de rencontrer des gens.\nMais vous ne préparez pas un mauvais coup, heinⓡ\n@c2@"
  it: "@a@b*: Re Basilio è sempre disposto a ricevere gente in udienza. %H860%XRicorda solo di comportarti%YRicordate solo di comportarvi%Z secondo il protocollo di corte.\n@c2@"
  ja: "@a@b＊「わが王は　だれとでも\n\tお会いになりますが\n\tくれぐれも　ご無礼のないように。\n@c2@"
"6":
  de: "@a@b*: Ein Drachengott in Zenithia... Die ultimative Stufe der Evolution...\n@c2@"
  en: "@a@b*: A Dragon God in Zenithia...\nThe ultimate state of evolution...\n@c2@"
  es: "@a@b*: Un Dios Dragón en Zenithia...\nEl estadio definitivo de la evolución...\n@c2@"
  fr: "@a@b*ⓢ Un Dieu-dragon à Zénithia...\nLe stade ultime de l'Évolution...\n@c2@"
  it: "@a@b*: Un Drago Divino a Zenithia... \nLo stato finale dell'evoluzione.\n@c2@"
  ja: "@a@b＊「天空のお城に\n\t竜の神さまが　住んでいるとか……\n\t究極の進化がどうだとか……。\n@c2@"
"7":
  de: "@a@b*: Das ist doch nicht zum Aushalten. Wovon spricht der Alte überhaupt?!\n@c2@"
  en: "@a@b*: Havers! I dinnae ken whit that auld galoot's bletherin' on aboot half the time.\n@c2@"
  es: "@a@b*: ¡Pamplinas! No me creo ni la mitad de las cosas que ese viejo lechuguino parlotea.\n@c2@"
  fr: "@a@b*ⓢ Pfffⓠ Je ne comprends pas la moitié de ce que ce vieux fou raconte.\n@c2@"
  it: "@a@b*: Diamine! Non capisco la metà di ciò che dice quel tipo!\n@c2@"
  ja: "@a@b＊「まったく　あの老人のたわ言には\n\t困ったものだ。\n@c2@"
"8":
  de: "@a@b*: Ha! Jetzt hab ich's!\n@c2@"
  en: "@a@b*: Jings! Noo I get it!\n@c2@"
  es: "@a@b*: ¡Demonios! ¡Ahora lo comprendo!\n@c2@"
  fr: "@a@b*ⓢ Ça y estⓠ J'ai compris...\n@c2@"
  it: "@a@b*: Accipicchia! Ora ho capito!\n@c2@"
  ja: "@a@b＊「ふむ！　ついに　わかったぞ！\n@c2@"
"9":
  de: "@a@b*: Der Herr der Unterwelt ist ein Monster, das irgendwie die ultimative Stufe der Evolution erreicht hat.\n@c2@"
  en: "@a@b*: The Lord o' the Underworld is a monster who somehoo achieved the ultimate state of evolution.\n@c2@"
  es: "@a@b*: El Señor del Inframundo es un monstruo que, de algún modo, ha alcanzado el estadio definitivo de la evolución.\n@c2@"
  fr: "@a@b*ⓢ Le Seigneur des Enfers est un monstre qui avait atteint le stade ultime de l'Évolution.\n@c2@"
  it: "@a@b*: Il Signore degli Inferi è un mostro che, chissà in quale modo, è riuscito a raggiungere lo stadio evolutivo finale.\n@c2@"
  ja: "@a@b＊「地獄の帝王とは　どうやら\n\t究極の進化をとげた　怪物らしい！\n@c2@"
"10":
  de: "@a@b*: Doch dem Drachengott in Zenithia gefiel nicht, wie stark er war, und er sperrte ihn weg.\n@c2@"
  en: "@a@b*: But the Zenithian Dragon God didnae like hoo strong he was, an' he went an' sealed him away.\n@c2@"
  es: "@a@b*: Pero el Dios Dragón de Zenithia no estaba satisfecho con su poder, de modo que decidió encerrarlo.\n@c2@"
  fr: "@a@b*ⓢ Mais le Dieu-dragon de Zénithia n'avait pas vu cela d'un bon œil et l'avait emprisonné à tout jamais.\n@c2@"
  it: "@a@b*: Ma il Drago Divino zenithiano era preoccupato della potenza di quell'essere, e lo imprigionò.\n@c2@"
  ja: "@a@b＊「しかし　天空の竜の神さまが\n\tそのあまりのすごさに　おどろき\n\t地底に封じこめた…とある！\n@c2@"
"11":
  de: "@a@b*: Jetzt erwacht der Herr der Unterwelt wieder und macht allen möglichen Ärger.\n@c2@"
  en: "@a@b*: Noo this Lord o' the Underworld is startin' tae reawaken an' he's causin' all sorts o' stramash.\n@c2@"
  es: "@a@b*: Ahora este Señor del Inframundo está despertando de nuevo y provocando todo tipo de conflictos.\n@c2@"
  fr: "@a@b*ⓢ Maintenant, le Seigneur des Enfers commence à se réveiller et il provoque de sacrés dégâts partout.\n@c2@"
  it: "@a@b*: Adesso il Signore degli Inferi sta dando segni di risveglio, provocando disastri di ogni genere in tutto il mondo.\n@c2@"
  ja: "@a@b＊「その地獄の帝王が\n\tなぜか　復活するそうじゃ。\n@c2@"
"12":
  de: "@a@b*: Der Drachengott muss darüber informiert werden, bevor es zu spät ist!\n@c2@"
  en: "@a@b*: The Dragon God needs tae be told aboot this afore it's too late!\n@c2@"
  es: "@a@b*: ¡Es necesario informar de todo esto al Dios Dragón antes de que sea demasiado tarde!\n@c2@"
  fr: "@a@b*ⓢ Il faut avertir le Dieu-dragon avant qu'il ne soit trop tardⓠ\n@c2@"
  it: "@a@b*: Il Drago Divino dev'essere immediatamente informato di ciò che sta accadendo, altrimenti sarà la catastrofe.\n@c2@"
  ja: "@a@b＊「そのことを　竜の神さまに\n\t早く　知らせなければっ！\n@c2@"
"13":
  de: "@a@b*: Habt Ihr gehört, was der alte Mann nebenan gesagt hat?\n@c2@"
  en: "@a@b*: Hae ye had a listen tae whit the auld man in the room next door's got tae say?\n@c2@"
  es: "@a@b*: ¿%H860%XHa%YHan%Z oído lo que cuenta el anciano de la habitación de al lado?\n@c2@"
  fr: "@a@b*ⓢ Vous avez entendu ce que le petit vieux d'à côté raconteⓡ\n@c2@"
  it: "@a@b*: Perché non %H860%Xsenti%Ysentite%Z cos'ha da dire l'anziano che si trova nella stanza accanto?\n@c2@"
  ja: "@a@b＊「となりの部屋にいる老人の話を\n\t聞きましたか？\n@c2@"
"14":
  de: "@a@b*: Allerdings frage ich mich, wie man denn zu diesem Drachengott von Zenithia hinkommen soll.\n@c2@"
  en: "@a@b*: Whit I dinnae understand is hoo anyone's supposed tae meet this Zenithian Dragon God.\n@c2@"
  es: "@a@b*: Lo que ignoro por completo es cómo puede uno encontrarse con el Dios Dragón de Zenithia.\n@c2@"
  fr: "@a@b*ⓢ Ce qui m'échappe, c'est comment on peut faire pour aller voir le Dieu-dragon.\n@c2@"
  it: "@a@b*: Ciò che proprio non riesco a capire è come sia possibile per un essere umano incontrare il Drago Divino di Zenithia.\n@c2@"
  ja: "@a@b＊「でも　いったい　どうやって\n\t天空にいる竜の神さまに\n\t会えばいいのでしょうか……。\n@c2@"
"15":
  de: "@a@b*: Und außerdem... Wenn er doch ein Gott ist, weiß er sowieso alles, und keiner muss ihm Bescheid sagen.\n@c2@"
  en: "@a@b*: Besides, if he's a god then surely he already kens everythin' an' dinnae need anyone tae go an' tell him.\n@c2@"
  es: "@a@b*: Además, tratándose de un dios, sin duda lo sabe todo y no necesita que nadie vaya a contarle nada.\n@c2@"
  fr: "@a@b*ⓢ En plus, si c'est un dieu, il doit déjà savoir tout ce qui se passe et n'a sans doute pas besoin qu'on le tienne au courant.\n@c2@"
  it: "@a@b*: E poi, se questo Drago è davvero una divinità, dovrebbe essere già al corrente dei fatti!\n㈡\n*: Non ha mica bisogno che qualcuno vada a riferirgli come stanno le cose!\n@c2@"
  ja: "@a@b＊「だいいち　神さまだから\n\tわざわざ知らせに行かなくても\n\tもう　知ってるんじゃないかなあ。\n@c2@"
"16":
  de: "@a@b*: Aber geht erst mal zu ihm und hört ihn an, dann könnt Ihr auf ein Plauschchen zurückkommen...\n@c2@"
  en: "@a@b*: Gae an' hear him oot first, an' then come back for a chat, will ye?\n@c2@"
  es: "@a@b*: %H860%XVaya%YVayan%Z a escuchar al anciano y luego intercambiaremos impresiones, ¿de acuerdo?\n@c2@"
  fr: "@a@b*ⓢ Allez le voir et après, revenez discuter un peu.\nÇa vous vaⓡ\n@c2@"
  it: "@a@b*: %H860%XVai%YAndate%Z prima a parlare con lui, e poi %H860%Xtorna%Ytornate%Z qui, e faremo quattro chiacchiere.\n@c2@"
  ja: "@a@b＊「では　聞いてから\n\tまた来てください。\n@c2@"
"17":
  de: "@a@b*: Na, wenn das nicht Ragnar Rauhbein ist! Es ist schön, Euch so wohlbehalten wiederzusehen.\n@c1@"
  en: "@a@b*: Well, if it isn't Ragnar McRyan! I cannae tell ye hoo good it is tae see ye safe an' sound.\n@c1@"
  es: "@a@b*: ¡Vaya, que me aspen si no es Ragnar McRyan! No puedo expresar con palabras cuánto me alegro de ver que se encuentra sano y salvo.\n@c1@"
  fr: "@a@b*ⓢ Regardez qui voilàⓠ Ragnar McRyanⓠ\nSi vous saviez comme ça me fait plaisir de vous voir en pleine forme.\n@c1@"
  it: "@a@b*: Ma tu guavda se non è Galiavdo de' Guglielmi! Come sono contenta di vedeve che stai bene!\n@c1@"
  ja: "@a@b＊「ああ　ライアンさまではっ！？\n\tご無事で　なによりでございます。\n@c1@"
"18":
  de: "@a@b*: Ich habe Tag und Nacht gebetet, dass Euch nichts geschehen möge auf Euren Reisen... Oh! Ich plappere zu viel.\n@c1@"
  en: "@a@b*: I've been prayin' day an' night that ye're not comin' tae any harm oot there on yer travels. ...Och! I've said too much.\n@c1@"
  es: "@a@b*: He rogado día y noche para que no le sucediese ningún percance durante sus viajes. ¡Oh! Creo que he hablado demasiado.\n@c1@"
  fr: "@a@b*ⓢ Nuit et jour, j'ai prié pour que rien ne vous arrive pendant vos voyages...\nOups, j'en ai peut-être trop dit...\n@c1@"
  it: "@a@b*: Ogni giovno pvego la dea affinché non ti capiti nulla di male durante i tuoi viaggi. Sei sempve nei miei pensievi e...\n㈡\n*: Ops! Boccuccia mia statte zitta!\n@c1@"
  ja: "@a@b＊「わたくし　いつでも\n\tあなたさまの　旅の安全を\n\t祈っておりますわ。　……ぽっ。\n@c1@"
"19":
  de: "@a@b*: Wie es wohl Ragnar geht auf seinen Reisen? Ich mach mir solche Sorgen um ihn.\n@c1@"
  en: "@a@b*: I wonder hoo Ragnar's gettin' along oot there on his travels. I'm so worried aboot him.\n@c1@"
  es: "@a@b*: Me pregunto cómo estará desenvolviéndose Ragnar en sus viajes. Estoy tan inquieta por él.\n@c1@"
  fr: "@a@b*ⓢ Je me demande si Ragnar va bien. Je suis si inquiète de le savoir sur la route, comme ça.\n@c1@"
  it: "@a@b*: Chissà come se la passa il cavo Galiavdo... Sono così in pena pev lui!\n@c1@"
  ja: "@a@b＊「ライアンさまは　今ごろ\n\tどうなさっているのかしら？\n\t心配ですわ……。\n@c1@"
"20":
  de: "@a@b*: Oh. Das war eigentlich nicht für fremde Ohren bestimmt! Wie peinlich.\n@c1@"
  en: "@a@b*: Och! Ye weren't supposed tae hear that.\nNoo I'm all of a flush.\n@c1@"
  es: "@a@b*: ¡Vaya! Eso no debió oírlo nadie.\nMe siento tan avergonzada...\n@c1@"
  fr: "@a@b*ⓢ Ohⓠ Mais personne n'était censé entendre ça.\nMaintenant, je suis toute rouge.\n@c1@"
  it: "@a@b*: Oh! Ehm, %H860%Xtu non hai%Yvoi non avete%Z sentito nulla, eh? Santo cielo, che imbavazzo!\n@c1@"
  ja: "@a@b＊「あ　あら　いやですわ。\n\t聞いていらしたの……ぽっ。\n@c1@"
"21":
  de: "@a@b*: Anscheinend wurde das Wandlungsarmband, das hier zum Kauf angeboten wurde, von Monstern geraubt.\n@c2@"
  en: "@a@b*: I hear that the armlet of transmutation they had on sale here was swiped by monsters.\n@c2@"
  es: "@a@b*: Me han dicho que el brazalete de transmutación que vendían fue sustraído por los monstruos.\n@c2@"
  fr: "@a@b*ⓢ On m'a dit que le brassard étincelant qui était en vente ici avait été volé par des monstres.\n@c2@"
  it: "@a@b*: Ho sentito dire che la Fascia crisalidea che era in vendita qui è stata rubata da alcuni mostri.\n@c2@"
  ja: "@a@b＊「売りに出されていた\n\t黄金の腕輪というのが\n\t魔物たちに　うばわれたとか……。\n@c2@"
"22":
  de: "@a@b*: Ich kann mir nicht vorstellen, was ein Monster damit anfangen sollte.\n@c2@"
  en: "@a@b*: I can't understand why a monster would want to steal a thing like that.\n@c2@"
  es: "@a@b*: No entiendo por qué querría un monstruo robar un objeto como ese.\n@c2@"
  fr: "@a@b*ⓢ Je me demande ce que des monstres pourraient bien faire d'un truc dans ce genre.\n@c2@"
  it: "@a@b*: Non riesco a capire come mai delle creature simili possano essere interessate a un oggetto del genere!\n@c2@"
  ja: "@a@b＊「でも　そんなもの\n\t魔物が盗んで\n\tどうするんでしょうねえ……。\n@c2@"
"23":
  de: "@a@b*: Du bist ja immer noch da, Ragnar!\nNur keine Hast, was?\n@c2@"
  en: "@a@b*: Whit are ye daein' here, Ragnar?\nYe certainly like tae take things easy, eh?\n@c2@"
  es: "@a@b*: ¿Qué está haciendo aquí aún, Ragnar? \nEs obvio que le gusta tomarse su tiempo, ¿eh?\n@c2@"
  fr: "@a@b*ⓢ Que faites-vous encore ici, Ragnarⓡ \nVous n'aimez pas précipiter les choses, heinⓡ\n@c2@"
  it: "@a@b*: Cosa ci fai ancora qui, Galiardo? Ti piace prendertela comoda, eh?\n@c2@"
  ja: "@a@b＊「よう　ライアン！\n\tまだ　こんな所を　ウロウロして\n\tあいかわらず　のろまだな。\n@c2@"
"24":
  de: "@a@b*: Dies ist die Schatzkammer von Burg Burland.\n@c2@"
  en: "@a@b*: This is Burland Castle's treasure chamber.\n@c2@"
  es: "@a@b*: Esta es la cámara del tesoro del Castillo de Burlandia.\n@c2@"
  fr: "@a@b*ⓢ Vous êtes dans la salle du trésor du château de Bastione.\n@c2@"
  it: "@a@b*: Questa è la stanza del tesoro del castello di Burlandia.\n@c2@"
  ja: "@a@b＊「ここは　お城の宝物庫だ。\n@c2@"
"25":
  de: "@a@b*: Selbst wenn die Tür offen wäre, könnte kein Mensch an die Schatztruhen gelangen.\n@c2@"
  en: "@a@b*: Even if the door was unlocked, most folk wouldnae be able tae reach the treasure chests.\n@c2@"
  es: "@a@b*: Aunque la puerta estuviese abierta, casi nadie sería capaz de alcanzar los cofres del tesoro.\n@c2@"
  fr: "@a@b*ⓢ Même si la porte était déverrouillée, la plupart des gens ne pourraient pas arriver aux coffres.\n@c2@"
  it: "@a@b*: Anche se la porta non fosse chiusa a chiave, nessuno potrebbe mai nemmeno avvicinarsi agli scrigni dove sono custoditi i tesori.\n@c2@"
  ja: "@a@b＊「たとえ　カギを開けられても\n\tよほどの者でなければ\n\t宝箱まで　たどりつけまい！\n@c2@"
"26":
  de: "@a@b*: Seine Majestät hat mir erzählt, dass der Zenithiaschild einst hier auf Burg Burland war.\n@c2@"
  en: "@a@b*: His Majesty was tellin' me hoo the Zenithian Shield used tae be here in Burland Castle.\n@c2@"
  es: "@a@b*: Su Majestad me contaba que el Escudo de Zenithia solía estar aquí, en el Castillo de Burlandia.\n@c2@"
  fr: "@a@b*ⓢ Sa Majesté m'a raconté qu'autrefois, le Bouclier zénithien était ici, au château de Bastione.\n@c2@"
  it: "@a@b*: Sua Maestà mi ha raccontato che, un tempo, lo Scudo Zenithiano era nel castello di Burlandia.\n@c2@"
  ja: "@a@b＊「王さまから　聞いたのですが\n\tむかし　このお城には\n\t天空の盾があったそうです。\n@c2@"
"27":
  de: "@a@b*: Wo ich grad darüber nachdenke, fällt mir ein, dass der König von Kanalot den Zenithiahelm besitzen soll.\n@c2@"
  en: "@a@b*: Noo I come tae think of it, there's a Zenithian Helm oot there that's supposed tae be part o' the King o' Canalot's collection.\n@c2@"
  es: "@a@b*: Pensándolo bien, recuerdo que había un Yelmo de Zenithia que, según creo, formaba parte de la armería del Rey de Canalot.\n@c2@"
  fr: "@a@b*ⓢ Maintenant que j'y repense, je crois avoir entendu dire que le Casque zénithien faisait partie de la collection du roi de Canalot.\n@c2@"
  it: "@a@b*: Adesso che ci penso, se non sbaglio, c'è un oggetto chiamato Elmo Zenithiano che fa parte della collezione di tesori del Re di Canalot.\n@c2@"
  ja: "@a@b＊「そういえば　天空のかぶとは\n\t西の海　スタンシアラの\n\t王さまが　持っていたとか。\n@c2@"
"28":
  de: "@a@b*: Kanalot liegt im Westen, hinter dem Ozean. Ich frage mich, ob der Helm noch dort ist...\n@c2@"
  en: "@a@b*: Canalot's west from here across the ocean.\nI wonder if the helm's still there...\n@c2@"
  es: "@a@b*: Canalot está hacia el oeste, al otro lado del océano.\nMe pregunto si el yelmo seguirá aún allí...\n@c2@"
  fr: "@a@b*ⓢ Canalotⓡ Ça se trouve à l'ouest. Il faut traverser l'océan.\nJe me demande si ce casque y est toujours...\n@c2@"
  it: "@a@b*: Canalot si trova in mezzo al mare, a ovest di qui. Chissà se quell'elmo si trova ancora lì... \n@c2@"
  ja: "@a@b＊「今も　持っているのかな……。\n@c2@"
"29":
  de: "@a@b*: Der Magmastab beschwört sehr heißes Magma herauf, das sogar Felsen zum Schmelzen bringt.\n@c2@"
  en: "@a@b*: The magma staff summons a really really hot magma that can melt rocks, ye know.\n@c2@"
  es: "@a@b*: El báculo de magma invoca un magma incandescente capaz de fundir las rocas.\n@c2@"
  fr: "@a@b*ⓢ Le bâton de lave projette du magma en fusion qui peut faire fondre la roche, vous savez.\n@c2@"
  it: "@a@b*: Il Bastone di magma ha il potere di far comparire della lava incandescente che può fondere le rocce.\n@c2@"
  ja: "@a@b＊「マグマの杖は　岩をも溶かす\n\t高熱のマグマを　よびおこすとか…。\n@c2@"
"30":
  de: "@a@b*: Wie ich hörte, befindet sich ein solcher Stab im Königreich Samokswa, im Westen.\n@c2@"
  en: "@a@b*: I hear ye may be able tae find one over in the western kingdom of Zamoksva.\n@c2@"
  es: "@a@b*: Según dicen, se puede encontrar uno en el reino occidental de Zamoksva.\n@c2@"
  fr: "@a@b*ⓢ On m'a raconté qu'il en existait un dans le royaume occidental de Zamoksva.\n@c2@"
  it: "@a@b*: Ho sentito dire che è possibile procurarsene uno nel regno di Zamoskva, a ovest.\n@c2@"
  ja: "@a@b＊「はるか西の国　サントハイムに\n\t伝わると　聞きおよびます。\n@c2@"
"31":
  de: "@a@b*: Dies ist der Thronsaal von König Burkhard.\n@c2@"
  en: "@a@b*: This is King Burnard's throne room.\n@c2@"
  es: "@a@b*: Este es el salón del trono del rey Recaredo.\n@c2@"
  fr: "@a@b*ⓢ Vous êtes dans la salle du trône du roi Bastien.\n@c2@"
  it: "@a@b*: Questa è la sala del trono di Re Basilio.\n@c2@"
  ja: "@a@b＊「ここは　バトランド王のお部屋です。\n@c2@"
"32":
  de: "@a@b*: Die Burg Femiscyra liegt hoch oben in den Bergen. Es gab einmal einen kleinen Pfad dorthin.\n@c2@"
  en: "@a@b*: Femiscyra Castle is high up in the mountains.\nThere used tae be a little track leadin' up there.\n@c2@"
  es: "@a@b*: El Castillo de Feministia está muy alto en las montañas. Solía haber un sendero que conducía allí.\n@c2@"
  fr: "@a@b*ⓢ Le château de Fémiscyra est perché dans les montagnes. Autrefois, on y accédait par un sentier.\n@c2@"
  it: "@a@b*: Il castello di Femiscyra si trova tra le montagne. Una volta c'era un sentiero che conduceva fino a lì.\n@c2@"
  ja: "@a@b＊「ガーデンブルグのお城は\n\t岩山の上にあり　昔は\n\t細い山道が　通じていたそうじゃ。\n@c2@"
"33":
  de: "@a@b*: Der wurde allerdings bei einem Vulkanausbruch vor einiger Zeit zerstört.\n@c2@"
  en: "@a@b*: That was destroyed when the volcano erupted a while back, though.\n@c2@"
  es: "@a@b*: Pero hace poco, durante la erupción del volcán, quedó destruido.\n@c2@"
  fr: "@a@b*ⓢ Mais il a disparu il y a longtemps, lorsque le volcan est entré en éruption.\n@c2@"
  it: "@a@b*: Ora, però, la strada è interrotta a causa di un'eruzione vulcanica avvenuta qualche tempo fa.\n@c2@"
  ja: "@a@b＊「しかし少し前　火山の爆発で\n\tその山道も　ふさがってしまった！\n@c2@"
"34":
  de: "@a@b*: Doch mit dem Magmastab könnte man die Felsen schmelzen, die den Zugang versperren.\n@c2@"
  en: "@a@b*: If only ye had a magma staff, ye might be able tae melt the rocks blockin' the entrance tae it.\n@c2@"
  es: "@a@b*: Con un báculo de magma se podrían fundir las rocas que bloquean la entrada.\n@c2@"
  fr: "@a@b*ⓢ Si vous aviez un bâton de lave, vous pourriez faire fondre les rochers qui bloquent le passage.\n@c2@"
  it: "@a@b*: Se %H860%Xtu avessi%Yaveste%Z un Bastone di magma, %H860%Xpotresti sbarazzarti%Ypotreste sbarazzarvi%Z delle rocce che bloccano il passaggio.\n@c2@"
  ja: "@a@b＊「マグマの杖でもあれば\n\t入り口をふさいでいる火山岩を\n\t溶かせるかも　知れぬが……。\n@c2@"
"35":
  de: "@a@b*: Was?! Ihr habt einen Magmastab?! Das nenn ich aber Glück!\n@c2@"
  en: "@a@b*: Jings! Ye've got a magma staff!?\nOch, well, that's a piece o' luck noo, isn't it?\n@c2@"
  es: "@a@b*: ¡Demonios! ¡¿%H860%XTiene%YTienen%Z un báculo de magma?!\n¡Eso sí que es buena fortuna!\n@c2@"
  fr: "@a@b*ⓢ Commentⓡ Vous avez un bâton de laveⓠⓑ\nEh bien, c'est un sacré coup de potⓠ\n@c2@"
  it: "@a@b*: Che cosa? %H860%XHai%YAvete%Z un Bastone di magma? Questa sì che è fortuna! Bel colpo!\n@c2@"
  ja: "@a@b＊「なんと　もう持っているのか！？\n\tさすがじゃのう！\n\tあっぱれ　あっぱれ。\n@c2@"
"36":
  de: "@a@b*: Schön, Euch wiederzusehen, Rauhbein.\n@c2@"
