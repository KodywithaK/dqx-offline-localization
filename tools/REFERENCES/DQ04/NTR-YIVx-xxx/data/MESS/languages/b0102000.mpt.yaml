"47":
  de: "@a@b*: Ich weiß nicht, der Himmel gefällt mir in letzter Zeit gar nicht.\n@c2@"
  en: "@a@b*: I cannae help feelin' a mite uneasy whenever I'm lookin' at the sky just lately.\n@c2@"
