  it: "@a@b*: Fiuuu... Per fortuna era solo un incubo...!\n@c2@"
  ja: "@a@b＊「はっ…………。\n\tなんと　夢であったか……。\n@c2@"
"56":
  de: "@a@b*: Wenn Ihr von dieser Höhle aus gen Süden geht, kommt Ihr nach Burland.\n@c3@"
  en: "@a@b*: If ye gae south from this cave, yeⓙll come tae Burland.\n@c3@"
  es: "@a@b*: Si se %H860%Xdirige%Ydirigen%Z hacia el sur desde esta cueva, %H860%Xllegará%Yllegarán%Z a Burlandia.\n@c3@"
  fr: "@a@b*ⓢ Si vous prenez plein sud depuis cette grotte, vous arriverez à Bastione.\n@c3@"
  it: "@a@b*: Se all'uscita di questa grotta %H860%Xprocedi%Yprocedete%Z verso sud, %H860%Xarriverai%Yarriverete%Z a Burlandia.\n@c3@"
  ja: "@a@b＊「この洞くつを　南に抜けると\n\tバトランドのお城だ！\n@c3@"
"57":
  de: "@a@b*: Was?! Das wusstet Ihr schon? Da bin ich aber beeindruckt, %A120%XJunge%Z%B120%XMädchen%Z.\n@c3@"
  en: "@a@b*: Och! Ye knew that already, did ye?\nIⓙm verra impressed, %A120%Xladdie%Z%B120%Xlassie%Z.\n@c3@"
  es: "@a@b*: ¡Cáspita! Ya %H860%Xsabía%Ysabían%Z eso, ¿no es así?\nEstoy muy impresionado %H860%X%A120%Xjoven caballero%Z%B120%Xjoven dama%Z%Y%R000%Xjóvenes damas%Yjóvenes caballeros%Z%Z.\n@c3@"
  fr: "@a@b*ⓢ Ahⓠ Vous le saviez déjàⓡ\nJe suis impressionné, %A120%Xmon gars%Z%B120%Xjeune fille%Z.\n@c3@"
  it: "@a@b*: Oh! Lo sapevi già? Molto bene, %A120%Xragazzo%Z%B120%Xragazza%Z.\n@c3@"
  ja: "@a@b＊「え？　知ってるって？\n\tおぬし　ただ者ではないなっ！\n@c3@"
