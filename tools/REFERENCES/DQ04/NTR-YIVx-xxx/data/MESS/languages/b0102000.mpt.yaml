  fr: "@aRoi Bastien@bAinsi vous êtes %H860%X%A090%Xl'Élu choisi%Z%B090%Xl'Élue choisie%Z%Y%R000%Xles Élues choisies%Yles Élus choisis%Z%Z pour vaincre le Seigneur des Enfersⓡ Je vois.\n@c2@"
