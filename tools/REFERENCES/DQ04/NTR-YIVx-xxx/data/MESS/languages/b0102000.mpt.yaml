  ja: "@a@b王「そうか　勇者どのに会えたのだな！\n\tあっぱれ　あっぱれ！\n@c2@"
"38":
  de: "@a@b*: Ich habe auch ein paar Neuigkeiten. Ich habe herausgefunden, dass sich der Zenithiaschild einst unter den Schätzen Burlands befand.\n@c2@"
