  es: "@a@b*: ¿Por qué no %H860%Xpasa%Ypasan%Z la noche en la taberna y %H860%Xregresa%Yregresan%Z mañana?\n@c2@"
  fr: "@a@b*ⓢ Pourquoi ne pas passer la nuit à l'auberge et revenir demainⓡ\n@c2@"
  it: "@a@b*: Perché non trascorri la notte alla locanda e torni qui domani?\n@c2@"
  ja: "@a@b＊「今夜は　宿屋にでも泊まって\n\t明日　また来るといい。\n@c2@"
"52":
  de: "@a@b*: Ha-püh...\n@c2@"
