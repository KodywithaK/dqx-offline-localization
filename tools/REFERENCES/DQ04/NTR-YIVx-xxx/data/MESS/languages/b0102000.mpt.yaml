  ja: "@a@b王「じつは　最近わかったことだが\n\tこの城には　かつて\n\t天空の盾が　あったそうじゃ。\n@c2@"
"39":
  de: "@a@b*: Doch zu Zeiten meines Großvaters wurde er der Königin von Femiscyra geschenkt.\n@c2@"
  en: "@a@b*: But it was given tae the Queen o' Femiscyra way back in ma grandfather's time.\n@c2@"
