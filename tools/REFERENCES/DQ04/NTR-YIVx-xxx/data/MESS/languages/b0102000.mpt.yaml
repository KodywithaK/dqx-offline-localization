  ja: "@a@b王「おお　ライアン！\n\tよくぞ　戻った！\n@c2@"
"37":
  de: "@a@b*: Ihr habt also %A090%Xden erkorenen Helden%Z%B090%Xdie erkorene Heldin%Z gefunden, wie ich sehe? Das ist großartig!\n@c2@"
