  es: "@a@b*: Ah, fiuuu...\n@c2@"
  fr: "@a@b*ⓢ Ron-pfff...\n@c2@"
  it: "@a@b*: Ronf... \n@c2@"
  ja: "@a@b＊「ぐうぐう……。\n@c2@"
"53":
  de: "@a@b*: Endlich Zeit für ein kleines Nickerchen. Ich sag's ja, am glücklichsten sind die Leute, wenn sie schlafen.\n@c2@"
  en: "@a@b*: Time for a wee bit o' shut-eye at last. I'd say folk are at their happiest when they're sleepin'.\n@c2@"
  es: "@a@b*: Por fin, es hora de concederse un poco de reposo. Opino que las personas son más felices mientras duermen.\n@c2@"
  fr: "@a@b*ⓢ C'est enfin l'heure de se reposer. D'après moi, c'est quand les gens dorment qu'ils sont le plus heureux.\n@c2@"
  it: "@a@b*: Direi che è ora di dormire, no? La gente è sempre felice quando può chiudere gli occhi e riposare un po'.\n@c2@"
  ja: "@a@b＊「さあ　寝るぞ　寝るぞ。\n\t人間　やっぱり眠るときが\n\tいちばん　しあわせでござる。\n@c2@"
"54":
  de: "@a@b*: Hilf Himmel! Ein Ungeheuer! Nein! Ich bin doch noch so jung!\n@c2@"
