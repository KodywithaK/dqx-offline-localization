  ja: "@a@b王「しかし　わしの　じいさまの時\n\tガーデンブルグの女王に\n\tあげてしまったらしい。\n@c2@"
"40":
  de: "@a@b*: Femiscyra ist ein Reich in den östlichen Bergen, in dem nur Frauen leben.\n@c2@"
  en: "@a@b*: Femiscyra's that land oot in the eastern mountains where only lassies live.\n@c2@"
