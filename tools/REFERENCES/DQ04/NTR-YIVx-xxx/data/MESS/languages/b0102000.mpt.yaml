  fr: "@a@b*ⓢ Fémiscyra est un pays des montagnes orientales uniquement peuplé de femmes.\n@c2@"
  it: "@a@b*: Femiscyra si trova a est, tra le montagne. È un luogo abitato solo da donne.\n@c2@"
  ja: "@a@b王「ガーデンブルグは\n\t東の山奥にそびえる\n\t女だけが住む　お城。\n@c2@"
"41":
  de: "@a@b*: Was meinen Großvater da nur geritten hat, solch einen wertvollen Schatz wegzugeben! Lässt sich immer von den Weibern bezirzen...\n@c2@"
