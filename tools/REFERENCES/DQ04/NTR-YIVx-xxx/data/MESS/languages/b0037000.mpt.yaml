"88":
  de: "@a@b*: Habt Ihr von Samokswa gehört, diesem Land im Westen? Es heißt, dass dort Leute verschwinden. Ich weiß nicht, was ich davon halten soll...\n@c3@"
  en: "@a@b*: Have you heard of Zamoksva, the country over in the west? They say people are going missing there. I don't know what it's all about...\n@c3@"
  es: "@a@b*: ¿Has oído hablar de Zamoksva, el país que se encuentra al oeste? Dicen que la gente está desapareciendo. No sé a qué se debe todo esto.\n@c3@"
  fr: "@a@b*ⓢ Vous avez entendu parler de Zamoksva, le pays à l'ouestⓡ Il paraît que des gens disparaissent là-bas. Je ne sais pas ce qui se passe...\n@c3@"
  it: "@a@b*: %H860%XHai%YAvete%Z sentito parlare di Zamoskva, il regno che si trova a ovest?\n㈡\n*: Pare che lì siano misteriosamente scomparse delle persone...\n@c3@"
  ja: "@a@b＊「ウワサでは　西の国サントハイムから\n\t人々が　消えたとか。\n\tなにが　起こったのであろうか……。\n@c3@"
"89":
  de: "@aTessa@bAh, ich bin so stolz, dass ich's am liebsten dem König sagen würde! Vielleicht solltest du rübergehen und dem ollen Kerl sagen, dass du jetzt 'n Laden hast.\n@c1@"
  en: "@aTessie@bAh, I'm that proud I could go and tell it to the King! Speakin' o' which, maybe ye'd better head over an' let the ole feller know ye've got yerself a shop.\n@c1@"
  es: "@aTrakiba@b¡Ah! Estoy tian orgullosa que si lo contaría al mismísimo Rey. Por cierto, quizás dieberías ir a diecirle que ya tienes una tienda, sí.\n@c1@"
  fr: "@aLucille@bAh, je suis tellement fière que je serais même capable d'aller le dire au roiⓠ\n㈡\nÀ ce propos, tu devrais peut-être aller informer le vieil homme que tu possèdes ton magasin, maintenant.\n@c1@"
  it: "@aBeatrice@bAh, so' felice che so' potuta anda' a parla' co i'Rre! A proposito! Forse faresti meglio a raccontargli che ora te tu c'hai 'na bottega tutta tua!\n@c1@"
  ja: "@a@bネネ「そうそう　お店をもてたこと\n\t王さまに　ほうこくしてきたら\n\tどうかしら？\n@c1@"
