"0":
  de: "@a@b*: Das ist der beau Palais de Léon!\n@c2@"
  en: "@a@b*: Zis is ze great Palais de Léon!\n@c2@"
  es: "@a@b*: ¡Este es le grand Palais de Léon!\n@c2@"
  fr: "@a@b*ⓢ C'est le magnificent palace de Lord Lionelⓠ\n@c2@"
  it: "@a@b*: Voilà, il grande Palazzo de Léon!\n@c2@"
  ja: "@a@b＊「ここは　偉大なるお城\n\tキングレオだ！\n@c2@"
"1":
  de: "@a@b*: Oh hallo. Sucht Ihr etwa auch nach der Stillesphäre?\n@c2@"
  en: "@a@b*: Oh, hello. Are you here looking for the sphere of silence, too?\n@c2@"
  es: "@a@b*: ¡Ah!, saludos. ¿En busca del orbe del silencio?\n@c2@"
  fr: "@a@b*ⓢ Oh, bonjour. Vous aussi, vous cherchez la sphère du Silenceⓡ\n@c2@"
  it: "@a@b*: Oh, salve. Pure %H860%Xtu stai%Yvoi state%Z cercando la Sfera del silenzio?\n@c2@"
  ja: "@a@b＊「おや？　あんたたちも　この洞くつに\n\t静寂の玉を　探しにきたのかい？\n@c2@"
"2":
  de: "@a@b*: Ihr solltet besser aufgeben. Ich bin auch den ganzen Weg aus Laissez Fayre hierher gekommen.\n@c2@"
  en: "@a@b*: I should give up if I were you. I came all this way from Laissez Fayre, too.\n@c2@"
  es: "@a@b*: Yo ni lo intentaría. He viajado desde Laissez Fayre.\n@c2@"
  fr: "@a@b*ⓢ Je laisserais tomber à votre place. Moi aussi, j'ai fait le chemin depuis Teafortwoⓠ\n@c2@"
  it: "@a@b*: Fossi in %H860%Xte%Yvoi%Z, lascerei perdere. Io ero venuto apposta da Laissez Fayre...\n@c2@"
  ja: "@a@b＊「でも　あきらめたほうがいいよ。\n\tわたしも　はるばるモンバーバラから\n\tやってきたんだがね……。\n@c2@"
"3":
  de: "@a@b*: Aber es ist unmöglich, noch tiefer in die Höhle zu gelangen. Ich hab alles versucht.\n@c2@"
  en: "@a@b*: But there's just no way to get further down in this cave. I've looked everywhere.\n@c2@"
  es: "@a@b*: Pero no hay forma de avanzar más en la cueva. He mirado por todas partes.\n@c2@"
  fr: "@a@b*ⓢ Mais impossible d'aller plus loin dans cette grotte. J'ai regardé partout.\n@c2@"
  it: "@a@b*: Ma non c'è modo di avanzare in questa grotta! Eppure ho guardato ovunque!\n@c2@"
  ja: "@a@b＊「どうしても　下に降りる階段が\n\t見つからないのだよ。\n@c2@"
"4":
  de: "@aOojam@bOh. %L000%XFräulein Mina und Fräulein Maya%YMein wertes Fräulein%Z! Ich bin's. Oojam.\n@c2@"
  en: "@aOojam@bOh! %L000%XMiss Meena and Miss Maya!%YMy dear young Miss!%Z It is me here. Oojam.\n@c2@"
  es: "@aOojam@b¡Oh! ¡%L000%XSeñorita Meena y Señorita Maya!%YSeñorita!%Z Soy yo, Oojam.\n@c2@"
  fr: "@aOojam@bOhⓠ %L000%XMademoiselle Mina et Mademoiselle Maya%YMademoiselle%Zⓠ C'est moi, Oojam.\n@c2@"
  it: "@aOojam@bOh! %L000%XMiss Myra e Miss Maya%YMa tu è figlia di guru Malaparata%Z! Io sono, Oojam.\n@c2@"
  ja: "@a@b＊「ややっ！\n\tマーニャさまに　ミネアさま！\n\tわたしです！　弟子のオーリンです！\n@c2@"
"5":
  de: "@aOojam@bWovon redet Ihr denn da? Ihr wollt Euren Vater rächen?\n@c2@"
  en: "@aOojam@bWhat is this crazy-crazy talk you are making? You are on a mission of revenge for your father?\n@c2@"
  es: "@aOojam@b¿Qué es todo eso de lo que %H860%Xhabla%Yhablan%Z? ¿%H860%XHa%YHan%Z emprendido un viaje para vengar a su padre%H860%X?%Y, hermanas?%Z\n@c2@"
  fr: "@aOojam@bQu'est-ce que c'est que cette histoireⓡ\nVous voulez venger la mort de votre pèreⓡ\n@c2@"
  it: "@aOojam@bCosa essere questa pazzia che %L000%Xvoi parlate%Ytu parla%Z? Missione di vendetta per povero Malaparata?\n@c2@"
  ja: "@a@bオーリン「なんですって！？\n\tおふたりだけで　カタキ討ちの旅を？\n\tおお……　なんと言うことだ！\n@c2@"
"6":
  de: "@aOojam@bDann lasst mich Euch begleiten. Ich hab schließlich auch guten Grund zur Rache.\n@c2@"
  en: "@aOojam@bThen I must be coming with you, please. This revenging is for me also.\n@c2@"
  es: "@aOojam@bEntonces iré con %H860%Xusted%Yustedes%Z, por favor. También será mi venganza%H860%X, señorita.%Y, señoritas.%Z\n@c2@"
  fr: "@aOojam@bDans ce cas, je vous accompagne.\nCette vengeance me concerne aussi.\n@c2@"
  it: "@aOojam@bAllora io venire con %L000%Xvoi, vi%Yte, ti%Z prego. Questa è anche mia vendetta.\n@c2@"
  ja: "@a@bオーリン「ならば　わたしも\n\tおじょうさまがたと　願いは同じ！\n@c2@"
"7":
  de: "@aOojam@bWährend ich mich hier erholt habe, habe ich die ganze Zeit darüber nachgedacht, wie ich meinen Meister rächen könnte.\n@c2@"
  en: "@aOojam@bI have been recuperating myself here while I am thinking only of revenging Mahabala-jee.\n@c2@"
  es: "@aOojam@bLlevo tiempo recuperándome aquí pensando en vengar a mi señor Mahabala.\n@c2@"
  fr: "@aOojam@bJe suis venu ici pour me remettre et pendant ce temps, je n'ai pensé qu'à une seule choseⓢ venger Mahabala-jee.\n@c2@"
  it: "@aOojam@bMentre ero qui a recuperare mie forze non fatto altro che pensare a come vendicare guru Malaparata.\n@c2@"
  ja: "@a@bオーリン「わたしも　エドガンさまの\n\tカタキ討ちだけを胸に　ここで\n\tキズの回復を　待っていたのです！\n@c2@"
"8":
  de: "@aOojam@bIch hab auch gehört, dass Balzack Seelen an den Teufel verkauft und so immer stärker wird.\n@c2@"
  en: "@aOojam@bAnd I am hearing talk of Balzack that he is selling souls to the devil and making himself really tough-tough.\n@c2@"
  es: "@aOojam@bY me han llegado rumores de que Balzack vende almas al diablo y se está convirtiendo en un ser malvado, %H860%Xseñorita%Yseñorita%Z.\n@c2@"
  fr: "@aOojam@bEn plus, il paraît que Dickenz vend des âmes au diable et qu'il devient tous les jours plus puissantⓠ\n@c2@"
  it: "@aOojam@bE ho sentito che Balzack sta vendendo anime di persone al diavolo. Così lui diventa molto molto forte.\n@c2@"
  ja: "@a@bオーリン「うわさでは　バルザックめ\n\t悪魔に魂を売り　強力なチカラを\n\t身に　つけたそうです。\n@c2@"
"9":
  de: "@aOojam@bDarum suche ich die Stillesphäre. Nur mit ihr können wir seine magischen Kräfte zum Erlahmen bringen.\n@c2@"
  en: "@aOojam@bThat's why I am looking for the sphere of silence. It's the only way to seal away his magical powers.\n@c2@"
  es: "@aOojam@bPor ese motivo busco el orbe del silencio. Es la única forma de acabar con sus poderes mágicos.\n@c2@"
  fr: "@aOojam@bC'est pour cette raison que je cherche la sphère du Silence. C'est le seul moyen de contenir ses pouvoirs magiques.\n@c2@"
  it: "@aOojam@bEcco perché cerco Sfera del silenzio. È unico modo per bloccare per sempre suoi poteri magici.\n@c2@"
  ja: "@a@bオーリン「しかし　静寂の玉さえあれば\n\tやつのチカラを　封じられるはず！\n@c2@"
"10":
  de: "@aOojam@bWas?! Ihr habt sie schon? Ausgezeichnet!\n@c2@"
  en: "@aOojam@bWaah! That's just it! You are having it already, I see.\n@c2@"
  es: "@aOojam@b¡Aaah! ¡Eso es! Compruebo que ya lo %H860%Xtiene%Ytienen%Z.\n@c2@"
  fr: "@aOojam@bOuahⓠ C'est elleⓠ Vous l'avez déjà récupérée à ce que je vois.\n@c2@"
  it: "@aOojam@bEhiii! Ma è questa! %L000%XVoi già avete%YTu già hai%Z questo oggetto molto molto prezioso!\n@c2@"
  ja: "@a@bオーリン「おおっ！　それです！\n\tすでに　お持ちでしたか！\n@c2@"
"11":
  de: "@aOojam@bGut. Ich werde mit Euch gehen. Los!\n@c2@"
  en: "@aOojam@bWell. I must be joining you. Let's go!\n@c2@"
  es: "@aOojam@bBien. Me uniré a %H860%Xusted%Yustedes%Z. ¡Vamos!\n@c2@"
  fr: "@aOojam@bEh bien, je vous suisⓠ Allons-yⓠ\n@c2@"
  it: "@aOojam@bOttimo! Allora Oojam viene con %L000%Xvoi%Yte%Z. Andiamo!\n@c2@"
  ja: "@a@bオーリン「とにかく　このわたしも\n\tおともさせて　いただきます！\n\tさあ　急いで　まいりましょう！\n@c2@"
"12":
  de: "@a@bOojam schließt sich der Gruppe an!\n@c2@"
  en: "@a@bOojam joins the party!\n@c2@"
  es: "@a@bOojam se une al grupo.\n@c2@"
  fr: "@a@bOojam rejoint l'équipeⓠ\n@c2@"
  it: "@a@bOojam si unisce al gruppo!\n@c2@"
  ja: "@a@bオーリンが　仲間にくわわった！\n@c2@"
"13":
  de: "@a@bDie Tür ist verschlossen.\n@c0@"
  en: "@a@bThe door is locked.\n@c0@"
  es: "@a@bLa puerta está cerrada.\n@c0@"
  fr: "@a@bLa porte est verrouillée.\n@c0@"
  it: "@a@bLa porta è chiusa a chiave.\n@c0@"
  ja: "@a@bトビラには　カギが　かかっている！\n@c0@"
"14":
  de: "@a@bAber Oojam kann sie öffnen!\n@c0@"
  en: "@a@bBut Oojam picks it open!\n@c0@"
  es: "@a@b¡Pero Oojam consigue abrirla!\n@c0@"
  fr: "@a@bMais Oojam parvient à l'ouvrirⓠ\n@c0@"
  it: "@a@bMa Oojam riesce ad aprirla!\n@c0@"
  ja: "@a@bしかし　オーリンが\nカギを　こじあけた！\n@c0@"
