"0":
  de: "@a@b*: Willkommen in Rosenbühl, der Heimat der Zwerge. Hier lässt es sich wahrlich gut leben.\n@c2@"
  en: "@a@b*: Welcome to Rosehill, home of the dwarfs.\nAnd a fine place to live it is, too!\n@c2@"
  es: "@a@b*: %H860%X%A120%XBienvenido%Z%B120%XBienvenida%Z%Y%R000%XBienvenidas%YBienvenidos%Z%Z a Rosavilla, país de los enanos.\n¡Y un lugar espléndido para vivir!\n@c2@"
  fr: "@a@b*ⓢ Bienvenue à Rosecolline, le pays des nains.\nEt un endroit agréable à vivre, qui plus estⓠ\n@c2@"
  it: "@a@b*: Ehilà! Questa è Col Rosato, la terra dei nani! Qui si vive alla... grande! Capita la battuta? Eh! Eh! Eh!\n@c2@"
  ja: "@a@b＊「ここは　ロザリーヒル。\n\tわしら　ホビット族が　住む村だよ。\n@c2@"
"1":
  de: "@a@b*: Na so was, das Mädchen aus dem Turm! Sie lebt, hurra!\n@c1@"
  en: "@a@b*: Hey! It's you, the girl from the tower!\nYippee! You're alive!\n@c1@"
  es: "@a@b*: ¡Eh! ¡Eres tú, la chica de la torre!\n¡Yupiii! ¡Estás viva!\n@c1@"
  fr: "@a@b*ⓢ Héⓠ Mais c'est vous, la dame de la tourⓠ\nYoupiⓠ Vous êtes vivanteⓠ\n@c1@"
  it: "@a@b*: Ehi! Ma sei proprio tu... la fanciulla della torre! Non posso crederci! Sei viva!\n@c1@"
  ja: "@a@b＊「あっ！　塔の中のお姉ちゃんだ！\n\tわーい　わーい！\n@c1@"
"2":
  de: "@a@b*: Das muss eines dieser Wunder sein, die nur einmal alle tausend Jahre dank der Yggdrasil-Blume geschehen. Dass ich das noch erleben darf...\n@c1@"
  en: "@a@b*: This must be the once in a thousand year miracle that is the Yggdrasil flower.\nI never thought I'd see it with my own eyes.\n@c1@"
  es: "@a@b*: Debe ser por el milagro de la flor de Yggdrasil que se produce una vez cada mil años.\nJamás imaginé que lo vería con mis propios ojos.\n@c1@"
  fr: "@a@b*ⓢ Ça doit être le miracle de la fleur d'Yggdrasil qui se produit une fois tous les mille ans.\nJe n'aurais jamais cru le voir de mes propres yeux.\n@c1@"
  it: "@a@b*: Non c'è dubbio, si tratta del miracolo che accade ogni mille anni grazie al fiore di Ygdrasil. Chi l'avrebbe detto che un giorno l'avrei visto coi miei occhi...\n@c1@"
  ja: "@a@b＊「千年に一度の奇跡である\n\t世界樹の花。　この目で見られるとは\n\t思ってもみませんでした。\n@c1@"
"3":
  de: "@a@b*: Ihr seid gewiss dazu erkoren, die Welt zu retten.\n@c1@"
  en: "@a@b*: I'm sure you have what it takes to save the world.\n@c1@"
  es: "@a@b*: Estoy segura de que %H860%Xserás capaz%Yseréis capaces%Z de salvar el mundo.\n@c1@"
  fr: "@a@b*ⓢ Je suis sûre que vous avez les capacités nécessaires pour sauver le monde.\n@c1@"
  it: "@a@b*: Ora sono certa che %H860%Xsei%Ysiete%Z in grado di salvare il mondo.\n@c1@"
  ja: "@a@b＊「あなたたちならば　きっと\n\tこの世界を救えましょう。\n@c1@"
"4":
  de: "@a@b*: Uwaaahhh! Uwaaahhh!\nRosi lebt wieder!\n@c2@"
  en: "@a@b*: Uwaaargh! Uwaaargh!\nRose has come back to life!\n@c2@"
  es: "@a@b*: ¡Aaaargh! ¡Aaaargh!\n¡Rosa ha vuelto a la vida!\n@c2@"
  fr: "@a@b*ⓢ Waaarghⓠ Waaarghⓠ\nRose est revenue à la vieⓠ\n@c2@"
  it: "@a@b*: Uaaargh! Uaaargh! Rosa è tornatargh in vitargh!\n@c2@"
  ja: "@a@b＊「うおーん　うおーん。\n\tロザリーが　生き返ったー。\n@c2@"
"5":
  de: "@a@b*: Hoch leben die Menschen! So schlimm sind sie also gar nicht. Uwaaahhh!\n@c2@"
  en: "@a@b*: Hurraaargh for humans!\nThey're not all bad arrrghfter all.\nUwaaargh!\n@c2@"
  es: "@a@b*: ¡Hurra por los humanos!\nNo son tan malos, después de todo.\n¡Aaaargh!\n@c2@"
  fr: "@a@b*ⓢ Hourraaargh pour les humainsⓠ\nIls ne sont pas tous si mauvais, arrrghprès tout.\nWaaarghⓠ\n@c2@"
  it: "@a@b*: Evvivaaargh gli umani! Allora non sono tutti cattivi! Uaaargh!\n@c2@"
  ja: "@a@b＊「人間　ありがとう。\n\t人間にも　中には　いいやつが\n\tいるんだな。　うおーん。\n@c2@"
"6":
  de: "@a@b*: Wiiiieher! Rosi, du musst Psaro so schnell wie möglich aufhalten!\n@c2@"
  en: "@a@b*: Neeeigh! Rose, you must stop Psaro without a moment's deleeeigh!\n@c2@"
  es: "@a@b*: ¡Iiiiih! ¡Rosa, debes detener a Psaro sin más dilación.\n@c2@"
  fr: "@a@b*ⓢ Hiiiiiiⓠ Rose, tu dois arrêter Psaro iiiiimmédiatementⓠ\n@c2@"
  it: "@a@b*: Iiiiihhh! Rosa, deviiiiihhh fermare Psaro! Sbrigatiiiiihhh!\n@c2@"
  ja: "@a@b＊「ヒヒーン！\n\tロザリー。　ピサロさまのこと\n\tよろしくたのむよ！　ヒヒーン！\n@c2@"
"7":
  de: "@a@b*: Wuff, wuff! Pass auf, Rosi! %H860%XEin Mensch ist%YDie Menschen sind%Z hinter dir her! Du bist in Gefahr!\n@c2@"
  en: "@a@b*: Woof, woof! Look out, Rrrrose!\n%H860%XIt's a human%YThe humans are coming to get you%Z! You're in dangerrr!\n@c2@"
  es: "@a@b*: ¡Guau, guau! ¡Cuidado, Rrrrosa!\n¡%H860%XEs %A120%Xun humano%Z%B120%Xuna humana%Z%Y%R000%XLas humanas%YLos humanos vienen a buscarte%Z%Z! ¡Estás en peligrrro!\n@c2@"
  fr: "@a@b*ⓢ Ouaf, ouafⓠ Attention, Rrrroseⓠ\n%H860%X%A120%XC'est un humain%Z%B120%XC'est une humaine%Z%YLes humains viennent t'attraper%Zⓠ Tu es en dangerⓠ\n@c2@"
  it: "@a@b*: Bau bau! Attenta, Rosa! %H860%XUn umano vuole farti del male%YDegli umani stanno venendo a prenderti%Z! Sei in pericolo!\n@c2@"
  ja: "@a@b＊「わんわんっ！\n\tロザリー　あぶないっ！\n\t人間がいるよ！　わんわんっ！\n@c2@"
"8":
  de: "@a@b*: Na, wenn das nicht die junge Rosi ist.\n@c2@"
  en: "@a@b*: Well, if it isn't young Rose.\n@c2@"
  es: "@a@b*: ¡Vaya, que me aspen si no es la joven Rosa!\n@c2@"
  fr: "@a@b*ⓢ Mais... c'est la jeune Rose.\n@c2@"
  it: "@a@b*: Non ci posso credere! Rosa!\n@c2@"
  ja: "@a@b＊「おおっ　そこにいるお前さんは\n\tロザリーじゃないか。\n@c2@"
"9":
  de: "@a@b*: Ich hätte nie gedacht, dass sich Elfen und Menschen einmal so gut verstehen würden.\nNun ja, die Zeiten ändern sich...\n@c2@"
  en: "@a@b*: I never thought I'd see the day when elves and humans pull together.\nHow the times have changed!\n@c2@"
  es: "@a@b*: Nunca pensé que vería el día en que elfos y humanos trabajaran codo con codo.\n¡Cómo han cambiado los tiempos!\n@c2@"
  fr: "@a@b*ⓢ Je n'aurais jamais cru que je verrais un jour des elfes et des humains s'entendre.\nLes temps ont bien changéⓠ\n@c2@"
  it: "@a@b*: Chi l'avrebbe mai detto che un giorno avrei visto elfi e umani insieme... Come cambiano i tempi!\n@c2@"
  ja: "@a@b＊「エルフと人間が\n\t行動を　ともにしているとは\n\t時代も　変わったもんだのう。\n@c2@"
"10":
  de: "@a@b*: Hach... Rosi ist wieder zurück.\n@c2@"
  en: "@a@b*: Hurgh... Rose has come back to life.\n@c2@"
  es: "@a@b*: Uurgh... Rosa ha vuelto a la vida.\n@c2@"
  fr: "@a@b*ⓢ Snif... Rose est revenue à la vie.\n@c2@"
  it: "@a@b*: Argh... Rosa è resuscitata.\n@c2@"
  ja: "@a@b＊「うっうっ……。\n\tロザリーが生き返ったよ。\n@c2@"
"11":
  de: "@a@b*: Ich kann es noch gar nicht glauben.\n@c2@"
  en: "@a@b*: I still can't believe it's really true.\n@c2@"
  es: "@a@b*: Todavía no puedo creerlo.\n@c2@"
  fr: "@a@b*ⓢ Je n'arrive toujours pas à y croire.\n@c2@"
  it: "@a@b*: Non riesco ancora a crederci.\n@c2@"
  ja: "@a@b＊「オイラには　まだ\n\t信じられないよ。\n@c2@"
"12":
  de: "@a@b*: Aber es ist wahr. Hach!\n@c2@"
  en: "@a@b*: But it must be. Waaah!\n@c2@"
  es: "@a@b*: Pero debe ser cierto. ¡Aaah!\n@c2@"
  fr: "@a@b*ⓢ Mais c'est forcément vrai. Snif snifⓠ\n@c2@"
  it: "@a@b*: Eppure è proprio lei! Uaaah!\n@c2@"
  ja: "@a@b＊「けど　本当なんだな。\n\tうっうっ……。\n@c2@"
"13":
  de: "@a@b*: Es können doch nicht alle Menschen schlecht sein.\n@c2@"
  en: "@a@b*: It seems that not all humans are alike.\n@c2@"
  es: "@a@b*: Parece que no todos los humanos son iguales.\n@c2@"
  fr: "@a@b*ⓢ On dirait que tous les humains ne sont pas semblables.\n@c2@"
  it: "@a@b*: A quanto pare, non tutti gli umani sono uguali. Mi sembra impossibile!\n@c2@"
  ja: "@a@b＊「人間にも　いろんなヤツがいるの。\n@c2@"
"14":
  de: "@a@b*: Besonders wenn ich Euch hier vor mir sehe.\n@c2@"
  en: "@a@b*: That's all I can think when I look at you standing here before me.\n@c2@"
  es: "@a@b*: Eso es lo único en lo que puedo pensar cuando %H860%Xte%Yos%Z veo.\n@c2@"
  fr: "@a@b*ⓢ C'est tout ce à quoi je pense quand je vous vois là, devant moi.\n@c2@"
  it: "@a@b*: Eppure, a vederti qui davanti a me, mi rendo conto che è proprio così.\n@c2@"
  ja: "@a@b＊「あんたらを見ていて\n\tそう思ったわい。\n@c2@"
"15":
  de: "@a@b*: Wäre es nicht schön, wenn wir all unsere Vorurteile über Monster, Menschen und andere Wesen einfach vergessen würden?\n@c2@"
  en: "@a@b*: How lovely it would be if we could all just forget our preconceived ideas about monsters and humans and other kinds.\n@c2@"
  es: "@a@b*: Sería fantástico si todos pudiéramos olvidar nuestras ideas preconcebidas sobre humanos, monstruos y otras razas.\n@c2@"
  fr: "@a@b*ⓢ Comme ce serait bien si nous pouvions tous oublier nos idées préconçues sur les monstres, les humains et toutes les autres races.\n@c2@"
  it: "@a@b*: Sarebbe meraviglioso se riuscissimo a mettere da parte i nostri pregiudizi sui mostri, sugli umani e su tutte le altre specie...\n@c2@"
  ja: "@a@b＊「これからは　人間だから\n\t魔族だから……　というような\n\t考え方は　やめようかのう。\n@c2@"
"16":
  de: "@a@b*: Miau. Miaaau. Ich verdanke Fürst Psaro so viel...\n@c1@"
  en: "@a@b*: Meow. Meooow.\nI owe Lord Purrsaro everything...\n@c1@"
  es: "@a@b*: Miau. Miau.\nSe lo debo todo al señor Prrrrsaro.\n@c1@"
  fr: "@a@b*ⓢ Miaou. Miaouuu.\nJe dois tout au Seigneurrr Prrrsarrro. Il m'a tout donné...\n@c1@"
  it: "@a@b*: Miao!\nSono miaolto riconoscente a Lord Psaro.\n@c1@"
  ja: "@a@b＊「にゃあ　にゃあ！\n\tピサロさまに　感謝しなくっちゃ！\n@c1@"
"17":
  de: "@a@b*: Er hat das Geheimnis der Evolution perfektioniert und uns Tieren sehr geholfen.\n@c1@"
  en: "@a@b*: He purrfected the Secret of Evolution and made all usss animals more purrceptive and clever.\n@c1@"
  es: "@a@b*: Ha prrrrfeccionado el Secreto de la Evolución y nos ha hecho más prrrceptivos e inteligentes a nosotros, los animales.\n@c1@"
  fr: "@a@b*ⓢ Il a amiaoulioré le Secret de l'Évolution et a fait de nous des animaux plus prrrrerspicaces et plus intelligents.\n@c1@"
  it: "@a@b*: Ha purrrfezionato il Segreto dell'Evoluzione, e ha reso noi animali piurrr intelligenti e purrrspicaci.\n@c1@"
  ja: "@a@b＊「あたしたち　動物が　こうして\n\tしゃべれるのも　みんな\n\t進化の秘法の　おかげだにゃん。\n@c1@"
"18":
  de: "@a@b*: Rosi! Es ist wunderbar, dass du am Leben bist.\n@c1@"
  en: "@a@b*: Rose! How wonderful it is to see you alive.\n@c1@"
  es: "@a@b*: ¡Rosa! Es maravilloso verte con vida.\n@c1@"
  fr: "@a@b*ⓢ Roseⓠ C'est merveilleux de te voir en vie.\n@c1@"
  it: "@a@b*: Rosa! Che gioia rivederti!\n@c1@"
  ja: "@a@b＊「まあっ　ロザリー。\n\t生きていたのですね。\n@c1@"
"19":
  de: "@a@b*: All die Tiere hier waren so verschreckt, seit du aus dem Dorf entführt wurdest.\n@c1@"
  en: "@a@b*: The animals here have been in a terrible state since the day you were snatched away from the village.\n@c1@"
  es: "@a@b*: Los animales han vivido en un terrible estado desde que fuiste raptada y te llevaron fuera de la aldea.\n@c1@"
  fr: "@a@b*ⓢ Ici, tous les animaux sont dans un état catastrophique depuis le jour où tu as été enlevée du village.\n@c1@"
  it: "@a@b*: Dal giorno in cui sei stata portata via dal villaggio, gli animali non si sono dati più pace!\n@c1@"
  ja: "@a@b＊「あなたが　人間にさらわれてから\n\tこの村の動物たちが　みんな\n\t元気を　なくしてしまいました。\n@c1@"
"20":
  de: "@a@b*: Sie haben sich schwere Vorwürfe gemacht, weil sie dich nicht vor den Menschen schützen konnten.\n@c1@"
  en: "@a@b*: They all feel to blame for not being able to protect you from the humans.\n@c1@"
  es: "@a@b*: Se sintieron todos terriblemente culpables por no ser capaces de protegerte de los humanos.\n@c1@"
  fr: "@a@b*ⓢ Ils se sentent tous coupables de n'avoir pas su te protéger des humains.\n@c1@"
  it: "@a@b*: Si sentivano in colpa per non essere riusciti a proteggerti dagli umani.\n@c1@"
  ja: "@a@b＊「あなたを　人間から\n\t守れなかったことを\n\tみんな　なげいていたのです。\n@c1@"
"21":
  de: "@a@b*: R-Rosi! Ein Traum wird wahr, du lebst! Ich muss dir etwas sagen.\n@c2@"
  en: "@a@b*: R-Rose! It's like a dream come true seeing you alive! There's something I have to tell you.\n@c2@"
  es: "@a@b*: ¡R-Rosa! ¡Verte con vida es como un sueño hecho realidad! Tengo algo que decirte.\n@c2@"
  fr: "@a@b*ⓢ Ro... Roseⓠ\nTe voir en vie est comme un rêve devenu réalitéⓠ\nJe dois absolument te dire quelque chose.\n@c2@"
  it: "@a@b*: R-Rosa! Il sogno di rivederti viva si è finalmente avverato! Devo confessarti un segreto...\n@c2@"
  ja: "@a@b＊「ロ…ロザリーさま！\n\t生きていたとは　なにより！\n\tいえ　それより聞いてください！\n@c2@"
"22":
  de: "@a@b*: Ich weiß, was an dem Tag geschah, als du entführt wurdest.\n@c2@"
  en: "@a@b*: I know something about what happened on the day you were snatched.\n@c2@"
  es: "@a@b*: Sé algo de lo que ocurrió el día en que fuiste secuestrada.\n@c2@"
  fr: "@a@b*ⓢ Je sais quelque chose sur ce qui s'est passé le jour de ton enlèvement.\n@c2@"
  it: "@a@b*: C'è qualcosa che devi sapere riguardo al giorno in cui sei stata rapita...\n@c2@"
  ja: "@a@b＊「ぼくは　知ってるんです。\n\t人間たちが　ロザリーさまを\n\tさらった　あの日……。\n@c2@"
"23":
  de: "@a@b*: Es waren nicht die Menschen allein, die in dein Zimmer gegangen sind.\nIrgendein Monster hat sie dorthin geführt!\n@c2@"
  en: "@a@b*: The humans didn't go to your room alone.\nSome kind of monster led them there!\n@c2@"
  es: "@a@b*: Los humanos no fueron solos a tus aposentos.\n¡Una especie de monstruo les condujo hasta allí!\n@c2@"
  fr: "@a@b*ⓢ Les humains ne se sont pas rendus seuls à ta chambre. C'est une espèce de monstre qui les y a conduitsⓠ\n@c2@"
  it: "@a@b*: Quando gli umani si sono introdotti nella tua stanza non erano soli... Sono stati guidati fin lì da una specie di mostro!\n@c2@"
  ja: "@a@b＊「魔族の何者かが\n\t人間たちを　ロザリーさまの部屋へ\n\tみちびいたのです！\n@c2@"
"24":
  de: "@a@b*: (schlürf!) Ich hab da neulich was aufgeschleimt. Das könnt Euch interessieren!\n@c1@"
  en: "@a@b*: (slurp) Here's an interesting bit of ooze for you.\n@c1@"
  es: "@a@b*: (¡slurp!) Tengo una noticia limosamente interesante que dar%H860%Xte%Yos%Z.\n@c1@"
  fr: "@a@b*ⓢ (Slurpⓠ) Voilà quelque chooose qui devrait vous intéresser.\n@c1@"
  it: "@a@b*: Slurp! %H860%XAscolta%YAscoltate%Z... Slurp!\n@c1@"
  ja: "@a@b＊「ぷるぷる……。\n\tぼく　聞いちゃったんだ。\n@c1@"
"25":
  de: "@a@b*: Ich hab nämlich gehört, was Psaro an Rosis Grab geblubbert hat.\n@c1@"
  en: "@a@b*: I heard Psaro saying things at Rose's goombstone.\n@c1@"
  es: "@a@b*: Oí como Psaro hablaba en la tumba de Rosa.\n@c1@"
  fr: "@a@b*ⓢ J'ai entendu Psarooo dire des choooses devant la tombe de Rooose.\n@c1@"
  it: "@a@b*: Ho slimentito che Psaro pronunciava delle parole davanti alla lapide di Rosa.\n@c1@"
  ja: "@a@b＊「ピサロさま　ロザリーちゃんのお墓に\n\tひとりで　こう言ってたんだ。\n@c1@"
"26":
  de: "@a@b*: Er will sein Versprechen halten und nach seiner Wiedergeburt mit ihr zusammen sein. Ist das nicht schwabbelig? Will er denn auch sterben?\n@c1@"
  en: "@a@b*: He said that when he's reborn, he'll be sure to fulfil their promise to be together.\nDoes that mean he wants to die, goo?\n@c1@"
  es: "@a@b*: Decía que, cuando renaciese, se aseguraría de cumplir su promesa de estar junto a ella. Eso no querrá decir que él quiere morir también, ¿verdad?\n@c1@"
  fr: "@a@b*ⓢ Il a dit que lorsqu'il renaîtrait, il tiendrait leur prooomesse d'être ensemble. Est-ce que ça veut diiire qu'il veut mouriiir, lui aussiiiⓡ\n@c1@"
  it: "@a@b*: Ha detto che, una volta tornato in vita, avrebbe mantenuto la promessa di stare sempre insieme.\n㈡\n*: Slimegnifica forse che ha anch'egli intenzione di morire?!\n@c1@"
  ja: "@a@b＊「ふたりで暮らす約束は\n\t生まれ変わって　必ず果たすって。\n\tピサロさま　死ぬ気なのかなあ……。\n@c1@"
"27":
  de: "@a@b*: Rosi! Das ist ja unglaublich.\nIch dachte, ich würde dich nie mehr wiedersehen.\n@c1@"
  en: "@a@b*: Rose! This is incredible.\nI thought I'd never see you again.\n@c1@"
  es: "@a@b*: ¡Rosa! Esto es increíble.\nPensé que no volvería a verte jamás.\n@c1@"
  fr: "@a@b*ⓢ Roseⓠ C'est incroyable.\nJe croyais ne jamais te revoir.\n@c1@"
  it: "@a@b*: Rosa! Ma questo è un miracolo... Pensavo che non ti avrei più rivista!\n@c1@"
  ja: "@a@b＊「まあっ　ロザリー！\n\t信じられないわ。　こうして\n\tあなたと　再び会えるなんて……。\n@c1@"
"28":
  de: "@a@b*: Es gibt also doch noch Hoffnung für die Menschheit.\n@c1@"
  en: "@a@b*: It looks like there's still hope for humans after all.\n@c1@"
  es: "@a@b*: Parece que, después de todo, aún hay esperanza para los humanos.\n@c1@"
  fr: "@a@b*ⓢ On dirait que tout espoir n'est pas perdu pour les humains, finalement.\n@c1@"
  it: "@a@b*: Sembra proprio che non tutti gli esseri umani siano cattivi.\n@c1@"
  ja: "@a@b＊「人間たちも　まだまだ\n\t捨てたものでは　ありませんね。\n@c1@"
"29":
  de: "@a@bEine mysteriöse Macht erweckt Fünkchen wieder zum Leben!\n@c0@"
  en: "@a@bA mysterious force brings Sparkie back to life!\n@c0@"
  es: "@a@b¡Una fuerza misteriosa devuelve a Sparkie a la vida!\n@c0@"
  fr: "@a@bUne force mystérieuse ramène Braséro à la vieⓠ\n@c0@"
  it: "@a@bUna forza misteriosa riporta in vita Scyntill!\n@c0@"
  ja: "@a@b不思議なチカラが　はたらき\nなんと　ドランが生き返った！\n@c0@"
"30":
  de: "@aFünkchen@bGrrruuu! Grrruuuuu!\n@c2@"
  en: "@aSparkie@bGrrrooo! Grrroooooo!\n@c2@"
  es: "@aSparkie@b¡Grrrooo! ¡Grrroooooo!\n@c2@"
  fr: "@aBraséro@bGrrroooⓠ Grrrooooooⓠ\n@c2@"
  it: "@aScyntill@bGrrruuu! Grrruuuuuu!\n@c2@"
  ja: "@a@bドラン「グゴゴーン！\n\tグゴゴゴゴーン！！\n@c2@"
"31":
  de: "@aRosi@bWie war das? Oh...\n@c1@"
  en: "@aRose@bWhat was that? Oh...\n@c1@"
