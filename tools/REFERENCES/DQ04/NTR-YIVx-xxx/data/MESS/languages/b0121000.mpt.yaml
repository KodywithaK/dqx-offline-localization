"0":
  de: "@a@b*: Na, sieh einer an... %H860%XEin Mensch%YMenschen%Z! Es ist schon eine Weile her, dass Menschen hier waren.\n@c1@"
  en: "@a@b*: Well, well, well... %H860%XA human%YHumans%Z!\nItⓙs been a long time since any humans came here.\n@c1@"
  es: "@a@b*: Vaya, vaya, vaya... ¡%H860%X%A120%XUn humano%Z%B120%XUna humana%Z%YHumanos%Z!\nHace mucho tiempo que no viene ningún humano por aquí.\n@c1@"
  fr: "@a@b*ⓢ Tiens, tiens, tiens... %H860%Xun être humain%Ydes humains%Zⓠ\nCela fait bien longtemps que je n'avais pas vu un représentant de votre race.\n@c1@"
  it: "@a@b*: Bene, bene... %H860%XUn umano%YDegli umani%Z!\nEra da tanto tempo che non si vedevano esseri umani da queste parti.\n@c1@"
  ja: "@a@b＊「あら　この村に\n\t人間がやってくるなんて\n\tめずらしいわね。\n@c1@"
"1":
  de: "@a@b*: Willkommen in El Forado.\n@c1@"
  en: "@a@b*: Welcome to El Forado.\n@c1@"
  es: "@a@b*: %H860%X%A120%XBienvenido%Z%B120%XBienvenida%Z%Y%R000%XBienvenidas%YBienvenidos%Z%Z a El Forrado.\n@c1@"
  fr: "@a@b*ⓢ Bienvenue à El Forado.\n@c1@"
  it: "@a@b*: %H860%X%A120%XBenvenuto%Z%B120%XBenvenuta%Z%Y%R000%XBenvenute%YBenvenuti%Z%Z a El Forado.\n@c1@"
  ja: "@a@b＊「ここは　エルフの里よ。\n@c1@"
"2":
  de: "@a@b*: Grrr-rff! Der große Baum hier ist der Weltenbaum Yggdrasil.\n@c2@"
  en: "@a@b*: Grrr-ruff! The big tree here is the Great World Tree, Yggdrasil.\n@c2@"
  es: "@a@b*: ¡Grrr-ruff! El árbol grande es el Gran Árbol del Mundo, Yggdrasil.\n@c2@"
  fr: "@a@b*ⓢ Grrr ououffⓠ Cet arbre gigantesque est l'Yggdrasil, le Grand arbre du Monde.\n@c2@"
  it: "@a@b*: Grrr-ruff! Questo è Ygdrasil, il Grande Albero del mondo.\n@c2@"
  ja: "@a@b＊「こんこん。\n\tこの村にある　大木は\n\t世界樹だよ。\n@c2@"
"3":
  de: "@a@b*: Miau...\nYggdrasil spendet genug Schatten für alle. Genau richtig für ein kleines Nickerchen...\n@c1@"
  en: "@a@b*: Meow...\nYggdrasil gives enough shade for everyone.\nJust right for catnapping...\n@c1@"
  es: "@a@b*: Miau...\nYggdrasil proporciona cobijo a todo el mundo.\nPerrrfecto para una siesta gatuna...\n@c1@"
  fr: "@a@b*ⓢ Miaouu...\n㈡\n*ⓢ L'Yggdrasil fait suffisamment d'ombre pour que tout le monde en profite... pour faire une sieste, par exemple...\n@c1@"
  it: "@a@b*: Miao...\nYgdrasil è abbastanza grande da far ombra a tutti.\nÈ l'ideale purrr schiacciare un pisolino...\n@c1@"
  ja: "@a@b＊「にゃーん。\n\t世界樹の木かげは\n\tすずしくて　きもちいいニャー。\n@c1@"
"4":
  de: "@a@b*: Diese Monster heutzutage!\nSie belästigen sogar schon Yggdrasil. Nein, nirgendwo kann man mehr sicher sein...\n@c3@"
  en: "@a@b*: The monsters of today!\nTheyⓙre even infesting Yggdrasil these days.\nNope. Nowhereⓙs safe any more...\n@c3@"
  es: "@a@b*: ¡Los monstruos de hoy!\nEn estos días incluso infestan Yggdrasil.\nNo. Ya no hay ningún lugar seguro...\n@c3@"
  fr: "@a@b*ⓢ Ah les monstres d'aujourd'huiⓠ\nIls envahissent même l'Yggdrasil.\nVraiment, il n'y a plus d'endroit sûr de nos jours...\n@c3@"
  it: "@a@b*: Ah, questi mostri di oggi!\nInfestano persino Ygdrasil ultimamente. Non c'è niente da fare, non si sta tranquilli da nessuna parte...\n@c3@"
  ja: "@a@b＊「近ごろ　世界樹にも\n\t魔物たちが　住みつきだしてのう。\n\tぶっそうな世の中じゃわい……。\n@c3@"
"5":
  de: "@a@b*: Die Krone von Yggdrasil besteht aus dichtem Blattwerk. Und bei diesen Blättern handelt es sich um... Yggdrasil-Blätter.\n@c1@"
  en: "@a@b*: The top of Yggdrasil is thick with leaves. Yggdrasil leaves.\n@c1@"
  es: "@a@b*: La copa de Yggdrasil está repleta de hojas, hojas de Yggdrasil.\n@c1@"
  fr: "@a@b*ⓢ La cime de l'Yggdrasil est pleine de feuilles... des feuilles d'Yggdrasil.\n@c1@"
  it: "@a@b*: La cima di Ygdrasil è piena di foglie. Foglie di Ygdrasil, ovviamente.\n@c1@"
  ja: "@a@b＊「この樹の上には　多くの\n\t世界樹の葉が　しげっています。\n@c1@"
"6":
  de: "@a@b*: Sie sind wirklich sehr nützlich, man sollte immer welche bei sich tragen.\n@c1@"
  en: "@a@b*: Theyⓙre very useful to have on you.\nVery, very useful indeed.\n@c1@"
  es: "@a@b*: Es muy útil llevarlas.\nExtremadamente útil.\n@c1@"
  fr: "@a@b*ⓢ Elles peuvent être très utiles.\nTrès très utiles, même.\n@c1@"
  it: "@a@b*: Sono delle foglie utili.\nAnzi, utilissime.\n@c1@"
  ja: "@a@b＊「世界樹の葉を　持っていれば\n\tきっと　役に立つことでしょう。\n@c1@"
"7":
  de: "@a@b*: Ich höre eine Stimme aus der Krone Yggdrasils. Was das wohl ist?\n@c1@"
  en: "@a@b*: I can hear a voice at the top of Yggdrasil.\nI wonder what it is...\n@c1@"
  es: "@a@b*: Escucho una voz en lo alto de Yggdrasil.\nMe pregunto qué será...\n@c1@"
  fr: "@a@b*ⓢ J'entends une voix qui vient de la cime de l'Yggdrasil. Je me demande ce que ça peut être...\n@c1@"
  it: "@a@b*: Mi pare di sentire una voce che proviene dalla cima di Ygdrasil.\nChissà di cosa si tratta...\n@c1@"
  ja: "@a@b＊「なにかしら……？\n\t樹の上のほうから　声が聞こえるわ。\n@c1@"
"8":
  de: "@a@b*: Wir Elfen haben ein sehr gutes Gehör, wisst Ihr.\n@c1@"
  en: "@a@b*: We elves hear extremely well, you know.\n@c1@"
  es: "@a@b*: Los elfos tenemos un oído muy fino, ya %H860%Xsabes%Ysabéis%Z.\n@c1@"
  fr: "@a@b*ⓢ Nous, les elfes, nous avons l'ouïe extrêmement fine.\n@c1@"
  it: "@a@b*: Noi elfi abbiamo un udito molto sviluppato.\n@c1@"
  ja: "@a@b＊「わたしたちエルフは\n\tとっても　耳がいいのよ。\n@c1@"
"9":
  de: "@a@b*: Ich glaube, da ruft jemand um Hilfe...\n@c1@"
  en: "@a@b*: Someoneⓙs calling for help, I think...\n@c1@"
  es: "@a@b*: Alguien está pidiendo ayuda, creo...\n@c1@"
  fr: "@a@b*ⓢ La voix appelle à l'aide. Enfin, j'ai l'impression...\n@c1@"
  it: "@a@b*: Credo che qualcuno stia chiedendo aiuto...\n@c1@"
  ja: "@a@b＊「どうやら\n\t助けを　求めているみたい。\n@c1@"
"10":
  de: "@a@b*: Ja. Es wird nach drei Leuten verlangt, die helfen sollen. Aber nur drei, nicht mehr!\n@c1@"
  en: "@a@b*: Yes. It sounds like they're asking for three people to come to their aid. But only three, mind. No more!\n@c1@"
  es: "@a@b*: Sí. Parece que piden tres personas que acudan en su ayuda. Pero solo tres. ¡Ni una más!\n@c1@"
  fr: "@a@b*ⓢ C'est çaⓠ On dirait qu'elle demande que quelqu'un vienne l'aider. Il est question d'ailes... mais vous connaissez des oiseaux qui appellent à l'aide, vousⓠⓑ\n@c1@"
  it: "@a@b*: Sì. Qualcuno sta chiedendo che tre persone vadano in suo soccorso. Solo tre, non una di più!\n@c1@"
  ja: "@a@b＊「でも　もし　助けに来るなら\n\t３人で　来てって　聞こえるわ……。\n@c1@"
"11":
  de: "@a@b%0%a00120 prüft den Boden zu %A120%Xseinen%Z%B120%Xihren%Z Füßen.\n@c0@"
  en: "@a@b%0%a00120 examines the ground at %A120%Xhis%Z%B120%Xher%Z feet.\n@c0@"
  es: "@a@b%0%a00120 examina el suelo alrededor de sus pies.\n@c0@"
  fr: "@a@b%0%a00120 examine le sol devant %A120%Xlui%Z%B120%Xelle%Z.\n@c0@"
  it: "@a@b%0%a00120 esamina il terreno ai suoi piedi...\n@c0@"
  ja: "@a@b%a00120は　足もとを　調べた！\n@c0@"
"12":
  de: "@a@b%A120%XEr%Z%B120%XSie%Z findet ein Yggdrasil-Blatt!\n@c0@"
  en: "@a@b%A120%XHe%Z%B120%XShe%Z finds an Yggdrasil leaf!\n@c0@"
  es: "@a@bEncuentra una hoja de Yggdrasil.\n@c0@"
  fr: "@a@b%A120%XIl%Z%B120%XElle%Z trouve une feuille d'Yggdrasilⓠ\n@c0@"
  it: "@a@b%0%a00180 trova una foglia di Ygdrasil!\n@c0@"
  ja: "@a@bなんと　せかいじゅの葉を　みつけた！\n@c0@"
"13":
  de: "@a@b%0%a00180 erhält das Yggdrasil-Blatt.\n@c0@"
  en: "@a@b%0%a00180 acquires the Yggdrasil leaf.\n@c0@"
  es: "@a@b%0%a00180 se hace con la hoja de Yggdrasil.\n@c0@"
  fr: "@a@b%0%a00180 obtient la feuille d'Yggdrasil.\n@c0@"
  it: "@a@b%0%a00180 ottiene la foglia di Ygdrasil.\n@c0@"
  ja: "@a@b%a00180は\nせかいじゅの葉を　手に入れた。\n@c0@"
"14":
  de: "@a@b%0%a00120 prüft den Boden zu %A120%Xseinen%Z%B120%Xihren%Z Füßen.\n@c0@"
  en: "@a@b%0%a00120 examines the ground at %A120%Xhis%Z%B120%Xher%Z feet.\n@c0@"
  es: "@a@b%0%a00120 examina el suelo alrededor de sus pies.\n@c0@"
  fr: "@a@b%0%a00120 examine le sol devant %A120%Xlui%Z%B120%Xelle%Z.\n@c0@"
  it: "@a@b%0%a00120 esamina il terreno ai suoi piedi...\n@c0@"
  ja: "@a@b%a00120は　足もとを　調べた！\n@c0@"
"15":
  de: "@a@b%A120%XEr%Z%B120%XSie%Z findet ein Yggdrasil-Blatt!\n@c0@"
  en: "@a@b%A120%XHe%Z%B120%XShe%Z finds an Yggdrasil leaf!\n@c0@"
  es: "@a@bEncuentra una hoja de Yggdrasil.\n@c0@"
  fr: "@a@b%A120%XIl%Z%B120%XElle%Z trouve une feuille d'Yggdrasilⓠ\n@c0@"
  it: "@a@b%0%a00180 vede una foglia di Ygdrasil!\n@c0@"
  ja: "@a@bなんと　せかいじゅの葉を　みつけた！\n@c0@"
"16":
  de: "@a@bAber %A120%Xer%Z%B120%Xsie%Z kann kein Blatt mehr aufheben.\n@c0@"
  en: "@a@bThe floor is covered with Yggdrasil leaves, but the party can only carry one at a time!\n@c0@"
  es: "@a@bPero no puede recoger ninguna hoja.\n@c0@"
  fr: "@a@bMais il n'est possible de transporter qu'une seule feuille à la fois.\n@c0@"
  it: "@a@bMa non può raccogliere altre foglie, perché può portarne una sola per volta.\n@c0@"
  ja: "@a@bしかし　せかいじゅの葉は　ぬけなかった！\n@c0@"
"17":
  de: "@a@b*: B-Bitte... So helft mir doch... Habt Mitleid mit den Schwachen...\n@c1@"
  en: "@a@b*: P-Please... Someone...\nBlessed is he who aideth the weak...\n@c1@"
  es: "@a@b*: Por favor... Alguien...\nBendito sea quien ayude al débil...\n@c1@"
  fr: "@a@b*ⓢ Je vous en prie... Quelqu'un...\nBéni soit celui qui vient en aide aux faibles...\n@c1@"
  it: "@a@b*: P-Per favore... Aiuto...\nLa dea sarà grata a chi aiuta un'anima in difficoltà...\n@c1@"
  ja: "@a@b＊「ああ……　おねがい。\n\tだれか助けて！\n@c1@"
"18":
  de: "@a@b*: Ich weiß nicht, wer Ihr seid, aber... so helfet mir doch!\n@c1@"
  en: "@a@b*: I know not who you are, but please...\nHelp me!\n@c1@"
  es: "@a@b*: No sé %H860%Xquién es%Yquiénes sois%Z, pero por favor...\n¡Ayuda!\n@c1@"
  fr: "@a@b*ⓢ Je ne sais pas qui vous êtes, mais s'il vous plait...\nAidez-moiⓠ\n@c1@"
  it: "@a@b*: Non so chi %H860%Xsei%Ysiete%Z, ma %H860%Xti%Yvi%Z scongiuro...\n%H860%XAiutami%YAiutatemi%Z!\n@c1@"
  ja: "@a@b＊「どなたかは　ぞんじませんが\n\tどうか　助けてください！\n@c1@"
"19":
  de: "@a@b*: Ich flehe Euch an.\nHelft mir.\n@c1@"
  en: "@a@b*: I beseech thee.\nPlease, help me.\n@c1@"
  es: "@a@b*: %H860%XTe%YOs%Z lo imploro.\nPor favor, ayuda.\n@c1@"
  fr: "@a@b*ⓢ Je vous implore.\nAidez-moi.\n@c1@"
  it: "@a@b*: %H860%XTi%YVi%Z supplico di aiutarmi.\n@c1@"
  ja: "@a@b＊「どうか　どうか\n\tお助けください。\n@c1@"
"20":
  de: "@a@b*: Orifiela ist mein Name. Ich stieg aus Zenithia hinab, um die Blätter des Großen Weltenbaumes, Yggdrasil, zu pflücken.\n@c1@"
  en: "@a@b*: My name is Orifiela. I descended from Zenithia for to pick the leaves of the Great World Tree, Yggdrasil.\n@c1@"
  es: "@a@b*: Mi nombre es Orifiela. Un aciago día descendí de Zenithia para recoger hojas del Gran Árbol del Mundo, Yggdrasil.\n@c1@"
  fr: "@a@b*ⓢ Je m'appelle Orifiela. Je suis descendue de Zénithia pour prendre quelques feuilles du Grand arbre du Monde, l'Yggdrasil.\n@c1@"
  it: "@a@b*: Mi chiamo Orifiela. Sono scesa da Zenithia per raccogliere delle foglie di Ygdrasil, il Grande Albero del mondo.\n@c1@"
  ja: "@a@b＊「わたしは　ルーシア\n\t天空より　世界樹の葉を　つみに\n\t舞い降りてきたのですが……。\n@c1@"
"21":
  de: "@aOrifiela@bDoch dann überfiel mich eine Schar von Monstern, und ich fürchte, dass wohl einer meiner Flügel gebrochen ist.\n@c1@"
  en: "@aOrifiela@bBut I was attacked by monsters, and I fear that one of my wings is broken.\n@c1@"
  es: "@aOrifiela@bPero fui atacada por unos monstruos y mucho me temo que tengo un ala rota.\n@c1@"
  fr: "@aOrifiela@bMais j'ai été attaquée par des monstres et je crains qu'ils ne m'aient cassé une aile.\n@c1@"
  it: "@aOrifiela@bMa sono stata attaccata da alcuni mostri, e temo di avere un'ala spezzata.\n@c1@"
  ja: "@a@bルーシア「魔物たちに　おそわれ\n\tつばさを　折られてしまいました。\n@c1@"
"22":
  de: "@aOrifiela@bSeid Ihr gewillt, mir zu helfen, wieder in das Himmelsreich aufzusteigen? Mögt Ihr mich nach Zenithia begleiten? \n@c1@"
  en: "@aOrifiela@bWilt thou aid me in my quest to return to my haven? Wilt thou deliver me to Zenithia?\n@c1@"
  es: "@aOrifiela@b¿Me %H860%Xayudará%Yayudarán%Z en mi camino de regreso a mi hogar? ¿Me %H860%Xllevará%Yllevarán%Z a Zenithia?\n@c1@"
  fr: "@aOrifiela@bM'aiderez-vous à rentrer chez moiⓡ\nMe porterez-vous jusqu'à Zénithiaⓡ\n@c1@"
  it: "@aOrifiela@bMi %H860%Xaiuteresti%Yaiutereste%Z a tornare a casa mia? Mi %H860%Xriporteresti%Yriportereste%Z a Zenithia?\n@c1@"
  ja: "@a@bルーシア「わたしを　天空のお城まで\n\tつれもどしてはくれませんか？\n@c1@"
"23":
  de: "@aOrifiela@bDas seid Ihr?\n@c1@"
  en: "@aOrifiela@bYou will?\n@c1@"
  es: "@aOrifiela@b¿Lo %H860%Xhará%Yharán%Z?\n@c1@"
  fr: "@aOrifiela@bC'est vraiⓡ\n@c1@"
  it: "@aOrifiela@bSul serio?\n@c1@"
  ja: "@a@bルーシア「まあ！\n\t連れていって　くださるのですね！\n@c1@"
"24":
  de: "@aOrifiela@bAber ach, Eure Gruppe ist zu groß.\n@c1@"
  en: "@aOrifiela@bBut alas, your party is already full.\n@c1@"
  es: "@aOrifiela@bLamentablemente, su grupo ya está completo.\n@c1@"
  fr: "@aOrifiela@bMalheureusement, votre équipe est déjà au complet.\n@c1@"
  it: "@aOrifiela@bPurtroppo, il %H860%Xtuo%Yvostro%Z gruppo è al completo.\n@c1@"
  ja: "@a@bルーシア「でも　あなたたちは\n\t今は　仲間が　いっぱいのようです。\n@c1@"
"25":
  de: "@aOrifiela@bIch werde demütig hier warten und beten, dass Ihr zurückkehren und mich mit Euch nehmen möget.\n@c1@"
  en: "@aOrifiela@bI shall await your return in patient recumbence, at which time I pray that you are able to take me with you.\n@c1@"
  es: "@aOrifiela@bEsperaré aquí pacientemente a que regresen, momento en el que confío puedan llevarme.\n@c1@"
  fr: "@aOrifiela@bJe vais patiemment attendre votre retour ici et j'espère de tout mon cœur que vous pourrez me prendre avec vous à ce moment-là.\n@c1@"
  it: "@aOrifiela@bAttenderò pazientemente il %H860%Xtuo%Yvostro%Z ritorno, e pregherò affinché %H860%Xtu possa%Yvoi possiate%Z riportarmi a casa.\n@c1@"
  ja: "@a@bルーシア「わたしを　連れて行けるように\n\tなるまで　ここで　待っていますわ。\n@c1@"
"26":
  de: "@aOrifiela@bDas seid Ihr?\n@c1@"
  en: "@aOrifiela@bYou will?\n@c1@"
  es: "@aOrifiela@b¿Lo %H860%Xhará%Yharán%Z?\n@c1@"
  fr: "@aOrifiela@bC'est vraiⓡ\n@c1@"
  it: "@aOrifiela@bDavvero?\n@c1@"
  ja: "@a@bルーシア「まあ！\n\t連れていって　くださるのですね！\n@c1@"
"27":
  de: "@aOrifiela@bUm die Treppe nach Zenithia erklimmen zu können, müsst Ihr im Besitz der gesamten Zenithia-Ausrüstung sein.\n@c1@"
  en: "@aOrifiela@bTo take the Stairway to Zenithia, thou must have in thy possession all of the Zenithian Equipment.\n@c1@"
  es: "@aOrifiela@bPara tomar la Escalera a Zenithia, %H860%Xdebe%Ydeben%Z estar en posesión de todo el Equipo de Zenithia.\n@c1@"
  fr: "@aOrifiela@bPour emprunter les Marches de Zénithia, vous devez disposer de l'Équipement zénithien.\n@c1@"
  it: "@aOrifiela@bPer salire la Scala per Zenithia bisogna essere in possesso di tutto l'Equipaggiamento Zenithiano.\n@c1@"
  ja: "@a@bルーシア「天空への塔に　入るには\n\tすべての　天空の武器　防具を\n\t手に入れなければ　なりません。\n@c1@"
"28":
  de: "@aOrifiela@bDas Zenithiaschwert, welches Euch noch fehlt, liegt im Geäst dieses Baumes verborgen. Ich kann es fühlen...\n@c1@"
  en: "@aOrifiela@bThe Zenithian Sword, that which you are lacking, lies here in the branches of this very tree. I sense it...\n@c1@"
  es: "@aOrifiela@bLa Espada de Zenithia, de la que %H860%Xcarece%Ycarecen%Z, se encuentra entre las ramas de este mismo árbol... Puedo sentirla...\n@c1@"
  fr: "@aOrifiela@bL'Épée zénithienne qui vous manque se trouve dans les branches de cet arbre. Je le sens...\n@c1@"
  it: "@aOrifiela@bTra le fronde di quest'albero si trova la Spada Zenithiana, un oggetto che %H860%Xti%Yvi%Z è indispensabile.\n@c1@"
  ja: "@a@bルーシア「わたしには　わかります。\n\t天空のつるぎは　この樹のどこか……。\n\tすぐ近くに　眠っているようです。\n@c1@"
"29":
  de: "@aOrifiela@bKommt, wir werden es holen.\n@c1@"
  en: "@aOrifiela@bCome, let us leave to find it.\n@c1@"
  es: "@aOrifiela@bAdelante, partamos en su busca.\n@c1@"
  fr: "@aOrifiela@bAllons la chercher ensemble.\n@c1@"
  it: "@aOrifiela@bAvanti, andiamo a cercarla.\n@c1@"
  ja: "@a@bルーシア「さあ　まいりましょう。\n@c1@"
"30":
  de: "@a@bOrifiela schließt sich der Gruppe an!\n@c1@"
  en: "@a@bOrifiela joins the party!\n@c1@"
  es: "@a@bOrifiela se une al grupo.\n@c1@"
  fr: "@a@bOrifiela rejoint l'équipeⓠ\n@c1@"
  it: "@a@bOrifiela si unisce al gruppo!\n@c1@"
  ja: "@a@bルーシアが　仲間にくわわった！\n@c1@"
"31":
  de: "@aOrifiela@bIhr denkt, dass es absurd ist, nach Zenithia zu gehen?\n@c1@"
