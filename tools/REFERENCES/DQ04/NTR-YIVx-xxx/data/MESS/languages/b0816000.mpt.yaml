  ja: "@a@b＊「%a00060は　何か　しあわせな\n\t経験を　つんだようですね。\n@c2@"
"17":
  de: "@a@b*: Ich hege keinerlei Zweifel, dass Ihr nach Eurem nächsten Kampf in den Genuss der entsprechenden Vorteile kommen werdet!\n@c2@"
  en: "@a@b*: I have no doubt you will enjoy the benefits of that experience after your next battle.\n@c2@"
  es: "@a@b*: No dudo que recogerás los beneficios de esa experiencia después de tu próximo combate.\n@c2@"
  fr: "@a@b*ⓢ Il ne fait aucun doute que vous récolterez les fruits de cette progression lors de votre prochain combat.\n@c2@"
  it: "@a@b*: Ascolta le mie parole: dopo la prossima battaglia, godrai dei meravigliosi benefici di tale esperienza!\n@c2@"
  ja: "@a@b＊「一度　魔物と戦えば\n\tそのしあわせが\n\t実を　むすぶことでしょう。\n@c2@"
"18":
  de: "@a@b*: %0%a00060, mein Kind!\nIhr benötigt %a00080 Erfahrungspunkt%H080%X%Ye%Z, um die nächste Stufe zu erreichen.\n@c2@"
  en: "@a@b*: Faithful servant %a00060.\nThe almighty one declares you need %a00080 experience point%H080%X%Ys%Z to reach the next level.\n@c2@"
  es: "@a@b*: Fiel, %a00060.\nLa Diosa me dice que necesitas %a00080 punto%H080%X%Ys%Z de experiencia para alcanzar el siguiente nivel.\n@c2@"
  fr: "@a@b*ⓢ %0%a00060, mon enfantⓠ\nVous avez besoin de %a00080 point%I080%X%Ys%Z d'expérience pour passer au niveau supérieur.\n@c2@"
  it: "@a@b*: %0%a00060, %A060%Xfratello%Z%B060%Xsorella%Z%C060%X%Z!\nNecessiti di %a00080 %H080%Xpunto%Ypunti%Z di esperienza per passare al livello successivo.\n@c2@"
  ja: "@a@b＊「%a00060よ。\n\tあと%a00080の経験で\n\t次のレベルに　なるでしょう。\n@c2@"
"19":
  de: "@a@b*: Wen soll die Göttin für Euch in die Welt der Lebenden zurückholen?\n@c2@"
  en: "@a@b*: Whom shall we ask the Goddess to return to the world of the living?\n@c2@"
  es: "@a@b*: ¿A quién queremos que devuelva la Diosa al mundo de los vivos?\n@c2@"
  fr: "@a@b*ⓢ Qui la Déesse doit-elle ramener dans le monde des vivantsⓡ\n@c2@"
  it: "@a@b*: Quale componente del gruppo desideri che io riporti nel mondo dei viventi?\n@c2@"
  ja: "@a@b＊「どなたを　この世へ\n\t呼びもどして　ほしいのですか？\n@c2@"
"20":
  de: "@a@b*: Wenn Ihr gestattet... Um meine Aufgabe zu erfüllen, benötige ich einen kleinen Betrag von %a00650 Goldmünzen. Wenn Ihr so gut wärt...?\n@c2@"
  en: "@a@b*: If I may... In order to perform this task, I shall require a small contribution of %a00650 gold coins. Can you oblige me?\n@c2@"
  es: "@a@b*: Si me %H860%Xpermites%Ypermitís%Z... Para poder efectuar esta tarea, necesito un pequeño donativo de %a00650 monedas de oro. ¿%H860%XTe%YOs%Z parece adecuado?\n@c2@"
  fr: "@a@b*ⓢ Si je puis me permettre... Pour accomplir cette tâche, je dois vous demander un modeste tribut de %a00650 pièces d'or.\n㈡\n*ⓢ Auriez-vous l'obligeance de vous en acquitterⓡ\n@c2@"
  it: "@a@b*: Per eseguire questo rito sacro, chiedo un obolo di %a00650 monete d'oro. Vuoi offrire questa somma, %A120%Xfratello%Z%B120%Xsorella%Z?\n@c2@"
  ja: "@a@b＊「それでは　わが教会に\n\t%a00650ゴールドの　ご寄付を。\n\tよろしいですか？\n@c2@"
"21":
  de: "@a@b*: Oh Göttin des Lichtes!\nGroße und gnädige Hirtin!\n@c2@"
  en: "@a@b*: O Goddess of light!\nOur great and benevolent shepherdess!\n@c2@"
  es: "@a@b*: ¡Oh, Diosa de la luz!\n¡Nuestra magna y compasiva pastora!\n@c2@"
  fr: "@a@b*ⓢ Ô Déesse de la lumièreⓠ\nNotre grande et bienveillante bergèreⓠ\n@c2@"
  it: "@a@b*: O dea grande e benevola...\nO pastora del tuo gregge terrestre...\n@c2@"
  ja: "@a@b＊「ああ　わが主よ！\n\t全知全能の神よ！\n@c2@"
"22":
  de: "@a@b*: Wenn es dein Wille ist, bring bitte %A180%Xdeinen treuen Diener%Z%B180%Xdeine treue Dienerin%Z%C180%X%Z %a00180 in diese Welt zurück!\n@c2@"
  en: "@a@b*: If it is your will, please bring your faithful servant, %a00180, back to this world!\n@c2@"
  es: "@a@b*: ¡Si es tu voluntad, trae a %A180%Xnuestro fiel siervo%Z%B180%Xnuestra fiel sierva%Z%C180%X%Z %a00180 de vuelta a este mundo!\n@c2@"
  fr: "@a@b*ⓢ Si telle est votre volonté, ramenez dans ce monde notre fidèle %a00180ⓠ\n@c2@"
  it: "@a@b*: Permetti %A180%Xal nostro amato fratello%Z%B180%Xalla nostra amata sorella%Z%C180%X%Z %a00180 di tornare nel mondo dei viventi!\n@c2@"
  ja: "@a@b＊「忠実なる　神のしもべ\n\t%a00180の　みたまを\n\tどうぞ　ここに　よびもどしたまえ！\n@c2@"
"23":
  de: "@a@b%0%a00180 ist wiederauferstanden!\n@c0@"
  en: "@a@b%0%a00180 is resurrected!\n@c0@"
  es: "@a@b¡%0%a00180 ha resucitado!\n@c0@"
  fr: "@a@b%0%a00180 est revenu%A180%X%Z%B180%Xe%Z%C180%X%Z à la vieⓠ\n@c0@"
  it: "@a@b%0%a00180 torna in vita!\n@c0@"
  ja: "@a@b%a00180は　よみがえった！\n@c0@"
"24":
  de: "@a@b*: Ich fürchte, ich habe um mehr gebeten, als Ihr entbehren könnt.\n@c2@"
  en: "@a@b*: I'm afraid I seem to have asked for more than you can part with.\n@c2@"
  es: "@a@b*: Me temo que he pedido más de lo que %H860%Xpuedes%Ypodéis%Z permitir%H860%Xte%Yos%Z.\n@c2@"
  fr: "@a@b*ⓢ Je crains de vous avoir demandé bien plus que vous ne pouvez donner.\n@c2@"
  it: "@a@b*: Temo che tu non possa donare il contributo che ti ho chiesto.\n@c2@"
  ja: "@a@b＊「ざんねんですが\n\tお金が　たりないようですわ。\n\tああ　神よ　おゆるしください！\n@c2@"
"25":
  de: "@a@b*: Vergib mir, oh Göttin, dass ich zu viel von %H860%Xdiesem%Ydiesen%Z verirrten Schäflein verlangt habe!\n@c2@"
  en: "@a@b*: Forgive me, O Goddess, for asking too much of %H860%Xthis%Ythese%Z poor lost sheep!\n@c2@"
  es: "@a@b*: ¡Perdóname, Diosa, por pedir demasiado de %H860%Xesta pobre oveja descarriada%Yestas pobres ovejas descarriadas%Z!\n@c2@"
  fr: "@a@b*ⓢ Pardonnez-moi, ô Déesse, d'exiger trop de %H860%Xcette pauvre brebis égarée%Yces pauvres brebis égarées%Zⓠ\n@c2@"
  it: "@a@b*: O dea onnipotente, perdonami per aver chiesto troppo a questa tua pecorella!\n@c2@"
  ja: "@a@b＊「このような　まずしいお方に\n\t無理な　ご寄付を　たのんだ\n\t私が　いけなかったのです！\n@c2@"
"26":
