"0":
  de: "@a@b*: Verirrtes Schäflein der großen Hirtin, willkommen in diesem Haus der Göttin.\nWie können wir Euch helfen?\n@c2@"
  en: "@a@b*: Wayward sheep of the great shepherdess, welcome to this house of the Goddess.\nHow may we help you?\n@c2@"
  es: "@a@b*: %H860%XOveja descarriada%YOvejas descarriadas%Z de la gran pastora de los cielos, %H860%Xte%Yos%Z doy la bienvenida a esta casa de la Diosa.\n¿Puedo ser%H860%Xte%Yos%Z de utilidad?\n@c2@"
  fr: "@a@b*ⓢ Brebis capricieuse de la grande bergère, bienvenue dans la maison de la Déesse.\nQue puis-je faire pour vousⓡ\n@c2@"
  it: "@a@b*: %H860%XTi porgo il benvenuto nella casa della dea, fedele pecorella%YVi porgo il benvenuto nella casa della dea, fedeli pecorelle%Z del suo gregge. Cosa posso fare per %H860%Xte%Yvoi%Z?\n@c2@"
  ja: "@a@b＊「神にみちびかれし　迷える子羊よ\n\tようこそ　わが教会へ。\n\tご用は　なんでしょう？\n@c2@"
"1":
  de: "@a@b*: Willkommen in diesem Haus der Göttin.\nWie kann ich Euch zu dieser späten Stunde helfen?\n@c2@"
  en: "@a@b*: Welcome to this house of the Goddess.\nHow may I assist you at such a late hour?\n@c2@"
  es: "@a@b*: %H860%XTe%YOs%Z doy la bienvenida a esta casa de la Diosa.\n¿Qué puedo hacer por %H860%Xti%Y%R000%Xvosotras%Yvosotros%Z%Z en esta tardía hora?\n@c2@"
  fr: "@a@b*ⓢ Bienvenue dans la maison de la Déesse.\nQue puis-je faire pour vous à cette heure si tardiveⓡ\n@c2@"
  it: "@a@b*: %A120%XBenvenuto%Z%B120%XBenvenuta%Z nella dimora della dea. Cosa ti porta qui a un'ora tanto tarda?\n@c2@"
  ja: "@a@b＊「まあ！　このような夜更けに\n\tようこそ　わが教会へ。\n\tご用は　なんでしょう？\n@c2@"
"2":
  de: "@a@b*: Bitte bekennt der großen und gütigen Göttin sowohl Eure Sünden als auch Eure guten Taten.\n@c2@"
  en: "@a@b*: Please declare both your sins and high achievements before the great and benevolent Goddess.\n@c2@"
  es: "@a@b*: Por favor, %H860%Xconfiésalo%Yconfesadlo%Z todo ante la magna y benévola Diosa, %H860%Xtus%Yvuestras%Z mayores hazañas y también %H860%Xtus%Yvuestros%Z pecados.\n@c2@"
  fr: "@a@b*ⓢ Veuillez faire part de vos péchés et de vos hauts faits à la grande et bienveillante Déesse.\n@c2@"
  it: "@a@b*: Confessa alla dea onnipotente i tuoi peccati e le tue imprese, %A120%Xfratello%Z%B120%Xsorella%Z.\n@c2@"
  ja: "@a@b＊「では　神の前に\n\tこれまでの　おこないを\n\t告白なさい。\n@c2@"
"3":
  de: "@a@b*: Darf ich Euer Wirken in einem Abenteuertagebuch verzeichnen?\n@c2@"
  en: "@a@b*: Would you allow me to record your works in an adventure log?\n@c2@"
  es: "@a@b*: ¿Me %H860%Xpermitirás%Ypermitiréis%Z tomar nota de %H860%Xtus%Yvuestras%Z obras en un registro de aventuras?\n@c2@"
  fr: "@a@b*ⓢ Me permettez-vous d'enregistrer vos aventures dans un journalⓡ\n@c2@"
  it: "@a@b*: Desideri che io salvi le tue azioni nel diario dell'avventura?\n@c2@"
  ja: "@a@b＊「そして　冒険の書に\n\t記録しても　よろしいですか？\n@c2@"
"4":
  de: "@a@b*: In welchem Abenteuertagebuch soll ich das verzeichnen?\n@c2@"
  en: "@a@b*: Into which adventure log do you wish me to record this?\n@c2@"
  es: "@a@b*: ¿En qué registro de aventuras %H860%Xquieres%Yqueréis%Z que guarde %H860%Xtus%Yvuestros%Z avances?\n@c2@"
  fr: "@a@b*ⓢ Dans quel journal souhaitez-vous que j'effectue la sauvegardeⓡ\n@c2@"
  it: "@a@b*: In quale diario dell'avventura vuoi che io salvi le tue imprese?\n@c2@"
  ja: "@a@b＊「なんばんの　冒険の書に\n\t記録なさいますか？\n@c2@"
"5":
  de: "@a@b*: In diesem Fall muss ich ⓞ%a00660: %0%a00090 %a00240ⓟ überschreiben. Wünscht Ihr, dass ich fortfahre, oh Kind des Glaubens?\n@c2@"
  en: "@a@b*: In that case, I must overwrite\nⓗ%a00660: %0%a00090 %a00240ⓘ.\nDo you wish me to proceed, o faithful one?\n@c2@"
  es: "@a@b*: En tal caso deberé sobrescribir\n''%a00660: %0%a00090 %a00240''.\n¿%H860%XQuieres que continúe, leal %A120%Xsiervo%Z%B120%Xsierva%Z%YQueréis que continúe, %R000%Xleales siervas%Yleales siervos%Z%Z?\n@c2@"
  fr: "@a@b*ⓢ Dans ce cas, je dois écraser\nⓥ%a00660ⓢ %0%a00090 %a00240ⓦ.\nVoulez-vous que je le fasse, mon enfantⓡ\n@c2@"
  it: "@a@b*: In tal caso, devo sovrascrivere\nⓗ%a00660: %0%a00090 %a00240ⓘ.\nPosso procedere, pecorella della dea?\n@c2@"
  ja: "@a@b＊「そうすると　%a00660：%a00090　%a00240の\n\t記録に　上書きしてしまいますが\n\tそれでも　よろしいですか？\n@c2@"
"6":
  de: "@a@bAbenteuertagebuch konnte nicht gespeichert werden.\nBitte das Gerät abschalten und die DS-Karte erneut einstecken.\n@c0@"
  en: "@a@bThe adventure log could not be\nsaved. Please turn the power OFF\nand reinsert the DS Game Card.\n@c0@"
  es: "@a@bNo se ha podido guardar el registro de aventuras.\nApaga la consola y vuelve a\ninsertar la tarjeta DS.\n@c0@"
  fr: "@a@bÉchec de la sauvegarde du journal.\nVeuillez éteindre la console et réinsérer\nla carte de jeu DS.\n@c0@"
  it: "@a@bNon è stato possibile salvare il diario dell'avventura. Spegni la console e inserisci nuovamente la scheda di gioco DS.\n@c0@"
  ja: "@a@b冒険の書に　記録できませんでした。\n電源を切って　カードを差し込み\n直してください。\n@c0@"
"7":
  de: "@a@b*: Ich habe Euer Abenteuer erfolgreich aufgezeichnet. Habt Ihr die Absicht, es jetzt fortzusetzen?\n@c2@"
  en: "@a@b*: I successfully recorded your adventure log.\nDo you plan to continue on your adventure at this point?\n@c2@"
  es: "@a@b*: %H860%XTus%YVuestras%Z aventuras han quedado registradas de forma completamente satisfactoria.\n¿%H860%XDeseas%YDeseáis%Z continuar ahora con %H860%Xtus%Yvuestras%Z aventuras?\n@c2@"
  fr: "@a@b*ⓢ J'ai enregistré votre journal.\nAvez-vous l'intention de poursuivre votre aventureⓡ\n@c2@"
  it: "@a@b*: Ho salvato i tuoi progressi nel diario dell'avventura.\nVuoi proseguire nel tuo viaggio, %A120%Xfratello%Z%B120%Xsorella%Z?\n@c2@"
  ja: "@a@b＊「たしかに　記録いたしました。\n\tまだ　冒険を　お続けになりますか？\n@c2@"
"8":
  de: "@a@b*: Ihr würdet Euer Abenteuer lieber nicht aufzeichnen? Nun, so sei es. Ihr seid frei in Eurer Entscheidung und könnt tun, was Ihr wünscht.\n@c2@"
  en: "@a@b*: You would prefer not to make a record of your adventure? Then so be it. You are free to do as you please.\n@c2@"
  es: "@a@b*: ¿%H860%XPrefieres%YPreferís%Z no conservar un registro de %H860%Xtus%Yvuestras%Z aventuras? Que así sea, pues. %H860%XEres libre de hacer lo que te plazca%YSois libres de hacer lo que os plazca%Z.\n@c2@"
  fr: "@a@b*ⓢ Vous préférez ne pas garder trace de votre aventureⓡ Alors qu'il en soit ainsi.\nVous êtes libre de faire comme bon vous semble.\n@c2@"
  it: "@a@b*: Hai deciso di non salvare i tuoi progressi nel diario dell'avventura? Capisco, %A120%Xfratello%Z%B120%Xsorella%Z. La scelta è solo tua.\n@c2@"
  ja: "@a@b＊「では　これまでのことは\n\t記録しないでおきましょう。\n@c2@"
"9":
  de: "@a@b*: Habt Ihr die Absicht, Euer Abenteuer jetzt fortzusetzen?\n@c2@"
  en: "@a@b*: Do you plan on continuing your adventure at this point?\n@c2@"
  es: "@a@b*: ¿%H860%XDeseas%YDeseáis%Z continuar ahora %H860%Xtus%Yvuestras%Z aventuras?\n@c2@"
  fr: "@a@b*ⓢ Avez-vous l'intention de poursuivre votre aventureⓡ\n@c2@"
  it: "@a@b*: %A120%XCarissimo fratello%Z%B120%XCarissima sorella%Z, vuoi proseguire la tua avventura?\n@c2@"
  ja: "@a@b＊「まだ　冒険を\n\tおつづけに　なりますか？\n@c2@"
"10":
  de: "@a@b*: Ihr wollt Euch von Euren Abenteuern ausruhen, ohne Eure Taten in einem Abenteuertagebuch aufzuzeichnen?\n@c2@"
  en: "@a@b*: You intend to rest from your adventures without recording your deeds in an adventure log?\n@c2@"
  es: "@a@b*: ¿%H860%XQuieres tomarte%YQueréis tomaros%Z un descanso en %H860%Xtus%Yvuestras%Z aventuras sin guardar %H860%Xtus%Yvuestras%Z proezas en un registro?\n@c2@"
  fr: "@a@b*ⓢ Vous avez l'intention de vous reposer de vos aventures sans enregistrer ce que vous avez accompli dans un journalⓡ\n@c2@"
  it: "@a@b*: Vuoi riposare senza salvare i tuoi progressi nel diario dell'avventura?\n@c2@"
  ja: "@a@b＊「では　記録せずに\n\t休むと　おっしゃるのですね。\n@c2@"
"11":
  de: "@a@b*: Das bedeutet, dass Ihr Euer Abenteuer von dem Moment Eurer letzten Beichte fortsetzen werdet. Ist das wirklich Euer Wunsch?\n@c2@"
  en: "@a@b*: This will mean you will restart your adventure from the point of your last confession. Are you sure this is what you want?\n@c2@"
  es: "@a@b*: Eso significa que %H860%Xdeberás%Ydeberéis%Z reemprender %H860%Xtu%Yvuestra%Z aventura desde el momento de %H860%Xtu%Yvuestra%Z última confesión. ¿Seguro que %H860%Xquieres%Yqueréis%Z hacerlo?\n@c2@"
  fr: "@a@b*ⓢ Cela signifie que vous devrez recommencer votre aventure à partir de votre dernière confession. Est-ce vraiment ce que vous voulezⓡ\n@c2@"
  it: "@a@b*: Ciò significa che dovrai riprendere la tua avventura dal punto dove hai effettuato l'ultima confessione. Sei proprio %A120%Xcerto%Z%B120%Xcerta%Z di voler fare così?\n@c2@"
  ja: "@a@b＊「そうすると　冒険が\n\t前の記録まで　もどりますが\n\tよろしいのですか？\n@c2@"
"12":
  de: "@a@b*: Oh große Hirtin, bitte lass dieses arme Lamm eine Weile in Frieden ruhen!\n@c2@"
  en: "@a@b*: O great shepherdess, please allow this faithful lamb to rest in peace for a while!\n@c2@"
  es: "@a@b*: ¡Oh, gran pastora, permite que %H860%Xesta fiel oveja descanse%Yestas fieles ovejas descansen%Z en paz por un rato!\n@c2@"
  fr: "@a@b*ⓢ Ô grande bergère, permettez à cette fidèle brebis de se reposer un momentⓠ\n@c2@"
  it: "@a@b*: O dea benevola, concedi a %A120%Xa questo tuo%Z%B120%Xa questa tua%Z fedele il riposo di cui ha bisogno.\n@c2@"
  ja: "@a@b＊「ああ　われらが神よ！\n\tこの迷える子羊に　ひとときの\n\t休息を　おあたえください！\n@c2@"
"13":
  de: "@a@b    Die Göttin segne Euch armes verirrtes Schaf.\n             Bitte schaltet Euer Gerät aus.\n@c0@"
  en: "@a@b            Bless you, my poor lost sheep.\n             Please turn the power OFF.\n@c0@"
  es: "@a@b%H860%XBendita seas, pobre oveja perdida%YBenditas seáis, pobres ovejas perdidas%Z. \nPuedes apagar la consola.\n@c0@"
  fr: "@a@b          Que la Déesse soit avec vous,\n                pauvre brebis égarée.\n          Appuyez sur le bouton POWER.\n@c0@"
  it: "@a@b           Che la dea non ti abbandoni mai!\n             Ora puoi spegnere la console.\n@c0@"
  ja: "@a@b　　　　　　おつかれさまでした。\n　このまま　電源をＯＦＦにしてください。\n@c0@"
"14":
  de: "@a@b*: Die Göttin gewährt mir die Gunst der Einsicht...\n@c2@"
  en: "@a@b*: The Goddess gives me insight...\n@c2@"
  es: "@a@b*: La Diosa me da entendimiento...\n@c2@"
  fr: "@a@b*ⓢ La Déesse m'éclaire...\n@c2@"
  it: "@a@b*: La dea, nella sua infinita benevolenza, mette a tua disposizione la sua saggezza.\n@c2@"
  ja: "@a@b＊「神の声が　聞こえます。\n@c2@"
"15":
  de: "@a@b*: Die Göttin ist Euch hold, %a00060! Ihr scheint bereits so stark zu sein, wie man nur sein kann!\n@c2@"
  en: "@a@b*: The Goddess smiles upon you, %a00060!\nYou appear to be as strong as you can possibly be!\n@c2@"
  es: "@a@b*: ¡La Diosa te sonríe, %a00060!\n¡Parece que eres todo lo fuerte que se puede ser!\n@c2@"
  fr: "@a@b*ⓢ La Déesse vous sourit, %a00060ⓠ\nIl semblerait que vous soyez au maximum de votre forceⓠ\n@c2@"
  it: "@a@b*: %0%a00060!\nMi pare proprio che tu sia già sufficientemente forte!\n@c2@"
  ja: "@a@b＊「%a00060よ。　\n\tあなたは　もう　じゅうぶん　\n\t強く　おなりですわ。\n@c2@"
"16":
  de: "@a@b*: Offenbar hat %a00060 eine erhebende Erfahrung gemacht!\n@c2@"
  en: "@a@b*: It appears %a00060 has had an elevating experience!\n@c2@"
  es: "@a@b*: ¡Parece que %a00060 ha tenido una experiencia religiosa!\n@c2@"
