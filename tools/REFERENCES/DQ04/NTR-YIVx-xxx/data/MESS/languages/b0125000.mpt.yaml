"66":
  de: "@a@b*: Vor vielen, vielen Jahren stieg ein junger Engel von Zenithia hinab und verliebte sich in einen Menschen, einen Holzfäller.\n@c1@"
  en: "@a@b*: Many years ago, a young angel did descend from Zenithia and fell in love with a human woodcutter.\n@c1@"
  es: "@a@b*: Hace muchos años, un joven ángel descendió de Zenithia y se enamoró de un leñador humano.\n@c1@"
  fr: "@a@b*ⓢ Il y a de nombreuses années, un ange est descendu de Zénithia et elle est tombée amoureuse d'un bûcheron humain.\n@c1@"
  it: "@a@b*: Tanti anni fa, una donna angelo discese da Zenithia e si innamorò di un uomo, un taglialegna. I due si sposarono ed ebbero un bambino.\n@c1@"
  ja: "@a@b＊「その昔　地上に落ちて\n\t木こりの若者と\n\t恋をした　娘がおりました。\n@c1@"
"67":
  de: "@a@b*: Doch das göttliche Gesetz verbietet eine Beziehung zwischen Engeln und Menschen.\n@c1@"
  en: "@a@b*: But the divine law doth say that no angel and no human shall together be.\n@c1@"
  es: "@a@b*: Pero las leyes divinas dicen que los ángeles no pueden relacionarse con los humanos.\n@c1@"
  fr: "@a@b*ⓢ Mais la loi divine interdit à tout ange de vivre aux côtés d'un humain.\n@c1@"
  it: "@a@b*: Ma, secondo la legge divina, un angelo e un essere umano non possono stare insieme.\n@c1@"
  ja: "@a@b＊「しかし　天空人と人間は\n\t夫婦になれぬのが　さだめ。\n@c1@"
"68":
  de: "@a@b*: So wurde der Holzfäller vom Blitz erschlagen, und die untröstliche Engelsfrau wurde nach Zenithia zurückgebracht.\n@c1@"
  en: "@a@b*: The woodcutter was struck down by a bolt of lightning and the grief-stricken angel was returned to Zenithia.\n@c1@"
  es: "@a@b*: El leñador fue fulminado por un rayo, que le mató, y el ángel, abatida por el dolor, regresó a Zenithia.\n@c1@"
  fr: "@a@b*ⓢ Le bûcheron fut frappé par la foudre et l'ange, folle de chagrin, revint à Zénithia.\n@c1@"
  it: "@a@b*: Il taglialegna fu colpito da un fulmine, e la donna angelo, distrutta dal dolore provocatole dalla perdita dell'amato, fu riportata a Zenithia.\n@c1@"
