"13":
  de: "@a@b*: Wünscht Ihr, etwas aus den Büchern zu erfahren?\n@c2@"
  en: "@a@b*: Do you desire to read of the books?\n@c2@"
  es: "@a@b*: ¿%H860%XDesea%YDeseáis%Z que lea los libros?\n@c2@"
