"1":
  de: "@a@b*: Ihr steht am Fuße der Treppe nach Zenithia. Doch allein %H860%X%A120%Xder Erkorene%Z%B120%Xdie Erkorene%Z darf%Ydie Erkorenen dürfen%Z ihre Stufen betreten...\n@c2@"
