"4":
  de: "@aZenithdrache@bDie Welle der Bosheit hat bereits ein Loch in unsere Wolken gefressen. Durch dieses könnt Ihr unbemerkt in die Unterwelt von Nadiria schlüpfen.\n@c3@"
  en: "@aZenith Dragon@bThe wave of malice has pierced a hole in the clouds. That is your opening to the underworld of Nadiria.\n@c3@"
  es: "@aDragón de Zenithia@bLa onda de maldad ha abierto un agujero en las nubes. Esa es la puerta de acceso al Inframundo de Nadiria.\n@c3@"
  fr: "@aDragon du Zénith@bL'onde maléfique a percé un trou dans les nuages.\nC'est par là que vous pourrez pénétrer dans les enfers de Nadiria. \n@c3@"
  it: "@aDrago di Zenithia@bL'onda malefica ha creato un varco tra le nuvole. È la via d'accesso che %H860%Xti%Yvi%Z condurrà nel mondo sotterraneo di Nadiria.\n@c3@"
  ja: "@a@bマスタードラゴン「邪悪な波動が\n\t雲にあけた穴から　闇の世界への\n\t入り口に向かうのだ！\n@c3@"
"5":
  de: "@aZenithdrache@bIn diesen dunklen Tiefen wird das Zenithiaschwert Euer größter Freund sein.\n@c3@"
  en: "@aZenith Dragon@bIn its murky depths, the Zenithian Sword will be your greatest ally.\n@c3@"
  es: "@aDragón de Zenithia@bEn sus tenebrosas profundidades, la Espada de Zenithia será tu mejor aliado.\n@c3@"
  fr: "@aDragon du Zénith@bDans ces profondeurs ténébreuses, l'Épée zénithienne sera votre plus fidèle alliée.\n@c3@"
  it: "@aDrago di Zenithia@bLa Spada Zenithiana sarà la %H860%Xtua%Yvostra%Z migliore alleata nelle oscure profondità che %H860%Xdovrai attraversare%Ydovrete attraversare%Z.\n@c3@"
  ja: "@a@bマスタードラゴン「その　天空のつるぎが\n\tきっと　役に立つであろう！\n@c3@"
"6":
  de: "@a@b*: Ihr steht unserem Herrn und Meister, dem Zenithdrachen, gegenüber!\n@c2@"
