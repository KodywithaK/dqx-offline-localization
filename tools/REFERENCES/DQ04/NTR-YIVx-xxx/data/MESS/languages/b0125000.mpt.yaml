"24":
  de: "@a@b*: ⓞGeschichte des Kriegesⓟ. Ähem...\n@c1@"
  en: "@a@b*: ⓗA History of Warⓘ.\nAhem...\n@c1@"
  es: "@a@b*: ''Una historia de guerra''.\nEjem...\n@c1@"
  fr: "@a@b*ⓢ ⓥUne Histoire de la Guerreⓦ.\nHum...\n@c1@"
  it: "@a@b*: ⓕUna storia di guerraⓖ.\nEhm...\n@c1@"
  ja: "@a@b＊「戦いの歴史……。\n\tコホン……。\n@c1@"
"25":
  de: "@a@b*: ⓞVor vielen Monden förderte Estark, der Meister der Monster, etwas unglaublich Böses zu Tage: das Geheimnis der Evolution.\n@c1@"
  en: "@a@b*: ⓗMany moons ago, Estark, the Master of Monsterkind, unearthed a terrible evil: the Secret of Evolution.\n@c1@"
  es: "@a@b*: ''Hace muchas lunas, Estark, el Señor de los Monstruos, desenterró un terrible mal: el Secreto de la Evolución.''\n@c1@"
  fr: "@a@b*ⓢ ⓥIl y a de nombreuses lunes, Estark, le Maître des monstres, fit une découverte terribleⓢ le Secret de l'Évolution.\n@c1@"
  it: "@a@b*: ⓕMolte lune fa, Estark, il Signore della Mostruosità, scoprì un terribile male: il Segreto dell'Evoluzione.ⓖ\n@c1@"
  ja: "@a@b＊「はるか昔　魔族の王エスタークは\n\t恐ろしいものを　造りだした。\n\tそれは　進化の秘法。\n@c1@"
"26":
  de: "@a@b*: Mithilfe dieser teuflischen Macht verwandelte sich Estark in eine derart mächtige Kreatur, dass er selbst die Götter herausforderte.\n@c1@"
  en: "@a@b*: ⓗUsing this awesome power, Estark evolved into a creature so mighty that he would rival even the gods.\n@c1@"
  es: "@a@b*: ''Con este asombroso poder, Estark se convirtió en una criatura poderosísima, capaz de combatir a los propios dioses.''\n@c1@"
  fr: "@a@b*ⓢ Utilisant cette arme incroyable, Estark devint si puissant qu'il pouvait même rivaliser avec les dieux.\n@c1@"
  it: "@a@b*: ⓕServendosi di questo potere incredibile, Estark divenne una creatura talmente forte da riuscire a competere persino con le divinità.ⓖ\n@c1@"
  ja: "@a@b＊「エスタークは　そのチカラで\n\t自らを　神をも越える\n\t究極の生物に進化させた。\n@c1@"
"27":
  de: "@a@b*: Doch die Zenithianer waren sich Estarks Plänen bewusst und bekämpften ihn gemeinsam mit dem Zenithdrachen.\n@c1@"
  en: "@a@b*: ⓗBut the Zenithians were aware of Estark's designs and, alongside the Zenith Dragon, engaged him in battle.\n@c1@"
  es: "@a@b*: ''Pero los habitantes de Zenithia conocían los designios de Estark y, junto con el Dragón de Zenithia, se enfrentaron a él.''\n@c1@"
  fr: "@a@b*ⓢ Mais les Zénithiens avaient eu vent des plans d'Estark et l'affrontèrent aux côtés du Dragon du Zénith.\n@c1@"
  it: "@a@b*: ⓕMa gli abitanti di Zenithia erano a conoscenza dei piani di Estark, e decisero di allearsi con il Drago di Zenithia per combatterlo.ⓖ\n@c1@"
  ja: "@a@b＊「しかし　事態を知った天空人は\n\tマスタードラゴンとともに\n\tエスタークと戦った。\n@c1@"
"28":
  de: "@a@b*: Nach einem langen und blutigen Krieg wurde Estark schließlich weggesperrt, tief unter der Erde.\n@c1@"
  en: "@a@b*: ⓗAfter a long and bloody war, Estark was finally sealed away deep underground.\n@c1@"
  es: "@a@b*: ''Tras una larga y sangrienta guerra, Estark fue finalmente encerrado en las profundidades de la tierra.''\n@c1@"
  fr: "@a@b*ⓢ Après une guerre longue et sanglante, Estark fut finalement emprisonné au plus profond de la terre.\n@c1@"
  it: "@a@b*: ⓕDopo una guerra lunga e sanguinosa, Estark fu imprigionato nelle profondità della terra.ⓖ\n@c1@"
  ja: "@a@b＊「長い戦いの後\n\tついに　エスタークは\n\t地の底に　封じ込められた。\n@c1@"
"29":
  de: "@a@b*: Denn selbst der mächtige Zenithdrache war nicht stark genug, um Estark ganz zu vernichten.\n@c1@"
  en: "@a@b*: ⓗFor even the mighty Zenith Dragon was not powerful enough to completely destroy Estark.\n@c1@"
  es: "@a@b*: ''Porque ni siquiera el legendario Dragón de Zenithia era lo suficientemente poderoso como para acabar completamente con Estark.''\n@c1@"
  fr: "@a@b*ⓢ Car même la force du puissant Dragon du Zénith n'était pas suffisante pour éliminer définitivement Estark. \n@c1@"
  it: "@a@b*: ⓕTuttavia, nemmeno la potenza del grande Drago di Zenithia fu sufficiente per distruggere completamente Estark.ⓖ\n@c1@"
  ja: "@a@b＊「マスタードラゴンでさえも\n\tエスタークを　封じ込めるだけで\n\t消滅させることまでは　できなかった。\n@c1@"
"30":
  de: "@a@b*: Möge er niemals geweckt, möge er niemals wachgerüttelt werden.\n@c1@"
  en: "@a@b*: ⓗHe must never be stirred.\nHe must never be roused.\n@c1@"
  es: "@a@b*: ''Jamás deberá ser despertado.\nJamás deberá ser invocado.''\n@c1@"
  fr: "@a@b*ⓢ Il ne doit jamais être réveillé.\n@c1@"
  it: "@a@b*: ⓕNon dovrà mai essere destato. Non dovrà mai essere disturbato.ⓖ\n@c1@"
  ja: "@a@b＊「エスタークを　起こしてはならぬ。\n\t彼に　近づいてはならぬ。\n@c1@"
"31":
  de: "@a@b*: Solch eine gefährliche Macht darf unseren Kindern und Kindeskindern nicht zugänglich sein. Sie gehört weggesperrt...ⓟ\n@c1@"
  en: "@a@b*: ⓗSuch potency cannot be inherited by our children and children's children. It must be sealed away...ⓘ\n@c1@"
  es: "@a@b*: ''Tal poder no debe ser heredado por nuestros hijos ni los hijos de nuestros hijos.\nDebe permanecer sellado...''\n@c1@"
  fr: "@a@b*ⓢ Une telle puissance ne doit pas être laissée en héritage à nos enfants et aux enfants de nos enfants.\n㈡\n*ⓢ Il faut la faire disparaître...ⓦ\n@c1@"
  it: "@a@b*: ⓕUno strumento del genere non può essere tramandato ai propri figli, e ai figli dei propri figli, ma dev'essere tenuto nascosto.ⓖ\n@c1@"
  ja: "@a@b＊「……と　書かれています。\n@c1@"
"32":
  de: "@a@b*: Erst viel später erfuhr man die ganze Wahrheit. Das von Estark genutzte Geheimnis der Evolution war unvollständig.\n@c1@"
  en: "@a@b*: It was only in hindsight that the truth was known. The Secret of Evolution used by Estark was incomplete.\n@c1@"
  es: "@a@b*: Solo después se conocería la verdad. El Secreto de la Evolución utilizado por Estark estaba incompleto.\n@c1@"
  fr: "@a@b*ⓢ Ce n'est qu'après coup que la vérité fut connue. Le Secret de l'Évolution tel qu'Estark l'avait utilisé n'était pas complet.\n@c1@"
  it: "@a@b*: Solo successivamente la verità venne alla luce. Il Segreto dell'Evoluzione usato da Estark non era completo...\n@c1@"
  ja: "@a@b＊「しかし　あとで分かったのですが\n\tエスタークの進化の秘法は\n\tまだ　不完全だったとか。\n@c1@"
"33":
  de: "@a@b*: Das Wandlungsarmband, das die dunklen Mächte zusätzlich verstärkt, wurde nie von Estark eingesetzt.\n@c1@"
  en: "@a@b*: The armlet of transmutation, needed to augment the dark powers necessary for the process, was never employed by Estark.\n@c1@"
  es: "@a@b*: Estark nunca empleó el brazalete de transmutación, imprescindible para aumentar los poderes de la oscuridad necesarios para el proceso.\n@c1@"
  fr: "@a@b*ⓢ Ce dernier n'avait pas utilisé le brassard étincelant, censé augmenter les pouvoirs maléfiques nécessaires au procédé.\n@c1@"
  it: "@a@b*: Estark non aveva utilizzato la Fascia crisalidea, necessaria per ampificare le forze oscure richieste per il processo.\n@c1@"
  ja: "@a@b＊「闇のチカラを増幅させる\n\t黄金の腕輪が　あのときは　まだ\n\t使われていなかったのです。\n@c1@"
"34":
  de: "@a@b*: Wie Ihr wünscht. Vielleicht ein anderes Mal...\n@c1@"
  en: "@a@b*: Very well. Perhaps at another time...\n@c1@"
  es: "@a@b*: Muy bien. Quizás en otro momento...\n@c1@"
  fr: "@a@b*ⓢ Bien. Peut-être une autre fois, alors...\n@c1@"
  it: "@a@b*: Non c'è problema. Sarà per un'altra volta...\n@c1@"
  ja: "@a@b＊「そうですか。　では　いずれまた……。\n@c1@"
"35":
  de: "@a@b*: Manche der Bücher auf den Regalen sind Euch nicht erlaubt.\n@c2@"
  en: "@a@b*: There are books on these shelves that you cannot read.\n@c2@"
  es: "@a@b*: Hay libros en estos estantes que no %H860%Xpuede%Ypueden%Z leer.\n@c2@"
  fr: "@a@b*ⓢ Il y a, sur ces étagères, des livres que vous ne pouvez pas feuilleter.\n@c2@"
  it: "@a@b*: Su questi scaffali ci sono dei volumi la cui lettura è vietata.\n@c2@"
  ja: "@a@b＊「ここにある本の中には　そなたらに\n\t読めぬものもあるだろう。\n@c2@"
"36":
  de: "@a@b*: Doch Ihr könnt einen der beiden dort bitten, Euch vorzulesen.\n@c2@"
  en: "@a@b*: You can ask one of those two to read them to you, though.\n@c2@"
  es: "@a@b*: No obstante, %H860%Xpuede%Ypueden%Z solicitar que %H860%Xle%Yles%Z sean leídos estos dos.\n@c2@"
  fr: "@a@b*ⓢ Vous pouvez toutefois demander à l'un de ces deux-là de les lire.\n@c2@"
  it: "@a@b*: È possibile, tuttavia, chiedere che qualcuno li legga.\n@c2@"
  ja: "@a@b＊「そこにいる　ふたりに\n\t読んでもらうといい。\n@c2@"
"37":
  de: "@a@b*: Dies ist das imposante Schloss von Zenithia.\n@c2@"
  en: "@a@b*: Behold the mighty castle of Zenithia.\n@c2@"
  es: "@a@b*: He aquí el legendario castillo de Zenithia.\n@c2@"
  fr: "@a@b*ⓢ Voici le grand château de Zénithia.\n@c2@"
  it: "@a@b*: Questo è il mitico castello di Zenithia.\n@c2@"
  ja: "@a@b＊「ここは　天空城。\n@c2@"
"38":
  de: "@a@b*: Ihr befindet Euch im Reich des großen Drachengottes.\n@c2@"
  en: "@a@b*: You stand in the domain of the great Dragon God.\n@c2@"
  es: "@a@b*: %H860%XSe halla%YSe hallan%Z en los dominios del magnífico Dios Dragón.\n@c2@"
  fr: "@a@b*ⓢ Vous êtes dans le domaine du Dieu-dragon.\n@c2@"
  it: "@a@b*: %H860%XTi trovi%YVi trovate%Z nella terra del grande Drago Divino.\n@c2@"
  ja: "@a@b＊「ここは　竜の神さまが\n\tおさめているお城です。\n@c2@"
"39":
  de: "@a@b*: Oh! Viele Jahre sind ins Land gezogen, seit flügellose Freunde zuletzt die Wolken unseres Reiches betraten.\n@c1@"
  en: "@a@b*: Oh! Many years have passed since wingless friends did tread the clouds of our realm.\n@c1@"
  es: "@a@b*: ¡Oh! Incontables años han pasado desde que los últimos amigos no alados se aventuraron más allá de las nubes de nuestros dominios.\n@c1@"
  fr: "@a@b*ⓢ Ohⓠ Cela faisait bien des années que des êtres dépourvus d'ailes n'avaient pas foulé le sol de notre royaume.\n@c1@"
  it: "@a@b*: Oh! Molto tempo è trascorso dall'ultima volta che amici privi di ali erano giunti tra le nuvole del nostro regno...\n@c1@"
  ja: "@a@b＊「あら？　翼のない人が\n\t天空城にやってくるなんて\n\t何百年ぶりかしら……。\n@c1@"
"40":
  de: "@a@b*: Die Nachrichten, die uns von der Erde ereilen, stimmen uns besorgt. Es scheint, als stehe ein teuflischer Feind kurz vor der Wiedergeburt.\n@c2@"
  en: "@a@b*: The word from the earth below is of a terrible evil. A wicked foe about to be reborn.\n@c2@"
  es: "@a@b*: Llegan noticias de un terrible mal allá abajo en la tierra. Un maligno enemigo a punto de renacer.\n@c2@"
  fr: "@a@b*ⓢ Des rumeurs effrayantes viennent d'en bas.\nUn être maléfique serait sur le point de renaître.\n@c2@"
  it: "@a@b*: Giungono voci orribili dalla terra di sotto... Un essere malvagio sta per tornare in vita.\n@c2@"
  ja: "@a@b＊「地上では　とてつもなく邪悪な者が\n\t生まれようと　しているらしいな。\n@c2@"
"41":
  de: "@a@b*: Der jüngste Stoß war äußerst furchteinflößend. So stelle ich mir die Erdbeben vor, die ihr Menschen erleiden müsst...\n@c2@"
  en: "@a@b*: The recent tremor was most terrifying.\nSuch must be the earthquakes you humans suffer on the earth below.\n@c2@"
  es: "@a@b*: El reciente temblor ha sido aterrador.\nAsí deben de ser los terremotos que vosotros los humanos padecéis abajo en la tierra.\n@c2@"
  fr: "@a@b*ⓢ Ce dernier soubresaut a été vraiment terrifiant.\nC'est sans doute à cela que doivent ressembler les tremblements de terre qui agitent votre monde.\n@c2@"
  it: "@a@b*: La scossa di poco fa è stata terrificante. Immagino che fosse simile ai sismi che voi umani avvertite sulla terra.\n@c2@"
  ja: "@a@b＊「さっきの揺れは　すごかったな。\n\t地上でおこる地震ってのは　きっと\n\tさっきみたいな　感じなんだろうな。\n@c2@"
"42":
  de: "@a@b*: Diese Welle der Bosheit... Die Burg ist zwar unbeschadet, doch hat die Welle ein Loch in die Wolkendecke getrieben.\n@c2@"
  en: "@a@b*: But the wave of malice...\nThough the castle is unharmed, alack, it has pierced a hole in the clouds.\n@c2@"
  es: "@a@b*: Pero la onda de maldad...\nAunque por suerte el castillo no ha resultado dañado, ha abierto un agujero en las nubes.\n@c2@"
  fr: "@a@b*ⓢ Mais l'onde maléfique...\nLe château est intact, mais elle a percé un trou dans les nuages.\n@c2@"
  it: "@a@b*: Ma l'onda malefica, nonostante non abbia danneggiato il castello, ha creato, ahimè, uno squarcio tra le nuvole.\n@c2@"
  ja: "@a@b＊「しかし　あの邪悪な波動……。\n\t城には被害を　与えなかったけど\n\t雲に穴をあけたんだよ。\n@c2@"
"43":
  de: "@a@b*: Oh, diese Angst!\n@c1@"
  en: "@a@b*: Oh, but the fear!\n@c1@"
  es: "@a@b*: ¡Oh, pero el temor!\n@c1@"
  fr: "@a@b*ⓢ Quelle frayeurⓠ\n@c1@"
  it: "@a@b*: Oh, che paura!\n@c1@"
  ja: "@a@b＊「ああ　恐ろしい！\n@c1@"
"44":
  de: "@a@b*: Die Welle der Bosheit aus der Welt unter uns hat ein Loch in die Wolken gerissen.\n@c1@"
  en: "@a@b*: The wave of malice from the land below has pierced a hole in the clouds.\n@c1@"
  es: "@a@b*: La onda de maldad procedente de la tierra ha abierto un agujero en las nubes.\n@c1@"
  fr: "@a@b*ⓢ L'onde maléfique venue du monde d'en bas a percé un trou dans les nuages.\n@c1@"
  it: "@a@b*: L'onda malefica proveniente dalla terra di sotto ha aperto un varco tra le nuvole.\n@c1@"
  ja: "@a@b＊「ちょうど　この下の地上から\n\t邪悪な波動が　発せられ\n\t雲を　つらぬいていたのです。\n@c1@"
"45":
  de: "@a@b*: Sie hat diesen großen Riss im sanften Gewebe unserer Heimat verursacht.\n@c1@"
  en: "@a@b*: It was the cause of this gross tear in the soft fabric of our homeland.\n@c1@"
  es: "@a@b*: Esa fue la causa del tremendo desgarro que ha sufrido la suave estructura de nuestro hogar.\n@c1@"
  fr: "@a@b*ⓢ C'est ce qui a provoqué cette horrible déchirure dans la structure harmonieuse de notre pays.\n@c1@"
  it: "@a@b*: È stata l'onda a provocare quest'ampio squarcio nel soffice velo che ci sostiene.\n@c1@"
  ja: "@a@b＊「この大きな穴は　そのとき\n\tできたものですわ。\n@c1@"
"46":
  de: "@a@b*: Grrr...\n@c3@"
  en: "@a@b*: Grrr...\n@c3@"
  es: "@a@b*: Grrr...\n@c3@"
  fr: "@a@b*ⓢ Grrr...\n@c3@"
  it: "@a@b*: Grrr...\n@c3@"
  ja: "@a@b＊「グルルルー。\n@c3@"
"47":
  de: "@a@b*: In naher Zukunft werdet Ihr zu seltsamen Orten reisen.\n@c2@"
  en: "@a@b*: You will be travelling to strange places in the near future.\n@c2@"
  es: "@a@b*: %H860%XViajará%YViajarán%Z a extraños lugares en el futuro.\n@c2@"
  fr: "@a@b*ⓢ Dans un avenir proche, vous allez visiter des endroits étranges.\n@c2@"
  it: "@a@b*: Presto %H860%Xvisiterai%Yvisiterete%Z strani luoghi.\n@c2@"
  ja: "@a@b＊「お前さんたち\n\tこれから　大変なところに\n\t行くんだろう。\n@c2@"
"48":
  de: "@a@b*: Daher muss ich Euch fragen: Besitzt Ihr schon das Horn des Barons?\n@c2@"
  en: "@a@b*: So I must ask you. Have you already obtained the baron's bugle?\n@c2@"
  es: "@a@b*: Así que debo %H860%Xpreguntarle%Ypreguntarles%Z. ¿%H860%XDispone%YDisponen%Z ya del cuerno del barón?\n@c2@"
  fr: "@a@b*ⓢ Alors j'ai une question à vous poserⓢ avez-vous déjà récupéré le clairon du Baronⓡ\n@c2@"
  it: "@a@b*: Quindi %H860%Xti%Yvi%Z chiedo: %H860%Xhai%Yavete%Z già ottenuto la Tromba del barone?\n@c2@"
  ja: "@a@b＊「ところで　バロンの角笛を\n\tもう手に　いれなさったか？\n\tもし　まだだったら……\n@c2@"
"49":
  de: "@a@b*: Falls nicht, müsst Ihr es finden. Es heißt, dass es sich im Baronenschrein östlich des Azimuth befindet.\n@c2@"
  en: "@a@b*: If not, you must find it. It is said to reside in Baron's Folly, to the east of the Azimuth.\n@c2@"
  es: "@a@b*: En caso contrario %H860%Xdebe%Ydeben%Z encontrarlo. Se dice que se encuentra en el Capricho del Barón, al este de El Azimut.\n@c2@"
  fr: "@a@b*ⓢ Si ce n'est pas le cas, vous devez le trouver. D'après ce que j'ai entendu dire, il devrait être dans la Folie du Baron, à l'est de l'Azimut.\n@c2@"
  it: "@a@b*: Se la risposta è no, %H860%Xdevi%Ydovete%Z trovarla. Si dice che sia conservata nel Capriccio del Barone, il bizzarro edificio che si trova a est dell'Azimut.\n@c2@"
  ja: "@a@b＊「なんでもゴットサイドちゅう町の\n\t東のほこらに　ねむっとるって\n\tうわさだよ。\n@c2@"
"50":
  de: "@a@b*: Grrruuu...\n@c2@"
  en: "@a@b*: Grrrooo...\n@c2@"
  es: "@a@b*: Grrrooo...\n@c2@"
  fr: "@a@b*ⓢ Grrrooo...\n@c2@"
  it: "@a@b*: Grrrooo...\n@c2@"
  ja: "@a@b＊「グオーン　グオーン。\n@c2@"
"51":
  de: "@a@b*: Psaro der Metzler hat Barrieren errichtet, um seine Feinde daran zu hindern, seine erzwungene Evolution zu beeinträchtigen.\n@c1@"
  en: "@a@b*: Psaro the Manslayer has erected barriers in order to prevent the hand of his enemies corrupting his forced evolution.\n@c1@"
  es: "@a@b*: Psaro el Carnicero ha dispuesto barreras para impedir que las manos de sus enemigos dañen su evolución forzada.\n@c1@"
  fr: "@a@b*ⓢ Psaro l'Exterminateur a dressé des barrières pour empêcher ses ennemis de venir perturber son évolution forcée.\n@c1@"
  it: "@a@b*: Psaro il Massacratore ha eretto barriere per impedire che i suoi nemici interferiscano con il processo di evoluzione artificiale.\n@c1@"
  ja: "@a@b＊「デスピサロは　秘法をもちいた\n\t進化のじゃまを　されぬよう\n\t地底に　結界を張ったそうです。\n@c1@"
"52":
  de: "@a@b*: Nur wenn diese Barrieren zerstört sind, ist es möglich, die Evolution aufzuhalten.\n@c1@"
  en: "@a@b*: These barriers must be destroyed if his evolution is to be checked.\n@c1@"
  es: "@a@b*: Estas barreras deberán ser destruidas si se desea comprobar el estado de esta evolución.\n@c1@"
  fr: "@a@b*ⓢ Ces barrières doivent être détruites si vous voulez savoir en quoi consiste cette évolution.\n@c1@"
  it: "@a@b*: Per poter controllare lo stato della sua evoluzione, è necessario abbattere tali barriere.\n@c1@"
  ja: "@a@b＊「デスピサロの進化をとめるには\n\tまず　その結界を\n\t破らねばならないでしょう。\n@c1@"
"53":
  de: "@a@b*: Möge die Göttin Ihre schützende Hand über %O960%XEuch halten, %a00090%Y%A090%Xden großen Helden halten%Z%B090%Xdie große Heldin halten%Z%Z.\n@c1@"
  en: "@a@b*: May divine protection accompany %O960%Xthee, %a00090%Ythe great %A090%Xhero%Z%B090%Xheroine%Z, %a00090%Z.\n@c1@"
  es: "@a@b*: Que la protección divina esté %O960%Xcontigo, %a00090%Ycon %A090%Xel legendario héroe%Z%B090%Xla legendaria heroína%Z, %a00090%Z.\n@c1@"
  fr: "@a@b*ⓢ Que la protection divine %O960%Xvous accompagne, %a00090%Yaccompagne %A090%Xle grand héros%Z%B090%Xla grande héroïne%Z %a00090%Z.\n@c1@"
  it: "@a@b*: Che la protezione divina %O960%Xti accompagni sempre, %a00090%Yaccompagni sempre %A090%Xil grande eroe%Z%B090%Xla grande eroina%Z, %a00090%Z.\n@c1@"
  ja: "@a@b＊「勇者　%a00090に\n\tご加護がありますように。\n@c1@"
"54":
  de: "@aOrifiela@bOh, %H860%X%A120%Xmein Freund%Z%B120%Xwerte Freundin%Z%Ymeine Freunde%Z! Seht nur, wie Ihr mir geholfen habt! Ich kann mich nun wieder meinen Aufgaben widmen und auf den Nachwuchs aufpassen.\n@c1@"
  en: "@aOrifiela@bOh, my %H860%Xfriend%Yfriends%Z! See how you have helped me!\nI have returned to my duties watching over the pups.\n@c1@"
  es: "@aOrifiela@b¡Oh, %H860%X%A120%Xamigo mío%Z%B120%Xamiga mía%Z%Y%R000%Xamigas mías%Yamigos míos%Z%Z! ¡Cuánto me %H860%Xha%Yhan%Z ayudado!\nHe regresado a mis deberes y al cuidado de los cachorros.\n@c1@"
  fr: "@aOrifiela@bOh, %H860%Xmon ami%A120%X%Z%B120%Xe%Z%Y%R000%Xmes amies%Ymes amis%Z%Zⓠ Voyez comme vous m'avez aidéeⓠ\nJ'ai repris mes activités habituelles.\nJe surveille les petits.\n@c1@"
  it: "@aOrifiela@bOh, ancora non riesco a crederci! Grazie a %H860%Xte%Yvoi%Z, sono tornata a badare ai miei cuccioli!\n@c1@"
  ja: "@a@bルーシア「ああ　あなた方はっ！？\n\tおかげで　また　こうして\n\tこの子たちの世話を　できますわ。\n@c1@"
"55":
  de: "@aOrifiela@bSolch große Güte, wie Ihr sie mir habt zuteil werden lassen, muss belohnt werden...\n@c1@"
  en: "@aOrifiela@bA great kindness such as you have done unto me must be repaid...\n@c1@"
  es: "@aOrifiela@bEste bien tan inmenso debe ser recompensado...\n@c1@"
  fr: "@aOrifiela@bJe tiens à vous remercier pour ce que vous avez fait...\n@c1@"
  it: "@aOrifiela@bUn gesto così gentile merita una giusta ricompensa...\n@c1@"
  ja: "@a@bルーシア「そうだわ。\n\tなにか　お礼をしなくては……。\n@c1@"
"56":
  de: "@aOrifiela@bFünkchen! Komm doch mal her, bitte.\n@c1@"
  en: "@aOrifiela@bSparkie! Come here, please.\n@c1@"
  es: "@aOrifiela@b¡Sparkie! ¡Ven aquí, vamos!\n@c1@"
  fr: "@aOrifiela@bBraséroⓠ Viens ici, s'il te plaît.\n@c1@"
  it: "@aOrifiela@bScyntill, vieni qui per favore.\n@c1@"
  ja: "@a@bルーシア「ドラン！\n\tこっちへ　いらっしゃい。\n@c1@"
"57":
  de: "@aOrifiela@bIch vertraue Euch Fünkchen an. Er wird Euch auf Euren Reisen begleiten und Euch eine große Hilfe sein.\n@c1@"
  en: "@aOrifiela@bI give you Sparkie, to take with you on your journey. He will aid you, I'm sure.\n@c1@"
  es: "@aOrifiela@b%H860%XLe%YLes%Z doy a Sparkie, para que %H860%Xle%Yles%Z acompañe en su viaje. %H860%XLe%YLes%Z ayudará, de eso estoy segura.\n@c1@"
  fr: "@aOrifiela@bJe vous confie Braséro.\nIl vous accompagnera pendant votre voyage.\nJe suis sûre qu'il vous sera utile.\n@c1@"
  it: "@aOrifiela@bScyntill %H860%Xti%Yvi%Z accompagnerà lungo il viaggio. Sono certa che %H860%Xti%Yvi%Z sarà di grande aiuto nel prosieguo della %H860%Xtua%Yvostra%Z avventura.\n@c1@"
  ja: "@a@bルーシア「どうか　この子を\n\t連れて行ってください。\n\tきっと　お役に立てるでしょう。\n@c1@"
"58":
  de: "@a@bFünkchen schließt sich der Gruppe an!\n@c0@"
  en: "@a@bSparkie joins the party!\n@c0@"
  es: "@a@bSparkie se une al grupo.\n@c0@"
  fr: "@a@bBraséro rejoint l'équipeⓠ\n@c0@"
  it: "@a@bScyntill si unisce al gruppo!\n@c0@"
  ja: "@a@bドランが　仲間にくわわった！\n@c0@"
"59":
  de: "@aOrifiela@bUnser Schicksal liegt nun in Euren Händen.\n@c1@"
  en: "@aOrifiela@bWe are all depending on you now.\n@c1@"
  es: "@aOrifiela@bAhora nuestro destino está en sus manos.\n@c1@"
  fr: "@aOrifiela@bNotre sort à tous dépend de vous.\n@c1@"
  it: "@aOrifiela@bOra il nostro destino è nelle %H860%Xtue%Yvostre%Z mani.\n@c1@"
  ja: "@a@bルーシア「あなたたちの　かつやくを\n\t期待していますわ！\n@c1@"
"60":
  de: "@a@bFünkchen schließt sich der Gruppe an!\n@c0@"
  en: "@a@bSparkie joins the party!\n@c0@"
  es: "@a@bSparkie se une al grupo.\n@c0@"
