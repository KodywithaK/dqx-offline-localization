"94":
  de: "@a@b*: Die Barrieren sind nicht mehr! Beschwört mit dem Horn des Barons den Wagen herauf, bevor Ihr den finalen Kampf bestreitet.\n@c1@"
  en: "@a@b*: The barriers are no more!\nUse the baron's bugle to summon the wagon before you proceed to the final battle.\n@c1@"
