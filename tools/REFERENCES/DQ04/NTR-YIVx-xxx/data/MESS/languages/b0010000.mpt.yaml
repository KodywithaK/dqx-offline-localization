"2":
  de: "@a@b*: Uff! Ich hab so viel gekauft, dass ich nimmer weiß, wie ich alles heim bekomme.\nIch muss närrisch sein!\n@c2@"
  en: "@a@b*: Och! I've bought so many things that I dinnae ken hoo I'm goin' tae get them all home.\nWhat a nyaff I am!\n@c2@"
  es: "@a@b*: ¡Agh! He comprado tantas cosas que no sé cómo voy a poder llevármelas a casa.\n¡Qué necio soy!\n@c2@"
  fr: "@a@b*ⓢ Oh là làⓠ J'ai acheté tellement de choses que je ne sais pas comment je vais pouvoir tout rapporter chez moi. Quel imbécile je faisⓠ\n@c2@"
  it: "@a@b*: Come farò a portare a casa tutta la roba che ho comprato?!? Che testa che ho!\n@c2@"
  ja: "@a@b＊「いや～　いろいろ買いすぎちゃって\n\t重いの　なんのって。\n\tまいった　まいった。\n@c2@"
