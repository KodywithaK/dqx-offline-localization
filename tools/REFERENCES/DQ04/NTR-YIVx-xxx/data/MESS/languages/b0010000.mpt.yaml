"18":
  de: "@a@b*: Die Sterne sehen heute einfach großartig aus. Jau, Nächte wie diese erinnern mich an meine Heimatstadt.\n@c2@"
  en: "@a@b*: The stars look just grand tonight. Why, nights like this remind me of my ol' hometown.\n@c2@"
  es: "@a@b*: Las estrellas se ven rebonitas esta noche. Las noches como esta me recuerdan a mi querida ciudad natal.\n@c2@"
  fr: "@a@b*ⓢ Les étoiles sont splendides, ce soir. Les nuits comme celle-là m'rappellent ma ville natale.\n@c2@"
  it: "@a@b*: Stanotte le stelle sono così splendenti! In sere come questa non riesco a non pensare alla mia vecchia città natale...\n@c2@"
