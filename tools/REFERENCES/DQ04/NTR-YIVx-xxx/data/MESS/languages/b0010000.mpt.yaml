"4":
  de: "@a@b*: Lange her, dass der Basar hier Station gemacht hat, nein wirklich. Wir sind auf der ganzen Welt herumgereist, wisst Ihr.\n@c2@"
  en: "@a@b*: It's been a long old time since we last held\nthe bazaar here, I tell ya. We been travellin' the world, see.\n@c2@"
  es: "@a@b*: Pues hace mucho tiempo desde la última vez que montamos nuestro bazar aquí, nomás. Hemos estado recorriendo el mundo, ¿%H860%Xsabe%Ysaben%Z?\n@c2@"
  fr: "@a@b*ⓢ Ça faisait une paye que l'bazar n'avait pas été ouvert, j'vous l'dis. On était partis voyager partout dans l'monde, c'est pour ça.\n@c2@"
  it: "@a@b*: È passato molto tempo dall'ultima volta che siamo stati qui a vendere la nostra merce. Eh, sì, abbiamo girato tanti bei posti, nel frattempo.\n@c2@"
  ja: "@a@b＊「この砂漠で　バザーを開くのは\n\tずいぶん　ひさしぶりです。\n\tなにしろ世界中を　旅してますから。\n@c2@"
