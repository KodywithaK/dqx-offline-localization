  es: "@a@b*: El tipo dice que hay que vender a la gente ideas, no solo cosas. Es un asunto truculento.\n@c2@"
  fr: "@a@b*ⓢ D'après lui, il faut vendre des idées aux gens, et pas juste des objets. C'est drôlement difficile.\n@c2@"
  it: "@a@b*: Il suo motto è: vendere idee alla gente, non solo oggetti. Che furbata, eh?\n@c2@"
  ja: "@a@b＊「物ではなく　心を売る！\n\tこれには　まいりました……。\n@c2@"
"58":
  de: "@a@b*: Mein Vater ist ein Händler, nicht wahr. Darum bin ich hier, um ein bisschen was übers Geschäft zu lernen.\n@c1@"
  en: "@a@b*: My father's a trader, don't you know.\nThat's why I'm here, trying to learn a bit about business.\n@c1@"
  es: "@a@b*: Mi padre es mercader, ¿%H860%Xsabe%Ysaben%Z?\nPor eso mismo estoy aquí, para aprender un poco sobre los negocios.\n@c1@"
  fr: "@a@b*ⓢ Mon père est commerçant, vous savez. C'est pour ça que je suis ici. Pour apprendre une chose ou deux sur les affaires.\n@c1@"
  it: "@a@b*: Mio padre è un commerciante.\nEcco perché sono qui: voglio imparare come si fanno gli affari!\n@c1@"
  ja: "@a@b＊「わたしも　商人の娘。\n\t商売の勉強を　しないとね。\n@c1@"
"59":
  de: "@a@b*: Aber was der Mann neben mir hier will ⓚⓛ keine Ahnung! Herr Dämler würde ihn wahrscheinlich 'nen Dünnbrettbohrer nennen. Hi hi hi!\n@c1@"
  en: "@a@b*: It's hard to imagine what the man next to me is gaining from all this, mind you. No doubt Mr. Ilton would call him a lightweight! Tee hee hee!\n@c1@"
  es: "@a@b*: Cuesta imaginar lo que ganará con todo esto el tipo que hay junto a mí. ¡Seguro que el Sr. Gilton le llamará pardillo! ¡Ji, ji, ji!\n@c1@"
  fr: "@a@b*ⓢ Difficile d'imaginer ce que mon voisin retiendra de tout ça. Sûrement que Monsieur Ilton le traiterait de petit rigoloⓠ Hi hi hiⓠ\n@c1@"
  it: "@a@b*: Il tizio accanto a me non sembra molto sveglio... Anzi, secondo me è un po' tonto. Jolly Etchelsior lo chiamerebbe sicuramente un ⓕpeso piumaⓖ! Eh! Eh! Eh!\n@c1@"
  ja: "@a@b＊「でも　となりの人は　いったい\n\tなにを　しにきてるのかしら！\n@c1@"
"60":
  de: "@a@b*: Miiiau.\n@c1@"
  en: "@a@b*: Meeeow.\n@c1@"
  es: "@a@b*: Miauuuu.\n@c1@"
  fr: "@a@b*ⓢ Miiiiaou.\n@c1@"
  it: "@a@b*: Miaaao.\n@c1@"
  ja: "@a@b＊「なーご。\n@c1@"
"61":
  de: "@a@b*: Die Leute nennen ihn Handelsgott, also wollte ich mal sehen, was an dem so Besonderes ist. Aber das ist ja bloß so 'n knittriger alter Kerl!\n@c2@"
  en: "@a@b*: People call him the God of Trade, so I had to come and see what was so special. But he's just a wrinkly old man!\n@c2@"
  es: "@a@b*: Le llaman el Dios de las Mercaderías, así que tenía que venir acá y ver lo que tenía de especial. Pero es un anciano arrugado nomás.\n@c2@"
  fr: "@a@b*ⓢ Les gens le surnomment le Dieu du Commerce, alors il fallait que je vienne voir ce qu'il avait de si spécial. Mais ce n'est qu'un vieil homme ridéⓠ\n@c2@"
  it: "@a@b*: La gente lo chiama il ⓕdio degli affariⓖ, quindi non potevo non venire a vedere di persona cos'abbia di tanto speciale.\n㈡\n*: Bah, a me non sembra altro che un vecchietto rugoso!\n@c2@"
  ja: "@a@b＊「商売の神様っていうから\n\tどんなりっぱな人かと思ったら\n\tただの　じいさんじゃないですか。\n@c2@"
"62":
  de: "@a@b*: Gotthilf Dämler heißt er. Hält gerade einen Vortrag, auf dem Podest da drüben.\n@c2@"
  en: "@a@b*: Conrad Ilton's his name. He's giving a lecture on that platform over there.\n@c2@"
  es: "@a@b*: Conrad Gilton es su nombre. Está dando clase en ese atril, allá.\n@c2@"
  fr: "@a@b*ⓢ Il s'appelle Conrad Ilton. Il donne une conférence sur l'estrade, là-bas.\n@c2@"
  it: "@a@b*: Si chiama Jolly Etchelsior. Sta tenendo una conferenza sulla piattaforma laggiù.\n@c2@"
  ja: "@a@b＊「そこの高台で　講義をしている\n\tヒルタン老人のことですよ。\n@c2@"
"63":
  de: "@a@b*: Mittlerweile ist Mintos ziemlich groß, aber bevor Gotthilf Dämler hierher kam, war hier gar nichts los.\n@c1@"
  en: "@a@b*: Mintos may be a big place now, but it was nothing before Conrad Ilton came along.\n@c1@"
  es: "@a@b*: Puede que ahora Mintos sea un lugar enorme y tal, pero no era nada antes de que Conrad Gilton apareciera.\n@c1@"
  fr: "@a@b*ⓢ Ringys est certes une grande ville, à présent, mais elle n'était rien avant que Conrad Ilton arrive.\n@c1@"
  it: "@a@b*: Mintos sarà anche un villaggio importante adesso, ma prima che arrivasse Jolly Etchelsior, qui non c'era niente.\n@c1@"
  ja: "@a@b＊「今でこそ　大きな町になった\n\tミントスですが　昔は\n\t小さな村でした。\n@c1@"
"64":
  de: "@a@b*: Er war's, der unsere wunderbare Herberge erbaut hat, und schon bald kamen die Reisenden in Scharen hierher.\n@c1@"
  en: "@a@b*: He's the one who built that lovely inn of ours, and once he did, it wasn't long before travellers started flocking here.\n@c1@"
  es: "@a@b*: Fue el que construyó esta posada y, cuando lo hizo, en nada, viajeros empezaron a dejarse caer por aquí.\n@c1@"
  fr: "@a@b*ⓢ C'est lui qui a construit notre charmante auberge. Et une fois construite, les voyageurs n'ont pas tardé à y venir en masse.\n@c1@"
  it: "@a@b*: È lui che ha fatto costruire la nostra bella locanda. I clienti hanno cominciato ad arrivare a frotte subito dopo l'apertura.\n@c1@"
  ja: "@a@b＊「宿屋のあるじ　ヒルタン老人が\n\tここにりっぱな宿を建ててから\n\tしだいに　旅人が集まるようになり…\n@c1@"
"65":
  de: "@a@b*: Der Ort ist praktisch über Nacht zu einer florierenden Stadt geworden. Und alles nur dank Herrn Dämler.\n@c1@"
  en: "@a@b*: The place transformed into a prosperous town almost overnight. And it's all thanks to Mr. Ilton.\n@c1@"
  es: "@a@b*: Este sitio se convirtió en una ciudad rica casi de la noche a la mañana.\nY todo gracias al Sr. Gilton.\n@c1@"
  fr: "@a@b*ⓢ L'endroit s'est transformé en une ville prospère presque en un clin d'œil.\nEt tout ça, grâce à Monsieur Ilton.\n@c1@"
  it: "@a@b*: Questo posto si è trasformato in un villaggio molto ricco nel giro di pochissimo tempo.\nE tutto questo grazie a Jolly Etchelsior.\n@c1@"
  ja: "@a@b＊「小さな村は　いつしか\n\t大きな町となりました。\n\tすべてヒルタン老人のおかげです。\n@c1@"
"66":
  de: "@a@b*: Wuff!\n@c2@"
