  fr: "@a@b*ⓢ La tsarine est revenue il n'y a pas longtemps.\nJe dois dire qu'elle n'avait pas l'air très heureuse.\n@c2@"
  it: "@a@b*: La Zarina è tornata poco fa.\nDevo dire che non mi è sembrata molto tranquilla.\n@c2@"
  ja: "@a@b＊「さきほど　お姫さまが\n\t戻ってこられたのですが\n\tなんだか元気がないようでした。\n@c2@"
"77":
  de: "@a@b*: Ob es ihrem Gefährten wohl wieder schlechter geht? Das muss ihr schreckliche Sorgen machen.\n@c2@"
  en: "@a@b*: I wonder if her companion's health has deteriorated. It must be a terrible worry for her.\n@c2@"
  es: "@a@b*: Me pregunto si la salud de su compañero se habrá resentido. Debe de ser muy duro para ella.\n@c2@"
  fr: "@a@b*ⓢ Je me demande si la santé de son compagnon s'est détériorée. Ça doit l'inquiéter terriblement.\n@c2@"
