"0":
  de: "@a@b*: Oink oink...\n@c2@"
  en: "@a@b*: Oink oink...\n@c2@"
  es: "@a@b*: Oink, oink...\n@c2@"
  fr: "@a@b*ⓢ Groïnk groïnk...\n@c2@"
  it: "@a@b*: Oink oink...\n@c2@"
  ja: "@a@b＊「ブー　ブー！\n@c2@"
"1":
  de: "@a@b*: Willkommen im mächtigen Reich Parthenia! Heimat des wundersamen Mutterkrauts, des besten Heilmittels, das die Menschheit kennt!\n@c2@"
  en: "@a@b*: Welcome to the mighty Empire of Parthenia!\nHome of the miraculous feverfew plant, the finest panacea known to man!\n@c2@"
  es: "@a@b*: ¡%H860%X%A120%XBienvenido%Z%B120%XBienvenida%Z%Y%R000%XBienvenidas%YBienvenidos%Z%Z al poderoso Imperio de Parthenia!\n¡Lugar donde crece la milagrosa planta reducefiebre, la mejor panacea conocida por el hombre!\n@c2@"
  fr: "@a@b*ⓢ Bienvenue dans le puissant empire de Parthéniaⓠ\nC'est ici que pousse la miraculeuse camomille, la meilleure panacée connue de l'hommeⓠ\n@c2@"
  it: "@a@b*: %H860%X%A120%XBenvenuto%Z%B120%XBenvenuta%Z%Y%R000%XBenvenute%YBenvenuti%Z%Z nel valoroso Impero di Parthenia.\nLa nostra terra produce la miracolosa pianta di parthenio, la miglior panacea che esista al mondo!\n@c2@"
  ja: "@a@b＊「ここは　ソレッタの国。\n\tどんな病気も治す　パデキアの\n\t特産地だよ！\n@c2@"
"2":
  de: "@a@b*: Du liebe Güte!\nSind das etwa Mutterkrautsamen?\n@c2@"
  en: "@a@b*: Goodness gracious!\nAre those feverfew seeds?\n@c2@"
  es: "@a@b*: ¡Por la Diosa!\n¿Eso son simientes reducefiebre?\n@c2@"
  fr: "@a@b*ⓢ Par tous les saintsⓠ\nCe sont des graines de camomilleⓡ\n@c2@"
  it: "@a@b*: Dea benedetta!\nMa quelli non saranno mica Semi di parthenio?!\n@c2@"
  ja: "@a@b＊「へー！\n\tあんたらが　パデキアの種を？\n\tおったまげたなあ！\n@c2@"
"3":
  de: "@a@bKeine Antwort...\n@c2@"
  en: "@a@bNo answer...\n@c2@"
  es: "@a@bNo hay respuesta...\n@c2@"
  fr: "@a@bPas de réponse...\n@c2@"
  it: "@a@bNessuna risposta...\n@c2@"
  ja: "@a@b返事がない……。\n@c2@"
"4":
  de: "@a@bDas ist nur eine Vogelscheuche.\n@c2@"
  en: "@a@bIt's just a scarecrow.\n@c2@"
  es: "@a@bNo es más que un espantapájaros.\n@c2@"
  fr: "@a@bCe n'est qu'un épouvantail.\n@c2@"
  it: "@a@bÈ solo uno spaventapasseri. \n@c2@"
  ja: "@a@bただの　かかしのようだ。\n@c2@"
"5":
  de: "@a@b*: Willkommen beim Kaiserlichen Palast.\nTretet doch ein.\n@c2@"
  en: "@a@b*: Welcome to the Imperial Palace.\nYou may enter at will.\n@c2@"
  es: "@a@b*: %H860%X%A120%XBienvenido%Z%B120%XBienvenida%Z%Y%R000%XBienvenidas%YBienvenidos%Z%Z al Palacio Imperial.\n%H860%XPuede%YPueden%Z entrar si así lo %H860%Xdesea%Ydesean%Z.\n@c2@"
  fr: "@a@b*ⓢ Bienvenue au palais impérial.\nVous pouvez entrer à votre guise.\n@c2@"
  it: "@a@b*: Questo è il palazzo imperiale.\n%H860%XPuoi%YPotete%Z entrare liberamente.\n@c2@"
  ja: "@a@b＊「ようこそ　ソレッタのお城へ！\n\tさあ　どうぞ中へ。\n@c2@"
"6":
  de: "@a@b*: Muuh, muuh...\n@c2@"
  en: "@a@b*: Moooo, moooo...\n@c2@"
  es: "@a@b*: Muuuu, muuuu...\n@c2@"
  fr: "@a@b*ⓢ Meeeuuh, meeeuuh...\n@c2@"
  it: "@a@b*: Muuu, muuu...\n@c2@"
  ja: "@a@b＊「ブモッ　ンモー！\n@c2@"
"7":
  de: "@a@b*: Lotte ist meine beste Freundin, nicht, Lottchen?\n@c1@"
  en: "@a@b*: Marmaduke and I are the best of friends, aren't we Marmaduke?\n@c1@"
  es: "@a@b*: Margarita y yo somos grandes amigos, ¿verdad, Margarita?\n@c1@"
  fr: "@a@b*ⓢ Mamanova et moi, on est les meilleurs amis du monde, hein Mamanovaⓡ\n@c1@"
  it: "@a@b*: Io e Cicciola siamo ottimi amici. Non è vero, Cicciola?\n@c1@"
  ja: "@a@b＊「牛のユッキーと　オイラは\n\t大のなかよしなんだべ。\n\tなっ　ユッキー。\n@c1@"
"8":
  de: "@a@b*: Muuh, muuh!\n@c1@"
  en: "@a@b*: Moo. Moooo!\n@c1@"
  es: "@a@b*: Muu. ¡Muuuu!\n@c1@"
  fr: "@a@b*ⓢ Meuh. Meeeuuuhⓠ\n@c1@"
  it: "@a@b*: Muuu. Muuuuu!\n@c1@"
  ja: "@a@b＊「ウモッ　ウモモー！\n@c1@"
"9":
  de: "@a@b*: Muuuh!\n@c2@"
  en: "@a@b*: Moooo!\n@c2@"
  es: "@a@b*: ¡Muuuu!\n@c2@"
  fr: "@a@b*ⓢ Meeeuuhⓠ\n@c2@"
  it: "@a@b*: Muuuuu!\n@c2@"
  ja: "@a@b＊「ウモー！\n@c2@"
"10":
  de: "@a@b*: Ich bewirtschafte diese Äcker jetzt schon seit über dreißig Jahren.\n@c2@"
  en: "@a@b*: Iⓙve been ploughing these fields for more than thirty years, I have.\n@c2@"
  es: "@a@b*: Llevo arando estos campos desde hace más de seis lustros.\n@c2@"
  fr: "@a@b*ⓢ Je laboure ces champs depuis plus de trente ans.\n@c2@"
  it: "@a@b*: Mi occupo di questi campi da più di trent'anni ormai.\n@c2@"
  ja: "@a@b＊「おいらは　よーっとぉ\n\t畑たがやし　３０年ーっとぉ！\n@c2@"
"11":
  de: "@a@b*: Ich säe jetzt wieder Mutterkraut. Darin liegt jetzt die Zukunft, %H860%X%A120%Xmein Herr%Z%B120%Xmeine Dame%Z%Yliebe Leute%Z!\n@c2@"
  en: "@a@b*: These days I'm working on the feverfew crop again. That's the future now, %A120%Xsir%Z%B120%Xmadam%Z!\n@c2@"
  es: "@a@b*: Últimamente estoy trabajando de nuevo en la cosecha de reducefiebre. ¡Es el futuro, %H860%X%A120%Xcaballero%Z%B120%Xseñora%Z%Y%R000%Xseñoras%Ycaballeros%Z%Z!\n@c2@"
  fr: "@a@b*ⓢ Maintenant, je me suis relancé dans les plantations de camomille.\nC'est ça, l'avenir, %A120%Xmon bon monsieur%Z%B120%Xma brave dame%Zⓠ\n@c2@"
  it: "@a@b*: In questo periodo sto lavorando di nuovo al raccolto di parthenio. Adesso è questo il futuro, %A120%Xsignore mio%Z%B120%Xsignora mia%Z!\n@c2@"
  ja: "@a@b＊「これからは　がんばって\n\tパデキアを育てるだよ。\n\tそれっ　よーっとぉ！\n@c2@"
"12":
  de: "@aKaiser Claudius@bAh, das Mutterkraut! Beim kaiserlichen Schweiß auf meiner kaiserlichen Stirn, mein Reich soll wieder blühen und florieren!\n@c2@"
  en: "@aEmperor Claudius@bAh, my feverfew! I'm redoubling my efforts in the fields now. By the Imperial Sweat of my Imperial Brow, the Empire shall flourish once more!\n@c2@"
  es: "@aEmperador Claudius@b¡Ah, mi reducefiebre! Estoy redoblando mis esfuerzos en los campos. ¡Por el Sudor Imperial de mi Imperial Frente, el Imperio volverá a prosperar!\n@c2@"
  fr: "@aEmpereur Claudius@bAh, ma camomilleⓠ Je redouble d'efforts dans les champs, à présent. Grâce à l'impériale sueur de mon impérial front, l'empire redeviendra prospèreⓠ\n@c2@"
  it: "@aImperatore Claudio@bAh, le mie piante di parthenio! Sto sudando sette imperiali camicie nei campi affinché il mio Impero torni a prosperare come un tempo!\n@c2@"
  ja: "@a@b王「パデキア　ばんざい！\n\tこれで今まで以上に　のら仕事に\n\tせいが出せるわい！　わっはっはっ！\n@c2@"
"13":
  de: "@a@b*: Miauuu.\n@c1@"
  en: "@a@b*: Meooow.\n@c1@"
  es: "@a@b*: Miaaau.\n@c1@"
  fr: "@a@b*ⓢ Miaaaaou.\n@c1@"
  it: "@a@b*: Miaaao.\n@c1@"
  ja: "@a@b＊「みゃーお。\n@c1@"
"14":
  de: "@a@b*: Ah! Ihr kommt von Mintos, nicht wahr? Dorthin ist meine Tochter gezogen, als sie heiratete, wisst Ihr.\n@c2@"
  en: "@a@b*: Ah! You arrived here from Mintos, did you?\nMy daughter moved there when she was married, you know.\n@c2@"
  es: "@a@b*: ¡Ah! %H860%XLlega procedente%YLlegáis procedentes%Z de Mintos, ¿no es así?\nMi hija se trasladó a vivir allí cuando se casó.\n@c2@"
  fr: "@a@b*ⓢ Ahⓠ Vous arrivez de Ringys, c'est çaⓡ\nMa fille s'est installée là-bas après son mariage, vous savez.\n@c2@"
  it: "@a@b*: Ah! %H860%XArrivi%YArrivate%Z da Mintos, vero?\nMia figlia si è trasferita lì dopo essersi sposata.\n@c2@"
  ja: "@a@b＊「ほほう　ミントスから来なすったか。\n\tあの町には　わしの娘が\n\tとついでいってのお。\n@c2@"
"15":
  de: "@a@b*: Und jetzt habe ich dort auch ein paar goldige kleine Enkelkinder. Wie es ihnen wohl geht?\n@c2@"
  en: "@a@b*: Iⓙve a couple of delightful grandchildren there now, too. I wonder how they are...\n@c2@"
  es: "@a@b*: Ahora tengo allí dos nietecillos deliciosos. Me pregunto cómo estarán...\n@c2@"
  fr: "@a@b*ⓢ À présent, j'ai aussi là-bas quelques adorables petits-enfants. Je me demande comment ils vont...\n@c2@"
  it: "@a@b*: Ora ho anche due deliziosi nipoti. Chissà come stanno...\n@c2@"
  ja: "@a@b＊「かわいい　ふたりの孫が\n\tおるんじゃよ。\n\t元気にしとるかのお……。\n@c2@"
"16":
  de: "@a@b*: Ihr seid im Königlichen Thronsaal!\n@c2@"
  en: "@a@b*: You are in the Imperial Throneroom!\n@c2@"
  es: "@a@b*: ¡%H860%XEstá usted%YEstán ustedes%Z en la sala del trono!\n@c2@"
  fr: "@a@b*ⓢ Vous vous trouvez près de la chambre à coucher impérialeⓠ\n@c2@"
  it: "@a@b*: %H860%XSei%YSiete%Z nella sala del trono imperiale!\n@c2@"
  ja: "@a@b＊「ここは　ソレッタ王のお部屋です。\n@c2@"
"17":
  de: "@a@b*: Ihr seid unsere Rettung!\nEndlich geht es mit unserem Reich wieder aufwärts.\n@c2@"
  en: "@a@b*: You are our %H860%Xsaviour%Ysaviours%Z!\nThe Empire is back on its feet at last.\n@c2@"
  es: "@a@b*: ¡%H860%XEres %A120%Xnuestro salvador%Z%B120%Xnuestra salvadora%Z%YSois %R000%Xnuestras salvadoras%Ynuestros salvadores%Z%Z!\nPor fin, el Imperio vuelve a prosperar.\n@c2@"
  fr: "@a@b*ⓢ Vous êtes %H860%X%A120%Xnotre sauveur%Z%B120%Xnotre sauveuse%Z%Y%R000%Xnos sauveuses%Ynos sauveurs%Z%Zⓠ\nL'empire est de nouveau sur pied.\n@c2@"
  it: "@a@b*: %H860%XCi hai salvati%YCi avete salvati%Z!\nL'Impero sta tornando al suo passato splendore!\n@c2@"
  ja: "@a@b＊「そなたらは　救いの神！\n\tこれで　この国もあんたいじゃ！\n@c2@"
"18":
  de: "@a@b*: Ich möchte Euch gern persönlich dafür danken, dass Ihr die Mutterkrautsamen aus der Kaiserlichen Kammer zurückgeholt habt.\n@c2@"
  en: "@a@b*: I should like to thank you personally for recovering the feverfew seeds from the Parthenian Pantry.\n@c2@"
  es: "@a@b*: Me gustaría dar%H860%Xle%Yos%Z las gracias personalmente por recuperar las simientes reducefiebre de las Catacumbas de Parthenia.\n@c2@"
  fr: "@a@b*ⓢ J'aimerais vous remercier personnellement d'avoir récupéré les graines de camomille de la Cave impériale.\n@c2@"
  it: "@a@b*: Vorrei %H860%Xringraziarti%Yringraziarvi%Z personalmente per aver recuperato i Semi di parthenio dalla Sala del tesoro.\n@c2@"
  ja: "@a@b＊「パデキアの種を\n\tどうも　ありがとうございました。\n@c2@"
"19":
  de: "@a@b*: Endlich wird unser großes Reich wieder blühen und gedeihen.\n@c2@"
  en: "@a@b*: At last our great empire will prosper again.\n@c2@"
  es: "@a@b*: Nuestro gran imperio florecerá de nuevo al fin.\n@c2@"
  fr: "@a@b*ⓢ Notre grand empire va enfin retrouver sa prospérité d'antan.\n@c2@"
  it: "@a@b*: Il nostro grande Impero tornerà a essere più ricco di prima.\n@c2@"
  ja: "@a@b＊「これで　この国も\n\t豊かになることでしょう！\n@c2@"
"20":
  de: "@a@b*: Zzz... Zzz...\nWach auf, Lotte...\nWach... zzz...\n@c1@"
  en: "@a@b*: Zzz... Zzz...\nWake up, Marmaduke...\nWake...zzz...\n@c1@"
  es: "@a@b*: Zzz... Zzz...\nDespierta, Margarita...\nDespierta... zzz...\n@c1@"
  fr: "@a@b*ⓢ Zzz... zzz...\nRéveille-toi, Mamanova...\nDebout... zzz...\n@c1@"
  it: "@a@b*: Zzz... Zzz...\nSvegliati, Cicciola...\nSveglia... Zzz...\n@c1@"
  ja: "@a@b＊「むにゃむにゃ……。\n\tユッキー　はやぐ\n\tおっきぐなれよ……むにゃ。\n@c1@"
"21":
  de: "@a@b*: Ooh! Aua, aua, autsch!\nMich hat eine Qualle erwischt!\n@c2@"
  en: "@a@b*: Ooh! Ouch, ouch, ouch!\nI've been stung by a man o' war!\n@c2@"
  es: "@a@b*: ¡Ooh! ¡Ay, ay, ay!\n¡Me ha picado una medusa guerrera!\n@c2@"
  fr: "@a@b*ⓢ Oohⓠ Ouille, ouille, ouilleⓠ\nJ'ai été piqué par une méduseⓠ\n@c2@"
  it: "@a@b*: Aaah! Ahi, ahi, ahi!\nMi ha punto una Medusa!\n@c2@"
  ja: "@a@b＊「あたたたたー！\n\tしびれくらげに刺されたー！\n@c2@"
"22":
  de: "@a@b*: Willkommen beim Kaiserlichen Palast.\nDer Kaiser ruht gerade.\n@c2@"
  en: "@a@b*: Welcome to the Imperial Palace.\nThe Emperor is currently taking his repose.\n@c2@"
  es: "@a@b*: %H860%X%A120%XBienvenido%Z%B120%XBienvenida%Z%Y%R000%XBienvenidas%YBienvenidos%Z%Z al Palacio Imperial.\nEl Emperador se encuentra descansando en estos momentos.\n@c2@"
  fr: "@a@b*ⓢ Bienvenue au palais impérial.\nL'empereur se repose, pour l'instant.\n@c2@"
  it: "@a@b*: %H860%XTi%YVi%Z do il benvenuto. Questo è il palazzo imperiale.\nAl momento l'Imperatore sta riposando.\n@c2@"
  ja: "@a@b＊「ここは　ソレッタのお城。\n\tしかし　王さまは　すでに\n\tおやすみであられる。\n@c2@"
"23":
  de: "@a@b*: Zzz...\n@c2@"
  en: "@a@b*: Zzz...\n@c2@"
  es: "@a@b*: Zzz...\n@c2@"
  fr: "@a@b*ⓢ Zzz...\n@c2@"
  it: "@a@b*: Zzz...\n@c2@"
  ja: "@a@b＊「すやすや……。\n@c2@"
"24":
  de: "@a@b*: Ha-püh... Ah-hm?\nHeutzutage bin ich schon froh, ein Dach über dem Kopf zu haben.\n@c2@"
  en: "@a@b*: Ah-phew... Ah-hm?\nIⓙm just happy to have a roof over my head these days.\n@c2@"
  es: "@a@b*: Ah, fiuuu... Ah, mmmm.\nMe complace tener un sitio bajo techo donde dormir estos días.\n@c2@"
  fr: "@a@b*ⓢ Ron-pfff... Ah-mmmⓡ\nJe suis déjà bien content d'avoir un toit sur la tête, ces temps-ci.\n@c2@"
  it: "@a@b*: Ronf... Eh?\nCon questi chiari di luna, avere un tetto sopra la testa è già un lusso.\n@c2@"
  ja: "@a@b＊「ぐうぐう……。\n\tこうして雨つゆをしのげるだけで\n\tおらは　幸せだよ。\n@c2@"
"25":
  de: "@a@b*: Ha-püh...\n@c2@"
  en: "@a@b*: Ah-phew...\n@c2@"
  es: "@a@b*: Ah, fiuu...\n@c2@"
  fr: "@a@b*ⓢ Ron-pfff...\n@c2@"
  it: "@a@b*: Ah-phew...\n@c2@"
  ja: "@a@b＊「ぐうぐう……。\n@c2@"
"26":
  de: "@aKaiser Claudius@bHa-püh... Ha-püh...\nHa-Mutter-püh-kraut...\n@c2@"
  en: "@aEmperor Claudius@bAh-few... Ah-few...\nAh-fever-few...\n@c2@"
  es: "@aEmperador Claudius@bAaa-fiuu... Aaa-fiuu...\nAaa-reducefiuuu...\n@c2@"
  fr: "@aEmpereur Claudius@bRon-pfff... Ca-mm...\nCa-mo-millezzz...\n@c2@"
  it: "@aImperatore Claudio@bRonf... Par-ronf-thenio...\nRonf...\n@c2@"
  ja: "@a@b王「ぐおーぐおー\n@c2@"
"27":
  de: "@a@b*: Alles klar? Willkommen in Mintos!\n@c1@"
  en: "@a@b*: Awright? Welcome to Mintos!\n@c1@"
  es: "@a@b*: ¿Qué tal? %H860%X%A120%XBienvenido%Z%B120%XBienvenida%Z%Y%R000%XBienvenidas%YBienvenidos%Z%Z a Mintos.\n@c1@"
  fr: "@a@b*ⓢ Ça vaⓡ Bienvenue à Ringysⓠ\n@c1@"
  it: "@a@b*: Salve! Questa è Mintos!\n@c1@"
  ja: "@a@b＊「ここは　ミントスの町。\n@c1@"
"28":
  de: "@a@b*: Ihr seid doch sicher da, um den berühmten Gotthilf Dämler zu sehen, oder?\n@c1@"
  en: "@a@b*: No doubt you're 'ere to see the famous Conrad 'Ilton, eh?\n@c1@"
  es: "@a@b*: Seguro que %H860%Xhas%Yhabéis%Z venido para ver al famoso Conrad Gilton ese.\n@c1@"
  fr: "@a@b*ⓢ Vous êtes sûrement là pour voir le célèbre Conrad Ilton, nonⓡ\n@c1@"
  it: "@a@b*: Sicuramente %H860%Xsei%Ysiete%Z qui per incontrare il famoso Jolly Etchelsior, eh?\n@c1@"
  ja: "@a@b＊「商売をする者にとっては\n\tあこがれの　ヒルタン老人が\n\tいる町ですわ。\n@c1@"
"29":
  de: "@a@b*: Die Leute kommen aus der ganzen Welt, um seine Vorträge zu hören. Er ist das Idol der Händler.\n@c1@"
  en: "@a@b*: People come from all over the world to 'ear 'im lecture. He's the 'ero of traders ev'rywhere.\n@c1@"
  es: "@a@b*: Llega gente de todos lados para oírle dar sus charlas. Es el héroe de los comerciantes de todo el mundo.\n@c1@"
  fr: "@a@b*ⓢ Des gens viennent du monde entier pour écouter ses conférences. C'est le héros d'tous les commerçants, partout dans l'monde.\n@c1@"
  it: "@a@b*: Viene gente da tutto il mondo per ascoltare le sue conferenze. È l'esempio a cui si ispirano tutti coloro che vogliono diventare uomini d'affari di successo.\n@c1@"
  ja: "@a@b＊「さまざまな人たちが\n\tヒルタン老人の話を聞くため\n\tこの町を　訪れるのです。\n@c1@"
"30":
  de: "@a@b*: Dem fremden Priester in der Herberge geht's gar nicht gut.\n@c3@"
  en: "@a@b*: That foreign priest stayin' at the inn is in a right old state.\n@c3@"
  es: "@a@b*: Ese sacerdote extranjero que está en la posada está hecho una piltrafa.\n@c3@"
  fr: "@a@b*ⓢ Ce prêtre étranger qui loge à l'auberge est dans un sale état.\n@c3@"
  it: "@a@b*: Quel prete straniero che alloggia alla locanda è sull'orlo dell'esaurimento nervoso.\n@c3@"
  ja: "@a@b＊「宿に泊まっている\n\t旅の神官が\n\t重い病に　倒れたそうだな。\n@c3@"
"31":
  de: "@a@b*: Dem tät 'n bisschen Mutterkrautwurzel gut tun. Wenn man davon was in die Finger kriegen könnte, könnt man 'n Vermögen machen!\n@c3@"
  en: "@a@b*: Wot 'e needs is some feverfew root.\nBlimey, if you could get some o' that an' sell 'it, you'd make a fortune!\n@c3@"
  es: "@a@b*: Lo que necesita es un poco de raíz reducefiebre.\nJo, si %H860%Xpudieras%Ypudierais%Z conseguir un poco y venderla %H860%Xte forrarías%Yos forraríais%Z.\n@c3@"
  fr: "@a@b*ⓢ Ce qu'il lui faut, c'est de la racine de camomille. Sacrebleu, si c'était possible d'en avoir et d'en vendre, il y aurait de quoi faire fortuneⓠ\n@c3@"
  it: "@a@b*: Dice che gli serve una Radice di parthenio.\nSe %H860%Xtu riuscissi%Yriusciste%Z a procurargliene una, %H860%Xpotresti%Ypotreste%Z vendergliela a peso d'oro!\n@c3@"
  ja: "@a@b＊「伝説の薬草　パデキアさえあれば\n\tきっと　治るだろうに……。\n@c3@"
"32":
  de: "@a@b*: Wenn Ihr 'n nettes Zimmer sucht, seid Ihr hier goldrichtig!\n@c2@"
  en: "@a@b*: If you're lookin' for a room, you've come to the right place!\n@c2@"
  es: "@a@b*: Si %H860%Xbuscas%Ybuscáis%Z un sitio donde planchar la oreja, %H860%Xestás%Yestáis%Z en el lugar perfecto.\n@c2@"
  fr: "@a@b*ⓢ Si vous cherchez une chambre, vous êtes au bon endroitⓠ\n@c2@"
