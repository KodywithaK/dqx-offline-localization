  de: "@a@b*: Bitte, mein Sohn, kein Wort mehr.\nMein Leben ist der Göttin geweiht.\n@c1@"
  en: "@a@b*: Please, my child, say no more.\nI am promised to the Goddess.\n@c1@"
  es: "@a@b*: Por favor, hijo mío, no digas nada más.\nEstoy prometida a la Diosa.\n@c1@"
  fr: "@a@b*ⓢ Je vous en prie, mon enfant, n'en dites pas plus.\nJe suis promise à la Déesse.\n@c1@"
  it: "@a@b*: Ti scongiuro, non dire più nulla.\nLa mia vita appartiene alla dea.\n@c1@"
  ja: "@a@b＊「いけませんわ。\n\t私は　神に仕える身。\n\t……ぽっ。\n@c1@"
"84":
  de: "@aGotthilf Dämler@bAls i mei Herberg eröffnet hab, wollt i eigentlich nur meine Gäschde nach dem Schatz ausfrage.\n@c2@"
  en: "@aConrad 'Ilton@bI opened up me inn thinkin' I could pick travellers' brains about where that treasure on me map might be.\n@c2@"
  es: "@aConrad Gilton@bAbrí la posada con la idea de ver si podía sacar información a los viajeros y para averiguar dónde estaba el tesoro ese del mapa.\n@c2@"
  fr: "@aConrad Ilton@bJ'ai ouvert mon auberge dans l'idée d'interroger les voyageurs sur l'endroit où pourrait se trouver ce trésor, sur la carte.\n@c2@"
  it: "@aJolly Etchelsior@bQuando ho aperto la locanda, ho pensato che i clienti avrebbero potuto darmi qualche indicazione per individuare la posizione del tesoro sulla mappa.\n@c2@"
  ja: "@a@bヒルタン「宝の地図の　秘密を解くため\n\t旅人から情報を聞こうと\n\t宿屋を　始めたのだが……。\n@c2@"
"85":
  de: "@aGotthilf Dämler@bAber i bin jetzt reich g'nug, denk i mir. I han koi Zeit meh, irgendwelche Schätz zu suche.\n@c2@"
  en: "@aConrad 'Ilton@bBut I reckon I'm prob'ly rich enough now, eh?\nI ain't got time to bother wiv treasure no more.\n@c2@"
  es: "@aConrad Gilton@bPero parece que ya tengo suficiente pasta, ¿verdad?\nYa no tengo más tiempo que perder con ese tesoro.\n@c2@"
  fr: "@aConrad Ilton@bMais aujourd'hui, je suis assez riche, nonⓡ\nJe n'ai plus le temps de me préoccuper de ce trésor.\n@c2@"
  it: "@aJolly Etchelsior@bMa credo di aver già guadagnato abbastanza quattrini, giusto? Non ho tempo da perdere appresso ai tesori in questo momento.\n@c2@"
  ja: "@a@bヒルタン「わしは　もう\n\tじゅうぶん　金持ちになった。\n\tもはや　宝などいらぬのじゃ。\n@c2@"
