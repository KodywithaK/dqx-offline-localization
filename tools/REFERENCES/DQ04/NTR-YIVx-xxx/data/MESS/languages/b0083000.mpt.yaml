  it: "@a@b*: Bau!\n@c2@"
  ja: "@a@b＊「ばうばうばう！\n@c2@"
"67":
  de: "@a@b*: Als ich noch klein war, war ich auch mal total krank, so wie der Typ in der Herberge.\n@c1@"
  en: "@a@b*: When I was a bit younger, I was really ill just like that bloke at the inn.\n@c1@"
  es: "@a@b*: Cuando era un mico, estuve realmente enfermo, como el tipo ese de la posada.\n@c1@"
