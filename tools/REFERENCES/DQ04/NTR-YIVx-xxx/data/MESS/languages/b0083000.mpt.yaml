  it: "@a@b*: Da piccolo sono stato malato, proprio come quel tizio alla locanda.\n@c1@"
  ja: "@a@b＊「ぼく　もっと小さいとき\n\tひどい病気に　かかったの。\n@c1@"
"68":
  de: "@a@b*: Aber dann hat mir 'ne Frau aus Parthena 'n bisschen Mutterkrautwurzel gegeben.\nUnd im Nu ging's mir wieder besser.\n@c1@"
  en: "@a@b*: But then some woman from Parthenia come along an' give me some feverfew root.\nI was right as rain in no time.\n@c1@"
  es: "@a@b*: Pero entonces apareció una mujer de Parthenia y me dio algunas raíces reducefiebre.\nY en nada, me encontraba genial.\n@c1@"
  fr: "@a@b*ⓢ Mais ensuite, une dame de Parthénia est venue et m'a donné de la racine de camomille.\nTrès vite, j'ai été complètement guéri.\n@c1@"
  it: "@a@b*: Poi è arrivata una donna di Parthenia e mi ha dato un po' di Radice di parthenio.\nSono guarito in un battibaleno!\n@c1@"
  ja: "@a@b＊「でも　ソレッタ村のおじいちゃんが\n\tパデキアの根っこを\n\t持ってきてくれて　治ったんだよ。\n@c1@"
"69":
  de: "@a@b*: Mann, sind wir nicht klasse? \nWir helfen nämlich bei der Hausarbeit mit!\n@c1@"
  en: "@a@b*: We're bloomin' good, eh?\nWe're 'elpin' out wiv the 'ousework, see.\n@c1@"
  es: "@a@b*: Pues no somos buenos ni nada.\nEstamos ayudando con las cosas de casa.\n@c1@"
  fr: "@a@b*ⓢ On est forts, heinⓡ\nOn aide à faire le ménage, vous voyez.\n@c1@"
  it: "@a@b*: Siamo troppo bravi, vero?\nStiamo dando una mano nelle faccende di casa.\n@c1@"
  ja: "@a@b＊「えらいでしょ　ぼくたち！\n\tおうちの　おてつだいを\n\tしてるんだよ。\n@c1@"
