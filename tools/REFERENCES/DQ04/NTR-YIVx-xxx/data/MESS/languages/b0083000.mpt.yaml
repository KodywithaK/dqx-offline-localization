"56":
  de: "@a@b*: Der alte Dämler ist 'n echter Taifun ⓚⓛ äh, ich meine, 'n echtes Teichhuhn. Ähm, na ja, jedenfalls ist er 'n echtes Geschäftsgenie.\n@c2@"
  en: "@a@b*: Old Ilton is a real enterpreterⓚⓛ I mean, entropronerd... Er, he certainly knows a thing or two when it comes to business, anyway.\n@c2@"
  es: "@a@b*: El viejo Gilton es un verdadero emprendredⓚⓛ quiero decir, entremprendr... Bueno, que sabe lo que hay que saber para hacer negocios.\n@c2@"
  fr: "@a@b*ⓢ Ce Ilton est un véritable enterpréteur... euh, je veux dire, intropreneur... Enfin bref, il en connaît un rayon sur les affaires.\n@c2@"
  it: "@a@b*: Il vecchio Jolly Etchelsior è un vero comprenditore... Cioè, imprendituttore... Insomma, è uno che con gli affari ci sa fare.\n@c2@"
  ja: "@a@b＊「いやはや　まったく\n\tヒルタン老人の話は\n\tためになります。\n@c2@"
"57":
  de: "@a@b*: Jedenfalls findet er, man müsste den Leuten Ideen verkaufen und nicht bloß Sachen. Klingt kompliziert, was?\n@c2@"
