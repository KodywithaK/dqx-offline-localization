"82":
  de: "@a@b*: Also, um ehrlich zu sein, seit ich Euch das erste Mal gesehen habe ...\n@c3@"
  en: "@a@b*: Truth is, ever since the first time I saw you...\n@c3@"
  es: "@a@b*: Pero es que desde la primera vez que te vi...\n@c3@"
  fr: "@a@b*ⓢ La vérité, c'est que dès la première fois où je vous ai vue...\n@c3@"
  it: "@a@b*: Devo confessarti che fin dalla prima volta che ti ho vista...\n@c3@"
  ja: "@a@b＊「じ　じつは\n\tあなたを　ひと目見たときから\n\t……ぽっ。\n@c3@"
