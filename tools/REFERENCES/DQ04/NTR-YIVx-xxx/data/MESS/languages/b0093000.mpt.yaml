  fr: "@a@b*ⓢ Je dois vous remercier. Il semblerait que la paix soit revenue dans notre pays.\n@c2@"
  it: "@a@b*: Voglio %H860%Xringraziarti%Yringraziarvi%Z. Sembra che la pace sia finalmente tornata sulla nostra terra.\n@c2@"
  ja: "@a@b＊「どうも　ありがとうございました。\n\tこの国にも　平和が\n\tおとずれそうです。\n@c2@"
