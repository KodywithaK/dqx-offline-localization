  ja: "@a@bキングレオ「思い出せん……。\n\tわたしは　いったい\n\t今まで　なにをしていたのだ……。\n@c2@"
"27":
  de: "@a@bDas ist die Statue eines tapferen Kriegers.\n@c0@"
