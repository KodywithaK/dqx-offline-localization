  de: "@a@b*: Non! Nischt das! Das 'alte isch nischt aus!\nNischt das Ge'eimnis der Evolution!\nÄhem... Was ist denn das für ein Ge'eimnis?\n@c1@"
  en: "@a@b*: Non! Non! I cannot bear it!\nNot ze Secret of Evolution!\nErm...what is zis Secret of Evolution?\n@c1@"
  es: "@a@b*: ¡Non! ¡Non! ¡No puedo sopogrtagrlo!\n¡El Secgreto de la Evolución no!\nEeeh... ¿qué es ese Secgreto de la Evolución?\n@c1@"
  fr: "@a@b*ⓢ Noⓠ Noⓠ Je ne veux pasⓠ\nPas le Secret of Évolutionⓠ\nEuh... what is le Secret of Évolutionⓡ\n@c1@"
