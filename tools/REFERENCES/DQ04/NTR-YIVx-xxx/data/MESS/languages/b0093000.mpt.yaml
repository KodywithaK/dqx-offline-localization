"3":
  de: "@aMedi@bIch habe gerade meinen Freund Ragnar mit einem dicken Grinsen im Gesicht vorbeigehen sehen.\n@c2@"
  en: "@aHealie@bI just saw my friend Ragnar goo by with a great big smile on his face.\n@c2@"
  es: "@aCuri@bAcabo de ver a mi amigo Ragnar pasar con una gran sonrisa en su rostro.\n@c2@"
  fr: "@aDoc@bJe viens de voir mon ami Ragnar passer.\nIl avait un grand sourire.\n@c2@"
  it: "@aHealie@bHo appena visto il mio amico Galiardo sorridere felice come una pasqua.\n@c2@"
  ja: "@a@bホイミン「さきほど　ライアンさまが\n\tうれしそうに　外に出ていくのを\n\tお見かけしました。\n@c2@"
