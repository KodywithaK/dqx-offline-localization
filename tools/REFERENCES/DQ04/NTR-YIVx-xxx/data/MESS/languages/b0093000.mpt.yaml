"6":
  de: "@a@b*: Isch 'öre die Stimmen unter meinen Füßen nischt mehr. Was könnte das gewesen sein?\n@c3@"
  en: "@a@b*: Ze voices I could 'ear coming from under my feet are no more. What could zey 'ave been?\n@c3@"
  es: "@a@b*: Ya no se escuchan las voces que pgrocedían de bajo mis pies. ¿Quién podgria segr?\n@c3@"
  fr: "@a@b*ⓢ Les voices qui venaient du sol se sont tues.\nJe me demande bien ce que c'étaitⓡ\n@c3@"
  it: "@a@b*: Le vosci que sentivo provenire da sotto i piedi non sci sono più. Che cosa saranno mai state?\n@c3@"
  ja: "@a@b＊「足元から聞こえていた\n\t人の声が　しなくなったな。\n\tなんだったのだ　あれは？\n@c3@"
"7":
  de: "@a@b*: Angeblisch befindet sisch eine ganz neue Stadt in der Wüste in der Nä'e von Samokswa im Norden.\n@c2@"
  en: "@a@b*: Zey say zere is a new town set up in ze desert near Zamoksva to ze north.\n@c2@"
  es: "@a@b*: Dicen que se ha establecido una ciudad nueva en el desiegrto, cegrca de Zamoksva, al nogrte.\n@c2@"
  fr: "@a@b*ⓢ Il paraît qu'une nouvelle city a été construite dans le désert au nord, près de Zamoksva.\n@c2@"
