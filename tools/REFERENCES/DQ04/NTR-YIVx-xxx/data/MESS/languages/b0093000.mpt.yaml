"23":
  de: "@a@b*: Was?! Isch lag schon beina'e auf dem Operationstisch des Marquis pour les expériences mit dem Ge'eimnis der Evolution?\n@c1@"
  en: "@a@b*: What? I was very nearly on ze operating table for ze Marquis's expérimentation into ze Secret of Evolution?\n@c1@"
