  fr: "@a@bEn fait, nonⓠ Il est vivantⓠ\n@c2@"
  it: "@a@bOh no, niente affatto! È vivo!\n@c2@"
  ja: "@a@bと　思ったら\nがい骨のお化けだった！\n@c2@"
"28":
  de: "@a@b*: %H860%XLass%YLasst%Z mich allein. Ich will in Frieden ruhen! Ist das denn zu viel verlangt?!\n@c2@"
  en: "@a@b*: Leave me alone. I'm trying to rest in peace!\nYou don't want to rattle my ribcage!\n@c2@"
  es: "@a@b*: %H860%XDéjame%YDejadme%Z en paz. ¡Estoy intentando descansar!\n¡No me %H860%Xtoques%Ytoquéis%Z las costillas!\n@c2@"
  fr: "@a@b*ⓢ Laissez-moi tranquille.\nJ'essaie de reposer en paixⓠ\nCommencez pas à me briser les métatarsesⓠ\n@c2@"
  it: "@a@b*: %H860%XLasciami%YLasciatemi%Z in pace. Voglio far riposare un po' queste mie quattro ossa!\n@c2@"
  ja: "@a@b＊「起こすんじゃねーよ！\n\t眠いんだから。　むにゃむにゃ……。\n@c2@"
"29":
  de: "@a@b*: Hm? %H860%XEin Mensch%YMenschen%Z?\n@c2@"
  en: "@a@b*: Hm? Ah, %H860%Xa human%YHumans%Z?\n@c2@"
  es: "@a@b*: ¿Mm? ¿%H860%X%A120%XUn humano%Z%B120%XUna humana%Z%YSeres humanos%Z?\n@c2@"
  fr: "@a@b*ⓢ Mmmⓡ Ah, %H860%X%A120%Xun humain%Z%B120%Xune humaine%Z%Y%R000%Xdes humaines%Ydes humains%Z%Zⓡ\n@c2@"
  it: "@a@b*: Eh? Ah, %H860%Xun essere umano%Ydegli esseri umani%Z?\n@c2@"
  ja: "@a@b＊「ん？　なんだお前　人間か？\n@c2@"
"30":
  de: "@a@b*: Ich würd %H860%Xdich%Yeuch%Z ja gern mit Haut und Haaren verschlingen... Wenn ich nur könnte...!\n@c2@"
  en: "@a@b*: I'll make no bones about eating you if you're loafing on your dungeon dutiezzz...\nBonezzz and all!\n@c2@"
  es: "@a@b*: %H860%XTe%YOz%Z engulliré zi %H860%Xhaz%Yhabéiz%Z abandonado %H860%Xtuz%Yvueztraz%Z obligacionez en las mazmorrazzz...\n¡Hazta los huezoz!\n@c2@"
  fr: "@a@b*ⓢ Vous ne ferez pas de vieux os ici, si vous traînez trop longtemps dans le donjon...\nNi vieux os, ni rienⓠ\n@c2@"
  it: "@a@b*: Non esiterò a %H860%Xmangiarti%Ymangiarvi%Z, se %H860%Xtrascurerai i tuoi%Ytrascurerete i vostri%Z doveri nelle segrete... E %H860%Xti sbranerò%Yvi sbranerò%Z fino all'ultimo pezzettino, ossa comprese!\n@c2@"
  ja: "@a@b＊「牢屋番を　サボってると\n\t食っちまうぞ。　むにゃむにゃ……。\n@c2@"
"31":
  de: "@a@b*: %H860%XHaft du%YHabt ihr%Z ef pfon gehört? Jeder, der waf Gutef über Pfaro fagt, wird in den Kerker geworfen!\n@c1@"
  en: "@a@b*: Have your heard the newth?\nAnyone who thayth anything good about Ptharo ith being locked up in the dungeon now!\n@c1@"
  es: "@a@b*: ¿%H860%XHaz%YHabéiz%Z oído la notizia?\n¡Todo aquel que intente hazer o dezir algo en favor de Pzaro ez enzerrado en las mazmoraz!\n@c1@"
  fr: "@a@b*ⓢ Vous avez entendu la nouvelleⓡ\nMaintenant, tous ceux qui se feront çoper à dire du bien de Psaro finiront enfermés dans le donzonⓠ\n@c1@"
  it: "@a@b*: %H860%XHai%YAvete%Z fentito l'ultima? Tutti quelli che hanno parlato bene di Pfaro fono ftati fbattuti nelle fegrete!\n@c1@"
  ja: "@a@b＊「聞いたか？　デスピサロさまに\n\t敬意を払ったりしたヤツは\n\tみんな　牢屋行きなんだとよ。\n@c1@"
"32":
  de: "@a@b*: Die Monfter drinnen, und die Menschen ftehen draufen und halten Wache! Eine verkehrte Welt ift daf!\n@c1@"
  en: "@a@b*: Monthterth are on the inthide, and humanth are on the outthide guarding them! It doethn't get any more humiliating than that!\n@c1@"
  es: "@a@b*: Hay monztruoz en zu interior, ¡y humanoz fuera vigilándoloz! ¡No hay nada máz humillante que ezo!\n@c1@"
  fr: "@a@b*ⓢ Les monstres sont à l'intérieur et les humains à l'extérieur pour les surveillerⓠ Z'ai zamais rien vu d'aussi humiliantⓠ\n@c1@"
  it: "@a@b*: I moftri fono rinchiufi all'interno, forvegliati dagli umani! Non riefco a immaginare una fituazione più umiliante!\n@c1@"
  ja: "@a@b＊「魔物さまが　牢屋に入れられて\n\t人間に　見張られるんだぞ。\n\tこれ以上の　屈辱はないよな。\n@c1@"
"33":
  de: "@a@b*: Fürft Pf...\n@c1@"
  en: "@a@b*: Lord Pth...\n@c1@"
  es: "@a@b*: Zeñor Pz...\n@c1@"
  fr: "@a@b*ⓢ Seigneur Ps...\n@c1@"
  it: "@a@b*: Lord Pf...\n@c1@"
  ja: "@a@b＊「デッ……\n@c1@"
"34":
  de: "@a@b*: Fürft Pfa...\n@c1@"
  en: "@a@b*: Lord Ptha...\n@c1@"
  es: "@a@b*: Zeñor Pza...\n@c1@"
  fr: "@a@b*ⓢ Seigneur Psa...\n@c1@"
  it: "@a@b*: Lord Pfa...\n@c1@"
  ja: "@a@b＊「デスピッ……\n@c1@"
"35":
  de: "@a@b*: Fürft Pfaro! Ihr feid alfo am Leben? Daf find gute Neuigkeiten!\n@c1@"
  en: "@a@b*: Lord Ptharo!\nTho you're alive and kicking?\nThank goodneth for that!\n@c1@"
  es: "@a@b*: ¡Zeñor Pzaro!\n¿Eztá vivito y coleando?\n¡Graciaz a la Dioza por ezo!\n@c1@"
  fr: "@a@b*ⓢ Seigneur Psaroⓠ\nVous êtes touzours en vieⓡ\nC'est une nouvelle zénialeⓠ\n@c1@"
  it: "@a@b*: Lord Pfaro! Fei vivo? Che bella notizia!\n@c1@"
  ja: "@a@b＊「デスピサロさまぁーっ！\n\t生きていらしたんですか！？\n\tおかえりなさいませー！\n@c1@"
"36":
  de: "@a@b*: Daran kann man jetft nifts mehr ändern. Aamon ift der neue Meifter der Monfter und bafta.\n@c1@"
  en: "@a@b*: There'th nothing we can do about it now. Aamon ith the new Mathter of Monthterkind, and that'th that.\n@c1@"
  es: "@a@b*: No hay nada que hazer ahora al rezpecto. Aamon ez el nuevo Zeñor de loz Monztruoz, y ezo ez todo.\n@c1@"
  fr: "@a@b*ⓢ On ne peut rien y çanzer pour l'instant.\nAamon est le nouveau Maître des monstres, un point c'est tout.\n@c1@"
  it: "@a@b*: Non poffiamo far niente per cambiare la fituazione. Aamon è il nuovo Fignore della Moftruofità. Le cofe ftanno proprio cofì.\n@c1@"
  ja: "@a@b＊「新しい王は　エビルプリーストさまで\n\tしかたがないとは思うが……\n@c1@"
"37":
  de: "@a@b*: Aber unter unf gefagt fand ich Fürft Pfaro viel besser... meint Ihr nicht auch?\n@c1@"
  en: "@a@b*: But between you and me, Lord Ptharo wath far better, don't you think?\n@c1@"
  es: "@a@b*: Pero entre nozotroz, el Zeñor Pzaro era mucho mejor, ¿no %H860%Xcreez%Ycreéiz%Z?\n@c1@"
  fr: "@a@b*ⓢ Mais entre nous, le Seigneur Psaro était bien meilleur, vous ne croyez pasⓡ\n@c1@"
  it: "@a@b*: Che refti tra noi, ma Lord Pfaro era molto meglio...\n@c1@"
  ja: "@a@b＊「デスピサロさまと　くらべたら\n\tやっぱり　見劣りするな。\n\tお前も　そう思うだろ？\n@c1@"
"38":
  de: "@a@b*: Ich fehe Fürft Pfaro immer noch vor mir... aber... nein, daf ift nicht möglich!\n@c1@"
  en: "@a@b*: I'm thure I can thee Lord Ptharo in front of me, but... No, it'th not pothible!\n@c1@"
  es: "@a@b*: Eztoy zeguro de que eztoy viendo al Zeñor Pzaro ante mí, pero... ¡No, no ez pozible!\n@c1@"
  fr: "@a@b*ⓢ Ze suis sûr que c'est le Seigneur Psaro que ze vois en face de moi, mais... non, c'est impossibleⓠ\n@c1@"
  it: "@a@b*: Fono certo di vedere Lord Pfaro davanti a me, ma... No, non è poffibile!\n@c1@"
  ja: "@a@b＊「デ…デスピサロさまが\n\tいるように見えるが……\n\tそんなはずはないな。\n@c1@"
"39":
  de: "@a@b*: Meine Vorftellungfkraft pflägt mir wohl ein Pfnippchen... daf... kann nicht fein...\n@c1@"
  en: "@a@b*: It mutht be a figment of my imagination...\nYeth... It mutht be...\n@c1@"
  es: "@a@b*: Debe zer un producto de mi imaginación...\nZí... Debe zer...\n@c1@"
  fr: "@a@b*ⓢ Ça doit être le fruit de mon imazination...\nOui... c'est sûrement ça...\n@c1@"
  it: "@a@b*: Dev'effere uno fcherzo della mia immaginazione... Fì... è ficuramente cofì...\n@c1@"
  ja: "@a@b＊「幻覚だ……。　これは　幻覚だ……。\n@c1@"
"40":
  de: "@a@b*: Natürlich! Kein Problem!\nWird sofort erledigt.\nDann fresst Ihr mich nicht, ja?\n@c1@"
  en: "@a@b*: Of course! Right away!\nI'll see to it immediately.\nSo you can't eat me, okay?\n@c1@"
  es: "@a@b*: ¡Por supuesto! ¡Enseguida!\nMe ocuparé de eso inmediatamente.\nAsí que no %H860%Xpuedes%Ypodéis%Z engullirme, ¿de acuerdo?\n@c1@"
  fr: "@a@b*ⓢ Bien sûrⓠ Tout de suiteⓠ\nJe vais m'en occuper tout de suite. Comme ça vous ne pourrez pas me manger, d'accordⓡ\n@c1@"
  it: "@a@b*: Ma certo! Subito! Ci penso io! Quindi non %H860%Xpuoi%Ypotete%Z mangiarmi, dico bene?\n@c1@"
  ja: "@a@b＊「はいっ！　はいっ！\n\tすぐに　お支度しますので\n\tあたしは　食べちゃダメですぅー！\n@c1@"
"41":
  de: "@a@b*: Oh, hallo! Da %H860%Xist ja noch ein Mensch%Ysind ja noch Menschen%Z! Wie läuft es mit dem Bewachen der Kerker?\n@c1@"
  en: "@a@b*: Oh, hello! %H860%XA fellow human%YFellow humans%Z for once!\nHow's guarding the dungeon going?\n@c1@"
  es: "@a@b*: ¡Ah!, saludos. ¡%H860%X%A120%XUn humano%Z%B120%XUna humana%Z%YSeres humanos%Z al fin!\n¿Cómo va la vigilancia de las mazmorras?\n@c1@"
  fr: "@a@b*ⓢ Oh, bonjourⓠ %H860%X%A120%XUn autre humain%Z%B120%XUne autre humaine%Z%Y%R000%XD'autres humaines%YD'autres humains%Z%Z, pour une foisⓠ\nComment se déroule la surveillance du donjonⓡ\n@c1@"
  it: "@a@b*: Ehi, salve! Finalmente %H860%Xun essere umano%Ydegli esseri umani%Z! Come sta andando il servizio di guardia alle segrete?\n@c1@"
  ja: "@a@b＊「あら？　あなたたちは人間ね。\n\t牢屋の見回り　ご苦労さまぁー。\n@c1@"
"42":
  de: "@a@b*: N-Nichts zu berichten! Jeder Einzelne der Verräter Aamons ist so stumm wie ein Fisch!\n@c2@"
  en: "@a@b*: N-Nothing to report!\nEvery one of Aamon's wicked traitors is being as quiet as a mouse!\n@c2@"
  es: "@a@b*: ¡S-Sin novedad!\n¡Todos los malignos traidores a Aamon guardan silencio!\n@c2@"
  fr: "@a@b*ⓢ Ri... Rien à signalerⓠ\nTous les détracteurs d'Aamon se tiennent tranquillesⓠ\n@c2@"
  it: "@a@b*: N-Niente da segnalare! Tutti coloro che hanno tradito Aamon sono tranquilli come pecore al pascolo!\n@c2@"
  ja: "@a@b＊「い…異常なーし！\n\tエビルプリーストさまに逆らう\n\t連中は　おとなしくしていまーす！\n@c2@"
"43":
  de: "@a@b*: Habt Ihr gehört? Alle Anhänger von Psaro dem Metzler sind im Kerker eingesperrt worden.\n@c2@"
  en: "@a@b*: Did you hear? All supporters of Psaro the Manslayer have been locked up in the dungeon.\n@c2@"
  es: "@a@b*: ¿%H860%XHas%YHabéis%Z oído? Todos los seguidores de Psaro el Carnicero han sido encerrados en las mazmorras.\n@c2@"
  fr: "@a@b*ⓢ Vous avez entenduⓡ\nTous ceux qui soutiennent Psaro l'Exterminateur ont été enfermés dans le donjon.\n@c2@"
  it: "@a@b*: Lo %H860%Xsapevi%Ysapevate%Z? Tutti i seguaci di Psaro il Massacratore sono stati rinchiusi nelle segrete.\n@c2@"
  ja: "@a@b＊「知ってるか？　デスピサロに\n\t敬意を払ったりしたヤツは\n\tみんな　牢屋に入れられたよ。\n@c2@"
"44":
  de: "@a@b*: Ich hätte nie gedacht, dass ich mal gefangene Monster bewachen würde, das kann ich Euch sagen!\n@c2@"
  en: "@a@b*: I never thought I'd be made to keep watch over imprisoned monsters, I can tell you!\n@c2@"
  es: "@a@b*: Jamás imaginé que me encomendarían la vigilancia de unos monstruos encerrados en una mazmorra, lo puedo asegurar.\n@c2@"
  fr: "@a@b*ⓢ Je n'aurais jamais cru avoir un jour à jouer les gardiens pour des monstres emprisonnés, je peux vous le direⓠ\n@c2@"
  it: "@a@b*: Non avrei mai immaginato che un giorno mi avrebbero messo a guardia di un branco di mostri... Roba da non credere!\n@c2@"
  ja: "@a@b＊「牢屋に入れられた魔物の\n\t見張りを　させられるなんて\n\t思ってもみなかったな。\n@c2@"
"45":
  de: "@a@b*: Das ist jedenfalls viel besser, als von ihnen gefressen zu werden. \n㈡\n*: Trotzdem jagen sie mir immer noch einen schönen Schrecken ein, wenn sie mich durch die Gitterstäbe anstarren.\n@c2@"
  en: "@a@b*: It beats being eaten by them, that's for sure!\nMind you, they still give me the willies when they look at me through the bars.\n@c2@"
  es: "@a@b*: ¡Esto es mejor que que te coman, eso está claro!\nAunque aún me dan escalofríos cuando me miran a través de los barrotes.\n@c2@"
  fr: "@a@b*ⓢ C'est pire que d'être mangé par eux, croyez-moiⓠ Imaginez un peuⓢ ils me filent toujours la frousse rien qu'en me regardant à travers les barreaux.\n@c2@"
  it: "@a@b*: Sempre meglio che essere mangiati da loro, questo è poco ma sicuro!\n㈡\n*: Comunque, anche se loro sono dietro le sbarre, mi fanno sempre venire i brividi, quando mi guardano!\n@c2@"
  ja: "@a@b＊「食べられるよりはマシだけど\n\t牢屋の中の　魔物の視線が\n\t恐ろしくて……。\n@c2@"
"46":
  de: "@a@b*: Da %H860%Xkannst du fragen, so oft du willst%Ykönnt ihr fragen, so oft ihr wollt%Z! Ich habe nicht vor, mich diesem Verräter zu beugen.\n@c3@"
  en: "@a@b*: Ask me as many times as you please.\nI have no intention of pledging my allegiance to that traitor.\n@c3@"
  es: "@a@b*: %H860%XPuedes%YPodéis%Z preguntarme tantas veces como %H860%Xquieras%Yqueráis%Z.\nNo tengo intención de jurar lealtad a ese traidor.\n@c3@"
  fr: "@a@b*ⓢ Demandez-le-moi aussi souvent que vous voulez.\nJe n'ai aucune intention de prêter allégeance à ce traître.\n@c3@"
  it: "@a@b*: %H860%XPuoi%YPotete%Z chiedermelo tutte le volte che %H860%Xvuoi%Yvolete%Z, ma la mia risposta sarà sempre la stessa!\n㈡\n*: Non ho la minima intenzione di giurare fedeltà a quel traditore.\n@c3@"
  ja: "@a@b＊「何度　聞かれても同じだ。\n\t逆賊エビルプリーストに　仕える\n\t気持ちなど　みじんもない。\n@c3@"
"47":
  de: "@a@b*: Wenn er mich töten will, soll er's doch versuchen! Und das %H860%Xkannst du%Ykönnt ihr%Z diesem Aamon ruhig sagen.\n@c3@"
  en: "@a@b*: If he wants to kill me, let him try.\nAnd you can tell Aamon that's what I said.\n@c3@"
  es: "@a@b*: Si quiere matarme, dejémosle intentarlo.\nY le %H860%Xpuedes%Ypodéis%Z decir a Aamon lo que he dicho.\n@c3@"
  fr: "@a@b*ⓢ S'il veut me tuer, qu'il essaie. Et vous pouvez bien aller répéter ce que je viens de dire à Aamon.\n@c3@"
  it: "@a@b*: Se vuole uccidermi, che si faccia avanti. E riferisci pure le mie parole ad Aamon! Non me ne importa nulla!\n@c3@"
  ja: "@a@b＊「殺すなら殺せと\n\tエビルプリーストに伝えるがよい。\n@c3@"
"48":
  de: "@a@b*: Fürst Psaro!\n@c3@"
  en: "@a@b*: Lord Psaro!\n@c3@"
  es: "@a@b*: ¡Lord Psaro!\n@c3@"
  fr: "@a@b*ⓢ Seigneur Psaroⓠ\n@c3@"
  it: "@a@b*: Lord Psaro!\n@c3@"
  ja: "@a@b＊「デ…デスピサロさまぁ！！\n@c3@"
"49":
  de: "@a@b*: Ich hab die Hoffnung nie aufgegeben! Ich wusste, dass Ihr nicht tot sein konntet.\n@c3@"
  en: "@a@b*: I, I never lost faith!\nI was sure that you couldn't have been killed.\n@c3@"
  es: "@a@b*: ¡Jamás perdí la fe!\nEstaba seguro de que no era posible que le hubieran matado.\n@c3@"
  fr: "@a@b*ⓢ Je... Je n'ai jamais perdu espoirⓠ\nJ'étais sûr que vous ne pouviez pas avoir été tué.\n@c3@"
  it: "@a@b*: Io... Io non ho mai perso le speranze! Sapevo che non potevi essere morto!\n@c3@"
  ja: "@a@b＊「…私は　信じておりました。\n\tデスピサロさまが死ぬはずないと。\n\tうっうっ……。\n@c3@"
"50":
  de: "@a@b*: Ich traue Aamon nicht. Er ist eine hinterhältige Bestie.\n@c3@"
  en: "@a@b*: I don't trust Aamon.\nHe's a sly beast.\n@c3@"
  es: "@a@b*: No confío en Aamon.\nEs una bestia malvada.\n@c3@"
  fr: "@a@b*ⓢ Je ne fais pas confiance à Aamon.\nC'est une bête fourbe.\n@c3@"
  it: "@a@b*: Non mi fido di quell'Aamon. È una bestia malvagia.\n@c3@"
  ja: "@a@b＊「エビルプリーストめ。\n\tやつの言葉は　どれも信じられん。\n@c3@"
"51":
  de: "@a@b*: Wenn %H860%Xdu ein anständiges und ehrbares Monster wärst, würdest du%Yihr anständige und ehrbare Monster wärt, würdet ihr%Z ihm auch nicht trauen.\n@c3@"
  en: "@a@b*: If you were %H860%Xa decent, upstanding monster%Ydecent, upstanding monsters%Z, you wouldn't trust him, either.\n@c3@"
  es: "@a@b*: Si %H860%Xfueras un monstruo decente y cabal tampoco confiarías%Yfuérais monstruos decentes y cabales tampoco confiaríais%Z en él.\n@c3@"
  fr: "@a@b*ⓢ Si vous étiez %H860%Xun monstre digne de ce nom%Ydes monstres dignes de ce nom%Z, vous ne lui feriez pas confiance non plus.\n@c3@"
  it: "@a@b*: Se %H860%Xtu fossi un mostro onesto e leale%Yvoi foste dei mostri onesti e leali%Z, nemmeno %H860%Xtu avresti%Yvoi avreste%Z fiducia in lui.\n@c3@"
  ja: "@a@b＊「お前も　心ある魔物ならば\n\tあんな者の言葉に\n\t耳を貸すんじゃないぞ。\n@c3@"
"52":
  de: "@a@b*: Fürst Psaro?! Nein... ich muss wohl träumen. Aber trotzdem muss ich es Euch sagen, selbst wenn es nur ein Traum ist...\n@c3@"
  en: "@a@b*: Lord Psaro!?\nNo...I must be dreaming. But I must inform you anyway, even if this is a dream...\n@c3@"
  es: "@a@b*: ¡¿Lord Psaro?!\nNo... Debo estar soñando. Debo informarle de todas formas, aunque esto sea un sueño.\n@c3@"
  fr: "@a@b*ⓢ Seigneur Psaroⓠⓑ\nNon... Je dois rêver.\nMais je dois vous informer, même si c'est un rêve...\n@c3@"
  it: "@a@b*: Lord Psaro?! No... Sto sognando. Ma, anche se si tratta un sogno, devo informarti di una cosa...\n@c3@"
  ja: "@a@b＊「デスピサロさま！？\n\t……いや　もはや夢でもいい。\n\tお伝えいたします。\n@c3@"
"53":
  de: "@a@b*: Aamon behauptet, er allein habe das Geheimnis der Evolution perfektioniert.\n@c3@"
  en: "@a@b*: Aamon is claiming to have perfected the Secret of Evolution himself.\n@c3@"
  es: "@a@b*: Aamon afirma que ha perfeccionado él mismo el Secreto de la Evolución.\n@c3@"
  fr: "@a@b*ⓢ Aamon clame partout qu'il a lui-même perfectionné le Secret de l'Évolution.\n@c3@"
  it: "@a@b*: Aamon sostiene di aver messo a punto il Segreto dell'Evoluzione.\n@c3@"
  ja: "@a@b＊「エビルプリーストのやつめ\n\t自分は　進化の究極を極めたなどと\n\t語っているのです。\n@c3@"
"54":
  de: "@a@b*: Ich weiß nicht, ob das wahr ist oder nicht, aber man sollte ihn auf keinen Fall unterschätzen.\n@c3@"
  en: "@a@b*: I don't know if it's true or not, but it could be dangerous to underestimate him.\n@c3@"
  es: "@a@b*: No sé si es cierto o no, pero creo que podría ser peligroso subestimarle.\n@c3@"
