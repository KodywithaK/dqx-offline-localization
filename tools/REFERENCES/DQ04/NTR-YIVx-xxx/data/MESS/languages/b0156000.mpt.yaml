  en: "@a@b*: My dearest %a00090. Though your parents had to forsake you in your infancy, now you are risen to such lofty heights!\n㈡\n*: May the bonds forged betwixt you and your fellows forfend the grief you have suffered from the loss of your parents.\n@c1@"
