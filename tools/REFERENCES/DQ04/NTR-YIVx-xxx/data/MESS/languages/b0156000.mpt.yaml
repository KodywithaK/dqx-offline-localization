"152":
  de: "@aZenithdrache@bMan darf den Monstern ihre Taten nicht allzu übel nehmen ⓚⓛ ein Dasein, bei dem man nur den engsten Gefährten trauen kann, muss wahrlich trist sein.\n@c3@"
