  it: "@aAamon@bWaaah! Ah! Ah! Ah! Sei capace di controllare il tuo odio?! La tua rabbia?!\n@c3@"
  ja: "@a@bエビルプリースト「わっはっはっ！\n\tこのわたしが　憎いか？\n\tしかし…\n@c3@"
"83":
  de: "@aAamon@bAber wie steht es mit Selbsthass? Welche Schande könnte größer sein, als sich mit Menschen zu verbünden?!\n@c3@"
  en: "@aAamon@bBut what of self-loathing? What shame could be greater than joining forces with the humans!?\n@c3@"
  es: "@aAamon@bPero, ¿qué ocurre con el odio hacia uno mismo? ¡¿Qué puede suponer mayor vergüenza que asociarse con humanos?!\n@c3@"
  fr: "@aAamon@bMais que fais-tu du dégoût de soiⓡ\nQuelle honte surpasse celle d'unir ses forces aux humainsⓠⓑ\n@c3@"
  it: "@aAamon@bMa vedo che non provi vergogna per te stesso... Guardati! Ti sei ridotto a unire le tue forze con dei patetici esseri umani!\n@c3@"
  ja: "@a@bエビルプリースト「あれほど\n\tさげすんでいた人間と　手を組むとは\n\tもはや　恥も極まったな！\n@c3@"
"84":
  de: "@aAamon@bHmpf! Egal. Du bist zu spät dran, Psaro. Deine Zeit ist vorbei.\n@c3@"
  en: "@aAamon@bHmph! No matter. You are too late, Psaro.\nYour time is passed.\n@c3@"
  es: "@aAamon@b¡Umpf! No importa. Es demasiado tarde, Psaro.\nTu tiempo se acabó.\n@c3@"
  fr: "@aAamon@bMmpfⓠ Peu importe.\nTu arrives trop tard, Psaro.\nTon heure est passée.\n@c3@"
  it: "@aAamon@bPfui! Ma ormai non ha più importanza... Sei arrivato troppo tardi, Psaro. Il tuo tempo è scaduto.\n@c3@"
  ja: "@a@bエビルプリースト「どちらにせよ\n\tもう　おそいわ。　デスピサロよ。\n\tお前の時代は　終わったのだ。\n@c3@"
"85":
  de: "@aAamon@bUnd nun zeige ich dir... meine neue Form, den wahren Gipfel der Evolution!\n@c3@"
  en: "@aAamon@bAnd now I will show you...\nMy new form, the very pinnacle of evolution!\n@c3@"
  es: "@aAamon@bY ahora te mostraré...\nMi nueva forma, ¡el culmen de la evolución!\n@c3@"
  fr: "@aAamon@bEt à présent, je vais te montrer... ma nouvelle forme, le sommet de l'Évolutionⓠ\n@c3@"
  it: "@aAamon@bOra ti mostrerò la mia nuova forma.\nIl culmine dell'evoluzione!\n@c3@"
  ja: "@a@bエビルプリースト「見せてやろう。\n\t進化の究極を極めた\n\tこのわたしの　新たなる姿を！\n@c3@"
"86":
  de: "@aAamon@bWisse, dass du verflucht bist! Wisse, dass du in die Ära des einzig wahren Herrschers geboren wurdest! Die Ära von Aamon!\n@c3@"
  en: "@aAamon@bKnow now of your curse! Know now that you were born in the era of the one true ruler!\nThe era of Aamon!\n@c3@"
  es: "@aAamon@b¡Ahora conocerás tu maldición! ¡Ahora sabrás que naciste en la era del único señor verdadero!\n¡La era de Aamon!\n@c3@"
  fr: "@aAamon@bDécouvre à présent ta malédictionⓠ\nSache que tu es né à l'ère du seul véritable maîtreⓠ\nL'ère d'Aamonⓠ\n@c3@"
  it: "@aAamon@bLa mia maledizione sta per abbattersi su di te! Inchinati al potere del signore di tutti i signori! Questa è l'era di Aamon! \n@c3@"
  ja: "@a@bエビルプリースト「呪うがいい！\n\t真の王者と　同じ時代に\n\t生まれ落ちた　おのれの不幸を！\n@c3@"
"87":
  de: "@aAamon@bPsaro?\nEs sieht ganz so aus, als hättest du vergessen, wie sich ein wahrer Verlierer verhält.\n@c3@"
  en: "@aAamon@bPsaro?\nWell, it seems you have forgotten how to accept defeat gracefully.\n@c3@"
  es: "@aAamon@b¿Psaro?\nBueno, parece que has olvidado cómo aceptar la derrota con dignidad.\n@c3@"
  fr: "@aAamon@bPsaroⓡ\nEh bien, on dirait que tu as oublié comment accepter la défaite de bonne grâce.\n@c3@"
  it: "@aAamon@bPsaro?\nBene, sembra che tu abbia dimenticato come accettare la sconfitta con onore.\n@c3@"
  ja: "@a@bエビルプリースト「デスピサロか。\n\tどうやら　往生際というものまで\n\t忘れてしまったようだな。\n@c3@"
"88":
  de: "@aAamon@bDiesmal werde ich meinen Namen in deine Seele meißeln, so dass du nie vergessen wirst, wer dein Herr und Meister ist!\n@c3@"
  en: "@aAamon@bThis time I will carve my name on your very soul, that you may never forget who your true master is!\n@c3@"
  es: "@aAamon@b¡En esta ocasión tallaré mi nombre en tu alma, de tal modo que nunca olvides quién es tu verdadero señor!\n@c3@"
  fr: "@aAamon@bCette fois, je vais graver mon nom sur ton âme elle-même, afin que tu n'oublies jamais qui est ton véritable maîtreⓠ\n@c3@"
  it: "@aAamon@bQuesta volta inciderò il mio nome sulla tua anima, così ricorderai per l'eternità chi è il tuo padrone!\n@c3@"
  ja: "@a@bエビルプリースト「今度こそは\n\tお前の魂に　永遠に消えぬ\n\tわが名を　刻みつけてやろう！！\n@c3@"
"89":
  de: "@aAamon@bDies ist das Ende, Psaro! Estark erwartet dich in der Hölle!\n@c3@"
  en: "@aAamon@bThis is the end, Psaro!\nEstark awaits you in hell!\n@c3@"
  es: "@aAamon@b¡Todo ha acabado, Psaro!\n¡Estark te espera en el infierno!\n@c3@"
  fr: "@aAamon@bTout est fini, Psaroⓠ\nEstark t'attend en enferⓠ\n@c3@"
  it: "@aAamon@bÈ giunta la tua fine, Psaro!\nEstark ti sta aspettando all'inferno!\n@c3@"
  ja: "@a@bエビルプリースト「死ね　デスピサロ！\n\t地獄で　エスタークが\n\tお前を待っているぞ！！\n@c3@"
"90":
  de: "@aAamon@bLä... Läch... erlich...\n@c3@"
  en: "@aAamon@bRi... Ridic...ulous...\n@c3@"
  es: "@aAamon@bRi... Ridíc... ulo...\n@c3@"
  fr: "@aAamon@bC'est... ri... ridicule...\n@c3@"
  it: "@aAamon@bPa... Pate... tico...\n@c3@"
  ja: "@a@bエビルプリースト「ば…ばかな……。\n@c3@"
"91":
  de: "@aAamon@bOder... ist das bloß eine Illusion? Ein fauler Zauber des Geheimnisses der Evolution...?\n@c3@"
  en: "@aAamon@bOr...is this an illusion...?\nThe Secret of Evolution...working some trickery...?\n@c3@"
  es: "@aAamon@b¿O... es esto una ilusión...?\n¿El Secreto de la Evolución... obrando algún tipo de truco...?\n@c3@"
  fr: "@aAamon@bOu bien... est-ce une illusion...ⓡ\nLe Secret de l'Évolution... jouerait-il des tours...ⓡ\n@c3@"
  it: "@aAamon@bForse... è un'illusione...? Forse il Segreto dell'Evoluzione... mi sta giocando un brutto tiro...?\n@c3@"
  ja: "@a@bエビルプリースト「……それとも\n\tこれも……進化の秘法が…見せる\n\t幻覚…なのか……。\n@c3@"
"92":
  de: "@aAamon@bIch... ich... Ich bin der einzig... wahre Herrscher... Der Meister der Monster... Aamoⓚⓛ Aaahhhh!\n@c3@"
  en: "@aAamon@bI... I...\nI am the one...true leader... The Master of Monsterkind... Aamoⓚⓛ Urgh!\n@c3@"
  es: "@aAsaroth@bYo... Yo...\nSoy el único... señor verdadero... El Señor de los Monstruos... Aam... ¡Argh!\n@c3@"
  fr: "@aAamon@bJe... Je... Je suis le seul... vrai chef... le Maître des monstres... Aam... arrghⓠ\n@c3@"
  it: "@aAamon@bIo... Io... Io sono l'unico... vero padrone... Il Signore della Mostruosità... Aamo... Argh!\n@c3@"
  ja: "@a@bエビルプリースト「われこそは……\n\t世界を…支配する……魔族の王…\n\tエビルプリースト…だ……。\n@c3@"
"93":
  de: "@a@b%0%a00180 wird von einer mysteriösen Zauberkraft wieder zum Leben erweckt!\n@c0@"
  en: "@a@b%0%a00180 is resurrected by a mysterious magical force!\n@c0@"
  es: "@a@b¡%0%a00180 resucita por una extraña fuerza mágica!\n@c0@"
  fr: "@a@bGrâce à une mystérieuse force magique, %0%a00180 revient à la vieⓠ\n@c0@"
  it: "@a@b%0%a00180 viene %A180%Xriportato%Z%B180%Xriportata%Z%C180%X%Z in vita da una misteriosa forza magica!\n@c0@"
  ja: "@a@b不思議なチカラが　はたらき\nなんと　%a00180が生き返った！\n@c0@"
"94":
  de: "@a@b%H860%X%0%a00120 hört%YDie Gruppe hört%Z eine Stimme, die aus dem Nichts ertönt...\n@c0@"
  en: "@a@b%H860%X%0%a00120 hears%YThe party hear%Z a voice calling out of nowhere...\n@c0@"
  es: "@a@b%H860%X%0%a00120 escucha%YEl grupo escucha%Z una voz...\n@c0@"
  fr: "@a@b%H860%X%0%a00120 entend%YL'équipe entend%Z une voix venue de nulle part...\n@c0@"
  it: "@a@b%H860%X%0%a00120 sente%YIl gruppo sente%Z una voce che sembra provenire dal nulla...\n@c0@"
  ja: "@a@bどこからか　不思議な声が聞こえる。\n@c0@"
"95":
  de: "@a@bKommt zu uns zurück, %a00090.\nKommt zurück nach Zenithia...\n@c0@"
  en: "@a@bReturn to us, %a00090.\nReturn to Zenithia...\n@c0@"
  es: "@a@bVuelve a nosotros, %a00090.\nRegresa a Zenithia...\n@c0@"
  fr: "@a@bReviens vers nous, %a00090.\nReviens à Zénithia...\n@c0@"
  it: "@a@bTorna da noi, %a00090. Torna a Zenithia...\n@c0@"
  ja: "@a@b%a00090よ　もどりなさい。\nわが　天空の城へ……。\n@c0@"
"96":
  de: "@aPsaro@b...%0%a00090.\n@c2@"
  en: "@aPsaro@b...%0%a00090.\n@c2@"
  es: "@aPsaro@b... %0%a00090.\n@c2@"
  fr: "@aPsaro@b... %0%a00090.\n@c2@"
  it: "@aPsaro@b%0%a00090...\n@c2@"
  ja: "@a@bピサロ「……%a00090。\n@c2@"
"97":
  de: "@aPsaro@bHört Ihr mich, %a00090?\n@c2@"
  en: "@aPsaro@bCan you hear me, %a00090?\n@c2@"
  es: "@aPsaro@b¿Puedes oírme, %a00090?\n@c2@"
  fr: "@aPsaro@b%0%a00090, vous m'entendezⓡ\n@c2@"
  it: "@aPsaro@bRiesci a sentirmi, %a00090?\n@c2@"
  ja: "@a@bピサロ「%a00090よ　聞こえるか？\n@c2@"
"98":
  de: "@aPsaro@bDie Leute halten mich immer noch für ein Monster. Ich wäre nicht willkommen in Zenithia.\n@c2@"
  en: "@aPsaro@bPeople still think of me as a monster.\nI wouldn't be welcome in Zenithia.\n@c2@"
  es: "@aPsaro@bAún piensan que soy un monstruo.\nNo seré bienvenido en Zenithia.\n@c2@"
  fr: "@aPsaro@bLes gens pensent toujours que je suis un monstre.\nJe ne serais pas le bienvenu à Zénithia.\n@c2@"
  it: "@aPsaro@bLa gente pensa ancora a me come a un mostro. Non sarei il benvenuto a Zenithia.\n@c2@"
  ja: "@a@bピサロ「わたしは　仮にも\n\t魔族を束ねる者だ。　天空の城に\n\t入ることはできない。\n@c2@"
"99":
  de: "@aPsaro@bNun heißt es Abschied nehmen. Ich muss Euch nun verlassen.\n@c2@"
  en: "@aPsaro@bSo this is farewell.\nI must leave now.\n@c2@"
  es: "@aPsaro@bAsí que esto es un adiós.\nAhora, debo irme.\n@c2@"
  fr: "@aPsaro@bJe dois donc vous dire adieu.\nIl est temps pour moi de partir.\n@c2@"
  it: "@aPsaro@bPerciò questo è un addio. Ora devo andare.\n@c2@"
  ja: "@a@bピサロ「さよならだ。\n\tわたしは　ここで行く。\n@c2@"
"100":
  de: "@aPsaro@bVielleicht kreuzen sich unsere Wege eines Tages wieder. Aber wer weiß schon, ob als Freunde oder Feinde...?\n@c2@"
  en: "@aPsaro@bPerhaps our paths will one day cross again.\nBut who can say if it will be as friends or as enemies...?\n@c2@"
  es: "@aPsaro@bTal vez nuestros caminos se crucen de nuevo algún día.\nPero, ¿quién sabe si como amigos o enemigos...?\n@c2@"
  fr: "@aPsaro@bPeut-être que nos chemins se recroiseront un jour.\nMais qui sait si ce sera en tant qu'amis ou ennemis...ⓡ\n@c2@"
  it: "@aPsaro@bForse, un giorno le nostre strade torneranno a incrociarsi. Ma chi può dire se, quando ci incontreremo ancora, sarà da amici o da nemici...?\n@c2@"
  ja: "@a@bピサロ「お前とは　いずれ\n\tまた会うだろう。　そのときは\n\t敵か味方か　わからぬがな。\n@c2@"
"101":
  de: "@aZenithdrache@bIch... bin der Zenithdrache.\n@c3@"
  en: "@aZenith Dragon@bI...am the Zenith Dragon.\n@c3@"
  es: "@aDragón de Zenithia@bYo... soy el Dragón de Zenithia.\n@c3@"
  fr: "@aDragon du Zénith@bJe... Je suis le Dragon du Zénith.\n@c3@"
  it: "@aDrago di Zenithia@bIo... sono il Drago di Zenithia.\n@c3@"
  ja: "@a@bマスタードラゴン「……わたしは\n\tマスタードラゴン。\n@c3@"
"102":
  de: "@aZenithdrache@bAus diesen himmlischen Höhen beobachte ich alles, was sich in der Welt zuträgt. Auch die Menschen unterstehen meinem wachsamen Auge.\n@c3@"
  en: "@aZenith Dragon@bFrom my lofty dominion here, I observe all that takes place below. All that afflicts the human world occurs under my watchful eye.\n@c3@"
  es: "@aDragón de Zenithia@bDesde mis dominios observo todo aquello que acontece en el mundo inferior. Todo lo que afecta a los humanos sucede bajo mi vigilante mirada.\n@c3@"
  fr: "@aDragon du Zénith@bDu haut de mon vaste domaine, j'observe tout ce qui se passe sur la terre. Rien de ce qui affecte le monde des hommes ne m'échappe.\n@c3@"
  it: "@aDrago di Zenithia@bDa quassù osservo ogni cosa e vigilo su ciò che accade nel mondo di sotto. Nulla di ciò che avviene sulle terre degli umani sfugge al mio occhio infallibile!\n@c3@"
  ja: "@a@bマスタードラゴン「居ながらにして\n\tここより　この世界のすべてを\n\t知ることのできる者。\n@c3@"
"103":
  de: "@aZenithdrache@bHier steht %A090%Xder Eine, der%Z%B090%Xdie Eine, die%Z das Blut der Menschen und der Zenithianer eint: %A090%Xder große Held%Z%B090%Xdie große Heldin%Z, %a00090!\n@c3@"
  en: "@aZenith Dragon@bBehold the one who shares the blood of human and Zenithian alike: the great %A090%Xhero%Z%B090%Xheroine%Z, %a00090!\n@c3@"
  es: "@aDragón de Zenithia@bHe aquí quien comparte la sangre de los hombres y de Zenithia: ¡%A090%Xel gran héroe%Z%B090%Xla gran heroína%Z, %a00090!\n@c3@"
  fr: "@aDragon du Zénith@bFaites place %A090%Xau héros%Z%B090%Xà l'héroïne%Z qui porte en %A090%Xlui%Z%B090%Xelle%Z le sang mêlé des humains et des Zénithiens.\n%A090%XLe grand%Z%B090%XLa grande%Z %0%a00090ⓠ\n@c3@"
  it: "@aDrago di Zenithia@bEcco %A090%Xcolui%Z%B090%Xcolei%Z che ha nelle sue vene sangue umano e Zenithiano: %A090%Xil grande eroe%Z%B090%Xla grande eroina%Z, %a00090!\n@c3@"
  ja: "@a@bマスタードラゴン「天空人と人間の\n\t血を引きし　勇者　%a00090よ！\n@c3@"
"104":
  de: "@aZenithdrache@bIch wurde Zeuge, wie das Geheimnis der Evolution aufgrund Eurer Anstrengungen in die Vergessenheit verbannt wurde.\n@c3@"
  en: "@aZenith Dragon@bI witnessed how your efforts drove the Secret of Evolution deep into oblivion.\n@c3@"
  es: "@aDragón de Zenithia@bHe sido testigo de cómo %H860%Xtus%Yvuestros%Z esfuerzos han enviado el Secreto de la Evolución al más profundo de los olvidos.\n@c3@"
  fr: "@aDragon du Zénith@bJ'ai vu comment, grâce à vos efforts, le Secret de l'Évolution est retombé dans l'oubli.\n@c3@"
  it: "@aDrago di Zenithia@bHo visto come gli sforzi che %H860%Xhai%Yavete%Z compiuto abbiano spinto nell'oblio il Segreto dell'Evoluzione.\n@c3@"
  ja: "@a@bマスタードラゴン「そなたらの　働きで\n\t進化の秘法は　この世から消滅した。\n@c3@"
"105":
  de: "@aZenithdrache@bAber wie dem auch sei, die Menschheit braucht nun nichts mehr zu fürchten. Es herrscht wieder Frieden in Eurer Welt.\n@c3@"
  en: "@aZenith Dragon@bBut, in any case, no fear need now afflict you or your kind. Peace reigns once more over your domain.\n@c3@"
  es: "@aDragón de Zenithia@bEn cualquier caso, ni %H860%Xtú%Y%R000%Xvosotras%Yvosotros%Z%Z ni %H860%Xtu%Yvuestra%Z raza debéis ya temer nada.\nLa paz reina de nuevo en vuestros dominios.\n@c3@"
  fr: "@aDragon du Zénith@bQuoi qu'il en soit, aucune peur ne pourra plus vous atteindre, vous et les vôtres. Une fois de plus, la paix est revenue dans votre monde.\n@c3@"
  it: "@aDrago di Zenithia@bComunque, la paura non attanaglierà più i cuori delle creature della %H860%Xtua razza%Yvostra razza%Z. La pace è finalmente tornata a regnare sovrana nel mondo degli umani.\n@c3@"
  ja: "@a@bマスタードラゴン「ともかく！　\n\t人々が　おびえることのない\n\t世界が　ついに　おとずれたのだ！\n@c3@"
"106":
  de: "@aZenithdrache@bIhr Acht ⓚⓛ die Erkorenen ⓚⓛ habt somit Eure Aufgabe erfüllt und das Ende dieser Geschichte erreicht. \n㈡\nIch verbeuge mich vor Eurem Mut und Eurer Entschlossenheit!\n@c3@"
  en: "@aZenith Dragon@bYou eight ⓚⓛ the Chosen ⓚⓛ have thus completed your chapters. I applaud your courage and determination.\n@c3@"
  es: "@aDragón de Zenithia@bVosotros ocho, los Elegidos, habéis completado vuestra misión y alcanzado el final de vuestras historias.\n㈡\nAplaudo vuestro coraje y determinación.\n@c3@"
  fr: "@aDragon du Zénith@bVous huit, les Élus, vous avez mené à bien votre quête et clos le dernier chapitre de votre histoire.\n㈡\nJe rends hommage à votre courage et à votre détermination.\n@c3@"
  it: "@aDrago di Zenithia@bVoi, gli otto Prescelti, avete completato questa affannosa ricerca, e siete riusciti a raggiungere il capitolo finale della vostra avventura.\n㈡\nSia lode al vostro coraggio e alla vostra determinazione!\n@c3@"
  ja: "@a@bマスタードラゴン「８人の\n\t導かれし者たちよ！\n\t心から　礼を言うぞ！\n@c3@"
"107":
  de: "@aZenithdrache@bRagnar Rauhbein! Bravo! Ihr habt tapfer und ehrenvoll gekämpft.\n@c3@"
  en: "@aZenith Dragon@bRagnar McRyan!\nWell done. You have fought bravely and resolutely.\n@c3@"
  es: "@aDragón de Zenithia@b¡Ragnar McRyan!\nBuen trabajo. Has luchado con valor y resolución.\n@c3@"
  fr: "@aDragon du Zénith@bRagnar McRyanⓠ\nFélicitations. Vous avez combattu avec bravoure et détermination.\n@c3@"
  it: "@aDrago di Zenithia@bI miei complimenti, Galiardo de' Guglielmi!\nHai condotto la battaglia con audacia e risolutezza.\n@c3@"
  ja: "@a@bマスタードラゴン「ライアン！\n\tお前は　本当に良くやってくれたな。\n@c3@"
"108":
  de: "@aZenithdrache@bAlena! Für eine Prinzessin habt Ihr große Stärke und wahren Mut bewiesen.\n@c3@"
  en: "@aZenith Dragon@bAlena!\nThough you were raised a princess, you have shown great strength and courage.\n@c3@"
  es: "@aDragón de Zenithia@b¡Alena!\nA pesar de haber sido criada como una princesa, has demostrado gran fortaleza y coraje.\n@c3@"
  fr: "@aDragon du Zénith@bAlinaⓠ\n㈡\nVotre éducation de princesse ne vous a pas empêchée de faire preuve d'un grand courage et d'une grande résistance.\n@c3@"
  it: "@aDrago di Zenithia@bAlena... È raro che una principessa possegga la forza e il coraggio che tu hai dimostrato di avere!\n@c3@"
  ja: "@a@bマスタードラゴン「アリーナよ。\n\tそなたも　女でありながら\n\tよく　がんばってくれた。\n@c3@"
"109":
  de: "@aZenithdrache@bBorja und Kyrill! Die Unterstützung, die Ihr Alena habt zuteil werden lassen, ist wahrlich beispiellos.\n@c3@"
  en: "@aZenith Dragon@bBorya and Kiryl!\nThe support you have provided to Alena has been exemplary.\n@c3@"
  es: "@aDragón de Zenithia@b¡Borya y Kiryl!\nEl apoyo que habéis proporcionado a Alena ha sido ejemplar.\n@c3@"
  fr: "@aDragon du Zénith@bBorya et Kirylⓠ\nVous avez apporté à Alina un soutien exemplaire.\n@c3@"
  it: "@aDrago di Zenithia@bBoris e Kiryl... L'aiuto che avete fornito ad Alena si è rivelato prezioso!\n@c3@"
  ja: "@a@bマスタードラゴン「ブライにクリフトも\n\tアリーナを助けし　そのはたらき\n\tまことに見事なり。\n@c3@"
"110":
  de: "@aZenithdrache@bMina und Maya! Seid versichert, dass Euer Vater sehr stolz auf Euch ist und seine Seele nun in Frieden ruhen kann.\n@c3@"
  en: "@aZenith Dragon@bMeena and Maya!\nBe assured that your miraculous feats will have set your father's soul at rest.\n@c3@"
