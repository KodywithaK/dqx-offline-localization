  en: "@aKing Larfur@bHmph! We are not amused.\n@c2@"
  es: "@aRey Jarturo@b¡Umpf! No nos hace gracia alguna.\n@c2@"
  fr: "@aRoi Larfour@bMmpfⓠ Cela ne Nous fait pas rire.\n@c2@"
  it: "@aRe Zonin@bPfui! E secondo te xera divertente?\n@c2@"
  ja: "@a@b王「つまらぬ……。\n\t出直してまいれい！\n@c2@"
"81":
  de: "@a@b*: Was hat sich König Kicher nur dabei gedacht, einen derart ungewöhnlichen Aufruf zu erlassen?\n@c1@"
  en: "@a@b*: I wonder what King Larfur can be thinking of, issuing such an extraordinary appeal.\n@c1@"
  es: "@a@b*: Me pregunto en qué estará pensando el rey Jarturo para lanzar tan extraordinario llamamiento.\n@c1@"
  fr: "@a@b*ⓢ Je me demande ce qui lui est passé par la tête quand le roi Larfour a lancé cet étrange appel.\n@c1@"
  it: "@a@b*: Chissà cosa gaveva in mente il sior Re Zonin quando ga lanciato il suo appello straordinario.\n@c1@"
  ja: "@a@b＊「あんな　おふれを出して　王さまは\n\tなにを考えているのでしょう。\n@c1@"
"82":
