"0":
  de: "@a@b*: Willkommen in Kanalot, der Wasserstadt.\n@c1@"
  en: "@a@b*: Welcome to Canalot, city of water.\n@c1@"
  es: "@a@b*: %H860%X%A120%XBienvenido seáis%Z%B120%XBienvenida seáis%Z%Y%R000%XBienvenidas%YBienvenidos%Z sean%Z a Canalot, ciudad del agua.\n@c1@"
  fr: "@a@b*ⓢ Bienvenue à la ville d'eau de Canalot.\n@c1@"
  it: "@a@b*: Questa è Canalot, la città dei canali, ciò!\n@c1@"
  ja: "@a@b＊「ようこそ\n\t水の都　スタンシアラに。\n@c1@"
"1":
  de: "@a@b*: Sicher seid Ihr wegen König Kichers Aufruf hier.\n@c2@"
  en: "@a@b*: No doubt you have come to answer King Larfur's appeal.\n@c2@"
  es: "@a@b*: Sin duda %H860%Xacudís%Yacuden%Z a la llamada del rey Jarturo.\n@c2@"
  fr: "@a@b*ⓢ Vous êtes venu%H860%X%A120%X%Z%B120%Xe%Z%Y%R000%Xes%Ys%Z%Z pour répondre à l'appel du roi Larfour, c'est çaⓡ\n@c2@"
  it: "@a@b*: Sicuramente %H860%Xti xe qui%Ysiete qui%Z per rispondere alla chiamata del sior Re Zonin?\n@c2@"
  ja: "@a@b＊「あんたら　王さまのおふれに\n\t挑戦するつもりで\n\tやってきたんだろ！？\n@c2@"
"2":
  de: "@a@b*: Um die Burg zu erreichen, braucht Ihr ein Floß. Ich wünsche Euch viel Glück.\n@c2@"
  en: "@a@b*: If you wish to reach the castle, you will need a raft. I wish you luck.\n@c2@"
  es: "@a@b*: Si %H860%Xdeseáis%Ydesean%Z llegar al castillo, %H860%Xnecesitaréis%Ynecesitarán%Z una balsa. %H860%XOs%YLes%Z deseo mucha suerte.\n@c2@"
  fr: "@a@b*ⓢ Si vous voulez aller au château, va vous falloir un radeau... et de la chance.\n@c2@"
  it: "@a@b*: Se %H860%Xvuoi%Yvolete%Z raggiungere il palazzo, %H860%Xdovrai%Ydovrete%Z prendere una zattera. Buon viaggio, ciò!\n@c2@"
  ja: "@a@b＊「イカダがないと　ここのお城には\n\t入れねえぜ。　がんばってこいよ！\n@c2@"
"3":
  de: "@a@b*: ⓞWer Uns zum Lachen bringt, den will ich mit dem größten Schatz belohnen!ⓟ So lautet König Kichers Aufruf.\n@c2@"
  en: "@a@b*: ⓗWhosoever makes Us laugh shall be bestowed with the greatest treasure!ⓘ ...That's King Larfur's appeal.\n@c2@"
  es: "@a@b*: ''A aquél que nos haga reír se le concederá el mayor de los tesoros.'' ... Ese es el anuncio del rey Jarturo.\n@c2@"
  fr: "@a@b*ⓢ ⓥQui Nous fera rire se verra récompensé par le plus grand des trésorsⓠⓦ\n... C'est ça l'appel du roi Larfour. \n@c2@"
  it: "@a@b*: ⓕChi ci farà ridere sarà ricompensato con il più prezioso dei tesori!ⓖ\nQuesto è l'appello del sior Re Zonin.\n@c2@"
  ja: "@a@b＊「余を心より　笑わせたる者には\n\t最高のほうびをとらせる！\n\tって　これが王さまの　おふれだけど。\n@c2@"
"4":
  de: "@a@b*: Ich frage mich, ob Ihr es wohl vermögt, den König zum Lachen zu bringen.\n@c2@"
  en: "@a@b*: I wonder if you have the necessary skill to elicit a laugh from him.\n@c2@"
  es: "@a@b*: Me pregunto si %H860%Xtenéis%Ytienen%Z lo necesario para hacerle reír.\n@c2@"
  fr: "@a@b*ⓢ Je suis pas convaincu que vous soyez à la hauteur pour le faire rire.\n@c2@"
  it: "@a@b*: Chissà se %H860%Xti sarai in grado%Ysarete in grado%Z di strappargli una risata!\n@c2@"
  ja: "@a@b＊「あんたらに　王さまを\n\t笑わせることができるかな。\n@c2@"
"5":
  de: "@a@b*: Ich bitte Euch, jetzt von einem Gespräch mit mir abzusehen. Ich werde eigentlich erst abends munter.\n@c3@"
  en: "@a@b*: I ask that you refrain from speaking with me now. I happen to be a night owl.\n@c3@"
  es: "@a@b*: %H860%XOs%YLes%Z pido que %H860%Xos contengáis%Yse contengan%Z y no me %H860%Xhabléis%Yhablen%Z ahora. Soy un ave nocturna.\n@c3@"
  fr: "@a@b*ⓢ Si vous pouviez éviter de me causer maintenant... je suis plutôt du soir, moi.\n@c3@"
  it: "@a@b*: Per favore, non %H860%Xparlare%Yparlate%Z con me adesso! Io sono un animale notturno!\n@c3@"
  ja: "@a@b＊「話しかけないでくれ。\n\tオレっちは夜型なんでい。\n@c3@"
"6":
  de: "@a@b%0%a00120 liest das Schild.\n@c0@"
  en: "@a@b%0%a00120 reads the sign.\n@c0@"
  es: "@a@b%0%a00120 lee el cartel.\n@c0@"
  fr: "@a@b%0%a00120 lit l'écriteau.\n@c0@"
  it: "@a@b%0%a00120 legge il cartello.\n@c0@"
  ja: "@a@b%a00120は　立て札を　読んだ。\n@c0@"
"7":
  de: "@a@bⓞWaffenladen Kanalot. \nGeöffnet ab der Abenddämmerung. Unsere Kunden liegen uns am Herzen.ⓟ\n@c0@"
  en: "@a@bⓗCanalot Weapon Shop\nOpen for business after dusk.\nWe work hard all year round.ⓘ\n@c0@"
  es: "@a@b''Armería de Canalot\nAbierta después del anochecer.\nTrabajamos sin cesar todo el año.''\n@c0@"
  fr: "@a@bⓥMagasin d'armes de Canalot\nOuverture au crépuscule,\ntous les jours de l'année.ⓦ\n@c0@"
  it: "@a@bⓕArmeria di Canalot\nIl negozio apre dopo il tramonto\nLavoriamo per soddisfare le vostre necessitàⓖ\n@c0@"
  ja: "@a@b武器屋でい！\n日が沈んでから営業開始。\n年中無休でがんばるぜ。\n@c0@"
"8":
  de: "@a@b*: Hier in Kanalot erzählt man sich seit jeher Geschichten über das schwebende Schloss Zenithia.\n@c2@"
  en: "@a@b*: Here in Canalot, there has long been talk concerning the floating castle of Zenithia.\n@c2@"
  es: "@a@b*: Aquí en Canalot se habla desde hace mucho del castillo flotante de Zenithia.\n@c2@"
  fr: "@a@b*ⓢ Dans la région, tout le monde a entendu parler du château volant de Zénithia.\n@c2@"
  it: "@a@b*: Ostregheta! Qui a Canalot non si fa altro che parlare del castello fluttuante di Zenithia! Xe una bella preoccupazione!\n@c2@"
  ja: "@a@b＊「ここ　スタンシアラには古くから\n\t天空の城にまつわる\n\t言い伝えがあってな……。\n@c2@"
"9":
  de: "@a@b*: Wenn Ihr mehr darüber wissen wollt, fragt lieber den Gelehrten in der Burg. Ich kann mich nicht mehr an die Einzelheiten erinnern.\n@c2@"
  en: "@a@b*: If you wish to know more you should ask the scholar at the castle, for I forgot the details long ago now.\n@c2@"
  es: "@a@b*: Si %H860%Xdeseáis%Ydesean%Z saber más sobre él, %H860%Xdeberéis%Ydeberán%Z preguntar al erudito del castillo, ya que yo olvidé todos los detalles tiempo ha.\n@c2@"
  fr: "@a@b*ⓢ Si vous voulez en savoir plus, demandez au savant du château. Il se rappellera de détails que j'ai oubliés depuis longtemps.\n@c2@"
  it: "@a@b*: Se %H860%Xvuoi%Yvolete%Z saperne di più, %H860%Xchiedi%Ychiedete%Z informazioni allo studioso al castello. Io non ricordo tutti i dettagli, ciò!\n@c2@"
  ja: "@a@b＊「くわしい内容は　お城の学者にでも\n\t聞いてくれ。　わしゃ　言い伝えなぞ\n\tとっくの昔に　忘れてしもうたわい。\n@c2@"
"10":
  de: "@a@b*: Wie wunderschön ist Euer Antlitz, wenn es sich spiegelt im kristallklaren Wasser...\n@c2@"
  en: "@a@b*: How beautiful your face is, reflected in the crystal clear water...\n@c2@"
  es: "@a@b*: Cuán bello tu rostro es, reflejado en el agua cristalina...\n@c2@"
  fr: "@a@b*ⓢ Que ton visage est resplendissant,\nlorsqu'il se reflète dans les eaux cristallines...\n@c2@"
  it: "@a@b*: Che bello il tuo volto che si riflette nel calmo specchio di queste acque limpide... \n@c2@"
  ja: "@a@b＊「ラララ\n\t水面に映る　キミの顔ー！\n@c2@"
"11":
  de: "@a@b*: Also bitte! Wisst Ihr denn nicht, dass es unfein ist, einen Mann zu stören, der gerade einer Dame den Hof macht?\n@c2@"
  en: "@a@b*: I say! Do you not know it's bad form to disturb a man when he's courting?\n@c2@"
  es: "@a@b*: ¡Pardiez! ¿Acaso no %H860%Xsabe vuesa merced%Ysaben vuesas mercedes%Z que no se debe molestar a un hombre cuando corteja a una dama?\n@c2@"
  fr: "@a@b*ⓢ Dites doncⓠ Vous ne savez pas que c'est impoli de déranger un homme lorsqu'il courtise une dameⓡ\n@c2@"
  it: "@a@b*: Ehi, dico! Ma non lo %H860%Xsai%Ysapete%Z che xe cattiva educazione disturbare un omo impegnato a corteggiar una bella putea? Ostregheta!\n@c2@"
  ja: "@a@b＊「ちょっと　ちょっと\n\t人のデートのじゃまを\n\tしないでくださいよ。\n@c2@"
"12":
  de: "@aBlondelle@bParbleu, ist das langweilisch. Dieser Mann 'at keinen anderen Gedanken als seine ewigen Gedischte.\n@c1@"
  en: "@aBlondelle@bZis is so boring.\nAll zis man ever does is make poetry.\n@c1@"
  es: "@aBlondelle@bEsto es tan abugrido.\nLo único que hace este hombgre es grecitagr poesía.\n@c1@"
  fr: "@aJane Blond@bJ'en ai marre.\nCet homme ne sait qu'écrire des poèmes.\n@c1@"
  it: "@aBlondelle@bOh là là, che noia! Questo qui non sa far altro che rescitare versi... \n@c1@"
  ja: "@a@b＊「たいくつだわ。\n\t歌ばっか　歌ってんだもん。\n@c1@"
"13":
  de: "@a@b*: König Kichers Aufruf macht aus unserer Stadt ein zweites Laissez Fayre ⓚⓛ überall Gaukler und Komiker.\n@c2@"
  en: "@a@b*: King Larfur's appeal is turning our city into another Laissez Fayre, full of entertainers and comedians.\n@c2@"
  es: "@a@b*: El anuncio del rey Jarturo está convirtiendo nuestra ciudad en otra Laissez Fayre, llena de bufones y comediantes.\n@c2@"
  fr: "@a@b*ⓢ Depuis l'appel du roi Larfour, notre ville se remplit de comédiens et de comiques.\nJ'ai l'impression de me retrouver à Teafortwo.\n@c2@"
  it: "@a@b*: L'appello del sior Re Zonin sta trasformando la nostra città in un'altra Laissez Fayre, un secondo paradiso per attori e intrattenitori, ciò.\n@c2@"
  ja: "@a@b＊「王さまの　おふれのせいで\n\tモンバーバラなみに　お笑い芸人が\n\t集まってくる街になりそうですな。\n@c2@"
"14":
  de: "@a@b*: Ich bin hier auf der Suche nach dem Zenithiahelm.\n@c2@"
  en: "@a@b*: I came here in search of the Zenithian Helm.\n@c2@"
  es: "@a@b*: Vine aquí en busca del Yelmo de Zenithia.\n@c2@"
  fr: "@a@b*ⓢ Je suis venu chercher le Casque zénithien.\n@c2@"
  it: "@a@b*: Sono qui per cercare l'Elmo Zenithiano.\n@c2@"
  ja: "@a@b＊「わたしは　天空のかぶとを探して\n\tここまで来たのだ。\n@c2@"
"15":
  de: "@a@b*: Ich habe gehört, er sei hier in der Königlichen Sammlung.\n@c2@"
  en: "@a@b*: I heard that it was part of the royal collection here, you see.\n@c2@"
  es: "@a@b*: Escuché que forma parte de la armería real.\n@c2@"
  fr: "@a@b*ⓢ J'ai entendu dire qu'il faisait partie du trésor royal.\n@c2@"
  it: "@a@b*: Go sentito dir che fa parte della Galleria Reale.\n@c2@"
  ja: "@a@b＊「うわさでは　ここの王さまが\n\t持っているらしいのだが……。\n@c2@"
"16":
  de: "@a@b*: Willkommen, willkommen! ... Allerdings hat die Schänke leider nur nachts offen. Ich bedaure.\n@c1@"
  en: "@a@b*: Welcome, welcome! ...Though I'm afraid the pub is only open at night. My apologies.\n@c1@"
  es: "@a@b*: ¡Sed %H860%X%A120%Xbienvenido%Z%B120%Xbienvenida%Z%Y%R000%Xbienvenidas%Ybienvenidos%Z%Z! ... Aunque lamentablemente el local solo abre por las noches. Mis disculpas.\n@c1@"
  fr: "@a@b*ⓢ Bonjourⓠ ... Désolée, mais la taverne n'ouvre que le soir.\n@c1@"
  it: "@a@b*: Salve! Ehm... Il locale xe aperto solo di sera. Mi dispiace. \n@c1@"
  ja: "@a@b＊「いらっしゃい！\n\tでも　酒場は夜からなの。\n\tごめんね。\n@c1@"
"17":
  de: "@a@b*: Ich bin überzeugt, dass himmlische Wesen in Zenithia und jenseits davon stets ein Auge auf uns haben.\n@c1@"
  en: "@a@b*: I have faith that divine forces are always watching over us from Zenithia and beyond.\n@c1@"
  es: "@a@b*: Tengo fe en que hay fuerzas divinas que nos observan siempre desde Zenithia y más allá.\n@c1@"
  fr: "@a@b*ⓢ Je suis persuadée que des forces divines veillent sur nous depuis Zénithia et même au-delà.\n@c1@"
  it: "@a@b*: Sono certa che non saremo mai abbandonati dalla benevolenza celeste proveniente da Zenithia e dalla nostra amatissima dea.\n@c1@"
  ja: "@a@b＊「神さまは　天空の城に住んでいて\n\tきっと　いつも　わたくしたちを\n\t見守っているのですわ。\n@c1@"
"18":
  de: "@a@b*: Ich muss mich beeilen, dass mein Mann sein Essen bekommt, wenn er nach Hause kommt.\n@c2@"
  en: "@a@b*: I must hurry and prepare a meal before my husband comes home.\n@c2@"
  es: "@a@b*: Debo apresurarme y preparar la comida antes de que mi esposo llegue a casa.\n@c2@"
  fr: "@a@b*ⓢ Je dois me dépêcher de préparer à manger avant que mon mari ne rentre.\n@c2@"
  it: "@a@b*: Oh, per tutti i canali! Devo fare in fretta a preparar da mangiare. Mio marito potrebbe tornar da un momento all'altro, ciò!\n@c2@"
  ja: "@a@b＊「うちの人が　帰ってくるまでに\n\t食事のしたくを　しておかなきゃね。\n@c2@"
"19":
  de: "@a@b*: Ha-püh...\n@c2@"
  en: "@a@b*: Ah-phew...\n@c2@"
  es: "@a@b*: Ah, fiuuu...\n@c2@"
  fr: "@a@b*ⓢ Ron-pfff...\n@c2@"
  it: "@a@b*: Ronf... \n@c2@"
  ja: "@a@b＊「ぐごー　ぐごー。\n@c2@"
"20":
  de: "@a@b*: Es klingt, als sei Zenithia ein Schloss droben in den Wolken. Glaubt Ihr, so etwas gibt es wirklich?\n@c1@"
  en: "@a@b*: It sounds like Zenithia is a castle up in the clouds. Do you think that's really possible?\n@c1@"
  es: "@a@b*: Parece como si Zenithia fuera un castillo situado en las nubes. ¿%H860%XPiensa vuesa merced%YPiensan vuesas mercedes%Z que ello es posible?\n@c1@"
  fr: "@a@b*ⓢ Il semblerait que Zénithia soit un château qui flotte dans les nuages. Vous croyez que c'est vraiⓡ\n@c1@"
  it: "@a@b*: Si dice che Zenithia sia un castello che fluttua tra le nuvole... Ma come xe possibile una cosa del genere, ciò?\n@c1@"
  ja: "@a@b＊「天空の城っていうぐらいだから\n\t雲の上に　お城があるんでしょ？\n\tそんなこと　ありえるのかしら……。\n@c1@"
"21":
  de: "@a@b*: Ha-püh...\n@c2@"
  en: "@a@b*: Ah-phew...\n@c2@"
  es: "@a@b*: Ah, fiuuu...\n@c2@"
  fr: "@a@b*ⓢ Ron-pfff...\n@c2@"
  it: "@a@b*: Ronf... \n@c2@"
  ja: "@a@b＊「ぐうぐう……。\n@c2@"
"22":
  de: "@a@b*: Hmpf. Es ist unmöglich, sich etwas Vernünftiges auszudenken.\n@c2@"
  en: "@a@b*: Hmph. It's impossible to think of any decent material.\n@c2@"
  es: "@a@b*: Umpf. Es imposible encontrar ningún material decente.\n@c2@"
  fr: "@a@b*ⓢ Pfff. Y'a rien qui me vient à l'esprit.\n@c2@"
  it: "@a@b*: Pfui! Non mi viene in mente niente di decente.\n@c2@"
  ja: "@a@b＊「うーん。\n\tいいネタはないものか……。\n@c2@"
"23":
  de: "@a@b*: Wie selbstsüchtig von König Kicher, lachen zu wollen, wenn die Welt in solcher Gefahr ist.\n@c2@"
  en: "@a@b*: How selfish of King Larfur to demand laughter when the world is in such a perilous state.\n@c2@"
  es: "@a@b*: Qué egoísta por parte del rey Jarturo pedir alegría cuando el mundo se halla en una situación tan delicada.\n@c2@"
  fr: "@a@b*ⓢ Le roi Larfour est vraiment égoïste d'exiger du rire alors que le monde est sur le point de s'effondrer...\n@c2@"
  it: "@a@b*: Certo che il sior Re Zonin xe proprio un gran bell'incosciente! Lui pensa solo a ridere e scherzare, mentre il mondo si trova in questa situazione, ciò!\n@c2@"
  ja: "@a@b＊「まったく　こんなご時世なのに\n\t心の底から　大笑いしたいなどと\n\tわけがわからぬ　王さまだわい。\n@c2@"
"24":
  de: "@a@b*: Unsere Kundschaft ist in letzter Zeit ziemlich bedrückt.\n@c1@"
  en: "@a@b*: Our clientele seem rather gloomy of late.\n@c1@"
  es: "@a@b*: Nuestra clientela parece que está de capa caída últimamente.\n@c1@"
  fr: "@a@b*ⓢ Les clients ont l'air de broyer du noir, en ce moment.\n@c1@"
  it: "@a@b*: I nostri clienti sembrano tristi negli ultimi tempi, ciò!\n@c1@"
  ja: "@a@b＊「どうも　最近のお客さんは\n\t陰気なのよねえ。\n@c1@"
"25":
  de: "@a@b*: Und warum auch nicht? Wie viel wir auch beten, bald wird der Herr der Unterwelt unsere Welt vernichten.\n@c2@"
  en: "@a@b*: And why not? No matter how much we pray, the Lord of the Underworld will soon destroy our world.\n@c2@"
  es: "@a@b*: ¿Y por qué no? No importa cuánto oremos, el Señor del Inframundo pronto acabará con el mundo.\n@c2@"
  fr: "@a@b*ⓢ Et pourquoi pasⓡ Toutes les prières du monde n'empêcheront pas le Seigneur des Enfers de détruire le monde d'ici peu.\n@c2@"
  it: "@a@b*: Forshe che non dovremmo esherlo? Poshiamo pregare tutto il tempo che vogliamo, ma il Shignore degli Inferi shi dishtruggerà ugualmente! Hic!\n@c2@"
  ja: "@a@b＊「いくら　神に祈ったところで\n\t地獄の帝王とやらが\n\t世界を滅ぼしてしまうのだ……。\n@c2@"
"26":
  de: "@a@b*: Wie kann man solche Gedanken ertragen?! Hick!\n@c2@"
  en: "@a@b*: How can we bear such a thought!? Hic!\n@c2@"
  es: "@a@b*: ¡¿Cómo puedo soportar tal idea!? ¡Hip!\n@c2@"
  fr: "@a@b*ⓢ Comment pouvons-nous vivre avec cette certitudeⓠⓑ Hicⓠ\n@c2@"
  it: "@a@b*: Queshto penshiero mi fa impashire! Hic!\n@c2@"
  ja: "@a@b＊「これが　飲まずにいられるか！\n\tひっく……。\n@c2@"
"27":
  de: "@a@b*: Ich weigere mich zu glauben, dass unsere Welt untergehen wird. Es gibt doch keine echte Gefahr, oder?\n@c0@"
  en: "@a@b*: I refuse to believe that the world will come to an end. We are safe, are we not?\n@c0@"
  es: "@a@b*: Me niego a pensar que nuestro mundo se puede acabar. Estamos a salvo, ¿no es así?\n@c0@"
  fr: "@a@b*ⓢ Je refuse de croire que le monde court à sa perte. Tout va bien se passer, nonⓡ\n@c0@"
  it: "@a@b*: Mi rifiuto di credere che il mondo shtia per finire... Hic! Noi shiamo al shicuro, non xe coshì, ciò?\n@c0@"
  ja: "@a@b＊「ねえ　教えてください！\n\t世界は滅んだりしませんよね！？\n@c0@"
"28":
  de: "@a@b*: Ist mir egal, was Ihr in Wirklichkeit glaubt. Stimmt mir einfach zu!\n@c0@"
  en: "@a@b*: It matters not what you really think.\nJust say yes!\n@c0@"
  es: "@a@b*: No importa lo que %H860%Xpenséis%Ypiensen%Z.\n¡Simplemente %H860%Xresponded%Yrespondan%Z afirmativamente!\n@c0@"
  fr: "@a@b*ⓢ Peu importe ce que vous pensez vraiment.\nDites simplement ouiⓠ\n@c0@"
  it: "@a@b*: Non shtarshi a penshare troppo! Hic! Devi sholo dire di shì! Hic! \n@c0@"
  ja: "@a@b＊「ウソでもいいから\n\tはいって　言ってくださいよ！\n@c0@"
"29":
  de: "@a@b*: Danke. Hick!\nIhr seid wirklich ein guter Mensch.\n@c0@"
  en: "@a@b*: Thank you. Hic!\nYou are a truly good person.\n@c0@"
  es: "@a@b*: Gracias. ¡Hip!\nEn verdad %H860%Xsois una buena persona%Yson buenas personas%Z.\n@c0@"
  fr: "@a@b*ⓢ Merci. Hicⓠ\nVous êtes quelqu'un de bien.\n@c0@"
  it: "@a@b*: Grashie... Hic! Shei proprio una brava pershona! Hic!\n@c0@"
  ja: "@a@b＊「あんた　いい人だなあ。\n\tうっうっ。　ひっく……。\n@c0@"
"30":
  de: "@a@b*: Nein! Hick! Also wird es wirklich geschehen...\n@c0@"
  en: "@a@b*: No! Hic! So it really is going to happen...\n@c0@"
  es: "@a@b*: ¡No! ¡Hip! Entonces, va a ocurrir realmente...\n@c0@"
  fr: "@a@b*ⓢ Nonⓡ Hicⓠ Alors ça va vraiment arriver...\n@c0@"
  it: "@a@b*: No! Hic! Ma allora shushederà davvero...!\n@c0@"
  ja: "@a@b＊「うわーん　やっぱり滅んじゃうんだ！\n\tうっうっ。　ひっく……。\n@c0@"
"31":
  de: "@a@b*: Wo steckt denn nur der Priester zu dieser nächtlichen Stunde?\n@c1@"
  en: "@a@b*: I wonder where the priest can be at this hour of night.\n@c1@"
  es: "@a@b*: Me pregunto dónde puede encontrarse el sacerdote a estas horas de la noche.\n@c1@"
  fr: "@a@b*ⓢ Je me demande où le père peut bien être à une heure si tardive.\n@c1@"
  it: "@a@b*: Ma dove sarà il sacerdote, a quest'ora di notte?\n@c1@"
  ja: "@a@b＊「神父さまったら　こんな夜更けに\n\tどこに行ったのかしら……。\n@c1@"
"32":
  de: "@a@b*: Da er sich nicht blicken ließ, hat diese Kreatur sich einfach dort breitgemacht. Das ist alles wirklich sehr beunruhigend.\n@c1@"
  en: "@a@b*: With him nowhere to be seen, that strange creature came and took over the place.\nIt's all very worrying indeed.\n@c1@"
  es: "@a@b*: En su ausencia, esa extraña criatura llegó y se adueñó del lugar.\nTodo esto es muy preocupante.\n@c1@"
  fr: "@a@b*ⓢ Comme il n'était pas là, cette créature est arrivée et s'est installée.\nC'est très inquiétant.\n@c1@"
  it: "@a@b*: Lui non c'è, e quella strana creatura è venuta e ha preso il suo posto. Che situazione imbarazzante!\n@c1@"
  ja: "@a@b＊「神父さまが　いないもんだから\n\tわけのわからない方が　教会に\n\t居座ってるし……困ったわ。\n@c1@"
"33":
  de: "@a@b*: Er sieht vielleicht merkwürdig aus, aber er rettet den Leuten das Leben, ohne etwas dafür zu verlangen.\n@c2@"
  en: "@a@b*: He may be rather strange-looking, but he saves people's lives without demanding a fee.\n@c2@"
  es: "@a@b*: Puede que tenga un aspecto extraño, pero salva las vidas de las personas sin pedir nada a cambio.\n@c2@"
  fr: "@a@b*ⓢ Il a peut-être l'air bizarre, mais il sauve les gens sans rien demander en échange.\n@c2@"
  it: "@a@b*: Gavrà anche un aspetto strano, ma resta il fatto che cura le persone senza chiedere nemmeno uno sgheo in cambio.\n@c2@"
  ja: "@a@b＊「少々　奇怪な格好をしておるが\n\t金を取らずに　人の命を救うとは\n\t見上げたおかたじゃて。\n@c2@"
"34":
  de: "@a@b*: Der bringt es sicher noch weit.\n@c2@"
  en: "@a@b*: I'm sure he'll go far.\n@c2@"
  es: "@a@b*: Seguro que llegará lejos.\n@c2@"
  fr: "@a@b*ⓢ Je suis sûr qu'il ira loin.\n@c2@"
  it: "@a@b*: Sono certo che gavrà molto successo, ciò!\n@c2@"
  ja: "@a@b＊「いずれ　大物になるじゃろう！\n@c2@"
"35":
  de: "@a@b*: Ich bin ja so dankbar! Ein Ungeheuer hat mich angegriffen und schwer verwundet, aber dieser kleine Kerl hier war meine Rettung.\n@c2@"
  en: "@a@b*: I couldn't be more thankful!\nA monster attacked me and injured me terribly, but this little fellow has been my saviour.\n@c2@"
  es: "@a@b*: No podría estarle más agradecido.\nUn monstruo me atacó y me infligió terribles heridas, pero esta criatura me ha salvado.\n@c2@"
  fr: "@a@b*ⓢ Je sais pas comment le remercierⓠ\nUn monstre m'a attaqué et m'a blessé, mais ce petit gars m'a sauvé.\n@c2@"
  it: "@a@b*: Grazie! Grazie di cuore! Un mostro mi gaveva attaccato, procurandomi delle terribili ferite, ma questa piccola creaturina mi ga salvato, ciò!\n@c2@"
  ja: "@a@b＊「ありがたや　ありがたや。\n\t魔物にやられて　大ケガしたんですが\n\tこの方の術で　救われたんです！\n@c2@"
"36":
  de: "@aGuru Kuru@b(Schlürf, schlürrrf)\n@c1@"
  en: "@aGuru Curu@b(slurrrp, slurrrp)\n@c1@"
  es: "@aGurú Curu@b(Slurp, slurp)\n@c1@"
  fr: "@aGourou Guéry@b(Slurrrp, slurrrp)\n@c1@"
  it: "@aGuru Curu@bSlurp! Slurp!\n@c1@"
  ja: "@a@bベホマン「ベホマ～ン　ベホマ～ン。\n@c1@"
"37":
  de: "@a@b*: Diese Floßfahrerei und Geschäftemacherei den lieben langen Tag macht hungrig! Wo bleibt denn das Essen? Ist das Essen noch immer nicht fertig? \n@c2@"
  en: "@a@b*: It's hungry work riding a raft and trading away all day. Now where's my dinner? I say!\nIs dinner still not ready!?\n@c2@"
  es: "@a@b*: Navegar en una barca y estar haciendo negocios todo el día es un trabajo que da mucha hambre. ¿Dónde está mi cena? ¡Pardiez!\n㈡\n*: ¡¿Es que no está lista mi cena!?!\n@c2@"
  fr: "@a@b*ⓢ Ça donne faim de diriger un radeau et de bosser toute la journée. Où est mon dînerⓡ\nAlorsⓡ Il est prêt ce repasⓡ\n@c2@"
  it: "@a@b*: Lavoro tutto il giorno, e go una fame da lupi, ciò! Dove xe la mia cena? Per tutte le acque alte! Dove xe questa cena?!\n@c2@"
  ja: "@a@b＊「イカダに乗って　商売をすると\n\tまったく　腹が減る。\n\tメシはまだかっ　メシはっ！？\n@c2@"
"38":
  de: "@a@b*: Mein Mann hat immer so einen gewaltigen Appetit. Ich weiß schon gar nicht mehr, was ich machen soll.\n@c2@"
  en: "@a@b*: My husband eats so much that I'm at the end of my tether.\n@c2@"
  es: "@a@b*: Mi esposo come tanto que yo estoy en las últimas.\n@c2@"
  fr: "@a@b*ⓢ Mon mari mange tellement... je n'en peux plus.\n@c2@"
  it: "@a@b*: Ostregheta! Non ne posso più! Mio marito mangia come uno sfondato, xe impossibile accontentarlo!\n@c2@"
  ja: "@a@b＊「うちの人の　大食らいにも\n\tホント　困ったものだわ。\n@c2@"
"39":
  de: "@a@b*: Dort drüben liegt die Burg Kanalot.\n@c2@"
  en: "@a@b*: Yonder lies Canalot Castle.\n@c2@"
  es: "@a@b*: Allí se halla el Castillo de Canalot.\n@c2@"
  fr: "@a@b*ⓢ Voici le château de Canalot.\n@c2@"
  it: "@a@b*: Quello xe il castello di Canalot, ciò.\n@c2@"
  ja: "@a@b＊「ここより\n\tスタンシアラのお城である！\n@c2@"
"40":
  de: "@a@b*: Ihr seid wohl des Königs Aufruf gefolgt?\n@c2@"
  en: "@a@b*: Am I to assume that you are here to answer King Larfur's appeal?\n@c2@"
  es: "@a@b*: ¿Debo suponer que %H860%Xestáis%Yestán%Z aquí en respuesta al llamamiento del rey Jarturo?\n@c2@"
  fr: "@a@b*ⓢ Ai-je raison de penser que vous êtes là pour répondre à l'appel lancé par le roi Larfourⓡ\n@c2@"
  it: "@a@b*: Immagino che %H860%Xtu xe%Yvoi siate%Z qui per rispondere all'appello del sior Re Zonin... \n@c2@"
  ja: "@a@b＊「王さまのおふれを聞いて\n\tやってきたのかな？\n@c2@"
"41":
  de: "@a@b*: König Kicher versprach jenem reichen Lohn, welcher ihn zu amüsieren vermöge.\n@c2@"
  en: "@a@b*: King Larfur has promised to bestow a substantial reward upon whosoever is able to entice him to mirth.\n@c2@"
  es: "@a@b*: El rey Jarturo ha prometido otorgar una sustanciosa recompensa a aquel que sea capaz de provocarle una carcajada.\n@c2@"
  fr: "@a@b*ⓢ Il a promis une récompense substantielle à celui ou celle qui parviendra à déclencher son hilarité.\n@c2@"
  it: "@a@b*: Il sior Re Zonin ga promesso che elargirà una grossa ricompensa a chi riuscirà nell'impresa di farlo ridere, ciò.\n@c2@"
  ja: "@a@b＊「王さまを　大笑いさせた者は\n\tどんなほうびも　思いのままじゃ！\n@c2@"
"42":
  de: "@a@b*: Ich stehe hier Wache, um eine Penetrierung der Burg durch die Ungeheuer zu vereiteln.\n@c3@"
  en: "@a@b*: I stand guard here to prevent monsters from entering the castle.\n@c3@"
  es: "@a@b*: Yo hago guardia en este lugar para impedir que los monstruos entren en el castillo.\n@c3@"
  fr: "@a@b*ⓢ Je monte la garde pour empêcher les monstres de pénétrer dans le château.\n@c3@"
  it: "@a@b*: Sto di guardia qui per impedir ai mostri di entrar nel castello.\n@c3@"
  ja: "@a@b＊「この城に　魔物どもが\n\t入ってこぬよう　見張っている。\n@c3@"
"43":
  de: "@a@b*: Deren Betragen wurde in letzter Zeit immer perfider, und so ist es denn umso wichtiger, dass wir Wachen allezeit auf der Hut sind.\n@c3@"
  en: "@a@b*: They are becoming more and more devious of late, so it's important that we guards are alert at all times.\n@c3@"
  es: "@a@b*: En los últimos tiempos se han vuelto cada vez más taimados. Los guardias debemos estar alerta en todo momento.\n@c3@"
  fr: "@a@b*ⓢ Ils sont de plus en plus malins ces derniers temps. Tous les gardes doivent être en permanence sur le qui-vive.\n@c3@"
  it: "@a@b*: Ultimamente sono diventati molto più aggressivi, e xe importante che noi guardie siamo sempre attente.\n@c3@"
  ja: "@a@b＊「昔にくらべ　魔物どもも\n\tかしこくなってきたので\n\tわれわれも油断できぬのだ。\n@c3@"
"44":
  de: "@a@b*: Wie gerne würde ich dereinst Zenithia, das Schloss in den Wolken, mit eigenen Augen sehen.\n@c2@"
  en: "@a@b*: How I would love to visit the castle in the sky, Zenithia.\n@c2@"
  es: "@a@b*: Me causaría gran regocijo poder visitar el castillo en el cielo, Zenithia.\n@c2@"
  fr: "@a@b*ⓢ J'aimerais vraiment visiter Zénithia, le château dans le ciel.\n@c2@"
  it: "@a@b*: Oh, quanto vorrei visitare Zenithia, il castello nel cielo!\n@c2@"
  ja: "@a@b＊「できることなら\n\t天空の城に　行ってみたいものです。\n@c2@"
"45":
  de: "@a@b*: Doch dazu müsste man sich zuvörderst die gesamte Zenithia-Ausrüstung verschaffen. Das vermag ich mitnichten.\n@c2@"
  en: "@a@b*: But first one must collect all of the Zenithian Equipment. I have no hope of being able to do such a thing.\n@c2@"
  es: "@a@b*: Pero, en primer lugar, se debe obtener todo el Equipo de Zenithia. Mis esperanzas de poder realizar semejante proeza son escasas.\n@c2@"
  fr: "@a@b*ⓢ Pour ça, il faut d'abord récupérer tout l'Équipement zénithien.\nJe n'ai aucun espoir d'y arriver.\n@c2@"
  it: "@a@b*: Ma per riuscirci xe necessario ottenere tutto l'Equipaggiamento Zenithiano. Sigh! Non ce la farò mai!\n@c2@"
  ja: "@a@b＊「しかし　天空の武器　防具の\n\tすべてを集めるなど　私には\n\tとても　できそうもありません。\n@c2@"
"46":
  de: "@a@b*: Die Leute erzählen, dermaleinst habe sich der Zenithiaschild in Burland befunden. Doch wo die anderen Dinge sind, wurde mir nie kundgetan.\n@c2@"
  en: "@a@b*: People say that the Zenithian Shield was once located in Burland. But I know not where the other items are located.\n@c2@"
  es: "@a@b*: Se dice que el Escudo de Zenithia estuvo una vez en Burlandia. En cuanto al paradero de los demás objetos, lo ignoro.\n@c2@"
  fr: "@a@b*ⓢ Il paraît que le Bouclier zénithien avait été repéré à Bastione il fut un temps, mais je ne sais pas où se trouve le reste de l'attirail.\n@c2@"
  it: "@a@b*: Secondo alcuni, lo Scudo Zenithiano un tempo xera a Burlandia, ma non go idea di dove siano gli altri pezzi.\n@c2@"
  ja: "@a@b＊「うわさでは　その昔\n\t天空の盾が　バトランドに\n\tあったそうですが……。\n@c2@"
"47":
  de: "@a@b*: So Ihr eine Audienz bei König Kicher erheischt, begebt Euch bitte diese Treppe hier hinauf.\n@c2@"
  en: "@a@b*: If you wish to meet with King Larfur, please ascend the staircase before you.\n@c2@"
  es: "@a@b*: Si %H860%Xdeseáis%Ydesean%Z reunir%H860%Xos%Yse%Z con el rey Jarturo, %H860%Xos%Yles%Z ruego que %H860%Xascendáis%Yasciendan%Z por la escalera que se abre ante %H860%Xvos%Yvuesas mercedes%Z.\n@c2@"
  fr: "@a@b*ⓢ Si vous souhaitez rencontrer le roi Larfour, prenez l'escalier devant vous.\n@c2@"
  it: "@a@b*: Se %H860%Xdesideri%Ydesiderate%Z avere udienza presso il sior Re Zonin, %H860%Xdevi%Ydovete%Z salir le scale, ciò.\n@c2@"
  ja: "@a@b＊「王さまに会うのなら\n\tこの階段を　のぼるがいい。\n@c2@"
"48":
  de: "@a@b*: Hier in Kanalot erzählen sich die Leute schon lange die Mär von Zenithia, dem Reich droben in den Wolken.\n@c2@"
  en: "@a@b*: Here in Canalot, there has long been talk concerning Zenithia, the kingdom in the sky.\n@c2@"
  es: "@a@b*: Ya hace mucho tiempo que se habla aquí, en Canalot, de Zenithia, el reino de los cielos.\n@c2@"
  fr: "@a@b*ⓢ Ici, à Canalot, des rumeurs circulent depuis bien longtemps au sujet de Zénithia, le royaume dans le ciel.\n@c2@"
  it: "@a@b*: Xe da tempo che qui a Canalot si parla di Zenithia, il regno nel cielo, ciò.\n@c2@"
  ja: "@a@b＊「この城には　古くから\n\t天空の城にまつわる\n\t言い伝えがござってな。\n@c2@"
"49":
  de: "@a@b*: Es ist nur demjenigen vergönnt, nach Zenithia emporzusteigen, der die Zenithiarüstung sowie den Helm, den Schild und das Schwert findet.\n@c2@"
  en: "@a@b*: It seems that he who collects the Zenithian Armour, Helm, Shield and Sword earns the right to ascend to Zenithia.\n@c2@"
  es: "@a@b*: Al parecer, aquel que consiga la Armadura, el Yelmo, el Escudo y la Espada de Zenithia ganará el derecho a ascender al reino.\n@c2@"
  fr: "@a@b*ⓢ Il semblerait que celui ou celle qui parviendra à rassembler l'Armure, l'Épée, le Casque et le Bouclier zénithiens obtiendra le droit de se rendre à Zénithia.\n@c2@"
  it: "@a@b*: Secondo la leggenda, chi conquista l'Armatura, l'Elmo, lo Scudo e la Spada Zenithiani ga il diritto di ascendere a Zenithia.\n@c2@"
  ja: "@a@b＊「天空のよろい　かぶと　盾\n\tそして　天空の剣を得た者は\n\t天空にのぼれるという。\n@c2@"
"50":
  de: "@a@b*: Beklagenswerterweise aber befindet sich nur noch der Zenithiahelm in der Königlichen Sammlung von Kanalot.\n@c2@"
  en: "@a@b*: But the lamentable fact is that only the Zenithian Helm remains part of the Canalot royal collection.\n@c2@"
  es: "@a@b*: Pero, por desdicha, en la armería real de Canalot solo queda el Yelmo de Zenithia.\n@c2@"
  fr: "@a@b*ⓢ Malheureusement, seul le Casque zénithien est encore dans la collection royale de Canalot.\n@c2@"
  it: "@a@b*: La cosa xe complicata però, perché nella Galleria Reale di Canalot xe solo l'Elmo Zenithiano.\n@c2@"
  ja: "@a@b＊「しかし　残念ながら\n\t王家に代々伝わってきたのは\n\t天空のかぶと　だけなのだよ。\n@c2@"
"51":
  de: "@a@b*: Meine Mutter hat mir früher, als ich noch klein war, gar mannigfaltig Mär erzählt.\n@c2@"
  en: "@a@b*: My mother often told me tales when I was younger.\n@c2@"
  es: "@a@b*: Mi madre solía relatarme cuentos cuando era niño.\n@c2@"
  fr: "@a@b*ⓢ Ma mère m'a raconté beaucoup d'histoires quand j'étais plus jeune.\n@c2@"
  it: "@a@b*: Quando ero un puteo, la mia mamma mi raccontava delle favole.\n@c2@"
  ja: "@a@b＊「小さいとき　よく母親に\n\t聞かされましたっけ。\n@c2@"
"52":
  de: "@a@b*: Sie erzählte mir von einem Schloss in den Wolken, wo der Drachengott zu Hause ist.\n@c2@"
  en: "@a@b*: She told me of a castle in the clouds where the Dragon God lives.\n@c2@"
  es: "@a@b*: Me hablaba de un castillo en las nubes en donde moraba el Dios Dragón.\n@c2@"
  fr: "@a@b*ⓢ Elle me parlait d'un château dans les nuages, où habite le Dieu-dragon.\n@c2@"
  it: "@a@b*: Mi parlava del castello tra le nuvole, che xe la casa del Drago Divino.\n@c2@"
  ja: "@a@b＊「雲の上に　大きなお城があって\n\tそこには　竜の神が住んでいると。\n@c2@"
"53":
  de: "@a@b*: So es denn wahr ist, dass der Drachengott in Zenithia lebt, muss ein tapferer Krieger ihn aufsuchen und seine Hilfe erheischen.\n@c1@"
  en: "@a@b*: If it is true that the Dragon God resides in Zenithia, then a brave warrior must go to him and request his assistance.\n@c1@"
  es: "@a@b*: Si es cierto que el Dios Dragón mora en Zenithia, un guerrero valeroso debe ir a suplicarle su ayuda.\n@c1@"
  fr: "@a@b*ⓢ Si le Dieu-dragon habite vraiment Zénithia, il faut qu'un guerrier courageux aille le voir pour lui demander de l'aide.\n@c1@"
  it: "@a@b*: Se davvero il Drago Divino si trova a Zenithia, allora un prode guerriero dovrebbe andar da lui a chiedere aiuto, no?\n@c1@"
  ja: "@a@b＊「もし本当に　天空の城に\n\t竜の神さまがいるんだったら\n\t誰かが　頼みに行けばいいのよ。\n@c1@"
"54":
  de: "@a@b*: Macht geht nicht vor Recht!\nDie Pläne des Herrn der Unterwelt und seiner Schergen, der Ungeheuer, müssen vereitelt werden!\n@c1@"
  en: "@a@b*: Right must be defended against might.\nThe Lord of the Underworld and his monstrous minions must be stopped.\n@c1@"
  es: "@a@b*: Lo correcto debe prevalecer ante el poder.\nEl Señor del Inframundo y sus esbirros monstruosos deben ser detenidos.\n@c1@"
  fr: "@a@b*ⓢ Le droit doit prévaloir sur la force.\nLe Seigneur des Enfers et ses monstrueux serviteurs doivent être arrêtés.\n@c1@"
  it: "@a@b*: A volte bisogna usar la forza per difendersi dalle prepotenze. Questo Signore degli Inferi e i suoi tirapiedi devono esser fermati, ostregheta!\n@c1@"
  ja: "@a@b＊「地獄の帝王や　魔物どもを\n\t退治してくださいってね。\n@c1@"
"55":
  de: "@a@b*: Habt Ihr vernommen, was sich in Samokswa zugetragen hat? Wie es scheint, wurde die Burg von Ungeheuern überrannt.\n@c2@"
  en: "@a@b*: Did you hear what has come to pass at Zamoksva? It seems the castle was attacked by monsters.\n@c2@"
  es: "@a@b*: ¿Habéis oído lo que ha sucedido en Zamoksva? Al parecer, el castillo sufrió un ataque de los monstruos.\n@c2@"
  fr: "@a@b*ⓢ Vous avez entendu ce qui s'est passé à Zamoksvaⓡ Le château aurait été attaqué par des monstres.\n@c2@"
  it: "@a@b*: %H860%XTi ga%YGavete%Z sentito cosa xe accaduto al castello di Zamoskva? Pare che sia stato attaccato dai mostri!\n@c2@"
  ja: "@a@b＊「ちょっと　お前さん　聞いたかい？\n\t南のサントハイムの城が　魔物に\n\tうばわれたって話じゃないのさ。\n@c2@"
"56":
  de: "@a@b*: Ich kann gut verstehen, dass König Kicher das alles zu vergessen sucht und wieder zu lachen verlangt.\n@c2@"
  en: "@a@b*: I can well understand why King Larfur wishes to forget everything and enjoy laughter again.\n@c2@"
  es: "@a@b*: Comprendo el deseo del rey Jarturo de olvidarse de todo y ser de nuevo dichoso.\n@c2@"
  fr: "@a@b*ⓢ Je peux comprendre pourquoi le roi Larfour veut rire un peu et essayer d'oublier.\n@c2@"
  it: "@a@b*: Adesso sì che capisco perché il sior Re Zonin vuole dimenticarsi di tutto e farsi una bella risata!\n@c2@"
  ja: "@a@b＊「王さまが　何もかも忘れて\n\t笑いたくなる気持ちもわかるよ。\n@c2@"
"57":
  de: "@a@b*: Warum nur müssen Waffen und Rüstungen immer so schrecklich schwer sein?\n@c2@"
  en: "@a@b*: Why must weapons and armour be quite so heavy!?\n@c2@"
  es: "@a@b*: ¡¿Por qué es necesario que pesen tanto las armas y las armaduras?!\n@c2@"
  fr: "@a@b*ⓢ Pourquoi les armures et les armes doivent-elles être aussi lourdesⓠⓑ\n@c2@"
  it: "@a@b*: Ostregheta! Ma perché le armi e le armature devono esser sempre così pesanti?\n@c2@"
  ja: "@a@b＊「もう！　武器や防具って\n\tどうして　こんなに重いのー！\n@c2@"
"58":
  de: "@a@b*: Aber das muss man eben ertragen. Weiß man doch nie, wann die Ungeheuer von neuem attackieren!\n@c2@"
  en: "@a@b*: I accept that there is no choice but to endure it, though. One never knows when monsters might attack.\n@c2@"
  es: "@a@b*: Sin embargo, acepto que mi única opción es soportar su peso. Nunca se sabe cuándo puede haber un ataque de los monstruos.\n@c2@"
  fr: "@a@b*ⓢ Même si je sais que c'est un mal pour un bien... on ne sait jamais quand les monstres vont nous sauter dessus.\n@c2@"
  it: "@a@b*: Però capisco che non ci siano alternative. Bisogna sempre tenersi pronti, perché non si sa mai quando i mostri potrebbero attaccare, ciò!\n@c2@"
  ja: "@a@b＊「でも　いつ魔物たちが\n\t攻めてくるか分かんないから\n\t備えあれば　うれいなし　よねっ。\n@c2@"
"59":
  de: "@a@b*: Ein Stahl-Breitschwert? Wie das?! Stahl ich es doch gar nicht! ... Was meint Ihr, war das amüsant?\n@c2@"
  en: "@a@b*: How can this be a steel broadsword when I did not steal it!? ...Was that at all amusing, do you think?\n@c2@"
  es: "@a@b*: ¿Cómo va a ser esta espada de acero? ¡Por lo que pesa, debe de ser de asiete como mínimo! ... ¿Ha tenido la más mínima gracia ese chiste?\n@c2@"
  fr: "@a@b*ⓢ Quelle est l'arme qui sent le plus mauvaisⓡ\n㈡\n*ⓢ L'épée...\nElle est pas mal, nonⓡ\n@c2@"
  it: "@a@b*: Come si salutano due spade d'acciaio quando s'incontrano? ''Ciaio''! Allora? Xera divertente, no?\n@c2@"
  ja: "@a@b＊「この　はがねの剣には　歯がねえ！\n\tどうだ　おもしろいだろう？\n@c2@"
"60":
  de: "@a@b*: Seit die Ungeheuer sich zwischen uns tummeln, sind die Menschen immer bedrückteren Gemüts geworden.\n@c2@"
  en: "@a@b*: Since the monsters began appearing among us, the mood of our people has become progressively darker.\n@c2@"
  es: "@a@b*: Desde que los monstruos han empezado a dejarse ver, las personas se han vuelto más taciturnas.\n@c2@"
  fr: "@a@b*ⓢ Notre peuple a sombré dans la dépression depuis que les monstres sont arrivés.\n@c2@"
  it: "@a@b*: Da quando i mostri ganno fatto la loro comparsa tra noi, l'umore della nostra gente xe peggiorato.\n@c2@"
  ja: "@a@b＊「魔物どもが現れてからは\n\tこの国の人々の気持ちも\n\t暗く　沈んでしまった。\n@c2@"
"61":
  de: "@a@b*: Darum erließ König Kicher seinen Aufruf. Er wünscht seine Untertanen wieder zum Lachen zu bringen.\n@c2@"
  en: "@a@b*: This is why King Larfur was prompted to issue his appeal. He wishes to provide amusement to his subjects.\n@c2@"
  es: "@a@b*: Por eso decidió el rey Jarturo lanzar su llamamiento. Su deseo es ofrecer distracción a sus súbditos.\n@c2@"
  fr: "@a@b*ⓢ C'est pour cette raison que le roi Larfour a lancé cet appel. Il veut que ses sujets se divertissent.\n@c2@"
  it: "@a@b*: Ecco perché il sior Re Zonin ga lanciato quell'appello. Vuole restituire il buonumore al suo popolo!\n@c2@"
  ja: "@a@b＊「だから　王さまは\n\t自分が笑い者になるのを覚悟で\n\tあのような　おふれを出したのだ。\n@c2@"
"62":
  de: "@a@b*: In dem Städtchen, aus dem ich gerade komme, war ein umwerfend komischer Alleinunterhalter. Alberich von Übermuth, so hieß er.\n@c2@"
  en: "@a@b*: There was a hilarious entertainer in the wee town I was in afore. Tom Foolery was his name.\n@c2@"
  es: "@a@b*: En la ciudad en la que estaba antes había un juglar muy gracioso. Se llamaba Ben-Irrie.\n@c2@"
  fr: "@a@b*ⓢ J'ai rencontré un comique dans la ville où j'étais juste avant. Il s'appelle Tom Foolery.\n@c2@"
  it: "@a@b*: Nella città dov'ero prima c'era un comico esilarante. Si chiama Jock Erellon.\n@c2@"
  ja: "@a@b＊「以前　立ち寄った町に\n\tとても面白い芸人が　来てたんだ。\n\tパノンっていったかな。\n@c2@"
"63":
  de: "@a@b*: Der könnte Seine Majestät wahrscheinlich dazu bringen, dass er sich kugelt vor Lachen. Wo der wohl steckt?\n@c2@"
  en: "@a@b*: Iⓙd say heⓙd soon hae His Majesty fallinⓙ aboot the place wiⓙ laughter. I wonder where heⓙs got tae now.\n@c2@"
  es: "@a@b*: Yo creo que no tardaría ni un instante en hacer morir de la risa a Su Majestad. Me pregunto por dónde andará ahora.\n@c2@"
  fr: "@a@b*ⓢ Je suis sûr qu'il ferait éclater de rire Sa Majesté en trois secondes. Je me demande bien où il est en ce moment.\n@c2@"
  it: "@a@b*: Se potesse esibirsi davanti al sior Re Zonin, lo farebbe rotolare sul pavimento dalle risate! Chissà dove si trova adesso... \n@c2@"
  ja: "@a@b＊「パノンなら　きっと王さまを\n\t笑わせられるだろうに……。\n\t今　どこにいるんだろ？\n@c2@"
"64":
  de: "@a@b*: Man darf nicht zu freigiebig mit seinen Späßen sein, ehe man sie Seiner Majestät zu Gehör bringen kann.\n㈡\n*: Es wäre ja schade, wenn einem jemand zuvorkäme.\n@c1@"
  en: "@a@b*: Itⓙs important to keep oneⓙs material to oneself until performing it before His Majesty. It would be regrettable if someone were to steal it.\n@c1@"
  es: "@a@b*: Lo importante es mantener el material propio en secreto hasta interpretarlo ante Su Majestad. Sería una lástima que alguien lo robase.\n@c1@"
  fr: "@a@b*ⓢ Je fais bien attention de ne pas raconter mes blagues avant de me présenter devant Sa Majesté. Ce serait dommage que quelqu'un me les vole.\n@c1@"
  it: "@a@b*: Xe importante non svelare il proprio numero a nessuno, prima di esibirsi davanti al sior Re Zonin.\n㈡\n*: Sarebbe un peccato se qualcuno mi rubasse le battute, ciò!\n@c1@"
  ja: "@a@b＊「王さまの前で　発表するまで\n\tネタは秘密なのね。\n\t盗まれたら　たいへんだもん。\n@c1@"
"65":
  de: "@a@b*: Wie nennt man einen Laden für Kuh F?\n@c1@"
  en: "@a@b*: What do you call a cow that cannot give milk?\n@c1@"
  es: "@a@b*: ¿Qué le pasa a un frac si lo metes en el horno?\n@c1@"
  fr: "@a@b*ⓢ Qu'est-ce qui est vert et qui va sous l'eauⓡ\n@c1@"
  it: "@a@b*: Cosa fa un pasticcere su una torre?\n@c1@"
  ja: "@a@b＊「木と牛の間に　祈とう師がいる！\n@c1@"
"66":
  de: "@a@b*: Kuhfladen... Ach, ich hatte gehofft, seine Majestät damit zum Lachen zu bringen, aber wie es scheint, ist die Kuh nicht die Einzige, die Mist fabriziert.\n@c1@"
  en: "@a@b*: An udder failure...\nI was hopeful this would make His Majesty laugh, but it seems the failure is not the cow's alone.\n@c1@"
  es: "@a@b*: Que se frac-asa...\nEsperaba hacer reír a su Majestad pero este chiste sí que frac-asa.\n@c1@"
  fr: "@a@b*ⓢ Un chou-marin...\nJ'espérais faire rire Sa Majesté avec ma blague, mais je crois que c'est tombé à l'eau.\n@c1@"
  it: "@a@b*: Il... torrione! Quando il sior Re Zonin ga sentito la mia freddura, voleva lanciar me giù da una torre!\n@c1@"
  ja: "@a@b＊「これで王さま　笑いかけたんだよ。\n\tおしかったなー　次の考えよっと。\n@c1@"
"67":
  de: "@a@b*: Es gibt drei Arten von Leuten: die, die zählen können und die, die's nicht können.\n@c2@"
  en: "@a@b*: There are only three kinds of people:\nthose who can count and those who canⓙt.\n@c2@"
  es: "@a@b*: Hay tres tipos de personas:\nlos que saben contar y los que no.\n@c2@"
  fr: "@a@b*ⓢ Il y a trois types de personnesⓢ\nceux qui savent compter et ceux qui ne savent pas.\n@c2@"
  it: "@a@b*: Al mondo esistono tre categorie di persone: quelle che sanno contare e quelle che non sanno contare.\n@c2@"
  ja: "@a@b＊「かぶとを　かぶっとる！\n\tちょっと弱いかなあ。\n\tぶつぶつ……。\n@c2@"
"68":
  de: "@a@b*: Pah, nicht mal ein leises Kichern.\nNa, dann eben neues Spiel, neues Glück.\n@c2@"
  en: "@a@b*: Pah, not even a snigger.\nBack to the drawing board then...\n@c2@"
  es: "@a@b*: Bah, ni una mísera risilla.\nTendré que empezar de cero...\n@c2@"
  fr: "@a@b*ⓢ Pfff, même pas un sourire.\nBon, je vais revoir ma copie alors...\n@c2@"
  it: "@a@b*: Accipicchia, non ga nemmeno accennato a un sorriso! Bah, dovrò pensare a qualcosa di diverso.\n@c2@"
  ja: "@a@b＊「全然　笑ってもらえなかった。\n\tえーい　出直しだー！\n@c2@"
"69":
  de: "@a@b*: Würdet Ihr wohl beiseite treten?\nJetzt ist es an mir, den König zum Lachen zu bringen.\n@c1@"
  en: "@a@b*: Would you mind making way?\nMy time has come to try to make the King laugh.\n@c1@"
  es: "@a@b*: ¿Os importa abrir paso?\nHa llegado el momento de que haga reír al Rey.\n@c1@"
  fr: "@a@b*ⓢ Vous pouvez me laisser passerⓡ\nC'est à mon tour d'essayer de faire rire le roi.\n@c1@"
  it: "@a@b*: Fatemi passare! Adesso tocca a me cercare di far ridere il sior Re Zonin!\n@c1@"
  ja: "@a@b＊「ちょっと　じゃましないでよ！\n\t今　私の番なんだからっ。\n@c1@"
"70":
  de: "@a@b*: Könnte man ein berühmtes Monster wohl... MonStar nennen?!\n@c1@"
  en: "@a@b*: Would a famous monster be called...a monstar!?\n@c1@"
  es: "@a@b*: ¿Cuál es la única letra que se come? ¡La G latina!\n@c1@"
  fr: "@a@b*ⓢ Comment ça sent un pet de clownⓠⓑ\n㈡\n*ⓢ Ça sent drôleⓠ\n@c1@"
  it: "@a@b*: Perché i mostri si interessano d'arte? Perché amano andare a vedere... le mostre!\n@c1@"
  ja: "@a@b＊「魔物に　まあ　物を盗られたの！？\n@c1@"
"71":
  de: "@a@b*: Ach, schade! \nIch hatte wenigstens auf ein kleines Lächeln gehofft.\n@c1@"
  en: "@a@b*: How disappointing!\nI was sure that would bring at least a smile.\n@c1@"
  es: "@a@b*: ¡Qué decepción!\nEstaba segura de que con este conseguiría al menos una sonrisa.\n@c1@"
  fr: "@a@b*ⓢ J'étais pourtant sûre de lui tirer au moins un sourire avec celle-làⓠ\n@c1@"
  it: "@a@b*: Che delusione... Credevo che questa gli sarebbe piaciuta.\n@c1@"
  ja: "@a@b＊「キ～　くやしい！\n\tこれ　絶対うけると思ったのに！\n@c1@"
"72":
  de: "@a@b*: König Kicher wird den, der ihn zum Lachen bringt, reich belohnen. Ich wünsche Euch Glück.\n@c2@"
  en: "@a@b*: King Larfur will bestow a substantial reward on whosoever entices him to mirth. I wish you luck.\n@c2@"
  es: "@a@b*: El rey Jarturo otorgará una sustanciosa recompensa a aquel que sea capaz de provocarle una carcajada. %H860%XOs%YLes%Z deseo mucha suerte.\n@c2@"
  fr: "@a@b*ⓢ Le roi Larfour offrira une belle récompense à quiconque parviendra à le faire rire.\nJe vous souhaite bonne chance.\n@c2@"
  it: "@a@b*: Il sior Re Zonin ga promesso una grossa ricompensa a chiunque riesca a farlo ridere. %H860%XTi%YVi%Z auguro buona fortuna.\n@c2@"
  ja: "@a@b＊「王さまを　笑わせることができれば\n\tどんなほうびも　思いのまま！\n\tがんばりたまえ。\n@c2@"
"73":
  de: "@aKönig Kicher@bAlso wirklich!\n@c2@"
  en: "@aKing Larfur@bWell, really!\n@c2@"
  es: "@aRey Jarturo@b¡Pero habrase visto!\n@c2@"
  fr: "@aRoi Larfour@bQu'est-ce doncⓡ\n@c2@"
  it: "@aRe Zonin@bOh, ciò!\n@c2@"
  ja: "@a@b王「かーっ！\n@c2@"
"74":
  de: "@aKönig Kicher@bWir müssen doch sehr bitten, dass sich keiner vordrängelt!\n@c2@"
  en: "@aKing Larfur@bWe must ask that the queue is respected.\n@c2@"
  es: "@aRey Jarturo@bEs necesario respetar los turnos.\n@c2@"
  fr: "@aRoi Larfour@bNous tenons à ce que tout le monde attende son tour.\n@c2@"
  it: "@aRe Zonin@bChiediamo che venga rispettata la fila.\n@c2@"
  ja: "@a@b王「順番ぐらい守りなさい。\n@c2@"
"75":
  de: "@aKönig Kicher@bWillkommen! Ihr seid %a00140, sagt Ihr?\nSehr schön, %a00140.\nIhr werdet über Unseren Aufruf unterrichtet sein?\n@c2@"
  en: "@aKing Larfur@bWelcome! Your name is %a00140, you say?\nVery well, %a00140.\nWe trust that you know of Our appeal?\n@c2@"
  es: "@aRey Jarturo@b¡Os doy la bienvenida! ¿Vuestro nombre es %a00140, decís?\nMuy bien, %a00140.\n㈡\nHabéis tenido noticia de nuestro llamamiento, ¿no es así?\n@c2@"
  fr: "@aRoi Larfour@bBienvenueⓠ Vous vous appelez %a00140, c'est celaⓡ Eh bien, %a00140, vous avez donc pris connaissance de Notre appelⓡ\n@c2@"
  it: "@aRe Zonin@bTi diamo il benvenuto. Il tuo nome è %a00140, non è così?\n㈡\nMolto bene, %a00140, immaginiamo che tu sappia dell'appello che gavemo lanciato.\n@c2@"
  ja: "@a@b王「よくぞ来た！\n\tほほう　%a00140と申すのか。\n\tわしのおふれは知っておろう。\n@c2@"
"76":
  de: "@aKönig Kicher@bWohlan denn... macht Uns lachen!\n@c2@"
  en: "@aKing Larfur@bNow...make Us laugh!\n@c2@"
  es: "@aRey Jarturo@bMuy bien, pues... ¡Hacednos reír!\n@c2@"
  fr: "@aRoi Larfour@bAlors... faites-Nous rireⓠ\n@c2@"
  it: "@aRe Zonin@bE adesso... Facci ridere!\n@c2@"
