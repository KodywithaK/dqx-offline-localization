"77":
  de: "@aKönig Kicher@b... Wir möchten doch sehr darum bitten, nicht Unsere kostbare Zeit zu verschwenden!\n@c2@"
  en: "@aKing Larfur@b...We would ask that you do not waste Our precious time.\n@c2@"
  es: "@aRey Jarturo@b... Os ruego que no nos hagáis perder nuestro precioso tiempo.\n@c2@"
  fr: "@aRoi Larfour@b... Nous vous demandons de ne pas Nous faire perdre un temps précieux.\n@c2@"
  it: "@aRe Zonin@bMa, per favore, non farci perdere tempo.\n@c2@"
  ja: "@a@b王「どうした　早くせぬか。\n@c2@"
"78":
  de: "@a@b%0%a00140 erzählt den ersten Witz, der %A120%Xihm%Z%B120%Xihr%Z einfällt.\n@c2@"
  en: "@a@b%0%a00140 says the first joke that comes to mind.\n@c2@"
  es: "@a@b%0%a00140 cuenta el primer chiste que le viene a la cabeza.\n@c2@"
  fr: "@a@b%0%a00140 dit la première blague qui lui vient à l'esprit.\n@c2@"
  it: "@a@b%0%a00140 racconta la prima storiella che gli passa per la mente.\n@c2@"
