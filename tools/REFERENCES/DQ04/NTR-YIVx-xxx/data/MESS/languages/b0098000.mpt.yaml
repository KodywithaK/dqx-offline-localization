  fr: "@a@bLe roi Larfour n'a pas l'air de trouver ça drôle.\n@c2@"
  it: "@a@bRe Zonin, purtroppo, sembra non gradirla affatto.\n@c2@"
  ja: "@a@bしかし　王さまには　うけなかった。\n@c2@"
"80":
