"0":
  de: "@a@bHier ist ein Knopf. Drücken?\n@c0@"
  en: "@a@bThere's a button here.\nPress it?\n@c0@"
  es: "@a@bHay un botón.\n¿Quieres pulsarlo?\n@c0@"
  fr: "@a@bVous voyez un bouton.\nVoulez-vous appuyer dessusⓡ\n@c0@"
  it: "@a@bQui c'è un interruttore.\nVuoi premerlo?\n@c0@"
  ja: "@a@bボタンがあります　おしてみますか？\n@c0@"
"1":
  de: "@a@b*: Was zum Teufel ist mit dieser Höhle los? Ich werd noch verrückt hier. Ich kann mir noch nicht mal den Schatz schnappen.\n@c3@"
  en: "@a@b*: Now just what the devil is up with this cave?\n'Tis makin' a right amadan out o' me.\nI can't make away with the treasure.\n@c3@"
  es: "@a@b*: ¿Qué diablos sucede en esta cueva?\nMe está volviendo loco.\nNo puedo salir con el tesoro.\n@c3@"
  fr: "@a@b*ⓢ Qu'est-ce qui se passe exactement dans cette grotteⓡ Je crois que je vais devenir dingue.\nJ'arrive pas à mettre la main sur ce trésor.\n@c3@"
  it: "@a@b*: Ma che diavolo succede 'nquesta grotta? Bella figura da 'bbischero che sto facendo... 'Un riesco a porta' via i'ttesoro!\n@c3@"
  ja: "@a@b＊「まったく　この洞くつは\n\tどうなってんだっ！？\n\t宝箱が　取れねえじゃないか！\n@c3@"
"2":
  de: "@a@b*: Ich hab grad 'ne Tonne Wasser auf den Kopf bekommen. Bin fast ertrunken dabei!\n@c3@"
  en: "@a@b*: A ton o' water was after pourin' in on me head just now. I nearly drowned, so I did!\n@c3@"
  es: "@a@b*: Una tonelada de agua ha caído sobre mi cabeza. ¡Casi me ahogo!\n@c3@"
  fr: "@a@b*ⓢ Des tonnes d'eau me sont tombées sur la tête.\nJ'ai failli me noyerⓠ\n@c3@"
  it: "@a@b*: E c'è mancato poho ch'annegassi sotto una tonnellata d'acqua, maremma bagnina!\n@c3@"
  ja: "@a@b＊「さっきよう\n\t上から　水が　あふれてきて\n\tあやうく　おぼれるところだったぜ！\n@c3@"
"3":
  de: "@a@b*: Aber etwas Gutes hat die Sache doch noch. Wenigstens komm ich jetzt an den Schatz ran. He he! Und dann hau ich ab!\n@c3@"
  en: "@a@b*: But there's a silver linin', like.\nNow at least I can get at me treasure.\nHe he! I'll be makin' tracks, then.\n@c3@"
  es: "@a@b*: Pero no hay mal que por bien no venga.\nAhora por lo menos puedo llegar hasta el tesoro.\n¡Je, je! Luego me largaré.\n@c3@"
  fr: "@a@b*ⓢ Au moins, à quelque chose malheur est bon.\nJe peux arriver au trésor. Hé héⓠ\nEt après, je mets les voilesⓠ\n@c3@"
  it: "@a@b*: Ma non tutto i'mmale viene pe' nuoce'... Finalmente posso prende' i'ttesoro! Eh! Eh! Eh! Ora sì che va bene!\n@c3@"
  ja: "@a@b＊「まっ　おかげで　宝箱を\n\t取れるってワケだがな。\n\tへへ　お先にな！\n@c3@"
"4":
  de: "@a@b*: Nur... wie komm ich eigentlich hier raus?\n@c3@"
  en: "@a@b*: Only...how am I s'posed to be gettin' out o' here now?\n@c3@"
  es: "@a@b*: Claro, pero ¿cómo voy a salir ahora de aquí?\n@c3@"
  fr: "@a@b*ⓢ Seulement... comment je vais faire pour sortir d'ici maintenantⓡ\n@c3@"
  it: "@a@b*: Sì, però... Come accidenti fò a usci' da huì, ora?\n@c3@"
  ja: "@a@b＊「……でも　オレってば\n\tどうやって　帰りゃいいんだ？\n@c3@"
"5":
  de: "@a@b*: Hallo. Auf Arbeitssuche? Tut mir leid, aber ich kann zurzeit niemanden einstellen.\n@c2@"
  en: "@a@b*: Hello. Are you hoping to find work here?\nI'm afraid I really don't need anyone else.\n@c2@"
  es: "@a@b*: Hola. ¿Andas buscando trabajo?\nMe temo que no necesito a nadie más.\n@c2@"
  fr: "@a@b*ⓢ Bonjour. Vous cherchez du travailⓡ\nMalheureusement, je n'ai besoin de personne en ce moment.\n@c2@"
  it: "@a@b*: Salve! %H860%XStai%YState%Z cercando lavoro qui? Spiacente, ma al momento non ho bisogno di aiuto.\n@c2@"
  ja: "@a@b＊「おや？　ここで　はたらきたいのですか？\n\tでも　この通り　私ひとりで\n\t人手は　足りていますよ。\n@c2@"
"6":
  de: "@a@b*: Weitab von hier, in einem der entlegensten Winkel dieser Welt, liegt eine Klinge namens Zenithiaschwert in friedlichem Schlaf.\n@c1@"
  en: "@a@b*: A long way away, somewhere in the very furthest corners of the world, a sword known as the Zenithian Sword lies in quiet repose.\n@c1@"
  es: "@a@b*: En un lugar muy lejano, en lo más recóndito del mundo, yace impertérrita una espada que recibe el nombre de Espada de Zenithia.\n@c1@"
  fr: "@a@b*ⓢ Très très loin d'ici, quelque part dans l'une des régions les plus reculées du monde, se trouve une épée connue sous le nom d'Épée zénithienne. \n@c1@"
  it: "@a@b*: La Spada Zenithiana si trova da molto tempo in un luogo remoto, lontano da tutto e da tutti.\n@c1@"
  ja: "@a@b＊「はるか　世界の果てに\n\t天空のつるぎというものが\n\t眠っているそうです。\n@c1@"
"7":
  de: "@a@b*: Sollte es in die falschen Hände geraten ⓚⓛ in die Hände einer bösen Macht ⓚⓛ dann würde die Welt, so wie wir sie kennen, vernichtet werden.\n@c1@"
  en: "@a@b*: If it were to find itself in the wrong hands ⓚⓛ in the hands of a force of evil ⓚⓛ the world as we know it would be destroyed.\n@c1@"
  es: "@a@b*: Si cayera en las manos equivocadas, en manos de las fuerzas del mal, el mundo, tal y como lo conocemos, perecería.\n@c1@"
  fr: "@a@b*ⓢ Si elle tombait entre de mauvaises mains... dans les mains d'une créature maléfique... le monde tel que nous le connaissons courrait à sa perte.\n@c1@"
  it: "@a@b*: Se, per disgrazia, una creatura malvagia se ne impadronisse, il mondo andrebbe incontro alla distruzione.\n@c1@"
  ja: "@a@b＊「もし　悪しき心の者が\n\tそのつるぎを　手に入れたら\n\t世界は　滅んでしまうでしょう。\n@c1@"
"8":
  de: "@a@b*: Du musst dieses Schwert finden und es in die Hände der Gerechten legen! Ich werde bei der Göttin für deinen Erfolg beten.\n@c1@"
  en: "@a@b*: You must find this sword, and guide the hand of the righteous to its hilt!\nI will pray to the Goddess that you succeed.\n@c1@"
  es: "@a@b*: ¡Debes encontrar esta espada, y guiar la mano de los justos hasta su empuñadura!\nImploraré a la Diosa que resultes victorioso.\n@c1@"
  fr: "@a@b*ⓢ Vous devez trouver cette épée et la placer dans les mains de quelqu'un de vertueuxⓠ\nJe prierai la Déesse pour que vous y parveniez.\n@c1@"
  it: "@a@b*: %H860%XDevi%YDovete%Z assolutamente ritrovare quella spada, e porre sulla sua elsa la mano di una persona giusta! Pregherò perché la dea %H860%Xti%Yvi%Z protegga.\n@c1@"
  ja: "@a@b＊「どうか　そのつるぎを　見つけだし\n\t心正しき者の手に！\n\tこの世界を　お救いなされまし！\n@c1@"
