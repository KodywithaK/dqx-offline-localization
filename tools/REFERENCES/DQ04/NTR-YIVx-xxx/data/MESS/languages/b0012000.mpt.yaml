  es: "@a@b*: ¡Qué tema más chungo! La puerta está chapada, o sea que no hay forma de que pueda subir arriba.\n@c2@"
  fr: "@a@b*ⓢ Quelle plaieⓠ La porte est verrouillée... autrement dit, j'ai aucune chance de grimper jusque là-haut.\n@c2@"
  it: "@a@b*: Maledizione! Questa dannata porta è chiusa a chiave... Non riuscirò mai ad arrivare fino in cima!\n@c2@"
  ja: "@a@b＊「くそー！\n\t扉に　カギがかかってて\n\t上には　登れねーや。\n@c2@"
"1":
  de: "@a@b*: Da kommt man schon von so weit her, um die berühmten Elfen zu sehen... Na, das kann ich wohl knicken.\n@c2@"
  en: "@a@b*: I come all this way to see them elves people go on about, but it looks like it was for nuffin'.\n@c2@"
  es: "@a@b*: Hago todo este camino para ver a los elfos esos, y ahora va y resulta que es para nada.\n@c2@"
  fr: "@a@b*ⓢ J'ai fait tout ce chemin pour apercevoir des elfes, mais on dirait que c'était pour rien.\n@c2@"
  it: "@a@b*: Ho fatto tutta 'sta strada per vedere gli elfi, ma mi sa che è solo fatica sprecata!\n@c2@"
  ja: "@a@b＊「たしか　エルフが舞い降りるのは\n\tこの塔だと　聞いてきたのに……。\n@c2@"
"2":
