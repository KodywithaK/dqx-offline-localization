"0":
  de: "@a@b*: Habt Ihr schon von dieser kosmopolitischen Stadt gehört, in der man Leute aus der ganzen Welt antreffen kann?\n@c2@"
  en: "@a@b*: Have you heard about that cosmopolitan town full of people from all different parts of the world?\n@c2@"
  es: "@a@b*: ¿%H860%XHas%YHabéis%Z oído hablar de esa ciudad tan cosmopolita, con gente de todas las partes del mundo?\n@c2@"
  fr: "@a@b*ⓢ Avez-vous entendu parler de cette ville cosmopolite où vivent des gens qui viennent des quatre coins du mondeⓡ\n@c2@"
  it: "@a@b*: Ho sentito dire che è stato fondato un nuovo villaggio in cui vivono persone provenienti da ogni parte del mondo.\n@c2@"
  ja: "@a@b＊「なんでも　どこかに\n\tいろいろな世界の　人びとが\n\t集まる　町が　あるそうです。\n@c2@"
"1":
  de: "@a@b*: An solch einem Ort müsste es doch wohl ein paar seltene und äußerst begehrte Objekte geben, hm?\n@c2@"
  en: "@a@b*: I bet you could find some rare and sought-after items in a place like that, eh?\n@c2@"
  es: "@a@b*: Seguro que en un lugar así se pueden encontrar objetos raros y muy buscados, ¿eh?\n@c2@"
  fr: "@a@b*ⓢ Je parie que vous pourriez y trouver des objets rares et très convoités, vous ne croyez pasⓡ\n@c2@"
  it: "@a@b*: Scommetto che in un posto del genere è possibile trovare molti oggetti rari e ricercati...\n@c2@"
  ja: "@a@b＊「きっと　そこには\n\tめずらしい　品物も\n\tあるんでしょうなあ。\n@c2@"
"2":
  de: "@a@b*: Hallo, hallo! Was für eine Überraschung, hier draußen Leute zu sehen.\n@c2@"
  en: "@a@b*: Ho ho ho! I'm surprised to see folk all the way out here.\n@c2@"
  es: "@a@b*: ¡Jo, jo, jo! Qué sorpresa ver gente por estos lares.\n@c2@"
  fr: "@a@b*ⓢ Ho ho hoⓠ Je suis surpris de voir du monde par ici.\n@c2@"
  it: "@a@b*: Oh! Oh! Oh! Mi sorprende vedere qualcuno da queste parti!\n@c2@"
  ja: "@a@b＊「ほっほっほっ！\n\tこんな所まで来る者が　まだ\n\tおったとはな……。\n@c2@"
"3":
  de: "@a@b*: Darf ich Euch einen kleinen Tipp geben? Werft doch mal einen Blick da runter in den Brunnen.\n@c2@"
  en: "@a@b*: How's about I give you a piece of advice? Have yourself a look at the bottom of the well.\n@c2@"
  es: "@a@b*: ¿%H860%XQuieres que te%YQueréis que os%Z dé un consejo? %H860%XEcha%YEchad%Z una ojeada en el fondo del pozo.\n@c2@"
  fr: "@a@b*ⓢ Que diriez-vous d'un petit conseilⓡ\nJetez un œil au fond du puits.\n@c2@"
  it: "@a@b*: %H860%XAscolta%YAscoltate%Z il mio consiglio: %H860%Xprova%Yprovate%Z a guardare in fondo al pozzo.\n@c2@"
  ja: "@a@b＊「わしからの心づけじゃ。\n\tこの井戸の底を　調べなされ。\n@c2@"
"4":
  de: "@a@b*: Oh! Da wart Ihr wohl schneller als ich! Ihr müsst schon clever sein, um so weit zu kommen. Ich wünsch Euch noch viel Glück!\n@c2@"
  en: "@a@b*: Oh! You beat me to it! I suppose you must have some nous about you to get this far. Good luck from here on in!\n@c2@"
  es: "@a@b*: ¡Ah! ¡Me %H860%Xhas%Yhabéis%Z pillado! Supongo que si %H860%Xhas%Yhabéis%Z llegado tan lejos quiere decir que no %H860%Xte%Yos%Z falta sentido común. ¡Buena suerte a partir de ahora!\n@c2@"
  fr: "@a@b*ⓢ Vous me coupez l'herbe sous le piedⓠ Je suppose que vous devez avoir un peu de jugeotte pour avoir pu arriver jusqu'ici. Bonne chance pour la suiteⓠ\n@c2@"
  it: "@a@b*: Oh! %H860%XDevi%YDovete%Z avere un'intelligenza molto fervida per aver raggiunto questo punto! %H860%XTi%YVi%Z auguro buona fortuna per il prosieguo dell'avventura!\n@c2@"
  ja: "@a@b＊「ほう！　もう　とっていなさったか？\n\tやはり　ここまで来る者はちがうのう。\n\t先は長い。　気をつけていきなされよ。\n@c2@"
