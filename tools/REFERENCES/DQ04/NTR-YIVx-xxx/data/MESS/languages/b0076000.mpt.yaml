  ja: "@a@b＊「もし　まだなら　この宿屋が\n\t親切で安くて　おすすめだよ！\n\tそれじゃ　オレはここで失礼。\n@c3@"
"60":
  de: "@a@b*: Na schön. Wie Ihr wollt. Übrigens, die andere Herberge verlangt ganz schön happige Preise. An Eurer Stelle würd ich's mir noch mal überlegen.\n@c2@"
  en: "@a@b*: Awright, then. Suit %H860%Xyerself%Yyerselves%Z.\nBy the way, this other inn's a right rip-off. I wouldn't touch it wiv a bargepole if I was you.\n@c2@"
  es: "@a@b*: Pues muⓘ bien. Como %H860%Xte%Yos%Z parezca.\nPor cierto, en esa otra posaⓘ te clavan. Yo en %H860%Xtu%Yvuestro%Z lugar no me acercaría ni a un kilómetro.\n@c2@"
  fr: "@a@b*ⓢ Très bien. Comme vous voulez. À propos, l'autre auberge est une vraie arnaque. J'y toucherais même pas avec des pincettes, si j'étais vous.\n@c2@"
  it: "@a@b*: Va bene, va bene... %H860%XCome preferisci%YCome preferite%Z.\nPerò %H860%Xsappi%Ysappiate%Z una cosa: l'altra locanda è un porcile. Io non ci entrerei neanche se mi pagassero!\n@c2@"
  ja: "@a@b＊「そいつは残念！\n\tところで　この宿屋は良くないから\n\tやめておいたほうがいいよ。\n@c2@"
