"56":
  de: "@a@b*: Soll besondere Kräfte oder so was haben.\n@c3@"
  en: "@a@b*: 'Parrently it's got some amazin' powers or somefin' like that.\n@c3@"
  es: "@a@b*: Dicen que tieⓘ poderes estrⓘordinarios o algo asín.\n@c3@"
