"0":
  de: "@a@b*: Willkommen in Bad Jungbrunn, der Stadt der Bäder! Hier können müde Wanderer nach einer strapaziösen Reise eine kleine Rast einlegen. \n@c2@"
  en: "@a@b*: Welcome to Bath, town o' baths!\nThe perfect place for %H860%Xa trav'ller to rest %A120%X'is%Z%B120%X'er%Z%Ytrav'llers to rest their%Z achy bones after a long time on the road.\n@c2@"
  es: "@a@b*: ¡%H860%X%A120%XBienvenido%Z%B120%XBienvenida%Z%Y%R000%XBienvenidas%YBienvenidos%Z%Z a Baños del Secano, ciudáⓘ de baños!\nEr sitio perfeto paⓘ que %H860%Xun viajero deje descansar%Ylos viajeros dejen descansar%Z sus güesos despuéⓘ dⓘun largo viaje.\n@c2@"
  fr: "@a@b*ⓢ Bienvenue à Bourg-les-Bains, la ville thermaleⓠ\n㈡\n*ⓢ L'endroit idéal pour %H860%X%A120%Xun voyageur désireux%Z%B120%Xune voyageuse désireuse%Z%Y%R000%Xdes voyageuses désireuses%Ydes voyageurs désireux%Z%Z de reposer %H860%Xses%Yleurs%Z os douloureux après de longues heures de route.\n@c2@"
  it: "@a@b*: %H860%X%A120%XBenvenuto%Z%B120%XBenvenuta%Z%Y%R000%XBenvenute%YBenvenuti%Z%Z nella città termale di Bonacqua! Questo è il luogo ideale per riposarsi dalle fatiche di un lungo viaggio.\n@c2@"
  ja: "@a@b＊「温泉町　アネイルにようこそ！\n\t長旅で疲れた体を\n\t温泉で　休めていってください。\n@c2@"
"1":
  de: "@a@b*: Habt Ihr schon die Rüstung in der Kirche gesehen? Die ist fabelhaft!\n@c1@"
  en: "@a@b*: Have you seen the armour in the church already? It's amazin'!\n@c1@"
  es: "@a@b*: ¿%H860%XHas%YHabéis%Z visto ya la armadura quⓘhay en la iglesia? ¡Es digna ⓘe verse!\n@c1@"
  fr: "@a@b*ⓢ Vous avez déjà vu l'armure dans l'égliseⓡ\nElle est incroyableⓠ\n@c1@"
  it: "@a@b*: %H860%XHai%YAvete%Z già visto l'armatura esposta in chiesa? È una vera meraviglia!\n@c1@"
  ja: "@a@b＊「教会においてある　よろい\n\tもう　見た？\n\tすごいよね　あれ！\n@c1@"
"2":
  de: "@a@b*: Oh stolzer Siegfried, voller Würd' und Pracht, Ⓠ\nDein Panzer gülden schimmert in der Schlacht, Ⓠ\nDoch viel zu früh hat man dich plattgemacht. Ⓠ\n@c2@"
  en: "@a@b*: Oh Bladud, brave knight of olde Ⓠ\nClad in armour what gleamed like gold Ⓡ\nIn battle, you was knocked out cold Ⓠ\n@c2@"
  es: "@a@b*: Oh, Bartolo, valeroso caballero, Ⓠ\nDⓘarmadura brillante como sol de enero, Ⓡ\nEn la batalla, te dejaron tieso. Ⓠ\n@c2@"
  fr: "@a@b*ⓢ Ô Godefroy, courageux et fort chevalier, Ⓠ\nta belle armure, au soleil, comme de l'or luisait Ⓡ\nmais au combat, malgré elle, tu fus massacré. Ⓠ\n@c2@"
  it: "@a@b*: Fortebraccio, cavaliere di un'epoca passata,\nla tua armatura scintillava dorata,\nma in battaglia la tua vita fu spezzata!\n@c2@"
  ja: "@a@b＊「おお　戦士リバスト～\n\tかがやくよろいを　まとう者～\n\t魔物と戦い　戦死リバスト～♪\n@c2@"
"3":
  de: "@a@b*: ... Nein, das taugt auch noch nicht. Ich will ein Lied über Siegfried schreiben, aber irgendwie klappt es nicht so recht.\n@c2@"
  en: "@a@b*: ...No, 'e's no good, neither.\nI been tryin' to make up a song about Bladud, but 'e's not goin' all that well.\n@c2@"
  es: "@a@b*: ... No, esta tampoco me parece muⓘ allá.\nEstoy probando de componer una balada sobre Bartolo, pero no me está saliendo muⓘ bien.\n@c2@"
  fr: "@a@b*ⓢ ... Non, ça ne va pas non plus.\nJ'essaie de composer une chanson sur Godefroy, mais j'ai bien du mal.\n@c2@"
  it: "@a@b*: No, non ci siamo ancora.\nSto provando a scrivere una canzone su Fortebraccio, ma non sono molto ispirato.\n@c2@"
  ja: "@a@b＊「……むう。　戦士リバストを\n\tたたえる歌を　作りたいのですが\n\tどうも　うまくいきません。\n@c2@"
"4":
  de: "@a@b*: Hmm. Ich habe extra eine Führung gebucht, um Siegfrieds Rüstung zu sehen, aber die sieht eigentlich nach gar nichts aus.\n@c2@"
  en: "@a@b*: Hmm... I took the guided tour to see the famous Bladud's armour, but it didn't look like anything special to me.\n@c2@"
  es: "@a@b*: Mmm... Hice una visita guiada paⓘ ver la famosa armadura de Bartolo, pero no me pareció que fuera muⓘ especial.\n@c2@"
  fr: "@a@b*ⓢ Mmm... J'ai fait la visite guidée pour voir la célèbre armure de Godefroy, mais elle ne m'a pas paru si spéciale que ça.\n@c2@"
  it: "@a@b*: Uhm... Ho fatto la visita guidata per vedere la famosa armatura di Fortebraccio, ma non mi è sembrata nulla di speciale.\n@c2@"
  ja: "@a@b＊「ふーむ。　案内してもらって\n\tリバストのよろいを見せてもらったが\n\tどうも　普通のよろいのようだ。\n@c2@"
"5":
  de: "@a@b*: Fast wie eine billige Kopie. Würd mich nicht wundern, wenn jemand die echte Rüstung geklaut und gegen diesen Blechhaufen getauscht hätte.\n@c2@"
  en: "@a@b*: In fact, it just looked like some cheap substitute.\n㈡\n\n*: I wouldn't be surprised if someone had stolen the real armour and put that rubbish in its place!\n@c2@"
  es: "@a@b*: La verdáⓘ es que más bien parecía una copia barata.\n㈡\n*: ¡No me extrañaría quⓘalguien hubiese robao la armadura original y la hubiese cambiaⓘo por ese trasto!\n@c2@"
  fr: "@a@b*ⓢ En réalité, on aurait dit une mauvaise copie.\n㈡\n*ⓢ Ça ne m'étonnerait pas que quelqu'un ait volé la véritable armure et mis cette saleté à sa placeⓠ\n@c2@"
  it: "@a@b*: A dirla tutta, sembrava taroccata.\n㈡\n*: Non mi sorprenderebbe scoprire che la vera armatura è stata rubata, e che quella esposta non è altro che un'imitazione!\n@c2@"
  ja: "@a@b＊「いつの間にか　すりかえられて\n\tしまったのだろうか……。\n@c2@"
"6":
  de: "@a@b*: Aah, ich fühle mich gleich zehn Jahre jünger! Mein Sohn hat mich hierher gebracht.\n@c2@"
  en: "@a@b*: Ah, I feel ten years younger!\nIt was my son that brought me here.\n@c2@"
  es: "@a@b*: ¡Ah, me siento diez años más joven!\nHe venido aquí con mi hijo.\n@c2@"
  fr: "@a@b*ⓢ Ah, j'ai l'impression d'avoir rajeuni de dix ansⓠ\nC'est mon fils qui m'a amené ici.\n@c2@"
  it: "@a@b*: Ah, mi sento di dieci anni più giovane!\nÈ stato mio figlio a portarmi qui.\n@c2@"
  ja: "@a@b＊「ああ　生き返るようですじゃ。\n\tこの温泉には　息子が\n\t連れてきてくれてのう……。\n@c2@"
"7":
  de: "@a@b*: Mein Sohn ist ein guter Junge, der sich um seinen alten Vater kümmert.\n@c2@"
  en: "@a@b*: I'm a lucky fellow to have such a caring lad to look after me.\n@c2@"
  es: "@a@b*: Tengo suerte de tener un muchacho atento que se cuida de mí.\n@c2@"
  fr: "@a@b*ⓢ J'ai bien de la chance d'avoir un fiston si prévenant pour prendre soin de moi.\n@c2@"
  it: "@a@b*: Sono davvero fortunato ad avere un figlio così affettuoso...\n@c2@"
  ja: "@a@b＊「親孝行な　息子を持って\n\tわしは　幸せもんじゃ。\n@c2@"
"8":
  de: "@a@b*: Wenn Ihr immer weiter nach Süden reist, kommt Ihr zu einer Stadt namens Guckshaven.\n@c1@"
  en: "@a@b*: Travel far enough south from 'ere, an' you come to a shippin' town called Porthtrunnel.\n@c1@"
  es: "@a@b*: Un buen trecho hacia el sur desde aquí hay una ciudáⓘ marinera, Puertoumbrío.\n@c1@"
  fr: "@a@b*ⓢ Si vous voyagez assez longtemps en direction du sud en partant d'ici, vous arriverez dans une ville appelée Port-Carène.\n@c1@"
  it: "@a@b*: Andando verso sud, si arriva al villaggio di Cala Cantiera.\n@c1@"
  ja: "@a@b＊「ここから　ずっと南に行けば\n\t港町　コナンベリーがあるわ。\n@c1@"
"9":
  de: "@a@b*: Da legen die Schiffe zu diesen fremden Orten ab, mit denen Ihr Reisenden es ja dauernd habt.\n@c1@"
  en: "@a@b*: That's where the ships leave from to go to them foreign places you trav'llers are always gallivantin' off to.\n@c1@"
  es: "@a@b*: Dⓘahí salen los barcos que van al extranjero ese donde vais siempre los viajeros.\n@c1@"
  fr: "@a@b*ⓢ C'est de là que partent les navires qui se rendent dans des pays étrangers, où vous autres voyageurs allez toujours vous balader.\n@c1@"
  it: "@a@b*: È da lì che partono le navi per quei posti lontani che piacciono tanto ai viaggiatori come %H860%Xte%Yvoi%Z.\n@c1@"
  ja: "@a@b＊「よその大陸に　行くつもりなら\n\tあそこから　船にのることね。\n@c1@"
"10":
  de: "@a@b%0%a00120 untersucht den Grabstein.\n@c0@"
  en: "@a@b%0%a00120 examines the gravestone.\n@c0@"
  es: "@a@b%0%a00120 examina la lápida.\n@c0@"
  fr: "@a@b%0%a00120 examine la tombe.\n@c0@"
  it: "@a@b%0%a00120 esamina la lapide.\n@c0@"
  ja: "@a@b%a00120は　墓石を　調べた。\n@c0@"
"11":
  de: "@a@bⓞDu stehst hier, doch Siegfried ist tot.\nEr rettete Jungbrunn aus großer Not.ⓟ\n@c0@"
  en: "@a@bⓗHere lies Sir Bladud.\nBrave warrior and saviour of Bath.ⓘ\n@c0@"
  es: "@a@b''Aquí yace Sir Bartolo.\nValeroso guerrero y salvador de Baños del Secano.''\n@c0@"
  fr: "@a@bⓥCi-gît Messire Godefroy, guerrier courageux et sauveur de Bourg-les-Bains.ⓦ\n@c0@"
  it: "@a@bⓕQui giace Fortebraccio,\nprode guerriero e salvatore di Bonacqua.ⓖ\n@c0@"
  ja: "@a@b戦士リバストの墓と　きざまれている。\n@c0@"
"12":
  de: "@a@b*: Ihr müsst ja sehr durstig sein, dass ihr am helllichten Nachmittag in die Schänke kommt!\n@c2@"
  en: "@a@b*: Must 'ave quite a thirst comin' into the pub at this time in the aft'noon, eh?\n@c2@"
  es: "@a@b*: %H860%XDebes%YDebéis%Z de tener mucha sed paⓘ venir a la taberna a estas horas de la tarde, ¿eh?\n@c2@"
  fr: "@a@b*ⓢ Vous devez avoir sacrément soif pour venir au bar à cette heure de l'après-midi, heinⓡ\n@c2@"
  it: "@a@b*: %H860%XDevi%YDovete%Z avere proprio una gran sete per venire nel locale a quest'ora del pomeriggio!\n@c2@"
  ja: "@a@b＊「こんなまっ昼間から\n\t酒場に　来るなんて\n\tお客さんも　お好きですねえ。\n@c2@"
"13":
  de: "@a@b*: Ich bin mit meinem Vater hier. Damit er nicht immer denkt, ich würde nie was für ihn tun.\n@c2@"
  en: "@a@b*: I came here with my dad. Thought I'd better show him I don't ignore him all the time!\n@c2@"
  es: "@a@b*: He venido aquí con mi padre. He pensado que sería bueno demostrarle que no siempre le ignoro.\n@c2@"
  fr: "@a@b*ⓢ Je suis venu ici avec mon père.\nJe me suis dit que je ferais bien de lui montrer que je pense à lui de temps en tempsⓠ\n@c2@"
  it: "@a@b*: Sono venuto qui con mio padre. Volevo fargli capire che ci tengo a lui!\n@c2@"
  ja: "@a@b＊「たまには　親孝行でもするべって\n\t親父さまと　ふたりで\n\tこの町に来ただよ。\n@c2@"
"14":
  de: "@a@b*: Die Wasser von Bad Jungbrunn sollen die Haut reinigen und strahlen lassen.\n@c1@"
  en: "@a@b*: They say the bath waters here make your skin clean and beautiful.\n@c1@"
  es: "@a@b*: Dicen que las aguas de Baños del Secano te dejan la piel limpia y bonita.\n@c1@"
  fr: "@a@b*ⓢ Il paraît qu'ici, les eaux thermales purifient et embellissent la peau.\n@c1@"
  it: "@a@b*: Dicono che le acque termali puliscano a fondo la pelle e la rendano più bella.\n@c1@"
  ja: "@a@b＊「ここの温泉に入ると\n\tお肌が　きれいになるそうね。\n@c1@"
"15":
  de: "@a@b*: Aber... Noch reiner und strahlender geht ja fast gar nicht. Ach, Frauen haben's nicht leicht!\n@c1@"
  en: "@a@b*: But...I really don't think I could get any cleaner, or more beautiful! Oh dear, what's a poor girl to do?\n@c1@"
  es: "@a@b*: ¡Pero... No creo que yo pueda estar más limpia o bonita! ¡Ay, Diosa! Lo que tiene que hacer una.\n@c1@"
  fr: "@a@b*ⓢ Mais... je ne crois pas que la mienne pourrait être plus pure ou plus belleⓠ\n㈡\n*ⓢ Oh, ce qu'il ne faut pas faire quand on est une filleⓠ\n@c1@"
  it: "@a@b*: Ma... Personalmente, non posso essere più bella e pulita di quanto non sia già! Del resto, come si dice? Chi bella vuole apparire, molto deve soffrire!\n@c1@"
  ja: "@a@b＊「でも　これ以上\n\tきれいになったら　どうしましょ？\n\tわたし　困っちゃうな。\n@c1@"
"16":
  de: "@a@b*: Hier könnt Ihr nicht rein, %H860%X%A120%XJung%Z%B120%XDeern%Z%YLeute%Z. Wenn Ihr einkaufen wollt, müsst Ihr andersrum reinkommen.\n@c2@"
  en: "@a@b*: You can't come inside 'ere, %A120%Xbay%Z%B120%Xmaid%Z. If it's shoppin' you want, come 'round t'other way.\n@c2@"
  es: "@a@b*: No se pueⓘ entrar aquí, %H860%X%A120%Xzagal%Z%B120%Xmoza%Z%Y%R000%Xmozas%Ymozos%Z%Z. Si %H860%Xquieres%Yqueréis%Z comprar, %H860%Xven%Yvenid%Z por el otro laⓘo.\n@c2@"
  fr: "@a@b*ⓢ Vous ne pouvez pas entrer ici, %A120%XMonseigneur%Z%B120%XMademoiselle%Z.\nSi vous voulez faire des achats, passez de l'autre côté.\n@c2@"
  it: "@a@b*: Non puoi entrare da qui, %A120%Xgiovanotto%Z%B120%Xsignorina%Z. Se vuoi fare acquisti, passa dall'altro lato.\n@c2@"
  ja: "@a@b＊「ダメですよ　入ってきちゃ。\n\t買い物したいなら\n\t外から　話しかけてください。\n@c2@"
"17":
  de: "@a@b*: Aaah... Nicht viele verirren sich in meinen Laden, um Waffen zu kaufen. Na ja, ist nun mal ein Kurort hier. Ich hab mehr freie Zeit als ⓚⓛ\n@c2@"
  en: "@a@b*: Aaaah... There's not many folk 'ere who be wantin' to buy weapons. Not in a spa town like this. I've got more free time than aⓚⓛ\n@c2@"
  es: "@a@b*: Aaaah... Por aquí no hay muchos paisanos que quieran comprar armas. Claro, es que esto es una ciudáⓘ balneario. Tengo máⓘ tiempo libre que...\n@c2@"
  fr: "@a@b*ⓢ Aaaah... Il n'y a pas grand monde ici qui souhaite acheter des armes. Pas dans une ville thermale comme celle-ci. J'ai plus de temps libre que...\n@c2@"
  it: "@a@b*: Bah... Qui non c'è tanta gente che voglia comprare armi. Insomma, in fin dei conti, questa è una tranquilla cittadina termale.\n㈡\n*: Ho così tanto tempo libero che... \n@c2@"
  ja: "@a@b＊「ふわあ～　こんな温泉町で\n\t武器を買う人なんて　少ないから\n\tヒマで　ヒマで……。\n@c2@"
"18":
  de: "@a@b*: Nee, nee, so geht das aber nicht! Seid Ihr nun Kundschaft oder nicht? Ihr solltet was sagen, wenn Ihr was kaufen wollt!\n@c2@"
  en: "@a@b*: 'Old your 'orses! You en't a customer, is you!?\nYou should speak up if you wanna buy somethin'!\n@c2@"
  es: "@a@b*: ¡Eh, %H860%X%A120%Xpájaro%Z%B120%Xpájara%Z%Y%R000%Xpájaras%Ypájaros%Z%Z! ¡%H860%XTú no seráⓘ %A120%Xun cliente%Z%B120%Xuna clienta%Z%Y%R000%XVosotras no seréis unas clientas%YVosotros no seréis unos clientes%Z%Z ¿verdáⓘ?!\n¡Si %H860%Xquieres%Yqueréis%Z comprar algo, %H860%Xdilo%Ydecidlo%Z a las claras!\n@c2@"
  fr: "@a@b*ⓢ Attendez une secondeⓠ\nVous n'êtes pas %A120%Xun client%Z%B120%Xune cliente%Z, quand mêmeⓠⓑ\nIl faut le dire si vous voulez acheter quelque choseⓠ\n@c2@"
  it: "@a@b*: Santi numi! Ma tu vuoi comprare qualcosa, vero? Ti interessa la mia merce, eh?\nTi prego, dimmi che è così!\n@c2@"
  ja: "@a@b＊「あっ\n\tあんた　お客さんだったのかい？\n\tそれならそうと　言ってくれよ。\n@c2@"
"19":
  de: "@a@b*: Ich weiß nicht. Vielleicht sollte ich den Laden einfach dichtmachen und 'n schönes Bad nehmen. Jetzt kommt doch sicher kein Kunde mehr, oder?\n@c2@"
  en: "@a@b*: I don't know. Maybe I should just shut up shop an' go for a soak. No customers are gonna come now, are they?\n@c2@"
  es: "@a@b*: No sé, no sé... Igual tendría que cerrar e irme a dar un bañico. A esta hora ya no va a venir ningún cliente.\n@c2@"
  fr: "@a@b*ⓢ J'hésite... Peut-être que je devrais fermer boutique et aller me baigner. Les clients ne viendront plus à cette heure-ci, vous ne croyez pasⓡ\n@c2@"
  it: "@a@b*: Non so... Forse dovrei chiudere la baracca e andare a fare un bel bagno. Tanto non c'è nemmeno l'ombra di un cliente!\n@c2@"
  ja: "@a@b＊「あ～あ。　お客は来ないし\n\t店なんて　閉めちまって\n\t温泉にでも　入ってこようかねえ。\n@c2@"
"20":
  de: "@a@b*: Manche Leute sagen, auf dem Friedhof spukt es. Aber ich weiß nicht, ob ich das glauben soll.\n@c2@"
  en: "@a@b*: Some people say there's a ghost in that there graveyard. But I don't know if I believe it.\n@c2@"
  es: "@a@b*: Dicen los paisanos que en el cementerio ese hay un fantasma. Pero no sé yo si creéⓘmelo.\n@c2@"
  fr: "@a@b*ⓢ Certaines personnes racontent qu'il y a un fantôme dans ce cimetière.\nMais je ne suis pas sûre d'y croire.\n@c2@"
  it: "@a@b*: Qualcuno dice che in quel cimitero ci sia un fantasma, ma secondo me sono solo frottole.\n@c2@"
  ja: "@a@b＊「墓場に　お化けが出るなんて\n\t言う人がいるのよ。\n\tほんとなのかしらねえ……。\n@c2@"
"21":
  de: "@a@b*: Ich bin Schwester Hilda. Ihr könnt's sicher kaum erwarten, die Geschichte von Siegfried, dem Helden der Stadt, zu hören. Er war ein großer Krieger!\n@c1@"
  en: "@a@b*: You'd like Sister 'Ilda to tell you about the town 'ero, Bladud, would you? Yes, 'e was a very great warrior.\n@c1@"
  es: "@a@b*: ¿%H860%XTe%YOs%Z gustaría que la hermana Gilda %H860%Xte%Yos%Z contara la historia del héroe de la ciudáⓘ, Bartolo? Sí, era un guerrero de los buenos.\n@c1@"
  fr: "@a@b*ⓢ Je suis Sœur Hilda. Vous voulez sans doute que je vous raconte l'histoire de Godefroy, le héros de la ville. Oui, c'était vraiment un très grand guerrier.\n@c1@"
  it: "@a@b*: %H860%XVuoi%YVolete%Z che Sorella Ilda vi racconti la storia di Fortebraccio? Era un prode guerriero, proprio così!\n@c1@"
  ja: "@a@b＊「戦士リバストは　偉大な人でした。\n@c1@"
"22":
  de: "@aSchwester Hilda@bAls die Stadt vor vielen Jahren von Ungeheuern angegriffen wurde, machte Siegfried kurzen Prozess mit ihnen.\n@c1@"
  en: "@aSister 'Ilda@bMany years ago, when the town was attacked by monsters, it was Bladud that saw 'em off.\n@c1@"
  es: "@aHermana Gilda@bHace muchos años, cuando los monⓘtruos atacaron la ciudáⓘ, fue Bartolo el que los echó a patáⓘs.\n@c1@"
  fr: "@aSœur Hilda@bIl y a de nombreuses années de cela, lorsque la ville fut attaquée par des monstres, c'est Godefroy qui les repoussa.\n@c1@"
  it: "@aSorella Ilda@bTanto tempo fa, quando la città fu attaccata dai mostri, fu proprio Fortebraccio a scacciarli.\n@c1@"
  ja: "@a@b＊「何年も前　この町が\n\t魔物たちにおそわれた時\n\t彼は　町を守るために戦い……。\n@c1@"
"23":
  de: "@aSchwester Hilda@bEr kämpfte tapfer bis zum Schluss.\n㈡\nErst das allerletzte Ungeheuer war sein Verderben ⓚⓛ doch Siegfried hat es mit sich in den Tod gerissen!\n@c1@"
  en: "@aSister 'Ilda@bⓙE stood tall 'til the end, 'e did. It was only the very last monster what finished 'im off, but Bladud made sure 'e took the monster with 'im!\n@c1@"
  es: "@aHermana Gilda@bHasta el final aguantó. ¡Fue el último monⓘtruo el que acabó con él, pero Bartolo se aseguró de que se lo llevaba paⓘ que lⓘhiciera compañía!\n@c1@"
  fr: "@aSœur Hilda@bIl resta stoïque jusqu'au bout. Seul le tout dernier monstre parvint à le vaincre, mais Godefroy fit en sorte de l'entraîner dans sa chuteⓠ\n@c1@"
  it: "@aSorella Ilda@bResistette fino alla fine, e infatti fu proprio l'ultimo mostro a infliggergli la ferita mortale. Ma Fortebraccio fece fuori anche lui, prima di morire!\n@c1@"
  ja: "@a@b＊「そして　最後の魔物と\n\t相討ちして死にました。\n@c1@"
"24":
  de: "@aSchwester Hilda@bDass wir heute in unserer schönen Stadt so glücklich leben, haben wir also ganz allein Siegfried zu verdanken.\n@c1@"
  en: "@aSister 'Ilda@bSo it's Bladud we've got to thank for the wonderful town we live in 'ere today.\n@c1@"
  es: "@aHermana Gilda@bAsí que le tenemos que dar las gracias a Bartolo por esta ciudáⓘ tan bonita que tenemos.\n@c1@"
  fr: "@aSœur Hilda@bC'est donc Godefroy que nous devons remercier pour la ville merveilleuse dans laquelle nous vivons aujourd'hui.\n@c1@"
  it: "@aSorella Ilda@bDobbiamo essere grati a Fortebraccio se oggi possiamo vivere in questa meravigliosa città.\n@c1@"
  ja: "@a@b＊「この町が　今　こうしてあるのも\n\tリバストさまの　おかげなのです。\n@c1@"
"25":
  de: "@a@b*: Na! Nicht gucken! Ich will gerade ins Bad steigen, alter Spanner!\n@c1@"
  en: "@a@b*: Ah! Don't look!\nI'm just about to get in the bath, you dirty old man!\n@c1@"
  es: "@a@b*: ¡Ah! ¡No mires!\n¡Me voy a dar un baño, viejo verde!\n@c1@"
  fr: "@a@b*ⓢ Ahⓠ Ne regardez pasⓠ\nJe suis sur le point d'entrer dans le bain, espèce de vieux cochonⓠ\n@c1@"
  it: "@a@b*: Ah! Non guardare!\nSto per entrare nella vasca, vecchio sporcaccione!\n@c1@"
  ja: "@a@b＊「きゃっ！\n\tわたし　今から入るんだから\n\tあっちに行ってよ。　えっちねえ。\n@c1@"
"26":
  de: "@a@b*: Kommt doch auch rein! Wir Mädels machen's uns schon gemütlich, was?\n@c1@"
  en: "@a@b*: Do you want to come in too?\nAll girls together!\n@c1@"
  es: "@a@b*: ¿Quieres entrar también?\n¡Toⓘas las chicas juntas!\n@c1@"
  fr: "@a@b*ⓢ Vous voulez venir aussiⓡ\nToutes les filles ensembleⓠ\n@c1@"
  it: "@a@b*: Vuoi entrare anche tu?\nDai, tutte le ragazze insieme!\n@c1@"
  ja: "@a@b＊「ねえ　あなたも一緒に入る？\n\t女同士ですもんね。\n@c1@"
"27":
  de: "@a@b*: Ach du liebes bisschen! Was für winzige ⓚⓛ\nTut mir leid. Wie unhöflich von mir. Ihr kommt sicher nach Eurem Vater, nicht?\n@c1@"
  en: "@a@b*: Oh, my! I've never seen such tinyⓚⓛ\nI'm sorry. How rude of me. I suppose you took after your father, did you?\n@c1@"
  es: "@a@b*: ¡Oh, vaya! Nunca las había visto tan chiqui...\nPerdón. He sido muⓘ basta. Supongo que has salido a tu padre, ¿no?\n@c1@"
  fr: "@a@b*ⓢ Oh là làⓠ Je n'en avais jamais vu d'aussi petits...\nPardon, c'est très impoli de ma part. Vous devez beaucoup ressembler à votre père, je supposeⓡ\n@c1@"
  it: "@a@b*: Oh, cavolo! Devo dire che la natura non è stata molto generosa con te.\n㈡\n*: Oh, scusami, sono proprio una cafona! Volevo dire che hai preso da tuo padre, eh?\n@c1@"
  ja: "@a@b＊「あら　あなた\n\t意外と　胸が小さいのね。\n\tその胸は　お父さんに似たの？\n@c1@"
"28":
  de: "@a@b*: Ich bin Siegfried. Die Rüstung, die ich damals trug, wurde Zenithiarüstung genannt.\n@c2@"
  en: "@a@b*: I be Bladud, I be.\nThe armour I used to wear was called the Zenithian Armour.\n@c2@"
  es: "@a@b*: Yo soy el Bartolo.\nY la armadura que solía llevar se llama Armadura de Zenithia.\n@c2@"
  fr: "@a@b*ⓢ Je suis Godefroy.\nL'armure que je portais s'appelait l'Armure zénithienne.\n@c2@"
  it: "@a@b*: Io sono Fortebraccio.\nLa corazza che indossavo era chiamata Armatura Zenithiana.\n@c2@"
  ja: "@a@b＊「わたしは　戦士リバスト。\n\tわたしの　よろいは\n\t天空のよろいと　呼ばれていた。\n@c2@"
"29":
  de: "@aSiegfried@bAber jemand hat sie gestohlen und von hier weggebracht.\n@c2@"
  en: "@aBladud@bOnly some rascal's stolen 'e, an' taken 'e away somewhere.\n@c2@"
  es: "@aBartolo@bPero un sinvergüenza lⓘa robaⓘo y se lⓘa llevaⓘo a algún laⓘo.\n@c2@"
  fr: "@aGodefroy@bMais des malandrins l'ont volée et l'ont emportée quelque part.\n@c2@"
  it: "@aFortebraccio@bDei lestofanti l'hanno sottratta e nascosta da qualche parte.\n@c2@"
  ja: "@a@bリバスト「しかし　何者かが\n\tわが　よろいを　盗み\n\tいずこかへ　持ち去ったのだ。\n@c2@"
"30":
  de: "@aSiegfried@bIhr müsst sie finden, %H860%X%A120%XReisender%Z%B120%XReisende%Z%YReisende%Z, und sie dorthin zurückbringen, wo sie hingehört.\n@c2@"
  en: "@aBladud@bYou must find 'e, %H860%Xtrav'ller%Ytrav'llers%Z, an' return 'e to 'is proper restin' place.\n@c2@"
  es: "@aBartolo@b%H860%XDebes%YDebéis%Z encontrarla, %H860%X%A120%Xforastero%Z%B120%Xforastera%Z%Y%R000%Xforasteras%Yforasteros%Z%Z, y devolverla al lugar de reposo que le corresponde.\n@c2@"
  fr: "@aGodefroy@bVous devez la retrouver, %H860%X%A120%Xvoyageur%Z%B120%Xvoyageuse%Z%Y%R000%Xvoyageuses%Yvoyageurs%Z%Z, et la rapporter là où elle doit être.\n@c2@"
  it: "@aFortebraccio@b%H860%XDevi%YDovete%Z ritrovarla e riportarla lì dove deve stare.\n@c2@"
  ja: "@a@bリバスト「旅の者よ。\n\tどうか　わが　失われしよろいを\n\t見つけだしてほしい……。\n@c2@"
"31":
  de: "@aSiegfried@bMeine Rüstung! Das ist meine Rüstung!\n@c2@"
  en: "@aBladud@bMe armour! That's me armour!\n@c2@"
  es: "@aBartolo@b¡Mi armadura! ¡Esa es mi armadura!\n@c2@"
  fr: "@aGodefroy@bMon armureⓠ C'est mon armureⓠ\n@c2@"
  it: "@aFortebraccio@bLa mia armatura! Ma è la mia armatura!\n@c2@"
  ja: "@a@bリバスト「なんと　そなたらが\n\tわたしのよろいを！\n@c2@"
"32":
  de: "@aSiegfried@bIhr seid %H860%X%A120%X'n bannig anständiger Jung%Z%B120%X'ne bannig anständige Deern%Z%Ybannig anständige Leute%Z. Ihr könnt meine Rüstung behalten. Na, dann zieht man los und rettet die Welt!\n@c2@"
  en: "@aBladud@bYou're %H860%Xa decent %A120%Xfeller%Z%B120%Xwench%Z%Ydecent folk%Z, you are.\nYou can keep me armour.\nNow be off an' save the world!\n@c2@"
  es: "@aBartolo@b%H860%XEres %A120%Xun hombre honraⓘo%Z%B120%Xuna mujer honráⓘ%Z%YSois personas honrⓘás%Z, eso se nota.\n%H860%XPuedes quedarte%YPodéis quedaros%Z con la armadura.\n¡Hala, andando, a salvar el mundo!\n@c2@"
  fr: "@aGodefroy@bVous êtes %H860%X%A120%Xun gentilhomme%Z%B120%Xune femme respectable%Z%Ydes personnes respectables%Z.\nVous pouvez garder mon armure.\nÀ présent, allez sauver le mondeⓠ\n@c2@"
  it: "@aFortebraccio@b%H860%XSei un'anima pia%YSiete delle anime pie%Z.\n%H860%XTienila%YTenetela%Z pure.\nE ora %H860%Xparti e salva%Ypartite e salvate%Z il mondo!\n@c2@"
  ja: "@a@bリバスト「よろしい。\n\tそれは　そなたらにあげよう。\n\tどうか　世界を救ってくれい！\n@c2@"
"33":
  de: "@a@b*: Ach, was für eine wunderbare sternklare Nacht! Da muss man doch einfach Gedichte und Lieder schreiben!\n@c2@"
  en: "@a@b*: Alas, this star-filled night is too beautiful!\nIt makes me want to write poetry and songs...\n@c2@"
  es: "@a@b*: ¡Ah, qué bonita noche estrellada!\nMe dan ganas de componer poemas y canciones...\n@c2@"
  fr: "@a@b*ⓢ Hélas, cette nuit remplie d'étoiles est trop belleⓠ Elle me donne envie de composer poèmes et chansons...\n@c2@"
  it: "@a@b*: Questo cielo tempestato di stelle è splendido!\nMi fa venir voglia di scrivere poemi e sonate...\n@c2@"
  ja: "@a@b＊「きれいな星空ですね。\n\tこんな夜は　いい歌が\n\t作れそうな気が　します。\n@c2@"
"34":
  de: "@a@b*: La la la la lah Ⓠ\nⓆ Torneko schreitet forsch hinan\nund tritt den Weg ins Ödland an. Ⓠ\n@c2@"
  en: "@a@b*: La la la la lah... Ⓠ\nTorneko with his mighty stride Ⓠ\nHeads off to cross the desert wide Ⓠ\n@c2@"
  es: "@a@b*: La, la, la, laⓆ\nⓆTorneko se ha ido contento\npretende cruzar el desierto.Ⓠ\n@c2@"
  fr: "@a@b*ⓢ La la la la la Ⓠ\nⓆ Torneko et son puissant destrier,\ncommencent du désert la traversée Ⓠ\n@c2@"
  it: "@a@b*: La la la la la... Ⓠ\nⓆ Baldo mercante esperto,\nsi prepara ad attraversare il deserto... Ⓠ\n@c2@"
  ja: "@a@b＊「ララララ～。\n\tトルネコは　ゆくよ\n\t砂漠をこえて～　ララララ～\n@c2@"
"35":
  de: "@a@b*: Hier gab's mal einen Burschen namens Talun. Der war... Na ja, der hat schein Leben gansch gut auf der Reihe gehabt.\n@c2@"
  en: "@a@b*: There was a fella 'ere afore by the name o' Taloon. 'E was... 'E was doin' all right for 'imself, 'e was.\n@c2@"
  es: "@a@b*: Había un zagal antes por aquí que se llamaba Taloon. Le iba... Le iba bastante bien, creo.\n@c2@"
  fr: "@a@b*ⓢ Avant, il y avait ici un type qui s'appelait Taloon. Il... Il faisait de sacrées affaires.\n@c2@"
  it: "@a@b*: Prima qui sh'era un tizio di nome Baldo. Hic! She la shta passhando proprio bene, shì. Hic!\n@c2@"
  ja: "@a@b＊「以前　この町に立ち寄った\n\tトルネコって男は\n\tえらく　羽振りがよかったよ。\n@c2@"
"36":
  de: "@a@b*: Ja, das hadder wohl. An dem... Hick! An dem werd ich mir 'n Beispiel nehmen.\n@c2@"
  en: "@a@b*: Oh, aye! Aye...I...aye...? Hic!\nI'm gonna take a leaf outta 'is book. Hic!\n@c2@"
  es: "@a@b*: ¡Ah, sí! Sí... Yo... ¡Hip!\nVoy a seguir su ejemplo. ¡Hip!\n@c2@"
  fr: "@a@b*ⓢ Oh, ouiⓠ Oui... euh, je... ouic...ⓡ Hicⓠ\nJe vais prendre modèle sur lui. Hicⓠ\n@c2@"
  it: "@a@b*: Oh, shì! Hic! Io... Voglio imparare da lui come shi fa... Hic! Perché lui ha capito come shi fa shtrada nella vita! Hic!\n@c2@"
  ja: "@a@b＊「オレも　あんな風に\n\tなりてえもんだぜ。　ヒック！\n@c2@"
"37":
  de: "@a@b*: Also mal unter uns, von dem Gefasel des Herbergswirts nebenan kriege ich richtig Kopfschmerzen.\n@c2@"
  en: "@a@b*: This is just atween you an' me, but that innkeeper next door is givin' me an 'eadache the way 'e carries on.\n@c2@"
  es: "@a@b*: Entre %H860%Xtú%Y%R000%Xvostras%Yvosotros%Z%Z y yo, esa manera de hacer del dueño de la posáⓘ dⓘal lao me está poniendo nervioso.\n@c2@"
  fr: "@a@b*ⓢ Ça reste entre vous et moi, mais la façon dont se comporte l'aubergiste, juste à côté, me donne la migraine.\n@c2@"
  it: "@a@b*: Che resti fra noi, ma il tizio della locanda qui accanto si comporta in un modo che mi dà ai nervi.\n@c2@"
  ja: "@a@b＊「ここだけの話ですが\n\tとなりの宿屋の客引きには\n\tめいわくしてるんですよ。\n@c2@"
"38":
  de: "@a@b*: Aber wenn er nicht so viel schnacken würde, würd wohl auch kaum wer in dieser schäbigen Kaschemme übernachten!\n@c2@"
  en: "@a@b*: Mind you, if 'e didn't try it on like that, I wouldn't mind bettin' 'e wouldn't get anyone stayin' in that ramshackle old 'ole!\n@c2@"
  es: "@a@b*: %H860%XSabes%YSabéis%Z, si no se pusiese tan pesaⓘo, seguro que nadie querría entrar en ese viejo bujero.\n@c2@"
  fr: "@a@b*ⓢ Pensez-vous, s'il ne forçait pas la main comme ça, je parierais volontiers que personne n'irait dormir dans cette bicoque délabréeⓠ\n@c2@"
  it: "@a@b*: D'altra parte, se non facesse così, nessuno metterebbe piede nella sua bettola!\n@c2@"
  ja: "@a@b＊「まあ　ああでもしなきゃ\n\t誰も　あんなボロ宿なんかにゃ……\n\tおっと　少々言いすぎましたかね。\n@c2@"
"39":
  de: "@a@b*: Na bitte, das Bad war ein voller Erfolg. Der Alte schlummert süß und selig wie ein Säugling.\n@c2@"
  en: "@a@b*: The bath was a great success, see.\nLook at the old man. Snorin' like a baby!\n@c2@"
  es: "@a@b*: Lo del baño ha sido un éxito.\n¡Mira al viejo, roncando como un bendito!\n@c2@"
  fr: "@a@b*ⓢ Les bains ont vraiment été efficaces.\nRegardez l'ancêtre. Il ronfle comme un bébéⓠ\n@c2@"
  it: "@a@b*: Il bagno è stato bellissimo.\n%H860%XGuarda%YGuardate%Z quel vecchietto. Dorme come un bambino!\n@c2@"
  ja: "@a@b＊「温泉が　よほど気持ちよかったんだべな。\n\tほれ　あんなに気持ちよさそうに\n\t眠っているべ。\n@c2@"
"40":
  de: "@a@b*: Ha-püh...\n@c2@"
  en: "@a@b*: Ah-phew...\n@c2@"
  es: "@a@b*: Ah-fiuu...\n@c2@"
  fr: "@a@b*ⓢ Ron-pfff...\n@c2@"
  it: "@a@b*: Ronf!\n@c2@"
  ja: "@a@b＊「すうすう……。\n@c2@"
"41":
  de: "@a@b*: Ich hab mit dem Aufräumen genug zu tun, auch ohne dass Ihr mir im Weg steht! Fort mit Euch!\n@c2@"
  en: "@a@b*: Clearin' up's bad enough without you gettin' in the way! Go on! Away with ya!\n@c2@"
  es: "@a@b*: ¡Ya es bastante cansaⓘo tener que limpiaⓘ paⓘ que encima %H860%Xte metas%Yos metáis%Z por en medio! ¡Vamos! ¡Largo de aquí!\n@c2@"
  fr: "@a@b*ⓢ C'est déjà assez pénible de nettoyer sans avoir quelqu'un dans les pattesⓠ Allezⓠ Ne restez pas làⓠ\n@c2@"
  it: "@a@b*: Pulire è già una rogna senza che %H860%Xtu ti metta%Yvi mettiate%Z fra i piedi! Ho detto di andare via, capito?\n@c2@"
  ja: "@a@b＊「食事の　あとかたづけは大変！\n\tジャマを　しないでおくれよ。\n@c2@"
"42":
  de: "@a@b*: Wann war Herr Talun doch noch gleich hier in der Gegend?\n@c2@"
  en: "@a@b*: Now when was it that that Mr. Taloon was 'round these parts?\n@c2@"
  es: "@a@b*: ¿Cuándo fue que pasó por aquí el señor Taloon?\n@c2@"
  fr: "@a@b*ⓢ Quand était-ce, déjà, que ce Monsieur Taloon était dans le coinⓡ\n@c2@"
  it: "@a@b*: Quand'è stata l'ultima volta che quel Baldo Baldini è passato da queste parti?\n@c2@"
  ja: "@a@b＊「いつだったか\n\tトルネコという旅の商人が\n\tこの町に　やってきたんですよ。\n@c2@"
"43":
  de: "@a@b*: Er hatte Geld wie Krösus. Sagte, er wollte sich vielleicht ein Schiff kaufen, ist das zu glauben?\n@c2@"
  en: "@a@b*: 'E was dreadful rich, 'e was. Said 'e was thinkin' o' buyin' a ship, would ya believe?\n@c2@"
  es: "@a@b*: Ese sí que era rico de verdáⓘ. Decía que se quería comprar un barco, eso decía.\n@c2@"
  fr: "@a@b*ⓢ Il était drôlement riche, vous savez.\nIl a même dit qu'il envisageait d'acheter un bateau, vous vous rendez compteⓡ\n@c2@"
  it: "@a@b*: Gli uscivano i quattrini dalle orecchie, a quello lì. Diceva che stava pensando di comprare una nave... Da non credersi, eh?\n@c2@"
  ja: "@a@b＊「お金を　いっぱい持っていて\n\t船を買うつもりだと話していました。\n\tいや～　すごい人でしたなあ。\n@c2@"
"44":
  de: "@a@b*: Nein! Zzz... \nDer Geist kommt mich holen!\nZzz... Zzz...\n@c1@"
  en: "@a@b*: No! Zzz...\nThe ghost'zzz gonna get me!\nZzz... Zzz...\n@c1@"
  es: "@a@b*: ¡No! Zzz...\n¡El fantasma me va a pillar!\nZzz... Zzz...\n@c1@"
  fr: "@a@b*ⓢ Nonⓠ Zzz...\nLe fantôme va m'attraperⓠ\nZzz... zzz...\n@c1@"
  it: "@a@b*: No! Zzz...\nIl fantazzzma zzzta per prendermi!\nZzz... Zzz...\n@c1@"
  ja: "@a@b＊「えーん　こわいよお……。\n\tお化けが来るよお……。\n\tぐうぐう……。\n@c1@"
"45":
  de: "@a@bHier steht eine hell glänzende Rüstung.\n@c0@"
  en: "@a@bA bright and shiny suit of armour is on display.\n@c0@"
  es: "@a@bSe expone una reluciente armadura.\n@c0@"
  fr: "@a@bUne armure étincelante est exposée.\n@c0@"
  it: "@a@bUna fulgida armatura è in esposizione.\n@c0@"
  ja: "@a@bキラキラとかがやく\n派手なよろいが　かざられている。\n@c0@"
"46":
  de: "@a@b*: Moin Moin. Ihr seid neu hier, nicht? Tja, soll ich Euch dann mal 'n büschen rumführ'n?\n@c3@"
  en: "@a@b*: Wotcha. New to the place, are ya?\nWell 'ow's about I give %H860%Xya%Yya all%Z the grand tour then, eh?\n@c3@"
  es: "@a@b*: ¡Salúⓘ! %H860%XAcabas%YAcabáis%Z de llegar, ¿eh?\nBueno, ¿qué %H860%Xte parece si te%Yos parece si os%Z hago una visita guiada?\n@c3@"
  fr: "@a@b*ⓢ Salut. Vous v'nez d'arriver, nonⓡ\nÇa vous dirait que j'vous fasse une visite guidéeⓡ\n@c3@"
  it: "@a@b*: %H860%XUna faccia nuova%YDelle facce nuove%Z!\nBene bene, che ne %H860%Xdici%Ydite%Z di fare un tour guidato della zona?\n@c3@"
  ja: "@a@b＊「やあ　こんにちは。\n\tこの町は　初めてかい？\n\tなんなら　オレが案内しようか？\n@c3@"
"47":
  de: "@a@b*: Gut. Dann man hier lang!\n@c3@"
  en: "@a@b*: Nice! Right then, step this way!\n@c3@"
  es: "@a@b*: ¡Muⓘ bien! Por aquí, por favor.\n@c3@"
  fr: "@a@b*ⓢ Parfaitⓠ Alors, c'est par làⓠ\n@c3@"
  it: "@a@b*: Ottimo! Da questa parte!\n@c3@"
  ja: "@a@b＊「よーし　じゃあ\n\tオレに　ついてきてくれ！\n@c3@"
"48":
  de: "@a@b*: Das ist der Laden für Waffen und Rüstungen und all so 'n Zeugs. Ist nie viel los da, aber der Laden ist nicht schlecht.\n@c3@"
  en: "@a@b*: That's the weapon an' armour shops an' all that business. Don't do much trade, but they ain't bad.\n@c3@"
  es: "@a@b*: Ahí están las tiendas de armas, armaduras y toⓘ eso. No venden mucho, pero no están mal del toⓘ.\n@c3@"
  fr: "@a@b*ⓢ Là, ce sont les magasins d'armes et d'armures, et tout ce genre de trucs. Ils ont pas beaucoup de boulot, mais ils sont pas mauvais.\n@c3@"
  it: "@a@b*: Quello è il negozio che vende armi, armature e altre cose simili. Non è malaccio, ma gli affari non vanno mica tanto bene.\n@c3@"
  ja: "@a@b＊「そこに　ならんでいるのが\n\t武器屋と防具屋。\n\t装備は　ここで整えるといいね。\n@c3@"
"49":
  de: "@a@b*: Und hier ist der Kramladen. Wenn Ihr allerdings auf Andenken aus seid, da gibt's nicht viele von.\n@c3@"
  en: "@a@b*: An' 'ere we 'ave the item shop.\nAin't got much in the way o' souvenirs though, if that's the kind o' stuff ya like.\n@c3@"
  es: "@a@b*: Y aquí tenemos la tienda de objetos.\nEn cuanto a recuerdos, no tieⓘn mucho material.\n@c3@"
  fr: "@a@b*ⓢ Et là, voilà l'magasin d'objets.\nM'enfin, ils ont pas grand-chose comme souvenirs, si c'est le genre de trucs que vous aimez.\n@c3@"
  it: "@a@b*: E questo è l'emporio.\nMa se %H860%Xcerchi%Ycercate%Z dei souvenir di classe, %H860%Xti%Yvi%Z conviene provare in qualche altro negozio.\n@c3@"
  ja: "@a@b＊「ここが　道具屋。\n\t旅のおみやげになるような物は\n\tおいてないけどね。\n@c3@"
"50":
  de: "@a@b*: Und hier, wie Ihr seht, ist der Friedhof.\n@c3@"
  en: "@a@b*: As ya can see, up 'ere's the graveyard.\n@c3@"
  es: "@a@b*: Aquí está el camposanto, como se pueⓘ ver.\n@c3@"
  fr: "@a@b*ⓢ Comme vous voyez, là en haut, c'est l'cimetière.\n@c3@"
  it: "@a@b*: Questo, invece, è il camposanto.\n@c3@"
  ja: "@a@b＊「この先は　見てのとおり墓場だ。\n@c3@"
"51":
  de: "@a@b*: Hier liegt auch der große Krieger Siegfried, der die Stadt mal gerettet hat.\n@c3@"
  en: "@a@b*: It's the burial ground o' the great warrior Bladud wot saved the town once.\n@c3@"
  es: "@a@b*: Es el lugar de reposo del gran guerrero Bartolo, que salvó la ciudáⓘ.\n@c3@"
  fr: "@a@b*ⓢ C'est là qu'a été enterré Godefroy, le célèbre guerrier qui a sauvé la ville autrefois.\n@c3@"
  it: "@a@b*: Qui è sepolto il grande guerriero Fortebraccio, che salvò la città un bel po' di anni fa.\n@c3@"
  ja: "@a@b＊「ここには　この町を救った\n\t偉大なる戦士　リバストが\n\t眠っているんだ。\n@c3@"
"52":
  de: "@a@b*: Und da haben wir die Kirche... Hier wird der größte Schatz der Stadt aufbewahrt.\n@c3@"
  en: "@a@b*: An' this 'ere is the church, see...\nThis is where the town's greatest treasure's kept.\n@c3@"
  es: "@a@b*: Y esta es la iglesia.\nAquí guardan el tesoro más valioso de la ciudáⓘ.\n@c3@"
  fr: "@a@b*ⓢ Et ça, c'est l'église....\nC'est là qu'on conserve le plus précieux trésor de la ville.\n@c3@"
  it: "@a@b*: E questa è la chiesa... Al suo interno è conservato il tesoro più prezioso del villaggio.\n@c3@"
  ja: "@a@b＊「そして　ここが　教会なんだが……\n\tここにゃあ　すごい　お宝が\n\tあるんだぜ。\n@c3@"
"53":
  de: "@a@b*: 'Tschuldigung, Hilda ⓚⓛ äh, Schwester Hilda, wollt ich sagen. Ich zeig %H860%X%A120%Xdem Jung%Z%B120%Xder Deern%Z%Yden Leutchen hier%Z mal die Ihr-wisst-schon-was, ja?\n@c3@"
  en: "@a@b*: 'Scuse me, 'Ildaⓚⓛ Er...I mean, Sister 'Ilda...\nMind if I show %H860%Xthis punter%Ythese punters%Z the old you-know-wot? \n@c3@"
  es: "@a@b*: Perdón, Gilda... Digo, hermana Gilda.\n¿Te importa si enseño a %H860%X%A120%Xeste forastero%Z%B120%Xesta forastera%Z%Y%R000%Xestas forasteras%Yestos forasteros%Z%Z lo-que-tú-ya-sabes? \n@c3@"
  fr: "@a@b*ⓢ 'Scusez-moi, Hilda... euh, j'veux dire, Sœur Hilda...\n Ça vous ennuie si j'montre à %H860%X%A120%Xce client%Z%B120%Xcette cliente%Z%Y%R000%Xces clientes%Yces clients%Z%Z la vous-savez-quoiⓡ \n@c3@"
  it: "@a@b*: Ehi, Ilda... cioè, Sorella Ilda... Ti spiace se faccio vedere %H860%Xa questa persona%Ya queste persone%Z tu-sai-cosa?\n@c3@"
  ja: "@a@b＊「すいません　シスター。\n\t旅のお方に　あれを\n\t見せてあげたいんだけど。\n@c3@"
"54":
  de: "@aSchwester Hilda@bNatürlich. Die Göttin heißt alle Menschen willkommen.\n@c3@"
  en: "@aSister 'Ilda@bOf course. The Goddess welcomes all folk.\n@c3@"
