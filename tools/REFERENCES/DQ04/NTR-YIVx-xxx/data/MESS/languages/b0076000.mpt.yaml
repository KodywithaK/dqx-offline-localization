  fr: "@aSœur Hilda@bAllez-y. La Déesse accueille tout le monde.\n@c3@"
  it: "@aSorella Ilda@bCertamente! Tutti sono benvenuti nella casa della dea!\n@c3@"
  ja: "@a@bシスター「いいでしょう。\n\tでは　どうぞ中へ。\n@c3@"
"55":
  de: "@a@b*: Das ist sie. Die berühmte Rüstung vom alten Siegfried.\n@c3@"
  en: "@a@b*: So this is it. The famous armour wot old Bladud used to wear.\n@c3@"
  es: "@a@b*: Pues esto es. La famosa armadura que el viejo Bartolo solía llevar.\n@c3@"
  fr: "@a@b*ⓢ Alors voilà. La célèbre armure que portait Godefroy.\n@c3@"
