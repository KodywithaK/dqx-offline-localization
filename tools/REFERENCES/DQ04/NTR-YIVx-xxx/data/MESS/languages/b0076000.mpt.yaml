"57":
  de: "@a@b*: Und das hier ist das Bad. ⓞDer Jungbrunnen von Bad Jungbrunnⓟ sozusagen, hehe. Probiert's einfach mal, Ihr werdet Euch fühlen wie neugeboren.\n@c3@"
  en: "@a@b*: An' this 'ere is the bath. ⓗBarf's barfⓘ I like to call it. He he he! Get %H860%Xyerself%Yyerselves%Z in there an' yer aches 'n' pains'll soon be gone.\n@c3@"
  es: "@a@b*: Y esto son los baños. ''Al baño María'', digo yo. ¡Je, je, je! %H860%XEntra%YEntrad%Z ahí y pronto %H860%Xhabrás%Yhabréis%Z dicho adiós a todos los dolores y achaques.\n@c3@"
  fr: "@a@b*ⓢ Et ça, c'est les bains. ⓥLe Saint des Seinsⓦ, moi j'appelle ça. Hi hi hiⓠ Plongez-vous là-dedans et toutes vos douleurs s'envoleront.\n@c3@"
  it: "@a@b*: E queste sono le famose acque termali. Eh! Eh! Eh! %H860%XImmergiti e recupererai le tue%YImmergetevi e recupererete le vostre%Z energie in un baleno!\n@c3@"
  ja: "@a@b＊「そして　ここがアネイル温泉。\n\t温泉につかれば　旅の疲れも\n\tぶっ飛ぶってもんだよ。\n@c3@"
"58":
  de: "@a@b*: Tja, und nu, äh... Wo wolltet Ihr denn heute übernachten?\n@c3@"
  en: "@a@b*: So, er... Where was %H860%Xyou%Yyou lot%Z plannin' on stayin' tonight?\n@c3@"
  es: "@a@b*: Así que... ¿Dónde %H860%Xtienes pensao quedarte%Ytenéis pensao quedaⓘos%Z esta noche?\n@c3@"
  fr: "@a@b*ⓢ Et sinon, euh... vous aviez l'intention d'loger où, ce soirⓡ\n@c3@"
  it: "@a@b*: Allora... Dove %H860%Xpensi%Ypensate%Z di dormire stanotte?\n@c3@"
  ja: "@a@b＊「さて　ところであんた\n\t今日の宿は　もう決めたかい？\n@c3@"
"59":
  de: "@a@b*: Ich könnt Euch nämlich die Herberge hier empfehlen. Alles sauber und komfortabel, und der Wirt ist echt 'n Supertyp!\n@c3@"
  en: "@a@b*: Only, I can honestly recommend this place 'ere. It's clean an' comfortable, an' the innkeeper's a top geezer an' all!\n@c3@"
  es: "@a@b*: Puedo recomendar este sitio con toⓘa confianza. ¡Es limpio y cómodo y el posadero es un viejo muⓘ majico!\n@c3@"
  fr: "@a@b*ⓢ Parce que, franchement, j'peux vous recommander cet endroit. C'est propre et confortable. L'aubergiste est du tonnerre, et toutⓠ\n@c3@"
