  es: "@a@b*: ¡%H860%XEstá usted%YEstán ustedes%Z en la sala del trono!\n@c2@"
  fr: "@a@b*ⓢ Vous vous trouvez près de la chambre à coucher impérialeⓠ\n@c2@"
  it: "@a@b*: %H860%XSei%YSiete%Z nella sala del trono imperiale!\n@c2@"
  ja: "@a@b＊「ここは　ソレッタ王のお部屋です。\n@c2@"
"30":
  de: "@a@b*: Wünscht Ihr eine Audienz beim Kaiser? Seine Kaiserliche Hoheit ist zurzeit auf den... ähm... Feldern beschäftigt.\n@c2@"
  en: "@a@b*: Are you here for an audience with the Emperor? His Imperial Highness is presently occupied in the...erm...fields.\n@c2@"
  es: "@a@b*: ¿%H860%XDesea%YDesean%Z una audiencia con el Emperador? Su Alteza Imperial se encuentra ocupado en este momento en los..., ejem..., campos.\n@c2@"
  fr: "@a@b*ⓢ Êtes-vous ici pour une audience avec l'empereurⓡ Sa Grandeur Impériale est actuellement occupée dans les... euh... dans les champs.\n@c2@"
  it: "@a@b*: %H860%XSei%YSiete%Z qui per avere udienza con l'Imperatore? Sua Altezza è occupato... ehm... nei campi.\n@c2@"
  ja: "@a@b＊「王さまに　会いに来たのか？\n\tしかし　わが王は\n\tのら仕事に出ておられる。\n@c2@"
"31":
  de: "@a@b*: Leider ist die Lage in unserem Reich so ernst, dass selbst der Kaiser gezwungen ist, wie ein Bauer zu arbeiten.\n@c2@"
  en: "@a@b*: Iⓙm sorry to say that our empire is in such a dire situation that even the Emperor must work like a commoner.\n@c2@"
  es: "@a@b*: Lamento %H860%Xdecirle%Ydecirles%Z que nuestro imperio se halla en una situación tan precaria que hasta el Emperador debe trabajar como un comunero.\n@c2@"
  fr: "@a@b*ⓢ Je regrette d'avoir à le dire, mais notre empire est dans une situation si désastreuse que même l'empereur doit travailler comme un roturier.\n@c2@"
  it: "@a@b*: Mi duole ammettere che il nostro Impero è in un periodo di tale difficoltà che anche l'Imperatore è costretto a lavorare come un qualunque bracciante.\n@c2@"
  ja: "@a@b＊「ここだけの話だが\n\t王みずからが　働かねばならぬほど\n\tこの国は　まずしいのだ。\n@c2@"
"32":
  de: "@a@b*: Seine Kaiserliche Hoheit ist ein feiner Mann.\n@c2@"
  en: "@a@b*: His Imperial Highness is a jolly decent gent. \n@c2@"
  es: "@a@b*: Su Alteza Imperial es un caballero con un extraño sentido de la decencia. \n@c2@"
  fr: "@a@b*ⓢ Sa Grandeur Impériale est un type drôlement bien.\n@c2@"
  it: "@a@b*: Sua Altezza è una bravissima persona.\n@c2@"
  ja: "@a@b＊「王さまは　とても\n\tりっぱなお人ですわ。\n@c2@"
"33":
  de: "@a@b*: Aber obwohl selbst er so hart arbeitet, scheint unser früherer Wohlstand inzwischen unerreichbar.\n㈡\n*: Seit wir die Mutterkrauternte verloren haben, ist die Lage nicht gerade rosig.\n@c2@"
  en: "@a@b*: But even all his hard work isnⓙt enough to reunite us with our former prosperity.\nNot since we lost the feverfew crop.\n@c2@"
  es: "@a@b*: Pero ni siquiera este trabajo duro es suficiente como para restaurar nuestra antigua prosperidad.\n㈡\n*: Al menos, desde que perdimos los cultivos de reducefiebre.\n@c2@"
  fr: "@a@b*ⓢ Mais même s'il travaille dur, lui aussi, ce n'est pas suffisant pour nous rendre notre prospérité d'autrefois.\n@c2@"
  it: "@a@b*: Ma nonostante il suo impegno, non siamo ancora riusciti a tornare alla prosperità dei tempi passati.\n㈡\n*: Da quando il raccolto è andato perduto, ci troviamo in gravi ristrettezze.\n@c2@"
  ja: "@a@b＊「でも　パデキアが全滅してから\n\t働いても　働いても\n\tこの国は　豊かにならないのです。\n@c2@"
"34":
