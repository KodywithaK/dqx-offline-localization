"0":
  de: "@a@b*: Wenn Ihr von hier aus immer nach Südosten reist, gelangt Ihr ins Reich Parthenia.\n@c2@"
  en: "@a@b*: If you travel a long way south-east of here, you come to the Empire of Parthenia.\n@c2@"
  es: "@a@b*: Si %H860%Xviaja%Yviajan%Z hacia el sudeste desde aquí un buen trecho, %H860%Xllegará%Yllegarán%Z al Imperio de Parthenia.\n@c2@"
  fr: "@a@b*ⓢ Si vous suivez pendant un bon moment la direction du sud-est en partant d'ici, vous arriverez à l'empire de Parthénia.\n@c2@"
  it: "@a@b*: Se %H860%Xprocedi%Yprocedete%Z per un bel pezzo verso sud-est, %H860%Xarriverai%Yarriverete%Z all'Impero di Parthenia.\n@c2@"
  ja: "@a@b＊「ここから　ずっと東南に行くと\n\tソレッタのお城だよ。\n@c2@"
"1":
  de: "@a@b*: Oink oink...\n@c2@"
  en: "@a@b*: Oink oink...\n@c2@"
  es: "@a@b*: Oink, oink...\n@c2@"
  fr: "@a@b*ⓢ Groïnk groïnk...\n@c2@"
  it: "@a@b*: Oink oink...\n@c2@"
  ja: "@a@b＊「ブー　ブー！\n@c2@"
"2":
  de: "@a@b*: Willkommen im mächtigen Reich Parthenia! Heimat des wundersamen Mutterkrauts, des besten Heilmittels, das die Menschheit kennt!\n@c2@"
  en: "@a@b*: Welcome to the mighty Empire of Parthenia!\nHome of the miraculous feverfew plant, the finest panacea known to man!\n@c2@"
  es: "@a@b*: ¡%H860%X%A120%XBienvenido%Z%B120%XBienvenida%Z%Y%R000%XBienvenidas%YBienvenidos%Z%Z al poderoso Imperio de Parthenia!\n¡Lugar donde crece la milagrosa planta reducefiebre, la mejor panacea conocida por el hombre!\n@c2@"
  fr: "@a@b*ⓢ Bienvenue dans le puissant empire de Parthéniaⓠ\nC'est ici que pousse la miraculeuse camomille, la meilleure panacée connue de l'hommeⓠ\n@c2@"
  it: "@a@b*: %H860%X%A120%XBenvenuto%Z%B120%XBenvenuta%Z%Y%R000%XBenvenute%YBenvenuti%Z%Z nel valoroso Impero di Parthenia.\nLa nostra terra produce la miracolosa pianta di parthenio, la miglior panacea che esista al mondo!\n@c2@"
  ja: "@a@b＊「ここは　ソレッタの国。\n\tどんな病気も治す　パデキアの\n\t特産地だよ。\n@c2@"
"3":
  de: "@a@b*: Freilich steht es um unseren Wohlstand zurzeit nicht so zum Besten. Dennoch bietet uns unsere reiche Tradition Anlass zum Stolz!\n@c2@"
  en: "@a@b*: Of course, our material wealth is waning somewhat now... But we still have a rich tradition and strong pride to uphold!\n@c2@"
  es: "@a@b*: Bueno, ahora mismo nuestras reservas son más bien escasas... Pero tenemos ricas tradiciones que protegemos con gran orgullo.\n@c2@"
  fr: "@a@b*ⓢ Certes, notre richesse matérielle décline un peu, actuellement... Mais nos riches traditions et notre grande fierté sont toujours hautement respectéesⓠ\n@c2@"
  it: "@a@b*: Purtroppo, le nostre ricchezze materiali si stanno esaurendo... Ma non per questo rinunciamo alle nostre tradizioni secolari e al nostro orgoglio!\n@c2@"
  ja: "@a@b＊「というのも　むかしの話だけどね。\n@c2@"
"4":
  de: "@a@b*: Wen sucht Ihr, sagtet Ihr?\nTja, hier war eine junge Prinzessin namens Alena.\n@c2@"
  en: "@a@b*: Who are you looking for, did you say?\nWell, there was a young princess here by the name of Alena.\n@c2@"
  es: "@a@b*: ¿A quién %H860%Xdecía%Ydecían%Z que %H860%Xbuscaba%Ybuscaban%Z?\nBueno, había una joven princesa aquí que respondía al nombre de Alena.\n@c2@"
  fr: "@a@b*ⓢ Qui cherchez-vous, déjàⓡ\nEh bien, il y avait ici une jeune princesse du nom d'Alina.\n@c2@"
  it: "@a@b*: Chi è che %H860%Xstai%Ystate%Z cercando?\nIn effetti, da qui è passata una giovane principessa di nome Alena.\n@c2@"
  ja: "@a@b＊「誰かを　探しているだか？\n\tそういえば　この前\n\tアリーナっちゅう娘が　来たなあ。\n@c2@"
"5":
  de: "@a@b*: Ob sie allein war? Nein, nein. Sie war in Begleitung von mindestens drei Männern.\n㈡\n*: Ich glaube, mich an einen Ritter, einen Händler und einen recht verwegen aussehenden Kerl erinnern zu können.\n@c2@"
  en: "@a@b*: Was she alone? Oh, no. There were at least three men with her. I seem to recall a knight, a trader and a rather tough-looking fellow, too.\n@c2@"
  es: "@a@b*: ¿Que si estaba sola? Oh, no. Había por lo menos tres hombres con ella.\n㈡\n*: Me parece recordar a un caballero, un mercader y un tipo con apariencia de ser bastante rudo, también.\n@c2@"
  fr: "@a@b*ⓢ Si elle était seuleⓡ Oh non. Il y avait au moins trois hommes avec elle. Un chevalier, un marchand et un type à l'air costaud, si je me souviens bien.\n@c2@"
  it: "@a@b*: Se era da sola? Oh, no. C'erano almeno tre uomini con lei, se la memoria non m'inganna... Un cavaliere, un commerciante e un tipo dall'aspetto deciso.\n@c2@"
  ja: "@a@b＊「ひとりでかって？　うんにゃ。\n\tごついのやら　キザったらしいのやら\n\t３人ほど　男を連れていただよ。\n@c2@"
"6":
  de: "@a@bKeine Antwort...\n@c2@"
  en: "@a@bNo answer...\n@c2@"
  es: "@a@bNo hay respuesta...\n@c2@"
  fr: "@a@bPas de réponse...\n@c2@"
  it: "@a@bNessuna risposta...\n@c2@"
  ja: "@a@b返事がない……。\n@c2@"
"7":
  de: "@a@bDas ist nur eine Vogelscheuche.\n@c2@"
  en: "@a@bItⓙs just a scarecrow.\n@c2@"
  es: "@a@bNo es más que un espantapájaros.\n@c2@"
  fr: "@a@bCe n'est qu'un épouvantail.\n@c2@"
  it: "@a@bÈ solo uno spaventapasseri. \n@c2@"
  ja: "@a@bただの　かかしのようだ。\n@c2@"
"8":
  de: "@a@b*: Willkommen beim Kaiserlichen Palast.\nTretet doch ein.\n@c2@"
  en: "@a@b*: Welcome to the Imperial Palace.\nYou may enter at will.\n@c2@"
  es: "@a@b*: %H860%X%A120%XBienvenido%Z%B120%XBienvenida%Z%Y%R000%XBienvenidas%YBienvenidos%Z%Z al Palacio Imperial.\n%H860%XPuede%YPueden%Z entrar si así lo %H860%Xdesea%Ydesean%Z.\n@c2@"
  fr: "@a@b*ⓢ Bienvenue au palais impérial.\nVous pouvez entrer à votre guise.\n@c2@"
  it: "@a@b*: Questo è il palazzo imperiale.\n%H860%XPuoi%YPotete%Z entrare liberamente.\n@c2@"
  ja: "@a@b＊「ようこそ　ソレッタのお城へ！\n\tさあ　どうぞ中へ。\n@c2@"
"9":
  de: "@a@b*: Muuh, muuh...\n@c2@"
  en: "@a@b*: Moooo, moooo...\n@c2@"
  es: "@a@b*: Muuuu, muuuu...\n@c2@"
  fr: "@a@b*ⓢ Meeeuuh, meeeuuh...\n@c2@"
  it: "@a@b*: Muuu, muuu...\n@c2@"
  ja: "@a@b＊「ブモッ　ンモー！\n@c2@"
"10":
  de: "@a@b*: Guck mal, Lotte! Da sind unsere Gesichter im Teich!\n@c1@"
  en: "@a@b*: Look, Marmaduke!\nYou can see our faces in the pond!\n@c1@"
  es: "@a@b*: ¡Mira, Margarita!\n¡Se ven nuestras caras en el estanque!\n@c1@"
  fr: "@a@b*ⓢ Regarde, Mamanovaⓠ\nOn voit nos têtes dans la mareⓠ\n@c1@"
  it: "@a@b*: Guarda, Cicciola!\nLe nostre facce si riflettono nello stagno!\n@c1@"
  ja: "@a@b＊「ほんら　ユッキー。\n\tオイラと　おめえの顔が\n\t池さ　映ってんぞ！\n@c1@"
"11":
  de: "@a@b*: Muuuh!\n@c2@"
  en: "@a@b*: Moooo!\n@c2@"
  es: "@a@b*: ¡Muuuu!\n@c2@"
  fr: "@a@b*ⓢ Meeeuuhⓠ\n@c2@"
  it: "@a@b*: Muuuuu!\n@c2@"
  ja: "@a@b＊「ウモー！\n@c2@"
"12":
  de: "@a@b*: Ich bewirtschafte diese Äcker jetzt schon seit über dreißig Jahren.\n@c2@"
  en: "@a@b*: Iⓙve been ploughing these fields for more than thirty years, I have.\n@c2@"
  es: "@a@b*: Llevo arando estos campos desde hace más de seis lustros.\n@c2@"
  fr: "@a@b*ⓢ Je laboure ces champs depuis plus de trente ans.\n@c2@"
  it: "@a@b*: Mi occupo di questi campi da più di trent'anni ormai.\n@c2@"
  ja: "@a@b＊「おいらは　よーっとぉ\n\t畑たがやし　３０年ーっとぉ！\n@c2@"
"13":
  de: "@a@b*: Was? Mutterkraut? Nein. Davon gibt's hier nichts mehr. Vor fünf Jahren ist uns die gesamte Ernte bei einer Dürre eingegangen.\n@c2@"
  en: "@a@b*: What? Feverfew?\nNo. Thereⓙs none left now. The whole crop was wiped out in the drought five years ago.\n@c2@"
  es: "@a@b*: ¿Qué? ¿Reducefiebre?\nNo. Ya no queda nada. La totalidad de la cosecha se perdió por la sequía que sufrimos hace cinco años.\n@c2@"
  fr: "@a@b*ⓢ Quoiⓡ De la camomilleⓡ Non, il n'y en a plus, désormais. Toutes les plantations ont été détruites par la sécheresse, il y a cinq ans.\n@c2@"
  it: "@a@b*: Cosa? Dei Semi di parthenio?\nNo, non ne resta neanche uno. Tutto il raccolto andò perso cinque anni fa a causa della siccità.\n@c2@"
  ja: "@a@b＊「はあ？　パデキアの根っこ？\n\tああ　あれは５年前の干ばつで\n\t全滅しちまっただよ。\n@c2@"
"14":
  de: "@a@b*: Ich säe Mohrrüben und Kürbisse. Darin liegt die Zukunft, %H860%X%A120%Xguter Mann%Z%B120%Xgute Frau%Z%YIhr guten Leute%Z.\n@c2@"
  en: "@a@b*: Iⓙm into carrots and marrows.\nThatⓙs the future now, %A120%Xsir%Z%B120%Xmadam%Z.\n@c2@"
  es: "@a@b*: Ahora me dedico a las zanahorias y las calabazas.\n¡Es el futuro, %H860%X%A120%Xcaballero%Z%B120%Xseñora%Z%Y%R000%Xseñoras%Ycaballeros%Z%Z!\n@c2@"
  fr: "@a@b*ⓢ Je fais de la carotte et de la courge.\nC'est ça, l'avenir, %A120%Xmon bon monsieur%Z%B120%Xma brave dame%Z.\n@c2@"
  it: "@a@b*: Ora commercio in carote e zucche.\nTiro a campare, %A120%Xsignore mio%Z%B120%Xsignora mia%Z.\n@c2@"
  ja: "@a@b＊「だから　今は\n\tにんじんやら大根を\n\t作っているだよ。\n@c2@"
"15":
  de: "@a@b*: Willkommen, %H860%X%A120%XFremder%Z%B120%XFremde%Z%YFremde%Z. Ich bin Claudius, Kaiser von Parthenia. Die Zeiten sind hart, seit wir unsere Mutterkrauternte verloren haben.\n@c2@"
  en: "@a@b*: Welcome, %H860%Xstranger%Ystrangers%Z! I am Claudius, Emperor of Parthenia. Though times have been hard since we lost our feverfew crop.\n@c2@"
  es: "@a@b*: %H860%X%A120%XBienvenido sea, extranjero%Z%B120%XBienvenida sea, extranjera%Z%Y%R000%XBienvenidas seáis, extranjeras%YBienvenidos seáis, extranjeros%Z%Z. Mi nombre es Claudius, Emperador de Parthenia.\n㈡\n*: Han sido tiempos difíciles desde que perdimos nuestros cultivos de reducefiebre.\n@c2@"
  fr: "@a@b*ⓢ Bienvenue, %H860%X%A120%Xétranger%Z%B120%Xétrangère%Z%Y%R000%Xétrangères%Yétrangers%Z%Zⓠ Je suis Claudius, empereur de Parthénia. Les temps sont durs depuis que nous avons perdu nos plantations de camomille.\n@c2@"
  it: "@a@b*: %H860%XTi%YVi%Z do il benvenuto! Sono Claudio, imperatore di Parthenia. Da quando il raccolto di parthenio è andato perduto, viviamo una situazione difficile.\n@c2@"
  ja: "@a@b王「わしは　この国の王じゃ！\n\tわが国のパデキアが　全滅してから\n\tすでに　ひさしい。\n@c2@"
"16":
  de: "@aKaiser Claudius@bMein Vorgänger Kaiser Crescentius hat ein paar der kostbaren Mutterkrautsamen in der Kaiserlichen Kammer im Süden versteckt.\n@c2@"
  en: "@aEmperor Claudius@bMy predecessor, Emperor Crescentius, secreted away some of the precious feverfew seeds in the Imperial Pantry south of here.\n@c2@"
  es: "@aEmperador Claudius@bMi predecesor, el Emperador Crescentius, ocultó en secreto algunas preciosas simientes de reducefiebre en las catacumbas imperiales, al sur de este lugar.\n@c2@"
  fr: "@aEmpereur Claudius@bMon prédécesseur, l'empereur Crescentius, avait dissimulé quelques-unes des précieuses graines de camomille dans la Cave impériale, au sud d'ici.\n@c2@"
  it: "@aImperatore Claudio@bIl mio predecessore, l'imperatore Crescenzio, aveva conservato alcuni preziosi Semi di parthenio nella Sala del tesoro Imperiale, che si trova a sud di qui.\n@c2@"
  ja: "@a@b王「前の王が　もしもの時にと\n\t南の洞くつに　パデキアの種を\n\t保管しておいたそうだが……。\n@c2@"
"17":
  de: "@aKaiser Claudius@bAber dort haben sich inzwischen Ungeheuer breit gemacht. Die Kammer ist praktisch unzugänglich.\n@c2@"
  en: "@aEmperor Claudius@bBut monsters have taken up residence there now. The pantry is all but inaccessible.\n@c2@"
  es: "@aEmperador Claudius@bPero hay monstruos que ahora han adoptado ese lugar como residencia. Resulta imposible acceder a las catacumbas.\n@c2@"
  fr: "@aEmpereur Claudius@bMais des monstres y ont élu domicile.\nLa cave est totalement inaccessible.\n@c2@"
  it: "@aImperatore Claudio@bMa i mostri hanno l'occupata, e ora la Sala del tesoro è divenuta inaccessibile.\n@c2@"
  ja: "@a@b王「いつの頃からか　洞くつには\n\t魔物たちが　住みつき\n\t我が国の兵士では　たちうちできぬ！\n@c2@"
"18":
  de: "@aKaiser Claudius@bMein Reich ist verkümmert! Bitte verzeiht. Hätte ich nur ein paar Mutterkrautsamen, würde ich Eurer Bitte mit Freuden willfahren.\n@c2@"
  en: "@aEmperor Claudius@bMy empire is crippled! So I must apologise, %A120%Xsir%Z%B120%Xmadam%Z.\nIf I only had some feverfew seeds, I would gladly grant your wish.\n@c2@"
  es: "@aEmperador Claudius@b¡Mi imperio ha quedado lisiado! Así que debo %H860%Xpresentarle%Ypresentarles%Z mis disculpas, %H860%X%A120%Xseñor%Z%B120%Xseñora%Z%Y%R000%Xseñoras%Yseñores%Z%Z.\n㈡\nSi tan solo tuviera unas pocas simientes de reducefiebre, podría %H860%Xconcederle%Yconcederles%Z su deseo con sumo placer.\n@c2@"
  fr: "@aEmpereur Claudius@bMon empire est paralyséⓠ Veuillez donc m'excuser, %A120%XMonseigneur%Z%B120%Xchère Madame%Z. Si j'avais quelques graines de camomille, j'accéderais volontiers à votre requête.\n@c2@"
  it: "@aImperatore Claudio@bPurtroppo non posso far nulla!\n㈡\nSono mortificato, %A120%Xnobile cavaliere%Z%B120%Xnobile damigella%Z, ma se avessi a dispozione qualche Seme di parthenio, sarei ben lieto di esaudire i tuoi desideri.\n@c2@"
  ja: "@a@b王「すまぬのう。\n\tパデキアの種さえあれば\n\tそなたの望みも　かなえられようが。\n@c2@"
"19":
  de: "@aKaiser Claudius@bG-Gute Göttin! Mutterkrautsamen! Endlich!\n@c2@"
  en: "@aEmperor Claudius@bG-Good Goddess! Feverfew seeds! At last!\n@c2@"
  es: "@aEmperador Claudius@b¡Santa Diosa! ¡Simientes reducefiebre! ¡Al fin!\n@c2@"
  fr: "@aEmpereur Claudius@bPar... Par la Déesseⓠ Des graines de camomilleⓠ\nEnfinⓠ\n@c2@"
  it: "@aImperatore Claudio@bDea benedetta! Semi di parthenio! Finalmente!\n@c2@"
  ja: "@a@b王「おお！　おおおー！\n\tそれこそは　まさしくパデキアの種！\n\tついに　ついに……。\n@c2@"
"20":
  de: "@aKaiser Claudius@bJetzt rasch! Ihr müsst sie hier in die Erde legen. Sie brauchen nicht lange zum Wachsen.\n@c2@"
  en: "@aEmperor Claudius@bQuickly, now! You must sow them in the soil here. They shanⓙt take long to grow.\n@c2@"
  es: "@aEmperador Claudius@b¡Rápido, ahora! %H860%XDebe%YDeben%Z sembrarlas en este terreno. No tardarán en crecer.\n@c2@"
  fr: "@aEmpereur Claudius@bVite, viteⓠ Vous devez les semer ici, dans cette terre. Elles devraient pousser rapidement.\n@c2@"
  it: "@aImperatore Claudio@bBisogna piantarli senza indugio! Non impiegheranno molto a crescere.\n@c2@"
  ja: "@a@b王「ささ　その種を　早く村中の畑に！\n\t大丈夫　パデキアは\n\tすぐに育つのじゃ。\n@c2@"
"21":
  de: "@a@b%0%a00140 sät die Mutterkrautsamen in die Furchen.\n@c2@"
  en: "@a@b%0%a00140 sows the feverfew seeds in the furrows.\n@c2@"
  es: "@a@b%0%a00140 siembra las simientes de reducefiebre en los surcos del campo.\n@c2@"
  fr: "@a@b%0%a00140 sème les graines de camomille dans les sillons.\n@c2@"
  it: "@a@b%0%a00140 pianta i Semi di parthenio.\n@c2@"
  ja: "@a@b%a00140は\nパデキアのたねを　畑にまいた！\n@c2@"
"22":
  de: "@a@bZum Erstaunen der Umstehenden schießen auf der Stelle zahlreiche Mutterkrautpflanzen aus dem Boden.\n@c2@"
  en: "@a@bFeverfew shoots start popping up all over the place as everyone looks on in disbelief!\n@c2@"
  es: "@a@bPlantas de reducefiebre comienzan a crecer ante la atónita mirada de todo el mundo.\n@c2@"
  fr: "@a@bÀ la surprise de tous, des plants de camomille poussent aussitôtⓠ\n@c2@"
  it: "@a@bTra lo stupore generale, dal terreno spuntano immediatamente dei germogli!\n@c2@"
  ja: "@a@bなんと！　みるみるうちに\nパデキアが　芽を出した！\n@c2@"
"23":
  de: "@aKaiser Claudius@bIch danke Euch, %H860%X%A120%Xguter Herr%Z%B120%Xliebe Dame%Z%Ymeine lieben Freunde%Z.\nIhr habt das Reich gerettet!\n@c2@"
  en: "@aEmperor Claudius@bThank you, %A120%Xgood sir%Z%B120%Xmy lady%Z.\nYou have saved the Empire!\n@c2@"
  es: "@aEmperador Claudius@bGracias, %H860%X%A120%Xmi señor%Z%B120%Xmi señora%Z%Y%R000%Xseñoras%Yseñores%Z%Z.\n¡%H860%XHa%YHan%Z salvado al Imperio!\n@c2@"
  fr: "@aEmpereur Claudius@bMerci, %A120%XMonseigneur%Z%B120%Xchère Madame%Z.\nVous avez sauvé l'empireⓠ\n@c2@"
  it: "@aImperatore Claudio@bGrazie di cuore, %A120%Xcavaliere%Z%B120%Xmadamigella%Z. Hai salvato il mio Impero!\n@c2@"
  ja: "@a@b王「ありがとう！\n\tこれで　この国は救われた！\n@c2@"
"24":
  de: "@aKaiser Claudius@bBitte nehmt doch eine Mutterkrautwurzel mit, zum Andenken an diese höchst glückverheißende Begebenheit.\n@c2@"
  en: "@aEmperor Claudius@bI should like you to take a feverfew root with you as a trophy of this most auspicious occasion.\n@c2@"
  es: "@aEmperador Claudius@bMe gustaría que se %H860%Xllevara%Yllevaran%Z consigo una raíz reducefiebre como recuerdo de una ocasión tan propicia.\n@c2@"
  fr: "@aEmpereur Claudius@bJ'aimerais que vous emportiez avec vous une racine de camomille, en guise de récompense pour cet événement des plus favorables.\n@c2@"
  it: "@aImperatore Claudio@bVoglio donarti una Radice di parthenio, in ricordo di questo evento felice.\n@c2@"
  ja: "@a@b王「ささ　そなたもパデキアの根っこを\n\t持ってゆくがよい。\n@c2@"
"25":
  de: "@a@b%0%a00110 erhält eine Mutterkrautwurzel.\n@c2@"
  en: "@a@b%0%a00110 receives a feverfew root.\n@c2@"
  es: "@a@b%0%a00110 recibe una raíz reducefiebre.\n@c2@"
  fr: "@a@b%0%a00110 reçoit une racine de camomille.\n@c2@"
  it: "@a@b%0%a00110 riceve una Radice di parthenio.\n@c2@"
  ja: "@a@b%a00110は\nパデキアのねっこを　手に入れた。\n@c2@"
"26":
  de: "@a@b*: Miauuu.\n@c1@"
  en: "@a@b*: Meooow.\n@c1@"
  es: "@a@b*: Miaaau.\n@c1@"
  fr: "@a@b*ⓢ Miaaaaou.\n@c1@"
  it: "@a@b*: Miaaao.\n@c1@"
  ja: "@a@b＊「みゃーお。\n@c1@"
"27":
  de: "@a@b*: Ah! Ihr kommt von Mintos, nicht wahr? Dorthin ist meine Tochter gezogen, als sie heiratete, wisst Ihr.\n@c2@"
  en: "@a@b*: Ah! You arrived here from Mintos, did you?\nMy daughter moved there when she was married, you know.\n@c2@"
  es: "@a@b*: ¡Ah! %H860%XLlega procedente%YLlegáis procedentes%Z de Mintos, ¿no es así?\nMi hija se trasladó a vivir allí cuando se casó.\n@c2@"
  fr: "@a@b*ⓢ Ahⓠ Vous arrivez de Ringys, c'est çaⓡ\nMa fille s'est installée là-bas après son mariage, vous savez.\n@c2@"
  it: "@a@b*: Ah! %H860%XArrivi%YArrivate%Z da Mintos, vero?\nMia figlia si è trasferita lì dopo essersi sposata.\n@c2@"
  ja: "@a@b＊「ほほう　ミントスから来なすったか。\n\tあの町には　わしの娘が\n\tとついでいってのお。\n@c2@"
"28":
  de: "@a@b*: Und jetzt habe ich dort auch ein paar goldige kleine Enkelkinder. Wie es ihnen wohl geht?\n@c2@"
  en: "@a@b*: Iⓙve a couple of delightful grandchildren there now, too. I wonder how they are...\n@c2@"
  es: "@a@b*: Ahora tengo allí dos nietecillos deliciosos. Me pregunto cómo estarán...\n@c2@"
  fr: "@a@b*ⓢ À présent, j'ai aussi là-bas quelques adorables petits-enfants. Je me demande comment ils vont...\n@c2@"
  it: "@a@b*: Ora ho anche due deliziosi nipoti. Chissà come stanno...\n@c2@"
  ja: "@a@b＊「かわいい　ふたりの孫が\n\tおるんじゃよ。\n\t元気にしとるかのお……。\n@c2@"
"29":
  de: "@a@b*: Ihr seid im Königlichen Thronsaal!\n@c2@"
