"43":
  de: "@a@b*: Was? Mutterkrautsamen?! Oh, das müsst Ihr sofort Seiner Kaiserlichen Hoheit sagen! Er wird vor Freude außer sich sein!\n@c2@"
  en: "@a@b*: What? Feverfew seeds!?\nOh, you must tell His Imperial Highness at once!\nHeⓙll be ecstatic!\n@c2@"
