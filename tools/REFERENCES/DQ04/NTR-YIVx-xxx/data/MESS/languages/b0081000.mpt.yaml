"44":
  de: "@a@b*: Nur... nur ist er heute ganz erschöpft. Er schläft schon wie ein Stein. Aber kommt doch gleich morgen früh wieder!\n@c2@"
  en: "@a@b*: Except...heⓙs exhausted himself today.\nHeⓙs sleeping like a log.\nCome back first thing in the morning, though!\n@c2@"
  es: "@a@b*: Aunque... hoy está muy cansado.\nDuerme como un bebé.\nNo obstante, ¡%H860%Xvuelva%Yvuelvan%Z a primera hora de la mañana!\n@c2@"
