  fr: "@a@b*ⓢ C'est sacrément dommage pour tout le monde, y compris l'empereur.\n@c2@"
  it: "@a@b*: Viviamo tutti una situazione di grande disagio.\n@c2@"
  ja: "@a@b＊「かわいそうな　王さま……。\n@c2@"
