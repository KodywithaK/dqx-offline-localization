"62":
  de: "@a@b*: Der alte Mann steht jede Nacht da drüben am anderen Ufer des Sees.\n@c1@"
  en: "@a@b*: That old man stands over there on the other side of the lake every single night.\n@c1@"
  es: "@a@b*: Ese anciano aparece todas las noches en la otra orilla del lago.\n@c1@"
  fr: "@a@b*ⓢ Ce vieil homme se tient là-bas, de l'autre côté du lac, toutes les nuits.\n@c1@"
  it: "@a@b*: Quel vecchio se ne sta tutte le sere lì, in piedi, dall'altro lato del lago.\n@c1@"
  ja: "@a@b＊「毎晩　この池の向こうに\n\tおじいさんが立っているの。\n@c1@"
"63":
