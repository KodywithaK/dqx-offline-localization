"16":
  de: "@a@b*: Wir reisen durch die Welt, um das Ungeheuer aller Ungeheuer zu finden und auszulöschen.\n@c3@"
  en: "@a@b*: We're travelling the world to find the monster of all monsters and wipe him out.\n@c3@"
