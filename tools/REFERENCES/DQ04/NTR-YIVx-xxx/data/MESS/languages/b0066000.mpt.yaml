"9":
  de: "@a@b*: Ihr schon wieder? Hmpf! Übernachtet hier, wenn's sein muss, aber morgen früh schwirrt Ihr ab! Mit 'ner Zuckerschnute erreicht man bei mir gar nichts!\n@c2@"
