  es: "@a@b*: Escucha, hay cosas por aquí guardadas.\n¡Hazte con lo que quieras y lárgate!\n@c2@"
  fr: "@a@b*ⓢ Tu sais quoiⓡ Il y a des trucs dans une jarre, par là-bas. Prends ce que tu veux et déguerpisⓠ\n@c2@"
  it: "@a@b*: Passando da lì %H860%Xtroverai%Ytroverete%Z delle cose in un recipiente.\n%H860%XPrendi quello che vuoi e smamma%YPrendete quello che volete e smammate%Z!\n@c2@"
  ja: "@a@b＊「あっちの部屋の　つぼの中に\n\tいろいろ　入ってるから\n\tそれを持っていきやがれ！\n@c2@"
"6":
  de: "@a@b*: Ihr schon wieder? Hmpf! Schön, übernachtet hier, wenn's sein muss, aber morgen früh schwirrt Ihr wieder ab! Kapiert, Bürschchen?\n@c2@"
  en: "@a@b*: You again!? Hmph! Stay the night if you have to, but clear off in the morning. Understand, you little brat?\n@c2@"
  es: "@a@b*: ¡¿Tú otra vez?! ¡Umpf! Puedes quedarte esta noche pero deberás marcharte por la mañana. ¿Entendido, mocoso?\n@c2@"
  fr: "@a@b*ⓢ Encore toiⓠⓑ Mmpfⓠ Reste ici cette nuit si tu veux, mais déguerpis dès demain matin.\nCompris, petit morveuxⓡ\n@c2@"
  it: "@a@b*: Accidenti, ancora tu?!? Rimani per stanotte, se proprio devi, ma domattina non voglio più vederti! Ci siamo intesi, moccioso?\n@c2@"
  ja: "@a@b＊「なんだ　また　おめえか！？\n\tふん！　てめえみたいな　ガキは\n\tひと晩　泊まっていきやがれ！\n@c2@"
