"1":
  de: "@a@b*: Wer seid Ihr denn? %H860%X%A120%XEin Reisender%Z%B120%XEine Reisende%Z%YReisende%Z, was? Tja, hier gibt's nichts zu sehen. Nur 'ne alte Holzfällerhütte.\n@c2@"
  en: "@a@b*: Who be you? %H860%XA travⓙller%YTravⓙllers%Z, are ya?\nWell there's nothinⓙ to see here.\nJust an old woodcutter's cabin.\n@c2@"
  es: "@a@b*: ¿Quién va? ¿%H860%X%A120%XUn viajero%Z%B120%XUna viajera%Z%Y%R000%XViajeras%YViajeros%Z%Z?\nAquí no hay nada que ver.\nSolo la cabaña de un viejo leñador.\n@c2@"
  fr: "@a@b*ⓢ Qui %H860%X%A120%Xes-tuⓡ Un voyageur%Z%B120%Xes-tuⓡ Une voyageuse%Z%Y%R000%Xêtes-vous. Des voyageuses%Yêtes-vous. Des voyageurs%Z%Z, c'est çaⓡ\nBen y'a rien à voir, ici.\nC'est qu'une vieille cabane de bûcheron.\n@c2@"
  it: "@a@b*: E %H860%Xtu chi sei%Yvoi chi siete%Z?\nNon c'è niente da vedere qui.\nSolo il capanno di un vecchio taglialegna.\n@c2@"
  ja: "@a@b＊「なんだ　おめえ！　旅のもんかい？\n\tここは見てのとおり　木こりの家だ。\n@c2@"
"2":
  de: "@a@b*: Was soll überhaupt diese Leichenbittermiene? Junge Leute kann ich nicht ausstehen, und mürrische schon gar nicht!\n@c2@"
  en: "@a@b*: What ya lookinⓙ so glum for, anyways?\nI hate kids, anⓙ grumpy ones are the worst!\n@c2@"
  es: "@a@b*: ¿Por qué %H860%Xtraes%Ytraéis%Z esa cara tan triste?\nOdio a los niños, sobre todo a los quejicas, ¡son los peores!\n@c2@"
  fr: "@a@b*ⓢ Et puis pourquoi cet air si sombreⓡ\nJe déteste les mioches et ceux qui boudent sont les piresⓠ\n@c2@"
  it: "@a@b*: Perché %H860%Xquella faccia triste%Yquelle facce tristi%Z, eh?\nIo odio i mocciosi, e quelli mogi mi stanno ancora più antipatici!\n@c2@"
  ja: "@a@b＊「にしても　しけたツラしてんな。\n\tオレはよう　いんきくせえガキは\n\tでえキライなんだよ！\n@c2@"
"3":
  de: "@a@b*: Warum geht Ihr nicht einfach weiter den Berg runter und ärgert wen in der Stadt? Südöstlich von hier liegt eine Burg.\n@c2@"
  en: "@a@b*: Why donⓙt ya just get on down the mountain anⓙ annoy someone in town instead, eh?\nThereⓙs a castle just south-east of here.\n@c2@"
  es: "@a@b*: ¿Por qué no %H860%Xbajas%Ybajáis%Z la montaña y %H860%Xmolestas%Ymolestáis%Z a alguien en la ciudad, eh?\nAl sudeste de aquí hay un castillo.\n@c2@"
  fr: "@a@b*ⓢ Pourquoi ne pas descendre de la montagne et aller plutôt en ville, ennuyer quelqu'un d'autre, heinⓡ Il y a un château au sud-est d'ici.\n@c2@"
  it: "@a@b*: Perché non %H860%Xscendi%Yscendete%Z al villaggio a scocciare qualcun altro?\nProprio a sud-est di qui c'è un castello.\n@c2@"
  ja: "@a@b＊「てめえみてえな　ガキは\n\tさっさと山をおりやがれ！\n\t東南に行けば　城があっからよ！\n@c2@"
"4":
  de: "@a@b*: Augenblick mal! Wo wollt Ihr denn hin, so dürftig wie Ihr ausgestattet seid? Wie wollt Ihr das denn lebend überstehen?\n@c2@"
  en: "@a@b*: Hold up! Where d'ya think yer goin' in your state? How d'ya think yer gonna survive?\n@c2@"
  es: "@a@b*: Espera, ¿adónde vas en semejante estado? ¿Cómo vas a sobrevivir?\n@c2@"
  fr: "@a@b*ⓢ Attends une secondeⓠ\nTu comptes aller loin comme çaⓡ\nTu ne vas pas tenir bien longtemps.\n@c2@"
  it: "@a@b*: Ma che %H860%Xfai%Yfate%Z?! Non si può mica viaggiare conciati in quel modo!\n@c2@"
  ja: "@a@b＊「ちょっと　待ったぁ！\n\tなんだ　おめえの格好は！？\n\tそんなんじゃ　旅はできねえぞ！\n@c2@"
"5":
  de: "@a@b*: Ich sag Euch was, in den Töpfen da drüben sind 'n paar Sachen versteckt. Nehmt Euch, was Ihr wollt, und dann nix wie los!\n@c2@"
