  de: "@aPsaro@bIch werde das Geheimnis der Evolution nutzen und so stark werden, dass keiner mich aufhalten kann!\n@c2@"
  en: "@aPsaro@bI'll use the Secret of Evolution and become so strong that no one will be able to stop me!\n@c2@"
  es: "@aPsaro@b¡Utilizaré el Secreto de la Evolución y seré tan poderoso que nadie podrá detenerme!\n@c2@"
