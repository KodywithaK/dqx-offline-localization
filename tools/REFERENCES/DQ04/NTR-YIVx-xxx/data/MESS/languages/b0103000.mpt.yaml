"52":
  de: "@a@b*: Wir machen alle mal schwere Zeiten durch.\nHab ich nicht Recht, %H860%X%A120%XReisender%Z%B120%XReisende%Z%YReisende%Z?\n@c1@"
  en: "@a@b*: Folk always hae tae face troubles like this, an' they always pull through. Isnae that right, %H860%Xtraveller%Ytravellers%Z?\n@c1@"
  es: "@a@b*: La gente siempre tiene que enfrentarse a problemas como estos y siempre sale adelante. ¿No es cierto, %H860%X%A120%Xviajero%Z%B120%Xviajera%Z%Y%R000%Xviajeras%Yviajeros%Z%Z?\n@c1@"
  fr: "@a@b*ⓢ Tout le monde est confronté à ce genre de problème, mais on s'en sort toujours, n'est-ce pas %H860%X%A120%Xvoyageur%Z%B120%Xvoyageuse%Z%Y%R000%Xvoyageuses%Yvoyageurs%Z%Zⓡ\n@c1@"
  it: "@a@b*: Ognuno di noi ha dei problemi. L'importante è riuscire a superarli. Non è così, %H860%Xviandante%Yviandanti%Z?\n@c1@"
  ja: "@a@b＊「いつの時代でも\n\t心配ごとは　つきぬものですわ。\n\tねえ　旅の人。\n@c1@"
"53":
  de: "@a@b*: Ich bin ein bisschen besorgt, weil in der Herberge jetzt nicht mehr allzu viel los ist.\n@c1@"
  en: "@a@b*: It's a bit of a worry that business at the inn has quietened doon again.\n@c1@"
  es: "@a@b*: Me preocupa un poco que el movimiento de la posada haya decaído un poco otra vez.\n@c1@"
  fr: "@a@b*ⓢ Ça m'inquiète un peu de voir qu'il y a moins de monde à l'auberge.\n@c1@"
  it: "@a@b*: Mi dispiace che gli affari alla locanda abbiano rallentato.\n@c1@"
  ja: "@a@b＊「最近　宿屋がヒマで\n\t困っているのですが。\n@c1@"
"54":
  de: "@a@b*: Aber wenigstens hab ich jetzt meine Ruh und kann meinem kleinen Spatz beim Schlafen zuschauen.\n@c1@"
  en: "@a@b*: Still, at least I get some peace an' quiet noo, watchin' ma lovely wee bairn sleepin'.\n@c1@"
  es: "@a@b*: En cualquier caso, así puedo disfrutar de algo de paz y sosiego viendo a mi pequeño dormir.\n@c1@"
  fr: "@a@b*ⓢ Mais au moins, j'ai la paix et je peux regarder mon petit dormir tranquillement.\n@c1@"
  it: "@a@b*: Almeno, però, ora c'è un po' di tranquillità, e posso godermi beata la vista di mio figlio che dorme.\n@c1@"
  ja: "@a@b＊「子どもの寝顔を見ていると\n\t嫌なことも　忘れられますわ。\n@c1@"
