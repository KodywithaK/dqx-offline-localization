"45":
  de: "@a@b*: Hm, welche Höhle soll ich denn heut erkunden...?\n@c1@"
  en: "@a@b*: Right then, which cave shall I gae explorin' today...?\n@c1@"
  es: "@a@b*: Bien, bien. ¿Qué cueva exploraré hoy...?\n@c1@"
  fr: "@a@b*ⓢ Bon, quelle grotte je vais explorer aujourd'hui...ⓡ\n@c1@"
  it: "@a@b*: Bene, quale grotta posso esplorare oggi?\n@c1@"
  ja: "@a@b＊「今度は　どこの洞くつを\n\t探検しようかなあ……。\n@c1@"
