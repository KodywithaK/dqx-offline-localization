"49":
  de: "@a@b*: Erst waren alle Kinderchen verschwunden, und jetzt dieser seltsame Traum!\n@c2@"
  en: "@a@b*: First there was all that stramash aboot the bairns bein' snatched, an' noo there's this funny dream.\n@c2@"
  es: "@a@b*: Primero todo ese ajetreo sobre los pequeños que habían sido raptados y ahora está ese extraño sueño.\n@c2@"
  fr: "@a@b*ⓢ D'abord, il y a eu les enlèvements d'enfants et maintenant, ce rêve bizarre...\n@c2@"
  it: "@a@b*: Prima c'è stato il mistero dei bambini rapiti, e adesso questa storia del sogno comune.\n@c2@"
  ja: "@a@b＊「子どもさらいの事件が\n\t終わったと思えば\n\t今度は変な　夢の話……。\n@c2@"
"50":
  de: "@a@b*: Herrschaftszeiten! Werd ich denn nie meinen Frieden haben?!\n@c2@"
  en: "@a@b*: Mon, it feels like we're destined never tae hae another peaceful moment again!\n@c2@"
  es: "@a@b*: ¡Cielos, parece que estamos predestinados a no volver a tener otro momento de paz!\n@c2@"
  fr: "@a@b*ⓢ Eh bien, j'ai l'impression que la Déesse ne veut pas nous accorder de répitⓠ\n@c2@"
  it: "@a@b*: Accipicchia! Ma quand'è che torneremo ad avere un po' di tranquillità?\n@c2@"
  ja: "@a@b＊「いつになったら　安心して\n\t暮らせるのだろうか……。\n@c2@"
"51":
  de: "@a@b*: Ah geh, Herr Schulleiter.\n@c1@"
