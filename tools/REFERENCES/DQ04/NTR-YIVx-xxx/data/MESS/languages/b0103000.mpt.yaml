"63":
  de: "@aPsaro@bIch muss dir etwas sagen. Ich habe beschlossen, die Menschheit zu vernichten.\n@c2@"
  en: "@aPsaro@bI have something to tell you.\nI've decided to destroy all humankind.\n@c2@"
  es: "@aPsaro@bTengo algo que decirte.\nHe decidido destruir a toda la humanidad.\n@c2@"
  fr: "@aPsaro@bJ'ai quelque chose à te dire.\nJ'ai décidé d'anéantir l'humanité.\n@c2@"
  it: "@aPsaro@bDevo dirti una cosa molto importante... \nHo deciso di distruggere tutta l'umanità.\n@c2@"
