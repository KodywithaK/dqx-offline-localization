  ja: "@a@b＊「では　どうぞ　ごゆっくり\n\tおやすみください。\n@c2@"
"59":
  de: "@a@b%0%a00140 fällt in einen tiefen Schlaf.\nKurz darauf beginnt ein Traum...\n@c0@"
  en: "@a@b%0%a00140 falls into a deep sleep.\nShortly afterwards, a dream begins...\n@c0@"
  es: "@a@b%0%a00140 cae en un profundo sueño.\nPoco después, empieza a soñar...\n@c0@"
