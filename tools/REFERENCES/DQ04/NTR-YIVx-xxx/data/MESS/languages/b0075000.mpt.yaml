"0":
  de: "@aHank Hoffman Jr.@bWas wollt Ihr? Hey, Moment mal! Bei den Hunden der Prärie! Was ist das für ein Juwel?\n@c2@"
  en: "@aHank Hoffman Jr.@bWhaddya want, huh? Wait a minute... Sakes alive! What is that jewel you got there?\n@c2@"
  es: "@aJuanchito@b¿Y %H860%Xusted%Yustedes%Z qué %H860%Xquiere%Yquieren%Z? Un momento... ¡Ay Diosita! ¿Qué joya es esa que %H860%Xlleva%Yllevan%Z ahí nomás?\n@c2@"
  fr: "@aHank Hoffman Jr@bQu'est-ce que vous voulez, heinⓡ Attendez une minute... Nom d'une pipeⓠ Qu'est-ce que c'est qu'ce joyau qu'vous avez làⓡ\n@c2@"
  it: "@aJohn Dwayne Jr.@bMa cosa %H860%Xvuoi%Yvolete%Z, eh? Ehi... Che mi prenda un colpo! Cos'è quel gioiello che %H860%Xhai%Yavete%Z lì?\n@c2@"
  ja: "@a@bホフマン「なんだよ　あんた！？\n\tおや？　なんだい　その宝石は？\n@c2@"
"1":
  de: "@a@b%0%a00120 gibt Hank Hoffman Junior das Glaubenssymbol.\n@c2@"
  en: "@a@b%0%a00120 gives Hank Hoffman Junior the symbol of faith.\n@c2@"
  es: "@a@b%0%a00120 le da a Juanchito el símbolo de fe.\n@c2@"
  fr: "@a@b%0%a00120 donne à Hank Hoffman Junior le symbole de la Foi.\n@c2@"
  it: "@a@b%0%a00120 dà a John Dwayne Junior il Monile della Fiducia.\n@c2@"
  ja: "@a@b%a00140は　しんじる心を\nホフマンに手渡した。\n@c2@"
"2":
  de: "@aHank Hoffman Jr.@bHey Mann, das ist komisch ⓚⓛ wenn ich das Juwel angucke, fühl ich mich irgendwie gereinigt.\n@c2@"
  en: "@aHank Hoffman Jr.@bY'know, it's kinda funny, but just lookin' at this here jewel makes me feel cleansed somehow.\n@c2@"
  es: "@aJuanchito@b¿%H860%XSabe%YSaben%Z? Es una tontería nomás, pero me basta con mirar esta joya para sentirme algo así como purificado.\n@c2@"
  fr: "@aHank Hoffman Jr@bVous savez, c'est drôle mais, rien que d'regarder ce joyau, ça m'donne l'impression d'être, comme qui dirait, purifié.\n@c2@"
  it: "@aJohn Dwayne Jr.@bChe sensazione strana... Guardare questo gioiello mi rimette in pace con il mondo.\n@c2@"
  ja: "@a@bホフマン「ああ　なぜだろう。\n\tこの宝石を見ていると　心が\n\t洗われていくようだ。　信じる心か……。\n@c2@"
"3":
  de: "@aHank Hoffman Jr.@bWo habt Ihr das Ding gefunden?\n@c2@"
  en: "@aHank Hoffman Jr.@bSo where did y'all find this thing?\n@c2@"
  es: "@aJuanchito@bEntonces, ¿dónde %H860%Xencontró%Yencontraron%Z esto?\n@c2@"
  fr: "@aHank Hoffman Jr@bAlors, où est-ce que vous avez trouvé ce trucⓡ\n@c2@"
  it: "@aJohn Dwayne Jr.@bDove l'%H860%Xhai%Yavete%Z trovato?\n@c2@"
  ja: "@a@bホフマン「きみたちは　この宝石を\n\tどこで手に入れたんだい？\n@c2@"
"4":
  de: "@aHank Hoffman Jr.@bWollt Ihr mich veralbern? Ihr findet ein Glaubenssymbol genau an der Stelle, an der mein Partner mich verraten hat!\n@c2@"
  en: "@aHank Hoffman Jr.@bYou kiddin' me? Well, ain't that somethin'!\nYou find a symbol of faith in the place my pardner betrayed me!\n@c2@"
  es: "@aJuanchito@b¿Es una broma? ¡Vaya, que me ahorquen!\n¡%H860%XHa%YHan%Z encontrado un símbolo de fe en el lugar en el que mi socio me traicionó nomás!\n@c2@"
  fr: "@aHank Hoffman Jr@bVous vous payez ma têteⓡ Eh bien, c'est pas rienⓠ Vous avez trouvé un symbole de la Foi à l'endroit où mon partenaire m'a trahiⓠ\n@c2@"
  it: "@aJohn Dwayne Jr.@b%H860%XDici%YDite%Z sul serio? Che io sia dannato!\n%H860%XHai%YAvete%Z trovato il Monile della Fiducia proprio nel luogo in cui il mio amico mi tradì!\n@c2@"
  ja: "@a@bホフマン「なんだって　あの洞くつでか！\n\t皮肉なもんだな　オレが友に\n\t裏切られた場所に　信じる心か……。\n@c2@"
"5":
  de: "@aHank Hoffman Jr.@bHey... Moment mal... Das ist doch...\n@c2@"
  en: "@aHank Hoffman Jr.@bHey, wait a honey-fuggled minute!\n@c2@"
  es: "@aJuanchito@b¡Eh, un momento!\n@c2@"
  fr: "@aHank Hoffman Jr@bHé, attendez voir une minuteⓠ\n@c2@"
  it: "@aJohn Dwayne Jr.@bEhi, %H860%Xaspetta%Yaspettate%Z un momento...\n@c2@"
  ja: "@a@bホフマン「いや　まてよ！\n@c2@"
"6":
  de: "@aHank Hoffman Jr.@bVielleicht wär alles anders gekommen, wenn ich meinem Partner damals einfach vertraut hätte.\n@c2@"
  en: "@aHank Hoffman Jr.@bMaybe things would've been different if I'd believed in my pardner that time.\n@c2@"
  es: "@aJuanchito@bQuizá todo habría sido distinto si en aquel entonces hubiese confiado en mi socio.\n@c2@"
  fr: "@aHank Hoffman Jr@bPeut-être que les choses auraient été différentes si j'avais cru en mon partenaire, à cette époque.\n@c2@"
  it: "@aJohn Dwayne Jr.@bMolte cose sarebbero andate diversamente se quella volta avessi creduto nel mio pard.\n@c2@"
  ja: "@a@bホフマン「もしオレが　あのとき友を\n\t信じていたら　今とは　ちがった結果に\n\tなっていたかもしれない……。\n@c2@"
"7":
  de: "@aHank Hoffman Jr.@bVielleicht ist diese Höhle eine Art Prüfstein für den Glauben.\n㈡\nUnd der Schatz, den ich die ganze Zeit gesucht habe, war der Glaube daran, dass man den Menschen vertrauen kann!\n@c2@"
  en: "@aHank Hoffman Jr.@bThat cave must be some kind of faith testin' place. The treasure I was after all that time was the faith to trust in folks!\n@c2@"
  es: "@aJuanchito@bEsa cueva debe de ser una especie de lugar para probar tu fe, nomás. ¡El tesoro que estaba buscando todo ese tiempo era la fe para confiar en la gente!\n@c2@"
  fr: "@aHank Hoffman Jr@bCette caverne doit être une sorte de lieu d'mise à l'épreuve d'la foi en l'autre.\n㈡\nLe trésor que je cherchais pendant tout c'temps était la capacité d'faire confiance aux gensⓠ\n@c2@"
  it: "@aJohn Dwayne Jr.@bForse in quella grotta si mette alla prova la fiducia delle persone. Il tesoro che ho cercato per tanto tempo in realtà era la capacità di fidarmi degli altri!\n@c2@"
  ja: "@a@bホフマン「あの洞くつは　信じる心をためす\n\t試練の場だったんだ。　大切な宝とは\n\t信じ合う　人の心だったのか！\n@c2@"
"8":
  de: "@aHank Hoffman Jr.@bIch hatte ja keinen blassen Schimmer! Diesmal mach ich es besser... Zuerst mal werde ich Euch ab jetzt vertrauen!\n@c2@"
  en: "@aHank Hoffman Jr.@bI sure was clueless.\nBut now it's time to put it right...\nI'll start by trustin' you!\n@c2@"
  es: "@aJuanchito@bEstaba totalmente confundido.\nPero ya es momento de enmendarlo...\n¡Empezaré por confiar en %H860%Xusted%Yustedes%Z!\n@c2@"
  fr: "@aHank Hoffman Jr@bJ'ai été sacrément stupide. Mais l'moment est venu de remettre les choses en ordre.\nJ'vais commencer par vous croireⓠ\n@c2@"
  it: "@aJohn Dwayne Jr.@bNon avevo capito un bel niente.\nMa è arrivato il momento di mettere le cose a posto...\nInizierò col fidarmi di %H860%Xte%Yvoi%Z!\n@c2@"
  ja: "@a@bホフマン「オレが　間違っていたよ！\n\tよし　まずキミたちを信じることから\n\t始めてみよう。\n@c2@"
"9":
  de: "@aHank Hoffman Jr.@bIch würde Euch gern auf Eurer Reise begleiten. Und meine Mary Lou kommt auch mit.\n@c2@"
  en: "@aHank Hoffman Jr.@bI wanna join you folks on your journey.\nAn' my horse'll be comin' along too.\n@c2@"
  es: "@aJuanchito@bQuiero unirme a %H860%Xusted%Yustedes%Z en su viaje.\nY mi jaca también vendrá con nosotros.\n@c2@"
  fr: "@aHank Hoffman Jr@bJ'veux vous accompagner dans votre voyage.\nEt mon cheval vient aussi.\n@c2@"
  it: "@aJohn Dwayne Jr.@bHo deciso: mi unirò a %H860%Xte%Yvoi%Z.\nE anche la mia cavalla verrà con noi.\n@c2@"
  ja: "@a@bホフマン「ぜひオレを　キミたちの\n\t仲間にしてくれないかっ！？\n\tもちろん　馬車も一緒さ！\n@c2@"
"10":
  de: "@a@bHank Hoffman Junior schließt sich der Gruppe an!\n@c2@"
  en: "@a@bHank Hoffman Junior joins the party!\n@c2@"
  es: "@a@bJuanchito se une al grupo.\n@c2@"
  fr: "@a@bHank Hoffman Junior rejoint l'équipeⓠ\n@c2@"
  it: "@a@bJohn Dwayne Junior si unisce al gruppo!\n@c2@"
  ja: "@a@bホフマンが　仲間にくわわった！\n@c2@"
"11":
  de: "@aHank Hoffman Jr.@bNa dann los ⓚⓛ der Treck kann beginnen!\n@c2@"
  en: "@aHank Hoffman Jr.@bLet's giddap on outta here!\n@c2@"
  es: "@aJuanchito@b¡Al carromato y en marcha!\n@c2@"
  fr: "@aHank Hoffman Jr@bAllez, on est partisⓠ\n@c2@"
  it: "@aJohn Dwayne Jr.@bForza! Giddap!\n@c2@"
  ja: "@a@bホフマン「さあ　行こうか！\n@c2@"
"12":
  de: "@aHank Hoffman Jr.@bDas Pferd heißt Mary Lou. Sie steht gut im Futter und hält einiges aus.\n@c2@"
  en: "@aHank Hoffman Jr.@bThe horse's name is Mary Lou. She ain't no crowbait, so I'm sure you'll see her right.\n@c2@"
  es: "@aJuanchito@bEsta es mi jaca Paca. No es una jamelga, %H860%Xle%Yles%Z va a gustar.\n@c2@"
  fr: "@aHank Hoffman Jr@bMon cheval s'appelle Marylou.\nC'est pas une rosse, j'suis sûr qu'elle vous conviendra.\n@c2@"
  it: "@aJohn Dwayne Jr.@bLa mia cavalla si chiama Marilù. Non è mica un ronzino, %H860%Xsai%Ysapete%Z? Farà il suo dovere fino in fondo!\n@c2@"
  ja: "@a@bホフマン「オレの馬の　パトリシアだ。\n\tみんな　かわいがってくれよな。\n@c2@"
"13":
  de: "@aMary Lou@bWieher!\n@c2@"
  en: "@aMary Lou@bNeigh!\n@c2@"
  es: "@aPaca@b¡Iiiii!\n@c2@"
  fr: "@aMarylou@bHiiiiiiiⓠ\n@c2@"
  it: "@aMarilù@bIiiiihhh!\n@c2@"
  ja: "@a@bパトリシア「ヒヒーン！\n@c2@"
"14":
  de: "@aHank Hoffman Jr.@bHüah, altes Mädchen!\n@c2@"
  en: "@aHank Hoffman Jr.@bGiddap, girl!\n@c2@"
  es: "@aJuanchito@b¡Vamos, manita!\n@c2@"
  fr: "@aHank Hoffman Jr@bAllez, ma belleⓠ\n@c2@"
  it: "@aJohn Dwayne Jr.@bAvanti, bellezza!\n@c2@"
  ja: "@a@bホフマン「さあ　出発だ！\n@c2@"
"15":
  de: "@aHank Hoffman Sr. @bIch erkenne meinen Jungen ja gar nicht wieder. Das hab ich alles Euch zu verdanken.\n@c2@"
  en: "@aHank Hoffman Sr.@bMy boy's really done gone an' turned himself around. I got you to thank for that.\n@c2@"
  es: "@aJuancho@bM'hijo cambió mucho. Es algo por lo que %H860%Xle%Yles%Z estoy muy agradecido.\n@c2@"
  fr: "@aHank Hoffman Sr@bMon gamin a vraiment repris du poil de la bête et changé du tout au tout.\nJ'dois vous r'mercier pour ça.\n@c2@"
  it: "@aJohn Dwayne Sr.@bIl mio ragazzo è cambiato, ed è tutto merito %H860%Xtuo%Yvostro%Z.\n@c2@"
  ja: "@a@b＊「息子も　立ち直ったみたいで\n\tどうも　ありがとうございました。\n\t息子のこと　よろしくお願いします。\n@c2@"
"16":
  de: "@aHank Hoffman Sr. @bEr war nicht immer so ein Sauertopf, müsst Ihr wissen. Früher hatte der Junge Träume. Wollte bei Gotthilf Dämler in die Lehre gehen.\n@c2@"
  en: "@aHank Hoffman Sr.@bHe didn't used to be such a croaker, y'know.\nThat boy had dreams. He wanted to be an apprentice to that Conrad Ilton guy, for one.\n@c2@"
  es: "@aJuancho@bAntes no era el gruñón enojado que es ahora.\nTenía sueños. Nomás, quería hacerse aprendiz de Conrad Gilton.\n@c2@"
  fr: "@aHank Hoffman Sr@bIl était pas rabat-joie comme ça, avant, vous savez. Il avait d'grands rêves. Par exemple, il voulait devenir l'apprenti d'un type appelé Conrad Ilton.\n@c2@"
  it: "@aJohn Dwayne Sr.@bPrima non era così pessimista. Aveva grandi sogni. Ad esempio, voleva lavorare come apprendista per Jolly Etchelsior, il famoso uomo d'affari.\n@c2@"
  ja: "@a@b＊「引きこもる前の息子には\n\t夢がありました。　商人として名高い\n\tヒルタン老人に　師事することです。\n@c2@"
"17":
  de: "@aHank Hoffman Sr. @bHat das Ganze dann nach einer Weile an den Nagel gehängt, aber diesmal hält er's bestimmt durch.\n@c2@"
  en: "@aHank Hoffman Sr.@bHe give up on the idea for a while, but I sure do hope he'll be game enough to see it through this time.\n@c2@"
  es: "@aJuancho@bDurante un tiempo, pues se olvidó de ello, pero creo que esta vez está dispuesto a conseguirlo.\n@c2@"
  fr: "@aHank Hoffman Sr@bIl a abandonné cette idée pendant un moment, mais j'espère bien que cette fois-ci, il sera motivé pour y arriver.\n@c2@"
  it: "@aJohn Dwayne Sr.@bPoi abbandonò l'idea, ma spero che adesso voglia riprovarci.\n@c2@"
  ja: "@a@b＊「一度　あきらめかけた夢ですが\n\t立ち直ったからには　今度こそ\n\t夢を　かなえてもらいたいものです。\n@c2@"
"18":
  de: "@a@b*: Wenn Ihr die Wüste durchquert und Euch nach Süden wendet, kommt Ihr zu der Hafenstadt Guckshaven.\n@c2@"
  en: "@a@b*: If you cross the desert and head south, you come to the port town of Porthtrunnel.\n@c2@"
  es: "@a@b*: Si %H860%Xcruza%Ycruzan%Z el desierto y se %H860%Xdirige%Ydirigen%Z al sur %H860%Xllegará%Y llegarán%Z a la ciudad portuaria de Puertoumbrío.\n@c2@"
  fr: "@a@b*ⓢ Si vous traversez le désert et partez vers le sud, vous arriverez à la ville portuaire de Port-Carène.\n@c2@"
  it: "@a@b*: Attraversando il deserto verso sud si arriva al villaggio portuale di Cala Cantiera.\n@c2@"
  ja: "@a@b＊「この砂漠を越え　南に行くと\n\t港町　コナンベリーです。\n@c2@"
