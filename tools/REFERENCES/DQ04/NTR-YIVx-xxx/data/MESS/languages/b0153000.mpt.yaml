"0":
  de: "@a@b*: Dies ist der Himmlische Hafen. Ich habe Euch bereits erwartet, %a00090.\n@c1@"
  en: "@a@b*: This is Heaven's Haven.\nI have been waiting here for you, %a00090.\n@c1@"
  es: "@a@b*: Este es el Refugio Celestial.\nLe esperaba, %a00090.\n@c1@"
  fr: "@a@b*ⓢ Vous êtes au Havre céleste.\nJe vous attendais, %a00090.\n@c1@"
  it: "@a@b*: Questo è Porto Paradiso. Ti stavo aspettando, %a00090.\n@c1@"
  ja: "@a@b＊「ここは　希望のほこら。\n\t%a00090よ。　あなたが来るのを\n\tここで　待っていました。\n@c1@"
"1":
  de: "@a@b*: Die Welt ist in Aufruhr. Die Kräfte, die Ihr besitzt, haben etwas Bedeutsames ausgelöst.\n@c1@"
  en: "@a@b*: The world doth tremble. It seems the powers you possess have given rise to a momentous happening.\n@c1@"
  es: "@a@b*: El mundo tiembla. Parece que los poderes que %H860%Xposees%Yposeéis%Z han dado lugar a un trascendental suceso.\n@c1@"
  fr: "@a@b*ⓢ Le monde est ébranlé.\nIl semblerait que le pouvoir que vous possédez ait déclenché un événement exceptionnel.\n@c1@"
  it: "@a@b*: L'intero mondo è in fermento. I poteri di cui disponi hanno dato vita a qualcosa di sconvolgente.\n@c1@"
  ja: "@a@b＊「世界が　ふるえています。\n\tあなたたちの　その強さが\n\t世界の何かを動かしたようです。\n@c1@"
"2":
  de: "@a@b*: Ihr könnt nun keinem vorgegebenen Pfad mehr folgen. Der Pfad, dem Ihr folgt, muss Eurem Herzen entspringen.\n@c1@"
  en: "@a@b*: No path lies before you now. Henceforth, the path you take must be of your own making.\n@c1@"
  es: "@a@b*: Ahora no %H860%Xte%Yos%Z queda ningún camino por recorrer. A partir de este momento, el camino será obra completamente %H860%Xtuya%Yvuestra%Z.\n@c1@"
  fr: "@a@b*ⓢ Aucun chemin ne s'étend devant vous, désormais. La voie que vous choisirez devra donc être celle que vous ouvrirez vous-même.\n@c1@"
  it: "@a@b*: Ora non %H860%Xavrai più davanti a te%Yavrete più davanti a voi%Z un sentiero da percorrere. D'ora innanzi %H860%Xsarai tu a tracciare il tuo cammino%Ysarete voi a tracciare il vostro cammino%Z.\n@c1@"
  ja: "@a@b＊「もう　あなたたちの前に\n\t道はありません。　ここから先は\n\tあなたたちが　道をつくるのです。\n@c1@"
"3":
  de: "@a@b*: Möge die Göttin Ihre schützende Hand über Euch halten!\n@c1@"
  en: "@a@b*: May the protection of the Goddess go with you!\n@c1@"
  es: "@a@b*: ¡Que la protección de la Diosa %H860%Xte%Yos%Z acompañe!\n@c1@"
  fr: "@a@b*ⓢ Puisse la protection de la Déesse vous accompagnerⓠ\n@c1@"
  it: "@a@b*: Che la dea %H860%Xti%Yvi%Z protegga sempre!\n@c1@"
  ja: "@a@b＊「%a00090たちに\n\t神のご加護が　あらんことを！\n@c1@"
"4":
  de: "@a@b*: Soll ich Euch die Beichte abnehmen, bevor Ihr geht? Möchtet Ihr, dass ich Eure Leistungen im Abenteuertagebuch festhalte?\n@c1@"
  en: "@a@b*: Shall I take your confession before you go? Would you like me to record your works in an adventure log?\n@c1@"
  es: "@a@b*: ¿%H860%XDeseas que te oiga%YDeseáis que os oiga%Z en confesión antes de partir? ¿%H860%XDeseas%YDeseáis%Z que incluya %H860%Xtus%Yvuestros%Z logros en un registro de aventuras?\n@c1@"
  fr: "@a@b*ⓢ Voulez-vous vous confesser avant de partirⓡ\nSouhaitez-vous que je consigne votre aventure dans un journalⓡ\n@c1@"
  it: "@a@b*: %H860%XDesideri confessarti%YDesiderate confessarvi%Z prima di andare? %H860%XVuoi%YVolete%Z che registri %H860%Xla tua%Yla vostra%Z posizione nel gioco nel diario dell'avventura?\n@c1@"
  ja: "@a@b＊「ここまでの旅を\n\t冒険の書に　記録しますか？\n@c1@"
"5":
