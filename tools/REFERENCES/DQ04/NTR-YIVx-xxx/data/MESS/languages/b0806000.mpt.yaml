"0":
  de: "@a@b%0Torneko nimmt %a53100 und schaut %M100%Xsie%Y%A100%Xihn%Z%B100%Xsie%Z%C100%Xes%Z%Z sich näher an.\n@c0@"
  en: "@a@b%0Torneko takes %a02100 and examines %M100%Xthem%Yit%Z closely.\n@c0@"
  es: "@a@b%0Torneko toma %a02100 y %M100%X%A100%Xlos%Z%B100%Xlas%Z%C100%Xlas%Z%Y%A100%Xlo%Z%B100%Xla%Z%C100%Xla%Z%Z examina atentamente.\n@c0@"
  fr: "@a@bTorneko prend %a02100 et %M100%Xles %Yl'%Zexamine attentivement.\n@c0@"
  it: "@a@bBaldo prende %a02100 e %A100%Xlo%Z%B100%Xla%Z%C100%X%Z esamina attentamente.\n@c0@"
  ja: "@a@bトルネコは　%a00100を\n手にとってみさだめた。\n@c0@"
"1":
  de: "@aTorneko@bJa, das ist zwar 'ne Waffe, aber im Grunde genommen nicht viel mehr als ein Stock, wenn ich ehrlich bin.\n@c2@"
  en: "@aTorneko@bAh, 'tis a weapon, so it is, but nuttin' more than a stick, if I'm honest.\n@c2@"
  es: "@aTorneko@b¡Ah!, es un arma, sí, pero no es más que un palo, eso sí que lo puedo diecir.\n@c2@"
  fr: "@aTorneko@bOui, on peut dire que c'est une arme, mais bon, ce n'est quand même qu'un bâton.\n@c2@"
  it: "@aBaldo@bAh, un'arma. Sì, ma l'è solo un pezzo di legno. Nulla di speciale...\n@c2@"
  ja: "@a@bトルネコ「ふむ……。\n\t武器には　ちがいないですが\n\tはっきりいって　ただの棒ですね。\n@c2@"
"2":
  de: "@aTorneko@bGibt einem zwar ein Gefühl der Sicherheit, aber das war's dann auch schon.\n@c2@"
  en: "@aTorneko@bI s'pose it might give ye some peace o' mind if ye're desperate, but that's about all it's good fer.\n@c2@"
  es: "@aTorneko@bSupiongo que puede trianquilizarte un poco si estás muy desiesperado, pero no creo que pase de ahí.\n@c2@"
  fr: "@aTorneko@bÇa vous rassurera peut-être si vous êtes désespéré%A120%X%Z%B120%Xe%Z, mais vous n'irez pas bien loin avec.\n@c2@"
  it: "@aBaldo@bPole esse' utile in casi estremi, ma 'unn è uno strumento offensivo molto effihace.\n@c2@"
  ja: "@a@bトルネコ「装備していれば\n\t気休めくらいには　なるでしょう。\n@c2@"
"3":
  de: "@aTorneko@bDas war schon ein guter Handwerker, der diese primitive Waffe gefertigt hat. Hat genau das richtige Holz gewählt.\n@c2@"
  en: "@aTorneko@bⓙTwas a proper crafty craftsman that made this primitive weapon. He's made fine use o' the knot o' the wood, so he has.\n@c2@"
  es: "@aTorneko@bEl artiesano que fabricó esta arma tan primitiva era alguien muy habilidioso. Ha aproviechado bien los nudos de la madiera, sí.\n@c2@"
  fr: "@aTorneko@bC'est un bon artisan qui a fabriqué cette arme primitive. Il a fait bon usage des nœuds du bois.\n@c2@"
  it: "@aBaldo@bQuest'arma primitiva è stata realizzata da un bravo artigiano, che ha saputo fa' buon uso dei nodi del legno.\n@c2@"
  ja: "@a@bトルネコ「ふむふむ……。\n\t木のコブを加工して作った\n\t原始的な　武器ですね。\n@c2@"
"4":
  de: "@aTorneko@bDas Ding ist immerhin besser als nix, würd' ich sagen. \n@c2@"
  en: "@aTorneko@bⓙTis better than a kick in the teeth while ye can't afford nuttin' better, like.\n@c2@"
  es: "@aTorneko@bSi no ti puedes piermitir otra cosa, siempre es miejor que liarse a piatadas.\n@c2@"
  fr: "@aTorneko@bC'est pas l'arme suprême, mais je peux vous assurer que ça fait sacrément plus mal qu'un coup de poing dans les dents.\n@c2@"
  it: "@aBaldo@bMah, l'è sempre meglio d'un calcio ne' denti, ma 'unn è che abbia un grosso potenziale offensivo, eh.\n@c2@"
  ja: "@a@bトルネコ「高価な武器が\n\t買えないうちは　この武器の\n\t世話になるでしょうな。\n@c2@"
"5":
  de: "@aTorneko@bEs gibt keinen Reisenden weit und breit, der das nicht kennt. Das ist ein Kupferschwert.\n@c2@"
  en: "@aTorneko@bThere's not a traveller in the land that doesn't know what one o' these is. 'Tis a sword made o' copper.\n@c2@"
  es: "@aTorneko@bNo hay ningún viajiero que no siepa lo que es una de estas, sí. Es una espiada hecha de cobre.\n@c2@"
  fr: "@aTorneko@bTout voyageur qui se respecte sait ce que c'est.\nC'est une épée de cuivre.\n@c2@"
  it: "@aBaldo@bQualunque avventuriero con un minimo d'esperienza sa che questa è una spada di rame.\n@c2@"
  ja: "@a@bトルネコ「銅で作られた剣です。\n\t旅人が使う武器としては\n\t非常に　有名なものですよ。\n@c2@"
"6":
  de: "@aTorneko@bAber natürlich darf man von einem Kupferschwert auch keine Wunder erwarten.\n@c2@"
  en: "@aTorneko@bBut only bein' made o' copper, ye can't go expectin' miracles, like.\n@c2@"
  es: "@aTorneko@bPero claro, es de cobre, así que no le puedes piedir pieras al olmo.\n@c2@"
  fr: "@aTorneko@bComme son nom l'indique, elle n'est faite que de cuivre.\nFaut pas s'attendre à faire des miracles avec...\n@c2@"
  it: "@aBaldo@bQuest'arma 'unn è fatta con un materiale partiholarmente pregiato, quindi 'un pole fa' miraholi.\n@c2@"
  ja: "@a@bトルネコ「……とは言っても\n\t素材が　銅ですから\n\t強い攻撃力は　期待できませんね。\n@c2@"
"7":
  de: "@aTorneko@bHm... Das ist 'ne Waffe für Wagemutige. Für Leute, die nicht mit Schwertern kämpfen.\n@c2@"
  en: "@aTorneko@bHm... 'Tis a weapon fer yer more darin' fighters. The kind that don't use swords.\n@c2@"
  es: "@aTorneko@bMmm... Esta es un arma piara los guerrieros más tiemerarios. La clase de guerriero que no utiliza espiadas.\n@c2@"
  fr: "@aTorneko@bMmm... Ça, c'est une arme pour les guerriers les plus courageux, ceux qui n'utilisent pas d'épée. \n@c2@"
  it: "@aBaldo@bUhm... Quest'arma è adatta a' hombattenti più coraggiosi, huelli che 'un gli garba usa' le spade.\n@c2@"
  ja: "@a@bトルネコ「ふむ……。\n\t武闘家など　剣を装備せずに\n\t戦う人のための武器のようです。\n@c2@"
"8":
  de: "@aTorneko@bMit solch einer Waffe steht man gewöhnlichen Soldaten in nichts nach.\n@c2@"
  en: "@aTorneko@bArmed with sometin' like this, one o' those fellas'd be as powerful as a normal soldier, like.\n@c2@"
  es: "@aTorneko@bArmiado con esto, cualquiera sería tan tiemible como un soldiado, sí.\n@c2@"
  fr: "@aTorneko@bAvec une arme de ce type, un guerrier est aussi fort qu'un soldat.\n@c2@"
  it: "@aBaldo@bUn tipo armato con un arnese del genere diventa periholoso home un guerriero esperto.\n@c2@"
  ja: "@a@bトルネコ「こういう武器であれば\n\t武闘家の人も　戦士と同じように\n\tパワーアップが　望めますぞ。\n@c2@"
"9":
  de: "@aTorneko@bJa, das hier ist was ganz Besonderes.\n@c2@"
  en: "@aTorneko@bWell, this is no ordinary, run o' the mill weapon.\n@c2@"
  es: "@aTorneko@bVaya, esta no es un arma de las que uno si encuentra todos los días.\n@c2@"
  fr: "@aTorneko@bOn ne peut pas dire que c'est une arme classique...\n@c2@"
  it: "@aBaldo@bMaremma pacifica! Huesta 'unn è miha un'arma come tutte le altre!\n@c2@"
  ja: "@a@bトルネコ「ふむふむ……。\n\tこれは　ちょっと特殊な武器です。\n@c2@"
"10":
  de: "@aTorneko@bDie Sichel am Ende der Kette kann 'ne Menge Schaden anrichten.\n@c2@"
  en: "@aTorneko@bThe sickle on the end o' the chain would do a rake o' damage, so it would.\n@c2@"
  es: "@aTorneko@bEsa hoz al final de la cadiena es capaz de hacier mucho, mucho diaño, sí.\n@c2@"
  fr: "@aTorneko@bLa faucille au bout de la chaîne doit faire de sacrés dégâts, c'est sûr.\n@c2@"
  it: "@aBaldo@bLa falce posta alla fine della hatena è in grado di infligge' un bel po' di danni. Ahia, che male!\n@c2@"
  ja: "@a@bトルネコ「くさりの先の　かまを\n\tふり回して　敵に　ダメージを\n\tあたえるものです。\n@c2@"
"11":
  de: "@aTorneko@bDiese Lanze ist aus Eisen gefertigt. Die Dinger werden oft von Burgwächtern benutzt.\n@c2@"
  en: "@aTorneko@bⓙTis a spear made of iron. Like the ones you see castle guardsmen with, y'know.\n@c2@"
  es: "@aTorneko@bEs una lianza hecha de hierro. Es como las que usan los guardias del castillo, sí.\n@c2@"
  fr: "@aTorneko@bCette lance est entièrement en fer, comme celles dont sont équipés les gardes du château.\n@c2@"
  it: "@aBaldo@bUna bella lancia di ferro, proprio come quelle usate dalle guardie di palazzo.\n@c2@"
  ja: "@a@bトルネコ「鉄でできた　やりですね。\n\t城の兵士などが　このやりを\n\t好んで　よく使います。\n@c2@"
"12":
  de: "@aTorneko@bDer Schmied, der diese Klinge gefertigt hat, hat wirklich sein ganzes Herzblut da reingesteckt.\n@c2@"
  en: "@aTorneko@bThere's a smith somewhere that's put his heart an' soul into the makin' o' this fine blade.\n@c2@"
  es: "@aTorneko@bEn algún lugar, un herriero ha puesto toda su alma en la elaboriación de esta fantiástica hoja.\n@c2@"
  fr: "@aTorneko@bLe forgeron qui a fabriqué cette bien belle épée y a mis tout son cœur et toute son âme.\n@c2@"
  it: "@aBaldo@bSi vede subito che pe' fa' questa spada c'è voluta tutta l'abilità d'un bravo armaiolo.\n@c2@"
  ja: "@a@bトルネコ「ふむ……。\n\tよく　きたえた　はがねで\n\t作られた剣ですね。\n@c2@"
"13":
  de: "@aTorneko@bMit so einem Ding sieht jeder aus wie 'n alter Profi.\n@c2@"
  en: "@aTorneko@bAny feen wieldin' one o' these will look like a quare old pro, to be sure.\n@c2@"
  es: "@aTorneko@bCualquiera que blanda una de estas parecierá un vierdadero profiesional, sí.\n@c2@"
  fr: "@aTorneko@bCelui qui maniera cette lame sera aussi doué qu'un guerrier expérimenté, c'est certain.\n@c2@"
  it: "@aBaldo@bChiunque vada a giro con un'arma come huesta avrà l'aspetto d'un vero guerriero, e anche lo stesso potenziale d'attacco.\n@c2@"
  ja: "@a@bトルネコ「これを装備していれば\n\t戦士としてもベテランだぞと\n\t周囲にアピールできますな。\n@c2@"
"14":
  de: "@aTorneko@bNa, dann wollen wir mal schauen. Hmm... Das ist eine Axt, mit der man kämpfen kann.\n@c2@"
  en: "@aTorneko@bNow let me be takin' a look at this. Hmm... 'Tis an axe fer the usin' of in battle.\n@c2@"
  es: "@aTorneko@bDiéjame echar una ojieada a esto. Mmm... Es un hacha para usar en combiate.\n@c2@"
  fr: "@aTorneko@bLaissez-moi jeter un œil là-dessus.\nMmm... C'est une hache de combat.\n@c2@"
  it: "@aBaldo@bVediamo un po'... Questa l'è una splendida ascia da guerra.\n@c2@"
  ja: "@a@bトルネコ「ふむ……。\n\tこれは　戦いに使うオノですね。\n@c2@"
"15":
  de: "@aTorneko@bMan kann damit zwar kräftig draufhauen, sie ist aber auch ziemlich unhandlich. Ist nix für jedermann, jawohl.\n@c2@"
  en: "@aTorneko@bSure, 'tis grand fer attackin', but it's a right pig to handle. Not one fer everyone, this.\n@c2@"
  es: "@aTorneko@bSí, su poder ofiensivo es brutal, pero es un engorro de maniejar. No es un arma para cualquiera, sí.\n@c2@"
  fr: "@aTorneko@bElle est parfaite pour attaquer, mais alors à manier... c'est un calvaire. C'est pas le genre d'arme que tout le monde peut utiliser.\n@c2@"
  it: "@aBaldo@bCerto, huest'arma permette di infligge' molti danni, ma 'unn è molto semplice da maneggia'. 'Unn è un aggeggio pe' tutti, ecco.\n@c2@"
  ja: "@a@bトルネコ「攻撃力は強いのですが\n\tあつかいづらいのが難です。\n\t装備できる人は　限られますね。\n@c2@"
"16":
  de: "@aTorneko@bHier haben wir was ganz Geheimnisvolles.\n@c2@"
  en: "@aTorneko@bWell this is a fine example of a mystery, if ever I saw one.\n@c2@"
  es: "@aTorneko@bEsto sí que es un mistierio, el más mistierioso que he visto.\n@c2@"
  fr: "@aTorneko@bEh bien, voilà un bel exemple d'objet mystérieux.\n@c2@"
  it: "@aBaldo@bHuesta roba qui l'è un vero mistero, sehondo me.\n@c2@"
  ja: "@a@bトルネコ「……おや？　これは\n\tなにやら　神秘的なものですね。\n@c2@"
"17":
  de: "@aTorneko@bSind im Grunde genommen nur ein paar Spielkarten, die man zum Wahrsagen benutzt.\n@c2@"
  en: "@aTorneko@bⓙTis basically a deck o' cards that ye'd usually use fer fortune-tellin'.\n@c2@"
  es: "@aTorneko@bEs un mazo de cartas de las que si suelen usar para echar la buenavientura.\n@c2@"
  fr: "@aTorneko@bA priori, c'est un jeu de tarot normal qui sert à tirer les cartes.\n@c2@"
  it: "@aBaldo@bA prima vista sembrerebbe uno di huei mazzi di harte usati pe' legge' i'ffuturo.\n@c2@"
  ja: "@a@bトルネコ「ものがカードですから\n\t占いの道具として　使えるのは\n\tもちろんですが……\n@c2@"
"18":
  de: "@aTorneko@bAber das ist noch nicht alles, sie haben nämlich auch verborgene Kräfte!\n@c2@"
  en: "@aTorneko@bBut that's not the all of it.\n'Tis a fine weapon too, so it is.\n@c2@"
  es: "@aTorneko@bPero hay algo más.\nTambién es una espliéndida arma, sí.\n@c2@"
  fr: "@aTorneko@bMais ce n'est pas tout.\nC'est une bien belle arme aussi.\n@c2@"
  it: "@aBaldo@bMa 'unn è tutto! L'è anche una gran bella arma.\n@c2@"
  ja: "@a@bトルネコ「それだけに\n\tとどまらず　武器としても\n\t非常に　重宝しそうです。\n@c2@"
"19":
  de: "@aTorneko@bDoch leider kann nur Mina damit umgehen. Schließlich ist sie die Wahrsagerin.\n@c2@"
  en: "@aTorneko@bBut it's only Meena that can equip herself with it. Ya know, bein' a fortune-teller, an' all.\n@c2@"
  es: "@aTorneko@bAunque solo Meena puede equiparla. Porquie ella es adivina, claro.\n@c2@"
  fr: "@aTorneko@bMais il n'y a que Mina qui peut s'en équiper.\nBah oui, elle est diseuse de bonne aventure, après tout.\n@c2@"
  it: "@aBaldo@bMa solo Myra pole aggiungerlo al su' equipaggiamento, perché huella bella figliola l'è una hiaroveggente.\n@c2@"
  ja: "@a@bトルネコ「これを装備できるのは\n\tやはり　占い師である\n\tミネアさんだけですね。\n@c2@"
"20":
  de: "@aTorneko@bSehr viel mehr weiß ich leider auch nicht. Aber wertvoll sind diese Karten allemal.\n@c2@"
  en: "@aTorneko@bAn' I can't tell ya much more than that, I'm afraid. 'Tis worth hangin' on to, though.\n@c2@"
  es: "@aTorneko@bNo puedo diecirte mucho más, lo siento. Pero vale la piena consiervarlas.\n@c2@"
  fr: "@aTorneko@bJe suis désolé, mais je peux pas vous en dire beaucoup plus.\nCeci dit, ça vaut le coup de le garderⓠ\n@c2@"
  it: "@aBaldo@bMi spiace, ma 'un so dirti altro. Però, al posto tuo, mi terrei huest'oggettino bello stretto.\n@c2@"
  ja: "@a@bトルネコ「これ以上のことは\n\tわかりませんが　とにかく\n\tこれは貴重な品です。\n@c2@"
"21":
  de: "@aTorneko@bIch würd' sie auf keinen Fall verkaufen.\n@c2@"
  en: "@aTorneko@bI absolutely wouldn't be sellin' it if I were you.\n@c2@"
  es: "@aTorneko@bYo no las viendiería por nada del mundo.\n@c2@"
  fr: "@aTorneko@bÀ votre place, je ne le vendrais pas.\n@c2@"
  it: "@aBaldo@bUn lo venderei pe' nessuna cifra.\n@c2@"
  ja: "@a@bトルネコ「絶対に売ったりせずに\n\t大切にしてくださいよ。\n@c2@"
"22":
  de: "@aTorneko@bDer Dolch hier ist natürlich kein Vergleich zu großen Schwertern, deshalb setzt man ihn hauptsächlich für den Nahkampf ein.\n@c2@"
  en: "@aTorneko@bⓙTisn't like yer bigger blades, this. Ye use it up close an' personal, like.\n@c2@"
  es: "@aTorneko@bEsta no es priecisamente de las más grandes. Es más bien para usiarla en distancias cortas, sí.\n@c2@"
  fr: "@aTorneko@bJ'ai vu des lames plus grosses, mais ça peut servir en combat rapproché.\n@c2@"
  it: "@aBaldo@bQuesta spada l'è diversa da huelle più grandi. È molto utile nel caso di... incontri molto ravvicinati.\n@c2@"
  ja: "@a@bトルネコ「ふむふむ……。\n\t大きな剣とは違って\n\t小回りで勝負する武器ですな。\n@c2@"
"23":
  de: "@aTorneko@bAber scharf ist er allemal. Richtet mehr Schaden an, als man vermuten würd'.\n@c2@"
  en: "@aTorneko@bAn' it's sharp, too. It'll do more damage than ye might think, so it will.\n@c2@"
  es: "@aTorneko@bY está afiliada como un diemonio. Hacie más diaño del que pariece.\n@c2@"
  fr: "@aTorneko@bEt elle est bien aiguisée. Elle doit sûrement faire plus de dégâts qu'il n'y paraît.\n@c2@"
  it: "@aBaldo@bEd è anche parecchio affilata! Infligge più danni di huanto si potrebbe crede'.\n@c2@"
  ja: "@a@bトルネコ「かなりの切れ味で\n\t見た目よりも　大きな攻撃力を\n\tそなえています。\n@c2@"
"24":
  de: "@aTorneko@bHm... Für diese Lanze wurde irgendein spezielles Silber verwendet.\n@c2@"
  en: "@aTorneko@bHm... 'Tis a special kind o' silver that's been used to make this spear, so it is.\n@c2@"
  es: "@aTorneko@bMmm... Para hacier esta lanza si ha emplieado una plata espiecial.\n@c2@"
  fr: "@aTorneko@bMmm... Cette lance a été fabriquée avec un argent spécial.\n@c2@"
  it: "@aBaldo@bUhm... Mi pare che pe' forgia' huesta lancia abbiano usato un argento speciale.\n@c2@"
  ja: "@a@bトルネコ「ふむ……。\n\tこれは　特殊な銀で　こしらえた\n\tヤリですね。\n@c2@"
"25":
  de: "@aTorneko@bIst auf jeden Fall viel leichter als ein Schwert, so dass auch schwächere Leute damit kämpfen können.\n@c2@"
  en: "@aTorneko@bⓙTis a good bit lighter to bear than a sword or the like, so even weaker feens'll be right with it.\n@c2@"
  es: "@aTorneko@bEs claramiente más ligera que una espiada o similar. Muy adiecuada para los tipos más diébiles, sí.\n@c2@"
  fr: "@aTorneko@bElle est bien plus légère qu'une épée.\nMême les gringalets peuvent la porter.\n@c2@"
  it: "@aBaldo@bÈ più leggera d'una spada, huindi pole esse' usata senza problemi anche dai personaggi più debolucci.\n@c2@"
  ja: "@a@bトルネコ「剣などと　くらべると\n\t軽くできているので　ちからの\n\t弱い人でも　あつかえるでしょう。\n@c2@"
"26":
  de: "@aTorneko@bMit diesem Bogen trifft man immer ins Schwarze, selbst aus großer Entfernung.\n@c2@"
  en: "@aTorneko@bYe'll hit the mark with this bow, even from a quare way off.\n@c2@"
  es: "@aTorneko@bCon esta balliesta darás en la diana hasta en un espiejismo.\n@c2@"
  fr: "@aTorneko@bAvec cet arc, vous pourrez viser en plein dans le mille les yeux fermés.\n@c2@"
  it: "@aBaldo@bCon quest'arco farai sempre centro, anche da molto lontano!\n@c2@"
  ja: "@a@bトルネコ「ちょっと遠い場所からも\n\tバシッと命中　クロスボウですな。\n@c2@"
"27":
  de: "@aTorneko@bDas ist übrigens mein liebster Verkaufsspruch. Der zieht immer.\n@c2@"
  en: "@aTorneko@bThat's me best bit o' sales blarney, by the way. Never fails.\n@c2@"
  es: "@aTorneko@bEs la miejor friase para ganar clientes. No falla nunca.\n@c2@"
  fr: "@aTorneko@bQuand je dis ça, ça marche toujours.\nÀ tous les coups.\n@c2@"
  it: "@aBaldo@bHuesta è la mi' frase preferita, huando devo vende' un oggetto del genere. Huando la diho, i'ccliente si honvince in un sehondo!\n@c2@"
  ja: "@a@bトルネコ「ちなみに　今のは\n\tクロスボウを売るときの\n\t宣伝文句です。\n@c2@"
"28":
  de: "@aTorneko@bNa, das ist ja mal 'ne schöne Waffe! Wir Händler nennen sie Abakus der Astraea.\n@c2@"
  en: "@aTorneko@bNow here's a mighty weapon for ya!\n'Tis what we traders call an Astraea's abacus.\n@c2@"
  es: "@aTorneko@b¡Esta sí que es un arma potiente de verdad!\nEn el gremio lo llamiamos un ábaco de Astraea.\n@c2@"
  fr: "@aTorneko@bÇa, c'est une méchante armeⓠ\nEntre marchands, on l'appelle le boulier d'Astrae.\n@c2@"
  it: "@aBaldo@bQuesta sì che è un'arma potente!\nSi tratta d'un Abaco di Astrea.\n@c2@"
  ja: "@a@bトルネコ「……ふむふむ。\n\tこれは　私たち商人の仲間たちの\n\t伝説の武器！\n@c2@"
"29":
  de: "@aTorneko@bEr hilft einem dabei, in der Schlacht nicht den Überblick zu verlieren.\n@c2@"
  en: "@aTorneko@bIt helps ya get yer figures straight in battle.\nSo there's no confusion, like.\n@c2@"
  es: "@aTorneko@bTi ayuda a llevar las cuentas en el friagor de la batalla.\nAsí no ti equivocas.\n@c2@"
  fr: "@aTorneko@bSi vous l'utilisez contre un ennemi, son compte est bon. Aucune erreur possible.\n@c2@"
  it: "@aBaldo@bAiuta a fa' bene i honti durante le battaglie, hosì 'un si viene holti dalla honfusione.\n@c2@"
  ja: "@a@bトルネコ「戦っている最中にも\n\tばっちり　計算ができるという\n\t大変な優れものです。\n@c2@"
"30":
  de: "@aTorneko@bDen würd' ich schon ganz gerne selbst besitzen.\n@c2@"
  en: "@aTorneko@bI don't need to tell ya that this one's fer me now, do I?\n@c2@"
  es: "@aTorneko@bNo hace falta que ti diga que es para mí, ¿vierdad?\n@c2@"
  fr: "@aTorneko@bInutile de vous préciser que c'est une arme pour moi, heinⓡ\n@c2@"
  it: "@aBaldo@bUn c'è bisogno che ti diha che è perfetto anche pe' i hommercianti home me, no? Noi s'è sempre 'nmezzo a' numeri!\n@c2@"
  ja: "@a@bトルネコ「これは　もちろん\n\t私が　装備できます。\n@c2@"
"31":
  de: "@aTorneko@bDas Teil würd' wahrscheinlich %a00750 Goldmünze%H750%X%Yn%Z einbringen, wenn man's im Geschäft verkauft.\n@c2@"
  en: "@aTorneko@bIt'd fetch about %a00750 gold coin%H750%X%Ys%Z if ya sold it in a shop.\n@c2@"
  es: "@aTorneko@bSacarías más o menos %a00750 monieda%H750%X%Ys%Z de oro por él en una tienda.\n@c2@"
  fr: "@aTorneko@bVous pourriez en tirer %a00750 pièce%I750%X%Ys%Z d'or dans un magasin.\n@c2@"
  it: "@aBaldo@bSe vendi huest'aggeggio a un negoziante, puoi rihavarci %a00750 %H750%Xmoneta%Ymonete%Z d'oro.\n@c2@"
  ja: "@a@bトルネコ「もし店屋に売れば\n\t%a00750ゴールドに\n\tなるでしょうな。\n@c2@"
"32":
  de: "@aTorneko@bJa, hab ich's mir doch gedacht... Das ist ein Fächer. Aber er ist aus Eisen.\n@c2@"
  en: "@aTorneko@bAye, 'tis a fan, just as I thought.\nBut it's made of iron, so it is.\n@c2@"
  es: "@aTorneko@bSí, un abianico, como yo piensaba.\nPero hecho de hierro, eso sí.\n@c2@"
  fr: "@aTorneko@bJ'me disais bien que ça avait l'air d'un éventail, sauf qu'il est en fer.\n@c2@"
  it: "@aBaldo@bSì, l'è un ventaglio.\nPerò, come vedi, l'è fatto di ferro.\n@c2@"
  ja: "@a@bトルネコ「ふむふむ？\n\tこれは　鉄で作られた\n\tおうぎのようですね。\n@c2@"
"33":
  de: "@aTorneko@bHört sich nicht gerade gefährlich an, was? Tja, das stimmt schon.\n@c2@"
  en: "@aTorneko@bNow, ye're probably thinkin' that fans are fer makin' a draught, like.\nAn' mostly ye'd be right there.\n@c2@"
  es: "@aTorneko@bEstarás piensando que los abanicos están hechos para diarse aire y eso.\nY casi tiendrías razón.\n@c2@"
  fr: "@aTorneko@bPour vous, un éventail, ça sert à faire de l'air quand on a chaud. Ce qui n'est pas complètement faux, d'ailleurs.\n@c2@"
  it: "@aBaldo@bDi solito i ventagli servono pe' rinfresca' l'aria huando fa parecchio haldo, ma parecchio tanto.\n@c2@"
  ja: "@a@bトルネコ「おうぎというのは\n\t本来　風をおこすための道具。\n\tまあ　うちわみたいなものです。\n@c2@"
"34":
  de: "@aTorneko@bAber dieser Fächer hier wurde als Waffe konzipiert. Der kann so 'ne Schlacht ganz schön anheizen, statt einem Abkühlung zu verschaffen.\n@c2@"
  en: "@aTorneko@bBut this one's designed as a weapon. It'll turn up the heat in battle, not the other way 'round.\n@c2@"
  es: "@aTorneko@bPero este en particular está piensado como arma. En liugar de rieducir el friagor de la batalla, más bien lo aumienta.\n@c2@"
  fr: "@aTorneko@bSauf que celui-là, c'est plutôt le contraire.\nM'est avis que vos adversaires vont se taper une suée en voyant une arme comme ça.\n@c2@"
  it: "@aBaldo@bHuest'arma huì, invece, funziona a i'ccontrario: riscalda gli animi durante le battaglie! Ah! Ah! Ah! Bella, la battuta, eh? No? 'Un t'è garbata?\n@c2@"
  ja: "@a@bトルネコ「ですが　これは\n\t武器として作られた　おうぎなので\n\tあおぐには　不向きですね。\n@c2@"
"35":
  de: "@aTorneko@bNa, wenn das nicht eine Flüssigmetallklinge ist! Jeder Abenteurer träumt davon, eine solche Klinge zu finden.\n@c2@"
  en: "@aTorneko@bJaney Mac, if this isn't a liquid metal sword!\n'Tis every adventurer's dream to find one o' these.\n@c2@"
  es: "@aTorneko@b¡Por la priofeta, si es una espada mietalíquida!\nEncontrar una como esta es el sueño de todos los avientureros.\n@c2@"
  fr: "@aTorneko@bPar la couenne du jambon, ça m'a tout l'air d'une épée de mercureⓠ C'est le rêve de tous les aventuriers d'en avoir uneⓠ\n@c2@"
  it: "@aBaldo@bMaremma rara! Ma huesta l'è una Spada Murmur!\nTutti gli avventurieri sognano di possederne una!\n@c2@"
  ja: "@a@bトルネコ「おおおっ！！\n\tこれは　冒険者なら誰もが夢見る\n\tはぐれメタルの剣！！\n@c2@"
"36":
  de: "@aTorneko@bEin schöneres Schwert gibt es nicht. Selbst ein Trottel macht mit ihr 'ne gute Figur.\n@c2@"
  en: "@aTorneko@bⓙTis the finest sword there is.\nEven a sap should do just grand with one o' these.\n@c2@"
  es: "@aTorneko@bEs la miejor espada que existe.\nPor muy torpe que seas, con esto ti las arrieglarás de maravilla.\n@c2@"
  fr: "@aTorneko@bC'est la plus belle des épées.\nMême un nigaud ferait des merveilles avec une arme comme ça.\n@c2@"
  it: "@aBaldo@bÈ la spada più potente che esista.\nAnche il più pivello di tutti i pivelli diventa un vero guerriero se usa una di hueste bellezze.\n@c2@"
  ja: "@a@bトルネコ「ただ　強いばかりでなく\n\t割合　非力な人間でも装備できる\n\tまさに　地上最強の剣です！\n@c2@"
"37":
  de: "@aTorneko@bDabei weiß keiner, wie diese Klingen hergestellt werden. Ist alles sehr geheimnisvoll.\n@c2@"
  en: "@aTorneko@bNo one knows what goes into the makin' of 'em. It's all proper hush-hush, like.\n@c2@"
  es: "@aTorneko@bNadie sabe cuál es el método para fabricarlas. Es muy siecreto, sí.\n@c2@"
  fr: "@aTorneko@bPersonne ne sait de quoi elles sont faites.\nÇa reste un grand secret.\n@c2@"
  it: "@aBaldo@bNessuno sa di preciso come si forgi una spada del genere. L'è un segreto.\n@c2@"
  ja: "@a@bトルネコ「作り方に関しては\n\tいっさい　公開されていない\n\tなぞの多い　武器でもあります。\n@c2@"
"38":
  de: "@aTorneko@bAber es heißt, dass der Hauptbestandteil flüssiges Metall ist...\n@c2@"
  en: "@aTorneko@bBut some folk say the basic ingredient's liquid metal itself...\n@c2@"
  es: "@aTorneko@bPero dicen por ahí que el componiente básico es mietal líquido...\n@c2@"
  fr: "@aTorneko@bY'en a certains qui disent que le principal matériau est le mercure lui-même...\n@c2@"
  it: "@aBaldo@bSehondo me, la sua forza deriva dal metallo liquido con cui è realizzata.\n@c2@"
  ja: "@a@bトルネコ「じつは　材料に\n\tはぐれメタルは　使われていない\n\tという説もありますが　はたして……。\n@c2@"
"39":
  de: "@aTorneko@b%0%a00220 %D220%Xkann%Ykönnen%Z damit ausgerüstet werden.\n@c2@"
  en: "@aTorneko@b%0%a00220 can be equipped with it.\n@c2@"
  es: "@aTorneko@bPuede ser equipada por %0%a00220.\n@c2@"
  fr: "@aTorneko@b%0%a00220 %D220%Xpeut%Ypeuvent%Z s'en équiper.\n@c2@"
  it: "@aBaldo@bQuest'arma pole esse' aggiunta all'equipaggiamento di %a00220.\n@c2@"
  ja: "@a@bトルネコ「これを装備できるのは\n\t%a00220。\n@c2@"
"40":
  de: "@aTorneko@bUnd ich kann sie auch benutzen. Ist ja schließlich keine Waffe, die man nicht gebrauchen könnte, was?\n@c2@"
  en: "@aTorneko@bAnd I can use it an' all. 'Tis not a weapon ye'll be wantin' to part with.\n@c2@"
  es: "@aTorneko@bY yo la piodría utilizar. No diebes diejar escapar este arma.\n@c2@"
  fr: "@aTorneko@bMoi aussi, je sais la manier.\nÀ votre place, je ne m'en séparerais pas.\n@c2@"
  it: "@aBaldo@bSe fossi in te, 'un mi separerei da huesto gioiellino...\n@c2@"
  ja: "@a@bトルネコ「私にも　装備できますね。\n\tとにかく　この武器を\n\t手ばなすべきでは　ないですぞ。\n@c2@"
"41":
  de: "@aTorneko@bHm... Diese Waffe ist aus Eisen gefertigt, und die Spitze ist in Gift getränkt, jawohl.\n@c2@"
  en: "@aTorneko@bHm... 'Tis a weapon made of iron, and the tip's nicely laced with poison, so it is.\n@c2@"
  es: "@aTorneko@bMmm... Es un arma de hierro, y la punta está untiada de veneno, sí.\n@c2@"
  fr: "@aTorneko@bMmm... Cette arme est en fer et la pointe a été trempée dans du poison.\n@c2@"
  it: "@aBaldo@bHuesta huì l'è un'arma in ferro, ma la sua partiholarità è che la punta l'è avvelenata.\n@c2@"
  ja: "@a@bトルネコ「ふむ……。\n\t先端に　たっぷりと\n\t毒がぬられた　鉄の武器ですね。\n@c2@"
"42":
  de: "@aTorneko@bIst ganz schön praktisch. Der Gegner denkt, man ist unbewaffnet, und dann kann man einfach zustechen.\n@c2@"
  en: "@aTorneko@bWhoever ye're fightin' will think ye're unarmed, an' then ye can stab 'em when they're least expectin' it.\n@c2@"
  es: "@aTorneko@bCuando luches con alguien, pensiará que no tienes arma, y si la puedes clavar cuando menos si lo espere.\n@c2@"
  fr: "@aTorneko@bVotre adversaire pensera que vous arrivez les mains dans les poches et hop, vous lui envoyez ça alors qu'il ne s'y attend pas du tout.\n@c2@"
  it: "@aBaldo@bI'ttu' avversario penserà che 'unn hai armi hon te, e abbasserà la guardia, così potrai holpirlo huando meno se l'aspetta!\n@c2@"
  ja: "@a@bトルネコ「なにも持っていないと\n\t相手を油断させて　そのすきに\n\t敵の急所をつくことが　できます。\n@c2@"
"43":
  de: "@aTorneko@bWenn man die richtige Stelle erwischt, kann man jedes Monster mit einem Schlag niederstrecken.\n@c2@"
  en: "@aTorneko@bIf ye can hit them in just the right spot, ye'll down most any monster ye find in a single blow.\n@c2@"
  es: "@aTorneko@bSi encuentras el punto prieciso, podriás tumbar a casi cualquier monstruo de un solo golpe.\n@c2@"
  fr: "@aTorneko@bEn visant bien, vous pouvez vous débarrasser d'un monstre en un seul coup.\n@c2@"
  it: "@aBaldo@bSe li holpisci nel punto giusto, potrai fa' fuori la maggior parte de' mostri con un colpo solo!\n@c2@"
  ja: "@a@bトルネコ「こいつが　急所に決まれば\n\tほとんどの魔物は\n\tイチコロでしょう。\n@c2@"
"44":
  de: "@aTorneko@bAh, über diesen Stab lässt sich eine Menge sagen.\n@c2@"
  en: "@aTorneko@bAh, there's a fair bit ye could say about this staff, so there is.\n@c2@"
  es: "@aTorneko@b¡Ah!, si pueden decir muchias cosas sobre este báculo.\n@c2@"
  fr: "@aTorneko@bJe pourrais vous en dire un paquet sur ce bâton...\n@c2@"
  it: "@aBaldo@bAh, ci sarebbe parecchio da di' su questo bastone, ma parecchio tanto. Eh, sì!\n@c2@"
  ja: "@a@bトルネコ「ふむふむ……。\n\tこれは　おもしろい杖ですね。\n@c2@"
"45":
  de: "@aTorneko@bEr kann magische Kräfte in physische Kräfte umwandeln, jawohl.\n@c2@"
  en: "@aTorneko@bIt turns magic power into physical power, see.\n@c2@"
  es: "@aTorneko@bEs capaz de conviertir el podier mágico en energía física.\n@c2@"
  fr: "@aTorneko@bIl transforme les pouvoirs magiques en puissance physique.\n@c2@"
  it: "@aBaldo@bDiciamo che trasforma il potere magiho in potenza fisiha.\n@c2@"
  ja: "@a@bトルネコ「この杖を使えば\n\t魔力を　攻撃力に変えることが\n\tできるようです。\n@c2@"
"46":
  de: "@aTorneko@bDas ist äußerst praktisch, wenn die eigene Zauberkraft, zum Beispiel von einem Monster, ausgelöscht wurde.\n@c2@"
  en: "@aTorneko@bⓙTis a grand tool if yer magic's been sealed by a monster or suchlike.\n@c2@"
  es: "@aTorneko@bEs un instrumento pierfecto si algún monstruo ha siellado tu magia.\n@c2@"
  fr: "@aTorneko@bC'est une arme très utile si un monstre ou autre chose vous empêche d'utiliser votre magie.\n@c2@"
  it: "@aBaldo@bÈ un'arma preziosa nel caso le tu' magie siano state bloccate da un avversario.\n@c2@"
  ja: "@a@bトルネコ「魔物に　呪文を\n\t封じられたときなどに　すかさず\n\t装備すれば　非常に便利ですよ。\n@c2@"
"47":
  de: "@aTorneko@bEin Blitzstab! Da hat wirklich jeder schon was von gehört, nicht wahr?\n@c2@"
  en: "@aTorneko@bA lightning staff! Everyone's heard about these now, haven't they?\n@c2@"
  es: "@aTorneko@b¡Un báculo de luz! ¡Todo el mundo ha oído habliar de ellos!\n@c2@"
  fr: "@aTorneko@bUn bâton de foudreⓠ Je pense que tout le monde en a déjà entendu parler, pas vraiⓡ\n@c2@"
  it: "@aBaldo@bMa huesto l'è un Bastone del fulmine! 'Un c'è un solo avventuriero che 'un sogni di possede' huest'arnese.\n@c2@"
  ja: "@a@bトルネコ「おおっ！\n\tこれは　世に名高い\n\tいかずちの杖ですね。\n@c2@"
"48":
  de: "@aTorneko@bMan kann so einen im Kampf auch als Gegenstand einsetzen, statt sich mit ihm auszurüsten. Dann gibt er wirklich ein nützliches Werkzeug ab.\n@c2@"
  en: "@aTorneko@bYe can use 'em as items in battle, rather than equippin' yerself with 'em.\nThat's when they're most handy.\n@c2@"
  es: "@aTorneko@bPuedes utilizarlos como objietos en la batalla, en lugar de equiparlos.\nAsí son más priácticos, sí.\n@c2@"
  fr: "@aTorneko@bMieux vaut s'en servir comme objet lors des combats plutôt que de s'en équiper.\nC'est comme ça qu'il est le plus utile.\n@c2@"
  it: "@aBaldo@bInvece di aggiungerlo al tu' equipaggiamento, poi prova' a usarlo home oggetto 'nbattaglia. È lì che dimostra tutta la su' effihacia.\n@c2@"
  ja: "@a@bトルネコ「戦いのときに\n\t道具として使ってこそ　この武器は\n\t真のチカラを発揮するでしょう。\n@c2@"
"49":
  de: "@aTorneko@bPuh, der ist aber ganz schön schwer!\n@c2@"
  en: "@aTorneko@bJaykers, that's got some weight to it!\n@c2@"
  es: "@aTorneko@b¡Por todas las profietas, esto piesa como un muerto!\n@c2@"
  fr: "@aTorneko@bOuahⓠ On peut dire que ça pèse son poids, ce trucⓠ\n@c2@"
  it: "@aBaldo@bMaremma bilancia! Ma senti huanto pesa!\n@c2@"
  ja: "@a@bトルネコ「ぬおっ！\n\tお…重たい……。\n@c2@"
"50":
  de: "@aTorneko@bDie Verarbeitung ist sehr gut, insgesamt eine großartige Waffe, würd' ich sagen.\n@c2@"
  en: "@aTorneko@bⓙTis finely made, to be sure, and a grand weapon, I'll grant ya.\n@c2@"
  es: "@aTorneko@bSí, es una elaborada obra de artiesanía, y un arma espliéndida, lo rieconozco.\n@c2@"
  fr: "@aTorneko@bC'est de la belle ouvrage, vous pouvez me croire... et une arme redoutable.\n@c2@"
  it: "@aBaldo@bÈ un'arma di ottima fattura, e l'è anche molto effihace, te lo garantisco!\n@c2@"
  ja: "@a@bトルネコ「いや…　これは\n\t非常に見事なものです。\n\tですが……\n@c2@"
"51":
  de: "@aTorneko@bAber ziemlich schwer zu handhaben. Nur sehr große und kräftige Krieger können diesen Hammer zielsicher schwingen.\n@c2@"
  en: "@aTorneko@bBut it'd be murder to use. Only the greatest o' warriors'd get any accuracy out of it at all at all.\n@c2@"
  es: "@aTorneko@bPero es mortialmente engorrosa de utilizar. Solo el miejor de los guierreros sería capaz de usarla con algo de priecisión.\n@c2@"
  fr: "@aTorneko@bLe problème, c'est qu'il faut savoir s'en servir.\nSeuls les meilleurs guerriers peuvent le manier avec précision.\n@c2@"
  it: "@aBaldo@bPerò 'unn è affatto facile da usa'. Solo i migliori guerrieri riescono a sferra' colpi precisi con huest'arma.\n@c2@"
  ja: "@a@bトルネコ「これほど重い武器を\n\t敵に命中させるのは\n\t至難の技ですな。\n@c2@"
"52":
  de: "@aTorneko@bNa, das ist doch mal ein schönes Stück! Der reinste Augenschmaus.\n@c2@"
  en: "@aTorneko@bNow there's a corker of a blade for ye!\nI can hardly tear me eyes away from it.\n@c2@"
  es: "@aTorneko@b¡Esta sí que es una espiada feniomenal!\nNo puedo despiegar la mirada de ella.\n@c2@"
  fr: "@aTorneko@bEh bien, c'est un petit bijou que vous avez làⓠ\nJ'ai du mal à la quitter des yeux.\n@c2@"
  it: "@aBaldo@bHuesta sì che l'è una bella affettatrice!\n'Un mi riesce di toglierle l'occhi di dosso!\n@c2@"
  ja: "@a@bトルネコ「おお……。\n\tなんと美しい剣でしょうか。\n\t思わず　見とれてしまいますね。\n@c2@"
"53":
  de: "@aTorneko@bDabei ist die Klinge genauso schön wie gefährlich. Also immer gut aufpassen.\n@c2@"
  en: "@aTorneko@bBut it has as much bite with it as it does beauty, so be careful with it now.\n@c2@"
  es: "@aTorneko@bPero es tan hermosa como miortal. Así que, úsala con cuidiado.\n@c2@"
  fr: "@aTorneko@bMais elle est aussi dangereuse qu'elle est belle.\nFaites bien attention.\n@c2@"
  it: "@aBaldo@bE l'è tanto letale in battaglia huanto splendida a vedersi! Mi raccomando, fanne buon uso. \n@c2@"
  ja: "@a@bトルネコ「しかし……\n\t美しさと同じくらいの　あやしさを\n\tこの剣は　持っています。\n@c2@"
"54":
  de: "@aTorneko@bJa, das ist wirklich ein erstklassiges Schwert.\n@c2@"
  en: "@aTorneko@bAye, this is a prize sword if ever I saw one.\n@c2@"
  es: "@aTorneko@bEsta espada sí que es un vierdadero regalo.\n@c2@"
  fr: "@aTorneko@bOuh là, c'est une épée fabuleuse.\n@c2@"
  it: "@aBaldo@bOh, huesta dev'esse' una delle spade più favolose ch'io abbia mai visto...\n@c2@"
  ja: "@a@bトルネコ「ふむふむ……。\n\tこれは　すばらしい剣ですね。\n@c2@"
"55":
  de: "@aTorneko@bEs macht kurzen Prozess mit jedem Feind, aber für den Kampf gegen Drachen eignet es sich besonders gut.\n@c2@"
  en: "@aTorneko@bIt'll make short work of any foe, but it's especially hungry against dragons.\n@c2@"
  es: "@aTorneko@bEs capaz de acabar en un santiamén con cualquier eniemigo, pero sobre todo es ideal para driagones.\n@c2@"
  fr: "@aTorneko@bElle est efficace contre tous les ennemis, mais notez qu'elle fait des miracles contre les dragons.\n@c2@"
  it: "@aBaldo@bHuesta lama permette di fa' a pezzi facilmente hualsiasi nemiho, ma è partiholarmente effihace hontro i draghi.\n@c2@"
  ja: "@a@bトルネコ「どんな敵に対しても\n\tそれなりの攻撃力を\n\t発揮しますが……\n@c2@"
"56":
  de: "@aTorneko@bDeshalb heißt das gute Stück auch Drachenspalter. Damit hackt man die Biester glatt entzwei.\n@c2@"
  en: "@aTorneko@bThat's why folk be callin' it a dragonsbane, ye see. 'Tis a bane in the backside fer any dragon, so it is.\n@c2@"
  es: "@aTorneko@bPor eso la giente la llama dañadriagones... Porque hace mucho daño a los driagones, sí.\n@c2@"
  fr: "@aTorneko@bC'est pour ça qu'on l'appelle le fléau des dragons.\n@c2@"
  it: "@aBaldo@bEcco perché ha il nome di Ammazzadraghi. 'Un ci vole miha un genio per capirlo, no?\n@c2@"
  ja: "@a@bトルネコ「ドラゴン系の敵に対して\n\t特に　効果がありそうです。\n@c2@"
"57":
  de: "@aTorneko@bWenn ich es nicht besser wüsste, würd' ich sagen, dass das hier bloß netter Ohrschmuck für die Damen ist. Aber nein, es handelt sich um eine Art Waffe.\n@c2@"
  en: "@aTorneko@bIf I wasn't lookin' right, I'd say these were just a bit o' glitter fer the ladies. But they're a kind o' weapon, so they are.\n@c2@"
  es: "@aTorneko@bAsí a primiera vista, cualquiera diría que esto no es más que un adorno para las damas. Pero en riealidad es un tipo de arma, sí.\n@c2@"
  fr: "@aTorneko@bLe premier idiot venu dirait que ce sont juste des breloques pour les dames, mais ce sont des armes, je vous le garantis.\n@c2@"
  it: "@aBaldo@bUn occhio poho esperto ti direbbe che si tratta di semplici gioielli da donna... In realtà si tratta d'una vera e propria arma.\n@c2@"
  ja: "@a@bトルネコ「ふむ。　ちょっと見ると\n\tアクセサリーのようですが\n\tこれも　武器のひとつですよ。\n@c2@"
"58":
  de: "@aTorneko@bWenn man in jede Hand einen Ohrring nimmt, kann man zweimal pro Runde zuschlagen.\n@c2@"
  en: "@aTorneko@bTake one earrin' in each hand, and ye can have a stab at yer man there twice every round.\n@c2@"
  es: "@aTorneko@bSi tomas un piendiente en cada mano puedes clavarsielos a quien quieras dos vieces en la misma ronda.\n@c2@"
  fr: "@aTorneko@bPrenez une dague d'oreille dans chaque main et vous pourrez poignarder votre adversaire deux fois par tour.\n@c2@"
  it: "@aBaldo@bImpugna tutti e due l'orecchini, e potrai holpi' i'nnemiho du' volte pe' turno.\n@c2@"
  ja: "@a@bトルネコ「両手に　ひとつずつ持ち\n\t一度の攻撃で　相手に\n\t２回　ダメージをあたえられます。\n@c2@"
"59":
  de: "@aTorneko@bTrotzdem bleiben es Ohrringe. Das ist nichts für Männer, nur die Damenwelt kann damit umgehen.\n@c2@"
  en: "@aTorneko@bBut they're still earrings. No fellas can use them, only the ladies.\n@c2@"
  es: "@aTorneko@bPero aún así, son piendientes. Solo los pueden usar las damas.\n@c2@"
  fr: "@aTorneko@bMais ça reste des boucles d'oreilles...\nSeules les dames peuvent s'en servir.\n@c2@"
  it: "@aBaldo@bPerò restano pur sempre degli orecchini, e quindi possono esse' usati solo dalle donne.\n@c2@"
  ja: "@a@bトルネコ「やはり　ピアスですから\n\t女性が　装備するべきでしょう。\n@c2@"
"60":
  de: "@aTorneko@b%0%a00220 %D220%Xkann%Ykönnen%Z damit ausgerüstet werden.\n@c2@"
  en: "@aTorneko@b%0%a00220 can be equipped with them.\n@c2@"
  es: "@aTorneko@bPueden ser equipados por %0%a00220.\n@c2@"
  fr: "@aTorneko@b%0%a00220 %D220%Xpeut%Ypeuvent%Z s'en équiper.\n@c2@"
  it: "@aBaldo@bQuesti affari possono esse' aggiunti all'equipaggiamento di %a00220.\n@c2@"
  ja: "@a@bトルネコ「これを装備できるのは\n\t%a00220。\n@c2@"
"61":
  de: "@aTorneko@bWas? Ich?! Seh ich etwa so aus, als würd' ich Ohrringe tragen?!\n@c2@"
  en: "@aTorneko@bWhat? Meself now? Do I look like the kind o' feen who wears earrings now, do I?\n@c2@"
  es: "@aTorneko@b¿Cómo? ¿Yo, dices? ¿Es que tiengo cara de ser de esa clase de tipos que llieva piendientes?\n@c2@"
  fr: "@aTorneko@bQuoiⓡ Moiⓡ Est-ce que j'ai l'air d'un gars qui porte des boucles d'oreillesⓡ\n@c2@"
  it: "@aBaldo@bChi? Io?! O che tu dici?! O che ti sembro uno che indossa orecchini?!\n@c2@"
  ja: "@a@bトルネコ「わ…私ですか！？\n\t私に　ピアスが似合うわけ\n\tないじゃないですかっ！！\n@c2@"
"62":
  de: "@aTorneko@bDie würden wahrscheinlich %a00750 Goldmünze%H750%X%Yn%Z einbringen, wenn man sie im Geschäft verkauft.\n@c2@"
  en: "@aTorneko@bThey'd fetch about %a00750 gold coin%H750%X%Ys%Z if ya sold them in a shop.\n@c2@"
  es: "@aTorneko@bSacarías más o menos %a00750 monieda%H750%X%Ys%Z de oro si los viendieses en una tienda.\n@c2@"
  fr: "@aTorneko@bVous pourriez en tirer %a00750 pièce%I750%X%Ys%Z d'or dans un magasin.\n@c2@"
  it: "@aBaldo@bPuoi ottenere %a00750 %H750%Xmoneta%Ymonete%Z d'oro, se li vendi a una bottega.\n@c2@"
  ja: "@a@bトルネコ「もし店屋に売れば\n\t%a00750ゴールドに\n\tなるでしょうな。\n@c2@"
"63":
  de: "@aTorneko@bDas ist mal ein solider Stab.\n@c2@"
  en: "@aTorneko@bNow here's a sound stick.\n@c2@"
  es: "@aTorneko@bEste biáculo es bien robusto, sí.\n@c2@"
  fr: "@aTorneko@bSi c'est pas du bâton, ça...\n@c2@"
  it: "@aBaldo@bMa te guarda che bel bastoncino!\n@c2@"
  ja: "@a@bトルネコ「ふむ……。\n\tこれは　なかなかの杖ですよ。\n@c2@"
"64":
  de: "@aTorneko@bHab gehört, dass er erstaunliche Fähigkeiten hat, wenn man ihn als Gegenstand im Kampf einsetzt.\n@c2@"
  en: "@aTorneko@bI'm told it has some intriguing effects when ye use it like an item in battle.\n@c2@"
  es: "@aTorneko@bDicen que tiene efiectos sorpriendentes cuando si usa como objieto durante el combate.\n@c2@"
  fr: "@aTorneko@bJ'ai entendu dire qu'il a des effets bien spéciaux quand il est utilisé comme objet au combat.\n@c2@"
  it: "@aBaldo@bHo sentito di' che è 'ngrado di produrre effetti molto interessanti, se lo usi 'nbattaglia come oggetto.\n@c2@"
  ja: "@a@bトルネコ「戦いのときに\n\t道具として使うと　特殊な効果が\n\tありそうです。\n@c2@"
"65":
  de: "@aTorneko@bHm... Ja... Das ist... Ähm... Aaah...\n@c2@"
  en: "@aTorneko@bHm... Aye... This is...em... Aaah...\n@c2@"
  es: "@aTorneko@bMmm... Eh... Esto es... Mmm... Aaah...\n@c2@"
  fr: "@aTorneko@bMmm... Euh... C'est... Bah... Aaah...\n@c2@"
  it: "@aBaldo@bUhm... Sì... Ecco, quest'affare è... Yawn... \n@c2@"
  ja: "@a@bトルネコ「ふむふむ……。\n\tふむ……　ふむ…………\n\tぐおー　ぐおー……。\n@c2@"
"66":
  de: "@aTorneko@bHa-püh... Ha-püh... ... Hä?! Hab ich etwa geträumt?\n@c2@"
  en: "@aTorneko@bAh-phew... Ah-phew...\n...Huh!? Was I away with the fairies, was I?\n@c2@"
  es: "@aTorneko@bAh, fiuu... Ah, fiuu...\n... ¡¿Eh?! Mi había quedado traspuesto, ¿vierdad?\n@c2@"
  fr: "@aTorneko@bRon-pfff... Ron-pfff...\n... Heinⓠⓑ J'ai piqué un roupillon ou quoiⓡ\n@c2@"
  it: "@aBaldo@bRonf... Ronf...\n... Eh!? I'cche c'è? Che, m'ero appisolato, per caso?\n@c2@"
  ja: "@a@bトルネコ「ぐがー　ぐがー……。\n\t………………はっ！！\n\tえっ　私　今　寝てましたか！？\n@c2@"
"67":
  de: "@aTorneko@bWieso bin ich denn einfach so eingeschlafen? Na, egal... Diese Klinge ist wirklich sehr schön.\n@c2@"
  en: "@aTorneko@bWell I wonder what brought that on, then?\nSo anyway... This sword. Aye, 'tis very nice.\n@c2@"
  es: "@aTorneko@bMi priegunto qué mi habrá pasado...\nBueno, entonces... Sí, esta espada. ¡Ah, es muy bonita!\n@c2@"
  fr: "@aTorneko@bJe me demande bien comment ça se fait...\nÀ part ça, elle est jolie cette épée.\n@c2@"
  it: "@aBaldo@bScusami, proprio 'un so come mi sia hapitato... \nComunque, huesta spada l'è molto harina.\n@c2@"
  ja: "@a@bトルネコ「おかしいな……。\n\tとにかく　これは　なかなか\n\tよい剣ですよ。\n@c2@"
"68":
  de: "@aTorneko@bDiese Klinge hier wurde in Gift getränkt.\n@c2@"
  en: "@aTorneko@bThe blade here's doused in poison, like.\n@c2@"
  es: "@aTorneko@bLa hoja está impriegnada de veneno.\n@c2@"
  fr: "@aTorneko@bCette lame est badigeonnée de poison.\n@c2@"
  it: "@aBaldo@bHuesta lama l'è come una prigione, più o meno.\n@c2@"
  ja: "@a@bトルネコ「ふむ……。\n\t切っ先に　毒が　しこまれた\n\tナイフのようですね。\n@c2@"
"69":
  de: "@aTorneko@bWenn man seinen Gegner damit trifft, kann er sich eine Zeit lang nicht mehr bewegen.\n@c2@"
  en: "@aTorneko@bIf ye can strike yer opponent with it, it'll keep 'em from movin' fer a while, I would think.\n@c2@"
  es: "@aTorneko@bSi golpeas a tu rival con ella, no podrá movierse durante un rato, creo.\n@c2@"
  fr: "@aTorneko@bSi vous arrivez à toucher votre adversaire avec, je pense qu'il devrait se retrouver immobilisé pendant quelque temps.\n@c2@"
  it: "@aBaldo@bSe colpisci l'avversario, gl'impedisci di moversi per un po' di tempo.\n@c2@"
  ja: "@a@bトルネコ「うまく　敵に毒が回れば\n\tその敵は　きっと　身動きも\n\tできなくなるでしょうな。\n@c2@"
"70":
  de: "@aTorneko@bDas ist auf jeden Fall keine gewöhnliche Klaue.\n@c2@"
  en: "@aTorneko@bThis is no ordinary claw, to be sure.\n@c2@"
  es: "@aTorneko@bEsta no es una garra cualquiera, no lo es.\n@c2@"
  fr: "@aTorneko@bCroyez-moi si vous voulez, mais c'est pas une griffe ordinaire.\n@c2@"
  it: "@aBaldo@bMaremma uniha, huesto sì che l'è un artiglio straordinario!\n@c2@"
  ja: "@a@bトルネコ「ほう……。　これは\n\tただのツメでは　ないですぞ。\n@c2@"
"71":
  de: "@aTorneko@bSie passt sich ihrem Träger an und kann eine Menge Schaden anrichten.\n@c2@"
  en: "@aTorneko@bIt responds to the spirit of its wearer, and can do a rake o' damage, so it can.\n@c2@"
  es: "@aTorneko@bRiesponde al espíritu del que la lleva, y es capaz de causar mucho dañio, sí.\n@c2@"
  fr: "@aTorneko@bElle réagit à l'esprit de son propriétaire et peut causer de sacrés dégâts.\n@c2@"
  it: "@aBaldo@bEntra 'nsintonia con lo spirito di chi lo usa, e permette di infligge' un monte di danni.\n@c2@"
  ja: "@a@bトルネコ「使い手の気力に\n\t反応して　敵に大きなダメージを\n\tあたえることが　できるようです。\n@c2@"
"72":
  de: "@aTorneko@bNa, ist das nicht ein Anblick? Solch einen schönen Dolch sieht man nicht alle Tage.\n@c2@"
  en: "@aTorneko@bWould ya look at that? Is there anytin' quite as beautiful as that clear blade there?\n@c2@"
  es: "@aTorneko@bVaya, fíjiate en eso. ¿Qué puede ser más bionito que esta hoja transpiarente?\n@c2@"
  fr: "@aTorneko@bRegardez çaⓠ Existe-t-il quelque chose de plus beau que cette lame transparenteⓡ\n@c2@"
  it: "@aBaldo@bMa guarda che bellezza! Huesta lama trasparente l'è un vero spettaholo!\n@c2@"
  ja: "@a@bトルネコ「ふむふむ……。\n\tあざやかに　透きとおる刀身が\n\tなんとも　美しい剣ですね。\n@c2@"
"73":
  de: "@aTorneko@bDamit kann man dem Feind heftig zusetzen, jawohl. Und wenn man ihn als Gegenstand verwendet, haut er auch ganz schön rein.\n@c2@"
  en: "@aTorneko@bIt makes fer a fierce attack, so it does. An' it packs a fair punch when ye use it as an item, too.\n@c2@"
  es: "@aTorneko@bPuedes lanzar un ataque fieroz con él, sí. Y tampoco si porta mal si si utiliza como objeto.\n@c2@"
  fr: "@aTorneko@bSon attaque est sacrément puissante.\nEt même si vous vous en servez comme objet, elle fait très mal.\n@c2@"
  it: "@aBaldo@bUnn è solo un'arma molto potente, ma si rivela anche parecchio effihace se la usi home oggetto 'nbattaglia, ma parecchio tanto.\n@c2@"
  ja: "@a@bトルネコ「普通に使っても\n\t充分に　すばらしい剣ですが\n\t道具としても効果がありそうです。\n@c2@"
"74":
  de: "@aTorneko@bIch hab schon oft von diesem Wunderschwert gehört.\n@c2@"
  en: "@aTorneko@bI've heard folk talkin' about this here miracle sword.\n@c2@"
  es: "@aTorneko@bHe oído hablar mucho de esta espiada milagriosa.\n@c2@"
  fr: "@aTorneko@bJ'ai entendu des gens parler de cette épée miraculeuse.\n@c2@"
  it: "@aBaldo@bIn giro si parla parecchio di huesta Spada dei miracoli. Ma dov'è il mi' accento?! Si dice ⓕSpada de' miraholiⓖ, oh!\n@c2@"
  ja: "@a@bトルネコ「おお……。\n\tこれが　ウワサに聞く\n\tきせきのつるぎですか……。\n@c2@"
"75":
  de: "@aTorneko@bEs gibt ja einige berühmte Schwerter in dieser Welt, aber so was wie das hier sieht man nicht alle Tage.\n@c2@"
  en: "@aTorneko@bThere's a quare few famous blades in the world, but ya don't clap eyes on the likes o' this very often.\n@c2@"
  es: "@aTorneko@bCorren por el mundo unas cuantas espiadas ciélebres, pero no es tan fácil topiarse con una de ellas.\n@c2@"
  fr: "@aTorneko@bIl y a quelques épées très célèbres dans ce monde, mais on n'a pas souvent l'occasion de poser les yeux sur un bijou de ce genre.\n@c2@"
  it: "@aBaldo@bAl mondo esistono parecchie spade famose, ma 'un capita tutti i giorni di vede' uno di questi hapolavori.\n@c2@"
  ja: "@a@bトルネコ「この世の中に　名剣は\n\t数あれど　これほどの剣には\n\tめったに　お目にかかれません。\n@c2@"
"76":
  de: "@aTorneko@bJe mehr Schaden man seinem Gegner damit zufügt, desto mehr Heilung widerfährt einem, heißt es. Wirklich praktisch!\n@c2@"
  en: "@aTorneko@bIt only heals yerself as ye do damage to yer opponent, so it does. What a handy weapon!\n@c2@"
  es: "@aTorneko@bEs capaz de curiarte al tiempo que haces daño al enemigo, ese es su efiecto. ¡Qué arma más priáctica!\n@c2@"
  fr: "@aTorneko@bElle vous soigne quand vous blessez votre adversaire. C'est bien pratiqueⓠ\n@c2@"
  it: "@aBaldo@bPensa che cura le tu' ferite huando infliggi danni a i'nnemico! Maremma medicina, ce n'è pohe d'armi utili come huesta!\n@c2@"
  ja: "@a@bトルネコ「この剣は　敵にダメージを\n\tあたえるほど　自分の体力を\n\t回復してくれるのです。\n@c2@"
"77":
  de: "@aTorneko@b%0%a00220 %D220%Xkann%Ykönnen%Z damit ausgerüstet werden.\n@c2@"
  en: "@aTorneko@b%0%a00220 can be equipped with it.\n@c2@"
  es: "@aTorneko@bPuede ser equipada por %0%a00220.\n@c2@"
  fr: "@aTorneko@b%0%a00220 %D220%Xpeut%Ypeuvent%Z s'en équiper.\n@c2@"
  it: "@aBaldo@bQuest'arma pole esse' aggiunta all'equipaggiamento di %a00220.\n@c2@"
  ja: "@a@bトルネコ「これを装備できるのは\n\t%a00220。\n@c2@"
"78":
  de: "@aTorneko@bUnd ich kann das gute Stück auch verwenden.\n@c2@"
  en: "@aTorneko@bAnd it looks like this is sometin' I can equip meself with, too.\n@c2@"
  es: "@aTorneko@bY esto es algo que yo mismo lleviaría equipiado.\n@c2@"
  fr: "@aTorneko@bJ'ai l'impression que je pourrais m'en servir moi aussi.\n@c2@"
  it: "@aBaldo@bE penso che anch'io potrei usarla.\n@c2@"
  ja: "@a@bトルネコ「どうやら　私にも\n\t装備できるみたいです。\n@c2@"
"79":
  de: "@aTorneko@bNatürlich könnte man's verkaufen, aber das wär wirklich eine Schande.\n@c2@"
  en: "@aTorneko@bSure, ya might be able to sell it in a shop, but it'd be a cryin' shame, so it would.\n@c2@"
  es: "@aTorneko@bClaro que siempre lo puedes vender en una tienda, pero sería una vierdadera lástima.\n@c2@"
  fr: "@aTorneko@bC'est sûr que vous pourriez la vendre dans un magasin, mais ce serait vraiment trop bête.\n@c2@"
  it: "@aBaldo@bQualunque mercante sarebbe felice di homprarla, ma sarebbe un vero peccato se te tu la vendessi...\n@c2@"
  ja: "@a@bトルネコ「店屋でも　おそらく\n\t売れるでしょうが　売るのは\n\tちょっとばかり　おしいですね。\n@c2@"
"80":
  de: "@aTorneko@bWenn man diesen Stab im Kampf als Gegenstand benutzt, kann man die Magie seines Gegners auslöschen.\n@c2@"
  en: "@aTorneko@bⓙTis a staff that can seal away the magic of yer opponents when ye use it as an item in battle.\n@c2@"
  es: "@aTorneko@bEs un biáculo capaz de siellar la magia de tus rivales si si utiliza como objeto duriante el combate.\n@c2@"
  fr: "@aTorneko@bCe bâton permet de neutraliser la magie de vos adversaires lorsque vous l'utilisez comme objet au combat.\n@c2@"
  it: "@aBaldo@bSe usi huesto bastone home oggetto 'nbattaglia, potrai blocca' le magie de' tu' avversari.\n@c2@"
  ja: "@a@bトルネコ「ふむ……。　その名の通り\n\t道具として使えば　敵の呪文を\n\t封じることができる　杖ですぞ。\n@c2@"
"81":
  de: "@aTorneko@bAber das ist noch nicht alles.\n@c2@"
  en: "@aTorneko@bBut that's not all it does.\n@c2@"
  es: "@aTorneko@bPero hay algo más.\n@c2@"
  fr: "@aTorneko@bMais ce n'est pas tout.\n@c2@"
  it: "@aBaldo@bMa c'è dell'altro!\n@c2@"
  ja: "@a@bトルネコ「ですが　この杖は\n\tそればかりでは　ないようです。\n@c2@"
"82":
  de: "@aTorneko@bGreift man damit an, werden die eigenen magischen Kräfte wieder aufgefüllt.\n@c2@"
  en: "@aTorneko@bIf y'attack with it, I've heard it can restore yer magic power, too.\n@c2@"
  es: "@aTorneko@bSi si utiliza para atacar, dicen que es capiaz de regienerar tu propio pioder mágico.\n@c2@"
  fr: "@aTorneko@bSi vous portez une attaque avec, il paraît qu'il peut régénérer votre puissance magique.\n@c2@"
  it: "@aBaldo@bSe lo usi per attacca', rehupererai anche il tu' potere magiho.\n@c2@"
  ja: "@a@bトルネコ「装備して　敵をたたけば\n\tなんと　自分の魔力をも\n\t回復してくれることも……。\n@c2@"
"83":
  de: "@aTorneko@bJa, das ist ein ganz besonderer Stab.\n@c2@"
  en: "@aTorneko@bYerra, it's a special kind o' staff, this one.\n@c2@"
  es: "@aTorneko@bVaya, este báculo es algo espiecial.\n@c2@"
  fr: "@aTorneko@bC'est un bâton bien spécial que vous avez là.\n@c2@"
  it: "@aBaldo@bOh, sì. Questo l'è un bastone parecchio speciale, ma parecchio tanto.\n@c2@"
  ja: "@a@bトルネコ「ふむふむ……。\n\tこれは　特殊な杖ですね。\n@c2@"
"84":
  de: "@aTorneko@bWenn man ihn als Gegenstand benutzt, spuckt er heiße Magmabälle aus.\n@c2@"
  en: "@aTorneko@bIf ya use it like an item, it'll spit balls o' magma out of its one end.\n@c2@"
  es: "@aTorneko@bSi lo utilizas como objieto, escupe bolas de magma por uno de sus extremos.\n@c2@"
  fr: "@aTorneko@bSi vous vous en servez comme objet, il projettera des boules de lave par son extrémité.\n@c2@"
  it: "@aBaldo@bSe l'usi come oggetto, sputa sfere di magma dall'estremità.\n@c2@"
  ja: "@a@bトルネコ「道具として使えば\n\t杖の先から　マグマの玉が\n\t吹き出るようです。\n@c2@"
"85":
  de: "@aTorneko@b%0%a00220 %D220%Xkann%Ykönnen%Z damit ausgerüstet werden.\n@c2@"
  en: "@aTorneko@b%0%a00220 can be equipped with it.\n@c2@"
  es: "@aTorneko@bPuede ser equipado por %0%a00220.\n@c2@"
  fr: "@aTorneko@b%0%a00220 %D220%Xpeut%Ypeuvent%Z s'en équiper.\n@c2@"
  it: "@aBaldo@bPole esse' aggiunto all'equipaggiamento di %a00220.\n@c2@"
  ja: "@a@bトルネコ「これを装備できるのは\n\t%a00220。\n@c2@"
"86":
  de: "@aTorneko@bIch aber leider nicht.\n@c2@"
  en: "@aTorneko@bBut it doesn't look like I can.\n@c2@"
  es: "@aTorneko@bPero no es para mí.\n@c2@"
  fr: "@aTorneko@bQuant à moi, je crois que je suis pas à la hauteur.\n@c2@"
  it: "@aBaldo@bPer me, invece, 'un va bene.\n@c2@"
  ja: "@a@bトルネコ「どうやら　私には\n\t装備できないようです。\n@c2@"
"87":
  de: "@aTorneko@bSolch ein gutes Stück sollte man nicht verkaufen. Das könnte eh keiner bezahlen.\n@c2@"
  en: "@aTorneko@bⓙTis not an item ye'll be wantin' to sell, this.\nAnd ye couldn't get a price fer it if ye did.\n@c2@"
  es: "@aTorneko@bNo es una buena idea que ti diesprendas de este objeto. Adiemás, no consieguirías que ti hiciesen una oferta aunque lo intientases.\n@c2@"
  fr: "@aTorneko@bÀ votre place, je ne vendrais pas cette arme.\nDe toute façon, si vous vouliez le faire, personne ne serait en mesure de l'estimer.\n@c2@"
  it: "@aBaldo@bUnn è un oggetto di cui dovresti disfarti, huesto huì.\nE anche se te tu volessi venderlo, 'un riusciresti a farti fa' un'offerta seria.\n@c2@"
  ja: "@a@bトルネコ「店屋では　こいつの価値は\n\tまず　わからんでしょう。\n@c2@"
"88":
  de: "@aTorneko@bAch, du meine Güte! Mir läuft schon ein Schauer über den Rücken, wenn ich diese Waffe nur anfasse.\n@c2@"
  en: "@aTorneko@bBy the holies! Just holdin' this weapon gives me the shivers.\n@c2@"
  es: "@aTorneko@b¡Por la Diosa! ¡Con solo sostiener este arma ya mi dan escalofríos!\n@c2@"
  fr: "@aTorneko@bPar tous les saintsⓠ Rien qu'en tenant cette arme, j'ai des frissons.\n@c2@"
  it: "@aBaldo@bMaremma 'nfreddolita! Solo a tene' 'nmano quest'arma mi vengono i brividi!\n@c2@"
  ja: "@a@bトルネコ「ぬおっ！\n\tこ…これは　手にしただけで\n\t身ぶるいがしますね……。\n@c2@"
"89":
  de: "@aTorneko@bDamit kann man eine Menge Schaden anrichten.\nEs ist aber eine wahrhaft teuflische Klinge.\n@c2@"
  en: "@aTorneko@bSure, it deals out the damage, like, but it's a devil of a sword altogether, so it is.\n@c2@"
  es: "@aTorneko@bSí, cumple su función como uno espiera que haga, pero es que es un vierdadero diemonio de espiada, sí.\n@c2@"
  fr: "@aTorneko@bC'est sûr qu'elle fait de gros dégâts, mais elle est vraiment maléfique...\n@c2@"
  it: "@aBaldo@bOvviamente infligge un monte di danni. Sì, huesta l'è proprio una spada indiavolata!\n@c2@"
  ja: "@a@bトルネコ「どうやら　強い攻撃力は\n\tありそうですが　はたして……\n@c2@"
"90":
  de: "@aTorneko@bJa, das hier ist ein sehr wunderlicher Stab.\n@c2@"
  en: "@aTorneko@bAye, well, this is a queer stick, to be sure.\n@c2@"
  es: "@aTorneko@bBueno, este báculo sí que es extraño.\n@c2@"
  fr: "@aTorneko@bOui, c'est un bâton assez bizarre.\n@c2@"
  it: "@aBaldo@bEh, sì. Huesto l'è proprio un bastoncino utile.\n@c2@"
  ja: "@a@bトルネコ「むむむっ？\n\tこれは　また　奇妙な杖ですね。\n@c2@"
"91":
  de: "@aTorneko@bDamit kann man seine Kumpels wieder zum Leben erwecken, wenn man ihn als Gegenstand verwendet.\n@c2@"
  en: "@aTorneko@bIt can bring yer lads back to life if ye use it as an item in battle.\n@c2@"
  es: "@aTorneko@bEs capaz de devolvier la vida a tus compañieros si si usa como objieto en combate.\n@c2@"
  fr: "@aTorneko@bIl peut ressusciter vos coéquipiers si vous vous en servez comme objet au combat.\n@c2@"
  it: "@aBaldo@bSe lo usi come oggetto 'nbattaglia, pole riporta' 'nvita i tu' hompagni defunti.\n@c2@"
  ja: "@a@bトルネコ「戦いの最中に　道具として\n\t使えば　味方も回復できそうですぞ。\n@c2@"
"92":
  de: "@aTorneko@b?!? Ist das etwa das legendäre Schwert, das ich gesucht hab?! Das muss ich sehen!\n@c2@"
  en: "@aTorneko@bIsⓚⓛ Is this the legendary sword I've been lookin' for!? Get away outta that!\n@c2@"
  es: "@aTorneko@bEsta... ¡¿Esta es la espada legiendaria que he estado buscando?! ¡Por la Diosa bajada de los cielos!\n@c2@"
  fr: "@aTorneko@bC'est... C'est l'épée légendaire que je cherchaisⓠⓑ C'est pas possibleⓠⓑ\n@c2@"
  it: "@aBaldo@bMa... Ma questa l'è la mitiha spada che ho cercato per mari e per monti! Maremma maremmina!\n@c2@"
  ja: "@a@bトルネコ「こ…これぞ\n\t私が　さがし求めていた\n\t伝説の剣……？？？\n@c2@"
"93":
  de: "@aTorneko@bDas ich das noch erleben darf... Aber ehrlich gesagt bin ich ein wenig enttäuscht.\n@c2@"
  en: "@aTorneko@bY'know, ya nearly had me goin' there, but I've gotta say, I'm a bit disappointed.\n@c2@"
  es: "@aTorneko@bSabes, estiaba muy entusiasmado, pero diebo diecir que ahora estoy más bien diecepcionado.\n@c2@"
  fr: "@aTorneko@bJ'ai failli me faire avoir, mais je dois admettre que je suis un peu déçu.\n@c2@"
  it: "@aBaldo@bCerto, a guardarla meglio, sono un po' deluso...\n@c2@"
  ja: "@a@bトルネコ「そう思いたいのですが\n\t正直に言って　これでは\n\tちょっと　ガッカリですね。\n@c2@"
"94":
  de: "@aTorneko@bEs ist natürlich kein schlechtes Schwert. Ich hab nur irgendwie mehr erwartet.\n@c2@"
  en: "@aTorneko@bIt's not a bad sword, I'll grant ya.\nIt's just that I was expectin' sometin' else.\n@c2@"
  es: "@aTorneko@bNo es una mala espiada, eso seguro.\nEs solo que mi espieraba algo distinto.\n@c2@"
  fr: "@aTorneko@bC'est pas une mauvaise épée.\nC'est juste que je m'attendais à autre chose.\n@c2@"
  it: "@aBaldo@bNon che sia una brutta spada, per amor della dea, tutt'altro! È solo che m'aspettavo qualcosa di diverso, tutto huì.\n@c2@"
  ja: "@a@bトルネコ「まあ　悪い剣では\n\tないんですが　なんとも\n\t期待はずれというか……\n@c2@"
"95":
  de: "@aTorneko@bEs versteht sich von selbst, dass nur %O960%X%A090%Xein großer Held%Z%B090%Xeine große Heldin%Z wie Ihr%Y%A090%Xder große Held%Z%B090%Xdie große Heldin%Z, %a00090,%Z es als Waffe benutzen kann.\n@c2@"
  en: "@aTorneko@bIt goes without sayin' I s'pose, that only %O960%Xa great %A090%Xhero%Z%B090%Xheroine%Z such as yerself%Ythe great %A090%Xhero%Z%B090%Xheroine%Z, %a00090,%Z can use it as a weapon.\n@c2@"
  es: "@aTorneko@bNi que diecir tiene que solo %O960%X%A090%Xun gran héroe%Z%B090%Xuna gran heroína%Z como tú%Y%A090%Xel gran héroe%Z%B090%Xla gran heroína%Z, %a00090,%Z puede utilizarla como arma.\n@c2@"
  fr: "@aTorneko@bJ'enfonce peut-être des portes ouvertes, mais %O960%X%A090%Xseul un grand héros%Z%B090%Xseule une grande héroïne%Z comme vous%Y%A090%Xseul le grand héros%Z%B090%Xseule la grande héroïne%Z %a00090%Z peut s'en servir comme d'une arme.\n@c2@"
  it: "@aBaldo@bOvviamente, solo %O960%X%A090%Xun grande eroe%Z%B090%Xuna leggendaria eroina%Z come te%Y%A090%Xil grande eroe%Z%B090%Xla leggendaria eroina%Z, %a00090,%Z pole usarla home arma.\n@c2@"
  ja: "@a@bトルネコ「これを装備できるのは\n\tもちろん　勇者である\n\t%a00090さんだけです。\n@c2@"
"96":
  de: "@aTorneko@bIch weiß, ich sagte eben, dass ich enttäuscht wär, aber verkaufen würd' ich es trotzdem nicht. Das wär eine Schande.\n@c2@"
  en: "@aTorneko@bAn' I know I said I was disappointed before, but ye can't go sellin' this now. D'ye hear me?\n@c2@"
  es: "@aTorneko@bY aunque haya dicho que estaba diecepcionado, no puedes vendier esto. ¿Mi oyes?\n@c2@"
  fr: "@aTorneko@bEt je sais que je vous ai dit que j'étais déçu, mais il ne faut surtout pas la vendre. Comprisⓡ\n@c2@"
  it: "@aBaldo@bE sappi che non poi vende' questa spada. Mi sono spiegato?\n@c2@"
  ja: "@a@bトルネコ「いや　期待はずれなんて\n\t言っちゃいましたけど\n\t絶対　売ったりしちゃダメですよ。\n@c2@"
"97":
  de: "@aTorneko@bNa, da brat mir doch einer 'nen Storch! Das Schwert, das ich all die Jahre gesucht hab!\n@c2@"
  en: "@aTorneko@bJapers and begorrah! It's the real article!\nThe sword I've been lookin' for all these years.\n@c2@"
  es: "@aTorneko@b¡Por la Diosa y la profieta al mismo tiempo! ¡Es la de verdad!\nLa espada que he pasiado años buscando.\n@c2@"
  fr: "@aTorneko@bJ'y crois pasⓠ Vous l'avez trouvéeⓠ\nL'épée légendaire que j'ai cherchée toutes ces années.\n@c2@"
  it: "@aBaldo@bMaremma affilata! È proprio lei!\nHuesta è la spada che ho cercato per anni!\n@c2@"
  ja: "@a@bトルネコ「うおおーーっ！\n\tこ…これぞ　まさしく　私が\n\tさがし求めていた　伝説の剣！！\n@c2@"
"98":
  de: "@aTorneko@bOh, wie wunderbar es ist. Es glänzt wie alles Gold der Welt, nicht wahr?\n@c2@"
  en: "@aTorneko@bWould ye just look at it!? Gleamin' brighter than a leprechaun's gold, so it is!\n@c2@"
  es: "@aTorneko@b¡Mírala! ¡Más brillante que el más brillante de los minaretes, sí!\n@c2@"
  fr: "@aTorneko@bVous l'avez regardéeⓠⓑ Elle brille encore plus que l'or.\n@c2@"
  it: "@aBaldo@bGuarda che splendore! Brilla più dell'oro che si trova 'nfondo all'arcobaleno! Che meraviglia...\n@c2@"
  ja: "@a@bトルネコ「この　かがやき……。\n\tいやはや　こいつは　まったく\n\tとんでもない剣ですよ。\n@c2@"
"99":
  de: "@aTorneko@bEs versteht sich von selbst, dass nur %O960%X%A090%Xein großer Held%Z%B090%Xeine große Heldin%Z wie Ihr%Y%A090%Xder große Held%Z%B090%Xdie große Heldin%Z, %a00090,%Z es als Waffe benutzen kann.\n@c2@"
  en: "@aTorneko@bIt goes without sayin' I s'pose, that only %O960%Xa great %A090%Xhero%Z%B090%Xheroine%Z such as yerself%Ythe great %A090%Xhero%Z%B090%Xheroine%Z, %a00090,%Z can use it as a weapon.\n@c2@"
  es: "@aTorneko@bNi que diecir tiene que solo %O960%X%A090%Xun gran héroe%Z%B090%Xuna gran heroína%Z como tú%Y%A090%Xel gran héroe%Z%B090%Xla gran heroína%Z, %a00090,%Z puede utilizarla como arma.\n@c2@"
  fr: "@aTorneko@bJ'enfonce peut-être des portes ouvertes, mais %O960%X%A090%Xseul un grand héros%Z%B090%Xseule une grande héroïne%Z comme vous%Y%A090%Xseul le grand héros%Z%B090%Xseule la grande héroïne%Z %a00090%Z peut s'en servir comme d'une arme.\n@c2@"
  it: "@aBaldo@bMi pare huasi superfluo di' che solo %O960%X%A090%Xun grande eroe%Z%B090%Xuna leggendaria eroina%Z come te%Y%A090%Xil grande eroe%Z%B090%Xla leggendaria eroina%Z, %a00090,%Z pole utilizza' quest'arma.\n@c2@"
  ja: "@a@bトルネコ「これを装備できるのは\n\tもちろん　勇者である\n\t%a00090さんだけです！\n@c2@"
"100":
  de: "@aTorneko@bUnd es wär ein großer Fehler, es zu verkaufen. Solch eine Kostbarkeit muss man behalten.\n@c2@"
  en: "@aTorneko@bAn' ye can't be thinkin' o' sellin' it, neither.\nYe've gotta look after it, so ye have.\n@c2@"
  es: "@aTorneko@bY no pienses ni por un momiento en vendierla.\nLo que tienes que hacier es cuidar de ella.\n@c2@"
  fr: "@aTorneko@bEt ne pensez même pas à la vendre.\nVous avez même intérêt à y faire très attention.\n@c2@"
  it: "@aBaldo@bE 'un pensa' nemmeno di venderla, eh!\nUn tesoro come huesto va custodito gelosamente!\n@c2@"
  ja: "@a@bトルネコ「言うまでもありませんが\n\tこの剣は　絶対に手ばなさず\n\tずっと　大切にしてください！\n@c2@"
"101":
  de: "@aTorneko@bWenn auf der Welt wieder alles in Ordnung ist und das Schwert nicht mehr benötigt wird, bin ich gerne bereit, es Euch abzukaufen.\n@c2@"
  en: "@aTorneko@bWhen the world's put to rights, an' ye've no use fer it any more, I'll gladly take it off yer hands.\n@c2@"
  es: "@aTorneko@bCuando si hayan arreglado los probliemas del mundo y ya no tiengas que emplearla más, ti la compraré gustosamente.\n@c2@"
  fr: "@aTorneko@bQuand tout sera rentré dans l'ordre et qu'elle ne vous servira plus à rien, je serai ravi de vous en débarrasser.\n@c2@"
  it: "@aBaldo@bHuando il mondo sarà di nuovo tranquillo, e 'unn avrai più bisogno di usarla, sarò felice di comprarla io.\n@c2@"
  ja: "@a@bトルネコ「もし　世界が平和になって\n\tこの剣を売ろうと思ったら\n\tそのときは　私に売ってくださいよ！\n@c2@"
"102":
  de: "@aTorneko@bHm... Hmm... Hma ha ha ha ha!\n@c2@"
  en: "@aTorneko@bHm... Hmm... Hma ha ha ha hah!\n@c2@"
  es: "@aTorneko@bMmm... Mmm... ¡Ja, ja, ja, ja, ja!\n@c2@"
  fr: "@aTorneko@bMmm... Mmm... Ha ha ha haⓠ\n@c2@"
  it: "@aBaldo@bUhm... Uhmm... Wah! Ah! Ah! Ah! Ah!\n@c2@"
  ja: "@a@bトルネコ「むふっ。\n\tむふふふふっ。\n\tどわーっはっはっは！\n@c2@"
"103":
  de: "@aTorneko@bTut mir leid. Es ist dieser Stab. Er bringt mich irgendwie zum Lachen.\n@c2@"
  en: "@aTorneko@bSorry. It's this staff.\nIt just makes me want to laugh.\n@c2@"
  es: "@aTorneko@bLo siento. Es el biáculo.\nMi hace partir de la risa.\n@c2@"
  fr: "@aTorneko@bDésolé. C'est ce bâton.\nJe sais pas pourquoi, mais il me donne envie de rire.\n@c2@"
  it: "@aBaldo@bScusami, ma l'è tutta holpa di huesto bastone!\nMi fa veni' parecchia voglia di ride', ma parecchia tanta!\n@c2@"
  ja: "@a@bトルネコ「……いや　すみません。\n\tこの杖を手にしたら　なにやら\n\t急に　楽しくなってきまして。\n@c2@"
"104":
  de: "@aTorneko@bAh, dieses alte Stück!\n@c2@"
  en: "@aTorneko@bAh, this old tool!\n@c2@"
  es: "@aTorneko@b¡Ah, este viejo triasto!\n@c2@"
  fr: "@aTorneko@bAh, cette bonne vieille épéeⓠ\n@c2@"
  it: "@aBaldo@bToh! Ma guarda huì!\nL'è una bellezza!\n@c2@"
  ja: "@a@bトルネコ「おお　この剣は！\n@c2@"
"105":
  de: "@aTorneko@bVerzeihung. Ich hab eine kleine Schwäche für diese Art von Schwertern.\n@c2@"
  en: "@aTorneko@bSorry. I've a bit of a taste fer this kind o' sword, see.\n@c2@"
  es: "@aTorneko@bLo siento. Tiengo un cierto cariño a este tipo de espiada.\n@c2@"
  fr: "@aTorneko@bDésolé, mais j'ai toujours eu un faible pour ce genre d'épée.\n@c2@"
  it: "@aBaldo@bScusa, ma io c'ho un vero debole per le spade di huesto tipo, sai?\n@c2@"
  ja: "@a@bトルネコ「いえ　私は個人的に\n\tこの剣に　ちょっと\n\t思い入れがありまして……。\n@c2@"
"106":
  de: "@aTorneko@bKeine Sorge. Diese Klinge ist eine nützliche Waffe und ein guter Freund.\n@c2@"
  en: "@aTorneko@bIt won't let ye down. 'Tis a handy weapon an' a grand friend.\n@c2@"
  es: "@aTorneko@bNunca ti deciepcionará. Es un armia robusta y una amiga fiel.\n@c2@"
  fr: "@aTorneko@bElle ne vous laissera pas tomber.\nC'est une bonne épée et une amie fidèle.\n@c2@"
  it: "@aBaldo@bHuesta 'un ti deluderà mai!\nL'è un'arma potente e un'ottima amiha.\n@c2@"
  ja: "@a@bトルネコ「そういう剣ですから\n\tもちろん　これは\n\t相当に　いい剣ですぞ。\n@c2@"
"107":
  de: "@aTorneko@bGroße Göttin! Eine Falkenklinge! Die muss ja ein Vermögen wert sein!\n@c2@"
  en: "@aTorneko@bJapers! A falcon blade! Have y'any idea what a treasure this is, have ye?\n@c2@"
  es: "@aTorneko@b¡Por todas las profietas! ¡Una falcoespiada! ¿Tienes idea del priecioso tesoro que llievas en las manos?\n@c2@"
  fr: "@aTorneko@bNom d'une biqueⓠ Une lame du Fauconⓠ\nVous vous rendez pas compte du trésor que c'estⓠ\n@c2@"
  it: "@aBaldo@bMaremma alata! Una lama Falcon! Hai idea di che razza di tesoro tu abbia con te?!\n@c2@"
  ja: "@a@bトルネコ「おおっ！　はやぶさの剣！\n\tこいつは　名剣ですぞ！！\n@c2@"
"108":
  de: "@aTorneko@bMit dieser Waffe könnte ein guter Schwertkämpfer zweimal pro Runde zuschlagen.\n@c2@"
  en: "@aTorneko@bArmed with this gem, a master o' swords could strike twice in every turn.\n@c2@"
  es: "@aTorneko@bArmado con ella, un maestro de espiadas puede hacer dos atiaques en cada turno.\n@c2@"
  fr: "@aTorneko@bAvec ce bijou, une fine lame peut frapper deux fois à chaque tour.\n@c2@"
  it: "@aBaldo@bHuando impugnano huest'arma, gli spadaccini più abili possono holpi' du' volte per turno.\n@c2@"
  ja: "@a@bトルネコ「剣の達人が　この剣を\n\t使えば　一度の攻撃で\n\t２回　ダメージをあたえられます。\n@c2@"
"109":
  de: "@aTorneko@bWelch ein prachtvoller Speer! Solide gebaut und ein wahrer Augenschmaus.\n@c2@"
  en: "@aTorneko@bWhat a corker of a lance this is!\nA fine construction and a shine that'd light up a black eye.\n@c2@"
  es: "@aTorneko@b¡Esta lanza es magnífica!\nUna obra de artiesanía dielicada, y un brillo capaz de iluminar hasta un día nublado.\n@c2@"
  fr: "@aTorneko@bC'est une bien belle lanceⓠ\nElle est de très belle facture et son éclat est éblouissant.\n@c2@"
  it: "@aBaldo@bChe lancia meravigliosa!\nL'è di splendida fattura, e brilla tanto da fa' male all'occhi.\n@c2@"
  ja: "@a@bトルネコ「ふむ……。\n\t細工といい　かがやきといい\n\tなんと美しいヤリでしょうか……。\n@c2@"
"110":
  de: "@aTorneko@bUnd er ist mit Gift überzogen.\n@c2@"
  en: "@aTorneko@bAn' it's covered in poison, too.\n@c2@"
  es: "@aTorneko@bY además está impriegnada de veneno.\n@c2@"
  fr: "@aTorneko@bEt elle est badigeonnée de poison.\n@c2@"
  it: "@aBaldo@bOh, è anche avvelenata...\n@c2@"
  ja: "@a@bトルネコ「しかも　この武器には\n\t毒が　しこまれているようですぞ。\n@c2@"
"111":
  de: "@aTorneko@bWenn man seinen Gegner damit an der richtigen Stelle trifft, kann man ihn mit nur einem Stoß ins Jenseits befördern.\n@c2@"
  en: "@aTorneko@bHit yer opponent in the right place with it, and ye'll leave 'em in flitters with just a single blow.\n@c2@"
  es: "@aTorneko@bSi golpeas a tu eniemigo con ella en el lugar adecuado, ti bastará con un solo golpe para dejiarlo hecho papilla.\n@c2@"
  fr: "@aTorneko@bSi vous faites mouche, vous achèverez votre adversaire en un seul coup.\n@c2@"
  it: "@aBaldo@bSe centri l'avversario nel punto giusto, lo manderai a guarda' i fiori dal di sotto con un colpo solo.\n@c2@"
  ja: "@a@bトルネコ「この毒で　うまく\n\t相手の急所をつけば\n\tほとんどの魔物は　イチコロです。\n@c2@"
"112":
  de: "@aTorneko@bEine Gring... Eine Gringham-Peitsche! Ah, das ist wahrlich eine gefährliche Waffe.\n@c2@"
  en: "@aTorneko@bA Gringⓚⓛ A Gringham whip! Ah, this is a fierce menacin' weapon, to be sure.\n@c2@"
  es: "@aTorneko@bUn... ¡Un liátigo de Gringham! Sí, es un arma amienazante y terrible.\n@c2@"
  fr: "@aTorneko@bUn fou... Un fouet de Gringhamⓠ\nC'est une arme redoutable, ça.\n@c2@"
  it: "@aBaldo@bUna Frusta Gringham!\nChe arma spettaholare! Proprio hosì: spettaholare!\n@c2@"
  ja: "@a@bトルネコ「こっ…これは……\n\tこいつは　おそろしく\n\t完成された武器ですね！\n@c2@"
"113":
  de: "@aTorneko@bSie richtet ja so schon genug Schaden an und dann kann sie auch noch mehrere Feinde auf einmal auslöschen.\n@c2@"
  en: "@aTorneko@bAs if it didn't do enough damage to start with, it'll hit a whole group of enemies at once, y'know.\n@c2@"
  es: "@aTorneko@bY no es solo el daño que es capiaz de hacer, es que además puede golpear a tiodo un grupo de enemigos al mismo tiempo.\n@c2@"
  fr: "@aTorneko@bComme s'il ne faisait pas déjà assez de dégâts sur une seule personne, il peut frapper tout un groupe d'ennemis en un seul coup.\n@c2@"
  it: "@aBaldo@bInnanzitutto infligge un mucchio di danni, e poi ti permette di holpi' un intero gruppo di nemici in una volta sola.\n@c2@"
  ja: "@a@bトルネコ「ただ　攻撃力が\n\t強いばかりでなく　一度に複数の\n\t魔物に　攻撃ができそうです。\n@c2@"
"114":
  de: "@aTorneko@bAuf solch eine Waffe muss man gut aufpassen.\n@c2@"
  en: "@aTorneko@bFair play, ye've a fine weapon here, so ye have. Be sure to look after it, like.\n@c2@"
  es: "@aTorneko@bNo hay duda, es un arma estupienda. Cuídala bien.\n@c2@"
  fr: "@aTorneko@bEn tout cas, c'est une bonne arme.\nPrenez-en soin.\n@c2@"
  it: "@aBaldo@bL'è proprio una gran bell'arma.\nMi raccomando, tienila di honto!\n@c2@"
  ja: "@a@bトルネコ「いや　いい武器を\n\t手に入れましたな。　こいつは\n\t大切に　すべきでしょう。\n@c2@"
"115":
  de: "@aTorneko@b%0%a00220 %D220%Xkann%Ykönnen%Z damit ausgerüstet werden.\n@c2@"
  en: "@aTorneko@b%0%a00220 can be equipped with it.\n@c2@"
  es: "@aTorneko@bPuede ser equipado por %0%a00220.\n@c2@"
  fr: "@aTorneko@b%0%a00220 %D220%Xpeut%Ypeuvent%Z s'en équiper.\n@c2@"
  it: "@aBaldo@bQuest'oggetto pole esse' aggiunto all'equipaggiamento di %a00220.\n@c2@"
  ja: "@a@bトルネコ「これを装備できるのは\n\t%a00220。\n@c2@"
"116":
  de: "@aTorneko@bAber ich kann sie leider nicht benutzen.\n@c2@"
  en: "@aTorneko@bBut it doesn't look like I can.\n@c2@"
  es: "@aTorneko@bPero creo que yo no podría.\n@c2@"
  fr: "@aTorneko@bMoi, par contre, ça ne semble pas possible.\n@c2@"
  it: "@aBaldo@bMa mi fa l'idea che per me 'un vada tanto bene...\n@c2@"
  ja: "@a@bトルネコ「どうやら　私には\n\t装備できないようです。\n@c2@"
"117":
  de: "@aTorneko@bNatürlich könnte man sie verkaufen, aber das wär wirklich eine Schande.\n@c2@"
  en: "@aTorneko@bSure, ye could sell it if ye wanted, but it'd be an awful shame, so it would.\n@c2@"
  es: "@aTorneko@bSí, claro que puedes vendierlo, pero sería una lástima desprienderse de él.\n@c2@"
  fr: "@aTorneko@bBien sûr, vous pourriez le vendre si vous le vouliez, mais ce serait vraiment dommage, si vous voulez mon avis.\n@c2@"
  it: "@aBaldo@bCerto che la poi vende', se ti fa piacere.\nPerò, se fossi in te, me la terrei ben stretta.\n@c2@"
  ja: "@a@bトルネコ「店屋でも　高値で\n\t買い取ってくれるでしょうが\n\t売るのは　おしいですな。\n@c2@"
"118":
  de: "@aTorneko@bPuh... aahh! Uff! Leicht wie eine Feder... Ha ha ha!\n@c2@"
  en: "@aTorneko@bHuuu...urgh! Phew! Light as a feather, so it is.\nHa ha ha!\n@c2@"
  es: "@aTorneko@b¡Ahhhh...! ¡Uooo! ¡Uf! Es ligiero como una pluma, sí.\n¡Ja, ja, ja!\n@c2@"
  fr: "@aTorneko@bHuuu... Aaaaahⓠ Pfiouⓠ C'est léger comme une plume.\nHa ha haⓠ\n@c2@"
  it: "@aBaldo@bMaremma piuma!\nL'è leggero, eh?\nAh! Ah! Ah!\n@c2@"
  ja: "@a@bトルネコ「ぬわっちょ！！\n\tひょえー　こいつは　とんでもない\n\t重さの武器ですね。\n@c2@"
"119":
  de: "@aTorneko@bMit solch einer Waffe kann man jedem Monster, das einem in die Quere kommt, ganz schön was auf die Mütze geben.\n@c2@"
  en: "@aTorneko@bWith a weapon like this, ye'll do a fair bit of damage to any monster that happens to be about.\n@c2@"
  es: "@aTorneko@bCon un arma como esta puedes ciebarte con cualquier monstruo que ti crucies, sí.\n@c2@"
  fr: "@aTorneko@bAvec un truc comme ça, vous risquez de faire des ravages chez les monstres.\n@c2@"
  it: "@aBaldo@bCon un'arma del genere, farai vede' i sorci verdi a qualunque mostro ti hapiti a tiro.\n@c2@"
  ja: "@a@bトルネコ「こいつの破壊力なら\n\t近くに現れた　すべての魔物に\n\tダメージをあたえられそうです。\n@c2@"
"120":
  de: "@aTorneko@bAber schwer ist dieser Flegel. Den kann nicht jedermann tragen.\n@c2@"
  en: "@aTorneko@bBut it's as heavy as a lead balloon.\n'Tis not everyone that'll be able to lift it.\n@c2@"
  es: "@aTorneko@bPero piesa como una bola de plomo.\nNo todo el mundo está prieparado para leviantarlo.\n@c2@"
  fr: "@aTorneko@bLe seul problème, c'est qu'il est aussi lourd qu'un bloc de plomb et que tout le monde n'est pas capable de s'en servir.\n@c2@"
  it: "@aBaldo@bPerò pesa huanto una montagna.\nUn affare come huesto pole esse' usato solo da pohi guerrieri.\n@c2@"
  ja: "@a@bトルネコ「しかし……　やはり\n\tあまりに　重いですな。\n\t使える人間は　限られます。\n@c2@"
"121":
  de: "@aTorneko@b%0%a00220 %D220%Xkann%Ykönnen%Z damit ausgerüstet werden.\n@c2@"
  en: "@aTorneko@b%0%a00220 can be equipped with it.\n@c2@"
  es: "@aTorneko@bPuede ser equipado por %0%a00220.\n@c2@"
  fr: "@aTorneko@b%0%a00220 %D220%Xpeut%Ypeuvent%Z s'en équiper.\n@c2@"
  it: "@aBaldo@bPole esse' aggiunto all'equipaggiamento di %a00220.\n@c2@"
  ja: "@a@bトルネコ「これを装備できるのは\n\t%a00220。\n@c2@"
"122":
  de: "@aTorneko@bOh, und ich kann mich auch damit ausrüsten.\n@c2@"
  en: "@aTorneko@bAnd it looks like this is sometin' I can equip meself with, too.\n@c2@"
  es: "@aTorneko@bY esto es algo que yo mismo podría llievar equipiado.\n@c2@"
  fr: "@aTorneko@bEt apparemment, moi aussi, je peux m'en servir.\n@c2@"
  it: "@aBaldo@bE credo che anch'io potrei usarlo.\n@c2@"
  ja: "@a@bトルネコ「どうやら　私にも\n\t装備できるみたいです。\n@c2@"
"123":
  de: "@aTorneko@bNatürlich würd' man dafür einen guten Preis erzielen, aber ich würd' die Waffe nicht verkaufen.\n@c2@"
  en: "@aTorneko@bSure, ye could sell it if ye wanted, but it'd be an awful shame, so it would.\n@c2@"
  es: "@aTorneko@bSí, claro que puedes vendierlo, pero siería una lástima desprienderse de él.\n@c2@"
  fr: "@aTorneko@bC'est sûr que vous pourriez le vendre, mais ce serait vraiment dommage, si vous voulez mon avis.\n@c2@"
  it: "@aBaldo@bSe lo vendessi, sarebbe un vero delitto. Però poi farlo, se voi.\n@c2@"
  ja: "@a@bトルネコ「店屋でも　高値で\n\t買い取ってくれるでしょうが\n\t売るのは　おしいですな。\n@c2@"
"124":
  de: "@aTorneko@bHm... Das ist was für risikofreudige Kämpfer, nicht ganz ungefährlich.\n@c2@"
  en: "@aTorneko@bHm... 'Tis a proper chancer, this one.\nYe'd be takin' a quare risk in usin' it.\n@c2@"
  es: "@aTorneko@bMmm... Es un arma muy arriesgada, sí.\nUtiliziarla es un riesgo.\n@c2@"
  fr: "@aTorneko@bMmm... C'est une arme un peu traître.\nVous prendrez des risques si vous l'utilisez.\n@c2@"
  it: "@aBaldo@bUhm, huest'arma huì l'è una brutta bestia.\nSi horre hualche rischio a usarla.\n@c2@"
  ja: "@a@bトルネコ「ふむ……。\n\t見るからに　あやしさに満ちた\n\tツメですね。\n@c2@"
"125":
  de: "@aTorneko@bAber auf jeden Fall eine gute Waffe. Ist das Risiko wert.\n@c2@"
  en: "@aTorneko@bBut it's a decent weapon, to be sure.\nEven takin' the risk into account, like.\n@c2@"
  es: "@aTorneko@bPero es un arma bastiante decente también.\nIncluso tieniendo en cuenta los riesgos.\n@c2@"
  fr: "@aTorneko@bMais je peux vous dire que ça reste une bonne arme, malgré le risque.\n@c2@"
  it: "@aBaldo@bPerò l'è molto effihace.\nConsiderando i rischi e i vantaggi, direi che è un ottimo strumento d'attacco.\n@c2@"
  ja: "@a@bトルネコ「しかし　見た目の\n\tあやしさとは　うらはらに\n\tこの武器は　かなり使えそうです。\n@c2@"
"126":
  de: "@aTorneko@bAch, du liebes Bisschen! Ich kann's kaum glauben!\n@c2@"
  en: "@aTorneko@bJaney Mac! I never thought I'd see the day!\n@c2@"
  es: "@aTorneko@b¡Alabada sea la Diosa! ¡Pensié que nunca podría vier algo así!\n@c2@"
  fr: "@aTorneko@bNom d'une pipeⓠ\nJe ne pensais pas voir cette épée un jourⓠ\n@c2@"
  it: "@aBaldo@bMaremma bonina!\n'Un credevo che avrei mai visto una roba del genere!\n@c2@"
  ja: "@a@bトルネコ「ぬっ…ぬおおおっ！！\n\tこ…こいつは　すごい！！\n@c2@"
"127":
  de: "@aTorneko@bAllein bei ihrem Anblick krieg ich weiche Knie.\n@c2@"
  en: "@aTorneko@bJust castin' me eyes over this makes me feel like me soul's bein' swallowed up, so it does.\n@c2@"
  es: "@aTorneko@bCon solo mirarla siento como si si mi desgajara el alma.\n@c2@"
  fr: "@aTorneko@bRien que de poser les yeux dessus, j'ai l'impression que mon âme est déjà en train de se faire aspirer.\n@c2@"
  it: "@aBaldo@bSolo a guardarla, mi sembra che qualcuno mi stia strappando via l'anima!\n@c2@"
  ja: "@a@bトルネコ「まるで　たましいを\n\t吸い込まれそうなほど\n\tするどい　かがやきです！\n@c2@"
"128":
  de: "@aTorneko@bDamit muss man aber vorsichtig sein. Es heißt, dass diese Klinge die Leute verrückt macht.\n@c2@"
  en: "@aTorneko@bI'd be wary o' this one.\nIt makes folk crazy, so it does.\n@c2@"
  es: "@aTorneko@bSé prudiente con ella:\nhace que las persionas si vuelvan locas.\n@c2@"
  fr: "@aTorneko@bFaites bien attention. Elle rend les gens fous.\n@c2@"
  it: "@aBaldo@bFai attenzione.\nQuest'affare huì fa usci' la gente fori di senno!\n@c2@"
  ja: "@a@bトルネコ「しかも　この　あやしさ……。\n\t常人では　持つだけで　正気を\n\tたもっては　いられないでしょう。\n@c2@"
"129":
  de: "@aTorneko@bIch verwette mein Leben darauf, dass kein Mensch mit diesem Teufelsschwert umgehen kann.\n@c2@"
  en: "@aTorneko@bI'd bet me life that no human could handle such a beast of a sword.\n@c2@"
  es: "@aTorneko@bMi apuesto el cuello a que ningún humano es capaz de maniejar una espada tan brutial.\n@c2@"
  fr: "@aTorneko@bJe suis prêt à parier qu'aucun humain ne peut manier une épée aussi cruelle.\n@c2@"
  it: "@aBaldo@bScommetto la mi' mano destra che nessun essere umano potrebbe mai usa' una spada bestiale home huesta.\n@c2@"
  ja: "@a@bトルネコ「私たち　人間では\n\tこの剣を　装備することは\n\tできないでしょうな……。\n@c2@"
"130":
  de: "@aTorneko@bJa, das ist zweifelsohne eine Teufelsklinge. Sieht man nicht alle Tage.\n@c2@"
  en: "@aTorneko@bAye, 'tis one of a kind, to be sure.\nYe won't find another like it.\n@c2@"
  es: "@aTorneko@bEs una pieza única, no cabie duda.\nNo hay otra igual.\n@c2@"
  fr: "@aTorneko@bEt sur le plan de la cruauté, je peux vous dire qu'elle est sans égale.\n@c2@"
  it: "@aBaldo@bSi tratta di un'arma davvero uniha.\n'Unne troverai un'altra uguale.\n@c2@"
  ja: "@a@bトルネコ「しかも　この剣は\n\tおそらく　二度と\n\t手に　入らないでしょう。\n@c2@"
"131":
  de: "@aTorneko@bSo was muss man behalten. Nur ein Dummkopf würd' diese Kostbarkeit verkaufen.\n@c2@"
  en: "@aTorneko@bYou look after it now.\nOnly a proper eejit would sell this.\n@c2@"
  es: "@aTorneko@bCuídala bien.\nHabría que sier un imbiécil redomado para vendierla.\n@c2@"
  fr: "@aTorneko@bGardez-la précieusement.\nIl n'y a qu'un crétin qui la vendrait.\n@c2@"
  it: "@aBaldo@bTienila di honto, mi raccomando!\nSolo un bischero la venderebbe!\n@c2@"
  ja: "@a@bトルネコ「とにかく　売ったりせずに\n\t大切にすべきですな。\n@c2@"
"132":
  de: "@aTorneko@bDas ist nichts Besonderes, ganz normale Kleidung halt.\n@c2@"
  en: "@aTorneko@bThere's nuttin' special about these.\nJust yer bog standard gear.\n@c2@"
  es: "@aTorneko@bBah, no tiene nada de particular.\nEs un equipamiento estándar.\n@c2@"
  fr: "@aTorneko@bCes vêtements n'ont rien de spécial.\nC'est une tenue de tous les jours.\n@c2@"
  it: "@aBaldo@bOh, questa roba 'unn è nulla di speciale.\nSono abiti normalissimi.\n@c2@"
  ja: "@a@bトルネコ「ふむ……。　これは\n\tただの　布の服みたいですね。\n@c2@"
"133":
  de: "@aTorneko@bIst natürlich besser, als nackt rumzulaufen, aber viel Schutz bietet das Teil nicht gerade.\n@c2@"
  en: "@aTorneko@bI s'pose it beats bein' in the nip, but they won't do much fer yer defence.\n@c2@"
  es: "@aTorneko@bSupongo que es miejor que ir en cueros, pero en cuanto a defiensa, no tiene diemasiado efecto.\n@c2@"
  fr: "@aTorneko@bC'est toujours plus décent que de ne rien porter du tout, mais côté protection, ça ne change pas grand-chose.\n@c2@"
  it: "@aBaldo@bCerto, sempre meglio che anda' a'ggiro nudi come vermi, ma 'unn è ch'offrano molta protezione.\n@c2@"
  ja: "@a@bトルネコ「はだかで　いるよりは\n\tマシですが　たいした防御力は\n\t期待できません。\n@c2@"
"134":
  de: "@aTorneko@bHm... Das ist gute, solide Kleidung.\n@c2@"
  en: "@aTorneko@bHm... 'Tis some good, strong gear, this.\n@c2@"
  es: "@aTorneko@bMmm... Esto sí qui es robusto y de buena calidad.\n@c2@"
  fr: "@aTorneko@bMmm... Ce sont de bons vêtements solides...\n@c2@"
  it: "@aBaldo@bUhm... Bello, resistente.\n@c2@"
  ja: "@a@bトルネコ「ふむ……。\n\tこの服は　なかなか丈夫な布で\n\tできてるみたいですよ。\n@c2@"
"135":
  de: "@aTorneko@bSie wird nicht schnell reißen, aber zum Kämpfen ist sie dennoch nicht geeignet.\n@c2@"
  en: "@aTorneko@bIt won't tear in a hurry, but ye wouldn't say it's fightin' garb, like.\n@c2@"
  es: "@aTorneko@bBastante riesistente, pero tampoco lo llamaría yo material de combiate.\n@c2@"
  fr: "@aTorneko@bIls ne céderont pas facilement, mais ce n'est pas non plus une tenue de combat.\n@c2@"
  it: "@aBaldo@bQuesta roba 'un si strappa tanto facilmente, ma di certo 'unn è un capo d'abbigliamento adatto alle battaglie.\n@c2@"
  ja: "@a@bトルネコ「ちょっとやそっとでは\n\tやぶれそうに　ないですが\n\t戦い向きとは　言えませんね。\n@c2@"
"136":
  de: "@aTorneko@bJa, dieser Harnisch wurde aus Tierhaut gefertigt.\n@c2@"
  en: "@aTorneko@bAye, this armour's made from animal hide, to be sure.\n@c2@"
  es: "@aTorneko@bSí, es una armadiura hecha de piel de animal.\n@c2@"
  fr: "@aTorneko@bOui, cette armure est en peau.\n@c2@"
  it: "@aBaldo@bOh, ma certo.\nHuesta è un'armatura realizzata con pelli d'animali.\n@c2@"
  ja: "@a@bトルネコ「ふむ……。\n\tその名の通り　動物の皮で\n\t作られた　よろいです。\n@c2@"
"137":
  de: "@aTorneko@bKann ich nicht viel zu sagen, ist so was wie 'ne Rüstung, gut für die Verteidigung jedenfalls.\n@c2@"
  en: "@aTorneko@bThere's not much I can tell ye. It's armour, like. It'll jack up yer defence, an' that's that.\n@c2@"
  es: "@aTorneko@bNo hay mucho más que diecir. Es más o menos una armiadura. Aumentiará tu defiensa, eso es tiodo.\n@c2@"
  fr: "@aTorneko@bQu'est-ce que je peux vous direⓡ\nC'est une armure qui améliorera votre défense.\nVoilà, c'est tout.\n@c2@"
  it: "@aBaldo@bNon c'è molto altro da dire. È una corazza che aumenta le tu' hapacità difensive.\nTutto huì.\n@c2@"
  ja: "@a@bトルネコ「さすが　よろいだけあって\n\t服よりは　だいぶ防御力が\n\t高そうです。\n@c2@"
"138":
  de: "@aTorneko@bHm... Diese Art von Rüstung wurde aus sehr feinen Eisenringen gefertigt.\n@c2@"
  en: "@aTorneko@bHm... 'Tis a kind of armour made from fine loops o' wire.\n@c2@"
  es: "@aTorneko@bMmm... Este tipo de armiadura está hecha de anillos metiálicos.\n@c2@"
  fr: "@aTorneko@bMmm... C'est une sorte d'armure fabriquée avec des anneaux tout fins.\n@c2@"
  it: "@aBaldo@bAllora, huesta l'è un'armatura realizzata con dei robusti anelli di metallo.\n@c2@"
  ja: "@a@bトルネコ「ふむ……。\n\t細いくさりを　編んで作った\n\tよろいの一種みたいですね。\n@c2@"
"139":
  de: "@aTorneko@bHübsch anzusehen und obendrein auch noch leicht. Man kann sich gut darin bewegen, und der Schutz kommt auch nicht zu kurz.\n@c2@"
  en: "@aTorneko@bNice an' light, and easy to move about in.\nAn' it'll do a fair bit fer yer defence, too.\n@c2@"
  es: "@aTorneko@bResistiente, ligiera y móvil.\nY una buena contribución a tu defiensa, sí.\n@c2@"
  fr: "@aTorneko@bC'est un équipement léger et souple.\nEt il renforcera votre défense.\n@c2@"
  it: "@aBaldo@bL'è leggera, e 'unn impedisce i movimenti.\nInoltre, aumenta di molto le tu' hapacità di difesa.\n@c2@"
  ja: "@a@bトルネコ「軽くて動きやすく\n\tしかも　見た目よりも\n\t防御力は　ありそうです。\n@c2@"
"140":
  de: "@aTorneko@bHm... Diese Rüstung ist aus gutem, solidem Eisen gemacht.\n@c2@"
  en: "@aTorneko@bHm... This armour's made o' good, sturdy iron, so it is.\n@c2@"
  es: "@aTorneko@bMmm... Esta armadiura está hecha de hierro, robusto y sólido.\n@c2@"
  fr: "@aTorneko@bMmm... Cette armure a été fabriquée avec un fer de qualité.\n@c2@"
  it: "@aBaldo@bHuesta horazza l'è realizzata con ferro parecchio resistente, ma parecchio tanto.\n@c2@"
  ja: "@a@bトルネコ「ふむふむ……。\n\t強くてがんじょうな　鉄でできた\n\tよろいですね。\n@c2@"
"141":
  de: "@aTorneko@bSie bietet hervorragenden Schutz gegen jeden direkten Angriff des Gegners.\n@c2@"
  en: "@aTorneko@bIt'll do a fair job o' defendin' y'against a direct hit from yer enemy.\n@c2@"
  es: "@aTorneko@bTi protiegerá bien contra un impacto directo del eniemigo.\n@c2@"
  fr: "@aTorneko@bC'est le genre d'armure qui vous protège bien contre les coups directs de vos adversaires.\n@c2@"
  it: "@aBaldo@bL'è molto effihace nel ripara' da' holpi diretti de' nemici.\n@c2@"
  ja: "@a@bトルネコ「敵の直接攻撃には\n\tある程度の　防御力を\n\t発揮してくれると思いますよ。\n@c2@"
"142":
  de: "@aTorneko@bTrotzdem besitzt sie keine magischen Fähigkeiten. Gegen Magie kann sie nichts ausrichten.\n@c2@"
  en: "@aTorneko@bBut it has no mystical powers at all at all.\nIt won't do nuttin' against magic attacks.\n@c2@"
  es: "@aTorneko@bPero no tiene ningún podier místico.\nEs inútil contra los atiaques mágicos.\n@c2@"
  fr: "@aTorneko@bLe seul hic, c'est qu'elle n'a aucun pouvoir magique...\nElle ne vous servira à rien contre les attaques magiques.\n@c2@"
  it: "@aBaldo@bPerò 'unn è dotata di poteri particolari, huindi 'unn offre protezione dall'attacchi magici.\n@c2@"
  ja: "@a@bトルネコ「ただ　魔法などを\n\t防ぐような　聖なるチカラは\n\tこのよろいには　なさそうです。\n@c2@"
"143":
  de: "@aTorneko@bAh, eine Schürze aus Eisen. Sieht aus wie etwas, das Frauen in der Küche tragen.\n@c2@"
  en: "@aTorneko@bAh, an apron made of iron, I see.\nLooks like sometin' ya might wear in the kitchen.\n@c2@"
  es: "@aTorneko@b¡Ah!, un dielantal de hierro, ya veo.\nTiene aspecto de sientar muy bien en la cocina.\n@c2@"
  fr: "@aTorneko@bAh, un tablier de fer.\nVous comptez vous mettre à la cuisineⓡ\nNon, je plaisante.\n@c2@"
  it: "@aBaldo@bMa te guarda!\nUn grembiule fatto di ferro. O che, c'hai paura di farti male 'ncucina?\n@c2@"
  ja: "@a@bトルネコ「ふむ。　こいつは\n\t鉄でできた　まえかけ……\n\tエプロンみたいなもんです。\n@c2@"
"144":
  de: "@aTorneko@bAber jeder gute Handelsreisende kennt den Wert einer solchen Schürze.\n@c2@"
  en: "@aTorneko@bEvery travellin' salesman worth his salt knows the value o' one o' these, so he does.\n@c2@"
  es: "@aTorneko@bCualquier viajero que si priecie conoce el valor de este objeto.\n@c2@"
  fr: "@aTorneko@bTout marchand itinérant digne de ce nom sait ce que ça vaut.\n@c2@"
  it: "@aBaldo@bQualunque avventuriero con un po' di sale 'nzucca sa bene huanto sia utile un aggeggio del genere.\n@c2@"
  ja: "@a@bトルネコ「旅をしながら　ものを売る\n\t商人なら　これを　持っていれば\n\tまあ　一人前ってところですね。\n@c2@"
"145":
  de: "@aTorneko@bJa, ich kann so was auch gut gebrauchen.\n@c2@"
  en: "@aTorneko@bAye, 'tis the kind o' thing meself can equip with.\n@c2@"
  es: "@aTorneko@bSí, yo mismo podría equipar uno de estos.\n@c2@"
  fr: "@aTorneko@bC'est le genre d'équipement dont je peux moi-même me servir.\n@c2@"
  it: "@aBaldo@bE mi sa che anch'io potrei aggiungere quest'affare al mi' equipaggiamento.\n@c2@"
  ja: "@a@bトルネコ「もちろん　私には\n\t装備できます。\n@c2@"
"146":
  de: "@aTorneko@bDas Teil würd' wahrscheinlich %a00750 Goldmünze%H750%X%Yn%Z einbringen, wenn man's im Geschäft verkauft.\n@c2@"
  en: "@aTorneko@bIt'd fetch about %a00750 gold coin%H750%X%Ys%Z if ya sold it in a shop.\n@c2@"
  es: "@aTorneko@bSacarías más o menos %a00750 monieda%H750%X%Ys%Z de oro si lo viendieses en una tienda.\n@c2@"
  fr: "@aTorneko@bVous pourriez en tirer %a00750 pièce%I750%X%Ys%Z d'or dans un magasin.\n@c2@"
  it: "@aBaldo@bA venderlo a una bottega, ci rihaveresti' %a00750 %H750%Xmoneta%Ymonete%Z d'oro.\n@c2@"
  ja: "@a@bトルネコ「もし店屋に売れば\n\t%a00750ゴールドに\n\tなるでしょうな。\n@c2@"
"147":
  de: "@aTorneko@bJa, diese Rüstung ist aus solidem Stahl geschmiedet.\n@c2@"
  en: "@aTorneko@bAye, this armour's been forged from fine steel.\n@c2@"
  es: "@aTorneko@bEs una armadiura forjada con aciero de calidad.\n@c2@"
  fr: "@aTorneko@bCette armure a été forgée dans un acier de très bonne qualité.\n@c2@"
  it: "@aBaldo@bMa quant'è bella huest'armatura in acciaio, eh?\n@c2@"
  ja: "@a@bトルネコ「ふむ……。\n\tよく　きたえた　はがねで\n\t作られた　よろいですね。\n@c2@"
"148":
  de: "@aTorneko@bIst natürlich ein guter Schutz im Kampf, aber zum Tragen ist sie ganz schön schwer.\n@c2@"
  en: "@aTorneko@bSure, it's handy fer defence, so it is, but it's fierce heavy with it.\n@c2@"
  es: "@aTorneko@bEs cierto que proporciona una buena defiensa, pero piesa como un muerto.\n@c2@"
  fr: "@aTorneko@bOn peut dire qu'elle est efficace niveau défense, mais elle est vraiment lourde.\n@c2@"
  it: "@aBaldo@bOffre molta protezione, ma l'è parecchio pesante.\nMa parecchio tanto!\n@c2@"
  ja: "@a@bトルネコ「防御力は\n\tかなりのものですが　ちょっと\n\t重量が　ありますね。\n@c2@"
"149":
  de: "@aTorneko@bWelch eine elegante Robe! Und aus hochwertiger Seide ist sie auch noch.\n@c2@"
  en: "@aTorneko@bWhat an elegant robe! Woven from the highest quality silk, by the looks of it.\n@c2@"
  es: "@aTorneko@b¡Qué viestido más elegante! Y de seda de la mejor calidiad, a juzgar por su aspiecto.\n@c2@"
  fr: "@aTorneko@bQuelle robe éléganteⓠ\nÀ froid comme ça, je dirais qu'elle a été tissée avec la soie la plus fine qui soit.\n@c2@"
  it: "@aBaldo@bChe vestito elegante!\nSi vede che è tutto in pura seta!\n@c2@"
  ja: "@a@bトルネコ「ふむふむ……。\n\t上質のきぬを　織り上げた\n\tかわいらしい　ローブですね。\n@c2@"
"150":
  de: "@aTorneko@bSie ist zwar leicht, aber doch gut verarbeitet und reißfest. Und natürlich absolut bezaubernd. Damit wird sich jede Dame wie eine Prinzessin fühlen.\n@c2@"
  en: "@aTorneko@bIt's lightweight, but good, tough gear.\nAnd gorgeous, so it is.\nAye, it'd look grand on a lady.\n@c2@"
  es: "@aTorneko@bEs ligiero, pero resistente.\nY priecioso, sí.\nPierfecto para una dama.\n@c2@"
  fr: "@aTorneko@bCertes, elle est très légère, mais elle est aussi résistante et solide. Et très belle, bien sûr.\nElle ferait très bien sur une dame.\n@c2@"
  it: "@aBaldo@bÈ leggero, ma molto resistente. Ed è anche di gran classe!\nStarebbe proprio bene addosso a una bella figliola...\n@c2@"
  ja: "@a@bトルネコ「丈夫で強いわりに\n\t軽いですし　かわいいものですから\n\t女性に装備してもらいたいですな。\n@c2@"
"151":
  de: "@aTorneko@b%0%a00220 %D220%Xkann%Ykönnen%Z damit ausgerüstet werden.\n@c2@"
  en: "@aTorneko@b%0%a00220 can be equipped with it.\n@c2@"
  es: "@aTorneko@bPuede ser equipado por %0%a00220.\n@c2@"
  fr: "@aTorneko@b%0%a00220 %D220%Xpeut%Ypeuvent%Z la porter.\n@c2@"
  it: "@aBaldo@bPole esse' aggiunto all'equipaggiamento di %a00220.\n@c2@"
  ja: "@a@bトルネコ「これを装備できるのは\n\t%a00220。\n@c2@"
"152":
  de: "@aTorneko@bNein... Ich doch nicht. So was sollte ein Mann nicht tragen.\n@c2@"
  en: "@aTorneko@bNo, I'd... I'd better not. 'Tis not the kind o' gear a fella should be wearin'.\n@c2@"
  es: "@aTorneko@bNo, yo... Miejor no. No es una indumientaria muy adecuada para un tipo como yo.\n@c2@"
  fr: "@aTorneko@bNon... il... il ne vaut mieux pas que je l'essaie.\nCe n'est pas le genre de vêtement qu'un homme doit porter.\n@c2@"
  it: "@aBaldo@bNo, a me 'un starebbe molto bene.\nIo 'un so' tipo da mettermi huesta roba...\n@c2@"
  ja: "@a@bトルネコ「いやぁ～～。\n\tさすがに　私が　これを着るのは\n\tやめておきますよ。\n@c2@"
"153":
  de: "@aTorneko@bDas Teil würd' wahrscheinlich %a00750 Goldmünze%H750%X%Yn%Z einbringen, wenn man's im Geschäft verkauft.\n@c2@"
  en: "@aTorneko@bIt'd fetch about %a00750 gold coin%H750%X%Ys%Z if ya sold it in a shop.\n@c2@"
  es: "@aTorneko@bSacarías más o menos %a00750 monieda%H750%X%Ys%Z de oro si lo viendieses en una tienda.\n@c2@"
  fr: "@aTorneko@bVous pourriez en tirer %a00750 pièce%I750%X%Ys%Z d'or dans un magasin.\n@c2@"
  it: "@aBaldo@bSe lo vendi a un negoziante, potresti rihavarci %a00750 %H750%Xmoneta%Ymonete%Z d'oro.\n@c2@"
  ja: "@a@bトルネコ「もし店屋に売れば\n\t%a00750ゴールドに\n\tなるでしょうな。\n@c2@"
"154":
  de: "@aTorneko@bHuch, was würd' meine Mama dazu sagen?! So was Aufregendes hab ich selten gesehen.\n@c2@"
  en: "@aTorneko@bJaney Mac, what would me mam say!? I never saw anytin' so titillatin'.\n@c2@"
  es: "@aTorneko@b¡Diosa mía, si lo viese mi madre! Es lo más sexy que he visto nunca.\n@c2@"
  fr: "@aTorneko@bOh là là là, que dirait ma maman si elle voyait çaⓠⓑ\nJe peux pas dire que ça me laisse de marbre.\n@c2@"
  it: "@aBaldo@bMaremma danzante!\nMammina, perdonami, ma huesta roba huì mi fa schizza' l'occhi fori dall'orbite!\n@c2@"
  ja: "@a@bトルネコ「んほっ！　これは\n\tまた　色っぽい衣装ですね。\n@c2@"
"155":
  de: "@aTorneko@bNatürlich ist solch ein Kostüm im Kampf absolut nutzlos, aber die Leute zahlen trotzdem einen guten Preis dafür.\n@c2@"
  en: "@aTorneko@bIt won't do much to protect y'in an attack, but folk pay a fair price fer gear like this.\n@c2@"
  es: "@aTorneko@bNo ti siervirá de mucho para protiegerte de un ataque, pero ti pagarían un buen precio por algo así.\n@c2@"
  fr: "@aTorneko@bÇa ne sert pas à grand-chose en cas d'attaque, mais y'a des gens qui seraient prêts à payer cher pour un costume dans ce genre.\n@c2@"
  it: "@aBaldo@bUnn è che una robina del genere ti protegga molto dall'attacchi, intendiamoci, ma questo hostume si pole vende' a un prezzo alto.\n@c2@"
  ja: "@a@bトルネコ「防御力は　いまいちですが\n\tこれは　なかなかの\n\t高値で　取り引きされてますよ。\n@c2@"
"156":
  de: "@aTorneko@bJunge Tänzerinnen wie Maya würden darin toll aussehen. Und Mina natürlich auch.\n@c2@"
  en: "@aTorneko@bIt's fer yer young dancin' wan, Maya, this one. An' maybe Meena, too.\n@c2@"
  es: "@aTorneko@bEs pierfecto para esa joven bailarina, Maya. Y quizá, también, piara Meena.\n@c2@"
  fr: "@aTorneko@bIl n'y a que votre jeune danseuse, Maya, qui pourrait le porter. Et peut-être Mina aussi...\n@c2@"
  it: "@aBaldo@bDirei che è perfetto per Maya, la nostra danzatrice.\nMa anche Myra ci farebbe un figurone...\n@c2@"
  ja: "@a@bトルネコ「これを装備できるのは\n\t踊り子である　マーニャさん。\n\tミネアさんも　着られそうですね。\n@c2@"
"157":
  de: "@aTorneko@bFür große Kerle wie mich wär das aber nichts. Das würd' lächerlich aussehen.\n@c2@"
  en: "@aTorneko@bⓙCourse, it'd be no good fer a big fella like me.\nI couldn't wear it.\n@c2@"
  es: "@aTorneko@bClaro que no le quiedaría bien a un grandiullón como yo.\nSería incapiaz de llievarlo.\n@c2@"
  fr: "@aTorneko@bC'est sûr que c'est pas coupé pour un gars dans mon genre. Je ne pourrais pas le porter.\n@c2@"
  it: "@aBaldo@bIo, invece, ci starei proprio male.\nSempre ammesso che riesca a entrarci, in quella robina lì!\n@c2@"
  ja: "@a@bトルネコ「当然　私には\n\t装備できません。\n\tで…ですが……\n@c2@"
"158":
  de: "@aTorneko@bAber wenn jemand so ein Kostüm zu einem vernünftigen Preis anbieten würde, würd' ich wohl zuschlagen...\n@c2@"
  en: "@aTorneko@bBut I might get meself one if they were sellin' at the right price, like...\n@c2@"
  es: "@aTorneko@bPero quizá mi haría con uno si mi lo viendiesen a buen precio, como...\n@c2@"
  fr: "@aTorneko@bMais je me laisserais peut-être tenter si j'en trouvais un à un prix décent...\n@c2@"
  it: "@aBaldo@bCerto, se ne trovassi uno a buon prezzo potrei anche comprarlo, eh...\n@c2@"
  ja: "@a@bトルネコ「店屋に売るくらいなら\n\t私が個人的に　買い取っても\n\tいいですけど……\n@c2@"
"159":
  de: "@aTorneko@bNatürlich nicht für mich. Für mich doch nicht. Ständ mir ja nicht. Nein, nein.\n@c2@"
  en: "@aTorneko@bI mean, fer herself at home, o' course. Not fer me. No, I'm no cross-dresser. Not at all. At all.\n@c2@"
  es: "@aTorneko@bQuiero diecir, para mi mujer, que está en casa. No piara mí. No, yo no soy un traviestido. No, no. Para nada.\n@c2@"
  fr: "@aTorneko@bJe veux dire, pour ma femme, bien sûr. Pas pour moi. Je ne suis pas de ce genre-là.\nNon, non, non...\n@c2@"
  it: "@aBaldo@bMa miha per me! Io 'un so' il tipo che si veste da donna! Sarebbe per la mi' moglie. E mi garberebbe vederla con uno di quest'affari addosso... \n@c2@"
  ja: "@a@bトルネコ「あ　ダメですか。\n@c2@"
"160":
  de: "@aTorneko@bDas ist ja mal eine interessante Konstruktion. Schicht auf Schicht aus dünnen Bronzeplättchen.\n@c2@"
  en: "@aTorneko@bⓙTis an interestin' construction, this.\nLayer upon layer o' thin bronze sheets.\n@c2@"
  es: "@aTorneko@bLa elaboración de esta armiadura es intieresante.\nEstá hecha de muchas capas dielgadas de bronce, unas sobrie otras.\n@c2@"
  fr: "@aTorneko@bCette armure est d'une conception assez intéressanteⓢ elle est composée de fine lamelles de bronze superposées.\n@c2@"
  it: "@aBaldo@bHuesto sì ch'è un oggettino interessante! È stato realizzato sovrapponendo delle sottili lamine di bronzo.\n@c2@"
  ja: "@a@bトルネコ「ふむふむ……。\n\tうすい青銅の板を　何枚も\n\t重ねて作った　よろいです。\n@c2@"
"161":
  de: "@aTorneko@bUnd nützlich ist dieser Harnisch allemal. Bietet guten Schutz zu einem guten Preis.\n@c2@"
  en: "@aTorneko@bAye, it's a fair bit o' kit, so it is.\nNot too pricey, and not bad fer yer defence.\n@c2@"
  es: "@aTorneko@bSí, es una bonita pieza.\nNo muy cara, y bastiante buena defensa.\n@c2@"
  fr: "@aTorneko@bC'est du joli matériel.\nPas trop cher et assez efficace pour vous défendre.\n@c2@"
  it: "@aBaldo@bNiente male davvero.\n'Un costa troppo, e garantisce una discreta protezione.\n@c2@"
  ja: "@a@bトルネコ「値段が安いわりには\n\t防御力もあり　なかなか\n\tバランスのいい　防具ですよ。\n@c2@"
"162":
  de: "@aTorneko@bNa, so was! Eine Flüssigmetallrüstung!\n@c2@"
  en: "@aTorneko@bGet up the yard with ya! This is only liquid metal armour, so it is!\n@c2@"
  es: "@aTorneko@b¡No mi lo puedo creer! ¡Es una armiadura metalíquida, sí!\n@c2@"
  fr: "@aTorneko@bVous avez trouvé la perle rareⓠ\nUne armure de mercureⓠ Bravoⓠ\n@c2@"
  it: "@aBaldo@bMa te guarda!\nUn'Armatura rinforzata!\n@c2@"
  ja: "@a@bトルネコ「おおおっ！！\n\tこ…これは　はぐれメタルの\n\tよろいでは　ありませんかっ！\n@c2@"
"163":
  de: "@aTorneko@bSie bietet hervorragenden Schutz gegen magische wie physische Angriffe.\n@c2@"
  en: "@aTorneko@bA marvellous defence against magic and direct physical attacks.\n@c2@"
  es: "@aTorneko@bEs una defiensa estupienda contra la magia y los ataques físicos diriectos.\n@c2@"
  fr: "@aTorneko@bElle fait merveille aussi bien contre la magie que les attaques physiques directes.\n@c2@"
  it: "@aBaldo@bQuesta corazza protegge molto bene dall'attacchi fisici e da quelli magici.\n@c2@"
  ja: "@a@bトルネコ「これは　直接攻撃にも\n\t魔法攻撃にも　大きな防御力を\n\t発揮する　夢のよろいです！\n@c2@"
"164":
  de: "@aTorneko@bVon denen gibt's nicht viele auf der Welt. Die sieht man nur einmal im Leben.\n@c2@"
  en: "@aTorneko@bYa don't find many o' these, I can tell ya.\nIt's a once-in-a-lifetime thing.\n@c2@"
  es: "@aTorneko@bNo es algo que si encuentre todos los días.\nSiolo pasa una viez en la vida.\n@c2@"
  fr: "@aTorneko@bEt y'en a pas des masses, je peux vous le dire.\nDes comme ça, on en voit qu'une fois dans une vie.\n@c2@"
  it: "@aBaldo@bUn se ne trovano molte 'ngiro, eh?\nDirei che è più uniha che rara.\n@c2@"
  ja: "@a@bトルネコ「たぶん　世界中をさがしても\n\tそう多くは　出回っていないでしょう。\n\tこれは　一生ものですぞ！\n@c2@"
"165":
  de: "@aTorneko@b%0%a00220 %D220%Xkann%Ykönnen%Z damit ausgerüstet werden.\n@c2@"
  en: "@aTorneko@b%0%a00220 can be equipped with it.\n@c2@"
  es: "@aTorneko@bPuede ser equipada por %0%a00220.\n@c2@"
  fr: "@aTorneko@b%0%a00220 %D220%Xpeut%Ypeuvent%Z la porter.\n@c2@"
  it: "@aBaldo@bQuest'armatura pole esse' aggiunta all'equipaggiamento di %a00220.\n@c2@"
  ja: "@a@bトルネコ「これを装備できるのは\n\t%a00220。\n@c2@"
"166":
  de: "@aTorneko@bOh, und ich kann sie auch tragen.\n@c2@"
  en: "@aTorneko@bAnd it looks like this is sometin' I can equip meself with, too.\n@c2@"
  es: "@aTorneko@bY es algo que yo mismo piodría llevar equipiado.\n@c2@"
  fr: "@aTorneko@bJ'ai comme l'impression que moi aussi, je peux la porter.\n@c2@"
  it: "@aBaldo@bForse anch'io potrei esse' 'ngrado d'aggiungerla al mi' equipaggiamento...\n@c2@"
  ja: "@a@bトルネコ「どうやら　私にも\n\t装備できるみたいです。\n@c2@"
"167":
  de: "@aTorneko@bDafür würd' man bestimmt einen guten Preis erzielen, aber ich würd' sie trotzdem nicht verkaufen.\n@c2@"
  en: "@aTorneko@bI've no doubt ye'd get a grand price fer it, but ye wouldn't want to part with it.\n@c2@"
  es: "@aTorneko@bNo hay duda de que le piodrías sacar un buen priecio, pero no es una buena idea desprienderse de ella.\n@c2@"
  fr: "@aTorneko@bJe suis sûr que vous pourriez en tirer un sacré prix, mais ce serait bête de la vendre.\n@c2@"
  it: "@aBaldo@bA venderla c'è da farci un mucchio di huattrini, ma al tu' posto io 'un me ne separerei.\n@c2@"
  ja: "@a@bトルネコ「店屋でも　高値で\n\t買い取ってくれるでしょうが\n\t売るのは　おしいですな。\n@c2@"
"168":
  de: "@aTorneko@bDas ist aber ein edles Stück.\n@c2@"
  en: "@aTorneko@bⓙTis a fine lookin' piece o' gear this, if ever I saw one.\n@c2@"
  es: "@aTorneko@bEs una prienda prieciosa, sí que lo es.\n@c2@"
  fr: "@aTorneko@bC'est un bien beau vêtement que vous avez là.\nVous pouvez me croire.\n@c2@"
  it: "@aBaldo@bQuesto è uno dei più bei hapi d'abbigliamento ch'io abbia mai visto 'ntutta la mi' vita!\n@c2@"
  ja: "@a@bトルネコ「ほうほう……。\n\tこれは　なかなかに\n\t見栄えのよい　ものですね。\n@c2@"
"169":
  de: "@aTorneko@bDas Tier, von dem der Pelz stammt, muss wirklich prächtig gewesen sein.\n@c2@"
  en: "@aTorneko@bThe animal it came from must've had a gorgeous coat on it.\n@c2@"
  es: "@aTorneko@bEl animal del que prociede debía de estar muy eliegante con él.\n@c2@"
  fr: "@aTorneko@bLe pelage de cet animal était magnifique.\n@c2@"
  it: "@aBaldo@bSi vede che l'animale da cui è stato rihavato doveva ave' un pelo folto e lucido. Eh, sì.\n@c2@"
  ja: "@a@bトルネコ「毛並みの美しい\n\t動物の皮を使って　作った\n\tコートのようです。\n@c2@"
"170":
  de: "@aTorneko@bUnd der Mantel ist leichter, als er aussieht, also kann man sich im Kampf gut mit ihm bewegen.\n@c2@"
  en: "@aTorneko@bAn' it's lighter than it looks, so it'd be easy to move about in durin' battle, like.\n@c2@"
  es: "@aTorneko@bY es más ligero de lo que pariece, así que no diebe de ser muy difícil moverse con él puesto en combiate.\n@c2@"
  fr: "@aTorneko@bCette pelisse est plus légère qu'il n'y paraît, ce qui la rend très commode au combat.\n@c2@"
  it: "@aBaldo@bE poi l'è anche più leggero di huanto 'un sembri!\n'Unn impedisce i movimenti durante le battaglie.\n@c2@"
  ja: "@a@bトルネコ「見た目よりも\n\t軽くできているので　これなら\n\t戦いのときも　動きやすいでしょう。\n@c2@"
"171":
  de: "@aTorneko@bAh, welch ein hübsches Lederkleid. Darüber kann ich auch eine kleine Geschichte zum Besten geben.\n@c2@"
  en: "@aTorneko@bAh, a nice leather dress. I've a little tale to tell about this one, so I have.\n@c2@"
  es: "@aTorneko@bUn bonito viestido de piel, sí. Tiengo una historia que contarte siobre él.\n@c2@"
  fr: "@aTorneko@bAh, une jolie robe de cuir.\nJ'ai une petite anecdote à son sujet.\n@c2@"
  it: "@aBaldo@bMa che ganzo 'sto vestito di pelle!\nLo sai com'è nato quest'abito?\n@c2@"
  ja: "@a@bトルネコ「おお　皮のドレスですな。\n\tこのドレスには　ちょっとした\n\tエピソードが　あるんですよ。\n@c2@"
"172":
  de: "@aTorneko@bDas hat das Weib eines gewissen Waffenhändlers entworfen. Damit wollte sie den sozialen Status der Frau aufwerten.\n@c2@"
  en: "@aTorneko@bA certain weapon shop owner's wife designed it with a view to improvin' the social standin' o' women.\n@c2@"
  es: "@aTorneko@bLa espiosa de cierto miercader de armas lo diseñó con la idea de miejorar el estatus social de las mujeres.\n@c2@"
  fr: "@aTorneko@bElle a été dessinée par la femme d'un marchand d'armes dans le but d'améliorer le statut social des femmes.\n@c2@"
  it: "@aBaldo@bL'ha creato la moglie del proprietario d'una certa bottega d'armi per migliora' la hondizione sociale femminile.\n@c2@"
  ja: "@a@bトルネコ「とある　防具屋の女房が\n\t女性の地位向上をめざして\n\tこのドレスを　開発したとか。\n@c2@"
"173":
  de: "@aTorneko@bJetzt können die Weiber selbst auf dem Schlachtfeld gut aussehen. Ist der Inbegriff der Rechte der Damen, hat sie gesagt.\n@c2@"
  en: "@aTorneko@bNow they can look grand on the battlefield, too. 'Tis the epitome o' female rights, so they tell me.\n@c2@"
  es: "@aTorneko@bDe esta forma pueden estar también prieciosas en el campo de batalla. Es la piersonificación de los dierechos de la mujer, dicen.\n@c2@"
  fr: "@aTorneko@bMaintenant, elles peuvent aussi être coquettes sur le champ de bataille. Il paraît que c'est le nouveau combat des féministes.\n@c2@"
  it: "@aBaldo@bE così ora le donne possono permettersi d'esse' alla moda anche huando hombattono! Ora ce l'hanno proprio tutti, i diritti!\n@c2@"
  ja: "@a@bトルネコ「戦場でも　美しく！\n\tこのドレスは　女性活動の\n\tシンボル的　存在なのです。\n@c2@"
"174":
  de: "@aTorneko@b%0%a00220 %D220%Xkann%Ykönnen%Z damit ausgerüstet werden.\n@c2@"
  en: "@aTorneko@b%0%a00220 can be equipped with it.\n@c2@"
  es: "@aTorneko@bPuede ser equipado por %0%a00220.\n@c2@"
  fr: "@aTorneko@b%0%a00220 %D220%Xpeut%Ypeuvent%Z la porter.\n@c2@"
  it: "@aBaldo@bQuesto vestito pole esse' aggiunto all'equipaggiamento di %a00220.\n@c2@"
  ja: "@a@bトルネコ「これを装備できるのは\n\t%a00220。\n@c2@"
"175":
  de: "@aTorneko@bIst natürlich nichts für mich. Steht mir einfach nicht.\n@c2@"
  en: "@aTorneko@bⓙCourse, I can't equip meself with it.\nIt's not my thing, like.\n@c2@"
  es: "@aTorneko@bYo no mi lo pongo, claro.\nMi hace gordo.\n@c2@"
  fr: "@aTorneko@bVous comprendrez que ce n'est pas pour moi.\nC'est pas trop mon truc.\n@c2@"
  it: "@aBaldo@bAl mio equipaggiamento, invece, 'un posso aggiungerlo.\nMi stringe la trippa...\n@c2@"
  ja: "@a@bトルネコ「もちろん　私には\n\t装備できません。\n@c2@"
"176":
  de: "@aTorneko@bDas Teil würd' wahrscheinlich %a00750 Goldmünze%H750%X%Yn%Z einbringen, wenn man's im Geschäft verkauft.\n@c2@"
  en: "@aTorneko@bIt'd fetch about %a00750 gold coin%H750%X%Ys%Z if ya sold it in a shop.\n@c2@"
  es: "@aTorneko@bSacarías más o menos %a00750 monieda%H750%X%Ys%Z de oro si lo viendieses en una tienda.\n@c2@"
  fr: "@aTorneko@bVous pourriez en tirer %a00750 pièce%I750%X%Ys%Z d'or dans un magasin.\n@c2@"
  it: "@aBaldo@bSe lo vendi a un negoziante, dovresti esse' 'ngrado di rihavarci %a00750 %H750%Xmoneta%Ymonete%Z d'oro.\n@c2@"
  ja: "@a@bトルネコ「もし店屋に売れば\n\t%a00750ゴールドに\n\tなるでしょうな。\n@c2@"
"177":
  de: "@aTorneko@bPuh! Ist irgendwie heiß hier, nicht?\n@c2@"
  en: "@aTorneko@bPhew! Is it gettin' hot, or is it just me?\nWould ye look at...\n@c2@"
  es: "@aTorneko@b¡Uf! ¡Qué caliores mi están entriando!\nFíjiate en eso...\n@c2@"
  fr: "@aTorneko@bPfiouⓠ C'est moi ou il fait de plus en plus chaud par iciⓡ Regardez-moi ça...\n@c2@"
  it: "@aBaldo@bFiuuu! Maremma bollente, homincia a fa' caldo, eh?!\n@c2@"
  ja: "@a@bトルネコ「こっ！　これはぁ！\n\tあわわわわ……。\n@c2@"
"178":
  de: "@aTorneko@bÄhm! Entschuldigung. War nur ein wenig verwirrt, grad. Das ist natürlich so 'ne Art Rüstung für die Ladys.\n@c2@"
  en: "@aTorneko@bAhem! Sorry about that. Got a bit flustered, so I did. 'Tis a bit of armour fer the ladies, this.\n@c2@"
  es: "@aTorneko@b¡Ejem! Pierdón, lo siento. Mi he puesto un poco niervioso, sí. Esto es una especie de armiadura para las damas.\n@c2@"
  fr: "@aTorneko@bHumⓠ Pardon. Je me suis laissé emporter.\nC'est une armure légère pour les dames.\n@c2@"
  it: "@aBaldo@bEhm... Scusa, mi so' lasciato prende' dall'emozione.\nIn effetti non è altro che una protezione per le donne.\n@c2@"
  ja: "@a@bトルネコ「……と　とりみだして\n\tすみません。　こ…これは\n\t女性専用の防具ですね。\n@c2@"
"179":
  de: "@aTorneko@bUnd trotz der auffallenden Abwesenheit von... ähm... Stoff, ist dieses Trikot doch sehr praktisch. Wenn auch ein wenig gewagt, wie ich finde.\n@c2@"
  en: "@aTorneko@bDespite the obvious lack of, em...substance, as it were, it's a handy item. An' a bit racy, if I'm honest.\n@c2@"
  es: "@aTorneko@bA piesar de su falta de... ejem... sustancia, por diecir algo, es un objeto muy práctico. Y un poco subido de tiono, en mi opinión.\n@c2@"
  fr: "@aTorneko@bIl n'y a pas beaucoup de... tissu, mais c'est un vêtement très pratique.\nEt assez suggestif, si je peux me permettre.\n@c2@"
  it: "@aBaldo@bSo che è un po' ridotto, huasi essenziale, ma in realtà l'è molto utile. Ed è anche audace. Una robina del genere miha possono indossarla tutte, eh?\n@c2@"
  ja: "@a@bトルネコ「布の少なさのわりに\n\t防御力が高く　いいものですよ。\n\tしかも　色っぽいですし……。\n@c2@"
"180":
  de: "@aTorneko@b%0%a00220 %D220%Xkann%Ykönnen%Z damit ausgerüstet werden.\n@c2@"
  en: "@aTorneko@b%0%a00220 can be equipped with it.\n@c2@"
  es: "@aTorneko@bPuede ser equipado por %0%a00220.\n@c2@"
  fr: "@aTorneko@b%0%a00220 %D220%Xpeut%Ypeuvent%Z le porter.\n@c2@"
  it: "@aBaldo@bQuesto hapo pole esse' aggiunto all'equipaggiamento di %a00220.\n@c2@"
  ja: "@a@bトルネコ「これを装備できるのは\n\t%a00220。\n@c2@"
"181":
  de: "@aTorneko@bIch?! Na, jetzt reicht's aber bald. Das ist doch nichts für echte Kerle wie mich. Noch so eine dumme Frage und ich...\n@c2@"
  en: "@aTorneko@bMe? Are ye wise? 'Tisn't fer a fella. Ask stupid questions like that, and I might, though. So mind yerself!\n@c2@"
  es: "@aTorneko@b¿Yo? ¿Has pierdido el juicio? Esto no es para hombries. Pero si sigues haciendo prieguntas tontas, a lo miejor mi lo pongo. ¡Así que tien cuidado!\n@c2@"
  fr: "@aTorneko@bMoiⓡ Ça va pasⓡ C'est pas pour les hommes.\nContinuez à poser des questions de ce genre et je vais finir par le mettre. Alors gare à vousⓠ\n@c2@"
  it: "@aBaldo@bSe io posso indossarlo? Ma sei fori di testa? 'Unn è miha roba da omini! Certo, se me lo hiedi ancora, potrei anche farci un pensierino...\n@c2@"
  ja: "@a@bトルネコ「私？　私に着られるはず\n\tないでしょう！　そういうこと聞くと\n\tしまいにゃ　着ますよ！\n@c2@"
"182":
  de: "@aTorneko@bDas Teil würd' wahrscheinlich %a00750 Goldmünze%H750%X%Yn%Z einbringen, wenn man's im Geschäft verkauft.\n@c2@"
  en: "@aTorneko@bIt'd fetch about %a00750 gold coin%H750%X%Ys%Z if ya sold it in a shop.\n@c2@"
  es: "@aTorneko@bSacarías más o menos %a00750 monieda%H750%X%Ys%Z de oro si lo viendieses en una tienda.\n@c2@"
  fr: "@aTorneko@bVous pourriez en tirer %a00750 pièce%I750%X%Ys%Z d'or dans un magasin.\n@c2@"
  it: "@aBaldo@bA venderlo a una bottega, potresti farci %a00750 %H750%Xmoneta%Ymonete%Z d'oro.\n@c2@"
  ja: "@a@bトルネコ「もし店屋に売れば\n\t%a00750ゴールドに\n\tなるでしょうな。\n@c2@"
"183":
  de: "@aTorneko@bHm... Diese Rüstung wurde aus der Haut und den Schuppen eines Drachens gefertigt.\n@c2@"
  en: "@aTorneko@bHm... This armour's made from the skin and scales of a dragon.\n@c2@"
  es: "@aTorneko@bMmm... Esta armiadura está hecha de piel y escamas de driagón.\n@c2@"
  fr: "@aTorneko@bMmm... Cette cuirasse est en cuir et en écailles de dragon.\n@c2@"
  it: "@aBaldo@bUhm... Quest'armatura è fatta con la pelle e le scaglie d'un drago.\n@c2@"
  ja: "@a@bトルネコ「ふむ……。\n\tこれは　ドラゴンの皮やうろこから\n\t作られた　よろいですね。\n@c2@"
"184":
  de: "@aTorneko@bSie ist gegen jede Art von Temperatur gefeit und schützt ihren Träger sowohl gegen Feuer- als auch Kälteangriffe.\n@c2@"
  en: "@aTorneko@bIt can stand up to wild changes in temperature, so it'll save y'against fire or ice attacks, fer example.\n@c2@"
  es: "@aTorneko@bSoporta cambios bruscos de tiemperatura, así que ti protiegerá contra los ataques de fuego y de hielo, por ejemplo.\n@c2@"
  fr: "@aTorneko@bElle peut supporter de grands écarts de température et vous protégera des attaques de glace ou de feu, par exemple.\n@c2@"
  it: "@aBaldo@bPole sopporta' grandi hambiamenti di temperatura, huindi l'è perfetta per resiste' all'attacchi di foho e di ghiaccio.\n@c2@"
  ja: "@a@bトルネコ「熱の変化に　非常に強く\n\t炎やふぶきの攻撃などから\n\t身を　守ってくれるでしょう。\n@c2@"
"185":
  de: "@aTorneko@bSieh sich das einer an. Der Mantel ist so leicht, dass ich sein Gewicht kaum spüren kann, wenn ich ihn in der Hand halte.\n@c2@"
  en: "@aTorneko@bWould ye look at that? It's that light, I can hardly feel that I'm holdin' it.\n@c2@"
  es: "@aTorneko@bVaya, fíjate en esto. Es tan ligiera que apenas noto que la tiengo en las manos.\n@c2@"
  fr: "@aTorneko@bRegardez-moi çaⓠ C'est si léger que j'ai l'impression de ne rien tenir.\n@c2@"
  it: "@aBaldo@bMa te guarda che roba!\nL'è talmente leggero, che mi pare d'unn averci nulla 'nmano!\n@c2@"
  ja: "@a@bトルネコ「ふむふむ……？\n\t持っているのを　忘れそうなほど\n\t軽い素材で　できていますね。\n@c2@"
"186":
  de: "@aTorneko@bMit solch einem Leichtgewicht kann man sich im Kampf problemlos bewegen.\n@c2@"
  en: "@aTorneko@bWith sometin' this lightweight on, ye'd be able to move like the clappers in battle.\n@c2@"
  es: "@aTorneko@bCon algo tan ligiero, podrás movierte como una liebre en combate.\n@c2@"
  fr: "@aTorneko@bAvec un manteau dans ce genre, vous pouvez bouger très très vite en combat.\n@c2@"
  it: "@aBaldo@bSe durante le battaglie indossi quest'abito, ti moverai con la rapidità d'un leprotto!\n@c2@"
  ja: "@a@bトルネコ「これだけ　軽い服であれば\n\t魔物との　戦いの最中にも\n\tすばやく動けるでしょうな。\n@c2@"
"187":
  de: "@aTorneko@bAh, dieses Kleidungsstück trägt den Segen der Heiligen mit sich.\n@c2@"
  en: "@aTorneko@bAh, 'tis an item o' clothin' with the blessin' o' the saints.\n@c2@"
  es: "@aTorneko@b¡Ah!, una prienda de ropa con la biendición de los santos.\n@c2@"
  fr: "@aTorneko@bAh, c'est un vêtement béni par les saints.\n@c2@"
  it: "@aBaldo@bOh, huesto hapo d'abbigliamento ha ricevuto la benedizione divina.\n@c2@"
  ja: "@a@bトルネコ「おお。　この法衣は\n\tどうやら　聖なるチカラの\n\t祝福を受けているようですな。\n@c2@"
"188":
  de: "@aTorneko@bJa, mit solch einer Robe können einem Feuer- oder Kälteangriffe nicht so viel anhaben.\n@c2@"
  en: "@aTorneko@bAye, with this on, fire or ice magic attacks won't feel so harsh.\n@c2@"
  es: "@aTorneko@bCon esto puesto, los ataques de fuego o de hielo no son tian crueles.\n@c2@"
  fr: "@aTorneko@bSi vous le portez, les attaques magiques de glace ou de feu seront plus supportables.\n@c2@"
  it: "@aBaldo@bIndossando huest'abito, sopporterai più facilmente gli effetti nefasti dell'attacchi di foho e di ghiaccio.\n@c2@"
  ja: "@a@bトルネコ「これを装備していれば\n\tあらゆる　呪文のダメージを\n\tやわらげてくれるでしょう。\n@c2@"
"189":
  de: "@aTorneko@bAußerdem ist sie ein guter Schutz gegen körperliche Angriffe.\n@c2@"
  en: "@aTorneko@bAnd it'll do a fair bit to protect ya from physical attacks, too.\n@c2@"
  es: "@aTorneko@bY tampoco viene mal para protiegerse contra ataques físicos.\n@c2@"
  fr: "@aTorneko@bIl vous protégera également un peu des attaques physiques.\n@c2@"
  it: "@aBaldo@bE ti garantisce anche una discreta protezione dall'attacchi fisici!\n@c2@"
  ja: "@a@bトルネコ「しかも　直接攻撃にも\n\tかなりの防御力がありそうです。\n@c2@"
"190":
  de: "@aTorneko@bDieses fließende Kleid ist ein toller Schutz gegen Feuer. Es stammt noch aus der Zeit der Elfen, ja ja.\n@c2@"
  en: "@aTorneko@bThis flowin' dress is a fine defence against fire an' ice. It goes all the way back to the time o' the faeries, so it does.\n@c2@"
  es: "@aTorneko@bEste viestido tan vaporoso es una diefensa ideal contra el fuego. Es antiguo, del tiempo de las hadas, sí.\n@c2@"
  fr: "@aTorneko@bCette robe flottante est un bon rempart contre le feu. Sa fabrication remonte au temps des fées.\n@c2@"
  it: "@aBaldo@bLa Veste d'acqua l'è parecchio effihace hontro i'ffoho, ma parecchio tanto. Si dice che sia stata realizzata da alcune fate...\n@c2@"
  ja: "@a@bトルネコ「この　みずのはごろもは\n\t炎や熱の攻撃に強い\n\tとても　歴史のある服です。\n@c2@"
"191":
  de: "@aTorneko@bEs wurde an einem heiligen Webstuhl mit Fäden aus Regen und Tau gewebt.\n@c2@"
  en: "@aTorneko@bⓙTis spun on a holy loom with threads of rain and dew, so it is.\n@c2@"
  es: "@aTorneko@bEstá hecho con tiela hilada en un tielar sagrado con hilos de lluvia y rocío.\n@c2@"
  fr: "@aTorneko@bElle a été tissée sur un métier sacré avec des fils de pluie et de rosée.\n@c2@"
  it: "@aBaldo@bLa leggenda narra che sia stata tessuta su un telaio magiho, usando fili di pioggia e di rugiada.\n@c2@"
  ja: "@a@bトルネコ「雨つゆの糸を\n\t聖なるおりきで　つむいでいくと\n\tこの服が　できるのです。\n@c2@"
"192":
  de: "@aTorneko@bUnd obwohl es aus Wasser besteht, ist es nicht durchsichtig. Können also auch die Damen problemlos tragen.\n@c2@"
  en: "@aTorneko@bAnd ye can't see through it, neither, even though it's made o' water. So there's no concern fer the ladies there.\n@c2@"
  es: "@aTorneko@bY, aunque está hecho de agua, no es transpariente. Así que las damas no tienen de qué prieocuparse.\n@c2@"
  fr: "@aTorneko@bElle a beau avoir été tissée avec de l'eau, elle n'est pas transparente. Les dames n'ont pas de souci à se faire.\n@c2@"
  it: "@aBaldo@bAnche se è fatto d'acqua, huest'abitino 'unn è trasparente. In questo modo, anche le signorine più pudihe potranno 'ndossarlo senza problemi.\n@c2@"
  ja: "@a@bトルネコ「水と言っても\n\tスケスケだったりは　しないので\n\t女性が装備しても　安心ですぞ。\n@c2@"
"193":
  de: "@aTorneko@bHm... Sieht schon toll aus, dieser Bolero, was?\n@c2@"
  en: "@aTorneko@bHm... Looks like a dear piece o' gear, this bolero does.\n@c2@"
  es: "@aTorneko@bMmm... Es una bonita toriera, sí.\n@c2@"
  fr: "@aTorneko@bMmm... Ce boléro est vraiment un joli vêtement.\n@c2@"
  it: "@aBaldo@bUhm... \nHuesto sì che l'è un gran bell'oggetto!\n@c2@"
  ja: "@a@bトルネコ「ふむふむ……。\n\tこれは　非常に高価そうな\n\tボレロですな。\n@c2@"
"194":
  de: "@aTorneko@bUnd ihm wohnen auch ganz eigene Kräfte inne.\n@c2@"
  en: "@aTorneko@bAnd there's an unusual power in it, too.\n@c2@"
  es: "@aTorneko@bY con un poder extraño.\n@c2@"
  fr: "@aTorneko@bIl détient également un pouvoir inhabituel.\n@c2@"
  it: "@aBaldo@bSento che è dotato d'uno strano potere.\n@c2@"
  ja: "@a@bトルネコ「しかも　このボレロには\n\tその名の通り　不思議なチカラが\n\tやどっているようです。\n@c2@"
"195":
  de: "@aTorneko@bWenn man ihn trägt und jemand einen Zauber auf einen wirkt, erhält man genau die Menge an magischer Energie, die für den Zauber aufgewandt wurde.\n@c2@"
  en: "@aTorneko@bWhen ye're wearin' it and someone casts a spell on ye, ye'll get the same amount o' magic restored to yerself.\n@c2@"
  es: "@aTorneko@bSi la llievas y ti lanzan un conjuro, recupieras la misma cantidad de magia.\n@c2@"
  fr: "@aTorneko@bQuand vous le portez et que quelqu'un vous lance un sort, vous récupérez la puissance magique qui a été utilisée contre vous.\n@c2@"
  it: "@aBaldo@bSe ti scagliano hontro un incantesimo mentre indossi huesto coprihapo, recupererai la stessa huantità di potere magico usata per lancia' i'ssortilegio.\n@c2@"
  ja: "@a@bトルネコ「このボレロを着て\n\t呪文を受けると　その分だけ\n\t魔力を　回復してくれそうです。\n@c2@"
"196":
  de: "@aTorneko@bIch muss wohl nicht erklären, was das hier ist. Diese Rüstung ist Teil der legendären Zenithia-Ausrüstung.\n@c2@"
  en: "@aTorneko@bI'm sure I don't need to tell ya what this is.\n'Tis part o' the legendary Zenithian kit.\n@c2@"
  es: "@aTorneko@bNo hará falta que ti diga qué es esto, ¿vierdad?\nForma parte del legiendario equipo de Zenithia.\n@c2@"
  fr: "@aTorneko@bJe suis certain que je n'ai pas à vous expliquer ce que c'est.\nC'est une partie de l'Équipement zénithien.\n@c2@"
  it: "@aBaldo@bUnn ho certo bisogno di dirti che cosa sia huesta meraviglia... L'è un pezzo del leggendario Equipaggiamento Zenithiano.\n@c2@"
  ja: "@a@bトルネコ「ふむふむ……。\n\tこれは　言うまでもなく\n\t伝説の防具の　ひとつですね。\n@c2@"
"197":
  de: "@aTorneko@bJe länger ich mir das Prachtstück anseh, desto begeisterter bin ich.\n@c2@"
  en: "@aTorneko@bThe more I look at it, the more amazin' it seems.\n@c2@"
  es: "@aTorneko@bCuanto más lo miro, más increíble mi pariece.\n@c2@"
  fr: "@aTorneko@bPlus je la regarde, plus elle me paraît impressionnante.\n@c2@"
  it: "@aBaldo@bPiù la guardo, e più mi sembra splendida.\n@c2@"
  ja: "@a@bトルネコ「しかし　見れば見るほど\n\t見事な　ヨロイですな。\n\tしかも……\n@c2@"
"198":
  de: "@aTorneko@bSie schützt einen nicht nur vor körperlichem Schaden, sondern auch vor magischen Angriffen.\n@c2@"
  en: "@aTorneko@bIt saves yer man from physical damage and spells alike.\n@c2@"
  es: "@aTorneko@bProtiege tanto de conjuros como de daño físico.\n@c2@"
  fr: "@aTorneko@bElle vous protège à la fois des attaques physiques et magiques.\n@c2@"
  it: "@aBaldo@bOffre ottima protezione sia dagli attacchi fisici, sia dagli incantesimi.\n@c2@"
  ja: "@a@bトルネコ「直接攻撃だけでなく\n\tあらゆる呪文からも\n\t装備している者を　守るでしょう。\n@c2@"
"199":
  de: "@aTorneko@bEs versteht sich von selbst, dass nur %O960%X%A090%Xein großer Held%Z%B090%Xeine große Heldin%Z wie Ihr%Y%A090%Xder große Held%Z%B090%Xdie große Heldin%Z, %a00090,%Z sie benutzen kann.\n@c2@"
  en: "@aTorneko@bIt goes without sayin' I s'pose, that only %O960%Xa great %A090%Xhero%Z%B090%Xheroine%Z such as yerself%Ythe great %A090%Xhero%Z%B090%Xheroine%Z, %a00090,%Z can use it.\n@c2@"
  es: "@aTorneko@bNi que diecir tiene que solo %O960%X%A090%Xun gran héroe%Z%B090%Xuna gran heroína%Z como tú%Y%A090%Xel gran héroe%Z%B090%Xla gran heroína%Z, %a00090,%Z puede utilizarla.\n@c2@"
  fr: "@aTorneko@bJ'enfonce peut-être des portes ouvertes, mais %O960%X%A090%Xseul un grand héros%Z%B090%Xseule une grande héroïne%Z comme vous%Y%A090%Xseul le grand héros%Z%B090%Xseule la grande héroïne%Z %a00090%Z peut s'en servir.\n@c2@"
  it: "@aBaldo@bOvviamente, solo %O960%X%A090%Xun grande eroe%Z%B090%Xuna leggendaria eroina%Z come te%Y%A090%Xil grande eroe%Z%B090%Xla leggendaria eroina%Z, %a00090,%Z pole usarla.\n@c2@"
  ja: "@a@bトルネコ「これを装備できるのは\n\tもちろん　勇者である\n\t%a00090さんだけです。\n@c2@"
"200":
  de: "@aTorneko@bUnd außerdem ist sie viel zu wertvoll, um verkauft zu werden.\n@c2@"
  en: "@aTorneko@bAnd I'm guessin' it'd be far too dear fer a normal shop to trade in.\n@c2@"
  es: "@aTorneko@bY no creo equiviocarme si ti digo que es diemasiado caro para una tienda normal.\n@c2@"
  fr: "@aTorneko@bEt j'imagine qu'aucun marchand ordinaire n'aurait les moyens de vous l'acheter.\n@c2@"
  it: "@aBaldo@bE credo proprio che nessuna bottega al mondo possa permettersi d'acquista' huest'armatura!\n@c2@"
  ja: "@a@bトルネコ「これは　あまりに\n\t高価すぎて　普通の店屋では\n\t引き取ってくれないでしょうね。\n@c2@"
"201":
  de: "@aTorneko@bAu! Verflucht! Aua!\n@c2@"
  en: "@aTorneko@bOw! Bejappers! Ow!\n@c2@"
  es: "@aTorneko@b¡Auh! ¡Por las calzas de la priofeta! ¡Auh!\n@c2@"
  fr: "@aTorneko@bOuilleⓠ Crotte de biqueⓠ\n@c2@"
  it: "@aBaldo@bOhi! Attenzione! Ahia!\n@c2@"
  ja: "@a@bトルネコ「あいたたっ！！\n\tいてっ！　いてっ！\n@c2@"
"202":
  de: "@aTorneko@bHm... Ich kann nun ganz aus eigener Erfahrung sagen, dass diese Rüstung voller Stacheln ist... Eine Warnung wär schön gewesen!\n@c2@"
  en: "@aTorneko@bHm... I can sorely report that there are spikes all over this gear. Ya coulda warned me!\n@c2@"
  es: "@aTorneko@bMmm... Puedo diecir sin tiemor a equivocarme que esto está recubierto de púas. ¡Podrías habiérmelo dicho!\n@c2@"
  fr: "@aTorneko@bMmm... Eh bienⓠ Je peux désormais vous affirmer qu'il y a un paquet de piques sur cette armure.\nVous auriez pu me prévenirⓠ\n@c2@"
  it: "@aBaldo@bPosso dolorosamente afferma' che quest'affare huì l'è tutto rihoperto d'ahulei pungenti!\nMaremma buhata, potevi anche avvertirmi, eh?!\n@c2@"
  ja: "@a@bトルネコ「ふう……。\n\tこのよろいは　全身に　やいばが\n\tついていて　危険ですな。\n@c2@"
"203":
  de: "@aTorneko@bAuf jeden Fall hat der Feind nichts zu lachen, wenn er einem zu nahe kommt.\n@c2@"
  en: "@aTorneko@bIf yer enemies get too close to ya, they'll banjax 'emselves fer sure.\n@c2@"
  es: "@aTorneko@bSi tus eniemigos si aciercan demasiado, si harán pinchios morunos.\n@c2@"
  fr: "@aTorneko@bSi vos ennemis s'approchent trop près de vous, ils risquent de le regretter.\n@c2@"
  it: "@aBaldo@bSe i nemici ti s'avvicinano troppo, finiranno tutti buherellati.\n@c2@"
  ja: "@a@bトルネコ「この　よろいに　不用意に\n\t近づく敵には　思わぬダメージを\n\tあたえられるかもしれませんぞ。\n@c2@"
"204":
  de: "@aTorneko@bUi, was für ein Anblick. Einfach bezaubernd.\n@c2@"
  en: "@aTorneko@bAh, what a dazzlin' dress, all covered in spangles, like.\n@c2@"
  es: "@aTorneko@bUn vestido deslumbrante, todo riecubierto de lientejuelas, sí.\n@c2@"
  fr: "@aTorneko@bQuelle robe étincelanteⓠ Il y a des paillettes partout.\n@c2@"
  it: "@aBaldo@bMa che meraviglia huesto vestito! L'è tutto hoperto di lustrini luccihanti!\n@c2@"
  ja: "@a@bトルネコ「ふむ……。　全身を\n\tスパンコールで　かざった\n\t目にも　まばゆい　ドレスですね。\n@c2@"
"205":
  de: "@aTorneko@bWie all die kleinen Pailletten im Licht funkeln, herrlich.\n@c2@"
  en: "@aTorneko@bLook at all the little sequins shimmerin' away as they catch the light.\n@c2@"
  es: "@aTorneko@bFíjate como brillan al refliejar la luz.\n@c2@"
  fr: "@aTorneko@bRegardez-moi çaⓠ Elle brille de mille feux dans la lumière.\n@c2@"
  it: "@aBaldo@bGuarda come hattura la luce e la riflette da tutte le parti!\n@c2@"
  ja: "@a@bトルネコ「スパンコールというのは\n\t光の当たりかたによって\n\tキラキラ光る　装飾品です。\n@c2@"
"206":
  de: "@aTorneko@bWenn's nach mir ginge, könnte meine Frau so was mal anziehen...\n@c2@"
  en: "@aTorneko@bAye, if I could have me own way, I'd like to see it on a young wan, so I would.\n@c2@"
  es: "@aTorneko@b¡Ah, cuánto mi gustaría viérselo puesto a una guapa jovencita!\n@c2@"
  fr: "@aTorneko@bEh bien, si je pouvais en trouver une, je la donnerais sans doute à une jolie jeune fille.\n@c2@"
  it: "@aBaldo@bMi garberebbe proprio vede' come sta addosso a una bella ragazza.\n@c2@"
  ja: "@a@bトルネコ「個人的な希望としては\n\tやはり　はなやかな女性に\n\t装備してもらいたいものですな。\n@c2@"
"207":
  de: "@aTorneko@b%0%a00220 %D220%Xkann%Ykönnen%Z damit ausgerüstet werden.\n@c2@"
  en: "@aTorneko@b%0%a00220 can be equipped with it.\n@c2@"
  es: "@aTorneko@bPuede ser equipado por %0%a00220.\n@c2@"
  fr: "@aTorneko@b%0%a00220 %D220%Xpeut%Ypeuvent%Z la porter.\n@c2@"
  it: "@aBaldo@bQuesto hapo pole esse' aggiunto all'equipaggiamento di %a00220.\n@c2@"
  ja: "@a@bトルネコ「これを装備できるのは\n\t%a00220。\n@c2@"
"208":
  de: "@aTorneko@bFür mich persönlich ist das natürlich nichts.\n@c2@"
  en: "@aTorneko@bBut it's not sometin' that'd suit me, o' course.\n@c2@"
  es: "@aTorneko@bPero a mí no mi sentaría demasiado bien, claro.\n@c2@"
  fr: "@aTorneko@bBien sûr, à moi, ça ne m'irait pas du tout.\n@c2@"
  it: "@aBaldo@bA me, invece, starebbe malissimo.\nE poi, io già risplendo della mi' luce propria!\n@c2@"
  ja: "@a@bトルネコ「もちろん　私には\n\t装備できません。\n@c2@"
"209":
  de: "@aTorneko@bDas Teil würd' wahrscheinlich %a00750 Goldmünze%H750%X%Yn%Z einbringen, wenn man's im Geschäft verkauft.\n@c2@"
  en: "@aTorneko@bIt'd fetch about %a00750 gold coin%H750%X%Ys%Z if ya sold it in a shop.\n@c2@"
  es: "@aTorneko@bSacarías más o menos %a00750 monieda%H750%X%Ys%Z de oro si lo viendieses en una tienda.\n@c2@"
  fr: "@aTorneko@bVous pourriez en tirer %a00750 pièce%I750%X%Ys%Z d'or dans un magasin.\n@c2@"
  it: "@aBaldo@bSe lo vendi a una bottega, ci poi fa' %a00750 %H750%Xmoneta%Ymonete%Z d'oro.\n@c2@"
  ja: "@a@bトルネコ「もし店屋に売れば\n\t%a00750ゴールドに\n\tなるでしょうな。\n@c2@"
"210":
  de: "@aTorneko@bMann, Mann, Mann, da darf man ja gar nicht hinsehen!\n@c2@"
  en: "@aTorneko@bWhat a crackin' bit o' gear this is!\n@c2@"
  es: "@aTorneko@b¡Esta es una prienda espléndida!\n@c2@"
  fr: "@aTorneko@bComme c'est mignon ce petit bodyⓠ\n@c2@"
  it: "@aBaldo@bMeraviglioso!\n@c2@"
  ja: "@a@bトルネコ「おおおっ！！\n\tこれは　すばらしいものを\n\tお持ちですなっ！\n@c2@"
"211":
  de: "@aTorneko@bObwohl sich ein Mann so was natürlich gerne anguckt... Und praktisch ist es auch.\n@c2@"
  en: "@aTorneko@bIt's not just sometin' nice fer the fellas to look at. It's a handy tool as well.\n@c2@"
  es: "@aTorneko@bY no es solo porque sea agriadable de ver, también es muy priáctica.\n@c2@"
  fr: "@aTorneko@bNon seulement, c'est pas désagréable à regarder, mais c'est aussi très pratique.\n@c2@"
  it: "@aBaldo@bUnn è solo bello a vedersi, ma è anche un oggetto molto utile.\n@c2@"
  ja: "@a@bトルネコ「このレオタードは\n\t男性の目に　よいだけでなく\n\tじつは　大変な優れものですぞ。\n@c2@"
"212":
  de: "@aTorneko@bDas Trikot schützt nicht nur gegen körperliche Angriffe, sondern auch gegen bestimmte Arten von Magie.\n@c2@"
  en: "@aTorneko@bObviously it gives some protection against direct physical attacks, but also against certain types o' magic, too.\n@c2@"
  es: "@aTorneko@bProtiege un poco contra los ataques físicos, pero también contra ciertos tipos de magia.\n@c2@"
  fr: "@aTorneko@bCe vêtement vous protège des attaques physiques directes, mais aussi de certains types de magie.\n@c2@"
  it: "@aBaldo@bOltre a forni' protezione dall'attacchi fisici, ripara anche un po' da quelli magici.\n@c2@"
  ja: "@a@bトルネコ「直接攻撃は　もちろん\n\tさまざまな呪文からも\n\t装備している者を　守るのです。\n@c2@"
"213":
  de: "@aTorneko@bIn solchen Dingen bin ich natürlich kein Experte, aber ich würd' sagen, dass das ein recht hübscher Rock ist.\n@c2@"
  en: "@aTorneko@bI'm not officially an expert, but this is a fine-lookin' skirt if y'ask me.\n@c2@"
  es: "@aTorneko@bNo soy un expierto en estas cosas, pero si quieres mi opinión, es un viestido priecioso.\n@c2@"
  fr: "@aTorneko@bJe ne suis pas un grand expert, mais, si vous voulez mon avis, c'est une bien jolie jupe.\n@c2@"
  it: "@aBaldo@bIo 'un sono un vero esperto di huesto genere di hapi d'abbigliamento, ma direi che l'è proprio una bella gonna.\n@c2@"
  ja: "@a@bトルネコ「ふむ……。\n\tヒラヒラと　じつに　かわいらしい\n\tスカートですな。\n@c2@"
"214":
  de: "@aTorneko@bWenn man ihn so sieht, würd' man es nicht meinen, aber er wurde für Mitglieder des Klerus' geschneidert.\n@c2@"
  en: "@aTorneko@bYe wouldn't know it to look at it, but it's designed fer members o' the clergy.\n@c2@"
  es: "@aTorneko@bAunque por su aspiecto no lo dirías, si diseñó para el cliero.\n@c2@"
  fr: "@aTorneko@bÇa se voit peut-être pas à première vue, mais elle a été créée pour des prêtres.\n@c2@"
  it: "@aBaldo@bA prima vista 'un si direbbe, ma è particolarmente adatta per le religiose.\n@c2@"
  ja: "@a@bトルネコ「見た目からは\n\tわかりにくいですが　じつはこれ\n\t法衣の一種なのですよ。\n@c2@"
"215":
  de: "@aTorneko@bAber modebewussten Mädels steht er bestimmt genauso gut.\n@c2@"
  en: "@aTorneko@bBut that shouldn't stop a fashionable young wan havin' a bash at wearin' it.\n@c2@"
  es: "@aTorneko@bPero no por eso diebe diejar de llevarlo una guapa joviencita prieocupada por la moda.\n@c2@"
  fr: "@aTorneko@bCeci dit, ça ne doit pas empêcher les jeunes filles chics de l'essayer.\n@c2@"
  it: "@aBaldo@bPerò, sehondo me, anche una ragazza che 'un sia una suora ci farebbe un figurone!\n@c2@"
  ja: "@a@bトルネコ「流行に敏感な女性でも\n\tこれなら　人目を気にせずに\n\t堂々と　装備できるでしょう。\n@c2@"
"216":
  de: "@aTorneko@b%0%a00220 %D220%Xkann%Ykönnen%Z damit ausgerüstet werden.\n@c2@"
  en: "@aTorneko@b%0%a00220 can be equipped with it.\n@c2@"
  es: "@aTorneko@bPuede ser equipado por %0%a00220.\n@c2@"
  fr: "@aTorneko@b%0%a00220 %D220%Xpeut%Ypeuvent%Z la porter.\n@c2@"
  it: "@aBaldo@bQuesto hapo pole esse' aggiunto all'equipaggiamento di %a00220.\n@c2@"
  ja: "@a@bトルネコ「これを装備できるのは\n\t%a00220。\n@c2@"
"217":
  de: "@aTorneko@bIch kann ihn ja mal schnell anprobieren... Was? Wieso denn nicht? Na gut, dann eben nicht.\n@c2@"
  en: "@aTorneko@bI s'pose I could just about get into it if I triⓚⓛ\nWhat? Ye'll have nightmares?\nWell I'm sorry about that.\n@c2@"
  es: "@aTorneko@bSupiongo que mitiendo barriga podría...\n¿Qué? ¿Qué tiendrías piesadillas?\nVaya, pues lo siento.\n@c2@"
  fr: "@aTorneko@bJe suis presque sûr que je pourrais rentrer dedans si j'essa... commentⓡ Vous allez faire des cauchemarsⓡ Désolé.\n@c2@"
  it: "@aBaldo@bMagari mi sta anch'a me! Ora la provo e... \nMa che fai? Ti volti dall'altro lato perché 'un voi vede' uno spettaholo simile?!\n@c2@"
  ja: "@a@bトルネコ「私も　ムリすれば……\n\tえ？　見たくないですか。\n\tじゃあ　やめときます。　はい。\n@c2@"
"218":
  de: "@aTorneko@bDas Teil würd' wahrscheinlich %a00750 Goldmünze%H750%X%Yn%Z einbringen, wenn man's im Geschäft verkauft.\n@c2@"
  en: "@aTorneko@bIt'd fetch about %a00750 gold coin%H750%X%Ys%Z if ya sold it in a shop.\n@c2@"
  es: "@aTorneko@bSacarías más o mienos %a00750 monieda%H750%X%Ys%Z de oro si lo viendieses en una tienda.\n@c2@"
  fr: "@aTorneko@bVous pourriez en tirer %a00750 pièce%I750%X%Ys%Z d'or dans un magasin.\n@c2@"
  it: "@aBaldo@bSe la cedi a una bottega, dovresti farci %a00750 %H750%Xmoneta%Ymonete%Z d'oro.\n@c2@"
  ja: "@a@bトルネコ「もし店屋に売れば\n\t%a00750ゴールドに\n\tなるでしょうな。\n@c2@"
"219":
  de: "@aTorneko@bJa, das ist eine Robe für Kirchenleute.\n@c2@"
  en: "@aTorneko@bAye, 'tis a robe fer people o' the church, so it is.\n@c2@"
  es: "@aTorneko@bEs una prienda para los miembros del clero, sí.\n@c2@"
  fr: "@aTorneko@bEh bien, c'est un manteau pour les membres du clergé.\n@c2@"
  it: "@aBaldo@bAh, sì. Huesta veste è partiholarmente apprezzata dalle persone di chiesa.\n@c2@"
  ja: "@a@bトルネコ「ふむふむ……。\n\tこれは　法衣ですね。\n@c2@"
"220":
  de: "@aTorneko@bSie ist äußerst nützlich gegen Angriffe, wenn man schläft oder anderweitig wehrlos ist.\n@c2@"
  en: "@aTorneko@bIt'll give a fair bit o' protection from attacks when ye've been put to sleep or are otherwise defenceless.\n@c2@"
  es: "@aTorneko@bTi priotegerá contra ataques si ti han hecho dormir o no ti puedes diefender.\n@c2@"
  fr: "@aTorneko@bIl vous protégera relativement bien des attaques si on vous a endormi%A120%X%Z%B120%Xe%Z ou si vous vous retrouvez sans défense.\n@c2@"
  it: "@aBaldo@bProtegge un po' dall'attacchi huando ti prende 'lsonno oppure sei senza difese.\n@c2@"
  ja: "@a@bトルネコ「眠らされたときなど\n\t無防備なときでも　ダメージから\n\t身を守ってくれるでしょう。\n@c2@"
"221":
  de: "@aTorneko@bHuch! Das Ding hat mich mit heiliger Furcht erfüllt! In dem Moment, als ich es anfasste...\n@c2@"
  en: "@aTorneko@bBegorrah! It's put the fear o' the Goddess in me, so it has. As soon as it touched me hands.\n@c2@"
  es: "@aTorneko@b¡Por la Diosa! Nada más tocarlo he notiado un escalofrío de temor de la Diosa en mi intierior.\n@c2@"
  fr: "@aTorneko@bBon sang d'boisⓠ\nJ'ai vraiment eu une peur de tous les diables rien qu'en la touchant.\n@c2@"
  it: "@aBaldo@bMaremma impaurita! Huesta roba m'ha fatto veni' una fifa bestia huando l'ho toccata!\n@c2@"
  ja: "@a@bトルネコ「む……？\n\tこのよろいは　手にした瞬間から\n\tじつに　いやな予感がしますな。\n@c2@"
"222":
  de: "@aTorneko@bAber die Rüstung hält sicher einiges aus... Obwohl mir ganz schön unbehaglich wird, wenn ich sie mir so ansehe.\n@c2@"
  en: "@aTorneko@bⓙTis a tough piece of equipment, sure it is.\nBut it makes me feel more than a bit uneasy...\n@c2@"
  es: "@aTorneko@bEs una prienda robusta, sí.\nPero mi hace sentir inquieto...\n@c2@"
  fr: "@aTorneko@bM'est avis que c'est une solide cuirasse.\nEn tout cas, elle me met pas à l'aise...\n@c2@"
  it: "@aBaldo@bCerto, l'è un gran bell'oggettino, molto resistente e ben fatto, ma 'un mi sentirei tanto a mi' agio a indossarlo...\n@c2@"
  ja: "@a@bトルネコ「かなりの防御力が\n\tありそうですが　う～む……\n@c2@"
"223":
  de: "@aTorneko@bWelch ein schimmerndes, glitzerndes, funkelndes Kleidungsstück!\n@c2@"
  en: "@aTorneko@bWhat a glimmerin', shimmerin', sparklin' piece o' cloth!\n@c2@"
  es: "@aTorneko@b¡Vaya prienda de ropa! ¡Espliéndida! ¡Riadiante! ¡Dieslumbrante!\n@c2@"
  fr: "@aTorneko@bCette robe est vraiment lumineuse... brillante... étincelanteⓠ\n@c2@"
  it: "@aBaldo@bChe bello huesto hapo d'abbigliamento! Lucente, luminoso...\n@c2@"
  ja: "@a@bトルネコ「おおっ！\n\tこのドレスは　じつに\n\tまばゆい光を　はなっていますな。\n@c2@"
"224":
  de: "@aTorneko@bDas kann schon den ein oder anderen magischen Angriff abwehren.\n@c2@"
  en: "@aTorneko@bEvery now an' then, a dress as gleamin' as this is sure to reflect a magic attack.\n@c2@"
  es: "@aTorneko@bAlgunas vieces, los vestidos brillantes como este rieflejan los ataques mágicos.\n@c2@"
  fr: "@aTorneko@bJe suis presque sûr qu'elle doit pouvoir renvoyer certaines attaques magiques.\n@c2@"
  it: "@aBaldo@bUn abito del genere pole anche respinge' l'attacchi magici, di quando 'nquando.\n@c2@"
  ja: "@a@bトルネコ「このドレスを　着ていれば\n\t魔法攻撃を　ときどき\n\tはね返してくれるでしょう。\n@c2@"
"225":
  de: "@aTorneko@bAllerdings kann es auch passieren, dass das Kleid Heilzauber abwehrt, das ist dann natürlich weniger praktisch...\n@c2@"
  en: "@aTorneko@bIt might even reflect healin' magic though, too, so you'd best mind yerself with that.\n@c2@"
  es: "@aTorneko@bPero ten cuidiado, porque también pueden rieflejar la magia de curación.\n@c2@"
  fr: "@aTorneko@bMais elle risquerait peut-être aussi de réfléchir les sorts de soin qu'on vous lance, alors je vous conseille de faire bien attention.\n@c2@"
  it: "@aBaldo@bPerò potrebbe anche riflette' l'incantesimi di guarigione, huindi io starei attento a come utilizzarlo.\n@c2@"
  ja: "@a@bトルネコ「しかし　回復魔法までも\n\tはね返してしまう場合があるので\n\tそこは　注意が必要です。\n@c2@"
"226":
  de: "@aTorneko@bW-Was zum... Ich hab kein gutes Gefühl bei dieser Rüstung...\n@c2@"
  en: "@aTorneko@bWh-What in the name of... I've a bad feelin' about this armour...\n@c2@"
  es: "@aTorneko@bEn el nombrie de... Esta armiadura mi da mala espina...\n@c2@"
  fr: "@aTorneko@bMais... Mais qu'est-ce que... J'ai comme un mauvais pressentiment sur cette armure...\n@c2@"
  it: "@aBaldo@bOh, santi numi! Huest'armatura huì 'un mi garba affatto...\n@c2@"
  ja: "@a@bトルネコ「な…なんでしょう\n\tこの　よろいは……。\n\tひどく　不気味ですが……。\n@c2@"
"227":
  de: "@aTorneko@bEhrlich gesagt möchte ich das Teil keine Sekunde zu lang in Händen halten.\n@c2@"
  en: "@aTorneko@bTo be honest with ya, I wouldn't want to be holdin' on to it fer too long meself.\n@c2@"
  es: "@aTorneko@bCreo que no mi gustaría llevarla conmigo durante diemasiado tiempo.\n@c2@"
  fr: "@aTorneko@bPour être tout à fait honnête, si je devais la porter, j'aimerais autant que ça ne dure pas trop longtemps.\n@c2@"
  it: "@aBaldo@bGuarda, ti parlo hon la massima sincerità: io 'un me la terrei pe' molto tempo.\n@c2@"
  ja: "@a@bトルネコ「うむ……。\n\t正直に言って　このよろいを\n\t長く　持っていたくないですね。\n@c2@"
"228":
  de: "@aTorneko@bAber gut für die Verteidigung ist es allemal. Das ist klar.\n@c2@"
  en: "@aTorneko@bThough sure as eggs is eggs, it's mighty in the defence department.\n@c2@"
  es: "@aTorneko@bAunque, a diecir verdad, en lo que si riefiere a la defiensa es ideal.\n@c2@"
  fr: "@aTorneko@bUne chose est sûre, côté défense, elle doit être particulièrement performante.\n@c2@"
  it: "@aBaldo@bAnche se offre certamente moltissima protezione. Sì, di huesto so' sihuro.\n@c2@"
  ja: "@a@bトルネコ「防御力だけは　かなりのものと\n\t思われますが……。\n@c2@"
"229":
  de: "@aTorneko@bTja, wenn Ihr's genau wissen wollt, die sind aus einem äußerst feinen Stoff gemacht, jawohl.\n@c2@"
  en: "@aTorneko@bWell if ye really want to know, they're made of a very fine bit o' fabric, so they are.\n@c2@"
  es: "@aTorneko@bMmm... Si de vierdad quieres sabierlo están hechos de un matierial estiupendo, sí...\n@c2@"
  fr: "@aTorneko@bEh bien, si vous voulez vraiment le savoir, le tissu est de grande qualité.\n@c2@"
  it: "@aBaldo@bMaremma timidina! Di solito 'un m'occupo di roba di huesto tipo ma, se proprio voi che l'esamini, t'accontento.\n@c2@"
  ja: "@a@bトルネコ「ふむ……。\n\t大マジメに言うのも　なんですが\n\tこれは下着の一種ですね。\n@c2@"
"230":
  de: "@aTorneko@bDiese Hose ist auf jeden Fall sehr atmungsaktiv. Man will ja nicht ins Schwitzen kommen, nicht?\n@c2@"
  en: "@aTorneko@bThey look like they breathe nicely.\nYe don't want to get too hot now, do ya?\n@c2@"
  es: "@aTorneko@bParecen de los que tienen buena vientilación.\nNo quierrás pasar calor, ¿vierdad?\n@c2@"
  fr: "@aTorneko@bOn dirait qu'il y a de la place là-dedans.\nAu moins, vous serez pas à l'étroit.\n@c2@"
  it: "@aBaldo@bBeh, quest'affari tengon calde le parti dove 'un ci batte i'ssole.\n@c2@"
  ja: "@a@bトルネコ「通気性に優れていて\n\tいいんですよ。　むれなくて……。\n@c2@"
"231":
  de: "@aTorneko@bAber im Kampf ist sie natürlich vollkommen nutzlos.\n@c2@"
  en: "@aTorneko@bBut they're not exactly designed for battle...\n@c2@"
  es: "@aTorneko@bPero en combiate no sirven para nada.\n@c2@"
  fr: "@aTorneko@bEn revanche, ça ne vous servira strictement à rien au combat.\n@c2@"
  it: "@aBaldo@bMa 'nbattaglia servono a poho, pe' 'un di' a nulla!\n@c2@"
  ja: "@a@bトルネコ「まあ　もちろん　戦いには\n\t全然　向いてませんが。\n@c2@"
"232":
  de: "@aTorneko@bDa brat mir doch einer 'nen Storch! Das ist wirklich ein seltenes Teil!\n@c2@"
  en: "@aTorneko@bStrike me down, that's a rare piece of armour, so it is!\n@c2@"
  es: "@aTorneko@b¡Que mi parta un rayo, esta armiadura es muy poco común!\n@c2@"
  fr: "@aTorneko@bEh ben, on peut dire que vous avez mis la main sur pièce rareⓠ\n@c2@"
  it: "@aBaldo@bMaremma incantata! Huesta sì che l'è un'armatura rara!\n@c2@"
  ja: "@a@bトルネコ「おおお……。\n\tこれは　すごい　よろいですぞ！\n@c2@"
"233":
  de: "@aTorneko@bAber diese Rüstung hat auch was Unheimliches an sich... Fast so, als wär sie lebendig.\n@c2@"
  en: "@aTorneko@bBut there's mischief seepin' out of ev'ry pore...almost like it's alive.\n@c2@"
  es: "@aTorneko@bPero pariece estar impriegnada de malicia... Es como si estuviese viva.\n@c2@"
  fr: "@aTorneko@bMais j'ai l'impression qu'elle transpire le mal de partout... comme si elle était vivante.\n@c2@"
  it: "@aBaldo@bPerò emana una sensazione strana... Pare huasi che sia viva!\n@c2@"
  ja: "@a@bトルネコ「全身から　あやしさを\n\tただよわせていて……　まるで\n\t生きているかのようです。\n@c2@"
"234":
  de: "@aTorneko@bIch würd' mein Leben darauf verwetten, dass kein menschliches Wesen sie tragen kann.\n@c2@"
  en: "@aTorneko@bI'd bet me life that no human can wear it, though.\n@c2@"
  es: "@aTorneko@bMi apostaría cualquier cosa a que los humanos no pueden llievarla.\n@c2@"
  fr: "@aTorneko@bJe suis prêt à parier un bras qu'aucun être humain ne peut porter un truc comme ça.\n@c2@"
  it: "@aBaldo@bScommetto la porta della mi' bottega che nessun essere umano pole indossarla.\n@c2@"
  ja: "@a@bトルネコ「私たち　人間では\n\tこの　よろいを　装備することは\n\tできないでしょうな……。\n@c2@"
"235":
  de: "@aTorneko@bUnd ich wett auch darauf, dass diese Rüstung einzigartig ist.\n@c2@"
  en: "@aTorneko@bAnd I'd bet me life again that ye won't find another piece like it.\n@c2@"
  es: "@aTorneko@bY volvería a apostar a que nunca volvierás a encontrar una cosa igual.\n@c2@"
  fr: "@aTorneko@bEt je suis aussi prêt à parier l'autre que vous n'en trouverez pas deux comme ça.\n@c2@"
  it: "@aBaldo@bE scommetto tre dita della mi' mano sinistra che 'unn esiste un'altra armatura del genere in tutt'immondo.\n@c2@"
  ja: "@a@bトルネコ「しかも　このよろいは\n\tおそらく　二度と\n\t手に　入らないでしょう。\n@c2@"
"236":
  de: "@aTorneko@bIch würd' sie auf keinen Fall verkaufen. Ist schließlich was ganz Wertvolles.\n@c2@"
  en: "@aTorneko@bSo I wouldn't be sellin' it now.\nYou take good care of it.\n@c2@"
  es: "@aTorneko@bAsí que yo que tú no la vendiería ahora.\nGuárdiala bien.\n@c2@"
  fr: "@aTorneko@bJe ne la vendrais pas, à votre place.\nFaites-y bien attention.\n@c2@"
  it: "@aBaldo@bAl tu' posto, 'un la venderei. A nessun prezzo.\n@c2@"
  ja: "@a@bトルネコ「とにかく　売ったりせずに\n\t大切にすべきですな。\n@c2@"
"237":
  de: "@aTorneko@bHm... Das ist einfach ein Schild aus Tierhaut.\n@c2@"
  en: "@aTorneko@bHm... 'Tis nuttin' more than a shield made from animal hide.\n@c2@"
  es: "@aTorneko@bMmm... No es miás que un escudo de piel de animal.\n@c2@"
  fr: "@aTorneko@bMmm... Ce n'est qu'un simple bouclier en peau.\n@c2@"
  it: "@aBaldo@bBoh, questo l'è un semplice scudo fatto con pelli d'animale.\n@c2@"
  ja: "@a@bトルネコ「ふむ……。\n\tこれは　動物の皮でできた\n\tたてですな。\n@c2@"
"238":
  de: "@aTorneko@bHm... Das ist ein Lederschild mit robusten Schuppenplatten.\n@c2@"
  en: "@aTorneko@bHm... 'Tis a leather shield clad in hard scales, so it is.\n@c2@"
  es: "@aTorneko@bMmm... Es un escudo de cuero cubierto de escamas duras, sí.\n@c2@"
  fr: "@aTorneko@bMmm... Il s'agit d'un bouclier de cuir recouvert d'écailles dures.\n@c2@"
  it: "@aBaldo@bUno scudo di pelle rivestito con delle scaglie resistenti. Bellino, ma nulla di straordinario.\n@c2@"
  ja: "@a@bトルネコ「ふむ……。\n\tこれは　皮のたての表面に\n\t固いうろこを　貼ったものです。\n@c2@"
"239":
  de: "@aTorneko@bSehr solide und leicht, ist also äußerst praktisch.\n@c2@"
  en: "@aTorneko@bⓙTis good an' light, so it should be nice an' easy to use.\n@c2@"
  es: "@aTorneko@bEs riobusto y ligero, así que sierá cómodo de usar.\n@c2@"
  fr: "@aTorneko@bIl est léger et de bonne qualité, ce qui doit le rendre assez simple et agréable à utiliser.\n@c2@"
  it: "@aBaldo@bPerò è leggero, huindi l'è parecchio maneggevole, ma parecchio tanto.\n@c2@"
  ja: "@a@bトルネコ「軽く　できているので\n\tなかなか使える　たてですね。\n@c2@"
"240":
  de: "@aTorneko@bAh, dieser Schild hier wurde aus Eisen gefertigt.\n@c2@"
  en: "@aTorneko@bAye, 'tis made of iron, to be sure.\n@c2@"
  es: "@aTorneko@bEstá hecho de hierro, sí.\n@c2@"
  fr: "@aTorneko@bAh, si c'est pas du fer, çaⓠ\n@c2@"
  it: "@aBaldo@bQuest'affare huì l'è tutto in ferro.\n@c2@"
  ja: "@a@bトルネコ「ふむ……。\n\tこれは　鉄でできた　たてです。\n@c2@"
"241":
  de: "@aTorneko@bIst natürlich ein wenig schwer, und man muss schon kräftig sein, um ihn benutzen zu können.\n@c2@"
  en: "@aTorneko@bⓙTis a wee bit heavy, though, so ye'll need some meat on ya to use it.\n@c2@"
  es: "@aTorneko@bEs algo piesado. Si neciesita un poco de músculo para usarlo.\n@c2@"
  fr: "@aTorneko@bIl est peut-être un peu lourd.\nIl vaut mieux être costaud pour s'en servir.\n@c2@"
  it: "@aBaldo@bSi tratta d'uno scudo bello pesante, huindi pole esse' usato solo da una persona robusta.\n@c2@"
  ja: "@a@bトルネコ「ちょっと重たいので\n\tちからのある人にしか\n\t装備は　できませんね。\n@c2@"
"242":
  de: "@aTorneko@bHier haben wir einen prächtigen Schild.\n@c2@"
  en: "@aTorneko@bNow this is a grand ole shield.\n@c2@"
  es: "@aTorneko@bEs un escudo espliéndido.\n@c2@"
  fr: "@aTorneko@bÇa, c'est du bouclierⓠ\n@c2@"
  it: "@aBaldo@bMaremmina! Huesto scudo l'è un capolavoro!\n@c2@"
  ja: "@a@bトルネコ「ほうほう……。\n\tこの　たては　すばらしいですね。\n@c2@"
"243":
  de: "@aTorneko@bIst ein prima Schutz im Kampf! Man kann ihn aber auch als Gegenstand verwenden.\n@c2@"
  en: "@aTorneko@bⓙTis fine fer defence, o' course, but ye can use it as an item in battle as well.\n@c2@"
  es: "@aTorneko@bIdeal para defiensa, claro, pero también si puede usar como objeto en combate.\n@c2@"
  fr: "@aTorneko@bC'est très bien pour vous défendre, mais vous pouvez aussi l'utiliser comme objet au combat.\n@c2@"
  it: "@aBaldo@bOltre a esse' un effihace strumento di difesa, l'è anche molto utile se l'usi home oggetto durante le battaglie.\n@c2@"
  ja: "@a@bトルネコ「防御力も　相当ですが\n\t道具として使うと　思わぬ効果が\n\tありそうですぞ。\n@c2@"
"244":
  de: "@aTorneko@bHm... Was ist das denn? Hab wohl 'ne Stelle am Kinn vergessen, heut' Morgen beim Rasieren...\n@c2@"
  en: "@aTorneko@bHm... Would ye look at that? I only missed a patch when I was shavin' this mornin'.\n@c2@"
  es: "@aTorneko@bMmm... Vaya, fíjate. Mi he diejado un triozo de cara sin afeitar esta mañana.\n@c2@"
  fr: "@aTorneko@bMmm... Dites, j'ai l'impression que j'ai oublié un bout en me rasant ce matin, nonⓡ\n@c2@"
  it: "@aBaldo@bUhm... Fammi un po' vede'...\nLo sapevo, ho lasciato hualche pelo stamane huando mi so' fatto la barba!\n@c2@"
  ja: "@a@bトルネコ「ふ～む……。\n\t私　今日はちょっと　ヒゲの\n\tそりのこしが　ありますね……。\n@c2@"
"245":
  de: "@aTorneko@b... 'Tschuldigung. Hab mich nur gerade selbst gesehen in diesem Spiegelschild.\n@c2@"
  en: "@aTorneko@b...Sorry. I just caught a look at meself in the mirror on this shield.\n@c2@"
  es: "@aTorneko@bEh, lo siento. Es que mi he visto refliejado en el espejo del escudo.\n@c2@"
  fr: "@aTorneko@b... Pardon. Je me suis juste un peu regardé dans le miroir de ce bouclier.\n@c2@"
  it: "@aBaldo@bOh, scusami! Mi so' visto riflesso nello specchio incastonato nello scudo.\n@c2@"
  ja: "@a@bトルネコ「……っと　思わず\n\tたての表面についている鏡に\n\t見入ってしまいました。\n@c2@"
"246":
  de: "@aTorneko@bAber er ist mehr als bloß ein Spiegel. Mit ihm kann man bestimmt die Zauber des Gegners reflektieren.\n@c2@"
  en: "@aTorneko@bBut it's more than a vanity mirror. It looks like ye can reflect yer opponents' spells with it, too.\n@c2@"
  es: "@aTorneko@bPero no es solo un espiejo para miriarse. Creo que con él puedes rieflejar también los conjuros de tus oponientes.\n@c2@"
  fr: "@aTorneko@bIl ne sert pas seulement à se refaire une beauté.\nIl permet aussi de renvoyer les sorts des adversaires.\n@c2@"
  it: "@aBaldo@bMa 'unn è uno specchietto da bagno, huesto huì. Pole riflette' l'incantesimi che l'avversari ti lanciano hontro, sai?\n@c2@"
  ja: "@a@bトルネコ「この鏡なら　敵の魔法を\n\t呪文をとなえた相手に\n\tはね返すことが　できそうですぞ。\n@c2@"
"247":
  de: "@aTorneko@bOha, das ist aber ein mächtig feiner Schild, den Ihr da habt!\n@c2@"
  en: "@aTorneko@bWell now, that's a grand auld shield you're holdin' on to there!\n@c2@"
  es: "@aTorneko@b¡Vaya, fíjiate en este magnífico escudo!\n@c2@"
  fr: "@aTorneko@bNom d'un chien, c'est un formidable bouclier que vous avez làⓠ\n@c2@"
  it: "@aBaldo@bMaremma bellina! Che scudo di gran pregio ch'è huesto huì!\n@c2@"
  ja: "@a@bトルネコ「おおっ！\n\tこの　たては　じつに\n\tすばらしいものですぞ！\n@c2@"
"248":
  de: "@aTorneko@bMan kann ihn als Gegenstand im Kampf verwenden und einen teuflischen Sturm heraufbeschwören.\n@c2@"
  en: "@aTorneko@bYe can use it like an item in battle and bring a devil of a wind to bear on yer enemies.\n@c2@"
  es: "@aTorneko@bPuedes usiarlo como objieto en combate para enviar un viento terrorífico que aziotará a tus eniemigos.\n@c2@"
  fr: "@aTorneko@bVous pouvez vous en servir comme objet lors des combats et faire souffler un véritable blizzard sur vos adversaires.\n@c2@"
  it: "@aBaldo@bPoi usarlo come oggetto 'nbattaglia pe' scatena' contro i tu' nemici un ventaccio di huelli forti.\n@c2@"
  ja: "@a@bトルネコ「この　たてを道具として\n\t使えば　風神のチカラで　敵を\n\t吹き飛ばすことができるでしょう。\n@c2@"
"249":
  de: "@aTorneko@bUnd wenn man sich mit ihm ausrüstet, ist man hervorragend geschützt.\n@c2@"
  en: "@aTorneko@bAn' just equippin' yerself with it'll improve yer defence no end.\n@c2@"
  es: "@aTorneko@bCon solo equipiarlo, tu defiensa mejorará en gran miedida.\n@c2@"
  fr: "@aTorneko@bSi vous vous en équipez, vous améliorerez considérablement votre défense.\n@c2@"
  it: "@aBaldo@bSenza conta' che, se l'aggiungi al tu' equipaggiamento, le tu' hapacità difensive aumenteranno di parecchio.\n@c2@"
  ja: "@a@bトルネコ「装備しているだけでも\n\tこれは　相当の防御力が\n\tありますぞ！\n@c2@"
"250":
  de: "@aTorneko@bHmm... Dieser Schild besteht aus der Haut und den Schuppen eines Drachen.\n@c2@"
  en: "@aTorneko@bHmm... 'Tis a shield made from the skin and scales of a dragon.\n@c2@"
  es: "@aTorneko@bMmm... Este escudo está hecho de piel y escamas de driagón.\n@c2@"
  fr: "@aTorneko@bMmm... Ce bouclier a été fabriqué avec de la peau et des écailles de dragon.\n@c2@"
  it: "@aBaldo@bHuesto scudo l'è fatto hon le scaglie e la pelle d'un drago.\n@c2@"
  ja: "@a@bトルネコ「ふむ……。\n\tこれは　ドラゴンの皮やうろこから\n\t作られた　たてですね。\n@c2@"
"251":
  de: "@aTorneko@bEr ist gegen jede Art von Temperatur gefeit und schützt seinen Träger sowohl gegen Feuer- als auch Kälteangriffe.\n@c2@"
  en: "@aTorneko@bIt can stand up to wild changes in temperature, so it'll save y'against fire or ice attacks, fer example.\n@c2@"
  es: "@aTorneko@bSoporta cambios bruscos de tiemperatura, así que ti protiegerá contra los ataques de fuego y de hielo, por ejemplo.\n@c2@"
  fr: "@aTorneko@bIl peut supporter des écarts de température assez importants. Il vous protégera donc des attaques de glace ou de feu, par exemple.\n@c2@"
  it: "@aBaldo@bPole sopporta' grandi hambiamenti di temperatura, huindi l'è ideale per resiste' all'attacchi di foho e a quelli di ghiaccio.\n@c2@"
  ja: "@a@bトルネコ「熱の変化に　非常に強く\n\t炎やふぶきの攻撃などから\n\t身を　守ってくれるでしょう。\n@c2@"
"252":
  de: "@aTorneko@bAh! Dieser Schild ist Teil der legendären Zenithia-Ausrüstung.\n@c2@"
  en: "@aTorneko@bAh! Part o' the legendary Zenithian Equipment, so it is.\n@c2@"
  es: "@aTorneko@b¡Ah! Parte del legiendario equipo de Zenithia.\n@c2@"
  fr: "@aTorneko@bAhⓠ C'est une partie du légendaire Équipement zénithien.\n@c2@"
  it: "@aBaldo@bOh, ma huesto l'è uno dei pezzi che compongono il leggendario Equipaggiamento Zenithiano!\n@c2@"
  ja: "@a@bトルネコ「おお……。\n\tこれは　まぎれもなく\n\t伝説の防具の　ひとつです。\n@c2@"
"253":
  de: "@aTorneko@bJa, dieser Schild schützt einen vor allen möglichen Dingen.\n@c2@"
  en: "@aTorneko@bAye, this shield'll give ya protection from all manner o' calamities.\n@c2@"
  es: "@aTorneko@bSí, este escudo ti protiegerá contra desventuras de todo tipo.\n@c2@"
  fr: "@aTorneko@bCe bouclier vous protégera de toutes les attaques.\n@c2@"
  it: "@aBaldo@bForse te 'un lo sai, ma questo scudo offre grande protezione dall'attacchi di tutti i tipi.\n@c2@"
  ja: "@a@bトルネコ「天空の大いなる守りが\n\tこの　たてを持つ者を　あらゆる\n\t災いから　守ってくれるでしょう。\n@c2@"
"254":
  de: "@aTorneko@bEs versteht sich von selbst, dass nur %O960%X%A090%Xein großer Held%Z%B090%Xeine große Heldin%Z wie Ihr%Y%A090%Xder große Held%Z%B090%Xdie große Heldin%Z, %a00090,%Z ihn benutzen kann.\n@c2@"
  en: "@aTorneko@bIt goes without sayin' I s'pose, that only %O960%Xa great %A090%Xhero%Z%B090%Xheroine%Z such as yerself%Ythe great %A090%Xhero%Z%B090%Xheroine%Z, %a00090,%Z can equip it.\n@c2@"
  es: "@aTorneko@bNi que diecir tiene que solo %O960%X%A090%Xun gran héroe%Z%B090%Xuna gran heroína%Z como tú%Y%A090%Xel gran héroe%Z%B090%Xla gran heroína%Z, %a00090,%Z puede equiparlo.\n@c2@"
  fr: "@aTorneko@bJ'enfonce peut-être des portes ouvertes, mais %O960%X%A090%Xseul un grand héros%Z%B090%Xseule une grande héroïne%Z comme vous%Y%A090%Xseul le grand héros%Z%B090%Xseule la grande héroïne%Z %a00090%Z peut s'en équiper.\n@c2@"
  it: "@aBaldo@bSolamente %O960%X%A090%Xun grande eroe%Z%B090%Xuna leggendaria eroina%Z come te%Y%A090%Xil grande eroe%Z%B090%Xla leggendaria eroina%Z, %a00090,%Z pole aggiungerlo all'equipaggiamento.\n@c2@"
  ja: "@a@bトルネコ「これを装備できるのは\n\tもちろん　勇者である\n\t%a00090さんだけです。\n@c2@"
"255":
  de: "@aTorneko@bUnd außerdem ist er viel zu wertvoll, um verkauft zu werden.\n@c2@"
  en: "@aTorneko@bAnd I'm guessin' it'd be far too dear fer a normal shop to trade in.\n@c2@"
  es: "@aTorneko@bY no creo equiviocarme si ti digo que es diemasiado caro para una tienda normal.\n@c2@"
  fr: "@aTorneko@bEt j'imagine qu'aucun marchand ordinaire n'aurait les moyens de vous l'acheter.\n@c2@"
  it: "@aBaldo@bSehondo me, l'è un oggetto troppo prezioso pe' venderlo a una bottega qualunque.\n@c2@"
  ja: "@a@bトルネコ「これは　あまりに\n\t高価すぎて　普通の店屋では\n\t引き取ってくれないでしょうね。\n@c2@"
"256":
  de: "@aTorneko@bEin Flüssigmetallschild?!\n@c2@"
  en: "@aTorneko@bA liquid metal shield!?\n@c2@"
  es: "@aTorneko@b¡¿Un escudo metalíquido?!\n@c2@"
  fr: "@aTorneko@bUn bouclier de mercureⓠⓑ\n@c2@"
  it: "@aBaldo@bUno Scudo rinforzato?!\n@c2@"
  ja: "@a@bトルネコ「ぬおっ！\n\tこれは　はぐれメタルのたて！！\n@c2@"
"257":
  de: "@aTorneko@bEs gibt keinen besseren Schutz als diesen Schild.\n@c2@"
  en: "@aTorneko@bIf defence is yer game, ya won't do better than this shield.\n@c2@"
  es: "@aTorneko@bSi lo tuyo es la diefensa, este escudo es tu miejor opción.\n@c2@"
  fr: "@aTorneko@bSi votre truc, c'est la défense, n'allez pas chercher plus loin.\n@c2@"
  it: "@aBaldo@bSe ti garba ave' molta protezione, 'un c'è nulla di meglio di huest'aggeggino huì!\n@c2@"
  ja: "@a@bトルネコ「防御力という点を\n\t重視すれば　この　たては\n\t地上最強と言っても　いいでしょう。\n@c2@"
"258":
  de: "@aTorneko@bEs heißt, dass er aus flüssigem Metall gefertigt wurde, aber ob das auch stimmt, weiß ich nicht.\n@c2@"
  en: "@aTorneko@bSome say it's really made from liquid metal, but I don't know the truth of it.\n@c2@"
  es: "@aTorneko@bHay quien dice que realmiente está fabricado con metal líquido, pero yo no estoy muy seguro.\n@c2@"
  fr: "@aTorneko@bCertains disent qu'il est vraiment fait en métal liquide, mais je ne sais pas si c'est vrai.\n@c2@"
  it: "@aBaldo@bC'è chi dice sia fatto con metallo liquido, ma io 'un lo so se sia vero o meno.\n@c2@"
  ja: "@a@bトルネコ「材料に　はぐれメタルは\n\t使われていないとも聞きますが\n\t本当のことは　わかりません。\n@c2@"
"259":
  de: "@aTorneko@bEs kann auch sein, dass er einfach nur danach benannt wurde, weil er so unglaublich hart ist.\n@c2@"
  en: "@aTorneko@bOthers say it was just named after bein' so hard like it is.\n@c2@"
  es: "@aTorneko@bTambién dicen que el nombrie tiene que ver con lo duro que es.\n@c2@"
  fr: "@aTorneko@bD'autres pensent que c'est justement parce qu'il est très dur qu'on lui a donné ce nom.\n@c2@"
  it: "@aBaldo@bPare che il su' nome derivi dal fatto che l'è davvero parecchio robusto, ma parecchio tanto.\n@c2@"
  ja: "@a@bトルネコ「その固さが　はぐれメタルを\n\t思わせるから　この名がついた……\n\tという説も　あるのです。\n@c2@"
"260":
  de: "@aTorneko@b%0%a00220 %D220%Xkann%Ykönnen%Z damit ausgerüstet werden.\n@c2@"
  en: "@aTorneko@b%0%a00220 can be equipped with it.\n@c2@"
  es: "@aTorneko@bPuede ser equipado por %0%a00220.\n@c2@"
  fr: "@aTorneko@b%0%a00220 %D220%Xpeut%Ypeuvent%Z s'en équiper.\n@c2@"
  it: "@aBaldo@bQuesto scudo pole esse' aggiunto all'equipaggiamento di %a00220.\n@c2@"
  ja: "@a@bトルネコ「これを装備できるのは\n\t%a00220。\n@c2@"
"261":
  de: "@aTorneko@bAber ich wohl nicht... Na egal! Immer schön drauf aufpassen, einverstanden?\n@c2@"
  en: "@aTorneko@bBut it doesn't look like I can use it meself. Just my luck! Anyway, be sure to look after it, won't ye?\n@c2@"
  es: "@aTorneko@bPero crieo que yo no podría. ¡Mala suerte! Bueno, sobrie todo cuídalo bien.\n@c2@"
  fr: "@aTorneko@bDommage que je puisse pas m'en servir... tant pisⓠ\nEn tout cas, faites-y bien attentionⓠ\n@c2@"
  it: "@aBaldo@bIo 'un lo posso inseri' nel mi' equipaggiamento... Che sfortuna, eh? Comunque, ti suggerisco di averne molta hura, perché potrebbe tornarti utile.\n@c2@"
  ja: "@a@bトルネコ「残念ながら　私は\n\t装備できないようです。　とにかく\n\tこの　たては大切にしましょう！\n@c2@"
"262":
  de: "@aTorneko@bWo zum Teufel kommt dieser Schild denn her?!\n@c2@"
  en: "@aTorneko@bWhere the devil did this shield come from!?\n@c2@"
  es: "@aTorneko@b¡¿De dóndie has sacado tú este escudo?!\n@c2@"
  fr: "@aTorneko@bOù est-ce que vous avez déniché ce bouclierⓠⓑ\n@c2@"
  it: "@aBaldo@bMa dove l'hai preso huesto scudo?!\n@c2@"
  ja: "@a@bトルネコ「な…なんなんだ！？\n\tこの　たてはっ！？\n@c2@"
"263":
  de: "@aTorneko@bEr hat einen eigenen Geist, jawohl. So als wollte er seinen Träger überrumpeln.\n@c2@"
  en: "@aTorneko@bIt's a mind of its own, so it does.\nLike it wants to overpower its bearer.\n@c2@"
  es: "@aTorneko@bEste escudo piensa por sí mismo, ¿sabes?\nComo si quisiera dominiar a quien lo lleva.\n@c2@"
  fr: "@aTorneko@bIl a une âme propre. Comme s'il voulait prendre le dessus sur son propriétaire.\n@c2@"
  it: "@aBaldo@bPare che sia lui a vole' comanda' chi lo impugna.\nSembra huasi c'abbia una volontà tutta sua!\n@c2@"
  ja: "@a@bトルネコ「この　持つ者を\n\t圧倒する　存在感は　いったい\n\tどこから　来ているのか……！\n@c2@"
"264":
  de: "@aTorneko@bSo was findet man in Bruckstetten nicht an jeder Straßenecke.\n@c2@"
  en: "@aTorneko@bAye, this isn't the kind of item ye'll find on every street corner in Ballymoral.\n@c2@"
  es: "@aTorneko@bNo es un objieto que si encuentre en cualquier esquina de Alcazaba.\n@c2@"
  fr: "@aTorneko@bC'est pas le genre de truc que vous trouverez à tous les coins de rue.\n@c2@"
  it: "@aBaldo@bEh, no. Huesto 'unn è proprio uno scudo che si trova 'ntutte le botteghe. L'è parecchio partiholare, ma parecchio tanto.\n@c2@"
  ja: "@a@bトルネコ「とにかく　この　たては\n\tそんじょそこらの　たてとは\n\tわけが　違いますよ！\n@c2@"
"265":
  de: "@aTorneko@bIch würd' mein Leben darauf verwetten, dass kein menschliches Wesen ihn tragen kann.\n@c2@"
  en: "@aTorneko@bAn' I'd bet me life that there's no human that can use it.\n@c2@"
  es: "@aTorneko@bApostaría cualquier cosa a que ningún humano puede utiliziarlo.\n@c2@"
  fr: "@aTorneko@bEn plus, je suis prêt à parier qu'aucun humain ne saurait s'en servir.\n@c2@"
  it: "@aBaldo@bE ci scommetterei l'incasso della giornata che 'un pole esse' usato da nessun essere umano.\n@c2@"
  ja: "@a@bトルネコ「私たち　人間では\n\tこの　たてを　装備することは\n\tできないでしょうな……。\n@c2@"
"266":
  de: "@aTorneko@bUnd ich wett auch darauf, dass dieser Schild einzigartig ist.\n@c2@"
  en: "@aTorneko@bNor will y'ever find another like it.\n@c2@"
  es: "@aTorneko@bY nunca encontriarás otro igual.\n@c2@"
  fr: "@aTorneko@bEt que vous n'en trouverez pas deux comme ça.\n@c2@"
  it: "@aBaldo@bUn credo in giro ne troverai un altro come questo.\n@c2@"
  ja: "@a@bトルネコ「しかも　この　たては\n\tおそらく　二度と\n\t手に　入らないでしょう。\n@c2@"
"267":
  de: "@aTorneko@bIch würd' ihn auf keinen Fall verkaufen.\n@c2@"
  en: "@aTorneko@bI wouldn't be sellin' it if I were you.\n@c2@"
  es: "@aTorneko@bYo no lo vendiería por nada del mundo.\n@c2@"
  fr: "@aTorneko@bSi j'étais vous, je ne le vendrais pas.\n@c2@"
  it: "@aBaldo@bAl tu' posto, 'un mi separerei da huesto scudo.\n@c2@"
  ja: "@a@bトルネコ「とにかく　売ったりせずに\n\t大切にすべきですな。\n@c2@"
"268":
  de: "@aTorneko@bHm... Gar nicht schlecht, um seinen ollen Schädel zu schützen. Ein solider Hut aus Tierhaut.\n@c2@"
  en: "@aTorneko@bHm... 'Tisn't a bad piece o' gear to protect yer noggin. A sturdy cap made of animal hide.\n@c2@"
  es: "@aTorneko@bMmm... No está mal para protiegerse la cocorota. Un gorro robiusto hecho de piel de animal.\n@c2@"
  fr: "@aTorneko@bMmm... Avec ça, vous aurez la tête à peu près protégée. C'est un solide couvre-chef en peau. \n@c2@"
  it: "@aBaldo@bBeh, huesto l'è un gran bel cappello. È resistente, perché è realizzato con pelle d'animale. Protegge tutte le teste, anche huelle vote. Ehm...\n@c2@"
  ja: "@a@bトルネコ「ふむ……。\n\t動物の皮でできた　ぼうしです。\n\t頭へのダメージを　おさえます。\n@c2@"
"269":
  de: "@aTorneko@bJa, damit kann man seinen Kopf ein wenig schützen.\n@c2@"
  en: "@aTorneko@bAye, this is one of them yokes fer protectin' yer noggin.\n@c2@"
  es: "@aTorneko@bSí, es una de esas cintas para protegierse la cabeza.\n@c2@"
  fr: "@aTorneko@bAh, c'est un de ces trucs qui protègent le ciboulot.\n@c2@"
  it: "@aBaldo@bHuesto bell'oggettino serve a ripara' i'ccapo di chi lo indossa.\n@c2@"
  ja: "@a@bトルネコ「ふむ……。\n\tこれは　頭へのダメージを\n\tおさえるための　防具ですね。\n@c2@"
"270":
  de: "@aTorneko@bUnd es ist auch ein elegantes Accessoire für die Damen.\n@c2@"
  en: "@aTorneko@bIt'd look grand on the ladies, so it would.\n@c2@"
  es: "@aTorneko@bA las damas les sienta muy bien.\n@c2@"
  fr: "@aTorneko@bÇa fait très bien sur les dames.\n@c2@"
  it: "@aBaldo@bE sta partiholarmente bene alle donne.\n@c2@"
  ja: "@a@bトルネコ「女性が　これを\n\t身につければ　きっと\n\tさぞ　かわいらしいでしょうな。\n@c2@"
"271":
  de: "@aTorneko@b%0%a00220 %D220%Xkann%Ykönnen%Z damit ausgerüstet werden.\n@c2@"
  en: "@aTorneko@b%0%a00220 can be equipped with it.\n@c2@"
  es: "@aTorneko@bPuede ser equipada %0%a00220.\n@c2@"
  fr: "@aTorneko@b%0%a00220 %D220%Xpeut%Ypeuvent%Z s'en équiper.\n@c2@"
  it: "@aBaldo@bA prima vista, direi che pole esse' aggiunto all'equipaggiamento di %a00220.\n@c2@"
  ja: "@a@bトルネコ「これを装備できるのは\n\t%a00220。\n@c2@"
"272":
  de: "@aTorneko@bIch... Nein, ich möchte das nicht anziehen. Nicht hier vor allen Leuten.\n@c2@"
  en: "@aTorneko@bI'dⓚⓛ No, I'd rather not put it on. Not in front of everyone, like.\n@c2@"
  es: "@aTorneko@bYo... No, miejor no mi la pongo. Al menos, no dielante de todo el mundo.\n@c2@"
  fr: "@aTorneko@bJe... Non, je préfère autant pas le mettre.\nPas devant tout le monde. Ça me gêne.\n@c2@"
  it: "@aBaldo@bIo invece 'un lo metterei mai.\nNon in pubblico, almeno!\n@c2@"
  ja: "@a@bトルネコ「いやぁ～～。\n\tさすがに　私が　これを\n\t身につけるのは　やめておきます。\n@c2@"
"273":
  de: "@aTorneko@bDas Teil würd' wahrscheinlich %a00750 Goldmünze%H750%X%Yn%Z einbringen, wenn man's im Geschäft verkauft.\n@c2@"
  en: "@aTorneko@bIt'd fetch about %a00750 gold coin%H750%X%Ys%Z if ya sold it in a shop.\n@c2@"
  es: "@aTorneko@bSacarías más o menos %a00750 monieda%H750%X%Ys%Z de oro si la viendieses en una tienda.\n@c2@"
  fr: "@aTorneko@bVous pourriez en tirer %a00750 pièce%I750%X%Ys%Z d'or dans un magasin.\n@c2@"
  it: "@aBaldo@bSe lo vendi a una bottega, ci farai %a00750 %H750%Xmoneta%Ymonete%Z d'oro.\n@c2@"
  ja: "@a@bトルネコ「もし店屋に売れば\n\t%a00750ゴールドに\n\tなるでしょうな。\n@c2@"
"274":
  de: "@aTorneko@bHm... Ein ausgehöhltes Holzstück in der Form eines Helmes.\n@c2@"
  en: "@aTorneko@bHm... 'Tis a hollowed out piece o' wood that's been fashioned into a hat.\n@c2@"
  es: "@aTorneko@bMmm... Es un trozo de madiera hueca tallada en forma de gorro.\n@c2@"
  fr: "@aTorneko@bMmm... C'est un morceau de bois qui a été évidé pour en faire un casque.\n@c2@"
  it: "@aBaldo@bHuesto hoprihapo è stato rihavato da un pezzo di legno honsacrato.\n@c2@"
  ja: "@a@bトルネコ「ふむ……。\n\tこれは　木をくりぬいて作った\n\tぼうしですね。\n@c2@"
"275":
  de: "@aTorneko@bIst die normale Kopfbedeckung aller fahrenden Händler.\n@c2@"
  en: "@aTorneko@bAye, 'tis yer bog standard gear fer travellin' salesmen an' that.\n@c2@"
  es: "@aTorneko@bEs una prienda sencilla estándar para buhonieros y eso.\n@c2@"
  fr: "@aTorneko@bC'est le type de couvre-chef que portent tous les marchands itinérants.\n@c2@"
  it: "@aBaldo@bDi solito lo indossano i hommessi viaggiatori, i mercanti che girano i'mmondo e altri bighelloni erranti.\n@c2@"
  ja: "@a@bトルネコ「旅人の装備としては\n\tごく標準的なものと　言えますね。\n@c2@"
"276":
  de: "@aTorneko@bNur schade, dass man damit wie ein Holzkopf aussieht...\n@c2@"
  en: "@aTorneko@bJust a shame it makes ya look like such a gobdaw...\n@c2@"
  es: "@aTorneko@bEs una lástima que ti haga pariecer un lechuguino...\n@c2@"
  fr: "@aTorneko@bC'est dommage que ça donne un air un peu crétin...\n@c2@"
  it: "@aBaldo@bPeccato che faccia sembra' un po' ridiholo chi l'indossa...\n@c2@"
  ja: "@a@bトルネコ「かぶると　ちょっと\n\tかっこわるいというのが\n\t難点ですが……。\n@c2@"
"277":
  de: "@aTorneko@bHm... Ein aus Eisen gefertigter Helm.\n@c2@"
  en: "@aTorneko@bHm...a helmet worked from iron.\n@c2@"
  es: "@aTorneko@bMmm... Es un yelmo de hierro.\n@c2@"
  fr: "@aTorneko@bMmm... Un casque tout en fer.\n@c2@"
  it: "@aBaldo@bToh! Ganzo huest'Elmo di ferro.\n@c2@"
  ja: "@a@bトルネコ「ふむ……。\n\tこれは　鉄ごしらえの\n\tかぶとですね。\n@c2@"
"278":
  de: "@aTorneko@bIst 'ne gute Wahl für den Abenteurer von Welt.\n@c2@"
  en: "@aTorneko@bA grand choice fer a seasoned adventurer, in my opinion.\n@c2@"
  es: "@aTorneko@bUna elección pierfecta para un aventuriero veterano, eso pienso yo.\n@c2@"
  fr: "@aTorneko@bSi vous voulez mon avis, c'est ce que devrait porter tout aventurier qui se respecte.\n@c2@"
  it: "@aBaldo@bUn affare del genere l'è parecchio ambito dall'avventurieri esperti.\n@c2@"
  ja: "@a@bトルネコ「この　かぶとを\n\t装備するころには　すっかり\n\t冒険もベテランというとこですね。\n@c2@"
"279":
  de: "@aTorneko@bHmm... Mit dieser Maske sind der Kopf und das Gesicht gut geschützt.\n@c2@"
  en: "@aTorneko@bHmm... Ye'd save yer head and face a bit wearin' one o' these.\n@c2@"
  es: "@aTorneko@bMmm... Esto ti protegerá bien la cabieza y el rostro.\n@c2@"
  fr: "@aTorneko@bMmm... En mettant ça, vous protégez à la fois votre tête et votre visage.\n@c2@"
  it: "@aBaldo@bUhm... Huesta maschera protegge effihacemente i'vvolto e i'ccapo.\n@c2@"
  ja: "@a@bトルネコ「ふむふむ……。\n\tこれは　頭部や顔面への\n\tダメージをおさえる防具です。\n@c2@"
"280":
  de: "@aTorneko@bIst natürlich nicht besonders hübsch, aber praktisch ist sie allemal.\n@c2@"
  en: "@aTorneko@bⓙTisn't the prettiest bit o' gear goin', but fair's fair, it does its job, like.\n@c2@"
  es: "@aTorneko@bNo es el tocado más hermioso del mundo, pero cumple su función, sí.\n@c2@"
  fr: "@aTorneko@bC'est pas vraiment esthétique, mais c'est efficace et c'est ça l'important.\n@c2@"
  it: "@aBaldo@bCerto, 'un ti farà sembra' bello home un dio, ma huesto l'è i'pprezzo che bisogna paga' pe' sta' più al sihuro.\n@c2@"
  ja: "@a@bトルネコ「ちょっと　見た目に\n\t好きキライは　あるでしょうが\n\tなかなか　よいものですぞ。\n@c2@"
"281":
  de: "@aTorneko@bAh, eine geflügelte Kappe.\n@c2@"
  en: "@aTorneko@bAh, 'tis a cracker of a cap, so it is.\n@c2@"
  es: "@aTorneko@bUn gorro espliéndido, en mi opinión.\n@c2@"
  fr: "@aTorneko@bÇa, c'est un chouette couvre-chef.\n@c2@"
  it: "@aBaldo@bMaremma agghindata!\nHuesto sì che l'è un gran bel coprihapo!\n@c2@"
  ja: "@a@bトルネコ「ふむ……。\n\tこれはまた　かわいらしい\n\tぼうしですな。\n@c2@"
"282":
  de: "@aTorneko@bIst eher was für die Damenwelt, würd' ich sagen...\n@c2@"
  en: "@aTorneko@bLadies' wear, I'd say, if I had to make a distinction.\n@c2@"
  es: "@aTorneko@bEspiecialmente para las damas, diría yo.\n@c2@"
  fr: "@aTorneko@bSi je devais me prononcer, je dirais que ça irait mieux aux dames.\n@c2@"
  it: "@aBaldo@bA guardarlo bene, direi che è roba da donne.\n@c2@"
  ja: "@a@bトルネコ「見るからに　女性用の\n\tぼうしといったところです。\n@c2@"
"283":
  de: "@aTorneko@bFantastisch! Ein Teil der legendären Zenithia-Ausrüstung.\n@c2@"
  en: "@aTorneko@bGorgeous! Part o' the legendary Zenithian Equipment, o' course.\n@c2@"
  es: "@aTorneko@b¡Espliéndido! Parte del legiendario equipo de Zenithia, claro está.\n@c2@"
  fr: "@aTorneko@bMagnifiqueⓠ Un élément du légendaire Équipement zénithien.\n@c2@"
  it: "@aBaldo@bFantastiho!\nHuesto fa parte dell'Equipaggiamento Zenithiano.\n@c2@"
  ja: "@a@bトルネコ「おおっ！\n\tこれは　言うまでもなく\n\t伝説の防具の　ひとつです。\n@c2@"
"284":
  de: "@aTorneko@bSieht nicht gerade sehr stabil aus, was? Aber der Schein trügt.\n@c2@"
  en: "@aTorneko@bIt hardly looks like it covers yer head at all, but there's no need to bother yerself.\n@c2@"
  es: "@aTorneko@bPariece que apenas cubre la cabieza, pero no hay por qué prieocuparse.\n@c2@"
  fr: "@aTorneko@bÀ première vue, vous pouvez vous dire qu'il ne protégera pas votre tête, mais ne vous en faites pas.\n@c2@"
  it: "@aBaldo@bUnn è che copra molto la testa, ma chi l'indossa 'un si deve preoccupa' di huesto dettagliuccio...\n@c2@"
  ja: "@a@bトルネコ「頭を　おおう部分が少なく\n\t見た目は　やや不安ですが\n\tなんの心配も　いりません。\n@c2@"
"285":
  de: "@aTorneko@bDie göttliche Macht Zenithias wird den Träger dieses Helms vor jeglichem Leid bewahren.\n@c2@"
  en: "@aTorneko@bThe divine power of Zenithia will protect ye from any an' every attack, like.\n@c2@"
  es: "@aTorneko@bEl poder divino de Zenithia ti protiegerá de cualquier ataque.\n@c2@"
  fr: "@aTorneko@bLes pouvoirs divins de Zénithia vous protégeront de toutes les attaques.\n@c2@"
  it: "@aBaldo@bI'ppotere divino di Zenithia protegge dall'attacchi di tutti i tipi chi c'ha su i'ccapo huesta bellezza.\n@c2@"
  ja: "@a@bトルネコ「この　かぶとの\n\t聖なるチカラが　あらゆる攻撃から\n\t装備している者を　守るのです。\n@c2@"
"286":
  de: "@aTorneko@bNatürlich kann nur %O960%X%A090%Xein großer Held%Z%B090%Xeine große Heldin%Z wie Ihr%Y%A090%Xder große Held%Z%B090%Xdie große Heldin%Z, %a00090,%Z ihn tragen.\n@c2@"
  en: "@aTorneko@bOf course, 'tis only %O960%Xa great %A090%Xhero%Z%B090%Xheroine%Z such as yerself%Ythe great %A090%Xhero%Z%B090%Xheroine%Z, %a00090,%Z who can wear it.\n@c2@"
  es: "@aTorneko@bNi que diecir tiene que solo %O960%X%A090%Xun gran héroe%Z%B090%Xuna gran heroína%Z como tú%Y%A090%Xel gran héroe%Z%B090%Xla gran heroína%Z, %a00090,%Z puede llevarlo.\n@c2@"
  fr: "@aTorneko@bBien entendu, %O960%X%A090%Xseul un grand héros%Z%B090%Xseule une grande héroïne%Z comme vous%Y%A090%Xseul le grand héros%Z%B090%Xseule la grande héroïne%Z %a00090%Z peut s'en servir.\n@c2@"
  it: "@aBaldo@bNaturalmente, solo %O960%X%A090%Xun grande eroe%Z%B090%Xuna leggendaria eroina%Z come te%Y%A090%Xil grande eroe%Z%B090%Xla leggendaria eroina%Z, %a00090,%Z pole indossarlo.\n@c2@"
  ja: "@a@bトルネコ「これを装備できるのは\n\tもちろん　勇者である\n\t%a00090さんだけです。\n@c2@"
"287":
  de: "@aTorneko@bUnd außerdem könnte kein Händler der Welt dafür zahlen. Der Helm ist viel zu wertvoll, um ihn zu verkaufen.\n@c2@"
  en: "@aTorneko@bAnd no trader would give y'a price fer it.\nIt's far too rare, like.\n@c2@"
  es: "@aTorneko@bY ningún miercader ti hará una ofierta por él.\nEs diemasiado especial.\n@c2@"
  fr: "@aTorneko@bEt je peux vous assurer qu'aucun marchand n'aura les moyens de vous l'acheter. Il est beaucoup trop rare.\n@c2@"
  it: "@aBaldo@bE penso proprio che nessun commerciante ti farà mai un'offerta seria per un oggetto raro come huesto, sai?\n@c2@"
  ja: "@a@bトルネコ「店屋では　この　かぶとの\n\t価値は　まず　わからんでしょう。\n@c2@"
"288":
  de: "@aTorneko@bWo hab ich diese Maske schon mal gesehen...?\n@c2@"
  en: "@aTorneko@bNow where have I seen this mask before...?\n@c2@"
  es: "@aTorneko@bYo he visto esta miáscara antes...\n@c2@"
  fr: "@aTorneko@bOù est-ce que j'ai déjà vu ce masque...ⓡ\n@c2@"
  it: "@aBaldo@bMaremma smemorata!\nMa dov'è che ho già visto huesta maschera?\n@c2@"
  ja: "@a@bトルネコ「ふむ……？\n\tこの　かぶとは　どこかで\n\t見たことが……\n@c2@"
"289":
  de: "@aTorneko@bAh, ja natürlich! Man benutzt so was in diesen ketzerischen Zeremonien.\n@c2@"
  en: "@aTorneko@bAh! Of course! It's what they use in those funny heretical ceremonies, so it is.\n@c2@"
  es: "@aTorneko@b¡Ah! ¡Por supuesto! La utilizan en esas cieremonias heriéticas tan graciosas, sí.\n@c2@"
  fr: "@aTorneko@bMais ouiⓠ C'est le masque que les hérétiques utilisent pour leurs drôles de cérémonies.\n@c2@"
  it: "@aBaldo@bOh, sì! Adesso rihordo! L'è una di huelle che s'usano nelle cerimonie dell'eretici.\n@c2@"
  ja: "@a@bトルネコ「おお！　思いだした！\n\tこれは　とある邪教の儀式に\n\t使われる　面のはずですぞ！\n@c2@"
"290":
  de: "@aTorneko@bIch würd' allerdings zweimal überlegen, bevor ich die Maske hier aufsetze.\n@c2@"
  en: "@aTorneko@bI'd think twice before I put it on, if I were you.\n@c2@"
  es: "@aTorneko@bYo mi lo piensaría antes de poniérmela.\n@c2@"
  fr: "@aTorneko@bÀ votre place, j'y réfléchirais à deux fois avant de le mettre.\n@c2@"
  it: "@aBaldo@bAscoltami bene: se fossi in te, ci penserei du' volte prima di indossarla.\n@c2@"
  ja: "@a@bトルネコ「う～む……。\n\tそういうものですから　これを\n\t装備するのは　ちょっと心配ですね。\n@c2@"
"291":
  de: "@aTorneko@b%0%a00220 %D220%Xkann%Ykönnen%Z damit ausgerüstet werden.\n@c2@"
  en: "@aTorneko@b%0%a00220 can be equipped with it.\n@c2@"
  es: "@aTorneko@bPuede ser equipada por %0%a00220.\n@c2@"
  fr: "@aTorneko@b%0%a00220 %D220%Xpeut%Ypeuvent%Z s'en équiper.\n@c2@"
  it: "@aBaldo@bPole esse' aggiunta all'equipaggiamento di %a00220.\n@c2@"
  ja: "@a@bトルネコ「これを装備できるのは\n\t%a00220。\n@c2@"
"292":
  de: "@aTorneko@bAh, und ich darf mich auch damit ausrüsten.\n@c2@"
  en: "@aTorneko@bAnd it looks like this is sometin' I can equip meself with, too.\n@c2@"
  es: "@aTorneko@bY es algo que yo mismo podría llevar equipiado.\n@c2@"
  fr: "@aTorneko@bApparemment, je peux le mettre, moi aussi.\n@c2@"
  it: "@aBaldo@bA pensarci bene, forse anch'io potrei aggiungerla al mi' equipaggiamento.\n@c2@"
  ja: "@a@bトルネコ「どうやら　私にも\n\t装備できるみたいです。\n@c2@"
"293":
  de: "@aTorneko@bIch glaub nicht, dass viele Händler Interesse an diesem Stück hätten. Würd' nicht viel einbringen.\n@c2@"
  en: "@aTorneko@bI can't see many traders bein' interested in a dodgy item like this. It won't fetch much.\n@c2@"
  es: "@aTorneko@bNo crieo que haya muchos miercaderes interiesados en un objeto tan pieligroso como este. No siacarás mucho por ella.\n@c2@"
  fr: "@aTorneko@bJe ne connais aucun marchand qui voudrait vous acheter un objet aussi douteux.\nVous en tirerez pas grand-chose.\n@c2@"
  it: "@aBaldo@bPerò quest'affare l'è troppo periholoso.\n'Un penso ci rihaveresti molto a venderlo a una bottega.\n@c2@"
  ja: "@a@bトルネコ「この手のものは\n\t店屋でも　いやがられるでしょう。\n\tたいした値は　つかんでしょうな。\n@c2@"
"294":
  de: "@aTorneko@bNa, das ist aber entzückend!\n@c2@"
  en: "@aTorneko@bWhat a funny little hat!\n@c2@"
  es: "@aTorneko@b¡Qué tiocado más gracioso!\n@c2@"
  fr: "@aTorneko@bIl est marrant ce petit couvre-chefⓠ\n@c2@"
  it: "@aBaldo@bMa che coprihapo ganzo l'è questo!\n@c2@"
  ja: "@a@bトルネコ「ふむふむ……。\n\tこれは　かわいらしい。\n\t女性の頭に　かざるものですね。\n@c2@"
"295":
  de: "@aTorneko@bNicht nur ein ausgezeichneter Schutz gegen Angriffe, nein, diese Tiara kann auch Magie abwehren.\n@c2@"
  en: "@aTorneko@bAnd it doesn't just protect y'against attacks, it wards off confusion magic, too.\n@c2@"
  es: "@aTorneko@bY no solo protiege contra los ataques, también es efiectivo contra la magia de confusión.\n@c2@"
  fr: "@aTorneko@bIl vous protège non seulement des attaques, mais aussi des sorts de confusion.\n@c2@"
  it: "@aBaldo@bOltre a ripararti dall'attacchi, respinge anche l'incantesimi di honfusione. 'Unn è miha roba da poho, eh?!\n@c2@"
  ja: "@a@bトルネコ「攻撃を防ぐだけでなく\n\t混乱の呪文も　このかみかざりが\n\t防いでくれそうです。\n@c2@"
"296":
  de: "@aTorneko@b%0%a00220 %D220%Xkann%Ykönnen%Z damit ausgerüstet werden.\n@c2@"
  en: "@aTorneko@b%0%a00220 can be equipped with it.\n@c2@"
  es: "@aTorneko@bPuede ser equipiada por %0%a00220.\n@c2@"
  fr: "@aTorneko@b%0%a00220 %D220%Xpeut%Ypeuvent%Z s'en équiper.\n@c2@"
  it: "@aBaldo@bHuest'affare pole esse' aggiunto all'equipaggiamento di %a00220.\n@c2@"
  ja: "@a@bトルネコ「これを装備できるのは\n\t%a00220。\n@c2@"
"297":
  de: "@aTorneko@bIch könnte sie ja kurz mal aufsetzen... Was? Ich soll nicht? Na gut. Dann eben nicht.\n@c2@"
  en: "@aTorneko@bI s'pose I could just slip it on fer aⓚⓛ Hm? Ye don't want to see? Then I'll save it for later, shall I?\n@c2@"
  es: "@aTorneko@bSupongo que podría poniérmela un mom... ¿Cómo? ¿Qué priefieres no verlo? Entonces mi la guardo para más tarde, ¿vale?\n@c2@"
  fr: "@aTorneko@bJe pourrais peut-être le passer pour voir...\nPardonⓡ Vous voulez pas voir çaⓡ\nJe ferai ça plus tard, alors.\n@c2@"
  it: "@aBaldo@bAspetta, ora lo provo e si vede home mi sta!\nCome? 'Un t'interessa vedermi con huesto berretto su i'ccapo?\n@c2@"
  ja: "@a@bトルネコ「私も　ムリすれば……\n\tえ？　見たくないですか。\n\tじゃあ　やめときます。　はい。\n@c2@"
"298":
  de: "@aTorneko@bDas Teil würd' wahrscheinlich %a00750 Goldmünze%H750%X%Yn%Z einbringen, wenn man's im Geschäft verkauft.\n@c2@"
  en: "@aTorneko@bIt'd fetch about %a00750 gold coin%H750%X%Ys%Z if ya sold it in a shop.\n@c2@"
  es: "@aTorneko@bSacarías más o menos %a00750 monieda%H620%X%Ys%Z de oro si la viendieses en una tienda.\n@c2@"
  fr: "@aTorneko@bVous pourriez en tirer %a00750 pièce%I750%X%Ys%Z d'or dans un magasin.\n@c2@"
  it: "@aBaldo@bSehondo me, se lo vendi a una bottega poi intasca' %a00750 %H750%Xmoneta%Ymonete%Z d'oro.\n@c2@"
  ja: "@a@bトルネコ「もし店屋に売れば\n\t%a00750ゴールドに\n\tなるでしょうな。\n@c2@"
"299":
  de: "@aTorneko@bWelch ein lustiger kleiner Hut!\n@c2@"
  en: "@aTorneko@bWhat a funny little hat!\n@c2@"
  es: "@aTorneko@b¡Qué gorrito más gracioso!\n@c2@"
  fr: "@aTorneko@bQuel drôle de petit chapeauⓠ\n@c2@"
  it: "@aBaldo@bBellino 'sto happello!\n@c2@"
  ja: "@a@bトルネコ「おおっ！\n\tこれは　よいものですな！\n@c2@"
"300":
  de: "@aTorneko@bWenn man ihn aufsetzt und ein wenig damit herumläuft, kann man verbrauchte magische Kräfte wieder auffüllen.\n@c2@"
  en: "@aTorneko@bJust havin' it on yer head and walkin' about the place helps ya recover yer magic power.\n@c2@"
  es: "@aTorneko@bCon siolo andar con él puesto recupieras pioder mágico.\n@c2@"
  fr: "@aTorneko@bIl suffit de le mettre sur sa tête et de se balader pour récupérer de la puissance magique. \n@c2@"
  it: "@aBaldo@bBasta indossarlo e andarci un po' a giro per rehupera' energia magiha.\n@c2@"
  ja: "@a@bトルネコ「この　ぼうしを\n\tかぶっていれば　歩いているだけで\n\t魔力を回復してくれるようですぞ。\n@c2@"
"301":
  de: "@aTorneko@bIst also äußerst praktisch für alle Zauberer.\n@c2@"
  en: "@aTorneko@bSo it'd go nicely on a magic user, I s'pose.\n@c2@"
  es: "@aTorneko@bSupiongo que es ideal para los que usan magia, claro.\n@c2@"
  fr: "@aTorneko@bIl convient donc parfaitement aux spécialistes de la magie.\n@c2@"
  it: "@aBaldo@bIl mi' parere è che è perfetto per chi lancia molti incantesimi.\n@c2@"
  ja: "@a@bトルネコ「当然　呪文の使い手が\n\tこれを　かぶるべきでしょうな。\n@c2@"
"302":
  de: "@aTorneko@bIch fass es nicht, ein Flüssigmetallhelm!\n@c2@"
  en: "@aTorneko@bBless me Lakanaba breeches, it's a liquid metal helm!\n@c2@"
  es: "@aTorneko@b¡Por los rizos de la profieta, es un yelmo mietalíquido!\n@c2@"
  fr: "@aTorneko@bJ'ai bien les yeux en face des trousⓡ\nC'est un casque de mercureⓠ\n@c2@"
  it: "@aBaldo@bMaremma lihuida!\nMa huesto l'è un Elmo rinforzato!\n@c2@"
  ja: "@a@bトルネコ「ぬおーーっ！\n\tこいつは　はぐれメタルヘルム！\n@c2@"
"303":
  de: "@aTorneko@bAngeblich soll doch davon gar keiner mehr existieren...\n@c2@"
  en: "@aTorneko@bAnd I'd heard talk that there were none left in existence, so I had!\n@c2@"
  es: "@aTorneko@b¡Y eso que diecían que ya no quiedaba ninguno!\n@c2@"
  fr: "@aTorneko@bJ'avais entendu dire qu'ils avaient tous disparuⓠ\n@c2@"
  it: "@aBaldo@bAvevo sentito di' che in tutto i'mmondo 'un si trovavano più oggetti del genere!\n@c2@"
  ja: "@a@bトルネコ「すでに　現存するものは\n\t残っていないと　ウワサで\n\t聞きましたが……　いやはや。\n@c2@"
"304":
  de: "@aTorneko@bWenn man so was auf'm Kopf hat, kann selbst der Hammer der Hela keinen Schaden mehr anrichten.\n@c2@"
  en: "@aTorneko@bWith this on yer noggin, ye could drop a Hela hammer on yer head without a care in the world.\n@c2@"
  es: "@aTorneko@bSi lo llievas puesto, ya ti puede caer en la cabeza hasta un martillo de Hela.\n@c2@"
  fr: "@aTorneko@bAvec ça sur la tête, vous pouvez vous prendre un marteau de Hela de plein fouet sans rien sentir.\n@c2@"
  it: "@aBaldo@bCon quest'affare 'ntesta, potresti farti holpi' da un Martello di Hela senza subi' alcun danno! 'Un te n'accorgeresti nemmeno!\n@c2@"
  ja: "@a@bトルネコ「これを装備していれば\n\tもはや　頭への攻撃も\n\tおそれるものでは　ないですな！\n@c2@"
"305":
  de: "@aTorneko@b%0%a00220 %D220%Xkann%Ykönnen%Z damit ausgerüstet werden.\n@c2@"
  en: "@aTorneko@b%0%a00220 can be equipped with it.\n@c2@"
  es: "@aTorneko@bPuede ser equipado por %0%a00220.\n@c2@"
  fr: "@aTorneko@b%0%a00220 %D220%Xpeut%Ypeuvent%Z s'en équiper.\n@c2@"
  it: "@aBaldo@bQuest'elmo pole esse' aggiunto all'equipaggiamento di %a00220.\n@c2@"
  ja: "@a@bトルネコ「これを装備できるのは\n\t%a00220。\n@c2@"
"306":
  de: "@aTorneko@bUnd mir steht der bestimmt auch ganz gut!\n@c2@"
  en: "@aTorneko@bAnd it looks like this is sometin' I can equip meself with, too.\n@c2@"
  es: "@aTorneko@bY es algo que yo mismo podría llevar equipiado.\n@c2@"
  fr: "@aTorneko@bEt j'ai comme l'impression qu'il m'irait bien à moi aussi.\n@c2@"
  it: "@aBaldo@bAnzi, a pensarci meglio, anch'io potrei aggiungerlo al mi' equipaggiamento.\n@c2@"
  ja: "@a@bトルネコ「どうやら　私にも\n\t装備できるみたいです。\n@c2@"
"307":
  de: "@aTorneko@bDer Helm ist unbezahlbar, den kann man nicht verkaufen.\n@c2@"
  en: "@aTorneko@bAnd I'm guessin' it'd be too dear fer a normal shop to trade in.\n@c2@"
  es: "@aTorneko@bY no creo equivocarme diciendo que es diemasiado caro para una tienda normal.\n@c2@"
  fr: "@aTorneko@bEt je ne suis pas convaincu que vous pourriez le vendre. Il vaut trop cher.\n@c2@"
  it: "@aBaldo@bE 'un penso tu riesca a trova' una bottega 'ngrado di farti un'offerta seria per un oggetto tanto prezioso.\n@c2@"
  ja: "@a@bトルネコ「これは　あまりに\n\t高価すぎて　普通の店屋では\n\t引き取ってくれないでしょうね。\n@c2@"
"308":
  de: "@aTorneko@bAch, du gute Göttin! Das ist wahrlich kein gewöhnlicher Helm.\n@c2@"
  en: "@aTorneko@bDear Goddess, this is no ordinary helm, so it isn't.\n@c2@"
  es: "@aTorneko@b¡Por la Diosa, este no es un yelmo normal!\n@c2@"
  fr: "@aTorneko@bPar la Déesse, c'est pas un casque normal, ça.\n@c2@"
  it: "@aBaldo@bMaremma straordinaria!\nHuesto 'unn è certo un elmo normale, sai?\n@c2@"
  ja: "@a@bトルネコ「ひ…ひやぁっ！\n\tこ…これは　ただの　かぶとでは\n\tありませんよ！\n@c2@"
"309":
  de: "@aTorneko@bIhn einfach nur in Händen zu halten jagt mir einen Schauer über den Rücken.\n@c2@"
  en: "@aTorneko@bJust holdin' it in me hands like this gives me a bother in me heart.\n@c2@"
  es: "@aTorneko@bCon solo sostienerlo en las manos ya mi hace sientir una inquietud interior...\n@c2@"
  fr: "@aTorneko@bRien que de le tenir dans mes mains, je sens qu'il y a un truc qui cloche.\n@c2@"
  it: "@aBaldo@bMi fa veni' le palpitazioni al core solo a tenerlo 'nmano!\n@c2@"
  ja: "@a@bトルネコ「こうして　持っているだけで\n\tなんと言うか　心の中を\n\t支配されてしまいそうです……。\n@c2@"
"310":
  de: "@aTorneko@bIch weiß leider nicht allzu viel über ihn.\n@c2@"
  en: "@aTorneko@bI'm afraid I can't tell ye much about it.\n@c2@"
  es: "@aTorneko@bMi tiemo que no ti puedo decir gran cosa.\n@c2@"
  fr: "@aTorneko@bJe suis désolé de ne pas pouvoir en dire beaucoup plus.\n@c2@"
  it: "@aBaldo@bTemo di 'un poterti di' molto su quest'affare huì.\n@c2@"
  ja: "@a@bトルネコ「いや　これ以上のことは\n\t私にも　わかりませんな。\n@c2@"
"311":
  de: "@aTorneko@bAber ich bin mir sicher, dass kein Mensch ihn tragen kann.\n@c2@"
  en: "@aTorneko@bOther than that I'm fair sure no human would be able to handle it.\n@c2@"
  es: "@aTorneko@bAparte de que estoy casi conviencido de que ningún humano podría usiarlo.\n@c2@"
  fr: "@aTorneko@bÀ part qu'aucun humain ne pourrait le porter, j'en suis presque certain.\n@c2@"
  it: "@aBaldo@bPerò posso dirti con certezza che nessun essere umano potrebbe usarlo.\n@c2@"
  ja: "@a@bトルネコ「とにかく　私たち人間では\n\tこの　かぶとを　装備することは\n\tできないでしょうな……。\n@c2@"
"312":
  de: "@aTorneko@bUnd er ist bestimmt der Einzige seiner Art.\n@c2@"
  en: "@aTorneko@bAnd that ye'll almost certainly never come across another like it.\n@c2@"
  es: "@aTorneko@bY de que lo más sieguro es que jamás vuelvas a tropezarte con uno.\n@c2@"
  fr: "@aTorneko@bEt que vous n'en rencontrerez sûrement plus d'autre comme ça.\n@c2@"
  it: "@aBaldo@bE ti dico anche che, a mio parere, 'unn esiste al mondo un altro elmo home huesto.\n@c2@"
  ja: "@a@bトルネコ「しかも　この　かぶとは\n\tおそらく　二度と\n\t手に　入らないでしょう。\n@c2@"
"313":
  de: "@aTorneko@bAuf den würd' ich gut aufpassen. Darf man auf keinen Fall verkaufen.\n@c2@"
  en: "@aTorneko@bI'd hang on to it, if I were you.\nLook after it, like.\n@c2@"
  es: "@aTorneko@bYo que tú mi quedaría con él.\nCuídalo, sí.\n@c2@"
  fr: "@aTorneko@bSi j'étais vous, je le garderais.\nFaites-y attentionⓠ\n@c2@"
  it: "@aBaldo@bAbbine cura.\nAl tu' posto, me lo terrei ben stretto.\n@c2@"
  ja: "@a@bトルネコ「とにかく　売ったりせずに\n\t大切にすべきですな。\n@c2@"
"314":
  de: "@aTorneko@bWeg da, das muss ich sehen! Eine Meteorarmschiene? ... Gut, wird Zeit für ein kleines Liedchen.\n@c2@"
  en: "@aTorneko@bGet away outta that! A meteorite bracer?\n...Right then, time fer a sing-song.\n@c2@"
  es: "@aTorneko@b¡Por la Diosa bajada de los cielos! ¿Un brazaliete de meteorito?\nPues priecisamente conozco una cancioncilla...\n@c2@"
  fr: "@aTorneko@bJ'y crois pasⓠ Un brassard de météoreⓠ\n... C'est le genre de trouvaille qui me donne envie de pousser la chansonnetteⓠ\n@c2@"
  it: "@aBaldo@bUn Bracciale del lampo?!\nOra è il momento d'una bella hanzoncina!\n@c2@"
  ja: "@a@bトルネコ「おおっ！\n\tこれは　ほしふるうでわですな！\n\t……では　一曲。\n@c2@"
"315":
  de: "@aTorneko@bOh, du holde Maid Ⓠ \nDie Me-te-or-arm-schie-ne Ⓠ\n@c2@"
  en: "@aTorneko@bOh, canny boy Ⓠ \nThe me-te-or-ite bra-ace-er Ⓠ\n@c2@"
  es: "@aTorneko@bAjamalá Jabí vi... Ⓠ\nEl bra-za-lie-te de me-tie-o-ri-to... Ⓠ\n@c2@"
  fr: "@aTorneko@bUn brassard de mé-té-ore Ⓠ\nÇa vaut des mon-ta-gnes d'or Ⓠ\n@c2@"
  it: "@aBaldo@bOrefice e meteorologooo... Ⓠ \nTu che crei il Bracciale del lampooo... Ⓠ\n@c2@"
  ja: "@a@bトルネコ「ラララ♪　ほしふるうでわを\n\tつけたなら　すばやさ上がって\n\tうれしいな　ラララ……♪\n@c2@"
"316":
  de: "@aTorneko@bWas? Das Lied ist nicht gut? Ich wollte doch nur dieses schöne Stück hier preisen.\n@c2@"
  en: "@aTorneko@bWhat? Ye've heard enough already?\nI was only celebratin' such a fine item, like.\n@c2@"
  es: "@aTorneko@b¿Cómo? ¿Qué ya es suficiente?\nSolo cantiaba como homienaje a este priecioso objeto.\n@c2@"
  fr: "@aTorneko@bCommentⓡ Vous en avez assez entenduⓡ\nJ'étais juste en train de célébrer votre trouvaille.\n@c2@"
  it: "@aBaldo@bCosa? Hai sentito abbastanza?\nGuarda che stavo solo hantando le lodi di quest'oggetto meraviglioso.\n@c2@"
  ja: "@a@bトルネコ「え？　やめろですって？\n\tひどいなあ……。　今のは\n\tこのうでわに　まつわる歌ですよ。\n@c2@"
"317":
  de: "@aTorneko@bDas kann jeder tragen. Selbst ich.\n@c2@"
  en: "@aTorneko@bWell, any of youse can wear it.\nIncludin' me, o' course.\n@c2@"
  es: "@aTorneko@bBueno, cualquiera puede llievarlo.\nIncluso yo mismo.\n@c2@"
  fr: "@aTorneko@bÀ part ça, tout le monde peut le porter.\nMoi y compris, bien sûr.\n@c2@"
  it: "@aBaldo@bTutti possono indossarlo, incluso me.\n@c2@"
  ja: "@a@bトルネコ「この　うでわなら\n\tだれでも　装備できそうですね。\n\tもちろん　私にも　できます。\n@c2@"
"318":
