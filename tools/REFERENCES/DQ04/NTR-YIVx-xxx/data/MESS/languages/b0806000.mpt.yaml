  de: "@aTorneko@bIch darf mich damit leider nicht ausrüsten.\n@c2@"
  en: "@aTorneko@bIt doesn't look like I can equip meself with %M100%Xthem%Yit%Z.\n@c2@"
  es: "@aTorneko@bNo pariece que yo pueda equipar%M100%X%A100%Xlos%Z%B100%Xlas%Z%C100%Xlas%Z%Y%A100%Xlo%Z%B100%Xla%Z%C100%Xla%Z%Z.\n@c2@"
  fr: "@aTorneko@bMoi, je ne pense pas pouvoir m'en équiper.\n@c2@"
  it: "@aBaldo@bUn penso che io possa %M100%X%A100%Xaggiungerli%Z%B100%Xaggiungerle%Z%C100%X%Z%Y%A100%Xaggiungerlo%Z%B100%Xaggiungerla%Z%C100%X%Z%Z al mi' equipaggiamento.\n@c2@"
  ja: "@a@bトルネコ「どうやら　私には\n\t装備できないようです。\n@c2@"
"537":
  de: "@aTorneko@b%M100%XSie würden%Y%A100%XEr würd'%Z%B100%XSie würd'%Z%C100%XDas würd'%Z%Z wohl %a00750 Goldmünze%H750%X%Yn%Z einbringen, wenn man %M100%Xsie%Y%A100%Xihn%Z%B100%Xsie%Z%C100%Xes%Z%Z im Geschäft verkauft.\n@c2@"
  en: "@aTorneko@b%M100%XThey%YIt%Z'd fetch about %a00750 gold coin%H750%X%Ys%Z if ya sold %M100%Xthem%Yit%Z in a shop.\n@c2@"
  es: "@aTorneko@bSacarías más o mienos %a00750 monieda%H750%X%Ys%Z de oro si %M100%X%A100%Xlos%Z%B100%Xlas%Z%C100%Xlas%Z%Y%A100%Xlo%Z%B100%Xla%Z%C100%Xla%Z%Z viendieses en una tienda.\n@c2@"
  fr: "@aTorneko@bVous pourriez en tirer %a00750 pièce%I750%X%Ys%Z d'or si vous %M100%Xles%Y%A100%Xle%Z%B100%Xla%Z%C100%X%Z%Z vendiez dans un magasin.\n@c2@"
  it: "@aBaldo@bDirei che potresti rihavarci %a00750 %H750%Xmoneta%Ymonete%Z d'oro se te tu %M100%X%A100%Xli%Z%B100%Xle%Z%C100%X%Z%Y%A100%Xlo%Z%B100%Xla%Z%C100%X%Z%Z vendessi a una bottega.\n@c2@"
  ja: "@a@bトルネコ「もし店屋に売れば\n\t%a00750ゴールドに\n\tなるでしょうな。\n@c2@"
"538":
  de: "@a@bTorneko ist tot! Es dürfte wohl ein bisschen schwierig für ihn sein, sich %a53100 von seinem Sarg aus anzuschauen!\n@c0@"
  en: "@a@b%0Torneko is dead! Appraising %a02100 would be a bit tricky from inside a coffin!\n@c0@"
