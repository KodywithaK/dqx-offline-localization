"342":
  de: "@aTorneko@bIch? Nein, bloß weg damit. Ich bin ein Mann.\nStellt mir noch mal so 'ne dumme Frage, und ich stelle vielleicht 'ne Dummheit an! Ihr seid gewarnt!\n@c2@"
  en: "@aTorneko@bMe? Get away with ya! I'm a fella. Ask stupid questions like that, and I might do stupid things, though. So be warned!\n@c2@"
  es: "@aTorneko@b¿Yo? ¡Vienga ya! Yo soy un hombre. Pero si sigues haciendo prieguntas tontas, a lo miejor mi las pongo. ¿Mi explico?\n@c2@"
