  es: "@aTorneko@bPariece que, si lo llevas, ti proporciona una ligiera protiección.\n@c2@"
  fr: "@aTorneko@bSi j'me trompe pas, cette bague vous protège un peu lorsque vous la portez.\n@c2@"
  it: "@aBaldo@bHuando l'indossi, offre una protezione abbastanza limitata.\n@c2@"
  ja: "@a@bトルネコ「装備していれば\n\tほんのすこし　防御力が\n\tあるようです。\n@c2@"
"350":
  de: "@aTorneko@bAber wenn man ihn als Gegenstand verwendet, kann er die verbrauchten magischen Kräfte wiederherstellen.\n@c2@"
  en: "@aTorneko@bAnd yet if ya use it like an item, it works to restore yer magic powers.\n@c2@"
  es: "@aTorneko@bEn cambio, si lo usas como objeto, contribuye a riecuperar tu pioder mágico.\n@c2@"
  fr: "@aTorneko@bEn revanche, si vous l'utilisez comme un objet, elle vous permet de regagner de la puissance magique.\n@c2@"
  it: "@aBaldo@bTuttavia, se l'usi home oggetto, ti fa rehupera' potere magiho.\n@c2@"
  ja: "@a@bトルネコ「しかも　このゆびわを\n\t道具として使うと　魔力を回復する\n\t効果が　ありそうですぞ。\n@c2@"
"351":
  de: "@aTorneko@bAllerdings darf man ihn nicht zu häufig gebrauchen, das wär schädlich.\n@c2@"
  en: "@aTorneko@bBut mind ye don't use it too much, or ye'll go banjaxin' it, so ye will.\n@c2@"
  es: "@aTorneko@bPero no lo utilices diemasiado o ti lo cargarás, sí.\n@c2@"
  fr: "@aTorneko@bCeci dit, faut pas trop en abuser, parce qu'elle se bousille rapidement.\n@c2@"
  it: "@aBaldo@bMa bada a 'unn utilizzarlo molto, altrimenti si honsuma!\n@c2@"
  ja: "@a@bトルネコ「しかし　あまり使いすぎると\n\tこわれてしまうかも　しれませんな。\n@c2@"
"352":
  de: "@aTorneko@bJeder kann sich damit ausrüsten, selbst ich.\n@c2@"
  en: "@aTorneko@bAye, anyone could wear this, even meself.\n@c2@"
  es: "@aTorneko@bCualquiera puede lleviarlo, incluso yo mismo.\n@c2@"
  fr: "@aTorneko@bTout le monde pourrait la porter. Moi aussi, d'ailleurs.\n@c2@"
  it: "@aBaldo@bHuest'affare pole esse' indossato da chiunque. Persino io posso metterlo!\n@c2@"
  ja: "@a@bトルネコ「これなら　だれでも\n\t装備できるようです。\n\tもちろん　私にも　できます。\n@c2@"
"353":
  de: "@aTorneko@bDas Teil würd' wahrscheinlich %a00750 Goldmünze%H750%X%Yn%Z einbringen, wenn man's im Geschäft verkauft.\n@c2@"
  en: "@aTorneko@bIt'd fetch about %a00750 gold coin%H750%X%Ys%Z if ya sold it in a shop.\n@c2@"
  es: "@aTorneko@bSacarías más o mienos %a00750 monieda%H750%X%Ys%Z de oro si lo viendieses en una tienda.\n@c2@"
  fr: "@aTorneko@bVous pourriez en tirer %a00750 pièce%I750%X%Ys%Z d'or dans un magasin.\n@c2@"
  it: "@aBaldo@bA occhio e croce, potresti farci %a00750 %H750%Xmoneta%Ymonete%Z d'oro.\n@c2@"
  ja: "@a@bトルネコ「もし店屋に売れば\n\t%a00750ゴールドに\n\tなるでしょうな。\n@c2@"
"354":
  de: "@aTorneko@bAh, das hier ist ein sehr mächtiges Accessoire.\n@c2@"
  en: "@aTorneko@bAh, this is a mighty fine accessory, so it is.\n@c2@"
  es: "@aTorneko@b¡Ah!, este acciesorio es espléndido, sí.\n@c2@"
  fr: "@aTorneko@bAh, c'est un bien bel accessoire que vous avez là.\n@c2@"
  it: "@aBaldo@bQuest'accessorio l'è una vera meraviglia!\n@c2@"
  ja: "@a@bトルネコ「おおっ！\n\tこいつは　すばらしい\n\t装飾品ですな！\n@c2@"
"355":
  de: "@aTorneko@bSpaziert man mit diesem Ring durch die Gegend, werden die verbrauchten magischen Kräfte wieder hergestellt.\n@c2@"
  en: "@aTorneko@bWhen ya walk about as ye're wearin' it, it only recovers yer magic power, like.\n@c2@"
  es: "@aTorneko@bMientras lo llievas puesto riecupera tu pioder mágico.\n@c2@"
  fr: "@aTorneko@bSi vous vous promenez en la portant, vous régénérez votre puissance magique.\n@c2@"
  it: "@aBaldo@bSe ti movi mentre lo 'ndossi, ti fa rehupera' potere magiho.\n@c2@"
  ja: "@a@bトルネコ「このゆびわを\n\t装備していれば　歩くだけで\n\t魔力を　回復してくれそうです。\n@c2@"
"356":
  de: "@aTorneko@bAber das ist noch nicht alles. Der Ringträger ist außerdem besser gegen die Magie seiner Feinde geschützt.\n@c2@"
  en: "@aTorneko@bAn' not only that. It also makes y'a harder target fer yer enemies' spells, too.\n@c2@"
  es: "@aTorneko@bY no solo eso: también hace que el eniemigo lo tienga más difícil para aciertarte con sus conjuros.\n@c2@"
  fr: "@aTorneko@bEt c'est pas tout. Les sorts de vos ennemis vous touchent aussi moins facilement.\n@c2@"
  it: "@aBaldo@bE non solo! Chi lo ha con sé, diventa anche un bersaglio più difficile per l'incantesimi nemici!\n@c2@"
  ja: "@a@bトルネコ「しかも　敵の呪文も\n\tグッと　受けにくくなるでしょうな。\n@c2@"
"357":
  de: "@aTorneko@b%0%a00220 %D220%Xkann%Ykönnen%Z damit ausgerüstet werden.\n@c2@"
  en: "@aTorneko@b%0%a00220 can be equipped with it.\n@c2@"
  es: "@aTorneko@bPuede ser equipado por %0%a00220.\n@c2@"
  fr: "@aTorneko@b%0%a00220 %D220%Xpeut%Ypeuvent%Z s'en équiper.\n@c2@"
  it: "@aBaldo@bQuest'anello pole esse' aggiunto all'equipaggiamento di %a00220.\n@c2@"
  ja: "@a@bトルネコ「これを装備できるのは\n\t%a00220。\n@c2@"
"358":
  de: "@aTorneko@bIch aber nicht.\n@c2@"
  en: "@aTorneko@bBut it doesn't look like I can.\n@c2@"
  es: "@aTorneko@bPero creo que yo no podría.\n@c2@"
  fr: "@aTorneko@bMoi, par contre, j'ai pas l'impression que je peux.\n@c2@"
  it: "@aBaldo@bMa 'un pole esse' aggiunto al mio, d'equipaggiamento...\n@c2@"
  ja: "@a@bトルネコ「どうやら　私には\n\t装備できないようです。\n@c2@"
"359":
  de: "@aTorneko@bDer Ring ist so viel wert, dass ihn kein Händler der Welt bezahlen könnte.\n@c2@"
  en: "@aTorneko@bI'd be surprised if any trader could give y'a price fer it in a shop.\n@c2@"
  es: "@aTorneko@bMi sorpriendería que un miercader ti ofreciera una cantidiad por él en una tienda.\n@c2@"
  fr: "@aTorneko@bÇa me surprendrait qu'un marchand vous fasse une offre pour cette bague.\n@c2@"
  it: "@aBaldo@bE 'un credo nemmeno che te tu possa venderlo a qualche bottega...\n@c2@"
  ja: "@a@bトルネコ「店屋では　こいつの価値は\n\tまず　わからんでしょう。\n@c2@"
"360":
  de: "@aTorneko@bWas zum Kuckuck ist das denn? T-Tut mir leid, ich hab wirklich keine Ahnung.\n@c2@"
  en: "@aTorneko@bWhat the devil is this?\nI... I'm sorry, I've altogether no idea.\n@c2@"
  es: "@aTorneko@b¿Qué diemonios es esto?\nYo... Lo siento, no tiengo ni la menor idea.\n@c2@"
  fr: "@aTorneko@bQu'est-ce que c'est que ce trucⓡ\nJe... Je suis désolé. J'en ai vraiment aucune idée.\n@c2@"
  it: "@aBaldo@bMa che accidenti è huest'affare huì?!\nMaremma ignota! 'Un saprei dirlo davvero!\n@c2@"
  ja: "@a@bトルネコ「なんなのでしょうな？\n\tこれは……。　すみません。\n\tこれは　私にも　わかりません。\n@c2@"
"361":
  de: "@aTorneko@bSieht so aus, als wär er gut für die Verteidigung.\n@c2@"
  en: "@aTorneko@bIt looks like it'd be fer protection o' some sort, like.\n@c2@"
  es: "@aTorneko@bPariece que podría siervir para algún tipo de priotección.\n@c2@"
  fr: "@aTorneko@bOn dirait que ça vous accorde une sorte de protection.\n@c2@"
  it: "@aBaldo@bA prima vista mi pare una roba che aumenta la protezione, o qualcosa del genere.\n@c2@"
  ja: "@a@bトルネコ「どうやら　お守りとしての\n\t効果があるのは\n\tたしかなようですが……。\n@c2@"
"362":
  de: "@aTorneko@bJedenfalls könnte ihn jeder von uns tragen. Ich auch.\n@c2@"
  en: "@aTorneko@bAnyway, any one of us could wear it.\nMeself included.\n@c2@"
  es: "@aTorneko@bBueno, cualquiera podría llievarlo.\nIncluso yo.\n@c2@"
  fr: "@aTorneko@bToujours est-il que tout le monde peut le porter. Même moi, d'ailleurs.\n@c2@"
  it: "@aBaldo@bComunque, direi che tutti possono indossarlo, me compreso.\n@c2@"
  ja: "@a@bトルネコ「とりあえず　だれにでも\n\t装備は　できるようです。\n\tもちろん　私にも　できます。\n@c2@"
"363":
  de: "@aTorneko@bIch glaub nicht, dass den Ring jemand kaufen würd'. Dafür ist er viel zu unbekannt.\n@c2@"
  en: "@aTorneko@bAs fer sellin' it, I don't imagine anyone would buy it off ya, bein' such an unknown as it is.\n@c2@"
  es: "@aTorneko@bSi lo que quieres es vendierlo, no creo que nadie ti lo compre, ya que no si sabe qué es.\n@c2@"
  fr: "@aTorneko@bPour ce qui est de le vendre, ça m'étonnerait que vous y arriviez, parce que les objets inconnus n'ont pas trop de succès.\n@c2@"
  it: "@aBaldo@bMa 'un penso te tu possa venderlo a qualcuno, visto che 'un si sa di che diavolo si tratta.\n@c2@"
  ja: "@a@bトルネコ「しかし……\n\tこれは　どこの店屋でも\n\t買ってはくれないでしょうな。\n@c2@"
"364":
  de: "@aTorneko@bAha, ein Paar erhebender Schuhe. Welch eine erhabene Erfahrung!\n@c2@"
  en: "@aTorneko@bAh, a pair of elevatin' shoes.\nWhat an upliftin' experience!\n@c2@"
  es: "@aTorneko@b¡Ah!, un par de zuecos de ánimo.\n¡Mi elievan el ánimo!\n@c2@"
  fr: "@aTorneko@bAh, une paire de chaussures à talons.\nOn peut dire que c'est une expérience qui vous grandiraⓠ\n@c2@"
  it: "@aBaldo@bOh, un paio di Scarpe sante!\nQueste garantiscono un'esperienza... beata!\n@c2@"
  ja: "@a@bトルネコ「おおっ！\n\tこれは　しあわせのくつですな！\n@c2@"
"365":
  de: "@aTorneko@bWenn man diese Schuhe an Orten trägt, an denen sich Monster aufhalten, gewinnt man eine Menge Erfahrung. Einfach so.\n@c2@"
  en: "@aTorneko@bWear these where ya might be findin' monsters, and ye'll gain experience just by walkin' about, like.\n@c2@"
  es: "@aTorneko@bSi los llevas en un lugar en el que haya monstruos, ganariás expieriencia solo por pasearte.\n@c2@"
  fr: "@aTorneko@bPortez-les dans les endroits où vous pouvez rencontrer des monstres et vous gagnerez de l'expérience rien qu'en marchant avec.\n@c2@"
  it: "@aBaldo@bSe le indossi nei luoghi popolati da mostri, ottieni esperienza semplicemente hamminando.\n@c2@"
  ja: "@a@bトルネコ「敵と出会う場所を\n\tこのくつをはいて　歩けば\n\tそれだけで　旅の経験になります。\n@c2@"
"366":
  de: "@aTorneko@bAußerdem kann sie jeder tragen, sogar ich.\n@c2@"
  en: "@aTorneko@bAye, anyone can wear these, includin' meself.\n@c2@"
  es: "@aTorneko@bSí, cualquiera puede llievarlos, incluso yo mismo.\n@c2@"
  fr: "@aTorneko@bTout le monde, dont moi, peut les porter.\n@c2@"
  it: "@aBaldo@bTutti possono porta' hueste scarpe, me compreso.\n@c2@"
  ja: "@a@bトルネコ「これなら　だれでも\n\t装備できるようです。\n\tもちろん　私にも　できます。\n@c2@"
"367":
  de: "@aTorneko@bAllerdings sind sie viel zu wertvoll, um verkauft zu werden. Das könnte keiner bezahlen.\n@c2@"
  en: "@aTorneko@bAnd they're far too expensive fer yer normal shopkeeper to deal in. Ye won't get a price fer 'em.\n@c2@"
  es: "@aTorneko@bY son diemasiado caros para cualquier miercader normal. Nadie ti hará una ofierta por ellos.\n@c2@"
  fr: "@aTorneko@bElles coûtent beaucoup trop cher pour qu'un marchand normal essaie de vous les acheter. Personne ne vous fera de proposition.\n@c2@"
  it: "@aBaldo@bE sono oggetti di grande valore, sai? Nessun negoziante onesto potrebbe mai farti una buona offerta, se te tu volessi venderle.\n@c2@"
  ja: "@a@bトルネコ「これは　あまりに\n\t高価すぎて　普通の店屋では\n\t引き取ってくれないでしょうね。\n@c2@"
"368":
  de: "@aTorneko@bOh, das ist ein wertvolles Stück.\n@c2@"
  en: "@aTorneko@bOh, 'tis a fine item, so it is.\n@c2@"
  es: "@aTorneko@bEste es un bonito artículo, sí.\n@c2@"
  fr: "@aTorneko@bC'est un bien beau bijou.\n@c2@"
  it: "@aBaldo@bMaremma preziosa, che bell'oggettino!\n@c2@"
  ja: "@a@bトルネコ「おお……。\n\tこれは　よいものですな。\n@c2@"
"369":
  de: "@aTorneko@bDie Abwehr wird verbessert, wenn man ihn trägt, aber das ist noch nicht alles.\n@c2@"
  en: "@aTorneko@bIt boosts yer defence when ye're wearin' it, but that's not all...\n@c2@"
  es: "@aTorneko@bAumenta tu defiensa mientras lo llevas, pero eso no es todo...\n@c2@"
  fr: "@aTorneko@bCette bague augmente votre niveau de défense lorsque vous la portez, mais ce n'est pas tout...\n@c2@"
  it: "@aBaldo@bQuesto aumenta di parecchio le tu' difese, huando lo metti al dito, ma 'un finisce huì!\n@c2@"
  ja: "@a@bトルネコ「普通に装備するだけでも\n\t防御力が　ありそうですが\n\tそればかりでは　ありませんぞ。\n@c2@"
"370":
  de: "@aTorneko@bWenn man ihn anbehält und damit rumläuft, wird auch die Gesundheit ein wenig wiederhergestellt.\n@c2@"
  en: "@aTorneko@bIf ye keep it on and walk about, it restores yer health, too.\n@c2@"
  es: "@aTorneko@bTambién recupiera tu salud si lo llievas puesto.\n@c2@"
  fr: "@aTorneko@bSi vous la gardez sur vous pendant que vous marchez, elle vous permet de regagner de la Santé.\n@c2@"
  it: "@aBaldo@bSe cammini huando lo 'ndossi, ti fa rehupera' energia vitale.\n@c2@"
  ja: "@a@bトルネコ「なんと　これを\n\t装備していれば　歩くほどに\n\t体力が回復するようです。\n@c2@"
"371":
  de: "@aTorneko@bUnd ein jeder von uns darf ihn benutzen, auch ich.\n@c2@"
  en: "@aTorneko@bAnyone can use it, includin' meself.\n@c2@"
  es: "@aTorneko@bCualquiera puede usarlo, hasta yo mismo.\n@c2@"
  fr: "@aTorneko@bAbsolument tout le monde peut la porter. Moi y compris.\n@c2@"
  it: "@aBaldo@bE lo possono usa' tutti!\nAnch'io lo posso mette'!\n@c2@"
  ja: "@a@bトルネコ「これなら　だれでも\n\t装備できるようです。\n\tもちろん　私にも　できます。\n@c2@"
"372":
  de: "@aTorneko@bUnd was das Verkaufen anbelangt... Ich würd' ihn behalten. Es kennt eh keiner seinen wahren Wert.\n@c2@"
  en: "@aTorneko@bAs far as sellin' it goes, no trader would know the price, so they wouldn't buy it.\n@c2@"
  es: "@aTorneko@bSi quieres vendierlo, nadie ti lo comprará, porque ningún miercader sabría qué priecio pagar.\n@c2@"
  fr: "@aTorneko@bPour ce qui est de la vendre, personne ne serait capable de vous en dire le prix, alors vous pouvez oublier tout de suite.\n@c2@"
  it: "@aBaldo@bE se te volessi venderlo... Beh, penso che 'un te lo homprerebbe nessuno, se te volessi venderlo.\n@c2@"
  ja: "@a@bトルネコ「店屋では　こいつの価値は\n\tまず　わからんでしょう。\n@c2@"
"373":
  de: "@aTorneko@bHm... Das ist wohl so 'ne Art Accessoire...\n@c2@"
  en: "@aTorneko@bHm... 'Tis some kind of accessory...\n@c2@"
  es: "@aTorneko@bMmm... Es una especie de acciesorio...\n@c2@"
  fr: "@aTorneko@bMmm... C'est une sorte d'accessoire...\n@c2@"
  it: "@aBaldo@bAllora, diamo un'occhiata a huest'accessorio.\n@c2@"
  ja: "@a@bトルネコ「ふむふむ……。\n\tこれは　装飾品ですね。\n@c2@"
"374":
  de: "@aTorneko@bMan gewinnt schon an Stärke, wenn man ihn nur trägt.\n@c2@"
  en: "@aTorneko@bJust wearin' it's enough to make y'a quare bit stronger.\n@c2@"
  es: "@aTorneko@bCon solo llievarlo ti sientirás mucho más fuerte.\n@c2@"
  fr: "@aTorneko@bPortez-la et vous serez encore plus fort%A120%X%Z%B120%Xe%Z.\n@c2@"
  it: "@aBaldo@bSì. Basta indossarlo per diventare più forti.\n@c2@"
  ja: "@a@bトルネコ「これを身につけていれば\n\tそれだけで　ちからが\n\t向上するようです。\n@c2@"
"375":
  de: "@aTorneko@bIst auch nicht so ein Weiberkram. Den kann jeder tragen, ich auch.\n@c2@"
  en: "@aTorneko@bⓙTis not fussy, this one. Anyone can wear it, includin' meself.\n@c2@"
  es: "@aTorneko@bY no es especialito. Cualquiera puede llevarlo, hasta yo mismo.\n@c2@"
  fr: "@aTorneko@bEt puis ce qui est pratique, c'est que tout le monde peut la porter. Même moi.\n@c2@"
  it: "@aBaldo@bE 'unn è miha un anello schizzinoso, eh!\nChiunque pole 'ndossarlo, me compreso!\n@c2@"
  ja: "@a@bトルネコ「これなら　だれでも\n\t装備できるようです。\n\tもちろん　私にも　できます。\n@c2@"
"376":
  de: "@aTorneko@bDas Teil würd' wahrscheinlich %a00750 Goldmünze%H750%X%Yn%Z einbringen, wenn man's im Geschäft verkauft.\n@c2@"
  en: "@aTorneko@bIt'd fetch about %a00750 gold coin%H750%X%Ys%Z if ya sold it in a shop.\n@c2@"
  es: "@aTorneko@bSacarías más o menos %a00750 monieda%H750%X%Ys%Z de oro si lo viendieses en una tienda.\n@c2@"
  fr: "@aTorneko@bVous pourriez en tirer %a00750 pièce%I750%X%Ys%Z d'or dans un magasin.\n@c2@"
  it: "@aBaldo@bVendilo a una bottega, e ti metterai 'ntasca %a00750 %H750%Xmoneta%Ymonete%Z d'oro.\n@c2@"
  ja: "@a@bトルネコ「もし店屋に売れば\n\t%a00750ゴールドに\n\tなるでしょうな。\n@c2@"
"377":
  de: "@aTorneko@bHm... Das ist wohl so 'ne Art Accessoire...\n@c2@"
  en: "@aTorneko@bHm... 'Tis some kind of accessory...\n@c2@"
  es: "@aTorneko@bMmm... Es una especie de acciesorio...\n@c2@"
  fr: "@aTorneko@bMmm... C'est une sorte d'accessoire...\n@c2@"
  it: "@aBaldo@bMa che carino che è huest'accessorio huì!\n@c2@"
  ja: "@a@bトルネコ「ふむふむ……。\n\tこれは　装飾品ですね。\n@c2@"
"378":
  de: "@aTorneko@bIst wahrscheinlich als Schutz gedacht, aber wenn ich ehrlich bin, glaub ich nicht, dass es mehr ist als Zier.\n@c2@"
  en: "@aTorneko@bⓙTis supposed to protect ya, like, but if the truth be told, it's nuttin' more than a decoration.\n@c2@"
  es: "@aTorneko@bSi supone que ti protiege, pero la vierdad es que no es más que un adorno.\n@c2@"
  fr: "@aTorneko@bElle est censée vous protéger, mais il faut bien admettre que c'est rien d'autre qu'une breloque.\n@c2@"
  it: "@aBaldo@bDovrebbe esse' una specie di protezione, ma in realtà l'è poco più che un ornamento.\n@c2@"
  ja: "@a@bトルネコ「どうやら　お守りとしての\n\t効果はあるようですが\n\tはっきり言って　かざりですね。\n@c2@"
"379":
  de: "@aTorneko@bAußerdem könnte man darauf ausrutschen, wenn man... Na, egal.\n@c2@"
  en: "@aTorneko@bAh, y'could slip it on if ye were wantin' to try sometin' a bit different, I s'pose.\n@c2@"
  es: "@aTorneko@bBueno, puedes usarlo por llievar algo un poco distinto, sí.\n@c2@"
  fr: "@aTorneko@bVous pouvez essayer de la mettre pour voir ce que ça fait, mais bon...\n@c2@"
  it: "@aBaldo@bCerto, se t'andasse di cambia' il tu' look potresti prova' a 'ndossarla...\n@c2@"
  ja: "@a@bトルネコ「ちょっと　気分を\n\t変えたいときなどに　これを\n\tつけてみるのも　よいですな。\n@c2@"
"380":
  de: "@aTorneko@bJeder kann sich damit ausrüsten, selbst ich.\n@c2@"
  en: "@aTorneko@bAny one of us could, meself included.\n@c2@"
  es: "@aTorneko@bCualquiera puede llevarlo, hasta yo.\n@c2@"
  fr: "@aTorneko@bTout le monde, y compris moi, peut la porter.\n@c2@"
  it: "@aBaldo@bE poi va bene pe' tutti, me compreso.\n@c2@"
  ja: "@a@bトルネコ「これなら　だれでも\n\t装備できるようです。\n\tもちろん　私にも　できます。\n@c2@"
"381":
  de: "@aTorneko@bDas Teil würd' wahrscheinlich %a00750 Goldmünze%H750%X%Yn%Z einbringen, wenn man's im Geschäft verkauft.\n@c2@"
  en: "@aTorneko@bIt'd fetch about %a00750 gold coin%H750%X%Ys%Z if ya sold it in a shop.\n@c2@"
  es: "@aTorneko@bSacarías más o menos %a00750 monieda%H750%X%Ys%Z de oro si lo viendieses en una tienda.\n@c2@"
  fr: "@aTorneko@bVous pourriez en tirer %a00750 pièce%I750%X%Ys%Z d'or dans un magasin.\n@c2@"
  it: "@aBaldo@bSe la vendi a una bottega, ci rihavi %a00750 %H750%Xmoneta%Ymonete%Z d'oro.\n@c2@"
  ja: "@a@bトルネコ「もし店屋に売れば\n\t%a00750ゴールドに\n\tなるでしょうな。\n@c2@"
"382":
  de: "@aTorneko@bHm... Das ist wohl so 'ne Art Accessoire...\n@c2@"
  en: "@aTorneko@bHm... 'Tis some kind of accessory...\n@c2@"
  es: "@aTorneko@bMmm... Es una especie de acciesorio...\n@c2@"
  fr: "@aTorneko@bMmm... C'est une sorte d'accessoire...\n@c2@"
  it: "@aBaldo@bHuesto è un accessorio molto utile...\n@c2@"
  ja: "@a@bトルネコ「ふむ……。\n\tこれは　装飾品ですね。\n@c2@"
"383":
  de: "@aTorneko@bWenn man dieses Tuch trägt, wird das Reisegepäck leichter, und man kommt schneller voran.\n@c2@"
  en: "@aTorneko@bEquip yerself with this to lighten yer load and speed yerself up.\n@c2@"
  es: "@aTorneko@bSi lo equipas harás que tu carga sea más ligiera y podriás movierte más rápido.\n@c2@"
  fr: "@aTorneko@bÉquipez-vous-en pour alléger votre chargement et avancer plus vite.\n@c2@"
  it: "@aBaldo@bSe lo aggiungi al tu' equipaggiamento, quasi 'un senti il peso che hai addosso, e ti movi più velocemente.\n@c2@"
  ja: "@a@bトルネコ「これを装備すると\n\t身が軽くなり　すばやさが\n\t上がりそうです。\n@c2@"
"384":
  de: "@aTorneko@bEin jeder kann es tragen, selbst ich.\n@c2@"
  en: "@aTorneko@bI can use it, you can use it, anyone can use it.\n@c2@"
  es: "@aTorneko@bYo puedo usiarlo, tú puedes usiarlo, puede usiarlo cualquiera.\n@c2@"
  fr: "@aTorneko@bJe peux m'en servir.\nVous pouvez vous en servir.\nTout le monde peut s'en servir.\n@c2@"
  it: "@aBaldo@bIo posso usarla, te poi usarla, tutti possono usarla!\n@c2@"
  ja: "@a@bトルネコ「これなら　だれでも\n\t装備できるようです。\n\tもちろん　私にも　できます。\n@c2@"
"385":
  de: "@aTorneko@bDas Teil würd' wahrscheinlich %a00750 Goldmünze%H750%X%Yn%Z einbringen, wenn man's im Geschäft verkauft.\n@c2@"
  en: "@aTorneko@bIt'd fetch about %a00750 gold coin%H750%X%Ys%Z if ya sold it in a shop.\n@c2@"
  es: "@aTorneko@bSacarías más o mienos %a00750 monieda%H750%X%Ys%Z de oro si lo viendieses en una tienda.\n@c2@"
  fr: "@aTorneko@bVous pourriez en tirer %a00750 pièce%I750%X%Ys%Z d'or dans un magasin.\n@c2@"
  it: "@aBaldo@bVendila a una bottega, e ci farai %a00750 %H750%Xmoneta%Ymonete%Z d'oro.\n@c2@"
  ja: "@a@bトルネコ「もし店屋に売れば\n\t%a00750ゴールドに\n\tなるでしょうな。\n@c2@"
"386":
  de: "@aTorneko@bOh, das hier ist ein sehr altes Stück.\n@c2@"
  en: "@aTorneko@bAh, this is a grand ole item ye've found fer yerself here.\n@c2@"
  es: "@aTorneko@b¡Ah!, has encontrado un objeto espliéndido, sí.\n@c2@"
  fr: "@aTorneko@bEh bien, c'est un bel objet que vous avez trouvé.\n@c2@"
  it: "@aBaldo@bOh, questa sì ch'è utile!\n@c2@"
  ja: "@a@bトルネコ「おおっ！\n\tこれは　よいものですね！\n@c2@"
"387":
  de: "@aTorneko@bTrägt man diese Schiene, wird man stärker und beinah unverwundbar.\n@c2@"
  en: "@aTorneko@bWearin' this'll make ye hard as nails, like.\nIt boosts yer strength sometin' fierce.\n@c2@"
  es: "@aTorneko@bMientras lo llieves serás irreducible cuál dromedaria diesbocada.\nTu fuerza aumientará una barbaridad.\n@c2@"
  fr: "@aTorneko@bAvec ça, vous résisterez particulièrement bien aux attaques physiques. Et votre Force fera un bond.\n@c2@"
  it: "@aBaldo@bSe la indossi, diventi duro come i'fferro!\nAumenta la tu' potenza di parecchio, ma parecchio tanto!\n@c2@"
  ja: "@a@bトルネコ「こいつを装備すれば\n\tちからが上がり　その名の通り\n\tごうけつに　なれるでしょう！\n@c2@"
"388":
  de: "@aTorneko@bAußerdem kann sich jeder damit ausrüsten, meine Wenigkeit auch.\n@c2@"
  en: "@aTorneko@bAn' anyone can use it, includin' yours truly here.\n@c2@"
  es: "@aTorneko@bY cualquiera puede usarlo, hasta tu humilde siervidor.\n@c2@"
  fr: "@aTorneko@bTout le monde peut s'en servir, votre serviteur y compris.\n@c2@"
  it: "@aBaldo@bIo la posso usa', questa roba.\nAnzi, possono usarla tutti.\n@c2@"
  ja: "@a@bトルネコ「しかも　だれにでも\n\t装備できるようです。\n\tもちろん　私にも　できます。\n@c2@"
"389":
  de: "@aTorneko@bDie Frage ist nur, ob man sie besser einem schwachen Kämpfer gibt oder einem starken, damit er noch stärker wird?\n@c2@"
  en: "@aTorneko@bThe question is, do ya give to a wee sap of a fighter, or make a stronger fella even stronger?\n@c2@"
  es: "@aTorneko@bLa cuestión es: ¿si lo das a un miequetrefe o lo usas para que un fortachón sea más fuerte?\n@c2@"
  fr: "@aTorneko@bAprès, c'est à vous de voir si vous préférez transformer un petit jeune en combattant ou faire d'un combattant un guerrier encore plus puissant.\n@c2@"
  it: "@aBaldo@bMa conviene darla a uno che 'un sa nemmeno home si tiene un'arma 'nmano, o a un guerriero già forte, pe' renderlo pratihamente 'nvincibile?\n@c2@"
  ja: "@a@bトルネコ「ちからの弱い者につけるか？\n\tはたまた　強い者がつけて\n\tさらに　強くなるか……\n@c2@"
"390":
  de: "@aTorneko@bDie Armschiene ist wahrscheinlich jedem eine Hilfe.\n@c2@"
  en: "@aTorneko@bSure an' there's more than one way to use it, so there is.\n@c2@"
  es: "@aTorneko@bHay más de una forma de usiarlo, claro, sí.\n@c2@"
  fr: "@aTorneko@bVous aurez donc compris qu'il existe plus d'une manière de se servir de ce brassard.\n@c2@"
  it: "@aBaldo@bCome vedi, ci so' diversi modi pe' utilizza' huesta fascia.\n@c2@"
  ja: "@a@bトルネコ「使いかたは　さまざまですな。\n@c2@"
"391":
  de: "@aTorneko@bDas ist sehr praktisch, um einem seiner Freunde wieder auf die Beine zu helfen. Wenn man das Kraut isst, erlangt man Stärke zurück.\n@c2@"
  en: "@aTorneko@bⓙTis a handy item fer gettin' one of yer lads back in shape. Eatin' it helps get yer strength back a little.\n@c2@"
  es: "@aTorneko@bEsta planta es muy útil para volvier a poner en forma a tus amigos. Si ti la comes, recupieras la fuerza en poco tiempo.\n@c2@"
  fr: "@aTorneko@bCet objet est très utile pour soigner vos compagnons.\nMangez-la pour regagner un peu de forces.\n@c2@"
  it: "@aBaldo@bHuesta roba serve a fa' rehupera' le forze a chi 'un c'ha più energia. Basta mangiarla per torna' 'nforma.\n@c2@"
  ja: "@a@bトルネコ「ふむ……。\n\tこれは　仲間ひとりの\n\t体力を　回復する道具ですね。\n@c2@"
"392":
  de: "@aTorneko@bEs wird natürlich aufgebraucht, wenn man's runterschluckt, und ist dann weg.\n@c2@"
  en: "@aTorneko@bUse it once, and it's gone forevermore, though.\n@c2@"
  es: "@aTorneko@bPero si la usas una vez, si acabo.\n@c2@"
  fr: "@aTorneko@bVous ne pouvez vous en servir qu'une fois.\n@c2@"
  it: "@aBaldo@bPerò, dopo che l'hai usata, sparisce!\n@c2@"
  ja: "@a@bトルネコ「どうやら　一度　使うと\n\tなくなってしまうようです。\n@c2@"
"393":
  de: "@aTorneko@bDas Teil würd' wahrscheinlich %a00750 Goldmünze%H750%X%Yn%Z einbringen, wenn man's im Geschäft verkauft.\n@c2@"
  en: "@aTorneko@bIt'd fetch about %a00750 gold coin%H750%X%Ys%Z if ya sold it in a shop.\n@c2@"
  es: "@aTorneko@bSacarías más o mienos %a00750 monieda%H750%X%Ys%Z de oro si la viendieses en una tienda.\n@c2@"
  fr: "@aTorneko@bVous pourriez en tirer %a00750 pièce%I750%X%Ys%Z d'or dans un magasin.\n@c2@"
  it: "@aBaldo@bSe la vendi a una bottega, ci fai %a00750 %H750%Xmoneta%Ymonete%Z d'oro.\n@c2@"
  ja: "@a@bトルネコ「もし店屋に売れば\n\t%a00750ゴールドに\n\tなるでしょうな。\n@c2@"
"394":
  de: "@aTorneko@bDamit kann man prima Vergiftungen heilen, und jeder darf es essen.\n@c2@"
  en: "@aTorneko@bⓙTis a handy item fer curin' poison.\nYe can use it on anyone in yer party.\n@c2@"
  es: "@aTorneko@bEs una planta muy útil para curar el vieneno.\nLa puedes usar en cualquiera de los del grupo.\n@c2@"
  fr: "@aTorneko@bC'est un objet très pratique qui permet de guérir les empoisonnements. Vous pouvez l'utiliser sur n'importe quel membre de l'équipe.\n@c2@"
  it: "@aBaldo@bQuesta lattughina huì serve pe' cura' dall'avvelenamento hualsiasi membro de i'ggruppo.\n@c2@"
  ja: "@a@bトルネコ「ふむ……。\n\tこれは　仲間ひとりの\n\t毒を消す道具ですね。\n@c2@"
"395":
  de: "@aTorneko@bAber natürlich nur einmal. Sobald es im Magen ist, kann man's nicht mehr gebrauchen.\n@c2@"
  en: "@aTorneko@bBut only the one time, like. Once ye've used a herb, ya can't use it again.\n@c2@"
  es: "@aTorneko@bPero es para una sola vez. Cuando ti has comido una planta, ya no puedes volvier a usarla.\n@c2@"
  fr: "@aTorneko@bBien entendu, elle ne sert qu'une fois.\nAprès, elle disparaît.\n@c2@"
  it: "@aBaldo@bPerò rihorda che, una volta usata, 'un c'è più!\n@c2@"
  ja: "@a@bトルネコ「どうやら　一度　使うと\n\tなくなってしまうようです。\n@c2@"
"396":
  de: "@aTorneko@bDas Teil würd' wahrscheinlich %a00750 Goldmünze%H750%X%Yn%Z einbringen, wenn man's im Geschäft verkauft.\n@c2@"
  en: "@aTorneko@bIt'd fetch about %a00750 gold coin%H750%X%Ys%Z if ya sold it in a shop.\n@c2@"
  es: "@aTorneko@bSacarías más o mienos %a00750 monieda%H750%X%Ys%Z de oro si la viendieses en una tienda.\n@c2@"
  fr: "@aTorneko@bVous pourriez en tirer %a00750 pièce%I750%X%Ys%Z d'or dans un magasin.\n@c2@"
  it: "@aBaldo@bPoi rihavarci %a00750 %H750%Xmoneta%Ymonete%Z d'oro, se la vendi.\n@c2@"
  ja: "@a@bトルネコ「もし店屋に売れば\n\t%a00750ゴールドに\n\tなるでしょうな。\n@c2@"
"397":
  de: "@aTorneko@bSehr interessant. Damit kann man eine Zeit lang Feinde abwehren, die schwächer sind als man selbst.\n@c2@"
  en: "@aTorneko@bSure, 'tis an interestin' one, this. It'll ward off enemies that are weaker than yerself fer a while.\n@c2@"
  es: "@aTorneko@bEsto es muy interiesante, sí. Ti protiegerá contra los eniemigos más fuertes que tú durante un rato.\n@c2@"
  fr: "@aTorneko@bEh bien, on peut dire que c'est un objet intéressant. Il repoussera quelque temps les adversaires plus faibles que vous.\n@c2@"
  it: "@aBaldo@bQuesta sì ch'è una roba interessante!\nSe la usi, i nemici più deboli ti staranno alla larga per un po' di tempo.\n@c2@"
  ja: "@a@bトルネコ「ふむ……。\n\tこれは　しばらくの間　自分より\n\t弱い敵を　遠ざける道具ですね。\n@c2@"
"398":
  de: "@aTorneko@bAllerdings ist in einer Phiole gerade mal genug für eine Gelegenheit drin.\n@c2@"
  en: "@aTorneko@bThere's only enough in each phial to use it the one time, though.\n@c2@"
  es: "@aTorneko@bPero cada frasco contiene una sola dosis.\n@c2@"
  fr: "@aTorneko@bCette fiole ne contient de l'eau que pour une utilisation.\n@c2@"
  it: "@aBaldo@bOgni fiala contiene liquido sufficiente pe' un solo utilizzo.\n@c2@"
  ja: "@a@bトルネコ「どうやら　一度　使うと\n\tなくなってしまうようですが……\n@c2@"
"399":
  de: "@aTorneko@bIst sehr praktisch, wenn man zum Beispiel in eine Höhle zurückgeht, durch die man schon mal gegangen ist.\n@c2@"
  en: "@aTorneko@bIt might come in handy if ye're goin' back into a cave ye've already been through once before, like.\n@c2@"
  es: "@aTorneko@bPuede serte de utilidad si vuelvies a una cueva en la que ya hayas estado.\n@c2@"
  fr: "@aTorneko@bElle pourrait également vous être utile si vous retournez dans une grotte que vous avez déjà visitée.\n@c2@"
  it: "@aBaldo@bPerò l'è molto utile. Ad esempio, poi usarla huando c'hai da torna' in una grotta che hai di già visitato.\n@c2@"
  ja: "@a@bトルネコ「かつて　制覇した洞くつなどに\n\tもう　いっかい入る時など　使うと\n\t楽に　進めるかも知れませんな。\n@c2@"
"400":
  de: "@aTorneko@bDas Teil würd' wahrscheinlich %a00750 Goldmünze%H750%X%Yn%Z einbringen, wenn man's im Geschäft verkauft.\n@c2@"
  en: "@aTorneko@bIt'd fetch about %a00750 gold coin%H750%X%Ys%Z if ya sold it in a shop.\n@c2@"
  es: "@aTorneko@bSacarías más o menos %a00750 monieda%H750%X%Ys%Z de oro si lo viendieses en una tienda.\n@c2@"
  fr: "@aTorneko@bVous pourriez en tirer %a00750 pièce%I750%X%Ys%Z d'or dans un magasin.\n@c2@"
  it: "@aBaldo@bCi poi fa' %a00750 %H750%Xmoneta%Ymonete%Z d'oro, se la cedi a una bottega.\n@c2@"
  ja: "@a@bトルネコ「もし店屋に売れば\n\t%a00750ゴールドに\n\tなるでしょうな。\n@c2@"
"401":
  de: "@aTorneko@bHmm... Mit diesem Gegenstand kann man zu einem Ort gelangen, an dem man schon mal war.\n@c2@"
  en: "@aTorneko@bHmm... 'Tis an item that can take ye back to a place ye've been to already.\n@c2@"
  es: "@aTorneko@bMmm... Este objieto puede llievarte de nuevo a un sitio en el que ya hayas estado.\n@c2@"
  fr: "@aTorneko@bMmm... C'est un objet qui vous permet de revenir dans un endroit que vous avez déjà visité.\n@c2@"
  it: "@aBaldo@bUhm... Se 'un mi sbaglio, quest'affare ti permette di torna' nei luoghi che hai di già visitato.\n@c2@"
  ja: "@a@bトルネコ「ふむ……。\n\tこれは　一度行った場所に\n\t戻ることができる　道具ですね。\n@c2@"
"402":
  de: "@aTorneko@bEin guter Abenteurer sollte immer einen von diesen Flügeln bei sich tragen. Für den Fall der Fälle.\n@c2@"
  en: "@aTorneko@bA cute adventurer is sure to be carryin' at least one all the time. Just in case, like.\n@c2@"
  es: "@aTorneko@bUn aventuriero astuto siempre llieva al menos una. Por si las mioscas, sí.\n@c2@"
  fr: "@aTorneko@bTout aventurier qui se respecte se doit d'en avoir une sur lui. Au cas où...\n@c2@"
  it: "@aBaldo@bNessun avventuriero degno di huesto nome dimenticherebbe mai di portarne con sé almeno una. L'è una roba davvero utile, sai?\n@c2@"
  ja: "@a@bトルネコ「いざという時のために\n\t常に　ひとつは持っていたい\n\t道具です。\n@c2@"
"403":
  de: "@aTorneko@bAllerdings kann man sie nur einmal gebrauchen.\n@c2@"
  en: "@aTorneko@bOnce ye've used it, that's it.\nIt's gone forevermore.\n@c2@"
  es: "@aTorneko@bDespués de usarla, si acabó.\nSi acabó para siemprie.\n@c2@"
  fr: "@aTorneko@bVous ne pouvez malheureusement vous en servir qu'une fois.\nAprès, elle disparaît.\n@c2@"
  it: "@aBaldo@bRihorda che ogni pezzo pole esse' usato una volta sola! Dopo che l'hai impiegata, 'un c'è più!\n@c2@"
  ja: "@a@bトルネコ「どうやら　一度　使うと\n\tなくなってしまうようです。\n@c2@"
"404":
  de: "@aTorneko@bDas Teil würd' wahrscheinlich %a00750 Goldmünze%H750%X%Yn%Z einbringen, wenn man's im Geschäft verkauft.\n@c2@"
  en: "@aTorneko@bIt'd fetch about %a00750 gold coin%H750%X%Ys%Z if ya sold it in a shop.\n@c2@"
  es: "@aTorneko@bSacarías más o mienos %a00750 moneda%H750%X%Ys%Z de oro si la viendieses en una tienda.\n@c2@"
  fr: "@aTorneko@bVous pourriez en tirer %a00750 pièce%I750%X%Ys%Z d'or dans un magasin.\n@c2@"
  it: "@aBaldo@bSe la cedi a una bottega, ci rihavi %a00750 %H750%Xmoneta%Ymonete%Z d'oro.\n@c2@"
  ja: "@a@bトルネコ「もし店屋に売れば\n\t%a00750ゴールドに\n\tなるでしょうな。\n@c2@"
"405":
  de: "@aTorneko@bAh, die Knolle der mysteriösen Mondrauten, die nur bei Vollmond blühen.\n@c2@"
  en: "@aTorneko@bAh, 'tis the bulb o' the mysterious moonwort, that only flowers when there's a full moon.\n@c2@"
  es: "@aTorneko@b¡Ah!, este es el bulbo de la mistieriosa planta lunar, que solo floriece en luna llena.\n@c2@"
  fr: "@aTorneko@bAh, c'est un bulbe de botryche lunaire.\nCette plante ne fleurit qu'à la pleine lune.\n@c2@"
  it: "@aBaldo@bOh, la misteriosa Erbaluna, che fiorisce solo quando c'è la luna piena.\n@c2@"
  ja: "@a@bトルネコ「ふむ……。\n\tこれは　満月の夜にだけ\n\t咲くという　不思議な草です。\n@c2@"
"406":
  de: "@aTorneko@bSie hat die Macht, Lähmungen aufzuheben, und zwar auf der Stelle.\n@c2@"
  en: "@aTorneko@bIt can cure yer friends of paralysis, so it can. An' it takes effect right away.\n@c2@"
  es: "@aTorneko@bPuede curar la pariálisis de tus compañeros, sí. Y tiene efiecto inmediato.\n@c2@"
  fr: "@aTorneko@bElle permet de guérir les personnes atteintes de paralysie en un rien de temps.\n@c2@"
  it: "@aBaldo@bHa il potere di hura' dalla paralisi, e il su' effetto è immediato.\n@c2@"
  ja: "@a@bトルネコ「これを使えば\n\tマヒした身体を　たちどころに\n\t回復してくれるでしょう。\n@c2@"
"407":
  de: "@aTorneko@bAllerdings kann man sie nur einmal gebrauchen. Danach muss man eine neue finden.\n@c2@"
  en: "@aTorneko@bBut ye can only use it once. After that, ye'll have to find yerself another one.\n@c2@"
  es: "@aTorneko@bPero es de un solo uso. Para violver a usarlo tiendrás que encontrar otro.\n@c2@"
  fr: "@aTorneko@bBien entendu, vous ne pouvez vous en servir qu'une fois. Après ça, elle disparaît.\n@c2@"
  it: "@aBaldo@bPerò pole esse' utilizzata una sola volta, e poi scompare. Se vorrai usarla ancora, dovrai trovarne dell'altra.\n@c2@"
  ja: "@a@bトルネコ「しかし　一度　使うと\n\tなくなってしまうようですな。\n@c2@"
"408":
  de: "@aTorneko@bDas Teil würd' wahrscheinlich %a00750 Goldmünze%H750%X%Yn%Z einbringen, wenn man's im Geschäft verkauft.\n@c2@"
  en: "@aTorneko@bIt'd fetch about %a00750 gold coin%H750%X%Ys%Z if ya sold it in a shop.\n@c2@"
  es: "@aTorneko@bSacarías más o menos %a00750 monieda%H620%X%Ys%Z de oro si lo viendieses en una tienda.\n@c2@"
  fr: "@aTorneko@bVous pourriez en tirer %a00750 pièce%I750%X%Ys%Z d'or dans un magasin.\n@c2@"
  it: "@aBaldo@bVendila a una bottega e ci rihaverai %a00750 %H750%Xmoneta%Ymonete%Z d'oro.\n@c2@"
  ja: "@a@bトルネコ「もし店屋に売れば\n\t%a00750ゴールドに\n\tなるでしょうな。\n@c2@"
"409":
  de: "@aTorneko@bHm...? Mann, das stinkt ja schlimmer als meine Socken.\n@c2@"
  en: "@aTorneko@bHm...? Japers, that smells worse than me socks, so it does.\n@c2@"
  es: "@aTorneko@b¿Mmm? Pior el fliequillo de la profeta, eso huele peor que unos calcietines sudiados.\n@c2@"
  fr: "@aTorneko@bMmm...ⓡ Pouah, ça sent le bouc, votre truc.\n@c2@"
  it: "@aBaldo@bEh? Maremma rancida!\nQuesta roba puzza più de' mi' halzini!\n@c2@"
  ja: "@a@bトルネコ「ふむ……？\n\tのわっ！！　こいつは\n\tひどい　においですね……。\n@c2@"
"410":
  de: "@aTorneko@bWirkt wie 'ne Fahne, auf der steht: Hallo Monster, kommt und holt mich!\n@c2@"
  en: "@aTorneko@bUsin' this is like flyin' a flag that says would ye come an' claim me like, monsters!\n@c2@"
  es: "@aTorneko@bSi lo usas es como agitar una bandiera y gritar: ''¡Eh, monstruos! ¡Vienid a por mí!''\n@c2@"
  fr: "@aTorneko@bSi vous l'utilisez, c'est un peu comme sortir un drapeau pour prévenir les monstres que vous arrivez.\n@c2@"
  it: "@aBaldo@bSe usi quest'affare, attirerai su di te l'attenzione di hualsiasi mostro.\n@c2@"
  ja: "@a@bトルネコ「こいつを使えば\n\tにおいが出ている間は\n\t魔物に　よくねらわれそうですな。\n@c2@"
"411":
  de: "@aTorneko@bSie werden durch den Geruch angelockt. Jeden Beutel Moschus kann man allerdings nur einmal verwenden.\n@c2@"
  en: "@aTorneko@bThey're attracted to the smell. But ye can only use each pouch once before the scent runs out.\n@c2@"
  es: "@aTorneko@bLos atrae el olor. Pero solo puedes usar cada bolsita una vez, luego el olor si desvaniece.\n@c2@"
  fr: "@aTorneko@bIls sont attirés par l'odeur.\nChaque sac ne peut cependant servir qu'une fois.\n@c2@"
  it: "@aBaldo@bSai com'è, a quelle creature garba huesto strano odore. Ogni sacchetto pole esse' usato una sola volta, poi ⓕl'aromaⓖ svanisce.\n@c2@"
  ja: "@a@bトルネコ「どうやら　一度　使うと\n\tなくなってしまうようです。\n@c2@"
"412":
  de: "@aTorneko@bDas Teil würd' wahrscheinlich %a00750 Goldmünze%H750%X%Yn%Z einbringen, wenn man's im Geschäft verkauft.\n@c2@"
  en: "@aTorneko@bIt'd fetch about %a00750 gold coin%H750%X%Ys%Z if ya sold it in a shop.\n@c2@"
  es: "@aTorneko@bSacarías más o menos %a00750 monieda%H750%X%Ys%Z de oro si lo viendieses en una tienda.\n@c2@"
  fr: "@aTorneko@bVous pourriez en tirer %a00750 pièce%I750%X%Ys%Z d'or dans un magasin.\n@c2@"
  it: "@aBaldo@bUn negozio potrebbe darti %a00750 %H750%Xmoneta%Ymonete%Z d'oro.\n@c2@"
  ja: "@a@bトルネコ「もし店屋に売れば\n\t%a00750ゴールドに\n\tなるでしょうな。\n@c2@"
"413":
  de: "@aTorneko@bHm... Das ist einer von diesen seltsamen Samen.\n@c2@"
  en: "@aTorneko@bHm... 'Tis one o' those curious seeds, so it is.\n@c2@"
  es: "@aTorneko@bMmm... Es una de esas curiosas simienties, sí.\n@c2@"
  fr: "@aTorneko@bMmm... C'est l'une de ces graines bizarres.\n@c2@"
  it: "@aBaldo@bOh, che strano seme...\n@c2@"
  ja: "@a@bトルネコ「ふむ……。\n\tこいつは　不思議なタネの\n\t一種ですね。\n@c2@"
"414":
  de: "@aTorneko@bMan wird stärker, wenn man ihn isst. Nur ein bisschen, natürlich, aber immerhin.\n@c2@"
  en: "@aTorneko@bIt'll make ya stronger if y'eat it. Only a bit, but fair's fair, it's better than nuttin'.\n@c2@"
  es: "@aTorneko@bSi ti la comes, ti hará más fuerte. Solo un poquito más, pero es miejor que nada.\n@c2@"
  fr: "@aTorneko@bCelle-ci vous rend un peu plus fort%A120%X%Z%B120%Xe%Z.\nMais seulement un tout petit peu...\nFaut pas vous attendre à des miracles non plus.\n@c2@"
  it: "@aBaldo@bSe lo mangi, accresce la tu' potenza, anche se di poho.\nBeh, meglio di niente, no?\n@c2@"
  ja: "@a@bトルネコ「これを　クチにすると\n\tわずかながら　ちからが\n\tつきそうです。\n@c2@"
"415":
  de: "@aTorneko@bSie schmecken zwar ein wenig bitter, aber nach 'ner Weile gewöhnt man sich dran.\n@c2@"
  en: "@aTorneko@bⓙCourse, they're fierce bitter, but ye can get used to anytin' after a while.\n@c2@"
  es: "@aTorneko@bSon endiemoniadamente amargas, pero ti acostumbrarás al cabo de un tiempo.\n@c2@"
  fr: "@aTorneko@bLa première vous paraîtra sûrement amère, mais on s'y fait.\n@c2@"
  it: "@aBaldo@bHa un saporaccio amaro, ma dopo un po' ci s'abitua.\n@c2@"
  ja: "@a@bトルネコ「はじめは　ちょっと\n\tにがいですが　なれれば\n\tなんてことは　ありません。\n@c2@"
"416":
  de: "@aTorneko@bIch glaub nicht, dass man dafür einen guten Preis erzielen würd'. Ist vermutlich besser, wenn man ihn isst.\n@c2@"
  en: "@aTorneko@bIf ye're thinkin' o' sellin' it, I wouldn't bother. Ye'd be better off eatin' it instead.\n@c2@"
  es: "@aTorneko@bSi habías piensado vendierla, yo ni lo intentaría. Lo miejor es que ti la comas.\n@c2@"
  fr: "@aTorneko@bÇa ne vaut pas vraiment la peine de les vendre.\nJe vous conseille plutôt de les utiliser.\n@c2@"
  it: "@aBaldo@bIo 'un perderei tempo a cerca' di venderlo.\nMolto meglio mangiarlo, sehondo me.\n@c2@"
  ja: "@a@bトルネコ「店屋に売るくらいなら\n\tこいつは　使った方が得ですな。\n@c2@"
"417":
  de: "@aTorneko@bHm... Das ist einer von diesen seltsamen Samen.\n@c2@"
  en: "@aTorneko@bHm... 'Tis one o' those curious seeds, so it is.\n@c2@"
  es: "@aTorneko@bMmm... Es una de esas curiosas simienties, sí.\n@c2@"
  fr: "@aTorneko@bMmm... C'est l'une de ces graines bizarres.\n@c2@"
  it: "@aBaldo@bUhm... Huesto l'è uno di hue' semi dall'effetti partiholari.\n@c2@"
  ja: "@a@bトルネコ「ふむ……。\n\tこいつは　不思議なタネの\n\t一種ですね。\n@c2@"
"418":
  de: "@aTorneko@bMan wird schneller, wenn man ihn isst.\n@c2@"
  en: "@aTorneko@bEat it fer a wee boost o' speed, like.\n@c2@"
  es: "@aTorneko@bSi ti la comes, ti dará vielocidad.\n@c2@"
  fr: "@aTorneko@bMangez-la si vous voulez aller plus vite.\n@c2@"
  it: "@aBaldo@bMangialo, e la tu' velocità aumenterà d'un pohino.\n@c2@"
  ja: "@a@bトルネコ「これを　クチにすると\n\tわずかながら　すばやさが\n\t上がりそうです。\n@c2@"
"419":
  de: "@aTorneko@bUnd sie schmecken auch noch gut dabei, auch wenn sie ein bisschen zu stark gewürzt sind.\n@c2@"
  en: "@aTorneko@bThey go down a treat, so they do, even if they are a bit spicy.\n@c2@"
  es: "@aTorneko@bSon dieliciosas, de vierdad, aunque un poco picantes.\n@c2@"
  fr: "@aTorneko@bCes graines sont assez piquantes, mais elles descendent bien.\n@c2@"
  it: "@aBaldo@bE poi è gustoso!\nForse un po' piccantino, ma comunque è saporito.\n@c2@"
  ja: "@a@bトルネコ「これは　わりと\n\t飲みやすいですが　ちょっとだけ\n\tからいですね。\n@c2@"
"420":
  de: "@aTorneko@bIch glaub nicht, dass man dafür einen guten Preis erzielen würd'. Ist vermutlich besser, wenn man ihn isst.\n@c2@"
  en: "@aTorneko@bIf ye're thinkin' o' sellin' it, I wouldn't bother. Ye'd be better off eatin' it instead.\n@c2@"
  es: "@aTorneko@bSi habías piensado vendierla, yo ni lo intentaría. Lo miejor es que ti la comas.\n@c2@"
  fr: "@aTorneko@bÇa ne vaut pas vraiment la peine de les vendre.\nJe vous conseille plutôt de les utiliser.\n@c2@"
  it: "@aBaldo@bSe fossi in te, 'un lo venderei, ma lo custodirei... nello stomaco! Ah! Ah! Ah! Maremma ridente! Certo che so' simpatiho, eh?\n@c2@"
  ja: "@a@bトルネコ「店屋に売るくらいなら\n\tこいつは　使った方が得ですな。\n@c2@"
"421":
  de: "@aTorneko@bHm... Das ist einer von diesen seltsamen Samen.\n@c2@"
  en: "@aTorneko@bHm... 'Tis one o' those curious seeds, so it is.\n@c2@"
  es: "@aTorneko@bMmm... Es una de esas curiosas simienties, sí.\n@c2@"
  fr: "@aTorneko@bMmm... C'est l'une de ces graines bizarres.\n@c2@"
  it: "@aBaldo@bQuesto è uno di que' semi che produhono effetti partiholari.\n@c2@"
  ja: "@a@bトルネコ「ふむ……。\n\tこいつは　不思議なタネの\n\t一種ですね。\n@c2@"
"422":
  de: "@aTorneko@bImmer wenn man davon isst, wird man ein wenig weiser.\n@c2@"
  en: "@aTorneko@bEv'ry time you pop one o' these in yer gob, ye wise up.\n@c2@"
  es: "@aTorneko@bCada vez que ti triagues una de estas, tu sabiduría aumentará.\n@c2@"
  fr: "@aTorneko@bChaque fois que vous en mangez une, vous devenez plus sage.\n@c2@"
  it: "@aBaldo@bMangiane uno, e la tu' saggezza aumenterà un po'.\n@c2@"
  ja: "@a@bトルネコ「これを　クチにすると\n\t飲んだ人は　なんでも\n\tかしこくなれるらしいですよ。\n@c2@"
"423":
  de: "@aTorneko@bIch wünschte, ich könnte meinem Sohn Timo einen ganzen Sack davon verabreichen.\n@c2@"
  en: "@aTorneko@bI'd love to take a sackful back fer young Tipper, so I would.\n@c2@"
  es: "@aTorneko@bMi encantaría hacierme con un saco para el joven Tarik, la vierdad.\n@c2@"
  fr: "@aTorneko@bJ'aimerais bien en rapporter un sac entier à Achille.\n@c2@"
  it: "@aBaldo@bOra che ci penso, sarà bene che ne dia hualcuno al mi' haro Balduccio, che n'ha tanto bisogno, porino!\n@c2@"
  ja: "@a@bトルネコ「できれば　うちの\n\tポポロのために　こいつを\n\t大量に　持ち帰りたいですが……\n@c2@"
"424":
  de: "@aTorneko@bIch glaub nicht, dass man dafür einen guten Preis erzielen würd'. Ist vermutlich besser, wenn man ihn isst.\n@c2@"
  en: "@aTorneko@bIf ye're thinkin' o' sellin' it, I wouldn't bother. Ye'd be better off eatin' it instead.\n@c2@"
  es: "@aTorneko@bSi habías piensado vendierla, yo ni lo intentaría. Lo miejor es que ti la comas.\n@c2@"
  fr: "@aTorneko@bÇa ne vaut pas vraiment la peine de les vendre.\nJe vous conseille plutôt de les utiliser.\n@c2@"
  it: "@aBaldo@bUn perde' tempo a venderlo, e mangialo te!\nUn po' di sale 'nzucca in più 'un ti farà certo male!\n@c2@"
  ja: "@a@bトルネコ「……と　それはさておき\n\t店屋に売るくらいなら\n\tこいつは　使った方が得ですな。\n@c2@"
"425":
  de: "@aTorneko@bHm... Das ist einer von diesen seltsamen Samen.\n@c2@"
  en: "@aTorneko@bHm... 'Tis one o' those curious seeds, so it is.\n@c2@"
  es: "@aTorneko@bMmm... Es una de esas curiosas simienties, sí.\n@c2@"
  fr: "@aTorneko@bMmm... C'est l'une de ces graines bizarres.\n@c2@"
  it: "@aBaldo@bHuesto è un seme molto partiholare.\n@c2@"
  ja: "@a@bトルネコ「ふむ……。\n\tこいつは　不思議なタネの\n\t一種ですね。\n@c2@"
"426":
  de: "@aTorneko@bDas mag sich zwar kurios anhören, aber mit jedem Samen, den man isst, wird man ein bisschen zäher.\n@c2@"
  en: "@aTorneko@bIt sounds like a bit of a horse's hoof, but they say eatin' these seeds can make yer body a bit tougher.\n@c2@"
  es: "@aTorneko@bA mí mi suena a tomadura de pielo, sí, pero dicen que si ti comes una de estas simienties, ti vuelves más duro.\n@c2@"
  fr: "@aTorneko@bÇa peut paraître un peu idiot, mais il paraît qu'on devient plus résistant en mangeant l'une de ces graines.\n@c2@"
  it: "@aBaldo@bSo che pole sembra' una bischerata, ma si dice che mangiando huesti semi si diventi un po' più forti.\n@c2@"
  ja: "@a@bトルネコ「これを　クチにすると\n\tからだが　ちょっとだけ\n\tじょうぶになるそうです。\n@c2@"
"427":
  de: "@aTorneko@bAllerdings sind die Dinger selber auch ziemlich zäh, da kann man 'ne Ewigkeit drauf rumkauen.\n@c2@"
  en: "@aTorneko@bOnly, the seeds are pretty tough themselves, so they do take a bit of chewin'.\n@c2@"
  es: "@aTorneko@bCliaro que las simientes tiambién están un poco duras, hay que masticarlas un riato, sí.\n@c2@"
  fr: "@aTorneko@bMais les graines elles-mêmes sont assez coriaces, alors il faut les mâcher assez longtemps.\n@c2@"
  it: "@aBaldo@bPerò i semi so' un po' duretti.\nBisogna mastiharli per bene e a lungo.\n@c2@"
  ja: "@a@bトルネコ「ただ　タネそのものも\n\tがんじょうなので　食べるのも\n\tひと苦労なんですよね……\n@c2@"
"428":
  de: "@aTorneko@bIch glaub nicht, dass man dafür einen guten Preis erzielen würd'. Ist vermutlich besser, wenn man ihn isst.\n@c2@"
  en: "@aTorneko@bIf ye're thinkin' o' sellin' it, I wouldn't bother. Ye'd be better off eatin' it instead.\n@c2@"
  es: "@aTorneko@bSi habías piensado vendierla, yo ni lo intentaría. Lo miejor es que ti la comas.\n@c2@"
  fr: "@aTorneko@bÇa ne vaut pas vraiment la peine de les vendre.\nJe vous conseille plutôt de les utiliser.\n@c2@"
  it: "@aBaldo@bLa voi sape' una hosa?\nMeglio mangiarlo che venderlo!\nAlmeno sehondo me, eh!\n@c2@"
  ja: "@a@bトルネコ「……と　それはさておき\n\t店屋に売るくらいなら\n\tこいつは　使った方が得ですな。\n@c2@"
"429":
  de: "@aTorneko@bAh, ein Lebenssamen, nicht wahr? Wenn man davon einen isst, vergrößert sich die Gesundheitskapazität.\n@c2@"
  en: "@aTorneko@bAh, 'tis one o' these, is it? Eatin' a seed o' life gives ye a greater capacity fer health.\n@c2@"
  es: "@aTorneko@b¡Ah!, es una de esas, ¿vierdad? Si ti comes una simientie de vida aumenta tu capacidad de salud máxima.\n@c2@"
  fr: "@aTorneko@bAh, c'est bien ce que je pense, n'est-ce pasⓡ\nEn mangeant une graine de Vie, vous faites augmenter votre Santé.\n@c2@"
  it: "@aBaldo@bOh, ma guarda te che ganzo huesto semino! Se lo mangi, la tu' hapacità massima d'energia vitale aumenta.\n@c2@"
  ja: "@a@bトルネコ「ふむ……。\n\tこの木の実は　クチにすると\n\t最大体力が上がる　木の実ですよ。\n@c2@"
"430":
  de: "@aTorneko@bSie schmecken zwar nicht besonders, aber schließlich sind sie ja ganz nützlich. Also einfach runter damit.\n@c2@"
  en: "@aTorneko@bThey don't really taste like nuttin' else, but just think of Lakanaba an' swig it down, I always say.\n@c2@"
  es: "@aTorneko@bTienen un sabor muy particular, pero, como suelo diecir: ¡tiodo por Lakanaba!\n@c2@"
  fr: "@aTorneko@bElles ont un goût bien particulier, mais bon, on n'a rien sans rien.\n@c2@"
  it: "@aBaldo@bUn sa di molto. Se chiudi l'occhi e lo mandi giù 'un t'accorgi nemmeno d'averlo mangiato.\n@c2@"
  ja: "@a@bトルネコ「ちょっと　クセのある\n\t味ですが　体力が上がると\n\t思えば　なんてことありませんね。\n@c2@"
"431":
  de: "@aTorneko@bIch würd' den jedenfalls nicht verkaufen. Behaltet ihn lieber.\n@c2@"
  en: "@aTorneko@bYe wouldn't want to sell it now.\nYe'd be better off keepin' it fer yerself.\n@c2@"
  es: "@aTorneko@bNo es una buena idea vienderla.\nSierá miejor que ti la quedes, sí.\n@c2@"
  fr: "@aTorneko@bNe la vendez pas.\nJe vous conseille plutôt de la garder pour vous.\n@c2@"
  it: "@aBaldo@bSe hai sale 'nzucca, 'un lo vendi, ma te lo pappi te!\n@c2@"
  ja: "@a@bトルネコ「店屋に売るくらいなら\n\tこいつは　使った方が得ですな。\n@c2@"
"432":
  de: "@aTorneko@bAh, das ist einer dieser Samen, der die Magiekapazitäten erhöht.\n@c2@"
  en: "@aTorneko@bAh, 'tis one o' those seeds that boosts yer capacity fer magic, so it is.\n@c2@"
  es: "@aTorneko@b¡Ah!, una de esas simienties que aumentan tu capacidiad mágica, sí.\n@c2@"
  fr: "@aTorneko@bAh, c'est une graine qui augmentera vos capacités à pratiquer la magie.\n@c2@"
  it: "@aBaldo@bOh, huesto l'è un seme che aumenta la tu' hapacità massima d'energia magiha.\n@c2@"
  ja: "@a@bトルネコ「ふむ……。\n\tこの木の実は　クチにすると\n\t最大魔力が上がる　木の実ですよ。\n@c2@"
"433":
  de: "@aTorneko@bSie schmecken schlimmer als Vogeldreck, aber schließlich sind sie ja sehr praktisch.\n@c2@"
  en: "@aTorneko@bThey taste worse than manure, but it's fer a good cause, like.\n@c2@"
  es: "@aTorneko@bSaben pieor que el estiércol, pero piensa que es por tu bien.\n@c2@"
  fr: "@aTorneko@bCes graines ont un goût pire que le fumier, mais c'est pour la bonne cause, nonⓡ\n@c2@"
  it: "@aBaldo@bIl gusto? Beh, diciamo che lo sterco di havallo l'è più saporito... Ma è per una bona hausa, maremma seminatrice!\n@c2@"
  ja: "@a@bトルネコ「味は　まったく最低ですが\n\t魔力のためと思って\n\t鼻をつまんででも　飲むべきです。\n@c2@"
"434":
  de: "@aTorneko@bIch würd' den jedenfalls nicht verkaufen. Behaltet ihn lieber.\n@c2@"
  en: "@aTorneko@bYe wouldn't want to sell it now.\nYe'd be better off keepin' it fer yerself.\n@c2@"
  es: "@aTorneko@bNo es una buena idea vienderla.\nSierá miejor que ti la quedes, sí.\n@c2@"
  fr: "@aTorneko@bNe la vendez pas.\nJe vous conseille plutôt de la garder pour vous.\n@c2@"
  it: "@aBaldo@bMi raccomando!\n'Un lo vende', ma mangialo te, che ti farà un gran bene!\n@c2@"
  ja: "@a@bトルネコ「店屋に売るくらいなら\n\tこいつは　使った方が得ですな。\n@c2@"
"435":
  de: "@aTorneko@bAh, der Diebesschlüssel!\n@c2@"
  en: "@aTorneko@bAh, 'tis the thief's key, so it is!\n@c2@"
  es: "@aTorneko@b¡Vaya, si es la llave de ladrón!\n@c2@"
  fr: "@aTorneko@bMais c'est une clef de voleur que vous avez làⓠ\n@c2@"
  it: "@aBaldo@bOh, la Chiave del ladro.\nMaremma serratura, se l'è bellina!\n@c2@"
  ja: "@a@bトルネコ「ふむ……。\n\tこいつは　とうぞくのカギですね。\n@c2@"
"436":
  de: "@aTorneko@bMit diesem kleinen Freund gelangt man durch viele abgesperrte Türen.\n@c2@"
  en: "@aTorneko@bAye, ye can get through many a locked door with this little lad.\n@c2@"
  es: "@aTorneko@bCon este chisme piodrás abrir muchas puertas cierradas, sí.\n@c2@"
  fr: "@aTorneko@bGrâce à elle, la plupart des portes s'ouvriront devant vous.\n@c2@"
  it: "@aBaldo@bHuest'amiha huì ti permetterà d'apri' parecchie porte hiuse, ma parecchie tante.\n@c2@"
  ja: "@a@bトルネコ「これさえあれば\n\tカギのかかったトビラでも　かんたんに\n\tあけてしまえるでしょう。\n@c2@"
"437":
  de: "@aTorneko@bAllerdings würd' ich damit nicht in Geschäften hausieren gehen. Macht keinen guten Eindruck.\n@c2@"
  en: "@aTorneko@bI wouldn't go flashin' it about in shops an' the like though, if I were you.\n@c2@"
  es: "@aTorneko@bYo en tu lugar no la exhibiría diemasiado en las tiendas y eso.\n@c2@"
  fr: "@aTorneko@bÀ votre place, j'irais pas la montrer dans les magasins.\n@c2@"
  it: "@aBaldo@bSe fossi al tu' posto, 'un la farei vede' troppo 'ngiro, ne' negozi o altrove.\n@c2@"
  ja: "@a@bトルネコ「店屋とかには　あまり\n\t見せないほうが　よいかも\n\t知れませんな。\n@c2@"
"438":
  de: "@aTorneko@bHmm... Ich hab schon viel gehört über diesen Schlüssel. Im Volksmund wird er Zauberschlüssel genannt.\n@c2@"
  en: "@aTorneko@bHmm... I've heard a fair few tales about this key. 'Tis known as the magic key.\n@c2@"
  es: "@aTorneko@bMmm... He oído contar muchas historias sobrie esta llave. La llaman la llave mágica.\n@c2@"
  fr: "@aTorneko@bMmm... Ah oui, j'ai entendu parler de cette clef.\nOn l'appelle la clef magique.\n@c2@"
  it: "@aBaldo@bHuesta l'è la Chiave del potere.\nSe ne raccontano parecchie in giro, su huest'oggetto...\n@c2@"
  ja: "@a@bトルネコ「ふむふむ……。\n\tこいつは　ウワサに聞く\n\tまほうのカギですね。\n@c2@"
"439":
  de: "@aTorneko@bMan sieht schon auf den ersten Blick, dass er aus einem ungewöhnlichen Material gefertigt ist.\n@c2@"
  en: "@aTorneko@bYe can see just by lookin' that it's made o' sometin' mighty strange.\n@c2@"
  es: "@aTorneko@bCon solo mirarla ya ti das cuenta de que está hecha de un matierial muy extraño.\n@c2@"
  fr: "@aTorneko@bSi vous la regardez bien, vous verrez qu'elle est fabriquée dans un matériau très étrange.\n@c2@"
  it: "@aBaldo@bBasta guardarla per rendersi honto ch'è fatta d'un materiale parecchio strano, ma parecchio tanto!\n@c2@"
  ja: "@a@bトルネコ「見るからに\n\t変わった素材でできていますな。\n@c2@"
"440":
  de: "@aTorneko@bUnd außerdem öffnet er einem so manche Tür.\n@c2@"
  en: "@aTorneko@bAye, it'll open a good few doors for ya, so it will.\n@c2@"
  es: "@aTorneko@bY ti abrirá unas cuantas puertas.\n@c2@"
  fr: "@aTorneko@bElle vous permettra d'ouvrir un paquet de portes, croyez-moi.\n@c2@"
  it: "@aBaldo@bHuesta hiave pole apri' un monte di porte.\n@c2@"
  ja: "@a@bトルネコ「これさえあれば\n\tカギのかかったトビラでも　かんたんに\n\tあけてしまえるでしょう。\n@c2@"
"441":
  de: "@aTorneko@bAllerdings würd' ich damit nicht in Geschäften hausieren gehen. Macht keinen guten Eindruck.\n@c2@"
  en: "@aTorneko@bBut I wouldn't go flashin' it about in shops an' the like though, if I were you.\n@c2@"
  es: "@aTorneko@bPero yo en tu lugar no la exhibiría diemasiado en las tiendas y eso.\n@c2@"
  fr: "@aTorneko@bÀ votre place, j'irais pas la montrer dans les magasins.\n@c2@"
  it: "@aBaldo@bSe fossi al tu' posto, 'un la farei vede' troppo 'ngiro, ne' negozi o altrove.\n@c2@"
  ja: "@a@bトルネコ「店屋とかには　あまり\n\t見せないほうが　よいかも\n\t知れませんな。\n@c2@"
"442":
  de: "@aTorneko@bBei diesem schönen Schlüssel handelt es sich um den Universalschlüssel.\n@c2@"
  en: "@aTorneko@bThis key here's what folks call the ultimate key.\n@c2@"
  es: "@aTorneko@bA esta llave si le llama la llave supriema.\n@c2@"
  fr: "@aTorneko@bCette clef, on l'appelle la clef suprême.\n@c2@"
  it: "@aBaldo@bHuesta è honosciuta con il nome di Chiave del potere.\n@c2@"
  ja: "@a@bトルネコ「ふむふむ……。\n\tこれは　さいごのカギですね。\n@c2@"
"443":
  de: "@aTorneko@bDamit kann man so gut wie alles öffnen. Sogar Kerkertüren, jawohl.\n@c2@"
  en: "@aTorneko@bYe can open pretty much anytin' with it.\nEven jail cells, like.\n@c2@"
  es: "@aTorneko@bCon ella puedes abrir casi cualquier cosa.\nHasta la cielda de una cárcel.\n@c2@"
  fr: "@aTorneko@bVous pouvez ouvrir presque tout avec.\nMême les portes de prison.\n@c2@"
  it: "@aBaldo@bPole apri' pratihamente hualsiasi serratura, persino huelle delle porte delle celle.\n@c2@"
  ja: "@a@bトルネコ「このカギがあれば\n\tなんと　牢屋のトビラでさえ\n\t開くことが　できるでしょう。\n@c2@"
"444":
  de: "@aTorneko@bAllerdings würd' ich damit nicht in Geschäften hausieren gehen. Macht keinen guten Eindruck.\n@c2@"
  en: "@aTorneko@bI wouldn't go flashin' it about in shops an' the like, if I were you. Keep it to yerself.\n@c2@"
  es: "@aTorneko@bPero yo en tu lugar no la exhibiría diemasiado en las tiendas y eso. Mantienla oculta.\n@c2@"
  fr: "@aTorneko@bÀ votre place, j'irais pas la montrer dans les magasins. Gardez-la pour vous.\n@c2@"
  it: "@aBaldo@bSe fossi al tu' posto, 'un la farei vede' troppo 'ngiro, ne' negozi o altrove. Tientela per te.\n@c2@"
  ja: "@a@bトルネコ「店屋とかには　あまり\n\t見せないほうが　よいかも\n\t知れませんな。\n@c2@"
"445":
  de: "@aTorneko@bHm... Das ist gesegnetes Wasser.\n@c2@"
  en: "@aTorneko@bHm... Aye, 'tis blessed, so it is, this water.\n@c2@"
  es: "@aTorneko@bMmm... Ah, esta agua ha sido biendecida, sí.\n@c2@"
  fr: "@aTorneko@bMmm... Oui, elle est bénite, cette eau.\n@c2@"
  it: "@aBaldo@bUhm... Huest'acqua è benedetta.\n@c2@"
  ja: "@a@bトルネコ「ふむ……。　こいつは\n\tどうやら　聖なるチカラの\n\t祝福を　受けているようです。\n@c2@"
"446":
  de: "@aTorneko@bGenau das Richtige, wenn die magischen Fähigkeiten gerade ein wenig nachlassen.\n@c2@"
  en: "@aTorneko@bDrink it when yer magic's a bit low, and it'll go some way to restorin' it.\n@c2@"
  es: "@aTorneko@bSi la biebes cuando tu magia esté baja, hará que la riecuperes en parte.\n@c2@"
  fr: "@aTorneko@bBuvez-en quand votre puissance magique est un peu faible et son niveau remontera.\n@c2@"
  it: "@aBaldo@bBevine un po' huando la tu' energia magiha l'è bassa, e rehupererai un po' di potere.\n@c2@"
  ja: "@a@bトルネコ「これを使えば\n\t減ってしまった魔力を　ある程度\n\t回復してくれることでしょう。\n@c2@"
"447":
  de: "@aTorneko@bAber wenn man es mal getrunken hat, ist es weg. Ist nur zum einmaligen Gebrauch bestimmt.\n@c2@"
  en: "@aTorneko@bBut it's a once only job, this.\nOnce ye've used it, that's it.\n@c2@"
  es: "@aTorneko@bPero es solo de un uso.\nDespués de usarla, si acabó.\n@c2@"
  fr: "@aTorneko@bMalheureusement, elle ne sert qu'une fois.\nAprès ça, c'est fini.\n@c2@"
  it: "@aBaldo@bMa rihorda che hueste huì so' monoporzioni: una volta bevuta, l'è bell'è finita!\n@c2@"
  ja: "@a@bトルネコ「しかし　一度　使うと\n\tなくなってしまうようですな。\n@c2@"
"448":
  de: "@aTorneko@bDas Teil würd' wahrscheinlich %a00750 Goldmünze%H750%X%Yn%Z einbringen, wenn man's im Geschäft verkauft.\n@c2@"
  en: "@aTorneko@bIt'd fetch about %a00750 gold coin%H750%X%Ys%Z if ya sold it in a shop.\n@c2@"
  es: "@aTorneko@bSacarías más o mienos %a00750 monieda%H750%X%Ys%Z de oro si la viendieses en una tienda.\n@c2@"
  fr: "@aTorneko@bVous pourriez en tirer %a00750 pièce%I750%X%Ys%Z d'or dans un magasin.\n@c2@"
  it: "@aBaldo@bSe la vendi a una bottega, ci potrai rihava' %a00750 %H750%Xmoneta%Ymonete%Z d'oro.\n@c2@"
  ja: "@a@bトルネコ「もし店屋に売れば\n\t%a00750ゴールドに\n\tなるでしょうな。\n@c2@"
"449":
  de: "@aTorneko@bAh, der Spiegel des Ra.\n@c2@"
  en: "@aTorneko@bAh, 'tis a mirror of Ra, so it is.\n@c2@"
  es: "@aTorneko@b¡Vaya, un espiejo de Ra!\n@c2@"
  fr: "@aTorneko@bAh, c'est un miroir de Râ.\n@c2@"
  it: "@aBaldo@bSì, huesto l'è lo Specchio di Ra.\n@c2@"
  ja: "@a@bトルネコ「おお……。　これは\n\t世に聞く　ラーのかがみですね。\n@c2@"
"450":
  de: "@aTorneko@bEs heißt, dass er die wahre Natur der Dinge widerspiegelt...\n@c2@"
  en: "@aTorneko@bⓙTis supposed to reflect the true nature o' things, so they say...\n@c2@"
  es: "@aTorneko@bDicen que riefleja la vierdadera naturaleza de las cosas...\n@c2@"
  fr: "@aTorneko@bIl est censé montrer la véritable nature de l'objet qui se reflète dedans...\n@c2@"
  it: "@aBaldo@bSi dice che huest'oggetto rifletta la vera natura delle hose.\n@c2@"
  ja: "@a@bトルネコ「なんと　あらゆるものの\n\t真実の姿を　映し出すとか……。\n@c2@"
"451":
  de: "@aTorneko@bWenn ich zum Beispiel reingucke, seh ich einen jungen, attraktiven Mann... Ha ha! War nur 'n kleiner Witz am Rande.\n@c2@"
  en: "@aTorneko@bLike, if I was to look in it now, ye'd see a fine, handsome, young... Ha ha! Sure an' I was only lettin' on a bit, like.\n@c2@"
  es: "@aTorneko@bPor ejiemplo, si ahora mi mirase en él, vería a un joven apuesto y eliegante... ¡Ja, ja! Bueno, solo estaba haciendo una piequeña broma, sí.\n@c2@"
  fr: "@aTorneko@bPar exemple, si je me regardais dedans, je verrais un homme jeune, musclé et...\nHa ha haⓠ Je vous faisais marcher.\n@c2@"
  it: "@aBaldo@bPer esempio, se mi ci specchiassi io, si vedrebbe un bell'omo, giovane e aitante e intelligente e audace e simpatiho e modesto e... Va bene, mi zitto.\n@c2@"
  ja: "@a@bトルネコ「つまり　私を映せば\n\tうるわしき美少年が……\n\t映るはず　ありませんね。　はい。\n@c2@"
"452":
  de: "@aTorneko@bIn einem Geschäft? Glaub ich nicht. Kein Händler der Welt könnte einen angemessenen Preis zahlen.\n@c2@"
  en: "@aTorneko@bIn a shop? I don't think so. There's no traders that'd be able to put a price on it.\n@c2@"
  es: "@aTorneko@b¿En una tienda? No lo creo. Ningún miercader podría ponerle precio.\n@c2@"
  fr: "@aTorneko@bDans un magasinⓡ Ça m'étonnerait.\nJe connais pas un marchand qui saurait vous en dire le prix.\n@c2@"
  it: "@aBaldo@bVoi venderlo a una bottega?\nUhm, dubito che te riesca a trova' un commerciante che possa farti un'offerta seria, sai?\n@c2@"
  ja: "@a@bトルネコ「それはそうと\n\t店屋では　こいつの価値は\n\tわからんでしょうな。\n@c2@"
"453":
  de: "@aTorneko@bSieht aus wie eine gute Mahlzeit, was?\n@c2@"
  en: "@aTorneko@bAh, 'tis a hearty-lookin' meal altogether, so it is.\n@c2@"
  es: "@aTorneko@bVaya, una comida suculienta, en mi opinión.\n@c2@"
  fr: "@aTorneko@bEh bien, voilà un joli repas qui m'a l'air bien copieux.\n@c2@"
  it: "@aBaldo@bMaremma affamata, che bel pranzetto!\nMi fa veni' l'acquilina 'nbocca!\n@c2@"
  ja: "@a@bトルネコ「おお……。\n\t今日も　うまそうだ。\n@c2@"
"454":
  de: "@aTorneko@bAch, niemand kocht so gut wie meine Tessa. Wenn man das isst, wird man groß und stark.\n@c2@"
  en: "@aTorneko@bAye, there's none makes a lunch like my Tess.\nY'eat that, an' it'll give ye plenty o' strength.\n@c2@"
  es: "@aTorneko@bNadie cocina tan bien como mi Trakiba.\nCómietelo y ti dará fuerzas abundiantes.\n@c2@"
  fr: "@aTorneko@bPersonne ne fait à manger comme ma Lucille.\nSi vous avalez ce repas, vous reprenez pas mal de force.\n@c2@"
  it: "@aBaldo@bBeh, devo di' che 'un c'è nessuno che sappia hucina' bene home la mi' Beatrice, eh! Se mangi hueste delizie, rehuperi un monte d'energia.\n@c2@"
  ja: "@a@bトルネコ「ネネの愛情がつまった\n\tこのべんとうを食べれば\n\t体力も　回復するってもんです。\n@c2@"
"455":
  de: "@aTorneko@bVerkaufen?! Was ist das denn für eine Idee?! Wo sie sich doch solche Mühe gemacht hat.\n@c2@"
  en: "@aTorneko@bYe can't be thinkin' o' sellin' it, surely now?\nI mean, herself went to all that trouble.\n@c2@"
  es: "@aTorneko@bNo piensarás en vienderlo ahora, ¿vierdad?\nCon todas las molestias que si ha tomado...\n@c2@"
  fr: "@aTorneko@bVous comptez quand même pas le vendreⓡ\nElle s'est donné du mal à le préparer.\n@c2@"
  it: "@aBaldo@bUn vorrai miha venderlo, vero?\nCon tutta la fatiha che ha durato per prepararlo, sarebbe un sahrilegio!\n@c2@"
  ja: "@a@bトルネコ「まさか　こいつを　店屋に\n\t売るわけには　いきませんが……\n@c2@"
"456":
  de: "@aTorneko@bDas Teil würd' wahrscheinlich %a00750 Goldmünze%H750%X%Yn%Z einbringen, wenn man's im Geschäft verkauft.\n@c2@"
  en: "@aTorneko@bIt'd fetch about %a00750 gold coin%H750%X%Ys%Z if ya sold it in a shop.\n@c2@"
  es: "@aTorneko@bSacarías más o menos %a00750 monieda%H750%X%Ys%Z de oro si lo viendieses en una tienda.\n@c2@"
  fr: "@aTorneko@bVous pourriez en tirer %a00750 pièce%I750%X%Ys%Z d'or dans un magasin.\n@c2@"
  it: "@aBaldo@bComunque, se lo cedi a una bottega, ci farai %a00750 %H750%Xmoneta%Ymonete%Z d'oro.\n@c2@"
  ja: "@a@bトルネコ「もし店屋に売れば\n\t%a00750ゴールドに\n\tなるでしょうな。\n@c2@"
"457":
  de: "@aTorneko@bWas zum... He, ich will das nicht vor meinem Gesicht haben!\n@c2@"
  en: "@aTorneko@bFer the love o'ⓚⓛ What are y'at, stickin' that in me face!?\n@c2@"
  es: "@aTorneko@b¡Por el amor de la Diosa! ¡Quita eso de mi vista!\n@c2@"
  fr: "@aTorneko@bMais qu'est-ce que... Ça va pasⓠ\nPourquoi vous me mettez ça sous le nezⓡ\n@c2@"
  it: "@aBaldo@bMaremma lercia!\nAllontana huella fonte di puzza dalla mi' faccia!\n@c2@"
  ja: "@a@bトルネコ「の…のわっち！！\n\tなんで　私が　こんなものを\n\tしげしげと　見なきゃいけないんだ！\n@c2@"
"458":
  de: "@aTorneko@bDas ist ungefähr so nützlich wie ein Teekessel aus Schokolade.\n@c2@"
  en: "@aTorneko@bⓙTis about as useful as a chocolate teapot.\n@c2@"
  es: "@aTorneko@bEs más inútil que un piaraguas de azúcar.\n@c2@"
  fr: "@aTorneko@bC'est à peu près aussi utile qu'une épée en chocolat.\n@c2@"
  it: "@aBaldo@bCerto, l'è molto utile, come no?!\nL'è utile home un carro senza rote!\n@c2@"
  ja: "@a@bトルネコ「と…とにかく\n\tこれは　いらないものですよ！\n@c2@"
"459":
  de: "@aTorneko@bUnd jetzt will ich das nicht mehr riechen, äh, ich meine sehen!\n@c2@"
  en: "@aTorneko@bNow get up the yard with it!\n@c2@"
  es: "@aTorneko@b¡Ahora, lliévatelo de aquí!\n@c2@"
  fr: "@aTorneko@bMaintenant, enlevez-moi ça de la vueⓠ\n@c2@"
  it: "@aBaldo@bOra fammi un piacere: ripigliati huesta robaccia e fila via!\n@c2@"
  ja: "@a@bトルネコ「あっちへ\n\tやっちゃってください。\n\tしっ！　しっ！\n@c2@"
"460":
  de: "@aTorneko@bAh, ein Blatt des alten Yggdrasil-Baumes.\n@c2@"
  en: "@aTorneko@bAh, a leaf o' the old Yggdrasil tree, so it is.\n@c2@"
  es: "@aTorneko@b¡Ah!, una hoja del viejo árbol Yggdrasil, sí.\n@c2@"
  fr: "@aTorneko@bOh, mais c'est une feuille d'Yggdrasil.\n@c2@"
  it: "@aBaldo@bAh, una foglia del leggendario albero Ygdrasil.\n@c2@"
  ja: "@a@bトルネコ「ふむ……。\n\tこれは　せかいじゅの葉ですね。\n@c2@"
"461":
  de: "@aTorneko@bEin Wunderheilmittel, das jeden wieder zum Leben erweckt.\n@c2@"
  en: "@aTorneko@bA miracle cure that can bring one of yer party back to life in battle.\n@c2@"
  es: "@aTorneko@bEs una miedicina milagrosa que puede riesucitar a un miembro de tu grupo durante el combate.\n@c2@"
  fr: "@aTorneko@bC'est un remède miracle qui peut ressusciter n'importe quel membre de votre équipe lors d'un combat.\n@c2@"
  it: "@aBaldo@bPoi prepararci una hura miraholosa che ti permette di riporta' 'nvita uno dei tu' compagni, nel malaugurato haso perisca 'nbattaglia.\n@c2@"
  ja: "@a@bトルネコ「戦いに敗れ\n\t息絶えた者に　飲ませると\n\t再び目をさます　奇跡の葉です。\n@c2@"
"462":
  de: "@aTorneko@bNatürlich kann man es nur einmal benutzen, aber trotzdem... Welch ein großartiger Gegenstand!\n@c2@"
  en: "@aTorneko@bⓙCourse, ya can only use it the one time, like, but it's a grand item still an' all.\n@c2@"
  es: "@aTorneko@bClaro que es de un solo uso, pero aún así es un objeto fantiástico.\n@c2@"
  fr: "@aTorneko@bBien entendu, vous ne pouvez l'utiliser qu'une fois, mais c'est un objet exceptionnel.\n@c2@"
  it: "@aBaldo@bLa poi usa' una sola volta, e poi finisce.\nPerò l'è pur sempre un oggetto d'enorme utilità.\n@c2@"
  ja: "@a@bトルネコ「しかし　一度　使うと\n\tなくなってしまうようですな。\n@c2@"
"463":
  de: "@aTorneko@bBei einem Verkauf würd' man nie das bekommen, was diese Kostbarkeit wirklich wert ist.\n@c2@"
  en: "@aTorneko@bIf ya took it to a shop, they wouldn't be able to give y'a price fer it, I reckon.\n@c2@"
  es: "@aTorneko@bSi la llevas a una tienda no ti podrán dar un priecio por ella, creo yo.\n@c2@"
  fr: "@aTorneko@bSi vous vous présentiez dans un magasin avec, aucun marchand ne serait en mesure de vous l'acheter.\n@c2@"
  it: "@aBaldo@bPenso che nessun negozio sarebbe 'ngrado di farti un'offerta seria, se te tu decidessi di venderla.\n@c2@"
  ja: "@a@bトルネコ「店屋では　こいつの価値は\n\tまず　わからんでしょう。\n@c2@"
"464":
  de: "@aTorneko@bAh, ein taufrischer Tropfen Tau...\n@c2@"
  en: "@aTorneko@bAh, what a fresh-smellin' drop o' dew ye have here...\n@c2@"
  es: "@aTorneko@bVaya, qué olor más friesco el de esta gota de rocío...\n@c2@"
  fr: "@aTorneko@bC'est une bien jolie goutte de rosée que vous avez là...\n@c2@"
  it: "@aBaldo@bMaremma frigorifera, senti huant'è fresca huesta goccia di rugiada!\n@c2@"
  ja: "@a@bトルネコ「ふむ……。\n\tこれは　とても　いい香りのする\n\tしずくですね。\n@c2@"
"465":
  de: "@aTorneko@bWenn's einem im Kampf zu bunt wird, kann man davon trinken, um wieder in Form zu kommen.\n@c2@"
  en: "@aTorneko@bWhen youse are all gettin' a bit jaded in battle, ye can drink this to get back on form.\n@c2@"
  es: "@aTorneko@bSi sientes agotamiento en la batalla, biébela y ti pondrás de nuevo en forma.\n@c2@"
  fr: "@aTorneko@bQuand vous commencez à avoir une baisse de régime au combat, buvez cette rosée pour repartir en pleine forme.\n@c2@"
  it: "@aBaldo@bSe la stanchezza ti prende durante una battaglia, bevi huesto nettare e tornerai 'npiena forma.\n@c2@"
  ja: "@a@bトルネコ「戦いに疲れきったとき\n\tこれを使えば　みんな\n\t再び　元気が出そうです。\n@c2@"
"466":
  de: "@aTorneko@bNatürlich kann man den Tau nur einmal trinken, aber trotzdem. Welch eine nützliche Sache!\n@c2@"
  en: "@aTorneko@bⓙCourse, ye can only use it the one time, like, but it's a grand item still an' all.\n@c2@"
  es: "@aTorneko@bClaro que es de un solo uso, pero aún así es un objieto fantiástico.\n@c2@"
  fr: "@aTorneko@bBien entendu, vous ne pouvez l'utiliser qu'une fois, mais c'est un objet exceptionnel.\n@c2@"
  it: "@aBaldo@bHuesta bevanda è utilissima, anche se la poi usa' una sola volta, e poi finisce.\n@c2@"
  ja: "@a@bトルネコ「しかし　一度　使うと\n\tなくなってしまうようですな。\n@c2@"
"467":
  de: "@aTorneko@bBei einem Verkauf würd' man nie das bekommen, was diese Kostbarkeit wirklich wert ist.\n@c2@"
  en: "@aTorneko@bIf ye took it to a shop, they wouldn't be able to give y'a price fer it, I reckon.\n@c2@"
  es: "@aTorneko@bSi la llevas a una tienda no ti podrán dar un priecio por ella, creo yo.\n@c2@"
  fr: "@aTorneko@bSi vous vous présentiez dans un magasin avec, aucun marchand ne serait en mesure de vous l'acheter.\n@c2@"
  it: "@aBaldo@bUn penso che ci sia hualche negoziante che possa farti un'offerta seria, se te tu decidessi di venderla.\n@c2@"
  ja: "@a@bトルネコ「店屋では　こいつの価値は\n\tまず　わからんでしょう。\n@c2@"
"468":
  de: "@aTorneko@bHm... Eine kleine Medaille.\n@c2@"
  en: "@aTorneko@bHm... 'Tis a curious little medal, so it is.\n@c2@"
  es: "@aTorneko@bMmm... Es una miedallita bien curiosa, sí.\n@c2@"
  fr: "@aTorneko@bMmm... Quelle étrange petite médaille...\n@c2@"
  it: "@aBaldo@bMa te guarda che ganza huesta medaglia piccina piccina!\n@c2@"
  ja: "@a@bトルネコ「ふむ……。\n\tヘンテコリンなメダルですね。\n@c2@"
"469":
  de: "@aTorneko@bIch glaub nicht, dass ein Händler was damit anfangen könnte...\n@c2@"
  en: "@aTorneko@bI can't imagine there'd be many traders wantin' one o' these.\n@c2@"
  es: "@aTorneko@bNo creo que haya muchos miercaderes que la quieran.\n@c2@"
  fr: "@aTorneko@bJe me demande bien quel marchand pourrait en vouloir.\n@c2@"
  it: "@aBaldo@bPersonalmente, 'un credo che una robina del genere possa 'nteressa' a qualche commerciante.\n@c2@"
  ja: "@a@bトルネコ「そういえば　このメダルを\n\t集めている人がいるとか……。\n@c2@"
"470":
  de: "@aTorneko@bAber ich hab, glaub ich, von einem Kerl gehört, der diese Dinger sammelt...\n@c2@"
  en: "@aTorneko@bBut I've a feelin' I've heard of a fella that collects them somewhere...\n@c2@"
  es: "@aTorneko@bPero mi suena haber oído hablar de un tipo que las coliecciona...\n@c2@"
  fr: "@aTorneko@bIl me semble avoir entendu que quelqu'un en faisait collection...\n@c2@"
  it: "@aBaldo@bMa se 'un sbaglio, c'è un omino da hualche parte che le holleziona.\n@c2@"
  ja: "@a@bトルネコ「店屋では　これは\n\t引き取ってくれないと思いますよ。\n@c2@"
"471":
  de: "@aTorneko@bHm... Das ist keine gewöhnliche Flöte...\n@c2@"
  en: "@aTorneko@bHmm... 'Tis not like any flute I've ever seen before...\n@c2@"
  es: "@aTorneko@bMmm... No si pariece a ninguna flauta que haya visto antes...\n@c2@"
  fr: "@aTorneko@bMmm... Elle ne ressemble à aucune flûte que je connaisse...\n@c2@"
  it: "@aBaldo@bHuesto flauto mi pare molto diverso da tutti huelli che ho visto finora...\n@c2@"
  ja: "@a@bトルネコ「ふむふむ……。\n\tこれは　不思議な細工のされた\n\t笛ですね。\n@c2@"
"472":
  de: "@aTorneko@bAber wahrscheinlich kann man mit ihr trotzdem Musik machen, sonst würd' sie ja nicht Flöte heißen, richtig?\n@c2@"
  en: "@aTorneko@bBut I s'pose it must be good fer a tune if ya blow it, or it wouldn't be called a flute now, would it?\n@c2@"
  es: "@aTorneko@bPero supongo que, si la soplas, sonará. Si no, no siería una flauta, ¿vierdad?\n@c2@"
  fr: "@aTorneko@bJe suppose que vous devez pouvoir jouer un air avec. Sinon, je vois pas pourquoi on appellerait ça une flûte, nonⓡ\n@c2@"
  it: "@aBaldo@bCerto, se ci soffi dentro verrà fori hualche nota, altrimenti che razza di flauto sarebbe?\n@c2@"
  ja: "@a@bトルネコ「ものが笛だけに\n\t吹けば　音がするのでしょうが……\n@c2@"
"473":
  de: "@aTorneko@bIst auf jeden Fall ein ungewöhnlicher Gegenstand. Ich glaub nicht, dass ein Händler viel dafür geben würd'.\n@c2@"
  en: "@aTorneko@bⓙTis an unusual item. I doubt you'd find a shopkeeper that'd give y'a price on it.\n@c2@"
  es: "@aTorneko@bEs un objieto poco corriente. Dudo que encuentres un miercader que ti haga una ofierta por ella.\n@c2@"
  fr: "@aTorneko@bC'est un objet très inhabituel. Ça m'étonnerait qu'un marchand vous fasse une offre pour ça.\n@c2@"
  it: "@aBaldo@bPerò resta un oggetto parecchio strano, ma parecchio tanto. 'Un credo che possa 'nteressa' a qualche mercante.\n@c2@"
  ja: "@a@bトルネコ「店屋では　こいつの価値は\n\tまず　わからんでしょう。\n@c2@"
"474":
  de: "@aTorneko@bEin Stahlkasten! Es ist der Traum jedes fahrenden Händlers, solch einen zu besitzen.\n@c2@"
  en: "@aTorneko@bAh! A steel strongbox! 'Tis every travellin' salesman's dream to have his own one o' these.\n@c2@"
  es: "@aTorneko@b¡Ah! ¡Una caja fuerte! ¡El sueño de cualquier buhoniero!\n@c2@"
  fr: "@aTorneko@bAhⓠ Un coffre-fort de ferⓠ Tout marchand itinérant rêve d'en avoir un.\n@c2@"
  it: "@aBaldo@bOh, ma huesta è una cassetta Salvarisparmi! È il sogno di tutti i hommessi viaggiatori!\n@c2@"
  ja: "@a@bトルネコ「おおっ！\n\tこれは　旅の商人なら　だれもが\n\tあこがれるアイテムです！\n@c2@"
"475":
  de: "@aTorneko@bWenn man das Glück hat, so einen zu haben, wird man nie wieder Gold verlieren, selbst nicht bei einem Überfall.\n@c2@"
  en: "@aTorneko@bIf ye're lucky enough to have one, ya won't lose gold, even if ye're wiped out in battle.\n@c2@"
  es: "@aTorneko@bSi tienes la buena fortuna de tiener una de estas, no pierderás oro aunque ti eliminen en una batalla.\n@c2@"
  fr: "@aTorneko@bSi vous avez la chance d'en posséder un, vous ne perdrez pas d'or, même si on vous tue au combat.\n@c2@"
  it: "@aBaldo@bSe ne hai una, 'un perderai i tu' huattrini nello sciagurato haso tu ci lasci le penne 'nbattaglia.\n@c2@"
  ja: "@a@bトルネコ「これさえあれば\n\t魔物にやられても　お金が\n\t減らずに済みます！\n@c2@"
"476":
  de: "@aTorneko@bMan müsste schon verrückt sein, den verkaufen zu wollen.\n@c2@"
  en: "@aTorneko@bYe'd have to be gone in the head to sell this, so ya would.\n@c2@"
  es: "@aTorneko@bSi la viendes, estás mal de la cabieza.\n@c2@"
  fr: "@aTorneko@bIl faudrait vraiment avoir un grain pour le vendre.\n@c2@"
  it: "@aBaldo@bSolo un pazzo si separerebbe da un oggetto tanto utile!\n@c2@"
  ja: "@a@bトルネコ「店屋に　売るなんて\n\tとんでもないことですよ。\n@c2@"
"477":
  de: "@aTorneko@bDu meine Güte! Diese Handschrift ist ja noch schlimmer als die von meinem alten Herrn!\n@c2@"
  en: "@aTorneko@bJapers! 'Tis worse than me da's handwritin', an' that's the truth.\n@c2@"
  es: "@aTorneko@b¡Por las calzas de la profieta! ¡Tiene pieor letra que mi padre!\n@c2@"
  fr: "@aTorneko@bPar la Déesseⓠ Il écrit encore pire que moi, celui-là.\n@c2@"
  it: "@aBaldo@bMaremma storta!\n'Unn ho mai visto una grafia tanto brutta! L'è peggio della mia, ed è tutto dire...\n@c2@"
  ja: "@a@bトルネコ「う～～～む……。\n\tまったく　致命的に汚い字ですね。\n@c2@"
"478":
  de: "@aTorneko@bIch kann gerade so lesen, was da steht, aber... Puh, da geht's ganz schön zur Sache!\n@c2@"
  en: "@aTorneko@bI can just about make out what it says, but... Phew, 'tis a touch steamy!\n@c2@"
  es: "@aTorneko@bApienas puedo entendier lo que dice, pero... ¡Uf, es más bien picante!\n@c2@"
  fr: "@aTorneko@bJe ne comprends que vaguement ce qu'il raconte, mais... pfiou, c'est assez torrideⓠ\n@c2@"
  it: "@aBaldo@bAllora, vediamo che c'è scritto, va...\nUrca! Che parole appassionate!\n@c2@"
  ja: "@a@bトルネコ「私なら　かろうじて\n\t読めますが……　やれやれ。\n@c2@"
"479":
  de: "@aTorneko@bHm... Der Inhalt ist klar soweit, aber diese Schrift...\n@c2@"
  en: "@aTorneko@bHm... The content's sound enough, but the handwritin's desperate altogether, so it is.\n@c2@"
  es: "@aTorneko@bMmm... El contienido es muy siensato, pero la caligriafía es la de alguien desiesperado, sí.\n@c2@"
  fr: "@aTorneko@bMmm... Le contenu est assez compréhensible, mais l'écriture me semble un peu désespérée.\n@c2@"
  it: "@aBaldo@bIl senso l'ho capito, ma certo che potevano anche cerca' di scriverla 'nmaniera più comprensibile, eh!\n@c2@"
  ja: "@a@bトルネコ「内容は大マジメですが\n\tおそろしく　汚い字ですね。\n@c2@"
"480":
  de: "@aTorneko@bIch kann es gerade so lesen!\n@c2@"
  en: "@aTorneko@bI can just about read it, but...\n@c2@"
  es: "@aTorneko@bApenas puedo lieerlo, pero...\n@c2@"
  fr: "@aTorneko@bJe peux à peine le lire, mais...\n@c2@"
  it: "@aBaldo@bRiesco a malapena a leggerla...\n@c2@"
  ja: "@a@bトルネコ「私なら　かろうじて\n\t読めますが……　やれやれ。\n@c2@"
"481":
  de: "@aTorneko@bHach, welch ein süßer Anblick. Eine Wohltat für die Augen.\n@c2@"
  en: "@aTorneko@bAye, 'tis a sight fer sore eyes, so it is.\nYe can never tire o' lookin' at it.\n@c2@"
  es: "@aTorneko@bVaya, mirarla es un alivio para las almas cansiadas.\nNo puedes diejar de mirarla.\n@c2@"
  fr: "@aTorneko@bAh, quelle merveille à regarder.\nJe pourrais rester là des jours entiers.\n@c2@"
  it: "@aBaldo@bMaremma scultrice, che meraviglia!\n'Un mi stancherei mai d'ammira' questa bellezza!\n@c2@"
  ja: "@a@bトルネコ「ふむ……　美しい。\n\tいつまで見ても　あきないですよ。\n@c2@"
"482":
  de: "@aTorneko@bWär toll, wenn ich mein Haus mal mit einer davon zieren könnte. Aber das wird wohl nur ein Traum bleiben.\n@c2@"
  en: "@aTorneko@bI've a little ambition to decorate me house with one o' these. But it's only a dream at the moment, like.\n@c2@"
  es: "@aTorneko@bMi gustaría poder diecorar mi casa con una como esta. Pero de momiento no es más que un sueño.\n@c2@"
  fr: "@aTorneko@bJ'aimerais bien en avoir une pour mettre chez moi.\nEnfin... c'est un doux rêve, mais bon...\n@c2@"
  it: "@aBaldo@bMi garberebbe parecchio mettermi 'ncasa un capolavoro come questo, ma parecchio tanto. Per il momento, però, posso solo sognarlo...\n@c2@"
  ja: "@a@bトルネコ「私もいつか\n\tこんなものを　家にかざるような\n\t身分になりたいものです……。\n@c2@"
"483":
  de: "@aTorneko@bDie Göttin ist viel zu kostbar, um sie zu verkaufen. Außerdem könnte keiner das Geld für sie aufbringen.\n@c2@"
  en: "@aTorneko@bIt's far too valuable fer most shops to deal with. They wouldn't be able to afford it.\n@c2@"
  es: "@aTorneko@bEs diemasiado valiosa para la mayoría de las tiendas. No si la podrían piermitir.\n@c2@"
  fr: "@aTorneko@bElle vaut bien trop cher pour être vendue en magasin. Personne ne pourrait se l'offrir.\n@c2@"
  it: "@aBaldo@bHuesto gingillino l'è troppo prezioso perché una bottega possa homprartelo.\n@c2@"
  ja: "@a@bトルネコ「これは　あまりに\n\t高価すぎて　普通の店屋では\n\t引き取ってくれないでしょうね。\n@c2@"
"484":
  de: "@aTorneko@bHm... Hier steckt eine Menge zauberhafter Magie drin.\n@c2@"
  en: "@aTorneko@bHm... There's a good dose o' the leprechaun magic in this one, if y'ask me.\n@c2@"
  es: "@aTorneko@bMmm... Mi riecuerda a la liámpara maravillosa, sí.\n@c2@"
  fr: "@aTorneko@bMmm... M'est avis qu'il y a une magie étrange à l'œuvre là-dedans.\n@c2@"
  it: "@aBaldo@bUhm, huest'arnese huì trabocca di potere magiho.\n@c2@"
  ja: "@a@bトルネコ「ふむ……。\n\tこれは　神秘的なものですね。\n@c2@"
"485":
  de: "@aTorneko@bDieses Licht hat eine blumige Sprache. Es heißt, dass es die Nacht zum Tag macht.\n@c2@"
  en: "@aTorneko@bThey've a flowery way o' sayin' what it does. They say it makes night dawn, so they do.\n@c2@"
  es: "@aTorneko@b¿Cómo es el dichio..? Es muy barroco. ¡Ah!, sí, dicen que hace amaniecer de noche.\n@c2@"
  fr: "@aTorneko@bDe manière assez poétique, on dit que cette lampe marque l'aube de la nuit.\n@c2@"
  it: "@aBaldo@bSehondo la leggenda, ha il potere di ⓕfar sbocciare la notteⓖ.\nChe poesia, eh?\n@c2@"
  ja: "@a@bトルネコ「これを使えば\n\tあたりに　闇を灯すことが\n\tできそうですが……\n@c2@"
"486":
  de: "@aTorneko@bAber das findet man schon früh genug heraus.\n@c2@"
  en: "@aTorneko@bYe'll suss it out soon enough if ya just give it a try.\n@c2@"
  es: "@aTorneko@bEn cuanto la pruebes lo entienderás.\n@c2@"
  fr: "@aTorneko@bVous comprendrez vite si vous l'essayez.\n@c2@"
  it: "@aBaldo@bMa lo vedrai con i tu' stessi occhi huando la proverai.\n@c2@"
  ja: "@a@bトルネコ「こいつの効果は\n\t使ってみた方が　はやいかも\n\tしれませんね。\n@c2@"
"487":
  de: "@aTorneko@bIch glaub nicht, dass ein Händler diesen Gegenstand zu schätzen wüsste.\n@c2@"
  en: "@aTorneko@bI don't think there's much chance of a shopkeeper knowin' what it's worth, by the way.\n@c2@"
  es: "@aTorneko@bPor cierto, no creo que ningún miercader tenga ni idea de su valor.\n@c2@"
  fr: "@aTorneko@bEn tout cas, il y a peu de chances que les marchands sachent ce qu'elle vaut.\n@c2@"
  it: "@aBaldo@bPenso che nessun commerciante al mondo sia 'ngrado di homprende' il vero valore di huest'oggetto.\n@c2@"
  ja: "@a@bトルネコ「店屋では　こいつの価値は\n\tまず　わからんでしょう。\n@c2@"
"488":
  de: "@aTorneko@bMit diesem Objekt soll man die Magie von Monstern ausschalten können.\n@c2@"
  en: "@aTorneko@bⓙTis said ye can use this to seal away a monster's magic, like.\n@c2@"
  es: "@aTorneko@bDicen que esto si puede utilizar para siellar la magia de un monstruo, sí.\n@c2@"
  fr: "@aTorneko@bIl paraît qu'elle permet d'enfermer la magie d'un monstre.\n@c2@"
  it: "@aBaldo@bStando a quanto si dice, usando huest'oggetto è possibile blocca' la magia dei mostri.\n@c2@"
  ja: "@a@bトルネコ「ふむ……。\n\tこいつを使うと　魔物の呪文を\n\t封じることが　できそうですね。\n@c2@"
"489":
  de: "@aTorneko@bIch glaub nicht, dass jemand den wahren Wert dieses Gegenstands kennt.\n@c2@"
  en: "@aTorneko@bⓙTisn't the kind of item that a trader would know how to value.\n@c2@"
  es: "@aTorneko@bNingún miercader conociería el valor de un objeto como este.\n@c2@"
  fr: "@aTorneko@bC'est pas le genre d'objet dont un marchand saurait estimer la valeur.\n@c2@"
  it: "@aBaldo@bMa 'un penso che un commerciante sia 'ngrado di homprende' il valore di huest'oggetto e di farti un'offerta congrua.\n@c2@"
  ja: "@a@bトルネコ「店屋では　こいつの価値は\n\tまず　わからんでしょう。\n@c2@"
"490":
  de: "@aTorneko@bHm... Ich weiß, was das ist. Das ist ein Fass mit Schießpulver, das man unten in den Minen verwendet.\n@c2@"
  en: "@aTorneko@bHm... Aye, I know what this is. 'Tis a keg o' gunpowder like what they use down the mines.\n@c2@"
  es: "@aTorneko@bMmm... Sí, sé lo que es. Es una tinaja de pólvoria como la que si usa en las minas.\n@c2@"
  fr: "@aTorneko@bMmm... Je sais ce que c'est. C'est une jarre de poudre du genre de celles qu'ils utilisent dans les mines.\n@c2@"
  it: "@aBaldo@bOh, certo che so di che si tratta.\nHuesto è un barilotto di polvere nera, un esplosivo che di solito s'usa nelle miniere.\n@c2@"
  ja: "@a@bトルネコ「ふむ……？\n\tこいつは　炭鉱を掘るときの\n\t火薬のようですが……。\n@c2@"
"491":
  de: "@aTorneko@bLeider ist es nicht mehr viel wert. Es ist feucht geworden und zu nichts mehr zu gebrauchen.\n@c2@"
  en: "@aTorneko@bBut it's banjaxed, so it is. It's gotten damp now, an' it's useless altogether.\n@c2@"
  es: "@aTorneko@bPero si ha echado a pierder. Está húmeda y ya no sirve para nada.\n@c2@"
  fr: "@aTorneko@bMais elle a l'air toute humide.\nElle ne peut plus servir, maintenant.\n@c2@"
  it: "@aBaldo@bPerò è stato honservato male. Ha preso umidità, e ha perso buona parte del su' potere esplodente.\n@c2@"
  ja: "@a@bトルネコ「残念ながら\n\tしけっていて　使い物に\n\tならなそうです。\n@c2@"
"492":
  de: "@aTorneko@bDafür wird wohl kein Händler mehr etwas zahlen.\n@c2@"
  en: "@aTorneko@bI don't think a trader would offer y'anytin' fer it, either.\n@c2@"
  es: "@aTorneko@bY no creo que un miercader ti ofrezca nada por ella.\n@c2@"
  fr: "@aTorneko@bUn marchand digne de ce nom vous en donnerait pas une pièce d'or.\n@c2@"
  it: "@aBaldo@bPenso proprio che nessuna bottega t'offrirebbe nulla, se te decidessi di venderlo.\n@c2@"
  ja: "@a@bトルネコ「店屋では　これは\n\t引き取ってくれないと思いますよ。\n@c2@"
"493":
  de: "@aTorneko@bAch, du liebes Bisschen! Die Karte, die den legendären Schatz anzeigt!\n@c2@"
  en: "@aTorneko@bJaney Mac! 'Tis only the map that shows the location o' the legendary treasure, so it is!\n@c2@"
  es: "@aTorneko@b¡Alabada sea la Diosa! ¡Si es el mapa que muestra el liugar donde si encuentra el tiesoro legiendario!\n@c2@"
  fr: "@aTorneko@bNom d'une biqueⓠ C'est juste la carte qui montre l'emplacement d'un trésor légendaireⓠ\n@c2@"
  it: "@aBaldo@bMaremma ricca!\nMa huesta l'è la mappa che mostra dove si trova un leggendario tesoro che nessuno ha mai trovato!\n@c2@"
  ja: "@a@bトルネコ「ふむ……。\n\tこれこそは　伝説の宝の\n\tありかを示す地図です！\n@c2@"
"494":
  de: "@aTorneko@bAber trotzdem ist es sinnlos, sie zu verkaufen. Kein Händler weiß, was sie wert ist.\n@c2@"
  en: "@aTorneko@bBut still an' all, ye won't be able to find a trader that'll offer to buy it from ye.\nThey don't know what it's worth.\n@c2@"
  es: "@aTorneko@bPero aún así, no encontrarás un miercader que si ofriezca a comprártielo.\nNo sabrán cuál es su valor.\n@c2@"
  fr: "@aTorneko@bRemarquez, c'est pas pour ça que vous trouverez un marchand prêt à vous l'acheter.\nIls ne savent pas ce qu'elle vaut.\n@c2@"
  it: "@aBaldo@bTuttavia, 'un troverai molti estimatori per quest'oggetto. I mercanti 'un saprebbero nemmeno huanto valutartelo...\n@c2@"
  ja: "@a@bトルネコ「とは言っても\n\t店屋では　こいつの価値は\n\tわからんでしょうな。\n@c2@"
"495":
  de: "@aTorneko@bHm... Das sind keine von diesen seltsamen Samen, die man hier manchmal findet.\n@c2@"
  en: "@aTorneko@bHm... These aren't the same as them curious seeds that ya sometimes find about the place.\n@c2@"
  es: "@aTorneko@bMmm... Estas no son como las típicas simientes que si encuentra uno por ahí, ¿vierdad?\n@c2@"
  fr: "@aTorneko@bMmm... Elles sont différentes des graines bizarres qu'on trouve parfois en se baladant.\n@c2@"
  it: "@aBaldo@bUhm, huesto 'un mi pare uno di que' soliti semi che si trovano 'ngiro ogni tanto.\n@c2@"
  ja: "@a@bトルネコ「ふむふむ……。\n\tこれは　不思議なタネとは\n\tまた　違うものですね。\n@c2@"
"496":
  de: "@aTorneko@bDie stecken zwar voller Leben und Vitalität. Aber man darf sie auf keinen Fall so essen.\n@c2@"
  en: "@aTorneko@bTo be sure, they're full to the brim wi' vitality and life, but ye mustn't go eatin 'em as they are.\n@c2@"
  es: "@aTorneko@bEstán llienas hasta los topes de vitialidad, sí. Pero no diebes comiértelas aliegremente.\n@c2@"
  fr: "@aTorneko@bBien sûr, elles regorgent de vitalité et d'énergie, mais il ne faut pas les manger telles quelles.\n@c2@"
  it: "@aBaldo@bTrabocca d'energia e di vitalità, ma 'un lo devi assolutamente mangia' hosì com'è!\n@c2@"
  ja: "@a@bトルネコ「じつに　生命力に\n\t満ちあふれていますが……\n\tこのまま　飲むものじゃありませんね。\n@c2@"
"497":
  de: "@aTorneko@bMan muss sie irgendwo ausstreuen und wachsen lassen. Tja, aber wo der Boden sich wohl dazu eignet, Mutterkraut anzubauen...\n@c2@"
  en: "@aTorneko@bYe've to scatter 'em somewhere an' let 'em grow. Now, if ye're talkin' about somewhere with the kind o' soil that'd be good fer growin' feverfew...\n@c2@"
  es: "@aTorneko@bDiebes pliantarlas por ahí y diejar que crezcan, sí. Mi priegunto en qué liugares crecerá miejor la planta rieducefiebre.\n@c2@"
  fr: "@aTorneko@bIl faut les disperser quelque part et les laisser pousser. Reste ensuite à trouver l'endroit où le sol convient pour faire pousser de la camomille...\n@c2@"
  it: "@aBaldo@bBisogna seminarlo da hualche parte e lasciarlo cresce'. Ora hai solo da hapi' hual è un buon posto pe' fa' cresce' il Parthenio...\n@c2@"
  ja: "@a@bトルネコ「いちど　土にまく必要が\n\tありそうですね。\n\tパデキアが　育つ土地といえば……。\n@c2@"
"498":
  de: "@aTorneko@bDavon hab ich schon viel gehört. Das ist die Wurzel des legendären Mutterkrauts.\n@c2@"
  en: "@aTorneko@bI've heard folk talk about this.\n'Tis the root o' the legendary feverfew plant.\n@c2@"
  es: "@aTorneko@bHe oído hablar de esto a algunas personas.\nEs la raíz de la liegendaria planta reducefiebre.\n@c2@"
  fr: "@aTorneko@bJ'ai entendu des gens en parler.\nC'est la racine d'une plante légendaireⓢ la camomille.\n@c2@"
  it: "@aBaldo@bSì, ho sentito parecchie storie su quest'oggetto, ma parecchie tante.\nSi tratta di una Radice di parthenio.\n@c2@"
  ja: "@a@bトルネコ「ふむふむ……。\n\tこれが　ウワサに聞く\n\tパデキアのねっこですか。\n@c2@"
"499":
  de: "@aTorneko@bEs ist das erste Mal, dass ich eine zu Gesicht bekomme. Aber ich sehe direkt, dass das eine mächtige Heilpflanze ist.\n@c2@"
  en: "@aTorneko@bⓙTis the first time I've laid eyes on one, so it is. But I can see right away that it'd be a grand remedy.\n@c2@"
  es: "@aTorneko@bEs la primiera vez que le pongo la vista encima, sí. Pero en sieguida si puede ver que es un riemedio fabuloso.\n@c2@"
  fr: "@aTorneko@bC'est la première fois que j'en vois une, mais ça saute aux yeux que c'est un remède efficace.\n@c2@"
  it: "@aBaldo@bÈ la prima volta che ne vedo una co' mi' occhi, ma 'un ci vole uno scienziato pe' sape' che ci si pole fa dei medicinali miraholosi!\n@c2@"
  ja: "@a@bトルネコ「私も　実物を見るのは\n\tはじめてですが　たしかに\n\tこれは　やまいに効きそうですな。\n@c2@"
"500":
  de: "@aTorneko@bIch glaub allerdings nicht, dass man sie verkaufen könnte. An so was sind Händler nicht interessiert.\n@c2@"
  en: "@aTorneko@bI don't believe a trader would know what price to put on it, though. They wouldn't buy it from ya.\n@c2@"
  es: "@aTorneko@bSin embiargo, no creo que ningún miercader pudiese ponerle priecio. Nadie ti lo compraría.\n@c2@"
  fr: "@aTorneko@bJe ne pense pas qu'un marchand saurait l'évaluer.\nPersonne ne vous l'achèterait.\n@c2@"
  it: "@aBaldo@bSehondo me nessun mercante saprebbe a che prezzo venderla, huindi 'un la homprerebbe mai, se te volessi darla via.\n@c2@"
  ja: "@a@bトルネコ「店屋では　こいつの価値は\n\tまず　わからんでしょう。\n@c2@"
"501":
  de: "@aTorneko@bHm... Um ehrlich zu sein, kann ich nichts weiter erkennen als einen plumpen Stein.\n@c2@"
  en: "@aTorneko@bHm... To be honest, all I'm seein' here is a lump o' stone.\n@c2@"
  es: "@aTorneko@bMmm... A diecir vierdad, lo único que veo es un piedrusco.\n@c2@"
  fr: "@aTorneko@bMmm... Pour être honnête, tout ce que je vois, c'est une pierre.\n@c2@"
  it: "@aBaldo@bMa che, mi pigli pe' fondelli?\nHuesta l'è una semplice pietra!\n@c2@"
  ja: "@a@bトルネコ「ふむ……。\n\tこの場所で見ていると\n\tただの石にしか　見えませんが……\n@c2@"
"502":
  de: "@aTorneko@bAber ich denke mal, dass ihm eine große Kraft innewohnt.\n@c2@"
  en: "@aTorneko@bBut I've a strange sort o' feelin' that there's a rare power in it.\n@c2@"
  es: "@aTorneko@bPero tiengo la extraña siensación de que contiene una especie de poder.\n@c2@"
  fr: "@aTorneko@bMais j'ai l'étrange impression qu'elle renferme un pouvoir exceptionnel.\n@c2@"
  it: "@aBaldo@bNo, aspetta un pohino... \nSento che ha uno strano potere al su' interno.\n@c2@"
  ja: "@a@bトルネコ「なにやら　この石は\n\t不思議なチカラを\n\t持っていそうな気配がありますな。\n@c2@"
"503":
  de: "@aTorneko@bIch glaub allerdings nicht, dass man ihn verkaufen könnte. An so was sind Händler nicht interessiert.\n@c2@"
  en: "@aTorneko@bI don't believe a trader would know what price to put on it, though. They wouldn't buy it from ya.\n@c2@"
  es: "@aTorneko@bSin embiargo, no creo que ningún miercader pudiese ponerle priecio. Nadie ti lo compraría.\n@c2@"
  fr: "@aTorneko@bJe ne pense pas qu'un marchand saurait l'évaluer.\nPersonne ne vous l'achèterait.\n@c2@"
  it: "@aBaldo@bMa l'è un oggetto troppo strano. Roba del genere 'unn interessa a' hommercianti. 'Un saprebbero a chi venderla, e 'un la homprerebbero, se volessi cederla.\n@c2@"
  ja: "@a@bトルネコ「店屋では　こいつの価値は\n\tまず　わからんでしょう。\n@c2@"
"504":
  de: "@aTorneko@bDas ist kein gewöhnlicher Sand.\n@c2@"
  en: "@aTorneko@bⓙTis no ordinary sand, this.\n@c2@"
  es: "@aTorneko@bEsta no es arena corriente, sí.\n@c2@"
  fr: "@aTorneko@bCe n'est pas du sable ordinaire.\n@c2@"
  it: "@aBaldo@bChe ganza, huesta sabbia!\nHuesta 'unn è di certo sabbia normale, eh! Nient'affatto!\n@c2@"
  ja: "@a@bトルネコ「ふむふむ……。\n\tこれは　じつに変わった砂です。\n@c2@"
"505":
  de: "@aTorneko@bMan kann ihn im Kampf verwenden, um die Zeit zurückzudrehen.\n@c2@"
  en: "@aTorneko@bYe can use it in battle to turn back the hands o' time.\n@c2@"
  es: "@aTorneko@bPuedes usiarla en combate para darle la vuelta al tiempo.\n@c2@"
  fr: "@aTorneko@bVous pouvez l'utiliser au combat pour inverser le cours du temps.\n@c2@"
  it: "@aBaldo@bPoi usarla 'nbattaglia per fa' torna' 'ndietro i'ttempo.\n@c2@"
  ja: "@a@bトルネコ「戦いのときに\n\tこいつを使うと　時を戻すことが\n\tできるようですね。\n@c2@"
"506":
  de: "@aTorneko@bWenn man also mal in der Zwickmühle steckt, kann man den Kampf mit einer anderen Strategie von vorn beginnen.\n@c2@"
  en: "@aTorneko@bSo if ye're in a pinch, ye can start over with the battle ye're fightin' and try again with a new strategy, like.\n@c2@"
  es: "@aTorneko@bAsí, si estás en un aprieto, puedes volvier a empiezar el combiate y probar una estriategia nueva.\n@c2@"
  fr: "@aTorneko@bDonc, si les choses tournent mal, vous pouvez recommencer le combat et essayer une autre stratégie.\n@c2@"
  it: "@aBaldo@bHuindi, se ti trovi 'ndifficoltà, poi rihomincià il combattimento, magari provando a usa' una strategia diversa.\n@c2@"
  ja: "@a@bトルネコ「どうにも　ならなくなったら\n\tはじめから　さくせんを\n\t立て直すのも　手ですよ。\n@c2@"
"507":
  de: "@aTorneko@bAußerdem kann man diesen Sand so oft verwenden, wie man will. Das ist echt praktisch.\n@c2@"
  en: "@aTorneko@bAnd ye can use it as many times as ye like without it wearing out. It's dead handy.\n@c2@"
  es: "@aTorneko@bY la puedes utilizar cuantas veces quieras, no si gasta. Es muy práctica.\n@c2@"
  fr: "@aTorneko@bEn plus, vous pouvez l'utiliser autant de fois que vous voulez. C'est vraiment très pratique.\n@c2@"
  it: "@aBaldo@bInoltre, poi usarla tutte le volte che voi, tanto 'un si honsuma.\nL'è proprio un bell'oggettino utile ed effihace, eh?\n@c2@"
  ja: "@a@bトルネコ「何度　使っても\n\tなくなることは　ありません。\n\t重宝しそうですな。\n@c2@"
"508":
  de: "@aTorneko@bHmm... Das ist natürlich ein Stab, aber keiner, mit dem man sich im Kampf ausrüsten kann.\n@c2@"
  en: "@aTorneko@bHmm... 'Tis a staff, sure it is, but not one ye can kit yerself out with in battle.\n@c2@"
  es: "@aTorneko@bMmm... Es una vara, pero no está hecha para equipiarla en combate.\n@c2@"
  fr: "@aTorneko@bMmm... C'est un bâton , mais pas le genre que vous pouvez utiliser au combat.\n@c2@"
  it: "@aBaldo@bBeh, mi pare che sia un bastone, ma 'unn è del tipo che s'usa 'nbattaglia.\n@c2@"
  ja: "@a@bトルネコ「ふむふむ……。\n\tこれは　杖ですが　装備して\n\t戦うものとは　違いますね。\n@c2@"
"509":
  de: "@aTorneko@bIch weiß, was er bewirkt, aber es ist viel leichter, es einfach auszuprobieren, statt lange Erklärungen abzugeben.\n@c2@"
  en: "@aTorneko@bI could tell ye what it does, but it'd be far easier if ye just gave it a try yerself.\n@c2@"
  es: "@aTorneko@bTi podría diecir lo que hace, pero será mucho más fácil si la pruebas.\n@c2@"
  fr: "@aTorneko@bJe pourrais vous dire à quoi il sert, mais ce serait beaucoup plus simple que vous l'essayiez.\n@c2@"
  it: "@aBaldo@bLa mi' immensa honoscenza mi permetterebbe di dirti quale effetto produca huest'oggetto, ma credo sia meglio se lo provi da te.\n@c2@"
  ja: "@a@bトルネコ「この杖の効果は……\n\t私が言うより　使ってみるのが\n\tはやいですな。\n@c2@"
"510":
  de: "@aTorneko@bEr ist so einmalig, dass man gar nicht aufhören kann, ihn zu benutzen.\n@c2@"
  en: "@aTorneko@bYe'll most likely get carried away and be usin' it all the time.\n@c2@"
  es: "@aTorneko@bSeguro que ti encanta y no diejas de utilizarla.\n@c2@"
  fr: "@aTorneko@bM'est avis que vous serez conquis%A120%X%Z%B120%Xe%Z et que vous l'utiliserez tout le temps.\n@c2@"
  it: "@aBaldo@bSo' convinto che ti garberà così tanto che finirai pe' usarlo parecchio di frequente, ma parecchio tanto!\n@c2@"
  ja: "@a@bトルネコ「楽しくて　思わず\n\t何度も　使ってしまうかも\n\tしれませんよ。\n@c2@"
"511":
  de: "@aTorneko@bAber zum Verkaufen ist das nichts. An so was sind die Händler nicht interessiert.\n@c2@"
  en: "@aTorneko@bAnd if ye did happen to want to sell it, I think ye'd be out o' luck. No trader would give y'a price fer it.\n@c2@"
  es: "@aTorneko@bY, si piensas en vienderla, creo que no tiendrás suerte. Ningún miercader ti hará una ofierta por ella.\n@c2@"
  fr: "@aTorneko@bEt si jamais vous vouliez le vendre, vous n'auriez pas de chance, car aucun marchand ne serait en mesure de l'évaluer.\n@c2@"
  it: "@aBaldo@bMa 'un pensa' nemmeno di venderlo! 'Un troverai mai un commerciante che ti faccia un'offerta valida...\n@c2@"
  ja: "@a@bトルネコ「店屋では　こいつの価値は\n\tまず　わからんでしょう。\n@c2@"
"512":
  de: "@aTorneko@bGute Göttin! Ich trau meinen Augen nicht!\n@c2@"
  en: "@aTorneko@bDear Goddess! Do y'know what this is!?\n@c2@"
  es: "@aTorneko@b¡Diosa mía! ¡¿Piero tú sabes qué es esto?!\n@c2@"
  fr: "@aTorneko@bPar la Déesseⓠ Vous savez ce que c'estⓠⓑ\n@c2@"
  it: "@aBaldo@bDea misericordiosa!\nMa hai idea di cosa sia huest'oggetto?!\n@c2@"
  ja: "@a@bトルネコ「おおっ！\n\tこ…これは……。\n@c2@"
"513":
  de: "@aTorneko@bDas ist der Stein des Weisen! Ihm wohnt die göttliche Macht eines weisen Mannes inne.\n@c2@"
  en: "@aTorneko@bⓙTis the sage's stone, bestowed with the divine powers of an ancient sage.\n@c2@"
  es: "@aTorneko@bEs la piedra de sabio, dotada con los podieres divinos de un sabio de la antigüedad.\n@c2@"
  fr: "@aTorneko@bIl s'agit de la pierre philosophale.\nElle renferme les pouvoirs divins d'un vieux sage.\n@c2@"
  it: "@aBaldo@bSi tratta della Pietra del saggio, e ha in sé i poteri divini d'un antico sapiente.\n@c2@"
  ja: "@a@bトルネコ「これは　いにしえの賢者が\n\t聖なるチカラを　あたえたという\n\tけんじゃの石ですな！\n@c2@"
"514":
  de: "@aTorneko@bDer Schutz des Weisen wird jedem zuteil, der diesen Stein in Händen hält.\n@c2@"
  en: "@aTorneko@bAye, the sage's protection comes to the aid o' whoever's holdin' the stone.\n@c2@"
  es: "@aTorneko@bLa protiección del sabio sale en auxilio de la piersona que sostenga la piedra.\n@c2@"
  fr: "@aTorneko@bCe sage viendra en aide à celui ou celle qui tiendra cette pierre.\n@c2@"
  it: "@aBaldo@bLa protezione del saggio viene in soccorso di chiunque sia 'npossesso di huesta pietra.\n@c2@"
  ja: "@a@bトルネコ「いにしえの賢者の\n\t守りにより　これを持つ者たちの\n\t手助けを　してくれるでしょう。\n@c2@"
"515":
  de: "@aTorneko@bSo was verkauft man nicht. Da wär man ja blöd.\n@c2@"
  en: "@aTorneko@bYe don't want to let this one go.\nTo be sure ye don't.\n@c2@"
  es: "@aTorneko@bNo es una buena idea desprienderse de ella.\nDe hecho, es una mala idea.\n@c2@"
  fr: "@aTorneko@bIl ne faut pas vous en séparer. Ah ça non.\n@c2@"
  it: "@aBaldo@bSono certo che 'un vorrai privarti d'un oggetto tanto prezioso. Sì, ne sono proprio certo!\n@c2@"
  ja: "@a@bトルネコ「こいつは　とにかく\n\t手ばなしたくない道具ですね。\n@c2@"
"516":
  de: "@aTorneko@bUnd außerdem kennt kein Händler der Welt den wahren Wert dieses Steins.\n@c2@"
  en: "@aTorneko@bAnd besides, no trader would know what it's worth, so they wouldn't buy it anyway.\n@c2@"
  es: "@aTorneko@bAdiemás, ningún miercader conociería su valor, así que tampoco ti la iban a comprar...\n@c2@"
  fr: "@aTorneko@bRemarquez, aucun marchand ne saurait ce qu'elle vaut et personne ne vous l'achèterait, du coup.\n@c2@"
  it: "@aBaldo@bE poi, si tratta d'un oggetto parecchio misterioso, ma parecchio tanto, e dubito che riuscirai a trova' un mercante disposto a comprarlo.\n@c2@"
  ja: "@a@bトルネコ「とは言っても　もちろん\n\t店屋では　こいつの価値は\n\tわからんでしょうが。\n@c2@"
"517":
  de: "@aTorneko@bHm... Was haben wir denn hier?\n@c2@"
  en: "@aTorneko@bHmm... And what are we lookin' at here, then?\n@c2@"
  es: "@aTorneko@bMmm... ¿Y qué tienemos aquí?\n@c2@"
  fr: "@aTorneko@bMmm... Voyons voir de quoi il s'agit...\n@c2@"
  it: "@aBaldo@bUhm, che cos'abbiamo qui?\n@c2@"
  ja: "@a@bトルネコ「ふむ……？\n\tなんでしょうか　このガラクタは。\n@c2@"
"518":
  de: "@aTorneko@bAhhh! Bloß weg damit, das ist Gas!\n@c2@"
  en: "@aTorneko@bUrghem! Well ye don't want to be holdin' on to this fer too long. It'll gas ya, so it will.\n@c2@"
  es: "@aTorneko@b¡Agg! ¡Ejem! Bueno, seriá miejor que no llieves esto contigo durante diemasiado tiempo. Ti podrías gasear.\n@c2@"
  fr: "@aTorneko@bAhⓠ Vous n'allez pas garder ça trop longtemps, quand mêmeⓡ\nVous allez vous intoxiquer.\n@c2@"
  it: "@aBaldo@bUrca!\nSi tratta di una bombola di gas! Sono certo che troverai il modo di usarla... Eh! Eh! Eh!\n@c2@"
  ja: "@a@bトルネコ「うえっぷ！\n\tあまり長く持っていると\n\tガス中毒に　なりそうですな。\n@c2@"
"519":
  de: "@aTorneko@bIch weiß es nicht genau, aber ich glaub nicht, dass jemand was dafür bezahlen würd'.\n@c2@"
  en: "@aTorneko@bI can't say fer sure, but I don't think anyone would give y'any gold fer this.\n@c2@"
  es: "@aTorneko@bNo ti lo gariantizo, pero no creo que nadie ti pague oro por esto.\n@c2@"
  fr: "@aTorneko@bJ'en mettrais pas ma main à couper, mais ça m'étonnerait que vous trouviez à la vendre.\n@c2@"
  it: "@aBaldo@bNon posso esserne certo, ma dubito che riuscirai a trova' qualcuno disposto a comprartela...\n@c2@"
  ja: "@a@bトルネコ「う～～～む。　なんだか\n\tわかりませんが　これは店屋でも\n\t引き取ってくれないでしょう。\n@c2@"
"520":
  de: "@aTorneko@bEin schönes Beispiel feinster Handwerkskunst!\n@c2@"
  en: "@aTorneko@bWell! A quare example of craftsmanship at its very best!\n@c2@"
  es: "@aTorneko@b¡Bueno! ¡Un espliéndido ejiemplo de la miejor artesanía!\n@c2@"
  fr: "@aTorneko@bEh bienⓠ C'est un instrument de très belle factureⓠ\n@c2@"
  it: "@aBaldo@bMaremma musiha!\nHuesto strumento musihale l'è un favoloso pezzo d'artigianato!\n@c2@"
  ja: "@a@bトルネコ「ほほう……。\n\tこいつはまた　細工のすばらしい\n\t笛ですね。\n@c2@"
"521":
  de: "@aTorneko@bWenn man in dieses Horn bläst, kommt Mary Lou sofort mit dem Wagen an, egal, wo man gerade ist.\n@c2@"
  en: "@aTorneko@bWherever y'are, when Mary Lou hears this horn, she'll come runnin' to ye with the wagon.\n@c2@"
  es: "@aTorneko@bEstiés donde estiés, cuando Paca oiga este cuerno, viendrá galopando hacia ti con el carromato.\n@c2@"
  fr: "@aTorneko@bOù que vous soyez, Marylou accoura avec le chariot dès que vous soufflerez dans cette trompe.\n@c2@"
  it: "@aBaldo@bOvunque ti trovi, basta tu soni huesto strumento per fa' accorre' Marilù. E i'ccarro, naturalmente.\n@c2@"
  ja: "@a@bトルネコ「こいつの音色を聞けば\n\tわれらがパトリシアは　どこにでも\n\tかけつけてくるでしょうな。\n@c2@"
"522":
  de: "@aTorneko@bUnd sie ist nicht das einzige Pferd, das man damit rufen kann.\n@c2@"
  en: "@aTorneko@bAn' she's not the only horse ye can call with it.\n@c2@"
  es: "@aTorneko@bY no es el único cabiallo con el que esto funciona.\n@c2@"
  fr: "@aTorneko@bCe n'est d'ailleurs pas le seul cheval que vous pouvez appeler avec.\n@c2@"
  it: "@aBaldo@bE 'un penso che huest'oggetto possa esse' usato solo pe' chiama' Marilù, sai?\n@c2@"
  ja: "@a@bトルネコ「しかも……　なんと\n\tこいつの音色は　ほかの馬をも\n\t呼んでしまうチカラがありそうです。\n@c2@"
"523":
  de: "@aTorneko@bIch wette, du wärst ganz schön baff, wenn du das Horn im Kampf benutzen würdest.\n@c2@"
  en: "@aTorneko@bI'd be willin' to bet ye'll be gobsmacked if ye use the horn in battle.\n@c2@"
  es: "@aTorneko@bMi apostaría algo a que, si usas el cuerno en combate, ti sorprienderás.\n@c2@"
  fr: "@aTorneko@bJe suis prêt à parier que vous seriez surpris%A120%X%Z%B120%Xe%Z si vous utilisiez ce clairon au combat.\n@c2@"
  it: "@aBaldo@bCredo che resterai a bocc'aperta, se proverai a usarlo 'nbattaglia.\n@c2@"
  ja: "@a@bトルネコ「戦いのときに　こいつを\n\t使えば　おもしろいことが\n\t起こるかも　しれません。\n@c2@"
"524":
  de: "@aTorneko@bIch würd' es auf keinen Fall verkaufen. Man würd' sowieso nicht viel dafür bekommen.\n@c2@"
  en: "@aTorneko@bⓙTis not an item ye'll want to sell.\nAnd ye couldn't get a price fer it if ye did.\n@c2@"
  es: "@aTorneko@bNo es una buena idea que viendas este objeto.\nAdemás, no consieguirías que ti diesen un precio aunque lo intentases.\n@c2@"
  fr: "@aTorneko@bCe n'est pas un objet qu'il faut vendre.\nEn plus, aucun marchand ne pourrait vous en donner le prix.\n@c2@"
  it: "@aBaldo@bTi honsiglio di 'un vende' huesta meraviglia. Del resto, anche se te volessi farlo, 'un troveresti un solo hommerciante disposto a comprarla.\n@c2@"
  ja: "@a@bトルネコ「店屋では　こいつの\n\t価値は　わからんでしょうな。\n@c2@"
"525":
  de: "@aTorneko@bSchau sich das einer an?! Eine Blüte des legendären Yggdrasil-Baumes!\n@c2@"
  en: "@aTorneko@bWould ye look at that!? 'Tis only the flower o' the legendary Yggdrasil tree!\n@c2@"
  es: "@aTorneko@b¡Vaya, fíjate en eso! ¡Si es la flor del legiendario árbol Yggdrasil!\n@c2@"
  fr: "@aTorneko@bRegardez çaⓠⓑ C'est une fleur d'Yggdrasil, l'arbre légendaire.\n@c2@"
  it: "@aBaldo@bMaremma buholiha!\nL'è un fiore del leggendario albero Ygdrasil!\n@c2@"
  ja: "@a@bトルネコ「おおっ！\n\tこれが　ウワサに聞く\n\tせかいじゅの花ですな！\n@c2@"
"526":
  de: "@aTorneko@bMir wird schon ganz warm ums Herz, wenn ich sie nur in den Händen halte.\n@c2@"
  en: "@aTorneko@bJust havin' it in me hands like this gives me a nice, warm glow inside.\n@c2@"
  es: "@aTorneko@bCon solo sostienerla en las manos ya mi hace sentir como una calidez por dentro.\n@c2@"
  fr: "@aTorneko@bLe simple fait de la tenir, ça me fait tout chaud partout.\n@c2@"
  it: "@aBaldo@bSolo a tenerlo tra le mani mi fa senti' 'npace co' i'mmondo.\n@c2@"
  ja: "@a@bトルネコ「こうして持っているだけで\n\tなんとも幸せな　ほんわかした\n\t気分にさせてくれます。\n@c2@"
"527":
  de: "@aTorneko@bAh, das Buch hier ist sehr interessant.\n@c2@"
  en: "@aTorneko@bNow here's an interestin' book, aye.\n@c2@"
  es: "@aTorneko@bEste sí que es un libro intieresante.\n@c2@"
  fr: "@aTorneko@bEh bien, voilà un livre intéressant.\n@c2@"
  it: "@aBaldo@bUhm, huesto l'è un libro parecchio 'nteressante, ma parecchio tanto.\n@c2@"
  ja: "@a@bトルネコ「ほうほう。\n\tこいつは　おもしろい本ですね。\n@c2@"
"528":
  de: "@aTorneko@bHier kann man alles über die Monster nachlesen, gegen die man bisher gekämpft hat.\n@c2@"
  en: "@aTorneko@bYa can read all about the monsters ye've been fightin' up to now in these pages right here.\n@c2@"
  es: "@aTorneko@bEn estas páginas de aquí está toda la informiación sobre los monstruos con los que has combiatido hasta ahora.\n@c2@"
  fr: "@aTorneko@bVous pourrez y apprendre tout ce qu'il y a à savoir sur les monstres que vous avez combattus jusqu'à maintenant.\n@c2@"
  it: "@aBaldo@bHontiene indihazioni d'ogni genere sui mostri contro cui hai hombattuto finora.\n@c2@"
  ja: "@a@bトルネコ「これがあれば\n\tこれまでに戦った魔物の記録を\n\t後から　読むことができそうです。\n@c2@"
"529":
  de: "@aTorneko@bWenn das mein Buch wär, würd' ich nicht eher Ruhe geben, bis dass das ganze Ding voll wär.\n@c2@"
  en: "@aTorneko@bIf it was my book, I wouldn't be able to keep meself still until I'd filled the whole thing up.\n@c2@"
  es: "@aTorneko@bSi el libro fuese mío, no podría piarar hasta complietarlo del todo.\n@c2@"
  fr: "@aTorneko@bSi ce livre m'appartenait, je n'aurais qu'une hâteⓢ les combattre tous jusqu'à ce que le livre soit complet.\n@c2@"
  it: "@aBaldo@bSe il libro fosse mio, 'unn avrei pace fino a quando 'un l'avessi hompletato fino all'ultima pagina.\n@c2@"
  ja: "@a@bトルネコ「私　こういうのって\n\tすべて　集めないと\n\t気がすまない性分でして……。\n@c2@"
"530":
  de: "@aTorneko@bAnscheinend passiert nämlich etwas Großartiges, wenn man alle Monster besiegt hat...\n@c2@"
  en: "@aTorneko@bThere's bound to be sometin' grand that happens when ye've every monster in it, don't ye think?\n@c2@"
  es: "@aTorneko@bSieguro que, cuando tiengas en él todos los monstruos, pasa alguna cosa fantiástica, ¿no crees?\n@c2@"
  fr: "@aTorneko@bÇa doit être quelque chose de réussir à avoir tous les monstres dedans, vous ne croyez pasⓡ\n@c2@"
  it: "@aBaldo@bSo' honvinto che succederà hualcosa, huando l'avrai riempito con tutti i mostri esistenti. 'Un lo credi anche te?\n@c2@"
  ja: "@a@bトルネコ「すべての魔物が\n\tこの本に　のったら　そのときは\n\tなにか　起こるかもしれません。\n@c2@"
"531":
  de: "@aTorneko@bEin Stahlkasten! Es ist der Traum jedes fahrenden Händlers, solch einen zu besitzen.\n@c2@"
  en: "@aTorneko@bAh! A steel strongbox! 'Tis every travellin' salesman's dream to have his own one o' these.\n@c2@"
  es: "@aTorneko@b¡Ah! ¡Una caja fuerte! ¡El sueño de cualquier buhoniero!\n@c2@"
  fr: "@aTorneko@bAhⓠ Un coffre-fort de ferⓠ Tout marchand itinérant rêve d'en avoir un.\n@c2@"
  it: "@aBaldo@bOh, ma huesta è una cassetta Salvarisparmi! È il sogno di tutti i hommessi viaggiatori!\n@c2@"
  ja: "@a@bトルネコ「おおっ！\n\tこれは　旅の商人なら　だれもが\n\tあこがれるアイテムです！\n@c2@"
"532":
  de: "@aTorneko@bWenn man das Glück hat, so einen zu haben, wird man nie wieder Gold verlieren, selbst nicht bei einem Überfall.\n@c2@"
  en: "@aTorneko@bIf ye're lucky enough to have one, ye won't lose gold, even if ye're wiped out in battle.\n@c2@"
  es: "@aTorneko@bSi tienes la buena fortuna de tiener una de estas, no pierderás oro aunque ti eliminen en una batalla.\n@c2@"
  fr: "@aTorneko@bSi vous avez la chance d'en posséder un, vous ne perdrez pas d'or, même si on vous tue au combat.\n@c2@"
  it: "@aBaldo@bSe ne hai una, 'un perderai i tu' huattrini nello sciagurato haso tu ci lasci le penne 'nbattaglia.\n@c2@"
  ja: "@a@bトルネコ「これさえあれば\n\t魔物にやられても　お金が\n\t減らずに済みます！\n@c2@"
"533":
  de: "@aTorneko@bAber leider sieht der hier ziemlich demoliert aus.\n@c2@"
  en: "@aTorneko@bOnly...it seems to be banjaxed, so it does.\n@c2@"
  es: "@aTorneko@bAunque... Piarece que está estropiada, sí.\n@c2@"
  fr: "@aTorneko@bSeulement... il a l'air d'être fichu.\n@c2@"
  it: "@aBaldo@bPerò mi pare che sia rotta... Maremma spaccata, che peccato!\n@c2@"
  ja: "@a@bトルネコ「でも　今は　こわれてる\n\tみたいですね……。\n@c2@"
"534":
  de: "@aTorneko@b%0%a00220 %D220%Xkann%Ykönnen%Z damit ausgerüstet werden.\n@c2@"
  en: "@aTorneko@b%0%a00220 can be equipped with it.\n@c2@"
  es: "@aTorneko@bEsto puede ser equipado por %0%a00220.\n@c2@"
  fr: "@aTorneko@b%0%a00220 %D220%Xpeut%Ypeuvent%Z s'en équiper.\n@c2@"
  it: "@aBaldo@bHuest'oggetto pole esse' aggiunto all'equipaggiamento di %a00220.\n@c2@"
  ja: "@a@bトルネコ「これを装備できるのは\n\t%a00220。\n@c2@"
"535":
  de: "@aTorneko@bUnd anscheinend kann ich mich damit auch ausrüsten.\n@c2@"
  en: "@aTorneko@bAnd it looks like this is sometin' I can equip meself with, too.\n@c2@"
  es: "@aTorneko@bY es algo que yo mismo podría llievar equipiado.\n@c2@"
  fr: "@aTorneko@bEt il semblerait que je puisse m'en équiper aussi.\n@c2@"
  it: "@aBaldo@bE penso che anch'io potrei aggiunge' huest'affare al mi' equipaggiamento.\n@c2@"
  ja: "@a@bトルネコ「どうやら　私にも\n\t装備できるみたいです。\n@c2@"
