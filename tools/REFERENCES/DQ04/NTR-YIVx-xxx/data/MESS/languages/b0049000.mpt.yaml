"6":
  de: "@a@b*: Na so was! Wenn das nicht %O969%Xder Herr Oojam ist%YHerrn Mahabalas liebreizende %L000%XTöchter sind%YTochter ist%Z%Z, sieh mal einer an. Schon lange zurück? Daheim ist es halt doch am schönsten, was?\n@c2@"
  en: "@a@b*: Well I never! If it isn't %O969%XMr. Oojam!%YMr. Mahabala's lovely daughter%L000%Xs%Y%Z, look.%Z Back for long, are you, love%L000%Xs%Y%Z? No place like home, eh?\n@c2@"
  es: "@a@b*: %A120%X¡No me lo puedo creer!%Z%B120%X¡No me lo puedo creer! Que me aspen si no es la joven %O967%XMeena%YMaya%Z%Z%C120%X%Z ¡Cuánto tiempo sin verte%A120%X!%Z%B120%X, preciosa!%Z%C120%X%Z En ningún sitio como en casa, ¿verdad?\n@c2@"
  fr: "@a@b*ⓢ Eh bienⓠ Regardez qui voilà... %O969%XMonsieur Oojam%Y%L000%XLes charmantes filles%YLa charmante fille%Z de Monsieur Mahabala%Zⓠ\nVous êtes de retourⓡ\nC'est bon de revenir à la maison, heinⓡ\n@c2@"
  it: "@a@b*: %O969%XOh, bentornato, Oojam!%Y%L000%XOh, ma che bella sorpresa! Le figlie di Malaparata!%YOh, ma che bella sorpresa! La figlia di Malaparata!%Z%Z Come va? Fa sempre piacere tornare a casa, vero?\n@c2@"
