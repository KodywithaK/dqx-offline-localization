  en: "@a@b*: Oh, silly me. You're Mr. Mahabala's %L000%Xdaughters%Ydaughter%Z, aren't you? Welcome back, then.\n@c2@"
  es: "@a@b*: Qué tonto soy. Si %L000%Xsois las hijas%Yeres la hija%Z del Sr. Mahabala, ¿no es cierto? ¡%L000%XBienvenidas%YBienvenida de nuevo%Z!\n@c2@"
  fr: "@a@b*ⓢ Qu'est-ce que je suis bêteⓠ Vous êtes %L000%Xles filles%Yla fille%Z de Monsieur Mahabalaⓡ Content de vous revoir.\n@c2@"
  it: "@a@b*: Accidenti. %L000%XSiete le figlie%YSei la figlia%Z di Malaparata, vero? %L000%XBentornate%YBentornata%Z!\n@c2@"
  ja: "@a@b＊「おや　たしか　あんたは\n\tエドガンさんの娘さん！\n\tそうか　帰ってきただか！\n@c2@"
