"0":
  de: "@a@b*: Willkommen in... Boutdumonde! Ich weiß zwar nicht, was das heißt, aber ist es nicht ein großartiger Name?\n@c2@"
  en: "@a@b*: Welcome to...Aubout du Monde! I don't know what the name means, but doesn't it sound great!?\n@c2@"
  es: "@a@b*: %L000%XBienvenidas%YBienvenida%Z a... ¡Aubout du Monde! No sé qué significa el nombre, ¡pero suena realmente bien!\n@c2@"
  fr: "@a@b*ⓢ Bienvenue à... Deadendⓠ Je sais pas trop ce que ça veut dire, mais ça sonne bienⓠ\n@c2@"
  it: "@a@b*: %H860%X%A120%XBenvenuto%Z%B120%XBenvenuta%Z%Y%R000%XBenvenute%YBenvenuti%Z%Z a... Infond Almond! Ehm, non so cosa voglia dire di preciso, ma non è un nome bellissimo?!\n@c2@"
  ja: "@a@b＊「ここは　コーミズ村だよ。\n@c2@"
"1":
