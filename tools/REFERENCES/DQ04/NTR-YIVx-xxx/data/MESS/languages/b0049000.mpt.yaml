"23":
  de: "@a@b*: Oh, das muss ja schrecklich für %L000%Xeuch%Ydich%Z sein, nicht wahr? Wenn der Vater von seinem eigenen Schüler ermordet wurde!\n@c2@"
  en: "@a@b*: Oh, you've had a dreadful time of it, haven't you, %L000%Xdears%Ydear%Z? Your poor father, killed by his own student!\n@c2@"
  es: "@a@b*: ¡Oh!, %L000%Xhabéis%Yhas%Z pasado por un auténtico infierno, ¿verdad %L000%Xqueridas%Yquerida%Z? ¡%L000%XVuestro%Ytu%Z pobre padre, asesinado por su propio discípulo!\n@c2@"
  fr: "@a@b*ⓢ %L000%XMes pauvres%YMa pauvre%Z, vous en avez bavéⓠ Votre pauvre père... tué par l'un de ses élèvesⓠ\n@c2@"
  it: "@a@b*: Oh, che terribile momento dev'essere stato %L000%Xper voi, povere stelle%Yper te, povera stella%Z! %L000%XIl vostro%YIl tuo%Z amatissimo padre ucciso dal suo stesso discepolo!\n@c2@"
  ja: "@a@b＊「ほんとに　大変だったねえ。\n\tエドガンさんのような　いい人が\n\t弟子のひとりに　うらぎられるなんて。\n@c2@"
"24":
  de: "@a@b*: %L000%XIhr wisst%YDu weißt%Z wahrscheinlich, dass es noch einen anderen Schüler gab? Oojam hieß er oder so ähnlich.\n@c2@"
  en: "@a@b*: I suppose you know he had another student, do you? Yes, Oojam, or some other yummy name like that, it was.\n@c2@"
  es: "@a@b*: Imagino que %L000%Xsabéis%Ysabes%Z que tenía otro discípulo, ¿verdad? Eso es, un tal Oojam, o algo parecido.\n@c2@"
  fr: "@a@b*ⓢ Vous savez qu'il avait un autre élève, n'est-ce pasⓡ Si je me souviens bien, il s'appelle Oojam ou quelque chose comme ça.\n@c2@"
  it: "@a@b*: Immagino che %L000%Xsappiate%Ytu sappia%Z che insegnava anche a un altro studente, vero? Sì, si chiamava Oojam, o qualcosa del genere.\n@c2@"
  ja: "@a@b＊「そういえば　エドガンさんには\n\tもうひとり　弟子がいたわね。\n\tオーリンとか　いったっけ。\n@c2@"
"25":
  de: "@a@b*: Ich hab gehört, dass der arme Kerl auch fast gestorben wär. Wo er jetzt bloß ist?\n@c2@"
  en: "@a@b*: I heard the poor man almost lost his life, too. I wonder where he is now...\n@c2@"
  es: "@a@b*: Me han dicho que el pobre casi pierde la vida. Me pregunto dónde estará...\n@c2@"
  fr: "@a@b*ⓢ Il paraît que ce pauvre garçon a bien failli mourir, lui aussi.\nJe me demande où il est maintenant...\n@c2@"
  it: "@a@b*: Ho sentito che anche quel poverino stava per rimanerci. Chissà dove si trova ora...\n@c2@"
  ja: "@a@b＊「オーリンさんも　すごいケガを\n\tしてたのよ。\n\tどこで　どうしているやら……。\n@c2@"
"26":
  de: "@a@b*: Na, da sieh mal einer an! Das ist ja Oojam! Alles in Ordnung mit dir? Da bin ich aber froh.\n@c2@"
  en: "@a@b*: Oh, look who it is! Oojam, isn't it? So you're all right, then? What a blessed relief that is.\n@c2@"
  es: "@a@b*: ¡Pero mira quién está aquí! ¿Eres Oojam, verdad? ¡Así que estás bien! ¡Qué alivio!\n@c2@"
  fr: "@a@b*ⓢ Mais regardez qui voilàⓠ Oojamⓠ\nTout va bien, alorsⓡ\nSi vous saviez comme je suis soulagée...\n@c2@"
  it: "@a@b*: Oh, guarda chi c'è! Tu sei Oojam, giusto? Allora stai bene! Che sollievo vederti sano e salvo.\n@c2@"
  ja: "@a@b＊「おや　たしかオーリンさんだよね。\n\tあんた　生きてたんだ。\n\tよかったわねえ。\n@c2@"
"27":
  de: "@a@b*: Es ist einfach unverschämt, dass wir dem neuen Marquis so viele Steuern zahlen müssen. Darum muss ich auch so viel arbeiten.\n@c2@"
  en: "@a@b*: You wouldn't believe the taxes we have to pay now, under the new marquis regent. That's why I'm havin' to work so late.\n@c2@"
  es: "@a@b*: No %H860%Xte imaginas%Yos imagináis%Z la cantidad de impuestos que tenemos que pagar ahora, bajo el gobierno del Marqués. Por eso debo trabajar hasta tan tarde.\n@c2@"
  fr: "@a@b*ⓢ Vous imaginez même pas les impôts qu'on doit payer depuis que le nouveau Lord Regent a pris le pouvoir. C'est pour ça que je dois travailler si tard.\n@c2@"
  it: "@a@b*: Il nuovo Marchese Reggente ha aumentato tantissimo le tasse. Ecco perché mi tocca lavorare fino a tardi.\n@c2@"
  ja: "@a@b＊「キングレオの王さまが代わってから\n\t税金の取立てが　きびしくてのう。\n\tこんな夜ふけまで　働かねばならん。\n@c2@"
"28":
  de: "@a@b*: Der alte König war nicht mal halb so streng. Wo das noch hinführen soll...\n@c2@"
  en: "@a@b*: The old king wasn't half so strict. It's a right flamin' liberty, if you ask me.\n@c2@"
  es: "@a@b*: El viejo rey no era ni la mitad de estricto. No es una libertad muy permisiva, la verdad.\n@c2@"
  fr: "@a@b*ⓢ Le vieux roi était bien moins exigeant.\nC'est de l'abus de pouvoir, si vous voulez mon avisⓠ\n@c2@"
  it: "@a@b*: Il vecchio Re non era mica così severo. Questa è prepotenza bella e buona!\n@c2@"
  ja: "@a@b＊「死んでしまった　先代の王は\n\tこんなこと　させんかったのにのう。\n\tぶつぶつ……。\n@c2@"
"29":
  de: "@aLassi@b(Winsel, winsel)\n@c2@"
  en: "@aPuppadom@b(whine whine)\n@c2@"
  es: "@aPita@bAuuuu, auuuu.\n@c2@"
  fr: "@aTajwawal@b(couinements)\n@c2@"
  it: "@aCan Can@bCai! Cai!\n@c2@"
  ja: "@a@bペスタ「くーん　くーん。\n@c2@"
"30":
  de: "@a@b*: Ich hab ein paar schreckliche Geschichten gehört.\n@c3@"
  en: "@a@b*: I've heard some disturbing stories on my travels.\n@c3@"
  es: "@a@b*: En mis viajes he oído historias muy inquietantes.\n@c3@"
  fr: "@a@b*ⓢ J'ai entendu des histoires vraiment étranges pendant mes voyages.\n@c3@"
  it: "@a@b*: Ho sentito delle voci inquietanti durante i miei viaggi.\n@c3@"
  ja: "@a@b＊「旅の途中　不吉なうわさを聞いた。\n@c3@"
"31":
  de: "@a@b*: So soll der neue Marquis die Seelen seiner Leute an den Teufel verkaufen!\n@c3@"
  en: "@a@b*: Things like the new marquis regent is selling his people's souls to the devil!\n@c3@"
  es: "@a@b*: ¡Cosas como que el nuevo Marqués Regente vende las almas de sus súbditos al diablo!\n@c3@"
  fr: "@a@b*ⓢ Il paraîtrait que le nouveau Lord Regent vendrait les âmes de ses sujets au diableⓠ\n@c3@"
  it: "@a@b*: Tipo che il nuovo Marchese Reggente vende al diavolo le anime dei suoi sudditi!\n@c3@"
  ja: "@a@b＊「この村の　はるか北\n\tキングレオの新しい王さまは\n\t悪魔に　魂を売ったとか……。\n@c3@"
"32":
  de: "@a@b*: Wenn das wahr sein sollte, ist der ganze Kontinent verloren...\n@c3@"
  en: "@a@b*: If there's any truth in it, this whole continent is as good as done for...\n@c3@"
  es: "@a@b*: Si llegara a ser cierto, el continente entero habría firmado su sentencia...\n@c3@"
  fr: "@a@b*ⓢ Même si seulement un quart de ce qu'on dit est vrai, ce continent est perdu...\n@c3@"
  it: "@a@b*: Se ci fosse anche solo un briciolo di verità in questa storia, tutto il continente sarebbe condannato ad andare in malora...\n@c3@"
  ja: "@a@b＊「もし　それが本当なら\n\tやがて　この国は……。\n@c3@"
"33":
  de: "@a@b*: Ha-püh... Ha-püh...\n@c2@"
  en: "@a@b*: Ah-phew... Ah-phew...\n@c2@"
  es: "@a@b*: Ah-fiuuu... Ah-fiuuu...\n@c2@"
  fr: "@a@b*ⓢ Ron-pfff... Ron-pfff...\n@c2@"
  it: "@a@b*: Ronf... Ronf...\n@c2@"
  ja: "@a@b＊「ぐうぐう……。\n@c2@"
"34":
  de: "@a@b*: Natürlich ist das nur ein Gerücht, aber angeblich hat es Mahabala nie geschafft, Eisen in Gold zu verwandeln.\n@c2@"
  en: "@a@b*: It's just a rumour of course, but I heard Mister Mahabala never did manage to transform anythin' into gold.\n@c2@"
  es: "@a@b*: Es solo un rumor, pero he oído que el Sr. Mahabala nunca consiguió transformar nada en oro.\n@c2@"
  fr: "@a@b*ⓢ Ce n'est qu'une rumeur, bien sûr, mais il paraît que Monsieur Mahabala n'a jamais réussi à transformer quoi que ce soit en or.\n@c2@"
  it: "@a@b*: Certo, sono solo voci, però in giro si dice che Malaparata non sia mai riuscito a trasformare nulla in oro.\n@c2@"
  ja: "@a@b＊「これは　うわさじゃが\n\tエドガンは　結局\n\t金を　作れなかったらしい。\n@c2@"
"35":
  de: "@a@b*: Aber dafür soll er was anderes entdeckt haben. Das Geheimnis der Evolution oder so was.\n@c2@"
  en: "@a@b*: They say he made another amazin' discovery instead. The secret of evolution or some such nonsense.\n@c2@"
  es: "@a@b*: Por el contrario, se dice que realizó otro sorprendente descubrimiento. El secreto de la evolución o algo parecido.\n@c2@"
  fr: "@a@b*ⓢ En revanche, il aurait fait une découverte encore plus incroyable. Le secret de l'évolution ou une bêtise dans ce genre...\n@c2@"
  it: "@a@b*: Pare, tuttavia, che avesse fatto un'altra scoperta eccezionale. Un segreto relativo all'evoluzione, o roba del genere... \n@c2@"
  ja: "@a@b＊「しかし　そのかわり\n\tどえらい発見を　したそうじゃ。\n\t進化の秘法とか　言うとったのう。\n@c2@"
"36":
  de: "@a@b*: %L000%XTut%YTu%Z mir nichts, bitte. Ich bin kein böser Schleim, ganz ehrlich! (Schlürf)\n@c1@"
  en: "@a@b*: Don't be mean to me. I'm not a bad slime, you know. I promise! (slurp)\n@c1@"
  es: "@a@b*: No me %L000%Xmaltratéis%Ymaltrates%Z. Soy un limo bueno, en serio. ¡Lo juro! (Slurp)\n@c1@"
  fr: "@a@b*ⓢ Ne me frappez pas. Je ne suis pas un mauvais gluant. Je vous le prometsⓠ (Slurp)\n@c1@"
  it: "@a@b*: Non %L000%Xfatemi%Yfarmi%Z del male. Non sono uno Slime cattivo, lo giuro! Slurp!\n@c1@"
  ja: "@a@b＊「いじめないでくれよー。\n\tボクは　悪いスライムじゃないよ。\n@c1@"
"37":
  de: "@a@b*: Ich weiß sogar was! Oojam kann Türen öffnen, selbst wenn sie verschlossen sind!\n@c1@"
  en: "@a@b*: See, I'll even tell you something. Oojam can open doors even if they're locked!\n@c1@"
  es: "@a@b*: Incluso %L000%Xos%Yte%Z puedo contar una cosa. ¡Oojam es capaz de abrir puertas aunque estén cerradas!\n@c1@"
  fr: "@a@b*ⓢ La preuve, je vais même vous révéler quelque choseⓢ Oojam arrive à ouvrir les portes fermées.\n@c1@"
  it: "@a@b*: Anzi, voglio %L000%Xrivelarvi%Yrivelarti%Z uno slimegreto. Oojam può aprire anche le porte chiuse a chiave!\n@c1@"
  ja: "@a@b＊「あ　そうだ！　オーリンって男は\n\tカギのかかった　とびらでも\n\tこじあけることが　できたよ！\n@c1@"
"38":
  de: "@a@b*: Das ist der beau Palais de Léon!\n@c2@"
  en: "@a@b*: Zis is ze great Palais de Léon!\n@c2@"
  es: "@a@b*: ¡Este es le grand Palais de Léon!\n@c2@"
  fr: "@a@b*ⓢ C'est le magnificent palace de Lord Lionelⓠ\n@c2@"
  it: "@a@b*: Voilà, il grande Palazzo de Léon!\n@c2@"
  ja: "@a@b＊「ここは　偉大なるお城\n\tキングレオだ！\n@c2@"
"39":
  de: "@a@b*: Mon Dieu, wie kann der Kanzler sisch so sehr lieben, wenn er solsch ein Nischtsnutz ist? Er ist voller amour propre.\n@c2@"
  en: "@a@b*: Mon Dieu, 'ow can ze Chancellor love 'imself so much when 'e is such a useless coward? 'E is full of ze amour propre.\n@c2@"
  es: "@a@b*: Mon Dieu, ¿cómo puede el Cancillegr quegregrse tanto si es un cobagrde inútil? Es un auténtico pgresumido.\n@c2@"
  fr: "@a@b*ⓢ Par Jove, comment le chancelier peut-il s'aimer à ce point en étant aussi couardⓡ Il s'aime too much. \n@c2@"
  it: "@a@b*: Mon Dieu, come fa il Cancelliere ad avere tanta stima di sé quando en réalité è solo un povero codardo?\n@c2@"
  ja: "@a@b＊「この城の大臣は　おくびょうなくせに\n\tいつも　いばってるんだよ。\n@c2@"
"40":
  de: "@a@b*: Er mag es gar nischt, wenn man vor seinem Zimmer Krasch mascht.\n@c2@"
  en: "@a@b*: Just make ze loud noise outside of 'is chamber and see 'ow 'e reacts.\n@c2@"
  es: "@a@b*: %H860%XHaz%YHaced%Z mucho gruido junto a su habitación y %H860%Xvegrás%Yvegréis%Z cómo greacciona.\n@c2@"
  fr: "@a@b*ⓢ Faites juste du fort bruit devant ses appartements et vous allez voir comment il réagit.\n@c2@"
  it: "@a@b*: %H860%XFai%YFate%Z rumore fuori dalla sua chambre, e %H860%Xvedrai%Yvedrete%Z cosa succede.\n@c2@"
  ja: "@a@b＊「あいつの部屋の前で\n\t大きな音を　たててごらん。\n@c2@"
"41":
  de: "@a@b*: Er ist dann so faché, dass er direkt zum Marquis Régent rennt.\n@c2@"
  en: "@a@b*: 'E'll be so startled, 'e'll go running to ze Marquis Régent. You'll see.\n@c2@"
  es: "@a@b*: Se asustagrá tanto que saldgrá cogrriendo a las faldas del Marqués Regent. Ya lo vegrás.\n@c2@"
  fr: "@a@b*ⓢ Il aura si peur qu'il courra droit chez le Lord Regent. Vous allez voir.\n@c2@"
  it: "@a@b*: Sarà così surpris, che correrà a gambe levate dal Marchese Reggente. %H860%XVedrai%YVedrete%Z.\n@c2@"
  ja: "@a@b＊「きっとビックリして　王さまに\n\t知らせにいくだろうさ。　きゃはは！\n@c2@"
"42":
  de: "@a@b*: Nur eine Person weiß, wo sich das Zimmer des neuen Marquis Régent befindet, und das ist der Kanzler.\n@c2@"
  en: "@a@b*: There's only one man who knows the whereabouts of the new marquis regent's chamber, and that's the Chancellor.\n@c2@"
  es: "@a@b*: Solo hay una persona que conoce el paradero de la nueva cámara del marqués: el Canciller.\n@c2@"
  fr: "@a@b*ⓢ S'il y a bien un seul homme qui sait ce qui se passe dans les appartements du nouveau Lord Regent, c'est le chancelier.\n@c2@"
  it: "@a@b*: C'è una sola persona che sa come arrivare alla stanza del Marchese Reggente, ed è il Cancelliere.\n@c2@"
  ja: "@a@b＊「王さまの部屋がどこかは\n\t大臣しか　知らないと思うよ。\n@c2@"
"43":
  de: "@a@b*: Wenn man ihm folgen würde, könnte man es wohl herausfinden. Aber mir wäre das zu gefährlich.\n@c2@"
  en: "@a@b*: You could probably find out where it was if you followed him. I wouldn't like to be the one to do it, mind you.\n@c2@"
  es: "@a@b*: Seguramente, %H860%Xpodrías%Ypodríais%Z descubrirlo si lo %H860%Xsiguieras%Ysiguierais%Z. No obstante, no querría ser yo quien lo hiciera.\n@c2@"
  fr: "@a@b*ⓢ En suivant le chancelier, vous arriverez sûrement jusqu'au Lord Regent.\nJe ne m'y risquerais pas, à votre place.\n@c2@"
  it: "@a@b*: Seguendolo %H860%Xpotresti%Ypotreste%Z scoprire dove si trova la stanza del Marchese. Ma io non lo farei mai!\n@c2@"
  ja: "@a@b＊「大臣のあとをつければ\n\tわかるだろうけど　後がこわいしね。\n@c2@"
"44":
  de: "@a@b*: Das ist très curieux... Manschmal ist mir, als 'örte isch Stimmen von unten.\n@c3@"
  en: "@a@b*: Zis is a matter most strange...\nI feel like I can 'ear voices coming from under my feet.\n@c3@"
  es: "@a@b*: Este asunto es grealmente extgraño...\nPagrece como si escuchagra voces que pgrovienen de debajo de mis pies.\n@c3@"
  fr: "@a@b*ⓢ C'est vraiment bizarre... \nC'est comme si j'entendais des voix qui viendraient de sous mes pieds.\n@c3@"
  it: "@a@b*: C'est bizzarre...\nMi pare quasi di sentire delle voci sotto i miei piedi.\n@c3@"
  ja: "@a@b＊「う～む　不思議だ……。\n\tどうも　足もとから　人の声が\n\t聞こえてくる気がするのだ。\n@c3@"
"45":
  de: "@a@b*: Der Kanzler des Marquis Régent ist ein sehr nervöser Mann, très nerveux, oui.\n@c2@"
  en: "@a@b*: Ze Chancellor of ze Marquis Régent is a most nervous man.\n@c2@"
  es: "@a@b*: El Cancillegr del Magrqués Régent es un hombgre demasiado negrvioso.\n@c2@"
  fr: "@a@b*ⓢ Le chancelier du Lord Regent est un homme très nervous.\n@c2@"
  it: "@a@b*: Il Cancelliere del Marchese Reggente è una persona très nerveux.\n@c2@"
  ja: "@a@b＊「この城の大臣は\n\tとても　神経質なお方だ。\n@c2@"
"46":
  de: "@a@b*: 'ier war mal ein Mann, der 'at ihm solsche Angst gemacht mit eine laute Knall, dass er ihn ins Gefängnis am Hafen bringen ließ.\n@c2@"
  en: "@a@b*: Zere was a man 'ere before who gave 'im a fright wiz a loud bang, and 'e was thrown into jail at ze port.\n@c2@"
  es: "@a@b*: Hubo una vez un hombgre que le asustó con un gruido muy fuegrte y lo encagrcelagron en el puegrto.\n@c2@"
  fr: "@a@b*ⓢ Une fois, quelqu'un lui a fait peur en faisant un very fort bruit. Le pauvre type est à la prison au port, maintenant.\n@c2@"
  it: "@a@b*: Prima ha sbattuto en prison al porto un uomo che lo aveva spaventato facendo rumore.\n@c2@"
  ja: "@a@b＊「この前も　大きな音をさせて\n\t大臣を　ビックリさせた男が\n\t港町の牢屋に　入れられてな。\n@c2@"
"47":
  de: "@a@b*: Der Hafen? Dort war isch nie, aber isch glaube, dass er nördlisch der Burg liegt.\n@c2@"
  en: "@a@b*: Ze port? I 'ave never been, but I think it is to ze north of ze castle.\n@c2@"
  es: "@a@b*: ¿El puegrto? Moi nunca he estado allí pegro cgreo que se encuentgra al nogrte del castillo.\n@c2@"
  fr: "@a@b*ⓢ Le portⓡ Je ne suis jamais allé là-bas, mais je crois qu'il est au nord du castel.\n@c2@"
  it: "@a@b*: Il porto? Non ci sono mai stato, ma je pense che sia a nord del castello.\n@c2@"
  ja: "@a@b＊「港町か？\n\tこの城から　すこし北に行った\n\t海辺に　あるはずだぞ。\n@c2@"
"48":
  de: "@a@b*: Moi? Isch bin der Kanzler dieser Burg.\n@c2@"
  en: "@a@b*: Moi? I am ze chancellor of zis castle.\n@c2@"
  es: "@a@b*: ¿Moi? Soy el cancillegr de este castillo.\n@c2@"
  fr: "@a@b*ⓢ Moiⓡ Je suis le chancelier de ce castel.\n@c2@"
  it: "@a@b*: Moi? Io sono il Cancelliere del castello.\n@c2@"
  ja: "@a@b＊「わしは　このお城の大臣である。\n@c2@"
"49":
  de: "@a@b*: Ihr seid in meiner chambre privé. Wenn Ihr nischt auf der Stelle geht, sperre isch Eusch ins Gefängnis!\n@c2@"
  en: "@a@b*: You are in my personal chamber. If you do not leave tout de suite, I will 'ave you locked up in jail!\n@c2@"
  es: "@a@b*: %H860%XHas%YHabéis%Z entgrado en mis dependencias pgrivadas. ¡Si no %H860%Xsales%Ysalís%Z tout de suite, hagré que %H860%Xte%Yos%Z encagrcelen!\n@c2@"
  fr: "@a@b*ⓢ Vous êtes dans ma chambre personnelle.\nSi vous ne partez pas sur-le-champ, je vous ferai verrouiller en prisonⓠ\n@c2@"
  it: "@a@b*: %H860%XTi trovi%YVi trovate%Z nella mia chambre personale. Se non %H860%Xesci%Yuscite%Z immediatamente, %H860%Xti%Yvi%Z farò sbattere en prison!\n@c2@"
  ja: "@a@b＊「そしてここは　わしの部屋。\n\t早く　立ち去らねば\n\t牢屋に入れてしまうぞ！\n@c2@"
"50":
  de: "@a@b*: He he he! Komm zurück, ma petite coquette! Isch tu dir schon nischts!\n@c3@"
  en: "@a@b*: Heh heh heh! Come back, ma petite coquette! Let me get my 'ands on you!\n@c3@"
  es: "@a@b*: ¡Je, je, je! ¡Gregresa, ma petite coquette! ¡Deja que te pongá las manós encima!\n@c3@"
  fr: "@a@b*ⓢ Hé hé héⓠ Reviens ma baby dollⓠ\nAttention, je vais t'attraperⓠ\n@c3@"
  it: "@a@b*: Eh! Eh! Eh! Torna indietro, ma petite coquette! Fatti acchiappare!\n@c3@"
  ja: "@a@b＊「でへへー　まてまてまて！\n\tつかまえちゃうぞー。\n@c3@"
"51":
  de: "@a@b*: Non! Weg da! Er erwischt misch noch!\n@c1@"
  en: "@a@b*: Non! Move! 'E'll catch me!\n@c1@"
  es: "@a@b*: ¡Non! ¡Grápido! ¡Me va a captugragr!\n@c1@"
  fr: "@a@b*ⓢ Noⓠ Ne restez pas làⓠ Il va attraper moiⓠ\n@c1@"
  it: "@a@b*: Non! Presto, o mi prenderà!\n@c1@"
  ja: "@a@b＊「やーんっ　どいて　どいて！\n\t追いつかれちゃう。　きゃっきゃっ！\n@c1@"
"52":
  de: "@a@b*: He he he... Isch bin der Magieforscher dieser Burg.\n@c2@"
  en: "@a@b*: He he he... I am ze researcher of magic for ze castle.\n@c2@"
  es: "@a@b*: Je, je, je... Je suis el maestgro de la magia en el castillo.\n@c2@"
  fr: "@a@b*ⓢ Hé hé hé... Je suis le rechercheur des sciences magiques au castel.\n@c2@"
  it: "@a@b*: Eh! Eh! Eh! Sono lo studioso di magia du château.\n@c2@"
  ja: "@a@b＊「ひっひっひっ……。\n\tわしは　この城につかえる\n\t魔法の研究家じゃよ。\n@c2@"
"53":
  de: "@a@b*: Pardon? Was für Magie? He he he... Das werde isch Eusch nischt verraten. Niemals!\n@c2@"
  en: "@a@b*: Pardon? What kind of magic?\nHe he he... Zat is something I cannot reveal to you, my friend. Not ever!\n@c2@"
  es: "@a@b*: ¿Pardon? ¿Qué tipo de magia?\nJe, je, je... Eso es algo que no puedo grevelagr, %H860%X%A120%Xmon ami%Z%B120%Xma amie%Z%Y%R000%Xmes amies%Ymes amis%Z%Z. ¡Ni lo %H860%Xsueñes%Ysoñéis%Z!\n@c2@"
  fr: "@a@b*ⓢ Je demande votre pardonⓡ Quel type de magieⓡ Hé hé hé... C'est quelque chose que je ne peux pas vous révéler. Jamais de la vieⓠ\n@c2@"
  it: "@a@b*: Pardon? Che tipo di magia?\nEh! Eh! Eh! Désolé, non posso rivelartelo, %A090%Xamico mio%Z%B090%Xamica mia%Z. Jamais!\n@c2@"
  ja: "@a@b＊「なに？　なんの魔法かじゃと？\n\tそれは　教えるわけにはいかんな。\n\tひっひっひっ……。\n@c2@"
"54":
  de: "@a@b*: Haute cuisine und gute Weine... Ah, la joie de vivre. 'ier ist das Paradis auf Erden!\n@c1@"
  en: "@a@b*: Haute cuisine and fine wine... Ah, ze joie de vivre. It is paradise on earth 'ere!\n@c1@"
  es: "@a@b*: Haute cuisine y buen vino... ¡Ah!, la alegría de vivigr. ¡El pagraíso en la tiegrra!\n@c1@"
  fr: "@a@b*ⓢ Cheddar, bacon et bière... que demander de plusⓡ C'est le paradis sur terre, ce paysⓠ\n@c1@"
  it: "@a@b*: Haute cuisine e vino pregiato... Ah, la joie de vivre, oui. Questo è il paradiso in Terra!\n@c1@"
  ja: "@a@b＊「おいしい　ごちそうにお酒。\n\t飲んで歌って遊んで……。\n\tここは　天国のようなところね。\n@c1@"
"55":
  de: "@a@b*: Wo der Thronsaal des Marquis Régent ist? Das weiß isch nischt mal selbst, %A120%XMonsieur%Z%B120%XMademoiselle%Z.\n@c2@"
  en: "@a@b*: Where is ze throne room of ze Marquis Régent?\nI do not even know myself, %A120%Xmonsieur%Z%B120%Xmademoiselle%Z.\n@c2@"
  es: "@a@b*: ¿Que dónde se encuentgra el salón del tgrono del Magrqués Régent?\nNo lo sé ni yo, %H860%X%A120%Xmonsieur%Z%B120%Xmademoiselle%Z%Y%R000%Xmademoiselles%Ymonsieurs%Z%Z.\n@c2@"
  fr: "@a@b*ⓢ La salle du trône du Lord Regentⓡ\nJe ne le sais pas moi-même, %A120%XMonsieur%Z%B120%XMademoiselle%Z.\n@c2@"
  it: "@a@b*: Dov'è la stanza del trono del Marchese Reggente?\nNon lo so neanch'io, %A120%Xmonsieur%Z%B120%Xmademoiselle%Z.\n@c2@"
  ja: "@a@b＊「王さまの部屋は　どこかって？\n\tさあ　知らないね。\n@c2@"
"56":
  de: "@a@b*: Unser neues Oberhaupt, der Marquis Régent, ist ein sehr vorsischtiger Mann. Isch 'örte, dass er sogar ein geheimes Zimmer 'at.\n@c2@"
  en: "@a@b*: Our new leader, ze Marquis Régent, is a most careful man. I 'eard zat 'e even 'as a secret chamber.\n@c2@"
  es: "@a@b*: Nuestgro nuevo lídegr, el Magrqués Régent, es un hombgre muy pgrecavido. He escuchado grumogres de que incluso tiene una cámagra secgreta.\n@c2@"
  fr: "@a@b*ⓢ Notre nouveau souverain, le Lord Regent, est un homme prudent. Il paraît même qu'il a une chambre secrète.\n@c2@"
  it: "@a@b*: Il nostro nuovo governatore, il Marchese Reggente, è un uomo molto previdente. Ho saputo che ha persino una chambre secrète.\n@c2@"
  ja: "@a@b＊「新しい王さまは用心深く　いつも\n\t秘密の王室にいるという話なら\n\t聞いたことが　あるのだがな。\n@c2@"
"57":
  de: "@a@b*: Zzz... Hm? Zzz...\n@c2@"
  en: "@a@b*: Zzz... Hm? Zzz...\n@c2@"
  es: "@a@b*: Zzz... ¿Mmm? Zzz...\n@c2@"
  fr: "@a@b*ⓢ Zzz... Mmmⓡ Zzz...\n@c2@"
  it: "@a@b*: Ronf... Ehm? Ronf...\n@c2@"
  ja: "@a@b＊「うつら……　うつら……。\n@c2@"
"58":
  de: "@a@b*: He he he! Isch krieg disch noch! He he he!\n@c3@"
  en: "@a@b*: Heh heh! Zere is no escape! Heh heh heh!\n@c3@"
  es: "@a@b*: ¡Je, je! ¡No podgrás escapagr! ¡Je, je, je!\n@c3@"
