"0":
  de: "@a@b*: Oh, hallo! Ihr kommt gerade richtig, ich habe nämlich meine Flugmaschine fertig. Ist das nich' toll?\n@c2@"
  en: "@a@b*: G'day! You came at a good time, 'cos I've finally finished me flyin' machine. Yep, deadset!\n@c2@"
  es: "@a@b*: ¡Buen día %H860%Xa vos%Ya ustedes%Z! %H860%XLlegaste%YLlegaron%Z en el momento preciso, recién terminé mi máquina voladora. ¡Che, ya está lista!\n@c2@"
  fr: "@a@b*ⓢ Bonjourⓠ Vous arrivez au bon moment parce que je viens de terminer ma machine volante. Pile poilⓠ\n@c2@"
  it: "@a@b*: Mizzica, ca tempismu peffetto! 'A machina volanti finita iè!\n@c2@"
  ja: "@a@b＊「やあ　来てくれましたね！\n\tついに　空飛ぶ気球が\n\t完成しましたよ！\n@c2@"
"1":
  de: "@a@b*: Der erste Flug steht natürlich Euch zu. Wollt Ihr nich' mal rausgehen und sie ausprobieren?\n@c2@"
  en: "@a@b*: This first one's yours.\nWhy don't ya go outside an' give it a burl?\n@c2@"
  es: "@a@b*: Este... esta es %H860%Xtu%Ysu%Z primera vez.\n¿Por qué no %H860%Xsalís y la probás%Ysalen y la prueban%Z?\n@c2@"
  fr: "@a@b*ⓢ La première vous revient.\nEt si vous alliez dehors pour l'essayerⓡ\n@c2@"
  it: "@a@b*: La primma %H860%Xtua%Yvostra%Z iè.\nPicché non %H860%Xnesci%Yniscite%Z fora a provarla?\n@c2@"
  ja: "@a@b＊「第一号は　あなたがたに\n\t進呈します。\n\t外に　出てみてください！\n@c2@"
"2":
  de: "@a@b*: Miau?\n@c1@"
  en: "@a@b*: Meow?\n@c1@"
  es: "@a@b*: Este... miau.\n@c1@"
  fr: "@a@b*ⓢ Miaouⓡ\n@c1@"
  it: "@a@b*: Miiiii-ao.\n@c1@"
  ja: "@a@b＊「にゃ～ん。\n@c1@"
"3":
  de: "@a@b*: Heiliger Bimbam!\nIch hab kaum meinen Augen getraut, wisst Ihr!\n@c2@"
  en: "@a@b*: Hooly dooly!\nI could hardly believe me eyes, y'know.\n@c2@"
  es: "@a@b*: ¡Che!\nNo podía creer lo que veía, viste.\n@c2@"
  fr: "@a@b*ⓢ Par tous les saintsⓠ\nJ'en croyais pas mes yeux, vous savez.\n@c2@"
  it: "@a@b*: Mizzica!\nMi spaventai!\n@c2@"
  ja: "@a@b＊「あ　あたしゃ\n\t見てしまったんだよ！\n@c2@"
"4":
  de: "@a@b*: Südlich des Flusses gibt es eine riesige Statue, und so wahr ich hier stehe, sie hat sich bewegt! Sie ist rumgelaufen! Echt wahr!\n@c2@"
  en: "@a@b*: There's a humungo statue to the south of this river, and strewth, I swear I saw it go walkabout! Fair dink! \n@c2@"
  es: "@a@b*: ¡Hay una inmensa estatua al sur de este río, y %H860%Xte%Yles%Z digo que juraría que la vi dándose un paseo! ¡Este... lo puedo jurar! \n@c2@"
  fr: "@a@b*ⓢ Il y a une immense statue au sud de cette rivière et je vous jure que je l'ai vue marcherⓠ\nJe vous prometsⓠ\n@c2@"
  it: "@a@b*: C'è 'na statua gigante a sud 'i chistu fiumi... A vitti ca camminava, veru iè!\n@c2@"
  ja: "@a@b＊「この川を　南に向かったところに\n\t大きな像が　立ってるんだけど\n\tその像が　歩くところを！\n@c2@"
"5":
  de: "@a@b*: Früher haben die Menschen eigentümliche Apparate gebaut und sind damit geflogen.\n@c2@"
  en: "@a@b*: Back in the old days, people used to fly about in the sky in funny contraptions they built.\n@c2@"
  es: "@a@b*: En los viejos días, la gente solía volar por los cielos en máquinas extrañas que construían.\n@c2@"
  fr: "@a@b*ⓢ Dans le temps, les gens volaient dans le ciel grâce à de drôles d'engins qu'ils construisaient eux-mêmes.\n@c2@"
  it: "@a@b*: Anni addietro, la gente volava nel cielo e strani aggeggi usava.\n@c2@"
  ja: "@a@b＊「その昔　人も乗り物を使い\n\t空を　飛んでいました。\n@c2@"
"6":
  de: "@a@b*: Doch das alles hatte ein Ende, als der Herr der Unterwelt kam und uns die ⓞGrundzutatⓟ nahm.\n@c2@"
  en: "@a@b*: But that all ended when the Lord o' the Underworld went an' made off with the basic ⓗingredientⓘ, if ya like.\n@c2@"
  es: "@a@b*: Pero eso terminó cuando el Señor del Inframundo terminó con el ''ingrediente'' básico, viste.\n@c2@"
  fr: "@a@b*ⓢ Mais tout a pris fin lorsque le Seigneur des Enfers est parti avec ⓥl'élémentⓦ principal.\n@c2@"
  it: "@a@b*: Ma quanno il Signore degli Inferi fece sparire ⓕl'ingredienteⓖ fondamentale, tutto finì.\n@c2@"
  ja: "@a@b＊「しかし　地獄の帝王が\n\tその乗り物の　みなもとを\n\tうばっていったと伝えられています。\n@c2@"
"7":
  de: "@a@b*: Ich vermute, dass sie damals mit ihm verschwunden ist, als er weggesperrt wurde.\n@c2@"
  en: "@a@b*: I reckon it probably ended up bein' sealed away with him, y'know.\n@c2@"
  es: "@a@b*: Este... supongo que terminó oculto y sellado como él.\n@c2@"
  fr: "@a@b*ⓢ Je suppose qu'il a été enfermé avec lui.\n@c2@"
  it: "@a@b*: Secondo me, messo al sicuro da qualche parte l'hanno, insieme a quell'essere fetuso!\n@c2@"
  ja: "@a@b＊「たぶん　それは\n\t地獄の帝王とともに\n\t地の底に　封じこまれたのでしょう。\n@c2@"
"8":
  de: "@a@b*: Willkommen in Oldenförde am Flussufer! Ist doch recht nett hier, nich'?\n@c2@"
  en: "@a@b*: Welcome to the riverside town of Riverton! Pretty good name for the place, eh?\n@c2@"
  es: "@a@b*: ¡%H860%X%A120%XBienvenido%Z%B120%XBienvenida%Z%Y%R000%XBienvenidas%YBienvenidos%Z%Z a la ciudad ribereña de Riverton! Es un lindo nombre para una ciudad, ¿eh?\n@c2@"
  fr: "@a@b*ⓢ Bienvenue dans la ville côtière d'Estuariaⓠ\nC'est un joli nom, heinⓡ\n@c2@"
  it: "@a@b*: %H860%X%A120%XBenvenuto%Z%B120%XBenvenuta%Z%Y%R000%XBenvenute%YBenvenuti%Z%Z a Fiumazza! Iè bello come nome pi' 'nu paesino, veru iè?\n@c2@"
  ja: "@a@b＊「ようこそ\n\t川の村　リバーサイドへ！\n@c2@"
"9":
  de: "@a@b*: Na, Euer Boot ist aber eine wahre Schönheit. Da habt Ihr Glück gehabt!\n@c2@"
  en: "@a@b*: Hey, that boat you've got is a real beaut. Good on ya!\n@c2@"
  es: "@a@b*: Este, ese barco %H860%Xtuyo%Yvuestro%Z es una belleza. ¡Felicitaciones!\n@c2@"
  fr: "@a@b*ⓢ Eh bien, on peut dire que vous avez un bien beau bateau. Vous avez de la chanceⓠ\n@c2@"
  it: "@a@b*: Miiiii, iè proprio bedda la %H860%Xtua%Yvostra%Z nave!\n@c2@"
  ja: "@a@b＊「それにしても　あんたたちの船\n\tりっぱなモンだねえ。\n@c2@"
"10":
  de: "@a@b*: Trotzdem braucht Ihr 'nen etwas größeren Kahn, wenn Ihr vorhabt, aufs offene Meer hinauszufahren.\n@c2@"
  en: "@a@b*: Still, I s'pose you need a decent-sized thing if you're sailin' out on the open ocean.\n@c2@"
  es: "@a@b*: Claro que, para navegar por el océano se necesita algo de un tamaño decente, viste.\n@c2@"
  fr: "@a@b*ⓢ Remarquez, pour naviguer sur l'océan, j'imagine qu'il faut un bateau digne de ce nom.\n@c2@"
  it: "@a@b*: Di sicuro, c'è bisogno di una nave molto grande pe' viaggiari su e giù pi 'u mari!\n@c2@"
  ja: "@a@b＊「やっぱり　外の海を旅する船は\n\tちがうなあ……。\n@c2@"
"11":
  de: "@a@b*: Es heißt, dass es dort drüben im Niemandsland eine Monsterburg gibt.\n@c1@"
  en: "@a@b*: People reckon there's a monster castle somewhere in the Ostro outback.\n@c1@"
  es: "@a@b*: Este... se cuenta que hay un castillo de monstruos en algún lugar de la pampa de Ostro.\n@c1@"
  fr: "@a@b*ⓢ J'entends souvent dire qu'il y a un château rempli de monstres à l'intérieur des terres d'Ostro.\n@c1@"
  it: "@a@b*: La gente dice che, da qualche parte nel territorio di Ostryo, un castello infestato da mostri c'è.\n@c1@"
  ja: "@a@b＊「この島の奥地には\n\t魔物たちの城が　あるそうです。\n@c1@"
"12":
  de: "@a@b*: Natürlich war keiner so meschugge und ist hingegangen, um rauszufinden, ob da was Wahres dran ist.\n@c1@"
  en: "@a@b*: No one's been enough of a galah to go an' find out if that's true or not, though. Ha ha!\n@c1@"
  es: "@a@b*: Pero nadie tuvo los arrestos de ir a ver si es cierto o no. ¡Ja, ja!\n@c1@"
  fr: "@a@b*ⓢ Ceci dit, personne n'a été suffisamment fou pour voir si c'était vrai ou faux. Ha ha haⓠ\n@c1@"
  it: "@a@b*: Però nessuno ebbe il fegato di andare a vedere se vero iè. Ah! Ah! Ah!\n@c1@"
  ja: "@a@b＊「しかし　それを確かめに行った人は\n\t誰ひとり　帰ってはきません……。\n@c1@"
"13":
  de: "@a@b*: Na so was! Ich hätt nicht gedacht, dass mich jemand hier findet.\n@c2@"
  en: "@a@b*: I'll be stuffed!\nI didn't think anyone'd find me here.\n@c2@"
  es: "@a@b*: ¡La pucha!\nJamás pensé que nadie fuese a encontrarme aquí.\n@c2@"
  fr: "@a@b*ⓢ Bon sang d'boisⓠ\nJe pensais pas qu'on me trouverait ici.\n@c2@"
  it: "@a@b*: Mizzica!\nE chi si penzava ca quarchidunu potia trovarmi cà.\n@c2@"
  ja: "@a@b＊「ややっ！\n\tこの釣り場が\n\t見つかってしまうとは！\n@c2@"
"14":
  de: "@a@b*: Das hier ist mein geheimer Angelplatz, wisst Ihr, und das soll auch so bleiben. Also, erzählt es niemandem, einverstanden?\n@c2@"
  en: "@a@b*: This is me secret fishin' spot, see, an' I'd like to keep it that way. Don't tell anyone, roit?\n@c2@"
  es: "@a@b*: Este es mi lugar secreto de pesca, y quisiera que siguiese siendo secreto, viste. No se lo %H860%Xdigas%Ydigan%Z a nadie, ¿OK?\n@c2@"
  fr: "@a@b*ⓢ Y'a que moi qui connais ce coin de pêche et j'aimerais autant que personne soit au courant.\nVous direz rien, heinⓡ\n@c2@"
  it: "@a@b*: Chistu iè 'u postu segretu mio pe' piscari e vurrìa ca restassi accussì. M'arraccumannu, nisciunu l'avi a sapiri!\n@c2@"
  ja: "@a@b＊「ここは　ワシだけの穴場なんじゃ。\n\tどうか　ないしょにしてくだされ。\n@c2@"
"15":
  de: "@a@b%0%a00120 liest das Schild.\n@c0@"
  en: "@a@b%0%a00120 reads the sign.\n@c0@"
  es: "@a@b%0%a00120 lee el cartel.\n@c0@"
  fr: "@a@b%0%a00120 lit l'écriteau.\n@c0@"
  it: "@a@b%0%a00120 legge il cartello.\n@c0@"
  ja: "@a@b%a00120は　立て札を　読んだ。\n@c0@"
"16":
  de: "@a@bⓞSüdlich von hier thront der Koloss.ⓟ\n@c0@"
  en: "@a@bⓗSouth of here is the Colossus statue, mate.ⓘ\n@c0@"
  es: "@a@b''Este... al sur de aquí está la estatua del Coloso, viste.''\n@c0@"
  fr: "@a@bⓥLa statue du Colosse se trouve au sud.ⓦ \n@c0@"
  it: "@a@bⓕA sud di qua, la statua del Colosso c'è.ⓖ\n@c0@"
  ja: "@a@bこれより南に進むと　魔神像。\n@c0@"
"17":
  de: "@a@b*: Dieser Kerl ist ein verdammtes Genie!\nWer hätte gedacht, dass er's tatsächlich schaffen würde, 'ne Flugmaschine zu bauen?!\n@c3@"
  en: "@a@b*: That bloke's a dinky-di genius! Who'd have thought he'd be able to make a flyin' machine!?\n@c3@"
  es: "@a@b*: ¡Ese pibe es un genio! ¡A quién se le podría pasar por la cabeza que se pudiera crear una máquina voladora! ¿Viste?\n@c3@"
  fr: "@a@b*ⓢ Ce gars est vraiment un génieⓠ\nQui aurait pu penser qu'il serait capable de construire une machine qui voleⓠⓑ\n@c3@"
  it: "@a@b*: Chiddu cristianu 'nu geniu iè! Cu potìa penzari ca riusciva a costruiri 'na machina volanti?!\n@c3@"
  ja: "@a@b＊「まさか　ホントに\n\t空飛ぶ乗り物が　できるなんてなあ。\n\tあの先生　たいしたもんだよ！\n@c3@"
"18":
  de: "@a@b*: Ich schlafe nicht bei der Arbeit.\nIch doch nicht.\n@c2@"
  en: "@a@b*: I ain't sleepin' on the job, mate. No, not me.\n@c2@"
  es: "@a@b*: Yo no duermo en el laburo, viste.\nEste... no, seguro que no.\n@c2@"
  fr: "@a@b*ⓢ Je ne rechigne pas à la tâche.\nAh ça non, pas moi.\n@c2@"
  it: "@a@b*: Pe' mmia 'u travagghiu è sacro.\n@c2@"
  ja: "@a@b＊「し　仕事中に\n\t寝たりなんかしてませんよ！\n@c2@"
"19":
  de: "@a@b*: Dank Eurer Gasflasche konnte ich meinen Ballon endlich fertig stellen.\n@c2@"
  en: "@a@b*: That gas canister was just the ticket for helpin' me finish me balloon, cobber.\n@c2@"
  es: "@a@b*: Che, ese recipiente de gas era lo único que me faltaba para terminar mi globo.\n@c2@"
  fr: "@a@b*ⓢ Cette bonbonne de gaz était exactement ce qui me manquait pour finir ce ballon.\n@c2@"
  it: "@a@b*: Chidda bombola 'i gas iera proprio chiddu ca ci volìa pe' finiri 'a machina volanti.\n@c2@"
  ja: "@a@b＊「気球が完成したのは\n\tあのガスのツボの　おかげです。\n@c2@"
"20":
  de: "@a@b*: Es ist toll zu sehen, dass sich harte Arbeit doch auszahlt. Ich werd noch ein paar mehr von den Dingern bauen!\n@c2@"
  en: "@a@b*: You can't beat it when your hard yakka finally pays off. I'll be makin' a few more o' those, an' that's fair dinkum!\n@c2@"
  es: "@a@b*: Al final, el trabajo duro da sus resultados. Haré algunos más, ¡eso es seguro! ¿Viste?\n@c2@"
  fr: "@a@b*ⓢ Arriver à un résultat comme ça après avoir travaillé d'arrache-pied... c'est fabuleux. Et pour tout dire, je vais même en fabriquer d'autresⓠ\n@c2@"
  it: "@a@b*: Che beddu quannu 'u travagghiu paga! Ora pozzu costruiri autri machini! Che cosa beddissima, ah!\n@c2@"
  ja: "@a@b＊「これからも　がんばって\n\t気球を　つくっていきますよ！\n@c2@"
"21":
  de: "@a@b*: Stellt Euch nur vor, wie das wäre, wenn Leute auf der ganzen Welt plötzlich von einem Ort zum anderen fliegen könnten! Ein Traum!\n@c2@"
  en: "@a@b*: I'd be just rapt if people all over the world end up bein' able to travel by air.\nThat's me dream, y'know.\n@c2@"
  es: "@a@b*: Este... estaría feliz si personas de todo el mundo pudieran viajar por el aire.\nEse es mi sueño, %H860%Xya sabés%Yya saben%Z.\n@c2@"
  fr: "@a@b*ⓢ Je serais vraiment aux anges si les gens du monde entier finissaient tous par voyager dans le ciel. C'est mon rêve le plus cher.\n@c2@"
  it: "@a@b*: 'Nu iornu forsi tuttu 'u munnu potrà volari.\nChistu 'u sogno mio iè.\n@c2@"
  ja: "@a@b＊「そして　いつか　世界中の人々が\n\t空を　自由に旅できるように……\n\tそれが　わたしの夢なんです。\n@c2@"
"22":
  de: "@a@b*: Schnurr?\n@c1@"
  en: "@a@b*: Purr?\n@c1@"
  es: "@a@b*: Este... Purr.\n@c1@"
  fr: "@a@b*ⓢ Ron-ronⓡ\n@c1@"
  it: "@a@b*: Miiiii-ao.\n@c1@"
  ja: "@a@b＊「にゃふ～ん。\n@c1@"
"23":
  de: "@a@b*: Zzzz...\n@c2@"
  en: "@a@b*: Zzzz...\n@c2@"
  es: "@a@b*: Zzzz...\n@c2@"
  fr: "@a@b*ⓢ Zzz...\n@c2@"
  it: "@a@b*: Ronf...\n@c2@"
  ja: "@a@b＊「ウトウト……。\n@c2@"
"24":
  de: "@a@bEin Fisch hat angebissen, aber der alte Mann merkt es nicht!\n@c2@"
  en: "@a@bThe fishing line is being tugged at, but the old man doesn't notice!\n@c2@"
  es: "@a@b¡Están tirando del sedal, pero el viejito no lo notó!\n@c2@"
  fr: "@a@bÇa mord, mais le vieil homme ne remarque rienⓠ\n@c2@"
  it: "@a@bQualcosa strattona la lenza, ma il vecchietto non se ne accorge!\n@c2@"
  ja: "@a@bつり糸が　引いている。\nしかし　老人は　気づいていない！\n@c2@"
"25":
  de: "@a@b*: Mein Oller sagt immer, dass er zu müde ist zum Schnacken. Er will überhaupt nicht mehr mit mir reden.\n@c2@"
  en: "@a@b*: Me old man's always complainin' he's too tired for chit-chat. He won't talk to me at all, the mongrel.\n@c2@"
  es: "@a@b*: Mi viejo siempre se queja de que está demasiado cansado para conversar. No habla nunca conmigo, es un mala onda.\n@c2@"
  fr: "@a@b*ⓢ Mon mari dit toujours qu'il est trop fatigué pour causer. Il me parle plus du tout, le vieux crabe.\n@c2@"
  it: "@a@b*: 'U maritu mio si lamenta sempre ca è troppu stancu pe' chiacchierari. Anzi, diciamo ca non mi parla proprio, chiddu piecoro.\n@c2@"
  ja: "@a@b＊「うちの人ったら\n\t疲れた　疲れた　ばっかり言って\n\tちっとも　話を聞いてくれないのよ。\n@c2@"
"26":
  de: "@a@b*: Ich bin ein richtiges Arbeitstier, wisst Ihr. Ich arbeite den lieben, langen Tag.\n@c2@"
  en: "@a@b*: I'm a battler through and through, me.\nI work hard all day long, y'know.\n@c2@"
  es: "@a@b*: Este... yo soy un tipo luchador.\nTrabajo el día entero, ¿sabés?\n@c2@"
  fr: "@a@b*ⓢ Je suis un battant, vous savez.\nToute la journée, je travaille dur. Je me bats.\n@c2@"
  it: "@a@b*: Io travagghiu ogni giorno come a 'nu mulu.\nMai mi fermo!\n@c2@"
  ja: "@a@b＊「オレは　昼間の仕事で\n\t疲れてんだ。\n@c2@"
"27":
  de: "@a@b*: Und das Letzte, was ich hören will, wenn ich nach Hause komm, ist irgendein Seemannsgarn über einen Koloss, der 'nen Spaziergang macht!\n@c2@"
  en: "@a@b*: The last thing I wanna hear when I get home is some crazy yabber about the Colossus statue takin' a walk! \n@c2@"
  es: "@a@b*: ¡Lo último que quiero oír al llegar a casa es alguna boludez sobre que la estatua del Coloso salió andando! \n@c2@"
  fr: "@a@b*ⓢ Alors s'il y a bien une chose que je n'ai pas envie d'entendre quand je rentre chez moi, c'est ce blabla sur la statue du Colosse qui va faire des baladesⓠ\n@c2@"
  it: "@a@b*: L'ultima cosa ca voglio sentiri quando torno a casa è mia mugghieri ca parla della statua del Colosso ca si face 'na passiggiata! \n@c2@"
  ja: "@a@b＊「魔神像が　歩いたなんて\n\tバカな話は　聞きたくないぜ！\n@c2@"
"28":
  de: "@a@b*: Eine Burg oben in den Wolken? Ihr wollt mich wohl auf den Arm nehmen?! Das glaube ich erst, wenn ich's sehe.\n@c1@"
  en: "@a@b*: A castle way up in the clouds?\nDon't come the raw prawn with me!\nI'll believe it when I see it.\n@c1@"
  es: "@a@b*: ¿Un castillo en los cielos?\n¿%H860%XVos pensás%YUstedes piensan%Z que soy una loca?\nLo voy a creer cuando lo vea.\n@c1@"
  fr: "@a@b*ⓢ Un château dans les nuagesⓡ\nN'essayez pas de me faire marcherⓠ\nJe ne crois que ce que je vois.\n@c1@"
  it: "@a@b*: 'Nu castello chi staci 'nta 'u cielu?\nM'%H860%Xhai%Yavete%Z presa pe 'na pazza?\nQuannu 'u vedo, allora ci credo!\n@c1@"
  ja: "@a@b＊「お空の　ずっと上に\n\t天空のお城があるなんて\n\t信じられないわ。\n@c1@"
"29":
  de: "@a@b*: Selbst ein Ballon kann Euch nicht dorthin bringen, wo die Englein leben.\n@c1@"
  en: "@a@b*: Even a balloon can't take you way up high to where the angels live.\n@c1@"
  es: "@a@b*: Ni siquiera un globo puede %H860%Xllevarte%Yllevarles%Z hasta donde habitan los ángeles.\n@c1@"
  fr: "@a@b*ⓢ Même avec un ballon, vous n'irez pas assez haut pour atteindre l'endroit où vivent les anges.\n@c1@"
  it: "@a@b*: Nemmeno una mongolfiera riuscirebbe a salire lì dove abitano gli angeli. \n@c1@"
  ja: "@a@b＊「たとえ　気球に乗ろうとも\n\tはるか空の上の　天空までは\n\tゆけないでしょう。\n@c1@"
"30":
  de: "@a@b*: Aber vielleicht hilft er Euch ja, den rechten Weg zu finden, nicht wahr?\n@c1@"
  en: "@a@b*: But maybe it might at least help you find the right path, eh?\n@c1@"
