  it: "@a@b... quindi sogghigna soddisfatto.\n@c0@"
  ja: "@a@bそして　不敵な\n笑みをうかべた。\n@c0@"
"98":
  de: "@aPsaro@bGut. Jetzt bin ich wieder präsentabel. Dann kann es wohl weitergehen.\n@c2@"
  en: "@aPsaro@bVery good. I have made myself presentable,\nnow let us continue.\n@c2@"
  es: "@aPsaro@bMuy bien. Ya estoy presentable, podemos continuar.\n@c2@"
  fr: "@aPsaro@bTrès bien. Je me suis rendu présentable.\nMaintenant, continuons.\n@c2@"
  it: "@aPsaro@bMolto bene. Ho un aspetto presentabile. Possiamo proseguire...\n@c2@"
  ja: "@a@bピサロ「わたしの仕度は\n\t済んでいる。　さあ\n\tさっさと　行くぞ。\n@c2@"
"99":
  de: "@aMedi@b(Schlürf) Ich bin echt gespannt, wie ich aussehe, wenn ich dieses Gesicht los bin und ein MANSCH werde!\n@c1@"
  en: "@aHealie@b(slurp) I can't wait to see what I look like when I get rid of this boring old face and become a gooman!\n@c1@"
  es: "@aCuri@b¡(slurp) Estoy deseando ver qué aspecto tengo cuando me deshaga de esta limosa cara y me convierta en humano!\n@c1@"
  fr: "@aDoc@b(slurp) J'ai hâte de voir à quoi je ressemblerai lorsque je me débarrasserai de ma tête actuelle et que je deviendrai humainⓠ\n@c1@"
  it: "@aHealie@bNon vedo l'ora di sbarazzarmi del mio aspetto blobboso e di diventare un essere umano!\n@c1@"
  ja: "@a@bホイミン「ボク　今はこんな顔だけど\n\t人間になったら　どんな顔になるのか\n\tとっても　楽しみだよ。\n@c1@"
"100":
  de: "@aMedi@bWeißt du, Ragnar, für einen Doktorschleim habe ich ein sehr kühn geschnittenes und männliches Gesicht.\n@c1@"
  en: "@aHealie@bApparently, I have a very gallant and gooracious face for a healslime, you know, Ragnar.\n@c1@"
  es: "@aCuri@bAl parecer, tengo un rostro muy limoso y apuesto para ser un medulimo cicatrizante, ¿lo sabías Ragnar?\n@c1@"
  fr: "@aDoc@bApparemment, j'ai un visage très avenant et plutôt gracieux pour un médigluant, vous savez, Ragnar.\n@c1@"
  it: "@aHealie@bSai, Galiardo? Credo di essere lo Slime più raffinato e affascinante che slurpesista al mondo.\n@c1@"
  ja: "@a@bホイミン「ライアンさん。　ボクの顔って\n\tホイミスライムの中では\n\tとっても　りりしい顔なんだよ。\n@c1@"
"101":
  de: "@aMedi@bAber du kannst Schleime wahrschleimlich gar nicht auseinanderhalten, oder?\n@c1@"
  en: "@aHealie@bBut I bet you can't tell one slime from another,\ncan you?\n@c1@"
  es: "@aCuri@bPero seguro que no puedes distinguir unos limos de otros, ¿verdad?\n@c1@"
  fr: "@aDoc@bMais je parie que pour vous, tous les gluants se ressemblent, n'est-ce pasⓡ\n@c1@"
  it: "@aHealie@bMa forse tu non te ne rendi conto. Scommetto che per te noi Slime siamo tutti uguali! Slurp!\n@c1@"
  ja: "@a@bホイミン「でも　ライアンさんには\n\t他のホイミスライムと\n\t見分けがつかないかな？\n@c1@"
"102":
  de: "@a@b... und streicht sich mit der Hand über den Kopf.\n@c0@"
  en: "@a@b...and rubs his hand over the top of his head.\n@c0@"
  es: "@a@b... y se pasa el tentáculo por la cabeza.\n@c0@"
  fr: "@a@b... et se frotte le sommet du crâne.\n@c0@"
  it: "@a@b... e si tocca ripetutamente la testa.\n@c0@"
  ja: "@a@bホイミンは　なにやら\n自分の頭を　なでている。\n@c0@"
"103":
  de: "@aMedi@bIch übe schon mal, mein Haar zurückzustreichen für die Zeit, wenn ich ein Mansch geworden bin. (Schlürf)\n@c1@"
  en: "@aHealie@bI'm practising brushing my hair for when I become a gooman. (slurp)\n@c1@"
  es: "@aCuri@bEstoy practicando la forma de peinarme para cuando me convierta en humano. (slurp)\n@c1@"
  fr: "@aDoc@bJe m'entraîne à me brosser les cheveux pour quand je serai devenu humain. (slurp)\n@c1@"
  it: "@aHealie@bMi sto allenando a pettinarmi, così saprò come fare quando sarò diventato un uomo! Uhm... I capelli mi staranno meglio lisci o ricci?\n@c1@"
  ja: "@a@bホイミン「今　人間になった\n\tときのために　かみをとかす\n\t練習をしてたんだよ。\n@c1@"
"104":
  de: "@a@b... und dreht sich ein paarmal um sich selbst.\n@c0@"
  en: "@a@b...and spins swiftly around several times.\n@c0@"
  es: "@a@b... y comienza a dar vueltas sobre sí mismo.\n@c0@"
  fr: "@a@b... et tourne rapidement sur lui-même plusieurs fois.\n@c0@"
  it: "@a@b... e ruota su sé stesso più volte.\n@c0@"
  ja: "@a@bホイミンは　鏡の前で\nくるくると　回っている。\n@c0@"
"105":
  de: "@a@bEs sieht aus, als wollte er sich von hinten sehen!\n@c0@"
  en: "@a@bIt looks as if he's trying to get a look at his\nback side!\n@c0@"
  es: "@a@b¡Parece como si quisiera verse la parte de atrás!\n@c0@"
  fr: "@a@bOn dirait qu'il essaie de regarder son dosⓠ\n@c0@"
  it: "@a@bSi direbbe che voglia guardarsi la schiena...\n@c0@"
  ja: "@a@bどうやら　自分の後ろ側を\n見ようとしているようだ。\n@c0@"
"106":
  de: "@aMedi@bWarum trägst du nicht auch so ein schlickes\nMake-up, Ragnar?\n@c1@"
  en: "@aHealie@bWhy don't you wear that make-up goo too, Ragnar?\n@c1@"
  es: "@aCuri@b¿Por qué no pruebas a ponerte ese lodoso maquillaje, Ragnar?\n@c1@"
  fr: "@aDoc@bRagnar, pourquoi vous ne portez pas de maquillage, vous aussiⓡ\n@c1@"
  it: "@aHealie@bGaliardo, come mai tu non usi il rossetto? Slurp!\n@c1@"
  ja: "@a@bホイミン「ライアンさん。　どうして\n\tライアンさんは　お化粧を\n\tしていないの？\n@c1@"
"107":
  de: "@aMedi@bWas? Make-up ist nur für Weibsbilder? Was ist denn ein Weibsbild?\n@c1@"
  en: "@aHealie@bWhat? Make-up's only for lassies?\nWhat's a lassie?\n@c1@"
  es: "@aCuri@b¿Qué? ¿El maquillaje es sólo para las damas?\n¿Qué es una dama?\n@c1@"
  fr: "@aDoc@bCommentⓡ Le maquillage, c'est juste pour les donzellesⓡ C'est quoi, une donzelleⓡ\n@c1@"
  it: "@aHealie@bCosa? Dici che solo le donne usano il rossetto?\nOh, capisco. Senti, Galiardo... Cosa sono le donne?\n@c1@"
  ja: "@a@bホイミン「え？　お化粧って\n\t女の人だけが　するものなんだ。\n@c1@"
"108":
  de: "@aMedi@bAch so. Man lernt nie aus, was? (Schlürf)\n@c1@"
  en: "@aHealie@bOh, I see. Well, you learn something new every day, don't you, eh? (slurp)\n@c1@"
  es: "@aCuri@b¡Oh!, ya veo. Vaya, no te acostarás sin saber una cosa más, ¿verdad? (slurp)\n@c1@"
  fr: "@aDoc@bOh, je vois. Comme quoi, on en apprend tous les jours, heinⓡ (slurp)\n@c1@"
  it: "@aHealie@bAh-ha! Buono a sapersi!\nNon si finisce mai di slimparare, eh? Sluuurp!\n@c1@"
  ja: "@a@bホイミン「そっか～　ひとつ\n\t勉強になったよ。\n@c1@"
"109":
  de: "@a@b... und sucht sorgfältig, ob er irgendwo Dreck im Gesicht hat.\n@c0@"
  en: "@a@b...and carefully checks his face for dirt.\n@c0@"
  es: "@a@b... y, con cuidado, comprueba si tiene la cara limpia.\n@c0@"
  fr: "@a@b... et vérifie soigneusement que son visage est propre.\n@c0@"
  it: "@a@b... e controlla che il suo aspetto sia inappuntabile.\n@c0@"
  ja: "@a@bホフマンは　顔によごれが\nついていないか　確かめた。\n@c0@"
"110":
  de: "@aHank Hoffman Jr.@bMan muss immer so gut aussehen, wie man kann, sonst vertrauen einem die Leute nicht.\n@c2@"
  en: "@aHank Hoffman Jr.@bYa gots to cut a swell, else folks ain't never gonna trust ya.\n@c2@"
  es: "@aJuanchito@bHay que verse bien apuesto para que la gente confíe en ti.\n@c2@"
  fr: "@aHank Hoffman Jr@bFaut prendre soin d'son apparence si on veut que les gens vous fassent confiance.\n@c2@"
  it: "@aJohn Dwayne Jr.@bBisogna sempre dare una bella immagine di sé, altrimenti la gente penserà che sei un fallito o un poco di buono!\n@c2@"
  ja: "@a@bホフマン「人に信じてもらうためには\n\tまず　見た目が大事ですからね。\n@c2@"
"111":
  de: "@aHank Hoffman Jr.@bIch kann mich manchmal einfach nicht im Spiegel ansehen, ohne mich 'n bisschen zu erschrecken.\n@c2@"
  en: "@aHank Hoffman Jr.@bI jes' cain't look in a mirror sometimes without I git a little spooked.\n@c2@"
  es: "@aJuanchito@bA veces pues ni puedo mirarme en un espejo sin asustarme un poco.\n@c2@"
  fr: "@aHank Hoffman Jr@bDes fois, ça m'fiche un peu la frousse de m'regarder dans un miroir.\n@c2@"
  it: "@aJohn Dwayne Jr.@bA volte, quando mi guardo allo specchio mi prende un sussulto.\n@c2@"
  ja: "@a@bホフマン「鏡を見てると\n\tたまに　不安になるんですよ。\n@c2@"
"112":
  de: "@aHank Hoffman Jr.@bIch mein', dieser Typ, der mich da anglotzt, bin das wirklich ich?\n@c2@"
  en: "@aHank Hoffman Jr.@bI mean, is that varmint starin' back outta there really me?\n@c2@"
  es: "@aJuanchito@b¿De veritas que ese indeseable que me está mirando soy realmente yo?\n@c2@"
  fr: "@aHank Hoffman Jr@bJ'veux dire... Est-ce que l'type qui m'regarde là-dedans, c'est vraiment moiⓡ\n@c2@"
  it: "@aJohn Dwayne Jr.@bQuel brutto ceffo che vedo riflesso non mi piace affatto!\n@c2@"
  ja: "@a@bホフマン「鏡にうつった自分は\n\t本当に　ホンモノなのかって。\n@c2@"
"113":
  de: "@aHank Hoffman Jr.@bTja, ist schon mächtig lange her, dass ich mich das letzte Mal in Ruhe im Spiegel ansehen konnte.\n@c2@"
  en: "@aHank Hoffman Jr.@bWell, it's been a mighty long time since I had a good ol' stare at maself in a mirror.\n@c2@"
  es: "@aJuanchito@bPues hace ya un tiempito que no me miro detenidamente en un espejo.\n@c2@"
  fr: "@aHank Hoffman Jr@bEh ben, ça faisait un bail que j'm'étais pas regardé d'près dans un miroir.\n@c2@"
  it: "@aJohn Dwayne Jr.@bUhm, è un pezzo che non mi guardo allo specchio...\n@c2@"
  ja: "@a@bホフマン「そういえば　鏡を\n\tじっと見るのも　久しぶりです。\n@c2@"
"114":
  de: "@aHank Hoffman Jr.@bWahrscheinlich, weil mir der Typ, der mir da entgegengeglotzt hat, nicht besonders gefallen hat.\n@c2@"
  en: "@aHank Hoffman Jr.@bI guess it's on account o' how I wasn't none too pleased with the fella used to stare back out at me.\n@c2@"
  es: "@aJuanchito@bMe imagino que será por que ni modo me agrada el hombre que me devuelve la mirada.\n@c2@"
  fr: "@aHank Hoffman Jr@bJ'suppose que c'était parce que j'aimais pas trop l'regard que m'renvoyait le type là-dedans.\n@c2@"
  it: "@aJohn Dwayne Jr.@bGli specchi non mi sono simpatici. Non mi piace il tizio che ci vedo riflesso dentro, e che mi guarda con tanta insistenza...\n@c2@"
  ja: "@a@bホフマン「あのころは　鏡に\n\tうつった自分の姿をみるのも\n\tいやだったですから。\n@c2@"
"115":
  de: "@aHank Hoffman Jr.@bIch bin einfach zu lange mit 'ner sauertöpfischen Miene rumgelaufen.\n@c2@"
  en: "@aHank Hoffman Jr.@bI been walkin' 'round lookin' sour as a sow's behind for too darned long.\n@c2@"
  es: "@aJuanchito@bPuede que sea porque llevo demasiado tiempo con un rostro reserio.\n@c2@"
  fr: "@aHank Hoffman Jr@bC'est peut-être parce que je tire une sale tête depuis trop longtemps...\n@c2@"
  it: "@aJohn Dwayne Jr.@bCerto, ho sempre un'espressione cupa e accigliata.\n@c2@"
  ja: "@a@bホフマン「ずっと　しかめ面ばかり\n\tしていたせいでしょうか。\n@c2@"
"116":
  de: "@aHank Hoffman Jr.@bKann mich ja kaum noch dran erinnern, wie man überhaupt lächelt.\n@c2@"
  en: "@aHank Hoffman Jr.@bSeems I can't barely remember how to crack a smile.\n@c2@"
  es: "@aJuanchito@bParece que me olvidé de sonreír, nomás.\n@c2@"
  fr: "@aHank Hoffman Jr@b... mais j'ai presque du mal à m'rappeler comment on fait pour sourire.\n@c2@"
  it: "@aJohn Dwayne Jr.@bNon mi ricordo nemmeno come si fa a sorridere...\n@c2@"
  ja: "@a@bホフマン「さわやかな　笑顔って\n\tけっこう　むずかしいですね。\n@c2@"
"117":
  de: "@a@b... und stellt fest, dass seine Kopfbedeckung schief sitzt.\n@c0@"
  en: "@a@b...and notices that his hat is askew.\n@c0@"
  es: "@a@b... y comprueba que lleva el sombrero torcido.\n@c0@"
  fr: "@a@b... et remarque que son chapeau est de travers.\n@c0@"
  it: "@a@b... e vede che il cappello è appena di traverso.\n@c0@"
  ja: "@a@bぼうしが　ずれている……。\n@c0@"
"118":
  de: "@a@bEr rückt sie eilig wieder gerade.\n@c0@"
  en: "@a@bHe hurriedly straightens it up.\n@c0@"
  es: "@a@bRápidamente lo endereza.\n@c0@"
  fr: "@a@bIl se dépêche de le remettre droit.\n@c0@"
  it: "@a@bLo raddrizza subito, con una mossa decisa e repentina.\n@c0@"
  ja: "@a@bホフマンは　あわてて\nぼうしを　なおした。\n@c0@"
"119":
  de: "@aAlberich von Übermuth@bAh, ein Blick in den Spiegel bringt mich immer zum Reflektieren.\n@c2@"
  en: "@aTom Foolery@bAh, puts me in a reflective mood, so it does.\n@c2@"
  es: "@aBen-Irrie@b¿Cómo si dice espiejo en chino?... Ayⓚtoy.\n@c2@"
  fr: "@aTom Foolery@bAh, ce miroir me porte à la réflexion.\n@c2@"
  it: "@aJock Erellon@bAh, quest'affare... mi fa riflettere!\n@c2@"
  ja: "@a@bパノン「鏡を見るときは\n\tつい　かがみこんじゃいます。\n@c2@"
"120":
  de: "@aAlberich von Übermuth@bDer war gut, oder? Ist dir das Wort fremd? Es spiegelt meinen Humor wider! Denk mal darüber nach!\n@c2@"
  en: "@aTom Foolery@bHey, that was a good 'un.\nDon't you go lookin' glassy, now!\n@c2@"
  es: "@aBen-Irrie@bEh, ha tienido gracia.\n¿No lo %H860%Xhas%Yhabéis%Z pillado?\n@c2@"
  fr: "@aTom Foolery@bHé, elle était bonne, heinⓠ\nInutile de rester de glaceⓠ\n@c2@"
  it: "@aJock Erellon@bBuona questa! Voglio segnarmela per il prossimo spettacolo.\n@c2@"
  ja: "@a@bパノン「……いまいちですか。\n@c2@"
"121":
  de: "@aAlberich von Übermuth@bIhr habt doch bestimmt einen ganz schönen Verschleiß an Spiegeln, oder?\n@c2@"
  en: "@aTom Foolery@bDid ye know yer ma can make anytin' laugh,\neven a mirror?\n@c2@"
  es: "@aBen-Irrie@b¿%H860%XSiabes%YSabiéis%Z que %H860%Xpuedes%Ypodéis%Z hacer reír a cualquier cosa, incliuso a un espiejo?\n@c2@"
  fr: "@aTom Foolery@bVous saviez que je pouvais faire rire n'importe quoi, même un miroirⓡ\n@c2@"
  it: "@aJock Erellon@bConosco una donna brutta come la paura, ma dotata di poteri davvero incredibili!\n@c2@"
  ja: "@a@bパノン「鏡は　なんと　死者の国と\n\tつながっているそうです。\n@c2@"
"122":
  de: "@aAlberich von Übermuth@bNun ja, jedes Mal, wenn Eure komische Gestalt in einem Spiegel auftaucht...\n@c2@"
  en: "@aTom Foolery@bYe see, every time she even looks at one...\n@c2@"
  es: "@aBen-Irrie@bCada viez que %H860%Xti miras%Yos miráis%Z en uno...\n@c2@"
  fr: "@aTom Foolery@bOuais, chaque fois que j'en croise un...\n@c2@"
  it: "@aJock Erellon@bÈ in grado di rompere qualsiasi specchio senza nemmeno sfiorarlo!\n@c2@"
  ja: "@a@bパノン「ですから　夜中に\n\t鏡を　見ると　死者の国に\n\t引きずりこまれて　しまうそうですよ。\n@c2@"
"123":
  de: "@aAlberich von Übermuth@b... LACHT DER SICH DOCH KAPUTT!\nHaaach, ein echter Brüller war das, was?\n@c2@"
  en: "@aTom Foolery@b...IT CRACKS UP!\nAhh, that's a beauty, that one!\n@c2@"
  es: "@aBen-Irrie@b¡... SI PARTE!\n¿No lo %H860%Xhas%Yhabéis%Z pillado?\n@c2@"
  fr: "@aTom Foolery@b... je lui propose de BRISER LA GLACEⓠ\nAh, elle est vraiment terrible, celle-làⓠ\n@c2@"
  it: "@aJock Erellon@bLe basta guardarcisi dentro!\nBuona questa, eh?\n@c2@"
  ja: "@a@bパノン「え？　そんな　話を聞くと\n\tこわくて　夜に　鏡が\n\tミラーれなく　なるって？\n@c2@"
"124":
  de: "@aAlberich von Übermuth@bWie ⓚⓛ der hat Euch nicht gefallen?\nTja, dann versuche ich es nächstes Mal mit etwas anderem.\n@c2@"
  en: "@aTom Foolery@bNot to yer likin', eh?\nI'll try sometin' else next time.\n@c2@"
  es: "@aBen-Irrie@b¿No %H860%Xti%Yos%Z ha gustado diemasiado, vierdad?\nPriobaré algo diferente la prióxima vez.\n@c2@"
  fr: "@aTom Foolery@bÇa ne vous plaît pas, heinⓡ\nJ'essaierai autre chose la prochaine fois.\n@c2@"
  it: "@aJock Erellon@bNon ti è piaciuta?\nPreferisci le barzellette sui politici?\n@c2@"
  ja: "@a@bパノン「ううっ　これもダメダメですね。\n@c2@"
"125":
  de: "@aAlberich von Übermuth@bHabt Ihr schon gewusst, dass man sich vor Spiegeln ganz schön in Acht nehmen muss?\n@c2@"
  en: "@aTom Foolery@bDid I tell y'I fell headfirst into me lookin' glass the other day, an' it didn't even break?\n@c2@"
  es: "@aBen-Irrie@b¿%H860%XTi%YOs%Z he contiado el de cómo si dice espejo roto en chino?\n@c2@"
  fr: "@aTom Foolery@bJe vous ai dit que j'étais tombé tête la première contre mon miroir, l'autre jourⓡ Il n'a même pas cassé.\n@c2@"
  it: "@aJock Erellon@bIeri ho incontrato un vecchio tanto malato. Mi ha detto che aveva rotto uno specchio, e che ora avrebbe avuto sette anni di guai! Era felicissimo!\n@c2@"
  ja: "@a@bパノン「鏡を　買いに行くのは\n\t明日だったっけ？\n@c2@"
"126":
  de: "@aAlberich von Übermuth@bNun ja, man wirft nur einen klitzekleinen Blick hinein... und die werfen einem gleich ein ganzes Spiegelbild zurück!\n@c2@"
  en: "@aTom Foolery@bAye, 'twas a MIRRORcle, so it was.\n@c2@"
  es: "@aBen-Irrie@bSí, Ayⓚtabaⓚyo.\n@c2@"
  fr: "@aTom Foolery@bOui, c'était une chute sans éclat... Sans éclats de verre, vous avez comprisⓡ\n@c2@"
  it: "@aJock Erellon@bMa come?! Ti aspettano sette anni di guai e tu sei contento?! ⓕEh, sì! Il dottore mi aveva appena detto che mi restavano solo due mesi di vita!ⓖ\n@c2@"
  ja: "@a@bパノン「ううん　きょうだい！\n@c2@"
"127":
  de: "@aAlberich von Übermuth@bAch, kommt schon, habt Ihr denn gar keinen Sinn für Humor?\n@c2@"
  en: "@aTom Foolery@bAh, come on now, have ye no sense o' humour?\n@c2@"
  es: "@aBen-Irrie@b¡Ah!, vamos, ¿no lo %H860%Xhas%Yhabiéis%Z pillado?\n@c2@"
  fr: "@aTom Foolery@bOh, franchement, vous n'avez aucun sens de l'humour ou quoiⓡ\n@c2@"
  it: "@aJock Erellon@bDa... morire dal ridere, eh?\n@c2@"
  ja: "@a@bパノン「うーん　ちょっと\n\tわかりづらいですか。\n@c2@"
"128":
  de: "@a@b... versinkt tief in Gedanken bei dem Versuch, sich brüllend komische Witze auszudenken.\n@c0@"
  en: "@a@b...and drifts off trying to think of hilarious jokes.\n@c0@"
  es: "@a@b... y se aleja para pensar en otro chiste de esos que te partes.\n@c0@"
  fr: "@a@b... et essaie de penser à des blagues drôles.\n@c0@"
  it: "@a@b... e comincia a pensare a qualche nuova, esilarante battuta.\n@c0@"
  ja: "@a@bパノンは　鏡を見ながら\nシャレを　考えている……。\n@c0@"
"129":
  de: "@a@bAber leider scheint ihm gar nichts Komisches einzufallen.\n@c0@"
  en: "@a@bUnfortunately, it looks as if he can't come up with anything funny.\n@c0@"
  es: "@a@bPor suerte, parece que no se le ocurre nada gracioso.\n@c0@"
  fr: "@a@bMais on dirait que rien de comique ne lui vient, malheureusement.\n@c0@"
  it: "@a@bPurtroppo, non gli viene in mente nulla di divertente.\n@c0@"
  ja: "@a@bどうやら　いいシャレが\n思いつかなかったようだ。\n@c0@"
"130":
  de: "@a@b... und fängt an, ein paar Stimmübungen zu machen.\n@c0@"
  en: "@a@b...and starts doing some vocal exercises.\n@c0@"
  es: "@a@b... y comienza a realizar ejercicios vocales.\n@c0@"
  fr: "@a@b... et commence à faire des exercices vocaux.\n@c0@"
  it: "@a@b... e comincia a fare esercizi di riscaldamento per le corde vocali.\n@c0@"
  ja: "@a@bパノンは　鏡の前で\n発声練習を　始めた。\n@c0@"
"131":
  de: "@aAlberich von Übermuth@bEin Entertainer lebt von seiner Stimme. Wenn ich die nicht trainieren würde, wäre ich schneller aus dem Geschäft als eine euterlose Kuh.\n@c2@"
  en: "@aTom Foolery@bA comedian's voice is his livelihood, so. If I didn't do me practice, I'd be out o' work quicker than a cow wit' no udders.\n@c2@"
  es: "@aBen-Irrie@bLa vioz de un cómico es su fiorma de vida. Si no priacticara, triabajaría mienos que un espía sordo, sí.\n@c2@"
  fr: "@aTom Foolery@bLe gagne-pain d'un comédien, c'est sa voix. Alors si je ne la travaille pas, je me retrouverai sans travail encore plus vite qu'une vache sans pis.\n@c2@"
  it: "@aJock Erellon@bLa voce è tutto per noi attori. Se non faccio i miei esercizi quotidiani, perderò il timbro simpatico e ammaliante che tanto piace al mio pubblico...\n@c2@"
  ja: "@a@bパノン「お笑い芸人は　声が命。\n\tこうして　発声練習をしていないと\n\t舞台に上がれなくなりますからね。\n@c2@"
"132":
  de: "@aOrifiela@bDie Erdbewohner sehen mich immer so unverwandt an, dass ich befürchte, ich muss mich irgendwie beschmutzt haben.\n@c1@"
  en: "@aOrifiela@bThe earth-dwellers gaze upon my countenance with such fixed attention, I fear that I must be blemished or sullied in some manner.\n@c1@"
  es: "@aOrifiela@bLos habitantes de la tierra observan mi aspecto con tal fijación que me temo que he de tener alguna mácula.\n@c1@"
  fr: "@aOrifiela@bLes terriens me fixent avec une telle attention que je crains de présenter une tache ou une souillure quelconque.\n@c1@"
  it: "@aOrifiela@bGli esseri umani mi fissano con tanta insistenza che a volte temo di avere qualche grossa macchia sulle vesti.\n@c1@"
  ja: "@a@bルーシア「地上の人たちが\n\tルーシアのことを　ジッと見てたので\n\t何かついてるかと思ったんですけど……\n@c1@"
"133":
  de: "@aOrifiela@bAber ich kann wirklich keinen Unrat an mir entdecken.\n@c1@"
  en: "@aOrifiela@bBut verily, no detritus appears to be adhering to\nmy person.\n@c1@"
  es: "@aOrifiela@bPero sinceramente, no parece que me recubra deshecho alguno.\n@c1@"
  fr: "@aOrifiela@bPourtant, on dirait qu'aucune saleté ne s'est attachée à ma personne.\n@c1@"
  it: "@aOrifiela@bEppure, quando mi guardo, non vedo sporcizia su di esse.\n@c1@"
  ja: "@a@bルーシア「でも　ルーシアの顔に\n\tなにも　ついてないですよねぇ？\n@c1@"
"134":
  de: "@aOrifiela@bIch verstehe das nicht...\n@c1@"
  en: "@aOrifiela@bI do not understand...\n@c1@"
  es: "@aOrifiela@bNo lo comprendo...\n@c1@"
  fr: "@aOrifiela@bJe ne comprends pas...\n@c1@"
  it: "@aOrifiela@bProprio non riesco a capire...\n@c1@"
  ja: "@a@bルーシア「とっても　ふしぎですぅ。\n@c1@"
"135":
  de: "@aOrifiela@bDieser Spiegel ist größer als alle, die wir bisher gefunden haben.\n@c1@"
  en: "@aOrifiela@bThis looking glass is larger than any I have heretofore encountered.\n@c1@"
  es: "@aOrifiela@bEste espejo es mucho mayor que ninguno de los que he visto hasta ahora.\n@c1@"
  fr: "@aOrifiela@bCe miroir est plus grand que tous ceux que j'ai vus jusqu'à présent.\n@c1@"
  it: "@aOrifiela@bNon avevo mai visto uno specchio tanto grande...\n@c1@"
  ja: "@a@bルーシア「ルーシア　こんなに\n\t大きな鏡を　見たのは\n\tはじめてですぅ。\n@c1@"
"136":
  de: "@aOrifiela@bIn ganz Zenithia gibt es keinen von vergleichbarer Größe.\n@c1@"
  en: "@aOrifiela@bThere are none of comparable size in Zenithia.\n@c1@"
  es: "@aOrifiela@bNo hay nada de este tamaño en Zenithia.\n@c1@"
  fr: "@aOrifiela@bIl n'en existe aucun d'une taille comparable à Zénithia.\n@c1@"
  it: "@aOrifiela@bA Zenithia non ve ne sono di simili dimensioni.\n@c1@"
  ja: "@a@bルーシア「天空のお城には\n\t大きな鏡が　ないんですよ。\n@c1@"
"137":
  de: "@aOrifiela@bDas Reich der Erdbewohner ist wahrlich ein wundersamer Ort.\n@c1@"
  en: "@aOrifiela@bThe realm of the earth-dwellers is truly a\nwondrous place.\n@c1@"
  es: "@aOrifiela@bEl reino de los habitantes de la tierra es en verdad un lugar asombroso.\n@c1@"
  fr: "@aOrifiela@bLe royaume des terriens est décidément un endroit fort surprenant.\n@c1@"
  it: "@aOrifiela@bIl mondo degli uomini è davvero ricco di cose sorprendenti e meravigliose...\n@c1@"
  ja: "@a@bルーシア「ホントに　地上って\n\tおもしろいですねぇ。\n@c1@"
"138":
  de: "@aOrifiela@bIhr wollt hören, wie die Mode in Zenithia ist?\n@c1@"
  en: "@aOrifiela@bYou would know of the fashions that hold sway over the inhabitants of Zenithia?\n@c1@"
  es: "@aOrifiela@b¿%H860%XConoce%YConocen%Z las modas por las que se inclinan los habitantes de Zenithia?\n@c1@"
  fr: "@aOrifiela@bVous voulez connaître la mode qui fait fureur à Zénithiaⓡ\n@c1@"
  it: "@aOrifiela@bCome dici? Vuoi sapere delle mode che affascinano gli abitanti di Zenithia?\n@c1@"
  ja: "@a@bルーシア「天空での　流行の\n\tファッションですか？\n@c1@"
"139":
  de: "@aOrifiela@bIch befasse mich nicht mit derartigen Banalitäten.\nDa müsst Ihr jemand anderen fragen.\n@c1@"
  en: "@aOrifiela@bI do not trouble myself with such trivialities.\nYou must ask another.\n@c1@"
  es: "@aOrifiela@bYo no presto atención a tales fruslerías.\n%H860%XTendrá%YTendrán%Z que preguntar a otra persona.\n@c1@"
  fr: "@aOrifiela@bJe ne m'encombre guère de détails aussi insignifiants.\nVous devriez demander à quelqu'un d'autre.\n@c1@"
  it: "@aOrifiela@bOh, non saprei dirti. Tali frivolezze non mi hanno mai interessata. Ti suggerisco di chiedere a un'altra persona...\n@c1@"
  ja: "@a@bルーシア「うーん　ルーシアは\n\tそういうのに　うといので\n\tよくわからないですぅ。\n@c1@"
"140":
  de: "@aOrifiela@bWelche Gestalt wohl die Welt im Spiegel annehmen würde?\n@c1@"
  en: "@aOrifiela@bWhat form wouldst the world within the mirror take, I wonder?\n@c1@"
  es: "@aOrifiela@bMe pregunto qué forma tendrá el mundo dentro del espejo.\n@c1@"
  fr: "@aOrifiela@bJe me demande quelle forme pourrait bien prendre le monde à l'intérieur du miroir.\n@c1@"
  it: "@aOrifiela@bChissà che aspetto ha il mondo, visto dallo specchio...\n@c1@"
  ja: "@a@bルーシア「鏡の中の世界って\n\tどんな風に　なっているんでしょう？\n@c1@"
"141":
  de: "@aOrifiela@bOb darin wohl alles spiegelbildlich wäre?\n@c1@"
  en: "@aOrifiela@bWould all within it appear in reverse?\n@c1@"
  es: "@aOrifiela@b¿Todo en su interior aparecerá a la inversa?\n@c1@"
  fr: "@aOrifiela@bEst-ce que tout y apparaîtrait inverséⓡ\n@c1@"
  it: "@aOrifiela@bForse tutto ciò che è giusto sembrerà sbagliato, e ciò che è errato apparirà corretto...\n@c1@"
  ja: "@a@bルーシア「やっぱり　全てが\n\t反対になっているんでしょうか？\n@c1@"
"142":
  de: "@aOrifiela@b%0%a00090, ich kann mich des Gefühls nicht erwehren, dass wir uns bereits begegnet sind.\n@c1@"
  en: "@aOrifiela@b%0%a00090, I cannot escape the feeling that we are acquainted from some other place.\n@c1@"
  es: "@aOrifiela@b%0%a00090, no puedo evitar pensar que nos conocemos de algún otro lugar.\n@c1@"
  fr: "@aOrifiela@b%0%a00090, je ne peux m'empêcher de penser que nous nous sommes déjà %A090%Xrencontrés%Z%B090%Xrencontrées%Z quelque part.\n@c1@"
  it: "@aOrifiela@b%0%a00090, ho la convinzione che noi ci siamo già %A090%Xconosciuti%Z%B090%Xconosciute%Z...\n@c1@"
  ja: "@a@bルーシア「あれ？　%a00090さんの\n\t顔って　どこかで　見たような……。\n@c1@"
"143":
  de: "@aOrifiela@bDoch weiß ich nicht mehr, wann und wo.\n@c1@"
  en: "@aOrifiela@bAlas, I cannot recall from whence.\n@c1@"
  es: "@aOrifiela@bPero siento no recordar de dónde.\n@c1@"
  fr: "@aOrifiela@bHélas, je ne parviens pas à me rappeler où.\n@c1@"
  it: "@aOrifiela@bEppure non riesco a ricordare dove, né quando.\n@c1@"
  ja: "@a@bルーシア「うーん　思い出せないですぅ。\n@c1@"
