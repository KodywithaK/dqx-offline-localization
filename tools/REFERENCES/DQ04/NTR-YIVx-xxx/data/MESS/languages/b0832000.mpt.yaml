  ja: "@a@bピサロ「ふん　人間というものは\n\tいちいち　身なりを気にしないと\n\tいけない生き物のようだな。\n@c2@"
"96":
  de: "@a@b... und schiebt eine verirrte Haarsträhne hinters Ohr zurück\n@c0@"
