  ja: "@a@bトルネコ「おっと　ヒゲに\n\t食べ残しが　ついていました。\n@c2@"
"70":
  de: "@a@bTorneko wischt sich hektisch übers Kinn.\n@c0@"
  en: "@a@bTorneko frantically wipes his chin.\n@c0@"
  es: "@a@bTorneko se limpia ansiosamente.\n@c0@"
  fr: "@a@bTorneko se frotte frénétiquement le menton.\n@c0@"
  it: "@a@bBaldo toglie le briciole una a una...\n@c0@"
  ja: "@a@bトルネコは　あわてて\nくちもとを　ぬぐった。\n@c0@"
"71":
  de: "@aTorneko@bMal sehen...\n@c2@"
