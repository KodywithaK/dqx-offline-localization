  it: "@aMyra@bMa l'apparenza inganna... In realtà, non potremmo essere più differenti!\n@c1@"
  ja: "@a@bミネア「外見は似ているのに\n\tどうして　こうも性格が\n\tちがうのかしら……。\n@c1@"
"82":
  de: "@aMina@bHuch! Oh nein! Spliss!\nDas ist ja fürchterlich, einfach fürchterlich!\n@c1@"
