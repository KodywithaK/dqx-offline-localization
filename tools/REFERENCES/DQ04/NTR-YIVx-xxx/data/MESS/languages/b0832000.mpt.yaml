  ja: "@a@bミネアは　そっと\nかみを　そろえた。\n@c0@"
"77":
  de: "@aMina@bVielleicht sollte ich ein wenig Make-up auflegen.\n@c1@"
  en: "@aMeena@bPerhaps I too should be applying a little make-up...\n@c1@"
  es: "@aMeena@bPuede que yo también me ponga algo de maquillaje...\n@c1@"
  fr: "@aMina@bPeut-être que je devrais me maquiller un peu, moi aussi...\n@c1@"
  it: "@aMyra@bForse dovrei anche mettere un velo di cipria e un po' di ombretto...\n@c1@"
  ja: "@a@bミネア「わたしも　少し\n\tお化粧してみようかしら……。\n@c1@"
"78":
  de: "@aMina@bSpieglein, Spieglein an der Wand,\nzeig uns den Weg durch dieses Land!\n@c1@"
