  ja: "@a@bブライ「フム　また少し\n\tろうがんが　進んだかのう……。\n@c2@"
"65":
  de: "@a@b... und bemerkt etwas Schmutz. Er wischt ihn sorgfältig fort.\n@c0@"
  en: "@a@b...and notices a smudge.\nHe carefully wipes it away.\n@c0@"
  es: "@a@b... y descubre una mancha.\nSe la limpia con sumo cuidado.\n@c0@"
  fr: "@a@b... et remarque une tache, qu'il enlève soigneusement.\n@c0@"
