  es: "@aTorneko@bVaya, vaya...\n@c2@"
  fr: "@aTorneko@bVoyons, voyons...\n@c2@"
  it: "@aBaldo@bMa te guarda che splendore!\n@c2@"
  ja: "@a@bトルネコ「ふむふむ……。\n@c2@"
"72":
  de: "@aTorneko@bDie Holzmaserung ist von erlesener Schönheit und die Einlegearbeiten sind von hervorragender Qualität...\n@c2@"
