  ja: "@a@bトルネコは　鏡に向かって\nにっこりとほほえんだ。\n@c0@"
"67":
  de: "@aTorneko@bDas Geheimnis für den Verkaufserfolg besteht darin, zu grinsen, bis man platzt.\n@c2@"
