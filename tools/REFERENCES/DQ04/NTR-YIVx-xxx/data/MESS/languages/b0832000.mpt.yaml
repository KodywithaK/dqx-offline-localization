"5":
  de: "@a@b... und hat einen Moment lang das unbehagliche Gefühl, %A120%Xsein%Z%B120%Xihr%Z Spiegelbild lacht über %A120%Xihn%Z%B120%Xsie%Z.\n@c0@"
  en: "@a@b...and gets the uneasy feeling for a moment that %A120%Xhis%Z%B120%Xher%Z reflection is laughing at %A120%Xhim%Z%B120%Xher%Z.\n@c0@"
  es: "@a@b... y, por un momento, tiene el extraño sentimiento de que su reflejo se está burlando de %A120%Xél%Z%B120%Xella%Z.\n@c0@"
  fr: "@a@b... et, pendant une seconde, %A120%Xil%Z%B120%Xelle%Z a la désagréable impression que son reflet se moque %A120%Xde lui%Z%B120%Xd'elle%Z.\n@c0@"
  it: "@a@b... e per un attimo ha la sgradevolissima sensazione\nche il riflesso rida di %A120%Xlui%Z%B120%Xlei%Z.\n@c0@"
  ja: "@a@bいっしゅん　鏡の中の　自分が\nわらったような気がする……。\n@c0@"
"6":
