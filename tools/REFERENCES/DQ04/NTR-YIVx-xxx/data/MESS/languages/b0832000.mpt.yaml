"12":
  de: "@a@b... und erinnert sich daran, wie Elisa mit dem Metamorphose-Zauber %A090%Xseine%Z%B090%Xihre%Z Gestalt annahm.\n@c0@"
  en: "@a@b...and, looking at %A090%Xhis%Z%B090%Xher%Z reflection, is reminded of when Eliza used Morph to turn herself into the likeness of %A090%Xhim%Z%B090%Xher%Z.\n@c0@"
  es: "@a@b... y, contemplando su reflejo, recuerda cuando Elisa utilizó el conjuro Metamorfosis para convertirse en %A090%Xél%Z%B090%Xella%Z.\n@c0@"
  fr: "@a@b... et en regardant son reflet, %A090%Xil%Z%B090%Xelle%Z se souvient de la fois où Élisa a utilisé le sort Morph pour prendre la même apparence %A090%Xque lui%Z%B090%Xqu'elle%Z.\n@c0@"
  it: "@a@b... e, notando il proprio riflesso, non può fare a meno di ricordare di quando Elisa usò Trasphorma per assumere le sue sembianze.\n@c0@"
  ja: "@a@b鏡にうつった　自分の顔を見て\n%a00090は　モシャスをした\nシンシアのことを思い出した……。\n@c0@"
"13":
  de: "@a@b... und sieht, dass %A090%Xihm%Z%B090%Xihr%Z die Haare schon ins Gesicht hängen.\n@c0@"
  en: "@a@b...and notices that %A090%Xhis%Z%B090%Xher%Z fringe is hanging over %A090%Xhis%Z%B090%Xher%Z eyes.\n@c0@"
  es: "@a@b... y se da cuenta de que el flequillo le tapa los ojos.\n@c0@"
  fr: "@a@b... et remarque que sa frange lui tombe devant les yeux.\n@c0@"
  it: "@a@b... e si accorge di avere i capelli un po' troppo lunghi per i suoi gusti.\n@c0@"
  ja: "@a@b前がみが　目に　かかっている。\n@c0@"
"14":
  de: "@a@bLangsam wird's mal wieder Zeit für den Friseur!\n@c0@"
