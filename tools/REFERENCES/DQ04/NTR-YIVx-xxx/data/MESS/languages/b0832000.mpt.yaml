  ja: "@a@bミネア「鏡よ……\n\t私たちの　進む道を\n\tうつしだしたまえ……。\n@c1@"
"79":
  de: "@a@bAber im Spiegel ist nichts zu sehen.\n@c0@"
  en: "@a@bBut nothing appears in the mirror.\n@c0@"
