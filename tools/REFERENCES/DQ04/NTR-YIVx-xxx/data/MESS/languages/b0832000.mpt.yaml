  ja: "@a@bどうやら　ドランは　鏡にうつった\n自分が　同じ動きをするのが\n不思議なようだ。\n@c0@"
"152":
  de: "@aFünkchen@bGr-gruuu grrrruuuuuu!\n@c2@"
