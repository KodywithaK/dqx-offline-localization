  es: "@a@b... y observa que tiene los ojos enrojecidos por la falta de sueño.\n@c0@"
  fr: "@a@b... et remarque que ses yeux sont rougis par le manque de sommeil.\n@c0@"
  it: "@a@b... e nota di avere gli occhi molto arrossati. Eh, sì: ultimamente il nostro eroe sta dormendo poco...\n@c0@"
  ja: "@a@b目が　赤い……。\nねむりが　浅いせいだろうか。\n@c0@"
"19":
  de: "@a@b... und stellt fest, dass seine Augenbrauen unterschiedlich lang gewachsen sind!\n@c0@"
  en: "@a@b...and notices that his eyebrows are\ndifferent lengths!\n@c0@"
  es: "@a@b... ¡y comprueba que tiene las cejas de diferente tamaño!\n@c0@"
  fr: "@a@b... et remarque que ses deux sourcils ne sont pas de la même longueurⓠ\n@c0@"
