  it: "@aMaya@bAccidenti, quanto sono bella! Per fortuna sono anche molto modesta, altrimenti finirei per montarmi la testa...\n@c1@"
  ja: "@a@bマーニャ「うーん！　やっぱり\n\tいつ見ても　あたしって\n\tとびっきりの美人よね～。\n@c1@"
"87":
