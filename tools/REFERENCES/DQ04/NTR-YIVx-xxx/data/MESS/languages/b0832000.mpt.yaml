  ja: "@a@bマーニャ「旅をしてると\n\tお肌の手入れが　けっこう\n\tおろそかになっちゃうのよねぇ。\n@c1@"
"86":
  de: "@aMaya@bOh! Meine außergewöhnliche Schönheit verblüfft selbst mich immer wieder!\n@c1@"
