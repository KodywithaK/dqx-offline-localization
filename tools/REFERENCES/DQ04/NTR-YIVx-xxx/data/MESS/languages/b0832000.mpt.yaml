  ja: "@a@b%a00090は　そろそろ\nかみを切ろうと　思った。\n@c0@"
"15":
  de: "@a@b... und studiert seine Züge lange und sorgfältig.\n@c0@"
  en: "@a@b...and takes a long, hard look at his face.\n@c0@"
  es: "@a@b... y lanza una intensa y prolongada mirada a su rostro.\n@c0@"
  fr: "@a@b... et examine longuement son propre visage.\n@c0@"
  it: "@a@b... e studia attentamente il proprio volto.\n@c0@"
