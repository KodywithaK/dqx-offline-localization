"16":
  de: "@a@bAuf einmal kommt es ihm so vor, als hätte er überhaupt gar keine Ähnlichkeit mit seinen Eltern.\n@c0@"
  en: "@a@bHe suddenly gets the feeling that there's not really any family resemblance between him and his parents.\n@c0@"
  es: "@a@bDe pronto, se da cuenta de que no se parece nada a sus padres.\n@c0@"
