"23":
  de: "@a@b... starrt sich in die Augen und versucht, sich an das Gesicht ihrer Mutter zu erinnern. Aber es gelingt ihr nicht.\n@c0@"
  en: "@a@b...and stares into her eyes, trying to recall her mother's face. But, try as she might, she can't.\n@c0@"
  es: "@a@b... y se mira fijamente a los ojos, intentando recordar el rostro de su madre. Pero por mucho que lo intenta, no lo consigue.\n@c0@"
  fr: "@a@b... et fixe son propre reflet dans les yeux, essayant de se rappeler le visage de sa mère. Mais en vain.\n@c0@"
  it: "@a@b... e si concentra, cercando di ricordare il volto di sua madre. Ma, per quanto si sforzi, non ci riesce...\n@c0@"
  ja: "@a@b%a00090は　自分の顔を見て\n母親の顔を　思い浮かべようとしたが\nダメだった。\n@c0@"
"24":
  de: "@a@b... und sieht davor diverse Make-up-Tiegelchen aufgereiht.\n@c0@"
