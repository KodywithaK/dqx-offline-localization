  it: "@aBaldo@bVoglio regala' alla mi' Beatrice uno specchio di huelli belli. Gli specchi le garbano parecchio, ma parecchio tanto!\n@c2@"
  ja: "@a@bトルネコ「こんど　ネネのために\n\t大きな鏡を　買おうかなあ。\n@c2@"
"75":
  de: "@a@b... und ist hin und weg bei dem Gedanken, wie viel dieser ihm einbringen könnte, wenn er ihn in seinem eigenen Laden verkaufen würde.\n@c0@"
  en: "@a@b...and drifts off into a trance calculating how much profit he could make if he sold it in his very own shop.\n@c0@"
  es: "@a@b... y entra en una especie de trance calculando cuánto podría ganar si lo vendiese en su propia tienda.\n@c0@"
  fr: "@a@b... et commence à calculer frénétiquement combien il pourrait en tirer en le vendant dans son propre magasin.\n@c0@"
  it: "@a@b... e comincia a pensare a quanto potrebbe venderlo nel suo negozio. Anzi, nella ⓕsu' bottegaⓖ...\n@c0@"
  ja: "@a@bそして　自分の店で　扱ったら\nどのくらい　もうかるか　考えた。\n@c0@"
"76":
  de: "@a@b... und beginnt sorgfältig ihr Haar in Ordnung zu bringen.\n@c0@"
  en: "@a@b...and sets about carefully arranging her hair.\n@c0@"
