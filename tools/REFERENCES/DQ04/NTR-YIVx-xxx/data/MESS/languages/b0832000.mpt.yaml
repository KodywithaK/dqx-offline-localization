  ja: "@a@bトルネコ「なかなか　いい仕事を\n\tしてますなあ。\n@c2@"
"74":
  de: "@aTorneko@bIch sollte meiner Tessa einen schönen großen Spiegel mitbringen. Sie posiert doch so gern davor.\n@c2@"
