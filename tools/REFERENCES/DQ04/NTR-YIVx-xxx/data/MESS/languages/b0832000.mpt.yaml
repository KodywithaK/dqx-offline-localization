"0":
  de: "@a@b%0%a00120 schaut aufmerksam in den Spiegel...\n@c0@"
  en: "@a@b%0%a00120 gazes into the mirror...\n@c0@"
  es: "@a@b%0%a00120 mira al espejo...\n@c0@"
  fr: "@a@b%0%a00120 contemple fixement le miroir...\n@c0@"
