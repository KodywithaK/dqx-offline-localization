  it: "@a@bImprovvisamente, si rende conto di non somigliare affatto ai suoi genitori...\n@c0@"
  ja: "@a@bやはり　自分は　両親とは\n似ていない気がしてきた……。\n@c0@"
"17":
  de: "@a@b... und sucht angespannt danach, ob sich irgendwo Pickel zeigen.\n@c0@"
  en: "@a@b...and carefully checks his face for pimples.\n@c0@"
