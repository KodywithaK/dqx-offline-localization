  ja: "@a@bトルネコ「商売のひけつは\n\tまず　笑顔ですからね。\n@c2@"
"68":
  de: "@aTorneko@bUnd das sollte ein Kaufmann vor dem Spiegel so oft wie möglich üben.\n@c2@"
