  fr: "@a@bMais rien n'apparaît dans le miroir.\n@c0@"
  it: "@a@bMa lo specchio non risponde...\n@c0@"
  ja: "@a@bしかし　鏡には\nなにも　うつしだされなかった。\n@c0@"
"80":
  de: "@aMina@bJeder ist überzeugt, dass meine Schwester und ich uns ähneln wie ein Ei dem anderen.\n@c1@"
  en: "@aMeena@bMy sister and I are in appearance like two peas in\na pod.\n@c1@"
  es: "@aMeena@bFísicamente, mi hermana y yo somos como dos gotas\nde agua.\n@c1@"
  fr: "@aMina@bMa sœur et moi, nous nous ressemblons comme deux gouttes d'eau.\n@c1@"
  it: "@aMyra@bA prima vista, mia sorella e io sembriamo molto simili...\n@c1@"
  ja: "@a@bミネア「私と　ねえさんって\n\t外見は　そっくりなんですよね。\n@c1@"
"81":
  de: "@aMina@bAber auf das Äußere kommt es doch gar nicht an ⓚⓛ im Wesen könnten wir nicht unterschiedlicher sein.\n@c1@"
