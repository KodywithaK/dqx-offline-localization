"0":
  de: "@aKönig Kicher@bWillkommen! Euer Name lautet also Alberich von Übermuth? Wohlan denn, Alberich von Übermuth. Ihr habt sicher von Unserem Aufruf gehört?\n@c2@"
  en: "@aKing Larfur@bWelcome! Your name is Tom Foolery, you say?\nVery well, Tom Foolery.\nWe trust that you know of Our appeal?\n@c2@"
  es: "@aRey Jarturo@b¡Os doy la bienvenida! ¿Vuestro nombre es Ben-Irrie, decís? \nMuy bien, Ben-Irrie.\n㈡\nHabéis tenido noticia de nuestro llamamiento, ¿no es así?\n@c2@"
  fr: "@aRoi Larfour@bBienvenueⓠ Vous vous appelez Tom Foolery, c'est bien çaⓡ\n㈡\nTrès bien, Tom Foolery.\nNous imaginons que vous avez pris connaissance de Notre appelⓡ\n@c2@"
  it: "@aRe Zonin@bBenvenuto! Tu sei Jock Erellon, xe vero? Molto bene, Jock Erellon, immagino che tu sia a conoscenza del nostro appello.\n@c2@"
  ja: "@a@b王「よくぞ来た！\n\tほほう　パノンと申すのか。\n\tわしのおふれは知っておろう。\n@c2@"
"1":
  de: "@aKönig Kicher@bDann beginnt und macht Uns lachen!\n@c2@"
  en: "@aKing Larfur@bNow...make Us laugh!\n@c2@"
  es: "@aRey Jarturo@bMuy bien, pues... ¡Hacednos reír!\n@c2@"
  fr: "@aRoi Larfour@bAlors... faites-Nous rireⓠ\n@c2@"
  it: "@aRe Zonin@bE adesso facci ridere! \n@c2@"
  ja: "@a@b王「さあ早く　わしを笑わせてくれい！\n@c2@"
"2":
  de: "@aKönig Kicher@bBitte, lasst Uns nicht warten.\nMan soll Uns zum Lachen bringen!\n@c2@"
  en: "@aKing Larfur@bPray, do not tarry.\nWe must be made to laugh!\n@c2@"
  es: "@aRey Jarturo@bOs ruego que no os demoréis.\n¡Es menester que nos riamos!\n@c2@"
  fr: "@aRoi Larfour@bNous vous prions de ne pas tarder.\nNous voulons rireⓠ\n@c2@"
  it: "@aRe Zonin@bAvanti, dimostra cosa sai fare.\nNoi vogliamo ridere.\n@c2@"
  ja: "@a@b王「どうした　早くせぬか。\n@c2@"
"3":
  de: "@aAlberich von Übermuth@bIch fürchte, ich muss Euch enttäuschen, Eure Majestät. Ich kann Euch nichts Lustiges erzählen.\n@c2@"
  en: "@aTom Foolery@bIⓙm afraid Iⓙll have to disappoint ye, Yer Highness. Iⓙve nuttinⓙ funny I can tell ye.\n@c2@"
  es: "@aBen-Irrie@bMi tiemo que le voy a diecepcionar, Alteza. No tiengo nada diviertido que contarle.\n@c2@"
  fr: "@aTom Foolery@bJe suis désolé, Votre Majesté, mais je n'ai rien de drôle à raconter.\n@c2@"
  it: "@aJock Erellon@bMi spiace, Altezza, ma non ho niente di divertente da raccontarle.\n@c2@"
  ja: "@a@bパノン「お言葉ですが　王さま。\n\t残念ながら　私には王さまを\n\t笑わせることなど　できません。\n@c2@"
"4":
  de: "@aKönig Kicher@b...?\n@c2@"
  en: "@aKing Larfur@b...?\n@c2@"
  es: "@aRey Jarturo@b¿...?\n@c2@"
  fr: "@aRoi Larfour@b............ⓡ\n@c2@"
  it: "@aRe Zonin@b...?! \n@c2@"
  ja: "@a@b王「…………？\n@c2@"
"5":
  de: "@aAlberich von Übermuth@bAber ich bin ja nicht allein unterwegs.\n㈡\nIch bin sicher, meine Begleitung wird ein Lächeln auf Euer Gesicht zaubern, selbst wenn es mir nicht gelingt.\n@c2@"
  en: "@aTom Foolery@bBut I've not been trav'llin' alone.\nI'm sure me friends'll bring a smile to yer face, even if I can't meself.\n@c2@"
  es: "@aBen-Irrie@bPero no he viajado solo.\nEstoy sieguro de que mis amigos le harán sonrieir, aunque yo no pueda hacerlo.\n@c2@"
  fr: "@aTom Foolery@bJe n'ai pas voyagé seul et je suis sûr que ma petite bande vous fera sourire, même si je n'y arrive pas moi-même.\n@c2@"
  it: "@aJock Erellon@bMa non sono venuto da solo al suo cospetto. Sono in compagnia, e chi è con me saprà far tornare il sorriso sul suo volto.\n@c2@"
  ja: "@a@bパノン「ですが　私を連れてきた\n\tこの者たちなら　きっと王さまを\n\t笑わせることができるはず！\n@c2@"
"6":
  de: "@aAlberich von Übermuth@bWenn Ihr %H860%X%A120%Xihm%Z%B120%Xihr%Z%Yihnen%Z also einfach den Zenithiahelm geben könntet, wäre das fabelhaft.\n@c2@"
  en: "@aTom Foolery@bSo if ye could just see yer way to handinⓙ over the Zenithian Helm, thatⓙd be grand.\n@c2@"
  es: "@aBen-Irrie@bAsí que, si pudiese entriegarnos el Yelmo de Zenithia, eso sería estupiendo.\n@c2@"
  fr: "@aTom Foolery@bSi vous pouviez leur confier le Casque zénithien, ce serait magnifique.\n@c2@"
  it: "@aJock Erellon@bLe chiedo umilmente di consegnarci l'Elmo Zenithiano.\n@c2@"
  ja: "@a@bパノン「どうか　この者たちに\n\t天空のかぶとを　お与えください！\n@c2@"
"7":
  de: "@aAlberich von Übermuth@bMeine Freunde wollen damit die Welt retten, und bevor Ihr's Euch verseht, sind alle wieder froh wie der Mops im Paletot!\n@c2@"
  en: "@aTom Foolery@bMe friends'll be off to save the world with it, and before ye know it, evⓙryoneⓙll be happy as Larry again, laughinⓙ anⓙ guffawinⓙ all day long.\n@c2@"
  es: "@aBen-Irrie@bMis amigos si lo llievarán para salvar el mundo y, en menos que canta un gallitoro, todos sieremos felices y comieremos pierdices otra vez.\n@c2@"
  fr: "@aTom Foolery@bMes amis en ont besoin pour sauver le monde et dès qu'ils auront réussi, partout les gens riront à nouveau à gorge déployée.\n@c2@"
  it: "@aJock Erellon@bAbbiamo bisogno di quell'oggetto per salvare il mondo. Se ci riusciremo, le genti di tutti i continenti torneranno a sorridere come e più di prima.\n@c2@"
  ja: "@a@bパノン「この者たちなら　世界を救い\n\t人々が　心から笑える日を\n\t取り戻してくれることでしょう。\n@c2@"
"8":
  de: "@aKönig Kicher@bHmm...\n@c2@"
  en: "@aKing Larfur@bHmm...\n@c2@"
  es: "@aRey Jarturo@bMmm...\n@c2@"
  fr: "@aRoi Larfour@bMmm...\n@c2@"
  it: "@aRe Zonin@bUhm... \n@c2@"
  ja: "@a@b王「うーむ……。\n@c2@"
"9":
  de: "@aKönig Kicher@bIhr redet, als vermögt Ihr Unsere Gedanken zu lesen, guter Mann!\n@c2@"
  en: "@aKing Larfur@bYou speak as one who is able to read Our own mind, good sir!\n@c2@"
  es: "@aRey Jarturo@b¡Habláis como si pudieseis leer nuestros pensamientos, noble caballero!\n@c2@"
  fr: "@aRoi Larfour@bVous parlez comme si vous étiez capable de lire Nos pensées, mon braveⓠ\n@c2@"
  it: "@aRe Zonin@bLe tue parole sono sorprendenti. Ci pare quasi che tu gabbia letto nella nostra mente, signore.\n@c2@"
  ja: "@a@b王「パノンとやら！\n\tよくぞ　わしの心を見抜いた！\n@c2@"
"10":
  de: "@aKönig Kicher@bWir erließen diesen Aufruf ja nur aus dem einzigen Grund, dass wir Unser Volk wieder glücklich sehen wollen.\n@c2@"
  en: "@aKing Larfur@bThe very reason We issued Our appeal was to lift the hearts of Our people.\n@c2@"
  es: "@aRey Jarturo@bPues la razón de nuestro llamamiento fue la de elevar los ánimos de nuestro pueblo.\n@c2@"
  fr: "@aRoi Larfour@bL'unique raison pour laquelle Nous avons lancé cet appel était de redonner du baume au cœur à Nos sujets.\n@c2@"
  it: "@aRe Zonin@bGavemo emesso l'appello proprio per risollevar gli animi del nostro popolo.\n@c2@"
  ja: "@a@b王「わしが　このおふれを出したのも\n\tこの国を　明るくせんがため！\n@c2@"
"11":
  de: "@aKönig Kicher@bWir dachten, das könnte Uns mit Hilfe von Unterhaltungskünstlern gelingen, die wir in Unser Reich berufen.\n@c2@"
  en: "@aKing Larfur@bWe believed We could bring them good cheer by summoning entertainers to Our kingdom.\n@c2@"
  es: "@aRey Jarturo@bCreíamos que podríamos alegrarlos convocando animadores a nuestro reino.\n@c2@"
  fr: "@aRoi Larfour@bNous pensions que Nous pourrions les réconforter en faisant venir des comiques dans Notre royaume.\n@c2@"
  it: "@aRe Zonin@bGavemo ritenuto che, richiamando degli intrattenitori nel nostro regno, saremmo riusciti a riportar il buonumore.\n@c2@"
  ja: "@a@b王「おふれを出し　芸人たちを呼ぶことで\n\t少しでも　この国を\n\t明るくしようと思ったのだが……。\n@c2@"
"12":
  de: "@aKönig Kicher@bDoch bisher war uns wenig Glück dabei beschieden, jene wieder glücklich zu machen, die alle Hoffnung fahren gelassen haben.\n@c2@"
  en: "@aKing Larfur@bBut We have thus far been thwarted in Our attempts to bring happiness to those who have lost hope.\n@c2@"
  es: "@aRey Jarturo@bPero nuestros intentos de llevar el júbilo a nuestros desesperados súbditos han fracasado hasta el día de hoy.\n@c2@"
  fr: "@aRoi Larfour@bMais Nos efforts ont été vains jusqu'à présent.\nNous n'avons pas réussi à rendre le sourire à Nos sujets désespérés.\n@c2@"
  it: "@aRe Zonin@bPurtroppo, finora non siamo riusciti nel nostro nobile intento di ridare la serenità a chi teme per il futuro del mondo.\n@c2@"
  ja: "@a@b王「希望を失った人々の\n\t明るさを取り戻すことはできぬ。\n@c2@"
"13":
  de: "@aKönig Kicher@bDoch jetzt sehen Wir den Weg, den Wir gehen müssen, klar vor Augen. Unsere Hoffnung, Unser Volk wieder glücklich zu sehen, liegt in Eurer Hand!\n@c2@"
  en: "@aKing Larfur@bNow We see clearly the path to take. Our hopes for the happiness of Our people lie in your hands!\n@c2@"
  es: "@aRey Jarturo@bAhora, Nos vemos con claridad el camino a seguir. ¡A vuestras manos encomendamos nuestras esperanzas de felicidad para nuestro pueblo!\n@c2@"
  fr: "@aRoi Larfour@bNous distinguons désormais la voie à suivre.\nNous nous en remettons à vous. Aidez-Nous à rendre Nos sujets heureuxⓠ\n@c2@"
  it: "@aRe Zonin@bOra gavemo ben compreso cosa dobbiamo fare. La speranza che il nostro popolo torni alla serenità e alla felicità xe nelle vostre mani.\n@c2@"
  ja: "@a@b王「あい　わかった！\n\tその希望を　そなたたちにたくそう！\n@c2@"
"14":
  de: "@aKönig Kicher@bHier. Der Zenithiahelm soll Euch gehören.\n@c2@"
  en: "@aKing Larfur@bHere. The Zenithian Helm is now yours.\n@c2@"
  es: "@aRey Jarturo@bAquí tenéis. El Yelmo de Zenithia es vuestro.\n@c2@"
  fr: "@aRoi Larfour@bTenez. Le Casque zénithien est à vous.\n@c2@"
  it: "@aRe Zonin@b%H860%XPrendi%YPrendete%Z. L'Elmo Zenithiano è %H860%Xtuo%Yvostro%Z.\n@c2@"
  ja: "@a@b王「さあ　この天空のかぶとを\n\t受け取るがよい！\n@c2@"
"15":
  de: "@a@b%0%a00180 erhält den Zenithiahelm.\n@c2@"
  en: "@a@b%0%a00180 obtains the Zenithian Helm.\n@c2@"
  es: "@a@b%0%a00180 obtiene el Yelmo de Zenithia.\n@c2@"
  fr: "@a@b%0%a00180 reçoit le Casque zénithien.\n@c2@"
  it: "@a@b%0%a00180 ottiene l'Elmo Zenithiano.\n@c2@"
  ja: "@a@b%a00180は\nてんくうのかぶとを　手に入れた！\n@c2@"
"16":
  de: "@aAlberich von Übermuth@bJa, das ist ja fabelhaft.\nDann habe ich mein Teil wohl getan, was?\n@c2@"
  en: "@aTom Foolery@bWell, thatⓙs grand.\nLooks like Iⓙm all done here then, doesnⓙt it?\n@c2@"
  es: "@aBen-Irrie@bBueno, es estupiendo.\nPariece que ya no tiengo nada más que hacier aquí, ¿no?\n@c2@"
  fr: "@aTom Foolery@bEh bien, c'est parfait.\nOn dirait que j'ai rempli ma mission, nonⓡ\n@c2@"
  it: "@aJock Erellon@bOh, che bello!\nAllora, pare che il mio compito finisca qui.\n@c2@"
  ja: "@a@bパノン「さて！\n\t私の役目も終わったようですね。\n@c2@"
"17":
  de: "@aAlberich von Übermuth@bDann werde ich mal wieder auf Reisen gehen, wenn's recht ist.\n@c2@"
  en: "@aTom Foolery@bI think Iⓙll go back to me travⓙllinⓙ if itⓙs all the same to you.\n@c2@"
  es: "@aBen-Irrie@bCreo que volvieré a mis viajes, si no %H860%Xti%Yos%Z importa.\n@c2@"
  fr: "@aTom Foolery@bJe pense que je vais reprendre la route, si vous n'avez plus besoin de moi.\n@c2@"
  it: "@aJock Erellon@bSe non c'è altro da fare, me ne tornerei alla mia tournée.\n@c2@"
  ja: "@a@bパノン「私は私で　気ままな旅を\n\t続けることにいたしましょう。\n@c2@"
"18":
  de: "@aAlberich von Übermuth@bAlso dann viel Glück, %a00140. Ich hoffe, es fügt sich alles zum Besten für Euch und Eure Freunde. Und immer schön fröhlich bleiben, ja?\n@c2@"
  en: "@aTom Foolery@bBest oⓙ luck now, %a00140.\nI hope it all works out fer you anⓙ yer friends.\nKeep smilinⓙ, eh?\n@c2@"
  es: "@aBen-Irrie@bTi dieseo mucha suerte, %a00140.\nEspiero que todo os salga bien a ti y a tus amigos.\n¡Y no diejéis de sonreír!\n@c2@"
  fr: "@aTom Foolery@bBonne chance, %a00140.\nJ'espère que tout se passera bien pour vous et vos amis. Gardez toujours le sourire, d'accordⓡ\n@c2@"
  it: "@aJock Erellon@bBuona fortuna, %a00140.\nSpero che tu e i tuoi amici riusciate nella vostra impresa. E ricorda che il riso fa buon sangue!\n@c2@"
  ja: "@a@bパノン「さようなら　%a00140。\n\tあなたがたの　かつやくを\n\t期待していますよ。　ではっ！\n@c2@"
"19":
  de: "@a@bAlberich von Übermuth verlässt die Gruppe.\n@c0@"
  en: "@a@bTom Foolery leaves the party.\n@c0@"
  es: "@a@bBen-Irrie deja el grupo.\n@c0@"
  fr: "@a@bTom Foolery quitte l'équipe.\n@c0@"
  it: "@a@bJock Erellon lascia il gruppo.\n@c0@"
  ja: "@a@bパノンが　仲間から去っていった！\n@c0@"
