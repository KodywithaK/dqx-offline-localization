  es: "@aMarquis de Léon@b¡Y %H860%Xsentigrás%Ysentigréis%Z igra y odio pogr la Diosa, pogr habegr cgreado vuestgra despgreciable graza!\n@c2@"
  fr: "@aLord Lionel@bBientôt, vous détesterez votre Goddess de vous avoir créés si faiblesⓠ\n@c2@"
  it: "@aMarchese de Léon@bE %L000%Xsentirete%Ysentirai%Z tutto l'odio e la rabbia che provo per la dea che ha creato una razza così inutile!\n@c2@"
  ja: "@a@bキングレオ「お前たちを　そのような\n\tもろい生き物につくった\n\t神を　うらむがよい！\n@c2@"
