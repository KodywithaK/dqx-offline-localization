"34":
  de: "@aRagnar@bIch suche %A090%Xden erkorenen Helden%Z%B090%Xdie erkorene Heldin%Z schon so lange. Ich kann's kaum erwarten, %A090%Xihn%Z%B090%Xsie%Z kennenzulernen.\n@c3@"
  en: "@aRagnar@bI've been travellin' a long time noo in search o' the chosen %A090%Xhero%Z%B090%Xheroine%Z. I cannae wait tae meet %A090%Xhim%Z%B090%Xher%Z.\n@c3@"
  es: "@aRagnar@bLlevo largo tiempo viajando por los caminos en busca %A090%Xdel héroe elegido%Z%B090%Xde la heroína elegida%Z. Apenas puedo soportar la espera.\n@c3@"
  fr: "@aRagnar@bJ'ai voyagé par monts et par vaux à la recherche de l'%A090%XÉlu%Z%B090%XÉlue%Z. Je suis tellement impatient de %A090%Xle%Z%B090%Xla%Z rencontrer.\n@c3@"
  it: "@aGaliardo@bSono in viaggio da tanto tempo alla ricerca %A090%Xdell'eroe Prescelto%Z%B090%Xdell'eroina Prescelta%Z. Non vedo l'ora d'%A090%Xincontrarlo%Z%B090%Xincontrarla%Z!\n@c3@"
  ja: "@a@bライアン「私は　勇者どのを探して\n\t旅をしてきた。　一刻も早く\n\t勇者どのに　お会いしたいのだ！\n@c3@"
"35":
