  es: "@aMarquis de Léon@bLamento infogrmagr%L000%Xos%Yte%Z de que ya no está aquí.\n¡Quel dommage!\n@c2@"
  fr: "@aLord Lionel@bJ'ai le regret de vous informer qu'il n'est plus ici.\nToo badⓠ\n@c2@"
  it: "@aMarchese de Léon@bJe suis désolé, ma non è più qui.\nQuel dommage!\n@c2@"
  ja: "@a@bキングレオ「あいにくだが\n\tバルザックは　もう　おらんぞ！\n\t残念だったな！　わっはっはっ！\n@c2@"
"50":
  de: "@aMarquis de Léon@bAber Euer Timing, c'est parfait. L'ennui 'at misch schon beina'e umgebracht. Jetzt werde isch Eusch zeigen, wie schwach Ihr Menschen wirklisch seid.\n@c2@"
  en: "@aMarquis de Léon@bBut your timing is perfect. Ze ennui was becoming too much for me. Now I will show to you just 'ow feeble you 'umans really are.\n@c2@"
  es: "@aMarquis de Léon@bPegro %H860%Xllegas%Yllegáis%Z en el momento pgreciso. El abugrimiento me estaba poniendo nervos. Ahogra %H860%Xdeja que te%Ydejad que os%Z demuestgre lo débiles que sois los humanós.\n@c2@"
  fr: "@aLord Lionel@bEn tout cas, vous avez bien choisi votre timing.\nJe commençais à m'ennuyer. Je vais vous montrer combien les humans sont faibles.\n@c2@"
  it: "@aMarchese de Léon@bEn tout cas, %L000%Xarrivate%Yarrivi%Z proprio al momento giusto. Mi stavo annoiando a morte. Ora %L000%Xvi%Yti%Z mostrerò quanto siano deboli gli umani.\n@c2@"
  ja: "@a@bキングレオ「退屈しのぎに\n\tちょうどよいわ！　人間どもの\n\tチカラのなさを　思い知らせてやる！\n@c2@"
"51":
  de: "@aMarquis de Léon@bUnd Ihr werdet Eurer Göttin zürnen und sie 'assen, weil sie eine so wertlose Rasse erschaffen 'at!\n@c2@"
