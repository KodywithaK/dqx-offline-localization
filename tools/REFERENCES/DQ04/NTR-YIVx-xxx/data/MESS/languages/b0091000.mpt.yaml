  fr: "@aRagnar@bIl y a encore une bataille à livrer ici.\nEst-ce que vous pouvez aller chercher %A090%Xle héros%Z%B090%Xl'héroïne%Z le plus vite possibleⓡ\n@c3@"
  it: "@aGaliardo@bC'è ancora una battaglia da combattere.\nCosa %H860%Xaspetti%Yaspettate%Z a portare %A090%Xl'eroe%Z%B090%Xl'eroina%Z da me?\n@c3@"
  ja: "@a@bライアン「まだ　勝負はついておらん！\n\tいそいで　勇者どのを\n\tここに　お連れねがえぬか！？\n@c3@"
"54":
  de: "@aRagnar@bAh, da seid Ihr ja, %a00090!\nIch hab schon auf Euch gewartet!\n@c3@"
  en: "@aRagnar@bOch, ye're here, %a00090!\nI've been waitin' for ye.\n@c3@"
