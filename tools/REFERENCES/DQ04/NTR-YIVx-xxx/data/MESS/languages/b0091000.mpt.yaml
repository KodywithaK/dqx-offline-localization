  es: "@aMarquis de Léon@b¡Oh! Ya %L000%Xos%Yte%Z grecuegrdo de antes. %L000%XVosotgras sois las chicas que viniegron%YTú egres la chica que vino%Z a buscagr a mi esbigro Balzack, ¿vegrdad?\n@c2@"
  fr: "@aLord Lionel@bOhⓠ Je reconnais vous. Vous êtes %L000%Xces girls qui ont%Ycette girl qui a%Z attaqué Dickenz, mon bras droit.\n@c2@"
  it: "@aMarchese de Léon@bOh! Credo che ci siamo già incontrati. %L000%XSiete le demoiselles%YSei la demoiselle%Z che %L000%Xcercavano%Ycercava%Z il mio braccio destro Balzack, non è così?\n@c2@"
  ja: "@a@bキングレオ「ん？　そこの娘！\n\tお前は　たしか　バルザックを\n\tカタキと　やってきた娘だったな。\n@c2@"
"49":
  de: "@aMarquis de Léon@bIsch bedaure, Eusch mitteilen zu müssen, dass er nischt mehr 'ier ist. Quel dommage!\n@c2@"
