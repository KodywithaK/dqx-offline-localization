  ja: "@a@b＊「となりにいる　おっさんは\n\tときどき寝ぼけて　気味の悪いことを\n\t言うんだ。　おかげで　眠れないよ。\n@c2@"
"29":
  de: "@a@b*: 'ier ist einfach alles erlaubt. Nischts ist zu dekadent. Oh là là, isch bin im 'immel!\n@c1@"
