  es: "@aRagnar@bPero la tarea de detener al mal que amenaza a nuestro mundo no ha hecho más que empezar.\n@c3@"
  fr: "@aRagnar@bCe n'était malheureusement que la première étape de la lutte pour arrêter le mal qui menace notre monde.\n@c3@"
  it: "@aGaliardo@bMa quello è stato solo il primo passo per sradicare il male che minaccia il mondo.\n@c3@"
