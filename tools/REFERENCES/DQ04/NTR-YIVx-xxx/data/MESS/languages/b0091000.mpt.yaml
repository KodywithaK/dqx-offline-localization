  it: "@a@b*: Haute cuisine e vino pregiato... Ah, la joie de vivre, oui. Questo è il paradiso in Terra!\n@c1@"
  ja: "@a@b＊「おいしい　ごちそうにお酒。\n\t飲んで歌って遊んで……。\n\tここは　天国のようなところね。\n@c1@"
"20":
  de: "@a@b*: Bei jedem neuen 'errscher ändert sisch 'ier wieder alles. Die Sprasche, der Akzent. 'ier kann man sisch nie sischer fühlen.\n@c2@"
  en: "@a@b*: Each time zere is a new ruler ⓙere, everything changes. Ze language, ze accent. I cannot feel safe ⓙere.\n@c2@"
  es: "@a@b*: Cada vez que entgra un gobegrnante nuevo lo cambia todó. El idioma, el acentó... No hay manegra de sentigrse segugro aquí.\n@c2@"
  fr: "@a@b*ⓢ Chaque fois qu'on change de souverain, tout le reste change aussiⓢ la langue, l'accent...\nJe perds a little bit les pédales, moi.\n@c2@"
