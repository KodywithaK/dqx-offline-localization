  ja: "@a@b＊「はっ！\n\tわたしは　いったい今まで\n\tなにを　していたのだろうか……？\n@c2@"
"63":
  de: "@aRagnar@bDas war unglaublich, %a00090. Ihr seid wirklich %A090%Xein wahrer Held%Z%B090%Xeine wahre Heldin%Z, was?\n@c3@"
  en: "@aRagnar@bThat was incredible, %a00090.\nYe really are a %A090%Xhero%Z%B090%Xheroine%Z, eh?\n@c3@"
