"57":
  de: "@aMarquis de Léon@bNon! Dies ist... Es ist... C'est impossible! Unmöglisch! Was 'at das zu bedeuten?!\n@c3@"
  en: "@aMarquis de Léon@bNon! Zis is... Zis is... Zis is not possible!\nWhat is ze meaning of zis!?\n@c3@"
  es: "@aMarquis de Léon@b¡Non! Esto... Esto... ¡C'est pas possible!\n¡¿Qué significa esto?!\n@c3@"
  fr: "@aLord Lionel@bNonⓠ It is... It is... It is... pas possibleⓠ\nQu'est-ce que ça veut direⓡ\n@c3@"
  it: "@aMarchese de Léon@bNon! Mais c'est... C'est... C'est pas possible!\nCosa vuol dire tutto questo?\n@c3@"
  ja: "@a@bキングレオ「こ…　この　わたしが\n\tやられるとは……。\n\tお前たちは　いったい何者だ……。\n@c3@"
"58":
  de: "@aMarquis de Léon@bIhr seid sischer... Oui! Isch war 'ochnäsisch. Ihr seid %A090%Xder 'eld, der%Z%B090%Xdie 'eldin, die%Z angeblisch den 'errn der Unterwelt besiegen wird.\n@c3@"
  en: "@aMarquis de Léon@bYou must be... Oui! I 'ave been blasé.\nYou are ze %A090%X'ero%Z%B090%X'eroine%Z zey say will defeat ze Lord of ze Underworld.\n@c3@"
  es: "@aMarquis de Léon@bTú debes de segr... ¡Oui! He sido descuidado.\nTú egres %A090%Xel hégroe%Z%B090%Xla hegroína%Z que, según dicen, degrotagrá al Señogr del Infgramundo.\n@c3@"
  fr: "@aLord Lionel@bVous devez être... Of courseⓠ Quel stupid je faisⓠ\nVous êtes %A090%Xle héros%Z%B090%Xl'héroïne%Z qui doit vaincre le Seigneur des Enfers.\n@c3@"
  it: "@aMarchese de Léon@bDevi essere... Oui! Quel imbécile sono stato!\nTu sei %A090%Xl'eroe della leggenda, colui%Z%B090%Xl'eroina della leggenda, colei%Z che potrebbe sconfiggere il Signore degli Inferi!\n@c3@"
  ja: "@a@bキングレオ「もしや　地獄の帝王さまを\n\t滅ぼすといわれる　勇者……。\n@c3@"
"59":
  de: "@aMarquis de Léon@bHmpf! %A090%XEin eschter 'eld%Z%B090%XEine eschte 'eldin%Z 'ätte Psaro den Metzler schon längst ⓚⓛ Uuuuurgh!\n@c3@"
  en: "@aMarquis de Léon@bHmph! A true...%A090%X'ero%Z%B090%X'eroine%Z would already 'ave...disposed of Psaro zeⓚⓛ Uuuurgh!\n@c3@"
  es: "@aMarquis de Léon@b¡Umpf! %A090%XUn vegrdadegro hégroe%Z%B090%XUna vegrdadegra hegroína%Z ya se habgría encagrgado de Psagro el... ¡Aaaaggg!\n@c3@"
  fr: "@aLord Lionel@bMmpfⓠ %A090%XUn véritable... héros%Z%B090%XUne véritable... héroïne%Z aurait déjà... tué Psaro l'Ext... aaahⓠ\n@c3@"
  it: "@aMarchese de Léon@bPfui! %A090%XUn vero héros%Z%B090%XUna vera héroine%Z si sarebbe già... %A090%Xsbarazzato%Z%B090%Xsbarazzata%Z di Psaro il... Aaaaargh!\n@c3@"
  ja: "@a@bキングレオ「ばかな……。\n\t勇者なら　デスピサロさまが\n\tすでに殺した…はず……　ぐふっ！\n@c3@"
"60":
  de: "@aPrinz Leon@bWas zur ⓚⓛ Was geht denn hier vor? Und wo bin ich? Wie merkwürdig ⓚⓛ mir ist, als hätte ich gerade in irgendeiner fremden Sprache geredet.\n@c3@"
  en: "@aPrince Leon@bWhat onⓚⓛ What's going on? And where am I?\nI have the strangest feeling that I was talking in some foreign language just now...\n@c3@"
  es: "@aPríncipe León@b¡¿Qué... Qué demonios está pasando?! ¿Y dónde estoy? Tengo la extraña sensación de que hasta hace un momento hablaba en un idioma extranjero...\n@c3@"
  fr: "@aPrince Lionel@bQuoiⓡ Qu'est-ce qui se passeⓡ Où suis-jeⓡ\nJe ne sais pas pourquoi, mais j'ai l'impression que je parlais une langue étrangère il y a deux secondes...\n@c3@"
  it: "@aPrincipe Leon@bMa cosa... Cosa succede? Dove mi trovo?\nE perché ho la sensazione che fino a poco fa stessi parlando in una lingua straniera...?\n@c3@"
  ja: "@a@bキングレオ「……はっ！\n\tここは　どこだ……？　わたしは\n\t今まで　なにをしていたのだ……。\n@c3@"
"61":
  de: "@aPrinz Leon@bMir ist, als hätte ich gerade einen ganz merkwürdigen Traum gehabt. Ich weiß nicht mehr, was ich getan habe...\n@c2@"
  en: "@aPrince Leon@bI feel like I've just woken up from the strangest dream. I can't remember what I've been doing...\n@c2@"
  es: "@aPríncipe León@bMe siento como si hubiese despertado de un extraño sueño. No recuerdo lo que estaba haciendo...\n@c2@"
  fr: "@aPrince Lionel@bJ'ai l'impression de me réveiller après avoir fait le plus étrange des rêves.\nJe ne me rappelle plus ce qui s'est passé...\n@c2@"
  it: "@aPrincipe Leon@bÈ come se mi fossi risvegliato da un sogno stranissimo. Solo che non ricordo cosa stessi facendo... \n@c2@"
  ja: "@a@bキングレオ「思い出せん……。\n\tわたしは　いったい\n\t今まで　なにをしていたのだ……。\n@c2@"
"62":
  de: "@a@b*: Was geht hier vor?\nIch kann mich an nichts erinnern...\n@c2@"
  en: "@a@b*: What's going on?\nI can't remember anything I've been doing...\n@c2@"
