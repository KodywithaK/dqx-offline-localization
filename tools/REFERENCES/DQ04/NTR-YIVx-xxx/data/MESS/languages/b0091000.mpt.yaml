  ja: "@a@bライアン「おお！　勇者どの！\n\tお待ちしておりました！\n@c3@"
"55":
  de: "@aRagnar@bWas bisher geschehen ist, ist unwichtig. Der wahre Kampf beginnt jetzt!\n@c3@"
  en: "@aRagnar@bNever mind aboot whit's happened afore.\nThe real fight starts noo!\n@c3@"
  es: "@aRagnar@bLo sucedido hasta ahora no son más que pamplinas.\n¡Ahora empieza la verdadera batalla!\n@c3@"
  fr: "@aRagnar@bOubliez tout ce que vous avez pu vivre avant.\nLe véritable combat commence maintenantⓠ\n@c3@"
  it: "@aGaliardo@bNon pensare a ciò che è successo prima.\nLa vera battaglia inizia adesso!\n@c3@"
  ja: "@a@bライアン「不覚をとりましたな！\n\tしかし　まだまだ\n\t勝負は　これからですぞ！\n@c3@"
