  it: "@a@b*: Pardon? Che tipo di magia?\nEh! Eh! Eh! Désolé, non posso rivelartelo, %A090%Xamico mio%Z%B090%Xamica mia%Z. Jamais!\n@c2@"
  ja: "@a@b＊「なに？　なんの魔法かじゃと？\n\tそれは　教えるわけにはいかんな。\n\tひっひっひっ……。\n@c2@"
"19":
  de: "@a@b*: Haute cuisine und gute Weine... Ah, la joie de vivre. 'ier ist das Paradis auf Erden!\n@c1@"
  en: "@a@b*: Haute cuisine and fine wine...\nAh, ze joie de vivre.\nIt is paradise on earth ⓙere!\n@c1@"
  es: "@a@b*: Haute cuisine y buen vino... ¡Ah!, la alegría de vivigr. ¡El pagraíso en la tiegrra!\n@c1@"
