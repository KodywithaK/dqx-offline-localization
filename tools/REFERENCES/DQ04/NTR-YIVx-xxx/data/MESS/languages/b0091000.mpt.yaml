  fr: "@aRagnar@bSapristiⓠ Cette allure, ces vêtements...\nC'est ainsi que je vous imaginais.\nLa légende disait vraiⓠ\n@c3@"
  it: "@aGaliardo@bPerbacco! Il tuo viso, i tuoi abiti... Sei esattamente come t'immaginavo. La leggenda aveva ragione!\n@c3@"
  ja: "@a@bライアン「むっ！？　その姿\n\tその　いでたち……。　まちがいない！\n\tお告げ所の　お告げのとおりだ！\n@c3@"
"36":
  de: "@aRagnar@bDann hat Ragnar Rauhbein es ja endlich geschafft, %A090%Xden erkorenen Helden%Z%B090%Xdie erkorene Heldin%Z zu finden.\n@c3@"
