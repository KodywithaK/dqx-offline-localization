"12":
  de: "@a@b*: Isch 'abe einen Berischt über den Bau einer neuen Stadt in der Wüste bei Maestral er'alten.\n@c2@"
  en: "@a@b*: I ⓙave ⓙad a report vis-à-vis ze construction of a new town in ze desert in Maestral.\n@c2@"
  es: "@a@b*: Me han infogrmado vis-à-vis de la constgrucción de una ciudad nueva en el desiegrto, en Mistgral.\n@c2@"
  fr: "@a@b*ⓢ J'ai reçu un report mentionnant la construction d'une nouvelle city dans le désert du Mistral.\n@c2@"
  it: "@a@b*: Sono stato informato della costruzione di un nouveau village nel deserto di Maystrale.\n@c2@"
  ja: "@a@b＊「なんでも　サントハイムの国の砂漠に\n\t新しい町が　できたそうじゃな。\n@c2@"
"13":
  de: "@a@b*: Was für Dümmköpf würden denn in solschen Zeiten eine neue Stadt ⓚⓛ Mon Dieu! Warum spreche isch darüber mit %H860%X%A120%Xeinem Wildfremden%Z%B120%Xeiner Wildfremden%Z%YWildfremden%Z?!\n@c2@"
  en: "@a@b*: What imbéciles would create a new town at a time likeⓚⓛ Mon Dieu! Why am I talking wiz %H860%Xa total stranger%Yze total strangers%Z!?\n@c2@"
  es: "@a@b*: ¿Qué %H860%Ximbécil quegría%Yimbéciles quegrían%Z cgreagr un ciudad nueva en un momento como...? ¡Mon Dieu! ¡¿Pegro qué hago hablando con %H860%X%A120%Xun pegrfecto desconocido%Z%B120%Xuna pegrfecta desconocida%Z%Y%R000%Xunas pegrfectas desconocidas%Yunos pergrfectos desconocidos%Z%Z?!\n@c2@"
  fr: "@a@b*ⓢ Quels idiots construiraient une nouvelle city dans un moment comme... My Godⓠ Pourquoi je parle avec %H860%X%A120%Xun total stranger%Z%B120%Xune total stranger%Z%Ydes total strangers%Z, moiⓠⓑ\n@c2@"
  it: "@a@b*: Bisogna essere imbéciles per creare un nuovo villaggio in tempi simili. Mon Dieu! Ma perché mai sto parlando con %H860%Xuna persona che non conosco%Ydegli sconosciuti%Z?!\n@c2@"
  ja: "@a@b＊「こんなときに　新しい町など\n\tいったい　だれが……っと\n\tお前さんたちは　だれじゃ！\n@c2@"
"14":
  de: "@a@b*: Das 'ier ist mein Reisch ⓚⓛ la chambre de l'administrateur du château! Geht sofort, sonst lasse isch Eusch ins Gefängnis werfen!\n@c2@"
  en: "@a@b*: Zis is ze room of moi, ze chancellor du château! Leave, or I will ⓙave you thrown in jail!\n@c2@"
  es: "@a@b*: ¡Esta es la habitación del cancillegr del château, que c'est moi! ¡Fuegra de aquí o hagré que %H860%Xte%Yos%Z metan en la cágrcel!\n@c2@"
  fr: "@a@b*ⓢ Je suis le chancelier du castel et ce sont mes appartementsⓠ Partez ou je vous envoie en prisonⓠ\n@c2@"
  it: "@a@b*: Questa è la mia chambre, e io sono il Cancelliere dello château! %H860%XVai%YAndate%Z via subito o %H860%Xti%Yvi%Z farò sbattere en prison!\n@c2@"
  ja: "@a@b＊「ここは　大臣である　わしの部屋！\n\t早々に立ち去らんと\n\t牢屋に　入れてしまうぞ！！\n@c2@"
"15":
