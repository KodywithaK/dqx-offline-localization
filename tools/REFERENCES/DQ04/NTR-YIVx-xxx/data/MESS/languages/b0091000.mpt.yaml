  fr: "@a@b*ⓢ Je suis Lord Lionel. Psaro l'Exterminateur m'a appointé souverain de cette contrée.\n@c2@"
  it: "@a@b*: Je suis le Marquis de Léon. Psaro il Massacratore mi ha nominato governatore di questa terra.\n@c2@"
  ja: "@a@b＊「わたしの名は　キングレオ。\n\tデスピサロさまに代わり\n\tこの国を　支配するものだ。\n@c2@"
"48":
  de: "@aMarquis de Léon@bOh! Isch se'e, wir 'aben einander bereits kennengelernt. Ihr seid %L000%Xdie Mädschen, die%Ydas Mädschen, das%Z es auf meinen Schergen Balzack abgesehen %L000%X'atten%Y'atte%Z, non?\n@c2@"
