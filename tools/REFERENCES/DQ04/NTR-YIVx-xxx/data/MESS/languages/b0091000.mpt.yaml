"0":
  de: "@a@b*: Pfütz Euch. Ich heiße Medi und bin ein Glibbertrotter wie Ihr.\n@c2@"
  en: "@a@b*: Helloo. My nameⓙs Healie.\nIⓙm a glob-trotter, too.\n@c2@"
  es: "@a@b*: Holaaa. Me llamo Curi.\nTambién soy un trotamundos.\n@c2@"
  fr: "@a@b*ⓢ Salut. Je m'appelle Doc.\nMoi aussi, je parcours le monde.\n@c2@"
  it: "@a@b*: Saaalve. Mi chiamo Healie.\nAnch'io sono un va-glob-ondo.\n@c2@"
  ja: "@a@b＊「ボクは　ホイミンという旅の者です。\n@c2@"
"1":
  de: "@aMedi@bKönnt Ihr nicht was tun, um meinem Freund Ragnar zu helfen? Die haben ihn in die Burg verschlebbert.\n@c2@"
  en: "@aHealie@bCanⓙt you do something to help my friend, Ragnar? Theyⓙve taken him away inside the castle.\n@c2@"
  es: "@aCuri@b¿%H860%XPuedes%YPodéis%Z hacer algo para ayudar a mi amigo Ragnar? Lo han atrapado y se lo han llevado al interior del castillo.\n@c2@"
  fr: "@aDoc@bPourriez-vous faire quelque chose pour aider mon ami Ragnarⓡ Ils l'ont emmené à l'intérieur du château.\n@c2@"
  it: "@aHealie@bNon %H860%Xpuoi%Ypotete%Z fare nulla per aiutare il mio amico Galiardo? L'hanno inglobato nel castello.\n@c2@"
  ja: "@a@bホイミン「どうか\n\tお城の中に　連れてゆかれた\n\tライアンさまを　お助けください！\n@c2@"
"2":
  de: "@aMedi@bWenn ich nur den Zauberschlüssel hätte, dann ginge alles wie geschmiert ⓚⓛ ich könnte hineinschlürpfen und ihn retten.\n@c2@"
  en: "@aHealie@bIf only I had that magic key, I could squeeeeze my way inside and save him.\n@c2@"
  es: "@aCuri@bSi tuviese esa llave mágica podría colarme y salvarlo.\n@c2@"
  fr: "@aDoc@bSi seulement j'avais cette clef magique... je pourrais me gliiiisser à l'intérieur et le sauver.\n@c2@"
  it: "@aHealie@bSe solo avessi la Chiave magica, potrei intrufolaaarmi lì dentro e slimevarlo.\n@c2@"
  ja: "@a@bホイミン「魔法のカギがあれば\n\t中に　忍びこめるはずです。\n@c2@"
"3":
  de: "@a@b*: Das ist der beau Palais de Léon!\n@c2@"
  en: "@a@b*: Zis is ze great Palais de Léon!\n@c2@"
  es: "@a@b*: ¡Este es le grand Palais de Léon!\n@c2@"
  fr: "@a@b*ⓢ C'est le magnificent palace de Lord Lionelⓠ\n@c2@"
  it: "@a@b*: Voilà, il grande Palazzo de Léon!\n@c2@"
  ja: "@a@b＊「ここは　偉大なるお城\n\tキングレオだ！\n@c2@"
"4":
  de: "@a@b*: Wir 'aben gerade einen reisenden Ritter aufgegriffen, der sisch in die Burg schleischen wollte.\n@c2@"
  en: "@a@b*: We ⓙave just caught a wandering knight trying to sneak inside ze castle.\n@c2@"
  es: "@a@b*: Acabamós de pillagr a un chevalier andante que intentaba colagrse en le castillo.\n@c2@"
  fr: "@a@b*ⓢ Nous venons juste d'attraper un chevalier errant qui essayait de rentrer à l'intérieur du castel.\n@c2@"
  it: "@a@b*: Abbiamo appena acciuffato uno chevalier che tentava di penetrare nello château.\n@c2@"
  ja: "@a@b＊「今しがた　城に忍び込もうとした\n\tあやしげな旅の戦士を\n\t捕まえたところだ。\n@c2@"
"5":
  de: "@a@b*: Le Marquis wird ihn persönlisch ver'ören. Sobald Monsieur le Marquis eine Entscheidung getroffen 'at, ist sein Schicksal besiegelt.\n@c2@"
  en: "@a@b*: Ze Marquis is going to interrogate ⓙim personally. Once ze Marquis ⓙas sealed ⓙis fate, zere is nothing anyone can do.\n@c2@"
  es: "@a@b*: El Marquis le integrogagrá pegrsonalmente. Cuando el Marquis haya decidido su destino, su suegrte estagrá echada.\n@c2@"
  fr: "@a@b*ⓢ The Lord va l'interroger personnellement. Une fois que the Lord aura décidé de son sort, personne ne pourra plus rien pour lui.\n@c2@"
  it: "@a@b*: Le Marquis lo interrogherà di persona. Una volta che avrà deciso il suo destino, più nessuno potrà farci nulla. Rien de rien!\n@c2@"
  ja: "@a@b＊「わが王が直々に取り調べるらしい。\n\t王の審判を受け　助かったものは\n\tおらぬ。\n@c2@"
"6":
  de: "@a@b*: Er 'at nischt mehr lange zu leben.\n@c2@"
  en: "@a@b*: ⓙE will not be long for zis life now...\n@c2@"
  es: "@a@b*: No le queda mucho de vie...\n@c2@"
  fr: "@a@b*ⓢ Il n'en a plus pour long, maintenant...\n@c2@"
  it: "@a@b*: Poverascio, non gli rimane molto da vivere...\n@c2@"
  ja: "@a@b＊「おそらく　ヤツも　それまでの命！\n\t気の毒にな……。\n@c2@"
"7":
  de: "@a@b*: Das ist très curieux... Manschmal ist mir, als 'örte isch Stimmen von unten.\n@c3@"
  en: "@a@b*: Zis is a matter most strange...\nI feel like I can ⓙear voices coming from under my feet.\n@c3@"
  es: "@a@b*: Este asunto es grealmente extgraño...\nPagrece como si escuchagra voces que pgrovienen de debajo de mis pies.\n@c3@"
  fr: "@a@b*ⓢ C'est vraiment bizarre... \nC'est comme si j'entendais des voix qui viendraient de sous mes pieds.\n@c3@"
  it: "@a@b*: C'est bizzarre...\nMi pare quasi di sentire delle voci sotto i miei piedi.\n@c3@"
  ja: "@a@b＊「う～む　不思議だ……。\n\tどうも　足もとから　人の声が\n\t聞こえてくる気がするのだ。\n@c3@"
"8":
  de: "@a@b*: Angeblisch befindet sisch eine ganz neue Stadt in der Wüste in der Nä'e von Samokswa im Norden.\n@c2@"
  en: "@a@b*: Zey say zere is a new town set up in ze desert near Zamoksva to ze north.\n@c2@"
  es: "@a@b*: Dicen que se ha establecido una ciudad nueva en el desiegrto, cegrca de Zamoksva, al nogrte.\n@c2@"
  fr: "@a@b*ⓢ Il paraît qu'une nouvelle city a été construite dans le désert au nord, près de Zamoksva.\n@c2@"
  it: "@a@b*: A quanto pare, c'è un nouveau village nel deserto à côté di Zamoskva, a nord.\n@c2@"
  ja: "@a@b＊「ここより　はるか北\n\tサントハイムの国の　砂漠地帯に\n\t新しい町が　できたそうなのだ。\n@c2@"
"9":
  de: "@a@b*: Isch dachte, isch könnte sie von 'ier aus sehen, aber quel dommage, es ist zu weit weg.\n@c2@"
  en: "@a@b*: I thought maybe I could see it from ⓙere, but, quel dommage, it is too far away.\n@c2@"
  es: "@a@b*: Pensé que se podgría vegr desde aquí pegro, quel dommage, está demasiado lejos.\n@c2@"
  fr: "@a@b*ⓢ Je disais à moi-même que je pourrais peut-être la voir from ici. Mais elle est trop loin apparemment.\n@c2@"
  it: "@a@b*: Pensavo che magari avrei potuto vederlo da qui, ma è troppo lontano. Quel dommage!\n@c2@"
  ja: "@a@b＊「ここから　見えるかと思ったが\n\t残念ながら　サントハイムは\n\tさすがに　遠すぎたようだな。\n@c2@"
"10":
  de: "@a@b%0%a00120 prüft den Boden zu %A120%Xseinen%Z%B120%Xihren%Z Füßen.\n@c0@"
  en: "@a@b%0%a00120 examines the ground at %A120%Xhis%Z%B120%Xher%Z feet.\n@c0@"
  es: "@a@b%0%a00120 examina el suelo alrededor de sus pies.\n@c0@"
