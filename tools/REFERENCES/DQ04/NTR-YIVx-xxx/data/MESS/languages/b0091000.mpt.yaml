  ja: "@a@bライアン「勇者どの！　これで戦いが\n\t終わったわけでは　ござらぬ！\n@c3@"
"66":
  de: "@aRagnar@bIch werde mich Euch anschließen, um die Welt vor der Zerstörung zu bewahren. Das ist das Mindeste, was ich tun kann, %A090%XJunge%Z%B090%XMädel%Z.\n@c3@"
  en: "@aRagnar@bI'm gaein' tae join up wi' ye tae save the world from bein' destroyed. It's the least I can do, %A090%Xladdie%Z%B090%Xlassie%Z.\n@c3@"
  es: "@aRagnar@bVoy a unirme a usted para evitar la destrucción del mundo. Es lo menos que puedo hacer, %A090%Xjoven caballero%Z%B090%Xjoven dama%Z.\n@c3@"
  fr: "@aRagnar@bJe viens avec vous pour empêcher que le monde soit détruit. C'est le minimum que je puisse faire, mon ami%A090%X%Z%B090%Xe%Z.\n@c3@"
  it: "@aGaliardo@bMi unirò a te, e insieme cercheremo di impedire che il mondo sia distrutto, %A090%Xamico mio%Z%B090%Xamica mia%Z. Questo è il minimo che io possa fare!\n@c3@"
  ja: "@a@bライアン「世界を破滅から救うため\n\tこのライアンめも　勇者どのの\n\tおちからに　なりますぞ！\n@c3@"
"67":
