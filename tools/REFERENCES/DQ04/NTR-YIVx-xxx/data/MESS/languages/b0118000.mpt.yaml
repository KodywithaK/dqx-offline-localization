"0":
  de: "@a@b*: Willkommen in Rosenbühl, der Heimat der Zwerge. Hier lässt es sich wahrlich gut leben.\n@c2@"
  en: "@a@b*: Welcome to Rosehill, home of the dwarfs.\nAnd a fine place to live it is, too!\n@c2@"
  es: "@a@b*: %H860%X%A120%XBienvenido%Z%B120%XBienvenida%Z%Y%R000%XBienvenidas%YBienvenidos%Z%Z a Rosavilla, país de los enanos.\n¡Y un lugar espléndido para vivir!\n@c2@"
  fr: "@a@b*ⓢ Bienvenue à Rosecolline, le pays des nains.\nEt un endroit agréable à vivre, qui plus estⓠ\n@c2@"
  it: "@a@b*: Ehilà! Questa è Col Rosato, la terra dei nani! Qui si vive alla... grande! Capita la battuta? Eh! Eh! Eh!\n@c2@"
  ja: "@a@b＊「ここは　ロザリーヒル。\n\tわしら　ホビット族が　住む村だよ。\n@c2@"
"1":
  de: "@a@b*: Es heißt, die Rubintränen einer Elfe würden ihre Träume und Wünsche beinhalten.\n@c1@"
  en: "@a@b*: They say that the ruby tears from an elf's eyes are full of that elf's desires.\n@c1@"
  es: "@a@b*: Dicen que las lágrimas de rubí de los ojos de un elfo contienen los deseos de ese elfo.\n@c1@"
  fr: "@a@b*ⓢ Il paraît qu'une elfe pleure des larmes de rubis qui renferment tous ses désirs.\n@c1@"
  it: "@a@b*: Si dice che le Lacrime di rubino che scendono dagli occhi di una certa elfa contengano i suoi desideri.\n@c1@"
  ja: "@a@b＊「エルフの流す　ルビーの涙には\n\t涙を流したエルフの　強い願いが\n\t込められると　言われています。\n@c1@"
"2":
  de: "@a@b*: Darum haben es Menschen auch so schwer, diese Rubine zu ergattern. Weil die Elfe das nicht will.\n@c1@"
  en: "@a@b*: That must be why humans can never get their hands on the rubies. Because the elf doesn't want them to.\n@c1@"
  es: "@a@b*: Será por eso que los humanos nunca pueden echarle mano a los rubíes. Porque el elfo no quiere.\n@c1@"
  fr: "@a@b*ⓢ C'est sans doute pour ça que les humains n'arrivent pas à mettre la main dessus.\nL'elfe doit bien les protéger.\n@c1@"
  it: "@a@b*: Ecco perché gli esseri umani non possono prendere i rubini... Perché l'elfa non vuole che ci riescano!\n@c1@"
  ja: "@a@b＊「そのせいでしょうか。　人間たちには\n\tルビーの涙を　手にすることすら\n\tかなわないのです。\n@c1@"
"3":
  de: "@a@b*: Ich lüge nicht! Das ist die Wahrheit!\n@c1@"
  en: "@a@b*: I'm not lying!\nIt's true!\n@c1@"
  es: "@a@b*: ¡No miento! ¡Es cierto!\n@c1@"
  fr: "@a@b*ⓢ Je mens pasⓠ\nC'est vraiⓠ\n@c1@"
  it: "@a@b*: Non sto raccontando frottole!\nÈ la verità!\n@c1@"
  ja: "@a@b＊「うそじゃないよ！\n\tほんとだよ！\n@c1@"
"4":
  de: "@a@b*: Die Menschen, die hier waren, haben das Elfenmädchen aus dem Turm mitgenommen!\n@c1@"
  en: "@a@b*: The humans who came here took the elf girl in the tower away somewhere!\n@c1@"
  es: "@a@b*: Los humanos que vinieron se llevaron a algún otro lugar a la elfa de la torre.\n@c1@"
  fr: "@a@b*ⓢ Les humains qui sont venus ici ont emmené la petite elfe de la tourⓠ\n@c1@"
  it: "@a@b*: Gli uomini che sono venuti qui hanno preso l'elfa dalla torre e l'hanno portata via!\n@c1@"
  ja: "@a@b＊「この村に来てた人間が\n\t塔の中の　エルフのお姉ちゃんを\n\t連れていっちゃったんだよ！\n@c1@"
"5":
  de: "@a@b*: Uwaaahhh! Uwaaahhh! Die aaarme Rosi! Uwaaahhh!\n@c2@"
  en: "@a@b*: Uwaaargh! Uwaaargh!\nPooaaargh Rose! Uwaaargh!\n@c2@"
  es: "@a@b*: ¡Aaaargh! ¡Aaaargh!\n¡Pobreeergh Rosaaargh! ¡Aaaargh!\n@c2@"
  fr: "@a@b*ⓢ Waaarghⓠ Waaarghⓠ\nYéwaaarghⓠ Waaarghⓠ\n@c2@"
  it: "@a@b*: Uwaaargh! Uwaaargh!\nAaargh... Rosa! Uwaaargh!\n@c2@"
  ja: "@a@b＊「うおーん　うおーん。\n\tかわいそうな　ロザリー。\n@c2@"
"6":
  de: "@a@b*: Sie kam hierher, um sich vor den Menschen zu verstecken, aber sie haben sie gefunden. Uwaaahhh!\n@c2@"
  en: "@a@b*: She came here to hide from the humans, but they found her again. Uwaaargh!\n@c2@"
  es: "@a@b*: Ella vino aquí para ocultarse de los humanos, pero la volvieron a encontrar. ¡Aaaargh!\n@c2@"
  fr: "@a@b*ⓢ Elle était venue ici pour leur échwwwapper, mais les humains l'ont quand même retrouvée.\nWaaarghⓠ\n@c2@"
  it: "@a@b*: Era venutargh qui per nascondersi dagli umani, ma loro l'hanno ritrovatargh. Waaargh!\n@c2@"
  ja: "@a@b＊「せっかく　この村で\n\tかくれていたのに　また人間たちに\n\tつかまってしまうなんてー。\n@c2@"
"7":
  de: "@a@b*: Es war einmal ein junges Elfenmädchen. Ihr Name war Rosi.\n@c2@"
  en: "@a@b*: There was a young elf girl here called Rose.\n@c2@"
  es: "@a@b*: Había una joven elfa aquí llamada Rosa.\n@c2@"
  fr: "@a@b*ⓢ Autrefois, une jeune elfe habitait ici.\nElle s'appelait Rose.\n@c2@"
  it: "@a@b*: Un tempo, qui viveva una giovane elfa di nome Rosa.\n@c2@"
  ja: "@a@b＊「この村には　ロザリーという\n\tエルフが住んでおった。\n@c2@"
"8":
  de: "@a@b*: Sie war etwas ganz Besonderes. Wenn sie weinte, verwandelten sich ihre Tränen in Rubine.\n@c2@"
  en: "@a@b*: She was very special.\nWhen she cried, her tears turned into rubies.\n@c2@"
  es: "@a@b*: Era muy especial.\nCuando lloraba, sus lágrimas se convertían en rubíes.\n@c2@"
  fr: "@a@b*ⓢ Elle avait quelque chose de très particulier.\nQuand elle pleurait, ses larmes se transformaient en rubis.\n@c2@"
  it: "@a@b*: Era una creatura davvero speciale.\nQuando piangeva, le sue lacrime si trasformavano in rubini.\n@c2@"
  ja: "@a@b＊「エルフのロザリーは\n\t流す涙が　ルビーになってのう。\n@c2@"
"9":
  de: "@a@b*: Und da die bösen Menschen immer versuchten, sie wegen ihrer Tränen zu fangen, weinte sie besonders viel.\n@c2@"
  en: "@a@b*: And because the wicked humans were always trying to capture her for her tears, she used to cry an awful lot.\n@c2@"
  es: "@a@b*: Y, como los malvados humanos siempre querían capturarla por sus lágrimas, lloraba y lloraba sin parar.\n@c2@"
  fr: "@a@b*ⓢ Et comme ces méchants humains essayaient toujours de la capturer pour prendre ses larmes, elle pleurait beaucoup.\n@c2@"
  it: "@a@b*: E poiché i malvagi esseri umani cercavano sempre di catturarla per ottenere le Lacrime di rubino, lei piangeva in continuazione.\n@c2@"
  ja: "@a@b＊「だから　悪い人間たちに　ねらわれ\n\tいつも　いじめられて\n\tルビーの涙を　流しておったんじゃ。\n@c2@"
"10":
  de: "@a@b*: Ein Mensch kam in unser Dorf, vor gar nicht allzu langer Zeit. Er wollte einen Laden aufmachen.\n@c2@"
  en: "@a@b*: A human man came to our village not long ago, actually. To set up a shop, you know.\n@c2@"
  es: "@a@b*: Un humano vino a nuestro pueblo no hace mucho, en realidad. Para abrir una tienda.\n@c2@"
  fr: "@a@b*ⓢ Un homme est venu dans notre village, il y a quelque temps. Il venait ouvrir un magasin.\n@c2@"
  it: "@a@b*: Non molto tempo fa, al nostro villaggio arrivò un essere umano. Diceva di voler aprire un negozio.\n@c2@"
  ja: "@a@b＊「この間　人間のじいさんが\n\tやってきて　この村で\n\t店を始めたんだ。\n@c2@"
"11":
  de: "@a@b*: Ihr Menschen seid wahre Teufel, wenn es ums Geschäft geht!\n@c2@"
  en: "@a@b*: You humans are devils when it comes to business!\n@c2@"
  es: "@a@b*: ¡Cuando hay negocios de por medio, los humanos sois como demonios!\n@c2@"
  fr: "@a@b*ⓢ Vous, les humains, vous êtes vraiment sans cœur dès qu'il s'agit de commerceⓠ\n@c2@"
  it: "@a@b*: Voi uomini siete peggio del diavolo, quando si tratta di soldi!\n@c2@"
  ja: "@a@b＊「まったく　人間ってやつは\n\t商売が　うまいよな。\n@c2@"
"12":
  de: "@a@b*: Aber nicht nur ihr Menschen habt Sorgen. Wenn der Herr der Unterwelt wieder erwacht, werden auch wir Zwerge ausgelöscht.\n@c2@"
  en: "@a@b*: It's not just you humans who have to worry.\nIf the Lord of the Underworld comes back to life, us dwarfs will all be wiped out, too.\n@c2@"
  es: "@a@b*: Y no solo los humanos debéis estar preocupados.\nSi el Señor del Inframundo vuelve a la vida, también barrerá a los enanos.\n@c2@"
  fr: "@a@b*ⓢ Il n'y a pas que vous, humains, qui devez vous faire du souci. Si le Seigneur des Enfers ressuscite, les nains aussi seront exterminés.\n@c2@"
  it: "@a@b*: Non siete solo voi umani a essere preoccupati per il ritorno del Signore degli Inferi.\n㈡\n*: Se davvero riuscisse a tornare in vita, anche per noi nani non ci sarebbe scampo!\n@c2@"
  ja: "@a@b＊「地獄の帝王が復活すると　わしら\n\tホビットも　滅ぼされるかのう。\n\t心配だのう……。\n@c2@"
"13":
  de: "@a@b*: Wiiiieher! Kein Grund zur Soooorge. Fürst Psaro wiiiiird uns alle reeetten! Wiiiieher.\n@c2@"
  en: "@a@b*: Neeeigh!\nThere's no neeeighd to worry.\nLord Psaro will seeeighve us all! Neeeigh.\n@c2@"
  es: "@a@b*: ¡Iiiiih!\nNo haiiiiiy nada de qué preocuparse.\n¡El Señor Psaro nos salvará a todos! ¡Iiiiih!\n@c2@"
  fr: "@a@b*ⓢ Eh ouiiiⓠ\nHiiinutiiile de s'inquiiiéter.\nLe Seigneur Psaro nous sauvera tousⓠ Siii siii.\n@c2@"
  it: "@a@b*: Iiiiiihhh!\nNon c'è da preoccuparsiiih!\nLord Psaro ci salverà tuttiiih! Snort!\n@c2@"
  ja: "@a@b＊「ヒヒーン！\n\t心配しなくても　ピサロさまが\n\tうまくやってくれるよ。　ヒヒーン！\n@c2@"
"14":
  de: "@a@b*: Wuff, wuff! Der gute Fürst Psaro hat mich das Denken gelehrt.\n@c2@"
  en: "@a@b*: Woof, woof!\nThe grrreat Lord Psaro made me brainy.\n@c2@"
  es: "@a@b*: ¡Guau, guau!\nEl gran señor Psaro me hizo inteligente.\n@c2@"
  fr: "@a@b*ⓢ Ouaf ouafⓠ\nLe grrrand Seigneur Psaro m'a donné l'intelligence.\n@c2@"
  it: "@a@b*: Bau! Bau!\nIl grande Lord Psaro mi ha reso più intelligente.\n@c2@"
  ja: "@a@b＊「わんわん！　ぼく　ピサロさまに\n\t頭を良くしてもらったんだ。\n@c2@"
"15":
  de: "@a@b*: Jetzt kann ich in Menschensprache bellen. Wau wau wau!\n@c2@"
  en: "@a@b*: Now I bark human. Bow wow wow!\n@c2@"
  es: "@a@b*: Ahora ladro en humano. ¡Bau, guau, guau!\n@c2@"
  fr: "@a@b*ⓢ Maintenant, j'aboie en humain. Ouaf ouaf ouafⓠ\n@c2@"
  it: "@a@b*: Adesso so abbaiare nella lingua degli uomini! Bau!\n@c2@"
  ja: "@a@b＊「人間の言葉だって　しゃべれるよ！\n@c2@"
"16":
  de: "@a@b*: Miau. Miaaau. Ich verdanke Fürst Psaro so viel...\n@c1@"
  en: "@a@b*: Meow. Meooow.\nI owe Lord Purrsaro everything...\n@c1@"
  es: "@a@b*: Miau. Miau.\nSe lo debo todo al señor Prrrrsaro.\n@c1@"
  fr: "@a@b*ⓢ Miaou. Miaouuu.\nJe dois tout au Seigneurrr Prrrsarrro. Il m'a tout donné...\n@c1@"
  it: "@a@b*: Miao!\nSono miaolto riconoscente a Lord Psaro.\n@c1@"
  ja: "@a@b＊「にゃあ　にゃあ！\n\tピサロさまに　感謝しなくっちゃ！\n@c1@"
"17":
  de: "@a@b*: Er hat das Geheimnis der Evolution perfektioniert und uns Tieren sehr geholfen.\n@c1@"
  en: "@a@b*: He purrfected the Secret of Evolution and made all usss animals more purrceptive and clever.\n@c1@"
  es: "@a@b*: Ha prrrrfeccionado el Secreto de la Evolución y nos ha hecho más prrrceptivos e inteligentes a nosotros, los animales.\n@c1@"
  fr: "@a@b*ⓢ Il a amiaoulioré le Secret de l'Évolution et a fait de nous des animaux plus prrrrerspicaces et plus intelligents.\n@c1@"
  it: "@a@b*: Ha purrrfezionato il Segreto dell'Evoluzione, e ha reso noi animali piurrr intelligenti e purrrspicaci.\n@c1@"
  ja: "@a@b＊「これも　みんな\n\t進化の秘法の　おかげだにゃん。\n@c1@"
"18":
  de: "@a@b*: Dies ist eine Kirche für Zwerge und Monster.\n@c1@"
  en: "@a@b*: This is a church for dwarfs and monsters.\n@c1@"
  es: "@a@b*: Esta iglesia es para enanos y monstruos.\n@c1@"
  fr: "@a@b*ⓢ Cette église est réservée aux nains et aux monstres.\n@c1@"
  it: "@a@b*: Questa chiesa è riservata ai mostri e agli animali.\n@c1@"
  ja: "@a@b＊「ここは\n\tホビットと動物たちの　教会。\n@c1@"
"19":
  de: "@a@b*: Es tut mir leid, aber Menschen haben hier keinen Zutritt. Geht nun bitte.\n@c1@"
  en: "@a@b*: I'm afraid humans aren't welcome here.\nWould you kindly leave?\n@c1@"
  es: "@a@b*: Me temo que los humanos no son bienvenidos aquí.\n¿%H860%XTe importaría marcharte%YOs importaría marcharos%Z?\n@c1@"
  fr: "@a@b*ⓢ Je suis désolée, mais les humains ne sont pas les bienvenus.\nVoulez-vous bien partirⓡ\n@c1@"
  it: "@a@b*: Mi spiace, ma qui gli esseri umani non sono i benvenuti.\n%H860%XDevi%YDovete%Z andar via.\n@c1@"
  ja: "@a@b＊「あなたたち　人間の\n\t来るところではありません。\n\t立ち去りなさい。\n@c1@"
"20":
  de: "@a@b*: Fürst Psaro hat diesen Turm erbaut.\n@c2@"
  en: "@a@b*: Lord Psaro built this tower.\n@c2@"
  es: "@a@b*: Lord Psaro construyó esta torre.\n@c2@"
  fr: "@a@b*ⓢ C'est le Seigneur Psaro qui a construit cette tour.\n@c2@"
  it: "@a@b*: È stato Lord Psaro a costruire questa torre.\n@c2@"
  ja: "@a@b＊「この塔は　ピサロさまが\n\tつくったものだ。\n@c2@"
"21":
  de: "@a@b*: Er ist äußerst vorsichtig. Er soll dort nämlich eine Geheimkammer eingebaut haben, falls ein Krieg ausbricht.\n@c2@"
  en: "@a@b*: He's very prudent. Apparently he built a secret room into the tower somewhere in case of a war.\n@c2@"
  es: "@a@b*: Es muy prudente. Al parecer construyó una sala secreta en algún lugar de la torre en caso de guerra.\n@c2@"
  fr: "@a@b*ⓢ Il est très prudent.\nIl paraîtrait qu'il aurait construit une salle secrète quelque part dans la tour en cas de guerre.\n@c2@"
  it: "@a@b*: Lord Psaro è molto previdente. Ha costruito una stanza segreta da qualche parte nella torre, un nascondiglio da usare in caso di guerra.\n@c2@"
  ja: "@a@b＊「あのかたは　用心深いかたで\n\tいくさに備えて　塔のどこかに\n\tかくし部屋をつくったらしい。\n@c2@"
"22":
  de: "@a@b*: Und es heißt, dass er dort die Liebe seines Lebens versteckt hält.\n@c2@"
  en: "@a@b*: They say he's hiding the love of his life in there, too.\n@c2@"
  es: "@a@b*: También, dicen que oculta en ella al amor de su vida.\n@c2@"
  fr: "@a@b*ⓢ On dit aussi qu'il y garde son grand amour.\n@c2@"
  it: "@a@b*: Si dice anche che lì dentro abbia nascosto il grande amore della sua vita.\n@c2@"
  ja: "@a@b＊「そして　そこに　愛しい人を\n\tかくまっていなさったんだが……。\n@c2@"
"23":
  de: "@a@b*: Rosi wurde von den bösen Menschen mitgenommen.\n@c1@"
  en: "@a@b*: Rose was slimenapped by the greedy humans.\n@c1@"
  es: "@a@b*: Rosa fue secuestrada por los avariciosos humanos.\n@c1@"
  fr: "@a@b*ⓢ Rooose a été kidnappée par ces sales huuumains.\n@c1@"
  it: "@a@b*: Rosa è stata rapita da quei viscidi umani.\n@c1@"
  ja: "@a@b＊「ぷるぷるっ！\n\tロザリーちゃんが　欲深い人間に\n\tつかまっちゃったよお！\n@c1@"
"24":
  de: "@a@b*: Dabei nützen ihnen ihre Rubintränen gar nichts. Sie zerbrechen, wenn ein Mensch sie berührt.\n@c1@"
  en: "@a@b*: But her ruby tears are no use to them.\nThey shatter if humans touch them.\n@c1@"
  es: "@a@b*: Pero sus lágrimas de rubí no les servirán para nada. Se deshacen si los humanos las tocan.\n@c1@"
  fr: "@a@b*ⓢ Pourtant, ses laaarmes de ruuubis ne leur serviront à rien. Les pierres se briiisent si les huuumains les touuuchent.\n@c1@"
  it: "@a@b*: Ma non potranno arricchirsi con le sue Lacrime di rubino! Le lacrime vanno in frantumi non appena sono toccate da mani umane. Slurp!\n@c1@"
  ja: "@a@b＊「ロザリーちゃんの　ルビーの涙は\n\t人間たちには　さわることも\n\tできないってのに……。\n@c1@"
"25":
  de: "@a@b*: Die Elfen lebten einst in der Nähe eines kleinen Dorfes im Nordwesten. Es heißt Auenfelde. \n@c1@"
  en: "@a@b*: The elves used to live near a little village in the north-west called Strathbaile.\n@c1@"
  es: "@a@b*: Los elfos solían vivir en un pueblecito llamado Candonga, al noroeste.\n@c1@"
  fr: "@a@b*ⓢ Avant, les elfes habitaient dans un petit village du nord-ouest appelé Strattbourg.\n@c1@"
  it: "@a@b*: Molto tempo fa gli elfi vivevano nei pressi del villaggio di Bellavalle, a nord-ovest.\n@c1@"
  ja: "@a@b＊「エルフたちは　かつて\n\t北西の　イムルという村の近くで\n\t暮らしていました。\n@c1@"
"26":
  de: "@a@b*: Doch dann kamen die Menschen und vertrieben sie. Es muss eine schreckliche Zeit für die Elfen gewesen sein.\n@c1@"
  en: "@a@b*: But then the humans came and drove them out. It must have been a terrible time for their kind.\n@c1@"
  es: "@a@b*: Pero llegaron los humanos y los expulsaron. Deben de haber sido tiempos muy difíciles para su raza.\n@c1@"
  fr: "@a@b*ⓢ Mais les humains sont arrivés et les ont chassés.\nCette époque a dû être terrible pour eux.\n@c1@"
  it: "@a@b*: Poi gli esseri umani li scacciarono da lì. Fu un colpo molto duro per gli elfi.\n@c1@"
  ja: "@a@b＊「けれど　その地にも人間が住み始め\n\tエルフたちは　住む場所を\n\t追われたのです。　かわいそうに……。\n@c1@"
"27":
  de: "@a@b*: Zzzz...\n@c1@"
  en: "@a@b*: Zzzz...\n@c1@"
  es: "@a@b*: Zzzz...\n@c1@"
  fr: "@a@b*ⓢ Zzz...\n@c1@"
  it: "@a@b*: Ronf...\n@c1@"
  ja: "@a@b＊「すやすや……。\n@c1@"
"28":
  de: "@a@b*: Hier lebte einst ein junges Monster names Psaro.\n@c1@"
  en: "@a@b*: There was a young monster who used to live here called Psaro, you know.\n@c1@"
  es: "@a@b*: Aquí solía vivir un joven monstruo llamado Psaro.\n@c1@"
  fr: "@a@b*ⓢ Autrefois, un jeune monstre appelé Psaro habitait ici, vous savez.\n@c1@"
  it: "@a@b*: Tanto tempo fa qui viveva un giovane mostro di nome Psaro.\n@c1@"
  ja: "@a@b＊「かつて　この村に\n\tピサロという　魔族の若者が\n\t住んでいました。\n@c1@"
"29":
  de: "@a@b*: Aber dann schmiedete dieser Psaro teuflische Pläne, um die Weltherrschaft zu übernehmen, und ging fort!\n@c1@"
  en: "@a@b*: But he came up with some diabolical scheme to rule the world and left!\n@c1@"
  es: "@a@b*: ¡Pero discurrió un plan diabólico para dominar el mundo y se largó!\n@c1@"
  fr: "@a@b*ⓢ Mais il a mis au point un plan diabolique pour devenir le maître du monde et il est partiⓠ\n@c1@"
  it: "@a@b*: Un giorno, però, disse di aver escogitato un piano diabolico per dominare il mondo intero. E così, prese e andò via.\n@c1@"
  ja: "@a@b＊「世界を支配するなどという\n\tとんでもない野望をいだいて\n\t村を　出ていきましたが……\n@c1@"
"30":
  de: "@a@b*: Rosi war die Einzige, die ihn je besänftigen konnte.\n@c1@"
  en: "@a@b*: Rose was the only one who could ever soften him at all.\n@c1@"
  es: "@a@b*: Rosa era la única capaz de ablandarlo un poco.\n@c1@"
  fr: "@a@b*ⓢ Rose était la seule qui pouvait lui faire entendre raison.\n@c1@"
  it: "@a@b*: Psaro non era proprio una creatura amabile, tutt'altro! Solo Rosa riusciva ad addolcirlo.\n@c1@"
  ja: "@a@b＊「そのピサロも　ロザリーにだけは\n\tやさしい笑顔を見せていたものです。\n@c1@"
"31":
  de: "@a@b*: Ha-püh...\n@c2@"
  en: "@a@b*: Ah-phew...\n@c2@"
