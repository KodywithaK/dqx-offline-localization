"0":
  de: "@a@b*: Hallo, %H860%XSchatz%Ymeine Süßen%Z! Na, auf Reisen? Dann willkommen in Guckshaven!\n@c1@"
  en: "@a@b*: 'Ello there, my %H860%Xlover%Ylovers%Z!\nTravⓙllinⓙ, are we?\nWell, welcome to Porthtrunnel, then.\n@c1@"
  es: "@a@b*: ¡Hola, %H860%X%A120%Xforastero%Z%B120%Xforastera%Z%Y%R000%Xforasteras%Yforasteros%Z%Z!\nDe viaje, ¿no?\nPues %H860%X%A120%Xbienvenido%Z%B120%Xbienvenida%Z%Y%R000%Xbienvenidas%Ybienvenidos%Z%Z a Puertoumbrío.\n@c1@"
  fr: "@a@b*ⓢ Salut, %H860%X%A120%Xmon chéri%Z%B120%Xma chérie%Z%Y%R000%Xmes chéries%Ymes chéris%Z%Zⓠ\nAlors, on voyageⓡ\nBienvenue à Port-Carène, alors.\n@c1@"
  it: "@a@b*: Salve, %H860%Xtesoruccio%Ytesorucci%Z!\nStiamo a viaggia', vero?\n%H860%X%A120%XBenvenuto%Z%B120%XBenvenuta%Z%Y%R000%XBenvenute%YBenvenuti%Z%Z a Cala Cantiera.\n@c1@"
  ja: "@a@b＊「こんにちは　旅人さん。\n\tここは　港町コナンベリーよ。\n@c1@"
"1":
  de: "@a@b*: Tschä, der erste Eindruck... Da soll man ja nix drauf geben, aber... Ihr seid ja man %H860%X%A120%X'n recht ungewöhnlicher Jung%Z%B120%X'ne recht ungewöhnliche Deern%Z%Yrecht ungewöhnliche Leuts%Z, oder?\n@c3@"
  en: "@a@b*: They say you'm not s'posed to judge a book by 'is cover, but... You'm more than your average %H860%X%A120%Xbay%Z%B120%Xmaid%Z%Yfolks%Z, en't you?\n@c3@"
  es: "@a@b*: Dicen que no se debe uno deja' lleva' por las apariencias, pero... %H860%X%A120%XTú no eres un zagal normal%Z%B120%XTú no eres una zagala normal%Z%Y%R000%XVosotras no sois zagalas%YVosotros no sois unos zagales%Z normales%Z, ¿no es asín?\n@c3@"
  fr: "@a@b*ⓢ On a beau dire qu'y faut pas s'fier aux apparences, mais... vous êtes bien plus %H860%X%A120%Xqu'un type ordinaire%Z%B120%Xqu'une demoiselle ordinaire%Z%Yque des personnes ordinaires%Z, n'est-ce pasⓡ\n@c3@"
  it: "@a@b*: Lo so che nun se deve giudica' lu monaco da lu vestito, però... Però mi %H860%Xsembri differente%Ysembrate differenti%Z dagli altri, o me sto a sbaja'?\n@c3@"
  ja: "@a@b＊「人は　見かけによらないって言うが\n\tおたくたち　ただ者じゃねえだろ？\n@c3@"
"2":
  de: "@a@b*: Dacht ich mir.\nMir entgeht so schnell nix.\n@c3@"
  en: "@a@b*: I thought as much.\nI dun't miss much, me.\n@c3@"
  es: "@a@b*: Eso me parecía.\nNo fallo tanto yo.\n@c3@"
  fr: "@a@b*ⓢ J'm'en doutais.\nY'a pas grand-chose qui m'échappe, à moi.\n@c3@"
  it: "@a@b*: Proprio come pensavo.\nIo tengo l'occhio lungo.\n@c3@"
  ja: "@a@b＊「やっぱりな。\n\tオレには　すぐわかったぜ！\n@c3@"
"3":
  de: "@a@b*: Na, jetzt aber man nich' so bescheiden! Da hab ich 'n Blick für, für so was.\n@c3@"
  en: "@a@b*: Don't be so modest!\nThere en't nuffin' gets past these eyes.\n@c3@"
  es: "@a@b*: No %H860%Xseas tan %A120%Xmodesto%Z%B120%Xmodesta%Z%Yseáis tan %R000%Xmodestas%Ymodestos%Z%Z.\nNo hay na' que me se escape.\n@c3@"
  fr: "@a@b*ⓢ Soyez pas si %H860%Xmodeste%Ymodestes%Zⓠ\nY'a rien qui peut m'échapper.\n@c3@"
  it: "@a@b*: Cos'è tutta 'sta modestia?\nA me nun me sfugge gnente.\n@c3@"
  ja: "@a@b＊「けんそん　するなって！\n\tオレの目は　ふし穴じゃないぜ。\n@c3@"
"4":
  de: "@a@b*: Ihr seid %H860%X%A120%Xso 'n Jung, der Wunder vollbringen kann%Z%B120%Xso 'ne Deern, die Wunder vollbringen kann%Z%Yso Leuts, die Wunder vollbringen könn'%Z.\n@c3@"
  en: "@a@b*: You'm the kind o' %H860%X%A120%Xbay%Z%B120%Xmaid%Z%Yfolks%Z as performs miracles.\n@c3@"
  es: "@a@b*: %H860%XEre' de ese tipo de %A120%Xzagales%Z%B120%Xmozas%Z%YSois de ese tipo de %R000%Xmozas%Yzagales%Z%Z quⓘhacen milagros.\n@c3@"
  fr: "@a@b*ⓢ Vous êtes le genre de %H860%X%A120%Xtype%Z%B120%Xdemoiselle%Z%Ypersonnes%Z à faire des miracles.\n@c3@"
  it: "@a@b*: %H860%XTu si' 'na persona che sa fa' miracoli%YVoi siete persone che sanno fa' miracoli%Z!\n@c3@"
  ja: "@a@b＊「おたくらは　そのうち\n\tどえらいことを　やらかすヤツだよ。\n@c3@"
"5":
  de: "@a@b*: Dank Euch hab ich endlich wieder was um die Fingers! Der Böse kennt nich' Rast un' Ruh, un' wir Ladearbeiter auch nich', haha!\n@c0@"
  en: "@a@b*: 'Tis thanks to you that I can get back to me job at last. No rest for the wicked...or us cargo luggers!\n@c0@"
  es: "@a@b*: Gracias a %H860%Xti%Y%R000%Xvosotras%Yvosotros%Z%Z al fin pueⓘo volve' a trabaja'. Na' de descanso para las almas en pena ni pa' nosotros, los estibadores.\n@c0@"
  fr: "@a@b*ⓢ C'est grâce à vous que je peux enfin reprendre mon travail. Pas de repos pour les braves... ou pour nous autres, chargeurs de naviresⓠ\n@c0@"
  it: "@a@b*: Grazie a %H860%Xte%Yvoi%Z pozzo torna' a lavora'. Noi poveri scaricatori di porto nun ce riposiamo mai!\n@c0@"
  ja: "@a@b＊「いやー　あんたがたのおかげで\n\tまた　荷物運びの仕事が\n\tできるぜ。　ありがとよ！\n@c0@"
"6":
  de: "@a@b*: Wir sollten jetzt 'n büschen besser aufpassen. Nich', dass uns das Feuer im Leuchtturm wieder ausgeht, gell?\n@c3@"
  en: "@a@b*: We best be more careful from now on. Can't let that there 'oly flame at the Beacon go out again now, can we?\n@c3@"
  es: "@a@b*: Tendremos que tener máⓘ cuida'o a partir d'ahora. No podemos deja' que la vieja llama del faro se apague otra vez, ¿verda'?\n@c3@"
  fr: "@a@b*ⓢ On a intérêt à faire plus attention, à partir de maintenant. Plus question de laisser la flamme sacrée de la Balise s'éteindreⓠ\n@c3@"
  it: "@a@b*: Dovemo fa' più attenzione d'ora in poi. Mica possiamo fa' spegne' di nuovo la luce sacra sopra lu faro?\n@c3@"
  ja: "@a@b＊「これからは　二度とふたたび\n\t灯台の　聖なる炎を絶やさせぬよう\n\t気をつけねばならんな。\n@c3@"
"7":
  de: "@a@b*: Wie war das, %A120%XJung%Z%B120%XDeern%Z? Wart Ihr das nich', die die Ungeheuer aus dem Leuchtturm gejagt haben?\n@c2@"
  en: "@a@b*: What's that, %A120%Xbay%Z%B120%Xmaid%Z? 'Twas %H860%Xyou an' your pals%Yyou lot%Z who seen the monsters off out the Beacon, was it?\n@c2@"
  es: "@a@b*: ¿Qué pasa %A120%Xzagal%Z%B120%Xzagala%Z? Fuisteis %H860%Xtú y esos rapaces%Y%R000%Xvosotras%Yvosotros%Z%Z quienes echasteis a los mon'truos, ¿Verda'?\n@c2@"
  fr: "@a@b*ⓢ Dites, %A120%Xjeune homme%Z%B120%Xjeune fille%Zⓡ C'est vous et votre groupe qui avez chassé les monstres de la Balise, n'est-ce pasⓡ\n@c2@"
  it: "@a@b*: Che stai a di', %A120%Xragazzo%Z%B120%Xragazza%Z? %H860%XSiete stati tu e i tuoi amici%YSiete stati voi%Z a scaccia' li mostri da lu faro?\n@c2@"
  ja: "@a@b＊「え？　あなたがたが\n\t灯台の魔物を　やっつけた？\n@c2@"
"8":
  de: "@a@b*: Tschä, da ha'm wir Euch ja man einiges zu verdanken. Endlich is' hier wieder richtig was los, wie's sich für 'n ordentlichen Hafen gehört!\n@c2@"
  en: "@a@b*: Well we're much obliged to you all, then.\n'E's proper lively again now, the port is.\nLike what a port should be!\n@c2@"
  es: "@a@b*: Bien, pues os estamos muⓘ agradecidos.\nEl puerto vuelve a esta' lleno de vida.\n¡Como deben ser los puertos!\n@c2@"
  fr: "@a@b*ⓢ Eh bien, dans ce cas, nous vous sommes très reconnaissants. Le port est de nouveau plein d'animation. Comme un port doit l'êtreⓠ\n@c2@"
  it: "@a@b*: Vi ringraziamo assai!\nLu' porto è tornato come a prima.\nOra sì che è degno di 'stu nome!\n@c2@"
  ja: "@a@b＊「ありがとうございます！\n\tこれで　この港町も生き返ります。\n@c2@"
"9":
  de: "@a@b*: Mit dem Turm von Pharos im Osten is' ja man endlich wieder alles in Ordnung. Was für 'n Segen!\n@c2@"
  en: "@a@b*: The Pharos Beacon out east is back to normal at last. What a blessed relief for us all!\n@c2@"
  es: "@a@b*: El faro Pharos, al este, vuelve a la normalida' por fin. ¡Q'alivio pa' to's!\n@c2@"
  fr: "@a@b*ⓢ La Balise de Pharos, à l'est, est enfin redevenue normale. Quel soulagement et quelle bénédiction pour nous tousⓠ\n@c2@"
  it: "@a@b*: Lu faro di Pharos è tornato come a prima. Chistu è 'nu sollievo pe' tutti noi.\n@c2@"
  ja: "@a@b＊「東の大灯台が\n\tもとどおりに　なったってね！\n@c2@"
"10":
  de: "@a@b*: Die Schiffe segeln auch wieder und alles. Oh ja, wir ha'm Euch viel zu verdanken, %H860%X%A120%Xmein Jung%Z%B120%Xmeine Deern%Z%Yliebe Leuts%Z!\n@c2@"
  en: "@a@b*: The ships are sailin' again an' everythin'.\nOh, yes, we've got a lot to thank you for, my %H860%Xlove%Ylovers%Z.\n@c2@"
  es: "@a@b*: Los barcos navegan otra vez y to' eso.\nSí, estamos mu' agradecidos, %H860%X%A120%Xpájaro%Z%B120%Xpájara%Z%Y%R000%Xpájaras%Ypájaros%Z%Z.\n@c2@"
  fr: "@a@b*ⓢ Les bateaux naviguent de nouveau.\nOh oui, nous avons de quoi vous remercier, %H860%X%A120%Xmon chou%Z%B120%Xma mignonne%Z%Y%R000%Xmes mignonnes%Ymes mignons%Z%Z.\n@c2@"
  it: "@a@b*: Le navi stanno a riparti'.\nOh, sì, c'abbiamo da ringrazia' solo a %H860%Xte%Yvoi%Z, pe' 'stu fatto.\n@c2@"
  ja: "@a@b＊「船も　出港したみたいだし\n\tこれも　すべて\n\tあんたたちの　おかげだよ！\n@c2@"
"11":
  de: "@a@b*: Ich habe gehört, die Ungeheuer im Turm von Pharos, die diesen ganzen Aufruhr verursacht haben, seien endlich vertrieben worden.\n@c2@"
  en: "@a@b*: I hear the monsters causing all the trouble at the Pharos Beacon have been evicted at last.\n@c2@"
  es: "@a@b*: He oído que los monⓘtruos que estaban dando problemas en el faro Pharos han sido derrotados.\n@c2@"
  fr: "@a@b*ⓢ J'ai entendu dire que les monstres qui causaient tous ces ennuis à la Balise de Pharos avaient enfin été éliminés.\n@c2@"
  it: "@a@b*: Ho saputo che i mostri che avevano causato problemi al faro di Pharos sono stati finalmente scacciati.\n@c2@"
  ja: "@a@b＊「ついに　灯台に巣食う魔物が\n\t倒されたそうですね。\n@c2@"
"12":
  de: "@a@b*: Aber für mein Schiff ist es leider zu spät. Das liegt schon am Grunde des Meeres.\n@c2@"
  en: "@a@b*: But it's too late for my ship. She's already at the bottom of the ocean. Oh, dear, dear...\n@c2@"
  es: "@a@b*: Pero es demasiado tarde paⓘ mi barco. Ya está en el fondo del mar. Vaya...\n@c2@"
  fr: "@a@b*ⓢ Mais c'est trop tard pour mon navire. Il gît déjà au fond de l'océan. Oh, quel malheur...\n@c2@"
  it: "@a@b*: Per la mia nave, però, è troppo tardi. È già in fondo all'oceano. Che disdetta...\n@c2@"
  ja: "@a@b＊「でも　わたしの船は\n\t沈んだままです。　とほほ……。\n@c2@"
"13":
  de: "@a@b*: Im Süden, übers Meer, soll es ein echtes Wirtschaftsgenie geben. In Mintos oder so.\n@c0@"
  en: "@a@b*: They say thereⓙs some feller down south over the sea whoⓙs a wizard oⓙ commerce. In a place called Mintos or some such snazzy name.\n@c0@"
  es: "@a@b*: Dicen que hay un tipo al sur, más allá del mar, que es un mago del comercio. Está en un sitio llamado Mintos o un nombre así, elegante.\n@c0@"
  fr: "@a@b*ⓢ On raconte qu'au sud, de l'autre côté de la mer, il y a un type qui est un vrai sorcier du commerce.\n㈡\n*ⓢ Dans une ville appelée Ringys, ou un autre nom pédant du même genre.\n@c0@"
  it: "@a@b*: Pare che a sud ci sta 'nu tizio che è 'nu magu dell'affari. Abita a 'nu posto che se chiama Mintos o 'na robba accussì.\n@c0@"
  ja: "@a@b＊「海をこえた　南のミントスには\n\t商売の神さまみたいな\n\tじいさんが　いるんだってよ。\n@c0@"
"14":
  de: "@a@b*: Wenn der wirklich so 'n As ist, muss er ja ganz schön Knete an den Füßen haben. Das wär auch was für meiner Mutter ihren Sohn!\n@c0@"
  en: "@a@b*: Must be a helluva rich, I sⓙpose, if heⓙs a wizard oⓙ commerce. I wunⓙt mind a slice of ⓙeⓙs cake, let me tell you.\n@c0@"
  es: "@a@b*: Debe de ser un tipo rico, digo yo, si es mago del comercio. No me importaría llevarme cacho de lo que tiene, eso seguro.\n@c0@"
  fr: "@a@b*ⓢ Il doit être sacrément riche, si c'est un grand manitou du commerce. Ça me gênerait pas de partager le gâteau avec lui, je peux vous le dire.\n@c0@"
  it: "@a@b*: Ci devono uscì li sordi dalle orecchie a quello là, se se la cava accussì bene nell'affari! Mica ci direi di no, se mi desse 'nu poco de li quattrini sui...\n@c0@"
  ja: "@a@b＊「商売の神さまってんだから\n\tさぞ　金もうけが　うまいんだろうな。\n\tあやかりたいもんだぜ。\n@c0@"
"15":
  de: "@a@b*: Hallöchen, %H860%X%A120%XSüßer%Z%B120%XSchätzchen%Z%Ymeine Süßen%Z. Wollt Ihr auf See gehen? Wie wär's dann mit einer Weltkarte, damit Ihr Euch unterwegs zurechtfindet?\n@c2@"
  en: "@a@b*: ⓙUllo, my %H860%Xlover%Ylovers%Z. Off on a sea voyage?\nⓙOw about a map of the world to help you on your way, then?\n@c2@"
  es: "@a@b*: Hola, %H860%X%A120%Xforastero%Z%B120%Xforastera%Z%Y%R000%Xforasteras%Yforasteros%Z%Z. ¿De viaje poⓘl mar?\n¿Y no %H860%Xte%Yos%Z interesaría un mapa paⓘ ayudar%H860%Xte%Yos%Z un poco?\n@c2@"
  fr: "@a@b*ⓢ Salut, %H860%X%A120%Xmon chou%Z%B120%Xma mignonne%Z%Y%R000%Xmes mignonnes%Ymes mignons%Z%Z.\nOn part pour un voyage en merⓡ\n㈡\n*ⓢ Que diriez-vous d'une carte du monde pour vous aider à naviguerⓡ\n@c2@"
  it: "@a@b*: Ciao signo'. Che stai a parti' pe' 'nu viaggio pe' lu mare? Nun è che %H860%Xti%Yvi%Z serve 'na mappa de lu munno, così nun %H860%Xti perdi%Yvi perdete%Z?\n@c2@"
  ja: "@a@b＊「いらっしゃいませ！　船旅のお供に\n\t世界地図はいかがですか？\n\tきっと　お役に立ちますわよ。\n@c2@"
"16":
  de: "@a@b*: Ach, verflixt! Ich dachte, ich hätte noch welche, aber ich kann sie nicht finden. Komisch...\n@c2@"
  en: "@a@b*: Oh, bother! I was sure I ⓙad some left, but theyⓙm not ⓙere. Thatⓙs a bit blimminⓙ odd...\n@c2@"
  es: "@a@b*: ¡Jo, qué fastidio! Estaba segura de que me quedaban uno o dos, pero no están aquí. Eso es muⓘ raro...\n@c2@"
  fr: "@a@b*ⓢ Oh, flûteⓠ J'étais sûre qu'il m'en restait, mais je ne les trouve pas. C'est drôlement bizarre...\n@c2@"
  it: "@a@b*: Oh, ma che sto a di'! Ero sicura che ce n'avevo una, ma qua nun ce ne sta manco l'ombra!\n@c2@"
  ja: "@a@b＊「あら　いやだ！\n\tまだ　いっぱいあったと思ったのに\n\tなくなってるわ。　変ねえ……。\n@c2@"
"17":
  de: "@a@b*: Wie Ihr wollt, Schätzchen. Guckt mal wieder rein, ja?\n@c2@"
  en: "@a@b*: Oh, well.\nSuit %H860%Xyourself%Yyourselves%Z, me %H860%Xdear%Ydears%Z.\nCome again now, wonⓙt you?\n@c2@"
  es: "@a@b*: Vale dⓘacuerdo. Como %H860%Xquieras%Yqueráis%Z, %H860%X%A120%Xforastero%Z%B120%Xforastera%Z%Y%R000%Xforasteras%Yforasteros%Z%Z.\n%H860%XVolverás %YVolveréis %Zpor aquí, ¿verdáⓘ?\n@c2@"
  fr: "@a@b*ⓢ Bon. Comme vous voudrez, %H860%X%A120%Xmon chou%Z%B120%Xma mignonne%Z%Y%R000%Xmes mignonnes%Ymes mignons%Z%Z.\nMais revenez me voir, d'accordⓡ\n@c2@"
  it: "@a@b*: E vabbè. %H860%XScusami%YScusatemi%Z tanto, signò. %H860%XTorna%YTornate%Z n'artra vorta, però!\n@c2@"
  ja: "@a@b＊「それは　残念ですわ。\n\tまた　おこしくださいね。\n@c2@"
"18":
  de: "@a@b*: Ah, da %H860%X%A120%Xkommt ja der Held%Z%B120%Xkommt ja die Heldin%Z%Ykommen ja die Helden%Z des Tages!\nDen Ungeheuern habt Ihr's ja man ordentlich gegeben, nech?\n@c2@"
  en: "@a@b*: Ah, 'ere %H860%Xcomes the 'ero%Ycome the 'eroes%Z of the day!\nYou seen off them monsters good 'n' proper, eh?\n@c2@"
  es: "@a@b*: ¡Ah!, aquí %H860%Xllega %A120%Xel héroe%Z%B120%Xla heroína%Z%Yllegan %R000%Xlas heroínas%Ylos héroes%Z%Z del día.\n%H860%XLⓘhas%YLⓘhabéis%Z da'o unas buenas mangurria's a los mon'truos ¿verda'?\n@c2@"
  fr: "@a@b*ⓢ Ah, voilà %H860%X%A120%Xle héros%Z%B120%Xl'héroïne%Z%Y%R000%Xles héroïnes%Yles héros%Z%Z du jourⓠ\nVous avez bien réglé leur compte aux monstres, heinⓡ\n@c2@"
  it: "@a@b*: Ah, guarda 'npo' chi se rivede!\n%H860%XHai%YAvete%Z scacciato li mostri pe' sempre, eh?\n@c2@"
  ja: "@a@b＊「すごいなあ　あんたたち！\n\t灯台の魔物を　やっつけたんだろ？\n@c2@"
"19":
  de: "@a@b*: Ich hab's gewusst. Sobald sich die Wogen legten, wusste ich, dass Ihr's geschafft habt, nech.\n@c2@"
  en: "@a@b*: I could tell as soon as them waves died down.\nThat's 'ow I knew you'd done it, see.\n@c2@"
  es: "@a@b*: Me di cuenta en cuanto se calmaron las olas.\nAsín me enteré de que lo %H860%Xhabías%Yhabíais%Z conseguido.\n@c2@"
  fr: "@a@b*ⓢ Je l'ai deviné dès que j'ai vu les vagues se calmer. C'est comme ça que j'ai su que vous aviez réussi.\n@c2@"
  it: "@a@b*: Quanno le onde se so' calmate, ho capito tutto.\nEra lu segno che %H860%Xce l'avevi fatta%Yce l'avevate fatta%Z.\n@c2@"
  ja: "@a@b＊「海が　静かになったから\n\tすぐに　わかったよ。\n@c2@"
"20":
  de: "@a@b*: Es gibt da eine traurige Geschichte von einem, der sich umbrachte, als sein Schiff von den Ungeheuern versenkt wurde...\n@c2@"
  en: "@a@b*: Thereⓙs a sad ole tale about a feller who done ⓙeⓙs self in ⓙcos ⓙeⓙs boat got sunk by them monsters...\n@c2@"
  es: "@a@b*: Se cuenta una historia muⓘ triste de un tipo que se murió porque a su barco lo hundieron los monⓘtruos...\n@c2@"
  fr: "@a@b*ⓢ On raconte une histoire bien triste à propos d'un homme qui aurait attenté à ses jours parce que son bateau avait été coulé par des monstres...\n@c2@"
  it: "@a@b*: 'Na storia molto triste narra di quest'uomo che perse tutto quanno la sua nave fu affonnata da li mostri...\n@c2@"
  ja: "@a@b＊「船を　魔物たちに沈められ\n\t自殺した人も　いたとか。\n\tかわいそうに……。\n@c2@"
"21":
  de: "@a@b*: Niemand darf dieses Zimmer betreten. Es ist immer abgeschlossen.\n@c1@"
  en: "@a@b*: Thatⓙs a forbidden room, that one.\nItⓙs always locked.\n@c1@"
  es: "@a@b*: En ese cuarto no se puede entrar.\nEstá siempre cerraⓘo.\n@c1@"
  fr: "@a@b*ⓢ Cette chambre est interdite.\nElle est toujours verrouillée.\n@c1@"
  it: "@a@b*: Quella è 'na stanza proibita.\nSta sempre chiusa a chiave.\n@c1@"
  ja: "@a@b＊「そこの　カギのかかった部屋は\n\tあかずの間になっているんですよ。\n@c1@"
"22":
  de: "@a@b*: Wer da die Nacht verbringt, wacht des Morgens nicht mehr auf. Echt gruselig.\n@c1@"
  en: "@a@b*: Anyone who spends the night in there never wakes up in the morninⓙ.\nItⓙs proper scary, it is.\n@c1@"
  es: "@a@b*: Quien pasa la noche aquí nunca se despierta por la mañana. Qué miedo da, ¿eh?\n@c1@"
  fr: "@a@b*ⓢ Tous ceux qui passent la nuit dedans ne se réveillent plus jamais.\nÇa fait vraiment froid dans le dos.\n@c1@"
  it: "@a@b*: Se uno dorme lì dentro, la matina nun se sveja! Mi vengono li brividi solo a penza'!\n@c1@"
  ja: "@a@b＊「なんでも　その部屋に泊まった人が\n\t次の日　がい骨になっていたとか。\n\tおお　こわい……！\n@c1@"
"23":
  de: "@a@b*: Jenseits der Berge nördlich von Casabranca wurde ein Dorf entdeckt, das die Ungeheuer überrannt haben. Völlig ausgeplündert.\n@c2@"
  en: "@a@b*: They found a village over them mountains north of Casabranca that got done over by monsters. Ransacked, ⓙe was.\n@c2@"
  es: "@a@b*: Han encontraⓘo un pueblo en las montañas al norte de Casablanca que lo han destruido los monⓘtruos. Después de saquearlo.\n@c2@"
  fr: "@a@b*ⓢ De l'autre côté des montagnes au nord de Casabranca, on a découvert un village détruit par les monstres. Totalement saccagé.\n@c2@"
  it: "@a@b*: 'Nu villaggio sopra le muntagne a nord di Casabianca è stato saccheggiato da li mostri!\n@c2@"
  ja: "@a@b＊「はるか　ブランカの北の山奥で\n\t魔物たちに　滅ぼされた村が\n\t最近　見つかったそうじゃ。\n@c2@"
"24":
  de: "@a@b*: Und in Samokswa auf der anderen Seite des Meeres sind Leute einfach verschwunden.\n@c2@"
  en: "@a@b*: And folkⓙve bin disappearing over the sea in Zamoksva, an' all.\n@c2@"
  es: "@a@b*: Y por Zamoksva, al otro laⓘo del mar, han estaⓘo desapareciendo y toⓘ eso.\n@c2@"
  fr: "@a@b*ⓢ Et de l'autre côté de la mer, à Zamoksva, les habitants ont disparu.\n@c2@"
  it: "@a@b*: E certa gente è sparita a Zamoskva, dall'altro lato de lu mare.\n@c2@"
  ja: "@a@b＊「海の向こうの　サントハイムでは\n\tお城の人々が　こつぜんと\n\t消えてしまったと言うし……。\n@c2@"
"25":
  de: "@a@b*: Also, ich glaube, das hängt alles damit zusammen, dass der Herr der Unterwelt zum Leben erwacht. Hab ich jedenfalls gehört.\n@c2@"
  en: "@a@b*: If you ask me, ⓙtis all tied up with that Lord oⓙ the Underworld cominⓙ back to life. Thatⓙs what Iⓙve ⓙeard, anyway...\n@c2@"
  es: "@a@b*: Paⓘ mí que toⓘ tiene que ver con lo de ese Señor del Inframundo que ha vuelto a la vida.\nEso he oído, vamos...\n@c2@"
  fr: "@a@b*ⓢ Si vous voulez mon avis, tout ça est lié à la résurrection du Seigneur des Enfers.\nEnfin, en tout cas, c'est ce que j'ai entendu dire...\n@c2@"
  it: "@a@b*: Seconno me, lu motivo è uno solo: lu Signore de li Inferi se sta a risveja'. Così mi hanno detto...\n@c2@"
  ja: "@a@b＊「もしかして　これは\n\t地獄の帝王が　よみがえるという\n\tうわさと関係があるのかのう……。\n@c2@"
"26":
  de: "@a@b*: Endlich ist das böse Licht im Turm von Pharos erloschen.\n@c1@"
  en: "@a@b*: That evil light at the Pharos Beacon's bin extinguished at last.\n@c1@"
  es: "@a@b*: Por fin s'apagaⓘo esa maléfica luz del faro Pharos.\n@c1@"
  fr: "@a@b*ⓢ Cette lumière maléfique à la Balise de Pharos s'est enfin éteinte.\n@c1@"
  it: "@a@b*: Finalmente la luce malvagia sopra a lu faro di Pharos è stata spenta.\n@c1@"
  ja: "@a@b＊「灯台からの　邪悪な光は\n\t消え去りました。\n@c1@"
"27":
  de: "@a@b*: Ich glaub nur nich', dass bei Eurer Reise jetzt alles glatt läuft, %H860%Xmein Kind%Ymeine Kinder%Z.\n@c1@"
  en: "@a@b*: But I dun't think them's the last o' the troubles you'm gonna be runnin' into on your travels, my %H860%Xchild%Ychildren%Z.\n@c1@"
  es: "@a@b*: Pero pa' mi que aquí no va a quedar la cosa, %H860%Xrapaz%Yrapaces%Z.\n@c1@"
  fr: "@a@b*ⓢ Je crois cependant que ce n'est pas la dernière difficulté à laquelle vous serez %H860%X%A120%Xconfronté%Z%B120%Xconfrontée%Z%Y%R000%Xconfrontées%Yconfrontés%Z%Z pendant votre voyage, %H860%Xmon enfant%Ymes enfants%Z.\n@c1@"
  it: "@a@b*: Purtroppo nun penso che sarà l'ultimo dei problemi che %H860%Xincontrerai nei viaggi tui%Yincontrerete nei viaggi vostri%Z.\n@c1@"
  ja: "@a@b＊「しかし　あなたたちの行く先には\n\tこれからも　多くの困難が\n\t待ち受けているでしょう。\n@c1@"
"28":
  de: "@a@b*: Aber gebt man nur nich' auf. Denkt an die Göttin und bleibt guten Mutes.\n@c1@"
  en: "@a@b*: But dun't give up. Remember the Goddess above an' keep your spirits up.\n@c1@"
  es: "@a@b*: Aunque, no %H860%Xte rindas%Yos rindáis%Z. %H860%XPiensa%YPensad%Z en la Diosa que está allá arriba y %H860%Xmantén%Ymantened%Z alto el ánimo.\n@c1@"
  fr: "@a@b*ⓢ Surtout, n'abandonnez pas. Souvenez-vous que la Déesse veille sur vous et vous donne l'espoir.\n@c1@"
  it: "@a@b*: %H860%XMa nun te devi scoraggia'. Ricorda%YMa nun ve dovete scoraggia'. Ricordate%Z che la dea %H860%Xti%Yvi%Z protegge dall'alto.\n@c1@"
  ja: "@a@b＊「けっして　弱音を\n\tはきませぬように……。\n@c1@"
"29":
  de: "@a@b*: Das hier is' die Werft.\nAber im Moment baut keiner hier Schiffe. Sind traurige Zeiten.\n@c0@"
  en: "@a@b*: This 'ere's the dockyard.\nBut there en't no ships bein' built at the minute.\n'Tis a sad time for the yard.\n@c0@"
  es: "@a@b*: Aquí están los astilleros.\nPero ahora no se construyen barcos en ellos.\nMalos tiempos pa' los astilleros.\n@c0@"
  fr: "@a@b*ⓢ Voici le chantier naval.\nMalheureusement, nous n'avons aucun bateau en construction en ce moment. C'est bien triste.\n@c0@"
  it: "@a@b*: E chistu è lu cantiere.\nMa mò nun se sta' a costrui' nisciuna nave.\nEh, sì... è 'nu periodo brutto pe' lu cantiere.\n@c0@"
  ja: "@a@b＊「ここは　船のドック。\n\tだが　今は　つくるべき船もなく\n\tさびしいものだ。\n@c0@"
"30":
  de: "@a@b*: Ich glaub, bei den vielen Ungeheuern, die sich hier rumtreiben, steht den Leuten nicht der Sinn nach Schiffsbau.\n@c0@"
  en: "@a@b*: I dun't s'pose many folk'll be thinkin' about shipbuildin' with all these monsters about these days.\n@c0@"
  es: "@a@b*: M'imagino lo que opina la gente sobre la construcción de barcos con to's esos mon'truos pululando.\n@c0@"
  fr: "@a@b*ⓢ Je suppose qu'il n'y a pas beaucoup de gens pour penser à la construction d'un bateau avec tous les monstres qui rôdent, en ce moment.\n@c0@"
  it: "@a@b*: Co' tutti 'sti mostri in giro, chi è che pensa a costrui' navi?\n@c0@"
  ja: "@a@b＊「やはり　こう魔物が　多くては\n\t新しく船を　つくろうなどと\n\tだれも　思わないのだろうな。\n@c0@"
"31":
  de: "@a@b*: Wenn ich groß bin, fahr ich zur See!\n@c1@"
  en: "@a@b*: I'm gonna be a skipper when I grow up.\n@c1@"
  es: "@a@b*: Cuando sea mayor, v'ia ser patrón de barco.\n@c1@"
  fr: "@a@b*ⓢ Quand je serai grand, je serai capitaine.\n@c1@"
  it: "@a@b*: Da grande vojo fa' lu marinaio.\n@c1@"
  ja: "@a@b＊「ボク　大きくなったら\n\tぜったいに　船乗りになるんだ。\n@c1@"
"32":
  de: "@a@b*: Dann umsegel ich die Welt in meinem eigenen Kahn!\n@c1@"
  en: "@a@b*: I'm gonna sail all 'round the world in my ship, I am.\n@c1@"
  es: "@a@b*: Navegaré por to'l mundo.\n@c1@"
  fr: "@a@b*ⓢ Je naviguerai autour du monde dans mon bateau, pour de vrai.\n@c1@"
  it: "@a@b*: Girerò tutto lu munno con la nave mia.\n@c1@"
  ja: "@a@b＊「それで　世界中の海を\n\t船で旅するの。\n@c1@"
"33":
  de: "@a@b*: Wenn ich nur daran denke, wie wir damals das Schiff für Herrn Talun gebaut haben. Ach, war'n das noch Zeiten!\n@c0@"
  en: "@a@b*: When I look back now to buildin' that ship for Mr. Taloon... Ah, them were the days!\n@c0@"
  es: "@a@b*: Cuando me recuerdo de la construcción de ese barco p'al Señor Taloon... ¡Qué tiempos aquellos!\n@c0@"
  fr: "@a@b*ⓢ Quand je repense aujourd'hui à la construction de ce bateau pour Monsieur Taloon...\nAh, c'était le bon tempsⓠ\n@c0@"
  it: "@a@b*: Quanno ripenso che stavamo a costrui' la nave per Baldo Baldini... Ah, quelli sì erano tempi belli!\n@c0@"
  ja: "@a@b＊「トルネコのだんなの船を\n\tつくっていた時が　なつかしいぜ！\n@c0@"
"34":
  de: "@a@b*: Seither gab's hier keinen mehr mit genug Geld, um sich 'n Schiff bauen zu lassen.\n@c0@"
  en: "@a@b*: There en't bin no other beggars 'ere since then with enough cash to 'ave a ship built for 'em.\n@c0@"
  es: "@a@b*: No ha habido má' paisanos por aquí desde entonces con suficiente dinero como para que les construyéramos un barco.\n@c0@"
  fr: "@a@b*ⓢ Depuis, aucun autre client n'a eu assez d'argent pour se faire construire un navire.\n@c0@"
  it: "@a@b*: Da allora nun è venuto nisciuno con abbastanza soldi da poterse accatta' 'na nave.\n@c0@"
  ja: "@a@b＊「あれ以来　自分の金で\n\t船をつくろうなんて\n\tごうかいなヤツは現れねえしよお。\n@c0@"
"35":
  de: "@a@b*: Meint Ihr, dass er Recht hat?\nKönnt so eine wie ich wirklich der Göttin dienen? Bin mir da gar nich' so sicher.\n@c1@"
  en: "@a@b*: D'you reckon 'e's right? Could someone like me really go an' serve the Goddess? I en't so sure I could.\n@c1@"
  es: "@a@b*: ¿Será verdaⓘ lo que me cuenta este señor? ¿Podrá una moza como yo serviⓘ a la Diosa? No lo tengo yo muⓘ claro...\n@c1@"
  fr: "@a@b*ⓢ Vous croyez que c'est vraiⓡ Quelqu'un comme moi peut vraiment servir la Déesseⓡ\nJe n'en suis pas si sûre.\n@c1@"
  it: "@a@b*: Ma che dice 'sto tipo?! Anche 'na perzona come me potrebbe servire la dea?! Io tengo i miei tubbi\n@c1@"
  ja: "@a@b＊「愛があれば年の差なんて…などと\n\tそんなことを　本当に\n\t神さまが　おっしゃるのかしら？\n@c1@"
"36":
  de: "@a@b*: Was wollt Ihr? Ich, äh, bin gerade dabei, diese junge Dame in den Lehren des Glaubens zu unterweisen.\n@c2@"
  en: "@a@b*: What do you want? I, I was instructing this young lady in the teachings of the Goddess.\n@c2@"
  es: "@a@b*: ¿Qué %H860%Xquieres%Yqueréis%Z? Estaba enseñando a esta joven dama la palabra de la Diosa.\n@c2@"
  fr: "@a@b*ⓢ Qu'est-ce que vous voulezⓡ Je... J'étais en train d'apprendre à cette jeune demoiselle les enseignements de la Déesse.\n@c2@"
  it: "@a@b*: Cosa c'è? Io stavo spiegando a questa giovane e... ehm... avvenente fanciulla il verbo della dea.\n@c2@"
  ja: "@a@b＊「な　なんですか　あなたは？\n\tわ　わたしは　彼女に\n\t神の教えを　説いていただけですぞ。\n@c2@"
"37":
  de: "@a@b*: Nachts ist die Werft geschlossen. Wenn Ihr wissen wollt, was da drinnen vor sich geht, kommt am Morgen wieder.\n@c3@"
  en: "@a@b*: The dockyard's closed of a night.\nIf you wanna see what's goin' on inside, you'll 'ave to come back in the mornin'.\n@c3@"
  es: "@a@b*: El astillero está cerraⓘo por la noche.\nPara ver lo que pasa dentro %H860%Xtendrás%Ytendréis%Z que volveⓘ por la mañana.\n@c3@"
  fr: "@a@b*ⓢ Le chantier naval est fermé pendant la nuit.\nSi vous voulez voir c'qui s'passe à l'intérieur, faudra revenir demain matin.\n@c3@"
  it: "@a@b*: I cantieri stanno chiusi di notte.\nPe' vede' quello che succede là dentro, bisogna torna' di mattina.\n@c3@"
  ja: "@a@b＊「このドックは\n\t夜は　閉めてしまうのだ。\n\t中を見たければ　明日出直してきな！\n@c3@"
"38":
  de: "@a@b*: Ein eigenes Schiff...\nZzz...\n@c2@"
  en: "@a@b*: A ship o' me own...\nZzz...\n@c2@"
  es: "@a@b*: Mi propio barco...\nZzz...\n@c2@"
  fr: "@a@b*ⓢ Un bateau à moi...\nZzz...\n@c2@"
  it: "@a@b*: Una nave tutta mia...\nRonf...\n@c2@"
  ja: "@a@b＊「ああ　私の船がぁ……。\n\tぐうぐう……。\n@c2@"
"39":
  de: "@a@b*: !\n@c1@"
  en: "@a@b*: !!!\n@c1@"
  es: "@a@b*: ¡¡¡!!!\n@c1@"
  fr: "@a@b*ⓢ ⓐⓐⓐ\n@c1@"
  it: "@a@b*: !!!\n@c1@"
  ja: "@a@b＊「！！\n@c1@"
"40":
  de: "@a@b*: Tut ⓚⓛ tut mir leid!\nIch hab's mir nur mal genauer angeguckt, mehr nicht!\n@c1@"
  en: "@a@b*: I-I'm sorry!\nIt just took me fancy, is all...\n@c1@"
  es: "@a@b*: ¡Lo siento!\nEs que me gustaba, naⓘ más...\n@c1@"
  fr: "@a@b*ⓢ Je... Je suis désoléⓠ\nÇa m'a tenté, c'est tout...\n@c1@"
  it: "@a@b*: Mi-mi dispiace!\nM'era venuta la tentazione, tutto qua...\n@c1@"
  ja: "@a@b＊「す　すいません！\n\tつい　できごころで……。\n@c1@"
"41":
  de: "@a@b*: Ich war doch nur 'n winzigen Moment lang in Versuchung! Ich hab nichts geklaut, ehrlich! Ihr habt mich nie gesehen, ja?\n@c1@"
  en: "@a@b*: But I only thought about it. I never stole nothin'! Can't you pretend you never seen me?\n@c1@"
  es: "@a@b*: Pero solo lo he pensaⓘo. ¡Nunca he robaⓘo naⓘ! %H860%XHaz como que mirabas%YHaced como que mirábais%Z paⓘ otro laⓘo, ¿vale?\n@c1@"
  fr: "@a@b*ⓢ Mais j'y ai seulement pensé. Je n'ai jamais rien voléⓠ Vous pouvez faire comme si vous ne m'aviez jamais surprisⓡ\n@c1@"
  it: "@a@b*: Ci ho solo pensato, ma nun ho rubato gnente! Nun è che %H860%Xpuoi%Ypotete%Z fa' finta che nun %H860%Xm'hai%Ym'avete%Z visto?\n@c1@"
  ja: "@a@b＊「でも　盗もうとしただけで\n\tまだ盗んでいません。\n\tどうか　見逃してください……。\n@c1@"
"42":
  de: "@a@b*: Danke! Ich kann Euch leider nichts zum Dank anbieten. Außer... Ich könnt Euch vielleicht was erzählen...\n@c1@"
  en: "@a@b*: Thank 'e! I, I en't got nothin' to give you in return. 'Cept...I could tell you somethin'...\n@c1@"
  es: "@a@b*: ¡Gracias! No sé cómo %H860%Xagradecértelo%Yagradecéroslo%Z. Claro que... Tengo una información que %H860%Xte%Yos%Z podría interesar.\n@c1@"
  fr: "@a@b*ⓢ Merciⓠ Je... Je n'ai rien à vous donner en échange. Sauf... Sauf que je peux vous dire quelque chose...\n@c1@"
  it: "@a@b*: Grazie tante! Vorrei tanto %H860%Xringraziarti%Yringraziarvi%Z in qualche modo, ma nun c'ho gnente... Però 'na cosa la pozzo fa'...\n@c1@"
  ja: "@a@b＊「あ　ありがとうございます！\n\tお礼に　いいことを教えましょう。\n@c1@"
"43":
  de: "@a@b*: Ihr findet doch hin und wieder so kleine Medaillen? Wenn Ihr die alle einsammelt, könnt Ihr dafür was Schönes bekommen.\n@c1@"
  en: "@a@b*: You know them mini medals you find every now an' then? If you collect 'em all up, you can get some good treasure for 'em.\n@c1@"
  es: "@a@b*: ¿%H860%XSabes%YSabéis%Z esas minimedallas que tⓘencuentras de vez en cuando? Si se recogen, se pueⓘn conseguir buenos tesoros a cambio.\n@c1@"
  fr: "@a@b*ⓢ Vous savez, ces mini médailles que vous trouvez de temps à autreⓡ Si vous les ramassez toutes, vous pouvez obtenir un beau trésor en échange.\n@c1@"
  it: "@a@b*: %H860%XC'hai%YC'avete%Z presenti quelle minimedaglie che se trovano ogni tanto? Se %H860%Xle raccoji%Yle raccojete%Z tutte tutte, %H860%Xle puoi%Yle potete%Z scambia' cu 'nu bellu tesoro.\n@c1@"
  ja: "@a@b＊「ちいさなメダルを　集めておくと\n\tあとで　貴重な宝物と\n\t替えてもらえるそうですよ。\n@c1@"
"44":
  de: "@a@b*: Bitte! Gebt mir doch noch eine Chance!\n@c1@"
  en: "@a@b*: Please! Gimme another chance!\n@c1@"
  es: "@a@b*: ¡Por favor! ¡%H860%XDame%YDadme%Z otra oportunidad!\n@c1@"
  fr: "@a@b*ⓢ S'il vous plaîtⓠ Donnez-moi une autre chanceⓠ\n@c1@"
  it: "@a@b*: Per favore! %H860%XDammi%YDatemi%Z 'n'altra possibilità!\n@c1@"
  ja: "@a@b＊「そんなこと言わずに　お願いです。\n\t見逃してください！\n@c1@"
"45":
  de: "@a@b*: Ihr findet doch hin und wieder so kleine Medaillen? Wenn Ihr die alle einsammelt, könnt Ihr dafür was Schönes bekommen.\n@c1@"
  en: "@a@b*: You know them mini medals you find every now an' then? If you collect 'em all up, you can get some good treasure for 'em.\n@c1@"
  es: "@a@b*: ¿%H860%XSabes%YSabéis%Z esas minimedallas que tⓘencuentras de vez en cuando? Si se recogen, se pueⓘn conseguir buenos tesoros a cambio.\n@c1@"
  fr: "@a@b*ⓢ Vous savez, ces mini médailles que vous trouvez de temps à autreⓡ Si vous les ramassez toutes, vous pouvez obtenir un beau trésor en échange.\n@c1@"
  it: "@a@b*: %H860%XC'hai%YC'avete%Z presenti quelle minimedaglie che se trovano ogni tanto? Se %H860%Xle raccoji%Yle raccojete%Z tutte tutte, %H860%Xle puoi%Yle potete%Z scambia' cu 'nu bellu tesoro.\n@c1@"
  ja: "@a@b＊「ちいさなメダルを　集めておくと\n\tあとで　貴重な宝物と\n\t替えてもらえるそうですよ。\n@c1@"
"46":
  de: "@a@b*: An diesem Herrn Talun sollten wir uns alle ein Beispiel nehmen. Na ja, wenigstens wir Geschäftsleute.\n@c2@"
  en: "@a@b*: That Mr. Taloon's an example to us all.\nWell, all us traders, any'ow.\n@c2@"
  es: "@a@b*: Ese señor Taloon es un ejemplo paⓘ toⓘs.\nBueno, paⓘ los mercaderes, claro.\n@c2@"
  fr: "@a@b*ⓢ Ce Monsieur Taloon est un exemple pour nous tous.\nEnfin... pour nous autres commerçants, en tout cas.\n@c2@"
  it: "@a@b*: Quel Baldo Baldini è n'esempio pe' tutti noi.\nInsomma, almeno pe' noi commercianti.\n@c2@"
  ja: "@a@b＊「トルネコさんは　まったく\n\t武器屋のカガミですな！\n@c2@"
"47":
  de: "@a@b*: Ich mein, erst hatte er einen eigenen Laden. Dann ein eigenes Schiff.\n㈡\n*: Und jetzt will er auf der Suche nach einer legendären Waffe um die Welt segeln. Was für ein Kerl!\n@c2@"
  en: "@a@b*: I mean, first it was 'is own shop. Then 'is own ship. And now 'e's plannin' to sail 'round the world looking for some legend'ry weapon.\n㈡\n*: What a feller!\n@c2@"
  es: "@a@b*: Porque primero tuvo tienda propia. Luego barco propio. Y ahora quiere viajar por toⓘl mundo paⓘ buscar no sé qué arma legendaria.\n㈡\n*: ¡Qué narices!\n@c2@"
  fr: "@a@b*ⓢ D'abord, son propre magasin. Puis son propre navire. Et maintenant, il envisage de faire le tour du monde à la recherche d'une arme légendaire.\n㈡\n*ⓢ Quel hommeⓠ\n@c2@"
  it: "@a@b*: Prima s'è fatto un negozio, poi se compra 'na nave. Mò vuole naviga' in tutto lu munno per cerca' 'st'arma leggendaria.\n㈡\n*: Che personaggio!\n@c2@"
  ja: "@a@b＊「自分で船を買って　世界をまわり\n\t伝説の武器を　探すつもりとか。\n\tいや～　たいしたものです。\n@c2@"
"48":
  de: "@a@b*: Ich sag Euch was... Hick! Einesch Tagesch hab ich auch 'nen Haufen Gold un' mein eignesch Schiff!\n@c3@"
  en: "@a@b*: Let me tell you summat...\nI'll get meself a stack o' gold an' ⓚⓛ Hic! ⓚⓛ 'ave me own ship one day, too...\n@c3@"
  es: "@a@b*: %H860%XTe%YOs%Z voy a deciⓘ una cosa...\nVoy a conseguir un montón dⓘoro y... ¡hip!... un día yo también tendré mi propio barco...\n@c3@"
  fr: "@a@b*ⓢ Laissez-moi vous dire un truc...\nMoi aussi, un jour, j'amasserai de l'or et ⓚ hicⓠ ⓚ j'aurai mon propre bateau...\n@c3@"
  it: "@a@b*: %H860%XShai che ti%YShapete che vi%Z dico?\nUn giorno mi farò un shacco di sholdi e... Hic! Anch'io mi comprerò una nave...\n@c3@"
  ja: "@a@b＊「よう！　聞いてくれよ！\n\tそりゃあ　オレも金をためて\n\tいつかは自分の船を持ちてえよ……。\n@c3@"
"49":
  de: "@a@b*: Das Problem ischt nur ⓚⓛ Hick! ⓚⓛ wennich Geld in meine Hände kriege, geb ich es gleich wieder aus für ⓚⓛ Hick! Ach, Ihr wisst schon...\n@c3@"
  en: "@a@b*: Only problem is, ⓚⓛ Hic! ⓚⓛ soon as I get meself any coins, I fritter 'em away onⓚⓛ Hic! Well, you know what...\n@c3@"
  es: "@a@b*: Solo hay un problema... ¡Hip! En cuanto consigo unas monedas, me las gasto en... ¡Hip! Bueno, no hace falta que lo diga...\n@c3@"
  fr: "@a@b*ⓢ Le seul problème ⓚ hicⓠ ⓚ c'est que dès que j'ai un peu de sous, j'les dépense en ⓚ hicⓠ ⓚ enfin, vous voyez, quoi...\n@c3@"
  it: "@a@b*: Ho un sholo problema... Hic! Appena mi fashio due spiccioli, me li shpendo subito in... Hic! Vabbè, non ci vuole tanta fantashia per capirlo... \n@c3@"
  ja: "@a@b＊「でもよお……金があると\n\tついつい　飲んじまうんだ！\n\t悲しいよなあ。　うっうっ……。\n@c3@"
"50":
  de: "@a@b*: HICK! ... Oh, 'tschuldigung! War 'n büschen laut... Jetzt komme ich von so weit her, und dann sind die ganzen verflixten Karten ausverkauft!\n@c2@"
  en: "@a@b*: HIC! ...Scuse me! 'E was a big'un!\nI come all this way for one o' them maps, an' they'm all blimmin' sold out!\n@c2@"
  es: "@a@b*: ¡HIP! P-perdón... ¡Era un hipo de los grandes!\nVengo hasta aquí paⓘ comprar uno de esos mapas, ¡y resulta que sⓘhan acabaⓘo!\n@c2@"
  fr: "@a@b*ⓢ HICⓠ ... Excusez-moiⓠ Sacré hoquet, celui-làⓠ\nJ'ai fait tout ce chemin pour une de ces maudites cartes, et il n'en reste plus une seuleⓠ\n@c2@"
  it: "@a@b*: Hic! Queshta shì che è bella!\nShono venuto fin qua per una dannatishima mappa, ma shono tutte eshaurite!\n@c2@"
  ja: "@a@b＊「ヒック！……うっ。\n\tせっかく地図を買いにきたのに\n\t品切れだって……。\n@c2@"
"51":
  de: "@a@b*: Sie sagte, sie hätte sie aus Mintos bekommen.\n@c2@"
  en: "@a@b*: She said she got 'em from Mintos.\n@c2@"
  es: "@a@b*: Ha dicho que se los traían de Mintos.\n@c2@"
  fr: "@a@b*ⓢ Elle m'a dit qu'elle les avait reçues de Ringys.\n@c2@"
  it: "@a@b*: Ha detto che le aveva preshe a Mintos.\n@c2@"
  ja: "@a@b＊「そこの地図屋の話だと\n\t地図はミントスから\n\t仕入れているとか……。\n@c2@"
"52":
  de: "@a@b*: Aber das ist mir egal. Hick! Ich will bloß wissen, wann sie wieder welche reinbekommt.\n@c2@"
  en: "@a@b*: But I don't care about that. Hic! All I wanna know's when she's gettin' some more in stock. Hic!\n@c2@"
  es: "@a@b*: Pero eso me da igual. ¡Hip! Solo quiero sabeⓘ cuándo volverá a teneⓘ más en la tienda. ¡Hip!\n@c2@"
  fr: "@a@b*ⓢ Mais je m'en fiche. Hicⓠ Tout ce que je veux savoir, c'est quand elle en aura à nouveau en stock. Hicⓠ\n@c2@"
  it: "@a@b*: Ma che me ne importa da dove vengono! Hic! Io vojo shapere sholo she ne arriveranno altre. Hic!\n@c2@"
  ja: "@a@b＊「もう　つぎ入ってくるのは\n\tいつになるんだろ？\n\tヒック！\n@c2@"
"53":
  de: "@a@b*: Nach wem suchtet ihr doch gleich? Ach so. Vor Kurzem erst waren drei Leute hier.\n@c2@"
  en: "@a@b*: Who's it you're lookin' for again?\nAr, well. There was this group o' three folk here not so long back.\n@c2@"
  es: "@a@b*: ¿A quién %H860%Xdices que buscas%Ydecís que buscáis%Z?\n¡Ah!, vale. Hace no mucho pasó por aquí un grupo de tres personas.\n@c2@"
  fr: "@a@b*ⓢ Qui cherchez-vous, déjà ⓡ\nAh, oui. Il y avait ce groupe de trois personnes, il n'y a pas longtemps.\n@c2@"
  it: "@a@b*: Chi è che %H860%Xstai%Ystate%Z a cerca'?\nAh sì. Fino a poco fa qui ci stava 'nu gruppo di tre persone.\n@c2@"
  ja: "@a@b＊「誰かを探しての旅かい？\n\tそういえば　少し前\n\tおかしな　３人組が来たよ。\n@c2@"
"54":
  de: "@a@b*: Eine Prinzessin und zwei Männer. Sagte, sie suchten nach Psaro dem Metzler oder so. Würdet Ihr das glauben?\n@c2@"
  en: "@a@b*: Some princess an' a couple o' lads. Said they was lookin' for some feller by the name o' Psaro the Manslayer. You wun't credit it, would you?\n@c2@"
  es: "@a@b*: No sé qué princesa y un par de mozos. Decían que buscaban a un tipo llamaⓘo Psaro el Carnicero. Yo no me lo creí demasiaⓘo.\n@c2@"
  fr: "@a@b*ⓢ Une princesse et deux types.\nIls ont dit qu'ils cherchaient un certain Psaro l'Exterminateur. Vous y croyez, vousⓡ\n@c2@"
  it: "@a@b*: 'Na principessa e 'nu paro di ragazzi. Stavano a cerca' 'nu tizio chiamato Psaro lu Massacratore. Stavano a scherza', giusto?\n@c2@"
  ja: "@a@b＊「お姫さまと　お供のふたりで\n\tなんでも　デスピサロとかいう男を\n\tさがしてるって　言ってたな。\n@c2@"
"55":
  de: "@a@b*: Ihr seid nich' von hier, was? Wie wär's mit 'ner Partie Armdrücken? Ich bin die hiesige Meisterin, wisst Ihr!\n@c1@"
  en: "@a@b*: You en't from 'round 'ere, are you? Fancy an arm wrestle? I'm the local champ, you know.\n@c1@"
  es: "@a@b*: No %H860%Xeres%Ysois%Z de por aquí, ¿verdaⓘ?\n¿%H860%XQuieres%YQueréis%Z echaⓘ un pulso? ¡Soy la mejoⓘ del lugar!\n@c1@"
  fr: "@a@b*ⓢ Vous n'êtes pas du coin, dites-moiⓡ\nUn bras de fer, ça vous ditⓡ\nJe suis la championne en titre, vous savez.\n@c1@"
  it: "@a@b*: Nun %H860%Xsei%Ysiete%Z di 'ste parti, vero? Che %H860%Xte va%Yve va%Z de fa' a braccio di ferro? A me nun me batte nisuno!\n@c1@"
  ja: "@a@b＊「この店は　初めて？\n\tねえ　たっぷりサービスするから\n\tあたしと朝まで　つき合わない？\n@c1@"
"56":
  de: "@a@b*: Na, also so ein Frechdachs! Das war doch nicht ernst gemeint! Ihr macht mich ja ganz wuschig!\n@c1@"
  en: "@a@b*: Get away, you cheeky beggar!\nI weren't serious! You've gone an' made me feel all funny now.\n@c1@"
  es: "@a@b*: ¡Largo de aquí, caradura!\n¡No hablaba en serio! Ahora has hecho que me sienta rara.\n@c1@"
  fr: "@a@b*ⓢ Partez d'ici, %H860%X%A120%Xpetit impertinent%Z%B120%Xpetite impertinente%Z%Y%R000%Xpetites impertinentes%Ypetits impertinents%Z%Zⓠ\nJe plaisantaisⓠ C'est assez vexant.\n@c1@"
  it: "@a@b*: Ahò, ma che %H860%Xc'hai%Yc'avete%Z creduto davero? Io stavo a scherza'! Io so' 'na donna delicata, mica 'no scaricatore de porto!\n@c1@"
  ja: "@a@b＊「やだー。\n\t冗談に決まってるでしょ。　うふっ。\n@c1@"
"57":
  de: "@a@b*: Ha-püh...\n@c2@"
  en: "@a@b*: Ah-phew...\n@c2@"
  es: "@a@b*: Ah-fiuu...\n@c2@"
  fr: "@a@b*ⓢ Ron-pfff...\n@c2@"
  it: "@a@b*: Ronf!\n@c2@"
  ja: "@a@b＊「ぐうぐう……。\n@c2@"
"58":
  de: "@aTorneko@bHa-püh... Ha-püh...\nTessa, mein Blümchen... Timo-püh...\nIch komm bald wieder nach Haus...\n@c2@"
  en: "@aTorneko@bArgh-phew... Argh-phew...\nTessie, me ole flower... Tipper-phew...\nI'll be home-phew...\n@c2@"
  es: "@aTorneko@bArgh, fiuuu... Argh, fiuuu...\nTrakiba, mi amiada floriecilla... Tarik, fiuuu...\nEstarié en casa, fiuuu...\n@c2@"
  fr: "@aTorneko@bRon-pfff... Ron-pfff...\nLucille, ma beauté... Achille-pfff...\nJe vais rentrer-pfff...\n@c2@"
  it: "@aBaldo@bRonf... Ronf...\nBalduccio... Sarò presto a casa...\nAmore mio, Beatr-ronf... \n@c2@"
  ja: "@a@bトルネコ「う～ん……ネネ…ポポロ……\n\tお父さんは……むにゃむにゃ。\n@c2@"
"59":
  de: "@a@b*: Ha-ha-ha-...püh...\nHa-püh...\n@c2@"
  en: "@a@b*: Ah-ah-ah-...phew...\nAh-phew...\n@c2@"
  es: "@a@b*: ¡Ah-ah-ah, fiuuu!\nAh-fiuu...\n@c2@"
  fr: "@a@b*ⓢ Ron-ron-ron... pfff...\nRon-pfff...\n@c2@"
  it: "@a@b*: Ronf ronf...\nRonf...\n@c2@"
  ja: "@a@b＊「ンゴゴゴ……ゴゴ。\n@c2@"
"60":
  de: "@a@b*: %H860%X%A120%XFurchtloser Reisender%Z%B120%XFurchtlose Reisende%Z%YFurchtlose Reisende%Z! Geht, wenn Ihr gehen wollt.\n@c2@"
  en: "@a@b*: Fearless %H860%Xwanderer%Ywanderers%Z.\nGo if you wish to go...\n@c2@"
  es: "@a@b*: %H860%X%A120%XViajero impávido%Z%B120%XViajera impávida%Z%Y%R000%XViajeras impávidas%YViajeros impávidos%Z%Z.\n%H860%XVe%YId%Z si ese es %H860%Xtu%Yvuestro%Z deseo...\n@c2@"
  fr: "@a@b*ⓢ %H860%X%A120%XAventurier%Z%B120%XAventurière%Z%Y%R000%XAventurières%YAventuriers%Z%Z sans peur.\nPartez si vous le souhaitez...\n@c2@"
  it: "@a@b*: %H860%XAudace viandante, va'%YAudaci viandanti, andate%Z pure, se è quello che %H860%Xdesideri%Ydesiderate%Z...\n@c2@"
  ja: "@a@b＊「おそれを知らぬ者よ。\n\tゆきたければ　ゆくがよい……。\n@c2@"
"61":
  de: "@a@b*: Aber Eurem Schicksal könnt Ihr nicht entkommen. Euer Schiff wird in sein wässriges Verderben segeln...\n@c2@"
  en: "@a@b*: But you cannot escape destiny.\nYour ship will find a watery grave...\n@c2@"
  es: "@a@b*: Pero no se pueⓘ huir del destino.\n%H860%XTu%YVuestro%Z barco hallará eterno reposo en el fondo del mar...\n@c2@"
  fr: "@a@b*ⓢ Mais vous ne pourrez échapper à votre destin.\nL'océan sera la tombe de votre navire...\n@c2@"
  it: "@a@b*: Ma non %H860%Xpuoi sfuggire al tuo%Ypotete sfuggire al vostro%Z destino.\nQuella nave sarà la %H860%Xtua%Yvostra%Z tomba sul mare...\n@c2@"
  ja: "@a@b＊「しかし　必ずや\n\tお前たちの船は\n\t海のもくずと　消えるであろう……。\n@c2@"
"62":
  de: "@a@b*: Mein Mann macht sich immer Sorgen.\n@c2@"
  en: "@a@b*: My 'usband's always frettin'.\n@c2@"
  es: "@a@b*: Mi maríⓘo siempre se preocupa.\n@c2@"
  fr: "@a@b*ⓢ Mon mari est toujours en train de s'inquiéter.\n@c2@"
  it: "@a@b*: Lu marito mio se preoccupa troppo.\n@c2@"
  ja: "@a@b＊「まったく　うちの人ったら\n\tうじうじと考えてばかりいて……。\n@c2@"
"63":
  de: "@a@b*: Auf mich hört er ja nicht. Darum wird er doch kahl.\n㈡\n*: Versucht Ihr mal, ob Ihr bei ihm etwas ausrichten könnt. Er soll nicht dauernd rumzappeln, sondern endlich schlafen.\n@c2@"
  en: "@a@b*: I've tried to tell him. That's why 'e's goin' bald, you know. See if you can get through to 'im. Tell him to stop fidgetin' and go to sleep.\n@c2@"
  es: "@a@b*: Yo ya le digo que es por eso que sⓘestá quedando calvo. A ver si %H860%Xtú le puedes%Y%R000%Xvosotras%Yvosotros%Z le podéis%Z hacer razonaⓘ. %H860%XDile%YDecidle%Z que se deje de nervios y se vaya a dormir.\n@c2@"
  fr: "@a@b*ⓢ J'ai essayé de lui dire. C'est pour ça qu'il perd ses cheveux. Voyez si vous pouvez lui parler.\nDites-lui d'arrêter de s'agiter et d'aller se coucher.\n@c2@"
  it: "@a@b*: Ho provato a dijelo. Sta a perde' tutti li capelli pe' l'ansia! %H860%XProva a parlarci tu%YProvate a parlarci voi%Z. %H860%XConvincilo%YConvincetelo%Z a darse 'na calmata e ad anna' a dormi'.\n@c2@"
  ja: "@a@b＊「だから　ハゲるんですよ。\n\tあなたからも　早く寝るように\n\t言ってくださいな。\n@c2@"
"64":
  de: "@aTorneko@bDas habt Ihr gut gemacht, ja, wirklich! Wie schön, endlich wieder all die Schiffe zu sehen, nachdem Ihr die scheußliche Flamme gelöscht habt.\n@c2@"
  en: "@aTorneko@bYerra, 'tis a grand job ye've done, so it is!\nLook how nicely all the ships are sailin' now that nasty flame's been put out by %H860%Xyerself%Yyerselves%Z.\n@c2@"
  es: "@aTorneko@bFantiástico triabajo el que %H860%Xha%Yhabiéis%Z hecho, ¡ya lo creo!\nFíjiate qué bionitos los biarcos niavegando, ahora que %H860%Xusted ha%Yustedes han%Z apiagado esa maliéfica llama.\n@c2@"
  fr: "@aTorneko@bVraiment, c'est un boulot fantastique que vous avez fait làⓠ\n㈡\nRegardez comme c'est beau, tous ces bateaux qui naviguent maintenant que vous avez éteint ces vilaines flammes.\n@c2@"
  it: "@aBaldo@b%H860%XTe tu ha'%YVoi avete%Z fatto un gran bel lavoro!\nOra che quelle fiamme malvagie so' spente, le navi possono parti' di novo senza problemi. \n@c2@"
  ja: "@a@bトルネコ「よくやってくれました！\n\t邪悪な炎も消えて　ほら\n\t海もあんなに　おだやかです。\n@c2@"
"65":
  de: "@aTorneko@bMein eigenes Schiff ist jetzt auch so weit. Ich bin froh wie der Mops im Paletot, ja, wirklich!\n@c2@"
  en: "@aTorneko@bMe own ship's all boxed off now as well, ye know. I'm as happy as Larry, so I am.\n@c2@"
  es: "@aTorneko@bMi priopio barco está listo. Estoy más fieliz que una lombriz.\n@c2@"
  fr: "@aTorneko@bDésormais, mon propre navire est prêt, lui aussi.\nJe suis heureux comme un pape.\n@c2@"
  it: "@aBaldo@bLa mi' nave l'è bell'e'ppronta! So' contento home 'un cinghialotto.\n@c2@"
  ja: "@a@bトルネコ「そして　うれしいことに\n\tわたしの船も完成しました！\n@c2@"
"66":
  de: "@aTorneko@bAber ich wollt Euch was fragen. Ich hab mir unter den Ungeheuern anscheinend 'n paar Feinde gemacht, und die sind jetzt hinter mir her.\n@c2@"
  en: "@aTorneko@bActually, though, I've a bit of a favour to be askin' ye. It seems I've made a few enemies among the monsters an' they're after me, like.\n@c2@"
  es: "@aTorneko@bBueno, en rialidad mi gustaría piedir un pequieño favor. Pariece que tengo algunos eniemigos entre los monstruos y mi están biuscando.\n@c2@"
  fr: "@aTorneko@bJ'aurais toutefois une petite faveur à vous demander. On dirait que je me suis fait quelques ennemis parmi les monstres.\n㈡\nEt ils me pourchassent, voyez-vous.\n@c2@"
  it: "@aBaldo@bIn realtà, c'ho un favore da %H860%Xchiederti%Ychiedervi%Z. Pare ch'io mi sia fatto un po' di nemici fra i mostri, e ora huesti birbanti mi diano la haccia.\n@c2@"
  ja: "@a@bトルネコ「そこで　お願いがあるのですが\n\tじつは　わたしは魔物たちに\n\tうらまれているようなのです。\n@c2@"
"67":
  de: "@aTorneko@bUnd wenn ich mit %H860%X%A120%Xeinem strammen Burschen%Z%B120%Xeinem starken Mädel%Z%Yein paar kräftigen Leuten%Z wie Euch reisen könnte, würd ich mich viel sicherer fühlen.\n@c2@"
  en: "@aTorneko@bSo I was thinkin', if I could maybe travel along with %H860%Xa strong %A120%Xfeen%Z%B120%Xwan%Z like yerself%Ya few tough articles like yerselves%Z, I'd feel a lot more secure altogether.\n@c2@"
  es: "@aTorneko@bY estiaba pensando que quizá podría viajar con %H860%X%A120%Xun hombrie fuerte%Z%B120%Xuna mujier fuerte%Z como usted%Y%R000%Xunas mujieres fuertes%Yunos tipos duros%Z como ustedes%Z. Mi sentiría mucho más sieguro si viajáramos jiuntos, sí.\n@c2@"
  fr: "@aTorneko@bAlors je me disais que si je pouvais éventuellement voyager avec %H860%X%A120%Xun type costaud%Z%B120%Xune femme robuste%Z%Ydes personnes robustes%Z comme vous, je me sentirais bien plus en sécurité.\n@c2@"
  it: "@aBaldo@bCosì ho pensato che se potessi viaggia' co' %H860%Xuna persona tosta come te%Yde' tipi tosti come voi%Z, mi sentirei più al sihuro.\n@c2@"
  ja: "@a@bトルネコ「でも　あなたがたのような\n\t強い人たちと一緒なら\n\tとても　心強いでしょう。\n@c2@"
"68":
  de: "@aTorneko@bKönnen wir uns auf der Reise nicht zusammentun? Wollt Ihr mich mitnehmen?\n@c2@"
  en: "@aTorneko@bCan we maybe join forces an' travel the world together? Will ye have me?\n@c2@"
  es: "@aTorneko@b¿Podríamos unir nuestras fuerzas y viajiar juntos por el mundo? ¿Mi %H860%Xaceptiaría%Yacieptarían%Z en su grupo?\n@c2@"
  fr: "@aTorneko@bPeut-être que nous pourrions unir nos forces et voyager ensemble de par le mondeⓡ\nM'accepteriez-vous à vos côtésⓡ\n@c2@"
  it: "@aBaldo@bMagari possiamo gira' i'mmondo 'nsieme? Che %H860%Xmi dici%Ymi dite%Z?\n@c2@"
  ja: "@a@bトルネコ「わたしも仲間にしてください。\n\t一緒に　世界中を\n\tまわろうじゃありませんか！？\n@c2@"
"69":
  de: "@aTorneko@bIhr nehmt mich mit? Ach, das ist ja pfundig! Na dann! Packen wir's?\n@c2@"
  en: "@aTorneko@bYe will? Oh, that's grand.\nRight, then. Are we all fit?\n@c2@"
  es: "@aTorneko@b¿Sí? ¡Oh!, eso es estiupendo.\nDe acuerdo entionces. ¿Tiodo listo?\n@c2@"
  fr: "@aTorneko@bVous êtes d'accordⓡ Oh, c'est fantastique.\nParfait, alors. Tout le monde est prêtⓡ\n@c2@"
  it: "@aBaldo@bDavvero? Maremma bonina, so' proprio hontento!\nAllora, che si fa? Si va?\n@c2@"
  ja: "@a@bトルネコ「おお　ありがたい！\n\tでは　まいりましょう。\n@c2@"
"70":
  de: "@aTorneko@bWas ist das? Euer Planwagen? Ja, klar kann der mit. Auf meinem Schiff ist jede Menge Platz für einen Wagen.\n@c2@"
  en: "@aTorneko@bWhat's that? Yer wagon?\nAye, o' course it can. There's plenty o' room on me ship fer a wagon.\n@c2@"
  es: "@aTorneko@b¿Qué es eso? ¿Su carriomato?\nSí, por supuesto que cabie. Hay sitio de sobra en mi biarco para un carriomato.\n@c2@"
  fr: "@aTorneko@bPardonⓡ Votre chariotⓡ\nOui, bien sûr que c'est possible. Il y a largement assez de place pour un chariot sur mon bateau.\n@c2@"
  it: "@aBaldo@bCome? I'%H860%Xttu'%Yvvostro%Z harro?\nCerto che ci sta. C'è un monte di spazio sulla mi' nave.\n@c2@"
  ja: "@a@bトルネコ「え？　馬車ですか？\n\tもちろん馬車も　船に\n\t乗り込むことが出来ますよ。\n@c2@"
"71":
  de: "@aTorneko@bAlso gut. Dann sind wir so weit!\n@c2@"
  en: "@aTorneko@bSo, then. Let's be makin' tracks!\n@c2@"
  es: "@aTorneko@bMuy bien. Pongámionos en miarcha.\n@c2@"
  fr: "@aTorneko@bAllons-y, alors. Il est temps de mettre les voilesⓠ\n@c2@"
  it: "@aBaldo@bBene! Forza, si va!\n@c2@"
  ja: "@a@bトルネコ「さあ　まいりましょう！\n@c2@"
"72":
  de: "@a@bTorneko schließt sich der Gruppe an!\n@c2@"
  en: "@a@bTorneko joins the party!\n@c2@"
  es: "@a@bTorneko se une al grupo.\n@c2@"
  fr: "@a@bTorneko rejoint l'équipeⓠ\n@c2@"
  it: "@a@bBaldo si unisce al gruppo!\n@c2@"
  ja: "@a@bトルネコが　仲間にくわわった！\n@c2@"
"73":
  de: "@aTorneko@bLos geht's! Auf zu all den unerforschten Ländern und vergessenen kleinen Inselchen dieser Welt!\n@c2@"
  en: "@aTorneko@bTime to set sail fer all the unexplored lands an' forgotten little islands in the world!\n@c2@"
