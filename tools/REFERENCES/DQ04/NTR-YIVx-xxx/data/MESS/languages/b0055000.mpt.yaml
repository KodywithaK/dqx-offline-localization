"0":
  de: "@a@b*: Land ahoi! Der Hafen von Endor! Anker werfen!\n@c2@"
  en: "@a@b*: Land ahoy!\nPull in to Endor harbour and cast anchor!\n@c2@"
  es: "@a@b*: ¡Tierra a la vista!\n¡Entrad en el puerto de Endor y echad el ancla!\n@c2@"
  fr: "@a@b*ⓢ Terre en vueⓠ\nJetez l'ancre et sortez la passerelleⓠ\n@c2@"
  it: "@a@b*: Terra in vista!\nEntrare nel porto di Endor e gettare l'ancora!\n@c2@"
  ja: "@a@b＊「船が着いたぞー！\n\tエンドールの国だぞー！\n@c2@"
"1":
  de: "@a@bUnd so mussten Mina und Maya das Land verlassen, das ihnen ein Zuhause geworden war, ohne ihren Rachefeldzug abgeschlossen zu haben.\n@c0@"
  en: "@a@bAnd so Meena and Maya were forced to leave the place they'd come to call home with their mission of revenge still incomplete.\n@c0@"
  es: "@a@bY así fue como Meena y Maya se vieron obligadas a abandonar el lugar que consideraban su hogar y a posponer su misión de venganza.\n@c0@"
  fr: "@a@bC'est ainsi que Mina et Maya furent forcées de quitter leur pays sans avoir pu mener à bien leur missionⓢ venger la mort de leur père.\n@c0@"
  it: "@a@bFu così che Myra e Maya dovettero lasciare il luogo che consideravano la loro nuova patria, senza essere riuscite a vendicare la morte del padre.\n@c0@"
  ja: "@a@bこうして　マーニャとミネアのふたりは\n思いをとげられぬまま\nふるさとの国を　出たのでした。\n@c0@"
"2":
  de: "@a@bDoch wo war die Macht des Lichts, die ihnen zu Hilfe eilen sollte?\n@c0@"
  en: "@a@bWhat was the force of light they had been told would come to their aid?\n@c0@"
  es: "@a@b¿Cómo les ayudaría la fuerza luminosa de la que habían oído hablar?\n@c0@"
  fr: "@a@bQuelle est donc cette force bienveillante qui, leur\na-t-on dit, doit venir à leur secoursⓡ\n@c0@"
  it: "@a@bMa cos'era quella forza di luce che sarebbe venuta in loro soccorso?\n@c0@"
  ja: "@a@b自分たちを　助けてくれる\nか細く　小さな光とは？\n@c0@"
"3":
  de: "@a@bAuf der Suche nach dieser Macht beginnt für sie nun ein neues Abenteuer in einem gänzlich fremden Land.\n@c0@"
  en: "@a@bTheir adventures now began anew as they set off to discover the mystery of the light in this strange new land.\n@c0@"
  es: "@a@bSus aventuras acababan de empezar, un nuevo viaje lleno de descubrimientos en una tierra desconocida.\n@c0@"
  fr: "@a@bElles le découvriront peut-être à l'occasion des nouvelles aventures qui les attendent dans ce pays inconnu.\n@c0@"
  it: "@a@bLo avrebbero scoperto nella loro nuova avventura: le attendeva un viaggio pieno di sorprese in una terra sconosciuta.\n@c0@"
  ja: "@a@bその光を　探すため\n再び　ふたりの旅が始まったのです。\n@c0@"
"4":
  de: "@a@bMöchtest du die bisherigen Geschehnisse im Abenteuertagebuch speichern?\n@c0@"
  en: "@a@bWould you like to save the story so far in your adventure log?\n@c0@"
  es: "@a@b¿Quieres guardar la historia hasta el momento en tu registro de aventuras?\n@c0@"
  fr: "@a@bVoulez-vous sauvegarder votre aventure dans votre journalⓡ\n@c0@"
  it: "@a@bVuoi salvare i tuoi progressi nel diario dell'avventura?\n@c0@"
  ja: "@a@bここまでの　お話を\n冒険の書に　記録します。\nよろしいですか？\n@c0@"
"5":
  de: "@a@bWirklich weiter zum nächsten Kapitel, ohne den Fortschritt zu speichern?\n@c0@"
  en: "@a@bAre you sure you want to move on to the next chapter without saving your progress?\n@c0@"
  es: "@a@b¿Seguro que deseas pasar al siguiente capítulo sin guardar los avances?\n@c0@"
  fr: "@a@bVoulez-vous vraiment passer au chapitre suivant sans sauvegarder votre progressionⓡ\n@c0@"
  it: "@a@bVuoi davvero passare al capitolo successivo senza salvare i tuoi progressi nell'avventura?\n@c0@"
  ja: "@a@bそれでは　記録しないで\n次章にすすみます。\nよろしいですか？\n@c0@"
