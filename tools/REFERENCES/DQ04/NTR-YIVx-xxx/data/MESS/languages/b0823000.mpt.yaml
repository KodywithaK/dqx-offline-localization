"0":
  de: "@a@b*: Willkommen in der Monsterarena, wo Monster von nah und fern zusammenkommen, um ihre Kräfte zu messen!\n@c2@"
  en: "@a@b*: Welcome to the Monster Arena, where monsters from far and wide gather together to pit their skills against each other!\n@c2@"
  es: "@a@b*: ¡%A120%XBienvenido%Z%B120%XBienvenida%Z a la Arena de Monstruos, en donde monstruos de todos los lugares del mundo se reúnen para medir sus fuerzas!\n@c2@"
  fr: "@a@b*ⓢ Bienvenue dans l'Arène des monstres, le seul endroit où les monstres se réunissent pour mesurer leurs forcesⓠ\n@c2@"
  it: "@a@b*: %A120%XBenvenuto%Z%B120%XBenvenuta%Z alla Fossa dei Mostri, dove creature da tutto il mondo si ritrovano per sfidarsi in entusiasmanti combattimenti!\n@c2@"
  ja: "@a@b＊「古今東西の　モンスターたちが\n\t技を　競いあう　手に汗にぎる\n\t格闘場は　こちら！\n@c2@"
"1":
  de: "@a@b*: Könnt Ihr vorhersagen, wer gewinnen wird? Dann lasst Eure Geldbörse sprechen und heimst monströse Preise ein!\n@c2@"
  en: "@a@b*: Can you predict who'll win?\nPut your money where your mouth is, and you could be in for some monstrously big winnings!\n@c2@"
  es: "@a@b*: ¿Puede predecir el ganador?\n¡Apoye sus predicciones con una apuesta y podrá obtener monstruosos beneficios!\n@c2@"
  fr: "@a@b*ⓢ Saurez-vous trouver le vainqueurⓡ\nMisez sur votre favori et vous gagnerez peut-être le gros lotⓠ\n@c2@"
  it: "@a@b*: Chi vincerà? Se punterai sul cavallo giusto... Ehm, volevo dire, sul mostro giusto, potrai portare a casa delle vincite stratosferiche!\n@c2@"
  ja: "@a@b＊「どのモンスターが　勝つか？\n\tズバリ当てて　ガッポリもうけましょう！\n@c2@"
"2":
  de: "@a@b*: Das sind die Kontrahenten, die im nächsten Kampf antreten werden. Auf welches Monster wollt Ihr setzen?\n@c2@"
  en: "@a@b*: Here's the line-up for the next fight.\nWhich monster do you want to back?\n@c2@"
  es: "@a@b*: Esta es la formación para el siguiente combate.\n¿Por qué monstruo desea apostar?\n@c2@"
  fr: "@a@b*ⓢ Voici l'affiche du prochain combat.\nSur quel monstre allez-vous parierⓡ\n@c2@"
  it: "@a@b*: Ecco i combattenti per il prossimo scontro.\nSu quale mostro vuoi puntare?\n@c2@"
  ja: "@a@b＊「つぎの試合の　モンスターと\n\t倍率は　これです。\n\tどのモンスターに　かけますか？\n@c2@"
"3":
  de: "@a@b*: Ach herrje! Es scheint, als hättet Ihr nicht genug Jetons. Kommt bitte wieder zurück, wenn Ihr noch ein paar gekauft habt.\n@c2@"
  en: "@a@b*: Oh dear! It looks like you don't have any tokens. Be sure to come back again when you've bought some.\n@c2@"
  es: "@a@b*: ¡Oh, cielos! Parece que no tiene suficientes fichas. No deje de regresar cuando compre unas cuantas más.\n@c2@"
  fr: "@a@b*ⓢ Minceⓠ Il semblerait que vous n'ayez pas assez de jetons. Revenez me voir quand vous en aurez achetés.\n@c2@"
  it: "@a@b*: Oh, che peccato! Pare proprio che tu non abbia gettoni a sufficienza. Torna dopo che ne avrai comprati degli altri.\n@c2@"
  ja: "@a@b＊「おや　お客さん　コインが\n\t足りないようです。　コインを\n\tお買い求めのうえ　またおこしください。\n@c2@"
"4":
  de: "@a@b*: Ihr könnt den Kampf jetzt nicht abbrechen. Auf welches Monster wollt Ihr setzen?\n@c2@"
  en: "@a@b*: You can't cancel the match now.\nWhich monster are you going to back?\n@c2@"
  es: "@a@b*: No puede cancelar el combate ahora.\n¿Por qué monstruo desea apostar?\n@c2@"
  fr: "@a@b*ⓢ Vous ne pouvez pas annuler la rencontre maintenant.\nSur quel monstre allez-vous placer vos jetonsⓡ\n@c2@"
  it: "@a@b*: Adesso non è possibile cancellare l'incontro.\nSu quale mostro vuoi puntare?\n@c2@"
  ja: "@a@b＊「この試合は　とりやめにすることが\n\tできません。\n\tどのモンスターに　かけますか？\n@c2@"
"5":
