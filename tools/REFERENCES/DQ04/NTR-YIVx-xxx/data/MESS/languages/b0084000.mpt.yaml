"88":
  de: "@a@b*: Ich werd jedenfalls nicht so schnell wieder krank werden, aber echt!\n@c1@"
  en: "@a@b*: I'm gonna make sure I don't get ill again, I'll tell ya that for nuffin'!\n@c1@"
  es: "@a@b*: ¡Me aseguraré de no volver a caer enfermo pero fijo!\n@c1@"
  fr: "@a@b*ⓢ Je vais faire en sorte de ne jamais retomber malade, je peux vous le direⓠ\n@c1@"
  it: "@a@b*: Sarò attentissimo a non ribeccarmi nessun malanno, altroché!\n@c1@"
  ja: "@a@b＊「だから　ぼく\n\tもう　病気をしないように\n\t気をつけてるの！\n@c1@"
"89":
  de: "@a@b*: Hoffentlich Papa kommt heute Abend nach Hause, bevor ich ins Bett muss.\n@c1@"
  en: "@a@b*: I 'ope Dad an' everyone gets 'ome before my bed time tonight.\n@c1@"
  es: "@a@b*: Espero que mi viejo y los otros lleguen hoy a casa antes de la hora de dormir.\n@c1@"
  fr: "@a@b*ⓢ J'espère que p'pa et tous les autres seront rentrés avant que j'aille me coucher, ce soir.\n@c1@"
  it: "@a@b*: Spero che stanotte mio padre e gli altri tornino a casa prima che io vada a letto.\n@c1@"
  ja: "@a@b＊「今日は　お父さんたち\n\tはやく帰ってくるといいなあ。\n@c1@"
"90":
  de: "@a@b*: Ich hab mich auch mal an der Prüfung des alten Dämler versucht, wisst Ihr.\n@c2@"
  en: "@a@b*: I 'ad a bash at old 'Ilton's test, y'know.\n@c2@"
  es: "@a@b*: Probé suerte con el enigma de Gilton.\n@c2@"
  fr: "@a@b*ⓢ J'ai essayé de passer le test d'Ilton, vous savez.\n@c2@"
  it: "@a@b*: Anch'io ho provato a fare il test di Jolly Etchelsior.\n@c2@"
  ja: "@a@b＊「わたしも　ヒルタン老人の試験を\n\t受けたのですが……。\n@c2@"
"91":
  de: "@a@b*: Aber die Antwort hab ich immer noch nicht raus. Dabei hätte ich die Schatzkarte so gern gehabt.\n@c2@"
  en: "@a@b*: I still ain't figured out the answer, though.\nI really wanted that treasure map, an' all.\n@c2@"
  es: "@a@b*: Ni idea, todavía no sé la respuesta.\nY quería el mapa, en serio, jo.\n@c2@"
  fr: "@a@b*ⓢ Mais je n'ai toujours pas trouvé la réponse.\nPourtant, je la voulais vraiment, cette carte au trésor.\n@c2@"
  it: "@a@b*: Ma non ho ancora capito quale sia la risposta corretta. Peccato... Ci tenevo tanto ad avere quella mappa del tesoro.\n@c2@"
  ja: "@a@b＊「あー！\n\tいまだに　答えがわからない！\n\t宝の地図が　欲しかったのに！\n@c2@"
"92":
  de: "@a@b*: Dieser Hoffman kann schuften wie ein Muli. Das würde man ihm gar nicht zutrauen.\n@c2@"
  en: "@a@b*: That Hoffman is a real bang-up guy.\nHe works harder than you'd believe.\n@c2@"
  es: "@a@b*: El tal Juanchito ese está hecho un mulo.\nEs increíble lo que llega a trabajar.\n@c2@"
  fr: "@a@b*ⓢ Ce Hoffman est vraiment un type doué.\nIl travaille dur comme c'est pas croyable.\n@c2@"
  it: "@a@b*: Quel Dwayne è proprio un tipo tosto.\nLavora più di un intero branco di cavalli da tiro.\n@c2@"
  ja: "@a@b＊「あの　ホフマンって新入り\n\tなかなか　やるなあ。\n@c2@"
"93":
  de: "@a@b*: Ich mach hier schon seit fünf Jahren den Boden sauber, aber der kümmert sich jetzt darum, dass der Laden läuft. Manche haben's drauf, was?\n@c2@"
  en: "@a@b*: I been here cleanin' the floor for five years now, but he's already takin' care o' the business. How the other half live, huh!?\n@c2@"
  es: "@a@b*: Yo, aquí cinco años fregoteando el suelo y va él y en nada ya se hace cargo del negocio. ¡Ay, qué bien les va a los espabilados, ¿eh?!\n@c2@"
  fr: "@a@b*ⓢ Ça fait cinq ans que j'travaille ici, à faire le ménage, mais lui, il s'occupe déjà des affaires.\nÀ s'demander comment il faitⓠⓑ\n@c2@"
  it: "@a@b*: Sono cinque anni che io mi spezzo la schiena a lavare pavimenti, e lui è già arrivato ai piani alti. Le ingiustizie della vita, eh?!\n@c2@"
  ja: "@a@b＊「オレなんて　もう５年も\n\t床そうじだっていうのに\n\tあいつ　もう店番かあ。　とほほ…。\n@c2@"
"94":
  de: "@aHank Hoffman Jr.@bDie haben mir hier schon die Verantwortung übertragen, wisst Ihr. Jetzt hält mich nichts mehr auf!\n@c2@"
  en: "@aHank Hoffman Jr.@bI've already been left in charge here, y'know. There ain't no stoppin' me now!\n@c2@"
  es: "@aJuanchito@bPues ya me hicieron encargado, ¿%H860%Xsabe%Ysaben%Z? ¡No hay quien me pare!\n@c2@"
  fr: "@aHank Hoffman Jr@bOn m'a déjà confié des responsabilités ici, vous savez. Plus rien m'arrêtera, maintenantⓠ\n@c2@"
  it: "@aJohn Dwayne Jr.@bOra sono io che mi occupo di tutto qui. E chi mi ferma più?!\n@c2@"
  ja: "@a@bホフマン「店番を　まかせて\n\tもらえるようになったんです。\n\tよーし　もっとがんばるぞ！\n@c2@"
"95":
  de: "@aHank Hoffman Jr.@bPasst gut auf Euch auf, ja?\n@c2@"
  en: "@aHank Hoffman Jr.@bY'all have a safe trip now, y'hear?\n@c2@"
  es: "@aJuanchito@b¡Que %H860%Xtenga%Ytengan %R000%Xtodas%Ytodos%Z%Z un buen viaje, nomás!\n@c2@"
  fr: "@aHank Hoffman Jr@bBon, faites attention pendant votre voyage, d'accordⓡ\n@c2@"
  it: "@aJohn Dwayne Jr.@b%H860%XFa'%YFate%Z buon viaggio, mi raccomando.\n@c2@"
  ja: "@a@bホフマン「みなさんも　気をつけて\n\t旅を続けてくださいね！\n@c2@"
"96":
  de: "@a@b*: Dieser Kerl, der vorher hier war, dieser Ragnar Rauhbein, war auch auf der Suche nach %A090%Xeinem Helden%Z%B090%Xeiner Heldin%Z.\n@c2@"
  en: "@a@b*: That chap who was staying here before, Ragnar McRyan, said something about how he was looking for a %A090%Xhero%Z%B090%Xheroine%Z.\n@c2@"
  es: "@a@b*: El tipo ese que pasó por aquí, Ragnar McRyan, dijo no sé qué de que estaba buscando a %A090%Xun héroe%Z%B090%Xuna heroína%Z.\n@c2@"
  fr: "@a@b*ⓢ L'homme qui logeait ici il y a quelque temps, Ragnar McRyan, a mentionné qu'il était à la recherche d'%A090%Xun héros%Z%B090%Xune héroïne%Z.\n@c2@"
  it: "@a@b*: Quel tizio che era qui prima, Galiardo de' Guglielmi, diceva che stava cercando %A090%Xun eroe%Z%B090%Xun'eroina%Z.\n@c2@"
  ja: "@a@b＊「以前　この宿に泊まった\n\tライアンという戦士が\n\t勇者さまを　さがしていたのです。\n@c2@"
"97":
  de: "@a@b*: Wenn ich mich nicht irre, wollte er zum Palais de Léon weit im Westen, in Libeccio.\n@c2@"
  en: "@a@b*: If my memory serves me correctly, he was off to the Palais de Léon, way over in Libeccio to the west.\n@c2@"
  es: "@a@b*: Yo creo que dijo algo de que se dirigía al Palais de Léon ese, en Leveche, hacia el oeste.\n@c2@"
  fr: "@a@b*ⓢ Si ma mémoire est bonne, il se dirigeait vers le palais de Lord Lionel, loin à l'ouest d'ici, sur le Libeccio.\n@c2@"
  it: "@a@b*: Se la memoria non m'inganna, è partito per il Palazzo de Léon, che si trova nel continente di Lybeccio, a ovest di qui.\n@c2@"
  ja: "@a@b＊「たしか　ライアンどのは\n\tはるか西の国　キングレオに行くと\n\t申しておりました……。\n@c2@"
"98":
  de: "@a@b*: Hah... Hah... Haaaah...\n@c2@"
  en: "@a@b*: Ah... Ah... Aaaaah...\n@c2@"
  es: "@a@b*: Ah... Ah... Aaaaah...\n@c2@"
  fr: "@a@b*ⓢ Ah... Ah... Aaaaah...\n@c2@"
  it: "@a@b*: Ah... Aaah... Aaaaah...\n@c2@"
  ja: "@a@b＊「はっはっはっ……\n@c2@"
"99":
  de: "@a@b*: Ha-tschi! Es ist ja doch recht kühl heute Abend, nicht wahr? Doch lasst mich Euch herzlich in Mintos willkommen heißen!\n@c2@"
  en: "@a@b*: Ah-chew! It's a bit chilly of a night, eh?\nStill, welcome to Mintos an' all that.\n@c2@"
  es: "@a@b*: ¡Achús! Hace un frío que pela esta noche, ¿eh?\nDe todos modos, %H860%X%A120%Xbienvenido%Z%B120%Xbienvenida%Z%Y%R000%Xbienvenidas%Ybienvenidos%Z%Z a Mintos y todo eso.\n@c2@"
  fr: "@a@b*ⓢ Atchoumⓠ La nuit est drôlement fraîche, nonⓡ\nEnfin, bienvenue à Ringys quand même.\n@c2@"
  it: "@a@b*: Etciù! Fa un po' fresco stasera, eh?\nComunque, caldo o freddo che sia, %H860%X%A120%Xsei il benvenuto%Z%B120%Xsei la benvenuta%Z%Y%R000%Xsiete le benvenute%Ysiete i benvenuti%Z%Z a Mintos.\n@c2@"
  ja: "@a@b＊「はっくしょん！\n\t夜は　冷えこむなあ。\n\tここは　ミントスの町だよ。\n@c2@"
"100":
  de: "@a@b*: Was? Hm, muss wohl eingeschlafen sein. Bei dem Vortrag des Alten kommen die Schäfchen schon von allein an, um sich zählen zu lassen.\n@c3@"
  en: "@a@b*: Huh? Looks like I must've been asleep.\nThat old man's lecturin' is enough to start anyone off countin' sheep.\n@c3@"
  es: "@a@b*: ¿Eh? Debe de haber sido un sueño.\nEse vejete hablando es más que suficiente para hacer que acabes contando ovejas.\n@c3@"
  fr: "@a@b*ⓢ Heinⓡ J'ai dû m'endormir.\nLes discours de c'vieux bonhomme pourraient faire ronfler n'importe qui.\n@c3@"
  it: "@a@b*: Eh? Devo essermi addormentato.\nAssistere alla conferenza di quel vecchio è come ascoltare una ninnananna. Che noiaaa!\n@c3@"
  ja: "@a@b＊「ありゃ？　眠っちまったようだな。\n\tあのじいさんの話は\n\t眠くなっていけねえや。\n@c3@"
"101":
  de: "@a@b*: Schätze, es ist sinnlos, dagegen ankämpfen zu wollen. Zeit für ein Nickerchen! Nacht allerseits..\n@c3@"
  en: "@a@b*: Well, ain't no use in fightin' it, I s'pose.\nKip time! Night, night.\n@c3@"
  es: "@a@b*: Bueno, supongo que no sirve de nada luchar.\n¡Hora de la siesta! Buenas noches.\n@c3@"
  fr: "@a@b*ⓢ Enfin, ça sert à rien d'lutter.\nC'est l'heure d'roupillerⓠ Bonne nuit.\n@c3@"
  it: "@a@b*: Non ci riesco, è inutile resistere.\nSchiaccio un pisolino! Buonanotte.\n@c3@"
  ja: "@a@b＊「しかたねえ\n\tもう　ひと眠りすっか！\n\tほんじゃ　おやすみ！\n@c3@"
"102":
  de: "@a@b*: Wisst Ihr... Wenn Ihr mal Zeit habt, könnten wir doch mal einen Tag am Meer verbringen, was meint Ihr?\n@c3@"
  en: "@a@b*: Y'know... Next time you're free, maybe we could go an' spend the day by the seaside, eh?\n@c3@"
  es: "@a@b*: Oye, la próxima vez que %H860%Xestés libre%Yestéis libres%Z, quizá podríamos pasar un día en la playa, ¿qué no?\n@c3@"
  fr: "@a@b*ⓢ Dites... la prochaine fois que vous serez libre, on pourrait peut-être aller passer une journée au bord de la mer, qu'en dites-vousⓡ\n@c3@"
  it: "@a@b*: Ho un'idea... La prossima volta che %H860%Xhai%Yavete%Z un po' di tempo libero, potremmo passare la giornata al mare! Che ne %H860%Xdici%Ydite%Z?\n@c3@"
  ja: "@a@b＊「もし　よかったら……\n\t今度のお休みの日に\n\t海を見にゆきませんかっ！？\n@c3@"
"103":
  de: "@a@b*: Bitte, mein Sohn, kein Wort mehr.\nMein Leben ist der Göttin geweiht.\n@c1@"
  en: "@a@b*: Please, my child, say no more.\nI am promised to the Goddess.\n@c1@"
  es: "@a@b*: Por favor, hijo mío, no digas nada más.\nEstoy prometida a la Diosa.\n@c1@"
  fr: "@a@b*ⓢ Je vous en prie, mon enfant, n'en dites pas plus.\nJe suis promise à la Déesse.\n@c1@"
  it: "@a@b*: Ti scongiuro, non dire più nulla.\nLa mia vita appartiene alla dea.\n@c1@"
  ja: "@a@b＊「いけませんわ。\n\t私は　神に仕える身。\n\t……ぽっ。\n@c1@"
"104":
  de: "@aGotthilf Dämler@bDer junge Hoffman isch en Freund von Euch, gell? Des isch en guder Kerle, da gibt's koi Vertue.\n@c2@"
  en: "@aConrad 'Ilton@bThat 'Offman Junior bloke's a mate of yours, right? I reckon 'e ain't a bad sort, that one.\n@c2@"
  es: "@aConrad Gilton@bEl Juanchito ese es amigo %H860%Xtuyo%Yvuestro%Z, ¿no? Es un tío legal, sí señor.\n@c2@"
  fr: "@aConrad Ilton@bCe type, là, Hoffman Junior... c'est un ami à vous, nonⓡ Il n'est pas mauvais, je dois dire.\n@c2@"
  it: "@aJolly Etchelsior@bQuel John Dwayne Jr. è amico %H860%Xtuo%Yvostro%Z, giusto? Mi sembra proprio un tipo a posto.\n@c2@"
  ja: "@a@bヒルタン「あの　ホフマンという男。\n\tあんたの知り合いだそうじゃな。\n\tなかなか　よく働くやつじゃ。\n@c2@"
"105":
  de: "@aGotthilf Dämler@bNach so enem Lehrling such i scho lang. Bis dass der en guder Händler wird, braucht's net lang.\n@c2@"
  en: "@aConrad 'Ilton@bIn fact, 'e's just the kind of apprentice I've been lookin' for. I'll make 'im a great trader like me before long!\n@c2@"
  es: "@aConrad Gilton@bEs justo la clase de aprendiz que estaba buscando. ¡En menos que canta un gallo lo convertiré en un mercader de armas tomar como yo!\n@c2@"
  fr: "@aConrad Ilton@bEn réalité, c'est exactement le genre d'apprenti que je recherchais. J'en aurai fait un grand commerçant comme moi sous peuⓠ\n@c2@"
  it: "@aJolly Etchelsior@bCredo proprio di aver trovato l'apprendista che stavo cercando. In men che non si dica lo farò diventare un uomo d'affari in gamba come me!\n@c2@"
  ja: "@a@bヒルタン「びしびし　きたえて\n\tわしのような　りっぱな商人に\n\t育ててみせるぞい！\n@c2@"
"106":
  de: "@a@b*: Zzz...\n@c1@"
  en: "@a@b*: Zzz...\n@c1@"
  es: "@a@b*: Zzz...\n@c1@"
  fr: "@a@b*ⓢ Zzz...\n@c1@"
  it: "@a@b*: Zzz...\n@c1@"
  ja: "@a@b＊「すやすや……。\n@c1@"
"107":
  de: "@a@b*: Ha-püh...\n@c1@"
  en: "@a@b*: Ah-phew...\n@c1@"
  es: "@a@b*: Ah, fiuu...\n@c1@"
  fr: "@a@b*ⓢ Ron-pfff...\n@c1@"
  it: "@a@b*: Ah-phew...\n@c1@"
  ja: "@a@b＊「ぐうぐう……。\n@c1@"
"108":
  de: "@a@b*: Meine Heimatstadt liegt weit im Süden des Kontinents Siroc, wisst Ihr. Bei uns gibt es eine kleine, aber prächtige Burg, ja wirklich.\n@c1@"
  en: "@a@b*: My hometown lies far to the south of the Siroc continent, don't you know. We have a small but rather grand castle, even if I do say so myself.\n@c1@"
  es: "@a@b*: Mi ciudad natal está muy lejos, en el sur del continente Siroco. No es por presumir, pero tenemos un castillo grandioso aunque pequeño.\n@c1@"
  fr: "@a@b*ⓢ Ma ville natale se trouve loin au sud du Sirocco, voyez-vous. Nous avons un château, certes petit, mais magnifique... mais je ne suis pas très objective.\n@c1@"
  it: "@a@b*: Il mio villaggio natale si trova a sud di Scyrocco. C'è anche un castello piccolo ma veramente splendido, e se lo dico io %H860%Xpuoi%Ypotete%Z crederci.\n@c1@"
  ja: "@a@b＊「わたしの　ふるさとは\n\tこの大陸のはるか　はずれ\n\t小さなお城のある村ですわ。\n@c1@"
"109":
  de: "@a@b*: Ich war schon eine Weile nicht mehr dort. Ich hoffe, sie haben mittlerweile ein paar Mutterkrautpflänzchen züchten können.\n@c1@"
  en: "@a@b*: It's been some time since I was last there. I do hope they've managed to cultivate some feverfew by now.\n@c1@"
  es: "@a@b*: Hace tiempo que no paso por allí.\nPero espero que ya hayan podido cultivar algo de reducefiebre.\n@c1@"
  fr: "@a@b*ⓢ Cela fait un certain temps que je ne me suis pas rendue sur place. J'espère qu'ils auront réussi à cultiver un peu de camomille.\n@c1@"
  it: "@a@b*: Non ci torno da un po' di tempo ormai.\nSpero proprio che nel frattempo siano riusciti a coltivare qualche pianta di parthenio.\n@c1@"
  ja: "@a@b＊「しばらく　村に帰ってないけど\n\tまだ　パデキアの栽培を\n\tしているのかしら……。\n@c1@"
"110":
  de: "@a@b*: Vor einiger Zeit war hier mal so 'n kerniger Typ namens Ragnar oder so.\n@c3@"
  en: "@a@b*: There was a tough bloke 'ere a while back called Ragnar or the like.\n@c3@"
  es: "@a@b*: Había un tipo duro aquí llamado Ragnar o algo así.\n@c3@"
  fr: "@a@b*ⓢ Il y a un certain temps, il y a un solide gaillard qui est passé par ici. Ragnar, j'crois qu'il s'appelait.\n@c3@"
  it: "@a@b*: Poco fa c'era un tipo tosto qui... Mi pare si chiamasse Galiardo, o qualcosa del genere.\n@c3@"
  ja: "@a@b＊「そういえば　ちょっと前に\n\tライアンとかいう　ごつい男が\n\tこの町に　やってきたんだ。\n@c3@"
"111":
  de: "@a@b*: Erinnert mich 'n bisschen an Euch. Der kam auch von weither.\n@c3@"
  en: "@a@b*: Bit like you 'e was, travellin' 'ere from a long way away.\n@c3@"
  es: "@a@b*: Igual que %H860%Xtú%Y%R000%Xvosotras%Yvosotros%Z%Z, venía de lejos.\n@c3@"
  fr: "@a@b*ⓢ Il venait de très loin, un peu comme vous.\n@c3@"
  it: "@a@b*: Anche lui, come %H860%Xte%Yvoi%Z, veniva da molto lontano.\n@c3@"
  ja: "@a@b＊「あいつも　遠いところから\n\t来たみたいだったよ。\n@c3@"
"112":
  de: "@a@b*: Ha-püh...\n@c2@"
  en: "@a@b*: Ah-phew...\n@c2@"
  es: "@a@b*: Ah, fiuu...\n@c2@"
  fr: "@a@b*ⓢ Ron-pfff...\n@c2@"
  it: "@a@b*: Ah-phew...\n@c2@"
  ja: "@a@b＊「ぐうぐう……。\n@c2@"
"113":
  de: "@a@b*: Uff! Ich bin fix und fertig! Was? Der Neue, der Hoffman, ist immer noch bei der Arbeit? Also, ich kann nicht mehr!\n@c2@"
  en: "@a@b*: Whew! I am absolutely dragged out, I tell ya. Huh? The new guy Hoffman is still at work? Well, he's a stronger man than I am!\n@c2@"
  es: "@a@b*: ¡Bua! Estoy reventado, en serio. ¿Qué? ¿Que el nuevo ese, el Juanchito, sigue trabajando? Bueno, está claro que es más fuerte que yo.\n@c2@"
  fr: "@a@b*ⓢ Pfiouⓠ J'suis complètement épuisé. Heinⓡ Le nouveau, Hoffman, est encore au boulotⓡ\nEh bien, il est bien plus costaud qu'moiⓠ\n@c2@"
  it: "@a@b*: Per tutta la sabbia del deserto! Il tizio nuovo, quel Dwayne, sta ancora lavorando? Non c'è che dire, ha sicuramente più energia di me!\n@c2@"
  ja: "@a@b＊「あー　つかれたっ。\n\tあれ？　新入りのホフマンのやつ\n\tまだ働いているのか。　えらいなあー。\n@c2@"
"114":
  de: "@a@b*: Eine lahme Ente ist dieser Neue, dieser Hoffman, jedenfalls nicht. Der schuftet ja härter als wir anderen zusammen.\n@c2@"
  en: "@a@b*: That new guy Hoffman sure ain't no coffee boiler. He works harder than the rest of us folk put together.\n@c2@"
  es: "@a@b*: El tal Juanchito ese es para verlo despacio. Trabaja más que todos nosotros puestos juntos.\n@c2@"
  fr: "@a@b*ⓢ Ce nouveau, là, Hoffman... c'est sûr que c'est pas une mauviette. Il bosse plus dur que nous tous réunis.\n@c2@"
  it: "@a@b*: John Dwayne, il nuovo arrivato, non è certo una mezza cartuccia. Lavora più di tutti noi messi insieme. \n@c2@"
  ja: "@a@b＊「新しく　弟子入りした\n\tホフマンってのは\n\t本当に　いいやつだな。\n@c2@"
"115":
  de: "@a@b*: Dem sieht man gleich an, dass der nicht locker lässt. Dem würd ich mein bestes Pferd anvertrauen, und das will was heißen!\n@c2@"
  en: "@a@b*: You can tell as soon as ya meet him that he's a real stand-up guy. I'd trust him with my best horse, an' that's sayin' somethin'.\n@c2@"
  es: "@a@b*: Solo con verlo ya te das cuenta de que es un tipo legal. Incluso le confiaría mi mejor mula y eso es mucho decir.\n@c2@"
  fr: "@a@b*ⓢ Dès qu'on l'voit, on s'rend compte que c'est un type droit. J'lui confierais mon meilleur cheval, et c'est pas peu dire.\n@c2@"
  it: "@a@b*: Appena l'ho visto ho capito che era uno con la testa sulle spalle. Gli affiderei persino il mio miglior cavallo! È davvero un tipo in gamba.\n@c2@"
  ja: "@a@b＊「初めて会った　相手でも\n\tすっかり信じちまう\n\t素直なとこが　長所だぜ！\n@c2@"
"116":
  de: "@a@b*: Ich mache hier schon seit fünf Jahren den Boden sauber.\n@c2@"
  en: "@a@b*: I been here cleanin' the floor for five years now.\n@c2@"
  es: "@a@b*: LLevo cinco años fregando ya.\n@c2@"
  fr: "@a@b*ⓢ Ça fait cinq ans que j'fais l'ménage, maintenant.\n@c2@"
  it: "@a@b*: Sono cinque anni che pulisco i pavimenti.\n@c2@"
