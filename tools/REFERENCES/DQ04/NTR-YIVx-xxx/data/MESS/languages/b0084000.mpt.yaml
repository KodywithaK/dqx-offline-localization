  it: "@aJolly Etchelsior@bMi chiamo Jolly Etchelsior.\nJolly, perché sono perfetto in qualsiasi situazione.\nE direi che tu prometti bene, %A120%Xragazzo%Z%B120%Xragazza%Z.\n@c2@"
