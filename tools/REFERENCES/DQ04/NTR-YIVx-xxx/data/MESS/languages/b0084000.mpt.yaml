  de: "@a@b*: Er war's, der unsere wunderbare Herberge erbaut hat, und schon bald kamen die Reisenden in Scharen hierher.\n@c1@"
  en: "@a@b*: He's the one who built that lovely inn of ours, and once he did, it wasn't long before travellers started flocking here.\n@c1@"
