  de: "@a@b*: Ihr lebt noch! Ach, da fällt mir aber ein Stein vom Herzen!\n@c2@"
  en: "@a@b*: You're alive! Well, that's a weight off my mind, I can tell you.\n@c2@"
  es: "@a@b*: ¡%L000%XEstáis vivas%YEstás viva%Z! ¡Vaya peso me he quitado de encima!\n@c2@"
  fr: "@a@b*ⓢ %L000%XVous êtes vivantes%YTu es vivante%Zⓠ C'est un vrai soulagement pour moi, c'est certain.\n@c2@"
  it: "@a@b*: %L000%XSiete vive%YSei viva%Z! Che sollievo!\n@c2@"
  ja: "@a@b＊「生きていたんだねえ。\n\t良かったねえ。\n@c2@"
"34":
  de: "@a@b*: Was? Der Zauberschlüssel? Oh ja. Ich bin sicher, dass dieser nette Oojam so was hatte. Ihr wisst schon, Herr Mahabalas Schüler.\n@c2@"
  en: "@a@b*: What? The magic key? Oh, yes. I'm sure that lovely Oojam fellow had something like that.\nYou know, Mr. Mahabala's student.\n@c2@"
  es: "@a@b*: ¿Qué? ¿La llave mágica? ¡Ah!, sí. Estoy segura de que ese individuo tan simpático, Oojam, tenía algo así. Ya sabéis, el alumno del señor Mahabala.\n@c2@"
  fr: "@a@b*ⓢ Quoiⓡ La clef magiqueⓡ Oh oui. Je suis sûre que le charmant Oojam avait quelque chose comme ça. %L000%XVous savez%YTu sais%Z, l'étudiant de Monsieur Mahabala.\n@c2@"
  it: "@a@b*: Cosa? La Chiave magica? Oh, sì... Sono certa che quel caro ragazzo, Oojam, avesse una cosa del genere. Sì, il discepolo di Malaparata, proprio lui!\n@c2@"
  ja: "@a@b＊「え？　魔法のカギ？　そういえば\n\tエドガンさんの弟子のオーリンさんが\n\tそんなの持っていたわね。\n@c2@"
"35":
  de: "@a@b*: %H860%XTut%YTu%Z mir nichts, bitte. Ich bin kein böser Schleim, ganz ehrlich! (Schlürf)\n@c1@"
  en: "@a@b*: Don't be mean to me. I'm not a bad slime, you know. I promise! (slurp)\n@c1@"
  es: "@a@b*: No me %H860%Xmaltratéis%Ymaltrates%Z. Soy un limo bueno, en serio. ¡Lo juro! (Slurp)\n@c1@"
  fr: "@a@b*ⓢ Ne me frappez pas. Je ne suis pas un mauvais gluant. Je vous le prometsⓠ (Slurp)\n@c1@"
  it: "@a@b*: Non %H860%Xfarmi%Yfatemi%Z del male. Non sono uno Slime cattivo, lo giuro! Slurp!\n@c1@"
  ja: "@a@b＊「いじめないでくれよー。\n\tボクは　悪いスライムじゃないよ。\n@c1@"
"36":
  de: "@a@b*: Ich werde Euch sogar was erzählen. Das hier war nicht das einzige Labor von Herrn Mahabala. Er hatte noch ein anderes, super-schwabbeliges!\n@c1@"
  en: "@a@b*: See, I'll even tell you something. This wasn't Mr. Mahabala's only laboratory. He had another, super-squishy one!\n@c1@"
  es: "@a@b*: Incluso %H860%Xte%Yos%Z puedo contar una cosa. Este no era el único laboratorio del señor Mahabala. ¡Tenía otro superfangosamente genial!\n@c1@"
  fr: "@a@b*ⓢ Vous savez, je vais même vous dire quelque chose. Ce n'était pas le seul laboratoire de Monsieur Mahabala.\n㈡\n*ⓢ Il en avait un autre, drôlement bienⓠ\n@c1@"
  it: "@a@b*: Voglio %H860%Xsvelarti%Ysvelarvi%Z uno slimegreto. Questo non era l'unico slimeboratorio di Malaparata. Ne aveva un altro, super nascosto!\n@c1@"
  ja: "@a@b＊「あ　そうだ！\n\tエドガンさんは　ここ以外にも\n\t秘密の研究所を持ってたよ！\n@c1@"
"37":
  de: "@a@b*: Das war in der Höhle im Westen. \nDer Zauberschlürfel, äh, Schlüssel ist auch da. \nDen werdet Ihr gut brauchen können.\n@c1@"
  en: "@a@b*: It was in the cave to the west.\nThe magic key's there, goo.\nIt'll be useful to you.\n@c1@"
  es: "@a@b*: Estaba en la cueva que está al oeste.\nLa llave mágica está allí.\n%H860%XTe%YOs%Z será muy útil.\n@c1@"
  fr: "@a@b*ⓢ Il se trouvait dans la caverne, à l'ouest.\nLa clef magique se trouve là-bas aussi.\nElle vous sera utile.\n@c1@"
  it: "@a@b*: Si trovava nella grotta a ovest.\nLì c'è anche la Chiave magica.\n%H860%XTi%YVi%Z sarà slimecuramente utile.\n@c1@"
  ja: "@a@b＊「たしか　西の洞くつの中！\n\tそこに行けば　魔法のカギも\n\t見つかると思うよ。\n@c1@"
"38":
  de: "@a@b*: Es ist einfach unverschämt, dass wir dem neuen Marquis so viele Steuern zahlen müssen. Darum muss ich auch so viel arbeiten.\n@c2@"
  en: "@a@b*: You wouldn't believe the taxes we have to pay now under the new marquis regent. That's why I'm havin' to work so late.\n@c2@"
  es: "@a@b*: No %H860%Xte imaginas%Yos imagináis%Z la cantidad de impuestos que tenemos que pagar ahora, bajo el gobierno del Marqués. Por eso debo trabajar hasta tan tarde.\n@c2@"
  fr: "@a@b*ⓢ Vous imaginez même pas les impôts qu'on doit payer depuis que le nouveau Lord Regent a pris le pouvoir. C'est pour ça que je dois travailler si tard.\n@c2@"
  it: "@a@b*: Il nuovo Marchese Reggente ha aumentato tantissimo le tasse. Ecco perché mi tocca lavorare fino a tardi.\n@c2@"
  ja: "@a@b＊「キングレオの王さまが代わってから\n\t税金の取立てが　きびしくてのう。\n\tこんな夜ふけまで　働かねばならん。\n@c2@"
"39":
  de: "@a@b*: Der alte König war nicht mal halb so streng. Wo das noch hinführen soll...\n@c2@"
  en: "@a@b*: The old king wasn't half so strict.\nIt's a right flamin' liberty, if you ask me.\n@c2@"
  es: "@a@b*: El viejo rey no era ni la mitad de estricto. No es una libertad muy permisiva, la verdad.\n@c2@"
  fr: "@a@b*ⓢ Le vieux roi était bien moins exigeant.\nC'est de l'abus de pouvoir, si vous voulez mon avisⓠ\n@c2@"
  it: "@a@b*: Il vecchio Re non era mica così severo. Questa è prepotenza bella e buona!\n@c2@"
  ja: "@a@b＊「死んでしまった　先代の王は\n\tこんなこと　させんかったのにのう。\n\tぶつぶつ……。\n@c2@"
