"0":
  de: "@a@b*: Willkommen in... Boutdumonde! Ich weiß zwar nicht, was das heißt, aber ist es nicht ein großartiger Name?\n@c2@"
  en: "@a@b*: Welcome to...Aubout du Monde!\nI don't know what the name means, but doesn't it sound great!?\n@c2@"
  es: "@a@b*: %H860%X%A120%XBienvenido%Z%B120%XBienvenida%Z%Y%R000%XBienvenidas%YBienvenidos%Z%Z a... ¡Aubout du Monde! No sé qué significa el nombre, ¡pero suena realmente bien!\n@c2@"
  fr: "@a@b*ⓢ Bienvenue à... Deadendⓠ Je sais pas trop ce que ça veut dire, mais ça sonne bienⓠ\n@c2@"
  it: "@a@b*: %H860%X%A120%XBenvenuto%Z%B120%XBenvenuta%Z%Y%R000%XBenvenute%YBenvenuti%Z%Z a... Infond Almond! Ehm, non so cosa voglia dire di preciso, ma non è un nome bellissimo?!\n@c2@"
  ja: "@a@b＊「ここは　コーミズ村だよ。\n@c2@"
"1":
  de: "@a@b*: Oh, wie dumm von mir. %L000%XIhr seid Mahabalas Töchter%YDu bist Mahabalas Tochter%Z, nicht wahr? Willkommen zu Hause.\n@c2@"
  en: "@a@b*: Oh, silly me. You're Mr. Mahabala's %L000%Xdaughters%Ydaughter%Z, aren't you? Welcome back, then.\n@c2@"
  es: "@a@b*: Qué tonto soy. Si %L000%Xsois las hijas%Yeres la hija%Z del Sr. Mahabala, ¿no es cierto? ¡%L000%XBienvenidas%YBienvenida de nuevo%Z!\n@c2@"
  fr: "@a@b*ⓢ Qu'est-ce que je suis bêteⓠ Vous êtes %L000%Xles filles%Yla fille%Z de Monsieur Mahabalaⓡ Content de vous revoir.\n@c2@"
  it: "@a@b*: Accidenti. %L000%XSiete le figlie%YSei la figlia%Z di Malaparata, vero? %L000%XBentornate%YBentornata%Z!\n@c2@"
  ja: "@a@b＊「おや　たしか　あんたは\n\tエドガンさんの娘さん！\n\tそうか　帰ってきただか！\n@c2@"
"2":
  de: "@a@b*: Muuuuuhhhh!\n@c2@"
  en: "@a@b*: Mooooo!\n@c2@"
  es: "@a@b*: ¡Muuuuuu!\n@c2@"
  fr: "@a@b*ⓢ Meuuuuhⓠ\n@c2@"
  it: "@a@b*: Muuuuu!\n@c2@"
  ja: "@a@b＊「ンモーーー。\n@c2@"
"3":
  de: "@a@b*: Ich hab gehört, unser berühmter Alchemist Herr Mahabala sei umgebracht worden, als er das Geheimnis der Evolution zerstören wollte.\n@c2@"
  en: "@a@b*: I heard our famous alchemist, Mr. Mahabala, was killed for tryin' to destroy somethin' called the Secret of Evolution.\n@c2@"
  es: "@a@b*: Me han dicho que nuestro famoso alquimista, el señor Mahabala, murió al intentar destruir una cosa llamada el Secreto de la Evolución.\n@c2@"
  fr: "@a@b*ⓢ Il paraît que notre célèbre alchimiste, Monsieur Mahabala, a été tué pour avoir voulu détruire quelque chose appelé le Secret de l'Évolution.\n@c2@"
  it: "@a@b*: Pare che il nostro famoso alchimista Malaparata sia stato ucciso perché ha tentato di distruggere una cosa chiamata ⓕSegreto dell'Evoluzioneⓖ.\n@c2@"
  ja: "@a@b＊「錬金術師の　エドガンさんは\n\t進化の秘法ってのを\n\t消し去ろうとして殺されたんだと！\n@c2@"
"4":
  de: "@a@b*: Geht es bei der Evolution nicht um so komisches Zeugs wie Affen, die sich in Menschen verwandeln und so?\n@c2@"
  en: "@a@b*: Isn't evolution all that fancy stuff about monkeys turnin' into men an' the like?\n@c2@"
  es: "@a@b*: La evolución es eso tan raro de los monos que se convierten en hombres, ¿verdad?\n@c2@"
  fr: "@a@b*ⓢ L'Évolution, ce n'est pas ce drôle de truc sur les singes qui se transforment en hommes, et tout çaⓡ\n@c2@"
  it: "@a@b*: Ma l'evoluzione non era quella storia strana sulle scimmie che diventano uomini?\n@c2@"
  ja: "@a@b＊「進化ってのは\n\tサルが人に進化したとかいう\n\tあれだろ。\n@c2@"
"5":
  de: "@a@b*: Ich weiß wirklich nicht, wie die Menschen aussehen sollen, wenn sie sich noch weiter entwickeln.\n@c2@"
  en: "@a@b*: I can't begin to imagine what humans would look like if they evolutioned any more.\n@c2@"
  es: "@a@b*: No me quiero ni imaginar qué pinta tendrían los humanos si evolucionaran más.\n@c2@"
  fr: "@a@b*ⓢ Je n'ose pas imaginer à quoi ressembleraient les humains s'ils continuaient à évoluer.\n@c2@"
  it: "@a@b*: Non oso nemmeno immaginare cosa sarebbero diventati gli uomini se si fossero evoluzionati un altro po'!\n@c2@"
  ja: "@a@b＊「でも　人がこれ以上進化したら\n\tどうなるんだろ？\n@c2@"
"6":
  de: "@a@b*: Ich habe einen Schleim gesehen! Bei uns, in unserem Dorf!\n@c2@"
  en: "@a@b*: I saw a slime, I did.\nRight here in the village!\n@c2@"
  es: "@a@b*: He visto un limo, de verdad.\n¡En este mismo pueblo!\n@c2@"
  fr: "@a@b*ⓢ J'ai vu un gluant, je vous assure.\nIci même, dans le villageⓠ\n@c2@"
  it: "@a@b*: Ho visto uno Slime, giuro!\nProprio qui nel villaggio!\n@c2@"
  ja: "@a@b＊「村の中で　スライムを見たのよ！\n@c2@"
"7":
  de: "@a@b*: Die arme Lassi war ganz durcheinander. Hat nur einmal dran geschnüffelt und wollte gar nicht mehr aufhören zu kläffen.\n@c2@"
  en: "@a@b*: Poor Puppadom didn't know what to make of it. Once he sniffed it out he wouldn't stop yapping at it.\n@c2@"
  es: "@a@b*: El pobre Pita no sabía cómo reaccionar. Cuando lo olió ya no podía dejar de ladrarle.\n@c2@"
  fr: "@a@b*ⓢ Le pauvre Tajwawal ne savait pas quoi en faire. Après l'avoir reniflé, il n'arrêtait plus d'aboyer après lui.\n@c2@"
  it: "@a@b*: Il povero Can Can dev'essersi spaventato a morte. Dopo averlo annusato, non la smetteva più di guaire.\n@c2@"
  ja: "@a@b＊「犬のペスタも　そいつをさがして\n\tほえてるんだから。\n@c2@"
