"12":
  de: "@a@b*: Na so was? Lassi mag Euch wohl, was?\n@c2@"
  en: "@a@b*: Hello? Puppadom likes you, doesn't he?\n@c2@"
  es: "@a@b*: ¿Hola? Le %H860%Xcaes%Ycaéis%Z %H860%X%A120%Xsimpático%Z%B120%Xsimpática%Z%Y%R000%Xsimpáticas%Ysimpáticos%Z%Z a Pita, ¿verdad?\n@c2@"
