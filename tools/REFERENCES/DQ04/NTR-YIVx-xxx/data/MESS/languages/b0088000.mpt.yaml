  ja: "@a@b＊「それとも　あんたから\n\tスライムのにおいでもするのかのう。\n@c2@"
"14":
  de: "@a@b*: Ihr habt Euch wohl in letzter Zeit mit Schleimen herumgetrieben? Na, schon gut. Es geht mich ja nichts an.\n@c2@"
  en: "@a@b*: Been in contact with any slimes recently, have you? No, never mind. It's none of my business.\n@c2@"
  es: "@a@b*: ¿%H860%XHas%YHabéis%Z estado cerca de algún limo últimamente? Bueno, no importa. No es asunto mío.\n@c2@"
  fr: "@a@b*ⓢ Vous avez été en contact avec des gluants récemment, nonⓡ Non, laissez tomber.\nÇa ne me regarde pas.\n@c2@"
  it: "@a@b*: %H860%XHai%YAvete%Z incontrato qualche Slime di recente? No, no, come non detto. Non sono affari miei.\n@c2@"
  ja: "@a@b＊「最近　スライムと話したとか。\n\tまあ　どっちゃでも良いがの。\n@c2@"
