"44":
  de: "@a@b*: Aber man kommt in dieser Höhle einfach nicht weiter. Ich habe schon überall gesucht.\n@c2@"
  en: "@a@b*: But there's just no way to get further down in this cave. I've looked everywhere.\n@c2@"
  es: "@a@b*: Pero no hay forma de avanzar más en la cueva. He mirado por todas partes.\n@c2@"
  fr: "@a@b*ⓢ Mais il n'y a aucun moyen de descendre plus profondément dans cette caverne. J'ai regardé partout.\n@c2@"
  it: "@a@b*: Ma non riesco a trovare la strada per proseguire l'esplorazione di questa grotta! Eppure ho cercato ovunque...\n@c2@"
  ja: "@a@b＊「どうしても　下に降りる階段が\n\t見つからないのだよ。\n@c2@"
"45":
  de: "@a@b*: Ich weiß nur, dass irgendwo unten in einer Schatzkiste ein Schalter sein soll. Damit kann man angeblich den Weg nach unten freigeben.\n@c2@"
  en: "@a@b*: All I know is that there's some switch at the bottom of a treasure chest somewhere that's supposed to uncover the way down.\n@c2@"
  es: "@a@b*: Solo sé que hay algún tipo de interruptor en el fondo de un cofre del tesoro que, al parecer, revela el camino de bajada.\n@c2@"
  fr: "@a@b*ⓢ Tout ce que je sais, c'est qu'il y a une sorte de mécanisme caché quelque part au fond d'un coffre, qui est censé découvrir le passage pour descendre.\n@c2@"
  it: "@a@b*: Tutto quello che so è che da qualche parte c'è uno scrigno sul cui fondo è posto un interruttore...\n㈡\n*: Dovrebbe servire ad aprire un passaggio che consente di continuare la discesa.\n@c2@"
