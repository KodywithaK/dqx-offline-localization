"43":
  de: "@a@b*: Ich bin hier, um nach dem geheimen Alchemistenlabor zu suchen.\n@c2@"
  en: "@a@b*: I came here looking for the secret alchemist's laboratory.\n@c2@"
  es: "@a@b*: He venido en busca del laboratorio secreto del alquimista.\n@c2@"
  fr: "@a@b*ⓢ Je suis venu ici pour chercher le laboratoire secret de l'alchimiste.\n@c2@"
  it: "@a@b*: Sono venuto qui per cercare il laboratorio segreto dell'alchimista.\n@c2@"
