"19":
  de: "@a@b*: Aha! %L000%XZwei Gesichter, die%YEin Gesicht, das%Z ich gut kenne!\n@c2@"
  en: "@a@b*: Ah-ha! There's %L000%Xa couple of faces%Ya face%Z I won't forget in a hurry!\n@c2@"
  es: "@a@b*: ¡Ajá! ¡%L000%XUnas caras%YUna cara%Z que no olvidaré fácilmente!\n@c2@"
  fr: "@a@b*ⓢ Ah ahⓠ Voilà %L000%Xdes visages%Yun visage%Z que je ne risque pas d'oublier de sitôtⓠ\n@c2@"
  it: "@a@b*: Ah-ah! Ma tu guarda chi si rivede!\nChe splendida sorpresa!\n@c2@"
  ja: "@a@b＊「エドガンさんの　娘さんだね！\n@c2@"
"20":
  de: "@a@b*: Wer hätte gedacht, dass Boutdumonde mal so vornehm wird... %L000%XBleibt ihr%YBleibst du%Z über Nacht? Ist natürlich kostenlos für %L000%Xeuch%Ydich%Z.\n@c2@"
  en: "@a@b*: Aubout du Monde, as we're now rather grandly called, wouldn't dream of charging its own for accommodation.\n㈡\n*: It's free to you. Would you like to stay?\n@c2@"
  es: "@a@b*: Aubout du Monde, el nuevo y grandioso nombre por el que se conoce a la ciudad, nunca haría pagar a sus habitantes por una cama.\n㈡\n*: Pasar la noche es grátis. ¿%H860%XTe%YOs%Z gustaría quedar%H860%Xte%Yos%Z?\n@c2@"
  fr: "@a@b*ⓢ Vous êtes %L000%Xnées%Ynée%Z dans cette ville, qui porte désormais le noble nom de Deadend, n'est-ce pasⓡ\nIl ne manquerait plus que je vous fasse payer.\n㈡\n*ⓢ Alors, vous restezⓡ\n@c2@"
  it: "@a@b*: Infond Almond, questo villaggio dal nome altisonante, non si sognerebbe mai di far pagare l'alloggio ai suoi concittadini.\n㈡\n*: %H860%XPer te è gratis%YPer voi è gratis%Z. %H860%XVuoi%YVolete%Z restare?\n@c2@"
  ja: "@a@b＊「この村の　あんたたちから\n\tお金を　もらうわけには　いかねえ。\n\tタダでいいよ。　休んでいくかい？\n@c2@"
"21":
  de: "@a@b*: Sehr schön. Dann wünsche ich eine gute Nacht.\n@c2@"
  en: "@a@b*: Lovely. Have a good rest then, %L000%Xgirls%Ymy love%Z.\n@c2@"
  es: "@a@b*: Perfecto. Descansad entonces, %L000%Xqueridas%Yquerida%Z.\n@c2@"
  fr: "@a@b*ⓢ Parfait. Reposez-vous bien, %L000%Xles filles%Yma jeune amie%Z.\n@c2@"
  it: "@a@b*: Benissimo. Buon riposo!\n@c2@"
  ja: "@a@b＊「じゃあ　ゆっくり　おやすみ。\n@c2@"
"22":
  de: "@a@b*: Gut geschlafen? Viel Erfolg bei %L000%Xeurem%Ydeinem%Z Vorhaben.\n@c2@"
  en: "@a@b*: Sleep well, did you?\nWell, mind how you go, now.\n@c2@"
  es: "@a@b*: ¿%L000%XHabéis dormido%YHas dormido%Z bien?\n¡Estupendo! Bueno, %L000%Xtened%Yten%Z cuidado ¿vale?\n@c2@"
  fr: "@a@b*ⓢ Vous avez bien dormiⓡ\nFaites bien attention à vous, hein.\n@c2@"
  it: "@a@b*: Allora, dormito bene?\nBene. %H860%XFai%YFate%Z buon viaggio, allora.\n@c2@"
  ja: "@a@b＊「おはよう。\n\t気をつけてゆくんだよ。\n@c2@"
"23":
  de: "@a@b*: Nein? Wie Ihr wünscht.\n%L000%XMacht%YMach%Z es gut.\n@c2@"
  en: "@a@b*: No? As you wish, then.\nTake care, now.\n@c2@"
  es: "@a@b*: ¿No? Bueno.\n%L000%XTened%YTen%Z cuidado ¿vale?\n@c2@"
  fr: "@a@b*ⓢ Nonⓡ Comme vous voulez.\nÀ bientôt.\n@c2@"
  it: "@a@b*: No? Come %H860%Xpreferisci%Ypreferite%Z.\nCi vediamo.\n@c2@"
  ja: "@a@b＊「そうかい？\n\t気をつけてゆくんだよ。\n@c2@"
"24":
  de: "@a@b*: Ich bin ein reisender Händler.\n@c2@"
  en: "@a@b*: I'm a travelling salesman.\n@c2@"
  es: "@a@b*: Pues soy mercader ambulante.\n@c2@"
  fr: "@a@b*ⓢ Je suis un marchand ambulant.\n@c2@"
  it: "@a@b*: Io sono un commesso viaggiatore.\n@c2@"
  ja: "@a@b＊「わたしは　旅の商人です。\n@c2@"
"25":
  de: "@a@b*: Bis vor Kurzem war ich auf dem Wüstenbasar in Maestral, aber der ist inzwischen beendet.\n@c2@"
  en: "@a@b*: I was at the desert bazaar in Maestral until recently, but that's finished now.\n@c2@"
  es: "@a@b*: Estaba en el bazar del desierto en Mistral hasta hace poco, pero ya no estoy allá.\n@c2@"
  fr: "@a@b*ⓢ Il y a peu, j'étais encore au bazar du désert, sur le Mistral, mais il est fermé à présent.\n@c2@"
  it: "@a@b*: Recentemente sono passato al Desermercato di Maystrale, ma ho visto che ha chiuso i battenti.\n@c2@"
  ja: "@a@b＊「この間まで　サントハイムの国で\n\t砂漠のバザーを開いていたのですが\n\tそれも　終わってしまいました。\n@c2@"
"26":
  de: "@a@b*: Darum bin ich jetzt unterwegs nach Süden.\nNach Laissez Fayre.\n@c2@"
  en: "@a@b*: So I'm on my way south.\nTo Laissez Fayre.\n@c2@"
  es: "@a@b*: Voy de camino al sur nomás.\nA Laissez Fayre.\n@c2@"
  fr: "@a@b*ⓢ J'ai donc pris le chemin du sud.\nEn direction de Teafortwo.\n@c2@"
  it: "@a@b*: E così ora mi dirigo verso sud, a Laissez Fayre.\n@c2@"
  ja: "@a@b＊「これから　南のモンバーバラに\n\t行くとちゅうです。\n@c2@"
"27":
  de: "@a@b*: Aber wo wir schon so nett miteinander schwatzen, können wir ja vielleicht auch noch ein kleines Geschäft abschließen?\n@c2@"
  en: "@a@b*: Anyway, seeing as we're having this little chat, perhaps we can do some impromptu business?\n@c2@"
  es: "@a@b*: Bueno, ya que estamos aquí platicando, podríamos improvisar algún negocio, ¿eh?\n@c2@"
  fr: "@a@b*ⓢ Enfin, puisque nous avons cette petite conversation, peut-être pouvons-nous faire quelques affaires au débottéⓡ\n@c2@"
  it: "@a@b*: Comunque, già che stiamo facendo quattro chiacchiere, perché non parliamo d'affari?\n@c2@"
  ja: "@a@b＊「さて！\n\tみなさんが　みえたから\n\t商売をさせてもらいましょう！\n@c2@"
"28":
  de: "@a@b*: Ich bin ein reisender Händler.\n@c2@"
  en: "@a@b*: I'm a travelling salesman.\n@c2@"
  es: "@a@b*: Soy mercader ambulante.\n@c2@"
  fr: "@a@b*ⓢ Je suis un marchand ambulant.\n@c2@"
  it: "@a@b*: Io sono un commesso viaggiatore.\n@c2@"
  ja: "@a@b＊「わたしは　旅の商人です。\n@c2@"
"29":
  de: "@a@b*: Bis vor Kurzem war ich auf dem Wüstenbasar in Maestral. Habt Ihr gehört, dass sie dort eine neue Stadt gegründet haben?\n@c2@"
  en: "@a@b*: I was at the desert bazaar in Maestral until recently. Did you hear they've set up a new town there?\n@c2@"
  es: "@a@b*: Estaba en el bazar del desierto de Mistral hasta hace bien poco. ¿%H860%XHas%YHabéis%Z oído el rumor? Han establecido una nueva ciudad allí.\n@c2@"
  fr: "@a@b*ⓢ Il y a peu, j'étais encore au bazar du désert, sur le Mistral. Saviez-vous qu'ils avaient établi une nouvelle ville, là-basⓡ\n@c2@"
  it: "@a@b*: Recentemente sono stato al Desermercato di Maystrale, e ho saputo che lì hanno fondato un nuovo villaggio.\n@c2@"
  ja: "@a@b＊「そういえば　以前　砂漠のバザーを\n\tやっていた場所に　新しい町が\n\tできたと　ウワサに聞きましたな。\n@c2@"
"30":
  de: "@a@b*: Die würde ich mir ja gern mal ansehen. Aber Besichtigungen können warten. Das Geschäft geht vor!\n@c2@"
  en: "@a@b*: I'd love to see what it's like.\nBut sightseeing can wait.\nThere's business to be done!\n@c2@"
  es: "@a@b*: Me gustaría ver qué aspecto tiene.\nPero dejaré el turismo para otro día.\n¡Primero los negocios!\n@c2@"
  fr: "@a@b*ⓢ J'adorerais voir à quoi elle ressemble.\nMais le tourisme peut attendre.\nJ'ai un commerce à faire tournerⓠ\n@c2@"
  it: "@a@b*: Vorrei proprio visitarlo...\nMa questo non è il momento di pensare alle ferie! Ho ancora molto da lavorare!\n@c2@"
  ja: "@a@b＊「どんな町なのか　一度\n\t見にいってみたいですが\n\tそれは　さておき……。\n@c2@"
"31":
  de: "@a@b*: Maya!\n@c2@"
  en: "@a@b*: Maya!\n@c2@"
  es: "@a@b*: ¡Maya!\n@c2@"
  fr: "@a@b*ⓢ Mayaⓠ\n@c2@"
  it: "@a@b*: Maya!\n@c2@"
  ja: "@a@b＊「マーニャちゃん！\n@c2@"
