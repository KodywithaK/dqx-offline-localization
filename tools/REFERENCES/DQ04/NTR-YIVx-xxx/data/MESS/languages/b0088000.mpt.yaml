  en: "@a@bⓗHere lies Mahabala-jee, master of the ancient-ancient art of rasatantra alchemy.ⓘ\n@c0@"
  es: "@a@b''Aquí yace Mahabala, maestro del antiguo arte de la alquimia Rasatantra.''\n@c0@"
  fr: "@a@bⓥCi-gît Mahabala-jee, maître de l'ancien art de l'alchimie Rasatantra.ⓦ\n@c0@"
  it: "@a@bⓗQui giace il guru Malaparata, maestro dell'antichissima arte dell'alchimia rasatantra.ⓘ\n@c0@"
