"0":
  de: "@a@b*: Eigentlich bin ich zum Arbeiten nach Bruckstetten gekommen, aber hier sieht's momentan gar nicht gut aus.\n@c1@"
  en: "@a@b*: I came to Ballymoral lookin' fer work, but the place is in a bit of a slump at the moment.\n@c1@"
  es: "@a@b*: Vine a Alcazaba en busca de triabajo, pero parece que la ciudad está piasando por un periodo de diepresión.\n@c1@"
  fr: "@a@b*ⓢ Je suis venue à Ballimore pour chercher du travail, mais on ne peut pas dire que cet endroit soit très reluisant en ce momentⓠ\n@c1@"
  it: "@a@b*: So' venuta a Balmontone pe' cerca' lavoro, ma in questo periodo mi sembra che 'un ci sia molto da fa'.\n@c1@"
  ja: "@a@b＊「仕事を探して　ボンモールまで\n\t来たんだけど　ここって\n\t城下町にしては　しけた所よね。\n@c1@"
"1":
  de: "@a@b*: Ich hätt's wissen müssen. Wenn man Arbeit sucht, ist man in Endor besser aufgehoben.\n@c1@"
  en: "@a@b*: Aaah, I shoulda known.\nIf it's work ye're after, ye can't beat Endor.\n@c1@"
  es: "@a@b*: ¡Ah!, debí habierlo imaginiado.\nSi lo que buscas es triabajo, Endor es el miejor lugar.\n@c1@"
  fr: "@a@b*ⓢ Ah, j'aurais dû m'en douter.\nQuand on cherche du travail, c'est à Chandor qu'il faut aller.\n@c1@"
  it: "@a@b*: Ahhh, avrei dovuto immaginarmelo. Quando si tratta di trova' lavoro, 'un c'è un posto migliore di Endor!\n@c1@"
  ja: "@a@b＊「あーあ　やっぱり　はたらくんなら\n\tエンドールが　いちばんだわ。\n@c1@"
"2":
  de: "@a@b*: Willkommen auf Burg Bruckstetten!\n@c2@"
  en: "@a@b*: Welcome to Ballymoral Castle!\n@c2@"
  es: "@a@b*: ¡%H860%X%A120%XBienvienido%Z%B120%XBienvienida%Z%Y%R000%XBienvienidas%YBienvienidos%Z%Z al Castillo de Alcazaba!\n@c2@"
  fr: "@a@b*ⓢ Bienvenue au château de Ballimoreⓠ\n@c2@"
  it: "@a@b*: Salve, %H860%Xviandante%Yviandanti%Z! Questo è il castello di Balmontone!\n@c2@"
  ja: "@a@b＊「ボンモールのお城に　ようこそ。\n@c2@"
"3":
  de: "@a@b*: Haste schon gehört? Der Typ aus Lakanaba, der im Gefängnis hockte, ist ausgebrochen!\n@c3@"
  en: "@a@b*: Have ye heard? The fella locked up from Lakanaba only went an' broke out o' jail, so he did!\n@c3@"
  es: "@a@b*: ¿%H860%XTi has%YOs habéis%Z entierado? El tipo de Lakanaba que estiaba encierrado consiguió escapar de la cárciel, ¡eso pariece!\n@c3@"
  fr: "@a@b*ⓢ Vous avez entenduⓡ Le gars de Lakanaba a réussi à s'enfuir de prison. Pas croyableⓠ\n@c3@"
  it: "@a@b*: %H860%XTe tu hai%YAvete%Z sentito? Il tizio di Lacanata è evaso dalla prigione!\n@c3@"
  ja: "@a@b＊「なんと！　牢屋に　入れられていた\n\tレイクナバの男が　脱獄したらしいぜ！\n@c3@"
"4":
  de: "@a@b*: Aber der is' ja bloß 'n mieser kleiner Gauner. Wegen dem setzen die sicher nicht Himmel und Hölle in Bewegung.\n@c3@"
  en: "@a@b*: Mind you, he's nuttin' but a petty crook, so I doubt they'll bother with him much.\n@c3@"
  es: "@a@b*: %H860%XTi%YOs%Z asieguro que es un canalla de poca monta, así que no pierderá diemasiado tiempo con él.\n@c3@"
  fr: "@a@b*ⓢ En même temps, c'est qu'un petit escroc. Ça m'étonnerait qu'ils le recherchent longtemps.\n@c3@"
  it: "@a@b*: Però è solo un ladruncolo da du' soldi... 'Un credo che perderanno troppo tempo a cercarlo.\n@c3@"
  ja: "@a@b＊「まっ　しょうもない　コソドロだったので\n\t誰も　気にとめていないけどよ。\n@c3@"
"5":
  de: "@a@b*: Endor ist nur 'nen Katzensprung von hier. Bin mal da gewesen, aber das war, bevor die Brücke eingestürzt ist.\n@c2@"
  en: "@a@b*: Y'know, Endor's only a good spit from here. I'd been there once meself before the bridge was banjaxed.\n@c2@"
  es: "@a@b*: Sabies, Endor quieda a tiro de piedra de aquí. Yo mismo estiuve allí una vez, antes de que hicieran migas el puente.\n@c2@"
  fr: "@a@b*ⓢ On n'est pas très loin de Chandor. J'y ai été une fois quand le pont tenait encore debout.\n@c2@"
  it: "@a@b*: Endor è qui a du' passi. Una volta ci so' stato, prima che i'pponte fosse distrutto.\n@c2@"
  ja: "@a@b＊「南に行くと　エンドール。\n\t橋が　こわれる前　一度だけ\n\t行ったことがあるのだ。\n@c2@"
"6":
  de: "@a@b*: Ja, da war auch so ein alter Knacker, der wollte mir unbedingt sein Geschäft andrehen.\n@c2@"
  en: "@a@b*: Aye, there was a quare old fella there tryin' to sell me his shop, so there was.\n@c2@"
  es: "@a@b*: Había un tipo muy campiechano que mi intentó viender su tienda, sí.\n@c2@"
  fr: "@a@b*ⓢ Je me souviens. Un petit vieux avait essayé de me refourguer son magasin.\n@c2@"
  it: "@a@b*: Rihordo che c'era un tizio che voleva vendermi la su' bottega,\n@c2@"
  ja: "@a@b＊「そういえば　エンドールには\n\tお店を　売りたがっている\n\t老人が　いたぞ。\n@c2@"
"7":
  de: "@a@b*: Habt Ihr schon gehört, dass sie jetzt in der Burg gutes Gold für Rüstungen bezahlen?\n@c2@"
  en: "@a@b*: Have you heard they've started payin' top gold fer armour here at the castle?\n@c2@"
  es: "@a@b*: ¿Has oído el rumor? Pariece que en el castillo pagan muy bien las armiaduras.\n@c2@"
  fr: "@a@b*ⓢ On m'a dit qu'au château, ils se mettaient à payer des fortunes pour des armures.\n@c2@"
  it: "@a@b*: %H860%XTe tu lo sapevi%YVoi lo sapevate%Z che qui al castello pagano un mucchio di huattrini per le armature?\n@c2@"
  ja: "@a@b＊「近頃　お城じゃ　防具を\n\t高値で　買い取ってるって\n\t話じゃないか。\n@c2@"
"8":
  de: "@a@b*: Das ist wirklich ein wenig beunruhigend. Ich hoffe, dass es keinen Krieg geben wird.\n@c2@"
  en: "@a@b*: 'Tis unsettlin' altogether, so it is. I just hope we're not buildin' up to a war or suchlike.\n@c2@"
  es: "@a@b*: Es un poco inquietante. Espiero que no estén acumuliando material para una guierra o algo así.\n@c2@"
  fr: "@a@b*ⓢ J'aime pas trop ça. J'espère qu'ils ont pas dans l'idée d'aller faire la guerre ou quelque chose de ce genre.\n@c2@"
  it: "@a@b*: La hosa un po' mi puzza! Spero 'un stia per scoppia' una guerra, maremma pacifiha!\n@c2@"
  ja: "@a@b＊「いやだねえ。　戦争でも\n\tおっぱじめようってんでなきゃ\n\tいいんだけど……。\n@c2@"
"9":
  de: "@a@b*: Wegen der vielen Monster in der letzten Zeit stocken viele Burgen ihr Waffen- und Rüstungslager auf.\n@c2@"
  en: "@a@b*: With monsters on the increase these days, many castles are stockpiling weapons and armour.\n@c2@"
  es: "@a@b*: Con la cantidad de monstruos que apariecen hoy en día, muchos castillos empiezan a acumular armas y armiaduras.\n@c2@"
  fr: "@a@b*ⓢ Avec cette recrudescence des monstres, de nombreux châteaux constituent des stocks d'armes et d'armures.\n@c2@"
  it: "@a@b*: Con tutti i mostri che ci so' 'ngiro in questi giorni, molti regni stanno acquistando una gran quantità d'armi e armature.\n@c2@"
  ja: "@a@b＊「最近　怪物たちも強くなって\n\tそのため　多くのお城では\n\t武器　防具を買い集めているようです。\n@c2@"
"10":
  de: "@a@b*: Ein Waffenhändler wie Ihr muss momentan ganz schön was verdienen.\n@c2@"
  en: "@a@b*: A weapon merchant such as yourself must be making a fine living at the moment.\n@c2@"
  es: "@a@b*: Un vendiedor de armas como tú diebe estar ganando mucho diniero.\n@c2@"
  fr: "@a@b*ⓢ Les marchands d'armes comme vous doivent bien gagner leur vie en ce moment.\n@c2@"
  it: "@a@b*: I hommercianti d'armi come te fanno affari d'oro!\n@c2@"
  ja: "@a@b＊「いや～　武器屋の　あなたが\n\tうらやましい。\n\tきっと　大もうけでしょうなあ。\n@c2@"
"11":
  de: "@a@b*: Ich habe einen Rüstungsladen hier, und wegen der ganzen Monster, die sich neuerdings hier herumtreiben, hab ich sehr viel zu tun.\n@c2@"
  en: "@a@b*: I do be runnin' an armour shop here, so I do. But with all the monsters about recently, I'm sellin' out faster than I can buy.\n@c2@"
  es: "@a@b*: Sí, soy propietario de una tienda de armaduras. Pero, con tiantos monstruos, mi las quitan de las manos y no puedo ni reponierlas.\n@c2@"
  fr: "@a@b*ⓢ Je tiens un magasin d'armures. Mais avec tous ces monstres qui rôdent en ce moment, je peux pas répondre à toute la demande.\n@c2@"
  it: "@a@b*: Io c'ho 'na bottega d'armature qua. Ma co' tutti i mostri che ci so' 'a giro, 'un fo a tempo a mette' la merce sugli scaffali ch'è bell'e venduta!\n@c2@"
  ja: "@a@b＊「ここは　防具の店ですが\n\t怪物たちが　うろつくようになってから\n\t防具が　売れて　売れて……。\n@c2@"
"12":
  de: "@a@b*: Das zeigt doch mal wieder, dass es den meisten Leuten mehr Geld wert ist, sich selbst zu schützen, als gegen andere zu kämpfen.\n@c2@"
  en: "@a@b*: It just goes to show ye, yer ordinary fella puts more of a price on protectin' himself than on fightin' others.\n@c2@"
  es: "@a@b*: Esto diemuestra que un tipo normal prefiere pagar por protección antes que ponierse a luchar.\n@c2@"
  fr: "@a@b*ⓢ C'est juste pour vous expliquer que les gens hésitent pas à dépenser plus d'argent pour se défendre que pour s'armer.\n@c2@"
  it: "@a@b*: Ora come ora, la gente bada più a proteggersi che ad attacca'. 'Un so se mi spiego... \n@c2@"
  ja: "@a@b＊「やはり　一般の人々は　武器よりも\n\tまず　身を守る防具が\n\tほしいみたいですね。\n@c2@"
"13":
  de: "@a@b*: Ich will damit sagen, dass ich keine Waren mehr habe, das Lager ist leer. Tut mir leid.\n@c2@"
  en: "@a@b*: So, what I'm tryin' to tell y'is, I'm clean out o' stock at the minute. Sorry about that.\n@c2@"
  es: "@a@b*: Bueno, en resumen, lo que ti quiero decir es que mi he quedado sin existiencias. Lo siento mucho.\n@c2@"
  fr: "@a@b*ⓢ En gros, pour résumer, j'ai plus rien en stock.\nJe suis désolé.\n@c2@"
  it: "@a@b*: Insomma, ora 'un c'ho nulla da vende'. L'è tutto esaurito, mi dispiace.\n@c2@"
  ja: "@a@b＊「というわけで　品切れなんです。\n\tすいませんねえ。\n@c2@"
"14":
  de: "@a@b*: Entschuldigt bitte. Es wäre sehr lieb, wenn Ihr die Sachen anderer Leute nicht kaputtmachen würdet.\n@c2@"
  en: "@a@b*: If ye'll excuse me, %A120%Xsir%Z%B120%Xma'am%Z. I'd ask ye not to go banjaxin' other people's property if ye don't mind.\n@c2@"
  es: "@a@b*: Pierdone, %A120%Xamigo%Z%B120%Xamiga%Z. Si no le importa, preferiría que no si cargase las posiesiones de otras persionas.\n@c2@"
  fr: "@a@b*ⓢ Excusez-moi, %A120%XMonsieur%Z%B120%XMadame%Z, mais j'aimerais autant que vous démolissiez pas ce qui vous appartient pas, si ça vous dérange pas.\n@c2@"
  it: "@a@b*: %H860%XScusa%YScusate%Z, ma che maniere sono queste?! 'Un si va a giro a rompe' le hose dell'altri, eh!\n@c2@"
  ja: "@a@b＊「お客さん……\n\tあんまり　人の家のモノ\n\tこわさないでくださいよ。\n@c2@"
"15":
  de: "@a@b*: Dieser Architekt... wie heißt er noch...?\nAch ja, Archibald Tekt. Er ist endlich aufgetaucht.\n@c2@"
  en: "@a@b*: The architect...what's his name now...?\nAye, that's it, Archie O'Tect.\nWell, he's finally turned up.\n@c2@"
  es: "@a@b*: El arquitiecto... ¿cómo si llamaba...?\nEso es, Al Quitecto.\nBien, al fin ha apariecido.\n@c2@"
  fr: "@a@b*ⓢ L'architecte... comment il s'appelle déjà...ⓡ\nAh oui, Hector Busier.\nEh bien, il est de retour.\n@c2@"
  it: "@a@b*: L'architetto... Oh, qual è il su' nome...? \nAh, sì, Archie Tett. S'è rifatto vivo, finalmente.\n@c2@"
  ja: "@a@b＊「建築家の　ドン・ガアデどのが\n\tやっと来てくれたのです。\n@c2@"
"16":
  de: "@a@b*: Die Brücke wird bald repariert sein.\nWird aber auch langsam Zeit!\n@c2@"
  en: "@a@b*: The bridge'll be fixed in no time now.\n'Tis about time, too!\n@c2@"
  es: "@a@b*: El puente estiará arrieglado en breve.\n¡Ya iba siendo hora!\n@c2@"
  fr: "@a@b*ⓢ Le pont va être réparé en deux coups de cuillères à pot. Il était temps d'ailleurs.\n@c2@"
  it: "@a@b*: Ora i'pponte verrà sistemato in men che 'un si dica!\nMeglio tardi che mai, no?\n@c2@"
  ja: "@a@b＊「これで　こわれていた橋も\n\tすぐに　直るはず！\n\tよかった　よかった。\n@c2@"
"17":
  de: "@a@b*: Rüstungen sind derzeit Mangelware in der Burg.\n@c2@"
  en: "@a@b*: There's a desperate shortage of armour here in the castle.\n@c2@"
  es: "@a@b*: Estiamos muy niecesitados de armaduras en el castillo.\n@c2@"
  fr: "@a@b*ⓢ En ce moment, nous sommes vraiment à court d'armures au château.\n@c2@"
  it: "@a@b*: Al castello hanno un gran bisogno d'armature.\n@c2@"
  ja: "@a@b＊「このお城では　防具が\n\t不足しておるのだ。\n@c2@"
"18":
  de: "@a@b*: Ich nehme nicht an, dass Ihr ein paar von Euren verkaufen wollt, oder?\n@c2@"
  en: "@a@b*: I don't s'pose ye'd consider sellin' some o' yours, would ye?\n@c2@"
  es: "@a@b*: ¿No quierrías viendernos algo de la tuya?\n@c2@"
  fr: "@a@b*ⓢ Accepteriez-vous de nous en vendre\nquelques-unesⓡ\n@c2@"
  it: "@a@b*: %H860%XAscolta, 'un me ne venderesti%YAscoltate, 'un me ne vendereste%Z miha qualcuna?\n@c2@"
  ja: "@a@b＊「そなたの持っている　防具を\n\t売ってはくれぬか？\n@c2@"
"19":
  de: "@a@b*: Ach, Ihr habt gar nichts zu verkaufen? Schade. Kommt wieder, wenn Ihr was loswerden wollt.\n@c2@"
  en: "@a@b*: But ye've nuttin' to sell, have ye?\nCome back when ye're ready to do business, like.\n@c2@"
  es: "@a@b*: Pero si no tienes nada que viender.\nVuelve cuando podamos hacer niegocios, sí.\n@c2@"
  fr: "@a@b*ⓢ Mais vous n'avez pas grand chose à vendre, je me trompeⓡ\nRevenez quand vous voudrez faire affaire.\n@c2@"
  it: "@a@b*: Uh, maremma esaurita! 'Un %H860%Xc'hai%Yc'avete%Z nulla da vende'? Allora ci si rivede huando %H860%Xc'avrai%Yc'avrete%Z hualcosa da darmi!\n@c2@"
  ja: "@a@b＊「しかし　そなたは　売り物を　なにも\n\t持っておらぬでは　ないか。\n\tまた　あらためて　来るがよい。\n@c2@"
"20":
  de: "@a@b*: Was möchtet Ihr denn verkaufen?\n@c2@"
  en: "@a@b*: So, what is it that ye'd be wantin' to sell, then?\n@c2@"
  es: "@a@b*: Bien, ¿qué es lo que quieres viender?\n@c2@"
  fr: "@a@b*ⓢ Alors, qu'est-ce que vous voulez vendre exactementⓡ\n@c2@"
  it: "@a@b*: Allora, cos'è che %H860%Xvoi%Yvolete%Z vende'?\n@c2@"
  ja: "@a@b＊「どれを　売ってくれるのじゃ？\n@c2@"
"21":
  de: "@a@b*: %0%a73100, sagt Ihr? Ich würde Euch %a00750 Goldmünze%H750%X%Yn%Z dafür geben. Wie hört sich das an?\n@c2@"
  en: "@a@b*: %0%a04100, is it? Sure, I'll take %M100%Xthem%Yit%Z off ye for %a00750 gold coin%H750%X%Ys%Z. How does that sound?\n@c2@"
  es: "@a@b*: ¿%0%a04100, verdad? Claro, mi quedo con %M100%X%A100%Xellos%Z%B100%Xellas%Z%C100%Xellas%Z%Y%A100%Xél%Z%B100%Xella%Z%C100%Xella%Z%Z por %a00750 moneda%H750%X%Ys%Z de oro. ¿Qué ti parece?\n@c2@"
  fr: "@a@b*ⓢ %0%a04100, c'est çaⓡ Entendu, je vous %A100%Xle%Z%B100%Xla%Z%C100%X%Z prends pour %a00750 pièce%I750%X%Ys%Z d'or. Vous en dites quoiⓡ\n@c2@"
  it: "@a@b*: %0%a04100, nevvero? Sì, Posso hompra' huesta roba per %a00750 %H750%Xmoneta %Ymonete%Z d'oro. Va bene?\n@c2@"
  ja: "@a@b＊「%a00100だな。\n\tそれなら　%a00750Ｇで\n\t買い取ろう。　いいかな？\n@c2@"
"22":
  de: "@a@b*: Das wär also abgemacht. Es war mir ein Vergnügen, mit Euch Geschäfte zu machen.\n@c2@"
  en: "@a@b*: 'Tis a done deal, then.\nA pleasure doin' business with ye.\n@c2@"
  es: "@a@b*: Triato hecho, entonces.\nHa sido un pliacer hacer niegocios contigo, sí.\n@c2@"
  fr: "@a@b*ⓢ Topez-la, mon brave. C'est un plaisir de faire affaire avec vous.\n@c2@"
  it: "@a@b*: Affare fatto! L'è un piacere fa' affari con %H860%Xte%Yvoi%Z!\n@c2@"
  ja: "@a@b＊「たしかに　受け取ったぞ！\n@c2@"
"23":
  de: "@a@b*: Ihr wollt nicht zufällig noch etwas anderes verkaufen?\n@c2@"
  en: "@a@b*: Now d'ye fancy sellin' anytin' else at all?\n@c2@"
  es: "@a@b*: ¿Quieres viender alguna cosa más?\n@c2@"
  fr: "@a@b*ⓢ Vous avez autre chose à vendreⓡ\n@c2@"
  it: "@a@b*: Che per caso %H860%Xc'hai%Yc'avete%Z altro da vende'?\n@c2@"
  ja: "@a@b＊「他にも　なにか　売ってくれるかな？\n@c2@"
"24":
  de: "@a@b*: Davon haltet Ihr nichts?\nAch, das ist aber schade.\n@c2@"
  en: "@a@b*: That's no good to ye?\nWell that's a shame...\n@c2@"
  es: "@a@b*: ¿No ti intieresa?\nEs una piena, sí...\n@c2@"
  fr: "@a@bÇa ne vous convient pasⓡ\nC'est bien dommage...\n@c2@"
  it: "@a@b*: 'Un ti va bene?\nOh, l'è un vero peccato.\n@c2@"
  ja: "@a@b＊「そうか　残念じゃのう。\n@c2@"
"25":
  de: "@a@b*: Tut mir leid, aber Waffen habe ich genug. Das Einzige, was mich interessiert, sind Rüstungen.\n@c2@"
  en: "@a@b*: Sorry, fella, but I've weapons an' the like comin' out o' me ears. 'Tis only armour I'm interested in.\n@c2@"
  es: "@a@b*: Lo siento, amigo, pero tiengo tantas armas que ya no mi caben en casa. Solo estoy intieresado en armaduras.\n@c2@"
  fr: "@a@b*ⓢ Désolé, mon ami, mais les armes, je sais plus où les stocker. J'ai seulement besoin d'armuresⓠ\n@c2@"
  it: "@a@b*: Mi spiace, ma d'armi ce n'ho anche troppe. M'interessano solo l'armature.\n@c2@"
  ja: "@a@b＊「悪いが　武器や　他のものなら\n\tもう　充分に　あるのじゃよ。\n@c2@"
"26":
  de: "@a@b*: Ihr wärt ganz schön dumm, wenn Ihr das verkaufen würdet. Keine Chance, das kaufe ich nicht.\n@c2@"
  en: "@a@b*: Ye'd be in a right pickle if I took that off ye now, wouldn't ye? Stop playin' the maggot. I'm not buyin' it.\n@c2@"
  es: "@a@b*: Si mi quiedase con eso ti mietería en un buen aprieto, ¿no crees? Deja de hacier el tarugo. No compro.\n@c2@"
  fr: "@a@b*ⓢ Vous seriez dans une sacrée mouise si je vous prenais ça, nonⓡ Arrêtez de faire le malin. Je ne suis pas preneur.\n@c2@"
  it: "@a@b*: %H860%XGuarda che ti metti ne' pasticci, se vendi%YGuardate che vi mettete ne' pasticci, se vendete%Z questa roba! 'Un %H860%Xfa'%Yfate%Z bischerate! Io 'un la hompro. 'Un %H860%Xti%Yvi%Z voglio ave' sulla hoscienza!\n@c2@"
  ja: "@a@b＊「それを　売ってしまっては\n\tそなたが　困るであろう。\n\t買い取るわけには　いかんな。\n@c2@"
"27":
  de: "@a@b*: Gut. Ihr könnt wiederkommen, wann immer Ihr wollt.\n@c2@"
  en: "@a@b*: Then I'll be seein' ye when ye do.\nCome back whenever ye want.\n@c2@"
  es: "@a@b*: Entoncies nos viemos cuando sea.\nVuelve siemprie que quieras, sí.\n@c2@"
  fr: "@a@b*ⓢ Eh bien, à la prochaine, alors.\nRevenez quand vous voulez.\n@c2@"
  it: "@a@b*: Allora ci si rivede huando %H860%Xc'avrai%Yc'avrete%Z hualcosa da vende'.\n@c2@"
  ja: "@a@b＊「では　また　防具を手に入れたら\n\t売りに来るがよい。\n\t待っているぞ。\n@c2@"
"28":
  de: "@a@b*: Nein? Ach, das ist aber schade.\n@c2@"
  en: "@a@b*: Ye wouldn't?\nWell that's a shame.\n@c2@"
  es: "@a@b*: ¿Que no quieres?\nVaya, qué liástima.\n@c2@"
  fr: "@a@b*ⓢ Nonⓡ Vraimentⓡ\nC'est bien dommage.\n@c2@"
  it: "@a@b*: No? Che peccato!\n@c2@"
  ja: "@a@b＊「そうか　残念じゃのう。\n@c2@"
"29":
  de: "@a@b*: Aber ich geb Euch 'nen guten Rat, wo Ihr doch ein aufstrebender Händler seid und so.\n㈡\n*: Beschränkt Euch nicht auf den Handel mit Waffen. Auch mit Rüstungen kann man 'ne Menge Geld verdienen, wirklich.\n@c2@"
  en: "@a@b*: But I'll give ye some advice, seein' as yerself is an aspirin' merchant an' that.\n㈡\n*: Don't just trade in weapons.\nThere's quare money in armour, so there is.\n@c2@"
  es: "@a@b*: Pero dieja que ti dé un consiejo, de un mercader experto a uno principiante.\n㈡\n*: No ti limites solo a las armas. \nHay buen niegocio en las armaduras, sí.\n@c2@"
  fr: "@a@b*ⓢ Permettez-moi de vous donner un conseil si vous voulez vous lancer dans le commerce.\n㈡\n*ⓢ Ne vous cantonnez pas aux armes. Il y a beaucoup d'argent à se faire avec les armures, croyez-moi.\n@c2@"
  it: "@a@b*: Ma %H860%Xti%Yvi%Z do un consiglio: se %H860%Xte voi diventa' commerciante%Yvoi volete diventa' commercianti%Z, non %H860%Xdevi tratta'%Ydovete tratta'%Z solo armi.\n㈡\n*: Si fanno molti più huattrini con l'armature!\n@c2@"
  ja: "@a@b＊「しかし　そなたも　商人なら\n\t武器だけに　こだわらず　防具も\n\tあつかった方が　もうかるはずじゃぞ。\n@c2@"
"30":
  de: "@a@b*: Endor ist ein reiches Land.\n@c2@"
  en: "@a@b*: Endor's a rich land.\n@c2@"
  es: "@a@b*: Endor es una tierra rica.\n@c2@"
  fr: "@a@b*ⓢ Chandor est un pays riche.\n@c2@"
  it: "@a@b*: Endor è una terra molto ricca.\n@c2@"
  ja: "@a@b＊「エンドールは　豊かな国。\n@c2@"
"31":
  de: "@a@b*: Und der König möchte sich diesen Reichtum schon seit langem einverleiben.\n@c2@"
  en: "@a@b*: 'Tas been the King's wish fer many a long year to take it fer his own.\n@c2@"
  es: "@a@b*: Ya hace muchios años que el rey quiere apriopiarse de ella.\n@c2@"
  fr: "@a@b*ⓢ Ça fait bien longtemps que le roi voudrait l'envahir.\n@c2@"
  it: "@a@b*: Ormai è molto tempo che i'Rre vole honquistarla.\n@c2@"
  ja: "@a@b＊「あの国を　手に入れることが\n\t王の　長年の夢だったのです。\n@c2@"
"32":
  de: "@aKönig Kunz@bMein Sohn ist der zukünftige König von Endor, jawohl! Welch großer Tag!\n@c2@"
  en: "@aKing Shamus@bMe son's goin' to be the next King of Endor, so he is! Ah, 'tis grand altogether!\n@c2@"
  es: "@aSah Cha Cha@b¡Mi hijo si va a conviertir en el prióximo rey de Endor, eso es! ¡Ah, esto es miagnífico!\n@c2@"
  fr: "@aRoi Chamtu@bMon fils va devenir le prochain roi de Chandorⓠ\nC'est merveilleuxⓠ\n@c2@"
  it: "@aRe Torus@bIl mi' figliolo diventerà i'pprossimo re d'Endor! L'è una hosa magnifiha!\n@c2@"
  ja: "@a@b王「わが息子リックが\n\t次の　エンドールの王さまじゃ！\n\tわっはっはっ！\n@c2@"
"33":
  de: "@aPrinz Hinz@bIch habe die Neuigkeit schon erfahren. Könnt Ihr Prinzessin Veronica etwas mitteilen, wenn Ihr nach Endor geht?\n@c2@"
  en: "@aPrince Regan@bI heard the news from my father.\nIf you go to Endor, please give this message to Princess Veronica from me...\n@c2@"
  es: "@aPríncipe Alí@bHe escuchiado la noticia de boca de mi piadre.\nSi vias a Endor, haz lliegar este mensiaje a la Princesa Verónica de mi parte...\n@c2@"
  fr: "@aPrince Réginald@bMon père vient de m'apprendre la nouvelle.\nSi vous allez à Chandor, merci de répéter ce que je vais vous dire à la princesse Véronica...\n@c2@"
  it: "@aPrincipe Vitellozzo@bIl mi' babbo m'ha detto tutto. Se %H860%Xte tu va'%Yvoi andate%Z a Endor, %H860%Xti%Yvi%Z prego di far ave' un messaggio alla Principessa Veronica da parte mia...\n@c2@"
  ja: "@a@bリック「父上から　話は　聞きました。\n\tもし　エンドールに行ったなら\n\tモニカに　伝えてください。\n@c2@"
"34":
  de: "@aPrinz Hinz@bSagt ihr... dass ich es kaum abwarten kann, sie endlich zu heiraten!\n@c2@"
  en: "@aPrince Regan@bTell her...I can't wait until we're married!\n@c2@"
  es: "@aPríncipe Alí@bDecidle... ¡que estoy dieseando casiarme!\n@c2@"
  fr: "@aPrince Réginald@bDites-lui... que je suis très impatient que nous soyons mariésⓠ\n@c2@"
  it: "@aPrincipe Vitellozzo@b%H860%XDille%YDitele%Z che 'un vedo l'ora di sposarla!\n@c2@"
  ja: "@a@bリック「キミと　結婚できる日が\n\tとても　待ち遠しい……と！\n@c2@"
"35":
  de: "@a@b*: Das sind die Privatgemächer des Prinzen. Gewöhnliche Waffenhändler sind hier nicht erwünscht.\n@c1@"
  en: "@a@b*: This here is the Prince's personal chamber.\n'Tis no place for a common arms merchant.\n@c1@"
  es: "@a@b*: Estos son los aposientos privados del Príncipe. No es liugar para un vulgar mercadier de armas.\n@c1@"
  fr: "@a@b*ⓢ Vous êtes dans le cabinet du prince. Un simple marchand d'armes n'a rien à y faire.\n@c1@"
  it: "@a@b*: Questa è la hamera personale de i'Pprincipe. 'Un semplice mercante d'armi 'un pole miha sta' qui!\n@c1@"
  ja: "@a@b＊「ここは　王子さまの　お部屋。\n\t武器商人ふぜいの\n\t来てよい所では　ありません。\n@c1@"
"36":
  de: "@a@b*: Das hier ist der Kerker! Es ist streng verboten, mit den Gefangenen zu sprechen. Verschwinde!\n@c2@"
  en: "@a@b*: This is the dungeon! Talkin' with the convicts is strictly forbidden, so it is.\nGet away outta here!\n@c2@"
  es: "@a@b*: ¡Esto son las mazmorras! Está terminiantemente prohibido hablar con los presos, sí. ¡Fuera de aquí!\n@c2@"
  fr: "@a@b*ⓢ Ohⓠ C'est un donjon iciⓠ Il est interdit de parler avec les prisonniers. Fichez-moi le campⓠ\n@c2@"
  it: "@a@b*: Queste sono le prigioni! 'Un si pole parla' co' prigionieri! Fori!\n@c2@"
  ja: "@a@b＊「ここは　牢獄！\n\t囚人と　話すこと　まかりならぬ！\n\tさあ　出てゆかれよ。\n@c2@"
"37":
  de: "@a@b*: Wer bist du?\n@c2@"
  en: "@a@b*: Who are you?\n@c2@"
  es: "@a@b*: ¿Quién eres?\n@c2@"
  fr: "@a@b*ⓢ Qui êtes-vousⓡ\n@c2@"
  it: "@a@b*: Chi %H860%Xsei%Ysiete%Z?\n@c2@"
  ja: "@a@b＊「何者だっ！？\n@c2@"
"38":
  de: "@a@b*: Das hier ist der Kerker! Es ist streng verboten, mit den Gefangenen zu sprechen. Verschwinde!\n@c2@"
  en: "@a@b*: This is the dungeon! Talkin' with the convicts is strictly forbidden, so it is.\nGet away outta here!\n@c2@"
  es: "@a@b*: ¡Esto son las mazmorras! Está terminiantemente prohibido hablar con los presos, sí. ¡Fuera de aquí!\n@c2@"
  fr: "@a@b*ⓢ Ohⓠ C'est un donjon iciⓠ Il est interdit de parler avec les prisonniers. Fichez-moi le campⓠ\n@c2@"
  it: "@a@b*: Queste sono le prigioni! 'Un si pole parla' co' prigionieri! Fori!\n@c2@"
  ja: "@a@b＊「ここは　牢獄！\n\t囚人と　話すこと　まかりならぬ！\n\tさあ　出てゆかれよ。\n@c2@"
"39":
  de: "@a@b*: Du kannst ihn vielleicht nicht sehen, den Kerl in der Zelle dort, aber er ist da. Schläft wahrscheinlich in der hintersten Ecke.\n@c2@"
  en: "@a@b*: Ye might not be able to see the fella in the cell over there, but he's inside, to be sure. Sleepin' at the back, I expect.\n@c2@"
  es: "@a@b*: A lo miejor no puedes ver al tipo de esa celda, pero sieguro que está dentro. Estiará durmiendo ahí atrás.\n@c2@"
  fr: "@a@b*ⓢ Vous ne voyez peut-être pas le gars dans le cachot à côté, mais il est là. Il doit être au fond en train de dormir.\n@c2@"
  it: "@a@b*: Forse da qui non si vede, ma c'è un altro tipo nella cella in fondo, e scommetto che sta dormendo.\n@c2@"
  ja: "@a@b＊「あっちに入れられてる　男の姿が\n\t見えなくなったけど　奥のほうで\n\tゴロ寝でも　してるんだろ。\n@c2@"
"40":
  de: "@a@b*: Es ist verboten, die Burg bei Nacht zu betreten.\n@c2@"
  en: "@a@b*: 'Tis forbidden to enter into the castle at night.\n@c2@"
  es: "@a@b*: Está prohibido entrar de nochie en el castillo.\n@c2@"
  fr: "@a@b*ⓢ Interdiction d'entrer dans le château la nuit.\n@c2@"
  it: "@a@b*: Di notte 'un si pole entra' ne i'ccastello.\n@c2@"
  ja: "@a@b＊「このような　夜更けに\n\tお城に入ること　まかりならん！\n@c2@"
"41":
  de: "@a@b*: Komm morgen früh wieder, wenn es hell ist und wir dich im Auge behalten können.\n@c2@"
  en: "@a@b*: Come back in the mornin' when it's light an' we can keep an eye on ye.\n@c2@"
  es: "@a@b*: Vuelve por la mañana dispués de salir el sol para que podiamos vigiliarte.\n@c2@"
  fr: "@a@b*ⓢ Revenez demain matin. Il fera jour et on pourra vous avoir à l'œil.\n@c2@"
  it: "@a@b*: %H860%XTorna%YTornate%Z domattina, huando con la luce potremo %H860%Xtenerti%Ytenervi%Z d'occhio facilmente.\n@c2@"
  ja: "@a@b＊「また　明日\n\t出直してくるが　よろしかろう。\n@c2@"
"42":
  de: "@a@b*: Prinz Hiiinz! Prinz Hiiiiinz!\nAch, der Prinz ist verschwunden. Ich kann ihn nirgendwo finden...\n@c1@"
  en: "@a@b*: Prince Reeeeegan! Prince Reeeegan!\nThe Prince has vanished, so he has.\nI can't find him anywhere...\n@c1@"
  es: "@a@b*: ¡Ay!\nEl Príncipe ha diesapariecido, sí.\nNo lo encuentro por ningún lado.\n@c1@"
  fr: "@a@b*ⓢ Prince Réginaaaldⓠ Prince Réginaaaldⓠ\nLe prince a disparu.\nJe ne le trouve nulle part...\n@c1@"
  it: "@a@b*: Oh, mia buona dea! Il Principe l'è sparito! 'Un riesco a trovarlo da nessuna parte...\n@c1@"
  ja: "@a@b＊「王子さまー！\n\t王子さまが　いなくなったのです。\n\tおろおろ……。\n@c1@"
"43":
  de: "@a@b*: Ha-püh... Ha-püh... Gold... Gold... Gold... Mehr Monster... Mehr Rüstungen... Ha-püh...\n@c2@"
  en: "@a@b*: Ah-phew... Ah-phew... Gold...gold...gold...\nMore monsterzzz... More armour... Ah-phew...\n@c2@"
  es: "@a@b*: Ah-fiuu... Ah-fiuu... Oro... oro... oro...\nMás monstruozzz... Más armaduras... Ah-fiuu...\n@c2@"
  fr: "@a@b*ⓢ Ron-pfff... ron-pfff... de l'or... de l'or... plus de monstres... plus d'armures... ron-pfff...\n@c2@"
  it: "@a@b*: Ronf... Ronf... Oro... Oro... Oro...\nAltri mostri... Altre armature... Ronf...\n@c2@"
  ja: "@a@b＊「むにゃむにゃ……。\n\t怪物のおかげで　防具が\n\t売れて　売れて……ぬふふふ。\n@c2@"
"44":
  de: "@a@b*: Zivilisten haben nur tagsüber Zutritt zur Burg. Geh jetzt und komm morgen früh wieder!\n@c2@"
  en: "@a@b*: Entrance to the castle is only granted to civilians durin' the day. Away with ye an' come back in the mornin'!\n@c2@"
  es: "@a@b*: Los civilies solo pueden entrar al castillo de día. ¡Largo de aquí! ¡Vuelve por la mañiana!\n@c2@"
  fr: "@a@b*ⓢ Les civils ne sont admis dans le château que de jour. Circulez et revenez demain matinⓠ\n@c2@"
  it: "@a@b*: L'accesso a i'ccastello è consentito a' civili solo durante i'ggiorno. %H860%XVa'%YAndate%Z via e %H860%Xtorna%Ytornate%Z domattina!\n@c2@"
  ja: "@a@b＊「夜の間　城内への立ち入りは\n\t禁じられておる。\n\tまた　明日　来るがよい。\n@c2@"
"45":
  de: "@a@b*: Seid Ihr ein offizieller Hoflieferant?\n@c2@"
  en: "@a@b*: You're one of His Majesty's regular merchants, are you?\n@c2@"
  es: "@a@b*: Eres uno de los mercaderes habituales de Su Majestad, ¿no es cierto?\n@c2@"
  fr: "@a@b*ⓢ Êtes-vous l'un des marchands attitrés de Sa Majestéⓡ\n@c2@"
  it: "@a@b*: Sei uno dei commercianti da cui Sua Maestà si serve regolarmente? \n@c2@"
  ja: "@a@b＊「お城　ご用達の商人か？\n@c2@"
"46":
  de: "@a@b*: Dann dürft Ihr eintreten.\n@c2@"
  en: "@a@b*: Then you may enter through here.\n@c2@"
  es: "@a@b*: Entonces puedes entrar por aquí.\n@c2@"
  fr: "@a@b*ⓢ Dans ce cas, vous pouvez entrer.\n@c2@"
  it: "@a@b*: Allora puoi passare di qua.\n@c2@"
  ja: "@a@b＊「ならば　このトビラより\n\t中に　入るがよい。\n@c2@"
"47":
  de: "@a@b*: Aber Ihr kommt, um Eure Waren zu verkaufen, nicht?\n@c2@"
  en: "@a@b*: But you've come to sell your wares, I suppose?\n@c2@"
  es: "@a@b*: Pero imagino que habrás venido a vender tu mercancía.\n@c2@"
  fr: "@a@b*ⓢ Mais vous venez pour vendre vos marchandises, j'imagineⓡ\n@c2@"
  it: "@a@b*: Sei qui per vendere la tua merce, esatto?\n@c2@"
  ja: "@a@b＊「では　売りこみに　来たのだな。\n@c2@"
"48":
  de: "@a@b*: Tut mir leid, König Norbert lässt keine neuen Händler zu, außer in besonderen Fällen. Versucht es anderswo.\n@c2@"
  en: "@a@b*: I'm sorry, but King Norman doesn't accept new tradesmen other than in exceptional circumstances. You'll have to try elsewhere.\n@c2@"
  es: "@a@b*: Lo siento, pero el rey Norman no acepta nuevos mercaderes, solo en casos excepcionales. Tendrás que intentarlo en otra parte.\n@c2@"
  fr: "@a@b*ⓢ Désolé, mais, sauf cas exceptionnel, le roi Norbert ne reçoit plus de nouveaux marchands. Allez voir ailleurs.\n@c2@"
  it: "@a@b*: Spiacente, ma Re Norman riceve nuovi commercianti solo in circostanze eccezionali. Dovrai provare a piazzare la tua mercanzia altrove.\n@c2@"
  ja: "@a@b＊「しかし　よほどのことがない限り\n\t新しい商人は　使わぬ。\n\tあきらめることだな。\n@c2@"
"49":
  de: "@a@b*: Willkommen auf Burg Endor. Die Tore Endors stehen allen offen, jeder darf hier sein Glück versuchen.\n@c2@"
  en: "@a@b*: Welcome to Endor Castle. The gates of Endor are open to all people so that all people may prosper.\n@c2@"
  es: "@a@b*: %H860%X%A120%XBienvenido%Z%B120%XBienvenida%Z%Y%R000%XBienvenidas%YBienvenidos%Z%Z al Castillo de Endor. Las puertas de Endor están abiertas para todos, para que todos puedan prosperar.\n@c2@"
  fr: "@a@b*ⓢ Bienvenue au château de Chandor. Les portes de Chandor sont grandes ouvertes à tous ceux qui aspirent à la prospérité. \n@c2@"
  it: "@a@b*: %H860%XTi%YVi%Z do il benvenuto al castello di Endor. Le porte di Endor sono aperte a chiunque agisca per il bene della comunità.\n@c2@"
  ja: "@a@b＊「エンドールの城へ　ようこそ。\n\tわが国の城門は　民衆のために\n\t広く　開かれております。\n@c2@"
"50":
  de: "@a@b*: König Norbert ist oben.\n@c2@"
  en: "@a@b*: King Norman's throne room is at the top of the stairs.\n@c2@"
  es: "@a@b*: Arriba %H860%Xencontrarás%Yencontraréis%Z al rey Norman.\n@c2@"
  fr: "@a@b*ⓢ Vous trouverez le roi Norbert à l'étage.\n@c2@"
  it: "@a@b*: Re Norman si trova al piano superiore.\n@c2@"
  ja: "@a@b＊「王様は　この上におわします。\n@c2@"
"51":
  de: "@a@b*: Ich höre dauernd munkeln, dass es zwischen der Burg und der Stadt einen Geheimgang gäbe.\n@c2@"
  en: "@a@b*: Every now and then I hear murmurings about a secret passageway connecting the castle and the town.\n@c2@"
  es: "@a@b*: De vez en cuando, se oyen rumores de un pasadizo secreto que comunica el castillo y la ciudad.\n@c2@"
  fr: "@a@b*ⓢ De temps en temps, des gens parlent d'un passage secret qui relierait le château et la ville.\n@c2@"
  it: "@a@b*: Ogni tanto mi è capitato di sentir parlare di un passaggio segreto che collega il castello alla città.\n@c2@"
  ja: "@a@b＊「なんでも　このお城のどこかに\n\t城下町への　抜け道が\n\tかくされているそうだが……。\n@c2@"
"52":
  de: "@a@b*: Dabei arbeite ich hier seit Jahren, und mir ist nie etwas aufgefallen.\n@c2@"
  en: "@a@b*: But I've been working here for years. I've never come across anything like that.\n@c2@"
  es: "@a@b*: Pero llevo años trabajando aquí.\nY nunca me he encontrado con nada semejante.\n@c2@"
  fr: "@a@b*ⓢ Mais ça fait des années que je travaille ici et je n'ai jamais rien vu qui y ressemblerait.\n@c2@"
  it: "@a@b*: Ma lavoro qui da anni, e non ho mai visto nulla di simile.\n@c2@"
  ja: "@a@b＊「わたしは　長年　ここに\n\t仕えているが　そんな抜け道など\n\t見たこともないな。\n@c2@"
"53":
  de: "@a@b*: Eigentlich tratsche ich ja nicht, aber es heißt, dass Prinzessin Veronica einen heimlichen Geliebten hat!\n@c1@"
  en: "@a@b*: I don't like to gossip, but they say Princess Veronica's got a secret lover, you know!\n@c1@"
  es: "@a@b*: No me gusta cotillear pero se dice que la princesa Verónica tiene un amante secreto ¡qué fuerte!\n@c1@"
  fr: "@a@b*ⓢ Je n'aime pas les ragots, mais il paraît que la princesse Véronica a un amoureux secretⓠ\n@c1@"
  it: "@a@b*: Non mi piacciono i pettegolezzi, ma corre voce che la Principessa Veronica abbia un amante segreto!\n@c1@"
  ja: "@a@b＊「この国の姫君　モニカ姫には\n\tひそかに　想いをよせる殿方が\n\tいるらしいわよ。\n@c1@"
"54":
  de: "@a@b*: Ich habe keine Ahnung, wer das sein könnte, aber natürlich interessiert mich das auch nicht. Geht mich ja nichts an.\n@c1@"
  en: "@a@b*: I can't begin to imagine who it could be.\nOf course, I wouldn't want to pry.\nWell, it's not my place, is it?\n@c1@"
  es: "@a@b*: No me puedo imaginar que sea cierto.\nEvidentemente, no quiero parecer indiscreta.\nBueno, no es asunto mío, ¿verdad?\n@c1@"
  fr: "@a@b*ⓢ Je me demande qui ça peut bien être.\nEn même temps, je ne veux pas être indiscrète.\nJe dois rester à ma place, n'est-ce pasⓡ\n@c1@"
  it: "@a@b*: Non riesco a immaginare chi possa essere, e non mi va di fare inciuci. Non sono mica affari miei, no?\n@c1@"
  ja: "@a@b＊「いったい　どこの誰なのか……。\n\tあ～　もう　気になって\n\t仕事が　手につかないわ。\n@c1@"
"55":
  de: "@a@b*: Der König muss sich über viele Dinge Gedanken machen. Die Bewaffnung seiner Truppen hat da nicht unbedingt oberste Priorität.\n@c2@"
  en: "@a@b*: His Majesty the King has a lot to think about. His troops' weapons probably aren't at the forefront of his mind.\n@c2@"
  es: "@a@b*: Su Majestad el Rey tiene muchos asuntos de los que preocuparse. Seguramente, las armas de sus tropas no sean su máxima preocupación.\n@c2@"
  fr: "@a@b*ⓢ Sa Majesté a beaucoup de soucis. Je ne pense pas que l'armement de ses troupes soit la première de ses préoccupations.\n@c2@"
  it: "@a@b*: Sua Maestà ha molti pensieri per la testa in questo momento. Probabilmente, l'equipaggiamento del suo esercito non è la sua prima preoccupazione.\n@c2@"
  ja: "@a@b＊「王さまも　いろいろと\n\t考えることが　多いので\n\t武器まで　気が回らんのじゃろう。\n@c2@"
"56":
  de: "@a@b*: Ein Waffenhändler seid Ihr also? Ja, heutzutage gibt es schon großartige Waffen.\n@c2@"
  en: "@a@b*: Ah, so you're a weapons merchant, are you? Yes, there are a lot of powerful weapons on the market these days.\n@c2@"
  es: "@a@b*: ¡Ah!, entonces es vendedor de armas, ¿no? Cierto, actualmente existe una gran oferta de potentes armas en el mercado.\n@c2@"
  fr: "@a@b*ⓢ Comme ça, vous êtes marchand d'armesⓡ\nOn trouve beaucoup d'armes puissantes sur le marché, en ce moment.\n@c2@"
  it: "@a@b*: Ah, e così sei un mercante d'armi, dico bene? Sì, di questi tempi si trovano in giro molte armi potenti.\n@c2@"
  ja: "@a@b＊「ほほう　そなた　武器屋か？\n\t近ごろは　いろいろ　強い武器も\n\tあるそうだな。\n@c2@"
"57":
  de: "@a@b*: Leider sind meine Soldaten hier auf der Burg nur mit einfachen Kupferschwertern ausgerüstet. Das ist wirklich traurig.\n@c2@"
  en: "@a@b*: Meanwhile, my soldiers here in the castle are still being equipped with nothing but copper swords. It's a sorry state of affairs.\n@c2@"
  es: "@a@b*: Mientras tanto, aquí en el castillo mis soldados solo cuentan con espadas de cobre. Una situación un tanto desoladora.\n@c2@"
  fr: "@a@b*ⓢ Et pendant ce temps-là, les soldats du château n'ont que de simples épées de cuivre.\nC'est assez désolant, si vous voulez mon avis.\n@c2@"
  it: "@a@b*: Tuttavia, i soldati in servizio all'interno del castello sono equipaggiati con delle semplici spade di rame.\n㈡\n*: Non è che possano far molto, con quegli stuzzicadenti!\n@c2@"
  ja: "@a@b＊「しかし　この城では　兵士たちは\n\tいまだに　どうのつるぎを　使っている。\n\t情けないことだ……。\n@c2@"
"58":
  de: "@a@b*: Das Turnier von Endor wurde beinahe von Psaro dem Metzler gewonnen. Er hatte es schon so gut wie in der Tasche.\n@c2@"
  en: "@a@b*: The Endor Tourney was very nearly won by a man calling himself Psaro the Manslayer. He practically had it in the bag.\n@c2@"
  es: "@a@b*: Un hombre que se hacía llamar Psaro el Carnicero estuvo a punto de ganar el Torneo de Endor. Prácticamente ya lo había conseguido.\n@c2@"
  fr: "@a@b*ⓢ Le tournoi de Chandor a failli être remporté par un certain Psaro l'Exterminateur. Il était à deux doigts de la victoire.\n@c2@"
  it: "@a@b*: Il Torneo di Endor stava per essere vinto da un certo Psaro il Massacratore. Aveva il titolo praticamente in tasca.\n@c2@"
  ja: "@a@b＊「この前の　武術大会では\n\tデスピサロという男が\n\t優勝しかけたのですが……。\n@c2@"
"59":
  de: "@a@b*: Doch dann ist er mittendrin verschwunden. Einfach so...\n@c2@"
  en: "@a@b*: But he disappeared half way through the proceedings. I wonder who he was...\n@c2@"
  es: "@a@b*: Pero desapareció a mitad del torneo. Me pregunto quién sería...\n@c2@"
  fr: "@a@b*ⓢ Mais il a disparu au beau milieu de l'épreuve.\nJe me demande qui c'était...\n@c2@"
  it: "@a@b*: Ma a metà gara è scomparso. Chissà chi era...\n@c2@"
  ja: "@a@b＊「デスピサロは　途中で\n\tいなくなったんですよ。\n\tいったい　何者だったのでしょうね。\n@c2@"
"60":
  de: "@a@b*: Das hier ist König Norberts Thronsaal.\n@c2@"
  en: "@a@b*: This is King Norman's throne room.\n@c2@"
  es: "@a@b*: Este es el salón del trono del rey Norman.\n@c2@"
  fr: "@a@b*ⓢ Ceci est la salle du trône du roi Norbert.\n@c2@"
  it: "@a@b*: Questa è la stanza del trono di Re Norman.\n@c2@"
  ja: "@a@b＊「ここは　エンドール王の\n\tお部屋です。\n@c2@"
"61":
  de: "@a@b*: Unser König gewährt wirklich jedem Audienz und schert sich nicht um seine Sicherheit. Wo soll das bloß noch hinführen...\n@c2@"
  en: "@a@b*: Our king would grant an audience with anyone, without the slightest regard for his own safety. I just hope he doesn't come unstuck.\n@c2@"
  es: "@a@b*: Nuestro rey concede audiencia a todo el mundo, sin la menor preocupación por su propia seguridad. Solo espero que no tenga problemas.\n@c2@"
  fr: "@a@b*ⓢ Notre roi accorde des audiences à n'importe qui, sans même se soucier de sa propre sécurité.\nJ'espère simplement qu'il ne lui arrivera rien.\n@c2@"
  it: "@a@b*: Il nostro Re concederebbe un'udienza a chiunque, senza curarsi minimamente della propria incolumità.\n㈡\n*: Spero che non debba mai pentirsi della propria magnanimità.\n@c2@"
  ja: "@a@b＊「わが王は　身分を問わず\n\tどんな者とも　お会いなさる。\n\tそそうのないようにな。\n@c2@"
"62":
  de: "@aKönig Norbert@bAh, Herr Talun. Willkommen zurück.\n@c2@"
  en: "@aKing Norman@bAh, Mr. Taloon. Welcome back.\n@c2@"
  es: "@aRey Norman@b¡Ah!, señor Taloon. Bienvenido de nuevo.\n@c2@"
  fr: "@aRoi Norbert@bAh, Monsieur Taloon. Quelle joie de vous revoirⓠ\n@c2@"
  it: "@aRe Norman@bAh, bentornato, Baldo Baldini!\n@c2@"
  ja: "@a@b王「おお！　トルネコ\n\tよくぞ　もどった！\n@c2@"
"63":
  de: "@aKönig Norbert@bIch habe bereits Antwort aus Bruckstetten erhalten.\n@c2@"
  en: "@aKing Norman@bI have already received a reply from Ballymoral.\n@c2@"
  es: "@aRey Norman@bYa he recibido la contestación de Alcazaba.\n@c2@"
  fr: "@aRoi Norbert@bJ'ai déjà reçu une réponse de Ballimore.\n@c2@"
  it: "@aRe Norman@bHo ricevuto la risposta da Balmontone.\n@c2@"
  ja: "@a@b王「すでに　ボンモールより\n\t知らせを　受けているぞ。\n@c2@"
"64":
  de: "@aKönig Norbert@bUnd dank Euch sind es gute Neuigkeiten. Wie versprochen erlaube ich Euch, ein Geschäft in Endor zu eröffnen.\n@c2@"
  en: "@aKing Norman@bIt's good news. And largely thanks to you.\nAs promised, I hereby grant you permission to open a shop in Endor.\n@c2@"
  es: "@aRey Norman@bMuy buenas noticias. Y todo gracias a su labor.\nComo le prometí, le concedo el permiso para abrir una tienda en Endor.\n@c2@"
  fr: "@aRoi Norbert@bC'est une bonne nouvelle et c'est en grande partie grâce à vous. Comme promis, je vous autorise à ouvrir un magasin à Chandor.\n@c2@"
  it: "@aRe Norman@bSi tratta di buone nuove. Ti ringrazio immensamente. Come promesso, ti autorizzo ad aprire un negozio a Endor.\n@c2@"
  ja: "@a@b王「そなたのはたらきの　おかげじゃ！\n\t約束どおり　店を出すこと　許そうぞ！\n@c2@"
"65":
  de: "@aKönig Norbert@bSo sei es also! Möge Euer Geschäft so nützlich für Endor sein, wie es Eure Dienste als Bote bereits waren.\n@c2@"
  en: "@aKing Norman@bWell, Mr. Taloon! May your business prove as useful to Endor as your services as a go-between have already.\n@c2@"
  es: "@aRey Norman@b¡Bien, señor Taloon! Espero que su negocio resulte tan fructífero para Endor como lo han sido sus servicios como mensajero.\n@c2@"
  fr: "@aRoi Norbert@bMonsieur Taloon, j'espère que vous servirez aussi bien Chandor en tant que marchand que vous ne l'avez fait en tant que messager.\n@c2@"
  it: "@aRe Norman@bBene, Baldo Baldini... Ti auguro che la tua nuova attività sia tanto proficua quanto i servigi che hai prestato al nostro regno!\n@c2@"
  ja: "@a@b王「トルネコよ！\n\tこれからも　世のため　人のため\n\t商売に　せいを出すのじゃぞ。\n@c2@"
"66":
  de: "@aKönig Norbert@bUnd teilt mir sofort mit, wenn Ihr Euer Geschäft eröffnet.\n@c2@"
  en: "@aKing Norman@bBe sure to inform me when you succeed in opening your shop.\n@c2@"
  es: "@aRey Norman@bCuando haya abierto su negocio, no dude en comunicármelo.\n@c2@"
  fr: "@aRoi Norbert@bDès que votre magasin sera ouvert, faites-le-moi savoir.\n@c2@"
  it: "@aRe Norman@bDesidero che tu mi informi quando avrai aperto il tuo negozio.\n@c2@"
  ja: "@a@b王「そして　もし　店を出したなら\n\tこのわしにも　知らせるようにな。\n@c2@"
"67":
  de: "@aPrinzessin Veronica@bIch kann es noch gar nicht glauben! Unserer Liebe steht nichts mehr im Wege! Wir können endlich heiraten!\n@c1@"
  en: "@aPrincess Veronica@bI can hardly believe it! For our love to be recognised at last! I can marry my dear Regan!\n@c1@"
  es: "@aPrincesa Verónica@b¡No puedo creerlo! ¡Nuestro amor ha sido reconocido al fin! ¡Puedo casarme con mi querido Alí!\n@c1@"
  fr: "@aPrincesse Véronica@bJ'ai du mal à y croireⓠ\nEnfin nous n'avons plus besoin de nous cacherⓠ\nJe vais épouser mon cher Réginaldⓠ\n@c1@"
  it: "@aPrincipessa Veronica@bNon ci posso credere! Alla fine il nostro amore è stato riconosciuto, e finalmente io e il mio caro Vitellozzo potremo sposarci!\n@c1@"
  ja: "@a@bモニカ「愛する　リックとの結婚を\n\t許してもらえるなんて\n\tまるで　夢のよう！\n@c1@"
"68":
  de: "@aPrinzessin Veronica@bEuer Name ist Torneko, richtig? Ich danke Euch, Torneko, aus tiefstem Herzen.\n@c1@"
  en: "@aPrincess Veronica@bYour name's Torneko, isn't it?\nThank you, Torneko.\nFrom the bottom of my heart.\n@c1@"
  es: "@aPrincesa Verónica@bSe llama Torneko, ¿cierto?\nGracias, Torneko.\nDesde lo más profundo de mi corazón.\n@c1@"
  fr: "@aPrincesse Véronica@bVous vous appelez Torneko, c'est çaⓡ\nMerci, Torneko.\nMerci de tout cœur.\n@c1@"
  it: "@aPrincipessa Veronica@bIl tuo nome è Baldo, vero? Grazie di cuore, Baldo...\n@c1@"
  ja: "@a@bモニカ「トルネコと　いいましたね。\n\t心から　感謝しますわ。\n@c1@"
"69":
  de: "@a@b*: Meine Nachforschungen haben ergeben, dass es einst eine Klinge mit dem Namen Zenithiaschwert gab.\n@c2@"
  en: "@a@b*: According to my research, there was once in existence a blade known as the Zenithian Sword.\n@c2@"
  es: "@a@b*: Según mis indagaciones, hace tiempo existía una espada que recibía el nombre de Espada de Zenithia.\n@c2@"
  fr: "@a@b*ⓢ Si j'en crois mes recherches, il existait autrefois une épée appelée l'Épée zénithienne.\n@c2@"
  it: "@a@b*: Dalle mie ricerche risulta che un tempo è esistita un'arma conosciuta col nome di Spada Zenithiana.\n@c2@"
  ja: "@a@b＊「その昔　天空のつるぎというものが\n\tあったそうじゃな。\n@c2@"
"70":
  de: "@a@b*: Es heißt, dass der Schwertträger in den Himmel aufsteigen könne. Natürlich weiß ich nicht, ob an diesen Geschichten etwas Wahres ist.\n@c2@"
  en: "@a@b*: They say the person who possessed it could climb up to the heavens. Of course, I don't know what the truth is behind the tales.\n@c2@"
  es: "@a@b*: Se dice que la persona que la posea podrá ascender hasta los cielos. Evidentemente, desconozco si estas historias son reales o no.\n@c2@"
  fr: "@a@b*ⓢ On dit que la personne qui la détiendrait pourrait toucher les Cieux. Bien entendu, je ne sais pas quelle est la part de vérité dans cette légendeⓠ\n@c2@"
  it: "@a@b*: La leggenda narra che chi ne entra in possesso possa raggiungere il cielo. Chissà se è vero...!\n@c2@"
  ja: "@a@b＊「そのつるぎを　手にした者は\n\t天に　上ることが　できたそうじゃ。\n\tいったい　どういうことじゃろうか？\n@c2@"
"71":
  de: "@a@b*: Dieser Tisch muss so sauber sein, dass König Norbert davon essen könnte.\n@c2@"
  en: "@a@b*: I've got to wipe this table down.\nIt's all work, work, work around here.\n@c2@"
  es: "@a@b*: Esta mesa tiene que quedar tan limpia que el propio rey Norman pueda comer en ella.\n@c2@"
  fr: "@a@b*ⓢ Cette table doit être assez propre pour que le roi Norbert puisse prendre son souper dessus.\n@c2@"
  it: "@a@b*: Questo tavolo dev'essere tanto pulito che Re Norman dovrebbe potervi mangiare sopra direttamente, se volesse farlo.\n@c2@"
  ja: "@a@b＊「テーブルを　きれいにふかないと。\n\tせっせ　せっせ。\n@c2@"
"72":
  de: "@a@b*: Da ist so ein Typ mit einem komischen Namen... Arche Defekt oder so ähnlich... der repariert überall Brücken.\n@c2@"
  en: "@a@b*: There's a fellow with a funny name ⓚⓛ Arch Defect or something like that ⓚⓛ who's been fixing bridges all over the place.\n@c2@"
  es: "@a@b*: Hay un tipo de nombre un tanto curioso... Al Defecto o algo parecido, que se encarga de arreglar puentes por todas partes.\n@c2@"
  fr: "@a@b*ⓢ Un gars avec un nom pas du coin... Hector Boyaux ou quelque chose comme ça... a réparé tous les ponts de la région.\n@c2@"
  it: "@a@b*: C'è un tizio con un nome buffo... Arco Difett, o qualcosa di simile... che va in giro a sistemare ponti.\n@c2@"
  ja: "@a@b＊「なんでも　ドン・ガアデとかいう者が\n\tあちこちの橋を　直したそうだな。\n@c2@"
"73":
  de: "@a@b*: Und jetzt sind die Wege nach Norden und Osten wieder offen.\n@c2@"
  en: "@a@b*: Now both the way north and the way east are open again.\n@c2@"
  es: "@a@b*: Ahora tanto el paso hacia el norte como hacia el este están abiertos de nuevo.\n@c2@"
  fr: "@a@b*ⓢ Maintenant, les routes vers le nord et vers l'est sont à nouveau praticables.\n@c2@"
  it: "@a@b*: Ora le vie che conducono a nord e a est sono di nuovo percorribili.\n@c2@"
  ja: "@a@b＊「おかげで　北にも　東にも\n\t行けるようになったのだ。\n@c2@"
"74":
  de: "@a@b*: Oh du liebe Güte. So viel Wäsche und so wenig Zeit, um sie zu waschen!\n@c2@"
  en: "@a@b*: Dearie me. So many things to wash and not enough minutes in the day to wash them in!\n@c2@"
  es: "@a@b*: Ay, por la Diosa. ¡Tanto por lavar y tan poco tiempo para lavarlo!\n@c2@"
  fr: "@a@b*ⓢ Pauvre de moi. Tant de choses à laver et si peu de temps dans la journée pour le faireⓠ\n@c2@"
  it: "@a@b*: Un'intera giornata di lavoro non mi basterà per lavare tutta questa roba! Povera me...\n@c2@"
  ja: "@a@b＊「よいしょ　よいしょ。\n\t洗い物が多くて　たいへん！\n@c2@"
"75":
  de: "@a@b*: Seid Ihr der Gemüsehändler? Was, Ihr verkauft Waffen? Dann seid Ihr hier falsch, das ist nämlich die Küche.\n@c1@"
  en: "@a@b*: Oh, are you the greengrocer?\nWhat? You sell weapons? I'm sorry, but you're in the wrong place, then. This here's the kitchen.\n@c1@"
  es: "@a@b*: ¡Oh!, ¿eres el tendero?\n¿Qué? ¿Vendes armas? Lo siento, pero has venido al lugar equivocado. Esta es la cocina.\n@c1@"
  fr: "@a@b*ⓢ Oh, vous êtes le maraîcherⓡ\nPardonⓡ Vous vendez des armesⓡ \n㈡\n*ⓢ Désolée, mais dans ce cas, vous avez frappé à la mauvaise porte.\nC'est une cuisine iciⓠ\n@c1@"
  it: "@a@b*: Oh, sei il fruttivendolo? Come...? Vendi armi? Mi spiace, ma temo che ti trovi nel posto sbagliato: questa è la cucina.\n@c1@"
  ja: "@a@b＊「あら　あなた　八百屋さん？\n\tえ？　武器屋さんなの？\n\tまあ！　ここは　台所なのよ！\n@c1@"
"76":
  de: "@a@b*: Seid vor Psaro dem Metzler auf der Hut, ja?\n@c2@"
  en: "@a@b*: Be careful of that Psaro guy!\n@c2@"
  es: "@a@b*: %H860%XTen%YTened%Z cuidado con Psaro el Carnicero, ¿me %H860%Xoyes%Yoís%Z?\n@c2@"
  fr: "@a@b*ⓢ Méfiez-vous de ce Psaro l'Exterminateur, surtoutⓠ\n@c2@"
  it: "@a@b*: %H860%XFai%YFate%Z attenzione a Psaro il Massacratore, mi raccomando!\n@c2@"
  ja: "@a@b＊「デスピサロに　気をつけるんだ！\n@c2@"
"77":
  de: "@a@b*: Das Turnier ist vorbei, deshalb ist der Zutritt jetzt verboten.\n@c2@"
  en: "@a@b*: The tourney's over now, so there'll be no more public access to this place for a while.\n@c2@"
  es: "@a@b*: El torneo ha finalizado, por lo que durante un tiempo no se podrá acceder al recinto.\n@c2@"
  fr: "@a@b*ⓢ Maintenant que le tournoi est terminé, personne ne pourra rentrer ici avant longtemps.\n@c2@"
  it: "@a@b*: Il torneo si è concluso, quindi per un po' di tempo il pubblico non potrà entrare qui.\n@c2@"
  ja: "@a@b＊「武術大会も　終わったので\n\tここは　しばらくの間\n\t閉じられることになったのだ。\n@c2@"
"78":
  de: "@a@b*: Hier könnt Ihr leider nicht rein. Ihr müsst umkehren.\n@c2@"
  en: "@a@b*: I'm afraid you can't come in here.\nYou'll have to turn back.\n@c2@"
  es: "@a@b*: Me temo que no puedes entrar aquí.\nTendrás que darte la vuelta.\n@c2@"
  fr: "@a@b*ⓢ Désolé, mais vous ne pouvez pas entrer.\nVous devez faire demi-tour.\n@c2@"
  it: "@a@b*: Spiacente, qui non si può entrare. %H860%XVai%YAndate%Z via, per favore.\n@c2@"
  ja: "@a@b＊「残念だが\n\tここに　入ることはできぬ。\n\t立ち去るがいい。\n@c2@"
"79":
  de: "@a@b*: Ha-püh... Ha-püh...\nNichts... zu... berichten...\nHa-püh...\n@c2@"
  en: "@a@b*: Ah-phew... Ah-phew...\nNo-thing...to-report...\nAh-phew...\n@c2@"
  es: "@a@b*: Ah, fiuuu... Ah-fiuuu...\nNa-da... que de-cir...\nAh-fiuuu...\n@c2@"
  fr: "@a@b*ⓢ Ron-pfff... Ron-pfff...\nRien... à... signaler...\nRon-pfff...\n@c2@"
  it: "@a@b*: Ronf... fiuuu... Ronf... fiuuu... Niente da segnalare... Ronf... fiuuu...\n@c2@"
  ja: "@a@b＊「むにゃむにゃ……。\n\t異常なーし……むにゃ。\n@c2@"
"80":
  de: "@a@b*: Was schleicht Ihr denn mitten in der Nacht in der Burg herum?\n@c2@"
  en: "@a@b*: What do you think you're doing prowling about the castle at this time of night?\n@c2@"
  es: "@a@b*: ¿Qué %H860%Xcrees que estás haciendo%Ycreéis que estáis haciendo%Z merodeando por el castillo a estas horas de la noche?\n@c2@"
  fr: "@a@b*ⓢ Que faites-vous à rôder dans le château à une heure pareilleⓡ\n@c2@"
  it: "@a@b*: Che ci %H860%Xfai%Yfate%Z al castello a quest'ora di notte?\n@c2@"
  ja: "@a@b＊「こんな夜更けに\n\tお城に　入ってくるとは！\n@c2@"
"81":
  de: "@a@b*: Ich kann Euch nicht einfach so hier herumlaufen lassen. Na los, raus mit Euch!\n@c2@"
  en: "@a@b*: I can't let you just wander about as you please. Go on now, get out!\n@c2@"
  es: "@a@b*: No puedo permitir que %H860%Xte pasees%Yos paseéis%Z por donde %H860%Xte%Yos%Z apetezca. ¡Vamos, largo de aquí!\n@c2@"
  fr: "@a@b*ⓢ Je ne peux pas vous laisser vous promener comme ça, à votre guise. Allons, sortez maintenantⓠ\n@c2@"
  it: "@a@b*: È vietato stare qui. %H860%XVai%YAndate%Z via, forza!\n@c2@"
  ja: "@a@b＊「わたしが　見つけた以上\n\t黙っているわけには　ゆかぬ。\n\tささ　立ち去られよ！\n@c2@"
"82":
  de: "@a@b*: Es ist die Rede davon, dass %A090%Xein großer Held%Z%B090%Xeine große Heldin%Z die Welt retten wird.\n@c2@"
  en: "@a@b*: There's talk in the air of a great %A090%Xhero%Z%B090%Xheroine%Z who's going to save the world.\n@c2@"
  es: "@a@b*: Circulan rumores sobre %A090%Xun gran héroe%Z%B090%Xuna gran heroína%Z que vendrá para salvar el mundo.\n@c2@"
  fr: "@a@b*ⓢ Les gens parlent d'%A090%Xun grand héros%Z%B090%Xune grande héroïne%Z qui viendrait sauver le monde.\n@c2@"
  it: "@a@b*: Corre voce che ci sia %A090%Xun eroe%Z%B090%Xun'eroina%Z che sta cercando di salvare il mondo.\n@c2@"
  ja: "@a@b＊「ウワサでは　世界を救う　勇者が\n\tどこかで　育っているようじゃ。\n@c2@"
"83":
  de: "@a@b*: Aber das glaube ich nicht. Was kann schon so Besonders an %A090%Xeinem Mann%Z%B090%Xeiner Frau%Z sein, dass %A090%Xer%Z%B090%Xsie%Z die ganze Welt retten kann?\n@c2@"
  en: "@a@b*: But I can't really see it. I mean, what could be so special about one %A090%Xman%Z%B090%Xwoman%Z that they could save the whole world?\n@c2@"
  es: "@a@b*: Pero no lo veo claro. Quiero decir, ¿qué podría tener de especial %A090%Xun hombre%Z%B090%Xuna mujer%Z para que pudiera salvar al mundo entero?\n@c2@"
  fr: "@a@b*ⓢ Mais pour l'instant, aucune trace %A090%Xde lui%Z%B090%Xd'elle%Z.\nEn plus, qu'est-ce qu'%A090%Xil%Z%B090%Xelle%Z aurait de si spécial pour pouvoir sauver le mondeⓡ\n@c2@"
  it: "@a@b*: Mah, a me sembra una sciocchezza... Voglio dire, come può %A090%Xun solo uomo%Z%B090%Xuna sola donna%Z salvare tutto il mondo?\n@c2@"
  ja: "@a@b＊「しかし　世界を救う　勇者とは\n\tどのような人物なのやら……。\n\tどうも　うさんくさい話じゃな。\n@c2@"
"84":
  de: "@a@b*: Es heißt, die Monster sind so wild in letzter Zeit, weil jemand, der sich Herr der Unterwelt nennt, wieder auferstanden ist.\n@c2@"
  en: "@a@b*: People are saying the monsters are so ferocious recently because someone called the Lord of the Underworld has been resurrected.\n@c2@"
  es: "@a@b*: La gente dice que la ferocidad de los monstruos ha aumentado últimamente por que alguien al que llaman Señor del Inframundo ha resucitado.\n@c2@"
  fr: "@a@b*ⓢ Il paraîtrait que les monstres sont devenus encore plus méchants parce qu'un soi-disant Seigneur des Enfers aurait été ressuscité.\n@c2@"
  it: "@a@b*: Si dice in giro che i mostri siano diventati tanto aggressivi perché un certo Signore degli Inferi è tornato in vita.\n@c2@"
