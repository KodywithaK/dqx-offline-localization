"30":
  de: "@a@b*: Seit das tanzende Mädschen und ihre Schwester nach Endor geflo'en sind, 'at der Marquis Régent die Sischer'eit verstärkt.\n@c2@"
  en: "@a@b*: Ever since ze dancing girl and 'er sister escaped on ze boat to Endor, ze Marquis Régent 'as tightened sécurité even more.\n@c2@"
  es: "@a@b*: Desde que la bailagrina y su hegrmana huyegron en el bagrco hacia Endogr, el Marquis Gregente ha incgrementado aún más la sécurité.\n@c2@"
  fr: "@a@b*ⓢ Depuis que la dancing girl et sa sœur se sont échappées sur le boat pour Chandor, the Lord a encore resserré la security.\n@c2@"
  it: "@a@b*: Da quando la ballerina e sua sorella sono fuggite sul bateau per Endor, le Marquis ha rinforzato ancora di più la sécurité.\n@c2@"
  ja: "@a@b＊「踊り子の姉妹が　船で逃げたため\n\t王さまの　取りしまりが\n\tさらに　厳しくなったのだ。\n@c2@"
"31":
  de: "@a@b*: Darum laufen aus diesem 'afen keine Schiffe mehr aus.\n@c2@"
  en: "@a@b*: No ships will be departing from zis port any more.\n@c2@"
  es: "@a@b*: Ya no van a pagrtigr más bagrcos de este puegrto.\n@c2@"
  fr: "@a@b*ⓢ Plus aucun navire ne peut quitter the port, à présent.\n@c2@"
  it: "@a@b*: Nessun bateau partirà più da questo porto.\n@c2@"
  ja: "@a@b＊「もはや　この港から\n\t船が出てゆくことは　あるまい。\n@c2@"
"32":
  de: "@a@b*: Alles spricht nur noch vom Herrn der Dunkelheit und dass er bald wieder aufersteht.\n@c2@"
  en: "@a@b*: Everyone's talking about the Lord of the Underworld and how he's about to be resurrected.\n@c2@"
  es: "@a@b*: Todos hablan del Señor del Inframundo y de que está a punto de resucitar.\n@c2@"
  fr: "@a@b*ⓢ Tout le monde parle du Seigneur des Enfers et de sa résurrection imminente.\n@c2@"
  it: "@a@b*: Tutti parlano del Signore degli Inferi e del suo prossimo ritorno in vita.\n@c2@"
  ja: "@a@b＊「もうすぐ　地獄の帝王が\n\tよみがえるって話です。\n@c2@"
"33":
  de: "@a@b*: Ich frage mich, wie lange ich die Nachtluft wohl noch so genießen kann.\n@c2@"
  en: "@a@b*: I don't know how much longer I'll be able to enjoy the night air like this.\n@c2@"
  es: "@a@b*: No sé cuánto tiempo me queda para disfrutar del aire nocturno.\n@c2@"
  fr: "@a@b*ⓢ Je ne sais pas pendant combien de temps je vais encore pouvoir profiter ainsi de l'air nocturne.\n@c2@"
  it: "@a@b*: Chissà per quanto tempo ancora potrò godermi la fresca brezza della notte...\n@c2@"
  ja: "@a@b＊「こうして　夜の散歩が出来るのも\n\t今のうちだけでしょう。\n@c2@"
