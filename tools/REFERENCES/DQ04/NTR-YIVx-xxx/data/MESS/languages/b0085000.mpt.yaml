  fr: "@a@b*ⓢ Venezⓠ Venezⓠ\nBuvez, dansez, buvez, chantez et buvez encoreⓠ Soyez heureuxⓠ C'est ça l'essentielⓠ\n@c2@"
  it: "@a@b*: %H860%XEntra%YEntrate%Z pure!\n%H860%XBalla, canta, bevi e divertiti%YBallate, cantate, bevete e divertitevi%Z! Così si fa!\n@c2@"
  ja: "@a@b＊「やあ　いらっしゃい　いらっしゃい！\n\t飲んで歌って　楽しい夜を！\n@c2@"
