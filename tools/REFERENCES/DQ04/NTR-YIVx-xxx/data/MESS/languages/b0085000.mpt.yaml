"0":
  de: "@a@b%0%a00120 liest das Schild.\n@c0@"
  en: "@a@b%0%a00120 reads the sign.\n@c0@"
  es: "@a@b%0%a00120 lee el cartel.\n@c0@"
  fr: "@a@b%0%a00120 lit l'écriteau.\n@c0@"
  it: "@a@b%0%a00120 legge il cartello.\n@c0@"
  ja: "@a@b%a00120は　立て札を　読んだ。\n@c0@"
"1":
  de: "@a@b            ⓞDer Wüstenbasar ist zu Ende. \n              Wir danken unseren Kunden. \n     Bitte beehrt uns beim nächsten Mal wieder.ⓟ\n@c0@"
  en: "@a@b  ⓗThe desert bazaar done finished and moved on.\n         We traders would like to thank y'all\n                 for yer patronage.ⓘ\n@c0@"
  es: "@a@b''El bazar del desierto ha cerrado y se ha trasladado.''\n㈡\n''Queremos darles las gracias a todos\npor haber comprado aquí.''\n@c0@"
  fr: "@a@b       ⓥLe bazar du désert a repris la route.\n       Tous les commerçants vous remercient\n                  pour votre soutien.ⓦ\n@c0@"
  it: "@a@bⓕIl Desermercato ha chiuso i battenti e si è spostato altrove. Ringraziamo i nostri clienti per la fiducia accordataci.ⓖ\n@c0@"
  ja: "@a@b砂漠のバザーは　終了しました。\n長らくのご愛顧\nまことに　ありがとうございました。\n@c0@"
"2":
  de: "@a@b*: Howdy! Seid Ihr zum Einkaufen gekommen?\nTja, tut mir mächtig leid, aber der Basar ist geschlossen und alle sind schon weitergezogen.\n@c1@"
  en: "@a@b*: Howdy! Are %H860%Xya%Yy'all%Z here to shop?\nWell, I do declare that the desert bazaar done closed up and moved away.\n@c1@"
  es: "@a@b*: ¡Saludos! ¿%H860%XHa%YHan%Z venido a comprar aquí, %H860%X%A120%Xmanito%Z%B120%Xmanita%Z%Y%R000%Xmanitas%Ymanitos%Z%Z?\nBueno, %H860%Xle%Yles%Z tengo que decir que el bazar del desierto ha cerrado y se ha trasladado nomás.\n@c1@"
  fr: "@a@b*ⓢ Salutⓠ Vous êtes là pour faire des achatsⓡ\nEh bien, j'vous annonce que l'bazar du désert est bien fermé et qu'il a déménagé.\n@c1@"
  it: "@a@b*: Salve! Siete tutti qui per fare acquisti?\nGuardate che il Desermercato ha chiuso e si è spostato da un'altra parte.\n@c1@"
  ja: "@a@b＊「あら　買い物に来たの？\n\tだったら残念ね。\n\tもう　バザーは終わっちゃったわよ。\n@c1@"
"3":
  de: "@a@b*: Ich selbst hab auch gerade meinen Laden geschlossen und bin auf dem Sprung. Keine Ahnung, was aus diesem Ort wird, wenn wir weg sind.\n@c1@"
  en: "@a@b*: Why, I myself just closed up shop, and I'm about to hightail it outta here. I dunno what'll become of this here place once we're gone.\n@c1@"
  es: "@a@b*: Bueno, yo misma he bajado la persiana y me marchaba de aquí ahorita mismo. No sé qué será de este lugar cuando nos hayamos ido.\n@c1@"
  fr: "@a@b*ⓢ En fait, j'viens moi-même de fermer boutique et j'm'apprête à filer d'ici.\n㈡\n*ⓢ Je sais pas ce qu'il adviendra de cet endroit une fois qu'on sera partis.\n@c1@"
  it: "@a@b*: Ho appena chiuso bottega e sto per alzare i tacchi anch'io. Non so cosa ne sarà di questo posto, una volta che saremo andati via tutti.\n@c1@"
  ja: "@a@b＊「店じまいも済んだし\n\t私もこれから帰るところよ。　この場所は\n\tこれから　どうなるのかしらね。\n@c1@"
"4":
  de: "@a@b*: Das ist der 'afen Havre Léon. Von 'ier aus fahren Schiffe nach Endor im Norden.\n@c2@"
  en: "@a@b*: Zis is ze port of Havre Léon.\nShips from 'ere sail to Endor in ze north.\n@c2@"
  es: "@a@b*: Este es el puegrto de Havre Léon. De aquí salen bagrcos pagra Endogr, hacia el nogrte.\n@c2@"
  fr: "@a@b*ⓢ Vous êtes à Port Lionel. Les bateaux vont à Chandor, au nord.\n@c2@"
  it: "@a@b*: Questa è la darsena di Port Léon. Da qui le navi partono per Endor, a nord d'ici.\n@c2@"
  ja: "@a@b＊「ここは　港町ハバリア。\n\tエンドール行きの　船が出る町だ。\n@c2@"
"5":
  de: "@a@b*: Aber 'ier 'at schon vor einer Weile das letzte Schiff abgelegt. Jetzt steschen 'ier keine mehr in See.\n@c2@"
  en: "@a@b*: But ze ship zat left a while ago was ze last one. Zere will be no more.\n@c2@"
  es: "@a@b*: Pegro el bagrco que pagrtió hace un tiempo egra el último. Ya no habgrá más.\n@c2@"
  fr: "@a@b*ⓢ Mais the boat qui a quitté il y a peu était le dernier. Il n'y en aura plus d'autre.\n@c2@"
  it: "@a@b*: Ma le bateau che è partito poco fa era l'ultimo. Non ce ne saranno plus!\n@c2@"
  ja: "@a@b＊「しかし　この前の船を最後に\n\t連絡船は出なくなったのだ。\n@c2@"
"6":
  de: "@a@b*: Isch 'abe ⓚⓛ ich meine, ich habe keine Ahnung, ob das letzte Schiff nach Endor 'eil ⓚⓛ Zut! Ich meine, heil... dort angekommen ist.\n@c0@"
  en: "@a@b*: I wonder if zeⓚⓛ I mean, the...last ship that left for Endor got zereⓚⓛ Zut! I mean, there...all right...\n@c0@"
  es: "@a@b*: Me pgregunto si... Quiero decir, me pregunto si el último barco que salió para Endogr... ¡Merde! Digo, Endor, llegó allí. Eso es.\n@c0@"
  fr: "@a@b*ⓢ Je me demande si le last... enfin... le dernier bateau qui a quitté pour Chandor y est reached... Darnⓠ Je veux dire, y est parvenu sans problème...\n@c0@"
  it: "@a@b*: Chissà se l'ultimo bateau... voglio dire, l'ultima nave, che è partita per Endor è arrivata là-bas... cioè, laggiù, senza problemi...\n㈡\n*: Oh là là, che seccatura questa lingua!\n@c0@"
  ja: "@a@b＊「最後に　この町を出ていった船は\n\t無事に　エンドールまで\n\t着いたのかな……。\n@c0@"
"7":
  de: "@a@b*: Wo ist Großvater hin? Es ist bald Essenszeit...\n@c1@"
  en: "@a@b*: Where's Grandad got to?\nIt'll be dinner time soon...\n@c1@"
  es: "@a@b*: ¿Dónde se ha metido el abuelo? Va a ser la hora de cenar...\n@c1@"
  fr: "@a@b*ⓢ Où est passé papyⓡ\nÇa va bientôt être l'heure du dîner...\n@c1@"
  it: "@a@b*: Dove si è cacciato il nonno? Fra poco si cena...\n@c1@"
  ja: "@a@b＊「うちの　おじいちゃんったら\n\tどこに行ったのかしら。\n\tそろそろ　ごはんの時間なのに……。\n@c1@"
"8":
  de: "@a@b*: Was? Der Zauberschlüssel, sagt Ihr? Nein, so was hatte ich noch nie...\n@c3@"
  en: "@a@b*: What? The magic key, you say?\nNo, I've never come across anything like that...\n@c3@"
  es: "@a@b*: ¿Qué? ¿La llave mágica?\nNo, nunca me he topado con nada de eso...\n@c3@"
  fr: "@a@b*ⓢ Quoiⓡ La clef magique, vous ditesⓡ\nNon, j'ai jamais vu un truc pareil...\n@c3@"
  it: "@a@b*: Come? La Chiave magica?\nNo, non ho mai visto una cosa del genere...\n@c3@"
  ja: "@a@b＊「なんだって？　魔法のカギだと？\n\tそんなものが　この世の中に……。\n@c3@"
"9":
  de: "@a@b*: ... zum Verkauf in meinem Laden! Ha ha! Aber es gibt ihn! Oh ja, den gibt's ganz bestimmt!\n@c3@"
  en: "@a@b*: ...for sale in my shop! Ha ha!\nBut it exists! Oh, yes. I'm sure of that!\n@c3@"
  es: "@a@b*: ... ¡a la venta en mi tienda! ¡Ja, ja!\n¡Pero existe! ¡Sí, de eso estoy seguro!\n@c3@"
  fr: "@a@b*ⓢ ... en vente dans mon magasinⓠ Ha haⓠ\nMais elle existeⓠ Ah, oui. Ça, j'en suis sûrⓠ\n@c3@"
  it: "@a@b*: ...in vendita nel mio negozio! Ah! Ah! Ah!\nMa esiste! Oh, sì, certo che esiste!\n@c3@"
  ja: "@a@b＊「あるんだな　これが！\n\tオレの店では売ってないけどよ。\n@c3@"
"10":
  de: "@a@b*: Die Alchemisten sollen das Rezept zur Herstellung von Zauberschlüsseln sogar perfektioniert haben.\n㈡\n*: Wo hatte ich das doch gleich gehört?\n@c3@"
  en: "@a@b*: In fact, I heard alchemists had perfected the recipe for making magic keys. Now where did I hear that again?\n@c3@"
  es: "@a@b*: De hecho, he oído decir que los alquimistas han perfeccionado el procedimiento para fabricar llaves mágicas. Lo que no recuerdo es dónde lo he oído.\n@c3@"
  fr: "@a@b*ⓢ En fait, j'ai entendu dire que des alchimistes avaient perfectionné la recette de fabrication des clefs magiques. Où j'ai entendu ça, déjàⓡ\n@c3@"
  it: "@a@b*: A dirla tutta, mi avevano detto che alcuni alchimisti hanno messo a punto la ricetta per creare Chiavi magiche. Dov'è che l'avevo sentito?\n@c3@"
  ja: "@a@b＊「聞いた話じゃ\n\t錬金術師なら　簡単に\n\t魔法のカギを　作れたらしいぜ。\n@c3@"
"11":
  de: "@a@b*: Ach ja. Da war mal ein Alchemist in einem kleinen Dorf südlich von hier. Ich glaube, es heißt jetzt Boutdumonde.\n@c3@"
  en: "@a@b*: Oh, yes. That's right. There used to be an alchemist in a little village south of here.\nIt's called Aubout du Monde now, I think.\n@c3@"
  es: "@a@b*: ¡Ah!, sí. Eso es. Solía haber un alquimista en un pueblo al sur de aquí.\nCreo que se llama Aubout du Monde.\n@c3@"
  fr: "@a@b*ⓢ Ah oui. C'est ça. Il y avait un alchimiste dans un petit village au sud d'ici.\nIl s'appelle Deadend, enfin je crois.\n@c3@"
  it: "@a@b*: Ah, ora ricordo. C'era un alchimista in un piccolo villaggio a sud di qui.\nMi pare che il posto si chiami Infond Almond.\n@c3@"
  ja: "@a@b＊「そういや　むかし\n\tずっと南の　コーミズ村に\n\t錬金術師がいたっけな。\n@c3@"
"12":
  de: "@a@b*: Aaah... Endor... Dort gibt es ein imposantes Kolosseum.\n@c2@"
  en: "@a@b*: Aaah...Endor... There's an enormous colosseum there, you know.\n@c2@"
  es: "@a@b*: Aaah... Endor... Allí hay un enorme coliseo, ¿lo %H860%Xsabías%Ysabíais%Z?\n@c2@"
  fr: "@a@b*ⓢ Aaah... Chandor... Il y a un très grand Colisée\nlà-bas, vous savez.\n@c2@"
  it: "@a@b*: Aaah... Endor... Lì c'è un'arena gigantesca.\n@c2@"
  ja: "@a@b＊「この海の向こう　エンドールには\n\t大きなコロシアムがあってのう……。\n@c2@"
"13":
  de: "@a@b*: Bin dort selbst mal angetreten. Jawohl, ich war ein ganz guter Kämpfer in meinen jungen Jahren. Aaah...\n@c2@"
  en: "@a@b*: I was a contestant once myself.\nYes, I was quite a fighter in my younger years. Aaah...\n@c2@"
  es: "@a@b*: Yo fui una vez. Sí, cuando era joven era un auténtico luchador. Aaah...\n@c2@"
  fr: "@a@b*ⓢ J'ai participé au tournoi quand j'étais jeune.\nJ'étais plutôt doué, même. Aaah...\n@c2@"
  it: "@a@b*: Ci ho gareggiato anch'io. In gioventù ero un lottatore coi fiocchi. Ah, bei tempi...\n@c2@"
  ja: "@a@b＊「わしも　若い頃は\n\tそのコロシアムで　戦ったもんじゃ。\n\tあの頃が　なつかしいのう……。\n@c2@"
"14":
  de: "@a@b*: Seit das tanzende Mädschen und ihre Schwester nach Endor geflo'en sind, 'at le Marquis die Sischer'eitsmaßnahmen verstärkt.\n@c2@"
  en: "@a@b*: Ever since ze dancing girl and 'er sister escaped on ze boat to Endor, ze Marquis 'as tightened sécurité even more.\n@c2@"
  es: "@a@b*: Desde que la bailagrina y su hegrmana huyegron en el bagrco hacia Endogr, el Marquis ha incgrementado aún más la sécurité.\n@c2@"
  fr: "@a@b*ⓢ Depuis que la dancing girl et sa sœur se sont échappées sur le boat pour Chandor, the Lord a encore resserré la security.\n@c2@"
  it: "@a@b*: Da quando la ballerina e sua sorella sono fuggite sul bateau per Endor, le Marquis ha rinforzato ancora di più la sécurité.\n@c2@"
  ja: "@a@b＊「踊り子の姉妹が　船で逃げたため\n\t王さまの　取りしまりが\n\tさらに　厳しくなったのだ。\n@c2@"
"15":
  de: "@a@b*: Darum laufen aus diesem 'afen keine Schiffe mehr aus.\n@c2@"
  en: "@a@b*: No ships will be departing from zis port any more.\n@c2@"
  es: "@a@b*: Ya no van a pagrtigr más bagrcos de este puegrto.\n@c2@"
  fr: "@a@b*ⓢ Plus aucun navire ne peut quitter the port, à présent.\n@c2@"
  it: "@a@b*: Nessun bateau partirà più da questo porto.\n@c2@"
  ja: "@a@b＊「もはや　この港から\n\t船が出てゆくことは　あるまい。\n@c2@"
"16":
  de: "@a@b*: Mein Bruder Ernst war so deprimiert, seit dieses Mädel, das er hier kannte, ihn verlassen hat, dass ich versuchen will, sie umzustimmen.\n@c2@"
  en: "@a@b*: My brother Yorick's been so depressed since this girl he met over here dumped him, I've come to get her to change her mind.\n@c2@"
  es: "@a@b*: Mi hermano Yorick está deprimido desde que le dejó esa chica que había conocido aquí. Yo he venido para hacerla cambiar de parecer.\n@c2@"
  fr: "@a@b*ⓢ Mon frère Yorick est si déprimé depuis que la fille qu'il a rencontrée ici l'a laissé tomber que je suis venu la chercher pour la faire changer d'avis.\n@c2@"
  it: "@a@b*: Da quando la sua ragazza lo ha lasciato, mio fratello Filippo è molto giù di morale, così sono venuto qui per cercare di farle cambiare idea.\n@c2@"
  ja: "@a@b＊「オラの兄さんを　ふった\n\tジルっておなごに会いに来ただよ。\n@c2@"
"17":
  de: "@a@b*: Sie heißt Susi. Sicher überlegt sie es sich noch mal, wenn ich ihr erzähle, was für ein netter Kerl Ernst ist.\n@c2@"
  en: "@a@b*: Her name's Suzy apparently. I'm sure she'll come 'round when I tell her what a great lad Yorick is.\n@c2@"
  es: "@a@b*: Creo que su nombre es Susi. Seguro que se lo piensa de nuevo cuando le cuente lo buen chico que es Yorick.\n@c2@"
  fr: "@a@b*ⓢ Elle s'appelle Alison, apparemment. Je suis sûr qu'elle viendra quand je lui aurai dit à quel point Yorick est un type extra.\n@c2@"
  it: "@a@b*: Se non sbaglio, lei si chiama Susanna. Dopo che le avrò detto quanto è in gamba Filippo, si precipiterà certamente da lui!\n@c2@"
  ja: "@a@b＊「兄さんの良さを　教えてやんねば！\n@c2@"
"18":
  de: "@a@b*: Hallo! Ich bin Susi. Schön, dass %L000%Xihr bei mir vorbeischaut%Ydu bei mir vorbeischaust%Z. Hi hi hi!\n@c1@"
  en: "@a@b*: Hi! I'm Suzy.\nIt's very flattering that you're so eager to come ⓗchez moiⓘ. Tee hee hee!\n@c1@"
  es: "@a@b*: ¡Hola! Soy Susi.\nEs todo un halago que %H860%Xdesees%Ydeseéis%Z venir ''chez moi''. ¡Ji, ji!\n@c1@"
  fr: "@a@b*ⓢ Helloⓠ Je m'appelle Alison.\nC'est gentil de venir me voir. Hi hi hiⓠ\n@c1@"
  it: "@a@b*: Salve! Io sono Susanna.\nMi fa piacere che %H860%Xtu abbia%Yvoi abbiate%Z tanta voglia di venire ⓕchez moiⓖ. Eh! Eh! Eh!\n@c1@"
  ja: "@a@b＊「あたしは　ジル。\n\tこんな早くから　会いに来てくれて\n\tありがとう。\n@c1@"
"19":
  de: "@aSusi@bAber die Schänke macht erst heute Abend auf. Pardon!\n@c1@"
  en: "@aSuzy@bBut the pub doesn't open 'til the evening, I'm afraid. Pardon!\n@c1@"
  es: "@aSusi@bPero me temo que la taberna no abre hasta la noche. ¡Pardon!\n@c1@"
  fr: "@aAlison@bMais le pub n'ouvre que ce soir. Sorryⓠ\n@c1@"
  it: "@aSusanna@bIl locale però non apre fino a sera, mi spiace. Pardon!\n@c1@"
  ja: "@a@bジル「でも　酒場は夜からなの。\n\tごめんね。\n@c1@"
"20":
  de: "@a@b*: Es ist noch nicht offen. Hab noch was zu erledigen.\n@c2@"
  en: "@a@b*: Bar's not open yet.\nI'm still setting up.\n@c2@"
  es: "@a@b*: La taberna no está abierta todavía.\nEstoy preparándolo todo.\n@c2@"
  fr: "@a@b*ⓢ Le pub n'est pas encore ouvert.\nJe fais un peu de rangement.\n@c2@"
  it: "@a@b*: Il bar non è aperto.\nSto ancora sistemando delle cose.\n@c2@"
  ja: "@a@b＊「まだ　準備中なんです。\n\tすいませんね。\n@c2@"
"21":
  de: "@a@b*: Mon Dieu! Noch mehr Besucher?\n'eutzutage 'aben die Gefängnisse mehr Besucher als die Kneipen...\n@c2@"
  en: "@a@b*: Mon Dieu! More visiteurs?\nZe prisons 'ave more visiteurs zan ze pubs zese days...\n@c2@"
  es: "@a@b*: ¡Mon Dieu! ¿Más visiteurs?\nLos pgrisionegros tienen más visitantes que la tabegrna ultimamente...\n@c2@"
  fr: "@a@b*ⓢ My Godⓠ Encore des visitorsⓡ\nLes prisoners en attirent plus que les pubs, ces derniers temps...\n@c2@"
  it: "@a@b*: Mon Dieu! Ancora visiteurs?\nUltimamente le prigioni hanno plus clienti dei bar!\n@c2@"
  ja: "@a@b＊「やれやれ　また面会か？\n\t最近は　囚人たちに\n\t会いに来るヤツが　多いなあ……。\n@c2@"
"22":
  de: "@a@b*: 'ört zu. Isch 'ab ge'ört, 'inter diesem Balzack, dem Marquis Régent, steckt so 'n 'err der Dunkel'eit.\n@c2@"
  en: "@a@b*: Listen 'ere. I 'eard there's some Master o' Darkness geezer pullin' the strings be'ind that Marquis Regent, Balzack.\n@c2@"
  es: "@a@b*: Eh, escucha. Me han dicho que un pollo llamado Señor de la Oscuridad es el que mueve los hilos del Marqués Regente, Balzack.\n@c2@"
  fr: "@a@b*ⓢ Écoutez. J'ai entendu dire qu'un certain Maître de l'Ombre tirait les ficelles derrière ce Lord Regent, Dickenz.\n@c2@"
  it: "@a@b*: %H860%XSenti%YSentite%Z che notizia! Ho saputo che dietro a quel Marchese Reggente, Balzack, in realtà c'è un certo Signore degli Inferi.\n@c2@"
  ja: "@a@b＊「キングレオの\n\tバルザック王の後ろには\n\t影の支配者が　いるそうだ。\n@c2@"
"23":
  de: "@a@b*: Und das ist noch nischt alles. Sie sagen, er sei nischt mal ein Mensch!\n@c2@"
  en: "@a@b*: An' that ain't all.\nThey say 'e ain't even 'uman!\n@c2@"
  es: "@a@b*: Y aún hay más.\n¡Dicen que no es humano!\n@c2@"
  fr: "@a@b*ⓢ Et c'est pas tout.\nIl paraît qu'il est même pas humainⓠ\n@c2@"
  it: "@a@b*: E non è tutto.\nDicono persino che non sia un umano!\n@c2@"
  ja: "@a@b＊「それも　うわさでは\n\t人間では　ないんだと。\n@c2@"
"24":
  de: "@a@b*: Das 'ab isch alles neulisch schon einem Soldaten namens Rauhbein erzählt. Der 'at das aber nischt so ruhig aufgenommen wie Ihr!\n@c2@"
  en: "@a@b*: I was tellin' all this to some soldier called McRyan the other day. Well, 'e didn't take it as calmly as you are, I can tell ya!\n@c2@"
  es: "@a@b*: El otro día le decía todo esto a un personaje llamado McRyan. ¡No se lo tomó con tanta calma como %H860%Xtú%Y%R000%Xvosotras%Yvosotros%Z%Z, vamos!\n@c2@"
  fr: "@a@b*ⓢ L'autre jour, j'ai raconté tout ça à un soldat appelé McRyan. Eh bien, j'peux vous dire qu'il l'a pas pris aussi calmement qu'vousⓠ\n@c2@"
  it: "@a@b*: L'altro giorno ho raccontato questa storia a un soldato chiamato Galiardo de' Guglielmi, e %H860%Xti%Yvi%Z garantisco che non l'ha presa tanto bene!\n@c2@"
  ja: "@a@b＊「そのことを\n\tライアンって戦士に話したら\n\tあわてて出ていったよ。\n@c2@"
"25":
  de: "@a@b*: Isch frage misch, ob es wohl die Prophètisserie an der Küste noch gibt...\n@c2@"
  en: "@a@b*: I wonder if zat prophètisserie near ze coast is still zere...\n@c2@"
  es: "@a@b*: Me pgregunto si esa prophètisserie que estaba en la costa sigue ahí...\n@c2@"
  fr: "@a@b*ⓢ Je me demande si la prophétissery près de la côte est encore là...\n@c2@"
  it: "@a@b*: Chissà se l'Oracoleria vicino alla côte c'è ancora...\n@c2@"
  ja: "@a@b＊「海辺の　お告げ所は\n\tまだ　あるのだろうか……。\n@c2@"
"26":
  de: "@a@b*: Uwaaahhh! Uwaaahhh!\n@c2@"
  en: "@a@b*: Uwaaargh! Uwaaargh!\n@c2@"
  es: "@a@b*: ¡Aaaargh! ¡Aaaargh!\n@c2@"
  fr: "@a@b*ⓢ Waaarghⓠ Waaarghⓠ\n@c2@"
  it: "@a@b*: Uaaargh! Uaaargh!\n@c2@"
  ja: "@a@b＊「うおーん　うおーん。\n@c2@"
"27":
  de: "@a@b*: Hier war Großvater also die ganze Zeit.\n@c1@"
  en: "@a@b*: So this is where Grandad's been all this time.\n@c1@"
  es: "@a@b*: Así que aquí es donde ha estado el abuelo todo este tiempo.\n@c1@"
  fr: "@a@b*ⓢ Alors c'est là que papy était caché tout ce temps.\n@c1@"
  it: "@a@b*: Ecco dov'è stato il nonno tutto questo tempo.\n@c1@"
  ja: "@a@b＊「おじいちゃんたら\n\tまた　ここに来てたのね。\n@c1@"
"28":
  de: "@a@b*: Warum er Endor wohl so vermisst? Von hier aus kann man es noch nicht mal sehen.\n@c1@"
  en: "@a@b*: I wonder why he misses Endor so much.\nYou can't even see the place from here, either.\n@c1@"
  es: "@a@b*: Me pregunto por qué echa tanto de menos Endor. Ni siquiera se puede ver ese lugar desde aquí.\n@c1@"
  fr: "@a@b*ⓢ Je me demande pourquoi Chandor lui manque tant.\nEn plus, on ne voit même pas la ville d'ici.\n@c1@"
  it: "@a@b*: Chissà perché Endor gli manca così tanto. Non si riesce neanche a vederla, da qui.\n@c1@"
  ja: "@a@b＊「そんなに　エンドールの国が\n\tなつかしいのかしら。\n\tここからじゃ見えやしないのに……。\n@c1@"
