"36":
  de: "@aSusi@bHallo! Ich bin Susi! %L000%XTanzt%YTanz%Z doch mit mir!\n@c1@"
  en: "@aSuzy@bHiya! I'm Suzy!\nCome on, dance with me!\n@c1@"
  es: "@aSusi@b¡Hola! ¡Soy Susi!\n¡Vamos, a bailagr conmigo!\n@c1@"
  fr: "@aAlison@bHelloⓠ Moi, c'est Alisonⓠ\nVenez danser avec moiⓠ\n@c1@"
  it: "@aSusanna@bSalve! Io sono Susanna!\nForza, %H860%Xvieni%Yvenite%Z a ballare con me!\n@c1@"
  ja: "@a@bジル「あたしは　ジル。\n\tさあ　あなたたちも　\n\t踊って踊って！\n@c1@"
"37":
  de: "@a@b*: Seht Euch nur mal Susi an! Die ist auf meinen Bruder doch verschwendet. Mit dem soll sie bloß nicht ihre Zeit vergeuden!\n@c2@"
  en: "@a@b*: Just look at Suzy! She'd be wasted on my brother. I've already told her she shouldn't waste her time on him!\n@c2@"
  es: "@a@b*: ¡Fíjate en Susi! Mi hermano no se la merece. ¡Ya le he dicho que no pierda el tiempo con él!\n@c2@"
  fr: "@a@b*ⓢ Regardez un peu Alisonⓠ Avec mon frère, ce serait du gâchis. Je lui ai déjà dit de ne pas perdre son temps avec luiⓠ\n@c2@"
  it: "@a@b*: Ahhh, Susanna... Basta guardarla per capire che è sprecata per mio fratello! Le ho già detto di non perdere tempo con lui!\n@c2@"
  ja: "@a@b＊「ジルちゃんは　めんこいだなやあ。\n\t兄さんにゃ　もったいねえだ。\n\tオラの　よめっこにするだあよ！\n@c2@"
"38":
  de: "@a@b*: Habt Ihr vom Turnier von Endor gehört? Dort soll eine Prinzessin gewonnen haben!\n@c2@"
  en: "@a@b*: You know the Endor Tourney? I heard it was a princess of all people who won it, you know!\n@c2@"
  es: "@a@b*: ¿%H860%XHas%YHabéis%Z oído hablar del Torneo de Endor? Me han dicho que de todos los participantes, lo ganó una princesa, ¿lo %H860%Xsabías%Ysabíais%Z?\n@c2@"
  fr: "@a@b*ⓢ Vous connaissez le tournoi de Chandorⓡ\nIl paraît que c'est une princesse qui a gagnéⓠ\n@c2@"
  it: "@a@b*: %H860%XHai%YAvete%Z saputo cos'è successo al Torneo di Endor? Ho sentito che è stata una principessa a vincerlo!\n@c2@"
  ja: "@a@b＊「なんでも　エンドールで行われた\n\t武術大会では　どこかのお城の\n\tお姫さまが優勝したそうです。\n@c2@"
"39":
  de: "@a@b*: Und das war noch nicht alles... Als die Prinzessin nach dem Turnier nach Hause kam, war die Burg, in der sie lebte, menschenleer!\n@c2@"
  en: "@a@b*: And there's more... When the princess went home after the competition, she found the castle she lived in totally empty!\n@c2@"
  es: "@a@b*: Y todavía hay más... Cuando la princesa regresó a casa tras el combate, ¡encontró totalmente vacío el castillo donde vivía!\n@c2@"
  fr: "@a@b*ⓢ Le plus fou... c'est que quand elle est rentrée chez elle, après la compétition, son château était complètement videⓠ\n@c2@"
  it: "@a@b*: E non è finita qui... Quando la principessa è tornata a casa dopo il torneo, ha ritrovato il suo castello completamente vuoto!\n@c2@"
  ja: "@a@b＊「でも　そのお姫さまが試合のあと\n\t自分のお城に　帰ってみると\n\tお城は　もぬけのカラだったとか。\n@c2@"
"40":
  de: "@a@b*: Das ist doch recht seltsam, oder?\n@c2@"
  en: "@a@b*: It's a funny old world, isn't it?\n@c2@"
  es: "@a@b*: Es un mundo muy extraño, ¿verdad?\n@c2@"
  fr: "@a@b*ⓢ On vit dans un monde vraiment étrange, noⓡ\n@c2@"
  it: "@a@b*: Certo che ne succedono di cose strane, eh?\n@c2@"
  ja: "@a@b＊「不思議なことも　あるもんですなあ。\n@c2@"
"41":
  de: "@a@b*: Le Marquis Régent Balzack 'at sisch noch mehr zurückgezogen.\n@c2@"
  en: "@a@b*: Ze Marquis Régent Balzack is even more of a recluse zan before now.\n@c2@"
  es: "@a@b*: El Marquis Gregente Balzack aún está más grecluido que antes.\n@c2@"
  fr: "@a@b*ⓢ The Lord Regent, Dickenz, vit encore plus reclus qu'avant.\n@c2@"
  it: "@a@b*: Il Marquis Régent Balzack eshe di rado ultimamente.\n@c2@"
  ja: "@a@b＊「キングレオの　バルザック王は\n\t前にもまして\n\tお姿を　見せなくなった。\n@c2@"
"42":
  de: "@a@b*: Dem 'immel sei Dank! Wenigstens können meine Landsleute und isch jetzt manschmal etwas trinken! Hick!\n@c2@"
  en: "@a@b*: Thank 'eaven! At least now my compatriots and me can 'ave a few drinks sometimes. Hic!\n@c2@"
  es: "@a@b*: ¡Gracias a la Diosa! Ahogra mis compatgriotas y yo podgremos tomagrnos unas cegrvezas de vez en cuando. ¡Hip!\n@c2@"
  fr: "@a@b*ⓢ Dieu merciⓠ Au moins, mes fellows et moi, on peut boire quelques pintes de temps en temps. Hicⓠ\n@c2@"
  it: "@a@b*: Dieu merci! Almeno adesho io e i miei compatrioti poshiamo farshi qualche bicchierino ogni tanto. Hic!\n@c2@"
  ja: "@a@b＊「おかげで　こうして\n\t羽を伸ばせるというものだ。\n\tういー。　ひっく。\n@c2@"
"43":
  de: "@a@b*: Oh, isch bin überwältigt! Wie viel sie alle trinken wollen! Eine Bestellung nach der anderen!\n@c1@"
  en: "@a@b*: Oh, I am rushed off ze feet!\nLook 'ow much zey are all drinking!\nIt's one order after another.\n@c1@"
  es: "@a@b*: ¡Oh, no puedo pagragr!\n¡Comó beben! ¡Es una detgrás de otgra!\n@c1@"
  fr: "@a@b*ⓢ Oh, je suis sur les rotulesⓠ\nCe sont des lourds buveurs.\nIls enchaînent les pintes.\n@c1@"
  it: "@a@b*: Oh, c'est pas possible!\nStanno bevendo come spugne! Un bicchiere dopo l'altro, incroyable.\n@c1@"
  ja: "@a@b＊「ああんっ　忙しいっ！\n\tみんな　すごく飲むから\n\t注文取りも大変だわ！\n@c1@"
"44":
  de: "@a@b*: Reinspaziert, nur reinspaziert! Zeit zum Trinken, Tanzen, Trinken, Singen, Trinken und Fröhlichsein!\n@c2@"
  en: "@a@b*: Come in, come in!\nDrink, dance, drink, sing, drink and be merry!\nThat's the spirit!\n@c2@"
