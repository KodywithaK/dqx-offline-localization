"0":
  de: "@aKönig Norbert@bGlückwunsch, Alena. Ich kann Euch gar nicht genug für Eure Mühen danken.\n@c2@"
  en: "@aKing Norman@bCongratulations, Alena. I can't thank you enough for your efforts.\n@c2@"
  es: "@aRey Norman@bEnhorabuena, Alena. Apenas puedo expresar mi agradecimiento por vuestro esfuerzo.\n@c2@"
  fr: "@aRoi Norbert@b%A120%XToutes mes félicitations à Alina. Ma reconnaissance est immense.%Z%B120%XFélicitations, Alina. Je ne pourrai jamais assez vous remercier pour vos efforts.%Z\n@c2@"
  it: "@aRe Norman@b%A110%XAlena è stata fenomenale! Non so davvero come esprimerle la mia riconoscenza per quello che ha%Z%B120%XCongratulazioni, Alena. Non so davvero come ringraziarti per quello che hai%Z fatto.\n@c2@"
  ja: "@a@b王「アリーナ姫よ\n\tよくぞ　優勝してくれた。\n\t心から　礼を言うぞ！\n@c2@"
"1":
  de: "@aPrinzessin Veronica@bDa kann ich mich nur anschließen. Ihr wart meine Rettung. Vielen herzlichen Dank!\n@c2@"
  en: "@aPrincess Veronica@bHear, hear. You're my saviour. Thank you so much!\n@c2@"
  es: "@aPrincesa Verónica@b¡Bien dicho! Sois mi salvadora. ¡Muchísimas gracias!\n@c2@"
  fr: "@aPrincesse Véronica@b%A120%XJe dois dire qu'Alina m'a vraiment sauvée.\nMerci infinimentⓠ%Z%B120%XSincèrement, vous m'avez sauvée. Merci infinimentⓠ%Z\n@c2@"
  it: "@aPrincipessa Veronica@b%A110%XSe non fosse stato per lei, non so come sarebbe andata a finire%Z%B120%XBravissima... Mi hai salvata! Grazie di cuore%Z! \n@c2@"
  ja: "@a@b＊「私からも　お礼を申し上げますわ。\n\tアリーナさま。\n\t本当に　ありがとうございます。\n@c2@"
"2":
  de: "@aKönig Norbert@bJa, ich bin sicher, Euer Vater wird höchst erfreut sein, von Euren Taten zu erfahren!\n@c2@"
  en: "@aKing Norman@bYes, I'm sure your father will be most pleased to hear the news of your achievements.\n@c2@"
  es: "@aRey Norman@bSí, estoy seguro de que a vuestro padre le encantará recibir noticias de vuestros logros.\n@c2@"
  fr: "@aRoi Norbert@b%A120%XOui, je suis certain que son père sera ravi d'apprendre ses exploits.%Z%B120%XOui, je suis certain que votre père sera ravi d'apprendre vos exploits.%Z\n@c2@"
  it: "@aRe Norman@bSì, sono certo che %A110%Xsuo padre sarà fiero di lei per l'impresa che ha%A110%X%Z%B120%Xtuo padre sarà fiero di te per l'impresa che hai%Z compiuto.\n@c2@"
  ja: "@a@b王「うむ！　このことを　知らせれば\n\t父上の　サントハイム王も\n\tさぞかし　よろこぶはず。\n@c2@"
"3":
  de: "@aKönig Norbert@bIhr müsst sofort nach Samokswa zurückkehren und ihm die glücklichen Neuigkeiten berichten.\n@c2@"
  en: "@aKing Norman@bYou must return to Zamoksva at once and inform him of the happy news.\n@c2@"
