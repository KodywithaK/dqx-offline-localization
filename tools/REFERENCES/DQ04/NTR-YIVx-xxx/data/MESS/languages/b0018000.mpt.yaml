"7":
  de: "@aPrinzessin Veronica@bVielen Dank%A120%X%Z%B120%X, Alena%Z. Jetzt muss ich nicht mehr einen Mann heiraten, den ich mir nicht selbst ausgesucht habe.\n@c1@"
  en: "@aPrincess Veronica@b%A120%XThanks to Tsarevna Alena, I will no longer have to go through with a marriage not of my choosing.%Z%B120%XThank you, Alena. Now I don't have to go through with a marriage not of my choosing.%Z\n@c1@"
  es: "@aPrincesa Verónica@bGracias%A120%X.%Z%B120%X, Alena.%Z Ahora no tendré que casarme con alguien que no haya elegido.\n@c1@"
  fr: "@aPrincesse Véronica@b%A120%XUn grand merci à Alina.%Z%B120%XMerci, Alina.%Z\nDésormais, je n'aurai plus à subir un mariage que je n'aurai pas choisi.\n@c1@"
  it: "@aPrincipessa Veronica@b%A110%XSarò eternamente grata ad Alena. Grazie a lei%Z%B120%XTi sarò eternamente grata, Alena. Grazie a te%Z non sarò costretta a sposare l'uomo che non amo.\n@c1@"
  ja: "@a@b＊「ありがとうございました。\n\tこれで　いやな結婚を\n\tしなくてもすみますわ。\n@c1@"
"8":
  de: "@aPrinzessin Veronica@bAllerdings ⓚⓛ wenn %A120%Xdie Zarewna ein junger Mann wäre%Z%B120%XIhr ein junger Mann wäret%Z...\n@c1@"
  en: "@aPrincess Veronica@b%A120%XStill, if she were a boyⓚⓛ%Z%B120%XStill, if you were a boyⓚⓛ%Z\n@c1@"
  es: "@aPrincesa Verónica@bClaro que, si %A120%Xla Zarevna hubiera sido un chico%Z%B120%Xfuerais un chico...%Z\n@c1@"
  fr: "@aPrincesse Véronica@bN'empêche, si %A120%Xelle était%Z%B120%Xvous étiez%Z un garçon...\n@c1@"
  it: "@aPrincipessa Veronica@b%A110%XBeh, tutto sommato, se Alena fosse un ragazzo%Z%B120%XBeh, tutto sommato, se tu fossi stata un ragazzo%Z...\n@c1@"
  ja: "@a@b＊「でも　もしもアリーナさまが\n\t男の人だったら……。\n@c1@"
"9":
  de: "@aPrinzessin Veronica@bHuch! Was für albernes Zeug ich doch rede! Bitte vergesst das ganz schnell wieder.\n@c1@"
  en: "@aPrincess Veronica@bOops! Listen to me saying silly things! Please just forget I said anything.\n@c1@"
  es: "@aPrincesa Verónica@b¡Vaya! ¡Qué tonterías estoy diciendo! Por favor, olvidad lo que he dicho.\n@c1@"
  fr: "@aPrincesse Véronica@bOupsⓠ Écoutez donc les bêtises que je raconteⓠ Faites comme si vous n'aviez rien entendu.\n@c1@"
  it: "@aPrincipessa Veronica@bOh, cielo! Ma che sciocchezze sto blaterando? Fa' finta che io non abbia detto nulla!\n@c1@"
  ja: "@a@b＊「あら　私は\n\t何を言ってるのかしら。\n\tどうか　聞き流してください。\n@c1@"
"10":
  de: "@a@b*: Psaro der Metzler... Das ist wirklich ein furchteinflößender Name.\n@c2@"
  en: "@a@b*: Psaro the Manslayer... That really is a frightening name.\n@c2@"
  es: "@a@b*: Psaro el Carnicero... Es un nombre realmente espeluznante.\n@c2@"
  fr: "@a@b*ⓢ Psaro l'Exterminateur... Voilà un nom vraiment effrayant.\n@c2@"
  it: "@a@b*: Psaro il Massacratore... Che nome terrificante!\n@c2@"
  ja: "@a@b＊「デスピサロ……。\n\tじつに　不吉な名前じゃ。\n@c2@"
"11":
  de: "@a@b*: Das hier ist König Norberts Thronsaal.\n@c2@"
  en: "@a@b*: This is King Norman's throne room.\n@c2@"
  es: "@a@b*: Esta es la sala del trono del rey Norman.Aurora, March 04, Fixed salón\n@c2@"
  fr: "@a@b*ⓢ Ceci est la salle du trône du roi Norbert.\n@c2@"
  it: "@a@b*: Questa è la stanza del trono di Re Norman.\n@c2@"
  ja: "@a@b＊「ここは　エンドール王の\n\tお部屋です。\n@c2@"
"12":
  de: "@a@b*: %A120%XAlenas%Z%B120%XEure%Z Stärke ist wirklich eindrucksvoll%A120%X%Z%B120%X, Fräulein Alena%Z. Wir stehen tief in %A120%Xihrer%Z%B120%XEurer%Z Schuld.\n@c2@"
  en: "@a@b*: %A120%XMiss Alena really is formidable. We are forever indebted to her.%Z%B120%XYou really are formidably strong, Miss Alena. We're indebted to you.%Z\n@c2@"
  es: "@a@b*: Tenéis una fuerza formidable%A120%X.%Z%B120%X, señorita Alena.%Z Estamos en deuda con vos.\n@c2@"
  fr: "@a@b*ⓢ %A120%XMademoiselle Alina est vraiment très forte. Nous lui devons beaucoup.%Z%B120%XVous êtes vraiment très forte, Mademoiselle Alina. Nous vous devons beaucoup.%Z\n@c2@"
  it: "@a@b*: %A110%XAlena è straordinariamente forte. Le siamo tutti debitori%Z%B120%XSiete straordinariamente forte, Alena. Vi siamo debitori%Z.\n@c2@"
  ja: "@a@b＊「アリーナ姫の　なんとお強いこと。\n\t感服いたしましたぞ。\n@c2@"
"13":
  de: "@a@b*: Ach, aber das %A120%Xsind doch die Gefährten der Prinzessin! Herzlichen Glückwünsch! Alenas Sieg war%Z%B120%Xist doch Prinzessin Alena! Ich beglückwünsche Euch zu Eurem Sieg! Ihr wart%Z wirklich unglaublich!\n@c2@"
  en: "@a@b*: %A120%XWhat a marvellous victory for Princess Alena!\nShe really was incredible!%Z%B120%XOh, if it isn't Princess Alena! Congratulations on your victory! You truly were incredible!%Z\n@c2@"
  es: "@a@b*: ¡Vaya%A120%X!%Z%B120%X, si es la princesa Alena!%Z ¡Felicitaciones por %A120%Xla victoria!%Z%B120%Xtu victoria! ¡Has estado increíble!%Z\n@c2@"
  fr: "@a@b*ⓢ %A120%XQuelle belle victoire pour la princesse Alinaⓠ\nElle a été incroyableⓠ%Z%B120%XOh, mais c'est la princesse Alinaⓠ Félicitations pour votre victoireⓠ Vous avez été incroyableⓠ%Z\n@c2@"
  it: "@a@b*: %A110%XAh, se non fosse stato per la Zarina Alena, non so proprio come avremmo fatto. È stata formidabile%Z%B120%XComplimenti, siete stata formidabile%Z!\n@c2@"
  ja: "@a@b＊「まあ　アリーナさま。\n\t優勝おめでとうございます！\n@c2@"
"14":
  de: "@a@b*: %A120%XIch möchte der Zarewna unbedingt gratulieren%Z%B120%XIhr seid Zarewna Alena, nicht wahr? Ich muss Euch einfach die Hand schütteln%Z!\n@c2@"
  en: "@a@b*: %A120%XTsarevna Alena's amazing!\nI'd love to shake her hand!%Z%B120%XYou're Tsarevna Alena, aren't you?\nI just have to shake your hand!%Z\n@c2@"
  es: "@a@b*: Eres %A120%Xamigo de la zarevna Alena%Z%B120%Xla zarevna Alena%Z, ¿verdad?\n¡Deja que te estreche la mano!\n@c2@"
  fr: "@a@b*ⓢ %A120%XLa tsarine Alina a été époustouflanteⓠ J'adorerais lui serrer la mainⓠ%Z%B120%XVous êtes la tsarine Alina, n'est-ce pasⓡ\nIl faut que je vous serre la mainⓠ%Z\n@c2@"
  it: "@a@b*: %A110%XPer me sarebbe un vero onore poter stringere la mano della Zarina Alena!%Z%B120%XVoi siete la Zarina Alena, vero? Posso avere l'onore di stringervi la mano?%Z\n@c2@"
  ja: "@a@b＊「あなたが　アリーナ姫！？\n\tぜ　ぜひ　あくしゅして下さい！\n@c2@"
"15":
  de: "@a@b*: Oh du liebe Güte. So viel Wäsche und so wenig Zeit, um sie zu waschen!\n@c2@"
  en: "@a@b*: Dearie me. So many things to wash and not enough minutes in the day to wash them in!\n@c2@"
  es: "@a@b*: Ay, por la Diosa. ¡Tanto por lavar y tan poco tiempo para lavarlo!\n@c2@"
  fr: "@a@b*ⓢ Pauvre de moi. Tant de choses à laver et si peu de temps dans la journée pour le faireⓠ\n@c2@"
  it: "@a@b*: Un'intera giornata di lavoro non mi basterà per lavare tutta questa roba! Povera me...\n@c2@"
  ja: "@a@b＊「よいしょ　よいしょ。\n\t洗い物が多くて　たいへん！\n@c2@"
"16":
  de: "@a@b*: Es ist so eine Erleichterung, dass die Prinzessin nun doch nicht dieses Scheusal heiraten muss.\n@c1@"
  en: "@a@b*: It's such a relief that the princess won't have to marry that awful brute.\n@c1@"
  es: "@a@b*: Qué alivio, la princesa no tendrá que casarse con ese bestia espantoso.\n@c1@"
  fr: "@a@b*ⓢ C'est un réel soulagement de savoir que la princesse n'aura pas à épouser cette horrible brute.\n@c1@"
  it: "@a@b*: Che sollievo! Ora la Principessa non dovrà più sposare quel rozzo cattivone.\n@c1@"
  ja: "@a@b＊「変な男と　結婚しなくてすんで\n\tほんとに　よかったわ。\n@c1@"
"17":
  de: "@a@b*: Seid vor Psaro dem Metzler auf der Hut, ja?\n@c2@"
  en: "@a@b*: Watch out for that Psaro the Manslayer, won't ya?\n@c2@"
  es: "@a@b*: %H860%XTen%YTened%Z cuidado con Psaro el Carnicero, ¿me %H860%Xoyes%Yoís%Z?\n@c2@"
  fr: "@a@b*ⓢ Méfiez-vous de ce Psaro l'Exterminateur, surtoutⓠ\n@c2@"
  it: "@a@b*: %H860%XFai%YFate%Z attenzione a Psaro il Massacratore, mi raccomando!\n@c2@"
  ja: "@a@b＊「デスピサロに　気をつけるんだ！\n@c2@"
"18":
  de: "@a@b*: %A120%XEin Hoch auf%Z%B120%XGlückwunsch zu Eurem Sieg,%Z Prinzessin Alena!\n@c2@"
  en: "@a@b*: %A120%XOh, Princess Alena did so very well! What a win!%Z%B120%XCongratulations on your win, Princess Alena!%Z\n@c2@"
  es: "@a@b*: ¡Enhorabuena por %A120%Xla victoria!%Z%B120%Xtu victoria, princesa Alena!%Z\n@c2@"
  fr: "@a@b*ⓢ %A120%XLa tsarine Alina a vraiment remporté une superbe victoireⓠ%Z%B120%XFélicitations pour votre victoire, princesse Alinaⓠ%Z\n@c2@"
  it: "@a@b*: %A110%XLa Zarina Alena si è battuta in maniera splendida%Z%B120%XComplimenti per la vittoria, Zarina Alena%Z!\n@c2@"
  ja: "@a@b＊「あっ　アリーナ姫さま！\n\t優勝　おめでとうございます。\n@c2@"
"19":
  de: "@a@b*: Nun, da das Turnier vorbei ist, ist das Kolosseum geschlossen.\n@c2@"
  en: "@a@b*: The Colosseum has been closed up now that the tournament is over.\n@c2@"
  es: "@a@b*: Con el torneo finalizado, el Coliseo está cerrado.\n@c2@"
  fr: "@a@b*ⓢ Maintenant que le tournoi est fini, le Colisée est fermé.\n@c2@"
  it: "@a@b*: Ora che il torneo è finito, l'Arena è chiusa.\n@c2@"
  ja: "@a@b＊「武術大会も　終わったので\n\tコロシアムは　閉めてしまいました。\n@c2@"
"20":
  de: "@a@b*: Hey, hey, hey! %A120%XDie Gefährten der Zarewna%Z%B120%XPrinzessin Alena in Fleisch und Blut!%Z ... Oh, tut mir leid. Ich bin ein bisschen aufgeregt. Trotzdem herzlichen Glückwunsch!\n@c2@"
  en: "@a@b*: Woooo! %A120%XHooray for Princess Alena! Hooray!!! ...Sorry. I'm a bit over-excited and that.%Z%B120%XIt's Princess Alena in the flesh! ...Sorry. I'm a bit over-excited and that. Congratulations, though.%Z\n@c2@"
  es: "@a@b*: ¡Guau! %A120%X¡Un amigo de Alena en persona!%Z%B120%X¡La princesa Alena en persona!%Z Eh, lo siento. Estoy un poco nerviosillo y eso. Enhorabuena, en todo caso.\n@c2@"
  fr: "@a@b*ⓢ Wouhouⓠ %A120%X\nVive la princesse Alinaⓠ Vive la princesse Alinaⓠ\n... Pardon. Je suis un peu surexcité.%Z%B120%XMais c'est la princesse Alina en chair et en osⓠ ... Pardon. Je suis un peu surexcité. Félicitations, en tout cas.%Z\n@c2@"
  it: "@a@b*: %A110%XHo sentito dire che la Zarina Alena si è battuta in maniera principesca! Anzi, zarinesca! Ehm... si può dire ⓕzarinescaⓖ?%Z%B120%XWow! La Zarina Alena in carne e ossa! Chiedo scusa, ma sono molto emozionato. Volevo congratularmi con voi per la vittoria!%Z\n@c2@"
  ja: "@a@b＊「うわっ　本物のアリーナ姫だ！\n\tいや　失礼しました。\n\t優勝　おめでとうございます！\n@c2@"
"21":
  de: "@a@b*: %A120%XIch habe Fräulein Alena%Z%B120%XOh, Fräulein Alena! Ich habe Euch%Z immer die Daumen gedrückt! %A120%XSie war%Z%B120%XIhr wart%Z wunderbar!\n@c1@"
  en: "@a@b*: %A120%XI was supporting Miss Alena all the way through. She was really wonderful!%Z%B120%XOoh, Miss Alena! I was supporting you all along! You were really wonderful.%Z\n@c1@"
  es: "@a@b*: %A120%X¡Ah! Soy una fan de Alena!%Z%B120%X¡Ooh, señorita Alena!%Z ¡La he estado animando todo el rato! Ha estado maravillosa.\n@c1@"
  fr: "@a@b*ⓢ %A120%XJ'ai soutenu la princesse Alina tout au long du tournoiⓠ Elle a été merveilleuseⓠ%Z%B120%XOh, Mademoiselle Alinaⓠ Je vous ai soutenue tout au long du tournoiⓠ Vous avez été merveilleuse.%Z\n@c1@"
  it: "@a@b*: %A110%XNon ho mai smesso di fare il tifo per la Zarina Alena, nemmeno per un minuto! Tranne quando sono dovuta scappare al bagno, ehm...%Z%B120%XOh, signorina Alena! Non ho mai smesso di fare il tifo per voi! Siete stata meravigliosa!%Z\n@c1@"
  ja: "@a@b＊「きゃー！　アリーナさまっ。\n\t私　おうえんしてました！\n\tすっごく　かっこよかったです。\n@c1@"
"22":
  de: "@a@b*: Man munkelt, seit Psaro der Metzler verschwunden ist, seien auch die Ungeheuer nicht mehr aufgetaucht.\n@c2@"
  en: "@a@b*: There's strange talk going around that the monsters stopped appearing at about the time Psaro the Manslayer disappeared.\n@c2@"
  es: "@a@b*: Un extraño rumor dice que se han dejado de ver monstruos desde que desapareció Psaro el Carnicero.\n@c2@"
  fr: "@a@b*ⓢ Des rumeurs bizarres disent que les monstres ont cessé de se montrer à peu près au moment de la disparition de Psaro l'Exterminateur.\n@c2@"
  it: "@a@b*: Che cosa bizzarra... Da quando Psaro il Massacratore è sparito dalla circolazione, non si vedono più mostri in giro.\n㈡\n*: Strana coincidenza, eh?\n@c2@"
  ja: "@a@b＊「なんと　うわさでは\n\tデスピサロが消えたころから\n\t魔物たちも　出なくなったそうじゃ。\n@c2@"
"23":
  de: "@a@b*: Psaro der Metzler... Ich frage mich, was er dazu sagen würde. Er war eine ziemlich zwielichtige Gestalt.\n@c2@"
  en: "@a@b*: Psaro the Manslayer... I wonder what his story is. He really was a shady character.\n@c2@"
  es: "@a@b*: Psaro el Carnicero... Me pregunto cuál será su historia. Era un personaje verdaderamente oscuro.\n@c2@"
  fr: "@a@b*ⓢ Psaro l'Exterminateur... Je me demande quelle est son histoire. Il était vraiment louche.\n@c2@"
  it: "@a@b*: Psaro il Massacratore... Non si sa nulla di lui. È un tipo davvero misterioso.\n@c2@"
  ja: "@a@b＊「デスピサロ……。\n\tやつは　いったい何者だったのか。\n\t結局　なぞの男だったな。\n@c2@"
"24":
