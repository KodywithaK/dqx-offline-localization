  it: "@aJolly Etchelsior@bQuando ho aperto la locanda, ho pensato che i clienti avrebbero potuto darmi qualche indicazione per individuare la posizione del tesoro sulla mappa.\n@c2@"
  ja: "@a@bヒルタン「宝の地図の　秘密を解くため\n\t旅人から情報を聞こうと\n\t宿屋を　始めたのだが……。\n@c2@"
"85":
  de: "@aGotthilf Dämler@bAber i bin jetzt reich g'nug, denk i mir. I han koi Zeit meh, irgendwelche Schätz zu suche.\n@c2@"
  en: "@aConrad 'Ilton@bBut I reckon I'm prob'ly rich enough now, eh?\nI ain't got time to bother wiv treasure no more.\n@c2@"
  es: "@aConrad Gilton@bPero parece que ya tengo suficiente pasta, ¿verdad?\nYa no tengo más tiempo que perder con ese tesoro.\n@c2@"
  fr: "@aConrad Ilton@bMais aujourd'hui, je suis assez riche, nonⓡ\nJe n'ai plus le temps de me préoccuper de ce trésor.\n@c2@"
  it: "@aJolly Etchelsior@bMa credo di aver già guadagnato abbastanza quattrini, giusto? Non ho tempo da perdere appresso ai tesori in questo momento.\n@c2@"
  ja: "@a@bヒルタン「わしは　もう\n\tじゅうぶん　金持ちになった。\n\tもはや　宝などいらぬのじゃ。\n@c2@"
"86":
  de: "@aHank Hoffman Jr.@bKlingt, als hätte der Erfolg des alten Dämler mit der Herberge begonnen, die er hier aufgemacht hat.\n@c2@"
  en: "@aHank Hoffman Jr.@bSounds like the start of old man Ilton's success was buildin' an inn right here.\n@c2@"
  es: "@aJuanchito@bParece que el éxito del viejo Gilton comenzó al construir una posada justo acá.\n@c2@"
  fr: "@aHank Hoffman Jr@bOn dirait qu'le succès du vieux Ilton a commencé quand il a construit son auberge ici.\n@c2@"
  it: "@aJohn Dwayne Jr.@bIl successo di Jolly Etchelsior è iniziato quando ha costruito la locanda qui.\n@c2@"
  ja: "@a@bホフマン「ヒルタン老人が\n\t成功したのは　ここで宿屋を\n\t始めたのがきっかけとか。\n@c2@"
"87":
  de: "@aHank Hoffman Jr.@bNa, da kommt mir doch glatt eine Idee...\n@c2@"
