  fr: "@a@b*ⓢ Ringys est certes une grande ville, à présent, mais elle n'était rien avant que Conrad Ilton arrive.\n@c1@"
  it: "@a@b*: Mintos sarà anche un villaggio importante adesso, ma prima che arrivasse Jolly Etchelsior, qui non c'era niente.\n@c1@"
  ja: "@a@b＊「今でこそ　大きな町になった\n\tミントスですが　昔は\n\t小さな村でした。\n@c1@"
"55":
  de: "@a@b*: Er war's, der unsere wunderbare Herberge erbaut hat, und schon bald kamen die Reisenden in Scharen hierher.\n@c1@"
  en: "@a@b*: He's the one who built that lovely inn of ours, and once he did, it wasn't long before travellers started flocking here.\n@c1@"
  es: "@a@b*: Fue el que construyó la posada y, cuando lo hizo, en nada, viajeros empezaron a dejarse caer por aquí.\n@c1@"
