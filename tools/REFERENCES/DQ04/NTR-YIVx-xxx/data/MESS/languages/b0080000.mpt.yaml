"0":
  de: "@aHank Hoffman Jr.@bHey! Hier war ich doch schon mal!\n@c2@"
  en: "@aHank Hoffman Jr.@bHey! I think I know this place.\n@c2@"
  es: "@aJuanchito@b¡Eh! Creo que conozco este lugar acá.\n@c2@"
  fr: "@aHank Hoffman Jr@bHéⓠ J'crois que j'connais cet endroit.\n@c2@"
  it: "@aJohn Dwayne Jr.@bEhi! Ma io conosco questo posto!\n@c2@"
  ja: "@a@bホフマン「ここは……もしや！？\n@c2@"
"1":
  de: "@aHank Hoffman Jr.@bJa klar war ich hier schon mal!\n@c2@"
  en: "@aHank Hoffman Jr.@bWhy, I surely do know it!\n@c2@"
  es: "@aJuanchito@b¡Pues claro que lo conozco!\n@c2@"
  fr: "@aHank Hoffman Jr@bMais ouais, bien sûr que j'le connaisⓠ\n@c2@"
  it: "@aJohn Dwayne Jr.@bLo conosco eccome!\n@c2@"
  ja: "@a@bホフマン「やっぱりそうだ！\n@c2@"
"2":
  de: "@aHank Hoffman Jr.@bDas ist ⓚⓛ Mintos! Mintos, wo der berüchtigte Gotthilf Dämler zu Hause ist. Man nennt ihn auch den Handelsgott, wisst Ihr.\n@c2@"
  en: "@aHank Hoffman Jr.@bThis here is Mintos! As in Mintos, home of the infamous Conrad Ilton. Folks call him the God of Trade, yⓙknow.\n@c2@"
  es: "@aJuanchito@b¡Es Mintos! Mintos, cuna de Conrad Gilton, de gran fama. Le llaman el Dios de las Mercaderías, ya saben.\n@c2@"
  fr: "@aHank Hoffman Jr@bC'est Ringysⓠ Ringys, où vit le célèbre Conrad Ilton.\nLes gens l'surnomment le Dieu du Commerce, vous savez.\n@c2@"
  it: "@aJohn Dwayne Jr.@bQuesta è Mintos, patria del famoso Jolly Etchelsior, un mercante talmente in gamba da essersi guadagnato il soprannome di ⓕdio degli affariⓖ.\n@c2@"
  ja: "@a@bホフマン「ミントスの町だ！\n\tあの　商売の神様と呼ばれる\n\tヒルタン老人の　ミントスだ！\n@c2@"
"3":
  de: "@aHank Hoffman Jr.@b...\n@c2@"
  en: "@aHank Hoffman Jr.@b...\n@c2@"
  es: "@aJuanchito@b...\n@c2@"
  fr: "@aHank Hoffman Jr@b............\n@c2@"
  it: "@aJohn Dwayne Jr.@b...\n@c2@"
  ja: "@a@bホフマン「…………。\n@c2@"
"4":
  de: "@aHank Hoffman Jr.@bAlso, das wird Euch jetzt wahrscheinlich überraschen, aber...\n@c2@"
  en: "@aHank Hoffman Jr.@bGee, um...this may come a bit sudden for yⓙall, but...\n@c2@"
  es: "@aJuanchito@bPuede que resulte un poco repentino, pero...\n@c2@"
  fr: "@aHank Hoffman Jr@bBon, hum... ça va peut-être vous paraître un peu soudain, mais...\n@c2@"
  it: "@aJohn Dwayne Jr.@bEhm... La mia decisione forse vi sorprenderà, ma...\n@c2@"
  ja: "@a@bホフマン「とつぜんですが　みなさん！\n@c2@"
"5":
  de: "@aHank Hoffman Jr.@bWisst Ihr, es war ein Mordsspaß, mit Euch durch die Gegend zu ziehen, und ich bin Euch netten Leutchen auch echt dankbar dafür.\n@c2@"
  en: "@aHank Hoffman Jr.@bYⓙknow Iⓙve had a hog-killinⓙ time travellinⓙ around with you fine people, anⓙ for that Iⓙll always be mighty thankful.\n@c2@"
  es: "@aJuanchito@bYa saben que disfrutamos de un tiempo requetebueno juntos, y quiero expresarles mi más profundo agradecimiento.\n@c2@"
  fr: "@aHank Hoffman Jr@bVous savez, j'ai passé d'super moments à voyager avec vous, et j'vous suis sacrément reconnaissant pour ça.\n@c2@"
  it: "@aJohn Dwayne Jr.@bMi sono divertito un sacco a viaggiare con voi, e di questo vi sarò sempre grato.\n@c2@"
  ja: "@a@bホフマン「これまで　ずっと\n\tいっしょに旅をしてくれたこと\n\tほんとうに　感謝しています。\n@c2@"
"6":
  de: "@aHank Hoffman Jr.@bAber es ist nun mal mein Traum, in die Fußstapfen von meinem Dad Hank Hoffman Senior zu treten und eine eigene anständige Herberge aufzumachen.\n@c2@"
  en: "@aHank Hoffman Jr.@bBut itⓙs my dream to follow in my daddy, Hank Hoffman Senior's footsteps and open up a fine inn of my own.\n@c2@"
  es: "@aJuanchito@bPero mi sueño es seguir los pasos de mi padrecito, Juancho, y regentar una bella posada.\n@c2@"
  fr: "@aHank Hoffman Jr@bMais mon rêve, c'est d'suivre les traces de mon père, Hank Hoffman Senior et d'ouvrir moi aussi une chouette auberge.\n@c2@"
  it: "@aJohn Dwayne Jr.@bMa il mio sogno è seguire le orme di mio padre, John Dwayne Senior, e aprire una locanda tutta mia.\n@c2@"
  ja: "@a@bホフマン「%a00140さん。\n\tわたしも　いずれは父の跡をつぎ\n\t立派な宿屋になるのが　夢でした。\n@c2@"
"7":
  de: "@aHank Hoffman Jr.@bIn Mintos lebt Gotthilf Dämler, der Handelsgott. Das ist 'n mächtig guter Geschäftsmann, so viel ist mal sicher.\n@c2@"
  en: "@aHank Hoffman Jr.@bMintos is home to the God of Trade, Conrad Ilton. Heⓙs ace-high, anⓙ that's for sure.\n@c2@"
  es: "@aJuanchito@bMintos es la cuna del Dios de las Mercaderías, Conrad Gilton. Es todo un maestro, eso es seguro.\n@c2@"
  fr: "@aHank Hoffman Jr@bC'est à Ringys que vit le Dieu du Commerce, Conrad Ilton. C'est un as dans son domaine, ça, c'est certain.\n@c2@"
  it: "@aJohn Dwayne Jr.@bMintos è la patria di Jolly Etchelsior, il ⓕdio degli affariⓖ. Lui è davvero un tipo in gamba, non c'è che dire... \n@c2@"
  ja: "@a@bホフマン「このミントスには　商人たちに\n\t商売の神様と呼ばれる\n\tヒルタン老人がいます。\n@c2@"
"8":
  de: "@aHank Hoffman Jr.@bWär schon mächtig gut, wenn ich mir von dem das eine oder andere abgucken könnte.\n@c2@"
  en: "@aHank Hoffman Jr.@bItⓙd be fine as cream gravy if I could learn a thing or two from him...\n@c2@"
  es: "@aJuanchito@bSería maravilloso si pudiera aprender una o dos cositas de él nomás.\n@c2@"
  fr: "@aHank Hoffman Jr@bÇa s'rait vraiment le top du top s'il pouvait m'apprendre un ou deux trucs...\n@c2@"
  it: "@aJohn Dwayne Jr.@bSono certo che potrebbe insegnarmi un mucchio di cosette importanti su come gestire un'attività commerciale...\n@c2@"
  ja: "@a@bホフマン「わたしはヒルタン老人の\n\tもとで　修行をつんでみたい。\n\tですから……\n@c2@"
"9":
  de: "@aHank Hoffman Jr.@bIch weiß, es ist nicht nett Euch gegenüber, aber ich muss Euch trotzdem fragen, %a00140.\n@c2@"
  en: "@aHank Hoffman Jr.@bI know itⓙs a mite selfish of me anⓙ all, but I gotta ask you anyway, %a00140.\n@c2@"
  es: "@aJuanchito@bPues ya sé que es un poco egoísta y todo eso, pero debo preguntar de todas formas, %a00140.\n@c2@"
  fr: "@aHank Hoffman Jr@bJ'sais que c'est un peu égoïste de ma part, et tout, mais faut quand même que j'vous d'mande, %a00140.\n@c2@"
  it: "@aJohn Dwayne Jr.@bSo che potrò sembrare un dannato egoista, %a00140, ma devo chiedertelo...\n@c2@"
  ja: "@a@bホフマン「勝手なお願いとは\n\tじゅうぶん　わかっていますが。\n\tどうか　%a00140さん。\n@c2@"
"10":
  de: "@aHank Hoffman Jr.@bKönnten wir jetzt getrennte Wege gehen? Es würde mir viel bedeuten, wenn ich hierbleiben könnte.\n@c2@"
  en: "@aHank Hoffman Jr.@bWould it be okay with you if we parted ways?\nIt'd mean the world to me to stay on here.\n@c2@"
  es: "@aJuanchito@b¿Le parece bien que me quede nomás? Significa mucho para mí quedarme acá ahorita.\n@c2@"
  fr: "@aHank Hoffman Jr@bVous seriez d'accord pour que nos chemins se séparent iciⓡ\nCe s'rait vraiment extra pour moi de rester ici.\n@c2@"
  it: "@aJohn Dwayne Jr.@bPer te va bene se ci separiamo? Ci tengo troppo a restare qui...\n@c2@"
  ja: "@a@bホフマン「ここで　みなさんと\n\tお別れさせてください。\n\tお願いします！\n@c2@"
"11":
  de: "@aHank Hoffman Jr.@bHey, das ist klasse, danke!\n@c2@"
  en: "@aHank Hoffman Jr.@bWhy, thank you!\n@c2@"
  es: "@aJuanchito@bVaya, ¡gracias!\n@c2@"
  fr: "@aHank Hoffman Jr@bAlors là, merciⓠ\n@c2@"
  it: "@aJohn Dwayne Jr.@bGrazie mille!\n@c2@"
  ja: "@a@bホフマン「ありがとうございます！\n@c2@"
"12":
  de: "@aHank Hoffman Jr.@bIch werd Euch nie vergessen, ehrlich! Und auch nicht, wie wichtig es ist, seinen Mitmenschen zu vertrauen.\n@c2@"
  en: "@aHank Hoffman Jr.@bIⓙll never forget you folks, yⓙhear?\nAnd Iⓙll never forget how important it is to have faith in your fellow man, neither.\n@c2@"
  es: "@aJuanchito@bNunca les olvidaré compadres, ¿saben?\nY nunca olvidaré lo importante que es tener fe en tus cuates.\n@c2@"
  fr: "@aHank Hoffman Jr@bJ'vous oublierai jamais, vous savez.\nEt j'oublierai jamais non plus à quel point c'est important d'avoir confiance en son prochain.\n@c2@"
  it: "@aJohn Dwayne Jr.@bNon vi dimenticherò mai, capito?\nE non dimenticherò mai quant'è importante avere fiducia negli altri.\n@c2@"
  ja: "@a@bホフマン「みなさんのことは\n\t一生　忘れません。\n\t信じる心の　大切さも……。\n@c2@"
"13":
  de: "@aHank Hoffman Jr.@bSo, dann schwing die Hufe, Mary Lou.\nIch bitte die Göttin um eine sichere Reise für Euch.\n@c2@"
  en: "@aHank Hoffman Jr.@bYou take care now, Mary Lou.\nIⓙll be prayinⓙ for yⓙall to have a safe trip.\n@c2@"
  es: "@aJuanchito@bCuídese mucho, Paca.\nDiré mis oraciones para que tengan un viaje seguro.\n@c2@"
  fr: "@aHank Hoffman Jr@bSois prudente, Marylou.\nJ'prierai pour que votre voyage se passe bien.\n@c2@"
  it: "@aJohn Dwayne Jr.@bIn gamba, Marilù.\nPregherò perché facciate buon viaggio.\n@c2@"
  ja: "@a@bホフマン「元気でな　パトリシア。\n\tさようなら　みなさん！\n\tご無事を　お祈りしています！\n@c2@"
"14":
  de: "@aHank Hoffman Jr.@bBei den Hunden der Prärie! Habt Ihr mir denn nicht zugehört?! Nun seid doch nicht so... Bitte!\n@c2@"
  en: "@aHank Hoffman Jr.@bSakes alive! Did you not hear what I been sayinⓙ!? Come on, now... Please!\n@c2@"
  es: "@aJuanchito@b¡Chanfle! ¡¿Acaso no %H860%Xescuchó%Yescucharon%Z lo que dije?! Venga, ni modo... ¡Por favor!\n@c2@"
  fr: "@aHank Hoffman Jr@bNom d'une pipeⓠ Vous avez pas entendu ce que j'viens de direⓠⓑ Allez, quoi... s'il vous plaîtⓠ\n@c2@"
  it: "@aJohn Dwayne Jr.@bPer tutti i serpenti a sonagli! Ma %H860%Xhai%Yavete%Z sentito cos'ho detto?! Per favore!\n@c2@"
  ja: "@a@bホフマン「そんなこと　言わずに！\n\tどうか　お願いします！\n@c2@"
"15":
  de: "@a@b*: Alles klar? Willkommen in Mintos!\n@c1@"
  en: "@a@b*: Awright? Welcome to Mintos!\n@c1@"
  es: "@a@b*: ¿Qué tal? %H860%X%A120%XBienvenido%Z%B120%XBienvenida%Z%Y%R000%XBienvenidas%YBienvenidos%Z%Z a Mintos.\n@c1@"
  fr: "@a@b*ⓢ Ça vaⓡ Bienvenue à Ringysⓠ\n@c1@"
  it: "@a@b*: Salve! Questa è Mintos!\n@c1@"
  ja: "@a@b＊「ここは　ミントスの町。\n@c1@"
"16":
  de: "@a@b*: Ihr seid doch sicher da, um den berühmten Gotthilf Dämler zu sehen, oder?\n@c1@"
  en: "@a@b*: No doubt you're 'ere to see the famous Conrad 'Ilton, eh?\n@c1@"
  es: "@a@b*: Seguro que %H860%Xhas%Yhabéis%Z venido para ver al famoso Conrad Gilton ese.\n@c1@"
  fr: "@a@b*ⓢ Vous êtes sûrement là pour voir le célèbre Conrad Ilton, nonⓡ\n@c1@"
  it: "@a@b*: Sicuramente %H860%Xsei%Ysiete%Z qui per incontrare il famoso Jolly Etchelsior, eh?\n@c1@"
  ja: "@a@b＊「商売をする者にとっては\n\tあこがれの　ヒルタン老人が\n\tいる町ですわ。\n@c1@"
"17":
  de: "@a@b*: Die Leute kommen aus der ganzen Welt, um seine Vorträge zu hören. Er ist das Idol der Händler.\n@c1@"
  en: "@a@b*: People come from all over the world to 'ear 'im lecture. He's the 'ero of traders ev'rywhere.\n@c1@"
  es: "@a@b*: Llega gente de todos lados para oírle dar sus charlas. Es el héroe de los comerciantes de todo el mundo.\n@c1@"
  fr: "@a@b*ⓢ Des gens viennent du monde entier pour écouter ses conférences. C'est le héros d'tous les commerçants, partout dans l'monde.\n@c1@"
  it: "@a@b*: Viene gente da tutto il mondo per ascoltare le sue conferenze. È l'esempio a cui si ispirano tutti coloro che vogliono diventare uomini d'affari di successo.\n@c1@"
  ja: "@a@b＊「さまざまな人たちが\n\tヒルタン老人の話を聞くため\n\tこの町を　訪れるのです。\n@c1@"
"18":
  de: "@a@b*: Dem fremden Priester in der Herberge geht's gar nicht gut.\n@c3@"
  en: "@a@b*: That foreign priest stayin' at the inn is in a right old state.\n@c3@"
  es: "@a@b*: Ese sacerdote extranjero que está en la posada está hecho una piltrafa.\n@c3@"
  fr: "@a@b*ⓢ Ce prêtre étranger qui loge à l'auberge est dans un sale état.\n@c3@"
  it: "@a@b*: Quel prete straniero che alloggia alla locanda è sull'orlo dell'esaurimento nervoso.\n@c3@"
  ja: "@a@b＊「宿に泊まっている\n\t旅の神官が\n\t重い病に　倒れたそうだな。\n@c3@"
"19":
  de: "@a@b*: Dem tät 'n bisschen Mutterkrautwurzel gut tun. Wenn man davon was in die Finger kriegen könnte, könnt man 'n Vermögen machen!\n@c3@"
  en: "@a@b*: Wot 'e needs is some feverfew root.\nBlimey, if you could get some o' that an' sell 'it, you'd make a fortune!\n@c3@"
  es: "@a@b*: Lo que necesita es un poco de raíz reducefiebre.\nJo, si %H860%Xpudieras%Ypudierais%Z conseguir un poco y venderla %H860%Xte forrarías%Yos forraríais%Z.\n@c3@"
  fr: "@a@b*ⓢ Ce qu'il lui faut, c'est de la racine de camomille. Sacrebleu, si c'était possible d'en avoir et d'en vendre, il y aurait de quoi faire fortuneⓠ\n@c3@"
  it: "@a@b*: Dice che gli serve una Radice di parthenio.\nSe %H860%Xtu riuscissi%Yriusciste%Z a procurargliene una, %H860%Xpotresti%Ypotreste%Z vendergliela a peso d'oro!\n@c3@"
  ja: "@a@b＊「伝説の薬草　パデキアさえあれば\n\tきっと　治るだろうに……。\n@c3@"
"20":
  de: "@a@b*: Wenn Ihr 'n nettes Zimmer sucht, seid Ihr hier goldrichtig!\n@c2@"
  en: "@a@b*: If you're lookin' for a room, you've come to the right place!\n@c2@"
  es: "@a@b*: Si %H860%Xbuscas%Ybuscáis%Z un sitio donde planchar la oreja, %H860%Xestás%Yestáis%Z en el lugar perfecto.\n@c2@"
  fr: "@a@b*ⓢ Si vous cherchez une chambre, vous êtes au bon endroitⓠ\n@c2@"
  it: "@a@b*: Se %H860%Xcerchi%Ycercate%Z una stanza, %H860%Xsei%Ysiete%Z nel posto giusto!\n@c2@"
  ja: "@a@b＊「いらっしゃいませ！\n\tお泊りは　こちらでどうぞ！\n@c2@"
"21":
  de: "@a@b*: Das beste Zimmer in der Stadt ist noch frei, und es wartet schon auf Euch!\n@c2@"
  en: "@a@b*: The best room in town is vacant tonight, an' it's got your name on it!\n@c2@"
  es: "@a@b*: La mejor habitación de la ciudad está libre esta noche, ¡y tiene %H860%Xtu%Yvuestro%Z nombre!\n@c2@"
  fr: "@a@b*ⓢ La meilleure chambre d'la ville est libre ce soir, et votre nom est déjà dessusⓠ\n@c2@"
  it: "@a@b*: La miglior stanza del villaggio è libera per stanotte... Allora, la %H860%Xvuoi%Yvolete%Z?\n@c2@"
  ja: "@a@b＊「本日は　良いお部屋が\n\tあいていますよ！\n@c2@"
"22":
  de: "@a@b*: Miau.\n@c1@"
  en: "@a@b*: Meow.\n@c1@"
  es: "@a@b*: Miau.\n@c1@"
  fr: "@a@b*ⓢ Miaou.\n@c1@"
  it: "@a@b*: Miao.\n@c1@"
  ja: "@a@b＊「みゃう　みゃう。\n@c1@"
"23":
  de: "@a@b*: Gotthilf Dämler war mal 'n Abenteurer.\n@c2@"
  en: "@a@b*: Conrad 'Ilton used to be an adventurer back in 'is day.\n@c2@"
  es: "@a@b*: Conrad Gilton era todo un aventurero de joven y tal.\n@c2@"
  fr: "@a@b*ⓢ Conrad Ilton était un aventurier, dans sa jeunesse.\n@c2@"
  it: "@a@b*: In passato, Jolly Etchelsior è stato un avventuriero.\n@c2@"
  ja: "@a@b＊「ヒルタン老人は　若い頃\n\t冒険家だったそうです。\n@c2@"
"24":
  de: "@a@b*: Er hat Schätze gesammelt und verkauft und damit ein Vermögen gemacht. Ich schätze, er ist der beste Geschäftsmann der ganzen Welt.\n@c2@"
  en: "@a@b*: He collected all sorts o' treasures, an' then made a fortune by sellin' 'em off. He's the best businessman in the world, I reckon.\n@c2@"
  es: "@a@b*: Conseguía todo tipo de tesoros y se volvió rico revendiéndolos. Es el mejor mercader del mundo mundial.\n@c2@"
  fr: "@a@b*ⓢ Il a amassé toutes sortes de trésors et a ensuite fait fortune en les revendant. Croyez-moi, c'est le meilleur homme d'affaires du monde.\n@c2@"
  it: "@a@b*: Raccoglieva tesori di ogni tipo, e ha costruito la sua fortuna rivendendoli a caro prezzo. Non c'è dubbio che sia il miglior affarista del mondo.\n@c2@"
  ja: "@a@b＊「いろんな宝物を　手に入れて\n\tそれを元手に商売をして\n\t大成功を　おさめたとか。\n@c2@"
"25":
  de: "@a@b*: Ha-püh...\n@c3@"
  en: "@a@b*: Ah-phew...\n@c3@"
  es: "@a@b*: Ah, fiuu...\n@c3@"
  fr: "@a@b*ⓢ Ron-pfff...\n@c3@"
  it: "@a@b*: Ronf...\n@c3@"
  ja: "@a@b＊「ぐごー　ぐごー。\n@c3@"
"26":
  de: "@aHank Hoffman Jr.@bHowdy, %a00140!\n@c2@"
  en: "@aHank Hoffman Jr.@bHowdy there, %a00140!\n@c2@"
  es: "@aJuanchito@b¡Holita, %a00140!\n@c2@"
  fr: "@aHank Hoffman Jr@bSalut, %a00140ⓠ\n@c2@"
  it: "@aJohn Dwayne Jr.@bSalve, %a00140!\n@c2@"
  ja: "@a@bホフマン「あっ　%a00140さん！\n@c2@"
"27":
  de: "@aHank Hoffman Jr.@bIch habe schon jede Menge nützlichen Kram von Gotthilf Dämler da drüben gelernt. Er ist wirklich ein cleverer Kerl.\n@c2@"
  en: "@aHank Hoffman Jr.@bI've already been learnin' heaps of stuff from ol' Conrad Ilton over there. He's dreadful clever.\n@c2@"
  es: "@aJuanchito@bPues ahora mismito vengo de aprender montones de cosas sobre Conrad Gilton. Es increíblemente listo.\n@c2@"
  fr: "@aHank Hoffman Jr@bJ'ai déjà appris des tas de trucs de Conrad Ilton.\nC'est un sacré malin.\n@c2@"
  it: "@aJohn Dwayne Jr.@bHo già imparato una vagonata di cose da Jolly Etchelsior. È in gambissima. Un vero pozzo di scienza... monetaria!\n@c2@"
  ja: "@a@bホフマン「さっそく　ヒルタン老人に\n\t商売の　ひけつを\n\t教えてもらっているところです。\n@c2@"
"28":
  de: "@aHank Hoffman Jr.@bEr sagt, bei Geschäften geht's nicht nur um Geld allein, sondern auch darum, dass alle zufrieden sind. Das klingt doch gut, oder?\n@c2@"
  en: "@aHank Hoffman Jr.@bHe says business ain't just about money, it's about puttin' a smile on folk's faces, too.\nNow ain't that nice?\n@c2@"
  es: "@aJuanchito@bDice que los negocios no solo son cosa de plata, sino de poner una sonrisa en la cara de la gente.\n¿No es bien chulo?\n@c2@"
  fr: "@aHank Hoffman Jr@bIl dit que les affaires, c'est pas qu'une question d'argent, mais que le but, c'est aussi d'mettre un sourire sur l'visage des gens. C'est pas gentil, çaⓡ\n@c2@"
  it: "@aJohn Dwayne Jr.@bDice che negli affari non conta solo incassare quattrini, ma anche far sorridere i propri clienti.\nMai sentita una cosa più vera, eh?\n@c2@"
  ja: "@a@bホフマン「さーてと。\n\tふむふむ　商売は金のためではなく\n\tお客さんの笑顔のために……と。\n@c2@"
"29":
  de: "@aGotthilf Dämler@bWas? Ob i der Kerle bin, der wo elles übers Meer weiß?\n@c2@"
  en: "@aConrad 'Ilton@bY'wot? You wanna ask if I'm the geezer who knows a lot about the ocean?\n@c2@"
  es: "@aConrad Gilton@b¿Qué %H860%Xquieres%Yqueréis%Z? ¿%H860%XQuieres%YQueréis%Z saber si soy el vejete que lo sabe todo del océano?\n@c2@"
  fr: "@aConrad Ilton@bQuoiⓡ Vous voulez savoir si c'est moi le type qui sait plein de choses sur l'océanⓡ\n@c2@"
