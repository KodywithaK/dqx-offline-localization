"99":
  de: "@a@b*: Ich hab den ganzen Tag gegrinst wie ein Honigkuchenpferd, und irgendwann macht der Körper das einfach nicht mehr mit!\n@c2@"
  en: "@a@b*: I've been done smilin' all day long an' now my body's really kickin' up a row.\n@c2@"
  es: "@a@b*: He estado sonriendo todo el día y ahora me duele hasta la punta del pelo.\n@c2@"
  fr: "@a@b*ⓢ J'ai pas arrêté d'sourire de toute la journée, et maintenant, mon corps arrête pas d'faire du raffut.\n@c2@"
  it: "@a@b*: È tutto il giorno che sorrido... Temo che tra poco mi verrà una paresi facciale!\n@c2@"
  ja: "@a@b＊「ううっ　ずっと笑顔で\n\tいたもんだから\n\t顔が　ひきつっちゃって。\n@c2@"
"100":
  de: "@a@b*: Die wichtigste Geschäftsregel lautet, unter allen Umständen ein freundliches Gesicht zu zeigen. Aber das kann ganz schön hart sein!\n@c2@"
  en: "@a@b*: The most important rule o' business is keepin' a smile on your face by hook or by crook. But it sure ain't easy.\n@c2@"
  es: "@a@b*: Lo más importante a la hora de hacer negocios es tener siempre una sonrisa, ya sea verdadera o pintada, ¿vale? Pero, claro, no es tan fácil, %H860%Xcolega%Ycolegas%Z.\n@c2@"
  fr: "@a@b*ⓢ La règle la plus importante du métier, c'est de toujours avoir le sourire, heureux ou malheureux. Eh ben c'est pas facile.\n@c2@"
  it: "@a@b*: La regola più importante negli affari è sorridere sempre, che lo si voglia o meno... Ma non è mica una cosa facile!\n@c2@"
  ja: "@a@b＊「客商売の　基本は\n\t明るい笑顔から！\n\t……とはいえ　ツラいなあー。\n@c2@"
"101":
  de: "@a@b*: Ich hab schon überlegt, ob ich nicht bei Gotthilf Dämler in die Lehre gehen soll.\n@c2@"
  en: "@a@b*: I've been thinkin' to meself about becomin' one of 'Ilton's apprentices, like.\n@c2@"
  es: "@a@b*: He estado pensando en convertirme en uno de los aprendices de Gilton.\n@c2@"
  fr: "@a@b*ⓢ J'hésite à devenir l'un des apprentis d'Ilton.\n@c2@"
  it: "@a@b*: Sto riflettendo sulla possibilità di diventare uno degli apprendisti di Jolly Etchelsior.\n@c2@"
  ja: "@a@b＊「わたしも　ヒルタン老人に\n\t弟子入りしようと思って\n\tはるばる　来ましたが……。\n@c2@"
"102":
  de: "@a@b*: Aber ich weiß nicht. Für den zu arbeiten ist bestimmt kein Zuckerschlecken. Vielleicht bin ich nicht der Typ dafür.\n@c2@"
  en: "@a@b*: I dunno, though.\nIt looks like bleedin' 'ard work.\nMaybe I ain't cut out for it.\n@c2@"
  es: "@a@b*: Pero, no sé.\nParece que se trabaja duro.\nQuizás no dé la talla.\n@c2@"
  fr: "@a@b*ⓢ Mais bon, j'suis pas sûr.\nÇa a l'air d'être un boulot sacrément crevant.\nJe suis peut-être pas fait pour ça.\n@c2@"
  it: "@a@b*: Non ho ancora deciso, però.\nMi sembra un lavoro davvero molto impegnativo.\nForse non sono tagliato per quel genere di cose...\n@c2@"
  ja: "@a@b＊「うーん　商人の修行は\n\tきびしい　みたいだし。\n\tどうしようかなあー？\n@c2@"
