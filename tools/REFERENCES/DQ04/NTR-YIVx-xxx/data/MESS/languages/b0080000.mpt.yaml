"49":
  de: "@a@b*: Mein Vater ist ein Händler, nicht wahr. Darum bin ich hier, um ein bisschen was übers Geschäft zu lernen.\n@c1@"
  en: "@a@b*: My father's a trader, don't you know.\nThat's why I'm here, trying to learn a bit about business.\n@c1@"
  es: "@a@b*: Mi padre es mercader, ¿%H860%Xsabe%Ysaben%Z?\nPor eso mismo estoy aquí, para aprender un poco sobre los negocios.\n@c1@"
  fr: "@a@b*ⓢ Mon père est commerçant, vous savez. C'est pour ça que je suis ici. Pour apprendre une chose ou deux sur les affaires.\n@c1@"
  it: "@a@b*: Mio padre è un commerciante.\nEcco perché sono qui: voglio imparare come si fanno gli affari!\n@c1@"
  ja: "@a@b＊「わたしも　商人の娘。\n\t商売の勉強を　しないとね。\n@c1@"
"50":
  de: "@a@b*: Aber was der Mann neben mir hier will ⓚⓛ keine Ahnung! Herr Dämler würde ihn wahrscheinlich 'nen Dünnbrettbohrer nennen. Hi hi hi!\n@c1@"
  en: "@a@b*: It's hard to imagine what the man next to me is gaining from all this, mind you. No doubt Mr. Ilton would call him a lightweight! Tee hee hee!\n@c1@"
  es: "@a@b*: Cuesta imaginar lo que ganará con todo esto el tipo que hay junto a mí. ¡Seguro que el Sr. Gilton le llamará pardillo! ¡Ji, ji, ji!\n@c1@"
  fr: "@a@b*ⓢ Difficile d'imaginer ce que mon voisin retiendra de tout ça. Sûrement que Monsieur Ilton le traiterait de petit rigoloⓠ Hi hi hiⓠ\n@c1@"
  it: "@a@b*: Il tizio accanto a me non sembra molto sveglio... Anzi, secondo me è un po' tonto. Jolly Etchelsior lo chiamerebbe sicuramente un ⓕpeso piumaⓖ! Eh! Eh! Eh!\n@c1@"
  ja: "@a@b＊「でも　となりの人は　いったい\n\tなにを　しにきてるのかしら！\n@c1@"
