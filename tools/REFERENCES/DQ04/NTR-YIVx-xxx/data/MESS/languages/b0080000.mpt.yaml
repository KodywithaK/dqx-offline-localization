"95":
  de: "@a@b*: Ich bin fix und fertig! Tut gut, endlich mal die Hufe hängen zu lassen. Auf Kundenfang zu gehen ist nicht so einfach.\n@c2@"
  en: "@a@b*: I'm beat! It's mighty fine to be able to cool off my heels at long last. Drummin' up business ain't as easy as it looks.\n@c2@"
  es: "@a@b*: ¡Estoy tan casando! Es fantástico poder dejar descansar mis pobres pies nomás. Llevar los negocios no es tan sencillo como parece.\n@c2@"
  fr: "@a@b*ⓢ J'suis crevéⓠ Ça fait drôlement du bien d'pouvoir se poser un peu. Mener des affaires, c'est pas aussi facile que ça en a l'air.\n@c2@"
  it: "@a@b*: Sono a pezzi... Finalmente posso riposarmi un po'! Fare affari non è certo la cosa più rilassante del mondo...\n@c2@"
  ja: "@a@b＊「あー　つかれたっ。\n\tようやく　ひといき　つけるぜ。\n\t商人の修行も　ラクじゃないよ。\n@c2@"
"96":
  de: "@a@b*: Dieser neue Lehrling, Hank Hoffman Junior, strengt sich an wie 'n Stier beim Rodeo.\n@c2@"
  en: "@a@b*: That new apprentice, Hank Hoffman Junior, sure works real hard.\n@c2@"
  es: "@a@b*: Ese nuevo aprendiz, Juanchito, se lo curra mucho.\n@c2@"
  fr: "@a@b*ⓢ Ce nouvel apprenti, Hank Hoffman Junior, il bosse sacrément dur.\n@c2@"
  it: "@a@b*: Quel nuovo apprendista, John Dwayne Jr., è proprio un gran lavoratore.\n@c2@"
  ja: "@a@b＊「新しく　弟子入りした\n\tホフマンってやつ\n\tよく　働くよなあ。\n@c2@"
"97":
  de: "@a@b*: Selbst nach einem harten Tag fragt der den Gotthilf Dämler noch aus.\n@c2@"
  en: "@a@b*: He goes pickin' Ilton's brains even after he's done a hard day's work.\n@c2@"
  es: "@a@b*: Anda dando vueltas a las ideas de Gilton incluso después de un duro día de trabajo.\n@c2@"
  fr: "@a@b*ⓢ Il continue à étudier des idées de Ilton même après avoir fini une rude journée de travail.\n@c2@"
  it: "@a@b*: Dopo aver trascorso un'intera giornata a faticare, trova persino il tempo di andare a far domande a Jolly Etchelsior!\n@c2@"
  ja: "@a@b＊「仕事の後も　ヒルタン老人に\n\tいろいろ話を聞いてる\n\tみたいだぜ。\n@c2@"
