  ja: "@a@b＊「そこの高台で　講義をしている\n\tヒルタン老人のことですよ。\n@c2@"
"54":
  de: "@a@b*: Mittlerweile ist Mintos ziemlich groß, aber bevor Gotthilf Dämler hierher kam, war hier gar nichts los.\n@c1@"
  en: "@a@b*: Mintos may be a big place now, but it was nothing before Conrad Ilton came along.\n@c1@"
