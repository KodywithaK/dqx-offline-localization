"0":
  de: "@a@b%0%a00120 untersucht das Schwert, das vor %A120%Xihm%Z%B120%Xihr%Z im Boden steckt.\n@c0@"
  en: "@a@b%0%a00120 examines the sword stuck in the ground at %A120%Xhis%Z%B120%Xher%Z feet.\n@c0@"
  es: "@a@b%0%a00120 examina la espada clavada en el suelo a sus pies.\n@c0@"
  fr: "@a@b%0%a00120 examine l'épée plantée dans le sol devant %A120%Xlui%Z%B120%Xelle%Z.\n@c0@"
  it: "@a@b%0%a00120 esamina la spada conficcata nel terreno ai suoi piedi.\n@c0@"
  ja: "@a@b%a00120は　地面に\nつき立てられた剣を　調べた！\n@c0@"
"1":
  de: "@a@b%0%a00180 erhält das Zenithiaschwert.\n@c0@"
  en: "@a@b%0%a00180 obtains the Zenithian Sword.\n@c0@"
  es: "@a@b%0%a00180 obtiene la Espada de Zenithia.\n@c0@"
  fr: "@a@b%0%a00180 obtient l'Épée zénithienne.\n@c0@"
  it: "@a@b%0%a00180 ottiene la Spada Zenithiana.\n@c0@"
  ja: "@a@b%a00180は\nてんくうのつるぎを　手に入れた。\n@c0@"
"2":
  de: "@aOrifiela@bDas ist tatsächlich das Zenithiaschwert!\nIch danke Euch, %a00140.\n@c1@"
  en: "@aOrifiela@bIndeed, that is the Zenithian Sword!\nThank you, %a00140.\n@c1@"
  es: "@aOrifiela@b¡Es la auténtica Espada de Zenithia!\nGracias, %a00140.\n@c1@"
  fr: "@aOrifiela@bIl s'agit bien de l'Épée zénithienneⓠ\nMerci beaucoup, %a00140.\n@c1@"
  it: "@aOrifiela@bSì, si tratta proprio della Spada Zenithiana! Ti ringrazio, %a00140.\n@c1@"
  ja: "@a@bルーシア「それは　まさしく\n\t天空のつるぎ！　%a00140さん\n\tありがとうございます。\n@c1@"
"3":
  de: "@aOrifiela@bNun sind wir bereit für den Aufstieg nach Zenithia.\n@c1@"
  en: "@aOrifiela@bNow we are ready for the ascent to Zenithia.\n@c1@"
  es: "@aOrifiela@bAhora estamos listos para subir a Zenithia.\n@c1@"
  fr: "@aOrifiela@bNous pouvons désormais commencer notre ascension vers Zénithia.\n@c1@"
  it: "@aOrifiela@bOra siamo pronti per l'ascesa verso Zenithia.\n@c1@"
  ja: "@a@bルーシア「これで　わたしも\n\t天空のお城に　帰れますわ。\n@c1@"
"4":
  de: "@aOrifiela@bDoch mein gebrochener Flügel ist mir eine schwere Last. Ich kann nicht fliegen.\n@c1@"
  en: "@aOrifiela@bBut my broken wing doth encumber me.\nI cannot fly.\n@c1@"
  es: "@aOrifiela@bPero mi ala rota me lo impide.\nMe es imposible volar.\n@c1@"
  fr: "@aOrifiela@bMais mon aile brisée me gêne.\nJe ne peux plus voler.\n@c1@"
  it: "@aOrifiela@bMa ho un'ala rotta, e non posso volare.\n@c1@"
  ja: "@a@bルーシア「しかし　羽を折られていて\n\t空を飛ぶことが　できません。\n@c1@"
"5":
  de: "@aOrifiela@bSeid Ihr gewillt, mich sicher nach Zenithia zu geleiten?\n@c1@"
  en: "@aOrifiela@bWilt thou deliver me to Zenithia?\n@c1@"
  es: "@aOrifiela@b¿Me %H860%Xllevará%Yllevarán%Z a Zenithia?\n@c1@"
  fr: "@aOrifiela@bMe porterez-vous jusqu'à Zénithiaⓡ\n@c1@"
  it: "@aOrifiela@bPosso %H860%Xchiederti%Ychiedervi%Z la cortesia di portarmi fino a Zenithia?\n@c1@"
  ja: "@a@bルーシア「どうか　わたしを\n\t天空のお城まで　\n\t連れていっていただけませんか？\n@c1@"
"6":
  de: "@aOrifiela@bTief in meinem Innern wusste ich, dass Eure Antwort derart ausfallen würde. Ich danke Euch, %a00140.\n@c1@"
  en: "@aOrifiela@bIt was always my belief that you would answer me so. Thank you, %a00140.\n@c1@"
  es: "@aOrifiela@bSiempre supe que esa sería la respuesta. Gracias, %a00140.\n@c1@"
  fr: "@aOrifiela@bJ'étais convaincue que vous accepteriez.\nMerci beaucoup, %a00140.\n@c1@"
  it: "@aOrifiela@bSperavo proprio che la risposta fosse questa. Grazie, %a00140.\n@c1@"
  ja: "@a@bルーシア「そう言ってくださると\n\t信じていました！\n\tありがとう　%a00140さん。\n@c1@"
"7":
  de: "@aOrifiela@bDie Treppe nach Zenithia ist nun unser Ziel. Nur dort kann man hinaufsteigen.\n@c1@"
  en: "@aOrifiela@bThe Stairway to Zenithia must be our destination. From thence alone may one ascend.\n@c1@"
  es: "@aOrifiela@bLa Escalera a Zenithia debe ser nuestro destino. Solo ella permite el ascenso.\n@c1@"
  fr: "@aOrifiela@bNous devons nous rendre aux Marches de Zénithia.\nC'est le seul et unique chemin qui mène à Zénithia.\n@c1@"
  it: "@aOrifiela@bLa nostra destinazione è la Scala per Zenithia. Solo da quel luogo è possibile salire fino al cielo.\n@c1@"
  ja: "@a@bルーシア「天空のお城へは\n\t天空への塔から　行けるはずです。\n@c1@"
"8":
  de: "@aOrifiela@bUm die Treppe erklimmen zu können, müsst Ihr im Besitz der gesamten Zenithia-Ausrüstung sein.\n@c1@"
  en: "@aOrifiela@bAnd for to take the Stairway, thou must have in thy possession all of the Zenithian Equipment.\n@c1@"
  es: "@aOrifiela@bY para tomar la Escalera a Zenithia, %H860%Xdebe%Ydeben%Z estar en posesión de todo el Equipo de Zenithia.\n@c1@"
  fr: "@aOrifiela@bPour emprunter ces Marches, vous devez disposer de l'Équipement zénithien complet.\n@c1@"
  it: "@aOrifiela@bPer salire la Scala, è necessario essere in possesso di tutto l'Equipaggiamento Zenithiano.\n@c1@"
  ja: "@a@bルーシア「そして　天空への塔に　入るには\n\tすべての　天空の武器　防具を\n\t手に入れなければならないとか。\n@c1@"
"9":
  de: "@aOrifiela@bLasst uns nun aufbrechen!\n@c1@"
  en: "@aOrifiela@bLet us be gone!\n@c1@"
  es: "@aOrifiela@b¡Pongámonos en marcha!\n@c1@"
  fr: "@aOrifiela@bAllons-yⓠ\n@c1@"
  it: "@aOrifiela@bE ora andiamo!\n@c1@"
  ja: "@a@bルーシア「さあ　まいりましょう！\n@c1@"
"10":
  de: "@aOrifiela@bAber, %a00140. Außer Euch habe ich doch niemanden, dem ich mein Vertrauen schenken kann.\n@c1@"
  en: "@aOrifiela@bBut, %a00140. I have you alone to rely on.\n@c1@"
  es: "@aOrifiela@bPero, %a00140, no puedo confiar en nadie más.\n@c1@"
  fr: "@aOrifiela@bMais %a00140, il n'y a que vous sur qui je puisse compter.\n@c1@"
  it: "@aOrifiela@b%0%a00140, sei la mia unica speranza.\n@c1@"
  ja: "@a@bルーシア「そんな　ひどい！\n\t%a00140さん　お願いです。\n@c1@"
"11":
  de: "@a@b%0%a00120 prüft den Boden zu %A120%Xseinen%Z%B120%Xihren%Z Füßen.\n@c0@"
  en: "@a@b%0%a00120 examines the ground at %A120%Xhis%Z%B120%Xher%Z feet.\n@c0@"
  es: "@a@b%0%a00120 examina el suelo alrededor de sus pies.\n@c0@"
  fr: "@a@b%0%a00120 examine le sol devant %A120%Xlui%Z%B120%Xelle%Z.\n@c0@"
  it: "@a@b%0%a00120 esamina il terreno ai suoi piedi...\n@c0@"
  ja: "@a@b%a00120は　足もとを　調べた！\n@c0@"
"12":
  de: "@a@b%A120%XEr%Z%B120%XSie%Z findet ein Yggdrasil-Blatt!\n@c0@"
  en: "@a@b%A120%XHe%Z%B120%XShe%Z finds an Yggdrasil leaf!\n@c0@"
  es: "@a@bEncuentra una hoja de Yggdrasil.\n@c0@"
  fr: "@a@b%A120%XIl%Z%B120%XElle%Z trouve une feuille d'Yggdrasilⓠ\n@c0@"
  it: "@a@b%0%a00180 trova una foglia di Ygdrasil!\n@c0@"
  ja: "@a@bなんと　せかいじゅの葉を　みつけた！\n@c0@"
"13":
  de: "@a@b%0%a00180 erhält das Yggdrasil-Blatt.\n@c0@"
  en: "@a@b%0%a00180 acquires the Yggdrasil leaf.\n@c0@"
  es: "@a@b%0%a00180 se hace con la hoja de Yggdrasil.\n@c0@"
  fr: "@a@b%0%a00180 obtient la feuille d'Yggdrasil.\n@c0@"
  it: "@a@b%0%a00180 ottiene la foglia di Ygdrasil.\n@c0@"
  ja: "@a@b%a00180は\nせかいじゅの葉を　手に入れた。\n@c0@"
"14":
  de: "@a@b%0%a00120 prüft den Boden zu %A120%Xseinen%Z%B120%Xihren%Z Füßen.\n@c0@"
  en: "@a@b%0%a00120 examines the ground at %A120%Xhis%Z%B120%Xher%Z feet.\n@c0@"
  es: "@a@b%0%a00120 examina el suelo alrededor de sus pies.\n@c0@"
  fr: "@a@b%0%a00120 examine le sol devant %A120%Xlui%Z%B120%Xelle%Z.\n@c0@"
  it: "@a@b%0%a00120 esamina il terreno ai suoi piedi...\n@c0@"
  ja: "@a@b%a00120は　足もとを　調べた！\n@c0@"
"15":
  de: "@a@b%A120%XEr%Z%B120%XSie%Z findet ein Yggdrasil-Blatt!\n@c0@"
  en: "@a@b%A120%XHe%Z%B120%XShe%Z finds an Yggdrasil leaf!\n@c0@"
  es: "@a@bEncuentra una hoja de Yggdrasil.\n@c0@"
  fr: "@a@b%A120%XIl%Z%B120%XElle%Z trouve une feuille d'Yggdrasilⓠ\n@c0@"
  it: "@a@b%0%a00180 vede una foglia di Ygdrasil!\n@c0@"
  ja: "@a@bなんと　せかいじゅの葉を　みつけた！\n@c0@"
"16":
  de: "@a@bAber %A120%Xer%Z%B120%Xsie%Z kann kein Blatt mehr aufheben.\n@c0@"
  en: "@a@bThe floor is covered with Yggdrasil leaves, but the party can only carry one at a time!\n@c0@"
  es: "@a@bPero no puede recoger ninguna hoja.\n@c0@"
  fr: "@a@bMais il n'est possible de transporter qu'une seule feuille à la fois.\n@c0@"
  it: "@a@bMa non può raccogliere altre foglie, perché può portarne una sola per volta.\n@c0@"
  ja: "@a@bしかし　せかいじゅの葉は　ぬけなかった！\n@c0@"
"17":
  de: "@a@b*: Na, sieh einer an... %H860%XEin Mensch%YMenschen%Z! Es ist schon eine Weile her, dass Menschen hier waren.\n@c1@"
  en: "@a@b*: Well, well, well... %H860%XA human%YHumans%Z!\nItⓙs been a long time since any humans came here.\n@c1@"
  es: "@a@b*: Vaya, vaya, vaya... ¡%H860%X%A120%XUn humano%Z%B120%XUna humana%Z%YHumanos%Z!\nHace mucho tiempo que no viene ningún humano por aquí.\n@c1@"
  fr: "@a@b*ⓢ Tiens, tiens, tiens... %H860%Xun être humain%Ydes humains%Zⓠ\nCela fait bien longtemps que je n'avais pas vu un représentant de votre race.\n@c1@"
  it: "@a@b*: Bene, bene... %H860%XUn umano%YDegli umani%Z!\nEra da tanto tempo che non si vedevano esseri umani da queste parti.\n@c1@"
  ja: "@a@b＊「あら　この村に\n\t人間がやってくるなんて\n\tめずらしいわね。\n@c1@"
"18":
  de: "@a@b*: Willkommen in El Forado.\n@c1@"
  en: "@a@b*: Welcome to El Forado.\n@c1@"
  es: "@a@b*: %H860%X%A120%XBienvenido%Z%B120%XBienvenida%Z%Y%R000%XBienvenidas%YBienvenidos%Z%Z a El Forrado.\n@c1@"
  fr: "@a@b*ⓢ Bienvenue à El Forado.\n@c1@"
  it: "@a@b*: %H860%X%A120%XBenvenuto%Z%B120%XBenvenuta%Z%Y%R000%XBenvenute%YBenvenuti%Z%Z a El Forado.\n@c1@"
  ja: "@a@b＊「ここは　エルフの里よ。\n@c1@"
"19":
  de: "@a@b*: Grrr-rff! Der große Baum hier ist der Weltenbaum Yggdrasil.\n@c2@"
  en: "@a@b*: Grrr-ruff! The big tree here is the Great World Tree, Yggdrasil.\n@c2@"
  es: "@a@b*: ¡Grrr-ruff! El árbol grande es el Gran Árbol del Mundo, Yggdrasil.\n@c2@"
  fr: "@a@b*ⓢ Grrr ououffⓠ Cet arbre gigantesque est l'Yggdrasil, le Grand arbre du Monde.\n@c2@"
  it: "@a@b*: Grrr-ruff! Questo è Ygdrasil, il Grande Albero del mondo.\n@c2@"
  ja: "@a@b＊「こんこん。\n\tこの村にある　大木は\n\t世界樹だよ。\n@c2@"
"20":
  de: "@a@b*: Miau...\nYggdrasil spendet genug Schatten für alle. Genau richtig für ein kleines Nickerchen...\n@c1@"
  en: "@a@b*: Meow...\nYggdrasil gives enough shade for everyone.\nJust right for catnapping...\n@c1@"
  es: "@a@b*: Miau...\nYggdrasil proporciona cobijo a todo el mundo.\nPerrrfecto para una siesta gatuna...\n@c1@"
  fr: "@a@b*ⓢ Miaouu...\n㈡\n*ⓢ L'Yggdrasil fait suffisamment d'ombre pour que tout le monde en profite... pour faire une sieste, par exemple...\n@c1@"
  it: "@a@b*: Miao...\nYgdrasil è abbastanza grande da far ombra a tutti.\nÈ l'ideale purrr schiacciare un pisolino...\n@c1@"
  ja: "@a@b＊「にゃーん。\n\t世界樹の木かげは\n\tすずしくて　きもちいいニャー。\n@c1@"
"21":
  de: "@a@b*: Diese Monster heutzutage!\nSie belästigen sogar schon Yggdrasil. Nein, nirgendwo kann man mehr sicher sein...\n@c3@"
  en: "@a@b*: The monsters of today!\nTheyⓙre even infesting Yggdrasil these days.\nNope. Nowhereⓙs safe any more...\n@c3@"
  es: "@a@b*: ¡Los monstruos de hoy!\nEn estos días incluso infestan Yggdrasil.\nNo. Ya no hay ningún lugar seguro...\n@c3@"
  fr: "@a@b*ⓢ Ah les monstres d'aujourd'huiⓠ\nIls envahissent même l'Yggdrasil.\nVraiment, il n'y a plus d'endroit sûr de nos jours...\n@c3@"
  it: "@a@b*: Ah, questi mostri di oggi!\nInfestano persino Ygdrasil ultimamente. Non c'è niente da fare, non si sta tranquilli da nessuna parte...\n@c3@"
  ja: "@a@b＊「近ごろ　世界樹にも\n\t魔物たちが　住みつきだしてのう。\n\tぶっそうな世の中じゃわい……。\n@c3@"
"22":
  de: "@a@b*: Die Krone von Yggdrasil besteht aus dichtem Blattwerk. Und bei diesen Blättern handelt es sich um... Yggdrasil-Blätter.\n@c1@"
  en: "@a@b*: The top of Yggdrasil is thick with leaves. Yggdrasil leaves.\n@c1@"
  es: "@a@b*: La copa de Yggdrasil está repleta de hojas, hojas de Yggdrasil.\n@c1@"
  fr: "@a@b*ⓢ La cime de l'Yggdrasil est pleine de feuilles... des feuilles d'Yggdrasil.\n@c1@"
  it: "@a@b*: La cima di Ygdrasil è piena di foglie. Foglie di Ygdrasil, ovviamente.\n@c1@"
  ja: "@a@b＊「この樹の上には　多くの\n\t世界樹の葉が　しげっています。\n@c1@"
"23":
  de: "@a@b*: Sie sind wirklich sehr nützlich, man sollte immer welche bei sich tragen.\n@c1@"
  en: "@a@b*: Theyⓙre very useful to have on you.\nVery, very useful indeed.\n@c1@"
  es: "@a@b*: Es muy útil llevarlas.\nExtremadamente útil.\n@c1@"
  fr: "@a@b*ⓢ Elles peuvent être très utiles.\nTrès très utiles, même.\n@c1@"
  it: "@a@b*: Sono delle foglie utili.\nAnzi, utilissime.\n@c1@"
  ja: "@a@b＊「世界樹の葉を　持っていれば\n\tきっと　役に立つことでしょう。\n@c1@"
"24":
  de: "@a@b*: Die Stimme, die aus der Baumkrone zu mir drang, ist nun verklungen.\n@c1@"
  en: "@a@b*: The voice I could hear from the treetopⓙs gone away now.\n@c1@"
  es: "@a@b*: La voz que podía escuchar en la copa del árbol ya se ha desvanecido.\n@c1@"
  fr: "@a@b*ⓢ La voix qui venait de la cime des arbres a disparu.\n@c1@"
  it: "@a@b*: Non sento più la voce che proveniva dalla cima dell'albero...\n@c1@"
  ja: "@a@b＊「上から　もう\n\t声がしなくなったみたい……。\n@c1@"
"25":
  de: "@a@b*: Ihr habt demjenigen geholfen, der in Not war, ja? Ah, das ist gut!\n@c1@"
  en: "@a@b*: Oh, you helped whoever it was, did you?\nWhat good news!\n@c1@"
  es: "@a@b*: ¡Oh!, sea lo que fuere, le %H860%Xha%Yhan%Z ayudado, ¿verdad?\n¡Eso sí que es una buena noticia!\n@c1@"
  fr: "@a@b*ⓢ Oh, vous avez aidé celui ou celle qui se trouvait là-haut, c'est çaⓡ\nC'est une bonne nouvelleⓠ\n@c1@"
  it: "@a@b*: Oh, %H860%Xhai aiutato tu%Yavete aiutato voi%Z la persona che era lassù? Questa sì che è una bella notizia!\n@c1@"
  ja: "@a@b＊「あら　あなたたちが\n\t助けてあげたのね？\n\t良かったわ。\n@c1@"
"26":
  de: "@a@b*: Seiet voller Ehrfurcht angesichts des irdischen Gartens der Göttin, %H860%X%A120%XReisender%Z%B120%XReisende%Z%YReisende%Z! Dies ist der Azimuth, das Tor nach Zenithia!\n@c2@"
  en: "@a@b*: Behold, %H860%Xtraveller%Yye travellers%Z of the Goddess's earthly garden! Stand humbled at the Azimuth, gateway to Zenithia!\n@c2@"
  es: "@a@b*: ¡%H860%X%A120%XContempla, viajero%Z%B120%XContempla, viajera%Z%YContemplad, %R000%Xviajeras%Yviajeros%Z%Z, el jardín terrenal de la Diosa! ¡%H860%XPermanece humilde%YPermaneced humildes%Z en El Azimut, la puerta a Zenithia!\n@c2@"
  fr: "@a@b*ⓢ Ouvrez grands vos yeux, %H860%X%A120%Xvoyageur%Z%B120%Xvoyageuse%Z%Y%R000%Xvoyageuses%Yvoyageurs%Z%Z qui venez du jardin terrestre de la Déesseⓠ Faites preuve d'humilité devant l'Azimut, le passage vers Zénithiaⓠ\n@c2@"
  it: "@a@b*: %H860%XTi saluto, pecorella%YVi saluto, pecorelle%Z del gregge terrestre della dea! %H860%XProstrati%YProstratevi%Z dinnanzi all'Azimut, la via d'accesso per Zenithia!\n@c2@"
  ja: "@a@b＊「ここは　天空にいちばん近い町\n\tゴットサイド。\n@c2@"
"27":
  de: "@a@b*: Unternehmt Ihr eine Pilgerreise zum göttlichen Himmel?\n@c2@"
  en: "@a@b*: Have you come here on a pilgrimage to the divine sky?\n@c2@"
  es: "@a@b*: ¿%H860%XViene%YVienen%Z en peregrinaje a los cielos divinos?\n@c2@"
  fr: "@a@b*ⓢ Êtes-vous là en pèlerinage vers le ciel divinⓡ\n@c2@"
  it: "@a@b*: %H860%XSei%YSiete%Z qui per compiere il pellegrinaggio verso il cielo?\n@c2@"
  ja: "@a@b＊「旅する者よ　なんじは\n\t天空を目指すのか？\n\tそれとも……。\n@c2@"
"28":
  de: "@a@b*: Seid gegrüßt, %H860%X%A120%XFremder%Z%B120%XFremde%Z%YFremde%Z. Hoffnung und Verzweiflung, Leben und Tod. Die Göttin gibt und die Göttin nimmt!\n@c2@"
  en: "@a@b*: Greetings and farewells. Hope and despair. Life and death. The Goddess giveth and the Goddess taketh away!\n@c2@"
  es: "@a@b*: Saludos y despedidas. Esperanza y desesperación. Vida y muerte. ¡La Diosa las da y la Diosa las quita!\n@c2@"
  fr: "@a@b*ⓢ Salutations et adieux. Espoir et désespoir. Vie et mort. La Déesse donne et la Déesse reprendⓠ\n@c2@"
  it: "@a@b*: Benvenuti e addii... Speranza e disperazione... Vita e morte... La dea elargisce e la dea sottrae!\n@c2@"
  ja: "@a@b＊「出会いと別れ。\n\t生と死。　絶望と希望。\n\tすべては神の導き。\n@c2@"
"29":
  de: "@a@b*: Seid demütig und dankbar, Schafe des Allmächtigen Hirten, denn die Göttin hält Ihre schützende Hand über Euch!\n@c2@"
  en: "@a@b*: Tread boldly, sheep of the Almighty Guardian, for thou art watched and thou shalt be provided for!\n@c2@"
  es: "@a@b*: ¡Camina con paso firme, oveja de la Guardiana todopoderosa, porque Ella te observa y te proveerá con todo lo necesario!\n@c2@"
  fr: "@a@b*ⓢ Avancez d'un pas léger, brebis de la Toute-puissante Gardienne, car elle veille sur vous et elle vous donnera ce dont vous avez besoinⓠ\n@c2@"
  it: "@a@b*: Avanza senza timore, pecorella della guardiana onnipotente. La protezione divina è già su di te, e le tue preghiere verranno esaudite!\n@c2@"
  ja: "@a@b＊「恐れずに　進みなさい。\n\t神はいつでも\n\tあなたを見つめているのです。\n@c2@"
"30":
  de: "@a@b*: Nehmt Euch in Acht vor Trauer und Sorge. Denn jene mit schwerem Herzen beflügeln das Böse.\n@c1@"
  en: "@a@b*: Beware the dangers of sorrow and grief. Those with heavy hearts are vessels of the Wicked One.\n@c1@"
  es: "@a@b*: %H860%XGuárdate%YGuardaos%Z de los peligros que conllevan la pena y el sufrimiento. Aquellos que llevan un peso en el corazón son prisioneros del Maligno.\n@c1@"
  fr: "@a@b*ⓢ Ne vous laissez pas aller au chagrin et à la tristesse. Les êtres au cœur lourd sont les émissaires du Malin.\n@c1@"
  it: "@a@b*: %H860%XFai%YFate%Z attenzione ai pericoli derivanti dal dolore e dalla sofferenza. Chi ha il cuore affannato diviene messaggero del malvagio.\n@c1@"
  ja: "@a@b＊「深いなげきは　やがて\n\tその者の心を　闇に染めます。\n@c1@"
"31":
  de: "@a@b*: Doch wir alle sind gesegnet in diese Welt geboren worden. Gesegnet von der wahren Gottheit, der Allmächtigen Göttin!\n@c1@"
  en: "@a@b*: But all are born into this world blessed. Blessed by the one true deity, the Almighty Goddess!\n@c1@"
  es: "@a@b*: Pero todos nacemos con una bendición. Bendecidos por la única divinidad verdadera, ¡la Diosa todopoderosa!\n@c1@"
  fr: "@a@b*ⓢ Mais tous sont nés bénis. Bénis par la seule véritable divinité, la Toute-puissante Déesseⓠ\n@c1@"
  it: "@a@b*: Ma tutti sono nati su questo mondo che è stato benedetto dalla sola e unica divinità, la dea onnipotente!\n@c1@"
  ja: "@a@b＊「けれど　この世に\n\t生まれ落ちた時は　誰もが\n\t光に　つつまれていたのです。\n@c1@"
"32":
  de: "@a@b*: Estark, der den lodernden Flammen Nadirias entstieg, wurde von %A090%Xeinem großen Helden%Z%B090%Xeiner großen Heldin%Z besiegt, so wie es die Prophezeiung vorausgesagt hatte.\n@c1@"
  en: "@a@b*: Estark, born of the fiery flames of Nadiria, was struck down by a great %A090%Xhero%Z%B090%Xheroine%Z, just as the prophecy foretold.\n@c1@"
  es: "@a@b*: Estark, nacido de las ardientes llamas de Nadiria, fue derrotado por %A090%Xun gran héroe%Z%B090%Xuna gran heroína%Z, tal y como predijo la profecía.\n@c1@"
  fr: "@a@b*ⓢ Estark, né des flammes ardentes de Nadiria, a été terrassé par un%A090%X grand héros%Z%B090%Xe grande héroïne%Z, comme la prophétie l'avait prédit.\n@c1@"
  it: "@a@b*: Estark, generato dalle ardenti fiamme di Nadiria, è stato sconfitto da %A090%Xun eroe%Z%B090%Xun'eroina%Z, proprio come aveva preconizzato la profezia.\n@c1@"
  ja: "@a@b＊「地獄から復活した　エスタークは\n\t予言通り　勇者によって\n\t倒されたそうです。\n@c1@"
"33":
  de: "@a@b*: Doch nun strebt er nach Wiedergeburt. In seiner gequälten und gepeinigten Seele regt sich eine neue Teufelsmacht.\n@c1@"
  en: "@a@b*: But now he strives to be reborn. A new evil stirs within his condemned and tormented soul.\n@c1@"
  es: "@a@b*: Pero ahora él lucha por renacer. Un nuevo poder maligno habita en su alma atormentada y condenada.\n@c1@"
  fr: "@a@b*ⓢ Mais maintenant, il n'aspire qu'à une choseⓢ se réveiller à nouveau. Un nouveau plan maléfique a été élaboré par son âme damnée.\n@c1@"
  it: "@a@b*: Tuttavia, egli sta tentando con ogni mezzo di tornare in vita. Un nuovo male si agita nella sua anima triste e tormentata. \n@c1@"
  ja: "@a@b＊「しかし　今　まさに\n\t第二のエスタークが\n\t生まれようとしているのです！\n@c1@"
"34":
  de: "@a@b*: Etwas Schreckliches hat sich zugetragen...\n@c2@"
  en: "@a@b*: A terrible happening has taken place...\n@c2@"
  es: "@a@b*: Ha ocurrido un hecho terrible...\n@c2@"
  fr: "@a@b*ⓢ Il s'est passé quelque chose de terrible...\n@c2@"
  it: "@a@b*: È accaduto qualcosa di terribile...\n@c2@"
  ja: "@a@b＊「大変なことに　なってしもうた。\n@c2@"
"35":
  de: "@a@b*: Psaro dem Metzler, der sich mit der Monsterbrut verbrüderte, ist es schlussendlich gelungen, das Geheimnis der Evolution zu perfektionieren.\n@c2@"
  en: "@a@b*: Psaro the Manslayer, he who fraternises with monsterkind, has finally managed to perfect the Secret of Evolution.\n@c2@"
  es: "@a@b*: Psaro el Carnicero, que simpatiza con los monstruos, ha conseguido perfeccionar al fin el Secreto de la Evolución.\n@c2@"
  fr: "@a@b*ⓢ Psaro l'Exterminateur, celui qui a fraternisé avec les monstres, est finalement parvenu à faire encore évoluer le Secret de l'Évolution.\n@c2@"
  it: "@a@b*: Psaro il Massacratore, colui che vive in seno alla mostruosità, è riuscito a mettere a punto il Segreto dell'Evoluzione.\n@c2@"
  ja: "@a@b＊「デスピサロという　魔族の者が\n\tついに　進化の秘法を\n\t完成させたそうじゃ。\n@c2@"
"36":
  de: "@a@b*: Uns ist zu Ohren gekommen, dass Psaro das verbotene Geheimnis in seinem unterirdischen Versteck bereits entfesselt hat.\n@c2@"
  en: "@a@b*: There is hearsay among us that Psaro the Manslayer has already unleashed the forbidden secret deep in his underground lair.\n@c2@"
  es: "@a@b*: Corren rumores que Psaro el Carnicero ya ha desatado el secreto prohibido en las profundidades de la guarida que tiene bajo tierra.\n@c2@"
  fr: "@a@b*ⓢ Certains disent que Psaro l'Exterminateur a déjà laissé ce secret interdit se déchaîner au plus profond de son antre souterraine.\n@c2@"
  it: "@a@b*: Corre voce che Psaro il Massacratore abbia già scatenato il segreto proibito nelle profondità del suo nascondiglio sotterraneo.\n@c2@"
  ja: "@a@b＊「うわさによれば　デスピサロは\n\t地の底深くに　もぐり\n\t秘法を使いはじめたと　聞きます。\n@c2@"
"37":
  de: "@a@b*: Das Geheimnis der Evolution, das den Sterblichen lange, lange Zeit verborgen war.\n@c2@"
  en: "@a@b*: The Secret of Evolution that was sealed away from the hands of mortals long, long ago.\n@c2@"
  es: "@a@b*: El Secreto de la Evolución que se ha conseguido mantener alejado de las manos de los mortales durante mucho, mucho tiempo.\n@c2@"
  fr: "@a@b*ⓢ Le Secret de l'Évolution qui avait été retiré des mains des mortels il y a très très longtemps.\n@c2@"
  it: "@a@b*: Il Segreto dell'Evoluzione, che fu sottratto ai mortali tanto, tanto tempo fa...\n@c2@"
  ja: "@a@b＊「遠い昔に　禁じられた\n\t進化の秘法を……。\n@c2@"
"38":
  de: "@a@b*: Warum nur widerfährt uns diese unheilvolle Misere?\n@c1@"
  en: "@a@b*: Why hast this almighty calamity befallen us?\n@c1@"
  es: "@a@b*: ¿Por qué ha recaído sobre nosotros esta terrible tragedia?\n@c1@"
  fr: "@a@b*ⓢ Pourquoi cette calamité nous a-t-elle frappésⓡ\n@c1@"
  it: "@a@b*: Perché una tale calamità si è abbattuta su di noi?\n@c1@"
  ja: "@a@b＊「ああ　なんてことでしょう！\n@c1@"
"39":
  de: "@a@b*: Alsbald das Wandlungsarmband eingesetzt wird, können wir gewiss sein, dass das Geheimnis der Evolution grausamer als je zuvor sein wird. \n@c1@"
  en: "@a@b*: Once the armlet of transmutation is employed, the Secret of Evolution shall be still more fearsome than it was before.\n@c1@"
  es: "@a@b*: Una vez que se emplee el brazalete de transmutación, el Secreto de la Evolución será aún más temible que antes.\n@c1@"
  fr: "@a@b*ⓢ S'ils utilisent le brassard étincelant, le Secret de l'Évolution deviendra bien plus redoutable encore.\n@c1@"
  it: "@a@b*: Se verrà utilizzata la Fascia crisalidea, il Segreto dell'Evoluzione diverrà più terrificante che mai.\n@c1@"
  ja: "@a@b＊「もし　黄金の腕輪を使えば\n\t進化の秘法は　むかしのものより\n\tさらに　恐ろしいものになるのです。\n@c1@"
"40":
  de: "@a@b*: Ich kenne die Wahrheit über diesen Mann!\n@c2@"
  en: "@a@b*: I know the truth about the man!\n@c2@"
  es: "@a@b*: ¡Conozco la verdad sobre ese hombre!\n@c2@"
  fr: "@a@b*ⓢ Je sais la vérité sur cet hommeⓠ\n@c2@"
  it: "@a@b*: Conosco la verità su quell'essere.\n@c2@"
  ja: "@a@b＊「わたしには　わかります。\n@c2@"
"41":
  de: "@a@b*: Psaro der Metzler trägt den Teufel im Leib. Sein Herz wird beschwert von der Last des Hasses.\n@c2@"
  en: "@a@b*: Psaro the Manslayer is a vessel of evil, his heart steeped in a curdled soup of hatred.\n@c2@"
  es: "@a@b*: Psaro el Carnicero es un mensajero del mal, su corazón está emponzoñado por el odio.\n@c2@"
  fr: "@a@b*ⓢ Psaro l'Exterminateur est un émissaire du Mal. \nSon cœur déborde de haine.\n@c2@"
  it: "@a@b*: Psaro il Massacratore è preda del male. Il suo cuore è gonfio di odio e di malvagità.\n@c2@"
  ja: "@a@b＊「デスピサロの心にあるのは\n\tもはや　憎しみのみ！\n@c2@"
"42":
  de: "@a@b*: Er muss aufgehalten werden! \n㈡\n*: Und zwar bevor er sich in ein Wesen verwandelt, das teuflischer und abscheulicher ist als alles, was die Welt bisher gesehen hat.\n@c2@"
  en: "@a@b*: He must be stopped!\nStopped before he evolves into a being more foul and full of evil than has ever cursed this world.\n@c2@"
  es: "@a@b*: ¡Hay que detenerle! Detenerle antes de que se convierta en el ser más demencial y malvado que jamás haya maldecido este mundo.\n@c2@"
  fr: "@a@b*ⓢ Il faut l'arrêterⓠ Avant qu'il ne se transforme en un être plus vil et plus maléfique que tous ceux que le monde a déjà connus.\n@c2@"
  it: "@a@b*: Bisogna fermarlo, prima che diventi l'essere più malvagio e potente che abbia mai afflitto questo mondo.\n@c2@"
  ja: "@a@b＊「早く　止めなければ！\n\tデスピサロが　すさまじく\n\t邪悪な者に　進化をとげる前に……。\n@c2@"
"43":
  de: "@a@b*: Vernehmet die Stimme der Göttin, wie ich es getan habe!\n@c3@"
  en: "@a@b*: Open your ears to the voice of the Goddess as I have done!\n@c3@"
  es: "@a@b*: ¡%H860%XAbre tus%YAbrid vuestros%Z oídos a la voz de la Diosa como he hecho yo!\n@c3@"
  fr: "@a@b*ⓢ Accueillez la voix de la Déesse comme je l'ai faitⓠ\n@c3@"
  it: "@a@b*: %H860%XApri il tuo%YAprite il vostro%Z cuore alle parole della dea, così come ho fatto io!\n@c3@"
  ja: "@a@b＊「わたしは　神の声を聞く者。\n@c3@"
"44":
  de: "@a@b*: Ich war es, der die Prophezeiung der Göttin über %A090%Xden großen Helden hörte, der%Z%B090%Xdie große Heldin hörte, die%Z Estark schließlich besiegen würde.\n@c3@"
  en: "@a@b*: It was I who heard the Goddess's prophecy about the great %A090%Xhero%Z%B090%Xheroine%Z who would strike down Estark.\n@c3@"
  es: "@a@b*: Fui yo quien escuchó la profecía de la Diosa sobre %A090%Xel gran héroe%Z%B090%Xla gran heroína%Z que derrotaría a Estark.\n@c3@"
  fr: "@a@b*ⓢ C'est moi qui ai entendu la prophétie de la Déesse concernant l%A090%Xe grand héros%Z%B090%Xa grande héroïne%Z qui terrasserait Estark.\n@c3@"
  it: "@a@b*: Fui io a raccogliere la profezia divina sull'%A090%Ximpavido eroe%Z%B090%Ximpavida eroina%Z che avrebbe sconfitto Estark.\n@c3@"
  ja: "@a@b＊「エスタークが　よみがえり\n\tそれを勇者が倒すという\n\t予言を聞いたのも　わたし。\n@c3@"
"45":
  de: "@a@b*: Die Prophezeiung hat sich bis ins kleinste Detail erfüllt. Die Göttin offenbarte mir ebenfalls, dass Ihr hierher zum Azimuth kommen würdet.\n@c3@"
  en: "@a@b*: It is exactly as the prophecy foretold.\nThat you would come here to the Azimuth, this too was revealed to me by the Goddess.\n@c3@"
  es: "@a@b*: Es exactamente tal y como predijo la profecía.\nQue vendría aquí a Azimut, lo cual también me fue revelado por la Diosa.\n@c3@"
  fr: "@a@b*ⓢ Tout s'est passé comme le prévoyait la prophétie.\nLa Déesse m'avait également révélé que vous viendriez à l'Azimut.\n@c3@"
  it: "@a@b*: La predizione si è avverata. La dea mi aveva anticipato la %H860%Xtua%Yvostra%Z venuta ad Azimut.\n@c3@"
  ja: "@a@b＊「すべては　神の予言通り。\n\tそう　そなたが　このゴットサイドへ\n\t来ることも。\n@c3@"
"46":
  de: "@a@b*: Doch nun herrscht Stille...\nWas wird geschehen, jetzt da Estark geschlagen ist... Das ist selbst mir ein Rätsel...\n@c3@"
  en: "@a@b*: But now there is only silence...\nWhat will happen now that Estark is defeated is a mystery even to me...\n@c3@"
  es: "@a@b*: Pero ahora solo hay silencio...\nLo que ocurrirá ahora que Estark ha sido derrotado es un misterio incluso para mí...\n@c3@"
  fr: "@a@b*ⓢ Mais elle s'est tue...\nQu'arrivera-t-il maintenant qu'Estark a été terrasséⓡ Je n'en ai aucune idée non plus...\n@c3@"
  it: "@a@b*: Ma ora odo solo silenzio... Ciò che accadrà adesso che Estark è stato sconfitto rimane un mistero persino per me...\n@c3@"
  ja: "@a@b＊「しかし　エスタークが倒された\n\t後のことは　まったく\n\tなにも　聞こえぬ……。\n@c3@"
"47":
  de: "@a@b*: Oh, weise und allmächtige Göttin!\nWas hat dies zu bedeuten?\n@c3@"
  en: "@a@b*: Wise and all-powerful Goddess!\nWhat does this mean?\n@c3@"
  es: "@a@b*: ¡Diosa sabia y todopoderosa!\n¿Qué significa esto?\n@c3@"
  fr: "@a@b*ⓢ Sage et puissante Déesseⓠ\nQu'est-ce que cela veut direⓡ\n@c3@"
  it: "@a@b*: Dea onnisciente e onnipotente... che significa tutto ciò?\n@c3@"
  ja: "@a@b＊「おお　天空の神よ！\n\tいったい　どうしたと言うのですか？\n@c3@"
"48":
  de: "@a@b*: Ich habe von einem Turm gehört, irgendwo auf dieser Insel, der direkt nach Zenithia führen soll!\n@c2@"
  en: "@a@b*: I have heard tell of a tower somewhere on this island that leads to Zenithia itself!\n@c2@"
  es: "@a@b*: ¡He oído hablar de una torre en algún lugar de esta isla que conduce hasta la misma Zenithia!\n@c2@"
  fr: "@a@b*ⓢ J'ai entendu parler d'une tour quelque part sur cette île. Elle permettrait de se rendre à Zénithiaⓠ\n@c2@"
  it: "@a@b*: Ho sentito dire che da qualche parte, su quest'isola, c'è una torre che conduce a Zenithia!\n@c2@"
  ja: "@a@b＊「この島の　どこかに\n\t天空に通じる塔が\n\tあるらしいと　聞いたのだが。\n@c2@"
"49":
  de: "@a@b*: Selbst wenn die Treppe nach Zenithia tatsächlich existieren sollte, öffnet sie sich nicht jedem.\n@c1@"
  en: "@a@b*: But even if the Stairway to Zenithia really does exist, it is not open to all.\n@c1@"
  es: "@a@b*: Pero aún en el caso de que la Escalera a Zenithia realmente exista, no está abierta a todo el mundo.\n@c1@"
  fr: "@a@b*ⓢ Mais même si les Marches de Zénithia existent vraiment, le passage n'est pas ouvert à tous.\n@c1@"
  it: "@a@b*: Ma anche se la Scala per Zenithia esistesse davvero, non tutti potrebbero percorrerla.\n@c1@"
  ja: "@a@b＊「たとえ　天空への塔にのぼっても\n\t誰もが　天空にゆけるとは\n\t限りません。\n@c1@"
"50":
  de: "@a@b*: In den alten Schriften steht geschrieben, dass nur derjenige, welcher im Besitz der gesamten legendären Zenithia-Ausrüstung ist, Zutritt erhält.\n@c1@"
  en: "@a@b*: It is written in the ancient scriptures that only one with all of the legendary Zenithian Equipment would be granted access.\n@c1@"
  es: "@a@b*: Está escrito en las antiguas escrituras que solo podrá acceder a ella la persona que porte todo el legendario Equipo de Zenithia.\n@c1@"
  fr: "@a@b*ⓢ Il est dit dans les anciennes écritures que seule une personne disposant de l'Équipement zénithien pourra y accéder.\n@c1@"
  it: "@a@b*: Secondo le antiche scritture, può accedervi solo chi possiede il leggendario Equipaggiamento Zenithiano.\n@c1@"
  ja: "@a@b＊「古い書物によれば　天空の武器と防具\n\tすべてを　手に入れた者にだけ\n\tその資格があるとか。\n@c1@"
"51":
  de: "@a@b*: Eure Füße müssen gesegnet sein, denn Ihr steht im Azimuth, und das ist Zenithia so nah, wie man als Sterblicher nur kommen kann.\n@c1@"
  en: "@a@b*: Your feet are blessed, for you stand at the Azimuth, the closest mortals can be to Zenithia.\n@c1@"
  es: "@a@b*: %H860%XTus%YSus%Z pies se hallan bendecidos, porque se %H860%Xencuentra%Yencuentran%Z en Azimut, lo más próximo que los mortales pueden estar de Zenithia.\n@c1@"
  fr: "@a@b*ⓢ Vos pieds sont bénis car vous êtes à l'Azimut. Un mortel ne peut pas s'approcher plus près de Zénithia.\n@c1@"
  it: "@a@b*: I %H860%Xtuoi%Yvostri%Z piedi sono benedetti, perché %H860%Xti trovi%Yvi trovate%Z davanti all'Azimut. Nessun mortale può avvicinarsi di più a Zenithia.\n@c1@"
  ja: "@a@b＊「ここは\n\t天空に　いちばん近い島。\n@c1@"
"52":
  de: "@a@b*: Doch lasset Vorsicht walten, denn Nadiria, die Unterwelt, ist nicht allzu fern von hier.\n@c1@"
  en: "@a@b*: But beware, for Nadiria, the underworld, is not far distant either.\n@c1@"
  es: "@a@b*: Pero, cuidado, porque Nadiria, el Inframundo, no se encuentra tampoco a mucha distancia.\n@c1@"
  fr: "@a@b*ⓢ Faites cependant bien attention, car Nadiria, le pays des Enfers, n'est pas très éloigné.\n@c1@"
  it: "@a@b*: Ma attenzione! Nemmeno Nadiria, la terra degli inferi, è lontana da qui!\n@c1@"
  ja: "@a@b＊「しかし　また\n\t闇の世界にも　近いのです。\n@c1@"
"53":
  de: "@a@b*: Im Nordwesten dieser Insel befindet sich eine Höhle, die tief in die Erde hinabreicht. Eine Höhle, die kein Mensch betreten darf.\n@c1@"
  en: "@a@b*: In the north-west of this very island is a cave so deep that it touches the abyss. A cave that no human may approach.\n@c1@"
  es: "@a@b*: En el noroeste de esta misma isla hay una cueva tan profunda que se hunde en el abismo. Una cueva a la que no puede acercarse humano alguno.\n@c1@"
  fr: "@a@b*ⓢ Au nord-ouest de cette île se trouve une caverne abyssale qui plonge dans les entrailles de la terre. Aucun humain ne doit s'en approcher.\n@c1@"
  it: "@a@b*: A nord-ovest di quest'isola c'è una grotta tanto profonda da raggiungere l'abisso. Nessun umano può accedervi.\n@c1@"
  ja: "@a@b＊「この島の北西には\n\t人を　誰も寄せつけぬ\n\t深き深き　洞くつがあります。\n@c1@"
"54":
  de: "@a@b*: Nur Zenithianern und Monstern ist der Zutritt in die Höhle gestattet. So besagt es die Legende.\n@c1@"
  en: "@a@b*: Only Zenithians and monsterkind may enter the cave. That is what the legend says.\n@c1@"
  es: "@a@b*: Solo los habitantes de Zenithia y los monstruos pueden entrar en la cueva. Eso es lo que afirma la leyenda.\n@c1@"
  fr: "@a@b*ⓢ Seuls les Zénithiens et les monstres peuvent pénétrer dans cette grotte.\nC'est ce que dit la légende.\n@c1@"
  it: "@a@b*: Secondo la leggenda, solo gli Zenithiani e i mostri possono entrare in quella caverna.\n@c1@"
  ja: "@a@b＊「そして　その洞くつに入れるのは\n\t魔族と天空人のみ……。\n\t言い伝えは　そう語っています。\n@c1@"
"55":
  de: "@a@b*: Es muss ein Werk der Göttin sein. Die Person, die dort schläft, ist vom Himmel gefallen.\n@c2@"
  en: "@a@b*: It must have been an act of the Goddess. The person you see sleeping there fell out of the sky.\n@c2@"
  es: "@a@b*: Debe haber sido un acto de la Diosa. La persona que ves durmiendo allí cayó del cielo.\n@c2@"
  fr: "@a@b*ⓢ Il s'agit probablement d'un signe de la Déesse.\nLa personne qui dort ici est tombée des cieux.\n@c2@"
  it: "@a@b*: Probabilmente è opera della dea. La persona che %H860%Xvedi%Yvedete%Z giacere lì è caduta dal cielo.\n@c2@"
  ja: "@a@b＊「そこで　寝ているお人は\n\t不思議なことに\n\t空から　落っこちてきたのじゃ。\n@c2@"
"56":
  de: "@a@b*: Was ist mit %a00090 geschehen? Ich muss %A090%Xihn%Z%B090%Xsie%Z dringend sprechen.\n@c2@"
  en: "@a@b*: What has become of %a00090?\nI must meet with %A090%Xhim%Z%B090%Xher%Z urgently.\n@c2@"
  es: "@a@b*: ¿Dónde se encuentra %a00090?\nDebo reunirme con %A090%Xél%Z%B090%Xella%Z inmediatamente.\n@c2@"
  fr: "@a@b*ⓢ Qu'est devenu%A090%X%Z%B090%Xe%Z %a00090ⓡ\nJe dois %A090%Xle%Z%B090%Xla%Z retrouver au plus vite.\n@c2@"
  it: "@a@b*: Che ne è stato di %a00090? Ho assoluta urgenza di %A090%Xincontrarlo%Z%B090%Xincontrarla%Z.\n@c2@"
