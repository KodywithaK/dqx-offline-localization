"7":
  de: "@aMaya@bOh, es war einfach schrecklich. Kein einziger von den Kunden sah so aus, als hätte er auch nur ein klein bisschen Geld.\n@c1@"
  en: "@aMaya@bArey, it was awful-awful. Not one of the customers looked even a little bit rich.\n@c1@"
  es: "@aMaya@bNada, fue muy mal, muy mal. Me parece que no había ricachones entre los asistentes, hermana.\n@c1@"
  fr: "@aMaya@bPfff, c'était vraiment horrible.\nAucun des clients n'avait l'air d'avoir ne serait-ce qu'un peu d'argent.\n@c1@"
  it: "@aMaya@bOh, tutto come sempre. Il solito pubblico di poveracci con gli occhi fuori dalle orbite...\n@c1@"
  ja: "@a@bマーニャ「だめだめ。\n\t今日も　あんまり　いい男は\n\tいなかったわ。\n@c1@"
"8":
  de: "@aMina@bNein, das meinte ich nicht! Ich spreche von Balzack! War dieser Schuft da heute Abend?\n@c1@"
  en: "@aMeena@bNo! You're not understanding me! I'm talking about Balzack, innit? Was that despicable criminal there tonight?\n@c1@"
  es: "@aMeena@b¡No! ¡No me entiendes! Te hablo de Balzack, ¿comprendes? ¿Se presentó esta noche ese despreciable criminal, hermana?\n@c1@"
  fr: "@aMina@bNon, je ne parle pas de çaⓠ Je parle de Dickenzⓠ\nEst-ce que ce criminel était là ce soirⓡ\n@c1@"
  it: "@aMyra@bNo, non hai capito! Io parlo di Balzack! Quel criminale era lì stasera?\n@c1@"
  ja: "@a@bミネア「もう！　ちがうでしょっ！\n\tバルザックよ。　カタキのバルザック！\n@c1@"
