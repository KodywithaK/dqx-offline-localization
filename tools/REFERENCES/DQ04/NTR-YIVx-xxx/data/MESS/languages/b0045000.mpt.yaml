  fr: "@aMina@bAlors, Maya. Ça vaⓡ Ça s'est bien passéⓡ\nTu as du nouveauⓡ Raconte-moi.\n@c1@"
  it: "@aMyra@bCiao, Maya. E allora, com'è andata? Hai qualche novità da raccontarmi?\n@c1@"
