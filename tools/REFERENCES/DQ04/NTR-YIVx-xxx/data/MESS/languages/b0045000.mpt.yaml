  es: "@a@b*: ¡Encore, Maya! ¡Encore!\n@c2@"
  fr: "@a@b*ⓢ Vas-y, Mayaⓠ Yeahⓠ\n@c2@"
  it: "@a@b*: Encore, Maya! Encore!\n@c2@"
