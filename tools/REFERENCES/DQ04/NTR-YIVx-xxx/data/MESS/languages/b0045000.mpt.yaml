  it: "@a@bMyra e Maya ricevono 100 monete d'oro.\n@c0@"
  ja: "@a@bマーニャたちは　１００Ｇを手に入れた。\n@c0@"
"14":
  de: "@aManager Artois@bIsch 'atte gehofft, du würdest bleiben, Maya. Das Publikum liebt disch. Aber isch will disch nischt von deinem Rachefeldzug ab'alten.\n@c2@"
  en: "@aManager Artois@bI was 'oping you would stay. Ze crowd go wild for you. But I cannot stand in ze way of your mission of vengeance.\n@c2@"
  es: "@aJefe Menasatruá@bEspegraba que os quedagrais. El público se vuelve loco con vosotgras. Pegro no puedo integrponegrme en vuestgro camino de venganza.\n@c2@"
  fr: "@aAgent Majestic@bJ'aurais voulu que vous restiez, mes chéries darlings. L'audience est folle de vous. Mais je sais que votre vengeance ne peut pas attendre.\n@c2@"
  it: "@aManager Atruà@bSperavo che rimanessi, ma petite. La folla impazzisce per te. Ma non posso impedirti di cercare la tua vendetta. \n@c2@"
  ja: "@a@b座長「わたしとしては　人気もあるし\n\tもうしばらく　いてほしかったのだが\n\tカタキ討ちを　止めるワケにいくまい。\n@c2@"
"15":
  de: "@aManager Artois@bBleibt doch noch 'ier 'eute Nacht. Und passt auf eusch auf, mes filles. Adieu!\n@c2@"
  en: "@aManager Artois@bRest 'ere tonight, and leave in ze morning. Take care, mes filles. Adieu!\n@c2@"
  es: "@aJefe Menasatruá@bDogrmigr aquí esta noche y pagrtigr pogr la matin. Tenegr cuidado, mademoiselles. ¡Adieu!\n@c2@"
  fr: "@aAgent Majestic@bRestez ici cette nuit et vous partirez demain. Soyez prudentes, mes chéries darlings.\nAyez un bon voyageⓠ\n@c2@"
  it: "@aManager Atruà@bRiposate qui stasera e ripartite domani. Statemi bene, mes petites. Adieu!\n@c2@"
  ja: "@a@b座長「今日は　ゆっくり休んで\n\t明日の朝　出ればいいだろう。\n\t気をつけて　行くんだよ。\n@c2@"
"16":
  de: "@aMina@bWach auf, Schwesterherz. Wir müssen gehen.\n@c1@"
  en: "@aMeena@bWakey-wakey, sis. It's time we were going.\n@c1@"
  es: "@aMeena@bArriba, arriba, hermana. Es hora de que nos marchemos.\n@c1@"
  fr: "@aMina@bRéveille-toi, Mayaⓠ Il est l'heure de partir.\n@c1@"
  it: "@aMyra@bSveglia, sorellona. È ora di andare.\n@c1@"
  ja: "@a@bミネア「おはよう　姉さん。\n\tさあ　出かけましょう。\n@c1@"
"17":
  de: "@a@b*: Es war schön, mit euch zu arbeiten, selbst wenn es nur kurz war. Viel Glück.\n@c1@"
  en: "@a@b*: I've really enjoyed working with you, even though it was only for a short time. Good luck.\n@c1@"
  es: "@a@b*: Realmente he disfrutado trabajando con vosotras aunque fuera por poco tiempo. Buena suerte.\n@c1@"
  fr: "@a@b*ⓢ J'ai adoré travailler avec vous, même si c'était un peu court. Bonne chance pour la suite.\n@c1@"
  it: "@a@b*: Mi ha fatto piacere lavorare con te, anche se è stato solo per poco tempo. Buona fortuna.\n@c1@"
  ja: "@a@b＊「すこしの間だったけど\n\t一緒にはたらけて　楽しかったわ。\n\tカタキ討ち　がんばってね。\n@c1@"
"18":
  de: "@a@b*: Was? %L000%XIhr wollt den Mann suchen, der euren%YDu willst den Mann suchen, der deinen%Z Vater umgebracht hat?\n@c2@"
  en: "@a@b*: What? You're going after the man who killed your father?\n@c2@"
  es: "@a@b*: ¿Qué? ¿%L000%XVais%YVas%Z en busca del hombre que mató a %L000%Xvuestro%Ytu%Z padre?\n@c2@"
  fr: "@a@b*ⓢ Commentⓡ Vous vous lancez à la poursuite de l'homme qui a tué votre pèreⓡ\n@c2@"
  it: "@a@b*: Cosa? %H860%XStai%YState%Z inseguendo l'uomo che ha ucciso %H860%Xtuo%Y vostro%Z padre?\n@c2@"
  ja: "@a@b＊「へー　あんたたち\n\t親父さんの　カタキを探して\n\t旅を　してたんだ！？\n@c2@"
"19":
  de: "@a@b*: Das ist aber eine schwierige Aufgabe. Aber man soll die Hoffnung nie aufgeben. %L000%XIhr werdet%YDu wirst%Z den Kerl sicher finden!\n@c2@"
  en: "@a@b*: Well, that's quite a mission for %L000%Xyou two young girls%Yyou and your sister%Z. But don't give up. I hope you catch the fiend!\n@c2@"
  es: "@a@b*: Eso es toda una misión para %L000%Xdos chicas tan jóvenes%Yuna chica tan joven%Z. Pero no %L000%Xos rindáis%Yte rindas%Z. ¡Espero que %L000%Xatrapéis%Yatrapes%Z a ese desalmado!\n@c2@"
  fr: "@a@b*ⓢ Eh bien, voilà une sacrée mission pour %L000%Xdeux jeunes filles%Yvous et votre sœur%Z. Bonne chance en tout cas. \nJ'espère que vous attraperez ce monstreⓠ\n@c2@"
  it: "@a@b*: Beh, una missione non da poco per %L000%Xdue ragazze come voi%Yte e tua sorella%Z. Ma non mollate! Spero che troverete quel disgraziato!\n@c2@"
  ja: "@a@b＊「そりゃ　大変だろうけど\n\tなにがあっても　絶対に\n\t途中で　くじけるんじゃないよ。\n@c2@"
"20":
  de: "@a@b*: Isch warte darauf, dass die Tänzerinnen vorbeikommen.\n@c0@"
  en: "@a@b*: I am waiting 'ere for ze dancing girls to pass by on zeir way to work.\n@c0@"
  es: "@a@b*: Estoy espegrando a que pasen las bailagrinas camino del tgrabajo.\n@c0@"
  fr: "@a@b*ⓢ J'attends là que les danseuses passent pour aller à leur job.\n@c0@"
  it: "@a@b*: Sto aspettando che le ballerine passino di qui mentre vanno au travail.\n@c0@"
  ja: "@a@b＊「オレは　ここで\n\t踊り子さんが　通るのを\n\t待ってるんだ。\n@c0@"
"21":
  de: "@a@b*: Oh, mon Dieu! Diese Konzentration auf ihren Gesichtern... Das lässt das 'erz eines Mannes 'öher schlagen!\n@c0@"
  en: "@a@b*: Oh, mon Dieu! Ze look of concentration on zeir faces before ze show... It is more zan a man can bear!\n@c0@"
  es: "@a@b*: ¡Oh, mon Dieu! Esa migrada de concentgración en sus grostgros antes del espectáculo... ¡Es más de lo que un hombgre puede sopogrtagr!\n@c0@"
  fr: "@a@b*ⓢ My Godⓠ Leur visage avant le show... cette concentration... Un homme ne peut pas rester indifférentⓠ\n@c0@"
  it: "@a@b*: Oh là là! Quelle faccine concentrate prima dello spectacle... Nessun uomo può resistere, parbleu!\n@c0@"
  ja: "@a@b＊「仕事に向かう　踊り子さんの\n\tさあ　やるぞってカオが\n\tなんともいえず　たまらんのだ。\n@c0@"
"22":
  de: "@a@b*: Die Tänzerinnen sind ja ganz nett, aber ich persönlich würde lieber einen Komiker sehen. Das wär doch viel lustiger.\n@c2@"
  en: "@a@b*: The dancing girls are all very well, but I'd sooner see a comedian myself. Yes, a side-splitting comedian would be nice.\n@c2@"
  es: "@a@b*: Las bailarinas están muy bien, pero a mí me gustaría ver a un cómico. Eso es, un cómico para partirnos de risa sería perfecto.\n@c2@"
  fr: "@a@b*ⓢ Les danseuses sont parfaites, mais j'aimerais bien voir un comédien aussi. Oui, un comique, ce serait bien aussiⓠ\n@c2@"
  it: "@a@b*: Le ballerine sono brave, per carità, ma io preferirei un attore. Sì, sì, un bel comico spassoso.\n@c2@"
  ja: "@a@b＊「歌に踊りもいいけどさ\n\tあたしは　腹の底から笑えるような\n\t旅芸人に　来てもらいたいよ。\n@c2@"
"23":
  de: "@a@b*: %L000%XHabt ihr%YHast du%Z gehört, dass der Alchemist Mahabala aus Boutdumonde von seinem eigenen Schüler getötet wurde?\n@c3@"
  en: "@a@b*: Did you hear about the alchemist Mahabala from Aubout du Monde being killed by his own student, Balzack?\n@c3@"
  es: "@a@b*: ¿%L000%XOs habéis%YTe has%Z enterado de que el alquimista Mahabala, de Aubout du Monde, ha sido asesinado por su propio discípulo, Balzack?\n@c3@"
  fr: "@a@b*ⓢ Vous avez entendu la nouvelleⓡ L'alchimiste Mahabala, qui habitait Deadend, a été tué par Dickenz, son élèveⓠ\n@c3@"
  it: "@a@b*: %H860%XHai%YAvete%Z saputo dell'alchimista Malaparata di Infond Almond che è stato ucciso dal suo discepolo Balzack?\n@c3@"
  ja: "@a@b＊「コーミズ村の　錬金術師\n\tエドガンさんは　弟子のバルザックに\n\t殺されたんだってな。\n@c3@"
"24":
  de: "@a@b*: Ach was! %L000%XIhr seid Mahabalas Töchter%YDu bist Mahabalas Tochter%Z?! T-Tut mir leid... das wusste ich nicht...\n@c3@"
  en: "@a@b*: No way! You're Mahabala's %L000%Xdaughters%Ydaughter%Z? I-I'm sorry... I had no idea...\n@c3@"
