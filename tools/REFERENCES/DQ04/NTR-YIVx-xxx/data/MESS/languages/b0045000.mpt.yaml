  es: "@aMaya@b¡Ah! Lo siento, hermana. No, Balzack no estaba.\n@c1@"
  fr: "@aMaya@bOh, excuse-moi, sœurette. Je n'avais pas compris. Non, Dickenz n'était pas là.\n@c1@"
