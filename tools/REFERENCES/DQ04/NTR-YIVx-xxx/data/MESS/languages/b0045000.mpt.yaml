"0":
  de: "@a@bDies ist die Geschichte zweier schöner Schwestern, die den Tod ihres Vaters rächen wollen.\n@c0@"
  en: "@a@bThis is the tale of two beautiful sisters on a mission to avenge their father's death.\n@c0@"
  es: "@a@bEsta es la historia de dos bellas hermanas que emprendieron un viaje para vengar la muerte de su padre.\n@c0@"
  fr: "@a@bNous allons vous conter l'histoire de deux sœurs, très jolies, qui ont décidé de venger la mort de leur père.\n@c0@"
  it: "@a@bQuesta è la storia di due bellissime sorelle in cerca di vendetta per la morte del padre.\n@c0@"
  ja: "@a@bこれから始まるお話は\n父親のカタキを探し　旅をする\n美しい姉妹の物語。\n@c0@"
"1":
  de: "@a@bDie Ältere ist eine Tänzerin namens Maya, und ihre jüngere Schwester, Mina, ist Wahrsagerin.\n@c0@"
  en: "@a@bThe eldest is a dancer named Maya, and her younger sister, Meena, is a fortune-teller.\n@c0@"
  es: "@a@bLa mayor se llama Maya y es bailarina. Su hermana pequeña, Meena, es adivina.\n@c0@"
  fr: "@a@bMaya, l'aînée, est danseuse, et sa cadette, Mina, est diseuse de bonne aventure.\n@c0@"
  it: "@a@bLa maggiore è una ballerina di nome Maya, la minore una chiromante di nome Myra.\n@c0@"
  ja: "@a@b姉マーニャは　踊り子。\n妹ミネアは　占い師。\n@c0@"
"2":
  de: "@a@bIhr Abenteuer beginnt in Laissez Fayre, der Vergnügungsmetropole von Libeccio.\n@c0@"
  en: "@a@bTheir adventure begins in the entertainment capital of Libeccio, Laissez Fayre.\n@c0@"
  es: "@a@bSu aventura comienza en Laissez Fayre, la capital del entretenimiento de Leveche.\n@c0@"
  fr: "@a@bLeur aventure débute à Teafortwo, la capitale du divertissement du Libeccio.\n@c0@"
  it: "@a@bLa loro avventura inizia a Laissez Fayre, la vivace capitale di Lybeccio.\n@c0@"
  ja: "@a@b物語は　歌と踊りの町\nモンバーバラから　始まります。\n@c0@"
