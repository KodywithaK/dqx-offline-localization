"11":
  de: "@aManager Artois@bNischt aufgeben, mes petites. Ihr findet ihn schon. Alles zu seiner Zeit.\n@c2@"
  en: "@aManager Artois@bDo not be dis'eartened, my petite amie. You will find 'im. All in good time.\n@c2@"
  es: "@aJefe Menasatruá@bNo os pgreocupéis, mes petites. Lo encontgragréis. Todo a su tiempo.\n@c2@"
  fr: "@aAgent Majestic@bNe soyez pas déçue, ma chérie darling. Nous trouverons lui. Chaque chose en son temps.\n@c2@"
  it: "@aManager Atruà@bNon ti scoraggiare, ma petite. Prima o poi lo troverai.\n@c2@"
  ja: "@a@b座長「まあ　そんなにガッカリしないで。\n\tあせらなくても　旅を続けていれば\n\tきっと　いつか見つかるさ。\n@c2@"
"12":
  de: "@aManager Artois@bⓙier ist euer Geld für 'eute Abend...\n@c2@"
  en: "@aManager Artois@bⓙEre is your money for ze work of today...\n@c2@"
  es: "@aJefe Menasatruá@bAquí tenéis el dinegro pogr el tgrabajo de hoy...\n@c2@"
  fr: "@aAgent Majestic@bVoici votre monnaie pour la dance de la soirée...\n@c2@"
  it: "@aManager Atruà@bEcco il compenso per il lavoro di osgi, ma petite.\n@c2@"
  ja: "@a@b座長「そうそう　これは今日までの\n\tお手当て。　ご苦労だったね。\n@c2@"
"13":
  de: "@a@bMina und Maya erhalten 100 Goldmünzen.\n@c0@"
  en: "@a@bMeena and Maya receive 100 gold coins.\n@c0@"
  es: "@a@bMeena y Maya reciben 100 monedas de oro.\n@c0@"
