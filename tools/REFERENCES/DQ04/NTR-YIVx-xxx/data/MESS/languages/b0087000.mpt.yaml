"2":
  de: "@a@b*: Ich hatte einmal viele Freunde hier. Aber jetzt sind sie alle tot.\n@c2@"
  en: "@a@b*: I had a lot of friends here once.\nBut theyⓙre all dead now.\n@c2@"
  es: "@a@b*: Hace tiempo tuve aquí muchos amigos. Pero ahora están todos muertos.\n@c2@"
  fr: "@a@b*ⓢ Avant, j'avais beaucoup d'amis ici.\nMais ils sont tous morts, maintenant.\n@c2@"
