  ja: "@a@b＊「おっかちゃんの　ためなーら\n\tえーんやこーら　とっ！\n@c0@"
"7":
  de: "@a@b*: Mit den Monstern und dem Gas werd ich schon fertig. Bevor ich nicht das Gold gefunden habe, kriegen mich hier keine zehn Pferde weg!\n@c2@"
  en: "@a@b*: I can unearth monsters, I can hit gas, but until I find gold, I'm not shifting!\n@c2@"
  es: "@a@b*: ¡Puedo toparme con monstruos o encontrar gas pero hasta que no encuentre oro no me marcharé!\n@c2@"
  fr: "@a@b*ⓢ Je peux trouver des monstres à la pelle et crever des poches de gaz, mais je bougerai pas tant que j'aurai pas trouvé de l'orⓠ\n@c2@"
  it: "@a@b*: Che vengano pure fuori i mostri, che il gas mi riempia i polmoni fino a farli scoppiare... Non me ne andrò da qui finché non avrò trovato l'oro!\n@c2@"
  ja: "@a@b＊「ガスが出ようが　魔物が出ようが\n\t金が出るまで　がんばるんだ！\n\tあっ　掘って掘って　掘りぬいて！\n@c2@"
