  es: "@a@b*: Creo que va siendo hora de abandonar este pueblo.\n¡Ejem, (tos) ejem!\n@c2@"
  fr: "@a@b*ⓢ Je crois qu'il est temps que je parte de cette ville.\nHum, (il tousse) aheuⓠ\n@c2@"
  it: "@a@b*: Credo che sia arrivato il momento di andarmene da questo villaggio.\nSput! Sput! Coff! Coff!\n@c2@"
  ja: "@a@b＊「オレも　そろそろ　この町を\n\t出ようかって　思っているんだ。\n\tゴホゴホ……。\n@c2@"
