"6":
  de: "@a@b*: Ich rack're mich ab wie das liebe Vieh, Ⓠ\nSonst endet des Weibes Zetern nie! Ⓡ\n@c0@"
  en: "@a@b*: Work my fingers to the bone, Ⓠ\nSo my wife wonⓙt moan anⓙ groan! Ⓡ\n@c0@"
