"0":
  de: "@a@bHier ist ein Knopf. Drücken?\n@c0@"
  en: "@a@bThere's a button here.\nPress it?\n@c0@"
  es: "@a@bHay un botón.\n¿Quieres pulsarlo?\n@c0@"
  fr: "@a@bVous voyez un bouton.\nVoulez-vous appuyer dessusⓡ\n@c0@"
  it: "@a@bQui c'è un interruttore.\nVuoi premerlo?\n@c0@"
  ja: "@a@bボタンがあります　おしてみますか？\n@c0@"
"1":
  de: "@a@b*: Du bist wohl auch auf der Suche nach dem Stahlkasten, was?\n@c3@"
  en: "@a@b*: Has yerself come lookin' for the steel strongbox, too?\n@c3@"
  es: "@a@b*: ¿También has vienido a buscar la caja fuerte de aciero?\n@c3@"
  fr: "@a@b*ⓢ Z'êtes aussi %A120%Xvenu%Z%B120%Xvenue%Z pour le coffre-fort de fer, c'est çaⓡ\n@c3@"
  it: "@a@b*: Pure %H860%Xte cerchi%Yvoi cercate%Z la Salvarisparmi?\n@c3@"
  ja: "@a@b＊「あんたも　鉄の金庫を\n\t探しにきたんだな？\n@c3@"
"2":
  de: "@a@b*: Irgendwas stimmt nicht mit diesem rollenden Felsbrocken, wenn du mich fragst. Aber ich hol mir den Schatz, koste es, was es wolle!\n@c3@"
  en: "@a@b*: Aye, well, there's sometin' not quite right about that rollin' boulder if y'ask me. But I'll get meself me treasure still an' all!\n@c3@"
  es: "@a@b*: Pues a mí mi pariece que lo de esa piedra rodante no es muy niormal. ¡Pero aún así me haré con mi tiesoro!\n@c3@"
  fr: "@a@b*ⓢ Ce gros rocher qui bouge me paraît bizarre. Mais c'est pas ça qui m'empêchera de mettre la main sur le trésorⓠ\n@c3@"
  it: "@a@b*: Quella roccia rotolante l'è un po' strana. Ma 'un sarà certo un masso bizzarro a impedirmi di trova' i'ttesoro!\n@c3@"
  ja: "@a@b＊「オレは　あの　転がってくる岩が\n\tどうも　怪しいと思うんだが……。\n\tまあ　お宝は　オレが　いただくぜ！\n@c3@"
"3":
  de: "@a@b%0%a00120 prüft den Boden zu %A120%Xseinen%Z%B120%Xihren%Z Füßen.\n@c0@"
  en: "@a@b%0%a00120 examines the ground at %A120%Xhis%Z%B120%Xher%Z feet.\n@c0@"
  es: "@a@b%0%a00120 examina el suelo alrededor de sus pies.\n@c0@"
  fr: "@a@b%0%a00120 examine le sol devant %A120%Xlui%Z%B120%Xelle%Z.\n@c0@"
  it: "@a@b%0%a00120 esamina il terreno ai suoi piedi...\n@c0@"
  ja: "@a@b%a00120は　足元を　調べた！\n@c0@"
"4":
  de: "@a@bEs ist etwas in den Boden geritzt.\n%0%a00120 liest, was dort steht...\n@c0@"
  en: "@a@bA message has been carved in the floor.\n%0%a00120 reads what it says...\n@c0@"
  es: "@a@b%0%a00120 descubre el origen del mensaje...\n@c0@"
  fr: "@a@bUn message a été gravé à même la pierre.\n%0%a00120 déchiffre ce qui est écrit...\n@c0@"
  it: "@a@bPer terra è inciso un messaggio.\n%0%a00120 lo legge...\n@c0@"
  ja: "@a@b床の上に　何か文字がきざんである。\n%a00120は　文字を読んだ。\n@c0@"
"5":
  de: "@a@bⓞGierig ist der Reisende, der nach dem Schatz sich sehnt! Lege zurück, was unrechtmäßig du genommen!\n@c0@"
  en: "@a@bⓗGreedy is the traveller who seeketh treasure!\nPut back that which thou hast unlawfully taken!\n@c0@"
  es: "@a@b''¡La avaricia es pecado, viajero buscatesoros!\n¡Devuelve lo que has tomado de forma ilegítima!''\n@c0@"
  fr: "@a@bⓥAvide est le pèlerin qui cherche fortuneⓠ\nRemets en place ce que tu as voléⓠ\n@c0@"
  it: "@a@bⓕAvido è colui che va in cerca del tesoro!\nRestituisci ciò che hai illegittimamente sottratto!ⓖ\n@c0@"
  ja: "@a@b宝を求め　旅する者よ。\nそなたの盗んだ宝を\nこの場所に　戻すがよい。\n@c0@"
"6":
  de: "@a@bLege es zurück, und der Pfad des Rückzugs wird sich dir auftun.ⓟ\n@c0@"
  en: "@a@bⓗPut it back, and the path of retreat shall become open to thee.ⓘ\n@c0@"
  es: "@a@b''Devuélvelo, y la salida se abrirá para ti.''\n@c0@"
  fr: "@a@bRepose ton butin et le chemin salvateur s'ouvriraⓦ.\n@c0@"
  it: "@a@bⓕRestituiscilo, e un sentiero si aprirà per te!ⓖ\n@c0@"
  ja: "@a@bさすれば　そなたの\n戻りゆく道が　開かれよう……。\n@c0@"
"7":
  de: "@a@bMöchtest du den Stahlkasten zurückstellen?\n@c0@"
  en: "@a@bDo you want to put the steel strongbox back?\n@c0@"
  es: "@a@b¿Quieres volver a poner en su sitio la caja fuerte de acero?\n@c0@"
  fr: "@a@bVoulez-vous remettre le coffre-fort de fer en placeⓡ\n@c0@"
  it: "@a@bVuoi rimettere a posto la Salvarisparmi?\n@c0@"
  ja: "@a@b鉄のきんこを　もとに戻しますか？\n@c0@"
"8":
  de: "@a@b%0%a00120 stellt den Stahlkasten zurück an seinen Platz.\n@c0@"
  en: "@a@b%0%a00120 puts the steel strongbox back in its place.\n@c0@"
  es: "@a@b%0%a00120 vuelve a poner la caja fuerte de acero en su lugar.\n@c0@"
  fr: "@a@b%0%a00120 remet le coffre-fort de fer en place.\n@c0@"
  it: "@a@b%0%a00120 rimette a posto la Salvarisparmi.\n@c0@"
  ja: "@a@b%a00120は　鉄のきんこを\nもとに戻した。\n@c0@"
"9":
  de: "@a@b*: Hallo, Reisender. Du scheinst ja ein quicklebendiges Bürschchen zu sein. Wollen wir 'nen Foxtrott tanzen?\n@c1@"
  en: "@a@b*: Hello there, traveller. Ye're lookin' broit-eyed an' bushy-tailed, so y'are!\nCare to join me in a foxtrot?\n@c1@"
  es: "@a@b*: Saludos, viajero. Parieces astuto y taimado, sí.\n¿Bailamos un foxtrot?\n@c1@"
  fr: "@a@b*ⓢ Bien le bonjour, étranger. Quelles pattes puissantes et quel museau vous avezⓠ\nUn petit fox-trot, ça vous ditⓡ \n@c1@"
  it: "@a@b*: Salve, viaggiatore dall'occhi vivaci e dalla mente furba! Voi balla' con me un foxtrot?\n@c1@"
  ja: "@a@b＊「こんにちは　旅の人。\n\tさあ　私と　いっしょに\n\t踊りましょうよ！\n@c1@"
"10":
  de: "@a@b*: Das ist ja seltsam. Hier war kein Dorf, als ich vorhin vorbeigekommen bin. Darauf könnte ich schwören.\n@c2@"
  en: "@a@b*: That's strange... There was no village here when I passed by before. I'd stake me life on it.\n@c2@"
  es: "@a@b*: Qué extrañio... La otra viez que pasé por aquí no había ningún pueblo. Mi apostiaría una mano.\n@c2@"
  fr: "@a@b*ⓢ C'est étrange... Il n'y avait pas de village ici, la dernière fois que je suis passé. J'en mettrais ma main à couper.\n@c2@"
  it: "@a@b*: Strano... 'Un rihordo d'ave' visto huesto villaggio quand'ero passato di huì prima. Ci scommetterei l'osso de i'ccollo!\n@c2@"
  ja: "@a@b＊「はて？\n\t以前　この辺りに　立ち寄った時には\n\tこんな村は　なかったはずだが……。\n@c2@"
"11":
  de: "@a@b*: Hier soll es Füchse geben, die die Leute verhexen. Sie verwandeln sich in Menschen und legen dich herein. Also pass gut auf dich auf.\n@c2@"
  en: "@a@b*: There are foxes 'round about that are out to bewitch folk, so they say. They'll trick ye by turnin' themselves into human form.\n㈡\n*: Ye'd be wise to watch yer back.\n@c2@"
  es: "@a@b*: Dicien que hay zorros mierodeando para embrujar a las personas, sí. Para engañiarlas se convierten en humanos.\n㈡\n*: Será miejor que ti andes con cuidado.\n@c2@"
  fr: "@a@b*ⓢ On dit que dans le coin, il y a des renards qui ensorcellent les gens. Ils vous envoûtent en prenant forme humaine. Vous feriez bien de vous méfier.\n@c2@"
  it: "@a@b*: Si dice che ci siano a' giro delle volpi a cui garbi piglia' 'ngiro l'omini.\n㈡\n*: Riescono a ingannarli perché son capaci di trasformarsi in esseri umani. Bisogna tene' l'occhi aperti!\n@c2@"
  ja: "@a@b＊「この辺りには　人を化かす\n\tきつねが　いるそうです。\n\t気をつけてください。\n@c2@"
"12":
  de: "@a@b*: Schön, Euch kennen zu lernen, mein Herr! Archibald Tekt heiß ich, bin ein berühmter Baukünstler und ziemlich fleißig!\n@c2@"
  en: "@a@b*: Pleased to meet ye, sir! Archie O'Tect's the name. A travellin' architect o' fame! But I'm head over heels in love with this foxy wan, now.\n@c2@"
  es: "@a@b*: ¡Encantiado, amigo! Mi nombre es Al Quitecto. ¡El fiamoso arquitiecto ambulante! Mi he eniamorado de esta muchachita tan sexy.\n@c2@"
  fr: "@a@b*ⓢ Enchantéⓠ Hector Busier, architecte itinérant pour vous servirⓠ Je suis tombé follement amoureux de cette dame flamboyante.\n@c2@"
  it: "@a@b*: Se permetti, mi presento! Io sono Archie Tett, architetto di portento!\n@c2@"
  ja: "@a@b＊「私は　ドン・ガアデ。\n\t旅の建築家ですが\n\tこいつに　ホレられてしまって……。\n@c2@"
"13":
  de: "@aArchibald@bIch ziehe durch die Lande und biete meine Dienste an, aber jetzt hab ich mich Hals über Kopf verliebt. Und zwar in diese schöne Füchsin hier!\n㈡\nIch werd sie heiraten, oh ja! Und mit ihr hier wohnen im schönen Fuchsweiler, das ist doch klar! Ha ha!\n@c2@"
  en: "@aArchie O'Tect@bI'm gonna marry her, so I am!\nAn' come an' live with her in this wee village o' Shinnock. Ha ha ha!\n@c2@"
  es: "@aAl Quitecto@b¡Mi voy a casiar con ella!\nY mi vendré a vivir a este pueblito de Alameda. ¡Ja, ja, ja!\n@c2@"
  fr: "@aHector Busier@bJe vais l'épouserⓠ\nEt je vais m'installer avec elle dans ce joli petit village de Reginhart. Ha ha haⓠ\n@c2@"
  it: "@aArchie Tett@bSon sempre 'ngiro e mi sveglio presto la mattina, e ora amo una fanciulla che somiglia a una faina!\n㈡\n*: La voglio sposa'! Poi noi in codesto paesino che si hiama Foxia a vive' si verrà. Ah! Ah! Ah!\n@c2@"
  ja: "@a@bドン・ガアデ「結婚して　この村に\n\t住むことにしたのです。　わっはっはっ。\n@c2@"
"14":
  de: "@a@b*: Hier ist noch viel Platz, Süßer. Du kannst auch hier leben, wenn du willst.\n@c1@"
  en: "@a@b*: There's plenty o' space in the den fer more cubs. You can come an' live here too, if ye loik.\n@c1@"
  es: "@a@b*: Hay sitio en la madriguiera para más cachiorros. Si quieres, puedes vienir a vivir aquí tú también.\n@c1@"
  fr: "@a@b*ⓢ Nous avons encore de la place pour tous les petits rusés dans votre genre. Vous pouvez venir vivre avec nous, si vous voulez.\n@c1@"
  it: "@a@b*: Qui c'è posto per tutti, sai? Vieni pure te a vive' qui, se ti garba! Questa sì che sarebbe una scelta furba come una...\n㈡\n*: Ehm, sarebbe una scelta molto furba.\n@c1@"
  ja: "@a@b＊「あなたも　この村で\n\t暮らせばいいのに……。\n@c1@"
"15":
  de: "@a@b*: Mein Oller war auch ein Reisender. Doch dann ist er hierher zu mir gekommen. Grrr, grrr, grrr, grrr!... Ähem!\n@c1@"
  en: "@a@b*: Me own fella was a traveller before.\nBut now he's come to live here with me.\nGrrr-ruff. Ruff, ruff, ruff! ...Ahem!\n@c1@"
  es: "@a@b*: Mi compañiero también era viajero antes.\nPero ahora ha vienido a vivir aquí conmigo.\nGrrr-ruff. ¡Grrr, gruff, gruff! ¡Ejem!\n@c1@"
  fr: "@a@b*ⓢ Mon compagnon à moi était un grand voyageur autrefois. Mais maintenant, il s'est installé avec moi.\nOuouf, ouuuuh... humⓠ\n@c1@"
  it: "@a@b*: Pure il mio amico era sempre in giro per il mondo, ma ora ha deciso di veni' a vive' huì con me! Grrr-ruff. Ruff, ruff, ruff! Ahem...!\n@c1@"
  ja: "@a@b＊「ウチの人も　はじめは　旅人として\n\tこの村に　来たのですよ。\n\tこんこんこん……。\n@c1@"
"16":
  de: "@a@b*: Ach, du liebes Bisschen... Hab wohl zu viel Hühnerfleisch gegessen... Da fuchst mich was im Hals!\n@c1@"
  en: "@a@b*: Oh, dear... I moit have a bad dose o' the splutters comin' on...\nI'm feelin' a bit grrruff in the throat!\n@c1@"
  es: "@a@b*: ¡Oh!, vaya... Crieo que mi está dando un catarro...\n¡Mi garganta está un poco riasposa!\n@c1@"
  fr: "@a@b*ⓢ Oh non... Ce doit être une mauvaise toux...\nJ'ai comme une boule de poils coincée dans la gorgeⓠ\n@c1@"
  it: "@a@b*: Maremma volpina... Mi sa che ho esagerato col cibo... Mi sento come se avessi mangiato un intero pollaio...\n@c1@"
  ja: "@a@b＊「あら？\n\tカゼを　ひいちゃったみたい。\n@c1@"
"17":
  de: "@a@b*: Willkommen, Reisender. Weißt wohl nicht mehr, wie du hier raus kommst, nicht wahr? Hast dich verirrt, oder?\n@c2@"
  en: "@a@b*: Welcome, traveller.\nCan't sniff yer way out of here, is it?\nYe're lost, are ye?\n@c2@"
  es: "@a@b*: Bienvienido, viajero.\nNo ti hueles dónde está la salida, ¿vierdad?\nTi has pierdido, ¿eh?\n@c2@"
  fr: "@a@b*ⓢ Bienvenue, voyageur.\nVous ne retrouvez pas votre cheminⓡ\nVous êtes perdu, c'est çaⓡ\n@c2@"
  it: "@a@b*: Benvenuto, viaggiatore. Te tu ti se' perso, diho bene? Eh, 'un sei miha furbo come una volpe, te.\n@c2@"
  ja: "@a@b＊「ようこそ　旅のお方。\n\t道にでも　迷いましたかな？\n@c2@"
"18":
  de: "@a@b*: Das ist gar nicht schön. Da könnte man fuchsteufelswild werden. Möchtest du denn die Nacht hier verbringen?\n@c2@"
  en: "@a@b*: Well that must be a desperate worry for ye now. And ye look as ruff as a dog to go with it.\nWould ye care to spend the noit here?\n@c2@"
  es: "@a@b*: Debes de estar muy prieocupado por eso. Y adiemás pareces estar de un humor de zorros, digo, perros. ¿Quieres pasar la nochie aquí?\n@c2@"
  fr: "@a@b*ⓢ Vous devez être terriblement inquiet. Sans terrier pour la nuit...\nVous voulez peut-être dormir iciⓡ\n@c2@"
  it: "@a@b*: Questo sì ch'è un bel problema! Sembri un cucciolo che s'è perso! Che ti va di passa' la notte huì?\n@c2@"
  ja: "@a@b＊「それは　お困りでしょう。\n\t見たところ　お疲れのようすだし\n\t泊まってゆかれては　どうですか？\n@c2@"
"19":
  de: "@a@b*: Wunderbar! Dann wünsch ich dir eine gute Nacht und süße Träume. Und lass dich nicht von den Flöhen, äh, Bettwanzen beißen.\n@c2@"
  en: "@a@b*: Aye, I thought that ye moit!\nLet the faeries whisk y'away, then!\nMind the fleasⓚⓛ I mean, bed bugs don't bite!\n@c2@"
  es: "@a@b*: Sí, ya lo imaginé. ¡Diéjate caer en los brazos de Morfeo! ¡Seguro que ti quitas de encima las malas pulgas, digo, las prieocupaciones!\n@c2@"
  fr: "@a@b*ⓢ Je me doutais que vous diriez ouiⓠ Alors détendez-vousⓠ Mais faites attention aux puces... euh, aux punaises, je veux direⓠ\n@c2@"
  it: "@a@b*: Perfetto, hosì mi garbi! Lasciati culla' dalle fate! E non farti morsica' dalle pulci... Ehm, volevo di', dagli Scarasonno!\n@c2@"
  ja: "@a@b＊「では　どうぞ　ごゆっくり\n\tお休みください。\n@c2@"
"20":
  de: "@a@b*: Wirklich? Na gut. Dann wünsche ich dir alles Gute für deine weitere Reise.\n@c2@"
  en: "@a@b*: Really? Fair play to ye then.\nI wish y'all the best on yer onward journey.\nHe he heruff!\n@c2@"
  es: "@a@b*: Pues vale.\nTi deseo un viaje placientero.\n¡Je, je, jerrr!\n@c2@"
  fr: "@a@b*ⓢ Ah nonⓡ Eh bien, tant mieux.\nBonne chance pour la suite de votre voyage.\nHi hi ouuuuuuhⓠ\n@c2@"
  it: "@a@b*: Davvero? Come preferisci! Allora ti auguro buon viaggio! Eh! Eh! Eh! Ruff! Ehm... \n@c2@"
  ja: "@a@b＊「そうですか……。\n\tでは　気をつけて　旅を\n\t続けられますように。　ほっほっほっ。\n@c2@"
