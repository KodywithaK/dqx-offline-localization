"2":
  de: "@a@b*: Grrr-wuff! Der Krone des Yggdrasil-Baumes entströmt ein fuchsiger Geruch.\n@c2@"
  en: "@a@b*: Grrr-ruff! There's an infoxicating smell coming from the top of the Yggdrasil tree.\n@c2@"
  es: "@a@b*: ¡Grrr-ruff! Un intenso olor llega de la copa del árbol Yggdrasil.\n@c2@"
  fr: "@a@b*ⓢ Grrr ououffⓠ Une odeur écœurante émane du sommet de l'Yggdrasil.\n@c2@"
  it: "@a@b*: Grrr-ruff! Dall'albero Ygdrasil si sprigiona un profumo tutt'altro che sgradevolpe... Ehm, volevo dire sgradevole! Grrr-ruff!\n@c2@"
  ja: "@a@b＊「こんこん。　世界樹の\n\tてっぺんから　なんだか\n\tとってもいい香りがするよ！\n@c2@"
"3":
  de: "@a@b*: Miau...\nYggdrasil spendet genug Schatten für alle. Genau richtig für ein kleines Nickerchen...\n@c1@"
  en: "@a@b*: Meow...\nYggdrasil gives enough shade for everyone.\nJust right for catnapping...\n@c1@"
  es: "@a@b*: Miau...\nYggdrasil proporciona cobijo a todo el mundo.\nPerrrfecto para una siesta gatuna...\n@c1@"
  fr: "@a@b*ⓢ Miaouu...\n㈡\n*ⓢ L'Yggdrasil fait suffisamment d'ombre pour que tout le monde en profite... pour faire une sieste, par exemple...\n@c1@"
  it: "@a@b*: Miao...\nYgdrasil è abbastanza grande da far ombra a tutti.\nÈ l'ideale purrr schiacciare un pisolino...\n@c1@"
  ja: "@a@b＊「にゃーん。\n\t世界樹の木かげは\n\tすずしくて　きもちいいニャー。\n@c1@"
"4":
  de: "@a@b*: Diese Monster heutzutage!\nSie belästigen sogar schon Yggdrasil. Nein, nirgendwo kann man mehr sicher sein...\n@c3@"
  en: "@a@b*: The monsters of today!\nTheyⓙre even infesting Yggdrasil these days.\nNope. Nowhereⓙs safe any more...\n@c3@"
  es: "@a@b*: ¡Los monstruos de hoy!\nEn estos días incluso infestan Yggdrasil.\nNo. Ya no hay ningún lugar seguro...\n@c3@"
  fr: "@a@b*ⓢ Ah les monstres d'aujourd'huiⓠ\nIls envahissent même l'Yggdrasil.\nVraiment, il n'y a plus d'endroit sûr de nos jours...\n@c3@"
  it: "@a@b*: Ah, questi mostri di oggi!\nInfestano persino Ygdrasil ultimamente. Non c'è niente da fare, non si sta tranquilli da nessuna parte...\n@c3@"
  ja: "@a@b＊「近ごろ　世界樹にも\n\t魔物たちが　住みつきだしてのう。\n\tぶっそうな世の中じゃわい……。\n@c3@"
"5":
  de: "@a@b*: Die Krone von Yggdrasil besteht aus dichtem Blattwerk. Und bei diesen Blättern handelt es sich um... Yggdrasil-Blätter.\n@c1@"
  en: "@a@b*: The top of Yggdrasil is thick with leaves.\nYggdrasil leaves.\n@c1@"
  es: "@a@b*: La copa de Yggdrasil está repleta de hojas, hojas de Yggdrasil.\n@c1@"
  fr: "@a@b*ⓢ La cime de l'Yggdrasil est pleine de feuilles... des feuilles d'Yggdrasil.\n@c1@"
  it: "@a@b*: La cima di Ygdrasil è piena di foglie. Foglie di Ygdrasil, ovviamente.\n@c1@"
  ja: "@a@b＊「世界樹の葉は　心正しき旅人を\n\t助けるものと　聞きます。\n@c1@"
"6":
  de: "@a@b*: Sie sind wirklich sehr nützlich, man sollte immer welche bei sich tragen.\n@c1@"
  en: "@a@b*: Theyⓙre very useful to have on you.\nVery, very useful indeed.\n@c1@"
  es: "@a@b*: Es muy útil llevarlas.\nExtremadamente útil.\n@c1@"
  fr: "@a@b*ⓢ Elles peuvent être très utiles.\nTrès très utiles, même.\n@c1@"
  it: "@a@b*: Sono delle foglie utili.\nAnzi, utilissime.\n@c1@"
  ja: "@a@b＊「そして　世界樹の花は\n\t奇跡を起こすそうですわ。\n@c1@"
"7":
  de: "@a@b*: Yggdrasil-Blumen sind atemberaubend schön!\n@c1@"
  en: "@a@b*: Yggdrasil flowers are absolutely beautiful!\n@c1@"
  es: "@a@b*: ¡Las flores de Yggdrasil son extraordinariamente hermosas!\n@c1@"
  fr: "@a@b*ⓢ Les fleurs d'Yggdrasil sont absolument magnifiquesⓠ\n@c1@"
  it: "@a@b*: I fiori di Ygdrasil sono meravigliosi!\n@c1@"
  ja: "@a@b＊「世界樹の花は　とっても\n\tきれいなのよ！\n@c1@"
"8":
  de: "@a@b*: Sie blühen nur einmal alle tausend Jahre, und bald ist es wieder so weit. Ich kann es kaum abwarten!\n@c1@"
  en: "@a@b*: They blossom once every thousand years, and one's due to come out soon. I can hardly wait!\n@c1@"
  es: "@a@b*: Florecen una vez cada mil años y se supone que una de ellas saldrá pronto. ¡Estoy impaciente por verlo!\n@c1@"
  fr: "@a@b*ⓢ Elles fleurissent une fois tous les mille ans, et l'une d'entre elles doit éclore bientôt.\nJ'ai hâteⓠ\n@c1@"
  it: "@a@b*: La fioritura avviene una volta ogni mille anni e, se i miei calcoli sono esatti, tra poco dovrebbe sbocciarne uno... Evviva! Non vedo l'ora!\n@c1@"
  ja: "@a@b＊「そういえば　そろそろ\n\t千年に一度　花が咲く頃ね。\n\t楽しみだわ！\n@c1@"
"9":
  de: "@a@b*: Der Yggdrasil-Baum besitzt viele mysteriöse Kräfte.\n@c1@"
  en: "@a@b*: The Yggdrasil tree possesses mysterious powers.\n@c1@"
  es: "@a@b*: El árbol Yggdrasil posee misteriosos poderes.\n@c1@"
  fr: "@a@b*ⓢ L'Yggdrasil possède de mystérieux pouvoirs.\n@c1@"
  it: "@a@b*: L'albero Ygdrasil possiede poteri misteriosi.\n@c1@"
  ja: "@a@b＊「この世界樹には\n\t不思議なチカラがあるのよ。\n@c1@"
"10":
  de: "@a@b*: Sowohl seine Blätter als auch der Morgentau, der von ihm abfällt, können Verletzungen heilen.\n@c1@"
  en: "@a@b*: Both its leaves and the morning dew that falls from it have the power to heal the injured.\n@c1@"
  es: "@a@b*: Tanto sus hojas como el rocío matutino que cae de ellas tienen el poder de curar a los heridos.\n@c1@"
  fr: "@a@b*ⓢ Ses feuilles, de même que la rosée du matin qui s'en égoutte, ont le pouvoir de soigner les blessés.\n@c1@"
  it: "@a@b*: Le sue foglie e le gocce di rugiada che cadono da esso hanno poteri curativi.\n@c1@"
  ja: "@a@b＊「葉も　世界樹から落ちた\n\t朝露のしずくも　傷ついた人を\n\tいやしてくれるんですって！\n@c1@"
"11":
  de: "@a@b*: Und seine Blumen sind so mächtig, dass sie selbst jene wieder zum Leben erwecken können, bei denen Kirche und Zauberkraft bereits versagt haben!\n@c1@"
  en: "@a@b*: Its flowers even have the power to restore life to those beyond the healing powers of churches and magic!\n@c1@"
  es: "@a@b*: ¡Sus flores tienen incluso el poder de restablecer la vida a aquellos que están más allá de los poderes de sanación de las iglesias y de la magia!\n@c1@"
  fr: "@a@b*ⓢ Ses fleurs ont même le pouvoir de rendre la vie à ceux que ni l'église, ni la magie ne peuvent ressusciterⓠ\n@c1@"
  it: "@a@b*: I suoi fiori sono in grado di restituire la vita anche a chi non è più su questo mondo e non può essere aiutato dai poteri magici né da quelli religiosi.\n@c1@"
  ja: "@a@b＊「そして　世界樹の花は\n\tどんな生命もよみがえらせるって\n\t伝えられているわ！\n@c1@"
