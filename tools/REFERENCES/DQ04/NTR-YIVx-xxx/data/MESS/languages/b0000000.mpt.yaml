"0":
  de: "@a@bDiese Geschichte handelt von Palastwächtern in einem kleinen Königreich namens Burland.\n@c0@"
  en: "@a@bThis is a tale of palace guards in a small kingdom called Burland.\n@c0@"
  es: "@a@bEsta es la historia de los guardias de palacio de un pequeño reino llamado Burlandia.\n@c0@"
  fr: "@a@bVoici l'histoire des gardes du palais d'un petit royaume appelé Bastione.\n@c0@"
  it: "@a@bQuesta storia narra le avventure delle guardie di palazzo del piccolo regno di Burlandia.\n@c0@"
  ja: "@a@bこれは　バトランドという　小さな国の\n王宮戦士の物語。\n@c0@"
"1":
  de: "@a@bEiner von ihnen ist der tapfere Soldat Ragnar Rauhbein.\n@c0@"
  en: "@a@bAmong their number is a brave soldier by the name of Ragnar McRyan.\n@c0@"
  es: "@a@bEntre ellos se encuentra un valiente soldado que responde al nombre de Ragnar McRyan.\n@c0@"
  fr: "@a@bParmi ces gardes se trouve un courageux soldat, répondant au nom de Ragnar McRyan.\n@c0@"
  it: "@a@bTra di loro c'era un soldato coraggioso che risponde al nome di Galiardo de' Guglielmi.\n@c0@"
  ja: "@a@bライアン　つまり　あなたも\nその王宮戦士の　ひとりでした。\n@c0@"
"2":
  de: "@a@bEines Morgens ruft König Burkhard alle Wächter in den Thronsaal des Schlosses.\n@c0@"
  en: "@a@bOne morning, King Burnard summons all of the guards to the main hall of the castle.\n@c0@"
  es: "@a@bUna mañana, el rey Recaredo convoca a todos los guardias en el salón principal del castillo.\n@c0@"
  fr: "@a@bUn beau matin, le roi Bastien convoque tous ses gardes dans le grand hall du château.\n@c0@"
  it: "@a@bUn giorno, Re Basilio convocò tutte le guardie nel salone principale del suo castello.\n@c0@"
  ja: "@a@bある朝　王さまは　戦士たちを\nお城の広間に　呼び集めました……。\n@c0@"
"3":
  de: "@a@b*: Seine Majestät hat Euch etwas zu sagen. Also seid still und hört zu.\n@c2@"
  en: "@a@b*: His Majesty is aboot tae make an announcement tae youse all. \nSimmer doon an' listen noo.\n@c2@"
  es: "@a@b*: Su Majestad está a punto de efectuar una proclama para todos, caballeros. \nGuarden silencio y escuchen.\n@c2@"
  fr: "@a@b*ⓢ Sa Majesté va vous faire une annonce.\nÀ présent, calmez-vous et écoutez.\n@c2@"
  it: "@a@b*: Sua Maestà Eccellentissima ha una comunicazione da fare a tutti voi. Prestate attenzione, e ascoltate bene.\n@c2@"
  ja: "@a@b＊「これより　王さまから\n\tそなたたちに　お話がある。\n\t心して聞くように。\n@c2@"
"4":
  de: "@aKönig Burkhard@bSteht bequem, Männer.\n@c2@"
  en: "@aKing Burnard@bAt ease, men.\n@c2@"
  es: "@aRey Recaredo@bA discreción, caballeros.\n@c2@"
  fr: "@aRoi Bastien@bRepos, soldats.\n@c2@"
  it: "@aRe Basilio@bA riposo, miei prodi.\n@c2@"
  ja: "@a@b王「みなのもの　楽にしてよいぞ。\n@c2@"
"5":
  de: "@aKönig Burkhard@bSicher wisst Ihr bereits, worum es mir heute geht.\n@c2@"
  en: "@aKing Burnard@bNo doubt youse all ken whit it is I want tae talk tae youse aboot.\n@c2@"
  es: "@aRey Recaredo@bSin duda ya sabrán todos de qué tengo intención de hablarles.\n@c2@"
  fr: "@aRoi Bastien@bJ'imagine que vous savez ce dont je veux vous parler.\n@c2@"
  it: "@aRe Basilio@bSarete certo già a conoscenza di ciò di cui sto per parlarvi.\n@c2@"
  ja: "@a@b王「さて　話というのは　ほかでもない。\n@c2@"
"6":
  de: "@aKönig Burkhard@bAuch habt Ihr wohl alle schon gehört, dass in letzter Zeit immer wieder Kinder verschwinden.\n@c2@"
  en: "@aKing Burnard@bI'm sure youse all will hae heard rumours aboot the wee kiddies gaein' missin' of late.\n@c2@"
  es: "@aRey Recaredo@bEstoy seguro de que habrán llegado a sus oídos los rumores acerca de recientes desapariciones de chiquillos.\n@c2@"
  fr: "@aRoi Bastien@bJe suis sûr que vous avez tous entendu les rumeurs à propos des récentes disparitions d'enfants.\n@c2@"
  it: "@aRe Basilio@bAvrete sicuramente udito la notizia che, negli ultimi tempi, molti fanciulli sono scomparsi in modo misterioso.\n@c2@"
  ja: "@a@b王「最近　子供たちが\n\tいなくなるという　うわさは\n\tお前たちも　聞いておろう。\n@c2@"
"7":
  de: "@aKönig Burkhard@bErst heute Morgen haben mich wieder ein paar Mütter aus Auenfelde wegen ihrer Kinder aufgesucht.\n@c2@"
  en: "@aKing Burnard@bOch, just this morn, I've had mothers from Strathbaile here cryin' aboot their bairns.\n@c2@"
  es: "@aRey Recaredo@bEsta misma mañana he recibido a algunas madres de Candonga que se lamentaban por sus retoños.\n@c2@"
  fr: "@aRoi Bastien@bEh bien, ce matin même, des mères sont venues depuis Strattbourg pour me faire part de leur désespoir.\n@c2@"
  it: "@aRe Basilio@bProprio questa mattina, alcune madri di Bellavalle sono venute qui a dirmi che i loro pargoli sono scomparsi!\n@c2@"
  ja: "@a@b王「けさも　イムルの村より\n\t母親たちが　涙ながらに\n\tうったえてきておる。\n@c2@"
"8":
  de: "@aKönig Burkhard@bAber Kinder lösen sich nicht einfach in Luft auf! Klaut da etwa ein Schurke unsere Kleinen?\n@c2@"
  en: "@aKing Burnard@bHoo can kiddies be disappearin' like this? Is some rogue snatchin' oor poor mites away?\n@c2@"
  es: "@aRey Recaredo@b¿Cómo es posible que los pequeñuelos estén desapareciendo así? ¿Es que algún desalmado está raptando a nuestras criaturas?\n@c2@"
  fr: "@aRoi Bastien@bComment des enfants peuvent-ils disparaître ainsiⓡ Est-ce qu'un rôdeur enlèverait nos pauvres petitsⓡ\n@c2@"
  it: "@aRe Basilio@bCome possono dei fanciulli sparire in questo modo? C'è forse una banda di briganti che li rapisce per qualche scopo misterioso?\n@c2@"
  ja: "@a@b王「なにゆえ　子供がいなくなるのか？\n\t何者かが　さらっているのか！？\n@c2@"
"9":
  de: "@aKönig Burkhard@bAls König dieses schönen Landes kann ich mir das nicht länger tatenlos ansehen.\n@c2@"
  en: "@aKing Burnard@bAs king o' this bonnie land, I cannae verra well stand by an' let this continue.\n@c2@"
  es: "@aRey Recaredo@bComo rey de este hermoso país, no puedo permitir bajo ningún concepto que se prolongue esta situación.\n@c2@"
  fr: "@aRoi Bastien@bEn tant que roi de ce beau pays, je ne peux tolérer de telles choses.\n@c2@"
  it: "@aRe Basilio@bIn qualità di sovrano di queste nobili terre, è mio dovere porre rimedio a una situazione tanto spiacevole.\n@c2@"
  ja: "@a@b王「この国の王として　もはや\n\tほうっておくわけには　いかぬ。\n@c2@"
"10":
  de: "@aKönig Burkhard@bFindet heraus, was da los ist, und erstattet mir Bericht, Männer. Und nun fort mit Euch!\n@c2@"
  en: "@aKing Burnard@bFind oot whit's gaein' on an' report back tae me, men. Away wi' youse!\n@c2@"
  es: "@aRey Recaredo@bDeben averiguar qué es lo que está aconteciendo e informarme de inmediato, caballeros. ¡Pónganse en marcha!\n@c2@"
  fr: "@aRoi Bastien@bGardes, découvrez ce qui se trame et revenez me faire un rapport. Allez, rompezⓠ\n@c2@"
  it: "@aRe Basilio@bIndagate sull'accaduto, e quando avrete scoperto qualcosa, tornate a rapporto da me. Andate, uomini!\n@c2@"
  ja: "@a@b王「ことの真意をたしかめ\n\tこのわしに　報告せよ！\n\tゆけ！　わが戦士たちよっ！\n@c2@"
"11":
  de: "@a@b*: Guter Soldat, ich bitt' Euch, bringt mir meinen Bub wohlbehalten zurück!\n@c1@"
  en: "@a@b*: Good sir! I'm beggin' ye! Please bring ma bairn back safe an' soond!\n@c1@"
  es: "@a@b*: ¡Mi señor! ¡Se lo ruego! ¡Devuélvanme a mi pequeño sano y salvo!\n@c1@"
  fr: "@a@b*ⓢ Messire, je vous en supplieⓠ Ramenez-moi mon enfant sain et saufⓠ\n@c1@"
  it: "@a@b*: Nobile soldato, ti prego! Riporta a casa sano e salvo il sangue del mio sangue!\n@c1@"
  ja: "@a@b＊「戦士さま！　お願いです。\n\tどうか　私たちの子供を\n\tさがしてください。\n@c1@"
"12":
  de: "@a@b*: Ich weiß, dass mein Bub noch lebt, aber Ihr müsst Euch sputen, sonst ist's vielleicht zu spät!\n@c1@"
  en: "@a@b*: I'm sure ma wee one's still alive, but if ye dinnae hurry, it may be too late.\n@c1@"
  es: "@a@b*: Estoy segura de que mi hijito sigue vivo, pero si no se da prisa, quizá sea demasiado tarde.\n@c1@"
  fr: "@a@b*ⓢ Je suis sûre que mon petit est toujours en vie, mais si vous ne vous hâtez pas, il sera peut-être trop tard.\n@c1@"
  it: "@a@b*: Sono certa che sta bene ma, se non ti sbrighi, potrebbe capitargli qualcosa!\n@c1@"
  ja: "@a@b＊「あの子は　まだ生きています。\n\tああ　でも急がないと　手遅れに\n\tなってしまう。　そんな気が……。\n@c1@"
"13":
  de: "@aKönig Burkhard@bAch, Ihr seid doch Ragnar Rauhbein? Ich muss sagen, die Sache ist mir ein Rätsel.\n@c2@"
  en: "@aKing Burnard@bOh, it's Ragnar McRyan, is it no? \nI must say, I'm findin' this whole situation more than a wee bit puzzlin'.\n@c2@"
  es: "@aRey Recaredo@b¡Oh!, es Ragnar McRyan, ¿verdad? \nDebo decir que esta situación me resulta un tanto confusa.\n@c2@"
  fr: "@aRoi Bastien@bOh, voilà Ragnar McRyan, c'est bien çaⓡ\nJe dois avouer que je trouve toute cette histoire vraiment très étrange.\n@c2@"
  it: "@aRe Basilio@bAh, tu sei Galiardo de' Guglielmi, non è così? Devo ammettere che la situazione è quantomeno sconcertante.\n@c2@"
  ja: "@a@b王「おお　そなたはライアンじゃな。\n\tこのたびの事件　まったく\n\tどうなっておるのやら……。\n@c2@"
"14":
  de: "@aKönig Burkhard@bAber gewiss können wir herausfinden, was da los ist, wenn wir mit den Leuten hier reden und uns anhören, was sie zu sagen haben.\n@c2@"
  en: "@aKing Burnard@bBut I'm full o' hope that we'll get tae the bottom of it all if we talk tae the good folk of oor land an' see whit they hae tae say.\n@c2@"
  es: "@aRey Recaredo@bPero confío en que podremos llegar al fondo del asunto si hablamos con las buenas gentes de nuestro país y averiguamos qué tienen que decir.\n@c2@"
  fr: "@aRoi Bastien@bMais j'ai bon espoir de découvrir la vérité en parlant aux bonnes gens de notre pays et en écoutant ce qu'ils ont à nous dire. \n@c2@"
  it: "@aRe Basilio@bSono convinto, però, che ne verremo a capo. Parla con gli abitanti del regno, e ascolta ciò che hanno da dirti.\n@c2@"
  ja: "@a@b王「だが　根気よく　人々の声に\n\t耳をかたむければ　おのずと\n\t真実が見えてくるはずじゃ。\n@c2@"
"15":
  de: "@aKönig Burkhard@bIch verlass mich auf Euch, Ragnar Rauhbein. Viel Glück und der Göttin Segen.\n@c2@"
  en: "@aKing Burnard@bI'm dependin' on ye, Ragnar McRyan. Good luck an' Goddesspeed.\n@c2@"
  es: "@aRey Recaredo@bMe pongo en sus manos, Ragnar McRyan.\nBuena suerte y buen viaje.\n@c2@"
  fr: "@aRoi Bastien@bJe compte sur vous, Ragnar McRyan. Bonne chance, et que la Déesse hâte vos pas.\n@c2@"
  it: "@aRe Basilio@bSo che non mi deluderai, Galiardo de' Guglielmi. Che la buona sorte ti sia amica, e che la dea ti assista!\n@c2@"
  ja: "@a@b王「そなたの活躍を　期待しておるぞ。\n\tライアンよ。\n@c2@"
"16":
  de: "@a@b*: Huch! Was steht Ihr denn noch da?! Ihr solltet doch längst fort sein, so wie die anderen auch.\n@c2@"
  en: "@a@b*: Jings! Whit are ye still daein' here? Ye should be away by now, else the other guards'll be well ahead o' ye.\n@c2@"
  es: "@a@b*: ¡Demonios! ¿Qué está haciendo aquí aún? Ya debería haber salido. Los demás guardias le tomarán la delantera.\n@c2@"
  fr: "@a@b*ⓢ Par les cieuxⓠ Que faites-vous encore iciⓡ Vous devriez déjà être parti. Les autres gardes risquent de prendre beaucoup d'avance sur vous.\n@c2@"
  it: "@a@b*: Diamine! Cosa ci fai ancora qui?! Se non ti muovi, le altre guardie ti lasceranno indietro!\n@c2@"
  ja: "@a@b＊「ささ　何をしておる。\n\tはやく　ゆかぬか。\n\t他の戦士たちに　おくれを取るぞ。\n@c2@"
"17":
  de: "@a@b*: Na, du hast ja die Ruhe weg, Rauhbein. Bist aber ein guter Soldat. Wirst schon wissen, was du tust.\n@c3@"
  en: "@a@b*: Well, ye're certainly takin' yer time, McRyan!\nOch, but ye're a good soldier, an' that's a fact. \nI'm sure ye hae yer reasons.\n@c3@"
  es: "@a@b*: ¡Se lo toma con calma, de eso no hay duda, McRyan! Aunque es un buen soldado. Estoy seguro de que tendrá sus razones.\n@c3@"
  fr: "@a@b*ⓢ Eh bien, on peut dire que vous prenez votre temps, McRyanⓠ Mais vous êtes un bon soldat, alors vous devez avoir vos raisons.\n@c3@"
  it: "@a@b*: Ma bene, de' Guglielmi! Te la stai prendendo comoda, eh? Beh, tutto sommato sei un soldato in gamba, e avrai le tue buone ragioni per comportarti così.\n@c3@"
  ja: "@a@b＊「まあ　のんびりやろうや　ライアン。\n\tと言っても　お前は　まじめだから\n\tさぼったり　できないだろうけどな。\n@c3@"
"18":
  de: "@a@b*: Bitte bringt uns unsere Kinderchen zurück!\n@c1@"
  en: "@a@b*: Please find oor bairns for us!\n@c1@"
  es: "@a@b*: ¡Por favor, encuentre a nuestros chiquillos!\n@c1@"
  fr: "@a@b*ⓢ S'il vous plaît, retrouvez nos enfantsⓠ\n@c1@"
  it: "@a@b*: Per favore, ritrova i nostri figli!\n@c1@"
  ja: "@a@b＊「戦士さま！\n\tどうか　私たちの子供を\n\t探してください！\n@c1@"
"19":
  de: "@a@b*: Ich weiß einfach, dass sie noch am Leben sind. Aber Ihr müsst sie schnell finden, bevor es zu spät ist!\n@c1@"
  en: "@a@b*: I just ken they're still alive. But ye have tae find them fast, afore it's too late!\n@c1@"
  es: "@a@b*: Estoy segura de que siguen vivos. ¡Pero debe encontrarlos antes de que sea demasiado tarde!\n@c1@"
  fr: "@a@b*ⓢ Je sais qu'ils sont encore vivants. Mais vous devez les retrouver au plus vite, avant qu'il ne soit trop tardⓠ\n@c1@"
  it: "@a@b*: Sento che sono ancora vivi! Devi sbrigarti a trovarli, altrimenti potrebbe accadergli qualcosa di terribile!\n@c1@"
  ja: "@a@b＊「子供たちは　きっと生きています。\n\t手遅れにならないうちに\n\tどうか　早く……！！\n@c1@"
"20":
  de: "@a@b*: Immer sachte da draußen, Ragnar.\n㈡\n*: Wenn du verletzt wirst, komm schnell in die Stadt zurück und such eine Herberge auf, um wieder zu Kräften zu kommen.\n@c2@"
  en: "@a@b*: Dinnae push yerself too hard oot there, Ragnar. If ye get hurt in battle, away wi' ye tae toon an' stay at an inn tae recover.\n@c2@"
  es: "@a@b*: No fuerce las cosas, Ragnar. Si lo hieren en combate, retírese a la ciudad y pernocte en una posada hasta recuperarse.\n@c2@"
  fr: "@a@b*ⓢ Ne vous épuisez pas, Ragnar. Si vous êtes blessé au combat, revenez en ville...\n㈡\n*ⓢ ... et reposez-vous dans une auberge pour reprendre des forces.\n@c2@"
  it: "@a@b*: Fai attenzione, Galiardo. Se resterai ferito in battaglia, dovrai recarti in una locanda in città e riposare finché non ti sarai ristabilito.\n@c2@"
  ja: "@a@b＊「ライアンどの。\n\t戦いでキズついたら　ムリをせず\n\t町にもどり　宿に泊まるのですぞ。\n@c2@"
"21":
  de: "@a@b*: Wenn du eine längere Reise unternehmen willst, besorg dir ein paar Heilkräuter. Ein paar von denen im Gepäck zu haben kann nicht schaden.\n@c2@"
  en: "@a@b*: If yer journey's lookin' tae be a long one, get yerself some medicinal herbs. Ye willnae hae any trouble wi' a few o' them under yer belt.\n@c2@"
  es: "@a@b*: Si su viaje tiene visos de alargarse, consiga algunas plantas medicinales. Lleve unas pocas en el cinto y todo irá como la seda.\n@c2@"
  fr: "@a@b*ⓢ Si vous partez pour un long voyage, procurez-vous quelques herbes médicinales. Avec ça sur vous, vous serez tranquille.\n@c2@"
  it: "@a@b*: Se stai per iniziare un lungo viaggio, procurati delle erbe medicinali. Portale con te, perché ti saranno molto utili.\n@c2@"
  ja: "@a@b＊「長旅になりそうなら　道具屋で\n\t薬草を買ってゆくといい。\n\tそなえあれば　うれいなし　だ。\n@c2@"
"22":
  de: "@a@b*: Dies ist die schöne Burg Burland.\n@c2@"
  en: "@a@b*: This is bonnie Burland Castle.\n@c2@"
  es: "@a@b*: Este es el soberbio Castillo de Burlandia.\n@c2@"
  fr: "@a@b*ⓢ Ceci est le beau château de Bastione.\n@c2@"
  it: "@a@b*: Questo è il nostro amato castello di Burlandia.\n@c2@"
  ja: "@a@b＊「ここは　バトランドのお城。\n@c2@"
"23":
  de: "@a@b*: Zwielichtige Gestalten kommen mir hier nicht rein.\n@c2@"
  en: "@a@b*: I willnae allow any suspicious-lookin' folk tae set one foot inside.\n@c2@"
  es: "@a@b*: No permitiré que ningún individuo sospechoso ponga un pie en él.\n@c2@"
  fr: "@a@b*ⓢ Je ne laisserai aucune personne suspecte mettre un seul pied à l'intérieur.\n@c2@"
  it: "@a@b*: Non lascerò entrare nessun tipo sospetto.\n@c2@"
  ja: "@a@b＊「あやしい者は　一歩たりとも\n\t通しはせぬ！\n@c2@"
"24":
  de: "@a@b*: Wenn du dich zu lange vor der Stadt aufhältst, wird es dunkel, ehe du dich versiehst.\n@c2@"
  en: "@a@b*: If ye walk aboot too long ootside o' toon, it'll be dark afore ye ken it.\n@c2@"
  es: "@a@b*: Si pasa demasiado tiempo alejado de la ciudad, la noche se le echará encima antes de que se dé cuenta.\n@c2@"
  fr: "@a@b*ⓢ Si vous restez trop longtemps hors de la ville, la nuit peut tomber avant que vous ne vous en rendiez compte.\n@c2@"
  it: "@a@b*: Se ti avventuri troppo lontano dalla città, potresti essere sorpreso dall'oscurità della notte.\n@c2@"
  ja: "@a@b＊「町の外で　歩き続けると\n\tやがて　日は沈みましょう。\n@c2@"
"25":
  de: "@a@b*: Die Ungeheuer sind nachts viel unruhiger, also musst du da draußen vorsichtig sein.\n@c2@"
  en: "@a@b*: The monsters are a lot more fidgety of a night, so ye'll need tae be a wee bit cannie oot there.\n@c2@"
  es: "@a@b*: Los monstruos están mucho más inquietos de noche, así que deberá tener mucho cuidado.\n@c2@"
  fr: "@a@b*ⓢ Les monstres sont nettement plus agressifs la nuit, alors faites attention si vous sortez.\n@c2@"
  it: "@a@b*: Con il buio, i mostri sono molto più pericolosi. Dovrai fare molta attenzione!\n@c2@"
  ja: "@a@b＊「夜は昼以上に　魔物が\n\t活発に　動きまわります。\n\tお気をつけください。\n@c2@"
"26":
  de: "@a@b*: He, hallo Ragnar. Ach, eine schlimme Sache, das mit den vermissten Kindern. Ich hab mir selbst mal ein paar Gedanken dazu gemacht.\n@c2@"
  en: "@a@b*: Hello there, Ragnar. Och, it's a terrible thing aboot those kiddies gaein' missin'. I've been lookin' intae it a bit maself.\n@c2@"
  es: "@a@b*: Saludos, Ragnar. Qué asunto más terrible, la desaparición de esos chiquillos. Yo mismo he estado examinando la situación.\n@c2@"
  fr: "@a@b*ⓢ Bonjour, Ragnar. C'est terrible, ces histoires d'enfants qui disparaissent. J'ai commencé à m'y intéresser un peu, moi aussi.\n@c2@"
  it: "@a@b*: Salve, Galiardo! Che cosa orribile, la scomparsa di quei bambini! Ho fatto qualche indagine, sai?\n@c2@"
  ja: "@a@b＊「おお　ライアンどのか。\n\tいや何　気になることがあってな。\n\tちょっと　調べておるんじゃよ。\n@c2@"
"27":
  de: "@a@b*: Habt Ihr schon jemals vom Herrn der Unterwelt gehört?\n@c2@"
  en: "@a@b*: Hae ye ever heard talk aboot the Lord o' the Underworld?\n@c2@"
  es: "@a@b*: ¿Ha oído hablar del Señor del Inframundo?\n@c2@"
  fr: "@a@b*ⓢ Avez-vous déjà entendu parler du Seigneur des Enfersⓡ\n@c2@"
  it: "@a@b*: %H860%XHai%YAvete%Z mai sentito parlare del Signore degli Inferi?\n@c2@"
  ja: "@a@b＊「地獄の帝王なるものを\n\tライアンどのは　ご存知か？\n@c2@"
"28":
  de: "@a@b*: Ich bin in einem alten Buch auf den Namen gestoßen, aber ich kann einfach nicht mehr darüber finden.\n@c2@"
  en: "@a@b*: I saw the name in an auld book o' mine, but I cannae seem tae find oot more aboot it.\n@c2@"
  es: "@a@b*: Vi su nombre en un antiguo tomo de mi biblioteca, pero no he podido averiguar nada más acerca de él.\n@c2@"
  fr: "@a@b*ⓢ Je suis tombé sur ce nom dans un de mes vieux bouquins, mais je n'arrive pas à en savoir plus.\n@c2@"
  it: "@a@b*: Ho saputo della sua esistenza consultando un mio vecchio libro, ma non sono riuscito a scoprire altro su di lui.\n@c2@"
  ja: "@a@b＊「名前だけは　古い本に\n\t出ておったんじゃが　それ以上は\n\tどこにも　のってなくてのう……。\n@c2@"
"29":
  de: "@a@b*: Wir sind gerade erst aus Auenfelde gekommen.\n@c2@"
  en: "@a@b*: We came here from Strathbaile just noo.\n@c2@"
  es: "@a@b*: Hemos llegado de Candonga al mediodía.\n@c2@"
  fr: "@a@b*ⓢ Nous venons tout juste d'arriver de Strattbourg.\n@c2@"
  it: "@a@b*: Siamo arrivati proprio adesso da Bellavalle.\n@c2@"
  ja: "@a@b＊「私たちは　イムルの村から\n\tやってきました。\n@c2@"
"30":
  de: "@a@b*: Aber unterwegs wurden wir so oft von Ungeheuern angegriffen, dass ich schon dachte, wir kommen gar nicht mehr heil an!\n@c2@"
  en: "@a@b*: But we were attacked by monsters so many times on the way, I was thinkin' we'd never make it here alive!\n@c2@"
  es: "@a@b*: Pero hemos sido atacados tantas veces por los monstruos en el camino, que ya creía que no íbamos a poder llegar vivos.\n@c2@"
  fr: "@a@b*ⓢ Mais nous avons été attaqués par tant de monstres en chemin que j'ai bien cru que nous n'arriverions jamais ici vivantsⓠ\n@c2@"
  it: "@a@b*: Durante il viaggio, i mostri ci hanno attaccato talmente tante volte che temevo che non saremmo sopravvissuti!\n@c2@"
  ja: "@a@b＊「しかし　ここに　たどりつくまで\n\t魔物どもに　おそわれ\n\t何度　死にかけたことか。\n@c2@"
"31":
  de: "@a@b*: Jetzt trödelt doch nicht so, Ragnar, die anderen sind schon längst fort!\n@c1@"
  en: "@a@b*: Dinnae be laggin' behind all the other soldiers now, Ragnar.\n@c1@"
  es: "@a@b*: No deje que los demás guardias se le adelanten, Ragnar.\n@c1@"
  fr: "@a@b*ⓢ Ne vous laissez pas distancer par les autres soldats, Ragnar.\n@c1@"
  it: "@a@b*: Galiavdo, cevca di non favti lasciave indietvo dagli altvi soldati.\n@c1@"
  ja: "@a@b＊「ライアンさま。　どうか　ほかの\n\t戦士たちに　おくれを取らぬよう\n\tがんばってくださいまし。\n@c1@"
"32":
  de: "@a@b*: Ich sehe in letzter Zeit am helllichten Tag Ungeheuer da draußen, die früher nur nachts herausgekommen sind.\n@c2@"
  en: "@a@b*: I've been seein' monsters oot there in the day that used tae only come oot of a night. Ay, it's a scary auld world.\n@c2@"
  es: "@a@b*: He visto ahí fuera, a la luz del día, monstruos que antes solo salían por las noches. ¡Ah, el mundo es un lugar temible!\n@c2@"
  fr: "@a@b*ⓢ J'ai vu en plein jour des monstres qui ne sortent normalement que la nuit. On vit dans un monde effrayant, pour sûr.\n@c2@"
  it: "@a@b*: Recentemente, alcuni mostri notturni si stanno facendo vedere in giro anche di giorno. Il mondo sta impazzendo!\n@c2@"
  ja: "@a@b＊「前は　夜しか出なかった魔物が\n\t昼間も出るようになったとか。\n\tぶっそうな　世の中ですわい。\n@c2@"
"33":
  de: "@a@b*: Du bist ja immer noch da, Ragnar!\nNur keine Hast, was?\n@c2@"
  en: "@a@b*: Whit are ye still daein' here, Ragnar? \nYe certainly dinnae like tae rush things, eh?\n@c2@"
  es: "@a@b*: ¿Qué está haciendo aquí aún, Ragnar? \nEs obvio que le gusta tomarse su tiempo, ¿eh?\n@c2@"
  fr: "@a@b*ⓢ Que faites-vous encore ici, Ragnarⓡ \nVous n'aimez pas précipiter les choses, heinⓡ\n@c2@"
  it: "@a@b*: Cosa ci fai ancora qui, Galiardo? Ti piace prendertela comoda, eh?\n@c2@"
  ja: "@a@b＊「よう　ライアン！\n\tまだ　こんな所を　ウロウロして\n\tあいかわらず　のろまだな。\n@c2@"
"34":
  de: "@a@b*: Sind die anderen nicht schon alle nach Auenfelde unterwegs?\n@c2@"
  en: "@a@b*: Are all the others no away tae Strathbaile already?\n@c2@"
  es: "@a@b*: ¿Es que no han salido ya los demás hacia Candonga?\n@c2@"
  fr: "@a@b*ⓢ Tous les autres ne sont-ils pas déjà partis pour Strattbourgⓡ\n@c2@"
  it: "@a@b*: Scommetto che gli altri sono già partiti per Bellavalle...\n@c2@"
  ja: "@a@b＊「ほかの連中は　イムルの村に\n\t行ったんじゃないのか？\n@c2@"
"35":
  de: "@a@b*: Es hat erst in letzter Zeit angefangen, dass so viele kleine Kinder verschwunden sind.\nWer da wohl hinter steckt?\n@c2@"
  en: "@a@b*: It's only just recently that so many wee kiddies hae started tae disappear. \nI wonder who could be responsible.\n@c2@"
  es: "@a@b*: El asunto de las desapariciones de niños es un problema reciente. \nMe pregunto quién puede estar detrás de él.\n@c2@"
  fr: "@a@b*ⓢ Il n'y a que peu de temps que tant de petits enfants ont commencé à disparaître.\nJe me demande qui peut bien faire ça.\n@c2@"
  it: "@a@b*: Negli ultimi tempi, numerosi bambini sono spariti misteriosamente. Chissà chi è il responsabile di tutto ciò!\n@c2@"
  ja: "@a@b＊「子供たちが　姿を消す事件が\n\t増えはじめたのは　つい最近だ。\n\tいったい　何者の　しわざだろう？\n@c2@"
"36":
  de: "@aKönig Burkhard@bSchön, Euch wiederzusehen, Rauhbein. Aber Eurer Miene nach zu urteilen, wart Ihr wohl noch nicht sehr erfolgreich.\n@c2@"
  en: "@aKing Burnard@bGood tae see ye again, McRyan. But by the look on yer face, I'd say ye cannae hae made much progress yet.\n@c2@"
  es: "@aRey Recaredo@bMe alegro de verle de nuevo, McRyan. Pero su mirada me dice que aún no ha avanzado demasiado en sus pesquisas.\n@c2@"
  fr: "@aRoi Bastien@bContent de vous revoir, McRyan. Mais vu la tête que vous faites, je devine que vous n'avez guère progressé.\n@c2@"
  it: "@aRe Basilio@bSono felice di rivederti, de' Guglielmi. L'espressione del tuo volto, però, mi induce a ritenere che tu non abbia fatto molti progressi.\n@c2@"
  ja: "@a@b王「ライアンよ！　よくぞ　もどった！\n\tしかし　その様子では　まだ\n\tあまり　進展しておらぬようだな。\n@c2@"
"37":
  de: "@aKönig Burkhard@bDie Zeit drängt, guter Mann. Ihr müsst herausfinden, wohin die Kleinen verschwunden sind.\n@c2@"
  en: "@aKing Burnard@bTime's of the essence, ma man. Ye must find oot where those kiddies hae been disappearin' tae.\n@c2@"
  es: "@aRey Recaredo@bEl tiempo es esencial, amigo mío. Debe usted averiguar dónde se hallan los pequeños desaparecidos.\n@c2@"
  fr: "@aRoi Bastien@bLe temps passe, soldat. Nous devons découvrir où sont passés les enfants disparus.\n@c2@"
  it: "@aRe Basilio@bNon c'è tempo da perdere, mio guerriero. Devi scoprire che fine hanno fatto quei bambini!\n@c2@"
  ja: "@a@b王「ともかく　一刻もはやく\n\t子供たちの　神隠しの原因を\n\tつきとめるのじゃ。\n@c2@"
"38":
  de: "@aKönig Burkhard@bIch zähle auf Euch, Ragnar Rauhbein. Viel Glück und der Göttin Segen!\n@c2@"
  en: "@aKing Burnard@bI'm dependin' on ye, Ragnar McRyan. Good luck an' Goddesspeed.\n@c2@"
  es: "@aRey Recaredo@bMe pongo en sus manos, Ragnar McRyan.\nBuena suerte y buen viaje.\n@c2@"
  fr: "@aRoi Bastien@bJe compte sur vous, Ragnar McRyan. Bonne chance, et que la Déesse hâte vos pas.\n@c2@"
  it: "@aRe Basilio@bNon deludermi, Galiardo de' Guglielmi. Vai, e che la dea ti protegga!\n@c2@"
  ja: "@a@b王「そなたの活躍を　期待しておるぞ。\n\tライアンよ。\n@c2@"
"39":
  de: "@aKönig Burkhard@bSchön, Euch wiederzusehen, Rauhbein.\n@c2@"
  en: "@aKing Burnard@bGood tae see ye again, McRyan.\n@c2@"
  es: "@aRey Recaredo@bMe alegro de verle de nuevo, McRyan.\n@c2@"
  fr: "@aRoi Bastien@bContent de vous revoir, McRyan.\n@c2@"
  it: "@aRe Basilio@bSono lieto di rivederti, de' Guglielmi.\n@c2@"
  ja: "@a@b王「ライアンよ！　よくぞ　もどった！\n@c2@"
"40":
  de: "@aKönig Burkhard@bNun! Eurer Miene nach zu urteilen, seid Ihr offenbar weitergekommen!\n@c2@"
  en: "@aKing Burnard@bMon! I'd say by the look on yer face that ye may well hae got somewhere!\n@c2@"
  es: "@aRey Recaredo@b¡Cielos! ¡Su mirada me dice que es posible que haya averiguado algo!\n@c2@"
  fr: "@aRoi Bastien@bAhⓠ À votre expression, je devine que vous avez découvert quelque choseⓠ\n@c2@"
  it: "@aRe Basilio@bPerdinci! Hai l'aria di chi è riuscito a scoprire qualcosa!\n@c2@"
  ja: "@a@b王「ほほう……。\n\tその　自信ありげな顔は\n\tなにか分かったらしいな。\n@c2@"
"41":
  de: "@aKönig Burkhard@bTalaria, sagt Ihr? Schön, schön...\n@c2@"
  en: "@aKing Burnard@bTalaria, ye say? Well, well...\n@c2@"
  es: "@aRey Recaredo@b¿Sandalias aladas, dice? Vaya, vaya...\n@c2@"
  fr: "@aRoi Bastien@bDes chaussures ailées, vous ditesⓡ Tiens, tiens...\n@c2@"
  it: "@aRe Basilio@bCome dici? I Talari? Bene, molto bene.\n@c2@"
  ja: "@a@b王「ふむふむ……。\n\tなんと　空飛ぶくつ　とな？\n\tそうか　そうであったか……。\n@c2@"
"42":
  de: "@aKönig Burkhard@bJedenfalls ist es Zeit, die Kleinen zu ihren Müttern zurückzubringen.\n@c2@"
  en: "@aKing Burnard@bAnyhoo, it's time tae get those wee bairns back tae their mothers.\n@c2@"
  es: "@aRey Recaredo@bSea como fuere, es hora de devolver esos chiquillos a sus madres.\n@c2@"
  fr: "@aRoi Bastien@bQuoi qu'il en soit, il est temps de rendre ces enfants à leurs mères.\n@c2@"
  it: "@aRe Basilio@bAscolta! Devi riportare quei ragazzi alle loro madri!\n@c2@"
  ja: "@a@b王「ともかく　一刻もはやく\n\t子供たちを　母親のもとに\n\tつれもどすのじゃ。\n@c2@"
"43":
  de: "@aKönig Burkhard@bIch verlasse mich auf Euch, Ragnar Rauhbein.\nViel Glück und der Göttin Segen.\n@c2@"
  en: "@aKing Burnard@bI'm dependin' on ye, Ragnar McRyan. \nGood luck an' Goddesspeed.\n@c2@"
  es: "@aRey Recaredo@bMe pongo en sus manos, Ragnar McRyan. \nBuena suerte y buen viaje.\n@c2@"
  fr: "@aRoi Bastien@bJe compte sur vous, Ragnar McRyan.\nBonne chance, et que la Déesse hâte vos pas.\n@c2@"
  it: "@aRe Basilio@bConto su di te, Galiardo de' Guglielmi. Vai, e che la dea ti protegga!\n@c2@"
  ja: "@a@b王「そなたの活躍を　期待しておるぞ。\n\tライアンよ。\n@c2@"
"44":
  de: "@a@b*: Wenn Ihr in der Kirche beichtet, können wir eine Aufzeichnung Eurer Reisen speichern.\n@c2@"
  en: "@a@b*: If ye confess at a church, ye can save a record o' yer travels.\n@c2@"
  es: "@a@b*: Si se confiesa en una iglesia podrá guardar un archivo de sus viajes.\n@c2@"
  fr: "@a@b*ⓢ En vous confessant dans une église, vous pouvez sauvegarder votre périple.\n@c2@"
  it: "@a@b*: Se ti confessi in una chiesa, potrai registrare i tuoi progressi nell'avventura.\n@c2@"
  ja: "@a@b＊「教会で　お祈りをすれば\n\tそなたの　旅の記録ができよう。\n@c2@"
"45":
  de: "@a@b*: Also solltet Ihr reinschauen, wann immer Ihr eine seht.\n@c2@"
  en: "@a@b*: So ye should mind tae drop in whenever ye see one.\n@c2@"
  es: "@a@b*: Así que será una buena idea que entre cada vez que vea una.\n@c2@"
  fr: "@a@b*ⓢ Pensez donc à y faire un tour quand vous en voyez une.\n@c2@"
  it: "@a@b*: Non dimenticare di fermarti in chiesa non appena ne vedi una!\n@c2@"
  ja: "@a@b＊「いく先々の　教会をたずねよ。\n@c2@"
"46":
  de: "@a@b*: Wenn Ihr Eure Abenteuer aufzeichnen lasst, könnt Ihr auch gleich noch zur Göttin beten.\n@c2@"
  en: "@a@b*: Ye can pray tae the Goddess at the same time as keepin' a log o' yer adventures.\n@c2@"
  es: "@a@b*: También, puede rezar a la Diosa al mismo tiempo que conserva la crónica de sus aventuras.\n@c2@"
  fr: "@a@b*ⓢ Vous pouvez y prier la Déesse tout en conservant un journal de vos aventures.\n@c2@"
  it: "@a@b*: Potrai pregare la nostra amatissima dea e, nello stesso tempo, registrare i tuoi progressi nell'avventura.\n@c2@"
  ja: "@a@b＊「そして　神に祈りをささげ\n\tみずからの行いを　冒険の書に\n\t記録してもらうのじゃ。\n@c2@"
"47":
  de: "@a@b*: Dies ist der Thronsaal von König Burkhard.\n@c2@"
  en: "@a@b*: This is King Burnard's throne room.\n@c2@"
  es: "@a@b*: Este es el salón del trono del rey Recaredo.\n@c2@"
  fr: "@a@b*ⓢ Vous êtes dans la salle du trône du roi Bastien.\n@c2@"
  it: "@a@b*: Questa è la sala del trono di Re Basilio.\n@c2@"
  ja: "@a@b＊「ここは　バトランド王のお部屋です。\n@c2@"
"48":
  de: "@a@b*: König Burkhard ist ein echter Edelmann, gar kein Zweifel.\n@c2@"
  en: "@a@b*: King Burnard is a real gent, no doubt aboot it.\n@c2@"
  es: "@a@b*: El rey Recaredo es un auténtico caballero, de eso no cabe la menor duda.\n@c2@"
  fr: "@a@b*ⓢ Le roi Bastien est un vrai gentilhomme, cela ne fait aucun doute.\n@c2@"
  it: "@a@b*: Nessuno può negare che Re Basilio sia un vero galantuomo.\n@c2@"
  ja: "@a@b＊「まったく　ここの王さまは\n\tごりっぱな　お方です。\n@c2@"
"49":
  de: "@a@b*: Er kennt die Namen jedes Einzelnen von uns.\nWas will man mehr, nicht, Ragnar?\n@c2@"
  en: "@a@b*: He minds the names of every one of us.\nYe cannae ask for more than that, eh, Ragnar?\n@c2@"
  es: "@a@b*: Recuerda los nombres de todos nosotros.\n¿Qué más se puede pedir, Ragnar?\n@c2@"
  fr: "@a@b*ⓢ Il se souvient du nom de chacun de nous.\nQue demander de plus, hein, Ragnarⓡ\n@c2@"
  it: "@a@b*: Il nostro sovrano ricorda i nomi di tutti noi! Questo è un segno di grande rispetto, non trovi?\n@c2@"
  ja: "@a@b＊「部下の　ひとりひとりの\n\t名前まで　おぼえているとは……。\n\tねえ　ライアンさま。\n@c2@"
"50":
  de: "@a@b*: Ich weiß nicht, der Himmel gefällt mir in letzter Zeit gar nicht.\n@c2@"
  en: "@a@b*: I cannae help feelin' a mite uneasy whenever I'm lookin' at the sky just lately.\n@c2@"
  es: "@a@b*: No puedo evitar una cierta inquietud cada vez que miro al cielo en estos últimos tiempos.\n@c2@"
  fr: "@a@b*ⓢ Depuis quelque temps, j'ai un sentiment de malaise quand je regarde le ciel.\n@c2@"
  it: "@a@b*: Ultimamente, quando guardo il cielo mi sento inspiegabilmente inquieto.\n@c2@"
  ja: "@a@b＊「近ごろ　空をながめていると\n\tむなさわぎが　してならぬ。\n@c2@"
"51":
  de: "@a@b*: Ich hoffe nur, da braut sich nichts zusammen.\n@c2@"
  en: "@a@b*: I only hope there's nothin' funny afoot.\n@c2@"
  es: "@a@b*: Espero que no se avecine nada extraño.\n@c2@"
  fr: "@a@b*ⓢ J'espère juste qu'il ne se prépare rien de bizarre.\n@c2@"
  it: "@a@b*: Spero che non stia per succedere nulla di strano!\n@c2@"
  ja: "@a@b＊「何事もなければ　よいのだが……。\n@c2@"
"52":
  de: "@a@b*: Ich kann nachts vor lauter Kummer um die armen Kleinen schon gar nicht mehr schlafen. Ihr müsst uns helfen!\n@c1@"
  en: "@a@b*: I cannae sleep at night thinkin' o' those poor wee bairns. Ye've got tae help us!\n@c1@"
  es: "@a@b*: Me es imposible dormir por las noches al pensar en esos pobres pequeñuelos. ¡Tiene que ayudarnos!\n@c1@"
  fr: "@a@b*ⓢ Je n'arrive plus à fermer l'œil, car je n'arrête pas de penser à ces pauvres petits. Vous devez nous aiderⓠ\n@c1@"
  it: "@a@b*: Di notte non dormo perché non faccio altro che pensare a quei poveri bambini... Devi aiutarci a salvarli!\n@c1@"
  ja: "@a@b＊「あの子のことを　考えると\n\t夜も眠れなくて……。\n\tああ　戦士さま　どうかどうか……。\n@c1@"
"53":
  de: "@a@b*: König Burkhard hat sich bereits zur Nacht zurückgezogen.\n@c2@"
  en: "@a@b*: King Burnard's already retired for the evening.\n@c2@"
  es: "@a@b*: El rey Recaredo ya se ha retirado a sus aposentos esta noche.\n@c2@"
  fr: "@a@b*ⓢ Le roi Bastien s'est déjà retiré pour la nuit.\n@c2@"
  it: "@a@b*: Re Basilio si è ritirato nelle sue stanze per la notte.\n@c2@"
  ja: "@a@b＊「王さまは　すでに　お休みだ。\n@c2@"
"54":
  de: "@a@b*: Warum bleibst du nicht über Nacht in der Stadt und kommst am Morgen wieder?\n@c2@"
  en: "@a@b*: Why dinnae ye spend the night in the inn, an' come back the morra?\n@c2@"
  es: "@a@b*: ¿Por qué no pasa la noche en la taberna y regresa mañana?\n@c2@"
  fr: "@a@b*ⓢ Pourquoi ne pas passer la nuit à l'auberge et revenir demainⓡ\n@c2@"
  it: "@a@b*: Perché non trascorri la notte alla locanda e torni qui domani?\n@c2@"
  ja: "@a@b＊「今夜は　宿にでも泊まって\n\t明日　また来るといい。\n@c2@"
"55":
  de: "@a@b*: Endlich Zeit für ein kleines Nickerchen. Ich sag's ja, am glücklichsten sind die Leute, wenn sie schlafen.\n@c2@"
  en: "@a@b*: Time for a wee bit o' shut-eye at last. I'd say folk are at their happiest when they're sleepin'.\n@c2@"
  es: "@a@b*: Por fin, es hora de concederse un poco de reposo. Opino que las personas son más felices mientras duermen.\n@c2@"
  fr: "@a@b*ⓢ C'est enfin l'heure de se reposer. D'après moi, c'est quand les gens dorment qu'ils sont le plus heureux.\n@c2@"
  it: "@a@b*: Direi che è ora di dormire, no? La gente è sempre felice quando può chiudere gli occhi e riposare un po'.\n@c2@"
  ja: "@a@b＊「さあ　寝るぞ　寝るぞ。\n\t人間　やっぱり眠るときが\n\tいちばん　しあわせでござる。\n@c2@"
"56":
  de: "@a@b*: Hmm. Je mehr ich drüber nachdenke, desto mehr erinnert es mich an damals.\n@c2@"
  en: "@a@b*: Em... The more I look intae it, the more it seems tae be the same.\n@c2@"
  es: "@a@b*: Bueno... Cuanto más lo miro, más me sigue pareciendo lo mismo.\n@c2@"
  fr: "@a@b*ⓢ Mmm... Plus j'y pense, plus ça y ressemble.\n@c2@"
  it: "@a@b*: Mah! Più guardo il cielo e più mi sento inquieto... \n@c2@"
  ja: "@a@b＊「ふーむ……。\n\t調べれば調べるほど　似ておる。\n@c2@"
"57":
  de: "@a@b*: Das Wetter ist genauso komisch wie damals, als die Ungeheuer los waren.\n@c2@"
  en: "@a@b*: This funny weather we've been haein' is just like back when the monsters were on the rampage.\n@c2@"
  es: "@a@b*: Este extraño tiempo que estamos teniendo es igual al que tuvimos cuando los monstruos lo arrasaron todo.\n@c2@"
  fr: "@a@b*ⓢ Ce drôle de temps que nous avons me rappelle l'époque où tous les monstres étaient déchaînés.\n@c2@"
  it: "@a@b*: Che tempo strano... Mi ricorda quello che c'era quando i mostri si sono scatenati!\n@c2@"
  ja: "@a@b＊「近頃の天候は　その昔\n\t魔物たちが　荒れ狂った時代に\n\tそっくりじゃわい。\n@c2@"
"58":
  de: "@a@b*: Mann... So eine Burgwache macht ganz schön müde.\n@c2@"
  en: "@a@b*: Losh! It's a tirin' auld business standin' guard of a castle.\n@c2@"
  es: "@a@b*: ¡Cielos! Qué tarea más cansada esta de hacer guardia en un castillo.\n@c2@"
  fr: "@a@b*ⓢ Pfiouⓠ C'est sacrément fatiguant de monter la garde dans un château.\n@c2@"
  it: "@a@b*: Diamine! Certo che montare di guardia al castello è proprio un lavoraccio!\n@c2@"
  ja: "@a@b＊「ふぅー　やれやれ。\n\tお城の見回りも　楽じゃないな。\n@c2@"
"59":
  de: "@a@b*: Ha-püh...\n@c2@"
  en: "@a@b*: Ah-phew...\n@c2@"
  es: "@a@b*: Ah-fiuu...\n@c2@"
  fr: "@a@b*ⓢ Ron-pfff...\n@c2@"
  it: "@a@b*: Ronf!\n@c2@"
  ja: "@a@b＊「ぐうぐう……。\n@c2@"
"60":
  de: "@a@b*: Hilf Himmel! Ein Ungeheuer! Nein! Ich bin doch noch so jung!\n@c2@"
  en: "@a@b*: Gads! It's a monster! Help! I dinnae want tae die!\n@c2@"
  es: "@a@b*: ¡Sapristi! ¡Es un monstruo! ¡Auxilio! ¡No quiero morir!\n@c2@"
  fr: "@a@b*ⓢ Oh nonⓠ C'est un monstreⓠ À l'aideⓠ Je ne veux pas mourirⓠ\n@c2@"
  it: "@a@b*: Accidenti! Un mostro! Aiuto! Non voglio morireee!\n@c2@"
  ja: "@a@b＊「ぬお～！　出たな！　怪物どもめ！\n@c2@"
"61":
  de: "@a@b*: Oh... Muss wohl geträumt haben.\n@c2@"
  en: "@a@b*: Oh... Looks like I must hae been dreamin'.\n@c2@"
  es: "@a@b*: Oh... Debe de haber sido un sueño.\n@c2@"
  fr: "@a@b*ⓢ Oh... J'ai dû rêver.\n@c2@"
  it: "@a@b*: Fiuuu... Per fortuna era solo un incubo...!\n@c2@"
  ja: "@a@b＊「はっ…………。\n\tなんと　夢であったか……。\n@c2@"
"62":
  de: "@a@b*: Wisst Ihr, ich wollte damals auch immer zur Palastwache.\n@c2@"
  en: "@a@b*: I wanted tae be a palace guard back in ma day, ye ken.\n@c2@"
  es: "@a@b*: En mis tiempos yo quería ser guardia de palacio, ¿sabe?\n@c2@"
  fr: "@a@b*ⓢ Vous savez, à une époque, je voulais devenir garde royal.\n@c2@"
  it: "@a@b*: Lo sai? Da giovane volevo essere una guardia di palazzo.\n@c2@"
  ja: "@a@b＊「わしも　若かったころは\n\t王宮の戦士に　あこがれたものじゃ。\n@c2@"
"63":
  de: "@a@b*: Ihr helft Burland und ich helfe Euch. Na, was sagt Ihr? Kann ich mit Euch mitkommen?\n@c2@"
  en: "@a@b*: If ye're helpin' Burland, then I want tae help ye. What dae ye say? Can I tag along wi' ye?\n@c2@"
  es: "@a@b*: Si está ayudando a Burlandia, quisiera acompañarle. ¿Qué contesta? ¿Puedo ir con usted?\n@c2@"
  fr: "@a@b*ⓢ Si vous aidez Bastione, je veux vous aider aussi. Qu'en dites-vousⓡ Je peux vous accompagnerⓡ\n@c2@"
  it: "@a@b*: Se sei in missione per il bene del regno di Burlandia, voglio essere al tuo fianco! Che ne dici? Posso unirmi a te?\n@c2@"
  ja: "@a@b＊「この　じいも　バトランドを守る\n\t戦士さまの　手伝いがしたいんじゃ。\n\tどうじゃろう？　つれていってはくれぬか？\n@c2@"
"64":
  de: "@a@b*: Pfundig! Ich darf? Dann nix wie los!\n@c2@"
  en: "@a@b*: Hoots! I can!? Then let's away!\n@c2@"
  es: "@a@b*: ¡Repámpanos! ¡¿Puedo?! ¡Entonces, en marcha!\n@c2@"
  fr: "@a@b*ⓢ C'est vrai, je peuxⓠⓑ Allons-y, alorsⓠ\n@c2@"
  it: "@a@b*: Perbacco! Posso? Partiamo subito!\n@c2@"
  ja: "@a@b＊「おお　まことか！？\n\tでは　ついてゆくとしよう！\n@c2@"
"65":
  de: "@a@b*: Allerdings ist Kämpfen nicht gerade meine starke Seite, also verlasst Euch da nicht allzu sehr auf mich.\n@c2@"
  en: "@a@b*: Och, but I amn't much of a fighter, so dinnae count on me too much there.\n@c2@"
  es: "@a@b*: Solo que, por desgracia, no soy un gran guerrero, así que no va a poder contar conmigo en ese sentido.\n@c2@"
  fr: "@a@b*ⓢ Mais je ne suis pas un grand combattant, alors ne comptez pas trop sur moi pour ça.\n@c2@"
  it: "@a@b*: Comunque, sappi che io non sono un grande guerriero... Quindi non fare troppo affidamento sulle mie capacità in battaglia, intesi?\n@c2@"
  ja: "@a@b＊「ちなみに　わしは戦闘は苦手じゃ。\n\tまったく　戦力にならんから\n\tそのつもりでな。\n@c2@"
"66":
  de: "@a@b*: Höhh... Höhh... Ich bin ganz außer Puste. Ich bin ja doch nicht mehr der Jüngste. Geht lieber ohne mich weiter.\n@c2@"
  en: "@a@b*: Haah... Haah... I cannae get ma breath. Maybe I'm too old for this. Ye should gae on without me.\n@c2@"
  es: "@a@b*: Ufff... Ufff... Me cuesta respirar. Quizá estoy demasiado viejo para esto. Será mejor que siga adelante sin mí.\n@c2@"
  fr: "@a@b*ⓢ Han... Han... Je suis tout essoufflé. Je suis peut-être trop vieux pour ça. Continuez donc sans moi.\n@c2@"
  it: "@a@b*: Anf... Anf... Mi manca il respiro... Sono troppo vecchio per questo genere di cose. Forse dovresti continuare senza di me... \n@c2@"
  ja: "@a@b＊「はあはあ……息が切れる……。\n\tやっぱり　年寄りには　つらいのう。\n\t気にせず　行ってくだされ。\n@c2@"
"67":
  de: "@a@b*: Wie dumm von mir zu glauben, ich könnt mit einem Soldaten mithalten. Tut mir leid, dass ich Euch aufgehalten hab.\n@c2@"
  en: "@a@b*: What a galoot I am thinkin' I can keep up wi' a soldier. Sorry tae take up yer time like that.\n@c2@"
  es: "@a@b*: Qué necio he sido pensando que puedo seguir el ritmo de un soldado. Lamento haberle hecho perder el tiempo.\n@c2@"
  fr: "@a@b*ⓢ Quel idiot je suis de me croire capable de suivre un soldat. Désolé de vous avoir fait perdre votre temps.\n@c2@"
  it: "@a@b*: Ma come ho potuto pensare che sarei riuscito a tenere il passo di un soldato ben addestrato?! Scusami... Mi spiace farti perdere tanto tempo.\n@c2@"
  ja: "@a@b＊「やっぱりのう。\n\tいや　ムリをいって\n\tすまんかったわい。\n@c2@"
"68":
  de: "@a@b*: König Burkhard versucht die Steuern niedrig zu halten, um seine Untertanen nicht allzu sehr zu belasten.\n@c3@"
  en: "@a@b*: King Burnard tries tae keep taxes low so as not tae put too much of a burden on his people.\n@c3@"
  es: "@a@b*: El rey Recaredo intenta mantener bajos los impuestos para que su pueblo note la carga lo menos posible.\n@c3@"
  fr: "@a@b*ⓢ Le roi Bastien essaie de garder les taxes au plus bas, afin de ne pas faire peser un trop lourd fardeau sur son peuple.\n@c3@"
  it: "@a@b*: Re Basilio ha deciso di non imporre troppe tasse ai suoi sudditi, così da non pesare molto sulle loro spalle.\n@c3@"
  ja: "@a@b＊「バトランド王は　人がらもよく\n\t国民に　負担をかけまいと\n\t税金を安くなさっている。\n@c3@"
"69":
  de: "@a@b*: Das ist ja alles gut und schön, aber dafür fehlt nun das Geld für anständige Waffen und Rüstungen.\n@c3@"
  en: "@a@b*: That's all well an' good, but it means there's no enough money for decent weapons an' armour.\n@c3@"
  es: "@a@b*: Y eso está muy bien, pero significa que no hay dinero para armas y armaduras decentes.\n@c3@"
  fr: "@a@b*ⓢ C'est très bien, mais ça veut aussi dire qu'il n'y a pas assez d'argent pour payer des armes et des armures correctes.\n@c3@"
  it: "@a@b*: Per i cittadini è una gran bella cosa, ma questo vuol dire che noi non possiamo disporre di armi e armature decenti!\n@c3@"
  ja: "@a@b＊「しかし　そのぶん\n\t兵士たちの武器や防具に\n\tお金を　かけられないようだ。\n@c3@"
"70":
  de: "@a@b*: Wenn du bessere Ausrüstung brauchst, musst du sie dir selbst zusammensparen.\n@c3@"
  en: "@a@b*: If ye want stronger equipment, ye hae tae save yer cash an' buy it for yerself.\n@c3@"
  es: "@a@b*: Si quiere conseguir un equipo más sólido tendrá que ahorrar y comprarlo usted mismo.\n@c3@"
  fr: "@a@b*ⓢ Si on veut un équipement plus solide, il faut économiser et se l'acheter soi-même.\n@c3@"
  it: "@a@b*: Se desideri avere equipaggiamento migliore, dovrai comprartelo da te!\n@c3@"
  ja: "@a@b＊「もっと　強力な武器や　防具が\n\tほしければ　自分で　お金をためて\n\t買いかえるといい。　そして……。\n@c3@"
"71":
  de: "@a@b*: Und wenn du was Neues kaufst, achte darauf, dich auch damit auszurüsten, statt es nur mit dir herumzutragen!\n@c3@"
  en: "@a@b*: An' if ye dae buy somethin' new, be sure tae equip it rather than just carryin' it aboot wi' ye!\n@c3@"
  es: "@a@b*: ¡Y si compra algo, equípelo, no se limite a pasearlo por ahí!\n@c3@"
  fr: "@a@b*ⓢ Si jamais vous achetez quelque chose de neuf, pensez à vous en équiper, au lieu de simplement le transporter avec vousⓠ\n@c3@"
  it: "@a@b*: Quando acquisti dei nuovi oggetti, ricorda di aggiungerli all'equipaggiamento, e non limitarti a portarli con te.\n@c3@"
  ja: "@a@b＊「あたらしく　武器や防具を\n\t買ったあとは　装備しなおすことを\n\t忘れるなよっ！\n@c3@"
"72":
  de: "@a@b*: Das ist die schöne Stadt Burland.\n@c2@"
  en: "@a@b*: This is bonnie Burland toon.\n@c2@"
  es: "@a@b*: Esta es la orgullosa ciudad de Burlandia.\n@c2@"
  fr: "@a@b*ⓢ Vous vous trouvez dans la belle ville de Bastione.\n@c2@"
  it: "@a@b*: Questa incantevole città è Burlandia.\n@c2@"
  ja: "@a@b＊「ここは　バトランドの城下町です。\n@c2@"
"73":
  de: "@a@b*: Ich heiße Agnes. Mein Alfons ist noch immer nicht von seiner Reise zurück, dabei ist er schon ziemlich lange unterwegs.\n@c1@"
  en: "@a@b*: Ma name's Aigneas. Ma hubbie, Angus, has no come back from his travels, an' it's been more than a wee while now.\n@c1@"
  es: "@a@b*: Mi nombre es Adalberta. Mi esposo, Angustio, no ha regresado de sus viajes, y ya hace mucho tiempo que partió.\n@c1@"
  fr: "@a@b*ⓢ Je m'appelle Agnès. Mon mari, Angus, n'est toujours pas revenu de voyage, et cela fait maintenant très longtemps qu'il est parti.\n@c1@"
  it: "@a@b*: Io sono Agnese. Mio marito Attilio è partito per un viaggio. Sono un po' preoccupata, perché ormai è un pezzo che manca da casa...\n@c1@"
  ja: "@a@b＊「わたしは　フレア。\n\t夫のアレクスが　旅に出たまま\n\t帰らないのです。\n@c1@"
"74":
  de: "@aAgnes@bWenn Ihr ihm unterwegs begegnet, würdet Ihr mir dann Bescheid sagen?\n@c1@"
  en: "@aAigneas@bIf ye see him when ye're flittin' aboot the place, will ye mind tae let me know?\n@c1@"
  es: "@aAdalberta@bSi lo ve mientras recorre el país, ¿le importaría decírmelo?\n@c1@"
  fr: "@aAgnès@bSi vous le voyez en vous promenant dans le coin, pourriez-vous me prévenirⓡ\n@c1@"
  it: "@aAgnese@bSe ti capitasse di vederlo da qualche parte, ti dispiacerebbe farmelo sapere?\n@c1@"
  ja: "@a@b＊「戦士さま！　もし旅先で\n\t夫のアレクスを　見かけたら\n\tわたしに　しらせてくださいまし。\n@c1@"
"75":
  de: "@a@b*: Agnes' Mann Alfons wollte schon immer Abenteuer erleben.\n@c2@"
  en: "@a@b*: Aigneas's hubbie, Angus, is a right one for adventure.\n@c2@"
  es: "@a@b*: El marido de Adalberta, Angustio, es amante de la aventura.\n@c2@"
  fr: "@a@b*ⓢ Angus, le mari d'Agnès, est un véritable aventurier.\n@c2@"
  it: "@a@b*: Attilio, il marito di Agnese, è un amante dell'avventura.\n@c2@"
  ja: "@a@b＊「フレアの夫　アレクスは\n\t大の冒険好きでのう。\n@c2@"
"76":
  de: "@a@b*: Er ist aufgebrochen, um herauszufinden, wie man in den Turm im Wasser hineinkommt.\n@c2@"
  en: "@a@b*: He went off searchin' for a clue of hoo tae get at the tur in the middle of all that water.\n@c2@"
  es: "@a@b*: Partió en busca de pistas para poder llegar a esa torre en mitad del agua.\n@c2@"
  fr: "@a@b*ⓢ Il est parti pour tenter de découvrir comment pénétrer dans la tour qui se trouve au milieu de toute cette eau.\n@c2@"
  it: "@a@b*: A quanto pare stavolta si è messo in testa di salire su quella torre circondata dall'acqua...\n@c2@"
  ja: "@a@b＊「湖に囲まれた　塔に\n\t行くための手がかりを\n\tさがしに行ったそうじゃよ。\n@c2@"
"77":
  de: "@a@b*: Wenn Ihr nach Auenfelde wollt, müsst Ihr nach Westen zur Auenfelde-Passage und auf der anderen Seite dann weiter nach Nordosten.\n@c1@"
  en: "@a@b*: If ye're headed for Strathbaile, ye need tae gae west tae Strathbaile Burrow, an' then north-east when ye get tae the other side.\n@c1@"
  es: "@a@b*: Si se dirige a Candonga, deberá cruzar por la Madriguera de Candonga y, cuando llegue al otro lado, ir hacia el nordeste.\n@c1@"
  fr: "@a@b*ⓢ Pour rejoindre Strattbourg, vous devez d'abord aller vers l'ouest jusqu'à la Caverne de Strattbourg.\n㈡\n*ⓢ Une fois de l'autre côté, partez vers le nord-est.\n@c1@"
  it: "@a@b*: Per andare a Bellavalle, %H860%Xdevi%Ydovete%Z andare a ovest, verso la Galleria di Bellavalle, e poi, una volta dall'altro lato, a nord-est.\n@c1@"
  ja: "@a@b＊「イムルの村でしたら　お城の\n\t西にある　洞くつを抜けて\n\t北東に歩くと　たどりつけますわ。\n@c1@"
"78":
  de: "@a@b*: Ach, die armen Kinderchen. Sicher haben die Leut' in Auenfelde eine Vermutung, was da los sein könnte.\n@c2@"
  en: "@a@b*: Ay, those poor kiddies. Surely the folk in Strathbaile will hae some kind o' clue of whit it's all aboot.\n@c2@"
  es: "@a@b*: ¡Oh!, pobres muchachos. Seguro que las gentes de Candonga tendrán alguna pista de lo que está sucediendo.\n@c2@"
  fr: "@a@b*ⓢ Ah, pauvres petits. Les gens de Strattbourg auront sûrement une idée sur la question.\n@c2@"
  it: "@a@b*: Oh, quei poveri bambini... Chissà se gli abitanti di Bellavalle hanno idea di cosa stia succedendo.\n@c2@"
  ja: "@a@b＊「さらわれた子供ねぇ。\n\tイムルの村へ行けば　何か\n\tわかるんじゃないんですか。\n@c2@"
"79":
  de: "@a@b*: Das scheint schließlich der Dreh- und Angelpunkt zu sein. Ihr solltet versuchen, dort etwas herauszufinden.\n@c2@"
  en: "@a@b*: That's where it all seems tae be happenin', after all. Ye should away there an' see if ye cannae get some clues.\n@c2@"
  es: "@a@b*: Parece que es allí donde está aconteciendo todo. Debería dirigirse hacia allí e intentar obtener información.\n@c2@"
  fr: "@a@b*ⓢ Après tout, c'est là-bas que ça se passe. Vous devriez vous y rendre pour voir si vous pouvez trouver des indices.\n@c2@"
  it: "@a@b*: Del resto, è proprio lì che stanno accadendo questi eventi inspiegabili. %H860%XDovresti%YDovreste%Z andar lì a cercare qualche indizio.\n@c2@"
  ja: "@a@b＊「だって　子供の神隠しって\n\tイムルで　起こってるんでしょ。\n\tなら　まずイムルへ　行くべきっす。\n@c2@"
"80":
  de: "@a@b*: Ragnar! Habt Ihr schon einmal von diesem Kampfarchiv gehört?\n@c2@"
  en: "@a@b*: Ragnar! Hae ye heard o' this thing called battle records?\n@c2@"
  es: "@a@b*: ¡Ragnar! ¿Ha oído hablar de eso que llaman registros de batalla?\n@c2@"
  fr: "@a@b*ⓢ Ragnarⓠ Vous avez entendu parler de ce qu'on appelle les résultats des combatsⓡ\n@c2@"
  it: "@a@b*: Galiardo, hai mai sentito parlare del registro delle battaglie?\n@c2@"
  ja: "@a@b＊「ライアンどの！　知っておるか？\n\t作戦には　戦歴というものが\n\tあってのう……。\n@c2@"
"81":
  de: "@a@b*: Damit könnt Ihr offenbar prüfen, wie Ihr Euch im Kampf macht.\n@c2@"
  en: "@a@b*: Apparently, ye can use it tae check on hoo yer fightin' is gaein'.\n@c2@"
  es: "@a@b*: Al parecer, se pueden usar para comprobar cómo evoluciona en sus combates.\n@c2@"
  fr: "@a@b*ⓢ Apparemment, vous pouvez vous en servir pour savoir où vous en êtes au niveau des combats.\n@c2@"
  it: "@a@b*: Si tratta di uno strumento utilissimo per valutare come ti comporti in combattimento.\n@c2@"
  ja: "@a@b＊「それを見れば　おのずと\n\tおのれの戦いぶりが\n\tわかるそうじゃぞ。\n@c2@"
"82":
  de: "@a@b*: Ah! Ihr seid auf Einkaufstour, was? Macht es Euch was aus, außen herum zu gehen?\n@c2@"
  en: "@a@b*: Ach! Here for a wee bit o' shoppin', are ye? Then maybe ye could away ootside an' 'round tae the counter if it's no too much trouble.\n@c2@"
  es: "@a@b*: ¡Vaya! Veo que ha venido a hacer algunas compras. Entonces no le importará salir de aquí y dirigirse al mostrador, si es tan amable.\n@c2@"
  fr: "@a@b*ⓢ Tiensⓠ Vous venez faire quelques emplettesⓡ Alors il faudrait ressortir et passer de l'autre côté du comptoir, si vous voulez bien.\n@c2@"
  it: "@a@b*: Ehilà! %H860%XSei%YSiete%Z qui per acquisti? Allora %H860%Xesci fuori e vai%Yuscite fuori e andate%Z dall'altro lato del bancone, se non %H860%Xti%Yvi%Z dispiace.\n@c2@"
  ja: "@a@b＊「おや？　お買い物ですか？\n\tだったら　店のそとに出て\n\tカウンターごしに　話しかけて下さい。\n@c2@"
"83":
  de: "@a@b*: Ungeheuer kommen nie bis in die Stadt, also können es nicht sie sein, die die Kinder rauben.\n@c1@"
  en: "@a@b*: Monsters dinnae ever come intae toon, so it cannae be them responsible for snatchin' the bairns away.\n@c1@"
  es: "@a@b*: Los monstruos nunca entran en la ciudad, así que no pueden ser los responsables del rapto de los pequeños.\n@c1@"
  fr: "@a@b*ⓢ Les monstres ne pénètrent jamais en ville, ils ne peuvent donc pas être responsables des enlèvements d'enfants.\n@c1@"
  it: "@a@b*: I mostri non entrano mai in città, quindi non possono essere stati loro a rapire i bambini.\n@c1@"
  ja: "@a@b＊「魔物だって　町の中にまでは\n\t入ってこられないんだから　魔物に\n\t子供は　さらえないはずよ。\n@c1@"
"84":
  de: "@a@b*: Aber wenn nicht die Ungeheuer, wer dann? Ich habe gar kein gutes Gefühl dabei.\n@c1@"
  en: "@a@b*: But if it's no monsters, then I cannae understand whit it could be. All I know is that I dinnae hae a good feelin' aboot it.\n@c1@"
  es: "@a@b*: Pero, si no son los monstruos, no comprendo lo que puede estar sucediendo. Lo único que sé es que tengo un mal pálpito.\n@c1@"
  fr: "@a@b*ⓢ Mais si ce ne sont pas les monstres, je ne vois pas qui ça peut être. En revanche, je peux vous dire que j'ai un mauvais pressentiment.\n@c1@"
  it: "@a@b*: Se però i mostri non sono responsabili dell'accaduto, mi chiedo chi ci sia dietro ai rapimenti. Questa storia mi puzza, e parecchio!\n@c1@"
  ja: "@a@b＊「でも　だったら　どうやって\n\t子供たちが　いなくなるのかしら？\n\t気味が悪いわね……。\n@c1@"
"85":
  de: "@a@b*: Stimmt es, dass Kinder vermisst werden?\n@c1@"
  en: "@a@b*: Is it true that there are kids gaein' missin'?\n@c1@"
  es: "@a@b*: ¿Es cierto que hay niños desaparecidos?\n@c1@"
  fr: "@a@b*ⓢ C'est vrai que des enfants disparaissentⓡ\n@c1@"
  it: "@a@b*: Ma davvero sono spariti dei ragazzini?\n@c1@"
  ja: "@a@b＊「子供が　いなくなるってホント？\n@c1@"
"86":
  de: "@a@b*: Ich brauche mir darüber jedenfalls keine Sorgen mehr zu machen, ich bin ja kein Kind mehr.\n@c1@"
  en: "@a@b*: At least I dinnae hae tae worry aboot it now I amn't a kid any more.\n@c1@"
  es: "@a@b*: Al menos, no tengo de qué preocuparme. Ya hace tiempo que dejé atrás mi infancia.\n@c1@"
  fr: "@a@b*ⓢ Au moins, je n'ai pas à m'inquiéterⓢ moi, je ne suis plus un enfant.\n@c1@"
  it: "@a@b*: Beh, la cosa non mi riguarda. Io non sono più un bambino!\n@c1@"
  ja: "@a@b＊「でも　ぼくは\n\tもう　子供じゃないから\n\t大丈夫だよねっ。\n@c1@"
"87":
  de: "@a@b*: Die Dame des Hauses wartet schon lange darauf, dass ihr Mann zurückkommt. Arme Frau.\n@c2@"
  en: "@a@b*: The lady o' the hoose has been waitin' an awful long time for her hubbie tae come home. Poor woman.\n@c2@"
  es: "@a@b*: La señora de la casa lleva largo tiempo esperando que su esposo regrese. Pobre mujer.\n@c2@"
  fr: "@a@b*ⓢ Cela fait très longtemps que la dame qui habite cette maison attend le retour de son mari.\nPauvre femme.\n@c2@"
  it: "@a@b*: La padrona di casa sta aspettando il ritorno del marito da una vita. Povera donna...\n@c2@"
  ja: "@a@b＊「この家の奥さんは　長い間\n\t帰らぬ夫を　待ってるそうじゃ。\n\tかわいそうにのう……。\n@c2@"
"88":
  de: "@a@b*: Was? Ob ich 'ne Ahnung hab, wer die Kinder klaut?\n@c3@"
  en: "@a@b*: Whit? Dae I hae any clues aboot who's takin' the kiddies away?\n@c3@"
  es: "@a@b*: ¿Cómo? ¿Que si tengo alguna idea de quién se está llevando a los niños?\n@c3@"
  fr: "@a@b*ⓢ Quoiⓡ Si je soupçonne quelqu'un d'enlever les enfantsⓡ\n@c3@"
  it: "@a@b*: Come %H860%Xdici%Ydite%Z? Se ho idea di chi abbia rapito i ragazzi?\n@c3@"
  ja: "@a@b＊「え？\n\t子供がいなくなる　事件について\n\t心当たりは　ないかって！？\n@c3@"
"89":
  de: "@a@b*: Bist du so blöd oder tust du nur so? Die Ungeheuer natürlich, wer denn sonst?\n@c3@"
  en: "@a@b*: So ye're another stupid nyaff, are ye?\nIt's obviously the monsters snatchin' 'em away. Stands tae reason.\n@c3@"
  es: "@a@b*: Es usted otra de esas personas molestas y fastidiosas, ya lo veo. Es obvio que son los monstruos los responsables de los secuestros.\n@c3@"
  fr: "@a@b*ⓢ Encore un imbécile de plusⓠ C'est évident que ce sont les monstres qui les enlèvent. Ça va de soi, voyons.\n@c3@"
  it: "@a@b*: Ma senti che razza di domanda! Mi pare ovvio che i colpevoli siano i mostri, no? Non può essere altrimenti!\n@c3@"
  ja: "@a@b＊「バカだね　あんたも。\n\tそんなの　魔物がさらっていったに\n\t決まってるじゃないか。\n@c3@"
"90":
  de: "@a@b*: Ach, hätte ich nur ein eigenes Haus, mit einem Dach und mit Wänden, die den Regen abhalten.\n@c2@"
  en: "@a@b*: Och, whit I'd gie tae be able tae sleep in a hoose o' ma own, wi' a roof an' walls tae keep oot the rain.\n@c2@"
  es: "@a@b*: Ah, qué no daría yo por poder dormir en mi propia casa, con paredes y techo para protegerme de la intemperie.\n@c2@"
  fr: "@a@b*ⓢ Oh, qu'est-ce que je ne donnerais pas pour pouvoir dormir dans ma propre maison, avec un toit et des murs pour me protéger de la pluieⓠ\n@c2@"
  it: "@a@b*: Oh, quanto vorrei poter dormire in una casa tutta mia, con tanto di tetto e pareti per non bagnarmi quando piove... \n@c2@"
  ja: "@a@b＊「……ううっ。\n\tはやく　雨つゆをしのげる家で\n\t寝られるようになりたいです。\n@c2@"
"91":
  de: "@a@b*: Miau!\n@c1@"
  en: "@a@b*: Meow!\n@c1@"
  es: "@a@b*: ¡Miau!\n@c1@"
  fr: "@a@b*ⓢ Miaouⓠ\n@c1@"
  it: "@a@b*: Miao!\n@c1@"
  ja: "@a@b＊「キシャー！\n@c1@"
"92":
  de: "@a@b*: Ha-püh...\n@c2@"
  en: "@a@b*: Ah-phew...\n@c2@"
  es: "@a@b*: Ah-fiuuu...\n@c2@"
  fr: "@a@b*ⓢ Ron-pfff...\n@c2@"
  it: "@a@b*: Ronf!\n@c2@"
  ja: "@a@b＊「ぐうぐう……。\n@c2@"
"93":
  de: "@a@b*: Ich weiß nicht ⓚⓛ die Ungeheuer scheinen mir in letzter Zeit stärker zu werden.\n@c3@"
  en: "@a@b*: I cannae help feelin' that the monsters hae been gettin' a wee bit stronger of late.\n@c3@"
  es: "@a@b*: Me da la sensación de que últimamente los monstruos están más robustos que de costumbre.\n@c3@"
  fr: "@a@b*ⓢ J'ai vraiment l'impression que les monstres sont devenus plus forts, récemment.\n@c3@"
  it: "@a@b*: Ho la netta sensazione che i mostri siano diventati più aggressivi negli ultimi tempi.\n@c3@"
  ja: "@a@b＊「近ごろ　魔物どもが\n\tチカラをつけてきたような\n\t気がするのだ。\n@c3@"
"94":
  de: "@a@b*: Die Ungeheuer werden also stärker? Das ist immer ein sicherer Beweis dafür, dass Unheil droht.\n@c2@"
  en: "@a@b*: So the monsters are gettin' stronger, are they? That's always sure proof that bad things are gaein' on.\n@c2@"
  es: "@a@b*: Así que los monstruos se están fortaleciendo, ¿no es verdad? Eso es la prueba fehaciente de que algo malo está sucediendo.\n@c2@"
  fr: "@a@b*ⓢ Alors comme ça, les monstres deviennent plus fortsⓡ C'est toujours le signe qu'il se passe de mauvaises choses.\n@c2@"
  it: "@a@b*: I mostri sono diventati più pericolosi, non è così? Secondo me, questo vuol dire che sta succedendo qualcosa di strano!\n@c2@"
  ja: "@a@b＊「ふーむ。　魔物がチカラを　か。\n\tどこかで　よからぬ事が\n\tおこってる証かのう……。\n@c2@"
"95":
  de: "@a@b*: Tut mir leid, heute ist schon geschlossen. Ihr müsst morgen wiederkommen.\n@c2@"
  en: "@a@b*: I'm afraid I've already shut up shop for today. If ye're after somethin', ye'll hae tae come back the morn.\n@c2@"
  es: "@a@b*: Me temo que ya hemos cerrado por hoy. Si desea alguno de nuestros artículos deberá regresar mañana.\n@c2@"
  fr: "@a@b*ⓢ Je regrette, mais j'ai déjà fermé le magasin. Si vous désirez quelque chose, il faudra revenir demain.\n@c2@"
  it: "@a@b*: Mi spiace, ma per oggi il negozio è chiuso. Se %H860%Xti%Yvi%Z serve qualcosa, %H860%Xdovrai%Ydovrete%Z tornare domattina.\n@c2@"
  ja: "@a@b＊「今日は　もう　店を閉めました。\n\tなにか欲しいのなら\n\tまた明日　来てください。\n@c2@"
"96":
  de: "@a@b*: Zzzzz...\n@c1@"
  en: "@a@b*: Zzzzz...\n@c1@"
  es: "@a@b*: Zzzzz...\n@c1@"
  fr: "@a@b*ⓢ Zzzzz...\n@c1@"
  it: "@a@b*: Zzz... \n@c1@"
  ja: "@a@b＊「すやすや……。\n@c1@"
"97":
  de: "@a@b*: Huuuh! Ich muss mal. Aber ich hab Angst, allein rauszugehen.\n@c1@"
  en: "@a@b*: Och! I need a wee wee wee. But I'm too scared tae gae oot on ma own.\n@c1@"
  es: "@a@b*: ¡Agh! Necesito hacer mis necesidades. Pero me da miedo ir solo.\n@c1@"
  fr: "@a@b*ⓢ Oh là làⓠ Il faut que j'aille faire pipi. Mais j'ai trop peur de sortir tout seul.\n@c1@"
  it: "@a@b*: Mi scappa la pipì! Ma ho paura di andare fuori da solo... \n@c1@"
  ja: "@a@b＊「え～ん。\n\tおしっこが　したいよう……。\n\tでも　ひとりで行くのは　恐いよう。\n@c1@"
"98":
  de: "@a@b*: Ach, wie lange will sie denn noch warten?\nIch versteh wirklich nicht, wieso sie den alten Deppen nicht einfach fallen lässt. \n@c2@"
  en: "@a@b*: Ach, hoo much longer is she gaein' tae wait?\nI cannae understand why she won't just give up on the auld bampot.\n@c2@"
  es: "@a@b*: Cielos, ¿cuánto tiempo más va a esperar?\nNo comprendo por qué no se olvida de ese personajillo y se casa conmigo de una vez.\n@c2@"
  fr: "@a@b*ⓢ Pfff, combien de temps va-t-elle encore attendreⓡ Je ne comprends pas pourquoi elle ne laisse pas tomber ce vieux fou.\n@c2@"
  it: "@a@b*: Ma quanta pazienza ha quella donna? Non capisco perché non smetta di aspettare il ritorno del marito!\n@c2@"
  ja: "@a@b＊「いったい　どれだけ　\n\t待つ気なんだろう？\n\tいいかげん　あきらめればいいのに。\n@c2@"
"99":
  de: "@a@b*: Ich heiße Agnes. Mein Alfons ist noch immer nicht von seiner Reise zurück, dabei ist er schon ziemlich lange unterwegs.\n@c1@"
  en: "@a@b*: Ma name's Aigneas. Ma hubbie, Angus, has no come back from his travels, an' it's been more than a wee while now.\n@c1@"
  es: "@a@b*: Mi nombre es Adalberta. Mi esposo, Angustio, no ha regresado de sus viajes, y ya hace mucho tiempo que partió.\n@c1@"
  fr: "@a@b*ⓢ Je m'appelle Agnès. Mon mari, Angus, n'est toujours pas revenu de voyage, et cela fait maintenant très longtemps qu'il est parti.\n@c1@"
  it: "@a@b*: Io sono Agnese. Mio marito Attilio è partito per un viaggio. Sono un po' preoccupata, perché ormai è un pezzo che manca da casa...\n@c1@"
  ja: "@a@b＊「わたしは　フレア。\n\t夫のアレクスが　旅に出たまま\n\t帰らないのです。\n@c1@"
"100":
  de: "@aAgnes@bAber er kommt zurück, ganz bestimmt. Der Mann kann einfach nicht ohne mich leben.\n@c1@"
  en: "@aAigneas@bI've no doubt that he'll be back in his own good time, though. That man cannae live without me, an' that's a fact.\n@c1@"
  es: "@aAdalberta@bPero no me cabe duda de que volverá en buena hora. Ese hombre no puede vivir sin mí, es la pura verdad.\n@c1@"
  fr: "@aAgnès@bJe suis certaine qu'il finira quand même par revenir. Une chose est sûreⓢ cet homme ne peut pas vivre sans moi.\n@c1@"
  it: "@aAgnese@bIntendiamoci, non è che io abbia paura che non torni... Quell'uomo non può vivere senza di me!\n@c1@"
  ja: "@a@b＊「しかし　夫は　必ず帰ってきますわ。\n\tアレクスは　わたしなしでは\n\t生きてゆけない人なんです。\n@c1@"
"101":
  de: "@aAgnes@bAber wenn Ihr ihn in Auenfelde oder so seht, könntet Ihr mir Bescheid sagen?\n@c1@"
  en: "@aAigneas@bStill, if ye see him when ye're passin' through Strathbaile or the like, will ye mind tae let me know?\n@c1@"
  es: "@aAdalberta@bDe todos modos, si lo ve por Candonga o por cualquier lugar, ¿le importaría decírmelo?\n@c1@"
  fr: "@aAgnès@bMais si toutefois vous le voyez en passant par Strattbourg ou ailleurs, vous voudrez bien me prévenirⓡ\n@c1@"
  it: "@aAgnese@bTuttavia, se %H860%Xti%Yvi%Z capitasse di vederlo in giro, %H860%Xfammelo%Yfatemelo%Z sapere!\n@c1@"
  ja: "@a@b＊「でも戦士さま　もし旅先で\n\t夫のアレクスを　見かけたら\n\tわたしに　しらせてくださいまし。\n@c1@"
"102":
  de: "@a@b*: Wir werden uns schon um die Burg kümmern, Ragnar. Versuch du nur herauszufinden, was mit den Kindern ist.\n@c2@"
  en: "@a@b*: Ye just leave the castle tae us, Ragnar.\nWe'll take care o' things here while ye away tae find oot where those kiddies hae got tae.\n@c2@"
  es: "@a@b*: Deje el castillo en nuestras manos, Ragnar.\nNos encargaremos de todo mientras usted averigua dónde se han metido esos chiquillos.\n@c2@"
  fr: "@a@b*ⓢ Ne vous occupez pas du château, Ragnar. Nous nous chargerons de tout pendant que vous essaierez de savoir où sont passés ces enfants.\n@c2@"
  it: "@a@b*: Galiardo, al castello pensiamo noi. Ci prenderemo cura delle cose qui, mentre tu investigherai sulla scomparsa di quei bambini.\n@c2@"
  ja: "@a@b＊「城の守りは　我らにまかせて\n\tライアンさんは　子供の探索に\n\t全力をつくしてくださいっ！\n@c2@"
"103":
  de: "@a@b*: Ach, du bist es, Ragnar. Geh ruhig rein.\n@c2@"
  en: "@a@b*: Och, it's you, Ragnar. Gae on by.\n@c2@"
  es: "@a@b*: ¡Ah!, es usted, Ragnar. Adelante, pase.\n@c2@"
  fr: "@a@b*ⓢ Oh, c'est vous, Ragnar. Allez-y, passez.\n@c2@"
  it: "@a@b*: Ah, sei tu, Galiardo. Passa pure.\n@c2@"
  ja: "@a@b＊「誰かと思えば　ライアンどのか。\n\tどうぞ　お通りください。\n@c2@"
"104":
  de: "@a@b*: Klar kannst du in die Burg, aber König Burkhard wirst du wohl kaum sprechen können. Der empfängt abends niemanden mehr.\n@c2@"
  en: "@a@b*: Ye can gae inside the castle by all means, but ye cannae see King Burnard. No one sees His Majesty of a night, I'm afraid.\n@c2@"
  es: "@a@b*: Claro que puede entrar en el castillo, pero no puede ver al rey Recaredo. Nadie puede visitar a Su Majestad de noche, lo lamento.\n@c2@"
  fr: "@a@b*ⓢ Vous pouvez entrer dans le château, mais vous ne pouvez pas voir le roi Bastien. Personne ne rencontre Sa Majesté de nuit, je regrette.\n@c2@"
  it: "@a@b*: %H860%XPuoi%YPotete%Z entrare nel castello, ma temo che non sia possibile incontrare Re Basilio a quest'ora. Di notte, Sua Maestà non riceve nessuno.\n@c2@"
  ja: "@a@b＊「城には入れますが\n\t王には　会えませんよ。\n\t夜の決まりっす。\n@c2@"
"105":
  de: "@a@b*: Du musst König Burkhard Bericht erstatten? Tja, wenn's nicht eilig ist, komm lieber morgen wieder.\n@c2@"
  en: "@a@b*: Ye need tae report tae King Burnard?\nWell, if there's no hurry, it'd be better if ye come back the morra.\n@c2@"
  es: "@a@b*: ¿Que debe presentarse ante el rey Recaredo?\nBueno, si no es muy urgente, será mejor que vuelva por la mañana.\n@c2@"
  fr: "@a@b*ⓢ Vous devez faire un rapport au roi Bastienⓡ Eh bien, s'il n'y a pas d'urgence, il vaudrait mieux que vous reveniez demain matin.\n@c2@"
  it: "@a@b*: %H860%XDevi%YDovete%Z fare rapporto a Re Basilio? Se non si tratta di una cosa di estrema urgenza, penso sia meglio che %H860%Xtu torni%Yvoi torniate%Z domattina.\n@c2@"
  ja: "@a@b＊「王に　ご報告ですかな？\n\tだが　急ぎの報告でなければ\n\t明日にしていただきたい。\n@c2@"
"106":
  de: "@a@b*: Nach der heutigen Aufregung sei ihm zumindest eine gute Nachtruhe gegönnt.\n@c2@"
  en: "@a@b*: After the stramash of a day he's had, the least we can dae is let him get a good night's sleep.\n@c2@"
  es: "@a@b*: Después del día tan agitado que ha tenido, lo menos que podemos hacer es procurarle una noche de sueño reparador.\n@c2@"
  fr: "@a@b*ⓢ Après la journée éprouvante qu'il a eue, le moins que l'on puisse faire, c'est de le laisser profiter d'une bonne nuit de sommeil.\n@c2@"
  it: "@a@b*: Oggi ha avuto una giornata pesantissima. Sarà meglio lasciarlo riposare.\n@c2@"
  ja: "@a@b＊「昼間は多忙ゆえ　夜ぐらいは\n\t王には　しっかり身体を\n\t休めていただきたいのだ。\n@c2@"
"107":
  de: "@a@b*: Ach, du bist es, Ragnar!\nAuch unterwegs nach Auenfelde?\n@c3@"
  en: "@a@b*: Ach, it's you Ragnar! Are ye on yer way tae Strathbaile, too?\n@c3@"
  es: "@a@b*: ¡Ah!, es usted, Ragnar. ¿También se dirige a Candonga?\n@c3@"
  fr: "@a@b*ⓢ Ah, c'est vous, Ragnarⓠ Vous allez à Strattbourg, vous aussiⓡ\n@c3@"
  it: "@a@b*: Ah, Galiardo. Anche tu stai andando a Bellavalle?\n@c3@"
  ja: "@a@b＊「おお　ライアン！\n\t私も　これから　イムルの村へ\n\t行くところなのだ。\n@c3@"
"108":
  de: "@a@b*: Was bin ich für ein blindes Huhn! Ich hab mich wohl gründlich verlaufen.\n@c3@"
  en: "@a@b*: Whit a gowk I am! I cannae seem tae find ma way.\n@c3@"
  es: "@a@b*: ¡Qué torpe soy! Soy incapaz de encontrar la salida.\n@c3@"
  fr: "@a@b*ⓢ Quel idiot je suisⓠ Je crois bien que je me suis perdu.\n@c3@"
  it: "@a@b*: Che razza di pollo che sono! Mi sono perso, e non so più da che parte devo andare!\n@c3@"
  ja: "@a@b＊「こまったぞ……。\n\tどうやら　道に迷ったらしい……。\n@c3@"
"109":
  de: "@a@b*: Wie? Du willst mir zeigen, wo der Ausgang ist?\n@c3@"
  en: "@a@b*: Sorry? Ye'll show me where the exit is?\n@c3@"
  es: "@a@b*: ¿Cómo? ¿Que podría indicarme dónde está la salida?\n@c3@"
  fr: "@a@b*ⓢ Pardon, vous pourriez m'indiquer la sortieⓡ\n@c3@"
  it: "@a@b*: Come? %H860%XVuoi%YVolete%Z indicarmi dov'è l'uscita?\n@c3@"
  ja: "@a@b＊「なに？　出口まで\n\tつれていってやるだと？\n@c3@"
"110":
  de: "@a@b*: Ach, schon gut, Ragnar. Ist besser, wenn ich selbst hier rausfinde.\n@c3@"
  en: "@a@b*: Och, there's no need for that, Ragnar.\nIt's better that I get there by maself anyhoo.\n@c3@"
  es: "@a@b*: Ah, eso no será necesario, Ragnar.\nEs mejor que llegue por mí mismo.\n@c3@"
  fr: "@a@b*ⓢ Oh, c'est inutile, Ragnar.\nIl vaut mieux que je me débrouille tout seul.\n@c3@"
  it: "@a@b*: Grazie, Galiardo, ma non ce n'è bisogno. Devo riuscire a trovarla da me!\n@c3@"
  ja: "@a@b＊「いらぬ　お世話だ　ライアン。\n\t私は　自力で出てみせるぞ！\n@c3@"
"111":
  de: "@a@b*: Ah, hallo, Soldat! Willkommen in Auenfelde.\n@c2@"
  en: "@a@b*: Well, hello there, soldier! Welcome tae Strathbaile.\n@c2@"
  es: "@a@b*: ¡Saludos, soldado! Sea bienvenido a Candonga.\n@c2@"
  fr: "@a@b*ⓢ Tiens, bonjour soldatⓠ Bienvenue à Strattbourg.\n@c2@"
  it: "@a@b*: Salve, soldato! Benvenuto a Bellavalle!\n@c2@"
  ja: "@a@b＊「ややっ　戦士さま！\n\tようこそ　イムルの村に。\n@c2@"
"112":
  de: "@a@b*: Ihr müsst uns helfen! Unsere Kinderchen werden vermisst!\n@c2@"
  en: "@a@b*: Ye've got tae help us! Oor wee laddie's gone missin'!\n@c2@"
  es: "@a@b*: ¡Tiene que ayudarnos! ¡Nuestro pequeño ha desaparecido!\n@c2@"
  fr: "@a@b*ⓢ Vous devez nous aiderⓠ Notre petit garçon a disparuⓠ\n@c2@"
  it: "@a@b*: %H860%XDevi%YDovete%Z aiutarci! I nostri figli sono scomparsi nel nulla!\n@c2@"
  ja: "@a@b＊「おお　戦士さま！　うちの息子も\n\tいなくなったんだ！\n@c2@"
"113":
  de: "@a@b*: Wer kann nur dahinterstecken?\nIch verstehe nicht, wie jemand unsere Kinder entführen kann.\n@c2@"
  en: "@a@b*: Who can be doin' this? I cannae understand hoo anyone would want tae take oor kiddies away.\n@c2@"
  es: "@a@b*: ¿Quién puede estar detrás de esto? No entiendo por qué alguien querría llevarse a nuestros niños.\n@c2@"
  fr: "@a@b*ⓢ Qui peut bien faire çaⓡ Je ne comprends pas pourquoi on voudrait nous enlever nos enfants.\n@c2@"
  it: "@a@b*: Chi può aver compiuto un atto tanto crudele?! Bisogna essere proprio senza cuore per fare una cosa del genere a dei bambini...!\n@c2@"
  ja: "@a@b＊「いったい　何者のしわざだ！？\n\t子供をさらって　どんな得が\n\tあるっていうんだよ？\n@c2@"
"114":
  de: "@a@b*: Schön, dass Ihr hier seid, Soldat.\nEs hilft Euch vermutlich nicht weiter, aber...\n@c1@"
  en: "@a@b*: It's good tae see ye here, soldier.\nThis probably willnae help ye at all, but...\n@c1@"
  es: "@a@b*: Nos alegramos de que esté aquí, soldado.\nProbablemente no servirá de nada, pero...\n@c1@"
  fr: "@a@b*ⓢ Contente de vous voir ici, soldat.\nÇa ne vous aidera probablement pas, mais...\n@c1@"
  it: "@a@b*: Sono felice che tu sia qui, soldato. Anche se dubito che tu possa risolvere i nostri problemi... \n@c1@"
  ja: "@a@b＊「よく来て下さいました　戦士さま。\n\tこんなこと　子供をさがす　手がかりには\n\tならないでしょうけど……。\n@c1@"
"115":
  de: "@a@b*: Es war, als hätte sich das Kind vor meinen Augen in Luft aufgelöst.\n@c1@"
  en: "@a@b*: Well, it was like the bairn just disappeared right afore ma eyes.\n@c1@"
  es: "@a@b*: Bueno, fue como si el chiquillo se desvaneciese ante mis propios ojos.\n@c1@"
  fr: "@a@b*ⓢ Eh bien, c'est comme si le petit s'était évaporé juste sous mes yeux.\n@c1@"
  it: "@a@b*: In pratica, il bambino è sparito proprio davanti ai miei occhi!\n@c1@"
  ja: "@a@b＊「あの子は　私の目の前で\n\tパッと消えるように\n\tいなくなったんです。\n@c1@"
"116":
  de: "@a@b*: Das hier ist die Schule von Auenfelde. Auch Peterchen, der Bub des Herbergswirtes, hat sie besucht, ehe er verschwand.\n@c2@"
  en: "@a@b*: This is Strathbaile school. The innkeeper's son, wee Willy Wally, was a pupil here afore he disappeared.\n@c2@"
  es: "@a@b*: Esta es la escuela de Candonga. El hijo del posadero, el pequeño Pelayo, era alumno de esta escuela antes de desaparecer.\n@c2@"
  fr: "@a@b*ⓢ Voici l'école de Strattbourg. Le fils de l'aubergiste, le petit Hugues Esclin, était élève ici avant sa disparition.\n@c2@"
  it: "@a@b*: Questa è la scuola di Bellavalle. Il figlio del gestore della locanda, il piccolo Giacomino, studiava qui, prima di scomparire nel nulla...\n@c2@"
  ja: "@a@b＊「ここは　学校です。\n\tいなくなった　宿屋のププルも\n\tここの生徒でした。\n@c2@"
"117":
  de: "@a@b*: Der Mann im Gefängnis sagt, er habe mal in Burland gelebt.\n@c1@"
  en: "@a@b*: The fella doon in the jail says he used tae live in Burland.\n@c1@"
  es: "@a@b*: Ese tipo de la cárcel dice que solía vivir en Burlandia.\n@c1@"
  fr: "@a@b*ⓢ Le type qui est emprisonné dit qu'il vivait à Bastione, autrefois.\n@c1@"
  it: "@a@b*: Il tizio giù in cella dice che viveva a Burlandia.\n@c1@"
  ja: "@a@b＊「地下の牢屋にいる　おじちゃんは\n\tバトランドに住んでたんだって。\n@c1@"
"118":
  de: "@a@b*: Ach, sieh an, Ragnar Rauhbein! Du hast's also endlich nach Auenfelde geschafft, was?\n@c3@"
  en: "@a@b*: Well, if it isn't Ragnar McRyan! So ye finally made it tae Strathbaile, eh?\n@c3@"
  es: "@a@b*: ¡Vaya, que me aspen si no es Ragnar McRyan! Así que finalmente ha logrado llegar a Candonga, ¿eh?\n@c3@"
  fr: "@a@b*ⓢ Tiens, tiens, mais c'est Ragnar McRyanⓠ Alors vous êtes finalement arrivé à Strattbourgⓡ\n@c3@"
  it: "@a@b*: Ma tu guarda! Galiardo de' Guglielmi! Allora, finalmente sei arrivato a Bellavalle, eh?\n@c3@"
  ja: "@a@b＊「やや　ライアンではないか！？\n\tおぬしも　やっと　イムルの村に\n\tやってきたか！\n@c3@"
"119":
  de: "@a@b*: Leider habe ich noch nicht herausgefunden, wo die Kinder stecken.\n@c3@"
  en: "@a@b*: I'm afraid I've no more information on the whereaboots o' those wee kiddies.\n@c3@"
  es: "@a@b*: Me temo que no tengo más información sobre el paradero de esos muchachitos.\n@c3@"
  fr: "@a@b*ⓢ J'ai bien peur de ne pas en savoir plus sur l'endroit où se trouvent ces enfants.\n@c3@"
  it: "@a@b*: Mi spiace, ma non so che altro dirti sulla scomparsa dei bambini.\n@c3@"
  ja: "@a@b＊「子供のゆくえについては\n\tいまだ　何の情報も\n\t得てはいないが……。\n@c3@"
"120":
  de: "@a@b*: Ob wohl der Turm im Westen etwas damit zu tun hat? Ich weiß nur nicht, wie man dort hineinkommt.\n@c3@"
  en: "@a@b*: I'm wonderin' if that tur tae the west has somethin' tae dae wi' it all, but I dinnae hae the first clue hoo tae get inside.\n@c3@"
  es: "@a@b*: Me pregunto si esa torre situada al oeste tendrá algo que ver con todo esto, aunque no tengo ni la menor idea de cómo entrar en ella.\n@c3@"
  fr: "@a@b*ⓢ Je me demande si cette tour, là-bas à l'ouest, n'aurait pas quelque chose à voir là-dedans, mais je ne sais pas comment y entrer.\n@c3@"
  it: "@a@b*: Magari c'è qualche indizio nella torre che si trova a ovest di qui, ma non ho la più pallida idea di come entrarci.\n@c3@"
  ja: "@a@b＊「私は　この地の西にある塔が\n\tあやしいと思うのだが　あそこには\n\tどうやって　入ればいいのだ？\n@c3@"
"121":
  de: "@a@b*: Da ist so ein frecher Knilch, der immer draußen rumschleicht, wenn's dunkel wird.\n@c2@"
  en: "@a@b*: There's a cheeky wee beggar who's always footerin' aroond ootside at night.\n@c2@"
  es: "@a@b*: Hay un mendigo muy fresco que siempre anda deambulando por ahí fuera cuando oscurece.\n@c2@"
  fr: "@a@b*ⓢ Toutes les nuits, il y a un mendiant effronté qui rôde à l'extérieur.\n@c2@"
  it: "@a@b*: C'è un dannato vagabondo che gironzola da queste parti tutte le notti.\n@c2@"
  ja: "@a@b＊「けしからんことに　夜になると\n\t宿屋のフロを　のぞくヤツが\n\t決まって　あらわれおる。\n@c2@"
"122":
  de: "@a@b*: Wenn ich ihn noch mal seh, dann frag ich ihn, was er da eigentlich treibt.\n@c2@"
  en: "@a@b*: Next time I see him, I'm gonnae ask just what he thinks he's up tae.\n@c2@"
  es: "@a@b*: La próxima vez que lo vea, le voy a preguntar qué diantre cree que está haciendo.\n@c2@"
  fr: "@a@b*ⓢ La prochaine fois que je le verrai, je lui demanderai ce qu'il mijote.\n@c2@"
  it: "@a@b*: La prossima volta che lo vedo, voglio proprio chiedergli che accidenti viene a fare qui!\n@c2@"
  ja: "@a@b＊「うらやましいこっちゃ。\n\tわしも逃げ足さえ　はやければのう……。\n@c2@"
"123":
  de: "@a@b*: Den Kerl im Kittchen haben sie beim Brotstehlen erwischt.\n㈡\n*: Aber er hat sein Gedächtnis verloren und kann sich an nichts erinnern.\n@c2@"
  en: "@a@b*: The fella doon in the jail was caught stealin' bread, but his memory's gone and he cannae mind a thing aboot it.\n@c2@"
  es: "@a@b*: A ese individuo de la cárcel lo sorprendieron robando pan, pero ha perdido la memoria y no recuerda nada.\n@c2@"
  fr: "@a@b*ⓢ Le type qui est en prison s'est fait prendre en train de voler du pain, mais il a perdu la mémoire et ne se souvient de rien.\n@c2@"
  it: "@a@b*: Hanno messo in prigione un uomo che aveva rubato del pane. Da quando l'hanno messo dentro, non ci sta più con la testa... \n@c2@"
  ja: "@a@b＊「この村の　牢屋にいる人は\n\tパンを盗んで　つかまったんだけど\n\t記憶をなくしているようなの。\n@c2@"
"124":
  de: "@a@b*: Er muss was Furchtbares erlebt haben, dass es ihn wieder zu einem Kind gemacht hat.\n@c2@"
  en: "@a@b*: He must hae had somethin' terrifyin' happen tae him tae be reduced back tae bein' a kid like that.\n@c2@"
  es: "@a@b*: Seguro que le ha sucedido alguna cosa espeluznante para reducirlo a ese estado infantil.\n@c2@"
  fr: "@a@b*ⓢ Il a dû lui arriver quelque chose d'horrible pour qu'il retombe en enfance comme ça.\n@c2@"
  it: "@a@b*: Si comporta come se fosse un bambino! Chissà cosa deve aver passato per essersi ridotto in quello stato...\n@c2@"
  ja: "@a@b＊「いい大人なのに　心だけが子供に\n\t逆もどりするなんて　よっぽど\n\t怖い目に　あったんだろうねえ。\n@c2@"
"125":
  de: "@a@b*: Nä, nä, nä, nä, nä, ne!\nDu kriegst mich nicht, du kriegst mich nicht!\n@c1@"
  en: "@a@b*: Na na na na naaah!\nYe cannae catch me, ye cannae catch me!\n@c1@"
  es: "@a@b*: ¡Chincha rabiña!\n¡A que no me pillas!\n@c1@"
  fr: "@a@b*ⓢ Na na na na nère-euhⓠ\nTu m'attraperas pasⓠ Tu m'attraperas pasⓠ\n@c1@"
  it: "@a@b*: Na na na na naa!\nNon mi prendi!\nNon mi prendi!\n@c1@"
  ja: "@a@b＊「やだよ～だ！\n\t絶対　つかまんないもんね！\n@c1@"
"126":
  de: "@a@b*: Warte! So warte doch! Verflixt! Kann denn keiner das Mädel zur Vernunft bringen?!\n@c1@"
  en: "@a@b*: Wait! Just wait, will ye!? Jings! Can someone no stop that lass from footerin' aboot!?\n@c1@"
  es: "@a@b*: ¡Espere! ¡Espere un momento, haga el favor! ¡Demonios! ¡¿Es que no puede alguien hacer que esta muchacha se esté quieta?!\n@c1@"
  fr: "@a@b*ⓢ Attendsⓠ Arrête-toi, tu veuxⓠⓑ\nPar la Déesse, personne ne peut donc empêcher cette gamine de faire des bêtisesⓠⓑ\n@c1@"
  it: "@a@b*: Ferma! Fermati!\nAccidenti! Chi mi aiuta a prendere quella piccola peste?!\n@c1@"
  ja: "@a@b＊「お待ちなさい　待ちなさいったら！\n\tああ　もうっ！　誰か\n\tその子を　つかまえてくださいな。\n@c1@"
"127":
  de: "@a@b*: Menno! Wie soll man sich denn da konzentrieren können?\n@c1@"
  en: "@a@b*: Wheesht! Hoo am I supposed tae study wi' all these distractions?\n@c1@"
  es: "@a@b*: ¡Recórcholis! ¿Cómo voy a concentrarme para estudiar con tantas distracciones?\n@c1@"
  fr: "@a@b*ⓢ Chutⓠ Comment voulez-vous que j'étudie si je suis toujours dérangéⓡ\n@c1@"
  it: "@a@b*: Accipicchia! Ma come si fa a studiare con tutta questa confusione?!\n@c1@"
  ja: "@a@b＊「もう　うるさいなあ。\n\t勉強のジャマしないでよ。\n@c1@"
"128":
  de: "@a@b*: Ihr seid aus der Burg Burland! Ist das toll.\n@c1@"
  en: "@a@b*: Ye're from the castle in Burland! I think ye're amazin'.\n@c1@"
  es: "@a@b*: ¡¿Es usted del Castillo de Burlandia?! ¡Es fantástico!\n@c1@"
  fr: "@a@b*ⓢ Vous venez du château de Bastioneⓠ Vous savez, je vous trouve incroyable.\n@c1@"
  it: "@a@b*: %H860%XVieni%YVenite%Z dal castello di Burlandia? Che forza!\n@c1@"
  ja: "@a@b＊「おじちゃん　バトランドの\n\tお城から来た　戦士さまだよね。\n\tかっこいいなあ。\n@c1@"
"129":
  de: "@a@b*: Wenn ich groß bin, gehe ich auch zur Palastwache, genau wie Ihr.\n@c1@"
  en: "@a@b*: When I grow up, I'm goin' tae be a palace guard just like ye.\n@c1@"
  es: "@a@b*: Cuando crezca quiero ser guardia de palacio como usted.\n@c1@"
  fr: "@a@b*ⓢ Quand je serai grand, je serai garde royal, comme vous.\n@c1@"
  it: "@a@b*: Da grande voglio fare la guardia di palazzo, proprio come te!\n@c1@"
  ja: "@a@b＊「ぼくも　おおきくなったら\n\tお城の戦士になるんだ。\n@c1@"
"130":
  de: "@a@b*: Verschwundene Kinder? Meint Ihr Peterchen aus der Herberge? Ja, klar kenn ich den.\n@c1@"
  en: "@a@b*: Disappearin' children? D'ye mean Willy Wally from the inn? Ah, I know him, all right.\n@c1@"
  es: "@a@b*: ¿Niños desaparecidos? ¿Se refiere a Pelayo, el de la posada? ¡Ah!, sí, claro que lo conozco.\n@c1@"
  fr: "@a@b*ⓢ Des enfants qui disparaissentⓡ Vous voulez parler d'Hugues Esclin, de l'aubergeⓡ Oui, je le connais bien.\n@c1@"
  it: "@a@b*: Bambini scomparsi?! Ma %H860%Xstai%Ystate%Z parlando di Giacomino, il figlio del gestore della locanda? Oh, io so cosa gli è successo!\n@c1@"
  ja: "@a@b＊「いなくなった　子供？\n\t宿屋のププルだろ？\n\tうん　知ってるよ。\n@c1@"
"131":
  de: "@a@b*: Der ist ein Engel geworden und in den Himmel geflogen! Doch, echt!\n@c1@"
  en: "@a@b*: He became an angel an' flew away in the sky. It's true!\n@c1@"
  es: "@a@b*: Se convirtió en un ángel y salió volando hacia el cielo. ¡Se lo prometo!\n@c1@"
  fr: "@a@b*ⓢ Il s'est transformé en ange et s'est envolé dans le ciel. Pour de vraiⓠ\n@c1@"
  it: "@a@b*: Si è trasformato in un angelo, ed è volato in cielo... Dico davvero!\n@c1@"
  ja: "@a@b＊「ププルは　天使になって\n\tお空に飛んでいったんだ。\n\tホントだよ！\n@c1@"
"132":
  de: "@a@b*: Gut, dass Ihr gekommen seid, Soldat. Aber wir sind mitten im Unterricht.\n@c2@"
  en: "@a@b*: It's good that ye came, soldier. But we're in the middle of a lesson right noo.\n@c2@"
  es: "@a@b*: Me alegro de que haya venido, soldado. Pero estamos en mitad de clase.\n@c2@"
  fr: "@a@b*ⓢ C'est bien d'être venu, soldat. Mais nous sommes au beau milieu d'une leçon, pour l'instant.\n@c2@"
  it: "@a@b*: Mi fa piacere che tu sia qui, soldato, ma siamo nel bel mezzo della lezione.\n@c2@"
  ja: "@a@b＊「これはこれは　戦士どの。\n\tよくぞ　まいられた。\n\tが　いまは授業の最中。\n@c2@"
"133":
  de: "@a@b*: Kommt doch heute Abend wieder, dann können wir reden, so viel Ihr wollt.\n@c2@"
  en: "@a@b*: Come back tonight an' we can gab away as much as ye like then.\n@c2@"
  es: "@a@b*: Si regresa esta noche podemos charlar cuanto quiera.\n@c2@"
  fr: "@a@b*ⓢ Revenez ce soir et nous pourrons parler autant que vous voudrez.\n@c2@"
  it: "@a@b*: Torna stasera, e potremo parlare con calma.\n@c2@"
  ja: "@a@b＊「くわしい話は　また夜にでも……。\n@c2@"
"134":
  de: "@a@b%0%a00120 untersucht die Wand.\n@c0@"
  en: "@a@b%0%a00120 examines the wall.\n@c0@"
  es: "@a@b%0%a00120 examina la pared.\n@c0@"
  fr: "@a@b%0%a00120 examine le mur.\n@c0@"
  it: "@a@b%0%a00120 esamina il muro.\n@c0@"
  ja: "@a@b%a00120は　カベを　調べた！\n@c0@"
"135":
  de: "@a@bDa hängen Bilder, die von den Kindern gemalt wurden.\n@c0@"
  en: "@a@bThere are pictures drawn by the children hanging\non it.\n@c0@"
  es: "@a@bHay dibujos hechos por los niños.\n@c0@"
  fr: "@a@bDes dessins faits par les enfants y sont accrochés.\n@c0@"
  it: "@a@bSulla parete ci sono dei disegni fatti dai bambini.\n@c0@"
  ja: "@a@bカベには子供たちの絵が\nかけられている。\n@c0@"
"136":
  de: "@a@b*: Peterchen soll gerade mit einem Paar merkwürdiger Schuhe gespielt haben, als er verschwand.\n㈡\n*: Wenn Ihr mich fragt, klingt das alles recht seltsam.\n@c2@"
  en: "@a@b*: It sounds like wee Willy Wally was playin' wi' some strange shoes at the time he disappeared. It's all verra strange, if ye ask me.\n@c2@"
  es: "@a@b*: Parece que el pequeño Pelayo estaba jugando con unos extraños zapatos cuando desapareció. Es muy raro, esa es mi opinión.\n@c2@"
  fr: "@a@b*ⓢ À ce qu'on dit, Hugues Esclin était en train de jouer avec de drôles de chaussures lorsqu'il a disparu. Tout ça est très bizarre, à mon avis.\n@c2@"
  it: "@a@b*: Pare che Giacomino stesse giocando con uno strano paio di calzature prima di scomparire. Che storia bizzarra, eh?\n@c2@"
  ja: "@a@b＊「うちのヤツが言うには\n\tププルが消えるとき　おかしなクツで\n\t遊んでいたそうなんですが……。\n@c2@"
"137":
  de: "@a@b*: Ich bin eine Wandernonne. Ich ziehe durch die Lande, um das Wort der Göttin zu verbreiten.\n@c1@"
  en: "@a@b*: I'm a travelling nun. I journey around the world to spread word of the Goddess.\n@c1@"
  es: "@a@b*: Soy una monja viajera. Viajo por todo el mundo para predicar la palabra de la Diosa.\n@c1@"
  fr: "@a@b*ⓢ Je suis une religieuse itinérante. Je voyage de par le monde pour répandre la parole de la Déesse.\n@c1@"
  it: "@a@b*: Sono una suora errante. Vado per il mondo a diffondere il verbo della dea.\n@c1@"
  ja: "@a@b＊「わたしは　旅の尼。\n\t神のお告げをうけて\n\t旅をしています。\n@c1@"
"138":
  de: "@a@b*: Ich bin sicher, die verschwundenen Kinder werden ihre Stimme hören und in Sicherheit gebracht werden.\n@c1@"
  en: "@a@b*: I'm sure the children who went missing will hear her voice in the end, and be guided back to safety.\n@c1@"
  es: "@a@b*: Estoy convencida de que los niños perdidos oirán su voz, que les guiará de vuelta a un lugar seguro.\n@c1@"
  fr: "@a@b*ⓢ Je suis sûre que les enfants disparus finiront par entendre sa voix et retrouveront leur chemin sains et saufs.\n@c1@"
  it: "@a@b*: Sono certa che i bambini scomparsi sentiranno presto la sua voce, e che torneranno a casa sani e salvi.\n@c1@"
  ja: "@a@b＊「やがて　この地のどこかに\n\t神の御心をうけた　若者が\n\t現れることでしょう。\n@c1@"
"139":
  de: "@a@b*: Wisst Ihr, ich war es, der den Mann beim Brotstehlen erwischt hat.\n@c2@"
  en: "@a@b*: D'ye ken that I'm the one who caught that laddie stealin' the bread?\n@c2@"
  es: "@a@b*: ¿Sabe que yo soy el que atrapó a ese sujeto robando el pan?\n@c2@"
  fr: "@a@b*ⓢ Vous savez que c'est moi qui ai attrapé ce type en train de voler du painⓡ\n@c2@"
  it: "@a@b*: Lo %H860%Xsai%Ysapete%Z? Sono stato io a catturare il tipo che rubava il pane!\n@c2@"
  ja: "@a@b＊「パンを盗んだ男ば\n\tとっつかまえたのは\n\tおいですたい。\n@c2@"
"140":
  de: "@a@b*: Er sitzt jetzt hinter Gittern, zeigt aber kein bisschen Reue.\n@c2@"
  en: "@a@b*: He's behind bars doon in the jail noo, but he's no showin' a scrap o' remorse.\n@c2@"
  es: "@a@b*: Ahora está entre rejas, pero no parece mostrarse demasiado arrepentido.\n@c2@"
  fr: "@a@b*ⓢ Il est derrière les barreaux, à présent, mais il ne semble pas avoir le moindre remord.\n@c2@"
  it: "@a@b*: Anche se ora è in gattabuia, non mostra il minimo segno di rimorso!\n@c2@"
  ja: "@a@b＊「ヤツなら　今　牢屋に入って\n\tおとなしゅうしとっけど\n\tちぃーとも反省してなかとよ。\n@c2@"
"141":
  de: "@a@b*: Er tut gar, als sei er ein Bub, und will freigelassen werden!\n@c2@"
  en: "@a@b*: He's even got the cheek tae be pretendin' he's a kid an' askin' tae be let oot!\n@c2@"
  es: "@a@b*: ¡Aún tiene la desfachatez de fingir que es un niño y pedir que le dejen salir!\n@c2@"
  fr: "@a@b*ⓢ Il a même le culot de prétendre qu'il n'est qu'un enfant et il demande qu'on le laisse sortirⓠ\n@c2@"
  it: "@a@b*: Anzi! Ha la faccia tosta di fingere di essere un bambino, e chiede di essere liberato subito!\n@c2@"
  ja: "@a@b＊「けしからんことに\n\t子供のふりして　牢から\n\t出してもらおうとしとるばい。\n@c2@"
"142":
  de: "@a@b*: Miau.\n@c1@"
  en: "@a@b*: Meow.\n@c1@"
  es: "@a@b*: Miau.\n@c1@"
  fr: "@a@b*ⓢ Miaou.\n@c1@"
  it: "@a@b*: Miaaao!\n@c1@"
  ja: "@a@b＊「にゃ～ん。\n@c1@"
"143":
  de: "@a@b*: Wer seid Ihr?\n@c2@"
  en: "@a@b*: Who are ye?\n@c2@"
  es: "@a@b*: ¿Quién es usted?\n@c2@"
  fr: "@a@b*ⓢ Qui êtes-vousⓡ\n@c2@"
  it: "@a@b*: Chi %H860%Xsei%Ysiete%Z?\n@c2@"
  ja: "@a@b＊「おじちゃん　だれ？\n@c2@"
"144":
  de: "@a@b*: Könnt Ihr mich nicht hier rauslassen? Ich hab das Brot doch nur genommen, weil ich solchen Hunger hatte. BITTE!\n@c2@"
  en: "@a@b*: Can ye let me oot of here? I only took the bread because I was hungry. LET ME OOT! WAAAAH!!!\n@c2@"
  es: "@a@b*: ¿Puede dejarme salir? Solo hurté el pan porque estaba hambriento. ¡Buaaa!\n@c2@"
  fr: "@a@b*ⓢ Vous pouvez m'aider à sortir d'iciⓡ Je n'ai volé ce pain que parce que j'avais faim. FAITES-MOI SORTIR, JE VOUS EN PRIEⓠ BOUOUOUHⓠⓐⓐ\n@c2@"
  it: "@a@b*: Per favore, %H860%Xfammi%Yfatemi%Z uscire da qui! Ho rubato quel pane solo perché avevo fame! Sob! Sob!\n@c2@"
  ja: "@a@b＊「ねえ　ここから　出してよお。\n\tぼくは　おなかが　すいたから\n\tパンをもらっただけなのに…え～ん。\n@c2@"
"145":
  de: "@a@b*: Buuh, huuh. Was? Wie ich heiße? Alfons.\n@c2@"
  en: "@a@b*: Huuh, huuh. Sorry? Ma name? I'm Angus.\n@c2@"
  es: "@a@b*: Aaah, aaah. ¿Disculpe? ¿Mi nombre? Me llamo Angustio.\n@c2@"
  fr: "@a@b*ⓢ Snif, snif... Pardonⓡ Quel est mon nomⓡ Je m'appelle Angus.\n@c2@"
  it: "@a@b*: Sob! Come? Oh, il mio nome è Attilio.\n@c2@"
  ja: "@a@b＊「えぐっ　えぐっ……。\n\tえ？　ぼくの名前？\n\tぼくは　アレクスだよう…ひっく。\n@c2@"
"146":
  de: "@a@b*: Der Kerl, der das Brot geklaut hat, hat sich lange mit den Kindern unterhalten, ehe sie ihn geschnappt haben.\n@c3@"
  en: "@a@b*: That fella who stole the bread was havin' a good time of it chattin' away tae the kiddies afore he was caught.\n@c3@"
  es: "@a@b*: Ese tipo que robó el pan se estaba divirtiendo hablando con los niños hasta que lo atraparon.\n@c3@"
  fr: "@a@b*ⓢ Le type qui a volé le pain a passé pas mal de temps à discuter avec les gamins avant de se faire prendre.\n@c3@"
  it: "@a@b*: Il ladro di pane si divertiva un mucchio a parlare coi bambini, prima che lo mandassero in galera...\n@c3@"
  ja: "@a@b＊「そういや　パンを盗んだヤツが\n\tとっつかまる前に　ガキどもに\n\tいろいろ　聞きまわってたな。\n@c3@"
"147":
  de: "@a@b*: Hick! Gibt doch nix Besseres als 'n kleines Schlückchen, wenn man zu den Sternen hochsieht.\n@c2@"
  en: "@a@b*: Hic! Ye cannae beat a wee dram while ye're lookin' up at the stars.\n@c2@"
  es: "@a@b*: ¡Hip! No hay nada como una copita para acompañarte mientras miras las estrellas.\n@c2@"
  fr: "@a@b*ⓢ Hicⓠ Rien ne vaut une bonne rasade en contemplant les étoiles.\n@c2@"
  it: "@a@b*: Hic! Non sh'è niente di meglio che un goshetto di quello buono mentre guardi le shtelle!\n@c2@"
  ja: "@a@b＊「ぐびぐび　ぷはー。\n\t星を見ながら　飲む酒は\n\t最高ですな。\n@c2@"
"148":
  de: "@a@b*: Ja, das ist ein echtes Rätsel. Wie können sich Kinder einfach in Luft auflösen?\n@c3@"
  en: "@a@b*: Ay, it's a real puzzler this one.\nHoo can kiddies just disappear intae thin air?\n@c3@"
  es: "@a@b*: Sí, es un verdadero enigma.\n¿Cómo pueden esfumarse así los niños?\n@c3@"
  fr: "@a@b*ⓢ Franchement, c'est un drôle de mystère. Comment des enfants peuvent-ils se volatiliser comme çaⓡ\n@c3@"
  it: "@a@b*: Accidenti! Proprio non me lo spiego! Com'è possibile che quei bambini siano svaniti nel nulla?!\n@c3@"
  ja: "@a@b＊「う～む　わからぬ……。\n\t目の前で　子供が消えることなど\n\tありえるのだろうか……。\n@c3@"
"149":
  de: "@a@b*: Der Mann im Gefängnis unten heißt Alfons.\nEr ist unser Freund.\n@c1@"
  en: "@a@b*: The man doon in the jail is called Angus.\nHe's oor friend.\n@c1@"
  es: "@a@b*: El hombre encerrado en la cárcel se llama Angustio.\nEs amigo nuestro.\n@c1@"
  fr: "@a@b*ⓢ L'homme qui est en prison s'appelle Angus.\nC'est notre copain.\n@c1@"
  it: "@a@b*: L'uomo che si trova in prigione si chiama Attilio. È amico mio.\n@c1@"
  ja: "@a@b＊「地下牢にいる　おじちゃんは\n\tアレクスって　名前らしいよ。\n\tぼくたちと　なかよしなんだ。\n@c1@"
"150":
  de: "@a@b*: Peterchen und mein Bruder sind bestraft worden, weil sie nicht gehorcht haben.\n@c1@"
  en: "@a@b*: Willy Wally an' ma brother are bein' punished for disobeyin' ma pa.\n@c1@"
  es: "@a@b*: Pelayo y mi hermano están recibiendo su castigo por desobedecer a mi papá.\n@c1@"
  fr: "@a@b*ⓢ Hugues Esclin et mon frère ont été punis parce qu'ils ont désobéi à mon papa.\n@c1@"
  it: "@a@b*: Giacomino e mio fratello sono in punizione perché hanno disubbidito a papà.\n@c1@"
  ja: "@a@b＊「お兄ちゃんと　ププルはね\n\tパパの言い付けを　やぶった\n\tバチが当たったんだよ。\n@c1@"
"151":
  de: "@a@b*: Papa hat gesagt, sie sollten nicht vor dem Dorf spielen, aber sie wollten ja nicht hören.\n@c1@"
  en: "@a@b*: Pa told them not tae go playin' ootside the village, but they dinnae ever listen.\n@c1@"
  es: "@a@b*: Papá les dijo que no salieran fuera del pueblo a jugar, pero nunca le hacen caso.\n@c1@"
  fr: "@a@b*ⓢ Papa leur avait dit de ne pas aller jouer hors du village, mais ils n'écoutent jamais rien.\n@c1@"
  it: "@a@b*: Papà aveva detto di non andare a giocare fuori dal villaggio, ma loro non lo hanno ascoltato.\n@c1@"
  ja: "@a@b＊「パパは　ぜったい村の外で\n\tあそんじゃダメだって\n\t言ったのに……。\n@c1@"
"152":
  de: "@a@b*: Mein Bub ist einer von denen, die verschwunden sind!\n@c2@"
  en: "@a@b*: Ma laddie's one o' the ones that went missin'!\n@c2@"
  es: "@a@b*: ¡Mi pequeño es uno de los que han desaparecido!\n@c2@"
  fr: "@a@b*ⓢ Mon petit garçon est l'un de ceux qui ont disparuⓠ\n@c2@"
  it: "@a@b*: Anche il mio povero cucciolo è stato rapito!\n@c2@"
  ja: "@a@b＊「おお　戦士さま！　うちの息子も\n\tいなくなったんだ！\n@c2@"
"153":
  de: "@a@b*: Wer tut uns das nur an? Ich versteh nicht, was die mit unseren Kindern wollen.\n@c2@"
  en: "@a@b*: Who's doin' this tae us? I cannae understand whit anyone would want wi' oor bairns.\n@c2@"
  es: "@a@b*: ¿Quién nos está haciendo esto? No comprendo lo que quiere de nuestros chiquillos.\n@c2@"
  fr: "@a@b*ⓢ Qui peut bien nous faire çaⓡ Je ne comprends pas ce qu'on peut vouloir à nos petits.\n@c2@"
  it: "@a@b*: Ma perché tanta crudeltà?! Con che coraggio si può fare del male a delle creature innocenti?!\n@c2@"
  ja: "@a@b＊「いったい　何者のしわざだ！？\n\t子供をさらって　どんな得が\n\tあるっていうんだよ？\n@c2@"
"154":
  de: "@a@b*: Morgen spielen wir weiter, Alfons. Ha-püh...\n@c1@"
  en: "@a@b*: Let's play again the morn, Angus. Ah-phew...\n@c1@"
  es: "@a@b*: Juguemos de nuevo por la mañana, Angustio. Uff...\n@c1@"
  fr: "@a@b*ⓢ On rejouera demain, Angus. Ron-pfff...\n@c1@"
  it: "@a@b*: Attilio, giocheremo ancora domattina... Ronf!\n@c1@"
  ja: "@a@b＊「アレクスちゃん。\n\tまた明日　あそぼうね……。\n\tむにゃむにゃ……。\n@c1@"
"155":
  de: "@a@b*: Nur keine Sorge.\n@c1@"
  en: "@a@b*: Not tae worry now.\n@c1@"
  es: "@a@b*: No hay por qué preocuparse.\n@c1@"
  fr: "@a@b*ⓢ Il n'y a pas de quoi s'inquiéter.\n@c1@"
  it: "@a@b*: Oh, non c'è da preoccuparsi.\n@c1@"
  ja: "@a@b＊「まあまあ　校長先生。\n@c1@"
"156":
  de: "@a@b*: Kinder haben doch immer ihre Geheimnisse. Das ist doch ganz normal, oder nicht, Soldat?\n@c1@"
  en: "@a@b*: Kiddies always hae their secrets. It's only natural, wouldnae ye say, soldier?\n@c1@"
  es: "@a@b*: Los chicos siempre tienen sus secretos. Es normal, ¿no le parece, soldado?\n@c1@"
  fr: "@a@b*ⓢ Les enfants ont toujours leurs petits secrets. C'est bien normal, n'est-ce pas, soldatⓡ\n@c1@"
  it: "@a@b*: Tutti i ragazzi hanno dei segreti, no? È una cosa assolutamente naturale!\n@c1@"
  ja: "@a@b＊「いつの時代でも　子供たちは\n\t彼らだけの秘密を　持っている\n\tものですわ。　ねえ　戦士さま。\n@c1@"
"157":
  de: "@a@b*: Hallo, Soldat. Wir haben uns gerade über diese traurige Sache unterhalten.\n@c2@"
  en: "@a@b*: Hello, soldier. We were just discussin' the whole sorry situation.\n@c2@"
  es: "@a@b*: Saludos, soldado. Estábamos hablando de esta triste situación.\n@c2@"
  fr: "@a@b*ⓢ Bonjour, soldat. Nous étions justement en train de parler de cette bien triste situation.\n@c2@"
  it: "@a@b*: Salve, soldato. Stavamo parlando di questa bruttissima situazione... \n@c2@"
  ja: "@a@b＊「これは　戦士どの。\n\t今ちょうど　事件のことを\n\t話しておったのです。\n@c2@"
"158":
  de: "@a@b*: Ich weiß nicht ⓚⓛ ich glaube, die Kinder verschweigen uns etwas.\n@c2@"
  en: "@a@b*: I cannae help but think that the bairns are hidin' somethin' between themselves.\n@c2@"
  es: "@a@b*: No puedo evitar pensar que los chiquillos ocultan algo en alguna parte.\n@c2@"
  fr: "@a@b*ⓢ Je ne peux pas m'empêcher de penser que les enfants nous cachent quelque chose.\n@c2@"
  it: "@a@b*: Secondo me, i bambini ci stanno nascondendo qualcosa...\n@c2@"
  ja: "@a@b＊「私には　どうも　子供たちが\n\tかくし事をしておるような\n\t気がして　ならんのですよ。\n@c2@"
"159":
  de: "@a@b*: Was?! Ihr wisst, dass ich ins Bad gekiebitzt habe?\n@c2@"
  en: "@a@b*: Whit!? Ye know I've been peekin' in at the bath!?\n@c2@"
  es: "@a@b*: ¡¿Qué?! ¡¿Cómo sabe que he estado espiando en los baños?!\n@c2@"
  fr: "@a@b*ⓢ Quoiⓠⓑ Vous savez que je regarde les bains en cachetteⓠⓑ\n@c2@"
  it: "@a@b*: Che cosa?! %H860%XSai%YSapete%Z che spiavo nel bagno?\n@c2@"
  ja: "@a@b＊「え？　私が　フロを\n\tのぞいているですって？\n\tふふ　とんでもない。\n@c2@"
"160":
  de: "@a@b*: Äh... Wisst Ihr was? Wenn Ihr das für Euch behaltet, verrate ich Euch ein Geheimnis.\n@c2@"
  en: "@a@b*: Em... I tell ye whit. Keep it tae yerself an' I'll let ye in on a secret.\n@c2@"
  es: "@a@b*: Bueno... Vamos a hacer una cosa. Si no se lo dice a nadie, yo le contaré un secreto.\n@c2@"
  fr: "@a@b*ⓢ Euh... écoutez. Si vous n'en parlez à personne, je vous dis un secret.\n@c2@"
  it: "@a@b*: Ehm... Ecco... %H860%XTi%YVi%Z dirò un segreto, ma %H860%Xdevi%Ydovete%Z promettermi che %H860%Xterrai%Yterrete%Z la bocca chiusa.\n@c2@"
  ja: "@a@b＊「でも　だまっていてくれたら\n\tいいことを　教えましょう。\n@c2@"
"161":
  de: "@a@b*: Ich hab nämlich den Mann im Gefängnis schon mal gesehen. Drüben in Burland, wenn ich mich recht erinnere.\n@c2@"
  en: "@a@b*: The thing is, I've seen that man who's in jail afore. Over in Burland toon, if I mind rightly.\n@c2@"
  es: "@a@b*: El tipo ese de la cárcel... Lo he visto antes. En la ciudad de Burlandia, si mal no recuerdo.\n@c2@"
  fr: "@a@b*ⓢ En fait, j'ai déjà vu ce type qui est en prison. Dans la ville de Bastione, si je me souviens bien.\n@c2@"
  it: "@a@b*: Dunque, io conosco il tipo che è rinchiuso in prigione. Se non ricordo male, l'ho visto a Burlandia.\n@c2@"
  ja: "@a@b＊「じつは　村の地下牢にいる男を\n\t以前　見たことがあるんです。\n\tバトランドの城下町　だったかな。\n@c2@"
"162":
  de: "@a@b*: Wenn Ihr Euch mit ihm unterhalten habt, solltet Ihr vielleicht nach Burland zurückgehen und versuchen, dort noch ein paar Dinge rauszufinden.\n@c2@"
  en: "@a@b*: Once ye've had a wee chat wi' him, ye should head back over tae Burland an' see if ye cannae learn a thing or two there.\n@c2@"
  es: "@a@b*: Tras dialogar con él, debería regresar a Burlandia y ver si puede descubrir algún dato de interés allí.\n@c2@"
  fr: "@a@b*ⓢ Une fois que vous lui aurez parlé, vous devriez retourner à Bastione pour voir si vous ne pouvez pas y apprendre quelque chose.\n@c2@"
  it: "@a@b*: Dopo che %H860%Xavrai parlato con lui, ti%Yavrete parlato con lui, vi%Z converrà tornare a Burlandia. Forse lì %H860%Xpotrai%Ypotrete%Z scoprire qualcosa di nuovo.\n@c2@"
  ja: "@a@b＊「地下牢にいる男と会ったのなら\n\tいちど　バトランドに戻ってみては？\n@c2@"
"163":
  de: "@a@b*: Ich bin eine Wandernonne. Ich wollte gerade ein Bad nehmen, wäre Euch also verbunden, wenn Ihr verschwinden könntet.\n@c1@"
  en: "@a@b*: I'm a travelling nun. I'm about to have a bath, so I'd be grateful if you could make yourself scarce.\n@c1@"
  es: "@a@b*: Soy una monja viajera. Voy a tomar un baño, así que le agradecería que abandonara la estancia.\n@c1@"
  fr: "@a@b*ⓢ Je suis une religieuse itinérante. Je m'apprête à prendre un bain, alors je vous serais reconnaissante de vous éclipser.\n@c1@"
  it: "@a@b*: Sono una suora errante, e vorrei fare un bagno. %H860%XTi sarei molto grata se te ne andassi%YVi sarei molto grata se ve ne andaste%Z!\n@c1@"
  ja: "@a@b＊「私は　旅の尼。\n\tこれから入浴するので　どうか\n\t出ていってくださいまし。\n@c1@"
"164":
  de: "@a@b*: Das ist 'n schnuckeliges Bad, so viel ist sicher.\nIch muss es ja wissen, schließlich hab ich's eigenhändig geputzt.\n@c2@"
  en: "@a@b*: Aye, this is a bonny wee bath, an' no mistake.\nI should know, I cleaned it wi' ma own hands.\n@c2@"
  es: "@a@b*: Ahhh... ¡córcholis!, ¡son unos baños pulquérrimos! Sé de lo que hablo, pues los he limpiado yo mismo.\n@c2@"
  fr: "@a@b*ⓢ Ah oui, ça c'est un joli bain, pour sûr.\nJ'en sais quelque chose, c'est moi qui l'ai nettoyé de mes propres mains.\n@c2@"
  it: "@a@b*: Ah, questo bagno è più lucido di uno specchio! Lo so bene, perché l'ho pulito con le mie mani!\n@c2@"
  ja: "@a@b＊「はぁはぁ……そろそろですたい。\n\tおいが　そうじしたフロに\n\t女の人が入るころばい。\n@c2@"
"165":
  de: "@aAlfons@bJa genau. Ich bin Alfons. Woher wisst Ihr meinen Namen?\n@c2@"
  en: "@aAngus@bAy, that's right. I'm Angus. So hoo do ye know ma name?\n@c2@"
  es: "@aAngustio@bSí, así es. Me llamo Angustio. ¿Cómo sabe mi nombre?\n@c2@"
  fr: "@aAngus@bOui, c'est bien moi. Je suis Angus. Comment connaissez-vous mon nomⓡ\n@c2@"
  it: "@aAttilio@bSì, è così! Io sono Attilio. Come %H860%Xfai%Yfate%Z a conoscere il mio nome?\n@c2@"
  ja: "@a@b＊「うん　そうだよ。\n\tぼく　アレクスっていうんだよ。\n\tどうして　知っているの？\n@c2@"
"166":
  de: "@aAlfons@bHa ha ha! Oooooh!\n@c2@"
  en: "@aAngus@bHa ha ha! Ooooh!\n@c2@"
  es: "@aAngustio@b¡Ja, ja, ja! ¡Ooooh!\n@c2@"
  fr: "@aAngus@bAaahⓠ Oooohⓠ\n@c2@"
  it: "@aAttilio@bArgh! Nooo!\n@c2@"
  ja: "@a@b＊「……あわわわ　え～んえ～ん！\n@c2@"
"167":
  de: "@aAlfons@bUngeheuer! Da kommen Ungeheuer! Hilfe!\n@c2@"
  en: "@aAngus@bMonsters! Monsters are comin'! Help!\n@c2@"
  es: "@aAngustio@b¡Monstruos! ¡Vienen los monstruos! ¡Auxilio!\n@c2@"
  fr: "@aAngus@bDes monstresⓠ Des monstres approchentⓠ À l'aideⓠ\n@c2@"
  it: "@aAttilio@bAiuto! I mostri! Stanno arrivando i mostri! Aiutooo!\n@c2@"
  ja: "@a@b＊「魔物　魔物がおそってくるよ。\n\tこわいよお……。\n@c2@"
"168":
  de: "@a@b*: Wisst Ihr, ich wollte damals auch immer zur Palastwache.\n@c2@"
  en: "@a@b*: I wanted tae be a palace guard back in ma day, ye ken.\n@c2@"
  es: "@a@b*: En mis tiempos yo quería ser guardia de palacio, ¿sabe?\n@c2@"
  fr: "@a@b*ⓢ Vous savez, à une époque, je voulais devenir garde royal.\n@c2@"
  it: "@a@b*: Lo sai? Da giovane volevo essere una guardia di palazzo.\n@c2@"
  ja: "@a@b＊「わしも　若かったころは\n\t王宮の戦士に　あこがれたものじゃ。\n@c2@"
"169":
  de: "@a@b*: Ihr helft Burland und ich helfe Euch. Na, was sagt Ihr? Kann ich mit Euch mitkommen?\n@c2@"
  en: "@a@b*: If ye're helpin' Burland, then I want tae help ye. What dae ye say? Can I tag along wi' ye?\n@c2@"
  es: "@a@b*: Si está ayudando a Burlandia, quisiera acompañarle. ¿Qué contesta? ¿Puedo ir con usted?\n@c2@"
  fr: "@a@b*ⓢ Si vous aidez Bastione, je veux vous aider aussi. Qu'en dites-vousⓡ Je peux vous accompagnerⓡ\n@c2@"
  it: "@a@b*: Se sei in missione per il bene del regno di Burlandia, voglio essere al tuo fianco! Che ne dici? Posso unirmi a te?\n@c2@"
  ja: "@a@b＊「この　じいも　バトランドを守る\n\t戦士さまの　手伝いがしたいんじゃ。\n\tどうじゃろう？　つれていってはくれぬか？\n@c2@"
"170":
  de: "@a@b*: Pfundig! Ich darf? Dann nix wie los!\n@c2@"
  en: "@a@b*: Hoots! I can!? Then let's away!\n@c2@"
  es: "@a@b*: ¡Repámpanos! ¡¿Puedo?! ¡Entonces, en marcha!\n@c2@"
  fr: "@a@b*ⓢ C'est vrai, je peuxⓠⓑ Allons-y, alorsⓠ\n@c2@"
  it: "@a@b*: Perbacco! Posso? Partiamo subito!\n@c2@"
  ja: "@a@b＊「おお　まことか！？\n\tでは　ついてゆくとしよう！\n@c2@"
"171":
  de: "@a@b*: Allerdings ist Kämpfen nicht gerade meine starke Seite, also verlasst Euch da nicht allzu sehr auf mich.\n@c2@"
  en: "@a@b*: Och, but I amn't much of a fighter, so dinnae count on me too much there.\n@c2@"
  es: "@a@b*: Solo que, por desgracia, no soy un gran guerrero, así que no va a poder contar conmigo en ese sentido.\n@c2@"
  fr: "@a@b*ⓢ Mais je ne suis pas un grand combattant, alors ne comptez pas trop sur moi pour ça.\n@c2@"
  it: "@a@b*: Comunque, sappi che io non sono un grande guerriero... Quindi non fare troppo affidamento sulle mie capacità in battaglia, intesi?\n@c2@"
  ja: "@a@b＊「ちなみに　わしは戦闘は苦手じゃ。\n\tまったく　戦力にならんから\n\tそのつもりでな。\n@c2@"
"172":
  de: "@a@b*: Höhh... Höhh... Ich bin ganz außer Puste. Ich bin ja doch nicht mehr der Jüngste. Geht lieber ohne mich weiter.\n@c2@"
  en: "@a@b*: Haah... Haah... I cannae get ma breath. Maybe I'm too old for this. Ye should gae on without me.\n@c2@"
  es: "@a@b*: Ufff... Ufff... Me cuesta respirar. Quizá estoy demasiado viejo para esto. Será mejor que siga adelante sin mí.\n@c2@"
  fr: "@a@b*ⓢ Han... Han... Je suis tout essoufflé. Je suis peut-être trop vieux pour ça. Continuez donc sans moi.\n@c2@"
  it: "@a@b*: Anf... Anf... Mi manca il respiro... Sono troppo vecchio per questo genere di cose. Forse dovresti continuare senza di me... \n@c2@"
  ja: "@a@b＊「はあはあ……息が切れる……。\n\tやっぱり　年寄りには　つらいのう。\n\t気にせず　行ってくだされ。\n@c2@"
"173":
  de: "@a@b*: Wie dumm von mir zu glauben, ich könnt mit einem Soldaten mithalten. Tut mir leid, dass ich Euch aufgehalten hab.\n@c2@"
  en: "@a@b*: What a galoot I am thinkin' I can keep up wi' a soldier. Sorry tae take up yer time like that.\n@c2@"
  es: "@a@b*: Qué necio he sido pensando que puedo seguir el ritmo de un soldado. Lamento haberle hecho perder el tiempo.\n@c2@"
  fr: "@a@b*ⓢ Quel idiot je suis de me croire capable de suivre un soldat. Désolé de vous avoir fait perdre votre temps.\n@c2@"
  it: "@a@b*: Ma come ho potuto pensare che sarei riuscito a tenere il passo di un soldato ben addestrato?! Scusami... Mi spiace farti perdere tanto tempo.\n@c2@"
  ja: "@a@b＊「やっぱりのう。\n\tいや　ムリをいって\n\tすまんかったわい。\n@c2@"
"174":
  de: "@a@b*: König Burkhard versucht die Steuern niedrig zu halten, um seine Untertanen nicht allzu sehr zu belasten.\n@c3@"
  en: "@a@b*: King Burnard tries tae keep taxes low so as not tae put too much of a burden on his people.\n@c3@"
  es: "@a@b*: El rey Recaredo intenta mantener bajos los impuestos para que su pueblo note la carga lo menos posible.\n@c3@"
  fr: "@a@b*ⓢ Le roi Bastien essaie de garder les taxes au plus bas afin de ne pas faire peser un trop lourd fardeau sur son peuple.\n@c3@"
  it: "@a@b*: Re Basilio ha deciso di non imporre troppe tasse ai suoi sudditi, così da non pesare molto sulle loro spalle.\n@c3@"
  ja: "@a@b＊「バトランド王は　人がらもよく\n\t国民に　負担をかけまいと\n\t税金を安くなさっている。\n@c3@"
"175":
  de: "@a@b*: Das ist ja alles gut und schön, aber dafür fehlt nun das Geld für anständige Waffen und Rüstungen.\n@c3@"
  en: "@a@b*: That's all well an' good, but it means there's no enough money for decent weapons an' armour.\n@c3@"
  es: "@a@b*: Y eso está muy bien, pero significa que no hay dinero para armas y armaduras decentes.\n@c3@"
  fr: "@a@b*ⓢ C'est très bien, mais ça veut aussi dire qu'il n'y a pas assez d'argent pour payer des armes et des armures correctes.\n@c3@"
  it: "@a@b*: Per i cittadini è una gran bella cosa, ma questo vuol dire che noi non possiamo disporre di armi e armature decenti!\n@c3@"
  ja: "@a@b＊「しかし　そのぶん\n\t兵士たちの武器や防具に\n\tお金を　かけられないようだ。\n@c3@"
"176":
  de: "@a@b*: Wenn du bessere Ausrüstung brauchst, musst du sie dir selbst zusammensparen.\n@c3@"
  en: "@a@b*: If ye want stronger equipment, ye hae tae save yer cash an' buy it for yerself.\n@c3@"
  es: "@a@b*: Si quiere conseguir un equipo más sólido tendrá que ahorrar y comprarlo usted mismo.\n@c3@"
  fr: "@a@b*ⓢ Si on veut un équipement plus solide, il faut économiser et se l'acheter soi-même.\n@c3@"
  it: "@a@b*: Se desideri avere equipaggiamento migliore, dovrai comprartelo da te!\n@c3@"
  ja: "@a@b＊「もっと　強力な武器や　防具が\n\tほしければ　自分で　お金をためて\n\t買いかえるといい。　そして……。\n@c3@"
"177":
  de: "@a@b*: Und wenn du was Neues kaufst, achte darauf, dich auch damit auszurüsten, statt es nur mit dir herumzutragen!\n@c3@"
  en: "@a@b*: An' if ye dae buy somethin' new, be sure tae equip it rather than just carryin' it aboot wi' ye!\n@c3@"
  es: "@a@b*: ¡Y si compra algo, equípelo, no se limite a pasearlo por ahí!\n@c3@"
  fr: "@a@b*ⓢ Si jamais vous achetez quelque chose de neuf, pensez à vous en équiper, au lieu de simplement le transporter avec vousⓠ\n@c3@"
  it: "@a@b*: Quando acquisti dei nuovi oggetti, ricorda di aggiungerli all'equipaggiamento, e non limitarti a portarli con te.\n@c3@"
  ja: "@a@b＊「あたらしく　武器や防具を\n\t買ったあとは　装備しなおすことを\n\t忘れるなよっ！\n@c3@"
"178":
  de: "@a@b*: Das ist die schöne Stadt Burland.\n@c2@"
  en: "@a@b*: This is bonnie Burland toon.\n@c2@"
  es: "@a@b*: Esta es la orgullosa ciudad de Burlandia.\n@c2@"
  fr: "@a@b*ⓢ Vous vous trouvez dans la belle ville de Bastione.\n@c2@"
  it: "@a@b*: Questa incantevole città è Burlandia.\n@c2@"
  ja: "@a@b＊「ここは　バトランドの城下町です。\n@c2@"
"179":
  de: "@aAgnes@bOh nein! Alfons sitzt in Auenfelde wegen Diebstahls hinter Gittern?\n@c1@"
  en: "@aAigneas@bOh no! Angus has been locked up in Strathbaile jail for stealin', ye say?\n@c1@"
  es: "@aAdalberta@b¡Oh, no! ¿Dice que han encerrado a Angustio en la cárcel de Candonga por ladrón?\n@c1@"
  fr: "@aAgnès@bOh nonⓠ Vous dites qu'Angus a été emprisonné à Strattbourg pour volⓡ\n@c1@"
  it: "@aAgnese@bCome %H860%Xdici%Ydite%Z? Attilio è stato accusato di furto, ed è rinchiuso nella prigione di Bellavalle? Oh, no!\n@c1@"
  ja: "@a@bフレア「えっ？　夫のアレクスが\n\t盗みをはたらいて\n\tイムルの村の牢屋に……。\n@c1@"
"180":
  de: "@aAgnes@bDas ist ja furchtbar. Ich kann nicht glauben, dass er so was tun würde.\n@c1@"
  en: "@aAigneas@bThat's just terrible. I cannae believe he'd do a thing like that.\n@c1@"
  es: "@aAdalberta@bEso es terrible. No puedo creer que sea capaz de algo así.\n@c1@"
  fr: "@aAgnès@bC'est horrible. Je n'arrive pas à croire qu'il ait pu faire une telle chose.\n@c1@"
  it: "@aAgnese@bMa è terribile! Non crederò mai che abbia fatto una cosa del genere!\n@c1@"
  ja: "@a@bフレア「ああ　なんてことでしょう。\n\t信じられないわ　アレクスが\n\t盗みをはたらくなんて。\n@c1@"
"181":
  de: "@aAgnes@bKönnt Ihr mich zu ihm bringen? Ich brauche wirklich Eure Hilfe.\n@c1@"
  en: "@aAigneas@bCan ye take me tae him? I really need yer help here.\n@c1@"
  es: "@aAdalberta@b¿Puede llevarme a verlo? Necesito su ayuda, por favor.\n@c1@"
  fr: "@aAgnès@bPouvez-vous m'emmener auprès de luiⓡ J'ai vraiment besoin de votre aide.\n@c1@"
  it: "@aAgnese@b%H860%XPotresti%YPotreste%Z condurmi da lui? Ho bisogno del %H860%Xtuo%Yvostro%Z aiuto!\n@c1@"
  ja: "@a@bフレア「どうか　戦士さま！\n\tこのわたしを　夫のもとまで\n\t連れて行ってくださいませ！\n@c1@"
"182":
  de: "@a@bAgnes schließt sich Ragnar an.\n@c1@"
  en: "@a@bAigneas joins Ragnar!\n@c1@"
  es: "@a@bAdalberta se une a Ragnar.\n@c1@"
  fr: "@a@bAgnès rejoint Ragnarⓠ\n@c1@"
  it: "@a@bAgnese si unisce a Galiardo!\n@c1@"
  ja: "@a@bフレアが　仲間にくわわった！\n@c1@"
"183":
  de: "@a@b*: Agnes' Mann Alfons wollte schon immer Abenteuer erleben.\n@c2@"
  en: "@a@b*: Aigneas's husband, Angus, is a right one for adventure.\n@c2@"
  es: "@a@b*: El marido de Adalberta, Angustio, es amante de la aventura.\n@c2@"
  fr: "@a@b*ⓢ Angus, le mari d'Agnès, est un véritable aventurier.\n@c2@"
  it: "@a@b*: Attilio, il marito di Agnese, è un amante dell'avventura.\n@c2@"
  ja: "@a@b＊「フレアの夫　アレクスは\n\t大の冒険好きでのう。\n@c2@"
"184":
  de: "@a@b*: Er ist aufgebrochen, um herauszufinden, wie man in den Turm im Wasser hineinkommt.\n@c2@"
  en: "@a@b*: He went off searchin' for a clue of hoo tae get at that tall building in the middle of all that water.\n@c2@"
  es: "@a@b*: Partió en busca de pistas para poder llegar a esa torre en mitad del agua.\n@c2@"
  fr: "@a@b*ⓢ Il est parti pour tenter de découvrir comment pénétrer dans la tour qui se trouve au milieu de toute cette eau.\n@c2@"
  it: "@a@b*: A quanto pare stavolta si è messo in testa di salire su quella torre circondata dalle acque...\n@c2@"
  ja: "@a@b＊「湖に囲まれた　塔に\n\t行くための手がかりを\n\t探しにいったそうじゃよ。\n@c2@"
"185":
  de: "@a@b*: Wenn Ihr nach Auenfelde wollt, müsst Ihr nach Westen zur Auenfelde-Passage und auf der anderen Seite dann weiter nach Nordosten.\n@c1@"
  en: "@a@b*: If ye're headed for Strathbaile, ye need tae gae west tae Strathbaile Burrow, an' then north-east when ye get tae the other side.\n@c1@"
  es: "@a@b*: Si se dirige a Candonga, deberá cruzar por la Madriguera de Candonga y, cuando llegue al otro lado, ir hacia el nordeste.\n@c1@"
  fr: "@a@b*ⓢ Pour rejoindre Strattbourg, vous devez d'abord aller vers l'ouest jusqu'à la Caverne de Strattbourg. Une fois de l'autre côté, partez vers le nord-est.\n@c1@"
  it: "@a@b*: Per andare a Bellavalle, %H860%Xdevi%Ydovete%Z andare a ovest, verso la Galleria di Bellavalle, e poi, una volta dall'altro lato, a nord-est.\n@c1@"
  ja: "@a@b＊「イムルの村でしたら　お城の\n\t西にある　洞くつを抜けて\n\t北東に歩くと　たどりつけますわ。\n@c1@"
"186":
  de: "@a@b*: Ach, die armen Kinderchen. Sicher haben die Leut' in Auenfelde eine Vermutung, was da los sein könnte.\n@c2@"
  en: "@a@b*: Ay, those poor kiddies. Surely the folk in Strathbaile will hae some kind o' clue of whit it's all aboot.\n@c2@"
  es: "@a@b*: ¡Oh!, pobres muchachos. Seguro que las gentes de Candonga tendrán alguna pista de lo que está sucediendo.\n@c2@"
  fr: "@a@b*ⓢ Ah, pauvres petits. Les gens de Strattbourg auront sûrement une idée sur la question.\n@c2@"
  it: "@a@b*: Oh, quei poveri bambini... Chissà se gli abitanti di Bellavalle hanno idea di cosa stia succedendo.\n@c2@"
  ja: "@a@b＊「さらわれた子供ねぇ。\n\tイムルの村へ行けば　何か\n\tわかるんじゃないんですか。\n@c2@"
"187":
  de: "@a@b*: Das scheint schließlich der Dreh- und Angelpunkt zu sein. Ihr solltet versuchen, dort etwas herauszufinden.\n@c2@"
  en: "@a@b*: That's where it all seems tae be happenin', after all. Ye should away there an' see if ye cannae get some clues.\n@c2@"
  es: "@a@b*: Parece que es allí donde está aconteciendo todo. Debería dirigirse hacia allí e intentar obtener información.\n@c2@"
  fr: "@a@b*ⓢ Après tout, c'est là-bas que ça se passe. Vous devriez vous y rendre pour voir si vous pouvez trouver des indices.\n@c2@"
  it: "@a@b*: Del resto, è proprio lì che stanno accadendo questi eventi inspiegabili. %H860%XDovresti%YDovreste%Z andar lì a cercare qualche indizio.\n@c2@"
  ja: "@a@b＊「だって　子供の神隠しって\n\tイムルで　起こってるんでしょ。\n\tなら　まずイムルへ　行くべきっす。\n@c2@"
"188":
  de: "@a@b*: Ragnar! Habt Ihr schon einmal von diesem Kampfarchiv gehört?\n@c2@"
  en: "@a@b*: Ragnar! Hae ye heard o' this thing called battle records?\n@c2@"
  es: "@a@b*: ¡Ragnar! ¿Ha oído hablar de eso que llaman registros de batalla?\n@c2@"
  fr: "@a@b*ⓢ Ragnarⓠ Vous avez entendu parler de ce qu'on appelle les résultats des combatsⓡ\n@c2@"
  it: "@a@b*: Galiardo, hai mai sentito parlare del registro delle battaglie?\n@c2@"
  ja: "@a@b＊「ライアンどの！　知っておるか？\n\t作戦には　戦歴というものが\n\tあってのう……。\n@c2@"
"189":
  de: "@a@b*: Damit könnt Ihr offenbar prüfen, wie Ihr Euch im Kampf macht.\n@c2@"
  en: "@a@b*: Apparently, ye can use it tae check on hoo yer fightin' is gaein'.\n@c2@"
  es: "@a@b*: Al parecer, se pueden usar para comprobar cómo evoluciona en sus combates.\n@c2@"
  fr: "@a@b*ⓢ Apparemment, vous pouvez vous en servir pour savoir où vous en êtes au niveau des combats.\n@c2@"
  it: "@a@b*: Si tratta di uno strumento utilissimo per valutare come ti comporti in combattimento.\n@c2@"
  ja: "@a@b＊「それを見れば　おのずと\n\tおのれの戦いぶりが\n\tわかるそうじゃぞ。\n@c2@"
"190":
  de: "@a@b*: Ah! Ihr seid auf Einkaufstour, was? Macht es Euch was aus, außen herum zu gehen?\n@c2@"
  en: "@a@b*: Ach! Here for a wee bit o' shoppin', are ye? Then maybe ye could away ootside an' 'round tae the counter if it's no too much trouble.\n@c2@"
  es: "@a@b*: ¡Vaya! Veo que ha venido a hacer algunas compras. Entonces no le importará salir de aquí y dirigirse al mostrador, si es tan amable.\n@c2@"
  fr: "@a@b*ⓢ Tiensⓠ Vous venez faire quelques emplettesⓡ Alors il faudrait ressortir et passer de l'autre côté du comptoir, si vous voulez bien.\n@c2@"
  it: "@a@b*: Ehilà! %H860%XSei%YSiete%Z qui per acquisti? Allora %H860%Xesci fuori e vai%Yuscite fuori e andate%Z dall'altro lato del bancone, se non %H860%Xti%Yvi%Z dispiace.\n@c2@"
  ja: "@a@b＊「おや？　お買い物ですか？\n\tだったら　店のそとに出て\n\tカウンターごしに　話しかけて下さい。\n@c2@"
"191":
  de: "@a@b*: Ungeheuer kommen nie bis in die Stadt, also können es nicht sie sein, die die Kinder rauben.\n@c1@"
  en: "@a@b*: Monsters dinnae ever come intae toon, so it cannae be them responsible for snatchin' the bairns away.\n@c1@"
  es: "@a@b*: Los monstruos nunca entran en la ciudad, así que no pueden ser los responsables del rapto de los pequeños.\n@c1@"
  fr: "@a@b*ⓢ Les monstres ne pénètrent jamais en ville, ils ne peuvent donc pas être responsables des enlèvements d'enfants.\n@c1@"
  it: "@a@b*: I mostri non entrano mai in città, quindi non possono essere stati loro a rapire i bambini.\n@c1@"
  ja: "@a@b＊「魔物だって　町の中にまでは\n\t入ってこられないんだから　魔物に\n\t子供は　さらえないはずよ。\n@c1@"
"192":
  de: "@a@b*: Aber wenn nicht die Ungeheuer, wer dann? Ich habe gar kein gutes Gefühl dabei.\n@c1@"
  en: "@a@b*: But if it's no monsters, then I cannae understand whit it could be. All I know is that I dinnae hae a good feelin' aboot it.\n@c1@"
  es: "@a@b*: Pero, si no son los monstruos, no comprendo lo que puede estar sucediendo. Lo único que sé es que tengo un mal pálpito.\n@c1@"
  fr: "@a@b*ⓢ Mais si ce ne sont pas les monstres, je ne vois pas qui ça peut être. En revanche, je peux vous dire que j'ai un mauvais pressentiment.\n@c1@"
  it: "@a@b*: Se però i mostri non sono responsabili dell'accaduto, mi chiedo chi ci sia dietro ai rapimenti. Questa storia mi puzza, e parecchio!\n@c1@"
  ja: "@a@b＊「でも　だったら　どうやって\n\t子供たちが　いなくなるのかしら？\n\t気味が悪いわね……。\n@c1@"
"193":
  de: "@a@b*: Stimmt es, dass Kinder vermisst werden?\n@c1@"
  en: "@a@b*: Is it true that there are kids gaein' missin'?\n@c1@"
  es: "@a@b*: ¿Es cierto que hay niños desaparecidos?\n@c1@"
  fr: "@a@b*ⓢ C'est vrai que des enfants disparaissentⓡ\n@c1@"
  it: "@a@b*: Ma davvero sono spariti dei ragazzini?\n@c1@"
  ja: "@a@b＊「子供が　いなくなるってホント？\n@c1@"
"194":
  de: "@a@b*: Ich brauche mir darüber jedenfalls keine Sorgen mehr zu machen, ich bin ja kein Kind mehr.\n@c1@"
  en: "@a@b*: At least I dinnae hae tae worry aboot it now I amn't a kid any more.\n@c1@"
  es: "@a@b*: Al menos, no tengo de qué preocuparme. Ya hace tiempo que dejé atrás mi infancia.\n@c1@"
  fr: "@a@b*ⓢ Au moins, je n'ai pas à m'inquiéterⓢ moi, je ne suis plus un enfant.\n@c1@"
  it: "@a@b*: Beh, la cosa non mi riguarda. Io non sono più un bambino!\n@c1@"
  ja: "@a@b＊「でも　ぼくは\n\tもう　子供じゃないから\n\t大丈夫だよねっ。\n@c1@"
"195":
  de: "@a@b*: Die Dame des Hauses wartet schon lange darauf, dass ihr Mann zurückkommt. Arme Frau.\n@c2@"
  en: "@a@b*: The lady o' the hoose has been waitin' an awful long time for her hubbie tae come home. Poor woman.\n@c2@"
  es: "@a@b*: La señora de la casa lleva largo tiempo esperando que su esposo regrese. Pobre mujer.\n@c2@"
  fr: "@a@b*ⓢ Cela fait très longtemps que la dame qui habite cette maison attend le retour de son mari.\nPauvre femme.\n@c2@"
  it: "@a@b*: La padrona di casa sta aspettando il ritorno del marito da una vita. Povera donna...\n@c2@"
  ja: "@a@b＊「この家の奥さんは　長い間\n\t帰らぬ夫を　待ってるそうじゃ。\n\tかわいそうにのう……。\n@c2@"
"196":
  de: "@a@b*: Was? Ob ich 'ne Ahnung hab, wer die Kinder klaut?\n@c3@"
  en: "@a@b*: Whit? Dae I hae any clues aboot who's takin' the kiddies away?\n@c3@"
  es: "@a@b*: ¿Cómo? ¿Que si tengo alguna idea de quién se está llevando a los niños?\n@c3@"
  fr: "@a@b*ⓢ Quoiⓡ Si je soupçonne quelqu'un d'enlever les enfantsⓡ\n@c3@"
  it: "@a@b*: Come %H860%Xdici%Ydite%Z? Se ho idea di chi abbia rapito i ragazzi?\n@c3@"
  ja: "@a@b＊「え？\n\t子供がいなくなる　事件について\n\t心当たりは　ないかって！？\n@c3@"
"197":
  de: "@a@b*: Bist du so blöd oder tust du nur so? Die Ungeheuer natürlich, wer denn sonst?\n@c3@"
  en: "@a@b*: So ye're another stupid nyaff, are ye?\nIt's obviously the monsters snatchin' 'em away. Stands tae reason.\n@c3@"
  es: "@a@b*: Es usted otra de esas personas molestas y fastidiosas, ya lo veo. Es obvio que son los monstruos los responsables de los secuestros.\n@c3@"
  fr: "@a@b*ⓢ Encore un imbécile de plusⓠ C'est évident que ce sont les monstres qui les enlèvent. Ça va de soi, voyons.\n@c3@"
  it: "@a@b*: Ma senti che razza di domanda! Mi pare ovvio che i colpevoli siano i mostri, no? Non può essere altrimenti!\n@c3@"
  ja: "@a@b＊「バカだね　あんたも。\n\tそんなの　魔物がさらっていったに\n\t決まってるじゃないか。\n@c3@"
"198":
  de: "@a@b*: Ach, hätte ich nur ein eigenes Haus, mit einem Dach und mit Wänden, die den Regen abhalten.\n@c2@"
  en: "@a@b*: Och, whit I'd gie tae be able tae sleep in a hoose o' ma own, wi' a roof an' walls tae keep oot the rain.\n@c2@"
  es: "@a@b*: Ah, qué no daría yo por poder dormir en mi propia casa, con paredes y techo para protegerme de la intemperie.\n@c2@"
  fr: "@a@b*ⓢ Oh, qu'est-ce que je ne donnerais pas pour pouvoir dormir dans ma propre maison, avec un toit et des murs pour me protéger de la pluieⓠ\n@c2@"
  it: "@a@b*: Oh, quanto vorrei poter dormire in una casa tutta mia, con tanto di tetto e pareti per non bagnarmi quando piove... \n@c2@"
  ja: "@a@b＊「……ううっ。\n\tはやく　雨つゆをしのげる家で\n\t寝られるようになりたいです。\n@c2@"
"199":
  de: "@a@b*: Miau!\n@c1@"
  en: "@a@b*: Meow!\n@c1@"
  es: "@a@b*: ¡Miau!\n@c1@"
  fr: "@a@b*ⓢ Miaouⓠ\n@c1@"
  it: "@a@b*: Miao!\n@c1@"
  ja: "@a@b＊「キシャー！\n@c1@"
"200":
  de: "@a@b*: Ha-püh...\n@c2@"
  en: "@a@b*: Ah-phew...\n@c2@"
  es: "@a@b*: Ah-fiuuu...\n@c2@"
  fr: "@a@b*ⓢ Ron-pfff...\n@c2@"
  it: "@a@b*: Ronf!\n@c2@"
  ja: "@a@b＊「ぐうぐう……。\n@c2@"
"201":
  de: "@a@b*: Ich weiß nicht ⓚⓛ die Ungeheuer scheinen mir in letzter Zeit stärker zu werden.\n@c3@"
  en: "@a@b*: I cannae help feelin' that the monsters hae been gettin' a wee bit stronger of late.\n@c3@"
  es: "@a@b*: Me da la sensación de que últimamente los monstruos están más robustos que de costumbre.\n@c3@"
  fr: "@a@b*ⓢ J'ai vraiment l'impression que les monstres sont devenus plus forts, récemment.\n@c3@"
  it: "@a@b*: Ho la netta sensazione che i mostri siano diventati più aggressivi negli ultimi tempi.\n@c3@"
  ja: "@a@b＊「近ごろ　魔物どもが\n\tチカラをつけてきたような\n\t気がするのだ。\n@c3@"
"202":
  de: "@a@b*: Die Ungeheuer werden also stärker? Das ist immer ein sicherer Beweis dafür, dass Unheil droht.\n@c2@"
  en: "@a@b*: So the monsters are gettin' stronger, are they? That's always sure proof that bad things are gaein' on.\n@c2@"
  es: "@a@b*: Así que los monstruos se están fortaleciendo, ¿no es verdad? Eso es la prueba fehaciente de que algo malo está sucediendo.\n@c2@"
  fr: "@a@b*ⓢ Alors comme ça, les monstres deviennent plus fortsⓡ C'est toujours le signe qu'il se passe de mauvaises choses.\n@c2@"
  it: "@a@b*: I mostri sono diventati più pericolosi, non è così? Secondo me, questo vuol dire che sta succedendo qualcosa di strano!\n@c2@"
  ja: "@a@b＊「ふーむ。　魔物がチカラを　か。\n\tどこかで　よからぬ事が\n\tおこってる証かのう……。\n@c2@"
"203":
  de: "@a@b*: Tut mir leid, heute ist schon geschlossen. Ihr müsst morgen wiederkommen.\n@c2@"
  en: "@a@b*: I'm afraid I've already shut up shop for today. If ye're after somethin', ye'll hae tae come back the morn.\n@c2@"
  es: "@a@b*: Me temo que ya hemos cerrado por hoy. Si desea alguno de nuestros artículos deberá regresar mañana.\n@c2@"
  fr: "@a@b*ⓢ Je regrette, mais j'ai déjà fermé le magasin. Si vous désirez quelque chose, il faudra revenir demain.\n@c2@"
  it: "@a@b*: Mi spiace, ma per oggi il negozio è chiuso. Se %H860%Xti%Yvi%Z serve qualcosa, %H860%Xdovrai%Ydovrete%Z tornare domattina.\n@c2@"
  ja: "@a@b＊「今日は　もう　店を閉めました。\n\tなにか欲しいのなら\n\tまた明日　来てください。\n@c2@"
"204":
  de: "@a@b*: Zzzzz...\n@c1@"
  en: "@a@b*: Zzzzz...\n@c1@"
  es: "@a@b*: Zzzzz...\n@c1@"
  fr: "@a@b*ⓢ Zzzzz...\n@c1@"
  it: "@a@b*: Zzz... \n@c1@"
  ja: "@a@b＊「すやすや……。\n@c1@"
"205":
  de: "@a@b*: Huuuh! Ich muss mal. Aber ich hab Angst, allein rauszugehen.\n@c1@"
  en: "@a@b*: Och! I need a wee wee wee. But I'm too scared tae gae oot on ma own.\n@c1@"
  es: "@a@b*: ¡Agh! Necesito hacer mis necesidades. Pero me da miedo ir solo.\n@c1@"
  fr: "@a@b*ⓢ Oh là làⓠ Il faut que j'aille faire pipi. Mais j'ai trop peur de sortir tout seul.\n@c1@"
  it: "@a@b*: Mi scappa la pipì! Ma ho paura di andare fuori da solo... \n@c1@"
  ja: "@a@b＊「え～ん。\n\tおしっこが　したいよう……。\n\tでも　ひとりで行くのは　恐いよう。\n@c1@"
"206":
  de: "@a@b*: Ach, wie lange will sie denn noch warten?\nIch versteh wirklich nicht, wieso sie den alten Deppen nicht einfach fallen lässt. \n@c2@"
  en: "@a@b*: Ach, hoo much longer is she gaein' tae wait?\nI cannae understand why she won't just give up on the auld bampot.\n@c2@"
  es: "@a@b*: Cielos, ¿cuánto tiempo más va a esperar?\nNo comprendo por qué no se olvida de ese personajillo y se casa conmigo de una vez.\n@c2@"
  fr: "@a@b*ⓢ Pfff, combien de temps va-t-elle encore attendreⓡ Je ne comprends pas pourquoi elle ne laisse pas tomber ce vieux fou.\n@c2@"
  it: "@a@b*: Ma quanta pazienza ha quella donna? Non capisco perché non smetta di aspettare il ritorno del marito!\n@c2@"
  ja: "@a@b＊「いったい　どれだけ　\n\t待つ気なんだろう？\n\tいいかげん　あきらめればいいのに。\n@c2@"
"207":
  de: "@a@b*: Wir werden uns schon um die Burg kümmern, Ragnar. Versuch du nur herauszufinden, was mit den Kindern ist.\n@c2@"
  en: "@a@b*: Ye just leave the castle tae us, Ragnar.\nWe'll take care o' things here while ye away tae find oot where those kiddies hae got tae.\n@c2@"
  es: "@a@b*: Deje el castillo en nuestras manos, Ragnar.\nNos encargaremos de todo mientras usted averigua dónde se han metido esos chiquillos.\n@c2@"
  fr: "@a@b*ⓢ Ne vous occupez pas du château, Ragnar. Nous nous chargerons de tout pendant que vous essaierez de savoir où sont passés ces enfants.\n@c2@"
  it: "@a@b*: Galiardo, al castello pensiamo noi. Ci prenderemo cura delle cose qui, mentre tu investigherai sulla scomparsa di quei bambini.\n@c2@"
  ja: "@a@b＊「城の守りは　我らにまかせて\n\tライアンさんは　子供の探索に\n\t全力をつくしてくださいっ！\n@c2@"
"208":
  de: "@a@b*: Ach, du bist es, Ragnar. Geh ruhig rein.\n@c2@"
  en: "@a@b*: Och, it's you, Ragnar. Gae on by.\n@c2@"
  es: "@a@b*: ¡Ah!, es usted, Ragnar. Adelante, pase.\n@c2@"
  fr: "@a@b*ⓢ Oh, c'est vous, Ragnar. Allez-y, passez.\n@c2@"
  it: "@a@b*: Ah, sei tu, Galiardo. Passa pure.\n@c2@"
  ja: "@a@b＊「誰かと思えば　ライアンどのか。\n\tどうぞ　お通りください。\n@c2@"
"209":
  de: "@a@b*: Klar kannst du in die Burg, aber König Burkhard wirst du wohl kaum sprechen können. Der empfängt abends niemanden mehr.\n@c2@"
  en: "@a@b*: Ye can gae inside the castle by all means, but ye cannae see King Burnard. No one sees His Majesty of a night, I'm afraid.\n@c2@"
  es: "@a@b*: Claro que puede entrar en el castillo, pero no puede ver al rey Recaredo. Nadie puede visitar a Su Majestad de noche, lo lamento.\n@c2@"
  fr: "@a@b*ⓢ Vous pouvez entrer dans le château, mais vous ne pouvez pas voir le roi Bastien. Personne ne rencontre Sa Majesté de nuit, je regrette.\n@c2@"
  it: "@a@b*: %H860%XPuoi%YPotete%Z entrare nel castello, ma temo che non sia possibile incontrare Re Basilio a quest'ora. Di notte, Sua Maestà non riceve nessuno.\n@c2@"
  ja: "@a@b＊「城には入れますが\n\t王には　会えませんよ。\n\t夜の決まりっす。\n@c2@"
"210":
  de: "@a@b*: Du musst König Burkhard Bericht erstatten? Tja, wenn's nicht eilig ist, komm lieber morgen wieder.\n@c2@"
  en: "@a@b*: Ye need tae report tae King Burnard?\nWell, if there's no hurry, it'd be better if ye come back the morra.\n@c2@"
  es: "@a@b*: ¿Que debe presentarse ante el rey Recaredo?\nBueno, si no es muy urgente, será mejor que vuelva por la mañana.\n@c2@"
  fr: "@a@b*ⓢ Vous devez faire un rapport au roi Bastienⓡ Eh bien, s'il n'y a pas d'urgence, il vaudrait mieux que vous reveniez demain matin.\n@c2@"
  it: "@a@b*: %H860%XDevi%YDovete%Z fare rapporto a Re Basilio? Se non si tratta di una cosa di estrema urgenza, penso sia meglio che %H860%Xtu torni%Yvoi torniate%Z domattina.\n@c2@"
  ja: "@a@b＊「王に　ご報告ですかな？\n\tだが　急ぎの報告でなければ\n\t明日にしていただきたい。\n@c2@"
"211":
  de: "@a@b*: Nach der heutigen Aufregung sei ihm zumindest eine gute Nachtruhe gegönnt.\n@c2@"
  en: "@a@b*: After the stramash of a day he's had, the least we can dae is let him get a good night's sleep.\n@c2@"
  es: "@a@b*: Después del día tan agitado que ha tenido, lo menos que podemos hacer es procurarle una noche de sueño reparador.\n@c2@"
  fr: "@a@b*ⓢ Après la journée éprouvante qu'il a eue, le moins que l'on puisse faire, c'est de le laisser profiter d'une bonne nuit de sommeil.\n@c2@"
  it: "@a@b*: Oggi ha avuto una giornata pesantissima. Sarà meglio lasciarlo riposare.\n@c2@"
  ja: "@a@b＊「昼間は多忙ゆえ　夜ぐらいは\n\t王には　しっかり身体を\n\t休めていただきたいのだ。\n@c2@"
"212":
  de: "@aAgnes@bAlfons! Hier bist du also!\n@c1@"
  en: "@aAigneas@bAngus! So ye are here!\n@c1@"
  es: "@aAdalberta@b¡Angustio! ¡De manera que aquí estás!\n@c1@"
  fr: "@aAgnès@bAngusⓠ Te voilàⓠ\n@c1@"
  it: "@aAgnese@bAttilio! Finalmente ti rivedo!\n@c1@"
  ja: "@a@bフレア「あなた！　あなたなのね！？\n@c1@"
"213":
  de: "@aAlfons@b... Wer seid Ihr?\n@c1@"
  en: "@aAngus@b...Who are ye?\n@c1@"
  es: "@aAngustio@b¿Quién es usted?\n@c1@"
  fr: "@aAngus@b... Qui êtes-vousⓡ\n@c1@"
  it: "@aAttilio@bE tu... chi saresti?!\n@c1@"
  ja: "@a@bアレクス「…おばちゃん　だれ？\n@c1@"
"214":
  de: "@aAgnes@bWas meinst du damit?! Weißt du denn nicht, wer ich bin, Schatz? Ich bin's doch, deine Frau ⓚⓛ Agnes!\n@c1@"
  en: "@aAigneas@bWhit d'ye mean!? D'ye no ken who I am, Angie?\nI'm yer wife, Aigneas!\n@c1@"
  es: "@aAdalberta@b¡¿Qué es lo que dices?! ¿Que no sabes quién soy, Angus?\n¡Soy tu esposa, Adalberta!\n@c1@"
  fr: "@aAgnès@bComment çaⓠⓑ Tu ne sais pas qui je suis, mon amourⓡ\nJe suis Agnès, ta femmeⓠ\n@c1@"
  it: "@aAgnese@bCome dici? Ma non mi riconosci?! Attilio, amore mio... Sono Agnese, tua moglie!\n@c1@"
  ja: "@a@bフレア「わたしが　わからないの？\n\tあなたの妻　フレアよ！\n@c1@"
"215":
  de: "@aAlfons@b...\n@c1@"
  en: "@aAngus@b...\n@c1@"
  es: "@aAngustio@b...\n@c1@"
  fr: "@aAngus@b............\n@c1@"
  it: "@aAttilio@b... \n@c1@"
  ja: "@a@bアレクス「…………！\n@c1@"
"216":
  de: "@aAgnes@bVielleicht hilft dir dein eigener Ehering ja, dich wieder zu erinnern, hm? Weißt du noch, was das gute Stück dich gekostet hat?\n@c1@"
  en: "@aAigneas@bMaybe yer own weddin' ring'll jog yer memory, eh? Remember how much this little beauty cost ye?\n@c1@"
  es: "@aAdalberta@bQuizá nuestra alianza te refresque la memoria, ¿acaso has olvidado cuán cara te costó?\n@c1@"
  fr: "@aAgnès@bPeut-être que cette alliance te rafraîchira la mémoire... Tu te souviens du prix qu'elle t'a coûtéⓡ\n@c1@"
  it: "@aAgnese@bQuesta è la fede che mi hai messo al dito il giorno del nostro matrimonio! Forse ti aiuterà a ricordare...\n@c1@"
  ja: "@a@bフレア「ほうら　これでも思い出さない？\n\tぱふぱふ　ぱふぱふ……。\n@c1@"
"217":
  de: "@aAlfons@b... Aah!\n@c1@"
  en: "@aAngus@b...Ach!\n@c1@"
  es: "@aAngustio@b... ¡Ah!\n@c1@"
  fr: "@aAngus@b............ Ohⓠ\n@c1@"
  it: "@aAttilio@bOooh!\n@c1@"
  ja: "@a@bアレクス「…………おおう。\n@c1@"
"218":
  de: "@aAlfons@bDu bist es, Agnes!\n@c1@"
  en: "@aAngus@bIt's ye, Aigneas!\n@c1@"
  es: "@aAngustio@b¡Eres tú, Adalberta!\n@c1@"
  fr: "@aAngus@bAgnès, c'est toiⓠ\n@c1@"
  it: "@aAttilio@bAgnese! Ma sei tu!\n@c1@"
  ja: "@a@bアレクス「……フレア！\n@c1@"
"219":
  de: "@aAgnes@bGenau! Ich bin's!\n@c1@"
  en: "@aAigneas@bThat's right, it's me!\n@c1@"
  es: "@aAdalberta@b¡Así es, soy yo!\n@c1@"
  fr: "@aAgnès@bBien sûr que c'est moiⓠ\n@c1@"
  it: "@aAgnese@bSì, sono io!\n@c1@"
  ja: "@a@bフレア「そうよ！　わたしよ！\n@c1@"
"220":
  de: "@aAlfons@bIch weiß nicht, was mich überkommen hat. Ich wurde von Monstern angegriffen und hatte solche Angst, dass ich wieder zum Kind geworden bin.\n@c1@"
  en: "@aAngus@bI dinnae ken whit came over me. I was attacked by monsters an' I was so scared that I went back tae bein' a bairn.\n@c1@"
  es: "@aAngustio@bNo sé lo que me sucedió. Los monstruos me atacaron y me asusté tanto que sufrí una regresión a la infancia.\n@c1@"
  fr: "@aAngus@bJe ne sais pas ce qui m'est arrivé. J'ai été attaqué par des monstres et j'ai eu tellement peur que je suis retombé en enfance.\n@c1@"
  it: "@aAttilio@bNon so bene cosa mi sia successo... Ricordo solo di essere stato attaccato dai mostri, e di essere tornato a quando ero un bambino.\n@c1@"
  ja: "@a@bアレクス「まったく　オレとしたことが。\n\t魔物どもにおそわれ　死にかけた\n\t恐怖で　子供がえりしていたらしい。\n@c1@"
"221":
  de: "@aAlfons@bIch danke Euch sehr für Eure Hilfe, Soldat!\n@c1@"
  en: "@aAngus@bThanks for all yer help, soldier!\n@c1@"
  es: "@aAngustio@b¡Gracias por su ayuda, soldado!\n@c1@"
  fr: "@aAngus@bMerci de votre aide, soldatⓠ\n@c1@"
  it: "@aAttilio@bSoldato, ti ringrazio per avermi aiutato.\n@c1@"
  ja: "@a@bアレクス「そこの戦士どの。\n\tどうも　ありがとうございました。\n@c1@"
"222":
  de: "@aAlfons@bWenn ich so darüber nachdenke, haben mir die Jungs und Mädels etwas Merkwürdiges erzählt.\n@c1@"
  en: "@aAngus@bCome tae think of it, I heard somethin' curious from those wee lads an' lassies.\n@c1@"
  es: "@aAngustio@bAhora que lo pienso esos muchachitos y muchachitas me dijeron algo interesante.\n@c1@"
  fr: "@aAngus@bQuand j'y repense, j'ai entendu les enfants parler de quelque chose d'étrange.\n@c1@"
  it: "@aAttilio@bUhm... Ora che ci penso, quei ragazzi mi hanno detto una cosa che potrebbe interessarti.\n@c1@"
  ja: "@a@bアレクス「あっ　そうそう。\n\tこれは　子供たちから\n\t聞いたのですが……。\n@c1@"
"223":
  de: "@aAlfons@bSie sprachen von einem Kinderspielplatz im Wald, südöstlich von der Stadt.\n@c1@"
  en: "@aAngus@bThere was talk aboot a kiddies' playground in the forest tae the south-east o' toon.\n@c1@"
  es: "@aAngustio@bHablaban de un lugar en el que los niños juegan en el bosque, al sudeste de la ciudad.\n@c1@"
  fr: "@aAngus@bIl était question d'un terrain de jeu dans la forêt, au sud-est de la ville.\n@c1@"
  it: "@aAttilio@bHanno parlato di un luogo segreto dove vanno a giocare. Si trova nella foresta, a sud-est del villaggio.\n@c1@"
  ja: "@a@bアレクス「村の　南東の森の中に\n\t子供たちの遊び場があるとか。\n@c1@"
"224":
  de: "@aAlfons@bVielleicht findet Ihr einen Hinweis, wenn Ihr Euch dort ein wenig umseht. Einen Versuch ist es wert.\n@c1@"
  en: "@aAngus@bYe may well find a clue if ye gae an' hae a look aroond there. I'd be away if I were ye.\n@c1@"
  es: "@aAngustio@bA lo mejor encuentra alguna pista si pasa por allí a echar un vistazo. En su lugar, yo iría.\n@c1@"
  fr: "@aAngus@bIl y a peut-être des indices sur place. J'irais y faire un tour, si j'étais vous.\n@c1@"
  it: "@aAttilio@bForse lì potresti trovare qualche indizio utile... Se fossi in te, andrei a dare un'occhiata.\n@c1@"
  ja: "@a@bアレクス「何か　あるかもしれません。\n\tぜひ　行ってみては　どうだろう。\n@c1@"
"225":
  de: "@aAgnes@bPasst auf Euch auf da draußen, Soldat, ja?\n@c1@"
  en: "@aAigneas@bBe cannie oot there, soldier!\n@c1@"
  es: "@aAdalberta@b¡Tenga cuidado ahí afuera, soldado!\n@c1@"
  fr: "@aAgnès@bSoyez prudent là-bas, soldatⓠ\n@c1@"
  it: "@aAgnese@bMi raccomando, soldato! Fai attenzione là fuori!\n@c1@"
  ja: "@a@bフレア「お気をつけて　戦士さま。\n@c1@"
"226":
  de: "@a@b*: Ah, hallo, Soldat! Willkommen in Auenfelde.\n@c2@"
  en: "@a@b*: Well, hello there, soldier! Welcome tae Strathbaile.\n@c2@"
  es: "@a@b*: ¡Saludos, soldado! Sea bienvenido a Candonga.\n@c2@"
  fr: "@a@b*ⓢ Tiens, bonjour soldatⓠ Bienvenue à Strattbourg.\n@c2@"
  it: "@a@b*: Salve, soldato! Benvenuto a Bellavalle!\n@c2@"
  ja: "@a@b＊「ややっ　戦士さま！\n\tようこそ　イムルの村に。\n@c2@"
"227":
  de: "@a@b*: Ihr müsst uns helfen! Unsere Kinderchen werden vermisst!\n@c2@"
  en: "@a@b*: Ye've got tae help us! Oor wee laddie's gone missin'!\n@c2@"
  es: "@a@b*: ¡Tiene que ayudarnos! ¡Nuestro pequeño ha desaparecido!\n@c2@"
  fr: "@a@b*ⓢ Vous devez nous aiderⓠ Notre petit garçon a disparuⓠ\n@c2@"
  it: "@a@b*: %H860%XDevi%YDovete%Z aiutarci! I nostri figli sono scomparsi nel nulla!\n@c2@"
  ja: "@a@b＊「おお　戦士さま！　うちの息子も\n\tいなくなったんだ！\n@c2@"
"228":
  de: "@a@b*: Wer kann nur dahinterstecken?\nIch verstehe nicht, wie jemand unsere Kinder entführen kann.\n@c2@"
  en: "@a@b*: Who can be doin' this? I cannae understand hoo anyone would want tae take oor kiddies away.\n@c2@"
  es: "@a@b*: ¿Quién puede estar detrás de esto? No entiendo por qué alguien querría llevarse a nuestros niños.\n@c2@"
  fr: "@a@b*ⓢ Qui peut bien faire çaⓡ Je ne comprends pas pourquoi on voudrait nous enlever nos enfants.\n@c2@"
  it: "@a@b*: Chi può aver compiuto un atto tanto crudele?! Bisogna essere proprio senza cuore per fare una cosa del genere a dei bambini...!\n@c2@"
  ja: "@a@b＊「いったい　何者のしわざだ！？\n\t子供をさらって　どんな得が\n\tあるっていうんだよ？\n@c2@"
"229":
  de: "@a@b*: Schön, dass Ihr hier seid, Soldat.\nEs hilft Euch vermutlich nicht weiter, aber...\n@c1@"
  en: "@a@b*: It's good tae see ye here, soldier.\nThis probably willnae help ye at all, but...\n@c1@"
  es: "@a@b*: Nos alegramos de que esté aquí, soldado.\nProbablemente no servirá de nada, pero...\n@c1@"
  fr: "@a@b*ⓢ Contente de vous voir ici, soldat.\nÇa ne vous aidera probablement pas, mais...\n@c1@"
  it: "@a@b*: Sono felice che tu sia qui, soldato. Anche se dubito che tu possa risolvere i nostri problemi... \n@c1@"
  ja: "@a@b＊「よく来て下さいました　戦士さま。\n\tこんなこと　子供を探す　手がかりには\n\tならないでしょうけど……。\n@c1@"
"230":
  de: "@a@b*: Es war, als hätte sich das Kind vor meinen Augen in Luft aufgelöst.\n@c1@"
  en: "@a@b*: Well, it was like the bairn just disappeared right afore ma eyes.\n@c1@"
  es: "@a@b*: Bueno, fue como si el chiquillo se desvaneciese ante mis propios ojos.\n@c1@"
  fr: "@a@b*ⓢ Eh bien, c'est comme si le petit s'était évaporé juste sous mes yeux.\n@c1@"
  it: "@a@b*: In pratica, il bambino è sparito proprio davanti ai miei occhi!\n@c1@"
  ja: "@a@b＊「あの子は　私の目の前で\n\tパッと消えるように\n\tいなくなったんです。\n@c1@"
"231":
  de: "@a@b*: Das hier ist die Schule von Auenfelde. Auch Peterchen, der Bub des Herbergswirtes, hat sie besucht, ehe er verschwand.\n@c2@"
  en: "@a@b*: This is Strathbaile school. The innkeeper's son, wee Willy Wally, was a pupil here afore he disappeared.\n@c2@"
  es: "@a@b*: Esta es la escuela de Candonga. El hijo del posadero, el pequeño Pelayo, era alumno de esta escuela antes de desaparecer.\n@c2@"
  fr: "@a@b*ⓢ Voici l'école de Strattbourg. Le fils de l'aubergiste, le petit Hugues Esclin, était élève ici avant sa disparition.\n@c2@"
  it: "@a@b*: Questa è la scuola di Bellavalle. Il figlio del gestore della locanda, il piccolo Giacomino, studiava qui, prima di scomparire nel nulla...\n@c2@"
  ja: "@a@b＊「ここは　学校です。\n\tいなくなった　宿屋のププルも\n\tここの生徒でした。\n@c2@"
"232":
  de: "@a@b*: Der Mann im Gefängnis sagt, er habe mal in Burland gelebt.\n@c1@"
  en: "@a@b*: The fella doon in the jail says he used tae live in Burland.\n@c1@"
  es: "@a@b*: Ese tipo de la cárcel dice que solía vivir en Burlandia.\n@c1@"
  fr: "@a@b*ⓢ Le type qui est emprisonné dit qu'il vivait à Bastione, autrefois.\n@c1@"
  it: "@a@b*: Il tizio giù in cella dice che viveva a Burlandia.\n@c1@"
  ja: "@a@b＊「地下の牢屋にいる　おじちゃんは\n\tバトランドに住んでたんだって。\n@c1@"
"233":
  de: "@a@b*: Ach, sieh an, Ragnar Rauhbein! Du hast's also endlich nach Auenfelde geschafft, was?\n@c3@"
  en: "@a@b*: Well, if it isn't Ragnar McRyan! So ye finally made it tae Strathbaile, eh?\n@c3@"
  es: "@a@b*: ¡Vaya, que me aspen si no es Ragnar McRyan! Así que finalmente ha logrado llegar a Candonga, ¿eh?\n@c3@"
  fr: "@a@b*ⓢ Tiens, tiens, mais c'est Ragnar McRyanⓠ Alors vous êtes finalement arrivé à Strattbourgⓡ\n@c3@"
  it: "@a@b*: Ma tu guarda! Galiardo de' Guglielmi! Allora, finalmente sei arrivato a Bellavalle, eh?\n@c3@"
  ja: "@a@b＊「やや　ライアンではないか！？\n\tおぬしも　やっと　イムルの村に\n\tやってきたか！\n@c3@"
"234":
  de: "@a@b*: Leider habe ich noch nicht herausgefunden, wo die Kinder stecken.\n@c3@"
  en: "@a@b*: I'm afraid I've no more information on the whereaboots o' those wee kiddies.\n@c3@"
  es: "@a@b*: Me temo que no tengo más información sobre el paradero de esos muchachitos.\n@c3@"
  fr: "@a@b*ⓢ J'ai bien peur de ne pas en savoir plus sur l'endroit où se trouvent ces enfants.\n@c3@"
  it: "@a@b*: Mi spiace, ma non so che altro dirti sulla scomparsa dei bambini.\n@c3@"
  ja: "@a@b＊「子供のゆくえについては\n\tいまだ　何の情報も\n\t得てはいないが……。\n@c3@"
"235":
  de: "@a@b*: Ob wohl der Turm im Westen etwas damit zu tun hat? Ich weiß nur nicht, wie man dort hineinkommt.\n@c3@"
  en: "@a@b*: I'm wonderin' if that tur tae the west has somethin' tae dae wi' it all, but I dinnae hae the first clue hoo tae get inside.\n@c3@"
  es: "@a@b*: Me pregunto si esa torre situada al oeste tendrá algo que ver con todo esto, aunque no tengo ni la menor idea de cómo entrar en ella.\n@c3@"
  fr: "@a@b*ⓢ Je me demande si cette tour, là-bas à l'ouest, n'aurait pas quelque chose à voir là-dedans, mais je ne sais pas comment y entrer.\n@c3@"
  it: "@a@b*: Magari c'è qualche indizio nella torre che si trova a ovest di qui, ma non ho la più pallida idea di come entrarci.\n@c3@"
  ja: "@a@b＊「私は　この地の西にある塔が\n\tあやしいと思うのだが　あそこには\n\tどうやって　入ればいいのだ？\n@c3@"
"236":
  de: "@a@b*: Da ist so ein frecher Knilch, der immer draußen rumschleicht, wenn's dunkel wird.\n@c2@"
  en: "@a@b*: There's a cheeky wee beggar who's always footerin' aroond ootside at night.\n@c2@"
  es: "@a@b*: Hay un mendigo muy fresco que siempre anda deambulando por ahí fuera cuando oscurece.\n@c2@"
  fr: "@a@b*ⓢ Toutes les nuits, il y a un mendiant effronté qui rôde à l'extérieur.\n@c2@"
  it: "@a@b*: C'è un dannato vagabondo che gironzola da queste parti tutte le notti.\n@c2@"
  ja: "@a@b＊「けしからんことに　夜になると\n\t宿屋のフロを　のぞくヤツが\n\t決まってあらわれおる。\n@c2@"
"237":
  de: "@a@b*: Wenn ich ihn noch mal seh, dann frag ich ihn, was er da eigentlich treibt.\n@c2@"
  en: "@a@b*: Next time I see him, I'm gonnae ask just what he thinks he's up tae.\n@c2@"
  es: "@a@b*: La próxima vez que lo vea, le voy a preguntar qué diantre cree que está haciendo.\n@c2@"
  fr: "@a@b*ⓢ La prochaine fois que je le verrai, je lui demanderai ce qu'il mijote.\n@c2@"
  it: "@a@b*: La prossima volta che lo vedo, voglio proprio chiedergli che accidenti viene a fare qui!\n@c2@"
  ja: "@a@b＊「うらやましいこっちゃ。\n\tわしも逃げ足さえ　速ければのう……。\n@c2@"
"238":
  de: "@a@b*: Den Kerl im Kittchen haben sie beim Brotstehlen erwischt.\n㈡\n*: Aber er hat sein Gedächtnis verloren und kann sich an nichts erinnern.\n@c2@"
  en: "@a@b*: The fella doon in the jail was caught stealin' bread, but his memory's gone and he cannae mind a thing aboot it.\n@c2@"
  es: "@a@b*: A ese individuo de la cárcel lo sorprendieron robando pan, pero ha perdido la memoria y no recuerda nada.\n@c2@"
  fr: "@a@b*ⓢ Le type qui est en prison s'est fait prendre en train de voler du pain, mais il a perdu la mémoire et ne se souvient de rien.\n@c2@"
  it: "@a@b*: Giù nella prigione c'è un uomo che è stato condannato per aver rubato del pane. Non ci sta più con la testa... \n@c2@"
  ja: "@a@b＊「この村の　牢屋にいる人は\n\tパンを盗んで　つかまったんだけど\n\t記憶をなくしているようなの。\n@c2@"
"239":
  de: "@a@b*: Er muss was Furchtbares erlebt haben, dass es ihn wieder zu einem Kind gemacht hat.\n@c2@"
  en: "@a@b*: He must hae had somethin' terrifyin' happen tae him tae be reduced back tae bein' a kid like that.\n@c2@"
  es: "@a@b*: Seguro que le ha sucedido alguna cosa espeluznante para reducirlo a ese estado infantil.\n@c2@"
  fr: "@a@b*ⓢ Il a dû lui arriver quelque chose d'horrible pour qu'il retombe en enfance comme ça.\n@c2@"
  it: "@a@b*: Si comporta come se fosse un bambino! Chissà cos'ha passato per ridursi in quello stato, il poveretto...\n@c2@"
  ja: "@a@b＊「いい大人なのに　心だけが子供に\n\t逆戻りするなんて　よっぽど\n\t怖い目に　あったんだろうねえ。\n@c2@"
"240":
  de: "@a@b*: Nä, nä, nä, nä, nä, ne!\nDu kriegst mich nicht, du kriegst mich nicht!\n@c1@"
  en: "@a@b*: Na na na na naaah!\nYe cannae catch me, ye cannae catch me!\n@c1@"
  es: "@a@b*: ¡Chincha rabiña!\n¡A que no me pillas!\n@c1@"
  fr: "@a@b*ⓢ Na na na na nère-euhⓠ\nTu m'attraperas pasⓠ Tu m'attraperas pasⓠ\n@c1@"
  it: "@a@b*: Na na na na naa!\nNon mi prendi!\nNon mi prendi!\n@c1@"
  ja: "@a@b＊「やだよ～だ！\n\t絶対　つかまんないもんね！\n@c1@"
"241":
  de: "@a@b*: Warte! So warte doch! Verflixt! Kann denn keiner das Mädel zur Vernunft bringen?!\n@c1@"
  en: "@a@b*: Wait! Just wait, will ye!? Jings! Can someone no stop that lass from footerin' aboot!?\n@c1@"
  es: "@a@b*: ¡Espere! ¡Espere un momento, haga el favor! ¡Demonios! ¡¿Es que no puede alguien hacer que esta muchacha se esté quieta?!\n@c1@"
  fr: "@a@b*ⓢ Attendsⓠ Arrête-toi, tu veuxⓠⓑ\nPar la Déesse, personne ne peut donc empêcher cette gamine de faire des bêtisesⓠⓑ\n@c1@"
  it: "@a@b*: Ferma! Fermati!\nAccidenti! Chi mi aiuta a prendere quella piccola peste?!\n@c1@"
  ja: "@a@b＊「お待ちなさい　待ちなさいったら！\n\tああ　もうっ！　誰か\n\tその子を　つかまえてくださいな。\n@c1@"
"242":
  de: "@a@b*: Menno! Wie soll man sich denn da konzentrieren können?\n@c1@"
  en: "@a@b*: Wheesht! Hoo am I supposed tae study wi' all these distractions?\n@c1@"
  es: "@a@b*: ¡Recórcholis! ¿Cómo voy a concentrarme para estudiar con tantas distracciones?\n@c1@"
  fr: "@a@b*ⓢ Chutⓠ Comment voulez-vous que j'étudie si je suis toujours dérangéⓡ\n@c1@"
  it: "@a@b*: Accipicchia! Ma come si fa a studiare con tutta questa confusione?!\n@c1@"
  ja: "@a@b＊「もう　うるさいなあ。\n\t勉強のジャマしないでよ。\n@c1@"
"243":
  de: "@a@b*: Ihr seid aus der Burg Burland! Ist das toll.\n@c1@"
  en: "@a@b*: Ye're from the castle in Burland! I think ye're amazin'.\n@c1@"
  es: "@a@b*: ¡¿Es usted del Castillo de Burlandia?! Es fantástico.\n@c1@"
  fr: "@a@b*ⓢ Vous venez du château de Bastioneⓠ Vous savez, je vous trouve incroyable.\n@c1@"
  it: "@a@b*: %H860%XVieni%YVenite%Z dal castello di Burlandia? Che forza!\n@c1@"
  ja: "@a@b＊「おじちゃん　バトランドの\n\tお城から来た　戦士さまだよね。\n\tかっこいいなあ。\n@c1@"
"244":
  de: "@a@b*: Wenn ich groß bin, gehe ich auch zur Palastwache, genau wie Ihr.\n@c1@"
  en: "@a@b*: When I grow up, I'm goin' tae be a palace guard just like ye.\n@c1@"
  es: "@a@b*: Cuando crezca quiero ser guardia de palacio como usted.\n@c1@"
  fr: "@a@b*ⓢ Quand je serai grand, je serai garde royal, comme vous.\n@c1@"
  it: "@a@b*: Da grande voglio fare la guardia di palazzo, proprio come te!\n@c1@"
  ja: "@a@b＊「ぼくも　おおきくなったら\n\tお城の戦士になるんだ。\n@c1@"
"245":
  de: "@a@b*: Verschwundene Kinder? Meint Ihr Peterchen aus der Herberge? Ja, klar kenn ich den.\n@c1@"
  en: "@a@b*: Disappearin' children? D'ye mean Willy Wally from the inn? Ah, I know him, all right.\n@c1@"
  es: "@a@b*: ¿Niños desaparecidos? ¿Se refiere a Pelayo, el de la posada? ¡Ah!, sí, claro que lo conozco.\n@c1@"
  fr: "@a@b*ⓢ Des enfants qui disparaissentⓡ Vous voulez parler d'Hugues Esclin, de l'aubergeⓡ Oui, je le connais bien.\n@c1@"
  it: "@a@b*: Bambini scomparsi?! Ma %H860%Xstai%Ystate%Z parlando di Giacomino, il figlio del gestore della locanda? Oh, io so cosa gli è successo!\n@c1@"
  ja: "@a@b＊「いなくなった　子供？\n\t宿屋のププルだろ？\n\tうん　知ってるよ。\n@c1@"
"246":
  de: "@a@b*: Der ist ein Engel geworden und in den Himmel geflogen! Doch, echt!\n@c1@"
  en: "@a@b*: He became an angel an' flew away in the sky. It's true!\n@c1@"
  es: "@a@b*: Se convirtió en un ángel y salió volando hacia el cielo. ¡Se lo prometo!\n@c1@"
  fr: "@a@b*ⓢ Il s'est transformé en ange et s'est envolé dans le ciel. Pour de vraiⓠ\n@c1@"
  it: "@a@b*: Si è trasformato in un angelo, ed è volato in cielo... Dico davvero!\n@c1@"
  ja: "@a@b＊「ププルは　天使になって\n\tお空に飛んでいったんだ。\n\tホントだよ！\n@c1@"
"247":
  de: "@a@b*: Gut, dass Ihr gekommen seid, Soldat. Aber wir sind mitten im Unterricht.\n@c2@"
  en: "@a@b*: It's good that ye came, soldier. But we're in the middle of a lesson the noo.\n@c2@"
  es: "@a@b*: Me alegro de que haya venido, soldado. Pero estamos en mitad de clase.\n@c2@"
  fr: "@a@b*ⓢ C'est bien d'être venu, soldat. Mais nous sommes au beau milieu d'une leçon, pour l'instant.\n@c2@"
  it: "@a@b*: Mi fa piacere che tu sia qui, soldato, ma siamo nel bel mezzo della lezione.\n@c2@"
  ja: "@a@b＊「これはこれは　戦士どの。\n\tよくぞ　まいられた。\n\tが　いまは授業の最中。\n@c2@"
"248":
  de: "@a@b*: Kommt doch heute Abend wieder, dann können wir reden, so viel Ihr wollt.\n@c2@"
  en: "@a@b*: Come back tonight an' we can gab away as much as ye like then.\n@c2@"
  es: "@a@b*: Si regresa esta noche podemos charlar cuanto quiera.\n@c2@"
  fr: "@a@b*ⓢ Revenez ce soir et nous pourrons parler autant que vous voudrez.\n@c2@"
  it: "@a@b*: Torna stasera, e potremo parlare con calma.\n@c2@"
  ja: "@a@b＊「くわしい話は　また夜にでも……。\n@c2@"
"249":
  de: "@a@b%0%a00120 untersucht die Wand.\n@c0@"
  en: "@a@b%0%a00120 examines the wall.\n@c0@"
  es: "@a@b%0%a00120 examina la pared.\n@c0@"
  fr: "@a@b%0%a00120 examine le mur.\n@c0@"
  it: "@a@b%0%a00120 esamina il muro.\n@c0@"
  ja: "@a@b%a00120は　カベを　調べた！\n@c0@"
"250":
  de: "@a@bDa hängen Bilder, die von den Kindern gemalt wurden.\n@c0@"
  en: "@a@bThere are pictures drawn by the children hanging\non it.\n@c0@"
  es: "@a@bHay dibujos hechos por los niños.\n@c0@"
  fr: "@a@bDes dessins faits par les enfants y sont accrochés.\n@c0@"
  it: "@a@bSulla parete ci sono dei disegni fatti dai bambini.\n@c0@"
  ja: "@a@bカベには子供たちの絵が\nかけられている。\n@c0@"
"251":
  de: "@a@b*: Peterchen soll gerade mit einem Paar merkwürdiger Schuhe gespielt haben, als er verschwand.\n㈡\n*: Wenn Ihr mich fragt, klingt das alles recht seltsam.\n@c2@"
  en: "@a@b*: It sounds like wee Willy Wally was playin' wi' some strange shoes in front o' Loch Tur at the time he disappeared.\n@c2@"
  es: "@a@b*: Parece que el pequeño Pelayo estaba jugando con unos extraños zapatos cuando desapareció. Es muy raro, esa es mi opinión.\n@c2@"
  fr: "@a@b*ⓢ À ce qu'on dit, Hugues Esclin était en train de jouer avec de drôles de chaussures lorsqu'il a disparu. Tout ça est très bizarre, à mon avis.\n@c2@"
  it: "@a@b*: Pare che, prima di scomparire, Giacomino stesse giocando con uno strano paio di calzature davanti alla Torre Laga. Che storia bizzarra, eh?\n@c2@"
  ja: "@a@b＊「うちのヤツが言うには\n\tププルが消えるとき　おかしなクツで\n\t遊んでいたそうなんですが……。\n@c2@"
"252":
  de: "@a@b*: Ich bin eine Wandernonne. Ich ziehe durch die Lande, um das Wort der Göttin zu verbreiten.\n@c1@"
  en: "@a@b*: I'm a travelling nun. I journey around the world to spread word of the Goddess.\n@c1@"
  es: "@a@b*: Soy una monja viajera. Viajo por todo el mundo para predicar la palabra de la Diosa.\n@c1@"
  fr: "@a@b*ⓢ Je suis une religieuse itinérante. Je voyage de par le monde pour répandre la parole de la Déesse.\n@c1@"
  it: "@a@b*: Sono una suora errante. Vado per il mondo a diffondere il verbo della dea.\n@c1@"
  ja: "@a@b＊「わたしは　旅の尼。\n\t神のお告げをうけて\n\t旅をしています。\n@c1@"
"253":
  de: "@a@b*: Ich bin sicher, die verschwundenen Kinder werden ihre Stimme hören und in Sicherheit gebracht werden.\n@c1@"
  en: "@a@b*: I'm sure the children who went missing will hear her voice in the end, and be guided back to safety.\n@c1@"
  es: "@a@b*: Estoy convencida de que los niños perdidos oirán su voz, que les guiará de vuelta a un lugar seguro.\n@c1@"
  fr: "@a@b*ⓢ Je suis sûre que les enfants disparus finiront par entendre sa voix et retrouveront leur chemin sains et saufs.\n@c1@"
  it: "@a@b*: Sono certa che i bambini scomparsi sentiranno presto la sua voce, e che torneranno a casa sani e salvi.\n@c1@"
  ja: "@a@b＊「やがて　この地のどこかに\n\t神の御心をうけた　若者が\n\t現れることでしょう。\n@c1@"
"254":
  de: "@a@b*: Wisst Ihr, ich war es, der den Mann beim Brotstehlen erwischt hat.\n@c2@"
  en: "@a@b*: D'ye ken that I'm the one who caught that laddie stealin' the bread?\n@c2@"
  es: "@a@b*: ¿Sabe que yo soy el que atrapó a ese sujeto robando el pan?\n@c2@"
  fr: "@a@b*ⓢ Vous savez que c'est moi qui ai attrapé ce type en train de voler du painⓡ\n@c2@"
  it: "@a@b*: Lo %H860%Xsai%Ysapete%Z? Sono stato io a catturare il tipo che rubava il pane!\n@c2@"
  ja: "@a@b＊「パンを盗んだ男ば\n\tとっつかまえたのは\n\tおいですたい。\n@c2@"
"255":
  de: "@a@b*: Er sitzt jetzt hinter Gittern, zeigt aber kein bisschen Reue.\n@c2@"
  en: "@a@b*: He's behind bars doon in the jail noo, but he's no showin' a scrap o' remorse.\n@c2@"
  es: "@a@b*: Ahora está entre rejas, pero no parece mostrarse demasiado arrepentido.\n@c2@"
  fr: "@a@b*ⓢ Il est derrière les barreaux, à présent, mais il ne semble pas avoir le moindre remord.\n@c2@"
  it: "@a@b*: Anche se ora è in gattabuia, non mostra il minimo segno di rimorso!\n@c2@"
  ja: "@a@b＊「ヤツなら　今　牢屋に入って\n\tおとなしゅうしとっけど\n\tちぃーとも反省してなかとよ。\n@c2@"
"256":
  de: "@a@b*: Er tut gar, als er sei ein Bub, und will freigelassen werden!\n@c2@"
  en: "@a@b*: He's even got the cheek to be pretendin' he's a kid an' askin' tae be let oot!\n@c2@"
  es: "@a@b*: ¡Aún tiene la desfachatez de fingir que es un niño y pedir que le dejen salir!\n@c2@"
  fr: "@a@b*ⓢ Il a même le culot de prétendre qu'il n'est qu'un enfant et il demande qu'on le laisse sortirⓠ\n@c2@"
  it: "@a@b*: Anzi! Ha la faccia tosta di fingere di essere un bambino, e chiede di essere liberato subito!\n@c2@"
  ja: "@a@b＊「けしからんことに\n\t子供のふりして　牢から\n\t出してもらおうとしとるばい。\n@c2@"
"257":
  de: "@a@b*: Miau.\n@c1@"
  en: "@a@b*: Meow.\n@c1@"
  es: "@a@b*: Miau.\n@c1@"
  fr: "@a@b*ⓢ Miaou.\n@c1@"
  it: "@a@b*: Miaaao!\n@c1@"
  ja: "@a@b＊「にゃ～ん。\n@c1@"
"258":
  de: "@aAlfons@bIch hab was von einem Kinderspielplatz im Wald gehört, südöstlich von der Stadt.\n@c2@"
  en: "@aAngus@bI heard talk aboot a kiddies' playground in the forest tae the south-east o' toon.\n@c2@"
  es: "@aAngustio@bHe oído hablar de un lugar de recreo para los niños en el bosque, hacia el sudeste de la ciudad.\n@c2@"
  fr: "@aAngus@bJ'ai entendu parler d'un terrain de jeu des enfants dans la forêt, au sud-est de la ville.\n@c2@"
  it: "@aAttilio@bHo sentito parlare di un luogo segreto dove i bambini vanno a giocare. Si trova nella foresta, a sud-est del villaggio.\n@c2@"
  ja: "@a@bアレクス「村の　南東の森の中に\n\t子供たちの遊び場があるとか。\n@c2@"
"259":
  de: "@aAlfons@bVielleicht findet Ihr etwas, wenn Ihr Euch dort ein bisschen umseht. An Eurer Stelle würd ich's versuchen.\n@c2@"
  en: "@aAngus@bYe may well find a clue if ye gae an' hae a look aroond there. I'd be away if I were ye.\n@c2@"
  es: "@aAngustio@bPuede que encuentre alguna pista si se acerca hasta allí y echa un vistazo. Yo en su lugar me pondría en marcha.\n@c2@"
  fr: "@aAngus@bIl y a peut-être des indices sur place. J'irais y faire un tour, si j'étais vous.\n@c2@"
  it: "@aAttilio@bForse lì potresti trovare qualche indizio utile... Se fossi in te, andrei a dare un'occhiata.\n@c2@"
  ja: "@a@bアレクス「何か　あるかもしれません。\n\tぜひ　行ってみては　どうだろう。\n@c2@"
"260":
  de: "@aAgnes@bGebt auf Euch Acht dort draußen, Soldat, ja?\n@c2@"
  en: "@aAigneas@bBe cannie oot there, soldier!\n@c2@"
  es: "@aAdalberta@b¡Tenga cuidado ahí fuera, soldado!\n@c2@"
  fr: "@aAgnès@bSoyez prudent là-bas, soldatⓠ\n@c2@"
  it: "@aAgnese@bMi raccomando, soldato! Fai attenzione là fuori!\n@c2@"
  ja: "@a@bフレア「お気をつけて　戦士さま。\n@c2@"
"261":
  de: "@aAlfons@bIch hab die Kinder von einem geheimen Spielplatz reden hören, den sie im Wald südöstlich von hier gefunden haben.\n@c2@"
  en: "@aAngus@bI heard the kiddies talk aboot a secret playground they found in the forest to the south-east o' here.\n@c2@"
  es: "@aAngustio@bHe oído hablar de un lugar de recreo para los niños en el bosque, hacia el sudeste de la ciudad.\n@c2@"
  fr: "@aAngus@bJ'ai entendu parler d'un terrain de jeu des enfants dans la forêt, au sud-est de la ville.\n@c2@"
  it: "@aAttilio@bHo sentito parlare di un luogo segreto dove i bambini vanno a giocare. Si trova nella foresta, a sud-est del villaggio.\n@c2@"
  ja: "@a@bアレクス「村の　南東の森の中に\n\t子供たちの遊び場があるとか。\n@c2@"
"262":
  de: "@aAlfons@bWenn Ihr Euch dort umseht, findet Ihr vielleicht einen Hinweis darauf, wo die Kleinen hin sind, oder wie Ihr auf die Insel im Zinnensee kommt.\n@c2@"
  en: "@aAngus@bYe may well find a clue as to where the kiddies went or hoo tae get intae Loch Tur if ye look aroond there.\n@c2@"
  es: "@aAngustio@bPodría ser que encontrara alguna pista sobre el paradero de los mozalbetes o sobre cómo llegar al Lago Tur si echase un vistazo por allí.\n@c2@"
  fr: "@aAngus@bLà-bas, vous découvrirez peut-être quelques indices sur l'endroit où se trouvent les enfants et sur la Tour Nouaille.\n@c2@"
  it: "@aAttilio@bDai un'occhiata da quelle parti... Potresti scoprire dove sono finiti i bambini, o magari come entrare nella Torre Laga.\n@c2@"
  ja: "@a@bアレクス「何か　あるかもしれません。\n\tぜひ　行ってみては　どうだろう。\n@c2@"
"263":
  de: "@a@b*: Der Kerl, der das Brot geklaut hat, hat sich lange mit den Kindern unterhalten, ehe sie ihn geschnappt haben.\n@c3@"
  en: "@a@b*: That fella who stole the bread was havin' a good time of it chattin' away tae the kiddies afore he was caught.\n@c3@"
  es: "@a@b*: Ese tipo que robó el pan se estaba divirtiendo hablando con los niños hasta que lo atraparon.\n@c3@"
  fr: "@a@b*ⓢ Le type qui a volé le pain a passé pas mal de temps à discuter avec les gamins avant de se faire prendre.\n@c3@"
  it: "@a@b*: Il ladro di pane si divertiva un mucchio a parlare coi bambini, prima che lo mandassero in galera...\n@c3@"
  ja: "@a@b＊「そういや　パンを盗んだヤツが\n\tとっつかまる前に　ガキどもに\n\tいろいろ　聞きまわってたな。\n@c3@"
"264":
  de: "@a@b*: Hick! Gibt doch nix Besseres als 'n kleines Schlückchen, wenn man zu den Sternen hochsieht.\n@c2@"
  en: "@a@b*: Hic! Ye cannae beat a wee dram while ye're lookin' up at the stars.\n@c2@"
  es: "@a@b*: ¡Hip! No hay nada como una copita para acompañarte mientras miras las estrellas.\n@c2@"
  fr: "@a@b*ⓢ Hicⓠ Rien ne vaut une bonne rasade en contemplant les étoiles.\n@c2@"
  it: "@a@b*: Hic! Non sh'è niente di meglio che un goshetto di quello buono mentre guardi le shtelle!\n@c2@"
  ja: "@a@b＊「ぐびぐび　ぷはー。\n\t星を見ながら　飲む酒は\n\t最高ですな。\n@c2@"
"265":
  de: "@a@b*: Ja, das ist ein echtes Rätsel. Wie können sich Kinder einfach in Luft auflösen?\n@c3@"
  en: "@a@b*: Ay, it's a real puzzler this one. Hoo can kiddies just disappear intae thin air?\n@c3@"
  es: "@a@b*: Sí, es un verdadero enigma.\n¿Cómo pueden esfumarse así los niños?\n@c3@"
  fr: "@a@b*ⓢ Franchement, c'est un drôle de mystère. Comment des enfants peuvent-ils se volatiliser comme çaⓡ\n@c3@"
  it: "@a@b*: Accidenti! Proprio non me lo spiego! Com'è possibile che quei bambini siano svaniti nel nulla?!\n@c3@"
  ja: "@a@b＊「う～む　わからぬ……。\n\t目の前で　子供が消えることなど\n\tありえるのだろうか……。\n@c3@"
"266":
  de: "@a@b*: Der Mann im Gefängnis unten heißt Alfons.\nEr ist unser Freund.\n@c1@"
  en: "@a@b*: The man doon in the jail is called Angus. He's oor friend.\n@c1@"
  es: "@a@b*: El hombre encerrado en la cárcel se llama Angustio.\nEs amigo nuestro.\n@c1@"
  fr: "@a@b*ⓢ L'homme qui est en prison s'appelle Angus.\nC'est notre copain.\n@c1@"
  it: "@a@b*: L'uomo che si trova in prigione si chiama Attilio. È amico mio.\n@c1@"
  ja: "@a@b＊「地下牢にいる　おじちゃんは\n\tアレクスって　名前らしいよ。\n\tぼくたちと　なかよしなんだ。\n@c1@"
"267":
  de: "@a@b*: Peterchen und mein Bruder sind bestraft worden, weil sie nicht gehorcht haben.\n@c1@"
  en: "@a@b*: Willy Wally an' ma brother are bein' punished for disobeyin' ma pa.\n@c1@"
  es: "@a@b*: Pelayo y mi hermano están recibiendo su castigo por desobedecer a mi papá.\n@c1@"
  fr: "@a@b*ⓢ Hugues Esclin et mon frère ont été punis parce qu'ils ont désobéi à mon papa.\n@c1@"
  it: "@a@b*: Giacomino e mio fratello sono in punizione perché hanno disubbidito a papà.\n@c1@"
  ja: "@a@b＊「お兄ちゃんと　ププルはね\n\tパパの言い付けを　やぶった\n\tバチが当たったんだよ。\n@c1@"
"268":
  de: "@a@b*: Papa hat gesagt, sie sollten nicht vor dem Dorf spielen, aber sie wollten ja nicht hören.\n@c1@"
  en: "@a@b*: Pa told them not tae go playin' ootside the village, but they dinnae ever listen.\n@c1@"
  es: "@a@b*: Papá les dijo que no salieran fuera del pueblo a jugar, pero nunca le hacen caso.\n@c1@"
  fr: "@a@b*ⓢ Papa leur avait dit de ne pas aller jouer hors du village, mais ils n'écoutent jamais rien.\n@c1@"
  it: "@a@b*: Papà aveva detto di non andare a giocare fuori dal villaggio, ma loro non lo hanno ascoltato.\n@c1@"
  ja: "@a@b＊「パパは　ぜったい村の外で\n\tあそんじゃダメだって\n\t言ったのに……。\n@c1@"
"269":
  de: "@a@b*: Mein Bub ist einer von denen, die verschwunden sind!\n@c2@"
  en: "@a@b*: Ma laddie's one o' the ones that went missin'!\n@c2@"
  es: "@a@b*: ¡Mi pequeño es uno de los que han desaparecido!\n@c2@"
  fr: "@a@b*ⓢ Mon petit garçon est l'un de ceux qui ont disparuⓠ\n@c2@"
  it: "@a@b*: Anche il mio povero cucciolo è stato rapito!\n@c2@"
  ja: "@a@b＊「おお　戦士さま！　うちの息子も\n\tいなくなったんだ！\n@c2@"
"270":
  de: "@a@b*: Wer tut uns das nur an? Ich versteh nicht, was die mit unseren Kindern wollen.\n@c2@"
  en: "@a@b*: Who's doin' this tae us? I cannae understand whit anyone would want wi' oor bairns.\n@c2@"
  es: "@a@b*: ¿Quién nos está haciendo esto? No comprendo lo que quiere de nuestros chiquillos.\n@c2@"
  fr: "@a@b*ⓢ Qui peut bien nous faire çaⓡ Je ne comprends pas ce qu'on peut vouloir à nos petits.\n@c2@"
  it: "@a@b*: Ma perché tanta crudeltà?! Con che coraggio si può fare del male a delle creature innocenti?!\n@c2@"
  ja: "@a@b＊「いったい　何者のしわざだ！？\n\t子供をさらって　どんな得が\n\tあるっていうんだよ？\n@c2@"
"271":
  de: "@a@b*: Morgen spielen wir weiter, Alfons. Ha-püh...\n@c1@"
  en: "@a@b*: Got tae remember tae show Angus where we found those shoes in the morn. Ah-phew...\n@c1@"
  es: "@a@b*: Juguemos de nuevo por la mañana, Angustio. Uff...\n@c1@"
  fr: "@a@b*ⓢ On rejouera demain, Angus. Ron-pfff...\n@c1@"
  it: "@a@b*: Attilio, giocheremo ancora domattina... Ronf!\n@c1@"
  ja: "@a@b＊「アレクスちゃん。\n\tまた明日　あそぼうね……。\n\tむにゃむにゃ……。\n@c1@"
"272":
  de: "@a@b*: Nur keine Sorge.\n@c1@"
  en: "@a@b*: Not tae worry now.\n@c1@"
  es: "@a@b*: No hay por qué preocuparse.\n@c1@"
  fr: "@a@b*ⓢ Il n'y a pas de quoi s'inquiéter.\n@c1@"
  it: "@a@b*: Oh, non c'è da preoccuparsi.\n@c1@"
  ja: "@a@b＊「まあまあ　校長先生。\n@c1@"
"273":
  de: "@a@b*: Kinder haben doch immer ihre Geheimnisse. Das ist doch ganz normal, oder nicht, Soldat?\n@c1@"
  en: "@a@b*: Kiddies always hae their secrets. It's only natural, wouldnae ye say, soldier?\n@c1@"
  es: "@a@b*: Los chicos siempre tienen sus secretos. Es normal, ¿no le parece, soldado?\n@c1@"
  fr: "@a@b*ⓢ Les enfants ont toujours leurs petits secrets. C'est bien normal, n'est-ce pas, soldatⓡ\n@c1@"
  it: "@a@b*: Tutti i ragazzi hanno dei segreti, no? È una cosa assolutamente naturale!\n@c1@"
  ja: "@a@b＊「いつの時代でも　子供たちは\n\t彼らだけの秘密を　持っている\n\tものですわ。　ねえ　戦士さま。\n@c1@"
"274":
  de: "@a@b*: Hallo, Soldat. Wir haben uns gerade über diese traurige Sache unterhalten.\n@c2@"
  en: "@a@b*: Hello, soldier. We were just discussin' the whole sorry situation.\n@c2@"
  es: "@a@b*: Saludos, soldado. Estábamos hablando de esta triste situación.\n@c2@"
  fr: "@a@b*ⓢ Bonjour, soldat. Nous étions justement en train de parler de cette bien triste situation.\n@c2@"
  it: "@a@b*: Salve, soldato. Stavamo parlando di questa bruttissima situazione... \n@c2@"
  ja: "@a@b＊「これは　戦士どの。\n\t今ちょうど　事件のことを\n\t話しておったのです。\n@c2@"
"275":
  de: "@a@b*: Ich weiß nicht ⓚⓛ ich glaube, die Kinder verschweigen uns etwas.\n@c2@"
  en: "@a@b*: I cannae help but think that the bairns are hidin' somethin' between themselves.\n@c2@"
  es: "@a@b*: No puedo evitar pensar que los chiquillos ocultan algo en alguna parte.\n@c2@"
  fr: "@a@b*ⓢ Je ne peux pas m'empêcher de penser que les enfants nous cachent quelque chose.\n@c2@"
  it: "@a@b*: Secondo me, i bambini ci stanno nascondendo qualcosa...\n@c2@"
  ja: "@a@b＊「私には　どうも　子供たちが\n\tかくし事をしておるような\n\t気がして　ならんのですよ。\n@c2@"
"276":
  de: "@a@b*: Was?! Ihr wisst, dass ich ins Bad gekiebitzt habe?\n@c2@"
  en: "@a@b*: Whit!? Ye know I've been peekin' in at the bath!?\n@c2@"
  es: "@a@b*: ¡¿Qué?! ¡¿Cómo sabe que he estado espiando en los baños?!\n@c2@"
  fr: "@a@b*ⓢ Quoiⓠⓑ Vous savez que je regarde les bains en cachetteⓠⓑ\n@c2@"
  it: "@a@b*: Che cosa?! %H860%XSai%YSapete%Z che spiavo nel bagno?\n@c2@"
  ja: "@a@b＊「え？　私が　フロを\n\tのぞいているですって？\n\tふふ　とんでもない。\n@c2@"
"277":
  de: "@a@b*: Äh... Wisst Ihr was? Wenn Ihr das für Euch behaltet, verrate ich Euch ein Geheimnis.\n@c2@"
  en: "@a@b*: Em... I tell ye whit. Keep it tae yerself an' I'll let ye in on a secret.\n@c2@"
  es: "@a@b*: Bueno... Vamos a hacer una cosa. Si no se lo dice a nadie, yo le contaré un secreto.\n@c2@"
  fr: "@a@b*ⓢ Euh... écoutez. Si vous n'en parlez à personne, je vous dis un secret.\n@c2@"
  it: "@a@b*: Ehm... Ecco... %H860%XTi%YVi%Z dirò un segreto, ma %H860%Xdevi%Ydovete%Z promettermi che %H860%Xterrai%Yterrete%Z la bocca chiusa.\n@c2@"
  ja: "@a@b＊「でも　だまっていてくれたら\n\tいいことを　教えましょう。\n@c2@"
"278":
  de: "@a@b*: Ich hab nämlich den Mann im Gefängnis schon mal gesehen. Drüben in Burland, wenn ich mich recht erinnere.\n@c2@"
  en: "@a@b*: The thing is, I've seen that man who's in jail afore. Over in Burland toon, if I mind rightly.\n@c2@"
  es: "@a@b*: El tipo ese de la cárcel... Lo he visto antes. En la ciudad de Burlandia, si mal no recuerdo.\n@c2@"
  fr: "@a@b*ⓢ En fait, j'ai déjà vu ce type qui est en prison. Dans la ville de Bastione, si je me souviens bien.\n@c2@"
  it: "@a@b*: Dunque, io conosco il tipo che è rinchiuso in prigione. Se non ricordo male, l'ho visto a Burlandia.\n@c2@"
  ja: "@a@b＊「じつは　村の地下牢にいる男を\n\t以前　見たことがあるんです。\n\tバトランドの城下町　だったかな。\n@c2@"
"279":
  de: "@a@b*: Ihr solltet vielleicht nach Burland zurückgehen und versuchen, dort ein paar Dinge herauszufinden.\n@c2@"
  en: "@a@b*: Hoo no try goin' back tae Burland tae see whit ye can see?\n@c2@"
  es: "@a@b*: Debería regresar a Burlandia e intentar averiguar algo allí.\n@c2@"
  fr: "@a@b*ⓢ Vous devriez retourner à Bastione pour voir si vous ne pouvez pas y apprendre une ou deux choses.\n@c2@"
  it: "@a@b*: Credo che %H860%Xti%Yvi%Z convenga tornare a Burlandia. Forse lì %H860%Xpotrai%Ypotrete%Z scoprire qualcosa di nuovo.\n@c2@"
  ja: "@a@b＊「いちど　バトランドに戻ってみては？\n@c2@"
"280":
  de: "@a@b*: Ich bin eine Wandernonne. Ich wollte gerade ein Bad nehmen, wäre Euch also verbunden, wenn Ihr verschwinden könntet.\n@c1@"
  en: "@a@b*: I'm a travelling nun. I'm about to have a bath, so I'd be grateful if you could make yourself scarce.\n@c1@"
  es: "@a@b*: Soy una monja viajera. Voy a tomar un baño, así que le agradecería que abandonara la estancia.\n@c1@"
  fr: "@a@b*ⓢ Je suis une religieuse itinérante. Je m'apprête à prendre un bain, alors je vous serais reconnaissante de vous éclipser.\n@c1@"
  it: "@a@b*: Sono una suora errante, e vorrei fare un bagno. %H860%XTi sarei molto grata se te ne andassi%YVi sarei molto grata se ve ne andaste%Z!\n@c1@"
  ja: "@a@b＊「私は　旅の尼。\n\tこれから入浴するので　どうか\n\t出ていってくださいまし。\n@c1@"
"281":
  de: "@a@b*: Das ist 'n schnuckeliges Bad, so viel ist sicher.\nIch muss es ja wissen, schließlich hab ich's eigenhändig geputzt.\n@c2@"
  en: "@a@b*: Aye, this is a bonny wee bath, an' no mistake.\nI should know, I cleaned it wi' ma own hands.\n@c2@"
  es: "@a@b*: Ahhh... ¡córcholis!, ¡son unos baños pulquérrimos! Sé de lo que hablo, pues los he limpiado yo mismo.\n@c2@"
  fr: "@a@b*ⓢ Ah oui, ça c'est un joli bain, pour sûr.\nJ'en sais quelque chose, c'est moi qui l'ai nettoyé de mes propres mains.\n@c2@"
  it: "@a@b*: Ah, questo bagno è più lucido di uno specchio! Lo so bene, perché l'ho pulito con le mie mani!\n@c2@"
  ja: "@a@b＊「はぁはぁ……そろそろですたい。\n\tおいが　そうじしたフロに\n\t女の人が入るころばい。\n@c2@"
"282":
  de: "@a@b*: Hier drüben...\n@c2@"
  en: "@a@b*: Over here...\n@c2@"
  es: "@a@b*: Por aquí...\n@c2@"
  fr: "@a@b*ⓢ Par ici...\n@c2@"
  it: "@a@b*: Di qua... \n@c2@"
  ja: "@a@b＊「こっちへ　おいでよ……。\n@c2@"
"283":
  de: "@a@b*: Da geht's nach draußen...\n@c2@"
  en: "@a@b*: That's the way out...\n@c2@"
  es: "@a@b*: Esa es la salida...\n@c2@"
  fr: "@a@b*ⓢ Ça, c'est la sortie...\n@c2@"
  it: "@a@b*: L'uscita è da quella parte.\n@c2@"
  ja: "@a@b＊「そっちに　行くと　お外に\n\t出られるよ……。\n@c2@"
