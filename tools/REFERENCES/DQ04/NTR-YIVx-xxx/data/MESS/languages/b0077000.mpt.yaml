  ja: "@a@b＊「！！\n@c1@"
"73":
  de: "@a@b*: Tut ⓚⓛ tut mir leid!\nIch hab's mir nur mal genauer angeguckt, mehr nicht!\n@c1@"
  en: "@a@b*: I-I'm sorry!\nIt just took me fancy, is all...\n@c1@"
