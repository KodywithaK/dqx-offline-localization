"57":
  de: "@a@b*: ⓞWenn die Ungeheuer mich am Lossegeln hindern, dann muss ich sie eben aus dem Weg räumenⓟ, hat er gemeint.\n@c2@"
  en: "@a@b*: ⓗIf 'tis monsters that are stoppin' me ship sailin', I'll go an' sort 'em out meself!ⓘ or some such gibberish 'e was coming out with!\n@c2@"
  es: "@a@b*: ''¡Si lo que detiene a mi biarco son los monstriuos, mi encargaré de ellos yo mismo!'', o algo así, decía.\n@c2@"
  fr: "@a@b*ⓢ ⓥSi ce sont des monstres qui empêchent mon bateau de naviguer, je vais leur régler leur compte moi-mêmeⓠⓦ, qu'il a dit, ou une bêtise du genreⓠ\n@c2@"
  it: "@a@b*: Ha detto 'na cosa tipo: ⓕI mostri 'mpediscono a la mi nave di parti'?! Ora gliela fò vede' io!ⓖ...\n@c2@"
  ja: "@a@b＊「魔物のせいで船を出せないなら\n\t退治してきてやる！　とか言って\n\tひとりで　灯台に向かったんですよ。\n@c2@"
