"0":
  de: "@a@b*: Hallo, %H860%XSchatz%Ymeine Süßen%Z! Na, auf Reisen? Dann willkommen in Guckshaven!\n@c1@"
  en: "@a@b*: 'Ello there, my %H860%Xlover%Ylovers%Z!\nTravⓙllinⓙ, are we?\nWell, welcome to Porthtrunnel, then.\n@c1@"
  es: "@a@b*: ¡Hola, %H860%X%A120%Xforastero%Z%B120%Xforastera%Z%Y%R000%Xforasteras%Yforasteros%Z%Z!\nDe viaje, ¿no?\nPues %H860%X%A120%Xbienvenido%Z%B120%Xbienvenida%Z%Y%R000%Xbienvenidas%Ybienvenidos%Z%Z a Puertoumbrío.\n@c1@"
  fr: "@a@b*ⓢ Salut, %H860%X%A120%Xmon chéri%Z%B120%Xma chérie%Z%Y%R000%Xmes chéries%Ymes chéris%Z%Zⓠ\nAlors, on voyageⓡ\nBienvenue à Port-Carène, alors.\n@c1@"
  it: "@a@b*: Salve, %H860%Xtesoruccio%Ytesorucci%Z!\nStiamo a viaggia', vero?\n%H860%X%A120%XBenvenuto%Z%B120%XBenvenuta%Z%Y%R000%XBenvenute%YBenvenuti%Z%Z a Cala Cantiera.\n@c1@"
  ja: "@a@b＊「こんにちは　旅人さん。\n\tここは　港町コナンベリーよ。\n@c1@"
"1":
  de: "@a@b*: Ihr wollt Euch wohl mal die Schiffe ankieken? Dann seht Euch man in der Werft um. Das ist das große Gebäude am Hafen.\n@c3@"
  en: "@a@b*: Come to see the ships, ⓙave you?\nTheyⓙm doinⓙ some buildinⓙ work in the yard.\nⓙEad for that big buildinⓙ at the ⓙarbour.\n@c3@"
  es: "@a@b*: A ver los barcos, ¿no?\nEstán construyendo unos cuantos en el astillero.\nEs ese edificio grande quⓘhay en el puerto.\n@c3@"
  fr: "@a@b*ⓢ Vous êtes là pour voir les bateauxⓡ\nIls sont en train de construire, sur l'chantier. Dirigez-vous vers ce grand bâtiment, sur le port.\n@c3@"
  it: "@a@b*: %H860%XStai%YState%Z qua per vede' le navi, no?\nNel cantiere ne stanno a costrui' una mò mò. Là, in quel grande edificio vicino a lu porto.\n@c3@"
  ja: "@a@b＊「船を見に来たのかい？\n\t船なら　ドックでつくってるぜ。\n\t港にある　大きな建物だよ。\n@c3@"
"2":
  de: "@a@b*: Ich war mal Ladearbeiter.\n@c0@"
  en: "@a@b*: I was a cargo lugger afore.\n@c0@"
  es: "@a@b*: Anteⓘ trabajaba de estibadoⓘ.\n@c0@"
  fr: "@a@b*ⓢ Avant, je chargeais les navires.\n@c0@"
  it: "@a@b*: Prima facevo lu scaricatore a lu porto.\n@c0@"
  ja: "@a@b＊「オレの仕事は　船のつみ荷を\n\t運ぶことだったんだ。\n@c0@"
"3":
  de: "@a@b*: Aber es gibt ja nix mehr zu tun, seit keine Schiffe mehr hier ablegen. Das is' man bannig langweilig geworden hier.\n@c0@"
  en: "@a@b*: But we enⓙt got nothinⓙ to lug now no ships is sailing. Iⓙm ⓙelluva bored.\n@c0@"
  es: "@a@b*: Pero ahora no tenemos naⓗ que cargar, así que no hay barcos que naveguen. Jo, estoy más aburríⓘo.\n@c0@"
  fr: "@a@b*ⓢ Mais maintenant que plus aucun navire ne circule, on n'a plus rien à charger. Je m'ennuie comme jamais.\n@c0@"
  it: "@a@b*: Ma ora che nun parte nisciuna nave, nun tengo più niente da fare. M'annoio comme 'a 'nu piecuro.\n@c0@"
  ja: "@a@b＊「でも　出港する船が\n\tないもんだから\n\tすっかり　ヒマになっちまったよ。\n@c0@"
"4":
  de: "@a@b*: Die Leute sagen, im Turm von Pharos da drüben hätte früher 'n heiliges Feuer gebrannt.\n@c3@"
  en: "@a@b*: They say there was an ⓙoly flame burninⓙ at the top oⓙ yonder Pharos Beacon.\n@c3@"
  es: "@a@b*: Dicen que ahí en la punta del faro Pharos había una luz sagraⓘ.\n@c3@"
  fr: "@a@b*ⓢ On raconte qu'une flamme sacrée brûlait autrefois au sommet de la Balise de Pharos.\n@c3@"
  it: "@a@b*: Dicono che ci stava una fiamma sacra che bruciava sopra a lu faro di Pharos.\n@c3@"
  ja: "@a@b＊「少し前までは　東の大灯台は\n\t聖なる炎を　ともしていたという。\n@c3@"
"5":
  de: "@a@b*: Aber jetzt ist es ein böses Licht. Es macht, dass alle Schiffe auf den Grund des Meeres sinken.\n@c3@"
  en: "@a@b*: But now ⓙtis an evil flame that makes all ships as comes sailinⓙ by sink to the bottom oⓙ the ocean.\n@c3@"
  es: "@a@b*: Pero ahora lo quⓘhay es una luz maligna quⓘhace que todos los barcos se vayan a pique.\n@c3@"
  fr: "@a@b*ⓢ Mais aujourd'hui, c'est une flamme maléfique, qui envoie tous les navires qui passent à proximité au fond de l'océan.\n@c3@"
  it: "@a@b*: Ma mò 'na fiamma malvagia fa affonna' tutte le navi che passano dellà.\n@c3@"
  ja: "@a@b＊「だが　今　あの灯台が　ともすのは\n\t船を沈める　邪悪な炎だ。\n@c3@"
"6":
  de: "@a@b*: Das is' ja man 'n ungünstiger Zeitpunkt! Erst vor Kurzem haben hier noch bannig viele Schiffe abgelegt.\n@c2@"
  en: "@a@b*: Now thatⓙs what I call bad timinⓙ!\nThere was a helluva lot oⓙ ships sailing out oⓙ port not too long back.\n@c2@"
  es: "@a@b*: ¡Vaya mala pata!\nNo haⓘ mucho que este puerto tenía un tráfico de mil demonios.\n@c2@"
  fr: "@a@b*ⓢ Eh bien, c'est ce qui s'appelle mal tomberⓠ\nIl n'y a pas si longtemps que ça, de nombreux bateaux quittaient le port.\n@c2@"
  it: "@a@b*: Proprio a lu momento sbajato!\nFino a poco tempo fa ci stava 'nu fracco di navi che partivano da qui.\n@c2@"
  ja: "@a@b＊「いや～　運がお悪いですなあ。\n\t少し前までは\n\t船も出ていたんですが……。\n@c2@"
"7":
  de: "@a@b*: Aber nun haben sich im Turm von Pharos im Osten Ungeheuer breit gemacht, und seitdem ist er bei der Navigation keine Hilfe mehr.\n@c2@"
  en: "@a@b*: But the lighthouse out east, the Pharos Beacon... Well, ⓙeⓙs bin overrun by monsters, enⓙt ⓙe? Ships canⓙt navigate now.\n@c2@"
  es: "@a@b*: Pero ese faro del este, el faro Pharos... Bueno, se ve que los monⓘtruos lo han ocupaⓘo. Ahora los barcos no pueⓘn navegar.\n@c2@"
  fr: "@a@b*ⓢ Mais le phare qui se trouve à l'est, la Balise de Pharos... eh bien, elle a été envahie par des monstres. Les bateaux ne peuvent plus naviguer.\n@c2@"
  it: "@a@b*: Ma lu faro a est, quello di Pharos... L'hanno assalito li mostri, vero? Mò le navi nun pozzono più viaggia'.\n@c2@"
  ja: "@a@b＊「東の灯台に\n\t変な魔物が住みついたため\n\t船を　出せなくなったんですよ。\n@c2@"
"8":
  de: "@a@b*: Was kann ich für Euch tun? Ach was, wem mach ich denn was vor. Ich bin gar nicht in Stimmung für Geschäfte.\n@c2@"
  en: "@a@b*: What can I do you for, then?\nOh, who am I trying to kid!?\nIⓙm in no mood for sellinⓙ.\n@c2@"
  es: "@a@b*: Bueno, ¿%H860%Xte%Yos%Z pueⓘo ayudar en algo?\n¡Bah, no sé ni lo que me digo!\nNo estoy de humor paⓘ vender naⓘ.\n@c2@"
  fr: "@a@b*ⓢ Alors, que puis-je faire pour vousⓡ\nOh, et puis à quoi bon faire semblantⓠⓑ\nJe ne suis pas d'humeur à faire du commerce.\n@c2@"
  it: "@a@b*: Allora, che pozzo fa' per %H860%Xte%Yvoi%Z?\nMa chi sto a prende' in giro?!\nNun c'ho voja di vende' gnente.\n@c2@"
  ja: "@a@b＊「いらっしゃい！\n\tと　言いたいところだけど\n\tとても商売をする気にならないねえ。\n@c2@"
"9":
  de: "@a@b*: Im Moment gibt's hier nämlich überhaupt keinen Schiffsverkehr. Und so was nennt sich nun Hafen!\n@c2@"
  en: "@a@b*: There enⓙt no ships sailinⓙ at the moment, you see. What a sorry excuse for a port!\n@c2@"
  es: "@a@b*: Ahora los barcos ya no navegan. ¡Qué lástima de puerto!\n@c2@"
  fr: "@a@b*ⓢ En fait, aucun bateau ne circule en ce moment. Vous parlez d'une ville portuaireⓠ\n@c2@"
  it: "@a@b*: Mò nun parte più nisciuna nave. E c'hanno pure lu coraggio di chiamarlo ancora porto!\n@c2@"
  ja: "@a@b＊「なんたって　船を出せないんだから。\n\tこんなの　港町の恥さね！\n@c2@"
"10":
  de: "@a@b*: Mein Schiff ist gesunken, kaum dass es den Hafen verlassen hatte.\n@c2@"
  en: "@a@b*: My ship sank almost as soon as it left the harbour.\n@c2@"
  es: "@a@b*: Mi barco naufragó naⓘ más salir del puerto.\n@c2@"
  fr: "@a@b*ⓢ Mon bateau a coulé presque aussitôt après avoir quitté le port.\n@c2@"
  it: "@a@b*: La mia nave è affondata poco dopo aver lasciato il porto.\n@c2@"
  ja: "@a@b＊「私の船は　港を出て\n\tすぐに　沈んでしまいました。\n@c2@"
"11":
  de: "@a@b*: Und alles nur, weil die verfluchten Ungeheuer den Turm von Pharos im Osten verseucht haben.\n@c2@"
  en: "@a@b*: Itⓙs all because of those blasted monsters infesting the Pharos Beacon east of here.\n@c2@"
  es: "@a@b*: Es por los monⓘtruos esos que infestan el faro Pharos, al este de aquí.\n@c2@"
  fr: "@a@b*ⓢ Tout ça à cause de ces maudits monstres qui infestent la Balise de Pharos, à l'est d'ici.\n@c2@"
  it: "@a@b*: E tutto per colpa di quei maledetti mostri che infestano il faro di Pharos, a est di qui.\n@c2@"
  ja: "@a@b＊「こんなことになったのも\n\tすべては　東の灯台に住みついた\n\t魔物のせいです。\n@c2@"
"12":
  de: "@a@b*: Sobald ein Schiff in offene Gewässer gelangt, sinkt es durch das tückische Leuchtfeuer im Turm wie ein Stein auf Grund.\n@c2@"
  en: "@a@b*: As soon as any boat hits open water it sinks like a stone because of that evil light at the top of the Beacon.\n@c2@"
  es: "@a@b*: En cuanto un barco sale a mar abierto se hunde como un pedrusco por culpa de esa luz diabólica en lo alto del faro.\n@c2@"
  fr: "@a@b*ⓢ Dès qu'un navire arrive en haute mer, il coule comme une pierre à cause de cette lumière maléfique au sommet de la Balise.\n@c2@"
  it: "@a@b*: Non appena una nave prende il largo, va giù come un masso a causa della luce malvagia del faro.\n@c2@"
  ja: "@a@b＊「船が　港を出ると　灯台から\n\t邪悪な光が　発せられ\n\t船を　沈めてしまうんです！\n@c2@"
"13":
  de: "@a@b*: Im Süden, übers Meer, soll es ein echtes Wirtschaftsgenie geben. In Mintos oder so.\n@c0@"
  en: "@a@b*: They say thereⓙs some feller down south over the sea whoⓙs a wizard oⓙ commerce. In a place called Mintos or some such snazzy name.\n@c0@"
  es: "@a@b*: Dicen que hay un tipo al sur, más allá del mar, que es un mago del comercio. Está en un sitio llamado Mintos o un nombre así, elegante.\n@c0@"
  fr: "@a@b*ⓢ On raconte qu'au sud, de l'autre côté de la mer, il y a un type qui est un vrai sorcier du commerce.\n㈡\n*ⓢ Dans une ville appelée Ringys, ou un autre nom pédant du même genre.\n@c0@"
  it: "@a@b*: Pare che a sud ci sta 'nu tizio che è 'nu magu dell'affari. Abita a 'nu posto che se chiama Mintos o 'na robba accussì.\n@c0@"
  ja: "@a@b＊「海をこえた　南のミントスには\n\t商売の神さまみたいな\n\tじいさんが　いるんだってよ。\n@c0@"
"14":
  de: "@a@b*: Wenn der wirklich so 'n As ist, muss er ja ganz schön Knete an den Füßen haben. Das wär auch was für meiner Mutter ihren Sohn!\n@c0@"
  en: "@a@b*: Must be a helluva rich, I sⓙpose, if heⓙs a wizard oⓙ commerce. I wunⓙt mind a slice of ⓙeⓙs cake, let me tell you.\n@c0@"
  es: "@a@b*: Debe de ser un tipo rico, digo yo, si es mago del comercio. No me importaría llevarme cacho de lo que tiene, eso seguro.\n@c0@"
  fr: "@a@b*ⓢ Il doit être sacrément riche, si c'est un grand manitou du commerce. Ça me gênerait pas de partager le gâteau avec lui, je peux vous le dire.\n@c0@"
  it: "@a@b*: Ci devono uscì li sordi dalle orecchie a quello là, se se la cava accussì bene nell'affari! Mica ci direi di no, se mi desse 'nu poco de li quattrini sui...\n@c0@"
  ja: "@a@b＊「商売の神さまってんだから\n\tさぞ　金もうけが　うまいんだろうな。\n\tあやかりたいもんだぜ。\n@c0@"
"15":
  de: "@aTorneko@bAch, Ihr seid's? Wie steht's? Ich hab nur ein bisschen aufs Meer geschaut.\n@c2@"
  en: "@aTorneko@bOh, ⓙtis yerself, is it? Howⓙs she cuttinⓙ?\nI was just gazinⓙ out oⓙer the ocean here. Dreaminⓙ, like...\n@c2@"
  es: "@aTorneko@b¡Oh!, ¿%H860%Xeres tú%Ysois %R000%Xvosiotras%Yvosiotros%Z%Z? ¿Cómo va tiodo?\nEstaba mirando el océano desde aquí. Soñiando un poco...\n@c2@"
  fr: "@aTorneko@bOh, c'est vousⓡ Comment ça vaⓡ\nJ'étais juste en train de contempler l'océan.\nEn train de rêver, en somme...\n@c2@"
  it: "@aBaldo@bToh, chi si rivede? Come va?\nGuardavo l'oceano sconfinato. Stavo quasi sognando a occhi aperti...\n@c2@"
  ja: "@a@bトルネコ「やあ　あなたでしたか。\n\t今　海をながめていました。\n@c2@"
"16":
  de: "@aTorneko@bAch, jetzt kommt mein Schiff bald aus der Werft. Ich verlass mich also darauf, dass Ihr jetzt das Eure tut, in Ordnung?\n@c2@"
  en: "@aTorneko@bAye, me ship wonⓙt be long in the yard now. So Iⓙm countinⓙ on ye to do yer stuff now, all right?\n@c2@"
  es: "@aTorneko@bSí, mi barco ya prionto saldrá del astilliero. Así que cuento %H860%Xcontigo%Ycon %R000%Xvosotras%Yvosotros%Z%Z para cumplir %H860%Xtu%Yvuestra%Z parte, sí.\n@c2@"
  fr: "@aTorneko@bBon, mon bateau sera bientôt sorti du chantier.\nAlors je compte sur vous pour accomplir votre mission, entenduⓡ\n@c2@"
  it: "@aBaldo@bLa mi' nave 'un starà ancora a lungo ne i'ccantiere. M'aspetto che %H860%Xte ti sbrighi a fini' il tu' lavoro%Yvoi vi sbrighiate a fini' il vostro lavoro%Z.\n@c2@"
  ja: "@a@bトルネコ「ええ。\n\t船はもうすぐ　完成するはずです。\n\tあなたがたを信じて待っていますよ！\n@c2@"
"17":
  de: "@a@b*: Hallöchen, %H860%X%A120%XSüßer%Z%B120%XSchätzchen%Z%Ymeine Süßen%Z. Wollt Ihr auf See gehen? Wie wär's dann mit einer Weltkarte, damit Ihr Euch unterwegs zurechtfindet?\n@c2@"
  en: "@a@b*: ⓙUllo, my %H860%Xlover%Ylovers%Z. Off on a sea voyage?\nⓙOw about a map of the world to help you on your way, then?\n@c2@"
  es: "@a@b*: Hola, %H860%X%A120%Xforastero%Z%B120%Xforastera%Z%Y%R000%Xforasteras%Yforasteros%Z%Z. ¿De viaje poⓘl mar?\n¿Y no %H860%Xte%Yos%Z interesaría un mapa paⓘ ayudar%H860%Xte%Yos%Z un poco?\n@c2@"
  fr: "@a@b*ⓢ Salut, %H860%X%A120%Xmon chou%Z%B120%Xma mignonne%Z%Y%R000%Xmes mignonnes%Ymes mignons%Z%Z.\nOn part pour un voyage en merⓡ\n㈡\n*ⓢ Que diriez-vous d'une carte du monde pour vous aider à naviguerⓡ\n@c2@"
  it: "@a@b*: Ciao signo'. Che stai a parti' pe' 'nu viaggio pe' lu mare? Nun è che %H860%Xti%Yvi%Z serve 'na mappa de lu munno, così nun %H860%Xti perdi%Yvi perdete%Z?\n@c2@"
  ja: "@a@b＊「いらっしゃいませ！　船旅のお供に\n\t世界地図はいかがですか？\n\tきっと　お役に立ちますわよ。\n@c2@"
"18":
  de: "@a@b*: Ach, verflixt! Ich dachte, ich hätte noch welche, aber ich kann sie nicht finden. Komisch...\n@c2@"
  en: "@a@b*: Oh, bother! I was sure I ⓙad some left, but theyⓙm not ⓙere. Thatⓙs a bit blimminⓙ odd...\n@c2@"
  es: "@a@b*: ¡Jo, qué fastidio! Estaba segura de que me quedaban uno o dos, pero no están aquí. Eso es muⓘ raro...\n@c2@"
  fr: "@a@b*ⓢ Oh, flûteⓠ J'étais sûre qu'il m'en restait, mais je ne les trouve pas. C'est drôlement bizarre...\n@c2@"
  it: "@a@b*: Oh, ma che sto a di'! Ero sicura che ce n'avevo una, ma qua nun ce ne sta manco l'ombra!\n@c2@"
  ja: "@a@b＊「あら　いやだ！\n\tまだ　いっぱいあったと思ったのに\n\tなくなってるわ。　変ねえ……。\n@c2@"
"19":
  de: "@a@b*: Wie Ihr wollt, Schätzchen. Guckt mal wieder rein, ja?\n@c2@"
  en: "@a@b*: Oh, well. Suit %H860%Xyourself%Yyourselves%Z, me %H860%Xdear%Ydears%Z.\nCome again now, wonⓙt you?\n@c2@"
  es: "@a@b*: Vale dⓘacuerdo. Como %H860%Xquieras%Yqueráis%Z, %H860%X%A120%Xforastero%Z%B120%Xforastera%Z%Y%R000%Xforasteras%Yforasteros%Z%Z.\n%H860%XVolverás %YVolveréis %Zpor aquí, ¿verdáⓘ?\n@c2@"
  fr: "@a@b*ⓢ Bon. Comme vous voudrez, %H860%X%A120%Xmon chou%Z%B120%Xma mignonne%Z%Y%R000%Xmes mignonnes%Ymes mignons%Z%Z.\nMais revenez me voir, d'accordⓡ\n@c2@"
  it: "@a@b*: E vabbè. %H860%XScusami%YScusatemi%Z tanto, signò. %H860%XTorna%YTornate%Z n'artra vorta, però!\n@c2@"
  ja: "@a@b＊「それは　残念ですわ。\n\tまた　おこしくださいね。\n@c2@"
"20":
  de: "@a@b*: Tut mir leid, die Bar ist heute Abend geschlossen. Kommt später wieder.\n@c2@"
  en: "@a@b*: Sorry. Bar's not open ⓙtil this eveninⓙ.\nCome back later.\n@c2@"
  es: "@a@b*: Lo siento. La taberna no abre hasta la noche.\n%H860%XVuelve%YVolved%Z máⓘ tarde.\n@c2@"
  fr: "@a@b*ⓢ Désolé, le bar n'ouvrira que ce soir.\nRevenez plus tard.\n@c2@"
  it: "@a@b*: Mi dispiace, lu bar apre solo di sera. %H860%XTorna%YTornate%Z più tardi.\n@c2@"
  ja: "@a@b＊「悪いなあ。\n\t酒場は　夜からなんだ。\n\t夜になったら　また来てくれよな。\n@c2@"
"21":
  de: "@a@b*: Es gibt da eine traurige Geschichte von einem, der sich umbrachte, als sein Schiff von den Ungeheuern versenkt wurde...\n@c2@"
  en: "@a@b*: Thereⓙs a sad ole tale about a feller who done ⓙeⓙs self in ⓙcos ⓙeⓙs boat got sunk by them monsters...\n@c2@"
  es: "@a@b*: Se cuenta una historia muⓘ triste de un tipo que se murió porque a su barco lo hundieron los monⓘtruos...\n@c2@"
  fr: "@a@b*ⓢ On raconte une histoire bien triste à propos d'un homme qui aurait attenté à ses jours parce que son bateau avait été coulé par des monstres...\n@c2@"
  it: "@a@b*: 'Na storia molto triste narra di quest'uomo che perse tutto quanno la sua nave fu affonnata da li mostri...\n@c2@"
  ja: "@a@b＊「船を　魔物たちに沈められ\n\t自殺した人も　いたとか。\n\tかわいそうに……。\n@c2@"
"22":
  de: "@a@b*: Niemand darf dieses Zimmer betreten. Es ist immer abgeschlossen.\n@c1@"
  en: "@a@b*: Thatⓙs a forbidden room, that one.\nItⓙs always locked.\n@c1@"
  es: "@a@b*: En ese cuarto no se puede entrar.\nEstá siempre cerraⓘo.\n@c1@"
  fr: "@a@b*ⓢ Cette chambre est interdite.\nElle est toujours verrouillée.\n@c1@"
  it: "@a@b*: Quella è 'na stanza proibita.\nSta sempre chiusa a chiave.\n@c1@"
  ja: "@a@b＊「そこの　カギのかかった部屋は\n\tあかずの間になってるんですよ。\n@c1@"
"23":
  de: "@a@b*: Wer da die Nacht verbringt, wacht des Morgens nicht mehr auf. Echt gruselig.\n@c1@"
  en: "@a@b*: Anyone who spends the night in there never wakes up in the morninⓙ. Itⓙs proper scary, it is.\n@c1@"
  es: "@a@b*: Quien pasa la noche aquí nunca se despierta por la mañana. Qué miedo da, ¿eh?\n@c1@"
  fr: "@a@b*ⓢ Tous ceux qui passent la nuit dedans ne se réveillent plus jamais.\nÇa fait vraiment froid dans le dos.\n@c1@"
  it: "@a@b*: Se uno dorme lì dentro, la matina nun se sveja! Mi vengono li brividi solo a penza'!\n@c1@"
  ja: "@a@b＊「なんでも　その部屋に泊まった人が\n\t次の日　がい骨になっていたとか。\n\tおお　こわい……！\n@c1@"
"24":
  de: "@a@b*: Jenseits der Berge nördlich von Casabranca wurde ein Dorf entdeckt, das die Ungeheuer überrannt haben. Völlig ausgeplündert.\n@c2@"
  en: "@a@b*: They found a village over them mountains north of Casabranca that got done over by monsters. Ransacked, ⓙe was.\n@c2@"
  es: "@a@b*: Han encontraⓘo un pueblo en las montañas al norte de Casablanca que lo han destruido los monⓘtruos. Después de saquearlo.\n@c2@"
  fr: "@a@b*ⓢ De l'autre côté des montagnes au nord de Casabranca, on a découvert un village détruit par les monstres. Totalement saccagé.\n@c2@"
  it: "@a@b*: 'Nu villaggio sopra le muntagne a nord di Casabianca è stato saccheggiato da li mostri!\n@c2@"
  ja: "@a@b＊「はるか　ブランカの北の山奥で\n\t魔物たちに　滅ぼされた村が\n\t最近　見つかったそうじゃ。\n@c2@"
"25":
  de: "@a@b*: Und in Samokswa auf der anderen Seite des Meeres sind Leute einfach verschwunden.\n@c2@"
  en: "@a@b*: And folkⓙve bin disappearing over the sea in Zamoksva, an' all.\n@c2@"
  es: "@a@b*: Y por Zamoksva, al otro laⓘo del mar, han estaⓘo desapareciendo y toⓘ eso.\n@c2@"
  fr: "@a@b*ⓢ Et de l'autre côté de la mer, à Zamoksva, les habitants ont disparu.\n@c2@"
  it: "@a@b*: E certa gente è sparita a Zamoskva, dall'altro lato de lu mare.\n@c2@"
  ja: "@a@b＊「海の向こうの　サントハイムでは\n\tお城の人々が　こつぜんと\n\t消えてしまったと言うし……。\n@c2@"
"26":
  de: "@a@b*: Also, ich glaube, das hängt alles damit zusammen, dass der Herr der Unterwelt zum Leben erwacht. Hab ich jedenfalls gehört.\n@c2@"
  en: "@a@b*: If you ask me, ⓙtis all tied up with that Lord oⓙ the Underworld cominⓙ back to life.\nThatⓙs what Iⓙve ⓙeard, anyway...\n@c2@"
  es: "@a@b*: Paⓘ mí que toⓘ tiene que ver con lo de ese Señor del Inframundo que ha vuelto a la vida.\nEso he oído, vamos...\n@c2@"
  fr: "@a@b*ⓢ Si vous voulez mon avis, tout ça est lié à la résurrection du Seigneur des Enfers.\nEnfin, en tout cas, c'est ce que j'ai entendu dire...\n@c2@"
  it: "@a@b*: Seconno me, lu motivo è uno solo: lu Signore de li Inferi se sta a risveja'. Così mi hanno detto...\n@c2@"
  ja: "@a@b＊「もしかして　これは\n\t地獄の帝王が　よみがえるという\n\tうわさと関係があるのかのう……。\n@c2@"
"27":
  de: "@a@b*: Erst vor wenigen Tagen wurde der Turm von Pharos von Monstern eingenommen, wisst Ihr.\n@c1@"
  en: "@a@b*: ⓙTis only just a few days since that Pharos Beacon got took over by monsters, you know.\n@c1@"
  es: "@a@b*: Solo hace unos días que los monⓘtruos se apropiaron de ese faro Pharos.\n@c1@"
  fr: "@a@b*ⓢ Vous savez, cela ne fait que quelques jours que la Balise de Pharos a été envahie par des monstres.\n@c1@"
  it: "@a@b*: Pochi giorni fa il faro di Pharos è stato attaccato da li mostri.\n@c1@"
  ja: "@a@b＊「東の灯台が\n\t魔物たちにおそわれたのは\n\tつい　先日のこと。\n@c1@"
"28":
  de: "@a@b*: Aber seitdem scheint dieses tückische Licht übers Meer. Eine furchtbare Sache.\n@c1@"
  en: "@a@b*: But that ⓙorrible lightⓙs bin shinin' out over the ocean ever since. ⓙTis a beggar of a business.\n@c1@"
  es: "@a@b*: Pero desde ese momento esa luz horrible ha estaⓘo brillando por todo el océano. Mal asunto, eso seguro.\n@c1@"
  fr: "@a@b*ⓢ Mais depuis, cette horrible lueur brille sur l'océan. C'est vraiment une sale affaire.\n@c1@"
  it: "@a@b*: E da allora, ci sta sempre quella luce spaventosa che brilla sull'oceano. Ah, che brutta situazione!\n@c1@"
  ja: "@a@b＊「それ以来\n\t灯台は　邪悪な光で\n\t海を　照らしはじめたのです。\n@c1@"
"29":
  de: "@a@b*: Das hier ist die Werft.\nIhr habt Glück. Wir sind gerade dabei, ein brandneues Schiff zu bauen.\n@c0@"
  en: "@a@b*: This 'ere's the dockyard.\nYou're in luck. We'm buildin' a brand new ship at the minute.\n@c0@"
  es: "@a@b*: Pues este es el astillero.\n%H860%XTienes%YTenéis%Z suerte. Justo estamos conⓘtruyendo un barco nuevo.\n@c0@"
  fr: "@a@b*ⓢ Vous êtes ici sur le chantier naval.\nVous avez de la chance, nous construisons un bateau flambant neuf, en ce moment.\n@c0@"
  it: "@a@b*: E questo è lu cantiere.\n%H860%XTieni%YTenete%Z 'na bella fortuna. Stiamo proprio a costrui' 'na nave nuova di zecca.\n@c0@"
  ja: "@a@b＊「ここは　船のドック。\n\t今　新しい船を\n\tつくっているんです。\n@c0@"
"30":
  de: "@a@b*: Es ist bald fertig. Ach, und Schiff ist ja gar kein Ausdruck, nech. So was habt Ihr im Leben noch nicht gesehen!\n@c0@"
  en: "@a@b*: 'E'll be finished soon.\nAn' 'e's gonna be a ship an' a half.\nLike nuffin' you've ever seen.\n@c0@"
  es: "@a@b*: Pronto lo acabaremos.\nY va a ser la madre de toⓘs los barcos.\nNunca sⓘhabrá visto naⓘ igual.\n@c0@"
  fr: "@a@b*ⓢ Il sera bientôt terminé.\nEt ça ne sera pas la moitié d'un navire, croyez-moi. Vous n'en aurez jamais vu de pareil.\n@c0@"
  it: "@a@b*: Tra 'nu poco sarà finita.\nE sarà 'na signora nave.\n'Na nave come nun se ne sono mai viste prima!\n@c0@"
  ja: "@a@b＊「今まで　見たこともないような\n\tりっぱな船が\n\tもうすぐ　完成しますよ。\n@c0@"
"31":
  de: "@a@b*: Die ham ja keine Ahnung, wie man Geschäfte macht!\n@c3@"
  en: "@a@b*: They don't know how to do business!\n@c3@"
  es: "@a@b*: ¡No tienen ni idea de negocios!\n@c3@"
  fr: "@a@b*ⓢ Ils savent pas faire des affairesⓠ\n@c3@"
  it: "@a@b*: Nun li sanno fa' li affari!\n@c3@"
  ja: "@a@b＊「まったく　商人のやるこたあ\n\tわからねえや！\n@c3@"
"32":
  de: "@a@b*: Die könn'n ihre Schiffe bauen, bis sie schwarz werden.\n㈡\n*: So lange keiner was gegen den Leuchtturm unternimmt, wer'n sie drauf sitzen bleiben.\n@c3@"
  en: "@a@b*: They can make as many boats as they like, but no one's gonna buy them with that lighthouse as it is.\n@c3@"
  es: "@a@b*: Pueⓘn hacer toⓘs los barcos que quieran, pero tal como está ese faro, no los va a comprar nadie.\n@c3@"
  fr: "@a@b*ⓢ Ils peuvent bien fabriquer autant d'bateaux qu'ils veulent, personne les achètera avec cette histoire de phare.\n@c3@"
  it: "@a@b*: Possono fa' quante navi je pare, ma co' lu faro in quelle condizioni, chi se le comprerà mai?\n@c3@"
  ja: "@a@b＊「いくら　船をつくったって\n\t灯台がおかしなことになっちまって\n\t船は　出せねえってのによ！\n@c3@"
"33":
  de: "@a@b*: Ach, um Himmels willen! Warum beruhigen sich die Kinnings nicht endlich? Ist ja schlimmer als 'n Sack Flöhe hüten!\n@c1@"
  en: "@a@b*: Oh, for goodness sake! Why can't kids just settle? Is it too much to ask? I can't get a moment's peace, I can't.\n@c1@"
  es: "@a@b*: ¡Oh, por la Diosa! ¿Por qué no se estarán quietos los zagales? No es mucho pedir. No pueⓘo estar tranquila ni un minuto.\n@c1@"
  fr: "@a@b*ⓢ Oh, par tous les saintsⓠ Pourquoi les enfants ne peuvent-ils pas se tenir tranquillesⓡ C'est donc trop demanderⓡ Je n'ai aucun instant de répit.\n@c1@"
  it: "@a@b*: Oh, nun ce la faccio più! Ma perché 'sti creaturi nun se danno 'na calmata? Sto a chiede' troppo? Nun riesco a trova' pace!\n@c1@"
  ja: "@a@b＊「ああ　もう！　子どもって\n\tどうして　ああなんでしょ？\n\t少しもジッとしてられないんだから。\n@c1@"
"34":
  de: "@a@b*: Oh, toll! Ein Schiff! Klasse, 'n echtes Schiff!\n@c1@"
  en: "@a@b*: Wow! A ship!\nA real ship!\n@c1@"
  es: "@a@b*: ¡Guau! ¡Un barco!\n¡Un barco de verdáⓘ!\n@c1@"
  fr: "@a@b*ⓢ Ouahⓠ Un bateauⓠ\nUn vrai bateauⓠ\n@c1@"
  it: "@a@b*: Cavolacci! 'Na nave!\n'Na nave vera!\n@c1@"
  ja: "@a@b＊「わーい！\n\tお船だ　お船だ！\n@c1@"
"35":
  de: "@a@b*: Ich war noch nie auf 'nem echten Schiff! Super! Ⓠ Johoho, und 'ne Buddel vollⓚⓛ Oha! Mama wollte doch nicht, dass ich das singe.\n@c1@"
  en: "@a@b*: I've never been on a real ship before!\nWahey! Ⓠ What shall we do with the drunⓚⓛ\nOops, Mum said I'm not to sing that...\n@c1@"
  es: "@a@b*: ¡Nunca he estaⓘo en un barco de verdáⓘ!\n¡Vaya! Ⓠ Él vino en un barco de nombre extranjeroooo... Ⓠ\n㈡\n*: ¡Oh!, mamá dice que no debo cantar eso.\n@c1@"
  fr: "@a@b*ⓢ J'étais jamais montée sur un vrai bateau, avantⓠ Youpiⓠ On m'a même dit qu'il y avait des phoques dessusⓠ\n@c1@"
  it: "@a@b*: E chi c'è mai annata su 'na nave?\nWow! Nun vedo l'ora de conosce' un bel marinaio...\n㈡\n*: No, è mejo de no. Mamma m'ha detto che devo sta' lontana da li marinai...\n@c1@"
  ja: "@a@b＊「お船に乗るの　わたし　初めて！\n\tだから　うれしくって！\n\tわーい　わーい！\n@c1@"
"36":
  de: "@a@b*: Wann ist es endlich wieder sicher auf dem Meer?!\n@c2@"
  en: "@a@b*: ⓙOw long we gonna have to wait afore it's safe out at sea again?\n@c2@"
  es: "@a@b*: ¿Cuánto máⓘ vamos a tener que esperaⓘ hasta que podamos volveⓘ a hacernos a la mar con seguridaⓘ?\n@c2@"
  fr: "@a@b*ⓢ Combien de temps devrons-nous attendre avant que la mer soit de nouveau sûreⓡ\n@c2@"
  it: "@a@b*: Quanno dovemo aspetta' prima di pote' torna' a naviga' sicuri pe' lu mare?\n@c2@"
  ja: "@a@b＊「まったく　いつになったら\n\t船を出せるようになるんでしょうか？\n@c2@"
"37":
  de: "@a@b*: Nu' liegt meine ganze Fracht hier rum und verrottet.\n@c2@"
  en: "@a@b*: All that cargo I loaded up's just sittin' there rottin' away.\n@c2@"
  es: "@a@b*: Toⓘa la carga del barco está ahí pudriéndose.\n@c2@"
  fr: "@a@b*ⓢ Ce navire que je viens de charger est immobilisé ici, en train de pourrir.\n@c2@"
  it: "@a@b*: Tutta quella robba che ho caricato sta a fa' la muffa.\n@c2@"
  ja: "@a@b＊「このままじゃ　つみこんだ荷物が\n\t全部　くさっちゃいますよ。\n@c2@"
"38":
  de: "@a@b*: He! Wo wollt Ihr denn hin?\nHier wird Fracht verladen. Da habt Ihr nix verloren.\n@c0@"
  en: "@a@b*: ⓙEre! Where dⓙyou think youⓙm off to!?\nThereⓙs cargo goinⓙ through here all the time. Youⓙm blockinⓙ the path.\n@c0@"
  es: "@a@b*: ¡Ehe! ¡¿Qué %H860%Xhaces ahí %A120%Xparaⓘo%Z%B120%Xparaⓘ%Z%Yhacéis ahí %R000%Xparaⓘs%Yparaⓘos%Z%Z?!\nEs un lugar de paso de carga. %H860%XEstás%YEstáis%Z bloqueando el paso.\n@c0@"
  fr: "@a@b*ⓢ Hé làⓠ Vous allez où, comme çaⓠⓑ Il y a des chargements qui passent ici en permanence.\nVous bloquez le passage.\n@c0@"
  it: "@a@b*: Ahò! Ma che %H860%Xstai%Ystate%Z a fa'?!\nQua entrano e escono li carichi e %H860%Xtu te ne stai%Yvoi ve ne state%Z in mezzo a li piedi?\n@c0@"
  ja: "@a@b＊「ちょっと　ちょっと　どいてくんな！\n\tそんなところに立たれちゃ\n\t荷物運びの　ジャマってもんだ！\n@c0@"
"39":
  de: "@a@b*: Wessen Schiff das wohl ist? Das muss ja ein Vermögen kosten.\n@c2@"
  en: "@a@b*: I wonder whose ship this is.\n'E must be costinⓙ an arm anⓙ a leg.\n@c2@"
  es: "@a@b*: Me pregunto de quién es este barco.\nVa a costarle un ojo de la cara.\n@c2@"
  fr: "@a@b*ⓢ Je me demande à qui est ce bateau.\nIl doit coûter les yeux de la tête.\n@c2@"
  it: "@a@b*: Chissà di chi è 'sta nave.\nCosterà un occhio de la testa.\n@c2@"
  ja: "@a@b＊「これは　どなたさまの船じゃろう？\n\tずいぶんと　お金が\n\tかかっているようじゃが。\n@c2@"
"40":
  de: "@a@b*: Mannomann! Was für 'n Riesenkahn! Wann wird der denn fertig?\n@c1@"
  en: "@a@b*: No way! Thatⓙs a heckuva big ship!\nWhenⓙs it gonna be ready?\n@c1@"
  es: "@a@b*: ¡Imposible! ¡No pueⓘ ser, un barco tan inmenso!\n¿Cuándo estará listo?\n@c1@"
  fr: "@a@b*ⓢ Ouahⓠ C'est un sacré gros bateauⓠ\nQuand est-ce qu'il sera prêtⓡ\n@c1@"
  it: "@a@b*: Incredibile ahò! Alla faccia della nave!\nMa quanno sarà pronta?\n@c1@"
  ja: "@a@b＊「わーい　大きな船だなあ！\n\tいつ　できあがるんだろ？\n@c1@"
"41":
  de: "@a@b*: Was? Wem das Schiff gehört? Seht Ihr nicht, dass ich zu tun hab? Fragt den Chef, der kennt sich aus.\n@c0@"
  en: "@a@b*: Hm? Whoⓙs the ship belong to?\nCanⓙt you see Iⓙm blimminⓙ busy? Thatⓙs a question for the guvⓙnor, not a matey like me.\n@c0@"
  es: "@a@b*: ¿Mmm? ¿Que de quién es el barco?\n¿No %H860%Xves%Yvéis%Z que tengo trabajo? Esa pregunta es paⓘl jefe, no paⓘ un mandaⓘo como yo.\n@c0@"
  fr: "@a@b*ⓢ Mmmⓡ À qui appartient ce bateauⓡ Vous voyez pas que j'suis occupéⓡ C'est une question pour le patron, pas pour un type comme moi.\n@c0@"
  it: "@a@b*: Eh? Di chi è 'sta nave?\nMa nun %H860%Xvedi%Yvedete%Z che c'ho da fa'? E poi 'sta domanda %H860%Xdevi%Ydovete%Z farla al capo, mica a 'nu semplice marinaio come me.\n@c0@"
  ja: "@a@b＊「え？　船の持ち主は　誰かって？\n\t今　いそがしいんだ。\n\tそんなことは　親方に聞いてくんな。\n@c0@"
"42":
  de: "@a@b*: Ich wollte schon immer zur See fahren.\n@c1@"
  en: "@a@b*: I always wanted to be a seafarer.\n@c1@"
  es: "@a@b*: Siempre he querido ser comerciante marítima.\n@c1@"
  fr: "@a@b*ⓢ J'ai toujours voulu être marin.\n@c1@"
  it: "@a@b*: Ho sempre sognato di fa' la marinaia.\n@c1@"
  ja: "@a@b＊「わたし　船乗りになりたかったの。\n@c1@"
"43":
  de: "@a@b*: Anker lichten! Rudergänger, hart Steuerbord! Hach, diese Seemannssprache klingt ja so schön kernig!\n@c1@"
  en: "@a@b*: Weigh anchor! Hard starboard, steersman!\nI love all that sailor speak!\n@c1@"
  es: "@a@b*: ¡Levad anclas! ¡Todo a estribor, timonel!\n¡Me encanta esa forma de hablar marinera!\n@c1@"
  fr: "@a@b*ⓢ Levez l'ancreⓠ À tribord toute, timonierⓠ\nJ'adore tout ce vocabulaire de marineⓠ\n@c1@"
  it: "@a@b*: Leva l'ancora! Vira a poppa! Issa le vele!\nMa quanto m'attizza 'sto modo di parla'!\n@c1@"
  ja: "@a@b＊「おもかじ　いっぱーい！\n\tなんちゃって……。\n@c1@"
"44":
  de: "@a@b*: Ich hab Herrn Talun gesagt, dass wir sein Schiff jetzt auftakeln. Bald ist es fertig. Was hat er denn vor?\n@c3@"
  en: "@a@b*: I told Mr. Taloon we was clewing up eⓙs ship. ⓙTwill be ready soon. Whatⓙs ⓙe up to?\n@c3@"
  es: "@a@b*: Le dije al señor Taloon que estábamos dando los últimos martillazos a su barco. Pronto estará a punto. ¿Qué tendrá en mente?\n@c3@"
  fr: "@a@b*ⓢ J'ai dit à Monsieur Taloon que nous étions en train de terminer son navire. Il sera bientôt prêt.\nJe me demande ce qu'il mijote.\n@c3@"
  it: "@a@b*: C'ho detto a Baldo che stavamo a fini' la nave. Fra poco sarà pronta. Che sta a fa' lui?\n@c3@"
  ja: "@a@b＊「もうすぐ　船が完成するってのに\n\tトルネコのだんなは\n\tなにをやってるんだ！？\n@c3@"
"45":
  de: "@a@b*: Ich hoffe, er lässt sich nicht von den Ungeheuern beim Leuchtturm auffressen.\n@c3@"
  en: "@a@b*: I ⓙope ⓙe enⓙt bin gobbled up by no monsters up at the Beacon.\n@c3@"
  es: "@a@b*: Espero que no se lo hayan comíⓘo los monⓘtruos en el faro.\n@c3@"
  fr: "@a@b*ⓢ J'espère qu'il ne s'est pas fait dévorer par des monstres, là-bas, à la Balise.\n@c3@"
  it: "@a@b*: Spero che nun se sia fatto magna' da li mostri de lu faro.\n@c3@"
  ja: "@a@b＊「灯台の魔物に\n\t食われちまったんでなきゃ\n\tいいけどな。\n@c3@"
"46":
  de: "@a@b*: Was? Ihr wollt Euch für Herrn Talun um den Leuchtturm kümmern? Tja, aber seid vorsichtig. Das ist 'ne bannig gefährliche Sache!\n@c3@"
  en: "@a@b*: What? Youⓙre gonna take on the beacon instead of Mr. Taloon? Well donⓙt take too many risks. ⓙTis ⓙeckuva dangⓙrous up there.\n@c3@"
  es: "@a@b*: ¿Qué? ¿Que %H860%Xtú te vas a encargaⓘ%Y%R000%Xvosotras%Yvosotros%Z os vais a encargaⓘ%Z del faro en lugar del señor Taloon? Bueno, no %H860%Xte arriesgues%Yos arriesguéis%Z demasiaⓘo. Es muⓘ peligroso.\n@c3@"
  fr: "@a@b*ⓢ Commentⓡ Vous allez vous occuper de la Balise à la place de Monsieur Taloonⓡ Ne prenez pas trop de risques. C'est sacrément dangereux par là-bas.\n@c3@"
  it: "@a@b*: Come? A lu faro %H860%Xci vai te%Yc'annate voi%Z a lu posto di Baldo? Beh, in bocca a lu lupo, mica c'è da sta' tranquilli lassù.\n@c3@"
  ja: "@a@b＊「へー？　トルネコのだんなに代わって\n\tあんたたちが　灯台の魔物を？\n\tでも　無理をするんじゃねえぜっ。\n@c3@"
"47":
  de: "@a@b*: Ich bin Schiffskapitän. Aber ein Kapitän an Land ist wie ein Fisch auf'm Trockenen. Ich sollte eigentlich auf See fahren!\n@c3@"
  en: "@a@b*: I'm a ship's cap'n, I am.\nA cap'n en't got no business on dry land.\nI should be out on the drink!\n@c3@"
  es: "@a@b*: Yo soy capitán de barco.\nNo tengo naⓘ que haceⓘ en tierra.\n¡Debería dⓘestaⓘ mar adentro!\n@c3@"
  fr: "@a@b*ⓢ Je suis capitaine de vaisseau.\nUn capitaine n'a rien à faire sur la terre ferme.\nJe devrais être en merⓠ\n@c3@"
  it: "@a@b*: Io so' lu capitano de la nave.\nSulla terra ferma, 'nu capitano nun sa che fare.\nA parte farse 'na bella bevuta!\n@c3@"
  ja: "@a@b＊「オレは　この船の船長だ。\n\tそりゃあ　オレだって\n\t船を出したいさ。\n@c3@"
"48":
  de: "@a@b*: Aber sobald man aus dem Hafen kommt, verursacht das Leuchtfeuer von Pharos einen Sturm, wie Ihr noch keinen erlebt habt.\n@c3@"
  en: "@a@b*: But soon as you're out the 'arbour now, some funny light from Pharos Beacon whips up a storm like nort you've ever seen.\n@c3@"
  es: "@a@b*: Pero ahora, naⓘ más salir del puerto, una luz rara del faro Pharos atrae la peor tormenta que sⓘhaya visto.\n@c3@"
  fr: "@a@b*ⓢ Mais aujourd'hui, dès qu'on quitte le port, une drôle de lumière venant de la Balise de Pharos déclenche une tempête phénoménale.\n@c3@"
  it: "@a@b*: Ora, appena s'esce da lu porto, da lu faro di Pharos parte 'na tempesta mai vista!\n@c3@"
  ja: "@a@b＊「でもな　船が　港を出たとたん\n\t灯台が　あやしく光って\n\t海がものすごく荒れるんだ。\n@c3@"
"49":
  de: "@a@b*: Ist zwar noch nicht lange so, aber Donnerkiel und Schotenbruch, das geht mir mächtig anne Nieren!\n@c3@"
  en: "@a@b*: ⓙTisn't long past that it all started, but it's already a proper pain in the keel!\n@c3@"
  es: "@a@b*: ¡No hace mucho que pasa esto, pero me tiene amargaⓘo de proa a popa!\n@c3@"
  fr: "@a@b*ⓢ Ça ne fait pas longtemps que tout ça a commencé, mais c'est déjà devenu un vrai souciⓠ\n@c3@"
  it: "@a@b*: 'Sta faccenna nun dura da tanto tempo, però è già 'na gran rottura!\n@c3@"
  ja: "@a@b＊「つい　この間からだぜ。\n\tまったく　オレはついてないよ！\n@c3@"
"50":
  de: "@a@b*: Neulich hat hier ein Schiff nach Mintos abgelegt. Da soll eine Prinzessin aus Samokswa an Bord gewesen sein.\n@c3@"
  en: "@a@b*: They say there was a princess from Zamoksva on the last ship that sailed out of here to Mintos.\n@c3@"
  es: "@a@b*: Dicen que en el último barco que salió hacia Mintos viajaba una princesa de Zamoksva.\n@c3@"
  fr: "@a@b*ⓢ Il paraît qu'il y avait une princesse de Zamoksva sur le dernier navire qui est parti d'ici pour rejoindre Ringys.\n@c3@"
  it: "@a@b*: Pare che sull'ultima nave che è salpata da qui per Mintos ci stava 'na principessa di Zamoskva.\n@c3@"
  ja: "@a@b＊「南のミントスに向かった船が\n\t最後に出た船で　それには\n\tサントハイムの姫が　乗ってたとか。\n@c3@"
"51":
  de: "@a@b*: Ich wette, das war 'ne schmucke junge Deern. Ich wünschte, ich hätte sie gesehen.\n@c3@"
  en: "@a@b*: I bet she was a proper 'andsome young maid.\nI wish I'd seen her.\n@c3@"
  es: "@a@b*: Seguro que era una moza bien maja.\nMe hubiera gustaⓘo verla.\n@c3@"
  fr: "@a@b*ⓢ Je parie que c'était une très jolie jeune fille.\nJ'aurais aimé la voir.\n@c3@"
  it: "@a@b*: Scommetto che era proprio 'na bella pulzella. Peccato che me la so' persa!\n@c3@"
  ja: "@a@b＊「さぞや　美しい姫であろうな。\n\tわたしも　ひと目見たかったものだ。\n@c3@"
"52":
  de: "@a@b*: Es gibt 'n altes Seemannsgarn über ein Schiff mit gestohlener Fracht, das von Ungeheuern weit im Nordosten versenkt wurde.\n@c0@"
  en: "@a@b*: There's an old seafarer's tale about a ship carryin' stolen goods got sunk by monsters far over the ocean to the north-east.\n@c0@"
  es: "@a@b*: Los marineros cuentan una historia dⓘun barco lleno de mercancía robaⓘ que los monⓘtruos hundieron en el océano, hacia el nordeste.\n@c0@"
  fr: "@a@b*ⓢ Un vieux récit de marins parle d'un bateau transportant des marchandises volées.\n㈡\n*ⓢ Il aurait été coulé par des monstres de l'autre côté de l'océan, au nord-est.\n@c0@"
  it: "@a@b*: Ci sta 'na vecchia storia di marinai che parla di 'sta nave che trasportava merce rubata e che venne affonnata da li mostri nell'oceano a nord-est.\n@c0@"
  ja: "@a@b＊「ずっと昔　はるか北東の海で\n\t盗品をつみこんだ船が\n\t魔物におそわれ　沈んだそうだ。\n@c0@"
"53":
  de: "@a@b*: Es heißt, da wär auch 'ne wertvolle Rüstung an Bord gewesen, die so komisch gefunkelt hätte.\n@c0@"
  en: "@a@b*: The story goes that among the cargo there was some priceless armour with a strange sheen to it.\n@c0@"
  es: "@a@b*: Dicen que en la carga había también una valiosa armadura con un brillo raro.\n@c0@"
  fr: "@a@b*ⓢ D'après cette histoire, au milieu du chargement se trouvait une armure inestimable émettant une étrange lueur.\n@c0@"
  it: "@a@b*: Seconno 'sta storia, nel carico ci stava 'n'armatura di gran valore che scintillava stranamente.\n@c0@"
  ja: "@a@b＊「その中には　ふしぎな\n\tかがやくヨロイが　あったという。\n@c0@"
"54":
  de: "@a@b*: Wenn die Ungeheuer sich nicht über die Ladung hergemacht haben, liegt die sicher immer noch auf dem Meeresgrund.\n@c0@"
  en: "@a@b*: Must still be at the bottom o' the ocean even now. Or else them monsters 'ave 'ad it.\n@c0@"
  es: "@a@b*: Aún debe dⓘandar por ahí, en el fondo del océano. O a lo mejor la tienen los monⓘtruos.\n@c0@"
  fr: "@a@b*ⓢ Elle doit toujours se trouver au fond de l'eau, à l'heure qu'il est. À moins que les monstres ne l'aient prise.\n@c0@"
  it: "@a@b*: Starà ancora 'n fonno all'oceano. O forse li mostri se la so' pijata.\n@c0@"
  ja: "@a@b＊「そのヨロイも　今は　海の底か……\n\tひょっとしたら　魔物に\n\tうばわれたのかもしれないがな。\n@c0@"
"55":
  de: "@a@b*: Ich sitz ganz schön in der Tinte.\n@c2@"
  en: "@a@b*: I'm in a right tizz, I am.\n@c2@"
  es: "@a@b*: Qué nervios, de verdáⓘ.\n@c2@"
  fr: "@a@b*ⓢ Je suis sacrément embêté.\n@c2@"
  it: "@a@b*: Tengo 'nu diavolo per capello, ecco.\n@c2@"
  ja: "@a@b＊「ああ　心配だ　心配だ！\n@c2@"
"56":
  de: "@a@b*: Dies Schiff hat ein gewisser Herr Talun in Auftrag gegeben. Aber jetzt ist der Alte endgültig übergeschnappt.\n@c2@"
  en: "@a@b*: This vessel was commissioned by a feller called Mr. Taloon. But the old fool's completely zamzodden.\n@c2@"
  es: "@a@b*: Este barco lo encargó un tal señor Taloon. Pero ese viejo idiota está totalmente chalaⓘo.\n@c2@"
  fr: "@a@b*ⓢ Ce vaisseau a été commandé par un Monsieur appelé Taloon. Mais ce vieux cinglé a complètement perdu la boule.\n@c2@"
