  fr: "@a@b*ⓢ Mais bien sûr, il n'a pas réussi et il est de retour en ville, à présent.\n@c2@"
  it: "@a@b*: Ovviamente j'è annata male. Infatti è già tornato in città.\n@c2@"
  ja: "@a@b＊「でも　やっぱり無理だったみたいで\n\t今は　町にもどっていますがね。\n@c2@"
"62":
  de: "@a@b*: Moment mal ⓚⓛ aber dann brauche ich mir doch keine Sorgen mehr zu machen, oder? Aue haue ha, wo hab ich nur immer meinen Kopf!\n@c2@"
  en: "@a@b*: ⓙAng on... Dun't that mean I don't need to worry no more? Why, I'm a daft ole bat sometimes!\n@c2@"
  es: "@a@b*: Un momento... ¡Eso quiere decir que ya no tengo por qué estar nervioso, ¿no?! ¡A veces, soy un cateto!\n@c2@"
  fr: "@a@b*ⓢ Mais, attendez... Ça veut dire que j'ai plus besoin de m'inquiéter alorsⓡ\nJe suis vraiment un vieil idiot, parfoisⓠ\n@c2@"
