  es: "@a@b*: ¿%H860%XSabes%YSabéis%Z esas minimedallas que tⓘencuentras de vez en cuando? Si se recogen, se pueⓘn conseguir buenos tesoros a cambio.\n@c1@"
  fr: "@a@b*ⓢ Vous savez, ces mini médailles que vous trouvez de temps à autreⓡ Si vous les ramassez toutes, vous pouvez obtenir un beau trésor en échange.\n@c1@"
  it: "@a@b*: %H860%XC'hai%YC'avete%Z presenti quelle minimedaglie che se trovano ogni tanto? Se %H860%Xle raccoji%Yle raccojete%Z tutte tutte, %H860%Xle puoi%Yle potete%Z scambia' cu 'nu bellu tesoro.\n@c1@"
  ja: "@a@b＊「ちいさなメダルを　集めておくと\n\tあとで　貴重な宝物と\n\t替えてもらえるそうですよ。\n@c1@"
"77":
  de: "@a@b*: Bitte! Gebt mir doch noch eine Chance!\n@c1@"
  en: "@a@b*: Please! Gimme another chance!\n@c1@"
  es: "@a@b*: ¡Por favor! ¡%H860%XDame%YDadme%Z otra oportunidad!\n@c1@"
  fr: "@a@b*ⓢ S'il vous plaîtⓠ Donnez-moi une autre chanceⓠ\n@c1@"
  it: "@a@b*: Per favore! %H860%XDammi%YDatemi%Z 'n'altra possibilità!\n@c1@"
  ja: "@a@b＊「そんなこと言わずに　お願いです。\n\t見逃してください！\n@c1@"
"78":
  de: "@a@b*: Ihr findet doch hin und wieder so kleine Medaillen? Wenn Ihr die alle einsammelt, könnt Ihr dafür was Schönes bekommen.\n@c1@"
  en: "@a@b*: You know them mini medals you find every now an' then? If you collect 'em all up, you can get some good treasure for 'em.\n@c1@"
  es: "@a@b*: ¿%H860%XSabes%YSabéis%Z esas minimedallas que tⓘencuentras de vez en cuando? Si se recogen, se pueⓘn conseguir buenos tesoros a cambio.\n@c1@"
  fr: "@a@b*ⓢ Vous savez, ces mini médailles que vous trouvez de temps à autreⓡ Si vous les ramassez toutes, vous pouvez obtenir un beau trésor en échange.\n@c1@"
  it: "@a@b*: %H860%XC'hai%YC'avete%Z presenti quelle minimedaglie che se trovano ogni tanto? Se %H860%Xle raccoji%Yle raccojete%Z tutte tutte, %H860%Xle puoi%Yle potete%Z scambia' cu 'nu bellu tesoro.\n@c1@"
  ja: "@a@b＊「ちいさなメダルを　集めておくと\n\tあとで　貴重な宝物と\n\t替えてもらえるそうですよ。\n@c1@"
"79":
  de: "@a@b*: An diesem Herrn Talun sollten wir uns alle ein Beispiel nehmen. Na ja, wenigstens wir Geschäftsleute.\n@c2@"
  en: "@a@b*: That Mr. Taloon's an example to us all.\nWell, all us traders, any'ow.\n@c2@"
  es: "@a@b*: Ese señor Taloon es un ejemplo paⓘ toⓘs.\nBueno, paⓘ los mercaderes, claro.\n@c2@"
  fr: "@a@b*ⓢ Ce Monsieur Taloon est un exemple pour nous tous.\nEnfin... pour nous autres commerçants, en tout cas.\n@c2@"
  it: "@a@b*: Quel Baldo Baldini è n'esempio pe' tutti noi.\nInsomma, almeno pe' noi commercianti.\n@c2@"
  ja: "@a@b＊「トルネコさんは　まったく\n\t武器屋のカガミですな！\n@c2@"
"80":
  de: "@a@b*: Ich mein, erst hatte er einen eigenen Laden. Dann ein eigenes Schiff.\n㈡\n*: Und jetzt will er auf der Suche nach einer legendären Waffe um die Welt segeln. Was für ein Kerl!\n@c2@"
  en: "@a@b*: I mean, first it was 'is own shop. Then 'is own ship. And now 'e's plannin' to sail 'round the world looking for some legend'ry weapon.\n㈡\n*: What a feller!\n@c2@"
  es: "@a@b*: Porque primero tuvo tienda propia. Luego barco propio. Y ahora quiere viajar por toⓘl mundo paⓘ buscar no sé qué arma legendaria.\n㈡\n*: ¡Qué narices!\n@c2@"
  fr: "@a@b*ⓢ D'abord, son propre magasin. Puis son propre navire. Et maintenant, il envisage de faire le tour du monde à la recherche d'une arme légendaire.\n㈡\n*ⓢ Quel hommeⓠ\n@c2@"
  it: "@a@b*: Prima s'è fatto un negozio, poi se compra 'na nave. Mò vuole naviga' in tutto lu munno per cerca' 'st'arma leggendaria.\n㈡\n*: Che personaggio!\n@c2@"
  ja: "@a@b＊「自分で船を買って　世界をまわり\n\t伝説の武器を　探すつもりとか。\n\tいや～　たいしたものです。\n@c2@"
"81":
  de: "@a@b*: Ich sag Euch was... Hick! Einesch Tagesch hab ich auch 'nen Haufen Gold un' mein eignesch Schiff!\n@c3@"
  en: "@a@b*: Let me tell you summat...\nI'll get meself a stack o' gold an' ⓚⓛ Hic! ⓚⓛ 'ave me own ship one day, too...\n@c3@"
  es: "@a@b*: %H860%XTe%YOs%Z voy a deciⓘ una cosa...\nVoy a conseguir un montón dⓘoro y... ¡hip!... un día yo también tendré mi propio barco...\n@c3@"
  fr: "@a@b*ⓢ Laissez-moi vous dire un truc...\nMoi aussi, un jour, j'amasserai de l'or et ⓚ hicⓠ ⓚ j'aurai mon propre bateau...\n@c3@"
  it: "@a@b*: %H860%XShai che ti%YShapete che vi%Z dico?\nUn giorno mi farò un shacco di sholdi e... Hic! Anch'io mi comprerò una nave...\n@c3@"
  ja: "@a@b＊「よう！　聞いてくれよ！\n\tそりゃあ　オレも金をためて\n\tいつかは自分の船を持ちてえよ……。\n@c3@"
"82":
  de: "@a@b*: Das Problem ischt nur ⓚⓛ Hick! ⓚⓛ wennich Geld in meine Hände kriege, geb ich es gleich wieder aus für ⓚⓛ Hick! Ach, Ihr wisst schon...\n@c3@"
  en: "@a@b*: Only problem is, ⓚⓛ Hic! ⓚⓛ soon as I get meself any coins, I fritter 'em away onⓚⓛ Hic! Well, you know what...\n@c3@"
  es: "@a@b*: Solo hay un problema... ¡Hip! En cuanto consigo unas monedas, me las gasto en... ¡Hip! Bueno, no hace falta que lo diga...\n@c3@"
  fr: "@a@b*ⓢ Le seul problème ⓚ hicⓠ ⓚ c'est que dès que j'ai un peu de sous, j'les dépense en ⓚ hicⓠ ⓚ enfin, vous voyez, quoi...\n@c3@"
  it: "@a@b*: Ho un sholo problema... Hic! Appena mi fashio due spiccioli, me li shpendo subito in... Hic! Vabbè, non ci vuole tanta fantashia per capirlo... \n@c3@"
  ja: "@a@b＊「でもよお……金があると\n\tついつい　飲んじまうんだ！\n\t悲しいよなあ。　うっうっ……。\n@c3@"
"83":
  de: "@a@b*: HICK! ... Oh, 'tschuldigung! War 'n büschen laut... Jetzt komme ich von so weit her, und dann sind die ganzen verflixten Karten ausverkauft!\n@c2@"
  en: "@a@b*: HIC! ...Scuse me! 'E was a big'un!\nI come all this way for one o' them maps, an' they'm all blimmin' sold out!\n@c2@"
  es: "@a@b*: ¡HIP! P-perdón... ¡Era un hipo de los grandes!\nVengo hasta aquí paⓘ comprar uno de esos mapas, ¡y resulta que sⓘhan acabaⓘo!\n@c2@"
  fr: "@a@b*ⓢ HICⓠ ... Excusez-moiⓠ Sacré hoquet, celui-làⓠ\nJ'ai fait tout ce chemin pour une de ces maudites cartes, et il n'en reste plus une seuleⓠ\n@c2@"
  it: "@a@b*: Hic! Queshta shì che è bella!\nShono venuto fin qua per una dannatishima mappa, ma shono tutte eshaurite!\n@c2@"
  ja: "@a@b＊「ヒック！……うっ。\n\tせっかく地図を買いにきたのに\n\t品切れだって……。\n@c2@"
"84":
  de: "@a@b*: Sie sagte, sie hätte sie aus Mintos bekommen.\n@c2@"
  en: "@a@b*: She said she got 'em from Mintos.\n@c2@"
  es: "@a@b*: Ha dicho que se los traían de Mintos.\n@c2@"
  fr: "@a@b*ⓢ Elle m'a dit qu'elle les avait reçues de Ringys.\n@c2@"
  it: "@a@b*: Ha detto che le aveva preshe a Mintos.\n@c2@"
  ja: "@a@b＊「そこの地図屋の話だと\n\t地図はミントスから\n\t仕入れているとか……。\n@c2@"
"85":
  de: "@a@b*: Aber das ist mir egal. Hick! Ich will bloß wissen, wann sie wieder welche reinbekommt.\n@c2@"
  en: "@a@b*: But I don't care about that. Hic! All I wanna know's when she's gettin' some more in stock. Hic!\n@c2@"
  es: "@a@b*: Pero eso me da igual. ¡Hip! Solo quiero sabeⓘ cuándo volverá a teneⓘ más en la tienda. ¡Hip!\n@c2@"
  fr: "@a@b*ⓢ Mais je m'en fiche. Hicⓠ Tout ce que je veux savoir, c'est quand elle en aura à nouveau en stock. Hicⓠ\n@c2@"
  it: "@a@b*: Ma che me ne importa da dove vengono! Hic! Io vojo shapere sholo she ne arriveranno altre. Hic!\n@c2@"
  ja: "@a@b＊「もう　つぎ入ってくるのは\n\tいつになるんだろ？\n\tヒック！\n@c2@"
"86":
  de: "@a@b*: Nach wem suchtet ihr doch gleich? Ach so. Vor Kurzem erst waren drei Leute hier.\n@c2@"
  en: "@a@b*: Who's it you're lookin' for again?\nAr, well. There was this group o' three folk here not so long back.\n@c2@"
  es: "@a@b*: ¿A quién %H860%Xdices que buscas%Ydecís que buscáis%Z?\n¡Ah!, vale. Hace no mucho pasó por aquí un grupo de tres personas.\n@c2@"
  fr: "@a@b*ⓢ Qui cherchez-vous, déjà ⓡ\nAh, oui. Il y avait ce groupe de trois personnes, il n'y a pas longtemps.\n@c2@"
  it: "@a@b*: Chi è che %H860%Xstai%Ystate%Z a cerca'?\nAh sì. Fino a poco fa qui ci stava 'nu gruppo di tre persone.\n@c2@"
  ja: "@a@b＊「誰かを探しての旅かい？\n\tそういえば　少し前\n\tおかしな　３人組が来たよ。\n@c2@"
"87":
  de: "@a@b*: Eine Prinzessin und zwei Männer. Sagte, sie suchten nach Psaro dem Metzler oder so. Würdet Ihr das glauben?\n@c2@"
  en: "@a@b*: Some princess an' a couple o' lads. Said they was lookin' for some feller by the name o' Psaro the Manslayer. You wun't credit it, would you?\n@c2@"
  es: "@a@b*: No sé qué princesa y un par de mozos. Decían que buscaban a un tipo llamaⓘo Psaro el Carnicero. Yo no me lo creí demasiaⓘo.\n@c2@"
  fr: "@a@b*ⓢ Une princesse et deux types.\nIls ont dit qu'ils cherchaient un certain Psaro l'Exterminateur. Vous y croyez, vousⓡ\n@c2@"
  it: "@a@b*: 'Na principessa e 'nu paro di ragazzi. Stavano a cerca' 'nu tizio chiamato Psaro lu Massacratore. Stavano a scherza', giusto?\n@c2@"
  ja: "@a@b＊「お姫さまと　お供のふたりで\n\tなんでも　デスピサロとかいう男を\n\tさがしてるって　言ってたな。\n@c2@"
"88":
  de: "@a@b*: Ihr seid nich' von hier, was? Wie wär's mit 'ner Partie Armdrücken? Ich bin die hiesige Meisterin, wisst Ihr!\n@c1@"
  en: "@a@b*: You en't from 'round 'ere, are you? Fancy an arm wrestle? I'm the local champ, you know.\n@c1@"
  es: "@a@b*: No %H860%Xeres%Ysois%Z de por aquí, ¿verdaⓘ?\n¿%H860%XQuieres%YQueréis%Z echaⓘ un pulso? ¡Soy la mejoⓘ del lugar!\n@c1@"
  fr: "@a@b*ⓢ Vous n'êtes pas du coin, dites-moiⓡ\nUn bras de fer, ça vous ditⓡ\nJe suis la championne en titre, vous savez.\n@c1@"
  it: "@a@b*: Nun %H860%Xsei%Ysiete%Z di 'ste parti, vero? Che %H860%Xte va%Yve va%Z de fa' a braccio di ferro? A me nun me batte nisuno!\n@c1@"
  ja: "@a@b＊「この店は　初めて？\n\tねえ　たっぷりサービスするから\n\tあたしと朝まで　つき合わない？\n@c1@"
"89":
  de: "@a@b*: Na, also so ein Frechdachs! Das war doch nicht ernst gemeint! Ihr macht mich ja ganz wuschig!\n@c1@"
  en: "@a@b*: Get away, you cheeky beggar!\nI weren't serious! You've gone an' made me feel all funny now.\n@c1@"
  es: "@a@b*: ¡Largo de aquí, %H860%Xcaradura%Ycaraduras%Z!\n¡No hablaba en serio! Ahora mⓘ%H860%Xhas%Yhabéis%Z hecho sentir rara.\n@c1@"
  fr: "@a@b*ⓢ Partez d'ici, %H860%X%A120%Xpetit impertinent%Z%B120%Xpetite impertinente%Z%Y%R000%Xpetites impertinentes%Ypetits impertinents%Z%Zⓠ\nJe plaisantaisⓠ C'est assez vexant.\n@c1@"
  it: "@a@b*: Ahò, ma che %H860%Xc'hai%Yc'avete%Z creduto davero? Io stavo a scherza'! Io so' 'na donna delicata, mica 'no scaricatore de porto!\n@c1@"
  ja: "@a@b＊「やだー。\n\t冗談に決まってるでしょ。　うふっ。\n@c1@"
"90":
  de: "@a@b*: Ha-püh...\n@c2@"
  en: "@a@b*: Ah-phew...\n@c2@"
  es: "@a@b*: Ah-fiuu...\n@c2@"
  fr: "@a@b*ⓢ Ron-pfff...\n@c2@"
  it: "@a@b*: Ronf!\n@c2@"
  ja: "@a@b＊「ぐうぐう……。\n@c2@"
"91":
  de: "@a@b*: Ha-ha-ha-...püh...\nHa-püh...\n@c2@"
  en: "@a@b*: Ah-ah-ah-...phew...\nAh-phew...\n@c2@"
  es: "@a@b*: ¡Ah-ah-ah, fiuuu!\nAh-fiuu...\n@c2@"
  fr: "@a@b*ⓢ Ron-ron-ron... pfff...\nRon-pfff...\n@c2@"
  it: "@a@b*: Ronf ronf...\nRonf...\n@c2@"
  ja: "@a@b＊「ンゴゴゴ……ゴゴ。\n@c2@"
"92":
  de: "@a@b*: %H860%X%A120%XFurchtloser Reisender%Z%B120%XFurchtlose Reisende%Z%YFurchtlose Reisende%Z! Geht, wenn Ihr gehen wollt.\n@c2@"
  en: "@a@b*: Fearless %H860%Xwanderer%Ywanderers%Z.\nGo if you wish to go...\n@c2@"
  es: "@a@b*: %H860%X%A120%XViajero impávido%Z%B120%XViajera impávida%Z%Y%R000%XViajeras impávidas%YViajeros impávidos%Z%Z.\n%H860%XVe%YId%Z si ese es %H860%Xtu%Yvuestro%Z deseo...\n@c2@"
  fr: "@a@b*ⓢ %H860%X%A120%XAventurier%Z%B120%XAventurière%Z%Y%R000%XAventurières%YAventuriers%Z%Z sans peur.\nPartez si vous le souhaitez...\n@c2@"
  it: "@a@b*: %H860%XAudace viandante, va'%YAudaci viandanti, andate%Z pure, se è quello che %H860%Xdesideri%Ydesiderate%Z...\n@c2@"
  ja: "@a@b＊「おそれを知らぬ者よ。\n\tゆきたければ　ゆくがよい……。\n@c2@"
"93":
  de: "@a@b*: Aber Eurem Schicksal könnt Ihr nicht entkommen. Euer Schiff wird in sein wässriges Verderben segeln...\n@c2@"
  en: "@a@b*: But you cannot escape destiny.\nYour ship will find a watery grave...\n@c2@"
  es: "@a@b*: Pero no se pueⓘ huir del destino.\n%H860%XTu%YVuestro%Z barco hallará eterno reposo en el fondo del mar...\n@c2@"
  fr: "@a@b*ⓢ Mais vous ne pourrez échapper à votre destin.\nL'océan sera la tombe de votre navire...\n@c2@"
  it: "@a@b*: Ma non %H860%Xpuoi sfuggire al tuo%Ypotete sfuggire al vostro%Z destino.\nQuella nave sarà la %H860%Xtua%Yvostra%Z tomba sul mare...\n@c2@"
  ja: "@a@b＊「しかし　必ずや\n\tお前たちの船は\n\t海のもくずと　消えるであろう……。\n@c2@"
"94":
  de: "@a@b*: Mein Mann macht sich immer Sorgen.\n@c2@"
  en: "@a@b*: My 'usband's always frettin'.\n@c2@"
  es: "@a@b*: Mi maríⓘo siempre se preocupa.\n@c2@"
  fr: "@a@b*ⓢ Mon mari est toujours en train de s'inquiéter.\n@c2@"
  it: "@a@b*: Lu marito mio se preoccupa troppo.\n@c2@"
  ja: "@a@b＊「まったく　うちの人ったら\n\tうじうじと考えてばかりいて……。\n@c2@"
"95":
  de: "@a@b*: Auf mich hört er ja nicht. Darum wird er doch kahl.\n㈡\n*: Versucht Ihr mal, ob Ihr bei ihm etwas ausrichten könnt. Er soll nicht dauernd rumzappeln, sondern endlich schlafen.\n@c2@"
  en: "@a@b*: I've tried to tell 'im. That's why 'e's goin' bald, you know. See if you can get through to 'im. Tell him to stop fidgetin' and go to sleep.\n@c2@"
  es: "@a@b*: Yo ya le digo que es por eso que sⓘestá quedando calvo. A ver si %H860%Xtú le puedes%Y%R000%Xvosotras%Yvosotros%Z le podéis%Z hacer razonaⓘ. %H860%XDile%YDecidle%Z que se deje de nervios y se vaya a dormir.\n@c2@"
  fr: "@a@b*ⓢ J'ai essayé de lui dire. C'est pour ça qu'il perd ses cheveux. Voyez si vous pouvez lui parler.\nDites-lui d'arrêter de s'agiter et d'aller se coucher.\n@c2@"
  it: "@a@b*: Ho provato a dijelo. Sta a perde' tutti li capelli pe' l'ansia! %H860%XProva a parlarci tu%YProvate a parlarci voi%Z. %H860%XConvincilo%YConvincetelo%Z a darse 'na calmata e ad anna' a dormi'.\n@c2@"
  ja: "@a@b＊「だから　ハゲるんですよ。\n\tあなたからも　早く寝るように\n\t言ってくださいな。\n@c2@"
"96":
  de: "@aTorneko@bAh, seid gegrüßt! Ich weiß zwar nicht, wer Ihr seid, aber Ihr kommt gerade zur rechten Zeit.\n@c2@"
  en: "@aTorneko@bHello there! I don't know who y'are, but 'tis a fine time ye've come at.\n@c2@"
  es: "@aTorneko@b¡Saludos! No sé %H860%Xquién eres%Yquiénes sois%Z, piero %H860%Xhas%Yhabéis%Z lliegado en el momento oportuno.\n@c2@"
  fr: "@aTorneko@bBonjourⓠ Je ne sais pas qui vous êtes, mais vous tombez à pic.\n@c2@"
  it: "@aBaldo@bEhilà! 'Un so chi %H860%Xsei%Ysiete%Z, ma 'un %H860%Xpotevi%Ypotevate%Z sceglie' un momento migliore pe' arriva'!\n@c2@"
  ja: "@a@bトルネコ「おお！\n\tどなたかは知らないが\n\tちょうどよい所へ　来てくれました！\n@c2@"
"97":
  de: "@aTorneko@bIch bin hier, um dieses bedrohliche böse Feuer oben im Leuchtturm loszuwerden.\n@c2@"
  en: "@aTorneko@bI came here meself to get rid o' that menacin' evil flame that's burnin' at the top o' the beacon.\n@c2@"
  es: "@aTorneko@bYo mismo he vienido aquí para encargarme de esa llama amienazadora que brilla en lo alto del faro.\n@c2@"
  fr: "@aTorneko@bJe suis venu ici pour me débarrasser de cette flamme maléfique et menaçante qui brûle au sommet de la Balise.\n@c2@"
  it: "@aBaldo@bSo' venuto huì pe' spenge' huella fiamma malefiha che brucia 'ncima a i'ffaro.\n@c2@"
  ja: "@a@bトルネコ「この灯台に　ともっている\n\t邪悪な炎を消すつもりで\n\tここまで　来たのですが……\n@c2@"
"98":
  de: "@aTorneko@bAber die Ungeheuer sind so unnachgiebig wie altes Stiefelleder, und ich schaff es einfach nicht bis ganz nach oben.\n@c2@"
  en: "@aTorneko@bOnly, the monsters here are as tough as old boots, an' I'm havin' trouble makin' me way up to the top.\n@c2@"
  es: "@aTorneko@bPero estos monstruos son más duros que un filiete barato y estoy teniendo probliemas para lliegar arriba.\n@c2@"
  fr: "@aTorneko@bSeulement, les monstres d'ici sont sacrément coriaces et j'ai bien du mal à parvenir au sommet.\n@c2@"
  it: "@aBaldo@bSolo che huesti mostri mi stanno dando del filo da torce', e 'un riesco a sali' fino a lassù!\n@c2@"
  ja: "@a@bトルネコ「魔物たちが　強くて\n\tこれ以上　進めなかったのです。\n@c2@"
"99":
  de: "@aTorneko@bIch weiß, es ist reichlich viel verlangt, aber könntet Ihr nicht für mich einspringen und die Sache zu Ende führen?\n@c2@"
  en: "@aTorneko@bI know it's a bit of a tall order like, but would ye be willin' to take over and get the job boxed off fer me?\n@c2@"
  es: "@aTorneko@bYa sé que es algo difícil de piedir, pero ¿%H860%Xpuedes%Ypodéis%Z tomar el relievo y terminar el trabajo por mí?\n@c2@"
  fr: "@aTorneko@bJe sais que ça fait un peu donneur d'ordres, mais accepteriez-vous de vous en charger pour moi et de régler l'affaireⓡ\n@c2@"
  it: "@aBaldo@bForse chiedo troppo, ma non è che %H860%Xci poi anda' te%Yci potete anda' voi%Z a risolve' la faccenda?\n@c2@"
  ja: "@a@bトルネコ「お願いです！\n\tわたしに代わって　邪悪な炎を\n\t消してきてはくれませんか？\n@c2@"
"100":
  de: "@aTorneko@bWirklich? Ach, das ist ja fabelhaft!\n@c2@"
  en: "@aTorneko@bYe will? Well that's grand!\n@c2@"
  es: "@aTorneko@b¿De vierdad? ¡Eso es genial!\n@c2@"
  fr: "@aTorneko@bVous le ferezⓡ C'est fantastiqueⓠ\n@c2@"
  it: "@aBaldo@bSì? Maremma esaudita! Che sollievo!\n@c2@"
  ja: "@a@bトルネコ「おお！　ありがたい！\n@c2@"
"101":
  de: "@aTorneko@bVor Kurzem erst brannte hier im Turm noch ein heiliges Licht, wisst Ihr.\n@c2@"
  en: "@aTorneko@bⓙTwas a holy light burnin' at the top o' the beacon here 'til just recently, ye see.\n@c2@"
  es: "@aTorneko@bHasta no hace mucho la luz quie ardía en lo alto del faro era una luz sagrada.\n@c2@"
  fr: "@aTorneko@bJusqu'à tout récemment, c'était une lumière sacrée qui brillait en haut de cette Balise, voyez-vous.\n@c2@"
  it: "@aBaldo@bFino a poho tempo fa, 'ncima a i'ffaro splendeva una luce sacra.\n@c2@"
  ja: "@a@bトルネコ「この灯台には\n\t少し前まで　聖なる炎が\n\tともっていました。\n@c2@"
"102":
  de: "@aTorneko@bUnd sicher ist hier noch irgendwo etwas Glut übrig.\n@c2@"
  en: "@aTorneko@bAn' I'm sure there must still be a few embers of it left hereabouts somewhere.\n@c2@"
  es: "@aTorneko@bY estoy sieguro de que aún quiedan algunas ascuas de esa luz en algún lado.\n@c2@"
  fr: "@aTorneko@bEt je suis convaincu qu'il en reste encore des braises quelque part.\n@c2@"
  it: "@aBaldo@bSo' sihuro che da hualche parte huì 'ntorno ci devono esse' ancora de' tizzoni.\n@c2@"
  ja: "@a@bトルネコ「そして　その炎の種火が\n\t今でも　この灯台の\n\tどこかにあるそうです。\n@c2@"
"103":
  de: "@aTorneko@bMehr braucht Ihr nicht, um die böse Flamme der Ungeheuer dort oben zu löschen. Ihr müsst nur die Glut finden.\n@c2@"
  en: "@aTorneko@bThat's all ye'd need to put out the evil flame that the monsters are burnin' up there now.\nYe just need to find the embers.\n@c2@"
  es: "@aTorneko@bEso es lo único que si neciesita para apagar la llama maliéfica que los monstruos han enciendido allá arriba.\n㈡\nBasta con encontrar las ascuas del fuego sagrado.\n@c2@"
  fr: "@aTorneko@bC'est tout ce qu'il vous faut pour éteindre la flamme maléfique que les monstres entretiennent\nlà-haut.\nVous n'avez qu'à trouver les braises.\n@c2@"
  it: "@aBaldo@bHuelli dovrebbero esse' sufficienti pe' spenge' la fiamma malvagia accesa dai mostri.\n%H860%XDevi%YDovete%Z trova' i tizzoni.\n@c2@"
  ja: "@a@bトルネコ「聖なる種火を使えば\n\t邪悪な炎も　消えるはず！\n\tまず　聖なる種火を　探すことです。\n@c2@"
"104":
  de: "@aTorneko@bFür den Fall, dass Ihr nicht alles mitbekommen habt, kann ich Euch das Ganze noch mal erklären. Soll ich?\n@c2@"
  en: "@aTorneko@bD'ye want me to repeat all that? I'll run through it again for ye if ye didn't quite get it the first time.\n@c2@"
  es: "@aTorneko@b¿%H860%XQuieres%YQueriéis%Z que lo explique otria viez?\n@c2@"
  fr: "@aTorneko@bJe peux reprendre mes explications, si quelque chose vous a échappé. Voulez-vous que je répèteⓡ\n@c2@"
  it: "@aBaldo@bCredo d'esse' stato hiaro. %H860%XVuoi%YVolete%Z che ripeta la mi' spiegazione?\n@c2@"
  ja: "@a@bトルネコ「もう一度　言いましょうか？\n@c2@"
"105":
  de: "@aTorneko@bGroßartig! Dann überlass ich alles Euch. Wir treffen uns später am Hafen.\n@c2@"
  en: "@aTorneko@bGrand! I'll leave ye to it, then.\nWe'll meet up back at the port.\n@c2@"
  es: "@aTorneko@b¡Estupiendo! %H860%XTi%YOs%Z diejo al cargo de todo, entonces.\nNos vieremos en el puerto.\n@c2@"
  fr: "@aTorneko@bFantastiqueⓠ Je vous laisse vous en charger, alors.\nNous nous retrouverons au port.\n@c2@"
  it: "@aBaldo@bBene! Allora %H860%Xte n'occupi te%Yve n'occupate voi%Z.\nCi si rivede a i'pporto.\n@c2@"
  ja: "@a@bトルネコ「では　頼みましたよ！\n\tわたしは　港町で待っています。\n@c2@"
"106":
  de: "@aTorneko@bJa. Ich kann's Euch nicht verdenken. Aber ⓚⓛ ich bitte Euch! Sonst sitz ich schwer in der Klemme.\n@c2@"
  en: "@aTorneko@bAye, I can't blame ye. But, please!\nI'll be in all kinds o' trouble otherwise.\n@c2@"
  es: "@aTorneko@bBueno, no %H860%Xti%Yos%Z puedo culpar por ello. ¡Pero neciesito ese favor!\nSi no, mi veré metido en muchos probliemas.\n@c2@"
  fr: "@aTorneko@bCertes, je ne peux pas vous blâmer.\nMais, s'il vous plaîtⓠ Je risque d'avoir toutes sortes d'ennuis, sinon.\n@c2@"
  it: "@aBaldo@bBeh, %H860%Xti%Yvi%Z hapisco. Ma %H860%Xti%Yvi%Z prego di rihonsidera' la hosa, altrimenti finisco in un... mare di guai! Ah! Ah! Ah! ⓕMareⓖ di guai! L'avete hapita, la battuta? Ehm...\n@c2@"
  ja: "@a@bトルネコ「そう言わずに\n\tそこをなんとか！　お願いです！\n@c2@"
"107":
  de: "@a@b*: Huch!\nWo ift Torneko?\n@c1@"
  en: "@a@b*: Eep!\nWhere'th Torneko!?\n@c1@"
  es: "@a@b*: ¡Ey!\n¡¿Dónde eztá Torneko?!\n@c1@"
  fr: "@a@b*ⓢ Hiipⓠ\nOù est Tornekoⓠⓑ\n@c1@"
  it: "@a@b*: Eeep!\nDove fta Baldo?!?\n@c1@"
  ja: "@a@b＊「キキー！\n\tトルネコは　どうしたっ！？\n@c1@"
"108":
  de: "@a@b*: Eigentlich foll doch der kommen! Und ipf liege hier im Hinterhalt! Und dann pfringe ich rauf und pflage ihm den Pfädel ein!\n@c1@"
  en: "@a@b*: I heard he wath coming here, tho I've been lying in wait for him. I wath going to leap out and thmath hith brainth in!\n@c1@"
  es: "@a@b*: Me han dicho que iba a venir, azí que he eztado aquí tumbado ezperándole. ¡Iba a zaltar zobre él y a machacarle los zezoz!\n@c1@"
  fr: "@a@b*ⓢ Z'ai entendu dire qu'il venait ici, alors ze me suis caçé pour l'attendre. Ze m'apprêtais à sortir d'un bond pour lui fracasser la têteⓠ\n@c1@"
  it: "@a@b*: Ho faputo che voleva venire qui, cofì lo fto afpettando. Voglio faltargli addoffo e ftaccargli la tefta a morfi.\n@c1@"
  ja: "@a@b＊「トルネコが　この灯台に\n\t向かったと聞いたので　待ちぶせて\n\t食い殺してやろうと思ったのに……。\n@c1@"
"109":
  de: "@a@b*: If verftehe. Er hat Angft gekriegt und ift weggelaufen, ja?\n@c1@"
  en: "@a@b*: I thee... He got thcared and ran away, did he?\n@c1@"
  es: "@a@b*: Ya veo... Ze ha azuztado y ha zalido por piernaz, ¿eh?\n@c1@"
  fr: "@a@b*ⓢ Ze vois... Il a eu peur et s'est enfui, c'est çaⓡ\n@c1@"
  it: "@a@b*: Capifco... Fi è fpaventato ed è fcappato, eh?\n@c1@"
  ja: "@a@b＊「そうか　こわくなって\n\t港町にもどったな！\n@c1@"
"110":
  de: "@a@b*: Na pfön, foll er doch! Mit euf hab if niftf am Hut, nur mit Torneko. Man fieht fich, Pfleimbeutel!\n@c1@"
  en: "@a@b*: Right, then. Well I don't care about you.\nIt'th Torneko I'm after. Tho long, thuckerth!\n@c1@"
  es: "@a@b*: Bueno, vale. No tengo nada %H860%Xcontra ti%Ycontra %R000%Xvosotraz%Yvozotroz%Z%Z.\nEz Torneko el que me intereza. ¡Hazta la vizta, berzotaz!\n@c1@"
  fr: "@a@b*ⓢ Bon, tant pis alors. Ze ne m'intéresse pas à vous. C'est après Torneko que z'en ai. Salut, %H860%Xcraignos%Yles craignos%Zⓠ\n@c1@"
  it: "@a@b*: Poco male. Beh, %H860%Xtu non m'intereffi%Yvoi non m'intereffate%Z.\nVoglio folo Baldo. %H860%XFtammi bene%YFtatemi bene%Z!\n@c1@"
  ja: "@a@b＊「お前たちに　用はない！\n\t港町まで行って　トルネコを\n\t食い殺してくれるわ！　キキー！\n@c1@"
"111":
  de: "@a@bDer Minidämon zaubert Teleportation...\n@c1@"
  en: "@a@bThe minidemon casts Zoom...\n@c1@"
  es: "@a@bEl minidiablo lanza Telerregreso...\n@c1@"
  fr: "@a@bLe mini démon lance le sort Téléportation...\n@c1@"
  it: "@a@bIl minidemone lancia Teletrasporto...\n@c1@"
  ja: "@a@b魔物は　ルーラをとなえた！\n@c1@"
"112":
  de: "@a@b... und ⓚⓛ autsch! ⓚⓛ stößt sich den Kopf an der Decke!\n@c1@"
  en: "@a@b...and ⓚⓛ Ouch! ⓚⓛ bumps his head on the ceiling!\n@c1@"
  es: "@a@b...y... ¡Au!... ¡Se da un cabezazo contra el techo!\n@c1@"
  fr: "@a@b... et ⓚ aïe-euhⓠ ⓚ se cogne la tête au plafondⓠ\n@c1@"
  it: "@a@bTHUD! E va a sbattere con la testa contro il soffitto!\n@c1@"
  ja: "@a@b魔物は\n天井に　頭をぶつけた！\n@c1@"
"113":
  de: "@a@b*: Aupf! Jetzt hab if mir den Kopf angepflagen!\n@c1@"
  en: "@a@b*: Eep! My head hurtth...\n@c1@"
  es: "@a@b*: ¡Ey! Qué dolor de cabeza...\n@c1@"
  fr: "@a@b*ⓢ Hiipⓠ Z'ai mal au crâne...\n@c1@"
  it: "@a@b*: Eeep! Mi fa male la tefta...\n@c1@"
  ja: "@a@b＊「キキー！\n@c1@"
"114":
  de: "@a@bKeine Antwort. Anscheinend hat sich der Minidämon selbst k.o. geschlagen!\n@c1@"
  en: "@a@bNo answer.\nIt looks like the minidemon knocked himself out!\n@c1@"
  es: "@a@bNo hay respuesta.\n¡Parece que el minidiablo se ha dejado inconsciente a sí mismo!\n@c1@"
  fr: "@a@bPas de réponse.\nIl semblerait que le mini démon se soit assommé tout seulⓠ\n@c1@"
  it: "@a@bNessuna risposta.\nPare proprio che il minidemone sia svenuto!\n@c1@"
  ja: "@a@b返事がない。\n気を失っているようだ。\n@c1@"
"115":
  de: "@a@b*: Ka ka ka ka kah!\nLodere! Lodere, dunkle Flamme!\n@c2@"
  en: "@a@b*: Ka ka ka ka kah!\nBurn! Burn, dark flame!\n@c2@"
  es: "@a@b*: ¡Ja, ja, ja, ja, ja!\n¡Arde! ¡Arde, llama oscura!\n@c2@"
  fr: "@a@b*ⓢ Niark, niark, niark, niarkⓠ\nBrûleⓠ Brûle, sombre flammeⓠ\n@c2@"
  it: "@a@b*: Ka ka ka ka ka!\nBrucia! Brucia, fiamma oscura!\n@c2@"
  ja: "@a@b＊「ケケケ。　燃えろ　燃えろ。\n@c2@"
"116":
  de: "@a@b*: Lodere und lass all die blöden Menschenboote zerschellen!\nKa ka ka ka kah!\n@c2@"
  en: "@a@b*: Burn and make all the stupid human boats founder! Ka ka ka ka kah!\n@c2@"
  es: "@a@b*: ¡Arde y haz zozobrar todos los barcos de los estúpidos humanos! ¡Ja, ja, ja, ja, ja!\n@c2@"
  fr: "@a@b*ⓢ Brûle et fais sombrer tous les bateaux de ces stupides humainsⓠ Niark, niark, niarkⓠ\n@c2@"
  it: "@a@b*: Brucia e fai naufragare tutte le navi di quegli stupidi umani! Ka ka ka ka ka!\n@c2@"
  ja: "@a@b＊「邪悪な炎の光で\n\tすべての船を　沈めてしまえ。\n\tケケケケ……。\n@c2@"
"117":
  de: "@a@b*: Hm? Wer %H860%Xbist du%Yseid ihr%Z?\n@c2@"
  en: "@a@b*: Hm? Who are you!?\n@c2@"
  es: "@a@b*: ¿Mmm? ¡¿%H860%XQuién eres%YQuiénes sois%Z?!\n@c2@"
  fr: "@a@b*ⓢ Mmmⓡ Qui êtes-vousⓠⓑ\n@c2@"
  it: "@a@b*: Eh? %H860%XE tu chi sei%YE voi chi siete%Z?!?\n@c2@"
  ja: "@a@b＊「ん？　誰だっ！？\n@c2@"
"118":
  de: "@a@b*: Ka ka ka ka kah!\n%H860%XIdiotischer Mensch ⓚⓛ warum bist du%YIdiotische Menschen ⓚⓛ warum seid ihr%Z hier heraufgekommen?\n@c2@"
  en: "@a@b*: Ka ka ka ka kah!\nIdiot humans, coming up here!\n@c2@"
  es: "@a@b*: ¡Ja, ja, ja, ja, ja!\n¡%H860%X%A120%XHumano estúpido%Z%B120%XHumana estúpida%Z%Y%R000%XHumanas estúpidas%YHumanos estúpidos%Z%Z, venir hasta aquí!\n@c2@"
  fr: "@a@b*ⓢ Niark, niark, niark, niarkⓠ\nVoilà %H860%X%A120%Xun humain bien stupide%Z%B120%Xune humaine bien stupide%Z%Y%R000%Xdes humaines bien stupides%Ydes humains bien stupides%Z%Z pour venir jusqu'iciⓠ\n@c2@"
  it: "@a@b*: Ka ka ka ka ka!\nStupidi umani che osano presentarsi al mio cospetto!\n@c2@"
  ja: "@a@b＊「ケケケケ。\n\tここまでやってくるとは\n\tバカな人間だ。\n@c2@"
"119":
  de: "@a@b*: Mehr Brennstoff für die Flammen der Finsternis! Wir werfen %H860%Xdich%Yeuch%Z da rein und sehen zu, wie %H860%Xdu brennst%Yihr brennt%Z!\n@c2@"
  en: "@a@b*: More fuel for the flames of darkness!\nWe'll toss you in and watch you burn! Ka ka kah!\n@c2@"
  es: "@a@b*: ¡Más combustible para las llamas de las tinieblas!\n¡%H860%XTe%YOs%Z lanzaremos al fuego y %H860%Xte%Yos%Z veremos arder! ¡Ja, ja, ja!\n@c2@"
  fr: "@a@b*ⓢ Davantage de combustible pour les flammes noiresⓠ Nous allons vous jeter dedans et vous regarder brûlerⓠ Niark, niark, niarkⓠ\n@c2@"
  it: "@a@b*: Altro combustibile per le fiamme dell'oscurità!\nVi getteremo nel fuoco e vi guarderemo ardere come rami secchi! Ka ka ka!\n@c2@"
  ja: "@a@b＊「ちょうど良い！\n\tこの炎の中に投げ込んで\n\tたきつけにしてやるわ！　ケケケケ。\n@c2@"
"120":
  de: "@a@b%0%a00010 wirft die Heilige Glut in die Flammen der Finsternis!\n@c0@"
  en: "@a@b%0%a00010 throws the holy embers into the flames of darkness!\n@c0@"
  es: "@a@b¡%0%a00010 arroja el fuego sagrado sobre el fuego de las tinieblas!\n@c0@"
  fr: "@a@b%0%a00010 jette les braises sacrées dans les flammes noiresⓠ\n@c0@"
  it: "@a@b%0%a00010 getta i tizzoni sacri fra le fiamme dell'oscurità!\n@c0@"
  ja: "@a@b%a00010は　聖なる種火を\n炎の中に　投げ入れた！\n@c0@"
"121":
  de: "@a@bDie grausame Flamme erlischt und das heilige Feuer erwacht wieder zum Leben!\n@c0@"
  en: "@a@bThe evil flame goes out, and the holy light springs back to life!\n@c0@"
  es: "@a@b¡La llama maléfica se apaga y la luz sagrada vuelve a la vida!\n@c0@"
  fr: "@a@bLa flamme maléfique s'éteint et la lumière sacrée reprend vieⓠ\n@c0@"
  it: "@a@bLa fiamma malvagia si spegne e la luce sacra torna a splendere!\n@c0@"
  ja: "@a@b邪悪な炎が消え\n聖なる炎が　輝きだした！\n@c0@"
