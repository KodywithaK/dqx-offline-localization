  ja: "@a@b＊「あれっ？\n\tそれじゃあ　わしは\n\t何を心配してたんだ？\n@c2@"
"63":
  de: "@a@b*: Dieser Torneko Dingsbums hat erzählt, er käme aus einem Ort namens Endor weit im Westen.\n@c3@"
  en: "@a@b*: That Torneko feller said 'e come from some place called Endor far off to the west.\n@c3@"
  es: "@a@b*: Ese tipo, Torneko, dijo que venía de un lugar llamaⓘo Endor, lejos al oeste.\n@c3@"
  fr: "@a@b*ⓢ C'type, là, Torneko... Il a dit qu'il venait d'un endroit appelé Chandor, loin à l'ouest.\n@c3@"
  it: "@a@b*: Quel Baldo ha detto che veniva da 'nu posto chiamato Endor, a ovest.\n@c3@"
  ja: "@a@b＊「トルネコって人は\n\tはるか西のエンドールの国から\n\t来たんだってな。\n@c3@"
"64":
  de: "@a@b*: Ist bestimmt nicht leicht für seine Frau und seine Kinder, so ganz allein zu Hause.\n@c3@"
  en: "@a@b*: Must be an 'ard life for 'is wife an' kids back 'ome all on their own.\n@c3@"
  es: "@a@b*: Su esposa y sus hijos lo deben de estar pasándolo mal ahí lejos solos.\n@c3@"
  fr: "@a@b*ⓢ Ça doit être dur pour sa femme et ses gosses d'être seuls chez eux.\n@c3@"
  it: "@a@b*: Chissà come soffrono la mugliera e li criaturi suoi senza lu papà.\n@c3@"
  ja: "@a@b＊「妻も子供も　いるだろうに\n\tご苦労なことだぜ。\n@c3@"
"65":
  de: "@a@b*: Aber als Händler muss man wohl ein paar Opfer bringen, wenn man was erreichen will, was?\n@c3@"
  en: "@a@b*: But I s'pose you can't do no good as a trader if you dun't make a few sacrifices, eh?\n@c3@"
  es: "@a@b*: Pero es lo que tiene, si quieres que te vaya bien de mercadeⓘ, tienes que sacrificarte un poco, ¿no?\n@c3@"
  fr: "@a@b*ⓢ Mais j'suppose que pour être un bon commerçant, il faut faire quelques sacrifices, nonⓡ\n@c3@"
  it: "@a@b*: Però se nun se fanno li sacrifici, nun se fanno manco li denari, giusto?\n@c3@"
  ja: "@a@b＊「もっとも　そのくらいでなきゃ\n\t商売で　成功するのは\n\t無理なんだろうなあ。\n@c3@"
"66":
  de: "@a@b*: Herr Talun wollte nach Süden, sobald sein Schiff aufgetakelt ist.\n@c0@"
  en: "@a@b*: Mr. Taloon was talkin' about 'eadin' south once 'is ship's clewed up.\n@c0@"
  es: "@a@b*: El señor Taloon hablaba dⓘir hacia el sur cuando el barco esté listo.\n@c0@"
  fr: "@a@b*ⓢ Monsieur Taloon a parlé d'aller vers le sud, une fois que son bateau serait terminé.\n@c0@"
  it: "@a@b*: Lu signor Baldo diceva di vole' anna' a sud quanno la nave era pronta.\n@c0@"
  ja: "@a@b＊「トルネコって　だんなは\n\t船が完成したら\n\t南に行きたいって言ってたな。\n@c0@"
"67":
  de: "@a@b*: Er will versuchen, in Mintos jemandem eine Karte von allen Weltmeeren abzukaufen. Muss ja 'ne bannig große Karte sein.\n@c0@"
  en: "@a@b*: Said there's a feller in a town called Mintos down that way with a map of all the world's oceans. Must be a helluva big map.\n@c0@"
  es: "@a@b*: Dijo que había un tipo en una ciudaⓘ llamada Mintos que tenía un mapa de todos los océanos. Debe de ser un mapa muⓘ grande.\n@c0@"
  fr: "@a@b*ⓢ Il a dit que par là-bas, dans une ville appelée Ringys, il y avait un type qui possédait une carte de tous les océans du monde.\n㈡\n*ⓢ Elle doit être sacrément grande.\n@c0@"
  it: "@a@b*: Ha detto che ci sta 'nu cristiano nel villaggio di Mintos che tiene 'na mappa de li oceani di tutto lu munno. Sarà 'na carta gigantesca!\n@c0@"
  ja: "@a@b＊「南の大陸の　ミントスの町にゃ\n\t世界の海にくわしい人がいて\n\tすごい地図を　持ってるそうだ。\n@c0@"
"68":
  de: "@a@b*: Meint Ihr, dass er Recht hat?\nKönnt so eine wie ich wirklich der Göttin dienen? Bin mir da gar nich' so sicher.\n@c1@"
  en: "@a@b*: D'you reckon 'e's right? Could someone like me really go an' serve the Goddess? I en't so sure I could.\n@c1@"
  es: "@a@b*: ¿Será verdaⓘ lo que me cuenta este señor? ¿Podrá una moza como yo serviⓘ a la Diosa? No lo tengo yo muⓘ claro...\n@c1@"
  fr: "@a@b*ⓢ Vous croyez que c'est vraiⓡ Quelqu'un comme moi peut vraiment servir la Déesseⓡ\nJe n'en suis pas si sûre.\n@c1@"
  it: "@a@b*: Ma che dice 'sto tipo?! Anche 'na perzona come me potrebbe servire la dea?! Io tengo i miei tubbi...\n@c1@"
  ja: "@a@b＊「愛があれば年の差なんて…などと\n\tそんなことを　本当に\n\t神さまが　おっしゃるのかしら？\n@c1@"
"69":
