"61":
  de: "@a@b*: Das konnte ja nicht gut gehen. Jetzt ist er wieder in der Stadt.\n@c2@"
  en: "@a@b*: ⓙE din't 'ave no luck, o' course.\n'E's back in town again, now.\n@c2@"
