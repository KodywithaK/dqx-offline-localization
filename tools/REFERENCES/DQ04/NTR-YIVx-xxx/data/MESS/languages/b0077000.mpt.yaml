  es: "@a@b*: Pero solo lo he pensaⓘo. ¡Nunca he robaⓘo naⓘ! %H860%XHaz como que mirabas%YHaced como que mirábais%Z paⓘ otro laⓘo, ¿vale?\n@c1@"
  fr: "@a@b*ⓢ Mais j'y ai seulement pensé. Je n'ai jamais rien voléⓠ Vous pouvez faire comme si vous ne m'aviez jamais surprisⓡ\n@c1@"
  it: "@a@b*: Ci ho solo pensato, ma nun ho rubato gnente! Nun è che %H860%Xpuoi%Ypotete%Z fa' finta che nun %H860%Xm'hai%Ym'avete%Z visto?\n@c1@"
  ja: "@a@b＊「でも　盗もうとしただけで\n\tまだ盗んでいません。\n\tどうか　見逃してください……。\n@c1@"
"75":
  de: "@a@b*: Danke! Ich kann Euch leider nichts zum Dank anbieten. Außer... Ich könnt Euch vielleicht was erzählen...\n@c1@"
  en: "@a@b*: Thank 'e! I, I en't got nothin' to give you in return. 'Cept...I could tell you somethin'...\n@c1@"
  es: "@a@b*: ¡Gracias! No sé cómo %H860%Xagradecértelo%Yagradecéroslo%Z. Claro que... Tengo una información que %H860%Xte%Yos%Z podría interesar.\n@c1@"
  fr: "@a@b*ⓢ Merciⓠ Je... Je n'ai rien à vous donner en échange. Sauf... Sauf que je peux vous dire quelque chose...\n@c1@"
  it: "@a@b*: Grazie tante! Vorrei tanto %H860%Xringraziarti%Yringraziarvi%Z in qualche modo, ma nun c'ho gnente... Però 'na cosa la pozzo fa'...\n@c1@"
  ja: "@a@b＊「あ　ありがとうございます！\n\tお礼に　いいことを教えましょう。\n@c1@"
"76":
  de: "@a@b*: Ihr findet doch hin und wieder so kleine Medaillen? Wenn Ihr die alle einsammelt, könnt Ihr dafür was Schönes bekommen.\n@c1@"
