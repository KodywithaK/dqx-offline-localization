"19":
  de: "@aGotthilf Dämler@bI sag Euch was. I geb Euch die alte Schatzkarte, weil Ihr Eure Sach so gut g'macht habt.\n@c2@"
  en: "@aConrad 'Ilton@bTell you wot, I'll give you me old treasure map for doin' so well.\n@c2@"
  es: "@aConrad Gilton@b¿%H860%XSabes%YSabéis%Z qué? %H860%XTe%YOs%Z voy a dar mi viejo mapa del tesoro por haber acertado y eso.\n@c2@"
  fr: "@aConrad Ilton@bVous savez quoi, je vais vous offrir ma vieille carte au trésor pour avoir si bien répondu.\n@c2@"
  it: "@aJolly Etchelsior@bVoglio premiare la %H860%Xtua%Yvostra%Z preparazione. Ecco, %H860%Xprendi%Yprendete%Z la mia vecchia mappa del tesoro.\n@c2@"
  ja: "@a@bヒルタン「よし　そなたに\n\tこの　宝の地図をつかわそう。\n@c2@"
"20":
  de: "@aGotthilf Dämler@bI han se scho als kloi's Bibberle g'funde, aber hab's nie rausbracht, wo der Schatz isch.\n@c2@"
  en: "@aConrad 'Ilton@bI come across it when I was a nipper, but I never did figure out where the treasure was.\n@c2@"
  es: "@aConrad Gilton@bMe lo encontré cuando era un mico, pero nunca supe dónde estaba el tesoro.\n@c2@"
  fr: "@aConrad Ilton@bJe suis tombé dessus quand j'étais môme, mais je n'ai jamais compris où se trouvait le trésor.\n@c2@"
  it: "@aJolly Etchelsior@bLa trovai quand'ero un ragazzo, ma non sono mai riuscito a capire dove fosse il tesoro.\n@c2@"
  ja: "@a@bヒルタン「わしが若い頃　手に入れたが\n\tついに　記された秘密を\n\t解き明かすことができなかった……。\n@c2@"
"21":
  de: "@aGotthilf Dämler@bI schenk se Euch!\n@c2@"
  en: "@aConrad 'Ilton@bIt's yours!\n@c2@"
  es: "@aConrad Gilton@b¡Es %H860%Xtuyo%Yvuestro%Z!\n@c2@"
  fr: "@aConrad Ilton@bElle est à vousⓠ\n@c2@"
  it: "@aJolly Etchelsior@b%H860%XPrendila, è tua%YPrendetela, è vostra%Z.\n@c2@"
  ja: "@a@bヒルタン「受け取るがよい！\n@c2@"
"22":
  de: "@a@b%0%a00180 erhält die Schatzkarte!\n@c0@"
  en: "@a@b%0%a00180 obtains the treasure map!\n@c0@"
  es: "@a@b%0%a00180 obtiene el mapa del tesoro.\n@c0@"
  fr: "@a@b%0%a00180 reçoit la carte au trésorⓠ\n@c0@"
  it: "@a@b%0%a00180 ottiene la mappa del tesoro!\n@c0@"
  ja: "@a@b%a00180は\nたからの地図を手に入れた！\n@c0@"
"23":
  de: "@aGotthilf Dämler@bVielleicht, dass Ihr den Schatz findet. Probiere geht über Studiere, hä hä.\n@c2@"
  en: "@aConrad 'Ilton@bMaybe you'll be able to find the treasure, eh?\nYou should give it a go.\n@c2@"
  es: "@aConrad Gilton@bIgual %H860%Xtú puedes%Y%R000%Xvosotras%Yvosotros%Z podéis%Z encontrar el tesoro ese.\n¡%H860%XTú prueba%Y%R000%XVosotras%YVosotros%Z probad%Z!\n@c2@"
  fr: "@aConrad Ilton@bPeut-être serez-vous capable de découvrir le trésor, qui saitⓡ\nVous devriez essayer.\n@c2@"
  it: "@aJolly Etchelsior@bChissà, magari %H860%Xtu riuscirai%Yvoi riuscirete%Z a trovare il tesoro.\nVale comunque la pena fare un tentativo, no?\n@c2@"
  ja: "@a@bヒルタン「そなたなら　その地図の秘密を\n\t解き明かすことができるかもしれぬな。\n\tがんばるのじゃぞ！\n@c2@"
"24":
  de: "@aGotthilf Dämler@bAu gut. Aber na verschwätzt mer net mei Zeit. Ade.\n@c2@"
  en: "@aConrad 'Ilton@bFair enough. But I ain't interested in lightweights, so don't waste no more of my time.\n@c2@"
  es: "@aConrad Gilton@bMe parece bien. No me interesan los pardillos, así que no me %H860%Xhagas%Yhagáis%Z perder más el tiempo.\n@c2@"
  fr: "@aConrad Ilton@bComme vous voulez. Mais je ne m'intéresse pas aux petits rigolos, alors ne me faites pas perdre plus de temps.\n@c2@"
  it: "@aJolly Etchelsior@bBah! Non m'interessano i pesi piuma. Non %H860%Xfarmi%Yfatemi%Z perdere altro tempo!\n@c2@"
  ja: "@a@bヒルタン「そうか　残念じゃのう。\n\tでは　ゆくがよい。\n@c2@"
"25":
  de: "@aGotthilf Dämler@bI han des Schatzkärtle scho g'funde, als i noch a kloi's Bibberle war, aber i hab's nie rausbracht, wo der Schatz isch.\n@c2@"
  en: "@aConrad 'Ilton@bI come across that treasure map when I was a nipper, but I never did figure out where the treasure was.\n@c2@"
  es: "@aConrad Gilton@bEncontré ese mapa del tesoro cuando era un mico, pero nunca supe dónde estaba el tesoro.\n@c2@"
  fr: "@aConrad Ilton@bJe suis tombé sur cette carte au trésor quand j'étais môme, mais je n'ai jamais réussi à comprendre où se trouvait le trésor.\n@c2@"
  it: "@aJolly Etchelsior@bTrovai quella mappa quand'ero un ragazzo, ma non sono mai riuscito a capire dove fosse il tesoro.\n@c2@"
  ja: "@a@bヒルタン「そのたからの地図は\n\tわしが　若い頃　手に入れたのだが\n\tついに秘密を　解き明かせなかった…。\n@c2@"
"26":
  de: "@aGotthilf Dämler@bAber probiere geht über studiere, oder net? Ha, no probiert's oifach, %a00140.\n@c2@"
  en: "@aConrad 'Ilton@bI reckon you've got a good chance of findin' it, though. Give it a go, %a00120!\n@c2@"
  es: "@aConrad Gilton@bSeguro que tú tienes más posibilidades de encontrarlo, %A120%Xchaval%Z%B120%Xchavala%Z. ¡Prueba a ver, %a00140!\n@c2@"
  fr: "@aConrad Ilton@bMais je parie que vous avez de bonnes chances de le découvrir. Essayez, %a00140ⓠ\n@c2@"
  it: "@aJolly Etchelsior@bCredo però che tu abbia buone probabilità di trovarlo. Dovresti provarci!\n@c2@"
  ja: "@a@bヒルタン「じゃが　そなたらなら\n\tきっと　できるだろう！\n\t%a00140よ　がんばるのじゃぞ！\n@c2@"
"27":
  de: "@a@b*: Der alte Dämler ist 'n echter Taifun ⓚⓛ äh, ich meine, 'n echtes Teichhuhn. Ähm, na ja, jedenfalls ist er 'n echtes Geschäftsgenie.\n@c2@"
  en: "@a@b*: Old Ilton is a real enterpreterⓚⓛ I mean, entropronerd... Er, he certainly knows a thing or two when it comes to business, anyway.\n@c2@"
  es: "@a@b*: El viejo Gilton es un verdadero emprendredⓚⓛ quiero decir, entremprendr... Bueno, que sabe lo que hay que saber para hacer negocios.\n@c2@"
  fr: "@a@b*ⓢ Ce Ilton est un véritable enterpréteur... euh, je veux dire, intropreneur... Enfin bref, il en connaît un rayon sur les affaires.\n@c2@"
  it: "@a@b*: Il vecchio Jolly Etchelsior è un vero comprenditore... Cioè, imprendituttore... Insomma, è uno che con gli affari ci sa fare.\n@c2@"
  ja: "@a@b＊「いやはや　まったく\n\tヒルタン老人の話は\n\tためになります。\n@c2@"
"28":
  de: "@a@b*: Jedenfalls findet er, man müsste den Leuten Ideen verkaufen und nicht bloß Sachen. Klingt kompliziert, was?\n@c2@"
  en: "@a@b*: He reckons you gotta sell ideas to people, not just stuff. It's a tricky old game.\n@c2@"
  es: "@a@b*: El tipo dice que hay que vender a la gente ideas, no solo cosas. Es un asunto truculento.\n@c2@"
  fr: "@a@b*ⓢ D'après lui, il faut vendre des idées aux gens, et pas juste des objets. C'est drôlement difficile.\n@c2@"
  it: "@a@b*: Il suo motto è: vendere idee alla gente, non solo oggetti. Che furbata, eh?\n@c2@"
  ja: "@a@b＊「物ではなく　心を売る！\n\tこれには　まいりました……。\n@c2@"
"29":
  de: "@a@b*: Mein Vater ist ein Händler, nicht wahr. Darum bin ich hier, um ein bisschen was übers Geschäft zu lernen.\n@c1@"
  en: "@a@b*: My father's a trader, don't you know.\nThat's why I'm here, trying to learn a bit about business.\n@c1@"
  es: "@a@b*: Mi padre es mercader, ¿%H860%Xsabe%Ysaben%Z?\nPor eso mismo estoy aquí, para aprender un poco sobre los negocios.\n@c1@"
  fr: "@a@b*ⓢ Mon père est commerçant, vous savez. C'est pour ça que je suis ici. Pour apprendre une chose ou deux sur les affaires.\n@c1@"
  it: "@a@b*: Mio padre è un commerciante.\nEcco perché sono qui: voglio imparare come si fanno gli affari!\n@c1@"
  ja: "@a@b＊「わたしも　商人の娘。\n\t商売の勉強を　しないとね。\n@c1@"
"30":
  de: "@a@b*: Aber was der Mann neben mir hier will ⓚⓛ keine Ahnung! Herr Dämler würde ihn wahrscheinlich 'nen Dünnbrettbohrer nennen. Hi hi hi!\n@c1@"
  en: "@a@b*: It's hard to imagine what the man next to me is gaining from all this, mind you. No doubt Mr. Ilton would call him a lightweight! Tee hee hee!\n@c1@"
  es: "@a@b*: Cuesta imaginar lo que ganará con todo esto el tipo que hay junto a mí. ¡Seguro que el Sr. Gilton le llamará pardillo! ¡Ji, ji, ji!\n@c1@"
  fr: "@a@b*ⓢ Difficile d'imaginer ce que mon voisin retiendra de tout ça. Sûrement que Monsieur Ilton le traiterait de petit rigoloⓠ Hi hi hiⓠ\n@c1@"
  it: "@a@b*: Il tizio accanto a me non sembra molto sveglio... Anzi, secondo me è un po' tonto. Jolly Etchelsior lo chiamerebbe sicuramente un ⓕpeso piumaⓖ! Eh! Eh! Eh!\n@c1@"
  ja: "@a@b＊「でも　となりの人は　いったい\n\tなにを　しにきてるのかしら！\n@c1@"
"31":
  de: "@a@b*: Miiiau.\n@c1@"
  en: "@a@b*: Meeeow.\n@c1@"
  es: "@a@b*: Miauuuu.\n@c1@"
  fr: "@a@b*ⓢ Miiiiaou.\n@c1@"
  it: "@a@b*: Miaaao.\n@c1@"
  ja: "@a@b＊「なーご。\n@c1@"
"32":
  de: "@a@b*: Wuff!\n@c2@"
  en: "@a@b*: Woof!\n@c2@"
  es: "@a@b*: ¡Guau!\n@c2@"
  fr: "@a@b*ⓢ Ouafⓠ\n@c2@"
  it: "@a@b*: Bau!\n@c2@"
  ja: "@a@b＊「ばうばうばう！\n@c2@"
"33":
  de: "@a@b*: Der Kerl, der gerade hier war, will jetzt seine eigene Stadt gründen oder so.\n@c3@"
  en: "@a@b*: That bloke who was 'ere before went off to set up 'is own town or suchlike.\n@c3@"
  es: "@a@b*: Ese tipo que pasó por aquí antes se fue para establecer su propio pueblo o algo así.\n@c3@"
  fr: "@a@b*ⓢ Le gars qu'était là avant est parti créer sa villeⓠ\n@c3@"
  it: "@a@b*: Il tizio che era qui prima è partito per fondare il suo villaggio...\n@c3@"
  ja: "@a@b＊「以前　この町にいた商人が\n\t新しい町を作ると言って\n\tどこかへ旅立ったそうだ。\n@c3@"
"34":
  de: "@a@b*: Wie hieß er noch gleich...?\nAch ja, Hoffman, das war's.\n@c3@"
  en: "@a@b*: Wot was 'is name again...?\nOh yeah. 'Offman, it was.\n@c3@"
  es: "@a@b*: ¿Cómo se llamaba...?\n¡Ah, sí! Juanchito, eso es.\n@c3@"
  fr: "@a@b*ⓢ Comment y s'appelait déjà...ⓡ\nAh oui. Hoffmanⓠ\n@c3@"
  it: "@a@b*: A proposito, com'è che si chiamava?\nAh, sì... John Dwayne!\n@c3@"
  ja: "@a@b＊「たしか……ホフマンという\n\t名前だったな。\n@c3@"
"35":
  de: "@a@b*: Viele Leute scheinen ganz angetan von der Idee, noch mal irgendwo ganz von vorn anzufangen.\n@c2@"
  en: "@a@b*: Plenty of people seem to be quite taken with the idea of upping sticks and starting afresh somewhere new.\n@c2@"
  es: "@a@b*: Parece que a mucha gente le gusta la idea de montar cuatro palos y un tejado y empezar de nuevo.\n@c2@"
  fr: "@a@b*ⓢ Pas mal de gens semblent impressionnés par l'idée de déménager et de tout recommencer ailleurs.\n@c2@"
  it: "@a@b*: A un sacco di gente piacerebbe mollare baracca e burattini e iniziare una nuova vita altrove.\n@c2@"
  ja: "@a@b＊「新しい土地で　はじめから人生を\n\tやりなおしてみたいという人は\n\tけっこう　いるものです。\n@c2@"
"36":
  de: "@a@b*: Die wären sicher froh, wenn jemand sie bei der Hand nähme und ihnen zeigte, wo es langgeht.\n@c2@"
  en: "@a@b*: I bet they'd be thrilled if someone could come along and find them the kind of place they're looking for.\n@c2@"
  es: "@a@b*: Seguro que estarían encantados si los acompañase alguien para encontrar la clase de lugar que buscan.\n@c2@"
  fr: "@a@b*ⓢ Je suis sûr qu'ils adoreraient que quelqu'un vienne les chercher et leur trouve l'endroit dont ils rêvaient.\n@c2@"
  it: "@a@b*: Scommetto che sarebbero felicissimi se qualcuno riuscisse a creare il luogo che stanno cercando!\n@c2@"
  ja: "@a@b＊「もし　そういう人たちに\n\tピッタリの場所を　紹介すれば\n\tきっと　感謝されることでしょう。\n@c2@"
"37":
  de: "@a@b*: Das hier hat alles Gotthilf Dämler gebaut, wisst Ihr. Bevor der mit seiner Herberge ankam, war hier überhaupt nichts los.\n@c1@"
  en: "@a@b*: Conrad 'Ilton built this place, y'know.\nThere was nuffin' 'ere before 'e set up 'is inn.\n@c1@"
  es: "@a@b*: Conrad Gilton construyó este sitio.\nAntes de que llegase él a establecer su posada, aquí no había nada.\n@c1@"
  fr: "@a@b*ⓢ C'est Conrad Ilton qui a tout bâti ici, vous savez.\nY'avait rien avant qu'il monte son auberge.\n@c1@"
  it: "@a@b*: È stato Jolly Etchelsior a costruire questo posto.\nPrima che arrivasse lui, qui non c'era altro che deserto. \n@c1@"
  ja: "@a@b＊「ヒルタン老人の宿から\n\tはじまった　ミントス……。\n@c1@"
"38":
  de: "@a@b*: Und jetzt will sein Lehrling, dieser Hoffman, seine eigene Stadt gründen.\n@c1@"
  en: "@a@b*: An' now that apprentice of 'is, 'Offman, 'as gone off to set up a town of 'is own, too.\n@c1@"
  es: "@a@b*: Y ahora ese aprendiz suyo, Juanchito, se ha marchado para establecer su propio pueblo.\n@c1@"
  fr: "@a@b*ⓢ Maintenant, c'est son apprenti, Hoffman, qu'est parti pour construire sa ville à lui.\n@c1@"
  it: "@a@b*: E ora anche il suo apprendista, John Dwayne Jr., è partito per fondare il proprio villaggio.\n@c1@"
  ja: "@a@b＊「ヒルタン老人の弟子\n\tホフマンという方もまた\n\t自分の町を作るため旅立ちました。\n@c1@"
"39":
  de: "@a@b*: Ich werde die Göttin bitten, dass er genauso erfolgreich wird wie Gotthilf Dämler.\n@c1@"
  en: "@a@b*: I'll be prayin' to the Goddess for 'im that 'e's as successful as old 'Ilton was 'ere.\n@c1@"
  es: "@a@b*: Rezaré a la Diosa para que le vaya tan bien como le fue al viejo Gilton aquí.\n@c1@"
  fr: "@a@b*ⓢ Je vais prier la Déesse pour qu'il fasse aussi bien que le vieux Ilton ici.\n@c1@"
  it: "@a@b*: Pregherò la dea affinché abbia lo stesso successo ottenuto dal buon vecchio Etchelsior!\n@c1@"
  ja: "@a@b＊「ホフマンさんの町も\n\tミントスのように栄えることを\n\tお祈りしていますわ。\n@c1@"
"40":
  de: "@a@b*: Die Mutterkrautwurzeln heilen jede Krankheit, die es nur gibt, aber sie schmecken zum ⓚⓛ äh, also nicht so besonders.\n@c1@"
  en: "@a@b*: Them feverfew roots can cure any illness under the sun, but they taste likeⓚⓛ Er, they're not very nice.\n@c1@"
  es: "@a@b*: Las raíces reducefiebre pueden curar cualquier enfermedad, pero saben a... Bueno, están asquerosas.\n@c1@"
  fr: "@a@b*ⓢ Les racines de camomille peuvent guérir n'importe quelle maladie, mais elles ont un goût de... euh, elles n'ont pas très bon goût.\n@c1@"
  it: "@a@b*: Le Radici di parthenio possono curare qualsiasi malattia, ma fanno davvero schi... Cioè, voglio dire, non hanno un buon sapore.\n@c1@"
  ja: "@a@b＊「パデキアの根っこって\n\tどんな病気も治るんだけど\n\tとーっても　にがくてマズいんだ！\n@c1@"
"41":
  de: "@a@b*: Ich werd jedenfalls nicht so schnell wieder krank werden, aber echt!\n@c1@"
  en: "@a@b*: I'm gonna make sure I don't get ill again, I'll tell ya that for nuffin'!\n@c1@"
  es: "@a@b*: ¡Me aseguraré de no volver a caer enfermo pero fijo!\n@c1@"
  fr: "@a@b*ⓢ Je vais faire en sorte de ne jamais retomber malade, je peux vous le direⓠ\n@c1@"
  it: "@a@b*: Sarò attentissimo a non ribeccarmi nessun malanno, altroché!\n@c1@"
  ja: "@a@b＊「だから　ぼく\n\tもう　病気をしないように\n\t気をつけてるの！\n@c1@"
"42":
  de: "@a@b*: Hoffentlich Papa kommt heute Abend nach Hause, bevor ich ins Bett muss.\n@c1@"
  en: "@a@b*: I 'ope Dad an' everyone gets 'ome before my bed time tonight.\n@c1@"
  es: "@a@b*: Espero que mi viejo y los otros lleguen hoy a casa antes de la hora de dormir.\n@c1@"
  fr: "@a@b*ⓢ J'espère que p'pa et tous les autres seront rentrés avant que j'aille me coucher, ce soir.\n@c1@"
  it: "@a@b*: Spero che stanotte mio padre e gli altri tornino a casa prima che io vada a letto.\n@c1@"
  ja: "@a@b＊「今日は　お父さんたち\n\tはやく帰ってくるといいなあ。\n@c1@"
"43":
  de: "@a@b*: Ich hab mich auch mal an der Prüfung des alten Dämler versucht, wisst Ihr.\n@c2@"
  en: "@a@b*: I 'ad a bash at old 'Ilton's test, y'know.\n@c2@"
  es: "@a@b*: Probé suerte con el enigma de Gilton.\n@c2@"
  fr: "@a@b*ⓢ J'ai essayé de passer le test d'Ilton, vous savez.\n@c2@"
  it: "@a@b*: Anch'io ho provato a fare il test di Jolly Etchelsior.\n@c2@"
  ja: "@a@b＊「わたしも　ヒルタン老人の試験を\n\t受けたのですが……。\n@c2@"
"44":
  de: "@a@b*: Aber die Antwort hab ich immer noch nicht raus. Dabei hätte ich die Schatzkarte so gern gehabt.\n@c2@"
  en: "@a@b*: I still ain't figured out the answer, though.\nI really wanted that treasure map, an' all.\n@c2@"
  es: "@a@b*: Ni idea, todavía no sé la respuesta.\nY quería el mapa, en serio, jo.\n@c2@"
  fr: "@a@b*ⓢ Mais je n'ai toujours pas trouvé la réponse.\nPourtant, je la voulais vraiment, cette carte au trésor.\n@c2@"
  it: "@a@b*: Ma non ho ancora capito quale sia la risposta corretta. Peccato... Ci tenevo tanto ad avere quella mappa del tesoro.\n@c2@"
  ja: "@a@b＊「あー！\n\tいまだに　答えがわからない！\n\t宝の地図が　欲しかったのに！\n@c2@"
"45":
  de: "@a@b*: Ihr sucht nach Hoffman?\nDer ist nicht mehr hier.\n@c2@"
  en: "@a@b*: You're lookin' for Hoffman?\nThat guy's outta here.\n@c2@"
  es: "@a@b*: ¿Buscando a Juanchito?\nEse tipo se largó de aquí.\n@c2@"
  fr: "@a@b*ⓢ Vous cherchez Hoffmanⓡ\nIl est plus dans le coin.\n@c2@"
  it: "@a@b*: %H860%XStai%YState%Z cercando John Dwayne Jr.?\nHa levato le tende.\n@c2@"
  ja: "@a@b＊「前にこの宿にいた　ホフマン？\n\tああ　あいつなら出てったよ。\n@c2@"
"46":
  de: "@a@b*: Gotthilf Dämler meinte, es sei Zeit, dass er seinen eigenen Weg ginge, denn er hätte ihm jetzt alles beigebracht, was er wüsste.\n@c2@"
  en: "@a@b*: Conrad Ilton told him to go off an' make his own way because he'd taught him all there is to know.\n@c2@"
  es: "@a@b*: Conrad Gilton le dijo que fuese a encontrar su propio camino porque ya le había enseñado todo lo que se puede enseñar.\n@c2@"
  fr: "@a@b*ⓢ Conrad Ilton lui a dit qu'il pouvait partir et se lancer parce qu'il avait plus rien à lui apprendre.\n@c2@"
  it: "@a@b*: Visto che Jolly Etchelsior riteneva di non avere più nulla da insegnargli, gli ha detto che era arrivato il momento di andare per la sua strada.\n@c2@"
  ja: "@a@b＊「もう　教えることはないから\n\t自分の道を進めって\n\tヒルタン老人に　言われたんだ。\n@c2@"
"47":
  de: "@a@b*: Dieser Kerl, der vorher hier war, dieser Ragnar Rauhbein, war auch auf der Suche nach %A090%Xeinem Helden%Z%B090%Xeiner Heldin%Z.\n@c2@"
  en: "@a@b*: That chap who was staying here before, Ragnar McRyan, said something about how he was looking for a %A090%Xhero%Z%B090%Xheroine%Z.\n@c2@"
  es: "@a@b*: El tipo ese que pasó por aquí, Ragnar McRyan, dijo no sé qué de que estaba buscando a %A090%Xun héroe%Z%B090%Xuna heroína%Z.\n@c2@"
  fr: "@a@b*ⓢ L'homme qui logeait ici il y a quelque temps, Ragnar McRyan, a mentionné qu'il était à la recherche d'%A090%Xun héros%Z%B090%Xune héroïne%Z.\n@c2@"
  it: "@a@b*: Quel tizio che era qui prima, Galiardo de' Guglielmi, diceva che stava cercando %A090%Xun eroe%Z%B090%Xun'eroina%Z.\n@c2@"
  ja: "@a@b＊「以前　この宿に泊まった\n\tライアンという戦士が\n\t勇者さまを　さがしていたのです。\n@c2@"
"48":
  de: "@a@b*: Wenn ich mich nicht irre, wollte er zum Palais de Léon weit im Westen, in Libeccio.\n@c2@"
  en: "@a@b*: If my memory serves me correctly, he was off to the Palais de Léon, way over in Libeccio to the west.\n@c2@"
  es: "@a@b*: Yo creo que dijo algo de que se dirigía al Palais de Léon ese, en Leveche, hacia el oeste.\n@c2@"
  fr: "@a@b*ⓢ Si ma mémoire est bonne, il se dirigeait vers le palais de Lord Lionel, loin à l'ouest d'ici, sur le Libeccio.\n@c2@"
  it: "@a@b*: Se la memoria non m'inganna, è partito per il Palazzo de Léon, che si trova nel continente di Lybeccio, a ovest di qui.\n@c2@"
  ja: "@a@b＊「たしか　ライアンどのは\n\tはるか西の国　キングレオに行くと\n\t申しておりました……。\n@c2@"
"49":
  de: "@a@b*: Hah... Hah... Haaaah...\n@c2@"
  en: "@a@b*: Ah... Ah... Aaaaah...\n@c2@"
  es: "@a@b*: Ah... Ah... Aaaaah...\n@c2@"
  fr: "@a@b*ⓢ Ah... Ah... Aaaaah...\n@c2@"
  it: "@a@b*: Ah... Aaah... Aaaaah...\n@c2@"
  ja: "@a@b＊「はっはっはっ……\n@c2@"
"50":
  de: "@a@b*: Ha-tschi! Es ist ja doch recht kühl heute Abend, nicht wahr? Doch lasst mich Euch herzlich in Mintos willkommen heißen!\n@c2@"
  en: "@a@b*: Ah-chew! It's a bit chilly of a night, eh?\nStill, welcome to Mintos an' all that.\n@c2@"
  es: "@a@b*: ¡Achús! Hace un frío que pela esta noche, ¿eh?\nDe todos modos, %H860%X%A120%Xbienvenido%Z%B120%Xbienvenida%Z%Y%R000%Xbienvenidas%Ybienvenidos%Z%Z a Mintos y todo eso.\n@c2@"
  fr: "@a@b*ⓢ Atchoumⓠ La nuit est drôlement fraîche, nonⓡ\nEnfin, bienvenue à Ringys quand même.\n@c2@"
  it: "@a@b*: Etciù! Fa un po' fresco stasera, eh?\nComunque, caldo o freddo che sia, %H860%X%A120%Xsei il benvenuto%Z%B120%Xsei la benvenuta%Z%Y%R000%Xsiete le benvenute%Ysiete i benvenuti%Z%Z a Mintos.\n@c2@"
  ja: "@a@b＊「はっくしょん！\n\t夜は　冷えこむなあ。\n\tここは　ミントスの町だよ。\n@c2@"
"51":
  de: "@a@b*: Was? Hm, muss wohl eingeschlafen sein. Bei dem Vortrag des Alten kommen die Schäfchen schon von allein an, um sich zählen zu lassen.\n@c3@"
  en: "@a@b*: Huh? Looks like I must've been asleep. That old man's lecturin' is enough to start anyone off countin' sheep.\n@c3@"
  es: "@a@b*: ¿Eh? Debe de haber sido un sueño.\nEse vejete hablando es más que suficiente para hacer que acabes contando ovejas.\n@c3@"
  fr: "@a@b*ⓢ Heinⓡ J'ai dû m'endormir.\nLes discours de c'vieux bonhomme pourraient faire ronfler n'importe qui.\n@c3@"
  it: "@a@b*: Eh? Devo essermi addormentato.\nAssistere alla conferenza di quel vecchio è come ascoltare una ninnananna. Che noiaaa!\n@c3@"
  ja: "@a@b＊「ありゃ？　眠っちまったようだな。\n\tあのじいさんの話は\n\t眠くなっていけねえや。\n@c3@"
"52":
  de: "@a@b*: Schätze, es ist sinnlos, dagegen ankämpfen zu wollen. Zeit für ein Nickerchen! Nacht allerseits..\n@c3@"
  en: "@a@b*: Well, ain't no use in fightin' it, I s'pose.\nKip time! Night, night.\n@c3@"
  es: "@a@b*: Bueno, supongo que no sirve de nada luchar.\n¡Hora de la siesta! Buenas noches.\n@c3@"
  fr: "@a@b*ⓢ Enfin, ça sert à rien d'lutter.\nC'est l'heure d'roupillerⓠ Bonne nuit.\n@c3@"
  it: "@a@b*: Non ci riesco, è inutile resistere.\nSchiaccio un pisolino! Buonanotte.\n@c3@"
  ja: "@a@b＊「しかたねえ\n\tもう　ひと眠りすっか！\n\tほんじゃ　おやすみ！\n@c3@"
"53":
  de: "@a@b*: Gefällt Euch diese Blume? Dann schenke ich sie Euch. Um zu zeigen, wie sehr ich Euch schätze.\n@c3@"
  en: "@a@b*: If this flower does anythin' for ya, why don't you 'ave it? As a symbol of me feelings an' all that.\n@c3@"
  es: "@a@b*: Si esta flor te conviene, quédatela, por favor. Como símbolo de mis sentimientos y esas cosas.\n@c3@"
  fr: "@a@b*ⓢ Si cette fleur vous plaît, pourquoi ne pas la prendreⓡ En tant que symbole de mes sentiments pour vous, et tout et tout.\n@c3@"
  it: "@a@b*: Se questo fiore %H860%Xti%Yvi%Z piace tanto, perché non lo %H860%Xprendi%Yprendete%Z?\n%H860%XConsideralo%YConsideratelo%Z un gesto di gentilezza.\n@c3@"
  ja: "@a@b＊「こ　この花　よろしければ\n\tうけとって　くださいっ！\n\t私の気持ちです！\n@c3@"
"54":
  de: "@a@b*: Bitte, mein Sohn, kein Wort mehr.\nMein Leben ist der Göttin geweiht.\n@c1@"
  en: "@a@b*: Please, my child, say no more.\nI am promised to the Goddess.\n@c1@"
  es: "@a@b*: Por favor, hijo mío, no digas nada más.\nEstoy prometida a la Diosa.\n@c1@"
  fr: "@a@b*ⓢ Je vous en prie, mon enfant, n'en dites pas plus.\nJe suis promise à la Déesse.\n@c1@"
  it: "@a@b*: Ti scongiuro, non dire più nulla.\nLa mia vita appartiene alla dea.\n@c1@"
  ja: "@a@b＊「いけませんわ。\n\t私は　神に仕える身。\n\t……ぽっ。\n@c1@"
"55":
  de: "@aGotthilf Dämler@bWenn Ihr den Hoffman sucht, der isch scho weg.\n@c2@"
  en: "@aConrad 'Ilton@bIf you're lookin' for 'Offman, you've come to the wrong place.\n@c2@"
  es: "@aConrad Gilton@bSi %H860%Xandas buscando%Yandáis buscando%Z a Juanchito, %H860%Xte has confundido%Yos habéis confundido%Z de sitio.\n@c2@"
  fr: "@aConrad Ilton@bSi c'est Hoffman que vous cherchez, vous ne le trouverez pas ici.\n@c2@"
  it: "@aJolly Etchelsior@bSe %H860%Xstai%Ystate%Z cercando John Dwayne, allora %H860%Xsei%Ysiete%Z nel posto sbagliato.\n@c2@"
  ja: "@a@bヒルタン「ホフマンなら\n\tこの町を　出て行ったぞ。\n@c2@"
"56":
  de: "@aGotthilf Dämler@bI kann dem Kerle nix mehr beibringe, no hab i en fortg'schickt.\n@c2@"
  en: "@aConrad 'Ilton@bI ain't got nothin' more to teach the lad, so I told 'im to be off.\n@c2@"
  es: "@aConrad Gilton@bNo tenía nada más que enseñarle al chaval, así que le dije que se fuera a otro sitio.\n@c2@"
  fr: "@aConrad Ilton@bJe lui ai appris tout c'que j'savais.\nAlors j'lui ai suggéré de partir.\n@c2@"
  it: "@aJolly Etchelsior@bNon ho più niente da insegnargli, quindi gli ho detto di andare per la sua strada.\n@c2@"
