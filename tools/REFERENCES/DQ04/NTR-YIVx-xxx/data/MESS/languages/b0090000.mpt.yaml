"17":
  de: "@aGotthilf Dämler@bDes hätt i selbst gar net besser sage könne! So isch's! Schwätze isch Silber, Schweigen isch Gold, so secht mer's doch!\n@c2@"
  en: "@aConrad 'Ilton@bI couldn't 'ave said it better meself.\nYou're right! Silence is golden, as they say.\n@c2@"
  es: "@aConrad Gilton@bYo no lo habría dicho mejor. ¡Correcto! El silencio es oro, como se suele decir.\n@c2@"
  fr: "@aConrad Ilton@bJe n'aurais pas dit mieux moi-même.\nVous avez raisonⓠ Le silence est d'or, comme on dit.\n@c2@"
  it: "@aJolly Etchelsior@bNon avrei saputo rispondere meglio. %H860%XHai%YAvete%Z proprio ragione! Com'è che si dice? Il silenzio è d'oro!\n@c2@"
  ja: "@a@bヒルタン「むむっ！　あっぱれ！\n\tなにも言わない……。　つまり！\n\t沈黙は　金　なりじゃ！\n@c2@"
