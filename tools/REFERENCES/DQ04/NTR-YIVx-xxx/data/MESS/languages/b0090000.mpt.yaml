"0":
  de: "@a@b*: Alles klar? Willkommen in Mintos!\n@c1@"
  en: "@a@b*: Awright? Welcome to Mintos!\n@c1@"
  es: "@a@b*: ¿Qué tal? %H860%X%A120%XBienvenido%Z%B120%XBienvenida%Z%Y%R000%XBienvenidas%YBienvenidos%Z%Z a Mintos.\n@c1@"
  fr: "@a@b*ⓢ Ça vaⓡ Bienvenue à Ringysⓠ\n@c1@"
  it: "@a@b*: Salve! Questa è Mintos!\n@c1@"
  ja: "@a@b＊「ここは　ミントスの町。\n@c1@"
"1":
  de: "@a@b*: Ihr seid doch sicher da, um den berühmten Gotthilf Dämler zu sehen, oder?\n@c1@"
  en: "@a@b*: No doubt you're 'ere to see the famous Conrad 'Ilton, eh?\n@c1@"
  es: "@a@b*: Seguro que %H860%Xhas%Yhabéis%Z venido para ver al famoso Conrad Gilton ese.\n@c1@"
  fr: "@a@b*ⓢ Vous êtes sûrement là pour voir le célèbre Conrad Ilton, nonⓡ\n@c1@"
  it: "@a@b*: Sicuramente %H860%Xsei%Ysiete%Z qui per incontrare il famoso Jolly Etchelsior, eh?\n@c1@"
  ja: "@a@b＊「商売をする者にとっては\n\tあこがれの　ヒルタン老人が\n\tいる町ですわ。\n@c1@"
"2":
  de: "@a@b*: Die Leute kommen aus der ganzen Welt, um seine Vorträge zu hören. Er ist das Idol der Händler.\n@c1@"
  en: "@a@b*: People come from all over the world to 'ear 'im lecture. He's the 'ero of traders ev'rywhere.\n@c1@"
  es: "@a@b*: Llega gente de todos lados para oírle dar sus charlas. Es el héroe de los comerciantes de todo el mundo.\n@c1@"
  fr: "@a@b*ⓢ Des gens viennent du monde entier pour écouter ses conférences. C'est le héros d'tous les commerçants, partout dans l'monde.\n@c1@"
  it: "@a@b*: Viene gente da tutto il mondo per ascoltare le sue conferenze. È l'esempio a cui si ispirano tutti coloro che vogliono diventare uomini d'affari di successo.\n@c1@"
  ja: "@a@b＊「さまざまな人たちが\n\tヒルタン老人の話を聞くため\n\tこの町を　訪れるのです。\n@c1@"
"3":
  de: "@a@b*: Wenn Ihr 'n nettes Zimmer sucht, seid Ihr hier goldrichtig!\n@c2@"
  en: "@a@b*: If you're lookin' for a room, you've come to the right place!\n@c2@"
  es: "@a@b*: Si %H860%Xbuscas%Ybuscáis%Z un sitio donde planchar la oreja, %H860%Xestás%Yestáis%Z en el lugar perfecto.\n@c2@"
  fr: "@a@b*ⓢ Si vous cherchez une chambre, vous êtes au bon endroitⓠ\n@c2@"
  it: "@a@b*: Se %H860%Xcerchi%Ycercate%Z una stanza, %H860%Xsei%Ysiete%Z nel posto giusto!\n@c2@"
  ja: "@a@b＊「いらっしゃいませ！\n\tお泊りは　こちらでどうぞ！\n@c2@"
"4":
  de: "@a@b*: Das beste Zimmer in der Stadt ist noch frei, und es wartet schon auf Euch!\n@c2@"
  en: "@a@b*: The best room in town is vacant tonight, an' it's got your name on it!\n@c2@"
  es: "@a@b*: La mejor habitación de la ciudad está libre esta noche, ¡y tiene %H860%Xtu%Yvuestro%Z nombre!\n@c2@"
  fr: "@a@b*ⓢ La meilleure chambre d'la ville est libre ce soir, et votre nom est déjà dessusⓠ\n@c2@"
  it: "@a@b*: La miglior stanza del villaggio è libera per stanotte... Allora, la %H860%Xvuoi%Yvolete%Z?\n@c2@"
  ja: "@a@b＊「本日は　良いお部屋が\n\tあいていますよ！\n@c2@"
"5":
  de: "@a@b*: Miau.\n@c1@"
  en: "@a@b*: Meow.\n@c1@"
  es: "@a@b*: Miau.\n@c1@"
  fr: "@a@b*ⓢ Miaou.\n@c1@"
  it: "@a@b*: Miao.\n@c1@"
  ja: "@a@b＊「みゃう　みゃう。\n@c1@"
"6":
  de: "@a@b*: Gotthilf Dämler war mal 'n Abenteurer.\n@c2@"
  en: "@a@b*: Conrad 'Ilton used to be an adventurer back in 'is day.\n@c2@"
  es: "@a@b*: Conrad Gilton era todo un aventurero de joven y tal.\n@c2@"
  fr: "@a@b*ⓢ Conrad Ilton était un aventurier, dans sa jeunesse.\n@c2@"
  it: "@a@b*: In passato, Jolly Etchelsior è stato un avventuriero.\n@c2@"
  ja: "@a@b＊「ヒルタン老人は　若い頃\n\t冒険家だったそうです。\n@c2@"
"7":
  de: "@a@b*: Er hat Schätze gesammelt und verkauft und damit ein Vermögen gemacht. Ich schätze, er ist der beste Geschäftsmann der ganzen Welt.\n@c2@"
  en: "@a@b*: He collected all sorts o' treasures, an' then made a fortune by sellin' 'em off. He's the best businessman in the world, I reckon.\n@c2@"
  es: "@a@b*: Conseguía todo tipo de tesoros y se volvió rico revendiéndolos. Es el mejor mercader del mundo mundial.\n@c2@"
  fr: "@a@b*ⓢ Il a amassé toutes sortes de trésors et a ensuite fait fortune en les revendant. Croyez-moi, c'est le meilleur homme d'affaires du monde.\n@c2@"
  it: "@a@b*: Raccoglieva tesori di ogni tipo, e ha costruito la sua fortuna rivendendoli a caro prezzo. Non c'è dubbio che sia il miglior affarista del mondo.\n@c2@"
  ja: "@a@b＊「いろんな宝物を　手に入れて\n\tそれを元手に商売をして\n\t大成功を　おさめたとか。\n@c2@"
"8":
  de: "@a@b*: Ha-püh...\n@c3@"
  en: "@a@b*: Ah-phew...\n@c3@"
  es: "@a@b*: Ah, fiuu...\n@c3@"
  fr: "@a@b*ⓢ Ron-pfff...\n@c3@"
  it: "@a@b*: Ah-phew...\n@c3@"
  ja: "@a@b＊「ぐごー　ぐごー。\n@c3@"
"9":
  de: "@aGotthilf Dämler@bWas? Ob i der Kerle bin, der wo elles übers Meer weiß?\n@c2@"
  en: "@aConrad 'Ilton@bY'wot? You wanna ask if I'm the geezer who knows a lot about the ocean?\n@c2@"
  es: "@aConrad Gilton@b¿Qué %H860%Xquieres%Yqueréis%Z? ¿%H860%XQuieres%YQueréis%Z saber si soy el vejete que lo sabe todo del océano?\n@c2@"
  fr: "@aConrad Ilton@bQuoiⓡ Vous voulez savoir si c'est moi le type qui sait plein de choses sur l'océanⓡ\n@c2@"
  it: "@aJolly Etchelsior@bCome? %H860%XVuoi%YVolete%Z sapere se sono io il tipo che sa un sacco di cose sull'oceano?\n@c2@"
  ja: "@a@bヒルタン「なに？\n\t海にくわしい老人とは\n\tわしのことか　じゃと？\n@c2@"
"10":
  de: "@aGotthilf Dämler@bNa so en Grasdackel! Dees isch a Frage! Net nur elles übers Meer. I weiß auch sonschd elles, was es z'wisse gibt!\n@c2@"
  en: "@aConrad 'Ilton@bYou muppet! I don't only know about the ocean.\nI know ev'ryfin there is to know about ev'ryfin!\n@c2@"
  es: "@aConrad Gilton@b¡%H860%X%A120%XPringado%Z%B120%XPringada%Z%Y%R000%XPringadas%YPringados%Z%Z! No solo lo sé todo del océano.\nSé todo lo que hay que saber sobre todo.\n@c2@"
  fr: "@aConrad Ilton@bPauvre %A120%Xnaïf%Z%B120%Xnaïve%Zⓠ Je ne connais pas seulement l'océan.\nJe sais tout sur toutⓠ\n@c2@"
  it: "@aJolly Etchelsior@bMa che domanda è?! Io non so un sacco di cose solo sull'oceano. Io so tutto di tutto! Sono una vera enciclopedia ambulante!\n@c2@"
  ja: "@a@bヒルタン「ばか者！\n\tわしは　海だけじゃなく\n\t世界のことに　くわしいのじゃ。\n@c2@"
"11":
  de: "@aGotthilf Dämler@bI han koi Zeit für so a saudomm's G'schwätz. No studiert a weng mit Fleiß und kommt wieder, wenn Ihr's besser wisst.\n@c2@"
  en: "@aConrad 'Ilton@bI ain't got time for lightweights.\nDo yer homework properly next time before you start askin' questions.\n@c2@"
  es: "@aConrad Gilton@bNo tengo tiempo para pardillos.\nHala, para la próxima %H860%Xestudia%Yestudiad%Z antes de hacer preguntas.\n@c2@"
  fr: "@aConrad Ilton@bJe n'ai pas de temps à perdre avec les petits rigolos.\n Faites votre travail correctement la prochaine fois, avant de poser des questions.\n@c2@"
  it: "@aJolly Etchelsior@bNon ho tempo da perdere con i pesi piuma, io.\nLa prossima volta %H860%Xpensaci%Ypensateci%Z bene, prima di venirmi a fare domande stupide!\n@c2@"
  ja: "@a@bヒルタン「人を　たずねるときは\n\tちゃんと　調べてくるのだな。\n\t出直してまいれ！\n@c2@"
"12":
  de: "@aGotthilf Dämler@bNet schlecht, die Antwort. I weiß net nur übers Meer B'scheid. I weiß elles, was es z'wisse gibt.\n@c2@"
  en: "@aConrad 'Ilton@bNice answer. Yep, I don't only know about the ocean. I know ev'ryfin there is to know about ev'ryfin!\n@c2@"
  es: "@aConrad Gilton@bBuena respuesta. Sí, no soy el vejete que lo sabe todo sobre el óceano, soy el vejete que sabe todo lo que hay que saber sobre todo.\n@c2@"
  fr: "@aConrad Ilton@bJolie réponse. Oui, non seulement je connais l'océan, mais je sais tout sur toutⓠ\n@c2@"
  it: "@aJolly Etchelsior@bBella risposta.\nIo non so un sacco di cose solo sull'oceano. Io so tutto di tutto! Sono una vera enciclopedia ambulante!\n@c2@"
  ja: "@a@bヒルタン「ほほう。　よくわかったな。\n\tわしは　海だけじゃなく\n\t世界のことに　くわしいのじゃ。\n@c2@"
"13":
  de: "@aGotthilf Dämler@bI bin der Gotthilf Dämler. I tät sage, aus Euch könnt mer vielleicht no was mache, %A120%XKerle%Z%B120%XMädle%Z.\n@c2@"
  en: "@aConrad 'Ilton@bThe name's Conrad 'Ilton.\nThat's 'Ilton wiv an haitch.\nI'd say you've got promise, %A120%Xson%Z%B120%Xgirl%Z.\n@c2@"
  es: "@aConrad Gilton@bEl nombre es Conrad Gilton.\nCon g de jamón.\n%H860%XPareces %A120%Xprometedor%Z%B120%Xprometedora%Z%YParecéis %R000%Xprometedoras%Yprometedores%Z%Z, %H860%X%A120%Xchaval%Z%B120%Xchavala%Z%Y%R000%Xchavalas%Ychavales%Z%Z.\n@c2@"
  fr: "@aConrad Ilton@bJe m'appelle Conrad Ilton.\nAttention à bien l'épeler, hein.\nVous m'avez l'air %A120%Xprometteur, mon garçon%Z%B120%Xprometteuse, jeune fille%Z.\n@c2@"
  it: "@aJolly Etchelsior@bMi chiamo Jolly Etchelsior.\nJolly, perché sono perfetto in qualsiasi situazione.\nE direi che tu prometti bene, %A120%Xragazzo%Z%B120%Xragazza%Z.\n@c2@"
  ja: "@a@bヒルタン「そなた　少しは\n\tほねが　ありそうじゃな。\n@c2@"
"14":
  de: "@aGotthilf Dämler@bNo wellet Ihr's wisse? Wellet Ihr meinen kleinen Teschd ablege?\n@c2@"
  en: "@aConrad 'Ilton@bSo... Reckon you're game?\nWanna 'ave a bash at my little test?\n@c2@"
  es: "@aConrad Gilton@bEntonces... ¿%H860%XTe%YOs%Z gusta jugar duro?\n¿%H860%XTe atreves a enfrentarte%YOs atrevéis a enfrentaros%Z a mi dilema?\n@c2@"
  fr: "@aConrad Ilton@bAlors... je parie que vous êtes %A120%Xjoueur%Z%B120%Xjoueuse%Zⓠ\nVous voulez vous essayer à mon petit testⓡ\n@c2@"
  it: "@aJolly Etchelsior@bAllora, che ne %H860%Xdici%Ydite%Z?\n%H860%XTe la senti%YVe la sentite%Z di fare un piccolo test?\n@c2@"
  ja: "@a@bヒルタン「どうじゃ？\n\tわしの試験を　受けてみるか？\n@c2@"
"15":
  de: "@aGotthilf Dämler@bHa no! Na, denn isch hier die Frage: Was ischt des Wichtigschte beim G'schäft?\n@c2@"
  en: "@aConrad 'Ilton@bNice! Here's the question... Wot's the single most important thing when it comes to business?\n@c2@"
  es: "@aConrad Gilton@b¡Genial! Ahí va la pregunta... ¿Qué es lo más importante en los negocios?\n@c2@"
  fr: "@aConrad Ilton@bBienⓠ Voici la question... Quelle est la chose la plus importante dans le domaine des affairesⓡ\n@c2@"
  it: "@aJolly Etchelsior@bBenissimo! Ecco la domanda... Cos'è che conta di più negli affari?\n@c2@"
  ja: "@a@bヒルタン「では　問題じゃ！\n\t商売において\n\t一番大切なこと　とは何か？\n@c2@"
"16":
  de: "@a%0%a00140@b...?\n@c0@"
  en: "@a %0%a00140@b...?\n@c0@"
  es: "@a%0%a00140@b¿...?\n@c0@"
