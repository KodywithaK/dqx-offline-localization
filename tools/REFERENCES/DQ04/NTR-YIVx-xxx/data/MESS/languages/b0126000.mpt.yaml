"0":
  de: "@a@bEine magische Barriere versperrt den Weg!\n@c0@"
  en: "@a@bYour path is blocked by some sort of magical barrier!\n@c0@"
  es: "@a@b¡El camino se encuentra bloqueado por una especie de barrera mágica!\n@c0@"
  fr: "@a@bLe chemin est bloqué par une sorte de barrière magiqueⓠ\n@c0@"
  it: "@a@bIl sentiero che %H860%Xstai%Ystate%Z percorrendo è bloccato da una barriera magica!\n@c0@"
  ja: "@a@b結界に　はばまれて　進めない！\n@c0@"
"1":
  de: "@a@b*: Ihr seid so weit gekommen, aber nun ist Eurer Weg zu Ende. Jetzt müsst Ihr mir Rede und Antwort stehen.\n@c3@"
  en: "@a@b*: You have come a long way, but this is where your journey ends. Now you have me to answer to.\n@c3@"
  es: "@a@b*: El camino ha sido largo, pero aquí acaba el viaje. Ahora %H860%Xtienes%Ytenéis%Z que responder ante mí.\n@c3@"
  fr: "@a@b*ⓢ Vous avez parcouru un long chemin, mais votre voyage s'arrête là. Car maintenant, c'est moi que vous allez devoir affronter.\n@c3@"
  it: "@a@b*: Ne %H860%Xhai%Yavete%Z fatta di strada, ma il %H860%Xtuo%Yvostro%Z viaggio si conclude qui. Ora %H860%Xdovrai%Ydovrete%Z affrontare me!\n@c3@"
  ja: "@a@b＊「よくぞ　ここまで　たどり着いた！\n\t敵ながら　あっぱれなやつ！\n@c3@"
"2":
  de: "@a@b*: Aber erst möchte ich Euch für Eure Leistungen belohnen. Seht Euch einmal in der Mitte des Raumes um.\n@c3@"
  en: "@a@b*: But first I will give you a reward for your efforts. Have a good look around the middle of the room.\n@c3@"
  es: "@a@b*: Aunque, primero, %H860%Xte%Yos%Z recompensaré por los esfuerzos realizados. %H860%XMira%YMirad%Z más detenidamente el centro de la habitación.\n@c3@"
  fr: "@a@b*ⓢ Avant tout, j'aimerais vous récompenser pour vos efforts. Regardez attentivement au centre de la pièce.\n@c3@"
  it: "@a@b*: Ma voglio prima %H860%Xdarti%Ydarvi%Z una ricompensa per gli sforzi compiuti. %H860%XGuarda%YGuardate%Z attentamente il centro della stanza.\n@c3@"
  ja: "@a@b＊「そうじゃ　ほうびをやろう。\n\t部屋の　真ん中あたりを\n\t調べてみるがよい。\n@c3@"
"3":
  de: "@a@b*: Ha ha ha! Dreh deinem Feind nie den Rücken zu! Das weiß doch jedes Kind!\n@c3@"
  en: "@a@b*: Ka ka ka! You should never turn your back on the enemy, you fool!\n@c3@"
  es: "@a@b*: ¡Ja, ja, ja! ¡Nunca hay que volver la espalda al enemigo, %H860%X%A120%Xnecio%Z%B120%Xnecia%Z%Y%R000%Xnecias%Ynecios%Z%Z!\n@c3@"
  fr: "@a@b*ⓢ Kra kra kraⓠ Il ne faut jamais tourner le dos à son adversaire, imbécileⓠ\n@c3@"
  it: "@a@b*: Ka ka ka!\n%H860%XIdiota%YIdioti%Z! Non si dovrebbero mai voltare le spalle al nemico!\n@c3@"
  ja: "@a@b＊「けけけっ！\n\t敵に　背中を見せるとは\n\tおろか者めっ！\n@c3@"
"4":
  de: "@a@b*: Ha ha ha! Ich hätte Euch schmerzfrei sterben lassen, wenn Ihr auf mich gehört hättet.\n@c3@"
  en: "@a@b*: Ka ka ka! I could have let you die without pain if only you had listened to me.\n@c3@"
  es: "@a@b*: ¡Ja, ja, ja! %H860%XPodrías%YPodríais%Z haber tenido una muerte indolora si me %H860%Xhubieras%Yhubierais%Z escuchado.\n@c3@"
  fr: "@a@b*ⓢ Kra kra kraⓠ J'aurais pu vous tuer sans vous faire souffrir si vous m'aviez écouté.\n@c3@"
  it: "@a@b*: Ka ka ka! Se mi %H860%Xavessi%Yaveste%Z dato ascolto, avrei potuto %H860%Xucciderti senza farti%Yuccidervi senza farvi%Z soffrire!\n@c3@"
  ja: "@a@b＊「けけけっ！\n\tすなおに　引っかかっていれば\n\t楽に　死なせてやったものを！\n@c3@"
"5":
  de: "@aPruslas@bN-Nein... Aaahh!\n@c3@"
  en: "@aPruslas@bN-No... Kargh!\n@c3@"
  es: "@aPruslas@bNooo... ¡Argh!\n@c3@"
  fr: "@aPruslas@bN... Non... Kraaarghⓠ\n@c3@"
  it: "@aPruslas@bN-No... Argh!\n@c3@"
