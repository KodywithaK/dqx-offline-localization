"31":
  de: "@a@b*: Ein Freund von mir, Torneko Talun, hat kürzlich ein Geschäft in Endor eröffnet. Ich bin auf dem Weg dorthin, um ihm zu gratulieren.\n@c2@"
  en: "@a@b*: I've a friend by the name of Mr. Taloon who's finally opened up a shop in Endor. I'm on my way to congratulate him.\n@c2@"
  es: "@a@b*: Tengo un amigo llamado Taloon que al fin ha conseguido abrir una tienda en Endor. Viajo para felicitarle.\n@c2@"
  fr: "@a@b*ⓢ Un de mes amis a ouvert un magasin à Chandor.\nIl s'appelle Monsieur Taloon.\nJe vais le féliciter sur place.\n@c2@"
  it: "@a@b*: Ho un amico di nome Baldo Baldini che ha aperto un negozio a Endor. Sto andando a congratularmi con lui.\n@c2@"
  ja: "@a@b＊「私の知り合いの　トルネコというのが\n\tエンドールで　お店を出したんで\n\tそのお祝いに　行くところです。\n@c2@"
"32":
  de: "@a@b*: Warum wir noch nicht abgelegt haben? So schnell geht das nicht. Auf einem Schiff gibt's 'ne Menge zu tun.\n@c0@"
  en: "@a@b*: Why ain't we left yet, ya say?\nYa can't rush these things.\nThere's a lot to do on a ship.\n@c0@"
  es: "@a@b*: ¿Que por qué no hemos partido aún?\nEstas cosas hay que tiomarlas con calma.\nEn un barco siempre hay mucho que hacier.\n@c0@"
  fr: "@a@b*ⓢ Pourquoi on n'a pas encore levé l'ancreⓡ\nOn ne peut pas aller plus vite que la musique, hein.\nIl y a plein de choses à faire sur un bateau.\n@c0@"
  it: "@a@b*: %H860%XVuoi%YVolete%Z sapere perché non siamo ancora partiti? Beh, le cose vanno fatte con calma! %H860%XHai%YAvete%Z idea di quanto lavoro ci sia da fare su una nave?\n@c0@"
  ja: "@a@b＊「まだ　船は出ないのかって？\n\tまあ　そう　あせりなさんな。\n@c0@"
"33":
  de: "@a@b*: %H860%XUnterhalte dich%YUnterhaltet euch%Z mit den anderen Passagieren oder %H860%Xnerv%Ynervt%Z den Kapitän.\n@c0@"
