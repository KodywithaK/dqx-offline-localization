"0":
  de: "@aOojam@bIch... Ich glaube, hier trennen sich unsere Wege...\n@c2@"
  en: "@aOojam@bI, I don't think...I can be travelling with you...any more...\n@c2@"
  es: "@aOojam@bNo creo... que pueda viajar más con... %H860%Xusted%Yustedes%Z...\n@c2@"
  fr: "@aOojam@bJe... Je ne pense pas... que je pourrai... vous suivre... plus longtemps...\n@c2@"
  it: "@aOojam@bIo... io penso... che io non può più viaggiare con %H860%Xte%Yvoi%Z...\n@c2@"
  ja: "@a@bオーリン「ど　どうやら　わたしは……\n\tもう　おとも　できそうに\n\tありません……。\n@c2@"
"1":
  de: "@aOojam@bIch weiß, dass es Euch schwerfallen wird, aber...\nIhr müsst dieses Land nun verlassen...\n@c2@"
  en: "@aOojam@bI know it will pain you, but...you must depart this country for now...\n@c2@"
  es: "@aOojam@bSé que %H860%Xle%Yles%Z apenará pero... %H860%Xdebe%Ydeben%Z salir del país por el momento...\n@c2@"
  fr: "@aOojam@bJe sais que vous allez être %L000%Xdécues%Ydéçue%Z, mais... vous devez quitter le pays pour le moment...\n@c2@"
  it: "@aOojam@bSo che è dolore per %H860%Xtuo%Yvostro%Z cuore... ma io devo lasciare questa terra ora.\n@c2@"
  ja: "@a@bオーリン「ご無念でしょうが……\n\tひとまず　この国を出るのです。\n\tそして　いつの日か必ず……。\n@c2@"
"2":
  de: "@aOojam@bEines Tages... werdet Ihr zurückkehren... und Mahabalas Tod rächen. Seid vorsichtig... Uuuuhhh!\n@c2@"
  en: "@aOojam@bOne day...you will return...and avenge Mahabala-jee's murder. Be careful... Uuurgh!\n@c2@"
  es: "@aOojam@bAlgún día... %H860%Xvolverá%Yvolverán%Z... y %H860%Xpodrá%Ypodrán%Z vengar la muerte del maestro Mahabala. %H860%XCompañera, tenga cuidado%YHermanas, tengan cuidado%Z... ¡Aaargh!\n@c2@"
  fr: "@aOojam@bUn jour... vous reviendrez... et vous vengerez le meurtre de Mahabala-jee. Faites bien attention... Aaahⓠ\n@c2@"
  it: "@aOojam@bUn giorno %H860%Xtornerai... e vendicherai morte di Malaparata. Tu fare%Ytornerete... e vendicherete morte di Malaparata. Voi fare%Z attenzione... Aaargh!\n@c2@"
  ja: "@a@bオーリン「父のカタキを果たす\n\tその日まで　おふたりとも\n\tどうか　ご無事で……。　ぐふっ！\n@c2@"
"3":
  de: "@a@bKeine Reaktion.\nAus diesem Körper ist alles Leben längst entwichen.\n@c0@"
  en: "@a@bNo reply.\nIt's just a corpse.\n@c0@"
  es: "@a@bNo hay respuesta.\nEs un cadáver.\n@c0@"
  fr: "@a@bPas de réponse.\nCe n'est qu'un cadavre.\n@c0@"
  it: "@a@bNon risponde...\nÈ solo un cadavere.\n@c0@"
  ja: "@a@b返事がない。\nただの　しかばねのようだ……。\n@c0@"
"4":
  de: "@a@b%0%a00120 prüft den Boden zu %A120%Xseinen%Z%B120%Xihren%Z Füßen.\n@c0@"
  en: "@a@b%0%a00120 examines the ground at %A120%Xhis%Z%B120%Xher%Z feet.\n@c0@"
  es: "@a@b%0%a00120 examina el suelo alrededor de sus pies.\n@c0@"
  fr: "@a@b%0%a00120 examine le sol devant %A120%Xlui%Z%B120%Xelle%Z.\n@c0@"
  it: "@a@b%0%a00120 esamina il terreno ai suoi piedi...\n@c0@"
  ja: "@a@b%a00120は　足もとを　調べた！\n@c0@"
"5":
  de: "@a@b%A120%XEr%Z%B120%XSie%Z macht eine verblüffende Entdeckung!\nHier sind Stufen, die in die Tiefe führen...\n@c0@"
  en: "@a@bAmazing! %A120%XHe%Z%B120%XShe%Z discovers some steps...\n@c0@"
  es: "@a@b¡Increíble! Ha descubierto unos escalones...\n@c0@"
  fr: "@a@bIncroyableⓠ\n%A120%XIl%Z%B120%XElle%Z découvre un escalier...\n@c0@"
  it: "@a@bIncredibile!\nCi sono dei gradini!\n@c0@"
  ja: "@a@bなんと　かいだんが　みつかった。\n@c0@"
"6":
  de: "@a@b*: Das ist der 'afen Havre Léon. Von 'ier aus fahren Schiffe nach Endor im Norden.\n@c2@"
  en: "@a@b*: Zis is ze port of Havre Léon. Ships from 'ere sail to Endor in ze north.\n@c2@"
  es: "@a@b*: Este es el puegrto de Havre Léon. De aquí salen bagrcos pagra Endogr, hacia el nogrte.\n@c2@"
  fr: "@a@b*ⓢ Vous êtes à Port Lionel. Les bateaux vont à Chandor, au nord.\n@c2@"
  it: "@a@b*: Questa è la darsena di Port Léon. Da qui le navi partono per Endor, a nord d'ici.\n@c2@"
  ja: "@a@b＊「ここは　港町ハバリア。\n\tエンドール行きの　船が出る町だ。\n@c2@"
"7":
  de: "@a@b*: Seit dieser neue Marquis an der Mascht ⓚⓛ ich meine, Macht ⓚⓛ ist, müssen alle Soldaten mit diesem dummen Accent, äh, Akzent sprechen.\n@c0@"
  en: "@a@b*: Ever since this new marquis regent came along, all zeⓚⓛ I mean, the...soldiers have to speak with zatⓚⓛ I mean, that...stupid accent.\n@c0@"
  es: "@a@b*: Desde que llegó el nuevo Marqués Regente, tout les, quiero decir, todos los, soldados tienen que hablagr, quiero decir, hablar... \n㈡\n*: ... con ese estúpido acento.\n@c0@"
  fr: "@a@b*ⓢ Depuis que le Lord Regent a pris le pouvoir, tous les soldiers... euh, les soldats doivent parler avec ce stupid... je veux dire, ce stupide accent.\n@c0@"
  it: "@a@b*: Da quando è arrivato il nuovo Marchese Reggente, tous les... cioè, tutti i soldati devono parler... voglio dire, devono parlare con quello stupido accento.\n@c0@"
  ja: "@a@b＊「キングレオの王さまが代わってから\n\t港の　取り締まりが\n\tきびしくなっちまってな。\n@c0@"
"8":
  de: "@a@b*: Außerdem hat er die Hafenkontrollen verschärft. Es ist fast unmöglich, an eine Bordkarte zu kommen.\n@c0@"
  en: "@a@b*: And he's tightened control of the port as well. It's hard to come by boarding passes these days.\n@c0@"
  es: "@a@b*: Y también ha reforzado el control del puerto. Ahora es muy difícil conseguir pasajes.\n@c0@"
  fr: "@a@b*ⓢ Il contrôle aussi tout le port.\nIl est de plus en plus difficile d'obtenir des permis d'embarquer.\n@c0@"
  it: "@a@b*: Ha anche aumentato la sorveglianza al porto. Di questi tempi, è molto difficile procurarsi un permesso d'imbarco.\n@c0@"
  ja: "@a@b＊「船に乗るための　乗船券が\n\tなかなか　手に入らないんだ。\n@c0@"
"9":
  de: "@a@b*: Wo ist Großvater hin? Es ist bald Essenszeit...\n@c1@"
  en: "@a@b*: Where's Grandad got to?\nIt'll be dinner time soon...\n@c1@"
  es: "@a@b*: ¿Dónde se ha metido el abuelo? Va a ser la hora de cenar...\n@c1@"
  fr: "@a@b*ⓢ Où est passé papyⓡ\nÇa va bientôt être l'heure du dîner...\n@c1@"
  it: "@a@b*: Dove si è cacciato il nonno? Fra poco si cena...\n@c1@"
  ja: "@a@b＊「うちの　おじいちゃんったら\n\tどこに行ったのかしら。\n\tそろそろ　ごはんの時間なのに……。\n@c1@"
"10":
  de: "@a@b*: Aaah... Endor... Dort gibt es ein imposantes Kolosseum.\n@c2@"
  en: "@a@b*: Aaah...Endor... There's an enormous colosseum there, you know.\n@c2@"
  es: "@a@b*: Aaah... Endor... Allí hay un enorme coliseo, ¿lo %H860%Xsabías%Ysabíais%Z?\n@c2@"
  fr: "@a@b*ⓢ Aaah... Chandor... Il y a un très grand Colisée\nlà-bas, vous savez.\n@c2@"
  it: "@a@b*: Aaah... Endor... Lì c'è un'arena gigantesca.\n@c2@"
  ja: "@a@b＊「この海の向こう　エンドールには\n\t大きなコロシアムがあってのう……。\n@c2@"
"11":
  de: "@a@b*: Bin dort selbst mal angetreten. Jawohl, ich war ein ganz guter Kämpfer in meinen jungen Jahren. Aaah...\n@c2@"
  en: "@a@b*: I was a contestant once myself.\nYes, I was quite a fighter in my younger years. Aaah...\n@c2@"
  es: "@a@b*: Yo fui una vez. Sí, cuando era joven era un auténtico luchador. Aaah...\n@c2@"
  fr: "@a@b*ⓢ J'ai participé au tournoi quand j'étais jeune.\nJ'étais plutôt doué, même. Aaah...\n@c2@"
  it: "@a@b*: Ci ho gareggiato anch'io. In gioventù ero un lottatore coi fiocchi. Ah, bei tempi...\n@c2@"
  ja: "@a@b＊「わしも　若い頃は\n\tそのコロシアムで　戦ったもんじゃ。\n\tあの頃が　なつかしいのう……。\n@c2@"
"12":
  de: "@a@b*: Hallo! Ich bin Susi. Schön, dass %L000%Xihr bei mir vorbeischaut%Ydu bei mir vorbeischaust%Z. Hi hi hi!\n@c1@"
  en: "@a@b*: Hi! I'm Suzy.\nIt's very flattering that you're so eager to come ⓗchez moiⓘ. Tee hee hee!\n@c1@"
  es: "@a@b*: ¡Hola! Soy Susi.\nEs todo un halago que %H860%Xdesees%Ydeseéis%Z venir ''chez moi''. ¡Ji, ji!\n@c1@"
  fr: "@a@b*ⓢ Helloⓠ Je m'appelle Alison.\nC'est gentil de venir me voir. Hi hi hiⓠ\n@c1@"
  it: "@a@b*: Salve! Io sono Susanna.\nMi fa piacere che %H860%Xtu abbia%Yvoi abbiate%Z tanta voglia di venire ⓕchez moiⓖ. Eh! Eh! Eh!\n@c1@"
  ja: "@a@b＊「あたしは　ジル。\n\tこんな早くから　会いに来てくれて\n\tありがとう。\n@c1@"
"13":
  de: "@aSusi@bAber die Schänke macht erst heute Abend auf. Pardon!\n@c1@"
  en: "@aSuzy@bBut the pub doesn't open 'til the evening, I'm afraid. Pardon!\n@c1@"
  es: "@aSusi@bPero me temo que la taberna no abre hasta la noche. ¡Pardon!\n@c1@"
  fr: "@aAlison@bMais le pub n'ouvre que ce soir. Sorryⓠ\n@c1@"
  it: "@aSusanna@bIl locale però non apre fino a sera, mi spiace. Pardon!\n@c1@"
  ja: "@a@bジル「でも　酒場は夜からなの。\n\tごめんね。\n@c1@"
"14":
  de: "@a@b*: Es ist noch nicht offen. Hab noch was zu erledigen.\n@c2@"
  en: "@a@b*: Bar's not open yet.\nI'm still setting up.\n@c2@"
  es: "@a@b*: La taberna no está abierta todavía.\nEstoy preparándolo todo.\n@c2@"
  fr: "@a@b*ⓢ Le pub n'est pas encore ouvert.\nJe fais un peu de rangement.\n@c2@"
  it: "@a@b*: Il bar non è aperto.\nSto ancora sistemando delle cose.\n@c2@"
  ja: "@a@b＊「まだ　準備中なんです。\n\tすいませんね。\n@c2@"
"15":
  de: "@a@b*: Das ist das Gefängnis. Jeder, der den Marquis Régent verärgert, landet 'ier.\n@c2@"
  en: "@a@b*: Zis is ze jail. Anyone who betrays ze Marquis Régent ends up in 'ere sooner or later.\n@c2@"
  es: "@a@b*: Esta es la cágrcel. Tagrde o tempgrano, todo el que tgraiciona al Marquis Régent acaba con sus huesos aquí.\n@c2@"
  fr: "@a@b*ⓢ C'est la prison. Tous ceux qui trahissent le Lord Regent atterrissent ici tôt ou tard.\n@c2@"
  it: "@a@b*: Questa è la prison. Chiunque tradisca il Marchese Reggente prima o poi finisce qui.\n@c2@"
  ja: "@a@b＊「ここは　牢屋。\n\tキングレオの王さまに\n\t逆らった者たちが　入っている。\n@c2@"
"16":
  de: "@a@b*: Ich hab gar nichts Schlimmes gemacht. Das war bloß ein kleiner Scherz!\n@c2@"
  en: "@a@b*: Now listen 'ere.\nI ain't done nuffin' wrong!\nI was just 'avin' a larf, right.\n@c2@"
  es: "@a@b*: Ahogra %H860%Xpgresta%Ypgrestad%Z atención. ¡Moi, no he hecho nada malo! Solo estaba pasando un buen grato.\n@c2@"
  fr: "@a@b*ⓢ Écoutez-moiⓠ J'ai rien fait de malⓠ Je voulais juste m'amuser.\n@c2@"
  it: "@a@b*: %H860%XSturati%YSturatevi%Z le orecchie! Non ho fatto un bel niente! Volevo solo scherzare!\n@c2@"
  ja: "@a@b＊「聞いてください！\n\tわたしは　なんにも\n\t悪いことは　してないんです。\n@c2@"
"17":
  de: "@a@b*: Wollt ja keinem weh tun. Hab nur ein Pulverfass unter das Fenster von diesem Kanzler gestellt, das ist alles...\n@c2@"
  en: "@a@b*: I weren't tryin' to 'urt no one. I just set off a keg o' gunpowder outside that Chancellor geezer's room, that's all...\n@c2@"
  es: "@a@b*: No quegría hacegr daño a nadie. Lo único que hice fue ponegr un bagrril de pólvogra junto a la puegrta del viejo Cancillegr.\n@c2@"
  fr: "@a@b*ⓢ J'ai seulement fait sauter une jarre de poudre à côté des appartements de ce vieux crabe de chancelier, c'est tout...\n@c2@"
  it: "@a@b*: Non volevo far male a nessuno. Ho solo messo un barile di polvere da sparo fuori dalla porta della stanza di quel tizio, il Cancelliere. Che c'è di male?\n@c2@"
  ja: "@a@b＊「ただ　ちょっと　まちがえて\n\tお城の　大臣の部屋のそばで\n\t火薬を　爆発させてしまって……。\n@c2@"
"18":
  de: "@a@b*: Wo ich das Schießpulver her hab? He he. Hab's in der Mamonmine westlich von hier gefunden.\n@c2@"
  en: "@a@b*: Where d'ya get gunpowder from? Heh heh.\nFound it down that Mamon Mine west of 'ere,\ndidn't I.\n@c2@"
  es: "@a@b*: ¿Que dónde se consigue pólvogra? Je, je.\nLa encontgré en la Mina de Mammon, al este de aquí.\n@c2@"
  fr: "@a@b*ⓢ Où j'ai récupéré la poudreⓡ Hé hé.\nJe l'ai trouvée dans la mine d'Alpion, à l'ouest.\n@c2@"
  it: "@a@b*: Dove ho preso la polvere da sparo? Eh! Eh! Eh!\nL'ho trovata nella miniera di Mamon, a ovest.\n@c2@"
  ja: "@a@b＊「火薬ですか？　私は昔\n\t西の　アッテムト鉱山にいたもので\n\tそのとき　手に入れたものです。\n@c2@"
"19":
  de: "@a@b*: Uwaaahhh! Uwaaahhh!\n@c2@"
  en: "@a@b*: Uwaaargh! Uwaaargh!\n@c2@"
  es: "@a@b*: ¡Aaaargh! ¡Aaaargh!\n@c2@"
  fr: "@a@b*ⓢ Waaarghⓠ Waaarghⓠ\n@c2@"
  it: "@a@b*: Uaaargh! Uaaargh!\n@c2@"
  ja: "@a@b＊「うおーん　うおーん。\n@c2@"
"20":
  de: "@a@b*: %L000%XHabt ihr%YHast du%Z eine Bordkarte? Ohne darf man nicht aufs Schiff. Tut mir leid. Ich kann keine Ausnahmen machen!\n@c0@"
  en: "@a@b*: Have you got a boarding pass?\nYou can't board the ship without one.\nSorry. No exceptions!\n@c0@"
  es: "@a@b*: ¿%H860%XTiene%YTienen%Z un pasaje? No se puede subir al barco sin un pasaje.\nLo siento. ¡No hay excepciones!\n@c0@"
  fr: "@a@b*ⓢ Vous avez un permis d'embarquerⓡ Vous ne pouvez pas monter dans le bateau sans ce permis. Désolé. Aucune exceptionⓠ\n@c0@"
  it: "@a@b*: %H860%XHai%YAvete%Z il permesso d'imbarco? Nessuno può salire a bordo senza. Mi spiace. Nessuna eccezione!\n@c0@"
  ja: "@a@b＊「乗船券を持っているかい？\n\t持ってねえなら　乗せるわけには\n\tいかねえ。　出直してきな！\n@c0@"
"21":
  de: "@a@b*: %H860%XDu hast%YIhr habt%Z eine Bordkarte? Dann %H860%Xkannst du%Ykönnt ihr%Z an Bord! Wir legen in Kürze ab.\n@c0@"
  en: "@a@b*: You've got a boarding pass, have you?\nRight, all aboard, then!\nWe'll be setting sail shortly.\n@c0@"
  es: "@a@b*: %H860%XTienes%YTenéis%Z un pasaje, ¿verdad?\nDe acuerdo, ¡todos a bordo!\nZarparemos en breve.\n@c0@"
  fr: "@a@b*ⓢ Vous avez un permis d'embarquerⓡ\nParfaitⓠ Vous pouvez monterⓠ\nNous allons partir dans peu de tempsⓠ\n@c0@"
  it: "@a@b*: %H860%XHai%YAvete%Z un permesso d'imbarco, vero?\nTutti a bordo allora!\nFra poco salpiamo.\n@c0@"
  ja: "@a@b＊「乗船券を　持ってきたな。\n\tさあ　乗った　乗った！\n\tもうすぐ　出航だぜ！\n@c0@"
"22":
  de: "@a@b*: Die Kabinen befinden sich unter Deck.\n@c0@"
  en: "@a@b*: The cabins are down below deck.\n@c0@"
  es: "@a@b*: Los camarotes se encuentran bajo cubierta.\n@c0@"
  fr: "@a@b*ⓢ Les cabines sont juste sous le pont.\n@c0@"
  it: "@a@b*: Le cabine si trovano di sotto.\n@c0@"
  ja: "@a@b＊「船室は　下にあるぜ。\n\tお客さん！\n@c0@"
"23":
  de: "@a@b*: Ah, endlich unterwegs nach Endor! Wie es da wohl aussehen wird? Oh, ich kann's kaum erwarten!\n@c1@"
  en: "@a@b*: Ah, sailing to Endor at last!\nI wonder what kind of place it is.\nOh, I can't wait!\n@c1@"
  es: "@a@b*: ¡Ah, rumbo a Endor, por fin!\nMe pregunto cómo será ese lugar.\n¡Oh, qué impaciencia!\n@c1@"
  fr: "@a@b*ⓢ Enfin, je pars pour Chandorⓠ\nJe me demande bien ce qui m'attendⓠ\nJ'ai tellement hâteⓠ\n@c1@"
  it: "@a@b*: Oh, finalmente si parte per Endor!\nChissà com'è... Non vedo l'ora di arrivare!\n@c1@"
  ja: "@a@b＊「この船の行き先は　エンドール。\n\tどんな国でしょうか？\n\tワクワクしますね。\n@c1@"
"24":
  de: "@a@b*: Willkommen an Bord. Ich bin der Kapitän. Wir legen in Kürze ab, es wäre sehr freundlich, wenn Ihr Euch in Eure Kabine begeben würdet...\n@c2@"
  en: "@a@b*: Welcome aboard. I'm the captain. We'll be setting sail shortly, so if you'll kindly go down to the cabins, please...\n@c2@"
  es: "@a@b*: %L000%XBienvenidas%YBienvenida%Z a bordo. Soy el capitán. Zarparemos en breve, así que si %L000%Xson tan amables%Yes tan amable%Z de ir al camarote...\n@c2@"
  fr: "@a@b*ⓢ Bienvenue à bord. Je suis le capitaine. Nous allons partir dans peu de temps. Si vous voulez bien regagner vos cabines, s'il vous plaît...\n@c2@"
  it: "@a@b*: Sono il comandante della nave, e %H860%Xti%Yvi%Z do il benvenuto a bordo. Fra poco salperemo, quindi %H860%Xti%Yvi%Z invito a prendere posto in cabina.\n@c2@"
  ja: "@a@b＊「わたしが　この船の船長だ。\n\tもうすぐ　船を出すから\n\t下の船室に　行ってなさい。\n@c2@"
"25":
  de: "@a@b*: Wenn wir Havre Léon erst einmal verlassen haben, gibt es kein Zurück mehr.\n@c2@"
  en: "@a@b*: Once we leave Havre Léon this time, there'll be no way of coming back.\n@c2@"
  es: "@a@b*: Cuando partamos de Havre Léon, no habrá posibilidad de regresar.\n@c2@"
  fr: "@a@b*ⓢ Une fois qu'on aura quitté le port, on reviendra pas.\n@c2@"
  it: "@a@b*: Una volta lasciato Port Léon non potremo più fare marcia indietro.\n@c2@"
  ja: "@a@b＊「船が出ると　もう　この国には\n\tもどっては　これないだろう。\n@c2@"
"26":
  de: "@a@b*: Seid Ihr Euch ganz sicher, dass Ihr die Reise wirklich antreten wollt?\n@c2@"
  en: "@a@b*: So make sure you've no regrets, hm?\nWell? Are you ready to get underway?\n@c2@"
  es: "@a@b*: Así que hay que asegurarse de no dejarse nada en el tintero ¿entendido?\n¿Y bien? ¿%L000%XEstán listas%YEstá lista%Z para zarpar?\n@c2@"
  fr: "@a@b*ⓢ Alors vous êtes %L000%Xsûres%Ysûre%Z que vous allez pas le regretter, mmmⓡ Nonⓡ Vous êtes %L000%Xprêtes%Yprête%Z, alorsⓡ\n@c2@"
  it: "@a@b*: Quindi non ci sarà spazio per i ripensamenti, intesi? Allora? %H860%XVuoi%YVolete%Z proprio partire?\n@c2@"
  ja: "@a@b＊「思い残すことは　ないかね？\n\t船を出しても　いいかね？\n@c2@"
"27":
  de: "@a@b*: Na schön...\nAlle Mann an Bord!\nAnker lichten!\n@c2@"
  en: "@a@b*: Right, then...\nALL HANDS ON DECK!\nANCHORS AWEIGH!\n@c2@"
  es: "@a@b*: De acuerdo entonces...\n¡Todos a cubierta!\n¡Levad anclas!\n@c2@"
  fr: "@a@b*ⓢ Parfait...\nDans ce cas, tout le monde sur le pontⓠ\nLevez l'ancreⓠ\n@c2@"
  it: "@a@b*: Bene, allora...\nTutti pronti!\nLevare l'ancora!\n@c2@"
  ja: "@a@b＊「ようし！　では　出航だ！\n\t全員　持ち場につけー！\n\tいかりを上げろー！\n@c2@"
"28":
  de: "@a@b*: Dann warte ich noch mit dem Ablegen, aber nur dieses eine Mal. So könnt Ihr erledigen, was noch getan werden muss.\n@c2@"
  en: "@a@b*: Then I'll hold the ship for you, just this once.\nGo and finish off whatever it is you still have to do.\n@c2@"
  es: "@a@b*: Entonces, por esta vez esperaré.\n%L000%XId y terminad%YVe y termina%Z lo que haya que hacer.\n@c2@"
  fr: "@a@b*ⓢ Alors je vais attendre un peu avant de lever l'ancre, juste pour cette fois. Descendez à terre et faites ce que vous avez à faire.\n@c2@"
  it: "@a@b*: D'accordo. Ritarderò la partenza della nave... Ma che sia l'ultima volta, però! %H860%XVai%YAndate%Z a completare quello che %H860%Xdevi%Ydovete%Z fare.\n@c2@"
  ja: "@a@b＊「それなら　用事を済ませてから\n\tまた来なさい。\n\tしばらく　待っていてあげるから。\n@c2@"
"29":
  de: "@a@b*: Ich hab gehört, da hat einer versucht, den Marquis de Léon abzumurksen.\n@c3@"
