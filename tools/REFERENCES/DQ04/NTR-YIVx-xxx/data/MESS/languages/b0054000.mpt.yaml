  es: "@a@b*: %L000%XId%YVe%Z a chiarlar con los pasajieros.\nDespués, %L000%Xpodéis%Ypuedes%Z ir a habliar con el capitián si aún %L000%Xestiáis dieseosas%Yestiás dieseosa%Z de partir, sí...\n@c0@"
