"49":
  de: "@aPsaro@bMenschen, es sieht ganz so aus, als ob ich Euch danken müsste.\n@c2@"
  en: "@aPsaro@bHumans, it seems that I must thank you.\n@c2@"
  es: "@aPsaro@bHumanos, parece que debo agradecérselo.\n@c2@"
  fr: "@aPsaro@bHumains, on dirait que je vous dois des remerciements.\n@c2@"
  it: "@aPsaro@bUmani, credo di dovervi ringraziare.\n@c2@"
  ja: "@a@bピサロ「……人間たちよ。\n\tおもしろくはないが　お前たちに\n\t礼を言わねば　ならんようだな。\n@c2@"
"50":
  de: "@aPsaro@bIhr habt uns beide gerettet, Rosi und mich. Ich kann Euch gar nicht sagen, wie dankbar ich bin.\n@c2@"
  en: "@aPsaro@bYou saved both of us, Rose and myself.\nI can't tell you how grateful I am for that.\n@c2@"
  es: "@aPsaro@bNos han salvado a ambos, a Rosa y a mí mismo.\nNo soy capaz de expresar cuán agradecido estoy por ello.\n@c2@"
  fr: "@aPsaro@bVous nous avez sauvés tous les deux, Rose et moi.\nJe ne saurais vous dire à quel point je vous en suis reconnaissant.\n@c2@"
  it: "@aPsaro@bSiete riusciti a salvare sia me, sia Rosa. Non so come esprimervi la mia gratitudine.\n@c2@"
  ja: "@a@bピサロ「お前たちは　ロザリーと\n\tこのわたしの　命の恩人だ。\n\t素直に感謝しよう。\n@c2@"
"51":
  de: "@aPsaro@bIch habe lange geglaubt, dass die Menschen meine Feinde sind, aber da habe ich mich wohl geirrt.\n@c2@"
  en: "@aPsaro@bI thought for so long that humans were my true enemy, but perhaps I was mistaken.\n@c2@"
  es: "@aPsaro@bHe considerado durante demasiado tiempo a los humanos como a auténticos enemigos, pero tal vez estaba equivocado.\n@c2@"
  fr: "@aPsaro@bPendant si longtemps, j'ai cru que les humains étaient mes véritables ennemis, mais je me suis peut-être trompé.\n@c2@"
  it: "@aPsaro@bFino a questo momento ero convinto che gli uomini fossero i miei peggiori nemici, ma è evidente che mi sbagliavo.\n@c2@"
  ja: "@a@bピサロ「人間こそ　真の敵と\n\t長年　思い込んでいたが……\n\tわたしは　まちがっていたのか？\n@c2@"
"52":
  de: "@aPsaro@bDaran muss ich mich erst gewöhnen... Ich werde mit Rosi ins Dorf zurückkehren und in Ruhe über alles nachdenken.\n@c2@"
  en: "@aPsaro@bIt will take time to come to terms with this.\nI must return to the village with Rose and think long and hard.\n@c2@"
  es: "@aPsaro@bNecesitaré algo de tiempo para asimilarlo.\nDebo regresar al pueblo con Rosa y pensar largo y tendido.\n@c2@"
  fr: "@aPsaro@bIl va me falloir un peu de temps pour accepter cela.\nJe dois retourner au village avec Rose et réfléchir très sérieusement.\n@c2@"
  it: "@aPsaro@bMi ci vorrà del tempo per comprendere a fondo ciò che è accaduto. Tornerò al villaggio insieme a Rosa e ci rifletterò con calma.\n@c2@"
  ja: "@a@bピサロ「……この心が定まるまで\n\tわたしは村に戻り　ロザリーと\n\t暮らすことにしよう。\n@c2@"
"53":
  de: "@aPsaro@bAber bevor wir dorthin gehen, muss noch etwas erledigt werden.\n@c2@"
  en: "@aPsaro@bBut first, there's something that needs to be done.\n@c2@"
  es: "@aPsaro@bPero primero, hay algo que conviene hacer.\n@c2@"
  fr: "@aPsaro@bMais avant, il me reste quelque chose à faire.\n@c2@"
  it: "@aPsaro@bMa prima, c'è una cosa che devo fare.\n@c2@"
  ja: "@a@bピサロ「しかし……　ひとつだけ\n\tやることが　残っている。\n@c2@"
"54":
  de: "@aPsaro@bWie es scheint, ist der Weg, den ich von nun an beschreiten werde, der gleiche wie der Eure. Ich werde mit Euch reisen.\n@c2@"
  en: "@aPsaro@bIt seems the path we must take from here is the same. So I will travel it with you.\n@c2@"
  es: "@aPsaro@bParece que el camino que debemos tomar a partir de aquí es el mismo. Así que viajaré con%H860%Xtigo%Y %R000%Xvosotras%Yvosotros%Z%Z.\n@c2@"
  fr: "@aPsaro@bOn dirait que le chemin que nous devons prendre à partir de maintenant est le même.\nJe vais donc voyager avec vous.\n@c2@"
  it: "@aPsaro@bA quanto pare, da questo momento in poi seguiremo lo stesso sentiero. Quindi, vorrei percorrerlo insieme a %H860%Xte%Yvoi%Z.\n@c2@"
  ja: "@a@bピサロ「あいにくかも知れんが\n\tわたしも　行く道は同じだ。\n\tしばし　同行だな。\n@c2@"
