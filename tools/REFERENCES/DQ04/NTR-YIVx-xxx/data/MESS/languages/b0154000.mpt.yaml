"0":
  de: "@aPsaro der Metzler@bGrrraaahhh!\n@c3@"
  en: "@aPsaro the Manslayer@bGrraaargh!\n@c3@"
  es: "@aPsaro el Carnicero@b¡Aaaaargh!\n@c3@"
  fr: "@aPsaro l'Exterminateur@bGrrraaarghⓠ\n@c3@"
  it: "@aPsaro il Massacratore@bWaaargh!\n@c3@"
  ja: "@a@bデスピサロ「ぐはあぁぁぁっ……！\n@c3@"
"1":
  de: "@aPsaro der Metzler@bIhr wagt es, mich zu stören?! Ich bin Psaro der Metzler. Gerade wurde ich als Meister der Monster wieder erweckt.\n@c3@"
  en: "@aPsaro the Manslayer@bHow dare you people disturb me!? I am Psaro the Manslayer. I have just reawakened as the Master of Monsterkind.\n@c3@"
  es: "@aPsaro el Carnicero@b¡¿Cómo osáis molestarme?! Soy Psaro el Carnicero. He vuelto a despertar como Señor de los Monstruos.\n@c3@"
  fr: "@aPsaro l'Exterminateur@bComment osez-vous me dérangerⓠⓑ\nJe suis Psaro l'Exterminateur. Je viens tout juste de me réveiller et je suis le Maître des monstres.\n@c3@"
  it: "@aPsaro il Massacratore@bCome osate disturbarmi?! Io sono Psaro il Massacratore! Mi sono risvegliato da un lungo sonno, e ora sono il Signore della Mostruosità.\n@c3@"
  ja: "@a@bデスピサロ「何者だ　お前たちは……？\n\tわたしの名は　デスピサロ。\n\t魔族の王として　目覚めたばかりだ。\n@c3@"
"2":
  de: "@aPsaro der Metzler@bGrrraaahhh! Ich weiß nichts von meiner Vergangenheit. Ich kann mich an nichts erinnern.\n@c3@"
  en: "@aPsaro the Manslayer@bGrraaargh!\nI know nothing of my past.\nI remember nothing.\n@c3@"
  es: "@aPsaro el Carnicero@b¡Aaaaargh!\nNo sé nada de mi pasado.\nNo recuerdo nada.\n@c3@"
  fr: "@aPsaro l'Exterminateur@bGrrraaarghⓠ Je ne sais rien de mon passé.\nJe ne me souviens plus de rien.\n@c3@"
  it: "@aPsaro il Massacratore@bGraaargh! Non ricordo nulla del mio passato. Nulla...\n@c3@"
  ja: "@a@bデスピサロ「うぐおぉぉぉ……！\n\tわたしには　何も　わからぬ……。\n\t何も　思い出せぬ……。\n@c3@"
"3":
  de: "@aPsaro der Metzler@bAber ich weiß sehr wohl, was ich zu tun habe.\n@c3@"
  en: "@aPsaro the Manslayer@bBut I know what it is I must do.\n@c3@"
  es: "@aPsaro el Carnicero@bPero sé lo que debo hacer.\n@c3@"
  fr: "@aPsaro l'Exterminateur@bMais je sais ce que je dois faire.\n@c3@"
  it: "@aPsaro il Massacratore@bMa so bene cosa devo fare...\n@c3@"
  ja: "@a@bデスピサロ「しかし　何をやるべきか\n\tそれだけは　わかっている……。\n@c3@"
"4":
  de: "@aPsaro der Metzler@bGrrraaahhh! Ich muss die gesamte Menschheit auslöschen!\n@c3@"
  en: "@aPsaro the Manslayer@bGrraaargh!\nI must eradicate all of humankind!\n@c3@"
  es: "@aPsaro el Carnicero@b¡Aaaaargh!\n¡Debo erradicar la raza humana!\n@c3@"
  fr: "@aPsaro l'Exterminateur@bGrrraaarghⓠ Je dois détruire l'humanitéⓠ\n@c3@"
  it: "@aPsaro il Massacratore@bWaaargh! Devo sterminare l'intera umanità!\n@c3@"
  ja: "@a@bデスピサロ「ぐはあぁぁぁっ！\n\tお前たち　人間どもを\n\t根絶やしにしてくれるわっ！！\n@c3@"
"5":
  de: "@aRosi@bPsaro! Warte!\n@c3@"
  en: "@aRose@bPsaro! Wait!\n@c3@"
  es: "@aRosa@b¡Psaro! ¡Espera!\n@c3@"
  fr: "@aRose@bPsaroⓠ Attendsⓠ\n@c3@"
  it: "@aRosa@bPsaro! Aspetta!\n@c3@"
  ja: "@a@bロザリー「ピサロさま！\n\tお待ちください！\n@c3@"
"6":
  de: "@aPsaro der Metzler@bGrrra...aahhh! W-Wer ruft meinen Namen? D-Diese Stimme...\n@c3@"
  en: "@aPsaro the Manslayer@bGrra...aargh!\nW-Who calls my name?\nTh-That voice...\n@c3@"
  es: "@aPsaro el Carnicero@b¡Grrr... Aaaaargh!\n¿Quién me llama por mi nombre?\nEsa voz...\n@c3@"
  fr: "@aPsaro l'Exterminateur@bGrra... aarghⓠ\nQui... Qui m'appelleⓡ\nCette voix...\n@c3@"
  it: "@aPsaro il Massacratore@bWaaargh... Waaargh! Chi mi chiama...? Questa voce...\n@c3@"
  ja: "@a@bデスピサロ「ぐ…ぐはあぁぁぁっ……！\n\tだ…だれだ……。\n\tわが名を呼ぶ　その声は……。\n@c3@"
"7":
  de: "@aRosi@bIch bin es... Rosi.\n@c3@"
  en: "@aRose@bIt's me...Rose.\n@c3@"
  es: "@aRosa@bSoy yo..., Rosa.\n@c3@"
  fr: "@aRose@bC'est moi... Rose.\n@c3@"
  it: "@aRosa@bSono io... Rosa.\n@c3@"
  ja: "@a@bロザリー「……わたしです。\n\tロザリーです。\n@c3@"
"8":
  de: "@aRosi@bWeißt du nicht mehr? Du hast mir meinen Namen gegeben.\n@c3@"
  en: "@aRose@bDon't you remember?\nYou're the one who named me.\n@c3@"
  es: "@aRosa@b¿No recuerdas?\nTú eres quien me dio ese nombre.\n@c3@"
  fr: "@aRose@bTu ne te souviens pasⓡ\nC'est toi qui m'as donné mon nom.\n@c3@"
  it: "@aRosa@bNon ti ricordi di me? Sei tu che mi hai dato questo nome.\n@c3@"
  ja: "@a@bロザリー「わかりませんか……。\n\tあなたが　さずけてくれた\n\tこの名前さえも……。\n@c3@"
"9":
  de: "@a@bRosi beginnt zu weinen. Rubintränen kullern an ihren Wangen herunter...\n@c3@"
  en: "@a@bRuby tears start to roll down Rose's cheeks...\n@c3@"
  es: "@a@bPor las mejillas de Rosa empiezan a caer lágrimas de rubí...\n@c3@"
  fr: "@a@bDes larmes de rubis commencent à couler le long des joues de Rose...\n@c3@"
  it: "@a@bDalle guance di Rosa scendono Lacrime di rubino.\n@c3@"
  ja: "@a@bロザリーの瞳から　ルビーの涙が\nこぼれおちた……。\n@c3@"
"10":
  de: "@aRosi@bBitte versuch, dich zu erinnern, Psaro. An den Tag, an dem wir uns kennen gelernt haben...\n@c3@"
  en: "@aRose@bPlease try to remember, Psaro.\nRemember the day we met...\n@c3@"
  es: "@aRosa@bIntenta recordar, Psaro.\nRecuerda el día en que nos conocimos...\n@c3@"
  fr: "@aRose@bS'il te plaît, essaie de te souvenir, Psaro.\nEssaie de te rappeler le jour où nous nous sommes rencontrés...\n@c3@"
  it: "@aRosa@bTi supplico, Psaro, cerca di ricordare. Ripensa al giorno in cui ci siamo conosciuti...\n@c3@"
  ja: "@a@bロザリー「……思い出してください。\n\tピサロさま。　わたしたちが\n\t出会った　あの日のことを……。\n@c3@"
"11":
  de: "@aPsaro der Metzler@bG-Grrraaahhh!\n@c3@"
  en: "@aPsaro the Manslayer@bG-Grraaargh!\n@c3@"
  es: "@aPsaro el Carnicero@b¡Aaaargh!\n@c3@"
  fr: "@aPsaro l'Exterminateur@bG-Grrraaarghⓠ\n@c3@"
  it: "@aPsaro il Massacratore@bWaaargh!\n@c3@"
  ja: "@a@bデスピサロ「ぐ…ぐわあぁぁっ……！\n@c3@"
"12":
  de: "@a@b*: Haa... Haa... Haa...\n@c2@"
  en: "@a@b*: Haa... Haa... Haa...\n@c2@"
  es: "@a@b*: Ja, ja, ja...\n@c2@"
  fr: "@a@b*ⓢ Haa... Haa... Haa...\n@c2@"
  it: "@a@b*: Aah... Aah... Aah...\n@c2@"
  ja: "@a@b＊「はあ…　はあ…　はあ……。\n@c2@"
"13":
  de: "@a@b*: Haa... Haa... Da hol mich doch der Teufel! Diese kleine Elfe ist ganz schön flink auf den Beinen.\n@c2@"
  en: "@a@b*: Haa... Haa... Shiver me timbers!\nThat scallywag of an elf certainly be quick on her feet.\n@c2@"
  es: "@a@b*: Ja, ja... ¡Que Neptuno me lleve!\nEsa pillina tiene unos pies realmente rápidos.\n@c2@"
  fr: "@a@b*ⓢ Haa... Haa... Ventrebleuⓠ\nCette bougre d'elfe file comme le vent.\n@c2@"
  it: "@a@b*: Aah... Aah... Tuoni e fulmini! Quell'accidenti di un'elfa è troppo veloce!\n@c2@"
  ja: "@a@b＊「はあ…　はあ……。\n\tくそっ！　見失ったか！\n\t逃げ足の速いエルフだぜ……。\n@c2@"
"14":
  de: "@a@b*: Ha ha ha! Ich sehe dich.\nDu versteckst dich, du kleines Biest!\n@c2@"
  en: "@a@b*: Ho ho ho! I see.\nYe be hiding thar, ye no-good scurvy dog!\n@c2@"
  es: "@a@b*: ¡Jo, jo, jo! Ya veo.\nDebes de estar ahí escondida, ¡pillastre!\n@c2@"
  fr: "@a@b*ⓢ Ho ho hoⓠ Je vois.\nC'est là que tu te caches, espèce de bête galeuseⓠ\n@c2@"
  it: "@a@b*: Oh, oh, oh! Ma guarda un po'! Ti stavi nascondendo, eh?\n@c2@"
  ja: "@a@b＊「はっはっはっ！\n\tそんな所に　かくれてやがったか！\n@c2@"
"15":
  de: "@a@b*: Sobald ich dich und deine Rubintränen in die Finger kriege, bin ich ein reicher Mann.\n@c2@"
  en: "@a@b*: When I get my hands on ye, those ruby tears of yours'll make me a rich man.\n@c2@"
  es: "@a@b*: Cuando te ponga las manos encima, me haré rico con esas lágrimas de rubí tuyas.\n@c2@"
  fr: "@a@b*ⓢ Quand je t'aurai mis la main dessus, tes larmes de rubis feront de moi un homme riche.\n@c2@"
  it: "@a@b*: Dopo che ti avrò catturata, le tue Lacrime di rubino mi renderanno ricco!\n@c2@"
  ja: "@a@b＊「お前さえ　ふんづかまえれば\n\tオレさまも　ルビーの涙で\n\t大金持ちになれるんだ！\n@c2@"
"16":
  de: "@a@b*: Jetzt sei eine brave Elfe und komm raus.\n@c2@"
  en: "@a@b*: Now, just ye come quietly like a good little elf.\n@c2@"
  es: "@a@b*: Ahora, acércate tranquilamente como una buena elfa.\n@c2@"
  fr: "@a@b*ⓢ À présent, approche gentiment, comme une brave petite elfe.\n@c2@"
  it: "@a@b*: Forza, avvicinati... Non farmi arrabbiare...\n@c2@"
  ja: "@a@b＊「さあ　いいコだから\n\tおとなしくするんだぞ。\n@c2@"
"17":
  de: "@a@b*: Hm?\n@c2@"
  en: "@a@b*: Arrr?\n@c2@"
  es: "@a@b*: ¿Arrr?\n@c2@"
  fr: "@a@b*ⓢ Quoiⓡ\n@c2@"
  it: "@a@b*: Eh?\n@c2@"
  ja: "@a@b＊「んんっ？\n@c2@"
"18":
  de: "@a@b*: Ahoi? Ist da jemand?\n@c2@"
  en: "@a@b*: Ahoy? Is somebody there?\n@c2@"
  es: "@a@b*: ¡Eh-oh! ¿Hay alguien ahí?\n@c2@"
  fr: "@a@b*ⓢ Ho-làⓡ Il y a quelqu'unⓡ\n@c2@"
  it: "@a@b*: Ehi! Chi è là!?\n@c2@"
  ja: "@a@b＊「なんだ？　だれか　いるのか！？\n@c2@"
"19":
  de: "@a@b*: Aaahhh!\n@c2@"
  en: "@a@b*: Waaargh!\n@c2@"
  es: "@a@b*: ¡Aaaargh!\n@c2@"
  fr: "@a@b*ⓢ Ouaaarghⓠ\n@c2@"
  it: "@a@b*: Waaargh!\n@c2@"
  ja: "@a@b＊「う…うわああっ！！\n@c2@"
"20":
  de: "@aPsaro@bDas war knapp.\n@c2@"
  en: "@aPsaro@bThat was a close one.\n@c2@"
  es: "@aPsaro@bHa faltado muy poco.\n@c2@"
  fr: "@aPsaro@bÇa n'est pas passé loin.\n@c2@"
  it: "@aPsaro@bC'è mancato poco.\n@c2@"
  ja: "@a@bピサロ「あぶないところだったな。\n@c2@"
"21":
  de: "@a@b*: W-Warst du das?\n@c2@"
  en: "@a@b*: D-Did you do this?\n@c2@"
  es: "@a@b*: ¿Tú has hecho esto?\n@c2@"
  fr: "@a@b*ⓢ C'est... C'est vous qui avez fait çaⓡ\n@c2@"
  it: "@a@b*: Sei s-s-stato tu?\n@c2@"
  ja: "@a@b＊「今のは……　今のは\n\tあなたが　やったのですか？\n@c2@"
"22":
  de: "@aPsaro@bJa. Ich kann nicht einfach so zusehen, wie ein gieriger Mensch auf Elfenjagd geht.\n@c2@"
  en: "@aPsaro@bThat's right. I can't just stand by and let a greedy human go elf-hunting like that.\n@c2@"
  es: "@aPsaro@bAsí es. No puedo permanecer aquí y permitir a un codicioso humano dar caza a una elfa de esa manera.\n@c2@"
  fr: "@aPsaro@bExact. Je ne peux quand même pas rester sans réagir et laisser un humain cupide pourchasser une elfe de la sorte.\n@c2@"
  it: "@aPsaro@bProprio così. Non potevo starmene lì impalato, e lasciare che quell'avido umano se ne andasse tranquillamente a caccia di elfi!\n@c2@"
  ja: "@a@bピサロ「そうだ。\n\t欲深い人間の　エルフ狩りが\n\t目に余ったのでな。\n@c2@"
"23":
  de: "@a@b*: Oh nein! Wie schrecklich!\n@c2@"
  en: "@a@b*: Oh no! How awful!\n@c2@"
  es: "@a@b*: ¡Oh, no! ¡Qué horror!\n@c2@"
  fr: "@a@b*ⓢ Oh nonⓠ C'est horribleⓠ\n@c2@"
  it: "@a@b*: Oh no! Che orrore!\n@c2@"
  ja: "@a@b＊「ひどい……。　なんてことを……。\n@c2@"
"24":
  de: "@aPsaro@bSchrecklich? Aber ich habe dich gerettet. Was ist so schrecklich daran?\n@c2@"
  en: "@aPsaro@bAwful? But I just saved you.\nWhat's so awful about that?\n@c2@"
  es: "@aPsaro@b¿Horror? Pero si te he salvado.\n¿Qué horror supone eso?\n@c2@"
  fr: "@aPsaro@bHorribleⓡ Mais je viens de te sauver.\nQu'est-ce qu'il y a d'horrible à çaⓡ\n@c2@"
  it: "@aPsaro@bChe orrore? Ma se ti ho salvato la vita! Cosa ci trovi di tanto orribile?\n@c2@"
  ja: "@a@bピサロ「……ひどい？\n\tわたしは　お前を助けたのだぞ。\n\tそれを　ひどいというのか？\n@c2@"
"25":
  de: "@a@b*: Warum nur immer diese Gewalt?\nDie Menschen sind doch auch Geschöpfe der Göttin, genau wie wir.\n@c2@"
  en: "@a@b* There's no need for violence.\nHumans are the Goddess's creatures, just like us.\n@c2@"
  es: "@a@b*: No hay razón para emplear la violencia.\nLos humanos son criaturas de la Diosa, al igual que nosotros.\n@c2@"
  fr: "@a@b*ⓢ La violence est inutile.\nLes humains sont des créatures de la Déesse, tout comme nous.\n@c2@"
  it: "@a@b*: La violenza non risolve nulla. Gli umani sono creature della dea, proprio come lo siamo noi.\n@c2@"
  ja: "@a@b＊「なにも殺さなくても……。\n\t人間だって　わたしたちと同じ\n\t生きとし生ける者なのに……。\n@c2@"
"26":
  de: "@aPsaro@b...\n@c2@"
  en: "@aPsaro@b...\n@c2@"
  es: "@aPsaro@b...\n@c2@"
  fr: "@aPsaro@b............\n@c2@"
  it: "@aPsaro@b...\n@c2@"
  ja: "@a@bピサロ「………………。\n@c2@"
"27":
  de: "@aPsaro@bHa ha ha! Ihr Elfen seid schon komisch! Wirklich amüsant!\n@c2@"
  en: "@aPsaro@bHa ha ha! You elves are funny things!\nI'm quite tickled!\n@c2@"
  es: "@aPsaro@b¡Ja, ja, ja! ¡Los elfos decís cosas muy divertidas!\n¡Es muy gracioso!\n@c2@"
  fr: "@aPsaro@bHa ha haⓠ Vous êtes drôles, vous les elfesⓠ\nJe trouve ça très amusantⓠ\n@c2@"
  it: "@aPsaro@bAh! Ah! Ah! Voi elfi siete proprio ridicoli! Sono davvero commosso...\n@c2@"
  ja: "@a@bピサロ「わっはっはっ！\n\tエルフとは　妙な生き物だな！\n\tおもしろい！　気に入ったぞ！\n@c2@"
"28":
  de: "@aPsaro@bSag, junge Elfe, wie ist denn dein Name?\n@c2@"
  en: "@aPsaro@bSo tell me, young elf girl, what's your name?\n@c2@"
  es: "@aPsaro@bDime, joven elfa, ¿cuál es tu nombre?\n@c2@"
  fr: "@aPsaro@bAlors dis-moi, jeune fille elfe, comment t'appelles-tuⓡ\n@c2@"
  it: "@aPsaro@bDimmi, giovane elfa, qual è il tuo nome?\n@c2@"
  ja: "@a@bピサロ「エルフの娘。\n\t名は　なんというのだ。\n@c2@"
"29":
  de: "@a@b*: Mein Name? Wir Waldwesen haben keine Namen.\n@c2@"
  en: "@a@b*: My name? We creatures of the forest have no need for names.\n@c2@"
  es: "@a@b*: ¿Mi nombre? Nosotras, las criaturas del bosque, no necesitamos nombres.\n@c2@"
  fr: "@a@b*ⓢ Comment je m'appelleⓡ Nous autres, créatures de la forêt, n'avons pas besoin de noms.\n@c2@"
  it: "@a@b*: Il mio nome? Noi creature della foresta non abbiamo nomi.\n@c2@"
  ja: "@a@b＊「……名前？\n\tわたしたち　森に暮らす者に……\n\t名前など　ありません。\n@c2@"
"30":
  de: "@aPsaro@bAch, ist das so? Aber ich kann dich doch nicht weiter ⓞjunge Elfeⓟ nennen, oder?\n@c2@"
  en: "@aPsaro@bHmm, is that so? But I can hardly just keep calling you ⓗyoung elf girlⓘ now, can I?\n@c2@"
  es: "@aPsaro@bMmm, ¿es eso cierto? Pero no puedo estar llamándote ''joven elfa'' siempre, ¿no es así?\n@c2@"
  fr: "@aPsaro@bMmm, vraimentⓡ Mais je peux difficilement continuer à t'appeler ⓥjeune fille elfeⓦ, quand mêmeⓡ\n@c2@"
  it: "@aPsaro@bDavvero? Ah, sciocchezze! Non posso mica continuare a chiamarti ⓕgiovane elfaⓖ, no?\n@c2@"
  ja: "@a@bピサロ「うーむ　そういうものか。\n\tしかし　エルフの娘では\n\t呼ぶにも　面倒だな。\n@c2@"
"31":
  de: "@aPsaro@bVon heute an wirst du Rosi heißen.\n@c2@"
  en: "@aPsaro@bFrom today onwards, you'll be known as Rose.\n@c2@"
  es: "@aPsaro@bDe hoy en adelante, Rosa será tu nombre.\n@c2@"
  fr: "@aPsaro@bÀ partir d'aujourd'hui, on t'appellera Rose.\n@c2@"
  it: "@aPsaro@bD'ora in avanti il tuo nome sarà Rosa.\n@c2@"
  ja: "@a@bピサロ「よし。　ならば　お前は\n\t今日から　ロザリーと名乗るといい。\n@c2@"
"32":
  de: "@a@b*: Rosi?\n@c2@"
  en: "@a@b*: Rose?\n@c2@"
  es: "@a@b*: ¿Rosa?\n@c2@"
  fr: "@a@b*ⓢ Roseⓡ\n@c2@"
  it: "@a@b*: Rosa?\n@c2@"
  ja: "@a@b＊「ロザリー……？\n@c2@"
"33":
  de: "@aPsaro@bRosi, nach dem Dorf, in dem ich so nett aufgenommen wurde. Magst du den Namen nicht?\n@c2@"
  en: "@aPsaro@bIt's after the village where I've been made to feel so welcome. Don't you like it?\n@c2@"
  es: "@aPsaro@bEn honor al pueblo en el que me sentí tan bienvenido. ¿No te gusta?\n@c2@"
  fr: "@aPsaro@bCela vient du nom du village où je me suis senti si bien accueilli. Ça ne te plaît pasⓡ\n@c2@"
  it: "@aPsaro@bSì. Mi è venuto in mente pensando al nome del villaggio dove mi hanno accolto così bene. Non ti piace?\n@c2@"
  ja: "@a@bピサロ「わたしが　地上で\n\t世話になっている村から\n\tとった名だ。　気に入らないか？\n@c2@"
"34":
  de: "@a@b*: Doch, ich mag ihn. Es ist nur so, dass... kein Mensch mich bisher mit einem Namen angesprochen hat.\n@c2@"
  en: "@a@b*: No, I like it. It's just that...no human has ever called me by a name before.\n@c2@"
  es: "@a@b*: No es eso, me gusta. Es solo que... ningún humano me había llamado antes con un nombre.\n@c2@"
  fr: "@a@b*ⓢ Si, ça me plaît. C'est juste que... aucun humain ne m'avait jamais appelée par un nom jusqu'à aujourd'hui.\n@c2@"
  it: "@a@b*: No, mi piace. Solo che nessun umano mi aveva mai chiamata per nome prima d'ora...\n@c2@"
  ja: "@a@b＊「いえ。　ただ　今まで人に名前で\n\t呼ばれたことが　ないので……。\n@c2@"
"35":
  de: "@aPsaro@bRosi. Eines Tages bringe ich dich in dieses Dorf.\n@c2@"
  en: "@aPsaro@bRose. One day I'd love to take you to that village.\n@c2@"
  es: "@aPsaro@bRosa. Me encantaría llevarte a ese pueblo algún día.\n@c2@"
  fr: "@aPsaro@bRose. Un jour, j'aimerais beaucoup t'emmener dans ce village.\n@c2@"
  it: "@aPsaro@bRosa, un giorno mi piacerebbe portarti in quel villaggio.\n@c2@"
  ja: "@a@bピサロ「ロザリー。　いつか　お前を\n\tその村に　招待しよう。\n@c2@"
"36":
  de: "@aPsaro@bDoch bis dahin passt du gut auf, dass kein Mensch dir etwas Böses antut, verstanden?\n@c2@"
  en: "@aPsaro@bUntil that day, you make sure no human manages to get his hands on you, do you hear?\n@c2@"
  es: "@aPsaro@bHasta entonces, me aseguraré de que ningún humano te ponga la mano encima, ¿me oyes?\n@c2@"
  fr: "@aPsaro@bD'ici là, tu dois faire en sorte qu'aucun humain ne réussisse à t'attraper, c'est comprisⓡ\n@c2@"
  it: "@aPsaro@bFino a quel giorno, cerca di non farti catturare dagli umani, d'accordo?\n@c2@"
  ja: "@a@bピサロ「それまで\n\t人間どもに　つかまらぬよう\n\t気をつけるのだぞ。\n@c2@"
"37":
  de: "@aPsaro@bWir werden uns bald wiedersehen.\nMein Name ist übrigens Psaro.\nVergiss das nicht.\n@c2@"
  en: "@aPsaro@bWe'll meet again soon.\nMy name is Psaro.\nDon't forget.\n@c2@"
  es: "@aPsaro@bVolveremos a vernos pronto.\nMi nombre es Psaro.\nNo lo olvides.\n@c2@"
  fr: "@aPsaro@bNous nous reverrons bientôt.\nJe m'appelle Psaro.\nN'oublie pas.\n@c2@"
  it: "@aPsaro@bCi rivedremo presto. Il mio nome è Psaro, non dimenticarlo...\n@c2@"
