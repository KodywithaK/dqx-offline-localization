"45":
  de: "@aPsaro@bRosi... Bist du das wirklich? Heißt das etwa, dass ich in der nächsten Welt bin?\n@c2@"
  en: "@aPsaro@bRose... Is that really you?\nThen...does that mean I'm in the next world?\n@c2@"
  es: "@aPsaro@bRosa... ¿Eres tú de verdad?\nEntonces... ¿significa esto que me hallo en el otro mundo?\n@c2@"
  fr: "@aPsaro@bRose... Est-ce vraiment toiⓡ\nAlors... est-ce que ça veut dire que je suis dans l'autre mondeⓡ\n@c2@"
  it: "@aPsaro@bRosa... Sei davvero tu?! Allora mi trovo nell'altro mondo...?\n@c2@"
  ja: "@a@bピサロ「ロザリー……。\n\tロザリーなのか？\n\tならば　ここは死の国なのか……？\n@c2@"
"46":
  de: "@aRosi@bNein. %0%a00090 und %A090%Xseine%Z%B090%Xihre%Z Freunde haben mich mit einer Yggdrasil-Blume wieder zum Leben erweckt.\n@c1@"
  en: "@aRose@bNo. %0%a00090 and %A090%Xhis%Z%B090%Xher%Z friends used an Yggdrasil flower to bring me back to life.\n@c1@"
  es: "@aRosa@bNo. %0%a00090 y sus amigos utilizaron una flor de Yggdrasil para devolverme la vida.\n@c1@"
  fr: "@aRose@bNon. %0%a00090 et ses amis ont utilisé une fleur d'Yggdrasil pour me ramener à la vie.\n@c1@"
  it: "@aRosa@bNo. %0%a00090 e i suoi amici hanno usato un fiore di Ygdrasil per riportarmi in vita.\n@c1@"
  ja: "@a@bロザリー「いえ。　%a00090さんたちが\n\t世界樹の花で　わたしに　再び\n\t生命を　与えてくださったのです。\n@c1@"
"47":
  de: "@aRosi@bIch weiß, dass sich das komisch anhört, aber die Menschen, die mich entführt haben, wurden von einem Monster kontrolliert.\n@c1@"
  en: "@aRose@bAnd I know it sounds strange, but the people who kidnapped me were actually being controlled by some monster.\n@c1@"
  es: "@aRosa@bY sé que suena extraño, pero algún tipo de monstruo ejercía el control sobre la gente que me secuestró.\n@c1@"
  fr: "@aRose@bEt je sais que cela semble étrange, mais les gens qui m'ont enlevée étaient en réalité contrôlés par un monstre.\n@c1@"
  it: "@aRosa@bSo che la cosa ti sembrerà assurda, ma gli umani che mi hanno rapita erano controllati da un mostro.\n@c1@"
  ja: "@a@bロザリー「そして　信じがたいのですが…\n\tわたしを　さらったのは\n\t魔族にあやつられた人々かと……。\n@c1@"
"48":
  de: "@aPsaro@bIch verstehe...\n@c2@"
  en: "@aPsaro@bI see...\n@c2@"
  es: "@aPsaro@bComprendo...\n@c2@"
  fr: "@aPsaro@bJe vois...\n@c2@"
  it: "@aPsaro@bCapisco...\n@c2@"
