"0":
  de: "@a@b*: Willkommen in der Goldbank ⓞHinterm Regenbogenⓟ, wo wir Euer hart erarbeitetes Gold vor Monstern und Verbrechern schützen.\n@c2@"
  en: "@a@b*: Welcome to Rainbow's End Gold Bank, protectin' yer hard earned gold from the likes of monsters and criminals.\n@c2@"
  es: "@a@b*: %H860%X%A120%XBienvienido%Z%B120%XBienvienida%Z%Y%R000%XBienvenidas%YBienvenidos%Z%Z al banco Las Mil y Una Noches.\n@c2@"
  fr: "@a@b*ⓢ Bienvenue à la Banque du Trésor de l'Arc-en-ciel, qui protège vos économies durement gagnées contre les monstres et les bandits de grand chemin.\n@c2@"
  it: "@a@b*: Salve! Huesta è la Banca dell'Arcobaleno! Proteggiamo i vostri sudati risparmi da mostri, ladri e affini!\n@c2@"
  ja: "@a@b＊「愛と信頼のゴールド銀行へ　ようこそ。\n\tみなさまの　たいせつな　お金を\n\t魔物などから　お守りします。\n@c2@"
"1":
  de: "@a@b*: Hier akzeptieren wir nur Transaktionen in Tausender-Einheiten, das gilt sowohl für Einzahlungen als auch für Auszahlungen.\n@c2@"
  en: "@a@b*: Here at Rainbow's End we only deal in units of a thousand gold coins. That goes for deposits an' withdrawals alike.\n@c2@"
  es: "@a@b*: En Las Mil y Una Noches triatamos solo con unidades de mil moniedas de oro. Tanto para ingriesos como para reintiegros.\n@c2@"
  fr: "@a@b*ⓢ Ici, à la Banque de l'Arc-en-ciel, nous ne comptons qu'en milliers de pièces d'or, et ce aussi bien pour les dépôts que pour les retraits.\n@c2@"
  it: "@a@b*: Alla Banca dell'Arcobaleno si lavora con unità minime da mille monete d'oro, e questo vale sia pe' depositi sia pe' prelievi.\n@c2@"
  ja: "@a@b＊「お預かりも　お引き出しも\n\t１０００ゴールド単位で\n\tうけたまわります。\n@c2@"
"2":
  de: "@a@b*: Also, %a00110...\nWas können wir für Euch tun?\n@c2@"
  en: "@a@b*: So, %a00110...\nWhat can we be doin' fer ye?\n@c2@"
  es: "@a@b*: Entonces, %a00110...\n¿Qué podiemos hacer por usted?\n@c2@"
  fr: "@a@b*ⓢ Alors, %a00110...\nQu'est-ce que je peux faire pour vousⓡ\n@c2@"
  it: "@a@b*: Allora, %a00110...\nChe si pole fa' pe' te?\n@c2@"
  ja: "@a@b＊「%a00110さまは\n\tどんな　ご用でしょう？\n@c2@"
"3":
  de: "@a@b*: Es tut mir wirklich leid, %A110%Xder Herr%Z%B120%Xdie Dame%Z, aber der Tresor ist voll. Wir können keine Einzahlungen mehr annehmen.\n@c2@"
  en: "@a@b*: I'm terribly sorry, %A110%Xsir%Z%B120%Xma'am%Z, but it seems the vault's full already. We can't be acceptin' any more deposits, like.\n@c2@"
  es: "@a@b*: Lo siento mucho, %A110%Xcaballiero%Z%B120%Xsieñora%Z, pero pariece que la caja fuerte ya está llena. No podemos acieptar más diepósitos, sí.\n@c2@"
  fr: "@a@b*ⓢ Je suis vraiment désolée, %A110%Xm'sieur%Z%B120%Xm'dame%Z, mais notre chambre forte est pleine. Nous ne pouvons plus accepter de dépôt.\n@c2@"
  it: "@a@b*: Mi spiace, %A110%Xsignore%Z%B120%Xsignorina%Z, ma la hassaforte della banca l'è piena. 'Un si possono accetta' altri depositi.\n@c2@"
  ja: "@a@b＊「お客さま　申しわけありませんが\n\tわたくしどもの金庫が　いっぱいで\n\tこれ以上　お預かりできません。\n@c2@"
"4":
  de: "@a@b*: Wir nehmen Euer Gold gerne. Aber wir akzeptieren nur Einzahlungen in Tausender-Einheiten.\nAlso... Wie viel wollt Ihr heute einzahlen?\n@c2@"
  en: "@a@b*: Sure an' we'd be happy to accept yer gold. But we only deal in units of a thousand coins. So... How much would ye be leavin' with us today?\n@c2@"
  es: "@a@b*: Estariemos encantados de acieptar su oro. Pero solo tratamos con unidades de mil moniedas. Entonces... ¿qué cantidad diesea diepositar hoy?\n@c2@"
  fr: "@a@b*ⓢ Pas de problème, nous sommes ravis que vous ayez décidé de nous confier votre or, mais nous ne prenons les dépôts que par tranches de mille.\n㈡\n*ⓢ Alors... combien vous voulez déposer aujourd'huiⓡ\n@c2@"
  it: "@a@b*: Certo che si piglia i'vvostro oro, ma noi si lavora solo in unità da mille monete. Allora, huanto voi deposita' oggi?\n@c2@"
  ja: "@a@b＊「ご入金は　１０００ゴールド単位で\n\tうけたまわります。\n\tいくら　お預かりしましょうか？\n@c2@"
"5":
  de: "@a@b*: Ich will ja nicht unhöflich sein oder so, aber so viel habt Ihr gar nicht dabei.\n@c2@"
  en: "@a@b*: I don't mean to be rude or nuttin', but ye don't have that much on ye, so ye don't.\n@c2@"
  es: "@a@b*: Sin ánimo de ofiender, no lleva esa cantidad encima.\n@c2@"
  fr: "@a@b*ⓢ Je ne voudrais pas paraître désagréable, mais vous n'avez pas cette somme sur vous.\n@c2@"
  it: "@a@b*: Un vorrei esse' troppo brusca, ma mi pare che te 'un c'abbia tutto huesto denaro...\n@c2@"
  ja: "@a@b＊「しつれいですが\n\tお客さまは　今　それほど\n\tおもちでは　ないようです。\n@c2@"
"6":
  de: "@a@b*: Tut mir leid, aber im Tresor ist zurzeit kaum noch Platz frei. Wir können höchstens noch %a00520 Goldmünzen verkraften.\n@c2@"
  en: "@a@b*: I'm sorry, but there's barely any space left in the vault at the moment. The most we can accept is %a00520 gold coins.\n@c2@"
  es: "@a@b*: Lo siento, pero apienas queda espacio en la caja fuerte en estos momientos. Podiemos acieptar como máximo %a00520 moniedas de oro.\n@c2@"
  fr: "@a@b*ⓢ Je suis désolée, mais nous n'avons plus assez de place dans notre chambre forte. Nous ne pouvons accepter que %a00520 pièces d'or maximum.\n@c2@"
  it: "@a@b*: Mi spiace, ma in questo momento 'un ci s'ha molto spazio nella hassaforte, e 'un si possono accetta' più di %a00520 monete d'oro.\n@c2@"
  ja: "@a@b＊「申しわけありませんが　金庫のあきが\n\t少なくて　%a00520ゴールドしか\n\tお預かりできません。\n@c2@"
"7":
  de: "@a@b*: %a00490 Goldmünzen, wie?\nGut, wird gleich im Tresor eingeschlossen. Kein Grund zur Sorge!\n@c2@"
  en: "@a@b*: %a00490 gold coins, is it?\nRight, we'll lock it up in the vault straight away. Ye've no need to worry.\n@c2@"
  es: "@a@b*: %a00490 monedas de oro, ¿vierdad?\nMuy bien, lo guardaremos en la caja fuerte de inmiediato. No si priocupe.\n@c2@"
  fr: "@a@b*ⓢ Vous déposez %a00490 pièces d'or, c'est çaⓡ\nNous allons mettre tout ça dans notre chambre forte.\nPas d'inquiétudeⓠ\n@c2@"
  it: "@a@b*: Uhm, %a00490 monete d'oro?\nBene. Le si mette subito nella hassaforte. 'Un ti preoccupa', che ora il tu' denaro l'è al sihuro.\n@c2@"
  ja: "@a@b＊「%a00490ゴールドですね。\n\tでは　責任をもって\n\tお預かりいたします。\n@c2@"
"8":
  de: "@a@b*: E-Es tut mir leid, %A110%Xder Herr%Z%B120%Xdie Dame%Z, aber wie's aussieht, habt Ihr zurzeit keine einzige Goldmünze bei uns deponiert.\n@c2@"
  en: "@a@b*: I-I'm sorry, %A110%Xsir%Z%B120%Xma'am%Z, but ye don't appear to have even one gold coin deposited with us at the moment.\n@c2@"
  es: "@a@b*: Lo siento, %A110%Xcaballiero%Z%B120%Xsieñora%Z, pero al pariecer no tiene depositada cantidad alguna en nuestro banco en este momiento.\n@c2@"
  fr: "@a@b*ⓢ Je... Je suis désolée, %A110%Xm'sieur%Z%B120%Xm'dame%Z, mais vous n'avez pas l'ombre d'une pièce d'or chez nous.\n@c2@"
  it: "@a@b*: Maremma squattrinata, %A110%Xsignore%Z%B120%Xsignorina%Z. Mi sembra che te 'un c'abbia nemmeno mezza moneta depositata nella nostra banca.\n@c2@"
  ja: "@a@b＊「えっ？　お客さまのお金は\n\t１ゴールドも　お預かりして\n\tいませんが……。\n@c2@"
"9":
  de: "@a@b*: Zurzeit sind %a00480 Goldmünzen auf Ihrem Konto.\nAlso, wie viel wollt Ihr heute abheben, %A110%Xder Herr%Z%B120%Xdie Dame%Z?\n@c2@"
  en: "@a@b*: Yer current balance is %a00480 gold coins.\nSo how much will ye be lookin' to withdraw today, %A110%Xsir%Z%B120%Xma'am%Z?\n@c2@"
  es: "@a@b*: Su saldo actual es de %a00480 moniedas de oro.\n¿Qué cantidad le intieresaría retirar hoy, %A110%Xcaballiero%Z%B120%Xsieñora%Z?\n@c2@"
  fr: "@a@b*ⓢ Votre solde est de %a00480 pièce%I480%X%Ys%Z d'or.\nCombien vous voulez retirer aujourd'hui, %A110%Xm'sieur%Z%B120%Xm'dame%Zⓡ\n@c2@"
  it: "@a@b*: Il tu' saldo attuale è di %a00480 monete d'oro.\nHuanto voi preleva' oggi, %A110%Xsignore%Z%B120%Xsignorina%Z?\n@c2@"
  ja: "@a@b＊「現在　%a00480ゴールド\n\tお預かりしていますが\n\tいくら　お引き出しいたしますか？\n@c2@"
"10":
  de: "@a@b*: Sicher, das wär 'ne stolze Summe! Aber Ihr habt gar nicht so viel auf der Bank, Ihr Dummⓚⓛ äh, ich meine, %A110%Xder Herr%Z%B120%Xdie Dame%Z...\n@c2@"
  en: "@a@b*: Sure an' that'd be a fine sum, so it would!\nBut ye don't have that much in the bank, y'eejⓚⓛ\nAhem! I mean, %A110%Xsir%Z%B120%Xma'am%Z...\n@c2@"
  es: "@a@b*: ¡Una suma espliéndida, sí!\nPero no dispone de esa cantidad en nuestro banco, piedazo de... ¡Ejem! Quiero diecir, %A110%Xcaballiero%Z%B120%Xsieñora%Z...\n@c2@"
  fr: "@a@b*ⓢ Eh bien, c'est une sacrée sommeⓠ Le problème, c'est que j'ai pas assez en banque, m%A110%Xon g%Z%B120%Xa fi%Z... euh, %A110%Xm'sieur%Z%B120%Xm'dame%Z...\n@c2@"
  it: "@a@b*: Certo l'è una bella cifra!\n㈡\nPurtroppo te 'un ce l'hai tanti huattrini depositati da noi, %A110%Xcaro il mi' furbetto... Cioè, volevo dire, egregio signore%Z%B120%Xcara la mi' furbetta... Cioè, volevo dire, egregia signora%Z...\n@c2@"
  ja: "@a@b＊「そんなに　たくさん\n\tお預かりしておりませんが……。\n@c2@"
"11":
  de: "@a@b*: Tut mir leid, aber so viel Gold kann kein Mensch tragen.\n@c2@"
  en: "@a@b*: I'm afraid that's more gold than a %A110%Xfeen%Z%B120%Xwan%Z can carry.\n@c2@"
  es: "@a@b*: Mi tiemo que eso es más oro del que puede llevar %A110%Xun caballiero%Z%B120%Xuna dama%Z.\n@c2@"
  fr: "@a@b*ⓢ Je suis désolée, mais c'est plus d'or qu'un%A110%X gars%Z%B120%Xe donzelle%Z peut en transporter.\n@c2@"
  it: "@a@b*: Mi spiace, ma questa cifra l'è più alta di huanto poi porta' con te.\n@c2@"
  ja: "@a@b＊「そんなに　たくさん　もてませんよ。\n@c2@"
"12":
  de: "@a@b*: Also %a00550, wie?\nNa gut. Hier, bitte sehr...\n@c2@"
  en: "@a@b*: So it'll be %a00550, will it?\nAye, well. Here y'are...\n@c2@"
  es: "@a@b*: Así que sierán %a00550, ¿no?\nBueno, de acuerdo, sí. Aquí están...\n@c2@"
  fr: "@a@b*ⓢ Alors vous voulez %a00550 pièces d'or, c'est çaⓡ\nEntendu. Les voilà...\n@c2@"
  it: "@a@b*: Allora si fa %a00550, vero?\nBene. Ecco qua.\n@c2@"
  ja: "@a@b＊「%a00550ゴールドですね。\n\tはい　どうぞ。\n@c2@"
"13":
  de: "@a@b*: Ihr habt's Euch anders überlegt, wie?\nKeine Bange. Die Goldbank ⓞHinterm Regenbogenⓟ ist immer für Euch da.\n@c2@"
  en: "@a@b*: Ye've changed yer mind, have ye?\nNot to worry. Rainbow's End Gold Bank'll be here fer ye when ye need it.\n@c2@"
  es: "@a@b*: Ha cambiado de idea, ¿no?\nNo si priocupe. El banco Las Mil y Una Noches sieguirá aquí para cuando lo niecesite.\n@c2@"
  fr: "@a@b*ⓢ Vous avez changé d'avis, c'est çaⓡ\nPas de problème. La Banque du Trésor de l'Arc-en-ciel est à votre service.\n@c2@"
  it: "@a@b*: O che, te tu ha hambiato idea?\n'Un ti preoccupa', tanto la Banca dell'Arcobaleno 'un si move da qui. Torna pure huando ti pare.\n@c2@"
  ja: "@a@b＊「おやめに　なるのですね。\n@c2@"
"14":
  de: "@a@b*: Zurzeit sind %a00480 Goldmünzen sicher in unserem Tresor deponiert. Vielen Dank.\n@c2@"
  en: "@a@b*: At the moment, ye've %a00480 gold coins safely tucked away in our vault. Thank you very much.\n@c2@"
  es: "@a@b*: En este momiento dispone de %a00480 moniedas de oro guardadas en nuestra caja con total sieguridad. Muchas gracias.\n@c2@"
  fr: "@a@b*ⓢ En ce moment, vous avez %a00480 pièces d'or qui attendent sagement dans notre chambre forte.\nMerci beaucoup.\n@c2@"
  it: "@a@b*: In questo momento te tu c'hai %a00480 monete d'oro depositate nella hassaforte della banca.\n@c2@"
  ja: "@a@b＊「現在　%a00480ゴールド\n\tお預かりしています。\n\tありがとうございました。\n@c2@"
"15":
  de: "@a@b*: Wir haben zurzeit kein Gold von Euch, %a00110. Aber wir stehen Euch jederzeit zu Diensten.\n@c2@"
  en: "@a@b*: We're not keepin' any gold fer yerself at the moment, %a00110. But we look forward to servin' ye again in the future.\n@c2@"
  es: "@a@b*: No tienemos oro de su priopiedad en este momiento, %a00110. Pero espieramos poder sierle de utilidad en el futuro.\n@c2@"
  fr: "@a@b*ⓢ Vous n'avez aucune pièce d'or déposée chez nous en ce moment, %a00110.\nMais n'hésitez pas à revenir nous voir.\n@c2@"
  it: "@a@b*: Ora te 'un c'hai nemmeno una monetina piccina hosì depositata qui da noi, %a00110. Ma torna a trovarci presto!\n@c2@"
  ja: "@a@b＊「現在は　%a00110さまからの\n\tお預かり金は　ございません。\n\tまたのご利用を　おまちしています。\n@c2@"
"16":
  de: "@a@b*: Willkommen in der Goldbank ⓞHinterm Regenbogenⓟ.\n@c2@"
  en: "@a@b*: Welcome to Rainbow's End Gold Bank.\n@c2@"
  es: "@a@b*: %H860%X%A120%XBienvienido%Z%B120%XBienvienida%Z%Y%R000%XBienvenidas%YBienvienidos%Z%Z al banco Las Mil y Una Noches.\n@c2@"
  fr: "@a@b*ⓢ Bienvenue à la Banque du Trésor de l'Arc-en-ciel.\n@c2@"
  it: "@a@b*: Salve! Huesta è la Banca dell'Arcobaleno.\n@c2@"
  ja: "@a@b＊「愛と信頼の　ゴールド銀行へ　ようこそ。\n@c2@"
"17":
  de: "@a@b*: Auf Eurem Konto hier sind zurzeit %a00480 Goldmünzen, %a00110. Wie können wir Euch heut behilflich sein?\n@c2@"
  en: "@a@b*: Yer current balance with us is %a00480 gold coins, %a00110. And how can we be helpin' ye today, then?\n@c2@"
  es: "@a@b*: Su saldo actual con nosotros es de %a00480 moniedas de oro, %a00110. ¿En qué piodemos siervirle hoy?\n@c2@"
  fr: "@a@b*ⓢ Votre solde est de %a00480 pièce%I480%X%Ys%Z d'or, %a00110.\nQu'est-ce que je peux faire pour vousⓡ\n@c2@"
  it: "@a@b*: Il tu' saldo attuale l'è di %a00480 monete d'oro, %a00110. Che si pole fa' pe' te oggi?\n@c2@"
  ja: "@a@b＊「%a00110さまからは　現在\n\t%a00480ゴールド　お預かり\n\tしています。　ご用は　なんでしょう？\n@c2@"
"18":
  de: "@a@b*: In unserem Tresor lagert zurzeit kein Gold von Euch, %a00110. Aber vielleicht können wir Euch sonst irgendwie behilflich sein?\n@c2@"
  en: "@a@b*: We don't have any gold of yerself's in the vault at the moment, %a00110. But can we be helpin' ye still an' all, perhaps?\n@c2@"
  es: "@a@b*: No guardamos oro de su priopiedad en nuestra caja en este momiento, %a00110. ¿Podiemos serle útil de algún otro modo?\n@c2@"
  fr: "@a@b*ⓢ Nous n'avons pas d'or à vous en ce moment, %a00110. Je peux peut-être quand même vous aiderⓡ\n@c2@"
  it: "@a@b*: In questo momento te 'un c'hai nemmeno il becco d'un quattrino depositato qui da noi, %a00110. Che si pole fa' pe' te?\n@c2@"
  ja: "@a@b＊「現在は　%a00110さまからの\n\tお預かり金は　ございません。\n\tご用は　なんでしょう？\n@c2@"
"19":
  de: "@a@b*: Und wir verlangen noch nicht mal Gebühren!\n@c2@"
  en: "@a@b*: And we don't even charge ye any fees!\n@c2@"
  es: "@a@b*: ¡Y no cobriamos comisiones!\n@c2@"
  fr: "@a@b*ⓢ Et notre banque ne prend aucun fraisⓠ\n@c2@"
  it: "@a@b*: E 'un si fanno nemmeno paga' le hommissioni!\n@c2@"
  ja: "@a@b＊「もちろん　手数料などは\n\tいっさい　いただきません！\n@c2@"
