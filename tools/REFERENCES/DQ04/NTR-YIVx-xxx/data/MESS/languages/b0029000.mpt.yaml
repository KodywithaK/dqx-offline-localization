"0":
  de: "@aTimo@bPapa! Ich muss dir was sagen. Der Wirt hat gesagt, dass er dir was sagen muss. Und... das ist alles, was ich zu sagen habe...\n@c1@"
  en: "@aTipper@bDa! I've sometin' to tell ya. The innkeeper said he'd sometin' to tell ya. An'...that's what I had to tell ya...\n@c1@"
  es: "@aTarik@b¡Papi! Tiengo que diecirte algo.\nEl posadero dijo que tienía algo que diecirte.\nY... ya está, eso es lo que tienía que diecirte.\n@c1@"
  fr: "@aAchille@bP'paⓠ J'ai un message pour toi.\nL'aubergiste a quelque chose à te dire.\nEt... et c'est tout, en fait...\n@c1@"
  it: "@aBalduccio@bEhi, babbone, c'ho da dirti roba. I'ppadrone del negozio dice che c'ha da dirti roba. Sì, c'avevo huesta roba da dirti...\n@c1@"
  ja: "@a@bポポロ「あっ　パパ。\n\tあのね　宿屋のおじちゃんが\n\t話があるって　言ってたよ。\n@c1@"
"1":
  de: "@a@b*: Hallo, Torneko, alles klar?\nUnd wie geht's deiner hübschen Frau?\n@c2@"
  en: "@a@b*: How's she cuttin', Torneko?\nAn' how's that gorgeous wife o' yours?\n@c2@"
  es: "@a@b*: ¿Cómo ti va la vida, Torneko?\n¿Y cómo está esa prieciosa mujier tuya?\n@c2@"
  fr: "@a@b*ⓢ Comment ça va, Tornekoⓡ Et votre jolie petite dameⓡ\n@c2@"
  it: "@a@b*: Ehi, Baldo, o che hai di nuovo fatto arrabbia' la tu' deliziosa mogliettina?\n@c2@"
  ja: "@a@b＊「よお　トルネコ！\n\tネネさんは　元気にしてるかい？\n@c2@"
"2":
  de: "@a@b*: Ich hab nie kapiert, warum so ein heißer Feger wie Tessa ausgerechnet einen Nichtsnutz wie dich geheiratet hat.\n@c2@"
  en: "@a@b*: I'll never understand why a fine article like Tessie married a good-fer-nuttin' bog-trotter like you.\n@c2@"
  es: "@a@b*: Nunca entienderé cómo una rieina mora como Trakiba se casó con un vago gañián como tú.\n@c2@"
  fr: "@a@b*ⓢ Je comprendrai jamais comment un joli p'tit lot comme Lucille a pu épouser un bon à rien dans vot' genre.\n@c2@"
  it: "@a@b*: 'Un capirò mai come una donna di hlasse come Beatrice abbia potuto sposa' un bono a nulla come te!\n@c2@"
  ja: "@a@b＊「まったく　あんな美人が\n\tどうして　お前みたいなのと\n\t結婚したのか　不思議だぜ。\n@c2@"
"3":
  de: "@a@b*: Und ich, ich bin immer noch allein, und das in meinem Alter. Du bist wirklich ein Glückspilz, Torneko.\n@c2@"
  en: "@a@b*: An' here's meself, all on me own still at my age. I'm as green as grass an' you must be hidin' a\nfour-leaf clover somewhere.\n@c2@"
  es: "@a@b*: Y aquí mi tienes a mí, todavía siolo, a mi edad, más inociente que un camiello recién nacido. Tú tienes baraka.\n@c2@"
  fr: "@a@b*ⓢ Et regardez-moiⓠ Toujours pas marié, à mon âge. À mon avis, z'avez une patte de lapin planquée quelque part.\n@c2@"
  it: "@a@b*: E io, alla mi' età sono ancora solo. E sono rigoglioso come un prato in fiore! Ma che c'avrai te che io 'un c'ho?!\n@c2@"
  ja: "@a@b＊「オレなんて　このトシまで\n\t独り身だってのによう……。\n\tうらやましいぜ　コンチクショウ！\n@c2@"
"4":
  de: "@aDer Alte Hans@bTorneko, ich hab großartige Neuigkeiten. Mein Sohn ist zurück!\n@c2@"
  en: "@aOld Man Finn@bAh, Torneko, me lad. I've grand tidin's, so I have. Me son's come home!\n@c2@"
  es: "@aViejo Bin@b¡Oh!, Torneko, amigo. Tiengo grandes noticias, vaya si las tiengo. ¡Mi hijo ha vuelto a casa!\n@c2@"
  fr: "@aFlinn l'Ancien@bAh, Torneko, mon ami. J'ai de grandes nouvelles.\nMon fils est rentré à la maisonⓠ\n@c2@"
  it: "@aIl vecchio Santino@bEhi, Baldo, ragazzo mio! Ci sono novità, sai? Il mi' figliolo l'è tornato a casa!\n@c2@"
  ja: "@a@bトム「おお　トルネコ！\n\tわしの息子が　帰ってきたのじゃ！\n@c2@"
"5":
  de: "@aDer Alte Hans@bAnscheinend hat die Göttin meine Gebete doch noch erhört.\n@c2@"
  en: "@aOld Man Finn@bIt looks like the Goddess was listenin' after all.\nMe prayers have been answered.\n@c2@"
  es: "@aViejo Bin@bPariece que después de tiodo, la Diosa mi ha escuchiado.\nMis oriaciones han sido escuchiadas.\n@c2@"
  fr: "@aFlinn l'Ancien@bLa Déesse a dû entendre mes prières.\nMes vœux ont été exaucés.\n@c2@"
  it: "@aIl vecchio Santino@bMaremma bonina, la dea ha dato ascolto alle mi' preghiere! \n@c2@"
  ja: "@a@bトム「これも　毎日　教会に通い\n\tあやつが　帰ってくるように\n\t祈っていたおかげじゃろうか……。\n@c2@"
"6":
  de: "@aDer Alte Hans@bAber ich hab keine Zeit zum Plaudern. Würdest du mich rüber zur Kirche schieben?\n@c2@"
  en: "@aOld Man Finn@bSo I can't be standin' around here foosterin'.\nWould ye be kind enough to give me a push over to the church?\n@c2@"
  es: "@aViejo Bin@bAsí que no puedo quiedarme por aquí pierdiendo el tiempo.\n¿Quieres aciercarme hasta la iglesia?\n@c2@"
  fr: "@aFlinn l'Ancien@bAlors je peux pas rester là, les mains dans les poches.\nTu veux bien me pousser jusqu'à l'égliseⓡ\n@c2@"
  it: "@aIl vecchio Santino@bPerò ora 'un posso perde' tempo... Che t'andrebbe di darmi una spinta fino n'chiesa?\n@c2@"
  ja: "@a@bトム「こうしてはおれん。\n\tトルネコよ　わしを　教会まで\n\t押していってくれんか？\n@c2@"
"7":
  de: "@aDer Alte Hans@bDu wirst dich aber anstrengen müssen, mein Junge.\n@c2@"
  en: "@aOld Man Finn@bYe'll have to put yer back into it, lad.\n@c2@"
  es: "@aViejo Bin@bEntionces, tiendrás que empujiarme un poco, joven, sí.\n@c2@"
  fr: "@aFlinn l'Ancien@bIl va falloir que tu y mettes un peu du tien, mon ami.\n@c2@"
  it: "@aIl vecchio Santino@bDevi darti da fa', ragazzo mio.\n@c2@"
  ja: "@a@bトム「では　しっかり　押してくれよ。\n@c2@"
"8":
  de: "@aDer Alte Hans@bHm? Wo liegt das Problem? Streng dich doch ein bisschen mehr an, Junge.\n@c2@"
  en: "@aOld Man Finn@bHm? Now what exactly's the problem?\nWill ye not push a bit harder, lad?\n@c2@"
  es: "@aViejo Bin@b¿Mmm? ¿Cuál es el prioblema, si si puede saber? ¡Empiuja con un poco más de eniergía, muchiacho!\n@c2@"
  fr: "@aFlinn l'Ancien@bMmmⓡ Qu'est-ce qu'y va pasⓡ Tu peux pas pousser un peu plus fortⓡ\n@c2@"
  it: "@aIl vecchio Santino@bChe c'è? Qualche problema, ragazzo? Perché 'un spingi di più?\n@c2@"
  ja: "@a@bトム「ほれ　どうした？\n\tもっと　しっかり　押さぬか。\n@c2@"
"9":
  de: "@aDer Alte Hans@bDa wären wir also. Sehr nett von dir, mein Junge. Hier ist deine Belohnung.\n@c2@"
  en: "@aOld Man Finn@bSo, then. Here we are.\nMuch obliged to ye, me lad.\nHere's yer reward.\n@c2@"
  es: "@aViejo Bin@bMuy bien. Ya hemos lliegado. Ti estoy muy agriadecido, joven. Aquí tienes tu recompiensa.\n@c2@"
  fr: "@aFlinn l'Ancien@bBien. Nous y voilà. Merci beaucoup, mon ami. Voici pour toi.\n@c2@"
  it: "@aIl vecchio Santino@bEcco qui. Siamo arrivati. Grazie mille, ragazzo mio. Ecco la tu' rihompensa.\n@c2@"
  ja: "@a@bトム「やれ　教会に　着いたわい。\n\tすまんかったのう。\n\tこれを　受け取ってくだされ。\n@c2@"
"10":
  de: "@a@bTorneko erhält %a00530 Goldmünze%H530%X%Yn%Z.\n@c2@"
  en: "@a@bTorneko receives %a00530 gold coin%H530%X%Ys%Z.\n@c2@"
  es: "@a@bTorneko recibe %a00530 moneda%H530%X%Ys%Z de oro.\n@c2@"
  fr: "@a@bTorneko reçoit %a00530 pièces d'or.\n@c2@"
  it: "@a@bBaldo riceve %a00530 %H530%Xmoneta d'oro%Ymonete d'oro%Z.\n@c2@"
  ja: "@a@bトルネコは　%a00530Ｇを　手に入れた！\n@c2@"
"11":
  de: "@aDer Alte Hans@bAuf Wiedersehen, Junge.\n@c2@"
  en: "@aOld Man Finn@bI'll be seein' ye, then.\n@c2@"
  es: "@aViejo Bin@bLa piaz sea contigo, pues.\n@c2@"
  fr: "@aFlinn l'Ancien@bÀ bientôt, alors.\n@c2@"
  it: "@aIl vecchio Santino@bCi si vede!\n@c2@"
  ja: "@a@bトム「では　またな。\n@c2@"
"12":
  de: "@aDer Alte Hans@bWas, du willst nicht? Das hätt ich mir ja denken können.\n@c2@"
  en: "@aOld Man Finn@bYe won't?\nAye, well, I might o' known, I s'pose.\n@c2@"
  es: "@aViejo Bin@b¿Que no quieres? Bueno, debí suponierlo.\n@c2@"
  fr: "@aFlinn l'Ancien@bNonⓡ J'aurais dû m'en douter.\n@c2@"
  it: "@aIl vecchio Santino@bUnn hai voglia? Beh, dovevo immaginarlo...\n@c2@"
  ja: "@a@bトム「そうか……。　残念じゃのう。\n@c2@"
"13":
  de: "@a@b*: Willkommen in Lakanaba!\n@c2@"
  en: "@a@b*: Welcome to Lakanaba!\n@c2@"
  es: "@a@b*: ¡Bienvenido a Lakanaba!\n@c2@"
  fr: "@a@b*ⓢ Bienvenue à Lakanabaⓠ\n@c2@"
  it: "@a@b*: Benvenuto a Lacanata!\n@c2@"
  ja: "@a@b＊「レイクナバの町に　ようこそ！\n@c2@"
"14":
  de: "@a@b*: Oh, du bist's, Talun. Die Leute halten mich noch für verrückt, wenn ich dich wie einen Fremden begrüße.\n@c2@"
  en: "@a@b*: Oh, 'tis you, Taloon. They'll be sayin' I'm gone in the head welcomin' ye like some kind o' stranger, so they will.\n@c2@"
  es: "@a@b*: ¡Ah!, eres tú, Taloon. Van a diecir que mi he vuelto chialado por saludarte como si fueses algún extriaño.\n@c2@"
  fr: "@a@b*ⓢ Ah, c'est toi, Taloon. Ils vont tous dire que je suis en train de perdre la boule si je t'accueille comme un client.\n@c2@"
  it: "@a@b*: Toh! Ma sei te, Baldo! 'Un t'avevo rihonosciuto...\n㈡\n*: Scommetto che ora hominceranno a di' che ho perso hualche rotella, a prenderti per un forestiero!\n@c2@"
  ja: "@a@b＊「あれ？　なんだ　トルネコかあ。\n\tようこそなんて言って\n\t損しちゃったなあ。\n@c2@"
"15":
  de: "@aHänschen@bTorneko! Ich bin's... Der Sohn vom Alten Hans, das Hänschen. Danke nochmals, dass Ihr mich aus dem Gefängnis rausgeholt habt.\n@c2@"
  en: "@aFinnegan@bTorneko! 'Tis me again...Finn's son, Finnegan. Yerra, I owe ye fer gettin' me out o' that prison.\n@c2@"
  es: "@aBen Bin@b¡Torneko! Soy yo otria vez... el hijo de Bin, Ben Bin. Así es, estoy en deuda por habierme siacado de esa cárcel.\n@c2@"
  fr: "@aFlinn le Jeune@bTornekoⓠ C'est moi... Flinn le Jeune, le fils de Flinn l'Ancien. Je vous dois une fière chandelle pour m'avoir sorti de prison.\n@c2@"
  it: "@aDuccio@bBaldo! Sì, sono Duccio, i'ffigliolo de i'vvecchio Santino... 'Un so proprio home ringraziarti per avermi tirato fori di prigione...\n@c2@"
  ja: "@a@b＊「トルネコさん！\n\tオレだよ　トムの息子だよ！\n\tあんたのおかげで　帰ってこれたよ。\n@c2@"
"16":
  de: "@aHänschen@bNun, ich hab ja versprochen, mich zu revanchieren, stimmt's? Nur... hab ich momentan nichts...\n@c2@"
  en: "@aFinnegan@bAye, I said I'd make it up to ye, didn't I? Only...I've nuttin' on me at the minute...\n@c2@"
  es: "@aBen Bin@bSí, dije que ti resarciría, ¿no es cierto? El único prioblema es que ahora estoy sin blanca...\n@c2@"
  fr: "@aFlinn le Jeune@bJe vous avais dit que je vous rembourserais. Mais... je suis un peu à sec en ce moment...\n@c2@"
  it: "@aDuccio@bÈ vero, t'avevo promesso che t'avrei aiutato... Ma ora 'un c'ho nulla hon me...\n@c2@"
  ja: "@a@b＊「そうそう　お礼を　しなくちゃな。\n\tでもいま　持ち合わせが　なくて……。\n@c2@"
"17":
  de: "@aHänschen@bWas? Ihr wollt gar nichts haben? Nur meinen Hund ausleihen, Bello? Natürlich könnt Ihr das, kein Problem.\n@c2@"
  en: "@aFinnegan@bWhat's that? Ye don't want nuttin'?\nOnly the loan o' me dog, Fido?\nSure an' that's an easy ask, so it is.\n@c2@"
  es: "@aBen Bin@b¿Qué cómo? ¿No quieres niada?\n¿Siolo quieres que ti prieste a mi perro, Push?\nEs una pietición muy siencilla, mi parece.\n@c2@"
  fr: "@aFlinn le Jeune@bDe quoiⓡ Vous voulez rienⓡ\nSeulement que je vous prête Flip le chienⓡ\nPas de problème. Allez-yⓠ\n@c2@"
  it: "@aDuccio@bHome dici? 'Un voi nulla? Voi solo il mi' hane Fido 'nprestito? Ma 'un c'è problema! Toh, prendilo!\n@c2@"
  ja: "@a@b＊「え？　なに？　お礼はいいから\n\t犬のトーマスを　貸してくれだって？\n\tああ　おやすいご用さ。\n@c2@"
"18":
  de: "@aHänschen@bEr ist ein guter Jagdhund. Fängt Füchse und so. Er ist wirklich sehr nützlich.\n@c2@"
  en: "@aFinnegan@bHe's a grand huntin' dog.\nCatches foxes an' all o' that.\nYe'll find him dead handy.\n@c2@"
  es: "@aBen Bin@bEs un perrio de caza muy bueno.\nCaza ziorros y todo eso.\nTi riesultiará de mucha utilidad.\n@c2@"
  fr: "@aFlinn le Jeune@bC'est un bon chien de chasse.\nIl attrape les renards et tout ça.\nJe suis sûr qu'il vous sera bien utile.\n@c2@"
  it: "@aDuccio@bIl mi' hane è davvero abile nella haccia alla volpe! Vedrai che ti sarà d'aiuto!\n@c2@"
  ja: "@a@b＊「きつね狩りが　得意な犬でさ\n\tきっと　役に立つと思うよ。\n@c2@"
"19":
  de: "@aBello@bWuff!\n@c2@"
  en: "@aFido@bWoof!\n@c2@"
  es: "@aPush@b¡Guau!\n@c2@"
  fr: "@aFlip@bOuafⓠ\n@c2@"
  it: "@aFido@bBau!\n@c2@"
  ja: "@a@bトーマス「わんわんわん！\n@c2@"
"20":
  de: "@aHänschen@bHör zu, Bello. Ich leih dich an Torneko aus. Sei ein braver Hund und tu, was er sagt.\n@c2@"
  en: "@aFinnegan@bListen up now, Fido. Ye're on loan, so y'are.\nBe a quare dog an' do what Torneko tells ye.\n@c2@"
  es: "@aBen Bin@bEscúchiame ahora, Push. Ti vioy a diejar en priéstamo. Tienes que sier un buen pierro y hacer lo que Torneko ti diga.\n@c2@"
  fr: "@aFlinn le Jeune@bÉcoute bien, Flip. Je te prête à Torneko.\nTu es gentil et tu fais ce qu'il te dit.\n@c2@"
  it: "@aDuccio@bEhi, Fido, vieni qui. Ora starai per un po' di tempo con Baldo. Devi ubbidirgli, ha' hapito? \n@c2@"
  ja: "@a@b＊「トーマス！\n\tトルネコさんの　言うことを\n\tよく　きくんだぜ！\n@c2@"
"21":
  de: "@a@bBello folgt Torneko nun auf Schritt und Tritt!\n@c2@"
  en: "@a@bFido starts following Torneko's every move!\n@c2@"
  es: "@a@bPush empieza a seguir a Torneko a todas partes.\n@c2@"
  fr: "@a@bFlip se met à suivre Torneko partout où il va.\n@c2@"
  it: "@a@bFido inizia a seguire tutti i movimenti di Baldo!\n@c2@"
  ja: "@a@bトーマスが　仲間にくわわった！\n@c2@"
"22":
  de: "@aHänschen@bHör zu, Bello. Ich leih dich an Torneko aus. Sei ein braver Hund und tu, was er sagt.\n@c2@"
  en: "@aFinnegan@bListen up now, Fido. Ye're on loan, so y'are.\nBe a quare dog an' do what Torneko tells ye.\n@c2@"
  es: "@aBen Bin@bEscúchiame ahora, Push. Ti vioy a diejar en priéstamo. Tienes que sier un buen pierro y hacer lo que Torneko ti diga.\n@c2@"
  fr: "@aFlinn le Jeune@bÉcoute bien, Flip. Je te prête à Torneko.\nTu es gentil et tu fais ce qu'il te dit.\n@c2@"
  it: "@aDuccio@bEhi, Fido, vieni qui. Ora starai per un po' di tempo con Baldo. Devi ubbidirgli, ha' hapito? \n@c2@"
  ja: "@a@b＊「トーマス！\n\tトルネコさんの　言うことを\n\tよく　きくんだぜ！\n@c2@"
"23":
  de: "@a@b%0%a00120 liest das Schild.\n@c0@"
  en: "@a@b%0%a00120 reads the sign.\n@c0@"
  es: "@a@b%0%a00120 lee el cartel.\n@c0@"
  fr: "@a@b%0%a00120 lit l'écriteau.\n@c0@"
  it: "@a@b%0%a00120 legge il cartello.\n@c0@"
  ja: "@a@b%a00120は　立て札を読んだ\n@c0@"
"24":
  de: "@a@bⓞBetreten der Blumenbeete verboten!ⓟ\n@c0@"
  en: "@a@bⓗNo trampling over the flowerbeds!ⓘ\n@c0@"
  es: "@a@b''¡No pisen los partierres!''\n@c0@"
  fr: "@a@bⓥInterdiction de marcher sur les plates-bandesⓠⓦ\n@c0@"
  it: "@a@bⓕ'Un calpestate l'aiole!ⓖ\n@c0@"
  ja: "@a@b花だんの花を　ぬかないでください。\n@c0@"
"25":
  de: "@a@b*: Ach, Torneko, wenn du ein richtiger Händler sein möchtest, brauchst du ein eigenes Geschäft.\n@c2@"
  en: "@a@b*: Ah, Torneko. Ye know, ye call yerself a merchant, but ye don't even have yer own shop.\n@c2@"
  es: "@a@b*: ¡Ah!, Torneko. Sí, ti lliamas miercader, pero ni siquiera tienes una tienda priopia.\n@c2@"
  fr: "@a@b*ⓢ Torneko, expliquez-moi une choseⓢ vous vous dites marchand et vous avez même pas un magasin à vous.\n@c2@"
  it: "@a@b*: O Baldo, perché ti fai chiama' venditore, quando 'un c'hai nemmeno una bottega tutta tua?\n@c2@"
  ja: "@a@b＊「ああ　トルネコか。\n\tあんたも　商人なら\n\t自分の店を　持たなきゃだぜ。\n@c2@"
"26":
  de: "@a@b*: Aber hier in der Stadt ist kein Platz mehr für ein Geschäft. Es passt ja noch nicht mal mehr ein Marktstand hin.\n@c2@"
  en: "@a@b*: But the town's black as it is. Ye couldn't cram a market stall in here, let alone a shop.\n@c2@"
  es: "@a@b*: Piero la aldea ya está riepleta. No hay fiorma de pioner ni un puesto de miercado, y una tienda ni ti cuento.\n@c2@"
  fr: "@a@b*ⓢ Remarquez, la ville est déjà bondée. Vous pourriez même pas poser un étal, alors un magasin...\n@c2@"
  it: "@a@b*: In questo villaggio 'un c'entrerebbe più nemmeno un banchetto da mercato, figurarsi un negozio!\n@c2@"
  ja: "@a@b＊「もっとも　この町にゃ\n\tもう　新しい店を　出すような\n\t場所なんて　ありゃしないけどな。\n@c2@"
"27":
  de: "@a@b*: Du suchst meinen Mann? Der ist auf der Arbeit, da musst du schon abends kommen, wenn du ihn sprechen willst.\n@c1@"
  en: "@a@b*: Are ye lookin' fer me fella, are ye?\nHe's out to work at the mo, so ye'll have to come back in the evenin'.\n@c1@"
  es: "@a@b*: Estiás buscando a mi miarido, ¿vierdad? Ha salido a triabajar, así que tiendrás que volver por la noche.\n@c1@"
  fr: "@a@b*ⓢ Vous cherchez mon mariⓡ\nIl est au travail. Faudra que vous repassiez ce soir.\n@c1@"
  it: "@a@b*: %H860%XStai%YState%Z cercando il mi' marito? 'Un c'è, è a lavora'. %H860%XTorna%YTornate%Z stasera.\n@c1@"
  ja: "@a@b＊「おや　なにか用かい？\n\tウチの人だったら　昼間は店だから\n\t夜にでも　来ておくれよ。\n@c1@"
"28":
  de: "@a@b*: Die Göttin hat Hänschen zurück in die Arme seines Vaters geführt. Wie wunderbar.\n@c1@"
  en: "@a@b*: The great Goddess has guided Finnegan back to his father at last. 'Tis wonderful altogether.\n@c1@"
  es: "@a@b*: La grian Diosa ha guiado a Ben Bin de vuelta junto a su piadre, por fin. Es algo maravillioso, sí.\n@c1@"
  fr: "@a@b*ⓢ La grande Déesse a ramené Flinn le Jeune auprès de son père. C'est magnifique de les voir ensemble à nouveau.\n@c1@"
  it: "@a@b*: Grazie alla nostra amatissima dea, Duccio è tornato finalmente a casa dal su' babbo!\n@c1@"
  ja: "@a@b＊「トムじいさんの　息子さんが\n\t帰ってきたそうですね。\n\t本当に　よかったわ。\n@c1@"
"29":
  de: "@aDer Alte Hans@bIch steh tief in deiner Schuld, Junge. Danke, dass du meinen Sohn gerettet hast.\n@c2@"
  en: "@aOld Man Finn@bI'm forever in yer debt, lad.\n'Tis thanks to you that me son's come home.\n@c2@"
  es: "@aViejo Bin@bSiempre estarié en deuda contigo, amigo.\nGracias a ti mi hijo ha consieguido volvier a casa.\n@c2@"
  fr: "@aFlinn l'Ancien@bJe pourrai jamais assez te remercier, mon ami.\nC'est grâce à toi que mon fiston est rentré à la maison.\n@c2@"
  it: "@aIl vecchio Santino@bUn finirò mai di dirti grazie, ragazzo mio... Se 'un fosse stato pe' te, chissà dove sarebbe ora il mi' figliolo...\n@c2@"
  ja: "@a@bトム「いやいや　ありがとう。\n\tおかげさまで　息子も　帰ってきたし。\n@c2@"
"30":
  de: "@aDer Alte Hans@bEs war die gute Göttin, die dich zu ihm geführt hat. Das ist so sicher wie das Amen in der Kirche.\n@c2@"
  en: "@aOld Man Finn@bⓙTwas the guidance o' the Goddess that led ye to meet him. As sure as slimes are slimes.\n@c2@"
  es: "@aViejo Bin@bGracias a la ayuda de la Diosa consieguiste encontriarlo. Tan cierto como que los limos sion limos.\n@c2@"
  fr: "@aFlinn l'Ancien@bC'est la Déesse qui t'a guidé jusqu'à lui. Aussi sûr que les gluants sont gluants.\n@c2@"
  it: "@aIl vecchio Santino@bÈ stata di sihuro la luce della dea che ti ha guidato fino a lui, quant'è vero che il mi' nome è Santino!\n@c2@"
  ja: "@a@bトム「あんたが　息子と　会ったのも\n\t神さまの　お導きかもしれんな。\n\tやれ　ありがたや。\n@c2@"
"31":
  de: "@a@b*: Ach, Herr Talun. Und, seid Ihr schon in Endor gewesen?\n@c2@"
  en: "@a@b*: Mr. Taloon. Has yerself been over to Endor already?\n@c2@"
  es: "@a@b*: Sr. Taloon. ¿Ha estiado alguiuna vez en Endor?\n@c2@"
  fr: "@a@b*ⓢ Monsieur Taloon, vous êtes déjà allé à Chandorⓡ\n@c2@"
  it: "@a@b*: Oh, Baldo Baldini! Te sei stato a Endor, nevvero?\n@c2@"
  ja: "@a@b＊「トルネコさん\n\tエンドールには　もう　行きましたか？\n@c2@"
"32":
  de: "@a@b*: Tatsächlich? Ah, das ist gut. Da geht's ein bisschen lebhafter zu als hier, nicht wahr?\n@c2@"
  en: "@a@b*: Ye have, have ye? Ah, that's grand.\nI bet it's a fair lively craic over there, isn't it?\n@c2@"
  es: "@a@b*: ¿Ya ha estiado, verdad? ¡Ah!, es estiupendo.\nSieguro que por allí hay mucha diviersión, ¿no es cierto?\n@c2@"
  fr: "@a@b*ⓢ C'est vraiⓡ C'est fantastique.\nCe doit être une région vivante, nonⓡ\n@c2@"
  it: "@a@b*: Ci sei già stato, diho bene? Maremma mostra... Scommetto che quello l'è un posto pieno di gente, diho bene?\n@c2@"
  ja: "@a@b＊「いや～　そうなんですか。\n\tにぎやかな所なんでしょうね。\n@c2@"
"33":
  de: "@a@b*: Und die Brücke ist immer noch kaputt?\n@c2@"
  en: "@a@b*: So the bridge is still banjaxed then, is it?\n@c2@"
  es: "@a@b*: Así que el puente sigue diestruido, ¿vierdad?\n@c2@"
  fr: "@a@b*ⓢ Le pont n'est toujours pas réparé alorsⓡ\n@c2@"
  it: "@a@b*: Allora i'pponte l'è ancora fori uso?\n@c2@"
  ja: "@a@b＊「すると　もしかして\n\tまだ　橋が　こわれたままだとか……。\n@c2@"
"34":
  de: "@a@b*: Dabei hab ich gehört, dass Archibald Tekt mit der Reparatur beauftragt wurde. Was ist da nur los...?\n@c2@"
  en: "@a@b*: But I heard Archie O'Tect had the repairs all boxed off already. I wonder what the problem is...\n@c2@"
  es: "@a@b*: Piero he oído que Al Quitecto ya tiene prieparada la forma de riepararlo. Mi pregunto cuál sierá el probliema...\n@c2@"
  fr: "@a@b*ⓢ Pourtant j'avais entendu dire qu'Hector Busier avait fini les réparations. Je me demande bien ce qui se passe...\n@c2@"
  it: "@a@b*: Ma avevo sentito di' che Archie Tett ha di già riparato i danni. Qual è i'pproblema, allora?\n@c2@"
  ja: "@a@b＊「ドン・ガアデが　橋を直しにいったと\n\t聞いていますが\n\tどうしたんでしょうねえ……。\n@c2@"
"35":
  de: "@aTessa@bHallo, Torneko. Du bist bestimmt müde von der Arbeit.\n@c1@"
  en: "@aTessie@bHello, Torneko. Ye must be shattered after work.\n@c1@"
  es: "@aTrakiba@bHola, Torneko.\nDiebes estar molido del triabajo.\n@c1@"
  fr: "@aLucille@bBonsoir, Torneko.\nTu dois être fatigué après ta journée de travail.\n@c1@"
  it: "@aBeatrice@bOh, Baldo, te tu sara' stanco dopo una giornata di lavoro!\n@c1@"
  ja: "@a@bネネ「あら　あなた　おかえりなさい。\n\tお仕事　大変だったんでしょう。\n@c1@"
"36":
  de: "@aTessa@bAm besten legst du dich hin und schläfst dich aus. Gute Nacht...\n@c1@"
  en: "@aTessie@bI expect ye'll be needin' a good rest.\nTime for bed, love. Good night...\n@c1@"
  es: "@aTrakiba@bNecesitariás un buen diescanso.\nHora de irse a la cama, cariñio. Buenas nochies.\n@c1@"
  fr: "@aLucille@bTu as sûrement besoin de repos. Il est l'heure de se coucher. Bonne nuit...\n@c1@"
  it: "@aBeatrice@bDi certo ti vorrai riposa'! Forza, va a letto, amore. Bonanotte...\n@c1@"
  ja: "@a@bネネ「さあ　ゆっくり　休んでくださいな。\n\tおやすみなさい　あなた……。\n@c1@"
"37":
  de: "@aTessa@bGuten Morgen, Liebling. Es ist schon hell draußen.\n@c1@"
  en: "@aTessie@bMornin', love.\n'Tis a new dawn already, so it is.\n@c1@"
  es: "@aTrakiba@bBuenos días, cariñio.\nYa ha sialido el sol.\n@c1@"
  fr: "@aLucille@bBonjour, mon chéri.\nC'est une nouvelle journée qui commence.\n@c1@"
  it: "@aBeatrice@bBongiorno, amore! È ora d'alzarsi.\n@c1@"
  ja: "@a@bネネ「おはよう　あなた。　もう朝よ。\n@c1@"
"38":
  de: "@aTessa@bOh, Torneko... Wann werden wir endlich unser eigenes Geschäft haben?\n@c1@"
  en: "@aTessie@bOh, Torneko... When are we goin' to have a shop of our own?\n@c1@"
  es: "@aTrakiba@bOh, Torneko...\n¿Cuándo tendriemos nuestra propia tienda?\n@c1@"
  fr: "@aLucille@bTorneko...\nTu penses qu'on aura un magasin à nous un jourⓡ\n@c1@"
  it: "@aBeatrice@bBaldo, quand'è che avremo una bottega tutta nostra?\n@c1@"
  ja: "@a@bネネ「ねえ……。\n\tわたしたちも　いずれは\n\t自分のお店を　持ちたいわね。\n@c1@"
"39":
  de: "@aTessa@bWas ist denn schon ein Mann ohne ein eigenes Geschäft? Gar nichts, Torneko. Du wirst nicht dein ganzes Leben lang für andere arbeiten.\n@c1@"
  en: "@aTessie@bA man's nuttin' without a shop, Torneko.\nYe're not goin' to be used by others all yer life.\n@c1@"
  es: "@aTrakiba@bUn hombre no vale niada sin una tienda, Torneko, sí. No querriás estar al siervicio de otros toda tu vida.\n@c1@"
  fr: "@aLucille@bUn homme n'est pas grand-chose s'il n'a pas son propre magasin, Torneko. Tu ne vas pas te laisser exploiter par les autres toute ta vie.\n@c1@"
  it: "@aBeatrice@bUn omo 'un vale nulla si 'un c'ha un'attività sua. Viene sfruttato dall'altri per tutta la vita!\n@c1@"
  ja: "@a@bネネ「あなたは　いつまでも\n\t他人に使われるような　人じゃないわ。\n@c1@"
"40":
  de: "@aTessa@bIch habe dich geheiratet, weil ich daran glaube.... Und weil ich dich liebe, natürlich.\n@c1@"
  en: "@aTessie@bI married ye believin' that, so I did.\n...And 'cause I loved ye, o' course. He he.\n@c1@"
  es: "@aTrakiba@bPor eso mi casé contigo, sí.\n... Bueno, y porquie ti quería, cliaro. Je, je.\n@c1@"
  fr: "@aLucille@bJe t'ai épousé parce que c'est ce que j'espérais... et aussi parce que je t'aimais. Hi hi hi.\n@c1@"
  it: "@aBeatrice@bIl Baldo che ho sposato aveva 'un so quanti sogni! È stato pure per quello che mi so' 'nnamorata di te...\n@c1@"
  ja: "@a@bネネ「そう思って　わたしは　あなたと\n\t結婚したのよ。　もちろん\n\tそれだけじゃないけどね。　ウフ。\n@c1@"
"41":
  de: "@aTessa@bHast du was vergessen? Du würdest noch deinen eigenen Kopf vergessen, wenn er nicht angewachsen wäre!\n@c1@"
  en: "@aTessie@bYe forgot sometin'? Aye, an' ye'd forget yer own head if it wasn't screwed on, so ye would!\n@c1@"
  es: "@aTrakiba@b¿Ti has olvidiado de algo? ¡Claro, y tu propia cabieza ti olvidarías si no la llevases piegada al cuerpo, sieguro!\n@c1@"
  fr: "@aLucille@bT'as encore oublié quelque choseⓡ T'oublierais ta tête si elle était pas bien attachée à tes épaulesⓠ\n@c1@"
  it: "@aBeatrice@bUn dimentichi nulla? Per fortuna la testa ce l'hai attaccata a i'ccollo, altrimenti ti scorderesti pure huella! \n@c1@"
  ja: "@a@bネネ「あら　あなた。　なにか　忘れ物？\n\tお仕事頑張ってきてね。　ちゅっ。\n@c1@"
"42":
  de: "@a@b*: Lass uns zusammen beten, Torneko. Wir wollen die Göttin um Frieden für das Land bitten.\n@c1@"
  en: "@a@b*: Come together with me in prayer, Torneko, as we ask the Goddess for peace throughout the land.\n@c1@"
  es: "@a@b*: Úniete a mí en la pliegaria, Torneko, para piedir a la Diosa que haya paz en todo el mundo.\n@c1@"
  fr: "@a@b*ⓢ Venez prier avec moi, Torneko, et demandons à la Déesse de faire régner la paix dans le pays.\n@c1@"
  it: "@a@b*: Forza, Baldo, vieni a prega' la dea che mantenga la pace ne i'nnostro paese.\n@c1@"
  ja: "@a@b＊「トルネコさんも　私といっしょに\n\t世界の平和を　神様に\n\t祈ってくださいまし。\n@c1@"
"43":
  de: "@a@b*: Ohne Frieden werden Händler wie du es schwer haben, ihren Geschäften nachzugehen.\n@c1@"
  en: "@a@b*: Without peace, merchants like you will have a grand time of it tryin' to conduct yer business.\n@c1@"
  es: "@a@b*: Si no hay paz, los miercaderes como tú lo van a pasiar muy mal intentando llievar su negocio.\n@c1@"
  fr: "@a@b*ⓢ Sinon les marchands comme vous auront du mal à faire des affaires.\n@c1@"
  it: "@a@b*: E rihorda che, senza pace, i mercanti ne fanno pohi d'affari!\n@c1@"
  ja: "@a@b＊「世界が　滅んでしまっては\n\tトルネコさんも　商売どころでは\n\tありませんものね。\n@c1@"
"44":
  de: "@a@b*: Bist du auf dem Nachhauseweg, Torneko?\n@c2@"
  en: "@a@b*: Are y'on yer way home now, Torneko?\n@c2@"
  es: "@a@b*: ¿De vuelta a casa, Torneko?\n@c2@"
  fr: "@a@b*ⓢ Vous rentrez chez vous, Tornekoⓡ\n@c2@"
  it: "@a@b*: Ehilà, Baldo! Te tu torni a casa?\n@c2@"
  ja: "@a@b＊「よお　トルネコ！\n\t今から　帰るところかい？\n@c2@"
"45":
  de: "@a@b*: Und dein flottes Frauchen wartet dort bestimmt schon auf dich, was? Ich bin wirklich eifersüchtig, Mann.\n@c2@"
  en: "@a@b*: An' yer corker of a wife'll be there waitin' for ye, I s'pose? Aye, I'm pure jealous, so I am.\n@c2@"
  es: "@a@b*: Y la maciza de tu espiosa esitará espierándote, claro. Estoy muerto de celos, sí.\n@c2@"
  fr: "@a@b*ⓢ Et je suppose que votre jolie petite femme vous attendⓡ\nOn peut dire que vous en avez de la chance.\n@c2@"
  it: "@a@b*: Chissà stavolta che pranzetto delizioso t'avrà preparato la tu' mogliettina! Maremma cicoria, home t'invidio...\n@c2@"
  ja: "@a@b＊「家に帰りゃ　美人のヨメさんが\n\t出むかえてくれるんだよな。\n\tうらやましいぜ　コンチクショウ！\n@c2@"
"46":
  de: "@a@b*: Zzzz...\n@c1@"
  en: "@a@b*: Zzzz...\n@c1@"
  es: "@a@b*: Zzzz...\n@c1@"
  fr: "@a@b*ⓢ Zzzz...\n@c1@"
  it: "@a@b*: Zzz...\n@c1@"
  ja: "@a@b＊「すやすや……。\n@c1@"
"47":
  de: "@a@b*: Was? Du willst ein eigenes Geschäft haben? Dann wirst du die Stadt wohl verlassen müssen.\n@c2@"
  en: "@a@b*: What? Ye want a shop of yer own?\nYe'll be needin' to leave this place, then.\n@c2@"
  es: "@a@b*: ¿Qué? ¿Que quieres tu priopia tienda? Pues vas a tiener que irte de este lugar.\n@c2@"
  fr: "@a@b*ⓢ Commentⓡ Vous voulez acheter un magasinⓡ Il faudra que vous partiez d'ici alors.\n@c2@"
  it: "@a@b*: Come dici? Te tu voi apri' una bottega tutta tua? Allora ti toccherà anda' via da Lacanata!\n@c2@"
  ja: "@a@b＊「なんと！　自分お店を　持ちたいか？\n\tだったら　この町を出るんだな。\n@c2@"
"48":
  de: "@a@b*: In so einem kleinen Nest am Ende der Welt kann man keine großen Geschäfte machen.\n@c2@"
  en: "@a@b*: A tiny village at the borin' end of a bogway is no place for a successful business.\n@c2@"
  es: "@a@b*: Un puebliecito en el extremo más aburrido de una ciénaga no es liugar para un niegocio floreciente.\n@c2@"
  fr: "@a@b*ⓢ Un petit village au fin fond d'un coin perdu, ce n'est pas l'endroit idéal pour monter une affaire florissante.\n@c2@"
  it: "@a@b*: In un villaggio home huesto, posto alla fine di una stradaccia poho frequentata, ma che affari speri di fa'?\n@c2@"
  ja: "@a@b＊「こんな　片すみのいなか町じゃ\n\t大きな商売は　できないぞ。\n@c2@"
"49":
  de: "@a@b*: Geh in eine Stadt wie Endor, kauf dir 'nen netten kleinen Laden und hol deine Familie nach... Ja, Träume sind was Wunderbares!\n@c2@"
  en: "@a@b*: Go to a place like Endor, buy yerself a nice, tidy shop, an' then bring yer family along... Yerra, 'tis a fine thing to have a dream, so it is!\n@c2@"
  es: "@a@b*: Ve a un lugar como Endor, cómpriate una bionita tienda allí y luego lliévate a tu fiamilia. ¡Después de todo, es bueno tener un sueñio!\n@c2@"
  fr: "@a@b*ⓢ Partez à Chandor, achetez une jolie petite boutique et faites venir votre famille... Vous avez raison, c'est bien d'avoir des rêvesⓠ Allez-yⓠ\n@c2@"
  it: "@a@b*: In un posto affollato come Endor, invece, potresti apri' un bel negozietto e porta' con te la tu' famiglia! Sarebbe bello, eh?\n@c2@"
  ja: "@a@b＊「エンドールにでも　ど～んと\n\t店を買って　家族を呼んでよう……。\n\tくそー！　夢があって　いいよなあ！\n@c2@"
"50":
  de: "@a@b*: Ha-püh... Ha-püh...\n@c2@"
  en: "@a@b*: Ah-phew... Ah-phew...\n@c2@"
  es: "@a@b*: Ah-fiuu... Ah-fiuu...\n@c2@"
  fr: "@a@b*ⓢ Ron-pfff... Ron-pfff...\n@c2@"
  it: "@a@b*: Ronf... Ronf...\n@c2@"
  ja: "@a@b＊「ぐうぐう……。\n@c2@"
"51":
  de: "@a@b*: Hatschi! Eine traurige Geschichte ist das, wirklich. Ein paar Füchse haben mich verhext und meine Rüstung geklaut. Ein Skandal!\n@c3@"
  en: "@a@b*: Ahchoo! 'Tis a desperate tale, but if the truth be known, I was bewitched by some foxes an' they stole me armour. What a holy show!\n@c3@"
  es: "@a@b*: ¡Achíís! Es riarísimo, pero si quieres saber la vierdad, fui encantiado por unos zorros y mi riobaron la armadura. ¡Qué increíble!\n@c3@"
  fr: "@a@b*ⓢ C'est une histoire assez malheureuse, mais je dois dire la véritéⓢ j'ai été ensorcelé par des renards et ils m'ont volé mon armure. J'en reviens toujours pasⓠ\n@c3@"
  it: "@a@b*: Etciù...! A sentirla, 'un ci si crede! Certe volpi m'hanno lanciato hontro un incantesimo, e m'hanno anche rubato l'armatura. Roba da matti!\n@c3@"
  ja: "@a@b＊「ハックション！　恥ずかしい話だが\n\tきつねに　化かされて\n\tよろいを　なくしてしまったのだ。\n@c3@"
"52":
  de: "@a@b*: Aber ich war nicht der Einzige, den sie reingelegt haben. Da war noch ein anderer Typ... Archibald oder so...\n@c3@"
  en: "@a@b*: But I wasn't the only fella taken in by them. There was another feen there by the name of Archie or sometin' that was taken still.\n@c3@"
  es: "@a@b*: Piero yo no fui el único al que captiuraron. Había otro amigo, llamado Al Riberto o algo así, al que también capturiaron.\n@c3@"
  fr: "@a@b*ⓢ D'ailleurs, j'étais pas le seul. Il y avait un autre gars, un Herbert ou Hector quelque chose, qui s'est fait avoir aussi.\n@c3@"
  it: "@a@b*: Però 'un so' stato l'unico grullo a cade' nel tranello, sai? Hanno gabbato pure un certo Archie, se 'un mi sbaglio...\n@c3@"
  ja: "@a@b＊「そういえば　化かされたままの\n\tおっさんも　いたな。\n\tたしか　ドン・ガアデとか……。\n@c3@"
"53":
  de: "@aDer Alte Hans@bMein Sohn will sein Brot von nun an nur noch auf ehrliche Weise verdienen. Das hatte ich mir schon immer erhofft.\n@c2@"
  en: "@aOld Man Finn@bMe son tells me he'll only be doin' honest, hard work now he's back. 'Tis all I've been hopin' for, so it is.\n@c2@"
  es: "@aViejo Bin@bMi hijo asiegura que ha sido honesto y ha triabajado duro, y ya está de vuelta. Es tiodo lo que estaba esperiando, sí.\n@c2@"
  fr: "@aFlinn l'Ancien@bMon fiston m'a dit qu'il allait être honnête maintenant. C'est tout ce que j'espérais.\n@c2@"
  it: "@aIl vecchio Santino@bIl mi' figliolo m'ha promesso che d'ora in poi si homporterà in modo onesto. Il mi' sogno s'è finalmente avverato!\n@c2@"
  ja: "@a@bトム「息子が　帰ってきて\n\t真面目に　はたらくというのじゃ。\n\tやれ　うれしや。\n@c2@"
"54":
  de: "@aDer Alte Hans@bHm? Wo ist er denn? Wahrscheinlich hinten mit dem Hund.\n@c2@"
  en: "@aOld Man Finn@bHm? Where is he now?\n'Round the back with the dog, so he is.\n@c2@"
  es: "@aViejo Bin@b¿Mmm? ¿Que diónde está ahora?\nEn la parte de atrás, con el pierro, por ahí anda.\n@c2@"
  fr: "@aFlinn l'Ancien@bMmmⓡ Il est où d'ailleursⓡ\nIl doit être derrière, avec le chien.\n@c2@"
  it: "@aIl vecchio Santino@bEh? Dov'è ora? È sul retro, col su' hane.\n@c2@"
  ja: "@a@bトム「息子か？\n\tあいつなら　裏の犬小屋にいるぞ。\n@c2@"
"55":
  de: "@a@b*: Ha-püh... Ha-püh...\n@c2@"
  en: "@a@b*: Ah-phew... Ah-phew...\n@c2@"
  es: "@a@b*: Ah-fiuu... Ah-fiuu...\n@c2@"
  fr: "@a@b*ⓢ Ron-pfff... Ron-pfff...\n@c2@"
  it: "@a@b*: Ronf... Ronf...\n@c2@"
  ja: "@a@b＊「ぐうぐう……。\n@c2@"
"56":
  de: "@aTessa@bHallo, Liebling. Du bist aber spät heute. Hattest bestimmt einen anstrengenden Tag, was?\n@c1@"
  en: "@aTessie@bHello, love. Ye're late today.\nYe must've had a desperate time of it at work.\n@c1@"
  es: "@aTrakiba@bHola, cariñio. Lliegas tarde hoy.\nSieguro que has tenido un día tierrible en el trabajo.\n@c1@"
  fr: "@aLucille@bBonjour, mon chéri. Tu rentres tard.\nTu as dû avoir beaucoup de travail.\n@c1@"
  it: "@aBeatrice@bBentornato, amore. Oggi te tu sei 'nritardo... Chissà che giornataccia hai avuto al lavoro!\n@c1@"
  ja: "@a@bネネ「おかえりなさい。\n\tずいぶん　遅くまで\n\t本当に　お疲れさまでした。\n@c1@"
"57":
  de: "@aTessa@bAm besten legst du dich hin und schläfst dich aus. Gute Nacht...\n@c1@"
  en: "@aTessie@bI expect ye'll be needin' a good rest.\nTime for bed, love. Good night...\n@c1@"
  es: "@aTrakiba@bNecesitariás un buen diescanso.\nHora de irse a la cama, cariñio. Buenas nochies.\n@c1@"
  fr: "@aLucille@bTu as sûrement besoin de repos. Il est l'heure de se coucher. Bonne nuit...\n@c1@"
  it: "@aBeatrice@bDi certo ti vorrai riposa'! Forza, va a letto, amore. Bonanotte...\n@c1@"
  ja: "@a@bネネ「さあ　ゆっくり　休んでくださいな。\n\tおやすみなさい　あなた……。\n@c1@"
"58":
  de: "@aTessa@bGuten Morgen, Liebling. Es ist schon hell draußen.\n@c1@"
  en: "@aTessie@bMornin', love.\n'Tis a new dawn already, so it is.\n@c1@"
  es: "@aTrakiba@bBuenos días, cariñio.\nYa ha sialido el sol.\n@c1@"
  fr: "@aLucille@bBonjour, mon chéri.\nC'est une nouvelle journée qui commence.\n@c1@"
  it: "@aBeatrice@bBongiorno, amore! È ora d'alzarsi.\n@c1@"
  ja: "@a@bネネ「おはよう　あなた。　もう朝よ。\n@c1@"
"59":
  de: "@aTimo@bDa bist du ja, Papa! Ich war auch ganz brav heute, ehrlich!\n@c1@"
  en: "@aTipper@bYe're home, Da!\nI've been good.\nI promise!\n@c1@"
  es: "@aTarik@b¡Quié bien, ya estás en casa, papi!\nMi he piortado bien.\n¡Ti lo priometo!\n@c1@"
  fr: "@aAchille@bT'es rentré, p'paⓠ\nJ'ai été bien sage.\nPromis.\n@c1@"
  it: "@aBalduccio@bEhi, sei tornato, babbone! Ho fatto il bravo, sai? Chiedi alla mamma!\n@c1@"
  ja: "@a@bポポロ「あっ　パパ　おかえりなさーい！\n\tうん。　ボク　いい子にしてたよ。\n@c1@"
"60":
  de: "@aTimo@bWenn ich groß bin, werd ich einen Haufen Gold verdienen, und du und Mama werden wie die Könige leben! Ähm... und Königinnen...\n@c1@"
  en: "@aTipper@bWhen I grow up, I'm gonna earn a rake o' gold, an' you an' Ma can live like kings! Em...an' queens...\n@c1@"
  es: "@aTarik@b¡Cuando criezca, ganaré una montaña de diniero para que mami y tú podáis vivir como rieyes! Bueno, y rieinas...\n@c1@"
  fr: "@aAchille@bQuand je serai grand, je gagnerai plein d'or, et toi et m'man, vous vivrez comme des roisⓠ Et... euh... des reines...\n@c1@"
  it: "@aBalduccio@bHuando divento grande voglio guadagna' tanti huattrini, così fo vive' te e la mamma come dei re... Anzi, come un re e una regina!\n@c1@"
  ja: "@a@bポポロ「ボク　大きくなったら\n\tパパみたいになって　お金をもうけて\n\tパパやママに　楽させてあげるからね！\n@c1@"
"61":
  de: "@aBello@bWuff! Grrr... Wuff, wuff, wuff!\nWuff! Wuff, wuff!\n@c2@"
  en: "@aFido@bWoof! Grrr... Woof, woof, woof!\nWoof! Woof, woof!\n@c2@"
  es: "@aPush@b¡Guau! Grrr... ¡Guau! ¡Guau! ¡Guau!\n¡Guau, guau, guau!\n@c2@"
  fr: "@aFlip@bOuafⓠ Grrr... Ouaf, ouaf, ouafⓠ\nOuafⓠ Ouaf, ouafⓠ\n@c2@"
  it: "@aFido@bGrrr... Bau! Bau! Bau!\nBau! Wooof! Bau!\nBau! Grrr! Bau!\n@c2@"
  ja: "@a@bトーマス「わんわんわん！\n@c2@"
"62":
  de: "@a@b*: Hallo, Reisender. Du scheinst ja ein quicklebendiges Bürschchen zu sein. Wollen wir 'nen Foxtrott tanzen?\n@c1@"
  en: "@a@b*: Hello there, traveller. Ye're lookin' broit-eyed an' bushy-tailed, so y'are!\nCare to join me in a foxtrot?\n@c1@"
  es: "@a@b*: Saludos, viajero. Parieces astuto y taimado, sí.\n¿Bailamos un foxtrot?\n@c1@"
  fr: "@a@b*ⓢ Bien le bonjour, étranger. Quelles pattes puissantes et quel museau vous avezⓠ\nUn petit fox-trot, ça vous ditⓡ \n@c1@"
  it: "@a@b*: Salve, viaggiatore dall'occhi vivaci e dalla mente furba! Voi balla' con me un foxtrot?\n@c1@"
  ja: "@a@b＊「こんにちは　旅の人。\n\tさあ　私と　いっしょに\n\t踊りましょうよ！\n@c1@"
"63":
  de: "@a@b*: Das ist ja seltsam. Hier war kein Dorf, als ich vorhin vorbeigekommen bin. Darauf könnte ich schwören.\n@c2@"
  en: "@a@b*: That's strange... There was no village here when I passed by before. I'd stake me life on it.\n@c2@"
  es: "@a@b*: Qué extrañio... La otra viez que pasé por aquí no había ningún pueblo. Mi apostiaría una mano.\n@c2@"
  fr: "@a@b*ⓢ C'est étrange... Il n'y avait pas de village ici, la dernière fois que je suis passé. J'en mettrais ma main à couper.\n@c2@"
  it: "@a@b*: Strano... 'Un rihordo d'ave' visto huesto villaggio quand'ero passato di huì prima. Ci scommetterei l'osso de i'ccollo!\n@c2@"
  ja: "@a@b＊「はて？\n\t以前　この辺りに　立ち寄った時には\n\tこんな村は　なかったはずだが……。\n@c2@"
"64":
  de: "@a@b*: Hier soll es Füchse geben, die die Leute verhexen. Sie verwandeln sich in Menschen und legen dich herein. Also pass gut auf dich auf.\n@c2@"
  en: "@a@b*: There are foxes 'round about that are out to bewitch folk, so they say. They'll trick ye by turnin' themselves into human form.\n㈡\n*: Ye'd be wise to watch yer back.\n@c2@"
  es: "@a@b*: Dicien que hay zorros mierodeando para embrujar a las personas, sí. Para engañiarlas se convierten en humanos.\n㈡\n*: Será miejor que ti andes con cuidado.\n@c2@"
  fr: "@a@b*ⓢ On dit que dans le coin, il y a des renards qui ensorcellent les gens. Ils vous envoûtent en prenant forme humaine. Vous feriez bien de vous méfier.\n@c2@"
  it: "@a@b*: Si dice che ci siano a' giro delle volpi a cui garbi piglia' 'ngiro l'omini.\n㈡\n*: Riescono a ingannarli perché son capaci di trasformarsi in esseri umani. Bisogna tene' l'occhi aperti!\n@c2@"
  ja: "@a@b＊「この辺りには　人を化かす\n\tきつねが　いるそうです。\n\t気をつけてください。\n@c2@"
"65":
  de: "@a@b*: Schön, Euch kennen zu lernen, mein Herr! Archibald Tekt heiß ich, bin ein berühmter Baukünstler und ziemlich fleißig!\n@c2@"
  en: "@a@b*: Pleased to meet ye, sir! Archie O'Tect's the name. A travellin' architect o' fame! But I'm head over heels in love with this foxy wan, now.\n@c2@"
  es: "@a@b*: ¡Encantiado, amigo! Mi nombre es Al Quitecto. ¡El fiamoso arquitiecto ambulante! Mi he eniamorado de esta muchachita tan sexy.\n@c2@"
  fr: "@a@b*ⓢ Enchantéⓠ Hector Busier, architecte itinérant pour vous servirⓠ Je suis tombé follement amoureux de cette dame flamboyante.\n@c2@"
  it: "@a@b*: Se permetti, mi presento! Io sono Archie Tett, architetto di portento!\n@c2@"
  ja: "@a@b＊「私は　ドン・ガアデ。\n\t旅の建築家ですが\n\tこいつに　ホレられてしまって……。\n@c2@"
"66":
  de: "@aArchibald@bIch ziehe durch die Lande und biete meine Dienste an, aber jetzt hab ich mich Hals über Kopf verliebt. Und zwar in diese schöne Füchsin hier!\n㈡\nIch werd sie heiraten, oh ja! Und mit ihr hier wohnen im schönen Fuchsweiler, das ist doch klar! Ha ha!\n@c2@"
  en: "@aArchie O'Tect@bI'm gonna marry her, so I am!\nAn' come an' live with her in this wee village o' Shinnock. Ha ha ha!\n@c2@"
  es: "@aAl Quitecto@b¡Mi voy a casiar con ella!\nY mi vendré a vivir a este pueblito de Alameda. ¡Ja, ja, ja!\n@c2@"
  fr: "@aHector Busier@bJe vais l'épouserⓠ\nEt je vais m'installer avec elle dans ce joli petit village de Reginhart. Ha ha haⓠ\n@c2@"
  it: "@aArchie Tett@bSon sempre 'ngiro e mi sveglio presto la mattina, e ora amo una fanciulla che somiglia a una faina!\n㈡\n*: La voglio sposa'! Poi noi in codesto paesino che si hiama Foxia a vive' si verrà. Ah! Ah! Ah!\n@c2@"
  ja: "@a@bドン・ガアデ「結婚して　この村に\n\t住むことにしたのです。　わっはっはっ。\n@c2@"
"67":
  de: "@a@b*: Hier ist noch viel Platz, Süßer. Du kannst auch hier leben, wenn du willst.\n@c1@"
  en: "@a@b*: There's plenty o' space in the den fer more cubs. You can come an' live here too, if ye loik.\n@c1@"
  es: "@a@b*: Hay sitio en la madriguiera para más cachiorros. Si quieres, puedes vienir a vivir aquí tú también.\n@c1@"
  fr: "@a@b*ⓢ Nous avons encore de la place pour tous les petits rusés dans votre genre. Vous pouvez venir vivre avec nous, si vous voulez.\n@c1@"
  it: "@a@b*: Qui c'è posto per tutti, sai? Vieni pure te a vive' qui, se ti garba! Questa sì che sarebbe una scelta furba come una...\n㈡\n*: Ehm, sarebbe una scelta molto furba.\n@c1@"
  ja: "@a@b＊「あなたも　この村で\n\t暮らせばいいのに……。\n@c1@"
"68":
  de: "@a@b*: Mein Oller war auch ein Reisender. Doch dann ist er hierher zu mir gekommen. Grrr, grrr, grrr, grrr!... Ähem!\n@c1@"
  en: "@a@b*: Me own fella was a traveller before.\nBut now he's come to live here with me.\nGrrr-ruff. Ruff, ruff, ruff! ...Ahem!\n@c1@"
  es: "@a@b*: Mi compañiero también era viajero antes.\nPero ahora ha vienido a vivir aquí conmigo.\nGrrr-ruff. ¡Grrr, gruff, gruff! ¡Ejem!\n@c1@"
  fr: "@a@b*ⓢ Mon compagnon à moi était un grand voyageur autrefois. Mais maintenant, il s'est installé avec moi.\nOuouf, ouuuuh... humⓠ\n@c1@"
  it: "@a@b*: Pure il mio amico era sempre in giro per il mondo, ma ora ha deciso di veni' a vive' huì con me! Grrr-ruff. Ruff, ruff, ruff! Ahem...!\n@c1@"
  ja: "@a@b＊「ウチの人も　はじめは　旅人として\n\tこの村に　来たのですよ。\n\tこんこんこん……。\n@c1@"
"69":
  de: "@a@b*: Ach, du liebes Bisschen... Hab wohl zu viel Hühnerfleisch gegessen... Da fuchst mich was im Hals!\n@c1@"
  en: "@a@b*: Oh, dear... I moit have a bad dose o' the splutters comin' on... I'm feelin' a bit grrruff in the throat!\n@c1@"
  es: "@a@b*: ¡Oh!, vaya... Crieo que mi está dando un catarro...\n¡Mi garganta está un poco riasposa!\n@c1@"
  fr: "@a@b*ⓢ Oh non... Ce doit être une mauvaise toux...\nJ'ai comme une boule de poils coincée dans la gorgeⓠ\n@c1@"
  it: "@a@b*: Maremma volpina... Mi sa che ho esagerato col cibo... Mi sento come se avessi mangiato un intero pollaio...\n@c1@"
  ja: "@a@b＊「あら？\n\tカゼを　ひいちゃったみたい。\n@c1@"
"70":
  de: "@aBello@bWuff!\n@c2@"
  en: "@aFido@bWoof!\n@c2@"
  es: "@aPush@b¡Guau!\n@c2@"
  fr: "@aFlip@bOuafⓠ\n@c2@"
  it: "@aFido@bBau!\n@c2@"
  ja: "@a@bトーマス「わんわんわん！\n@c2@"
"71":
  de: "@a@b*: Hiiiiilfe! Ein Hund!\nGrrr... HILFE!\n@c2@"
  en: "@a@b*: Heeelp! A dog!\nGrrr... HELP!\n@c2@"
  es: "@a@b*: ¡Ayiuuuda! ¡Un pierro!\nGrrr... ¡Ayiuda!\n@c2@"
  fr: "@a@b*ⓢ Au secoursⓠ Un chienⓠ\nGrrr... À L'AIDEⓠ\n@c2@"
  it: "@a@b*: Aiutooo! Un cane! Grrr... AIUTO!\n@c2@"
  ja: "@a@b＊「うわ～　助けてくれー！\n\t犬は　苦手なんだ！\n@c2@"
"72":
  de: "@a@b*: Nein! Meine Kräfte lassen nach!\nSie schwinden...\n@c2@"
  en: "@a@b*: No! I'm losin' me powers!\nThey're fadin' away...\n@c2@"
  es: "@a@b*: ¡No! ¡Estoy pierdiendo mis pioderes!\nSe están esfumiando...\n@c2@"
  fr: "@a@b*ⓢ Nonⓠ Mes pouvoirs faiblissentⓠ\nIls disparaissent...\n@c2@"
  it: "@a@b*: No! Sto perdendo i miei poteri! Stanno svanendo...\n@c2@"
  ja: "@a@b＊「ああ　ダメだ……。\n\t私の神通力が……。\n@c2@"
"73":
  de: "@a@b*: Grrr-grrr, oh Mann. Kannst du nicht ein Auge zudrücken? Ich werd auch nie wieder was anstellen, versprochen.\n@c2@"
  en: "@a@b*: Grrr-ruff, what a desperate mess.\nWould ye turn a blind eye just this once?\nI'll not be up to me foxery again, I promise.\n@c2@"
  es: "@a@b*: Grrr-ruff, vaya un desiastre más horroroso.\nPor esta viez, ¿piodrías hacier la vista gorda?\nPriometo que no violveré a hacerlo.\n@c2@"
  fr: "@a@b*ⓢ Grrr, ououffⓠ Quelle pagailleⓠ\nJe vous promets que je ne mettrai plus mon museau là où je ne dois pas.\n㈡\n*ⓢ Vous ne pourriez pas fermer les yeux\nlà-dessus pour cette foisⓡ\n@c2@"
  it: "@a@b*: Grrr-ruff, che cagnara! Pe' questa volta 'unn'è che %H860%Xchiuderesti%Ychiudereste%Z un occhio? Ho imparato la lezione, grrr-ruff... 'Un farò più bischerate simili, lo prometto!\n@c2@"
  ja: "@a@b＊「こんこん　まいりました。\n\tどうか　逃がしてください。\n\tもう　二度と　悪さをしませんから……。\n@c2@"
"74":
  de: "@a@b*: Danke! Du bist wirklich in Ordnung. Als kleine Belohnung geb ich dir diese Rüstung.\n@c2@"
  en: "@a@b*: Grand! Aye, ye're a decent fella, so y'are.\nLet me give ye this suit of armour as a reward.\n@c2@"
  es: "@a@b*: ¡Estiupendo! Eres un tipo muy deciente, es cierto.\nComo recompiensa ti daré esta armadura.\n@c2@"
  fr: "@a@b*ⓢ Merciⓠ Vous êtes vraiment quelqu'un de bien.\nLaissez-moi vous remercier en vous donnant cette armure.\n@c2@"
  it: "@a@b*: Grrrande! È bello incontrare della brava gente. Come segno di rihonoscenza, grrr-ruff... %H860%Xti%Yvi%Z prego d'accetta' huest'armatura.\n@c2@"
  ja: "@a@b＊「ああ　よかった！\n\t逃がしてくれる　お礼に\n\tこのよろいを　差し上げましょう。\n@c2@"
"75":
  de: "@a@bTorneko erhält eine Ritterrüstung.\n@c2@"
  en: "@a@bTorneko receives a suit of full plate armour.\n@c2@"
  es: "@a@bTorneko recibe una armadura completa.\n@c2@"
  fr: "@a@bTorneko obtient une armure de plates.\n@c2@"
  it: "@a@bBaldo riceve un'armatura a piastre.\n@c2@"
  ja: "@a@bトルネコは\nはがねのよろいを　手に入れた！\n@c2@"
"76":
  de: "@a@b*: Gut. Der Schuss ging nach hinten los. Ich such mir dann mal ein anderes Revier. Leb wohl. Grrr-grrr.\n@c2@"
  en: "@a@b*: Roit. I'll be makin' tracks, then, with me tail between me legs. Slan agat. Grrr-ruff!\n@c2@"
  es: "@a@b*: Corriecto. Emprinderé mi viaje, con el riabo entre las piernas. Hasta prionto. ¡Grrr-ruff!\n@c2@"
  fr: "@a@b*ⓢ Bien. Je vais repartir, la queue entre les pattes. Au revoir. Grrr ououffⓠ\n@c2@"
  it: "@a@b*: Bene. Ora vo via, con la hoda tra le gambe... Ci si rivede! Grrr-ruff!\n@c2@"
  ja: "@a@b＊「こんこん\n\tでは　さようなら。\n@c2@"
"77":
  de: "@a@b*: Darf ich mich vorstellen? Archibald Tekt ist mein Name. Würdet Ihr mir erklären, was hier vor sich geht?\n@c2@"
  en: "@a@b*: Allow me t'introduce meself. Archie O'Tect's the name. Now would ye tell me what the devil's goin' on here?\n@c2@"
  es: "@a@b*: Permítame que mi presiente. Mi niombre es Al Quitecto. Y ahora, ¿piodría decirme qué demonios suciede aquí?\n@c2@"
  fr: "@a@b*ⓢ Enchantéⓠ Hector Busier, pour vous servir. Vous pouvez m'expliquer ce qui se passeⓡ\n@c2@"
  it: "@a@b*: %H860%XPermetti%YPermettete%Z che mi presenti: io so' Archie Tett, e vorrei sape' che sta succedendo huì!\n@c2@"
  ja: "@a@b＊「わたしは　ドン・ガアデといいますが\n\tいったい　これは　どうしたんでしょう？\n@c2@"
"78":
  de: "@aArchibald@bIch war in letzter Zeit nicht ganz ich selbst.\nMeine ich das nur, oder stand hier nicht mal ein kleines Dorf?\n@c2@"
  en: "@aArchie O'Tect@bI haven't been feelin' meself, ye know.\nTell me, is it just me, or was there not a small village here before?\n@c2@"
  es: "@aAl Quitecto@bÚltimamiente, no mi siento muy bien que digamos.\nDígame, ¿es cosa mía o anties había aquí un piequeño pueblo?\n@c2@"
  fr: "@aHector Busier@bJe me sens bizarre.\nDites-moi, je me trompe ou il y avait un petit village ici, avantⓡ\n@c2@"
  it: "@aArchie Tett@bUn so' sihuro di sta' tanto bene. Me lo so' sognato, o huì prima c'era un piccolo villaggio?\n@c2@"
  ja: "@a@bドン・ガアデ「ふと　気づいたら\n\t村が　なくなっていて……。\n@c2@"
"79":
  de: "@aArchibald@bUm Himmels willen! Das hab ich ja ganz vergessen. Was steh ich hier noch rum?!\n@c2@"
  en: "@aArchie O'Tect@bJaney Mac! I clean forgot.\nI can't be dodderin' about here.\n@c2@"
  es: "@aAl Quitecto@b¡Alabada sea la Diosa! Si mi olvidió.\nNo puedo pierder el tiempo.\n@c2@"
  fr: "@aHector Busier@bEh bienⓠ J'ai tout oublié.\nBon, je ne vais pas moisir ici.\n@c2@"
  it: "@aArchie Tett@bMaremma infingarda! 'Un mi ricordo nulla. Ma che ci so' venuto a fa' huì?\n@c2@"
  ja: "@a@bドン・ガアデ「そうだ！\n\tこんなことを　している場合では\n\tなかったのだ！\n@c2@"
"80":
  de: "@aArchibald@bIch muss zur Burg Bruckstetten! Entschuldigt bitte.\n@c2@"
  en: "@aArchie O'Tect@bI must be headin' to Ballymoral Castle.\nExcuse me, now.\n@c2@"
  es: "@aAl Quitecto@bDiebo dirigirme al Castillo de Alcazaba.\nPerdiona.\n@c2@"
  fr: "@aHector Busier@bJe dois me rendre au château de Ballimore.\nSi vous voulez bien m'excuser...\n@c2@"
  it: "@aArchie Tett@bIo c'ho d'anda' a i'ccastello di Balmontone! Chiedo scusa, ma so' di fretta.\n@c2@"
  ja: "@a@bドン・ガアデ「早く　ボンモールのお城に\n\t行かなくては……。\n\tでは　失礼！\n@c2@"
"81":
  de: "@a@b*: Ach, sei doch nicht so, Mann.\nWenn du clever bist, lässt du mich alten Fuchs laufen...\n@c2@"
  en: "@a@b*: Don't be so harsh, now.\nA cunnin' man would let an ole fox off...\n@c2@"
  es: "@a@b*: No seas malo.\nUn hombre inteligiente dejaría marchiar a un viejo ziorro...\n@c2@"
  fr: "@a@b*ⓢ Ne soyez pas dur. Quelqu'un de rusé laisserait un vieux renard s'en aller...\n@c2@"
  it: "@a@b*: 'Unn esse' tanto duro. Avanti, perdona huesta povera volpina...\n@c2@"
  ja: "@a@b＊「そんな　意地悪言わないで\n\t逃がしてくださいよお。\n@c2@"
