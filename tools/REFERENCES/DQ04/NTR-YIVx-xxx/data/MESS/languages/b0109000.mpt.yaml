  fr: "@aKiryl@bJ'espèяe иe jamais яetouяиeя eи pяisoи.\nDites... je иe seиtiяais pas uи peu le яeиfeяmé, làⓡ\n@c2@"
  it: "@aKyril@bSpero che io nyet finisce più in prigione. Forse io puorto su di me tanfo di cella? Io bisogno di muolto sapone, da.\n@c2@"
