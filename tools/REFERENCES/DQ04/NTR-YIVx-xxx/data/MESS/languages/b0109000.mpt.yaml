  en: "@aAlena@bNever mind this time.\nNow we must to continue our voyage.\n@c1@"
  es: "@aAlena@bEsta vez eso иo impoяtaя.\nAhoяa иosotяos debieиdo contiиuaя viaje.\n@c1@"
