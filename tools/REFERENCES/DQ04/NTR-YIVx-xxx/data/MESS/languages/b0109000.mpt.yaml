  es: "@aAlena@bEstaиdo mucho abuяяida de estaя eи cáяcel poя taиto tiempo laяgo. Depяisa. Yéиdoиos.\n@c1@"
  fr: "@aAlina@bPaяtoиs vite d'ici. J'eи ai plus qu'assez de cette cellule.\n@c1@"
  it: "@aAlena@bPer me è stata grande noia rimanere tanto tempo in miciascura, cioè vuoglio dire in gattabuia. Fuorza, andiamo via.\n@c1@"
