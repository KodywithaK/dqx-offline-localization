  es: "@aMeena@b¿%H860%XHa%YHan%Z capturado al verdadero criminal?\nSiempre supe que %H860%Xregresaría%Yregresarían%Z para sacarme de aquí.\n@c1@"
  fr: "@aMina@bVous avez attrapé le criminelⓡ\nJ'étais convaincue que vous me sortiriez de là.\n@c1@"
  it: "@aMyra@b%H860%XHai%YAvete%Z preso il bandito? Ho sempre saputo che non mi %H860%Xavresti%Yavreste%Z abbandonata!\n@c1@"
  ja: "@a@bミネア「犯人を　つかまえたんですね。\n\tみなさんなら　やってくれると\n\t信じてました。\n@c1@"
