  ja: "@a@b＊「すてきなお洋服ばかりだから\n\t汚い手でさわっちゃ　ダメよ。\n@c1@"
"39":
  de: "@a@b*: Ich wusste von Anfang an, dass Ihr unschuldig seid.\n@c2@"
  en: "@a@b*: I knew you were innocent right from the start.\n@c2@"
  es: "@a@b*: Desde el principio supe que %H860%Xera inocente%Yeran inocentes%Z.\n@c2@"
  fr: "@a@b*ⓢ J'étais convaincue de votre innocence dès le début.\n@c2@"
  it: "@a@b*: Ho sempre saputo che %H860%Xeri innocente%Yeravate innocenti%Z!\n@c2@"
  ja: "@a@b＊「じつは　わたしは\n\t初めから　あなたたちを\n\t信じていました。\n@c2@"
"40":
  de: "@a@b*: Das ist weibliche Intuition, wisst Ihr. Ich bin mir sicher, dass die Königin genauso denkt.\n@c2@"
