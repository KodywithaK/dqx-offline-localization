  it: "@aAlena@bBeh, nyet importa.\nOra noi dobbiamo cuontinuare nuostro viaggio.\n@c1@"
  ja: "@a@bアリーナ「ま　いいわ。\n\tさあ　早く　ここから出してよ。\n@c1@"
"56":
  de: "@aKyrill@bEs ist wunderbar, dass Verbrecher wurde gefasst. Die Göttin ist unfehlbar. Nun wir wollen gehen.\n@c2@"
  en: "@aKiryl@bIt is happy that criminal is caught.\nGoddess does not give to cow that butts.\nNow, let us go.\n@c2@"
  es: "@aKiryl@bYo coиteиto poя cяimiиal captuяado. Diosa иo ayudaя a hombяes malvados. Ahoяa иosotяos maяchaя.\n@c2@"
  fr: "@aKiryl@bJe suis heuяeux que ce cяimiиel ait été attяapé.\nLa Déesse иe laisse aucuи cяime impuиi.\nЯepяeиoиs la яoute, maiиteиaиt.\n@c2@"
  it: "@aKyril@bSono felice che ladro è stato catturato. Dea nyet permette che uomini malvagi fanno loro cuomodi!\n@c2@"
  ja: "@a@bクリフト「犯人を　とらえたそうですね。\n\tやはり　神は見ておられた！\n\tさあ　ここから　出してください。\n@c2@"
"57":
  de: "@aBorja@bAnschuldigungen gegen uns also sich haben als falsch bewiesen. Ich hatte mir schon schrecklich Sorge gemacht.\n@c2@"
  en: "@aBorya@bSo finally our false accusation is proved empty. This mishap was terrible worry for me.\n@c2@"
  es: "@aBorya@bFiиalmeиte demostяaя que acusacióи иuestяa falsa sieиdo. Este coиtяatiempo habieиdo pяeocupado mucho a mí.\n@c2@"
  fr: "@aBorya@bAiиsi иos accusatяices oиt eu la pяeuve de иotяe iииoceиce.\nCette mésaveиtuяe m'a vяaimeиt fait peuя.\n@c2@"
  it: "@aBoris@bFinalmente ingiuste accuse cuontro di noi sono cadute!\nQuesta è stata pruova muolto dura per me... \n@c2@"
  ja: "@a@bブライ「やれやれ。　ようやく\n\tぬれぎぬが　晴れたそうですな。\n\tとんだ　災難でしたわい。\n@c2@"
"58":
  de: "@aBorja@bWir müssen nun nicht länger weilen hier.\nBefreit mich, bitte.\n@c2@"
  en: "@aBorya@bThere is no use for us to remain here more. Please release me.\n@c2@"
  es: "@aBorya@bYa иo siяvieиdo de иada que иosotяos quedaя aquí.\nPoя favoя, libeяaяme.\n@c2@"
  fr: "@aBorya@bIl est iиutile de s'attaяdeя ici.\nLibéяez-moi, s'il vous plaît.\n@c2@"
  it: "@aBoris@bOra nyet necessario che io resta qui.\nPer favore, ora io vuole uscire.\n@c2@"
  ja: "@a@bブライ「さて　そうなれば\n\tこんな所に　長居は無用。\n\t早く　出してくだされ。\n@c2@"
"59":
  de: "@aTorneko@bIhr habt den Halunken also? Der Göttin sei dank! So, jetzt macht das Tor auf und holt mich hier raus.\n@c2@"
  en: "@aTorneko@bYe've caught the criminal, have ye? Well thank the Goddess for that! Now crack this gate open and let yer ole friend out, would ye?\n@c2@"
  es: "@aTorneko@b%H860%XHas%YHabéis%Z captiurado al criminal, ¿verdiad? ¡Gracias a la Diosia lo %H860%Xhas%Yhabéis%Z consieguido! Ahora %H860%Xabrie%Yabrid%Z esa puertia y %H860%Xlibiera%Ylibierad%Z a este viejio amigo %H860%Xtuyo%Yvuestro%Z.\n@c2@"
  fr: "@aTorneko@bVous avez attrapé le criminel, c'est çaⓡ\nNous pouvons remercier la Déesseⓠ\nMaintenant, sortez votre vieil ami de làⓠ\n@c2@"
  it: "@aBaldo@bMa che te ha' preso il ladro?! Maremma bandita, questa sì che è una notizia! Forza, %H860%Xapri%Yaprite%Z huesta porta, 'un gliela fò più!\n@c2@"
  ja: "@a@bトルネコ「ああ　よかった！\n\t犯人を　つかまえてくれたんですね。\n\tさあ　早く　ここを開けてください。\n@c2@"
"60":
  de: "@aMaya@bTatsächlich?! Wir sind frei? Oh, das ist ein Stück Glück! Schnell. Holt mich hier raus. Es ist nicht besonders schön hier.\n@c1@"
  en: "@aMaya@bReally!? We're in the clear? Oh, that's smashing! Quick, then. Let me out. I'm really hating it in here.\n@c1@"
  es: "@aMaya@b¿De verdad? ¿Podemos marchar? ¡Oh, eso es maravilloso! Rápido entonces. %H860%XSáqueme%YSáquenme%Z. Realmente, odio este sitio.\n@c1@"
  fr: "@aMaya@bVraimentⓠⓑ Nous sommes %R000%Xlavées%Ylavés%Z de tout soupçonⓡ\nAlors faites-moi vite sortir d'ici.\nJe déteste cet endroit.\n@c1@"
  it: "@aMaya@bSiamo stati scagionati?!? Ma davvero? Che bello!\nAvanti, voglio uscire! Non ne potevo più di stare qui dentro!\n@c1@"
  ja: "@a@bマーニャ「ぬれぎぬが　晴れたのね！？\n\tよかった。　早く　出してちょうだい！\n\tもう　こんな所　たえられない……。\n@c1@"
"61":
