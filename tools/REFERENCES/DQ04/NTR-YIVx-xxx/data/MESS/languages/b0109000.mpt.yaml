  it: "@aBaldo@bMaremma imprigionata! Temevo sarei rimasto hiuso lì dentro pe'cchissà huanto tempo!\n@c2@"
  ja: "@a@bトルネコ「ひょっとしたら　このまま\n\tおいていかれるんじゃないかって\n\t考えちゃいましたよ。\n@c2@"
"71":
