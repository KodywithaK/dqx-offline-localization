  it: "@a@b*: %H860%XTe ne vai, non è così? Vorrei che restassi%YVe ne andate, non è così? Vorrei che restaste%Z.\n@c2@"
  ja: "@a@b＊「行ってしまうのですね？\n\tさみしくなるなあ……。\n@c2@"
"46":
  de: "@a@b*: Äh... Ich meine... Ähem! Entschuldigung. Ich wollte sagen, viel Glück!\n@c2@"
