  es: "@a@b*: Como %H860%Xve%Yven%Z, intuición femenina.\nEstoy segura de que Su Majestad la Reina también lo supo.\n@c2@"
  fr: "@a@b*ⓢ L'intuition féminine, vous voyez.\nJe suis persuadée que Sa Majesté le savait également.\n@c2@"
  it: "@a@b*: %H860%XChiamalo ⓕintuito femminileⓖ, se vuoi%YChiamatelo ⓕintuito femminileⓖ, se volete%Z...\n㈡\n*: Sono certa che anche la nostra Regina fosse convinta che non %H860%Xavevi%Yavevate%Z commesso il furto.\n@c2@"
  ja: "@a@b＊「目を見れば　わかります！\n\t女王さまも　きっと\n\t同じ気持ちだったのでしょう。\n@c2@"
"41":
  de: "@aKönigin von Femiscyra@bMeine Untertaninnen haben mir berichtet, dass Ihr vorhabt, den Herrn der Unterwelt zu besiegen.\n@c1@"
  en: "@aQueen of Femiscyra@bMy people in the castle inform me that you are on a quest to defeat the Lord of the Underworld.\n@c1@"
  es: "@aReina de Feministia@bMis súbditas del castillo me informan de que %H860%Xha%Yhan%Z emprendido una misión para derrotar al Señor del Inframundo.\n@c1@"
  fr: "@aReine de Fémiscyra@bMes sujets m'ont dit que vous avez l'intention de combattre le Seigneur des Enfers.\n@c1@"
  it: "@aRegina di Femiscyra@bMi è stato riferito che %H860%Xstai%Ystate%Z cercando di sconfiggere il Signore degli Inferi.\n@c1@"
  ja: "@a@b女王「あれから　城の者に聞いたのですが\n\tそなたたちは　地獄の帝王を\n\t倒すため　旅をしているとか。\n@c1@"
"42":
  de: "@aKönigin von Femiscyra@bNun, es gibt einen Ort südlich von hier, Rosenbühl... Dort wohnten einst viele Monster.\n@c1@"
  en: "@aQueen of Femiscyra@bWell, there is a place called Rosehill to the south of this continent where monsters once lived.\n@c1@"
  es: "@aReina de Feministia@bPues bien, hay un lugar llamado Rosavilla, al sur de este continente, que fue una vez morada de monstruos.\n@c1@"
  fr: "@aReine de Fémiscyra@bAu sud de ce continent se trouve un endroit appelé Rosecolline. Des monstres y vivaient, autrefois.\n@c1@"
  it: "@aRegina di Femiscyra@bA sud di questo continente c'è Col Rosato, un luogo un tempo abitato da mostri.\n@c1@"
  ja: "@a@b女王「そういえば　この地より南\n\tロザリーヒルには　かつて\n\t魔族が　住んでいたそうです。\n@c1@"
"43":
  de: "@aKönigin von Femiscyra@bVielleicht erhaltet Ihr dort ein paar nützliche Informationen. Aber beeilt Euch. Die Zeit ist knapp!\n@c1@"
  en: "@aQueen of Femiscyra@bPerhaps you will learn something useful there. But hurry. Remember, time and tide wait for no woman!\n@c1@"
  es: "@aReina de Feministia@bQuizá haya algo útil que aprender allí. Pero da%H860%Xte%Yos%Z prisa. ¡%H860%XRecuerda%YRecordad%Z, el tiempo pasa inexorablemente para todas!\n@c1@"
  fr: "@aReine de Fémiscyra@bVous y apprendrez peut-être quelque chose d'intéressant. Faites vite. L'Histoire n'attend pasⓠ\n@c1@"
  it: "@aRegina di Femiscyra@bForse lì %H860%Xpotresti trovare qualche indizio utile per la tua%Ypotreste trovare qualche indizio utile per la vostra%Z ricerca. Ma %H860%Xdevi affrettarti%Ydovete affrettarvi%Z, perché non c'è molto tempo a disposizione.\n@c1@"
  ja: "@a@b女王「何か　わかるかもしれません。\n\t行ってみると　よいでしょう。\n@c1@"
"44":
  de: "@a@bIm Kleiderschrank befinden sich zahllose schöne Roben.\n@c0@"
  en: "@a@bThe wardrobe is packed full of gorgeous dresses.\n@c0@"
  es: "@a@bEl armario está repleto de hermosos vestidos.\n@c0@"
  fr: "@a@bCette garde-robe déborde de robes magnifiques.\n@c0@"
