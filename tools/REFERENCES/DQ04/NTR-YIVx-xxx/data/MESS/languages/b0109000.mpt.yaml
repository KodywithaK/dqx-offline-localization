"78":
  de: "@a@b*: Irgendwo, IRGENDWO in dieser Welt ist ein unglaublich mächtiger Stab versteckt. Der Blitzstab!\n@c1@"
  en: "@a@b*: Somewhere, SOMEWHERE in this world is a staff of incredible magic. Yes, the lightning staff!\n@c1@"
  es: "@a@b*: En algún lugar, EN ALGÚN LUGAR de este mundo hay un bastón increíblemente mágico. Sí, ¡el báculo de luz!\n@c1@"
  fr: "@a@b*ⓢ Quelque part, QUELQUE PART dans notre monde se trouve un bâton magique extraordinairement puissant. Il s'agit du bâton de foudreⓠ\n@c1@"
  it: "@a@b*: Da qualche parte nel mondo è nascosto un bastone dotato di poteri incredibili: il Bastone del fulmine!\n@c1@"
  ja: "@a@b＊「なんでも　この世のどこかに\n\tいかずちの杖とよばれる\n\t強力な魔法の杖が　あるそうですね。\n@c1@"
"79":
  de: "@a@b*: Als Zauberin muss ich so was schließlich wissen! Ich muss herausfinden, wie mächtig seine Magie wirklich ist!\n@c1@"
  en: "@a@b*: As a sorceress, I have to know! I must see for myself just how powerful its magic really is!\n@c1@"
  es: "@a@b*: Como hechicera, tengo que saberlo. Debo comprobar por mí misma cuán poderosa es en realidad su magia.\n@c1@"
  fr: "@a@b*ⓢ En tant que sorcière, il faut que je sacheⓠ\nIl faut que je voie à quel point il est puissantⓠ\n@c1@"
  it: "@a@b*: In qualità di strega, devo scoprire di cosa si tratti! Voglio sperimentare con le mie mani tutta la sua incommensurabile potenza!\n@c1@"
  ja: "@a@b＊「わたしも　魔法使いとして\n\tどれほどの魔力を秘めた杖なのか\n\tこの目で　確かめてみたいものです。\n@c1@"
"80":
  de: "@a@b*: Nachts ist die Burg verschlossen. Aus Sicherheitsgründen.\n@c2@"
  en: "@a@b*: The castle is locked at night.\nItⓙs dangerous.\n@c2@"
  es: "@a@b*: El castillo permanece cerrado de noche.\nEs peligroso.\n@c2@"
  fr: "@a@b*ⓢ Le château est fermé la nuit pour des raisons de sécurité.\n@c2@"
  it: "@a@b*: Di notte il castello è chiuso. Può essere pericoloso, da queste parti... \n@c2@"
  ja: "@a@b＊「夜は　不用心ゆえ\n\tお城を　閉めてしまいます。\n@c2@"
"81":
  de: "@a@b*: Kommt morgen wieder.\n@c2@"
  en: "@a@b*: Come back in the morning, please.\n@c2@"
  es: "@a@b*: %H860%XRegrese%YRegresen%Z por la mañana, se lo ruego.\n@c2@"
  fr: "@a@b*ⓢ Revenez demain matin, s'il vous plaît.\n@c2@"
  it: "@a@b*: Per favore, %H860%Xtorna%Ytornate%Z domattina.\n@c2@"
  ja: "@a@b＊「どうか　また　明日の朝\n\tおこしくださいまし。\n@c2@"
"82":
  de: "@a@b*: Hatschi! Ich war gerade... nun ja, Ihr wisst schon... ich musste mich erleichtern, und da haben sie einfach das Tor zugemacht!\n@c2@"
  en: "@a@b*: Ahchoo! I was just...well, you know...relieving myself out here, when they went and shut the castle gates on me!\n@c2@"
  es: "@a@b*: ¡Achíís! Yo solo estaba... bien, bueno... aliviando aquí fuera mis necesidades, ¡cuando llegaron y me cerraron las puertas del castillo en las narices!\n@c2@"
  fr: "@a@b*ⓢ Atchoumⓠ J'étais juste... enfin... en train de me soulager quand elles ont refermé les portes du châteauⓠ\n@c2@"
  it: "@a@b*: Etciù! Io... Ecco, ero venuto ad ⓕalleggerirmiⓖ, e mi hanno chiuso fuori dal castello!\n@c2@"
  ja: "@a@b＊「あちゃ～。\n\t外で　たばこ吸ってたら\n\t城門を　閉められちまったよ。\n@c2@"
"83":
  de: "@a@b*: Jetzt muss ich die ganze Nacht hier draußen verbringen. Schon wieder! Hmpf. Diese Frauen!\n@c2@"
  en: "@a@b*: I'm going to have to spend the whole night out here now. Again!\nHmph! Women, eh!?\n@c2@"
  es: "@a@b*: Tendré que pasar toda la noche aquí fuera. ¡Otra vez!\n¡Umpf! ¡Mujeres!\n@c2@"
  fr: "@a@b*ⓢ Je vais devoir passer la nuit dehors.\nEncore une foisⓠ\nMmpfⓠ Les femmes...\n@c2@"
  it: "@a@b*: E ora mi tocca passare tutta la notte qui fuori! E non è mica la prima volta, eh! Ah, le donne! Pfui a loro!\n@c2@"
  ja: "@a@b＊「こりゃ　今晩は　ここで\n\t夜明かしするしかないな。\n\t……はあ　ついてねえや。\n@c2@"
"84":
  de: "@a@b*: Jo, das ist Landrattingen hier.\n@c1@"
  en: "@a@b*: This here be Dunplundrin, arrr!\n@c1@"
  es: "@a@b*: ¡Esto es Dunplundrin, arrr!\n@c1@"
  fr: "@a@b*ⓢ Ici, c'est Pillasac, grrrⓠ\n@c1@"
  it: "@a@b*: Uè, %H860%Xbellezza%Ybellezze%Z, chistu posto si chiama Furpredon.\n@c1@"
  ja: "@a@b＊「ここは　海辺の村だよ！\n@c1@"
"85":
  de: "@a@b*: Unsere Vorfahren waren Piraten, jawohl! Aber eines schönen Tages haben sie dieses einträgliche Geschäft aufgegeben und sich hier niedergelassen.\n@c2@"
  en: "@a@b*: Our ancestors be pirates, arrr!\nBut then one day they give up the sweet trade and set up home here.\n@c2@"
  es: "@a@b*: ¡Nuestros antepasados eran piratas, arrr!\nPero un día dejaron el negocio y se establecieron aquí.\n@c2@"
  fr: "@a@b*ⓢ Nos ancêtres étaient des pirates, grrrrⓠ\nUn jour, ils sont revenus sur la terre ferme et se sont installés ici.\n@c2@"
  it: "@a@b*: Gli antenati nostri erano pirati, poi 'nu bello juorno hanno finito chella nobbile attività e si sono stabiliti accà.\n@c2@"
  ja: "@a@b＊「私たちの祖先は　海賊でしたが\n\tあるとき　彼らは　船を捨て\n\t陸にあがったそうです。\n@c2@"
"86":
  de: "@a@b*: Und ihre Beute haben sie tief in einem Wasserfall versteckt, irgendwo auf dieser schönen, weiten Welt.\n@c2@"
  en: "@a@b*: An' they left their booty hidden deep in a waterfall somewhere in this big, wide world.\n@c2@"
  es: "@a@b*: Y ocultaron su botín en lo más profundo de una cascada, en algún lugar del ancho mundo.\n@c2@"
  fr: "@a@b*ⓢ Et ils ont caché leur trésor sous une chute d'eau quelque part.\n@c2@"
  it: "@a@b*: Hanno nascosto tutto il loro bottino in una cascata da qualche parte. Ma chi 'o 'ssape 'aro l'hanno mettuto!\n@c2@"
  ja: "@a@b＊「世界のどこかの　滝の奥深くに\n\t集めた財宝を　かくしたまま……。\n@c2@"
"87":
  de: "@a@b*: Es heißt, dass der Schatz auch ein Flüssigmetallschwert beinhaltet. Jo!\n@c2@"
  en: "@a@b*: Folk say there's a liquid metal sword in amongst their loot, too. Arrr!\n@c2@"
  es: "@a@b*: Se dice que en el botín hay incluso una espada metalíquida. ¡Arrr!\n@c2@"
  fr: "@a@b*ⓢ À ce qu'on dit, il y aurait une épée de mercure dans ce précieux butin. Grrrⓠ\n@c2@"
  it: "@a@b*: 'A gente dice pure che tra i tesori ci sta 'na Spada Murmur. 'I che bella cosa!\n@c2@"
  ja: "@a@b＊「うわさでは　その宝の中には\n\t究極の剣　はぐれメタルの剣が\n\tあったそうです。\n@c2@"
"88":
  de: "@a@b*: Bei Neptuns Bart! Ihr könnt mich doch nicht einfach so von der Arbeit abhalten. Kommt heute Nacht wieder, wenn Ihr plaudern wollt.\n@c3@"
  en: "@a@b*: Shiver me timbers!\nYa mustn't disturb a man at work.\nCome back tonight if ya want ta chat, matey.\n@c3@"
  es: "@a@b*: ¡Que Neptuno me lleve!\nNo se debe molestar a un hombre que trabaja.\nSi %H860%Xquieres%Yqueréis%Z charlar, %H860%Xgrumete%Ygrumetes%Z, %H860%Xvuelve%Yvolved%Z esta noche.\n@c3@"
  fr: "@a@b*ⓢ Mille sabordsⓠ\nOn dérange jamais quelqu'un qui bosse.\nSi vous voulez causer, repassez ce soir.\n@c3@"
  it: "@a@b*: Mannaggia ai mostri! Ma nun 'o %H860%Xssai%Yssapite%Z che nun s'adda disturba' 'a ggente ca fatica? Si %H860%Xvuo' parla', tuorna%Yvulite parla', turnate%Z stasera.\n@c3@"
  ja: "@a@b＊「おっとっと　今は仕事中でい。\n\t話があるなら　夜に来てくんな！\n@c3@"
"89":
  de: "@a@b*: Das sind die Gräber unserer Vorfahren. Es waren Gentlemen auf der Suche nach dem Glück... Na ja, man könnte sie auch Piraten nennen.\n@c1@"
  en: "@a@b*: These are the graves of our ancestors. Gentlemen of fortune, they were.\n...Oh, okay then, pirates.\n@c1@"
  es: "@a@b*: Estas son las tumbas de nuestros antepasados. Eran caballeros de fortuna, sí que lo eran.\n... Vale, de acuerdo, piratas.\n@c1@"
  fr: "@a@b*ⓢ Ce sont les tombes de nos ancêtres... de riches nobles.\n... Bon, d'accord, des pirates.\n@c1@"
  it: "@a@b*: Cheste sono le tombe dei nostri avi. Erano tutti dei veri galantuomini! Va'bbuo', ja, erano pirati. E che differenza ci sta?\n@c1@"
  ja: "@a@b＊「ここは　海賊だった　祖先のお墓。\n@c1@"
"90":
  de: "@a@b*: Wenn nachts die Flut kommt, werden die Grabsteine überflutet. Jo, ist 'ne ziemlich nasse Sache.\n@c1@"
  en: "@a@b*: When the tide comes in at night, the gravestones are swallowed up by water.\nJust like Davy Jones' locker.\n@c1@"
  es: "@a@b*: Cuando la marea sube, por la noche, el agua se traga las tumbas.\nIgualito que si hubieran ido a pique.\n@c1@"
  fr: "@a@b*ⓢ Quand la marée monte, le soir, ces tombes sont recouvertes par les eaux.\nTout comme le fond de l'océan.\n@c1@"
  it: "@a@b*: Quando la marea sale di notte, le tombe finiscono sotto all'acqua. Vengono sommergiute, %H860%Xhai%Yavite%Z capito?\n@c1@"
  ja: "@a@b＊「海で死んだ者たちのように\n\tこのお墓もまた　夜になると\n\t海に沈んでしまいますわ。\n@c1@"
"91":
  de: "@a@b*: Wir hatten mal einen Karststein hier im Dorf. Wenn man den ins Meer geworfen hat, dann ist das Wasser an der Stelle einfach ausgetrocknet.\n@c2@"
  en: "@a@b*: We used ta have a karstaway stone here in our village, arrr. If ya dropped it in the sea, the water around it would dry up just like that.\n@c2@"
  es: "@a@b*: Aquí en el pueblo teníamos una piedra porosa. Si la tirabas al mar, el agua se secaba cual arenque revenido. ¡Arrr!\n@c2@"
  fr: "@a@b*ⓢ Dans l'temps, y'avait une pierre éponge dans notre village, grrr. Il suffisait de la jeter dans la mer pour qu'elle absorbe l'eau qui l'entourait.\n@c2@"
  it: "@a@b*: Tanto tiempo fa, nel nostro villaggio tenevamo 'na Spongipietra. Se la buttavi a mare, 'a roccia assorbiva l'acqua attorno a sé e la asciugava.\n@c2@"
  ja: "@a@b＊「昔この村に　かわきの石ってのが\n\tあってね　海に沈めると\n\t周囲だけ　干上がらせたんだってさ。\n@c2@"
"92":
  de: "@a@b*: Wuff wuff!\n@c2@"
  en: "@a@b*: Woof woof!\n@c2@"
  es: "@a@b*: ¡Guau, guau!\n@c2@"
  fr: "@a@b*ⓢ Ouaf ouafⓠ\n@c2@"
  it: "@a@b*: Bau! Bau! Bau!\n@c2@"
  ja: "@a@b＊「バウバウ！\n@c2@"
"93":
  de: "@a@b*: Ahoi, Matrosen.\nWir haben nicht oft Besuch hier.\n@c2@"
  en: "@a@b*: Ahoy there, me hearty.\nWe don't often get folk 'round these parts.\n@c2@"
  es: "@a@b*: ¡Saludos, %H860%Xgrumete%Ygrumetes%Z!\nNo suele venir mucha gente por aquí.\n@c2@"
  fr: "@a@b*ⓢ Bien l'bonjour, mon ami%A120%X%Z%B120%Xe%Z.\nCe n'est pas souvent qu'on a de la visite par ici.\n@c2@"
  it: "@a@b*: Uè! Come andiamo?\nNon teniamo molti visitatori 'a cheste parti accà!\n@c2@"
  ja: "@a@b＊「ここは　時の流れより\n\t忘れ去られた　名もない村じゃ。\n@c2@"
"94":
  de: "@a@b*: Die Legende vom Sand der Zeit kennt Ihr sicher nicht, hab ich Recht?\n@c2@"
  en: "@a@b*: I don't s'pose ya know the legend o' the sands of time, do ya?\n@c2@"
  es: "@a@b*: ¿A que no %H860%Xsabes%Ysabéis%Z la historia de las arenas del tiempo?\n@c2@"
  fr: "@a@b*ⓢ J'imagine que vous devez pas connaître la légende des sables du tempsⓡ\n@c2@"
  it: "@a@b*: La %H860%Xsai%Ysapite%Z 'a leggenda delle Sabbie del tempo, eh?\n@c2@"
  ja: "@a@b＊「ところで　お前さんたち\n\t時の砂の伝説を　知っておるか？\n@c2@"
"95":
  de: "@a@b*: Jo, das hätte mich auch schwer gewundert!\n@c2@"
  en: "@a@b*: Yo ho ho. Well, that be surprisin'!\n@c2@"
  es: "@a@b*: Jo, jo, jo. ¡Que me aspen!\n@c2@"
  fr: "@a@b*ⓢ Ho ho hoⓠ Ça me surprendrait bienⓠ\n@c2@"
  it: "@a@b*: Ah! Nun me l'aspettavo! Poca gente la sape.\n@c2@"
  ja: "@a@b＊「そうか　知っておったか……。\n@c2@"
"96":
  de: "@a@b*: Der Sand der Zeit ist ein sonderbarer Schatz, mit dem man die Zeit zurückdrehen kann.\n@c2@"
  en: "@a@b*: The sands o' time be a curious treasure with the power ta turn back time.\n@c2@"
  es: "@a@b*: Las arenas del tiempo son un curioso tesoro que tiene el poder de hacer retroceder el tiempo.\n@c2@"
  fr: "@a@b*ⓢ Les sables du temps, c'est un trésor étrange qui permet de remonter le temps.\n@c2@"
  it: "@a@b*: Le Sabbie del tempo sono 'na cosa che ha il potere 'e fa' turna' indietro 'o tiempo.\n@c2@"
  ja: "@a@b＊「時の砂には　少しだけ時間を戻す\n\t不思議なチカラがあるというぞ。\n@c2@"
"97":
  de: "@a@b*: Wenn man den besitzt, könnte das in einem Kampf schon mal den feinen Unterschied zwischen lebendig oder Fischfutter bedeuten.\n@c2@"
  en: "@a@b*: If ye had a thing like that in battle, it could make the difference 'tween life an' Fiddler's Green.\n@c2@"
  es: "@a@b*: Poseer algo así en combate puede marcar la diferencia entre vivir y criar malvas.\n@c2@"
  fr: "@a@b*ⓢ C'est le genre de truc qui peut vous éviter de manger les pissenlits par la racine à l'issue des combats.\n@c2@"
  it: "@a@b*: Se uno tenesse la possibilità di usare in battaglia 'na cosa comm'a chesta, diventerebbe praticamente invincibile!\n@c2@"
  ja: "@a@b＊「もし　そんなものあれば\n\tたとえ戦いで　命を落としても\n\t命拾いできるかも知れんのう……。\n@c2@"
"98":
  de: "@a@b*: Mein Alter ist ein stinkender, versoffener Faulpelz! Das Einzige, was er tut, ist schlafen!\n@c2@"
  en: "@a@b*: My old man is a bilge-drinkin' scallywag!\nAll he ever be doin' is sleepin'.\n@c2@"
  es: "@a@b*: ¡Mi viejo es un pillastre borrachín!\nNo hace más que dormir el día entero.\n@c2@"
  fr: "@a@b*ⓢ Mon mari est un vieux filou.\nIl passe son temps à dormir.\n@c2@"
  it: "@a@b*: Mio padre è 'nu 'mbriacone buono a niente.\nPassa 'a jurnata a durmì.\n@c2@"
  ja: "@a@b＊「まったく　うちの人ったら\n\t寝てばっかりいて！\n\tどういうつもりなのかしら……。\n@c2@"
"99":
  de: "@a@b*: Ha-püh...\n@c2@"
  en: "@a@b*: Ah-phew...\n@c2@"
  es: "@a@b*: Ah, fiuu...\n@c2@"
  fr: "@a@b*ⓢ Ron-pfff...\n@c2@"
  it: "@a@b*: Ronfff!\n@c2@"
  ja: "@a@b＊「ぐうぐう……。\n@c2@"
"100":
  de: "@a@b*: Jo, mein Mann ist Händler. Der weiß alles, was man so über Gegenstände wissen muss.\n@c1@"
  en: "@a@b*: Arrr. My husband's a trader an' he knows all there is ta know about items. \n@c1@"
  es: "@a@b*: Arrr. Mi marido es mercader y sabe todo lo que hay que saber sobre objetos. \n@c1@"
  fr: "@a@b*ⓢ Grrr. Mon mari est marchand et il sait tout sur tous les objets. \n@c1@"
  it: "@a@b*: Chillo 'o marito mijo è 'nu commerciante, e sape 'nu sacch'e cose su tutti gli oggetti.\n@c1@"
  ja: "@a@b＊「主人は商売がら　道具のことに\n\tとても　くわしいんですのよ。\n@c1@"
"101":
  de: "@a@b*: Grrr, grrr!\n@c2@"
  en: "@a@b*: Arrrf, arrrf!\n@c2@"
  es: "@a@b*: ¡Arrrf, arrrf!\n@c2@"
  fr: "@a@b*ⓢ Ouaf ouafⓠ\n@c2@"
  it: "@a@b*: Baaau! Baaau! Baaau!\n@c2@"
  ja: "@a@b＊「アオーン　アオーン！\n@c2@"
"102":
  de: "@a@b*: Ahoi! Wenn's Nacht wird und die Flut kommt, steht der ganze Strand unter Wasser.\n@c2@"
  en: "@a@b*: Ahoy! When night falls an' the tide comes in, the beach be covered in water.\n@c2@"
  es: "@a@b*: ¡Eh-oh! Cuando cae la noche y sube la marea, la playa queda cubierta de agua.\n@c2@"
  fr: "@a@b*ⓢ Bien l'bonjourⓠ Quand la nuit tombe et que la marée monte, la plage est recouverte par la mer.\n@c2@"
  it: "@a@b*: Uè, salve! Di notte, con il buio, la marea sale e tutta la spiaggia finisce sotto all'acqua.\n@c2@"
  ja: "@a@b＊「夜になると　このように潮が満ち\n\t砂浜も沈んでしまうのです。\n@c2@"
"103":
  de: "@a@b*: Bei rauher See hört sich der heulende Wind wie Menschenstimmen an.\n@c1@"
  en: "@a@b*: When the sea's rough, the wind starts ta sound like people's voices.\n@c1@"
  es: "@a@b*: Cuando el mar está bravo, el viento empieza a sonar como si fuesen voces de personas.\n@c1@"
  fr: "@a@b*ⓢ Quand la mer est déchaînée et que le vent souffle, on croirait entendre des voix.\n@c1@"
  it: "@a@b*: Quando 'o mare s'ingrossa, 'o sibilo 'ro viento pare 'na voce umana.\n@c1@"
  ja: "@a@b＊「海が荒れた日は　風の音が\n\t人の声のように聞こえるの。\n@c1@"
"104":
  de: "@a@b*: Als ob unsere Vorfahren uns in die Tiefen des Meeres rufen wollten.\n@c1@"
  en: "@a@b*: It's like hearin' our ancestors callin' ta us from down in Davy Jones' locker.\n@c1@"
  es: "@a@b*: Es como si nuestros antepasados nos llamasen desde el fondo del mar.\n@c1@"
  fr: "@a@b*ⓢ C'est un peu comme si nos ancêtres nous appelaient du fond de l'océan.\n@c1@"
  it: "@a@b*: Pare quasi che gli spiriti dei nostri antenati ci chiammano. Mamma mia, che 'mpressione!\n@c1@"
  ja: "@a@b＊「まるで　海で死んだ　先祖の霊の\n\t無念の声を聞いてるみたい……。\n@c1@"
"105":
  de: "@a@b*: Ha-püh, jo, ha-püh...\n@c1@"
  en: "@a@b*: Arrr-phew, arrr-phew...\n@c1@"
  es: "@a@b*: Arrr, fiuuu... arrr, fiuuu...\n@c1@"
  fr: "@a@b*ⓢ Ron-pfff, ron-pfff...\n@c1@"
  it: "@a@b*: Ronf! Ronf! Rooonfff!\n@c1@"
  ja: "@a@b＊「すやすや……。\n@c1@"
"106":
  de: "@a@b*: Bist du %A120%Xdas Kerlchen%Z%B120%Xdas Frauenzimmer%Z, das was über den Sand der Zeit wissen will?\n@c3@"
  en: "@a@b*: Are you the %A120%Xgent%Z%B120%Xwench%Z who wants ta know about the sands of time?\n@c3@"
  es: "@a@b*: ¿%H860%XEres tú%YSois %R000%Xvosotras%Yvosotros%Z%Z %H860%X%A120%Xel mozalbete%Z%B120%Xla muchacha%Z%Y%R000%Xlas muchachas%Ylos mozalbetes%Z%Z que %H860%Xquería%Yquerían%Z saber de las arenas del tiempo?\n@c3@"
  fr: "@a@b*ⓢ C'est vous %A120%Xle gars%Z%B120%Xla fille%Z qui veut des renseignements sur les sables du tempsⓡ\n@c3@"
  it: "@a@b*: Sì'ttu %A120%X'o guaglione%Z%B120%X'a guagliona%Z che vo' sape' informazioni sulle Sabbie del tempo?\n@c3@"
  ja: "@a@b＊「時の砂について\n\t聞きたいってのは　あんたかい？\n@c3@"
"107":
  de: "@a@b*: Der Legende nach nutzten ihn unsere Vorfahren für ihre kühnen Seemannskämpfe.\n@c3@"
  en: "@a@b*: Legend has it that our ancestors used it durin' their swashbucklin' battles.\n@c3@"
  es: "@a@b*: Cuenta la leyenda que nuestros antepasados las usaban en sus abordajes.\n@c3@"
  fr: "@a@b*ⓢ La légende dit que nos ancêtres s'en servaient pendant leurs batailles.\n@c3@"
  it: "@a@b*: Secondo la leggenda, gli antenati nostri le usavano in battaglia.\n@c3@"
  ja: "@a@b＊「なんでも　あれは　祖先たちが\n\t戦いのときに　使ったらしいぜ。\n@c3@"
"108":
  de: "@a@b*: Mit dem Sand der Zeit konnte man wohl die Zeit zurückdrehen, wenn das mit dem Kampf nicht so ganz geklappt hatte.\n@c3@"
  en: "@a@b*: Seems the sands o' time could be used ta turn back time if yer previous attack were scuppered.\n@c3@"
  es: "@a@b*: Según parece, las arenas del tiempo se pueden utilizar para hacer retroceder el tiempo si el ataque anterior ha fracasado.\n@c3@"
  fr: "@a@b*ⓢ Apparemment, les sables du temps leur permettaient d'remonter l'temps quand leurs attaques tombaient à l'eau.\n@c3@"
  it: "@a@b*: Le Sabbie del tempo potevano essere usate quann' gli attacchi tuoi non colpivano il fetentone che tenevi di fronte.\n@c3@"
  ja: "@a@b＊「さっきの攻撃は　失敗だったな\n\tてなときに　時の砂を使えば\n\t時間が戻せるってわけだ。\n@c3@"
"109":
  de: "@a@b*: Natürlich kann man auch irgendwie ohne auskommen, aber dieser Sand ist schon 'ne praktische Sache.\n@c3@"
  en: "@a@b*: I s'pose folk manage ta get by without it, but it'd be a useful thing ta have, that's fer sure.\n@c3@"
  es: "@a@b*: Supongo que puedes ir tirando sin ellas, pero si las tienes, les encuentras utilidad, eso seguro.\n@c3@"
  fr: "@a@b*ⓢ J'me dis qu'on peut faire sans, mais ça doit être bien pratique.\n@c3@"
  it: "@a@b*: Uno può pure fare a mazzate senza le Sabbie del tempo, ma se le tiene, 'e ccose song cchiù facili!\n@c3@"
  ja: "@a@b＊「まっ　どうしても必要って\n\tわけじゃねえけど　持っていれば\n\t心強いかもな。\n@c3@"
"110":
  de: "@a@b*: Jo, jetzt weißt du alles, Matrose.\n@c3@"
  en: "@a@b*: Aye, as ya wish, matey.\n@c3@"
  es: "@a@b*: De acuerdo, como %H860%Xgustes%Ygustéis%Z, %H860%Xgrumete%Ygrumetes%Z.\n@c3@"
  fr: "@a@b*ⓢ Ça, c'est vous qui voyezⓠ\n@c3@"
  it: "@a@b*: Meglio accussì, %A120%Xcumpa'%Z%B120%Xbella%Z.\n@c3@"
  ja: "@a@b＊「そうかい。\n\tまっ　ゆっくりしていってくんな！\n@c3@"
