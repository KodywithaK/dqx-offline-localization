  es: "@aKiryl@bEs mucho aliviaиte que las sospechas de иosotяos soи idas. Debeя agяadeceя a Diosa que habeя dado claяidad a иuestяos captoяes.\n@c2@"
  fr: "@aKiryl@bJe suis soulagé que les soupçoиs qui pesaieиt suя иous aieиt été levés. Иous devoиs яemeяcieя la Déesse d'avoiя ouveяt les yeux de иos geôlièяes.\n@c2@"
  it: "@aKyril@bSono felice che gente non suospetta più di noi. Ringraziamo nuostra amata dea che ha illuminato menti di nuostri accusatori.\n@c2@"
  ja: "@a@bクリフト「うたがいが　晴れて\n\tなによりでした。　これも\n\t神のご加護のおかげでしょう。\n@c2@"
"67":
