"0":
  de: "@a@b*: Ich wünschte, ich könnte mir das Turnier von Endor ansehen.\n@c2@"
  en: "@a@b*: I wish I could go and watch the Endor Tourney.\n@c2@"
  es: "@a@b*: Cómo me gustaría poder ir a ver el Torneo de Endor.\n@c2@"
  fr: "@a@b*ⓢ Si seulement je pouvais aller assister au tournoi de Chandor.\n@c2@"
  it: "@a@b*: Come mi piacerebbe assistere al Torneo di Endor...\n@c2@"
  ja: "@a@b＊「あーあ　オレも武術大会を\n\t見物しに　行きたいぜ。\n@c2@"
"1":
  de: "@a@b*: Durch diese Tür geht es zur Burg Endor.\n@c2@"
  en: "@a@b*: Through this door is Endor Castle.\n@c2@"
  es: "@a@b*: Por esta puerta se llega al Castillo de Endor.\n@c2@"
  fr: "@a@b*ⓢ Derrière cette porte se trouve le château de Chandor.\n@c2@"
  it: "@a@b*: Questo è l'ingresso che conduce al castello di Endor.\n@c2@"
  ja: "@a@b＊「この扉の向こうは\n\tエンドールの　お城だ。\n@c2@"
"2":
  de: "@a@b*: König Norbert ist oben.\n@c2@"
  en: "@a@b*: You'll find King Norman upstairs.\n@c2@"
  es: "@a@b*: Arriba %H860%Xencontrarás%Yencontraréis%Z al rey Norman.\n@c2@"
  fr: "@a@b*ⓢ Vous trouverez le roi Norbert à l'étage.\n@c2@"
  it: "@a@b*: Re Norman si trova al piano superiore.\n@c2@"
  ja: "@a@b＊「王様は　この上におわします。\n@c2@"
"3":
  de: "@a@b*: Wenn Ihr zum Kolosseum wollt, folgt einfach diesem Korridor und geht die Treppe hinunter.\n@c2@"
  en: "@a@b*: If you're headed for the Colosseum, just follow this corridor and take the stairs down.\n@c2@"
  es: "@a@b*: Si %H860%Xquieres dirigirte%Yqueréis dirigiros%Z al Coliseo, %H860%Xsigue%Yseguid%Z este pasillo y %H860%Xbaja%Ybajad%Z las escaleras.\n@c2@"
  fr: "@a@b*ⓢ Si vous voulez rejoindre le Colisée, suivez ce couloir et prenez les escaliers qui descendent.\n@c2@"
  it: "@a@b*: Per raggiungere l'Arena, %H860%Xsegui%Yseguite%Z questo corridoio e %H860%Xscendi%Yscendete%Z le scale.\n@c2@"
  ja: "@a@b＊「コロシアムへ　行きたいなら\n\tこの廊下をまっすぐ進み\n\t階段を　降りるといい。\n@c2@"
"4":
  de: "@a@b*: Der Sieger im Turnier von Endor darf Prinzessin Veronica heiraten.\n@c1@"
  en: "@a@b*: Whoever wins the Endor Tourney will have Princess Veronica's hand in marriage.\n@c1@"
  es: "@a@b*: A quien gane el Torneo de Endor se le concederá la mano de la princesa Verónica.\n@c1@"
  fr: "@a@b*ⓢ Celui qui remportera le tournoi de Chandor obtiendra la main de la princesse Véronica.\n@c1@"
  it: "@a@b*: Il vincitore del Torneo di Endor sposerà la Principessa Veronica.\n@c1@"
  ja: "@a@b＊「武術大会の　優勝者は\n\tここの　お姫さまと\n\t結婚できるんですよ。\n@c1@"
"5":
  de: "@a@b*: Es steht mir ja nicht zu, das zu sagen, aber sie tut mir schrecklich leid.\n@c1@"
  en: "@a@b*: It's not my place to say so, but I feel ever so sorry for her.\n@c1@"
  es: "@a@b*: Ya sé que no es asunto mío, pero lo siento mucho por ella.\n@c1@"
  fr: "@a@b*ⓢ Je sors de mon rang en disant cela, mais j'ai vraiment de la peine pour elle.\n@c1@"
  it: "@a@b*: Forse non dovrei dire una cosa del genere, ma mi spiace molto per lei...\n@c1@"
  ja: "@a@b＊「お姫さまも　かわいそうに……。\n@c1@"
"6":
  de: "@a@b*: In letzter Zeit werden sogar hier in Endor Ungeheuer gesehen.\n@c2@"
  en: "@a@b*: There've been monsters appearing of late, even here in Endor.\n@c2@"
  es: "@a@b*: En los últimos tiempos se han visto monstruos, incluso aquí, en Endor.\n@c2@"
  fr: "@a@b*ⓢ Récemment, des monstres sont apparus, même ici, à Chandor.\n@c2@"
  it: "@a@b*: Anche qui a Endor, da un po' di tempo a questa parte, sono comparsi dei mostri... \n@c2@"
  ja: "@a@b＊「近ごろ　このエンドールにも\n\t魔物どもがでるように\n\tなりましてな。\n@c2@"
"7":
  de: "@a@b*: Darum hält König Norbert dieses Turnier ab, um viele starke Krieger hier zu versammeln.\n@c2@"
  en: "@a@b*: That's why King Norman decided to hold this tournament, so that he could bring lots of strong warriors together.\n@c2@"
  es: "@a@b*: De modo que el rey Norman ha decidido celebrar este torneo para poder reunir a muchos guerreros poderosos.\n@c2@"
  fr: "@a@b*ⓢ C'est pour cela que le roi Norbert a décidé d'organiser ce tournoi, afin de rassembler de nombreux et solides guerriers.\n@c2@"
  it: "@a@b*: Infatti Re Norman ha organizzato il Torneo proprio per riunire molti guerrieri valorosi.\n@c2@"
  ja: "@a@b＊「それで王様は　強い者たちを\n\t集めるつもりで　武術大会を\n\t開くようになったのじゃが……。\n@c2@"
"8":
  de: "@a@b*: Wenn Ihr am Turnier von Endor teilnehmen wollt, nehmt Euch vor Psaro dem Metzler in Acht.\n@c2@"
  en: "@a@b*: If you're planning on taking part in the Endor Tourney, watch out for that Psaro the Manslayer.\n@c2@"
  es: "@a@b*: Si %H860%Xtienes%Ytenéis%Z pensado tomar parte en el Torneo de Endor, %H860%Xten%Ytened%Z cuidado con ese Psaro el Carnicero.\n@c2@"
  fr: "@a@b*ⓢ Si vous avez l'intention de participer au tournoi de Chandor, méfiez-vous de Psaro l'Exterminateur.\n@c2@"
  it: "@a@b*: Se %H860%Xhai%Yavete%Z intenzione di partecipare al Torneo di Endor, %H860%Xfai%Yfate%Z molta attenzione a Psaro il Massacratore!\n@c2@"
  ja: "@a@b＊「もし　武術大会に出るのなら\n\tデスピサロという男に\n\t気をつけろ。\n@c2@"
"9":
  de: "@a@b*: Das ist ein ziemlich mieser Kerl. Unglaublich stark und kämpft am liebsten bis zum Tod.\n@c2@"
  en: "@a@b*: He's a bit of a nasty piece of work. Strong beyond belief, and he really likes to fight to the death.\n@c2@"
  es: "@a@b*: Es un hueso duro de roer. Es increíblemente fuerte y le gustan los combates a muerte.\n@c2@"
  fr: "@a@b*ⓢ C'est un dur à cuire. Il est incroyablement fort et il aime combattre jusqu'à la mort.\n@c2@"
  it: "@a@b*: Sarà un'impresa batterlo. Ha una forza incredibile e non smette di combattere fino a quando non ha completamente annientato l'avversario.\n@c2@"
  ja: "@a@b＊「とてつもなく　強く　しかも\n\t相手の息の根を　止めるまで\n\t戦いを　やめぬのだ。\n@c2@"
"10":
  de: "@a@b*: König Norbert denkt nicht immer nach, bevor er spricht. Das hat ihn auch diesmal wieder ganz schön in die Bredouille gebracht.\n@c2@"
  en: "@a@b*: King Norman doesn't always think before he speaks. It's got him into quite a spot of bother this time as well.\n@c2@"
  es: "@a@b*: El rey Norman no siempre piensa antes de hablar. Y esta vez, de nuevo, se ha metido en un aprieto por ello.\n@c2@"
  fr: "@a@b*ⓢ Le roi Norbert ne réfléchit pas toujours avant de parler. Cette fois encore, ça l'a mis dans une situation drôlement ennuyeuse.\n@c2@"
  it: "@a@b*: A volte Re Norman agisce senza riflettere. Stavolta si è messo in una situazione davvero scomoda.\n@c2@"
  ja: "@a@b＊「ここの王様は　軽はずみで\n\t思ったことを　すぐに\n\t実行しちゃうんです。　困ったもんだ。\n@c2@"
"11":
  de: "@a@b*: Das hier ist König Norberts Thronsaal.\n@c2@"
  en: "@a@b*: This is King Norman's throne room.\n@c2@"
  es: "@a@b*: Esta es la sala del trono del rey Norman.\n@c2@"
  fr: "@a@b*ⓢ Ceci est la salle du trône du roi Norbert.\n@c2@"
  it: "@a@b*: Questa è la stanza del trono di Re Norman.\n@c2@"
  ja: "@a@b＊「ここは　エンドール王の\n\tお部屋です。\n@c2@"
"12":
  de: "@a@b*: König Norbert hat einen schrecklichen Schlamassel angerichtet mit seinem albernen Versprechen. Fragt nur die Prinzessin.\n@c2@"
  en: "@a@b*: King Norman has got us into a terrible pickle by making the most ridiculous promise. Just ask the princess.\n@c2@"
  es: "@a@b*: El rey Norman nos ha metido en un lío terrible por una ridícula promesa. %H860%XPregúntale%YPreguntadle%Z a la princesa.\n@c2@"
  fr: "@a@b*ⓢ Le roi Norbert nous a mis dans un beau pétrin en faisant une promesse des plus stupides. Demandez donc à la princesse.\n@c2@"
  it: "@a@b*: Con quella sua ridicola promessa, Re Norman ci ha messo davvero nei pasticci... %H860%XProva%YProvate%Z a immaginare come deve sentirsi la Principessa!\n@c2@"
  ja: "@a@b＊「まったく　わが王は\n\tとんでもない約束を　したものです。\n\t姫の話を　聞いてやってくだされ。\n@c2@"
"13":
  de: "@aKönig Norbert@bAh, da seid Ihr ja! Der Zar von Samokswa hat mir schon von Euch berichtet.\n@c2@"
  en: "@aKing Norman@bAh, you're here! I had word about you from the Tsar of Zamoksva.\n@c2@"
  es: "@aRey Norman@b¡Ah, estáis aquí! El Zar de Zamoksva me ha hablado de vos.\n@c2@"
  fr: "@aRoi Norbert@bAh, vous voilàⓠ J'ai entendu parler de vous par le tsar de Zamoksva.\n@c2@"
  it: "@aRe Norman@b%H860%XEccoti%YEccovi%Z qui, finalmente! Lo Zar di Zamoskva mi ha parlato molto di %H860%Xte%Yvoi%Z!\n@c2@"
  ja: "@a@b王「おお　よくぞ来た！\n\tそなたらのことは　すでに\n\tサントハイム王より　聞いているぞ。\n@c2@"
"14":
  de: "@aKönig Norbert@bIhr macht Euch offenbar Sorgen um die Welt und wollt daher Eure Kräfte stärken. Das ist sehr löblich!\n@c2@"
  en: "@aKing Norman@bIt seems you're concerned about the world so you're trying to build up your strength.\nI must commend you!\n@c2@"
  es: "@aRey Norman@bParece que os preocupa la situación del mundo e intentáis haceros más fuerte.\n¡Os respeto por ello!\n@c2@"
  fr: "@aRoi Norbert@bIl paraît que le sort du monde vous inquiète et que vous essayez d'accroître votre force.\nJe me dois de vous féliciterⓠ\n@c2@"
  it: "@aRe Norman@bHo sentito dire che %H860%Xti%Yvi%Z stanno a cuore le sorti del mondo, e per questo motivo %H860%Xstai%Ystate%Z cercando di accrescere la %H860%Xtua%Yvostra%Z forza. Ammiro molto ciò che %H860%Xstai%Ystate%Z facendo!\n@c2@"
  ja: "@a@b王「世界の行く末を　案じ\n\tちからだめしの旅とは\n\tまことに　感心なり！\n@c2@"
"15":
  de: "@aKönig Norbert@bSo, wo ist nun Zarewna Alena?\n@c2@"
  en: "@aKing Norman@bNow, where is Tsarevna Alena?\n@c2@"
  es: "@aRey Norman@bBueno, ¿dónde está la zarevna Alena?\n@c2@"
  fr: "@aRoi Norbert@bMais où est donc la tsarine Alinaⓡ\n@c2@"
  it: "@aRe Norman@bE dunque, %H860%Xdimmi%Yditemi%Z, dove si trova la Zarina Alena?\n@c2@"
  ja: "@a@b王「して　アリーナ姫は\n\tどうされたのじゃ？\n@c2@"
"16":
  de: "@aKönig Norbert@bAh, da seid Ihr ja! Der Zar von Samokswa hat mir schon von Euch berichtet.\n@c2@"
  en: "@aKing Norman@bAh, you're here! I had word about you from the Tsar of Zamoksva.\n@c2@"
  es: "@aRey Norman@b¡Ah, estáis aquí! El Zar de Zamoksva me ha hablado de vos.\n@c2@"
  fr: "@aRoi Norbert@bAh, vous voilàⓠ J'ai entendu parler de vous par le tsar de Zamoksva.\n@c2@"
  it: "@aRe Norman@b%H860%XEccoti%YEccovi%Z qui, finalmente! Lo Zar di Zamoskva mi ha parlato molto di %H860%Xte%Yvoi%Z!\n@c2@"
  ja: "@a@b王「おお　よくぞ来た！\n\tそなたらのことは　すでに\n\tサントハイム王より　聞いているぞ。\n@c2@"
"17":
  de: "@aKönig Norbert@bIhr macht Euch offenbar Sorgen um die Welt und wollt daher Eure Kräfte stärken. Das ist sehr löblich!\n@c2@"
  en: "@aKing Norman@bIt seems you're concerned about the world so you're trying to build up your strength.\nI must commend you!\n@c2@"
  es: "@aRey Norman@bParece que os preocupa la situación del mundo e intentáis haceros más fuerte.\n¡Os respeto por ello!\n@c2@"
  fr: "@aRoi Norbert@bIl paraît que le sort du monde vous inquiète et que vous essayez d'accroître votre force.\nJe me dois de vous féliciterⓠ\n@c2@"
  it: "@aRe Norman@bHo sentito dire che %H860%Xti%Yvi%Z stanno a cuore le sorti del mondo, e per questo motivo %H860%Xstai%Ystate%Z cercando di accrescere la %H860%Xtua%Yvostra%Z forza. Ammiro molto ciò che %H860%Xstai%Ystate%Z facendo!\n@c2@"
  ja: "@a@b王「世界の行く末を　案じ\n\tちからだめしの旅とは\n\tまことに　感心なり！\n@c2@"
"18":
  de: "@aKönig Norbert@bIch muss Euch zudem um einen Gefallen bitten.\nSeht Ihr, ich verlasse mich darauf, dass %A120%XAlena%Z%B120%XIhr%Z das Turnier von Endor gewinnt.\n@c2@"
  en: "@aKing Norman@bI must also request a favour. You see, I'm relying on you to win the Endor Tourney.\n@c2@"
  es: "@aRey Norman@bTambién debo pediros un favor. Cuento con que ganéis el Torneo de Endor.\n@c2@"
  fr: "@aRoi Norbert@bJe dois aussi vous demander une faveur.\nVoyez-vous, je compte sur %A120%Xla tsarine Alina%Z%B120%Xvous%Z%C120%X%Z pour gagner le tournoi de Chandor.\n@c2@"
  it: "@aRe Norman@b%A110%XOh, quanto vorrei che Alena vincesse il Torneo di Endor...%Z%B120%XHo una richiesta da farti... Voglio che tu vinca il Torneo di Endor.%Z\n@c2@"
  ja: "@a@b王「そこで　頼みがあるのじゃが\n\t武術大会で\n\tぜひとも　優勝してくれい！\n@c2@"
"19":
  de: "@aKönig Norbert@bIch sehe ein, dass mein Versprechen sehr töricht war. Ich wäre Euch sehr verbunden, wenn Ihr das in Ordnung bringen könntet%A120%X%Z%B120%X, Alena%Z.\n@c2@"
  en: "@aKing Norman@bI've come to see now that the promise I made was rather foolish. I'd be most obliged if you could rectify it, Alena.\n@c2@"
  es: "@aRey Norman@bMe he dado cuenta de que mi promesa fue una insensatez. Estaría en deuda con vos si pudieses rectificarla%A120%X.%Z%B120%X, Alena.%Z%C120%X.%Z\n@c2@"
  fr: "@aRoi Norbert@bJe réalise aujourd'hui que la promesse que j'ai faite était assez stupide. Je vous serais très obligé de résoudre le problème%A120%X%Z%B120%X, Alina%Z%C120%X%Z.\n@c2@"
  it: "@aRe Norman@bSolo ora mi rendo conto di quanto sia folle la promessa che ho fatto. %A110%XSpero proprio che lei possa porre rimedio al mio terribile sbaglio.%Z%B120%XAlena, confido che tu possa porre rimedio al mio terribile sbaglio.%Z\n@c2@"
  ja: "@a@b王「じつは　わしも\n\t後悔してるのじゃよ。\n\tアリーナ姫　どうか頼んだぞ！\n@c2@"
"20":
  de: "@aPrinzessin Veronica@bLeider hat Vater öffentlich ein Versprechen gegeben, also muss ich jetzt denjenigen heiraten, der das Turnier gewinnt.\n@c1@"
  en: "@aPrincess Veronica@bI'm afraid that Father made a public promise, so now I have to marry whoever wins the tournament.\n@c1@"
  es: "@aPrincesa Verónica@bMe temo que padre ha hecho una promesa pública, así que tendré que casarme con el vencedor del Torneo.\n@c1@"
  fr: "@aPrincesse Véronica@bMalheureusement, Père a fait une promesse publique, je suis donc contrainte d'épouser quiconque remportera le tournoi.\n@c1@"
  it: "@aPrincipessa Veronica@bPovera me... La promessa fatta da mio padre mi costringerà a sposare chiunque vinca il torneo...!\n@c1@"
  ja: "@a@b＊「お父さまが　みなに\n\t約束をしたため　私は優勝者と\n\t結婚をしなくてはなりません。\n@c1@"
"21":
  de: "@aPrinzessin Veronica@bAch, ich bin ganz krank vor Sorge. Wer weiß, bei wem ich da landen werde.\n@c1@"
  en: "@aPrincess Veronica@bOh, what a worry this is! I dread to think who I might end up with.\n@c1@"
  es: "@aPrincesa Verónica@b¡Oh, qué preocupación más grande! Tiemblo solo de pensar con quién puedo acabar.\n@c1@"
  fr: "@aPrincesse Véronica@bOh, je suis morte d'inquiétudeⓠ Je n'ose imaginer avec qui je vais devoir me marier.\n@c1@"
  it: "@aPrincipessa Veronica@bChe sventura! Chissà quale uomo sarò obbligata a prendere come marito...\n@c1@"
  ja: "@a@b＊「ああ……\n\t私は　どうなってしまうの。\n@c1@"
"22":
  de: "@aPrinzessin Veronica@bVater hat öffentlich ein Versprechen gegeben, also muss ich jetzt denjenigen heiraten, der das Turnier gewinnt.\n@c1@"
  en: "@aPrincess Veronica@bFather made a public promise, so now I have to marry whoever wins the tournament.\n@c1@"
  es: "@aPrincesa Verónica@bPadre ha hecho una promesa pública, así que tendré que casarme con el vencedor del Torneo.\n@c1@"
  fr: "@aPrincesse Véronica@bPère a fait une promesse publique, je suis donc contrainte d'épouser quiconque remportera le tournoi.\n@c1@"
  it: "@aPrincipessa Veronica@bPer colpa di mio padre e della sua promessa sarò costretta a sposare il vincitore del torneo, chiunque egli sia!\n@c1@"
  ja: "@a@b＊「お父さまが　みなに\n\t約束をしたため　私は優勝者と\n\t結婚をしなくてはなりません。\n@c1@"
"23":
  de: "@aPrinzessin Veronica@bAber wenn der Sieger eine Frau ist, ist das Ganze natürlich null und nichtig.\n@c1@"
  en: "@aPrincess Veronica@bBut if the winner were a woman, then the whole thing would surely have to be called off.\n@c1@"
  es: "@aPrincesa Verónica@bPero si el vencedor fuera una mujer, habría que cancelar todo el asunto.\n@c1@"
  fr: "@aPrincesse Véronica@bMais si le vainqueur était une femme, tout cela devrait sans doute être annulé.\n@c1@"
  it: "@aPrincipessa Veronica@bMa se la vincitrice fosse una donna, la promessa non avrebbe più senso!\n@c1@"
  ja: "@a@b＊「でも　もし優勝者が\n\t女の人だったら　私は　無理な\n\t結婚をしなくても　すむでしょう。\n@c1@"
"24":
  de: "@aPrinzessin Veronica@bBitte, ich flehe Euch an, Alena%A120%X muss um meinetwillen am Turnier von Endor teilnehmen%Z%B120%X, nehmt um meinetwillen am Turnier von Endor teil%Z.\n@c1@"
  en: "@aPrincess Veronica@bPlease, Alena. I implore you to enter the Endor Tourney for me.\n@c1@"
  es: "@aPrincesa Verónica@bPor favor, %A120%Xdecidle a Alena que se inscriba en el Torneo de Endor. Os lo ruego.%Z%B120%XAlena. Os ruego que os inscribáis en el Torneo de Endor, hacedlo por mí.%Z%C120%Xdecidle a Alena que se inscriba en el Torneo de Endor. Os lo ruego.%Z\n@c1@"
  fr: "@aPrincesse Véronica@bJe vous en supplie, %A120%Xil faut qu'Alina participe%Z%B120%XAlina, participez%Z%C120%X%Z au tournoi de Chandor pour moi.\n@c1@"
  it: "@aPrincipessa Veronica@b%A110%XAlena deve iscriversi al Torneo di Endor! Deve farlo!%Z%B120%XAlena, ti supplico, iscriviti al Torneo di Endor... Fallo per me!%Z\n@c1@"
  ja: "@a@b＊「お願いでございます。\n\tどうか　武術大会に\n\t出てくださいまし！\n@c1@"
"25":
  de: "@aPrinzessin Veronica@bIch kann Euch gar nicht sagen, wie sehr ich %A120%XAlena beneide, weil sie solche Freiheiten genießen darf%Z%B120%XEuch beneide, weil Ihr solche Freiheiten genießen dürft%Z.\n@c1@"
  en: "@aPrincess Veronica@bI can't tell you how envious I am of your being able to live a life of such freedom.\n@c1@"
  es: "@aPrincesa Verónica@bNo puedo expresar la envidia que os tengo por poder vivir con tanta libertad.\n@c1@"
  fr: "@aPrincesse Véronica@bJe ne saurais vous dire à quel point je %A120%Xl'%Z%B120%Xvous %Z%C120%X%Zenvie de pouvoir vivre aussi librement.\n@c1@"
  it: "@aPrincipessa Veronica@bNon immagini nemmeno quanto io invidi la %A110%Xsua%Z%B120%Xtua%Z libertà!\n@c1@"
  ja: "@a@b＊「アリーナ姫さま。\n\t私は　自由に生きている\n\tあなたを　うらやましく思いますわ。\n@c1@"
"26":
  de: "@a@b*: Psaro der Metzler... den Namen kenne ich doch irgendwoher, aber ich kann mich einfach nicht mehr daran erinnern, woher.\n@c2@"
  en: "@a@b*: Psaro the Manslayer... I'm sure I've heard that name somewhere before, but I just can't think where.\n@c2@"
  es: "@a@b*: Psaro el Carnicero... Estoy seguro de que he oído antes ese nombre, pero no puedo recordar dónde.\n@c2@"
  fr: "@a@b*ⓢ Psaro l'Exterminateur... Je suis certain d'avoir déjà entendu ce nom auparavant, mais je n'arrive pas à me rappeler où.\n@c2@"
  it: "@a@b*: Psaro il Massacratore... Ho già sentito questo nome, ma non rammento in quale occasione. \n@c2@"
  ja: "@a@b＊「デスピサロ……。\n\tどこか聞いたような名前じゃが\n\t思い出せんわい……。\n@c2@"
"27":
  de: "@a@b*: Dieser Tisch muss so sauber sein, dass König Norbert davon essen könnte.\n@c2@"
  en: "@a@b*: This table has to be clean enough that King Norman could eat his supper off it.\n@c2@"
  es: "@a@b*: Esta mesa tiene que quedar tan limpia que el propio rey Norman pueda comer en ella.\n@c2@"
  fr: "@a@b*ⓢ Cette table doit être assez propre pour que le roi Norbert puisse prendre son souper dessus.\n@c2@"
  it: "@a@b*: Questo tavolo dev'essere tanto pulito che Re Norman dovrebbe potervi mangiare sopra direttamente, se volesse farlo.\n@c2@"
  ja: "@a@b＊「テーブルを　きれいにふかないと。\n\tせっせ　せっせ。\n@c2@"
"28":
  de: "@a@b*: Ich verrate Euch ein kleines Geheimnis. Wenn Ihr nachts in die Burg wollt, achtet darauf, dass die Wachen Euch nicht sehen.\n@c2@"
  en: "@a@b*: I'll let you in on a little secret. If you want to go inside the castle at night, make sure the guards don't see you.\n@c2@"
  es: "@a@b*: %H860%XTe%YOs%Z daré un pequeño consejo. Si %H860%Xentras%Yentráis%Z en el castillo de noche, que no %H860%Xte%Yos%Z vean los guardias.\n@c2@"
  fr: "@a@b*ⓢ Je vais vous confier un petit secret. Si vous voulez pénétrer dans le château de nuit, faites en sorte que les gardes ne vous voient pas.\n@c2@"
  it: "@a@b*: %H860%XTi%YVi%Z svelerò un segreto. Per poter accedere al castello di notte, bisogna evitare di essere visti dalle sentinelle.\n@c2@"
  ja: "@a@b＊「いいことを　教えましょう。\n\t夜　お城に入るには　番兵に\n\t見つからぬようにするのだよ。\n@c2@"
"29":
  de: "@a@b*: Oh du liebe Güte. So viel Wäsche und so wenig Zeit, um sie zu waschen!\n@c2@"
  en: "@a@b*: Dearie me. So many things to wash and not enough minutes in the day to wash them in!\n@c2@"
  es: "@a@b*: Ay, por la Diosa. ¡Tanto por lavar y tan poco tiempo para lavarlo!\n@c2@"
  fr: "@a@b*ⓢ Pauvre de moi. Tant de choses à laver et si peu de temps dans la journée pour le faireⓠ\n@c2@"
  it: "@a@b*: Un'intera giornata di lavoro non mi basterà per lavare tutta questa roba! Povera me...\n@c2@"
  ja: "@a@b＊「よいしょ　よいしょ。\n\t洗い物が多くて　たいへん！\n@c2@"
"30":
  de: "@a@b*: Die arme Prinzessin. So wie es im Moment aussieht, muss sie Psaro den Metzler heiraten. Der hört sich nicht gerade nett an.\n@c1@"
  en: "@a@b*: The poor princess. The way things are going, she'll soon be wed to that Psaro the Manslayer. Hardly a nice sounding fellow.\n@c1@"
  es: "@a@b*: Pobre princesa. Tal como van las cosas, pronto estará casada con Psaro el Carnicero. No parece un tipo muy recomendable.\n@c1@"
  fr: "@a@b*ⓢ Pauvre princesse. Au train où vont les choses, elle sera bientôt mariée à ce Psaro l'Exterminateur. Il n'a pas l'air très gentil.\n@c1@"
  it: "@a@b*: A meno di un miracolo, la Principessa sarà costretta a sposare Psaro il Massacratore. Che destino ingrato, il suo...\n@c1@"
  ja: "@a@b＊「お姫さま　かわいそうだわね。\n\tこのままだと　デスピサロって人と\n\t結婚させられるんじゃないかしら。\n@c1@"
"31":
  de: "@a@b*: Seid vor Psaro dem Metzler auf der Hut, ja?\n@c2@"
  en: "@a@b*: Watch out for that Psaro the Manslayer, won't ya?\n@c2@"
  es: "@a@b*: %H860%XTen%YTened%Z cuidado con Psaro el Carnicero, ¿me %H860%Xoyes%Yoís%Z?\n@c2@"
  fr: "@a@b*ⓢ Méfiez-vous de ce Psaro l'Exterminateur, surtoutⓠ\n@c2@"
  it: "@a@b*: %H860%XFai%YFate%Z attenzione a Psaro il Massacratore, mi raccomando!\n@c2@"
  ja: "@a@b＊「デスピサロに　気をつけるんだ！\n@c2@"
"32":
  de: "@a@b*: Dies ist das Kolosseum, wo das Turnier von Endor stattfindet.\n@c2@"
  en: "@a@b*: This is the Colosseum, where the Endor Tourney takes place.\n@c2@"
  es: "@a@b*: Esto es el Coliseo, donde se celebra el Torneo de Endor.\n@c2@"
  fr: "@a@b*ⓢ Ceci est le Colisée. C'est là que se déroule le tournoi de Chandor.\n@c2@"
  it: "@a@b*: Questa è l'Arena. È qui che si svolge il Torneo di Endor.\n@c2@"
  ja: "@a@b＊「ここは　コロシアム。\n\t武術大会の　会場だ。\n@c2@"
"33":
  de: "@a@b*: Ihr könnt nur an dem Turnier teilnehmen, wenn Ihr Euch registrieren lasst. Dazu braucht Ihr zunächst die Erlaubnis König Norberts.\n@c2@"
  en: "@a@b*: You can't take part in the tournament unless your name's been put down. You'll have to get permission from King Norman first.\n@c2@"
  es: "@a@b*: No %H860%Xpuedes%Ypodéis%Z participar en el torneo si no %H860%Xte inscribes%Yos inscribís%Z. Antes, %H860%Xtendrás%Ytendréis%Z que pedir permiso al rey Norman.\n@c2@"
  fr: "@a@b*ⓢ Vous ne pouvez pas participer au tournoi si votre nom n'est pas inscrit. Vous devez d'abord obtenir la permission du roi Norbert.\n@c2@"
  it: "@a@b*: Per partecipare al torneo %H860%Xdevi%Ydovete%Z innanzitutto ottenere il nulla osta da Re Norman. Successivamente, %H860%Xpotrai iscriverti%Ypotrete iscrivervi%Z alla competizione. \n@c2@"
  ja: "@a@b＊「登録されていない者は\n\t試合に参加できません。　王様から\n\t許可を　もらってきてください。\n@c2@"
"34":
  de: "@a@b*: Wenn Ihr teilnehmen wollt, geht nach links. Wenn Ihr nur zuschauen wollt, geht die Treppe rechts hinauf.\n@c2@"
  en: "@a@b*: If you're taking part, go to the left. If you're just spectating, then go up the stairs to the right.\n@c2@"
  es: "@a@b*: Si %H860%Xvas%Yvais%Z a participar, %H860%Xve%Yid%Z hacia la izquierda. Si solo %H860%Xquieres%Yqueréis%Z verlo, %H860%Xsube%Ysubid%Z por las escaleras de la derecha.\n@c2@"
  fr: "@a@b*ⓢ Si vous participez au tournoi, allez à gauche. Si vous faites partie des spectateurs, montez les escaliers à droite.\n@c2@"
  it: "@a@b*: Se %H860%Xpartecipi%Ypartecipate%Z al torneo, %H860%Xdevi%Ydovete%Z andare a sinistra. Se invece %H860%Xvuoi%Yvolete%Z assistere alla competizione, %H860%Xsali%Ysalite%Z le scale sulla destra.\n@c2@"
  ja: "@a@b＊「試合に参加するなら　左。\n\t見るだけなら　右の階段を\n\t登るがよい。\n@c2@"
"35":
  de: "@a@b*: Bestimmt gewinnt wieder Psaro der Metzler.\n@c2@"
  en: "@a@b*: Psaro the Manslayer's bound to win.\n@c2@"
  es: "@a@b*: Psaro el Carnicero tiene pinta de ir a ganar.\n@c2@"
  fr: "@a@b*ⓢ C'est sûr que Psaro l'Exterminateur va l'emporter.\n@c2@"
  it: "@a@b*: Psaro il Massacratore vincerà di sicuro!\n@c2@"
  ja: "@a@b＊「優勝は　きっと\n\tデスピサロだろうな。\n@c2@"
"36":
  de: "@a@b*: Ja, super! Hier wird einem ja ordentlich was geboten!\n@c0@"
  en: "@a@b*: Woo woo woo! Now this is entertainment!\n@c0@"
  es: "@a@b*: ¡Yu-ju-ju! ¡A esto le llamo yo diversión!\n@c0@"
  fr: "@a@b*ⓢ Wou wou wouⓠ Ça, c'est du spectacleⓠ\n@c0@"
  it: "@a@b*: Corpo di mille balene! Questo sì che è uno spettacolo!\n@c0@"
  ja: "@a@b＊「うひょーっ！\n\t血がさわぐぜ！\n@c0@"
"37":
  de: "@a@b*: Das ist so aufregend, dass ich ganz hibbelig werde!\n@c1@"
  en: "@a@b*: It's so exciting, I can hardly keep still!\n@c1@"
  es: "@a@b*: ¡Es tan emocionante que no puedo quedarme quieta!\n@c1@"
  fr: "@a@b*ⓢ C'est tellement palpitant. J'ai du mal à tenir en placeⓠ\n@c1@"
  it: "@a@b*: Oh, che emozione!\n@c1@"
  ja: "@a@b＊「この刺激が　たまらないわ！\n@c1@"
"38":
  de: "@a@b*: Ja! Lass es krachen!\n@c1@"
  en: "@a@b*: Yeah! Go for it!\n@c1@"
  es: "@a@b*: ¡Vamos! ¡A por todas!\n@c1@"
  fr: "@a@b*ⓢ Ouaisⓠ Vas-yⓠ\n@c1@"
  it: "@a@b*: Sì! Così! Evvai!\n@c1@"
  ja: "@a@b＊「がんばれ　がんばれーっ！\n@c1@"
"39":
  de: "@a@b*: So würde ich aber nicht kämpfen. Nee! Das hat doch keinen Wert. Hier, so muss man kämpfen...!\n@c3@"
  en: "@a@b*: I wouldn't be fightin' like that. Nah! That ain't no good. You gotta fight like this...!\n@c3@"
  es: "@a@b*: Yo no lucharía así. No, eso no sirve de nada. ¡Así es como se pelea!\n@c3@"
  fr: "@a@b*ⓢ Je m'battrais pas comme ça. Pfffⓠ C'est n'importe quoi. Il faut faire comme ça...ⓠ\n@c3@"
  it: "@a@b*: Ehi! Devo insegnarvi io come si lotta? Ma no! Non si può combattere in questo modo!\n@c3@"
  ja: "@a@b＊「オレなら　ああは戦わないぜ！\n\tああっ　そうじゃだめだっ！\n\tほら　そこで　こうするんだっ！\n@c3@"
"40":
  de: "@a@b*: Hick! Vor sich einen schönen Kampf, und in der Hand ein nettes Schlückchen ⓚⓛ gibt doch nix Besseres!\n@c2@"
  en: "@a@b*: Hic! You can't beat the odd drink or two when you're watching a fight.\n@c2@"
  es: "@a@b*: ¡Hip! No hay nada como un par de cervezas mientras miras un combate.\n@c2@"
  fr: "@a@b*ⓢ Hicⓠ Rien ne vaut un ou deux petits verres en regardant un combat.\n@c2@"
  it: "@a@b*: Hic! Non shè niente di meglio di un buon goshetto mentre si ashishte a una shfida avvinshente! Hic!\n@c2@"
  ja: "@a@b＊「ウィ～ック。\n\t武術大会をながめながら\n\t飲む酒は　うまいっ！\n@c2@"
"41":
  de: "@a@b*: Na los! Immer feste drauf! ... Öh. Du liebes Bisschen. Was rede ich denn da? Vergib mir, Göttin.\n@c1@"
  en: "@a@b*: Go on! Get stuck in! ...Er. Oh dear. What am I saying? Forgive me, Goddess.\n@c1@"
  es: "@a@b*: ¡Vamos! ¡Ataca ya! Esto... ¡Oh!, vaya. ¿Pero qué estoy diciendo? Perdóname, Diosa.\n@c1@"
  fr: "@a@b*ⓢ Allezⓠ Attaqueⓠ ... Oh, mais qu'est-ce que je raconteⓡ Déesse, pardonnez-moi.\n@c1@"
  it: "@a@b*: Evvai! Fallo a pezzi! Oh, cielo! Che sto dicendo?!? Ti chiedo perdono, mia dea.\n@c1@"
  ja: "@a@b＊「いけーっ！　やっちゃえー！！\n\t……はっ　わたくしは　何を！？\n\t神よ　お許しください……。\n@c1@"
"42":
  de: "@a@b*: Wäre ich nur ein, zwei Jährchen jünger, wäre ich selbst auch dabei. Ho ho!\n@c2@"
  en: "@a@b*: If only I was a year or two younger, I would've taken part myself. Ho ho!\n@c2@"
  es: "@a@b*: Si fuese uno o dos años más joven, yo mismo habría participado en el torneo. ¡Ja, ja!\n@c2@"
  fr: "@a@b*ⓢ Si j'avais eu un ou deux ans de moins, j'aurais participé, moi aussi. Ho hoⓠ\n@c2@"
  it: "@a@b*: Diamine! Avessi avuto qualche anno in meno, anch'io avrei partecipato al torneo!\n@c2@"
  ja: "@a@b＊「わしも　もうちょっと若ければ\n\t出場したのにのう。\n\tほっほっほ。\n@c2@"
"43":
  de: "@a@b*: Durch diese Tür geht es zur Burg Endor.\n@c2@"
  en: "@a@b*: Through this door is Endor Castle.\n@c2@"
  es: "@a@b*: Por esta puerta se llega al Castillo de Endor.\n@c2@"
  fr: "@a@b*ⓢ Derrière cette porte se trouve le château de Chandor.\n@c2@"
  it: "@a@b*: Questo è l'ingresso che conduce al castello di Endor.\n@c2@"
  ja: "@a@b＊「この扉の向こうは\n\tエンドールの　お城だ。\n@c2@"
"44":
  de: "@a@b*: Aber ich fürchte, nachts könnt Ihr nicht herein. Ihr müsst morgen früh wiederkommen.\n@c2@"
  en: "@a@b*: But I'm afraid you can't go in during the night. You'll have to come back in the morning.\n@c2@"
  es: "@a@b*: Pero me temo que de noche no %H860%Xpuedes%Ypodéis%Z entrar. %H860%XTendrás%YTendréis%Z que volver por la mañana.\n@c2@"
  fr: "@a@b*ⓢ Mais je regrette, vous ne pouvez pas entrer pendant la nuit. Vous devrez revenir demain matin.\n@c2@"
  it: "@a@b*: Spiacente, ma di notte l'accesso non è consentito. %H860%XTorna%YTornate%Z domani mattina.\n@c2@"
  ja: "@a@b＊「しかし　今は夜ふけ。\n\tまた明日　出直してくるのが\n\tよいだろう。\n@c2@"
"45":
  de: "@a@b*: Was schleicht Ihr denn mitten in der Nacht in der Burg herum?\n@c2@"
  en: "@a@b*: What do you think you're doing, prowling about the castle at this time of night?\n@c2@"
  es: "@a@b*: ¿Qué %H860%Xcrees que estás haciendo%Ycreéis que estáis haciendo%Z merodeando por el castillo a estas horas de la noche?\n@c2@"
  fr: "@a@b*ⓢ Que faites-vous à rôder dans le château à une heure pareilleⓡ\n@c2@"
  it: "@a@b*: Che ci %H860%Xfai%Yfate%Z al castello a quest'ora di notte?\n@c2@"
  ja: "@a@b＊「こんな夜更けに\n\tお城に　入ってくるとは！\n@c2@"
"46":
  de: "@a@b*: Ich kann Euch nicht einfach so hier herumlaufen lassen. Na los, raus mit Euch!\n@c2@"
  en: "@a@b*: I can't let you just wander about as you please. Go on now, get out!\n@c2@"
  es: "@a@b*: No puedo permitir que %H860%Xte pasees%Yos paseéis%Z por donde %H860%Xte%Yos%Z apetezca. ¡Vamos, largo de aquí!\n@c2@"
  fr: "@a@b*ⓢ Je ne peux pas vous laisser vous promener comme ça, à votre guise. Allons, sortez maintenantⓠ\n@c2@"
  it: "@a@b*: È vietato stare qui. %H860%XVai%YAndate%Z via, forza!\n@c2@"
  ja: "@a@b＊「わたしが　見つけた以上\n\t黙っているわけには　ゆかぬ。\n\tささ　立ち去られよ！\n@c2@"
"47":
  de: "@a@b*: Ich kann schon gar nicht mehr zählen, wie viele Soldaten Psaro der Metzler bereits erledigt hat.\n@c2@"
  en: "@a@b*: I can't count how many soldiers Psaro the Manslayer has polished off now.\n@c2@"
  es: "@a@b*: No sé a cuántos soldados se ha cargado ya Psaro el Carnicero.\n@c2@"
  fr: "@a@b*ⓢ Je ne compte plus le nombre de soldats que Psaro l'Exterminateur a déjà liquidés.\n@c2@"
  it: "@a@b*: Non saprei dire quanti avversari abbia fatto fuori Psaro il Massacratore.\n@c2@"
  ja: "@a@b＊「まったく　何人の戦士が\n\tデスピサロに　殺されたことか……。\n@c2@"
"48":
  de: "@a@b*: Ist ja schon fast wie ein Massaker der stärksten Krieger der Welt.\n@c2@"
  en: "@a@b*: It's starting to feel like some sort of massacre of the world's strongest warriors.\n@c2@"
  es: "@a@b*: Esto parece una masacre de los guerreros más fuertes del mundo.\n@c2@"
  fr: "@a@b*ⓢ Ça commence à ressembler à un massacre en règle des plus puissants guerriers du monde.\n@c2@"
  it: "@a@b*: A quanto pare stiamo assistendo alla disfatta di tutti i più forti guerrieri del mondo.\n@c2@"
  ja: "@a@b＊「これでは　まるで\n\t強い者を集めて\n\tほうむっているようなものですよ。\n@c2@"
"49":
  de: "@a@b*: Zzzz...\n@c2@"
  en: "@a@b*: Zzzz...\n@c2@"
  es: "@a@b*: Zzzz...\n@c2@"
  fr: "@a@b*ⓢ Zzzz...\n@c2@"
  it: "@a@b*: Zzz... \n@c2@"
  ja: "@a@b＊「ぐうぐう……。\n@c2@"
"50":
  de: "@a@b*: König Norbert und Prinzessin Veronica haben sich bereits in ihre Gemächer zurückgezogen.\n@c2@"
  en: "@a@b*: King Norman and Princess Veronica have already retired to their chambers.\n@c2@"
  es: "@a@b*: El rey Norman y la princesa Verónica ya se han retirado a sus aposentos.\n@c2@"
  fr: "@a@b*ⓢ Le roi Norbert et la princesse Véronica se sont déjà retirés dans leurs chambres.\n@c2@"
  it: "@a@b*: Re Norman e la Principessa Veronica si sono già ritirati nelle loro stanze.\n@c2@"
  ja: "@a@b＊「王様と　姫さまは\n\tすでに　お休みでございます。\n@c2@"
"51":
  de: "@a@b*: Psaro der Metzler... Allein bei dem Namen läuft es mir schon kalt den Rücken herunter.\n@c2@"
  en: "@a@b*: Psaro the Manslayer... The name alone gives me the willies.\n@c2@"
  es: "@a@b*: Psaro el Carnicero... Solo el nombre me da escalofríos.\n@c2@"
  fr: "@a@b*ⓢ Psaro l'Exterminateur... Rien que son nom me donne la chair de poule.\n@c2@"
  it: "@a@b*: Psaro il Massacratore... Solo a pronunciarne il nome mi vengono i brividi!\n@c2@"
  ja: "@a@b＊「デスピサロ……不吉な名前じゃ。\n@c2@"
"52":
  de: "@a@b*: König Norbert und Prinzessin Veronica haben bereits ihr Abendessen eingenommen und sich zurückgezogen. Ich räume mal lieber weiter auf.\n@c2@"
  en: "@a@b*: King Norman and Princess Veronica had supper and retired to their chambers already. I'd better get on with the clearing up.\n@c2@"
  es: "@a@b*: El rey Norman y la princesa Verónica ya han cenado y se han retirado a sus aposentos. Será mejor que despeje esto.\n@c2@"
  fr: "@a@b*ⓢ Le roi Norbert et la princesse Véronica ont déjà soupé et se sont retirés dans leurs chambres. Je ferais bien de continuer à nettoyer.\n@c2@"
  it: "@a@b*: Re Norman e la Principessa Veronica hanno già cenato e ora si trovano nelle loro stanze. Sarà meglio mettere tutto in ordine.\n@c2@"
  ja: "@a@b＊「王様と　姫さまは\n\t食事も終わって　お休みです。\n\tさあ片付けなきゃ。　せっせ　せっせ。\n@c2@"
"53":
  de: "@a@b*: Es sieht immer mehr nach einem Sieg Psaros des Metzlers aus. Er ist einfach großartig...\n@c2@"
  en: "@a@b*: It's looking more and more like Psaro the Manslayer will win. He's so magnificent...\n@c2@"
  es: "@a@b*: Cada vez parece más claro que Psaro el Carnicero va a ganar. Es un hombre magnífico...\n@c2@"
  fr: "@a@b*ⓢ La victoire de Psaro l'Exterminateur semble de plus en plus assurée. Il est tellement impressionnant...\n@c2@"
  it: "@a@b*: Non c'è dubbio che sarà Psaro il Massacratore a vincere! È troppo forte...\n@c2@"
  ja: "@a@b＊「やっぱり　デスピサロ様が\n\t優勝だよねえ。\n\tかっこいいし……。\n@c2@"
"54":
  de: "@a@b*: Psaro der Metzler hat was an sich, das mir einfach nicht ganz geheuer ist. Zum Glück bin ich keine Prinzessin!\n@c1@"
  en: "@a@b*: There's something about that Psaro the Manslayer that I just can't get on with. I'm glad I wasn't born a princess!\n@c1@"
  es: "@a@b*: Hay algo en ese Psaro el Carnicero que no me acaba de convencer. ¡Qué suerte no haber nacido princesa!\n@c1@"
  fr: "@a@b*ⓢ Il y a dans ce Psaro l'Exterminateur quelque chose qui ne me revient vraiment pas. Je suis contente de ne pas être née princesseⓠ\n@c1@"
  it: "@a@b*: Psaro il Massacratore è una creatura inquietante... Meno male che non sono la Principessa!\n@c1@"
  ja: "@a@b＊「デスピサロっていう人\n\tわたしは　どうも好きになれないわ。\n\t姫さまに　生まれなくてよかった！\n@c1@"
"55":
  de: "@a@b*: Die Frauen plaudern den lieben langen Tag über dies und das und jenes. Da komm ich nicht mehr mit.\n@c2@"
  en: "@a@b*: The women ramble on about this and that all day long. I can't keep up.\n@c2@"
  es: "@a@b*: Las mujeres se pasan todo el día cotilleando. No consigo mantenerme al día.\n@c2@"
  fr: "@a@b*ⓢ Les femmes n'arrêtent pas de parler de tout et de rien à longueur de journée. Je n'arrive pas à suivre.\n@c2@"
  it: "@a@b*: Le donne non fanno altro che parlare tutto il giorno. Non ne posso più!\n@c2@"
  ja: "@a@b＊「どうも　女たちのおしゃべりは\n\tとりとめがなくて\n\tついてゆけんな。\n@c2@"
"56":
  de: "@a@b*: Das Turnier findet nur tagsüber statt. Warum kommt Ihr nicht morgen wieder?\n@c2@"
  en: "@a@b*: The tournament only takes place during the day. Why don't you come back tomorrow?\n@c2@"
  es: "@a@b*: El torneo se celebra solo durante el día. ¿Por qué no %H860%Xvuelves%Yvolvéis%Z mañana?\n@c2@"
  fr: "@a@b*ⓢ Le tournoi ne se déroule qu'en journée. Pourquoi ne pas revenir demainⓡ\n@c2@"
  it: "@a@b*: Il torneo si svolge di giorno. %H860%XTorna%YTornate%Z domani.\n@c2@"
  ja: "@a@b＊「武術大会は　昼間だけ。\n\tまた　明日\n\t出直してくるがよろしかろう。\n@c2@"
"57":
  de: "@a@b*: Ich wünschte, ich könnte mir das Turnier von Endor ansehen.\n@c2@"
  en: "@a@b*: I wish I could go and watch the Endor Tourney.\n@c2@"
  es: "@a@b*: Cómo me gustaría poder ir a ver el Torneo de Endor.\n@c2@"
  fr: "@a@b*ⓢ Si seulement je pouvais aller assister au tournoi de Chandor.\n@c2@"
  it: "@a@b*: Come mi piacerebbe assistere al Torneo di Endor...\n@c2@"
  ja: "@a@b＊「あーあ　オレも武術大会を\n\t見物しに　行きたいぜ。\n@c2@"
"58":
  de: "@a@b*: Durch diese Tür geht es zur Burg Endor.\n@c2@"
  en: "@a@b*: Through this door is Endor Castle.\n@c2@"
  es: "@a@b*: Por esta puerta se llega al Castillo de Endor.\n@c2@"
  fr: "@a@b*ⓢ Derrière cette porte se trouve le château de Chandor.\n@c2@"
  it: "@a@b*: Questo è l'ingresso che conduce al castello di Endor.\n@c2@"
  ja: "@a@b＊「この扉の向こうは\n\tエンドールの　お城だ。\n@c2@"
"59":
  de: "@a@b*: König Norbert ist oben.\n@c2@"
  en: "@a@b*: You'll find King Norman upstairs.\n@c2@"
  es: "@a@b*: Arriba %H860%Xencontrarás%Yencontraréis%Z al rey Norman.\n@c2@"
  fr: "@a@b*ⓢ Vous trouverez le roi Norbert à l'étage.\n@c2@"
  it: "@a@b*: Re Norman si trova al piano superiore.\n@c2@"
  ja: "@a@b＊「王様は　この上におわします。\n@c2@"
"60":
  de: "@a@b*: Wenn Ihr zum Kolosseum wollt, folgt einfach diesem Korridor und geht die Treppe hinunter.\n@c2@"
  en: "@a@b*: If you're headed for the Colosseum, just follow this corridor and take the stairs down.\n@c2@"
  es: "@a@b*: Si %H860%Xquieres dirigirte%Yqueréis dirigiros%Z al Coliseo, %H860%Xsigue%Yseguid%Z este pasillo y %H860%Xbaja%Ybajad%Z las escaleras.\n@c2@"
  fr: "@a@b*ⓢ Si vous voulez rejoindre le Colisée, suivez ce couloir et prenez les escaliers qui descendent.\n@c2@"
  it: "@a@b*: Per raggiungere l'Arena, %H860%Xsegui%Yseguite%Z questo corridoio e %H860%Xscendi%Yscendete%Z le scale.\n@c2@"
  ja: "@a@b＊「コロシアムへ　行きたいなら\n\tこの廊下をまっすぐ進み\n\t階段を　降りるといい。\n@c2@"
"61":
  de: "@a@b*: Der Sieger im Turnier von Endor darf Prinzessin Veronica heiraten.\n@c1@"
  en: "@a@b*: Whoever wins the Endor Tourney will have the princess's hand in marriage.\n@c1@"
  es: "@a@b*: A quien gane el Torneo de Endor se le concederá la mano de la princesa Verónica.\n@c1@"
  fr: "@a@b*ⓢ Celui qui remportera le tournoi de Chandor obtiendra la main de la princesse Véronica.\n@c1@"
  it: "@a@b*: Il vincitore del Torneo di Endor sposerà la Principessa Veronica.\n@c1@"
  ja: "@a@b＊「武術大会の　優勝者は\n\tここの　お姫さまと\n\t結婚できるんですよ。\n@c1@"
"62":
  de: "@a@b*: Es steht mir ja nicht zu, das zu sagen, aber sie tut mir schrecklich leid.\n@c1@"
  en: "@a@b*: It's not my place to say so, but I feel ever so sorry for her.\n@c1@"
  es: "@a@b*: Ya sé que no es asunto mío, pero lo siento mucho por ella.\n@c1@"
  fr: "@a@b*ⓢ Je sors de mon rang en disant cela, mais j'ai vraiment de la peine pour elle.\n@c1@"
  it: "@a@b*: Forse non dovrei dire una cosa del genere, ma mi spiace molto per lei...\n@c1@"
  ja: "@a@b＊「お姫さまも　かわいそうに……。\n@c1@"
"63":
  de: "@a@b*: In letzter Zeit werden sogar hier in Endor Ungeheuer gesehen.\n@c2@"
  en: "@a@b*: There've been monsters appearing of late, even here in Endor.\n@c2@"
  es: "@a@b*: En los últimos tiempos se han visto monstruos, incluso aquí, en Endor.\n@c2@"
  fr: "@a@b*ⓢ Récemment, des monstres sont apparus, même ici, à Chandor.\n@c2@"
  it: "@a@b*: Anche qui a Endor, da un po' di tempo a questa parte, sono comparsi dei mostri... \n@c2@"
  ja: "@a@b＊「近ごろ　このエンドールにも\n\t魔物どもがでるように\n\tなりましてな。\n@c2@"
"64":
  de: "@a@b*: Darum hält König Norbert dieses Turnier ab, um viele starke Krieger hier zu versammeln.\n@c2@"
  en: "@a@b*: That's why King Norman decided to hold this tournament, so that he could bring lots of strong warriors together.\n@c2@"
  es: "@a@b*: De modo que el rey Norman ha decidido celebrar este torneo para poder reunir a muchos guerreros poderosos.\n@c2@"
  fr: "@a@b*ⓢ C'est pour cela que le roi Norbert a décidé d'organiser ce tournoi, afin de rassembler de nombreux et solides guerriers.\n@c2@"
  it: "@a@b*: Infatti Re Norman ha organizzato il Torneo proprio per riunire molti guerrieri valorosi.\n@c2@"
  ja: "@a@b＊「それで王様は　強い者たちを\n\t集めるつもりで　武術大会を\n\t開くようになったのじゃが……。\n@c2@"
"65":
  de: "@a@b*: Wenn Ihr am Turnier von Endor teilnehmen wollt, nehmt Euch vor Psaro dem Metzler in Acht.\n@c2@"
  en: "@a@b*: If you're planning on taking part in the Endor Tourney, watch out for that Psaro the Manslayer.\n@c2@"
  es: "@a@b*: Si %H860%Xtienes%Ytenéis%Z pensado tomar parte en el Torneo de Endor, %H860%Xten%Ytened%Z cuidado con ese Psaro el Carnicero.\n@c2@"
  fr: "@a@b*ⓢ Si vous avez l'intention de participer au tournoi de Chandor, méfiez-vous de Psaro l'Exterminateur.\n@c2@"
  it: "@a@b*: Se %H860%Xhai%Yavete%Z intenzione di partecipare al Torneo di Endor, %H860%Xfai%Yfate%Z molta attenzione a Psaro il Massacratore!\n@c2@"
  ja: "@a@b＊「もし　武術大会に出るのなら\n\tデスピサロという男に\n\t気をつけろ。\n@c2@"
"66":
  de: "@a@b*: Das ist ein ziemlich mieser Kerl. Unglaublich stark und kämpft am liebsten bis zum Tod.\n@c2@"
  en: "@a@b*: He's a bit of a nasty piece of work. Strong beyond belief, and he really likes to fight to the death.\n@c2@"
  es: "@a@b*: Es un hueso duro de roer. Es increíblemente fuerte y le gustan los combates a muerte.\n@c2@"
  fr: "@a@b*ⓢ C'est un dur à cuire. Il est incroyablement fort et il aime combattre jusqu'à la mort.\n@c2@"
  it: "@a@b*: Sarà un'impresa batterlo. Ha una forza incredibile e non smette di combattere fino a quando non ha completamente annientato l'avversario.\n@c2@"
  ja: "@a@b＊「とてつもなく　強く　しかも\n\t相手の息の根を　止めるまで\n\t戦いを　やめぬのだ。\n@c2@"
"67":
  de: "@a@b*: König Norbert denkt nicht immer nach, bevor er spricht. Das hat ihn auch diesmal wieder ganz schön in die Bredouille gebracht.\n@c2@"
  en: "@a@b*: King Norman doesn't always think before he speaks. It's got him into quite a spot of bother this time as well.\n@c2@"
  es: "@a@b*: El rey Norman no siempre piensa antes de hablar. Y esta vez, de nuevo, se ha metido en un aprieto por ello.\n@c2@"
  fr: "@a@b*ⓢ Le roi Norbert ne réfléchit pas toujours avant de parler. Cette fois encore, ça l'a mis dans une situation drôlement ennuyeuse.\n@c2@"
  it: "@a@b*: A volte Re Norman agisce senza riflettere. Stavolta si è messo in una situazione davvero scomoda.\n@c2@"
  ja: "@a@b＊「ここの王様は　軽はずみで\n\t思ったことを　すぐに\n\t実行しちゃうんです。　困ったもんだ。\n@c2@"
"68":
  de: "@a@b*: Das hier ist König Norberts Thronsaal.\n@c2@"
  en: "@a@b*: This is King Norman's throne room.\n@c2@"
  es: "@a@b*: Este es el salón del trono del rey Norman.\n@c2@"
  fr: "@a@b*ⓢ Ceci est la salle du trône du roi Norbert.\n@c2@"
  it: "@a@b*: Questa è la stanza del trono di Re Norman.\n@c2@"
  ja: "@a@b＊「ここは　エンドール王の\n\tお部屋です。\n@c2@"
"69":
  de: "@a@b*: König Norbert hat einen schrecklichen Schlamassel angerichtet mit seinem albernen Versprechen. Fragt nur die Prinzessin.\n@c2@"
  en: "@a@b*: King Norman has got us into a terrible pickle by making the most ridiculous promise. Just ask the princess.\n@c2@"
  es: "@a@b*: El rey Norman nos ha metido en un lío terrible por una ridícula promesa. %H860%XPregúntale%YPreguntadle%Z a la princesa.\n@c2@"
  fr: "@a@b*ⓢ Le roi Norbert nous a mis dans un beau pétrin en faisant une promesse des plus stupides. Demandez donc à la princesse.\n@c2@"
  it: "@a@b*: Con quella sua ridicola promessa, Re Norman ci ha messo davvero nei pasticci... %H860%XProva%YProvate%Z a immaginare come deve sentirsi la Principessa!\n@c2@"
  ja: "@a@b＊「まったく　わが王は\n\tとんでもない約束を　したものです。\n\t姫の話を　聞いてやってくだされ。\n@c2@"
"70":
  de: "@aKönig Norbert@bAh, da seid Ihr ja! Der Zar von Samokswa hat mir schon von Euch berichtet.\n@c2@"
  en: "@aKing Norman@bAh, you're here! I had word about you from the Tsar of Zamoksva.\n@c2@"
  es: "@aRey Norman@b¡Ah, estáis aquí! El Zar de Zamoksva me ha hablado de vos.\n@c2@"
  fr: "@aRoi Norbert@bAh, vous voilàⓠ J'ai entendu parler de vous par le tsar de Zamoksva.\n@c2@"
  it: "@aRe Norman@b%H860%XEccoti%YEccovi%Z qui, finalmente! Lo Zar di Zamoskva mi ha parlato molto di %H860%Xte%Yvoi%Z!\n@c2@"
  ja: "@a@b王「おお　よくぞ来た！\n\tそなたらのことは　すでに\n\tサントハイム王より　聞いているぞ。\n@c2@"
"71":
  de: "@aKönig Norbert@bIhr macht Euch offenbar Sorgen um die Welt und wollt daher Eure Kräfte stärken. Das ist sehr löblich!\n@c2@"
  en: "@aKing Norman@bIt seems you're concerned about the world so you're trying to build up your strength.\nI must commend you!\n@c2@"
  es: "@aRey Norman@bParece que os preocupa la situación del mundo e intentáis haceros más fuerte.\n¡Os respeto por ello!\n@c2@"
  fr: "@aRoi Norbert@bIl paraît que le sort du monde vous inquiète et que vous essayez d'accroître votre force.\nJe me dois de vous féliciterⓠ\n@c2@"
  it: "@aRe Norman@bHo sentito dire che %H860%Xti%Yvi%Z stanno a cuore le sorti del mondo, e per questo motivo %H860%Xstai%Ystate%Z cercando di accrescere la %H860%Xtua%Yvostra%Z forza. Ammiro molto ciò che %H860%Xstai%Ystate%Z facendo!\n@c2@"
  ja: "@a@b王「世界の行く末を　案じ\n\tちからだめしの旅とは\n\tまことに　感心なり！\n@c2@"
"72":
  de: "@aKönig Norbert@bSo, wo ist nun Zarewna Alena?\n@c2@"
  en: "@aKing Norman@bNow, where is Tsarevna Alena?\n@c2@"
  es: "@aRey Norman@bBueno, ¿dónde está la zarevna Alena?\n@c2@"
  fr: "@aRoi Norbert@bMais où est donc la tsarine Alinaⓡ\n@c2@"
  it: "@aRe Norman@bE dunque, %H860%Xdimmi%Yditemi%Z, dove si trova la Zarina Alena?\n@c2@"
  ja: "@a@b王「して　アリーナ姫は\n\tどうされたのじゃ？\n@c2@"
"73":
  de: "@aKönig Norbert@bAh, da seid Ihr ja! Der Zar von Samokswa hat mir schon von Euch berichtet.\n@c2@"
  en: "@aKing Norman@bAh, you're here! I had word about you from the Tsar of Zamoksva.\n@c2@"
  es: "@aRey Norman@b¡Ah, estáis aquí! El Zar de Zamoksva me ha hablado de vos.\n@c2@"
  fr: "@aRoi Norbert@bAh, vous voilàⓠ J'ai entendu parler de vous par le tsar de Zamoksva.\n@c2@"
  it: "@aRe Norman@b%H860%XEccoti%YEccovi%Z qui, finalmente! Lo Zar di Zamoskva mi ha parlato molto di %H860%Xte%Yvoi%Z!\n@c2@"
  ja: "@a@b王「おお　よくぞ来た！\n\tそなたらのことは　すでに\n\tサントハイム王より　聞いているぞ。\n@c2@"
"74":
  de: "@aKönig Norbert@bIhr macht Euch offenbar Sorgen um die Welt und wollt daher Eure Kräfte stärken. Das ist sehr löblich!\n@c2@"
  en: "@aKing Norman@bIt seems you're concerned about the world so you're trying to build up your strength.\nI must commend you!\n@c2@"
  es: "@aRey Norman@bParece que os preocupa la situación del mundo e intentáis haceros más fuerte.\n¡Os respeto por ello!\n@c2@"
  fr: "@aRoi Norbert@bIl paraît que le sort du monde vous inquiète et que vous essayez d'accroître votre force.\nJe me dois de vous féliciterⓠ\n@c2@"
  it: "@aRe Norman@bHo sentito dire che %H860%Xti%Yvi%Z stanno a cuore le sorti del mondo, e per questo motivo %H860%Xstai%Ystate%Z cercando di accrescere la %H860%Xtua%Yvostra%Z forza. Ammiro molto ciò che %H860%Xstai%Ystate%Z facendo!\n@c2@"
  ja: "@a@b王「世界の行く末を　案じ\n\tちからだめしの旅とは\n\tまことに　感心なり！\n@c2@"
"75":
  de: "@aKönig Norbert@bIch muss Euch zudem um einen Gefallen bitten.\nSeht Ihr, ich verlasse mich darauf, dass %A120%XAlena%Z%B120%XIhr%Z das Turnier von Endor gewinnt.\n@c2@"
  en: "@aKing Norman@bI must also request a favour. You see, I'm relying on you to win the Endor Tourney.\n@c2@"
  es: "@aRey Norman@bTambién debo pediros un favor. Cuento con que ganéis el Torneo de Endor.\n@c2@"
  fr: "@aRoi Norbert@bJe dois aussi vous demander une faveur.\nVoyez-vous, je compte sur %A120%Xla tsarine Alina%Z%B120%Xvous%Z%C120%X%Z pour gagner le tournoi de Chandor.\n@c2@"
  it: "@aRe Norman@b%A110%XOh, quanto vorrei che Alena vincesse il Torneo di Endor...%Z%B120%XHo una richiesta da farti... Voglio che tu vinca il Torneo di Endor.%Z\n@c2@"
  ja: "@a@b王「そこで　頼みがあるのじゃが\n\t武術大会で\n\tぜひとも　優勝してくれい！\n@c2@"
"76":
  de: "@aKönig Norbert@bIch sehe ein, dass mein Versprechen sehr töricht war. Ich wäre Euch sehr verbunden, wenn Ihr das in Ordnung bringen könntet%A120%X%Z%B120%X, Alena%Z.\n@c2@"
  en: "@aKing Norman@bI've come to see now that the promise I made was rather foolish. I'd be most obliged if you could rectify it, Alena.\n@c2@"
  es: "@aRey Norman@bMe he dado cuenta de que mi promesa fue una insensatez. Estaría en deuda con vos si pudieses rectificarla%A120%X.%Z%B120%X, Alena.%Z%C120%X.%Z\n@c2@"
  fr: "@aRoi Norbert@bJe réalise aujourd'hui que la promesse que j'ai faite était assez stupide. Je vous serais très obligé de résoudre le problème%A120%X%Z%B120%X, Alina%Z%C120%X%Z.\n@c2@"
  it: "@aRe Norman@b%A110%XOh, quanto vorrei che Alena vincesse il Torneo di Endor...%Z%B120%XHo una richiesta da farti... Voglio che tu vinca il Torneo di Endor.%Z\n@c2@"
  ja: "@a@b王「じつは　わしも\n\t後悔してるのじゃよ。\n\tアリーナ姫　どうか頼んだぞ！\n@c2@"
"77":
  de: "@aPrinzessin Veronica@bLeider hat Vater öffentlich ein Versprechen gegeben, also muss ich jetzt denjenigen heiraten, der das Turnier gewinnt.\n@c1@"
  en: "@aPrincess Veronica@bI'm afraid that Father made a public promise, so now I have to marry whoever wins the tournament.\n@c1@"
  es: "@aPrincesa Verónica@bMe temo que padre ha hecho una promesa pública, así que tendré que casarme con el vencedor del Torneo.\n@c1@"
  fr: "@aPrincesse Véronica@bMalheureusement, Père a fait une promesse publique, je suis donc contrainte d'épouser quiconque remportera le tournoi.\n@c1@"
  it: "@aPrincipessa Veronica@bPovera me... La promessa fatta da mio padre mi costringerà a sposare chiunque vinca il torneo...!\n@c1@"
  ja: "@a@b＊「お父さまが　みなに\n\t約束をしたため　私は優勝者と\n\t結婚をしなくてはなりません。\n@c1@"
"78":
  de: "@aPrinzessin Veronica@bAch, ich bin ganz krank vor Sorge. Wer weiß, bei wem ich da landen werde.\n@c1@"
  en: "@aPrincess Veronica@bOh, what a worry this is! I dread to think who I might end up with.\n@c1@"
  es: "@aPrincesa Verónica@b¡Oh, qué preocupación más grande! Tiemblo solo de pensar con quién puedo acabar.\n@c1@"
  fr: "@aPrincesse Véronica@bOh, je suis morte d'inquiétudeⓠ Je n'ose imaginer avec qui je vais devoir me marier.\n@c1@"
  it: "@aPrincipessa Veronica@bChe sventura! Chissà quale uomo sarò obbligata a prendere come marito...\n@c1@"
  ja: "@a@b＊「ああ……\n\t私は　どうなってしまうの。\n@c1@"
"79":
  de: "@aPrinzessin Veronica@bVater hat öffentlich ein Versprechen gegeben, also muss ich jetzt denjenigen heiraten, der das Turnier gewinnt.\n@c1@"
  en: "@aPrincess Veronica@bFather made a public promise, so now I have to marry whoever wins the tournament.\n@c1@"
  es: "@aPrincesa Verónica@bPadre ha hecho una promesa pública, así que tendré que casarme con el vencedor del Torneo.\n@c1@"
  fr: "@aPrincesse Véronica@bPère a fait une promesse publique, je suis donc contrainte d'épouser quiconque remportera le tournoi.\n@c1@"
  it: "@aPrincipessa Veronica@bPer colpa di mio padre e della sua promessa sarò costretta a sposare il vincitore del torneo, chiunque egli sia!\n@c1@"
  ja: "@a@b＊「お父さまが　みなに\n\t約束をしたため　私は優勝者と\n\t結婚をしなくてはなりません。\n@c1@"
"80":
  de: "@aPrinzessin Veronica@bAber wenn der Sieger eine Frau ist, ist das Ganze natürlich null und nichtig.\n@c1@"
  en: "@aPrincess Veronica@bBut if the winner were a woman, then the whole thing would surely have to be called off.\n@c1@"
  es: "@aPrincesa Verónica@bPero si el vencedor fuera una mujer, habría que cancelar todo el asunto.\n@c1@"
  fr: "@aPrincesse Véronica@bMais si le vainqueur était une femme, tout cela devrait sans doute être annulé.\n@c1@"
  it: "@aPrincipessa Veronica@bMa se la vincitrice fosse una donna, la promessa non avrebbe più senso!\n@c1@"
  ja: "@a@b＊「でも　もし優勝者が\n\t女の人だったら　私は　無理な\n\t結婚をしなくても　すむでしょう。\n@c1@"
"81":
  de: "@aPrinzessin Veronica@bBitte, ich flehe Euch an, Alena%A120%X muss um meinetwillen am Turnier von Endor teilnehmen%Z%B120%X, nehmt um meinetwillen am Turnier von Endor teil%Z.\n@c1@"
  en: "@aPrincess Veronica@bPlease, Alena. I implore you to enter the Endor Tourney for me.\n@c1@"
  es: "@aPrincesa Verónica@bPor favor, %A120%Xdecidle a Alena que se inscriba en el Torneo de Endor. Os lo ruego.%Z%B120%XAlena. Os ruego que os inscribáis en el Torneo de Endor, hacedlo por mí.%Z%C120%Xdecidle a Alena que se inscriba en el Torneo de Endor. Os lo ruego.%Z\n@c1@"
  fr: "@aPrincesse Véronica@bJe vous en supplie, %A120%Xil faut qu'Alina participe%Z%B120%XAlina, participez%Z%C120%X%Z au tournoi de Chandor pour moi.\n@c1@"
  it: "@aPrincipessa Veronica@b%A110%XAlena deve iscriversi al Torneo di Endor! Deve farlo!%Z%B120%XAlena, ti supplico, iscriviti al Torneo di Endor... Fallo per me!%Z\n@c1@"
  ja: "@a@b＊「お願いでございます。\n\tどうか　武術大会に\n\t出てくださいまし！\n@c1@"
"82":
  de: "@aPrinzessin Veronica@bIch kann Euch gar nicht sagen, wie sehr ich %A120%XAlena beneide, weil sie solche Freiheiten genießen darf%Z%B120%XEuch beneide, weil Ihr solche Freiheiten genießen dürft%Z.\n@c1@"
  en: "@aPrincess Veronica@bI can't tell you how envious I am of your being able to live a life of such freedom.\n@c1@"
  es: "@aPrincesa Verónica@bNo puedo expresar la envidia que os tengo por poder vivir con tanta libertad.\n@c1@"
  fr: "@aPrincesse Véronica@bJe ne saurais vous dire à quel point je %A120%Xl'%Z%B120%Xvous %Z%C120%X%Zenvie de pouvoir vivre aussi librement.\n@c1@"
  it: "@aPrincipessa Veronica@bNon immagini nemmeno quanto io invidi la %A110%Xsua%Z%B120%Xtua%Z libertà!\n@c1@"
  ja: "@a@b＊「アリーナ姫さま。\n\t私は　自由に生きている\n\tあなたを　うらやましく思いますわ。\n@c1@"
"83":
  de: "@a@b*: Psaro der Metzler... den Namen kenne ich doch irgendwoher, aber ich kann mich einfach nicht mehr daran erinnern, woher.\n@c2@"
  en: "@a@b*: Psaro the Manslayer... I'm sure I've heard that name somewhere before, but I just can't think where.\n@c2@"
  es: "@a@b*: Psaro el Carnicero... Estoy seguro de que he oído antes ese nombre, pero no puedo recordar dónde.\n@c2@"
  fr: "@a@b*ⓢ Psaro l'Exterminateur... Je suis certain d'avoir déjà entendu ce nom auparavant, mais je n'arrive pas à me rappeler où.\n@c2@"
  it: "@a@b*: Psaro il Massacratore... Ho già sentito questo nome, ma non rammento in quale occasione. \n@c2@"
  ja: "@a@b＊「デスピサロ……。\n\tどこか聞いたような名前じゃが\n\t思い出せんわい……。\n@c2@"
"84":
  de: "@a@b*: Dieser Tisch muss so sauber sein, dass König Norbert davon essen könnte.\n@c2@"
  en: "@a@b*: This table has to be clean enough that King Norman could eat his supper off it.\n@c2@"
  es: "@a@b*: Esta mesa tiene que quedar tan limpia que el propio rey Norman pueda comer en ella.\n@c2@"
  fr: "@a@b*ⓢ Cette table doit être assez propre pour que le roi Norbert puisse prendre son souper dessus.\n@c2@"
  it: "@a@b*: Questo tavolo dev'essere tanto pulito che Re Norman dovrebbe potervi mangiare sopra direttamente, se volesse farlo.\n@c2@"
  ja: "@a@b＊「テーブルを　きれいにふかないと。\n\tせっせ　せっせ。\n@c2@"
"85":
  de: "@a@b*: Ich verrate Euch ein kleines Geheimnis. Wenn Ihr nachts in die Burg wollt, achtet darauf, dass die Wachen Euch nicht sehen.\n@c2@"
  en: "@a@b*: I'll let you in on a little secret. If you want to go inside the castle at night, make sure the guards don't see you.\n@c2@"
  es: "@a@b*: %H860%XTe%YOs%Z contaré un pequeño secreto. Si %H860%Xentras%Yentráis%Z en el castillo de noche, que no %H860%Xte%Yos%Z vean los guardias.\n@c2@"
  fr: "@a@b*ⓢ Je vais vous confier un petit secret. Si vous voulez pénétrer dans le château de nuit, faites en sorte que les gardes ne vous voient pas.\n@c2@"
  it: "@a@b*: %H860%XTi%YVi%Z svelerò un segreto. Per poter accedere al castello di notte, bisogna evitare di essere visti dalle sentinelle.\n@c2@"
  ja: "@a@b＊「いいことを　教えましょう。\n\t夜　お城に入るには　番兵に\n\t見つからぬようにするのだよ。\n@c2@"
"86":
  de: "@a@b*: Oh du liebe Güte. So viel Wäsche und so wenig Zeit, um sie zu waschen!\n@c2@"
  en: "@a@b*: Dearie me. So many things to wash and not enough minutes in the day to wash them in!\n@c2@"
  es: "@a@b*: Ay, por la Diosa. ¡Tanto por lavar y tan poco tiempo para lavarlo!\n@c2@"
  fr: "@a@b*ⓢ Pauvre de moi. Tant de choses à laver et si peu de temps dans la journée pour le faireⓠ\n@c2@"
  it: "@a@b*: Un'intera giornata di lavoro non mi basterà per lavare tutta questa roba! Povera me...\n@c2@"
  ja: "@a@b＊「よいしょ　よいしょ。\n\t洗い物が多くて　たいへん！\n@c2@"
"87":
  de: "@a@b*: Die arme Prinzessin. So wie es im Moment aussieht, muss sie Psaro den Metzler heiraten. Der hört sich nicht gerade nett an.\n@c1@"
  en: "@a@b*: The poor princess. The way things are going, she'll soon be wed to that Psaro the Manslayer. Hardly a nice sounding fellow.\n@c1@"
  es: "@a@b*: Pobre princesa. Tal como van las cosas, pronto estará casada con Psaro el Carnicero. No parece un tipo muy recomendable.\n@c1@"
  fr: "@a@b*ⓢ Pauvre princesse. Au train où vont les choses, elle sera bientôt mariée à ce Psaro l'Exterminateur. Il n'a pas l'air très gentil.\n@c1@"
  it: "@a@b*: A meno di un miracolo, la Principessa sarà costretta a sposare Psaro il Massacratore. Che destino ingrato, il suo...\n@c1@"
  ja: "@a@b＊「お姫さま　かわいそうだわね。\n\tこのままだと　デスピサロって人と\n\t結婚させられるんじゃないかしら。\n@c1@"
"88":
  de: "@a@b*: Seid vor Psaro dem Metzler auf der Hut, ja?\n@c2@"
  en: "@a@b*: Watch out for that Psaro the Manslayer, won't ya?\n@c2@"
  es: "@a@b*: %H860%XTen%YTened%Z cuidado con Psaro el Carnicero, ¿me %H860%Xoyes%Yoís%Z?\n@c2@"
  fr: "@a@b*ⓢ Méfiez-vous de ce Psaro l'Exterminateur, surtoutⓠ\n@c2@"
  it: "@a@b*: %H860%XFai%YFate%Z attenzione a Psaro il Massacratore, mi raccomando!\n@c2@"
  ja: "@a@b＊「デスピサロに　気をつけるんだ！\n@c2@"
"89":
  de: "@a@b*: Dies ist das Kolosseum, wo das Turnier von Endor stattfindet.\n@c2@"
  en: "@a@b*: This is the Colosseum, where the Endor Tourney takes place.\n@c2@"
  es: "@a@b*: Esto es el Coliseo, donde se celebra el Torneo de Endor.\n@c2@"
  fr: "@a@b*ⓢ Ceci est le Colisée. C'est là que se déroule le tournoi de Chandor.\n@c2@"
  it: "@a@b*: Questa è l'Arena. È qui che si svolge il Torneo di Endor.\n@c2@"
  ja: "@a@b＊「ここは　コロシアム。\n\t武術大会の　会場だ。\n@c2@"
"90":
  de: "@a@b*: Nur Zarewna Alena hat des Königs Erlaubnis einzutreten. Aber unter diesen Umständen...\n@c2@"
  en: "@a@b*: Only Tsarevna Alena has the King's permission to enter. But I suppose, under the circumstances...\n@c2@"
  es: "@a@b*: Solo la zarevna Alena tiene el permiso del Rey para entrar. Pero supongo que, en estas circunstancias...\n@c2@"
  fr: "@a@b*ⓢ Seule la tsarine Alina a la permission du roi pour entrer. Mais j'imagine que dans les circonstances actuelles...\n@c2@"
  it: "@a@b*: Il Re ha concesso il permesso di partecipare al torneo solo alla Zarina Alena. Tuttavia, date le circostanze...\n@c2@"
  ja: "@a@b＊「王様から　許可をいただいたのは\n\tアリーナ姫さま　だけです。\n\tしかし　そのありさまでは……。\n@c2@"
"91":
  de: "@a@b*: Ihr seid doch Zarewna Alena? Viel Glück im Turnier!\n@c2@"
  en: "@a@b*: You're Tsarevna Alena, aren't you? Good luck in the tournament.\n@c2@"
  es: "@a@b*: Eres la zarevna Alena, ¿verdad? Buena suerte en el torneo.\n@c2@"
  fr: "@a@b*ⓢ Vous êtes la tsarine Alina, n'est-ce pasⓡ Bonne chance pour le tournoi.\n@c2@"
  it: "@a@b*: Voi siete la Zarina Alena, esatto? In bocca al lupo per il torneo!\n@c2@"
  ja: "@a@b＊「アリーナ姫さまですね。\n\t健闘を　お祈りしています。\n@c2@"
"92":
  de: "@a@b*: Wenn Ihr teilnehmen wollt, geht nach links. Wenn Ihr nur zuschauen wollt, geht die Treppe rechts hinauf.\n@c2@"
  en: "@a@b*: If you're taking part, go to the left. If you're just spectating, then go up the stairs to the right.\n@c2@"
  es: "@a@b*: Si %H860%Xvas%Yvais%Z a participar, %H860%Xve%Yid%Z hacia la izquierda. Si solo %H860%Xquieres%Yqueréis%Z verlo, %H860%Xsube%Ysubid%Z por las escaleras de la derecha.\n@c2@"
  fr: "@a@b*ⓢ Si vous participez au tournoi, allez à gauche. Si vous faites partie des spectateurs, montez les escaliers à droite.\n@c2@"
  it: "@a@b*: Se %H860%Xpartecipi%Ypartecipate%Z al torneo, %H860%Xdevi%Ydovete%Z andare a sinistra. Se invece %H860%Xvuoi%Yvolete%Z assistere alla competizione, %H860%Xsali%Ysalite%Z le scale sulla destra.\n@c2@"
  ja: "@a@b＊「試合に参加するなら　左。\n\t見るだけなら　右の階段を\n\t登るがよい。\n@c2@"
"93":
  de: "@a@b*: Bestimmt gewinnt wieder Psaro der Metzler.\n@c2@"
  en: "@a@b*: Psaro the Manslayer's bound to win.\n@c2@"
  es: "@a@b*: Psaro el Carnicero tiene pinta de ir a ganar.\n@c2@"
  fr: "@a@b*ⓢ C'est sûr que Psaro l'Exterminateur va l'emporter.\n@c2@"
  it: "@a@b*: Psaro il Massacratore vincerà di sicuro!\n@c2@"
  ja: "@a@b＊「優勝は　きっと\n\tデスピサロだろうな。\n@c2@"
"94":
  de: "@a@b*: Ja, super! Hier wird einem ja ordentlich was geboten!\n@c0@"
  en: "@a@b*: Woo woo woo! Now this is entertainment!\n@c0@"
  es: "@a@b*: ¡Yu-ju-ju! ¡A esto le llamo yo diversión!\n@c0@"
  fr: "@a@b*ⓢ Wou wou wouⓠ Ça, c'est du spectacleⓠ\n@c0@"
  it: "@a@b*: Corpo di mille balene! Questo sì che è uno spettacolo!\n@c0@"
  ja: "@a@b＊「うひょーっ！\n\t血がさわぐぜ！\n@c0@"
"95":
  de: "@a@b*: Das ist so aufregend, dass ich ganz hibbelig werde!\n@c1@"
  en: "@a@b*: It's so exciting, I can hardly keep still!\n@c1@"
  es: "@a@b*: ¡Es tan emocionante que no puedo quedarme quieta!\n@c1@"
  fr: "@a@b*ⓢ C'est tellement palpitant. J'ai du mal à tenir en placeⓠ\n@c1@"
  it: "@a@b*: Oh, che emozione!\n@c1@"
  ja: "@a@b＊「この刺激が　たまらないわ！\n@c1@"
"96":
  de: "@a@b*: Ja! Lass es krachen!\n@c1@"
  en: "@a@b*: Yeah! Go for it!\n@c1@"
  es: "@a@b*: ¡Vamos! ¡A por todas!\n@c1@"
  fr: "@a@b*ⓢ Ouaisⓠ Vas-yⓠ\n@c1@"
  it: "@a@b*: Sì! Così! Evvai!\n@c1@"
  ja: "@a@b＊「がんばれ　がんばれーっ！\n@c1@"
"97":
  de: "@a@b*: So würde ich aber nicht kämpfen. Nee! Das hat doch keinen Wert. Hier, so muss man kämpfen...!\n@c3@"
  en: "@a@b*: I wouldn't be fightin' like that. Nah! That ain't no good. You gotta fight like this...!\n@c3@"
  es: "@a@b*: Yo no lucharía así. No, eso no sirve de nada. ¡Así es como se pelea!\n@c3@"
  fr: "@a@b*ⓢ Je m'battrais pas comme ça. Pfffⓠ C'est n'importe quoi. Il faut faire comme ça...ⓠ\n@c3@"
  it: "@a@b*: Ehi! Devo insegnarvi io come si lotta? Ma no! Non si può combattere in questo modo!\n@c3@"
  ja: "@a@b＊「オレなら　ああは戦わないぜ！\n\tああっ　そうじゃだめだっ！\n\tほら　そこで　こうするんだっ！\n@c3@"
"98":
  de: "@a@b*: Hick! Vor sich einen schönen Kampf, und in der Hand ein nettes Schlückchen ⓚⓛ gibt doch nix Besseres!\n@c2@"
  en: "@a@b*: Hic! You can't beat the odd drink or two when you're watching a fight.\n@c2@"
  es: "@a@b*: ¡Hip! No hay nada como un par de cervezas mientras miras un combate.\n@c2@"
  fr: "@a@b*ⓢ Hicⓠ Rien ne vaut un ou deux petits verres en regardant un combat.\n@c2@"
  it: "@a@b*: Hic! Non shè niente di meglio di un buon goshetto mentre si ashishte a una shfida avvinshente! Hic!\n@c2@"
  ja: "@a@b＊「ウィ～ック。\n\t武術大会をながめながら\n\t飲む酒は　うまいっ！\n@c2@"
"99":
  de: "@a@b*: Na los! Immer feste drauf! ... Öh. Du liebes Bisschen. Was rede ich denn da? Vergib mir, Göttin.\n@c1@"
  en: "@a@b*: Go on! Get stuck in! ...Er. Oh dear. What am I saying? Forgive me, Goddess.\n@c1@"
  es: "@a@b*: ¡Vamos! ¡Ataca ya! Esto... ¡Oh!, vaya. ¿Pero qué estoy diciendo? Perdóname, Diosa.\n@c1@"
  fr: "@a@b*ⓢ Allezⓠ Attaqueⓠ ... Oh, mais qu'est-ce que je raconteⓡ Déesse, pardonnez-moi.\n@c1@"
  it: "@a@b*: Evvai! Fallo a pezzi! Oh, cielo! Che sto dicendo?!? Ti chiedo perdono, mia dea.\n@c1@"
  ja: "@a@b＊「いけーっ！　やっちゃえー！！\n\t……はっ　わたくしは　何を！？\n\t神よ　お許しください……。\n@c1@"
"100":
  de: "@a@b*: Wäre ich nur ein, zwei Jährchen jünger, wäre ich selbst auch dabei. Ho ho!\n@c2@"
  en: "@a@b*: If only I was a year or two younger, I would've taken part myself. Ho ho!\n@c2@"
  es: "@a@b*: Si fuese uno o dos años más joven, yo mismo habría participado en el torneo. ¡Ja, ja!\n@c2@"
  fr: "@a@b*ⓢ Si j'avais eu un ou deux ans de moins, j'aurais participé, moi aussi. Ho hoⓠ\n@c2@"
  it: "@a@b*: Diamine! Avessi avuto qualche anno in meno, anch'io avrei partecipato al torneo!\n@c2@"
  ja: "@a@b＊「わしも　もうちょっと若ければ\n\t出場したのにのう。\n\tほっほっほ。\n@c2@"
"101":
  de: "@a@b*: Psst! Geht weg und redet mit jemand anderem!\n@c3@"
  en: "@a@b*: Shush! Go and talk to someone else!\n@c3@"
  es: "@a@b*: ¡Ssshhh! ¡%H860%XVe%YId%Z a hablar con otro!\n@c3@"
  fr: "@a@b*ⓢ Chutⓠ Allez parler à quelqu'un d'autreⓠ\n@c3@"
  it: "@a@b*: Sssh! %H860%XVai%YAndate%Z a parlare con qualcun altro!\n@c3@"
  ja: "@a@b＊「うるさい！　話しかけるなっ！\n@c3@"
"102":
  de: "@a@b*: ... Tut mir leid. Vor dem Kampf bin ich einfach ein bisschen nervös.\n@c3@"
  en: "@a@b*: ...Sorry. I'm just getting a bit het up before the big fight.\n@c3@"
  es: "@a@b*: Lo siento. Me pongo un poco histérico antes de un gran combate.\n@c3@"
  fr: "@a@b*ⓢ ... Désolé. Je m'échauffe toujours un peu avant le grand combat.\n@c3@"
  it: "@a@b*: L'attesa per il combattimento mi sta facendo salire l'adrenalina a mille!\n@c3@"
  ja: "@a@b＊「…………。\n\tすまなかったな。\n\t試合の前で　気がたっているのだ。\n@c3@"
"103":
  de: "@a@b*: Die Kampfarena liegt direkt dort oben. Sobald Ihr hinaufgeht, gibt es kein Zurück mehr. Viel Glück!\n@c2@"
  en: "@a@b*: The fighting arena is just upstairs. Once you go up there, there's no turning back. Good luck!\n@c2@"
  es: "@a@b*: La arena de combate está arriba. Cuando %H860%Xsubas%Ysubáis%Z, ya no %H860%Xpodrás%Ypodréis%Z volver atrás. ¡Suerte!\n@c2@"
  fr: "@a@b*ⓢ L'arène de combat se trouve à l'étage supérieur. Une fois là-haut, vous ne pourrez plus faire demi-tour. Bonne chanceⓠ\n@c2@"
  it: "@a@b*: L'Arena dove si svolgono i combattimenti si trova al piano superiore. Una volta entrati, non è possibile tornare indietro. Buona fortuna!\n@c2@"
  ja: "@a@b＊「この上が　試合場。\n\t登ったら最後　後にはひけません。\n\tさあ　お登りください！\n@c2@"
"104":
  de: "@a@b*: Das ist eine Abkürzung aus der Burg hinaus. Ganz praktisch, wenn man es eilig hat.\n@c2@"
  en: "@a@b*: This is a shortcut to outside the castle. It can be quite handy if you're in a hurry.\n@c2@"
  es: "@a@b*: Esto es un atajo para salir del castillo. Puede ser muy práctico cuando tienes prisa.\n@c2@"
  fr: "@a@b*ⓢ C'est un raccourci pour sortir du château. Il peut être très pratique en cas d'urgence.\n@c2@"
  it: "@a@b*: Questa è una scorciatoia che porta fuori dal castello. È molto comoda, qualora si avesse il bisogno di andar via in tutta fretta... \n@c2@"
  ja: "@a@b＊「ここは　お城の外に出る　近道。\n\t急ぐ時は　便利ですよ。\n@c2@"
"105":
  de: "@a@b*: Hm, allmählich macht mir Psaro der Metzler fast ein bisschen Angst. Seine Stärke ist ja schon fast übernatürlich.\n@c2@"
  en: "@a@b*: Hm, I'm starting to find this Psaro the Manslayer fellow a bit frightening. His strength is almost inhuman.\n@c2@"
  es: "@a@b*: Mmm, estoy empezando a asustarme un poco de ese Psaro el Carnicero. Tiene una fuerza casi inhumana.\n@c2@"
  fr: "@a@b*ⓢ Mmm, je commence à trouver ce Psaro l'Exterminateur un peu effrayant. Sa force est presque inhumaine.\n@c2@"
  it: "@a@b*: Psaro il Massacratore è un combattente terrificante. Ha una forza sovrumana.\n@c2@"
  ja: "@a@b＊「うーん　うーん　おそろしい……。\n\tデスピサロの強さは\n\tとても　人間とは思えない……。\n@c2@"
"106":
  de: "@a@b*: Hm? Warum ich noch lebe? Weil ich nicht gut genug bin, um es bis zur letzten Hürde zu schaffen, darum.\n@c2@"
  en: "@a@b*: Hm? Why am I still alive? Because I'm too weak to make it to the final hurdle, that's why.\n@c2@"
  es: "@a@b*: ¿Mmm? ¿Que por qué estoy vivo aún? Porque soy demasiado débil para llegar hasta el obstáculo final, por eso.\n@c2@"
  fr: "@a@b*ⓢ Heinⓡ Pourquoi je suis encore en vieⓡ Parce que je suis trop faible pour arriver en finale, voilà pourquoi.\n@c2@"
  it: "@a@b*: Eh sì, sono ancora vivo solo perché non sono stato tanto forte da proseguire il mio cammino nel torneo.\n@c2@"
  ja: "@a@b＊「え？　なぜオレが生きているかって？\n\tオレが　弱すぎて　とどめを刺すに\n\tあたいしなかったためだろうな……。\n@c2@"
"107":
  de: "@a@b*: Durch diese Tür geht es zur Burg Endor.\n@c2@"
  en: "@a@b*: Through this door is Endor Castle.\n@c2@"
  es: "@a@b*: Por esta puerta se llega al Castillo de Endor.\n@c2@"
  fr: "@a@b*ⓢ Derrière cette porte se trouve le château de Chandor.\n@c2@"
  it: "@a@b*: Questo è l'ingresso che conduce al castello di Endor.\n@c2@"
  ja: "@a@b＊「この扉の向こうは\n\tエンドールの　お城だ。\n@c2@"
"108":
  de: "@a@b*: Aber ich fürchte, nachts könnt Ihr nicht herein. Ihr müsst morgen früh wiederkommen.\n@c2@"
  en: "@a@b*: But I'm afraid you can't go in during the night. You'll have to come back in the morning.\n@c2@"
  es: "@a@b*: Pero me temo que de noche no %H860%Xpuedes%Ypodéis%Z entrar. %H860%XTendrás%YTendréis%Z que volver por la mañana.\n@c2@"
  fr: "@a@b*ⓢ Mais je regrette, vous ne pouvez pas entrer pendant la nuit. Vous devrez revenir demain matin.\n@c2@"
  it: "@a@b*: Spiacente, ma di notte l'accesso non è consentito. %H860%XTorna%YTornate%Z domani mattina.\n@c2@"
  ja: "@a@b＊「しかし　今は夜ふけ。\n\tまた明日　出直してくるのが\n\tよいだろう。\n@c2@"
"109":
  de: "@a@b*: Was schleicht Ihr denn mitten in der Nacht in der Burg herum?\n@c2@"
  en: "@a@b*: What do you think you're doing, prowling about the castle at this time of night?\n@c2@"
  es: "@a@b*: ¿Qué %H860%Xcrees que estás haciendo%Ycreéis que estáis haciendo%Z merodeando por el castillo a estas horas de la noche?\n@c2@"
  fr: "@a@b*ⓢ Que faites-vous à rôder dans le château à une heure pareilleⓡ\n@c2@"
  it: "@a@b*: Che ci %H860%Xfai%Yfate%Z al castello a quest'ora di notte?\n@c2@"
  ja: "@a@b＊「こんな夜更けに\n\tお城に　入ってくるとは！\n@c2@"
"110":
  de: "@a@b*: Ich kann Euch nicht einfach so hier herumlaufen lassen. Na los, raus mit Euch!\n@c2@"
  en: "@a@b*: I can't let you just wander about as you please. Go on now, get out!\n@c2@"
  es: "@a@b*: No puedo permitir que %H860%Xte pasees%Yos paseéis%Z por donde %H860%Xte%Yos%Z apetezca. ¡Vamos, largo de aquí!\n@c2@"
  fr: "@a@b*ⓢ Je ne peux pas vous laisser vous promener comme ça, à votre guise. Allons, sortez maintenantⓠ\n@c2@"
  it: "@a@b*: È vietato stare qui. %H860%XVai%YAndate%Z via, forza!\n@c2@"
  ja: "@a@b＊「わたしが　見つけた以上\n\t黙っているわけには　ゆかぬ。\n\tささ　立ち去られよ！\n@c2@"
"111":
  de: "@a@b*: Ich kann schon gar nicht mehr zählen, wie viele Soldaten Psaro der Metzler bereits erledigt hat.\n@c2@"
  en: "@a@b*: I can't count how many soldiers Psaro the Manslayer has polished off now.\n@c2@"
  es: "@a@b*: No sé a cuántos soldados se ha cargado ya Psaro el Carnicero.\n@c2@"
  fr: "@a@b*ⓢ Je ne compte plus le nombre de soldats que Psaro l'Exterminateur a déjà liquidés.\n@c2@"
  it: "@a@b*: Non saprei dire quanti avversari abbia fatto fuori Psaro il Massacratore.\n@c2@"
  ja: "@a@b＊「まったく　何人の戦士が\n\tデスピサロに　殺されたことか……。\n@c2@"
"112":
  de: "@a@b*: Ist ja schon fast wie ein Massaker der stärksten Krieger der Welt.\n@c2@"
  en: "@a@b*: It's starting to feel like some sort of massacre of the world's strongest warriors.\n@c2@"
  es: "@a@b*: Esto parece una masacre de los guerreros más fuertes del mundo.\n@c2@"
  fr: "@a@b*ⓢ Ça commence à ressembler à un massacre en règle des plus puissants guerriers du monde.\n@c2@"
  it: "@a@b*: A quanto pare stiamo assistendo alla disfatta di tutti i più forti guerrieri del mondo.\n@c2@"
  ja: "@a@b＊「これでは　まるで\n\t強い者を集めて\n\tほうむっているようなものですよ。\n@c2@"
"113":
  de: "@a@b*: Zzzz...\n@c2@"
  en: "@a@b*: Zzzz...\n@c2@"
  es: "@a@b*: Zzzz...\n@c2@"
  fr: "@a@b*ⓢ Zzzz...\n@c2@"
  it: "@a@b*: Zzz... \n@c2@"
  ja: "@a@b＊「ぐうぐう……。\n@c2@"
"114":
  de: "@a@b*: König Norbert und Prinzessin Veronica haben sich bereits in ihre Gemächer zurückgezogen.\n@c2@"
  en: "@a@b*: King Norman and Princess Veronica have already retired to their chambers.\n@c2@"
  es: "@a@b*: El rey Norman y la princesa Verónica ya se han retirado a sus aposentos.\n@c2@"
  fr: "@a@b*ⓢ Le roi Norbert et la princesse Véronica se sont déjà retirés dans leurs chambres.\n@c2@"
  it: "@a@b*: Re Norman e la Principessa Veronica si sono già ritirati nelle loro stanze.\n@c2@"
  ja: "@a@b＊「王様と　姫さまは\n\tすでに　お休みでございます。\n@c2@"
"115":
  de: "@a@b*: Psaro der Metzler... Allein bei dem Namen läuft es mir schon kalt den Rücken herunter.\n@c2@"
  en: "@a@b*: Psaro the Manslayer... The name alone gives me the willies.\n@c2@"
  es: "@a@b*: Psaro el Carnicero... Solo el nombre me da escalofríos.\n@c2@"
  fr: "@a@b*ⓢ Psaro l'Exterminateur... Rien que son nom me donne la chair de poule.\n@c2@"
  it: "@a@b*: Psaro il Massacratore... Solo a pronunciarne il nome mi vengono i brividi!\n@c2@"
  ja: "@a@b＊「デスピサロ……不吉な名前じゃ。\n@c2@"
"116":
  de: "@a@b*: König Norbert und Prinzessin Veronica haben bereits ihr Abendessen eingenommen und sich zurückgezogen. Ich räume mal lieber weiter auf.\n@c2@"
  en: "@a@b*: King Norman and Princess Veronica had supper and retired to their chambers already. I'd better get on with the clearing up.\n@c2@"
  es: "@a@b*: El rey Norman y la princesa Verónica ya han cenado y se han retirado a sus aposentos. Será mejor que despeje esto.\n@c2@"
  fr: "@a@b*ⓢ Le roi Norbert et la princesse Véronica ont déjà soupé et se sont retirés dans leurs chambres. Je ferais bien de continuer à nettoyer.\n@c2@"
  it: "@a@b*: Re Norman e la Principessa Veronica hanno già cenato e ora si trovano nelle loro stanze. Sarà meglio mettere tutto in ordine.\n@c2@"
  ja: "@a@b＊「王様と　姫さまは\n\t食事も終わって　お休みです。\n\tさあ片付けなきゃ。　せっせ　せっせ。\n@c2@"
"117":
  de: "@a@b*: Es sieht immer mehr nach einem Sieg Psaros des Metzlers aus. Er ist einfach großartig...\n@c2@"
  en: "@a@b*: It's looking more and more like Psaro the Manslayer will win. He's so magnificent...\n@c2@"
  es: "@a@b*: Cada vez parece más claro que Psaro el Carnicero va a ganar. Es un hombre magnífico...\n@c2@"
  fr: "@a@b*ⓢ La victoire de Psaro l'Exterminateur semble de plus en plus assurée. Il est tellement impressionnant...\n@c2@"
  it: "@a@b*: Non c'è dubbio che sarà Psaro il Massacratore a vincere! È troppo forte...\n@c2@"
  ja: "@a@b＊「やっぱり　デスピサロ様が\n\t優勝だよねえ。\n\tかっこいいし……。\n@c2@"
"118":
  de: "@a@b*: Psaro der Metzler hat was an sich, das mir einfach nicht ganz geheuer ist. Zum Glück bin ich keine Prinzessin!\n@c1@"
  en: "@a@b*: There's something about that Psaro the Manslayer that I just can't get on with.\nI'm glad I wasn't born a princess!\n@c1@"
  es: "@a@b*: Hay algo en ese Psaro el Carnicero que no me acaba de convencer. ¡Qué suerte no haber nacido princesa!\n@c1@"
  fr: "@a@b*ⓢ Il y a dans ce Psaro l'Exterminateur quelque chose qui ne me revient vraiment pas. Je suis contente de ne pas être née princesseⓠ\n@c1@"
  it: "@a@b*: Psaro il Massacratore è una creatura inquietante... Meno male che non sono la Principessa!\n@c1@"
  ja: "@a@b＊「デスピサロっていう人\n\tわたしは　どうも好きになれないわ。\n\t姫さまに　生まれなくてよかった！\n@c1@"
"119":
  de: "@a@b*: Die Frauen plaudern den lieben langen Tag über dies und das und jenes. Da komm ich nicht mehr mit.\n@c2@"
  en: "@a@b*: The women ramble on about this and that all day long. I can't keep up.\n@c2@"
  es: "@a@b*: Las mujeres se pasan todo el día cotilleando. No consigo mantenerme al día.\n@c2@"
  fr: "@a@b*ⓢ Les femmes n'arrêtent pas de parler de tout et de rien à longueur de journée. Je n'arrive pas à suivre.\n@c2@"
  it: "@a@b*: Le donne non fanno altro che parlare tutto il giorno. Non ne posso più!\n@c2@"
  ja: "@a@b＊「どうも　女たちのおしゃべりは\n\tとりとめがなくて\n\tついてゆけんな。\n@c2@"
"120":
  de: "@a@b*: Das Turnier findet nur tagsüber statt. Warum kommt Ihr nicht morgen wieder?\n@c2@"
  en: "@a@b*: The tournament only takes place during the day. Why don't you come back tomorrow?\n@c2@"
  es: "@a@b*: El torneo se celebra solo durante el día. ¿Por qué no %H860%Xvuelves%Yvolvéis%Z mañana?\n@c2@"
  fr: "@a@b*ⓢ Le tournoi ne se déroule qu'en journée. Pourquoi ne pas revenir demainⓡ\n@c2@"
  it: "@a@b*: Il torneo si svolge di giorno. %H860%XTorna%YTornate%Z domani.\n@c2@"
  ja: "@a@b＊「武術大会は　昼間だけ。\n\tまた　明日\n\t出直してくるがよろしかろう。\n@c2@"
