"29":
  de: "@aFrieder Niete@bGuten Tag. Ich bin Frieder Niete. Ich sitze hier und denke an Trugbilder und dergleichen.\n@c2@"
  en: "@aStreo Louse@bHowdy, I'm Streo Louse. I been sittin' here havin' me a good ol' think about mirages an' such.\n@c2@"
  es: "@aHortera y Casset@bHola, me llamo Hortera y Casset. Estaba aquí sentando pensando nomás en la verdadera naturaleza de los espejismos.\n@c2@"
  fr: "@aAmédée Carte@bSalut, j'm'appelle Amédée Carte. J'me suis assis ici pour réfléchir sérieusement aux mirages et tout ça.\n@c2@"
  it: "@aProfessor Mente@bSalve! Sono il Professor Mente, e stavo rivolgendo le mie attenzioni allo strano fenomeno noto con il nome di ⓕmiraggioⓖ.\n@c2@"
  ja: "@a@bソクラス「ぼくは　ソクラス。\n\tしんきろう　について\n\t考えていました。\n@c2@"
"30":
  de: "@aFrieder Niete@bEs könnte wohl an dem Unterschied zur Atmosphärentemperatur liegen, dass wir dieses Zeug sehen, das nicht von dieser Welt ist. \n@c2@"
  en: "@aStreo Louse@bI reckon maybe the difference in atmospheric temperature might be what makes it so's we can see that crazy otherworldy stuff.\n@c2@"
  es: "@aHortera y Casset@bPues la pura diferencia de temperatura atmosférica puede ser la causa de que veamos todas esas locuras de otro mundo.\n@c2@"
  fr: "@aAmédée Carte@bJe m'disais que c'était peut-être les différences de température atmosphérique qui les provoquaient et qui faisaient apparaître tous ces trucs étranges.\n@c2@"
  it: "@aProfessor Mente@bRitengo che i miraggi siano creati da differenze nella temperatura atmosferica. Si tratta di visioni strane, bizzarre e a volte persino assurde.\n@c2@"
  ja: "@a@bソクラス「大気の温度差のせいで\n\tあるはずもない世界が　見えたり\n\tすることがあるとか……。\n@c2@"
"31":
  de: "@aFrieder Niete@bNatürlich sind diese anderen Welten bloß eine Vision, aber es gibt ja alle möglichen verrückten Dinge in der Welt...\n@c2@"
  en: "@aStreo Louse@bⓙCourse, these other worlds is only visions an' all, but there's plenty crazy things in this ol' world of ours...\n@c2@"
  es: "@aHortera y Casset@bClaro está que esos otros mundos son purititas visiones, aunque tengamos un buen de locuras en nuestro mundo...\n@c2@"
  fr: "@aAmédée Carte@bBien sûr, ce sont juste des visions, et tout, mais il y a quand même plein de phénomènes bizarres dans notre monde...\n@c2@"
  it: "@aProfessor Mente@bDel resto, non ci sono forse tante cose strane, bizzarre e a volte persino assurde anche nel nostro caro, vecchio mondo reale?\n@c2@"
  ja: "@a@bソクラス「もちろん　幻の世界なんですが\n\tこの世には　ふしぎなことも\n\tたくさん　ありますからね。\n@c2@"
"32":
  de: "@aFrieder Niete@bWer weiß, vielleicht kommen die Pioniere, die es in unsere Stadt verschlägt, gar durch Trugbilder aus anderen Welten.\n@c2@"
  en: "@aStreo Louse@bSo who knows, them pioneers comin' to town could even've come through mirages from other worlds.\n@c2@"
  es: "@aHortera y Casset@bQuién sabe, a lo mejor esos pioneros que llegan a la ciudad pues proceden de espejismos de otros mundos.\n@c2@"
  fr: "@aAmédée Carte@bAlors qui sait, peut-être que les pionniers qui arrivent dans notre ville viennent eux-mêmes de mirages d'autres mondes.\n@c2@"
  it: "@aProfessor Mente@bSono certo che molti dei pionieri arrivati in città hanno raggiunto questo posto inseguendo chissà quale miraggio...\n@c2@"
  ja: "@a@bソクラス「すれちがい大使たちも\n\tそんな世界を　わたり歩いて\n\tいるのかもしれませんよ。\n@c2@"
