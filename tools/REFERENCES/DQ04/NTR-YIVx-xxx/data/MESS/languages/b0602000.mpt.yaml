"55":
  de: "@aZini@bDas wollte ich nicht! Ich schlabber noch nie die Zeche geprellt und mansche es nie wieder. Ich habe aus meinen Fehlern gelernt. Lasst mich raus. (Rülps)\n@c1@"
  en: "@aMary Curey@bI didn't mean to goo it, it was just on the spur of the moment. I promise I'll never eat and run again. I've served my slime, just let me out. (burp)\n@c1@"
  es: "@aMari Curi@bNo pretendía hacerlo, simplemente me dejé llevar por la limosidad del momento. Prometo que nunca más haré un sinpa.\n㈡\nYa he pagado mi error, %H860%Xdéjame%Ydejadme%Z salir. (eructo)\n@c1@"
  fr: "@aMédée Médoc@bJe ne voulais paaas vraiment le faire, ça m'a pris d'un coup.\n㈡\nJe glure que c'est la dernière fois que je paaars d'un restaurant sans payer. Ça m'a servi de leçon, laissez-moi sortiiir. (beurp)\n@c1@"
  it: "@aDolores Tecuro@bLo so, non avrei dovuto andarmene senza aver slurpagato il conto del ristorante! Non lo farò più! Sono slurpentita! Ho capito il mio sbaglio! Fatemi uscire!\n@c1@"
  ja: "@a@bベホイミン「出来心だったんです。\n\tもう　食い逃げなんてしませんから\n\t出して下さいよう　えぐえぐ。\n@c1@"
"56":
  de: "@aZini@b(Grummel) RÜÜÜLLPS!\nSchlabberlot! Träume ich? Die Tür ist offen!\n@c1@"
  en: "@aMary Curey@b(rumble) BURRRP!\nMy gooness! Is it a dream? Flantastic!\nThe door's open!\n@c1@"
  es: "@aMari Curi@b(gruñido) ¡BURRRP!\n¡Por todos los lodos! ¿Estoy soñando? ¡Flantástico!\n¡La puerta está abierta!\n@c1@"
  fr: "@aMédée Médoc@b(gargouillis) BEUUUURPⓠ\nNon, c'est un rêveⓡ C'est gluantastiqueⓠ La porte est ouveeerteⓠ\n@c1@"
  it: "@aDolores Tecuro@bBurp e riburp?! Sogno o son desta?! Ma è slimetastico! La porta è slurpaperta!\n@c1@"
  ja: "@a@bベホイミン「うぃ～　ひっく……ん！\n\t夢か幻かあ　トビラがあいてるぞぉ！\n@c1@"
"57":
  de: "@aZini@bHast du das gemanscht? Ich weiß nicht, wie ich dir danken soll. Aber... ich bin eine Verbrecherin...\n@c1@"
  en: "@aMary Curey@bDid you goo this? I don't know how to thank goo. But...I'm a criminal...\n@c1@"
  es: "@aMari Curi@b¿%H860%XHas sido tú%YHabéis sido %R000%Xvosotras%Yvosotros%Z%Z? No sé cómo %H860%Xagradecértelo%Yagradercéroslo%Z. Pero... soy una criminal...\n@c1@"
  fr: "@aMédée Médoc@bC'est vous qui avez fait çaaaⓡ Je ne sais pas comment vous remercieeer. Mais... je suis une criminelle...\n@c1@"
  it: "@aDolores Tecuro@b%H860%XL'hai aperta tu%YL'avete aperta voi%Z? Non so proprio come %H860%Xringraziarti%Yringraziarvi%Z! Però, ehm... Ecco, io sono una ladra...\n@c1@"
  ja: "@a@bベホイミン「これは　あなた方が！\n\tおありがとうごぜえます。\n\tでも　オレは罪人……。\n@c1@"
"58":
  de: "@aZini@bGäbe es nur einen Ort, an dem ein armer verletzter Schleim wie ich in Frieden schlabbern könnte! Ach, was blubbere ich da? So was gibt's ja doch nicht.\n@c1@"
  en: "@aMary Curey@bOh, if only there was somewhere a poor injured slime like me could start a goo life and live in peace! But why goo this to myself? There's no such place...\n@c1@"
  es: "@aMari Curi@bOh, ¡si existiera un lugar en el que una lima herida como yo pudiera comenzar una nueva vida y vivir en paz! \n㈡\n¿Por qué me revuelco en el lodo? Ese lugar no existe...\n@c1@"
  fr: "@aMédée Médoc@bOh, si seulement une pauvre gluante blessée comme moi pouvait recommencer son existence ailleurs et vivre en paixⓠ\n㈡\nMais à quoi booon me mettre de pareilles idées en têteⓡ Un tel endroit n'existe paaas...\n@c1@"
  it: "@aDolores Tecuro@bQuanto vorrei cambiare vita! Non so che slurparei per andarmene in un luogo lontano, dove nessuno mi conosce! Ma è slimpossibile... Sigh!\n@c1@"
  ja: "@a@bベホイミン「スネに傷をもつ　このオレに\n\t安住の地があるとは思えない。\n\t思えないったら　思えない！\n@c1@"
"59":
  de: "@a@bMöchtest du ihr von Hank Hoffman Jr.s Pionierstadt erzählen?\n@c1@"
  en: "@a@bDo you want to tell her about Hank Hoffman Jr.'s frontier town?\n@c1@"
  es: "@a@b¿Deseas hablarle de la ciudad fronteriza de Juanchito?\n@c1@"
  fr: "@a@bVoulez-vous lui parler de la ville pionnière de Hank Hoffman Jrⓡ\n@c1@"
  it: "@a@bVuoi dirle della nuova città di frontiera fondata da John Dwayne Jr.?\n@c1@"
  ja: "@a@bこの人に　%a00260のことを\n教えてあげますか？\n@c1@"
"60":
  de: "@aZini@bDas klingt blubber! Ich könnte dorthin schleimen und ein ganz neues Leben anfangen, weil keiner wüsste, was ich gemanscht habe.\n@c1@"
  en: "@aMary Curey@bThat sounds gooreat! I could goo to a place like that and start a new life because nobody would know what a bad slime I've been.\n@c1@"
  es: "@aMari Curi@b¡Suena limonudo! Podría mudarme a un sitio como ese y comenzar una nueva vida ya que nadie sabría que he sido una lima mala.\n@c1@"
  fr: "@aMédée Médoc@bÇa a l'air super-gluantⓠ Je pourrais aller dans un endroit comme çaaa et commencer une nouvelle vie. Persooonne ne saurait quelle vilaine gluante j'ai été.\n@c1@"
  it: "@aDolores Tecuro@bSlimesiste davvero un posto del genere?! Allora potrei cominciare una nuova esistenza! Lì nessuno saprebbe che sono stata una slimariuola!\n@c1@"
  ja: "@a@bベホイミン「おお　その町なら\n\t知り合いがいないから　うまく\n\t人生をリセットできそうです。\n@c1@"
"61":
  de: "@aZini@bVielen Dank. Ich verblubber, nicht wieder etwas Schleimes zu manschen. Bis dann! Rülps!\n@c1@"
  en: "@aMary Curey@bThank goo very much. I'll try not to goo anything bad again. See you next slime!\nBurp!\n@c1@"
  es: "@aMari Curi@bMuchas gracias. Intentaré no volver a portarme mal. ¡Nos vemos pronto!\n¡Burp!\n@c1@"
  fr: "@aMédée Médoc@bMerci beaucoup. J'essaierai de ne pluuus me conduire aussi maaal. À bientôtⓠ\nBeurpⓠ\n@c1@"
  it: "@aDolores Tecuro@bGrazie. Cercherò di non ficcarmi più negli slurpasticci. Alla prossima! Burp!\n@c1@"
  ja: "@a@bベホイミン「ありがとうごぜえます。\n\tもうヘマをしないよう　気をつけます。\n\tでは　さらばっ！　ひっく。\n@c1@"
"62":
  de: "@a@b*: Na so was. So zu tun, als würde man ein neues Leben anfangen wollen, bloß um aus dem Knast zu kommen und weiter Verbrechen zu begehen. Hmpf.\n@c1@"
  en: "@a@b*: Fancy that, pretendin' ye're wantin' tae go off and start a new life, just so's ye can get oot o' jail and go off on another crime spree. Hmph.\n@c1@"
  es: "@a@b*: ¡Qué desfachatez!, pretender querer iniciar una nueva vida, solo para conseguir salir de la cárcel y emprender una nueva oleada de crímenes. Umf.\n@c1@"
  fr: "@a@b*ⓢ Ben voyons. On prétend vouloir commencer une nouvelle vie juste pour pouvoir sortir de prison et recommencer ses crimes. Mmpf.\n@c1@"
  it: "@a@b*: Quella là?! Quella è una criminala con i calli! Ha diciuto che vuole cambiare vita, ma ora che è libbera, tornerà ad arrubbare come apprima!\n@c1@"
  ja: "@a@b＊「移民にかこつけて　脱獄とは\n\tしょうもねえ野郎だな。\n@c1@"
"63":
  de: "@a@b*: Schleime und unschuldig, da blubbern ja die Hühner.\n@c1@"
  en: "@a@b*: Och, but there's no such thing as a victimless slime, ye ken. Ah'll be in all kinds of trouble for this.\n@c1@"
  es: "@a@b*: Recórcholis, no existen limos inocentes, ¿%H860%Xsabe%Ysaben%Z? Y ahora voy a tener muchos problemas por esto.\n@c1@"
  fr: "@a@b*ⓢ Il n'y a rien de pire qu'un gluant sans victime, vous savez. Vous risquez d'avoir plein d'ennuis.\n@c1@"
  it: "@a@b*: Non ci esistono gli Slime innocenti, %H860%Xte%Yve%Z lo addico io! Adesso %H860%Xvedrai%Yvedrete%Z che cosa accombinerà!\n@c1@"
  ja: "@a@b＊「ん？　待てよ！？\n\tベホイミンが　移民……おおっ！\n@c1@"
"64":
  de: "@a@b*: Sind ganz schön schlüpfrige Gesellen. Aber so was kann passieren. Wahrscheinlich ist das so wie eine geschleime Verblubberorganisation.\n@c1@"
  en: "@a@b*: They're slippery customers, though. This has happened slime after slime. Mebbe they're helping each other oot, ye ken, like organised slime.\n@c1@"
  es: "@a@b*: Son de lo más escurridizos. Siempre pasa lo mismo con los limos. Quizás se ayuden entre ellos, ya %H860%Xsabe%Ysaben%Z, una especie de hampa de limos organizados.\n@c1@"
  fr: "@a@b*ⓢ Ils vous glissent entre les doigts comme de rien. Tous les mêmes. Peut-être qu'ils s'entraident les uns les autres, une sorte de ⓥgluanta nostraⓦ organisée.\n@c1@"
  it: "@a@b*: Gli Slime sono criature piriculose! Sono viscidi, infidi e rancidi! Quelli vogliono blobbizzarci tutti quanti!\n@c1@"
  ja: "@a@b＊「これぞ　まさに　ベホ移民！\n@c1@"
"65":
  de: "@aZini@bTja, da werd ich wohl einfach hier bleiben und den ekligen Mansch essen müssen, den sie mir geben, bis es Schleim ist, mich rauszulassen. Rrrülps...\n@c1@"
  en: "@aMary Curey@bWell, I suppose I'll just have to stay here and goo on eating the horrible food they give me until such slime as they choose to let me out. Brrrrrp...\n@c1@"
  es: "@aMari Curi@bVaya, imagino que me tendré que quedar aquí y comer esta horrible comida que me dan hasta que les salga de los lodos dejarme ir. Burrrrrp...\n@c1@"
  fr: "@aMédée Médoc@bAlors je vais devoir rester iciii et continuer à manger les plats immondes qu'ils me servent jusqu'à ce qu'ils me laissent enfin sortiiir. Beurrrrrp...\n@c1@"
  it: "@aDolores Tecuro@bOh... Dovrò rassegnarmi a stare qui, mangiando quello slurpoco che mi danno, in attesa che mi facciano slimescire di galera. Buuurp!\n@c1@"
  ja: "@a@bベホイミン「オレは　許しが出るまで\n\tここで　もうしばらく　くさい飯を\n\t食ってることにします　ひっく！\n@c1@"
"66":
  de: "@a@b*: Die da in der Zelle? Und wenn sie noch so niedlich und unschuldig aussieht, aber Zechprellerei wird hier gar nicht gern gesehen.\n@c2@"
  en: "@a@b*: That one in the cell? She may seem sweet an' innocent enough tae yerself, but the crime o' eatin' and runnin's no looked on too kindly 'round here.\n@c2@"
  es: "@a@b*: ¿La de esa celda? Puede que %H860%Xle%Yles%Z parezca dulce e inocente, pero el crimen de marcharse sin pagar no se considera precisamente inocente por estos lares.\n@c2@"
  fr: "@a@b*ⓢ Celle-là, dans la celluleⓡ Elle vous paraît peut-être gentille et innocente, mais s'enfuir d'un restaurant sans payer est un crime grave, par ici.\n@c2@"
  it: "@a@b*: Quella là in quella cella là sembra una povera innocenza, ma si è ammacchiata di un reato gravissimo! Ha mangiato e non ha appagato il conto!\n@c2@"
  ja: "@a@b＊「牢に入ってるヤツかい？\n\t食い逃げで　とっつかまったのさ。\n\tまったく　ずうずうしいヤツだよ。\n@c2@"
"67":
  de: "@a@b*: Und lasst Euch nicht einfallen, die Tür zu öffnen und sie rauszulassen, egal, was für eine traurige Geschichte sie Euch vorheult.\n@c2@"
  en: "@a@b*: An' dinnae go openin' that door tae let her oot, no matter whit sob stories she tries tae tug at yer heartstrings wi'.\n@c2@"
  es: "@a@b*: Y no se %H860%Xle%Yles%Z ocurra abrirle la puerta, aunque %H860%Xle%Yles%Z cuente sus penas para ablandarle%H860%X%Ys%Z el corazón.\n@c2@"
  fr: "@a@b*ⓢ Et n'allez pas lui ouvrir la porte pour qu'elle sorte, peu importe les histoires à faire pleurer les pierres qu'elle peut raconter pour vous attendrir.\n@c2@"
  it: "@a@b*: Non %H860%Xfarla%Yfatela%Z uscire per nessun motivo al monte! Non %H860%Xfarti%Yfatevi%Z abbandolare! Quella è una che la mariuoleria ce l'ha nel sangue!\n@c2@"
  ja: "@a@b＊「いくら　かわいそうだからって\n\t牢のトビラを　あけてやろうなんて\n\t思うんじゃないぞ。\n@c2@"
"68":
  de: "@a@b*: Ach, ich kann's Euch nicht verdenken, dass Ihr Zini rausgelassen oder migrieren lassen habt oder wie Ihr das auch nennen wollt.\n@c2@"
  en: "@a@b*: Och, I dinnae blame youse for openin' the door tae let young Mary escape, or migrate, or whatever ye want tae call it.\n@c2@"
  es: "@a@b*: No %H860%Xle%Yles%Z culpo por abrir la puerta y dejar que la joven Mari se escapara, emigrara o como quiera que se llame lo que ha hecho.\n@c2@"
  fr: "@a@b*ⓢ Vous savez, je ne vous blâme pas d'avoir ouvert la porte pour laisser la jeune Médée s'enfuir, ou migrer, appelez ça comme vous voulez.\n@c2@"
  it: "@a@b*: Beh, e mica %H860%Xti%Yvi%Z posso accolpare se %H860%Xhai%Yavete%Z liberalizzato Dolores... \n@c2@"
  ja: "@a@b＊「ベホイミンの脱獄に　手をかした\n\tキミたちを　責めはしないよ。\n\tいや　脱獄でなく移民か。\n@c2@"
"69":
  de: "@a@b*: Es spielt ja auch keine Rolle mehr. Es schien dem jungen Ding ja sehr leidzutun, was sie getan hat. Ich hätte sie sowieso frei gelassen.\n@c2@"
  en: "@a@b*: Well, it doesnae matter anyhoo. The poor wee thing seemed sorry enough for whit she'd done. I was goin' tae let her oot as it was.\n@c2@"
  es: "@a@b*: Supongo que ahora ya no importa. La pobre parecía bastante arrepentida de lo que había hecho. La verdad es que pensaba dejar que se marchara.\n@c2@"
  fr: "@a@b*ⓢ Ça n'a pas d'importance. La pauvre petite avait l'air suffisamment désolée de ce qu'elle avait fait. J'allais la libérer, de toute façon.\n@c2@"
  it: "@a@b*: Dopotutto, aveva scontrato la sua pena. E poi si era pure pentita del suo malfatturato. Per me, può andarsene dove vuole.\n@c2@"
  ja: "@a@b＊「まあ　どっちにしろ　ヤツも\n\tだいぶ反省してたようだし　そろそろ\n\t出してやろうって　思ってたからな。\n@c2@"
