"0":
  de: "@a@b*: He, Ihr da! Habt Ihr schon gehört?\n@c2@"
  en: "@a@b*: You there! Have you heard?\n@c2@"
  es: "@a@b*: ¡Eh, %H860%Xtú%Y%R000%Xvosotras%Yvosotros%Z%Z! ¿Lo %H860%Xhas%Yhabéis%Z oído?\n@c2@"
  fr: "@a@b*ⓢ Hé, vous, làⓠ Vous avez entenduⓡ\n@c2@"
  it: "@a@b*: Ehi, %H860%Xtu! Hai saputo%Yvoi! Avete saputo%Z?\n@c2@"
  ja: "@a@b＊「旅の人！　知ってますか？\n@c2@"
"1":
  de: "@a@b*: Aber ich hab Euch doch noch gar nichts erzählt!\nNa schön, wie Ihr wollt.\n@c2@"
  en: "@a@b*: But I haven't even told you anything yet.\nFine, whatever.\n@c2@"
  es: "@a@b*: Pero si todavía no %H860%Xte%Yos%Z he contado nada.\nBueno, da igual.\n@c2@"
  fr: "@a@b*ⓢ Mais, je ne vous ai encore rien dit.\nEnfin bref.\n@c2@"
  it: "@a@b*: Ma se non %H860%Xti ho ancora detto niente?! Bah! Fa' come ti%Yvi ho ancora detto niente?! Bah! Fate come vi%Z pare...\n@c2@"
  ja: "@a@b＊「……。\n\tまだ　何も　話していないのに。\n\tま　いいか。\n@c2@"
"2":
  de: "@a@b*: Da hatte doch jemand die Kühnheit, dort, wo man in die Stadt kommt, einen Kramladen aufzumachen!\n@c2@"
  en: "@a@b*: Some varmint's had the gall to open an item shop near the entrance to town!\n@c2@"
  es: "@a@b*: ¡Unos trotamundos han tenido el descaro de abrir una tienda junto a la entrada de la ciudad!\n@c2@"
  fr: "@a@b*ⓢ Une femme a eu l'cran d'ouvrir un magasin d'objets près de l'entrée de la villeⓠ\n@c2@"
  it: "@a@b*: Una donna ha aperto una merceria vicino all'ingresso della città!\n@c2@"
  ja: "@a@b＊「なんと　町の　入口近くにも\n\t道具屋が　できたんですよ……！\n@c2@"
"3":
  de: "@a@b*: Ich wollte ihnen mit meiner Erfahrung ein wenig zur Seite stehen, aber die Eigentümerin ist eine knallharte Geschäftsfrau.\n@c2@"
  en: "@a@b*: I tried to give her some advice, from the voice of experience, y'know, but the owner's a real\nhard-headed businesswoman.\n@c2@"
  es: "@a@b*: He intentado aconsejarles, por mis años de experiencia, pero la dueña es una mujer retestaruda.\n@c2@"
  fr: "@a@b*ⓢ J'ai essayé d'lui donner des conseils et d'la faire profiter d'mon expérience, mais elle est sacrément dure en affaires.\n@c2@"
  it: "@a@b*: Ho cercato di darle qualche consiglio utile, ma quella tipa ha la testa più dura di una pietra! Non ha voluto nemmeno ascoltarmi!\n@c2@"
  ja: "@a@b＊「いちおう　せんぱいとして\n\tアドバイスしたりしましたが　なかなか\n\tがんばり屋の女性のようですね。\n@c2@"
"4":
  de: "@aUnke@bHa-püh, ha-püh...\n@c2@"
  en: "@aFrog@bAh-phew, ah-phew...\n@c2@"
  es: "@aRanito@bAh, fiuuu, ah, fiuuu...\n@c2@"
  fr: "@aCrapaud@bRon-pfff, ron-pfff...\n@c2@"
  it: "@aRana@bRonf... Ronf...\n@c2@"
  ja: "@a@bカエル「うつら　うつら……。\n@c2@"
"5":
  de: "@aUnke@b... Hmm? Oh, seid mir gegrüßt, %a00120. Ich hoffe, Ihr seid wohlauf?\n@c2@"
  en: "@aFrog@b...Hmm? Oh, greetings, %a00120, I trust you\nare well?\n@c2@"
  es: "@aRanito@b¿... Umm? Saludos, %a00120, espero que estés bien.\n@c2@"
  fr: "@aCrapaud@b... Mmmⓡ Oh, bonjour %a00120.\nJ'espère que vous vous portez bienⓡ\n@c2@"
  it: "@aRana@bOh, salve%H860%X %a00120! Ti%Y! Vi%Z vedo in gran forma.\n@c2@"
  ja: "@a@bカエル「……やあ　%a00120さん\n\tごきげんよう。\n@c2@"
"6":
  de: "@aUnke@bWenn %a00260 so weit gediehen ist, darf man wohl hoffen, dass sie auch zu ihrer palastartigen Pracht zurückfindet.\n@c2@"
  en: "@aFrog@bIf %a00260 can come this far, it is certainly no fantasy to think that it could one day retain its former palatial form.\n@c2@"
  es: "@aRanito@bSi %a00260 ha llegado tan lejos,\n㈡\n... no resulta descabellado pensar que algún día podrá recobrar su antigua naturaleza palaciega.\n@c2@"
  fr: "@aCrapaud@bSi %a00260 a réussi à prospérer à ce point, il n'est certainement pas irréaliste de penser...\n㈡\n... qu'elle pourrait un jour redevenir une vraie citadelle.\n@c2@"
  it: "@aRana@b%0%a00260 sta crescendo bene. Forse non è un'utopia pensare che un giorno potrà tornare agli antichi fasti, quando era un meraviglioso castello.\n@c2@"
  ja: "@a@bカエル「%a00260も　ここまで\n\t発展すると　お城になるのも\n\t夢じゃない気が　してくるね。\n@c2@"
"7":
  de: "@aUnke@bIch werde tun, was ich kann, um zu helfen, den Einwohnern ihr Leben auf jede nur mögliche Weise zu erleichtern.\n@c2@"
  en: "@aFrog@bAnd I shall certainly do my utmost to help make the citizens' lives easier in any way that I am able.\n@c2@"
  es: "@aRanito@bY sin duda haré todo lo que esté en mi anca para ayudar a los ciudadanos a mejorar su calidad de vida.\n@c2@"
  fr: "@aCrapaud@bEt je ferais bien sûr tout mon possible pour rendre la vie des citoyens plus facile, dans la mesure de mes moyens.\n@c2@"
  it: "@aRana@bPersonalmente, farò tutto ciò che è in mio potere per rendere più liete e felici le vite degli abitanti del luogo.\n@c2@"
  ja: "@a@bカエル「町の住民たちが　もっと\n\t住みやすくなるよう　ボクも\n\tカゲながら　協力するよ。\n@c2@"
"8":
  de: "@aUnke@bAch, übrigens, habt Ihr das Bücherregal in dem Haus im Nordosten der Stadt schon untersucht?\n@c2@"
  en: "@aFrog@bOh, incidentally, have you investigated the bookshelf in the house in the north-east of the town?\n@c2@"
  es: "@aRanito@b¡Oh!, por cierto, ¿%H860%Xhas%Yhabéis%Z investigado la estantería de la casa situada al nordeste de la ciudad?\n@c2@"
  fr: "@aCrapaud@bOh, à propos, avez-vous fouillé l'étagère qui se trouve dans la maison située au nord-est de la villeⓡ\n@c2@"
  it: "@aRana@bOh, quasi dimenticavo... %H860%XHai%YAvete%Z per caso controllato la libreria che si trova nella casa situata nell'area nord-orientale della città?\n@c2@"
  ja: "@a@bカエル「そういえば　この町の\n\t北東の民家にある　本だなは\n\t調べてみたかい？\n@c2@"
"9":
  de: "@aUnke@bIch habe gehört, es soll dort ein Buch über die Legende von der mächtigen Stadt geben, die einst hier gestanden hat.\n@c2@"
  en: "@aFrog@bI have heard tell that there is a book there which details the legend of the mighty city that once stood on this very spot.\n@c2@"
  es: "@aRanito@bHe oído que hay un libro en el que se detalla la leyenda de la poderosa ciudad que se erigía en este preciso lugar.\n@c2@"
  fr: "@aCrapaud@bJ'ai entendu dire qu'elle contenait un livre expliquant dans le détail la légende de la puissante cité qui se dressait autrefois à cet endroit précis.\n@c2@"
  it: "@aRana@bSe non erro, lì è riposto un libro che narra la leggenda della città fortificata che un tempo sorgeva in questa zona.\n@c2@"
  ja: "@a@bカエル「かつて　ここにあった都の伝説が\n\t書かれた本が　あるみたいだね。\n@c2@"
"10":
  de: "@aUnke@bHmm. Ein Ring, der auf dem Feld gefunden worden ist, sagt Ihr?\n@c2@"
  en: "@aFrog@bHmm. A ring found in the fields, you say?\n@c2@"
  es: "@aRanito@bMmm... Un anillo encontrado en el campo, ¿%H860%Xdices%Ydecís%Z?\n@c2@"
  fr: "@aCrapaud@bMmm. Un anneau trouvé dans les champs, vous ditesⓡ\n@c2@"
  it: "@aRana@bCome %H860%Xdici%Ydite%Z? Un anello trovato in un campo? Uhm...\n@c2@"
  ja: "@a@bカエル「ふ～ん　指輪が　畑に\n\t落ちていたのか……。\n@c2@"
"11":
  de: "@aUnke@bNun, es ist gut möglich, dass solche Schätze ans Tageslicht kommen, wenn hier wirklich einmal eine große Stadt gestanden hat.\n@c2@"
  en: "@aFrog@bWell, it is most certainly possible that such treasures would be unearthed if a great city truly did once stand here.\n@c2@"
  es: "@aRanito@bBueno, no es de extrañar que aparezcan tamaños tesoros si realmente aquí se erigía antes una grandiosa ciudad.\n@c2@"
  fr: "@aCrapaud@bEh bien, il est très possible que de tels trésors soient déterrés ici si une grande ville s'y dressait autrefois.\n@c2@"
  it: "@aRana@bDirei che è possibile imbattersi in oggetti del genere, dato che qui, un tempo, c'era una città ricca oltre ogni immaginazione.\n@c2@"
  ja: "@a@bカエル「かつて　ここに　お城が\n\tあったなら　そんなふうに　宝物が\n\t出てくることもあるかも。\n@c2@"
"12":
  de: "@aUnke@bEs könnte gar der Ring sein, den Sultan Eknu, der junge und gut aussehende Herrscher von Pioniria, seiner Geliebten geschenkt haben soll.\n@c2@"
  en: "@aFrog@bWhy, it could even be the ring that Sultan Farog, the young and handsome ruler of Pioniria, is rumoured to have bestowed upon his beloved.\n@c2@"
  es: "@aRanito@bIncluso podría tratarse del anillo que, supuestamente, Rainierito III, el joven y apuesto gobernante de Pioniria, entregó a su amada.\n@c2@"
  fr: "@aCrapaud@bEn fait, il pourrait même s'agir de la bague que le sultan Carapo, le jeune et beau souverain de Pioniria, aurait offerte à sa bien-aimée.\n@c2@"
  it: "@aRana@bPotrebbe essere l'anello che il leggendario Ran Sultan, l'illuminato sovrano di Castromercatum, donò alla sua adorata compagna.\n@c2@"
  ja: "@a@bカエル「その指輪は　もしかしたら\n\tマーリブの若き王さま　レオンが\n\tお妃さまに　あげたものかも知れないよ。\n@c2@"
"13":
  de: "@aUnke@bWenn er in die Hände frisch Vermählter gefallen ist, wäre der Sultan gewisslich über ein so Glück verheißendes Ereignis froh.\n@c2@"
  en: "@aFrog@bIf it has fallen into the hands of young newly-weds, I am sure the Sultan would be more than pleased at such a propitious occurrence.\n@c2@"
  es: "@aRanito@bSi ha ido a parar a manos de unos recién casados, estoy convencido de que el Sultán estará más que satisfecho de tal coincidencia.\n@c2@"
  fr: "@aCrapaud@bSi elle se trouve désormais entre les mains de jeunes mariés, je suis sûr que le sultan serait plus que ravi de cette heureuse coïncidence.\n@c2@"
  it: "@aRana@bSono certo che il Sultano si rallegrerebbe, se l'anello fosse capitato tra le mani di una coppia di giovani sposi. Oh, sì! Sarebbe meraviglioso!\n@c2@"
  ja: "@a@bカエル「幸せな　新婚さんが\n\tもらってくれるなら　きっと\n\tレオン王も　よかったって思うさ。\n@c2@"
"14":
  de: "@aKarl Oink@b%a00260 ist eine mächtig feine Stadt, die schwer im Kommen ist.\n@c2@"
  en: "@aPrelvis Esley@bThis here's the finest little boom town in all the world. Viva %a00260!\n@c2@"
  es: "@aPrelvis Esley@bEsta es la ciudad más boyante del mundo. ¡Viva %a00260!\n@c2@"
  fr: "@aGino Allaydi@bCette petite ville champignon est la plus rock n' roll que j'aie jamais vue.\nVive %a00260ⓠ\n@c2@"
  it: "@aElvis Bresly@bNon sarà Greislend, ma questa è certamente la più entusiasmante città di frontiera che abbia mai visto. Viva %a00260!\n@c2@"
  ja: "@a@bガライ「ここは　すれちがいの町\n\t%a00260。\n@c2@"
"15":
  de: "@aKarl Oink@bÜber diese Stadt erzählt man sich viele Geschichten am Brunnen vor dem Tore und anderswo, wo sich die Menschen treffen.\n@c2@"
  en: "@aPrelvis Esley@bThis here town's a mighty special place. There's all kinds o' tales in the air an' in the ground, an' it's just all shook up with mem'ries an' such.\n@c2@"
  es: "@aPrelvis Esley@bEsta ciudad es un lugar realmente especial. Existen multitud de canciones y ritmos, y el amor está en el aire, yeah, yeah.\n@c2@"
  fr: "@aGino Allaydi@bCette ville est vraiment spéciale. L'air et la terre y sont chargés d'histoire et elle regorge de souvenirs en tous genres.\n@c2@"
  it: "@aElvis Bresly@bQuesto posto è davvero speciale! Ci sono leggende di ogni tipo, in terra e in cielo. Ottimo materiale per scrivere nuove canzoni...\n@c2@"
  ja: "@a@bガライ「物語が　地層と　かさなり\n\tイメージが　きおくと　すれちがう\n\tふしぎな町だよ。\n@c2@"
"16":
  de: "@aKarl Oink@bWollt Ihr eine davon hören? Es ist eine uralte Überlieferung und eine wirklich gute Geschichte. Was sagt Ihr?\n@c2@"
  en: "@aPrelvis Esley@bYou wanna hear one o' the stories? This one come up from way down, but it's a mighty fine fable. Whaddya say?\n@c2@"
  es: "@aPrelvis Esley@b¿%H860%XQuieres%YQueréis%Z escuchar una de esas historias? Se remonta mucho tiempo atrás, %H860%X%A120%Xnene%Z%B120%Xnena%Z%Y%R000%Xnenas%Ynenes%Z%Z, pero es una fábula magnífica, oh yeah. ¿Qué, %H860%Xte%Yos%Z la cuento?\n@c2@"
  fr: "@aGino Allaydi@bVous voulez entendre l'une de ces histoiresⓡ\nElle vient de loin, mais c'est un joli conte.\nVous voulez que je vous la raconteⓡ\n@c2@"
  it: "@aElvis Bresly@bChe ne %H860%Xdici%Ydite%Z di sentire una di queste storie? L'ho appena messa in versi, e presto scriverò anche la musica!\n@c2@"
  ja: "@a@bガライ「少し　長くなるけど\n\t昔がたりを　聞くかい？\n@c2@"
"17":
  de: "@aKarl Oink@bNa dann:\n@c2@"
  en: "@aPrelvis Esley@bWell that's alright then.\nHere goes nothin':\n@c2@"
  es: "@aPrelvis Esley@bDe acuerdo entonces.\nAllá va:\n@c2@"
  fr: "@aGino Allaydi@bBon, entendu.\nVoilà ce qu'elle ditⓢ\n@c2@"
  it: "@aElvis Bresly@bD'accordo, pubblico. E one, e two, e one two three four...\n@c2@"
  ja: "@a@bガライ「それでは……\n\n\tポロロ～ン♪\n@c2@"
"18":
  de: "@a@bⓞVor langer Zeit kam einmal eine Schar Bänkelsänger in die große und berühmte Stadt Pioniria.\n@c2@"
  en: "@a@bⓗOnce upon a time, a troupe of wandering minstrels came to the great and illustrious city of Pioniria.\n@c2@"
  es: "@a@bⓕHace mucho tiempo, un grupo de trovadores errantes llegaron hasta la grande e ilustre ciudad de Pioniria.ⓖ\n@c2@"
  fr: "@a@bⓥIl était une fois un groupe de troubadours itinérants, venus découvrir la grande et illustre cité de Pioniria.\n@c2@"
  it: "@a@bⓕA Castromercatum, tempo fa, arrivaron dei menestrelli erranti...\nEran bravi, eran tanti...\nYeah, baby!ⓖ\n@c2@"
  ja: "@a@b“むかし　むかし……\n　たいそう栄えた　美しい都　マーリブに\n　旅芸人の一座が　やって来ました。\n@c2@"
"19":
  de: "@a@bIn dem Moment, in dem der junge Sultan von Pioniria eine der Maiden aus der Schar erblickte, verliebte er sich Hals über Kopf in sie.\n@c2@"
  en: "@a@bⓗThe moment the young sultan of Pioniria set eyes upon one of the young maidens of the troupe, he fell deeply in love with her.\n@c2@"
  es: "@a@bⓕEn cuanto el joven sultán de Pioniria se fijó en una de las jóvenes nenitas de la expedición, se enamoró perdidamente de ella.ⓖ\n@c2@"
  fr: "@a@bÀ la seconde où le jeune sultan de Pioniria posa les yeux sur l'une des jeunes filles de la troupe, il en tomba éperdument amoureux.\n@c2@"
  it: "@a@bⓕIl giovane Sultano vide tra loro una bella fanciulla\nS'innamorò subito di lei... e non capì più nulla!\nOh, yeah!ⓖ\n@c2@"
  ja: "@a@b“そのころ　王位をついだばかりの　若き王は\n　旅芸人の一座の　美しい娘と\n　恋に落ちてしまったのです。\n@c2@"
"20":
  de: "@a@bDie Wesire des jungen Sultans Eknu waren streng dagegen, dass er unter seinem Stand heiratete.\n@c2@"
  en: "@a@bⓗThe young Sultan Farog's viziers were strongly opposed to his marrying beneath him.\n@c2@"
  es: "@a@bⓕLos visires del joven Rainierito III se oponían radicalmente a este matrimonio ¡oh! ¡no! ¡no! ¡no!ⓖ\n@c2@"
  fr: "@a@bLes vizirs du jeune sultan Carapo étaient violemment opposés à l'idée que le jeune homme épouse une femme de condition inférieure.\n@c2@"
  it: "@a@bⓕA quest'amore si opponevano i ministri di Ran Sultan\nTemendo che ne sarebbe nato un gran can-can!\nI love you, pubblico!ⓖ\n@c2@"
  ja: "@a@b“マーリブのお城の　大臣たちは\n　若き王レオンと　その娘の\n　結婚に　反対しましたが……\n@c2@"
"21":
  de: "@a@bDoch sein Vater, der frühere Sultan, billigte die Ehe, und die Hochzeit fand statt.\n@c2@"
  en: "@a@bⓗBut his father, the previous sultan, approved the match, and the wedding went ahead.\n@c2@"
  es: "@a@bⓕPero su padre, el antiguo sultán, dio su aprobación y se casaron.ⓖ\n@c2@"
  fr: "@a@bMais son père, l'ancien sultan, se montra favorable à cette union et le mariage eut donc lieu.\n@c2@"
  it: "@a@bⓕMa il padre del Sultano era uomo di buon cuore\ne benedisse quell'amore!\nOooh, yeah!ⓖ\n@c2@"
  ja: "@a@b“レオン王の父……　つまり　まえの王さまは\n　こころよく　みとめました。\n@c2@"
"22":
  de: "@a@bEine Ehe zwischen zwei Menschen so unterschiedlicher Herkunft war den Bürgern von Pioniria ein Anstoß, und die Stadt blühte und gedieh.ⓟ\n@c2@"
  en: "@a@bⓗA marriage between two people of such different backgrounds inspired the citizens of Pioniria, and the city grew mighty and prosperous.ⓘ\n@c2@"
  es: "@a@bⓕUn matrimonio entre dos personas de orígenes tan diferentes inspiró a los ciudadanos de Pioniria, y la ciudad creció y prosperó enormemente, oh yeah.ⓖ\n@c2@"
  fr: "@a@bUn mariage entre deux personnes d'origines si différentes inspira les citoyens de Pioniria, et la ville devint puissante et prospère.ⓦ\n@c2@"
  it: "@a@bⓕCosì si gioì del matrimonio tra persone tanto differenti\nE la gente augurò agli sposi di viver contenti!\nSiete un pubblico meraviglioso!ⓖ\n@c2@"
  ja: "@a@b“身分ちがいの結婚は　マーリブに暮らす\n　人びとに夢をあたえ　都は\n　ますます　栄えたとさ。\n@c2@"
"23":
  de: "@aKarl Oink@bNa schön, wie Ihr wollt. Mir ist das gleich. Kommt vorbei, wenn Ihr Eure Meinung ändert.\n@c0@"
  en: "@aPrelvis Esley@bWell alright, then, baby, I don't care.\nYou come by now any time you change your mind.\n@c0@"
  es: "@aPrelvis Esley@bPues vale, no pasa nada.\n%H860%XPuedes%YPodéis%Z volver cuando %H860%Xcambies%Ycambiéis%Z de opinión.\n@c0@"
  fr: "@aGino Allaydi@bTrès bien, %A120%Xfrangin%Z%B120%Xfrangine%Z. Ça m'est égal. Revenez me voir quand vous voulez si vous changez d'avis.\n@c0@"
  it: "@aElvis Bresly@bPeggio per %H860%Xte, pubblico! Se cambiassi idea e volessi ascoltare questa canzone, torna da me, e ti%Yvoi, pubblico! Se cambiaste idea e voleste ascoltare questa canzone, tornate da me, e vi%Z farò assistere a uno spettacolo indimenticabile!\n@c0@"
  ja: "@a@bガライ「そうかい。\n\t聞きたくなったら　また　来てくれよ。\n@c0@"
"24":
  de: "@a@b*: Beim Klabautermann, die Leute kommen nur so in die Stadt geströmt ⓚⓛ warum bauen wir nicht eine prima Pionierpension?\n@c2@"
  en: "@a@b*: Arrr, the folks be flockin' to the town now, so we're buildin' us a bootyful Pioneeratorium.\n@c2@"
  es: "@a@b*: Arrr, la ciudad empieza a ir viento en popa a toda vela, por lo que vamos a construir un bonito pioneratorio.\n@c2@"
  fr: "@a@b*ⓢ Grrr, les gens affluent en ville, maintenant, et on se construit un magnifique pionnieratorium.\n@c2@"
  it: "@a@b*: Per tutte le sardine in scatola! Qui in città stanno arrivando persone a frotte, e così abbiamo deciso di costruire una nuova struttura: l'Ostello dei Pionieri.\n@c2@"
  ja: "@a@b＊「住民も　そこそこ増えて来たから\n\tここに　迎ひん館を\n\t建てることになったんだよ。\n@c2@"
"25":
  de: "@a@b*: Eine Pionierpension ist eine Anlaufstelle für Pioniere und andere, die am Ende einer Reise ihre müden Knochen ein wenig ausruhen wollen.\n@c2@"
  en: "@a@b*: A Pioneeratorium's a kind o' port o' call for pioneers and suchlike to come an' rest their weary bones at the end of their voyage.\n@c2@"
  es: "@a@b*: Un pioneratorio es una especie de puerto de escala para los pioneros, para que descansen tras su largo viaje.\n@c2@"
  fr: "@a@b*ⓢ Un pionnieratorium, c'est un peu comme un port d'attache pour les pionniers de tous horizons. Ils peuvent venir s'y reposer à la fin de leur voyage.\n@c2@"
  it: "@a@b*: Si tratta di un luogo in cui i pionieri potranno riposare, una volta giunti alla fine del loro lungo viaggio.\n@c2@"
  ja: "@a@b＊「迎ひん館ってのは　まあ\n\tすれちがい大使やなんかを　もてなす\n\tホテルみたいなもんだな。\n@c2@"
"26":
  de: "@a@b*: Wenn sie dann fertig ist, können Pioniere und Wanderer hier in der Stadt vor Anker gehen!\n@c2@"
  en: "@a@b*: Once she's finished an' all shipshape, we'll be able to welcome all manner o' pioneers an' wanderers to town. Arrr!\n@c2@"
  es: "@a@b*: Cuando esté terminado y en perfecto estado, podremos recibir a todo tipo de pioneros y marineros de agua dulce en la ciudad. ¡Arrr!\n@c2@"
  fr: "@a@b*ⓢ Une fois qu'il sera terminé, luisant comme un bateau neuf, on pourra accueillir toutes sortes de pionniers et de voyageurs en ville. Grrrⓠ\n@c2@"
  it: "@a@b*: Quando l'Ostello dei Pionieri sarà terminato, potremo accogliere nel migliore dei modi tutti i viandanti che arriveranno da noi!\n@c2@"
  ja: "@a@b＊「完成すれば　より多くの大使や\n\t移民たちが　滞在できるように\n\tなるだろうよ！\n@c2@"
