  fr: "@aRocky@bOh, salut %H860%X%A120%Xl'ami%Z%B120%Xl'amie%Z%Yla compagnie%Z. J'vous avais pas %H860%X%A120%Xvu%Z%B120%Xvue%Z%Y%R000%Xvues%Yvus%Z%Z.\n@c2@"
