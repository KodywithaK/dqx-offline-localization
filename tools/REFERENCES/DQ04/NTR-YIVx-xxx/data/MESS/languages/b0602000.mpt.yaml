  ja: "@a@bロッコ「あ！\n\tスミマセン　きづきませんで。\n@c2@"
"36":
  de: "@aRocky@bIch habe Adrian diesen Ring gegeben, den ich gefunden habe, und seither sieht sie mich mit ganz anderen Augen an!\n@c2@"
  en: "@aRocky@bI gave Adrian this ring I found, and she's been givin' me the eye o' the tiger ever since!\n@c2@"
  es: "@aRoque@bLe di a Adriana este anillo que encontré y desde entonces le ha cambiado el humor, ya no me está dando la paliza.\n@c2@"
  fr: "@aRocky@bJ'ai offert à Adrienne une bague que j'ai trouvée, et depuis, elle me fait les yeux doux.\n@c2@"
  it: "@aRocco@bHo dato ad Adriana un anello, e si è calmata subito! Non è più arrabbiata con me!\n@c2@"
