"41":
  de: "@a@bDa ist ein Buch namens ⓞPioniria-Chronikenⓟ. %0%a00120 nimmt es vom Regal und liest einen Abschnitt daraus.\n@c0@"
  en: "@a@bThere's a book called ⓗChronicles of Pioniriaⓘ. %0%a00120 takes it from the shelf and reads\nan excerpt.\n@c0@"
  es: "@a@bHay un libro titulado ⓕLas Crónicas de Pioniriaⓖ. %0%a00120 lo coge de la estantería y lee un fragmento.\n@c0@"
  fr: "@a@bL'un des livres s'intitule ⓥChroniques de Pioniriaⓦ. %0%a00120 le prend sur l'étagère et en lit un passage.\n@c0@"
  it: "@a@bC'è un libro intitolato ⓕCronache di Castromercatumⓖ. %0%a00120 lo prende dallo scaffale e ne legge un brano...\n@c0@"
  ja: "@a@b「マーリブの伝説」と\n書かれた本がある。\n%a00120は　手にとって読んだ。\n@c0@"
"42":
  de: "@a@bⓞWenn die Stadt wieder zur Burg wird, wird sein Körper aus dem Gefäß im südöstlichen Raum wieder auferstehen.\n@c0@"
  en: "@a@bⓗWhen the town once more becomes a castle, his\nbody shall rise again from the pot in the south-western room.\n@c0@"
  es: "@a@bⓕCuando la ciudad sea de nuevo un castillo, su cuerpo volverá a través de la tinaja de la sala sudoriental.ⓖ\n@c0@"
  fr: "@a@bⓥLorsque la ville redeviendra un château, son corps s'élèvera de la jarre située dans la pièce du sud-est.\n@c0@"
  it: "@a@bⓕQuando la città tornerà a essere un castello, il suo corpo sorgerà nuovamente dalla giara che si trova nella sala sud-orientale.ⓖ\n@c0@"
  ja: "@a@b“この町が　城となれば　南西の部屋\n　つぼに　かこまれた　つぼに\n　その者の　カラダは　復活すべし。\n@c0@"
"43":
  de: "@a@bDann wird aus den Tiefen des Schlosses, aus den Tiefen einer Truhe voller Schmerzen, auch sein Herz wiederauferstehen.\n@c0@"
  en: "@a@bⓗThen, from the depths of the castle, from deep within a treasure chest filled with pain, his heart also shall rise.\n@c0@"
  es: "@a@bⓕDespués, en lo más recóndito del castillo, de las profundidades de un cofre del tesoro repleto de dolor, se elevará su corazón.ⓖ\n@c0@"
  fr: "@a@bPuis, des profondeurs du château, des profondeurs d'un coffre au trésor empli de douleur, son cœur s'élèvera lui aussi.\n@c0@"
  it: "@a@bⓕPoi sarà la volta del suo cuore, che emergerà dalle profondità del castello, dagli abissi di un forziere colmo di dolore.ⓖ\n@c0@"
  ja: "@a@b“そして　城のはるか地下　深く\n　痛みをともなう宝箱に\n　その者の　心は　復活するであろう。\n@c0@"
"44":
  de: "@a@bUnd schließlich der größte Schatz der Sultana von Pioniria... die Truhe vor dem Kerker... das Geschenk ihres geliebten Königs.ⓟ\n@c0@"
  en: "@a@bⓗAnd finally, the Sultana of Pioniria's most treasured possession...in a treasure chest locked in a cell...the gift of her beloved king.ⓘ\n@c0@"
  es: "@a@bⓕY finalmente, la posesión más codiciada de la Sultana de Pioniria... el cofre del tesoro en el exterior de la cárcel... el regalo de su amado rey.ⓖ\n@c0@"
  fr: "@a@bEt enfin, le bien le plus précieux de la sultane de Pioniria... le coffre au trésor à l'extérieur de la prison... le cadeau de son bien-aimé roi.ⓦ \n@c0@"
  it: "@a@bⓕInfine toccherà al tesoro più caro alla Sultana di Castromercatum... Fuori dalla prigione, lo scrigno donato dal suo amato sovrano.ⓖ\n@c0@"
  ja: "@a@b“そして　最後に　マーリブ王妃の宝物……\n　ろうやの先の　宝箱。\n　愛しい王の　おくりもの。\n@c0@"
"45":
