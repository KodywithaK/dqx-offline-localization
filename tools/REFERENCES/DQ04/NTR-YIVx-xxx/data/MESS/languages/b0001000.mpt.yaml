  fr: "@a@b*ⓢ Je peux enfin cesser de m'inquiéter et me remettre à enseigner aux enfants.\nMerci de votre aide, soldat.\n@c2@"
  it: "@a@b*: Ora posso smettere di preoccuparmi. Tornerò finalmente a insegnare ai ragazzini. Soldato, ti ringrazio per il tuo aiuto.\n@c2@"
  ja: "@a@b＊「これで安心して　子供たちに\n\t勉強を教えられます。\n\tありがとうございました。\n@c2@"
"69":
  de: "@a@b%0%a00120 untersucht die Wand.\n@c0@"
