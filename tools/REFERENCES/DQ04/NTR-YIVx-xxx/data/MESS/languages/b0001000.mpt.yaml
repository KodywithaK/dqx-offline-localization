"71":
  de: "@a@b*: Wie, was? Unsere Kleinen sind wieder da, sagt Ihr? Ach, das sind ja wunderbare Neuigkeiten!\n@c2@"
  en: "@a@b*: Sorry? Oor bairn's back, ye say!?\nOch, that's wonderful news!\n@c2@"
  es: "@a@b*: ¿Perdón? ¿Dice que nuestro pequeño ha vuelto?\n¡Vaya, qué buena nueva tan magnífica!\n@c2@"
  fr: "@a@b*ⓢ Pardonⓡ Vous dites que nos enfants sont revenusⓠⓑ\nOh, c'est une excellente nouvelleⓠ\n@c2@"
  it: "@a@b*: Cosa? I nostri figli sono a casa sani e salvi? Questa sì che è una grande notizia!\n@c2@"
  ja: "@a@b＊「へ？\n\tうちの子が　帰ってきた！？\n\tあ　ありがとうございました！\n@c2@"
"72":
  de: "@a@b*: Ich bin eine Wandernonne. Ich ziehe durch die Lande, um das Wort der Göttin zu verbreiten.\n@c1@"
  en: "@a@b*: I'm a travelling nun. I journey around the world to spread word of the Goddess.\n@c1@"
  es: "@a@b*: Soy una monja viajera. Viajo por todo el mundo para predicar la palabra de la Diosa.\n@c1@"
  fr: "@a@b*ⓢ Je suis une religieuse itinérante. Je voyage de par le monde pour répandre la parole de la Déesse.\n@c1@"
  it: "@a@b*: Sono una suora errante. Vado per il mondo a diffondere il verbo della dea.\n@c1@"
  ja: "@a@b＊「わたしは　旅の尼。\n\t神のお告げをうけて\n\t旅をしています。\n@c1@"
"73":
  de: "@a@b*: Der Göttin sei Dank! Die verschwundenen Kinder wurden in Sicherheit gebracht. Sie ist wahrlich eine barmherzige Herrin.\n@c1@"
  en: "@a@b*: Praise be! The missing children have been delivered back into safety. She is truly a merciful mistress.\n@c1@"
  es: "@a@b*: ¡Alabada sea la Diosa! Los niños desaparecidos ya están a salvo. En verdad, la Diosa es misercordiosa.\n@c1@"
  fr: "@a@b*ⓢ Sa bonté est infinieⓠ Les enfants disparus sont rentrés chez eux sains et saufs.\n@c1@"
  it: "@a@b*: Sia lodata la dea! I bambini sono tornati sani e salvi! Le nostre preghiere sono state ascoltate!\n@c1@"
  ja: "@a@b＊「やがて　この地のどこかに\n\t神の御心をうけた　若者が\n\t現れることでしょう。\n@c1@"
"74":
  de: "@a@b*: Dieser Kerl, den ich beim Stehlen erwischt hab, ist von seiner Frau nach Burland zurückgebracht worden. Ja, ein Prachtweib war das.\n@c2@"
