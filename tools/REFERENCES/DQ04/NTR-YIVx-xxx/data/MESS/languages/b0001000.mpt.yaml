  fr: "@a@b*ⓢ Na na na na nère-euhⓠ\nTu m'attraperas pasⓠ Tu m'attraperas pasⓠ\n@c1@"
  it: "@a@b*: Na na na na naa!\nNon mi prendi!\nNon mi prendi!\n@c1@"
  ja: "@a@b＊「やだよ～だ！\n\t絶対　つかまんないもんね！\n@c1@"
"64":
  de: "@a@b*: Warte! So warte doch! Verflixt! Kann denn keiner das Mädel zur Vernunft bringen?!\n@c1@"
