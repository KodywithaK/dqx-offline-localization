  fr: "@a@b*ⓢ Le type que j'ai attrapé en train de voler a été ramené à Bastione par sa femme. Un joli brin de fille, d'ailleurs.\n@c2@"
  it: "@a@b*: L'uomo che avevano messo in prigione per furto è stato riportato a Burlandia dalla moglie. Ah, che bella donna che è!\n@c2@"
  ja: "@a@b＊「おいが　とっつかまえた男は\n\t美人の奥さんと　いっしょに\n\t城下町へ　帰ったですたい。\n@c2@"
