"0":
  de: "@a@b*: Das ist die falsche Richtung...\n@c2@"
  en: "@a@b*: You're going the wrong way...\n@c2@"
  es: "@a@b*: Va en la dirección equivocada...\n@c2@"
  fr: "@a@b*ⓢ Vous allez dans la mauvaise direction...\n@c2@"
  it: "@a@b*: %H860%XStai%YState%Z andando dalla parte sbagliata... \n@c2@"
  ja: "@a@b＊「そっちじゃないよ。\n@c2@"
"1":
  de: "@a@b*: Ich heiße Medi (schlürf). Ich bin nur ein Heilschleim, aber eines Tages will ich ein Mensch werden.\n@c1@"
  en: "@a@b*: My name's Healie. (slurp) I'm still just a healslime at the moment, but I'm going to become a human\none day.\n@c1@"
  es: "@a@b*: Me llamo Curi (slurp). Por el momento soy un simple medulimo cicatrizante, pero algún día llegaré a ser humano.\n@c1@"
  fr: "@a@b*ⓢ Je m'appelle Doc (slurp). Pour l'instant, je ne suis qu'un médigluant, mais un jour, je finirai par devenir humain.\n@c1@"
  it: "@a@b*: Io sono Healie! Slurp! Sono un Dottor Slime, ma voglio diventare un essere umano!\n@c1@"
  ja: "@a@b＊「ぼく　ホイミン。\n\tいまは　ホイミスライムなの。\n\tでも　人間になるのが　夢なんだ。\n@c1@"
"2":
  de: "@aMedi@bHe! Vielleicht kann ich ein Mensch werden, wenn ich mit Menschen rumhänge! Kann ich mit dir mitkommen?\n@c1@"
  en: "@aHealie@bHey! Maybe I'll become human if I start hanging out with humans! Can I tag along with you?\n@c1@"
  es: "@aCuri@b¡Eh! ¡Puede que me convierta en humano si me relaciono con humanos! ¿Puedo acompañarte?\n@c1@"
  fr: "@aDoc@bHéⓠ Peut-être que je deviendrai humain si je côtoie d'autres humainsⓠ Est-ce que je peux vous accompagnerⓡ\n@c1@"
  it: "@aHealie@bEhi! Forse potrei davvero diventare un uomo, se iniziassi a frequentare gli umani! Posso venire con te?\n@c1@"
  ja: "@a@bホイミン「ねえ　人間の仲間になったら\n\t人間になれるかなあ……？\n\tそうだ！　ぼくを仲間にしてよっ。\n@c1@"
"3":
  de: "@aMedi@b(Schlürf!) Juchhu! Danke, Soldat!\n@c1@"
  en: "@aHealie@b(slurp) Yippee! Thanks, soldier!\n@c1@"
  es: "@aCuri@b(¡Slurp!) ¡Yupiii! ¡Gracias, soldado!\n@c1@"
  fr: "@aDoc@b(Slurpⓠ) Youpiⓠ Merci, soldatⓠ\n@c1@"
  it: "@aHealie@bSlurp! Evviva! Grazie, soldato!\n@c1@"
  ja: "@a@bホイミン「わーい！　ありがとう！\n@c1@"
"4":
  de: "@a@bMedi schließt sich Ragnar an!\n@c1@"
  en: "@a@bHealie joins Ragnar!\n@c1@"
  es: "@a@bCuri se une a Ragnar.\n@c1@"
  fr: "@a@bDoc rejoint Ragnarⓠ\n@c1@"
  it: "@a@bHealie si unisce a Galiardo!\n@c1@"
  ja: "@a@bホイミンが　仲間にくわわった！\n@c1@"
"5":
  de: "@aMedi@bOoch! Und ich hatte so gehofft, du würdest Ja sagen. Na, wenn du deine Meinung änderst, komm wieder her. Ich werde hier warten... und schlürfen.\n@c1@"
  en: "@aHealie@bOhhh! I was really hoping you'd say yes. Well, if you ever change your mind, then come back here. I'll be waiting...and slurping.\n@c1@"
  es: "@aCuri@b¡Oooh! Realmente esperaba que dijeras que sí. Si cambias de idea, no dudes en volver por aquí. Te estaré esperando... y slurpeando.\n@c1@"
  fr: "@aDoc@bOoohⓠ J'espérais vraiment que vous diriez oui. Bon, si jamais vous changez d'avis, revenez me voir. Je vous attendrai... en faisant des ⓥslurpⓦ.\n@c1@"
  it: "@aHealie@bOh, speravo tanto che mi dicessi di sì... Beh, nel caso tu cambiassi idea, sai dove trovarmi. Io sarò qui, in slurpeggiante attesa.\n@c1@"
  ja: "@a@bホイミン「…うわーん！　ダメなの？\n\tでも　気が変わったら　また来てね。\n\tぼく　ずっと　ここで待ってるから！\n@c1@"
"6":
  de: "@aMedi@bAber nicht vergessen, ja?\n@c1@"
  en: "@aHealie@bDon't forget, okay?\n@c1@"
  es: "@aCuri@bNo lo olvides ¿vale?\n@c1@"
  fr: "@aDoc@bN'oubliez pas, heinⓡ\n@c1@"
  it: "@aHealie@bNon slimenticarlo, d'accordo?\n@c1@"
  ja: "@a@bホイミン「約束だよ。\n@c1@"
"7":
  de: "@a@bRagnar hört eine leise Stimme, die von irgendwoher aus den Tiefen der Höhle kommt, und spitzt die Ohren...\n@c0@"
  en: "@a@bRagnar hears a tiny voice coming from somewhere deep in the cave, and pricks up his ears to listen...\n@c0@"
  es: "@a@bRagnar oye una vocecilla proveniente de las profundidades de la cueva y aguza el oído...\n@c0@"
  fr: "@a@bRagnar entend une petite voix s'élever quelque part au fond de la caverne et tend l'oreille pour l'écouter...\n@c0@"
  it: "@a@bGaliardo sente una flebile voce provenire dalle profondità della caverna, e aguzza le orecchie per ascoltare meglio...\n@c0@"
  ja: "@a@b……洞くつの　どこかから\n小さな声が聞こえる……。\nライアンは　耳をすませた。\n@c0@"
"8":
  de: "@a@b*: Hallo? Ist da jemand? Bitte komm und such mich. Matsch schon, nimm mich mit! Zieh nicht ohne mich los! (Schlürf)\n@c2@"
  en: "@a@b*: Hello? Is there somebody there? Please come and find me. You have to take me with you! Don't goo without me! (slurp)\n@c2@"
  es: "@a@b*: ¡Hola! ¿Hay alguien ahí? Tienes que encontrarme. ¡Tienes que llevarme conlimo! ¡No te vayas sin mí! (slurp)\n@c2@"
  fr: "@a@b*ⓢ Hé hoⓡ Il y a quelqu'unⓡ S'il vous plaît, venez me chercher. Il faut m'emmener avec vousⓠ Ne partez pas sans moiⓠ (slurp)\n@c2@"
  it: "@a@b*: Ehi? C'è nessuno? Per favore, venite a slurprendermi! Portatemi con voi! Non andate via slimenza di me!\n@c2@"
  ja: "@a@b＊「だれか　だれか　いるの？\n\tボクを見つけて……\n\tボクも　連れて行ってほしいな……。\n@c2@"
"9":
  de: "@aMedi@bHey! Das sind dieselben Schlabber, äh, Schlappen wie die, welche diese Kinder gefunden haben, als sie neulich hier unten waren.\n@c1@"
  en: "@aHealie@bHey! Those shoes are the same as the ones those children found when they were down here that slime.\n@c1@"
  es: "@aCuri@b¡Eh! Esos limosos zapatos son los mismos que encontraron aquellos niños cuando estuvieron aquí abajo.\n@c1@"
  fr: "@aDoc@bHéⓠ Ces chaussures sont les mêmes que celles que les enfants ont trouvées quand ils étaient là, l'autre fois.\n@c1@"
  it: "@aHealie@bEhi! Ma quelle scarpe sono slimuguali a quelle che i bambini trovarono quando vennero quaggiù!\n@c1@"
  ja: "@a@bホイミン「あ！　そのクツっ！\n\tこどもたちが　見つけたのと\n\tおなじものだね！\n@c1@"
"10":
  de: "@aMedi@bSie haben geschleimt, äh, gemeint, dass man, wenn man sie draußen benutzt, damit in den Himmel hoch fliegen kann. Hört sich spaßig an!\n@c1@"
  en: "@aHealie@bThey said that if you goo outside and use them, you goo flying off into the sky. It sounded really fun!\n@c1@"
  es: "@aCuri@bCuentan las lenguas de doble limo que si se usan en el exterior se puede volar. ¡Tiene pinta de ser la lima!\n@c1@"
  fr: "@aDoc@bIls ont dit que si on allait les utiliser à l'extérieur, on pouvait s'envoler. Ça avait l'air très amusantⓠ\n@c1@"
  it: "@aHealie@bPare che, se si va all'esterno e le si usa, si slurpossa volare fino in cielo! Che cosa favoloslime!\n@c1@"
  ja: "@a@bホイミン「そとに出て　つかうと\n\tおそらをとべるかもって\n\tたのしそうに　言っていたよ！\n@c1@"
"11":
  de: "@aMedi@bOh, du hast Schuhe gefunden? Das sind dieselben Schlabber, äh, Schlappen wie die, die diese Kinder gefunden haben, als sie neulich hier unten waren.\n@c1@"
  en: "@aHealie@bOh, you've found some shoes, have you? They're the same as the ones those children found when they were down here that slime.\n@c1@"
  es: "@aCuri@b¡Oh!, has encontrado unos limosos zapatos ¿no? Son los mismos que encontraron aquellos niños cuando estuvieron aquí abajo.\n@c1@"
  fr: "@aDoc@bOh, vous avez trouvé des chaussures, on dirait. Ce sont les mêmes que celles que les enfants ont trouvées quand ils étaient là, l'autre fois.\n@c1@"
  it: "@aHealie@bOh, hai trovato delle scarpe? Sono slimuguali a quelle che i bambini trovarono quando vennero quaggiù.\n@c1@"
  ja: "@a@bホイミン「あ！　クツを見つけたの？\n\tこどもたちが　見つけたのと\n\tおなじものだね！\n@c1@"
"12":
  de: "@aMedi@bSie haben geschleimt, äh, gemeint, dass man, wenn man sie draußen benutzt, damit in den Himmel hoch fliegen kann. Hört sich spaßig an!\n@c1@"
  en: "@aHealie@bThey said that if you goo outside and use them, you goo flying off into the sky. It sounded really fun!\n@c1@"
  es: "@aCuri@bCuentan las lenguas de doble limo que si se usan en el exterior se puede volar. ¡Tiene pinta de ser la lima!\n@c1@"
  fr: "@aDoc@bIls ont dit que si on allait les utiliser à l'extérieur, on pouvait s'envoler. Ça avait l'air très amusantⓠ\n@c1@"
  it: "@aHealie@bPare che, se si va all'esterno e le si usa, si slurpossa volare fino in cielo! Che cosa favoloslime!\n@c1@"
  ja: "@a@bホイミン「そとに出て　つかうと\n\tおそらをとべるかもって\n\tたのしそうに　言っていたよ！\n@c1@"
"13":
  de: "@aMedi@bWeißt du, ich hab so das Gefühl, dass in dieser Höhle noch was Wichtiges verborgen liegt. Du solltest schleimigst danach suchen.\n@c1@"
  en: "@aHealie@bYou know, I've got a feeling there's something important still to be found in this cave. You just\nhave to slurp hard enough.\n@c1@"
  es: "@aCuri@b¿Sabes? Tengo la sensación de que todavía queda algo importante que descubrir en esta cueva. Solo hay que andar con los limos bien abiertos.\n@c1@"
  fr: "@aDoc@bVous savez, j'ai l'impression qu'il y a encore quelque chose d'important à découvrir dans cette caverne. Il faut juste chercher un peu mieux.\n@c1@"
  it: "@aHealie@bHo la slimsazione che in questa grotta ci sia ancora qualcosa di slimportante... Ma dovrai slurpimpegnarti molto, se vorrai trovarla!\n@c1@"
  ja: "@a@bホイミン「この　どうくつには\n\tきっと　まだ　なにかあるよ。\n@c1@"
"14":
  de: "@aMedi@bVielleicht könnte ich ja mitkommen und dir bei der Suche helfen. Das wär doch toll, oder? Wär das nicht echt sabberspitze?\n@c1@"
  en: "@aHealie@bMaybe I could goo with you and help you look.\nThat would be good, wouldn't it? Wouldn't that\nbe gooreat?\n@c1@"
  es: "@aCuri@bQuizás pudiera acompañarte y ayudarte a echar un ojo. Eso sería genial ¿verdad? ¿A que sería la lima?\n@c1@"
  fr: "@aDoc@bJe pourrais peut-être vous accompagner pour vous aider à chercher. Ça ne vous paraît pas super-gluant, comme idéeⓡ\n@c1@"
  it: "@aHealie@bForse slurpotrei venire con te e aiutarti a cercarla? Mi slurpare una buona slimedea, no?\n@c1@"
  ja: "@a@bホイミン「さがすのを　ボクも\n\tおてつだいできると　いいなあ……。\n@c1@"
"15":
  de: "@a@b*: Komm schon, du Gör!\n@c2@"
  en: "@a@b*: Come on, you little brat!\n@c2@"
  es: "@a@b*: ¡Vamos, gamberro!\n@c2@"
  fr: "@a@b*ⓢ Viens ici, sale morveuxⓠ\n@c2@"
  it: "@a@b*: Vieni qui, piccola peste!\n@c2@"
  ja: "@a@b＊「さあ　来るんだ！　小僧！\n@c2@"
"16":
  de: "@a@b*: Waah! Ich hab Angst! Lass mich los!\n@c2@"
  en: "@a@b*: Waah! Ye're scary! Let me go!\n@c2@"
  es: "@a@b*: ¡Aaah! ¡Qué miedo! ¡Suélteme!\n@c2@"
  fr: "@a@b*ⓢ Ouinⓠ Tu me fais peurⓠ Laisse-moi partirⓠ\n@c2@"
  it: "@a@b*: Aaah! Ho paura! Lasciami andare!\n@c2@"
  ja: "@a@b＊「え～ん　こわいよ～！\n\tはなしてよお……。\n@c2@"
"17":
  de: "@a@b*: Ach, Tag, Ragnar. Ich bin hier gelandet, als ich auf diesen alten Brunnen stieß.\n@c3@"
  en: "@a@b*: Ach, hello there, Ragnar. I ended up here after I came across that auld well.\n@c3@"
  es: "@a@b*: Mis saludos, Ragnar. Llegué hasta aquí tras atravesar ese pozuelo.\n@c3@"
  fr: "@a@b*ⓢ Ah, bonjour, Ragnar. J'ai atterri ici après avoir découvert ce vieux puits.\n@c3@"
  it: "@a@b*: Ehi, Galiardo! Come va? Sono finito quassù dopo essere passato dal vecchio pozzo.\n@c3@"
  ja: "@a@b＊「おお　ライアンじゃないか！？\n\t私も　あの古井戸を　ぐうぜんに\n\t見つけて　ここまで来たのだが……。\n@c3@"
"18":
  de: "@a@b*: Die Ungeheuer hier im Turm sind so stark wie nur was!\n@c3@"
  en: "@a@b*: The monsters in this tur are as strong as ye like!\n@c3@"
  es: "@a@b*: ¡Los monstruos de esta torre son realmente poderosos!\n@c3@"
  fr: "@a@b*ⓢ Les monstres de cette tour sont forts, comme vous les aimezⓠ\n@c3@"
  it: "@a@b*: I mostri che vivono in questa torre sono incredibilmente forti!\n@c3@"
  ja: "@a@b＊「この塔の　魔物たちは\n\tとても手ごわい！\n@c3@"
"19":
  de: "@a@b*: Ich wünschte, ich hätte diesen Medi-Dingsbums aus dem Brunnen mitkommen lassen.\n@c3@"
  en: "@a@b*: Now I'm wishin' I'd let that Healie character I met in the well tag along wi' me.\n@c3@"
  es: "@a@b*: Ahora me arrepiento de no haber dejado que me acompañara ese tal Curi con quien me topé en el pozuelo.\n@c3@"
  fr: "@a@b*ⓢ À présent, je regrette de n'avoir pas laissé ce Doc, que j'ai rencontré dans le puits, m'accompagner.\n@c3@"
  it: "@a@b*: Oh, quanto vorrei aver detto di sì a quel Dottor Slime che si era offerto di venire con me!\n@c3@"
  ja: "@a@b＊「こんなことなら　古井戸にいた\n\tホイミンとかいう魔物を\n\t仲間にしてやるんだったな……。\n@c3@"
"20":
  de: "@a@b*: Ach ⓚⓛ ist er das nicht, da bei dir? Hast du ein Schwein, Ragnar Rauhbein.\n@c3@"
  en: "@a@b*: Och! That's him there wi' ye now, is it no? Ye're a lucky man, Ragnar McRyan.\n@c3@"
  es: "@a@b*: ¡Cáspita! ¿No es precisamente ese que le acompaña? Es un hombre muy afortunado, Ragnar McRyan.\n@c3@"
  fr: "@a@b*ⓢ Ohⓠ Mais c'est lui qui vous accompagne, nonⓡ Vous avez une sacrée veine, Ragnar McRyan.\n@c3@"
  it: "@a@b*: Oh, ma... Sbaglio, o adesso è con te?! Galiardo de' Guglielmi, sei proprio un uomo fortunato!\n@c3@"
  ja: "@a@b＊「ややっ　お前のうしろにいるのは\n\tホイミンじゃないかっ！\n\tまったく　お前が　うらやましいよ。\n@c3@"
"21":
  de: "@a@b*: R-Ragnar... Mir bleibt nicht mehr viel Zeit. Ich muss dir etwas sagen.\n@c3@"
  en: "@a@b*: R-Ragnar... I dinnae hae much time left. There's somethin' I need tae tell ye.\n@c3@"
  es: "@a@b*: R-Ragnar... No me queda mucho tiempo. Hay algo que querría contarle.\n@c3@"
  fr: "@a@b*ⓢ Ra-Ragnar... Il ne me reste que peu de temps. Je dois vous dire quelque chose.\n@c3@"
  it: "@a@b*: Galiardo... Non mi resta molto tempo... C'è una cosa che devo dirti... \n@c3@"
  ja: "@a@b＊「ラ　ライアンか……。\n\t私は　もうダメだ。\n\tいいか　よく聞け……。\n@c3@"
"22":
  de: "@a@b*: Irgendwo in der Welt erwacht bereits der Herr der Unterwelt.\n@c3@"
  en: "@a@b*: Somewhere in the world, the Lord o' the Underworld is reawakenin'.\n@c3@"
  es: "@a@b*: En algún rincón del mundo, el Señor del Inframundo está despertando de nuevo.\n@c3@"
  fr: "@a@b*ⓢ Quelque part dans le monde, le Seigneur des Enfers est en train de se réveiller.\n@c3@"
  it: "@a@b*: In un luogo sconosciuto del nostro mondo... il Signore degli Inferi... si sta risvegliando... \n@c3@"
  ja: "@a@b＊「世界のどこかで　地獄の帝王が\n\t復活しつつあるらしい。\n@c3@"
"23":
  de: "@a@b*: Aber wenn es stimmt, was die Ungeheuer sagen, gibt es irgendwo da draußen einen Helden, der ihm die Stirn bieten kann.\n@c3@"
  en: "@a@b*: But if whit the monsters say is true, there's also a hero somewhere oot there who'll be able tae take him on.\n@c3@"
  es: "@a@b*: Pero si lo que cuentan los monstruos es cierto, también existe un héroe en alguna parte capaz de acabar con él.\n@c3@"
  fr: "@a@b*ⓢ Mais si ce que disent les monstres est vrai, il existe aussi un héros qui sera capable de le vaincre.\n@c3@"
  it: "@a@b*: Ma se quello che dicono i mostri è vero, esiste un eroe che può affrontarlo e sconfiggerlo... \n@c3@"
  ja: "@a@b＊「しかし　魔物たちの予言では\n\t帝王を滅ぼす　勇者も　また\n\t育ちつつあるらしいのだ。\n@c3@"
"24":
  de: "@a@b*: Wenn sie ihn finden, solange er noch ein Kind ist, wird er zu schwach sein, um sich selbst zu verteidigen.\n@c3@"
  en: "@a@b*: If they find him while he's still a bairn, he willnae be strong enough tae defend himself.\n@c3@"
  es: "@a@b*: Si dan con él mientras todavía es un chiquillo, será incapaz de defenderse.\n@c3@"
  fr: "@a@b*ⓢ Si les monstres le trouvent alors que ce n'est encore qu'un enfant, il ne sera pas assez fort pour se défendre.\n@c3@"
  it: "@a@b*: Se lo troveranno quando sarà ancora un ragazzo, non sarà in grado di difendersi... \n@c3@"
  ja: "@a@b＊「そこで　勇者が　まだチカラをつけぬ\n\t子供のうちに　見つけ出し\n\t闇にほうむりさる。\n@c3@"
"25":
  de: "@a@b*: Und genau darauf haben sie's abgesehen! Also musst du die Kinder beschützen, Ragnar. Lass nicht zu, dass ihnen etwas zustößt!\n@c3@"
  en: "@a@b*: That's whit they're plottin'! So ye must protect our kiddies, Ragnar. Dinnae let them come tae any harm!\n@c3@"
  es: "@a@b*: ¡Eso, precisamente, es lo que están tramando! Debe proteger a nuestros vástagos, Ragnar. ¡No permita que les hagan daño alguno!\n@c3@"
  fr: "@a@b*ⓢ Voilà ce qu'ils mijotentⓠ Vous devez protéger nos enfants, Ragnar. Ne les laissez pas leur faire de malⓠ\n@c3@"
  it: "@a@b*: È questo il loro piano, Galiardo! Devi proteggere i nostri figli! Non lasciare che quei mostri facciano loro del male!\n@c3@"
  ja: "@a@b＊「それが　魔物どものねらいだ。\n\tライアン！　子供たちをっ\n\t子供たちを守ってくれ……！\n@c3@"
"26":
  de: "@a@bAm Eingang der Heilquelle wacht die Statue eines Kriegers.\n@c0@"
  en: "@a@bA statue of a warrior stands guard at the healing spring.\n@c0@"
  es: "@a@bLa estatua de un guerrero monta guardia junto al manantial curativo. \n@c0@"
  fr: "@a@bLa statue d'un guerrier protège la source de guérison.\n@c0@"
  it: "@a@bLa statua di un guerriero protegge la fonte della guarigione.\n@c0@"
  ja: "@a@b回復の泉を守護する　戦士の像だ。\n@c0@"
"27":
  de: "@aPeterchen@bWaah! Hilfe! Hilfe! Ich hab Angst!\n@c1@"
  en: "@aWilly Wally@bWaah! Help! Help! I'm scared!\n@c1@"
  es: "@aPelayo@b¡Aaah! ¡Auxilio! ¡Auxilio! ¡Tengo miedo!\n@c1@"
  fr: "@aHugues Esclin@bOuinⓠ À l'aideⓠ Au secoursⓠ J'ai peurⓠ\n@c1@"
  it: "@aGiacomino@bAaaahhh! Aiuto! Aiutatemi! Ho paura!\n@c1@"
  ja: "@a@b＊「えーん　えーん。\n\tたすけてー　こわいよう。\n@c1@"
"28":
  de: "@aPeterchen@bHilfe, Herr!\n@c1@"
  en: "@aWilly Wally@bHelp me, Mister!\n@c1@"
  es: "@aPelayo@b¡Ayúdeme, señor!\n@c1@"
  fr: "@aHugues Esclin@bAidez-moi, M'sieurⓠ\n@c1@"
  it: "@aGiacomino@bAiutami, signore!\n@c1@"
  ja: "@a@b＊「おじちゃん　たすけてよ！\n@c1@"
"29":
  de: "@aPeterchen@bHelft mir, bitte! Diese scheußlichen Ungeheuer sind gemein zu mir und wollen wissen, ob ich ein Held oder so bin.\n@c1@"
  en: "@aWilly Wally@bHelp, Mister! These horrible monsters are bullyin' me an' askin' if I'm some kind o' hero.\n@c1@"
  es: "@aPelayo@b¡Auxilio, señor! Estos horribles monstruos me torturan y no cesan de preguntarme si soy un héroe o algo similar.\n@c1@"
  fr: "@aHugues Esclin@bAu secours, M'sieurⓠ Ces horribles monstres n'arrêtent pas de m'embêter et de me demander si je suis une sorte de héros.\n@c1@"
  it: "@aGiacomino@bAiutami, signore! Quei brutti mostri mi vogliono fare del male! Pensano che io sia una specie di eroe!\n@c1@"
  ja: "@a@b＊「おじちゃん　たすけて！\n\tこいつら　ぼくのこと\n\t勇者だろうって　いじめるんだ。\n@c1@"
"30":
  de: "@a@b*: Hah! Seh ich recht? Hat es doch tatsächlich ein törichter Mensch bis hierher geschafft.\n@c2@"
  en: "@a@b*: Hah! I can hardly believe my eye! A foolish human has managed to fight his way here.\n@c2@"
  es: "@a@b*: ¡Ja! ¡No puedo creer lo que ven mis ojos! Un necio humano ha conseguido llegar hasta aquí.\n@c2@"
  fr: "@a@b*ⓢ Ha haⓠ Je n'en crois pas mon œilⓠ Un imbécile d'humain a réussi à se frayer un chemin jusqu'ici.\n@c2@"
  it: "@a@b*: Hah! Non riesco a credere ai miei occhi! Un misero essere umano è riuscito a presentarsi al mio cospetto!\n@c2@"
  ja: "@a@b＊「ふんっ　ご苦労なことだな！\n\tやっと　ここを\n\tつきとめたということか……。\n@c2@"
"31":
  de: "@a@b*: Aber die Mühe war vergebens! Ich habe Augen wie ein Adler. Solange ich hier bin, bringt niemand die Kinder hier raus.\n@c2@"
  en: "@a@b*: But you had a wasted journey. I've got an eye like a hawk. You'll never sneak the kid out of here with me around.\n@c2@"
  es: "@a@b*: Pero tu viaje ha sido en vano. Tengo una vista de lince. No conseguirás escapar con el niño en mi presencia.\n@c2@"
  fr: "@a@b*ⓢ Mais tu as perdu ton temps. J'ai un œil de lynx. Tu ne pourras jamais sortir le gamin d'ici tant que je serai dans les parages.\n@c2@"
  it: "@a@b*: Hai fatto male a venire fin qui! Nulla sfugge al mio occhio, e non riuscirai mai a portarmi via il bambino!\n@c2@"
  ja: "@a@b＊「だが　子供を返すわけには\n\tいかぬぞ。\n@c2@"
"32":
  de: "@a@b*: Aah! Das Ungeheuer frisst Peterchen auf!\n@c1@"
  en: "@a@b*: Aargh! Willy Wally's gaein' tae be gobbled up by the monsters!\n@c1@"
  es: "@a@b*: ¡Aargh! ¡Los monstruos van a engullir a Pelayo!\n@c1@"
  fr: "@a@b*ⓢ Aaahⓠ Hugues Esclin va se faire avaler par les monstresⓠ\n@c1@"
  it: "@a@b*: Argh! I mostri stanno per mangiarsi il povero Giacomino!\n@c1@"
  ja: "@a@b＊「うわーん！　うわーん！\n\tププルが…ププルが　バケモノに\n\t食べられちゃうよ。\n@c1@"
"33":
  de: "@a@b*: Ihr müsst ihn retten, Soldat!\n@c1@"
  en: "@a@b*: Ye must save him, Mister!\n@c1@"
  es: "@a@b*: ¡Señor, debe salvarle!\n@c1@"
  fr: "@a@b*ⓢ Vous devez le sauver, M'sieurⓠ\n@c1@"
  it: "@a@b*: Dobbiamo salvarlo, signore!\n@c1@"
  ja: "@a@b＊「おじちゃん　ププルを助けてよう！\n@c1@"
"34":
  de: "@a@b*: Wir wollen nur die Kinder. Dieser lästige Held soll ja ein Kind sein. Erwachsene können uns nicht schaden.\n@c2@"
  en: "@a@b*: We are only interested in children. It is a child who will become the meddlesome hero.\nFully grown humans are of no consequence.\n@c2@"
  es: "@a@b*: Solo nos interesan los niños. Es un niño el que se convertirá en ese héroe metomentodo.\nLos humanos adultos carecen de todo interés.\n@c2@"
  fr: "@a@b*ⓢ Nous ne nous intéressons qu'aux enfants. C'est un enfant qui deviendra ce héros trouble-fête. Les humains adultes n'ont aucune importance.\n@c2@"
  it: "@a@b*: A noi interessano solo i bambini. Sarà un ragazzino a diventare l'eroe invincibile! Gli adulti non possono farci nulla.\n@c2@"
  ja: "@a@b＊「われらの目当ては　子供のみ。\n\t勇者になる可能性のある　子供のみだ！\n\tおとなになぞ　用はない。\n@c2@"
"35":
  de: "@a@b*: Aber wir können dich natürlich nicht mehr lebend hier rauslassen. Jetzt, wo du unser Versteck gefunden hast. Mach dich bereit zu sterben, Soldat!\n@c2@"
  en: "@a@b*: But, of course, we cannot possibly let you out of here alive. Not now you've discovered our secret location. Prepare to die, soldier!\n@c2@"
  es: "@a@b*: Pero, es evidente que no podemos dejarte ir con vida, y menos ahora que has descubierto nuestra guarida. ¡Prepárate a morir, soldado!\n@c2@"
  fr: "@a@b*ⓢ Mais il va de soi que nous ne pouvons pas te laisser sortir d'ici en vie. Pas maintenant que tu connais notre cachette secrète.\n㈡\n*ⓢ Prépare-toi à mourir, soldatⓠ\n@c2@"
  it: "@a@b*: Tuttavia, non possiamo lasciarti uscire vivo da qui. Hai scoperto il nostro nascondiglio segreto... Preparati a morire, soldato!\n@c2@"
  ja: "@a@b＊「だが　ここを知られたからには\n\t生かして帰すわけには　いかん。\n\t死んでもらうぞ　戦士よ！\n@c2@"
"36":
  de: "@a@b*: Wie konnte mich ein bloßer Mensch besiegen...?!\n@c2@"
  en: "@a@b*: How can I have allowed a mere human to defeat me...!?\n@c2@"
  es: "@a@b*: ¿Cómo es posible que un simple humano me haya derrotado...?\n@c2@"
  fr: "@a@b*ⓢ Comment ai-je pu laisser un simple humain me vaincre...ⓠⓑ\n@c2@"
  it: "@a@b*: Com'è possibile che io sia stato sconfitto da un miserabile umano?!\n@c2@"
  ja: "@a@b＊「人間ごときに　やぶれるとは……。\n@c2@"
"37":
  de: "@a@b*: Aber keine Sorge. Die anderen werden den Helden schon finden und aus dem Weg räumen, bevor er uns was anhaben kann.\n@c2@"
  en: "@a@b*: But I am not afraid. The other monsters will find the hero and suck his breath from him before he can stand in our way.\n@c2@"
  es: "@a@b*: Sin embargo, no hay nada que temer. Los demás monstruos encontrarán al héroe y acabarán con su vida antes de que se interponga en nuestro camino.\n@c2@"
  fr: "@a@b*ⓢ Mais je ne m'inquiète pas. Les autres monstres trouveront le héros et lui suceront la moelle avant qu'il ne devienne gênant.\n@c2@"
  it: "@a@b*: Non importa... Gli altri mostri troveranno l'eroe, e gli porteranno via l'anima prima che possa diventare un ostacolo per i nostri piani!\n@c2@"
  ja: "@a@b＊「だが　きっと　他の魔物たちが\n\t勇者を探し出し　その息の根を\n\tとめることだろうよ……。\n@c2@"
"38":
  de: "@a@b*: Und dann werdet ihr Menschen endlich unserem Herrn geopfert. Ich werde euch erwarten... in der Unterwelt! Uhh...\n@c2@"
  en: "@a@b*: Then you humans will finally be sacrificed to our Lord. I will be awaiting your arrival...in the underworld! Urgh...\n@c2@"
  es: "@a@b*: Y los humanos seréis sacrificados en honor de nuestro Señor. ¡Esperaré tu llegada... en el Inframundo! Argh...\n@c2@"
  fr: "@a@b*ⓢ Alors, vous autres humains, serez enfin sacrifiés à notre Seigneur. J'attendrai votre venue... en enferⓠ Argh...\n@c2@"
  it: "@a@b*: Gli esseri umani saranno sacrificati al nostro signore... Io attenderò il tuo arrivo... negli inferi... Urgh!\n@c2@"
  ja: "@a@b＊「お前たち人間は　やがて\n\t帝王さまの　いけにえとなるのだ。\n\t地獄で待っているぞ……ぐふっ！\n@c2@"
"39":
  de: "@aPeterchen@bSupie! Wir sind gerettet! Vielen Dank! Jetzt können wir endlich wieder nach Hause.\n@c1@"
  en: "@aWilly Wally@bYay! Thanks for savin' us, Mister. Now we can finally be away home.\n@c1@"
  es: "@aPelayo@b¡Sí! ¡Gracias por salvarnos, señor! Al fin podemos volver a nuestro hogar.\n@c1@"
  fr: "@aHugues Esclin@bMerci de nous avoir sauvés, M'sieur. Maintenant, on peut enfin rentrer chez nous.\n@c1@"
  it: "@aGiacomino@bEvviva! Grazie per averci salvati, signore! Ora possiamo tornarcene a casa!\n@c1@"
  ja: "@a@b＊「わーい！\n\tおじちゃん　ありがとう！\n\tぼくたち　家に帰れるんだね。\n@c1@"
"40":
  de: "@a@b*: Ich glaube, wir kommen hier raus, indem wir in der Nähe der Turmspitze runterspringen.\n@c1@"
  en: "@a@b*: I reckon we can get oot o' here if we jump off near the top o' the tur.\n@c1@"
  es: "@a@b*: Creo que podremos salir de aquí si saltamos desde lo alto de la torre.\n@c1@"
  fr: "@a@b*ⓢ Je crois qu'on peut sortir d'ici en sautant de la tour, presque tout en haut.\n@c1@"
  it: "@a@b*: Credo che potremo uscire da questo posto saltando dalla parte superiore della torre.\n@c1@"
  ja: "@a@b＊「あっ　そうだ。\n\tこの塔の　てっぺんから飛び降りると\n\tそとに出られるそうだよ。\n@c1@"
"41":
  de: "@a@bKeine Antwort. Der Soldat hat seinen letzten Atemzug getan.\n@c3@"
  en: "@a@bThere's no response. The soldier has already taken his last breath.\n@c3@"
  es: "@a@bNo reacciona. El soldado ha exhalado su último suspiro.\n@c3@"
  fr: "@a@bPas de réponse. Le soldat a déjà rendu l'âme.\n@c3@"
  it: "@a@bNon c'è più niente da fare... Ha esalato l'ultimo respiro.\n@c3@"
  ja: "@a@b話しかけても　返事がない。\nすでに　息絶えているようだ。\n@c3@"
"42":
  de: "@a@bRagnar erinnert sich an die Worte seines Waffenkameraden.\n@c3@"
  en: "@a@bRagnar recalls the words of his comrade in arms.\n@c3@"
  es: "@a@bRagnar recuerda las palabras de su compañero de armas.\n@c3@"
  fr: "@a@bRagnar se souvient des mots de son compagnon d'armes.\n@c3@"
  it: "@a@bGaliardo ricorda le parole del suo compagno d'armi.\n@c3@"
  ja: "@a@bライアンは　友の言葉を思い出した。\n@c3@"
"43":
  de: "@a@b*: Irgendwo in der Welt erwacht bereits der Herr der Unterwelt.\n@c3@"
  en: "@a@b*: Somewhere in the world, the Lord o' the Underworld is reawakenin'.\n@c3@"
  es: "@a@b*: ''En algún rincón del mundo, el Señor del Inframundo está despertando de nuevo''.\n@c3@"
  fr: "@a@b*ⓢ Quelque part dans le monde, le Seigneur des Enfers est en train de se réveiller.\n@c3@"
  it: "@a@b*: In un luogo sconosciuto del nostro mondo... il Signore degli Inferi... si sta risvegliando... \n@c3@"
  ja: "@a@b＊「世界のどこかで　地獄の帝王が\n\t復活しつつあるらしい。\n@c3@"
"44":
  de: "@a@b*: Aber wenn es stimmt, was die Ungeheuer sagen, gibt es irgendwo da draußen einen Helden, der ihm die Stirn bieten kann.\n@c3@"
  en: "@a@b*: But if whit the monsters say is true, there's also a hero somewhere oot there who'll be able tae take him on.\n@c3@"
  es: "@a@b*: Pero si lo que cuentan los monstruos es cierto, también existe un héroe en alguna parte capaz de acabar con él.\n@c3@"
  fr: "@a@b*ⓢ Mais si ce que disent les monstres est vrai, il existe aussi un héros qui sera capable de le vaincre.\n@c3@"
  it: "@a@b*: Ma se quello che dicono i mostri è vero, esiste un eroe che può affrontarlo e sconfiggerlo... \n@c3@"
  ja: "@a@b＊「しかし　魔物たちの予言では\n\t帝王を滅ぼす　勇者も　また\n\t育ちつつあるらしいのだ。\n@c3@"
"45":
  de: "@a@b*: Wenn sie ihn finden, solange er noch ein Kind ist, wird er zu schwach sein, um sich selbst zu verteidigen.\n@c3@"
  en: "@a@b*: If they find him while he's still a bairn, he willnae be strong enough tae defend himself.\n@c3@"
  es: "@a@b*: Si dan con él mientras todavía es un chiquillo, será incapaz de defenderse.\n@c3@"
  fr: "@a@b*ⓢ Si les monstres le trouvent alors que ce n'est encore qu'un enfant, il ne sera pas assez fort pour se défendre.\n@c3@"
  it: "@a@b*: Se lo troveranno quando sarà ancora un ragazzo, non sarà in grado di difendersi... \n@c3@"
  ja: "@a@b＊「そこで　勇者が　まだチカラをつけぬ\n\t子供のうちに　見つけ出し\n\t闇にほうむりさる。\n@c3@"
"46":
  de: "@a@b*: Und genau darauf haben sie's abgesehen! Also musst du die Kinder beschützen, Ragnar. Lass nicht zu, dass ihnen etwas zustößt!\n@c3@"
  en: "@a@b*: That's whit they're plottin'! So ye must protect our kiddies, Ragnar. Dinnae let them come tae any harm!\n@c3@"
  es: "@a@b*: ¡Eso, precisamente, es lo que están tramando! Debe proteger a nuestros vástagos, Ragnar. ¡No permita que les hagan daño alguno!\n@c3@"
  fr: "@a@b*ⓢ Voilà ce qu'ils mijotentⓠ Vous devez protéger nos enfants, Ragnar. Ne les laissez pas leur faire de malⓠ\n@c3@"
  it: "@a@b*: È questo il loro piano, Galiardo! Devi proteggere i nostri figli! Non lasciare che quei mostri facciano loro del male!\n@c3@"
  ja: "@a@b＊「それが　魔物どものねらいだ。\n\tライアン！　子供たちをっ\n\t子供たちを守ってくれ……！\n@c3@"
"47":
  de: "@a@b*: Also das haben sie vor. Na, das werden wir ja sehen!\n@c3@"
  en: "@a@b*: Hm, so that's whit they're up to.\nWe'll see aboot that!\n@c3@"
  es: "@a@b*: Mmmm, así que eso es lo que traman.\n¡Veremos si lo consiguen!\n@c3@"
  fr: "@a@b*ⓢ Mmm, voilà donc ce qu'ils complotent.\nNous allons voir çaⓠ\n@c3@"
  it: "@a@b*: Uhm, allora è questo che vogliono, eh? Beh, staremo a vedere!\n@c3@"
  ja: "@a@b＊「ふむふむ。\n\tそういうわけだったのか……。\n\tよし　わかった！\n@c3@"
"48":
  de: "@a@b*: Ich gehe schon mal voraus und berichte König Burkhard von diesem Helden und dem Herrn der Unterwelt.\n@c3@"
  en: "@a@b*: I'll gae on ahead an' report back tae King Burnard aboot this hero an' the Lord o' the Underworld.\n@c3@"
  es: "@a@b*: Me adelantaré e informaré al rey Recaredo sobre dicho héroe y sobre el Señor del Inframundo.\n@c3@"
  fr: "@a@b*ⓢ Je pars devant pour aller faire un rapport au roi Bastien à propos de ce héros et du Seigneur des Enfers.\n@c3@"
  it: "@a@b*: Devo tornare da Re Basilio, e riferirgli dell'eroe e del Signore degli Inferi.\n@c3@"
  ja: "@a@b＊「私は　ひとあし先に戻って\n\t地獄の帝王と　勇者のことを\n\t王さまに　報告しておこう。\n@c3@"
"49":
  de: "@a@b*: Konzentrier du dich darauf, die Kinder wieder heim zu ihren Familien zu bringen.\n@c3@"
  en: "@a@b*: Ye just concentrate on gettin' those bairns back wi' their folks.\n@c3@"
  es: "@a@b*: Por su parte, solo tiene que centrarse en devolver a los niños junto a sus progenitores.\n@c3@"
  fr: "@a@b*ⓢ De votre côté, ramenez ces enfants auprès de leurs parents.\n@c3@"
  it: "@a@b*: %H860%XTu riporta%YVoi riportate%Z quei bambini alle loro famiglie.\n@c3@"
  ja: "@a@b＊「おぬしは　その子供たちを\n\t母親のもとに　送り届けてくれ。\n\tではっ！\n@c3@"
"50":
  de: "@a@b*: Mama! Ich bin wieder da! Ich bin wieder da!\n@c1@"
  en: "@a@b*: Ma! I'm back! I'm back!\n@c1@"
  es: "@a@b*: ¡Madre! ¡He vuelto! ¡He vuelto!\n@c1@"
  fr: "@a@b*ⓢ Mamanⓠ Je suis revenuⓠ Je suis revenuⓠ\n@c1@"
  it: "@a@b*: Mamma! Sono qui! Sono tornato!\n@c1@"
  ja: "@a@b＊「あっ　ママだ！\n\tわーい！　わーい！\n@c1@"
"51":
  de: "@a@b*: Ich war sicher, dass sie noch leben. Der Göttin sei Dank, ich hatte Recht.\n@c1@"
  en: "@a@b*: I was sure they were still alive. Thank the Goddess I was right.\n@c1@"
  es: "@a@b*: Estaba segura de que seguían vivos. Gracias a la Diosa estaba en lo cierto.\n@c1@"
  fr: "@a@b*ⓢ J'étais sûre qu'ils étaient encore en vie. Je remercie la Déesse de m'avoir donné raison.\n@c1@"
  it: "@a@b*: Lo sapevo che erano vivi! Sia ringraziata la dea! Avevo ragione!\n@c1@"
  ja: "@a@b＊「ああ　絶対に生きていると\n\t信じて待ったかいが　ありましたわ。\n@c1@"
"52":
  de: "@a@b*: Erinnert Ihr Euch noch an mich? Wir sind uns in Burg Burland begegnet, und ich habe Euch gebeten, unsere Kinder zu finden.\n@c1@"
  en: "@a@b*: D'ye remember me? We spoke back at Burland Castle, an' I asked ye tae find oor bairns for us.\n@c1@"
  es: "@a@b*: ¿Me recuerda? Hablamos en el Castillo de Burlandia y le supliqué que encontrara a nuestros pequeños.\n@c1@"
  fr: "@a@b*ⓢ Vous vous souvenez de moiⓡ Nous nous sommes parlé au château de Bastione et je vous ai demandé de retrouver nos enfants.\n@c1@"
  it: "@a@b*: %H860%XTi ricordi%YVi ricordate%Z di me? Abbiamo parlato al castello di Burlandia, e %H860%Xti%Yvi%Z avevo chiesto di aiutarci a ritrovare i nostri figli.\n@c1@"
  ja: "@a@b＊「お忘れでしょうか？\n\tバトランドのお城まで　願い出た\n\tあのときの　母親でございます。\n@c1@"
"53":
  de: "@a@b*: Huch! Dann wären unsere armen Kleinen ja beinahe Ungeheuerfutter geworden!\n@c2@"
  en: "@a@b*: Jings! So the poor wee bairns were aboot tae become a monster's supper!\n@c2@"
  es: "@a@b*: ¡Caramba! ¡Así que los pobres niñitos a punto estuvieron de convertirse en la cena de un monstruo!\n@c2@"
  fr: "@a@b*ⓢ Alors comme ça les pauvres petits étaient sur le point de servir de repas aux monstresⓠⓑ\n@c2@"
  it: "@a@b*: Perbacco! E così quei poveri ragazzi stavano per essere sbranati dai mostri?!\n@c2@"
  ja: "@a@b＊「ええっ　ホントですか！\n\t息子たちが　魔物のえじきに\n\tなるところだったなんて……。\n@c2@"
"54":
  de: "@a@b*: Ach, wir können Euch gar nicht genug dafür danken, dass Ihr sie gerettet habt.\n@c2@"
  en: "@a@b*: Och, we cannae thank ye enough for savin' them like that.\n@c2@"
  es: "@a@b*: Pues bien, estamos en deuda con usted por haberlos salvado.\n@c2@"
  fr: "@a@b*ⓢ Nous ne pourrons jamais vous remercier assez de les avoir sauvés.\n@c2@"
  it: "@a@b*: Come potremo mai %H860%Xringraziarti%Yringraziarvi%Z?\n@c2@"
  ja: "@a@b＊「とにかく　子供を助けていただき\n\tあ　ありがとうございました！\n@c2@"
"55":
  de: "@a@b*: Ich weiß gar nicht, wie ich es Euch vergelten kann. Ihr solltet stolz auf Euch sein.\n@c1@"
  en: "@a@b*: I dinnae hae a clue hoo tae thank ye enough. Ye should be proud o' yerself.\n@c1@"
  es: "@a@b*: No se me ocurre la forma de agradecérselo como merece. Debe sentirse muy orgulloso.\n@c1@"
  fr: "@a@b*ⓢ Je ne sais vraiment pas comment vous remercier. Vous pouvez être fier de vous.\n@c1@"
  it: "@a@b*: Non so come possiamo %H860%Xesprimerti%Yesprimervi%Z la nostra gratitudine... %H860%XHai%YAvete%Z compiuto un vero miracolo!\n@c1@"
  ja: "@a@b＊「なんて　お礼を言って　よいのやら。\n\t本当に　ありがとうございました。\n@c1@"
"56":
  de: "@a@b*: Ihr seid ein waschechter Soldat, Ragnar Rauhbein. Nur weiter so!\n@c2@"
  en: "@a@b*: Ye're a true soldier if ever there was one, Ragnar McRyan. Keep up the good work!\n@c2@"
  es: "@a@b*: Es un auténtico soldado, sin parangón, Ragnar McRyan. ¡Siga así!\n@c2@"
  fr: "@a@b*ⓢ Vous êtes un vrai soldat s'il en est, Ragnar McRyan. Continuez comme çaⓠ\n@c2@"
  it: "@a@b*: Sei un valoroso, Galiardo de' Guglielmi! Continua così, e farai grandi cose!\n@c2@"
  ja: "@a@b＊「あなたこそ　まことの戦士です！\n\tこれからも　どうか　ご活躍を！\n@c2@"
"57":
  de: "@a@b*: Danke, dass Ihr meinen großen Bruder gerettet habt, Soldat.\n@c1@"
  en: "@a@b*: Thanks for savin' ma big brother, Mister.\n@c1@"
  es: "@a@b*: ¡Gracias por salvar a mi hermano mayor, señor!\n@c1@"
  fr: "@a@b*ⓢ Merci d'avoir sauvé mon grand frère, Monsieur.\n@c1@"
  it: "@a@b*: Grazie per aver salvato il mio fratellone, signore!\n@c1@"
  ja: "@a@b＊「お兄ちゃんを　助けてくれて\n\tありがとう。\n@c1@"
"58":
  de: "@a@b*: Ah, Ragnar Rauhbein! Ich hatte ja keine Ahnung, dass du so ein Kämpfer bist. König Burkhard wird sich freuen, das zu hören.\n@c3@"
  en: "@a@b*: Oh, McRyan! I didnae realise ye were such a fighter. King Burnard'll be thrilled.\n@c3@"
  es: "@a@b*: ¡Oh, McRyan! Nunca imaginé que fuera tan valiente. El rey Recaredo estará encantado.\n@c3@"
  fr: "@a@b*ⓢ Oh, McRyanⓠ Je ne savais pas que vous étiez un tel combattant. Le roi Bastien va être ravi.\n@c3@"
  it: "@a@b*: Oh, de' Guglielmi! Non immaginavo che tu fossi un combattente tanto valoroso! Re Basilio può andare fiero di te!\n@c3@"
  ja: "@a@b＊「おお　ライアン！\n\tまったく　おぬしを見直したぞ！\n\t王も　きっと　およろこびであろう。\n@c3@"
