"60":
  de: "@a@b*: Das ist er, Mama! Der hat uns gerettet. Stimmt doch, oder, Soldat?\n@c1@"
  en: "@a@b*: This is the fella, ma! This is the one who saved me. That's right, eh, Mister?\n@c1@"
