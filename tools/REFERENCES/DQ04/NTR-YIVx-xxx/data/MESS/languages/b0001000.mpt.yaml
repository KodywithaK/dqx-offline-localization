  es: "@a@bCuri se une a Ragnar.\n@c1@"
  fr: "@a@bDoc rejoint Ragnarⓠ\n@c1@"
  it: "@a@bHealie si unisce a Galiardo!\n@c1@"
  ja: "@a@bホイミンが　仲間にくわわった！\n@c1@"
"80":
  de: "@aMedi@bOoch! Und ich hatte so gehofft, du würdest Ja sagen. Na, wenn du deine Meinung änderst, komm wieder her. Ich werde hier warten... und schlürfen.\n@c1@"
  en: "@aHealie@bOhhh! I was really hoping you'd say yes. Well, if you ever change your mind, then come back here. I'll be waiting...and slurping.\n@c1@"
  es: "@aCuri@b¡Oooh! Realmente esperaba que dijeras que sí. Si cambias de idea, no dudes en volver por aquí. Te estaré esperando... y slurpeando.\n@c1@"
  fr: "@aDoc@bOoohⓠ J'espérais vraiment que vous diriez oui. Bon, si jamais vous changez d'avis, revenez me voir. Je vous attendrai... en faisant des ⓥslurpⓦ.\n@c1@"
  it: "@aHealie@bOh, speravo tanto che mi dicessi di sì... Beh, nel caso tu cambiassi idea, sai dove trovarmi. Io sarò qui, in slurpeggiante attesa.\n@c1@"
  ja: "@a@bホイミン「…うわーん！　ダメなの？\n\tでも　気が変わったら　また来てね。\n\tぼく　ずっと　ここで待ってるから！\n@c1@"
"81":
  de: "@aMedi@bAber nicht vergessen, ja?\n@c1@"
  en: "@aHealie@bDon't forget, okay?\n@c1@"
  es: "@aCuri@bNo lo olvides ¿vale?\n@c1@"
  fr: "@aDoc@bN'oubliez pas, heinⓡ\n@c1@"
  it: "@aHealie@bNon slimenticarlo, d'accordo?\n@c1@"
  ja: "@a@bホイミン「約束だよ。\n@c1@"
"82":
  de: "@a@b*: Du hast die Kinder schon gerettet?!\nNa so was!\n@c3@"
  en: "@a@b*: Ye rescued the bairns already!?\nOch, well I never!\n@c3@"
  es: "@a@b*: ¿Ya ha rescatado a los chiquillos?\n¡Oh! Yo nunca...\n@c3@"
  fr: "@a@b*ⓢ Vous avez déjà sauvé les enfantsⓠⓑ Ça alorsⓠ\n@c3@"
  it: "@a@b*: %H860%XHai%YAvete%Z già riportato a casa i bambini?! Accidenti, %H860%Xhai%Yavete%Z fatto più in fretta di quanto credessi!\n@c3@"
  ja: "@a@b＊「え？\n\tもう　子供たちを助けたって？\n\tどっひゃー！\n@c3@"
"83":
  de: "@a@b*: Ach, nur ein paar Jährchen jünger, dann hätte ich schon mit Euch mithalten können. Tja, schade.\n@c2@"
  en: "@a@b*: If only I was a few years younger, I could hae tagged along wi' ye. More's the pity.\n@c2@"
  es: "@a@b*: Si tuviera algunos años menos, podría haberle acompañado. Una auténtica pena.\n@c2@"
  fr: "@a@b*ⓢ Si seulement j'avais eu quelques années de moins... j'aurais pu vous accompagner. C'est vraiment dommage.\n@c2@"
  it: "@a@b*: Se avessi avuto qualche anno di meno sulle spalle, mi sarei volentieri unito a %H860%Xte%Yvoi%Z. Che peccato... \n@c2@"
  ja: "@a@b＊「わしも　もう少し若ければ\n\tおぬしと　いっしょに戦えたのに……。\n\t残念じゃわい。\n@c2@"
"84":
  de: "@a@b*: Gut gemacht, Ragnar! Hab gehört, du hast die Kinder gerettet. Kannst du mir nicht einen Gefallen tun?\n@c3@"
  en: "@a@b*: Nice work, Ragnar! I heard aboot ye rescuin' those kiddies. I dinnae suppose I can ask a favour?\n@c3@"
  es: "@a@b*: ¡Buen trabajo, Ragnar! He oído que ha rescatado a esos pequeños. No quisiera abusar de su confianza pero...\n@c3@"
  fr: "@a@b*ⓢ Beau travail, Ragnarⓠ J'ai entendu dire que vous aviez sauvé ces enfants. Vous croyez que je pourrais vous demander une faveurⓡ\n@c3@"
  it: "@a@b*: Ottimo lavoro, Galiardo! Ho saputo che hai salvato i bambini! Senti, non è che potresti farmi un favore?\n@c3@"
  ja: "@a@b＊「ライアン！　やったじゃないかっ！\n\tところで　頼みがあるんだが……。\n@c3@"
"85":
  de: "@a@b*: Kannst du den Leuten nicht verklickern, ich hätte sie gerettet? Mich ein bisschen besser dastehen lassen, hm?\n@c3@"
  en: "@a@b*: Can ye tell people that I was the one who saved them? Talk me up a bit, ye ken?\n@c3@"
  es: "@a@b*: ¿Podría decirle a la gente que fui yo el que los rescató? Darme un poco de bombo, ya sabe.\n@c3@"
  fr: "@a@b*ⓢ Pouvez-vous dire aux gens que c'est moi qui les ai sauvésⓡ Pour me mettre un peu en valeur, vous voyezⓡ\n@c3@"
  it: "@a@b*: Diresti agli altri che sono stato io a salvarli? Vedi, vorrei che tu mi facessi un po' di pubblicità.\n@c3@"
  ja: "@a@b＊「子供たちを助けたのは\n\tこのオレ　ということにして\n\t手がらを　ゆずってくれないか？\n@c3@"
"86":
  de: "@a@b*: Ha ha ha! War doch nur ein Witz!\nBist ein guter Mann, Ragnar Rauhbein.\n@c3@"
  en: "@a@b*: Ha ha ha! I'm only jestin' wi' ye!\nYe're a good man, Ragnar McRyan.\n@c3@"
  es: "@a@b*: ¡Ja, ja, ja! ¡Solo estaba bromeando!\nEs un buen hombre, Ragnar McRyan.\n@c3@"
  fr: "@a@b*ⓢ Ha ha haⓠ Je plaisante, bien sûrⓠ\nVous êtes un brave homme, Ragnar McRyan.\n@c3@"
  it: "@a@b*: Ah! Ah! Ah! Ah! Ah! Stavo solo scherzando! Sei una brava persona, Galiardo de' Guglielmi!\n@c3@"
  ja: "@a@b＊「わははっ　じょうだんだよ！\n\tおぬしは　ホントに人がいいな！\n@c3@"
"87":
  de: "@a@b*: Ach, Ihr seid's! Ihr seid doch der Soldat, der diesen Schlamassel drüben in Auenfelde aufgeklärt hat.\n@c2@"
  en: "@a@b*: Och, it's ye! Ye're the soldier who sorted things oot up in Strathbaile.\n@c2@"
  es: "@a@b*: ¡Ah, es usted! Es el soldado que se encargó de ese asunto en Candonga.\n@c2@"
  fr: "@a@b*ⓢ Oh, c'est vousⓠ Vous êtes le soldat qui a remis les choses en ordre à Strattbourg.\n@c2@"
  it: "@a@b*: Ah, ma tu sei il soldato che ha risolto la situazione a Bellavalle!\n@c2@"
  ja: "@a@b＊「おお！　あなただったんですね、\n\tイムルの事件を　解決した\n\tうわさの戦士って。\n@c2@"
"88":
  de: "@a@b*: Alfons ist endlich wieder zu Hause, und auch die Kinder sind heil zurück. Was hätten wir nur ohne Euch gemacht?\n@c2@"
  en: "@a@b*: Angus is home at last, an' the wee bairns are safe an' soond too. Where would we be without ye?\n@c2@"
  es: "@a@b*: Angustio está en casa, sano y salvo, y los chiquillos también. ¿Qué hubiera sido de nosotros sin su ayuda?\n@c2@"
  fr: "@a@b*ⓢ Angus est enfin rentré chez lui et les enfants sont sains et saufs eux aussi. Qu'aurions-nous fait sans vousⓡ\n@c2@"
  it: "@a@b*: Attilio è tornato a casa, e i bambini stanno tutti bene. Chissà in che guai ci troveremmo ora, se non fosse stato per %H860%Xte%Yvoi%Z!\n@c2@"
  ja: "@a@b＊「アレクスは　戻ってきたし\n\t子供も　無事に助け出したし\n\t戦士さまは　じつに頼もしいのう。\n@c2@"
"89":
  de: "@a@b*: Wir sind Euch ja so dankbar, dass Ihr es diesen Ungeheuern gezeigt habt. Jetzt können wir endlich wieder zur Ruhe kommen.\n@c1@"
  en: "@a@b*: We're ever so grateful tae ye for puttin' those monsters tae rights. Now we can finally relax again.\n@c1@"
  es: "@a@b*: Estaremos siempre en deuda con usted por haberles dado su merecido a esos monstruos. Ya podemos respirar tranquilos.\n@c1@"
  fr: "@a@b*ⓢ Nous vous sommes tellement reconnaissants d'avoir réglé leur compte à ces monstres. Nous pouvons enfin nous détendre.\n@c1@"
  it: "@a@b*: Grazie per aver tolto di mezzo quei mostri! Ora siamo tutti più tranquilli.\n@c1@"
  ja: "@a@b＊「魔物どもを　退治して下さって\n\tどうも　ありがとうございました。\n\tこれで　安心してくらせますわ。\n@c1@"
"90":
  de: "@aAgnes@bDank Euch ist mein Mann wieder zu Hause. Ihr habt noch was gut bei mir.\n@c1@"
  en: "@aAigneas@bIt's thanks tae ye that I've got ma hubbie back at home again. I really owe ye.\n@c1@"
  es: "@aAdalberta@bGracias a su ayuda mi cariñito ha vuelto a casa. Estoy en deuda con usted.\n@c1@"
  fr: "@aAgnès@bC'est grâce à vous que mon mari est de retour à la maison. Je vous suis vraiment redevable.\n@c1@"
  it: "@aAgnese@bÈ solo merito %H860%Xtuo%Yvostro%Z se mio marito è di nuovo a casa. %H860%XTe%YVe%Z ne sarò sempre grata.\n@c1@"
  ja: "@a@bフレア「こうして　夫が帰ってきたのも\n\t戦士さまのおかげ……。\n\tありがとうございました。\n@c1@"
"91":
  de: "@aAlfons@bAlles in Ordnung, Soldat? Ich bin's, Alfons. Noch mal danke, dass Ihr mir aus der Patsche geholfen habt.\n@c2@"
  en: "@aAngus@bY'all right there, soldier? It's me, Angus. Thanks again for helpin' me oot afore.\n@c2@"
  es: "@aAngustio@b¿Todo en orden, soldado? Soy yo, Angustio. Le agradezco de nuevo su ayuda de antes.\n@c2@"
  fr: "@aAngus@bTout va bien, soldatⓡ C'est moi, Angus. Merci encore de m'avoir aidé.\n@c2@"
  it: "@aAttilio@bSalve, soldato! Come va? Sono Attilio, ricordi? Volevo ringraziarti ancora per il tuo aiuto.\n@c2@"
  ja: "@a@bアレクス「やや　戦士どの！\n\t私です。　アレクスです。\n\tそのせつは　お世話になりました！\n@c2@"
"92":
  de: "@a@b*: Ich habe schon von Euch gehört. Ihr sollt ein paar Kinder davor bewahrt haben, von Ungeheuern gefressen zu werden.\n@c2@"
  en: "@a@b*: I've heard rumours aboot ye. That ye saved some kiddies from bein' eaten by monsters.\n@c2@"
  es: "@a@b*: He escuchado lo que dicen de usted. Que ha impedido que unos monstruos devoraran a unos niños.\n@c2@"
  fr: "@a@b*ⓢ J'ai entendu des rumeurs à votre sujet. Vous auriez sauvé des enfants qui étaient sur le point de se faire dévorer par des monstres.\n@c2@"
  it: "@a@b*: Ho sentito molto parlare di %H860%Xte%Yvoi%Z. So che %H860%Xhai%Yavete%Z salvato i ragazzi, impedendo che fossero mangiati dai mostri.\n@c2@"
  ja: "@a@b＊「うわさは　届いてますよ。\n\t子供を食らう　化け物を\n\t退治したんですよね？\n@c2@"
"93":
  de: "@a@b*: Oder hat sich das etwa gar nicht so abgespielt?\n@c2@"
  en: "@a@b*: Or is that no quite hoo it went?\n@c2@"
  es: "@a@b*: ¿O no es así como sucedió realmente?\n@c2@"
  fr: "@a@b*ⓢ À moins que je ne me trompeⓡ\n@c2@"
  it: "@a@b*: Non mi hanno mica raccontato una frottola, eh?\n@c2@"
  ja: "@a@b＊「あれ？　ちょっと　ちがうかな。\n@c2@"
"94":
  de: "@a@b*: Ragnar! Habt Ihr schon einmal von diesem Kampfarchiv gehört?\n@c2@"
  en: "@a@b*: Ragnar! Hae ye heard o' this thing called battle records?\n@c2@"
  es: "@a@b*: ¡Ragnar! ¿Ha oído hablar de eso que llaman registros de batalla?\n@c2@"
  fr: "@a@b*ⓢ Ragnarⓠ Vous avez entendu parler de ce qu'on appelle les résultats des combatsⓡ\n@c2@"
  it: "@a@b*: Galiardo, hai mai sentito parlare del registro delle battaglie?\n@c2@"
  ja: "@a@b＊「ライアンどの！　知っておるか？\n\t作戦には　戦歴というものが\n\tあってのう……。\n@c2@"
"95":
  de: "@a@b*: Damit könnt Ihr offenbar prüfen, wie Ihr Euch im Kampf macht.\n@c2@"
  en: "@a@b*: Apparently, ye can use it tae check on hoo yer fightin' is gaein'.\n@c2@"
  es: "@a@b*: Al parecer, se pueden usar para comprobar cómo evoluciona en sus combates.\n@c2@"
  fr: "@a@b*ⓢ Apparemment, vous pouvez vous en servir pour savoir où vous en êtes au niveau des combats.\n@c2@"
  it: "@a@b*: Si tratta di uno strumento utilissimo per valutare come ti comporti in combattimento.\n@c2@"
  ja: "@a@b＊「それを見れば　おのずと\n\tおのれの戦いぶりが\n\tわかるそうじゃぞ。\n@c2@"
"96":
  de: "@a@b*: Ah! Ihr seid auf Einkaufstour, was? Macht es Euch was aus, außen herum zu gehen?\n@c2@"
  en: "@a@b*: Ach! Here for a wee bit o' shoppin', are ye? Then maybe ye could away ootside an' 'round tae the counter if it's no too much trouble.\n@c2@"
  es: "@a@b*: ¡Vaya! Veo que ha venido a hacer algunas compras. Entonces no le importará salir de aquí y dirigirse al mostrador, si es tan amable.\n@c2@"
  fr: "@a@b*ⓢ Tiensⓠ Vous venez faire quelques emplettesⓡ Alors il faudrait ressortir et passer de l'autre côté du comptoir, si vous voulez bien.\n@c2@"
  it: "@a@b*: Ehilà! %H860%XSei%YSiete%Z qui per acquisti? Allora %H860%Xesci fuori e vai%Yuscite fuori e andate%Z dall'altro lato del bancone, se non %H860%Xti%Yvi%Z dispiace.\n@c2@"
  ja: "@a@b＊「おや？　買い物ですか？\n\tだったら　店のそとに出て\n\tカウンターごしに　話しかけて下さい。\n@c2@"
"97":
  de: "@a@b*: Ende gut, alles gut. Wir Eltern sind jedenfalls sehr erleichtert, das kann ich Euch sagen.\n@c1@"
  en: "@a@b*: All's well that ends well. We parents are breathin' a big sigh o' relief, I can tell ye.\n@c1@"
  es: "@a@b*: Bien está lo que bien acaba. Los padres nos sentimos aliviados, se lo puedo asegurar.\n@c1@"
  fr: "@a@b*ⓢ Tout est bien qui finit bien. Je peux vous dire qu'en tant que parents, nous avons poussé un gros soupir de soulagement.\n@c1@"
  it: "@a@b*: Tutto è bene quel che finisce bene. Noi genitori possiamo finalmente tirare un bel sospiro di sollievo.\n@c1@"
  ja: "@a@b＊「事件は　解決したそうですね。\n\t子を持つ親として　これからは\n\t安心してくらせますわ。\n@c1@"
"98":
  de: "@a@b*: Juchhuu! Morgen dürfen wir zum Spielen wieder rausgehen!\n@c1@"
  en: "@a@b*: Yippee! We're allood tae gae ootside an' play again the morra!\n@c1@"
  es: "@a@b*: ¡Yupiii! ¡Tenemos permiso para salir y jugar mañana!\n@c1@"
  fr: "@a@b*ⓢ Youpiⓠ On a le droit de retourner jouer dehors dès demainⓠ\n@c1@"
  it: "@a@b*: Evviva! Domani potremo tornare a giocare fuori!\n@c1@"
  ja: "@a@b＊「わーい　わーい！\n\t明日から　おそとで遊べるよー！\n@c1@"
"99":
  de: "@a@b*: Das hast du gut gemacht da draußen, Ragnar!\n@c2@"
  en: "@a@b*: Ye did well oot there, Ragnar!\n@c2@"
  es: "@a@b*: ¡Lo ha hecho muy bien, Ragnar!\n@c2@"
  fr: "@a@b*ⓢ Vous vous en êtes bien sorti là-bas, Ragnarⓠ\n@c2@"
  it: "@a@b*: Galiardo, sei stato semplicemente magnifico!\n@c2@"
  ja: "@a@b＊「おてがらですね　ライアンさん！\n@c2@"
"100":
  de: "@a@b*: König Burkhard ist schon sehr gespannt darauf, alles aus erster Hand zu hören!\n@c2@"
  en: "@a@b*: King Burnard's been dyin' tae see ye an' hear everythin' that happened from the horse's mooth.\n@c2@"
  es: "@a@b*: El rey Recaredo arde en deseos de verle y escuchar lo sucedido de boca del protagonista.\n@c2@"
  fr: "@a@b*ⓢ Le roi Bastien a hâte de vous voir et d'entendre le récit de ce qui s'est passé de votre propre bouche.\n@c2@"
  it: "@a@b*: Re Basilio desidera vederti. Vuole sapere direttamente da te come sono andate le cose.\n@c2@"
  ja: "@a@b＊「ささ　ライアンどの\n\t吉報を待ちわびて　王が\n\t首を長くしておられるぞ。\n@c2@"
"101":
  de: "@a@b*: Geh ruhig durch.\n@c2@"
  en: "@a@b*: On ye gae.\n@c2@"
  es: "@a@b*: En marcha.\n@c2@"
  fr: "@a@b*ⓢ Allez-y.\n@c2@"
  it: "@a@b*: %H860%XPassa%YPassate%Z pure.\n@c2@"
  ja: "@a@b＊「どうぞ　お進みください。\n@c2@"
"102":
  de: "@a@b*: König Burkhard wartet schon.\n@c2@"
  en: "@a@b*: King Burnard's waitin' for ye.\n@c2@"
  es: "@a@b*: El rey Recaredo le está esperando.\n@c2@"
  fr: "@a@b*ⓢ Le roi Bastien vous attend.\n@c2@"
  it: "@a@b*: Re Basilio %H860%Xti%Yvi%Z sta aspettando.\n@c2@"
  ja: "@a@b＊「さあ！\n\t王が　お待ちかねですぞ！\n@c2@"
"103":
  de: "@aKönig Burkhard@bAh, Rauhbein! Schön, dass Ihr wieder da seid.\n@c2@"
  en: "@aKing Burnard@bAh, McRyan! It's good tae see ye back.\n@c2@"
  es: "@aRey Recaredo@b¡Ah, McRyan! Me alegra verle de nuevo.\n@c2@"
  fr: "@aRoi Bastien@bAh, McRyanⓠ Content de vous revoir.\n@c2@"
  it: "@aRe Basilio@bAh, de' Guglielmi. Sono lieto di rivederti.\n@c2@"
  ja: "@a@b王「おお　ライアン！\n\tよくぞ戻った！\n@c2@"
"104":
  de: "@aKönig Burkhard@bAber Ihr solltet die kleinen Kinder zu ihren Müttern nach Auenfelde zurückbringen.\n@c2@"
  en: "@aKing Burnard@bBut ye should get those wee bairns back tae their mothers in Strathbaile.\n@c2@"
  es: "@aRey Recaredo@bNo obstante, debería llevar a esos pequeños a Candonga, de vuelta junto a sus madres.\n@c2@"
  fr: "@aRoi Bastien@bMais vous devriez raccompagner ces petits auprès de leurs mères, à Strattbourg.\n@c2@"
  it: "@aRe Basilio@bCredo, tuttavia, che dovresti concentrarti su come fare per riportare quei fanciulli alle loro madri a Bellavalle.\n@c2@"
  ja: "@a@b王「さあ　はやく子供たちを\n\tイムルの村へ　帰してあげるのじゃ！\n@c2@"
"105":
  de: "@aKönig Burkhard@bDanach könnt Ihr mir in aller Ruhe erzählen, was Ihr so getrieben habt. Also, fort mit Euch!\n@c2@"
  en: "@aKing Burnard@bThen we can hae a good auld gab aboot everythin' ye've been up tae. Away wi' ye!\n@c2@"
  es: "@aRey Recaredo@bTras ello, podemos discutir tranquilamente todo lo que le ha acontecido. Puede retirarse.\n@c2@"
  fr: "@aRoi Bastien@bEnsuite, nous aurons tout notre temps pour que vous me racontiez vos aventures. Allez, filezⓠ\n@c2@"
  it: "@aRe Basilio@bDopo che l'avrai fatto, potremo parlare di tutto ciò che vorrai. Ora vai!\n@c2@"
  ja: "@a@b王「そなたの報告は\n\tそのあとで　聞こう。\n\t行くのだ　ライアン！\n@c2@"
"106":
  de: "@aKönig Burkhard@bAh, Rauhbein! Schön, dass Ihr wieder da seid. Ich habe mich schon darauf gefreut.\n@c2@"
  en: "@aKing Burnard@bAh, McRyan! It's good tae see ye back.\nI've been lookin' forward tae it.\n@c2@"
  es: "@aRey Recaredo@b¡Ah, McRyan! Me alegra verle de vuelta.\nEstaba deseoso de recibirle.\n@c2@"
  fr: "@aRoi Bastien@bAh, McRyanⓠ Content de vous revoir.\nJe vous attendais avec impatience.\n@c2@"
  it: "@aRe Basilio@bOh, de' Guglielmi! Sono felice di vederti. Ti aspettavo.\n@c2@"
  ja: "@a@b王「おお　ライアン！\n\tよくぞ戻った　待ちわびたぞ！\n@c2@"
"107":
  de: "@aKönig Burkhard@bIhr habt Euch diesmal ja wirklich selbst übertroffen. Die Eltern von Auenfelde sind ganz aus dem Häuschen.\n@c2@"
  en: "@aKing Burnard@bYe really excelled yerself oot there.\nThe parents of Strathbaile are thrilled.\n@c2@"
  es: "@aRey Recaredo@bRealmente, ha demostrado su valía, caballero.\nLas familias de Candonga están encantadas.\n@c2@"
  fr: "@aRoi Bastien@bVous vous êtes vraiment surpassé là-bas, mon brave. Les parents de Strattbourg sont ravis.\n@c2@"
  it: "@aRe Basilio@bHai fatto davvero un ottimo lavoro, vecchio mio. I genitori di Bellavalle sono entusiasti di te!\n@c2@"
  ja: "@a@b王「このたびの　そなたの働き\n\tまことに　見事であった。\n\tイムルの親子も　よろこんでおろう。\n@c2@"
"108":
  de: "@aKönig Burkhard@bIch bin stolz, einen Soldaten wie Euch in meiner Wache zu haben.\n@c2@"
  en: "@aKing Burnard@bI'm proud tae hae a soldier like ye among ma guards.\n@c2@"
  es: "@aRey Recaredo@bMe enorgullece contar con un soldado como usted entre mis filas.\n@c2@"
  fr: "@aRoi Bastien@bJe suis fier de compter un soldat tel que vous parmi mes gardes.\n@c2@"
  it: "@aRe Basilio@bSono orgoglioso che tra le mie guardie ci sia un soldato del tuo valore!\n@c2@"
  ja: "@a@b王「そなたのような　家来を\n\tもてたことは　わしの誇りだ！\n@c2@"
"109":
  de: "@aKönig Burkhard@bIhr verdient eine Belohnung! Sucht Euch was aus! Ihr könnt haben, was Ihr wollt.\n@c2@"
  en: "@aKing Burnard@bNow, ye deserve a reward! Whit would ye like? I'll gie ye anythin' ye ask for.\n@c2@"
  es: "@aRey Recaredo@b¡Se merece una recompensa! ¿Qué quiere? Le daré lo que me pida, lo que sea.\n@c2@"
  fr: "@aRoi Bastien@bBon, vous méritez une récompenseⓠ Que désirez-vousⓡ Je vous donnerai tout ce que vous voudrez.\n@c2@"
  it: "@aRe Basilio@bIl tuo coraggio merita una ricompensa! Cosa ti piacerebbe? Ti darò tutto ciò che vorrai!\n@c2@"
  ja: "@a@b王「そうじゃ！　ほうびを取らせよう！\n\tなにか　望みはないか？\n\tなんでもよいぞ　ゆうてみい。\n@c2@"
"110":
  de: "@aKönig Burkhard@bWie bitte? Ihr wollt auf Reisen gehen, sagt Ihr?\n@c2@"
  en: "@aKing Burnard@bSorry? Ye want tae gae off travellin', ye say?\n@c2@"
  es: "@aRey Recaredo@b¿Cómo dice? ¿Que desea emprender un viaje?\n@c2@"
  fr: "@aRoi Bastien@bCommentⓡ Vous dites que vous voulez voyagerⓡ\n@c2@"
  it: "@aRe Basilio@bCome dici? Vuoi che ti dia il permesso di lasciare il castello e andare in giro per il mondo?\n@c2@"
  ja: "@a@b王「なんだと？\n\t旅に出たいと申すか！\n@c2@"
"111":
  de: "@aRagnar@b...\n@c2@"
  en: "@aRagnar@b...\n@c2@"
  es: "@aRagnar@b...\n@c2@"
  fr: "@aRagnar@b............\n@c2@"
  it: "@aGaliardo@b... \n@c2@"
  ja: "@a@bライアン「…………。\n@c2@"
"112":
  de: "@aKönig Burkhard@bDamit Ihr den kindlichen Helden finden und vor Unheil schützen könnt...?\n@c2@"
  en: "@aKing Burnard@bSo that ye can find the child hero an' keep him safe from harm...?\n@c2@"
  es: "@aRey Recaredo@b¿Para dar con el niño héroe y protegerlo de todo peligro...?\n@c2@"
  fr: "@aRoi Bastien@bAfin de trouver l'enfant héros et de le protéger...ⓡ\n@c2@"
  it: "@aRe Basilio@bVuoi andare a cercare il fanciullo eroe e proteggerlo dalle insidie che lo minacciano?\n@c2@"
  ja: "@a@b王「すると　そなたは\n\tまだ子供である　勇者を見つけ\n\t守りたいと……。\n@c2@"
"113":
  de: "@aKönig Burkhard@bTja, wenn das Euer Wunsch ist, wie könnte ich Euch davon abhalten?!\n@c2@"
  en: "@aKing Burnard@bOch, if that's whit ye want, then who am I tae\nstop ye!?\n@c2@"
  es: "@aRey Recaredo@bVaya, si eso es lo que quiere, yo no se lo impediré.\n@c2@"
  fr: "@aRoi Bastien@bEntendu. Si c'est ce que vous voulez, qui suis-je pour vous en empêcherⓡ\n@c2@"
  it: "@aRe Basilio@bBene. Se questo è ciò che vuoi, te lo concedo.\n@c2@"
  ja: "@a@b王「あい　わかった！\n\tそれが　そなたの望みなら\n\tもう止めはせぬ！\n@c2@"
"114":
  de: "@aKönig Burkhard@bHier, das ist mein kleines Abschiedsgeschenk für Euch!\n@c2@"
  en: "@aKing Burnard@bHere's a wee gaein' away pressie for ye, then!\n@c2@"
  es: "@aRey Recaredo@bTenga, un pequeño presente de despedida.\n@c2@"
  fr: "@aRoi Bastien@bDans ce cas, acceptez ce petit cadeau de départⓠ\n@c2@"
  it: "@aRe Basilio@bAccetta questo piccolo dono, prima di andar via.\n@c2@"
  ja: "@a@b王「ライアン！\n\tこれは　わしからの　せんべつじゃ！\n\t受けとれい！\n@c2@"
"115":
  de: "@aKönig Burkhard@bPasst auf Euch auf, Rauhbein.\n@c2@"
  en: "@aKing Burnard@bMind hoo ye gae, McRyan.\n@c2@"
  es: "@aRey Recaredo@bTenga cuidado en su periplo, McRyan.\n@c2@"
  fr: "@aRoi Bastien@bFaites attention à vous, McRyan.\n@c2@"
  it: "@aRe Basilio@bFai attenzione, de' Guglielmi.\n@c2@"
  ja: "@a@b王「ライアン！\n\t気をつけて　ゆくのだぞ！\n@c2@"
"116":
  de: "@a@bUnd so begab sich Ragnar Rauhbein auf die Reise, um den kindlichen Helden zu finden...\n@c0@"
  en: "@a@bAnd so Ragnar McRyan set off on his journey to find the child hero...\n@c0@"
  es: "@a@bY de este modo, Ragnar McRyan emprendió su aventura en busca del niño héroe...\n@c0@"
  fr: "@a@bEt c'est ainsi que Ragnar McRyan commença son voyage à la recherche de l'enfant héros...\n@c0@"
  it: "@a@bE così Galiardo de' Guglielmi partì per il suo viaggio alla ricerca del fanciullo eroe... \n@c0@"
  ja: "@a@bこうして　ライアンは\nこの地の　どこかにいる　勇者を求め\n旅に出たのでした……。\n@c0@"
"117":
  de: "@a@bMöchtest du die bisherigen Geschehnisse im Abenteuertagebuch speichern?\n@c0@"
  en: "@a@bWould you like to save the story so far in your adventure log?\n@c0@"
  es: "@a@b¿Quieres guardar la historia hasta el momento en tu registro de aventuras?\n@c0@"
  fr: "@a@bSouhaitez-vous sauvegarder votre aventure dans votre journalⓡ\n@c0@"
  it: "@a@bVuoi salvare i tuoi progressi nel diario dell'avventura?\n@c0@"
  ja: "@a@bここまでの　お話を\n冒険の書に　記録します。\nよろしいですか？\n@c0@"
"118":
  de: "@a@bWirklich weiter zum nächsten Kapitel, ohne den Fortschritt zu speichern?\n@c0@"
  en: "@a@bAre you sure you want to move on to the next chapter without saving your progress?\n@c0@"
  es: "@a@b¿Seguro que deseas pasar al siguiente capítulo sin guardar los avances?\n@c0@"
  fr: "@a@bVoulez-vous vraiment passer au chapitre suivant sans sauvegarder votre progressionⓡ\n@c0@"
  it: "@a@bVuoi davvero passare al capitolo successivo senza salvare i tuoi progressi nell'avventura?\n@c0@"
  ja: "@a@bそれでは　記録しないで\n次章にすすみます。\nよろしいですか？\n@c0@"
