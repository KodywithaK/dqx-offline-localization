  es: "@a@b*: ¡Eh! ¿Es cierto eso de que una criatura del Inframundo va a cobrar vida de nuevo? Eso no augura nada bueno.\n@c1@"
  fr: "@a@b*ⓢ Héⓠ C'est vrai cette histoire de truc des enfers qui revient à la vieⓡ J'aime pas trop ça.\n@c1@"
  it: "@a@b*: Ehi, ma cos'è questa storia del ⓕSignore degli Infissiⓖ, o come diavolo si chiama, che sta per tornare in vita?! Non mi piace affatto!\n@c1@"
  ja: "@a@b＊「ねえねえ　地獄の何とかが\n\tよみがえるって　ほんと？\n\tそんなことないよね。\n@c1@"
"66":
  de: "@a@b*: Ihr seid echt stark!\n@c1@"
