"0":
  de: "@a@b%0%a00140 legt die Yggdrasil-Blume neben den Grabstein.\n@c0@"
  en: "@a@b%0%a00140 places the Yggdrasil flower beside the tombstone.\n@c0@"
  es: "@a@b%0%a00140 coloca la flor de Yggdrasil junto a la lápida.\n@c0@"
  fr: "@a@b%0%a00140 place la fleur d'Yggdrasil à côté de la pierre tombale.\n@c0@"
  it: "@a@b%0%a00140 depone il fiore di Ygdrasil accanto alla lapide.\n@c0@"
  ja: "@a@b%a00140は　お墓に\n世界樹の花を　そっと供えた……。\n@c0@"
"1":
  de: "@aRosi@b... Wo bin ich?\n@c1@"
  en: "@aRose@b...Where am I?\n@c1@"
  es: "@aRosa@b... ¿Dónde estoy?\n@c1@"
  fr: "@aRose@b... Où suis-jeⓡ\n@c1@"
  it: "@aRosa@bDove mi trovo...?\n@c1@"
  ja: "@a@bロザリー「これは……？\n@c1@"
"2":
  de: "@aRosi@bMoment mal! Das ist eine Yggdrasil-Blume. Das bedeutet wohl, dass Ihr meine verstorbene Seele wieder zum Leben erweckt habt.\n@c1@"
  en: "@aRose@bWait! That's an Yggdrasil flower.\nThat means you must have brought my departed soul back to life.\n@c1@"
  es: "@aRosa@b¡Un momento! Es una flor de Yggdrasil.\nEso significa que %H860%Xhas%Yhabéis%Z devuelto mi alma a la vida.\n@c1@"
  fr: "@aRose@bAttendezⓠ Ceci est une fleur d'Yggdrasil.\nCela signifie que vous avez dû ramener mon âme défunte à la vie.\n@c1@"
  it: "@aRosa@bEhi! Ma questo è un fiore di Ygdrasil...\nCiò significa che %H860%Xhai%Yavete%Z riportato in vita la mia anima...\n@c1@"
  ja: "@a@bロザリー「それは　世界樹の花……。\n\tでは　あなたたちが　私のみたまを\n\t呼び戻してくださったのですね。\n@c1@"
"3":
  de: "@a@b*: Uwaaahhh! Uwaaahhh!\nRosi ist wieder auferstanden!\n@c2@"
  en: "@a@b*: Uwaaargh! Uwaaargh!\nRose has come back to life!\n@c2@"
  es: "@a@b*: ¡Aaaargh! ¡Aaaargh!\n¡Rosa ha vuelto a la vida!\n@c2@"
  fr: "@a@b*ⓢ Waaarghⓠ Waaarghⓠ\nRose est revenue à la vieⓠ\n@c2@"
  it: "@a@b*: Uaaargh! Uaaargh! Rosa è tornatargh da noi!\n@c2@"
  ja: "@a@b＊「うおーん　うおーん！\n\tロザリーちゃんが　生き返ったー！\n@c2@"
"4":
  de: "@aRosi@bIch hätte nie gedacht, dass ich durch Menschenhand wieder in diese Welt gerufen würde.\n@c1@"
  en: "@aRose@bI never imagined I'd be called back to this world by the hands of humans.\n@c1@"
  es: "@aRosa@bNunca imaginé que sería llamada de regreso a este mundo de la mano de humanos.\n@c1@"
  fr: "@aRose@bJe n'aurais jamais imaginé être rappelée dans ce monde par une main humaine.\n@c1@"
  it: "@aRosa@bNon avrei mai immaginato che sarei tornata a questo mondo... per mano di un essere umano.\n@c1@"
  ja: "@a@bロザリー「人間の手で　ふたたび\n\tこの世に　生をあたえられるとは\n\t思ってもみませんでした。\n@c1@"
"5":
  de: "@aRosi@bAlso ist es wahr, dass manche Menschen ein reines Herz besitzen. Daran habe ich immer geglaubt.\n@c1@"
  en: "@aRose@bSo it's true that some humans are also pure of heart. I always believed it was so.\n@c1@"
  es: "@aRosa@bDe modo que es cierto que algunos humanos son puros de corazón. Siempre lo creí así.\n@c1@"
  fr: "@aRose@bIl est donc vrai que certains humains ont aussi le cœur pur. Je l'ai toujours pensé.\n@c1@"
  it: "@aRosa@bAllora è vero che esistono uomini puri di cuore... Io l'ho sempre saputo.\n@c1@"
  ja: "@a@bロザリー「心正しき　人間もいる……\n\tわたしが　信じていた通りです。\n@c1@"
"6":
  de: "@aRosi@bOh! Aber wir haben keine Zeit zum Plaudern.\n@c1@"
  en: "@aRose@bOh! But now's not the time for such happy talk.\n@c1@"
  es: "@aRosa@b¡Oh! ¡Pero ahora no es momento de tanta felicidad!\n@c1@"
  fr: "@aRose@bOhⓠ Mais ce n'est pas le moment de bavarder de choses agréables.\n@c1@"
  it: "@aRosa@bMa questo non è il momento di perdersi in chiacchiere.\n@c1@"
  ja: "@a@bロザリー「……いけない。\n\tここで　よろこんでいる場合では\n\tありませんでした。\n@c1@"
"7":
  de: "@aRosi@bPsaro... Wir müssen ihn aufhalten, bevor die Welt ganz zerstört wird!\n@c1@"
  en: "@aRose@bPsaro... He has to be stopped before the world is totally destroyed!\n@c1@"
  es: "@aRosa@bPsaro... ¡Hay que detenerlo antes de que el mundo sea destruido por completo!\n@c1@"
  fr: "@aRose@bPsaro... Il faut l'arrêter avant que le monde ne soit totalement détruitⓠ\n@c1@"
  it: "@aRosa@bBisogna fermare Psaro prima che distrugga il mondo completamente!\n@c1@"
  ja: "@a@bロザリー「ピサロさまを……\n\tピサロさまの野望を　止めなければ\n\t世界が　滅んでしまうのです！\n@c1@"
"8":
  de: "@aRosi@bAber nun habe ich Hoffnung. Immerhin habt Ihr eine äußerst seltene Yggdrasil-Blume ergattert.\n@c1@"
  en: "@aRose@bBut now I have hope. You were able to acquire an elusive Yggdrasil flower, after all.\n@c1@"
  es: "@aRosa@bPero ahora tengo esperanzas. Después de todo, %H860%Xfuiste capaz%Yfuistéis capaces%Z de conseguir una flor de Yggdrasil, algo casi imposible.\n@c1@"
  fr: "@aRose@bMais j'ai de l'espoir, désormais.\nAprès tout, vous avez réussi à obtenir une fleur d'Yggdrasil, ce qui est déjà un véritable exploit.\n@c1@"
  it: "@aRosa@bOra che qualcuno è riuscito a cogliere un rarissimo fiore di Ygdrasil, sono certa che tutto andrà bene.\n@c1@"
  ja: "@a@bロザリー「けれど　世界樹の花を\n\t手にできた　あなたたちなら……。\n@c1@"
"9":
  de: "@aRosi@bUnd vielleicht seid Ihr auch im Stande, Psaros teuflisches Vorhaben zu vereiteln.\n@c1@"
  en: "@aRose@bMaybe that means you have what it takes to thwart Psaro's misguided plot.\n@c1@"
  es: "@aRosa@bQuizá, eso signifique que %H860%Xpodrás%Ypodréis%Z frustrar el insensato plan de Psaro.\n@c1@"
  fr: "@aRose@bPeut-être que cela signifie que vous avez la capacité de déjouer le terrible plan de Psaro.\n@c1@"
  it: "@aRosa@bCredo che %H860%Xriuscirai%Yriuscirete%Z a impedire a Psaro di mettere in atto il suo piano sciagurato...\n@c1@"
  ja: "@a@bロザリー「もしかしたら\n\tピサロさまの野望を　止めることも\n\tできるかもしれません。\n@c1@"
"10":
  de: "@aRosi@bIhr müsst mich zu ihm bringen! Wenn wir jetzt aufbrechen, ist es vielleicht noch nicht zu spät.\n@c1@"
  en: "@aRose@bPlease, you have to take me to him!\nIf we leave now, we might just reach him in time.\n@c1@"
  es: "@aRosa@b¡Por favor, %H860%Xtienes%Ytenéis%Z que conducirme hasta él!\nSi partimos ahora, puede que aún lleguemos a tiempo.\n@c1@"
  fr: "@aRose@bS'il vous plaît, vous devez me conduire à luiⓠ\nSi nous partons immédiatement, nous parviendrons peut-être à le rejoindre à temps.\n@c1@"
  it: "@aRosa@b%H860%XTi%YVi%Z supplico... %H860%XPortami%YPortatemi%Z da lui! Se ci muoviamo subito, potremmo ancora essere in tempo per fermarlo!\n@c1@"
  ja: "@a@bロザリー「お願いです。　わたしを\n\tピサロさまの所へ　お連れ下さい！\n\t今なら　まだ間に合います！\n@c1@"
"11":
  de: "@aRosi@bWenn Psaro aufgehalten werden kann... Ich meine, Psaro der Metzler...\n@c1@"
  en: "@aRose@bIf Psaro can be stoppedⓚⓛ\nI mean, Psaro the Manslayer...\n@c1@"
  es: "@aRosa@bSi fuera posible detener a Psaro.\nQuiero decir, Psaro el Carnicero...\n@c1@"
  fr: "@aRose@bSi Psaro peut être arrêté...\nJe veux dire, Psaro l'Exterminateur...\n@c1@"
  it: "@aRosa@bSempre che sia possibile fermare Psaro il Massacratore...\n@c1@"
  ja: "@a@bロザリー「そして　もしも　わたしが\n\tピサロさま……いえ　デスピサロを\n\t止めることが　できなかったら……。\n@c1@"
"12":
  de: "@aRosi@bDann würde ich Euch bitten, seine Seele in die andere Welt zu geleiten und diese unsere Welt von der Bedrohung zu befreien.\n@c1@"
  en: "@aRose@bThen I'd like you to send his soul to the other world and rid this one of his menace.\n@c1@"
  es: "@aRosa@bEntonces, desearía que %H860%Xenviaras%Yenviarais%Z su alma al otro mundo y acabar así con su amenaza.\n@c1@"
  fr: "@aRose@bAlors j'aimerais envoyer son âme dans l'autre monde et débarrasser celui-ci de sa menace.\n@c1@"
  it: "@aRosa@bVorrei che %H860%Xtu mandassi%Yvoi mandaste%Z la sua anima all'altro mondo, e salvare così l'umanità da questa terribile minaccia.\n@c1@"
  ja: "@a@bロザリー「そのときは\n\tあなたたちに　デスピサロを\n\t亡き者と　してほしいのです。\n@c1@"
"13":
  de: "@aRosi@bWir haben nicht viel Zeit.\nBeeilung!\n@c1@"
  en: "@aRose@bWe don't have much time.\nWe must hurry!\n@c1@"
  es: "@aRosa@bNo tenemos demasiado tiempo.\n¡Aprisa!\n@c1@"
  fr: "@aRose@bNous n'avons pas beaucoup de temps.\nIl faut faire viteⓠ\n@c1@"
  it: "@aRosa@bNon ci rimane molto tempo... Dobbiamo agire in fretta!\n@c1@"
  ja: "@a@bロザリー「時間が　ありません！\n\tさあ　お急ぎください！\n@c1@"
"14":
  de: "@a@bRosi schließt sich der Gruppe an!\n@c0@"
  en: "@a@bRose joins the party!\n@c0@"
  es: "@a@bRosa se une al grupo.\n@c0@"
  fr: "@a@bRose rejoint l'équipeⓠ\n@c0@"
  it: "@a@bRosa si unisce al gruppo!\n@c0@"
  ja: "@a@bロザリーが　仲間にくわわった！\n@c0@"
