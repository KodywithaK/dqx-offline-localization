  en: "@a@b*: If you wish to know more about Yggdrasil flowers, you must travel around the world.\n@c1@"
  es: "@a@b*: Si %H860%Xquieres%Yqueréis%Z saber más acerca de las flores de Yggdrasil, lo mejor es viajar por el mundo.\n@c1@"
  fr: "@a@b*ⓢ Si vous voulez en apprendre davantage sur les fleurs d'Yggdrasil, vous devez voyager à travers le monde.\n@c1@"
  it: "@a@b*: Per scoprire qualcosa in più sui fiori di Ygdrasil, %H860%Xdevi%Ydovete%Z viaggiare per il mondo.\n@c1@"
  ja: "@a@b＊「もし　世界樹の花のことが\n\tもっと　知りたいなら　世界中を\n\tまわってみるのが　いいかもね。\n@c1@"
"47":
  de: "@a@b*: Findet Ihr einen Ort, der sich verändert hat, kann das ein Zeichen dafür sein, dass eine Blume erblüht ist.\n@c1@"
  en: "@a@b*: When you find a place changed, that may well be a sign that a flower has blossomed.\n@c1@"
  es: "@a@b*: Cuando %H860%Xveas%Yveáis%Z que un lugar ha cambiado, puede ser la señal de que una flor ha florecido.\n@c1@"
