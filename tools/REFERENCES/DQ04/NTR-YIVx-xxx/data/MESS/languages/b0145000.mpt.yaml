"0":
  de: "@a@b*: Willkommen in Rosenbühl, der Heimat der Zwerge. Hier lässt es sich wahrlich gut leben.\n@c2@"
  en: "@a@b*: Welcome to Rosehill, home of the dwarfs.\nAnd a fine place to live it is, too!\n@c2@"
  es: "@a@b*: %H860%X%A120%XBienvenido%Z%B120%XBienvenida%Z%Y%R000%XBienvenidas%YBienvenidos%Z%Z a Rosavilla, país de los enanos.\n¡Y un lugar espléndido para vivir!\n@c2@"
  fr: "@a@b*ⓢ Bienvenue à Rosecolline, le pays des nains.\nEt un endroit agréable à vivre, qui plus estⓠ\n@c2@"
  it: "@a@b*: Ehilà! Questa è Col Rosato, la terra dei nani! Qui si vive alla... grande! Capita la battuta? Eh! Eh! Eh!\n@c2@"
  ja: "@a@b＊「ここは　ロザリーヒル。\n\tわしら　ホビット族が　住む村だよ。\n@c2@"
"1":
  de: "@a@b*: Ich lüge nicht! Das ist die Wahrheit!\n@c1@"
  en: "@a@b*: I'm not lying!\nIt's true!\n@c1@"
  es: "@a@b*: ¡No miento! ¡Es cierto!\n@c1@"
  fr: "@a@b*ⓢ Je mens pasⓠ\nC'est vraiⓠ\n@c1@"
  it: "@a@b*: Non sto raccontando frottole!\nÈ la verità!\n@c1@"
  ja: "@a@b＊「うそじゃないよ！\n\tほんとだよ！\n@c1@"
"2":
  de: "@a@b*: Das junge Elfenmädchen aus dem Turm wurde von Menschen ermordet!\n@c1@"
  en: "@a@b*: The young elf who lived in the tower, she was murdered by humans!\n@c1@"
  es: "@a@b*: ¡La joven elfa que vivía en la torre fue asesinada por los humanos!\n@c1@"
  fr: "@a@b*ⓢ La jeune elfe qui vivait dans la tour, elle a été assassinée par des humainsⓠ\n@c1@"
  it: "@a@b*: La giovane elfa che viveva nella torre venne uccisa dagli umani!\n@c1@"
  ja: "@a@b＊「塔の中の　エルフのお姉ちゃん\n\t人間に　殺されちゃったんだって！\n@c1@"
"3":
  de: "@a@b*: Buhu! Ich hasse die Menschen. Wie konnten sie so was tun?!\n@c1@"
  en: "@a@b*: Boo! I hate humans! Humans are rubbish!\n@c1@"
  es: "@a@b*: ¡Buuu! ¡Odio a los humanos! ¡Los humanos son una basura!\n@c1@"
  fr: "@a@b*ⓢ Bouhⓠ Je hais les humainsⓠ Ce sont des vilainsⓠ\n@c1@"
  it: "@a@b*: Buuu! Io odio gli uomini! Sono cattivissimi!\n@c1@"
  ja: "@a@b＊「えーん　えーん！\n\t人間なんて　大っキライだー！\n@c1@"
"4":
  de: "@a@b*: Psaro ist vor ein paar Tagen zurückgekehrt. Er trug die sterblichen Überreste von Rosi bei sich.\n@c1@"
  en: "@a@b*: Psaro returned here a few days ago carrying Rose's remains with him.\n@c1@"
  es: "@a@b*: Psaro regresó hace unos días con el cadáver de Rosa.\n@c1@"
  fr: "@a@b*ⓢ Psaro est revenu ici il y a quelques jours, portant avec lui la dépouille de Rose.\n@c1@"
  it: "@a@b*: Psaro è tornato qui qualche giorno fa, portando con sè le spoglie di Rosa.\n@c1@"
  ja: "@a@b＊「先日　ピサロさまが\n\tロザリーのなきがらを　抱えて\n\tこの村に　戻りました。\n@c1@"
"5":
  de: "@a@b*: Er hat für sie ein Grab geschaufelt, dort hinten, inmitten der Blumen, und dann ist er wieder gegangen.\n@c1@"
  en: "@a@b*: He made a grave for her just above here, in a little spot surrounded by flowers, and then he left without further ado.\n@c1@"
  es: "@a@b*: Construyó una tumba para ella aquí arriba, en un lugar rodeado de flores, y luego se marchó.\n@c1@"
  fr: "@a@b*ⓢ Il a creusé une tombe pour elle juste au-dessus d'ici, dans un petit endroit entouré de fleurs, puis il est parti sans rien dire.\n@c1@"
  it: "@a@b*: L'ha sepolta qui vicino, in un luogo circondato da fiori, e poi si è allontanato senza dir nulla.\n@c1@"
  ja: "@a@b＊「そして　この上の花の囲まれた所に\n\t彼女の墓をつくり　すぐに\n\tこの村を　出ていったのです……。\n@c1@"
"6":
  de: "@a@b*: Uwaaahhh! Uwaaahhh! Rosi ist eine Lügneriiiin!\n@c2@"
  en: "@a@b*: Uwaaargh! Uwaaargh! Rose is a liaaarrrgh!\n@c2@"
  es: "@a@b*: ¡Aaaargh! ¡Aaaargh! ¡Rosa es una mentirrrrrosa!\n@c2@"
  fr: "@a@b*ⓢ Waaarghⓠ Waaarghⓠ Rose est une menteuseⓠ\n@c2@"
  it: "@a@b*: Uaaargh! Uaaargh! Rosa è una bugiardaaargh!\n@c2@"
  ja: "@a@b＊「うおーん　うおーん。\n\tロザリーの　うそつきー。\n@c2@"
"7":
  de: "@a@b*: Sie hat mir versprochen, mit mir zu spielen, aber dann ist sie gestorben und hat mich allein gelassen. Uwaaahhh!\n@c2@"
  en: "@a@b*: She promised she'd play with me, but then she died and left me all alone. Uwaaargh!\n@c2@"
  es: "@a@b*: Prometió que vendría a jugar conmigo, pero ahora se ha muerto y me ha dejado solo. ¡Aaaargh!\n@c2@"
  fr: "@a@b*ⓢ Elle a promis de jouer avec moi, mais ensuite elle est morte et m'a laissé tout seul. Waaarghⓠ\n@c2@"
  it: "@a@b*: Mi avevaaargh promesso che avrebbe giocato insieme a me, ma è mortaaargh e mi ha lasciato tutto solo. Uaaaaargh!\n@c2@"
  ja: "@a@b＊「遊ぶ約束　いっぱいしてたのに\n\tオイラをおいて\n\tひとりだけ　死んじゃうなんてー。\n@c2@"
"8":
  de: "@a@b*: Wiiiieher! Ich hasse alle Menschen. Ich werde ihnen nie verzeihen, was sie Rosiiii angetan haben. Niiiiemals!\n@c2@"
  en: "@a@b*: Neeeigh! I heeeeight all humans.\nI can never forgive them for betreeeighing Rose.\nNeeeigh!\n@c2@"
  es: "@a@b*: ¡Iiiiih! Odiiiiiio a todos los humanos.\nNunca les perdonaré que traiiiiicionasen a Rosa.\n¡Iiiiih!\n@c2@"
  fr: "@a@b*ⓢ Hiiiiiⓠ Je hais tous les humains.\nJe ne leur pardonnerai jamais d'avoir trahiiiiiii Rose.\nHiiiiiⓠ\n@c2@"
  it: "@a@b*: Nooo! Iiiiio odio tutti gli umaniiiiihhh! Non li perdonerò maiiiiih di aver tradito Rosa! Maiiiiihhh!\n@c2@"
  ja: "@a@b＊「ヒヒーン！\n\t全部　人間が悪い！\n\t人間　許さない！　ヒヒーン！！\n@c2@"
"9":
  de: "@a@b*: Wuff, wuff! Menschen sind hier nicht länger erwünscht. Grrr!\n@c2@"
  en: "@a@b*: Woof, woof! Humans arrrren't welcome in our village any more. Grrr!\n@c2@"
  es: "@a@b*: ¡Guau, guau! Los humanos ya no son bienvenidos en nuestrrrro pueblo. ¡Grrr!\n@c2@"
  fr: "@a@b*ⓢ Ouaf ouafⓠ Les humains ne sont plus les bienvenus dans notre village. Grrrⓠ\n@c2@"
  it: "@a@b*: Bau, bau! Non voglio più vederrre neanche l'ombrrra di un umano nel nostrrro villaggio. Grrr!\n@c2@"
  ja: "@a@b＊「わんわん！　お前たち　人間が\n\tこの村に　なんの用だワン！\n@c2@"
"10":
  de: "@a@b%0%a00120 schaut sich den Grabstein an.\n@c0@"
  en: "@a@b%0%a00120 examines the tombstone.\n@c0@"
  es: "@a@b%0%a00120 examina la lápida.\n@c0@"
  fr: "@a@b%0%a00120 examine la tombe.\n@c0@"
  it: "@a@b%0%a00120 esamina la lapide.\n@c0@"
  ja: "@a@b%a00120は　墓石を調べた。\n@c0@"
"11":
  de: "@a@bDarauf steht: ⓞDu gute Seele, die du von allen hier geliebt wurdest. Mögest du friedlich ruhen bis in alle Ewigkeit.ⓟ\n@c0@"
  en: "@a@bIt reads: ⓗBeloved soul, adored by all in this village, may you sleep in eternal peace.ⓘ\n@c0@"
  es: "@a@bDice: ''Amor de mi alma, adorada por todos en este pueblo, que descanses en una paz eterna.''\n@c0@"
  fr: "@a@bOn y litⓢ ⓥÂme bien-aimée, adorée de tous dans ce village, puisses-tu reposer éternellement en paix.ⓦ\n@c0@"
  it: "@a@bC'è scritto: ⓕChe tu, anima pura, amata da tutti in questo villaggio, possa riposare per sempre in pace.ⓖ\n@c0@"
  ja: "@a@bこの村のすべてに愛された魂よ\n安らかに眠れ……　と刻まれている。\n@c0@"
"12":
  de: "@a@b*: Es war einmal ein junges Elfenmädchen. Ihr Name war Rosi.\n@c2@"
  en: "@a@b*: There was a young elf girl here called Rose.\n@c2@"
  es: "@a@b*: Había una joven elfa aquí llamada Rosa.\n@c2@"
  fr: "@a@b*ⓢ Autrefois, une jeune elfe habitait ici.\nElle s'appelait Rose.\n@c2@"
  it: "@a@b*: Un tempo, qui viveva una giovane elfa di nome Rosa.\n@c2@"
  ja: "@a@b＊「この村には　ロザリーという\n\tエルフが住んでおった。\n@c2@"
"13":
  de: "@a@b*: Sie war etwas ganz Besonderes. Wenn sie weinte, verwandelten sich ihre Tränen in Rubine.\n@c2@"
  en: "@a@b*: She was very special.\nWhen she cried, her tears turned into rubies.\n@c2@"
  es: "@a@b*: Era muy especial.\nCuando lloraba, sus lágrimas se convertían en rubíes.\n@c2@"
  fr: "@a@b*ⓢ Elle avait quelque chose de très particulier.\nQuand elle pleurait, ses larmes se transformaient en rubis.\n@c2@"
  it: "@a@b*: Era una creatura davvero speciale.\nQuando piangeva, le sue lacrime si trasformavano in rubini.\n@c2@"
  ja: "@a@b＊「エルフのロザリーは\n\t流す涙が　ルビーになってのう。\n@c2@"
"14":
  de: "@a@b*: Und da die bösen Menschen immer versuchten, sie wegen ihrer Tränen zu fangen, weinte sie besonders viel.\n@c2@"
  en: "@a@b*: And because the wicked humans were always trying to capture her for her tears, she used to cry an awful lot.\n@c2@"
  es: "@a@b*: Y, como los malvados humanos siempre querían capturarla por sus lágrimas, lloraba y lloraba sin parar.\n@c2@"
  fr: "@a@b*ⓢ Et comme ces méchants humains essayaient toujours de la capturer pour prendre ses larmes, elle pleurait beaucoup.\n@c2@"
  it: "@a@b*: E poiché i malvagi esseri umani cercavano sempre di catturarla per ottenere le Lacrime di rubino, lei piangeva in continuazione.\n@c2@"
  ja: "@a@b＊「だから　悪い人間たちに　ねらわれ\n\tいつも　いじめられて\n\tルビーの涙を　流しておったんじゃ。\n@c2@"
"15":
  de: "@a@b*: Hach... Die arme Rosi ist fort...\n@c2@"
  en: "@a@b*: Hurgh... How can poor Rose be gone?\n@c2@"
  es: "@a@b*: Uurgh... ¿Cómo es posible que la pobre Rosa ya no esté?\n@c2@"
  fr: "@a@b*ⓢ Snif... Comment la pauvre Rose a-t-elle pu partirⓡ\n@c2@"
  it: "@a@b*: Argh... Perché la povera Rosa non c'è più?!\n@c2@"
  ja: "@a@b＊「うっうっ……。\n\tまさかロザリーが死ぬなんてな。\n@c2@"
"16":
  de: "@a@b*: Ich kann nicht glauben, dass es tatsächlich wahr sein soll.\n@c2@"
  en: "@a@b*: I still can't believe it's really true.\n@c2@"
  es: "@a@b*: Todavía no puedo creerlo.\n@c2@"
  fr: "@a@b*ⓢ Je n'arrive toujours pas à y croire.\n@c2@"
  it: "@a@b*: Non riesco ancora a crederci.\n@c2@"
  ja: "@a@b＊「オイラには　まだ\n\t信じられないよ。\n@c2@"
"17":
  de: "@a@b*: Und ich hoffe immer noch, dass sie wieder nach Hause kommt und alles nur ein großes Missverständnis war. Hach!\n@c2@"
  en: "@a@b*: I can't help hoping that she'll come home and tell us this was all a big mistake. Hurgh!\n@c2@"
  es: "@a@b*: No puedo evitar pensar que volverá para decirnos que todo ha sido un tremendo error. ¡Uurgh!\n@c2@"
  fr: "@a@b*ⓢ Je ne peux pas m'empêcher de penser qu'elle va revenir et nous dire que tout ça n'était qu'une gigantesque erreur. Snifⓠ\n@c2@"
  it: "@a@b*: Non posso fare a meno di sperare che torni a casa e ci dica che è stato tutto un brutto sogno. Argh!\n@c2@"
  ja: "@a@b＊「そのうち　ひょっこりと\n\t帰ってきそうな気がしてな。\n\tうっうっ……。\n@c2@"
"18":
  de: "@a@b*: Ich frage mich, wo die Elfen hingegangen sind, nachdem sie von den Menschen vertrieben wurden.\n@c2@"
  en: "@a@b*: I wonder where the elves ended up when they were chased off by humans.\n@c2@"
  es: "@a@b*: Me pregunto dónde fueron a parar los elfos después de que los humanos les persiguieran.\n@c2@"
  fr: "@a@b*ⓢ Je me demande où se sont retrouvés les elfes quand ils ont été chassés par les humains.\n@c2@"
  it: "@a@b*: Mi chiedo dove siano andati gli elfi, quando sono stati scacciati dagli umani.\n@c2@"
  ja: "@a@b＊「人間たちに追われたエルフは\n\tどこに　いくんじゃろうな。\n@c2@"
"19":
  de: "@a@b*: Die Frau im Brunnen weiß, glaub ich, einiges darüber zu berichten.\n@c2@"
  en: "@a@b*: Come to think of it, that woman in the well has a few strange things to say on the matter.\n@c2@"
  es: "@a@b*: Pensándolo bien, esa mujer del pozo tiene algunos datos muy extraños sobre este asunto.\n@c2@"
  fr: "@a@b*ⓢ Maintenant que j'y repense, cette femme dans le puits a des choses étranges à dire sur la question.\n@c2@"
  it: "@a@b*: Ora che ci penso, quella donna nel pozzo potrebbe saperne qualcosa.\n@c2@"
  ja: "@a@b＊「そういえば　この村の井戸に\n\t住んでいるヤツが　おかしなことを\n\t言っておったな。\n@c2@"
"20":
  de: "@a@b*: Miau. Miaaau.\nIch verdanke Fürst Psaro so viel...\n@c1@"
  en: "@a@b*: Meow. Meooow.\nI owe Lord Purrsaro everything...\n@c1@"
  es: "@a@b*: Miau. Miaaau.\nSe lo debo todo a Lord Prrrrsaro.\n@c1@"
  fr: "@a@b*ⓢ Miaou. Miaaaaou.\nJe dois tout au Seigneur Psarrro...\n@c1@"
  it: "@a@b*: Miaaao. Miaaao.\nDevo tutto a Lorrrd Psaaaro...\n@c1@"
  ja: "@a@b＊「にゃあ　にゃあ！\n\tピサロさまに　感謝しなくっちゃ！\n@c1@"
"21":
  de: "@a@b*: Er hat das Geheimnis der Evolution perfektioniert, deshalb können wir hier alle so tierisch gut sprechen. Miau!\n@c1@"
  en: "@a@b*: He purrrfected the Secret of Evolution, and that's why all of us animals can talk so meowvellously.\n@c1@"
  es: "@a@b*: Ha prrrrfeccionado el Secreto de la Evolución y por eso los animales podemos hablar así de miauravillosamente.\n@c1@"
  fr: "@a@b*ⓢ Il a perrrfectionné le Secret de l'Évolution, et c'est pour ça que nous autrrres animaux pouvons parrrler si merrrveilleusement bien.\n@c1@"
  it: "@a@b*: Ha purrrfezionato il Segreto dell'Evoluzione, ecco purrrché noi animali siamo in grado di purrrlare così bene.\n@c1@"
  ja: "@a@b＊「あたしたち　動物が　こうして\n\tしゃべれるのも　みんな\n\t進化の秘法の　おかげだにゃん。\n@c1@"
"22":
  de: "@a@b*: Dies ist eine Kirche für Zwerge und Monster.\n@c1@"
  en: "@a@b*: This is a church for dwarfs and monsters.\n@c1@"
  es: "@a@b*: Esta iglesia es para enanos y monstruos.\n@c1@"
  fr: "@a@b*ⓢ Cette église est réservée aux nains et aux monstres.\n@c1@"
  it: "@a@b*: Questa chiesa è riservata ai mostri e agli animali.\n@c1@"
  ja: "@a@b＊「ここは\n\tホビットと動物たちの　教会。\n@c1@"
"23":
  de: "@a@b*: Es tut mir leid, aber Menschen haben hier keinen Zutritt. Geht nun bitte.\n@c1@"
  en: "@a@b*: I'm afraid humans aren't welcome here.\nWould you kindly leave?\n@c1@"
  es: "@a@b*: Me temo que los humanos no son bienvenidos aquí.\n¿%H860%XTe importaría marcharte%YOs importaría marcharos%Z?\n@c1@"
  fr: "@a@b*ⓢ Je suis désolée, mais les humains ne sont pas les bienvenus.\nVoulez-vous bien partirⓡ\n@c1@"
  it: "@a@b*: Mi spiace, ma qui gli esseri umani non sono i benvenuti.\n%H860%XDevi%YDovete%Z andar via.\n@c1@"
  ja: "@a@b＊「あなたたち　人間の\n\t来るところではありません。\n\t立ち去りなさい。\n@c1@"
"24":
  de: "@a@b*: Fürst Psaro hat diesen Turm erbaut.\n@c2@"
  en: "@a@b*: Lord Psaro built this tower.\n@c2@"
  es: "@a@b*: Lord Psaro construyó esta torre.\n@c2@"
  fr: "@a@b*ⓢ C'est le Seigneur Psaro qui a construit cette tour.\n@c2@"
  it: "@a@b*: È stato Lord Psaro a costruire questa torre.\n@c2@"
  ja: "@a@b＊「この塔は　ピサロさまが\n\tつくったものだ。\n@c2@"
"25":
  de: "@a@b*: Er ist äußerst vorsichtig. Er soll dort nämlich eine Geheimkammer eingebaut haben, falls ein Krieg ausbricht.\n@c2@"
  en: "@a@b*: He's very prudent. Apparently he built a secret room into the tower somewhere in case of a war.\n@c2@"
  es: "@a@b*: Es muy prudente. Al parecer construyó una sala secreta en algún lugar de la torre en caso de guerra.\n@c2@"
  fr: "@a@b*ⓢ Il est très prudent.\nIl paraîtrait qu'il aurait construit une salle secrète quelque part dans la tour en cas de guerre.\n@c2@"
  it: "@a@b*: Lord Psaro è molto previdente. Ha costruito una stanza segreta da qualche parte nella torre, un nascondiglio da usare in caso di guerra.\n@c2@"
  ja: "@a@b＊「あのかたは　用心深いかたで\n\tいくさに備えて　塔のどこかに\n\tかくし部屋をつくったらしい。\n@c2@"
"26":
  de: "@a@b*: Und es heißt, dass er dort die Liebe seines Lebens versteckt hält.\n@c2@"
  en: "@a@b*: They say he's hiding the love of his life in there, too.\n@c2@"
  es: "@a@b*: También, dicen que oculta en ella al amor de su vida.\n@c2@"
  fr: "@a@b*ⓢ On dit aussi qu'il y garde son grand amour.\n@c2@"
  it: "@a@b*: Si dice anche che lì dentro abbia nascosto il grande amore della sua vita.\n@c2@"
  ja: "@a@b＊「そして　そこに　愛しい人を\n\tかくまっていなさったんだが……。\n@c2@"
"27":
  de: "@a@b*: (Schlürf!) Ich hab da neulich was aufgeschleimt. Das könnt Euch interessieren!\n@c1@"
  en: "@a@b*: (slurp) Here's an interesting bit of ooze for you.\n@c1@"
  es: "@a@b*: (¡slurp!) Tengo una noticia limosamente interesante que dar%H860%Xte%Yos%Z.\n@c1@"
  fr: "@a@b*ⓢ (Slurpⓠ) Voilà quelque chooose qui devrait vous intéresser.\n@c1@"
  it: "@a@b*: Slurp! %H860%XAscolta%YAscoltate%Z... Slurp!\n@c1@"
  ja: "@a@b＊「ぷるぷる……。\n\tぼく　聞いちゃったんだ。\n@c1@"
"28":
  de: "@a@b*: Ich hab nämlich gehört, was Psaro an Rosis Grab geblubbert hat.\n@c1@"
  en: "@a@b*: I heard Psaro saying things at Rose's goombstone.\n@c1@"
  es: "@a@b*: Oí como Psaro hablaba en la tumba de Rosa.\n@c1@"
  fr: "@a@b*ⓢ J'ai entendu Psarooo dire des choooses devant la tombe de Rooose.\n@c1@"
  it: "@a@b*: Ho slimentito che Psaro pronunciava delle parole davanti alla lapide di Rosa.\n@c1@"
  ja: "@a@b＊「ピサロさま　ロザリーちゃんのお墓に\n\tひとりで　こう言ってたんだ。\n@c1@"
"29":
  de: "@a@b*: Er will sein Versprechen halten und nach seiner Wiedergeburt mit ihr zusammen sein. Ist das nicht schwabbelig? Will er denn auch sterben?\n@c1@"
  en: "@a@b*: He said that when he's reborn, he'll be sure to fulfil their promise to be together.\nDoes that mean he wants to die, goo?\n@c1@"
  es: "@a@b*: Decía que, cuando renaciese, se aseguraría de cumplir su promesa de estar junto a ella. Eso no querrá decir que él quiere morir también, ¿verdad?\n@c1@"
  fr: "@a@b*ⓢ Il a dit que lorsqu'il renaîtrait, il tiendrait leur prooomesse d'être ensemble. Est-ce que ça veut diiire qu'il veut mouriiir, lui aussiiiⓡ\n@c1@"
  it: "@a@b*: Ha detto che, una volta tornato in vita, avrebbe mantenuto la promessa di stare sempre insieme.\n㈡\n*: Slimegnifica forse che ha anch'egli intenzione di morire?!\n@c1@"
  ja: "@a@b＊「ふたりで暮らす約束は\n\t生まれ変わって　必ず果たすって。\n\tピサロさま　死ぬ気なのかなあ……。\n@c1@"
"30":
  de: "@a@b*: Seit die Elfen von den Menschen aus ihrer alten Heimat vertrieben wurden, leben sie unter dem großen Weltenbaum Yggdrasil.\n@c1@"
  en: "@a@b*: Since the elves were chased out of their old home by the humans, they've taken up residence under the Great World Tree, Yggdrasil.\n@c1@"
  es: "@a@b*: Desde que los humanos los expulsaron de su antiguo hogar, los elfos habitan bajo el Gran Árbol del Mundo, Yggdrasil.\n@c1@"
  fr: "@a@b*ⓢ Depuis que les elfes ont été chassés de leurs anciennes terres par les humains, ils ont élu domicile sous le Grand arbre du Monde, l'Yggdrasil.\n@c1@"
  it: "@a@b*: Da quando gli elfi sono stati cacciati dalle loro vecchie case dagli umani, si sono trasferiti sotto Ygdrasil, il Grande Albero del mondo.\n@c1@"
  ja: "@a@b＊「人間たちに　住む場所を追われた\n\tエルフは　今は　世界樹に\n\t寄りそうように　暮らしています。\n@c1@"
"31":
  de: "@a@b*: Ich weiß nicht, warum sie ausgerechnet diesen Ort gewählt haben.\n@c1@"
  en: "@a@b*: I don't know why they chose that place of all places.\n@c1@"
  es: "@a@b*: No sé por qué eligieron ese lugar en concreto.\n@c1@"
  fr: "@a@b*ⓢ Je ne sais pas pourquoi ils ont choisi cet endroit plutôt qu'un autre.\n@c1@"
  it: "@a@b*: Non so come mai abbiano deciso di insediarsi proprio in quel posto.\n@c1@"
  ja: "@a@b＊「なぜ　エルフたちが\n\tその場所を　えらんだのかは\n\tわかりませんが……。\n@c1@"
"32":
  de: "@a@b*: Aber vielleicht wissen sie ja was, das ich nicht weiß. Ich bin schließlich keine Elfe, nicht?\n@c1@"
  en: "@a@b*: But maybe they know something I don't.\nAfter all, I'm no elf, am I?\n@c1@"
  es: "@a@b*: Pero quizá sepan algo que yo no sé.\n¡Después de todo, yo no soy una elfa!\n@c1@"
  fr: "@a@b*ⓢ Mais peut-être qu'ils savent quelque chose que j'ignore.\nAprès tout, je ne suis pas un elfe, n'est-ce pasⓡ\n@c1@"
  it: "@a@b*: Ma probabilmente sanno qualcosa che non so. Dopotutto io non sono mica un'elfa, no?\n@c1@"
  ja: "@a@b＊「エルフたち自身なら　なにか\n\t知っているかもしれませんね。\n@c1@"
"33":
  de: "@a@b*: Aber sie scheinen sehr glücklich zu sein, dort, im Schatten des Yggdrasil.\n@c1@"
  en: "@a@b*: Yes, they seem very happy living under Yggdrasil, though.\n@c1@"
  es: "@a@b*: Bueno, parecen muy felices viviendo bajo Yggdrasil.\n@c1@"
  fr: "@a@b*ⓢ Enfin, ils ont quand même l'air très heureux de vivre sous l'Yggdrasil.\n@c1@"
  it: "@a@b*: Comunque, sembra che si trovino molto bene a vivere sotto Ygdrasil.\n@c1@"
  ja: "@a@b＊「エルフたちは　今\n\t世界樹に　寄りそうように\n\t暮らしているそうですわ。\n@c1@"
"34":
  de: "@a@b*: Na, sieh einer an... %H860%XEin Mensch%YMenschen%Z! Es ist schon eine Weile her, dass Menschen hier waren.\n@c1@"
  en: "@a@b*: Well, well, well... %H860%XA human%YHumans%Z!\nItⓙs been a long time since any humans came here.\n@c1@"
  es: "@a@b*: Vaya, vaya, vaya... ¡%H860%X%A120%XUn humano%Z%B120%XUna humana%Z%YHumanos%Z!\nHace mucho tiempo que no viene ningún humano por aquí.\n@c1@"
  fr: "@a@b*ⓢ Tiens, tiens, tiens... %H860%Xun être humain%Ydes humains%Zⓠ\nCela fait bien longtemps que je n'avais pas vu un représentant de votre race.\n@c1@"
  it: "@a@b*: Bene, bene... %H860%XUn umano%YDegli umani%Z!\nEra da tanto tempo che non si vedevano esseri umani da queste parti.\n@c1@"
  ja: "@a@b＊「あら　この村に\n\t人間がやってくるなんて\n\tめずらしいわね。\n@c1@"
"35":
  de: "@a@b*: Willkommen in El Forado.\n@c1@"
  en: "@a@b*: Welcome to El Forado.\n@c1@"
  es: "@a@b*: %H860%X%A120%XBienvenido%Z%B120%XBienvenida%Z%Y%R000%XBienvenidas%YBienvenidos%Z%Z a El Forrado.\n@c1@"
  fr: "@a@b*ⓢ Bienvenue à El Forado.\n@c1@"
  it: "@a@b*: %H860%X%A120%XBenvenuto%Z%B120%XBenvenuta%Z%Y%R000%XBenvenute%YBenvenuti%Z%Z a El Forado.\n@c1@"
  ja: "@a@b＊「ここは　エルフの里よ。\n@c1@"
"36":
  de: "@a@b*: Grrr-rff! Der große Baum hier ist der Weltenbaum Yggdrasil.\n@c2@"
  en: "@a@b*: Grrr-ruff! The big tree here is the Great World Tree, Yggdrasil.\n@c2@"
  es: "@a@b*: ¡Grrr-ruff! El árbol grande es el Gran Árbol del Mundo, Yggdrasil.\n@c2@"
  fr: "@a@b*ⓢ Grrr ououffⓠ Cet arbre gigantesque est l'Yggdrasil, le Grand arbre du Monde.\n@c2@"
  it: "@a@b*: Grrr-ruff! Questo è Ygdrasil, il Grande Albero del mondo.\n@c2@"
  ja: "@a@b＊「こんこん。\n\tこの村にある　大木は\n\t世界樹だよ。\n@c2@"
"37":
  de: "@a@b*: Miau...\nYggdrasil spendet genug Schatten für alle. Genau richtig für ein kleines Nickerchen...\n@c1@"
  en: "@a@b*: Meow...\nYggdrasil gives enough shade for everyone.\nJust right for catnapping...\n@c1@"
  es: "@a@b*: Miau...\nYggdrasil proporciona cobijo a todo el mundo.\nPerrrfecto para una siesta gatuna...\n@c1@"
  fr: "@a@b*ⓢ Miaouu...\n㈡\n*ⓢ L'Yggdrasil fait suffisamment d'ombre pour que tout le monde en profite... pour faire une sieste, par exemple...\n@c1@"
  it: "@a@b*: Miao...\nYgdrasil è abbastanza grande da far ombra a tutti.\nÈ l'ideale purrr schiacciare un pisolino...\n@c1@"
  ja: "@a@b＊「にゃーん。\n\t世界樹の木かげは\n\tすずしくて　きもちいいニャー。\n@c1@"
"38":
  de: "@a@b*: Diese Monster heutzutage!\nSie belästigen sogar schon Yggdrasil. Nein, nirgendwo kann man mehr sicher sein...\n@c3@"
  en: "@a@b*: The monsters of today! Theyⓙre even infesting Yggdrasil these days. Nope.\nNowhereⓙs safe any more...\n@c3@"
  es: "@a@b*: ¡Los monstruos de hoy!\nEn estos días incluso infestan Yggdrasil.\nNo. Ya no hay ningún lugar seguro...\n@c3@"
  fr: "@a@b*ⓢ Ah les monstres d'aujourd'huiⓠ\nIls envahissent même l'Yggdrasil.\nVraiment, il n'y a plus d'endroit sûr de nos jours...\n@c3@"
  it: "@a@b*: Ah, questi mostri di oggi!\nInfestano persino Ygdrasil ultimamente. Non c'è niente da fare, non si sta tranquilli da nessuna parte...\n@c3@"
  ja: "@a@b＊「近ごろ　世界樹にも\n\t魔物たちが　住みつきだしてのう。\n\tぶっそうな世の中じゃわい……。\n@c3@"
"39":
  de: "@a@b*: Es heißt, dass Yggdrasil-Blätter jenen helfen, die ein reines Herz besitzen.\n@c1@"
  en: "@a@b*: It's said that Yggdrasil leaves can grant help to those who are pure of heart.\n@c1@"
  es: "@a@b*: Según se dice, las hojas de Yggdrasil ayudan a aquellos que tienen un corazón puro.\n@c1@"
  fr: "@a@b*ⓢ On raconte que les feuilles d'Yggdrasil peuvent apporter de l'aide à ceux dont le cœur est pur.\n@c1@"
  it: "@a@b*: Si dice che le foglie di Ygdrasil aiutino i puri di cuore.\n@c1@"
  ja: "@a@b＊「世界樹の葉は　心正しき旅人を\n\t助けるものと　聞きます。\n@c1@"
"40":
  de: "@a@b*: Und dass Yggdrasil-Blumen wahre Wunder bewirken können.\n@c1@"
  en: "@a@b*: And that Yggdrasil flowers have the power to make miracles happen.\n@c1@"
  es: "@a@b*: Y las flores de Yggdrasil tienen el poder de hacer que sucedan milagros.\n@c1@"
  fr: "@a@b*ⓢ Et que les fleurs d'Yggdrasil ont le pouvoir de réaliser des miracles.\n@c1@"
  it: "@a@b*: E che i fiori di Ygdrasil abbiano persino il potere di far accadere miracoli!\n@c1@"
  ja: "@a@b＊「そして　世界樹の花は\n\t奇跡を起こすそうですわ。\n@c1@"
"41":
  de: "@a@b*: Yggdrasil-Blumen sind atemberaubend schön!\n@c1@"
