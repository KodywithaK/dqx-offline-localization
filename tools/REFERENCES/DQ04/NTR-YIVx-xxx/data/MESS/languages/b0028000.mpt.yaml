"43":
  de: "@a@b*: Das sind die Privatgemächer des Prinzen. Gewöhnliche Waffenhändler sind hier nicht erwünscht.\n@c1@"
  en: "@a@b*: This here is the Prince's personal chamber. 'Tis no place for a common arms merchant.\n@c1@"
  es: "@a@b*: Estos son los aposientos privados del Príncipe. No es liugar para un vulgar mercadier de armas.\n@c1@"
  fr: "@a@b*ⓢ Vous êtes dans le cabinet du prince. Un simple marchand d'armes n'a rien à y faire.\n@c1@"
  it: "@a@b*: Questa è la hamera personale de i'Pprincipe. 'Un semplice mercante d'armi 'un pole miha sta' qui!\n@c1@"
  ja: "@a@b＊「ここは　王子さまの　お部屋。\n\t武器商人ふぜいの\n\t来てよい所では　ありません。\n@c1@"
"44":
  de: "@a@b*: Das hier ist der Kerker! Es ist streng verboten, mit den Gefangenen zu sprechen. Verschwinde!\n@c2@"
  en: "@a@b*: This is the dungeon! Talkin' with the convicts is strictly forbidden, so it is.\nGet away outta here!\n@c2@"
  es: "@a@b*: ¡Esto son las mazmorras! Está terminiantemente prohibido hablar con los presos, sí. ¡Fuera de aquí!\n@c2@"
  fr: "@a@b*ⓢ Ohⓠ C'est un donjon iciⓠ Il est interdit de parler avec les prisonniers. Fichez-moi le campⓠ\n@c2@"
  it: "@a@b*: Queste sono le prigioni! 'Un si pole parla' co' prigionieri! Fori!\n@c2@"
  ja: "@a@b＊「ここは　牢獄！\n\t囚人と　話すこと　まかりならぬ！\n\tさあ　出てゆかれよ。\n@c2@"
"45":
  de: "@a@b*: Wer bist du?\n@c2@"
  en: "@a@b*: Who are you?\n@c2@"
  es: "@a@b*: ¿Quién eres?\n@c2@"
  fr: "@a@b*ⓢ Qui êtes-vousⓡ\n@c2@"
  it: "@a@b*: Chi %H860%Xsei%Ysiete%Z?\n@c2@"
  ja: "@a@b＊「何者だっ！？\n@c2@"
