"47":
  de: "@a@b*: Ich? Ich bin der beste Dieb der ganzen Welt! Und kein gewöhnlicher Gauner wie der da hinten!\n@c2@"
  en: "@a@b*: Me? I'm only the finest thief on the Goddess-given earth! Not like himself over there, the common crook!\n@c2@"
  es: "@a@b*: ¿Yo? ¡Sioy el mejor ladrón de toda esta tierra bendiecida por la Diosa! ¡No como ese ratiero de tiercera de ahí!\n@c2@"
  fr: "@a@b*ⓢ Moiⓡ Je suis le plus grand voleur que cette terre ait portéⓠ Rien à voir avec ce petit escroc, là-basⓠ\n@c2@"
  it: "@a@b*: Io? Io sono il ladro più in gamba del mondo! Non sono mica come quello lì, che non riuscirebbe a rubare nemmeno una gallina!\n@c2@"
  ja: "@a@b＊「オレさまは　天下の大ドロボウだ！\n\tしかし　あっちに　入れられてるのは\n\tケチな　盗っ人やろうよ。\n@c2@"
"48":
  de: "@a@b*: Er ist ein nutzloser Schuft aus Lakanaba!\n@c2@"
  en: "@a@b*: He's a worthless gurrier from Lakanaba, so he is.\n@c2@"
  es: "@a@b*: No es más que un sinvergüenza de Lakanaba, sí.\n@c2@"
  fr: "@a@b*ⓢ Ce n'est qu'un pauvre type de Lakanabaⓠ\n@c2@"
  it: "@a@b*: Lui è il guerriero più debole di tutta Lacanata.\n@c2@"
  ja: "@a@b＊「なんでも　レイクナバから\n\tやってきたらしいぜ。\n@c2@"
"49":
  de: "@a@b*: Du kannst ihn vielleicht nicht sehen, den Kerl in der Zelle dort, aber er ist da. Schläft wahrscheinlich in der hintersten Ecke.\n@c2@"
  en: "@a@b*: Ye might not be able to see the fella in the cell over there, but he's inside, to be sure. Sleepin' at the back, I expect.\n@c2@"
  es: "@a@b*: A lo miejor no puedes ver al tipo de esa celda, pero sieguro que está dentro. Estiará durmiendo ahí atrás.\n@c2@"
  fr: "@a@b*ⓢ Vous ne voyez peut-être pas le gars dans le cachot à côté, mais il est là. Il doit être au fond en train de dormir.\n@c2@"
  it: "@a@b*: Forse da qui non si vede, ma c'è un altro tipo nella cella in fondo, e scommetto che sta dormendo.\n@c2@"
  ja: "@a@b＊「あっちに入れられてる　男の姿が\n\t見えなくなったけど　奥のほうで\n\tゴロ寝でも　してるんだろ。\n@c2@"
"50":
  de: "@a@b*: Torneko? Torneko Talun? Stimmt doch, oder? Ich bin's. Der Sohn vom Alten Hans... Hänschen.\n@c2@"
  en: "@a@b*: Torneko? Torneko Taloon? I'm right, aren't I?\n'Tis meself, look! Old Man Finn's son...Finnegan.\n@c2@"
  es: "@a@b*: ¿Torneko? ¿Torneko Taloon? ¿Eres tú, vierdad?\n¡Soy yo, mira! Soy Ben Bin, el hijo del viejo Bin.\n@c2@"
  fr: "@a@b*ⓢ Tornekoⓡ Torneko Taloonⓡ C'est bien vousⓡ J'me trompe pasⓡ\n㈡\n*ⓢ C'est moi, Flinn le Jeuneⓠ Le fils de Flinn l'Ancien...\n@c2@"
  it: "@a@b*: Baldo? Baldo Baldini? Ho sentito bene?!? So' qui! Oh, guarda! So' Duccio, i'ffigliolo de i'vvecchio Santino!\n@c2@"
  ja: "@a@b＊「トルネコ！　トルネコさんだろ？\n\tオレだよ　オレ！\n\tそそそ　トムじいさんの息子だよ。\n@c2@"
"51":
  de: "@aHänschen@bIch hab mir ganz schön Ärger eingehandelt und bin dann hier gelandet, aber ich werd bestimmt nie wieder etwas anstellen.\n@c2@"
  en: "@aFinnegan@bI made a bags of everytin' an' ended up in here, but I've done a lot o' thinkin' an' I'll not be criminalisin' again.\n@c2@"
  es: "@aBen Bin@bTodo mi salió mal y he vienido a parar aquí, pero he estado piensando y no voy a ser más un dielincuente.\n@c2@"
  fr: "@aFlinn le Jeune@bJ'ai fait beaucoup de bêtises et je me suis retrouvé ici. J'ai pas mal réfléchi depuis et je vais me ranger.\n@c2@"
  it: "@aDuccio@bHo fatto un mucchio di bischerate nella mi' vita, ma ora che ho avuto tempo pe' riflette', ho deciso che 'un mi homporterò più male.\n@c2@"
  ja: "@a@b＊「ヘマをして　ここに　入れられて\n\tつくづく　思ったんだ。\n\tもう　悪いことは　まっぴらだって。\n@c2@"
"52":
  de: "@aHänschen@bIhr seid doch Händler, Herr Talun, oder? Ihr könnt mir doch einen Chimärenflügel besorgen, nicht wahr?\n@c2@"
  en: "@aFinnegan@bYe're a trader, aren't ye, Mr. Taloon? Ye could fetch me a chimaera wing then, could ye not?\n@c2@"
  es: "@aBen Bin@bEres miercader, ¿vierdad, Taloon? Entonces sieguro que podrás consieguirme un ala de quimera.\n@c2@"
  fr: "@aFlinn le Jeune@bVous êtes marchand, Monsieur Taloon, nonⓡ Alors vous pourriez pas me passer une aile de chimère, par hasardⓡ\n@c2@"
  it: "@aDuccio@bTe sei un mercante, 'unn è vero Baldo? 'Un potresti miha procurarmi un'Ala di chimera?\n@c2@"
  ja: "@a@b＊「あんた　商人だったよな。\n\tだったら　キメラのつばさを\n\t買ってきておくれよ。\n@c2@"
"53":
  de: "@aHänschen@bAch, Ihr habt einen dabei? Ich flehe Euch an, gebt ihn mir. Ich mache alles wieder gut, wenn ich zu Hause bin.\n@c2@"
  en: "@aFinnegan@bYe have one on ye already, ye say?\nThen I'm beggin' ye. Give it me now, an' I'll make it up to ye back home, like. \n@c2@"
  es: "@aBen Bin@b¿Dices que tienes una?\n¡Ti lo ruego! ¡Si mi la das, cuando volvamos a casa ti compiensiaré, seguro! \n@c2@"
  fr: "@aFlinn le Jeune@bVous en avez bien une sur vousⓡ\nJe vous en supplie. Donnez-la-moi et je vous rembourserai quand je serai au village.\n@c2@"
  it: "@aDuccio@bCome dici? Ce l'hai qui con te? Ti supplico, dammela! Mi sdebiterò con te huando saremo a casa.\n@c2@"
  ja: "@a@b＊「え？　もう　持ってるって？\n\tだったら　それを　オレに　くれよ！\n\t町に帰ったら　礼をするからさ！\n@c2@"
"54":
  de: "@aHänschen@bDanke schön, Herr Talun. Ihr seid wirklich großzügig. Und ich schwöre bei meinem Leben, dass ich nie wieder etwas anstellen werde.\n@c2@"
  en: "@aFinnegan@bThank ye, Mr. Taloon. Ye're a grand fella, so y'are. An' I promise on me life that I won't be doin' nuttin' wrong again.\n@c2@"
  es: "@aBen Bin@bGracias, Taloon. Eres un buen tipo, sí. Y prometo por mi vida que niunca más volvieré a hacer nada malo.\n@c2@"
  fr: "@aFlinn le Jeune@bMerci, Monsieur Taloon. Vous êtes quelqu'un de bien. Et je vous promets sur ma tête que je ferai plus rien de mal.\n@c2@"
  it: "@aDuccio@bGrazie, Baldo. 'Un so come ringraziarti. Ti giuro che 'un farò più nulla di sbagliato in tutta la mi' vita!\n@c2@"
  ja: "@a@b＊「ひゃー　ありがてえ！\n\tわかってるって！　町に帰ったら\n\t真面目に　はたらくことにするから。\n@c2@"
"55":
  de: "@aHänschen@bWir sehen uns dann zu Hause in Lakanaba. Auf Wiedersehen.\n@c2@"
  en: "@aFinnegan@bI'll be seein' ye back in Lakanaba, then.\nBye, now.\n@c2@"
  es: "@aBen Bin@bNos viemos en Lakanaba, pues.\nHasta la vista.\n@c2@"
  fr: "@aFlinn le Jeune@bNous nous reverrons à Lakanaba.\nAu revoir.\n@c2@"
  it: "@aDuccio@bCi si vede a Lacanata! Ti saluto!\n@c2@"
  ja: "@a@b＊「じゃあ　ひと足先に\n\t町に　帰ってるぜっ！\n@c2@"
"56":
  de: "@a@bHänschen schleudert den Chimärenflügel hoch in die Luft.\n@c2@"
  en: "@a@bFinnegan tosses the chimaera wing into the air.\n@c2@"
  es: "@a@bBen Bin lanza el ala de quimera al aire.\n@c2@"
  fr: "@a@bFlinn le Jeune lance l'aile de chimère en l'air.\n@c2@"
  it: "@a@bDuccio lancia in aria l'Ala di chimera.\n@c2@"
