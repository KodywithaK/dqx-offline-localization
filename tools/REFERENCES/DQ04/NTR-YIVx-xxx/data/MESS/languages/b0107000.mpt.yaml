"0":
  de: "@a@bEr schläft tief und fest.\nUm seinen Hals hängt eine Bronze-Gebetskette.\n@c2@"
  en: "@a@bHe's in a deep sleep.\nA bronze rosary is hanging around his neck.\n@c2@"
  es: "@a@bEstá sumido en un profundo sueño.\nUn rosario de bronce cuelga de su cuello.\n@c2@"
  fr: "@a@bIl dort profondément.\nUn rosaire de bronze est accroché à son cou.\n@c2@"
  it: "@a@bDorme profondamente.\nDal collo pende un Rosario di bronzo.\n@c2@"
  ja: "@a@bよく眠っているようだ。\n胸に　ブロンズの十字架をかけている。\n@c2@"
"1":
  de: "@a@b*: Ha ha! Was macht Ihr denn hier?\n@c2@"
  en: "@a@b*: Ha ha! Wot %H860%Xyou%Yyou lot%Z doinⓙ ⓙere?\n@c2@"
  es: "@a@b*: ¡Ja, ja! ¿Qué %H860%Xhaces%Yhacéis%Z aquí?\n@c2@"
  fr: "@a@b*ⓢ Ohⓠ Qu'est-ce que vous faites iciⓡ\n@c2@"
  it: "@a@b*: Ehi! Che %H860%Xstai%Ystate%Z facendo qui?\n@c2@"
  ja: "@a@b＊「やや！　あなたたちは！\n@c2@"
"2":
  de: "@a@b*: Seid mir wohl gefolgt, was?\nTja, tut mir leid, aber so leicht mache ich es Euch nicht.\n@c2@"
  en: "@a@b*: Come after me, ⓙave ya?\nWell, Iⓙm afraid I ainⓙt caught that easy.\n@c2@"
  es: "@a@b*: Me %H860%Xhas%Yhabéis%Z seguido, ¿no?\nBueno, pues no va a ser tan fácil pillarme.\n@c2@"
  fr: "@a@b*ⓢ Vous me poursuivez, c'est çaⓡ\nDésolé, mais on ne m'attrape pas aussi facilementⓠ\n@c2@"
  it: "@a@b*: Mi %H860%Xhai%Yavete%Z seguito, eh? Ma io non sono tipo da lasciarsi prendere tanto facilmente!\n@c2@"
  ja: "@a@b＊「わたしを　とらえにきましたか！\n\tでも　残念ながら\n\tつかまるわけには　いきませんね！\n@c2@"
"3":
  de: "@a@b*: Ihr lasst mir keine andere Wahl.\nEs wird Zeit für eine kleine Keilerei.\n@c2@"
  en: "@a@b*: You donⓙt leave me no choice.\nItⓙs fisticuffs time for you.\n@c2@"
  es: "@a@b*: No me %H860%Xdejas%Ydejáis%Z elección.\nHa llegado el momento de usar los puños.\n@c2@"
  fr: "@a@b*ⓢ Je vois que vous ne me laissez pas le choix.\nVous allez vous prendre une raclée.\n@c2@"
  it: "@a@b*: Non mi %H860%Xlasci%Ylasciate%Z scelta! %H860%XTi%YVi%Z ridurrò in poltiglia!\n@c2@"
  ja: "@a@b＊「くそーっ！！\n\tかくなる上は　腕ずくだぁ！\n@c2@"
"4":
  de: "@a@b*: Puh, da hab ich mich wohl getäuscht.\nTut mir echt leid, das Ganze... Ich hoffe, Ihr könnt mir verzeihen?\n@c2@"
  en: "@a@b*: Blimey! I, I was wrong.\nAnⓙ Iⓙm sorry anⓙ all that.\n...Now youⓙll forgive me, right?\n@c2@"
  es: "@a@b*: ¡Vaya! Yo, yo estaba equivocado.\nLo siento y todo eso.\n... ¿A que me %H860%Xperdonas%Yperdonáis%Z?\n@c2@"
  fr: "@a@b*ⓢ Bon d'accord, j'... j'ai eu tort.\nEt je suis désolé et voilàⓠ\n... Vous allez me pardonner, maintenant, pas vraiⓡ\n@c2@"
  it: "@a@b*: Per tutti i bottini, è andata male.\nMi spiace, e sono pentito e compagnia bella. Va bene così? Allora, mi %H860%Xperdoni%Yperdonate%Z?\n@c2@"
  ja: "@a@b＊「わー！\n\tわたしが　悪うございました！\n\tどうか　お許しください！\n@c2@"
"5":
  de: "@a@b*: Nicht schlecht, %a00140.\nIch bin beeindruckt.\n@c2@"
  en: "@a@b*: Nice work, %a00140.\nIⓙm impressed.\n@c2@"
  es: "@a@b*: Buen trabajo, %a00140.\nEstoy impresionada.\n@c2@"
  fr: "@a@b*ⓢ Bravo, %a00140.\nJe suis impressionnée.\n@c2@"
  it: "@a@b*: Accidenti, %a00140!\nSono senza parole... \n@c2@"
  ja: "@a@b＊「%a00140どの　お見事！\n@c2@"
"6":
  de: "@a@b*: Ihre Majestät hat mir aufgetragen, Euch zu folgen.\n@c2@"
  en: "@a@b*: Her Majesty ordered me to follow you.\n@c2@"
  es: "@a@b*: Su Majestad me ordenó que %H860%X%A120%Xle%Z%B120%Xla%Z%Y%R000%Xlas%Yles%Z%Z siguiera.\n@c2@"
  fr: "@a@b*ⓢ Sa Majesté m'avait ordonné de vous suivre.\n@c2@"
  it: "@a@b*: Sua Maestà mi ha ordinato di %H860%Xseguirti%Yseguirvi%Z.\n@c2@"
  ja: "@a@b＊「女王さまの命令で\n\tあなたたちを　つけてきたのです。\n@c2@"
"7":
  de: "@a@b*: Ich soll Euch helfen, falls Ihr in Schwierigkeiten geratet.\n@c2@"
  en: "@a@b*: She asked that I help you if you were in any trouble.\n@c2@"
  es: "@a@b*: Me pidió que %H860%Xle%Yles%Z ayudara si %H860%Xtenía%Ytenían%Z algún problema.\n@c2@"
  fr: "@a@b*ⓢ Elle m'avait demandé de vous aider en cas de pépin.\n@c2@"
  it: "@a@b*: Mi ha chiesto di %H860%Xaiutarti, se ne avessi%Yaiutarvi, se ne aveste%Z avuto bisogno.\n@c2@"
  ja: "@a@b＊「女王さまは　おっしゃいました。\n\tもし　困っているようなら\n\tチカラになってあげなさいと……。\n@c2@"
"8":
  de: "@a@b*: Aber genug geredet! Ich muss diesen Schlappschwanz jetzt zur Burg bringen.\n@c2@"
  en: "@a@b*: But enough chit chat! Now I must take this disgrace of a man back to the castle.\n@c2@"
  es: "@a@b*: ¡Pero ya basta de charla! Ahora debo llevar a ese deshecho humano al castillo.\n@c2@"
  fr: "@a@b*ⓢ Trêve de bavardagesⓠ Je dois ramener ce misérable au château. \n@c2@"
  it: "@a@b*: Ora basta con le chiacchiere. Devo riportare questo brigante al castello.\n@c2@"
  ja: "@a@b＊「ともかく！\n\tこの者は　わたしがひと足先に\n\tお城に連れて帰ります。\n@c2@"
"9":
  de: "@a@b*: Ich verlasse mich darauf, dass Ihr bald nachkommt, %a00140. Bis dann!\n@c2@"
  en: "@a@b*: I trust youⓙll be along soon, %a00140.\nUntil then!\n@c2@"
  es: "@a@b*: Confío en que regresará pronto, %a00140.\n¡Hasta entonces!\n@c2@"
  fr: "@a@b*ⓢ J'espère vous revoir bientôt, %a00140.\nÀ plus tardⓠ\n@c2@"
  it: "@a@b*: Spero che presto passerai da noi, %a00140.\nArrivederci!\n@c2@"
  ja: "@a@b＊「%a00140どのも\n\t早く　お城におもどりください。\n\tでは！\n@c2@"
"10":
  de: "@a@b*: Willkommen auf Burg Femiscyra.\n@c2@"
  en: "@a@b*: Welcome to Femiscyra Castle.\n@c2@"
  es: "@a@b*: %H860%X%A120%XBienvenido%Z%B120%XBienvenida%Z%Y%R000%XBienvenidas%YBienvenidos%Z%Z al Castillo de Feministia.\n@c2@"
  fr: "@a@b*ⓢ Bienvenue au château de Fémiscyra.\n@c2@"
  it: "@a@b*: %H860%X%A120%XBenvenuto%Z%B120%XBenvenuta%Z%Y%R000%XBenvenute%YBenvenuti%Z%Z al castello di Femiscyra.\n@c2@"
  ja: "@a@b＊「ガーデンブルグのお城に\n\tようこそ　いらっしゃいました。\n@c2@"
"11":
  de: "@a@b*: Wir hatten schon sehr, sehr lange keinen Besuch mehr.\n@c2@"
  en: "@a@b*: Itⓙs been a long, long time since we've had any visitors.\n@c2@"
  es: "@a@b*: Hace mucho tiempo que no recibimos visita alguna.\n@c2@"
  fr: "@a@b*ⓢ Cela fait bien longtemps que nous n'avons pas reçu de visiteurs.\n@c2@"
  it: "@a@b*: Era da lungo tempo che non avevamo visitatori.\n@c2@"
  ja: "@a@b＊「外から　お客さまが　来るなんて\n\t何年ぶりのことでしょう。\n@c2@"
"12":
  de: "@a@b*: In der Burg sind nur Frauen zugelassen. Denn unsere Königin ist so schön, dass alle Männer von ihr geblendet werden!\n@c2@"
  en: "@a@b*: Only women are allowed to live here in the castle. Our queen is too beautiful for men to bear!\n@c2@"
  es: "@a@b*: Solo las mujeres tienen permiso para vivir en este castillo. Nuestra reina es demasiado hermosa como para que los hombres puedan soportarlo.\n@c2@"
  fr: "@a@b*ⓢ Seules les femmes sont autorisées à vivre dans ce château. Les hommes ne peuvent supporter l'incroyable beauté de notre reineⓠ\n@c2@"
  it: "@a@b*: Solo le donne possono vivere nel castello: la nostra Regina è talmente bella che gli uomini non riuscirebbero nemmeno a guardarla!\n@c2@"
  ja: "@a@b＊「ここは　女だけが住むお城。\n\tわが女王さまは\n\tとても　美しいお方ですわ。\n@c2@"
"13":
  de: "@a@b*: Puh!\nDas war knapp!\n@c2@"
  en: "@a@b*: Phew!\nThat was close!\n@c2@"
  es: "@a@b*: ¡Uf!\n¡Faltó poco!\n@c2@"
  fr: "@a@b*ⓢ Pfiouⓠ\nC'était moins uneⓠ\n@c2@"
  it: "@a@b*: Fiuuuuu!\nC'è mancato poco!\n@c2@"
  ja: "@a@b＊「ふー。\n\tたばこが　おいしい……。\n@c2@"
"14":
  de: "@a@b*: Nur eine Sekunde später, und Ihr hättet mich mittendrin erwischt!\n@c2@"
  en: "@a@b*: If you'd come a second later, you'd have caught me in the act!\n@c2@"
  es: "@a@b*: ¡Si %H860%Xhubiera%Yhubieran%Z llegado unos segundos antes me %H860%Xhubiera%Yhubieran%Z pillado in fraganti!\n@c2@"
  fr: "@a@b*ⓢ Une seconde plus tard, vous m'auriez pris en flagrant délitⓠ\n@c2@"
  it: "@a@b*: Bastava che %H860%Xtu arrivassi%Yvoi arrivaste%Z solo qualche attimo dopo, e mi %H860%Xavresti%Yavreste%Z colto con le mani nel sacco.\n@c2@"
  ja: "@a@b＊「お城の中は　禁煙なので\n\tこうして　外に出て吸ってるんだ。\n@c2@"
"15":
  de: "@a@b*: Ich weiß, das darf man nicht, aber...\nNun ja, da drinnen gibt es halt nur Latrinen für Frauen, was bleibt mir da anderes übrig?\n@c2@"
  en: "@a@b*: I know I shouldn't really, but...\nWell, there are only women's toilets inside, so what's a man to do?\n@c2@"
  es: "@a@b*: Sé que no debería hacerlo, pero...\nBueno, solo hay aseos de señoras en el interior así que, ¿qué se supone que tiene que hacer un hombre?\n@c2@"
  fr: "@a@b*ⓢ Je sais bien que ça se fait pas, mais... il n'y a que des toilettes pour femmes ici.\nJe fais comment, moiⓡ\n@c2@"
  it: "@a@b*: So che non avrei dovuto farlo, ma... Insomma, lì dentro ci sono solo bagni da donna! Cosa deve mai fare un poveraccio, eh?\n@c2@"
  ja: "@a@b＊「ホントは　たばこが　やめられたら\n\tいいんだけどね……。\n@c2@"
"16":
  de: "@a@b*: Nanu?! %H860%X%A120%XEin Reisender%Z%B120%XEine Reisende%Z%YReisende%Z!\nDann ist der Weg wohl wieder frei, was?\n@c1@"
  en: "@a@b*: Oh, look! %H860%XA traveller%YTravellers%Z!\nSo, is the path clear again now, then?\n@c1@"
  es: "@a@b*: ¡Oh, mira! ¡%H860%X%A120%XUn viajero%Z%B120%XUna viajera%Z%Y%R000%XViajeras%YViajeros%Z%Z!\nEntonces, ¿el camino vuelve a estar abierto?\n@c1@"
  fr: "@a@b*ⓢ Oh, %H860%X%A120%Xun voyageur%Z%B120%Xune voyageuse%Z%Y%R000%Xdes voyageuses%Ydes voyageurs%Z%Zⓠ\nLe sentier est de nouveau praticable, si je comprends bienⓡ\n@c1@"
  it: "@a@b*: Oh, %H860%Xviandante, dimmi%Yviandanti, ditemi%Z... la strada è di nuovo sgombra adesso?\n@c1@"
  ja: "@a@b＊「あら？　旅の人ね！\n\tということは　ふさがっていた\n\t道も　元にもどったわけ？\n@c1@"
"17":
  de: "@a@b*: Das sind gute Neuigkeiten. Seit der Vulkan-\nausbruch ihn blockiert hat, war das Leben hier wirklich nicht leicht.\n@c1@"
  en: "@a@b*: Thatⓙs good news. Itⓙs been a real pain ever since the eruption blocked it off.\n@c1@"
  es: "@a@b*: Qué buena noticia. No ha habido más que problemas desde que la erupción lo bloqueó.\n@c1@"
  fr: "@a@b*ⓢ C'est une bonne nouvelle. C'était un peu dur d'être coupées du monde depuis cette éruption.\n@c1@"
  it: "@a@b*: Che bella notizia! Da quando l'eruzione l'aveva bloccata, avevamo avuto non pochi problemi.\n@c1@"
  ja: "@a@b＊「ああ　良かった！\n\tあそこが　ふさがれて以来\n\t不便で　しょうがなかったのよ。\n@c1@"
"18":
  de: "@a@b*: Hm? Wie war das? Ihr habt den Verbrecher geschnappt, sagt Ihr?\n@c2@"
  en: "@a@b*: Hm? What's that?\nYou caught the criminal, did you?\n@c2@"
  es: "@a@b*: ¿Mmm? ¿Qué pasa?\n%H860%XHas%YHabéis%Z capturado al criminal, ¿no es así?\n@c2@"
  fr: "@a@b*ⓢ Pardonⓡ Vous ditesⓡ\nVous avez attrapé le coupableⓡ\n@c2@"
  it: "@a@b*: Eh? Che cosa?\n%H860%XHai%YAvete%Z catturato il ladro?\n@c2@"
  ja: "@a@b＊「え？　なんだって？\n\t本当の犯人を　つかまえた？\n@c2@"
"19":
  de: "@a@b*: Ja, das sind gute Neuigkeiten.\nMacht weiter so.\n@c2@"
  en: "@a@b*: Well, that's wonderful news.\nKeep up the good work, then.\n@c2@"
  es: "@a@b*: Bien, se trata de muy buenas nuevas.\n¡%H860%XSigue%YSeguid%Z así, entonces!\n@c2@"
  fr: "@a@b*ⓢ C'est une très bonne nouvelle.\nContinuez comme ça.\n@c2@"
  it: "@a@b*: Questa sì che è una grande notizia! Ottimo lavoro!\n@c2@"
  ja: "@a@b＊「それは良かったわね。\n\tこれからも　がんばりなさいよ！\n@c2@"
"20":
  de: "@a@b*: Offenbar ist der Herr der Unterwelt wieder auferstanden!\n@c1@"
  en: "@a@b*: Apparently the Lord of the Underworld is about to rise again!\n@c1@"
  es: "@a@b*: Parece ser que el Señor del Inframundo está a punto de alzarse de nuevo.\n@c1@"
  fr: "@a@b*ⓢ Il paraît que le Seigneur des Enfers est sur le point de ressusciterⓠ\n@c1@"
  it: "@a@b*: In giro si dice che il Signore degli Inferi stia per tornare in vita.\n@c1@"
  ja: "@a@b＊「いよいよ　地獄の帝王が\n\t復活するそうよ！\n@c1@"
"21":
  de: "@a@b*: Es heißt, dass nur %A090%Xein großer Held%Z%B090%Xeine große Heldin%Z ihn besiegen könne. Wer das wohl ist...?\n@c1@"
  en: "@a@b*: They say a great %A090%Xhero%Z%B090%Xheroine%Z is the only one who can defeat him. I wonder who it is...\n@c1@"
  es: "@a@b*: Dicen que %A090%Xun gran héroe%Z%B090%Xuna gran heroína%Z es %A120%Xel único%Z%B120%Xla única%Z que podrá derrotarle. Me pregunto quién será...\n@c1@"
  fr: "@a@b*ⓢ Mais les gens parlent d'un%A090%X grand héros qui serait le seul%Z%B090%Xe grande héroïne qui serait la seule%Z à pouvoir le vaincre. Je me demande qui c'est...\n@c1@"
  it: "@a@b*: Corre voce che solo %A090%Xun eroe coraggioso%Z%B090%Xuna coraggiosa eroina%Z possa sconfiggerlo. Mi chiedo chi possa mai essere... \n@c1@"
  ja: "@a@b＊「その帝王を倒すはずの\n\t伝説の勇者は\n\tいったい　何をやっているのかしら？\n@c1@"
"22":
  de: "@a@b*: Dieser Herr der Unterwelt ist doch ein Mann, richtig? Dann wird er uns Frauen sicherlich verschonen...\n@c1@"
  en: "@a@b*: This Lord of the Underworld is a man, isnⓙt he? Then heⓙll probably go easy on us women, wonⓙt he?\n@c1@"
  es: "@a@b*: Este Señor del Inframundo es un hombre, ¿no es así? Entonces, probablemente se lleve bien con nosotras las mujeres, ¿no es cierto?\n@c1@"
  fr: "@a@b*ⓢ Le Seigneur des Enfers est un homme, c'est çaⓡ\nDans ce cas, il sera sûrement plus gentil avec les femmes, nonⓡ\n@c1@"
  it: "@a@b*: Il Signore degli Inferi è un uomo, no? Allora sono sicura che tratterà noi donne con i guanti di velluto. Dico bene?\n@c1@"
  ja: "@a@b＊「地獄の帝王って　男よね。\n\tだったら　女の子には\n\t甘いんじゃないかなあ。\n@c1@"
"23":
  de: "@a@b*: Ich möchte keinen alten Mann. Mein Mann muss tapfer sein. Und stark. Und männlich...\n@c2@"
  en: "@a@b*: I donⓙt want any old man.\nMy man needs to be tough.\nAnd strong. And butch...\n@c2@"
  es: "@a@b*: No quiero ningún anciano.\nMi hombre tiene que ser un tipo duro.\nY fuerte. Y un machote...\n@c2@"
  fr: "@a@b*ⓢ Je ne veux pas d'un vieillard.\nMon homme doit être robuste.\nEt fort. Et macho...\n@c2@"
  it: "@a@b*: Non voglio un vecchio decrepito accanto a me! Il mio uomo dev'essere forte, maschio, macho!\n@c2@"
  ja: "@a@b＊「わたしは　どんな男であれ\n\tやはり　強い男が好きだ。\n@c2@"
"24":
  de: "@a@b*: Ja, tapfer genug, um manchmal kleine Rangeleien mit mir auszutragen! Ha ha ha!\n@c2@"
  en: "@a@b*: Yes, tough enough to enjoy a good wrestle sometimes! Hah hah hah!\n@c2@"
  es: "@a@b*: Sí, lo suficientemente duro como para disfrutar de un buen combate de vez en cuando. ¡Ja, ja, ja!\n@c2@"
  fr: "@a@b*ⓢ Autrement dit, assez coriace pour qu'on puisse se faire une bonne petite bagarre de temps à autreⓠ\nHa ha ha haⓠ\n@c2@"
  it: "@a@b*: E gli deve piacere l'attività fisica... di coppia! Ah! Ah! Ah! Ah! Ah!\n@c2@"
  ja: "@a@b＊「このわたしを\n\tうち負かしてくれるほど\n\t強い男が……。　ぽっ。\n@c2@"
"25":
  de: "@a@b*: Glaubt ja nicht, Ihr könntet hier irgendwelche faulen Tricks versuchen, nur weil diese Burg von Frauen verteidigt wird!\n@c2@"
  en: "@a@b*: Donⓙt think you can get up to any tricks just because this castle is defended by women!\n@c2@"
  es: "@a@b*: No se %H860%Xdeje%Ydejen%Z engañar por el hecho de que este castillo esté defendido exclusivamente por mujeres.\n@c2@"
  fr: "@a@b*ⓢ N'imaginez pas que vous pouvez vous livrer à d'obscures manigances sous prétexte que ce château est défendu par des femmesⓠ\n@c2@"
  it: "@a@b*: Non %H860%Xpensare%Ypensate%Z nemmeno di fare qualche brutto scherzo solo perché questo castello è difeso da donne!\n@c2@"
  ja: "@a@b＊「女だけの城だと思って\n\tあまく　見ないことだ。\n@c2@"
"26":
  de: "@a@b*: Ich bin doppelt so viel Frau wie Mann...? Ich meine, ich bin doppelt so viel Mann wie Frau...? Ach, nein, ich bin doppelt so stark wie jeder Mann!\n@c2@"
  en: "@a@b*: Iⓙm twice the woman any man is...?\nI mean, twice the man any woman...?\nNo, I mean, twice as strong as any man!\n@c2@"
  es: "@a@b*: Soy el doble de mujer que cualquier hombre...\nQuiero decir, el doble de hombre que cualquier mujer...\n㈡\n*: No, vaya, ¡el doble de fuerte que cualquier hombre!\n@c2@"
  fr: "@a@b*ⓢ Les hommes ne me font pas peur.\nJe n'en fais qu'une bouchée...\nC'est clairⓡ\n@c2@"
  it: "@a@b*: Sono due volte più uomo di qualsiasi donn... Cioè, sono due volte più donna di qualsiasi uom... No, voglio dire che sono due volte più forte di qualsiasi uomo!\n@c2@"
  ja: "@a@b＊「守りをかためる　われら戦士は\n\t男などに　負けはせぬぞ！\n@c2@"
"27":
  de: "@a@b*: Ich hatte das Glück, den guten Frauen von Femiscyra Waffen und Rüstungen liefern zu dürfen. Allerdings musste ich mich als Eunuch ausgeben!\n@c2@"
  en: "@a@b*: I was given permission to supply weapons and armour to the good women of Femiscyra. Mind you, I had to pretend to be a eunuch!\n@c2@"
  es: "@a@b*: Me fue concedido permiso para suministrar armas y armaduras a las buenas mujeres de Feministia. ¡Aunque tuve que hacerme pasar por un eunuco!\n@c2@"
  fr: "@a@b*ⓢ On m'avait donné l'autorisation de fournir des armes et des armures aux femmes de Fémiscyra.\n㈡\n*ⓢ Mais il avait fallu que je me fasse passer pour un eunuqueⓠ\n@c2@"
  it: "@a@b*: Ho avuto l'appalto per la fornitura di armi e armature per le donne del castello di Femiscyra!\n㈡\n*: Ma ho dovuto fingere di essere un eunuco per ottenerla... \n@c2@"
  ja: "@a@b＊「女性用の　武器や防具を\n\t仕入れさせてもらっています。\n@c2@"
"28":
  de: "@a@b*: Und dann wurde der Weg von Felsgestein zugeschüttet, so dass ich gefangen war mit all diesen Frauen...\n@c2@"
  en: "@a@b*: Then the way out of here got blocked in the eruption, and I've been stuck with the ladies everⓚⓛ\n@c2@"
  es: "@a@b*: Entonces la salida quedó bloqueada por la erupción y me quedé aquí encerrado entre mujeres...\n@c2@"
  fr: "@a@b*ⓢ Et puis je me suis retrouvé bloqué ici après l'éruption. Avec toutes ces femmes...\n@c2@"
  it: "@a@b*: Poi l'eruzione ha bloccato la strada, e sono rimasto bloccato qui con tutte queste donne. Poteva andarmi peggio!\n@c2@"
  ja: "@a@b＊「でも　火山の爆発で\n\t帰れなくなってしまって……。\n@c2@"
"29":
  de: "@a@b*: Was? Der Weg ist wieder frei? Tja, also... das ist jetzt aber schade...\n@c2@"
  en: "@a@b*: What? You can get through now?\nWell, thatⓙs...a bit of a shame, actually...\n@c2@"
  es: "@a@b*: ¿Qué? ¿Ya se puede pasar?\nBueno... eso es una pena, en realidad...\n@c2@"
  fr: "@a@b*ⓢ Commentⓡ On peut passer maintenantⓡ\nAh bonⓡ C'est... En fait, c'est un peu dommage...\n@c2@"
  it: "@a@b*: Come %H860%Xdici%Ydite%Z? Adesso la strada è di nuovo percorribile? Oh, che peccato!\n@c2@"
  ja: "@a@b＊「え？　道が通じた？\n\tうーむ　うれしいような\n\t残念なような……。\n@c2@"
"30":
  de: "@a@b*: Die Göttin hat dafür Sorge getragen, dass meine kostbare Gebetskette sicher zu mir zurückkehrt.\n@c1@"
  en: "@a@b*: The Goddess saw to it that my precious bronze rosary was returned.\n@c1@"
  es: "@a@b*: La Diosa se ha hecho cargo de que mi precioso rosario de bronce sea devuelto.\n@c1@"
  fr: "@a@b*ⓢ La Déesse a veillé à ce que je récupère mon rosaire de bronze.\n@c1@"
  it: "@a@b*: La nostra amatissima dea ha fatto sì che io rientrassi in possesso del mio Rosario di bronzo!\n@c1@"
  ja: "@a@b＊「ブロンズの十字架を\n\t女王さまから\n\t返していただきました。\n@c1@"
"31":
  de: "@a@b*: Aber ich habe an Euch gezweifelt. Einen Moment lang habe ich an Eurer Unschuld gezweifelt.\n@c1@"
  en: "@a@b*: But I doubted you.\nFor a moment, I doubted your innocence.\n@c1@"
  es: "@a@b*: Pero dudé de %H860%Xusted%Yustedes%Z.\nPor un momento dudé de su inocencia.\n@c1@"
  fr: "@a@b*ⓢ Mais j'ai douté de vous.\nÀ un moment, j'ai douté de votre innocence.\n@c1@"
  it: "@a@b*: Ma io ho dubitato di %H860%Xte%Yvoi%Z. Per un attimo, ho creduto che %H860%Xtu fossi colpevole%Yvoi foste colpevoli%Z.\n@c1@"
  ja: "@a@b＊「しかし　一時でも　あなたたちを\n\tうたがってしまって……。\n@c1@"
"32":
  de: "@a@b*: Wie kann ich der Göttin eine ehrbare Dienerin sein, wenn ich ihre Gebote nicht einmal selbst befolge?\n@c1@"
  en: "@a@b*: How can I be a worthy servant of the Goddess if I cannot uphold Her teachings myself?\n@c1@"
  es: "@a@b*: ¿Cómo puedo ser una sierva digna de la Diosa si no soy capaz de poner yo misma en práctica sus enseñanzas?\n@c1@"
  fr: "@a@b*ⓢ Comment puis-je être une bonne servante de la Déesse si je ne parviens pas à appliquer moi-même Ses enseignementsⓡ\n@c1@"
  it: "@a@b*: Come posso ritenermi una degna servitrice della dea, quando dimentico tanto facilmente i suoi insegnamenti di misericorida e di perdono?\n@c1@"
  ja: "@a@b＊「まだまだ　わたしには\n\t人に　教えを説く資格など\n\tありませんわね……。\n@c1@"
"33":
  de: "@a@b*: Ich bin der einzige Mann, der hier auf der Burg lebt. Na ja, der einzige richtige Mann, wenn Ihr versteht.\n@c2@"
  en: "@a@b*: I'm the only man who lives in this entire castle, you know. Well, the only real man, that is.\n@c2@"
  es: "@a@b*: Soy el único hombre que habita en todo el castillo. Bueno, el único hombre de verdad, quiero decir.\n@c2@"
  fr: "@a@b*ⓢ Je suis le seul homme dans ce château.\nEnfin... le seul vrai homme, si vous voyez ce que je veux dire.\n@c2@"
  it: "@a@b*: Io sono l'unico uomo che vive in questo castello. Anzi, dovrei dire che sono l'unico maschio! Eh! Eh! Eh!\n@c2@"
  ja: "@a@b＊「この城に住んでいる男は\n\tわしだけじゃ。\n@c2@"
"34":
  de: "@a@b*: Ha ha ha. Da seid Ihr neidisch, was?\n%A120%XDas solltet Ihr auch!%Z%B120%XIhr seid wohl eine dieser ⓞmodernenⓟ Frauen...%Z\n@c2@"
  en: "@a@b*: Huh huh huh. Jealous, are you?\n%A120%XYou should be!%Z%B120%XSo you're one of those ⓗmodernⓘ women, eh?%Z\n@c2@"
  es: "@a@b*: Ja, ja, ja. %A120%XCeloso%Z%B120%XCelosa%Z, ¿eh?\n%A120%X¡No me extraña!%Z%B120%XEntonces eres una de esas mujeres ''modernas'', ¿no?%Z\n@c2@"
  fr: "@a@b*ⓢ Hé hé hé. Vous êtes %A120%Xjaloux%Z%B120%Xjalouse%Z, c'est çaⓡ\n%A120%XVous avez bien raison de l'êtreⓠ%Z%B120%XAlors vous êtes l'une de ces femmes ⓥmodernesⓦⓡ%Z\n@c2@"
  it: "@a@b*: Eh! Eh! Eh! %A120%XSei geloso, vero%Z%B120%XVuoi entrare a far parte del mio harem%Z?\n@c2@"
  ja: "@a@b＊「ふほっ　ふほっ\n\tうらやましいじゃろ？\n\tさて……。\n@c2@"
"35":
  de: "@a@b*: Miauuu... Miauuu...\n@c1@"
  en: "@a@b*: Meooow... Meooow...\n@c1@"
  es: "@a@b*: Miaaau... Miaaau...\n@c1@"
  fr: "@a@b*ⓢ Miaou... Miaou...\n@c1@"
  it: "@a@b*: Miao! Miao! Miao!\n@c1@"
  ja: "@a@b＊「にゃーん。\n@c1@"
"36":
  de: "@a@b*: Für einige mag es bloß eine dumme Geschichte sein, ich halte sie aber für wahr. Als die Großmutter Ihrer Majestät noch ein kleines Mädchen war...\n@c2@"
  en: "@a@b*: Some say itⓙs just an old husbands' tale, but itⓙs gospel truth. It was when Her Majesty's grandmother was still a young girl...\n@c2@"
  es: "@a@b*: Algunos dicen que no es más que una patraña de los hombres, pero es la pura verdad. Fue cuando la abuela de Su Majestad era aún joven...\n@c2@"
  fr: "@a@b*ⓢ Certains disent que ce n'est qu'une vieille histoire, mais c'est la vérité vraie.\n㈡\n*ⓢ Ça s'est passé quand la grand-mère de Sa Majesté était encore une jeune fille...\n@c2@"
  it: "@a@b*: Alcuni dicono che sia solo una leggenda, ma io so che è la verità. La storia risale a quando la nonna della nostra cara Regina era solo una fanciulla.\n@c2@"
  ja: "@a@b＊「古い話だけどね。\n\t今の女王さまの　おばあさまが\n\tまだ　お若かった時……。\n@c2@"
"37":
  de: "@a@b*: Da hat der König von Burland um sie geworben und schenkte ihr einen wertvollen Schatz, den Zenithiaschild.\n@c2@"
  en: "@a@b*: The then King of Burland tried to woo her by giving her a precious treasure known as the Zenithian Shield.\n@c2@"
  es: "@a@b*: El entonces rey de Burlandia intentó impresionarla regalándole un precioso tesoro conocido como el Escudo de Zenithia.\n@c2@"
  fr: "@a@b*ⓢ Celui qui était roi de Bastione en ce temps essaya de lui faire la cour en lui offrant un trésor appelé le Bouclier zénithien.\n@c2@"
  it: "@a@b*: Il sovrano che allora regnava a Burlandia cercò di conquistarla donandole un prezioso tesoro, lo Scudo Zenithiano.\n@c2@"
  ja: "@a@b＊「当時の　バトランド王から\n\t天空の盾というものを\n\t贈られたんだよ。\n@c2@"
"38":
  de: "@a@b*: Aber natürlich würde keine unserer Königinnen auf solch einen Unfug hereinfallen. Oh nein, nein, nein!\n@c2@"
  en: "@a@b*: But no queen of ours would fall for a stunt like that, of course. Oh, no, no, no!\n@c2@"
  es: "@a@b*: Pero ninguna reina nuestra sucumbiría ante semejante artimaña, por supuesto. ¡Oh, no, no, no!\n@c2@"
  fr: "@a@b*ⓢ Aucune de nos reines ne serait tombée amoureuse d'un joli cœur pareil. Oh que nonⓠ\n@c2@"
  it: "@a@b*: Ma la nostra regina non si fece sedurre da un regalo tanto misero. Oh, no! Nemmeno per idea!\n@c2@"
  ja: "@a@b＊「もちろん　先々代の女王さまは\n\tそんなもので\n\tくどかれはしなかったけどね。\n@c2@"
"39":
  de: "@a@b*: Hm? Was mit dem Schild passiert ist? Gute Frage... Ich nehme an, dass er noch irgendwo in der Burg herumliegt.\n@c2@"
  en: "@a@b*: Hm? What happened to the shield?\nWell, I wonder... I suppose it must still be in the castle somewhere.\n@c2@"
  es: "@a@b*: ¿Mmm? ¿Qué pasó con el escudo?\nBueno, imagino... Supongo que aún debe estar en algún lugar del castillo.\n@c2@"
  fr: "@a@b*ⓢ Mmmⓡ Ce qu'est devenu le bouclierⓡ\nEh bien, je ne sais pas... J'imagine qu'il doit encore être quelque part dans le château.\n@c2@"
  it: "@a@b*: Come? Cosa ne è dello scudo? Beh, credo che sia ancora custodito da qualche parte nel castello.\n@c2@"
  ja: "@a@b＊「えっ　その盾はどこかって？\n\tさあ？　今も　このお城のどこかに\n\tあるんじゃないかねえ。\n@c2@"
"40":
  de: "@a@b*: Ich sammle all die vielen Gerüchte, die sich um den Herrn der Unterwelt und seine Auferstehung ranken.\n@c1@"
  en: "@a@b*: Iⓙm cataloguing all the different rumours there are about the Lord of the Underworld and his resurrection.\n@c1@"
  es: "@a@b*: Estoy clasificando los diferentes rumores que circulan sobre el Señor del Inframundo y su resurrección.\n@c1@"
  fr: "@a@b*ⓢ Je recense les différentes rumeurs concernant le Seigneur des Enfers et son retour.\n@c1@"
  it: "@a@b*: Sto annotando tutte le voci che si sentono in giro in merito al Signore degli Inferi e alla sua resurrezione.\n@c1@"
  ja: "@a@b＊「地獄の帝王の復活について\n\tいろいろな　うわさ話を\n\tまとめているところです。\n@c1@"
"41":
  de: "@a@b*: Um die Prophezeiung über %A090%Xden Helden, der%Z%B090%Xdie Heldin, die%Z ihn besiegen soll...\n@c1@"
  en: "@a@b*: The prophecy of the %A090%Xhero%Z%B090%Xheroine%Z whoⓙs supposed to defeat him...\n@c1@"
  es: "@a@b*: La profecía de%A090%Xl héroe%Z%B090%X la heroína%Z que se supone que le vencerá...\n@c1@"
  fr: "@a@b*ⓢ La prophétie %A090%Xdu héros%Z%B090%Xde l'héroïne%Z qui doit le vaincre...\n@c1@"
  it: "@a@b*: La profezia %A090%Xdell'eroe%Z%B090%Xdell'eroina%Z che dovrebbe sconfiggerlo...\n@c1@"
  ja: "@a@b＊「地獄の帝王の復活。\n\tそして　それを倒すべき勇者が\n\t育っているという予言。\n@c1@"
"42":
  de: "@a@b*: Um die Legende des Drachengottes, der in Zenithia hoch oben im Himmel wohnt...\n@c1@"
  en: "@a@b*: The legend of the Dragon God who resides in Zenithia up in the sky...\n@c1@"
  es: "@a@b*: La leyenda del Dios Dragón que reside en Zenithia allá en las alturas...\n@c1@"
  fr: "@a@b*ⓢ La légende du Dieu-dragon qui habite à Zénithia, dans le ciel...\n@c1@"
  it: "@a@b*: La favola del Drago Divino che vive a Zenithia, su in cielo... \n@c1@"
  ja: "@a@b＊「天空に　おわすという\n\t竜の神さまの伝説。\n@c1@"
"43":
  de: "@a@b*: Und um die Geschichte der Frau, die vom Himmel hinab stieg und unweit von Casabranca ein Kind gebar.\n@c1@"
  en: "@a@b*: And the tale about a woman who swept down from heaven and gave birth to a child near Casabranca.\n@c1@"
  es: "@a@b*: Y el cuento sobre una mujer que bajó del cielo y dio a luz a un bebé cerca de Casablanca.\n@c1@"
  fr: "@a@b*ⓢ Et l'histoire d'une femme descendue des cieux qui aurait donné naissance à un enfant près de Casabranca.\n@c1@"
  it: "@a@b*: E la storia della donna che venne dal cielo e diede alla luce un neonato nei pressi di Casabianca.\n@c1@"
  ja: "@a@b＊「そして　ブランカの国では\n\t天空から舞いおりた娘が\n\t赤ちゃんを　産んだとか……。\n@c1@"
"44":
  de: "@a@b*: Bald werde ich alles zu einer schönen spannenden Geschichte zusammentragen.\n@c1@"
  en: "@a@b*: Iⓙll have it all arranged in a neat little story soon, I hope.\n@c1@"
  es: "@a@b*: Pronto espero tenerlo todo bien organizado y ordenado formando una bonita historia.\n@c1@"
  fr: "@a@b*ⓢ Je vais bientôt en tirer une jolie petite histoire.\nEnfin, j'espère.\n@c1@"
  it: "@a@b*: Voglio trasformare tutte queste leggende in un romanzo di successo!\n@c1@"
  ja: "@a@b＊「もう少しで　これらの話が\n\tまとまりそうなのですが……。\n@c1@"
"45":
  de: "@a@b*: Aufgrund ihres Amtes muss sich Ihre Majestät die Königin nach außen hin streng geben, aber im Grunde ihres Herzens ist sie eine gütige Frau.\n@c2@"
  en: "@a@b*: Her Majesty the Queen has to act stern for appearance's sake, but sheⓙs a gentlewoman at heart.\n@c2@"
  es: "@a@b*: Su Majestad la Reina tiene que ser severa para guardar las apariencias, pero tiene un corazón que no le cabe en el pecho.\n@c2@"
  fr: "@a@b*ⓢ Sa Majesté doit paraître stricte pour préserver son image, mais au fond, c'est une dame au grand cœur.\n@c2@"
  it: "@a@b*: Sua Maestà la Regina deve mostrarsi dura e inflessibile, ma in realtà ha un cuore d'oro.\n@c2@"
  ja: "@a@b＊「女王さまは\n\tきついこと　おっしゃっていても\n\t本当は　やさしいお方なんだよ。\n@c2@"
"46":
  de: "@a@b*: Es ist wirklich eine Schande. Wäre sie nicht als Königin geboren, so könnte sie ihre Barmherzigkeit ausleben.\n@c2@"
  en: "@a@b*: It's a shame really. If she hadn't been born a queen, her compassion could have really shone through.\n@c2@"
  es: "@a@b*: En verdad, es una pena. Si no hubiera nacido reina, su compasión podría haber resplandecido con luz propia.\n@c2@"
  fr: "@a@b*ⓢ Quel dommageⓠ Si elle n'était pas née reine, son côté humain serait vraiment apparu au grand jour.\n@c2@"
  it: "@a@b*: Devo confessare che la cosa mi dispiace.\n㈡\n*: Se non fosse stata destinata a salire sul trono, tutto il mondo avrebbe potuto apprezzare la sua infinita bontà d'animo.\n@c2@"
  ja: "@a@b＊「女王さまになんか　生まれなきゃ\n\tふつうの娘で　いられたのに……\n\tお気の毒だよ　まったく。\n@c2@"
"47":
  de: "@a@b*: Dies ist das Ankleidezimmer Ihrer Majestät.\n@c1@"
