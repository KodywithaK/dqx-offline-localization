  es: "@a@b*: Tiene unos atuendos más elegantes de lo que %H860%Xpueda%Ypuedan%Z imaginar. ¡No los %H860%Xtoque%Ytoquen%Z con esas sucias manos suyas!\n@c1@"
  fr: "@a@b*ⓢ Elle a plus de vêtements qu'elle ne peut en porterⓠ N'allez pas les toucher avec vos mains dégoûtantesⓠ\n@c1@"
  it: "@a@b*: Ha una quantità di abiti inimmaginabile! Mi raccomando! Non %H860%Xtoccarli%Ytoccateli%Z con quelle manacce sporche!\n@c1@"
  ja: "@a@b＊「すてきなお洋服ばかりだから\n\t汚い手でさわっちゃ　ダメよ。\n@c1@"
"49":
  de: "@a@b*: Ich wusste von Anfang an, dass Ihr unschuldig seid.\n@c2@"
  en: "@a@b*: I knew you were innocent right from the start.\n@c2@"
  es: "@a@b*: Desde el principio supe que %H860%Xera inocente%Yeran inocentes%Z.\n@c2@"
  fr: "@a@b*ⓢ J'étais convaincue de votre innocence dès le début.\n@c2@"
  it: "@a@b*: Ho sempre saputo che %H860%Xeri innocente%Yeravate innocenti%Z!\n@c2@"
  ja: "@a@b＊「じつは　わたしは\n\t初めから　あなたたちを\n\t信じていました。\n@c2@"
"50":
  de: "@a@b*: Das ist weibliche Intuition, wisst Ihr. Ich bin mir sicher, dass die Königin genauso denkt.\n@c2@"
  en: "@a@b*: It's women's intuition, you see.\nI'm sure Her Majesty the Queen knew, too.\n@c2@"
  es: "@a@b*: Como %H860%Xve%Yven%Z, intuición femenina.\nEstoy segura de que Su Majestad la Reina también lo supo.\n@c2@"
  fr: "@a@b*ⓢ L'intuition féminine, vous voyez.\nJe suis persuadée que Sa Majesté le savait également.\n@c2@"
  it: "@a@b*: %H860%XChiamalo ⓕintuito femminileⓖ, se vuoi%YChiamatelo ⓕintuito femminileⓖ, se volete%Z...\n㈡\n*: Sono certa che anche la nostra Regina fosse convinta che non %H860%Xavevi%Yavevate%Z commesso il furto.\n@c2@"
  ja: "@a@b＊「目を見れば　わかります！\n\t女王さまも　きっと\n\t同じ気持ちだったのでしょう。\n@c2@"
"51":
  de: "@aKönigin von Femiscyra@bAh, %a00140. Ihr habt den wahren Täter also erfolgreich gestellt.\n@c1@"
  en: "@aQueen of Femiscyra@bAh, %a00140. So you were successful in tracking down the real thief.\n@c1@"
  es: "@aReina de Feministia@b¡Ah!, %a00140. Así que %H860%Xha%Yhan%Z capturado con éxito al verdadero ladrón.\n@c1@"
  fr: "@aReine de Fémiscyra@b%0%a00140, vous avez réussi à trouver le véritable voleur.\n@c1@"
  it: "@aRegina di Femiscyra@bAh, %a00140. Vedo che la tua caccia al vero ladro si è conclusa con successo.\n@c1@"
  ja: "@a@b女王「おお！　%a00140\n\t本当に　犯人を見つけましたね！\n@c1@"
"52":
  de: "@aKönigin von Femiscyra@bIch habe bereits alles gehört. Eine meiner Wächterinnen hat mich unterrichtet.\n@c1@"
  en: "@aQueen of Femiscyra@bI have heard all about it. One of my guards filled me in.\n@c1@"
  es: "@aReina de Feministia@bYa lo sé todo. Una de mis guardias me mantuvo informada.\n@c1@"
  fr: "@aReine de Fémiscyra@bL'une de mes gardes m'a déjà tout raconté.\n@c1@"
  it: "@aRegina di Femiscyra@bSo cosa è accaduto. Una delle guardie mi ha raccontato tutto fin nei minimi dettagli.\n@c1@"
  ja: "@a@b女王「先ほど　もどった兵士から\n\t話は　すべて聞きました！\n@c1@"
"53":
  de: "@aKönigin von Femiscyra@bDie Geisel wird natürlich frei gelassen. Mit diesem Schlüssel könnt Ihr die Zelle aufsperren.\n@c1@"
  en: "@aQueen of Femiscyra@bSo, your companion is of course free to go. This key will give you access to the cells.\n@c1@"
  es: "@aReina de Feministia@bPor tanto, su %Q160%Xcompañero será puesto%Ycompañera será puesta%Z en libertad. Esta llave permite acceder a las celdas.\n@c1@"
  fr: "@aReine de Fémiscyra@bVotre camarade est libre. Cette clef vous permettra d'ouvrir les cachots.\n@c1@"
  it: "@aRegina di Femiscyra@bDarò subito ordine di liberare la persona che tenevamo in prigione in via cautelativa. Questa chiave ti darà accesso alle celle.\n@c1@"
  ja: "@a@b女王「さあ　このカギで\n\t仲間を　牢屋から出してあげなさい！\n@c1@"
"54":
  de: "@a@b%0%a00180 erhält den Universalschlüssel!\n@c1@"
  en: "@a@b%0%a00180 receives the ultimate key!\n@c1@"
  es: "@a@b¡%0%a00180 recibe la llave suprema!\n@c1@"
  fr: "@a@b%0%a00180 obtient la clef ultimeⓠ\n@c1@"
  it: "@a@b%0%a00180 riceve la Chiave del potere!\n@c1@"
  ja: "@a@b%a00180は\nさいごのカギを　手に入れた！\n@c1@"
"55":
  de: "@aKönigin von Femiscyra@bUnd Ihr sollt als Zeichen der Schwesternschaft zwischen Femiscyra und Euch den Zenithiaschild erhalten. Er befindet sich unterhalb der Burg.\n@c1@"
  en: "@aQueen of Femiscyra@bAnd I wish you to have the Zenithian Shield, which can be found beneath the castle, as a token of sisterhood between Femiscyra and yourselves.\n@c1@"
  es: "@aReina de Feministia@bY desearía %H860%Xofrecerle%Yofrecerles%Z el Escudo de Zenithia, que se encuentra en el sótano, como símbolo de hermandad entre Feministia y %H860%Xusted%Yustedes%Z.\n@c1@"
  fr: "@aReine de Fémiscyra@bJe tiens également à vous offrir le Bouclier zénithien, en gage de la solidité des liens qui existent désormais entre mon royaume et vous.\n㈡\nVous le trouverez dans les sous-sols du château.\n@c1@"
  it: "@aRegina di Femiscyra@bInoltre, voglio %H860%Xdarti%Ydarvi%Z lo Scudo Zenithiano, che si trova nei sotterranei del castello, in segno di sorellanza, ehm... di fratellanza tra %H860%Xte%Yvoi%Z e la gente di Femiscyra.\n@c1@"
  ja: "@a@b女王「そして　この城の地下にある\n\t天空の盾も　さしあげましょう。\n\t持ってゆくがいいでしょう。\n@c1@"
"56":
  de: "@aKönigin von Femiscyra@bMeine Untertaninnen haben mir berichtet, dass Ihr vorhabt, den Herrn der Unterwelt zu besiegen.\n@c1@"
  en: "@aQueen of Femiscyra@bMy people in the castle inform me that you are on a quest to defeat the Lord of the Underworld.\n@c1@"
  es: "@aReina de Feministia@bMi gente me ha informado de que %H860%Xtiene%Ytienen%Z la misión de derrotar al Señor del Inframundo.\n@c1@"
  fr: "@aReine de Fémiscyra@bMes sujets m'ont dit que vous avez l'intention de combattre le Seigneur des Enfers.\n@c1@"
  it: "@aRegina di Femiscyra@bSo che %H860%Xstai%Ystate%Z cercando di sconfiggere il Signore degli Inferi.\n@c1@"
  ja: "@a@b女王「あれから　城の者に聞いたのですが\n\tそなたたちは　地獄の帝王を\n\t倒すため　旅をしているとか。\n@c1@"
"57":
  de: "@aKönigin von Femiscyra@bNun, es gibt einen Ort südlich von hier, Rosenbühl... Dort wohnten einst viele Monster.\n@c1@"
  en: "@aQueen of Femiscyra@bWell, there is a place called Rosehill to the south of this continent where monsters once lived.\n@c1@"
  es: "@aReina de Feministia@bPues bien, hay un lugar llamado Rosavilla al sur de este continente en el que una vez hubo monstruos.\n@c1@"
  fr: "@aReine de Fémiscyra@bAu sud de ce continent se trouve un endroit appelé Rosecolline. Des monstres y vivaient, autrefois.\n@c1@"
  it: "@aRegina di Femiscyra@bA sud di questo continente c'è Col Rosato, un luogo un tempo abitato da mostri.\n@c1@"
  ja: "@a@b女王「そういえば　この地より南\n\tロザリーヒルには　かつて\n\t魔族が　住んでいたそうです。\n@c1@"
"58":
  de: "@aKönigin von Femiscyra@bVielleicht erhaltet Ihr dort ein paar nützliche Informationen. Aber beeilt Euch. Die Zeit ist knapp!\n@c1@"
  en: "@aQueen of Femiscyra@bPerhaps you will learn something useful there. But hurry. Remember, time and tide wait for no woman!\n@c1@"
  es: "@aReina de Feministia@bQuizás %H860%Xpueda%Ypuedan%Z conseguir alguna información valiosa allí. Pero %H860%Xdese%Ydense%Z prisa. ¡%H860%XRecuerde%YRecuerden%Z, el tiempo pasa inexorablemente para todas!\n@c1@"
  fr: "@aReine de Fémiscyra@bVous y apprendrez peut-être quelque chose d'intéressant. Faites vite. L'Histoire n'attend pasⓠ\n@c1@"
  it: "@aRegina di Femiscyra@bForse lì %H860%Xpotresti trovare qualche indizio utile per la tua%Ypotreste trovare qualche indizio utile per la vostra%Z ricerca. Ma %H860%Xdevi affrettarti%Ydovete affrettarvi%Z, perché non c'è molto tempo a disposizione.\n@c1@"
  ja: "@a@b女王「何か　わかるかもしれません。\n\t行ってみると　よいでしょう。\n@c1@"
"59":
  de: "@a@bIm Kleiderschrank befinden sich zahllose schöne Roben.\n@c0@"
  en: "@a@bThe wardrobe is packed full of gorgeous dresses.\n@c0@"
  es: "@a@bEl armario está repleto de hermosos vestidos.\n@c0@"
  fr: "@a@bCette garde-robe déborde de robes magnifiques.\n@c0@"
  it: "@a@bIl guardaroba è stracolmo di abiti meravigliosi.\n@c0@"
  ja: "@a@b中には　ごうかなドレスが\nぎっしり　かけられている。\n@c0@"
"60":
  de: "@a@b*: Ich weiß, Ihr könnt es nicht abwarten, %A120%XEuren Freund%Z%B120%XEure Freundin%Z zu befreien, aber Ihr müsst erst mit Ihrer Majestät sprechen.\n@c2@"
  en: "@a@b*: I'm sure you can't wait to release your friend, but you must speak to Her Majesty first.\n@c2@"
  es: "@a@b*: Estoy segura de que %H860%Xestá %A120%Xansioso%Z%B120%Xansiosa%Z%Y%R000%Xestán ansiosas%Yestán ansiosos%Z%Z por liberar a su %Q160%Xamigo%Yamiga%Z, pero primero %H860%Xdeberá%Ydeberán%Z hablar con Su Majestad.\n@c2@"
  fr: "@a@b*ⓢ Je suis sûre que vous avez hâte de libérer votre camarade, mais vous devez d'abord aller voir Sa Majesté.\n@c2@"
  it: "@a@b*: Immagino che %H860%Xtu non veda%Yvoi non vediate%Z l'ora di liberare la persona che è in cella, ma %H860%Xdevi%Ydovete%Z prima conferire con la nostra Regina.\n@c2@"
  ja: "@a@b＊「仲間を　いっこくも早く\n\t助け出したいのは　わかりますが\n\tまずは　女王さまにご報告を！\n@c2@"
"61":
  de: "@a@b*: Ihr müsst mir glauben! Ich würde so was doch nie anfassen. Frauenkleider! Nie im Leben!\n@c2@"
  en: "@a@b*: You've gotta believe me!\nI wouldn't touch anythin' like that.\nNot dresses. It's not right!\n@c2@"
  es: "@a@b*: ¡%H860%XTienes%YTenéis%Z que creerme!\nNo sería capaz de tocar nada semejante.\nVestidos, no. ¡Eso no está bien!\n@c2@"
  fr: "@a@b*ⓢ Vous devez me croireⓠ\nJe ne toucherais rien de ce genre.\nPas des robes. C'est pas justeⓠ\n@c2@"
  it: "@a@b*: Sto dicendo la verità! Non toccherei mai niente del genere! Non sono un ladro di biancheria! Non la ruberei mai!\n@c2@"
  ja: "@a@b＊「信じてくれ！\n\tオレは　下着なんか盗っちゃいねえ！\n@c2@"
"62":
  de: "@a@b*: Ich hab mit einem der Mädchen gekämpft, die die Burg bewachen... und hab verloren! Ich möchte nicht weiter darüber sprechen, das ist zu peinlich.\n@c2@"
  en: "@a@b*: I got into a fight with one of the girls guarding the castle...and lost! Iⓙm too embarrassed to talk about it.\n@c2@"
  es: "@a@b*: Luché con una de las chicas que custodian el castillo... y me derrotó. Me siento demasiado avergonzado como para hablar de ello.\n@c2@"
  fr: "@a@b*ⓢ Je me suis battu contre une des gardes du château... et j'ai perduⓠ\nJ'ai trop honte pour en parler.\n@c2@"
  it: "@a@b*: Mi sono scontrato con una delle ragazze di guardia al castello... E ho perso! Mi voglio sotterrare per la vergogna!\n@c2@"
  ja: "@a@b＊「この城の　女兵士とケンカして\n\t負けてしまったなんて……。\n\t恥ずかしくて　人に言えないなあ。\n@c2@"
"63":
  de: "@aLutz Langfinger@bIch fass es nicht! Ich bin noch niemals zuvor erwischt worden.\n@c2@"
  en: "@aKirk Buzzer@bI don't believe it! I ain't never come unstuck before. Not once.\n@c2@"
  es: "@aRob A. Conventos@b¡No me lo puedo creer! Nunca la había pifiado antes. Ni una sola vez.\n@c2@"
  fr: "@aArsène Lutrin@bIncroyableⓠ Jusque là, jamais personne ne m'avait arrêté. Jamaisⓠ\n@c2@"
  it: "@aLester Fant@bNon ci posso credere! Nessuno mi aveva mai beccato prima d'ora!\n@c2@"
  ja: "@a@bバコタ「まったく　わたしとしたことが\n\tドジをふんだものです。\n@c2@"
"64":
  de: "@aLutz Langfinger@bWisst Ihr, ich hatte gehört, dass es hier unter der Burg drei Räume geben soll.\n@c2@"
  en: "@aKirk Buzzer@bYa know, I 'eard there was three rooms under the castle 'ere.\n@c2@"
  es: "@aRob A. Conventos@b%H860%XOye%YEscuchad%Z, oí decir que había tres habitaciones debajo del castillo.\n@c2@"
  fr: "@aArsène Lutrin@bVous savez quoiⓡ Il paraît qu'il y a trois salles sous ce château.\n@c2@"
  it: "@aLester Fant@b%H860%XSai%YSapete%Z, mi hanno detto che ci sono tre stanze sotto il castello... \n@c2@"
  ja: "@a@bバコタ「しかし　この城には\n\t３つの地下室があると\n\t聞いていたのですが……。\n@c2@"
"65":
  de: "@aLutz Langfinger@bAber den letzten hab ich nie gefunden. Ist mir irgendwie nie unter die Augen gekommen...\n@c2@"
  en: "@aKirk Buzzer@bBut I didn't never find the last one. It's always eluded me, the little blighter...\n@c2@"
  es: "@aRob A. Conventos@bPero no he encontrado la tercera. Siempre se me escapaba la habitación esa...\n@c2@"
  fr: "@aArsène Lutrin@bLe truc, c'est que je n'ai jamais trouvé la dernière.\nJe me demande bien où elle peut être...\n@c2@"
  it: "@aLester Fant@bMa non sono mai riuscito a trovare la terza! Chissà dove si trova!\n@c2@"
  ja: "@a@bバコタ「３つ目の地下室も\n\tついに　見つけられなかったし……。\n\tまいってしまいますよ。\n@c2@"
"66":
  de: "@aRagnar@bIhr habt den wahren Dieb also gefunden? Das sind freilich gute Nachrichten.\n@c3@"
  en: "@aRagnar@bYe managed tae catch the real criminal, did ye? Och, that is good news.\n@c3@"
  es: "@aRagnar@b%H860%XPudo%YPudieron%Z capturar al verdadero criminal, ¿no es así? ¡Recórcholis! Eso sí que es una buena noticia.\n@c3@"
  fr: "@aRagnar@bVous avez réussi à attraper le vrai criminelⓡ Bonne nouvelleⓠ\n@c3@"
  it: "@aGaliardo@b%H860%XHai%YAvete%Z catturato il vero ladro? Grandioso!\n@c3@"
  ja: "@a@bライアン「聞きましたぞ！\n\t見事　犯人をつかまえたそうですな。\n\tさすがは　%a00090どの。\n@c3@"
"67":
  de: "@aRagnar@bDann nichts wie weg hier.\n@c3@"
  en: "@aRagnar@bLet's away from here then, shall we?\n@c3@"
  es: "@aRagnar@bVayámonos de aquí entonces.\n@c3@"
  fr: "@aRagnar@bAlors partons d'ici, maintenant.\n@c3@"
  it: "@aGaliardo@bForza, andiamo via da qui.\n@c3@"
  ja: "@a@bライアン「さあ　早く\n\tここから　出してくだされ。\n@c3@"
"68":
  de: "@aAlena@bPah. Ich wünschte nur, ich hätte erwischt diesen Verbrecher.\n@c1@"
  en: "@aAlena@bPah. I only wish I am able to stop this criminal myself.\n@c1@"
  es: "@aAlena@b¡Bah! Ojalá habeя captuяado cяiminal yo misma.\n@c1@"
  fr: "@aAlina@bJ'auяais bieи aimé aяяêteя ce voleuя moi-même.\n@c1@"
  it: "@aAlena@bPeccato. Io vuolevo prendere ladro con mie mani!\n@c1@"
  ja: "@a@bアリーナ「あ～あ。\n\tどうせなら　あたしが　この手で\n\t犯人を　とっちめてやりたかったな。\n@c1@"
"69":
  de: "@aAlena@bAber egal. Jetzt wir müssen fortsetzen unsere Reise.\n@c1@"
  en: "@aAlena@bNever mind this time.\nNow we must to continue our voyage.\n@c1@"
  es: "@aAlena@bEsta vez eso иo impoяtaя.\nAhoяa иosotяos debieиdo contiиuaя viaje.\n@c1@"
  fr: "@aAlina@bCe seяa pouя la pяochaiиe fois.\nPouяsuivoиs иotяe voyage.\n@c1@"
  it: "@aAlena@bBeh, nyet importa.\nOra noi dobbiamo cuontinuare nuostro viaggio.\n@c1@"
  ja: "@a@bアリーナ「ま　いいわ。\n\tさあ　早く　ここから出してよ。\n@c1@"
"70":
  de: "@aKyrill@bEs ist wunderbar, dass Verbrecher wurde gefasst. Die Göttin ist unfehlbar. Nun wir wollen gehen.\n@c2@"
  en: "@aKiryl@bIt is happy that criminal is caught. Goddess does not give to cow that butts. Now, let us go.\n@c2@"
  es: "@aKiryl@bYo coиteиto poя cяimiиal captuяado. Diosa иo ayudaя a hombяes malvados. Ahoяa иosotяos maяchaя.\n@c2@"
  fr: "@aKiryl@bJe suis heuяeux que ce cяimiиel ait été attяapé.\nLa Déesse иe laisse aucuи cяime impuиi.\nЯepяeиoиs la яoute, maiиteиaиt.\n@c2@"
  it: "@aKyril@bSono felice che ladro è stato catturato. Dea nyet permette che uomini malvagi fanno loro cuomodi!\n@c2@"
  ja: "@a@bクリフト「犯人を　とらえたそうですね。\n\tやはり　神は見ておられた！\n\tさあ　ここから　出してください。\n@c2@"
"71":
  de: "@aBorja@bAnschuldigungen gegen uns also sich haben als falsch bewiesen. Ich hatte mir schon schrecklich Sorge gemacht.\n@c2@"
  en: "@aBorya@bSo finally our false accusation is proved empty.\nThis mishap was terrible worry for me.\n@c2@"
  es: "@aBorya@bFiиalmeиte demostяaя que acusacióи иuestяa falsa sieиdo. Este coиtяatiempo habieиdo pяeocupado mucho a mí.\n@c2@"
  fr: "@aBorya@bAiиsi иos accusatяices oиt eu la pяeuve de иotяe iииoceиce.\nCette mésaveиtuяe m'a vяaimeиt fait peuя.\n@c2@"
  it: "@aBoris@bFinalmente ingiuste accuse cuontro di noi sono cadute!\nQuesta è stata pruova muolto dura per me... \n@c2@"
  ja: "@a@bブライ「やれやれ。　ようやく\n\tぬれぎぬが　晴れたそうですな。\n\tとんだ　災難でしたわい。\n@c2@"
"72":
  de: "@aBorja@bWir müssen nun nicht länger weilen hier.\nBefreit mich, bitte.\n@c2@"
  en: "@aBorya@bThere is no use for us to remain here more.\nPlease release me.\n@c2@"
  es: "@aBorya@bYa иo siяvieиdo de иada que иosotяos quedaя aquí.\nPoя favoя, libeяaяme.\n@c2@"
  fr: "@aBorya@bIl est iиutile de s'attaяdeя ici.\nLibéяez-moi, s'il vous plaît.\n@c2@"
  it: "@aBoris@bOra nyet necessario che io resta qui.\nPer favore, ora io vuole uscire.\n@c2@"
  ja: "@a@bブライ「さて　そうなれば\n\tこんな所に　長居は無用。\n\t早く　出してくだされ。\n@c2@"
"73":
  de: "@aTorneko@bIhr habt den Halunken also? Der Göttin sei dank! So, jetzt macht das Tor auf und holt mich hier raus.\n@c2@"
  en: "@aTorneko@bYe've caught the criminal, have ye? Well thank the Goddess for that! Now crack this gate open and let yer ole friend out, would ye?\n@c2@"
  es: "@aTorneko@b%H860%XHas%YHabéis%Z captiurado al criminal, ¿verdiad? ¡Gracias a la Diosia lo %H860%Xhas%Yhabéis%Z consieguido! Ahora %H860%Xabrie%Yabrid%Z esa puertia y %H860%Xlibiera%Ylibierad%Z a este viejio amigo %H860%Xtuyo%Yvuestro%Z.\n@c2@"
  fr: "@aTorneko@bVous avez attrapé le criminel, c'est çaⓡ\nNous pouvons remercier la Déesseⓠ\nMaintenant, sortez votre vieil ami de làⓠ\n@c2@"
  it: "@aBaldo@bMa che te ha' preso il ladro?! Maremma bandita, questa sì che è una notizia! Forza, %H860%Xapri%Yaprite%Z huesta porta, 'un gliela fò più!\n@c2@"
  ja: "@a@bトルネコ「ああ　よかった！\n\t犯人を　つかまえてくれたんですね。\n\tさあ　早く　ここを開けてください。\n@c2@"
"74":
  de: "@aMaya@bTatsächlich?! Wir sind frei? Oh, das ist ein Stück Glück! Schnell. Holt mich hier raus. Es ist nicht besonders schön hier.\n@c1@"
  en: "@aMaya@bReally!? We're in the clear? Oh, that's smashing!\nQuick, then. Let me out.\nI'm really hating it in here.\n@c1@"
  es: "@aMaya@b¿De verdad? ¿Podemos marchar? ¡Oh, eso es maravilloso! Rápido entonces. %H860%XSáqueme%YSáquenme%Z. Realmente, odio este sitio.\n@c1@"
  fr: "@aMaya@bVraimentⓠⓑ Nous sommes %R000%Xlavées%Ylavés%Z de tout soupçonⓡ\nAlors faites-moi vite sortir d'ici.\nJe déteste cet endroit.\n@c1@"
  it: "@aMaya@bSiamo stati scagionati?!? Ma davvero? Che bello!\nAvanti, voglio uscire! Non ne potevo più di stare qui dentro!\n@c1@"
  ja: "@a@bマーニャ「ぬれぎぬが　晴れたのね！？\n\tよかった。　早く　出してちょうだい！\n\tもう　こんな所　たえられない……。\n@c1@"
"75":
  de: "@aMina@bIhr habt den Dieb gefangen? Ich habe immer daran geglaubt, dass Ihr mich wieder befreien würdet.\n@c1@"
  en: "@aMeena@bYou've caught the real criminal?\nI was always believing that you'd come through for me.\n@c1@"
  es: "@aMeena@b¿%H860%XHa%YHan%Z capturado al verdadero criminal?\nSiempre supe que %H860%Xregresaría%Yregresarían%Z para sacarme de aquí.\n@c1@"
  fr: "@aMina@bVous avez attrapé le criminelⓡ\nJ'étais convaincue que vous me sortiriez de là.\n@c1@"
  it: "@aMyra@b%H860%XHai%YAvete%Z preso il bandito? Ho sempre saputo che non mi %H860%Xavresti%Yavreste%Z abbandonata!\n@c1@"
  ja: "@a@bミネア「犯人を　つかまえたんですね。\n\tみなさんなら　やってくれると\n\t信じてました。\n@c1@"
"76":
  de: "@a%0%a00160@b...\n@c0@"
  en: "@a%0%a00160@b...\n@c0@"
  es: "@a%0%a00160@b...\n@c0@"
  fr: "@a%0%a00160@b............\n@c0@"
  it: "@a%0%a00160@b... \n@c0@"
  ja: "@a@b%a00160「…………。\n@c0@"
"77":
  de: "@a@b*: Irgendwo, IRGENDWO in dieser Welt ist ein unglaublich mächtiger Stab versteckt. Der Blitzstab!\n@c1@"
  en: "@a@b*: Somewhere, SOMEWHERE in this world is a staff of incredible magic. Yes, the lightning staff!\n@c1@"
  es: "@a@b*: En algún lugar, EN ALGÚN LUGAR de este mundo hay un bastón increíblemente mágico. Sí, ¡el báculo de luz!\n@c1@"
  fr: "@a@b*ⓢ Quelque part, QUELQUE PART dans notre monde se trouve un bâton magique extraordinairement puissant. Il s'agit du bâton de foudreⓠ\n@c1@"
  it: "@a@b*: Da qualche parte nel mondo è nascosto un bastone dotato di poteri incredibili: il Bastone del fulmine!\n@c1@"
  ja: "@a@b＊「なんでも　この世のどこかに\n\tいかずちの杖とよばれる\n\t強力な魔法の杖が　あるそうですね。\n@c1@"
"78":
  de: "@a@b*: Als Zauberin muss ich so was schließlich wissen! Ich muss herausfinden, wie mächtig seine Magie wirklich ist!\n@c1@"
  en: "@a@b*: As a sorceress, I have to know! I must see for myself just how powerful its magic really is!\n@c1@"
  es: "@a@b*: Como hechicera, tengo que saberlo. Debo comprobar por mí misma cuán poderosa es en realidad su magia.\n@c1@"
  fr: "@a@b*ⓢ En tant que sorcière, il faut que je sacheⓠ\nIl faut que je voie à quel point il est puissantⓠ\n@c1@"
  it: "@a@b*: In qualità di strega, devo scoprire di cosa si tratti! Voglio sperimentare con le mie mani tutta la sua incommensurabile potenza!\n@c1@"
  ja: "@a@b＊「わたしも　魔法使いとして\n\tどれほどの魔力を秘めた杖なのか\n\tこの目で　確かめてみたいものです。\n@c1@"
"79":
  de: "@a@b*: Nachts ist die Burg verschlossen. Aus Sicherheitsgründen.\n@c2@"
  en: "@a@b*: The castle is locked at night.\nItⓙs dangerous.\n@c2@"
  es: "@a@b*: El castillo permanece cerrado de noche.\nEs peligroso.\n@c2@"
  fr: "@a@b*ⓢ Le château est fermé la nuit pour des raisons de sécurité.\n@c2@"
  it: "@a@b*: Di notte il castello è chiuso. Può essere pericoloso, da queste parti... \n@c2@"
  ja: "@a@b＊「夜は　不用心ゆえ\n\tお城を　閉めてしまいます。\n@c2@"
"80":
  de: "@a@b*: Kommt morgen wieder.\n@c2@"
  en: "@a@b*: Come back in the morning, please.\n@c2@"
  es: "@a@b*: %H860%XRegrese%YRegresen%Z por la mañana, se lo ruego.\n@c2@"
  fr: "@a@b*ⓢ Revenez demain matin, s'il vous plaît.\n@c2@"
  it: "@a@b*: Per favore, %H860%Xtorna%Ytornate%Z domattina.\n@c2@"
  ja: "@a@b＊「どうか　また　明日の朝\n\tおこしくださいまし。\n@c2@"
"81":
  de: "@a@b*: Hatschi! Ich war gerade... nun ja, Ihr wisst schon... ich musste mich erleichtern, und da haben sie einfach das Tor zugemacht!\n@c2@"
  en: "@a@b*: Ahchoo! I was just...well, you know...relieving myself out here, when they went and shut the castle gates on me!\n@c2@"
  es: "@a@b*: ¡Achíís! Yo solo estaba... bien, bueno... aliviando aquí fuera mis necesidades, ¡cuando llegaron y me cerraron las puertas del castillo en las narices!\n@c2@"
