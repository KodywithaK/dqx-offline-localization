  es: "@a@b*: Aunque no %H860%Xte%Yos%Z servirá de mucho. Está tan húmeda que solo servirá para provocar un ruidoso estallido.\n@c0@"
  fr: "@a@b*ⓢ Mais ça ne vous servira pas à grand-chose, si vous voulez mon avis. Elle est trop humide pour exploser. Au mieux, ça fera un sacré boucan.\n@c0@"
