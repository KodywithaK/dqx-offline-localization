  ja: "@a@b＊「もっとも　シケっちまってて\n\t派手な音をさせるくらいしか\n\t使いみちが　ないだろうけどな。\n@c0@"
"40":
  de: "@a@b*: Mit den Monstern und dem Gas werd ich schon fertig. Bevor ich nicht das Gold gefunden habe, kriegen mich hier keine zehn Pferde weg!\n@c2@"
  en: "@a@b*: I can unearth monsters, I can hit gas, but until I find gold, I'm not shifting!\n@c2@"
