"9":
  de: "@a@bEs steht geschrieben...\nⓞHIER RUHT HÉLÈNE, MEINE GELIEBTE FRAU.ⓟ\n@c0@"
  en: "@a@bThere's an inscription...\nⓗHERE LIES HELEN, MY BELOVED WIFE.ⓘ\n@c0@"
  es: "@a@bHay una inscripción...\n''AQUÍ YACE MARLAINE, MI ADORADA ESPOSA.''\n@c0@"
  fr: "@a@bIl y a une épitaphe...\nⓥICI REPOSE HÉLÈNE, MON ÉPOUSE ADORÉEⓦ\n@c0@"
  it: "@a@bC'è un'iscrizione...\nⓕQUI GIACE HELENA, MIA ADORATA MOGLIE.ⓖ\n@c0@"
  ja: "@a@b愛するヘレン　ここに眠る。\nと刻まれている。\n@c0@"
"10":
  de: "@a@b%0%a00120 untersucht den Grabstein.\n@c0@"
  en: "@a@b%0%a00120 examines the gravestone.\n@c0@"
  es: "@a@b%0%a00120 examina la lápida.\n@c0@"
  fr: "@a@b%0%a00120 examine la tombe.\n@c0@"
  it: "@a@b%0%a00120 esamina la lapide.\n@c0@"
