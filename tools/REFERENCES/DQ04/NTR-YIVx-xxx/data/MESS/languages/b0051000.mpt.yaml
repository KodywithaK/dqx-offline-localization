"11":
  de: "@a@bEs steht geschrieben...\nⓞIN ERINNERUNG AN UNSERE TAPFEREN BERGMÄNNER.ⓟ\n@c0@"
  en: "@a@bThere's an inscription...\nⓗTO THE SOULS OF OUR BRAVE MINERS.ⓘ\n@c0@"
  es: "@a@bHay una inscripción...\n''EN MEMORIA DE LAS ALMAS DE NUESTROS VALIENTES MINEROS.''\n@c0@"
  fr: "@a@bIl y a une épitaphe...\nⓥÀ LA MÉMOIRE DE NOS COURAGEUX MINEURSⓦ\n@c0@"
  it: "@a@bC'è un'iscrizione...\nⓕIN MEMORIA DEI NOSTRI CORAGGIOSI MINATORI.ⓖ\n@c0@"
  ja: "@a@b勇敢な　鉱山の男たちの魂よ\n永遠なれ……　と刻まれている。\n@c0@"
"12":
  de: "@a@b*: Dieser Ort war einst voller Menschen. Aber nun... Oh! Quelle horreur!\n@c2@"
  en: "@a@b*: Zis was a place most lively once.\nBut now... Oh! Quelle horreur!\n@c2@"
  es: "@a@b*: Este lugagr estabá lleno de vida antes.\nPegro ahogra... ¡Oh! ¡Qué hogrror!\n@c2@"
  fr: "@a@b*ⓢ C'était une place très vivante avant. Mais maintenant... quelle tragedyⓠ\n@c2@"
  it: "@a@b*: Prima questo posto era pieno di vita.\nE ora... Oh! Quelle horreur!\n@c2@"
  ja: "@a@b＊「かつて　にぎやかだった　この町も\n\t今は　このありさま……。\n@c2@"
"13":
  de: "@a@b*: Mir wurde meine teure Frau genommen. Isch bin heut noch wie benommen...\n@c2@"
  en: "@a@b*: My dearest wife was taken from me. She is no more... I, I wish to be buried 'ere alongside ma chérie.\n@c2@"
  es: "@a@b*: Me agrrebatagron a mi amada esposa. Ella ya no... Deseagría estagr entegrrado junto a mi amada.\n@c2@"
  fr: "@a@b*ⓢ Ma très chère femme m'a quitté. Elle n'est plus... Je... J'aimerais être enterré à ses côtés.\n@c2@"
  it: "@a@b*: La mia cara moglie mi è stata portata via. Non sce più... Io, io desidero essere seppellito qui accanto alla mia chérie.\n@c2@"
  ja: "@a@b＊「私の妻も　この町で　ながい眠りに\n\tつきました……。　私も　この町に\n\t骨を埋める　つもりです。\n@c2@"
"14":
  de: "@a@b*: Wie soll ich denn nur mein Brot verdienen? Früher hab ich Schießpulver hergestellt, aber das ist jetzt verboten. Auf Befehl des Kanzlers.\n@c2@"
  en: "@a@b*: How's an old man supposed to make a living, eh? I used to make gunpowder, but it's been banned now. Order of the Chancellor, you know.\n@c2@"
  es: "@a@b*: ¿Cómo se las va a apañar un viejo como yo? Antes fabricaba pólvora pero ahora está prohibido. Órdenes del Canciller, %H860%Xsabes%Ysabéis%Z.\n@c2@"
  fr: "@a@b*ⓢ Comment un vieillard comme moi peut-il bien gagner sa vieⓡ\n㈡\n*ⓢ Avant, je fabriquais de la poudre à canon, mais c'est interdit maintenant. Ordre du chancelier.\n@c2@"
  it: "@a@b*: Come fa a campare un povero vecchio? Prima preparavo polvere da sparo, ma ora è stata bandita per ordine del Cancelliere. Tzé!\n@c2@"
  ja: "@a@b＊「わしは　火薬作りの名人じゃ。\n\tしかし　火薬作りは\n\tお城から　禁止されてしまってのう。\n@c2@"
"15":
  de: "@a@b*: Falls %H860%Xdu deshalb hier bist%Yihr deshalb hier seid%Z... Ähem! Vielleicht ist unten in der Mine noch was... Aber von mir %H860%Xhast du%Yhabt ihr%Z das nicht, verstanden? \n@c2@"
  en: "@a@b*: Anyway, if that's what you're here for, there might beⓚⓛ AHEM! (splutter) Sorry. There might be some left down the mine. ...I never told you, though.\n@c2@"
  es: "@a@b*: Pero, si es para lo que %H860%Xhas%Yhabéis%Z venido, puede que haya... ¡EJEM! (tos) Lo siento. Puede que quede algo en la mina... Aunque yo no %H860%Xte%Yos%Z he dicho nada.\n@c2@"
  fr: "@a@b*ⓢ Enfin, si c'est pour ça que vous êtes là, il doit... HUMⓠ (il crache)... désolé... il doit en rester un peu au fond de la mine... Je vous ai rien dit, comprisⓡ\n@c2@"
  it: "@a@b*: Comunque, se è per questo motivo che %H860%Xsei%Ysiete%Z qui, dovrebbe... Coff! Sput! Ehm, %H860%Xscusa%Yscusate%Z... Dicevo che dovrebbe essercene un po' nella miniera.\n㈡\n*: Ma io non ho detto niente a nessuno, eh! Ci siamo capiti?\n@c2@"
  ja: "@a@b＊「もし火薬がほしいなら　炭鉱の中に\n\tまだ残っているから　それを\n\t持ってゆくがいい。　ゴホゴホ……。\n@c2@"
"16":
  de: "@a@bKeine Reaktion.\nAus diesem Körper ist alles Leben längst entwichen.\n@c2@"
  en: "@a@bNo reply.\nIt's just a corpse.\n@c2@"
  es: "@a@bNo hay respuesta.\nEs un cadáver.\n@c2@"
  fr: "@a@bPas de réponse.\nCe n'est qu'un cadavre.\n@c2@"
  it: "@a@bNon risponde...\nÈ solo un cadavere.\n@c2@"
  ja: "@a@b返事がない。\nただの　しかばねのようだ……。\n@c2@"
"17":
  de: "@a@b*: Was %H860%Xmachst du%Ymacht ihr%Z hier? %H860%XVerschwinde besser, sonst endest du%YVerschwindet besser, sonst endet ihr%Z noch wie alle anderen!\n@c2@"
  en: "@a@b*: What are you doing here!? You'd better leave, or you'll end up like the person next door!\n@c2@"
  es: "@a@b*: ¡¿Qué %H860%Xestás%Yestáis%Z haciendo aquí?! ¡Será mejor que %H860%Xte marches%Yos marchéis%Z o %H860%Xacabarás%Yacabaréis%Z como el vecino!\n@c2@"
  fr: "@a@b*ⓢ Qu'est-ce que vous faites iciⓠⓑ\nVous feriez mieux de partir ou vous finirez comme tous les autresⓠ\n@c2@"
  it: "@a@b*: Cosa %H860%Xstai%Ystate%Z facendo qui?! Sarà meglio %H860%Xche tu te ne vada%Yche ve ne andiate%Z via subito, se non %H860%Xvuoi%Yvolete%Z finire come il tizio qui accanto!\n@c2@"
  ja: "@a@b＊「あんたたち！　となりの部屋の\n\t人みたいに　ならないうちに\n\tはやく　よそに　おゆき！\n@c2@"
"18":
  de: "@a@b*: Ich? Oh, nein. Ich hab mich immer um die Kranken und Leidenden gekümmert. Ich kann nicht gehen. Nicht jetzt.\n@c2@"
  en: "@a@b*: Me? Oh, no. I've always looked after the sick and injured, me. I couldn't leave. Not now.\n@c2@"
  es: "@a@b*: ¿Yo? Oh, no. Siempre he cuidado de los enfermos y los heridos. No podría marcharme. No ahora.\n@c2@"
  fr: "@a@b*ⓢ Moiⓡ Oh no. Je me suis toujours occupée des malades et des blessés. Je ne peux pas partir d'ici... pas maintenant.\n@c2@"
  it: "@a@b*: Io? Oh, no. Io ho sempre badato ai malati e ai feriti. Non posso partire. Non adesso.\n@c2@"
  ja: "@a@b＊「わたし？　わたしは　みんなの世話を\n\tするのが　昔からの仕事なのさ。\n\t病人を　置いてはいけないしね。\n@c2@"
"19":
  de: "@a@b*: Ähem! (hust) Ähem! Wenn %H860%Xdir dein%Yeuch euer%Z Leben lieb ist, %H860%Xsolltest du%Ysolltet ihr%Z nicht in die Mine gehen.\n@c2@"
  en: "@a@b*: Ahem! (cough) Ahem!\nIf ya value yer life, ya won't go down that mine.\n@c2@"
  es: "@a@b*: ¡Ejem! (tos) ¡Ejem!\nSi %H860%Xaprecias tu%Yapreciáis vuestra%Z vida, será mejor que no %H860%Xentres%Yentréis%Z en la mina.\n@c2@"
  fr: "@a@b*ⓢ Aheuⓠ Aheuⓠ (toux)\nSi vous tenez à la vie, ne descendez pas dans la mine.\n@c2@"
  it: "@a@b*: Ehm! Coff! Ehm!\nSe ci %H860%Xtieni%Ytenete%Z alla pelle, non %H860%Xentrare%Yentrate%Z in quella miniera.\n@c2@"
  ja: "@a@b＊「ゴホゴホ……。\n\t命がおしかったら　炭鉱には\n\t入らないことです。\n@c2@"
"20":
  de: "@a@b*: Seit dieses seltsame Gas dort... Ähem!... ausströmt, treiben sich Monster da unten herum. Ähem... \n@c2@"
  en: "@a@b*: Ever since that weird gas started ⓚⓛ Uuurgh! ⓚⓛ seepin' out, there's been monsters by the cartload down there. Ahem...\n@c2@"
  es: "@a@b*: Desde que empezó a filtrarse ese gas extraño... ¡Aaargh!... Hay monstruos por todas partes ahí abajo. Ejem...\n@c2@"
  fr: "@a@b*ⓢ Depuis que ce gaz a commencé à... arghⓠ... à se répandre, il y a des monstres en pagaille là-dessous. Aheuⓠ\n@c2@"
  it: "@a@b*: Da quando quello strano gas ha iniziato a diffondersi... Argh... sono comparsi tantissimi mostri laggiù. Sput!\n@c2@"
  ja: "@a@b＊「変なガスが　出たときから\n\t魔物たちが　現れはじめて……。\n\tゴホゴホ……。\n@c2@"
"21":
  de: "@a@b*: Das ist das Grab meiner lieben Frau Hélène...\n@c2@"
  en: "@a@b*: Zis is ze grave of my late wife, 'Elen...\n@c2@"
  es: "@a@b*: Esta es la tombe de mi difunta esposa, Marlaine...\n@c2@"
  fr: "@a@b*ⓢ C'est la tombe de ma poor femme...\nHélène...\n@c2@"
  it: "@a@b*: Questa è la tomba della mia chérie, Helena...\n@c2@"
  ja: "@a@b＊「妻の　ヘレンの墓です。\n@c2@"
"22":
  de: "@a@b*: Oh, Hélène, ma chérie... Isch werde bald bei dir sein...\n@c2@"
  en: "@a@b*: Oh, 'Elen, my love... I will be joining you soon, ma chérie...\n@c2@"
  es: "@a@b*: Oh, Marlaine, mon amour... Pgronto estagré a tu lado, ma chérie...\n@c2@"
  fr: "@a@b*ⓢ Ma pauvre Hélène, my love... Je te rejoindrai bientôt, darling...\n@c2@"
  it: "@a@b*: Oh, Helena, mon amour... Ti raggiungerò presto, ma chérie...\n@c2@"
  ja: "@a@b＊「ヘレン……。　君に会える日も\n\tそう遠くはないようだ……。\n@c2@"
"23":
  de: "@a@b*: Im Feuer braten sollen all jene, die diese Ruinen zerstören wollen! (Brutzel, Brutzel)\n@c2@"
  en: "@a@b*: Fiery misfortune on any who would destroy these ruins! (sizzle sizzle)\n@c2@"
  es: "@a@b*: ¡Que la desgracia acompañe a aquel que ose destruir estas ruinas! (chisporroteo)\n@c2@"
  fr: "@a@b*ⓢ Le malheur s'abattra sur quiconque essaiera de détruire ces ruinesⓠ Shhhhhⓠ\n@c2@"
  it: "@a@b*: Sssventure infinite sssi abbatteranno sssu chiunque proverà a dissstruggere quessste rovine!\n@c2@"
  ja: "@a@b＊「わが遺跡を　荒らす者に\n\t災いあれ……。　メラメラメラ……。\n@c2@"
"24":
  de: "@a@b*: Zisch und Schmurgel, wenn %H860%Xdu weitergräbst%Yihr weitergrabt%Z! (Brutzel, Brutzel)\n@c2@"
  en: "@a@b*: Frizzle and Kasizzle if you dig any more! (sizzle sizzle)\n@c2@"
  es: "@a@b*: ¡Ataque ígneo y Superataque ígneo si seguís cavando! (chisporroteo)\n@c2@"
  fr: "@a@b*ⓢ Superflamme et Mégacrame si vous continuez à creuserⓠ Shhhhhⓠ\n@c2@"
  it: "@a@b*: Le fiamme dell'inferno %H860%Xti avvolgeranno%Yvi avvolgeranno%Z ssse %H860%Xossserai%Yossserete%Z continuare a ssscavare! Frrrrr!\n@c2@"
  ja: "@a@b＊「これ以上　掘り進んではならぬ……。\n\tメラメラメラ……。\n@c2@"
"25":
  de: "@a@b*: Großvater hat seine Arbeit geliebt. Aber dann hat der neue Marquis Régent jegliches Schießpulver verboten.\n@c1@"
  en: "@a@b*: Poor Grandpa lived for his work. But gunpowder was banned as soon as the Marquis Regent replaced the old king.\n@c1@"
  es: "@a@b*: El pobre abuelo vivía para su trabajo. Pero cuando el Marqués Regente sustituyó al viejo rey, prohibió la pólvora.\n@c1@"
  fr: "@a@b*ⓢ Mon pauvre grand-père ne vivait que pour son travail, mais la poudre à canon a été interdite dès que le Lord Regent a succédé au vieux roi.\n@c1@"
  it: "@a@b*: Il povero nonno viveva per il suo lavoro, poi il Marchese Reggente ha preso il posto del vecchio Re e ha messo al bando la polvere da sparo.\n@c1@"
  ja: "@a@b＊「おじいちゃんは　火薬作りだけが\n\t生きがいだったのに\n\tそれを　禁止されてしまったんです。\n@c1@"
"26":
  de: "@a@b*: Seitdem ist Großvater sehr unglücklich.\n@c1@"
  en: "@a@b*: Grandpa's been miserable ever since.\n@c1@"
  es: "@a@b*: Desde entonces, el abuelo está sumido en la desgracia.\n@c1@"
  fr: "@a@b*ⓢ Papy est tellement triste depuis.\n@c1@"
  it: "@a@b*: E da allora il nonno non si è più ripreso.\n@c1@"
  ja: "@a@b＊「それ以来　すっかり\n\t元気を　なくしてしまって……。\n@c1@"
"27":
  de: "@a@b*: Tut mir leid, %H860%Xmein Kind%Ymeine Kinder%Z, aber ich bin müde. Ich hab den ganzen Tag die Kranken gepflegt.\n@c2@"
  en: "@a@b*: I'm sorry, my %H860%Xchild%Ychildren%Z, but I'm weary. I've been dealing with the sick all day long.\n@c2@"
  es: "@a@b*: Lo siento %H860%Xcriatura%Ycriaturas%Z, pero estoy derrotado. Llevo todo el día ayudando a los enfermos.\n@c2@"
  fr: "@a@b*ⓢ Je suis désolé, %H860%Xmon enfant%Ymes enfants%Z, mais je suis éreinté. J'ai passé ma journée auprès des malades.\n@c2@"
  it: "@a@b*: Mi dispiace, ma sono esausto. Ho passato tutto il giorno a badare ai malati.\n@c2@"
  ja: "@a@b＊「疲れているんです。　休ませてください。\n\t昼のあいだ　一日中\n\tケガ人の　手当てをしていて……。\n@c2@"
"28":
  de: "@a@b*: Aaah... Aber morgen früh... Ähem!... wird die Göttin %H860%Xdich%Yeuch%Z sicher segnen... (hust) Ähem, ähem!\n@c2@"
  en: "@a@b*: Aaah... If you come back in the morning, ⓚⓛ Ahymn! ⓚⓛ the Goddess will surely bless you... (splutter) Ahymn, ahymn!\n@c2@"
  es: "@a@b*: Aaah... Si %H860%Xvuelves%Yvolvéis%Z por la mañana, ¡ejem!, la Diosa %H860%Xte%Yos%Z dará su bendición... (tos) ¡Ejem, ejem!\n@c2@"
