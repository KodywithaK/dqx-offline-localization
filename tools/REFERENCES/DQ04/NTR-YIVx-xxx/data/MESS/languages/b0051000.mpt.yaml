"38":
  de: "@a@b*: Ach, Schießpulver? Da müsste noch was in dem Fass in der Truhe dort sein. Meinetwegen %H860%Xkannst du%Ykönnt ihr%Z es haben.\n@c0@"
  en: "@a@b*: You're here for gunpowder, is it?\nShould be a keg in that chest, I reckon. It's all yours if you want it.\n@c0@"
  es: "@a@b*: ¿%H860%XHas%YHabéis%Z venido por la pólvora, verdad?\nCreo que en ese cofre debería haber una tinaja. Toda %H860%Xtuya%Yvuestra%Z si la %H860%Xquieres%Yqueréis%Z.\n@c0@"
  fr: "@a@b*ⓢ Vous venez chercher de la poudre, c'est çaⓡ\nIl doit y en avoir une jarre dans ce coffre.\nPrenez-la si vous voulez.\n@c0@"
  it: "@a@b*: %H860%XSei%YSiete%Z qui per la polvere da sparo, vero? Mi pare che in quello scrigno ce ne sia un barilotto. %H860%XPrendilo pure, se vuoi%YPrendetelo pure, se volete%Z.\n@c0@"
  ja: "@a@b＊「火薬を　取りに来ただって？\n\tだったら　そこの箱に　火薬つぼが\n\t入ってるぜ。　持っていきな。\n@c0@"
"39":
  de: "@a@b*: Allerdings wird das nicht viel nützen. Das Pulver ist zu feucht, und es wird höchstens 'nen lauten Knall geben.\n@c0@"
