"0":
  de: "@aWumms@bAha! Die fünf Tage sind um! Tut mir leid, Torneko, ich muss weg.\n@c2@"
  en: "@aHardie@bAh-ha! The promised five days is up!\nSorry, Torneko, but I'm off.\n@c2@"
  es: "@aManolo@b¡Ajá! ¡Los cinco días acordados han terminado!\nLo siento Torneko, me marcho.\n@c2@"
  fr: "@aHardi@bAh ah, les cinq jours sont écoulésⓠ\nDésolé, Torneko, mais j'arrête.\n@c2@"
  it: "@aBrando@bOh! I cinque giorni sono scaduti! Sono spiacente, Baldo, ma il mio lavoro finisce qui.\n@c2@"
  ja: "@a@bスコット「おお！　どうやら\n\t約束の５日が　すぎたようだな。\n\t悪いが　ここでお別れだ。\n@c2@"
"1":
  de: "@aWumms@bPass gut auf dich auf!\n@c2@"
  en: "@aHardie@bTake care of yourself!\n@c2@"
  es: "@aManolo@b¡Cuídate!\n@c2@"
  fr: "@aHardi@bBonne chance pour la suiteⓠ\n@c2@"
  it: "@aBrando@bTi auguro buona fortuna!\n@c2@"
  ja: "@a@bスコット「では　気をつけてな。\n\tさらばだ！\n@c2@"
"2":
  de: "@aWalther@bUnsere fünf gemeinsamen Tage sind um, oh weh, und ich sage auf Wiedersehen, Au Revoir und Ade!\n@c2@"
  en: "@aLaurel@bI wish it wasn't true, but you and I are through!\nMy five days is up, I regret.\nFarewell, my...pet?\n@c2@"
  es: "@aBenito@bOjalá no fuera cierto: nuestra relación terminó.\nLos cinco días se acabaron.\nHasta pronto... ¿corazón?\n@c2@"
  fr: "@aLaurel@bCela me désole, mais ça y est, j'arrêteⓠ\nLes cinq jours se sont écoulés, je le regrette.\nAu revoir, ami des poètes.\n@c2@"
  it: "@aEncanto@bLa cosa mi rende triste,\nma la nostra collaborazione più non esiste!\n㈡\nOrmai cinque giorni son passati, temo,\ne ora noi salutarci dovremo... \n@c2@"
  ja: "@a@bロレンス「残念ですが\n\t約束の５日が　すぎました。\n\tでは　私は　これで。　さようなら……。\n@c2@"
"3":
  de: "@a@bTorneko liest die Königliche Botschaft vor...\n@c0@"
  en: "@a@bTorneko reads out the royal scroll...\n@c0@"
  es: "@a@bTorneko lee el pergamino real...\n@c0@"
  fr: "@a@bTorneko lit le parchemin royal...\n@c0@"
  it: "@a@bBaldo legge la pergamena reale...\n@c0@"
  ja: "@a@bトルネコは　王の手紙を　読んだ。\n@c0@"
"4":
  de: "@a@bⓞEure Majestät, König Kunz von Bruckstetten,\n㈡\nentschuldigt bitte dieses übereilte Schreiben, doch ich muss eine äußerst wichtige Angelegenheit mit Euch besprechen.\n@c0@"
  en: "@a@bⓗYour Majesty, King Shamus of Ballymoral,\n㈡\nⓗI apologise for the rather abrupt nature of this missive, but there is an urgent matter I must bring to your attention.\n@c0@"
  es: "@a@b''Su Majestad, sah Cha Cha de Alcazaba,''\n㈡\n''Mis disculpas por la naturaleza un tanto abrupta de esta misiva, pero desearía llamar vuestra atención sobre un asunto un tanto urgente.''\n@c0@"
  fr: "@a@bⓥVotre Majesté, Roi Chamtu de Ballimore,\n㈡\nCette missive vous paraîtra quelque peu brutale et je vous prie de m'en excuser, mais je dois vous faire part d'une affaire urgente.\n@c0@"
  it: "@a@bⓕVostra Maestà, Re Torus di Balmontone,ⓖ\n㈡\nⓕVi prego di perdonare il tono severo del mio messaggio, ma il problema che desidero sottoporre alla vostra attenzione è di enorme importanza.ⓖ\n@c0@"
  ja: "@a@b親愛なる　ボンモールの王よ。\nとつぜんだが　わしの話を\n聞いてほしい。\n@c0@"
"5":
  de: "@a@bWie es scheint, sind meine Tochter, Prinzessin Veronica, und Euer Sohn, Prinz Hinz, ineinander verliebt.\n@c0@"
  en: "@a@bⓗIt seems my daughter, Princess Veronica, and your son, Prince Regan, are in love.\n@c0@"
  es: "@a@b''Parece que mi hija, la Princesa Verónica, y vuestro hijo, el Príncipe Alí, están enamorados.''\n@c0@"
  fr: "@a@bIl semblerait que ma fille, la princesse Véronica, et votre fils, le prince Réginald, soient amoureux.\n@c0@"
  it: "@a@bⓕLa mia adorata figlia, la Principessa Veronica, e il vostro caro figlio, il Principe Vitellozzo, si amano.ⓖ\n@c0@"
  ja: "@a@bどうやら　わしの娘モニカと\nそなたの息子リックとが\n愛し合っているらしいのじゃ。\n@c0@"
"6":
  de: "@a@bUnd obwohl ich nichts überstürzen möchte, würde ich eine baldige Heirat der beiden vorschlagen... Hochachtungsvoll, König Norbert von Endor.ⓟ\n@c0@"
  en: "@a@bⓗThough I would not recommend excessive haste in the matter, I wish to propose that they marry... Sincerely, King Norman of Endorⓘ\n@c0@"
  es: "@a@b''A pesar de que no quisiera acelerar el asunto, quisiéramos tomarnos la licencia de proponer que contrajeran matrimonio...''\n㈡\n''Atentamente, el Rey Norman de Endor.''\n@c0@"
  fr: "@a@bBien que je ne souhaite pas hâter les choses, je vous propose d'autoriser leur mariage...\nCordialement, Roi Norbert de Chandorⓦ\n@c0@"
  it: "@a@bⓕPur sconsigliando di procedere con eccessiva fretta, propongo che i due giovani si sposino.\nRegali saluti da Re Norman di Endorⓖ.\n@c0@"
  ja: "@a@bすぐにとは言わぬが　ふたりを\n結婚させたいと　思うのだが……。\n\t　　エンドールの王より\n@c0@"
"7":
  de: "@aKönig Kunz@bSo ist das also?!\n@c2@"
  en: "@aKing Shamus@bSo that's the craic, is it!?\n@c2@"
  es: "@aSah Cha Cha@b¿Así que eso es lo que está pasiando, no?\n@c2@"
  fr: "@aRoi Chamtu@bAlors ça pour une surpriseⓠ\n@c2@"
  it: "@aRe Torus@bUhm... Allora le hose stanno hosì, eh?!\n@c2@"
  ja: "@a@b王「なんと　そういうことであったかっ！？\n@c2@"
"8":
  de: "@aKönig Kunz@bNun ja, wenn Hinz Veronica heiratet, wird er sowieso der nächste König von Endor!\n@c2@"
  en: "@aKing Shamus@bWell if Regan marries Veronica, he'll be the next King of Endor in any case!\n@c2@"
  es: "@aSah Cha Cha@b¡De tiodos modos, si Alí se casa con Verónica, será el prioximo rey de Endor!\n@c2@"
  fr: "@aRoi Chamtu@bSi Réginald se marie avec Véronica, il sera de toute façon le prochain roi de Chandorⓠ\n@c2@"
  it: "@aRe Torus@bBeh, se Vitellozzo sposa Veronica, sarà homunque i'pprossimo Re di Endor!\n@c2@"
  ja: "@a@b王「いずれ　わが息子リックが\n\tエンドール王の　娘ムコになるなら\n\tリックが　次のエンドール王じゃ！\n@c2@"
"9":
  de: "@aKönig Kunz@bUnd ich kann auf Endor Anspruch erheben, ohne einen Finger krumm zu machen!\n@c2@"
  en: "@aKing Shamus@bI'll lay claim to Endor without havin' to lift a finger, so I will!\n@c2@"
  es: "@aSah Cha Cha@bPiodré recliamar Endor sin tener que lievantar un solo dedo, ¡cliaro!\n@c2@"
  fr: "@aRoi Chamtu@bEt je pourrai enfin prendre ce royaume sans bouger le petit doigtⓠ\n@c2@"
  it: "@aRe Torus@bMa allora 'un ci so' problemi! Avrò il dominio su Endor senza dove' alza' nemmeno un dito!\n@c2@"
  ja: "@a@b王「なにも　攻め込まずとも\n\tエンドールは　手に入るではないか！\n@c2@"
"10":
  de: "@aKönig Kunz@bÄhem! Ihr... äh... habt unserem Land gute Dienste geleistet. Ich schicke sofort einen Boten nach Endor. Ihr dürft nun gehen.\n@c2@"
  en: "@aKing Shamus@bAhem! So...em...yer service to the country is duly noted. I'll send an envoy to Endor right away. You can leave now.\n@c2@"
  es: "@aSah Cha Cha@b¡Ejem! Eh... em... tu siervicio al país sierá tenido en cuenta. Enviaré un emisiario a Endor ahora mismo. Ahora puedes retiriarte.\n@c2@"
  fr: "@aRoi Chamtu@bHumⓠ Bien... euh... nous prenons note du service rendu au pays. J'envoie immédiatement un émissaire à Chandor. Vous pouvez vous retirer.\n@c2@"
  it: "@aRe Torus@bEhm, ehm... Dunque... %H860%XHai%YAvete%Z reso un importante servigio a i'ppaese. Invierò immediatamente un messo a Endor. Ora %H860%Xpuoi%Ypotete%Z anda'.\n@c2@"
  ja: "@a@b王「ご苦労であった。\n\t早速　使いの者を　出すので\n\tそなたは　さがってよいぞ。\n@c2@"
