"0":
  de: "@a@b*: Oh, hallo! Wartet, ich helfe Euch hier heraus... Aber seht Euch erst an, was in dieser Kommode ist. Das wird Euch bestimmt nicht leid tun!\n@c2@"
  en: "@a@b*: Oh, ⓙello! Let me ⓙelp you out ⓙere...\nJust take a butcher's inside that chest oⓙ drawers. You wonⓙt regret it!\n@c2@"
  es: "@a@b*: ¡Qué hay! %H860%XDeja%YDejadme%Z que %H860%Xte%Yos%Z eche una manita...\nSolo %H860%Xtienes%Ytenéis%Z que echarle un ojo al mueble este. %H860%XTe%YOs%Z molará.\n@c2@"
  fr: "@a@b*ⓢ Bonjourⓠ Laissez-moi vous donner un coup de main...\n㈡\n*ⓢ Jetez donc un coup d'œil dans cette commode. Vous ne le regretterez pasⓠ\n@c2@"
  it: "@a@b*: %H860%XAscolta%YAscoltate%Z uno che se ne intende... %H860%XDai%YDate%Z un'occhiata in quella cassettiera. Non %H860%Xte ne pentirai%Yve ne pentirete%Z!\n@c2@"
  ja: "@a@b＊「やあ　こんにちは！\n\tタンスの中を　調べてごらんなさい。\n\t面白いものが　入っていますよ。\n@c2@"
"1":
  de: "@a@b*: Ihr! Was habt Ihr hier zu suchen?!\n@c1@"
  en: "@a@b*: You there!\nWhat are you doing in here!?\n@c1@"
  es: "@a@b*: ¡Eh, %H860%Xtú%Y%R000%Xvosotras%Yvosotros%Z%Z!\n¡¿Qué %H860%Xhaces%Yhacéis%Z aquí?!\n@c1@"
  fr: "@a@b*ⓢ Vous, làⓠ\nQue faites-vous donc iciⓠⓑ\n@c1@"
  it: "@a@b*: Ehi, %H860%Xtu! Che stai%Yvoi! Che state%Z facendo qui dentro?!\n@c1@"
  ja: "@a@b＊「あなたたち！\n\tここで　何をしているの？\n@c1@"
"2":
  de: "@a@b*: Oh, du gute Göttin! Meine Bronze-Gebetskette!\n@c1@"
  en: "@a@b*: ...Dear Goddess! My bronze rosary!\n@c1@"
  es: "@a@b*: ¡Por la Diosa! ¡Mi rosario de bronce!\n@c1@"
  fr: "@a@b*ⓢ ... Par la Déesseⓠ Mon rosaire de bronzeⓠ\n@c1@"
  it: "@a@b*: Oh, mia buona dea! Il mio Rosario di bronzo!\n@c1@"
  ja: "@a@b＊「……ま　まさか\n\tわたしの　ブロンズの十字架を！？\n@c1@"
"3":
  de: "@a@b*: Hilfe! Zu Hilfe!\n%H860%X%A120%XEin Dieb%Z%B120%XEine Diebin%Z%YDiebe%Z!\n@c1@"
  en: "@a@b*: Help! Someone, help!\nThereⓙs %H860%Xa thief%Ya gang of thieves%Z in here!\n@c1@"
  es: "@a@b*: ¡Auxilio! ¡Que alguien me ayude!\n¡Hay %H860%X%A120%Xun ladrón%Z%B120%Xuna ladrona%Z%Yuna banda de ladrones%Z aquí!\n@c1@"
  fr: "@a@b*ⓢ Au secoursⓠ À l'aideⓠ Venez m'aiderⓠ\nIl y a %H860%X%A120%Xun voleur%Z%B120%Xune voleuse%Z%Y%R000%Xdes voleuses%Ydes voleurs%Z%Z iciⓠ \n@c1@"
  it: "@a@b*: Aiuto! Aiutatemi! Al ladro!\n@c1@"
  ja: "@a@b＊「誰か！　どろぼうよ！\n\t誰か来てぇ～！\n@c1@"
"4":
  de: "@a@b*: Ein Diebstahl? Hier in der Burg?! So eine Frechheit!\n@c2@"
  en: "@a@b*: Thieving? Inside the castle!?\nThe cheek of it!\n@c2@"
  es: "@a@b*: ¿Ladrones? ¡¿Dentro del castillo!?\n¡Qué insolencia!\n@c2@"
  fr: "@a@b*ⓢ Un volⓡ Dans le châteauⓠⓑ\nQuel culotⓠ\n@c2@"
  it: "@a@b*: Rubare all'interno del castello? Che oltraggio!\n@c2@"
  ja: "@a@b＊「お城の中で\n\t盗みをはたらくとは　ふとどきな！\n@c2@"
"5":
  de: "@a@b*: Ihr könnt nicht entwischen.\nAlso seid friedlich und kommt mit, ohne Widerstand zu leisten.\n@c2@"
  en: "@a@b*: Thereⓙs nowhere for you to run.\nCome quietly.\n@c2@"
  es: "@a@b*: No hay ningún lugar donde %H860%Xpuedas%Ypodáis%Z escapar.\n%H860%XRíndete%YRendíos%Z.\n@c2@"
  fr: "@a@b*ⓢ Vous pouvez pas vous échapper.\nRendez-vous gentimentⓠ\n@c2@"
  it: "@a@b*: Non %H860%Xhai%Yavete%Z vie di fuga. %H860%XArrenditi%YArrendetevi%Z!\n@c2@"
  ja: "@a@b＊「もはや　逃げられはせぬ！\n\tさあ　来るのだっ！\n@c2@"
"6":
  de: "@a@b*: Folgt mir.\nIhre Majestät möchte Euch sehen.\n@c2@"
  en: "@a@b*: Follow me.\nHer Majesty has summoned you.\n@c2@"
  es: "@a@b*: %H860%XSígame%YSíganme%Z.\nSu Majestad %H860%X%A120%Xle%Z%B120%Xla%Z%Y%R000%Xlas%Yles%Z%Z ha llamado a su presencia.\n@c2@"
  fr: "@a@b*ⓢ Suivez-moiⓠ\nSa Majesté veut vous voir.\n@c2@"
  it: "@a@b*: %H860%XSeguimi. Devi presentarti%YSeguitemi. Dovete presentarvi%Z al cospetto della nostra Regina.\n@c2@"
  ja: "@a@b＊「出なさい。\n\t女王さまが　お呼びです！\n@c2@"
"7":
  de: "@a@b*: Ich bin die Königin von Femiscyra. Ich bestimme über das Schicksal derer, die in meinem Königinnenreich Verbrechen begehen.\n@c1@"
  en: "@a@b*: I am the Queen of Femiscyra.\nI decide the fate of those accused of crime in my queendom.\n@c1@"
  es: "@a@b*: Soy la reina de Feministia.\nYo decido el destino de los que son acusados de cometer un crimen en mi reino.\n@c1@"
  fr: "@a@b*ⓢ Je suis la reine de Fémiscyra.\nJe suis la seule à décider du sort de ceux qui sont accusés de crimes dans mon royaume.\n@c1@"
  it: "@a@b*: Sono la Regina di Femiscyra. Ho il compito di giudicare chi ha commesso crimini nel nostro regno.\n@c1@"
  ja: "@a@b女王「わたくしは　この国の女王。\n\t罪を犯した者を\n\t裁かなくてはなりません。\n@c1@"
"8":
  de: "@aKönigin von Femiscyra@bLaut Zeugenaussage sollt Ihr die Bronze-Gebetskette einer Nonne gestohlen haben, die hier in der Burg arbeitet.\n@c1@"
  en: "@aQueen of Femiscyra@bThis testimony states that you stole the bronze rosary of a nun working in my castle.\n@c1@"
  es: "@aReina de Feministia@bEste testigo afirma que %H860%Xusted robó%Yustedes robaron%Z el rosario de bronce de una monja que trabaja en mi castillo.\n@c1@"
  fr: "@aReine de Fémiscyra@bSelon ce témoignage, vous avez volé le rosaire de bronze d'une nonne officiant dans mon château.\n@c1@"
  it: "@aRegina di Femiscyra@bSul %H860%Xtuo%Yvostro%Z capo pende l'accusa di aver rubato il Rosario di bronzo appartenente a una suora che alloggia nel mio castello.\n@c1@"
  ja: "@a@b女王「申し立てによれば　そなたたちが\n\tシスターの　ブロンズの十字架を\n\t盗みだしたそうですね。\n@c1@"
"9":
  de: "@aKönigin von Femiscyra@bIst diese Aussage korrekt?\n@c1@"
  en: "@aQueen of Femiscyra@bIs the testimony correct?\n@c1@"
  es: "@aReina de Feministia@b¿Es eso cierto?\n@c1@"
  fr: "@aReine de Fémiscyra@bEst-ce vraiⓡ\n@c1@"
  it: "@aRegina di Femiscyra@bCiò risponde a verità?\n@c1@"
  ja: "@a@b女王「この申し立てに\n\t間違いはありませんか？\n@c1@"
"10":
  de: "@aKönigin von Femiscyra@bBildet Euch bloß nicht ein, dass Eure Strafe milder ausfällt, nur weil Ihr Euch schuldig bekennt.\n@c1@"
  en: "@aQueen of Femiscyra@bDonⓙt imagine for one second that your punishment will be lighter if you admit your guilt.\n@c1@"
  es: "@aReina de Feministia@bSu castigo no será menor por el simple hecho de que %H860%Xadmita%Yadmitan%Z su culpa.\n@c1@"
  fr: "@aReine de Fémiscyra@bN'allez pas imaginer que le châtiment sera plus clément si vous reconnaissez votre faute.\n@c1@"
  it: "@aRegina di Femiscyra@bNon %H860%Xpensare%Ypensate%Z nemmeno per un istante che la %H860%Xtua%Yvostra%Z punizione sarà minore se %H860%Xammetterai di essere colpevole%Yammetterete di essere colpevoli%Z.\n@c1@"
  ja: "@a@b女王「認めたふりをして\n\t罪を　軽くしてもらおうとしても\n\tムダなことですよ。\n@c1@"
"11":
  de: "@aKönigin von Femiscyra@bDies ist ein Gericht der Göttin!\nAlso antwortet wahrheitsgemäß!\n@c1@"
  en: "@aQueen of Femiscyra@bThis is a court of the Goddess!\nAnswer truthfully!\n@c1@"
  es: "@aReina de Feministia@b¡%H860%XSe encuentra%YSe encuentran%Z ante un tribunal de la Diosa!\n¡%H860%XResponda%YRespondan%Z con la verdad!\n@c1@"
  fr: "@aReine de Fémiscyra@bCe tribunal est celui de la Déesseⓠ\nDites la véritéⓠ\n@c1@"
  it: "@aRegina di Femiscyra@bQuesta è una corte della dea!\n%H860%XDevi rispondere%YDovete rispondere%Z con la massima sincerità!\n@c1@"
  ja: "@a@b女王「今は　神聖な裁判中。\n\t正直に　答えるのです。\n@c1@"
"12":
  de: "@aKönigin von Femiscyra@bIch frage Euch noch einmal. Habt Ihr nun die Bronze-Gebetskette gestohlen oder nicht?\n@c1@"
  en: "@aQueen of Femiscyra@bI will ask you once again. Are you not the %H860%Xcriminal%Ycriminals%Z who stole the bronze rosary?\n@c1@"
  es: "@aReina de Feministia@bSe lo preguntaré una vez más. ¿No%H860%X es %A120%Xel%Z%B120%Xla%Z criminal%Y son %R000%Xlas%Ylos%Z criminales%Z que %H860%Xrobó%Yrobaron%Z el rosario de bronce?\n@c1@"
  fr: "@aReine de Fémiscyra@bJe vais vous poser la question une dernière foisⓢ est-ce vous qui avez volé le rosaire de bronzeⓡ\n@c1@"
  it: "@aRegina di Femiscyra@b%H860%XTe%YVe%Z lo chiedo di nuovo.\n%H860%XSei colpevole%YSiete colpevoli%Z del furto del Rosario di bronzo?\n@c1@"
  ja: "@a@b女王「もう一度　たずねます。\n\tブロンズの十字架を　盗んだのは\n\tそなたたちなのですね？\n@c1@"
"13":
  de: "@aKönigin von Femiscyra@bDoch eine Dienerin der Göttin hat geschworen, dass sie Euch auf frischer Tat ertappt hat!\n@c1@"
  en: "@aQueen of Femiscyra@bBut a woman of the Goddess has given a sworn testimony that she caught you in the act!\n@c1@"
  es: "@aReina de Feministia@bPero una mujer de la Diosa ha testificado bajo juramento que %H860%X%A120%Xle%Z%B120%Xla%Z%Y%R000%Xlas%Yles%Z%Z cogió in fraganti.\n@c1@"
  fr: "@aReine de Fémiscyra@bPourtant, une servante de la Déesse a témoigné sous serment qu'elle vous avait pris%H860%X%A120%X%Z%B120%Xe%Z%Y%R000%Xes%Y%Z%Z en flagrant délitⓠ\n@c1@"
  it: "@aRegina di Femiscyra@bMa una donna di fede ha giurato di aver visto con i suoi occhi che lo %H860%Xrubavi%Yrubavate%Z!\n@c1@"
  ja: "@a@b女王「しかし　シスターは\n\tそなたたちが　盗んでいるところを\n\t見たと　言っていますが。\n@c1@"
"14":
  de: "@aKönigin von Femiscyra@bUnd Ihr beharrt immer noch auf Eurer Unschuld, auch wenn die Beweise gegen Euch sprechen?\n@c1@"
  en: "@aQueen of Femiscyra@bAnd you still claim your innocence, despite the overwhelming evidence against you?\n@c1@"
  es: "@aReina de Feministia@b¿Y aún así %H860%Xproclama%Yproclaman%Z su inocencia?\n@c1@"
  fr: "@aReine de Fémiscyra@bEt vous continuez à clamer votre innocence malgré cette preuve accablanteⓡ\n@c1@"
  it: "@aRegina di Femiscyra@bNonostante le schiaccianti prove esistenti contro di %H860%Xte, continui a proclamarti innocente%Yvoi, continuate a proclamarvi innocenti%Z?\n@c1@"
  ja: "@a@b女王「それでも　違うと\n\t言い張るのですか？\n@c1@"
"15":
  de: "@aKönigin von Femiscyra@bAber wenn Ihr unschuldig seid, wer ist dann der Schuldige? Und vor allem, wo ist er?\n@c1@"
  en: "@aQueen of Femiscyra@bWell if you are innocent, who is the criminal responsible? And where is he?\n@c1@"
  es: "@aReina de Feministia@bBien, si %H860%Xes inocente%Yson inocentes%Z, ¿quién es responsable del robo? ¿Y dónde se encuentra?\n@c1@"
  fr: "@aReine de Fémiscyra@bSi vous êtes innocent%H860%X%A120%X%Z%B120%Xe%Z%Y%R000%Xes%Ys%Z%Z, qui est le coupableⓡ Et où est-ilⓡ\n@c1@"
  it: "@aRegina di Femiscyra@bBene! Se davvero %H860%Xsei innocente%Ysiete innocenti%Z, chi è il vero responsabile? E dove si trova adesso?\n@c1@"
  ja: "@a@b女王「だとすると　ブロンズの十字架を\n\t盗みだしたのは\n\t誰なのでしょうか？\n@c1@"
"16":
  de: "@aKönigin von Femiscyra@bIch bin eine gerechte Königin und möchte Euch eine Chance geben.\n㈡\nWenn Ihr Eure Unschuld beweisen wollt, müsst Ihr den wahren Täter finden und zu mir bringen!\n@c1@"
  en: "@aQueen of Femiscyra@bI am a fair queen. I will give you a chance.\nIf you wish to prove your innocence, find the real perpetrator and bring him to me!\n@c1@"
  es: "@aReina de Feministia@bSoy una reina justa. %H860%XLe%YLes%Z concedo una oportunidad.\nSi %H860%Xdesea%Ydesean%Z probar su inocencia, ¡%H860%Xbusque%Ybusquen%Z al verdadero criminal y %H860%Xtráigalo%Ytráiganlo%Z a mi presencia!\n@c1@"
  fr: "@aReine de Fémiscyra@bJe suis quelqu'un de juste. Je vous laisse encore une chance.\n㈡\nSi vous voulez prouver votre innocence, trouvez le coupable et amenez-le-moi.\n@c1@"
  it: "@aRegina di Femiscyra@bSono una persona giusta, e ho deciso di %H860%Xdarti%Ydarvi%Z una possibilità. Se %H860%Xvuoi dimostrare la tua innocenza, trova il ladro e portalo%Yvolete dimostrare la vostra innocenza, trovate il ladro e portatelo%Z al mio cospetto.\n@c1@"
  ja: "@a@b女王「もし　ぬれぎぬで　あるならば\n\tそなたたちに　本当の犯人を\n\t見つける機会を　あたえましょう。\n@c1@"
"17":
  de: "@aKönigin von Femiscyra@bDoch es gibt eine Bedingung! Ihr müsst eine Person als Pfand zurücklassen.\n@c1@"
  en: "@aQueen of Femiscyra@bThere is one condition, though! You must leave one of your party behind here as a surety.\n@c1@"
  es: "@aReina de Feministia@b¡Pero hay una condición! Un miembro de su grupo deberá quedarse aquí a modo de garantía.\n@c1@"
  fr: "@aReine de Fémiscyra@bJ'y mets cependant une conditionⓢ un membre de votre groupe doit rester ici en guise de garantie.\n@c1@"
  it: "@aRegina di Femiscyra@bTuttavia, c'è una condizione: un membro del gruppo dovrà restare qui, come ⓕgaranziaⓖ, in attesa che la situazione si chiarisca.\n@c1@"
  ja: "@a@b女王「ただし！\n\tそれまで　仲間のひとりを\n\t預からせてもらいます。\n@c1@"
"18":
  de: "@aKönigin von Femiscyra@bWächter! Nehmt ein Mitglied ihrer Gruppe fest und sperrt es in den Kerker!\n@c1@"
  en: "@aQueen of Femiscyra@bGuards! Take one of these people and lock them in the cells!\n@c1@"
  es: "@aReina de Feministia@b¡Guardias! ¡Llevaos a una de estas personas y encerradla en las celdas!\n@c1@"
  fr: "@aReine de Fémiscyra@bGardesⓠ Enfermez %R000%Xl'une d'entre elles%Yl'un d'entre eux%Zⓠ\n@c1@"
  it: "@aRegina di Femiscyra@bGuardie! Prendete uno di loro e rinchiudetelo in cella!\n@c1@"
  ja: "@a@b女王「兵士！\n\tこの者たちの　仲間のひとりを\n\t牢へ　閉じこめるように！\n@c1@"
"19":
  de: "@aKönigin von Femiscyra@bSo sei es denn. Ihr dürft nun gehen!\n@c1@"
  en: "@aQueen of Femiscyra@bVery well. You may go!\n@c1@"
  es: "@aReina de Feministia@b¡Muy bien! ¡%H860%XPuedes retirarte%YPodéis retiraros%Z!\n@c1@"
  fr: "@aReine de Fémiscyra@bBien. Vous pouvez vous retirerⓠ\n@c1@"
  it: "@aRegina di Femiscyra@bMolto bene. Ora %H860%Xpuoi%Ypotete%Z andare.\n@c1@"
  ja: "@a@b女王「さあ　おゆきなさい。\n@c1@"
"20":
  de: "@aKönigin von Femiscyra@bIhr ändert Eure Aussage also?\n@c1@"
  en: "@aQueen of Femiscyra@bYouⓙre changing your plea now!?\n@c1@"
  es: "@aReina de Feministia@b¡¿Ahora %H860%Xcambia%Ycambian%Z su declaración?!\n@c1@"
  fr: "@aReine de Fémiscyra@bVous voulez plaider %H860%Xcoupable%Ycoupables%Z, maintenantⓠⓑ\n@c1@"
  it: "@aRegina di Femiscyra@b%H860%XHai%YAvete%Z intenzione di rendere una dichiarazione differente?\n@c1@"
  ja: "@a@b女王「先ほどとは　言うことが\n\tちがうではありませんか！\n@c1@"
"21":
  de: "@aKönigin von Femiscyra@bIch gebe Euch noch eine letzte Chance.\nIhr habt die Bronze-Gebetskette gestohlen, nicht wahr?\n@c1@"
  en: "@aQueen of Femiscyra@bI will give you one more chance.\nYou stole the bronze rosary, did you not?\n@c1@"
  es: "@aReina de Feministia@b%H860%XLe%YLes%Z concederé una oportunidad más.\n%H860%XRobó%YRobaron%Z el rosario de bronce, ¿no es así?\n@c1@"
  fr: "@aReine de Fémiscyra@bJe vous donne une dernière chanceⓢ est-ce bien vous qui avez volé le rosaire de bronzeⓡ\n@c1@"
  it: "@aRegina di Femiscyra@b%H860%XTi%YVi%Z darò un'ultima possibilità: %H860%Xhai rubato tu%Yavete rubato voi%Z il Rosario di bronzo?\n@c1@"
  ja: "@a@b女王「いま一度　たずねます。\n\tそなたたちが　盗んだのですね？\n@c1@"
"22":
  de: "@a@b*: %0%a00160 wird hier in Gewahrsam bleiben.\n@c2@"
  en: "@a@b*: %0%a00160 will remain behind in our custody, then.\n@c2@"
  es: "@a@b*: %0%a00160 permanecerá bajo nuestra custodia, entonces.\n@c2@"
  fr: "@a@b*ⓢ %0%a00160 va donc rester dans notre prison.\n@c2@"
  it: "@a@b*: %0%a00160 resterà con noi.\n@c2@"
  ja: "@a@b＊「%a00160を　人質として\n\t預からせてもらいました。\n@c2@"
"23":
  de: "@a@b*: Ihre Majestät hat angeordnet, dass Ihr den Gefangenen jederzeit gegen ein anderes Mitglied Eurer Gruppe austauschen könnt, wenn Ihr wollt.\n@c2@"
  en: "@a@b*: Her Majesty has ordered me to let you exchange the detainee for another member of your party at any time.\n@c2@"
  es: "@a@b*: Su Majestad me ha ordenado que %H860%Xle%Yles%Z permita cambiar %Q160%Xal prisionero%Ya la prisionera%Z por cualquier otro miembro de su grupo en cualquier momento.\n@c2@"
  fr: "@a@b*ⓢ Sa Majesté m'a ordonné de vous laisser la possiblité d'échanger %Q160%Xle détenu%Yla détenue%Z contre un autre membre de votre équipe quand vous le souhaitez.\n@c2@"
  it: "@a@b*: La nostra Regina %H860%Xti%Yvi%Z concede di scambiare in qualsiasi momento la persona detenuta con un altro membro del gruppo.\n@c2@"
  ja: "@a@b＊「もし　人質にする仲間を\n\tかえたいときは\n\tわたしに話しかけてください。\n@c2@"
"24":
  de: "@a@b*: Willkommen auf Burg Femiscyra.\n@c2@"
  en: "@a@b*: Welcome to Femiscyra Castle.\n@c2@"
  es: "@a@b*: %H860%X%A120%XBienvenido%Z%B120%XBienvenida%Z%Y%R000%XBienvenidas%YBienvenidos%Z%Z al Castillo de Feministia.\n@c2@"
  fr: "@a@b*ⓢ Bienvenue au château de Fémiscyra.\n@c2@"
  it: "@a@b*: %H860%X%A120%XBenvenuto%Z%B120%XBenvenuta%Z%Y%R000%XBenvenute%YBenvenuti%Z%Z al castello di Femiscyra.\n@c2@"
  ja: "@a@b＊「ガーデンブルグのお城に\n\tようこそ　いらっしゃいました。\n@c2@"
"25":
  de: "@a@b*: Wir hatten schon sehr, sehr lange keinen Besuch mehr.\n@c2@"
  en: "@a@b*: Itⓙs been a long, long time since we've had any visitors.\n@c2@"
  es: "@a@b*: Hace mucho tiempo que no recibimos visita alguna.\n@c2@"
  fr: "@a@b*ⓢ Cela fait bien longtemps que nous n'avons pas reçu de visiteurs.\n@c2@"
  it: "@a@b*: Era da lungo tempo che non avevamo visitatori.\n@c2@"
  ja: "@a@b＊「外から　お客さまが　来るなんて\n\t何年ぶりのことでしょう。\n@c2@"
"26":
  de: "@a@b*: In der Burg sind nur Frauen zugelassen. Denn unsere Königin ist so schön, dass alle Männer von ihr geblendet werden!\n@c2@"
  en: "@a@b*: Only women are allowed to live here in the castle. Our queen is too beautiful for men to bear!\n@c2@"
  es: "@a@b*: Solo las mujeres tienen permiso para vivir en este castillo. Nuestra reina es demasiado hermosa como para que los hombres puedan soportarlo.\n@c2@"
  fr: "@a@b*ⓢ Seules les femmes sont autorisées à vivre dans ce château. Les hommes ne peuvent supporter l'incroyable beauté de notre reineⓠ\n@c2@"
  it: "@a@b*: Solo le donne possono vivere nel castello: la nostra Regina è talmente bella che gli uomini non riuscirebbero nemmeno a guardarla!\n@c2@"
  ja: "@a@b＊「ここは　女だけが住むお城。\n\tわが女王さまは\n\tとても　美しいお方ですわ。\n@c2@"
"27":
  de: "@a@b*: Ein verdächtig aussehender Mann, sagt Ihr? Ja, hier ist ein Kerl vorbeigekommen, der wie ein Dichter angezogen war. Er war nach Süden unterwegs.\n@c2@"
  en: "@a@b*: A suspicious-looking man, you say?\nYes, there was a fellow dressed like a poet who came running past before. He was heading south.\n@c2@"
  es: "@a@b*: ¿Un hombre de aspecto sospechoso, %H860%Xdice%Ydicen%Z?\nSí, había un tipo vestido como un poeta que pasó antes a toda prisa. Se dirigía hacia el sur.\n@c2@"
  fr: "@a@b*ⓢ Quelqu'un qui avait l'air étrange, vous ditesⓡ\nOui, j'ai vu un homme déguisé en poète qui est passé en courant. Il se dirigeait vers le sud.\n@c2@"
  it: "@a@b*: Un individuo sospetto? Uhm, %H860%Xfammi%Yfatemi%Z pensare... Beh, prima ho visto un tizio vestito come un poeta. Stava andando verso sud.\n@c2@"
  ja: "@a@b＊「あやしい男を　見なかったかって？\n\tそういえば　詩人ふうのキザなヤツが\n\t南の方へ　走っていったな。\n@c2@"
"28":
  de: "@a@b*: Nanu?! %H860%X%A120%XEin Reisender%Z%B120%XEine Reisende%Z%YReisende%Z!\nDann ist der Weg wohl wieder frei, was?\n@c1@"
  en: "@a@b*: Oh, look! %H860%XA traveller%YTravellers%Z!\nSo, is the path clear again now, then?\n@c1@"
  es: "@a@b*: ¡Oh, mira! ¡%H860%X%A120%XUn viajero%Z%B120%XUna viajera%Z%Y%R000%XViajeras%YViajeros%Z%Z!\nEntonces, ¿el camino vuelve a estar abierto?\n@c1@"
  fr: "@a@b*ⓢ Oh, %H860%X%A120%Xun voyageur%Z%B120%Xune voyageuse%Z%Y%R000%Xdes voyageuses%Ydes voyageurs%Z%Zⓠ\nLe sentier est de nouveau praticable, si je comprends bienⓡ\n@c1@"
  it: "@a@b*: Oh, %H860%Xviandante, dimmi%Yviandanti, ditemi%Z... la strada è di nuovo sgombra adesso?\n@c1@"
  ja: "@a@b＊「あら？　旅の人ね！\n\tということは　ふさがっていた\n\t道も　元にもどったわけ？\n@c1@"
"29":
  de: "@a@b*: Das sind gute Neuigkeiten. Seit der Vulkan-\nausbruch ihn blockiert hat, war das Leben hier wirklich nicht leicht.\n@c1@"
  en: "@a@b*: Thatⓙs good news. Itⓙs been a real pain ever since the eruption blocked it off.\n@c1@"
  es: "@a@b*: Qué buena noticia. No ha habido más que problemas desde que la erupción lo bloqueó.\n@c1@"
  fr: "@a@b*ⓢ C'est une bonne nouvelle. C'était un peu dur d'être coupées du monde depuis cette éruption.\n@c1@"
  it: "@a@b*: Che bella notizia! Da quando l'eruzione l'aveva bloccata, avevamo avuto non pochi problemi.\n@c1@"
  ja: "@a@b＊「ああ　良かった！\n\tあそこが　ふさがれて以来\n\t不便で　しょうがなかったのよ。\n@c1@"
"30":
  de: "@a@b*: Hm? Wie meint Ihr? Ihr möchtet wissen, wo sich hier ein Dieb verstecken könnte?\n@c2@"
  en: "@a@b*: Hm? Whatⓙs that?\nYou want to know where a thief might hide out?\n@c2@"
  es: "@a@b*: ¿Mmm? ¿Qué?\n¿%H860%XQuieres%YQueréis%Z saber dónde podría ocultarse un ladrón?\n@c2@"
  fr: "@a@b*ⓢ Mmmⓡ Pardonⓡ\nVous me demandez où un voleur pourrait se cacherⓡ\n@c2@"
  it: "@a@b*: Eh? Cosa c'è?\n%H860%XVuoi%YVolete%Z sapere se conosco qualche posto dove un delinquente potrebbe andare a nascondersi?\n@c2@"
  ja: "@a@b＊「あん？　なんだって？\n\tどろぼうが　かくれそうなところ？\n@c2@"
"31":
  de: "@a@b*: Tja, also meine erste Wahl wäre eine Höhle. Aber ich bin natürlich keine Diebin!\n@c2@"
  en: "@a@b*: Well, a cave would be my first choice, I should think. Not that Iⓙd know of course!\n@c2@"
  es: "@a@b*: Pues bien, lo primero que se me ocurre es en una cueva. No es que lo sepa a ciencia cierta, ¡por supuesto!\n@c2@"
  fr: "@a@b*ⓢ À sa place, je choisirais une grotte, je pense.\nMais ça ne m'est jamais arrivé, bien sûr, alors ce n'est qu'une hypothèse.\n@c2@"
  it: "@a@b*: Beh, se fossi una ladra me ne andrei in una caverna. Non che io sia una mariuola, eh!\n@c2@"
  ja: "@a@b＊「そうね　あたしだったら\n\t洞くつにでも　かくれるかねっ。\n@c2@"
"32":
  de: "@a@b*: Offenbar ist der Herr der Unterwelt wieder auferstanden!\n@c1@"
  en: "@a@b*: Apparently the Lord of the Underworld is about to rise again!\n@c1@"
  es: "@a@b*: Parece ser que el Señor del Inframundo está a punto de alzarse de nuevo.\n@c1@"
  fr: "@a@b*ⓢ Il paraît que le Seigneur des Enfers est sur le point de ressusciterⓠ\n@c1@"
  it: "@a@b*: In giro si dice che il Signore degli Inferi stia per tornare in vita.\n@c1@"
  ja: "@a@b＊「いよいよ　地獄の帝王が\n\t復活するそうよ！\n@c1@"
"33":
  de: "@a@b*: Es heißt, dass nur %A090%Xein großer Held%Z%B090%Xeine große Heldin%Z ihn besiegen könne. Wer das wohl ist...?\n@c1@"
  en: "@a@b*: They say a great %A090%Xhero%Z%B090%Xheroine%Z is the only one who can defeat him. I wonder who it is...\n@c1@"
  es: "@a@b*: Dicen que %A090%Xun gran héroe%Z%B090%Xuna gran heroína%Z es %A120%Xel único%Z%B120%Xla única%Z que podrá derrotarle. Me pregunto quién será...\n@c1@"
  fr: "@a@b*ⓢ Mais les gens parlent d'un%A090%X grand héros qui serait le seul%Z%B090%Xe grande héroïne qui serait la seule%Z à pouvoir le vaincre. Je me demande qui c'est...\n@c1@"
  it: "@a@b*: Corre voce che solo %A090%Xun eroe coraggioso%Z%B090%Xuna coraggiosa eroina%Z possa sconfiggerlo. Mi chiedo chi possa mai essere... \n@c1@"
  ja: "@a@b＊「その帝王を倒すはずの\n\t伝説の勇者は\n\tいったい　何をやっているのかしら？\n@c1@"
"34":
  de: "@a@b*: Dieser Herr der Unterwelt ist doch ein Mann, richtig? Dann wird er uns Frauen sicherlich verschonen...\n@c1@"
  en: "@a@b*: This Lord of the Underworld is a man, isnⓙt he? Then heⓙll probably go easy on us women, wonⓙt he?\n@c1@"
  es: "@a@b*: Este Señor del Inframundo es un hombre, ¿no es así? Entonces, probablemente se lleve bien con nosotras las mujeres, ¿no es cierto?\n@c1@"
  fr: "@a@b*ⓢ Le Seigneur des Enfers est un homme, c'est çaⓡ\nDans ce cas, il sera sûrement plus gentil avec les femmes, nonⓡ\n@c1@"
  it: "@a@b*: Il Signore degli Inferi è un uomo, no? Allora sono sicura che tratterà noi donne con i guanti di velluto. Dico bene?\n@c1@"
  ja: "@a@b＊「地獄の帝王って　男よね。\n\tだったら　女の子には\n\t甘いんじゃないかなあ。\n@c1@"
"35":
  de: "@a@b*: Ich möchte keinen alten Mann. Mein Mann muss tapfer sein. Und stark. Und männlich...\n@c2@"
  en: "@a@b*: I donⓙt want any old man.\nMy man needs to be tough.\nAnd strong. And butch...\n@c2@"
  es: "@a@b*: No quiero ningún anciano.\nMi hombre tiene que ser un tipo duro.\nY fuerte. Y un machote...\n@c2@"
  fr: "@a@b*ⓢ Je ne veux pas d'un vieillard.\nMon homme doit être robuste.\nEt fort. Et macho...\n@c2@"
  it: "@a@b*: Non voglio un vecchio decrepito accanto a me! Il mio uomo dev'essere forte, maschio, macho!\n@c2@"
  ja: "@a@b＊「わたしは　どんな男であれ\n\tやはり　強い男が好きだ。\n@c2@"
"36":
  de: "@a@b*: Ja, tapfer genug, um manchmal kleine Rangeleien mit mir auszutragen! Ha ha ha!\n@c2@"
  en: "@a@b*: Yes, tough enough to enjoy a good wrestle sometimes! Hah hah hah!\n@c2@"
  es: "@a@b*: Sí, lo suficientemente duro como para disfrutar de un buen combate de vez en cuando. ¡Ja, ja, ja!\n@c2@"
  fr: "@a@b*ⓢ Autrement dit, assez coriace pour qu'on puisse se faire une bonne petite bagarre de temps à autreⓠ\nHa ha ha haⓠ\n@c2@"
  it: "@a@b*: E gli deve piacere l'attività fisica... di coppia! Ah! Ah! Ah! Ah! Ah!\n@c2@"
  ja: "@a@b＊「このわたしを\n\tうち負かしてくれるほど\n\t強い男が……。　ぽっ。\n@c2@"
"37":
  de: "@a@b*: Glaubt ja nicht, Ihr könntet hier irgendwelche faulen Tricks versuchen, nur weil diese Burg von Frauen verteidigt wird!\n@c2@"
  en: "@a@b*: Donⓙt think you can get up to any tricks just because this castle is defended by women!\n@c2@"
  es: "@a@b*: No se %H860%Xdeje%Ydejen%Z engañar por el hecho de que este castillo esté defendido exclusivamente por mujeres.\n@c2@"
  fr: "@a@b*ⓢ N'imaginez pas que vous pouvez vous livrer à d'obscures manigances sous prétexte que ce château est défendu par des femmesⓠ\n@c2@"
  it: "@a@b*: Non %H860%Xpensare%Ypensate%Z nemmeno di fare qualche brutto scherzo solo perché questo castello è difeso da donne!\n@c2@"
  ja: "@a@b＊「女だけの城だと思って\n\tあまく　見ないことだ。\n@c2@"
"38":
  de: "@a@b*: Ich bin doppelt so viel Frau wie Mann...? Ich meine, ich bin doppelt so viel Mann wie Frau...? Ach, nein, ich bin doppelt so stark wie jeder Mann!\n@c2@"
  en: "@a@b*: Iⓙm twice the woman any man is...?\nI mean, twice the man any woman...?\nNo, I mean, twice as strong as any man!\n@c2@"
  es: "@a@b*: Soy el doble de mujer que cualquier hombre...\nQuiero decir, el doble de hombre que cualquier mujer...\n㈡\n*: No, vaya, ¡el doble de fuerte que cualquier hombre!\n@c2@"
  fr: "@a@b*ⓢ Les hommes ne me font pas peur.\nJe n'en fais qu'une bouchée...\nC'est clairⓡ\n@c2@"
  it: "@a@b*: Sono due volte più uomo di qualsiasi donn... Cioè, sono due volte più donna di qualsiasi uom... No, voglio dire che sono due volte più forte di qualsiasi uomo!\n@c2@"
  ja: "@a@b＊「守りをかためる　われら戦士は\n\t男などに　負けはせぬぞ！\n@c2@"
"39":
  de: "@a@b*: Ich hatte das Glück, den guten Frauen von Femiscyra Waffen und Rüstungen liefern zu dürfen. Allerdings musste ich mich als Eunuch ausgeben!\n@c2@"
  en: "@a@b*: I was given permission to supply weapons and armour to the good women of Femiscyra. Mind you, I had to pretend to be a eunuch!\n@c2@"
  es: "@a@b*: Me fue concedido permiso para suministrar armas y armaduras a las buenas mujeres de Feministia. ¡Aunque tuve que hacerme pasar por un eunuco!\n@c2@"
  fr: "@a@b*ⓢ On m'avait donné l'autorisation de fournir des armes et des armures aux femmes de Fémiscyra.\n㈡\n*ⓢ Mais il avait fallu que je me fasse passer pour un eunuqueⓠ\n@c2@"
  it: "@a@b*: Ho avuto l'appalto per la fornitura di armi e armature per le donne del castello di Femiscyra!\n㈡\n*: Ma ho dovuto fingere di essere un eunuco per ottenerla... \n@c2@"
  ja: "@a@b＊「女性用の　武器や防具を\n\t仕入れさせてもらっています。\n@c2@"
"40":
  de: "@a@b*: Und dann wurde der Weg von Felsgestein zugeschüttet, so dass ich gefangen war mit all diesen Frauen...\n@c2@"
  en: "@a@b*: Then the way out of here got blocked in the eruption, and I've been stuck with the ladies everⓚⓛ\n@c2@"
  es: "@a@b*: Entonces la salida quedó bloqueada por la erupción y me quedé aquí encerrado entre mujeres...\n@c2@"
  fr: "@a@b*ⓢ Et puis je me suis retrouvé bloqué ici après l'éruption. Avec toutes ces femmes...\n@c2@"
  it: "@a@b*: Poi l'eruzione ha bloccato la strada, e sono rimasto bloccato qui con tutte queste donne. Poteva andarmi peggio!\n@c2@"
  ja: "@a@b＊「でも　火山の爆発で\n\t帰れなくなってしまって……。\n@c2@"
"41":
  de: "@a@b*: Was? Der Weg ist wieder frei? Tja, also... das ist jetzt aber schade...\n@c2@"
  en: "@a@b*: What? You can get through now?\nWell, thatⓙs...a bit of a shame, actually...\n@c2@"
  es: "@a@b*: ¿Qué? ¿Ya se puede pasar?\nBueno... eso es una pena, en realidad...\n@c2@"
  fr: "@a@b*ⓢ Commentⓡ On peut passer maintenantⓡ\nAh bonⓡ C'est... En fait, c'est un peu dommage...\n@c2@"
  it: "@a@b*: Come %H860%Xdici%Ydite%Z? Adesso la strada è di nuovo percorribile? Oh, che peccato!\n@c2@"
  ja: "@a@b＊「え？　道が通じた？\n\tうーむ　うれしいような\n\t残念なような……。\n@c2@"
"42":
  de: "@a@b*: Ich weiß nicht, ob Ihr nun schuldig oder unschuldig seid, aber diese Kette ist sehr wichtig für mich. Bringt sie mir zurück. Bitte!\n@c1@"
  en: "@a@b*: I donⓙt know if youⓙre guilty or not, but that bronze rosary is very important to me. Please! Return it!\n@c1@"
  es: "@a@b*: No sé si %H860%Xes culpable%Yson culpables%Z o no, pero ese rosario de bronce es muy importante para mí. ¡Por favor! ¡%H860%XDevuélvamelo%YDevuélvanmelo%Z!\n@c1@"
  fr: "@a@b*ⓢ Je ne sais pas si vous êtes %H860%Xcoupable%Ycoupables%Z ou non, mais ce rosaire de bronze a une très grande importance pour moi. Je vous en prieⓠ Rapportez-le-moiⓠ\n@c1@"
  it: "@a@b*: Non so se %H860%Xtu sia colpevole%Yvoi siate colpevoli%Z o meno, ma quel Rosario di bronzo mi è molto caro. Per favore, %H860%Xfammelo%Yfatemelo%Z riavere!\n@c1@"
  ja: "@a@b＊「あの　ブロンズの十字架は\n\t私の宝物です。\n\tどうか　返してください！\n@c1@"
"43":
  de: "@a@b*: Ich bin der einzige Mann, der hier auf der Burg lebt. Na ja, der einzige richtige Mann, wenn Ihr versteht.\n@c2@"
  en: "@a@b*: I'm the only man who lives in this entire castle, you know. Well, the only real man, that is.\n@c2@"
  es: "@a@b*: Soy el único hombre que habita en todo el castillo. Bueno, el único hombre de verdad, quiero decir.\n@c2@"
  fr: "@a@b*ⓢ Je suis le seul homme dans ce château.\nEnfin... le seul vrai homme, si vous voyez ce que je veux dire.\n@c2@"
  it: "@a@b*: Io sono l'unico uomo che vive in questo castello. Anzi, dovrei dire che sono l'unico maschio! Eh! Eh! Eh!\n@c2@"
  ja: "@a@b＊「この城に住んでいる男は\n\tわしだけじゃ。\n@c2@"
"44":
  de: "@a@b*: Ha ha ha. Da seid Ihr neidisch, was?\n%A120%XDas solltet Ihr auch!%Z%B120%XIhr seid wohl eine dieser ⓞmodernenⓟ Frauen...%Z\n@c2@"
  en: "@a@b*: Huh huh huh. Jealous, are you?\n%A120%XYou should be!%Z%B120%XSo you're one of those ⓗmodernⓘ women, eh?%Z\n@c2@"
  es: "@a@b*: Ja, ja, ja. %A120%XCeloso%Z%B120%XCelosa%Z, ¿eh?\n%A120%X¡No me extraña!%Z%B120%XEntonces eres una de esas mujeres ''modernas'', ¿no?%Z\n@c2@"
  fr: "@a@b*ⓢ Hé hé hé. Vous êtes %A120%Xjaloux%Z%B120%Xjalouse%Z, c'est çaⓡ\n%A120%XVous avez bien raison de l'êtreⓠ%Z%B120%XAlors vous êtes l'une de ces femmes ⓥmodernesⓦⓡ%Z\n@c2@"
  it: "@a@b*: Eh! Eh! Eh! %A120%XSei geloso, vero%Z%B120%XVuoi entrare a far parte del mio harem%Z?\n@c2@"
  ja: "@a@b＊「ふほっ　ふほっ\n\tうらやましいじゃろ？\n\tさて……。\n@c2@"
"45":
  de: "@a@b*: Miauuu... Miauuu...\n@c1@"
  en: "@a@b*: Meooow... Meooow...\n@c1@"
  es: "@a@b*: Miaaau... Miaaau...\n@c1@"
  fr: "@a@b*ⓢ Miaou... Miaou...\n@c1@"
  it: "@a@b*: Miao! Miao! Miao!\n@c1@"
  ja: "@a@b＊「にゃーん。\n@c1@"
"46":
  de: "@a@b*: Für einige mag es bloß eine dumme Geschichte sein, ich halte sie aber für wahr. Als die Großmutter Ihrer Majestät noch ein kleines Mädchen war...\n@c2@"
  en: "@a@b*: Some say itⓙs just an old husbands' tale, but itⓙs gospel truth. It was when Her Majesty's grandmother was still a young girl...\n@c2@"
  es: "@a@b*: Algunos dicen que no es más que una patraña de los hombres, pero es la pura verdad. Fue cuando la abuela de Su Majestad era aún joven...\n@c2@"
  fr: "@a@b*ⓢ Certains disent que ce n'est qu'une vieille histoire, mais c'est la vérité vraie.\n㈡\n*ⓢ Ça s'est passé quand la grand-mère de Sa Majesté était encore une jeune fille...\n@c2@"
  it: "@a@b*: Alcuni dicono che sia solo una leggenda, ma io so che è la verità. La storia risale a quando la nonna della nostra cara Regina era solo una fanciulla.\n@c2@"
  ja: "@a@b＊「古い話だけどね。\n\t今の女王さまの　おばあさまが\n\tまだ　お若かった時……。\n@c2@"
"47":
  de: "@a@b*: Da hat der König von Burland um sie geworben und schenkte ihr einen wertvollen Schatz, den Zenithiaschild.\n@c2@"
  en: "@a@b*: The then King of Burland tried to woo her by giving her a precious treasure known as the Zenithian Shield.\n@c2@"
  es: "@a@b*: El entonces rey de Burlandia intentó impresionarla regalándole un precioso tesoro conocido como el Escudo de Zenithia.\n@c2@"
  fr: "@a@b*ⓢ Celui qui était roi de Bastione en ce temps essaya de lui faire la cour en lui offrant un trésor appelé le Bouclier zénithien.\n@c2@"
  it: "@a@b*: Il sovrano che allora regnava a Burlandia cercò di conquistarla donandole un prezioso tesoro, lo Scudo Zenithiano.\n@c2@"
  ja: "@a@b＊「当時の　バトランド王から\n\t天空の盾というものを\n\t贈られたんだよ。\n@c2@"
"48":
  de: "@a@b*: Aber natürlich würde keine unserer Königinnen auf solch einen Unfug hereinfallen. Oh nein, nein, nein!\n@c2@"
  en: "@a@b*: But no queen of ours would fall for a stunt like that, of course. Oh, no, no, no!\n@c2@"
  es: "@a@b*: Pero ninguna reina nuestra sucumbiría ante semejante artimaña, por supuesto. ¡Oh, no, no, no!\n@c2@"
  fr: "@a@b*ⓢ Aucune de nos reines ne serait tombée amoureuse d'un joli cœur pareil. Oh que nonⓠ\n@c2@"
  it: "@a@b*: Ma la nostra regina non si fece sedurre da un regalo tanto misero. Oh, no! Nemmeno per idea!\n@c2@"
  ja: "@a@b＊「もちろん　先々代の女王さまは\n\tそんなもので\n\tくどかれはしなかったけどね。\n@c2@"
"49":
  de: "@a@b*: Hm? Was mit dem Schild passiert ist? Gute Frage... Ich nehme an, dass er noch irgendwo in der Burg herumliegt.\n@c2@"
  en: "@a@b*: Hm? What happened to the shield?\nWell, I wonder... I suppose it must still be in the castle somewhere.\n@c2@"
  es: "@a@b*: ¿Mmm? ¿Qué pasó con el escudo?\nBueno, imagino... Supongo que aún debe estar en algún lugar del castillo.\n@c2@"
  fr: "@a@b*ⓢ Mmmⓡ Ce qu'est devenu le bouclierⓡ\nEh bien, je ne sais pas... J'imagine qu'il doit encore être quelque part dans le château.\n@c2@"
  it: "@a@b*: Come? Cosa ne è dello scudo? Beh, credo che sia ancora custodito da qualche parte nel castello.\n@c2@"
  ja: "@a@b＊「えっ　その盾はどこかって？\n\tさあ？　今も　このお城のどこかに\n\tあるんじゃないかねえ。\n@c2@"
"50":
  de: "@a@b*: Ich sammle all die vielen Gerüchte, die sich um den Herrn der Unterwelt und seine Auferstehung ranken.\n@c1@"
  en: "@a@b*: Iⓙm cataloguing all the different rumours there are about the Lord of the Underworld and his resurrection.\n@c1@"
  es: "@a@b*: Estoy clasificando los diferentes rumores que circulan sobre el Señor del Inframundo y su resurrección.\n@c1@"
  fr: "@a@b*ⓢ Je recense les différentes rumeurs concernant le Seigneur des Enfers et son retour.\n@c1@"
  it: "@a@b*: Sto annotando tutte le voci che si sentono in giro in merito al Signore degli Inferi e alla sua resurrezione.\n@c1@"
  ja: "@a@b＊「地獄の帝王の復活について\n\tいろいろな　うわさ話を\n\tまとめているところです。\n@c1@"
"51":
  de: "@a@b*: Um die Prophezeiung über %A090%Xden Helden, der%Z%B090%Xdie Heldin, die%Z ihn besiegen soll...\n@c1@"
