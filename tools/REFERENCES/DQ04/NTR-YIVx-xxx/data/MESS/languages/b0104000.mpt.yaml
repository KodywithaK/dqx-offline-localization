"0":
  de: "@a@b*: Sieh an, sieh an. Es ist schon eine Weile her, seit ich zuletzt ein menschliches Antlitz zu Gesicht bekommen habe.\n@c2@"
  en: "@a@b*: Well, well, well. It's been many a year since I last set eyes on a human face.\n@c2@"
  es: "@a@b*: ¡Vaya, vaya, vaya! Hacía muchos años que no veía un rostro humano.\n@c2@"
  fr: "@a@b*ⓢ Eh bien. Voilà des années que je n'avais pas vu un visage humain.\n@c2@"
  it: "@a@b*: Ma bene! Erano molti anni che non vedevo un essere umano.\n@c2@"
  ja: "@a@b＊「おお！　これはこれは。\n\t人に会うなど　何年ぶりかのう。\n@c2@"
"1":
  de: "@a@b*: Ihr habt wohl eine weite Reise hinter Euch. Ich an Eurer Stelle wäre allerdings vorsichtig, hier in der Gegend herumzulaufen.\n@c2@"
  en: "@a@b*: You look like you're making quite a journey. I'd be careful when you're travelling around these parts, though.\n@c2@"
  es: "@a@b*: Parece que %H860%Xestás%Yestáis%Z de viaje. Yo me andaría con cuidado por estas tierras.\n@c2@"
  fr: "@a@b*ⓢ Vous avez l'air d'entreprendre un sacré voyage.\nÀ votre place, je ferais très attention par ici.\n@c2@"
  it: "@a@b*: Direi che %H860%Xtu stia%Yvoi stiate%Z facendo un lungo viaggio. %H860%XFai attenzione quando vai in giro%YFate attenzione quando andate in giro%Z da queste parti.\n@c2@"
  ja: "@a@b＊「旅の途中と　お見受けするが\n\tこのあたりを旅するなら\n\t気をつけるが　よろしかろう。\n@c2@"
"2":
  de: "@a@b*: Jetzt sieht man zwar nichts mehr, aber hier hat lange Zeit die Burg des Herrn der Unterwelt gestanden.\n@c2@"
  en: "@a@b*: It's sunk deep down in the ground now, but the Lord of the Underworld's castle stood in these parts long ago.\n@c2@"
  es: "@a@b*: Ahora se halla bien enterrado bajo tierra, pero antaño el castillo del Señor del Inframundo se encontraba en este territorio.\n@c2@"
  fr: "@a@b*ⓢ Il est enfoui sous terre désormais, mais il y a très longtemps, le château du Seigneur des Enfers se trouvait dans le coin.\n@c2@"
  it: "@a@b*: Ora è sprofondato nel sottosuolo, ma tempo fa in quest'area sorgeva il castello del Signore degli Inferi.\n@c2@"
  ja: "@a@b＊「今は地の底に　沈んでしもうだが\n\tはるか昔　このあたりの大陸に\n\t地獄の帝王の　居城があったそうな。\n@c2@"
"3":
  de: "@a@b*: Und auch wenn sie nun unter der Erde verborgen ist, entströmt ihr immer noch ein seltsames Gas. Nicht sehr angenehm, kann ich Euch sagen.\n@c2@"
  en: "@a@b*: Even though it's so far underground, there's still a strange gas-like substance floating up from it. Very unpleasant indeed.\n@c2@"
  es: "@a@b*: Aunque se encuentra a mucha profundidad bajo tierra, hay una extraña sustancia gaseosa que flota desde él. Muy desagradable, en verdad.\n@c2@"
  fr: "@a@b*ⓢ Bien qu'il soit profondément enterré, il en émane encore une espèce de gaz qui flotte dans l'air.\nC'est très désagréable.\n@c2@"
  it: "@a@b*: Nonostante si trovi in profondità, da lì proviene ancora oggi una strana, sgradevolissima sostanza simile a un gas.\n@c2@"
  ja: "@a@b＊「地の底に沈んだ今も　帝王の城から\n\t発せられる　ガスのような邪悪な気が\n\t地上に　流れてくるそうじゃ。\n@c2@"
"4":
  de: "@a@b*: Uwaaahhh! Uwaaahhh!\n@c2@"
  en: "@a@b*: Uwaaargh! Uwaaargh!\n@c2@"
  es: "@a@b*: ¡Aaaargh! ¡Aaaargh!\n@c2@"
  fr: "@a@b*ⓢ Waaarghⓠ Waaarghⓠ\n@c2@"
  it: "@a@b*: Uaaargh! Uaaargh!\n@c2@"
  ja: "@a@b＊「うおーん。　うおーん。\n@c2@"
"5":
  de: "@a@b*: Auf der Suche nach der Zenithiarüstung bereise ich die ganze Welt.\n@c2@"
  en: "@a@b*: I'm travelling the world in search of the Zenithian Armour.\n@c2@"
  es: "@a@b*: Viajo por todo el mundo en busca de la Armadura de Zenithia.\n@c2@"
  fr: "@a@b*ⓢ Je parcours le monde à la recherche de l'Armure zénithienne.\n@c2@"
  it: "@a@b*: Io giro per il mondo alla ricerca dell'Armatura Zenithiana.\n@c2@"
  ja: "@a@b＊「私は　天空のよろいを探して\n\t旅をしている。\n@c2@"
"6":
  de: "@a@b*: Ich bin mir ziemlich sicher, dass in einer Höhle ganz in der Nähe ein Hinweis versteckt ist.\n@c2@"
  en: "@a@b*: I can't help thinking that a cave nearby might hold a clue.\n@c2@"
  es: "@a@b*: No puedo evitar pensar que la clave puede encontrarse en una cueva cercana.\n@c2@"
  fr: "@a@b*ⓢ Je suis persuadé qu'il y a un indice quelque part dans une grotte de la région.\n@c2@"
  it: "@a@b*: Sono assolutamente convinto che in qualche caverna vicina troverò degli indizi che mi permetteranno di individuarla.\n@c2@"
  ja: "@a@b＊「どうも　このあたりの洞くつが\n\tあやしいと思うのだが……。\n@c2@"
