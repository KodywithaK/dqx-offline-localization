  fr: "@a@b*ⓢ Vous ne manquez pas de courage pour entrer dans cet endroit sous le nez de ces monstres.\n@c2@"
  it: "@a@b*: %H860%XHai%YAvete%Z certamente fegato ad %H860%Xintrufolarti%Yintrufolarvi%Z in questo posto passando proprio sotto il naso di queste belve.\n@c2@"
  ja: "@a@b＊「あんた　この城に忍びこんで\n\tよく食べられずに　出てこれたね！\n@c2@"
"10":
  de: "@a@b*: Oh, ich weiß! Ihr habt bestimmt den Mutationsstab, richtig?\n@c2@"
  en: "@a@b*: Oh, I get it! You must've been using that mod rod, were you?\n@c2@"
