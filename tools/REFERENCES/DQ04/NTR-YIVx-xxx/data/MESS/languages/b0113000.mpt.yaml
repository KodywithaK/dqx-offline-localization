  it: "@a@b*: Lord Psaro è molto impegnato. Viaggia in tutto il mondo per occuparrrsi di affari di grrroooande imporrrtanza.\n@c3@"
  ja: "@a@b＊「デスピサロさまは\n\t最近　とても忙しげに\n\t世界中を　飛び回っておられる。\n@c3@"
