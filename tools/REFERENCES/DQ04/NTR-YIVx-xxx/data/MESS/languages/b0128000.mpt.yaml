"0":
  de: "@a@b*: Hm, %H860%Xihr seid%Ydu bist%Z einen langen Weg gekommen.\nLeider war alles umsonst, es ist zu spät.\n@c2@"
  en: "@a@b*: Hmm, you have come a long way.\nBut it is all in vain, for you are too late.\n@c2@"
  es: "@a@b*: Vaya, %H860%Xhas%Yhabéis%Z recorrido un largo camino. Pero ha sido en vano, ya es demasiado tarde.\n@c2@"
  fr: "@a@b*ⓢ Mmm, vous avez fait un long voyage... mais en vain. Vous arrivez trop tard.\n@c2@"
  it: "@a@b*: Uhm, %H860%Xhai%Yavete%Z avete avuto la capacità di giungere fin qui... Ma è stato tutto inutile: ormai è tardi.\n@c2@"
  ja: "@a@b＊「ほほう……？\n\tとうとう　ここまで来よったか。\n\tしかし　今では遅すぎたようだな。\n@c2@"
"1":
  de: "@a@b*: Psaro hat das Geheimnis der Evolution bereits verwendet und wird bald in seiner ultimativen Form erwachen.\n@c2@"
  en: "@a@b*: Psaro has already used the Secret of Evolution, and will soon be awakening in his ultimate form.\n@c2@"
  es: "@a@b*: Psaro ya ha utilizado el Secreto de la Evolución y pronto se despertará en su forma definitiva.\n@c2@"
  fr: "@a@b*ⓢ Psaro a déjà utilisé le Secret de l'Évolution et il va bientôt se réveiller sous sa forme ultime.\n@c2@"
  it: "@a@b*: Psaro ha già utilizzato il Segreto dell'Evoluzione, e presto si risveglierà nella sua forma definitiva.\n@c2@"
  ja: "@a@b＊「デスピサロは　進化の秘法を使い\n\t究極の進化をとげ　やがて\n\t異形の者となり　目覚めるだろう。\n@c2@"
"2":
  de: "@a@b*: Und das Einzige, was diese neue Seele verspüren wird, ist Hass auf die Menschheit und den Wunsch, sie zu vernichten.\n@c2@"
  en: "@a@b*: All that will remain in his new soul will be a hatred for humans and a desire to destroy them.\n@c2@"
  es: "@a@b*: Lo único que quedará en su alma nueva será odio por los humanos y el deseo de destruirlos.\n@c2@"
  fr: "@a@b*ⓢ Sa nouvelle âme n'éprouvera plus que de la haine pour les humains et son seul but sera de les détruire.\n@c2@"
  it: "@a@b*: Le uniche cose che rimarranno del vecchio Psaro saranno il livore che prova verso gli esseri umani e il desiderio di distruggerli.\n@c2@"
  ja: "@a@b＊「変わり果てた　やつの心には\n\tもはや　人間に対する\n\t憎しみしか　残っておらぬはず。\n@c2@"
"3":
  de: "@a@b*: Der Psaro, den wir kannten, existiert dann nicht mehr und herrscht auch nicht länger über die Monsterbrut.\n@c2@"
  en: "@a@b*: Psaro as we knew him will cease to exist, and will no longer reign over monsterkind.\n@c2@"
  es: "@a@b*: Psaro tal como lo conocemos dejará de existir y ya no reinará sobre los monstruos.\n@c2@"
  fr: "@a@b*ⓢ Le Psaro que nous connaissions n'est plus et il ne régnera plus sur les monstres.\n@c2@"
  it: "@a@b*: Lo Psaro che conoscevamo prima è scomparso per sempre. Egli non regnerà mai più sui mostri.\n@c2@"
  ja: "@a@b＊「そして　デスピサロは　二度と\n\t魔族の王に　君臨することなく\n\tみずから　朽ち果てるのだ！！\n@c2@"
"4":
  de: "@a@b*: Und nun möchte ich %H860%Xdir%Yeuch%Z noch etwas verraten, ehe ich %H860%Xdich%Yeuch%Z ins Jenseits befördere.\n@c2@"
  en: "@a@b*: And now, I will read you your last rites before I send you to your sorry graves.\n@c2@"
  es: "@a@b*: Y ahora, %H860%Xreza tus%Yrezad vuestras%Z últimas oraciones antes de que %H860%Xte envíe a tu miserable tumba%Yos envíe a vuestras miserables tumbas%Z.\n@c2@"
  fr: "@a@b*ⓢ Maintenant, je vais vous donner le coup de grâce avant de vous expédier dans l'au-delà.\n@c2@"
  it: "@a@b*: Prima di porre fine %H860%Xalla tua misera esistenza mortale%Yalle vostre misere esistenze mortali%Z, %H860%Xti%Yvi%Z impartirò l'estrema unzione.\n@c2@"
  ja: "@a@b＊「めいどのみやげに\n\tお前たちにも　教えてやろう！\n@c2@"
"5":
  de: "@a@b*: Ich war es, der Rosi entführt hat. Ich habe euch schwache Menschen manipuliert, ich, der allmächtige Aamon!\n@c2@"
  en: "@a@b*: It is I who was behind the kidnapping of Rose.\nI manipulated you weak humans.\nI, the almighty Aamon!\n@c2@"
  es: "@a@b*: Era yo quien estaba detrás del secuestro de Rosa. Yo %H860%Xte%Yos%Z manipulé, deleznables seres humanos.\n¡Yo, el todopoderoso Aamon!\n@c2@"
  fr: "@a@b*ⓢ C'est moi qui ai organisé l'enlèvement de Rose.\nJe vous ai manipulés, pauvres humains.\nMoi, le tout-puissant Aamonⓠ\n@c2@"
  it: "@a@b*: Sono io il responsabile del rapimento di Rosa! Io, il potente Aamon, ho usato voi umani come semplici pedine!\n@c2@"
  ja: "@a@b＊「人間どもを利用し　ロザリーを\n\tさらわせたのは　この　わたし！\n\tこのエビルプリーストさまなのだ！\n@c2@"
"6":
  de: "@aAamon@bHa! Wie dumm von Euch, nicht aus Euren Fehlern zu lernen.\n@c3@"
  en: "@aAamon@bHah! How foolhardy of you not to have learnt from your earlier failure.\n@c3@"
  es: "@aAamon@b¡Ja! Fue una imprudencia por %H860%Xtu%Yvuestra%Z parte no haber aprendido de %H860%Xtu%Yvuestro%Z anterior fracaso.\n@c3@"
  fr: "@aAamon@bAhⓠ Quel dommage que vous n'ayez tiré aucune leçon de vos erreurs passées.\n@c3@"
  it: "@aAamon@bHah! Che ingenuità! Il %H860%Xtuo%Yvostro%Z precedente fallimento non %H860%Xti%Yvi%Z ha insegnato davvero nulla!\n@c3@"
  ja: "@a@b＊「ほほう……？\n\tこりもせずに　また来よったか。\n@c3@"
"7":
  de: "@aAamon@bIhr werdet bald merken, wie stark ich wirklich bin.\n@c3@"
  en: "@aAamon@bYou will soon realise that all power lies in my hands.\n@c3@"
  es: "@aAamon@bPronto %H860%Xte darás%Yos daréis%Z cuenta de que tengo en mis manos todo el poder.\n@c3@"
  fr: "@aAamon@bVous comprendrez bien vite que c'est moi qui ai le pouvoir.\n@c3@"
  it: "@aAamon@bTra poco %H860%Xcomprenderai%Ycomprenderete%Z quanto sia grande il mio potere!\n@c3@"
  ja: "@a@b＊「もはや　すべては\n\tわが手中にあることに　気づかぬとは\n\tおろかなり……。\n@c3@"
"8":
  de: "@aAamon@bVersucht es nur! Ihr Menschen seid doch alle Schwächlinge! Wer es wagt, mich herauszufordern, wird in die ewige Finsternis verbannt!\n@c3@"
  en: "@aAamon@bTry your hand, feeble human!\nAnyone who dares challenge me will soon be expelled to eternal darkness.\n@c3@"
  es: "@aAamon@b¡Vamos, %H860%Xprueba%Yprobad%Z suerte, %H860%Xendeble %A120%Xhumano%Z%B120%Xhumana%Z%Yendebles seres humanos%Z!\nTodo aquel que ose desafiarme será inmediatamente lanzado a las tinieblas eternas.\n@c3@"
  fr: "@aAamon@bVenez, faibles humainsⓠ\nCeux qui osent me défier seront rapidement envoyés dans les ténèbres éternelles.\n@c3@"
  it: "@aAamon@bProva pure, patetica creatura umana! Chiunque osi sfidarmi è condannato all'oscurità eterna.\n@c3@"
  ja: "@a@b＊「さあ　かかってくるといい！\n\tわたしに　歯向かう者は　すべて\n\t永遠の闇の底へと　沈めてくれるわ！\n@c3@"
"9":
  de: "@aAamon@bAahh! Ihr schrecklichen Menschen! Ich war nur einen Schritt davon entfernt, Meister der Monster zu werden.\n@c3@"
  en: "@aAamon@bAargh! You meddlesome humans! I was one step away from becoming the Master of Monsterkind.\n@c3@"
  es: "@aAamon@b¡Aargh! ¡Humanos entrometidos! ¡Estaba a un solo paso de convertirme en Señor de los monstruos!\n@c3@"
  fr: "@aAamon@bAaarghⓠ Sales humainsⓠ\nJ'allais bientôt devenir le Maître des monstres.\n@c3@"
  it: "@aAamon@bAargh!\nChe siano maledetti tutti gli umani! Ero a un passo dal diventare il Signore della Mostruosità!\n@c3@"
  ja: "@a@b＊「ば…ばかな……。\n\tあと一歩で…　わたしが魔族の王と\n\tなれたというのに……。\n@c3@"
"10":
  de: "@aAamon@bDas werde ich Euch nie verzeihen.\nDafür werdet ihr büßen... Ahhhh.\n@c3@"
  en: "@aAamon@bI will never forgive you.\nI will make you pay...uuurgh.\n@c3@"
  es: "@aAamon@bNunca %H860%Xte%Yos%Z perdonaré.\nMe las %H860%Xpagarás%Ypagaréis%Z... Aaaaag.\n@c3@"
  fr: "@aAamon@bJe ne vous le pardonnerai jamais.\nVous me le paierez... uuurgh.\n@c3@"
  it: "@aAamon@bNon %H860%Xti%Yvi%Z perdonerò mai!\nMe la %H860%Xpagherai%Ypagherete%Z... Uuurgh!\n@c3@"
  ja: "@a@b＊「許さん……。\n\tお前たちだけは　絶対に……。\n\t……ぐふっ！\n@c3@"
"11":
  de: "@a@bEine der Barrieren löst sich auf...\n@c0@"
  en: "@a@bOne of the barriers disappears...\n@c0@"
  es: "@a@bUna de las barreras desaparece...\n@c0@"
  fr: "@a@bL'une des barrières disparaît...\n@c0@"
  it: "@a@bLa barriera scompare!\n@c0@"
