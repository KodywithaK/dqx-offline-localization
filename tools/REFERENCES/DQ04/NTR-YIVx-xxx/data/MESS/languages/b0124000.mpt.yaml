  fr: "@a@b*ⓢ Si elle devait revoir %a00090 aujourd'hui, quelle force serait assez puissante pour l'empêcher de verser des larmes...ⓡ (snif, snif)\n@c1@"
  it: "@a@b*: Se oggi le dovesse capitare di incontrare %A090%Xil suo%Z%B090%Xla sua%Z %a00090, di certo non riuscirebbe a trattenere le lacrime... Sob... Sob...\n@c1@"
  ja: "@a@b＊「もし　今の%a00090を見れば\n\tきっと　涙にくれるでしょう。\n\tうっうっ……。\n@c1@"
