  fr: "@a@b*ⓢ Le Secret de l'Évolution est le mal suprême.\n@c2@"
  it: "@a@b*: ⓕIl Segreto dell'Evoluzione è il peggiore tra tutti i mali che siano mai esistiti.ⓖ\n@c2@"
  ja: "@a@b＊「進化の秘法を　のちの世に\n\t伝えてはならぬ。\n\t地底ふかくに　封じこめよ……。\n@c2@"
"56":
  de: "@a@b*: Solch eine gefährliche Macht darf unseren Kindern und Kindeskindern nicht zugänglich sein. Sie gehört weggesperrt...ⓟ\n@c2@"
  en: "@a@b*: ⓗSuch potency cannot be inherited by our children and children's children. It must be sealed away...ⓘ\n@c2@"
  es: "@a@b*: Tal poder no debe ser heredado por nuestros hijos ni los hijos de nuestros hijos.\nDebe permanecer sellado...\n@c2@"
  fr: "@a@b*ⓢ Une telle puissance ne doit pas être laissée en héritage à nos enfants et aux enfants de nos enfants.\n㈡\n*ⓢ Il faut la faire disparaître...ⓦ\n@c2@"
  it: "@a@b*: ⓕUno strumento del genere non può essere tramandato ai propri figli, e ai figli dei propri figli, ma dev'essere tenuto nascosto.ⓖ\n@c2@"
  ja: "@a@b＊「……と　書かれています。\n@c2@"
"57":
