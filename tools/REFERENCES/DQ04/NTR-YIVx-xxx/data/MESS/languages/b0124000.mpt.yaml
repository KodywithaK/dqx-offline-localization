  de: "@a@b*: ⓞGeschichte des Kriegesⓟ. Ähem...\n@c1@"
  en: "@a@b*: ⓗA History of Warⓘ.\nAhem...\n@c1@"
  es: "@a@b*: ''Una historia de guerra''.\nEjem...\n@c1@"
  fr: "@a@b*ⓢ ⓥUne Histoire de la Guerreⓦ.\nHum...\n@c1@"
  it: "@a@b*: ⓕUna storia di guerraⓖ.\nEhm...\n@c1@"
  ja: "@a@b＊「戦いの歴史……。\n\tコホン……。\n@c1@"
"62":
  de: "@a@b*: ⓞVor vielen Monden förderte Estark, der Meister der Monster, etwas unglaublich Böses zu Tage: das Geheimnis der Evolution.\n@c1@"
  en: "@a@b*: ⓗMany moons ago, Estark, the Master of Monsterkind, unearthed a terrible evil: the Secret of Evolution.\n@c1@"
  es: "@a@b*: ''Hace muchas lunas, Estark, el Señor de los Monstruos, desenterró un terrible mal: el Secreto de la Evolución.''\n@c1@"
  fr: "@a@b*ⓢ ⓥIl y a de nombreuses lunes, Estark, le Maître des monstres, fit une découverte terribleⓢ le Secret de l'Évolution.\n@c1@"
  it: "@a@b*: ⓕMolte lune fa, Estark, il Signore della Mostruosità, scoprì un terribile male: il Segreto dell'Evoluzione.ⓖ\n@c1@"
  ja: "@a@b＊「はるか昔　魔族の王エスタークは\n\t恐ろしいものを　造りだした。\n\tそれは　進化の秘法。\n@c1@"
"63":
  de: "@a@b*: Mithilfe dieser teuflischen Macht verwandelte sich Estark in eine derart mächtige Kreatur, dass er selbst die Götter herausforderte.\n@c1@"
  en: "@a@b*: ⓗUsing this awesome power, Estark evolved into a creature so mighty that he would rival even the gods.\n@c1@"
  es: "@a@b*: ''Con este asombroso poder, Estark se convirtió en una criatura poderosísima, capaz de combatir a los propios dioses.''\n@c1@"
  fr: "@a@b*ⓢ Utilisant cette arme incroyable, Estark devint si puissant qu'il pouvait même rivaliser avec les dieux.\n@c1@"
  it: "@a@b*: ⓕServendosi di questo potere incredibile, Estark divenne una creatura talmente forte da riuscire a competere persino con le divinità.ⓖ\n@c1@"
  ja: "@a@b＊「エスタークは　そのチカラで\n\t自らを　神をも越える\n\t究極の生物に進化させた。\n@c1@"
"64":
  de: "@a@b*: Doch die Zenithianer waren sich Estarks Plänen bewusst und bekämpften ihn gemeinsam mit dem Zenithdrachen.\n@c1@"
  en: "@a@b*: ⓗBut the Zenithians were aware of Estark's designs and, alongside the Zenith Dragon, engaged him in battle.\n@c1@"
  es: "@a@b*: ''Pero los habitantes de Zenithia conocían los designios de Estark y, junto con el Dragón de Zenithia, se enfrentaron a él.''\n@c1@"
  fr: "@a@b*ⓢ Mais les Zénithiens avaient eu vent des plans d'Estark et l'affrontèrent aux côtés du Dragon du Zénith.\n@c1@"
  it: "@a@b*: ⓕMa gli abitanti di Zenithia erano a conoscenza dei piani di Estark, e decisero di allearsi con il Drago di Zenithia per combatterlo.ⓖ\n@c1@"
  ja: "@a@b＊「しかし　事態を知った天空人は\n\tマスタードラゴンとともに\n\tエスタークと戦った。\n@c1@"
"65":
  de: "@a@b*: Nach einem langen und blutigen Krieg wurde Estark schließlich weggesperrt, tief unter der Erde.\n@c1@"
  en: "@a@b*: ⓗAfter a long and bloody war, Estark was finally sealed away deep underground.\n@c1@"
  es: "@a@b*: ''Tras una larga y sangrienta guerra, Estark fue finalmente encerrado en las profundidades de la tierra.''\n@c1@"
  fr: "@a@b*ⓢ Après une guerre longue et sanglante, Estark fut finalement emprisonné au plus profond de la terre.\n@c1@"
  it: "@a@b*: ⓕDopo una guerra lunga e sanguinosa, Estark fu imprigionato nelle profondità della terra.ⓖ\n@c1@"
  ja: "@a@b＊「長い戦いの後\n\tついに　エスタークは\n\t地の底に　封じ込められた。\n@c1@"
"66":
  de: "@a@b*: Denn selbst der mächtige Zenithdrache war nicht stark genug, um Estark ganz zu vernichten.\n@c1@"
  en: "@a@b*: ⓗFor even the mighty Zenith Dragon was not powerful enough to completely destroy Estark.\n@c1@"
  es: "@a@b*: ''Porque ni siquiera el legendario Dragón de Zenithia era lo suficientemente poderoso como para acabar completamente con Estark.''\n@c1@"
  fr: "@a@b*ⓢ Car même la force du puissant Dragon du Zénith n'était pas suffisante pour éliminer définitivement Estark. \n@c1@"
  it: "@a@b*: ⓕTuttavia, nemmeno la potenza del grande Drago di Zenithia fu sufficiente per distruggere completamente Estark.ⓖ\n@c1@"
  ja: "@a@b＊「マスタードラゴンでさえも\n\tエスタークを　封じ込めるだけで\n\t消滅させることまでは　できなかった。\n@c1@"
"67":
  de: "@a@b*: Möge er niemals geweckt, möge er niemals wachgerüttelt werden.\n@c1@"
  en: "@a@b*: ⓗHe must never be stirred.\nHe must never be roused.\n@c1@"
  es: "@a@b*: ''Jamás deberá ser despertado.\nJamás deberá ser invocado.''\n@c1@"
  fr: "@a@b*ⓢ Il ne doit jamais être réveillé.\n@c1@"
  it: "@a@b*: ⓕNon dovrà mai essere destato. Non dovrà mai essere disturbato.ⓖ\n@c1@"
  ja: "@a@b＊「エスタークを　起こしてはならぬ。\n\t彼に　近づいてはならぬ。\n@c1@"
"68":
  de: "@a@b*: Solch eine gefährliche Macht darf unseren Kindern und Kindeskindern nicht zugänglich sein. Sie gehört weggesperrt...ⓟ\n@c1@"
  en: "@a@b*: ⓗSuch potency cannot be inherited by our children and children's children. It must be sealed away...ⓘ\n@c1@"
  es: "@a@b*: ''Tal poder no debe ser heredado por nuestros hijos ni los hijos de nuestros hijos.\nDebe permanecer sellado...''\n@c1@"
  fr: "@a@b*ⓢ Une telle puissance ne doit pas être laissée en héritage à nos enfants et aux enfants de nos enfants.\n㈡\n*ⓢ Il faut la faire disparaître...ⓦ\n@c1@"
  it: "@a@b*: ⓕUno strumento del genere non può essere tramandato ai propri figli, e ai figli dei propri figli, ma dev'essere tenuto nascosto.ⓖ\n@c1@"
  ja: "@a@b＊「……と　書かれています。\n@c1@"
"69":
  de: "@a@b*: Erst viel später erfuhr man die ganze Wahrheit. Das von Estark genutzte Geheimnis der Evolution war unvollständig.\n@c1@"
  en: "@a@b*: It was only in hindsight that the truth was known. The Secret of Evolution used by Estark was incomplete.\n@c1@"
  es: "@a@b*: Solo después se conocería la verdad. El Secreto de la Evolución utilizado por Estark estaba incompleto.\n@c1@"
  fr: "@a@b*ⓢ Ce n'est qu'après coup que la vérité fut connue. Le Secret de l'Évolution tel qu'Estark l'avait utilisé n'était pas complet.\n@c1@"
  it: "@a@b*: Solo successivamente la verità venne alla luce. Il Segreto dell'Evoluzione usato da Estark non era completo...\n@c1@"
  ja: "@a@b＊「しかし　あとで分かったのですが\n\tエスタークの進化の秘法は\n\tまだ　不完全だったとか。\n@c1@"
"70":
  de: "@a@b*: Das Wandlungsarmband, das die dunklen Mächte zusätzlich verstärkt, wurde nie von Estark eingesetzt.\n@c1@"
  en: "@a@b*: The armlet of transmutation, needed to augment the dark powers necessary for the process, was never employed by Estark.\n@c1@"
  es: "@a@b*: Estark nunca empleó el brazalete de transmutación, imprescindible para aumentar los poderes de la oscuridad necesarios para el proceso.\n@c1@"
  fr: "@a@b*ⓢ Ce dernier n'avait pas utilisé le brassard étincelant, censé augmenter les pouvoirs maléfiques nécessaires au procédé.\n@c1@"
  it: "@a@b*: Estark non aveva utilizzato la Fascia crisalidea, necessaria per ampificare le forze oscure richieste per il processo.\n@c1@"
  ja: "@a@b＊「闇のチカラを増幅させる\n\t黄金の腕輪が　あのときは　まだ\n\t使われていなかったのです。\n@c1@"
"71":
  de: "@a@b*: Wie Ihr wünscht. Vielleicht ein anderes Mal...\n@c1@"
  en: "@a@b*: Very well. Perhaps at another time...\n@c1@"
  es: "@a@b*: Muy bien. Quizás en otro momento...\n@c1@"
  fr: "@a@b*ⓢ Bien. Peut-être une autre fois, alors...\n@c1@"
  it: "@a@b*: Non c'è problema. Sarà per un'altra volta...\n@c1@"
  ja: "@a@b＊「そうですか。　では　いずれまた……。\n@c1@"
"72":
  de: "@a@b*: Manche der Bücher auf den Regalen sind Euch nicht erlaubt.\n@c2@"
  en: "@a@b*: There are books on these shelves that you cannot read.\n@c2@"
  es: "@a@b*: Hay libros en estos estantes que no %H860%Xpuede%Ypueden%Z leer.\n@c2@"
  fr: "@a@b*ⓢ Il y a, sur ces étagères, des livres que vous ne pouvez pas feuilleter.\n@c2@"
  it: "@a@b*: Su questi scaffali ci sono dei volumi la cui lettura è vietata.\n@c2@"
  ja: "@a@b＊「ここにある本の中には　そなたらに\n\t読めぬものもあるだろう。\n@c2@"
"73":
  de: "@a@b*: Doch Ihr könnt einen der beiden dort bitten, Euch vorzulesen.\n@c2@"
  en: "@a@b*: You can ask one of those two to read them to you, though.\n@c2@"
  es: "@a@b*: No obstante, %H860%Xpuede%Ypueden%Z solicitar que %H860%Xle%Yles%Z sean leídos estos dos.\n@c2@"
  fr: "@a@b*ⓢ Vous pouvez toutefois demander à l'un de ces deux-là de les lire.\n@c2@"
  it: "@a@b*: È possibile, tuttavia, chiedere che qualcuno li legga.\n@c2@"
  ja: "@a@b＊「そこにいる　ふたりに\n\t読んでもらうといい。\n@c2@"
"74":
  de: "@a@b*: Ihr steht unserem Herrn und Meister, dem Zenithdrachen, gegenüber!\n@c2@"
  en: "@a@b*: You are in the presence of the Zenith Dragon, our lord and master!\n@c2@"
  es: "@a@b*: %H860%XSe encuentra%YSe encuentran%Z en presencia del Dragón de Zenithia, ¡nuestro señor y maestro!\n@c2@"
  fr: "@a@b*ⓢ Vous êtes devant le Dragon du Zénith, notre seigneur et maître.\n@c2@"
  it: "@a@b*: %H860%XTi trovi%YVi trovate%Z al cospetto del Drago di Zenithia, nostro signore e padrone!\n@c2@"
  ja: "@a@b＊「ここに　おわすのは　我らが王\n\tマスタードラゴンであられる！\n@c2@"
"75":
  de: "@a@b*: %0%a00090!? %A090%XDer, in dem%Z%B090%XDie, in der%Z sowohl menschliches als auch zenithianisches Blut fließt!\n@c2@"
  en: "@a@b*: %0%a00090!? %A090%XHe%Z%B090%XShe%Z who shares the blood of human and Zenithian alike!\n@c2@"
  es: "@a@b*: ¡¿%0%a00090!? ¡%A090%XÉl%Z%B090%XElla%Z por cuyas venas corre por igual sangre humana y de Zenithia!\n@c2@"
  fr: "@a@b*ⓢ %0%a00090ⓠⓑ\n%A090%XLe héros qui porte en lui%Z%B090%XL'héroïne qui porte en elle%Z du sang zénithien et du sang humainⓠ\n@c2@"
  it: "@a@b*: %0%a00090?! %A090%XColui%Z%B090%XColei%Z che ha nelle vene sangue umano e Zenithiano!?\n@c2@"
  ja: "@a@b＊「ほほう　%a00090が\n\tわれら天空人と　人間たちの\n\t血を引く　勇者であられるか！？\n@c2@"
"76":
  de: "@a@b*: Euer Wohlergehen hat dem Zenithdrachen stets am Herzen gelegen.\n@c2@"
  en: "@a@b*: Your well-being has always weighed heavy on the Zenith Dragon's mind.\n@c2@"
  es: "@a@b*: Vuestro bienestar siempre ha ocupado mucho tiempo en los pensamientos del Dragón de Zenithia.\n@c2@"
  fr: "@a@b*ⓢ Le Dragon du Zénith a toujours été très soucieux de votre bien-être.\n@c2@"
  it: "@a@b*: Il Drago di Zenithia ha sempre vegliato su di te.\n@c2@"
  ja: "@a@b＊「わが　マスタードラゴンは\n\tいつも　%a00090のことを\n\t気にかけて　おられたようだ。\n@c2@"
"77":
  de: "@a@b*: Ich bin der Zenithdrache. Einige nennen mich auch den Drachengott.\n@c3@"
  en: "@a@b*: I am the Zenith Dragon.\nSome even call me the Dragon God.\n@c3@"
  es: "@a@b*: Yo soy el Dragón de Zenithia.\nAlgunos me llaman Dios Dragón.\n@c3@"
  fr: "@a@b*ⓢ Je suis le Dragon du Zénith.\nCertains m'appellent même le Dieu-dragon.\n@c3@"
  it: "@a@b*: Io sono il Drago di Zenithia. Alcuni mi chiamano il Drago Divino.\n@c3@"
  ja: "@a@b＊「私は　この城をおさめる\n\tマスタードラゴン。\n\t竜の神と　呼ばれている者だ。\n@c3@"
"78":
  de: "@aZenithdrache@bVon diesen luftigen Höhen aus nehme ich mich den Sorgen der Welt an.\n@c3@"
  en: "@aZenith Dragon@bFrom these lofty heights, I tend to all the world's needs.\n@c3@"
  es: "@aDragón de Zenithia@bDesde estas majestuosas alturas, atiendo a todas las necesidades del mundo.\n@c3@"
  fr: "@aDragon du Zénith@bC'est depuis ces hauteurs que je veille sur le monde d'en bas.\n@c3@"
  it: "@aDrago di Zenithia@bDa quassù, io mi occupo delle necessità del mondo.\n@c3@"
  ja: "@a@bマスタードラゴン「私は　ここにいて\n\t世界のすべてを　知ることができる。\n@c3@"
"79":
  de: "@aZenithdrache@bIch weiß nur zu gut, warum Ihr hier seid.\n@c3@"
  en: "@aZenith Dragon@bI know only too well why you are here.\n@c3@"
  es: "@aDragón de Zenithia@bSé demasiado bien por qué %H860%Xestás%Yestáis%Z aquí.\n@c3@"
  fr: "@aDragon du Zénith@bJe ne connais que trop bien la raison de votre présence.\n@c3@"
  it: "@aDrago di Zenithia@bSo bene perché %H860%Xsei%Ysiete%Z qui.\n@c3@"
  ja: "@a@bマスタードラゴン「お前たちが\n\tなぜ　私に会いに来たかも\n\tすでに　わかっている。\n@c3@"
"80":
  de: "@aZenithdrache@bDoch es ist bereits zu spät... Ich kann die Evolution des einen, den sie Psaro den Metzler nennen, nicht mehr aufhalten.\n@c3@"
  en: "@aZenith Dragon@bBut it is already too late for me to prevent the evolution of this one they call Psaro the Manslayer.\n@c3@"
  es: "@aDragón de Zenithia@bPero es ya demasiado tarde para que pueda impedir la evolución de aquel al que llaman Psaro el Carnicero.\n@c3@"
  fr: "@aDragon du Zénith@bMais il est déjà trop tard pour que j'arrête l'évolution de celui qu'ils appellent Psaro l'Exterminateur.\n@c3@"
  it: "@aDrago di Zenithia@bMa, giunti a questo punto, mi è impossibile impedire l'evoluzione di colui che chiamano Psaro il Massacratore.\n@c3@"
  ja: "@a@bマスタードラゴン「しかし　もはや\n\t私にもデスピサロという者の\n\t進化を　封じることはできぬ……。\n@c3@"
"81":
  de: "@aZenithdrache@bDenn ich bin nicht so allmächtig, wie Ihr es vielleicht glaubt.\n@c3@"
  en: "@aZenith Dragon@bI am perhaps not the almighty force you believed me to be.\n@c3@"
  es: "@aDragón de Zenithia@bQuizás no sea la fuerza todopoderosa que %H860%Xcrees%Ycreéis%Z que soy.\n@c3@"
  fr: "@aDragon du Zénith@bJe ne suis peut-être pas aussi omnipotent que vous le pensiez.\n@c3@"
  it: "@aDrago di Zenithia@bProbabilmente io non ho il potere di cui necessiti.\n@c3@"
  ja: "@a@bマスタードラゴン「お前たちが\n\t思っているほど　この私とて\n\t絶対の者ではないのだ。\n@c3@"
"82":
  de: "@aZenithdrache@b......!\n@c3@"
  en: "@aZenith Dragon@b...!\n@c3@"
  es: "@aDragón de Zenithia@b¡...!\n@c3@"
  fr: "@aDragon du Zénith@b...ⓠ\n@c3@"
  it: "@aDrago di Zenithia@b...!\n@c3@"
  ja: "@a@bマスタードラゴン「……！\n@c3@"
"83":
  de: "@a@b*: Ich überbringe eine eilige Botschaft, oh Herr. Dem Tor nach Nadiria entspringt eine Welle der Bosheit!\n@c2@"
  en: "@a@b*: There is urgent news, O Great One.\nA wave of malice doth emanate from the Doorway to Nadiria!\n@c2@"
  es: "@a@b*: Traigo noticias urgentes, ¡Oh, Magnífico!\n¡Una onda de maldad emana de la Puerta de Nadiria!\n@c2@"
  fr: "@a@b*ⓢ J'apporte des nouvelles urgentes, Divin Dragon.\nUne onde maléfique se répand depuis le Passage de Nadiriaⓠ\n@c2@"
  it: "@a@b*: Ci giungono delle notizie inquietanti, divinità suprema. Dal Varco per Nadiria si sta sprigionando un'onda malefica.\n@c2@"
  ja: "@a@b＊「ご報告します！\n\tたった今　闇の世界の入り口から\n\t邪悪な波動が発せられ……！\n@c2@"
"84":
  de: "@aZenithdrache@bIch weiß. Danke schön. Ihr könnt Euch zurückziehen.\n@c2@"
  en: "@aZenith Dragon@bI know. Thank you.\nYou may retire.\n@c2@"
  es: "@aDragón de Zenithia@bLo sé. Gracias.\nPuedes retirarte.\n@c2@"
  fr: "@aDragon du Zénith@bJe sais. Merci.\nVous pouvez vous retirer.\n@c2@"
  it: "@aDrago di Zenithia@bLo so, ti ringrazio.\nPuoi andare.\n@c2@"
  ja: "@a@bマスタードラゴン「言わずともよい。\n\t報告ご苦労　さがってよいぞ。\n\t……おのれ　デスピサロめ。\n@c2@"
"85":
  de: "@aZenithdrache@bDieser Psaro ist wohl der Ansicht, er könne Zenithia vom Himmel aus stürzen...\n@c2@"
  en: "@aZenith Dragon@bPerhaps this Psaro believes he can topple Zenithia from the sky...\n@c2@"
  es: "@aDragón de Zenithia@bQuizás este Psaro piense que puede hacer caer a Zenithia del cielo...\n@c2@"
  fr: "@aDragon du Zénith@bCe Psaro s'imagine sûrement qu'il peut faire tomber Zénithia du ciel...\n@c2@"
  it: "@aDrago di Zenithia@bProbabilmente Psaro crede di poter far crollare Zenithia dal cielo...\n@c2@"
  ja: "@a@bマスタードラゴン「この程度のことで\n\t天空城を　打ち落とせるとでも\n\t思ったのか　それとも……。\n@c2@"
"86":
  de: "@aZenithdrache@bVielleicht hat aber auch der Aufstieg %A090%Xdes großen Helden%Z%B090%Xder großen Heldin%Z, %a00090, nach Zenithia zu dieser Reaktion geführt.\n@c2@"
  en: "@aZenith Dragon@bOr perhaps the ascension to Zenithia of the great %A090%Xhero%Z%B090%Xheroine%Z, %a00090, has provoked this happening.\n@c2@"
  es: "@aDragón de Zenithia@bO quizás el ascenso a Zenithia %A090%Xdel legendario héroe%Z%B090%Xde la legendaria heroína%Z, %a00090, haya hecho que esto ocurra.\n@c2@"
  fr: "@aDragon du Zénith@bOu peut-être est-ce là la conséquence de l'ascension %A090%Xdu grand héros%Z%B090%Xde la grande héroïne%Z %a00090 à Zénithiaⓡ\n@c2@"
  it: "@aDrago di Zenithia@bOppure è possibile che sia stata la venuta a Zenithia %A090%Xdel grande eroe%Z%B090%Xdella grande eroina%Z, %a00090, a scatenare quest'evento.\n@c2@"
  ja: "@a@bマスタードラゴン「%a00090が\n\t天空城に入ったことを知り\n\t挑発してきたのか。\n@c2@"
"87":
  de: "@aZenithdrache@bWie dem auch sei. Mir liegt es fern, die Motive der Menschen zu hinterfragen.\n@c2@"
  en: "@aZenith Dragon@bNo matter. I do not try to understand the motives of humans.\n@c2@"
  es: "@aDragón de Zenithia@bNo importa. No pretendo comprender las razones que mueven a los humanos.\n@c2@"
  fr: "@aDragon du Zénith@bPeu importe. Je n'essaie pas de comprendre les motivations des humains.\n@c2@"
  it: "@aDrago di Zenithia@bNon importa. Non mi interessa comprendere le motivazioni degli umani.\n@c2@"
  ja: "@a@bマスタードラゴン「まあ　よい。\n\tところで　人間というのは　じつに\n\t不思議な生き物だな。\n@c2@"
"88":
  de: "@aZenithdrache@bFür eine solch schwache Rasse sind die Menschen manchmal erstaunlich willensstark.\n@c2@"
  en: "@aZenith Dragon@bFor a weak race, humans exhibit extraordinary strength at times.\n@c2@"
  es: "@aDragón de Zenithia@bPara ser una raza tan débil, los humanos muestran en ocasiones una fortaleza extraordinaria.\n@c2@"
  fr: "@aDragon du Zénith@bPour une race faible, les humains font parfois preuve d'une force extraordinaire.\n@c2@"
  it: "@aDrago di Zenithia@bNonostante si tratti di una razza debole, a volte gli uomini sono capaci di esprimere una forza incredibile.\n@c2@"
  ja: "@a@bマスタードラゴン「かよわき人間が\n\t時として　思わぬチカラを\n\t発揮するときがある。\n@c2@"
"89":
  de: "@aZenithdrache@bUnd auf diese Stärke muss ich nun vertrauen...\n@c2@"
  en: "@aZenith Dragon@bIt is on this that I must depend now...\n@c2@"
  es: "@aDragón de Zenithia@bDe ella dependemos ahora...\n@c2@"
  fr: "@aDragon du Zénith@bC'est pour cette raison que je dépends de vous, désormais...\n@c2@"
  it: "@aDrago di Zenithia@bE adesso è proprio sulla loro forza che devo fare affidamento...\n@c2@"
  ja: "@a@bマスタードラゴン「私は　それに\n\tかけてみよう！\n@c2@"
"90":
  de: "@a@bWie durch Zauberhand wird %a00090 wieder zum Leben erweckt!\n@c2@"
