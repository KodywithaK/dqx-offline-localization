"65":
  de: "@aAlberich von Übermuth@bIch bin gerade ein wenig beschäftigt, falls Ihr es noch nicht mitbekommen habt.\n㈡\nWir können morgen im Lauf des Tages miteinander reden, wenn Ihr wollt. In der Garderobe.\n@c2@"
  en: "@aTom Foolery@bI'm a wee bit busy at the moment, in case ye hadn't noticed. We can talk tomorrow durin' the day if ye like. In the dressin' room.\n@c2@"
  es: "@aBen-Irrie@bPor si no lo %H860%Xhabías%Yhabíais%Z notado, ahora mismo estoy bastiante ocupado. Si %H860%Xti%Yos%Z pariece, podemos hablar mañana durante el día. En el camierino.\n@c2@"
  fr: "@aTom Foolery@bJe suis un peu occupé, au cas où vous l'auriez pas remarqué. On peut voir ça demain en journée, si vous voulez. Retrouvez-moi dans ma loge.\n@c2@"
