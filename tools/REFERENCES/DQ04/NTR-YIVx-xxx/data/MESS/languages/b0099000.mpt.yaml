"86":
  de: "@a@b*: Et voilà! Wie fühlt Ihr Eusch?\n@c1@"
  en: "@a@b*: Et voilà! 'Ow do you feel?\n@c1@"
  es: "@a@b*: ¡Y voilà! ¿Cómo te encuentgras ahogra?\n@c1@"
  fr: "@a@b*ⓢ Et voilàⓠ \n@c1@"
  it: "@a@b*: Et voilà! Abbiamo finito!\n@c1@"
