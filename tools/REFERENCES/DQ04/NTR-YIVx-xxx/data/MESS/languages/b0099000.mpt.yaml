  es: "@a@b*: Eh, eres Maya, ¿verdad? Me dijeron que lo habías dejado pero has vuelto, ¿no? ¡Yujuuuuu! ¡Eso es estupendo!\n@c3@"
  fr: "@a@b*ⓢ Hé, vous êtes Maya, c'est çaⓡ\nOn m'avait dit que vous aviez arrêté.\nVous êtes revenue alorsⓡ Mais c'est génialⓠ\n@c3@"
