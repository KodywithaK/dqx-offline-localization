  it: "@a@b*: Oh, là là! Un gruppo?\nNon sono mica una ragazza di ⓕquelⓖ tipo, io. %A120%XMonsieur%Z%B120%XMademoiselle%Z, devi venire %A120%Xda solo%Z%B120%Xda sola%Z.\n@c1@"
