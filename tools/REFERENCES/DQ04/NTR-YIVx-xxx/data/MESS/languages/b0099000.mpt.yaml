  ja: "@a@b＊「この席には　大金を払ってるんです！\n\t金をかけたぶん　楽しまなきゃね。\n@c2@"
"54":
  de: "@a@b*: Ha ha... Den habe ich fast ganz verstanden! Es heißt ja, wer lacht, lebt länger. Na, dann schau'n wir mal!\n@c2@"
  en: "@a@b*: Ha...ha... I almost got that one!\nThey say laughter's the key to longevity...\nWe'll see!\n@c2@"
  es: "@a@b*: Ja..., ja... ¡Ese casi lo he pillado!\nDicen que la risa es la llave de la longevidad...\n¡Bueno, ya veremos!\n@c2@"
  fr: "@a@b*ⓢ Ha... Ha... J'ai failli la comprendre celle-làⓠ\nIl paraît que rire vaut un steak...\nOn va voir si j'ai faim en sortantⓠ\n@c2@"
  it: "@a@b*: Ah! Ah! Ah! Questa l'ho capita! Almeno credo... Beh, l'importante è ridere. Dicono che il riso allunghi la vita.\n@c2@"
  ja: "@a@b＊「ふあっ　ふあっ　ふあっ。\n\tこうして　毎晩　笑うのが\n\t長生きの秘訣じゃて！\n@c2@"
"55":
  de: "@a@b*: Hah hah hah!\nBei der Göttin, dieser Alberich von Übermuth ist zum Brüllen!\n@c2@"
