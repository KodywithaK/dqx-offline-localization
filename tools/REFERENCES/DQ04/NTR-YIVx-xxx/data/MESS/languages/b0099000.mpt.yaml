  fr: "@a@b*ⓢ Ce ⓚ hicⓠ ⓚ Seigneur des Enf... euh... hicⓠ Seigneur des Enflés...ⓡ Naaan...\n㈡\n*ⓢ Seigneur des Enfersⓠ C'est çaⓠ\nBen, il a pas ressuscitéⓠ Non, non, nonⓠ\n@c3@"
