"0":
  de: "@a@b*: Laissez Fayre ist die Stadt der Unterhaltung!\nDie Stadt nördlich von hier wurde in Boutdumonde umbenannt.\n@c2@"
  en: "@a@b*: This is the city of song and dance, Laissez Fayre! The town north of here's been renamed Aubout du Monde.\n@c2@"
  es: "@a@b*: ¡Esta es la ciudad del baile y la canción, Laissez Fayre! La ciudad del norte ha cambiado de nombre y ahora se llama Aubout du Monde.\n@c2@"
  fr: "@a@b*ⓢ Nous sommes à Teafortwo, la capitale du divertissementⓠ La ville au nord d'ici a été rebaptisée Deadend.\n@c2@"
  it: "@a@b*: Questa è Laissez Fayre, la città della danza e del canto! Il villaggio a nord, invece, si chiama Infond Almond.\n@c2@"
  ja: "@a@b＊「ここは　歌と踊りの町モンバーバラ。\n\t北に行けば　コーミズ村があります。\n@c2@"
"1":
  de: "@a@b*: Pardon, %A120%XMonsieur%Z%B120%XMademoiselle%Z. Die Schänke wird erste 'eute Abend geöffnet.\n@c1@"
  en: "@a@b*: Pardon, %A120%Xmonsieur%Z%B120%Xmademoiselle%Z. Ze pub will not be opening until zis evening.\n@c1@"
  es: "@a@b*: Pardon, %H860%X%A120%Xmonsieur%Z%B120%Xmademoiselle%Z%Y%R000%Xmademoiselles%Ymonsieurs%Z%Z. La tabegrna no abgrigrá hasta pogr la noche.\n@c1@"
  fr: "@a@b*ⓢ Je demande votre pardon, %A120%XMonsieur%Z%B120%XMademoiselle%Z. Le pub n'ouvre que ce soir.\n@c1@"
  it: "@a@b*: Mi scusi, %A120%Xmonsieur%Z%B120%Xmademoiselle%Z. Il locale non aprirà prima di stasera.\n@c1@"
  ja: "@a@b＊「酒場は　夜からよ。\n\tごめんね。\n@c1@"
"2":
  de: "@a@b*: Ihr seid über das Meer gekommen?\nDann habt Ihr die Felseninsel gese'en, auf der die Unge'euer leben, non?\n@c2@"
  en: "@a@b*: You came 'ere over ze ocean?\nZen you will 'ave seen ze rocky island where ze monsters live, non?\n@c2@"
  es: "@a@b*: ¿%H860%XHas%YHabéis%Z venido hasta aquí pogr magr?\nEntonces %H860%Xhabgrás%Yhabgréis%Z visto la isla grocosa en donde viven los monstgruos, ¿no?\n@c2@"
  fr: "@a@b*ⓢ Vous avez arrivé par l'océanⓡ\nAlors vous avez vu l'île rocheuse où les monsters habitent, noⓡ\n@c2@"
  it: "@a@b*: %H860%XHai%YAvete%Z attraversato l'oceano per arrivare ici? Alors %H860%Xavrai%Yavrete%Z certamente visto l'isola rocciosa dove vivono i mostri, non?\n@c2@"
  ja: "@a@b＊「ほほう　海を渡って　この町に？\n\tでは　魔物たちが住むという\n\t岩山の島を　見てきたのか？\n@c2@"
"3":
  de: "@a@b*: Von dort ist noch niemand lebend zurückgekommen. Am besten 'ält man sisch davon möglischst fern.\n@c2@"
  en: "@a@b*: No one 'as ever come back alive from zat place. It is best to observe it from afar.\n@c2@"
  es: "@a@b*: Nadie ha gregresado nunca con vida de ese lugagr. Lo mejogr es obsegrvagrlo desde lejos.\n@c2@"
  fr: "@a@b*ⓢ Personne n'est jamais revenu de cette place.\nC'est mieux de la regarder de loin.\n@c2@"
  it: "@a@b*: Nessuno è jamais tornato vivo da quel posto. Oui, molto meglio guardarla a distanza di sicurezza.\n@c2@"
  ja: "@a@b＊「あの島に入って\n\t生きて戻った人間はいない。\n\t見るだけにしておくがいい。\n@c2@"
"4":
  de: "@a@b*: Im Meer weit im Osten von 'ier gibt es eine große Insel, umgeben von großen Felsen.\n@c2@"
  en: "@a@b*: Zere is an island énorme, surrounded by ze big rocks, in ze sea far away to ze east.\n@c2@"
  es: "@a@b*: Hay una isla enogrme, rodeada de grandes grocas, a gran distancia hacia el esté.\n@c2@"
  fr: "@a@b*ⓢ Il y a une enormous île entourée de gros rochers, very loin dans la mer, à l'est.\n@c2@"
  it: "@a@b*: In mare, verso est, c'è un'isola enorme, scircondata da grandi rosce.\n@c2@"
  ja: "@a@b＊「ここより　はるか東の海に\n\t岩山に　かこまれた\n\t大きな島があるそうだ。\n@c2@"
"5":
  de: "@a@b*: Es 'eißt, dort 'ätten die Unge'euer eine Burg.\n@c2@"
  en: "@a@b*: And zey say ze monsters 'ave a castle zere.\n@c2@"
  es: "@a@b*: Y dicen que los monstgruos tienen un château allí.\n@c2@"
  fr: "@a@b*ⓢ Et on dit que les monsters ont un castel là-bas.\n@c2@"
  it: "@a@b*: E si disce che su di essa ci sia uno château abitato da mostri.\n@c2@"
  ja: "@a@b＊「そして　なんと　その島には\n\t魔物たちのお城があるという。\n@c2@"
"6":
  de: "@a@b*: Hier tritt gerade ein fabelhafter Komiker auf. Er heißt Alberich von Übermuth.\n@c3@"
  en: "@a@b*: There's a great comedian here at the moment called Tom Foolery.\n@c3@"
  es: "@a@b*: Un gran cómico está aquí últimamente, se llama Ben-Irrie.\n@c3@"
  fr: "@a@b*ⓢ On a un grand comique ici, en ce moment.\nIl s'appelle Tom Foolery.\n@c3@"
  it: "@a@b*: In questo periodo qui si sta esibendo un bravissimo comico di nome Jock Erellon.\n@c3@"
  ja: "@a@b＊「今　パノンっていう\n\t面白い芸人が来てるんだ。\n@c3@"
"7":
  de: "@a@b*: Wenn Ihr seinen Auftritt sehen wollt, dann geht heute Abend ins Theater.\n@c3@"
  en: "@a@b*: Head over to the theatre in the evening if you want to catch a performance.\n@c3@"
  es: "@a@b*: %H860%XVe%YId%Z al teatro por la noche si %H860%Xquieres%Yqueréis%Z verlo actuar.\n@c3@"
  fr: "@a@b*ⓢ Allez le voir au théâtre un soir, si vous voulez juger par yourself.\n@c3@"
  it: "@a@b*: Se %H860%Xvuoi%Yvolete%Z vedere il suo spettacolo, %H860%Xvai%Yandate%Z al teatro quando fa sera.\n@c3@"
  ja: "@a@b＊「パノンのステージを見たかったら\n\t夜に　劇場に行ってみな！\n@c3@"
"8":
  de: "@a@b*: Die Auftritte von diesem Alberich von Übermuth sind das Lustigste, was ich seit langem gesehen habe. Seit der hier ist, könnt ich mich kugeln vor Lachen.\n@c2@"
  en: "@a@b*: That Tom Foolery's performances are the funniest thing I've seen in a long while!\nI haven't stopped laughing since he arrived.\n@c2@"
  es: "@a@b*: ¡Las actuaciones de ese Ben-Irrie son la cosa más divertida que he visto en años!\nNo he dejado de reír desde que he llegado.\n@c2@"
  fr: "@a@b*ⓢ Les spectacles de ce Tom Foolery sont les plus drôles que j'aie jamais vusⓠ\nJe n'ai pas arrêté de rire depuis qu'il est arrivé.\n@c2@"
  it: "@a@b*: Lo spettacolo di Jock Erellon è il più divertente che abbia mai visto! Dall'inizio alla fine non si finisce mai di ridere!\n@c2@"
  ja: "@a@b＊「パノンのステージは最高さ。\n\tパノンが来てからは　あたしゃ\n\t毎晩　笑いっぱなしだよ。\n@c2@"
"9":
  de: "@a@b*: Dank diesem albernen Monsieur von Übermuth treten die Mädels nicht so 'äufig auf wie vor'er.\n@c0@"
  en: "@a@b*: Thanks to zat ridiculous Monsieur Foolery, ze dancing girls do not perform so much zese days.\n@c0@"
  es: "@a@b*: Gracias a ese gridículo Monsieur Irrie, las bailagrinas no actúan demasiado últimamente.\n@c0@"
  fr: "@a@b*ⓢ À cause de ce ridicule Mister Foolery, les danseuses performent moins sur scène en ce moment.\n@c0@"
  it: "@a@b*: Da quando Monsieur Jock Erellon fa il suo spectacle, le ballerine non lavorano più quanto prima, parbleu!\n@c0@"
  ja: "@a@b＊「パノンのせいで　踊り子さんの\n\t出番が減って　悲しいかぎりだ。\n@c0@"
"10":
  de: "@a@b*: Sie waren mein Leben! Zu denken, dass isch sie 'ier nischt mehr jeden Tag vorbeige'en se'en werde... c'est terrible!\n@c0@"
  en: "@a@b*: I lived for zem! To think I will not see zem pass by 'ere every day... Non! It is more zan a man can bear!\n@c0@"
  es: "@a@b*: ¡Ellas son mi vida! Pensagr que no las vegré pasagr pogr aquí cada día... ¡Non! ¡Es más de lo que un hombgre puede sopogrtagr!\n@c0@"
  fr: "@a@b*ⓢ Sans elles, ma life vaut plus rienⓠ\nJe regardais elles passer ici tous les jours...\nNo, c'est trop durⓠ\n@c0@"
  it: "@a@b*: Quelle splendide ragazze erano la mia passione! Se solo je pense che non le vedrò più passare qui ogni giorno... Oh, che tragedia!\n@c0@"
  ja: "@a@b＊「オレは　ここを通る踊り子さんを\n\t眺めるのが　生きがいだってのによ！\n@c0@"
"11":
  de: "@a@b*: Bienvenue im Théâtre de Laissez Fayre! Der Besitzer, Artois, ist unten.\n@c2@"
  en: "@a@b*: Bienvenue to ze théâtre de Laissez Fayre!\nIf you are looking for Manager Artois, 'e is down below.\n@c2@"
  es: "@a@b*: ¡Bienvenue al théâtre de Laissez Fayre! Si %H860%Xbuscas%Ybuscáis%Z al Jefe Menasatruá, está abajo.\n@c2@"
  fr: "@a@b*ⓢ Bienvenue à le théâtre de Teafortwoⓠ Si vous regardez pour l'agent Majestic, il est en bas.\n@c2@"
  it: "@a@b*: Bienvenue al teatro di Laissez Fayre! Se %H860%Xstai%Ystate%Z cercando il Manager Atruà, è di sotto.\n@c2@"
  ja: "@a@b＊「ここは　劇場。\n\t座長なら　地下の控え室にいますよ。\n@c2@"
"12":
  de: "@aManager Artois@bMaya, ma chérie!\nOh, isch bin ja so froh, disch wieder 'ier zu sehen!\n@c2@"
  en: "@aManager Artois@bMaya, ma chérie!\nOh là là, I am over ze moon to see you again!\n@c2@"
  es: "@aJefe Menasatruá@b¡Maya, ma chérie!\n¡Oh là là, estoy gradiante de volvegrte a vegr!\n@c2@"
  fr: "@aAgent Majestic@bMaya, chérie darlingⓠ\nJe suis par-dessus la lune de vous revoir.\n@c2@"
  it: "@aManager Atruà@bMaya, ma chérie! Oh, là là, che gioia rivederti!\n@c2@"
  ja: "@a@b＊「マーニャじゃないか！\n\t元気そうで　なによりだ。\n@c2@"
"13":
  de: "@aManager Artois@bEt bien. Sag mir, wie es mit der Rache für den traurigen Tod eures Vaters voran geht...\n㈡\nIsch verste'e. Nun, gib die 'offnung nur nischt auf, ma fille.\n@c2@"
  en: "@aManager Artois@bEt bien. Tell me 'ow goes ze vengeance of your father's tragique death...\nI see. Well, do not give up 'ope, ma fille.\n@c2@"
  es: "@aJefe Menasatruá@bEt bien. Dime, ¿qué tal te va con lo de la venganza de la tragique muegrte de tu padgre? Compgrendo. Bueno, no piegrdas la espegranza, ma fille.\n@c2@"
  fr: "@aAgent Majestic@bAlors... avez-vous vengé la mort de votre daddyⓡ\nWell, n'abandonnez pas, ma little girl.\n@c2@"
  it: "@aManager Atruà@bAlors, ti sei vendicata di colui che ha causato la morte di ton père? Oh, capisco... Non perdere mai la speranza, ma fille, jamais!\n@c2@"
  ja: "@a@b＊「で　親父さんのカタキ討ちは？\n\tうんうん　そうかい……。\n\tがんばるんだよ。\n@c2@"
"14":
  de: "@aManager Artois@bDank dem Genie von Monsieur Alberisch ist mein Theater jeden Abend voll! Ah oui. La vie est belle!\n@c2@"
  en: "@aManager Artois@bThanks to ze genius of Monsieur Tom Foolery, my théâtre is full every night!\nOui, oui. Life is good!\n@c2@"
  es: "@aJefe Menasatruá@b¡Gracias al ingenio de Monsieur Ben-Irrie, mi théâtre está lleno cada noche!\nOui, oui. ¡La vie es bella!\n@c2@"
  fr: "@aAgent Majestic@bGrâce à ce génial Mister Tom Foolery, mon théâtre est plein toutes les nightsⓠ\nOh no, je ne vais pas me complaindreⓠ\n@c2@"
  it: "@aManager Atruà@bGrazie alla verve comica di Monsieur Jock Erellon, il mio teatro fa il tutto esaurito ogni sera! Oui, oui! La vie è très jolie!\n@c2@"
  ja: "@a@b＊「パノンのおかげで　うちの劇場は\n\t毎晩　満員です。　わっはっはっ。\n@c2@"
"15":
  de: "@aAlberich von Übermuth@bIhr reist also durch die Lande? Tja, lasst Euch die Vorstellung heute Abend nicht entgehen! Das wird ein kapitaler Spaß!\n@c2@"
  en: "@aTom Foolery@bYe're %H860%Xa trav'ller%Ytrav'llers%Z, are ye?\nWell don't miss the show tonight.\nIt'll be a great craic.\n@c2@"
  es: "@aBen-Irrie@b%H860%XEres %A120%Xun viajiero%Z%B120%Xuna viajiera%Z%YSois %R000%Xviajieras%Yviajieros%Z%Z, ¿vierdad?\nBueno, no %H860%Xti puedes%Yos podéis%Z perdier el espectáculo de esta noche. Sierá una juerga.\n@c2@"
  fr: "@aTom Foolery@bVous êtes %H860%X%A120%Xun voyageur%Z%B120%Xune voyageuse%Z%Y%R000%Xdes voyageuses%Ydes voyageurs%Z%Z, n'est-ce pasⓡ\nEh bien, ne loupez pas le spectacle ce soir.\nÇa va être exceptionnel.\n@c2@"
  it: "@aJock Erellon@b%H860%XTu%YVoi%Z non siete di queste parti, vero? Allora %H860%Xti%Yvi%Z do un consiglio: non %H860%Xperdere%Yperdete%Z lo spettacolo di stasera... Sarà un capolavoro!\n@c2@"
  ja: "@a@bパノン「旅のおかたですか？\n\t今夜　私のステージがあるんです。\n\tぜひ　見に来てくださいね。\n@c2@"
"16":
  de: "@aAlberich von Übermuth@bWas? Ihr wollt, dass ich mit Euch mitkomme?\n@c2@"
  en: "@aTom Foolery@bWhat's that now?\nYou want me to come along with ye?\n@c2@"
  es: "@aBen-Irrie@b¿Cómo?\n¿Que %H860%Xquieres que ti%Yquieréis que os%Z acompañie?\n@c2@"
  fr: "@aTom Foolery@bDe quoiⓡ\nVous voulez que je vienne avec vousⓡ\n@c2@"
  it: "@aJock Erellon@bCosa? %H860%XVuoi che venga con te%YVolete che venga con voi%Z?\n@c2@"
  ja: "@a@bパノン「え？\n\tこの私に　ついてきて\n\tもらえないかですって？\n@c2@"
"17":
  de: "@aAlberich von Übermuth@bVerstehe... Ihr braucht also diesen Zenithiahelm, der dem König gehört, damit Ihr Eure Aufgabe erfüllen könnt? \n@c2@"
  en: "@aTom Foolery@bI see... So this Zenithian Helm yoke that belongs to the King o' Canalot is sometin' %H860%Xyerself is%Yyerselves are%Z needin' fer yer quest, is it?\n@c2@"
  es: "@aBen-Irrie@bComprendo... Así que ese Yelmo de Zenithia que pertenece al Rey de Canalot es un objieto que %H860%Xneciesitas para tu misión%Yneciesitáis para vuestra misión%Z, ¿es eso?\n@c2@"
  fr: "@aTom Foolery@bJe vois... Le roi de Canalot possède un Casque zénithien dont vous avez besoin pour votre quête, c'est çaⓡ\n@c2@"
  it: "@aJock Erellon@bAh, capisco. Quindi lo scolapasta da combattimento, cioè l'Elmo Zenithiano che appartiene al Re di Canalot %H860%Xti%Yvi%Z serve per proseguire nella %H860%Xtua%Yvostra%Z ricerca, eh?\n@c2@"
  ja: "@a@bパノン「……なるほど。　あなたがたの\n\t旅に必要な　天空のかぶとを\n\tスタンシアラ王が持っていると……。\n@c2@"
"18":
  de: "@aAlberich von Übermuth@bUnd damit er sie Euch gibt, braucht Ihr meine speziellen Talente?\n@c2@"
  en: "@aTom Foolery@bAn' to persuade the feen to give it ye, ye need my expertise?\n@c2@"
  es: "@aBen-Irrie@b¿Y para convencier al susiodicho para que %H860%Xti lo dé, neciesitas%Yos lo dé, neciesitáis%Z mi ayuda?\n@c2@"
  fr: "@aTom Foolery@bEt vous souhaitez utiliser mon talent pour qu'il vous le donne, c'est bien çaⓡ\n@c2@"
  it: "@aJock Erellon@bE %H860%Xvorresti%Yvorreste%Z il mio aiuto per convincere quel reggicorona a %H860%Xdartelo%Ydarvelo%Z?\n@c2@"
  ja: "@a@bパノン「で　かぶとを手に入れるには\n\t私の芸が　必要だと……。\n@c2@"
"19":
  de: "@aAlberich von Übermuth@b... Erzählt mir nicht, Ihr versucht, nach Zenithia zu gelangen! Nein, ich will's gar nicht wissen.\n@c2@"
  en: "@aTom Foolery@b...Don't tell me ye're tryin' to make yer way to Zenithia! No, I don't even want to know.\n@c2@"
  es: "@aBen-Irrie@b... ¡No mi %H860%Xdigas que estás%Ydigáis que estáis%Z intientando llegar a Zenithia! No, no quiero ni saberlo.\n@c2@"
  fr: "@aTom Foolery@b... Me dites pas que vous voulez aller à Zénithiaⓠⓑ\nNon, ne dites rien, je ne veux pas le savoir.\n@c2@"
  it: "@aJock Erellon@bNon %H860%Xmi dirai%Ymi direte%Z che %H860%Xhai%Yavete%Z intenzione di andare a Zenithia?! No, non voglio nemmeno saperlo!\n@c2@"
  ja: "@a@bパノン「ということは　もしや\n\tあなたがたは　天空の城へっ！？\n\tいや　おっしゃらなくても結構。\n@c2@"
"20":
  de: "@aAlberich von Übermuth@bNa schön... Ich lache auch mal gerne, und das hört sich an, als könnte es ein kapitaler Spaß werden. Also, warum nicht?!\n@c2@"
  en: "@aTom Foolery@bAye, well... I could do with a laugh, an' this sounds like it'll be a good craic. Why not!?\n@c2@"
  es: "@aBen-Irrie@bBueno, de acuerdo... Unas risas me vendrán bien, y por lo que %H860%Xcuentas%Ycontáis%Z seguro que sierá una buena juerga. ¡¿Por quié no?!\n@c2@"
  fr: "@aTom Foolery@bBon... Ça pourrait être amusant d'essayer de dérider votre hommeⓠ Alors pourquoi pasⓠ\n@c2@"
  it: "@aJock Erellon@bOh, beh... Tutto sommato sono in gamba nel far ridere gli altri. Perché no?\n@c2@"
  ja: "@a@bパノン「わかりました！\n\tおともいたしましょう！\n@c2@"
"21":
  de: "@a@bAlberich von Übermuth wird zum strahlenden Mittelpunkt der Gruppe!\n@c2@"
  en: "@a@bTom Foolery becomes the life and soul of the party!\n@c2@"
  es: "@a@bBen-Irrie se convierte en el alma de la fiesta y del grupo.\n@c2@"
  fr: "@a@bTom Foolery vient mettre de l'animation dans l'équipeⓠ\n@c2@"
  it: "@a@bJock Erellon e il suo sense of humour si uniscono al gruppo!\n@c2@"
  ja: "@a@bパノンが　仲間にくわわった！\n@c2@"
"22":
  de: "@aAlberich von Übermuth@bNa schön, dann mach ich mich mal auf den Weg. Ich warte im Wagen auf Euch.\n@c2@"
  en: "@aTom Foolery@bRight, well... I'll be headin' off, then.\nI'll be waitin' out in yer wagon.\n@c2@"
  es: "@aBen-Irrie@bDe acuerdo, entionces... Mi marcho.\nEstaré espierándo%H860%Xte%Yos%Z fuera en el carromato.\n@c2@"
  fr: "@aTom Foolery@bC'est parti, alors.\nJe vous attends dans le chariot.\n@c2@"
  it: "@aJock Erellon@bD'accordo. Ora me ne vado. Ci vediamo al carro.\n@c2@"
  ja: "@a@bパノン「では　先に外へ出て　私は\n\t馬車の中で　待つとしましょう。\n@c2@"
"23":
  de: "@aAlberich von Übermuth@bDann hab ich Euch wohl falsch verstanden.\n@c2@"
  en: "@aTom Foolery@bThen I must be hearin' things, I s'pose.\n@c2@"
  es: "@aBen-Irrie@bEntonces dieben ser cosas mías.\n@c2@"
  fr: "@aTom Foolery@bAh, je dois entendre des voix alors...\n@c2@"
  it: "@aJock Erellon@bEh? Forse sto cominciando ad avere problemi di udito... \n@c2@"
  ja: "@a@bパノン「おや　私の空耳だったかな。\n@c2@"
"24":
  de: "@a@b*: Glaubt Ihr, der Marquis Régent wird wütend sein? Ich meine, weil ich Blondelle doch nicht wie befohlen zum Palast bringen konnte.\n@c2@"
  en: "@a@b*: D'you think the Marquis Regent will be angry?\nBecause I didn't manage to take Blondelle to the palais like he ordered, I mean.\n@c2@"
  es: "@a@b*: ¿%H860%XCrees%YCreéis%Z que el Marqués Regente se enfadará?\nEs que no he podido llevar a Blondelle al palacio como él ordenó.\n@c2@"
  fr: "@a@b*ⓢ Vous croyez que le Lord Regent va être énervéⓡ\nJ'ai pas réussi à ramener Jane Blond au palais, comme il m'avait demandé.\n@c2@"
  it: "@a@b*: Ho paura che il Marchese Reggente si arrabbierà a morte con me... Non sono riuscito a portare Blondelle al palazzo, come lui mi aveva ordinato.\n@c2@"
  ja: "@a@b＊「リンダを　お城に\n\t連れていかなかったから\n\t王さまは　きっと怒っているはず！\n@c2@"
"25":
  de: "@a@b*: Ja, bestimmt wird er fuchsteufelswild! Bitte verratet keinem, dass ich mich hier verstecke! Bitte!\n@c2@"
  en: "@a@b*: Yes, he'll be hopping mad, won't he!?\nYou can't tell anyone you found me hiding here. Please!\n@c2@"
  es: "@a@b*: Se va a poner furioso, ¿verdad?\nNo le %H860%Xdigas%Ydigáis%Z a nadie que me estoy escondiendo aquí. ¡Por favor!\n@c2@"
  fr: "@a@b*ⓢ Ouais... Il va me passer un méchant savon, heinⓡ\nEt si vous disiez que vous m'avez pas vuⓡ\nJe vous en prieⓠ\n@c2@"
