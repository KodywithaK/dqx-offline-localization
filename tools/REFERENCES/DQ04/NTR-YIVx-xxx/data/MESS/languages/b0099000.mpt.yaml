  ja: "@a@bパノン「ちょっと　わたしの服のすそを\n\t持ってくれますか？　そうです。\n\tでは　いきますよ。\n@c2@"
"63":
  de: "@aAlberich von Übermuth@bHa ha hah! Manchmal könnt ich mich selbst über mich kaputtlachen! Ha ha ha!\n@c2@"
  en: "@aTom Foolery@bHa ha hah! I crack meself up, sometimes. I really do!\n@c2@"
  es: "@aBen-Irrie@b¡Ja, ja, ja! A vieces yo mismo me muero de la risa. ¡En sierio!\n@c2@"
