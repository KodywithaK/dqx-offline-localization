  ja: "@a@bパノン「でも　今はムリです。\n\t話は　明日の昼間にでも\n\t楽屋で　うかがいましょう！\n@c2@"
"66":
  de: "@a@b*: Ich ging raus, um ihn zu suchen, und als ich zurückkam, lag er hier und schlief! Wo hat er in der Zwischenzeit nur gesteckt?\n@c2@"
