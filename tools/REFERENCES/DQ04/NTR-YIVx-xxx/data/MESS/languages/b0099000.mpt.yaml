"87":
  de: "@a@b*: Die magischen Mäschte 'aben mir mitgeteilt, dass Ihr das Zeug dazu 'abt, ein 'eld der Legenden zu werden!\n@c1@"
  en: "@a@b*: Ze magical forces, zey inform me zat you 'ave what it takes to be an 'ero of legend!\n@c1@"
  es: "@a@b*: Las fuegrzas del más ici me han configrmado que tienes madegra de %A120%Xhégroe%Z%B120%Xhegroina%Z.\n@c1@"
  fr: "@a@b*ⓢ Les magical forces me disent que vous avez l'étoffe %A120%Xd'un héros%Z%B120%Xd'une héroïne%Z de légendeⓠ\n@c1@"
  it: "@a@b*: Gli spiriti magisci mi dicono che presto diventerai una vera lesgenda, oui! È scritto nel tuo destino!\n@c1@"
  ja: "@a@b＊「今のはね\n\t女の子に　もてるようになる\n\tぱふぱふの　おまじないよ。\n@c1@"
"88":
  de: "@a@b*: Also nur nischt so schüchtern! Nur Mut! Zeigt, was in Eusch steckt!\n@c1@"
  en: "@a@b*: So don't be shy! 'Ave courage.\nIf you've got it, flaunt it!\n@c1@"
  es: "@a@b*: ¡No seas %A120%Xtímido%Z%B120%Xtímida%Z! Sé valiente.\n¡Es lo que egres!\n@c1@"
  fr: "@a@b*ⓢ Soyez pas timideⓠ Courageⓠ\nSi vous en avez, montrez-leⓠ\n@c1@"
  it: "@a@b*: Forza, vinci la tua timidezza! Fatti avanti, e mostra quello che sai fare!\n@c1@"
  ja: "@a@b＊「これからは　自信を持って\n\t生きていってね。\n@c1@"
"89":
  de: "@a@b*: Mais pourquoi?\nNa schön. Kommt zurück, wenn Ihr Eure Meinung ändert!\n@c1@"
  en: "@a@b*: But pourquoi!?\nCome back if you change your mind.\n@c1@"
  es: "@a@b*: ¡¿Pegro pourquoi?!\nVuelve si cambias de opinión.\n@c1@"
  fr: "@a@b*ⓢ Pourquoi çaⓡ\nSi vous changez votre avis, revenez me voir.\n@c1@"
  it: "@a@b*: Oh, ma pourquoi? D'accordo. Se cambi idea, sai dove trovarmi.\n@c1@"
  ja: "@a@b＊「そう　残念だわ。\n\t気が変わったら　また来てね。\n@c1@"
"90":
  de: "@a@b*: In diesem Zimmer wohnte früher ein hübsches junges Mädchen namens Blondelle. Ich hab gehört, sie wohnt jetzt woanders und ist glücklich.\n@c2@"
  en: "@a@b*: There was a lovely young girl called Blondelle who used to rent this room, you know.\nI hear she's living happily somewhere else now.\n@c2@"
  es: "@a@b*: Una preciosa chica rubia llamada Blondelle solía tener alquilada esta habitación.\nSegún dicen, ahora vive feliz en otro lugar.\n@c2@"
  fr: "@a@b*ⓢ C'était une jolie jeune fille du nom de Jane Blond qui louait cette pièce, avant. Il paraît qu'elle est partie loin et qu'elle est très heureuse, maintenant.\n@c2@"
  it: "@a@b*: Prima questa stanza era affittata da una bella ragazza di nome Blondelle. Adesso è andata via, e spero che sia felice, ovunque si trovi... \n@c2@"
  ja: "@a@b＊「昔この部屋にいた　リンダって娘\n\t今は　幸せに暮らしてるそうだよ。\n@c2@"
"91":
  de: "@a@b*: Laissez Fayre ist die Stadt der Unterhaltung!\nDie Stadt nördlich von hier wurde in Boutdumonde umbenannt.\n@c2@"
  en: "@a@b*: This is the city of song and dance, Laissez Fayre! The town north of here's been renamed Aubout du Monde.\n@c2@"
  es: "@a@b*: ¡Esta es la ciudad del baile y la canción, Laissez Fayre! La ciudad del norte ha cambiado de nombre y ahora se llama Aubout du Monde.\n@c2@"
  fr: "@a@b*ⓢ Nous sommes à Teafortwo, la capitale du divertissementⓠ La ville au nord d'ici a été rebaptisée Deadend.\n@c2@"
  it: "@a@b*: Questa è Laissez Fayre, la città della danza e del canto! Il villaggio a nord, invece, si chiama Infond Almond.\n@c2@"
  ja: "@a@b＊「ここは　歌と踊りの町モンバーバラ。\n\t北に行けば　コーミズ村があります。\n@c2@"
"92":
  de: "@a@b*: Pardon, %A120%XMonsieur%Z%B120%XMademoiselle%Z. Die Schänke wird erste 'eute Abend geöffnet.\n@c1@"
  en: "@a@b*: Pardon, %A120%Xmonsieur%Z%B120%Xmademoiselle%Z.\nZe pub will not be opening until zis evening.\n@c1@"
  es: "@a@b*: Pardon, %H860%X%A120%Xmonsieur%Z%B120%Xmademoiselle%Z%Y%R000%Xmademoiselles%Ymonsieurs%Z%Z. La tabegrna no abgrigrá hasta pogr la noche.\n@c1@"
  fr: "@a@b*ⓢ Je demande votre pardon, %A120%XMonsieur%Z%B120%XMademoiselle%Z. Le pub n'ouvre que ce soir.\n@c1@"
  it: "@a@b*: Mi scusi, %A120%Xmonsieur%Z%B120%Xmademoiselle%Z. Il locale non aprirà prima di stasera.\n@c1@"
  ja: "@a@b＊「酒場は　夜からよ。\n\tごめんね。\n@c1@"
"93":
  de: "@a@b*: Ihr seid über das Meer gekommen?\nDann habt Ihr die Felseninsel gese'en, auf der die Unge'euer leben, non?\n@c2@"
  en: "@a@b*: You came 'ere over ze ocean?\nZen you will 'ave seen ze rocky island where ze monsters live, non?\n@c2@"
  es: "@a@b*: ¿%H860%XHas%YHabéis%Z venido hasta aquí pogr magr?\nEntonces %H860%Xhabgrás%Yhabgréis%Z visto la isla grocosa en donde viven los monstgruos, ¿no?\n@c2@"
  fr: "@a@b*ⓢ Vous avez arrivé par l'océanⓡ\nAlors vous avez vu l'île rocheuse où les monsters habitent, noⓡ\n@c2@"
  it: "@a@b*: %H860%XHai%YAvete%Z attraversato l'oceano per arrivare ici? Alors %H860%Xavrai%Yavrete%Z certamente visto l'isola rocciosa dove vivono i mostri, non?\n@c2@"
  ja: "@a@b＊「ほほう　海を渡って　この町に？\n\tでは　魔物たちが住むという\n\t岩山の島を　見てきたのか？\n@c2@"
"94":
  de: "@a@b*: Von dort ist noch niemand lebend zurückgekommen. Am besten 'ält man sisch davon möglischst fern.\n@c2@"
  en: "@a@b*: No one 'as ever come back alive from zat place. It is best to observe it from afar.\n@c2@"
  es: "@a@b*: Nadie ha gregresado nunca con vida de ese lugagr. Lo mejogr es obsegrvagrlo desde lejos.\n@c2@"
  fr: "@a@b*ⓢ Personne n'est jamais revenu de cette place.\nC'est mieux de la regarder de loin.\n@c2@"
  it: "@a@b*: Nessuno è jamais tornato vivo da quel posto. Oui, molto meglio guardarla a distanza di sicurezza.\n@c2@"
  ja: "@a@b＊「あの島に入って\n\t生きて戻った人間はいない。\n\t見るだけにしておくがいい。\n@c2@"
"95":
  de: "@a@b*: Im Meer weit im Osten von 'ier gibt es eine große Insel, umgeben von großen Felsen.\n@c2@"
  en: "@a@b*: Zere is an island énorme, surrounded by ze big rocks, in ze sea far away to ze east.\n@c2@"
  es: "@a@b*: Hay una isla enogrme, rodeada de grandes grocas, a gran distancia hacia el esté.\n@c2@"
  fr: "@a@b*ⓢ Il y a une enormous île entourée de gros rochers, very loin dans la mer, à l'est.\n@c2@"
  it: "@a@b*: In mare, verso est, c'è un'isola enorme, scircondata da grandi rosce.\n@c2@"
  ja: "@a@b＊「ここより　はるか東の海に\n\t岩山に　かこまれた\n\t大きな島があるそうだ。\n@c2@"
"96":
  de: "@a@b*: Es 'eißt, dort 'ätten die Unge'euer eine Burg.\n@c2@"
  en: "@a@b*: And zey say ze monsters 'ave a castle zere.\n@c2@"
  es: "@a@b*: Y dicen que los monstgruos tienen un château allí.\n@c2@"
  fr: "@a@b*ⓢ Et on dit que les monsters ont un castel là-bas.\n@c2@"
  it: "@a@b*: E si disce che su di essa ci sia uno château abitato da mostri.\n@c2@"
  ja: "@a@b＊「そして　なんと　その島には\n\t魔物たちのお城があるという。\n@c2@"
"97":
  de: "@a@b*: Hier gibt's die beste Unter'altung auf der ganzen Welt! In Laissez Fayre ist alles möglisch!\n@c3@"
  en: "@a@b*: The entertainment here is the best in the world. Anything goes in Laissez Fayre!\n@c3@"
  es: "@a@b*: ¡La mejor diversión del mundo! ¡En Laissez Fayre tenemos de todo!\n@c3@"
  fr: "@a@b*ⓢ C'est ici que vous trouverez les meilleurs divertissements au monde.\nTout est mieux à Teafortwoⓠ\n@c3@"
  it: "@a@b*: Qui ci si diverte come in nessun'altra parte del mondo! Laissez Fayre è un vero paradiso!\n@c3@"
  ja: "@a@b＊「この町の歌と踊りは\n\tやっぱり　サイコーだぜ！\n@c3@"
"98":
  de: "@a@b*: Tänzerinnen und Sänger sind ja gut und schön, aber ich würde diesen Alberich von Übermuth zu gern noch mal sehen.\n@c2@"
  en: "@a@b*: Dancing girls and singers are all very well, but it's that Tom Foolery I'd like to see up on stage again.\n@c2@"
  es: "@a@b*: Las bailarinas y las cantantes están muy bien, pero a quien me gustaría volver a ver en escena es a ese Ben-Irrie.\n@c2@"
  fr: "@a@b*ⓢ Les danseuses et les chanteurs valent le coup, mais le clou, c'était quand même Tom Foolery.\nJ'aimerais bien le revoir sur scène.\n@c2@"
  it: "@a@b*: Certo, i cantanti e le ballerine sono molto bravi, ma muoio dalla voglia di vedere un'altra esibizione di Jock Erellon.\n@c2@"
  ja: "@a@b＊「歌に踊りもいいけどさ　あたしゃ\n\tもう一度　パノンの芸が見たいよ。\n@c2@"
"99":
  de: "@a@b*: Jetzt, da dieser comédien, Alberisch von Übermuth, 'ier nischt mehr auftritt, sind die Tänzerinnen wieder da.\n㈡\n*: 'offentlisch kommt bald eine 'ier vorbei.\n@c0@"
  en: "@a@b*: Now zat comédien, Tom Foolery, 'as finished performing 'ere, ze dancing girls are back.\nI 'ope one comes by soon.\n@c0@"
  es: "@a@b*: Ahogra que ese cómico, Ben-Igrrie, ha dejado de actuagr aquí, las bailagrinas han gregresado.\nEspegro que pgronto pase alguna.\n@c0@"
  fr: "@a@b*ⓢ Ça y est. Le comique Tom Foolery a fini son show. Les danseuses vont pouvoir revenir back.\nJ'espère qu'on va bientôt en voir une.\n@c0@"
  it: "@a@b*: Oh, très bien! Ora che il comico Jock Erellon ha terminato i suoi spettacoli, le ballerine sono di retour. Spero proprio che ne passi una presto!\n@c0@"
  ja: "@a@b＊「パノンがいなくなってから\n\t踊り子さんの出番が　増えたんだ。\n\tはやく来ないかな　踊り子さん。\n@c0@"
"100":
  de: "@a@b*: Oh, mon Dieu! Dieser kokette Augenaufschlag, bevor die Show beginnt... Das 'aut doch den stärksten Mann um!\n@c0@"
  en: "@a@b*: Oh, mon Dieu! Zat ⓗlet's give it to zemⓘ look on zeir faces before ze show...\nIt is more zan a man can bear!\n@c0@"
  es: "@a@b*: ¡Oh, mon Dieu! Esa migrada de ''van a sabegr lo que es bon'' antes de su actuación...\n¡Es más de lo que un hombgre puede sopogrtagr!\n@c0@"
  fr: "@a@b*ⓢ Criquetⓠ Leur face avant le show...\nOh no, un homme peut pas rester indifférentⓠ\n@c0@"
  it: "@a@b*: Oh, mon dieu! Guarda l'espressione provocante che hanno prima dello spectacle! Nessun uomo può resistere, parbleu!\n@c0@"
  ja: "@a@b＊「仕事に向かう　踊り子さんの\n\tさあ　やるぞっていう顔が　オレは\n\tなんともいえず　好きなのだ。\n@c0@"
"101":
  de: "@a@b*: Bienvenue im Théâtre de Laissez Fayre! Der Besitzer, Artois, ist unten.\n@c2@"
  en: "@a@b*: Bienvenue to ze théâtre de Laissez Fayre!\nIf you are looking for Manager Artois, 'e is down below.\n@c2@"
  es: "@a@b*: ¡Bienvenue al théâtre de Laissez Fayre! Si %H860%Xbuscas%Ybuscáis%Z al Jefe Menasatruá, está abajo.\n@c2@"
  fr: "@a@b*ⓢ Bienvenue à le théâtre de Teafortwoⓠ Si vous regardez pour l'agent Majestic, il est en bas.\n@c2@"
  it: "@a@b*: Bienvenue al teatro di Laissez Fayre! Se %H860%Xstai%Ystate%Z cercando il Manager Atruà, è di sotto.\n@c2@"
  ja: "@a@b＊「ここは　劇場。\n\t座長なら　地下の控え室にいますよ。\n@c2@"
"102":
  de: "@aManager Artois@bZut. Nach Alberisch von Übermuth sieht alles langweilisch aus. Seine Bühnenshow war einfach excellent.\n@c2@"
  en: "@aManager Artois@bZut. Zere is no one good enough to follow Tom Foolery. 'E was an act par excellence.\n@c2@"
  es: "@aJefe Menasatruá@bMaldición. No se puede sustituigr a Ben-Irrie. Egra el agrtista par excellence.\n@c2@"
  fr: "@aAgent Majestic@bDamnedⓠ Personne n'arrive à le cheville de Tom Foolery. C'était un natural born acteur.\n@c2@"
  it: "@aManager Atruà@bOh, ascidenti! Non esiste un altro intrattenitore che possa competere con Jock Erellon. Il suo show era magnifique.\n@c2@"
  ja: "@a@b＊「ふーむ。\n\tパノンにかわる芸人など\n\tそうは　いないだろうな。\n@c2@"
"103":
  de: "@aManager Artois@bIch 'abe keine Wahl. Ich muss die Tänzerinnen und Sänger wieder auf die Bühne bringen.\n@c2@"
  en: "@aManager Artois@bI 'ave no choice. I will 'ave to 'eadline ze dancing girls and ze singers like I did before.\n@c2@"
  es: "@aJefe Menasatruá@bNo tengo elección. Tendgré que volvegr a pgresentagr a las bailagrinas y a las cantantes, como antes.\n@c2@"
  fr: "@aAgent Majestic@bJe n'ai pas de choice.\nJe vais devoir reprogrammer les danseuses et les chanteurs comme before.\n@c2@"
  it: "@aManager Atruà@bPurtroppo, non ho alternativa. Dovrò far tornare sul palco i cantanti e le ballerine.\n@c2@"
  ja: "@a@b＊「しかたがない。\n\tまた昔のように　歌と踊りで\n\tやっていくか……。\n@c2@"
"104":
  de: "@a@b*: Glaubt Ihr, der Marquis Régent wird wütend sein? Ich meine, weil ich Blondelle doch nicht wie befohlen zum Palast bringen konnte.\n@c2@"
  en: "@a@b*: D'you think the Marquis Regent will be angry?\nBecause I didn't manage to take Blondelle to the palais like he ordered, I mean.\n@c2@"
  es: "@a@b*: ¿%H860%XCrees%YCreéis%Z que el Marqués Regente se enfadará?\nEs que no he podido llevar a Blondelle al palacio como él ordenó.\n@c2@"
  fr: "@a@b*ⓢ Vous croyez que le Lord Regent va être énervéⓡ\nJ'ai pas réussi à ramener Jane Blond au palais, comme il m'avait demandé.\n@c2@"
  it: "@a@b*: Ho paura che il Marchese Reggente si arrabbierà a morte con me... Non sono riuscito a portare Blondelle al palazzo, come lui mi aveva ordinato.\n@c2@"
  ja: "@a@b＊「リンダを　お城に\n\t連れていかなかったから\n\t王さまは　きっと怒っているはず！\n@c2@"
"105":
  de: "@a@b*: Ja, bestimmt wird er fuchsteufelswild! Bitte verratet keinem, dass ich mich hier verstecke! Bitte!\n@c2@"
  en: "@a@b*: Yes, he'll be hopping mad, won't he!?\nYou can't tell anyone you found me hiding here. Please!\n@c2@"
  es: "@a@b*: Se va a poner furioso, ¿verdad?\nNo le %H860%Xdigas%Ydigáis%Z a nadie que me estoy escondiendo aquí. ¡Por favor!\n@c2@"
  fr: "@a@b*ⓢ Ouais... Il va me passer un méchant savon, heinⓡ\nEt si vous disiez que vous m'avez pas vuⓡ\nJe vous en prieⓠ\n@c2@"
  it: "@a@b*: Sì, mi scorticherà vivo! Per favore, non %H860%Xdire%Ydite%Z a nessuno che mi %H860%Xhai%Yavete%Z visto qui!\n@c2@"
  ja: "@a@b＊「オレが　ここに　かくれてるってのは\n\t頼むから内緒だぜ。　な！　な！\n@c2@"
"106":
  de: "@a@b*: Was? Es ist keiner unten im Geschäft?! Oh, nicht schon wieder! Wo steckt der Faulpelz nur?\n@c2@"
  en: "@a@b*: What? Why's there no one in the shop downstairs? Oh, not again!\nWhere's my husband lazing about now?\n@c2@"
  es: "@a@b*: ¿Qué? ¿Por qué no hay nadie en el piso de abajo, en la tienda? ¡Otra vez no! ¿Dónde estará el holgazán de mi esposo?\n@c2@"
  fr: "@a@b*ⓢ Quoiⓡ Pourquoi il n'y a personne dans le shop en basⓡ Oh no, pas encoreⓠ Où est passé mon fainéant de mariⓡ\n@c2@"
  it: "@a@b*: Cosa? Perché non c'è nessuno giù al negozio? Oh, non di nuovo! Dove si sarà cacciato mio marito stavolta?\n@c2@"
  ja: "@a@b＊「え？　下の店に　誰もいない？\n\tもう！　ウチの人ったら\n\tまた　どこかでサボってるんだわ！\n@c2@"
"107":
  de: "@a@b*: Kein Alberich von Übermuth mehr. Mir fehlen seine Auftritte. Es war so schön, mal wieder lachen zu können.\n@c2@"
  en: "@a@b*: No more Tom Foolery now. I really miss his shows. It was a welcome break to have a laugh now and then.\n@c2@"
  es: "@a@b*: Ya se ha acabado Ben-Irrie. Echo mucho de menos sus actuaciones. Unas risas de vez en cuando eran un respiro necesario.\n@c2@"
  fr: "@a@b*ⓢ Tom Foolery a arrêté sa tournée, maintenant. J'adorais ses spectacles. Ça nous permettait de faire une pause et de rigoler de temps en temps.\n@c2@"
  it: "@a@b*: Peccato che Jock Erellon non si esibisca più qui. Le sue barzellette mi mancano molto. Mi divertivo sempre tantissimo al suo spettacolo.\n@c2@"
  ja: "@a@b＊「もう　パノンの話を\n\t聞けないんですねえ。\n\tさびしいなあ……。\n@c2@"
"108":
  de: "@a@b*: Blondelle ist anscheinend mit dem Priester geflohen.\n@c1@"
  en: "@a@b*: Blondelle escaped with the priest, apparently.\n@c1@"
  es: "@a@b*: Al parecer, Blondelle ha huido con el sacerdote.\n@c1@"
  fr: "@a@b*ⓢ Il paraît que Jane Blond s'est enfuie avec le prêtre.\n@c1@"
  it: "@a@b*: In giro si dice che Blondelle sia fuggita con il sacerdote... \n@c1@"
  ja: "@a@b＊「リンダは神父さんと　無事に\n\tこの町を　抜け出したそうよ。\n@c1@"
"109":
  de: "@a@b*: Ich hoffe, sie sind jetzt beide glücklich, egal, wo sie auch sind.\n@c1@"
  en: "@a@b*: I hope they're both happy now, wherever they are...\n@c1@"
  es: "@a@b*: Espero que sean felices los dos, estén donde estén...\n@c1@"
