  ja: "@a@b＊「うぷぷ！\n\tパノンは　ほんとに面白いですな！\n@c2@"
"56":
  de: "@a@b*: Non! Jetch hab ich cho lachen müchen, dach ich mein Gebich verloren habe!\n@c2@"
