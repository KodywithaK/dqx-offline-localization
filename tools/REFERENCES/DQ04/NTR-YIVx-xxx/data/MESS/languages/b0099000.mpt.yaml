  es: "@a@b*: ¡Non! Me eftaba riendo tan fuerfte que he ferdido mi debtadura poftifa...\n@c2@"
  fr: "@a@b*ⓢ Oh noⓠ J'ai 'ellement rigo'é que j'ai per'u mes fausses 'ents...\n@c2@"
  it: "@a@b*: Parbleu! Ho rifo cofì tanto che la mia dentiera è faltata via!\n@c2@"
  ja: "@a@b＊「ふごふご……笑いふぎて\n\t入れ歯が　ずれてひもうたわい。\n\tもがもが……。\n@c2@"
"57":
  de: "@a@b*: Was?! Entschuldigung, das habe ich nicht ganz mitgekriegt. Die Leute haben so laut gelacht.\n@c2@"
  en: "@a@b*: What? I didn't catch that.\nI can't hear over all the laughter.\n@c2@"
  es: "@a@b*: ¿Cómo? No he pillado eso.\nLas risas no me dejan oír bien.\n@c2@"
  fr: "@a@b*ⓢ Heinⓡ J'ai pas compris.\nJ'entends rien avec tous ces gens qui rigolent.\n@c2@"
  it: "@a@b*: Che cosa? Che ha detto? Non ho sentito l'ultima battuta! Le risate sono così forti che coprono la voce del comico!\n@c2@"
  ja: "@a@b＊「えっ　なんですって？\n\t笑い声のせいで　聞こえなかったよ。\n@c2@"
"58":
  de: "@a@b*: Du bist doch Maya, oder? Hab gehört, du hättest aufgehört, aber jetzt bist du wohl zurück? Das ist wunderbar!\n@c3@"
