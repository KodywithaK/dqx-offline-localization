"73":
  de: "@a@b*: Wenn der ⓚⓛ hick! ⓚⓛ unbedingt wieder auferschtehn will, dann ⓚⓛ hick! ⓚⓛ soller sisch mal 'n bischen beeilen!\n@c3@"
