"0":
  de: "@a@b*: Miau?\n@c1@"
  en: "@a@b*: Meow?\n@c1@"
  es: "@a@b*: Este... miau.\n@c1@"
  fr: "@a@b*ⓢ Miaouⓡ\n@c1@"
  it: "@a@b*: Miiiii-ao.\n@c1@"
  ja: "@a@b＊「にゃ～ん。\n@c1@"
"1":
  de: "@a@b*: Heiliger Bimbam!\nIch hab kaum meinen Augen getraut, wisst Ihr!\n@c2@"
  en: "@a@b*: Hooly dooly!\nI could hardly believe me eyes, y'know.\n@c2@"
  es: "@a@b*: ¡Che!\nNo podía creer lo que veía, viste.\n@c2@"
  fr: "@a@b*ⓢ Par tous les saintsⓠ\nJ'en croyais pas mes yeux, vous savez.\n@c2@"
  it: "@a@b*: Mizzica!\nMi spaventai!\n@c2@"
  ja: "@a@b＊「あ　あたしゃ\n\t見てしまったんだよ！\n@c2@"
"2":
  de: "@a@b*: Südlich des Flusses gibt es eine riesige Statue, und so wahr ich hier stehe, sie hat sich bewegt! Sie ist rumgelaufen! Echt wahr!\n@c2@"
  en: "@a@b*: There's a humungo statue to the south of this river, and strewth, I swear I saw it go walkabout! Fair dink! \n@c2@"
  es: "@a@b*: ¡Hay una inmensa estatua al sur de este río, y %H860%Xte%Yles%Z digo que juraría que la vi dándose un paseo! ¡Este... lo puedo jurar! \n@c2@"
  fr: "@a@b*ⓢ Il y a une immense statue au sud de cette rivière et je vous jure que je l'ai vue marcherⓠ\nJe vous prometsⓠ\n@c2@"
  it: "@a@b*: C'è 'na statua gigante a sud 'i chistu fiumi... A vitti ca camminava, veru iè!\n@c2@"
  ja: "@a@b＊「この川を　南に向かったところに\n\t大きな像が　立ってるんだけど\n\tその像が　歩くところを！\n@c2@"
"3":
  de: "@a@b*: Früher haben die Menschen eigentümliche Apparate gebaut und sind damit geflogen.\n@c2@"
  en: "@a@b*: Back in the old days, people used to fly about in the sky in funny contraptions they built.\n@c2@"
  es: "@a@b*: En los viejos días, la gente solía volar por los cielos en máquinas extrañas que construían.\n@c2@"
  fr: "@a@b*ⓢ Dans le temps, les gens volaient dans le ciel grâce à de drôles d'engins qu'ils construisaient eux-mêmes.\n@c2@"
  it: "@a@b*: Anni addietro, la gente volava nel cielo e strani aggeggi usava.\n@c2@"
  ja: "@a@b＊「その昔　人も乗り物を使い\n\t空を　飛んでいました。\n@c2@"
"4":
  de: "@a@b*: Doch das alles hatte ein Ende, als der Herr der Unterwelt kam und uns die ⓞGrundzutatⓟ nahm.\n@c2@"
  en: "@a@b*: But that all ended when the Lord o' the Underworld went an' made off with the basic ⓗingredientⓘ, if ya like.\n@c2@"
  es: "@a@b*: Pero eso terminó cuando el Señor del Inframundo terminó con el ''ingrediente'' básico, viste.\n@c2@"
  fr: "@a@b*ⓢ Mais tout a pris fin lorsque le Seigneur des Enfers est parti avec ⓥl'élémentⓦ principal.\n@c2@"
  it: "@a@b*: Ma quanno il Signore degli Inferi fece sparire ⓕl'ingredienteⓖ fondamentale, tutto finì.\n@c2@"
  ja: "@a@b＊「しかし　地獄の帝王が\n\tその乗り物の　みなもとを\n\tうばっていったと伝えられています。\n@c2@"
"5":
  de: "@a@b*: Ich vermute, dass sie damals mit ihm verschwunden ist, als er weggesperrt wurde.\n@c2@"
  en: "@a@b*: I reckon it probably ended up bein' sealed away with him, y'know.\n@c2@"
  es: "@a@b*: Este... supongo que terminó oculto y sellado como él.\n@c2@"
  fr: "@a@b*ⓢ Je suppose qu'il a été enfermé avec lui.\n@c2@"
  it: "@a@b*: Secondo me, messo al sicuro da qualche parte l'hanno, insieme a quell'essere fetuso!\n@c2@"
  ja: "@a@b＊「たぶん　それは\n\t地獄の帝王とともに\n\t地の底に　封じこまれたのでしょう。\n@c2@"
"6":
  de: "@a@b*: Willkommen in Oldenförde am Flussufer! Ist doch recht nett hier, nich'?\n@c2@"
  en: "@a@b*: Welcome to the riverside town of Riverton! Pretty good name for the place, eh?\n@c2@"
  es: "@a@b*: ¡%H860%X%A120%XBienvenido%Z%B120%XBienvenida%Z%Y%R000%XBienvenidas%YBienvenidos%Z%Z a la ciudad ribereña de Riverton! Es un lindo nombre para una ciudad, ¿eh?\n@c2@"
  fr: "@a@b*ⓢ Bienvenue dans la ville côtière d'Estuariaⓠ\nC'est un joli nom, heinⓡ\n@c2@"
  it: "@a@b*: %H860%X%A120%XBenvenuto%Z%B120%XBenvenuta%Z%Y%R000%XBenvenute%YBenvenuti%Z%Z a Fiumazza! Iè bello come nome pi' 'nu paesino, veru iè?\n@c2@"
  ja: "@a@b＊「ようこそ\n\t川の村　リバーサイドへ！\n@c2@"
"7":
  de: "@a@b*: Na, Euer Boot ist aber eine wahre Schönheit. Da habt Ihr Glück gehabt!\n@c2@"
  en: "@a@b*: Hey, that boat you've got is a real beaut. Good on ya!\n@c2@"
  es: "@a@b*: Este, ese barco %H860%Xtuyo%Yvuestro%Z es una belleza. ¡Felicitaciones!\n@c2@"
  fr: "@a@b*ⓢ Eh bien, on peut dire que vous avez un bien beau bateau. Vous avez de la chanceⓠ\n@c2@"
  it: "@a@b*: Miiiii, iè proprio bedda la %H860%Xtua%Yvostra%Z nave!\n@c2@"
  ja: "@a@b＊「それにしても　あんたたちの船\n\tりっぱなモンだねえ。\n@c2@"
"8":
  de: "@a@b*: Trotzdem braucht Ihr 'nen etwas größeren Kahn, wenn Ihr vorhabt, aufs offene Meer hinauszufahren.\n@c2@"
  en: "@a@b*: Still, I s'pose you need a decent-sized thing if you're sailin' out on the open ocean.\n@c2@"
  es: "@a@b*: Claro que, para navegar por el océano se necesita algo de un tamaño decente, viste.\n@c2@"
  fr: "@a@b*ⓢ Remarquez, pour naviguer sur l'océan, j'imagine qu'il faut un bateau digne de ce nom.\n@c2@"
  it: "@a@b*: Di sicuro, c'è bisogno di una nave molto grande pe' viaggiari su e giù pi 'u mari!\n@c2@"
  ja: "@a@b＊「やっぱり　外の海を旅する船は\n\tちがうなあ……。\n@c2@"
"9":
  de: "@a@b*: Es heißt, dass es dort drüben im Niemandsland eine Monsterburg gibt.\n@c1@"
  en: "@a@b*: People reckon there's a monster castle somewhere in the Ostro outback.\n@c1@"
  es: "@a@b*: Este... se cuenta que hay un castillo de monstruos en algún lugar de la pampa de Ostro.\n@c1@"
  fr: "@a@b*ⓢ J'entends souvent dire qu'il y a un château rempli de monstres à l'intérieur des terres d'Ostro.\n@c1@"
  it: "@a@b*: La gente dice che, da qualche parte nel territorio di Ostryo, un castello infestato da mostri c'è.\n@c1@"
  ja: "@a@b＊「この島の奥地には\n\t魔物たちの城が　あるそうです。\n@c1@"
"10":
  de: "@a@b*: Natürlich war keiner so meschugge und ist hingegangen, um rauszufinden, ob da was Wahres dran ist.\n@c1@"
  en: "@a@b*: No one's been enough of a galah to go an' find out if that's true or not, though. Ha ha!\n@c1@"
  es: "@a@b*: Pero nadie tuvo los arrestos de ir a ver si es cierto o no. ¡Ja, ja!\n@c1@"
  fr: "@a@b*ⓢ Ceci dit, personne n'a été suffisamment fou pour voir si c'était vrai ou faux. Ha ha haⓠ\n@c1@"
  it: "@a@b*: Però nessuno ebbe il fegato di andare a vedere se vero iè. Ah! Ah! Ah!\n@c1@"
  ja: "@a@b＊「しかし　それを確かめに行った人は\n\t誰ひとり　帰ってはきません……。\n@c1@"
"11":
  de: "@a@b*: Na so was! Ich hätt nicht gedacht, dass mich jemand hier findet.\n@c2@"
  en: "@a@b*: I'll be stuffed!\nI didn't think anyone'd find me here.\n@c2@"
  es: "@a@b*: ¡La pucha!\nJamás pensé que nadie fuese a encontrarme aquí.\n@c2@"
  fr: "@a@b*ⓢ Bon sang d'boisⓠ\nJe pensais pas qu'on me trouverait ici.\n@c2@"
  it: "@a@b*: Mizzica!\nE chi si penzava ca quarchidunu potia trovarmi cà.\n@c2@"
  ja: "@a@b＊「ややっ！\n\tこの釣り場が\n\t見つかってしまうとは！\n@c2@"
"12":
  de: "@a@b*: Das hier ist mein geheimer Angelplatz, wisst Ihr, und das soll auch so bleiben. Also, erzählt es niemandem, einverstanden?\n@c2@"
  en: "@a@b*: This is me secret fishin' spot, see, an' I'd like to keep it that way. Don't tell anyone, roit?\n@c2@"
  es: "@a@b*: Este es mi lugar secreto de pesca, y quisiera que siguiese siendo secreto, viste. No se lo %H860%Xdigas%Ydigan%Z a nadie, ¿OK?\n@c2@"
  fr: "@a@b*ⓢ Y'a que moi qui connais ce coin de pêche et j'aimerais autant que personne soit au courant.\nVous direz rien, heinⓡ\n@c2@"
  it: "@a@b*: Chistu iè 'u postu segretu mio pe' piscari e vurrìa ca restassi accussì. M'arraccumannu, nisciunu l'avi a sapiri!\n@c2@"
  ja: "@a@b＊「ここは　ワシだけの穴場なんじゃ。\n\tどうか　ないしょにしてくだされ。\n@c2@"
"13":
  de: "@a@b%0%a00120 liest das Schild.\n@c0@"
  en: "@a@b%0%a00120 reads the sign.\n@c0@"
  es: "@a@b%0%a00120 lee el cartel.\n@c0@"
  fr: "@a@b%0%a00120 lit l'écriteau.\n@c0@"
  it: "@a@b%0%a00120 legge il cartello.\n@c0@"
  ja: "@a@b%a00120は　立て札を　読んだ。\n@c0@"
"14":
  de: "@a@bⓞSüdlich von hier thront der Koloss.ⓟ\n@c0@"
  en: "@a@bⓗSouth of here is the Colossus statue, mate.ⓘ\n@c0@"
  es: "@a@b''Este... al sur de aquí está la estatua del Coloso, viste.''\n@c0@"
  fr: "@a@bⓥLa statue du Colosse se trouve au sud.ⓦ \n@c0@"
  it: "@a@bⓕA sud di qua, la statua del Colosso c'è.ⓖ\n@c0@"
  ja: "@a@bこれより南に進むと　魔神像。\n@c0@"
"15":
  de: "@a@b*: Der Kerl dort am anderen Ufer ist wirklich verrückt. Er versucht doch tatsächlich, so eine alte Flugmaschine zu bauen.\n@c3@"
  en: "@a@b*: The bloke on the opposite bank is a real dag. He's tryin' to build one o' them old flyin' machines.\n@c3@"
  es: "@a@b*: El flaco de la otra orilla es un tipo bien raro, viste. Este... está intentando construir una de esas antiguas máquinas voladoras.\n@c3@"
  fr: "@a@b*ⓢ Le gars sur l'autre rive est complètement fêlé.\nIl essaie de construire une de ces vieilles machines volantes.\n@c3@"
  it: "@a@b*: Chiddu ca si trova dall'altro latu du fiumi è 'nu pazzo. Vuli costruiri una 'i chiddi vecchi machini volanti.\n@c3@"
  ja: "@a@b＊「対岸に住む　学者先生は\n\t大昔にあった　空飛ぶ乗り物を\n\t作ろうとしてるんだってよ。\n@c3@"
"16":
  de: "@a@b*: Ich weiß nich'. So einfach scheint das nicht zu sein. Er ist wirklich verrückt.\n@c3@"
  en: "@a@b*: I dunno, though. It don't sound all that easy to me. I reckon he's a bit of a whacker.\n@c3@"
  es: "@a@b*: Pero, no sé. No me parece que sea cosa fácil. Para mí que se le fue la cabeza.\n@c3@"
  fr: "@a@b*ⓢ J'sais pas. En même temps, ça a pas l'air facile.\nIl doit être assez fortiche.\n@c3@"
  it: "@a@b*: Io non sacciu, a mmia non mi pari 'na cosa fattibile. Pe' mmia, chiddu non capisci nenti.\n@c3@"
  ja: "@a@b＊「だけど　ホントに\n\tそんなモン　できるのかねえ？\n\tオレには　信じられないよ。\n@c3@"
"17":
  de: "@a@b*: Ich schlafe nicht bei der Arbeit.\nIch doch nicht.\n@c2@"
  en: "@a@b*: I ain't sleepin' on the job, mate.\nNo, not me.\n@c2@"
  es: "@a@b*: Yo no duermo en el laburo, viste.\nEste... no, seguro que no.\n@c2@"
  fr: "@a@b*ⓢ Je ne rechigne pas à la tâche.\nAh ça non, pas moi.\n@c2@"
  it: "@a@b*: Pe' mmia 'u travagghiu è sacro.\n@c2@"
  ja: "@a@b＊「し　仕事中に\n\t寝たりなんかしてませんよ！\n@c2@"
"18":
  de: "@a@b*: Ihr bereist also die Welt, ja? Warum seht Ihr Euch nicht mal meine Flugmaschine hier an?\n@c2@"
  en: "@a@b*: Travellin' 'round the world, are ya?\nHow'd you like to stump up for me flyin' machine to help you on your way then?\n@c2@"
  es: "@a@b*: Viajando por el mundo, ¿verdad?\n¿Y no querés comprarme la máquina voladora? %H860%XTe%YLes%Z sería muy útil en %H860%Xtus%Ysus%Z viajes.\n@c2@"
  fr: "@a@b*ⓢ Vous faites le tour du monde, c'est çaⓡ\nÇa vous dirait pas de m'acheter ma machine volanteⓡ Vous iriez plus vite.\n@c2@"
  it: "@a@b*: %H860%XVai%YAndate%Z in giru pi 'u munnu, ah?\n%H860%XVoi%YVoliti%Z provari 'a machina volante mia pi' annari più in fretta?\n@c2@"
  ja: "@a@b＊「ほほう　世界中を旅してると？\n\tでは　私が作った　空飛ぶ乗り物を\n\tお売りしましょうか？\n@c2@"
"19":
  de: "@a@b*: Da gibt es nur ein kleines Problem...\nSie ist noch nicht fertig.\n@c2@"
  en: "@a@b*: There's only one slight problem...\nIt ain't finished yet.\n@c2@"
  es: "@a@b*: Solo hay un pequeño problema...\nEste... no la terminé aún.\n@c2@"
  fr: "@a@b*ⓢ Y'a juste un petit problème...\nElle est pas finie.\n@c2@"
  it: "@a@b*: Ma c'è 'nu picculu problema...\nNo l'aiu ancora fernita.\n@c2@"
  ja: "@a@b＊「……と言いたいところなんですが\n\tじつは　まだ　研究段階で\n\t完成してないんです。\n@c2@"
"20":
  de: "@a@b*: Ich brauche ein Gas, das leichter ist als Luft, und dann würde sie fliegen, schätze ich.\n@c2@"
  en: "@a@b*: All I need is a gas that's lighter than air, though, and then I reckon she'll fly.\n@c2@"
  es: "@a@b*: Solo necesito un gas que sea más ligero que el aire, y entonces va a volar, creo, viste.\n@c2@"
  fr: "@a@b*ⓢ Si j'arrivais à trouver un gaz plus léger que l'air, je suis sûr que je pourrais la faire voler.\n@c2@"
  it: "@a@b*: Mi serve 'nu gas più leggero dell'aria. Solo così riuscirà a vulari.\n@c2@"
  ja: "@a@b＊「空気より　軽いガスがあれば\n\t飛べるはずなのですが……。\n@c2@"
"21":
  de: "@a@b*: Vielleicht könnte ich mal einen Blick in die Flasche werfen, die Ihr da habt. Zeigt Ihr sie mir?\n@c2@"
  en: "@a@b*: Hey! Maybe I could take a squizz at that canister you got there. Will you show it to me, mate?\n@c2@"
  es: "@a@b*: ¡Eh! Quizás podría tomar un poco de ese recipiente de gas que llevás ahí. ¿Me lo enseñás%H860%X%A120%X, pibe%Z%Z%B120%X?%Y?%Z\n@c2@"
  fr: "@a@b*ⓢ Ehⓠ Je devrais peut-être jeter un œil à cette bonbonne que vous transportez.\nJe peux regarderⓡ\n@c2@"
  it: "@a@b*: Miiiii! Pozzu dari 'na taliata alla bombola ca %H860%Xtieni%Ytenete%Z là?\n@c2@"
  ja: "@a@b＊「おや？\n\tあなたの持ってる　その奇妙なツボ\n\t少し　見せてくれませんか？\n@c2@"
"22":
  de: "@a@b*: Na, so was! Guck sich das einer an! Wenn ich die Flasche öffne, strömt eine Art Gas heraus!\n@c2@"
  en: "@a@b*: You beauty! Check this out! When I open up the canister a little, out sprays some kinda gas!\n@c2@"
  es: "@a@b*: ¡Che! ¡%H860%XFijate%YFíjense%Z en esto! ¡Cuando abro el recipiente un poco, sale una especie de gas a presión!\n@c2@"
  fr: "@a@b*ⓢ Magnifiqueⓠ Regardez çaⓠ\nQuand je l'ouvre, un peu de gaz s'échappeⓠ\n@c2@"
  it: "@a@b*: Bedda matri! Si apru 'nu pocu a bombola, nesci fora 'na speci 'i gas!\n@c2@"
  ja: "@a@b＊「うわわっ！\n\t開けたら　ツボの中から\n\tガスが　ふき出してきた！\n@c2@"
"23":
  de: "@a@b*: Ich nehme nicht an, dass...\n@c2@"
  en: "@a@b*: I don't suppose...\n@c2@"
  es: "@a@b*: No será...\n@c2@"
  fr: "@a@b*ⓢ Si j'osais...\n@c2@"
  it: "@a@b*: Non lo saccio...\n@c2@"
  ja: "@a@b＊「も　もしかして　これは……。\n@c2@"
"24":
  de: "@a@b*: Wisst Ihr, ich wär Euch wirklich sehr dankbar, wenn ich das behalten könnte. Was meint Ihr?\n@c2@"
  en: "@a@b*: You know, I'd be really rapt if you'd let me have this. Whaddya reckon?\n@c2@"
  es: "@a@b*: %H860%XSabés%YSaben%Z, me sentiría muy agradecido si %H860%Xpudieras%Ypudieran%Z dármelo. ¿Qué %H860%Xdecís%Ydicen%Z?\n@c2@"
  fr: "@a@b*ⓢ Enfin... ce serait vraiment fabuleux si vous acceptiez de me la donner.\nVous en dites quoiⓡ\n@c2@"
  it: "@a@b*: Si %H860%Xtu mi dessi quest'affare, mi faresti%Yvoi mi deste quest'affare, mi fareste%Z 'na grossa cortesia. Allora, ca mi %H860%Xdici%Ydite%Z, ah?\n@c2@"
  ja: "@a@b＊「お願いです。\n\tこのツボを　ゆずってくれませんか？\n@c2@"
"25":
  de: "@a@b*: Das gibt's ja gar nicht! Das werdet Ihr nicht bereuen, ich versprech's Euch. Kommt einfach morgen wieder zu mir.\n@c2@"
  en: "@a@b*: You little ripper!\nYou won't regret this, I promise.\nJust come back an' see me tomorrow, eh?\n@c2@"
  es: "@a@b*: ¡Bárbaro, %H860%X%A120%Xflaco%Z%B120%Xflaca%Z%Y%R000%Xflacas%Yflacos%Z%Z!\n¡No %H860%Xte vas a arrepentir%Yse van a arrepentir%Z!, lo prometo.\n%H860%XVolvé%YVuelvan%Z a verme mañana, ¿de acuerdo?\n@c2@"
  fr: "@a@b*ⓢ Merci du fond du cœurⓠ\nVous le regretterez pas, c'est moi qui vous le dis.\nRevenez me voir demain, d'accordⓡ\n@c2@"
  it: "@a@b*: Miiiii! Peffetto iè!\nNon %H860%Xti pentirai, la mia parola d'onore hai%Yvi pentirete, la mia parola d'onore avete%Z.\nCi vidimu domani, capito?\n@c2@"
  ja: "@a@b＊「ありがとうございます！\n\tお礼といっては　なんですが\n\t明日　ウチまで来てください。\n@c2@"
"26":
  de: "@a@b*: Dann werd ich Euch hoffentlich reich belohnen können für Euer großzügiges Geschenk.\n@c2@"
  en: "@a@b*: Hopefully I'll have a pretty spiffy present for ya by way of thanks.\n@c2@"
  es: "@a@b*: Este... con un poco de suerte %H860%Xle%Yles%Z podré dar las gracias con un lindo regalito, viste.\n@c2@"
  fr: "@a@b*ⓢ Avec un peu de chance, j'aurai un cadeau digne de ce nom à vous offrir pour vous remercier.\n@c2@"
  it: "@a@b*: Si tuttu vaci come previsto, domani %H860%Xavrai%Yavrete%Z 'na bedda sorpresa.\n@c2@"
  ja: "@a@b＊「きっと　すばらしいものを\n\tプレゼントできると　思いますよ！\n@c2@"
"27":
  de: "@a@b*: Ach, nun kommt schon!\nFür die Wissenschaft und so.\n@c2@"
  en: "@a@b*: Ah, go on, mate!\nIn the name o' science an' all that.\n@c2@"
  es: "@a@b*: ¡Adelante, %H860%X%A120%Xpibe%Z%B120%Xflaca%Z%Y%R000%Xflacas%Ypibes%Z%Z!\nEste... en nombre de la ciencia y todo eso.\n@c2@"
  fr: "@a@b*ⓢ Oh, allez quoiⓠ\nAu nom de la science et tout ça...\n@c2@"
  it: "@a@b*: Ah, lo chiedo pe' piacere %H860%Xa tia%Ya vossia%Z!\nNel nome della scienza!\n@c2@"
  ja: "@a@b＊「そこを　なんとか！\n\tお願いします。\n\tわたしの研究のために……。\n@c2@"
"28":
  de: "@a@b*: Mann, oh Mann! Manche Leute sind so stur, das ist einfach nicht zu glauben!\n@c2@"
  en: "@a@b*: Strewth! Some people are so stubborn, it makes me as cross as a frog in a sock!\n@c2@"
  es: "@a@b*: ¡Qué quilombo! ¡Este... la testarudez de alguna gente me pone más nervioso que milanesa de boliche!\n@c2@"
  fr: "@a@b*ⓢ Pfffⓠ Y'a vraiment des gens qui sont bornés...\nÇa a le don de me mettre en rogneⓠ\n@c2@"
  it: "@a@b*: Miiiii! Certa ggenti teni 'a capa così dura ca se sbatte 'a testa contro 'nu muru, 'u spacca!\n@c2@"
  ja: "@a@b＊「これほど　たのんでもダメですか。\n\tううっ…人でなし！\n@c2@"
"29":
  de: "@a@b*: Na, aber! Es tut Euch schon nicht weh, wenn ich's zu sehen bekomm, nich'? Also, Leute gibt's...\n@c2@"
