"31":
  de: "@a@b*: Das gibt's ja gar nicht! Das werdet Ihr nicht bereuen, ich versprech's Euch. Kommt einfach morgen wieder zu mir.\n@c2@"
  en: "@a@b*: You little ripper!\nYou won't regret this, I promise.\nJust come back an' see me tomorrow, eh?\n@c2@"
  es: "@a@b*: ¡Bárbaro, %H860%X%A120%Xflaco%Z%B120%Xflaca%Z%Y%R000%Xflacas%Yflacos%Z%Z! ¡No %H860%Xte vas a arrepentir%Yse van a arrepentir%Z!, lo prometo. %H860%XVolvé%YVuelvan%Z a verme mañana, ¿de acuerdo?\n@c2@"
  fr: "@a@b*ⓢ Merci du fond du cœurⓠ\nVous le regretterez pas, c'est moi qui vous le dis.\nRevenez me voir demain, d'accordⓡ\n@c2@"
  it: "@a@b*: Miiiii! Peffetto iè!\nNon %H860%Xti pentirai, la mia parola d'onore hai%Yvi pentirete, la mia parola d'onore avete%Z.\nCi vidimu domani, capito?\n@c2@"
