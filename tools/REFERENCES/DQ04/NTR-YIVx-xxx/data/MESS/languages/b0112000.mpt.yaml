  ja: "@a@b＊「ううっ。\n\t見せるくらい　いいじゃないですか。\n\t減るもんじゃなしに……。\n@c2@"
"30":
  de: "@a@b*: Ach, kommt schon! So schlimm ist das doch nicht. Gebt es mir doch, ja?\n@c2@"
