  en: "@a@b*: It is said that the Colossus catches the teardrops that fall from its eyes.\n@c2@"
  es: "@a@b*: Dicen que el Coloso atrapa las lágrimas que caen de sus ojos.\n@c2@"
  fr: "@a@b*ⓢ Il paraît que le Colosse rattrape les larmes qui coulent de ses yeux.\n@c2@"
  it: "@a@b*: Si dice che il Colosso raccolga le lacrime che cadono dai suoi stessi occhi.\n@c2@"
  ja: "@a@b＊「神は　みずからの涙を\n\tその手に　受けとめると\n\t言われています。\n@c2@"
