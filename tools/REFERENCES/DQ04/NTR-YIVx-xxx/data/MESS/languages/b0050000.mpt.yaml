"0":
  de: "@a@b*: Das ist der 'afen Havre Léon. Von 'ier aus fahren Schiffe nach Endor im Norden.\n@c2@"
  en: "@a@b*: Zis is ze port of Havre Léon. Ships from 'ere sail to Endor in ze north.\n@c2@"
  es: "@a@b*: Este es el puegrto de Havre Léon. De aquí salen bagrcos pagra Endogr, hacia el nogrte.\n@c2@"
  fr: "@a@b*ⓢ Vous êtes à Port Lionel. Les bateaux vont à Chandor, au nord.\n@c2@"
  it: "@a@b*: Questa è la darsena di Port Léon. Da qui le navi partono per Endor, a nord d'ici.\n@c2@"
  ja: "@a@b＊「ここは　港町ハバリア。\n\tエンドール行きの　船が出る町だ。\n@c2@"
"1":
  de: "@a@b*: Seit dieser neue Marquis an der Mascht ⓚⓛ ich meine, Macht ⓚⓛ ist, müssen alle Soldaten mit diesem dummen Accent, äh, Akzent sprechen.\n@c0@"
  en: "@a@b*: Ever since this new marquis regent came along, all zeⓚⓛ I mean, the...soldiers have to speak with zatⓚⓛ I mean, that...stupid accent.\n@c0@"
  es: "@a@b*: Desde que llegó el nuevo Marqués Regente, tout les, quiero decir, todos los, soldados tienen que hablagr, quiero decir, hablar... \n㈡\n*: ... con ese estúpido acento.\n@c0@"
  fr: "@a@b*ⓢ Depuis que le Lord Regent a pris le pouvoir, tous les soldiers... euh, les soldats doivent parler avec ce stupid... je veux dire, ce stupide accent.\n@c0@"
  it: "@a@b*: Da quando è arrivato il nuovo Marchese Reggente, tous les... cioè, tutti i soldati devono parler... voglio dire, devono parlare con quello stupido accento.\n@c0@"
  ja: "@a@b＊「キングレオの王さまが代わってから\n\t港の　取り締まりが\n\tきびしくなっちまってな。\n@c0@"
"2":
  de: "@a@b*: Außerdem hat er die Hafenkontrollen verschärft. Es ist fast unmöglich, an eine Bordkarte zu kommen.\n@c0@"
  en: "@a@b*: And he's tightened control of the port as well. It's hard to come by boarding passes these days.\n@c0@"
  es: "@a@b*: Y también ha reforzado el control del puerto. Ahora es muy difícil conseguir pasajes.\n@c0@"
  fr: "@a@b*ⓢ Il contrôle aussi tout le port.\nIl est de plus en plus difficile d'obtenir des permis d'embarquer.\n@c0@"
  it: "@a@b*: Ha anche aumentato la sorveglianza al porto. Di questi tempi, è molto difficile procurarsi un permesso d'imbarco.\n@c0@"
  ja: "@a@b＊「船に乗るための　乗船券が\n\tなかなか　手に入らないんだ。\n@c0@"
"3":
  de: "@a@b*: Wo ist Großvater hin? Es ist bald Essenszeit...\n@c1@"
  en: "@a@b*: Where's Grandad got to? It'll be dinner time soon...\n@c1@"
  es: "@a@b*: ¿Dónde se ha metido el abuelo? Va a ser la hora de cenar...\n@c1@"
  fr: "@a@b*ⓢ Où est passé papyⓡ\nÇa va bientôt être l'heure du dîner...\n@c1@"
  it: "@a@b*: Dove si è cacciato il nonno? Fra poco si cena...\n@c1@"
  ja: "@a@b＊「うちの　おじいちゃんったら\n\tどこに行ったのかしら。\n\tそろそろ　ごはんの時間なのに……。\n@c1@"
"4":
  de: "@a@b*: Aaah... Endor... Dort gibt es ein imposantes Kolosseum.\n@c2@"
  en: "@a@b*: Aaah...Endor... There's an enormous colosseum there, you know.\n@c2@"
  es: "@a@b*: Aaah... Endor... Allí hay un enorme coliseo, ¿lo %H860%Xsabías%Ysabíais%Z?\n@c2@"
  fr: "@a@b*ⓢ Aaah... Chandor... Il y a un très grand Colisée\nlà-bas, vous savez.\n@c2@"
  it: "@a@b*: Aaah... Endor... Lì c'è un'arena gigantesca.\n@c2@"
  ja: "@a@b＊「この海の向こう　エンドールには\n\t大きなコロシアムがあってのう……。\n@c2@"
"5":
  de: "@a@b*: Bin dort selbst mal angetreten. Jawohl, ich war ein ganz guter Kämpfer in meinen jungen Jahren. Aaah...\n@c2@"
  en: "@a@b*: I was a contestant once myself. Yes, I was quite a fighter in my younger years. Aaah...\n@c2@"
  es: "@a@b*: Yo fui una vez. Sí, cuando era joven era un auténtico luchador. Aaah...\n@c2@"
  fr: "@a@b*ⓢ J'ai participé au tournoi quand j'étais jeune.\nJ'étais plutôt doué, même. Aaah...\n@c2@"
  it: "@a@b*: Ci ho gareggiato anch'io. In gioventù ero un lottatore coi fiocchi. Ah, bei tempi...\n@c2@"
  ja: "@a@b＊「わしも　若い頃は\n\tそのコロシアムで　戦ったもんじゃ。\n\tあの頃が　なつかしいのう……。\n@c2@"
"6":
  de: "@a@b*: Ich bin verliebt! Ich bin in das schönste Mädchen der Welt verliebt! Und ich werde um ihre Hand anhalten!\n@c2@"
  en: "@a@b*: I'm in love! I'm in love with the most beautiful girl in the world! I'm goin' to make her my wife, I am!\n@c2@"
  es: "@a@b*: ¡Estoy enamorado! ¡Estoy enamorado de la joven más bella del mundo! ¡Voy a casarme con ella, ya %H860%Xverás%Yveréis%Z!\n@c2@"
  fr: "@a@b*ⓢ Je suis amoureuxⓠ Je suis amoureux de la plus belle fille du mondeⓠ Et je vais la marierⓠ\n@c2@"
  it: "@a@b*: Sono innamorato! Sono innamorato della più bella ragazza del mondo! E presto diventerà mia moglie!\n@c2@"
  ja: "@a@b＊「オラあ　好きなコができただ！\n\t絶対　ヨメっこにもらって帰るだ！\n@c2@"
"7":
  de: "@a@b*: Hm? Wer sie ist? Oh, wie peinlich, das zu sagen... Es ist... Nun ja, ihr Name ist Susi. Von der Schänke.\n@c2@"
  en: "@a@b*: Hm? Who is she?\nOh, no, I'm all embarrassed now! It's... Well, her name's Suzy. From the pub.\n@c2@"
  es: "@a@b*: ¿Mmm? ¿Que quién es ella?\n¡Oh, no, me muero de la vergüenza! Es... Bueno, se llama Susi. La de la taberna.\n@c2@"
  fr: "@a@b*ⓢ Mmmⓡ Qui c'estⓡ\nÇa me gêne un peu de vous le dire...\nC'est... Elle s'appelle Alison. Elle travaille au pub.\n@c2@"
  it: "@a@b*: Eh? Chi è?\nOh, no, non posso dirlo! Va bene... Si chiama Susanna, e lavora in un locale.\n@c2@"
  ja: "@a@b＊「どこのコかって？　カー！\n\t聞くなって　こっぱずかしい！\n\t酒場の　ジルってコだ。　ひゃー！\n@c2@"
"8":
  de: "@a@b*: Hallo! Ich bin Susi. Schön, dass %L000%Xihr bei mir vorbeischaut%Ydu bei mir vorbeischaust%Z. Hi hi hi!\n@c1@"
  en: "@a@b*: Hi! I'm Suzy.\nIt's very flattering that you're so eager to come ⓗchez moiⓘ. Tee hee hee!\n@c1@"
  es: "@a@b*: ¡Hola! Soy Susi.\nEs todo un halago que %H860%Xdesees%Ydeseéis%Z venir ''chez moi''. ¡Ji, ji!\n@c1@"
  fr: "@a@b*ⓢ Helloⓠ Je m'appelle Alison.\nC'est gentil de venir me voir. Hi hi hiⓠ\n@c1@"
  it: "@a@b*: Salve! Io sono Susanna.\nMi fa piacere che %H860%Xtu abbia%Yvoi abbiate%Z tanta voglia di venire ⓕchez moiⓖ. Eh! Eh! Eh!\n@c1@"
  ja: "@a@b＊「あたしは　ジル。\n\tこんな早くから　会いに来てくれて\n\tありがとう。\n@c1@"
"9":
  de: "@aSusi@bAber die Schänke macht erst heute Abend auf. Pardon!\n@c1@"
  en: "@aSuzy@bBut the pub doesn't open 'til the evening, I'm afraid. Pardon!\n@c1@"
  es: "@aSusi@bPero me temo que la taberna no abre hasta la noche. ¡Pardon!\n@c1@"
  fr: "@aAlison@bMais le pub n'ouvre que ce soir. Sorryⓠ\n@c1@"
  it: "@aSusanna@bIl locale però non apre fino a sera, mi spiace. Pardon!\n@c1@"
  ja: "@a@bジル「でも　酒場は夜からなの。\n\tごめんね。\n@c1@"
"10":
  de: "@a@b*: Es ist noch nicht offen. Hab noch was zu erledigen.\n@c2@"
  en: "@a@b*: Bar's not open yet.\nI'm still setting up.\n@c2@"
  es: "@a@b*: La taberna no está abierta todavía.\nEstoy preparándolo todo.\n@c2@"
  fr: "@a@b*ⓢ Le pub n'est pas encore ouvert.\nJe fais un peu de rangement.\n@c2@"
  it: "@a@b*: Il bar non è aperto.\nSto ancora sistemando delle cose.\n@c2@"
  ja: "@a@b＊「まだ　準備中なんです。\n\tすいませんね。\n@c2@"
"11":
  de: "@a@b*: Das ist das Gefängnis. Jeder, der den Marquis Régent verärgert, landet 'ier.\n@c2@"
  en: "@a@b*: Zis is ze jail. Anyone who betrays ze Marquis Régent ends up in 'ere sooner or later.\n@c2@"
  es: "@a@b*: Esta es la cágrcel. Tagrde o tempgrano, todo el que tgraiciona al Marquis Régent acaba con sus huesos aquí.\n@c2@"
  fr: "@a@b*ⓢ C'est la prison. Tous ceux qui trahissent le Lord Regent atterrissent ici tôt ou tard.\n@c2@"
  it: "@a@b*: Questa è la prison. Chiunque tradisca il Marchese Reggente prima o poi finisce qui.\n@c2@"
  ja: "@a@b＊「ここは　牢屋。\n\tキングレオの王さまに\n\t逆らった者たちが　入っている。\n@c2@"
"12":
  de: "@a@b*: Ich hab gar nichts Schlimmes gemacht. Das war bloß ein kleiner Scherz!\n@c2@"
  en: "@a@b*: Now listen 'ere. I ain't done nuffin' wrong! I was just 'avin' a larf, right.\n@c2@"
  es: "@a@b*: Ahogra %H860%Xpgresta%Ypgrestad%Z atención. ¡Moi no he hecho nada malo! Solo estaba pasando un buen grato.\n@c2@"
  fr: "@a@b*ⓢ Écoutez-moiⓠ J'ai rien fait de malⓠ Je voulais juste m'amuser.\n@c2@"
  it: "@a@b*: %H860%XSturati%YSturatevi%Z le orecchie! Non ho fatto un bel niente! Volevo solo scherzare!\n@c2@"
  ja: "@a@b＊「聞いてください！\n\tわたしは　なんにも\n\t悪いことは　してないんです。\n@c2@"
"13":
  de: "@a@b*: Wollt ja keinem weh tun. Hab nur ein Pulverfass unter das Fenster von diesem Kanzler gestellt, das ist alles...\n@c2@"
  en: "@a@b*: I weren't tryin' to 'urt no one. I just set off a keg o' gunpowder outside that Chancellor geezer's room, that's all...\n@c2@"
  es: "@a@b*: No quegría hacegr daño a nadie. Lo único que hice fue ponegr un bagrril de pólvogra junto a la puegrta del viejo Cancillegr.\n@c2@"
  fr: "@a@b*ⓢ J'ai seulement fait sauter une jarre de poudre à côté des appartements de ce vieux crabe de chancelier, c'est tout...\n@c2@"
  it: "@a@b*: Non volevo far male a nessuno. Ho solo messo un barile di polvere da sparo fuori dalla porta della stanza di quel tizio, il Cancelliere. Che c'è di male?\n@c2@"
  ja: "@a@b＊「ただ　ちょっと　まちがえて\n\tお城の　大臣の部屋のそばで\n\t火薬を　爆発させてしまって……。\n@c2@"
"14":
  de: "@a@b*: Wo ich das Schießpulver her hab? He he. Hab's in der Mamonmine westlich von hier gefunden.\n@c2@"
  en: "@a@b*: Where d'ya get gunpowder from? Heh heh.\nFound it down that Mamon Mine west of 'ere,\ndidn't I.\n@c2@"
  es: "@a@b*: ¿Que dónde se consigue pólvogra? Je, je.\nLa encontgré en la Mina de Mammon, al este de aquí.\n@c2@"
  fr: "@a@b*ⓢ Où j'ai récupéré la poudreⓡ Hé hé.\nJe l'ai trouvée dans la mine d'Alpion, à l'ouest.\n@c2@"
  it: "@a@b*: Dove ho preso la polvere da sparo? Eh! Eh! Eh!\nL'ho trovata nella miniera di Mamon, a ovest.\n@c2@"
  ja: "@a@b＊「火薬ですか？　私は昔\n\t西の　アッテムト鉱山にいたもので\n\tそのとき　手に入れたものです。\n@c2@"
"15":
  de: "@a@b*: Uwaaahhh! Uwaaahhh!\n@c2@"
  en: "@a@b*: Uwaaargh! Uwaaargh!\n@c2@"
  es: "@a@b*: ¡Aaaargh! ¡Aaaargh!\n@c2@"
  fr: "@a@b*ⓢ Waaarghⓠ Waaarghⓠ\n@c2@"
  it: "@a@b*: Uaaargh! Uaaargh!\n@c2@"
  ja: "@a@b＊「うおーん　うおーん。\n@c2@"
"16":
  de: "@a@b*: %L000%XHabt ihr%YHast du%Z eine Bordkarte? Ohne darf man nicht aufs Schiff. Tut mir leid. Ich kann keine Ausnahmen machen!\n@c0@"
  en: "@a@b*: Have you got a boarding pass? You can't board the ship without one.\nSorry. No exceptions!\n@c0@"
  es: "@a@b*: ¿%H860%XTiene%YTienen%Z un pasaje? No se puede subir al barco sin un pasaje.\nLo siento. ¡No hay excepciones!\n@c0@"
  fr: "@a@b*ⓢ Vous avez un permis d'embarquerⓡ Vous ne pouvez pas monter dans le bateau sans ce permis. Désolé. Aucune exceptionⓠ\n@c0@"
  it: "@a@b*: %H860%XHai%YAvete%Z il permesso d'imbarco? Nessuno può salire a bordo senza. Mi spiace. Nessuna eccezione!\n@c0@"
  ja: "@a@b＊「乗船券を持っているかい？\n\t持ってねえなら　乗せるわけには\n\tいかねえ。　出直してきな！\n@c0@"
"17":
  de: "@a@b*: Hier war Großvater also die ganze Zeit.\n@c1@"
  en: "@a@b*: So this is where Grandad's been all this time.\n@c1@"
  es: "@a@b*: Así que aquí es donde ha estado el abuelo todo este tiempo.\n@c1@"
  fr: "@a@b*ⓢ Alors c'est là que papy était caché tout ce temps.\n@c1@"
  it: "@a@b*: Ecco dov'è stato il nonno tutto questo tempo.\n@c1@"
  ja: "@a@b＊「おじいちゃんたら\n\tまた　ここに来てたのね。\n@c1@"
"18":
  de: "@a@b*: Warum er Endor wohl so vermisst? Von hier aus kann man es noch nicht mal sehen.\n@c1@"
  en: "@a@b*: I wonder why he misses Endor so much. You can't even see the place from here, either.\n@c1@"
  es: "@a@b*: Me pregunto por qué echa tanto de menos Endor. Ni siquiera se puede ver ese lugar desde aquí.\n@c1@"
  fr: "@a@b*ⓢ Je me demande pourquoi Chandor lui manque tant.\nEn plus, on ne voit même pas la ville d'ici.\n@c1@"
  it: "@a@b*: Chissà perché Endor gli manca così tanto. Non si riesce neanche a vederla, da qui.\n@c1@"
  ja: "@a@b＊「そんなに　エンドールの国が\n\tなつかしいのかしら。\n\tここからじゃ見えやしないのに……。\n@c1@"
"19":
  de: "@a@b*: Ha-püh... Ha-püh...\n@c2@"
  en: "@a@b*: Ah-phew... Ah-phew...\n@c2@"
  es: "@a@b*: Ah-fiuuu... Ah-fiuuu...\n@c2@"
  fr: "@a@b*ⓢ Ron-pfff... Ron-pfff...\n@c2@"
  it: "@a@b*: Ronf... Ronf...\n@c2@"
  ja: "@a@b＊「ぐうぐう……。\n@c2@"
"20":
  de: "@a@b*: %L000%XSeid ihr%YBist du%Z denn von allen guten Geistern verlassen?! Um diese Uhrzeit legen doch keine Schiffe mehr ab!\n@c2@"
  en: "@a@b*: You %O969%Xempty-headed animal food trough wiper%Ystupid %L000%Xwomen%Ywoman%Z%Z! Zere are no ships departing at such a late hour as zis!\n@c2@"
  es: "@a@b*: %H860%X¡Tú, comedegro pagra animales cabeza hueca%Y¡Comedegros pagra animales cabezas huecas%Z! ¡No hay bagrcos que zagrpen a estas hogras de la noche!\n@c2@"
  fr: "@a@b*ⓢ Espèce %O969%Xde sombre idiot%Y%L000%Xde sombres idiotes%Yde sombre idiote%Z%Zⓠ Aucun navire ne part si tardⓠ\n@c2@"
  it: "@a@b*: %O969%XBrutta zucca vuota%YRazza di%L000%X oche%Y oca%Z%Z! A quest'ora non c'è più nessun bateau in partenza!\n@c2@"
  ja: "@a@b＊「こんな夜ふけに　船など出るものか！\n\t昼間　もう一度来るのだな。\n@c2@"
"21":
  de: "@a@b*: Jetzt haben nur noch die Leute Bordkarten, die sie sich vor der Herrschaft des neuen Marquis Régent besorgt haben.\n@c2@"
  en: "@a@b*: The only people with boarding passes now are the ones who got them before the reign of the new marquis regent.\n@c2@"
  es: "@a@b*: Los únicos que tienen pasajes son los que los consiguieron antes de que reinara el nuevo marqués.\n@c2@"
  fr: "@a@b*ⓢ Les seules personnes qui ont un permis d'embarquer sont celles qui l'ont obtenu avant la prise de pouvoir du nouveau Lord Regent.\n@c2@"
  it: "@a@b*: Le sole persone ad avere un permesso d'imbarco sono quelle che se lo sono procurato prima che il Marchese Reggente salisse al trono.\n@c2@"
  ja: "@a@b＊「今　乗船券を持っているのは\n\t王さまが代わる前に\n\t手に入れた人たち　ばかりです。\n@c2@"
"22":
  de: "@a@b*: Der Marquis ist so streng, dass es mich nicht wundern würde, wenn dieses Schiff das letzte wäre, das diesen Hafen verlässt...\n@c2@"
  en: "@a@b*: In fact, he's so strict, I wouldn't be surprised if the next ship to set sail is the last one...ever.\n@c2@"
  es: "@a@b*: De hecho, es tan estricto que no me sorprendería que el próximo barco fuera el último en zarpar... jamás.\n@c2@"
  fr: "@a@b*ⓢ En fait, il est si intraitable que ça ne m'étonnerait pas que le prochain bateau à partir ne soit... le dernier.\n@c2@"
  it: "@a@b*: A dirla tutta, severo com'è, non mi sorprenderebbe se la prossima nave fosse l'ultima a cui darà il permesso di salpare da qui.\n@c2@"
  ja: "@a@b＊「新しい王さまは　とてもきびしく\n\tもしかすると　次に出る船が\n\t最後の船に　なるかもしれません。\n@c2@"
"23":
  de: "@a@b*: Ha-püh... Ha-püh...\n@c3@"
  en: "@a@b*: Ah-phew... Ah-phew...\n@c3@"
  es: "@a@b*: Ah-fiuuu... Ah-fiuuu...\n@c3@"
  fr: "@a@b*ⓢ Ron-pfff... Ron-pfff...\n@c3@"
  it: "@a@b*: Ronf... Ronf...\n@c3@"
  ja: "@a@b＊「ぐうぐう……。\n@c3@"
"24":
  de: "@a@b*: Hallo. Ich bin Liesl. Mein Vater... (schnief)\nMein Vater hat in der Mine gearbeitet.\n@c1@"
  en: "@a@b*: Hello. I'm Jill. My dad... (sniff) My dad used to work down the mine.\n@c1@"
  es: "@a@b*: Hola. Me llamo Heidi. Mi padre... (snif) Mi padre solía trabajar en la mina.\n@c1@"
  fr: "@a@b*ⓢ Bonjour. Je m'appelle Julie.\nMon père... (snif) Mon père travaillait à la mine.\n@c1@"
  it: "@a@b*: Ciao. Mi chiamo Nene. Mio padre... Sigh! Mio padre lavorava alla miniera...\n@c1@"
  ja: "@a@b＊「私の名前は　ルナ。\n\t私たちの父親は　この国の\n\t鉱山で　はたらいていました。\n@c1@"
"25":
  de: "@aLiesl@bAber jetzt ist er tot! Mein kleiner Bruder und ich wollten ihn besuchen, aber... (schluchz)\n@c1@"
  en: "@aJill@bBut now he's dead! Me and my little brother came to visit him, but... (sob)\n@c1@"
  es: "@aHeidi@b¡Pero está muerto! Yo y mi hermano pequeño vinimos a visitarlo, pero... (snif)\n@c1@"
  fr: "@aJulie@bMais il est mortⓠ Moi et mon petit frère, on était venus le voir, mais... (sanglots)\n@c1@"
  it: "@aNene@bMa ora è morto! Io e il mio fratellino siamo andati a trovarlo, ma... Sob!\n@c1@"
  ja: "@a@bルナ「せっかく　弟とふたりで\n\t父親に会いに来たのに　お父さんは\n\tもう死んでいたなんて……。\n@c1@"
"26":
  de: "@aLiesl@bWie soll ich das nur Karl beibringen?\n@c1@"
  en: "@aJill@bHow am I going to break it to Jack?\n@c1@"
  es: "@aHeidi@b¿Cómo se lo voy a contar a Marco?\n@c1@"
  fr: "@aJulie@bQu'est-ce que je vais dire à Jimⓡ\n@c1@"
  it: "@aNene@bCome faccio a dirlo a Giulio adesso?\n@c1@"
  ja: "@a@bルナ「ああっ　弟のピピンに\n\tなんて言えばいいの？　ううっ……。\n@c1@"
"27":
  de: "@aKarl@bZzz... Papa! Zzz... Ich bin's, Papa... Karl... Zzz...\n@c1@"
  en: "@aJack@bZzz... Daddy! Zzz...\nIt'zzz me, Daddy... Jack...\nZzz...\n@c1@"
  es: "@aMarco@bZzz... ¡Papá! Zzz...\nZzzoy yo, papá... Marco...\nZzz...\n@c1@"
  fr: "@aJim@bZzz... Papaⓠ Zzz...\nC'est... zzz... moi, papa... Jim...\nZzz...\n@c1@"
  it: "@aGiulio@bZzz... Papà! Zzz...\nSono io, papà... Giulio...\nZzz...\n@c1@"
  ja: "@a@bピピン「ぐうぐう……。\n\tパパ－！　ぼくだよ　ピピンだよ。\n\tむにゃむにゃ……。\n@c1@"
"28":
  de: "@a@b*: Hey! Warum dauert das so lang? Wo bleibt mein Getränk?!\n@c3@"
  en: "@a@b*: Hey! What's taking so long? Where's my drink!?\n@c3@"
  es: "@a@b*: ¡Eh! ¿Por qué tarda tanto? ¿Dónde está mi bebida?\n@c3@"
  fr: "@a@b*ⓢ Ehⓠ Et mon verreⓡ Ça vientⓡ\n@c3@"
  it: "@a@b*: Ehi! Ma quanto ci vuole per avere da bere in questo posto?!?\n@c3@"
  ja: "@a@b＊「おーい！\n\t酒はまだか！　酒は！\n@c3@"
"29":
  de: "@aSusi@bHallo! Ich bin Susi! %L000%XTanzt%YTanz%Z doch mit mir!\n@c1@"
  en: "@aSuzy@bHiya! I'm Suzy!\nCome on, dance with me!\n@c1@"
  es: "@aSusi@b¡Hola! ¡Soy Susi!\n¡Vamos, a bailagr conmigo!\n@c1@"
  fr: "@aAlison@bHelloⓠ Moi, c'est Alisonⓠ\nVenez danser avec moiⓠ\n@c1@"
  it: "@aSusanna@bSalve! Io sono Susanna!\nForza, %H860%Xvieni%Yvenite%Z a ballare con me!\n@c1@"
  ja: "@a@bジル「あたしは　ジル。\n\tさあ　あなたも　踊って踊って！\n@c1@"
"30":
  de: "@a@b*: Juchhu! Das macht Spaß!\n@c2@"
  en: "@a@b*: Wahey! This is the life!\n@c2@"
  es: "@a@b*: ¡Guauu! ¡Esto sí que es vida!\n@c2@"
  fr: "@a@b*ⓢ Ouaisⓠ C'est ça la vieⓠ\n@c2@"
  it: "@a@b*: Evvai! Questa sì che è vita!\n@c2@"
  ja: "@a@b＊「楽しいだなやー。\n\tあー　それ　それ！\n@c2@"
"31":
  de: "@a@b*: Habt Ihr vom Turnier von Endor gehört? Dort soll eine Prinzessin gewonnen haben!\n@c2@"
  en: "@a@b*: You know the Endor Tourney? I heard it was a princess of all people who won it, you know!\n@c2@"
  es: "@a@b*: ¿%H860%XHas%YHabéis%Z oído hablar del Torneo de Endor? Me han dicho que de todos los participantes, lo ganó una princesa, ¿lo %H860%Xsabías%Ysabíais%Z?\n@c2@"
  fr: "@a@b*ⓢ Vous connaissez le tournoi de Chandorⓡ\nIl paraît que c'est une princesse qui a gagnéⓠ\n@c2@"
  it: "@a@b*: %H860%XHai%YAvete%Z saputo cos'è successo al Torneo di Endor? Ho sentito che è stata una principessa a vincerlo!\n@c2@"
  ja: "@a@b＊「なんでも　エンドールで行われた\n\t武術大会では　どこかのお城の\n\tお姫さまが優勝したそうです。\n@c2@"
"32":
  de: "@a@b*: Und das war noch nicht alles... Als die Prinzessin nach dem Turnier nach Hause kam, war die Burg, in der sie lebte, menschenleer!\n@c2@"
  en: "@a@b*: And there's more... When the princess went home after the competition, she found the castle she lived in totally empty!\n@c2@"
  es: "@a@b*: Y todavía hay más... Cuando la princesa regresó a casa tras el combate, ¡encontró totalmente vacío el castillo donde vivía!\n@c2@"
  fr: "@a@b*ⓢ Le plus fou... c'est que quand elle est rentrée chez elle, après la compétition, son château était complètement videⓠ\n@c2@"
  it: "@a@b*: E non è finita qui... Quando la principessa è tornata a casa dopo il torneo, ha ritrovato il suo castello completamente vuoto!\n@c2@"
  ja: "@a@b＊「でも　そのお姫さまが試合のあと\n\t自分のお城に　帰ってみると\n\tお城は　もぬけのカラだったとか。\n@c2@"
"33":
  de: "@a@b*: Das ist doch recht seltsam, oder?\n@c2@"
  en: "@a@b*: It's a funny old world, isn't it?\n@c2@"
  es: "@a@b*: Es un mundo muy extraño, ¿verdad?\n@c2@"
  fr: "@a@b*ⓢ On vit dans un monde vraiment étrange, noⓡ\n@c2@"
  it: "@a@b*: Certo che ne succedono di cose strane, eh?\n@c2@"
  ja: "@a@b＊「不思議なことも　あるもんですなあ。\n@c2@"
"34":
  de: "@a@b*: Das war einst ein friedlisches Land. Der alte König war ein bon homme. Aber dann ist er plötzlisch gestorben.\n@c2@"
  en: "@a@b*: Zis was a peaceful land before. Ze old king was a good man. But 'e passed away most suddenly.\n@c2@"
  es: "@a@b*: Esta tiegrra egra muy pacífica antes. El viejo roi egra un buen hombgre. Pegro mugrió de grepente.\n@c2@"
  fr: "@a@b*ⓢ Avant, c'était un pays tranquille. Le roi ancien était un homme bien, mais il est mort suddendly.\n@c2@"
  it: "@a@b*: Prima questa terra era pacifica. Il vecchio Re era un uomo très gentil, ma è morto all'improvviso.\n@c2@"
  ja: "@a@b＊「ここキングレオは　平和な\n\t国だったのだが　前の王が\n\t突然　亡くなってしまってな。\n@c2@"
"35":
  de: "@a@b*: Sein Sohn ist ihm nischt auf den Thron gefolgt. Au contraire, er 'at ihn einem anderen Mann überlassen, der noch nischt mal blutsverwandt ist!\n@c2@"
  en: "@a@b*: 'Is son did not take ze throne 'imself. Au contraire, 'e gave ze carte blanche to another man. Not even a blood relation.\n@c2@"
  es: "@a@b*: Su hijo no pudo sucedegrle en el tgrono. Au contraire, le dio cagrta blanca a otgra pegrsona. Ni siquiegra egran pagrientes cagrnales.\n@c2@"
  fr: "@a@b*ⓢ Strangement, son fils n'est pas monté sur le throne. Au contrary, il a donné carte blanche à un autre homme. Même pas un parent à luiⓠ\n@c2@"
  it: "@a@b*: E suo figlio non gli è succeduto al trono. Au contraire, ha dato carte blanche a un perfetto estraneo.\n@c2@"
  ja: "@a@b＊「後つぎの息子は　自分が王にならず\n\t血のつながりのない男を\n\t新しい王に　任命してしまったのだ。\n@c2@"
"36":
  de: "@a@b*: Jetzt steht das Land vor einer Tragédie. Hm? Der Name des nouveau Marquis Régent? Bal-irgendwas, glaube isch.\n@c2@"
  en: "@a@b*: Now ze country is en route to ruin.\nHm? Ze name of ze new marquis régent? Bal-something, I think.\n@c2@"
  es: "@a@b*: Ahogra el país se digrige al abismo.\n¿Mmm? ¿El nombgre del nuevo Marquis Régent? Bal algo, cgreo.\n@c2@"
  fr: "@a@b*ⓢ Le pays court à sa perte.\nMmmⓡ Le nom du nouveau Lord Regentⓡ\nDick-je-sais-pas-quoi.\n@c2@"
  it: "@a@b*: E ora il nostro paese sta andando in malora. Come si chiama il nuovo Marchese Reggente? Bal... Uhm, Balzaqualcosa, mi pare.\n@c2@"
  ja: "@a@b＊「それ以来　この国は　荒れ放題さ。\n\tえっ？　新しい王の名前か？\n\tたしか　バル……なんとかだったな。\n@c2@"
"37":
  de: "@a@b*: Oh, isch bin überwältigt! Wie viel sie alle trinken wollen! Eine Bestellung nach der anderen!\n@c1@"
  en: "@a@b*: Oh, I am rushed off ze feet!\nLook 'ow much zey are all drinking! It's one order after another.\n@c1@"
  es: "@a@b*: ¡Oh, no puedo pagragr!\n¡Comó beben! ¡Es una detgrás de otgra!\n@c1@"
  fr: "@a@b*ⓢ Oh, je suis sur les rotulesⓠ\nCe sont des lourds buveurs.\nIls enchaînent les pintes.\n@c1@"
  it: "@a@b*: Oh, c'est pas possible!\nStanno bevendo come spugne! Un bicchiere dopo l'altro, incroyable.\n@c1@"
  ja: "@a@b＊「ああんっ　忙しいっ！\n\tみんな　すごく飲むから\n\t注文取りも大変だわ！\n@c1@"
"38":
  de: "@a@b*: Reinspaziert, nur reinspaziert! Zeit zum Trinken, Tanzen, Trinken, Singen, Trinken und Fröhlichsein!\n@c2@"
  en: "@a@b*: Come in, come in!\nDrink, dance, drink, sing, drink and be merry! That's the spirit!\n@c2@"
  es: "@a@b*: ¡%H860%XPasa, pasa!%YPasad, pasad!%Z\n¡Beber, bailar, beber, cantar, beber y ser felices! ¡Ese es el espíritu!\n@c2@"
  fr: "@a@b*ⓢ Venezⓠ Venezⓠ\nBuvez, dansez, buvez, chantez et buvez encoreⓠ Soyez heureuxⓠ C'est ça l'essentielⓠ\n@c2@"
  it: "@a@b*: %H860%XEntra%YEntrate%Z pure!\n%H860%XBalla, canta, bevi e divertiti%YBallate, cantate, bevete e divertitevi%Z! Così si fa!\n@c2@"
  ja: "@a@b＊「やあ　いらっしゃい　いらっしゃい！\n\t飲んで歌って　楽しい夜を！\n@c2@"
"39":
  de: "@a@b*: Extraordinaire! Diese Stillesphäre kann die Magie des Feindes zum Erlahmen bringen...\n@c2@"
  en: "@a@b*: Extraordinaire! Ze sphère de silence can seal away ze magic of ze enemy...\n@c2@"
  es: "@a@b*: ¡Extraordinaire! El ogrbe del silencio puede acabagr con la magia del enemigo...\n@c2@"
  fr: "@a@b*ⓢ Incrédibleⓠ La sphère du Silence peut contenir la magic de l'ennemi... \n@c2@"
  it: "@a@b*: Extraordinaire! La Sfera del silenzio riesce a bloccare la magia dei nemici...\n@c2@"
  ja: "@a@b＊「静寂の玉を使えば　敵の魔法を\n\t封じ込めてしまえるそうじゃ。\n@c2@"
"40":
  de: "@aSchwester Esther@bDas ist die Prophètisserie. Eine Schrein für die Göttin, an dem wir Ihren Prophezeiungen lauschen können.\n@c1@"
  en: "@aNun the Wiser@bZis is ze prophètisserie.\nA shrine of ze Goddess, where we can listen to 'Er prophecies.\n@c1@"
  es: "@aSor Sabionde@bEsta es la prophètisserie.\nUn santuagrio dedicado a la Diosa, donde podegr escuchagr sus pgrofecías.\n@c1@"
  fr: "@aNonne Obstante@bVous êtes à la Prophétissery.\nIl s'agit du temple de la Déesse où vous pouvez entendre ses prophéties.\n@c1@"
  it: "@aSuor Sagesse@bVoilà l'Oracoleria.\nIl tempio della dea, nel quale possiamo ascoltare le sue profezie.\n@c1@"
  ja: "@a@b＊「ここは　お告げ所。\n\t神のお告げがくだる　聖なるほこら。\n@c1@"
"41":
  de: "@aSchwester Esther@bMina. Du bist doch Wahrsagerin. Du weißt es schon, peut-être...\n@c1@"
  en: "@aNun the Wiser@bMeena. You are ze fortune-teller. Per'aps you already know...\n@c1@"
  es: "@aSor Sabionde@bMeena. Tú egres adivina. Puede que ya lo sepas...\n@c1@"
  fr: "@aNonne Obstante@bMina, vous êtes diseuse de bonne aventure.\nPeut-être savez-vous déjà...\n@c1@"
  it: "@aSuor Sagesse@bMyra. Tu sei una clairvoyante, forse lo sai già... \n@c1@"
  ja: "@a@b＊「占い師ミネアよ。\n\tあなたには　すでに見えるでしょう。\n@c1@"
"42":
  de: "@aSchwester Esther@bDer Mann, an dem %H860%Xdu dich rächen willst%Yihr euch rächen wollt%Z, wird von einer einflussreichen dunklen Macht bewacht.\n@c1@"
  en: "@aNun the Wiser@bZe man you wish to take vengeance upon is guarded by a dark force most powerful.\n@c1@"
  es: "@aSor Sabionde@bEl hombgre del que %L000%Xdeseáis vengaros%Ydeseas vengagrte%Z está pgrotegido pogr una oscugra fuegrza de gran podegr.\n@c1@"
  fr: "@aNonne Obstante@bL'homme contre lequel vous voulez vous venger est protégé par une force des ténèbres very puissante.\n@c1@"
  it: "@aSuor Sagesse@bL'uomo di cui %H860%Xti vuoi%Yvi volete%Z vendicare viene protetto da una forza très puissante.\n@c1@"
  ja: "@a@b＊「あなたがたが　カタキとねらう男は\n\t巨大な　暗黒のチカラによって\n\tまもられています。\n@c1@"
"43":
  de: "@aSchwester Esther@bAber %H860%Xgib nischt auf, mein Kind%Ygebt nischt auf, meine Kinder%Z. Es gibt 'offnung.\n@c1@"
  en: "@aNun the Wiser@bBut do not despair, my %H860%Xchild%Ychildren%Z. Zere is 'ope.\n@c1@"
  es: "@aSor Sabionde@bPero, no %H860%Xdesespegres cgriatugra%Ydesespegréis cgriatugras%Z. Hay espegranza.\n@c1@"
  fr: "@aNonne Obstante@bNe désespérez pas, %H860%Xmon enfant%Ymes enfants%Z. Il y a de l'espoir.\n@c1@"
  it: "@aSuor Sagesse@bPas de problème, %H860%Xma petite%Ymes enfants%Z. C'è ancora una speranza.\n@c1@"
  ja: "@a@b＊「しかし　案ずることはありません。\n\t私には　見えるのです。\n@c1@"
"44":
  de: "@aSchwester Esther@bAuch %H860%Xdu wirst%Yihr werdet%Z von einer Macht begleitet. Der Macht des Lichts...\n@c1@"
  en: "@aNun the Wiser@bZere is a force guarding you also. A force of light...\n@c1@"
  es: "@aSor Sabionde@bExiste una fuegrza que %H860%Xte%Yos%Z pgrotege. Una fuegrza luminosa...\n@c1@"
  fr: "@aNonne Obstante@bUne force vous garde, vous aussi.\nUne force bienveillante...\n@c1@"
  it: "@aSuor Sagesse@bC'è una forza che protegge anche %H860%Xte%Yvoi%Z. Una forza di luce...\n@c1@"
  ja: "@a@b＊「あなたがたも　また\n\t光りかがやく　チカラによって\n\tまもられているのが……。\n@c1@"
"45":
  de: "@aSchwester Esther@bMaintenant, es ist bloß eine kleine Schimmer. Aber mit der Hilfe der Göttin wird es eines Tages eine force majeure sein.\n@c1@"
  en: "@aNun the Wiser@bIt is no more zan a soupçon now. But wiz ze guidance and nurture of ze Goddess, it will one day be as ze force majeure.\n@c1@"
  es: "@aSor Sabionde@bPogr ahogra no es más que una conjetugra. Pegro con la pgrovidencia y el aliento de la Diosa, un día se convegrtigrá en la fuegrza dominante.\n@c1@"
  fr: "@aNonne Obstante@bElle est très little pour le moment. Mais avec les conseils et les soins de la Déesse, elle va prendre de l'ampleur.\n@c1@"
  it: "@aSuor Sagesse@bPer ora è molto debole, ma con l'aiuto e la protezione della Dea, un giorno diventerà una forza irresistibile.\n@c1@"
  ja: "@a@b＊「今は　か細く小さな光ですが\n\tいくつもいくつも　みちびかれ\n\tやがて　大きなチカラとなるでしょう。\n@c1@"
"46":
  de: "@aSchwester Esther@bEs gibt keinen Grund zur Eile. Erst wenn %H860%Xdu auf dem Pfad der Hoffnungslosigkeit wandelst%Yihr auf dem Pfad der Hoffnungslosigkeit wandelt%Z...\n@c1@"
  en: "@aNun the Wiser@bYou must not 'urry. Only when you find %H860%Xyourself%Yyourselves%Z lost on ze path of despair...\n@c1@"
  es: "@aSor Sabionde@bNo %H860%Xdebes%Ydebéis%Z tenegr pgrisa. Solo cuando %L000%Xos encontgréis pegrdidas%Y te encuentgres pegrdida%Z en una senda de desespegración...\n@c1@"
  fr: "@aNonne Obstante@bVous ne devez pas être pressé%H860%X%A120%X%Z%B120%Xe%Z%Y%R000%Xes%Ys%Z%Z. C'est uniquement quand vous serez perdu%H860%X%A120%X%Z%B120%Xe%Z%Y%R000%Xes%Ys%Z%Z sur le chemin du despair...\n@c1@"
  it: "@aSuor Sagesse@b%H860%XDai%YDate%Z tempo al tempo. Quando %H860%Xti perderai%Yvi perderete%Z sul sentiero della disperazione...\n@c1@"
  ja: "@a@b＊「あせっては　いけません。\n\tあなたがたが　絶望の道に迷った\n\tそのときこそ……\n@c1@"
"47":
  de: "@aSchwester Esther@bErst dann beginnt %H860%Xdeine%Yeure%Z wahre Reise!\n@c1@"
  en: "@aNun the Wiser@bOnly zen will your true journey commence!\n@c1@"
  es: "@aSor Sabionde@b¡Solo entonces habgrá comenzado %H860%Xtu%Yvuestro%Z viaje!\n@c1@"
  fr: "@aNonne Obstante@b... que votre voyage commencera vraimentⓠ\n@c1@"
  it: "@aSuor Sagesse@bQuello sarà il vero inizio del %H860%Xtuo%Yvostro%Z voyage!\n@c1@"
  ja: "@a@b＊「あなたがたの旅が　始まるのです。\n@c1@"
