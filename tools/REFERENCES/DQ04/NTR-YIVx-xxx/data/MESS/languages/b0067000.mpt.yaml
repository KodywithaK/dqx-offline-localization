"0":
  de: "@a@b*: Dies ist der Trans-Montana-Tunnel, der Endor im Westen mit Casabranca im Osten verbindet.\n@c2@"
  en: "@a@b*: This is the Trans-Montane Tunnel, connecting Endor in the west with Casabranca in the east.\n@c2@"
  es: "@a@b*: Este es el Túnel Tramontano, que comunica Endor, al oeste, con Casablanca, al este.\n@c2@"
  fr: "@a@b*ⓢ Ceci est le tunnel Transmontane, qui relie Chandor, à l'ouest, à Casabranca, à l'est.\n@c2@"
  it: "@a@b*: Questa è la Galleria Transmontana che collega Endor, che si trova a ovest, con Casabianca, a est.\n@c2@"
  ja: "@a@b＊「ここは　西のエンドールと\n\t東のブランカをつなぐ　トンネルです。\n@c2@"
"1":
  de: "@a@b*: Glückwunsch! Ihr seid die tausendste Person, die diesen Tunnel durchquert!\n@c2@"
  en: "@a@b*: Congratulations! You're the one thousandth person to pass through this tunnel!\n@c2@"
  es: "@a@b*: ¡Enhorabuena! ¡Eres la persona número mil que pasa por el túnel!\n@c2@"
  fr: "@a@b*ⓢ Félicitationsⓠ Vous êtes la millième personne à traverser ce tunnelⓠ\n@c2@"
  it: "@a@b*: Complimenti! Sei la millesima persona ad aver attraversato questa galleria!\n@c2@"
  ja: "@a@b＊「おめでとうございます！\n\tこのトンネルが開通してから\n\tあなたがちょうど　１０００人目です！\n@c2@"
"2":
  de: "@a@b*: Und das heißt, Ihr seid %A120%Xder glückliche Gewinner%Z%B120%Xdie glückliche Gewinnerin%Z eines sehr wertvollen Preises, den König Norbert von Endor ausgesetzt hat.\n@c2@"
  en: "@a@b*: That means you're the lucky winner of a very valuable prize courtesy of King Norman of Endor.\n@c2@"
  es: "@a@b*: Eso significa que has sido %A120%Xagraciado%Z%B120%Xagraciada%Z con un premio muy valioso cortesía del rey Norman de Endor.\n@c2@"
  fr: "@a@b*ⓢ Cela signifie que vous êtes l'%A120%Xheureux gagnant%Z%B120%Xheureuse gagnante%Z d'un prix de grande valeur, offert par le roi Norbert de Chandor.\n@c2@"
  it: "@a@b*: Ciò vuol dire che sei %A120%Xil fortunato vincitore%Z%B120%Xla fortunata vincitrice%Z di un premio di grandissimo valore messo a disposizione da Re Norman, sovrano di Endor.\n@c2@"
  ja: "@a@b＊「よって　あなたには　エンドール王から\n\tごうかな賞品が贈られます！\n@c2@"
"3":
  de: "@a@b*: Und zwar...\nJetons im Wert von 2.000 Goldmünzen für das Kasino von Endor!\n@c2@"
  en: "@a@b*: And the prize is... Two thousand gold coins' worth of casino tokens!\n@c2@"
  es: "@a@b*: Y el premio es...\n¡Fichas por valor de 2.000 monedas de oro para el casino de Endor!\n@c2@"
  fr: "@a@b*ⓢ Et le prix est... 100 jetons au casino de Chandor, d'une valeur totale de deux mille pièces d'orⓠ\n@c2@"
  it: "@a@b*: E il premio consiste in...\nCento gettoni da usare al casinò di Endor!\n@c2@"
  ja: "@a@b＊「エンドールの　カジノのコイン\n\t２０００ゴールドぶんです！\n@c2@"
"4":
  de: "@a@b*: Sie werden auf Euren Namen zurückgelegt, bis Ihr sie in Anspruch nehmen wollt. Nochmals herzlichen Glückwunsch!\n@c2@"
  en: "@a@b*: I bet you can't wait to get down there and have a flutter! Congratulations again!\n@c2@"
  es: "@a@b*: Se reservarán a tu nombre hasta que desees utilizarlas. ¡Enhorabuena de nuevo!\n@c2@"
  fr: "@a@b*ⓢ Ils seront réservés à votre nom sur place, jusqu'à ce que vous décidiez de les utiliser.\nEncore félicitationsⓠ\n@c2@"
  it: "@a@b*: Saranno tenuti da parte a tuo nome finché non li utilizzerai. Ancora complimenti!\n@c2@"
  ja: "@a@b＊「コインは　あなたの名前で\n\tカジノに預けておきましょう！\n\tおめでとうございました！\n@c2@"
"5":
  de: "@a@b*: Euer Preis wird im Kasino von Endor auf Euren Namen zurückgelegt, bis Ihr ihn in Anspruch nehmen wollt. Viel Spaß damit!\n@c2@"
  en: "@a@b*: Your prize will be reserved at the Endor casino until you want to use it.\nI hope you enjoy our token gesture!\n@c2@"
  es: "@a@b*: Tu premio quedará reservado en el casino de Endor hasta que desees canjearlo.\n¡Espero que disfrutes de nuestro gesto!\n@c2@"
  fr: "@a@b*ⓢ Votre prix sera réservé à votre nom au casino de Chandor, jusqu'à ce que vous l'utilisiez. J'espère que vous appréciez notre gesteⓠ\n@c2@"
  it: "@a@b*: Il tuo premio sarà conservato al casinò di Endor finché non deciderai di usarlo.\nSpero apprezzerai il nostro generoso gesto!\n@c2@"
  ja: "@a@b＊「コインは　あなたの名前で\n\tカジノに預けておきましょう！\n\tおめでとうございました！\n@c2@"
"6":
  de: "@a@b*: Dieser Torneko muss einen eisernen Willen haben, um so einen Tunnel graben zu können!\n@c3@"
  en: "@a@b*: That Torneko chap must have been ever so determined to dig out a tunnel like this.\n@c3@"
  es: "@a@b*: Ese tal Torneko tuvo que tiener una gran detierminación para construir un tiúnel como este.\n@c3@"
  fr: "@a@b*ⓢ Ce type, Torneko, devait être sacrément déterminé pour creuser un tunnel pareil.\n@c3@"
  it: "@a@b*: Quel Baldo doveva essere proprio motivato per scavare una galleria simile.\n@c3@"
  ja: "@a@b＊「こんなトンネルを　掘るとは\n\tトルネコってのは　えらいヤツだ。\n@c3@"
"7":
  de: "@a@b*: Wenn Ihr einem Mann namens Torneko Talun begegnet, könntet Ihr ihm bitte ausrichten, dass ich ihn suche?\n@c2@"
  en: "@a@b*: If ye happen across a fella by the name o' Torneko Taloon, would ya tell him I was askin' after him?\n@c2@"
  es: "@a@b*: Si %H860%Xte encuientras%Yos encontriáis%Z con un tipo que riesponde al nombre de Torneko Taloon, ¿le %H860%Xpuedies%Ypiodéis%Z diecir que he prieguntado por él?\n@c2@"
  fr: "@a@b*ⓢ Si par hasard vous croisez un homme du nom de Torneko Taloon, vous pourriez lui dire que je le chercheⓡ\n@c2@"
  it: "@a@b*: Se per caso %H860%Xincroci%Yincrociate%Z un tizio di nome Baldo Baldini, %H860%Xpotresti%Ypotreste%Z dirgli che lo sto cercando?\n@c2@"
  ja: "@a@b＊「もし　トルネコという者に会ったら\n\tこのじじいが　心配していたと\n\t伝えてくだされ　旅のおかた。\n@c2@"
"8":
  de: "@a@b*: Torneko, alter Freund! Dich gibt's ja tatsächlich noch! Ach, großartig! Einfach großartig!\n@c2@"
  en: "@a@b*: Torneko, y'ole feen! Ye're alive an' well, so y'are! Ah, that's grand, it is. Just grand.\n@c2@"
  es: "@a@b*: ¡Torneko, viejo amigo! ¡Pariece que estás vivito y colieando! Ah, es estupiendo. ¡Estupiendo!\n@c2@"
  fr: "@a@b*ⓢ Torneko, mon amiⓠ Vous êtes vivant et en bonne santé, dites-moiⓠ\nAh, c'est fantastique. Vraiment fantastique.\n@c2@"
  it: "@a@b*: Baldo, vecchio mio! Vedo che sei ancora tutto intero! Ma che bella notizia! È davvero fantastico!\n@c2@"
  ja: "@a@b＊「おや　トルネコさんじゃないか！？\n\tあんた　生きておったのか。\n\t良かったのう……うんうん。\n@c2@"
"9":
  de: "@a@b*: Willkommen in der Stadt Endor.\n@c2@"
  en: "@a@b*: Welcome to Endor.\n@c2@"
  es: "@a@b*: %H860%XTe%YOs%Z doy la bienvenida a la ciudad de Endor.\n@c2@"
  fr: "@a@b*ⓢ Bienvenue dans la ville de Chandor.\n@c2@"
  it: "@a@b*: %H860%XTi%YVi%Z do il benvenuto a Endor.\n@c2@"
  ja: "@a@b＊「エンドールの城下町に　ようこそ。\n@c2@"
"10":
  de: "@a@b*: In diesem Moment findet drüben in der Burg die Hochzeit von Prinzessin Veronica und Prinz Hinz statt!\n@c1@"
  en: "@a@b*: Princess Veronica and Prince Regan's wedding ceremony is happening over at the castle as we speak!\n@c1@"
  es: "@a@b*: ¡La boda entre la Princesa Verónica y el Príncipe Alí se está celebrando en el castillo!\n@c1@"
  fr: "@a@b*ⓢ La cérémonie de mariage de la princesse Véronica et du prince Réginald se déroule en ce moment même au châteauⓠ\n@c1@"
  it: "@a@b*: Proprio adesso si sta celebrando il matrimonio tra la Principessa Veronica e il Principe Vitellozzo!\n@c1@"
  ja: "@a@b＊「お城では今　リック王子とモニカ姫の\n\t結婚式をやってるのよ。\n@c1@"
"11":
  de: "@a@b*: Wachestehen ist nicht so einfach wie es aussieht, wisst Ihr. Da freu ich mich auf einen kühlen Schluck oder zwei heut Abend.\n@c2@"
  en: "@a@b*: Being on guard duty isnⓙt as easy as it looks, you know. Iⓙll certainly be enjoying a drink or two when evening rolls around.\n@c2@"
  es: "@a@b*: Estar de guardia no es tan fácil como parece. Cuando llegue la noche me tomaré un par de cervezas.\n@c2@"
  fr: "@a@b*ⓢ Être de garde n'est pas aussi facile qu'il y paraît, vous savez. J'irai sans doute boire un verre ou deux ce soir.\n@c2@"
  it: "@a@b*: Stare di guardia non è semplice come sembra. Stasera andrò a bere qualcosa per rilassarmi dalla fatica...\n@c2@"
  ja: "@a@b＊「かあ～　見回りも　楽じゃねえぜ。\n\t早く　酒場にでもいって\n\tいっぱい　やりたいなあ。\n@c2@"
"12":
  de: "@a@b*: Nach dem Turnier von Endor ging's hier ein bisschen ruhiger zu. Aber jetzt sind die Monster wieder da.\n@c2@"
  en: "@a@b*: We had a brief respite after the Endor Tourney, you know. But now the monsters are back with a vengeance.\n@c2@"
  es: "@a@b*: Después del Torneo de Endor tuvimos un breve respiro, ¿sabes? Pero ahora los monstruos han regresado con sed de venganza.\n@c2@"
  fr: "@a@b*ⓢ Nous avons eu un petit moment de répit après le tournoi de Chandor, mais les monstres sont de retour et ils ne sont pas tendres.\n@c2@"
  it: "@a@b*: Dopo il Torneo di Endor abbiamo avuto un po' di calma, ma ora i mostri sono tornati più forti e aggressivi che mai.\n@c2@"
  ja: "@a@b＊「武術大会の後　しばらくは\n\t怪物も　出なかったのに\n\tまた　出るようになったのよ。\n@c2@"
"13":
  de: "@a@b*: Ich weiß auch nicht! Die Welt ist verrückt geworden!\n@c2@"
  en: "@a@b*: I wonder whatⓙs behind it all.\nItⓙs a funny old world we live in, isnⓙt it?\n@c2@"
  es: "@a@b*: No sé.\n¡El mundo se ha vuelto loco!\n@c2@"
  fr: "@a@b*ⓢ Je ne sais pas ce qui se passe.\nLe monde est devenu fouⓠ\n@c2@"
  it: "@a@b*: Proprio non capisco! Chissà dove andremo a finire!\n@c2@"
  ja: "@a@b＊「なにが　どうなってんだか……。\n\tぶっそうな世の中だねえ。\n@c2@"
"14":
  de: "@a@b*: Zur Burg Endor geht es hier durch dieses Tor.\n@c2@"
  en: "@a@b*: Youⓙll find Endor Castle just through this gate.\n@c2@"
  es: "@a@b*: El Castillo de Endor se encuentra al otro lado de esta puerta.\n@c2@"
  fr: "@a@b*ⓢ Le château de Chandor se trouve juste de l'autre côté de cette porte.\n@c2@"
  it: "@a@b*: Il castello di Endor è appena oltre questo passaggio.\n@c2@"
  ja: "@a@b＊「この門を　くぐった先に\n\tエンドールのお城がある。\n@c2@"
"15":
  de: "@a@b*: Wenn Ihr der königlichen Hochzeit beiwohnen wollt, begebt Euch bitte zum Kolosseum.\n@c2@"
  en: "@a@b*: If youⓙre here to attend the royal wedding, please make your way to the Colosseum.\n@c2@"
  es: "@a@b*: Si %H860%Xha%Yhan%Z venido a presenciar la boda real, %H860%Xle%Yles%Z ruego que %H860%Xcontinúe%Ycontinuen%Z hasta el Coliseo.\n@c2@"
  fr: "@a@b*ⓢ Si vous êtes là pour assister au mariage royal, veuillez vous diriger vers le Colisée.\n@c2@"
  it: "@a@b*: Se %H860%Xsei%Ysiete%Z qui per partecipare alle nozze reali, %H860%Xdirigiti%Ydirigetevi%Z verso l'Arena.\n@c2@"
  ja: "@a@b＊「姫さまの結婚式を見たいなら\n\tコロシアムへ　行くがいい。\n@c2@"
"16":
  de: "@a@b*: Wirklich verblüffend! Diese Wahrsagerin trifft mit ihren Prophezeiungen immer mitten ins Schwarze!\n@c2@"
  en: "@a@b*: Itⓙs amazing! This girlⓙs fortune-telling is absolutely spot on!\n@c2@"
  es: "@a@b*: ¡Es sorprendente! ¡Las dotes adivinatorias de esa joven son increíbles!\n@c2@"
  fr: "@a@b*ⓢ C'est incroyableⓠ\nLes prédictions de cette diseuse de bonne aventure sont absolument exactesⓠ\n@c2@"
  it: "@a@b*: Incredibile! Questa ragazza è proprio brava a leggere il futuro!\n@c2@"
  ja: "@a@b＊「いや～　まったく！\n\tこの人の占いは　よく当たる。\n@c2@"
"17":
  de: "@a@b*: Ihr solltet es auch mal versuchen.\n@c2@"
  en: "@a@b*: You should have yours told.\n@c2@"
  es: "@a@b*: %H860%XDeberías%YDeberíais%Z probarlo personalmente.\n@c2@"
  fr: "@a@b*ⓢ Vous devriez la consulter.\n@c2@"
  it: "@a@b*: Anche %H860%Xtu dovresti farti leggere il tuo%Yvoi dovreste farvi leggere il vostro%Z.\n@c2@"
  ja: "@a@b＊「あなたも　占ってもらうといい。\n@c2@"
"18":
  de: "@a@b*: Nun, da Mina mir meine Zukunft vorhergesagt hat, weiß ich genau, was ich mit meinem Leben anfangen sollte.\n@c2@"
  en: "@a@b*: Now that Meenaⓙs told my fortune, I know exactly what I should do with my life.\n@c2@"
  es: "@a@b*: Ahora que Meena me ha leído el futuro, sé exactamente lo que tengo que hacer con mi vida.\n@c2@"
  fr: "@a@b*ⓢ Maintenant que Mina m'a dévoilé mon avenir, je sais exactement quoi faire de ma vie.\n@c2@"
  it: "@a@b*: Ora che Myra mi ha predetto il futuro, so esattamente cosa fare della mia vita.\n@c2@"
  ja: "@a@b＊「ミネアさんの　占いのおかげで\n\tどう生きればいいのか　わかったよ。\n@c2@"
"19":
  de: "@a@b*: Schon komisch, wenn man daran denkt, wozu all diese Leute auf der Welt sind und dass alle ihr vorbestimmtes Schicksal haben.\n@c2@"
  en: "@a@b*: Itⓙs funny when you think of all the reasons people were brought into this world, of all the destinies we each have.\n@c2@"
  es: "@a@b*: Resulta curioso pensar en los motivos por los que la gente llega a este mundo, en el destino tan diferente que tenemos cada uno.\n@c2@"
  fr: "@a@b*ⓢ C'est drôle de penser à toutes les raisons qui font que les gens viennent au monde, à la destinée de chacun d'entre nous.\n@c2@"
  it: "@a@b*: Certo che è strano pensare a tutti i motivi per cui le persone sono venute al mondo, e a tutto quello che il destino ha in serbo per loro...\n@c2@"
  ja: "@a@b＊「人は　それぞれ　いろんな\n\t使命を持って　この世に\n\t生まれてくるんだなあ。\n@c2@"
"20":
  de: "@aMina@bWünscht Ihr, dass ich Euch aus der Hand lese oder etwas derartiges? Für nur zehn Goldstücke erzähle ich Euch alles über Euch selbst.\n@c1@"
  en: "@aMeena@bWould you like me to be reading your palm or something? For just ten gold coins, please, I will tell you all about your dear self. \n@c1@"
  es: "@aMeena@b¿Desea que le lea la mano o algo similar? Solo diez monedas de oro, por favor. Le contaré todo lo que desea saber. \n@c1@"
  fr: "@aMina@bVoulez-vous que je vous lise les lignes de la mainⓡ Pour seulement dix pièces d'or, je vous dirai tout sur vous.\n@c1@"
  it: "@aMyra@b%H860%XVuoi%YVolete%Z che legga la %H860%Xtua%Yvostra%Z mano? Per sole dieci monete d'oro, Myra %H860%Xti%Yvi%Z racconta vita, morte e miracoli.\n@c1@"
  ja: "@a@bミネア「占いは　いかがですか？\n\t１０ゴールドで　あなたの未来を\n\t見てさしあげましょう。\n@c1@"
"21":
  de: "@aMina@bMit dem größten Entzücken, %A120%Xmein Herr%Z%B120%Xmeine Dame%Z.\n@c1@"
  en: "@aMeena@bArey, very good, %A120%Xsir%Z%B120%Xmadam%Z.\n@c1@"
  es: "@aMeena@bPerfecto, muy bien, %A120%Xseñor%Z%B120%Xseñora%Z.\n@c1@"
  fr: "@aMina@bArey, très bien, %A120%XMonsieur%Z%B120%XMadame%Z.\n@c1@"
  it: "@aMyra@bMolto bene, %A120%Xsignore%Z%B120%Xsignora%Z.\n@c1@"
  ja: "@a@bミネア「では　占ってさしあげましょう。\n@c1@"
"22":
  de: "@aMina@bIch erblicke sieben ⓚⓛ nein. Aber doch, sieben! Sieben Lichter, die Euch umrahmen.\n@c1@"
  en: "@aMeena@bI am seeing sevenⓚⓛ No...\nYes, seven! Seven lights surrounding you.\n@c1@"
  es: "@aMeena@bPuedo ver siete... No...\n¡Sí, siete! Siete luces que %A120%Xle%Z%B120%Xla%Z rodean.\n@c1@"
  fr: "@aMina@bJe vois sept... non... si, septⓠ\nSept lumières autour de vous.\n@c1@"
  it: "@aMyra@bVedo sette... No!\nSì, sì, sette luci intorno a te!\n@c1@"
  ja: "@a@bミネア「あなたのまわりには\n\t７つの光が見えます。\n@c1@"
"23":
  de: "@aMina@bIn diesem Moment sind es nur winzig kleine Fünkchen, aber ich hoffe, sie werden noch viel, viel größer. Denn das sind die Erkor...\n@c1@"
  en: "@aMeena@bNow they are only teeny-weeny specks, but I hope they will be very, very much bigger. Because actually, they represent the Chosⓚⓛ\n@c1@"
  es: "@aMeena@bAhora son solo pequeños puntos diminutos pero espero que crezcan mucho, mucho más. Ya que, en realidad, representan a%A090%Xl%Z%B090%X la%Z Eleg...\n@c1@"
  fr: "@aMina@bPour l'instant, ce ne sont que de tout petits points lumineux, mais j'espère qu'ils grossiront encore et encore.\n㈡\nCar en réalité, ces points représentent l'Él...\n@c1@"
  it: "@aMyra@bIn questo momento sono solo piccole scintille appena visibili, ma spero che diventino più grandi, perché esse rappresentano %A090%Xil%Z%B090%Xla%Z Presc... \n@c1@"
  ja: "@a@bミネア「まだ　小さな光ですが\n\tやがて導かれ　大きな光となり……。\n\tえっ！？\n@c1@"
"24":
  de: "@aMina@bAch! Aber nein, das kann doch nicht sein! Ihr müsst %A090%Xder legendäre Held%Z%B090%Xdie legendäre Heldin%Z sein!\n@c1@"
  en: "@aMeena@bAccha! No, it canⓙt be!\nYou must be the legendary %A090%Xhero%Z%B090%Xheroine%Z!\n@c1@"
  es: "@aMeena@b¡Por Shiva! No, ¡no puede ser!\n¡Usted debe ser %A090%Xel legendario héroe%Z%B090%Xla legendaria heroína%Z!\n@c1@"
  fr: "@aMina@bAcchaⓠ Non, c'est impossibleⓠ\nVous devez être %A090%Xle héros%Z%B090%Xl'héroïne%Z légendaireⓠ\n@c1@"
  it: "@aMyra@bPer tutti i tarocchi! No, non può essere!\nTu devi essere %A090%Xl'eroe leggendario%Z%B090%Xla leggendaria eroina%Z!\n@c1@"
  ja: "@a@bミネア「も　もしや\n\tあなたは　勇者さま！\n@c1@"
"25":
  de: "@aMina@bMeine Schwester und ich spüren schon so lange hinter Euch her. Euch wohnt die Macht inne, das Böse zu besiegen.\n@c1@"
  en: "@aMeena@bMe and my sister have been looking for you since so long ago. You have the power to defeat the Evil One.\n@c1@"
  es: "@aMeena@bMi hermana y yo %A120%Xle%Z%B120%Xla%Z hemos estado buscando desde hace mucho tiempo. Tiene el poder para derrotar al Maligno.\n@c1@"
  fr: "@aMina@bMa sœur et moi vous cherchons depuis si longtemps. Vous avez le pouvoir de vaincre le Démon.\n@c1@"
  it: "@aMyra@bIo e mia sorella ti cerchiamo da tanto tempo. Tu hai il potere di sconfiggere il Malvagio.\n@c1@"
  ja: "@a@bミネア「あなたを探していました。\n\t邪悪なる者を　倒せるチカラを\n\t秘めたあなたを。\n@c1@"
"26":
  de: "@aMina@bWir müssen unsere Kräfte bündeln. Es ist unser Los, uns dieser dunklen, dunklen Macht entgegenzuwerfen.\n@c1@"
  en: "@aMeena@bWe all must join forces together. It is our destiny that we stand up against this dark, dark power.\n@c1@"
  es: "@aMeena@bDebemos unir nuestras fuerzas. Nuestro destino nos obliga a enfrentarnos a este poder de la oscuridad.\n@c1@"
  fr: "@aMina@bNous devons unir nos forces. Notre destinée est de nous dresser ensemble contre cette puissance obscure.\n@c1@"
  it: "@aMyra@bDobbiamo unire le nostre forze. Nelle stelle è scritto che insieme abbatteremo questo potere oscuro.\n@c1@"
  ja: "@a@bミネア「私と　姉のマーニャは\n\tあなたとともに　暗黒のチカラに\n\t対抗すべく　運命付けられた者。\n@c1@"
"27":
  de: "@aMina@bUnd es existieren noch andere, müsst Ihr wissen. Noch andere Menschen in der Welt mit der gleichen Bestimmung wie wir.\n@c1@"
  en: "@aMeena@bAnd there are others, you know. Other people in the world with the same destiny as us.\n@c1@"
