"0":
  de: "@a@bWeit im Osten von Endor, tief in den Bergen, liegt ein kleines namenloses Dorf.\n@c0@"
  en: "@a@bFar to the east of Endor, nestled deep in the mountains, lies a little hamlet with no name.\n@c0@"
  es: "@a@bLejos de Endor, hacia el este, oculta en lo profundo de las montañas, se encuentra una pequeña aldea de nombre desconocido.\n@c0@"
  fr: "@a@bLoin à l'est de Chandor, niché au plus profond des montagnes, se cache un petit hameau sans nom.\n@c0@"
  it: "@a@bA est di Endor, nascosto fra le montagne, c'è un piccolo villaggio senza nome.\n@c0@"
  ja: "@a@bエンドールから　はるか東の山奥に\n名もない　小さな村がありました。\n@c0@"
"1":
  de: "@a@bVormals lebten seine Bewohner abgeschieden, verließen niemals ihr Dorf, hießen Fremde nicht willkommen.\n@c0@"
  en: "@a@bIts inhabitants once lived in solitude,\nnever venturing outside,\nnever welcoming outsiders.\n@c0@"
  es: "@a@bSus habitantes vivían apartados,\nsin contacto con el exterior,\nsin visitas de forasteros ni extraños.\n@c0@"
  fr: "@a@bSes habitants vivaient dans la solitude,\nne s'aventurant jamais au-dehors,\nn'accueillant jamais d'étrangers.\n@c0@"
  it: "@a@bUn tempo, i suoi abitanti vivevano in solitudine, senza mai avventurarsi fuori dal paesino e senza ricevere visite da stranieri.\n@c0@"
  ja: "@a@bその村に住む人々は　けっして\nおもてには出ず　よそ者を寄せつけず\nひっそりと暮らす毎日。\n@c0@"
"2":
  de: "@a@bUnd außer den Dorfbewohnern selbst wusste niemand etwas von dieser winzigen Siedlung. Bis eines Tages...\n@c0@"
  en: "@a@bIn fact, but for the villagers themselves, the world was oblivious to the very existence of this tiny settlement. Until one day...\n@c0@"
  es: "@a@bEn realidad, excepto los habitantes de la aldea, el mundo desconocía la existencia de este diminuto poblado. Hasta que un día...\n@c0@"
  fr: "@a@bEn réalité, à l'exception des villageois eux-mêmes, le monde ignorait jusqu'à l'existence même de ce minuscule village. Jusqu'à ce qu'un beau jour...\n@c0@"
  it: "@a@bI contatti con l'esterno erano così limitati che, oltre agli abitanti del villaggio, nessuno conosceva l'esistenza di quel luogo. Finché un giorno...\n@c0@"
  ja: "@a@b村人たち以外は　そんな村が\nあることさえ　知らないはずでした。\nしかし……。\n@c0@"
"3":
  de: "@a@b*: So. Geschafft.\n@c2@"
  en: "@a@b*: There. All done.\n@c2@"
  es: "@a@b*: Ya está. Terminado.\n@c2@"
  fr: "@a@b*ⓢ Voilà. C'est fini.\n@c2@"
  it: "@a@b*: Ecco qui, tutto fatto.\n@c2@"
  ja: "@a@b＊「さあ　できたわ。\n@c2@"
"4":
  de: "@a@b*: Sei so lieb, %a00090, bring deinem Vater doch bitte diesen Essenskorb.\nEr ist schon wieder draußen am See und angelt.\n@c2@"
  en: "@a@b*: Be a good child, %a00090, and deliver this packed lunch to your father.\nHe is fishing at the lake again.\n@c2@"
  es: "@a@b*: Sé %A090%Xbueno%Z%B090%Xbuena%Z, %a00090, y llévale el almuerzo a tu padre.\nHa ido a pescar al lago otra vez.\n@c2@"
  fr: "@a@b*ⓢ Sois %A090%Xgentil%Z%B090%Xgentille%Z, %a00090, apporte ce panier-repas à ton père.\nIl est en train de pêcher près du lac.\n@c2@"
  it: "@a@b*: Fammi un favore, %a00090, porta il cestino con il pranzo a tuo padre.\nÈ di nuovo al lago a pescare.\n@c2@"
  ja: "@a@b＊「%a00090や　いい子だから\n\tこのお弁当を　池で釣りをしている\n\tお父さんに　持っていっておくれ。\n@c2@"
"5":
  de: "@a@b%0%a00090 nimmt den Essenskorb für %A090%Xseinen%Z%B090%Xihren%Z Vater.\n@c2@"
  en: "@a@b%0%a00090 receives the packed lunch for %A090%Xhis%Z%B090%Xher%Z father.\n@c2@"
  es: "@a@b%0%a00090 recibe el almuerzo para su padre.\n@c2@"
  fr: "@a@b%0%a00090 reçoit le panier-repas pour son père.\n@c2@"
  it: "@a@b%0%a00090 riceve il cestino con il pranzo per suo padre.\n@c2@"
  ja: "@a@b%a00090は\nおべんとうを　手に入れた。\n@c2@"
"6":
  de: "@a@b*: Und denk an deine Manieren.\nWenn du jemandem begegnest, vergiss nicht, höflich zu grüßen, so wie du's von mir gelernt hast.\n@c2@"
  en: "@a@b*: And don't forget your manners on the way.\nIf you meet anyone, remember to greet them politely, just as I told you to.\n@c2@"
  es: "@a@b*: Y no olvides comportarte por el camino.\nSi te encuentras a alguien, debes saludarle con educación, tal y como te he enseñado.\n@c2@"
  fr: "@a@b*ⓢ Et n'oublie pas les bonnes manières sur la routeⓢ si tu croises quelqu'un, salue-le poliment, comme je te l'ai appris.\n@c2@"
  it: "@a@b*: E non dimenticare le buone maniere...\nSe incontri qualcuno per strada, salutalo educatamente, come ti ho insegnato.\n@c2@"
  ja: "@a@b＊「あっ　それから\n\t村のみんなに会ったら\n\tちゃんと　あいさつするのよ。\n@c2@"
"7":
  de: "@a@b*: Wir werden auch essen, sobald du deinem Vater den Korb gebracht hast.\n@c2@"
  en: "@a@b*: We shall have something to eat ourselves just as soon as you've delivered your father's lunch.\n@c2@"
  es: "@a@b*: Cuando le hayas llevado el almuerzo a tu padre, prepararé algo de comer para nosotros.\n@c2@"
  fr: "@a@b*ⓢ Nous mangerons quelque chose, nous aussi, dès que tu auras apporté son déjeuner à ton père.\n@c2@"
  it: "@a@b*: Dopo che avrai portato il pranzo a tuo padre, anche noi ci metteremo a tavola.\n@c2@"
  ja: "@a@b＊「お弁当を　届けてくれたら\n\tお前も　すぐ食事にしますからね。\n@c2@"
"8":
  de: "@aElisa@bGuten Morgen, %a00090. Weißt du, wie wunderbar es ist, zwischen all diesen Blumen zu liegen?\n@c1@"
  en: "@aEliza@bGood morning, %a00090.\nDo you know how wonderful it feels just lying here in all the flowers?\n@c1@"
  es: "@aElisa@bBuenos días, %a00090.\n¡No te imaginas lo bien que se está aquí tumbada entre las flores!\n@c1@"
  fr: "@aÉlisa@bBonjour, %a00090.\nSi tu savais comme c'est merveilleux d'être allongée au milieu de toutes ces fleursⓠ\n@c1@"
  it: "@aElisa@bBuongiorno, %a00090.\nChe bello starsene qui in mezzo ai fiori!\n@c1@"
  ja: "@a@bシンシア「おはよう　%a00090。\n\tこうして　寝っ転がっていると\n\tとても　いい気持ちよ。\n@c1@"
"9":
  de: "@aElisa@bOh, %a00090! Ich hoffe, alles bleibt für immer, wie es jetzt ist! Hoffentlich ändern wir uns nie, selbst wenn wir älter werden!\n@c1@"
  en: "@aEliza@bOh, %a00090!\nI hope we stay like this forever!\nEven when we get older, I hope we never change.\n@c1@"
  es: "@aElisa@b¡Oh, %a00090!\n¡Ojalá siempre seamos así! Aunque nos hagamos mayores, espero que nunca cambiemos.\n@c1@"
  fr: "@aÉlisa@bOh, %a00090ⓠ J'espère que nous resterons toujours ainsiⓠ Même en grandissant, j'espère que nous ne changerons jamais.\n@c1@"
  it: "@aElisa@bOh, %a00090!\nVorrei che questo momento non finisse mai...!\n㈡\nMi piacerebbe che restasse tutto così com'è ora, fino a quando saremo diventati vecchi...\n@c1@"
  ja: "@a@bシンシア「ねえ　%a00090。\n\tわたしたち　大きくなっても　ずっと\n\tこのままでいられたら　いいね。\n@c1@"
"10":
  de: "@aElisa@bIn letzter Zeit träume ich immer... Dass wir miteinander alt werden, hier in unserem wunderschönen Dorf...\n@c1@"
  en: "@aEliza@bRecently I've been having these dreams...\nThat we grow old together, right here in this beautiful village of ours...\n@c1@"
  es: "@aElisa@bÚltimamente he tenido sueños...\nQue crecíamos %A090%Xjuntos%Z%B090%Xjuntas%Z, aquí, en nuestro maravilloso pueblo...\n@c1@"
  fr: "@aÉlisa@bJ'ai fait des rêves ces derniers temps...\nNous grandissions ensemble, ici même, dans notre beau village...\n@c1@"
  it: "@aElisa@bUltimamente faccio dei sogni...\nVedo noi che cresciamo insieme, proprio qui nel nostro bellissimo villaggio...\n@c1@"
  ja: "@a@bシンシア「わたしね　最近　夢をみるの。\n\t大人になった　私たちが　この村で\n\tいつまでも　幸せに暮らしている夢……。\n@c1@"
"11":
  de: "@aElisa@bIch finde es so schön hier.\nUnd ich bin so gern mit dir zusammen!\n@c1@"
  en: "@aEliza@bI love it here.\nAnd I love being with you!\n@c1@"
  es: "@aElisa@bMe encanta este sitio.\n¡Y me encanta estar junto a ti!\n@c1@"
  fr: "@aÉlisa@bJ'adore cet endroit.\nEt j'adore être avec toiⓠ\n@c1@"
  it: "@aElisa@bAdoro questo posto.\nE mi diverto moltissimo a stare con te!\n@c1@"
  ja: "@a@bシンシア「わたしね　この村が大好き！\n\t%a00090のことも　大好き！\n@c1@"
"12":
  de: "@aElisa@bAch, sag doch, dass wir für immer zusammen sein werden, %a00090! Das ist alles, was ich mir wünsche.\n@c1@"
  en: "@aEliza@bOh, say we'll be together always, %a00090!\nThat's all I want.\n@c1@"
  es: "@aElisa@b¡Prométeme que siempre estaremos %A090%Xjuntos%Z%B090%Xjuntas%Z, %a00090!\nEs todo lo que deseo.\n@c1@"
  fr: "@aÉlisa@bOh, dis-moi que nous resterons toujours ensemble, %a00090ⓠ\nC'est tout ce que je désire.\n@c1@"
  it: "@aElisa@bSpero che staremo sempre insieme, %a00090!\nSarebbe bellissimo.\n@c1@"
  ja: "@a@bシンシア「だから　いつまでも\n\tいっしょよ。　%a00090。\n@c1@"
"13":
  de: "@a@b*: Erwischt!\n@c2@"
  en: "@a@b*: Hiii-ya!\n@c2@"
  es: "@a@b*: ¡Yuuuju!\n@c2@"
  fr: "@a@b*ⓢ Hiii-yaⓠ\n@c2@"
  it: "@a@b*: Yiiih-ah!\n@c2@"
  ja: "@a@b＊「きえーい！\n@c2@"
"14":
  de: "@a@b*: Ha ha ha! Du hast nicht aufgepasst, %a00090! Dieses Schwerttraining ist gar nicht so einfach, wie du siehst!\n@c2@"
  en: "@a@b*: Ha ha ha!\nYour concentration lapsed, %a00090.\nTraining for the sword is not easy, you see!\n@c2@"
  es: "@a@b*: ¡Ja, ja, ja!\nHas perdido la concentración, %a00090.\n¡El entrenamiento con la espada no es fácil!\n@c2@"
  fr: "@a@b*ⓢ Ha ha haⓠ\nTa concentration laisse à désirer, %a00090.\nTu vois, s'entraîner à l'épée n'est pas facileⓠ\n@c2@"
  it: "@a@b*: Ah! Ah! Ah!\nNon ti stai impegnando come si deve, %a00090.\nGuarda che allenarsi con la spada non è facile!\n@c2@"
  ja: "@a@b＊「わっはっはっ。\n\t油断したな　%a00090。\n\t剣の修行は　厳しいのだ。\n@c2@"
"15":
  de: "@a@b*: Hallo, %a00090.\nBringst du mir mein Essen?\n@c2@"
  en: "@a@b*: Hello, %a00090.\nHave you brought me my lunch?\n@c2@"
  es: "@a@b*: Hola, %a00090.\n¿Me has traído el almuerzo?\n@c2@"
  fr: "@a@b*ⓢ Bonjour, %a00090.\nTu m'apportes mon déjeunerⓡ\n@c2@"
  it: "@a@b*: Ciao, %a00090.\nMi hai portato il pranzo?\n@c2@"
  ja: "@a@b＊「おお　%a00090。\n\t弁当を持ってきてくれたのか。\n@c2@"
"16":
  de: "@a@b*: Du liebe Güte!\nDu hast es selbst aufgegessen? \nTs, ts, ts, %A090%Xmein Junge%Z%B090%Xjunge Dame%Z!\n@c2@"
  en: "@a@b*: Good gracious!\nYou've eaten it yourself?\nTut tut, %A090%Xmy boy%Z%B090%Xyoung lady%Z!\n@c2@"
  es: "@a@b*: ¡Vaya por Dios!\n¿Te lo has comido?\n¡Vaya, vaya, %A090%Xcaballerete%Z%B090%Xseñorita%Z!\n@c2@"
  fr: "@a@b*ⓢ Bonté divineⓠ\nTu l'as mangéⓡ\nTss tss tss, %A090%Xmon garçon%Z%B090%Xjeune fille%Zⓠ\n@c2@"
  it: "@a@b*: Per tutti i pesci del lago!\nHai fatto fuori tutto?\nMolto male, %A090%Xpiccolo%Z%B090%Xpiccola%Z!\n@c2@"
  ja: "@a@b＊「なんと！？　わしの弁当は\n\tお前が　食べてしまっただと！？\n\tとほほ……。\n@c2@"
"17":
  de: "@a@b*: Komm mal her, %a00090. Ich möchte mit dir reden. Dein 18. Geburtstag rückt näher. Bald bist du kein Kind mehr, sondern %A090%Xein junger Mann%Z%B090%Xeine junge Frau%Z.\n@c2@"
  en: "@a@b*: Come, %a00090. I want to talk to you.\nNow you are in your eighteenth year. You shan't be a %A090%Xboy%Z%B090%Xgirl%Z much longer. Soon you shall be a %A090%Xman%Z%B090%Xwoman%Z.\n@c2@"
  es: "@a@b*: Acércate, %a00090. Tengo que hablar contigo. Ya tienes dieciocho años. Ya no eres %A090%Xun niño%Z%B090%Xuna niña%Z. Pronto te convertirás en %A090%Xun hombre%Z%B090%Xuna mujer%Z.\n@c2@"
  fr: "@a@b*ⓢ Viens, %a00090. Je veux te parler.\nTu es dans ta dix-huitième année. D'ici peu, tu ne seras plus %A090%Xun petit garçon%Z%B090%Xune petite fille%Z, mais %A090%Xun homme%Z%B090%Xune femme%Z.\n@c2@"
  it: "@a@b*: Vieni qui, %a00090. Voglio parlarti.\nOra hai diciotto anni. Non sarai %A090%Xun ragazzino%Z%B090%Xuna ragazzina%Z ancora per molto. Tra poco diventerai %A090%Xun uomo%Z%B090%Xuna donna%Z.\n@c2@"
  ja: "@a@b＊「ところで　%a00090や。\n\tお前も　もう１７才だ\n\tそろそろ　おとなの仲間入りだな。\n@c2@"
"18":
  de: "@a@b*: Also, %A090%Xmein Sohn%Z%B090%Xmeine Tochter%Z, denke daran, was deine Mutter und ich dich gelehrt haben. Sei immer ehrlich und treu.\n@c2@"
  en: "@a@b*: So, my %A090%Xson%Z%B090%Xgirl%Z. Remember what your mother and I have taught you. Be honest and true.\n@c2@"
  es: "@a@b*: Por ello, %A090%Xhijo%Z%B090%Xhija%Z. Recuerda lo que tu madre y yo te hemos enseñado. A ser %A090%Xhonesto y honrado%Z%B090%Xhonesta y honrada%Z.\n@c2@"
  fr: "@a@b*ⓢ Alors, %A090%Xmon fils%Z%B090%Xma fille%Z, souviens-toi de ce que ta mère et moi t'avons appris. Sois honnête et sincère.\n@c2@"
  it: "@a@b*: Quindi, %A090%Xfiglio mio%Z%B090%Xfiglia mia%Z, ricorda quello che io e tua madre ti abbiamo insegnato: sii sempre %A090%Xsincero%Z%B090%Xsincera%Z e leale.\n@c2@"
  ja: "@a@b＊「よいか　%a00090。\n\t強く　正しく　生きるのだぞ。\n\tたとえ　なにが起こってもな……。\n@c2@"
"19":
  de: "@a@b*: Hallo, %a00090. Gehst du ein wenig spazieren? Ja, schöner könnte das Wetter ja nicht sein.\n@c2@"
  en: "@a@b*: Hello, %a00090. You're enjoying a stroll, I see. Yes, indeed it is fine weather for it.\n@c2@"
  es: "@a@b*: Hola, %a00090. Veo que estás dando un paseo. La verdad es que el día invita a ello.\n@c2@"
  fr: "@a@b*ⓢ Bonjour, %a00090. Alors tu te promènesⓡ Tu as raison, c'est le temps idéal pour ça.\n@c2@"
  it: "@a@b*: Ciao, %a00090. Stai facendo una passeggiata, eh? Fai bene, oggi il tempo è bellissimo.\n@c2@"
  ja: "@a@b＊「おっ　%a00090。　散歩かい？\n\t今日は　いい天気だね。\n@c2@"
"20":
  de: "@a@b*: Dies ist der Eingang zum Dorf. Ich stehe hier, um sicherzustellen, dass wir keinen unwillkommenen Besuch bekommen.\n@c2@"
  en: "@a@b*: This is the village entrance.\nI am standing guard here to ensure unwelcome visitors do not breach our borders.\n@c2@"
  es: "@a@b*: Esta es la entrada al pueblo.\nEstoy aquí montando guardia para evitar que intrusos indeseables atraviesen la frontera.\n@c2@"
  fr: "@a@b*ⓢ Ceci est l'entrée du village.\nJ'y monte la garde pour empêcher les visiteurs indésirables de pénétrer chez nous.\n@c2@"
  it: "@a@b*: Questo è l'ingresso al villaggio. Io controllo che nessun visitatore sgradito oltrepassi i nostri confini.\n@c2@"
  ja: "@a@b＊「ここは　村の入り口。\n\tあやしいヤツが　入ってこぬよう\n\t見張っているのだ。\n@c2@"
"21":
  de: "@a@b*: Möchtest du das Dorf verlassen, %a00090?\n@c2@"
  en: "@a@b*: Do you wish to leave the village, %a00090?\n@c2@"
  es: "@a@b*: ¿Te gustaría abandonar el pueblo, %a00090?\n@c2@"
  fr: "@a@b*ⓢ Veux-tu quitter le village, %a00090ⓡ\n@c2@"
  it: "@a@b*: Vuoi lasciare il villaggio, %a00090?\n@c2@"
  ja: "@a@b＊「ところで　%a00090。\n\t村のそとへ　出たいか？\n@c2@"
"22":
  de: "@a@b*: Ich fürchte, die Zeit ist noch nicht ganz reif dafür. Du bist noch nicht stark genug.\n@c2@"
  en: "@a@b*: I am afraid the time is not yet right.\nYou are still too weak.\n@c2@"
  es: "@a@b*: Me temo que todavía no es el momento adecuado.\nAún eres demasiado débil.\n@c2@"
  fr: "@a@b*ⓢ Je regrette, mais le temps n'est pas tout à fait venu.\nTu es encore trop faible.\n@c2@"
  it: "@a@b*: Temo che non sia ancora il momento giusto.\nSei ancora troppo debole.\n@c2@"
  ja: "@a@b＊「しかし　まだ　その時ではない\n\t今のお前では　まだまだ\n\tちから不足なのだよ。\n@c2@"
"23":
  de: "@a@b*: Eine kluge Antwort. Du wirst das Dorf erst verlassen, wenn du stark genug bist.\n@c2@"
  en: "@a@b*: A wise answer. You shall leave the village only when you are strong enough.\n@c2@"
  es: "@a@b*: Una respuesta inteligente. Solo podrás abandonar el pueblo cuando seas lo bastante fuerte.\n@c2@"
  fr: "@a@b*ⓢ Voilà une réponse sage. Tu ne quitteras le village que lorsque tu seras assez %A090%Xfort%Z%B090%Xforte%Z.\n@c2@"
  it: "@a@b*: Risposta saggia. Lascerai il villaggio solo quando sarai abbastanza forte per farlo.\n@c2@"
  ja: "@a@b＊「うむ　そうだな。\n\t%a00090が　村を出るには\n\tもっともっと　強くならなくてはな。\n@c2@"
"24":
  de: "@a@b*: Offenbar hat einer der Brüder einem Dichter, der sich verlaufen hat, ein Bett angeboten.\n@c3@"
  en: "@a@b*: It seems one of the brothers offered lodgings to a lost poet.\n@c3@"
  es: "@a@b*: Parece que uno de los hermanos ofreció cobijo a un poeta perdido.\n@c3@"
  fr: "@a@b*ⓢ Apparemment, l'un de nos frères a offert le gîte à un poète égaré.\n@c3@"
  it: "@a@b*: A quanto pare, uno dei fratelli ha offerto ospitalità a un poeta che aveva smarrito la strada.\n@c3@"
  ja: "@a@b＊「宿屋の主人が　道にまよっていた\n\t旅の詩人を　助けたそうだな。\n@c3@"
"25":
  de: "@a@b*: Er hat sich wohl verpflichtet gefühlt, einem Bedürftigen zu helfen, aber...\n@c3@"
  en: "@a@b*: I suppose he felt duty-bound to help a person in need, but...\n@c3@"
  es: "@a@b*: Imagino que se sintió obligado a socorrer a una persona necesitada, pero...\n@c3@"
  fr: "@a@b*ⓢ J'imagine qu'il s'est senti obligé d'aider une personne dans le besoin, mais...\n@c3@"
  it: "@a@b*: Immagino si sia sentito in dovere di aiutare una persona in difficoltà, ma non vorrei che avesse commesso un'imprudenza...\n@c3@"
  ja: "@a@b＊「あいつは　商売柄　宿に人を\n\t泊めたがっていたからなあ……。\n@c3@"
"26":
  de: "@a@b*: Ah, da bist du, %a00090. Heute wollte ich dir den Zauber ⓞZackⓟ zeigen.\n@c2@"
  en: "@a@b*: Ah, there you are, %a00090!\nToday I was planning to teach you how to perform the Zap spell!\n@c2@"
  es: "@a@b*: ¡Ah, ahí estás, %a00090!\n¡Hoy he pensado en enseñarte a realizar el conjuro Descarga!\n@c2@"
  fr: "@a@b*ⓢ Ah, te voilà, %a00090ⓠ\nAujourd'hui, j'avais prévu de t'apprendre à lancer le sort Foudreⓠ\n@c2@"
  it: "@a@b*: Ah, eccoti qui, %a00090!\nOggi voglio insegnarti a eseguire l'incantesimo Lampo!\n@c2@"
  ja: "@a@b＊「おお　よう来たな　%a00090よ。\n\t今日は　そなたに　ライデインの呪文を\n\t教えてしんぜよう！\n@c2@"
"27":
  de: "@a@b*: Aber du siehst hungrig aus. Auf leeren Magen kann man keine Magie lernen. Wir setzen den Unterricht fort, sobald du was gegessen hast.\n@c2@"
  en: "@a@b*: But you look hungry. You cannot learn magic on an empty stomach. We will commence the class after you've eaten.\n@c2@"
  es: "@a@b*: Pero pareces %A090%Xhambriento%Z%B090%Xhambrienta%Z. No se puede aprender magia con el estómago vacío. Comenzaremos la clase después de que hayas comido.\n@c2@"
  fr: "@a@b*ⓢ Mais tu as l'air d'avoir faim. Tu ne peux pas apprendre la magie l'estomac vide. Nous commencerons la leçon une fois que tu auras mangé.\n@c2@"
  it: "@a@b*: Che visino affamato, però! Non puoi imparare nessun incantesimo a stomaco vuoto. Inizieremo la lezione dopo che avrai mangiato.\n@c2@"
  ja: "@a@b＊「と　いきたいところだが　そなたは\n\t腹が減っているみたいだな……よし！\n\t授業は　飯を食ってからじゃ！\n@c2@"
"28":
  de: "@a@b*: Er hatte sich verlaufen, nicht wahr. Der reisende Dichter, meine ich. Und gestern Abend ist er auf unser Dorf gestoßen.\n@c2@"
  en: "@a@b*: He was lost, you see. The travelling poet, that is. And he happened to stumble upon the village last night.\n@c2@"
  es: "@a@b*: Estaba perdido, ¿sabes? El poeta ambulante, quiero decir. Y parece ser que anoche llegó al pueblo por casualidad.\n@c2@"
  fr: "@a@b*ⓢ Il était perdu, tu comprends. Le poète errant, je veux dire. Et la nuit dernière, il est tombé par hasard sur le village.\n@c2@"
  it: "@a@b*: Si era perso... Sto parlando del poeta viaggiatore. L'altra notte è capitato per caso nel nostro villaggio.\n@c2@"
  ja: "@a@b＊「じつは　ゆうべ　旅の詩人が\n\t迷いこんできましてな……。\n@c2@"
"29":
  de: "@a@b*: Ich ⓚⓛ ich war dumm. Ich habe gegen die Regeln des Dorfes verstoßen und ihm angeboten, bei mir zu übernachten.\n@c2@"
  en: "@a@b*: I, I was foolish. I broke village law and offered him a place to stay.\n@c2@"
  es: "@a@b*: Yo... fui un necio. Incumplí las leyes de la aldea y le ofrecí un sitio donde dormir.\n@c2@"
  fr: "@a@b*ⓢ Je... J'ai été stupide. J'ai enfreint la loi du village et je lui ai offert un toit pour dormir.\n@c2@"
  it: "@a@b*: S-sono stato uno sciocco. Ho infranto la legge della nostra comunità e gli ho offerto un posto per dormire.\n@c2@"
  ja: "@a@b＊「村のおきてを　やぶって\n\tつい　助けてしまったのです。\n@c2@"
"30":
  de: "@a@b*: Oh je... Ich hoffe, das war kein Fehler...\n@c2@"
  en: "@a@b*: Oh dear...\nI hope this does not lead to any misfortune...\n@c2@"
  es: "@a@b*: ¡Oh!, vaya...\nEspero que esto no acarree ninguna desgracia...\n@c2@"
  fr: "@a@b*ⓢ Oh là là...\nJ'espère que cela n'aura aucune conséquence malheureuse...\n@c2@"
  it: "@a@b*: Accidenti...\nSpero di non aver combinato un guaio...\n@c2@"
  ja: "@a@b＊「わざわいの種に\n\tならねばよいのですが……。\n@c2@"
"31":
  de: "@a@b*: Na so was. Ich hätte nicht damit gerechnet, in einem so winzigen Dorf %A090%Xeinem Jungen%Z%B090%Xeinem Mädchen%Z wie dir zu begegnen.\n@c3@"
  en: "@a@b*: Well, well...\nI would never have expected to find a %A090%Xboy%Z%B090%Xgirl%Z like you in a tiny village like this.\n@c3@"
  es: "@a@b*: Vaya, vaya...\nNunca hubiera imaginado encontrar %A090%Xun muchacho%Z%B090%Xuna muchacha%Z como tú en una diminuta aldea como esta.\n@c3@"
  fr: "@a@b*ⓢ Tiens, tiens...\nJe n'aurais jamais pensé croiser %A090%Xun garçon%Z%B090%Xune fille%Z comme toi dans un si petit village.\n@c3@"
  it: "@a@b*: Bene, bene...\nNon mi sarei mai aspettato di trovare %A090%Xun ragazzo%Z%B090%Xuna ragazza%Z come te in questo posto sperduto.\n@c3@"
  ja: "@a@b＊「ほほう……。\n\tこの村には　キミのような\n\t子供もいたのですか。\n@c3@"
"32":
  de: "@a@b*: Ich bin ein Dichter. Ich bin in den Bergen umhergereist, aber dann habe ich mich verlaufen und bin hier gelandet.\n@c3@"
  en: "@a@b*: I'm a poet. I was travelling in the mountains when I got lost and ended up here.\n@c3@"
  es: "@a@b*: Soy poeta. Viajaba por las montañas cuando me perdí y acabé aquí.\n@c3@"
  fr: "@a@b*ⓢ Je suis poète. Je voyageais dans les montagnes, mais je me suis perdu et j'ai atterri ici.\n@c3@"
  it: "@a@b*: Sono un poeta. Stavo viaggiando tra le montagne, ma mi sono perso e mi sono ritrovato qui.\n@c3@"
  ja: "@a@b＊「わたしは　旅の詩人。\n\t山道でまよってしまって\n\tこの村に　たどり着いたのです。\n@c3@"
"33":
  de: "@a@b*: Ich hatte ja keine Ahnung, dass es diesen Ort überhaupt gab. Interessant... Wirklich, sehr interessant...\n@c3@"
  en: "@a@b*: I had no idea this place even existed.\nInteresting... Most interesting...\n@c3@"
  es: "@a@b*: No tenía ni idea de que existiera este lugar.\nInteresante... Muy interesante...\n@c3@"
  fr: "@a@b*ⓢ Je n'imaginais même pas que cet endroit existait.\nC'est intéressant... très intéressant...\n@c3@"
  it: "@a@b*: Non immaginavo nemmeno che esistesse un luogo simile. Interessante. Molto interessante...\n@c3@"
  ja: "@a@b＊「しかし　こんな山奥に\n\tこのような村があったとは……。\n\tまったく　おどろかされましたよ。\n@c3@"
"34":
  de: "@a@b*: Hallo, %a00090. Was machst du denn im Lagerhaus des Dorfes?\n@c2@"
  en: "@a@b*: Hello, %a00090. What are you doing in the village storehouse?\n@c2@"
  es: "@a@b*: Hola, %a00090. ¿Qué estás haciendo en el almacén del pueblo?\n@c2@"
  fr: "@a@b*ⓢ Bonjour, %a00090. Que fais-tu dans l'entrepôt du villageⓡ\n@c2@"
  it: "@a@b*: Ciao, %a00090. Cosa ci fai nel magazzino del villaggio?\n@c2@"
  ja: "@a@b＊「おや　%a00090じゃないか。\n\tここは　村の倉庫だよ。\n@c2@"
"35":
  de: "@a@b*: Danke, %a00090. Möchtest du jetzt auch etwas essen?\n@c2@"
  en: "@a@b*: Thank you for that, %a00090.\nNow, would you like something to eat yourself?\n@c2@"
  es: "@a@b*: Gracias, %a00090.\n¿Te apetecería algo de comer?\n@c2@"
  fr: "@a@b*ⓢ Merci, %a00090.\nÀ présent, voudrais-tu manger, toi aussiⓡ\n@c2@"
  it: "@a@b*: Grazie, %a00090.\nTi va di mangiare adesso?\n@c2@"
  ja: "@a@b＊「おかえり　ご苦労だったね。\n\tじゃあ　お前もご飯にするかい？\n@c2@"
"36":
  de: "@a@b*: Dann setz dich hin. Ich bringe dir etwas.\n@c2@"
  en: "@a@b*: Then sit down there and I'll bring something over for you.\n@c2@"
  es: "@a@b*: Siéntate allí y te prepararé algo.\n@c2@"
  fr: "@a@b*ⓢ Alors assieds-toi, je vais t'apporter quelque chose.\n@c2@"
  it: "@a@b*: Siediti lì, ti porto subito qualcosa. \n@c2@"
  ja: "@a@b＊「じゃあ　そこにお座り。\n\tすぐに　したくをするから。\n@c2@"
"37":
  de: "@a@b*: Schnell! Schnell!\nSie sind hier!\n@c2@"
  en: "@a@b*: Quick! Quick!\nThey're here!\n@c2@"
  es: "@a@b*: ¡Rápido! ¡Deprisa!\n¡Están aquí!\n@c2@"
  fr: "@a@b*ⓢ Viteⓠ Viteⓠ\nIls sont làⓠ\n@c2@"
  it: "@a@b*: Aiuto! Presto!\nSono arrivati!\n@c2@"
  ja: "@a@b＊「大変だ　大変だ！\n@c2@"
"38":
  de: "@a@b*: Die ⓚⓛ die Monster haben uns gefunden! Sie sind direkt vor dem Dorf!\n@c2@"
  en: "@a@b*: The, the monsters have found us!\nThey're just outside the village!\n@c2@"
  es: "@a@b*: ¡Los monstruos nos han encontrado!\n¡Están a las afueras del pueblo!\n@c2@"
  fr: "@a@b*ⓢ Les... Les monstres nous ont trouvésⓠ\nIls sont juste devant le villageⓠ\n@c2@"
  it: "@a@b*: I... I mostri ci hanno trovato!\nSono poco fuori dal villaggio!\n@c2@"
  ja: "@a@b＊「つ　ついに　この村が\n\t魔物たちに見つかったんです！\n\tやつらは　村のすぐそばまで来てて！\n@c2@"
"39":
  de: "@a@b*: Was?!\n%0%a00090! Los, lauf sofort weg und versteck dich! Kümmere dich nicht um mich! Lauf!\n@c2@"
  en: "@a@b*: What!?\n%0%a00090! Run away and hide at once!\nDon't worry about me. Just go!\n@c2@"
  es: "@a@b*: ¡¿Qué?!\n¡%0%a00090! ¡Corre y escóndete, rápido!\nNo te preocupes por mí. ¡Vete!\n@c2@"
  fr: "@a@b*ⓢ Quoiⓠⓑ\n%0%a00090ⓠ Fuis, va te cacher immédiatementⓠ\nNe t'inquiète pas pour moi. Pars viteⓠ\n@c2@"
  it: "@a@b*: Cosa?!?\n%0%a00090! Corri subito a nasconderti!\nNon preoccuparti per me. Scappa!\n@c2@"
  ja: "@a@b＊「なんですって！　%a00090や\n\tわたしのことは　いいから\n\tすぐに　お逃げ！　さあ急いで！\n@c2@"
"40":
  de: "@a@b*: Komm mit, %a00090!\n@c2@"
  en: "@a@b*: Follow me, %a00090!\n@c2@"
  es: "@a@b*: ¡Sígueme, %a00090!\n@c2@"
  fr: "@a@b*ⓢ Suis-moi, %a00090ⓠ\n@c2@"
  it: "@a@b*: Seguimi, %a00090!\n@c2@"
  ja: "@a@b＊「さあ　私に　ついてきてください！\n@c2@"
"41":
  de: "@a@b*: Gut, warum spielst du dann nicht noch ein wenig.\n@c2@"
  en: "@a@b*: Very well. Why don't you play a while longer, then.\n@c2@"
  es: "@a@b*: Muy bien. Entonces, ve a jugar un rato más.\n@c2@"
  fr: "@a@b*ⓢ Très bien.\nDans ce cas, tu peux jouer encore un peu.\n@c2@"
  it: "@a@b*: Molto bene. Allora continua pure a giocare.\n@c2@"
  ja: "@a@b＊「そうかい。\n\tじゃあ　もう少し遊んどいで。\n@c2@"
"42":
  de: "@a@b*: Wir halten die Ungeheuer so lange es geht in Schach. Bringt %a00090 in das Versteck!\n@c2@"
  en: "@a@b*: We'll keep the monsters at bay for as long as we can. Take %a00090 to the safe haven!\n@c2@"
  es: "@a@b*: Mantendremos a los monstruos a raya lo máximo posible. ¡Lleva a %a00090 al refugio!\n@c2@"
  fr: "@a@b*ⓢ Nous allons tenir les monstres en respect aussi longtemps que possible.\nEmmenez %a00090 en lieu sûrⓠ\n@c2@"
  it: "@a@b*: Terremo lontani i mostri finché potremo. Porta %a00090 al sicuro!\n@c2@"
  ja: "@a@b＊「魔物は　オレたちで　くい止める！\n\t%a00090を　早く　安全なところへ！\n@c2@"
"43":
  de: "@aElisa@bOh, %a00090!\nWenn dir etwas geschehen würde, würde ich...\n@c1@"
  en: "@aEliza@bOh, %a00090!\nIf anything were to happen to you, I, I...\n@c1@"
  es: "@aElisa@b¡Oh, %a00090!\nSi te llegara a ocurrir algo, yo, yo...\n@c1@"
  fr: "@aÉlisa@bOh, %a00090ⓠ\nS'il devait t'arriver quelque chose, je... je...\n@c1@"
  it: "@aElisa@bOh, %a00090!\nSe ti dovesse capitare qualcosa io, io...\n@c1@"
  ja: "@a@bシンシア「%a00090！\n\tあなたに　もしもの事があったら\n\tわたし……。\n@c1@"
"44":
  de: "@aElisa@bVersteck dich einfach! Schnell!\nIch komme sofort nach.\n@c1@"
  en: "@aEliza@bJust hide! Quickly!\nI'll join you in a moment.\n@c1@"
  es: "@aElisa@b¡Escóndete! ¡Rápido!\nEstaré contigo enseguida.\n@c1@"
  fr: "@aÉlisa@bCache-toiⓠ Viteⓠ\nJe te rejoins dans un instant.\n@c1@"
  it: "@aElisa@bNasconditi! Presto!\nIo ti raggiungerò tra poco.\n@c1@"
  ja: "@a@bシンシア「とにかく　かくれて！\n\tわたしも　すぐに行くから！\n@c1@"
"45":
  de: "@a@b*: Verfluchte Ungeheuer!\nAm Ende haben sie doch noch herausgefunden, wo wir dich versteckt haben, %a00090!\n@c2@"
  en: "@a@b*: Curse these monsters!\nThey've finally found where we've been hiding you, %a00090.\n@c2@"
  es: "@a@b*: ¡Malditos monstruos!\nHan conseguido encontrar el lugar donde te ocultábamos, %a00090.\n@c2@"
  fr: "@a@b*ⓢ Maudits soient ces monstresⓠ\nIls ont fini par découvrir l'endroit où nous te cachions, %a00090.\n@c2@"
  it: "@a@b*: Maledetti mostri!\nHanno scoperto il luogo in cui ti avevamo %A090%Xnascosto%Z%B090%Xnascosta%Z, %a00090.\n@c2@"
  ja: "@a@b＊「くそー！　魔物どもめ！\n\tついに　%a00090の居場所を\n\tつきとめたか！\n@c2@"
"46":
  de: "@a@b*: Ausgerechnet jetzt!\nNur noch ein Weilchen, und wir hätten %A090%Xeinen großen Helden%Z%B090%Xeine große Heldin%Z aus dir gemacht!\n@c2@"
  en: "@a@b*: Why now, of all times!? Just a little while longer, and we could have made a great %A090%Xhero%Z%B090%Xheroine%Z out of you!\n@c2@"
  es: "@a@b*: ¿Por qué ahora? ¡Si hubiéramos tenido más tiempo, habríamos conseguido convertirte en %A090%Xun gran héroe%Z%B090%Xuna gran heroína%Z!\n@c2@"
  fr: "@a@b*ⓢ Pourquoi justement maintenantⓠⓑ D'ici très peu de temps, nous aurions pu faire de toi %A090%Xun grand héros%Z%B090%Xune grande héroïne%Zⓠ\n@c2@"
  it: "@a@b*: Perché proprio adesso?!? Ancora un po' e saresti %A090%Xdiventato un eroe%Z%B090%Xdiventata un'eroina%Z invincibile!\n@c2@"
  ja: "@a@b＊「もう少し　時間があれば\n\t%a00090を　りっぱな勇者に\n\t育てられたものをっ！\n@c2@"
"47":
  de: "@a@b*: Komm mit, %a00090.\n@c2@"
  en: "@a@b*: Come. Follow me, %a00090.\n@c2@"
  es: "@a@b*: Acércate. Sígueme, %a00090.\n@c2@"
  fr: "@a@b*ⓢ Viens. Suis-moi, %a00090.\n@c2@"
  it: "@a@b*: Vieni. Seguimi, %a00090.\n@c2@"
  ja: "@a@b＊「ついてこい　%a00090！\n@c2@"
"48":
  de: "@a@b*: Es ist soweit, %a00090.\nJetzt erfüllt sich dein Schicksal.\n@c2@"
  en: "@a@b*: The time has come, %a00090.\nYour destiny is upon you now.\n@c2@"
  es: "@a@b*: Ha llegado el momento, %a00090.\nAhora tu destino está en tus manos.\n@c2@"
  fr: "@a@b*ⓢ L'heure est venue, %a00090.\nTon destin va désormais s'accomplir.\n@c2@"
  it: "@a@b*: Il momento è arrivato, %a00090.\nIl tuo destino ti attende.\n@c2@"
  ja: "@a@b＊「%a00090や\n\tついに　来るべき時が来たようだ。\n@c2@"
"49":
  de: "@a@b*: Bis heute haben wir dich vor der Wahrheit geschützt. Aber nun musst du es erfahren. Wir sind nicht deine richtigen Eltern.\n@c2@"
  en: "@a@b*: We have protected you from the truth until today. But now it has come to this, you must know. We... We are not your true parents.\n@c2@"
  es: "@a@b*: Te hemos protegido de la verdad hasta hoy. Pero tienes que saberlo, ha llegado el momento. Nosotros... no somos tus verdaderos padres.\n@c2@"
  fr: "@a@b*ⓢ Nous t'avons %A090%Xprotégé%Z%B090%Xprotégée%Z de la vérité jusqu'à ce jour. Mais vu la situation, tu dois savoir. Nous... Nous ne sommes pas tes vrais parents.\n@c2@"
  it: "@a@b*: Ti abbiamo protetto dalla verità fino a oggi, ma è giunto il momento che tu sappia come stanno realmente le cose.\n㈡\n*: Noi... Noi non siamo i tuoi veri genitori.\n@c2@"
  ja: "@a@b＊「今まで　黙っていたが\n\tわしたち夫婦は　お前の本当の\n\t親ではなかったのだ。\n@c2@"
"50":
  de: "@a@b*: Ich wünschte, ich könnte dir alles erklären, aber die Zeit reicht nicht. Du musst dich verstecken! Sofort!\n@c2@"
  en: "@a@b*: I wish I could explain everything to you, but there is no time.\nYou must hide yourself! At once!\n@c2@"
  es: "@a@b*: Me gustaría poder explicártelo todo, pero no hay tiempo.\n¡Debes ocultarte! ¡Enseguida!\n@c2@"
  fr: "@a@b*ⓢ J'aimerais pouvoir tout t'expliquer, mais je n'en ai pas le temps.\nTu dois te cacherⓠ Tout de suiteⓠ\n@c2@"
  it: "@a@b*: Vorrei poterti spiegare tutto, ma non c'è tempo. Devi nasconderti! Subito!\n@c2@"
  ja: "@a@b＊「くわしい話をしたいが\n\t今は時間がない……。\n\tさあ早く　かくれるんだ！\n@c2@"
"51":
  de: "@a@b*: Die Ungeheuer greifen an?!\nDann zu den Waffen!\n@c2@"
  en: "@a@b*: The monsters are attacking!?\nThen we must take up arms!\n@c2@"
  es: "@a@b*: ¡Los monstruos nos atacan!\n¡A las armas!\n@c2@"
  fr: "@a@b*ⓢ Les monstres attaquentⓠⓑ\nAlors nous devons prendre les armesⓠ\n@c2@"
  it: "@a@b*: I mostri stanno attaccando?!?\nPresto! Prendiamo le armi!\n@c2@"
  ja: "@a@b＊「どっひゃー！\n\t魔物が　攻めてきたって！？\n\tそれじゃ　戦わなくては！\n@c2@"
"52":
  de: "@a@b*: Hör gut zu, %a00090...\nDie Ungeheuer sind hier, um dich ums Leben zu bringen. Denn du wirst ihr Untergang sein.\n@c2@"
  en: "@a@b*: Listen well, %a00090...\nThe monsters are here to take your life,\nfor you are their nemesis.\n@c2@"
  es: "@a@b*: Escucha atentamente, %a00090...\nLos monstruos pretenden acabar con tu vida.\nPorque tú eres su peor %A090%Xenemigo%Z%B090%Xenemiga%Z.\n@c2@"
  fr: "@a@b*ⓢ Écoute-moi bien, %a00090...\nLes monstres sont ici pour te tuer.\nCar tu es leur %A090%Xennemi%Z%B090%Xennemie%Z.\n@c2@"
  it: "@a@b*: Ascoltami bene, %a00090...\nI mostri sono qui per ucciderti, perché tu sei %A090%Xl'eroe%Z%B090%Xl'eroina%Z che può sconfiggerli.\n@c2@"
  ja: "@a@b＊「いいか　よく聞け　%a00090。\n\t魔物どものねらいは　お前の命！\n\t魔物どもは　お前がめざわりなのだ。\n@c2@"
"53":
  de: "@a@b*: Du besitzt eine geheime Kraft. Eines Tages wirst du stark genug sein, um alles und jeden zu besiegen. Nichts Böses wird dir etwas anhaben können.\n@c2@"
  en: "@a@b*: You have a secret power. You will one day be strong enough to defeat anyone or anything. No evil will overpower you.\n@c2@"
  es: "@a@b*: Tienes un poder secreto. Un día, serás lo bastante fuerte como para derrotar a cualquiera o a cualquier cosa. Ningún poder maligno podrá contigo.\n@c2@"
  fr: "@a@b*ⓢ Tu possèdes un pouvoir secret. Tu seras un jour assez %A090%Xfort%Z%B090%Xforte%Z pour vaincre n'importe qui ou n'importe quoi.\n㈡\n*ⓢ Aucune puissance maléfique ne te surpassera.\n@c2@"
  it: "@a@b*: Tu disponi di un potere segreto. Un giorno sarai tanto forte da poter battere chiunque. Tu sconfiggerai il male.\n@c2@"
  ja: "@a@b＊「お前には　秘められたチカラがある。\n\tいつの日か　どんな邪悪な者でも\n\t倒せるぐらい　強くなるだろう。\n@c2@"
"54":
  de: "@a@b*: Aber jetzt bist du noch zu schwach. Du musst fliehen und am Leben bleiben, bis du stark genug bist, um den Kampf aufzunehmen.\n@c2@"
  en: "@a@b*: But for now, you are still weak.\nYou must run, and you must stay alive until you are strong enough to fulfil your destiny.\n@c2@"
  es: "@a@b*: Pero todavía eres débil.\nDebes huir y permanecer con vida hasta que seas lo bastante fuerte para cumplir tu destino.\n@c2@"
  fr: "@a@b*ⓢ Mais tu es encore faible, pour l'instant.\nTu dois fuir et rester en vie jusqu'à ce que tu sois assez %A090%Xpuissant%Z%B090%Xpuissante%Z pour accomplir ta destinée.\n@c2@"
  it: "@a@b*: Ma ora sei ancora troppo debole.\nDevi scappare e rimanere in vita finché non sarai sufficientemente forte da seguire il tuo destino.\n@c2@"
  ja: "@a@b＊「しかし　今のお前は　まだ弱い。\n\tとにかく　逃げて　生きのびるのだ！\n@c2@"
"55":
  de: "@a@b*: Darum gebe ich dir dies. Es wird dir bei deiner bevorstehenden Aufgabe gute Dienste leisten.\n@c2@"
  en: "@a@b*: So, I am giving you this.\nIt will prove invaluable in the quest you are about to embark upon.\n@c2@"
  es: "@a@b*: Por eso debes tener esto.\nSerá muy valioso para la misión que estás a punto de emprender.\n@c2@"
