  es: "@aFu Yung@b¿Eso, quién...?\n@c2@"
  fr: "@aCent-ans@bJe me le dœumande...\n@c2@"
  it: "@aHovo@bDev'essere un vero pollo!\n@c2@"
  ja: "@a@bエッグラ「さあ……？\n@c2@"
"63":
  de: "@a@b*: Das ist aber schade. Dann muss ich wohl noch ein Weilchen länger hier im Vulkan leben.\n@c2@"
  en: "@a@b*: Oh, that's a shame. I suppose I'll just have to stay here in the volcano a while longer then.\n@c2@"
  es: "@a@b*: Vaya, qué lástima. Supongo que tendré que quedarme un tiempo más aquí en el volcán.\n@c2@"
  fr: "@a@b*ⓢ Oh, quel dommage. Alors je vais sans doute devoir rester ici, dans le volcan, un peu plus longtemps.\n@c2@"
  it: "@a@b*: Oh, che peccato! Temo che mi toccherà rimanere in questo vulcano ancora per un po' di tempo...\n@c2@"
  ja: "@a@b＊「そうか。　やはりな。\n\tしかたない。　では　今しばらく\n\tこの火山に　いるとしよう。\n@c2@"
"64":
  de: "@aFu Yung@bEi, ei, ei, wie lange er wohl in dem Bild gewohnt hat...? Oh weia!\nIch hätte Miete von ihm verlangen sollen!\n@c3@"
  en: "@aFoo Yung@bI wonder how long he was living there in the picture. I'm foorious!\nI should have charged him rent!\n@c3@"
  es: "@aFu Yung@bMe pregunto cuánto tiempo llevaba viviendo en el cuadro. ¡Estoy a punto de nieve!\n¡Debí haberle cobrado alquiler!\n@c3@"
  fr: "@aCent-ans@bJe me dœumande depuis combien de temps il vivait dans ce tableau. Je suis furiœuxⓠ\nJ'aurais dû lui faire payer un loyerⓠ\n@c3@"
  it: "@aHovo@bChissà da quanto tempo viveva in quell'immagine! Sono furiovoso! Avrei dovuto fargli pagare l'affitto!\n@c3@"
  ja: "@a@bエッグラ「いつのまに　絵の中に\n\t住みついてたんだ？\n\t家賃を　もらいそこねたぞ。\n@c3@"
"65":
  de: "@aChow Mein@bDer Kerl hat wenigstens keine Federn gelassen!\n@c3@"
  en: "@aChow Mein@bThat character's a real henigma, right to the hend.\n@c3@"
  es: "@aChow Mein@bEse personaje es un verdadero enigma. Me pone la piel de gallina.\n@c3@"
  fr: "@aCinq-épices@bCe personnage est un vrai mystère.\n@c3@"
  it: "@aGalinho@bQuel tizio è co-co-così strano...\nÈ davvero fuori di cresta!\n@c3@"
  ja: "@a@bチキーラ「あいつ　最後まで\n\tわけのわからんヤツだったな。\n@c3@"
"66":
  de: "@a@b*: Hmm. Hört sich nicht so an, als ob diese Stadt was für mich wäre. Vielleicht wenn's dort ein Schloss gäbe oder so was... Dann würd ich drüber nachdenken.\n@c3@"
  en: "@a@b*: Hmm...it doesn't seem like my kind of town really. Maybe if it had a castle or something like that, I might think about it...\n@c3@"
  es: "@a@b*: Mmm... No parece mi tipo de ciudad, la verdad. Quizás si tuviese un castillo o algo me lo pensaría...\n@c3@"
  fr: "@a@b*ⓢ Mmm... Ça n'a pas vraiment l'air d'être mon genre de ville. Peut-être que s'il y avait un château, ou quelque chose comme ça, j'y réfléchirais...\n@c3@"
  it: "@a@b*: Uhm... Questo posto non mi piace un granché. Però, se ci fosse un castello o qualcosa del genere, potrei farci un pensierino...\n@c3@"
  ja: "@a@b＊「なにやら　チンプそうな町だな。\n\tその町が　城にでもなったら\n\t考えんでもないが……。\n@c3@"
"67":
  de: "@aChow Mein@bHm... Eier sind doch nicht so faul, wie ich immer gedacht hab.\n@c3@"
  en: "@aChow Mein@bAh, so... I find that I must eat crow. I finally see that eggs are also not without merit.\n@c3@"
  es: "@aChow Mein@b¡Ah!, bien... Creo que me tragaré mi propio cacareo. Por fin me he percatado de que los huevos no son tan perjudiciales.\n@c3@"
  fr: "@aCinq-épices@bAh, bien... Je crois que je vais arrêter d'être fier comme un coq. Je comprends enfin que les œufs ne sont pas dépourvus de mérite.\n@c3@"
  it: "@aGalinho@bE co-così mi tocca ingoiare il rospo... Devo ammettere che anche le uova valgono qualco-co-cosa.\n@c3@"
  ja: "@a@bチキーラ「うーむ……よくよく聞けば\n\tタマゴというのも　なかなか。\n@c3@"
"68":
  de: "@aFu Yung@bUnd ich weiß jetzt, dass ihr aufgescheuchten Hühner auch ganz schön süß sein könnt. Das ist ja zum aus der Schale fahren!\n@c3@"
  en: "@aFoo Yung@bAnd I see that the sour looking chicken can actually be quite sweet. Truly, one must not put all of one's eggs in one basket.\n@c3@"
  es: "@aFu Yung@bY yo me he dado cuenta de que gallina ponedora vale por dos. En verdad no se deben poner todos los huevos en la misma cesta.\n@c3@"
  fr: "@aCent-ans@bEt je vois que le poulet à l'air aigre peut en fait être assez doux. Il ne faut vraiment pas mettre tous ses œufs dans le même panier.\n@c3@"
  it: "@aHovo@bEh sì... E io ammetto che persino le galline inacidite possono rivelarsi dovolci. Non si deve mai fare di tutta l'erba un guscio!\n@c3@"
  ja: "@a@bエッグラ「いやいや　ニワトリこそ\n\tこれほど美しいものとは\n\t気付かなかったぞ！\n@c3@"
"69":
  de: "@aChow Mein@b... Was?\n@c3@"
  en: "@aChow Mein@b...Wok?\n@c3@"
  es: "@aChow Mein@b... ¿Qué?\n@c3@"
  fr: "@aCinq-épices@b... Heinⓡ\n@c3@"
  it: "@aGalinho@bCo-cosa...?\n@c3@"
  ja: "@a@bチキーラ「……ん？\n@c3@"
"70":
  de: "@aFu Yung@bWas?!\n@c3@"
  en: "@aFoo Yung@bWok!?\n@c3@"
  es: "@aFu Yung@b¡¿Cómo?!\n@c3@"
  fr: "@aCent-ans@bHeinⓠⓑ\n@c3@"
  it: "@aHovo@bCosa?!\n@c3@"
  ja: "@a@bエッグラ「んん？\n@c3@"
"71":
  de: "@aFu Yung@bAh, welch günstiger Zeitpunkt! Endlich haben unsere Diskussionen ein Ei-nde gefunden!\n@c3@"
  en: "@aFoo Yung@bAh, what fortunate timing! Finally our philosophies are in eggquilibrium.\n@c3@"
  es: "@aFu Yung@b¡Vaya, qué momento más oportuno! Por fin nuestras filosofías están en equilibrio.\n@c3@"
  fr: "@aCent-ans@bAh, vous ne pouviez pas miœux tomber.\nNous avons enfin réussi à nous mettre d'accord.\n@c3@"
  it: "@aHovo@bOh, che tempuovismo perfetto! Le nostre teorie hanno raggiunto un punto d'equilibrio.\n@c3@"
  ja: "@a@bエッグラ「おお！　ちょうどいい所に来た！\n\t今　ふたりの意見が\n\tようやく　一致したのだ！\n@c3@"
"72":
  de: "@aChow Mein@bEier sind toll und Hennen ebenso! Das ist eine unumstritte Tatsache!\n@c3@"
  en: "@aChow Mein@bEggs are honourable! Chickens are honourable! These are the two undeniable facts of our world!\n@c3@"
  es: "@aChow Mein@b¡Los huevos son honorables! ¡Los pollos son honorables! ¡Estos son los dos hechos irrefutables en nuestro mundo!\n@c3@"
  fr: "@aCinq-épices@bLes œufs sont honorablesⓠ Les poulets sont honorablesⓠ Ce sont là deux faits indéniables de notre mondeⓠ\n@c3@"
  it: "@aGalinho@bLe uova sono inco-confutabilmente importanti! Le galline sono inco-confutabilmente importanti! Questi due assunti sono innegabili!\n@c3@"
  ja: "@a@bチキーラ「タマゴも　えらいっ！\n\tニワトリも　えらいっ！\n\tこれが世界の真理だ！　わははっ。\n@c3@"
"73":
  de: "@aChow Mein@bUnd wer das nicht einsieht, ist ein dummes Huhn.\n@c3@"
  en: "@aChow Mein@b...Or words to that effect.\nHe who cannot agree with his henemies is controlled by them, after all.\n@c3@"
  es: "@aChow Mein@b... Unas palabras que vienen a colación.\nAlcanzar un acuerdo con tus enemigos no significa que seas un gallina.\n@c3@"
  fr: "@aCinq-épices@b... Et c'est donc la fin de nos maux, ou de nos mots, en l'occurrence.\n㈡\nAprès tout, celui qui ne peut s'accorder avec ses ennemis est sous leur contrôle.\n@c3@"
  it: "@aGalinho@bDopotutto, co-colui che non è in grado di acco-co-cordarsi con il nemico finisce spiumato!\n@c3@"
  ja: "@a@bチキーラ「……というわけで　だな。\n@c3@"
"74":
  de: "@aFu Yung@bStimmt. Obwohl es mich natürlich schon ei wenig traurig stimmt, dass wir jetzt keinen Grund mehr zum Kämpfen haben...\n@c3@"
  en: "@aFoo Yung@bTrue. Though it is becoming eggstremely tedious now we no longer have reason to fight each other...\n@c3@"
  es: "@aFu Yung@bCierto. Aunque lo de no tener de qué discutir no cuajará...\n@c3@"
  fr: "@aCent-ans@bExact. Mais ça devient quand même très ennuyœux de n'avoir plus aucune raison de nous affronter l'un l'autre...\n@c3@"
  it: "@aHovo@bEsatto... Anche se devo dire che mi annoio muovolto, ora che non abbiamo più un motivo per cuovombattere...\n@c3@"
  ja: "@a@bエッグラ「ケンカのネタがなくなって\n\tたいくつしていた所なんだ。\n@c3@"
"75":
  de: "@aFu Yung & Chow Mein@bAh! Aber wir können gegen %H860%Xdich%Yeuch%Z kämpfen! Das wird ei großer Spaß! Auf in den Kampf!\n@c3@"
  en: "@aFoo Yung & Chow Mein@bAh! We can fight you! Don't be chicken now!\nWe'll eggsterminate you nice and painlessly.\nChop chop!\n@c3@"
  es: "@aFu Yung y Chow Mein@b¡Ah! ¡Podemos discutir con%H860%Xtigo%Y %R000%Xvosotras%Yvosotros%Z%Z! ¡No %H860%Xseas gallina%Yseáis gallinas%Z! %H860%XTe%YOs%Z retorceremos el pescuezo sin ningún dolor. ¡Al ataque!\n@c3@"
  fr: "@aCent-ans et Cinq-épices@bAhⓠ Mais nous pouvons vous affronter, vousⓠ Ne jouez pas les poules mouilléesⓠ Nous vous réduirons en omelette, mais vous ne souffrirez pas. Hop hopⓠ\n@c3@"
  it: "@aHovo e Galinho@bEhi! Ma possiamo combattere contro di %H860%Xte%Yvoi%Z! Non %H860%Xfare il pollo%Yfate i polli%Z!\n㈡\n%H860%XTi%YVi%Z spiumeremo! Sarà facile come preparare un uovo al tegamino! Non perdiamo altro tempo!\n@c3@"
  ja: "@a@bエッグラとチキーラ「さあ！\n\tせっかく　ここまで来たんだ！\n\tわしらと　戦おう！\n@c3@"
"76":
  de: "@aChow Mein@bAah... Das war ein hennenmäßig starker Kampf, Fu Yung.\n@c3@"
  en: "@aChow Mein@bAah... That was a very henjoyable battle, Foo Yung.\n@c3@"
  es: "@aChow Mein@bAh... Ha sido una auténtica pelea de gallos, Fu Yung.\n@c3@"
  fr: "@aCinq-épices@bAh... C'était vraiment un combat très agréable, Cent-ans.\n@c3@"
  it: "@aGalinho@bCo-co-co... Che battaglia divertente, Hovo!\n@c3@"
  ja: "@a@bチキーラ「はあはあ……。\n\tいやーっ　いい戦いだったな！\n@c3@"
"77":
  de: "@aFu Yung@bJa, Chow Mein. Und %H860%X%A120%Xer hat%Z%B120%Xsie hat%Z%Ysie haben%Z das Ganze in %a00740 Runden hinter sich gebracht.\n@c3@"
  en: "@aFoo Yung@bYes, Chow Mein.\nAnd %H860%X%A120%Xhe%Z%B120%Xshe%Z%Ythey%Z cracked it in %a00740 turns this time.\n@c3@"
  es: "@aFu Yung@bAsí es, Chow Mein.\nY %H860%X%A120%Xél%Z%B120%Xella%Z lo ha conseguido%Y%R000%Xellas%Yellos%Z lo han conseguido%Z en %a00740 turnos esta vez.\n@c3@"
  fr: "@aCent-ans@bOui, Cinq-Épices. Et cette fois, %H860%X%A120%Xil a%Z%B120%Xelle a%Z%Y%R000%Xelles ont%Yils ont%Z%Z réussi en %a00740 tours.\n@c3@"
  it: "@aHovo@bProprio covosì, Galinho. Questa volta %H860%Xce l'ha fatta%Yce l'hanno fatta%Z in %a00740 turni.\n@c3@"
  ja: "@a@bエッグラ「うむ！　今回は\n\t%a00740ターン　だったな！\n@c3@"
"78":
  de: "@aChow Mein@bStimmt, %H860%Xdu hast%Yihr habt%Z den Stall ganz schön aufgemischt. Vielleicht sieht man sich ja mal wieder.\n@c3@"
  en: "@aChow Mein@bTruly, you rule the roost. I hope you will wing your way back to us again soon.\n@c3@"
  es: "@aChow Mein@bEn verdad, %H860%Xllevas%Ylleváis%Z la voz cantante. Espero que %H860%Xvuelvas%Yvolváis%Z a visitarnos volando muy pronto.\n@c3@"
  fr: "@aCinq-épices@bSincèrement, vous êtes de la graine des héros.\nJ'espère que vous reviendrez nous voir bientôt à tire-d'aile.\n@c3@"
  it: "@aGalinho@b%H860%XSei un vero gallo%YSiete dei veri galli%Z! Spero che %H860%Xtornerai%Ytornerete%Z presto a farci visita!\n@c3@"
  ja: "@a@bチキーラ「おまえは　いいヤツだ。\n\tちょくちょく遊びに来いよ！\n@c3@"
"79":
  de: "@aFu Yung@bEi, ei, ei! Eixakt dasselbe wollte ich auch gerade sagen.\n@c3@"
  en: "@aFoo Yung@bFoo! That is eggsactly what I was about to say.\n@c3@"
  es: "@aFu Yung@b¡Me tienes frito! Me has quitado las palabras de la cáscara.\n@c3@"
  fr: "@aCent-ans@bTsssⓠ Je n'aurais pas dit miœux.\n@c3@"
  it: "@aHovo@bPer tutte le uova del pollaio! Stavo per dire la stessa cosa!\n@c3@"
  ja: "@a@bエッグラ「ずるいぞ！　ワシが先に\n\t言おうと思ってたのに！\n@c3@"
"80":
  de: "@aChow Mein@b%H860%XVergiss%YVergesst%Z mich, den Hahn im Korb, nicht!\n@c3@"
  en: "@aChow Mein@bRemember the greatness of I, the one who is hentranced by the pluck of chickens!\n@c3@"
  es: "@aChow Mein@bNo %H860%Xolvides%Yolvidéis%Z la grandeza de mi ser, ¡la gallina más turuleta del gallinero!\n@c3@"
  fr: "@aCinq-épices@bSouvenez-vous de ma grandeur, moi qui par mon courage, vous ai donné la chair de pouleⓠ\n@c3@"
  it: "@aGalinho@bE non %H860%Xti sco-cordare%Ysco-cordatevi%Z di me... Co-co-colui che sostiene la supremazia delle galline!\n@c3@"
  ja: "@a@bチキーラ「ニワトリが　大好きなワシも\n\tすごーく　いいヤツだと\n\t覚えておけよ！\n@c3@"
"81":
  de: "@aFu Yung@bUnd mich erst recht nicht, ich, der die Eixellenz von Eiern verkörpert!\n@c3@"
  en: "@aFoo Yung@bNot forgetting the greatness of I, the one who admires the eggshellence of eggs!\n@c3@"
  es: "@aFu Yung@bSin olvidar la yema de mi ser, ¡el huevo más duro!\n@c3@"
  fr: "@aCent-ans@bSans oublier ma grandeur à moi, qui n'ai jamais froid aux yœuxⓠ\n@c3@"
  it: "@aHovo@bE non %H860%Xscovordarti%Yscovordatevi%Z di me... Colui che sostiene l'eccellenza delle uova!\n@c3@"
  ja: "@a@bエッグラ「それを言うなら\n\tタマゴが大好きな　ワシもだ！\n\tわははっ。\n@c3@"
"82":
  de: "@aFu Yung@bAuf dass %H860%Xdu deine Heimreise sicher und ohne Schalenbruch überstehst%Yihr eure Heimreise sicher und ohne Schalenbruch übersteht%Z.\n@c3@"
  en: "@aFoo Yung@bMay your journey be eggstra safe and prosperous.\n@c3@"
  es: "@aFu Yung@bQue %H860%Xtu%Yvuestro%Z viaje sea seguro y %H860%Xte%Yos%Z proporcione un huevo de prosperidad.\n@c3@"
  fr: "@aCent-ans@bPuisse votre voyage se dérouler dans la sécurité et la prospérité.\n@c3@"
  it: "@aHovo@bChe il %H860%Xtuo%Yvostro%Z viaggio sia felice e sicuruovoso!\n@c3@"
  ja: "@a@bエッグラ「じゃあな！　気をつけて帰れよ！\n@c3@"
"83":
  de: "@aFu Yung@bUnd %H860%Xdenk%Ydenkt%Z daran, ab und zu die eißergewöhnliche Schönheit des Eis zu bewundern.\n@c3@"
  en: "@aFoo Yung@bIt would be wise to occasionally consider the eggstraordinary beauty that is an egg.\n@c3@"
  es: "@aFu Yung@bEn ocasiones, es sabio considerar la extraordinaria belleza que encierra un huevo.\n@c3@"
  fr: "@aCent-ans@bIl serait sage de considérer de temps à autre la beauté extraordinaire qui émane d'un œuf.\n@c3@"
  it: "@aHovo@bSarebbe saggio considerare, di tanto in tanto, l'estrema impovortanza delle uova!\n@c3@"
  ja: "@a@bエッグラ「たまには　タマゴの美について\n\t考えてみると　いいぞ。\n@c3@"
"84":
  de: "@aFu Yung@bEier symbolisieren das Gute in dieser Welt. Eier sind rein, Eier sind fein. Und alle Eier sind gute Eier!\n@c3@"
  en: "@aFoo Yung@bEggs symbolise all that is good in this world.\nEggs are pure. Eggs are truth.\nAll eggs are good eggs!\n@c3@"
  es: "@aFu Yung@bLos huevos simbolizan todo lo bueno que hay en este mundo. Los huevos son duros. Los huevos son frescos. ¡No hay huevo malo!\n@c3@"
  fr: "@aCent-ans@bLes œufs symbolisent tout ce qu'il y a de bon dans ce monde. Les œufs sont purs, les œufs sont vrais.\nIl n'y a pas de mauvais œufsⓠ\n@c3@"
  it: "@aHovo@bLe uova ingusciano quanto c'è di meglio a questo mondo. Le uova sono pure e genuine, non c'è niente di meglio!\n@c3@"
  ja: "@a@bエッグラ「タマゴは　世界の美のすべて。\n\tタマゴは　真実。\n\tタマゴこそ最高なのだ！　わははっ。\n@c3@"
"85":
  de: "@aChow Mein@bZweifelsohne gilt %H860%Xdeine%Yeure%Z wahre Vorliebe den Hennen.\n@c3@"
  en: "@aChow Mein@bNo doubt your true preference is really for chickens.\n@c3@"
  es: "@aChow Mein@bEn realidad, %H860%Xprefieres%Ypreferís%Z a las gallináceas.\n@c3@"
  fr: "@aCinq-épices@bIl ne fait aucun doute que votre véritable préférence va aux poulets.\n@c3@"
  it: "@aGalinho@bSono co-convinto che le %H860%Xtue%Yvostre%Z preferenze vadano senz'altro alle galline!\n@c3@"
  ja: "@a@bチキーラ「ところで　おまえ本当は\n\tニワトリのほうが　好きだろ？\n@c3@"
"86":
  de: "@aChow Mein@b%H860%XDu brauchst%YIhr braucht%Z den Schnabel gar nicht aufzumachen! Ich kann %H860%Xdeine wahren Gefühle in deinen%Yeure wahren Gefühle in euren%Z Augen erkennen.\n@c3@"
  en: "@aChow Mein@bThere is no need to open your beak! I can see your true emotions reflected in your eyes.\n@c3@"
