  es: "@aChow Mein@b¡¿Ki-ki-ri-quién era ese tipo?!\n@c2@"
  fr: "@aCinq-épices@bQui est ce drôle de cocoⓠⓑ\n@c2@"
  it: "@aGalinho@bChi è quel vecchio uovaccio strapazzato?\n@c2@"
  ja: "@a@bチキーラ「……あいつ　結局\n\tなんだったんだ？\n@c2@"
"62":
  de: "@aFu Yung@bWas hast du gegen Weicheier?!\n@c2@"
