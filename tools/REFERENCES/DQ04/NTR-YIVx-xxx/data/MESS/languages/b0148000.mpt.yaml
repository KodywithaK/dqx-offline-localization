  it: "@a@b*: Sembra proprio il posto che fa per me!\n@c2@"
  ja: "@a@b＊「ほほう！　それはなかなか\n\t面白そうな町だな。\n@c2@"
"59":
  de: "@aDer alte Psaro@bMan nennt mich den alten Psaro. Vielleicht kreuzen sich unsere Wege ja noch mal.\n@c2@"
  en: "@aOld Man Psaro@bMy name's Old Man Psaro. Hopefully our paths will cross again before long.\n@c2@"
  es: "@aViejo Psaro@bMi nombre es Viejo Psaro. Espero que nuestros caminos vuelvan a cruzarse pronto.\n@c2@"
  fr: "@aLe vieux Psaro@bOn m'appelle le vieux Psaro.\nJ'espère que nos chemins se recroiseront bientôt.\n@c2@"
  it: "@aPsaro il Vecchio@bIl mio nome è Psaro il Vecchio. Mi auguro che in futuro ci incontreremo ancora.\n@c2@"
  ja: "@a@b＊「我が名は　Ｇ・ピサロ。\n\tふたたび　どこかで会うことを\n\t楽しみにしているぞ！\n@c2@"
"60":
  de: "@aDer alte Psaro@bLebt wohl, meine Freunde! Ha ha ha!\n@c2@"
  en: "@aOld Man Psaro@bFarewell, my friends! Ha ha ha!\n@c2@"
  es: "@aViejo Psaro@b¡Adiós, amigos míos! ¡Ja, ja, ja!\n@c2@"
  fr: "@aLe vieux Psaro@bAu revoir, mes amisⓠ Ha ha haⓠ\n@c2@"
  it: "@aPsaro il Vecchio@bAddio, amici miei! Ah! Ah! Ah!\n@c2@"
  ja: "@a@bＧ・ピサロ「さらばだ！　しょくん！\n\tわーっはっはっは！\n@c2@"
"61":
  de: "@aChow Mein@bWas war das denn für ein Weichei?!\n@c2@"
