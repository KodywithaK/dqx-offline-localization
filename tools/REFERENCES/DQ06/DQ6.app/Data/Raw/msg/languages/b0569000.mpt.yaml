0:
  en: "@a%0%a002000@bCrikey. This Shield of Valora better be worth all this runnin' around...\n@c0@"
  ja: "@a@b%a002000「うう……。\n\tスフィーダの盾は　ほしいが\n\tややこしそうだぜ……。\n@c0@"
  ko: "@a@b%a002000: 으윽......\n스피더의 방패는 탐나지만\n귀찮겠는걸......\n@c0@"
  sl: "@a@b%a002000：唔……\n　　俺倒是想要斯费达之盾，\n　　但是好像很麻烦……\n@c0@"
  tl: "@a@b%a002000：唔……\n　　俺倒是想要斯費達之盾，\n　　但是好像很麻煩……\n@c0@"
1:
  en: "@a%0%a002010@bThat must be the route to the legendary shield. We should try and remember it.\n@c0@"
  ja: "@a@b%a002010「きっと　いまのは\n\tルートを　しめした　暗号ね。\n\tおぼえておきましょ。\n@c0@"
  ko: "@a@b%a002010: 방금 건 분명히\n길을 알려 주는 암호일 거야.\n잘 외워 두자.\n@c0@"
  sl: "@a@b%a002010：刚才那段话\n　　一定是记录路线的暗号。\n　　好好记住吧。\n@c0@"
  tl: "@a@b%a002010：剛才那段話\n　　一定是記錄路線的暗號。\n　　好好記住吧。\n@c0@"
2:
  en: "@a%0%a002020@bAll that ‘north’ and ‘east’ business doesn't help if you don't know where to start, huh?\n@c0@"
  ja: "@a@b%a002020「北だ　東だって\n\t言ったって　そもそも　どこで\n\tそう　歩くのか　わからないよね。\n@c0@"
  ko: "@a@b%a002020: 북쪽이니 동쪽이니 해도\n어디서 그렇게 가라는 건질\n알 수가 없잖아.\n@c0@"
  sl: "@a@b%a002020：一会往北\n　　一会往东，话虽这么说，\n　　但是不知道该从哪里开始走啊。\n@c0@"
  tl: "@a@b%a002020：一會往北\n　　一會往東，話雖這麼說，\n　　但是不知道該從哪裡開始走啊。\n@c0@"
3:
  en: "@a%0%a002030@b*: ‘Northward till the road doth end,\nEastward then you go,‘\n㈡\n‘North from yonder crossroads wend,\nWestward, then below.’\n@c0@"
  ja: "@a@b%a002030「まず北へ。　つきあたりを東に。\n\tひとつめの十字路を北へすすみ\n\t西の十字路を南にすすむべし。\n@c0@"
  ko: "@a@b%a002030: 일단 북쪽으로. 막다른 곳에서 동쪽으로.\n첫 번째 사거리에서 북쪽으로 간 다음\n서쪽 사거리에서는 남쪽으로 갈 것.\n@c0@"
  sl: "@a@b%a002030：先往北走到底，然后往东走。\n　　在第一个十字路口往北走。\n　　在西边的十字路口再往南走。\n@c0@"
  tl: "@a@b%a002030：先往北走到底，然後往東走。\n　　在第一個十字路口往北走。\n　　在西邊的十字路口再往南走。\n@c0@"
4:
  en: "@a%0%a002030@bHave you committed it to memory?\n@c0@"
  ja: "@a@b%a002030「おぼえましたか？\n@c0@"
  ko: "@a@b%a002030: 외운 거 맞죠?\n@c0@"
  sl: "@a@b%a002030：记住了吗？\n@c0@"
  tl: "@a@b%a002030：記住了嗎？\n@c0@"
5:
  en: "@a%0%a002050@bThis lad should just throw in the towel.\n@c0@"
  ja: "@a@b%a002050「あきらめたほうが\n\tよさそうですね……。\n@c0@"
  ko: "@a@b%a002050: 포기하는 게\n좋겠네요......\n@c0@"
  sl: "@a@b%a002050：还是放弃比较好吧……\n@c0@"
  tl: "@a@b%a002050：還是放棄比較好吧……\n@c0@"
6:
  en: "@a%0%a002000@bYa know, we never would've gotten that shield if we hadn't bumped into this fella...\n@c0@"
  ja: "@a@b%a002000「この男の　話を\n\t聞いていなかったら　オレたちも\n\t手に入れられなかったな。\n@c0@"
  ko: "@a@b%a002000: 이 남자의 이야기를\n못 들었다면 우리도\n손에 넣지 못했겠지.\n@c0@"
  sl: "@a@b%a002000：要是没听\n　　这个男人说的话，\n　　咱也拿不到的吧。\n@c0@"
  tl: "@a@b%a002000：要是沒聽\n　　這個男人說的話，\n　　咱也拿不到的吧。\n@c0@"
7:
  en: "@a%0%a002010@bI wonder how long this poor man's been looking for the shield...\n@c0@"
  ja: "@a@b%a002010「この人は　いつから\n\tスフィーダの盾を　さがして\n\t旅をしているのかしらね……。\n@c0@"
  ko: "@a@b%a002010: 이 사람은 언제부터\n스피더의 방패를 찾아\n여행을 하고 있는 걸까......\n@c0@"
  sl: "@a@b%a002010：这个人是从什么时候\n　　开始踏上寻找斯费达之盾\n　　的旅程的呢……\n@c0@"
  tl: "@a@b%a002010：這個人是從什麼時候\n　　開始踏上尋找斯費達之盾\n　　的旅程的呢……\n@c0@"
8:
  en: "@a%0%a002020@bThat cave was a real conundrum, huh?\n@c0@"
  ja: "@a@b%a002020「あの　洞くつは\n\t迷ったよねー！\n@c0@"
  ko: "@a@b%a002020: 그 동굴은\n정말 복잡했어~!\n@c0@"
  sl: "@a@b%a002020：那个洞窟\n　　太容易迷路了！\n@c0@"
  tl: "@a@b%a002020：那個洞窟\n　　太容易迷路了！\n@c0@"
9:
  en: "@a%0%a002030@bIf he is going to give up on his search, I pray he does so sooner rather than later.\n@c0@"
  ja: "@a@b%a002030「あきらめるなら\n\t早いほうが　いいですよね……。\n@c0@"
  ko: "@a@b%a002030: 포기는\n빠른 편이 좋지요......\n@c0@"
  sl: "@a@b%a002030：要放弃的话\n　　还是趁早的好……\n@c0@"
  tl: "@a@b%a002030：要放棄的話\n　　還是趁早的好……\n@c0@"
10:
  en: "@a%0%a002050@bWe're all grateful to the lad for his top tips — but we can't tell him that!\n@c0@"
  ja: "@a@b%a002050「情報を　いただいたことに\n\tココロの中で　お礼を\n\t言っておきましょう。\n@c0@"
  ko: "@a@b%a002050: 정보를 주신 데에 대해서\n마음속으로 감사를\n드리도록 하죠.\n@c0@"
  sl: "@a@b%a002050：他告诉了我们那消息，\n　　我们就在心中感谢他吧。\n@c0@"
  tl: "@a@b%a002050：他告訴了我們那消息，\n　　我們就在心中感謝他吧。\n@c0@"
11:
  en: "@a%0%a002040@bEven if he found the shield, could this guy even equip it?\n@c0@"
  ja: "@a@b%a002040「見つけたとして\n\tこいつに　スフィーダの盾が\n\t装備できるのか？\n@c0@"
  ko: "@a@b%a002040: 발견했더라도\n이 녀석이 스피더의 방패를\n장비할 수 있나?\n@c0@"
  sl: "@a@b%a002040：就算找到了，\n　　这家伙能装备\n　　斯费达之盾吗？\n@c0@"
  tl: "@a@b%a002040：就算找到了，\n　　這傢伙能裝備\n　　斯費達之盾嗎？\n@c0@"
12:
  en: "@a%0%a002060@b(snarl) Shield...Valora...super... (spit)\n@c0@"
  ja: "@a@b%a002060「スフィーダ…すごい…盾。\n@c0@"
  ko: "@a@b%a002060: 스피더...대단한...방패.\n@c0@"
  sl: "@a@b%a002060：斯费达……厉害的……盾。\n@c0@"
  tl: "@a@b%a002060：斯費達……厲害的……盾。\n@c0@"
13:
  en: "@a%0%a002070@bBoi-oi-oing!\n@c0@"
  ja: "@a@b%a002070「プルプルン。\n@c0@"
  ko: "@a@b%a002070: 뽀용뽀요용.\n@c0@"
  sl: "@a@b%a002070：噗噜噗噜。\n@c0@"
  tl: "@a@b%a002070：噗嚕噗嚕。\n@c0@"
14:
  en: "@a%0%a002000@bNobody's around, aye?\n@c0@"
  ja: "@a@b%a002000「誰も　いないみたいだな。\n@c0@"
  ko: "@a@b%a002000: 아무도 없는 것 같군.\n@c0@"
  sl: "@a@b%a002000：好像没人呢。\n@c0@"
  tl: "@a@b%a002000：好像沒人呢。\n@c0@"
15:
  en: "@a%0%a002010@bLet's go, %a000090!\n@c0@"
  ja: "@a@b%a002010「さあ　行きましょ。\n@c0@"
  ko: "@a@b%a002010: 어서 가자.\n@c0@"
  sl: "@a@b%a002010：我们走吧。\n@c0@"
  tl: "@a@b%a002010：我們走吧。\n@c0@"
16:
  en: "@a%0%a002020@bWhere to next, huh?\n@c0@"
  ja: "@a@b%a002020「つぎは　どこ　行くの？\n@c0@"
  ko: "@a@b%a002020: 이제 어디로 갈 거야?\n@c0@"
  sl: "@a@b%a002020：接下来去哪里？\n@c0@"
  tl: "@a@b%a002020：接下來去哪裡？\n@c0@"
17:
  en: "@a%0%a002030@bNow, where did this well connect to again...?\n@c0@"
  ja: "@a@b%a002030「えーと　この井戸は\n\tどこに　つながって　いましたっけ。\n@c0@"
  ko: "@a@b%a002030: 으음, 이 우물은\n어디로 이어져 있었죠?\n@c0@"
  sl: "@a@b%a002030：我忘了，\n　　这井通向哪里来着？\n@c0@"
  tl: "@a@b%a002030：我忘了，\n　　這井通向哪裡來著？\n@c0@"
18:
  en: "@a%0%a002050@bA well inside a well? Well, well...\n@c0@"
  ja: "@a@b%a002050「井戸の中の　井戸！\n\t男の中の　男！　の私と\n\tよく似ていますね！\n@c0@"
  ko: "@a@b%a002050: 우물 안의 우물!\n남자 중의 남자! 인 저와\n아주 닮았군요!\n@c0@"
  sl: "@a@b%a002050：井中的井！\n　　跟我这种男人中的男人\n　　还挺像的呢！\n@c0@"
  tl: "@a@b%a002050：井中的井！\n　　跟我這種男人中的男人\n　　還挺像的呢！\n@c0@"
19:
  en: "@a%0%a002040@bAnother well? One's not enough?\n@c0@"
  ja: "@a@b%a002040「井戸の中に\n\tまた　井戸か……。\n\tひとつで　いいだろうにな。\n@c0@"
  ko: "@a@b%a002040: 우물 안에\n또 우물이 있다니......\n하나만 있어도 됐을 텐데.\n@c0@"
  sl: "@a@b%a002040：井中还有一口井啊……\n　　要是两者合二为一就好了。\n@c0@"
  tl: "@a@b%a002040：井中還有一口井啊……\n　　要是兩者合二為一就好了。\n@c0@"
20:
  en: "@a%0%a002060@b(snarl) No...water... (splutter)\n@c0@"
  ja: "@a@b%a002060「水…ない……。\n@c0@"
  ko: "@a@b%a002060: 물...없다......\n@c0@"
  sl: "@a@b%a002060：没有……水……\n@c0@"
  tl: "@a@b%a002060：沒有……水……\n@c0@"
21:
  en: "@a%0%a002070@b(slurp)\n@c0@"
  ja: "@a@b%a002070「プルップルーッ！\n@c0@"
  ko: "@a@b%a002070: 뽀르~뽀용~!\n@c0@"
  sl: "@a@b%a002070：噗噜～噗噜！\n@c0@"
  tl: "@a@b%a002070：噗嚕～噗嚕！\n@c0@"
