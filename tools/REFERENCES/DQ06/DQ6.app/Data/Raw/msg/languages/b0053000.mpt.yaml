0:
  en: "@a@b*: Howya! Y'know, I have this feelin' I once did a fair wee bit of travellin' meself, so I do...\n@c0@"
  ja: "@a@b＊「旅の方ですね。　私も　昔は\n\tいろいろと旅をしていたような気が\n\tします。　でも……\n@c0@"
  ko: "@a@b*: 여행자시군요. 저도 옛날에는\n방방곡곡 여행을 다녔던 것\n같습니다. 하지만......\n@c0@"
  sl: "@a@b＊：你们正在旅行吗？\n　　我记得自己以前也去过\n　　很多地方。不过……\n@c0@"
  tl: "@a@b＊：你們正在旅行嗎？\n　　我記得自己以前也去過\n　　很多地方。不過……\n@c0@"
1:
  en: "@a@b*: But would ye credit it? I haven't the first clue where I went or even who I was! Zip! Zilch!\n@c0@"
  ja: "@a@b＊「どうして旅をしていたのか\n\t自分は　いったい　だれなのか\n\tすっかり　忘れてしまったんですよ。\n@c0@"
  ko: "@a@b*: 왜 여행을 했는지\n대체 내가 누구인지\n까맣게 잊고 말았지요.\n@c0@"
  sl: "@a@b＊：我已经完全想不起来\n　　我到底为什么要去旅行，\n　　还有我到底是谁了。\n@c0@"
  tl: "@a@b＊：我已經完全想不起來\n　　我到底為什麼要去旅行，\n　　還有我到底是誰了。\n@c0@"
2:
  en: "@a@b*: I have a naggin' feelin' I made an important promise to someone, so I did, but I just can't seem to remember...\n@c0@"
  ja: "@a@b＊「しかし　私には　だれかとの\n\t大切な約束が　あったような……。\n\tふーむ……。\n@c0@"
  ko: "@a@b*: 근데 제게는 누군가와 했던\n소중한 약속이 있었던 것 같은데......\n흐음......\n@c0@"
  sl: "@a@b＊：可是，我却依稀记得好像和\n　　某个人定下过什么重要的约定……\n　　嗯……\n@c0@"
  tl: "@a@b＊：可是，我卻依稀記得好像和\n　　某個人定下過什麼重要的約定……\n　　嗯……\n@c0@"
3:
  en: "@a@b*: I found that poor fellow wandering aimlessly on the ocean floor.\n@c0@"
  ja: "@a@b＊「そこにいるひとは\n\t海の底を　ただよっていたのを\n\tこの私が　助けました。\n@c0@"
  ko: "@a@b*: 저기 있는 사람은\n바닷속을 떠다니고 있는 걸\n제가 구했답니다.\n@c0@"
  sl: "@a@b＊：那边的那个人，\n　　当时已经沉到了海底，\n　　是我把他救起来的。\n@c0@"
  tl: "@a@b＊：那邊的那個人，\n　　當時已經沉到了海底，\n　　是我把他救起來的。\n@c0@"
4:
  en: "@a@b*: He has no memory of who he is, but his constant tomfoolery makes him a joy to be around.\n@c0@"
  ja: "@a@b＊「自分が　だれかも思いだせないのに\n\tとても　明るい性格で　ときどき\n\t私を　笑わせてくれたりします。\n@c0@"
  ko: "@a@b*: 자기가 누군지 기억도 못 하면서\n아주 밝은 성격이었어요. 가끔\n저를 웃겨 주기도 했지요.\n@c0@"
  sl: "@a@b＊：虽然想不起来自己是谁，\n　　可是他的性格非常开朗，\n　　连我有时候都会被他逗笑呢。\n@c0@"
  tl: "@a@b＊：雖然想不起來自己是誰，\n　　可是他的性格非常開朗，\n　　連我有時候都會被他逗笑呢。\n@c0@"
5:
  en: "@a@b*: Now I can't imagine this place without him!\n@c0@"
  ja: "@a@b＊「今では　この教会に\n\tなくては　ならない存在ですわ。\n@c0@"
  ko: "@a@b*: 지금은 이 성당에\n없어서는 안 될 존재랍니다.\n@c0@"
  sl: "@a@b＊：他现在已经成为\n　　教会里不可或缺的一员了。\n@c0@"
  tl: "@a@b＊：他現在已經成為\n　　教會裡不可或缺的一員了。\n@c0@"
6:
  en: "@a@b*: We're never short of laughs down here. That guy with no memory is loads of fun!\n@c0@"
  ja: "@a@b＊「そこにいる　おじちゃん\n\tとっても　おもしろいんだよ。\n\tだから　ボク　大好き！\n@c0@"
  ko: "@a@b*: 저기 있는 아저씨\n정말 웃겨.\n그래서 난 아저씨가 정말 좋아!\n@c0@"
  sl: "@a@b＊：那边的那个大叔\n　　特别有意思。\n　　我最喜欢他了！\n@c0@"
  tl: "@a@b＊：那邊的那個大叔\n　　特別有意思。\n　　我最喜歡他了！\n@c0@"
7:
  en: "@a@b*: Hello! It's been years since I've had any guests. Let me tell you an old tale — it's a real doozy!\n@c0@"
  ja: "@a@b＊「よう　来なさった。\n\tせっかくじゃから　いいことを\n\tおしえてしんぜよう。\n@c0@"
  ko: "@a@b*: 잘 오셨군.\n여기까지 왔으니 좋은 정보를\n주겠네.\n@c0@"
  sl: "@a@b＊：欢迎光临。难得你们\n　　能够找到这里，\n　　我就告诉你们一些有用的事吧。\n@c0@"
  tl: "@a@b＊：歡迎光臨。難得你們\n　　能夠找到這裡，\n　　我就告訴你們一些有用的事吧。\n@c0@"
8:
  en: "@a@b*: Up above, a legendary sword lies sealed within the mountain depths to the south of here.\n@c0@"
  ja: "@a@b＊「ここから南にいった　山奥に\n\t伝説の剣が　ねむっておる！\n@c0@"
  ko: "@a@b*: 여기서 남쪽으로 가면 깊은 산속에\n전설의 검이 잠들어 있을 게야!\n@c0@"
  sl: "@a@b＊：传说之剑就沉睡在\n　　南边的深山里！\n@c0@"
  tl: "@a@b＊：傳說之劍就沉睡在\n　　南邊的深山裡！\n@c0@"
9:
  en: "@a@b*: But only one man — a sage by the name of Ali Kazam — knows the secret to breaking the seal.\n@c0@"
  ja: "@a@b＊「ザム神官だけが　その封印を\n\tとく方法を　しっておるというぞ。\n@c0@"
  ko: "@a@b*: 자무 신관만이 그 봉인을\n풀 방법을 알고 있을걸세.\n@c0@"
  sl: "@a@b＊：不过听说只有扎姆神官\n　　知道解除封印的方法。\n@c0@"
  tl: "@a@b＊：不過聽說只有扎姆神官\n　　知道解除封印的方法。\n@c0@"
10:
  en: "@a@b*: Quite a story, huh? I wonder how many decades it's been since I last told it...\n@c0@"
  ja: "@a@b＊「というわけじゃが　こうして\n\t人と話したのは\n\t何十年ぶりかのう……。\n@c0@"
  ko: "@a@b*: 이상이라네. 그나저나 이렇게\n누군가와 대화를 해 본 것이\n몇십 년 만인지......\n@c0@"
  sl: "@a@b＊：话说，上次像这样\n　　和别人说话，\n　　都已经是好几十年前的事了……\n@c0@"
  tl: "@a@b＊：話說，上次像這樣\n　　和別人說話，\n　　都已經是好幾十年前的事了……\n@c0@"
