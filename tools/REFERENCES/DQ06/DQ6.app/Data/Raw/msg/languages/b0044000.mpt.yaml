0:
  en: "@a@b*: Who was the girl with the King just now? W-Was it THAT girl? The mirror princess!? She's finally free!?\n@c0@"
  ja: "@a@b＊「今　王につれられて\n\t出てゆかれたのは　カガミ姫？\n\tつ　ついに　やったのですね！\n@c0@"
  ko: "@a@b*: 방금 폐하의 손에 이끌려\n나가신 건 거울 공주?\n드, 드디어 해내셨군요!\n@c0@"
  sl: "@a@b＊：刚才国王带出去的\n　　是明镜公主？\n　　终、终于成功了啊！\n@c0@"
  tl: "@a@b＊：剛才國王帶出去的\n　　是明鏡公主？\n　　終、終於成功了啊！\n@c0@"
1:
  en: "@a@b*: This is truly a cause for celebration! But before that...\n@c0@"
  ja: "@a@b＊「いやはや　めでたいことですな。\n\tそれは　さておき……。\n@c0@"
  ko: "@a@b*: 오오, 경사스러운 일이군요.\n그건 그렇고......\n@c0@"
  sl: "@a@b＊：哎呀，真是可喜可贺啊。\n　　话说回来……\n@c0@"
  tl: "@a@b＊：哎呀，真是可喜可賀啊。\n　　話說回來……\n@c0@"
2:
  en: "@a@b*: The princess in the mirror... Just how long do you think she was trapped in there?\n@c0@"
  ja: "@a@b＊「カガミ姫か……。\n\tいったい　どれくらい\n\t鏡の中に　いたのかしらね。\n@c0@"
  ko: "@a@b*: 거울 공주라......\n대체 얼마나 오랫동안\n거울 속에 있었던 걸까?\n@c0@"
  sl: "@a@b＊：明镜公主啊……\n　　究竟在镜子里面\n　　待了多久啊？\n@c0@"
  tl: "@a@b＊：明鏡公主啊……\n　　究竟在鏡子裡面\n　　待了多久啊？\n@c0@"
3:
  en: "@a@b*: I can't believe the mirror princess has been freed! I never thought I'd see the day!\n@c0@"
  ja: "@a@b＊「カガミ姫が　鏡の中から\n\t出てきたなんて\n\tもう　びっくりです！\n@c0@"
  ko: "@a@b*: 거울 공주가 거울 속에서\n나왔다니,\n정말 놀라운 일입니다!\n@c0@"
  sl: "@a@b＊：明镜公主居然\n　　从镜子里面出来了，\n　　真是大吃一惊！\n@c0@"
  tl: "@a@b＊：明鏡公主居然\n　　從鏡子裡面出來了，\n　　真是大吃一驚！\n@c0@"
4:
  en: "@a@b*: Did you see how happy the King was? It's all thanks to you!\n@c0@"
  ja: "@a@b＊「見ましたかっ！？\n\t王の　あのうれしそうな顔を！\n\tありがとうございました。\n@c0@"
  ko: "@a@b*: 보셨습니까!?\n폐하께서 기뻐하시는 얼굴을!\n정말 감사합니다.\n@c0@"
  sl: "@a@b＊：看到国王\n　　那开心的表情了吗？！\n　　真是太感谢了。\n@c0@"
  tl: "@a@b＊：看到國王\n　　那開心的表情了嗎？！\n　　真是太感謝了。\n@c0@"
5:
  en: "@a@b*: What would it be like to be trapped inside a mirror for thousands of years? She must be stiff as a board...\n@c0@"
  ja: "@a@b＊「鏡の中に　何千年も\n\tとじこめられるって\n\tどんな感じ　なんだろうな。\n@c0@"
  ko: "@a@b*: 거울 속에서 몇천 년이나\n갇혀 있는다는 건\n어떤 느낌일까?\n@c0@"
  sl: "@a@b＊：在镜中被困数千年，\n　　到底是什么感觉啊。\n@c0@"
  tl: "@a@b＊：在鏡中被困數千年，\n　　到底是什麼感覺啊。\n@c0@"
6:
  en: "@a@b*: Don't you just love stories with happy endings? All fairy tales should finish this way!\n@c0@"
  ja: "@a@b＊「物語の結末は　やはり\n\tハッピーエンドが　いちばんじゃ。\n@c0@"
  ko: "@a@b*: 이야기의 결말은 역시\n해피 엔딩이 최고로구먼.\n@c0@"
  sl: "@a@b＊：故事果然都需要一个\n　　完美的结局啊。\n@c0@"
  tl: "@a@b＊：故事果然都需要一個\n　　完美的結局啊。\n@c0@"
7:
  en: "@a@b*: Speaking of fairy tales, someone needs to write the ending of the story... Perhaps I'll give it a go!\n@c0@"
  ja: "@a@b＊「あの本には　わしが　続きを\n\t書いとくと　しよう。\n@c0@"
  ko: "@a@b*: 그 책에는 내가 이어지는 내용을\n써 두도록 하겠네.\n@c0@"
  sl: "@a@b＊：就让老夫来\n　　接着写那本书吧。\n@c0@"
  tl: "@a@b＊：就讓老夫來\n　　接著寫那本書吧。\n@c0@"
8:
  en: "@a@b*: I suppose it's true what they say — truth really is stranger than fiction!\n@c0@"
  ja: "@a@b＊「事実は　小説よりも奇なり　とは\n\tこのことですな。　わっはっはっ。\n@c0@"
  ko: "@a@b*: 사실은 소설보다도 기이하다는 말은\n이럴 때 쓰는 말이로군. 와하하.\n@c0@"
  sl: "@a@b＊：现实有时候比小说\n　　更精彩呢。哇哈哈。\n@c0@"
  tl: "@a@b＊：現實有時候比小說\n　　更精彩呢。哇哈哈。\n@c0@"
9:
  en: "@a@b*: The mirror princess — I mean Miralda — is even more beautiful than I thought!\n㈡\n*: I suppose good things really do come to those who wait!\n@c0@"
  ja: "@a@b＊「カガミ姫　いや　イリカさまが\n\tあれほど　美しいひとだったとは！\n@c0@"
  ko: "@a@b*: 거울 공주, 아니 일리카 님이\n그렇게 아름다운 분이셨을줄이야!\n@c0@"
  sl: "@a@b＊：明镜公主……不对，伊丽卡殿下\n　　居然是如此的美丽！\n@c0@"
  tl: "@a@b＊：明鏡公主……不對，伊麗卡殿下\n　　居然是如此的美麗！\n@c0@"
10:
  en: "@a@b*: He's starting with the princess in the mirror! ♪ He's asking her to change his... No, she's asking him to... Ach!\n@c0@"
  ja: "@a@b＊「おおー　えーいえんのー　愛ー\n\t見つめあうー　ふたりはー……\n@c0@"
  ko: "@a@b*: 오오~ 영~원한~ 사랑~\n마주 보는~ 두 사람은......\n@c0@"
  sl: "@a@b＊：哦，永恒的爱～\n　　两人深情对望……\n@c0@"
  tl: "@a@b＊：哦，永恆的愛～\n　　兩人深情對望……\n@c0@"
11:
  en: "@a@b*: Nope. It's no good. I've been writing tragic poems for so long, I can't get my head around the happy ones...\n@c0@"
  ja: "@a@b＊「うーん　やっぱり\n\t悲しい歌のほうが\n\t作りやすいんだけどなあ……。\n@c0@"
  ko: "@a@b*: 으음, 역시\n슬픈 노래가 더\n만들기 쉬운데......\n@c0@"
  sl: "@a@b＊：唉，果然悲伤的歌\n　　更好写啊……\n@c0@"
  tl: "@a@b＊：唉，果然悲傷的歌\n　　更好寫啊……\n@c0@"
12:
  en: "@a@b*: Dinner's almost done!\n@c0@"
  ja: "@a@b＊「おりょーり　おりょーりっと！\n@c0@"
  ko: "@a@b*: 어서 음식을 준비해야지~!\n@c0@"
  sl: "@a@b＊：做饭做饭！\n@c0@"
  tl: "@a@b＊：做飯做飯！\n@c0@"
13:
  en: "@a@b*: Hopefully the good news will have freed up the King's appetite as well as his heart!\n@c0@"
  ja: "@a@b＊「これで　王さまの　食欲も\n\tもとにもどるだろうね。\n@c0@"
  ko: "@a@b*: 이제 폐하의 식욕도\n원래대로 돌아오겠지?\n@c0@"
  sl: "@a@b＊：这下子国王陛下的\n　　食欲也会恢复吧。\n@c0@"
  tl: "@a@b＊：這下子國王陛下的\n　　食欲也會恢復吧。\n@c0@"
14:
  en: "@a@b*: The King and Miralda look so happy! I'll admit it — I'm a little jealous...\n@c0@"
  ja: "@a@b＊「いいなあ　王さまとイリカさま\n\tお幸せそうで……。\n@c0@"
  ko: "@a@b*: 좋겠다. 폐하와 일리카 님,\n행복한 것 같아서......\n@c0@"
  sl: "@a@b＊：真好啊。国王陛下和伊丽卡殿下\n　　看起来那么幸福……\n@c0@"
  tl: "@a@b＊：真好啊。國王陛下和伊麗卡殿下\n　　看起來那麼幸福……\n@c0@"
15:
  en: "@a@b*: Welcome, %a000120! Many thanks for all your help.\n@c0@"
  ja: "@a@b＊「おお！　%a000120どの。\n\tこのたびの　はたらき\n\t感謝いたしますぞ。\n@c0@"
  ko: "@a@b*: 오오! %a000120 님.\n이번에 보여 준 활약은\n참으로 고마웠소.\n@c0@"
  sl: "@a@b＊：哦！%a000120阁下。\n　　这次真是太感谢你了。\n@c0@"
  tl: "@a@b＊：哦！%a000120閣下。\n　　這次真是太感謝你了。\n@c0@"
16:
  en: "@aKing Ludwig@bOh! %0%a000120! I am glad you came.\n@c0@"
  ja: "@a@bフォーン王「おお！　%a000120！\n\tよく　来てくれたな。\n@c0@"
  ko: "@a@b폰 왕: 오오! %a000120!\n잘 와 주었소.\n@c0@"
  sl: "@a@b佛恩王：哦！%a000120！\n　　你来了啊。\n@c0@"
  tl: "@a@b佛恩王：哦！%a000120！\n　　你來了啊。\n@c0@"
17:
  en: "@aKing Ludwig@bThanks to you, I will finally be able to make my beloved Miralda into ‘Mrs Ludwig Van Swanstone’!\n㈡\nIt has a nice ring to it — just like her finger!\n@c0@"
  ja: "@a@bフォーン王「そなたの　おかげで\n\t私は　イリカを　妻に\n\tむかえることが　できる！\n@c0@"
  ko: "@a@b폰 왕: 그대 덕에\n나는 일리카를 아내로\n맞이할 수 있게 되었소!\n@c0@"
  sl: "@a@b佛恩王：多亏了你，\n　　我才能娶伊丽卡为妻！\n@c0@"
  tl: "@a@b佛恩王：多虧了你，\n　　我才能娶伊麗卡為妻！\n@c0@"
18:
  en: "@aKing Ludwig@bWe'll have to have an appropriately enormous ceremony, of course. And of course, we shall invite you!\n@c0@"
  ja: "@a@bフォーン王「本来なら　盛大な\n\t式を挙げ　そなたたちも\n\t招くところ　なのだが……\n@c0@"
  ko: "@a@b폰 왕: 본래라면 성대하게\n식을 올려 그대들도\n초대해야 하겠지만......\n@c0@"
  sl: "@a@b佛恩王：本来应该\n　　举办盛大的仪式\n　　来款待你们的……\n@c0@"
  tl: "@a@b佛恩王：本來應該\n　　舉辦盛大的儀式\n　　來款待你們的……\n@c0@"
19:
  en: "@aKing Ludwig@bBut why rush? I have waited my whole life for this — surely I can wait a little longer! Hah!\n@c0@"
  ja: "@a@bフォーン王「まあ　それは\n\tそのうちに……と　いうことで\n\t置いておこう。\n@c0@"
  ko: "@a@b폰 왕: 그건 일단\n다음번으로......\n미뤄 두지.\n@c0@"
  sl: "@a@b佛恩王：唉，这事\n　　以后再说吧。\n@c0@"
  tl: "@a@b佛恩王：唉，這事\n　　以後再說吧。\n@c0@"
20:
  en: "@aKing Ludwig@bFor now, then, let me give you a token of my gratitude. It's a little something that's been in our family for generations.\n@c0@"
  ja: "@a@bフォーン王「ともかく　礼をいうぞ。\n\tそして　これは　わが城に\n\t古くから　あるものなのだが……。\n@c0@"
  ko: "@a@b폰 왕: 아무튼 정말 고맙소.\n그리고 이것은 우리 성에\n옛날부터 있었던 물건인데......\n@c0@"
  sl: "@a@b佛恩王：先容我道谢。\n　　另外，这是这座城\n　　自古以来就有的东西……\n@c0@"
  tl: "@a@b佛恩王：先容我道謝。\n　　另外，這是這座城\n　　自古以來就有的東西……\n@c0@"
21:
  en: "@aKing Ludwig@bThe floodgate key is yours to enjoy!\n@c0@"
  ja: "@a@bフォーン王「この水門のカギを\n\tそなたたちに　たくそう！\n@c0@"
  ko: "@a@b폰 왕: 이 수문 열쇠를\n그대들에게 맡기겠소!\n@c0@"
  sl: "@a@b佛恩王：就将这水门的钥匙\n　　交给你们吧！\n@c0@"
  tl: "@a@b佛恩王：就將這水門的鑰匙\n　　交給你們吧！\n@c0@"
22:
  en: "@aKing Ludwig@b%0%a000120 receives the floodgate key.\n@c0@"
  ja: "@a@b%a000120は　水門のカギを\nうけとった。\n@c0@"
  ko: "@a@b%a000120%F0120%X는%Y은%Z 수문 열쇠를\n받았다.\n@c0@"
  sl: "@a@b%a000120收下了\n水门的钥匙。\n@c0@"
  tl: "@a@b%a000120收下了\n水門的鑰匙。\n@c0@"
23:
  en: "@aKing Ludwig@bWith it, you can open the floodgate that blocks the channel east of here. The southern seas are yours to explore!\n@c0@"
  ja: "@a@bフォーン王「そのカギが　あれば\n\tこの城の東の海峡にある　水門を開き\n\t南の海に　船を出すことができよう。\n@c0@"
  ko: "@a@b폰 왕: 그 열쇠가 있으면\n이 성 동쪽 해협에 있는 수문을 열고\n남쪽 바다로 배를 몰 수 있을 것이오.\n@c0@"
  sl: "@a@b佛恩王：有那把钥匙的话，\n　　就能打开城东海峡的水门，\n　　航行至南方的海域了。\n@c0@"
  tl: "@a@b佛恩王：有那把鑰匙的話，\n　　就能打開城東海峽的水門，\n　　航行至南方的海域了。\n@c0@"
24:
  en: "@aKing Ludwig@bYour horizons will be greatly broadened, I'm sure.\n@c0@"
  ja: "@a@bフォーン王「さらなる世界が\n\tそなたたちの前に　広がるはずだ。\n@c0@"
  ko: "@a@b폰 왕: 더 넓은 세계가\n그대들 앞에 펼쳐질 터.\n@c0@"
  sl: "@a@b佛恩王：迎接你们的\n　　将是更广阔的世界。\n@c0@"
  tl: "@a@b佛恩王：迎接你們的\n　　將是更廣闊的世界。\n@c0@"
25:
  en: "@aKing Ludwig@bI sincerely hope you find what you're looking for. Miralda and I will be praying for your success.\n@c0@"
  ja: "@a@bフォーン王「そなたたちが　さがしものを\n\t見つけることが　できるよう\n\t私も　イリカとともに　祈っているぞ。\n@c0@"
  ko: "@a@b폰 왕: 그대들이 찾는 것을\n무사히 찾을 수 있도록\n나도 일리카와 함께 기도하겠소.\n@c0@"
  sl: "@a@b佛恩王：我和伊丽卡都会祈祷\n　　你们能找到\n　　你们要找的东西。\n@c0@"
  tl: "@a@b佛恩王：我和伊麗卡都會祈禱\n　　你們能找到\n　　你們要找的東西。\n@c0@"
26:
  en: "@aMiralda@bI had no idea I had been in the mirror for such a long time...\n@c0@"
  ja: "@a@bイリカ「もう　どのくらい\n\t昔のこと　だったのか……。\n@c0@"
  ko: "@a@b일리카: 얼마나\n오래 전이었는지......\n@c0@"
  sl: "@a@b伊丽卡：那是多久\n　　之前的事了啊……\n@c0@"
  tl: "@a@b伊麗卡：那是多久\n　　之前的事了啊……\n@c0@"
27:
  en: "@aMiralda@bI had no sense of the passage of time.\n@c0@"
  ja: "@a@bイリカ「時間の感覚が　マヒして\n\tはっきり　わかりません。\n@c0@"
  ko: "@a@b일리카: 시간 감각이 마비되어서\n정확하게 기억나지 않아요.\n@c0@"
  sl: "@a@b伊丽卡：我的时间观念都麻痹了，\n　　记不清楚了。\n@c0@"
  tl: "@a@b伊麗卡：我的時間觀念都麻痹了，\n　　記不清楚了。\n@c0@"
28:
  en: "@aMiralda@bIt all started when Spiegel came to attack our castle...\n@c0@"
  ja: "@a@bイリカ「あの日　ミラルゴは\n\t私たちの城を　おそい……\n@c0@"
  ko: "@a@b일리카: 그날, 미랄고는\n우리 성을 습격해서......\n@c0@"
  sl: "@a@b伊丽卡：那天米拉尔戈\n　　袭击了我们的城……\n@c0@"
  tl: "@a@b伊麗卡：那天米拉爾戈\n　　襲擊了我們的城……\n@c0@"
29:
  en: "@aMiralda@bThere was a man I loved at the time, you see...but Spiegel drove him to his death.\n@c0@"
  ja: "@a@bイリカ「私の愛したひとを\n\t死に　追いやりました。\n@c0@"
  ko: "@a@b일리카: 제가 사랑하는 사람을\n죽음에 이르게 했어요.\n@c0@"
  sl: "@a@b伊丽卡：我爱的人也被杀害了。\n@c0@"
  tl: "@a@b伊麗卡：我愛的人也被殺害了。\n@c0@"
30:
  en: "@aMiralda@bThen he took me, and said he was going to make me his own.\n@c0@"
  ja: "@a@bイリカ「ミラルゴは　私を\n\t連れさり　自分のものに\n\tしようと　しました。\n@c0@"
  ko: "@a@b일리카: 미랄고는 저를\n납치해서는 자신의 것으로\n만들고자 했지요.\n@c0@"
  sl: "@a@b伊丽卡：米拉尔戈将我掳走，\n　　想要霸占我。\n@c0@"
  tl: "@a@b伊麗卡：米拉爾戈將我擄走，\n　　想要霸佔我。\n@c0@"
31:
  en: "@aMiralda@bI did not return his love, as you can imagine. And as soon as he realised this...\n@c0@"
  ja: "@a@bイリカ「でも　私が　自分の愛を\n\t受け入れないと　知ると……\n@c0@"
  ko: "@a@b일리카: 하지만 제가 그의 사랑을\n받아들여 주지 않는다는 것을 알자......\n@c0@"
  sl: "@a@b伊丽卡：但是在知道\n　　我不接受他的爱之后……\n@c0@"
  tl: "@a@b伊麗卡：但是在知道\n　　我不接受他的愛之後……\n@c0@"
32:
  en: "@aMiralda@b...He trapped me inside the mirror.\n@c0@"
  ja: "@a@bイリカ「私を　鏡の中に\n\t封じたのです。\n@c0@"
