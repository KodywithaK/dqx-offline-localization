5:
  en: "@aMadame Luca@bDreams are a wonderful thing, yes? Dreams give you hope, and hope gives you the power to live.\n@c0@"
  ja: "@a@bグランマーズ「夢を見るのは\n\tいいことじゃ。　夢は　希望をうみ\n\t希望は　生きるチカラをうむ。\n@c0@"
