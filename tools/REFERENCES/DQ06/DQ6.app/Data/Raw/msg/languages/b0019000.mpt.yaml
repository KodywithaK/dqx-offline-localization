0:
  en: "@a@b*: I can't find him anywhere! Where's our %a002050 wandered off to...?\n@c0@"
  ja: "@a@b＊「うーん　ここにも　いないか……。\n\t%a002050さまは　いったい　どこに\n\t行かれたのだろうか……。\n@c0@"
  ko: "@a@b*: 으음~ 여기도 없네......\n%a002050 님은 대체 어디로\n가 버리신 거지......\n@c0@"
  sl: "@a@b＊：唔，也不在这里啊……\n　　%a002050大人究竟\n　　去哪里了呢？\n@c0@"
  tl: "@a@b＊：唔，也不在這裡啊……\n　　%a002050大人究竟\n　　去哪裡了呢？\n@c0@"
1:
  en: "@a@b*: Grrr! Wait till I get me hands on 'em!\n㈡\n*: Who thought it would be a good idea to tell our %a002050 everything!? They must be soft in the head!\n@c0@"
  ja: "@a@b＊「まったく　どこの　どいつだよ！\n\t%a002050のだんなに　ヒミツを\n\tしゃべっちまったやつはっ！\n@c0@"
  ko: "@a@b*: 대체 누구냐!\n%a002050한테 비밀을\n알려 준 놈이!\n@c0@"
  sl: "@a@b＊：真是，究竟是哪个混蛋！\n　　竟然将秘密告诉了\n　　%a002050先生！\n@c0@"
  tl: "@a@b＊：真是，究竟是哪個混蛋！\n　　竟然將秘密告訴了\n　　%a002050先生！\n@c0@"
2:
  en: "@a@b*: It is a sad day for Scrimsley. %0%a002050 has fled, we know not whither.\n@c0@"
  ja: "@a@b＊「この町の英雄　%a002050さまの\n\tお姿が　消えてしまったのです。\n@c0@"
  ko: "@a@b*: 이 마을의 영웅 %a002050 님이\n자취를 감추고 말았습니다.\n@c0@"
  sl: "@a@b＊：这个镇子的英雄%a002050大人\n　　已经不见了。\n@c0@"
  tl: "@a@b＊：這個鎮子的英雄%a002050大人\n　　已經不見了。\n@c0@"
3:
  en: "@a@b*: In his current condition, it is surely not wise for him to leave the town. We can only pray for his safe return...\n@c0@"
  ja: "@a@b＊「いったい　あの病気のお身体で\n\tどこに　ゆかれたのでしょうか……。\n\t%a002050さまの身が　心配です。\n@c0@"
  ko: "@a@b*: 그렇게 병든 몸으로 대체\n어딜 가신 건지......\n%a002050 님이 걱정됩니다.\n@c0@"
  sl: "@a@b＊：拖着生病的身体\n　　究竟去了哪里呢……真是担心\n　　%a002050大人的身体啊。\n@c0@"
  tl: "@a@b＊：拖著生病的身體\n　　究竟去了哪裡呢……真是擔心\n　　%a002050大人的身體啊。\n@c0@"
4:
  en: "@a@b*: I'll tell you summat, I reckon someone went and told our %a002050 the truth.\n@c0@"
  ja: "@a@b＊「わたしには　わかるよ。\n\t%a002050さまは　きっとヒミツを\n\t知ってしまったのさ。\n@c0@"
  ko: "@a@b*: 난 알 수 있어.\n%a002050 님은 틀림없이 비밀을\n알아 버리고 만 거야.\n@c0@"
  sl: "@a@b＊：我懂的。\n　　%a002050大人一定\n　　知道了那个秘密。\n@c0@"
  tl: "@a@b＊：我懂的。\n　　%a002050大人一定\n　　知道了那個秘密。\n@c0@"
5:
  en: "@a@b*: Knowin' that selfless soul, he's probably fled Scrimsley so as not to cause the folks here any more bother.\n@c0@"
  ja: "@a@b＊「そして　町のみなさんに　これ以上\n\t迷惑を　かけられないって\n\t出ていってしまったんだよ。\n@c0@"
  ko: "@a@b*: 그리고 마을 사람들을 더 이상\n고생시킬 수 없다고 생각해서\n나가 버리신 거라구.\n@c0@"
  sl: "@a@b＊：为了不再给\n　　镇上的人们添麻烦，\n　　才出走的啊。\n@c0@"
  tl: "@a@b＊：為了不再給\n　　鎮上的人們添麻煩，\n　　才出走的啊。\n@c0@"
6:
  en: "@a@b*: There's no use hidin' it! I'm down in the dumps today!\n@c0@"
  ja: "@a@b＊「はあ……。\n@c0@"
  ko: "@a@b*: 휴우......\n@c0@"
  sl: "@a@b＊：唉……\n@c0@"
  tl: "@a@b＊：唉……\n@c0@"
7:
  en: "@a@b*: With our %a002050 gone, it's like Scrimsley's had the stuffin' knocked out of it!\n@c0@"
  ja: "@a@b＊「%a002050さんが　いなくなってから\n\tこの町は　まるで\n\t火が消えたみたいですよ。\n@c0@"
  ko: "@a@b*: %a002050 씨가 사라진 후로\n이 마을은 완전히\n적막강산이 돼 버렸다구요.\n@c0@"
  sl: "@a@b＊：%a002050不见了之后，\n　　这个镇子好像\n　　火被浇灭了似的呢。\n@c0@"
  tl: "@a@b＊：%a002050不見了之後，\n　　這個鎮子好像\n　　火被澆滅了似的呢。\n@c0@"
8:
  en: "@a@b*: Truly, the Goddess moves in mysterious ways...\n@c0@"
  ja: "@a@b＊「ふしぎなことが　あるものですね。\n@c0@"
  ko: "@a@b*: 참 신기한 일도 다 있죠.\n@c0@"
  sl: "@a@b＊：这真是不可思议啊。\n@c0@"
  tl: "@a@b＊：這真是不可思議啊。\n@c0@"
9:
  en: "@a@b*: Ever since %a002050, the town strongman, upped and left, the nightly earthquakes have ceased.\n@c0@"
  ja: "@a@b＊「%a002050というひとが　いなくなってから\n\tこの町には　じしんが\n\tおきなくなったんですよ。\n@c0@"
  ko: "@a@b*: %a002050%F2050%X라%Y이라%Z는 사람이 사라지고 나니\n이 마을에서는 지진이\n일어나지 않게 되었어요.\n@c0@"
  sl: "@a@b＊：那个叫%a002050的人\n　　不见了之后，\n　　这个镇子就不再发生地震了呢。\n@c0@"
  tl: "@a@b＊：那個叫%a002050的人\n　　不見了之後，\n　　這個鎮子就不再發生地震了呢。\n@c0@"
10:
  en: "@a@b*: And though this newfound silence should aid my rest, I find myself troubled instead by thoughts of how...and why...\n@c0@"
  ja: "@a@b＊「おかげで　ぐっすりと\n\tねむれます。　いやー　よかった。\n@c0@"
  ko: "@a@b*: 덕분에 푹 잘 수\n있게 되었죠. 이야~ 다행이네요.\n@c0@"
  sl: "@a@b＊：我终于可以睡好觉了。\n　　哎呀，真是太好了。\n@c0@"
  tl: "@a@b＊：我終於可以睡好覺了。\n　　哎呀，真是太好了。\n@c0@"
11:
  en: "@a@b*: If our %a002050 has decided to hide himself away, we've got no chance of findin' him!\n@c0@"
  ja: "@a@b＊「%a002050さまが　自分から\n\tお姿を　消したからには　もう\n\tだれにも　見つけられませんわ。\n@c0@"
  ko: "@a@b*: %a002050 님이 스스로\n자취를 감추셨으니 이제\n그 누구도 찾을 수 없을 거예요.\n@c0@"
  sl: "@a@b＊：既然%a002050大人\n　　自己离开了镇子，\n　　肯定不会有人找得到吧。\n@c0@"
  tl: "@a@b＊：既然%a002050大人\n　　自己離開了鎮子，\n　　肯定不會有人找得到吧。\n@c0@"
12:
  en: "@a@b*: I only pray that he's safe! There really was no one quite like him... \n@c0@"
  ja: "@a@b＊「今は　ただ　こうして\n\t%a002050さまの　ご無事を\n\t祈るだけです。\n@c0@"
  ko: "@a@b*: 지금은 그저 이렇게\n%a002050 님이 무사하시기를\n기도하는 수밖에 없죠.\n@c0@"
  sl: "@a@b＊：现在只能祈祷\n　　%a002050大人能\n　　平安无事了。\n@c0@"
  tl: "@a@b＊：現在只能祈禱\n　　%a002050大人能\n　　平安無事了。\n@c0@"
13:
  en: "@a@b*: I hope I'm not speakin' out of line here, but was it you perchance who told our %a002050 the shocking truth ?\n@c0@"
  ja: "@a@b＊「まさか　%a002050さまに\n\tあのことを話したのは\n\tお前さんたちじゃなかろうね……。\n@c0@"
  ko: "@a@b*: 설마 %a002050 님에게\n그 사실을 발설한 게\n자네들은 아니겠지......\n@c0@"
  sl: "@a@b＊：难道是你们\n　　把那件事告诉\n　　%a002050大人的吗……\n@c0@"
  tl: "@a@b＊：難道是你們\n　　把那件事告訴\n　　%a002050大人的嗎……\n@c0@"
14:
  en: "@a@b*: Ah, I see. Well, we've all made mistakes in our time. I know I have.\n@c0@"
  ja: "@a@b＊「まあ　ええ……。\n\tだれにでも　あやまちは\n\tあるもんじゃ。\n@c0@"
  ko: "@a@b*: 뭐, 됐네......\n누구에게나 실수는\n있는 법.\n@c0@"
  sl: "@a@b＊：唉，算了……\n　　人非圣贤，\n　　孰能无过。\n@c0@"
  tl: "@a@b＊：唉，算了……\n　　人非聖賢，\n　　孰能無過。\n@c0@"
15:
  en: "@a@b*: It's too late to undo it. All you can do is learn from it and take more care in future.\n@c0@"
  ja: "@a@b＊「もう　とりかえしは　つかぬが\n\tひとつ　勉強になったと思って\n\tこれから先は　気をつけるんじゃな。\n@c0@"
  ko: "@a@b*: 이미 엎질러진 물이지만\n하나 배운 셈치고\n앞으로는 조심들 하시게.\n@c0@"
  sl: "@a@b＊：覆水难收啊。\n　　把这当做是一个教训吧。\n　　今后要小心才是。\n@c0@"
  tl: "@a@b＊：覆水難收啊。\n　　把這當做是一個教訓吧。\n　　今後要小心才是。\n@c0@"
16:
  en: "@a@b*: There's no sense wastin' your time searchin' for our %a002050. Believe me, he won't be found.\n@c0@"
  ja: "@a@b＊「もはや　%a002050さまのことは\n\tさがしても　ムダじゃ。\n\tあきらめるしかないのう。\n@c0@"
  ko: "@a@b*: 이제 와서 %a002050 님을\n찾아봐야 소용없네..\n포기들 하시게.\n@c0@"
  sl: "@a@b＊：再找%a002050大人也\n　　无济于事了。\n　　只能放弃了吧。\n@c0@"
  tl: "@a@b＊：再找%a002050大人也\n　　無濟於事了。\n　　只能放棄了吧。\n@c0@"
17:
  en: "@a@b*: It were like this, see — my little lad were set upon by a right big gang of monsters. Absolute terrors, they were!\n@c0@"
  ja: "@a@b＊「私の子どもが　まものに\n\tおそわれたのです。\n@c0@"
  ko: "@a@b*: 저희 아이가 마물에게\n습격을 받았습니다.\n@c0@"
  sl: "@a@b＊：我的孩子\n　　被魔物袭击了。\n@c0@"
  tl: "@a@b＊：我的孩子\n　　被魔物襲擊了。\n@c0@"
18:
  en: "@a@b*: Well, our %a002050 won't stand for any of that, so he wades right in and rescues the little tyke!\n@c0@"
  ja: "@a@b＊「でも　あわや　と　いうとき\n\t%a002050さまに　助けていただいて。\n@c0@"
  ko: "@a@b*: 하지만 급박한 순간에\n%a002050 님께서 구해 주셨죠.\n@c0@"
  sl: "@a@b＊：就在那危急关头，\n　　是%a002050大人救了他。\n@c0@"
  tl: "@a@b＊：就在那危急關頭，\n　　是%a002050大人救了他。\n@c0@"
19:
  en: "@a@b*: Of course, he won't hear a word of thanks. A more humble hero you couldn't hope to find!\n@c0@"
  ja: "@a@b＊「あのかたは　この町の英雄。\n\tいえっ　まさしく\n\t救いの　神ですよ！\n@c0@"
  ko: "@a@b*: 그분은 이 마을의 영웅.\n아니, 진정한\n수호신이라구요!\n@c0@"
  sl: "@a@b＊：那位大人是镇子的英雄。\n　　不对，可以说\n　　是拯救我们的神！\n@c0@"
  tl: "@a@b＊：那位大人是鎮子的英雄。\n　　不對，可以說\n　　是拯救我們的神！\n@c0@"
20:
  en: "@a@b*: It fair breaks my heart to think that he's not around any more. Who's goin' to rescue my boy next time, eh?\n@c0@"
  ja: "@a@b＊「なにも　この町を\n\t出てゆかなくても……。\n\tうくく……。\n@c0@"
  ko: "@a@b*: 이 마을을\n떠나실 것까진 없었는데......\n으흐흑......\n@c0@"
  sl: "@a@b＊：再怎么说也不必\n　　非离开这个镇子不可啊……\n　　呜呜……\n@c0@"
  tl: "@a@b＊：再怎麼說也不必\n　　非離開這個鎮子不可啊……\n　　嗚嗚……\n@c0@"
21:
  en: "@a@b*: (sniff) Arf, arf!\n@c0@"
  ja: "@a@b＊「くーん　くーん……。\n@c0@"
  ko: "@a@b*: 킁...킁......\n@c0@"
  sl: "@a@b＊：呜、呜……\n@c0@"
  tl: "@a@b＊：嗚、嗚……\n@c0@"
22:
  en: "@a@b*: Welcome, %H0860%Xtraveller%Ytravellers%Z! This here is Scrimsley.\n@c0@"
  ja: "@a@b＊「こんにちは　旅の　おかた。\n\tここは　モンストルの町よ。\n@c0@"
  ko: "@a@b*: 안녕, 여행자 님.\n이곳은 몬스톨 마을이야.\n@c0@"
  sl: "@a@b＊：各位旅行者，你们好，\n　　这里是蒙斯托尔镇。\n@c0@"
  tl: "@a@b＊：各位旅行者，你們好，\n　　這裡是蒙斯托爾鎮。\n@c0@"
23:
  en: "@a@b*: Look at you lot, swannin' about with your fancy clothes and your la-de-da hair-dos!\n@c0@"
  ja: "@a@b＊「おおっ　そなたたちは\n\t旅の者じゃな。\n@c0@"
  ko: "@a@b*: 오옷, 그대들은\n여행자로군.\n@c0@"
  sl: "@a@b＊：哦，你们是\n　　旅行者吧。\n@c0@"
  tl: "@a@b＊：哦，你們是\n　　旅行者吧。\n@c0@"
24:
  en: "@a@b*: You won't find me traipsin' round the world, let me tell you! Everythin' a man needs is right here in Scrimsley!\n@c0@"
  ja: "@a@b＊「旅は　ええ！\n\t旅は　ええもんじゃ！\n@c0@"
  ko: "@a@b*: 여행은 좋은 게야!\n암, 그렇고말고!\n@c0@"
  sl: "@a@b＊：旅行好！\n　　旅行妙啊！\n@c0@"
  tl: "@a@b＊：旅行好！\n　　旅行妙啊！\n@c0@"
25:
  en: "@a@b*: Can it really be!? Visitors! Real live visitors! It's so nice to see you!\n@c0@"
  ja: "@a@b＊「お客さんとは　めずらしいのう。\n@c0@"
  ko: "@a@b*: 웬일로 손님이 다 왔구먼.\n@c0@"
  sl: "@a@b＊：会有客人来，真是稀奇啊。\n@c0@"
  tl: "@a@b＊：會有客人來，真是稀奇啊。\n@c0@"
26:
  en: "@a@b*: If you head south of here, you can see the grand spires of Castle Swanstone.\n@c0@"
  ja: "@a@b＊「ここから　南にゆくと\n\tフォーン城がある。\n@c0@"
  ko: "@a@b*: 여기서 남쪽으로 가면\n폰 성이 있다네.\n@c0@"
  sl: "@a@b＊：从这里往南，\n　　可以到达佛恩城。\n@c0@"
  tl: "@a@b＊：從這裡往南，\n　　可以到達佛恩城。\n@c0@"
27:
  en: "@a@b*: But the mountains are too treacherous to cross on foot. You'll need to go by water through the strait.\n@c0@"
  ja: "@a@b＊「しかし　あいだに　高い山が\n\tそびえておるから　歩いては行けん。\n\t海を下っていくしかないのじゃが……\n@c0@"
  ko: "@a@b*: 허나 그 사이에 높은 산이\n솟아 있으니 걸어서는 못 갈 게야.\n바다를 통해 내려가는 수밖에 없네만......\n@c0@"
  sl: "@a@b＊：不过两地之间有高山阻隔，\n　　走是走不到那里的。\n　　只有沿着海路南下才行……\n@c0@"
  tl: "@a@b＊：不過兩地之間有高山阻隔，\n　　走是走不到那裡的。\n　　只有沿著海路南下才行……\n@c0@"
28:
  en: "@a@b*: Unfortunately, the floodgate is closed at present, so you won't be able to go that way either.\n@c0@"
  ja: "@a@b＊「今は　海峡の水門が　閉まっとるから\n\t水路もとれん。\n@c0@"
  ko: "@a@b*: 지금은 해협 수문이 폐쇄된 상태라\n수로도 확보되지 않을 걸세.\n@c0@"
  sl: "@a@b＊：但是如今海峡的水门也关闭着，\n　　水路也走不通了。\n@c0@"
  tl: "@a@b＊：但是如今海峽的水門也關閉著，\n　　水路也走不通了。\n@c0@"
29:
  en: "@a@b*: Seems like your options for visiting Castle Swanstone are rather limited. If only there was some other way through...\n@c0@"
  ja: "@a@b＊「まあ　ふつうの方法では\n\t行くことはできん　と　いうことじゃ。\n\tどこかに　抜け道でもあれば　別じゃがの。\n@c0@"
  ko: "@a@b*: 여하튼 보통 방법으로는\n못 간다는 말이네.\n어디 샛길이라도 있다면 모를까.\n@c0@"
  sl: "@a@b＊：哎，也就是说普通方式\n　　是到不了那里的。\n　　只能想办法绕道过去了。\n@c0@"
  tl: "@a@b＊：哎，也就是說普通方式\n　　是到不了那裡的。\n　　只能想辦法繞道過去了。\n@c0@"
30:
  en: "@a@b*: Head south via the strait, and you'll get to Castle Swanstone.\n㈡\n*: But the floodgate is closed at present, so you'll have no joy going that way for now.\n@c0@"
  ja: "@a@b＊「ここから　海を下って　南にゆくと\n\tフォーン城じゃが　今は　海峡の水門が\n\t閉まっておって　先には行けんぞ。\n@c0@"
  ko: "@a@b*: 여기서 바다를 따라 남쪽으로 내려가면\n폰 성이 있네만, 지금은 해협 수문이\n폐쇄된 상태라 갈 수 없을 걸세.\n@c0@"
  sl: "@a@b＊：从这里沿着海路南下，\n　　就能到达佛恩城。\n　　不过现在海峡水门关着，去不了。\n@c0@"
  tl: "@a@b＊：從這裡沿著海路南下，\n　　就能到達佛恩城。\n　　不過現在海峽水門關著，去不了。\n@c0@"
31:
  en: "@a@b*: Hold on a second! Do my eyes deceive me!? You've got the floodgate key!\n@c0@"
  ja: "@a@b＊「むむっ　もしや\n\tお前さんがもっている　それは\n\t水門のカギでは！？\n@c0@"
