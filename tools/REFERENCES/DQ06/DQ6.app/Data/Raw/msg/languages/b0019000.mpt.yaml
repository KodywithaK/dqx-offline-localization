  tl: "@a@b＊：不好意思，\n　　這裡現在走不通。\n　　請再等一段時間。\n@c0@"
187:
  ko: "@a@b*: 듣자하니 길이 중간에 무너지면서\n그곳에 커다란 구멍이\n생겼다고 합니다.\n@c0@"
188:
  ko: "@a@b*: 그리고 그 구멍에서 마물이\n나타나게 되었다고......\n@c0@"
189:
  ko: "@a@b*: 놈들은 아무리 쓰러뜨려도\n계속 나와!\n@c0@"
190:
  ko: "@a@b*: 아무래도 구멍 안쪽에 숨은\n거대한 마물이 놈들을 차례로\n낳고 있는 게 아닐까 싶군.\n@c0@"
191:
  ko: "@a@b*: 하지만 그 마물은 병사단장님도\n쓰러뜨리지 못한 강적!\n우리로는 역부족이라고!\n@c0@"
192:
  ko: "@a@b*: 보시다시피 이 앞은\n길이 무너져서 지나갈 수 없습니다.\n@c0@"
193:
  ko: "@a@b*: 아아, 빨리 폐하가 보내신\n영웅이 와 주면 좋을 텐데......\n@c0@"
194:
  ko: "@a@b*: 앗, 실례합니다.\n@c0@"
195:
  ko: "@a@b*: 죄송하지만 지금 이곳은\n지나갈 수 없습니다.\n기다려 주십시오.\n@c0@"
