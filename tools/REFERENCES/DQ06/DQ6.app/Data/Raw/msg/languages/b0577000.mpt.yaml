0:
  en: "@a%0%a002000@bAhoy! Mermaids ho! Hope they don't swim off on us or nothin'...\n@c0@"
  ja: "@a@b%a002000「いるいる！\n\tオレたち見て\n\tにげたり　しないかな。\n@c0@"
  ko: "@a@b%a002000: 저기 있어!\n우릴 보고\n도망치지 않으려나?\n@c0@"
  sl: "@a@b%a002000：在这里呢！\n　　看到咱之后\n　　会不会逃走啊。\n@c0@"
  tl: "@a@b%a002000：在這裡呢！\n　　看到咱之後\n　　會不會逃走啊。\n@c0@"
1:
  en: "@a%0%a002010@bAll the mermaids seem to be frolicking happily.\n@c0@"
  ja: "@a@b%a002010「みんな　たのしそうに\n\tあそんでいるわね。\n@c0@"
  ko: "@a@b%a002010: 모두 즐거운 듯이\n놀고 있어.\n@c0@"
  sl: "@a@b%a002010：大家都\n　　玩得很开心呢。\n@c0@"
  tl: "@a@b%a002010：大家都\n　　玩得很開心呢。\n@c0@"
2:
  en: "@a%0%a002020@bYahoo! Finally here! And look at all of Unda's friends!\n@c0@"
  ja: "@a@b%a002020「やっと　ついたね！\n\tディーネちゃんの　仲間たちが\n\tたくさんいるよ！\n@c0@"
  ko: "@a@b%a002020: 드디어 도착했네!\n디네의 친구들이\n잔뜩 있어!\n@c0@"
  sl: "@a@b%a002020：终于到了！\n　　这里有很多\n　　蒂妮的同伴呢！\n@c0@"
  tl: "@a@b%a002020：終於到了！\n　　這裡有很多\n　　蒂妮的同伴呢！\n@c0@"
3:
  en: "@a%0%a002030@bThis is indeed a long way from Pescado. We have done well to arrive in one piece.\n@c0@"
  ja: "@a@b%a002030「ペスカニからだと\n\tたしかに　ここは　遠いですね。\n\tぶじに　ついて　よかったです。\n@c0@"
  ko: "@a@b%a002030: 페스카니에서\n여기까지는 확실히 멀군요.\n무사히 도착해서 다행입니다.\n@c0@"
  sl: "@a@b%a002030：这里离佩斯卡尼\n　　的确很远呢。能平安到达\n　　真是太好了。\n@c0@"
  tl: "@a@b%a002030：這裡離佩斯卡尼\n　　的確很遠呢。能平安到達\n　　真是太好了。\n@c0@"
4:
  en: "@a%0%a002050@bIt's just like a dream...\n@c0@"
  ja: "@a@b%a002050「夢のような　光景ですね……。\n@c0@"
  ko: "@a@b%a002050: 꿈 같은 광경입니다......\n@c0@"
  sl: "@a@b%a002050：这真是梦一般的景象啊……\n@c0@"
  tl: "@a@b%a002050：這真是夢一般的景象啊……\n@c0@"
5:
  en: "@a%0%a002000@bSo we can go into the briny deep with this harp, aye? Let's do it, %a000090!\n@c0@"
  ja: "@a@b%a002000「マーメイドハープが　あれば\n\t海の中に　もぐれるってことか。\n\tやったな　%a000090！\n@c0@"
  ko: "@a@b%a002000: 인어의 하프가 있으면\n바닷속으로 잠수할 수 있다는 말이군.\n해냈구나, %a000090!\n@c0@"
  sl: "@a@b%a002000：有了人鱼竖琴\n　　就能潜到海里了啊。\n　　太棒了，%a000090！\n@c0@"
  tl: "@a@b%a002000：有了人魚豎琴\n　　就能潛到海裡了啊。\n　　太棒了，%a000090！\n@c0@"
6:
  en: "@a%0%a002010@bLorelei's Harp... What a curious instrument...\n@c0@"
  ja: "@a@b%a002010「マーメイドハープ……\n\tふしぎな　どうぐね。\n@c0@"
  ko: "@a@b%a002010: 인어의 하프......\n신비한 도구야.\n@c0@"
  sl: "@a@b%a002010：人鱼竖琴……\n　　真是个不可思议的道具啊。\n@c0@"
  tl: "@a@b%a002010：人魚豎琴……\n　　真是個不可思議的道具啊。\n@c0@"
7:
  en: "@a%0%a002020@bI'm so happy Unda made it back to her merfolk friends!\n@c0@"
  ja: "@a@b%a002020「ディーネちゃん\n\tみんなの所に　もどれて\n\tよかったね！\n@c0@"
  ko: "@a@b%a002020: 디네,\n친구들과 가족들이 있는 곳으로\n돌아가서 다행이야!\n@c0@"
  sl: "@a@b%a002020：蒂妮能回到\n　　同伴们的地方，\n　　真是太好了！\n@c0@"
  tl: "@a@b%a002020：蒂妮能回到\n　　同伴們的地方，\n　　真是太好了！\n@c0@"
8:
  en: "@a%0%a002030@bWe must try out Lorelei's Harp right away!\n@c0@"
  ja: "@a@b%a002030「さっそく\n\tいただいた　マーメイドハープを\n\t使ってみますか？\n@c0@"
  ko: "@a@b%a002030: 선물로 받은\n인어의 하프를 바로\n사용해 볼까요?\n@c0@"
  sl: "@a@b%a002030：赶紧试一试\n　　刚刚拿到的\n　　人鱼竖琴吧？\n@c0@"
  tl: "@a@b%a002030：趕緊試一試\n　　剛剛拿到的\n　　人魚豎琴吧？\n@c0@"
9:
  en: "@a%0%a002050@bAre Ova and Unda twins? Old %a002050 couldn't tell the difference.\n@c0@"
  ja: "@a@b%a002050「いやー　ふたりとも\n\t顔もカタチも　そっくりでしたね！\n\tふたごかなあ。\n@c0@"
  ko: "@a@b%a002050: 오오~ 둘 다\n얼굴도 몸도 똑 닮았더군요!\n쌍둥이인가?\n@c0@"
  sl: "@a@b%a002050：哎呀，两人的\n　　模样和身材都好像啊！\n　　是不是双胞胎啊。\n@c0@"
  tl: "@a@b%a002050：哎呀，兩人的\n　　模樣和身材都好像啊！\n　　是不是雙胞胎啊。\n@c0@"
10:
  en: "@a%0%a002000@bRod must be goin' nuts waitin' for news about Unda, eh?\n@c0@"
  ja: "@a@b%a002000「きっと　ロブは　オレたちから\n\tディーネの話が　聞けるのを\n\t首を　ながくして　まってるぜ。\n@c0@"
  ko: "@a@b%a002000: 아마 롭은 우리가\n디네 이야기를 해 주기를\n학수고대하고 있겠지.\n@c0@"
  sl: "@a@b%a002000：洛布肯定在等着\n　　咱们带来蒂妮的消息，\n　　恐怕都快急死了。\n@c0@"
  tl: "@a@b%a002000：洛布肯定在等著\n　　咱們帶來蒂妮的消息，\n　　恐怕都快急死了。\n@c0@"
11:
  en: "@a%0%a002010@bRod's going to be so happy!\n@c0@"
  ja: "@a@b%a002010「ロブさん　きっと\n\tよろこんで　くれるわよ。\n@c0@"
  ko: "@a@b%a002010: 롭 씨, 분명\n기뻐해 줄 거야.\n@c0@"
  sl: "@a@b%a002010：洛布\n　　肯定会很高兴的！\n@c0@"
  tl: "@a@b%a002010：洛布\n　　肯定會很高興的！\n@c0@"
12:
  en: "@a%0%a002020@bCome on! We gotta tell Rod all about Unda!\n@c0@"
  ja: "@a@b%a002020「ディーネちゃんのこと\n\tロブさんに　伝えなきゃ！\n@c0@"
  ko: "@a@b%a002020: 디네를 데려다 줬다고\n롭 씨한테 알려 줘야 해!\n@c0@"
  sl: "@a@b%a002020：必须赶快\n　　把蒂妮的消息告诉洛布才行！\n@c0@"
  tl: "@a@b%a002020：必須趕快\n　　把蒂妮的消息告訴洛布才行！\n@c0@"
13:
  en: "@a%0%a002030@bI can just picture Rod's face lighting up.\n@c0@"
  ja: "@a@b%a002030「ロブさんの　よろこぶ顔が\n\t目に浮かびます。\n@c0@"
  ko: "@a@b%a002030: 롭 씨가 기뻐할 모습이\n눈앞에 펼쳐지는 듯하군요.\n@c0@"
  sl: "@a@b%a002030：洛布那高兴的表情\n　　已经呈现在我的眼前了。\n@c0@"
  tl: "@a@b%a002030：洛布那高興的表情\n　　已經呈現在我的眼前了。\n@c0@"
14:
  en: "@a%0%a002050@bSo this Rod fellow's not hidin' anythin' else in that cave, right?\n@c0@"
  ja: "@a@b%a002050「もう　ロブさんは\n\t洞くつに　何も　かくして\n\tいないですよね。\n@c0@"
  ko: "@a@b%a002050: 이제 롭 씨는\n동굴 속에 아무것도 안 숨겨 놓고\n있겠죠?\n@c0@"
  sl: "@a@b%a002050：洛布已经\n　　没有再往洞窟里\n　　藏什么东西了吧。\n@c0@"
  tl: "@a@b%a002050：洛布已經\n　　沒有再往洞窟裡\n　　藏什麼東西了吧。\n@c0@"
15:
  en: "@a%0%a002000@bHuh! Folks wonder about Rod whether he's carryin' on OR calmin' down. Poor beggar never gets the benefit o' the doubt.\n@c0@"
  ja: "@a@b%a002000「ロブのヤツ\n\tおとなしく　なったら　なったで\n\t心配されちまうんだな。\n@c0@"
  ko: "@a@b%a002000: 롭 녀석,\n얌전해지니 또 그건 그거대로\n걱정거리를 안겨 주는군.\n@c0@"
  sl: "@a@b%a002000：洛布那家伙\n　　要是变稳重了才真让人担心啊！\n@c0@"
  tl: "@a@b%a002000：洛布那傢伙\n　　要是變穩重了才真讓人擔心啊！\n@c0@"
16:
  en: "@a%0%a002010@bThere's nothing Rod can do except wait patiently for the day he can be reunited with Unda.\n@c0@"
  ja: "@a@b%a002010「ディーネさんを\n\tむかえに　行ける日が　来るまでは\n\tしかたないかも　しれないわね。\n@c0@"
  ko: "@a@b%a002010: 디네 씨를\n데리러 갈 수 있는 날이 올 때까지는\n어쩔 수 없을지도 몰라.\n@c0@"
  sl: "@a@b%a002010：能去接蒂妮的\n　　那一天到来之前，\n　　怕是不稳重也不行啊。\n@c0@"
  tl: "@a@b%a002010：能去接蒂妮的\n　　那一天到來之前，\n　　怕是不穩重也不行啊。\n@c0@"
17:
  en: "@a%0%a002020@bToo bad we can't tell her why Rod's so calm, huh?\n@c0@"
  ja: "@a@b%a002020「理由は　いえないよねー。\n@c0@"
  ko: "@a@b%a002020: 이유는 말할 수 없다구~\n@c0@"
  sl: "@a@b%a002020：不能把原因说出来呢。\n@c0@"
  tl: "@a@b%a002020：不能把原因說出來呢。\n@c0@"
18:
  en: "@a%0%a002030@bRod must be rather lonely without Unda around.\n@c0@"
  ja: "@a@b%a002030「さすがの　ロブさんも\n\tディーネさんが　いないと\n\tさびしいですよね。\n@c0@"
  ko: "@a@b%a002030: 아무리 롭 씨라도\n역시 디네 양이 없으면\n쓸쓸할 겁니다.\n@c0@"
  sl: "@a@b%a002030：即使是洛布，\n　　蒂妮不在的话也会寂寞呢。\n@c0@"
  tl: "@a@b%a002030：即使是洛布，\n　　蒂妮不在的話也會寂寞呢。\n@c0@"
19:
  en: "@a%0%a002050@bOld %a002050 is dyin' to tell everyone what we saw! But I'll hold my tongue.\n@c0@"
  ja: "@a@b%a002050「くううーっ！\n\tなにが　あったのか　いいたい！\n\tけど　いえない！！\n@c0@"
  ko: "@a@b%a002050: 크으으~!\n무슨 일이 있었는지 말하고 싶어요!\n하지만 말할 수 없죠!!\n@c0@"
  sl: "@a@b%a002050：啊啊啊！\n　　真想把发生的一切说出来！\n　　可是，我不能说！！\n@c0@"
  tl: "@a@b%a002050：啊啊啊！\n　　真想把發生的一切說出來！\n　　可是，我不能說！！\n@c0@"
20:
  en: "@a%0%a002000@bShe was talkin' about Rod, aye? I bet the difference is night 'n' day if ya live here.\n@c0@"
  ja: "@a@b%a002000「ロブの　ことだろ？\n\t村の人から　見ると　ちがいが\n\tはっきり　わかるんだろうな。\n@c0@"
  ko: "@a@b%a002000: 롭 얘기지?\n마을 사람들이 보기에는 변화를\n확연하게 알 수 있나 보군.\n@c0@"
  sl: "@a@b%a002000：说的是洛布吧？\n　　他那明显的变化\n　　连村里人都看出来了啊。\n@c0@"
  tl: "@a@b%a002000：說的是洛布吧？\n　　他那明顯的變化\n　　連村裡人都看出來了啊。\n@c0@"
21:
  en: "@a%0%a002010@bThat's right. People are sure to change as time goes by.\n@c0@"
  ja: "@a@b%a002010「そうね。\n\t人は　時間と　ともに\n\tどんどん　かわるものよ。\n@c0@"
  ko: "@a@b%a002010: 맞아.\n사람은 시간과 함께\n계속 변하는 존재잖아.\n@c0@"
  sl: "@a@b%a002010：没错，\n　　人是会随着时间不断改变的。\n@c0@"
  tl: "@a@b%a002010：沒錯，\n　　人是會隨著時間不斷改變的。\n@c0@"
22:
  en: "@a%0%a002020@bShe's talking about Rod, right? She sure doesn't have to tell me twice!\n@c0@"
  ja: "@a@b%a002020「ロブさんのこと\n\tいってるなら　あたり前だよね。\n@c0@"
  ko: "@a@b%a002020: 그게 롭 씨\n얘기라면 당연한 일이야.\n@c0@"
  sl: "@a@b%a002020：如果是指洛布的话，\n　　那是理所当然的啊。\n@c0@"
  tl: "@a@b%a002020：如果是指洛布的話，\n　　那是理所當然的啊。\n@c0@"
23:
  en: "@a%0%a002020@bI had no idea ol' hot Rod was such a lover boy!\n@c0@"
  ja: "@a@b%a002020「だって\n\tロブさんは　ドラマチックで\n\tロマンチック　だったんだもん！\n@c0@"
  ko: "@a@b%a002020: 생각해 봐.\n롭 씨는 드라마틱하고도\n로맨틱했다구!\n@c0@"
  sl: "@a@b%a002020：不过，\n　　洛布的故事本身就够戏剧性，\n　　也相当浪漫呢！\n@c0@"
  tl: "@a@b%a002020：不過，\n　　洛布的故事本身就夠戲劇性，\n　　也相當浪漫呢！\n@c0@"
24:
  en: "@a%0%a002030@bI've been told that I've scarcely changed since I was a child.\n@c0@"
  ja: "@a@b%a002030「私は　子供のころから\n\tかわらないと　いわれますね。\n@c0@"
  ko: "@a@b%a002030: 저는 어릴 때부터\n변하지 않았다는 소릴 듣습니다.\n@c0@"
  sl: "@a@b%a002030：别人都说\n　　我和小时候没什么两样。\n@c0@"
  tl: "@a@b%a002030：別人都說\n　　我和小時候沒什麼兩樣。\n@c0@"
25:
  en: "@a%0%a002050@bPeople are also known to transform into monsters!\n@c0@"
  ja: "@a@b%a002050「人は　まものに\n\tかわったりも　しますからね！\n@c0@"
  ko: "@a@b%a002050: 사람이 마물로\n변하기도 하니까요!\n@c0@"
  sl: "@a@b%a002050：人还能变成魔物呢！\n@c0@"
  tl: "@a@b%a002050：人還能變成魔物呢！\n@c0@"
26:
  en: "@a%0%a002000@bA terrifyin' monster, aye...? Do you think the seas will smooth out if we take him down?\n@c0@"
  ja: "@a@b%a002000「海の底の化け物か……\n\tそいつを　倒せば　海は\n\tもとどおりになるのか！？\n@c0@"
  ko: "@a@b%a002000: 바다 밑바닥의 괴물이라......\n그 녀석을 쓰러뜨리면 바다는\n원래대로 돌아오는 건가!?\n@c0@"
  sl: "@a@b%a002000：海底的怪物吗？\n　　把那家伙干掉的话，\n　　大海就能恢复到以前的样子了吗？！\n@c0@"
  tl: "@a@b%a002000：海底的怪物嗎？\n　　把那傢伙幹掉的話，\n　　大海就能恢復到以前的樣子了嗎？！\n@c0@"
27:
  en: "@a%0%a002010@bVisiting the bottom of the sea is no problem for us now that we've got Lorelei's harp.\n@c0@"
  ja: "@a@b%a002010「マーメイドハープを\n\t手にいれた　いまの　私たちなら\n\t海の底も　行けるわね。\n@c0@"
  ko: "@a@b%a002010: 인어의 하프를\n손에 넣은 지금의 우리라면\n바닷속으로도 갈 수 있어.\n@c0@"
  sl: "@a@b%a002010：我们已经\n　　得到了人鱼竖琴，\n　　现在可以去海底了。\n@c0@"
  tl: "@a@b%a002010：我們已經\n　　得到了人魚豎琴，\n　　現在可以去海底了。\n@c0@"
28:
  en: "@a%0%a002020@bThat monster sounds like a job for us! Let's get him!\n@c0@"
  ja: "@a@b%a002020「じゃあ　海の底の化け物を\n\t倒しちゃおうか！\n@c0@"
  ko: "@a@b%a002020: 우리가 바닷속 괴물을\n해치워 버릴까?\n@c0@"
  sl: "@a@b%a002020：那我们\n　　就去打败海底的怪物吧！\n@c0@"
  tl: "@a@b%a002020：那我們\n　　就去打敗海底的怪物吧！\n@c0@"
29:
  en: "@a%0%a002020@bWith the monster out of the picture, maybe Rod can pay a personal visit to Unda!\n@c0@"
  ja: "@a@b%a002020「そうすれば　ロブさんも\n\tディーネちゃんの所に　行けるかも！\n@c0@"
  ko: "@a@b%a002020: 그러면 롭 씨도\n디네를 만나러 갈 수 있잖아!\n@c0@"
  sl: "@a@b%a002020：这样一来，\n　　洛布也能去找蒂妮了。\n@c0@"
  tl: "@a@b%a002020：這樣一來，\n　　洛布也能去找蒂妮了。\n@c0@"
30:
  en: "@a%0%a002030@bThe bottom of the south-eastern sea... Duly noted.\n@c0@"
  ja: "@a@b%a002030「ここから　南東の海の底ですね。\n\tおぼえておきましょう。\n@c0@"
  ko: "@a@b%a002030: 여기서 남동쪽 바닷속이로군요.\n잘 기억해 둡시다.\n@c0@"
  sl: "@a@b%a002030：村子东南的海底，\n　　先记下来吧。\n@c0@"
  tl: "@a@b%a002030：村子東南的海底，\n　　先記下來吧。\n@c0@"
31:
  en: "@a%0%a002050@bIs it really worth takin' on a terrifyin' monster just so that lad can do a spot of fishin'?\n@c0@"
  ja: "@a@b%a002050「すごい化け物を　倒しても\n\tちっとしか　魚が　とれないなら\n\t倒しがいが　ないですね……。\n@c0@"
  ko: "@a@b%a002050: 엄청난 괴물을 해치운 뒤에도\n고기가 조금밖에 안 잡힌다면\n해치운 보람이 없잖습니까......\n@c0@"
  sl: "@a@b%a002050：把怪物打倒之后\n　　才只能捕到几条鱼的话，\n　　这怪物也没什么打倒的价值吧……\n@c0@"
  tl: "@a@b%a002050：把怪物打倒之後\n　　才只能捕到幾條魚的話，\n　　這怪物也沒什麼打倒的價值吧……\n@c0@"
32:
  en: "@a%0%a002000@bHuh. So he's sellin' to people other than Rod now?\n@c0@"
  ja: "@a@b%a002000「ん？　ああ……\n\tロブ以外にも　売るようになった\n\tって　ことだな。\n@c0@"
  ko: "@a@b%a002000: 응? 아아......\n롭 이외의 사람들에게도\n팔게 됐다는 얘기군.\n@c0@"
  sl: "@a@b%a002000：嗯？啊啊……\n　　意思是洛布以外的人\n　　也可以买鱼了啊。\n@c0@"
  tl: "@a@b%a002000：嗯？啊啊……\n　　意思是洛布以外的人\n　　也可以買魚了啊。\n@c0@"
33:
  en: "@a%0%a002010@bI'm sure all the villagers are delighted by this news.\n@c0@"
  ja: "@a@b%a002010「村の　みなさんも\n\tよろこんで　いるのかしら。\n@c0@"
  ko: "@a@b%a002010: 마을 사람들도\n기뻐하고 있을까?\n@c0@"
  sl: "@a@b%a002010：村里人都很高兴吧。\n@c0@"
  tl: "@a@b%a002010：村裡人都很高興吧。\n@c0@"
34:
  en: "@a%0%a002020@bI'll bet that's because he lost his number one customer, Rod.\n@c0@"
  ja: "@a@b%a002020「ロブさんが\n\t買わなく　なっちゃったからね。\n@c0@"
  ko: "@a@b%a002020: 롭 씨가\n안 사게 됐기 때문이겠지.\n@c0@"
  sl: "@a@b%a002020：是因为\n　　洛布不来买鱼了吧。\n@c0@"
  tl: "@a@b%a002020：是因為\n　　洛布不來買魚了吧。\n@c0@"
35:
  en: "@a%0%a002030@bWith their most loyal customer no longer buying in bulk, they may struggle to make ends meet.\n@c0@"
  ja: "@a@b%a002030「大の　おとくいさんが\n\tいなくなったから　商売は\n\tたいへんかも　しれませんね。\n@c0@"
  ko: "@a@b%a002030: 최고의 단골손님이\n없어졌으니 장사가\n힘들지도 모르겠군요.\n@c0@"
  sl: "@a@b%a002030：失去一个大客户，\n　　生意看来也不好做了呢。\n@c0@"
  tl: "@a@b%a002030：失去一個大客戶，\n　　生意看來也不好做了呢。\n@c0@"
36:
  en: "@a%0%a002050@bIt sounds like business is boomin' now.\n@c0@"
  ja: "@a@b%a002050「このひとに　聞けば\n\t店のようすは　バッチリですね！\n@c0@"
  ko: "@a@b%a002050: 이 사람한테 물어보면\n가게 상태를 금방 알 수 있겠네요!\n@c0@"
  sl: "@a@b%a002050：只要问问这个人，\n　　这店里的情况就全知道了！\n@c0@"
  tl: "@a@b%a002050：只要問問這個人，\n　　這店裡的情況就全知道了！\n@c0@"
37:
  en: "@a%0%a002000@bHardy har! That's music to my ears 'n' everything like that!\n@c0@"
  ja: "@a@b%a002000「そうそう。\n\tそうこなくっちゃな！\n@c0@"
  ko: "@a@b%a002000: 그래.\n그렇게 나와야지!\n@c0@"
  sl: "@a@b%a002000：没错。\n　　男人就该是这样！\n@c0@"
  tl: "@a@b%a002000：沒錯。\n　　男人就該是這樣！\n@c0@"
38:
  en: "@a%0%a002010@bIt sounds like Rod is truly doing well!\n@c0@"
  ja: "@a@b%a002010「ロブさん　たのもしいわね。\n@c0@"
  ko: "@a@b%a002010: 롭 씨, 믿음직스러운걸.\n@c0@"
  sl: "@a@b%a002010：洛布还真是靠得住呢。\n@c0@"
  tl: "@a@b%a002010：洛布還真是靠得住呢。\n@c0@"
39:
  en: "@a%0%a002020@bI hope Rod's journey back to sea can come sooner rather than later.\n@c0@"
  ja: "@a@b%a002020「早く　その日が\n\t来るといいねー。\n@c0@"
  ko: "@a@b%a002020: 어서 그날이\n오면 좋겠네~\n@c0@"
  sl: "@a@b%a002020：这一天\n　　能够快点到来就好了。\n@c0@"
  tl: "@a@b%a002020：這一天\n　　能夠快點到來就好了。\n@c0@"
40:
  en: "@a%0%a002030@bI'm pleased to hear that Rod's in fine fettle.\n@c0@"
  ja: "@a@b%a002030「ふっきれたなら\n\tよかったですね。\n@c0@"
  ko: "@a@b%a002030: 극복했다면\n다행이군요.\n@c0@"
  sl: "@a@b%a002030：没有\n　　消沉下去真是太好了。\n@c0@"
  tl: "@a@b%a002030：沒有\n　　消沉下去真是太好了。\n@c0@"
41:
  en: "@a%0%a002050@bRod's a fine fellow!\n@c0@"
  ja: "@a@b%a002050「男らしいですね！\n@c0@"
  ko: "@a@b%a002050: 남자다운데요!\n@c0@"
  sl: "@a@b%a002050：还算像个男人！\n@c0@"
  tl: "@a@b%a002050：還算像個男人！\n@c0@"
42:
  en: "@a%0%a002000@bRod's spirits sure are soarin', aye? Good for him.\n@c0@"
  ja: "@a@b%a002000「そのいきだぜ。\n\tがんばれよ！　ロブ！\n@c0@"
  ko: "@a@b%a002000: 그래, 바로 그거다.\n힘내라! 롭!\n@c0@"
  sl: "@a@b%a002000：就该是这种气魄。\n　　洛布！加油啊！\n@c0@"
  tl: "@a@b%a002000：就該是這種氣魄。\n　　洛布！加油啊！\n@c0@"
43:
  en: "@a%0%a002010@bThey're so lucky to have each other.\n@c0@"
  ja: "@a@b%a002010「おたがいに　いいひとに\n\tめぐりあえたのね。\n@c0@"
  ko: "@a@b%a002010: 서로 좋은 사람을\n만났구나.\n@c0@"
  sl: "@a@b%a002010：两个人都是\n　　对方生命中的唯一呢。\n@c0@"
  tl: "@a@b%a002010：兩個人都是\n　　對方生命中的唯一呢。\n@c0@"
44:
  en: "@a%0%a002020@bWow, what a guy!\n@c0@"
  ja: "@a@b%a002020「ロブさん　カッコいいー！\n@c0@"
  ko: "@a@b%a002020: 롭 씨 멋져~!\n@c0@"
  sl: "@a@b%a002020：洛布！太帅了！\n@c0@"
  tl: "@a@b%a002020：洛布！太帥了！\n@c0@"
45:
  en: "@a%0%a002030@bRod will doubtless be as good as his word.\n@c0@"
  ja: "@a@b%a002030「ロブさんなら　きっと\n\tだいじょうぶです。\n@c0@"
  ko: "@a@b%a002030: 롭 씨라면 틀림없이\n해낼 수 있을 겁니다.\n@c0@"
  sl: "@a@b%a002030：洛布一定没有问题的。\n@c0@"
  tl: "@a@b%a002030：洛布一定沒有問題的。\n@c0@"
46:
  en: "@a%0%a002050@bIf I was a lady and someone said that, I'd be bowled over, make no mistake. ...What? I said ‘if’!\n@c0@"
  ja: "@a@b%a002050「もし　私が　女性で\n\tこんなこと　いわれたら\n\tもう　イチコロ　ですね！\n@c0@"
  ko: "@a@b%a002050: 만약 제가 여자라면\n이런 얘기 듣고\n껌뻑 죽었을걸요!\n@c0@"
  sl: "@a@b%a002050：如果我是女生，\n　　有人跟我说了这些话的话，\n　　我肯定会一下子就被俘获芳心的！\n@c0@"
  tl: "@a@b%a002050：如果我是女生，\n　　有人跟我說了這些話的話，\n　　我肯定會一下子就被俘獲芳心的！\n@c0@"
