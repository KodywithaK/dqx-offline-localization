1:
  en: "@a%0%a002010@bThis inn is rather far from civilisation. I doubt they get very many customers.\n@c0@"
  ja: "@a@b%a002010「宿屋さん……\n\t近くに　大きな町が　ないせいか\n\tお客は　少ないようね。\n@c0@"
  ko: "@a@b%a002010: 여관......\n근처에 큰 마을이 없어서인지\n손님은 적은 모양이야.\n@c0@"
