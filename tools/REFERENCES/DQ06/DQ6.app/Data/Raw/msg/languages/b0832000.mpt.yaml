0:
  en: "@a@b*: Welcome to Alltrades Abbey. I can help you learn about the different vocations available here.\n@c0@"
  ja: "@a@b＊「ダーマの神殿へ　ようこそ。\n\tここでは　職業の説明が　書かれた\n\tメモを　見ることができます。\n@c0@"
  ko: "@a@b*: 다마 신전에 오신 것을 환영합니다.\n여기서는 전직에 대한 설명이 기재된\n메모를 볼 수 있습니다.\n@c0@"
  sl: "@a@b＊：欢迎来到达玛神殿。\n　　在这里可以阅读\n　　记录有职业说明的笔记。\n@c0@"
  tl: "@a@b＊：歡迎來到達瑪神殿。\n　　在這裡可以閱讀\n　　記錄有職業說明的筆記。\n@c0@"
1:
  en: "@a@b*: Would you like to read about the trades?\n@c0@"
  ja: "@a@b＊「職業の説明を\n\tご覧に　なりますか？\n@c0@"
  ko: "@a@b*: 직업 설명을\n보시겠습니까?\n@c0@"
  sl: "@a@b＊：要阅读职业说明吗？\n@c0@"
  tl: "@a@b＊：要閱讀職業說明嗎？\n@c0@"
2:
  en: "@a@b*: It is said that other, yet-to-be-discovered vocations also exist.\n@c0@"
  ja: "@a@b＊「この他にも　まだ知られていない\n\t職業があると　いわれています。\n@c0@"
  ko: "@a@b*: 이외에도 아직 알려지지 않은\n직업이 더 있다고 합니다.\n@c0@"
  sl: "@a@b＊：据说还有其他\n　　不为人知的职业。\n@c0@"
  tl: "@a@b＊：據說還有其他\n　　不為人知的職業。\n@c0@"
3:
  en: "@a@b*: If you find a scroll that describes these trades, it would behoove you to bring it here.\n@c0@"
  ja: "@a@b＊「もし　何かの　悟りの書を\n\t見つけたら　持っていて下さい。\n@c0@"
  ko: "@a@b*: 혹시 깨달음의 책을 발견하시면\n그대로 가지고 계세요.\n@c0@"
  sl: "@a@b＊：如果发现了什么悟之书的话，\n　　请一定记得带在身上。\n@c0@"
  tl: "@a@b＊：如果發現了什麼悟之書的話，\n　　請一定記得帶在身上。\n@c0@"
4:
  en: "@a@b*: The bearer of such a scroll could open an entirely new path through life.\n@c0@"
  ja: "@a@b＊「その　悟りを　持つ者だけに\n\t新たなる職業への道が\n\t開かれることでしょう。\n@c0@"
  ko: "@a@b*: 그 깨달음을 지닌 자에게\n새로운 직업의 길이\n열릴 테니까요.\n@c0@"
  sl: "@a@b＊：通往新职业的道路\n　　只会为那些\n　　有所参悟的人开放。\n@c0@"
  tl: "@a@b＊：通往新職業的道路\n　　只會為那些\n　　有所參悟的人開放。\n@c0@"
5:
  en: "@a@b*: Can I help you with something else?\n@c0@"
  ja: "@a@b＊「他にも　ご覧になりますか？\n@c0@"
  ko: "@a@b*: 다른 것도 더 보시겠습니까?\n@c0@"
  sl: "@a@b＊：还要阅读其他的吗？\n@c0@"
  tl: "@a@b＊：還要閱讀其他的嗎？\n@c0@"
6:
  en: "@a@b*: Take care then, child.\n@c0@"
  ja: "@a@b＊「では　また　どうぞ。\n@c0@"
  ko: "@a@b*: 그럼 다음에 또 오세요.\n@c0@"
  sl: "@a@b＊：那么，欢迎再来。\n@c0@"
  tl: "@a@b＊：那麼，歡迎再來。\n@c0@"
7:
  en: "@a@bA weaponry obsessive\r\nwho can learn all kinds\r\nof cutting-edge abilities.\n@c0@"
  ja: "@a@bぶきをつかった　たたかいが\nとくい。　きょうりょくな\nけんのわざを　みにつける。\n@c0@"
  ko: "@a@b무기를 활용한 전투가 특기.\n강력한 검술을 익힌다.\n@c0@"
  sl: "@a@b擅长使用武器进行战斗。\n具备强力的剑技。\n@c0@"
  tl: "@a@b擅長使用武器進行戰鬥。\n具備強力的劍技。\n@c0@"
8:
  en: "@a@bA warrior whose hands\r\nand feet have been honed\r\nto become lethal weapons.\n@c0@"
  ja: "@a@bぶじゅつが　とくい。\nうでや　あしなど　カラダを\nつかうわざを　みにつける。\n@c0@"
  ko: "@a@b무술이 특기.\n팔과 다리 등 몸을\n사용하는 기술을 익힌다.\n@c0@"
  sl: "@a@b擅长武术。\n具备使用拳脚等\n身体方面的招数。\n@c0@"
  tl: "@a@b擅長武術。\n具備使用拳腳等\n身體方面的招數。\n@c0@"
9:
  en: "@a@bA master of magic who\r\nassails enemies with all\r\nmanner of offensive spells.\n@c0@"
  ja: "@a@bじゅもんで　たたかう\nまほうつかい。　こうげきの\nじゅもんを　おぼえる。\n@c0@"
  ko: "@a@b주문으로 싸우는 마법사.\n공격 주문을 배운다.\n@c0@"
  sl: "@a@b使用咒文战斗的魔法师。\n会使用攻击咒文。\n@c0@"
  tl: "@a@b使用咒文戰鬥的魔法師。\n會使用攻擊咒文。\n@c0@"
10:
  en: "@a@bA servant of the Goddess\r\nwhose spells soothe and\r\ngive succor.\n@c0@"
  ja: "@a@bかみにつかえる　そうりょ。\nみかたを　かいふくしたり\nまもるじゅもんを　おぼえる。\n@c0@"
  ko: "@a@b신을 섬기는 승려.\n아군을 회복시키거나\n지키는 주문을 배운다.\n@c0@"
  sl: "@a@b侍奉神明的僧侣。\n会使用帮助同伴恢复和\n防御的咒文。\n@c0@"
  tl: "@a@b侍奉神明的僧侶。\n會使用幫助同伴恢復和\n防禦的咒文。\n@c0@"
11:
  en: "@a@bA groovy mover whose\r\nbopping can both help\r\nfriends and hinder foes.\n@c0@"
  ja: "@a@bダンスがとくい。　みかたを\nたすけ　てきを　まどわせる\nおどりを　おぼえていく。\n@c0@"
  ko: "@a@b댄스가 특기. 아군을\n돕고 적을 혼란시키는\n춤을 배운다.\n@c0@"
  sl: "@a@b擅长跳舞。\n会使用帮助同伴和\n迷惑敌人的舞蹈。\n@c0@"
  tl: "@a@b擅長跳舞。\n會使用幫助同伴和\n迷惑敵人的舞蹈。\n@c0@"
12:
  en: "@a@bMaybe not the strongest,\nbut without doubt the\nswiftest — and stealiest!\n@c0@"
  ja: "@a@bちからは　たかくないが\nとても　すばやくうごける。\nぬすみのわざを　おぼえる。\n@c0@"
  ko: "@a@b힘은 세지 않지만\n매우 날렵하게 움직인다.\n훔치기 기술을 배운다.\n@c0@"
  sl: "@a@b虽然力量不出众，\n但是动作非常敏捷。\n会使用偷盗技艺。\n@c0@"
  tl: "@a@b雖然力量不出眾，\n但是動作非常敏捷。\n會使用偷盜技藝。\n@c0@"
13:
  en: "@a@bA master of monsters who\r\ncan even appropriate his\r\nbestial buddies' abilities.\n@c0@"
  ja: "@a@bモンスターの　きもちを\nりかいすることで　まものの\nとくぎを　みにつけていく。\n@c0@"
  ko: "@a@b몬스터의 기분을\n이해함으로써 마물의\n특기를 익혀 나간다.\n@c0@"
  sl: "@a@b通过理解怪物的心情\n来学会魔物的特技。\n@c0@"
  tl: "@a@b通過理解怪物的心情\n來學會魔物的特技。\n@c0@"
14:
  en: "@a@bAn expert item appraiser,\r\nmaster of money-making,\r\nand sometime...summoner?\n@c0@"
  ja: "@a@bアイテムの　かんていや\nおかねかせぎが　とくい。\nなにかを　よびだすことも？\n@c0@"
  ko: "@a@b아이템 감정이나\n돈 벌기가 특기.\n뭔가를 불러내기도 한다.\n@c0@"
  sl: "@a@b擅长道具鉴定和赚钱。\n还擅长呼唤？\n@c0@"
  tl: "@a@b擅長道具鑒定和賺錢。\n還擅長呼喚？\n@c0@"
15:
  en: "@a@bTheir main business is\r\npleasure, but they can\r\noccasionally be helpful.\n@c0@"
  ja: "@a@bいつでも　どこでも\nあそんでばかりいるが\nやくにたつことも　ある？\n@c0@"
  ko: "@a@b언제 어디서나\n놀기만 하지만\n가끔은 도움이 될지도?\n@c0@"
  sl: "@a@b无论何时何地\n就只知道玩，\n偶尔也能派上用场？\n@c0@"
  tl: "@a@b無論何時何地\n就只知道玩，\n偶爾也能派上用場？\n@c0@"
16:
  en: "@a@bMixes up warrior and\r\nmartial-artist moves with\r\nmind-blowing results.\n@c0@"
  ja: "@a@bせんしと　ぶとうかのわざを\nあわせた　さらにつよい\nとくぎを　みにつけていく。\n@c0@"
  ko: "@a@b전사와 무투가의 기술을\n융합해서 더욱 강한\n특기를 익혀 나간다.\n@c0@"
  sl: "@a@b具备融合了\n战士和武术家技巧的\n更加强力的特技。\n@c0@"
  tl: "@a@b具備融合了\n戰士和武術家技巧的\n更加強力的特技。\n@c0@"
17:
  en: "@a@bAdd a warrior's skills to a\r\nwizard's spells, and what\r\ndo you get? This guy!\n@c0@"
  ja: "@a@bせんしのわざと　じゅもんの\nチカラを　あわせもった\nとくぎを　みにつけていく。\n@c0@"
  ko: "@a@b전사의 기술과 주문의\n힘을 융합한\n특기를 익혀 나간다.\n@c0@"
  sl: "@a@b具备融合了\n战士的技巧和咒文之力的\n特技。\n@c0@"
  tl: "@a@b具備融合了\n戰士的技巧和咒文之力的\n特技。\n@c0@"
18:
  en: "@a@bMashing up martial artistry\r\nand priestly prowess is\r\ntheir main aim in life.\n@c0@"
  ja: "@a@bぶとうかの　わざと\nそうりょの　まもるチカラを\nあわせたとくぎを　おぼえる。\n@c0@"
  ko: "@a@b무투가의 기술과\n승려의 방어술을\n융합한 특기를 배운다.\n@c0@"
  sl: "@a@b学会融合了\n武术家的技巧和\n僧侣的守护之力的特技。\n@c0@"
  tl: "@a@b學會融合了\n武術家的技巧和\n僧侶的守護之力的特技。\n@c0@"
19:
  en: "@a@bOffensive spells, defensive\r\nones, and even summons\r\nare this savant's speciality.\n@c0@"
  ja: "@a@bこうげきと　かいふくの\nじゅもんをあやつり\nせいれいをも　よびだせる。\n@c0@"
  ko: "@a@b공격과 회복 주문을\n능수능란하게 사용하며\n정령도 불러낸다.\n@c0@"
  sl: "@a@b能够操纵\n攻击和恢复的咒文，\n还能呼唤精灵。\n@c0@"
  tl: "@a@b能夠操縱\n攻擊和恢復的咒文，\n還能呼喚精靈。\n@c0@"
20:
  en: "@a@bBeing at one with nature\r\nlets this talented tracker\r\ntake charge of the elements.\n@c0@"
  ja: "@a@bかぜや　きりなどの\nてんこうをあやつるわざを\nみにつけていく。\n@c0@"
  ko: "@a@b바람과 안개 등 날씨를\n다루는 기술을 익혀 나간다.\n@c0@"
  sl: "@a@b具备能够操纵\n风和雾等天气的\n招数。\n@c0@"
  tl: "@a@b具備能夠操縱\n風和霧等天氣的\n招數。\n@c0@"
21:
  en: "@a@bThis star among stars can\r\nrally allies with a range of\r\npowerful performances.\n@c0@"
  ja: "@a@bカッコいい　うたとおどりで\nなかまをはげます\nスターの　なかの　スター。\n@c0@"
  ko: "@a@b멋진 노래와 춤으로\n아군의 사기를 북돋우는\n스타 중의 스타.\n@c0@"
  sl: "@a@b能够通过美妙的歌声和舞蹈\n来鼓舞伙伴，\n是明星中的明星。\n@c0@"
  tl: "@a@b能夠通過美妙的歌聲和舞蹈\n來鼓舞夥伴，\n是明星中的明星。\n@c0@"
22:
  en: "@a@bA legendary vocation\nblessed with the power\nto overcome all evils.\n@c0@"
  ja: "@a@bやみを　うちはらう\nチカラをもつ\nでんせつの　しょくぎょう。\n@c0@"
  ko: "@a@b어둠을 물리치는 힘을\n지닌 전설의 직업.\n@c0@"
  sl: "@a@b拥有能够驱散黑暗的力量的\n传说中的职业。\n@c0@"
  tl: "@a@b擁有能夠驅散黑暗的力量的\n傳說中的職業。\n@c0@"
23:
  en: "@a@bOne blast of this beast's\r\nbreath is enough to mow\r\ndown any foe.\n@c0@"
  ja: "@a@bきょうりょくな　いきで\nすべての　てきを\nなぎはらう。\n@c0@"
  ko: "@a@b강력한 숨결로 모든\n적을 휩쓴다.\n@c0@"
  sl: "@a@b通过强力的气息\n横扫全部敌人。\n@c0@"
  tl: "@a@b通過強力的氣息\n橫掃全部敵人。\n@c0@"
24:
  en: "@a@bMay not be the best at\r\nfirst, but persist, and you'll\r\nlearn some powerful spells.\n@c0@"
  ja: "@a@bはじめは　よわいが\nきゅうきょくの　じゅもんを\nみにつけることが　できる。\n@c0@"
  ko: "@a@b처음에는 약하지만\n궁극의 주문을\n익힐 수 있다.\n@c0@"
  sl: "@a@b虽然刚开始很弱，\n但是可以学会\n强力的咒文。\n@c0@"
  tl: "@a@b雖然剛開始很弱，\n但是可以學會\n強力的咒文。\n@c0@"
25:
  en: "@a@bNone\n@c0@"
  ja: "@a@bとくになし\n@c0@"
  ko: "@a@b특별히 없음\n@c0@"
  sl: "@a@b无特殊要求\n@c0@"
  tl: "@a@b無特殊要求\n@c0@"
26:
