  ko: "@a@b%a002010: 그런 거구나.\n그럼, 또 하나의\n레이독 성으로 서둘러 가자!\n@c0@"
  sl: "@a@b%a002010：说得没错吧。\n　　走吧，去另一个雷多克城！\n@c0@"
  tl: "@a@b%a002010：說得沒錯吧。\n　　走吧，去另一個雷多克城！\n@c0@"
69:
  en: "@a%0%a002020@bThe King was telling us to go to HIS Somnia Castle, not this one!\n@c0@"
  ja: "@a@b%a002020「王さまが　城に来いと\n\t言ったのは　ここじゃなくて\n\t別の世界の　レイドック城よ！\n@c0@"
  ko: "@a@b%a002020: 왕이 오라고 한 건\n여기 말고 또 다른 세계의\n레이독 성이었어!\n@c0@"
  sl: "@a@b%a002020：国王说到城堡来，\n　　指的不是这里，\n　　是另一个世界的雷多克城！\n@c0@"
  tl: "@a@b%a002020：國王說到城堡來，\n　　指的不是這裡，\n　　是另一個世界的雷多克城！\n@c0@"
70:
  en: "@a%0%a002020@bC'mon, %a000090, let's go!\n@c0@"
  ja: "@a@b%a002020「さあ　行こう　%a000090！\n@c0@"
  ko: "@a@b%a002020: 자, 그럼 가자. %a000090!\n@c0@"
  sl: "@a@b%a002020：走吧，%a000090！\n@c0@"
  tl: "@a@b%a002020：走吧，%a000090！\n@c0@"
71:
  en: "@a%0%a002000@bI'm not keen on leavin' a priest by himself here.\n@c0@"
  ja: "@a@b%a002000「神父さま　ひとりを\n\tここに　残すのは　心配だぜ。\n@c0@"
  ko: "@a@b%a002000: 신부님 혼자\n여기 남겨두려니까 걱정이군.\n@c0@"
  sl: "@a@b%a002000：神父先生一个人留在这里，\n　　有点危险。\n@c0@"
  tl: "@a@b%a002000：神父先生一個人留在這裡，\n　　有點危險。\n@c0@"
72:
  en: "@a%0%a002000@bThen again, he'd be in even worse danger travellin' around with us, so...\n@c0@"
  ja: "@a@b%a002000「といって　いっしょに\n\t連れて行けば　もっと危険な目に\n\tあわせることになるしな……。\n@c0@"
  ko: "@a@b%a002000: 그렇다고 같이\n데려가면 더 위험한\n상황에 처할 테고......\n@c0@"
  sl: "@a@b%a002000：不过跟咱们一起走的话，\n　　恐怕会更危险。\n@c0@"
  tl: "@a@b%a002000：不過跟咱們一起走的話，\n　　恐怕會更危險。\n@c0@"
73:
  en: "@a%0%a002010@bIt's certainly a relief to have a priest here!\n@c0@"
  ja: "@a@b%a002010「ここに　神父さまが\n\tいてくださるだけで　安心だわ。\n@c0@"
  ko: "@a@b%a002010: 이곳에 신부님이\n있어 주시는 것만으로도 안심이 돼.\n@c0@"
