0:
  en: "@aBasil@bGRRARGH! I'm a horrible, scary well wisher! This well belongs to ME! RAAARGH!\n@c0@"
  ja: "@a@bジミー「がおー！　いどまじんだぞー！\n@c0@"
  ko: "@a@b지미: 캬악~! 우물 마신이다~!\n@c0@"
  sl: "@a@b吉米：小心！深井魔人来了！\n@c0@"
  tl: "@a@b吉米：小心！深井魔人來了！\n@c0@"
1:
  en: "@aPrimrose@bA well wisher!? Oh no! Wot am I gonna do!? ...Ha ha! Don't worry, we're only playin'. Nuffin' dangerous, honest!\n@c0@"
  ja: "@a@bキャロル「キャー　キャー！　うふふふ。\n\t私たち　あぶないこと　してないよ。\n\tただ　あそんでるだけだもんね。\n@c0@"
  ko: "@a@b캐롤: 꺄아~ 꺄아~! 우후후훗.\n우리 위험한 거 안 해.\n그냥 놀고 있는 거라구.\n@c0@"
  sl: "@a@b卡萝尔：呀！呀！呵呵呵。\n　　我们可没做什么危险的事哟，\n　　只是在做游戏而已。\n@c0@"
  tl: "@a@b卡蘿爾：呀！呀！呵呵呵。\n　　我們可沒做什麼危險的事喲，\n　　只是在做遊戲而已。\n@c0@"
2:
  en: "@a@b*: I thought I'd hit the road and get out of Wellshire, but those blasted monsters stopped me in my tracks!\n@c0@"
  ja: "@a@b＊「平和になったって　いうんで\n\t行商に出ようとしたら　いきなり\n\tまものと　でくわしちゃってさあ。\n@c0@"
  ko: "@a@b*: 평화로워졌다고들 하길래\n행상을 나가 볼까 했더니만 갑자기\n마물이랑 맞닥뜨렸지 뭐야.\n@c0@"
  sl: "@a@b＊：听说世界和平了，\n　　刚想出去做买卖，\n　　结果就碰上了魔物。\n@c0@"
  tl: "@a@b＊：聽說世界和平了，\n　　剛想出去做買賣，\n　　結果就碰上了魔物。\n@c0@"
3:
  en: "@a@b*: Ah! Glad you took the time to pop by! How's tricks?\n@c0@"
  ja: "@a@b＊「おお　キミたちか。\n\tどうだね　旅のほうは？\n@c0@"
  ko: "@a@b*: 오오, 자네들이군.\n여행은 잘 되고 있나?\n@c0@"
  sl: "@a@b＊：哦，是你们啊。\n　　旅行怎么样了？\n@c0@"
  tl: "@a@b＊：哦，是你們啊。\n　　旅行怎麼樣了？\n@c0@"
4:
  en: "@a@b*: So yer wanderin' the land, bashin' monsters left, right and centre, are ya?\n@c0@"
  ja: "@a@b＊「ほう　ほう……　それは　それは……。\n\tすごい冒険を　しておるんだな。\n@c0@"
  ko: "@a@b*: 호오, 그랬군...... 그랬단 말이지......\n엄청난 모험을 하고 있군.\n@c0@"
  sl: "@a@b＊：哦，哦……是嘛，是嘛……\n　　你们的冒险实在是了不起啊！\n@c0@"
  tl: "@a@b＊：哦，哦……是嘛，是嘛……\n　　你們的冒險實在是了不起啊！\n@c0@"
5:
  en: "@a@b*: Is there anyfin' you lot can't do? Ha ha!\n@c0@"
  ja: "@a@b＊「いや　キミたちは　なにか\n\tやるだろうと　思っていたよ。\n\tわっはっはっはっ。\n@c0@"
  ko: "@a@b*: 역시 자네들이라면 뭔가\n해내지 않을까 생각했지.\n와하하하.\n@c0@"
  sl: "@a@b＊：哎呀，我就知道\n　　你们肯定能成就一番大事。\n　　哇哈哈哈。\n@c0@"
  tl: "@a@b＊：哎呀，我就知道\n　　你們肯定能成就一番大事。\n　　哇哈哈哈。\n@c0@"
6:
  en: "@a@b*: And there was me wantin' to check out that château full of filthy-rich folk to the south-west...\n@c0@"
  ja: "@a@b＊「せっかくだから　南西にあるっていう\n\tお金持ちの館まで　行ってみようと\n\t思っていたのに……残念だよ。\n@c0@"
  ko: "@a@b*: 기왕에 나선 거, 남서쪽에 있다는\n부자의 저택에나 가 보려고\n했는데...... 아쉽게 됐어.\n@c0@"
  sl: "@a@b＊：本来还想着机会难得，\n　　打算去西南边那个\n　　有钱人的豪宅看看呢……真遗憾。\n@c0@"
  tl: "@a@b＊：本來還想著機會難得，\n　　打算去西南邊那個\n　　有錢人的豪宅看看呢……真遺憾。\n@c0@"
7:
  en: "@a@b*: Y'know, even though Murdaw's been sent packin', you can still feel a lingerin' sense of evil in the air.\n@c0@"
  ja: "@a@b＊「魔王ムドーが　いなくなった今も\n\tまがまがしい気配は\n\tこの世界から　消えてはいない。\n@c0@"
  ko: "@a@b*: 마왕 무도가 없어진 지금도\n불길한 기운은\n이 세계에서 사라질 줄을 모르고 있지.\n@c0@"
  sl: "@a@b＊：即使消灭了魔王姆多，\n　　不祥的气息依旧\n　　没有从世界上消失。\n@c0@"
  tl: "@a@b＊：即使消滅了魔王姆多，\n　　不祥的氣息依舊\n　　沒有從世界上消失。\n@c0@"
8:
  en: "@a@b*: Wot I'm tryin' to say is, I fink there'll be plenty of work for the likes of me in the future!\n@c0@"
  ja: "@a@b＊「つまり　時代は\n\tまだ　わしを必要としている……\n\tということだ。\n@c0@"
  ko: "@a@b*: 즉, 이 시대는\n아직 나를 필요로 하고 있다는\n뜻이군......\n@c0@"
  sl: "@a@b＊：也就是说，\n　　这个时代还是……\n　　需要我的吧。\n@c0@"
  tl: "@a@b＊：也就是說，\n　　這個時代還是……\n　　需要我的吧。\n@c0@"
