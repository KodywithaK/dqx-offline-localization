1:
  en: "@a@b*: Welcome to our inn, weary %H0860%Xtraveller%Ytravellers%Z! You must be exhausted at this late hour.\n@c0@"
  ja: "@a@b＊「ようこそ　旅の宿に。\n\t夜道を　歩かれて\n\tさぞや　お疲れでしょう。\n@c0@"
  ko: "@a@b*: 여행자의 여관에 오신 것을 환영합니다.\n밤길을 걷느라\n무척 지치셨죠?\n@c0@"
  sl: "@a@b＊：欢迎来到旅店。\n　　走了很久夜路，\n　　想必您很疲惫了吧。\n@c0@"
  tl: "@a@b＊：歡迎來到旅店。\n　　走了很久夜路，\n　　想必您很疲憊了吧。\n@c0@"
2:
  en: "@a@b*: Our rate is %a000510 gold coins per night. Will you be staying?\n@c0@"
  ja: "@a@b＊「ひと晩　%a000510ゴールドですが\n\tお泊まりに　なりますか？\n@c0@"
  ko: "@a@b*: 하룻밤에 %a000510골드입니다.\n묵고 가시겠습니까?\n@c0@"
  sl: "@a@b＊：一晚是%a000510金币，\n　　您要留宿吗？\n@c0@"
  tl: "@a@b＊：一晚是%a000510金幣，\n　　您要留宿嗎？\n@c0@"
3:
  en: "@a@b*: Please enjoy your stay!\n@c0@"
  ja: "@a@b＊「それでは　ごゆっくり\n\tおやすみください。\n@c0@"
  ko: "@a@b*: 그럼 편히\n쉬십시오.\n@c0@"
  sl: "@a@b＊：那么请好好休息。\n@c0@"
  tl: "@a@b＊：那麼請好好休息。\n@c0@"
4:
  en: "@a@b*: Good morning! I trust you had a restful sleep? Do come again!\n@c0@"
  ja: "@a@b＊「おはようございます。\n\tでは　いってらっしゃいませ。\n@c0@"
  ko: "@a@b*: 좋은 아침입니다.\n그럼 안녕히 다녀오세요.\n@c0@"
  sl: "@a@b＊：早上好。\n　　请您慢走。\n@c0@"
  tl: "@a@b＊：早上好。\n　　請您慢走。\n@c0@"
5:
  en: "@a@b*: I'm terribly sorry, but you don't appear to have enough money.\n@c0@"
  ja: "@a@b＊「でも\n\tお金が　たりないようですね。\n@c0@"
  ko: "@a@b*: 하지만 돈이\n모자란 것 같군요.\n@c0@"
  sl: "@a@b＊：但是您的钱好像不够啊。\n@c0@"
  tl: "@a@b＊：但是您的錢好像不夠啊。\n@c0@"
6:
  en: "@a@b*: Farewell, intrepid %H0860%Xtraveller%Ytravellers%Z. May your onward journey be safe and prosperous.\n@c0@"
  ja: "@a@b＊「さようなら　旅の人。\n\tお気をつけて　旅を\n\tつづけられますように。\n@c0@"
  ko: "@a@b*: 안녕히 가세요, 여행자님.\n몸조심해서 여행을\n계속하시기를.\n@c0@"
  sl: "@a@b＊：再见了，旅行者。\n　　愿您一路平安。\n@c0@"
  tl: "@a@b＊：再見了，旅行者。\n　　願您一路平安。\n@c0@"
