0:
  en: "@a%0%a002000@bAvast there, %a000090! What're we doin' here again?\n@c0@"
  ja: "@a@b%a002000「おいおい　%a000090。\n\tなんでまた　ここに　来たんだよ。\n@c0@"
  ko: "@a@b%a002000: 어이, %a000090.\n왜 또 여길 온 거냐?\n@c0@"
  sl: "@a@b%a002000：喂喂，%a000090。\n　　怎么又来这里了啊？\n@c0@"
  tl: "@a@b%a002000：喂喂，%a000090。\n　　怎麼又來這裡了啊？\n@c0@"
1:
  en: "@a%0%a002000@bI dunno if you've noticed, but I don't like dealin' with this little fella much.\n@c0@"
  ja: "@a@b%a002000「オレさあ……\n\tあのオヤジ　あんまり\n\tとくいじゃ　ないんだよな……。\n@c0@"
  ko: "@a@b%a002000: 난 말이지......\n저 영감은 아무래도\n대하기가 껄끄러워......\n@c0@"
  sl: "@a@b%a002000：俺……\n　　不太会应付\n　　那老家伙啊……\n@c0@"
  tl: "@a@b%a002000：俺……\n　　不太會應付\n　　那老傢伙啊……\n@c0@"
2:
  en: "@a%0%a002010@bThe scent of wood here is quite relaxing.\n@c0@"
  ja: "@a@b%a002010「ここは\n\t木の　においのする\n\tすてきな　ところね。\n@c0@"
  ko: "@a@b%a002010: 여긴\n나무 냄새가 나는\n멋진 곳이네.\n@c0@"
  sl: "@a@b%a002010：这里弥漫着\n　　树木的芬芳，\n　　真是太棒了。\n@c0@"
  tl: "@a@b%a002010：這裡彌漫著\n　　樹木的芬芳，\n　　真是太棒了。\n@c0@"
3:
  en: "@a%0%a002050@bWho'd choose to live all the way out here?\n@c0@"
  ja: "@a@b%a002050「あのう……。\n\tだれか　こんな　ところに\n\t住んでいるんですか？\n@c0@"
  ko: "@a@b%a002050: 저기......\n이런 곳에 사람이\n살고 있는 건가요?\n@c0@"
  sl: "@a@b%a002050：那个……\n　　是有谁住在这里吗？\n@c0@"
  tl: "@a@b%a002050：那個……\n　　是有誰住在這裡嗎？\n@c0@"
4:
  en: "@a%0%a002000@bLovable as always, aye?\n@c0@"
  ja: "@a@b%a002000「ま　あいかわらず\n\tってとこだな。\n@c0@"
  ko: "@a@b%a002000: 뭐, 하나도\n변한 게 없군.\n@c0@"
  sl: "@a@b%a002000：唉，一点都没变啊。\n@c0@"
  tl: "@a@b%a002000：唉，一點都沒變啊。\n@c0@"
5:
  en: "@a%0%a002010@bWouldn't it be wonderful to live such a simple, carefree life, %a000090?\n@c0@"
  ja: "@a@b%a002010「まわりのことは\n\t関係ない……か。\n\tある意味　うらやましいわね。\n@c0@"
  ko: "@a@b%a002010: 주변 일은\n관계없다고......\n어떤 면에선 부럽기도 하네.\n@c0@"
  sl: "@a@b%a002010：莫管他人瓦上霜啊。\n　　从某种意义上，\n　　这还真让人羡慕。\n@c0@"
  tl: "@a@b%a002010：莫管他人瓦上霜啊。\n　　從某種意義上，\n　　這還真讓人羡慕。\n@c0@"
6:
  en: "@a%0%a002020@bThis guy talks a lot tougher than he looks.\n@c0@"
  ja: "@a@b%a002020「この　おじさん\n\t顔に　似合わないこと\n\tいってるね……。\n@c0@"
  ko: "@a@b%a002020: 이 아저씨,\n얼굴이랑 안 어울리는\n소릴 하네......\n@c0@"
  sl: "@a@b%a002020：这个大叔，\n　　说的话和表情不相符呢……\n@c0@"
  tl: "@a@b%a002020：這個大叔，\n　　說的話和表情不相符呢……\n@c0@"
7:
  en: "@a%0%a002030@bHe certainly takes things at his own pace...\n@c0@"
  ja: "@a@b%a002030「マイペースな\n\tかたなんですね。\n@c0@"
  ko: "@a@b%a002030: 자기 방식대로 사는\n분이군요.\n@c0@"
  sl: "@a@b%a002030：真是一个\n　　我行我素的人啊。\n@c0@"
  tl: "@a@b%a002030：真是一個\n　　我行我素的人啊。\n@c0@"
8:
  en: "@a%0%a002050@bYou've got no shortage of friends and acquaintances, have you, %a000090?\n@c0@"
  ja: "@a@b%a002050「%a000090さんには\n\tいろいろな　お知り合いが\n\tいらっしゃるのですね。\n@c0@"
  ko: "@a@b%a002050: %a000090 님에겐\n다양한 지인들이\n있군요.\n@c0@"
  sl: "@a@b%a002050：%a000090认识\n　　各种各样的人呢。\n@c0@"
  tl: "@a@b%a002050：%a000090認識\n　　各種各樣的人呢。\n@c0@"
9:
  en: "@a%0%a002040@bThere's something appealing about making a living by chopping wood...\n@c0@"
  ja: "@a@b%a002040「木を　切るだけの\n\tくらしか……それはそれで\n\tおもしろそうだな。\n@c0@"
  ko: "@a@b%a002040: 죽어라 나무만 베는\n삶이라...... 그건 그것대로\n재밌겠군.\n@c0@"
  sl: "@a@b%a002040：成天砍树的人生……\n　　也有其有趣之处吧。\n@c0@"
  tl: "@a@b%a002040：成天砍樹的人生……\n　　也有其有趣之處吧。\n@c0@"
10:
  en: "@a%0%a002000@bGood to see he's startin' to get a little self-confidence.\n@c0@"
  ja: "@a@b%a002000「へえ。　\n\tこいつも　だんだん　自信を\n\tつけてきたみたいだな。\n@c0@"
  ko: "@a@b%a002000: 호오.\n이 녀석도 조금씩 자신감이\n붙은 모양이군.\n@c0@"
  sl: "@a@b%a002000：诶。\n　　这家伙也渐渐\n　　变得自信起来了啊。\n@c0@"
  tl: "@a@b%a002000：誒。\n　　這傢伙也漸漸\n　　變得自信起來了啊。\n@c0@"
11:
  en: "@a%0%a002010@bHe's clearly terrified of his boss...\n@c0@"
  ja: "@a@b%a002010「ちょっと　いばってみても\n\t親方は　こわいみたいね。\n@c0@"
  ko: "@a@b%a002010: 으스대고 싶어 하더니\n그래도 스승님은 무서운가 보네.\n@c0@"
  sl: "@a@b%a002010：虽然是嚣张了点，\n　　但是还是很怕自己师父的吧。\n@c0@"
  tl: "@a@b%a002010：雖然是囂張了點，\n　　但是還是很怕自己師父的吧。\n@c0@"
12:
  en: "@a%0%a002020@bThe ‘number-one apprentice’? He looks like the only apprentice to me!\n@c0@"
  ja: "@a@b%a002020「１番弟子って……\n\tそもそも　ひとりしか\n\tいないじゃないね！\n@c0@"
  ko: "@a@b%a002020: 1등 제자라니......\n아무리 봐도 제자는\n하나밖에 없잖아!\n@c0@"
  sl: "@a@b%a002020：头号弟子……\n　　不是本来就只有一个人吗！\n@c0@"
  tl: "@a@b%a002020：頭號弟子……\n　　不是本來就只有一個人嗎！\n@c0@"
13:
  en: "@a%0%a002030@bHe seems to be in perfect harmony with his surroundings.\n@c0@"
  ja: "@a@b%a002030「とても　なれた手つきで\n\t仕事を　していますね。\n@c0@"
  ko: "@a@b%a002030: 아주 능숙한 손놀림으로\n일하고 있군요.\n@c0@"
  sl: "@a@b%a002030：干活的手法\n　　真是熟练啊。\n@c0@"
  tl: "@a@b%a002030：幹活的手法\n　　真是熟練啊。\n@c0@"
14:
  en: "@a%0%a002050@bThis is a top-notch hut, and no mistake.\n@c0@"
  ja: "@a@b%a002050「いやー！\n\tここは　じつに　りっぱな\n\t小屋ですねー！\n@c0@"
  ko: "@a@b%a002050: 이야~!\n여긴 정말 훌륭한\n오두막이네요~!\n@c0@"
  sl: "@a@b%a002050：哎呀，这个小屋\n　　真不错啊！\n@c0@"
  tl: "@a@b%a002050：哎呀，這個小屋\n　　真不錯啊！\n@c0@"
15:
  en: "@a%0%a002050@bIt must have been built by a famous carpenter!\n@c0@"
  ja: "@a@b%a002050「きっと　名のある\n\t大工さんが　つくったに\n\tちがいありませんよ！\n@c0@"
  ko: "@a@b%a002050: 분명히 아주\n유명한 목수가\n지었을 겁니다!\n@c0@"
  sl: "@a@b%a002050：这一定是\n　　有名的木匠师傅建造的！\n@c0@"
  tl: "@a@b%a002050：這一定是\n　　有名的木匠師傅建造的！\n@c0@"
16:
  en: "@a%0%a002040@bA little bit of hard work will do him good...\n@c0@"
  ja: "@a@b%a002040「ごくろうな　こった。\n@c0@"
  ko: "@a@b%a002040: 수고가 많군.\n@c0@"
  sl: "@a@b%a002040：辛苦了呢。\n@c0@"
  tl: "@a@b%a002040：辛苦了呢。\n@c0@"
17:
  en: "@a%0%a002000@bWhoa! Look at this place! Is this Alltrades Abbey!?\n@c0@"
  ja: "@a@b%a002000「おおっ　すごいな！\n\tここが　ダーマの神殿なのか！？\n@c0@"
  ko: "@a@b%a002000: 오옷, 대단한걸!\n여기가 다마 신전인가!?\n@c0@"
  sl: "@a@b%a002000：哦，真厉害！\n　　这里就是达玛神殿吧？！\n@c0@"
  tl: "@a@b%a002000：哦，真厲害！\n　　這裡就是達瑪神殿吧？！\n@c0@"
18:
  en: "@a%0%a002010@bI knew it! Alltrades Abbey in the dream world has been restored!\n@c0@"
  ja: "@a@b%a002010「やっぱり\n\t上の世界で　ダーマ神殿が\n\tよみがえっていたのね！\n@c0@"
  ko: "@a@b%a002010: 역시\n위쪽 세계에서 다마 신전이\n부활해 있었구나!\n@c0@"
  sl: "@a@b%a002010：上面世界的达玛神殿，\n 　　果然已经复活了呢！\n@c0@"
  tl: "@a@b%a002010：上面世界的達瑪神殿，\n 　　果然已經復活了呢！\n@c0@"
19:
  en: "@a%0%a002020@bC'mon, let's mingle and find out about this place.\n@c0@"
  ja: "@a@b%a002020「話を　聞けそうな\n\t人には　どんどん\n\tお話　ききましょ。\n@c0@"
  ko: "@a@b%a002020: 이야기를 들을 수 있는\n사람에게는 적극적으로\n말을 걸어 보자구.\n@c0@"
  sl: "@a@b%a002020：去找\n　　看上去帮得上忙的人\n　　问问看吧。\n@c0@"
  tl: "@a@b%a002020：去找\n　　看上去幫得上忙的人\n　　問問看吧。\n@c0@"
20:
  en: "@a%0%a002030@bI must confess that I am most taken aback by this...\n@c0@"
  ja: "@a@b%a002030「これは\n\tおどろきましたね……。\n@c0@"
  ko: "@a@b%a002030: 정말\n놀랍군요......\n@c0@"
  sl: "@a@b%a002030：这还真是\n　　让人吃惊呢……\n@c0@"
  tl: "@a@b%a002030：這還真是\n　　讓人吃驚呢……\n@c0@"
21:
  en: "@a%0%a002050@bTake a look at this place, would you? It's bloomin' marvellous!\n@c0@"
  ja: "@a@b%a002050「うわあ！\n\tりっぱな　神殿ですね！\n@c0@"
  ko: "@a@b%a002050: 우와!\n훌륭한 신전이네요!\n@c0@"
  sl: "@a@b%a002050：哇！\n　　这神殿真是宏伟壮观啊！\n@c0@"
  tl: "@a@b%a002050：哇！\n　　這神殿真是宏偉壯觀啊！\n@c0@"
22:
  en: "@a%0%a002000@bLet's scout around 'n' see how things work around here.\n@c0@"
  ja: "@a@b%a002000「さあてと。\n\t中は　いったい\n\tどんなふうに　なってるんだ？\n@c0@"
  ko: "@a@b%a002000: 어디 보자.\n건물 안은 어떻게\n생겼지?\n@c0@"
  sl: "@a@b%a002000：那么，\n　　里面究竟\n　　变成啥样了呢？\n@c0@"
  tl: "@a@b%a002000：那麼，\n　　裡面究竟\n　　變成啥樣了呢？\n@c0@"
23:
  en: "@a%0%a002010@bIt seems people take on all kinds of different roles in life.\n@c0@"
  ja: "@a@b%a002010「いろんな　人が\n\tいろんな　役割を\n\t受け持って　いるようね。\n@c0@"
  ko: "@a@b%a002010: 다양한 사람들이\n다양한 역할을\n맡고 있나 보구나.\n@c0@"
  sl: "@a@b%a002010：这里\n　　人尽其责呢。\n@c0@"
  tl: "@a@b%a002010：這裡\n　　人盡其責呢。\n@c0@"
24:
  en: "@a%0%a002020@bSo...so this is Alltrades Abbey?\n@c0@"
  ja: "@a@b%a002020「ここが……\n\tダーマ神殿……？\n@c0@"
  ko: "@a@b%a002020: 여기가......\n다마 신전......?\n@c0@"
  sl: "@a@b%a002020：这里就是……\n　　达玛神殿？\n@c0@"
  tl: "@a@b%a002020：這裡就是……\n　　達瑪神殿？\n@c0@"
25:
  en: "@a%0%a002030@bThere are stairs leading down as well. Let us be careful not to lose our way.\n@c0@"
  ja: "@a@b%a002030「下に　続く\n\t階段も　あるのですね。\n\t迷わないように　しないと。\n@c0@"
  ko: "@a@b%a002030: 아래로 이어진\n계단도 있는 모양입니다.\n헤매지 않도록 조심해야겠군요.\n@c0@"
  sl: "@a@b%a002030：有楼梯通往下层呢。\n　　要注意\n　　别迷路啊。\n@c0@"
  tl: "@a@b%a002030：有樓梯通往下層呢。\n　　要注意\n　　別迷路啊。\n@c0@"
26:
  en: "@a%0%a002050@bThere's somethin' so dignified about this place. It's not somewhere for idle chit-chat.\n@c0@"
  ja: "@a@b%a002050「なんだか　おしゃべりしちゃ\n\tいけないくらいの\n\tいげんを　感じますね。\n@c0@"
  ko: "@a@b%a002050: 왠지 떠들면\n안 될 것 같은\n위엄이 느껴지네요.\n@c0@"
  sl: "@a@b%a002050：总觉得随便说话\n　　会打破这种\n　　庄严肃穆的气氛呢。\n@c0@"
  tl: "@a@b%a002050：總覺得隨便說話\n　　會打破這種\n　　莊嚴肅穆的氣氛呢。\n@c0@"
27:
  en: "@a%0%a002000@bCrowded as always, aye?\n@c0@"
  ja: "@a@b%a002000「今日も　ダーマには\n\tたくさんの　人がいるな。\n@c0@"
  ko: "@a@b%a002000: 오늘도 다마에는\n많은 사람들이 있군.\n@c0@"
  sl: "@a@b%a002000：今天达玛神殿里\n　　来了好多人呢。\n@c0@"
  tl: "@a@b%a002000：今天達瑪神殿裡\n　　來了好多人呢。\n@c0@"
28:
  en: "@a%0%a002010@bLet's keep quiet so as not to disturb people's prayers.\n@c0@"
  ja: "@a@b%a002010「お祈りの　さまたげに\n\tならないよう　静かに\n\t歩きましょうね。\n@c0@"
  ko: "@a@b%a002010: 기도하는데\n방해가 되지 않도록\n조용히 걷자.\n@c0@"
  sl: "@a@b%a002010：我们走路轻点，\n　　不要发出噪音\n　　打扰了大家的祈祷。\n@c0@"
  tl: "@a@b%a002010：我們走路輕點，\n　　不要發出噪音\n　　打擾了大家的祈禱。\n@c0@"
29:
  en: "@a%0%a002020@bI really love it here. The place has...atmosphere.\n@c0@"
  ja: "@a@b%a002020「あたし\n\tダーマ神殿の　ふんいきって\n\t大好きだな。\n@c0@"
  ko: "@a@b%a002020: 나,\n다마 신전의 분위기가\n참 좋아.\n@c0@"
  sl: "@a@b%a002020：我超级喜欢\n　　达玛神殿这种气氛呢。\n@c0@"
  tl: "@a@b%a002020：我超級喜歡\n　　達瑪神殿這種氣氛呢。\n@c0@"
30:
  en: "@a%0%a002030@bHas anyone changed their vocation today?\n@c0@"
  ja: "@a@b%a002030「今日は　だれか\n\t転職が　できましたっけ？\n@c0@"
  ko: "@a@b%a002030: 오늘은 누가\n전직하는 날이었던가요?\n@c0@"
  sl: "@a@b%a002030：今天有谁\n　　转职了吗？\n@c0@"
  tl: "@a@b%a002030：今天有誰\n　　轉職了嗎？\n@c0@"
31:
  en: "@a%0%a002050@bThis place feels a bit above old %a002050's station...\n@c0@"
  ja: "@a@b%a002050「ここには　いつ来ても\n\t身が　引きしまる　思いです。\n@c0@"
  ko: "@a@b%a002050: 여기는 언제 와도\n잔뜩 긴장됩니다.\n@c0@"
  sl: "@a@b%a002050：每次来这里，\n　　都觉得浑身紧绷绷的。\n@c0@"
  tl: "@a@b%a002050：每次來這裡，\n　　都覺得渾身緊繃繃的。\n@c0@"
32:
  en: "@a%0%a002040@bSomething in the air here tells monsters to steer clear.\n@c0@"
  ja: "@a@b%a002040「さすがに　まものも\n\t近づけない　ふんいきだな。\n@c0@"
  ko: "@a@b%a002040: 이 정도면 마물도\n다가올 수 없는 분위기군.\n@c0@"
  sl: "@a@b%a002040：这种氛围，\n　　连魔物都无法靠近吧。\n@c0@"
  tl: "@a@b%a002040：這種氛圍，\n　　連魔物都無法靠近吧。\n@c0@"
33:
  en: "@a%0%a002060@b(spit) This... Alltrades Abbey... (snarl)\n@c0@"
  ja: "@a@b%a002060「ここ…ダーマ…神殿。\n@c0@"
  ko: "@a@b%a002060: 여기...다마...신전.\n@c0@"
  sl: "@a@b%a002060：这里……达玛……神殿。\n@c0@"
  tl: "@a@b%a002060：這裡……達瑪……神殿。\n@c0@"
34:
  en: "@a%0%a002070@bBoi-oing!\n@c0@"
  ja: "@a@b%a002070「プルリンッ！\n@c0@"
  ko: "@a@b%a002070: 뽀요용!\n@c0@"
  sl: "@a@b%a002070：噗噜哩！\n@c0@"
  tl: "@a@b%a002070：噗嚕哩！\n@c0@"
35:
  en: "@a%0%a002000@bI'm glad we got this place goin' again.\n@c0@"
  ja: "@a@b%a002000「ここが　復活して\n\t本当に　よかったよな。\n@c0@"
  ko: "@a@b%a002000: 이곳이 부활해서\n정말 다행이군.\n@c0@"
  sl: "@a@b%a002000：这里能够复活，\n　　真是太好了。\n@c0@"
  tl: "@a@b%a002000：這裡能夠復活，\n　　真是太好了。\n@c0@"
36:
  en: "@a%0%a002010@bI sense that we'll be making many visits to this place.\n@c0@"
  ja: "@a@b%a002010「私たち\n\tこの先　何回くらい　ここで\n\tお世話に　なるのかしらね。\n@c0@"
  ko: "@a@b%a002010: 우리는\n앞으로 몇 번이나 이곳에서\n신세를 지게 될까?\n@c0@"
  sl: "@a@b%a002010：我们今后\n　　还会多次\n　　来这里拜访的吧。\n@c0@"
  tl: "@a@b%a002010：我們今後\n　　還會多次\n　　來這裡拜訪的吧。\n@c0@"
37:
  en: "@a%0%a002020@bThe soldiers here seem different from the ones at other castles.\n@c0@"
  ja: "@a@b%a002020「ここの　兵隊さんは\n\tよその　お城とは　ふんいきが\n\tちがって見えるね。\n@c0@"
  ko: "@a@b%a002020: 이곳의 병사는\n다른 성에 있는 사람들이랑은\n분위기가 달라 보여.\n@c0@"
  sl: "@a@b%a002020：这里的兵哥哥\n　　跟隔壁城比起来，\n　　气氛不太一样呢。\n@c0@"
  tl: "@a@b%a002020：這裡的兵哥哥\n　　跟隔壁城比起來，\n　　氣氛不太一樣呢。\n@c0@"
38:
  en: "@a%0%a002030@bFor such a sacred place to have been sealed off by monstrous forces is...an unforgivable waste. They will pay!\n@c0@"
  ja: "@a@b%a002030「こんな　神聖な場所を\n\tまものが　封印したなんて　本当に\n\tゆるせないことですね！\n@c0@"
  ko: "@a@b%a002030: 이런 신성한 장소가\n마물 때문에 봉인되어 있었다니\n정말 용서할 수 없군요!\n@c0@"
  sl: "@a@b%a002030：魔物居然把\n　　这神圣之地封印了起来，\n　　不可饶恕！\n@c0@"
  tl: "@a@b%a002030：魔物居然把\n　　這神聖之地封印了起來，\n　　不可饒恕！\n@c0@"
39:
  en: "@a%0%a002050@bThe soldiers here are a cut above the rest.\n@c0@"
  ja: "@a@b%a002050「強そうで\n\tあたまの　良さそうな\n\t兵隊さんですね。\n@c0@"
  ko: "@a@b%a002050: 강하고\n똑똑해 보이는\n병사로군요.\n@c0@"
  sl: "@a@b%a002050：这里的士兵\n　　看起来真强，\n　　头脑也不错。\n@c0@"
  tl: "@a@b%a002050：這裡的士兵\n　　看起來真強，\n　　頭腦也不錯。\n@c0@"
40:
  en: "@a%0%a002040@bLet's see what else is in here.\n@c0@"
  ja: "@a@b%a002040「奥へいこうか。\n@c0@"
  ko: "@a@b%a002040: 안쪽으로 가 보지.\n@c0@"
  sl: "@a@b%a002040：往里走走吧。\n@c0@"
  tl: "@a@b%a002040：往裡走走吧。\n@c0@"
41:
  en: "@a%0%a002060@b(slobber) Alltrades... Sacred place... (snarl)\n@c0@"
  ja: "@a@b%a002060「神聖…な…場所…ダーマ。\n@c0@"
  ko: "@a@b%a002060: 신성...한...장소...다마.\n@c0@"
  sl: "@a@b%a002060：神圣……之地……达玛。\n@c0@"
  tl: "@a@b%a002060：神聖……之地……達瑪。\n@c0@"
42:
  en: "@a%0%a002070@bBoing boing! (jiggle)\n@c0@"
  ja: "@a@b%a002070「プルルルッ！\n@c0@"
  ko: "@a@b%a002070: 뽀르르르!\n@c0@"
  sl: "@a@b%a002070：噗噜噜！\n@c0@"
  tl: "@a@b%a002070：噗嚕嚕！\n@c0@"
43:
  en: "@a%0%a002000@bI reckon this lady musta been sealed away with the Abbey. What's this about ‘abilities’, though?\n@c0@"
  ja: "@a@b%a002000「この神殿と　いっしょに\n\t眠っていた　人なんだな。\n\tしかし　新しい　能力とは……？\n@c0@"
  ko: "@a@b%a002000: 이 신전과 함께\n잠들어 있었던 사람인가 보군.\n그나저나 새로운 능력이라니......?\n@c0@"
  sl: "@a@b%a002000：这人和神殿\n　　一直沉睡着呢吧。\n　　不过崭新的力量到底是……\n@c0@"
  tl: "@a@b%a002000：這人和神殿\n　　一直沉睡著呢吧。\n　　不過嶄新的力量到底是……\n@c0@"
44:
  en: "@a%0%a002010@bShe doesn't seem to recall the details of what happened.\n@c0@"
  ja: "@a@b%a002010「ダーマ神殿が\n\t復活したときの　ようすは\n\t覚えていないようね。\n@c0@"
  ko: "@a@b%a002010: 다마 신전이\n부활했을 때의 상황은\n기억 못 하나 봐.\n@c0@"
  sl: "@a@b%a002010：好像不记得\n　　达玛神殿复活时候\n　　的样子了呢。\n@c0@"
  tl: "@a@b%a002010：好像不記得\n　　達瑪神殿復活時候\n　　的樣子了呢。\n@c0@"
45:
  en: "@a%0%a002020@bAbilities I never dreamt I had, huh? Wait till the monsters get a load of those!\n@c0@"
  ja: "@a@b%a002020「その　新しい能力を\n\tまものたちが　おそれているのね。\n@c0@"
  ko: "@a@b%a002020: 그 새로운 능력을\n마물들이 두려워하는 거구나.\n@c0@"
  sl: "@a@b%a002020：这种崭新的力量，\n　　一定能震慑到魔物吧。\n@c0@"
  tl: "@a@b%a002020：這種嶄新的力量，\n　　一定能震懾到魔物吧。\n@c0@"
46:
  en: "@a%0%a002030@bThe Abbey does indeed appear to have been revived very recently.\n@c0@"
  ja: "@a@b%a002030「本当に　つい最近\n\t復活した　ばかりのようですね。\n@c0@"
  ko: "@a@b%a002030: 부활한 지가\n정말 얼마 안 된 모양입니다.\n@c0@"
  sl: "@a@b%a002030：好像真的是\n　　前不久才复活起来的呢。\n@c0@"
  tl: "@a@b%a002030：好像真的是\n　　前不久才復活起來的呢。\n@c0@"
47:
  en: "@a%0%a002050@bSeems like they don't have a clue that it was Murdaw who imprisoned them all.\n@c0@"
  ja: "@a@b%a002050「ムドーが　封じ込めたのも\n\tごぞんじ　ないようですね。\n@c0@"
  ko: "@a@b%a002050: 무도가 봉인했던 것도\n모르시나 보네요.\n@c0@"
  sl: "@a@b%a002050：好像还不知道\n　　是姆多封印了神殿呢。\n@c0@"
  tl: "@a@b%a002050：好像還不知道\n　　是姆多封印了神殿呢。\n@c0@"
48:
  en: "@a%0%a002000@b‘Change paths’, aye...? Which way're you headed today, %a000090?\n@c0@"
  ja: "@a@b%a002000「ゆくも　よし\n\tもどるも　よし……か。\n\t%a000090　今日は　どうする？\n@c0@"
  ko: "@a@b%a002000: 떠나가도 좋고 돌아와도 좋다고......\n%a000090, 오늘은 어떻게 할까?\n@c0@"
  sl: "@a@b%a002000：归去来兮\n　　皆有其意啊……\n　　%a000090，今天咱做点啥？\n@c0@"
  tl: "@a@b%a002000：歸去來兮\n　　皆有其意啊……\n　　%a000090，今天咱做點啥？\n@c0@"
49:
  en: "@a%0%a002010@bI hope that Alltrades Abbey continues to thrive for many years to come.\n@c0@"
  ja: "@a@b%a002010「これからも　末ながく\n\tダーマの神殿が\n\t栄えますように……。\n@c0@"
  ko: "@a@b%a002010: 앞으로도 오래도록\n다마 신전이\n번영하기를......\n@c0@"
  sl: "@a@b%a002010：愿今后\n　　达玛神殿\n　　永远兴旺昌盛……\n@c0@"
  tl: "@a@b%a002010：願今後\n　　達瑪神殿\n　　永遠興旺昌盛……\n@c0@"
50:
  en: "@a%0%a002020@bThat woman gives the best pep talks. She makes me feel full of potential!\n@c0@"
  ja: "@a@b%a002020「この人と　お話をするたび\n\tなんだか　体の中から　新しい力が\n\tわいてくる　気がするわ。\n@c0@"
  ko: "@a@b%a002020: 이 사람이랑 얘기할 때마다\n왠지 몸속에서 새로운 힘이\n솟아나는 것만 같아.\n@c0@"
  sl: "@a@b%a002020：每次跟这个人说话，\n　　总觉得体内有一股\n　　新的力量在往外涌呢。\n@c0@"
  tl: "@a@b%a002020：每次跟這個人說話，\n　　總覺得體內有一股\n　　新的力量在往外湧呢。\n@c0@"
51:
  en: "@a%0%a002030@bShe speaks the truth. Life is indeed the greatest of journeys.\n@c0@"
  ja: "@a@b%a002030「いつもながら\n\tすてきな　でむかえの\n\tお言葉ですね。\n@c0@"
  ko: "@a@b%a002030: 항상 느끼는 거지만\n멋진 환영의\n인사로군요.\n@c0@"
  sl: "@a@b%a002030：跟往常一样\n　　热情迎接我们了呢。\n@c0@"
  tl: "@a@b%a002030：跟往常一樣\n　　熱情迎接我們了呢。\n@c0@"
52:
  en: "@a%0%a002050@bWhen a classy lass like this talks, old %a002050 tends to drift off into a nice daydream.\n@c0@"
  ja: "@a@b%a002050「高貴な女性と\n\tこうして　お話を　していると\n\tなんだか　ボーッとします。\n@c0@"
  ko: "@a@b%a002050: 지체 높은 여성과\n이렇게 이야기를 나누면\n왠지 힘이 풀리고 맙니다.\n@c0@"
  sl: "@a@b%a002050：能跟如此\n　　高贵的女士对话，\n　　脑袋都有点懵了。\n@c0@"
  tl: "@a@b%a002050：能跟如此\n　　高貴的女士對話，\n　　腦袋都有點懵了。\n@c0@"
53:
  en: "@a%0%a002040@bLet's hurry up and take care of business.\n@c0@"
  ja: "@a@b%a002040「さあ　さっさと\n\t用事を　すまそうぜ。\n@c0@"
  ko: "@a@b%a002040: 자, 어서\n볼일이나 보자고.\n@c0@"
  sl: "@a@b%a002040：赶紧办正事吧。\n@c0@"
  tl: "@a@b%a002040：趕緊辦正事吧。\n@c0@"
54:
  en: "@a%0%a002060@b(splutter) Awaken abilities... Alltrades... (spit)\n@c0@"
  ja: "@a@b%a002060「ダーマ…神殿…能力…\n\tめざめさせる……。\n@c0@"
  ko: "@a@b%a002060: 다마...신전...능력...\n일깨운다......\n@c0@"
  sl: "@a@b%a002060：达玛……神殿……\n　　能力……觉醒……\n@c0@"
  tl: "@a@b%a002060：達瑪……神殿……\n　　能力……覺醒……\n@c0@"
55:
  en: "@a%0%a002070@bBoing boi-oing! (slurp)\n@c0@"
  ja: "@a@b%a002070「プッププ　プルルルーッ！\n@c0@"
  ko: "@a@b%a002070: 뿌뿌뿌~ 뽀르르!\n@c0@"
  sl: "@a@b%a002070：噗噗噗～噗噜噜！\n@c0@"
  tl: "@a@b%a002070：噗噗噗～噗嚕嚕！\n@c0@"
56:
  en: "@a%0%a002000@bI'm lost. Did you follow all of that?\n@c0@"
  ja: "@a@b%a002000「そんなに　いちどに\n\tいろいろ　教えられても\n\t頭が　ついていかないぜ……。\n@c0@"
  ko: "@a@b%a002000: 그렇게 한꺼번에\n많은 걸 가르쳐 주면\n머리가 안 따라간다고......\n@c0@"
  sl: "@a@b%a002000：一下子说这么多，\n　　脑袋好像都跟不上了。\n@c0@"
  tl: "@a@b%a002000：一下子說這麼多，\n　　腦袋好像都跟不上了。\n@c0@"
57:
  en: "@a%0%a002000@bI'd better start payin' more attention — especially if we talk to him again.\n@c0@"
  ja: "@a@b%a002000「また　必要なときに\n\t聞けば　いっか。\n@c0@"
  ko: "@a@b%a002000: 또 필요할 때\n물어보면 되겠지, 뭐.\n@c0@"
  sl: "@a@b%a002000：等需要的时候，\n　　再来问好了。\n@c0@"
  tl: "@a@b%a002000：等需要的時候，\n　　再來問好了。\n@c0@"
58:
  en: "@a%0%a002010@bWe should ask that nun about advanced vocations.\n@c0@"
  ja: "@a@b%a002010「上級職については\n\tシスターに　うかがえば\n\tいいのね。\n@c0@"
  ko: "@a@b%a002010: 상급직에 대한 건\n수녀님께 여쭤보면\n되는 거지?\n@c0@"
  sl: "@a@b%a002010：关于高级职业，\n　　问一问修女\n　　就可以了吧。\n@c0@"
  tl: "@a@b%a002010：關於高級職業，\n　　問一問修女\n　　就可以了吧。\n@c0@"
59:
  en: "@a%0%a002020@bIf we ever need a refresher, I guess we can just talk to the nun or this guy, huh?\n@c0@"
  ja: "@a@b%a002020「わかんないことは\n\tこの人か　シスターに\n\t聞けばいいのは　わかったね。\n@c0@"
  ko: "@a@b%a002020: 잘 모르겠으면\n이 사람이나 수녀님에게\n물어보면 된다는 거구나.\n@c0@"
  sl: "@a@b%a002020：我只知道，\n　　不知道的事情问这个人，\n　　或者修女就可以了。\n@c0@"
  tl: "@a@b%a002020：我只知道，\n　　不知道的事情問這個人，\n　　或者修女就可以了。\n@c0@"
60:
  en: "@a%0%a002030@bSo if we look at the Attributes menu, we can check up on our progress...\n@c0@"
  ja: "@a@b%a002030「ふむふむ。\n\tつよさを　見れば　職業の\n\t状態が　わかるのですね。\n@c0@"
  ko: "@a@b%a002030: 흐음.\n능력치를 살펴보면 직업의\n상태를 알 수 있군요.\n@c0@"
  sl: "@a@b%a002030：唔。\n　　看一看能力\n　　就能知道职业的状态了啊。\n@c0@"
  tl: "@a@b%a002030：唔。\n　　看一看能力\n　　就能知道職業的狀態了啊。\n@c0@"
61:
  en: "@a%0%a002050@bSo if you master multiple vocations, you might come up with an even more smashin' one, eh? Let's give it a try!\n@c0@"
  ja: "@a@b%a002050「ふたつを　合わせると\n\tすごいものになる。\n\tようは　そういう　ことですかね。\n@c0@"
  ko: "@a@b%a002050: 둘을 더하면\n대단한 것이 된다.\n요약하자면 이 말이겠죠?\n@c0@"
  sl: "@a@b%a002050：也就是说，\n　　合两者之力，\n　　效果非凡吧。\n@c0@"
  tl: "@a@b%a002050：也就是說，\n　　合兩者之力，\n　　效果非凡吧。\n@c0@"
62:
  en: "@a%0%a002040@bThat seemed pretty helpful.\n@c0@"
  ja: "@a@b%a002040「ご親切な　こった。\n@c0@"
  ko: "@a@b%a002040: 친절한 설명이군.\n@c0@"
  sl: "@a@b%a002040：真是热心啊。\n@c0@"
  tl: "@a@b%a002040：真是熱心啊。\n@c0@"
63:
  en: "@a%0%a002060@b(snarl) %0%a002060 leave details to %a000090... (sputter)\n@c0@"
  ja: "@a@b%a002060「私…こまかい…こと…\n\t%a000090に…まかせる……。\n@c0@"
  ko: "@a@b%a002060: 나...자세한...건...\n%a000090에게...맡긴다......\n@c0@"
  sl: "@a@b%a002060：细节……问题……\n　　交给……%a000090……\n@c0@"
  tl: "@a@b%a002060：細節……問題……\n　　交給……%a000090……\n@c0@"
64:
  en: "@a%0%a002070@bBoing boing!\n@c0@"
  ja: "@a@b%a002070「プッププルルルーッ！\n@c0@"
  ko: "@a@b%a002070: 뽀요요요요용~!\n@c0@"
  sl: "@a@b%a002070：噗噜噗噜噜噜！\n@c0@"
  tl: "@a@b%a002070：噗嚕噗嚕嚕嚕！\n@c0@"
65:
  en: "@a%0%a002000@bWe can always come back if we need to hear the details again.\n@c0@"
  ja: "@a@b%a002000「また　くわしく\n\t知りたく　なったら\n\t聞きに　こようぜ。\n@c0@"
  ko: "@a@b%a002000: 또 자세한 걸\n알고 싶어지면\n물어보러 오자고.\n@c0@"
  sl: "@a@b%a002000：要是想了解细节的话，\n　　再来问吧。\n@c0@"
  tl: "@a@b%a002000：要是想瞭解細節的話，\n　　再來問吧。\n@c0@"
66:
  en: "@a%0%a002010@bHe seems to be something of an expert when it comes to changing vocations.\n@c0@"
  ja: "@a@b%a002010「転職に　ついては\n\tよほど　くわしい方なのかしら。\n@c0@"
  ko: "@a@b%a002010: 전직에 대해 정말\n많은 걸 알고 있는 사람인가 보네.\n@c0@"
  sl: "@a@b%a002010：这个人对转职\n　　相当了解吧。\n@c0@"
  tl: "@a@b%a002010：這個人對轉職\n　　相當瞭解吧。\n@c0@"
67:
  en: "@a%0%a002020@bWhat's with his attitude? We're just not in the mood for a lecture, that's all.\n@c0@"
  ja: "@a@b%a002020「あー　いるねー。\n\tこういうふうに　聞きもしないのに\n\t教えたがる人！\n@c0@"
  ko: "@a@b%a002020: 이런 사람 꼭 있어~\n이렇게 묻지도 않았는데\n가르쳐 주려고 하는 사람!\n@c0@"
  sl: "@a@b%a002020：啊，这种还没\n　　被问到，就和盘托出的人\n　　还真的存在啊。\n@c0@"
  tl: "@a@b%a002020：啊，這種還沒\n　　被問到，就和盤托出的人\n　　還真的存在啊。\n@c0@"
68:
  en: "@a%0%a002030@bWell, when we get the urge to hear more about changing vocations, this is our man.\n@c0@"
