0:
  en: "@a%0%a002000@bAvast! This cliff has a top, aye? You wouldn't know it from here!\n@c0@"
  ja: "@a@b%a002000「どひゃ～！！\n\tこのカベは　どこまであるんだ！？\n\t上が　見えないぜ！\n@c0@"
  ko: "@a@b%a002000: 세상에~!!\n이 벽은 어디까지 이어진 거지!?\n위쪽이 보이지 않아!\n@c0@"
  sl: "@a@b%a002000：啊！！\n　　这面墙到底有多高啊？！\n　　完全看不到顶！\n@c0@"
  tl: "@a@b%a002000：啊！！\n　　這面牆到底有多高啊？！\n　　完全看不到頂！\n@c0@"
1:
  en: "@a%0%a002010@bThis won't be an easy climb. Let's stay focused.\n@c0@"
  ja: "@a@b%a002010「これは　スイスイとは\n\t行けそうにもないわね。\n\tがんばりましょう。\n@c0@"
  ko: "@a@b%a002010: 쉽게 나아갈 수\n없겠는걸.\n최선을 다하자.\n@c0@"
  sl: "@a@b%a002010：看来没法\n　　轻松攀上这面墙呢。\n　　加油吧。\n@c0@"
  tl: "@a@b%a002010：看來沒法\n　　輕鬆攀上這面牆呢。\n　　加油吧。\n@c0@"
2:
  en: "@a%0%a002020@bWhoa! Looks like we're in for a real cliffhanger!\n@c0@"
  ja: "@a@b%a002020「おっもしろそー！\n\tレッツ　ゴー　ゴー！！\n@c0@"
  ko: "@a@b%a002020: 재밌겠다~!\n어서 가 보자구~!!\n@c0@"
  sl: "@a@b%a002020：好有趣的样子！\n　　出发吧！！\n@c0@"
  tl: "@a@b%a002020：好有趣的樣子！\n　　出發吧！！\n@c0@"
3:
  en: "@a%0%a002030@bWith the Goddess watching over us, we have nothing to fear.\n@c0@"
  ja: "@a@b%a002030「私には\n\tゲントの神が　ついています。\n\t大丈夫です。\n@c0@"
  ko: "@a@b%a002030: 제 곁엔 언제나\n겐트 신이 계십니다.\n괜찮습니다.\n@c0@"
  sl: "@a@b%a002030：我有根特之神保护着，\n　　不会有事的。\n@c0@"
  tl: "@a@b%a002030：我有根特之神保護著，\n　　不會有事的。\n@c0@"
4:
  en: "@a%0%a002050@bI-I'm not shakin' with fear! It's just a bit nippy!\n@c0@"
  ja: "@a@b%a002050「こ　こ　こ　こわくないです。\n\tむ　むしゃぶるいです！\n@c0@"
  ko: "@a@b%a002050: 무, 무, 무, 무섭지 않습니다.\n서, 설레서 그러는 겁니다!\n@c0@"
  sl: "@a@b%a002050：我、我、我才不害怕呢。\n　　我只是太兴奋所以在发抖！\n@c0@"
  tl: "@a@b%a002050：我、我、我才不害怕呢。\n　　我只是太興奮所以在發抖！\n@c0@"
5:
  en: "@a%0%a002000@bWhoa. They build everything big around here.\n@c0@"
  ja: "@a@b%a002000「中は　こんなに\n\t広かったのか。\n@c0@"
  ko: "@a@b%a002000: 안쪽은 이렇게\n넓었군.\n@c0@"
  sl: "@a@b%a002000：里面这么宽敞啊。\n@c0@"
  tl: "@a@b%a002000：裡面這麼寬敞啊。\n@c0@"
6:
  en: "@a%0%a002010@bMy, it's beautiful in here.\n@c0@"
  ja: "@a@b%a002010「きれいな　場所ね。\n@c0@"
  ko: "@a@b%a002010: 아름다운 곳이네.\n@c0@"
  sl: "@a@b%a002010：这里真漂亮。\n@c0@"
  tl: "@a@b%a002010：這裡真漂亮。\n@c0@"
7:
  en: "@a%0%a002020@bHmm? Hey, isn't that a priest and a nun over there?\n@c0@"
  ja: "@a@b%a002020「あれは　神父さんと\n\tシスターかな？\n@c0@"
  ko: "@a@b%a002020: 저 사람들은 신부님과\n수녀님일까?\n@c0@"
  sl: "@a@b%a002020：那是神父和修女吧？\n@c0@"
  tl: "@a@b%a002020：那是神父和修女吧？\n@c0@"
8:
  en: "@a%0%a002030@bA natural cave... Impressive...\n@c0@"
  ja: "@a@b%a002030「中は　洞くつに\n\tなっているんですね。\n@c0@"
  ko: "@a@b%a002030: 안은 동굴처럼\n되어 있군요.\n@c0@"
  sl: "@a@b%a002030：里面是洞窟呢。\n@c0@"
  tl: "@a@b%a002030：裡面是洞窟呢。\n@c0@"
9:
  en: "@a%0%a002050@bPhew! It's a little less hair-raisin' in here.\n@c0@"
  ja: "@a@b%a002050「ここは\n\t心おちつきますねー。\n@c0@"
  ko: "@a@b%a002050: 여긴\n마음이 편안해지네요.\n@c0@"
  sl: "@a@b%a002050：这里能让人\n　　冷静下来呢。\n@c0@"
  tl: "@a@b%a002050：這裡能讓人\n　　冷靜下來呢。\n@c0@"
10:
  en: "@a%0%a002000@bGolden pickaxe, aye? Good to know.\n@c0@"
  ja: "@a@b%a002000「黄金のつるはしか。\n\tいいこと　聞いたぜ。\n@c0@"
  ko: "@a@b%a002000: 황금 곡괭이라.\n좋은 정보를 얻었군.\n@c0@"
  sl: "@a@b%a002000：黄金鹤嘴锄啊。\n　　听到了个有用的消息呢。\n@c0@"
  tl: "@a@b%a002000：黃金鶴嘴鋤啊。\n　　聽到了個有用的消息呢。\n@c0@"
11:
  en: "@a%0%a002010@bWe're lucky to have met such a helpful priest.\n@c0@"
  ja: "@a@b%a002010「親切な　神父さんで\n\tよかったわね。\n@c0@"
  ko: "@a@b%a002010: 친절한 신부님을 만나서\n다행이네.\n@c0@"
  sl: "@a@b%a002010：神父这么热心，\n　　真是太好了。\n@c0@"
  tl: "@a@b%a002010：神父這麼熱心，\n　　真是太好了。\n@c0@"
12:
  en: "@a%0%a002020@bAlright, so it sounds like our first order of business is finding that golden pickaxe. Let's go!\n@c0@"
  ja: "@a@b%a002020「それじゃ　まずは\n\t黄金のつるはしを　さがしに\n\tレッツ　ゴー！\n@c0@"
  ko: "@a@b%a002020: 그럼 우선은\n황금 곡괭이를 찾으러\n가 보자~!\n@c0@"
  sl: "@a@b%a002020：那我们就先去\n　　找黄金鹤嘴锄吧！\n　　出发！\n@c0@"
  tl: "@a@b%a002020：那我們就先去\n　　找黃金鶴嘴鋤吧！\n　　出發！\n@c0@"
13:
  en: "@a%0%a002030@bOur first task is to procure this golden pickaxe.\n@c0@"
  ja: "@a@b%a002030「まずは　黄金のつるはしを\n\t見つけないと　いけないようですね。\n@c0@"
  ko: "@a@b%a002030: 일단 황금 곡괭이를\n찾아야만 하나 보군요.\n@c0@"
  sl: "@a@b%a002030：好像得先\n　　找到黄金鹤嘴锄呢。\n@c0@"
  tl: "@a@b%a002030：好像得先\n　　找到黃金鶴嘴鋤呢。\n@c0@"
14:
  en: "@a%0%a002050@bWe're not plannin' on expirin' prematurely!\n@c0@"
  ja: "@a@b%a002050「別に　死にいそいじゃ\n\tいませんけどね……。\n@c0@"
  ko: "@a@b%a002050: 딱히 빨리 죽고 싶은 생각은\n없는데요......\n@c0@"
  sl: "@a@b%a002050：我们可不是\n　　来送死的啊……\n@c0@"
  tl: "@a@b%a002050：我們可不是\n　　來送死的啊……\n@c0@"
15:
  en: "@a%0%a002000@bWhat? C'mon, %a000090, let's hear him out!\n@c0@"
  ja: "@a@b%a002000「なんだよ　%a000090。\n\tたのむから　ちゃんと\n\t神父さまと　話をしようぜ！\n@c0@"
  ko: "@a@b%a002000: 뭐야, %a000090.\n부탁이다. 제발\n신부님과 얘기해 보자고!\n@c0@"
  sl: "@a@b%a002000：什么啊，%a000090。\n　　拜托你好好跟\n　　神父大人说话啊！\n@c0@"
  tl: "@a@b%a002000：什麼啊，%a000090。\n　　拜託你好好跟\n　　神父大人說話啊！\n@c0@"
16:
  en: "@a%0%a002010@bDestiny's Drop certainly seems intimidating, doesn't it?\n@c0@"
  ja: "@a@b%a002010「運命のカベは\n\tどうやら　手ごわそうね。\n@c0@"
  ko: "@a@b%a002010: 운명의 벽은\n만만치 않을 것 같아.\n@c0@"
  sl: "@a@b%a002010：命运之墙\n　　看起来不好对付呢。\n@c0@"
  tl: "@a@b%a002010：命運之牆\n　　看起來不好對付呢。\n@c0@"
17:
  en: "@a%0%a002020@bWe can't just turn back now, %a000090!\n@c0@"
  ja: "@a@b%a002020「%a000090\n\tここで　かえっても……。\n@c0@"
  ko: "@a@b%a002020: %a000090,\n여기서 돌아갈 순 없는데......\n@c0@"
  sl: "@a@b%a002020：%a000090，\n　　即使现在打道回府……\n@c0@"
  tl: "@a@b%a002020：%a000090，\n　　即使現在打道回府……\n@c0@"
18:
  en: "@a%0%a002030@bI will offer up a prayer to the Goddess.\n@c0@"
  ja: "@a@b%a002030「私も　ゲントの神に\n\t祈りを　ささげて　おきましょう。\n@c0@"
  ko: "@a@b%a002030: 저도 겐트 신께\n기도를 드리겠습니다.\n@c0@"
  sl: "@a@b%a002030：让我也向\n　　根特之神祈祷吧。\n@c0@"
  tl: "@a@b%a002030：讓我也向\n　　根特之神祈禱吧。\n@c0@"
19:
  en: "@a%0%a002050@bSeems it wasn't monsters that killed folks — it was the drop. (gulp)\n@c0@"
  ja: "@a@b%a002050「死んでいった者たちって\n\tまものと　戦って……\n\tじゃなくて　落ちて　ですか！？\n@c0@"
  ko: "@a@b%a002050: 세상을 떠났다는 자들은\n마물과 싸워서......\n가 아니라 떨어져 죽은 겁니까!?\n@c0@"
  sl: "@a@b%a002050：死去的人们\n　　并不是和魔物战斗牺牲……\n　　而是从墙上掉下去了啊？！\n@c0@"
  tl: "@a@b%a002050：死去的人們\n　　並不是和魔物戰鬥犧牲……\n　　而是從牆上掉下去了啊？！\n@c0@"
20:
  en: "@a%0%a002000@bGreat! We ready to shove off?\n@c0@"
  ja: "@a@b%a002000「よし　それじゃ\n\tさっそく　出発しようぜ！\n@c0@"
  ko: "@a@b%a002000: 좋았어, 그럼\n어서 출발하자!\n@c0@"
  sl: "@a@b%a002000：好，那就赶紧出发吧！\n@c0@"
  tl: "@a@b%a002000：好，那就趕緊出發吧！\n@c0@"
21:
  en: "@a%0%a002010@bIf we get hurt on the mountain, that nun can treat our wounds.\n@c0@"
  ja: "@a@b%a002010「ここまで　もどれば\n\t治療だけは　してもらえそうね。\n@c0@"
  ko: "@a@b%a002010: 여기까지 돌아오면\n치료는 해 주시는 모양이야.\n@c0@"
  sl: "@a@b%a002010：要是回到这里的话，\n　　他们好像能帮忙治疗呢。\n@c0@"
  tl: "@a@b%a002010：要是回到這裡的話，\n　　他們好像能幫忙治療呢。\n@c0@"
22:
  en: "@a%0%a002020@bRight! Now we're good to go!\n@c0@"
  ja: "@a@b%a002020「よーし！\n\tじゃあ　いってみようかー！\n@c0@"
  ko: "@a@b%a002020: 좋아!\n그럼 가 볼까~!\n@c0@"
  sl: "@a@b%a002020：好！\n　　我们走吧！\n@c0@"
  tl: "@a@b%a002020：好！\n　　我們走吧！\n@c0@"
23:
  en: "@a%0%a002030@bKnowing that we have such a helpful resource available brings a great sense of relief.\n@c0@"
  ja: "@a@b%a002030「こういう方たちが\n\tここに　いてくれるだけで\n\tホッとしますね。\n@c0@"
  ko: "@a@b%a002030: 이분들이\n이곳에 계셔 주는 것만으로\n마음이 놓이는군요.\n@c0@"
  sl: "@a@b%a002030：有他们在这里，\n　　真是松了口气呢。\n@c0@"
  tl: "@a@b%a002030：有他們在這裡，\n　　真是鬆了口氣呢。\n@c0@"
24:
  en: "@a%0%a002050@bIt's a shame they don't have an adventure log...\n@c0@"
  ja: "@a@b%a002050「旅の記録が\n\tできなかったのは\n\tちょっと　ざんねんです。\n@c0@"
  ko: "@a@b%a002050: 여행 기록을\n할 수 없었던 건\n조금 아쉽습니다.\n@c0@"
  sl: "@a@b%a002050：不能记录旅行，\n　　真是有点遗憾呢。\n@c0@"
  tl: "@a@b%a002050：不能記錄旅行，\n　　真是有點遺憾呢。\n@c0@"
25:
  en: "@a%0%a002000@bC'mon! What're we waitin' for? No time to waste!\n@c0@"
  ja: "@a@b%a002000「さあ　ぐずぐずしてないで\n\tさっさと　行こうぜ！\n@c0@"
  ko: "@a@b%a002000: 자, 꾸물대지 말고\n어서 가자고!\n@c0@"
  sl: "@a@b%a002000：别磨磨蹭蹭的了，\n　　赶紧走吧！\n@c0@"
  tl: "@a@b%a002000：別磨磨蹭蹭的了，\n　　趕緊走吧！\n@c0@"
26:
  en: "@a%0%a002000@bScalin' cliffs and swattin' monsters are both kinda fun on their own. Doin' both at once? Not so much.\n@c0@"
  ja: "@a@b%a002000「ガケを　のぼったり\n\tまものと　戦ったり　ってのは\n\tけっこう　たいへんだぜ……。\n@c0@"
  ko: "@a@b%a002000: 벼랑을 올랐다가\n마물과 싸우길 반복하는 건\n꽤 힘든 일이군......\n@c0@"
  sl: "@a@b%a002000：又要攀岩，\n　　又要和魔物战斗，\n　　真是辛苦啊……\n@c0@"
  tl: "@a@b%a002000：又要攀岩，\n　　又要和魔物戰鬥，\n　　真是辛苦啊……\n@c0@"
27:
  en: "@a%0%a002010@bOoh, feel that wind... Must be coming from outside.\n@c0@"
  ja: "@a@b%a002010「外から　風が\n\t吹き込んでくるわね。\n@c0@"
  ko: "@a@b%a002010: 밖에서 바람이\n불어 들어오고 있어.\n@c0@"
  sl: "@a@b%a002010：风从外面\n　　吹进来了呢。\n@c0@"
  tl: "@a@b%a002010：風從外面\n　　吹進來了呢。\n@c0@"
28:
  en: "@a%0%a002010@bThe way up is quite convoluted. Let's make sure we don't get lost.\n@c0@"
  ja: "@a@b%a002010「ルートが\n\tふくざつ　だから　迷わないように\n\t進みましょうね。\n@c0@"
  ko: "@a@b%a002010: 길이\n복잡하니까 헤매지 않도록\n조심하면서 가자.\n@c0@"
  sl: "@a@b%a002010：道路错综复杂，\n　　要小心不要迷路，\n　　谨慎前进。\n@c0@"
  tl: "@a@b%a002010：道路錯綜複雜，\n　　要小心不要迷路，\n　　謹慎前進。\n@c0@"
29:
  en: "@a%0%a002020@bLet's go, let's go!\n@c0@"
  ja: "@a@b%a002020「レッツ　ゴー！\n@c0@"
  ko: "@a@b%a002020: 어서 가자~!\n@c0@"
  sl: "@a@b%a002020：我们走！\n@c0@"
  tl: "@a@b%a002020：我們走！\n@c0@"
30:
  en: "@a%0%a002020@bIt's so weird going from those massive, open cliffs to these tiny, cramped caves, huh?\n@c0@"
  ja: "@a@b%a002020「ガケは　すごいけど\n\t中は　そんなに　広くないね。\n@c0@"
  ko: "@a@b%a002020: 벼랑은 엄청난데\n안쪽은 그렇게 넓지 않네.\n@c0@"
  sl: "@a@b%a002020：这悬崖这么陡峭，\n　　里面却没那么宽敞呢。\n@c0@"
  tl: "@a@b%a002020：這懸崖這麼陡峭，\n　　裡面卻沒那麼寬敞呢。\n@c0@"
31:
  en: "@a%0%a002030@bA Ghentile should feel no fear... (gulp)\n@c0@"
  ja: "@a@b%a002030「…………。\n\tゲントの民は　なにごとも\n\tおそれは　しないのです。\n@c0@"
  ko: "@a@b%a002030: ............\n겐트의 백성은 그 무엇도\n겁내지 않습니다.\n@c0@"
  sl: "@a@b%a002030：……\n　　根特人民无所畏惧。\n@c0@"
  tl: "@a@b%a002030：……\n　　根特人民無所畏懼。\n@c0@"
32:
  en: "@a%0%a002030@bThe enemies here are formidable. We must keep our guard up.\n@c0@"
  ja: "@a@b%a002030「しかし　ここは\n\t敵が　強いですね。\n\t気をつけて　行かなければ。\n@c0@"
  ko: "@a@b%a002030: 그나저나 여긴\n적이 강하군요.\n조심해서 가야겠습니다.\n@c0@"
  sl: "@a@b%a002030：不过这里的\n　　敌人真厉害啊。\n　　得小心前进才行。\n@c0@"
  tl: "@a@b%a002030：不過這裡的\n　　敵人真厲害啊。\n　　得小心前進才行。\n@c0@"
33:
  en: "@a%0%a002050@bI wonder how much further we've got to go.\n@c0@"
  ja: "@a@b%a002050「いま　どのくらいまで\n\t来ているんでしょうね。\n@c0@"
  ko: "@a@b%a002050: 지금 어디쯤\n온 걸까요?\n@c0@"
  sl: "@a@b%a002050：现在我们\n　　已经走了多少了啊。\n@c0@"
  tl: "@a@b%a002050：現在我們\n　　已經走了多少了啊。\n@c0@"
34:
  en: "@a%0%a002050@bIt's good to see a nice, flat path.\n@c0@"
  ja: "@a@b%a002050「ゆかが　平らに\n\tなってるだけで\n\tホッと　しますね。\n@c0@"
  ko: "@a@b%a002050: 바닥이 평평하게\n되어 있는 것만으로\n다행인걸요.\n@c0@"
  sl: "@a@b%a002050：地倒是很平整，\n　　真是松了口气呢。\n@c0@"
  tl: "@a@b%a002050：地倒是很平整，\n　　真是鬆了口氣呢。\n@c0@"
35:
  en: "@a%0%a002000@bWhat, they got a doorman 'n' everything like that?\n@c0@"
  ja: "@a@b%a002000「たたくと　ひらく？\n\tふーむ……。\n@c0@"
