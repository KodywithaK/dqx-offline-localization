0:
  en: "@aKing Medford@bGreetings, %H0860%Xmy loyal subject%Ymy loyal subjects%Z! I, Medford Medallion, have a royal passion for mini medals, which are scattered hither and thither throughout the world.\n@c0@"
  ja: "@a@bメダル王「よくぞ来た！\n\tわしは　世界中にちらばるという\n\tちいさなメダルを　集めておる。\n@c0@"
  ko: "@a@b메달 왕: 잘 와 주었네!\n나는 전 세계에 흩어진\n작은 메달을 모으고 있다네.\n@c0@"
  sl: "@a@b徽章王：你来得正好！\n　　我正在收集\n　　散布在全世界的小徽章。\n@c0@"
  tl: "@a@b徽章王：你來得正好！\n　　我正在收集\n　　散佈在全世界的小徽章。\n@c0@"
1:
  en: "@aKing Medford@bSome kings crave powerful armies. Others want nothing but land. Me? All I desire are mini medals! Bring them and I shall reward you accordingly.\n@c0@"
  ja: "@a@bメダル王「メダルを　見つけて来た者には\n\tその数に応じた　すばらしい\n\tほうびを　とらせようぞ！\n@c0@"
  ko: "@a@b메달 왕: 메달을 찾아 온 자에게는\n메달 수에 따라 멋진\n선물을 주겠네!\n@c0@"
  sl: "@a@b徽章王：所有把小徽章\n　　拿到我这里来的人\n　　都可以得到丰厚的奖赏！\n@c0@"
  tl: "@a@b徽章王：所有把小徽章\n　　拿到我這裡來的人\n　　都可以得到豐厚的獎賞！\n@c0@"
2:
  en: "@aKing Medford@bBut wait! I'd know that glint anywhere — you have some mini medals with you! I must examine them this instant, %H0860%Xmy loyal subject%Ymy loyal subjects%Z.\n@c0@"
  ja: "@a@bメダル王「ややっ　なんと！\n\tメダルを　持って来ておったのか。\n\tでは　わしが　預かろう！\n@c0@"
  ko: "@a@b메달 왕: 아니! 이미\n메달을 가져와 준 겐가?\n그럼 내가 받아 주도록 하지.\n@c0@"
  sl: "@a@b徽章王：哦哦！\n　　你带来小徽章了吗。\n　　那么就交给我吧！\n@c0@"
  tl: "@a@b徽章王：哦哦！\n　　你帶來小徽章了嗎。\n　　那麼就交給我吧！\n@c0@"
3:
  en: "@aKing Medford@bSplendid! That's %a000580 mini medal%H0580%X%Ys%Z you've given me so far, my little %H0860%Xminikin%Yminikins%Z.\n@c0@"
