0:
  en: "@a%0%a002000@bCrikey! That waterfall makes the one in Amor look like a slow drip. Some world we live in, aye?\n@c0@"
  ja: "@a@b%a002000「アモールの滝よりも\n\tはるかに　すごい滝だな。\n\tまったく　世界は　広いぜ！\n@c0@"
  ko: "@a@b%a002000: 아모르의 폭포보다\n훨씬 대단한 폭포로군.\n정말 세계는 넓다니까!\n@c0@"
  sl: "@a@b%a002000：这个瀑布竟然比\n　　爱摩尔的瀑布还大。\n　　世界真是太大了！\n@c0@"
  tl: "@a@b%a002000：這個瀑布竟然比\n　　愛摩爾的瀑布還大。\n　　世界真是太大了！\n@c0@"
1:
