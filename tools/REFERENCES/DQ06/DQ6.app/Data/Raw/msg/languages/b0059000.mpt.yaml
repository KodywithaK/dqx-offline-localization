0:
  en: "@a@b*: Grrargh! A right waste of time this has been! I was told there was some amazin' treasure in this castle!\n@c0@"
  ja: "@a@b＊「かーっ！　やってらんねえぜ！\n\tこの城に　すごい　おたからが\n\tあるって聞いて　来たのによ。\n@c0@"
  ko: "@a@b*: 아우~! 더는 못해 먹겠군!\n이 성에 엄청난 보물이\n있단 얘길 듣고 왔는데 말이야.\n@c0@"
  sl: "@a@b＊：可恶！简直是胡说八道！\n　　我是听说这个城里\n　　有值钱的宝物才跑来的。\n@c0@"
  tl: "@a@b＊：可惡！簡直是胡說八道！\n　　我是聽說這個城裡\n　　有值錢的寶物才跑來的。\n@c0@"
1:
