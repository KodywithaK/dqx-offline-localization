1:
  en: "@a%0%a002010@bShe was a faithful servant to us on the high seas. I've got only good memories of sailing with her.\n@c0@"
  ja: "@a@b%a002010「北へ南へ　東へ西へ……\n\tとても長い　航海だったけど\n\tいま思えば　みんな楽しい　思い出ね。\n@c0@"
