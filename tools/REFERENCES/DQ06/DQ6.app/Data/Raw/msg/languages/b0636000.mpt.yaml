2:
  en: "@a%0%a002020@bWow! The ship came back here all by itself? Crazy!\n@c0@"
  ja: "@a@b%a002020「すごいね！\n\tひとりで　もとの　神殿に\n\tもどってきたなんて！\n@c0@"
