0:
  en: "@a%0%a002000@bLooks like them mermaids ain't scared of us any more, aye?\n@c0@"
  ja: "@a@b%a002000「人魚たちは\n\tもう　オレたちのことが\n\tこわくないみたいだな。\n@c0@"
