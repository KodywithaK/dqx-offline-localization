  tl: "@a@b%a002000：聽他這麼一說，\n　　好像感覺是這麼回事。\n@c0@"
104:
  en: "@a%0%a002010@bIt is true. The presence of the dreams of so many of our fellow travellers certainly has a profound effect...\n@c0@"
  ja: "@a@b%a002010「そうね。　ここには\n\t世界中の　旅人たちの\n\t夢で　あふれているわ。\n@c0@"
  ko: "@a@b%a002010: 맞아. 여긴\n전 세계 여행자들의\n꿈으로 가득 차 있어.\n@c0@"
  sl: "@a@b%a002010：是啊。\n　　这里充满了\n　　全世界的旅行者的梦呢。\n@c0@"
  tl: "@a@b%a002010：是啊。\n　　這裡充滿了\n　　全世界的旅行者的夢呢。\n@c0@"
105:
  en: "@a%0%a002030@bHad I invested so much effort in travelling, I would most certainly be sure to reach my ultimate destination.\n㈡\nIf only to satisfy my curiosity...\n@c0@"
  ja: "@a@b%a002030「私は　せっかくなら\n\t実際にその土地を　おとずれて\n\t見聞を　広げたいですね。\n@c0@"
  ko: "@a@b%a002030: 저는 이왕이면\n실제로 그 땅을 찾아가서\n견문을 넓히고 싶습니다.\n@c0@"
  sl: "@a@b%a002030：我要是有机会的话，\n　　还是想亲自去当地\n　　见识见识呢。\n@c0@"
  tl: "@a@b%a002030：我要是有機會的話，\n　　還是想親自去當地\n　　見識見識呢。\n@c0@"
106:
  en: "@a%0%a002020@bWhat use is just feeling like you've been everywhere? BORING! I wanna actually go there, you know?\n@c0@"
  ja: "@a@b%a002020「あたしだったら\n\t気持ちだけだと　ちょっと\n\tタイクツに　なっちゃうかも……。\n@c0@"
  ko: "@a@b%a002020: 나라면\n기분을 느끼는 것만으로는\n시시하다고 생각할지도 몰라......\n@c0@"
  sl: "@a@b%a002020：要是我不能\n　　实际感受的话，\n　　可能会觉得有点无聊……\n@c0@"
  tl: "@a@b%a002020：要是我不能\n　　實際感受的話，\n　　可能會覺得有點無聊……\n@c0@"
107:
  en: "@a%0%a002040@bRight! Enough of this dreamy stuff! We've got a quest to be getting on with!\n@c0@"
  ja: "@a@b%a002040「さて　この館のことは\n\tこれくらいにして　本来の\n\t目的を　果たそうぜ。\n@c0@"
  ko: "@a@b%a002040: 자, 이 저택 일은\n이 정도로 하고 본래의\n목적을 이루러 가자고.\n@c0@"
  sl: "@a@b%a002040：这座馆的事情\n　　就到此为止，\n　　我们去做本来要做的事吧。\n@c0@"
  tl: "@a@b%a002040：這座館的事情\n　　就到此為止，\n　　我們去做本來要做的事吧。\n@c0@"
108:
  en: "@a%0%a002050@bReally? Stickin' around here makes you feel like you've been everywhere already? I'm in!\n@c0@"
  ja: "@a@b%a002050「旅をした　気持ちに\n\tなれるんでしたら　わたしも\n\tここで　すごしてみたいですね。\n@c0@"
  ko: "@a@b%a002050: 여행을 한 것 같은 기분이\n든다면 저도\n여기서 살아 보고 싶군요.\n@c0@"
  sl: "@a@b%a002050：要是能感觉\n　　已经经历了旅行的话，\n　　我也想住在这里试试呢。\n@c0@"
  tl: "@a@b%a002050：要是能感覺\n　　已經經歷了旅行的話，\n　　我也想住在這裡試試呢。\n@c0@"
109:
  en: "@a%0%a002060@b(snarl) Feel like...been everywhere...? %0%a002060 not understand... (sniff)\n@c0@"
  ja: "@a@b%a002060「旅をした…気持ち……。\n\t私は…よく……わからない……。\n@c0@"
  ko: "@a@b%a002060: 여행한 것 같은...기분......\n나는...잘......모른다......\n@c0@"
  sl: "@a@b%a002060：旅行的……感觉……\n　　我……不太……懂……\n@c0@"
  tl: "@a@b%a002060：旅行的……感覺……\n　　我……不太……懂……\n@c0@"
110:
  en: "@a%0%a002070@bBoing boing.\n@c0@"
  ja: "@a@b%a002070「プルッピー？\n@c0@"
  ko: "@a@b%a002070: 뽀르삐~?\n@c0@"
  sl: "@a@b%a002070：噗噜～哔？\n@c0@"
  tl: "@a@b%a002070：噗嚕～嗶？\n@c0@"
111:
  en: "@a%0%a002000@b%0%a002120 the cureslime, aye? Not the most original name...\n@c0@"
  ja: "@a@b%a002000「ベホマスライムの\n\t%a002120か。\n\tまんまといえば　まんまだな。\n@c0@"
  ko: "@a@b%a002000: 베호마 슬라임\n%a002120%F2120%X라%Y이라%Z.\n그게 그거 같은데.\n@c0@"
  sl: "@a@b%a002000：贝霍玛史莱姆\n　　%a002120啊。\n　　这名字根本没怎么变啊。\n@c0@"
  tl: "@a@b%a002000：貝霍瑪史萊姆\n　　%a002120啊。\n　　這名字根本沒怎麼變啊。\n@c0@"
112:
  en: "@a%0%a002010@bDid you know he was going to join us when you said you were his friend?\n@c0@"
  ja: "@a@b%a002010「いきおいで　はいって\n\tいったけど　これはこれで\n\tよかったのかしら？\n@c0@"
  ko: "@a@b%a002010: 엉겁결에\n들어왔는데 결국\n잘된 일일까?\n@c0@"
  sl: "@a@b%a002010：虽然爽快地答应了，\n　　但是那没问题吧？\n@c0@"
  tl: "@a@b%a002010：雖然爽快地答應了，\n　　但是那沒問題吧？\n@c0@"
113:
  en: "@a%0%a002030@bSo his friend is somewhere out at sea? We must search for her!\n@c0@"
  ja: "@a@b%a002030「仲間が　海にいるって\n\tいってましたね。　せっかくだから\n\tさがして　みましょうか？\n@c0@"
  ko: "@a@b%a002030: 동료가 바다에 있다고\n했지요. 이왕 들은 거\n한번 찾아볼까요?\n@c0@"
  sl: "@a@b%a002030：它说同伴在海里吧。\n　　机会难得，\n　　我们去找找吧？\n@c0@"
  tl: "@a@b%a002030：它說同伴在海裡吧。\n　　機會難得，\n　　我們去找找吧？\n@c0@"
114:
  en: "@a%0%a002020@b%0%a002120, huh? How does he float like that...?\n@c0@"
  ja: "@a@b%a002020「%a002120だって。\n\tフワフワ　ういてて　おもしろいね。\n@c0@"
  ko: "@a@b%a002020: %a002120%F2120%X래%Y이래%Z.\n둥실둥실 떠 있어서 재밌네.\n@c0@"
  sl: "@a@b%a002020：叫%a002120啊。\n　　软乎乎飘来飘去的，真有意思。\n@c0@"
  tl: "@a@b%a002020：叫%a002120啊。\n　　軟乎乎飄來飄去的，真有意思。\n@c0@"
115:
  en: "@a%0%a002040@bYou think we can really rely on him?\n@c0@"
  ja: "@a@b%a002040「あいつ……。\n\tたよりに　なるのか？\n@c0@"
  ko: "@a@b%a002040: 저 녀석......\n믿을 만한 녀석인가?\n@c0@"
  sl: "@a@b%a002040：那家伙……\n　　靠得住吗？\n@c0@"
  tl: "@a@b%a002040：那傢伙……\n　　靠得住嗎？\n@c0@"
116:
  en: "@a%0%a002050@bI never thought we'd be pickin' up new allies here of all places!\n@c0@"
  ja: "@a@b%a002050「いやー。\n\tこんなところで　仲間が　ふえるなんて\n\t思っても　みませんでしたね。\n@c0@"
  ko: "@a@b%a002050: 이야~\n이런 곳에서 동료가 생기리라고는\n상상도 못 했네요.\n@c0@"
  sl: "@a@b%a002050：哎呀。\n　　没想到在这里\n　　找到了新的同伴呢。\n@c0@"
  tl: "@a@b%a002050：哎呀。\n　　沒想到在這裡\n　　找到了新的同伴呢。\n@c0@"
117:
  en: "@a%0%a002060@b(snarl) %0%a002120...our...friend...? (slobber)\n@c0@"
  ja: "@a@b%a002060「%a000090……\n\t%a002120の…ナカマ？\n@c0@"
  ko: "@a@b%a002060: %a000090......\n%a002120의......동료?\n@c0@"
  sl: "@a@b%a002060：%a000090……\n　　%a002120的……同伴？\n@c0@"
  tl: "@a@b%a002060：%a000090……\n　　%a002120的……同伴？\n@c0@"
118:
  en: "@a%0%a002070@bBoing? Boi-oing!\n@c0@"
  ja: "@a@b%a002070「ピッピッピーッ！\n@c0@"
  ko: "@a@b%a002070: 삐삐삐~!\n@c0@"
  sl: "@a@b%a002070：哔哔哔哔！\n@c0@"
  tl: "@a@b%a002070：嗶嗶嗶嗶！\n@c0@"
119:
  en: "@a%0%a002000@bI'd be kinda worried if I got mistaken for a cureslime.\n@c0@"
  ja: "@a@b%a002000「まあ　オレたちは\n\tどう見ても\n\tベホマスライムじゃ　ないわな。\n@c0@"
  ko: "@a@b%a002000: 맞아, 우린\n아무리 봐도\n베호마 슬라임은 아니지.\n@c0@"
  sl: "@a@b%a002000：咱怎么看\n　　都不像贝霍玛史莱姆啊。\n@c0@"
  tl: "@a@b%a002000：咱怎麼看\n　　都不像貝霍瑪史萊姆啊。\n@c0@"
120:
  en: "@a%0%a002010@bHe said he couldn't meet his friend... So is he just planning to stay here forever, then?\n@c0@"
  ja: "@a@b%a002010「仲間に　会えないって\n\tいってたけど　ずっと　ここで\n\t待っている　つもり　なのかしら？\n@c0@"
  ko: "@a@b%a002010: 동료를 못 만났다고\n했는데, 그럼 계속 여기서\n기다리고 있겠다는 걸까?\n@c0@"
  sl: "@a@b%a002010：虽然说见不到同伴了，\n　　但是它打算一直\n　　在这里等吗？\n@c0@"
  tl: "@a@b%a002010：雖然說見不到同伴了，\n　　但是它打算一直\n　　在這裡等嗎？\n@c0@"
121:
  en: "@a%0%a002030@bWell, I have healing powers too, but that doesn't automatically make me a friend...\n@c0@"
  ja: "@a@b%a002030「私も　いやしの力を\n\t使うことが　できますが\n\t仲間かと　聞かれますと……。\n@c0@"
  ko: "@a@b%a002030: 저도 치유의 힘을\n사용할 수 있지만\n동료라고 물으신다면......\n@c0@"
  sl: "@a@b%a002030：我虽然也会\n　　使用治愈的能力，\n　　但是问我是不是同伴……\n@c0@"
  tl: "@a@b%a002030：我雖然也會\n　　使用治癒的能力，\n　　但是問我是不是同伴……\n@c0@"
122:
  en: "@a%0%a002020@bA cureslime looking for his sea pal?\n@c0@"
  ja: "@a@b%a002020「海に　いる\n\tベホマスライムの　仲間？\n@c0@"
  ko: "@a@b%a002020: 바다에 있는\n베호마 슬라임의 동료?\n@c0@"
  sl: "@a@b%a002020：海里的\n　　贝霍玛史莱姆的同伴？\n@c0@"
  tl: "@a@b%a002020：海裡的\n　　貝霍瑪史萊姆的同伴？\n@c0@"
123:
  en: "@a%0%a002020@bYou think maybe it's a man o' war or something?\n@c0@"
  ja: "@a@b%a002020「それって\n\tしびれくらげとか？\n@c0@"
  ko: "@a@b%a002020: 그거 혹시\n저릿해파리인가?\n@c0@"
  sl: "@a@b%a002020：那是麻痹水母\n　　之类的吧？\n@c0@"
  tl: "@a@b%a002020：那是麻痹水母\n　　之類的吧？\n@c0@"
124:
  en: "@a%0%a002040@bWhatever way you slice it, it's not us he's looking for.\n@c0@"
  ja: "@a@b%a002040「オレたちは\n\tどうみても　仲間には\n\t見えないだろうな。\n@c0@"
  ko: "@a@b%a002040: 우린\n아무리 봐도 동료로는\n보이지 않겠지.\n@c0@"
  sl: "@a@b%a002040：我们再怎么看\n　　都不像是同伴吧。\n@c0@"
  tl: "@a@b%a002040：我們再怎麼看\n　　都不像是同伴吧。\n@c0@"
125:
  en: "@a%0%a002050@bFor a minute there, I thought he was lookin' at old %a002050 when he said ‘friend’.\n@c0@"
  ja: "@a@b%a002050「いやー　私を見て\n\t仲間って　いわれたのかと\n\tドキドキしました。\n@c0@"
  ko: "@a@b%a002050: 이야~ 절 보고\n동료냐고 물은 줄 알고\n가슴이 뛰었지 뭡니까.\n@c0@"
  sl: "@a@b%a002050：哎呀，我还以为它\n　　看着我说我是它同伴呢。\n　　真是吓死我了。\n@c0@"
  tl: "@a@b%a002050：哎呀，我還以為它\n　　看著我說我是它同伴呢。\n　　真是嚇死我了。\n@c0@"
126:
  en: "@a%0%a002060@b(snarl) %0%a000090...not...cureslime...friend... (slobber)\n@c0@"
  ja: "@a@b%a002060「%a000090……\n\tベホマスライムの…ナカマ…ちがう。\n@c0@"
  ko: "@a@b%a002060: %a000090......\n베호마 슬라임의...동료...아니다.\n@c0@"
  sl: "@a@b%a002060：%a000090……\n　　不是……贝霍玛史莱姆……的同伴。\n@c0@"
  tl: "@a@b%a002060：%a000090……\n　　不是……貝霍瑪史萊姆……的同伴。\n@c0@"
127:
  en: "@a%0%a002070@bBoing! (jiggle)\n@c0@"
  ja: "@a@b%a002070「プルルピ？\n@c0@"
  ko: "@a@b%a002070: 뽀르르삐?\n@c0@"
  sl: "@a@b%a002070：噗噜噜哔？\n@c0@"
  tl: "@a@b%a002070：噗嚕嚕嗶？\n@c0@"
128:
  en: "@a%0%a002000@bWhat's so weird about wantin' to chat to a cureslime in a well? It's human nature 'n' everything like that!\n@c0@"
  ja: "@a@b%a002000「こんなところに\n\tベホマスライムがいたら\n\t話しかけてみたくも　なるよな。\n@c0@"
  ko: "@a@b%a002000: 이런 곳에\n베호마 슬라임이 떡하니 있는데\n말을 걸고 싶어지는 게 당연하지.\n@c0@"
  sl: "@a@b%a002000：要是这种地方\n　　有贝霍玛史莱姆的话，\n　　俺还是挺想跟它搭话的啊。\n@c0@"
  tl: "@a@b%a002000：要是這種地方\n　　有貝霍瑪史萊姆的話，\n　　俺還是挺想跟它搭話的啊。\n@c0@"
129:
  en: "@a%0%a002010@bSlurping up random conversations is what we do best!\n@c0@"
  ja: "@a@b%a002010「いろいろな　ひとに\n\t話しかけるのが　%a000090の\n\tとくぎ　ですものね。\n@c0@"
  ko: "@a@b%a002010: 여러 사람들에게\n말을 거는 게 %a000090의\n특기잖아.\n@c0@"
  sl: "@a@b%a002010：%a000090很擅长\n　　跟各种各样的人搭话呢。\n@c0@"
  tl: "@a@b%a002010：%a000090很擅長\n　　跟各種各樣的人搭話呢。\n@c0@"
130:
  en: "@a%0%a002030@bIf you have no business with that creature, why speak with it in the first place?\n@c0@"
  ja: "@a@b%a002030「%a000090さん。\n\t用が　ないのに\n\t話しかけたんですか？\n@c0@"
  ko: "@a@b%a002030: %a000090 님.\n용무도 없는데\n말을 건 겁니까?\n@c0@"
  sl: "@a@b%a002030：%a000090。\n　　明明没什么事，\n　　还是跟它搭话了吗？\n@c0@"
  tl: "@a@b%a002030：%a000090。\n　　明明沒什麼事，\n　　還是跟它搭話了嗎？\n@c0@"
131:
  en: "@a%0%a002020@bI'm sure you were just being friendly, right %a000090?\n@c0@"
  ja: "@a@b%a002020「用は　ないけど\n\tちょっと　話しかけてみたく\n\tなっちゃったんだよね　%a000090？\n@c0@"
  ko: "@a@b%a002020: 볼일은 없지만\n그냥 말을 걸어 보고 싶었을\n뿐이겠지. 맞지, %a000090?\n@c0@"
  sl: "@a@b%a002020：虽然没什么事，\n　　但是还是有点想\n　　跟他搭话吧，%a000090？\n@c0@"
  tl: "@a@b%a002020：雖然沒什麼事，\n　　但是還是有點想\n　　跟他搭話吧，%a000090？\n@c0@"
132:
  en: "@a%0%a002040@bIf there's no need to talk, don't talk. That's my philosophy.\n@c0@"
  ja: "@a@b%a002040「用が　ないなら\n\t話しかける　必要は\n\tないんじゃ　ないのか？\n@c0@"
  ko: "@a@b%a002040: 용건이 없으면\n말을 걸 필요가\n없는 거 아닌가?\n@c0@"
  sl: "@a@b%a002040：要是没事的话，\n　　没必要跟他说话吧？\n@c0@"
  tl: "@a@b%a002040：要是沒事的話，\n　　沒必要跟他說話吧？\n@c0@"
133:
  en: "@a%0%a002050@bHe's callin' us weird? A cureslime's more out of place here than we are!\n@c0@"
  ja: "@a@b%a002050「むしろ　私は　こんなところに\n\tいる　ベホマスライムの　ほうが\n\tなんだ　という　気がします。\n@c0@"
  ko: "@a@b%a002050: 오히려 저는 이런 곳에\n있는 베호마 슬라임이 더\n수상한 것 같은데요.\n@c0@"
  sl: "@a@b%a002050：我反倒更在意\n　　这种地方居然会有\n　　贝霍玛史莱姆呢。\n@c0@"
  tl: "@a@b%a002050：我反倒更在意\n　　這種地方居然會有\n　　貝霍瑪史萊姆呢。\n@c0@"
134:
  en: "@a%0%a002060@b(snarl) %0%a000090...make...conversation...? (spit)\n@c0@"
  ja: "@a@b%a002060「%a000090……\n\tとりあえず……話しかけた？\n@c0@"
  ko: "@a@b%a002060: %a000090......\n일단...말부터...걸었다?\n@c0@"
  sl: "@a@b%a002060：%a000090……\n　　总之……先搭话？\n@c0@"
  tl: "@a@b%a002060：%a000090……\n　　總之……先搭話？\n@c0@"
135:
