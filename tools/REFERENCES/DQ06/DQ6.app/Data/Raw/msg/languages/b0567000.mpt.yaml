0:
  en: "@a%0%a002000@bSo this legendary equipment'll lead us to the Celestial Castle, aye...?\n@c0@"
  ja: "@a@b%a002000「伝説の武具が\n\t神の城への　道をひらくか……。\n@c0@"
  ko: "@a@b%a002000: 전설의 장비가\n신의 성으로 가는 길을 연다고......\n@c0@"
  sl: "@a@b%a002000：传说中的武具会开辟\n　　前往神之城的道路啊……\n@c0@"
  tl: "@a@b%a002000：傳說中的武具會開闢\n　　前往神之城的道路啊……\n@c0@"
1:
  en: "@a%0%a002010@bWe must seek out these legendary items before they fall into the wrong hands.\n@c0@"
  ja: "@a@b%a002010「ほかの人の\n\t手に　渡らないうちに　私たちで\n\t伝説の武具を　そろえないとね。\n@c0@"
  ko: "@a@b%a002010: 다른 사람 손에\n넘어가기 전에 우리가 먼저\n전설의 장비를 구해야겠어.\n@c0@"
  sl: "@a@b%a002010：我们得在\n　　其他人拿到之前，\n　　集齐传说中的武具呢。\n@c0@"
  tl: "@a@b%a002010：我們得在\n　　其他人拿到之前，\n　　集齊傳說中的武具呢。\n@c0@"
2:
  en: "@a%0%a002020@bIf good things come in threes, I guess legendary things must come in fours.\n@c0@"
  ja: "@a@b%a002020「あたしたちなら\n\tきっと　全部　集めちゃうよね！\n@c0@"
  ko: "@a@b%a002020: 우리라면\n틀림없이 전부 모을 수 있을 거야!\n@c0@"
  sl: "@a@b%a002020：我们肯定能\n　　把它们全部集齐的！\n@c0@"
  tl: "@a@b%a002020：我們肯定能\n　　把它們全部集齊的！\n@c0@"
3:
  en: "@a%0%a002030@bSo does this legendary equipment act as some kind of key...?\n@c0@"
  ja: "@a@b%a002030「伝説の武具が\n\tトビラの　カギにでも\n\tなっているのでしょうか。\n@c0@"
  ko: "@a@b%a002030: 전설의 장비가\n문의 열쇠 역할이라도\n하는 걸까요?\n@c0@"
  sl: "@a@b%a002030：传说中的武具\n　　会变成开门的钥匙\n　　之类的东西吗？\n@c0@"
  tl: "@a@b%a002030：傳說中的武具\n　　會變成開門的鑰匙\n　　之類的東西嗎？\n@c0@"
4:
  en: "@a%0%a002050@bCollect all four and win a trip to the Celestial Castle!\n@c0@"
  ja: "@a@b%a002050「４つ　集めると\n\t神の城に　ご招待～！\n@c0@"
  ko: "@a@b%a002050: 4종을 모두 모으면\n신의 성으로 초대합니다~!\n@c0@"
  sl: "@a@b%a002050：集齐四件，\n　　就能前往神之城咯！\n@c0@"
  tl: "@a@b%a002050：集齊四件，\n　　就能前往神之城咯！\n@c0@"
5:
  en: "@a%0%a002000@bSo the phantom realm ain't a secret to this fella, aye?\n@c0@"
  ja: "@a@b%a002000「まぼろしの大地か……。\n\tとりあえず　この男も　存在だけは\n\t知ってるようだな。\n@c0@"
  ko: "@a@b%a002000: 몽환의 대지라......\n이 남자도 일단 존재 정도는\n알고 있나 보군.\n@c0@"
  sl: "@a@b%a002000：梦幻大地啊……\n　　总之这个男的好像也只是\n　　知道存在这么个地方。\n@c0@"
  tl: "@a@b%a002000：夢幻大地啊……\n　　總之這個男的好像也只是\n　　知道存在這麼個地方。\n@c0@"
6:
  en: "@a%0%a002010@bAnother well, located to the south of Amor... I wonder where this one leads...\n@c0@"
  ja: "@a@b%a002010「アモールの南の井戸ね。\n\t今度は　どこに　つながって\n\tいるのかしら。\n@c0@"
  ko: "@a@b%a002010: 아모르 남쪽의 우물 말이지?\n이번에는 어디로 이어져\n있으려나?\n@c0@"
  sl: "@a@b%a002010：爱摩尔南边的井啊。\n　　它又会通向哪里呢？\n@c0@"
  tl: "@a@b%a002010：愛摩爾南邊的井啊。\n　　它又會通向哪裡呢？\n@c0@"
7:
  en: "@a%0%a002020@bWells, staircases, big chasms in the ground — what DOESN'T lead to the other world?\n@c0@"
  ja: "@a@b%a002020「穴だったり　階段だったり\n\t井戸だったり……\n\tいろんな　ところから　行けるねー。\n@c0@"
  ko: "@a@b%a002020: 구멍이었다가 계단이었다가\n우물이었다가......\n다양한 곳을 통해서 갈 수 있네~\n@c0@"
  sl: "@a@b%a002020：大空洞啊，\n　　楼梯啊，井啊……\n　　去梦幻大地的方法有很多呢！\n@c0@"
  tl: "@a@b%a002020：大空洞啊，\n　　樓梯啊，井啊……\n　　去夢幻大地的方法有很多呢！\n@c0@"
8:
  en: "@a%0%a002030@bThe blessings of the Goddess be upon this man.\n@c0@"
  ja: "@a@b%a002030「このおかたにも\n\tゲントの神の　祝福が\n\tありますように。\n@c0@"
  ko: "@a@b%a002030: 이분께도\n겐트 신의 축복이\n함께하기를.\n@c0@"
  sl: "@a@b%a002030：愿根特之神\n　　也能赐予这个人祝福。\n@c0@"
  tl: "@a@b%a002030：願根特之神\n　　也能賜予這個人祝福。\n@c0@"
9:
  en: "@a%0%a002050@bSo we can get to the world below from south of Amor. That would bring us out in...\n@c0@"
  ja: "@a@b%a002050「アモールの南から\n\t下の世界に　おりるのですね。\n\tすると　場所的には……\n@c0@"
  ko: "@a@b%a002050: 아모르 남쪽에서\n아래쪽 세계로 내려갈 수 있군요.\n그럼 장소로 따지면......\n@c0@"
  sl: "@a@b%a002050：从爱摩尔南边的井\n　　能够去下面的世界吧。\n　　我记得地方是在……\n@c0@"
  tl: "@a@b%a002050：從愛摩爾南邊的井\n　　能夠去下面的世界吧。\n　　我記得地方是在……\n@c0@"
10:
  en: "@a%0%a002050@b...Nope, no idea. Don't have a clue.\n@c0@"
  ja: "@a@b%a002050「……わかりません。\n@c0@"
  ko: "@a@b%a002050: ......모르겠습니다.\n@c0@"
  sl: "@a@b%a002050：……我不知道。\n@c0@"
  tl: "@a@b%a002050：……我不知道。\n@c0@"
11:
  en: "@a%0%a002000@bTurnscote, aye? I'll remember that one!\n@c0@"
  ja: "@a@b%a002000「ロンガデセオか。\n\tおぼえておこうぜ！\n@c0@"
  ko: "@a@b%a002000: 론가데세오라.\n기억해 두지!\n@c0@"
  sl: "@a@b%a002000：洛卡迪塞欧啊。\n　　咱记住吧！\n@c0@"
  tl: "@a@b%a002000：洛卡迪塞歐啊。\n　　咱記住吧！\n@c0@"
12:
  en: "@a%0%a002010@bI say we head over to Turnscote and pay him a visit.\n@c0@"
  ja: "@a@b%a002010「じゃあ　ロンガデセオに\n\t行ってみなくっちゃね。\n@c0@"
  ko: "@a@b%a002010: 그럼 론가데세오로\n가 봐야겠네.\n@c0@"
  sl: "@a@b%a002010：得去一趟\n　　洛卡迪塞欧了呢。\n@c0@"
  tl: "@a@b%a002010：得去一趟\n　　洛卡迪塞歐了呢。\n@c0@"
13:
  en: "@a%0%a002020@bI'll bet that swordsmith is one of those rugged types, with a thick beard and tousled hair and... Ahem. Sorry.\n@c0@"
  ja: "@a@b%a002020「どんな　剣職人さんかな？\n\tカッコイイ人かな？\n@c0@"
  ko: "@a@b%a002020: 어떤 검 장인일까?\n잘생겼을까?\n@c0@"
  sl: "@a@b%a002020：是个怎样的铸剑师呢？\n　　长得帅吗？\n@c0@"
  tl: "@a@b%a002020：是個怎樣的鑄劍師呢？\n　　長得帥嗎？\n@c0@"
14:
  en: "@a%0%a002030@bTurnscote? This is useful information indeed.\n@c0@"
  ja: "@a@b%a002030「ロンガデセオですね。\n\tいいことを　聞きました。\n@c0@"
  ko: "@a@b%a002030: 론가데세오 말이군요.\n좋은 정보를 얻었군요.\n@c0@"
  sl: "@a@b%a002030：洛卡迪塞欧啊。\n　　听到了个有用的消息呢。\n@c0@"
  tl: "@a@b%a002030：洛卡迪塞歐啊。\n　　聽到了個有用的消息呢。\n@c0@"
15:
  en: "@a%0%a002050@bLet's pick up any rusty old rubbish we find and get it bashed into some shiny new kit then, shall we?\n@c0@"
  ja: "@a@b%a002050「では　そのへんに　落ちている\n\tさびた剣でも　拾っていって\n\t新品に　してもらいましょう！\n@c0@"
  ko: "@a@b%a002050: 그럼 어디 떨어져 있는\n녹슨 검이라도 주워 가서\n새 물건으로 만들어 달라고 할까요!\n@c0@"
  sl: "@a@b%a002050：那我们就去\n　　捡几把生锈的剑，\n　　让他给弄成新的吧！\n@c0@"
  tl: "@a@b%a002050：那我們就去\n　　撿幾把生鏽的劍，\n　　讓他給弄成新的吧！\n@c0@"
