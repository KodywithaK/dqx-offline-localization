0:
  en: "@a@b*: There's nothing nicer than falling asleep to the sound of the waves, huh? Come back real soon.\n@c0@"
  ja: "@a@b＊「波の音を子守歌に　ねむるというのも\n\tなかなか　オツなものでしょう？\n\tまた　ご利用くださいね。\n@c0@"
  ko: "@a@b*: 파도 소리를 자장가 삼아 잠드는 것도\n꽤 운치 있는 일이죠?\n또 이용해 주십시오.\n@c0@"
  sl: "@a@b＊：伴着涛声入睡，\n　　感觉别有一番风味吧？\n　　欢迎再次光临。\n@c0@"
  tl: "@a@b＊：伴著濤聲入睡，\n　　感覺別有一番風味吧？\n　　歡迎再次光臨。\n@c0@"
1:
  en: "@a@b*: Looks like someone lived it up last night.\n@c0@"
  ja: "@a@b＊「ゆうべは　ずいぶんと\n\tお楽しみでしたね。\n@c0@"
  ko: "@a@b*: 어젯밤에는 꽤\n즐거우셨던 모양이군요.\n@c0@"
  sl: "@a@b＊：昨晚玩得很尽兴吧。\n@c0@"
  tl: "@a@b＊：昨晚玩得很盡興吧。\n@c0@"
2:
  en: "@a@b*: Look, I know this is an island and all, but can you keep the partying to a minimum? I have to clean up after you! \n@c0@"
  ja: "@a@b＊「でも　後片づけが　大変ですので\n\tマクラを投げて　あそぶのは\n\tほどほどに　してくださいよ。\n@c0@"
  ko: "@a@b*: 하지만 정리가 정말 힘드니까\n베개를 던지면서 노는 건\n웬만하면 참아 주세요.\n@c0@"
  sl: "@a@b＊：不过，打扫起来很费劲的。\n　　扔枕头玩也请适可而止啊。\n@c0@"
  tl: "@a@b＊：不過，打掃起來很費勁的。\n　　扔枕頭玩也請適可而止啊。\n@c0@"
3:
  en: "@a@b*: It's my job to keep this place ship-shape so it's ready whenever you need it.\n@c0@"
  ja: "@a@b＊「みなさんが　いつでも　安全に\n\tこの島を　使えるよう　手入れを\n\tしておくのも　私の仕事です。\n@c0@"
  ko: "@a@b*: 여러분이 항상 안전하게\n이 섬을 이용하실 수 있도록\n관리해 두는 것도 저의 일입니다.\n@c0@"
  sl: "@a@b＊：为了让大家能放心使用这座岛\n　　而时常对它进行日常维护，\n　　也是我的工作的一部分。\n@c0@"
  tl: "@a@b＊：為了讓大家能放心使用這座島\n　　而時常對它進行日常維護，\n　　也是我的工作的一部分。\n@c0@"
4:
  en: "@a@b*: Er, I guess the correct term would be ‘island-shape’... Whatever. You know what I mean.\n@c0@"
  ja: "@a@b＊「ですので　大船に乗った気分で\n\tいてください。　まあ　これは\n\t船じゃなくて　島ですけど。　あはは。\n@c0@"
  ko: "@a@b*: 그러니 큰 배를 탔다고 생각하고\n안심해 주십시오. 사실 이건\n배가 아니라 섬이지만. 아하하.\n@c0@"
  sl: "@a@b＊：所以请放宽心，\n　　就当是乘坐一艘安稳的大船吧。\n　　只不过这不是船，是座岛。啊哈哈。\n@c0@"
  tl: "@a@b＊：所以請放寬心，\n　　就當是乘坐一艘安穩的大船吧。\n　　只不過這不是船，是座島。啊哈哈。\n@c0@"
5:
  en: "@a@bThere's no response. It's just a corpse.\n@c0@"
  ja: "@a@b返事がない……。\nただの　しかばねの　ようだ……。\n@c0@"
  ko: "@a@b반응이 없다.\n그냥 시체인 것 같다......\n@c0@"
  sl: "@a@b没有回应。\n看来只是一具尸体……\n@c0@"
  tl: "@a@b沒有回應。\n看來只是一具屍體………\n@c0@"
6:
  en: "@a@b*: Welcome to Medford's Manor. His Medal Majesty awaits you inside!\n@c0@"
  ja: "@a@b＊「ここは　メダル王の城。\n\t王が　おまちかねで　ございます。\n\tささ　どうぞ　中へ。\n@c0@"
  ko: "@a@b*: 이곳은 메달 왕의 성.\n왕께서 기다리고 계십니다.\n자, 어서 안으로 드시지요.\n@c0@"
  sl: "@a@b＊：这里是徽章王的城堡。\n　　徽章王已经等候多时了。\n　　快进去吧。\n@c0@"
  tl: "@a@b＊：這裡是徽章王的城堡。\n　　徽章王已經等候多時了。\n　　快進去吧。\n@c0@"
7:
  en: "@a@b*: I'm not a bad slime, you know. I promise! (slurp)\n@c0@"
  ja: "@a@b＊「ピキー！\n\tぼく　わるいスライムじゃないよ。\n@c0@"
  ko: "@a@b*: 뽀잉~!\n나는 나쁜 슬라임이 아니야.\n@c0@"
  sl: "@a@b＊：哔叽！\n　　我不是个坏史莱姆哦。\n@c0@"
  tl: "@a@b＊：嗶嘰！\n　　我不是個壞史萊姆哦。\n@c0@"
8:
  en: "@a@b*: Let me tell you a secret to prove it.\n@c0@"
  ja: "@a@b＊「だから　いいこと教えてあげる。\n@c0@"
  ko: "@a@b*: 그러니까 좋은 거 알려 줄게.\n@c0@"
  sl: "@a@b＊：所以我就告诉你们有用的消息吧。\n@c0@"
  tl: "@a@b＊：所以我就告訴你們有用的消息吧。\n@c0@"
9:
  en: "@a@b*: A long, long time agoo, monsters squished this castle along with Alltrades Abbey.\n@c0@"
  ja: "@a@b＊「ダーマの神殿も　この城も\n\tとっくの昔に　魔族が\n\t滅ぼしちゃったんだよ。\n@c0@"
  ko: "@a@b*: 다마 신전도 이 성도\n아주 옛날에 마족이\n파괴해 버렸어.\n@c0@"
  sl: "@a@b＊：达玛神殿和这座城堡，\n　　早在很久以前\n　　就被魔族摧毁了。\n@c0@"
  tl: "@a@b＊：達瑪神殿和這座城堡，\n　　早在很久以前\n　　就被魔族摧毀了。\n@c0@"
10:
  en: "@a@b*: Everyone still remembers them in their hearts, though, so in the world of dreams, they're in goopendous shape!\n@c0@"
  ja: "@a@b＊「でも　みんなの心のなかに\n\t残っていたから　夢の世界では\n\t生きつづけたんだ。\n@c0@"
  ko: "@a@b*: 하지만 모두의 마음속에\n남아 있었기 때문에 꿈의 세계에서는\n살아남을 수 있었던 거야.\n@c0@"
  sl: "@a@b＊：不过，由于它们还\n　　存留在大家的心中，\n　　所以在梦世界里能够继续存在。\n@c0@"
  tl: "@a@b＊：不過，由於它們還\n　　存留在大家的心中，\n　　所以在夢世界裡能夠繼續存在。\n@c0@"
11:
  en: "@a@b*: That must be why they opened gooreat big holes in the dream world — to try and seal them away.\n@c0@"
  ja: "@a@b＊「だから　この夢の世界の大地に\n\t大穴をあけて　せめて\n\t封印しちゃおうとしたみたいだね。\n@c0@"
  ko: "@a@b*: 그래서 이 꿈의 세계의 땅에\n큰 구멍을 내서라도\n봉인하려고 했던 건가 봐.\n@c0@"
  sl: "@a@b＊：因此，魔族才会想要在这个\n　　梦世界的大地上\n　　打开一个大洞将它们封印吧。\n@c0@"
  tl: "@a@b＊：因此，魔族才會想要在這個\n　　夢世界的大地上\n　　打开一个大洞將它們封印吧。\n@c0@"
12:
  en: "@a@b*: Why would Jamirus want to seal this castle away?\n@c0@"
  ja: "@a@b＊「なにゆえに　ジャミラスは\n\tこの城を　封印していたのか！？\n@c0@"
  ko: "@a@b*: 무슨 연유로 쟈미라스는\n이 성을 봉인했던 것인가!?\n@c0@"
  sl: "@a@b＊：贾米拉斯为何要\n　　封印这座城堡？！\n@c0@"
  tl: "@a@b＊：賈米拉斯為何要\n　　封印這座城堡？！\n@c0@"
13:
  en: "@a@b*: Perhaps he feared that King Medford's treasures were too much of a threat to monsterkind...\n@c0@"
  ja: "@a@b＊「おそらく　メダル王の持つ\n\tさまざまな宝物の中に　魔族にとって\n\t不都合な物が　あったからでは。\n@c0@"
  ko: "@a@b*: 필시 메달 왕이 가진\n다양한 보물 중에 마족에게\n불리한 물건이 있어서가 아니었을지.\n@c0@"
  sl: "@a@b＊：恐怕是在徽章王拥有的\n　　各种各样的宝物中，\n　　有对魔物不利的东西吧。\n@c0@"
  tl: "@a@b＊：恐怕是在徽章王擁有的\n　　各種各樣的寶物中，\n　　有對魔物不利的東西吧。\n@c0@"
14:
  en: "@a@b*: I'm feeling a little bit sheepish, I'm afraid. Seems I was caught napping at my post.\n@c0@"
  ja: "@a@b＊「いやはや……。\n\tどうやら私は　ずうっと\n\tねむったまま　だったらしい。\n@c0@"
  ko: "@a@b*: 이런, 이런......\n아무래도 나는 줄곧\n잠들어 있었던 모양이군.\n@c0@"
  sl: "@a@b＊：哎呀哎呀……\n　　我好像一直都在睡觉呢。\n@c0@"
  tl: "@a@b＊：哎呀哎呀……\n　　我好像一直都在睡覺呢。\n@c0@"
15:
  en: "@a@b*: I dreamt of a place called the Isle o' Smiles, where everyone was happy and nothing remotely bad ever happened...\n@c0@"
  ja: "@a@b＊「しあわせの国があるという　夢を\n\t見たところまでは　覚えているのだが\n\tそれから先は　まったく……。\n@c0@"
  ko: "@a@b*: 행복의 나라가 있다는 꿈을\n꾼 것까지는 기억이 나는데\n그 뒤는 전혀......\n@c0@"
  sl: "@a@b＊：我只记得梦见\n　　有一个幸福国，\n　　但是之后的就完全……\n@c0@"
  tl: "@a@b＊：我只記得夢見\n　　有一個幸福國，\n　　但是之後的就完全……\n@c0@"
16:
  en: "@a@b*: Anyway, while I was dozing, no one could get through the gates.\n@c0@"
  ja: "@a@b＊「ともかく　旅の者たちには\n\t門を　閉めたままで\n\t迷惑を　かけてしまったな。\n@c0@"
  ko: "@a@b*: 아무튼 문이 계속 닫혀 있었을 테니\n본의 아니게 여행자들을\n곤란하게 했군.\n@c0@"
  sl: "@a@b＊：总之，把门关着\n　　不让旅行者通行，\n　　真是给大家添麻烦了啊。\n@c0@"
  tl: "@a@b＊：總之，把門關著\n　　不讓旅行者通行，\n　　真是給大家添麻煩了啊。\n@c0@"
17:
  en: "@a@b*: I've opened them now, so have yourselves a safe journey!\n@c0@"
  ja: "@a@b＊「開けておいたから\n\t自由に　通ってよいぞ。\n@c0@"
  ko: "@a@b*: 열어 두었으니\n자유롭게 지나가도 좋다.\n@c0@"
  sl: "@a@b＊：我这就开门。\n　　大家可以自由通行了。\n@c0@"
  tl: "@a@b＊：我這就開門。\n　　大家可以自由通行了。\n@c0@"
18:
  en: "@a@b*: Your first time in Howcastle, is it? The Prince is a rum sort, I tell you. Well, you'll find out more anon.\n@c0@"
  ja: "@a@b＊「ここから先は　ホルストックの国だが\n\tそこの王子さまが　なんていうか……\n\tまっ　いってみれば　わかるよ。\n@c0@"
  ko: "@a@b*: 이 앞쪽은 홀스톡 왕국인데\n그 나라 왕자가 좀......\n뭐, 가 보면 알 거야.\n@c0@"
  sl: "@a@b＊：前面就是荷尔斯托克国了。\n　　不过那里的王子殿下，怎么说呢……\n　　唉，你去了就知道了。\n@c0@"
  tl: "@a@b＊：前面就是荷爾斯托克國了。\n　　不過那裡的王子殿下，怎麼說呢……\n　　唉，你去了就知道了。\n@c0@"
19:
  en: "@a@b*: Anyway, enough idle chit-chat! I've got to make a living somehow...\n@c0@"
  ja: "@a@b＊「ところで　あんた　旅の人だね。\n\tということはだ……\n@c0@"
  ko: "@a@b*: 그나저나 당신은 여행자 맞지?\n그렇다면......\n@c0@"
  sl: "@a@b＊：话说回来，你是个旅行者吧。\n　　那么我就应该说……\n@c0@"
  tl: "@a@b＊：話說回來，你是個旅行者吧。\n　　那麼我就應該說……\n@c0@"
20:
  en: "@a@b*: Come, my gloopy steed! We have no slime to waste! We must ride! Howcastle lies just up ahead!\n@c0@"
  ja: "@a@b＊「そりゃっ！　関所を通れば\n\tホルストックは　目の前だ。\n@c0@"
  ko: "@a@b*: 이랴! 관문을 통과하면\n홀스톡은 금방이겠군.\n@c0@"
  sl: "@a@b＊：嘿！过了关卡的话，\n　　荷尔斯托克就近在眼前了。\n@c0@"
  tl: "@a@b＊：嘿！過了關卡的話，\n　　荷爾斯托克就近在眼前了。\n@c0@"
21:
  en: "@a@b*: My destiny is to serve the prince of that realm! Onwards!\n@c0@"
  ja: "@a@b＊「王子の　お供をするため\n\tいざ　ホルストックへ！\n@c0@"
  ko: "@a@b*: 왕자님과의 동행을 위해\n홀스톡으로 출발!\n@c0@"
  sl: "@a@b＊：为了侍奉王子左右！\n　　朝荷尔斯托克前进！\n@c0@"
  tl: "@a@b＊：為了侍奉王子左右！\n　　朝荷爾斯托克前進！\n@c0@"
22:
  en: "@a@b*: Greetings, %H0860%Xtraveller%Ytravellers%Z! Welcome to Howsworth!\n@c0@"
  ja: "@a@b＊「あら　旅のかた　こんにちは。\n\tホルコッタの村に　ようこそ。\n@c0@"
  ko: "@a@b*: 어머, 여행자님 안녕.\n홀코타 마을에 온 걸 환영해.\n@c0@"
  sl: "@a@b＊：哎呀，是旅行者啊，你好。\n　　欢迎来到荷尔克塔村。\n@c0@"
  tl: "@a@b＊：哎呀，是旅行者啊，你好。\n　　歡迎來到荷爾克塔村。\n@c0@"
23:
  en: "@a@b*: Well, what do we have here then? A strappin' %H0860%Xyoungster%Ybunch o' youngsters%Z!\n@c0@"
  ja: "@a@b＊「おう　あんたら\n\tいいカラダさ　してるでねえか。\n@c0@"
  ko: "@a@b*: 오, 너희들\n멋진 몸을 하고 있군.\n@c0@"
  sl: "@a@b＊：哦，你们身体\n　　挺健壮的嘛。\n@c0@"
  tl: "@a@b＊：哦，你們身體\n　　挺健壯的嘛。\n@c0@"
24:
  en: "@a@b*: You fancy gettin' yer hands dirty and helpin' me out with the harvest?\n@c0@"
  ja: "@a@b＊「どうだ？　オラたちと　いっしょに\n\t畑さ　たがやして\n\tこの村で　くらさねえか？\n@c0@"
  ko: "@a@b*: 혹시 우리랑 같이\n밭을 갈면서\n이 마을에서 살아 볼 텨?\n@c0@"
  sl: "@a@b＊：怎么样？\n　　要不要跟我们一起种地，\n　　在这村子里过日子？\n@c0@"
  tl: "@a@b＊：怎麼樣？\n　　要不要跟我們一起種地，\n　　在這村子裡過日子？\n@c0@"
25:
  en: "@a@b*: Good on you! The youngsters in this here village are scared of a little hard work!\n@c0@"
  ja: "@a@b＊「ほう……。\n\t今どきの　若いモンにしちゃあ\n\tめずらしい　答えでねえか。\n@c0@"
  ko: "@a@b*: 호오......\n요즘 젊은이치곤\n듣기 드문 답변이군.\n@c0@"
  sl: "@a@b＊：哦……\n　　现在的年轻人\n　　很少能做出这样的回答呢。\n@c0@"
  tl: "@a@b＊：哦……\n　　現在的年輕人\n　　很少能做出這樣的回答呢。\n@c0@"
26:
  en: "@a@b*: So yer happy to settle down here in Howsworth and live a simple farmer's life?\n@c0@"
  ja: "@a@b＊「したら　オラの　養子にでも\n\tなるだか？\n@c0@"
  ko: "@a@b*: 그럼 내 양자로라도\n들어올 텨?\n@c0@"
  sl: "@a@b＊：那么，\n　　要不要做我养子？\n@c0@"
  tl: "@a@b＊：那麼，\n　　要不要做我養子？\n@c0@"
27:
  en: "@a@b*: Well, get crackin' then! Plenty o' work to be done! ㈢㈢What's wrong? ...Yer heart ain't in it, is it?\n@c0@"
  ja: "@a@b＊「よっしゃあ　決まった！\n\t今日から　あんたは　オラの子供だ。\n\tきばって　働くだよ！㈢㈢　なあんて。\n@c0@"
  ko: "@a@b*: 좋아, 결정했어!\n오늘부터 너는 내 자식이다.\n열심히 일해!㈢㈢ 농담이야.\n@c0@"
  sl: "@a@b＊：好！决定了！\n　　今天起你就是我的孩子了。\n　　打起精神来干活咯！㈢㈢逗你的。\n@c0@"
  tl: "@a@b＊：好！決定了！\n　　今天起你就是我的孩子了。\n　　打起精神來幹活咯！㈢㈢逗你的。\n@c0@"
28:
  en: "@a@b*: I'm just joshin' with you! That's the famous Howsworth humour, that is!\n@c0@"
  ja: "@a@b＊「ハッハッハ！　気に　すんでねえ。\n\t冗談だかんな。\n@c0@"
  ko: "@a@b*: 하하하! 걱정 내려 놓으라고.\n농담이니께.\n@c0@"
  sl: "@a@b＊：哈哈哈，别在意。\n　　开玩笑的。\n@c0@"
  tl: "@a@b＊：哈哈哈，別在意。\n　　開玩笑的。\n@c0@"
29:
  en: "@a@b*: Neeeigh. Snort!\n@c0@"
  ja: "@a@b＊「ヒヒーン　ブルルルッ！\n@c0@"
  ko: "@a@b*: 히힝~! 부르르르!\n@c0@"
  sl: "@a@b＊：嘶嘶，噗噜噜！\n@c0@"
  tl: "@a@b＊：嘶嘶，噗嚕嚕！\n@c0@"
30:
  en: "@a@b*: This village has a certain rustic charm, doesn't it? Hang round for a while, and you'll feel like all's well with the world...\n@c0@"
