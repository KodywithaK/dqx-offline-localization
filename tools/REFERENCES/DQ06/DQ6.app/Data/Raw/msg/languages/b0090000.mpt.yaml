24:
  en: "@a@b*: A human heart laid bare is a pathetically weak and fragile object.\n@c0@"
  ja: "@a@b＊「むきだしにされた心は\n\tキズつきやすく　弱い。\n\tそれが　人間という　生き物だ。\n@c0@"
  ko: "@a@b*: 벌거숭이가 된 마음은\n상처받기 쉽고 나약하지.\n그것이 인간이라는 동물.\n@c0@"
  sl: "@a@b＊：暴露在外的心是很容易受伤的。\n　　人类这种生物就是如此弱小。\n@c0@"
  tl: "@a@b＊：暴露在外的心是很容易受傷的。\n　　人類這種生物就是如此弱小。\n@c0@"
