103:
  en: "@a%0%a002050@bSo we came here to see Ali Kazam, did we? That's news to old %a002050...\n@c0@"
  ja: "@a@b%a002050「私たちが　ザム神官に　会うために\n\tここに　来たとは　知りませんでした！\n@c0@"
  ko: "@a@b%a002050: 우리가 자무 신관을 만나기 위해\n여기에 왔는 줄은 몰랐습니다!\n@c0@"
  sl: "@a@b%a002050：我现在才知道我们原来是\n　　为了见扎姆神官才来这里的！\n@c0@"
  tl: "@a@b%a002050：我現在才知道我們原來是\n　　為了見扎姆神官才來這裡的！\n@c0@"
104:
  en: "@a%0%a002070@bBoing! (jiggle)\n@c0@"
  ja: "@a@b%a002070「プルプルーッ！\n@c0@"
  ko: "@a@b%a002070: 뽀용뽀요용~!\n@c0@"
  sl: "@a@b%a002070：噗噜噗噜！\n@c0@"
  tl: "@a@b%a002070：噗嚕噗嚕！\n@c0@"
105:
  en: "@a%0%a002000@bGeh. Not too friendly, aye?\n@c0@"
  ja: "@a@b%a002000「なんだよ　つめたいな。\n@c0@"
  ko: "@a@b%a002000: 뭐야, 차갑군.\n@c0@"
  sl: "@a@b%a002000：搞什么啊，真冷淡。\n@c0@"
  tl: "@a@b%a002000：搞什麼啊，真冷淡。\n@c0@"
106:
  en: "@a%0%a002010@bIf there's a village up ahead, it'd be a shame not to visit.\n@c0@"
  ja: "@a@b%a002010「この先に　村が　あるなら\n\tとりあえず　行ってみましょ。\n@c0@"
  ko: "@a@b%a002010: 이 앞에 마을이 있다면\n우선 가 보자.\n@c0@"
  sl: "@a@b%a002010：这前面既然有村庄，\n　　总之先去看看吧。\n@c0@"
  tl: "@a@b%a002010：這前面既然有村莊，\n　　總之先去看看吧。\n@c0@"
107:
  en: "@a%0%a002030@bJust what sort of person is this Ali Kazam?\n@c0@"
  ja: "@a@b%a002030「ザム神官……。\n\tいったい　どのような\n\tお方なのでしょう……。\n@c0@"
  ko: "@a@b%a002030: 자무 신관......\n도대체 어떤\n분일까요......\n@c0@"
  sl: "@a@b%a002030：扎姆神官……\n　　到底是位什么样的人呢……\n@c0@"
  tl: "@a@b%a002030：扎姆神官……\n　　到底是位什麼樣的人呢……\n@c0@"
108:
  en: "@a%0%a002020@bA sleepy village? Let's check it out! Maybe we'll find out more about this Ali Kazam guy while we're there.\n@c0@"
  ja: "@a@b%a002020「小さな村だって！\n\tザム神官は　知らないけど\n\t行ってみようよ！\n@c0@"
  ko: "@a@b%a002020: 작은 마을이래!\n자무 신관은 모르지만\n일단 가 보자!\n@c0@"
  sl: "@a@b%a002020：说是有个小村子呢！\n　　虽然不认识扎姆神官，\n　　总之去看看吧！\n@c0@"
  tl: "@a@b%a002020：說是有個小村子呢！\n　　雖然不認識扎姆神官，\n　　總之去看看吧！\n@c0@"
109:
  en: "@a%0%a002050@bWe'd better go and find out what that nameless village is called!\n@c0@"
  ja: "@a@b%a002050「何ていう　名前の　村なのか\n\t行って　しらべなくては！\n@c0@"
  ko: "@a@b%a002050: 무슨 이름의 마을인지\n가서 알아 봐야!\n@c0@"
  sl: "@a@b%a002050：村名到底是什么呢，\n　　这必须得去一探究竟了！\n@c0@"
  tl: "@a@b%a002050：村名到底是什麼呢，\n　　這必須得去一探究竟了！\n@c0@"
110:
  en: "@a%0%a002070@bBoing! (jiggle)\n@c0@"
  ja: "@a@b%a002070「プルプルーッ！\n@c0@"
  ko: "@a@b%a002070: 뽀용뽀요용~!\n@c0@"
  sl: "@a@b%a002070：噗噜噗噜！\n@c0@"
  tl: "@a@b%a002070：噗嚕噗嚕！\n@c0@"
111:
  en: "@a%0%a002000@bWhat!? We need magic words 'n' everything like that? We'd better figure 'em out, aye?\n@c0@"
  ja: "@a@b%a002000「なんだって！？\n\t伝説の剣の　封印を解く言葉だって！？\n\tぜひ　知りたいぜ！\n@c0@"
  ko: "@a@b%a002000: 뭐라고!?\n전설의 검의 봉인을 푸는 주문!?\n꼭 알고 싶군!\n@c0@"
  sl: "@a@b%a002000：什么？！\n　　解除传说之剑封印的暗语？！\n　　好想知道啊！\n@c0@"
  tl: "@a@b%a002000：什麼？！\n　　解除傳說之劍封印的暗語？！\n　　好想知道啊！\n@c0@"
112:
  en: "@a%0%a002010@bSo Ali Kazam has already passed on...\n@c0@"
  ja: "@a@b%a002010「もう　亡くなられて\n\tしまったのね……。\n@c0@"
  ko: "@a@b%a002010: 이미 돌아가시고\n말았구나......\n@c0@"
  sl: "@a@b%a002010：已经去世了呢……\n@c0@"
  tl: "@a@b%a002010：已經去世了呢……\n@c0@"
113:
  en: "@a%0%a002030@bI would have liked to have met this Ali.\n@c0@"
  ja: "@a@b%a002030「できれば　ザム神官に\n\tお会いしたかったです。\n@c0@"
  ko: "@a@b%a002030: 자무 신관을\n꼭 뵙고 싶었는데.\n@c0@"
  sl: "@a@b%a002030：可以的话\n　　真想见见扎姆神官。\n@c0@"
  tl: "@a@b%a002030：可以的話\n　　真想見見扎姆神官。\n@c0@"
114:
  en: "@a%0%a002020@bOur first clue, and it's a dead end!? Oh, brother. There's gotta be some way to find those words!\n@c0@"
  ja: "@a@b%a002020「えー！？\n\tなんとか　ならないのー！？\n\tせっかくの　手がかりなのにー！\n@c0@"
  ko: "@a@b%a002020: 에~!?\n어떻게 안 되나~!?\n모처럼 잡은 단서인데~!\n@c0@"
  sl: "@a@b%a002020：诶？！\n　　就没什么办法吗？！\n　　我们好不容易才找到线索的啊！\n@c0@"
  tl: "@a@b%a002020：誒？！\n　　就沒什麼辦法嗎？！\n　　我們好不容易才找到線索的啊！\n@c0@"
115:
  en: "@a%0%a002050@bMagic words for liftin' the seal on the legendary sword... And no one but Ali Kazam knows 'em?\n@c0@"
  ja: "@a@b%a002050「伝説の剣の　封印を解く\n\t言葉ですか……　ザム神官以外に\n\t知っている人は　いないのでしょうか？\n@c0@"
  ko: "@a@b%a002050: 전설의 검의 봉인을 푸는\n주문이요......자무 신관 말고\n아는 사람은 없을까요?\n@c0@"
  sl: "@a@b%a002050：解除传说之剑封印的\n　　暗语啊……除了扎姆神官以外\n　　就没有别人知道了吗？\n@c0@"
  tl: "@a@b%a002050：解除傳說之劍封印的\n　　暗語啊……除了扎姆神官以外\n　　就沒有別人知道了嗎？\n@c0@"
