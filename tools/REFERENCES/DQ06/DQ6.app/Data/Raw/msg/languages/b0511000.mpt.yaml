  ja: "@a@b%a002000「オレと　まったく\n\t同じ名前のヤツが　いるなんて\n\tややこしい話だぜ！\n@c0@"
  ko: "@a@b%a002000: 나하고 완전\n똑같은 이름의 녀석이 있다니,\n납득이 안 되는 얘기로군!\n@c0@"
  sl: "@a@b%a002000：竟然有跟俺名字一样的人，\n　　真复杂啊！\n@c0@"
  tl: "@a@b%a002000：竟然有跟俺名字一樣的人，\n　　真複雜啊！\n@c0@"
134:
  en: "@a%0%a002010@bWe shouldn't interrupt him while he's sleeping. Let's go, %a000090.\n@c0@"
  ja: "@a@b%a002010「お休みのところを\n\tジャマしちゃ　いけないわ。\n\tさあ　行きましょう。\n@c0@"
  ko: "@a@b%a002010: 쉬고 있는데\n방해해선 안 돼.\n자, 가자.\n@c0@"
  sl: "@a@b%a002010：唔，别人正在休息，\n　　别打扰人家了。\n　　我们走吧。\n@c0@"
  tl: "@a@b%a002010：唔，別人正在休息，\n　　別打擾人家了。\n　　我們走吧。\n@c0@"
135:
  en: "@a%0%a002000@bAye. It definitely says ‘Somnia’...\n@c0@"
  ja: "@a@b%a002000「やっぱ　レイドックって\n\t書いてあるよな……。\n@c0@"
  ko: "@a@b%a002000: 역시 레이독이라고\n적혀 있군......\n@c0@"
  sl: "@a@b%a002000：果然写着雷多克啊……\n@c0@"
  tl: "@a@b%a002000：果然寫著雷多克啊……\n@c0@"
136:
  en: "@a%0%a002010@bSo this is where we board the ferry to Somnia.\n@c0@"
  ja: "@a@b%a002010「ここから　船に乗れば\n\tレイドックに　行けるってことね。\n@c0@"
  ko: "@a@b%a002010: 여기서 배를 타면\n레이독에 갈 수 있다는 거네.\n@c0@"
  sl: "@a@b%a002010：从这里坐船的话，\n　　就可以去雷多克了吧。\n@c0@"
  tl: "@a@b%a002010：從這裡坐船的話，\n　　就可以去雷多克了吧。\n@c0@"
137:
  en: "@a%0%a002000@bFat lot of good that'll do. There's always that one guy who jumps on at the last minute!\n@c0@"
  ja: "@a@b%a002000「あー　いるいる！\n\tギリギリで　飛び込むヤツな！\n\tいるよ　うん！\n@c0@"
  ko: "@a@b%a002000: 아~ 있다, 있어!\n아슬아슬하게 뛰어드는 녀석!\n꼭 있다니까!\n@c0@"
  sl: "@a@b%a002000：啊，你看你看！\n　　为了赶时间飞奔上船！\n　　果然有这种人！\n@c0@"
  tl: "@a@b%a002000：啊，你看你看！\n　　為了趕時間飛奔上船！\n　　果然有這種人！\n@c0@"
138:
  en: "@a%0%a002000@bHardy har! Sounds like this sailor could use a cold dip.\n@c0@"
  ja: "@a@b%a002000「仲間を　ほめられるって\n\tわるい気は　しないなあ。\n@c0@"
  ko: "@a@b%a002000: 동료가 칭찬을 받으니\n기분이 나쁘지는 않군.\n@c0@"
  sl: "@a@b%a002000：咱的伙伴被赞美了，\n　　感觉也很不错啊。\n@c0@"
  tl: "@a@b%a002000：咱的夥伴被讚美了，\n　　感覺也很不錯啊。\n@c0@"
139:
  en: "@a%0%a002010@bHe seemed in fine fettle!\n@c0@"
  ja: "@a@b%a002010「元気そうな　船員さんね。\n\tさあ　行きましょう。\n@c0@"
  ko: "@a@b%a002010: 기운이 넘치는 선원이네.\n자, 어서 가자.\n@c0@"
  sl: "@a@b%a002010：船员先生很精神啊。\n　　我们走吧。\n@c0@"
  tl: "@a@b%a002010：船員先生很精神啊。\n　　我們走吧。\n@c0@"
140:
  en: "@a%0%a002000@bI'm sure we could've figured that out ourselves.\n@c0@"
  ja: "@a@b%a002000「まあ　たしかに\n\t船員の　いうことも\n\tもっともだよな。\n@c0@"
  ko: "@a@b%a002000: 뭐 분명\n선원이 한 말도\n당연한 소리지.\n@c0@"
  sl: "@a@b%a002000：嗯，\n　　的确如这个船员所说。\n@c0@"
  tl: "@a@b%a002000：嗯，\n　　的確如這個船員所說。\n@c0@"
141:
  en: "@a%0%a002000@bI feel like I've already seen all there is to see...\n@c0@"
  ja: "@a@b%a002000「見物ったってなあ……。\n@c0@"
  ko: "@a@b%a002000: 구경이나 하라고......\n@c0@"
  sl: "@a@b%a002000：叫咱转一圈……\n@c0@"
  tl: "@a@b%a002000：叫咱轉一圈……\n@c0@"
142:
  en: "@a%0%a002000@bThis place practically seems like home.\n@c0@"
  ja: "@a@b%a002000「まあ　しょうがない。\n\tもう　ひとまわり　してくるか。\n@c0@"
  ko: "@a@b%a002000: 뭐 하는 수 없군.\n한 바퀴 더 돌고 오자고.\n@c0@"
  sl: "@a@b%a002000：算了，那就走吧。\n　　咱们再去转一圈。\n@c0@"
  tl: "@a@b%a002000：算了，那就走吧。\n　　咱們再去轉一圈。\n@c0@"
143:
  en: "@a%0%a002010@bIf the ferry's not ready to sail, there's not much we can do about it. Let's try and gather some more information from the locals.\n@c0@"
  ja: "@a@b%a002010「せいび中じゃ　しかたないわね。\n\tもう少し　町のひとたちから\n\tじょうほうでも　集めてきましょうか。\n@c0@"
  ko: "@a@b%a002010: 정비 중이라니 어쩔 수가 없네.\n마을 사람들한테 좀 더\n정보를 모아 오자.\n@c0@"
  sl: "@a@b%a002010：没办法，船还没准备好呢。\n　　我们在镇上再待一段时间，\n　　多收集些情报也好。\n@c0@"
  tl: "@a@b%a002010：沒辦法，船還沒準備好呢。\n　　我們在鎮上再待一段時間，\n　　多收集些情報也好。\n@c0@"
144:
  en: "@a%0%a002000@bThe King is cursed now? Why won't anyone tell us the whole story?\n@c0@"
  ja: "@a@b%a002000「こんどは　のろい　かよ……。\n\tまったく　レイドック王も\n\tさんざんだな。\n@c0@"
  ko: "@a@b%a002000: 이번에는 저주란 말인가......\n나 원, 레이독 왕도 참 난감할 노릇이군.\n@c0@"
  sl: "@a@b%a002000：这次又说是诅咒……\n　　雷多克王真是多灾多难。\n@c0@"
  tl: "@a@b%a002000：這次又說是詛咒……\n　　雷多克王真是多災多難。\n@c0@"
145:
  en: "@a%0%a002010@bThe more I hear about Somnia, the more I'd like to get there as soon as possible...\n@c0@"
  ja: "@a@b%a002010「話を　きけば　きくほど\n\tいっこくも早く　レイドックに\n\t行きたくなってきたわ。\n@c0@"
  ko: "@a@b%a002010: 이런 저런 얘기를\n듣고 있자니 한시라도 빨리\n레이독에 가고 싶어.\n@c0@"
  sl: "@a@b%a002010：听了这些情报，\n　　我更想快点去雷多克城了。\n@c0@"
  tl: "@a@b%a002010：聽了這些情報，\n　　我更想快點去雷多克城了。\n@c0@"
146:
  en: "@a%0%a002000@bThat's no good. We're not goin' to be learnin' anything else from her...\n@c0@"
  ja: "@a@b%a002000「さっきは　ムドーの\n\tのろいとか　いってたのにな……。\n@c0@"
  ko: "@a@b%a002000: 방금 전에는 무도의\n저주 어쩌고 하더니......\n@c0@"
  sl: "@a@b%a002000：刚才明明已经说了\n　　姆多的诅咒了啊……\n@c0@"
  tl: "@a@b%a002000：剛才明明已經說了\n　　姆多的詛咒了啊……\n@c0@"
147:
  en: "@a%0%a002010@bNobody seems to want to talk about Somnia. I suppose we'll just have to go and see for ourselves.\n@c0@"
  ja: "@a@b%a002010「レイドックのことは\n\t早く　自分たちで　たしかめに\n\t行くしかなさそうね。\n@c0@"
  ko: "@a@b%a002010: 레이독의 일은\n빨리 가서 직접\n확인하는 수밖에 없겠어.\n@c0@"
  sl: "@a@b%a002010：我们要快点去雷多克，\n　　亲自查证事情真相。\n@c0@"
  tl: "@a@b%a002010：我們要快點去雷多克，\n　　親自查證事情真相。\n@c0@"
148:
  en: "@a%0%a002000@bBlimey. The girl here really loves blabbin' on about that swordsman.\n@c0@"
  ja: "@a@b%a002000「この店の　バニーちゃんは\n\tあいかわらず　旅の剣士の話だな。\n@c0@"
  ko: "@a@b%a002000: 이 가게의 바니걸은\n여전히 떠돌이 검사 얘기를 하는군.\n@c0@"
  sl: "@a@b%a002000：这店里的兔女郎\n　　还是在说那个剑士的事情。\n@c0@"
  tl: "@a@b%a002000：這店裡的兔女郎\n　　還是在說那個劍士的事情。\n@c0@"
149:
  en: "@a%0%a002000@bSwords are for sissies. Seems like she's never met a martial artist.\n@c0@"
  ja: "@a@b%a002000「旅の　ぶとう家のほうが\n\tぜったい　カッコいいのにな……。\n@c0@"
  ko: "@a@b%a002000: 방랑 무투가가\n훨씬 더 멋있는데 말이야......\n@c0@"
  sl: "@a@b%a002000：明明是旅行的\n　　武术家更帅啊……\n@c0@"
  tl: "@a@b%a002000：明明是旅行的\n　　武術家更帥啊……\n@c0@"
150:
  en: "@a%0%a002010@bIf what she says is true, I wouldn't mind meeting this dashing swordsman myself!\n@c0@"
  ja: "@a@b%a002010「そんなに　ステキな\n\t剣士さんなら　私も　会って\n\tみたいものだわね。\n@c0@"
  ko: "@a@b%a002010: 그렇게나 멋진\n검사라면 나도\n꼭 만나보고 싶어.\n@c0@"
  sl: "@a@b%a002010：那么出色的剑士，\n　　我也想见一见他呢。\n@c0@"
  tl: "@a@b%a002010：那麼出色的劍士，\n　　我也想見一見他呢。\n@c0@"
151:
  en: "@a%0%a002000@bI couldn't wait to play when we were invisible, and now we can! It's just a shame folks can see my poker face now...\n@c0@"
  ja: "@a@b%a002000「まずいな　%a000090！\n\tこんどは　あそぼうと　思ったら\n\tいくらでも　あそべちまうぜ。\n@c0@"
  ko: "@a@b%a002000: 난처하게 됐군, %a000090!\n이번에는 작정하고 놀면\n얼마든지 놀 수 있겠는걸.\n@c0@"
  sl: "@a@b%a002000：太棒了%a000090！\n　　这一次，\n　　咱们可以尽情玩个痛快了。\n@c0@"
  tl: "@a@b%a002000：太棒了%a000090！\n　　這一次，\n　　咱們可以盡情玩個痛快了。\n@c0@"
152:
  en: "@a%0%a002000@bUp for a game? It's not gamblin' if we win!\n@c0@"
  ja: "@a@b%a002000「どうする？\n\tちょっとだけ　あそんでいくか？\n@c0@"
  ko: "@a@b%a002000: 어떻게 할 텐가?\n잠시만 놀다 갈까?\n@c0@"
  sl: "@a@b%a002000：怎么样？\n　　要不要去玩一下？\n@c0@"
  tl: "@a@b%a002000：怎麼樣？\n　　要不要去玩一下？\n@c0@"
153:
  en: "@a%0%a002010@bA little fun can't hurt. Just don't overdo it, %a000090.\n@c0@"
  ja: "@a@b%a002010「あそぶのは　自由だけど\n\tほどほどにね。\n@c0@"
  ko: "@a@b%a002010: 노는 건 자유지만\n정도껏 하는 게 좋아.\n@c0@"
  sl: "@a@b%a002010：玩一下也无妨，\n　　但是要注意分寸哦。\n@c0@"
  tl: "@a@b%a002010：玩一下也無妨，\n　　但是要注意分寸哦。\n@c0@"
154:
  en: "@a%0%a002000@bI'll bet you double or nothin' that I can triple my tokens!\n@c0@"
  ja: "@a@b%a002000「ここが　コイン売場か。\n\tコインが　買えるとなると\n\tあそびたい気も　してくるな。\n@c0@"
  ko: "@a@b%a002000: 여기가 코인 판매소?\n코인을 살 수 있다니\n놀고 싶은 생각이 굴뚝 같군.\n@c0@"
  sl: "@a@b%a002000：这里是代币出售点么。\n　　现在能买代币了，\n　　真的非常想玩啊。\n@c0@"
  tl: "@a@b%a002000：這裡是代幣出售點麼。\n　　現在能買代幣了，\n　　真的非常想玩啊。\n@c0@"
155:
  en: "@a%0%a002000@bWonder what I should trade for first when I hit it big...\n@c0@"
  ja: "@a@b%a002000「まいったなあ。\n\tコインが　いっぱい　たまっちまったら\n\t何に　こうかんしようかな。\n@c0@"
  ko: "@a@b%a002000: 고민이군.\n코인이 잔뜩 모이면\n뭘로 바꿔야 하나 이거.\n@c0@"
  sl: "@a@b%a002000：真难办啊。\n　　赢了足够的代币之后，\n　　换什么才好呢。\n@c0@"
  tl: "@a@b%a002000：真難辦啊。\n　　贏了足夠的代幣之後，\n　　換什麼才好呢。\n@c0@"
156:
  en: "@a%0%a002010@bSeems like gathering advice from other players could be the secret path to success!\n@c0@"
  ja: "@a@b%a002010「じっさいに　あそんでいる\n\tひとたちから　話をきくのが\n\t勝つための　ひけつかもしれないわね。\n@c0@"
  ko: "@a@b%a002010: 실제로 게임 중인\n사람들한테 이야기를 들어보면\n딸 수 있는 비결을 얻을 지도 모르지.\n@c0@"
  sl: "@a@b%a002010：听听有经验的人\n　　说些什么，\n　　说不定可以找到制胜秘诀哦。\n@c0@"
  tl: "@a@b%a002010：聽聽有經驗的人\n　　說些什麼，\n　　說不定可以找到制勝秘訣哦。\n@c0@"
157:
  en: "@a%0%a002000@bI've got nothin' to prove. We martial artists hit the jackpot when it comes to guts.\n@c0@"
  ja: "@a@b%a002000「オレは　勝負師じゃないが\n\tぶとう家だからな。\n\tどきょうなら　あるぜ！\n@c0@"
  ko: "@a@b%a002000: 나는 도박꾼은 아니지만\n무투가라서 말이야.\n배짱이라면 자신 있지!\n@c0@"
  sl: "@a@b%a002000：俺不是赌徒是武术家。\n　　不过俺胆量一样很大呢！\n@c0@"
  tl: "@a@b%a002000：俺不是賭徒是武術家。\n　　不過俺膽量一樣很大呢！\n@c0@"
158:
  en: "@a%0%a002000@bIf at first you don't succeed, ante up again!\n@c0@"
  ja: "@a@b%a002000「やっぱ　勝負ごとは\n\tガマンだよな　ガマン！\n@c0@"
  ko: "@a@b%a002000: 역시 승부에는\n인내심이 필요한 법!\n@c0@"
  sl: "@a@b%a002000：胜负之道，\n　　在于忍耐，忍耐呀！\n@c0@"
  tl: "@a@b%a002000：勝負之道，\n　　在於忍耐，忍耐呀！\n@c0@"
159:
  en: "@a%0%a002010@bOh, dear... Doesn't he know that getting addicted to gambling is a one way ticket to destitution?\n@c0@"
  ja: "@a@b%a002010「ギャンブルに　熱くなって\n\t人生まで　片道キップになったら\n\tおしまいだわね。\n@c0@"
  ko: "@a@b%a002010: 도박에 빠져\n인생까지 편도 티켓이 되면\n그걸로 끝장인 거야.\n@c0@"
  sl: "@a@b%a002010：一旦沉迷于赌博，\n　　人生就算是走上了不归路啊。\n@c0@"
  tl: "@a@b%a002010：一旦沉迷於賭博，\n　　人生就算是走上了不歸路啊。\n@c0@"
