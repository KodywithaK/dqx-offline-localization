  ko: "@a@b%a002050: 모건에게 묻는 건\n왠지 싫으니까 우리끼리\n어떻게든 해 보자고요!\n@c0@"
  sl: "@a@b%a002050：谁会花那么多钱\n　　去问摩根啊！\n　　我们自己去找就好了！\n@c0@"
