0:
  en: "@a%0%a002000@bI always get sleepy when I see a bed... But no time for nappin' now!\n@c0@"
  ja: "@a@b%a002000「ベッドを　見ると\n\t休みたくなっちまうけど\n\tいまは先を　急がなきゃな！\n@c0@"
  ko: "@a@b%a002000: 침대를 보니\n쉬고 싶은 마음이 굴뚝 같지만\n지금은 길을 서둘러야 해!\n@c0@"
  sl: "@a@b%a002000：看见床就想睡觉，\n　　不过现在要赶路啊！\n@c0@"
  tl: "@a@b%a002000：看見床就想睡覺，\n　　不過現在要趕路啊！\n@c0@"
1:
  en: "@a%0%a002010@bI like an inn with a unique atmosphere. And this one is certainly unique...\n@c0@"
  ja: "@a@b%a002010「こういう　宿屋さんも\n\tかわっていて　いいわね。\n@c0@"
  ko: "@a@b%a002010: 이런 여관도\n독특해서 좋아 보여.\n@c0@"
  sl: "@a@b%a002010：这样的旅店也很有趣呢，\n　　我很喜欢。\n@c0@"
  tl: "@a@b%a002010：這樣的旅店也很有趣呢，\n　　我很喜歡。\n@c0@"
2:
  en: "@a%0%a002000@bAhoy! We're at the checkpoint!\n@c0@"
  ja: "@a@b%a002000「おっ　関所に　着いたな。\n@c0@"
  ko: "@a@b%a002000: 엇, 관문에 도착했군.\n@c0@"
  sl: "@a@b%a002000：哦，到关卡了。\n@c0@"
  tl: "@a@b%a002000：哦，到關卡了。\n@c0@"
3:
  en: "@a%0%a002000@bI bet the monsters are a lot tougher beyond here. Can't wait to find out!\n@c0@"
  ja: "@a@b%a002000「この先の　土地には\n\tさらに強い　まものが　いるかもな。\n\tウデがなるぜ！\n@c0@"
  ko: "@a@b%a002000: 이 너머에 있는 땅에는\n더 강력한 마물이 있을지도.\n몸이 근질근질하는군!\n@c0@"
  sl: "@a@b%a002000：前面说不定有更强的魔物。\n　　想想就兴奋！\n@c0@"
  tl: "@a@b%a002000：前面說不定有更強的魔物。\n　　想想就興奮！\n@c0@"
4:
  en: "@a%0%a002000@bNever been past here myself. I've always dreamt of seein' the world, ya know.\n@c0@"
  ja: "@a@b%a002000「この先は　たしか　オレも\n\t行ったことがねえんだ。\n\tとにかく　先へ行きゃ　いいだろ。\n@c0@"
  ko: "@a@b%a002000: 이 너머는 나 역시\n가본 적이 없어.\n그럼 어디 한번 가볼까.\n@c0@"
  sl: "@a@b%a002000：再往前俺也没去过了。\n　　不管那么多，往前走吧。\n@c0@"
  tl: "@a@b%a002000：再往前俺也沒去過了。\n　　不管那麼多，往前走吧。\n@c0@"
5:
  en: "@a%0%a002000@bUh, okay. So go north-east, head south, look for a house...\n@c0@"
  ja: "@a@b%a002000「えーと……\n\tまずは　北東に向かって\n\t岬で…　南……\n@c0@"
  ko: "@a@b%a002000: 으음, 그러니까......\n우선 북동쪽으로 가서\n곶에서... 남쪽으로.....\n@c0@"
  sl: "@a@b%a002000：嗯……\n　　先向东北海角……\n　　然后往南……\n@c0@"
  tl: "@a@b%a002000：嗯……\n　　先向東北海角……\n　　然後往南……\n@c0@"
6:
  en: "@a%0%a002000@bGah! I'm lousy with directions. I'll leave this one to you, %a000090.\n@c0@"
  ja: "@a@b%a002000「よし！\n\t%a000090　たのんだぜ！\n\tオレは　おまえを信じてるぜ！\n@c0@"
  ko: "@a@b%a002000: 좋아!\n%a000090, 너한테 맡길게!\n나는 너를 믿으니까!\n@c0@"
  sl: "@a@b%a002000：好吧！\n　　交给你了%a000090！\n　　俺信任你的方向感！\n@c0@"
  tl: "@a@b%a002000：好吧！\n　　交給你了%a000090！\n　　俺信任你的方向感！\n@c0@"
7:
  en: "@a%0%a002000@bRight! Don't worry about us.\n@c0@"
  ja: "@a@b%a002000「まかしとけって！\n\tなにがあろうと　オレたちは\n\t大丈夫だぜ！\n@c0@"
  ko: "@a@b%a002000: 맡겨두라고!\n무슨 일이 있든 우리는\n끄떡없다고!\n@c0@"
  sl: "@a@b%a002000：交给俺们了！\n　　只要有俺们在，\n　　一切都没问题！\n@c0@"
  tl: "@a@b%a002000：交給俺們了！\n　　只要有俺們在，\n　　一切都沒問題！\n@c0@"
