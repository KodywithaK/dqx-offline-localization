0:
  en: "@a@b*: Ooh! Company, hmm? It's been an age since I've had callers.\n@c0@"
  ja: "@a@b＊「あら　ずいぶん　久しぶりの\n\tお客さまですこと。\n@c0@"
  ko: "@a@b*: 어머, 꽤 오랜만에\n손님이 오셨네요.\n@c0@"
  sl: "@a@b＊：啊呀，真是好久\n　　没有客人来拜访了。\n@c0@"
  tl: "@a@b＊：啊呀，真是好久\n　　沒有客人來拜訪了。\n@c0@"
1:
  en: "@a@b*: It seems you didn't expect to find me, either. Why, you don't even know who I am. Heh heh.\n@c0@"
  ja: "@a@b＊「私が　誰なのかも　わからずに\n\tやって来たようだけど……　クックッ。\n@c0@"
  ko: "@a@b*: 내가 누군지 모르고\n온 모양이군요...... 큭큭.\n@c0@"
  sl: "@a@b＊：连我是谁都不知道\n　　就敢擅自闯进来……呵呵。\n@c0@"
  tl: "@a@b＊：連我是誰都不知道\n　　就敢擅自闖進來……呵呵。\n@c0@"
2:
  en: "@a@b*: If you're curious, you might try asking a young man named Colburn about me. He lives in the village to the south-west.\n@c0@"
  ja: "@a@b＊「むこうみずな　旅人よ。\n\t南西の村の　ゴランという　若者に\n\t私のことを　聞いてごらん。\n@c0@"
  ko: "@a@b*: 무모한 여행자여.\n남서쪽 마을의 고랑이라는 젊은이에게\n내 이야기를 해 보세요.\n@c0@"
  sl: "@a@b＊：莽撞的旅行者啊，去西南边的\n　　村庄里找一个叫戈兰的年轻男人\n　　打听一下我的事情吧。\n@c0@"
  tl: "@a@b＊：莽撞的旅行者啊，去西南邊的\n　　村莊裡找一個叫戈蘭的年輕男人\n　　打聽一下我的事情吧。\n@c0@"
3:
  en: "@a@b*: I'm quite certain he'll tell you everything you need to know. Heh heh...\n@c0@"
  ja: "@a@b＊「きっと　教えてくれるでしょうよ。\n\tクックックッ……。\n@c0@"
  ko: "@a@b*: 잘~ 알려 줄 거예요.\n큭큭큭......\n@c0@"
  sl: "@a@b＊：他一定会告诉你们的吧。\n　　呵呵呵……\n@c0@"
  tl: "@a@b＊：他一定會告訴你們的吧。\n　　呵呵呵……\n@c0@"
4:
  en: "@a@b*: Heh. I knew I'd see you again. That Colburn boy must've fed you quite the tale about me, hmm?\n@c0@"
  ja: "@a@b＊「やっぱり　また　来ましたね。\n\tゴランから　私のことを\n\t聞いたでしょう？\n@c0@"
  ko: "@a@b*: 역시 또 오셨군요.\n고랑에게 제 이야기\n들었겠죠?\n@c0@"
  sl: "@a@b＊：你们果然又来了呢。\n　　从戈兰那里听说了我的事了吗？\n@c0@"
  tl: "@a@b＊：你們果然又來了呢。\n　　從戈蘭那裡聽說了我的事了嗎？\n@c0@"
5:
  en: "@a@b*: ...What? Colburn's an old man...?\n@c0@"
  ja: "@a@b＊「……えっ？\n\tゴランは　若者ではなく\n\t老人だった　と……？\n@c0@"
  ko: "@a@b*: ......네?\n고랑은 젊은이가 아니고\n노인이었다고요......?\n@c0@"
  sl: "@a@b＊：……诶？\n　　戈兰不是年轻人，\n　　而是个老人……吗？\n@c0@"
  tl: "@a@b＊：……誒？\n　　戈蘭不是年輕人，\n　　而是個老人……嗎？\n@c0@"
6:
  en: "@a@b*: Of course... I forgot that you humans go through that whole horrible ‘ageing’ thing. Heh heh.\n@c0@"
  ja: "@a@b＊「そうでした。　人間は　年をとるの\n\tでしたわね。　この私としたことが\n\tうっかりしていました。　クックッ。\n@c0@"
  ko: "@a@b*: 아 그렇죠. 인간은\n나이를 먹지요. \n제가 깜빡했네요. 큭큭.\n@c0@"
  sl: "@a@b＊：对了。人类是会随着\n　　年龄增长而老去的呢。\n　　我真是太疏忽了。呵呵。\n@c0@"
  tl: "@a@b＊：對了。人類是會隨著\n　　年齡增長而老去的呢。\n　　我真是太疏忽了。呵呵。\n@c0@"
7:
  en: "@a@b*: Anyway, that's neither here nor there.\n@c0@"
  ja: "@a@b＊「まあ　そんなことは　私には\n\tどうでもよいこと……。\n@c0@"
  ko: "@a@b*: 뭐, 그런 건 저와\n아무 상관도 없지만요......\n@c0@"
  sl: "@a@b＊：哎呀，这种事情对我而言\n　　都无所谓……\n@c0@"
  tl: "@a@b＊：哎呀，這種事情對我而言\n　　都無所謂……\n@c0@"
8:
  en: "@a@b*: So tell me — what did Colburn have to say about me? Did he tell you who I am?\n@c0@"
  ja: "@a@b＊「さあ　ゴランに　聞いてきたのなら\n\tいってごらんなさい。\n\t私が　いったい　何者なのか……！\n@c0@"
  ko: "@a@b*: 고랑한테 들은 것이 있다면\n말해 보세요.\n제가 도대체 어떤 사람인지......!\n@c0@"
  sl: "@a@b＊：那么，既然从戈兰那里听说了，\n　　就说说看吧。\n　　我究竟是什么人……\n@c0@"
  tl: "@a@b＊：那麼，既然從戈蘭那裡聽說了，\n　　就說說看吧。\n　　我究竟是什麼人……\n@c0@"
9:
  en: "@a@b*: ...㈢㈢What is it? Is your mouth frozen? Tell me my true identity!\n@c0@"
  ja: "@a@b＊「……㈢㈢どうしたのです。\n\tさあ　私の　本当の姿を\n\tいってごらん！　さあ！！\n@c0@"
  ko: "@a@b*: ......㈢㈢왜 그러세요?\n저의 진짜 모습을\n말해 보세요! 어서!!\n@c0@"
  sl: "@a@b＊：……㈢㈢怎么了。\n　　快，说出我的真正身份！快！！\n@c0@"
  tl: "@a@b＊：……㈢㈢怎麼了。\n　　快，說出我的真正身份！快！！\n@c0@"
10:
  en: "@a@bBut %a000120 cannot answer.\n@c0@"
  ja: "@a@bしかし　%a000120には\n答えられなかった。\n@c0@"
  ko: "@a@b그러나 %a000120%F0120%X는%Y은%Z\n대답할 수 없었다.\n@c0@"
  sl: "@a@b但是%a000120没能回答得上来。\n@c0@"
  tl: "@a@b但是%a000120沒能回答得上來。\n@c0@"
11:
  en: "@a@b*: Wait... So you really don't have a clue about me? ...Are you telling the truth?\n@c0@"
  ja: "@a@b＊「まさか　本当に　知らないと\n\tいうのかい？\n@c0@"
  ko: "@a@b*: 설마 정말 모른다는\n건가요?\n@c0@"
  sl: "@a@b＊：难道说，你们真的不知道吗？\n@c0@"
  tl: "@a@b＊：難道說，你們真的不知道嗎？\n@c0@"
12:
  en: "@a@b*: Hmm... So Colburn managed to hold his tongue, did he...?\n@c0@"
  ja: "@a@b＊「そう……　では　あの男……\n\tゴランは　あなたたちに\n\t私のことを　いわなかったのね。\n@c0@"
  ko: "@a@b*: 그래요...... 그럼 그 남자......\n고랑은 당신들에게\n저에 대해 말하지 않았나 보군요.\n@c0@"
  sl: "@a@b＊：是吗……那么，那个男人……\n　　戈兰他没有对你们说出\n　　我的身份呢。\n@c0@"
  tl: "@a@b＊：是嗎……那麼，那個男人……\n　　戈蘭他沒有對你們說出\n　　我的身份呢。\n@c0@"
13:
  en: "@a@b*: Well, I suppose fifty years was long enough for that naughty boy to learn his lesson.\n@c0@"
  ja: "@a@b＊「思えば　あれから　５０年……。\n\tゴランも　じゅうぶん\n\t反省したようね。\n@c0@"
  ko: "@a@b*: 생각해 보면 그로부터 50년......\n고랑도 충분히\n반성한 것 같군요.\n@c0@"
  sl: "@a@b＊：仔细想想，从那以来\n　　也已经过去了５０年……\n　　戈兰也反省得差不多了呢。\n@c0@"
  tl: "@a@b＊：仔細想想，從那以來\n　　也已經過去了５０年……\n　　戈蘭也反省得差不多了呢。\n@c0@"
14:
  en: "@a@b*: ...Very well. I shall lift the curse I placed on the village. But first...\n@c0@"
  ja: "@a@b＊「……いいわ。\n\tあの村に　かけた　呪いを\n\t解いてあげましょう。　クスクス……。\n@c0@"
  ko: "@a@b*: ......좋아요.\n그 마을에 건 저주를\n풀어 드리지요. 큭큭큭......\n@c0@"
  sl: "@a@b＊：……也好。那我就将\n　　施加在那个村子的诅咒解除了吧。\n　　嘻嘻嘻……\n@c0@"
  tl: "@a@b＊：……也好。那我就將\n　　施加在那個村子的詛咒解除了吧。\n　　嘻嘻嘻……\n@c0@"
15:
  en: "@a@b*: My name is Gerda, the Snow Maiden. I am the protector of this winter wonderland.\n@c0@"
  ja: "@a@b＊「私は　雪女のユリナ。\n\tこの地方の自然を　守る者。\n@c0@"
  ko: "@a@b*: 저는 설녀 유리나.\n이 지방의 자연을 지키는 자.\n@c0@"
  sl: "@a@b＊：我是雪女友理奈。\n　　是这里的自然界守护者。\n@c0@"
  tl: "@a@b＊：我是雪女友理奈。\n　　是這裡的自然界守護者。\n@c0@"
16:
  en: "@aGerda@bYou must never tell a soul about me. Colburn broke that promise, and he suffered the consequences.\n@c0@"
  ja: "@a@bユリナ「私と　出会ったことは　絶対に\n\t他人に　もらしては　いけない……。\n\tその約束を　彼は　やぶった。\n@c0@"
  ko: "@a@b유리나: 저와 만났다는 걸 절대로\n다른 사람에게 말해서는 안 되는데......\n그 약속을 그는 어겼죠.\n@c0@"
  sl: "@a@b友理奈：我和他有过约定，\n　　绝不把见过我的事说出去……\n　　他打破了这个约定。\n@c0@"
  tl: "@a@b友理奈：我和他有過約定，\n　　絕不把見過我的事說出去……\n　　他打破了這個約定。\n@c0@"
17:
  en: "@aGerda@bAnd after all I did for him, rescuing him after he'd collapsed on the mountain...\n@c0@"
  ja: "@a@bユリナ「雪山で　倒れていたのを\n\t助けてあげたと　いうのに……！\n@c0@"
