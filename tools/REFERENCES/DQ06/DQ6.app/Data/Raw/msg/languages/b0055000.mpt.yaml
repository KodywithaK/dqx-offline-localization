0:
  en: "@aKing Poseidon@bWell met! You are welcome at the court of Poseidon, ruler of the deep.\n@c0@"
  ja: "@a@b＊「よくぞ　来た！\n\tわしは　海の王　ポセイドンじゃ。\n@c0@"
  ko: "@a@b*: 어서 오게!\n나는 바다의 왕 포세이돈이라네.\n@c0@"
  sl: "@a@b＊：欢迎你们！\n　　我是海王波塞冬。\n@c0@"
  tl: "@a@b＊：歡迎你們！\n　　我是海王波塞冬。\n@c0@"
1:
  en: "@aKing Poseidon@bI see in your rippling muscles and battle-hardened gaze that a rare power resides in you.\n@c0@"
  ja: "@a@b＊「ふむ……\n\tそなたたち　なかなか　強そうじゃの。\n@c0@"
  ko: "@a@b*: 흐음......\n그대들은 제법 강해 보이는군.\n@c0@"
  sl: "@a@b＊：嗯……\n　　你们看起来有些本事。\n@c0@"
  tl: "@a@b＊：嗯……\n　　你們看起來有些本事。\n@c0@"
2:
  en: "@aKing Poseidon@bNow hear my plea! East of here, a dark and demonic shrine has been built on the seabed.\n@c0@"
  ja: "@a@b＊「実は　ここから東の　海の底に\n\t闇の神殿なんぞを　建てた\n\t不届き者がおるのだ。\n@c0@"
  ko: "@a@b*: 실은 여기서 동쪽 바다 바닥에\n어둠의 신전이라는 걸 세운\n괘씸한 자가 있다네.\n@c0@"
  sl: "@a@b＊：我有件事要拜托你们。\n　　有个没礼貌的家伙\n　　在东边的海底建了一座暗之神殿。\n@c0@"
  tl: "@a@b＊：我有件事要拜託你們。\n　　有個沒禮貌的傢伙\n　　在東邊的海底建了一座暗之神殿。\n@c0@"
3:
  en: "@aKing Poseidon@bWithout so much as a by-your-leave, this monstrosity was constructed in my domain.\n@c0@"
  ja: "@a@b＊「このわしの　許しも得ずに\n\t海の中で　大きな顔をしおって……\n\tまことに　不愉快じゃ！\n@c0@"
  ko: "@a@b*: 이 몸의 허가도 받지 않고\n이 바닷속에서 위세를 떨치려 하다니......\n참으로 불쾌한지고!\n@c0@"
  sl: "@a@b＊：竟敢没经过我的同意，\n　　就在这海里称王称霸……\n　　实在是让人生气！\n@c0@"
  tl: "@a@b＊：竟敢沒經過我的同意，\n　　就在這海裡稱王稱霸……\n　　實在是讓人生氣！\n@c0@"
4:
  en: "@a@b*: Welcome to Poseidon's Palace!\n@c0@"
  ja: "@a@b＊「ようこそ　ポセイドン城へ！\n@c0@"
  ko: "@a@b*: 포세이돈 성에 오신 것을 환영합니다!\n@c0@"
  sl: "@a@b＊：欢迎来到波塞冬城！\n@c0@"
  tl: "@a@b＊：歡迎來到波塞冬城！\n@c0@"
5:
  en: "@a@b*: Our great king is the ruler of the deep, don't you know?\n@c0@"
  ja: "@a@b＊「わが王は　すべての海をおさめる\n\t海の帝王です。\n@c0@"
  ko: "@a@b*: 저희 폐하께서는 모든 바다를 다스리는\n바다의 제왕이십니다.\n@c0@"
  sl: "@a@b＊：波塞冬王是掌控着\n　　所有海洋的海之帝王。\n@c0@"
  tl: "@a@b＊：波塞冬王是掌控著\n　　所有海洋的海之帝王。\n@c0@"
6:
  en: "@a@b*: I can see that the depths of the ocean are not your natural habitat.\n@c0@"
  ja: "@a@b＊「あら　あなたたち\n\t海底人じゃないわね。\n@c0@"
  ko: "@a@b*: 어머, 당신들은\n해저인이 아니구나?\n@c0@"
  sl: "@a@b＊：哎呀，你们\n　　不是海底人啊。\n@c0@"
  tl: "@a@b＊：哎呀，你們\n　　不是海底人啊。\n@c0@"
7:
  en: "@a@b*: It has been many a long year since humans last came to visit us here.\n@c0@"
  ja: "@a@b＊「ふつうの人間たちが\n\tこんな所まで　やって来るなんて\n\tずいぶん　ひさしぶりね。\n@c0@"
  ko: "@a@b*: 보통 인간이\n이런 곳까지 오는 건\n정말 오랜만이야.\n@c0@"
  sl: "@a@b＊：这里已经很久\n　　都没有来过普通人了。\n@c0@"
  tl: "@a@b＊：這裡已經很久\n　　都沒有來過普通人了。\n@c0@"
8:
  en: "@a@b*: I know. You may be monsters, but it is clear from your demeanour that you associate with humans.\n@c0@"
  ja: "@a@b＊「わかってるわ。　あなた\n\t人間の仲間なんでしょ。\n@c0@"
  ko: "@a@b*: 알고 있어. 당신,\n인간의 동료지?\n@c0@"
  sl: "@a@b＊：我知道，你们是人类的伙伴。\n@c0@"
  tl: "@a@b＊：我知道，你們是人類的夥伴。\n@c0@"
9:
  en: "@a@b*: Long ago, two wise men by the names of Isaac and Benjamin ventured down here.\n@c0@"
  ja: "@a@b＊「昔　来たのは　マサールと\n\tクリムトっていう　２人の\n\t賢者だったけど……\n@c0@"
  ko: "@a@b*: 옛날에 왔던 건 마살과\n클림트라는 이름의\n두 현자였는데......\n@c0@"
  sl: "@a@b＊：很久以前，有两名贤者\n　　也曾经来过这里，\n　　名字好像叫做马萨尔和克林姆……\n@c0@"
  tl: "@a@b＊：很久以前，有兩名賢者\n　　也曾經來過這裡，\n　　名字好像叫做馬薩爾和克林姆……\n@c0@"
10:
  en: "@a@b*: I wonder what became of them...\n@c0@"
  ja: "@a@b＊「あの２人　今頃　どこで\n\tなにを　しているのかしら。\n@c0@"
  ko: "@a@b*: 그 두 사람, 지금쯤 어디서\n뭘 하고 있을까?\n@c0@"
  sl: "@a@b＊：也不知道他们两个\n　　现在过得怎么样。\n@c0@"
  tl: "@a@b＊：也不知道他們兩個\n　　現在過得怎麼樣。\n@c0@"
11:
  en: "@a@b*: This is the royal treasure vault of King Poseidon.\n@c0@"
  ja: "@a@b＊「ここは　ポセイドン王の\n\t宝物庫です。\n@c0@"
  ko: "@a@b*: 이곳은 포세이돈 왕의\n보물 창고입니다.\n@c0@"
  sl: "@a@b＊：这里是波塞冬王的宝物库。\n@c0@"
  tl: "@a@b＊：這裡是波塞冬王的寶物庫。\n@c0@"
12:
  en: "@a@b*: No loitering or littering, please!\n@c0@"
  ja: "@a@b＊「みだりに　お近付きに\n\tなりませぬように。\n@c0@"
  ko: "@a@b*: 함부로 접근하는 일이\n없으시길.\n@c0@"
  sl: "@a@b＊：请不要随意靠近。\n@c0@"
  tl: "@a@b＊：請不要隨意靠近。\n@c0@"
13:
  en: "@a@b*: This is where King Poseidon's royal treasure was kept before someone helped themselves to it.\n@c0@"
  ja: "@a@b＊「ここは　ポセイドン王の\n\t宝物庫でした。\n@c0@"
  ko: "@a@b*: 이곳은 포세이돈 왕의\n보물 창고였습니다.\n@c0@"
  sl: "@a@b＊：这里曾经是\n　　波塞冬王的宝物库。\n@c0@"
  tl: "@a@b＊：這裡曾經是\n　　波塞冬王的寶物庫。\n@c0@"
14:
  en: "@a@b*: But if it's being used in the cause of world peace, I don't think the King will have any complaints.\n@c0@"
  ja: "@a@b＊「しかし　宝が　世界の平和のために\n\t使われるのならば……\n\t王も　なにも　いいますまい。\n@c0@"
  ko: "@a@b*: 하지만 보물이 세계 평화를 위해\n쓰인다면......\n왕께서도 눈감아 주실 겁니다.\n@c0@"
  sl: "@a@b＊：如果这些宝物能够\n　　为世界带来和平的话……\n　　大王肯定也不会有意见的。\n@c0@"
  tl: "@a@b＊：如果這些寶物能夠\n　　為世界帶來和平的話……\n　　大王肯定也不會有意見的。\n@c0@"
15:
  en: "@a@b*: I wish you luck on your quest.\n@c0@"
  ja: "@a@b＊「ご活躍を　期待しています。\n@c0@"
  ko: "@a@b*: 활약을 기대하겠습니다.\n@c0@"
  sl: "@a@b＊：期待着你们的表现。\n@c0@"
  tl: "@a@b＊：期待著你們的表現。\n@c0@"
16:
  en: "@aKing Poseidon@bThe miscreant responsible is called Gracos. Defeat him and I shall share a secret with you...\n@c0@"
  ja: "@a@b＊「そやつの名は　グラコス。\n\tもし　やつを倒すことができたら\n\tいいことを　教えてやろう。\n@c0@"
  ko: "@a@b*: 그자의 이름은 그라코스.\n만일 녀석을 쓰러뜨리고 온다면\n좋은 정보를 주겠네.\n@c0@"
  sl: "@a@b＊：那家伙叫做古拉柯斯，\n　　如果你们替我打败它，\n　　我就告诉你们一些有用的事情。\n@c0@"
  tl: "@a@b＊：那傢伙叫做古拉柯斯，\n　　如果你們替我打敗它，\n　　我就告訴你們一些有用的事情。\n@c0@"
17:
  en: "@aKing Poseidon@bI await news of your defeat of Gracos!\n@c0@"
  ja: "@a@b＊「よい知らせを　待っておるぞ。\n@c0@"
  ko: "@a@b*: 좋은 소식을 기다리고 있겠네.\n@c0@"
  sl: "@a@b＊：我等着你们的好消息。\n@c0@"
  tl: "@a@b＊：我等著你們的好消息。\n@c0@"
18:
  en: "@a@b*: Do you mind? I'm trying to get some shut-eye...\n@c0@"
  ja: "@a@b＊「ブクルルルー。\n\tわしは　今　ねむいのだ。\n\t用なら　あとに……\n@c0@"
  ko: "@a@b*: 부르르르~\n나는 지금 졸리단 말이다.\n볼일이 있다면 나중에......\n@c0@"
  sl: "@a@b＊：咕噜噜噜……\n　　我现在困了，\n　　有事的话下次……\n@c0@"
  tl: "@a@b＊：咕嚕嚕嚕……\n　　我現在睏了，\n　　有事的話下次……\n@c0@"
19:
  en: "@a@b*: ...AARGH! %H0860%XA human!? What's a human%YHumans!? What are humans%Z doing skulking round my dark deep-sea domain!?\n@c0@"
  ja: "@a@b＊「げはっ！　お前　人間だな！\n\tどうして　人間どもが\n\tこの海底神殿までっ！\n@c0@"
  ko: "@a@b*: 커헉! 네놈은 인간이렷다!\n어떻게 인간 따위가\n이 해저 신전까지!\n@c0@"
  sl: "@a@b＊：可恶！你们是人类！\n　　没想到人类居然能够\n　　来到这座海底神殿！\n@c0@"
  tl: "@a@b＊：可惡！你們是人類！\n　　沒想到人類居然能夠\n　　來到這座海底神殿！\n@c0@"
20:
  en: "@a@b*: Now don't tell me! Let me guess — you're here to defeat the mighty Gracos and unbind Sorceria. Right?\n@c0@"
  ja: "@a@b＊「まさか　この海魔神グラコスさまを\n\t倒して　魔法都市カルベローナの\n\t封印を　解くつもりなのか！？\n@c0@"
  ko: "@a@b*: 설마 이 바다의 마신 그라코스 님을\n쓰러뜨리고 마법 도시 칼베로나의\n봉인을 풀 작정이냐!?\n@c0@"
  sl: "@a@b＊：你们难道是想打败我\n　　海魔神古拉柯斯大人，\n　　解开卡尔贝罗纳的封印吗？！\n@c0@"
  tl: "@a@b＊：你們難道是想打敗我\n　　海魔神古拉柯斯大人，\n　　解開卡爾貝羅納的封印嗎？！\n@c0@"
21:
  en: "@aGracos@bCome now, do you really think I'm going to let that happen?\n@c0@"
  ja: "@a@bグラコス「いかん！　それは　いかんぞ！\n@c0@"
  ko: "@a@b그라코스: 안 돼! 그건 안 될 일이다!\n@c0@"
  sl: "@a@b古拉柯斯：做梦！你们想得美！\n@c0@"
  tl: "@a@b古拉柯斯：做夢！你們想得美！\n@c0@"
22:
  en: "@aGracos@bIt's far too late, in any case. Still, if there were even the slightest possibility of—\n@c0@"
  ja: "@a@bグラコス「カルベローナを解放しても\n\t今さら　手おくれというものだが\n\t万が一　ということも　ある。\n@c0@"
  ko: "@a@b그라코스: 이제 와서 늦긴 했지만,\n칼베로나를 해방시킨다면\n만일의 사태가 벌어질지도 모르지.\n@c0@"
  sl: "@a@b古拉柯斯：你们即使解放了卡尔贝罗纳，\n　　事到如今恐怕也已经晚了。\n　　但凡事不怕一万就怕万一。\n@c0@"
  tl: "@a@b古拉柯斯：你們即使解放了卡爾貝羅納，\n　　事到如今恐怕也已經晚了。\n　　但凡事不怕一萬就怕萬一。\n@c0@"
23:
  en: "@aGracos@bNo! I can't allow that! If the mighty spell Magic Burst were to be unleashed...\n@c0@"
  ja: "@a@bグラコス「なにせ　あの魔法都市には\n\tマダンテという　すごい魔法が\n\t伝えられているからな。\n@c0@"
  ko: "@a@b그라코스: 왜냐면 그 마법 도시에는\n마단테라 불리는 엄청난 마법이\n전해진다고 하니까 말이다.\n@c0@"
  sl: "@a@b古拉柯斯：因为据说那个魔法都市\n　　曾经开发出了一种\n　　叫玛达恩特的厉害魔法。\n@c0@"
  tl: "@a@b古拉柯斯：因為據說那個魔法都市\n　　曾經開發出了一種\n　　叫瑪達恩特的厲害魔法。\n@c0@"
24:
  en: "@aGracos@bAck! It's too terrifying to contemplate! That's the whole reason Sorceria was sealed off to begin with...\n@c0@"
  ja: "@a@bグラコス「だからこそ　封印し……\n@c0@"
  ko: "@a@b그라코스: 그러니까 반드시 봉인을......\n@c0@"
  sl: "@a@b古拉柯斯：所以才会被封印……\n@c0@"
  tl: "@a@b古拉柯斯：所以才會被封印……\n@c0@"
25:
  en: "@aGracos@b...Wait! I'm doing it again! I've said too much!\n@c0@"
  ja: "@a@bグラコス「げはっ！　また悪いクセで\n\tしゃべりすぎてしまったぞ！\n@c0@"
  ko: "@a@b그라코스: 커헉! 또 나쁜 버릇이!\n말을 너무 많이 했군!\n@c0@"
  sl: "@a@b古拉柯斯：可恶！不知不觉\n　　又犯了乱说话的毛病！\n@c0@"
  tl: "@a@b古拉柯斯：可惡！不知不覺\n　　又犯了亂說話的毛病！\n@c0@"
26:
  en: "@aGracos@b...Anyway, moving swiftly on! Gracos won't be getting defeated and Sorceria is staying off-limits. Got it? Good! Now show me what you've got!\n@c0@"
  ja: "@a@bグラコス「と　とにかく！\n\t封印を解かせるわけには　いかん！\n\tさあ来い！　ブクルルルルー！\n@c0@"
  ko: "@a@b그라코스: 어, 어쨌든!\n봉인을 풀게 할 수는 없다!\n자, 덤빌 테면 덤벼라! 부르르르르~!\n@c0@"
  sl: "@a@b古拉柯斯：总、总之！\n　　决不能让你们解开封印！\n　　尝尝我的厉害！咕噜噜噜噜！\n@c0@"
  tl: "@a@b古拉柯斯：總、總之！\n　　決不能讓你們解開封印！\n　　嘗嘗我的厲害！咕嚕嚕嚕嚕！\n@c0@"
27:
  en: "@aGracos@b...You're not? Glad to hear it! It's far too late, in any case. The die is cast.\n@c0@"
  ja: "@a@bグラコス「そうだ　それがいい。\n\t今さら　そんなことをしても\n\tもはや　手おくれだからな。\n@c0@"
  ko: "@a@b그라코스: 그래, 잘 생각했다.\n이제 와서 그런 일을 해 봐야\n이미 늦었으니 말이다.\n@c0@"
  sl: "@a@b古拉柯斯：不是的话最好。\n　　不过就算你们现在打败我，\n　　恐怕也已经来不及了。\n@c0@"
  tl: "@a@b古拉柯斯：不是的話最好。\n　　不過就算你們現在打敗我，\n　　恐怕也已經來不及了。\n@c0@"
28:
  en: "@aGracos@bBut since you've come all this way, it would be a shame to send you home empty-handed...\n@c0@"
  ja: "@a@bグラコス「しかし　せっかく　ここまで\n\t来たのだ。　手ぶらで　帰るのも\n\t気がすすまぬであろう。\n@c0@"
  ko: "@a@b그라코스: 허나 기왕에 여기까지 왔는데\n맨손으로 돌아가기도\n아쉽겠지.\n@c0@"
  sl: "@a@b古拉柯斯：话说回来，\n　　你们好不容易找到这里，\n　　总不好意思就让你们这么回去。\n@c0@"
  tl: "@a@b古拉柯斯：話說回來，\n　　你們好不容易找到這裡，\n　　總不好意思就讓你們這麼回去。\n@c0@"
29:
  en: "@aGracos@bCome, witness the power of the mighty Gracos! Once I've wiped the floor with you, I can get back to my nap...\n@c0@"
  ja: "@a@bグラコス「ひとつ　このグラコスさまの\n\t腹の足しに　してやろう。\n\tブクルルルルー。\n@c0@"
  ko: "@a@b그라코스: 좋다. 이 그라코스 님의\n배를 채울 요깃거리가 되어다오.\n부르르르르~\n@c0@"
  sl: "@a@b古拉柯斯：我古拉柯斯大爷\n　　就先拿你们填填肚子吧。\n　　咕噜噜噜噜。\n@c0@"
  tl: "@a@b古拉柯斯：我古拉柯斯大爺\n　　就先拿你們填填肚子吧。\n　　咕嚕嚕嚕嚕。\n@c0@"
30:
  en: "@aGracos@b...NO! This...this is bad!\n@c0@"
  ja: "@a@bグラコス「げはっ！\n\tいかん　いかんぞ！\n@c0@"
