0:
  en: "@aIsaac@bAs you have witnessed, our power has the capacity to unleash destruction on an untold scale.\n@c0@"
  ja: "@a@bマサール「このように　わしらの\n\tチカラは　おそろしい破壊を\n\tひきおこすことが　できるのじゃ。\n@c0@"
  ko: "@a@b마살: 보았듯이 우리의\n힘은 무시무시한 파괴를\n유발하게 될지도 모른다네.\n@c0@"
  sl: "@a@b马萨尔：就像这样，\n　　我们的力量能够\n　　产生非常恐怖的破坏力。\n@c0@"
  tl: "@a@b馬薩爾：就像這樣，\n　　我們的力量能夠\n　　產生非常恐怖的破壞力。\n@c0@"
1:
  en: "@aBenjamin@bBut it seems that we caused little damage to the Archfiend's castle itself.\n@c0@"
  ja: "@a@bクリムト「しかし　大魔王の城には\n\tたいして　ダメージを\n\tあたえられなかったようだ……\n@c0@"
  ko: "@a@b클림트: 하지만 대마왕의 성에는\n그다지 큰 피해는\n주지 못한 모양이군......\n@c0@"
  sl: "@a@b克林姆：但是，对于大魔王城堡来说，\n　　却好像根本起不了什么作用……\n@c0@"
  tl: "@a@b克林姆：但是，對於大魔王城堡來說，\n　　卻好像根本起不了什麼作用……\n@c0@"
2:
  en: "@aIsaac@bIt would appear that this is the limit of our power.\n@c0@"
  ja: "@a@bマサール「わしらのチカラは\n\tここまでと　いうことじゃな。\n@c0@"
  ko: "@a@b마살: 우리 힘으로는\n여기까지가 한계인가 보군.\n@c0@"
  sl: "@a@b马萨尔：似乎我们的力量\n　　也就只能到这个程度了。\n@c0@"
  tl: "@a@b馬薩爾：似乎我們的力量\n　　也就只能到這個程度了。\n@c0@"
3:
  en: "@aBenjamin@bWe have opened up a chasm here in the Archfiend's dread realm.\n@c0@"
  ja: "@a@bクリムト「大魔王がつくった　はざまの世界に\n\tこのような　大穴をあけてやったわ。\n@c0@"
  ko: "@a@b클림트: 대마왕이 만든 틈새 세계에\n이렇게 큰 구멍을 뚫어 놓았네.\n@c0@"
  sl: "@a@b克林姆：在大魔王创造的狭隙世界里，\n　　我们开启了这样一个大洞。\n@c0@"
  tl: "@a@b克林姆：在大魔王創造的狹隙世界裡，\n　　我們開啟了這樣一個大洞。\n@c0@"
4:
  en: "@aBenjamin@bIf you leap into it, you will be able to return to our world.\n@c0@"
  ja: "@a@bクリムト「この穴に　とびこめば\n\tすぐにでも　もとの世界に\n\tもどることが　できよう。\n@c0@"
  ko: "@a@b클림트: 이 구멍에 뛰어들면\n지금 바로 원래 세계에\n돌아갈 수 있을걸세.\n@c0@"
  sl: "@a@b克林姆：跳进这个大洞的话，\n　　应该能够瞬间回到\n　　原来的世界里去。\n@c0@"
  tl: "@a@b克林姆：跳進這個大洞的話，\n　　應該能夠瞬間回到\n　　原來的世界裡去。\n@c0@"
5:
  en: "@aBenjamin@bThe two of us will stand guard here, and see that your path home is never blocked. You may use it whenever you need.\n@c0@"
  ja: "@a@bクリムト「そして　この　はざまの世界の\n\tどこからでも　ここに　もどれるよう\n\tこの穴は　われらが守っていよう。\n@c0@"
  ko: "@a@b클림트: 그리고 이 틈새 세계\n어디에서든 이곳에 돌아올 수 있도록\n이 구멍은 우리가 지키도록 하지.\n@c0@"
  sl: "@a@b克林姆：为了让你们随时都能够从\n　　狭隙世界的任何地方安全返回这里，\n　　我们会在这里守护这个大洞的。\n@c0@"
  tl: "@a@b克林姆：為了讓你們隨時都能夠從\n　　狹隙世界的任何地方安全返回這裡，\n　　我們會在這裡守護這個大洞的。\n@c0@"
6:
  en: "@aBenjamin@bThe rest is up to you, %a000120.\n@c0@"
  ja: "@a@bクリムト「あとは　たのんだぞ\n\t%a000120よっ！\n@c0@"
  ko: "@a@b클림트: 뒷일을 부탁하겠네.\n%a000120!\n@c0@"
  sl: "@a@b克林姆：接下来的事情就交给你们了，\n　　%a000120！\n@c0@"
  tl: "@a@b克林姆：接下來的事情就交給你們了，\n　　%a000120！\n@c0@"
7:
  en: "@aIsaac@bIt is time to set off, %a000120. The Archfiend's castle has been brought down to the ground.\n㈡\nYou should see it directly in front of you when you leave this place.\n@c0@"
  ja: "@a@bマサール「いくがよい　%a000120よ！\n\t大魔王の城は　今や　地に　落ちた。\n\tここを出れば　目前のはずじゃ。\n@c0@"
  ko: "@a@b마살: 가거라, %a000120!\n대마왕의 성은 이제 땅에 떨어졌어.\n여기를 나가면 바로 눈앞에 보일걸세.\n@c0@"
  sl: "@a@b马萨尔：你们去吧，%a000120！\n　　大魔王城堡现在已经落地了，\n　　只要从这里出去后，就在眼前。\n@c0@"
  tl: "@a@b馬薩爾：你們去吧，%a000120！\n　　大魔王城堡現在已經落地了，\n　　只要從這裡出去後，就在眼前。\n@c0@"
8:
  en: "@aIsaac@b%H0860%XYou and your friends%YYou%Z must combine your powers! You are all connected by a set of indissoluble bonds...\n@c0@"
  ja: "@a@bマサール「チカラを　あわせよ！\n\tおぬしたちは　ふかい　きずなで\n\t結ばれて　いるのじゃ。\n@c0@"
  ko: "@a@b마살: 힘을 합쳐야 한다!\n그대들은 강한 인연의 끈으로\n이어져 있으니.\n@c0@"
  sl: "@a@b马萨尔：团结起来吧！\n　　你们是一群\n　　有着深深羁绊的人。\n@c0@"
  tl: "@a@b馬薩爾：團結起來吧！\n　　你們是一群\n　　有著深深羈絆的人。\n@c0@"
9:
  en: "@aIsaac@bThe bond of blood... The bond of friendship... The bond of love... The bond of trust...\n@c0@"
  ja: "@a@bマサール「血のきずな……友情のきずな……\n\t愛情のきずな……信頼のきずな……\n@c0@"
  ko: "@a@b마살: 피의 인연..... 우정의 인연......\n애정의 인연..... 신뢰의 인연......\n@c0@"
  sl: "@a@b马萨尔：血脉之羁绊……友情之羁绊……\n　　爱情之羁绊……信赖之羁绊……\n@c0@"
  tl: "@a@b馬薩爾：血脈之羈絆……友情之羈絆……\n　　愛情之羈絆……信賴之羈絆……\n@c0@"
10:
  en: "@aIsaac@bThese bonds are the source of all the power that we possess.\n@c0@"
  ja: "@a@bマサール「それこそが！\n\tわしらのもつ　すべてのチカラの\n\tみなもと　なのじゃ。\n@c0@"
  ko: "@a@b마살: 그것이야말로!\n우리가 가진 모든 힘의\n근원일세.\n@c0@"
  sl: "@a@b马萨尔：这一切，\n　　正是我们所拥有的\n　　全部力量的根源所在！\n@c0@"
  tl: "@a@b馬薩爾：這一切，\n　　正是我們所擁有的\n　　全部力量的根源所在！\n@c0@"
11:
  en: "@a@b*: Hm hm hm... I have left you to your own devices for long enough.\n@c0@"
  ja: "@a@b＊「フォッ　フォッ　フォッ。\n\tだまって　あそばせておれば\n\tいい気に　なりおって……。\n@c0@"
  ko: "@a@b*: 훗훗훗.\n잠자코 내버려뒀더니\n너무 설치는구나......\n@c0@"
  sl: "@a@b＊：哼、哼、哼。\n　　一直不理你们这些鼠辈，\n　　看来你们玩得很高兴啊……\n@c0@"
  tl: "@a@b＊：哼、哼、哼。\n　　一直不理你們這些鼠輩，\n　　看來你們玩得很高興啊……\n@c0@"
12:
  en: "@a@b*: By strange coincidence, I was but this moment thinking of raining destruction down upon you from afar.\n@c0@"
  ja: "@a@b＊「そろそろ　わしのほうから\n\tお前たちを　つぶしにいこうかと\n\t思っておったところじゃ。\n@c0@"
  ko: "@a@b*: 이제 나도 슬슬\n네놈들을 해치우러 갈까\n생각하던 참이었지.\n@c0@"
  sl: "@a@b＊：我正想着差不多到了\n　　该把你们全部毁灭的时候了。\n@c0@"
  tl: "@a@b＊：我正想著差不多到了\n　　該把你們全部毀滅的時候了。\n@c0@"
13:
  en: "@a@b*: But look who has come to see me... How very considerate!\n@c0@"
  ja: "@a@b＊「それを　お前たちのほうから\n\tのこのこ　やってくるとは\n\tどこまでも　おめでたいヤツらよ。\n@c0@"
  ko: "@a@b*: 그런데 네놈들이 먼저\n알아서 찾아와 주다니\n하룻강아지 범 무서운 줄 모르는군.\n@c0@"
  sl: "@a@b＊：没想到你们竟然\n　　傻呵呵地自己送上门来了，\n　　真是一群无药可救的笨蛋们啊。\n@c0@"
  tl: "@a@b＊：沒想到你們竟然\n　　傻呵呵地自己送上門來了，\n　　真是一群無藥可救的笨蛋們啊。\n@c0@"
14:
  en: "@a@b*: I should need no introduction, but in case you were in any doubt...\n㈡\n*: I am Mortamor, Lord of Evil — he who shall soon be crowned the ruler of all creation!\n@c0@"
  ja: "@a@b＊「もはや　名のるまでも　ないだろう。\n\tわしが　全世界の主となる存在\n\tデスタムーアさまじゃ！\n@c0@"
  ko: "@a@b*: 이제 와서 이름을 밝힐 필요도 \n없겠지. 내가 이 세계의 주인 \n되는 존재 데스타무아 님이다!\n@c0@"
  sl: "@a@b＊：不需要自我介绍了吧！\n　　我就是支配全世界的存在，\n　　德斯塔穆亚大人！\n@c0@"
  tl: "@a@b＊：不需要自我介紹了吧！\n　　我就是支配全世界的存在，\n　　德斯塔穆亞大人！\n@c0@"
15:
  en: "@aMortamor@bCome, vermin! I shall personally attend to your extermination!\n@c0@"
  ja: "@a@bムーア「さあ　こい！　虫ケラども！\n@c0@"
  ko: "@a@b무아: 자, 덤벼라! 벌레 같은 놈들!\n@c0@"
  sl: "@a@b穆亚：来，放马过来吧！一群鼠辈！\n@c0@"
  tl: "@a@b穆亞：來，放馬過來吧！一群鼠輩！\n@c0@"
16:
  en: "@aMortamor@bIt is time you learnt just how powerless you really are.\n@c0@"
  ja: "@a@bムーア「お前たちが　どれほど非力で\n\t不完全なものなのかを　イヤと\n\tいうほど　思い知らせてやろうぞ！\n@c0@"
  ko: "@a@b무아: 네놈들이 얼마나 무력하고\n불완전한 존재인지\n뼈저리게 느끼게 해 주마!\n@c0@"
  sl: "@a@b穆亚：我会让你们清楚知道，\n　　你们究竟有多么无力，\n　　多么地弱小！\n@c0@"
  tl: "@a@b穆亞：我會讓你們清楚知道，\n　　你們究竟有多麼無力，\n　　多麼地弱小！\n@c0@"
17:
  en: "@aMortamor@bI, Mortamor, am the lord and master of every living creature! You will bow before my supreme power!\n@c0@"
  ja: "@a@bムーア「このデスタムーアこそが\n\t生きとし生ける者どもの\n\t王たる存在だと　いうことをなっ！\n@c0@"
  ko: "@a@b무아: 이 데스타무아야말로\n살아 있는 생물들의\n왕이라는 사실을!\n@c0@"
  sl: "@a@b穆亚：我德斯塔穆亚才正是\n　　所有活着的生物当中\n　　被誉为王的存在！\n@c0@"
  tl: "@a@b穆亞：我德斯塔穆亞才正是\n　　所有活著的生物當中\n　　被譽為王的存在！\n@c0@"
18:
  en: "@aMortamor@bHm hm hm... You have returned, I see...\n@c0@"
  ja: "@a@bムーア「フォッ　フォッ　フォッ。\n\tまた　やって来たようじゃの。\n@c0@"
  ko: "@a@b무아: 훗훗훗.\n또 온 모양이군.\n@c0@"
  sl: "@a@b穆亚：哼、哼、哼。\n　　居然还敢再来吗？\n@c0@"
  tl: "@a@b穆亞：哼、哼、哼。\n　　居然還敢再來嗎？\n@c0@"
19:
  en: "@aMortamor@bSo the bludgeoning I gave you was not sufficient to teach you the futility of resistance?\n@c0@"
  ja: "@a@bムーア「あれほどまでに\n\tうちくだかれても　まだ　おのれの\n\t非力さに　気づかぬとは……\n@c0@"
  ko: "@a@b무아: 그렇게까지\n당해 놓고 아직도 자신들의\n무력함을 깨닫지 못하다니......\n@c0@"
  sl: "@a@b穆亚：明明都已经被打成那样了，\n　　还是没有察觉到自身的无力吗……\n@c0@"
  tl: "@a@b穆亞：明明都已經被打成那樣了，\n　　還是沒有察覺到自身的無力嗎……\n@c0@"
20:
  en: "@aMortamor@b...And you have come back for another lesson. Truly you are diligent students!\n@c0@"
  ja: "@a@bムーア「どこまでも\n\tおめでたいヤツらよ。\n@c0@"
  ko: "@a@b무아: 하룻강아지\n범 무서운 줄 모르는군.\n@c0@"
  sl: "@a@b穆亚：一群无药可救的家伙们啊。\n@c0@"
  tl: "@a@b穆亞：一群無藥可救的傢伙們啊。\n@c0@"
21:
  en: "@aMortamor@bNo matter what you have experienced, no matter how much you have trained — you are still mere vermin!\n@c0@"
  ja: "@a@bムーア「いかに　経験をつみ\n\t修行を　しようとも　お前たちなど\n\tしょせん　虫ケラに　すぎぬ。\n@c0@"
  ko: "@a@b무아: 아무리 경험을 쌓든\n수행을 거듭하든 네놈들 따윈\n어차피 한낱 벌레일 뿐.\n@c0@"
  sl: "@a@b穆亚：不管你们如何积累经验，\n　　经历再多的修行，你们\n　　也只不过是一群鼠辈而已。\n@c0@"
  tl: "@a@b穆亞：不管你們如何積累經驗，\n　　經歷再多的修行，你們\n　　也只不過是一群鼠輩而已。\n@c0@"
22:
  en: "@aMortamor@bFortunately for you, I am more than happy to repeat this lesson until you have taken its message to heart.\n@c0@"
  ja: "@a@bムーア「よかろう。\n\tそれが　わかるまで　何度でも\n\t思い知らせてやろうぞ！\n@c0@"
  ko: "@a@b무아: 그래 좋다.\n네놈들이 그 사실을 인정할 때까지\n몇 번이고 본때를 보여주마!\n@c0@"
  sl: "@a@b穆亚：好吧。\n　　不管来多少次，我会奉陪到\n　　你们彻底明白了为止！\n@c0@"
  tl: "@a@b穆亞：好吧。\n　　不管來多少次，我會奉陪到\n　　你們徹底明白了為止！\n@c0@"
