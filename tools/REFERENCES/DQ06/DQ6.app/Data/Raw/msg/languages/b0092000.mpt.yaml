24:
  en: "@a@bSuddenly, a terrible voice speaks out...\n@c0@"
  ja: "@a@bどこからともなく\nおぞましいこえが　きこえる……\n@c0@"
  ko: "@a@b어디선가\n섬뜩한 목소리가 들린다......\n@c0@"
  sl: "@a@b不知道从哪里传来了\n让人浑身不舒服的声音……\n@c0@"
  tl: "@a@b不知道從哪裡傳來了\n讓人渾身不舒服的聲音……\n@c0@"
25:
  en: "@a@bForgive me... That decrepit form was no way to present myself to you, my honoured guests.\n@c0@"
  ja: "@a@bやはり　じじいの　すがたでは\nしつれいだったようだな……\n@c0@"
  ko: "@a@b역시 늙은이의 모습으로는\n실례였나 보군......\n@c0@"
  sl: "@a@b这副老头子的姿态\n果然是有些小瞧你们了啊……\n@c0@"
  tl: "@a@b這副老頭子的姿態\n果然是有些小瞧你們了啊……\n@c0@"
26:
  en: "@a@bPerhaps this will be more to your liking...\n@c0@"
  ja: "@a@bでは　これなら　どうかな？\n@c0@"
  ko: "@a@b그럼 이건 어떠냐?\n@c0@"
  sl: "@a@b那么，这样一来如何呢？\n@c0@"
  tl: "@a@b那麼，這樣一來如何呢？\n@c0@"
27:
  en: "@a@bMortamor reveals his true form!\n@c0@"
  ja: "@a@bデスタムーアが　しょうたいを　あらわした！！\n@c0@"
  ko: "@a@b데스타무아가 정체를 드러냈다!!\n@c0@"
  sl: "@a@b德斯塔穆亚的本体出现了！！\n@c0@"
  tl: "@a@b德斯塔穆亞的本體出現了！！\n@c0@"
28:
  en: "@a@bGrah hah hah! I have toyed with you long enough!\n@c0@"
  ja: "@a@bわっはっはっはっ！　おろかものめ！\nおあそびは　ここまでと　しよう！\n@c0@"
  ko: "@a@b와하하하하! 어리석은 놈들!\n장난은 여기서 끝내기로 하지!\n@c0@"
  sl: "@a@b哇哈哈哈哈！一群笨蛋！\n小打小闹就到此为止了！\n@c0@"
  tl: "@a@b哇哈哈哈哈！一群笨蛋！\n小打小鬧就到此為止了！\n@c0@"
29:
  en: "@a@bThis time I will tear you limb from limb and feast on your very flesh! Grah hah hah!\n@c0@"
