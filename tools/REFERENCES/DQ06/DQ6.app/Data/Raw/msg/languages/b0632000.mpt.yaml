  ja: "@a@b%a002070「プルプル　ププルッ！\n@c0@"
  ko: "@a@b%a002070: 뽀용뽀용 뽀뽀용!\n@c0@"
  sl: "@a@b%a002070：噗噜噗噜，噗噗噜！\n@c0@"
  tl: "@a@b%a002070：噗嚕噗嚕，噗噗嚕！\n@c0@"
102:
  en: "@a%0%a002000@bWell, we're here! Let's get Benjamin over to his brother!\n@c0@"
  ja: "@a@b%a002000「よーし　ここだ。\n\t賢者クリムトを　大賢者マサールの\n\tところへ　つれて行くぞ！\n@c0@"
  ko: "@a@b%a002000: 좋아, 여기다.\n현자 클림트를 대현자 마살이\n있는 곳으로 데리고 가자!\n@c0@"
  sl: "@a@b%a002000：好嘞，就是这里。\n　　把贤者克林姆\n　　带去大贤者马萨尔那里吧！\n@c0@"
  tl: "@a@b%a002000：好嘞，就是這裡。\n　　把賢者克林姆\n　　帶去大賢者馬薩爾那裡吧！\n@c0@"
103:
  en: "@a%0%a002010@bFinally, we made it!\n@c0@"
  ja: "@a@b%a002010「さあ　いよいよね！\n@c0@"
  ko: "@a@b%a002010: 자, 드디어 때가 왔어!\n@c0@"
  sl: "@a@b%a002010：终于到了呢！\n@c0@"
  tl: "@a@b%a002010：終於到了呢！\n@c0@"
104:
  en: "@a%0%a002020@bHow long have these two brothers been separated from each other, do you think?\n@c0@"
  ja: "@a@b%a002020「いったい　どのくらい\n\t兄弟が　はなれ　ばなれに\n\tなっていたんだろうね。\n@c0@"
  ko: "@a@b%a002020: 도대체 얼마나\n오랫동안 형제가 떨어져\n지냈을까?\n@c0@"
  sl: "@a@b%a002020：这兄弟俩到底\n　　分别了多久了呢。\n@c0@"
  tl: "@a@b%a002020：這兄弟倆到底\n　　分別了多久了呢。\n@c0@"
105:
  en: "@a%0%a002030@bWe have arrived at last. Without further ado, let's make our way inside.\n@c0@"
  ja: "@a@b%a002030「つきましたね！\n\tさあ　奥に　進みましょう！\n@c0@"
  ko: "@a@b%a002030: 도착했습니다!\n자, 안쪽으로 들어가시죠!\n@c0@"
  sl: "@a@b%a002030：到了呢！\n　　那么，继续向深处前进！\n@c0@"
  tl: "@a@b%a002030：到了呢！\n　　那麼，繼續向深處前進！\n@c0@"
106:
  en: "@a%0%a002050@bIf old Benjamin can't unravel the mystery of that vision, then no one can.\n@c0@"
  ja: "@a@b%a002050「クリムトさまの　チカラで\n\tあの　不思議な　夢のナゾも\n\tとけると　よいのですが。\n@c0@"
  ko: "@a@b%a002050: 클림트 님의 힘으로\n그 신기한 꿈의 비밀도\n풀리면 좋겠군요.\n@c0@"
  sl: "@a@b%a002050：如果克林姆大人的力量\n　　能够解开那个奇特的梦境之谜\n　　就好了呢。\n@c0@"
  tl: "@a@b%a002050：如果克林姆大人的力量\n　　能夠解開那個奇特的夢境之謎\n　　就好了呢。\n@c0@"
107:
  en: "@a%0%a002040@bI just hope we hit on a way to rescue Isaac.\n@c0@"
  ja: "@a@b%a002040「大賢者を　助ける方法が\n\tなにか　見つかると　いいな！\n@c0@"
  ko: "@a@b%a002040: 대현자를 구하는 방법을\n찾을 수 있으면 좋겠군!\n@c0@"
  sl: "@a@b%a002040：最好能找到什么方法\n　　来救助大贤者！\n@c0@"
  tl: "@a@b%a002040：最好能找到什麼方法\n　　來救助大賢者！\n@c0@"
108:
  en: "@a%0%a002060@b(snarl) Benjamin...arrived safely... (slobber)\n@c0@"
  ja: "@a@b%a002060「クリムト…つれて……きた。\n@c0@"
  ko: "@a@b%a002060: 클림트...데려...왔다.\n@c0@"
  sl: "@a@b%a002060：带克林姆……过来了……\n@c0@"
  tl: "@a@b%a002060：帶克林姆……過來了……\n@c0@"
109:
  en: "@a%0%a002070@bBoing. Boing boing.\n@c0@"
  ja: "@a@b%a002070「ピピル　ププル　プーッ！\n@c0@"
  ko: "@a@b%a002070: 삐삐르 뽀뽀르 뽀~!\n@c0@"
  sl: "@a@b%a002070：哔哔噜，噗噗噜，噗！\n@c0@"
  tl: "@a@b%a002070：嗶嗶嚕，噗噗嚕，噗！\n@c0@"
110:
  en: "@a%0%a002000@bThey're both still fightin' inside the Supreme Sage's mind, aye?\n@c0@"
  ja: "@a@b%a002000「ふたりは　まだ\n\t大賢者マサールの　心の中で\n\t戦って　いるはず！\n@c0@"
  ko: "@a@b%a002000: 두 사람은 아직\n대현자 마살의 마음 속에서\n싸우고 있을 거야!\n@c0@"
  sl: "@a@b%a002000：两人应该还在\n　　大贤者马萨尔的内心中战斗着！\n@c0@"
  tl: "@a@b%a002000：兩人應該還在\n　　大賢者馬薩爾的內心中戰鬥著！\n@c0@"
111:
  en: "@a%0%a002000@bThey deserve to return to their world... Let's make it happen!\n@c0@"
  ja: "@a@b%a002000「こんどこそ　オレたちの\n\t手で　ふたりを　あの世界から\n\t取りもどそうぜ！\n@c0@"
  ko: "@a@b%a002000: 이번엔 반드시 우리 손으로\n두 사람을 저 세계에서\n되찾아오겠어!\n@c0@"
  sl: "@a@b%a002000：这次一定要由俺们亲手\n　　将他们两人从那个世界中救出来！\n@c0@"
  tl: "@a@b%a002000：這次一定要由俺們親手\n　　將他們兩人從那個世界中救出來！\n@c0@"
112:
  en: "@a%0%a002010@bLet's do this, %a000090 — before their souls give out!\n@c0@"
  ja: "@a@b%a002010「いそぎましょう！\n\tおふたりの　心が\n\tチカラ　つきる　前に！\n@c0@"
  ko: "@a@b%a002010: 서두르자!\n두 사람의 마음이\n힘이 다하기 전에!\n@c0@"
  sl: "@a@b%a002010：走吧！\n　　在他们两位的心力耗尽之前！\n@c0@"
  tl: "@a@b%a002010：走吧！\n　　在他們兩位的心力耗盡之前！\n@c0@"
113:
  en: "@a%0%a002020@bThis is it, people! Give it all you've got!\n@c0@"
  ja: "@a@b%a002020「次は　もう\n\tないつもりで　がんばろうね！\n@c0@"
  ko: "@a@b%a002020: 다음 기회는\n없다고 생각하고 힘내자고!\n@c0@"
  sl: "@a@b%a002020：这次一定要成功！\n　　加油哦！\n@c0@"
  tl: "@a@b%a002020：這次一定要成功！\n　　加油哦！\n@c0@"
114:
  en: "@a%0%a002030@bWe must save the sages — we haven't a moment to spare!\n@c0@"
  ja: "@a@b%a002030「いっこくも　はやく\n\tおふたりを　お助け　しなくては！\n@c0@"
  ko: "@a@b%a002030: 한시라도 빨리\n두 분을 구해내야 합니다!\n@c0@"
  sl: "@a@b%a002030：必须尽快救出\n　　两位贤者才行！\n@c0@"
  tl: "@a@b%a002030：必須儘快救出\n　　兩位賢者才行！\n@c0@"
115:
  en: "@a%0%a002050@bNothin' for it but to head into that funny zone between the two 'em! Last one in's a rotten egg!\n@c0@"
  ja: "@a@b%a002050「この　おふたりの\n\t間にある　あやしい空間に\n\t飛びこんでみましょう！\n@c0@"
  ko: "@a@b%a002050: 이 두 분 사이에 있는\n수상한 공간에\n뛰어들어 봅시다!\n@c0@"
  sl: "@a@b%a002050：跳进他们两人之间的\n　　可疑空间看看吧！\n@c0@"
  tl: "@a@b%a002050：跳進他們兩人之間的\n　　可疑空間看看吧！\n@c0@"
116:
  en: "@a%0%a002040@bLet's go, %a000090.\n@c0@"
  ja: "@a@b%a002040「行くぞ　%a000090！\n@c0@"
  ko: "@a@b%a002040: 가자, %a000090!\n@c0@"
  sl: "@a@b%a002040：走，%a000090！\n@c0@"
  tl: "@a@b%a002040：走，%a000090！\n@c0@"
117:
  en: "@a%0%a002060@b(snarl) Battle for...Supreme Sage's soul...continues... (spit)\n@c0@"
  ja: "@a@b%a002060「大賢者…心の…戦い…\n\t続いて…いるのだな……。\n@c0@"
  ko: "@a@b%a002060: 대현자...마음의 싸움...\n계속되고...있구나......\n@c0@"
  sl: "@a@b%a002060：大贤者……心灵……\n　　的战斗……仍在……继续吗……\n@c0@"
  tl: "@a@b%a002060：大賢者……心靈……\n　　的戰鬥……仍在……繼續嗎……\n@c0@"
118:
  en: "@a%0%a002070@bBoing! Boing! B-Boing!\n@c0@"
  ja: "@a@b%a002070「プルプルプルプルーッ！\n@c0@"
  ko: "@a@b%a002070: 뽀용뽀용뽀용~!\n@c0@"
  sl: "@a@b%a002070：噗噜噗噜噗噜噗噜！\n@c0@"
  tl: "@a@b%a002070：噗嚕噗嚕噗嚕噗嚕！\n@c0@"
119:
  en: "@a%0%a002000@bThe two sages, together again! Ain't that a sight!?\n@c0@"
  ja: "@a@b%a002000「おお！\n\tふたりが　ならんだぜ。\n\t何か　かんげきだな！\n@c0@"
  ko: "@a@b%a002000: 오오!\n두 명이 나란히 서 있어.\n왠지 감격스럽군!\n@c0@"
  sl: "@a@b%a002000：哦哦！\n　　两人站在一起了啊。\n　　总觉得有些感动！\n@c0@"
  tl: "@a@b%a002000：哦哦！\n　　兩人站在一起了啊。\n　　總覺得有些感動！\n@c0@"
120:
  en: "@a%0%a002010@bRight, let's go and talk to the sages.\n@c0@"
  ja: "@a@b%a002010「さあ　おふたりから\n\tお話を　うかがいましょう。\n@c0@"
  ko: "@a@b%a002010: 자, 두 사람한테\n이야기를 들어 보자.\n@c0@"
  sl: "@a@b%a002010：那么，就来听听两位\n　　是怎么说的吧。\n@c0@"
  tl: "@a@b%a002010：那麼，就來聽聽兩位\n　　是怎麼說的吧。\n@c0@"
121:
  en: "@a%0%a002020@bWow! It's like I'm seeing double!\n@c0@"
  ja: "@a@b%a002020「見わけが\n\tつかないくらい　そっくりだねー！\n@c0@"
  ko: "@a@b%a002020: 못 알아 볼 정도로\n꼭 닮았네~!\n@c0@"
  sl: "@a@b%a002020：长得一模一样，\n　　根本分不出来谁是谁啊！\n@c0@"
  tl: "@a@b%a002020：長得一模一樣，\n　　根本分不出來誰是誰啊！\n@c0@"
122:
  en: "@a%0%a002030@bThe two sages are more hale and hearty than I'd dared to hope.\n@c0@"
  ja: "@a@b%a002030「おふたりとも\n\t思ったより　お元気のようです！\n@c0@"
  ko: "@a@b%a002030: 두 분 모두\n생각보다 건강하신 모양입니다!\n@c0@"
  sl: "@a@b%a002030：两位看起来\n　　似乎比想象中精神！\n@c0@"
  tl: "@a@b%a002030：兩位看起來\n　　似乎比想像中精神！\n@c0@"
123:
  en: "@a%0%a002050@bSo let me get this straight — that's Benjamin on the right...erm...or was it the left...?\n@c0@"
  ja: "@a@b%a002050「あれれ……？\n\tえっと　右が　クリムトさま？\n\tそれとも　左が　えーと……。\n@c0@"
  ko: "@a@b%a002050: 엥......?\n으음... 오른쪽이 클림트 님?\n아니면 왼쪽? 으으음......\n@c0@"
  sl: "@a@b%a002050：哎呀呀……\n　　那个，右边的是克林姆大人？\n　　还是左边的？呃……\n@c0@"
  tl: "@a@b%a002050：哎呀呀……\n　　那個，右邊的是克林姆大人？\n　　還是左邊的？呃……\n@c0@"
124:
  en: "@a%0%a002040@bIt seems they're waiting for us, %a000090.\n@c0@"
  ja: "@a@b%a002040「オレたちを\n\t待ってるようだぜ　%a000090。\n@c0@"
  ko: "@a@b%a002040: 우리를\n기다리고 있어, %a000090.\n@c0@"
  sl: "@a@b%a002040：似乎在等着我们呢，\n　　%a000090。\n@c0@"
  tl: "@a@b%a002040：似乎在等著我們呢，\n　　%a000090。\n@c0@"
125:
  en: "@a%0%a002060@b(snarl) Sages...look like twins... (spit)\n@c0@"
  ja: "@a@b%a002060「ふたごの…ようだ…な。\n@c0@"
  ko: "@a@b%a002060: 쌍둥이...같다......\n@c0@"
  sl: "@a@b%a002060：像……双胞胎……一样。\n@c0@"
  tl: "@a@b%a002060：像……雙胞胎……一樣。\n@c0@"
126:
  en: "@a%0%a002070@bBoing boing! Boing?\n@c0@"
  ja: "@a@b%a002070「プププ　プールプ！\n@c0@"
  ko: "@a@b%a002070: 뽀뽀뽀 뽀~요용!\n@c0@"
  sl: "@a@b%a002070：噗噗噗，噗噜噗！\n@c0@"
  tl: "@a@b%a002070：噗噗噗，噗嚕噗！\n@c0@"
127:
  en: "@a%0%a002000@bIt hardly seems like we're worthy of these fellas' gratitude, aye?\n@c0@"
  ja: "@a@b%a002000「あらためて\n\t礼なんて　いわれると\n\tてれちまうな。\n@c0@"
  ko: "@a@b%a002000: 새삼스럽게\n고맙다는 소릴 들으면\n조금 쑥스러운데.\n@c0@"
  sl: "@a@b%a002000：这么郑重其事的道谢，\n　　搞得俺都不好意思了。\n@c0@"
  tl: "@a@b%a002000：這麼鄭重其事的道謝，\n　　搞得俺都不好意思了。\n@c0@"
128:
  en: "@a%0%a002010@bI must admit, I was terribly worried when we first met the sages...\n@c0@"
  ja: "@a@b%a002010「最初に　お会いしたときは\n\tおふたりとも　どうなるかと\n\t思ったけれど……\n@c0@"
  ko: "@a@b%a002010: 처음 만났을 때는\n두 사람이 어떻게 될 지\n걱정했는데......\n@c0@"
  sl: "@a@b%a002010：一开始遇见两位时，\n　　我还担心两位会有什么不测……\n@c0@"
  tl: "@a@b%a002010：一開始遇見兩位時，\n　　我還擔心兩位會有什麼不測……\n@c0@"
129:
  en: "@a%0%a002010@bIt's such a relief to see them alive and well like this.\n@c0@"
  ja: "@a@b%a002010「こうして　元気に\n\tしていらっしゃるのを　見ると\n\tすこし　安心ね。\n@c0@"
  ko: "@a@b%a002010: 이렇게\n건강한 걸 보니\n조금은 안심이야.\n@c0@"
  sl: "@a@b%a002010：现在看到两位这么精神，\n　　我就放心了。\n@c0@"
  tl: "@a@b%a002010：現在看到兩位這麼精神，\n　　我就放心了。\n@c0@"
130:
  en: "@a%0%a002020@bIsaac and Benjamin are a lot more than just a couple of brothers, right?\n@c0@"
  ja: "@a@b%a002020「ふたりは　単に\n\t仲がいいって　いうだけの\n\t関係じゃ　ないみたいね。\n@c0@"
  ko: "@a@b%a002020: 두 사람은 단순히\n사이가 좋은 것만은\n아닌 모양이야.\n@c0@"
  sl: "@a@b%a002020：看来两个人\n　　不只是关系亲密而已呢。\n@c0@"
  tl: "@a@b%a002020：看來兩個人\n　　不只是關係親密而已呢。\n@c0@"
131:
  en: "@a%0%a002020@bI mean, when those two team up...wow! Such power!\n@c0@"
  ja: "@a@b%a002020「ふたり　いっしょだと\n\tすごい　チカラを　はっきできる…\n\tそんな　感じだわね。\n@c0@"
  ko: "@a@b%a002020: 두 사람이 함께 있으면\n굉장한 힘을 발휘할 수 있을 거란...\n그런 느낌이 들어.\n@c0@"
  sl: "@a@b%a002020：当两人在一起时\n　　能够发挥出强大的力量……\n　　人家有这样的感觉。\n@c0@"
  tl: "@a@b%a002020：當兩人在一起時\n　　能夠發揮出強大的力量……\n　　人家有這樣的感覺。\n@c0@"
132:
  en: "@a%0%a002030@bThe more one looks, the more striking the sages' resemblance becomes.\n@c0@"
  ja: "@a@b%a002030「しかし　見れば　見るほど\n\tおふたりは　そっくりですね。\n@c0@"
  ko: "@a@b%a002030: 그나저나 보면 볼수록\n두 분은 정말 많이 닮았군요.\n@c0@"
  sl: "@a@b%a002030：不过这两位真是\n　　越看越像呢。\n@c0@"
  tl: "@a@b%a002030：不過這兩位真是\n　　越看越像呢。\n@c0@"
133:
  en: "@a%0%a002030@bI imagine their parents often mistook them for each other when they were children.\n@c0@"
  ja: "@a@b%a002030「小さいころは　ご両親も\n\tおふたりのこと　まちがえたんじゃ\n\tないでしょうか……。\n@c0@"
  ko: "@a@b%a002030: 어렸을 때는 부모님도\n두 분을 헷갈리시지\n않았을까요......?\n@c0@"
  sl: "@a@b%a002030：小时候应该\n　　没少被父母搞错吧……\n@c0@"
  tl: "@a@b%a002030：小時候應該\n　　沒少被父母搞錯吧……\n@c0@"
134:
  en: "@a%0%a002050@bSo that one's Benjamin, which would make that one...erm... Isaac!\n@c0@"
  ja: "@a@b%a002050「こちらが　クリムトさま\n\tでしたか！　では　そちらが\n\tマサールさま　ですね！\n@c0@"
  ko: "@a@b%a002050: 이쪽이 클림트 님\n이었군요! 그럼 저쪽이\n마살 님이고요!\n@c0@"
  sl: "@a@b%a002050：这边的是克林姆大人吗！\n　　那么那边那位就是\n　　马萨尔大人了吧！\n@c0@"
