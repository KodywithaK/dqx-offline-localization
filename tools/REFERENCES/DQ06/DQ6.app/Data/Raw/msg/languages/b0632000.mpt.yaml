  tl: "@a@b%a002020：要是發現了的話，\n　　不要客氣，儘管告訴人家哦，\n　　%a000090。\n@c0@"
203:
  en: "@a%0%a002030@bNavigating the Archfiend's castle was never likely to be straightforward.\n@c0@"
  ja: "@a@b%a002030「さすが　大魔王の城。\n\tひとすじなわでは　いけそうに\n\tありませんね。\n@c0@"
  ko: "@a@b%a002030: 과연 대마왕의 성.\n예사로운 방법으로는\n통하지 않을 것 같군요.\n@c0@"
  sl: "@a@b%a002030：真不愧是大魔王城堡。\n　　用普通的手段似乎是行不通的呢。\n@c0@"
  tl: "@a@b%a002030：真不愧是大魔王城堡。\n　　用普通的手段似乎是行不通的呢。\n@c0@"
204:
  en: "@a%0%a002030@bIf we focus our attention solely on the floor, monsters may take us unawares.\n@c0@"
  ja: "@a@b%a002030「床にばかり　気を\n\tとられていると　まものに\n\tつけこまれます。　気をつけて！\n@c0@"
  ko: "@a@b%a002030: 바닥에만 신경을\n쓰다 보면 마물에게\n공격당할 수 있습니다. 조심하세요!\n@c0@"
  sl: "@a@b%a002030：过于在意地板的话，\n　　就会被魔物趁虚而入。小心点！\n@c0@"
  tl: "@a@b%a002030：過於在意地板的話，\n　　就會被魔物趁虛而入。小心點！\n@c0@"
205:
  en: "@a%0%a002050@bD'you reckon the Archfiend's goin' to pop out and thank us for comin'?\n@c0@"
  ja: "@a@b%a002050「このへん　歩いていて\n\tうしろから　大魔王が　こんにちは\n\tとか　ないですかね。\n@c0@"
  ko: "@a@b%a002050: 근처를 그냥 돌아다니다 보면\n뒤에서 대마왕이 나타나서\n인사를 해주진 않을까요?\n@c0@"
  sl: "@a@b%a002050：走着走着，大魔王突然\n　　出现在背后打招呼说“你好！”\n　　……这种情况不会出现吧。\n@c0@"
  tl: "@a@b%a002050：走著走著，大魔王突然\n　　出現在背後打招呼說“你好！”\n　　……這種情況不會出現吧。\n@c0@"
206:
  en: "@a%0%a002050@bIt'd be nice if someone had thought of buildin' an express elevator to the Archfiend's chamber.\n@c0@"
  ja: "@a@b%a002050「どうせなら　大魔王の部屋\n\t直通エレベーター　とかを\n\t作ってくれていれば　いいのに……。\n@c0@"
  ko: "@a@b%a002050: 이왕이면 대마왕의 방으로\n가는 직통 승강기라도\n만들어 놓았으면 좋았을 텐데......\n@c0@"
  sl: "@a@b%a002050：反正总得见面，还不如\n　　直接做一台直通大魔王房间的\n　　升降机之类的多好……\n@c0@"
  tl: "@a@b%a002050：反正總得見面，還不如\n　　直接做一臺直通大魔王房間的\n　　升降機之類的多好……\n@c0@"
207:
  en: "@a%0%a002040@b%0%a000090, I'm impressed. Your tactics in the last battle were as sharp as your technique.\n@c0@"
  ja: "@a@b%a002040「%a000090。\n\tさっきの　作戦と　こうげき\n\tけっこう　よかったぜ。\n@c0@"
  ko: "@a@b%a002040: %a000090.\n아까 그 작전과 공격\n꽤 훌륭했어.\n@c0@"
  sl: "@a@b%a002040：%a000090。\n　　刚才的作战和攻击，干得不错。\n@c0@"
  tl: "@a@b%a002040：%a000090。\n　　剛才的作戰和攻擊，幹得不錯。\n@c0@"
208:
  en: "@a%0%a002040@bWe're getting into the swing of this.\n@c0@"
  ja: "@a@b%a002040「だいぶ　ちょうしが\n\t出てきたんじゃ　ないか？\n@c0@"
  ko: "@a@b%a002040: 이제야 실력 발휘가\n조금 되는가 보군.\n@c0@"
  sl: "@a@b%a002040：你也差不多\n　　进入最佳状态了嘛。\n@c0@"
  tl: "@a@b%a002040：你也差不多\n　　進入最佳狀態了嘛。\n@c0@"
209:
  en: "@a%0%a002060@b(snarl) Long road ahead... (spit)\n@c0@"
  ja: "@a@b%a002060「まだまだ…先は……\n\t長そうだな……。\n@c0@"
  ko: "@a@b%a002060: 아직...갈 길이...\n먼 것...같다......\n@c0@"
  sl: "@a@b%a002060：之后的路……似乎……\n　　还很长……\n@c0@"
  tl: "@a@b%a002060：之後的路……似乎……\n　　還很長……\n@c0@"
210:
  en: "@a%0%a002060@b(snarl) Many powerful enemies here... (spit)\n@c0@"
  ja: "@a@b%a002060「ここ…強い敵…たくさん。\n@c0@"
  ko: "@a@b%a002060: 여기...강한 적...많다.\n@c0@"
  sl: "@a@b%a002060：这里……强敌……众多。\n@c0@"
  tl: "@a@b%a002060：這裡……強敵……眾多。\n@c0@"
211:
  en: "@a%0%a002070@bBoing! Boi-oing!\n@c0@"
  ja: "@a@b%a002070「プルプルルルーッ！\n@c0@"
  ko: "@a@b%a002070: 뽀용 뽀요요용~!\n@c0@"
  sl: "@a@b%a002070：噗噜噗噜噜噜！\n@c0@"
  tl: "@a@b%a002070：噗嚕噗嚕嚕嚕！\n@c0@"
212:
  en: "@a%0%a002070@bBoi-oing!\n@c0@"
  ja: "@a@b%a002070「プルルン　ルン！\n@c0@"
  ko: "@a@b%a002070: 뽀르르 뽀르!\n@c0@"
  sl: "@a@b%a002070：噗噜噜～噜！\n@c0@"
  tl: "@a@b%a002070：噗嚕嚕～嚕！\n@c0@"
213:
  en: "@a%0%a002000@bHmm... How're we gonna reach the north side, aye?\n@c0@"
  ja: "@a@b%a002000「うーむ……。\n\tこの部屋の　北側に　進むには\n\tどうしたら　いいんだ？\n@c0@"
  ko: "@a@b%a002000: 흐음......\n이 방의 북쪽으로 가려면\n어떻게 해야 하지?\n@c0@"
  sl: "@a@b%a002000：唔嗯……\n　　要怎样才能到这间屋子的北面？\n@c0@"
  tl: "@a@b%a002000：唔嗯……\n　　要怎樣才能到這間屋子的北面？\n@c0@"
214:
  en: "@a%0%a002010@bThat switch in the ground... To step or not to step, that is the question...\n@c0@"
  ja: "@a@b%a002010「丸い　スイッチは\n\tふんだほうが　いいのかしら\n\tふまないほうが　いいのかしら？\n@c0@"
  ko: "@a@b%a002010: 둥근 스위치는\n밟는 게 좋을까?\n밟지 않는 게 좋을까?\n@c0@"
  sl: "@a@b%a002010：这个圆形的开关，\n　　是应该踩下去呢，\n　　还是不该踩下去呢？\n@c0@"
  tl: "@a@b%a002010：這個圓形的開關，\n　　是應該踩下去呢，\n　　還是不該踩下去呢？\n@c0@"
215:
  en: "@a%0%a002020@bThis floor is giving me a headache.\n@c0@"
  ja: "@a@b%a002020「この　床の\n\tもようを　じーっと　見てると\n\t目が　まわりそうだね。\n@c0@"
  ko: "@a@b%a002020: 이 바닥의\n무늬를 계속 봤더니\n눈이 빙글빙글 돌 것 같아.\n@c0@"
  sl: "@a@b%a002020：一直盯着地板上的图案看，\n　　会觉得头晕目眩呢。\n@c0@"
  tl: "@a@b%a002020：一直盯著地板上的圖案看，\n　　會覺得頭暈目眩呢。\n@c0@"
216:
  en: "@a%0%a002030@bThis floor was plainly created with the intention of hindering intruders' progress.\n@c0@"
  ja: "@a@b%a002030「この　床は\n\t先へ　進もうと　する者を\n\tはばむために　あるのでしょうか。\n@c0@"
  ko: "@a@b%a002030: 이 바닥은\n앞으로 가려는 사람을\n방해하기 위한 걸까요?\n@c0@"
  sl: "@a@b%a002030：这块地板之所以在这里，\n　　就是为了阻挡\n　　想要通过这里的人们吧。\n@c0@"
  tl: "@a@b%a002030：這塊地板之所以在這裡，\n　　就是為了阻擋\n　　想要通過這裡的人們吧。\n@c0@"
217:
  en: "@a%0%a002030@bBut if we study it closely, I am certain that we will fathom its intricacies.\n@c0@"
  ja: "@a@b%a002030「でも　よーく　見れば\n\tその　しくみが　わかるようです。\n@c0@"
  ko: "@a@b%a002030: 하지만 자세히 보면\n그 구조를 알 것 같기도 해요.\n@c0@"
  sl: "@a@b%a002030：但是仔细观察一下，\n　　还是可以明白它的构造的。\n@c0@"
  tl: "@a@b%a002030：但是仔細觀察一下，\n　　還是可以明白它的構造的。\n@c0@"
