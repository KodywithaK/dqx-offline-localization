  ja: "@a@b%a002030「商人たちが　集まる町ですか。\n\tかなり　にぎやかな町に　なりそうです。\n@c0@"
  ko: "@a@b%a002030: 상인들이 모이는 마을인가요?\n상당히 번화한 마을이 될 것 같아요.\n@c0@"
  sl: "@a@b%a002030：商人们聚集的镇子啊。\n　　那一定会非常热闹吧。\n@c0@"
  tl: "@a@b%a002030：商人們聚集的鎮子啊。\n　　那一定會非常熱鬧吧。\n@c0@"
150:
  en: "@a%0%a002020@bI wish we could cheer him up. It's never too late to chase your dreams!\n@c0@"
  ja: "@a@b%a002020「まだ　大丈夫だよ！\n\tって　おじいちゃんを　はげまして\n\tあげようよ。\n@c0@"
  ko: "@a@b%a002020: 아직 괜찮아!\n할아버지에게 용기를\n불어 넣어 주자고.\n@c0@"
  sl: "@a@b%a002020：跟老爷爷说\n　　现在还来得及，\n　　鼓励一下他吧。\n@c0@"
  tl: "@a@b%a002020：跟老爺爺說\n　　現在還來得及，\n　　鼓勵一下他吧。\n@c0@"
151:
  en: "@a%0%a002050@bA place where you could buy whatever you wanted, from any part of the world? Sounds like a dream...\n@c0@"
  ja: "@a@b%a002050「各地の　珍しい物が\n\tかんたんに　買えるなんて\n\tちょっと　夢みたいですね！\n@c0@"
  ko: "@a@b%a002050: 각지의 진귀한 물건을\n쉽게 살 수 있다니\n조금은 꿈같은 이야기군요!\n@c0@"
  sl: "@a@b%a002050：能轻松买到\n　　各地的特产，\n　　这还真跟梦一样呢！\n@c0@"
  tl: "@a@b%a002050：能輕鬆買到\n　　各地的特產，\n　　這還真跟夢一樣呢！\n@c0@"
152:
  en: "@a%0%a002070@bBoing! (jiggle)\n@c0@"
  ja: "@a@b%a002070「プルプルーッ！\n@c0@"
  ko: "@a@b%a002070: 뽀용뽀요용~!\n@c0@"
  sl: "@a@b%a002070：噗噜噗噜！\n@c0@"
  tl: "@a@b%a002070：噗嚕噗嚕！\n@c0@"
153:
  en: "@a%0%a002000@bLaid-back as always around here, aye?\n@c0@"
  ja: "@a@b%a002000「あいかわらず　のどかだな。\n@c0@"
  ko: "@a@b%a002000: 변함없이 평온하군.\n@c0@"
  sl: "@a@b%a002000：这里还是那么悠闲安宁啊。\n@c0@"
  tl: "@a@b%a002000：這裡還是那麼悠閒安寧啊。\n@c0@"
154:
  en: "@a%0%a002010@bLooking at just this village, you'd think the world was at peace...\n@c0@"
  ja: "@a@b%a002010「この村だけ　見ていると\n\t平和そのもの　なんだけどね。\n@c0@"
  ko: "@a@b%a002010: 이 마을만 보고 있으면\n마음이 더없이 평화로워져.\n@c0@"
  sl: "@a@b%a002010：光看这个村子的话，\n　　能够感受到和平的气氛呢。\n@c0@"
  tl: "@a@b%a002010：光看這個村子的話，\n　　能夠感受到和平的氣氛呢。\n@c0@"
155:
  en: "@a%0%a002030@bMay the blessings of the Goddess be upon this village.\n@c0@"
  ja: "@a@b%a002030「この村の　みなさまに\n\t神のご加護が　ありますように……。\n@c0@"
  ko: "@a@b%a002030: 이 마을의 모든 분들께\n신의 가호가 함께하기를......\n@c0@"
  sl: "@a@b%a002030：愿神保佑\n　　这村里的人们……\n@c0@"
  tl: "@a@b%a002030：願神保佑\n　　這村裡的人們……\n@c0@"
156:
  en: "@a%0%a002020@bAhh, I never get sick of seeing Weaver's Peak!\n@c0@"
  ja: "@a@b%a002020「あーっ！\n\tやっぱり　ライフコッドの村は\n\tいいところだね。\n@c0@"
  ko: "@a@b%a002020: 아~!\n역시 라이프코드 마을은\n좋은 곳이야.\n@c0@"
  sl: "@a@b%a002020：啊！\n　　莱夫科德村果然\n　　是个好地方啊。\n@c0@"
  tl: "@a@b%a002020：啊！\n　　萊夫科德村果然\n　　是個好地方啊。\n@c0@"
157:
  en: "@a%0%a002050@bSo %a000090, is it odd to be back in Weaver's Peak in the dream world as your real self?\n@c0@"
  ja: "@a@b%a002050「本当の自分に　もどって\n\tこの世界の　ライフコッドに\n\tやって来た気もちは　どうですか？\n@c0@"
  ko: "@a@b%a002050: 원래의 자신으로 돌아와서\n이 세계의 라이프코드에\n돌아온 기분은 어떤가요?\n@c0@"
  sl: "@a@b%a002050：拿回自己真正的身体之后\n　　回这个世界的莱夫科德，\n　　感觉怎么样？\n@c0@"
  tl: "@a@b%a002050：拿回自己真正的身體之後\n　　回這個世界的萊夫科德，\n　　感覺怎麼樣？\n@c0@"
158:
  en: "@a%0%a002070@bBoi-oing!\n@c0@"
  ja: "@a@b%a002070「プルルン　ルン！\n@c0@"
  ko: "@a@b%a002070: 뽀요용!\n@c0@"
  sl: "@a@b%a002070：噗噜噜～噜！\n@c0@"
  tl: "@a@b%a002070：噗嚕嚕～嚕！\n@c0@"
159:
  en: "@a%0%a002000@bSounds like our reputation precedes us 'n' everything like that, aye?\n@c0@"
  ja: "@a@b%a002000「なんだか　オレたちのこと\n\tウワサに　なってるみたいだな。\n@c0@"
  ko: "@a@b%a002000: 우리 이야기가\n소문이 난 모양이야.\n@c0@"
  sl: "@a@b%a002000：咱们的事情\n　　好像流传开了呢。\n@c0@"
  tl: "@a@b%a002000：咱們的事情\n　　好像流傳開了呢。\n@c0@"
160:
  en: "@a%0%a002010@bI hope he'll be able to explore the world when he grows up as well.\n@c0@"
  ja: "@a@b%a002010「ぼうやも　大きくなったら\n\t世界中を　旅してみるといいわ。\n\tホント　世界は　広いわよ。\n@c0@"
  ko: "@a@b%a002010: 꼬마야, 너도 어른이 되면\n온 세계를 여행해 보면 좋을 거야.\n정말로 세계는 넓단다.\n@c0@"
  sl: "@a@b%a002010：小朋友长大之后\n　　要是也能环游世界就好了呢。\n　　世界真的很广阔哦。\n@c0@"
  tl: "@a@b%a002010：小朋友長大之後\n　　要是也能環遊世界就好了呢。\n　　世界真的很廣闊哦。\n@c0@"
161:
  en: "@a%0%a002030@bIt wouldn't be Weaver's Peak if we weren't greeted by that child.\n@c0@"
  ja: "@a@b%a002030「この子に　会うと\n\tライフコッドに　来た気がしますね。\n@c0@"
  ko: "@a@b%a002030: 이 아이를 만나니까\n라이프코드에 왔다는 게 실감이 나네요.\n@c0@"
  sl: "@a@b%a002030：碰到了这孩子之后\n　　才感觉来到了莱夫科德呢。\n@c0@"
  tl: "@a@b%a002030：碰到了這孩子之後\n　　才感覺來到了萊夫科德呢。\n@c0@"
162:
  en: "@a%0%a002020@bAww, that kid practically worships us. You can see it in his eyes!\n@c0@"
  ja: "@a@b%a002020「ほら見て　この子の目。\n\tすっごい　キラキラ　かがやいてるよ！\n@c0@"
  ko: "@a@b%a002020: 이 아이의 눈 좀 봐.\n반짝반짝 빛나고 있어!\n@c0@"
  sl: "@a@b%a002020：看这孩子的眼睛。\n　　在闪闪发光呢！\n@c0@"
  tl: "@a@b%a002020：看這孩子的眼睛。\n　　在閃閃發光呢！\n@c0@"
163:
  en: "@a%0%a002050@bA sense of adventure is good for young lads.\n@c0@"
  ja: "@a@b%a002050「男は　冒険に　あこがれる\n\tものですからねえ。\n@c0@"
  ko: "@a@b%a002050: 남자는 모험을 동경하는\n동물이라지요.\n@c0@"
  sl: "@a@b%a002050：男子汉都向往着\n　　出门冒险呢。\n@c0@"
  tl: "@a@b%a002050：男子漢都嚮往著\n　　出門冒險呢。\n@c0@"
164:
  en: "@a%0%a002070@b(slurp) Boing!\n@c0@"
  ja: "@a@b%a002070「プルプル。\n@c0@"
  ko: "@a@b%a002070: 뽀용뽀용.\n@c0@"
  sl: "@a@b%a002070：噗噜噗噜。\n@c0@"
  tl: "@a@b%a002070：噗嚕噗嚕。\n@c0@"
165:
  en: "@a%0%a002000@bHardy har! ‘All grown up’, aye? Maybe by an inch!\n@c0@"
  ja: "@a@b%a002000「カンロクが　ついたってさ！\n\t最近　ふとったんじゃないか？\n@c0@"
  ko: "@a@b%a002000: 관록이 붙으면서\n살까지 같이 붙은 거 아냐?\n@c0@"
  sl: "@a@b%a002000：他说你威风凛凛呢！\n　　最近你是不是胖了啊？\n@c0@"
  tl: "@a@b%a002000：他說你威風凜凜呢！\n　　最近你是不是胖了啊？\n@c0@"
166:
  en: "@a%0%a002010@bThis is the real %a000090, that's why.\n@c0@"
  ja: "@a@b%a002010「だって　本物の\n\t%a000090なんですものね。\n@c0@"
  ko: "@a@b%a002010: 그야 원래의\n%a000090니까 그렇지.\n@c0@"
  sl: "@a@b%a002010：因为这是\n　　真正的%a000090嘛。\n@c0@"
  tl: "@a@b%a002010：因為這是\n　　真正的%a000090嘛。\n@c0@"
167:
  en: "@a%0%a002030@bThe villagers here notice the smallest change in you, %a000090.\n@c0@"
  ja: "@a@b%a002030「ライフコッドの　みなさんには\n\t%a000090さんの　ちょっとした　ちがいも\n\tすぐに　わかるのでしょうね。\n@c0@"
  ko: "@a@b%a002030: 라이프코드의 사람들은\n%a000090 님이 조금만 달라져도\n금방 알아차리나 보군요.\n@c0@"
  sl: "@a@b%a002030：对莱夫科德的人们来说，\n　　%a000090哪怕只有一丁点不一样，\n　　他们都能立刻看出来呢。\n@c0@"
  tl: "@a@b%a002030：對萊夫科德的人們來說，\n　　%a000090哪怕只有一丁點不一樣，\n　　他們都能立刻看出來呢。\n@c0@"
168:
  en: "@a%0%a002020@bTee hee! Hard to imagine you ‘all grown up’ any time soon, %a000090.\n@c0@"
  ja: "@a@b%a002020「あははっ　カンロクだって！\n\t%a000090には　にあわないなあ。\n@c0@"
  ko: "@a@b%a002020: 아하하, 관록이래!\n%a000090한테는 안 어울려.\n@c0@"
  sl: "@a@b%a002020：啊哈哈，威风凛凛啊！\n　　这词跟%a000090真不搭。\n@c0@"
  tl: "@a@b%a002020：啊哈哈，威風凜凜啊！\n　　這詞跟%a000090真不搭。\n@c0@"
169:
  en: "@a%0%a002050@bGrown up? I reckon you're powered up, %a000090.\n@c0@"
  ja: "@a@b%a002050「パワーアップした\n\tということでしょうか？\n@c0@"
  ko: "@a@b%a002050: 한 단계 성장했다는\n뜻일까요?\n@c0@"
  sl: "@a@b%a002050：是因为\n　　力量提升了吧？\n@c0@"
  tl: "@a@b%a002050：是因為\n　　力量提升了吧？\n@c0@"
170:
  en: "@a%0%a002070@bBoi-oi-oing!\n@c0@"
  ja: "@a@b%a002070「プルプルン。\n@c0@"
  ko: "@a@b%a002070: 뽀용뽀요용.\n@c0@"
  sl: "@a@b%a002070：噗噜噗噜。\n@c0@"
  tl: "@a@b%a002070：噗嚕噗嚕。\n@c0@"
171:
  en: "@a%0%a002000@bThe folks around here spotted the changes to %a000090 right off, aye?\n@c0@"
  ja: "@a@b%a002000「みんな　ちゃんと\n\t%a000090の　ちがいに\n\t気づくんだなあ。\n@c0@"
  ko: "@a@b%a002000: 마을 사람들은\n%a000090%F0090%X가%Y이%Z 조금만 달라져도\n알아차리나 보군.\n@c0@"
  sl: "@a@b%a002000：大家都注意到了\n　　%a000090的变化呢。\n@c0@"
  tl: "@a@b%a002000：大家都注意到了\n　　%a000090的變化呢。\n@c0@"
172:
  en: "@a%0%a002010@bHee hee.\n@c0@"
  ja: "@a@b%a002010「うふふ。\n@c0@"
  ko: "@a@b%a002010: 우후후.\n@c0@"
  sl: "@a@b%a002010：呵呵呵。\n@c0@"
  tl: "@a@b%a002010：呵呵呵。\n@c0@"
173:
  en: "@a%0%a002030@bWe always get a warm welcome here.\n@c0@"
  ja: "@a@b%a002030「この村の人たちは　本当に\n\t温かい人ばかりですね。\n@c0@"
  ko: "@a@b%a002030: 이 마을 사람들은 정말\n따뜻한 사람들밖에 없어요.\n@c0@"
  sl: "@a@b%a002030：这个村里尽是\n　　温柔善良的人呢。\n@c0@"
  tl: "@a@b%a002030：這個村裡盡是\n　　溫柔善良的人呢。\n@c0@"
174:
  en: "@a%0%a002020@bAll these villagers sure seem to care about %a000090. Isn't that nice?\n@c0@"
  ja: "@a@b%a002020「いつも　%a000090のこと\n\t気にしてくれているんだよ。\n\tありがたいね！\n@c0@"
  ko: "@a@b%a002020: 언제나 %a000090한테\n신경을 써 주잖아.\n고마운 일이야!\n@c0@"
  sl: "@a@b%a002020：大家一直都\n　　很关心%a000090呢，\n　　真是让人感动啊！\n@c0@"
  tl: "@a@b%a002020：大家一直都\n　　很關心%a000090呢，\n　　真是讓人感動啊！\n@c0@"
175:
  en: "@a%0%a002050@bEveryone's talkin' about %a000090. Why doesn't old %a002050 get any attention?\n@c0@"
  ja: "@a@b%a002050「私も　そうとう　強くなりましたが\n\tわかってもらえないようです……。\n@c0@"
  ko: "@a@b%a002050: 저도 상당히 강해졌는데\n다들 몰라보네요......\n@c0@"
  sl: "@a@b%a002050：我也变得很厉害了啊。\n　　不过好像没人发现……\n@c0@"
  tl: "@a@b%a002050：我也變得很厲害了啊。\n　　不過好像沒人發現……\n@c0@"
176:
  en: "@a%0%a002070@bBoing! (jiggle)\n@c0@"
  ja: "@a@b%a002070「プルプルーッ！\n@c0@"
  ko: "@a@b%a002070: 뽀용뽀요용~!\n@c0@"
  sl: "@a@b%a002070：噗噜噗噜！\n@c0@"
  tl: "@a@b%a002070：噗嚕噗嚕！\n@c0@"
177:
  en: "@a%0%a002000@bNo pressure or nothin', aye, %a000090? Hardy har!\n@c0@"
  ja: "@a@b%a002000「本当に　%a000090は\n\tみんなから　期待されてるな。\n@c0@"
  ko: "@a@b%a002000: 정말로 %a000090%F0090%X는%Y은%Z\n모두에게 기대를 받고 있군.\n@c0@"
  sl: "@a@b%a002000：%a000090真的是\n　　备受大家的期待啊。\n@c0@"
  tl: "@a@b%a002000：%a000090真的是\n　　備受大家的期待啊。\n@c0@"
178:
  en: "@a%0%a002010@bOf course you'll keep them safe, won't you, %a000090?\n@c0@"
  ja: "@a@b%a002010「もちろん　%a000090がいれば\n\t安心よね。\n@c0@"
  ko: "@a@b%a002010: 물론 %a000090%F0090%X가%Y이%Z 있으면\n안심되잖아.\n@c0@"
  sl: "@a@b%a002010：%a000090在的话\n　　大家当然放心了。\n@c0@"
  tl: "@a@b%a002010：%a000090在的話\n　　大家當然放心了。\n@c0@"
179:
  en: "@a%0%a002030@bNaturally, we'll strive to protect Weaver's Peak in this world too.\n@c0@"
  ja: "@a@b%a002030「大丈夫です。\n\tこちらの世界の　ライフコッドも\n\t守ることができますよ。\n@c0@"
  ko: "@a@b%a002030: 괜찮아요.\n이쪽 세계의 라이프코드도\n지킬 수 있어요.\n@c0@"
  sl: "@a@b%a002030：没事的。\n　　这个世界的莱夫科德\n　　我们也能保护。\n@c0@"
  tl: "@a@b%a002030：沒事的。\n　　這個世界的萊夫科德\n　　我們也能保護。\n@c0@"
180:
  en: "@a%0%a002020@bI hope no monsters show up, but this village is in good hands if they do.\n@c0@"
  ja: "@a@b%a002020「おそわれちゃ　困るけど\n\tおそわれても　バッチリだよね！\n@c0@"
  ko: "@a@b%a002020: 공격당하면 곤란하지만\n공격당해도 끄떡없겠지!\n@c0@"
  sl: "@a@b%a002020：虽然魔物来袭的话\n　　大家会很伤脑筋，但也时刻做好了准备呢！\n@c0@"
  tl: "@a@b%a002020：雖然魔物來襲的話\n　　大家會很傷腦筋，但也時刻做好了準備呢！\n@c0@"
181:
  en: "@a%0%a002050@bOld %a002050 has had it up to here with bein' attacked by monsters.\n@c0@"
  ja: "@a@b%a002050「もう　まものに\n\tおそわれるのは　たくさんですよ。\n@c0@"
  ko: "@a@b%a002050: 이제 마물에게\n공격당하는 건 싫어요.\n@c0@"
  sl: "@a@b%a002050：魔物来袭这种事情\n　　真是受够了啊。\n@c0@"
  tl: "@a@b%a002050：魔物來襲這種事情\n　　真是受夠了啊。\n@c0@"
182:
  en: "@a%0%a002070@bBoing! (jiggle)\n@c0@"
  ja: "@a@b%a002070「プルプルーッ！\n@c0@"
  ko: "@a@b%a002070: 뽀용뽀요용~!\n@c0@"
  sl: "@a@b%a002070：噗噜噗噜！\n@c0@"
  tl: "@a@b%a002070：噗嚕噗嚕！\n@c0@"
183:
  en: "@a%0%a002000@bNot many folks in a travellin' mood yet, I s'pose.\n@c0@"
  ja: "@a@b%a002000「まだまだ　世の中\n\t旅行する　気分じゃないってことだな。\n@c0@"
  ko: "@a@b%a002000: 아직 온 세상을\n다 여행했다는 생각은 안 들어.\n@c0@"
  sl: "@a@b%a002000：这样的世界还\n　　远远不能让人安心旅行呢。\n@c0@"
