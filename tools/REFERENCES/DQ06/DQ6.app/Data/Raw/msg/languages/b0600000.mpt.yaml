  ko: "@a@b%a002000: 아줌마를 노리고\n마물들이 마을을 습격해 왔다고!?\n농담이 심하군!\n@c0@"
  sl: "@a@b%a002000：魔物们袭击村子\n　　目标是老婆婆？！\n　　这玩笑开过了吧！\n@c0@"
  tl: "@a@b%a002000：魔物們襲擊村子\n　　目標是老婆婆？！\n　　這玩笑開過了吧！\n@c0@"
1:
  en: "@a%0%a002010@bIndeed. Tania could turn the toughest monster into a soppy romantic.\n@c0@"
  ja: "@a@b%a002010「たしかに　ターニアさんなら\n\tまものも　ホレて　しまうかもね。\n@c0@"
  ko: "@a@b%a002010: 분명 타니아 씨라면\n마물도 넋을 잃을 수 있겠어.\n@c0@"
