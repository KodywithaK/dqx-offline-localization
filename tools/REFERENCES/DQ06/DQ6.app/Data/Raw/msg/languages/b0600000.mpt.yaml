  ko: "@a@b%a002030: 마을 사람들도\n농담을 할 정도로\n여유가 생긴 모양이네요!\n@c0@"
  sl: "@a@b%a002030：村里的人们\n　　心情放松了下来，\n　　连说笑话的精神都有了呢！\n@c0@"
  tl: "@a@b%a002030：村裡的人們\n　　心情放鬆了下來，\n　　連說笑話的精神都有了呢！\n@c0@"
3:
  en: "@a%0%a002020@bTania's pretty enough for a small-town girl, sure. But me? I've got worldly beauty!\n@c0@"
