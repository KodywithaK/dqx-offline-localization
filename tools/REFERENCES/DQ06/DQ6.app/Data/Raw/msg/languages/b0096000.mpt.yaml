0:
  en: "@a@b*: %0%a002030! The blessed %a002030 has returned!\n@c0@"
  ja: "@a@b＊「ややっ　%a002030さまっ！\n@c0@"
  ko: "@a@b*: 아앗 %a002030 님!\n@c0@"
  sl: "@a@b＊：哦！%a002030大人！\n@c0@"
  tl: "@a@b＊：哦！%a002030大人！\n@c0@"
1:
  en: "@a@b*: If we'd known you were on your way, we could have come to meet you.\n@c0@"
  ja: "@a@b＊「なんと！　おかえりに　なるのが\n\tわかっていれば　おむかえに\n\tあがりましたものを！\n@c0@"
  ko: "@a@b*: 세상에! 돌아오실 줄\n알았다면 제가 직접\n마중을 나갔을 텐데요!\n@c0@"
  sl: "@a@b＊：您终于回来了！\n　　要是早知道的话，\n　　我们就去迎接您了啊！\n@c0@"
  tl: "@a@b＊：您終於回來了！\n　　要是早知道的話，\n　　我們就去迎接您了啊！\n@c0@"
2:
  en: "@a%0%a002030@bIs my grandfather inside?\n@c0@"
  ja: "@a@b%a002030「おじいさまは　中ですか？\n@c0@"
  ko: "@a@b%a002030: 할아버님은 안에 계시나요?\n@c0@"
  sl: "@a@b%a002030：爷爷在里面吗？\n@c0@"
  tl: "@a@b%a002030：爺爺在裡面嗎？\n@c0@"
3:
  en: "@a@b*: No... Strange though it may sound, the Providence sailed home of her own volition, and the Elder...\n@c0@"
  ja: "@a@b＊「いえ……。　さきほど　とつぜん\n\t神の船が　もどってまいりまして\n\t長老さまは……\n@c0@"
  ko: "@a@b*: 아니요...... 조금 전에 갑자기\n신의 배가 돌아와서\n장로님은......\n@c0@"
  sl: "@a@b＊：不……就在刚才，\n　　神之船突然也回到这里来，\n　　长老大人就……\n@c0@"
  tl: "@a@b＊：不……就在剛才，\n　　神之船突然也回到這裡來，\n　　長老大人就……\n@c0@"
4:
  en: "@a%0%a002030@bI see. He must be at the shrine.\n@c0@"
  ja: "@a@b%a002030「神殿ですね。\n@c0@"
  ko: "@a@b%a002030: 신전에 가셨군요.\n@c0@"
  sl: "@a@b%a002030：是在神殿那边吧。\n@c0@"
  tl: "@a@b%a002030：是在神殿那邊吧。\n@c0@"
5:
  en: "@a%0%a002030@bIt is I, Grandfather.\n@c0@"
  ja: "@a@b%a002030「おじいさま　いま\n\tもどりました。\n@c0@"
  ko: "@a@b%a002030: 할아버님\n다녀왔습니다.\n@c0@"
  sl: "@a@b%a002030：爷爷，我回来了。\n@c0@"
  tl: "@a@b%a002030：爺爺，我回來了。\n@c0@"
6:
  en: "@aElder@b%0%a002030! You have returned to us! ...But how you have grown! You seem like a different person.\n@c0@"
  ja: "@a@b長老「よくぞ　もどった　%a002030よ！\n\tおおっ　まるで　別人のように\n\tたくましくなって。　見ちがえたぞ！\n@c0@"
  ko: "@a@b장로: 어서 오너라, %a002030!\n오오, 마치 딴 사람처럼\n늠름해졌구나. 못 알아볼 뻔했어!\n@c0@"
  sl: "@a@b长老：你回来了就好，%a002030！\n　　哦，你看起来比以前结实多了，\n　　简直判若两人啊，我差点没认出来！\n@c0@"
  tl: "@a@b長老：你回來了就好，%a002030！\n　　哦，你看起來比以前結實多了，\n　　簡直判若兩人啊，我差點沒認出來！\n@c0@"
7:
  en: "@a%0%a002030@bGrandfather, what is this I hear about the Providence?\n@c0@"
  ja: "@a@b%a002030「おじいさま。\n\tこの船は　いったい……。\n@c0@"
  ko: "@a@b%a002030: 할아버님.\n이 배는 도대체......\n@c0@"
  sl: "@a@b%a002030：爷爷，\n　　这艘船，究竟是……\n@c0@"
  tl: "@a@b%a002030：爺爺，\n　　這艘船，究竟是……\n@c0@"
8:
  en: "@aElder@bIt is curious indeed. It sailed back here unmanned, as if it somehow knew its mission was at an end.\n@c0@"
  ja: "@a@b長老「ふむ。　まことに　ふしぎよのう。\n\t役目を　おえたかのように\n\tひとりでに　もどってきおった。\n@c0@"
  ko: "@a@b장로: 흐음. 정말 신기한 일이야.\n자기 할 일을 마친 것처럼\n혼자서 돌아왔지 뭐냐.\n@c0@"
  sl: "@a@b长老：嗯，真的是很不可思议啊。\n　　简直就像是完成了它的使命之后，\n　　独自航行回来了。\n@c0@"
  tl: "@a@b長老：嗯，真的是很不可思議啊。\n　　簡直就像是完成了它的使命之後，\n　　獨自航行回來了。\n@c0@"
9:
  en: "@aElder@bBut I must praise your exceptional efforts! You have secured a future for us all.\n@c0@"
  ja: "@a@b長老「とにかく　よく　やったな。\n\tそなたらは　ゲントの術でも　いやせぬ\n\t人びとの未来を　すくったのじゃ。\n@c0@"
  ko: "@a@b장로: 아무튼 잘해 주었다.\n그대들은 겐트의 힘으로도 어쩔 수 없었던\n사람들의 미래를 구한 것이야.\n@c0@"
  sl: "@a@b长老：总而言之，你干得很好。\n　　你们各位拯救了那些\n　　连根特之术也无法治愈的人们的未来。\n@c0@"
  tl: "@a@b長老：總而言之，你幹得很好。\n　　你們各位拯救了那些\n　　連根特之術也無法治癒的人們的未來。\n@c0@"
10:
  en: "@aElder@bI have no doubt that the Goddess is smiling on you.\n@c0@"
  ja: "@a@b長老「われら　ゲントの神も　さぞや\n\tおよろこびじゃろう。\n@c0@"
  ko: "@a@b장로: 우리 겐트 신도 틀림없이\n기뻐하실 테지.\n@c0@"
  sl: "@a@b长老：想必我们的根特之神\n　　也是非常高兴的吧。\n@c0@"
  tl: "@a@b長老：想必我們的根特之神\n　　也是非常高興的吧。\n@c0@"
11:
  en: "@a%0%a002030@b%0%a000090, I wish to remain here in Ghent and use my powers to cure the sick and ailing.\n@c0@"
  ja: "@a@b%a002030「%a000090さん。　私は\n\tこれからも　この村で　病気のひとのため\n\tはたらいてゆく　つもりです。\n@c0@"
  ko: "@a@b%a002030: %a000090 님. 저는\n앞으로 이 마을에서 병든 사람을 위해\n일할 생각입니다.\n@c0@"
  sl: "@a@b%a002030：%a000090，\n　　从今以后我就打算在这个村子里，\n　　为村民们救死扶伤了。\n@c0@"
  tl: "@a@b%a002030：%a000090，\n　　從今以後我就打算在這個村子裡，\n　　為村民們救死扶傷了。\n@c0@"
12:
  en: "@a%0%a002030@bIf ever you suffer the slightest ill health, I want to be the first to know!\n@c0@"
  ja: "@a@b%a002030「もし　ケガや病気で\n\t苦しむことが　あったら\n\t私を　よんでくださいね。\n@c0@"
  ko: "@a@b%a002030: 혹시 다치거나 병으로\n괴로워하는 사람이 있으면\n저를 불러 주십시오.\n@c0@"
  sl: "@a@b%a002030：要是你受伤了，\n　　或者因为生病而感觉不舒服了，\n　　请随时记得叫我。\n@c0@"
  tl: "@a@b%a002030：要是你受傷了，\n　　或者因為生病而感覺不舒服了，\n　　請隨時記得叫我。\n@c0@"
13:
  en: "@a%0%a002030@bThe blessings of the Goddess be upon you all.\n@c0@"
  ja: "@a@b%a002030「では　みなさんに\n\tゲントの神の祝福が　あらんことを。\n@c0@"
  ko: "@a@b%a002030: 그럼 여러분께\n겐트 신의 축복이 함께 하기를......\n@c0@"
  sl: "@a@b%a002030：那么，请让我\n　　为大家送上根特之神的祝福。\n@c0@"
  tl: "@a@b%a002030：那麼，請讓我\n　　為大家送上根特之神的祝福。\n@c0@"
14:
  en: "@aElder@bThe world is now sailing a steady course to true peace and harmony.\n@c0@"
  ja: "@a@b長老「これから　世界は　真の平和へと\n\tむかってゆくだろう。\n@c0@"
  ko: "@a@b장로: 앞으로 세계는 진정한\n평화를 맞이할 것이다.\n@c0@"
  sl: "@a@b长老：从今以后，世界就即将\n　　迎来真正的和平吧。\n@c0@"
  tl: "@a@b長老：從今以後，世界就即將\n　　迎來真正的和平吧。\n@c0@"
15:
  en: "@aElder@bPerhaps the real journey is just about to begin.\n@c0@"
  ja: "@a@b長老「本当の旅は　これから\n\tはじまるのかも　しれんな。\n@c0@"
  ko: "@a@b장로: 진정한 여행은 지금부터\n시작일지도 모르겠군.\n@c0@"
  sl: "@a@b长老：或许真正的旅行，\n　　现在才开始呢。\n@c0@"
  tl: "@a@b長老：或許真正的旅行，\n　　現在才開始呢。\n@c0@"
16:
  en: "@a@bLeave Ghent and head to the next destination?\n@c0@"
  ja: "@a@bゲントの村を　出て\n次の場所へ　向かいますか？\n@c0@"
  ko: "@a@b겐트 마을을 나와\n다음 장소로 가시겠습니까?\n@c0@"
  sl: "@a@b要离开根特村，\n前往下一个地方吗？\n@c0@"
  tl: "@a@b要離開根特村，\n前往下一個地方嗎？\n@c0@"
17:
  en: "@a@b*: %0%a002010...? %0%a002040!? Can it...? Can it really be you?\n@c0@"
  ja: "@a@b＊「ほ……本当に　%a002010と\n\t%a002040……なのか……？\n@c0@"
  ko: "@a@b*: 저..... 정말 %a002010%F2010%X와%Y과%Z\n%a002040......가 맞느냐......?\n@c0@"
  sl: "@a@b＊：真……真的是%a002010\n　　和%a002040……吗？\n@c0@"
  tl: "@a@b＊：真……真的是%a002010\n　　和%a002040……嗎？\n@c0@"
18:
  en: "@a%0%a002010@bThat's right, Father.\n@c0@"
  ja: "@a@b%a002010「はい　おとうさま。\n@c0@"
  ko: "@a@b%a002010: 네, 아버님.\n@c0@"
  sl: "@a@b%a002010：是的，父亲大人。\n@c0@"
  tl: "@a@b%a002010：是的，父親大人。\n@c0@"
19:
  en: "@a@b*: You still call me father? Me? The wretched man who sold you?\n@c0@"
  ja: "@a@b＊「わしを　父と　よんでくれるのか？\n\tおまえを　売ってしまった\n\tこのわしを……！\n@c0@"
  ko: "@a@b*: 나를 아버지라 불러주는 거냐?\n널 팔아 버렸던\n나를......!\n@c0@"
  sl: "@a@b＊：你现在愿意叫我父亲了吗？\n　　我可是把你给卖掉了的……\n@c0@"
  tl: "@a@b＊：你現在願意叫我父親了嗎？\n　　我可是把你給賣掉了的……\n@c0@"
20:
  en: "@a%0%a002010@bOf course. We were orphans with nowhere to go when you took us in...\n@c0@"
  ja: "@a@b%a002010「もちろんです。　だって\n\t身よりのない　私たち姉弟を\n\tひきとって……\n@c0@"
  ko: "@a@b%a002010: 물론이죠.\n기댈 곳 없는 우리 남매를\n거둬주시고......\n@c0@"
  sl: "@a@b%a002010：当然愿意。因为\n　　收留了原本无依无靠的我们姐弟俩……\n@c0@"
  tl: "@a@b%a002010：當然願意。因為\n　　收留了原本無依無靠的我們姐弟倆……\n@c0@"
21:
  en: "@a%0%a002010@bYou're the ones who raised us to be the people we are today.\n@c0@"
  ja: "@a@b%a002010「ここまで　育ててくれたのは\n\tおとうさまと　おかあさまですもの。\n@c0@"
  ko: "@a@b%a002010: 이렇게 키워 주신 게\n바로 아버님과 어머님인걸요.\n@c0@"
  sl: "@a@b%a002010：并且养育到现在的，\n　　都是托了父亲大人和母亲大人的福啊。\n@c0@"
  tl: "@a@b%a002010：並且養育到現在的，\n　　都是托了父親大人和母親大人的福啊。\n@c0@"
22:
  en: "@a@b*: Oh, bless you, %a002010!\n@c0@"
  ja: "@a@b＊「おお　%a002010……！\n@c0@"
  ko: "@a@b*: 오오, %a002010......!\n@c0@"
  sl: "@a@b＊：啊啊，%a002010……\n@c0@"
  tl: "@a@b＊：啊啊，%a002010……\n@c0@"
23:
  en: "@a%0%a002040@b.........\n@c0@"
  ja: "@a@b%a002040「……………。\n@c0@"
  ko: "@a@b%a002040: ............\n@c0@"
  sl: "@a@b%a002040：……\n@c0@"
  tl: "@a@b%a002040：……\n@c0@"
24:
  en: "@a%0%a002010@bBut I've got something to tell you. I've decided to become a dream seer.\n㈡\nI'm going to be an apprentice to a woman named Luca Luminista.\n@c0@"
  ja: "@a@b%a002010「ところでね　私　夢占い師に\n\tなりたいの。　グランマーズという\n\tひとのもとで　勉強したいの。\n@c0@"
  ko: "@a@b%a002010: 그런데 저는 해몽가가\n되고 싶어요. 그랜마즈라는\n사람 밑에서 공부하고 싶어요.\n@c0@"
  sl: "@a@b%a002010：对了，我决定\n　　成为一名占梦师了。\n　　以后会去叫做玛兹婆婆的人身边向她学习。\n@c0@"
  tl: "@a@b%a002010：對了，我決定\n　　成為一名占夢師了。\n　　以後會去叫做瑪茲婆婆的人身邊向她學習。\n@c0@"
25:
  en: "@a@b*: It's...it's enough for me to know that both of you are alive and well.\n@c0@"
  ja: "@a@b＊「わしは……㈢わしは　ふたりが\n\t生きていたというだけで\n\tじゅうぶんだ。\n@c0@"
  ko: "@a@b*: 난......㈢ 난 너희 둘이\n살아 있었다는 것만으로도\n충분하다.\n@c0@"
  sl: "@a@b＊：我只要……㈢我只要\n　　你们两人平安无事地活下来\n　　就非常满足了。\n@c0@"
  tl: "@a@b＊：我只要……㈢我只要\n　　你們兩人平安無事地活下來\n　　就非常滿足了。\n@c0@"
26:
  en: "@a@b*: And the fact that you came all this way to see us has filled me with joy.\n@c0@"
  ja: "@a@b＊「こうして　会いに来て\n\tくれただけで　じゅうぶんだ。\n@c0@"
  ko: "@a@b*: 이렇게 만나러 와\n주는 것만으로도 충분해.\n@c0@"
  sl: "@a@b＊：只要你们像这样\n　　还能回来见我，我就可以瞑目了。\n@c0@"
  tl: "@a@b＊：只要你們像這樣\n　　還能回來見我，我就可以瞑目了。\n@c0@"
27:
  en: "@a@b*: So please go ahead and live your life as you see fit. Don't concern yourself with us.\n@c0@"
  ja: "@a@b＊「だから　好きなことを　やるがええ。\n\tわしらのことなど　気にせずにな。\n@c0@"
  ko: "@a@b*: 그러니 좋을 대로 하려무나.\n우리는 신경 쓰지 않아도 돼.\n@c0@"
  sl: "@a@b＊：所以你们尽管去做你们想做的事情吧，\n　　不用在意我们这对老头老太了。\n@c0@"
  tl: "@a@b＊：所以你們儘管去做你們想做的事情吧，\n　　不用在意我們這對老頭老太了。\n@c0@"
28:
  en: "@a%0%a002010@bThank you, Father. Thank you, Mother.\n@c0@"
  ja: "@a@b%a002010「ありがとう　おとうさま\n\tおかあさま。\n@c0@"
  ko: "@a@b%a002010: 고맙습니다, 아버님\n어머님.\n@c0@"
  sl: "@a@b%a002010：谢谢你们，\n　　父亲大人，母亲大人。\n@c0@"
  tl: "@a@b%a002010：謝謝你們，\n　　父親大人，母親大人。\n@c0@"
29:
  en: "@a%0%a002040@bHmph!\n@c0@"
  ja: "@a@b%a002040「フン！\n@c0@"
  ko: "@a@b%a002040: 흥!\n@c0@"
  sl: "@a@b%a002040：哼！\n@c0@"
  tl: "@a@b%a002040：哼！\n@c0@"
30:
  en: "@a%0%a002010@bDo you mind if we part ways here, %a000090?\n@c0@"
  ja: "@a@b%a002010「%a000090　ここで\n\tおわかれして　いいかしら？\n@c0@"
  ko: "@a@b%a002010: %a000090, 여기서\n작별해도 될까?\n@c0@"
  sl: "@a@b%a002010：%a000090，\n　　我们就在这里说再见吧，好吗？\n@c0@"
  tl: "@a@b%a002010：%a000090，\n　　我們就在這裡說再見吧，好嗎？\n@c0@"
31:
  en: "@a%0%a002010@bThe four of us have some things we need to discuss...\n@c0@"
  ja: "@a@b%a002010「もう　しばらく　こうして\n\t４人で　話していたいの……。\n@c0@"
  ko: "@a@b%a002010: 조금만 더 이렇게\n네 명이 얘길 나누고 싶어......\n@c0@"
  sl: "@a@b%a002010：我现在想像这样，\n　　４个家人一起说说话……\n@c0@"
  tl: "@a@b%a002010：我現在想像這樣，\n　　４個家人一起說說話……\n@c0@"
32:
  en: "@a@b*: I'm so proud of you, %a002010, and of you too, %a002040.\n㈡\nI know that you and your companions will build a better world.\n@c0@"
  ja: "@a@b＊「%a002010と%a002040　それに\n\tおまえさんたちなら　いい世界を\n\tつくって　くれるだろうな。\n@c0@"
  ko: "@a@b*: %a002010%F2010%X와%Y과%Z %a002040, 그리고\n너희라면 멋진 세계를\n만들 수 있을 거야.\n@c0@"
  sl: "@a@b＊：想必%a002010和%a002040，\n　　还有你们，一定能够创造一个\n　　非常棒的世界吧。\n@c0@"
  tl: "@a@b＊：想必%a002010和%a002040，\n　　還有你們，一定能夠創造一個\n　　非常棒的世界吧。\n@c0@"
33:
  en: "@a@b*: To think that our %a002010 and %a002040 would grow into such upstanding... (sob)\n@c0@"
