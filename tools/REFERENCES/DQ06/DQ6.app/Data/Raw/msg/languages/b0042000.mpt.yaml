0:
  en: "@a@b*: The King was out of there like a liquid metal slime! I wonder what's up?\n@c0@"
  ja: "@a@b＊「王が　あわてて出てゆかれましたが\n\tなにか　あったのでしょうか……。\n@c0@"
  ko: "@a@b*: 폐하께서 황급히 밖으로 나가셨는데\n무슨 일이 있으셨던 걸까요......\n@c0@"
  sl: "@a@b＊：国王急匆匆地出去了。\n　　发生了什么事吗……\n@c0@"
  tl: "@a@b＊：國王急匆匆地出去了。\n　　發生了什麼事嗎……\n@c0@"
1:
  en: "@a@b*: Please, speak to the King first!\n@c0@"
  ja: "@a@b＊「まずは　王の話を！\n@c0@"
  ko: "@a@b*: 우선은 폐하의 말씀을!\n@c0@"
  sl: "@a@b＊：先去跟国王说话！\n@c0@"
  tl: "@a@b＊：先去跟國王說話！\n@c0@"
2:
  en: "@aKing Ludwig@bThanks to that mirror of yours, everything has become clear.\n@c0@"
  ja: "@a@bフォーン王「そなたたちが　持ってきた\n\tラーの鏡（かがみ）の　おかげで\n\tすべてが　はっきりとしたぞ。\n@c0@"
  ko: "@a@b폰 왕: 그대들이 가져온\n라의 거울 덕분에\n모든 것이 확실해졌다오.\n@c0@"
  sl: "@a@b佛恩王：多亏了你们\n　　手里的太阳神镜，\n　　事情已经清楚了。\n@c0@"
  tl: "@a@b佛恩王：多虧了你們\n　　手裡的太陽神鏡，\n　　事情已經清楚了。\n@c0@"
3:
  en: "@aKing Ludwig@bI have here a dusty book that has been in this castle since before anyone can remember.\n@c0@"
  ja: "@a@bフォーン王「ここに　古い本がある。\n\tこれは　昔から　この城に\n\tあるものだ。\n@c0@"
  ko: "@a@b폰 왕: 여기에 오래된 책이 있소.\n이건 옛날부터 이 성에\n있었던 것이오.\n@c0@"
  sl: "@a@b佛恩王：这里有一本古书。\n　　这书从很久之前\n　　就在这座城里。\n@c0@"
  tl: "@a@b佛恩王：這裡有一本古書。\n　　這書從很久之前\n　　就在這座城裡。\n@c0@"
4:
  en: "@aKing Ludwig@bIn it is written the tale of a young prince and a beautiful princess who are very much in love.\n@c0@"
  ja: "@a@bフォーン王「書かれているのは\n\tとある王子と　美しい姫の\n\t恋物語。\n@c0@"
  ko: "@a@b폰 왕: 책의 내용은\n어느 왕자와 아름다운 공주의\n사랑 이야기.\n@c0@"
  sl: "@a@b佛恩王：上面记载着某个王子\n　　和一位美丽的公主的\n　　爱情故事。\n@c0@"
  tl: "@a@b佛恩王：上面記載著某個王子\n　　和一位美麗的公主的\n　　愛情故事。\n@c0@"
5:
  en: "@aKing Ludwig@bBut it also tells of a wicked sorcerer called Spiegel who did not approve of their budding romance...\n@c0@"
  ja: "@a@bフォーン王「そして　それを\n\tこころよく思わない\n\t邪悪な魔法使い　ミラルゴ……。\n@c0@"
  ko: "@a@b폰 왕: 그리고 그것을\n달갑지 않게 여기던\n사악한 마법사 미랄고......\n@c0@"
  sl: "@a@b佛恩王：还有对此\n　　心怀恶意的邪恶魔法师\n　　米拉尔戈……\n@c0@"
  tl: "@a@b佛恩王：還有對此\n　　心懷惡意的邪惡魔法師\n　　米拉爾戈……\n@c0@"
6:
  en: "@aKing Ludwig@bA classic fairy tale, eh?\n@c0@"
  ja: "@a@bフォーン王「まあ　よくある物語だ。\n@c0@"
  ko: "@a@b폰 왕: 뭐, 흔히 볼 수 있는 이야기지.\n@c0@"
  sl: "@a@b佛恩王：是个老掉牙的故事。\n@c0@"
  tl: "@a@b佛恩王：是個老掉牙的故事。\n@c0@"
7:
  en: "@aKing Ludwig@bAh, but the story in this book is different! The prince and princess do not live happily ever after.\n@c0@"
  ja: "@a@bフォーン王「だが　ちがう！\n\tそれは　ただの物語などでは\n\tなかったのだ！\n@c0@"
  ko: "@a@b폰 왕: 허나 그게 아니었소!\n그건 그저 평범한 이야기가\n아니었던 것이오!\n@c0@"
  sl: "@a@b佛恩王：但是它并不\n　　仅仅是个故事！\n@c0@"
  tl: "@a@b佛恩王：但是它並不\n　　僅僅是個故事！\n@c0@"
8:
  en: "@aKing Ludwig@bThe monster that we just saw in Ra's Mirror is the sorcerer Spiegel.\n㈡\nThere's no mistaking it — the resemblance is uncanny!\n@c0@"
  ja: "@a@bフォーン王「ラーの鏡で見えた\n\tあの　魔法使いは　この本にある\n\tミラルゴに　うりふたつ！\n@c0@"
  ko: "@a@b폰 왕: 라의 거울에 보였던\n그 마법사는 이 책에 있는\n미랄고와 판박이였지!\n@c0@"
  sl: "@a@b佛恩王：太阳神镜中\n　　映出的那个魔法师，\n　　和米拉尔戈一模一样！\n@c0@"
  tl: "@a@b佛恩王：太陽神鏡中\n　　映出的那個魔法師，\n　　和米拉爾戈一模一樣！\n@c0@"
9:
  en: "@aKing Ludwig@bThis means Spiegel must still be alive. That is why the Princess's curse cannot be lifted!\n@c0@"
  ja: "@a@bフォーン王「ヤツは　まだ生きている。\n\tだから　姫の呪いが　とけないのだ。\n@c0@"
  ko: "@a@b폰 왕: 놈은 아직 살아 있소.\n그래서 공주의 저주가 풀리지 않았던 것.\n@c0@"
  sl: "@a@b佛恩王：那家伙还活着，\n　　所以公主的诅咒才无法解开。\n@c0@"
  tl: "@a@b佛恩王：那傢伙還活著，\n　　所以公主的詛咒才無法解開。\n@c0@"
10:
  en: "@aKing Ludwig@bYou had told me that one of the purposes of your journey is to rid the world of any remaining monsters, yes?\n@c0@"
  ja: "@a@bフォーン王「そなたたちは　たしか\n\tまだ　残っている　まものどもを\n\t退治するため　旅をしていると……。\n@c0@"
  ko: "@a@b폰 왕: 듣기로 그대들은\n아직 남아 있는 마물들을\n퇴치하기 위해 여행을 하고 있다지......\n@c0@"
  sl: "@a@b佛恩王：你们好像是为了\n　　消灭残留的魔物，\n　　才踏上旅程的吧……\n@c0@"
  tl: "@a@b佛恩王：你們好像是為了\n　　消滅殘留的魔物，\n　　才踏上旅程的吧……\n@c0@"
11:
  en: "@aKing Ludwig@bThen I beg of you! Find this Spiegel and defeat him!\n@c0@"
  ja: "@a@bフォーン王「たのむ！　ミラルゴを……\n\tヤツを　さがしだし\n\t倒してきてはくれぬかっ！？\n@c0@"
  ko: "@a@b폰 왕: 부탁하오! 미랄고를......\n놈을 찾아서\n물리쳐 줄 수 있겠소!?\n@c0@"
  sl: "@a@b佛恩王：拜托了！能不能\n　　帮我找到米拉尔戈，\n　　然后打倒他？！\n@c0@"
  tl: "@a@b佛恩王：拜託了！能不能\n　　幫我找到米拉爾戈，\n　　然後打倒他？！\n@c0@"
12:
  en: "@aKing Ludwig@bThat's the spirit! Wonderful! My chancellor here will tell you everything you need to know.\n@c0@"
  ja: "@a@bフォーン王「おお！　やってくれるか！\n\tでは　あとのことは　そこの\n\t大臣に　聞いてほしい。\n@c0@"
  ko: "@a@b폰 왕: 오오! 해 주겠다는 거요!\n그럼 나머지는 저기 있는\n대신에게 들어 주었으면 하오.\n@c0@"
  sl: "@a@b佛恩王：哦！你们愿意啊！\n　　那接下来的事情就去\n　　问那边的大臣吧。\n@c0@"
  tl: "@a@b佛恩王：哦！你們願意啊！\n　　那接下來的事情就去\n　　問那邊的大臣吧。\n@c0@"
13:
  en: "@aKing Ludwig@bI'm counting on you, %a000120!\n@c0@"
  ja: "@a@bフォーン王「たのんだぞ　%a000120！\n@c0@"
  ko: "@a@b폰 왕: 잘 부탁하오, %a000120!\n@c0@"
  sl: "@a@b佛恩王：拜托了，%a000120！\n@c0@"
  tl: "@a@b佛恩王：拜託了，%a000120！\n@c0@"
14:
  en: "@aKing Ludwig@b%0%a000120... It is %a000120, is it not? Look, I am begging you. You are the only one who can help me...\n@c0@"
  ja: "@a@bフォーン王「%a000120と　申したな。\n\tそなたたちだけが\n\tたより　なのだ……。\n@c0@"
  ko: "@a@b폰 왕: %a000120%F0120%X라%Y이라%Z고 했지.\n그대들만이\n내 유일한 희망이라오......\n@c0@"
  sl: "@a@b佛恩王：你叫%a000120吧。\n　　只有你们才靠得住……\n@c0@"
  tl: "@a@b佛恩王：你叫%a000120吧。\n　　只有你們才靠得住……\n@c0@"
15:
  en: "@aKing Ludwig@bThat mirror has been on the wall of this castle for as long as I can remember.\n@c0@"
  ja: "@a@bフォーン王「あの鏡は\n\t私が　物心つく前から\n\tこの城に　かざられていた。\n@c0@"
  ko: "@a@b---점프---> #042022로\n@c0@"
  sl: "@a@b佛恩王：那面镜子\n　　在我懂事之前，\n　　就在这座城里了。\n@c0@"
  tl: "@a@b佛恩王：那面鏡子\n　　在我懂事之前，\n　　就在這座城裡了。\n@c0@"
16:
  en: "@aKing Ludwig@bWhen I was growing up, the princess in the mirror was my only friend. We would talk for hours.\n@c0@"
  ja: "@a@bフォーン王「私は　鏡の中の\n\t彼女を　話し相手に\n\t育ってきたのだ。\n@c0@"
  ko: "@a@b폰 왕: 그 거울은\n내가 철이 들었을 무렵부터\n이 성에 걸려 있었소.\n@c0@"
  sl: "@a@b佛恩王：我一直都跟\n　　镜中的公主说话，\n　　直到今天。\n@c0@"
  tl: "@a@b佛恩王：我一直都跟\n　　鏡中的公主說話，\n　　直到今天。\n@c0@"
17:
  en: "@aKing Ludwig@bOf course, she never answered my questions, but sometimes she would reply with a smile.\n@c0@"
  ja: "@a@bフォーン王「もちろん　彼女からの\n\t返事は　なかったが\n\t彼女は　笑顔で　答えてくれた。\n@c0@"
  ko: "@a@b폰 왕: 나는 거울 속의\n공주와 이야기를 나누며\n성장해 왔다오.\n@c0@"
  sl: "@a@b佛恩王：她当然没有任何回答，\n　　但是却用笑容\n　　做出了回应。\n@c0@"
  tl: "@a@b佛恩王：她當然沒有任何回答，\n　　但是卻用笑容\n　　做出了回應。\n@c0@"
18:
  en: "@aKing Ludwig@bRescuing her is my only ambition, and you are the only one who can help me. I'm begging you, %a000120!\n@c0@"
  ja: "@a@bフォーン王「……私は　彼女を\n\t救い出したいのだ。\n\tたのんだぞ　%a000120！\n@c0@"
  ko: "@a@b폰 왕: 물론 공주로부터\n대답을 들을 수는 없었지만\n공주는 미소로 답해 주었지.\n@c0@"
  sl: "@a@b佛恩王：……我想把她救出来。\n　　拜托了，%a000120！\n@c0@"
  tl: "@a@b佛恩王：……我想把她救出來。\n　　拜託了，%a000120！\n@c0@"
19:
  en: "@a@b*: If what is written in the book is true...\n@c0@"
  ja: "@a@b＊「もし　あの物語が\n\t事実を　書いているのなら……\n@c0@"
  ko: "@a@b폰 왕: ......나는 공주를\n꼭 구해내고 싶소.\n잘 부탁하오, %a000120!\n@c0@"
  sl: "@a@b＊：如果那个故事里\n　　写的事情是真事的话……\n@c0@"
  tl: "@a@b＊：如果那個故事裡\n　　寫的事情是真事的話……\n@c0@"
20:
  en: "@a@b*: Then Spiegel lives at the top of a tower surrounded by a lake, located to the north of this castle.\n@c0@"
  ja: "@a@b＊「ミラルゴは　城の北にある\n\t湖にかこまれた　塔の上に\n\t住んでいると……。\n@c0@"
  ko: "@a@b*: 만약 그 이야기가\n사실을 기록한 것이라면......\n@c0@"
  sl: "@a@b＊：故事里写着米拉尔戈\n　　住在城北一座\n　　被湖水环绕的塔里……\n@c0@"
  tl: "@a@b＊：故事裡寫著米拉爾戈\n　　住在城北一座\n　　被湖水環繞的塔里……\n@c0@"
21:
  en: "@a@b*: Of course, there is no tower to the north of here, so Goddess knows how we'll ever find him...\n@c0@"
  ja: "@a@b＊「しかし　この城の北には\n\t塔なぞは　ないし……。\n\tいやはや　まったく……。\n@c0@"
  ko: "@a@b*: 미랄고는 성 북쪽의\n호수로 둘러싸인 탑 위에\n살고 있다고......\n@c0@"
  sl: "@a@b＊：但是这座城北边\n　　没有什么塔啊……\n　　哎呀，这真是……\n@c0@"
  tl: "@a@b＊：但是這座城北邊\n　　沒有什麼塔啊……\n　　哎呀，這真是……\n@c0@"
22:
  en: "@a@b*: (sigh) Anyway, if you do manage to find Spiegel's tower, try casting Peep in front of its door.\n@c0@"
  ja: "@a@b＊「だが　もし！　ミラルゴの塔を\n\t見つけたなら　そのトビラの前で\n\tインパスを　となえなされ。\n@c0@"
  ko: "@a@b*: 허나 이 성의 북쪽에\n탑 같은 건 없으니......\n이게 어찌 된 노릇인지......\n@c0@"
  sl: "@a@b＊：不过要是找到了\n　　米拉尔戈的塔的话，\n　　就在大门前咏唱伊恩帕斯吧。\n@c0@"
  tl: "@a@b＊：不過要是找到了\n　　米拉爾戈的塔的話，\n　　就在大門前詠唱伊恩帕斯吧。\n@c0@"
23:
  en: "@a@b*: According to the story in the book, that's the only way to get inside.\n@c0@"
  ja: "@a@b＊「物語が　真実なら\n\tそれで　塔の　トビラが\n\tひらくはずじゃ。\n@c0@"
  ko: "@a@b*: 허나 만일! 미랄고의 탑을\n발견하면 그 문 앞에서\n인파스를 외치시게.\n@c0@"
  sl: "@a@b＊：如果故事是真事的话，\n　　那样塔门应该\n　　就能打开。\n@c0@"
  tl: "@a@b＊：如果故事是真事的話，\n　　那樣塔門應該\n　　就能打開。\n@c0@"
24:
  en: "@a@b*: Hmm... Something's not quite right with the story in that book.\n@c0@"
  ja: "@a@b＊「あの物語に　ついては　わしも\n\tおかしいと　思っておった。\n@c0@"
  ko: "@a@b*: 이야기가 사실이라면\n그걸로 탑의 문이\n열릴걸세.\n@c0@"
  sl: "@a@b＊：老夫也觉得\n　　那个故事怪怪的。\n@c0@"
  tl: "@a@b＊：老夫也覺得\n　　那個故事怪怪的。\n@c0@"
25:
  en: "@a@b*: It says that the sorcerer who kidnapped the Princess cast a spell so that she would live forever...\n@c0@"
  ja: "@a@b＊「なにしろ　王子のもとより\n\t姫をうばった　魔法使いは\n\t永遠の命の　呪いを　かけた……\n@c0@"
  ko: "@a@b*: 그 이야기는 나도\n이상하다고 생각하고 있었다네.\n@c0@"
  sl: "@a@b＊：你想啊，魔法师从\n　　王子身边抢走了公主，\n　　诅咒她长生不老……\n@c0@"
  tl: "@a@b＊：你想啊，魔法師從\n　　王子身邊搶走了公主，\n　　詛咒她長生不老……\n@c0@"
26:
  en: "@a@b*: And then it suddenly ends.\n@c0@"
  ja: "@a@b＊「そこで　物語が　終わって\n\tおるんじゃよ。\n@c0@"
  ko: "@a@b*: 그렇게 왕자로부터\n공주를 빼앗은 마법사는\n영원한 생명의 저주를 걸었다......\n@c0@"
  sl: "@a@b＊：然后故事就在这里\n　　戛然而止了。\n@c0@"
  tl: "@a@b＊：然後故事就在這裡\n　　戛然而止了。\n@c0@"
27:
  en: "@a@b*: Strange, isn't it? It's almost as if the ending was never written...\n@c0@"
  ja: "@a@b＊「結末が　書かれていないのじゃ。\n\tおかしいじゃろう？\n@c0@"
  ko: "@a@b*: 거기서 이야기가\n끝나 있다네.\n@c0@"
  sl: "@a@b＊：没有写结局啊。\n　　很奇怪吧？\n@c0@"
  tl: "@a@b＊：沒有寫結局啊。\n　　很奇怪吧？\n@c0@"
28:
  en: "@a@b*: You know, I just realised something rather extraordinary.\n@c0@"
  ja: "@a@b＊「ひとつ　気づいたことが\n\tあるんだ。\n@c0@"
  ko: "@a@b*: 결말이 쓰여 있지 않단 말이네.\n이상하지 않나?\n@c0@"
  sl: "@a@b＊：我注意到一件事。\n@c0@"
  tl: "@a@b＊：我注意到一件事。\n@c0@"
29:
  en: "@a@b*: The prince from that book looks an awful lot like King Ludwig, don't you think?\n@c0@"
  ja: "@a@b＊「その物語の主人公の　王子は\n\tなんとなく　フォーン王に\n\t似てるんじゃ　ないかってね。\n@c0@"
  ko: "@a@b*: 내가 느낀 게\n하나 있어.\n@c0@"
  sl: "@a@b＊：故事主人公那个王子\n　　好像和佛恩王\n　　有点像啊。\n@c0@"
  tl: "@a@b＊：故事主人公那個王子\n　　好像和佛恩王\n　　有點像啊。\n@c0@"
30:
  en: "@a@b*: But perhaps I'm reading too much into it...\n@c0@"
  ja: "@a@b＊「私の　気のせいかな。\n@c0@"
  ko: "@a@b*: 그 이야기의 주인공인 왕자는\n왠지 폰 왕을\n닮은 것 같다는 생각이 들거든.\n@c0@"
  sl: "@a@b＊：是我的错觉吧。\n@c0@"
  tl: "@a@b＊：是我的錯覺吧。\n@c0@"
31:
  en: "@a@b*: Apparently, a very long time ago, a tower stood to the north of here.\n@c0@"
  ja: "@a@b＊「私　聞いたことあるわ。\n\tずーっと昔　この城の北に\n\tなにかの塔が　たってたんだって。\n@c0@"
  ko: "@a@b*: 내 착각인가?\n@c0@"
  sl: "@a@b＊：我听说过一件事。\n　　很久很久以前，\n　　这座城北边有一座塔。\n@c0@"
  tl: "@a@b＊：我聽說過一件事。\n　　很久很久以前，\n　　這座城北邊有一座塔。\n@c0@"
32:
  en: "@a@b*: I wonder what became of it...\n@c0@"
  ja: "@a@b＊「今は……　さあ　どうかな？\n@c0@"
  ko: "@a@b*: 나, 들은 적 있어.\n아주 먼 옛날에는 이 성 북쪽에\n무슨 탑이 있었대.\n@c0@"
  sl: "@a@b＊：现在……谁知道啊。\n@c0@"
  tl: "@a@b＊：現在……誰知道啊。\n@c0@"
33:
  en: "@a@b*: They say a tower once stood in this very spot long ago. 'Course, there isn't much of anything here nowadays.\n@c0@"
  ja: "@a@b＊「このあたりに　大昔\n\t塔が　たっていたらしいが\n\t今は　このとおりじゃよ。\n@c0@"
  ko: "@a@b*: 지금은...... 글쎄. 어떨까?\n@c0@"
  sl: "@a@b＊：这里在很久以前\n　　曾有一座塔，但是现在\n　　已经是这副模样。\n@c0@"
  tl: "@a@b＊：這裡在很久以前\n　　曾有一座塔，但是現在\n　　已經是這副模樣。\n@c0@"
34:
  en: "@a@b*: But you know, sometimes when I sleep down here, I have the most vivid dream...\n@c0@"
  ja: "@a@b＊「じゃが　ここにいると\n\tときどき　ふしぎな夢を\n\t見たりもするぞ。\n@c0@"
  ko: "@a@b*: 먼 옛날 이 주변에는\n탑이 있었다는데\n지금은 보는 바와 같다네.\n@c0@"
  sl: "@a@b＊：不过在这里\n　　时不时会做一些\n　　不可思议的梦呢。\n@c0@"
  tl: "@a@b＊：不過在這裡\n　　時不時會做一些\n　　不可思議的夢呢。\n@c0@"
35:
  en: "@a@b*: I'm in in this enormous desert, and there's a tower smack bang in the middle of it.\n㈡\n*: And at the top of that tower lives a mysterious sorcerer...\n@c0@"
  ja: "@a@b＊「ものすごく広い　砂漠の真ん中に\n\t塔がたっておっての……\n@c0@"
  ko: "@a@b*: 헌데 여기 있으면\n가끔 희한한 꿈을\n꿀 때가 있다네.\n@c0@"
  sl: "@a@b＊：我梦见在一片无边沙漠的中央\n　　矗立着一座塔……\n@c0@"
  tl: "@a@b＊：我夢見在一片無邊沙漠的中央\n　　矗立著一座塔……\n@c0@"
36:
  en: "@a@b*: Strange, isn't it? Ever seen a desert like that?\n@c0@"
  ja: "@a@b＊「その塔の上には\n\t魔法使いが　住んでおるのじゃよ。\n\tどこなんじゃろうな　あれは……。\n@c0@"
  ko: "@a@b*: 어마어마하게 넓은 사막 한가운데에\n탑이 세워져 있었지......\n@c0@"
  sl: "@a@b＊：有一个魔法师\n　　住在那座塔里。\n　　那到底在哪里啊……\n@c0@"
  tl: "@a@b＊：有一個魔法師\n　　住在那座塔里。\n　　那到底在哪裡啊……\n@c0@"
37:
  en: "@a@b*: Zzzz... Zzzz...\n@c0@"
  ja: "@a@b＊「こっくり　こっくり……。\n@c0@"
  ko: "@a@b*: 그 탑 위에는\n마법사가 살고 있었다네.\n어디일까, 그건......\n@c0@"
  sl: "@a@b＊：呼噜，呼噜……\n@c0@"
  tl: "@a@b＊：呼嚕，呼嚕……\n@c0@"
