155:
  en: "@aMayor@bI've heard that the travelling merchant trade is exceedingly dangerous. There's no telling what fate has in store for her...\n@c0@"
  ja: "@a@b町長「旅の商人といえば　町から町へ\n\tものを売り歩く　キケンな仕事だ。\n\tあの娘が　無事でいるかどうか。\n@c0@"
  ko: "@a@b촌장: 응? 뭐지, 그 표정은?\n뭔가 하고 싶은 말이라도\n있는가?\n@c0@"
  sl: "@a@b镇长：旅行商人从一个镇到另一个镇，\n　　路上一定非常危险。\n　　不知那姑娘是不是平安。\n@c0@"
  tl: "@a@b鎮長：旅行商人從一個鎮到另一個鎮，\n　　路上一定非常危險。\n　　不知那姑娘是不是平安。\n@c0@"
156:
  en: "@aMayor@bIf what you say is true, then that girl has suffered a grave injustice at my hands...\n@c0@"
  ja: "@a@b町長「もし　その話が　本当なら\n\tあの娘には　わるいことを\n\tしてしまったな。\n@c0@"
  ko: "@a@b촌장: 헉, 뭐라고?\n멜라니가 범인이 아니라고?\n@c0@"
  sl: "@a@b镇长：要是你没骗我，\n　　就真的是我对不起那姑娘。\n@c0@"
  tl: "@a@b鎮長：要是你沒騙我，\n　　就真的是我對不起那姑娘。\n@c0@"
157:
  en: "@aMayor@bWell, I'm sure you wouldn't concoct such a story for a common maid's sake, but it would've been nice if you'd told me earlier.\n@c0@"
  ja: "@a@b町長「まあ　お前さんたちが　ウソを\n\tついてるとは言わんが　そういう話は\n\tもっと　はやく　してほしかったな。\n@c0@"
  ko: "@a@b촌장: 어떻게 아니라고\n단정 지을 수 있지?\n직접 보기라도 한 게냐?\n@c0@"
  sl: "@a@b镇长：我倒是愿意相信你们的话，\n　　不过你们能再早点出现就好了。\n@c0@"
  tl: "@a@b鎮長：我倒是願意相信你們的話，\n　　不過你們能再早點出現就好了。\n@c0@"
158:
  en: "@aMayor@bI'm afraid there's nothing I can do now. It's a little too late.\n@c0@"
  ja: "@a@b町長「今になって　言われても\n\tもう　手おくれだよ。\n@c0@"
  ko: "@a@b촌장: 이럴 수가, 아만다가 범인!?\n@c0@"
  sl: "@a@b镇长：事到如今，\n　　说什么都晚了。\n@c0@"
  tl: "@a@b鎮長：事到如今，\n　　說什麼都晚了。\n@c0@"
159:
  en: "@aMayor@bWell why are you here then? A mayor's schedule cannot accommodate such inane banter. There's the door. Out you go!\n@c0@"
  ja: "@a@b町長「ふん！\n\t用がないなら　とっとと\n\t出ていってくれ！\n@c0@"
  ko: "@a@b촌장: 아만다라면 분명히\n우리 아들한테 홀딱 반한\n여관집 딸인데.\n@c0@"
  sl: "@a@b镇长：哼！\n　　没事的话就赶快出去吧！\n@c0@"
  tl: "@a@b鎮長：哼！\n　　沒事的話就趕快出去吧！\n@c0@"
160:
  en: "@aMayor@bThen you evidently have nothing of value to say. If you'd like to continue staring at me, commission a portrait. Now show yourself out, on the double!\n@c0@"
  ja: "@a@b町長「よくわかんない　連中だな。\n\t用がないなら　とっとと\n\t出ていってくれ！\n@c0@"
  ko: "@a@b촌장: 흐음. 만약 그 말이\n사실이라 해도\n이젠 이미 늦었어.\n@c0@"
  sl: "@a@b镇长：真是莫名其妙。\n　　没事的话就赶快出去吧！\n@c0@"
  tl: "@a@b鎮長：真是莫名其妙。\n　　沒事的話就趕快出去吧！\n@c0@"
161:
  en: "@aJohan@bIs there something I can do for you?\n@c0@"
  ja: "@a@bジョセフ「ボクに　なにか用ですか？\n@c0@"
  ko: "@a@b촌장: 실은 마침\n떠돌이 상인이 잡일을 거들 아이를\n찾고 있어서 말이야.\n@c0@"
  sl: "@a@b约瑟夫：找我有事吗？\n@c0@"
  tl: "@a@b約瑟夫：找我有事嗎？\n@c0@"
162:
  en: "@aJohan@bWhat!? You're saying Ella didn't fiddle with Mr Barkington's dinner!?\n@c0@"
  ja: "@a@bジョセフ「え？　メラニィのこと？\n\t彼女は　ペロのエサに毒を\n\t入れてないって？\n@c0@"
  ko: "@a@b촌장: 그래서 멜라니를\n보내버렸거든.\n@c0@"
  sl: "@a@b约瑟夫：嗯？美拉妮？\n　　她没给佩罗下毒？\n@c0@"
  tl: "@a@b約瑟夫：嗯？美拉妮？\n　　她沒給佩羅下毒？\n@c0@"
163:
  en: "@aJohan@bI knew it! Such a pure-hearted girl would never commit such an act! She wouldn't hurt a fly, let alone a dog!\n@c0@"
  ja: "@a@bジョセフ「やっぱり　そうか！\n\tボクの　思った通りだ！\n\t彼女は　そんなひとじゃない。\n@c0@"
  ko: "@a@b촌장: 이 마을 저 마을 떠돌며\n물건을 파는 위험한 일이니,\n멜라니가 무사한지는 알 수가 없다네.\n@c0@"
  sl: "@a@b约瑟夫：果然是这样！\n　　跟我想的一样！\n　　她不会这么恶毒的。\n@c0@"
  tl: "@a@b約瑟夫：果然是這樣！\n　　跟我想的一樣！\n　　她不會這麼惡毒的。\n@c0@"
164:
  en: "@aJohan@bWhy did I ever allow Papa to put doubt in my mind!? I should have done something to help her!\n@c0@"
  ja: "@a@bジョセフ「ああ　ボクは　なにを\n\t迷っていたのだろう。　彼女を\n\t助け出しもしないで。\n@c0@"
  ko: "@a@b촌장: 만약 그 말이 사실이라면\n멜라니에게 몹쓸 짓을\n하고 말았군.\n@c0@"
  sl: "@a@b约瑟夫：唉，我真是个没用的人。\n　　那时候要是能帮她就好了。\n@c0@"
  tl: "@a@b約瑟夫：唉，我真是個沒用的人。\n　　那時候要是能幫她就好了。\n@c0@"
165:
  en: "@aJohan@bYou have my eternal gratitude, whoever you are. Now, there's no time to waste, I must get after her!\n@c0@"
  ja: "@a@bジョセフ「どこのだれか　知りませんが\n\tありがとう！　ボクは　彼女を\n\tさがしに　行きます。\n@c0@"
  ko: "@a@b촌장: 자네들이 거짓말을 했다고\n여기지는 않네만, 그런 이야기는\n좀 더 빨리 해줬어야지.\n@c0@"
  sl: "@a@b约瑟夫：非常感谢你们，\n　　几位陌生的朋友！\n　　我要去找她了。\n@c0@"
  tl: "@a@b約瑟夫：非常感謝你們，\n　　幾位陌生的朋友！\n　　我要去找她了。\n@c0@"
166:
  en: "@aJohan@bDo excuse me.\n@c0@"
  ja: "@a@bジョセフ「ちょっと　失礼。\n@c0@"
  ko: "@a@b촌장: 이제와 얘기해봤자\n이미 늦었다네.\n@c0@"
  sl: "@a@b约瑟夫：失陪一下。\n@c0@"
  tl: "@a@b約瑟夫：失陪一下。\n@c0@"
167:
  en: "@aJohan@b...Wait. If you knew Ella was innocent, why didn't you speak up?\n@c0@"
  ja: "@a@bジョセフ「……でも　メラニィが\n\t犯人じゃないのを　知ってたなら\n\tなぜ　だまっていたんですか？\n@c0@"
  ko: "@a@b촌장: 흥!\n용건이 없다면 냉큼\n나가주게!\n@c0@"
  sl: "@a@b约瑟夫：……不过，\n　　你们知道犯人不是美拉妮，\n　　为什么当时不说出来呢？\n@c0@"
  tl: "@a@b約瑟夫：……不過，\n　　你們知道犯人不是美拉妮，\n　　為什麼當時不說出來呢？\n@c0@"
168:
  en: "@aJohan@bAh, I'm sorry. I'm hardly in a position to criticise you. I was equally complacent myself. I do apologise.\n@c0@"
  ja: "@a@bジョセフ「なんて　あなたたちを\n\tせめることは　ボクには\n\tできませんよね。　すみません。\n@c0@"
  ko: "@a@b촌장: 말이 안 통하는 녀석들이군.\n용건이 없다면 썩\n나가주게!\n@c0@"
  sl: "@a@b约瑟夫：啊，我……\n　　我不是要责难你们，\n　　对不起。\n@c0@"
  tl: "@a@b約瑟夫：啊，我……\n　　我不是要責難你們，\n　　對不起。\n@c0@"
169:
  en: "@aJohan@bI'd better go. But I must thank you again — you have given me a new lease of life!\n@c0@"
  ja: "@a@bジョセフ「それじゃ　ボクは　これで。\n\t本当に　ありがとう。\n@c0@"
  ko: "@a@b조셉: 제게 무슨 볼일이라도?\n@c0@"
  sl: "@a@b约瑟夫：那个，我告辞了。\n　　非常谢谢你们。\n@c0@"
  tl: "@a@b約瑟夫：那個，我告辭了。\n　　非常謝謝你們。\n@c0@"
170:
  en: "@a@b*: The cutie in the next cell got sent off wiv some dodgy merchant. She'll be miles away by now!\n@c0@"
  ja: "@a@b＊「となりに　入れられてた娘は\n\t旅の商人に　つれられて\n\t遠くに　行っちまったよ。\n@c0@"
  ko: "@a@b조셉: 네? 멜라니요?\n메로의 먹이에 독을\n넣은 건 멜라니가 아니라고요?\n@c0@"
  sl: "@a@b＊：关在旁边的那小姑娘\n　　被旅行商人带走了，\n　　去了很远的地方。\n@c0@"
  tl: "@a@b＊：關在旁邊的那小姑娘\n　　被旅行商人帶走了，\n　　去了很遠的地方。\n@c0@"
171:
  en: "@a@b*: I don't know wot that girl did, but I bet that cold-'earted Mayor overreacted. Remind me never to work for 'im, the pompous oaf.\n@c0@"
  ja: "@a@b＊「あの娘が　なにをしたかは\n\t知らねえけどよ。　町長のヤツ\n\tひでえことを　するもんだよな。\n@c0@"
  ko: "@a@b조셉: 역시 그랬군!\n내가 생각한 그대로야!\n그녀는 그런 사람이 아니야.\n@c0@"
  sl: "@a@b＊：那小姑娘究竟做了啥，\n　　俺完全不明白。\n　　镇长这家伙真是过分。\n@c0@"
  tl: "@a@b＊：那小姑娘究竟做了啥，\n　　俺完全不明白。\n　　鎮長這傢伙真是過分。\n@c0@"
172:
  en: "@a@b*: I don't want to alarm the local populace, but I heard that Murdaw's power is increasing daily.\n@c0@"
  ja: "@a@b＊「あまり大きな声では　言えぬが\n\t魔王ムドーは　日ごとに\n\tそのチカラを　増しているらしいのだ。\n@c0@"
  ko: "@a@b조셉: 아아, 나는 무얼\n망설였단 말인가. 결국 멜라니를\n구해내지도 못 하고.\n@c0@"
  sl: "@a@b＊：小声告诉你，\n　　魔王姆多的力量越来越强了。\n@c0@"
  tl: "@a@b＊：小聲告訴你，\n　　魔王姆多的力量越來越強了。\n@c0@"
173:
  en: "@a@b*: The King of Somnia tried to stop him, but look what happened there...\n@c0@"
  ja: "@a@b＊「しかし　それを　とめようとした\n\tレイドック王も　あんなことに\n\tなってしまって……。\n@c0@"
  ko: "@a@b조셉: 어디의 누구신지 모르겠지만\n고맙습니다! 저는 그녀를\n찾으러 가겠습니다.\n@c0@"
  sl: "@a@b＊：本来雷多克王\n　　可以阻止魔王姆多，\n　　但是现在……\n@c0@"
  tl: "@a@b＊：本來雷多克王\n　　可以阻止魔王姆多，\n　　但是現在……\n@c0@"
174:
  en: "@a@b*: Oh! Erm, forget I said that! Long live the King!\n@c0@"
  ja: "@a@b＊「おっと　これは　言わぬ約束。\n\tすまん　忘れてくれ。\n@c0@"
  ko: "@a@b조셉: 잠깐 실례.\n@c0@"
  sl: "@a@b＊：哎呀，这可不能说。\n　　抱歉，请当作没听过。\n@c0@"
  tl: "@a@b＊：哎呀，這可不能說。\n　　抱歉，請當做沒聽過。\n@c0@"
175:
  en: "@a@b*: Meow.\n@c0@"
  ja: "@a@b＊「にゃーん。\n@c0@"
  ko: "@a@b조셉: ...... 그런데 멜라니가\n범인이 아닌 줄 알았다면\n왜 잠자코 있었습니까?\n@c0@"
  sl: "@a@b＊：喵。\n@c0@"
  tl: "@a@b＊：喵。\n@c0@"
176:
  en: "@aIvy@bOh, great. This is just my luck. I knew the old Mayor would lose his rag, but I didn't think he'd run the girl out of town!\n@c0@"
  ja: "@a@bアマンダ「あーあ　まいっちゃうわ。\n\tまさか　メラニィが　この町を\n\t追い出されちゃうなんて。\n@c0@"
  ko: "@a@b조셉: 하긴, 제 주제에 당신들을\n나무랄 수는 없겠죠.\n죄송합니다.\n@c0@"
  sl: "@a@b阿曼达：哎呀，这下糟了。\n　　没想到美拉妮会被赶出镇子。\n@c0@"
  tl: "@a@b阿曼達：哎呀，這下糟了。\n　　沒想到美拉妮會被趕出鎮子。\n@c0@"
177:
  en: "@aIvy@bI never meant for things to go this far!\n@c0@"
  ja: "@a@bアマンダ「そこまで　するつもりは\n\tなかったのになあ……。\n@c0@"
  ko: "@a@b조셉: 그럼 저는 이만.\n정말 고맙습니다.\n@c0@"
  sl: "@a@b阿曼达：我没想要这样啊……\n@c0@"
  tl: "@a@b阿曼達：我沒想要這樣啊……\n@c0@"
178:
  en: "@aIvy@bHuh? Oh, %H0860%Xa customer%Ycustomers%Z! Welcome! Uh, don't pay any attention to my blabbering! Ha ha! Ha! Er...\n@c0@"
  ja: "@a@bアマンダ「あら　やだ　お客さま？\n\tな　なんでもないのよ\n\tオホホホホッ…。\n@c0@"
  ko: "@a@b*: 옆에 갇혀 있던 아가씨는\n떠돌이 상인이 데리고\n멀리 떠났어.\n@c0@"
  sl: "@a@b阿曼达：哎呀，要住店吗？\n　　刚、刚才我什么也没说，\n　　哦呵呵呵呵……\n@c0@"
  tl: "@a@b阿曼達：哎呀，要住店嗎？\n　　剛、剛才我什麼也沒說，\n　　哦呵呵呵呵……\n@c0@"
179:
  en: "@a@b*: That old man's been a shadow of his former self since Ella went away. It's a right tragedy.\n@c0@"
  ja: "@a@b＊「メラニィちゃんが\n\tいなくなってから　じいさん\n\tすっかり　元気がなくなったな。\n@c0@"
  ko: "@a@b*: 그 아가씨가 무슨 죄를\n지었는지는 모르겠지만, 촌장 놈이\n너무 심했지.\n@c0@"
  sl: "@a@b＊：美拉妮姑娘不在之后，\n　　那个老爷子就无精打采的。\n@c0@"
  tl: "@a@b＊：美拉妮姑娘不在之後，\n　　那個老爺子就無精打采的。\n@c0@"
180:
  en: "@a@b*: He spends his days starin' out at sea. I'm just hopin' he doesn't go completely loopy.\n@c0@"
  ja: "@a@b＊「ここのところ　ずっと\n\t遠くの海ばかり　ながめてて\n\t身体でも　こわさなきゃ　いいが。\n@c0@"
  ko: "@a@b*: 큰 소리로 말할 순 없지만\n마왕 무도의 힘이\n나날이 커지고 있다더군.\n@c0@"
  sl: "@a@b＊：他每天都在眺望大海，\n　　这样下去身体要垮了啊。\n@c0@"
  tl: "@a@b＊：他每天都在眺望大海，\n　　這樣下去身體要垮了啊。\n@c0@"
181:
  en: "@a@b*: Hello! %H0860%XA customer%YCustomers%Z, are ye? In that case, nip round to the counter for me, would ye?\n@c0@"
  ja: "@a@b＊「いらっしゃい　お客さんかい？\n\tだったら　外に　まわって\n\tカウンターごしに　話してくんな。\n@c0@"
  ko: "@a@b*: 하지만 그걸 막으려 \n했던 레이독 왕도 그런 꼴이\n돼 버렸으니......\n@c0@"
  sl: "@a@b＊：欢迎，您要买东西？\n　　请到外面去，\n　　隔着柜台跟我说话吧。\n@c0@"
  tl: "@a@b＊：歡迎，您要買東西？\n　　請到外面去，\n　　隔著櫃檯跟我說話吧。\n@c0@"
182:
  en: "@a@b*: You're not from round here, are you? My mum told me that there's monsters outside of town. Is that true?\n@c0@"
  ja: "@a@b＊「あんたら　よそから来たのか？\n\tだったら　町の外は\n\tまものだらけ　だったろう？\n@c0@"
  ko: "@a@b*: 아차, 이건 비밀인데.\n지금 얘긴 잊어 줘.\n@c0@"
  sl: "@a@b＊：你们是从外面来的？\n　　那，\n　　外面是不是到处有魔物？\n@c0@"
  tl: "@a@b＊：你們是從外面來的？\n　　那，\n　　外面是不是到處有魔物？\n@c0@"
183:
  en: "@a@b*: Of course it is! My mum knows everything!\n@c0@"
  ja: "@a@b＊「やっぱりなあ……。\n@c0@"
  ko: "@a@b*: 야~옹.\n@c0@"
  sl: "@a@b＊：果然是啊……\n@c0@"
  tl: "@a@b＊：果然是啊……\n@c0@"
184:
  en: "@a@b*: You better not be lying to me! If I pop out of town now and get mangled by a monster, it's all your fault!\n@c0@"
  ja: "@a@b＊「どうして　そういうウソをつくわけ？\n\tそれを信じて　外に行って　死んだら\n\tあんたらのせい　だからね。\n@c0@"
  ko: "@a@b아만다: 아아, 어쩜 좋아.\n설마 멜라니가 이 마을에서\n쫓겨날 줄이야.\n@c0@"
  sl: "@a@b＊：为什么要骗我呢？\n　　如果我信了你的话跑到外面去死了，\n　　就都是你的过错。\n@c0@"
  tl: "@a@b＊：為什麼要騙我呢？\n　　如果我信了你的話跑到外面去死了，\n　　就都是你的過錯。\n@c0@"
185:
  en: "@a@b*: I don't rightly know why, but there's been a lot more people buyin' weapons recently.\n@c0@"
