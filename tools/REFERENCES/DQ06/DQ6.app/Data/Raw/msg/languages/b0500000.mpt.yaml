1:
  en: "@a@b*: Be careful, %a000090. I sense that our presence here has not gone unnoticed.\n@c0@"
  ja: "@a@b＊「%a000090　気をつけて。\n\tもう私たちのこと　気づかれていても\n\t不思議じゃないんだから。\n@c0@"
  ko: "@a@b*: %a000090, 조심해.\n이미 우리가 들켰다고 해도\n이상할 게 없으니까.\n@c0@"
  sl: "@a@b＊：%a000090注意周围。\n　　现在就算我们被发现了\n　　也不足为奇。\n@c0@"
  tl: "@a@b＊：%a000090注意周圍。\n　　現在就算我們被發現了\n　　也不足為奇。\n@c0@"
2:
  en: "@a@b*: Right, let's push on.\n@c0@"
  ja: "@a@b＊「さあ　先に　進みましょう。\n@c0@"
  ko: "@a@b*: 자, 계속 가보자.\n@c0@"
  sl: "@a@b＊：继续往前走吧。\n@c0@"
  tl: "@a@b＊：繼續往前走吧。\n@c0@"
3:
  en: "@a@b*: Ya gettin' a whiff of this foul air? Aye, this is Murdaw's castle, alright.\n@c0@"
  ja: "@a@b＊「さすが　魔王の城だ。\n\t化け物の　においが\n\tプンプンするぜ……。\n@c0@"
  ko: "@a@b*: 과연 마왕의 성이군.\n괴물 냄새가\n진동하고 있어......\n@c0@"
  sl: "@a@b＊：不愧是魔王城堡。\n　　到处都是\n　　魔物的气味……\n@c0@"
  tl: "@a@b＊：不愧是魔王城堡。\n　　到處都是\n　　魔物的氣味……\n@c0@"
4:
  en: "@a@b*: Keep your eyes peeled, %a000090! The enemy could strike at any moment!\n@c0@"
  ja: "@a@b＊「あたりに　気をつけろよ　%a000090！\n\t敵さんは　どこから　おそって来るか\n\tわからないからな！\n@c0@"
  ko: "@a@b*: 주위를 조심해!\n적이 어디서 공격해 올지\n모르니까.\n@c0@"
  sl: "@a@b＊：注意周围啊%a000090！\n　　这么危险的地方\n　　随时会有敌人！\n@c0@"
  tl: "@a@b＊：注意周圍啊%a000090！\n　　這麼危險的地方\n　　隨時會有敵人！\n@c0@"
5:
  en: "@a@b*: It seems that Murdaw has already decided the path to our destiny...\n@c0@"
  ja: "@a@b＊「どうやら　私たちの　進む方向は\n\tムドーに　決められているようね。\n@c0@"
  ko: "@a@b*: 아무래도 우리가 나아갈 방향은\n무도한테로 정해져 있나 보네.\n@c0@"
  sl: "@a@b＊：我们最终的目标\n　　是魔王姆多吧。\n@c0@"
  tl: "@a@b＊：我們最終的目標\n　　是魔王姆多吧。\n@c0@"
6:
  en: "@a@b*: So ol' Murdaw keeps his doors locked, aye?\n@c0@"
  ja: "@a@b＊「大魔王にしちゃ\n\tやけに　戸じまりが\n\tげんじゅうだな。\n@c0@"
  ko: "@a@b*: 대마왕치고는\n문단속이 너무\n심한 것 같군.\n@c0@"
  sl: "@a@b＊：大魔王这厮\n　　把门关得这么严，\n　　防范意识真强。\n@c0@"
  tl: "@a@b＊：大魔王這廝\n　　把門關得這麼嚴，\n　　防範意識真強。\n@c0@"
7:
  en: "@a@b*: Ya think he's scared of me? He better be.\n@c0@"
  ja: "@a@b＊「まっ　それだけ　オレたちのことを\n\t怖がってるのかも　しれねえぜ。\n@c0@"
  ko: "@a@b*: 뭐, 그만큼 우리를\n무서워하는 건지도 모르지.\n@c0@"
  sl: "@a@b＊：哈，正因为这样，\n　　才证明他害怕咱们。\n@c0@"
  tl: "@a@b＊：哈，正因為這樣，\n　　才證明他害怕咱們。\n@c0@"
8:
  en: "@a@b*: The presence of evil up here is stifling...\n@c0@"
  ja: "@a@b＊「い…息苦しいほどの\n\t邪悪な　けはいを　感じるわ。\n@c0@"
  ko: "@a@b*: 아아... 숨이 막힐 정도로\n사악한 기운이 느껴져.\n@c0@"
  sl: "@a@b＊：这里到处都是邪气，\n　　真让人不舒服。\n@c0@"
  tl: "@a@b＊：這裡到處都是邪氣，\n　　真讓人不舒服。\n@c0@"
9:
  en: "@a@b*: Aye, you feel that? We're closin' in on somethin' evil. It's like the air's suddenly gettin' heavy.\n@c0@"
  ja: "@a@b＊「くそっ……。\n\tまわりの空気が　やけに重ったるいぜ！\n\tけど　敵さんの姿は　見えねえな。\n@c0@"
  ko: "@a@b*: 빌어먹을......\n주위 공기가 몹시도 답답하군!\n그런데도 적의 모습은 안 보여.\n@c0@"
  sl: "@a@b＊：哼……\n　　周围的气氛越来越凝重！\n　　可是一个敌人也看不见。\n@c0@"
  tl: "@a@b＊：哼……\n　　周圍的氣氛越來越凝重！\n　　可是一個敵人也看不見。\n@c0@"
10:
  en: "@a@b*: Are you ready, %a000090? It's time!\n@c0@"
  ja: "@a@b＊「覚悟は　決まった？　%a000090！\n\tさあ　行くわよ！\n@c0@"
  ko: "@a@b*: 각오는 됐어? %a000090!\n자, 가자!\n@c0@"
  sl: "@a@b＊：你下定决心了吗？%a000090！\n　　走吧！\n@c0@"
  tl: "@a@b＊：你下定決心了嗎？%a000090！\n　　走吧！\n@c0@"
11:
  en: "@a@b*: Bah! I'm through with thinkin'! After you, %a000090!\n@c0@"
  ja: "@a@b＊「ええい！　考えてても　しょうがねえ。\n\tさっさと　のりこもうぜ！　%a000090！\n@c0@"
  ko: "@a@b*: 에잇! 생각해 봤자 소용없어\n얼른 쳐들어가자고 %a000090!\n@c0@"
  sl: "@a@b＊：算了！想那么多也没用。\n　　咱们上吧！%a000090！\n@c0@"
  tl: "@a@b＊：算了！想那麼多也沒用。\n　　咱們上吧！%a000090！\n@c0@"
12:
  en: "@a@b*: What are you doing, %a000090!? We need to get to Murdaw, quickly!\n@c0@"
  ja: "@a@b＊「%a000090！　何をしているの！？\n\t早く　魔王のところへ！\n@c0@"
  ko: "@a@b*: %a000090! 뭐 하고 있어!?\n빨리 마왕한테 가야지!\n@c0@"
  sl: "@a@b＊：%a000090！你在干什么？！\n　　快点去找魔王！\n@c0@"
  tl: "@a@b＊：%a000090！你在幹什麼？！\n　　快點去找魔王！\n@c0@"
13:
  en: "@a@b*: Avast, %a000090! This ain't the right way! Ya want that slimy Murdaw to slip away on us!?\n@c0@"
  ja: "@a@b＊「おいおい　%a000090！\n\tこっちじゃ　ないだろう！\n\t魔王が　逃げちまうぞ！\n@c0@"
  ko: "@a@b*: 어이 어이, %a000090!\n이쪽이 아니잖아!\n그러다 마왕이 달아나겠어!\n@c0@"
  sl: "@a@b＊：错了%a000090！\n　　不是这边！\n　　再不过去魔王要逃啦！\n@c0@"
  tl: "@a@b＊：錯了%a000090！\n　　不是這邊！\n　　再不過去魔王要逃啦！\n@c0@"
