0:
  en: "@a%0%a002000@bJust how tall is this tower? Maybe it got its name 'cause it goes all the way to the moon...\n@c0@"
  ja: "@a@b%a002000「すっごく　高い塔だな！\n\t上のほうが　よく見えないぞ。\n@c0@"
  ko: "@a@b%a002000: 굉장히 높은 탑이군!\n위쪽이 안 보일 정도야.\n@c0@"
  sl: "@a@b%a002000：这塔真高哇！\n　　一眼望不到顶。\n@c0@"
  tl: "@a@b%a002000：這塔真高哇！\n　　一眼望不到頂。\n@c0@"
1:
  en: "@a%0%a002010@bThere's something sinister about this place...\n@c0@"
  ja: "@a@b%a002010「なんだか　あやしい\n\tふんいきのする塔ね。\n@c0@"
  ko: "@a@b%a002010: 뭔가 기이한\n느낌이 드는 탑이야.\n@c0@"
  sl: "@a@b%a002010：这座塔的气氛\n　　似乎很奇怪。\n@c0@"
  tl: "@a@b%a002010：這座塔的氣氛\n　　似乎很奇怪。\n@c0@"
2:
  en: "@a%0%a002000@bLocked, aye? Great.\n@c0@"
  ja: "@a@b%a002000「チッ！\n\tカギが　かかってるのか。\n@c0@"
  ko: "@a@b%a002000: 쳇!\n잠겨 있잖아.\n@c0@"
  sl: "@a@b%a002000：嘁！\n　　门上着锁啊。\n@c0@"
  tl: "@a@b%a002000：嘁！\n　　門上著鎖啊。\n@c0@"
3:
  en: "@a%0%a002010@bIt looks like we'll need a key...\n@c0@"
  ja: "@a@b%a002010「カギが　ないと\n\t中には　入れそうも　ないわね。\n@c0@"
  ko: "@a@b%a002010: 열쇠가 있어야\n안에 들어갈 수 있나 봐.\n@c0@"
  sl: "@a@b%a002010：没有钥匙的话，\n　　就进不去吧。\n@c0@"
  tl: "@a@b%a002010：沒有鑰匙的話，\n　　就進不去吧。\n@c0@"
4:
  en: "@a%0%a002000@bAhoy! More uncharted territory to...chart! This mission is really bringin' out the explorer in me!\n@c0@"
  ja: "@a@b%a002000「くうーっ！　この先に\n\tまだ　行ったことのない　ところが\n\tあるかと思うと　血がさわぐぜ！\n@c0@"
  ko: "@a@b%a002000: 크으! 이 앞에\n아직 가 본 적이 없는 곳이\n있다고 생각하니 피가 끓는군!\n@c0@"
  sl: "@a@b%a002000：哇啊！\n　　一想到前面都是未知的区域，\n　　俺就热血沸腾啦！\n@c0@"
  tl: "@a@b%a002000：哇啊！\n　　一想到前面都是未知的區域，\n　　俺就熱血沸騰啦！\n@c0@"
5:
  en: "@a%0%a002010@bI doubt there's any way he's going to let us pass, %a000090. Let's go.\n@c0@"
  ja: "@a@b%a002010「どうやら　ここは\n\t通して　もらえそうもないわね。\n\t行きましょ　%a000090。\n@c0@"
  ko: "@a@b%a002010: 아무래도 여긴\n지나가기 어렵겠어.\n가자, %a000090.\n@c0@"
  sl: "@a@b%a002010：看起来，\n　　这里好像还不能通过。\n　　我们走吧%a000090。\n@c0@"
  tl: "@a@b%a002010：看起來，\n　　這裡好像還不能通過。\n　　我們走吧%a000090。\n@c0@"
