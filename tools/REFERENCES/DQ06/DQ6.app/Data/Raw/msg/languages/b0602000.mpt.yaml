16:
  en: "@a%0%a002000@bCrikey! Talk about a hero's welcome, aye?\n@c0@"
  ja: "@a@b%a002000「こいつは　ビックリだな。\n\t全員で　おでむかえかよ！\n@c0@"
  ko: "@a@b%a002000: 이거 참 놀랍군.\n모두 마중 나오다니!\n@c0@"
  sl: "@a@b%a002000：吓了俺一跳，\n　　居然所有人都跑来迎接了！\n@c0@"
  tl: "@a@b%a002000：嚇了俺一跳，\n　　居然所有人都跑來迎接了！\n@c0@"
17:
  en: "@a%0%a002010@bOh my, what's this...? Did they know you were coming, %a000090?\n@c0@"
  ja: "@a@b%a002010「これは……？\n\t%a000090が　もとの王子に\n\tもどったことが　わかったというの？\n@c0@"
  ko: "@a@b%a002010: 이건......?\n%a000090%F0090%X가%Y이%Z 원래의 왕자로\n돌아온 걸 알고 있다는 거야?\n@c0@"
  sl: "@a@b%a002010：这是……\n　　大家都知道%a000090\n　　已经变回原来那个王子了吗？\n@c0@"
  tl: "@a@b%a002010：這是……\n　　大家都知道%a000090\n　　已經變回原來那個王子了嗎？\n@c0@"
18:
  en: "@a%0%a002030@bIt seems that everyone in the castle was waiting with bated breath for your return, %a000090!\n@c0@"
  ja: "@a@b%a002030「なんと　お城の　みなさん\n\t%a000090さんが　もどってくるのを\n\t待ちかねて　いたのでしょうか！？\n@c0@"
  ko: "@a@b%a002030: 세상에! 성 사람들이\n%a000090 님이 돌아오는 걸\n기다리고 있었던 걸까요!?\n@c0@"
  sl: "@a@b%a002030：城里的人们对\n　　%a000090的归来早已是\n　　迫不及待了吧？！\n@c0@"
  tl: "@a@b%a002030：城裡的人們對\n　　%a000090的歸來早已是\n　　迫不及待了吧？！\n@c0@"
19:
  en: "@a%0%a002020@bWhy're they all lined up? Some big shot bringing up the rear?\n@c0@"
  ja: "@a@b%a002020「え？　なんで？\n\tどうして　みんな　並んでるの？\n@c0@"
  ko: "@a@b%a002020: 응? 어째서?\n왜 모두 늘어서 있는 거야?\n@c0@"
  sl: "@a@b%a002020：诶？怎么回事？\n　　大家为什么在这里列队啊？\n@c0@"
  tl: "@a@b%a002020：誒？怎麼回事？\n　　大家為什麼在這裡列隊啊？\n@c0@"
20:
  en: "@a%0%a002050@bThey're not plannin' to jump us, right?\n@c0@"
  ja: "@a@b%a002050「私たち　まさか　捕まってしまう\n\tわけでは　ないですよね……。\n@c0@"
  ko: "@a@b%a002050: 우리 설마 붙잡히는 건\n아니겠지요......?\n@c0@"
  sl: "@a@b%a002050：不会是要\n　　把我们抓起来吧……\n@c0@"
  tl: "@a@b%a002050：不會是要\n　　把我們抓起來吧……\n@c0@"
21:
  en: "@a%0%a002070@bBoing! (jiggle)\n@c0@"
  ja: "@a@b%a002070「プルプルーッ！\n@c0@"
  ko: "@a@b%a002070: 뽀용뽀요용~!\n@c0@"
  sl: "@a@b%a002070：噗噜噗噜。\n@c0@"
  tl: "@a@b%a002070：噗嚕噗嚕。\n@c0@"
22:
  en: "@a%0%a002000@bWell, well... They're all waitin' for you, %a000090.\n@c0@"
  ja: "@a@b%a002000「見ろよ。\n\tみんなで　%a000090を\n\t待っていたんだな。\n@c0@"
  ko: "@a@b%a002000: 이거 봐.\n모두 %a000090%F0090%X를%Y을%Z\n기다리고 있었군.\n@c0@"
  sl: "@a@b%a002000：快看，\n　　大家都在\n　　等着%a000090呢。　\n@c0@"
  tl: "@a@b%a002000：快看，\n　　大家都在\n　　等著%a000090呢。　\n@c0@"
23:
  en: "@a%0%a002010@bMy word, %a000090. A guard of honour especially for you.\n@c0@"
  ja: "@a@b%a002010「おでむかえなんて　やっぱり\n\t%a000090は　すごいわね。\n@c0@"
  ko: "@a@b%a002010: 이렇게 성대하게 마중나오다니\n역시 %a000090%F0090%X는%Y은%Z 굉장해.\n@c0@"
  sl: "@a@b%a002010：这么多人出来迎接，\n　　%a000090果然了不起啊。\n@c0@"
  tl: "@a@b%a002010：這麼多人出來迎接，\n　　%a000090果然了不起啊。\n@c0@"
24:
  en: "@a%0%a002030@bHappiness is etched on every face!\n@c0@"
  ja: "@a@b%a002030「みなさんの　表情が\n\tとっても　明るいです。\n@c0@"
  ko: "@a@b%a002030: 사람들의 표정이\n정말 밝군요.\n@c0@"
  sl: "@a@b%a002030：大家看上去\n　　都很开心呢。\n@c0@"
  tl: "@a@b%a002030：大家看上去\n　　都很開心呢。\n@c0@"
25:
  en: "@a%0%a002020@bBoy, everyone's so happy to see you!\n@c0@"
  ja: "@a@b%a002020「みんな　よろこんで\n\tくれてるみたいだね。\n@c0@"
  ko: "@a@b%a002020: 사람들이\n기뻐하는 것 같아.\n@c0@"
  sl: "@a@b%a002020：每个人看起来\n　　都好高兴啊。\n@c0@"
  tl: "@a@b%a002020：每個人看起來\n　　都好高興啊。\n@c0@"
26:
  en: "@a%0%a002050@bThis is treatment fit for a prince!\n@c0@"
  ja: "@a@b%a002050「さすが　王子ですね！\n@c0@"
  ko: "@a@b%a002050: 과연 왕자님이시군요!\n@c0@"
  sl: "@a@b%a002050：不愧是王子啊！\n@c0@"
  tl: "@a@b%a002050：不愧是王子啊！\n@c0@"
