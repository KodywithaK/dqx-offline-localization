0:
  en: "@a%0%a002000@bWe've really gotta take out that Archfiend...\n@c0@"
  ja: "@a@b%a002000「はやく　大魔王を\n\t倒さないとな……。\n@c0@"
  ko: "@a@b%a002000: 빨리 대마왕을\n쓰러뜨려야 해......\n@c0@"
  sl: "@a@b%a002000：必须尽快\n　　打倒大魔王啊……\n@c0@"
  tl: "@a@b%a002000：必須儘快\n　　打倒大魔王啊……\n@c0@"
1:
  en: "@a%0%a002010@bWe've got work to do as well! Defeating the Archfiend!\n@c0@"
  ja: "@a@b%a002010「私たちの　仕事は\n\t大魔王を　倒すことね！\n@c0@"
  ko: "@a@b%a002010: 우리가 할 일은\n대마왕을 쓰러뜨리는 거야!\n@c0@"
  sl: "@a@b%a002010：我们的任务\n　　就是打倒大魔王呢！\n@c0@"
  tl: "@a@b%a002010：我們的任務\n　　就是打倒大魔王呢！\n@c0@"
2:
  en: "@a%0%a002030@bThese guards do sterling work.\n@c0@"
  ja: "@a@b%a002030「関所の守り　ごくろうさまです。\n@c0@"
  ko: "@a@b%a002030: 관문 경비, 수고 많으십니다.\n@c0@"
  sl: "@a@b%a002030：守卫关卡真是辛苦了。\n@c0@"
  tl: "@a@b%a002030：守衛關卡真是辛苦了。\n@c0@"
3:
  en: "@a%0%a002020@bSheesh, I'd totally forgotten about Murdaw...\n@c0@"
  ja: "@a@b%a002020「もう　ムドーのことなんか\n\t忘れちゃってたよ……。\n@c0@"
  ko: "@a@b%a002020: 이미 무도 따윈\n잊어버렸어......\n@c0@"
  sl: "@a@b%a002020：姆多什么的，\n　　人家几乎都快给忘了……\n@c0@"
  tl: "@a@b%a002020：姆多什麼的，\n　　人家幾乎都快給忘了……\n@c0@"
4:
  en: "@a%0%a002040@bWhy are we cooling our heels here?\n@c0@"
  ja: "@a@b%a002040「さっさと　関所なんか\n\tぬけてしまおうぜ。\n@c0@"
  ko: "@a@b%a002040: 관문 따윈 후다닥\n빠져 나가자고!\n@c0@"
  sl: "@a@b%a002040：我们快点\n　　通过关卡吧。\n@c0@"
  tl: "@a@b%a002040：我們快點\n　　通過關卡吧。\n@c0@"
5:
  en: "@a%0%a002050@bI get it! Guards owe their jobs to monsters! It makes perfect sense...\n@c0@"
  ja: "@a@b%a002050「なるほど！\n\t兵隊さんに　仕事が　あるのは\n\tまものの　おかげなんですね！\n@c0@"
  ko: "@a@b%a002050: 과연!\n마물이 있어서 병사들도\n일을 할 수 있는 거겠죠!\n@c0@"
  sl: "@a@b%a002050：原来如此！\n　　士兵们之所以有工作，\n　　全都多亏了魔物们呢！\n@c0@"
  tl: "@a@b%a002050：原來如此！\n　　士兵們之所以有工作，\n　　全都多虧了魔物們呢！\n@c0@"
6:
  en: "@a%0%a002060@b(snarl) Grrrargh... (spit)\n@c0@"
  ja: "@a@b%a002060「ギルル……ン。\n@c0@"
  ko: "@a@b%a002060: 캬르르......릉.\n@c0@"
  sl: "@a@b%a002060：咕噜噜……\n@c0@"
  tl: "@a@b%a002060：咕嚕嚕……\n@c0@"
7:
  en: "@a%0%a002070@b(slurp) Boing!\n@c0@"
  ja: "@a@b%a002070「プルプル。\n@c0@"
  ko: "@a@b%a002070: 뽀용뽀용.\n@c0@"
  sl: "@a@b%a002070：噗噜噗噜。\n@c0@"
  tl: "@a@b%a002070：噗嚕噗嚕。\n@c0@"
8:
  en: "@a%0%a002000@bWell, we didn't see any passed-out pilgrims on the way here, so that's good, aye?\n@c0@"
  ja: "@a@b%a002000「とちゅうで　倒れている\n\t旅人とかは　見かけなかったから\n\t大丈夫なんじゃないか？\n@c0@"
  ko: "@a@b%a002000: 도중에 쓰러져 있는\n여행자는 없었으니까\n괜찮지 않을까?\n@c0@"
  sl: "@a@b%a002000：咱是没看见\n　　有人倒在路边，\n　　应该没什么事吧？\n@c0@"
  tl: "@a@b%a002000：咱是沒看見\n　　有人倒在路邊，\n　　應該沒什麼事吧？\n@c0@"
9:
  en: "@a%0%a002010@bPilgrimages to Ghent seem to be as popular as ever. \n@c0@"
  ja: "@a@b%a002010「ゲントの　人気は\n\tあいかわらず　強いのね。\n@c0@"
  ko: "@a@b%a002010: 겐트의 인기는\n변함없이 좋구나.\n@c0@"
  sl: "@a@b%a002010：根特村的\n　　吸引力依旧是那么强啊。\n@c0@"
  tl: "@a@b%a002010：根特村的\n　　吸引力依舊是那麼強啊。\n@c0@"
10:
  en: "@a%0%a002030@bI'm sure it must still be perilous for travellers. I too am nervous.\n@c0@"
  ja: "@a@b%a002030「たしかに　普通の人びとには\n\tまだ　きつい　旅路ですからね。\n\t私も　心配です。\n@c0@"
  ko: "@a@b%a002030: 보통 사람에게는\n여전히 힘든 여행길이니까요.\n저도 걱정입니다.\n@c0@"
  sl: "@a@b%a002030：对于普通人来说，\n　　这段旅程确实十分辛苦，\n　　我也感到很担心呢。\n@c0@"
  tl: "@a@b%a002030：對於普通人來說，\n　　這段旅程確實十分辛苦，\n　　我也感到很擔心呢。\n@c0@"
11:
  en: "@a%0%a002020@bYou're really rolling the dice if you travel alone these days...\n@c0@"
  ja: "@a@b%a002020「ひとり旅　だったら\n\tまだ　ちょっと　あぶないかなー。\n@c0@"
  ko: "@a@b%a002020: 혼자서 하는 여행은\n아직 조금 위험할 거야......\n@c0@"
  sl: "@a@b%a002020：一个人在外旅行的话，\n　　恐怕还是会有些危险的吧……\n@c0@"
  tl: "@a@b%a002020：一個人在外旅行的話，\n　　恐怕還是會有些危險的吧……\n@c0@"
12:
  en: "@a%0%a002040@bC'mon, let's finish off the Archfiend and wrap things up.\n@c0@"
  ja: "@a@b%a002040「行こうぜ。\n\t大魔王さえ　倒せば\n\tすべて　解決さ。\n@c0@"
  ko: "@a@b%a002040: 가자고.\n대마왕만 쓰러뜨리면\n모든 게 해결되니까.\n@c0@"
  sl: "@a@b%a002040：走吧！\n　　只要打倒了大魔王，\n　　所有的事情就都解决了。\n@c0@"
  tl: "@a@b%a002040：走吧！\n　　只要打倒了大魔王，\n　　所有的事情就都解決了。\n@c0@"
13:
  en: "@a%0%a002050@bIf any of the pilgrims do get bitten by monsters, they'll have all the more reason to go to Ghent, eh?\n@c0@"
  ja: "@a@b%a002050「たとえ　まものに　おそわれて\n\tケガを　したとしても　ゲントの村に\n\tたどりつけさえすれば　大丈夫ですね！\n@c0@"
  ko: "@a@b%a002050: 설령 마물한테 당해서\n부상당해도 겐트 마을에\n도착하기만 하면 괜찮을 겁니다!\n@c0@"
  sl: "@a@b%a002050：就算是被魔物袭击受了伤，\n　　只要能到达根特村，\n　　就不会有事的！\n@c0@"
  tl: "@a@b%a002050：就算是被魔物襲擊受了傷，\n　　只要能到達根特村，\n　　就不會有事的！\n@c0@"
