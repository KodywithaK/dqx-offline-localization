  en: "@aPrince Howard@bI have never seen such dedication, such a sense of duty, such superlative hide-and-seek skills...\n@c0@"
  ja: "@a@bホルス「お前たちみたいに\n\tしつこかったヤツらは\n\tはじめてだったよ。\n@c0@"
  ko: "@a@b홀스: 너희처럼\n끈질긴 녀석들은\n처음이었어.\n@c0@"
  sl: "@a@b荷尔斯：但像你们\n　　这么执着的家伙\n　　我还是头一次见。\n@c0@"
  tl: "@a@b荷爾斯：但像你們\n　　這麼執著的傢伙\n　　我還是頭一次見。\n@c0@"
60:
  en: "@aPrince Howard@bI have learnt a lot from you and your allies, %a000140.\n@c0@"
  ja: "@a@bホルス「どんなことでも　あきらめずに\n\tがんばっていれば　いつか\n\tむくわれるってことか……。\n@c0@"
  ko: "@a@b홀스: 어떤 일이라도 포기하지 말고\n열심히 하면 언젠가\n좋은 결과가 있을 거라고......\n@c0@"
  sl: "@a@b荷尔斯：不管发生什么事\n　　都不言弃，努力奋斗的话，\n　　一定能得到回报吗……\n@c0@"
  tl: "@a@b荷爾斯：不管發生什麼事\n　　都不言棄，努力奮鬥的話，\n　　一定能得到回報嗎……\n@c0@"
61:
  en: "@aPrince Howard@bI will try to apply those lessons when I ascend the throne of Howcastle. Many thanks.\n@c0@"
  ja: "@a@bホルス「オレも　いっちょ　その\n\tしつこさで　がんばってみるよ。\n\tありがとうな。　%a000140。\n@c0@"
  ko: "@a@b홀스: 나도 이번만큼은\n끈질기게 해 볼 생각이야.\n고마워, %a000140.\n@c0@"
  sl: "@a@b荷尔斯：我也学习你们的\n　　执着精神，好好努力吧。\n　　谢谢了，%a000140。\n@c0@"
  tl: "@a@b荷爾斯：我也學習你們的\n　　執著精神，好好努力吧。\n　　謝謝了，%a000140。\n@c0@"
62:
  en: "@aKing Howell@bAh, it's %H0860%X%a000120%Y%a000120 and company%Z! I owe you one!\n@c0@"
  ja: "@a@bホルテン「おお　%a000120　よくぞ来た！\n\tそなたたちには　本当に\n\t世話をかけたな。\n@c0@"
  ko: "@a@b홀텐: 오오 %a000120. 잘 와 주었네!\n그대들에겐 정말\n많은 신세를 졌어.\n@c0@"
  sl: "@a@b荷尔顿：哦哦，是%a000120，\n　　欢迎欢迎！\n　　你们帮了我的大忙了。\n@c0@"
  tl: "@a@b荷爾頓：哦哦，是%a000120，\n　　歡迎歡迎！\n　　你們幫了我的大忙了。\n@c0@"
63:
  en: "@aKing Howell@bThanks to your efforts, my son's finally got what it takes to follow in my footsteps.\n@c0@"
