64:
  en: "@aKing Howell@bMake sure you come and visit from time to time. I know Howie will be thrilled.\n@c0@"
  ja: "@a@bホルテン「たまには　ホルスに\n\t会いにきて　やってくれ。\n\tきっと　よろこぶはずじゃからな。\n@c0@"
  ko: "@a@b홀텐: 가끔은 홀스를\n만나러 와 주게나.\n틀림없이 기뻐해 줄 것이네.\n@c0@"
