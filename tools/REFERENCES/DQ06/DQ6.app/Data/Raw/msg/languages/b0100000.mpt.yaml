0:
  en: "@a@b*: Greetings, intrepid travellers! Welcome to Howsworth!\n@c0@"
  ja: "@a@b＊「あら　旅のかたね。\n\tここは　ホルコッタの村よ。\n@c0@"
  ko: "@a@b*: 어머, 여행자네.\n여긴 홀코타 마을이야.\n@c0@"
  sl: "@a@b＊：啊，是旅行者。\n　　这里是荷尔克塔村。\n@c0@"
  tl: "@a@b＊：啊，是旅行者。\n　　這裡是荷爾克塔村。\n@c0@"
1:
  en: "@a@b*: A little ploughin' would do you a world o' good!\n@c0@"
  ja: "@a@b＊「みんな　いっぺん\n\t畑仕事を　すればええんだよ。\n@c0@"
  ko: "@a@b*: 모두 한 번쯤은\n밭일을 해 봤으면 좋겠어.\n@c0@"
  sl: "@a@b＊：大家应该都去干农活。\n@c0@"
  tl: "@a@b＊：大家應該都去幹農活。\n@c0@"
2:
  en: "@a@b*: It'd put hairs on your chest and you wouldn't fear any measly monster!\n@c0@"
  ja: "@a@b＊「したら　うんとこさ　たくましくなって\n\tまものなんか　こわくなくなると\n\tオラは　思うだよ。\n@c0@"
  ko: "@a@b*: 그러면 겁나게 듬직해져서\n마물 따위는 무섭지 않게 될 거라고\n나는 생각해.\n@c0@"
  sl: "@a@b＊：农活能让身体更健壮，\n　　这样就不用怕魔物了。\n@c0@"
  tl: "@a@b＊：農活能讓身體更健壯，\n　　這樣就不用怕魔物了。\n@c0@"
3:
  en: "@a@b*: I was thinking about heading on to foreign climes, but those monsters are forcing me to stay put.\n@c0@"
  ja: "@a@b＊「そろそろ　他の国へ　行こうと\n\t思っていたのですが……　まものが\n\tウロウロしていて　動けないんです。\n@c0@"
  ko: "@a@b*: 슬슬 다른 나라에 가려고\n생각했습니다만......\n마물이 어슬렁거려서 움직일 수가 없군요.\n@c0@"
  sl: "@a@b＊：本以为可以去别的国家……\n　　但是现在魔物这么多，\n　　让我不敢动身了。\n@c0@"
  tl: "@a@b＊：本以為可以去別的國家……\n　　但是現在魔物這麼多，\n　　讓我不敢動身了。\n@c0@"
4:
  en: "@a@b*: Still, I can't complain when the customers come to me. C'mon — we've got business to do!\n@c0@"
  ja: "@a@b＊「でも　お客さんが　来てくれるから\n\t仕事には　こまらないんですけどね。\n\tさて　どっこいしょと。\n@c0@"
  ko: "@a@b*: 하지만 손님이 와 주니까\n일은 그럭저럭 돌아가네요.\n이영차!\n@c0@"
  sl: "@a@b＊：不过，如果有客人来的话，\n　　就能照常做买卖了。\n　　那么，开张喽。\n@c0@"
  tl: "@a@b＊：不過，如果有客人來的話，\n　　就能照常做買賣了。\n　　那麼，開張嘍。\n@c0@"
5:
  en: "@a@b*: What's that you've got there? Looks a lot like a magic key to me!\n@c0@"
  ja: "@a@b＊「うん？　おまえさんたち\n\tまほうのカギを　もってなさるな。\n@c0@"
  ko: "@a@b*: 음? 자네들,\n마법의 열쇠를 가지고 있군.\n@c0@"
  sl: "@a@b＊：唔？你们拿着\n　　魔法的钥匙呢。\n@c0@"
  tl: "@a@b＊：唔？你們拿著\n　　魔法的鑰匙呢。\n@c0@"
6:
  en: "@a@b*: They say there's an even better key hidden out there somewhere. It's called the ultimate key!\n@c0@"
  ja: "@a@b＊「じゃが　この世界の　どこかに\n\tさいごのカギと　いわれる\n\tもっとすごいカギが　あるらしいぞい。\n@c0@"
  ko: "@a@b*: 하지만 이 세계의 어딘가에\n최후의 열쇠라 불리는\n더 큰 열쇠가 있다더군.\n@c0@"
  sl: "@a@b＊：但是我听说，\n　　在这世界上的某个地方，\n　　有把最后的钥匙比它更厉害。\n@c0@"
  tl: "@a@b＊：但是我聽說，\n　　在這世界上的某個地方，\n　　有把最後的鑰匙比它更厲害。\n@c0@"
7:
  en: "@a@b*: What's that you've got there!? Looks a lot like the ultimate key to me!\n@c0@"
  ja: "@a@b＊「うん？　おまえさんたちの\n\tもっている　それは\n\tさいごのカギ　じゃな！？\n@c0@"
  ko: "@a@b*: 응? 자네들이\n가지고 있는 그것은\n최후의 열쇠가 아닌가!?\n@c0@"
  sl: "@a@b＊：嗯？\n　　你们拿着的就是最后的钥匙吧？！\n@c0@"
  tl: "@a@b＊：嗯？\n　　你們拿著的就是最後的鑰匙吧？！\n@c0@"
8:
  en: "@a@b*: With that key, you'll be able to open doors even the magic key couldn't get you through!\n@c0@"
  ja: "@a@b＊「そのカギが　あれば\n\tまほうのカギでも　開けられなかった\n\tトビラの先へ　行けるじゃろうて。\n@c0@"
  ko: "@a@b*: 그 열쇠가 있으면\n마법의 열쇠로도 열지 못했던\n문을 열 수 있을걸세.\n@c0@"
  sl: "@a@b＊：只要有了那把钥匙，\n　　以前用魔法的钥匙打不开的地方，\n　　现在都可以去了。\n@c0@"
  tl: "@a@b＊：只要有了那把鑰匙，\n　　以前用魔法的鑰匙打不開的地方，\n　　現在都可以去了。\n@c0@"
9:
  en: "@a@b*: There's been a real shortage of visitors of late. The burgeoning monster population must be to blame.\n@c0@"
  ja: "@a@b＊「最近　旅人が　ちっとも\n\t来なくなったのよ。　また　まものが\n\tふえてきたせいかしらね。\n@c0@"
  ko: "@a@b*: 요즘 여행자가 전혀\n오지를 않아. 또 마물이\n늘어난 탓인가?\n@c0@"
  sl: "@a@b＊：最近没有什么旅行者来。\n　　是不是因为魔物又增多了啊。\n@c0@"
  tl: "@a@b＊：最近沒有什麼旅行者來。\n　　是不是因為魔物又增多了啊。\n@c0@"
10:
  en: "@a@b*: The rumours about the Prince gettin' through the royal rite o' purification are true! Huzzah!\n@c0@"
  ja: "@a@b＊「ホルス王子が　洗礼を受けたという\n\tウワサが　本当だったようで\n\tなによりじゃ。\n@c0@"
  ko: "@a@b*: 홀스 왕자가 세례를 받았다는\n소문이 사실인 모양이네.\n정말 다행이야.\n@c0@"
  sl: "@a@b＊：我听人说，\n　　荷尔斯王子完成了洗礼，\n　　这真是太好了。\n@c0@"
  tl: "@a@b＊：我聽人說，\n　　荷爾斯王子完成了洗禮，\n　　這真是太好了。\n@c0@"
11:
  en: "@a@b*: Rumour has it the Prince o' Somnia set out to find what's causin' the growin' number of monsters.\n@c0@"
  ja: "@a@b＊「風のウワサでは　レイドックの王子が\n\tまものが　増えつづけている理由を\n\tつきとめるため　旅に出たそうだな。\n@c0@"
  ko: "@a@b*: 소문으로는 레이독의 왕자가\n마물이 계속 늘어나는 이유를\n밝혀내기 위한 여행을 떠났다더군.\n@c0@"
  sl: "@a@b＊：有传言说，雷多克城的王子\n　　为了探索魔物不断增多的原因\n　　而踏上了旅程。\n@c0@"
  tl: "@a@b＊：有傳言說，雷多克城的王子\n　　為了探索魔物不斷增多的原因\n　　而踏上了旅程。\n@c0@"
12:
  en: "@a@b*: I've no idea how he's gettin' on, but that's what I call a real prince!\n@c0@"
  ja: "@a@b＊「そのあとのことは　聞いていないが\n\tなんと勇ましく　行動力のある\n\t王子だろうか！\n@c0@"
  ko: "@a@b*: 그 이후의 일은 듣지 못했지만\n정말 용맹스럽고 행동력이 있는\n왕자로군!\n@c0@"
  sl: "@a@b＊：之后的事情我就没再听到了。\n　　不过他真是一位又勇敢\n　　又能干的王子！\n@c0@"
  tl: "@a@b＊：之後的事情我就沒再聽到了。\n　　不過他真是一位又勇敢\n　　又能幹的王子！\n@c0@"
13:
  en: "@a@b*: Our Prince Howard spends all day studyin'. It's tough up there at the top!\n@c0@"
  ja: "@a@b＊「わが国の　ホルス王子も\n\t毎日　勉学にはげんでいるそうだし\n\t上に立つひとって　大変だよなあ。\n@c0@"
  ko: "@a@b*: 우리나라의 홀스 왕자도\n매일 열심히 공부하는 것 같던데\n왕이 된다는 건 쉬운 일이 아니겠지.\n@c0@"
  sl: "@a@b＊：我们国家的荷尔斯王子\n　　每天也在努力地进修，\n　　看来上层的人物也很辛苦啊。\n@c0@"
  tl: "@a@b＊：我們國家的荷爾斯王子\n　　每天也在努力地進修，\n　　看來上層的人物也很辛苦啊。\n@c0@"
14:
  en: "@a@b*: I'm bored! Where's Prince Howard when you need him!?\n@c0@"
  ja: "@a@b＊「あーあ　たいくつだなあ。\n\tホルス王子も　最近　ぜんぜん\n\tあそびに来て　くれないし……。\n@c0@"
  ko: "@a@b*: 아아 심심해.\n홀스 왕자님도 요즘엔 전혀\n놀러 와 주지 않고 말이지......\n@c0@"
  sl: "@a@b＊：啊，真无聊啊。\n　　荷尔斯王子最近都不来找我玩了……\n@c0@"
  tl: "@a@b＊：啊，真無聊啊。\n　　荷爾斯王子最近都不來找我玩了……\n@c0@"
15:
  en: "@a@b*: Want to hear a hard luck tale? 'Course you do! Well, I used to be a guard over at Howcastle.\n@c0@"
  ja: "@a@b＊「わしは　もともと\n\tホルストック城で　働く\n\t兵士であったのだ。\n@c0@"
  ko: "@a@b*: 나는 원래\n홀스톡 성에서 근무하는\n병사였지.\n@c0@"
  sl: "@a@b＊：我本来是在\n　　荷尔斯托克城工作的士兵。\n@c0@"
  tl: "@a@b＊：我本來是在\n　　荷爾斯托克城工作的士兵。\n@c0@"
16:
  en: "@a@b*: If only the Prince had been more like he is today. ...No, I shouldn't say any more.\n@c0@"
  ja: "@a@b＊「あの頃の　王子が\n\t今のようで　あったなら……。\n\tいや　今さら　何も　いうまい。\n@c0@"
  ko: "@a@b*: 그때도 왕자님이\n지금만 같았다면......\n아니 이제 와서 그런 말 해봤자지.\n@c0@"
  sl: "@a@b＊：如果那个时候，\n　　王子能像现在这样……\n　　唉，事到如今说这些也没用。\n@c0@"
  tl: "@a@b＊：如果那個時候，\n　　王子能像現在這樣……\n　　唉，事到如今說這些也沒用。\n@c0@"
17:
  en: "@a@b*: Aye, a farmer's work is never done! But when I come here, I feel like my heart and soul are purified.\n@c0@"
  ja: "@a@b＊「ここにいると　心が　うんとこさ\n\t清らかに　なっていく気が\n\tするだべよ。\n@c0@"
  ko: "@a@b*: 여기에 있으면 마음속까지\n깨끗해지는\n기분이 들어.\n@c0@"
  sl: "@a@b＊：在这个地方，\n　　感觉心情都\n　　变得清爽起来了。\n@c0@"
  tl: "@a@b＊：在這個地方，\n　　感覺心情都\n　　變得清爽起來了。\n@c0@"
18:
  en: "@a@b*: 'Course, they say this cave pales in comparison to Hallowed Hollow, where the royal rite o' purification takes place...\n@c0@"
  ja: "@a@b＊「んだが　洗礼の洞くつの奥は\n\tこんなもんじゃねえらしいな。\n@c0@"
  ko: "@a@b*: 근데 말이야, 세례의 동굴의 안쪽은\n여기와는 비교가 안 되지.\n@c0@"
  sl: "@a@b＊：不过，洗礼洞窟深处\n　　好像不是这个样子的。\n@c0@"
  tl: "@a@b＊：不過，洗禮洞窟深處\n　　好像不是這個樣子的。\n@c0@"
19:
  en: "@a@b*: It must be fairly special if it transformed Howard the Coward so spectacularly.\n@c0@"
  ja: "@a@b＊「あの弱虫だった　ホルス王子が\n\t洗礼さ受けて　変わったくらいだし\n\tきっと　すごい場所なんだべなあ。\n@c0@"
  ko: "@a@b*: 겁쟁이였던 홀스 왕자가\n세례를 받고 변할 정도라니\n틀림없이 굉장한 곳이겠지.\n@c0@"
  sl: "@a@b＊：那个软弱的荷尔斯王子\n　　受了洗礼之后就变了，\n　　洗礼的地方一定很了不得吧。\n@c0@"
  tl: "@a@b＊：那個軟弱的荷爾斯王子\n　　受了洗禮之後就變了，\n　　洗禮的地方一定很了不得吧。\n@c0@"
20:
  en: "@a@b*: It seems like Prince Howard's preparin' to take the throne.\n@c0@"
  ja: "@a@b＊「ホルス王子は　将来　王位を\n\t継ぐつもり　なんだろうな。\n@c0@"
  ko: "@a@b*: 홀스 왕자님은 장차 왕위를\n이을 생각인가 보군.\n@c0@"
  sl: "@a@b＊：荷尔斯王子将来\n　　打算继承王位吧。\n@c0@"
  tl: "@a@b＊：荷爾斯王子將來\n　　打算繼承王位吧。\n@c0@"
21:
  en: "@a@b*: I've heard he spends all day cooped up in his room surrounded by piles o' books.\n@c0@"
  ja: "@a@b＊「このごろは　部屋に　こもって\n\tいろいろな本を　読んでいる\n\tみたいだよ。\n@c0@"
  ko: "@a@b*: 요즘은 방에 틀어박혀서\n이런저런 책을\n읽고 계신 모양이야.\n@c0@"
  sl: "@a@b＊：这段日子他一直\n　　把自己关在屋里，\n　　刻苦读书。\n@c0@"
  tl: "@a@b＊：這段日子他一直\n　　把自己關在屋裡，\n　　刻苦讀書。\n@c0@"
22:
  en: "@a@b*: Recently, Prince Howard's hardly missed any of his weapon-trainin' sessions.\n@c0@"
  ja: "@a@b＊「ホルス王子も　最近は\n\t前ほど　剣のケイコを　サボらなく\n\tなってくれたよ。\n@c0@"
  ko: "@a@b*: 홀스 왕자님도 요즘은\n예전처럼 검술 연습을\n게을리 하지 않아.\n@c0@"
  sl: "@a@b＊：荷尔斯王子最近\n　　不再逃避练习剑术了。\n@c0@"
  tl: "@a@b＊：荷爾斯王子最近\n　　不再逃避練習劍術了。\n@c0@"
23:
  en: "@a@b*: When he misses them, it's only cos he's got his head stuck in a book somewhere.\n@c0@"
  ja: "@a@b＊「サボるといっても　本を読むのに\n\t夢中で　うっかり　ケイコの時間を\n\tわすれてしまうだけの　ようだが。\n@c0@"
  ko: "@a@b*: 지난번에 연습을 빼먹었을 때도\n책을 읽는 데 열중하느라\n연습 시간을 깜빡했을 뿐이었으니까.\n@c0@"
  sl: "@a@b＊：即使偶尔没去练习，\n　　也是因为读书太入迷，\n　　忘记了练习的时间。\n@c0@"
  tl: "@a@b＊：即使偶爾沒去練習，\n　　也是因為讀書太入迷，\n　　忘記了練習的時間。\n@c0@"
24:
  en: "@a@b*: Of course, he was never a big fan of fightin' to begin with...\n@c0@"
  ja: "@a@b＊「王子は　もともと\n\t戦うことが　キライだった\n\tだけなのかも　しれんなあ。\n@c0@"
  ko: "@a@b*: 왕자님은 원래\n싸우는 것이\n싫었던 것뿐일지 몰라.\n@c0@"
  sl: "@a@b＊：我想王子以前\n　　大概只是讨厌打仗吧。\n@c0@"
  tl: "@a@b＊：我想王子以前\n　　大概只是討厭打仗吧。\n@c0@"
25:
  en: "@a@b*: Greetings and salutations, fellow %H0860%Xtraveller%Ytravellers%Z! So you made use of the magic key? Marvellous!\n@c0@"
  ja: "@a@b＊「むむっ　そなたたち\n\tまほうのカギを使い　ここへ来たのだな？\n@c0@"
  ko: "@a@b*: 아니, 그대들은\n마법의 열쇠로 여기까지 온 것이군!\n@c0@"
  sl: "@a@b＊：唔，你们是使用了魔法的钥匙\n　　来这里的吗？\n@c0@"
  tl: "@a@b＊：唔，你們是使用了魔法的鑰匙\n　　來這裡的嗎？\n@c0@"
26:
  en: "@a@b*: What's that? You used the ultimate key? Well, either way, you made it!\n@c0@"
  ja: "@a@b＊「なぬっ　さいごのカギを　使ったと？\n\t……ふむ　まあ　そのようなちがいは\n\tこのさい　かまわぬ。\n@c0@"
  ko: "@a@b*: 뭣이, 최후의 열쇠를 사용했다고?\n......흠, 뭐 그 정도 차이는\n그냥 넘어가도록 하지.\n@c0@"
  sl: "@a@b＊：什么，是用了最后的钥匙？\n　　……嗯，算了，这种问题\n　　现在无关紧要了。\n@c0@"
  tl: "@a@b＊：什麼，是用了最後的鑰匙？\n　　……嗯，算了，這種問題\n　　現在無關緊要了。\n@c0@"
27:
  en: "@a@b*: I sat astride my gloopy steed and rode for many leagues to fulfil my destiny and serve the Prince of Howcastle.\n@c0@"
  ja: "@a@b＊「いやー　よかった　よかった。\n\tホルス王子に　カギをかけられ\n\tどこへもゆけず　困っておったのだ。\n@c0@"
  ko: "@a@b*: 아아, 다행이군 다행이야.\n홀스 왕자가 열쇠로 잠가 버려서\n꼼짝도 못 하고 곤란하던 참이었어.\n@c0@"
  sl: "@a@b＊：总之，太好了。\n　　荷尔斯王子把我锁在这里\n　　哪都去不了。真是伤脑筋啊。\n@c0@"
  tl: "@a@b＊：總之，太好了。\n　　荷爾斯王子把我鎖在這裡\n　　哪都去不了。真是傷腦筋啊。\n@c0@"
28:
  en: "@a@b*: ...And what does he goo and do? Why, he locks me up like a common criminal! Is that any way to treat the valiant %a002090?\n@c0@"
