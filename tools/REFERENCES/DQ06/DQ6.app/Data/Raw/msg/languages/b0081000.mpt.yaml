32:
  en: "@a@b*: Mm? You don't know where Despairia is?\n@c0@"
  ja: "@a@b＊「なに？　絶望の町は\n\tどこかじゃと？\n@c0@"
  ko: "@a@b*: 뭐라고? 절망의 마을이\n어디냐고?\n@c0@"
  sl: "@a@b＊：什么？你们不知道\n　　绝望之镇在哪里吗？\n@c0@"
  tl: "@a@b＊：什麼？你們不知道\n　　絕望之鎮在哪裡嗎？\n@c0@"
33:
  en: "@a@b*: Well, just head straight east from here and you'll find it right before you reach the woods.\n@c0@"
  ja: "@a@b＊「ここから　東に　まっすぐ進んだ\n\t森の　手前にある　町じゃよ。\n@c0@"
  ko: "@a@b*: 여기서 동쪽으로 곧바로 가면\n숲이 나오는데, 그 숲 앞에 있는 마을이라네.\n@c0@"
  sl: "@a@b＊：从这里向东一直走，\n　　森林边上的那个城镇就是。\n@c0@"
  tl: "@a@b＊：從這裡向東一直走，\n　　森林邊上的那個城鎮就是。\n@c0@"
