  tl: "@a@b%a002060：我……換衣服……\n　　有點……麻煩……\n@c0@"
165:
  en: "@a%0%a002070@bBoing boing!\n@c0@"
  ja: "@a@b%a002070「プップルル　プルーッ！\n@c0@"
