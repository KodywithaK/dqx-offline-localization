  tl: "@a@b%a002020：喲……喲！\n　　你也是辛苦了呢！\n　　咳咳！\n@c0@"
143:
  en: "@a%0%a002050@bSimple as that!\n@c0@"
  ja: "@a@b%a002050「しーん。\n@c0@"
