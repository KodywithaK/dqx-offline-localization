  sl: "@a@b%a002040：嘘……\n@c0@"
  tl: "@a@b%a002040：噓……\n@c0@"
145:
  en: "@a%0%a002070@bBoing?\n@c0@"
  ja: "@a@b%a002070「プルッ……。\n@c0@"
  ko: "@a@b%a002070: 뽀용......\n@c0@"
  sl: "@a@b%a002070：噗噜……\n@c0@"
  tl: "@a@b%a002070：噗嚕……\n@c0@"
