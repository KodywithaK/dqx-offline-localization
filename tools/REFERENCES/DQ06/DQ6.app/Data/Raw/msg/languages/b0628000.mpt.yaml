201:
  en: "@a%0%a002070@bBoing boing. Boing...\n@c0@"
  ja: "@a@b%a002070「プルプ　プルプ……。\n@c0@"
  ko: "@a@b%a002070: 뽀르뽀 뽀르뽀......\n@c0@"
  sl: "@a@b%a002070：噗噜噗，噗噜噗……\n@c0@"
  tl: "@a@b%a002070：噗嚕噗，噗嚕噗……\n@c0@"
202:
  en: "@a%0%a002000@bThis must be the ‘town’ part of Gallows Moor, aye? A town within a prison...\n@c0@"
  ja: "@a@b%a002000「ここは　広いな。\n\tまさしく　町……\n\t牢ごくの町　だな。\n@c0@"
  ko: "@a@b%a002000: 이곳은\n마을처럼 넓구나.\n말 그대로 감옥 마을이군.\n@c0@"
  sl: "@a@b%a002000：这里好大。\n　　真不愧为城镇……\n　　牢狱之镇。\n@c0@"
  tl: "@a@b%a002000：這裡好大。\n　　真不愧為城鎮……\n　　牢獄之鎮。\n@c0@"
203:
  en: "@a%0%a002010@bIt seems there are a lot of people living here.\n@c0@"
  ja: "@a@b%a002010「ここには　ずいぶん\n\tたくさんの　人たちが\n\t暮らしている　ようだわね。\n@c0@"
  ko: "@a@b%a002010: 여기에는 꽤\n많은 사람이\n살고 있는 것 같아.\n@c0@"
  sl: "@a@b%a002010：这里好像\n　　也居住着不少的人呢。\n@c0@"
  tl: "@a@b%a002010：這裡好像\n　　也居住著不少的人呢。\n@c0@"
204:
  en: "@a%0%a002020@bThese guard uniforms aren't making us any friends around here...\n@c0@"
  ja: "@a@b%a002020「みんなが　あたしたちを\n\t見る目が　つめたい……。\n\tこの　兵士の服の　せいだわ。\n@c0@"
  ko: "@a@b%a002020: 사람들이 우릴\n보는 눈이 차가운데......\n병사의 옷 때문인가 봐.\n@c0@"
  sl: "@a@b%a002020：大家看着我们的视线\n　　感觉好冰冷……\n　　原因是这身士兵服啊。\n@c0@"
  tl: "@a@b%a002020：大家看著我們的視線\n　　感覺好冰冷……\n　　原因是這身士兵服啊。\n@c0@"
205:
  en: "@a%0%a002020@bWe should probably take them off if we want to learn anything useful.\n@c0@"
  ja: "@a@b%a002020「町の　みんなから\n\tちゃんとした　話を　聞くには\n\tこれを　ぬがないと　ダメね。\n@c0@"
  ko: "@a@b%a002020: 마을 사람들한테\n이야기를 들으려면\n이걸 벗어야 할 것 같아.\n@c0@"
  sl: "@a@b%a002020：要是想和镇上的\n　　居民们好好对话，\n　　不脱下这身士兵服的话就不行。\n@c0@"
  tl: "@a@b%a002020：要是想和鎮上的\n　　居民們好好對話，\n　　不脫下這身士兵服的話就不行。\n@c0@"
206:
  en: "@a%0%a002030@bWearing the guard uniforms, we can get a sense of the suffering inflicted on the town's people.\n@c0@"
  ja: "@a@b%a002030「兵士の　格好を　していると\n\t町のみなさんが　どれだけ　ひどい目に\n\tあっているか　想像がつきます。\n@c0@"
  ko: "@a@b%a002030: 병사 차림을 하고 있으니까\n마을 사람들이 얼마나 고생을\n했는지 알 것도 같군요.\n@c0@"
  sl: "@a@b%a002030：穿着这身士兵服的话，\n　　会被镇上的居民们如何对待，\n　　就已经能够想象出来了。\n@c0@"
  tl: "@a@b%a002030：穿著這身士兵服裝的話，\n　　會被鎮上的居民們如何對待，\n　　就已經能夠想像出來了。\n@c0@"
207:
  en: "@a%0%a002050@bThis place is bloomin' big.\n@c0@"
  ja: "@a@b%a002050「ここは　本当に\n\t広いですねー。\n@c0@"
  ko: "@a@b%a002050: 여기는 정말\n넓군요~\n@c0@"
  sl: "@a@b%a002050：这个地方\n　　还真的是好大啊。\n@c0@"
  tl: "@a@b%a002050：這個地方\n　　還真的是好大啊。\n@c0@"
208:
  en: "@a%0%a002050@bIt's goin' to take us a fair while to explore the place. Let's take our time.\n@c0@"
  ja: "@a@b%a002050「ぜんぶ　しらべるには\n\t時間が　かかりそうですが\n\tあせらず　いきましょう。\n@c0@"
  ko: "@a@b%a002050: 모두 조사하려면\n시간이 걸릴 것 같지만\n서두르지 말고 갑시다.\n@c0@"
  sl: "@a@b%a002050：想要彻头彻尾\n　　调查一遍的话\n　　得花不少时间，不要着急慢慢来吧。\n@c0@"
  tl: "@a@b%a002050：想要徹頭徹尾\n　　調查一遍的話\n　　得花不少時間，不要著急慢慢來吧。\n@c0@"
209:
  en: "@a%0%a002040@bI reckon it would be okay to take off the guard uniforms while we're walking round here.\n@c0@"
  ja: "@a@b%a002040「この中を　歩くぶんには\n\t兵士の服を　ぬいでも\n\t平気なんじゃ　ないか？\n@c0@"
  ko: "@a@b%a002040: 이 안을 걸을 때는\n병사의 옷을 벗어도\n괜찮지 않을까?\n@c0@"
  sl: "@a@b%a002040：在这镇上四处走动的话，\n　　是不是把士兵服换下来也没关系呢？\n@c0@"
  tl: "@a@b%a002040：在這鎮上四處走動的話，\n　　是不是把士兵服換下來也沒關係呢？\n@c0@"
210:
  en: "@a%0%a002060@b(snarl) Pretending to be guard...tough... (spit)\n@c0@"
  ja: "@a@b%a002060「兵士の…ふり…\n\tむずかしい…つらい……。\n@c0@"
  ko: "@a@b%a002060: 병사인...척...\n어렵다...힘들다......\n@c0@"
  sl: "@a@b%a002060：装作……士兵……\n　　好复杂……好难受……\n@c0@"
  tl: "@a@b%a002060：裝作……士兵……\n　　好複雜……好難受……\n@c0@"
211:
  en: "@a%0%a002070@b(slurp) Boing?\n@c0@"
  ja: "@a@b%a002070「プルンッ　プルンッ\n\tプルンッ　プルッ！\n@c0@"
  ko: "@a@b%a002070: 뽀용 뽀용\n뽀요용 뽀용!\n@c0@"
  sl: "@a@b%a002070：噗噜，噗噜，\n　　噗噜噗噜！\n@c0@"
  tl: "@a@b%a002070：噗嚕，噗嚕，\n　　噗嚕噗嚕！\n@c0@"
212:
  en: "@a%0%a002000@bWe better remember to put those uniforms on when we go back down, aye?\n@c0@"
  ja: "@a@b%a002000「ほかの　階に　行くときは\n\t念のため　また　着がえて\n\tおいたほうが　いいだろうな。\n@c0@"
  ko: "@a@b%a002000: 다른 층으로 갈 때는\n혹시 모르니 다시 옷을\n갈아입는 게 좋겠어.\n@c0@"
  sl: "@a@b%a002000：去别的楼层之前，\n　　为以防万一还是再换一次衣服\n　　会比较好的吧。\n@c0@"
  tl: "@a@b%a002000：去別的樓層之前，\n　　為以防萬一還是再換一次衣服\n　　會比較好的吧。\n@c0@"
213:
  en: "@a%0%a002010@bDressed like this, people should tell us what they really think.\n@c0@"
  ja: "@a@b%a002010「この　すがたなら\n\t町のみなさんの　本音が\n\t聞けるわよね。\n@c0@"
  ko: "@a@b%a002010: 이 모습이라면\n마을 사람들의 본심을\n들을 수 있을 거야.\n@c0@"
  sl: "@a@b%a002010：以我们现在\n　　这身打扮，镇上的人们\n　　应该会对我们说真心话吧。\n@c0@"
  tl: "@a@b%a002010：以我們現在\n　　這身打扮，鎮上的人們\n　　應該會對我們說真心話吧。\n@c0@"
214:
  en: "@a%0%a002020@bPeople here must think we're a new batch of prisoners or something.\n@c0@"
  ja: "@a@b%a002020「あたしたちのこと\n\tみんなは　新入りの　囚人だと\n\t思っているのかな。\n@c0@"
  ko: "@a@b%a002020: 사람들이 우리를\n새로 들어온 죄수라고\n생각해 줄까?\n@c0@"
  sl: "@a@b%a002020：大家会认为\n　　我们是新来的犯人吗。\n@c0@"
  tl: "@a@b%a002020：大家會認為\n　　我們是新來的犯人嗎。\n@c0@"
215:
  en: "@a%0%a002030@b%0%a000090, let's not forget to don our uniforms when the time comes to leave.\n@c0@"
  ja: "@a@b%a002030「%a000090さん\n\tここから　でるときは\n\tきがえるのを　わすれずに……。\n@c0@"
  ko: "@a@b%a002030: %a000090 님\n여기에서 나갈 때는\n옷을 갈아입는 걸 잊지 마세요......\n@c0@"
  sl: "@a@b%a002030：%a000090，\n　　从这里出去的时候\n　　别忘了换衣服……\n@c0@"
  tl: "@a@b%a002030：%a000090，\n　　從這裡出去的時候\n　　別忘了換衣服……\n@c0@"
216:
  en: "@a%0%a002050@bAh, it's nice to get out of those uniforms.\n@c0@"
  ja: "@a@b%a002050「ふう。\n\t兵士の服を　ぬぐと\n\tホッとしますねー。\n@c0@"
  ko: "@a@b%a002050: 휴우.\n병사의 옷을 벗으면\n마음이 편해진다니까요~\n@c0@"
  sl: "@a@b%a002050：呼，感觉\n　　换下士兵服的时候身上都轻松了。\n@c0@"
  tl: "@a@b%a002050：呼，感覺\n　　換下士兵服的時候身上都輕鬆了。\n@c0@"
217:
  en: "@a%0%a002040@bPeople here seem to be living in abject poverty.\n@c0@"
  ja: "@a@b%a002040「みんな　まずしい\n\t暮らしの　ようだな。\n@c0@"
  ko: "@a@b%a002040: 모두 가난하게\n생활을 하고 있었군.\n@c0@"
  sl: "@a@b%a002040：居民们都过着\n　　很贫困的生活呢。\n@c0@"
  tl: "@a@b%a002040：居民們都過著\n　　很貧困的生活呢。\n@c0@"
218:
  en: "@a%0%a002060@b(snarl) Many people...imprisoned... (slobber)\n@c0@"
  ja: "@a@b%a002060「とらわれ…びと…\n\tたくさん……。\n@c0@"
  ko: "@a@b%a002060: 갇혀 있는...사람...\n많다......\n@c0@"
  sl: "@a@b%a002060：被关起来……的人……\n　　有好多……\n@c0@"
  tl: "@a@b%a002060：被關起來……的人……\n　　有好多……\n@c0@"
219:
  en: "@a%0%a002070@bBoing, boing, boing.\n@c0@"
  ja: "@a@b%a002070「プルルルン　プルルルン！\n@c0@"
  ko: "@a@b%a002070: 뽀요요용 뽀요요용!\n@c0@"
  sl: "@a@b%a002070：噗噜噜噜，噗噜噜噜！\n@c0@"
  tl: "@a@b%a002070：噗嚕嚕嚕，噗嚕嚕嚕！\n@c0@"
220:
  en: "@a%0%a002000@bHis brother must be that burly fella down there, aye?\n@c0@"
  ja: "@a@b%a002000「下にいた　強そうな\n\t男の　弟らしいな。\n@c0@"
  ko: "@a@b%a002000: 밑에 있던 강해 보이는\n남자의 동생 같은데.\n@c0@"
  sl: "@a@b%a002000：好像是底下那个\n　　很强的男人的弟弟呢。\n@c0@"
  tl: "@a@b%a002000：好像是底下那個\n　　很強的男人的弟弟呢。\n@c0@"
221:
  en: "@a%0%a002010@bHe seems to be the brother of that fellow who's alone in the cell downstairs.\n@c0@"
  ja: "@a@b%a002010「下の　階で\n\tどくぼうに　入れられていた\n\t男性の　弟さんね。\n@c0@"
  ko: "@a@b%a002010: 아래층에서\n독방에 갇혀 있던\n남자의 동생이군.\n@c0@"
  sl: "@a@b%a002010：似乎是下层\n　　单独被关押着的那个男性的弟弟。\n@c0@"
  tl: "@a@b%a002010：似乎是下層\n　　單獨被關押著的那個男性的弟弟。\n@c0@"
222:
  en: "@a%0%a002010@bI wonder why his brother's the only one in solitary...\n@c0@"
  ja: "@a@b%a002010「いったい　なぜ\n\tお兄さんだけ　どくぼうに……？\n@c0@"
  ko: "@a@b%a002010: 도대체 어째서\n형만 독방에......?\n@c0@"
  sl: "@a@b%a002010：为什么只有哥哥\n　　会被单独关起来……\n@c0@"
  tl: "@a@b%a002010：為什麼只有哥哥\n　　會被單獨關起來……\n@c0@"
223:
  en: "@a%0%a002020@bYou might be dressed as a bad guy, %a000090, but you're sure not acting like one.\n@c0@"
  ja: "@a@b%a002020「兵士のふり　していても\n\tこういう　とき　%a000090の\n\tやさしさが　にじみでちゃうわね。\n@c0@"
  ko: "@a@b%a002020: 병사인척 해도\n이런 때는 %a000090의\n착한 성격이 나오고 마는군.\n@c0@"
  sl: "@a@b%a002020：即使是扮成士兵了，\n　　这个时候%a000090的温柔也会\n　　显现出来呢。\n@c0@"
  tl: "@a@b%a002020：即使是扮成士兵了，\n　　這個時候%a000090的溫柔也會\n　　顯現出來呢。\n@c0@"
224:
  en: "@a%0%a002030@bIf we speak to him without the uniforms, we may learn more.\n@c0@"
  ja: "@a@b%a002030「この　服を　ぬいで\n\tもういちど　聞いてみたら\n\tくわしい　じじょうが聞けるかも。\n@c0@"
  ko: "@a@b%a002030: 이 옷을 벗고\n다시 한 번 물어 보면\n자세한 정보를 들을 수 있을지 모릅니다.\n@c0@"
  sl: "@a@b%a002030：把这身衣服脱下之后\n　　再询问看看，或许能够得到详细的情报。\n@c0@"
  tl: "@a@b%a002030：把這身衣服脫下之後\n　　再詢問看看，或許能夠得到詳細的情報。\n@c0@"
225:
  en: "@a%0%a002050@bIt's bloomin' hard to keep up this fierce expression.\n@c0@"
  ja: "@a@b%a002050「ずっと　こわい顔を\n\tしてるのって　けっこう\n\tつらいです……。\n@c0@"
  ko: "@a@b%a002050: 계속 무서운 얼굴을\n하는 것도 상당히\n힘들군요......\n@c0@"
  sl: "@a@b%a002050：一直要摆出\n　　一副可怕的表情，\n　　真是累死我了……\n@c0@"
  tl: "@a@b%a002050：一直要擺出\n　　一副可怕的表情，\n　　真是累死我了……\n@c0@"
226:
  en: "@a%0%a002040@bActually, we're on his side. But in these uniforms, we've got no choice but to play the part.\n@c0@"
  ja: "@a@b%a002040「……オレたち\n\t本当は　味方なのにな。\n\tま　この格好じゃ　しかたないか。\n@c0@"
  ko: "@a@b%a002040: ......우리는\n사실 같은 편인데 말이야.\n뭐, 이런 차림이니 별 수 없겠지.\n@c0@"
  sl: "@a@b%a002040：……本来我们\n　　就应该是自己人的，\n　　但是穿成这样也实在没办法。\n@c0@"
  tl: "@a@b%a002040：……本來我們\n　　就應該是自己人的，\n　　但是穿成這樣也實在沒辦法。\n@c0@"
227:
  en: "@a%0%a002060@b(snarl) %0%a002060 not like...pretending... (slobber)\n@c0@"
  ja: "@a@b%a002060「兵士の…ふり…\n\tいいものじゃ…ない……。\n@c0@"
  ko: "@a@b%a002060: 병사인...척...\n재미...없다......\n@c0@"
  sl: "@a@b%a002060：穿成……士兵这样……\n　　不是……太好……\n@c0@"
  tl: "@a@b%a002060：穿成……士兵這樣……\n　　不是……太好……\n@c0@"
228:
  en: "@a%0%a002070@bBoing? (jiggle)\n@c0@"
  ja: "@a@b%a002070「プルプル！\n@c0@"
  ko: "@a@b%a002070: 뽀용뽀용!\n@c0@"
  sl: "@a@b%a002070：噗噜噗噜！\n@c0@"
  tl: "@a@b%a002070：噗嚕噗嚕！\n@c0@"
229:
  en: "@a%0%a002000@bI know we can't be nice to folks if we wanna protect our cover...\n@c0@"
  ja: "@a@b%a002000「あまり\n\tやさしくして　へんそうが\n\tばれるのも　困るが……\n@c0@"
  ko: "@a@b%a002000: 너무\n착해서 변장이\n들통 나는 것도 곤란하지만......\n@c0@"
  sl: "@a@b%a002000：虽然如果因为你太友善\n　　而导致乔装败露的话是会很麻烦……\n@c0@"
  tl: "@a@b%a002000：雖然如果因為你太友善\n　　而導致喬裝敗露的話是會很麻煩……\n@c0@"
230:
  en: "@a%0%a002000@bBut crikey! Did ya have to take it that far?\n@c0@"
  ja: "@a@b%a002000「そこまで\n\t兵士に　なりきることも\n\tないんじゃないか？\n@c0@"
  ko: "@a@b%a002000: 그렇게까지\n완벽히 병사인 척\n할 필요는 없잖아?\n@c0@"
  sl: "@a@b%a002000：不过也没必要完全变成\n　　士兵的样子吧？\n@c0@"
  tl: "@a@b%a002000：不過也沒必要完全變成\n　　士兵的樣子吧？\n@c0@"
231:
  en: "@a%0%a002010@bWe already look like the Archfiend's henchmen — surely we don't have to act like them too?\n@c0@"
  ja: "@a@b%a002010「ムリして　大魔王の\n\t手下っぽく　ふるまわなくても\n\tいいんじゃない？\n@c0@"
  ko: "@a@b%a002010: 무리해서 대마왕의\n부하인 척 행동하지\n않아도 되잖아?\n@c0@"
  sl: "@a@b%a002010：不用勉强自己装成\n　　大魔王的手下也可以的啊。\n@c0@"
  tl: "@a@b%a002010：不用勉強自己裝成\n　　大魔王的手下也可以的啊。\n@c0@"
232:
  en: "@a%0%a002020@bSheesh. Maybe we're getting too into this ‘evil henchmen’ stuff.\n@c0@"
  ja: "@a@b%a002020「何だか　本当に\n\t悪い人の　手先に　なったような\n\t気分だわ……。\n@c0@"
  ko: "@a@b%a002020: 왠지 진짜\n나쁜 사람의 앞잡이가\n된 듯한 기분인데......\n@c0@"
  sl: "@a@b%a002020：这样一来感觉\n　　就像真的成了坏人的手下一样……\n@c0@"
