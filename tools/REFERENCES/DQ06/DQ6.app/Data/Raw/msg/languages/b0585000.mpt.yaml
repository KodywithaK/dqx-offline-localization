0:
  en: "@a%0%a002000@bWeapons at the ready, %a000090! No tellin' what we might meet in here.\n@c0@"
  ja: "@a@b%a002000「こいつは　何が出てきても\n\tおかしくない　雰囲気だな。\n\t油断するなよ　%a000090！\n@c0@"
  ko: "@a@b%a002000: 여긴 뭐가 나와도\n이상하지 않을 것 같은 분위기군.\n방심하지 말자고, %a000090!\n@c0@"
  sl: "@a@b%a002000：看这气氛，无论\n　　出现什么东西都不奇怪。\n　　%a000090你可不能掉以轻心啊！\n@c0@"
  tl: "@a@b%a002000：看這氣氛，無論\n　　出現什麼東西都不奇怪。\n　　%a000090你可不能掉以輕心啊！\n@c0@"
1:
  en: "@a%0%a002010@bIt seems more likely we'd run into ghosts than monsters in a place like this...\n@c0@"
  ja: "@a@b%a002010「まものじゃなくて　おばけが\n\t出てきそうな　ところね……。\n@c0@"
  ko: "@a@b%a002010: 마물이 아니라 유령이\n나올 것 같은 곳이야......\n@c0@"
  sl: "@a@b%a002010：这里不像是会有魔物，\n　　倒像是会出来妖怪……\n@c0@"
  tl: "@a@b%a002010：這裡不像是會有魔物，\n　　倒像是會出來妖怪……\n@c0@"
2:
  en: "@a%0%a002030@bShould any ghosts appear, fear not. I'll deal with them.\n@c0@"
  ja: "@a@b%a002030「ゆうれいが出ても\n\tだいじょうぶです。\n\t私が　じょうぶつさせます。\n@c0@"
  ko: "@a@b%a002030: 유령이 나와도\n상관없습니다.\n제가 좋은 곳으로 보내 줄 테니까요.\n@c0@"
  sl: "@a@b%a002030：即使有\n　　幽灵出来也没关系，\n　　我来超度它就好。\n@c0@"
  tl: "@a@b%a002030：即使有\n　　幽靈出來也沒關係，\n　　我來超度它就好。\n@c0@"
3:
  en: "@a%0%a002030@bA blessing from me will allow them to rest in peace.\n@c0@"
  ja: "@a@b%a002030「話せば　きっと\n\tわかってくれます。\n@c0@"
  ko: "@a@b%a002030: 이야기를 하면 틀림없이\n알아들어 줄 겁니다.\n@c0@"
  sl: "@a@b%a002030：和它好好商量，\n　　一定可以理解我的。\n@c0@"
  tl: "@a@b%a002030：和它好好商量，\n　　一定可以理解我的。\n@c0@"
4:
  en: "@a%0%a002020@bTee hee! You think I'll scream if I see a ghost? Maybe we'll find out!\n@c0@"
  ja: "@a@b%a002020「えへへ。\n\tなんだか　キモだめし　みたいで\n\tちょっと　ドキドキだね！\n@c0@"
  ko: "@a@b%a002020: 에헤헤.\n꼭 담력 훈련 같아서\n조금 두근두근하네!\n@c0@"
  sl: "@a@b%a002020：嘿嘿，\n　　感觉就像在玩试胆游戏一样。\n　　心脏扑通扑通地跳呢！\n@c0@"
  tl: "@a@b%a002020：嘿嘿，\n　　感覺就像在玩試膽遊戲一樣。\n　　心臟撲通撲通地跳呢！\n@c0@"
5:
  en: "@a%0%a002040@bWho would've thought there'd be a sunken ship here...\n@c0@"
  ja: "@a@b%a002040「こんなところに　沈没船が\n\tねむっていたのか……。\n@c0@"
  ko: "@a@b%a002040: 이런 곳에 침몰선이\n있었다니......\n@c0@"
  sl: "@a@b%a002040：这地方居然\n　　会有一艘沉船啊。\n@c0@"
  tl: "@a@b%a002040：這地方居然\n　　會有一艘沉船啊。\n@c0@"
6:
  en: "@a%0%a002050@bI wonder what cargo this ship was carryin'...\n@c0@"
  ja: "@a@b%a002050「この船は　いったい　何を\n\t運んでいたのでしょうね。\n@c0@"
  ko: "@a@b%a002050: 이 배는 도대체 뭘\n운반했을까요?\n@c0@"
  sl: "@a@b%a002050：这艘船当初\n　　到底运送的什么货物啊？\n@c0@"
  tl: "@a@b%a002050：這艘船當初\n　　到底運送的什麼貨物啊？\n@c0@"
7:
  en: "@a%0%a002060@b(snarl) %0%a002060...not afraid... (spit)\n@c0@"
  ja: "@a@b%a002060「私…こわくない……\n\tダイジョウブ。\n@c0@"
  ko: "@a@b%a002060: 나...무섭지 않다......\n괜찮다.\n@c0@"
  sl: "@a@b%a002060：我……不害怕……\n　　没、没关系。\n@c0@"
  tl: "@a@b%a002060：我……不害怕……\n　　沒、沒關係。\n@c0@"
8:
  en: "@a%0%a002070@b(slurrrp) Boing?\n@c0@"
  ja: "@a@b%a002070「……プル…プル……。\n@c0@"
  ko: "@a@b%a002070: ......뽀용...뽀용......\n@c0@"
  sl: "@a@b%a002070：……噗噜……噗噜……\n@c0@"
  tl: "@a@b%a002070：……噗嚕……噗嚕……\n@c0@"
9:
  en: "@a%0%a002000@bHuh. Maybe he drowned, maybe the monsters got him... Either way, what a shame, aye?\n@c0@"
  ja: "@a@b%a002000「おぼれちまったのか…\n\tまものに　やられちまったのか…\n\tいずれにしても　気の毒にな。\n@c0@"
  ko: "@a@b%a002000: 익사한 건가...\n마물에게 당한 건가...\n어쨌건 참 안타깝게 됐군.\n@c0@"
  sl: "@a@b%a002000：淹死的？\n　　还是被魔物杀死的？\n　　无论如何都够可怜的。\n@c0@"
  tl: "@a@b%a002000：淹死的？\n　　還是被魔物殺死的？\n　　無論如何都夠可憐的。\n@c0@"
10:
  en: "@a%0%a002010@bIt certainly seems that it's been a while since he passed away.\n@c0@"
  ja: "@a@b%a002010「亡くなってから\n\tだいぶ　たっている\n\tようすだわね。\n@c0@"
  ko: "@a@b%a002010: 죽은 지\n제법 된 것\n같아 보여.\n@c0@"
  sl: "@a@b%a002010：看上去已经死了很久了。\n@c0@"
  tl: "@a@b%a002010：看上去已經死了很久了。\n@c0@"
11:
  en: "@a%0%a002020@bUh...it's really dead, right? Like, it's not a zombie or anything?\n@c0@"
  ja: "@a@b%a002020「だいじょうぶ？\n\tおそってきたり　しないかな？\n@c0@"
  ko: "@a@b%a002020: 괜찮아?\n갑자기 공격해 오는 거 아닐까?\n@c0@"
  sl: "@a@b%a002020：真的没事吗？\n　　不会突然袭击我们吧？\n@c0@"
  tl: "@a@b%a002020：真的沒事嗎？\n　　不會突然襲擊我們吧？\n@c0@"
12:
  en: "@a%0%a002030@bI pray he may rest in peace.\n@c0@"
  ja: "@a@b%a002030「じょうぶつ　して\n\tもらえるように　祈りましょう。\n@c0@"
  ko: "@a@b%a002030: 좋은 곳으로\n가시도록 기도합시다.\n@c0@"
  sl: "@a@b%a002030：我们一起来衷心\n　　祈祷它快些升天吧。\n@c0@"
  tl: "@a@b%a002030：我們一起來衷心\n　　祈禱它快些升天吧。\n@c0@"
13:
  en: "@a%0%a002050@b%0%a000090, it's probably better not to chat with corpses...\n@c0@"
  ja: "@a@b%a002050「%a000090さん……\n\tなるべく　話しかけたり\n\tしないほうが　いいのでは……？\n@c0@"
  ko: "@a@b%a002050: %a000090 님......\n가급적 말을 안 거는 게\n좋지 않을까요......?\n@c0@"
  sl: "@a@b%a002050：%a000090……\n　　还是尽量不要\n　　和它说话比较好吧……\n@c0@"
  tl: "@a@b%a002050：%a000090……\n　　還是儘量不要\n　　和它說話比較好吧……\n@c0@"
14:
  en: "@a%0%a002040@bCan't tell the cause of death from a bunch of bones...\n@c0@"
  ja: "@a@b%a002040「ホネだけじゃ\n\tどうして　死んだのかは\n\tわからないな。\n@c0@"
  ko: "@a@b%a002040: 뼈만 봐서는\n어떻게 죽었는지\n알 수 없군.\n@c0@"
  sl: "@a@b%a002040：只剩下骨头，\n　　都没法知道\n　　它是怎么死的了。\n@c0@"
  tl: "@a@b%a002040：只剩下骨頭，\n　　都沒法知道\n　　它是怎麼死的了。\n@c0@"
15:
  en: "@a%0%a002060@b(snarl) Only...bones... (spit)\n@c0@"
  ja: "@a@b%a002060「ホネ…だけ……。\n\tギルルルル……。\n@c0@"
  ko: "@a@b%a002060: 뼈만...남았다......\n캬르르르......\n@c0@"
  sl: "@a@b%a002060：只剩下……骨头……\n　　咕噜噜噜噜……\n@c0@"
  tl: "@a@b%a002060：只剩下……骨頭……\n　　咕嚕嚕嚕嚕……\n@c0@"
16:
  en: "@a%0%a002070@b(jiggle) Boing.\n@c0@"
  ja: "@a@b%a002070「プルプル……。\n@c0@"
  ko: "@a@b%a002070: 뽀용뽀용......\n@c0@"
  sl: "@a@b%a002070：噗噜噗噜……\n@c0@"
  tl: "@a@b%a002070：噗嚕噗嚕……\n@c0@"
17:
  en: "@a%0%a002000@bBlimey! We found it, %a000090! The ultimate key!\n@c0@"
  ja: "@a@b%a002000「おっ！\n\tこれぞ　さいごのカギ！\n\tやったな　%a000090！\n@c0@"
  ko: "@a@b%a002000: 오옷!\n이게 바로 최후의 열쇠!\n찾았다, %a000090!\n@c0@"
  sl: "@a@b%a002000：哎呀！\n　　这就是最后的钥匙啊！\n　　%a000090你还真行啊！\n@c0@"
  tl: "@a@b%a002000：哎呀！\n　　這就是最後的鑰匙啊！\n　　%a000090你還真行啊！\n@c0@"
18:
  en: "@a%0%a002010@bWe got it! Now we'll be able to pass freely through all sorts of doors.\n@c0@"
  ja: "@a@b%a002010「やったわね！\n\tこれで　いろいろな　トビラを\n\t自由に　通れるわ。\n@c0@"
  ko: "@a@b%a002010: 해냈어!\n이제 다양한 문을\n자유롭게 지나갈 수 있어.\n@c0@"
  sl: "@a@b%a002010：找到了！\n　　有了它就可以自由地\n　　通过各种各样的门了。\n@c0@"
  tl: "@a@b%a002010：找到了！\n　　有了它就可以自由地\n　　通過各種各樣的門了。\n@c0@"
19:
  en: "@a%0%a002030@bThank the Goddess no one else stumbled upon the ultimate key before us.\n@c0@"
  ja: "@a@b%a002030「さいごのカギ……。\n\tよく　だれにも　取られずに\n\tねむっていて　くれましたね！\n@c0@"
  ko: "@a@b%a002030: 최후의 열쇠......\n다행히 아무도 안 가져가고\n여기에 얌전히 잠들어 있었군요!\n@c0@"
  sl: "@a@b%a002030：最后的钥匙……\n　　居然能一直沉睡在这里，\n　　没有被其他人拿走呢！\n@c0@"
  tl: "@a@b%a002030：最後的鑰匙……\n　　居然能一直沉睡在這裡，\n　　沒有被其他人拿走呢！\n@c0@"
20:
  en: "@a%0%a002020@bWow! No door'll stand in our way now!\n@c0@"
  ja: "@a@b%a002020「この　さいごのカギで\n\tいろんなトビラを　開けちゃおう！\n@c0@"
  ko: "@a@b%a002020: 이 최후의 열쇠로\n여러 문을 열고 다니자구!\n@c0@"
  sl: "@a@b%a002020：各种各样的门\n　　都能用这把最后的钥匙打开了！\n@c0@"
  tl: "@a@b%a002020：各種各樣的門\n　　都能用這把最後的鑰匙打開了！\n@c0@"
21:
  en: "@a%0%a002050@bThere've been a bunch of doors we couldn't open, right?\n@c0@"
  ja: "@a@b%a002050「いままでに\n\tまだ　開けていない　トビラが\n\tいくつも　ありましたよね？\n@c0@"
  ko: "@a@b%a002050: 지금까지\n열 수 없었던 문이\n많이 있었죠?\n@c0@"
  sl: "@a@b%a002050：之前应该还有\n　　一些没办法打开的门吧？\n@c0@"
  tl: "@a@b%a002050：之前應該還有\n　　一些沒辦法打開的門吧？\n@c0@"
22:
  en: "@a%0%a002050@bShould we go round and open them all at once, or should we take them as they come?\n@c0@"
  ja: "@a@b%a002050「今から　いっきに\n\t開けてまわるか　そのつどにするか\n\tなやみどころですね。\n@c0@"
  ko: "@a@b%a002050: 앞으로 한꺼번에 열면서\n돌아다닐지, 보일 때마다 하나씩 열지\n고민되는군요.\n@c0@"
  sl: "@a@b%a002050：我们是一下子把它们\n　　全打开呢？还是一个个慢慢来呢？\n　　真是伤脑筋啊。\n@c0@"
  tl: "@a@b%a002050：我們是一下子把它們\n　　全打開呢？還是一個個慢慢來呢？\n　　真是傷腦筋啊。\n@c0@"
23:
  en: "@a%0%a002000@bWatching over us, aye? What, like the Goddess 'n' everything like that?\n@c0@"
  ja: "@a@b%a002000「世界を　見守るもの……\n\tって　神さまみたいな\n\tものなのか……？\n@c0@"
  ko: "@a@b%a002000: 세계를 지켜보는 자......\n그게 뭐지? 신 같은\n존재인가......?\n@c0@"
  sl: "@a@b%a002000：所谓世界的守护者……\n　　难道是像神一样的存在吗？\n@c0@"
  tl: "@a@b%a002000：所謂世界的守護者……\n　　難道是像神一樣的存在嗎？\n@c0@"
24:
  en: "@a%0%a002000@bNow that I think about it, could she be that voice we've been hearin' off and on...?\n@c0@"
  ja: "@a@b%a002000「そういえば　いままでに\n\t不思議な声が　なんどか\n\t聞こえて　いたようだったが……。\n@c0@"
  ko: "@a@b%a002000: 그러고 보니 지금까지\n신비한 목소리가 몇 번이나\n들렸던 것 같은데......\n@c0@"
  sl: "@a@b%a002000：如此说来，\n　　咱之前好像也听到过\n　　几次不可思议的声音……\n@c0@"
  tl: "@a@b%a002000：如此說來，\n　　咱之前好像也聽到過\n　　幾次不可思議的聲音……\n@c0@"
25:
  en: "@a%0%a002010@bRubiss must have been watching over us every step of our journey so far.\n@c0@"
  ja: "@a@b%a002010「私たちは　ずっと\n\tルビスさまに　見守られて\n\tここまで　きたのね。\n@c0@"
  ko: "@a@b%a002010: 우리는 줄곧\n루비스 님이 지켜보시는 가운데\n여기까지 오게 된 거야.\n@c0@"
  sl: "@a@b%a002010：我们是在\n　　卢比斯大人的守护下\n　　才能一路走到现在啊。\n@c0@"
  tl: "@a@b%a002010：我們是在\n　　盧比斯大人的守護下\n　　才能一路走到現在啊。\n@c0@"
26:
  en: "@a%0%a002030@bWe have only made it this far with the blessing of Rubiss and the most merciful Goddess.\n@c0@"
  ja: "@a@b%a002030「ここまで　これたのも\n\tルビスさまと　ゲントの神の\n\tおみちびきが　あったからですね。\n@c0@"
