29:
  en: "@a%0%a002050@bBlimey... Rubiss is a looker alright...\n@c0@"
  ja: "@a@b%a002050「ルビスさま……\n\tおうつくしい……。\n@c0@"
  ko: "@a@b%a002050: 루비스 님......\n아름다우십니다......\n@c0@"
