  sl: "@a@b%a002030：我们能够一路走来，\n　　都是因为有卢比斯大人和\n　　根特之神在前方指引着道路啊。\n@c0@"
  tl: "@a@b%a002030：我們能夠一路走來，\n　　都是因為有盧比斯大人和\n　　根特之神在前方指引著道路啊。\n@c0@"
27:
  en: "@a%0%a002020@bTalk about a warm welcome. Meeting Rubiss was almost like going home to see mom.\n@c0@"
  ja: "@a@b%a002020「ルビスさま……\n\tまるで　おかあさんのように\n\tあたたかいね……。\n@c0@"
  ko: "@a@b%a002020: 루비스 님......\n마치 어머니처럼\n따뜻해......\n@c0@"
  sl: "@a@b%a002020：卢比斯大人……\n　　让人感觉像母亲一样温暖呢……\n@c0@"
  tl: "@a@b%a002020：盧比斯大人……\n　　讓人感覺像母親一樣溫暖呢……\n@c0@"
28:
  en: "@a%0%a002040@bWhether she watches over us or not, we're taking down the forces of darkness.\n@c0@"
  ja: "@a@b%a002040「誰かが　見ていようが\n\t見ていまいが　オレたちは\n\t闇のチカラを　倒してみせるぜ。\n@c0@"
  ko: "@a@b%a002040: 누가 보고 있든\n말든 우리는\n어둠의 힘을 쓰러뜨리고 말 거라고.\n@c0@"
  sl: "@a@b%a002040：不管有没有人看着，\n　　我们都要去把暗之力量打倒！\n@c0@"
