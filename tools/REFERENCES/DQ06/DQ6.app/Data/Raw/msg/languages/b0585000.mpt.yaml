41:
  en: "@a%0%a002000@bHey, that evil's as good as gone with us on the job!\n@c0@"
  ja: "@a@b%a002000「よーし！\n\tその　邪悪なチカラを\n\tぶっとばして　こようぜ！\n@c0@"
  ko: "@a@b%a002000: 좋아!\n그 사악한 힘을\n날려 버리고 오자고!\n@c0@"
  sl: "@a@b%a002000：好嘞！\n　　咱们去把这股\n　　邪恶的力量干掉吧！\n@c0@"
  tl: "@a@b%a002000：好嘞！\n　　咱們去把這股\n　　邪惡的力量幹掉吧！\n@c0@"
42:
  en: "@a%0%a002010@bCome on, %a000090, let's do as Rubiss says and set about exploring this world!\n@c0@"
  ja: "@a@b%a002010「さあ　%a000090。\n\tルビスさまの　いうとおり\n\t世界中を　まわってみましょ！\n@c0@"
  ko: "@a@b%a002010: 가자, %a000090.\n루비스 님 말씀대로\n전 세계를 돌아 보는 거야!\n@c0@"
  sl: "@a@b%a002010：我说%a000090，\n　　我们就按卢比斯大人说的，\n　　走遍整个世界吧！\n@c0@"
  tl: "@a@b%a002010：我說%a000090，\n　　我們就按盧比斯大人說的，\n　　走遍整個世界吧！\n@c0@"
43:
  en: "@a%0%a002030@bLet us shed light on the world's darkest mysteries!\n@c0@"
  ja: "@a@b%a002030「ときあかしましょう\n\tすべての　ナゾを！\n@c0@"
  ko: "@a@b%a002030: 꼭 밝혀냅시다.\n모든 비밀을!\n@c0@"
  sl: "@a@b%a002030：我们去解开\n　　所有的谜题吧！\n@c0@"
  tl: "@a@b%a002030：我們去解開\n　　所有的謎題吧！\n@c0@"
44:
  en: "@a%0%a002020@bI feel like we could do just about anything with Rubiss on our side.\n@c0@"
  ja: "@a@b%a002020「ルビスさまに\n\t見守って　もらっていれば\n\t１００人力だよね！\n@c0@"
  ko: "@a@b%a002020: 루비스 님이\n지켜봐 주신다면\n일당백으로 싸울 수 있어!\n@c0@"
  sl: "@a@b%a002020：有卢比斯大人\n　　守护着我们，\n　　真是让人安心不少呢！\n@c0@"
  tl: "@a@b%a002020：有盧比斯大人\n　　守護著我們，\n　　真是讓人安心不少呢！\n@c0@"
45:
  en: "@a%0%a002040@bLet's show her that we can choose our own path, right, %a000090?\n@c0@"
  ja: "@a@b%a002040「自分たちの　すべきことは\n\t自分たちで　決めてみせるさ。\n\tなあ　%a000090？\n@c0@"
  ko: "@a@b%a002040: 우리가 해야 할 일은\n우리 스스로 정하겠다.\n내 말이 맞지, %a000090?\n@c0@"
  sl: "@a@b%a002040：我们必须自己决定\n　　自己应当去做什么。\n　　对吧？%a000090？\n@c0@"
  tl: "@a@b%a002040：我們必須自己決定\n　　自己應當去做什麼。\n　　對吧？%a000090？\n@c0@"
46:
  en: "@a%0%a002050@bI wish she'd tell us where exactly this breath-drawin' evil force was...\n@c0@"
  ja: "@a@b%a002050「ついでに　邪悪なチカラを\n\tどこから感じるか　教えてもらえると\n\tうれしいですよね……。\n@c0@"
  ko: "@a@b%a002050: 말씀하신 김에 사악한 힘을\n어디서 느끼시는지도 좀 알려 주시면\n좋을 텐데......\n@c0@"
  sl: "@a@b%a002050：如果能告诉我们是从\n　　哪里感受到的邪恶的力量，\n　　可就太好了……\n@c0@"
  tl: "@a@b%a002050：如果能告訴我們是從\n　　哪裡感受到的邪惡的力量，\n　　可就太好了……\n@c0@"
