  sl: "@a@b%a002070：噗噜噗噜。\n@c0@"
  tl: "@a@b%a002070：噗嚕噗嚕。\n@c0@"
32:
  en: "@a%0%a002000@bShe's got that right. We never would've reached that island without the ocarina.\n@c0@"
  ja: "@a@b%a002000「あの笛の　おかげで\n\tムドーの　居城に　行けたような\n\tもんだからな。\n@c0@"
  ko: "@a@b%a002000: 그 피리 덕분에\n무도의 성으로 갈 수 있었던 거나\n마찬가지지.\n@c0@"
  sl: "@a@b%a002000：多亏了那只笛子，\n　　咱们才能抵达姆多的城堡啊。\n@c0@"
  tl: "@a@b%a002000：多虧了那隻笛子，\n　　咱們才能抵達姆多的城堡啊。\n@c0@"
33:
  en: "@a%0%a002000@bWe owe her big time, aye?\n@c0@"
  ja: "@a@b%a002000「ルビスさまには\n\tホントに　感謝してるぜ！\n@c0@"
  ko: "@a@b%a002000: 루비스 님께는\n정말 감사한 마음이야!\n@c0@"
  sl: "@a@b%a002000：真是太谢谢\n　　卢比斯大人了！\n@c0@"
  tl: "@a@b%a002000：真是太謝謝\n　　盧比斯大人了！\n@c0@"
34:
  en: "@a%0%a002010@bIndeed. The evil I sensed on that island was anything but ordinary.\n@c0@"
  ja: "@a@b%a002010「たしかに　あの島の\n\t邪悪な　気配は　ふつうでは\n\tなかったわね。\n@c0@"
  ko: "@a@b%a002010: 맞아. 그 섬에서\n느껴지는 사악한 기운은\n보통이 아니었어.\n@c0@"
  sl: "@a@b%a002010：那个岛上的\n　　邪恶气息确实不同寻常呢。\n@c0@"
  tl: "@a@b%a002010：那個島上的\n　　邪惡氣息確實不同尋常呢。\n@c0@"
35:
  en: "@a%0%a002030@bWe shall prevail over the forces of darkness.\n@c0@"
  ja: "@a@b%a002030「私たちは　かならず\n\t闇のチカラに　打ち勝ちます！\n@c0@"
  ko: "@a@b%a002030: 우리는 반드시\n어둠의 힘을 이겨내고 말 겁니다!\n@c0@"
  sl: "@a@b%a002030：我们一定会\n　　战胜暗之力量的！\n@c0@"
  tl: "@a@b%a002030：我們一定會\n　　戰勝暗之力量的！\n@c0@"
36:
  en: "@a%0%a002020@bNo new monsters'll set up shop on that island while we're around.\n@c0@"
  ja: "@a@b%a002020「もしまた　あの島に\n\tべつの　まものが　住みついても\n\tあたしたちが　やっつけちゃうから！\n@c0@"
  ko: "@a@b%a002020: 혹시 그 섬에 또 다른\n마물이 살게 되어도\n우리가 해치워 버릴 거야!\n@c0@"
  sl: "@a@b%a002020：即使又有别的\n　　魔物住到了那个岛上，\n　　我们也会把它干掉的！\n@c0@"
  tl: "@a@b%a002020：即使又有別的\n　　魔物住到了那個島上，\n　　我們也會把它幹掉的！\n@c0@"
37:
  en: "@a%0%a002040@b...An ocarina?\n@c0@"
  ja: "@a@b%a002040「笛……？\n\t笛が　なにかの役に\n\t立ったのか？\n@c0@"
  ko: "@a@b%a002040: 피리......?\n피리가 무슨 도움이 된 적이\n있었나?\n@c0@"
  sl: "@a@b%a002040：笛子？\n　　笛子又能发挥什么作用？\n@c0@"
  tl: "@a@b%a002040：笛子？\n　　笛子又能發揮什麼作用？\n@c0@"
38:
  en: "@a%0%a002050@bOld %a002050 wishes he could've pitched in when you battered Murdaw.\n@c0@"
  ja: "@a@b%a002050「私も　ムドー退治の\n\tお役に　立ちたかったです！\n@c0@"
  ko: "@a@b%a002050: 저도 무도 퇴치에\n도움이 되고 싶었습니다!\n@c0@"
  sl: "@a@b%a002050：我也好想在打败\n　　姆多的时候出一份力啊！\n@c0@"
  tl: "@a@b%a002050：我也好想在打敗\n　　姆多的時候出一份力啊！\n@c0@"
