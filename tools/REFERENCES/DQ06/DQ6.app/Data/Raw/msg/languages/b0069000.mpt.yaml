2:
  en: "@a@b*: What's wrong with this land? Murdaw's defeat didn't thin out the monsters' numbers at all. They're growing, even!\n@c0@"
  ja: "@a@b＊「ねえ　いったい　どうなっているの？\n\tムドーが　倒されてからも　まものが\n\tいなくなるどころか　ふえたりして。\n@c0@"
  ko: "@a@b*: 도대체 어떻게 된 거야?\n무도가 쓰러진 후에도 마물이\n줄기는커녕 늘어나고 있잖아.\n@c0@"
  sl: "@a@b＊：诶，到底怎么回事嘛？\n　　姆多被打倒了，\n　　魔物却反而增多了。\n@c0@"
