0:
  en: "@a@b*: You must have got %H0860%Xyourself%Yyourselves%Z pretty lost to end up here.\n@c0@"
  ja: "@a@b＊「おや　こんな　山奥に\n\tよく来たね。\n@c0@"
  ko: "@a@b*: 오오, 이런 두메산골까지\n용케도 찾아왔구나.\n@c0@"
  sl: "@a@b＊：哎呀，居然到了\n　　这么深的山里来。\n@c0@"
  tl: "@a@b＊：哎呀，居然到了\n　　這麼深的山裡來。\n@c0@"
1:
  en: "@a@b*: Welcome to Dullerton, a village that's not even interesting enough to live up to its name.\n@c0@"
  ja: "@a@b＊「ここは　ザクソンの村だよ。\n@c0@"
  ko: "@a@b*: 여긴 잭슨 마을이야.\n@c0@"
  sl: "@a@b＊：这里是赞克索村。\n@c0@"
  tl: "@a@b＊：這裡是贊克索村。\n@c0@"
2:
  en: "@a@b*: Someone's come to visit! Someone's come to visit! This is the most exciting thing that's ever happened!\n@c0@"
  ja: "@a@b＊「あっ　旅の人だ！\n\tわーい　わーい！\n@c0@"
  ko: "@a@b*: 앗, 여행자다!\n우와~ 우와~!\n@c0@"
  sl: "@a@b＊：啊，是旅行者啊！\n　　好棒好棒！\n@c0@"
  tl: "@a@b＊：啊，是旅行者啊！\n　　好棒好棒！\n@c0@"
3:
  en: "@a@b*: Old Wynne was Dullerton's most famous son. No one made better armour than him.\n@c0@"
  ja: "@a@b＊「エンデじいさんの　作った防具が\n\t高く売れたおかげで　こんなに\n\tりっぱな　畑が　できたんだよ。\n@c0@"
  ko: "@a@b*: 엔데 영감님이 만든 장비가\n비싸게 팔린 덕에 이렇게\n훌륭한 밭이 생겼어.\n@c0@"
  sl: "@a@b＊：因为恩迪爷爷制作的防具\n　　卖了好价钱，所以才能修得起\n　　这么棒的农田啊。\n@c0@"
  tl: "@a@b＊：因為恩迪爺爺製作的防具\n　　賣了好價錢，所以才能修得起\n　　這麼棒的農田啊。\n@c0@"
4:
  en: "@a@b*: Since he went away, we've lost the income from his armour and the town's been struggling to make ends meet.\n@c0@"
  ja: "@a@b＊「けど　エンデじいさんは\n\tいなくなっちまって……。\n@c0@"
  ko: "@a@b*: 하지만 엔데 영감님은\n이제 여기 없지......\n@c0@"
  sl: "@a@b＊：不过，恩迪爷爷不见了……\n@c0@"
  tl: "@a@b＊：不過，恩迪爺爺不見了……\n@c0@"
5:
  en: "@a@b*: Wynne disappeared, but his wife lives here still. She's looked after by Wynne's trusty dog, Silver.\n@c0@"
  ja: "@a@b＊「たったひとり　残された\n\tばあさんを　ああやって守ってる\n\t犬の　シルバーが　ふびんでねえ……。\n@c0@"
  ko: "@a@b*: 혼자 남은\n할머니를 저렇게 지켜 주는\n실버라는 개가 얼마나 가엾은지......\n@c0@"
  sl: "@a@b＊：只留下小狗席尔瓦保护着\n　　独自一人留下的婆婆，\n　　也真是可怜……\n@c0@"
  tl: "@a@b＊：只留下小狗席爾瓦保護著\n　　獨自一人留下的婆婆，\n　　也真是可憐……\n@c0@"
6:
  en: "@a@b*: Moooo... Moooo...\n@c0@"
  ja: "@a@b＊「モー　モー。\n@c0@"
  ko: "@a@b*: 음메~ 음메~\n@c0@"
  sl: "@a@b＊：哞，哞。\n@c0@"
  tl: "@a@b＊：哞，哞。\n@c0@"
7:
  en: "@aSilver@bArf! Arf arf arf! Grrrrrr...\n@c0@"
  ja: "@a@bシルバー「ウウーー　ワンワンワン！\n\tガルル～。\n@c0@"
  ko: "@a@b실버: 우우~~ 왈왈왈!\n그르르~\n@c0@"
  sl: "@a@b席尔瓦：呜呜～汪汪汪！\n　　嗷嗷嗷～\n@c0@"
  tl: "@a@b席爾瓦：嗚嗚～汪汪汪！\n　　嗷嗷嗷～\n@c0@"
8:
  en: "@a@b*: Meow.\n@c0@"
  ja: "@a@b＊「にゃーん。\n@c0@"
  ko: "@a@b*: 냐앙~\n@c0@"
  sl: "@a@b＊：喵。\n@c0@"
  tl: "@a@b＊：喵。\n@c0@"
9:
  en: "@a@b*: ...Let me think. I'm pretty sure there was something exciting that happened once in Dullerton...\n@c0@"
  ja: "@a@b＊「ハァーー　オラが　畑に\n\t作物が　実りーー♪\n@c0@"
  ko: "@a@b*: 아아~~ 나의 밭에\n작물이 맺히면~~♪♪\n@c0@"
  sl: "@a@b＊：哈，下地劳作，\n　　庄稼收获～♪\n@c0@"
  tl: "@a@b＊：哈，下地勞作，\n　　莊稼收穫～♪\n@c0@"
10:
  en: "@a@b*: ...No, wait. That clearly happened somewhere else. My mistake.\n@c0@"
  ja: "@a@b＊「オラの　胸には\n\t恋の　花咲くうーー♪♪\n@c0@"
  ko: "@a@b*: 나의 가슴속에는\n사랑의 꽃이 피어나네~~♪♪\n@c0@"
  sl: "@a@b＊：爱情的花儿\n　　心中开～♪♪\n@c0@"
  tl: "@a@b＊：愛情的花兒\n　　心中開～♪♪\n@c0@"
11:
  en: "@a@b*: In the bad old days, death, hopelessness and utter despair were pretty much all we knew around these parts.\n@c0@"
  ja: "@a@b＊「この村には　神父さまも　いねえし\n\t病人は　みんな　バタバタと\n\t死んでいっただよ。\n@c0@"
  ko: "@a@b*: 이 마을에는 신부님도 안 계셔서\n일단 병에 걸리면 모두\n픽픽 쓰러져 죽어 갔어.\n@c0@"
  sl: "@a@b＊：这个村里没有神父，\n　　所以过去人们生了病，\n　　就接二连三地死去了。\n@c0@"
  tl: "@a@b＊：這個村裡沒有神父，\n　　所以過去人們生了病，\n　　就接二連三地死去了。\n@c0@"
12:
  en: "@a@b*: There wasn't even a priest here to cure the sick.\n㈡\n*: Then Sister Grinn rode into town armed with nothing but a pure heart and some pretty poor jokes.\n@c0@"
  ja: "@a@b＊「けんど　マザー・ヘレンが\n\t来てくれてからは　病人も\n\t元気になって……\n@c0@"
  ko: "@a@b*: 하지만 마더 헬렌이\n오신 후로는 환자도\n건강해졌지......\n@c0@"
  sl: "@a@b＊：但是海伦嬷嬷来了之后，\n　　病人也恢复了健康……\n@c0@"
  tl: "@a@b＊：但是海倫嬤嬤來了之後，\n　　病人也恢復了健康……\n@c0@"
13:
  en: "@a@b*: If only she'd come sooner, she might have cheered Wynne up, and he'd still be hammering away in his smithy... (sniff)\n@c0@"
  ja: "@a@b＊「もっと早く　来てくださっていれば\n\tエンデじいさんも　あんなことには\n\tならんかったかもな。\n@c0@"
  ko: "@a@b*: 더 빨리 오셨다면\n엔데 영감님도 그렇게 되진\n않았을 텐데.\n@c0@"
  sl: "@a@b＊：要是早些来的话，\n　　恩迪爷爷也不会\n　　遇到那种事。\n@c0@"
  tl: "@a@b＊：要是早些來的話，\n　　恩迪爺爺也不會\n　　遇到那種事。\n@c0@"
14:
  en: "@a@b*: My wife never lets up about my supposedly sub-standard ploughing skills. Reckons I'm too slow...\n@c0@"
  ja: "@a@b＊「こんな　小さな畑でも\n\tオレひとりだと　けっこう\n\t大変なんだぜ。\n@c0@"
  ko: "@a@b*: 이렇게 작은 밭이지만\n나 혼자서 갈기엔\n얼마나 힘든지 몰라.\n@c0@"
  sl: "@a@b＊：虽然这块地很小，\n　　但是我一个人耕作起来\n　　也很辛苦啊。\n@c0@"
  tl: "@a@b＊：雖然這塊地很小，\n　　但是我一個人耕作起來\n　　也很辛苦啊。\n@c0@"
15:
  en: "@a@b*: I'd like to see her do better! This field may be small, but it needs one heck of a lot of ploughing!\n@c0@"
  ja: "@a@b＊「それなのに　カカアのやつ\n\tオレの仕事が　のろいなんて\n\tいいやがって……　チェッ！\n@c0@"
  ko: "@a@b*: 그런데도 마누라는\n내가 일하는 게 느려 터졌다면서\n불평이나 하고...... 쳇!\n@c0@"
  sl: "@a@b＊：但是，孩子他妈\n　　居然说我活\n　　干得慢……嘁！\n@c0@"
  tl: "@a@b＊：但是，孩子他媽\n　　居然說我活\n　　幹得慢……嘁！\n@c0@"
16:
  en: "@a@b*: Visitors? To Dullerton? You really couldn't think of anywhere better to go?\n@c0@"
  ja: "@a@b＊「おや　旅の方だね。\n\tおおかた　クラーク・エンデの\n\tウワサを聞いて　来たんじゃろう。\n@c0@"
  ko: "@a@b*: 오오, 여행자로구먼.\n아마도 클라크 엔데의\n소문을 듣고 찾아왔을 터.\n@c0@"
  sl: "@a@b＊：哎呀，是旅行者啊。\n　　你们也是听了克拉克·恩迪的\n　　大名才赶过来的吧。\n@c0@"
  tl: "@a@b＊：哎呀，是旅行者啊。\n　　你們也是聽了克拉克・恩迪的\n　　大名才趕過來的吧。\n@c0@"
17:
  en: "@a@b*: If it's rumours of Max Wynne and his mighty armour that brought you here, I'm afraid you're going to be disappointed.\n@c0@"
  ja: "@a@b＊「じゃが　もう　エンデは\n\tおらんぞい。　５年ほど前\n\tとつぜん　姿を消してのう。\n@c0@"
  ko: "@a@b*: 허나 엔데는 이미\n없다네. 5년쯤 전에\n돌연 모습을 감추었지.\n@c0@"
  sl: "@a@b＊：不过恩迪已经不在了。\n　　５年多前他忽然\n　　就消失了。\n@c0@"
  tl: "@a@b＊：不過恩迪已經不在了。\n　　５年多前他忽然\n　　就消失了。\n@c0@"
18:
  en: "@a@b*: It's been five long years since he bashed out his last breastplate and vanished into thin air.\n@c0@"
  ja: "@a@b＊「ずいぶん　ウデのいい防具職人\n\tじゃったが　いったい　なにが\n\tあったんじゃろか……。\n@c0@"
  ko: "@a@b*: 훌륭한 실력을 갖춘\n방어구 장인이었다네. 대체 무슨 일이\n일어난 겐지......\n@c0@"
  sl: "@a@b＊：他做防具的手艺\n　　相当不错呢。\n　　到底发生了什么事呢……\n@c0@"
  tl: "@a@b＊：他做防具的手藝\n　　相當不錯呢。\n　　到底發生了什麼事呢……\n@c0@"
19:
  en: "@a@b*: I saw it all, I tell you! With these very eyes! Shame no one believes a word I say...\n@c0@"
  ja: "@a@b＊「オラ　見ただよ。\n\tけんど　だれも　オラのことを\n\t信じてくれないだよ。\n@c0@"
  ko: "@a@b*: 난 봤어.\n그런데 아무도 내 말을\n안 믿어줘.\n@c0@"
  sl: "@a@b＊：我看见了啊。\n　　但是谁都不相信我说的话。\n@c0@"
  tl: "@a@b＊：我看見了啊。\n　　但是誰都不相信我說的話。\n@c0@"
20:
  en: "@a@b*: Look deep into my eyes... Bit deeper... That's it! You think I look trustworthy, right?\n@c0@"
  ja: "@a@b＊「あんたらは　オラのことを\n\t信じてくれるか？\n@c0@"
  ko: "@a@b*: 자네들은 내 말을\n믿어 주겠나?\n@c0@"
  sl: "@a@b＊：你们会相信我说的话吗？\n@c0@"
  tl: "@a@b＊：你們會相信我說的話嗎？\n@c0@"
21:
  en: "@a@b*: Finally, someone who's prepared to listen to my tale! Now make %H0860%Xyourself%Yyourselves%Z comfortable, because this is a good one! I call it ‘The Loss of Wynne’...\n@c0@"
  ja: "@a@b＊「そうか。　そんなら\n\t話してやるべ。\n@c0@"
  ko: "@a@b*: 그려? 그럼\n말해 주지.\n@c0@"
  sl: "@a@b＊：这样啊。\n　　那我就说了。\n@c0@"
  tl: "@a@b＊：這樣啊。\n　　那我就說了。\n@c0@"
22:
  en: "@a@b*: What happened was, Wynne was down in the dumps to an extent that was unusual even for Dullerton.\n@c0@"
  ja: "@a@b＊「あの晩　エンデじいさんは\n\tずいぶんと　落ち込んどった。\n@c0@"
  ko: "@a@b*: 그날 밤, 엔데 영감님은\n풀이 팍 죽어 있었지.\n@c0@"
  sl: "@a@b＊：那天晚上恩迪爷爷\n　　情绪非常消沉。\n@c0@"
  tl: "@a@b＊：那天晚上恩迪爺爺\n　　情緒非常消沉。\n@c0@"
23:
  en: "@a@b*: He bared his soul to me that night. Wondered what the point of hammering out yet another helmet was...\n@c0@"
  ja: "@a@b＊「わしが　いくら　防具を\n\t作っても　まものに　殺されて\n\tしまうひとが　後を絶たない……。\n@c0@"
  ko: "@a@b*: 자기가 아무리 방어구를\n만들어도 마물 때문에 죽는\n사람들이 끊이지 않는다며......\n@c0@"
  sl: "@a@b＊：老夫制作再多防具，\n　　还是会有人被魔物杀害。\n@c0@"
  tl: "@a@b＊：老夫製作再多防具，\n　　還是會有人被魔物殺害。\n@c0@"
24:
  en: "@a@b*: His life's work was all about protecting people, but no matter how hard he tried, people still got killed by monsters...\n@c0@"
  ja: "@a@b＊「わしの　やってることに\n\t意味が　あるんじゃろうか……って\n\t本当に　落ち込んでおったべ。\n@c0@"
  ko: "@a@b*: 자기가 하는 일에\n무슨 의미가 있느냐며......\n아주 침울해 보였어.\n@c0@"
  sl: "@a@b＊：老夫做的事情到底\n　　有没有意义……他一直说这些，\n　　真的非常消沉呢。\n@c0@"
  tl: "@a@b＊：老夫做的事情到底\n　　有沒有意義……他一直說這些，\n　　真的非常消沉呢。\n@c0@"
25:
  en: "@a@b*: I tried to cheer him up, but it was no use! And that's when it happened...\n@c0@"
  ja: "@a@b＊「もう　消えてしまうくらいに\n\t落ち込んどってな……。\n\tその時だべよっ！\n@c0@"
  ko: "@a@b*: 그 자리에서 사라져 버릴 것처럼\n고개를 푹 숙이고 있는데......\n바로 그때였어!\n@c0@"
  sl: "@a@b＊：消沉得\n　　人都感觉要消失了……\n　　就是那个时候！\n@c0@"
  tl: "@a@b＊：消沉得\n　　人都感覺要消失了……\n　　就是那個時候！\n@c0@"
26:
  en: "@a@b*: He disappeared into thin air, never to be seen or heard from again! And that was how we lost Wynne...\n@c0@"
  ja: "@a@b＊「ホントに　エンデじいさんの\n\t姿が　消えてしまったんだべよ！\n\tウソじゃねえべよ！\n@c0@"
  ko: "@a@b*: 엔데 영감님의 모습이\n진짜로 사라져 버렸어!\n거짓말 아니라니까!\n@c0@"
  sl: "@a@b＊：恩迪爷爷真的消失了啊！\n　　我没有骗你啊！\n@c0@"
  tl: "@a@b＊：恩迪爺爺真的消失了啊！\n　　我沒有騙你啊！\n@c0@"
27:
  en: "@a@b*: And I thought you were different! Fine! Don't trust me then! See if I care!\n@c0@"
  ja: "@a@b＊「やっぱりだ！\n\tだれも　オラのことなんか\n\t信じてくれないだよ！\n@c0@"
  ko: "@a@b*: 역시나!\n아무도 내 말을\n안 믿어 준다니까!\n@c0@"
  sl: "@a@b＊：果然。\n　　谁都不相信我说的话。\n@c0@"
  tl: "@a@b＊：果然。\n　　誰都不相信我說的話。\n@c0@"
28:
  en: "@a@b*: Listen, you've made it perfectly clear that you aren't going to believe a word I say, so let's leave it at that!\n@c0@"
  ja: "@a@b＊「もう　ええ！\n\tもう　ええんじゃっ。\n@c0@"
  ko: "@a@b*: 이제 됐어!\n이제 됐다니까.\n@c0@"
  sl: "@a@b＊：够了！\n　　已经够了。\n@c0@"
  tl: "@a@b＊：夠了！\n　　已經夠了。\n@c0@"
29:
  en: "@a@b*: You can pester me all you like! My lips are sealed!\n@c0@"
  ja: "@a@b＊「そんなに　オラのことが\n\t信じられないなら　オラに\n\tかまわないでけろっ！\n@c0@"
  ko: "@a@b*: 그렇게 내 말을\n못 믿겠거든 나한테\n말을 걸지 말라고!\n@c0@"
  sl: "@a@b＊：要是不相信我说的话，\n　　就不要来烦我！\n@c0@"
  tl: "@a@b＊：要是不相信我說的話，\n　　就不要來煩我！\n@c0@"
30:
  en: "@a@b*: Visitors to Dullerton tend to make their excuses and leave within minutes.\n@c0@"
  ja: "@a@b＊「おや　あんたたち　ヨソ者だね。\n\tこんな　何もない村に\n\tなんの用だい？\n@c0@"
  ko: "@a@b*: 어라, 당신들 외부인이잖아?\n이렇게 아무것도 없는 마을에\n무슨 볼일이지?\n@c0@"
  sl: "@a@b＊：哎呀，你们不是这里的人吧。\n　　来这个村子有什么事吗？\n@c0@"
  tl: "@a@b＊：哎呀，你們不是這裡的人吧。\n　　來這個村子有什麼事嗎？\n@c0@"
31:
  en: "@a@b*: ...So why are you still here?\n@c0@"
  ja: "@a@b＊「とっとと　帰っておくれ！\n@c0@"
  ko: "@a@b*: 썩 돌아가지 못해!\n@c0@"
  sl: "@a@b＊：快点回去吧！\n@c0@"
  tl: "@a@b＊：快點回去吧！\n@c0@"
32:
  en: "@aSister Grinn@bWell, whaddaya know! Some special guests have joined us here in Dullerton!\n@c0@"
  ja: "@a@bヘレン「あたし　旅の尼よ。\n\tでも　もう　旅に出ることないね。\n@c0@"
  ko: "@a@b헬렌: 나 떠돌이 수녀.\n하지만 이제 여행 안 떠나.\n@c0@"
  sl: "@a@b海伦：我是旅行的修女。\n　　不过已经不会出门旅行了。\n@c0@"
  tl: "@a@b海倫：我是旅行的修女。\n　　不過已經不會出門旅行了。\n@c0@"
33:
  en: "@aSister Grinn@bWhen I first rolled into town, this place had no sparkle, no shine, no SOUL!\n@c0@"
  ja: "@a@bヘレン「あたし　ここ　来たとき\n\tみんな　ホントに　しょんぼり。\n\t元気　ぜんぜん　なかったね。\n@c0@"
  ko: "@a@b헬렌: 나 여기 왔을 때\n모두 기운 하나도 없었어.\n활기 전혀 없었어.\n@c0@"
  sl: "@a@b海伦：我刚来这里的时候，\n　　大家真的都无精打采的呢。\n　　一点精神都没有。\n@c0@"
  tl: "@a@b海倫：我剛來這裡的時候，\n　　大家真的都無精打采的呢。\n　　一點精神都沒有。\n@c0@"
34:
  en: "@aSister Grinn@bSo I decided to use my unique brand of humour to cheer people up and give them back the will to live.\n@c0@"
  ja: "@a@bヘレン「だから　あたし　面白いことを\n\tいって　みんなを\n\tわらわせて　あげたね。\n@c0@"
  ko: "@a@b헬렌: 그래서 나 재밌는\n얘기 해서 모두를\n웃겨 줬어.\n@c0@"
  sl: "@a@b海伦：所以我讲了个笑话，\n　　把大家逗笑了呢。\n@c0@"
  tl: "@a@b海倫：所以我講了個笑話，\n　　把大家逗笑了呢。\n@c0@"
35:
  en: "@aSister Grinn@bI think you'll agree, it's been a resounding success!\n㈡\nThese days, the folks round here are the sunniest bunch a person could hope to meet!\n@c0@"
  ja: "@a@bヘレン「そしたら　みんな\n\tすこしずつ　元気でたよ。\n@c0@"
  ko: "@a@b헬렌: 그랬더니 모두\n조금씩 기운 찾았어.\n@c0@"
  sl: "@a@b海伦：之后大家就\n　　渐渐地恢复了精神。\n@c0@"
  tl: "@a@b海倫：之後大家就\n　　漸漸地恢復了精神。\n@c0@"
36:
  en: "@aSister Grinn@bSo whaddaya say? Wanna hear some of my comic routine, live and uncut?\n@c0@"
  ja: "@a@bヘレン「お前も　あたしの\n\t面白いこと　聞くか？\n@c0@"
  ko: "@a@b헬렌: 너도 내\n재밌는 얘기 들을래?\n@c0@"
  sl: "@a@b海伦：你也要听\n　　我讲的笑话吗？\n@c0@"
  tl: "@a@b海倫：你也要聽\n　　我講的笑話嗎？\n@c0@"
37:
  en: "@aSister Grinn@bSo this slime walks into a bar, and the barman says ‘Why so blue?’\n@c0@"
  ja: "@a@bヘレン「じゃあ　いうよ。\n\tこの盾　変よ。　立てへんから。\n@c0@"
  ko: "@a@b헬렌: 그럼 할게.\n방패 갖고 있으면 방 빼.\n@c0@"
  sl: "@a@b海伦：那我就说了。\n　　我今天心情不好。就说四句话。\n@c0@"
  tl: "@a@b海倫：那我就說了。\n　　我今天心情不好。就說四句話。\n@c0@"
38:
  en: "@aSister Grinn@bWait, wait! There's more! ...Wh-What's that!? You've heard enough!?\n@c0@"
  ja: "@a@bヘレン「魔王は　まあ　大きい。\n\t教会にいくのは　今日かい？\n@c0@"
  ko: "@a@b헬렌: 마왕에게 참 고마왕.\n신께 바람을 말하면 그건 신바람.\n@c0@"
  sl: "@a@b海伦：包括刚才那句。\n　　我说完了。\n@c0@"
  tl: "@a@b海倫：包括剛才那句。\n　　我說完了。\n@c0@"
39:
  en: "@aSister Grinn@bWell, I guess my unique brand of humour isn't to everyone's taste!\n㈡\nBut as I always say, ‘there's none more fun than a nun with a pun!’\n@c0@"
  ja: "@a@bヘレン「あははっ　自分でいってても\n\tおかしくて　わらってしまうよ。\n@c0@"
  ko: "@a@b헬렌: 아하하. 내가 말하고도\n웃겨서 웃음 나와.\n@c0@"
  sl: "@a@b海伦：啊哈哈，讲笑话\n　　自己都会笑呢，好奇怪。\n@c0@"
  tl: "@a@b海倫：啊哈哈，講笑話\n　　自己都會笑呢，好奇怪。\n@c0@"
40:
  en: "@aSister Grinn@bHave it your way. I guess my unique brand of humour isn't to everyone's taste!\n@c0@"
  ja: "@a@bヘレン「そうか。　聞かなくても\n\tお前　元気そうだしな。\n@c0@"
  ko: "@a@b헬렌: 그렇구나. 안 들어도\n너 건강해 보여.\n@c0@"
  sl: "@a@b海伦：这样啊。你即使不听笑话，\n　　精神也很好呢。\n@c0@"
  tl: "@a@b海倫：這樣啊。你即使不聽笑話，\n　　精神也很好呢。\n@c0@"
41:
  en: "@a@b*: Sister Grinn seems to find her jokes funnier than anyone else does.\n@c0@"
  ja: "@a@b＊「マザー・ヘレンの　お話って\n\tあまりに　くだらなさすぎて\n\tわらっちゃうの。\n@c0@"
  ko: "@a@b*: 마더 헬렌의 이야기는\n너무 시시해서\n피식 웃음이 나와.\n@c0@"
  sl: "@a@b＊：海伦嬷嬷讲的笑话\n　　实在是太无聊了，\n　　无聊得都想笑了呢。\n@c0@"
  tl: "@a@b＊：海倫嬤嬤講的笑話\n　　實在是太無聊了，\n　　無聊得都想笑了呢。\n@c0@"
42:
  en: "@a@b*: And if I ever have to hear that slime joke again...\n@c0@"
  ja: "@a@b＊「くだらないけど　いっしょうけんめいで\n\tその気持ちに　うたれて\n\t元気が出たって……\n@c0@"
  ko: "@a@b*: 시시하지만 열심히 하는 모습을 보고\n그 마음에 감동받아서\n기운이 솟았다고......\n@c0@"
  sl: "@a@b＊：虽然无聊，但是大家\n　　被她那副认真劲感染，\n　　精神恢复了呢……\n@c0@"
  tl: "@a@b＊：雖然無聊，但是大家\n　　被她那副認真勁感染，\n　　精神恢復了呢……\n@c0@"
43:
  en: "@a@b*: Still, we take whatever entertainment we can get here in Dullerton.\n@c0@"
  ja: "@a@b＊「うちの　父ちゃんは　いってたよ。\n@c0@"
  ko: "@a@b*: 우리 아빠가 말했어.\n@c0@"
  sl: "@a@b＊：我父亲是这么说的。\n@c0@"
  tl: "@a@b＊：我父親是這麼說的。\n@c0@"
44:
  en: "@a@b*: What in the blooming blazes? Visitors? Here!? What a rare treat!\n@c0@"
  ja: "@a@b＊「ほう　こんな所に　お客さんとは\n\tめずらしいのう。\n@c0@"
  ko: "@a@b*: 호오, 이런 곳에 손님이 오다니\n희한한 일도 다 있구먼.\n@c0@"
  sl: "@a@b＊：哦，这种地方居然有客人，\n　　很是罕见。\n@c0@"
  tl: "@a@b＊：哦，這種地方居然有客人，\n　　很是罕見。\n@c0@"
45:
  en: "@a@b*: Wait, don't leave! Special occasion, this is! Pull up a seat and have a listen to my secret!\n@c0@"
  ja: "@a@b＊「よし　いいことを教えてやろう。\n@c0@"
  ko: "@a@b*: 옳지, 좋은 정보를 알려 주겠네.\n@c0@"
  sl: "@a@b＊：那就告诉你有用的消息吧。\n@c0@"
  tl: "@a@b＊：那就告訴你有用的消息吧。\n@c0@"
46:
  en: "@a@b*: Scattered throughout the world are four pieces of legendary equipment.\n㈡\n*: They say that whoever completes the set gets to visit a castle in the sky...\n@c0@"
  ja: "@a@b＊「世界中に　ちらばっている\n\t伝説の４つの武具をあつめた者は\n\t神の城にゆけるという話じゃ。\n@c0@"
  ko: "@a@b*: 전 세계에 흩어져 있는\n전설의 장비 4종을 모두 모은 자는\n신의 성으로 갈 수 있다고 하네.\n@c0@"
  sl: "@a@b＊：传说要是集齐散落在\n　　世界上的传说中的４个武具，\n　　就能前往神之城了。\n@c0@"
  tl: "@a@b＊：傳說要是集齊散落在\n　　世界上的傳說中的４個武具，\n　　就能前往神之城了。\n@c0@"
47:
  en: "@a@b*: Not sure what I'm on about? Not to worry! There's a certain little island in the south seas.\n㈡\n*: Find it, and go down the stairs you see there. Your pathway will soon become clear!\n@c0@"
  ja: "@a@b＊「とりあえず　南の海に浮かぶ島の\n\t階段を　おりてみなされ。\n\tさすれば　道は　ひらけるじゃろう。\n@c0@"
  ko: "@a@b*: 일단은 남쪽 바다에 떠 있는 섬의\n계단을 내려가 보시게.\n그러면 길이 열릴 터이니.\n@c0@"
  sl: "@a@b＊：南边的海上漂浮着一座岛。\n　　首先请从那岛上的楼梯下去。\n　　那样道路就能打开了。\n@c0@"
  tl: "@a@b＊：南邊的海上漂浮著一座島。\n　　首先請從那島上的樓梯下去。\n　　那樣道路就能打開了。\n@c0@"
