0:
  en: "@a@b*: There's no place quite like Howsworth!\n@c0@"
  ja: "@a@b＊「ここは　ホルコッタの村よ。\n@c0@"
  ko: "@a@b*: 여긴 홀코타 마을이야.\n@c0@"
  sl: "@a@b＊：这里是荷尔克塔村。\n@c0@"
  tl: "@a@b＊：這裡是荷爾克塔村。\n@c0@"
1:
  en: "@a@b*: Prince Howard! It's always an honour to have you grace us with yer presence!\n@c0@"
  ja: "@a@b＊「あら　ホルス王子。\n\tごきげん　うるわしゅう\n\tございます。\n@c0@"
  ko: "@a@b*: 어머, 홀스 왕자님.\n오늘은 기분이\n괜찮으신지요?\n@c0@"
  sl: "@a@b＊：哎呀，荷尔斯王子。\n　　您的精神看起来很不错呢。\n@c0@"
  tl: "@a@b＊：哎呀，荷爾斯王子。\n　　您的精神看起來很不錯呢。\n@c0@"
2:
  en: "@a@b*: I don't suppose the Prince o' Howcastle would consider gettin' his hands dirty and helpin' me out? No such luck!\n@c0@"
  ja: "@a@b＊「あんれ　まあ。\n\tそこに　おるのは　王子さまでは\n\tなかんべな。\n@c0@"
  ko: "@a@b*: 오우, 세상에.\n거기 계신 분은 왕자님\n맞지유?\n@c0@"
  sl: "@a@b＊：哎呀。\n　　这不是王子殿下嘛。\n@c0@"
  tl: "@a@b＊：哎呀。\n　　這不是王子殿下嘛。\n@c0@"
3:
  en: "@a@b*: Alright, my luvvers? ...B-But that's Prince Howard himself!\n@c0@"
  ja: "@a@b＊「お　王子さま！\n\tま　まさか　また　洞くつに……。\n@c0@"
  ko: "@a@b*: 와, 왕자님!\n서, 설마 또 동굴에......\n@c0@"
  sl: "@a@b＊：哦！王子殿下！\n　　难、难道，您又要去洞窟……\n@c0@"
  tl: "@a@b＊：哦！王子殿下！\n　　難、難道，您又要去洞窟……\n@c0@"
4:
  en: "@a@b*: So yer headin' south to the cave? With this bunch beside you, you'll have nothin' to fear!\n@c0@"
  ja: "@a@b＊「そうですか。　こんどは　この人たちが\n\tお供を。　それは　よかったですねえ。\n\tおほほほほ。\n@c0@"
  ko: "@a@b*: 그렇군요. 이번에는 이 사람들이\n호위를 맡았다고요? 다행이군요.\n오호호호호.\n@c0@"
  sl: "@a@b＊：这样啊。这回是这些人陪同您啊。\n　　那真是太好了。\n　　哦呵呵呵。\n@c0@"
  tl: "@a@b＊：這樣啊。這回是這些人陪同您啊。\n　　那真是太好了。\n　　哦呵呵呵。\n@c0@"
5:
  en: "@a@b*: P-Prince Howard! It's really you! D-Do you want to play hide-and-seek again?\n@c0@"
  ja: "@a@b＊「あっ　ホルス王子だ！\n\tねえねえ　また　かくれんぼして\n\tあそぼうよ！\n@c0@"
  ko: "@a@b*: 앗, 홀스 왕자님이다!\n저기, 우리 또 숨바꼭질하고\n놀자!\n@c0@"
  sl: "@a@b＊：啊，是荷尔斯王子！\n　　我们再来玩捉迷藏吧，\n　　好不好好不好！\n@c0@"
  tl: "@a@b＊：啊，是荷爾斯王子！\n　　我們再來玩捉迷藏吧，\n　　好不好好不好！\n@c0@"
6:
  en: "@a@b*: ...What's that? You've been playin' it all this time? Why didn't you tell me!?\n@c0@"
  ja: "@a@b＊「え？　今まで　してたの？\n\tチェ！　ずるいなあ。\n@c0@"
  ko: "@a@b*: 응? 지금까지 했다고?\n쳇, 너무해.\n@c0@"
  sl: "@a@b＊：诶？刚才一直在玩？\n　　嘁！真狡猾。\n@c0@"
  tl: "@a@b＊：誒？剛才一直在玩？\n　　嘁！真狡猾。\n@c0@"
7:
  en: "@a@b*: Pr-Prince Howard! It's you! My, how you've grown!\n@c0@"
  ja: "@a@b＊「おお！　ホルス王子では\n\tありませんか！\n\tおなつかしい……㈢ゴホッ。\n@c0@"
  ko: "@a@b*: 오오! 홀스 왕자님이\n아니십니까!\n이게 얼마 만인지......㈢ 콜록.\n@c0@"
  sl: "@a@b＊：哦！这不是荷尔斯王子吗！\n　　真怀念呐…… ㈢咳。\n@c0@"
  tl: "@a@b＊：哦！這不是荷爾斯王子嗎！\n　　真懷念呐…… ㈢咳。\n@c0@"
8:
  en: "@aPrince Howard@bPlease don't rouse yourself on my account.\n@c0@"
  ja: "@a@bホルス「おきなくても　いいぞ！\n\tホコリが　たつからな。\n@c0@"
  ko: "@a@b홀스: 일어나지 않아도 돼!\n먼지가 날리니까. \n@c0@"
  sl: "@a@b荷尔斯：躺着就好，不用起来！\n　　要不我生气了！\n@c0@"
  tl: "@a@b荷爾斯：躺著就好，不用起來！\n　　要不我生氣了！\n@c0@"
9:
  en: "@a@b*: Prince Howard, yer too kind! I'm afraid that wear and tear has got the better o' me.\n@c0@"
  ja: "@a@b＊「なんと　おやさしい……。\n\tときに　王子！\n@c0@"
  ko: "@a@b*: 이렇게 자상하실 데가......\n그런데 왕자님!\n@c0@"
  sl: "@a@b＊：真是温柔体贴啊……\n　　话说回来，王子殿下！\n@c0@"
  tl: "@a@b＊：真是溫柔體貼啊……\n　　話說回來，王子殿下！\n@c0@"
10:
  en: "@a@b*: You, on the other hand, are just startin' out on life's great journey!\n@c0@"
  ja: "@a@b＊「洗礼の儀式を　お受けになると\n\t聞きました！\n@c0@"
  ko: "@a@b*: 세례 의식을 받으신다고\n들었습니다!\n@c0@"
  sl: "@a@b＊：我听说您要去\n　　接受洗礼仪式！\n@c0@"
  tl: "@a@b＊：我聽說您要去\n　　接受洗禮儀式！\n@c0@"
11:
  en: "@a@b*: I wish you luck, and I hope that yer rite o' purification goes without a hitch!\n@c0@"
  ja: "@a@b＊「がんばって　くだされ！\n@c0@"
  ko: "@a@b*: 잘하고 오십시오!\n@c0@"
  sl: "@a@b＊：请加油啊！\n@c0@"
  tl: "@a@b＊：請加油啊！\n@c0@"
12:
  en: "@a@b*: Prince Howard! It's you! I heard a story, and I'd love to hear a real prince's thoughts about it.\n@c0@"
  ja: "@a@b＊「これは　ホルス王子さま！\n\t王子さまに　ぜひとも\n\t聞いていただきたい　話がございます。\n@c0@"
  ko: "@a@b*: 아, 홀스 왕자님이군요!\n왕자님께서 꼭\n들어 주셨으면 하는 이야기가 있습니다.\n@c0@"
  sl: "@a@b＊：是荷尔斯王子殿下啊！\n　　我有话务必要对\n　　王子殿下说。\n@c0@"
  tl: "@a@b＊：是荷爾斯王子殿下啊！\n　　我有話務必要對\n　　王子殿下說。\n@c0@"
13:
  en: "@a@b*: Rumour has it that the Prince o' Somnia bravely set out on a quest to find a cure for...\n@c0@"
  ja: "@a@b＊「ウワサでは　レイドックの王子が\n\t自分の両親である　王と王妃さまの\n\tご病気を　なおすため……\n@c0@"
  ko: "@a@b*: 소문으로는 레이독 성의 왕자가\n자신의 부모님인 왕과 왕비님의\n병을 고치기 위해.....\n@c0@"
  sl: "@a@b＊：有传闻说，雷多克的王子\n　　为了治好自己的父母，\n　　也就是国王陛下和王妃殿下的病……\n@c0@"
  tl: "@a@b＊：有傳聞說，雷多克的王子\n　　為了治好自己的父母，\n　　也就是國王陛下和王妃殿下的病……\n@c0@"
14:
  en: "@aPrince Howard@b...If I may stop you there. I'm afraid I care not a jot for the Prince of Somnia!\n㈡\nCome, %a000120! On with the expedition!\n@c0@"
  ja: "@a@bホルス「ふん！　そんな話\n\t聞きたくも　ないや！\n\tいこうぜ　%a000120。\n@c0@"
  ko: "@a@b홀스: 흥! 그런 얘기라면\n안 듣고 싶군!\n가자, %a000120.\n@c0@"
  sl: "@a@b荷尔斯：哼！\n　　我可不想听这些废话！\n　　走了，%a000120。\n@c0@"
  tl: "@a@b荷爾斯：哼！\n　　我可不想聽這些廢話！\n　　走了，%a000120。\n@c0@"
15:
