  ja: "@a@b%a002000「そっか。　ここで　雪……\n\tゴホホッ！　ここで　彼女のことを\n\t話したんだな。\n@c0@"
  ko: "@a@b%a002000: 그런가. 여기서 설......\n쿨럭! 여기서 그녀에 관한\n이야기를 한 거로군.\n@c0@"
  sl: "@a@b%a002000：是吗。就是在这里\n　　说了雪……咳咳咳！\n　　说了她的事情啊。\n@c0@"
  tl: "@a@b%a002000：是嗎。就是在這裡\n　　說了雪……咳咳咳！\n　　說了她的事情啊。\n@c0@"
75:
  en: "@a%0%a002010@bHe must feel like Colburn just disappeared in front of his very eyes.\n@c0@"
  ja: "@a@b%a002010「目の前から　ゴランさんが\n\tパッと　消えた　感じかしらね。\n@c0@"
  ko: "@a@b%a002010: 눈앞에서 고랑 씨가\n갑자기 사라진 것 같은 느낌이려나.\n@c0@"
  sl: "@a@b%a002010：就好像戈兰先生啪地一下\n　　从眼前消失了的感觉吧……\n@c0@"
  tl: "@a@b%a002010：就好像戈蘭先生啪地一下\n　　從眼前消失了的感覺吧……\n@c0@"
76:
  en: "@a%0%a002030@bTo everyone except Colburn, this all happened just a moment ago.\n@c0@"
  ja: "@a@b%a002030「ゴランさん　以外の人には\n\tほんの　さっきの　できごと\n\tなんですね……。\n@c0@"
  ko: "@a@b%a002030: 고랑 씨 이외의 사람에겐\n방금 전에 있었던\n일이겠죠......\n@c0@"
  sl: "@a@b%a002030：在戈兰先生以外的人看来，\n　　这些都只是刚刚发生的事情呢……\n@c0@"
  tl: "@a@b%a002030：在戈蘭先生以外的人看來，\n　　這些都只是剛剛發生的事情呢……\n@c0@"
77:
  en: "@a%0%a002020@bHe sure is calm considering his friend just vanished. I'll have what he's having!\n@c0@"
  ja: "@a@b%a002020「目の前の　人が消えたのに\n\tお酒を　飲んでるから\n\tあまり　気にならないんだね……。\n@c0@"
  ko: "@a@b%a002020: 눈앞의 사람이 사라졌는데 \n술을 마시고 있어서 그런지 \n별로 신경이 안 쓰이나 봐......\n@c0@"
  sl: "@a@b%a002020：明明有人从眼前消失了，\n　　是因为喝了酒吗，\n　　他好像不怎么在意呢……\n@c0@"
  tl: "@a@b%a002020：明明有人從眼前消失了，\n　　是因為喝了酒嗎，\n　　他好像不怎麼在意呢……\n@c0@"
78:
  en: "@a%0%a002050@bHalf a century in the blink of an eye...\n@c0@"
  ja: "@a@b%a002050「５０年が　いっしゅんですね……。\n@c0@"
  ko: "@a@b%a002050: 50년이 한순간이군요......\n@c0@"
  sl: "@a@b%a002050：５０年仿若一瞬间呢……\n@c0@"
  tl: "@a@b%a002050：５０年仿若一瞬間呢……\n@c0@"
79:
  en: "@a%0%a002070@bBoing! (jiggle)\n@c0@"
  ja: "@a@b%a002070「プルプルーッ！\n@c0@"
  ko: "@a@b%a002070: 뽀용뽀요용~!\n@c0@"
  sl: "@a@b%a002070：噗噜噗噜！\n@c0@"
  tl: "@a@b%a002070：噗嚕噗嚕！\n@c0@"
80:
  en: "@a%0%a002000@bColburn, aye...? More like Oldburn these days.\n@c0@"
  ja: "@a@b%a002000「ゴラン兄ちゃん……か。\n\tいまは　ゴランじいちゃん　だけどな。\n@c0@"
  ko: "@a@b%a002000: 고랑 오빠.....였나.\n지금은 고랑 할아버지지만.\n@c0@"
  sl: "@a@b%a002000：戈兰哥哥……吗。\n　　现在得叫戈兰爷爷了呐。\n@c0@"
  tl: "@a@b%a002000：戈蘭哥哥……嗎。\n　　現在得叫戈蘭爺爺了呐。\n@c0@"
81:
  en: "@a%0%a002010@bColburn's sudden disappearance must be something of a surprise for her, but imagine her shock if he were still sitting there.\n@c0@"
  ja: "@a@b%a002010「急に　いなくなっても\n\tビックリするだろうけど　そのままいたら\n\tもっと　ビックリするかもね。\n@c0@"
  ko: "@a@b%a002010: 갑자기 사라져도\n깜짝 놀라겠지만, 그대로 있으면\n더 놀랄지 모르겠는걸.\n@c0@"
  sl: "@a@b%a002010：突然消失确实让人吃惊，\n　　不过要是以老头的姿态站在原地的话，\n　　说不定会更令人吃惊呢。\n@c0@"
  tl: "@a@b%a002010：突然消失確實讓人吃驚，\n　　不過要是以老頭的姿態站在原地的話，\n　　說不定會更令人吃驚呢。\n@c0@"
82:
  en: "@a%0%a002030@bThe Colburn she knew won't be coming back...\n@c0@"
  ja: "@a@b%a002030「ゴラン兄ちゃんは\n\tもう　いないです……。\n@c0@"
  ko: "@a@b%a002030: 고랑 오빠는\n이제 없습니다......\n@c0@"
  sl: "@a@b%a002030：戈兰哥哥已经不在了……\n@c0@"
  tl: "@a@b%a002030：戈蘭哥哥已經不在了……\n@c0@"
83:
  en: "@a%0%a002020@bAt least someone's missing Colburn around here...\n@c0@"
  ja: "@a@b%a002020「この子　大きいのに\n\tまだ　赤ちゃん　コトバでちゅ……。\n@c0@"
  ko: "@a@b%a002020: 다 큰 애가\n아직 아기 말을 쓰다니......\n@c0@"
  sl: "@a@b%a002020：这孩子都这么大了，\n　　用的还是婴儿用语哝……\n@c0@"
  tl: "@a@b%a002020：這孩子都這麼大了，\n　　用的還是嬰兒用語噥……\n@c0@"
84:
  en: "@a%0%a002050@bGettin' that girl to grasp the true story would be a right hassle.\n@c0@"
  ja: "@a@b%a002050「どう　説明しても\n\tこの子に　わかってもらうのは\n\t大変でしょうね。\n@c0@"
  ko: "@a@b%a002050: 아무리 설명해도\n이 아이를 이해시키는 건\n어려울 것 같아요.\n@c0@"
  sl: "@a@b%a002050：不论再怎么说明，\n　　想让这孩子明白事情的来龙去脉\n　　都太困难了吧。\n@c0@"
  tl: "@a@b%a002050：不論再怎麼說明，\n　　想讓這孩子明白事情的來龍去脈\n　　都太困難了吧。\n@c0@"
85:
  en: "@a%0%a002070@bBoi-oing! (slurp)\n@c0@"
  ja: "@a@b%a002070「プルプル？\n@c0@"
  ko: "@a@b%a002070: 뽀용뽀용?\n@c0@"
  sl: "@a@b%a002070：噗噜噗噜？\n@c0@"
  tl: "@a@b%a002070：噗嚕噗嚕？\n@c0@"
86:
  en: "@a%0%a002000@bHuh. Is that priest new in town or what?\n@c0@"
  ja: "@a@b%a002000「この　神父さん\n\tいま　この村に　着いたのか？\n@c0@"
  ko: "@a@b%a002000: 이 신부님\n방금 이 마을에 도착했나?\n@c0@"
  sl: "@a@b%a002000：这位神父先生，\n　　是刚到村子来不久吗？\n@c0@"
  tl: "@a@b%a002000：這位神父先生，\n　　是剛到村子來不久嗎？\n@c0@"
87:
  en: "@a%0%a002010@bIt sounds like that priest got here at just the right time.\n@c0@"
  ja: "@a@b%a002010「この　神父さま\n\tグッドタイミングで　この村に\n\t着いたみたいね。\n@c0@"
  ko: "@a@b%a002010: 이 신부님\n절묘한 타이밍에 이 마을에\n도착한 것 같아.\n@c0@"
  sl: "@a@b%a002010：这位神父来到村子的时机\n　　真是太凑巧了。\n@c0@"
  tl: "@a@b%a002010：這位神父來到村子的時機\n　　真是太湊巧了。\n@c0@"
88:
  en: "@a%0%a002030@bTo visit a grave and find the person alive... No wonder he was shocked!\n@c0@"
  ja: "@a@b%a002030「お墓ではなく\n\tご本人に　会えたのですから\n\tそれは　ビックリしたでしょうね。\n@c0@"
  ko: "@a@b%a002030: 묘지가 아니라\n본인을 만날 수 있었으니까\n많이 놀랐을 겁니다.\n@c0@"
  sl: "@a@b%a002030：结果参拜的\n　　不是墓而是本人，\n　　自然会非常震惊的吧。\n@c0@"
  tl: "@a@b%a002030：結果參拜的\n　　不是墓而是本人，\n　　自然會非常震驚的吧。\n@c0@"
89:
  en: "@a%0%a002020@bWow... That priest and Ali must be almost the same age. Not in years, but...you know, physically...\n@c0@"
  ja: "@a@b%a002020「この　神父さまと\n\tザム神官って　同じくらいの\n\t年に　なっちゃったんじゃないの？\n@c0@"
  ko: "@a@b%a002020: 이 신부님과\n자무 신관은 이제 비슷한\n나이이지 않을까?\n@c0@"
  sl: "@a@b%a002020：这位神父大人和扎姆神官\n　　现在的年龄应该差不多了呢？\n@c0@"
  tl: "@a@b%a002020：這位神父大人和扎姆神官\n　　現在的年齡應該差不多了呢？\n@c0@"
90:
  en: "@a%0%a002050@bOld Ali's lived fifty years longer than a normal person.\n@c0@"
  ja: "@a@b%a002050「まあ　普通の人より\n\t５０年分は　長生きですよね。\n@c0@"
  ko: "@a@b%a002050: 뭐, 보통 사람들보다\n50년은 장수하고 있는 거니까요.\n@c0@"
  sl: "@a@b%a002050：毕竟比普通人\n　　多活了５０年啊。\n@c0@"
  tl: "@a@b%a002050：畢竟比普通人\n　　多活了５０年啊。\n@c0@"
