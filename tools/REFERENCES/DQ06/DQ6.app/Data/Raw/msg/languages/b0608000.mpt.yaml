  en: "@a%0%a002070@b(slurp)\n@c0@"
  ja: "@a@b%a002070「プルプルン！\n@c0@"
  ko: "@a@b%a002070: 뽀용뽀요용!\n@c0@"
  sl: "@a@b%a002070：噗噜噗噜！\n@c0@"
  tl: "@a@b%a002070：噗嚕噗嚕！\n@c0@"
92:
  en: "@a%0%a002000@bCrikey! Who can remember all that?\n@c0@"
  ja: "@a@b%a002000「なんだか　長いばっかりで\n\tよくわからない　合い言葉だぜ。\n@c0@"
  ko: "@a@b%a002000: 왠지 길기만 하지\n잘 이해가 안 되는 암호인데.\n@c0@"
  sl: "@a@b%a002000：总感觉这暗语长得要命，\n　　让人摸不着头脑啊。\n@c0@"
  tl: "@a@b%a002000：總感覺這暗語長得要命，\n　　讓人摸不著頭腦啊。\n@c0@"
93:
  en: "@a%0%a002000@bWell, this one's all on you, %a000090. Good thing you've got a perfect memory, aye?\n@c0@"
  ja: "@a@b%a002000「まあ　%a000090は\n\t記憶力が　いいから\n\tべつに　もんだい　ないけどな！\n@c0@"
  ko: "@a@b%a002000: 뭐, %a000090%F0090%X는%Y은%Z\n기억력이 좋으니까\n별 문제 없겠지만!\n@c0@"
  sl: "@a@b%a002000：算了，\n　　反正%a000090记忆力好得很，\n　　不会有啥问题的！\n@c0@"
  tl: "@a@b%a002000：算了，\n　　反正%a000090記憶力好得很，\n　　不會有啥問題的！\n@c0@"
94:
  en: "@a%0%a002010@bSo the legendary sword is in a frozen grotto to the north — that's simple enough. Those phrases, on the other hand...\n@c0@"
  ja: "@a@b%a002010「伝説の剣は　村の北にある\n\t氷の洞くつの中に　あるのね。\n\tでも　今の　合言葉は……。\n@c0@"
  ko: "@a@b%a002010: 전설의 검은 마을 북쪽에 있는\n얼음 동굴 안에 있다는 거구나.\n하지만 방금 그 암호는......\n@c0@"
  sl: "@a@b%a002010：传说之剑在村子北边的\n　　冰之洞窟之中呢。\n　　但是刚才的暗语……\n@c0@"
  tl: "@a@b%a002010：傳說之劍在村子北邊的\n　　冰之洞窟之中呢。\n　　但是剛才的暗語……\n@c0@"
95:
  en: "@a%0%a002030@bBeing a trustworthy fellow... Bearing arms... A chap being out of his depth in cold water...\n@c0@"
  ja: "@a@b%a002030「自分は　正直者だ。\n\tちから持ちの姫が　タルを持ち上げ\n\t氷を食べると　はなや　たんが出る！\n@c0@"
  ko: "@a@b%a002030: 나는 정직한 사람이다.\n힘센 공주가 검은 통을 들어 올리고\n얼음을 먹으면 코와 가래가 나온다!\n@c0@"
  sl: "@a@b%a002030：我是一个正直的人。\n　　很有力气的公主拿着刀，\n　　将冰里的神奇猿猴终结！\n@c0@"
  tl: "@a@b%a002030：我是一個正直的人。\n　　很有力氣的公主拿著刀，\n　　將冰裡的神奇猿猴終結！\n@c0@"
96:
  en: "@a%0%a002030@bI've remembered the key phrases. Let's head for the cave to the north!\n@c0@"
  ja: "@a@b%a002030「合い言葉は　覚えました。\n\tすぐ　北の洞くつに　向かいましょう！\n@c0@"
  ko: "@a@b%a002030: 암호는 외웠습니다.\n바로 북쪽 동굴로 향합시다!\n@c0@"
  sl: "@a@b%a002030：暗语已经记住了。\n　　快到北边的山洞去吧！\n@c0@"
  tl: "@a@b%a002030：暗語已經記住了。\n　　快到北邊的山洞去吧！\n@c0@"
97:
  en: "@a%0%a002020@bIs that really the password? It sounds like he just made it up on the spot!\n@c0@"
  ja: "@a@b%a002020「なんだか　いいかげんな\n\t合い言葉に　聞こえたんだけど\n\tホントに　大丈夫なのかな……。\n@c0@"
  ko: "@a@b%a002020: 왠지 대충 만든\n암호로 들리는데.\n정말로 괜찮은 건가......\n@c0@"
  sl: "@a@b%a002020：总觉得这暗语\n　　听上去很随便啊，\n　　真的没问题吗……\n@c0@"
  tl: "@a@b%a002020：總覺得這暗語\n　　聽上去很隨便啊，\n　　真的沒問題嗎……\n@c0@"
98:
  en: "@a%0%a002050@bSo sayin' ‘Frizzam!’ will get the door's attention?\n@c0@"
  ja: "@a@b%a002050「合い言葉　メラサム　で\n\t封印のトビラが　目覚める！\n@c0@"
  ko: "@a@b%a002050: 암호 메라사무로\n봉인의 문이 눈을 뜬다!\n@c0@"
  sl: "@a@b%a002050：用暗语“没拉栓木”\n　　来让封印之门苏醒！\n@c0@"
  tl: "@a@b%a002050：用暗語“沒拉栓木”\n　　來讓封印之門甦醒！\n@c0@"
99:
  en: "@a%0%a002050@b...Whoever heard of a door payin' attention?\n@c0@"
  ja: "@a@b%a002050「……って　トビラ\n\tねてるんですか！？\n@c0@"
  ko: "@a@b%a002050: ...... 문이\n자고 있다는 겁니까!?\n@c0@"
  sl: "@a@b%a002050：……呃，难不成\n　　门是在睡觉吗？！\n@c0@"
  tl: "@a@b%a002050：……呃，難不成\n　　門是在睡覺嗎？！\n@c0@"
100:
  en: "@a%0%a002070@bBoi-oing! (slurp)\n@c0@"
  ja: "@a@b%a002070「プルプル？\n@c0@"
  ko: "@a@b%a002070: 뽀용뽀용?\n@c0@"
  sl: "@a@b%a002070：噗噜噗噜？\n@c0@"
  tl: "@a@b%a002070：噗嚕噗嚕？\n@c0@"
101:
  en: "@a%0%a002000@bCrikey. He's got a short fuse for a wise guy, aye?\n@c0@"
  ja: "@a@b%a002000「うはっ。\n\tこの　おっさん　気がみじかいぜ。\n@c0@"
  ko: "@a@b%a002000: 우핫.\n이 아저씨 성격 참 급하네.\n@c0@"
  sl: "@a@b%a002000：哎哟喂。\n　　这大叔真够性急的。\n@c0@"
  tl: "@a@b%a002000：哎喲喂。\n　　這大叔真夠性急的。\n@c0@"
102:
  en: "@a%0%a002010@bCome on, %a000090 — surely you want him to tell us?\n@c0@"
  ja: "@a@b%a002010「ねえ　%a000090。\n\tザム神官は　本当は\n\t教えたいんじゃない？\n@c0@"
  ko: "@a@b%a002010: 저기, %a000090.\n자무 신관 말이야, 사실은\n알려주고 싶은 거 아닐까?\n@c0@"
  sl: "@a@b%a002010：%a000090，\n　　扎姆神官其实是\n　　想告诉咱们的吧？\n@c0@"
  tl: "@a@b%a002010：%a000090，\n　　扎姆神官其實是\n　　想告訴咱們的吧？\n@c0@"
103:
  en: "@a%0%a002030@bSurely there's nothing to be lost from asking him?\n@c0@"
  ja: "@a@b%a002030「とりあえず　聞いておいて\n\tそんは　ないのでは　ないでしょうか。\n@c0@"
  ko: "@a@b%a002030: 일단 들어 둬도\n손해 볼 일은 없지 않을까요?\n@c0@"
  sl: "@a@b%a002030：总之先听听看吧，\n　　只是听听又没有什么坏处。\n@c0@"
  tl: "@a@b%a002030：總之先聽聽看吧，\n　　只是聽聽又沒有什麼壞處。\n@c0@"
104:
  en: "@a%0%a002020@bWhy'd you say ‘no’ to him, %a000090?\n@c0@"
  ja: "@a@b%a002020「いいえ　って　答える\n\t%a000090も　どうかと思うけどね……。\n@c0@"
  ko: "@a@b%a002020: '아니요'라고 대답하는\n%a000090도 좀 그래......\n@c0@"
  sl: "@a@b%a002020：居然回答不听，\n　　%a000090也是哪根筋抽掉了么……\n@c0@"
  tl: "@a@b%a002020：居然回答不聽，\n　　%a000090也是哪根筋抽掉了麼……\n@c0@"
105:
  en: "@a%0%a002050@bWe can't just head off!\n@c0@"
  ja: "@a@b%a002050「とっとと　帰るわけには\n\tいきません！\n@c0@"
  ko: "@a@b%a002050: 냉큼 돌아갈 수는\n없습니다!\n@c0@"
  sl: "@a@b%a002050：可不能就这么空手而归啊！\n@c0@"
