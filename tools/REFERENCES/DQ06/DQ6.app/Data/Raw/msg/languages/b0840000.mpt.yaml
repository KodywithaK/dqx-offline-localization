0:
  en: "@a@bThere's a minigame that can be played by tapping the screen. Give it a goo?\n@c0@"
  ja: "@a@bタッチで　あそべるゲーム\nスライムカーリング　がある。\nやりますか？\n@c0@"
  ko: "@a@b터치해서 즐기는 게임\n슬라임 컬링이 있다.\n해 보겠습니까?\n@c0@"
  sl: "@a@b点击可玩游戏\n史莱姆冰壶。\n要玩吗？\n@c0@"
  tl: "@a@b點擊可玩遊戲\n史萊姆冰壺。\n要玩嗎？\n@c0@"
1:
  en: "@a@bPick a course.\n@c0@"
  ja: "@a@bあそびたいコースを\nえらんでください。\n@c0@"
  ko: "@a@b플레이할 코스를\n선택해 주세요.\n@c0@"
  sl: "@a@b请选择要玩的赛道。\n@c0@"
  tl: "@a@b請選擇要玩的賽道。\n@c0@"
2:
  en: "@a@bGuide the slime to the centre of the\r\ntarget ring for big points. Goo for\r\nthe high score!\n@c0@"
  ja: "@a@bスライムを　うまく　すべらせて\nリングの　まんなかへ　ゴールさせれば\nハイスコアが　ねらえるぞ。\n@c0@"
  ko: "@a@b슬라임을 잘 미끄러뜨려서\n링 한가운데로 넣으면\n높은 점수를 받을 수 있다.\n@c0@"
  sl: "@a@b如果能让史莱姆\n刚好滑到圆圈中心的话，\n可以获得高分哦。\n@c0@"
  tl: "@a@b如果能讓史萊姆\n剛好滑到圓圈中心的話，\n可以獲得高分哦。\n@c0@"
3:
  en: "@a@bCarefully crooze the curves to keep\r\nfrom coming off the cliff. Get shields\r\nto guard against rockbomb blasts!\n@c0@"
  ja: "@a@bガケから　おちないよう　スライムを\nカーブさせつつ　ばくだんいわの\nバクハツを　たてで　ふせごう。\n@c0@"
  ko: "@a@b낭떠러지에서 떨어지지 않도록\n슬라임의 방향에 변화를 주며\n폭탄바위의 폭탄을 방패로 막자.\n@c0@"
  sl: "@a@b让史莱姆转弯使其免于从悬崖掉落，\n并用盾牌防住炸弹岩的爆炸。\n@c0@"
  tl: "@a@b讓史萊姆轉彎使其免於從懸崖掉落，\n並用盾牌防住炸彈岩的爆炸。\n@c0@"
4:
  en: "@a@bSnag seeds of agility to speed\r\nup the slime and bowl over the\r\nbandits!\n@c0@"
  ja: "@a@bすばやさのたねを　ひろい\nスライムの　そくどをあげ\nモンスターを　なぎたおそう。\n@c0@"
  ko: "@a@b민첩의 씨앗을 획득해서\n슬라임의 속도를 높여\n몬스터를 넘어뜨리자.\n@c0@"
  sl: "@a@b拾起敏捷种子，\n提升史莱姆的速度，\n荡平怪物吧。\n@c0@"
  tl: "@a@b拾起敏捷種子，\n提升史萊姆的速度，\n蕩平怪物吧。\n@c0@"
5:
  en: "@a@bSlide your finger back and forth to\r\nbuild power for the big jump. Try to\r\nkeep a straight line to the gooal!\n@c0@"
  ja: "@a@bひたすら　画面をスライドして\nだからといって　カーブしないよう\nまっすぐ　とおくへ　ジャンプしよう。\n@c0@"
  ko: "@a@b화면을 계속해서 슬라이드하되\n옆으로 휘지 않도록 조절하며\n일직선으로 멀리 점프하자.\n@c0@"
  sl: "@a@b不停地滑动画面，\n尽可能地不走弯路，\n以便径直地跳向远方。\n@c0@"
  tl: "@a@b不停地滑動畫面，\n儘可能地不走彎路，\n以便徑直地跳向遠方。\n@c0@"
6:
  en: "@a@bScope out the slippery slalom slope\r\nbeforehand to try and suss the\r\nslickest way to descend!\n@c0@"
  ja: "@a@bコースを　じっくりとみて\nどのルートを　とおればいいか\nみきわめよう。\n@c0@"
  ko: "@a@b코스를 잘 보고\n어느 루트로 가면 좋을지를\n잘 생각하자.\n@c0@"
  sl: "@a@b认真观察赛道，\n选出应该走\n哪一条路线。\n@c0@"
  tl: "@a@b認真觀察賽道，\n選出應該走\n哪一條路線。\n@c0@"
7:
  en: "@a@bBreak the barriers with magic orbs\r\nand slurp up swords to bash\r\nthe boss!\n@c0@"
  ja: "@a@bボスは　ただ　ぶつかるだけじゃ\nたおせない。　まほうだまを　ひろって\nけっかいを　うちやぶれ！\n@c0@"
  ko: "@a@b그냥 부딪치는 것만으로는 보스를\n쓰러뜨릴 수 없다. 마법탄을 주워서\n결계를 깨뜨려라!\n@c0@"
  sl: "@a@b单纯地硬碰硬是无法打败头目的。\n拾起魔法球\n打破结界吧！\n@c0@"
  tl: "@a@b單純地硬碰硬是無法打敗頭目的。\n拾起魔法球\n打破結界吧！\n@c0@"
8:
  en: "@a@bThis course is not yet available for play.\n@c0@"
  ja: "@a@bこのコースを　あそぶことは\nできません。\n@c0@"
  ko: "@a@b이 코스는\n플레이할 수 없습니다.\n@c0@"
  sl: "@a@b无法玩这个赛道。\n@c0@"
  tl: "@a@b無法玩這個賽道。\n@c0@"
9:
  en: "@a@b‘It's time for Slippin' Slime, the slurptacular sliding sensation that's played with your finger!\n@c0@"
  ja: "@a@b“画面を　左右にスライドさせ\n　スライムの前の　じめんを　みがきあげて\n　スライムを　すべらせよう！\n@c0@"
  ko: "@a@b''화면을 좌우로 슬라이드해서\n슬라임이 지나갈 바닥을 닦아\n슬라임을 미끄러뜨리자!''\n@c0@"
  sl: "@a@b“左右滑动画面，\n　用力摩擦史莱姆前面的地面，\n　使史莱姆滑动！\n@c0@"
  tl: "@a@b“左右滑動畫面，\n　用力摩擦史萊姆前面的地面，\n　使史萊姆滑動！\n@c0@"
10:
  en: "@a@b‘To start, place your finger on the slime when he hops in the sling, then use it to drag the sling back.\n@c0@"
  ja: "@a@b“ゲームスタートは　かんたんだ。\n　スタート台まで　はねてきた　スライムを\n　タッチしたまま　後ろにスライドさせる！\n@c0@"
  ko: "@a@b''게임 시작 방법은 간단하다.\n출발 지점으로 점프해 온 슬라임을\n터치한 채 뒤로 당긴다!''\n@c0@"
  sl: "@a@b“开始游戏的方法很简单，\n　按住跳上开始台的史莱姆，\n　并将它向后拖动！\n@c0@"
  tl: "@a@b“開始遊戲的方法很簡單，\n　按住跳上開始臺的史萊姆，\n　并將它向後拖動！\n@c0@"
11:
  en: "@a@b‘When you're ready, release your finger, and the sling will shoot the slime sliding forward!\n@c0@"
  ja: "@a@b“スライドした　スライムから\n　手を　はなせば\n　スライムが　すべり　はじめるぞ。\n@c0@"
  ko: "@a@b''슬라임을 당긴 상태에서\n손을 놓으면\n슬라임이 미끄러지기 시작한다.''\n@c0@"
  sl: "@a@b“松开手指，\n　史莱姆便开始自行滑动。\n@c0@"
  tl: "@a@b“鬆開手指，\n　史萊姆便開始自行滑動。\n@c0@"
12:
  en: "@a@b‘As the slime slips about, you'll see a rectangular box over the ice in front of him.\n@c0@"
  ja: "@a@b“つづいて　氷の上をすべる\n　スライムの前方に　四角い枠（わく）が\n　見えたら　その中を　スライドしよう。\n@c0@"
  ko: "@a@b''이어서 얼음 위를 미끄러지는\n슬라임 앞쪽으로 네모난 테두리가\n보이면 그 안을 슬라이드하자.''\n@c0@"
  sl: "@a@b“当看到在冰上滑行的\n　史莱姆前方出现方框时，\n　在方框内进行滑动。\n@c0@"
  tl: "@a@b“當看到在冰上滑行的\n　史萊姆前方出現方框時，\n　在方框內進行滑動。\n@c0@"
13:
  en: "@a@b‘Slide your finger back and forth on the left side of the box to tilt the slime left. Do the same on the right to tilt him to the right.\n@c0@"
  ja: "@a@b“左の枠をスライドすれば　スライムは左へ\n　右の枠をスライドすれば　スライムは右へ\n　進んでいくぞ。\n@c0@"
  ko: "@a@b''왼쪽 테두리를 슬라이드하면 왼쪽으로,\n오른쪽 테두리를 슬라이드하면 오른쪽으로\n슬라임이 움직일 것이다.''\n@c0@"
  sl: "@a@b“在左边的方框内滑动时，史莱姆向左前行，\n　在右边的方框内滑动时，史莱姆向右前行。\n@c0@"
  tl: "@a@b“在左邊的方框內滑動時，史萊姆向左前行，\n　在右邊的方框內滑動時，史萊姆向右前行。\n@c0@"
14:
  en: "@a@b‘To keep the slime slipping straight ahead, slide your finger back and forth on both sides of the box at once.\n@c0@"
  ja: "@a@b“スライムを　まっすぐ\n　進ませたい場合は　左右の枠を　またいで\n　画面を　スライドさせよう。\n@c0@"
  ko: "@a@b''슬라임을 일직선으로\n미끄러뜨리고 싶다면 좌우 테두리를\n넘나들며 화면을 슬라이드하자.''\n@c0@"
  sl: "@a@b“想让史莱姆径直前行时，\n　就无视中线左右来回滑动。\n@c0@"
  tl: "@a@b“想讓史萊姆徑直前行時，\n　就無視中線左右來回滑動。\n@c0@"
15:
  en: "@a@b‘If you stop sliding within the box, the slime will gooradually come to a complete stop.\n@c0@"
  ja: "@a@b“スライムを　止めたい場合は\n　枠の中を　スライドしなければ\n　ゆっくりと　げんそくして　止まるぞ。\n@c0@"
  ko: "@a@b''슬라임을 멈추고자 할 때는 테두리 안을\n슬라이드하지 않고 있으면\n서서히 속도를 낮추다가 멈출 것이다.''\n@c0@"
  sl: "@a@b“想让史莱姆停下时，\n　只要不在方框中滑动，\n　史莱姆就会慢慢减速直至停下。\n@c0@"
  tl: "@a@b“想讓史萊姆停下時，\n　只要不在方框中滑動，\n　史萊姆就會慢慢減速直至停下。\n@c0@"
16:
  en: "@a@b‘And that's all you need to know to enjoy Slippin' Slime! Oh, but one more thing:\n@c0@"
  ja: "@a@b“以上で　スライムカーリングの\n　そうさ　せつめいは　おしまいだ。\n@c0@"
  ko: "@a@b''이상으로 슬라임 컬링\n조작 설명을 마친다.''\n@c0@"
  sl: "@a@b“以上就是史莱姆冰壶的\n　操作说明。\n@c0@"
  tl: "@a@b“以上就是史萊姆冰壺的\n　操作說明。\n@c0@"
17:
  en: "@a@b‘Before you start each game, you'll get a fly-by view of the entire course.\n@c0@"
  ja: "@a@b“ちなみに　ゲームが　はじまる前に\n　えらんだコース全体を\n　見ることができる。\n@c0@"
  ko: "@a@b''참고로 게임 시작 전에\n선택한 코스 전체를\n볼 수가 있다.''\n@c0@"
  sl: "@a@b“顺带一提，在游戏开始前，\n　可以查看自己选择的整条赛道。\n@c0@"
  tl: "@a@b“順帶一提，在遊戲開始前，\n　可以查看自己選擇的整條賽道。\n@c0@"
18:
  en: "@a@b‘To speed up the fly-by sequence, simply hold your finger down on the screen.\n@c0@"
  ja: "@a@b“そのとき　画面をタッチしていると\n　すばやく　コース全体を見られるぞ。\n@c0@"
  ko: "@a@b''이때 화면을 터치하고 있으면\n코스 전체를 빠르게 볼 수 있다.''\n@c0@"
  sl: "@a@b“此时点击一下画面，\n　就可以快速查看整条赛道。\n@c0@"
  tl: "@a@b“此時點擊一下画面，\n　就可以快速查看整條賽道。\n@c0@"
19:
  en: "@a@b‘Or if you'd rather skip the fly-by entirely, just double-tap the screen and you can start the game right away.\n@c0@"
  ja: "@a@b“もし　はやく　ゲームをはじめたければ\n　コースを見ている　とちゅうで\n　画面を　２回　タップしよう。\n@c0@"
  ko: "@a@b''만약 게임을 빨리 시작하고 \n싶으면 코스를 보는 도중에\n화면을 2번 터치할 것.''\n@c0@"
  sl: "@a@b“如果想要快速开始游戏，\n　只需在查看赛道的过程中\n　点击两次画面即可。\n@c0@"
  tl: "@a@b“如果想要快速開始遊戲，\n　只需在查看賽道的過程中\n　点击两次画面即可。\n@c0@"
20:
  en: "@a@b‘Right, then. It's time to get slippin'!’\n@c0@"
  ja: "@a@b“では　まずは　かんたんな\n　カーリングから　あそんでみよう！\n@c0@"
  ko: "@a@b''그럼 우선 간단한\n컬링부터 시작해 보자!''\n@c0@"
  sl: "@a@b“那么先从简单的冰壶\n　开始玩起吧！\n@c0@"
  tl: "@a@b“那麼先從簡單的冰壺\n　開始玩起吧！\n@c0@"
21:
  en: "@a@b%0%a000120 achieved a score of %a002720.\n@c0@"
  ja: "@a@b%a000120は\n%a002720点　かくとくした。\n@c0@"
  ko: "@a@b%a000120%F0120%X는%Y은%Z\n%a002720점을 획득했다.\n@c0@"
  sl: "@a@b%a000120\n获得了%a002720分。\n@c0@"
  tl: "@a@b%a000120\n獲得了%a002720分。\n@c0@"
22:
  en: "@a@b%0%a000120 achieved a score of %a002720. How embarrassing...\n@c0@"
  ja: "@a@b%a000120は\n%a002720点に　なってしまった。\n@c0@"
  ko: "@a@b%a000120%F0120%X는%Y은%Z\n%a002720점을 받고 말았다.\n@c0@"
  sl: "@a@b%a000120\n现在是%a002720分。\n@c0@"
  tl: "@a@b%a000120\n現在是%a002720分。\n@c0@"
23:
  en: "@a@bA new course is open for play: %a002730!\n@c0@"
  ja: "@a@bなんと　新しいコース\n%a002730を\n遊べるようになった。\n@c0@"
  ko: "@a@b새로운 코스\n%a002730%F2730%X를%Y을%Z\n플레이할 수 있게 되었다.\n@c0@"
  sl: "@a@b可以玩新赛道\n%a002730了。\n@c0@"
  tl: "@a@b可以玩新賽道\n%a002730了。\n@c0@"
24:
  en: "@a@bTry the same course again?\n@c0@"
  ja: "@a@bもう一度　同じコースを\n遊びますか？\n@c0@"
  ko: "@a@b같은 코스를 다시 한 번\n플레이하겠습니까?\n@c0@"
  sl: "@a@b要再玩一次\n同一赛道吗？\n@c0@"
  tl: "@a@b要再玩一次\n同一賽道嗎？\n@c0@"
25:
  en: "@a@bThe Slippin' Slime game seems to be out of action at the moment.\n@c0@"
  ja: "@a@bしかし　今は　スライムカーリングは\n動いていないようだ……。\n@c0@"
  ko: "@a@b그러나 지금은 슬라임 컬링이\n작동하지 않는 모양이다......\n@c0@"
  sl: "@a@b但是现在史莱姆冰壶\n好像没有动……\n@c0@"
  tl: "@a@b但是現在史萊姆冰壺\n好像沒有動……\n@c0@"
26:
  en: "@a@b%a002740 pts.\n@c0@"
  ja: "@a@b%a002740　てん\n@c0@"
  ko: "@a@b%a002740점\n@c0@"
  sl: "@a@b%a002740分\n@c0@"
  tl: "@a@b%a002740分\n@c0@"
