0:
  en: "@a@b*: For many long years, I was responsible for taking care of Pegasus.\n@c0@"
  ja: "@a@b＊「わしは　代々　天馬の世話を\n\tしとる者じゃが……\n@c0@"
  ko: "@a@b*: 나는 대대로 천마를\n돌보는 사람이라네......\n@c0@"
  sl: "@a@b＊：老夫一族世世代代\n　　一直负责照顾天马……\n@c0@"
  tl: "@a@b＊：老夫一族世世代代\n　　一直負責照顧天馬……\n@c0@"
1:
  en: "@a@b*: But if you have come here to see her, I am afraid you have wasted your time.\n@c0@"
  ja: "@a@b＊「もし　天馬に会いに\n\t来たというなら　ムダじゃぞ。\n@c0@"
  ko: "@a@b*: 혹시 천마를 만나러\n왔다면 헛고생을 했군.\n@c0@"
  sl: "@a@b＊：但如果你们是来见天马的，\n　　那是白费功夫。\n@c0@"
  tl: "@a@b＊：但如果你們是來見天馬的，\n　　那是白費功夫。\n@c0@"
2:
  en: "@a@b*: For you to have made it this far, I am sure you know a great deal about the state of the world.\n@c0@"
  ja: "@a@b＊「お前さんたちも　ここまで\n\tやってこれたということは\n\tいろんな事情を　わかっとるじゃろ。\n@c0@"
  ko: "@a@b*: 자네들도 여기까지\n왔다는 건\n여러 사정을 다 알고 왔을 테지.\n@c0@"
  sl: "@a@b＊：你们一路走来，\n　　想必知道的事情也不少了吧。\n@c0@"
  tl: "@a@b＊：你們一路走來，\n　　想必知道的事情也不少了吧。\n@c0@"
3:
  en: "@a@b*: You've heard of that villainous wretch Mortamor, I take it? It was his curse that turned Pegasus to stone...\n@c0@"
  ja: "@a@b＊「大魔王デスタムーアじゃ！\n\tあいつが……　あいつが\n\t天馬を　呪いで　石に……。\n@c0@"
  ko: "@a@b*: 대마왕 데스타무아!\n그놈이...... 그놈이\n천마에 저주를 걸어 돌로......\n@c0@"
  sl: "@a@b＊：是大魔王德斯塔穆亚！\n　　那家伙……那家伙对天马下了诅咒，\n　　让天马变成了石像……\n@c0@"
  tl: "@a@b＊：是大魔王德斯塔穆亞！\n　　那傢伙……那傢伙對天馬下了詛咒，\n　　讓天馬變成了石像……\n@c0@"
4:
  en: "@a@b*: Of course, if Pegasus had merely been petrified, I could reverse the curse.\n@c0@"
  ja: "@a@b＊「もちろん　ただ　石にされた\n\tくらいじゃったら　このわしにも\n\t解くことが　できるわい！\n@c0@"
  ko: "@a@b*: 물론 그냥 돌이\n되었다면 나라도\n그따위 저주는 풀 수 있지!\n@c0@"
  sl: "@a@b＊：当然了，如果仅仅是\n　　普通的石化咒文，\n　　老夫自己都能解除！\n@c0@"
  tl: "@a@b＊：當然了，如果僅僅是\n　　普通的石化咒文，\n　　老夫自己都能解除！\n@c0@"
5:
  en: "@a@b*: But it goes beyond that! Her heart itself was stolen from her, leaving only an empty shell.\n@c0@"
  ja: "@a@b＊「じゃが　ダメなんじゃ！\n\t心が　いないんじゃよ！\n\tあれは　もう　ぬけがらなんじゃ！\n@c0@"
  ko: "@a@b*: 하지만 쓸데없는 일이야!\n마음이 없어!\n저건 이미 빈 껍데기일 뿐이라고!\n@c0@"
  sl: "@a@b＊：但是办不到啊！\n　　因为没有了心啊！\n　　那只是一具躯壳而已！\n@c0@"
  tl: "@a@b＊：但是辦不到啊！\n　　因為沒有了心啊！\n　　那只是一具軀殼而已！\n@c0@"
6:
