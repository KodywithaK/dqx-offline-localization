  ko: "@a@b*: ......설마 그럴 리가......\n하지만 왠지 그 눈은\n낯설지가 않아......\n@c0@"
  sl: "@a@b＊：……该不会……不可能……\n　　但是不知为什么，它的目光\n　　让老夫甚是怀念……\n@c0@"
  tl: "@a@b＊：……該不會……不可能……\n　　但是不知為什麼，它的目光\n　　讓老夫甚是懷念……\n@c0@"
