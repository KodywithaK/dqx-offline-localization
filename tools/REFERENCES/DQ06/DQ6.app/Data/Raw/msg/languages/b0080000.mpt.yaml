33:
  en: "@a@b*: Our leader hath informed us that vile Mortamor hath created a world of neither dreams nor reality.\n@c0@"
  ja: "@a@b＊「王の話では\n\t大魔王デスタムーアは\n\t現実でも　夢でもない世界をつくり……\n@c0@"
