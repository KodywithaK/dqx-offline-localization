  ja: "@a@b%a002000「しかたないな。\n\t南にある　夢見の洞くつとやらへ\n\t行ってみるか。\n@c0@"
  ko: "@a@b%a002000: 어쩔 수 없군.\n남쪽에 있는 꿈꾸는 동굴인지 뭔지\n어디 한번 가볼까.\n@c0@"
  sl: "@a@b%a002000：没别的办法。\n　　只好去那什么南边的梦之洞窟了。\n@c0@"
  tl: "@a@b%a002000：沒別的辦法。\n　　只好去那什麼南邊的夢之洞窟了。\n@c0@"
