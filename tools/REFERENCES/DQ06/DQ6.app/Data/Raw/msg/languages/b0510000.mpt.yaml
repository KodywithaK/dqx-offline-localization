2:
  en: "@a%0%a002000@bOh, come on! Does she have to be so bossy?\n@c0@"
  ja: "@a@b%a002000「なんだよ　ばあさん。\n\tこまかいこと　いうなよ。\n@c0@"
  ko: "@a@b%a002000: 뭐야, 할머니.\n별일도 아닌 거를\n그렇게 말할 필요 없잖아.\n@c0@"
  sl: "@a@b%a002000：别闹了老婆婆。\n　　老在意这些细节干啥。\n@c0@"
  tl: "@a@b%a002000：別鬧了老婆婆。\n　　老在意這些細節幹啥。\n@c0@"
3:
  en: "@a%0%a002000@bI can't shake the feeling the old bag is just usin' us.\n@c0@"
  ja: "@a@b%a002000「なんだか　うまいこと\n\tばあさんに　乗せられたような\n\tそんな　気がするぜ。\n@c0@"
  ko: "@a@b%a002000: 왠지 할머니한테\n보기 좋게 넘어간 듯한\n기분이 드는군.\n@c0@"
  sl: "@a@b%a002000：总觉得被这老婆婆的话套住了。\n@c0@"
  tl: "@a@b%a002000：總覺得被這老婆婆的話套住了。\n@c0@"
4:
  en: "@a%0%a002010@bRight then, let's head south and get some dream dew!\n@c0@"
  ja: "@a@b%a002010「さあ　それじゃ\n\t南の洞くつへ　行って\n\t夢見のしずくを　取って来ましょう！\n@c0@"
  ko: "@a@b%a002010: 자, 그럼\n남쪽 동굴에 가서\n꿈꾸는 물방울을 갖고 오자!\n@c0@"
  sl: "@a@b%a002010：走吧，\n　　我们去南边洞窟，\n　　取回梦之水滴！\n@c0@"
  tl: "@a@b%a002010：走吧，\n　　我們去南邊洞窟，\n　　取回夢之水滴！\n@c0@"
5:
