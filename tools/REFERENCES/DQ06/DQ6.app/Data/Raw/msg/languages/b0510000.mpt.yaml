0:
  en: "@a%0%a002000@bI'd say we better do what the old lady says. It's not like we have any better ideas.\n@c0@"
  ja: "@a@b%a002000「まあ　とりあえずは\n\tばあさんの話を　聞いてみるしか\n\tなさそうだけどな…。\n@c0@"
  ko: "@a@b%a002000: 뭐, 일단\n할머니 얘기를 들어보는 수밖에\n없겠군......\n@c0@"
