1:
  en: "@a%0%a002000@bI had a good sleep...but I'm good at everything.\n@c0@"
  ja: "@a@b%a002000「オレは　ぐっすり\n\tねむれたぜ！\n@c0@"
  ko: "@a@b%a002000: 나는 아주\n푹 잘 잤어!\n@c0@"
  sl: "@a@b%a002000：俺睡得可踏实啦！\n@c0@"
