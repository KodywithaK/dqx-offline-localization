4:
  en: "@a@bTap the up and down buttons to add or remove tokens, then tap ''Spin'' to set the wheels in motion.\n@c0@"
  ja: "@a@b上下のボタンで　入れるコインを\n決めて　「スタート」を　タッチすると\nスロットを　始めます。\n@c0@"
  ko: "@a@b상하 버튼으로 투입할 코인을\n결정한 후 [시작]을 터치하면\n슬롯머신을 시작합니다.\n@c0@"
  sl: "@a@b用上下按键\n决定要放进去的代币数，\n点“开始”即可转动机器。\n@c0@"
  tl: "@a@b用上下按鍵\n決定要放進去的代幣數，\n點“開始”即可轉動機器。\n@c0@"
5:
