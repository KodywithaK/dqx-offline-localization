16:
  en: "@aMadame Luca@bNow that you know the truth, Madame Luca will cast a spell on you... The best spell she knows!\n@c0@"
  ja: "@a@bグランマーズ「……さあ　真実を\n\t話したからには　せいいっぱいの\n\t呪文を　かけてあげようかね。\n@c0@"
  ko: "@a@b그랜마즈: ......그럼 진실을\n알려줬으니 멋진\n주문을 걸어 줘야겠군.\n@c0@"
