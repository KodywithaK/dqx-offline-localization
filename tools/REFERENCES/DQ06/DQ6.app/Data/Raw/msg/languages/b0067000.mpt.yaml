  tl: "@a@b%a002020：誒？你怎麼知道？\n　　我還什麼都沒說，\n　　你就猜中我的名字了。\n@c0@"
6:
  en: "@aMadame Luca@bHee hah! There is no stumping Madame Luca! She is a dream seer! Knowing names is a piece of cake!\n@c0@"
  ja: "@a@bグランマーズ「ほっほっほっ。\n\tわしは　夢占い師。\n\tそのくらい　朝めし前じゃよ。\n@c0@"
  ko: "@a@b그랜마즈: 호호호.\n나는 해몽가란다.\n그 정도는 식은 죽 먹기지.\n@c0@"
  sl: "@a@b玛兹婆婆：哈哈哈。\n　　我是占梦师。\n　　这点小事易如反掌。\n@c0@"
  tl: "@a@b瑪茲婆婆：哈哈哈。\n　　我是占夢師。\n　　這點小事易如反掌。\n@c0@"
7:
  en: "@aMadame Luca@bIn any case, Madame Luca has much to tell you of this world. We must talk in the morning, mmm-hmm.\n@c0@"
  ja: "@a@bグランマーズ「さて　お前さんたちには\n\tそろそろ　この世界のことを\n\t話さないとね。\n@c0@"
  ko: "@a@b그랜마즈: 그나저나 너희에겐\n슬슬 이 세계에 대한\n이야기를 해 줄 때가 된 것 같구나.\n@c0@"
  sl: "@a@b玛兹婆婆：那么，现在该跟你们\n　　谈谈这个世界的情况了。\n@c0@"
  tl: "@a@b瑪茲婆婆：那麼，現在該跟你們\n　　談談這個世界的情況了。\n@c0@"
8:
  en: "@aMadame Luca@bLet's call it a night, yes? We can speak more tomorrow.\n@c0@"
  ja: "@a@bグランマーズ「まあ　今日のところは\n\tここで　ゆっくり　おやすみ。\n\t話は　また明日にしよう。\n@c0@"
  ko: "@a@b그랜마즈: 어쨌든 오늘은\n여기서 푹 쉬거라.\n얘기는 내일 또 하자꾸나.\n@c0@"
  sl: "@a@b玛兹婆婆：好了，今天就到这里，\n　　你们好好休息一下。\n　　剩下的话明天再说。\n@c0@"
  tl: "@a@b瑪茲婆婆：好了，今天就到這裡，\n　　你們好好休息一下。\n　　剩下的話明天再說。\n@c0@"
9:
  en: "@aMadame Luca@bYou've slept a deep and dreamy sleep, yes? The best kind! \n@c0@"
  ja: "@a@bグランマーズ「ふむ……\n\tゆうべは　よく　ねむれたようだね。\n@c0@"
  ko: "@a@b그랜마즈: 흐음......\n어젯밤엔 푹 잔 모양이구나.\n@c0@"
  sl: "@a@b玛兹婆婆：嗯……\n　　看来你们昨晚睡得不错啊。\n@c0@"
  tl: "@a@b瑪茲婆婆：嗯……\n　　看來你們昨晚睡得不錯啊。\n@c0@"
10:
  en: "@aMadame Luca@bYou've been through a lot, mmm-hmm. It's time for Madame Luca to tell you the truth about this world...\n@c0@"
  ja: "@a@bグランマーズ「つらい旅を　してきた\n\tお前さんたちじゃ。　もう\n\t真実を話しても　いいころだろう。\n@c0@"
  ko: "@a@b그랜마즈: 너희는 지금껏\n힘든 여행을 해 왔지. 이제\n진실을 말할 때가 온 것 같구나.\n@c0@"
  sl: "@a@b玛兹婆婆：看来你们没少经历波折。\n　　现在该跟你们说说真相了。\n@c0@"
  tl: "@a@b瑪茲婆婆：看來你們沒少經歷波折。\n　　現在該跟你們說說真相了。\n@c0@"
11:
  en: "@aMadame Luca@bYour keen young %H0860%Xmind%Yminds%Z probably already worked it out, but the world you were in before was actually the world of dreams.\n@c0@"
  ja: "@a@bグランマーズ「もう　気づいたとは思うが\n\tお前さんたちがいた世界は\n\t夢の世界……\n@c0@"
  ko: "@a@b그랜마즈: 이미 눈치챘겠지만\n너희가 있었던 세계는\n꿈의 세계......\n@c0@"
  sl: "@a@b玛兹婆婆：你们可能已经注意到了，\n　　你们原本所在的世界\n　　是梦世界……\n@c0@"
  tl: "@a@b瑪茲婆婆：你們可能已經注意到了，\n　　你們原本所在的世界\n　　是夢世界……\n@c0@"
12:
  en: "@aMadame Luca@bThis, on the other hand, is the real world.\n@c0@"
  ja: "@a@bグランマーズ「そして　こっちの世界が\n\t現実の世界　なんじゃよ。\n@c0@"
  ko: "@a@b그랜마즈: 그리고 이쪽 세계가\n바로 현실 세계란다.\n@c0@"
  sl: "@a@b玛兹婆婆：而现在这个世界\n　　是现实世界。\n@c0@"
