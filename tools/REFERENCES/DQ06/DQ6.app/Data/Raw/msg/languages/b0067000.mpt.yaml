4:
  en: "@aMadame Luca@bI see the flock has taken on a new little lamb. %0%a002020, yes?\n@c0@"
  ja: "@a@bグランマーズ「それに　そっちの\n\tちっちゃいのは　新しい仲間だね。\n\tそうかい　%a002020って名かい。\n@c0@"
