13:
  en: "@aMadame Luca@bIn the dream world, you were merely inhabiting the dreams of those living in this world...\n@c0@"
  ja: "@a@bグランマーズ「そう　お前さんは\n\tだれかが見ている　夢の住人。\n@c0@"
  ko: "@a@b그랜마즈: 그래. 너는\n누군가의 꿈속에서 사는 사람.\n@c0@"
  sl: "@a@b玛兹婆婆：换句话说，\n　　你们是某个人梦中的人物。\n@c0@"
  tl: "@a@b瑪茲婆婆：換句話說，\n　　你們是某個人夢中的人物。\n@c0@"
14:
  en: "@aMadame Luca@bThat is why no one was able to see you here in the real world.\n@c0@"
  ja: "@a@bグランマーズ「だから　現実の世界では\n\tお前さんたちの姿が　見えなかった\n\tというわけじゃな。\n@c0@"
