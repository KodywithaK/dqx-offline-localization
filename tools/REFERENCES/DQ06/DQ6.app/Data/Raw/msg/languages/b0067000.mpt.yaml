  sl: "@a@b玛兹婆婆：那边那个小姑娘，\n　　是你们的新成员吧。\n　　哦，你叫%a002020啊。\n@c0@"
  tl: "@a@b瑪茲婆婆：那邊那個小姑娘，\n　　是你們的新成員吧。\n　　哦，你叫%a002020啊。\n@c0@"
5:
  en: "@a%0%a002020@bHey! How'd you know that!? Is it written on my face or something?\n@c0@"
  ja: "@a@b%a002020「え？　どうして？\n\tまだ　なにも　言ってないのに\n\tあたしの名前　あてたよ。\n@c0@"
  ko: "@a@b%a002020: 응? 어째서?\n아직 아무 말도 안 했는데\n내 이름을 맞췄어.\n@c0@"
