  sl: "@a@b玛兹婆婆：正因如此，\n　　现实世界的人\n　　才看不见你们。\n@c0@"
  tl: "@a@b瑪茲婆婆：正因如此，\n　　現實世界的人\n　　才看不見你們。\n@c0@"
15:
  en: "@aMadame Luca@bWell, no one apart from old Madame Luca, of course! Hah hee!\n@c0@"
  ja: "@a@bグランマーズ「……まあ　夢占い師の\n\tわしには　見えたわけじゃが。\n@c0@"
  ko: "@a@b그랜마즈: ......뭐, 해몽가인\n내게는 보였지만 말이다.\n@c0@"
