0:
  en: "@a@b*: I have uncovered the innermost workings of the world we live in, my child...and the truth filled me with horror.\n@c0@"
  ja: "@a@b＊「お　おそろしい……。\n\t私は　なぜか　世界のしくみを\n\t知ってしまったのです。\n@c0@"
  ko: "@a@b*: 두, 두렵습니다......\n저는 우연히 세계의 구조를\n알아 버렸습니다.\n@c0@"
  sl: "@a@b＊：太、太可怕了……\n　　莫名其妙地，我得知了\n　　这个世界的秘密。\n@c0@"
  tl: "@a@b＊：太、太可怕了……\n　　莫名其妙地，我得知了\n　　這個世界的秘密。\n@c0@"
1:
  en: "@a@b*: But I lacked the courage to share my revelation. That is why I live here, in solitary tranquillity.\n@c0@"
  ja: "@a@b＊「でも　そのことは　誰にも\n\tいえません。　だから　このように\n\tかくれ住んでいるのです。\n@c0@"
  ko: "@a@b*: 하지만 그건 누구에게도\n말할 수 없습니다. 그래서 이렇게\n숨어서 살고 있는 것이죠.\n@c0@"
  sl: "@a@b＊：但是这个秘密不能告诉任何人。\n　　所以才像这样隐居了起来。\n@c0@"
  tl: "@a@b＊：但是這個秘密不能告訴任何人。\n　　所以才像這樣隱居了起來。\n@c0@"
2:
  en: "@a@b*: I never imagined anyone would find me... Have you come to learn the terrifying truth?\n@c0@"
  ja: "@a@b＊「しかし　ここまで　やってくるひとが\n\tいたなんて……。\n\t私の話を　聞きたいのですか？\n@c0@"
  ko: "@a@b*: 그런데 여기까지 오는 사람이\n있을 줄이야......\n제 이야기를 듣고 싶습니까?\n@c0@"
  sl: "@a@b＊：可是没想到竟然\n　　有人找到这里来了……\n　　想听我说说吗？\n@c0@"
  tl: "@a@b＊：可是沒想到竟然\n　　有人找到這裡來了……\n　　想聽我說說嗎？\n@c0@"
3:
  en: "@a@b*: You have!? Oh, I was afraid this day would come. I can hide the truth no longer...\n@c0@"
  ja: "@a@b＊「ああ　やはりっ！\n\t私には　もう　これいじょう\n\tかくしておくことは　できませんわ。\n@c0@"
  ko: "@a@b*: 아아 역시!\n저는 더 이상\n숨기고 있을 수 없습니다.\n@c0@"
  sl: "@a@b＊：啊啊，果然没错！\n　　我已经无法再隐藏这个秘密了。\n@c0@"
  tl: "@a@b＊：啊啊，果然沒錯！\n　　我已經無法再隱藏這個秘密了。\n@c0@"
4:
  en: "@a@b*: Brace yourself, my child. The truth is...we are living in a world of dreams. It's unbelievable, I know.\n@c0@"
  ja: "@a@b＊「いいですか？　信じられないかも\n\tしれませんが　ここは　人びとの\n\t夢の世界なのです。\n@c0@"
  ko: "@a@b*: 잘 들으세요. 믿을 수 없을 지도\n모르겠지만, 여기는 사람들의\n꿈속 세계입니다.\n@c0@"
  sl: "@a@b＊：那我就说了啊。\n　　或许听起来很难以置信，\n　　这里其实是人们的梦中世界。\n@c0@"
  tl: "@a@b＊：那我就說了啊。\n　　或許聽起來很難以置信，\n　　這裡其實是人們的夢中世界。\n@c0@"
5:
  en: "@a@b*: Once, Lord Zenith ruled over this dream world from Cloudsgate Citadel, south-west of here.\n@c0@"
  ja: "@a@b＊「そして　夢の世界をおさめていたのは\n\tここより南西に　あったという\n\tクラウド城のゼニス王。\n@c0@"
  ko: "@a@b*: 그리고 꿈의 세계를 다스리는 건\n여기에서 남서쪽에 있는\n클라우드 성의 제니스 왕.\n@c0@"
  sl: "@a@b＊：并且，统治这梦世界的是\n　　住在位于西南边的云城\n　　里面的泽尼斯王。\n@c0@"
  tl: "@a@b＊：並且，統治這夢世界的是\n　　住在位於西南邊的雲城\n　　裡面的澤尼斯王。\n@c0@"
6:
  en: "@a@b*: But even he was powerless against the mysterious force that sealed him away, castle and all...\n@c0@"
  ja: "@a@b＊「しかし　そのゼニス王ですら\n\t何者かに　城ごと　封印された\n\tらしいのです。\n@c0@"
  ko: "@a@b*: 하지만 그 제니스 왕조차\n누군가에게 성과 함께 통째로\n봉인당했다고 하더군요.\n@c0@"
  sl: "@a@b＊：但是不知是何方神圣，\n　　居然将那位泽尼斯王，\n　　连人带城封印了起来。\n@c0@"
  tl: "@a@b＊：但是不知是何方神聖，\n　　居然將那位澤尼斯王，\n　　連人帶城封印了起來。\n@c0@"
7:
  en: "@a@b*: Oh, the horror! I fear that soon our entire world will fade away like a passing dream...\n@c0@"
  ja: "@a@b＊「お　おそろしい……。\n\tこのままでは　やがて　この世界は\n\t消えてしまうことでしょう……。\n@c0@"
  ko: "@a@b*: 두, 두렵습니다.\n이대로 두면 언젠가 이 세계는\n사라져 버릴 겁니다......\n@c0@"
  sl: "@a@b＊：实、实在可怕……\n　　这么下去的话，\n　　这个世界或许会消失吧……\n@c0@"
  tl: "@a@b＊：實、實在可怕……\n　　這麼下去的話，\n　　這個世界或許會消失吧……\n@c0@"
8:
  en: "@a@b*: Oh, you haven't? Thank the Goddess...\n@c0@"
  ja: "@a@b＊「そ　そうですか……。　ほっ……。\n@c0@"
  ko: "@a@b*: 그, 그렇습니까...... 흐음......\n@c0@"
  sl: "@a@b＊：是、是这样吗……唉……\n@c0@"
  tl: "@a@b＊：是、是這樣嗎……唉……\n@c0@"
9:
  en: "@a@b%3I seek only those who bear the legendary relics. Return from whence you came!%4\n@c0@"
  ja: "@a@b%3われは　伝説の武器　防具を\n身につけたる者のみ　もとめるなり。\nなんじらは　それに　あらず！%4\n@c0@"
  ko: "@a@b%3나는 전설의 무기와 방어구를\n착용한 자만을 원하노라.\n너희는 그렇지 않거늘!%4\n@c0@"
  sl: "@a@b%3吾之所求，\n乃手持传说中的武器与防具之人。\n并非汝等！%4\n@c0@"
  tl: "@a@b%3吾之所求，\n乃手持傳說中的武器與防具之人。\n並非汝等！%4\n@c0@"
