0:
  en: "@a%0%a002000@bGah! Hot! What's the matter with this place!?\n@c0@"
  ja: "@a@b%a002000「うわっ　あっちち！！\n\tなんだ　この熱気は！\n@c0@"
  ko: "@a@b%a002000: 으앗, 뜨거워!!\n뭐야, 이 열기는!\n@c0@"
  sl: "@a@b%a002000：哇，热死啦！！\n　　怎么会这么热！\n@c0@"
  tl: "@a@b%a002000：哇，熱死啦！！\n　　怎麼會這麼熱！\n@c0@"
1:
  en: "@a%0%a002010@bBe careful! That lava is incredibly hot!\n@c0@"
  ja: "@a@b%a002010「気をつけて。\n\t足元が　溶岩だらけよ！\n@c0@"
  ko: "@a@b%a002010: 조심해.\n발밑이 온통 용암이야!\n@c0@"
  sl: "@a@b%a002010：要小心了。\n　　我们脚下都是岩浆！\n@c0@"
  tl: "@a@b%a002010：要小心了。\n　　我們腳下都是岩漿！\n@c0@"
2:
  en: "@a%0%a002030@bWalking over the lava will steadily sap our stamina.\n@c0@"
  ja: "@a@b%a002030「これは　歩くだけで\n\t体力を　しょうもう　しますね。\n@c0@"
  ko: "@a@b%a002030: 걷는 것만으로도\n체력이 소모되는군요.\n@c0@"
  sl: "@a@b%a002030：只要移动就会消耗体力啊。\n@c0@"
  tl: "@a@b%a002030：只要移動就會消耗體力啊。\n@c0@"
3:
  en: "@a%0%a002000@bHot enough for ya? Monsters I don't mind, but this heat... Holy heck!\n@c0@"
  ja: "@a@b%a002000「しっかし　あち～な。\n\tまものは　こわくねえが\n\tあついのは　キライなんだよ！\n@c0@"
  ko: "@a@b%a002000: 크으, 너무 덥군.\n마물은 안 무서운데\n더운 건 딱 질색이라고!\n@c0@"
  sl: "@a@b%a002000：真热啊～\n　　俺不怕魔物，\n　　俺就怕热啊！\n@c0@"
  tl: "@a@b%a002000：真熱啊～\n　　俺不怕魔物，\n　　俺就怕熱啊！\n@c0@"
4:
  en: "@a%0%a002000@bIsn't there any water around here? I need to wet my whistle...\n@c0@"
  ja: "@a@b%a002000「くそっ！\n\tどっかに　水はないのか。\n\tのどが　カラカラだぜ……。\n@c0@"
  ko: "@a@b%a002000: 빌어먹을!\n어디 마실 물 좀 없나.\n목말라 죽겠군......\n@c0@"
  sl: "@a@b%a002000：哇呀呀！\n　　有没有水啊。\n　　喉咙干透了……\n@c0@"
  tl: "@a@b%a002000：哇呀呀！\n　　有沒有水啊。\n　　喉嚨乾透了……\n@c0@"
5:
  en: "@a%0%a002010@bHaah... Haah...\n@c0@"
  ja: "@a@b%a002010「はあ　はあ……。\n@c0@"
  ko: "@a@b%a002010: 헉헉......\n@c0@"
  sl: "@a@b%a002010：呼，呼……\n@c0@"
  tl: "@a@b%a002010：呼，呼……\n@c0@"
6:
  en: "@a%0%a002010@bThe layout of this cave is rather complicated. We must take care not to get lost.\n@c0@"
  ja: "@a@b%a002010「この　洞くつは\n\tかなり　入り組んでいるわ。\n\t迷わないようにしないと。\n@c0@"
  ko: "@a@b%a002010: 이 동굴은 상당히\n꼬여 있어. 길을 잃지 않도록\n조심해야겠어.\n@c0@"
  sl: "@a@b%a002010：这洞窟里的路\n　　真是太复杂了。\n　　希望我们不会迷路吧。\n@c0@"
  tl: "@a@b%a002010：這洞窟裡的路\n　　真是太複雜了。\n　　希望我們不會迷路吧。\n@c0@"
7:
  en: "@a%0%a002030@bThis lava forms a perfect natural barrier to prevent enemies from invading.\n@c0@"
  ja: "@a@b%a002030「この溶岩は\n\t敵からの　侵入をふせぐ\n\tバリアとして　最適ですね。\n@c0@"
  ko: "@a@b%a002030: 이 용암은\n적의 침입을 막는 장벽 역할을\n톡톡히 하겠어요.\n@c0@"
  sl: "@a@b%a002030：用这些熔岩阻止敌人进入\n　　真是再合适不过了。\n@c0@"
  tl: "@a@b%a002030：用這些熔岩阻止敵人進入\n　　真是再合適不過了。\n@c0@"
8:
  en: "@a%0%a002030@bIt's no coincidence that Murdaw has located his fortress here.\n@c0@"
  ja: "@a@b%a002030「ここに　城をかまえた\n\tムドーは　あたまが　いいのかも\n\tしれません。\n@c0@"
  ko: "@a@b%a002030: 이런 곳에 성을\n구축한 걸 보면 무도는\n보통 비상한 머리가 아니에요.\n@c0@"
  sl: "@a@b%a002030：姆多把城堡建在这里，\n　　想必是个有头脑的人。\n@c0@"
  tl: "@a@b%a002030：姆多把城堡建在這裡，\n　　想必是個有頭腦的人。\n@c0@"
9:
  en: "@a%0%a002030@bTh-This sweltering heat... I feel rather faint...\n@c0@"
  ja: "@a@b%a002030「あつくて\n\tめまいが　しそうですね……。\n@c0@"
  ko: "@a@b%a002030: 너무 더워서\n현기증이 나는군요.\n@c0@"
  sl: "@a@b%a002030：热得我头晕眼花……\n@c0@"
  tl: "@a@b%a002030：熱得我頭暈眼花……\n@c0@"
10:
  en: "@a%0%a002000@bAhh-CHOOO!\n@c0@"
  ja: "@a@b%a002000「ハーックショイ！！\n@c0@"
  ko: "@a@b%a002000: 에~에엣취!!\n@c0@"
  sl: "@a@b%a002000：阿嚏！！\n@c0@"
  tl: "@a@b%a002000：阿嚏！！\n@c0@"
11:
  en: "@a%0%a002000@bBrrrr... Now that the lava's behind us, the air feels downright chilly.\n@c0@"
  ja: "@a@b%a002000「溶岩が　なくなったら\n\tひえこんできたぜ。\n@c0@"
  ko: "@a@b%a002000: 용암이 사라지니\n체온이 떨어지는군.\n@c0@"
  sl: "@a@b%a002000：走出了熔岩区，\n　　突然就凉快了。\n@c0@"
  tl: "@a@b%a002000：走出了熔岩區，\n　　突然就涼快了。\n@c0@"
12:
  en: "@a%0%a002000@bI can feel the evil creepin' closer. That's a sign we're closin' in on Murdaw!\n@c0@"
  ja: "@a@b%a002000「邪悪な　気配が\n\tどんどん　強くなっているな。\n\tムドーが近い　しょうこだぜ！\n@c0@"
  ko: "@a@b%a002000: 사악한 기운이\n점점 강해지고 있어.\n무도가 가까이 있다는 증거야!\n@c0@"
  sl: "@a@b%a002000：邪恶的气息越来越强。\n　　这说明离姆多越来越近了！\n@c0@"
  tl: "@a@b%a002000：邪惡的氣息越來越強。\n　　這說明離姆多越來越近了！\n@c0@"
13:
  en: "@a%0%a002010@bWe've yet to reach Murdaw's Keep...\n@c0@"
  ja: "@a@b%a002010「ムドーの城まで\n\tなかなか　つかないわね。\n@c0@"
  ko: "@a@b%a002010: 무도의 성까지\n아직 멀었나.\n@c0@"
  sl: "@a@b%a002010：看来姆多城不是\n　　那么容易就能到达的。\n@c0@"
  tl: "@a@b%a002010：看來姆多城不是\n　　那麼容易就能到達的。\n@c0@"
14:
  en: "@a%0%a002010@bThe farther we press into the cave, the stronger the monsters become. Keep your wits about you!\n@c0@"
  ja: "@a@b%a002010「おくに　進むほど\n\t敵が　強くなっているわ。\n\t気をつけて　進みましょう！\n@c0@"
  ko: "@a@b%a002010: 안으로 들어갈수록\n적들이 강해지고 있어.\n조심해서 가자!\n@c0@"
  sl: "@a@b%a002010：越往前走敌人就越强。\n　　我们要小心前进！\n@c0@"
  tl: "@a@b%a002010：越往前走敵人就越強。\n　　我們要小心前進！\n@c0@"
15:
  en: "@a%0%a002030@bThis cold is all the more unpleasant after the heat of the lava...\n@c0@"
  ja: "@a@b%a002030「この　あたりは\n\t寒いくらいですね。\n@c0@"
  ko: "@a@b%a002030: 이 근처는\n오히려 추울 정도네요.\n@c0@"
  sl: "@a@b%a002030：这里还挺冷的呢。\n@c0@"
  tl: "@a@b%a002030：這裡還挺冷的呢。\n@c0@"
16:
  en: "@a%0%a002030@bOne moment I am sweating through my Ghentile robes, and the next I am hoping not to catch a chill...\n@c0@"
  ja: "@a@b%a002030「さっき　汗をかいたので\n\t今度は　カゼを　ひきそうですね。\n@c0@"
  ko: "@a@b%a002030: 아까 땀을 많이 흘려서\n감기라도 걸릴까 두렵군요.\n@c0@"
  sl: "@a@b%a002030：刚才还热得满身汗，\n　　现在又冷得要感冒。\n@c0@"
  tl: "@a@b%a002030：剛才還熱得滿身汗，\n　　現在又冷得要感冒。\n@c0@"
17:
  en: "@a%0%a002000@bDidn't know him, but I feel for him...\n@c0@"
  ja: "@a@b%a002000「どこの　だれだか\n\tわからないが　気の毒にな……。\n@c0@"
  ko: "@a@b%a002000: 어디의 누구인지\n모르겠지만 가엾기 짝이 없군......\n@c0@"
  sl: "@a@b%a002000：真可怜，\n　　不知道这是什么人……\n@c0@"
  tl: "@a@b%a002000：真可憐，\n　　不知道這是什麼人……\n@c0@"
18:
  en: "@a%0%a002010@bThat is the fate that awaits us if we drop our guard for even a second. We must remain focused.\n@c0@"
  ja: "@a@b%a002010「少しでも　ゆだんしたら\n\t私たちも　おなじ目に　あうわ。\n\t気を　引きしめて　いきましょう。\n@c0@"
  ko: "@a@b%a002010: 조금이라도 방심하면\n우리도 같은 꼴을 당할지 몰라.\n마음 단단히 먹고 가야 해.\n@c0@"
  sl: "@a@b%a002010：一旦疏忽大意，\n　　我们也会是这个下场。\n　　一定要提高警惕啊。\n@c0@"
  tl: "@a@b%a002010：一旦疏忽大意，\n　　我們也會是這個下場。\n　　一定要提高警惕啊。\n@c0@"
19:
  en: "@a%0%a002030@bSleep peacefully. You are with the Goddess now...\n@c0@"
  ja: "@a@b%a002030「安らかに……\n\t安らかに　お眠りください。\n@c0@"
  ko: "@a@b%a002030: 편히......\n고이 잠드소서.\n@c0@"
  sl: "@a@b%a002030：安息吧……\n　　愿你的灵魂安息。\n@c0@"
  tl: "@a@b%a002030：安息吧……\n　　願你的靈魂安息。\n@c0@"
20:
  en: "@a%0%a002000@bCurse you, Murdaw...!\n@c0@"
  ja: "@a@b%a002000「くそっ！\n\tムドーの　やつめ！\n@c0@"
  ko: "@a@b%a002000: 망할 놈의\n무도 같으니라고!\n@c0@"
  sl: "@a@b%a002000：可恶！\n　　姆多这混账！\n@c0@"
  tl: "@a@b%a002000：可惡！\n　　姆多這混帳！\n@c0@"
21:
  en: "@a%0%a002010@bDid you read that? On the floor?\n@c0@"
  ja: "@a@b%a002010「じめんの　文字を見た？\n@c0@"
  ko: "@a@b%a002010: 땅 위에 글씨 봤어?\n@c0@"
  sl: "@a@b%a002010：看到地上的文字了吗？\n@c0@"
  tl: "@a@b%a002010：看到地上的文字了嗎？\n@c0@"
22:
  en: "@a%0%a002010@bHe must've been a Somnian soldier looking for his missing prince...\n@c0@"
  ja: "@a@b%a002010「ゆくえ不明の\n\tレイドック王子を　さがしにきた\n\t兵士さんかしら……。\n@c0@"
  ko: "@a@b%a002010: 행방불명된\n레이독 왕자를 찾아온\n병사일까......?\n@c0@"
  sl: "@a@b%a002010：也许他是\n　　寻找失踪的雷多克王子的士兵……\n@c0@"
  tl: "@a@b%a002010：也許他是\n　　尋找失蹤的雷多克王子的士兵……\n@c0@"
23:
  en: "@a%0%a002030@bTruly this is a desolate place to meet one's end...\n@c0@"
  ja: "@a@b%a002030「こんなところで\n\tいのちを　落とされて\n\tさぞ　むねんだったでしょう……。\n@c0@"
  ko: "@a@b%a002030: 이런 곳에서\n목숨을 잃다니,\n정말 원통하겠군요......\n@c0@"
  sl: "@a@b%a002030：在这种地方殒命，\n　　他一定很遗憾……\n@c0@"
  tl: "@a@b%a002030：在這種地方殞命，\n　　他一定很遺憾……\n@c0@"
24:
  en: "@a%0%a002000@bYa gettin' a whiff of this foul air? Aye, this is Murdaw's castle, alright.\n@c0@"
  ja: "@a@b%a002000「さすが　魔王の城だ。\n\t化け物の　においが\n\tプンプンするぜ……。\n@c0@"
  ko: "@a@b%a002000: 과연 마왕의 성이군.\n괴물 냄새가\n진동하고 있어......\n@c0@"
  sl: "@a@b%a002000：不愧是魔王城堡。\n　　到处都是\n　　魔物的气味……\n@c0@"
  tl: "@a@b%a002000：不愧是魔王城堡。\n　　到處都是\n　　魔物的氣味……\n@c0@"
25:
  en: "@a%0%a002000@bKeep your eyes peeled. The enemy could strike at any moment!\n@c0@"
  ja: "@a@b%a002000「あたりに　気をつけろよ。\n\t敵さんは　どこから　おそって来るか\n\tわからないからな！\n@c0@"
  ko: "@a@b%a002000: 주위를 조심해!\n적이 어디서 공격해 올지\n모르니까.\n@c0@"
  sl: "@a@b%a002000：注意周围！\n　　这么危险的地方\n　　随时会有敌人！\n@c0@"
  tl: "@a@b%a002000：注意周圍！\n　　這麼危險的地方\n　　隨時會有敵人！\n@c0@"
26:
  en: "@a%0%a002010@bBe careful. I sense that our presence here has not gone unnoticed.\n@c0@"
  ja: "@a@b%a002010「気をつけてね。\n\t私たちのこと　気づかれていても\n\t不思議じゃないんだから。\n@c0@"
  ko: "@a@b%a002010: 조심해.\n이미 우리가 들켰다고 해도 \n이상할 게 없으니까.\n@c0@"
  sl: "@a@b%a002010：注意周围。\n　　现在就算我们被发现了\n　　也已经不足为奇。\n@c0@"
  tl: "@a@b%a002010：注意周圍。\n　　現在就算我們被發現了\n　　也已經不足為奇。\n@c0@"
27:
  en: "@a%0%a002010@bWe must push on...\n@c0@"
  ja: "@a@b%a002010「どんどん前に\n\tすすみましょう。\n@c0@"
  ko: "@a@b%a002010: 앞으로 계속\n나아가자.\n@c0@"
  sl: "@a@b%a002010：继续向前走吧。\n@c0@"
  tl: "@a@b%a002010：繼續向前走吧。\n@c0@"
28:
  en: "@a%0%a002030@bI have never before experienced such an oppressive sense of evil...\n@c0@"
  ja: "@a@b%a002030「いままで\n\tこれほど　邪悪な　気配は\n\t感じたことが　ありませんね。\n@c0@"
  ko: "@a@b%a002030: 지금까지\n이렇게까지 사악한 기운은\n느껴본 적이 없습니다.\n@c0@"
  sl: "@a@b%a002030：我从未感受过\n　　这么强烈的邪恶气息。\n@c0@"
  tl: "@a@b%a002030：我從未感受過\n　　這麼強烈的邪惡氣息。\n@c0@"
29:
  en: "@a%0%a002000@bHaah... That guy played rough!\n@c0@"
  ja: "@a@b%a002000「ふう……。\n\tおどかしやがって！\n@c0@"
  ko: "@a@b%a002000: 휴우......\n놀랐잖아!\n@c0@"
  sl: "@a@b%a002000：哼哼……\n　　叫你再吓人！\n@c0@"
  tl: "@a@b%a002000：哼哼……\n　　叫你再嚇人！\n@c0@"
30:
  en: "@a%0%a002010@bI sense that was not the last of Murdaw's traps. We must proceed with caution.\n@c0@"
  ja: "@a@b%a002010「もっと　いろいろな\n\tワナが　あるかもしれないから\n\t気をつけましょう。\n@c0@"
  ko: "@a@b%a002010: 더 많은 함정이\n있을지도 모르니\n조심하자.\n@c0@"
  sl: "@a@b%a002010：前面说不定\n　　还有更多的陷阱，\n　　大家要小心。\n@c0@"
  tl: "@a@b%a002010：前面說不定\n　　還有更多的陷阱，\n　　大家要小心。\n@c0@"
31:
  en: "@a%0%a002030@bTruly, Murdaw excels in the arts of deception. To be attacked by a stone statue!\n@c0@"
  ja: "@a@b%a002030「いやあ　さすがに\n\tおどろきましたね……。\n\t石像が　おそいかかってくるとは。\n@c0@"
  ko: "@a@b%a002030: 이번 일은 정말\n놀랐습니다......\n설마 석상이 공격해올 줄이야.\n@c0@"
  sl: "@a@b%a002030：哎呀，真是吓我一跳……\n　　石像竟然会攻击我们。\n@c0@"
  tl: "@a@b%a002030：哎呀，真是嚇我一跳……\n　　石像竟然會攻擊我們。\n@c0@"
32:
  en: "@a%0%a002000@bHardy har! Ain't no problem now that we're ready for him, aye?\n@c0@"
  ja: "@a@b%a002000「へへん！\n\tわかってしまえば\n\tもう　こっちの　ペースさ！\n@c0@"
  ko: "@a@b%a002000: 에헴!\n알고 보면\n내 방식대로 돌아가지!\n@c0@"
  sl: "@a@b%a002000：哼哼！\n　　乖乖地被俺们打倒吧！\n@c0@"
  tl: "@a@b%a002000：哼哼！\n　　乖乖地被俺們打倒吧！\n@c0@"
33:
  en: "@a%0%a002010@bWhat could these statues be guarding?\n@c0@"
  ja: "@a@b%a002010「この　石像たちは\n\t何かを　まもっているのかしら？\n@c0@"
  ko: "@a@b%a002010: 이 석상들은\n뭔가를 지키고 있는 걸까?\n@c0@"
  sl: "@a@b%a002010：这些石像想要保护什么？\n@c0@"
  tl: "@a@b%a002010：這些石像想要保護什麼？\n@c0@"
34:
  en: "@a%0%a002030@bWe shan't be fooled by the same old tricks!\n@c0@"
  ja: "@a@b%a002030「もう　おどろきません！\n@c0@"
  ko: "@a@b%a002030: 이제 놀라지 않을 겁니다!\n@c0@"
  sl: "@a@b%a002030：再也吓不倒我了！\n@c0@"
  tl: "@a@b%a002030：再也嚇不倒我了！\n@c0@"
35:
  en: "@a%0%a002000@bC'mon, %a000090! Let's bash that Murdaw good! After that, there's just the small matter of findin' your real body!\n@c0@"
  ja: "@a@b%a002000「さっさと　ムドーを倒して\n\tいっしょに　%a000090の　実体を\n\tさがしに　行こうな！\n@c0@"
  ko: "@a@b%a002000: 빨리 무도를 \n쓰러트리고 %a000090의 \n진짜 몸을 찾으러 가자!\n@c0@"
  sl: "@a@b%a002000：咱们赶快打倒姆多，\n　　然后一起去找\n　　%a000090的真身吧！\n@c0@"
  tl: "@a@b%a002000：咱們趕快打倒姆多，\n　　然後一起去找\n　　%a000090的真身吧！\n@c0@"
36:
  en: "@a%0%a002010@bWe've all got a lot on our minds, but for now, we must focus on defeating Murdaw.\n@c0@"
  ja: "@a@b%a002010「いろいろ　思うところが\n\tあるだろうけど　いまは　ひたすら\n\tムドー打倒のことを　考えてね！\n@c0@"
  ko: "@a@b%a002010: 여러 가지 생각이\n들겠지만 지금은 오로지\n무도를 무찌를 생각에만 전념해!\n@c0@"
  sl: "@a@b%a002010：虽然现在有很多想法，\n　　不过目前最重要的想法就是\n　　打倒姆多！\n@c0@"
  tl: "@a@b%a002010：雖然現在有很多想法，\n　　不過目前最重要的想法就是\n　　打倒姆多！\n@c0@"
37:
  en: "@a%0%a002030@bI confess that I am flummoxed by what I just witnessed. I thought my studies had covered everything...\n@c0@"
  ja: "@a@b%a002030「いまのは　いったい！？\n\t私には　まだよく\n\tりかい　できていません……。\n@c0@"
  ko: "@a@b%a002030: 방금 그건 대체!?\n저는 아직까지 잘\n이해가 되질 않습니다......\n@c0@"
  sl: "@a@b%a002030：刚才是怎么回事？！\n　　我还无法完全理解……\n@c0@"
  tl: "@a@b%a002030：剛才是怎麼回事？！\n　　我還無法完全理解……\n@c0@"
38:
  en: "@a%0%a002000@bA sorcerer mightier than Murdaw? Well, I'll believe anythin' at this point.\n@c0@"
  ja: "@a@b%a002000「ムドーより　強い存在？\n\tいまさら　だれが　出てきても\n\tおどろきはしないぜ。\n@c0@"
  ko: "@a@b%a002000: 무도보다 강한 존재?\n이제와서 누가 나타나도\n놀라지 않아.\n@c0@"
  sl: "@a@b%a002000：比姆多还强的怪物？\n　　现在不管谁跳出来，\n　　俺都不会吓倒。\n@c0@"
  tl: "@a@b%a002000：比姆多還強的怪物？\n　　現在不管誰跳出來，\n　　俺都不會嚇倒。\n@c0@"
39:
  en: "@a%0%a002010@bI don't sense any aggression in this monster's aura...\n@c0@"
  ja: "@a@b%a002010「戦う　つもりは\n\tないみたいね……。\n@c0@"
  ko: "@a@b%a002010: 싸울 마음이\n없는 모양이야......\n@c0@"
  sl: "@a@b%a002010：它好像不打算跟我们战斗……\n@c0@"
  tl: "@a@b%a002010：它好像不打算跟我們戰鬥……\n@c0@"
40:
  en: "@a%0%a002020@bThe bigger they are, the harder we'll whack 'em!\n@c0@"
  ja: "@a@b%a002020「どんな　ヤツがいても\n\tみんな　あたしたちで\n\tやっつけてやるもん！\n@c0@"
  ko: "@a@b%a002020: 어떤 놈이라도\n우리가 힘을 합쳐\n혼내줄 거야!\n@c0@"
  sl: "@a@b%a002020：无论什么样的怪物，\n　　我们都会打倒它！\n@c0@"
  tl: "@a@b%a002020：無論什麼樣的怪物，\n　　我們都會打倒它！\n@c0@"
41:
  en: "@a%0%a002030@bPerhaps there really are sorcerers out there even mightier than Murdaw...\n@c0@"
  ja: "@a@b%a002030「ムドークラスの　敵も\n\tおそらく　世界の　あちこちに\n\tいるのでしょうが……\n@c0@"
  ko: "@a@b%a002030: 아마 무도만큼 힘센\n적이야 세계 곳곳에\n있겠지만......\n@c0@"
