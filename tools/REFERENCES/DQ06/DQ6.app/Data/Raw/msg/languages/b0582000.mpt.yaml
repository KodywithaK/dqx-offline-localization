0:
  en: "@a%0%a002000@bWhat is this place...?\n@c0@"
  ja: "@a@b%a002000「ここは……？\n@c0@"
  ko: "@a@b%a002000: 여기는......?\n@c0@"
  sl: "@a@b%a002000：这是什么地方？\n@c0@"
  tl: "@a@b%a002000：這是什麼地方？\n@c0@"
1:
  en: "@a%0%a002010@bWho'd have thought there was a place like this under the sea.\n@c0@"
  ja: "@a@b%a002010「あら　海の中に\n\tこんな　ところが……。\n@c0@"
  ko: "@a@b%a002010: 어머, 바닷속에\n이런 곳이......\n@c0@"
  sl: "@a@b%a002010：哎呀，海里\n　　居然还会有这种地方……\n@c0@"
  tl: "@a@b%a002010：哎呀，海裡\n　　居然還會有這種地方……\n@c0@"
2:
  en: "@a%0%a002030@bI detect a strong sense of the divine here.\n@c0@"
  ja: "@a@b%a002030「ここにも　神さまの\n\t不思議な　チカラを　感じます。\n@c0@"
  ko: "@a@b%a002030: 여기서도 신의\n신비한 힘을 느낍니다.\n@c0@"
  sl: "@a@b%a002030：这里也能够\n　　感受到神灵那不可思议的力量。\n@c0@"
  tl: "@a@b%a002030：這裡也能夠\n　　感受到神靈那不可思議的力量。\n@c0@"
3:
  en: "@a%0%a002020@bIs this some kinda sunken church or something?\n@c0@"
  ja: "@a@b%a002020「海の中の\n\t教会…　なのかな？\n@c0@"
  ko: "@a@b%a002020: 바닷속에 있는\n성당...인가?\n@c0@"
  sl: "@a@b%a002020：大海里的……教会吗？\n@c0@"
  tl: "@a@b%a002020：大海裡的……教會嗎？\n@c0@"
4:
  en: "@a%0%a002040@bI don't get the feeling there are any enemies around.\n@c0@"
  ja: "@a@b%a002040「敵の　気配は\n\tとくに　感じないな。\n@c0@"
  ko: "@a@b%a002040: 적의 기운은\n특별히 느껴지지 않는군.\n@c0@"
  sl: "@a@b%a002040：没有感觉到\n　　敌人的气息。\n@c0@"
  tl: "@a@b%a002040：沒有感覺到\n　　敵人的氣息。\n@c0@"
5:
  en: "@a%0%a002050@bI see a slime... Any other monsters lurking?\n@c0@"
  ja: "@a@b%a002050「ス　スライムが　いますね！\n\tほかに　まものは！？\n@c0@"
  ko: "@a@b%a002050: 스, 슬라임이 있는데요!?\n다른 마물은!?\n@c0@"
  sl: "@a@b%a002050：有、有个史、史莱姆！\n　　不会还有其他的魔物吧？！\n@c0@"
  tl: "@a@b%a002050：有、有個史、史萊姆！\n　　不會還有其他的魔物吧？！\n@c0@"
6:
  en: "@a%0%a002060@b(snarl) Grrrargh... (slobber)\n@c0@"
  ja: "@a@b%a002060「ギルル……。\n@c0@"
  ko: "@a@b%a002060: 캬르르......\n@c0@"
  sl: "@a@b%a002060：咕噜噜……\n@c0@"
  tl: "@a@b%a002060：咕嚕嚕……\n@c0@"
7:
  en: "@a%0%a002070@b(slurp) Boing?\n@c0@"
  ja: "@a@b%a002070「プルプル　プルルー！\n@c0@"
  ko: "@a@b%a002070: 뽀용뽀용 뽀요용~!\n@c0@"
  sl: "@a@b%a002070：噗噜噗噜，噗噜噜！\n@c0@"
  tl: "@a@b%a002070：噗嚕噗嚕，噗嚕嚕！\n@c0@"
8:
  en: "@a%0%a002000@bAn underwater temple, aye? Are they tryin' to keep their god a secret 'n' everything like that?\n@c0@"
  ja: "@a@b%a002000「海の底に　ひっそりと\n\tまつられている　ってわけか。\n@c0@"
  ko: "@a@b%a002000: 바다 깊은 곳에서 몰래\n모시고 있는 건가?\n@c0@"
  sl: "@a@b%a002000：是被悄悄地\n　　供奉在海底的吗？\n@c0@"
  tl: "@a@b%a002000：是被悄悄地\n　　供奉在海底的嗎？\n@c0@"
9:
  en: "@a%0%a002010@bOrdinary people would never be able to find a place like this.\n@c0@"
  ja: "@a@b%a002010「この場所は\n\tとても　ふつうの人には\n\t見つけられないわね。\n@c0@"
  ko: "@a@b%a002010: 이곳은\n보통 사람들이라면 도저히\n찾을 수 없을 거야.\n@c0@"
  sl: "@a@b%a002010：这种地方，\n　　一般人根本找不到吧。\n@c0@"
  tl: "@a@b%a002010：這種地方，\n　　一般人根本找不到吧。\n@c0@"
10:
  en: "@a%0%a002030@bI confess to being unaware of the existence of a naming god.\n@c0@"
  ja: "@a@b%a002030「さすがに\n\t名前の　神さまが　いるとは\n\t知りませんでしたね。\n@c0@"
  ko: "@a@b%a002030: 설마\n이름의 신이 있을 줄은\n몰랐습니다.\n@c0@"
  sl: "@a@b%a002030：我还真不知道\n　　世上竟然还有名字之神呢。\n@c0@"
  tl: "@a@b%a002030：我還真不知道\n　　世上竟然還有名字之神呢。\n@c0@"
11:
  en: "@a%0%a002020@bTee hee! Is there anything we can't find?\n@c0@"
  ja: "@a@b%a002020「えへへ。\n\tあたしたちは　どんなものでも\n\t見つけちゃうもんねー！\n@c0@"
  ko: "@a@b%a002020: 에헤헤.\n우린 뭐든 다\n찾아낸다구~!\n@c0@"
  sl: "@a@b%a002020：呵呵呵。\n　　我们还真是发现了\n　　不少奇怪的地方啊！\n@c0@"
  tl: "@a@b%a002020：呵呵呵。\n　　我們還真是發現了\n　　不少奇怪的地方啊！\n@c0@"
12:
  en: "@a%0%a002040@bThere's all manner of gods knocking about, isn't there...\n@c0@"
  ja: "@a@b%a002040「まったく　世の中には\n\tいろんな　神が　いるもんだな。\n@c0@"
  ko: "@a@b%a002040: 하여튼, 세상에는\n다양한 신이 있군.\n@c0@"
  sl: "@a@b%a002040：这世上\n　　还真是什么神都有啊。\n@c0@"
  tl: "@a@b%a002040：這世上\n　　還真是什麼神都有啊。\n@c0@"
13:
  en: "@a%0%a002050@bWell I never. Fancy stumblin' on a place like this.\n@c0@"
  ja: "@a@b%a002050「いや　まあ\n\tたまたま　見つけたっていうのが\n\tホントの　ところですけどね。\n@c0@"
  ko: "@a@b%a002050: 저기, 그게 말이죠.\n솔직히 말하면\n우연히 발견한 거랍니다.\n@c0@"
  sl: "@a@b%a002050：老实说，\n　　我们只是无意间找到了这里。\n@c0@"
  tl: "@a@b%a002050：老實說，\n　　我們只是無意間找到了這裡。\n@c0@"
14:
  en: "@a%0%a002060@b(snarl) Naming...god...? (spit)\n@c0@"
  ja: "@a@b%a002060「名前の…神さま…\n\tギルルルル……。\n@c0@"
  ko: "@a@b%a002060: 이름의...신...\n캬르르르......\n@c0@"
  sl: "@a@b%a002060：名字……之神……\n　　咕噜噜噜噜……\n@c0@"
  tl: "@a@b%a002060：名字……之神……\n　　咕嚕嚕嚕嚕……\n@c0@"
15:
  en: "@a%0%a002070@bBoing...boing?\n@c0@"
  ja: "@a@b%a002070「プルプルー　プルルッ！\n@c0@"
  ko: "@a@b%a002070: 뽀용뽀용~ 뽀르르!\n@c0@"
  sl: "@a@b%a002070：噗噜噗噜，噗噜噜！\n@c0@"
  tl: "@a@b%a002070：噗嚕噗嚕，噗嚕嚕！\n@c0@"
16:
  en: "@a%0%a002000@bI bet I'll sleep pretty deep here. Hardy har!\n@c0@"
  ja: "@a@b%a002000「ちょっと　ひと息\n\tって感じだな。\n@c0@"
  ko: "@a@b%a002000: 잠시 쉬어 갈 수\n있겠군.\n@c0@"
  sl: "@a@b%a002000：终于能够喘口气了。\n@c0@"
  tl: "@a@b%a002000：終於能夠喘口氣了。\n@c0@"
17:
  en: "@a%0%a002010@bIt's reassuring to know we've got a place to rest underwater as well.\n@c0@"
  ja: "@a@b%a002010「こうして　海の中でも\n\t休める場所が　あると\n\t安心　できるわね。\n@c0@"
  ko: "@a@b%a002010: 이렇게 바닷속에서도\n쉴 수 있는 곳이 있으니\n안심이 되는걸.\n@c0@"
  sl: "@a@b%a002010：没想到海里\n　　也有能够休息的地方，\n　　这下可以安心了。\n@c0@"
  tl: "@a@b%a002010：沒想到海裡\n　　也有能夠休息的地方，\n　　這下可以安心了。\n@c0@"
18:
  en: "@a%0%a002030@bIf nothing else, this place will serve as an excellent waypoint. It's quite easy to get lost under the sea!\n@c0@"
  ja: "@a@b%a002030「海の中にいると\n\t自分たちが　どこにいるのか\n\tわからなくなって　しまいますよね。\n@c0@"
  ko: "@a@b%a002030: 바닷속에 있으면\n자기가 어디에 있는지\n알 수 없게 되지요.\n@c0@"
  sl: "@a@b%a002030：自从到了海里，\n　　我就搞不清楚我们所处的位置了。\n@c0@"
  tl: "@a@b%a002030：自從到了海裡，\n　　我就搞不清楚我們所處的位置了。\n@c0@"
19:
  en: "@a%0%a002020@bAww. I thought this was a mermaid's house.\n@c0@"
  ja: "@a@b%a002020「海の中の　お家だけど\n\t住んでるのは　人魚じゃ　ないんだね。\n@c0@"
  ko: "@a@b%a002020: 바닷속 집인데\n살고 있는 사람은 인어가 아니네.\n@c0@"
  sl: "@a@b%a002020：虽然房子建在了海里，\n　　可里面住的却不是人鱼呢。\n@c0@"
  tl: "@a@b%a002020：雖然房子建在了海裡，\n　　可裡面住的卻不是人魚呢。\n@c0@"
20:
  en: "@a%0%a002040@bLet's get going.\n@c0@"
  ja: "@a@b%a002040「さっさと　行こうぜ。\n@c0@"
  ko: "@a@b%a002040: 어서 가자.\n@c0@"
  sl: "@a@b%a002040：快去看看吧。\n@c0@"
  tl: "@a@b%a002040：快去看看吧。\n@c0@"
21:
  en: "@a%0%a002050@bBlimey! Folks live way down here too?\n@c0@"
  ja: "@a@b%a002050「こんなところにも　ひとが\n\tすんでいるんですね。\n@c0@"
  ko: "@a@b%a002050: 이런 곳에서도 사람이\n살고 있군요.\n@c0@"
  sl: "@a@b%a002050：这种地方\n　　居然也会有人住啊。\n@c0@"
  tl: "@a@b%a002050：這種地方\n　　居然也會有人住啊。\n@c0@"
22:
  en: "@a%0%a002060@b(snarl) No...monster...here... (spit)\n@c0@"
  ja: "@a@b%a002060「まもの…いない……。\n@c0@"
  ko: "@a@b%a002060: 마물...없다......\n@c0@"
  sl: "@a@b%a002060：没有……魔物……\n@c0@"
  tl: "@a@b%a002060：沒有……魔物……\n@c0@"
23:
  en: "@a%0%a002070@b(slurp) Boing!\n@c0@"
  ja: "@a@b%a002070「プルプル。\n@c0@"
  ko: "@a@b%a002070: 뽀용뽀용.\n@c0@"
  sl: "@a@b%a002070：噗噜噗噜。\n@c0@"
  tl: "@a@b%a002070：噗嚕噗嚕。\n@c0@"
24:
  en: "@a%0%a002000@bAn underwater inn... What'll they think of next?\n@c0@"
  ja: "@a@b%a002000「こんな　海底にまで\n\t宿屋が　あるなんて\n\tまったく　便利な　世の中だぜ。\n@c0@"
  ko: "@a@b%a002000: 이런 해저에까지\n여관이 있다니,\n정말 편리한 세상이군.\n@c0@"
  sl: "@a@b%a002000：这么深的海底\n　　竟然还会有旅店，\n　　这个世界还真是太方便了。\n@c0@"
  tl: "@a@b%a002000：這麼深的海底\n　　竟然還會有旅店，\n　　這個世界還真是太方便了。\n@c0@"
25:
  en: "@a%0%a002010@bI get excited just thinking of spending a night underwater.\n@c0@"
  ja: "@a@b%a002010「海の底で　眠る……なんて\n\t考えただけでも　ステキよね。\n@c0@"
  ko: "@a@b%a002010: 바닷속에서 잠들다니......\n생각만 해도 멋져.\n@c0@"
  sl: "@a@b%a002010：在海底沉睡啊……\n　　想想都觉得很棒。\n@c0@"
  tl: "@a@b%a002010：在海底沉睡啊……\n　　想想都覺得很棒。\n@c0@"
26:
  en: "@a%0%a002030@bShall we stay, %a000090? It pays to be prepared for whatever comes next.\n@c0@"
  ja: "@a@b%a002030「%a000090さん　泊まって\n\tいきますか？\n\t転ばぬ先のつえ　ですよ。\n@c0@"
  ko: "@a@b%a002030: %a000090 님,\n묵고 갈까요?\n준비는 철저히 해 둬야지요.\n@c0@"
  sl: "@a@b%a002030：%a000090，\n　　要不要先在这里住下？\n　　凡事都要有备无患啊。\n@c0@"
  tl: "@a@b%a002030：%a000090，\n　　要不要先在這裡住下？\n　　凡事都要有備無患啊。\n@c0@"
27:
  en: "@a%0%a002020@bWhy is danger always awaiting us? Can't danger get a hobby or something and leave us alone?\n@c0@"
  ja: "@a@b%a002020「どんな　キケンも\n\tまってて　ほしく　ないなー。\n@c0@"
  ko: "@a@b%a002020: 아무 위험도\n도사리지 말았으면 좋겠는데~\n@c0@"
  sl: "@a@b%a002020：无论什么样的危险，\n　　可别找上我啊。\n@c0@"
  tl: "@a@b%a002020：無論什麼樣的危險，\n　　可別找上我啊。\n@c0@"
28:
  en: "@a%0%a002040@bIf you fall out of bed, you're going to get quite a soaking.\n@c0@"
  ja: "@a@b%a002040「ねぞうが　悪くて\n\tベッドから　落ちたら\n\tびしょぬれだな。\n@c0@"
  ko: "@a@b%a002040: 자면서 몸부림 치다가\n침대에서 떨어지면\n흠뻑 젖겠군.\n@c0@"
  sl: "@a@b%a002040：睡相太差\n　　从床上掉下来的话，\n　　可是会浑身湿透的。\n@c0@"
  tl: "@a@b%a002040：睡相太差\n　　從床上掉下來的話，\n　　可是會渾身濕透的。\n@c0@"
29:
  en: "@a%0%a002050@b%0%a000090, you might have the record for stayin' in the most inns in the world!\n@c0@"
  ja: "@a@b%a002050「%a000090さん！　いつの日か　\n\t世界中の　宿屋に　泊まった男として\n\t有名に　なれるかも　しれませんよ！\n@c0@"
  ko: "@a@b%a002050: %a000090 님! 언젠가\n전 세계의 여관에서 묵고 간 남자로\n유명해질지도 모른다구요!\n@c0@"
  sl: "@a@b%a002050：%a000090！或许\n　　有一天你会因为住遍了\n　　全世界的旅店而出名呢！\n@c0@"
  tl: "@a@b%a002050：%a000090！或許\n　　有一天你會因為住遍了\n　　全世界的旅店而出名呢！\n@c0@"
30:
  en: "@a%0%a002060@b(snarl) Damp... Soggy... (spit)\n@c0@"
  ja: "@a@b%a002060「ジメジメ…してる…な。\n@c0@"
  ko: "@a@b%a002060: 축축...하...다.\n@c0@"
  sl: "@a@b%a002060：浑身……湿漉漉……的。\n@c0@"
  tl: "@a@b%a002060：渾身……濕漉漉……的。\n@c0@"
31:
  en: "@a%0%a002070@b(jiggle) Boing.\n@c0@"
  ja: "@a@b%a002070「プルプル……。\n@c0@"
  ko: "@a@b%a002070: 뽀용뽀용......\n@c0@"
  sl: "@a@b%a002070：噗噜噗噜……\n@c0@"
  tl: "@a@b%a002070：噗嚕噗嚕……\n@c0@"
