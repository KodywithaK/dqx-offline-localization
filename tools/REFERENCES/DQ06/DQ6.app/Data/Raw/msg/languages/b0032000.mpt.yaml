0:
  en: "@a@b*: According to a sailor chum of mine, the seas have become uncommonly choppy of late.\n@c0@"
  ja: "@a@b＊「これは　知り合いの船乗りから\n\t聞いた話だが　近頃　妙に\n\t海が　荒れているらしいぞ。\n@c0@"
  ko: "@a@b*: 이건 내가 아는 뱃사람에게서\n들은 이야기인데, 최근 들어 이상하게\n바다가 거칠어졌다는군.\n@c0@"
  sl: "@a@b＊：我从船上的朋友那里听说，\n　　最近海上怪事多，\n　　很不平静呢。\n@c0@"
  tl: "@a@b＊：我從船上的朋友那裡聽說，\n　　最近海上怪事多，\n　　很不平靜呢。\n@c0@"
1:
  en: "@a@b*: The sea to the west of this continent in particular seems terribly rough. I wonder what could be causing it...\n@c0@"
  ja: "@a@b＊「とくに　この大陸の西の海が\n\tさわがしいということだが\n\tなにか　あるのだろうか……。\n@c0@"
  ko: "@a@b*: 특히 이 대륙 서쪽의 바다가\n시끌시끌하다는데\n무슨 일이 생긴 건지......\n@c0@"
  sl: "@a@b＊：特别是这片大陆以西的海上，\n　　简直是波涛汹涌。\n　　到底发生了什么呢……\n@c0@"
  tl: "@a@b＊：特別是這片大陸以西的海上，\n　　簡直是波濤洶湧。\n　　到底發生了什麼呢……\n@c0@"
2:
  en: "@a@b*: Mr and Mrs Tress seem so much more at ease these days.\n@c0@"
  ja: "@a@b＊「ハリスさんと　奥さんの顔つきが\n\tとても　おだやかなものに\n\tなってきました。\n@c0@"
  ko: "@a@b*: 해리스 씨 부부의 표정이\n매우 평온하게\n바뀌었습니다.\n@c0@"
  sl: "@a@b＊：哈里斯和他妻子\n　　脸上的表情变得\n　　安祥起来了呢。\n@c0@"
  tl: "@a@b＊：哈里斯和他妻子\n　　臉上的表情變得\n　　安祥起來了呢。\n@c0@"
3:
  en: "@a@b*: Fulfilling the promise made to young Matthew has been a source of great comfort for both of them.\n@c0@"
  ja: "@a@b＊「ジョンくんとの　約束を果たせて\n\tおふたりの気持ちも　すこしは\n\t楽になったのでしょう。\n@c0@"
  ko: "@a@b*: 존과의 약속을 지키고 나니\n두 분의 마음도 조금은\n편안해졌겠지요.\n@c0@"
  sl: "@a@b＊：完成了和约翰的约定，\n　　两人的心情也能\n　　轻松一点吧。\n@c0@"
  tl: "@a@b＊：完成了和約翰的約定，\n　　兩人的心情也能\n　　輕鬆一點吧。\n@c0@"
4:
  en: "@a@b*: That Tom Foolery is a riddle wrapped in an enigma and tied up with a bow of secrets!\n@c0@"
  ja: "@a@b＊「パノンってひとは　いつも\n\t謎に　つつまれているの。\n@c0@"
  ko: "@a@b*: 파논이라는 사람은 늘\n베일에 싸여 있어.\n@c0@"
  sl: "@a@b＊：帕农这个人\n　　真是谜团重重啊。\n@c0@"
  tl: "@a@b＊：帕農這個人\n　　真是謎團重重啊。\n@c0@"
5:
  en: "@a@b*: Some say there are multiple Toms, while others say it's a title reserved for the best entertainer of the era.\n㈡\n*: No one knows for sure...\n@c0@"
  ja: "@a@b＊「パノンが　何人もいるっていうひとや\n\t最高の芸人だけに　パノンの名が\n\t許されるっていうひとも　いるわ。\n@c0@"
  ko: "@a@b*: 파논이 몇 명 있다는 사람도 있고\n최고의 광대에게만 파논이라는 이름이\n허락된다는 사람도 있지.\n@c0@"
  sl: "@a@b＊：有人说叫帕农的人有好几个，\n　　还有人说帕农是赐给\n　　最厉害的艺人的名字。\n@c0@"
  tl: "@a@b＊：有人說叫帕農的人有好幾個，\n　　還有人說帕農是賜給\n　　最厲害的藝人的名字。\n@c0@"
6:
  en: "@a@b*: For all we know, he could be a woman disguised as a man!\n@c0@"
  ja: "@a@b＊「でも　本当のところは\n\t誰も　知らないのよ。\n@c0@"
  ko: "@a@b*: 하지만 진실은\n아무도 몰라.\n@c0@"
  sl: "@a@b＊：不过，谁都不知道真相。\n@c0@"
  tl: "@a@b＊：不過，誰都不知道真相。\n@c0@"
7:
  en: "@a@b*: I say, have you heard?\n㈡\n*: A group of kindly travellers scaled Destiny's Drop in order to fulfil the promise that was made to little Matt.\n@c0@"
  ja: "@a@b＊「あんた　知ってるかい？\n\t親切な旅の人が　ジョンくんのために\n\t運命のカベに　のぼったそうだ。\n@c0@"
  ko: "@a@b*: 당신, 알고 있나?\n친절한 여행자가 존을 위해\n운명의 벽을 올랐다는군.\n@c0@"
  sl: "@a@b＊：你知道吗？据说\n　　有热心的旅行者为了约翰\n　　去攀登命运之墙了呢。\n@c0@"
  tl: "@a@b＊：你知道嗎？據說\n　　有熱心的旅行者為了約翰\n　　去攀登命運之牆了呢。\n@c0@"
8:
  en: "@a@b*: I doff my cap to such upstanding citizens.\n@c0@"
  ja: "@a@b＊「まったく　あたまが　さがるよ。\n@c0@"
  ko: "@a@b*: 존경스러울 따름이야.\n@c0@"
  sl: "@a@b＊：真是佩服得五体投地啊。\n@c0@"
  tl: "@a@b＊：真是佩服得五體投地啊。\n@c0@"
9:
  en: "@aMr Tress@bOh, it's you!\n@c0@"
  ja: "@a@bハリス「やや！　あなたは\n\tあの時の……。\n@c0@"
  ko: "@a@b해리스: 앗! 당신은\n그때 그......\n@c0@"
  sl: "@a@b哈里斯：哎呀！\n　　你是那个时候的……\n@c0@"
  tl: "@a@b哈里斯：哎呀！\n　　你是那個時候的……\n@c0@"
10:
  en: "@aMr Tress@bI was surprised when you suddenly disappeared like that.\n@c0@"
  ja: "@a@bハリス「いやー　あの時は\n\t突然　いなくなったので\n\tびっくりしちゃいましたよ。\n@c0@"
  ko: "@a@b해리스: 그때는\n갑자기 사라지셔서\n깜짝 놀랐습니다.\n@c0@"
  sl: "@a@b哈里斯：哎呀。\n　　那个时候你忽然就不见了，\n　　我真是吓了一跳。\n@c0@"
  tl: "@a@b哈里斯：哎呀。\n　　那個時候你忽然就不見了，\n　　我真是嚇了一跳。\n@c0@"
11:
  en: "@aMr Tress@bWhen I saw that empty bed in the morning, I simply couldn't imagine what might have happened to you!\n@c0@"
  ja: "@a@bハリス「朝になって　誰もいない\n\tベッドを見て　どうしたんだろうと\n\t心配していたのです。\n@c0@"
  ko: "@a@b해리스: 아침이 되고서야\n아무도 없는 침대를 보고\n무슨 일인가 싶어 걱정했죠.\n@c0@"
  sl: "@a@b哈里斯：早上起来看见\n　　床上空无一人，\n　　我真是担心啊。\n@c0@"
  tl: "@a@b哈里斯：早上起來看見\n　　床上空無一人，\n　　我真是擔心啊。\n@c0@"
12:
  en: "@aMr Tress@bWell, anyway, you did a jolly good turn for us, getting that shard of courage.\n@c0@"
  ja: "@a@bハリス「ともかく　そのせつは\n\tお世話に　なりました。\n@c0@"
  ko: "@a@b해리스: 아무튼 그때는\n정말 감사했습니다.\n@c0@"
  sl: "@a@b哈里斯：不管怎么说，\n　　之前真是多有麻烦。\n@c0@"
  tl: "@a@b哈里斯：不管怎麼說，\n　　之前真是多有麻煩。\n@c0@"
13:
  en: "@aMr Tress@bIt was thanks to you that we were able to fulfil the promise Tom Foolery made to our son.\n@c0@"
  ja: "@a@bハリス「あなたがたの　おかげで\n\t息子との　約束を\n\t果たすことが　できました。\n@c0@"
  ko: "@a@b해리스: 여러분 덕택에\n아들과의 약속을\n지킬 수 있었습니다.\n@c0@"
  sl: "@a@b哈里斯：多亏了你们，\n　　我才能够完成和儿子的约定。\n@c0@"
  tl: "@a@b哈里斯：多虧了你們，\n　　我才能夠完成和兒子的約定。\n@c0@"
14:
  en: "@aMrs Tress@bOh, it's you! Thank you so much for what you did for us.\n@c0@"
  ja: "@a@bマゴット「まあ　あなたがたは\n\tいつぞやの……。　あの時は\n\t本当に　ありがとうございました。\n@c0@"
  ko: "@a@b마고트: 어머, 당신들은\n지난번에 뵈었던...... 그때는\n정말 고마웠어요.\n@c0@"
  sl: "@a@b玛格特：啊，你们是之前的……\n　　那件事真是太感谢了。\n@c0@"
  tl: "@a@b瑪格特：啊，你們是之前的……\n　　那件事真是太感謝了。\n@c0@"
15:
  en: "@aMrs Tress@bWe're certain that our little Matthew is smiling down on us from the heavens!\n@c0@"
  ja: "@a@bマゴット「あれ以来　なんとなく\n\t息子の　うれしそうな顔が\n\t目に　うかぶんです。\n@c0@"
  ko: "@a@b마고트: 그 후로 불현듯\n아들이 기뻐하는 얼굴이\n눈앞에 떠오르곤 한답니다.\n@c0@"
  sl: "@a@b玛格特：那之后，\n　　我好像可以看到\n　　儿子开心的笑脸了呢。\n@c0@"
  tl: "@a@b瑪格特：那之後，\n　　我好像可以看到\n　　兒子開心的笑臉了呢。\n@c0@"
16:
  en: "@a@b%0%a000120 looks at the grave in front of %A0120%Xhim%Z%B0120%Xher%Z.\n@c0@"
  ja: "@a@b%a000120は　目の前の墓を　ながめた。\n@c0@"
  ko: "@a@b%a000120%F0120%X는%Y은%Z 눈앞의 무덤을 바라보았다.\n@c0@"
  sl: "@a@b%a000120凝视着眼前的坟墓。\n@c0@"
  tl: "@a@b%a000120凝視著眼前的墳墓。\n@c0@"
17:
  en: "@a@bA glittering badge of courage rests on the headstone.\n@c0@"
  ja: "@a@b墓石に　かざられた　勇気のバッジが\nキラキラと　かがやいている。\n@c0@"
  ko: "@a@b묘비에 장식된 용기의 배지가\n반짝반짝 빛나고 있다.\n@c0@"
  sl: "@a@b装饰在墓碑前的\n勇气徽章熠熠夺目。\n@c0@"
  tl: "@a@b裝飾在墓碑前的\n勇氣徽章熠熠奪目。\n@c0@"
18:
  en: "@a@b*: Welcome to Haggleton. We've held two bazaars in a single year — things were crazy around here for a while there!\n@c0@"
  ja: "@a@b＊「ようこそ　マルシェの町に。\n\t今年は　２回も　バザーが開かれて\n\tあわただしかったわ。\n@c0@"
  ko: "@a@b*: 마르셰 마을에 어서 와.\n올해는 2번이나 장이 열려서\n정신이 없었어.\n@c0@"
  sl: "@a@b＊：欢迎来到玛尔谢镇。\n　　今年举办了两次集市，\n　　好忙啊。\n@c0@"
  tl: "@a@b＊：歡迎來到瑪爾謝鎮。\n　　今年舉辦了兩次集市，\n　　好忙啊。\n@c0@"
19:
  en: "@a@b*: Funny how empty the place feels now that it's all over...\n@c0@"
  ja: "@a@b＊「でも　終わってしまうと\n\tさみしいのよね。\n@c0@"
  ko: "@a@b*: 하지만 끝나고 나니\n아쉽네.\n@c0@"
  sl: "@a@b＊：不过这些都结束之后，\n　　还真是有些寂寞呢。\n@c0@"
  tl: "@a@b＊：不過這些都結束之後，\n　　還真是有些寂寞呢。\n@c0@"
20:
  en: "@a@b*: I've decided I'm staying put. I don't need to go back home.\n@c0@"
  ja: "@a@b＊「今度こそ　もっと　いい場所を\n\tとるつもりです。\n@c0@"
  ko: "@a@b*: 다음번엔 꼭 좋은 장소를\n잡아 보려고 합니다.\n@c0@"
  sl: "@a@b＊：下次我一定要\n　　抢到一个更好的位置。\n@c0@"
  tl: "@a@b＊：下次我一定要\n　　搶到一個更好的位置。\n@c0@"
21:
  en: "@a@b*: I don't care if I have to sit outside until the next bazaar. I'll do whatever it takes to get a better spot!\n@c0@"
  ja: "@a@b＊「だから　地元へ　もどらずに\n\tここで　暮らすことにしました！\n@c0@"
  ko: "@a@b*: 그래서 고향으로 돌아가지도 않고\n여기서 살기로 했죠!\n@c0@"
  sl: "@a@b＊：所以我没回老家，\n　　在这里住了下来！\n@c0@"
  tl: "@a@b＊：所以我沒回老家，\n　　在這裡住了下來！\n@c0@"
22:
  en: "@a@b*: This town gets downright sleepy once everything closes up, eh?\n@c0@"
  ja: "@a@b＊「バザーが　終わると　この町も\n\tとたんに　さみしくなるのう。\n@c0@"
  ko: "@a@b*: 장이 파하니 이 마을도\n바로 적막해지는구먼.\n@c0@"
  sl: "@a@b＊：集市一结束，这个镇子\n　　马上就冷清下来了啊。\n@c0@"
  tl: "@a@b＊：集市一結束，這個鎮子\n　　馬上就冷清下來了啊。\n@c0@"
23:
  en: "@a@b*: I heard some bizarre news from the most recent bazaar. Bill finally beat Buck in the sales stakes!\n@c0@"
  ja: "@a@b＊「この前のバザーで　とうとう\n\tボガが　お兄さんのドガを\n\tこえたんですって。\n@c0@"
  ko: "@a@b*: 요전에 장이 섰을 때 드디어\n보가가 형인 드가를\n뛰어넘었대요.\n@c0@"
  sl: "@a@b＊：之前的集市上，\n　　据说博珈终于超越了\n　　他哥哥德珈呢。\n@c0@"
  tl: "@a@b＊：之前的集市上，\n　　據說博珈終於超越了\n　　他哥哥德珈呢。\n@c0@"
24:
  en: "@aBuck@bAgh! You won this round, Bill! Oh, why has the Goddess forsaken me?\n@c0@"
  ja: "@a@bドガ「くくっ　ボガよ……　今回は\n\tおまえの勝ちってことに\n\tしといてやろう！\n@c0@"
  ko: "@a@b드가: 크윽, 보가...... 이번엔\n네가 이긴 걸로\n해 두지!\n@c0@"
  sl: "@a@b德珈：呜呜，博珈啊……\n　　这次就算你赢了！\n@c0@"
  tl: "@a@b德珈：嗚嗚，博珈啊……\n　　這次就算你贏了！\n@c0@"
25:
  en: "@aBuck@bYou just watch, though. Next time, all your customers will be mine! \n@c0@"
  ja: "@a@bドガ「だが　次は負けねえぜ！\n@c0@"
  ko: "@a@b드가: 하지만 다음엔 그렇게 안 될걸!\n@c0@"
  sl: "@a@b德珈：但是下次我不会再输了！\n@c0@"
  tl: "@a@b德珈：但是下次我不會再輸了！\n@c0@"
26:
  en: "@aBill@bI did it...㈢ I finally took in more money than Buck...!\n@c0@"
  ja: "@a@bボガ「ついに……㈢ついに　私は\n\tドガ兄さんを　こえました！\n@c0@"
  ko: "@a@b보가: 드디어......㈢드디어 저는\n드가 형을 뛰어넘었습니다!\n@c0@"
  sl: "@a@b博珈：终于……㈢我终于\n　　超越了德珈大哥！\n@c0@"
  tl: "@a@b博珈：終於……㈢我終於\n　　超越了德珈大哥！\n@c0@"
27:
  en: "@aBill@bBut now my brother's going to fight extra dirty at the next bazaar. I'll really have to step things up!\n@c0@"
  ja: "@a@bボガ「でも　ドガ兄さんは\n\tこれで　終わるような男じゃない。\n\t私も　さらに　努力しなくては！\n@c0@"
  ko: "@a@b보가: 하지만 드가 형은\n이걸로 끝낼 남자가 아닙니다.\n저도 더 노력할 겁니다!\n@c0@"
  sl: "@a@b博珈：但是德珈大哥这个人\n　　是不会止步于此的。\n　　我也要更加努力才行！\n@c0@"
  tl: "@a@b博珈：但是德珈大哥這個人\n　　是不會止步於此的。\n　　我也要更加努力才行！\n@c0@"
28:
  en: "@a@b*: The world's at peace, huh? Sure don't seem too peaceful to me...\n@c0@"
  ja: "@a@b＊「なんだかさ　世界平和って\n\tカンジじゃ　なくなってきたな。\n@c0@"
  ko: "@a@b*: 왠지 세계가 평화로워졌다는\n느낌이 안 들어.\n@c0@"
  sl: "@a@b＊：不知怎么的，我感觉不到\n　　世界变得和平了呢。\n@c0@"
  tl: "@a@b＊：不知怎麼的，我感覺不到\n　　世界變得和平了呢。\n@c0@"
29:
  en: "@a@b*: Monster sightings are way up, and sales are way down. Same ol', same ol'.\n@c0@"
  ja: "@a@b＊「まものの気配は\n\tいっこうに　消えないしさ。\n\tだから　客足も　のびないし……\n@c0@"
  ko: "@a@b*: 마물의 기운은\n전혀 사라지지 않고 있지.\n그래서 손님도 뜸하고......\n@c0@"
  sl: "@a@b＊：魔物的气息\n　　一点都没有减弱啊。\n　　客人也没有增加……\n@c0@"
  tl: "@a@b＊：魔物的氣息\n　　一點都沒有減弱啊。\n　　客人也沒有增加……\n@c0@"
30:
  en: "@a@b*: The last bazaar didn't even come to a proper close. It just sort of petered out.\n@c0@"
  ja: "@a@b＊「バザーは　自然に\n\t終わってしまったよ。\n@c0@"
  ko: "@a@b*: 장도 자연스럽게\n파해 버렸다구.\n@c0@"
  sl: "@a@b＊：集市很自然地\n　　就结束了。\n@c0@"
  tl: "@a@b＊：集市很自然地\n　　就結束了。\n@c0@"
31:
  en: "@a@b*: Welcome, welcome, welcome! I'm having a closing sale, and everything must go!\n@c0@"
  ja: "@a@b＊「へい　らっしゃい！\n\tもう　バザーも　終わって\n\t店じまいセールだよ！\n@c0@"
  ko: "@a@b*: 어서 오슈!\n이제 장도 파했으니\n폐점 세일이야!\n@c0@"
  sl: "@a@b＊：欢迎欢迎！\n　　集市已经结束了，\n　　清仓大甩卖啦！\n@c0@"
  tl: "@a@b＊：歡迎歡迎！\n　　集市已經結束了，\n　　清倉大拍賣啦！\n@c0@"
32:
