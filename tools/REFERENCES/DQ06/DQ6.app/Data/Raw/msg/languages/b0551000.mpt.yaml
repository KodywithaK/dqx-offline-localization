  sl: "@a@b%a002050：即使没有小徽章，\n　　也要时不时\n　　来看看徽章王哦！\n@c0@"
  tl: "@a@b%a002050：即使沒有小徽章，\n　　也要時不時\n　　來看看徽章王哦！\n@c0@"
