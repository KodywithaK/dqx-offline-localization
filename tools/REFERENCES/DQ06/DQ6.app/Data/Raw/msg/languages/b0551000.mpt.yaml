  sl: "@a@b%a002050：以后不用再\n　　收集小徽章了啊……\n　　哎呀，真是感慨万千啊。\n@c0@"
  tl: "@a@b%a002050：以後不用再\n　　收集小徽章了啊……\n　　哎呀，真是感慨萬千啊。\n@c0@"
74:
