  ja: "@a@b%a002030「これからも　お元気で\n\tちいさなメダルに　かこまれた\n\tくらしを　続けてほしいですね。\n@c0@"
  ko: "@a@b%a002030: 앞으로도 건강한 모습으로\n작은 메달에 둘러싸여\n잘 지내 주셨으면 좋겠습니다.\n@c0@"
  sl: "@a@b%a002030：真希望他今后能\n　　坐拥这么多小徽章，\n　　舒舒服服过日子呢。\n@c0@"
