0:
  en: "@a%0%a002000@bFolks around here seem very chatty. Let's see if they have anything worthwhile to say, aye?\n@c0@"
  ja: "@a@b%a002000「せっかく　来たんだ。\n\tいろいろな人に\n\t話を　聞いてみるか。\n@c0@"
  ko: "@a@b%a002000: 모처럼 왔으니\n여러 사람들한테\n이야기를 들어 보자고.\n@c0@"
  sl: "@a@b%a002000：好不容易来一趟，\n　　跟大家多说说话吧。\n@c0@"
  tl: "@a@b%a002000：好不容易來一趟，\n　　跟大家多說說話吧。\n@c0@"
1:
  en: "@a%0%a002010@bOh my! The news has reached here as well!\n@c0@"
  ja: "@a@b%a002010「あら。\n\tもう　この町にも\n\tつたわっているのね。\n@c0@"
  ko: "@a@b%a002010: 어머나.\n벌써 이 마을에도\n전해졌구나.\n@c0@"
  sl: "@a@b%a002010：哎呀。消息也已经\n　　传到这个镇子里来了呢。\n@c0@"
  tl: "@a@b%a002010：哎呀。消息也已經\n　　傳到這個鎮子裡來了呢。\n@c0@"
2:
  en: "@a%0%a002020@bWow! Rumours travel faster than the speed of Zoom sometimes!\n@c0@"
  ja: "@a@b%a002020「ウワサの　スピードって\n\tひょっとしたら　ルーラより\n\t早いんじゃない？\n@c0@"
  ko: "@a@b%a002020: 소문이 퍼지는 속도는\n혹시 루라보다\n더 빠른 거 아냐?\n@c0@"
  sl: "@a@b%a002020：消息传播的速度，\n　　难道比鲁拉还快？\n@c0@"
  tl: "@a@b%a002020：消息傳播的速度，\n　　難道比魯拉還快？\n@c0@"
3:
  en: "@a%0%a002030@bGood news travels fast it seems. But for some reason, bad news always seems to travel faster...\n@c0@"
  ja: "@a@b%a002030「こういう　よい　ウワサで\n\tこの　速さですから　悪いウワサなら\n\tあっという間に　つたわりますね。\n@c0@"
  ko: "@a@b%a002030: 이런 좋은 소문이\n이렇게 빨리 퍼졌으니 나쁜 소문은\n눈 깜짝할 사이에 퍼지겠군요.\n@c0@"
  sl: "@a@b%a002030：这种好消息能这么快传来，\n　　要是坏消息的话，\n　　应该会传得更迅速吧。\n@c0@"
  tl: "@a@b%a002030：這種好消息能這麼快傳來，\n　　要是壞消息的話，\n　　應該會傳得更迅速吧。\n@c0@"
4:
  en: "@a%0%a002050@bIf the water's as pure as they say, it'd be a shame not to go for a quick dip.\n@c0@"
  ja: "@a@b%a002050「せっかく　こんなに\n\tきれいな川が　あるんですから\n\tみなさん　泳ぎませんか？\n@c0@"
  ko: "@a@b%a002050: 여러분 이렇게 맑은\n강은 어디 가서 보기 힘든데\n수영하고 가시면 어떨까요?\n@c0@"
  sl: "@a@b%a002050：难得有条这么干净清澈的河，\n　　大家不去游泳么？\n@c0@"
  tl: "@a@b%a002050：難得有條這麼乾淨清澈的河，\n　　大家不去游泳麼？\n@c0@"
5:
  en: "@a%0%a002050@bI mean, I can't swim, but I'd be happy to mind your stuff while you go for a paddle.\n@c0@"
  ja: "@a@b%a002050「私は　泳げないので\n\t荷物の　ばんをしてますから。\n@c0@"
  ko: "@a@b%a002050: 저는 수영을 못하니\n짐을 지키고 있겠습니다.\n@c0@"
  sl: "@a@b%a002050：我不会游泳，\n　　所以帮大家看包就好了。\n@c0@"
  tl: "@a@b%a002050：我不會游泳，\n　　所以幫大家看包就好了。\n@c0@"
6:
  en: "@a%0%a002000@bI'm already beautiful 'n' healthy 'n' everythin' like that. What more could this water do for me?\n@c0@"
  ja: "@a@b%a002000「水が　きれいだと\n\tカラダも　心も　けんこうで\n\tいられるってことだな。\n@c0@"
  ko: "@a@b%a002000: 물이 깨끗하면\n몸도 마음도 건강하게\n지낼 수 있다는 뜻이겠지.\n@c0@"
  sl: "@a@b%a002000：水这么干净，\n　　身心也能保持健康吧。\n@c0@"
  tl: "@a@b%a002000：水這麼乾淨，\n　　身心也能保持健康吧。\n@c0@"
7:
  en: "@a%0%a002010@bThis really is a lovely town, isn't it?\n@c0@"
  ja: "@a@b%a002010「本当に　この町は\n\tすてきよね。\n@c0@"
  ko: "@a@b%a002010: 이 마을은 정말\n멋지네.\n@c0@"
  sl: "@a@b%a002010：这个镇子\n　　真的很漂亮啊。\n@c0@"
  tl: "@a@b%a002010：這個鎮子\n　　真的很漂亮啊。\n@c0@"
8:
  en: "@a%0%a002020@bHere's hoping the water and everyone around it stay pure forever. I'll drink to that!\n@c0@"
  ja: "@a@b%a002020「水も　町の人の心も\n\tいつまでも　清らかで\n\tいてほしいわね。\n@c0@"
  ko: "@a@b%a002020: 물도 마을 사람들의 마음도\n언제까지나 맑았으면\n좋겠어.\n@c0@"
  sl: "@a@b%a002020：要是镇上人们的心灵\n　　能永远和这水一样纯洁美丽\n　　就好了。\n@c0@"
  tl: "@a@b%a002020：要是鎮上人們的心靈\n　　能永遠和這水一樣純潔美麗\n　　就好了。\n@c0@"
9:
  en: "@a%0%a002030@bThe people in this town seem to be earnest and pure at heart. I think I'm going to like it here.\n@c0@"
  ja: "@a@b%a002030「この村の人とは\n\t話が　あいそうです。\n@c0@"
  ko: "@a@b%a002030: 이 마을 사람들과는\n말이 통할 것 같습니다.\n@c0@"
  sl: "@a@b%a002030：跟这个村的人\n　　应该能聊得来吧。\n@c0@"
  tl: "@a@b%a002030：跟這個村的人\n　　應該能聊得來吧。\n@c0@"
10:
  en: "@a%0%a002050@bIf I don't get the good folks back in Scrimsley some crackin' souvenirs, I'll never hear the end of it!\n@c0@"
  ja: "@a@b%a002050「せっかく　来たんですから\n\tおみやげに　アモールの水を\n\t持って　帰りたいですね。\n@c0@"
  ko: "@a@b%a002050: 여기까지 온 김에\n선물로 아모르의 물을\n가지고 돌아가고 싶군요.\n@c0@"
  sl: "@a@b%a002050：难得来一趟，\n　　弄点爱摩尔之水\n　　当特产带回去吧。\n@c0@"
  tl: "@a@b%a002050：難得來一趟，\n　　弄點愛摩爾之水\n　　當特產帶回去吧。\n@c0@"
11:
  en: "@a%0%a002050@bLet me think... There's the priest, the innkeeper, then obviously there's that lass... And not forgettin'...\n@c0@"
  ja: "@a@b%a002050「えっと　神父さまに\n\t宿屋の　ご主人に……\n\tそれから　それから……\n@c0@"
  ko: "@a@b%a002050: 어디 보자, 신부님이랑\n여관 주인이랑......\n그리고 또......\n@c0@"
  sl: "@a@b%a002050：嗯……\n　　要带给神父大人、旅店老板……\n　　还有……还有……　　\n@c0@"
  tl: "@a@b%a002050：嗯……\n　　要帶給神父大人、旅店老闆……\n　　還有……還有……　　\n@c0@"
12:
  en: "@a%0%a002050@b...I'm all in a tizzy! I can't be spendin' all my gold coins on souvenirs! They'll have to make do with my tales!\n@c0@"
  ja: "@a@b%a002050「ああ　いけません！\n\tおミヤゲ代で　こづかいが\n\tぜんぶ　なくなりそうです……。\n@c0@"
  ko: "@a@b%a002050: 아, 안 되겠어요!\n용돈이 선물 값으로\n다 나가게 생겼네요......\n@c0@"
  sl: "@a@b%a002050：啊，糟了！\n　　钱不够买这么多特产……\n@c0@"
  tl: "@a@b%a002050：啊，糟了！\n　　錢不夠買這麼多特產……\n@c0@"
13:
  en: "@a%0%a002000@bIt brings back painful memories of that time Murdaw clobbered us. ...No! I'm not goin' to think about it!\n@c0@"
  ja: "@a@b%a002000「うーん……。\n\tムドーに　やられちまった　なんて\n\tいってほしくないけどな……。\n@c0@"
  ko: "@a@b%a002000: 으음......\n무도한테 당했다는 얘긴\n안 해 줬으면 좋겠는데......\n@c0@"
  sl: "@a@b%a002000：唔……\n　　能不能别用“被姆多干掉了”\n　　这种说法……\n@c0@"
  tl: "@a@b%a002000：唔……\n　　能不能別用“被姆多幹掉了”\n　　這種說法……\n@c0@"
14:
  en: "@a%0%a002010@bWell, he's right about the look-alike part. To a certain extent, anyway.\n@c0@"
  ja: "@a@b%a002010「王子さまに\n\t似ている　というところまでは\n\tあっているわね。\n@c0@"
  ko: "@a@b%a002010: 왕자님을\n닮았다는 것까지는\n맞았네.\n@c0@"
  sl: "@a@b%a002010：跟王子殿下长得很像，\n　　这一点倒是说对了呢。\n@c0@"
  tl: "@a@b%a002010：跟王子殿下長得很像，\n　　這一點倒是說對了呢。\n@c0@"
15:
  en: "@a%0%a002020@bI'm sure the Prince is alive and well. I just know it!\n@c0@"
  ja: "@a@b%a002020「王子さまは\n\tきっと　生きているもんね。\n\t気にしない　気にしない！\n@c0@"
  ko: "@a@b%a002020: 왕자님은\n틀림없이 살아 있을 거야.\n신경 쓰지 마!\n@c0@"
  sl: "@a@b%a002020：王子殿下\n　　一定还活着！\n　　别担心别担心！\n@c0@"
  tl: "@a@b%a002020：王子殿下\n　　一定還活著！\n　　別擔心別擔心！\n@c0@"
16:
  en: "@a%0%a002030@bI have absolute faith that we will solve the mystery of %a000090 and the Prince. But for now, we must be patient.\n@c0@"
  ja: "@a@b%a002030「いつかは\n\t%a000090さんと　王子のナゾも\n\tときあかせる　ことでしょう。\n@c0@"
  ko: "@a@b%a002030: 언젠가는\n%a000090 님과 왕자의 수수께끼도\n풀릴 겁니다.\n@c0@"
  sl: "@a@b%a002030：总有一天，\n　　%a000090和王子之谜\n　　会解开的吧。\n@c0@"
  tl: "@a@b%a002030：總有一天，\n　　%a000090和王子之謎\n　　會解開的吧。\n@c0@"
17:
  en: "@a%0%a002050@bHe's got the story all mixed up! The Prince wasn't beaten by Murdaw! Least, I don't think he was!\n@c0@"
  ja: "@a@b%a002050「王子さまは\n\tやられてませんって！\n@c0@"
  ko: "@a@b%a002050: 왕자님은\n당한 게 아니라니까요!\n@c0@"
  sl: "@a@b%a002050：王子殿下还活着呢！\n@c0@"
  tl: "@a@b%a002050：王子殿下還活著呢！\n@c0@"
18:
  en: "@a%0%a002010@bI can imagine her mother's consternation too. I hope she gives her husband an extra elbowing from me!\n@c0@"
  ja: "@a@b%a002010「うふふ。　なんだか\n\tその様子が　目に浮かぶわね。\n@c0@"
  ko: "@a@b%a002010: 우후훗. 왠지\n그 모습이 상상되는걸.\n@c0@"
  sl: "@a@b%a002010：呵呵。\n　　这场景真是栩栩如生呢。\n@c0@"
  tl: "@a@b%a002010：呵呵。\n　　這場景真是栩栩如生呢。\n@c0@"
19:
  en: "@a%0%a002020@bI think the sky really has gotten prettier since Murdaw's defeat. Is that even possible?\n@c0@"
  ja: "@a@b%a002020「ムドーが　倒れたあとは\n\t本当に　空も　きれいになった\n\t気がするわね。\n@c0@"
  ko: "@a@b%a002020: 무도가 쓰러진 뒤에는\n하늘도 정말 깨끗해진\n느낌이 드네.\n@c0@"
  sl: "@a@b%a002020：姆多被打倒后，\n　　真的感觉连空气\n　　都变得清新起来了呢。\n@c0@"
  tl: "@a@b%a002020：姆多被打倒後，\n　　真的感覺連空氣\n　　都變得清新起來了呢。\n@c0@"
20:
  en: "@a%0%a002030@bI pray that her mother and father are resting in peace and domestic harmony...\n@c0@"
  ja: "@a@b%a002030「おじいさまと　おばあさまの\n\tごめいふくを　おいのりします。\n@c0@"
  ko: "@a@b%a002030: 할아버님과 할머님의\n명복을 빕니다.\n@c0@"
  sl: "@a@b%a002030：为您的公公婆婆祈福。\n@c0@"
  tl: "@a@b%a002030：為您的公公婆婆祈福。\n@c0@"
21:
  en: "@a%0%a002050@bSo let me get this straight — her old man's up in heaven, but he's still gettin' grief from the missus?\n@c0@"
  ja: "@a@b%a002050「こちらの　おじいさんは\n\t天国に　行っても　おばあさんに\n\tおこられてるんですね。\n@c0@"
  ko: "@a@b%a002050: 이 댁 할아버지는\n천국에 가서도 할머니한테\n혼나는 모양이네요.\n@c0@"
  sl: "@a@b%a002050：这家爷爷即使上了天堂，\n　　也会惹奶奶生气呢。\n@c0@"
  tl: "@a@b%a002050：這家爺爺即使上了天堂，\n　　也會惹奶奶生氣呢。\n@c0@"
22:
  en: "@a%0%a002050@bThat don't sound much like heaven to old %a002050!\n@c0@"
  ja: "@a@b%a002050「でも　それって\n\t天国とは　言えないですね……。\n@c0@"
  ko: "@a@b%a002050: 근데 그거\n천국이라고 할 수 없는 거 아닐지......\n@c0@"
  sl: "@a@b%a002050：惹奶奶生气了的话，\n　　天堂也变地狱了吧……\n@c0@"
  tl: "@a@b%a002050：惹奶奶生氣了的話，\n　　天堂也變地獄了吧……\n@c0@"
23:
  en: "@a%0%a002000@bThe heroes who defeated Murdaw!? Passin' through this very town!? Well, how about that!\n@c0@"
  ja: "@a@b%a002000「うははっ　勇者かよ！\n\tあんまり　持ちあげられると\n\tさすがに　テレるぜ！\n@c0@"
  ko: "@a@b%a002000: 우하핫, 용사라니!\n너무 띄워 주면\n나도 부끄럽다고!\n@c0@"
  sl: "@a@b%a002000：啊哈哈，勇者！\n　　这么吹捧咱的话，\n　　俺都不好意思了！\n@c0@"
  tl: "@a@b%a002000：啊哈哈，勇者！\n　　這麼吹捧咱的話，\n　　俺都不好意思了！\n@c0@"
24:
  en: "@a%0%a002010@bHow about that indeed! This gentleman clearly doesn't have a good memory for faces.\n@c0@"
  ja: "@a@b%a002010「うふふ　いまも\n\t気づいてないみたいね。\n@c0@"
  ko: "@a@b%a002010: 우후훗, 지금도\n모르시는 것 같은걸?\n@c0@"
  sl: "@a@b%a002010：呵呵，\n　　现在都还没有察觉过来呢。\n@c0@"
  tl: "@a@b%a002010：呵呵，\n　　現在都還沒有察覺過來呢。\n@c0@"
25:
  en: "@a%0%a002020@bTee hee! You think he'll beg me for an autograph if I tell him it was us?\n@c0@"
  ja: "@a@b%a002020「えへへ。　それが\n\tあたしたちだって　わかったら\n\tサインねだられるかな。\n@c0@"
  ko: "@a@b%a002020: 에헤헷. 그게\n우리라는 걸 알면\n사인이라도 받으려고 하려나?\n@c0@"
  sl: "@a@b%a002020：诶嘿嘿。\n　　要是知道是我们的话，\n　　会不会找我们要签名呢？\n@c0@"
  tl: "@a@b%a002020：誒嘿嘿。\n　　要是知道是我們的話，\n　　會不會找我們要簽名呢？\n@c0@"
26:
  en: "@a%0%a002030@bThe gentleman may be referring to us, but I think it's best not to embarrass him about it.\n@c0@"
  ja: "@a@b%a002030「もしかして\n\t私たちの　ことでしょうか？\n@c0@"
  ko: "@a@b%a002030: 혹시\n우리 얘긴가요?\n@c0@"
  sl: "@a@b%a002030：难不成\n　　说的是我们？\n@c0@"
  tl: "@a@b%a002030：難不成\n　　說的是我們？\n@c0@"
27:
  en: "@a%0%a002050@bIt seems you're becomin' somethin' of a legend in your own lifetime, %a000090!\n@c0@"
  ja: "@a@b%a002050「%a000090さんは\n\tここでは　もはや\n\t伝説の人　みたいですね！\n@c0@"
  ko: "@a@b%a002050: %a000090 님은\n여기서는\n전설의 인물인가 보네요!\n@c0@"
  sl: "@a@b%a002050：%a000090在这里\n　　已经成为传说中的人物了呢！\n@c0@"
  tl: "@a@b%a002050：%a000090在這裡\n　　已經成為傳說中的人物了呢！\n@c0@"
28:
  en: "@a%0%a002050@bThey'll be sellin' wood-carvings and jerkins with your face on 'em before long!\n@c0@"
  ja: "@a@b%a002050「そのうち　勇者せんべい\n\t勇者人形　なんてグッズも\n\t売られるんじゃないでしょうか。\n@c0@"
  ko: "@a@b%a002050: 조만간 용사 과자나\n용사 인형 같은 상품들이\n팔리는 거 아닐까요?\n@c0@"
  sl: "@a@b%a002050：以后会不会有人卖\n　　勇者仙贝、勇者玩偶\n　　这种东西呢？\n@c0@"
  tl: "@a@b%a002050：以後會不會有人賣\n　　勇者仙貝、勇者玩偶\n　　這種東西呢？\n@c0@"
29:
  en: "@a%0%a002000@bProbably best just to smile and nod along with the ol' fella.\n@c0@"
  ja: "@a@b%a002000「なんか\n\t調子くるうぜ……。\n@c0@"
  ko: "@a@b%a002000: 뭐야,\n상태 안 좋네......\n@c0@"
  sl: "@a@b%a002000：总觉得\n　　这人哪里不对……\n@c0@"
  tl: "@a@b%a002000：總覺得\n　　這人哪裡不對……\n@c0@"
30:
  en: "@a%0%a002010@bHee hee. This old gentleman never fails to make me smile!\n@c0@"
  ja: "@a@b%a002010「うふふ\n\tおもしろい　おじいさんね。\n@c0@"
  ko: "@a@b%a002010: 우후훗.\n재미있는 할아버지네.\n@c0@"
  sl: "@a@b%a002010：呵呵，\n　　这老爷爷真有意思。\n@c0@"
  tl: "@a@b%a002010：呵呵，\n　　這老爺爺真有意思。\n@c0@"
31:
