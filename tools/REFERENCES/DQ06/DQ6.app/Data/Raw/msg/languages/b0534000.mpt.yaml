65:
  en: "@a%0%a002010@bWe've come all this way — it'd be a real shame to leave without saying hello to Ilya and Evgenya.\n@c0@"
  ja: "@a@b%a002010「せっかくだから\n\tふたりに　会っていきましょうよ。\n@c0@"
  ko: "@a@b%a002010: 여기까지 왔으니까\n두 분을 만나고 가자.\n@c0@"
  sl: "@a@b%a002010：趁这个难得的机会，\n　　去拜访一下他们吧。\n@c0@"
  tl: "@a@b%a002010：趁這個難得的機會，\n　　去拜訪一下他們吧。\n@c0@"
66:
  en: "@a%0%a002020@bI bet we'll find those two inside the church.\n@c0@"
  ja: "@a@b%a002020「ふたりには\n\t教会に　いけば　会えるよね！\n@c0@"
  ko: "@a@b%a002020: 두 사람을 만나려면\n성당으로 가면 될 거야!\n@c0@"
  sl: "@a@b%a002020：去教会的话，\n　　就能见到他们！\n@c0@"
  tl: "@a@b%a002020：去教會的話，\n　　就能見到他們！\n@c0@"
67:
  en: "@a%0%a002030@bI confess that I am intrigued by this couple. I would dearly like to meet them both.\n@c0@"
  ja: "@a@b%a002030「私も　その　おふたりに\n\t会ってみたく　なりました。\n@c0@"
  ko: "@a@b%a002030: 저도 그 두 분을\n만나고 싶어졌습니다.\n@c0@"
  sl: "@a@b%a002030：我也想见见他们呢。\n@c0@"
  tl: "@a@b%a002030：我也想見見他們呢。\n@c0@"
68:
  en: "@a%0%a002050@bI wonder if these folks have any spare happiness they could share with old %a002050?\n@c0@"
  ja: "@a@b%a002050「私も　しあわせを\n\t分けてもらいたいです！\n@c0@"
  ko: "@a@b%a002050: 저한테도 행복을\n나눠 주시면 좋겠어요!\n@c0@"
  sl: "@a@b%a002050：真希望他们把幸福\n　　也分给我一点！\n@c0@"
  tl: "@a@b%a002050：真希望他們把幸福\n　　也分給我一點！\n@c0@"
69:
  en: "@a%0%a002000@bMaybe I'm turnin' into a softie, but they did seem pretty happy. Good luck to 'em!\n@c0@"
  ja: "@a@b%a002000「本当に　あのふたり\n\tしあわせそうだったな。\n@c0@"
  ko: "@a@b%a002000: 그 두 사람, 정말\n행복해 보이더군.\n@c0@"
  sl: "@a@b%a002000：那两人，\n　　看起来真是幸福啊。\n@c0@"
  tl: "@a@b%a002000：那兩人，\n　　看起來真是幸福啊。\n@c0@"
70:
  en: "@a%0%a002010@bJust one glimpse of their happily merged auras made me happy as well.\n@c0@"
  ja: "@a@b%a002010「私も　見ていて\n\tうれしくなっちゃったわ。\n@c0@"
  ko: "@a@b%a002010: 나도 보고 있으니\n참 기뻤어.\n@c0@"
  sl: "@a@b%a002010：光是看着，\n　　我都觉得开心了起来。\n@c0@"
  tl: "@a@b%a002010：光是看著，\n　　我都覺得開心了起來。\n@c0@"
71:
  en: "@a%0%a002020@bI sure hope I'm that happy when I'm their age.\n@c0@"
  ja: "@a@b%a002020「あたしも　年とったら\n\tあの　ふたりみたいに\n\tなりたいー！\n@c0@"
  ko: "@a@b%a002020: 나도 나이 들면\n그 두 사람처럼\n되고 싶어~!\n@c0@"
  sl: "@a@b%a002020：等我老了之后，\n　　也想像他们两人一样！\n@c0@"
  tl: "@a@b%a002020：等我老了之後，\n　　也想像他們兩人一樣！\n@c0@"
72:
  en: "@a%0%a002030@bIt was indeed a pleasure to make that couple's acquaintance. It is rare to see such untainted joy!\n@c0@"
  ja: "@a@b%a002030「あれほど\n\tしあわせそうな　人たちは\n\tなかなか　いませんよね。\n@c0@"
  ko: "@a@b%a002030: 그렇게\n행복해 보이는 사람들은\n잘 없죠.\n@c0@"
  sl: "@a@b%a002030：还没有见过\n　　像他们这么幸福的人呢。\n@c0@"
  tl: "@a@b%a002030：還沒有見過\n　　像他們這麼幸福的人呢。\n@c0@"
73:
  en: "@a%0%a002050@bThere were more than a few tears in my eyes after seeing that old couple. Now that's love, I tell you!\n@c0@"
  ja: "@a@b%a002050「私　おふたりを　見て\n\t心が　なごみましたねー。\n@c0@"
  ko: "@a@b%a002050: 그 두 분을 보니\n마음이 따뜻해졌어요~ \n@c0@"
  sl: "@a@b%a002050：看着他们两人，\n　　我的心都被治愈了。\n@c0@"
  tl: "@a@b%a002050：看著他們兩人，\n　　我的心都被治癒了。\n@c0@"
74:
  en: "@a%0%a002000@bI'll bet her old man doesn't know how to handle a bad-tempered beastie, eh?\n@c0@"
  ja: "@a@b%a002000「まあ　すくなくとも\n\tオレよりは　物知りだろうな。\n@c0@"
  ko: "@a@b%a002000: 뭐, 적어도\n나보다는 똑똑하겠지.\n@c0@"
  sl: "@a@b%a002000：唉，至少比俺知道得多吧。\n@c0@"
  tl: "@a@b%a002000：唉，至少比俺知道得多吧。\n@c0@"
75:
  en: "@a%0%a002010@bShe should aim to be just like her father. The world needs more female scholars!\n@c0@"
  ja: "@a@b%a002010「あなたも　パパみたいに\n\t物知りに　なれるわよ　きっと！\n@c0@"
  ko: "@a@b%a002010: 너도 아빠처럼\n똑똑한 사람이 될 수 있을 거야! 그럼!\n@c0@"
  sl: "@a@b%a002010：你也一定能像你父亲一样，\n　　变成一个万事通哦！\n@c0@"
  tl: "@a@b%a002010：你也一定能像你父親一樣，\n　　變成一個萬事通哦！\n@c0@"
76:
  en: "@a%0%a002020@bGuess her dad must read a book a day or something.\n@c0@"
  ja: "@a@b%a002020「パパさんは　たくさんの\n\t本を　読んでいるんでしょうね。\n@c0@"
  ko: "@a@b%a002020: 얘 아빠는 책을\n많이 읽나 보네.\n@c0@"
  sl: "@a@b%a002020：她的爸爸肯定\n　　读过很多书吧。\n@c0@"
  tl: "@a@b%a002020：她的爸爸肯定\n　　讀過很多書吧。\n@c0@"
77:
  en: "@a%0%a002030@bIt is right and proper that this girl admires her father. But I doubt he is as well-read as me!\n@c0@"
  ja: "@a@b%a002030「おとうさんが　子どもから\n\tそんけいされてるのって\n\tなんだか　すてきですね。\n@c0@"
  ko: "@a@b%a002030: 아버지가 아이로부터\n존경받는다는 건\n상당히 멋진 일이군요.\n@c0@"
  sl: "@a@b%a002030：父亲受到孩子的尊敬，\n　　这真是一件幸事啊。\n@c0@"
  tl: "@a@b%a002030：父親受到孩子的尊敬，\n　　這真是一件幸事啊。\n@c0@"
78:
  en: "@a%0%a002050@bYou can tell just by lookin' at her old man that he knows a thing or two. I take my helmet off to him!\n@c0@"
  ja: "@a@b%a002050「ほんとに　見るからに\n\t物知りな　ひとのようですね。\n@c0@"
  ko: "@a@b%a002050: 정말 척 봐도\n똑똑한 사람 같아 보이네요.\n@c0@"
  sl: "@a@b%a002050：看上去的确是个\n　　无事不晓的人呢。\n@c0@"
  tl: "@a@b%a002050：看上去的確是個\n　　無事不曉的人呢。\n@c0@"
79:
  en: "@a%0%a002000@bEvgenya's room is right there near the stairs, aye?\n@c0@"
  ja: "@a@b%a002000「ジーナばあさんたちは\n\tたしか　この　おくの\n\t部屋だったよな。\n@c0@"
  ko: "@a@b%a002000: 지나 할머니네는\n분명 이 안쪽에 있는\n방이었지?\n@c0@"
  sl: "@a@b%a002000：吉娜婆婆他们\n　　应该是住在里面的房间吧。\n@c0@"
  tl: "@a@b%a002000：吉娜婆婆他們\n　　應該是住在裡面的房間吧。\n@c0@"
80:
  en: "@a%0%a002010@bLet's go and see them, then!\n@c0@"
  ja: "@a@b%a002010「さっそく　行きましょう！\n@c0@"
  ko: "@a@b%a002010: 어서 가 보자!\n@c0@"
  sl: "@a@b%a002010：快走吧！\n@c0@"
  tl: "@a@b%a002010：快走吧！\n@c0@"
81:
  en: "@a%0%a002020@bWouldn't hurt us to say hello, right?\n@c0@"
  ja: "@a@b%a002020「はーい！\n\tげんきな顔を　見せてくるね！\n@c0@"
  ko: "@a@b%a002020: 그래~!\n건강한 모습 보여주고 올게!\n@c0@"
  sl: "@a@b%a002020：好的！\n　　去见见她吧！\n@c0@"
  tl: "@a@b%a002020：好的！\n　　去見見她吧！\n@c0@"
82:
  en: "@a%0%a002030@bI am excited to finally meet this fabled couple.\n@c0@"
  ja: "@a@b%a002030「私も　お会いするのが\n\t楽しみですね。\n@c0@"
  ko: "@a@b%a002030: 저도 만나뵐 생각을 하니\n기대되는군요.\n@c0@"
  sl: "@a@b%a002030：我也期待着能见到她。\n@c0@"
  tl: "@a@b%a002030：我也期待著能見到她。\n@c0@"
83:
  en: "@a%0%a002050@bOld %a002050 tends to get a bit nervous meeting folks for the first time. I've nothin' stuck to my face, have I?\n@c0@"
  ja: "@a@b%a002050「私は　初対面ですね。\n\tしつれいの　ないようにしないと！\n@c0@"
  ko: "@a@b%a002050: 저는 처음 뵙는 분입니다.\n실례되는 일이 없도록 해야지!\n@c0@"
  sl: "@a@b%a002050：我跟她是第一次见面。\n　　一定要不失礼数才行。\n@c0@"
  tl: "@a@b%a002050：我跟她是第一次見面。\n　　一定要不失禮數才行。\n@c0@"
84:
  en: "@a%0%a002000@bAin't that the truth! She really was excited to see us!\n@c0@"
  ja: "@a@b%a002000「ジーナばあさん　本当に\n\tよろこんで　くれてたよな！\n@c0@"
  ko: "@a@b%a002000: 지나 할머니, 진심으로\n기뻐해 주더군!\n@c0@"
  sl: "@a@b%a002000：吉娜婆婆真的很开心吧！\n@c0@"
  tl: "@a@b%a002000：吉娜婆婆真的很開心吧！\n@c0@"
85:
  en: "@a%0%a002010@bI do hope the priest continues to take care of Ilya and Evgenya.\n@c0@"
  ja: "@a@b%a002010「ありがとう　神父さま。\n\tこれからも　おふたりを\n\tよろしく……。\n@c0@"
  ko: "@a@b%a002010: 고마워요, 신부님.\n앞으로도 두 분을\n잘 부탁해요......\n@c0@"
  sl: "@a@b%a002010：谢谢你，神父大人。\n　　今后他们两人就拜托你了……\n@c0@"
  tl: "@a@b%a002010：謝謝你，神父大人。\n　　今後他們兩人就拜託你了……\n@c0@"
86:
  en: "@a%0%a002020@bOoh, Evgenya's happiness is just so contagious!\n@c0@"
  ja: "@a@b%a002020「ジーナさんが　うれしいと\n\tあたしも　うれしくなっちゃうよ！\n@c0@"
  ko: "@a@b%a002020: 지나 씨가 기쁘면\n나도 기뻐!\n@c0@"
  sl: "@a@b%a002020：看到吉娜婆婆这么开心，\n　　我也觉得高兴呢！\n@c0@"
  tl: "@a@b%a002020：看到吉娜婆婆這麼開心，\n　　我也覺得高興呢！\n@c0@"
87:
  en: "@a%0%a002030@bI pray that the happy couple remain as deeply in love for the rest of their lives.\n@c0@"
  ja: "@a@b%a002030「おふたりに　とわの\n\tしあわせが　あらんことを\n\tお祈りします。\n@c0@"
  ko: "@a@b%a002030: 두 분께 영원한\n행복이 함께하기를\n기도합니다.\n@c0@"
  sl: "@a@b%a002030：祝愿他们\n　　能永远幸福美满。\n@c0@"
  tl: "@a@b%a002030：祝願他們\n　　能永遠幸福美滿。\n@c0@"
88:
  en: "@a%0%a002050@bMeetin' that pair brought a smile to my face and a tear to my eye!\n@c0@"
  ja: "@a@b%a002050「いやあ\n\tじつに　ほほえましい\n\tカップルでしたね！\n@c0@"
  ko: "@a@b%a002050: 이야,\n실로 흐뭇한\n한 쌍이군요!\n@c0@"
  sl: "@a@b%a002050：哎呀，看到他们在一起，\n　　我都不禁会露出笑容呢！\n@c0@"
  tl: "@a@b%a002050：哎呀，看到他們在一起，\n　　我都不禁會露出笑容呢！\n@c0@"
89:
  en: "@a%0%a002000@bThe ol' fella may be sound asleep, but he's still got plenty of guts and gusto!\n@c0@"
  ja: "@a@b%a002000「はやての　イリアは\n\tねてても　元気なようだな。\n@c0@"
  ko: "@a@b%a002000: 돌풍의 일리아는\n자고 있을 때도 건재한 것 같군.\n@c0@"
  sl: "@a@b%a002000：闪电伊利亚即使睡着了，\n　　也这么精力充沛呢。\n@c0@"
  tl: "@a@b%a002000：閃電伊利亞即使睡著了，\n　　也這麼精力充沛呢。\n@c0@"
90:
  en: "@a%0%a002010@bIt was thanks to these two that we were able to retrieve Ra's mirror and defeat Murdaw...\n@c0@"
  ja: "@a@b%a002010「ふたりの　おかげで\n\tラーの鏡を　手に入れ\n\tムドーを　倒せたのだから……\n@c0@"
  ko: "@a@b%a002010: 두 분 덕분에\n라의 거울을 얻어서\n무도를 쓰러뜨릴 수 있었으니......\n@c0@"
  sl: "@a@b%a002010：多亏了他们两位，\n　　我们才拿到了太阳神镜，\n　　顺利打倒了姆多。\n@c0@"
  tl: "@a@b%a002010：多虧了他們兩位，\n　　我們才拿到了太陽神鏡，\n　　順利打倒了姆多。\n@c0@"
91:
  en: "@a%0%a002010@bWe should let them know how grateful we are — the whole world owes them so much...\n@c0@"
  ja: "@a@b%a002010「私たちこそ\n\t世界中の人びとに　かわって\n\tかんしゃしなくちゃね。\n@c0@"
  ko: "@a@b%a002010: 우리야말로\n온 세상 사람들을 대신해서\n감사해야겠어.\n@c0@"
  sl: "@a@b%a002010：反倒是我们，\n　　必须要代表全世界的人们\n　　好好地感谢他们给予的帮助呢。\n@c0@"
  tl: "@a@b%a002010：反倒是我們，\n　　必須要代表全世界的人們\n　　好好地感謝他們給予的幫助呢。\n@c0@"
92:
  en: "@a%0%a002020@bAww... Seeing the two of them just warms my little heart.\n@c0@"
  ja: "@a@b%a002020「ふたりを　見ていると\n\t心が　あったかくなるわ。\n@c0@"
  ko: "@a@b%a002020: 두 사람을 보고 있으면\n마음이 따뜻해져.\n@c0@"
  sl: "@a@b%a002020：看着这两个人，\n　　我的心都变得温暖起来了。\n@c0@"
  tl: "@a@b%a002020：看著這兩個人，\n　　我的心都變得溫暖起來了。\n@c0@"
93:
  en: "@a%0%a002030@bRa's mirror did indeed prove indispensable.\n@c0@"
  ja: "@a@b%a002030「ラーの鏡は\n\t本当に　役立ちましたね。\n@c0@"
  ko: "@a@b%a002030: 라의 거울은\n큰 도움이 되었죠.\n@c0@"
  sl: "@a@b%a002030：太阳神镜\n　　真的发挥了很大作用。\n@c0@"
  tl: "@a@b%a002030：太陽神鏡\n　　真的發揮了很大作用。\n@c0@"
94:
  en: "@a%0%a002050@bHang about! Are you tellin' me this is THE Ilya the Tempest and Evgenya the Cyclone!?\n@c0@"
  ja: "@a@b%a002050「ええっ！？　この方たちって\n\tしっぷうのジーナさんに\n\tはやてのイリアさん　だったんですか！\n@c0@"
  ko: "@a@b%a002050: 네에!? 이분들이 바로\n질풍의 지나 씨와\n돌풍의 일리아 씨였나요!?\n@c0@"
  sl: "@a@b%a002050：诶？！这两个人就是\n　　疾风吉娜\n　　还有闪电伊利亚吗！\n@c0@"
  tl: "@a@b%a002050：誒？！這兩個人就是\n　　疾風吉娜\n　　還有閃電伊利亞嗎！\n@c0@"
95:
  en: "@a%0%a002050@bThey used to be my idols when I was a nipper! Pinch me! I think I'm dreamin'!\n@c0@"
  ja: "@a@b%a002050「私　むかしから\n\tあこがれていたんです！\n\tかんげきだなあ……。\n@c0@"
  ko: "@a@b%a002050: 저, 옛날부터\n완전 팬이었거든요.\n감격이네요.....\n@c0@"
  sl: "@a@b%a002050：我从很早以前开始\n　　就非常崇拜这两人！\n　　真是感慨万千啊……\n@c0@"
  tl: "@a@b%a002050：我從很早以前開始\n　　就非常崇拜這兩人！\n　　真是感慨萬千啊……\n@c0@"
96:
  en: "@a%0%a002000@bAye, we've been gettin' more gratitude than I know how to handle.\n@c0@"
  ja: "@a@b%a002000「てへへ\n\tそんなに　ほめるなよ。\n@c0@"
  ko: "@a@b%a002000: 헤헷,\n그렇게 띄워 주지 말라구.\n@c0@"
  sl: "@a@b%a002000：嘿嘿，\n　　别这样夸咱啊。\n@c0@"
  tl: "@a@b%a002000：嘿嘿，\n　　別這樣誇咱啊。\n@c0@"
97:
  en: "@a%0%a002000@bBut Evgenya deserves her fair share too! If it wasn't for her help, Murdaw would still be causin' trouble.\n@c0@"
  ja: "@a@b%a002000「魔王を　たおせたのは\n\tあんたたちの　おかげでも\n\tあるんだからさ。\n@c0@"
  ko: "@a@b%a002000: 마왕을 쓰러뜨린 건\n당신들 덕분이기도\n하니까 말이야.\n@c0@"
  sl: "@a@b%a002000：打倒魔王，\n　　也有你们的一份功劳啊。\n@c0@"
  tl: "@a@b%a002000：打倒魔王，\n　　也有你們的一份功勞啊。\n@c0@"
98:
  en: "@a%0%a002010@bIt was thanks to these two that we were able to retrieve Ra's mirror and defeat Murdaw...\n@c0@"
  ja: "@a@b%a002010「おふたりの　おかげで\n\tラーの鏡を　手に入れ\n\tムドーを　倒すことができました。\n@c0@"
  ko: "@a@b%a002010: 두 분 덕분에\n라의 거울을 얻어서\n무도를 쓰러뜨릴 수 있었어요.\n@c0@"
  sl: "@a@b%a002010：多亏了你们两人，\n　　我们才拿到了太阳神镜，\n　　顺利打倒了姆多。\n@c0@"
  tl: "@a@b%a002010：多虧了你們兩人，\n　　我們才拿到了太陽神鏡，\n　　順利打倒了姆多。\n@c0@"
99:
  en: "@a%0%a002010@bWe should let them know how grateful we are — the whole world owes them so much...\n@c0@"
  ja: "@a@b%a002010「私たちこそ\n\t世界中の人に　かわって\n\tかんしゃしますわ！\n@c0@"
  ko: "@a@b%a002010: 저희야말로\n온 세상 사람들을 대신해서\n감사드릴게요!\n@c0@"
  sl: "@a@b%a002010：反倒是我们，\n　　真是要代表全世界的人们\n　　好好地感谢你们给予我们的帮助！\n@c0@"
  tl: "@a@b%a002010：反倒是我們，\n　　真是要代表全世界的人們\n　　好好地感謝你們給予我們的幫助！\n@c0@"
100:
  en: "@a%0%a002020@bWe owe big thanks to Evgenya. Hope she takes care of herself. \n@c0@"
  ja: "@a@b%a002020「ありがとう　ジーナさん。\n\tこれからも　元気でね！\n@c0@"
  ko: "@a@b%a002020: 고마워, 지나 씨.\n앞으로도 건강해야 해!\n@c0@"
  sl: "@a@b%a002020：谢谢您，吉娜婆婆。\n　　今后也要保重身体哦！\n@c0@"
  tl: "@a@b%a002020：謝謝您，吉娜婆婆。\n　　今後也要保重身體哦！\n@c0@"
101:
  en: "@a%0%a002030@bI pray that Evgenya can spend the remainder of her days happily beside Ilya.\n@c0@"
  ja: "@a@b%a002030「ジーナさん　いつまでも\n\tイリアさんと　おしあわせに。\n@c0@"
  ko: "@a@b%a002030: 지나 님, 언제까지나\n일리아 님과 행복하시길.\n@c0@"
  sl: "@a@b%a002030：吉娜婆婆，\n　　请一定要和伊利亚先生永远幸福。\n@c0@"
  tl: "@a@b%a002030：吉娜婆婆，\n　　請一定要和伊利亞先生永遠幸福。\n@c0@"
102:
  en: "@a%0%a002050@bTo meet real-life legends in the flesh! It's more than an old man like me ever dared to dream, I tell you!\n@c0@"
  ja: "@a@b%a002050「いやー　伝説のおふたりに\n\tお会いできて　ことばもありません！\n\tかんげきだなあ……。\n@c0@"
  ko: "@a@b%a002050: 이야~ 전설 속의 두 분을\n만나뵙게 되니 말문이 막힙니다!\n감격이네요......\n@c0@"
  sl: "@a@b%a002050：哎呀，能见到传说中的两个人，\n　　我已经无法用言语表达我的心情了！\n　　真是感慨万千啊……\n@c0@"
  tl: "@a@b%a002050：哎呀，能見到傳說中的兩個人，\n　　我已經無法用言語表達我的心情了！\n　　真是感慨萬千啊……\n@c0@"
103:
  en: "@a%0%a002000@bHe's sleepin' like a baby.\n@c0@"
  ja: "@a@b%a002000「なんだか　子供の\n\tねがお　みたいだぜ。\n@c0@"
  ko: "@a@b%a002000: 왠지 어린아이가\n자는 모습 같군.\n@c0@"
  sl: "@a@b%a002000：睡得真像个孩子呢。\n@c0@"
  tl: "@a@b%a002000：睡得真像個孩子呢。\n@c0@"
104:
  en: "@a%0%a002010@bIlya looks to be sleeping soundly, doesn't he?\n@c0@"
  ja: "@a@b%a002010「イリアさん\n\tかおいろも　いいようね。\n@c0@"
  ko: "@a@b%a002010: 일리아 씨\n얼굴도 좋아 보이네.\n@c0@"
  sl: "@a@b%a002010：伊利亚先生\n　　脸色看起来真不错。\n@c0@"
  tl: "@a@b%a002010：伊利亞先生\n　　臉色看起來真不錯。\n@c0@"
105:
  en: "@a%0%a002020@bShhh! It would be a shame to wake him.\n@c0@"
  ja: "@a@b%a002020「えへへっ\n\tよく　ねているね。\n@c0@"
  ko: "@a@b%a002020: 에헤헷.\n잘 주무시네.\n@c0@"
  sl: "@a@b%a002020：诶嘿嘿，\n　　睡得真香。\n@c0@"
  tl: "@a@b%a002020：誒嘿嘿，\n　　睡得真香。\n@c0@"
106:
  en: "@a%0%a002030@bIf all the tales of adventure are true, Ilya has truly earned his rest.\n@c0@"
  ja: "@a@b%a002030「このかたが\n\tイリアさんですか。\n\tお休み中の　ようですね。\n@c0@"
  ko: "@a@b%a002030: 이분이\n일리아 님인가요?\n주무시는 모양이군요.\n@c0@"
  sl: "@a@b%a002030：这位就是伊利亚先生么。\n　　他好像正在休息呢。\n@c0@"
  tl: "@a@b%a002030：這位就是伊利亞先生麼。\n　　他好像正在休息呢。\n@c0@"
107:
  en: "@a%0%a002050@bWhat I wouldn't give to see what's goin' on in his dreams!\n@c0@"
  ja: "@a@b%a002050「むっ？　息は……？\n@c0@"
  ko: "@a@b%a002050: 아니! 숨은......?\n@c0@"
  sl: "@a@b%a002050：嗯？他的呼吸……\n@c0@"
  tl: "@a@b%a002050：嗯？他的呼吸……\n@c0@"
108:
  en: "@a%0%a002050@bI'm sure he's relivin' some of his biggest adventures from the prime of his life!\n@c0@"
  ja: "@a@b%a002050「あ　ちゃんと　してますね。\n\tよかった……。\n@c0@"
  ko: "@a@b%a002050: 아, 쉬고 계시네요.\n다행이다......\n@c0@"
  sl: "@a@b%a002050：啊，呼吸还在呢。\n　　太好了……\n@c0@"
  tl: "@a@b%a002050：啊，呼吸還在呢。\n　　太好了……\n@c0@"
109:
  en: "@a%0%a002000@bAye, it looks like he still packs a punch, alright!\n@c0@"
  ja: "@a@b%a002000「いくつになっても\n\t血の気が　おおいんだな。\n@c0@"
  ko: "@a@b%a002000: 나이가 들어도\n여전히 혈기 왕성하군.\n@c0@"
  sl: "@a@b%a002000：不管多少岁，\n　　都这么血气方刚呢。\n@c0@"
  tl: "@a@b%a002000：不管多少歲，\n　　都這麼血氣方剛呢。\n@c0@"
110:
  en: "@a%0%a002010@bHee hee. Seems like he's having an exciting dream!\n@c0@"
  ja: "@a@b%a002010「うふふ。\n\tにぎやかな　ねごとね。\n@c0@"
  ko: "@a@b%a002010: 우후훗.\n요란한 잠꼬대네.\n@c0@"
  sl: "@a@b%a002010：呵呵。\n　　真是热血沸腾的梦话呢。\n@c0@"
  tl: "@a@b%a002010：呵呵。\n　　真是熱血沸騰的夢話呢。\n@c0@"
111:
  en: "@a%0%a002020@bOoh, I bet he's fighting right alongside us in his dream!\n@c0@"
  ja: "@a@b%a002020「きっと　夢の中では\n\tあたしたちの　仲間なんだよ！\n@c0@"
  ko: "@a@b%a002020: 꿈속에선 분명히\n우리들의 동료일 거야!\n@c0@"
  sl: "@a@b%a002020：在梦里，\n　　他一定成为了我们的同伴吧！\n@c0@"
  tl: "@a@b%a002020：在夢裡，\n　　他一定成為了我們的同伴吧！\n@c0@"
112:
  en: "@a%0%a002030@bIf he does battle even in his dreams, can he really be getting any rest?\n@c0@"
  ja: "@a@b%a002030「ねていても\n\tたたかっているのでは\n\t休まりませんよね……。\n@c0@"
  ko: "@a@b%a002030: 잠든 사이에도\n싸우고 있다니\n쉬질 못하시겠는걸요......\n@c0@"
  sl: "@a@b%a002030：要是连睡着了\n　　都还在战斗的话，\n　　是达不到休息的效果的……\n@c0@"
  tl: "@a@b%a002030：要是連睡著了\n　　都還在戰鬥的話，\n　　是達不到休息的效果的…\n@c0@"
113:
  en: "@a%0%a002050@bI just hope he doesn't take a tumble out of bed!\n@c0@"
  ja: "@a@b%a002050「ああっ！　イリアさん\n\tベッドから　おちちゃいますよ！\n\tハラハラしますね……。\n@c0@"
  ko: "@a@b%a002050: 아앗, 일리아 님!\n침대에서 떨어지겠어요!\n조마조마하네요......\n@c0@"
  sl: "@a@b%a002050：啊！伊利亚先生！\n　　要从床上摔下来了哦！\n　　真让人替他捏把汗……\n@c0@"
  tl: "@a@b%a002050：啊！伊利亞先生！\n　　要從床上摔下來了哦！\n　　真讓人替他捏把汗……\n@c0@"
114:
  en: "@a%0%a002000@bSo Evgenya's even got fans up in heaven! The ol' girl must really have been somethin' else in her day!\n@c0@"
  ja: "@a@b%a002000「天国にも　ファンがいるなんて\n\tジーナばあさん　すごいぜ！\n@c0@"
  ko: "@a@b%a002000: 천국에도 팬이 있다니,\n지나 할머니 대단한데!\n@c0@"
  sl: "@a@b%a002000：天堂里都有她的崇拜者，\n　　吉娜婆婆可真厉害！\n@c0@"
  tl: "@a@b%a002000：天堂裡都有她的崇拜者，\n　　吉娜婆婆可真厲害！\n@c0@"
115:
  en: "@a%0%a002000@bThat's good to hear! We might be passin' this way on a regular basis.\n@c0@"
  ja: "@a@b%a002000「通行自由かあ。\n\tだいぶ　便利になったな。\n@c0@"
  ko: "@a@b%a002000: 자유로이 통행할 수 있다니.\n제법 편리해졌군.\n@c0@"
  sl: "@a@b%a002000：自由通行啊。\n　　这下子可就方便不少了。\n@c0@"
  tl: "@a@b%a002000：自由通行啊。\n　　這下子可就方便不少了。\n@c0@"
116:
  en: "@a%0%a002010@bEveryone can cross freely? That's great news!\n@c0@"
  ja: "@a@b%a002010「みんなが　自由に\n\t通っていいのね？\n\tそれは　よかったわ！\n@c0@"
  ko: "@a@b%a002010: 모든 사람들이 자유롭게\n다닐 수 있는 거지?\n다행이야!\n@c0@"
  sl: "@a@b%a002010：大家能自由通过了么？\n　　真是太好了！\n@c0@"
  tl: "@a@b%a002010：大家能自由通過了麼？\n　　真是太好了！\n@c0@"
117:
  en: "@a%0%a002020@bHope those guys don't let any monsters sneak through...\n@c0@"
  ja: "@a@b%a002020「まものは\n\t通しちゃダメだよ！\n@c0@"
  ko: "@a@b%a002020: 마물은\n통과시키면 안 돼!\n@c0@"
  sl: "@a@b%a002020：让魔物通过可不行！\n@c0@"
  tl: "@a@b%a002020：讓魔物通過可不行！\n@c0@"
118:
  en: "@a%0%a002030@bIt's good to see the crossing is well-guarded.\n@c0@"
  ja: "@a@b%a002030「おつとめ\n\tごくろうさまです。\n@c0@"
  ko: "@a@b%a002030: 일 보느라\n수고 많으십니다.\n@c0@"
  sl: "@a@b%a002030：工作辛苦了。\n@c0@"
  tl: "@a@b%a002030：工作辛苦了。\n@c0@"
119:
  en: "@a%0%a002050@bIt's good to know we can come and go as we please!\n@c0@"
  ja: "@a@b%a002050「いやー\n\t自由って　いいですね！\n\tなんたって　自由ですから！\n@c0@"
  ko: "@a@b%a002050: 이야~\n자유란 좋은 거죠!\n왜냐면 자유니까요!\n@c0@"
  sl: "@a@b%a002050：啊，\n　　自由万岁！\n　　因为自由了嘛！\n@c0@"
  tl: "@a@b%a002050：啊，\n　　自由萬歲！\n　　因為自由了嘛！\n@c0@"
120:
  en: "@a%0%a002000@bGood to know folks have been gettin' out more.\n@c0@"
  ja: "@a@b%a002000「もう　とっくに\n\t行って来たぜ！\n@c0@"
  ko: "@a@b%a002000: 거긴 진작에\n다녀왔지!\n@c0@"
  sl: "@a@b%a002000：咱早就去过了！\n@c0@"
  tl: "@a@b%a002000：咱早就去過了！\n@c0@"
121:
  en: "@a%0%a002010@bEveryone seeks the healing powers of the Ghentiles, it would seem...\n@c0@"
  ja: "@a@b%a002010「ゲントの村は\n\t本当に　みんなの　助けに\n\tなっているのね。\n@c0@"
  ko: "@a@b%a002010: 겐트 마을은\n정말 많은 사람들에게\n도움을 주고 있구나.\n@c0@"
  sl: "@a@b%a002010：根特村真的\n　　帮了大家很大的忙呢。\n@c0@"
  tl: "@a@b%a002010：根特村真的\n　　幫了大家很大的忙呢。\n@c0@"
122:
  en: "@a%0%a002020@bSo, to get to Ghent from here, we go north along the east river and, uh... I'm sure it'll all make sense when we're there...\n@c0@"
  ja: "@a@b%a002020「ここから　ゲントの村へは\n\t東の川ぞいを　北へ……\n\tことばで　いうと　ややこしいね。\n@c0@"
  ko: "@a@b%a002020: 여기서 겐트 마을로 가려면\n동쪽 강변을 북쪽으로......\n말로 표현하자니 복잡하네.\n@c0@"
  sl: "@a@b%a002020：从这里去根特村的话，\n　　要沿着东边的河往北走……\n　　解释起来很麻烦呢。\n@c0@"
  tl: "@a@b%a002020：從這裡去根特村的話，\n　　要沿著東邊的河往北走……\n　　解釋起來很麻煩呢。\n@c0@"
123:
  en: "@a%0%a002030@bThese brave guards too should know that if ever aught ails them, the people of Ghent await them with open arms.\n@c0@"
  ja: "@a@b%a002030「番兵さんも　病気になったら\n\tいつでも　ゲントに　おこしください。\n@c0@"
  ko: "@a@b%a002030: 파수병님도 아픈 곳이 있으면\n언제든 겐트에 들러 주세요.\n@c0@"
  sl: "@a@b%a002030：士兵们要是生了病的话，\n　　随时可以到根特来。\n@c0@"
  tl: "@a@b%a002030：士兵們要是生了病的話，\n　　隨時可以到根特來。\n@c0@"
124:
  en: "@a%0%a002050@bGhent, eh? Folks round my way always talk about that place in hushed tones!\n@c0@"
  ja: "@a@b%a002050「ゲントの村　すごいですね！\n\t有名なんですね！\n@c0@"
  ko: "@a@b%a002050: 겐트 마을 대단하네요!\n유명한가 보군요!\n@c0@"
  sl: "@a@b%a002050：根特村真厉害！\n　　名震四方了呢！\n@c0@"
  tl: "@a@b%a002050：根特村真厲害！\n　　名震四方了呢！\n@c0@"
