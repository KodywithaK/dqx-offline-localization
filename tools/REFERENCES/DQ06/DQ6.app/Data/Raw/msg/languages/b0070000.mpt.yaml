15:
  en: "@a@b*: What in the Goddess's name happened to this village?\n@c0@"
  ja: "@a@b＊「この村の　ありさまは\n\tいったい　どうしたことなのだ。\n@c0@"
  ko: "@a@b*: 이 마을의 모습은\n도대체 왜 이렇게 된 걸까?\n@c0@"
  sl: "@a@b＊：这个村庄落得如此惨状，\n　　到底是怎么回事啊。\n@c0@"
  tl: "@a@b＊：這個村莊落得如此慘狀，\n　　到底是怎麼回事啊。\n@c0@"
16:
  en: "@a@b*: No one's manning the inn, so I had to help myself to a bed.\n@c0@"
  ja: "@a@b＊「しかたなく　こうして\n\tことわりもなく　勝手に\n\t泊まらせて　もらっているが……\n@c0@"
  ko: "@a@b*: 어쩔 수가 없어서 이렇게\n주인한테 말도 못하고 마음대로\n이곳에서 자고 있었는데......\n@c0@"
  sl: "@a@b＊：我实在没办法，\n　　就未经同意地\n　　擅自住了进来……\n@c0@"
  tl: "@a@b＊：我實在沒辦法，\n　　就未經同意地\n　　擅自住了進來……\n@c0@"
17:
  en: "@a@b*: You want to stay here too? The rate is, uh...%a000510 gold coins a night, I think. I, uh, better keep order and collect the money.\n@c0@"
  ja: "@a@b＊「おぬしらも　泊まっていくか？\n\t宿代の%a000510ゴールドは\n\tわしが　あずかっておこう。\n@c0@"
  ko: "@a@b*: 자네들도 자고 가겠나?\n숙박료 %a000510골드는\n내가 맡아 두도록 하지.\n@c0@"
  sl: "@a@b＊：你们也是来住宿的吗？\n　　住宿费%a000510金币，\n　　就由我代为保管了。\n@c0@"
  tl: "@a@b＊：你們也是來住宿的嗎？\n　　住宿費%a000510金幣，\n　　就由我代為保管了。\n@c0@"
18:
  en: "@a@b*: Alright. Sleep tight...or whatever innkeepers say.\n@c0@"
  ja: "@a@b＊「よかろう。\n\tゆっくり　休むが　いい。\n@c0@"
  ko: "@a@b*: 알았네.\n편히 쉬게.\n@c0@"
  sl: "@a@b＊：行了，好好休息吧。\n@c0@"
  tl: "@a@b＊：行了，好好休息吧。\n@c0@"
19:
  en: "@a@b*: Hey, even I'm not staying here for free, you know. You wanna stay, you gotta pay.\n@c0@"
  ja: "@a@b＊「わしも　タダで　泊まって\n\tいるわけでは　ない。\n\t金がないなら　ダメだな。\n@c0@"
  ko: "@a@b*: 나도 공짜로 자고\n있는 건 아니야.\n돈이 없으면 안 되지.\n@c0@"
  sl: "@a@b＊：我也不是白住在这里的。\n　　没有钱可不行啊。\n@c0@"
  tl: "@a@b＊：我也不是白住在這裡的。\n　　沒有錢可不行啊。\n@c0@"
20:
  en: "@a@b*: Alright, suit yourself.\n@c0@"
  ja: "@a@b＊「そうか。\n\tならば　好きにするが　いい。\n@c0@"
  ko: "@a@b*: 그래?\n그럼 마음대로 해.\n@c0@"
  sl: "@a@b＊：是吗，那随你们便吧。\n@c0@"
  tl: "@a@b＊：是嗎，那隨你們便吧。\n@c0@"
