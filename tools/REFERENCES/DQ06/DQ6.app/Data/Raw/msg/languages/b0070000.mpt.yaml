0:
  en: "@a@b*: I came here hunting for the legendary sword, but it looks like I'm a bit late...\n@c0@"
  ja: "@a@b＊「私は　伝説の剣を　もとめて\n\tここまで　やってきたのだが……。\n@c0@"
  ko: "@a@b*: 나는 전설의 검을 찾아\n여기까지 왔는데......\n@c0@"
  sl: "@a@b＊：我一路追寻传说之剑，\n　　最终来到了这里……\n@c0@"
  tl: "@a@b＊：我一路追尋傳說之劍，\n　　最終來到了這裡……\n@c0@"
1:
  en: "@a@b*: As in, fifty years late. (sigh)\n@c0@"
  ja: "@a@b＊「どうやら　５０年ほど\n\tおそかったようだな。\n@c0@"
  ko: "@a@b*: 아무래도 50년 정도\n늦은 것 같군.\n@c0@"
  sl: "@a@b＊：看来似乎是晚了５０年啊。\n@c0@"
  tl: "@a@b＊：看來似乎是晚了５０年啊。\n@c0@"
2:
  en: "@a@b*: You here to see Ali Kazam as well?\n@c0@"
  ja: "@a@b＊「あんたらも　ザム神官に会うために\n\tここまで　きたのかい？\n@c0@"
  ko: "@a@b*: 너희도 자무 신관을 만나려고\n여기까지 왔어?\n@c0@"
  sl: "@a@b＊：你们也是为了见扎姆神官\n　　而来到这里的吗？\n@c0@"
  tl: "@a@b＊：你們也是為了見扎姆神官\n　　而來到這裡的嗎？\n@c0@"
3:
  en: "@a@b*: My old grandad said he met him back when he was a nipper.\n@c0@"
  ja: "@a@b＊「オレのじいさんが　子供のころ\n\t会ったことがあるって　いってたよ。\n@c0@"
  ko: "@a@b*: 우리 할아버지가 어렸을 때\n만난 적이 있다고 했거든.\n@c0@"
  sl: "@a@b＊：我的爷爷曾经说过，\n　　在他小的时候曾见过神官。\n@c0@"
  tl: "@a@b＊：我的爺爺曾經說過，\n　　在他小的時候曾見過神官。\n@c0@"
4:
  en: "@a@b*: Ali was already over the hill then, so I doubt he's among the livin' now.\n@c0@"
  ja: "@a@b＊「そのとき　すでに　ザム神官は\n\tかなりのトシだったみたいだから\n\tさすがに　もう生きちゃいないだろう。\n@c0@"
  ko: "@a@b*: 그때 이미 자무 신관은\n꽤 나이가 많았다니까\n이미 죽었을 거야.\n@c0@"
  sl: "@a@b＊：那时候的扎姆神官年纪已经不小了，\n　　想必现在他已经不在人世了吧。\n@c0@"
  tl: "@a@b＊：那時候的扎姆神官年紀已經不小了，\n　　想必現在他已經不在人世了吧。\n@c0@"
5:
  en: "@a@b*: Looks like %H0860%Xyou%Yyou lot%Z came half a century too late.\n@c0@"
  ja: "@a@b＊「あんたらも　くるのが\n\t５０年ほど　おそかったな。\n@c0@"
  ko: "@a@b*: 너희도 오는 게\n50년은 늦었어.\n@c0@"
  sl: "@a@b＊：你们也来晚了５０年啊。\n@c0@"
  tl: "@a@b＊：你們也來晚了５０年啊。\n@c0@"
6:
  en: "@a@b*: Then ya better keep movin'. Nothin' round here but a village so sleepy, it ain't even got a name.\n@c0@"
  ja: "@a@b＊「だったら　よそに　いきな。\n\tこの先には　名もない\n\t小さな村が　あるだけだぜ。\n@c0@"
  ko: "@a@b*: 그럼 딴 데나 가 봐.\n이 앞에는 이름 없는\n작은 마을이 있을 뿐.\n@c0@"
  sl: "@a@b＊：还是去别处吧。\n　　再朝前走也只有\n　　一个无名的小村庄而已。\n@c0@"
  tl: "@a@b＊：還是去別處吧。\n　　再朝前走也只有\n　　一個無名的小村莊而已。\n@c0@"
7:
  en: "@a@b*: Only Ali Kazam knew the magic words to lift the seal on the legendary sword, they say...\n@c0@"
  ja: "@a@b＊「ザム神官だけが\n\t伝説の剣の　封印を解く言葉を\n\t知っていたということですが……。\n@c0@"
  ko: "@a@b*: 자무 신관만이\n전설의 검에 걸린 봉인을 푸는 주문을\n알고 있다고 합니다만......\n@c0@"
  sl: "@a@b＊：能够解除传说之剑封印的暗语，\n　　只有扎姆神官才知道……\n@c0@"
  tl: "@a@b＊：能夠解除傳說之劍封印的暗語，\n　　只有扎姆神官才知道……\n@c0@"
8:
  en: "@a@b*: Now that Ali is no longer with us, I suppose that sword is lost to the world forever.\n@c0@"
  ja: "@a@b＊「ザム神官が　死んでしまった今\n\tもう　伝説の剣を　手にすることは\n\tかなわぬでしょうな。\n@c0@"
  ko: "@a@b*: 자무 신관이 돌아가신 지금\n이젠 전설의 검을 손에 넣는 건\n불가능할 겁니다.\n@c0@"
  sl: "@a@b＊：现在扎姆神官已然去世，\n　　恐怕已经没人能得到\n　　传说之剑了吧。\n@c0@"
  tl: "@a@b＊：現在扎姆神官已然去世，\n　　恐怕已經沒人能得到\n　　傳說之劍了吧。\n@c0@"
9:
  en: "@a@bThere's no response. He's frozen stiff...\n@c0@"
  ja: "@a@b返事が　ない……。　冷たく\nこおりついて　いるようだ。\n@c0@"
  ko: "@a@b반응이 없다. 차갑게\n얼어붙은 것 같다.\n@c0@"
  sl: "@a@b没有回应……\n似乎被冻成了冰块。\n@c0@"
  tl: "@a@b沒有回應……\n似乎被凍成了冰塊。\n@c0@"
