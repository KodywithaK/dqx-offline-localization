32:
  en: "@a@b*: What brings %H0860%Xyou%Yyou youngsters%Z to a Goddess-forsaken place like this?\n@c0@"
  ja: "@a@b＊「あんたら　こんな村に\n\tなんの用だね。\n@c0@"
  ko: "@a@b*: 당신들, 이런 촌구석에\n무슨 볼일인가?\n@c0@"
  sl: "@a@b＊：你们到这个村子里来\n　　有什么事啊。\n@c0@"
  tl: "@a@b＊：你們到這個村子裡來\n　　有什麼事啊。\n@c0@"
33:
  en: "@a@b*: You must've noticed I'm the only one here who's not a blinkin' snowman.\n@c0@"
  ja: "@a@b＊「ごらんの通り　わし以外の\n\t村人は　みな　こおりついて\n\tしまっとる！\n@c0@"
  ko: "@a@b*: 보시다시피 나 말고\n다른 마을 사람은 모두\n얼어붙어 버렸지!\n@c0@"
  sl: "@a@b＊：如你们所见，\n　　除了我以外的村民\n　　都被冻成了冰块！\n@c0@"
  tl: "@a@b＊：如你們所見，\n　　除了我以外的村民\n　　都被凍成了冰塊！\n@c0@"
34:
  en: "@a@b*: And I doubt you came to see an old codger like me, so clear off.\n@c0@"
  ja: "@a@b＊「こんな　おいぼれに\n\t用は　ないじゃろ？\n\tさっさと　立ち去るがええ。\n@c0@"
  ko: "@a@b*: 나 같은 늙은이한테는\n볼일 없겠지?\n썩 사라지게.\n@c0@"
  sl: "@a@b＊：跟我这样的老头子\n　　没什么好说的吧？\n　　那就赶快走吧。\n@c0@"
  tl: "@a@b＊：跟我這樣的老頭子\n　　沒什麼好說的吧？\n　　那就趕快走吧。\n@c0@"
35:
  en: "@a@b*: Hey! Hang on...\n@c0@"
  ja: "@a@b＊「おい！　お前さんたち……\n@c0@"
  ko: "@a@b*: 이봐! 자네들......\n@c0@"
  sl: "@a@b＊：喂！我说你们……\n@c0@"
  tl: "@a@b＊：喂！我說你們……\n@c0@"
36:
  en: "@a@b*: Whatever you're seekin', don't look for it anywhere near the shrine to the north-east.\n@c0@"
  ja: "@a@b＊「何を　さがしてるのか　知らんが　\n\tこの村の北東にある　ほこらへは\n\t絶対に　近づいちゃならんぞ。\n@c0@"
  ko: "@a@b*: 무얼 찾는지 모르겠지만,\n이 마을의 북동쪽에 있는 성소에는\n절대 다가가면 안 되네.\n@c0@"
  sl: "@a@b＊：虽然不知道你们在找些什么，\n　　不过绝对不要靠近\n　　这村子东北方的那座祠堂啊。\n@c0@"
  tl: "@a@b＊：雖然不知道你們在找些什麼，\n　　不過絕對不要靠近\n　　這村子東北方的那座祠堂啊。\n@c0@"
37:
  en: "@a@b*: No matter what, you hear?\n@c0@"
  ja: "@a@b＊「絶対にな……。\n@c0@"
  ko: "@a@b*: 절대로......\n@c0@"
  sl: "@a@b＊：绝对不要啊……\n@c0@"
  tl: "@a@b＊：絕對不要啊……\n@c0@"
38:
  en: "@a@b*: Hmph. This trail's gone cold. I'd better look somewhere else.\n@c0@"
  ja: "@a@b＊「チッ　手がかりなしか。\n\tしかたない……。\n\t他を　あたるしか　ないようだな。\n@c0@"
  ko: "@a@b*: 쳇, 단서가 없군.\n어쩔 수 없지......\n다른 곳을 찾아 볼 수밖에 없겠어.\n@c0@"
  sl: "@a@b＊：嘁，没有线索吗。没办法……\n　　只好另寻他处了。\n@c0@"
  tl: "@a@b＊：嘁，沒有線索嗎。沒辦法……\n　　只好另尋他處了。\n@c0@"
39:
  en: "@a@b*: Sorry — no time for chit-chat. I'm in a hurry.\n@c0@"
  ja: "@a@b＊「おっと　失礼！\n\t急いでるんでね。\n@c0@"
  ko: "@a@b*: 앗, 미안!\n서두르고 있거든.\n@c0@"
  sl: "@a@b＊：哎哟，不好意思！\n　　我有急事呢。\n@c0@"
  tl: "@a@b＊：哎喲，不好意思！\n　　我有急事呢。\n@c0@"
40:
  en: "@a@b*: You again? Haven't we established that you've got no business here?\n@c0@"
  ja: "@a@b＊「なんじゃ　お前さんたち\n\tもう　わしには　なんの用も\n\tないはずじゃろう。\n@c0@"
  ko: "@a@b*: 뭐냐, 너희들은?\n나한텐 이제 볼일이\n없을 텐데.\n@c0@"
  sl: "@a@b＊：干什么，你们难道找\n　　我这老家伙有事吗？\n@c0@"
  tl: "@a@b＊：幹什麼，你們難道找\n　　我這老傢伙有事嗎？\n@c0@"
41:
  en: "@a@b*: Huh? A young man named Colburn?\n@c0@"
  ja: "@a@b＊「ん？　ゴランという　若者は\n\t誰か　じゃと？\n@c0@"
  ko: "@a@b*: 응? 고랑이라는 젊은이는\n누구냐고?\n@c0@"
  sl: "@a@b＊：嗯？你想知道\n　　叫戈兰的年轻人是谁？\n@c0@"
  tl: "@a@b＊：嗯？你想知道\n　　叫戈蘭的年輕人是誰？\n@c0@"
42:
  en: "@a@b*: Heh heh! That's rich. Colburn hasn't been a ‘young man’ for at least fifty years.\n@c0@"
  ja: "@a@b＊「わっはっはっ！　笑わせるわい！\n\tゴランが　若者だったのは\n\tもう５０年も　前のこと……\n@c0@"
  ko: "@a@b*: 와하하하! 웃기는군!\n고랑이 젊은이였던 때는\n벌써 50년 전 일이지......\n@c0@"
  sl: "@a@b＊：哇哈哈！你是在逗我笑吗！\n　　５０年前的戈兰\n　　倒是个年轻人……\n@c0@"
  tl: "@a@b＊：哇哈哈！你是在逗我笑嗎！\n　　５０年前的戈蘭\n　　倒是個年輕人……\n@c0@"
43:
  en: "@a@b*: I should know — I'm Colburn!\n@c0@"
  ja: "@a@b＊「この　おいぼれが　ゴランじゃ！\n@c0@"
  ko: "@a@b*: 이 늙은이가 고랑일세!\n@c0@"
  sl: "@a@b＊：你们眼前的这个老家伙就是戈兰！\n@c0@"
  tl: "@a@b＊：你們眼前的這個老傢伙就是戈蘭！\n@c0@"
44:
  en: "@aColburn@bYou went to that shrine, didn't you? After I specifically warned you not to...\n@c0@"
  ja: "@a@bゴラン「お前さんたち　わしが\n\tあれほど　だめだと　いったのに\n\t北東のほこらへ　行ったんじゃな。\n@c0@"
  ko: "@a@b고랑: 자네들은 내가\n그렇게 안 된다고 했는데\n북동쪽 성소에 간 모양이군.\n@c0@"
  sl: "@a@b戈兰：你们这群家伙，\n　　我千叮咛万嘱咐让你们不要去\n　　东北的祠堂，结果你们还是去了。\n@c0@"
  tl: "@a@b戈蘭：你們這群傢伙，\n　　我千叮嚀萬囑咐讓你們不要去\n　　東北的祠堂，結果你們還是去了。\n@c0@"
45:
  en: "@aColburn@bWhy can't you youngsters do as you're told?\n@c0@"
  ja: "@a@bゴラン「まったく　若いというのは　\n\t無茶なものよ。\n@c0@"
  ko: "@a@b고랑: 정말로 젊은이들은\n터무니없는 짓을 한단 말이야.\n@c0@"
  sl: "@a@b戈兰：年轻人真是\n　　什么事都做得出来啊。\n@c0@"
  tl: "@a@b戈蘭：年輕人真是\n　　什麼事都做得出來啊。\n@c0@"
46:
  en: "@aColburn@bI'm only going to say this one more time: never go near that place again, you hear me?\n@c0@"
  ja: "@a@bゴラン「ええか　お前さんたち\n\tもう　２度と　北東のほこらには\n\t近づくな。\n@c0@"
  ko: "@a@b고랑: 잘 듣게. 자네들\n두 번 다시 북동쪽 성소에는\n다가가지 말게.\n@c0@"
  sl: "@a@b戈兰：听着，你们千万不要\n　　再接近东北的祠堂了。\n@c0@"
  tl: "@a@b戈蘭：聽著，你們千萬不要\n　　再接近東北的祠堂了。\n@c0@"
47:
  en: "@aColburn@bUnless you want to end up like me...\n@c0@"
  ja: "@a@bゴラン「わしのような　思いを\n\tしたくなかったらな……。\n@c0@"
  ko: "@a@b고랑: 나 같은 꼴을\n당하지 않으려면 말일세......\n@c0@"
  sl: "@a@b戈兰：如果不想像我一样\n　　留下痛苦的回忆的话……\n@c0@"
  tl: "@a@b戈蘭：如果不想像我一樣\n　　留下痛苦的回憶的話……\n@c0@"
