  en: "@a@b*: Good day to ye.\n㈡\n*: I'm Torneko Taloon, blessed with the best sales blarney in Endor and anywhere else ye'd care to mention. 'Tis a pleasure.\n@c0@"
  ja: "@a@b＊「わたしは　トルネコ。\n\tエンドールで　あきないを\n\t営む者です。\n@c0@"
  ko: "@a@b*: 저는 토르네코.\n엔돌에서 장사를\n하고 있는 사람입니다.\n@c0@"
  sl: "@a@b＊：我的名字叫特鲁尼克。\n　　是在恩多尔城做生意的商人。\n@c0@"
  tl: "@a@b＊：我的名字叫特魯尼克。\n　　是在恩多爾城做生意的商人。\n@c0@"
99:
  en: "@aTorneko@bNow the world's all peaceful, like, I've been trav'llin' all over in search o' the quarest and rarest treasures goin'.\n@c0@"
  ja: "@a@bトルネコ「世界が　平和になったので\n\tまだ見ぬ　宝を求めて\n\t旅をしていたのですが……\n@c0@"
  ko: "@a@b토르네코: 세계가 평화로워져서\n아직 보지 못한 보물을 찾아서\n여행하고 있었습니다만......\n@c0@"
  sl: "@a@b特鲁尼克：世界已经恢复了和平，\n　　我正在为寻找未曾见过的宝物\n　　而进行旅行……\n@c0@"
  tl: "@a@b特魯尼克：世界已經恢復了和平，\n　　我正在為尋找未曾見過的寶物\n　　而進行旅行……\n@c0@"
100:
  en: "@aTorneko@bI wasn't keepin' too careful an eye on where I was wand'rin', an' before I knew it, I ended up in this funny ole place.\n@c0@"
  ja: "@a@bトルネコ「いやはや　気がついたら\n\tこんなところに\n\tまよいこんでしまいました。\n@c0@"
  ko: "@a@b토르네코: 맙소사 정신을 차리고 보니\n이런 곳에서 길을 잃어버렸지 뭡니까.\n@c0@"
  sl: "@a@b特鲁尼克：哎呀呀，等到回过神来的时候，\n　　就已经迷失在这个地方了。\n@c0@"
  tl: "@a@b特魯尼克：哎呀呀，等到回過神來的時候，\n　　就已經迷失在這個地方了。\n@c0@"
101:
  en: "@aTorneko@bAnyway, if ye're interested in treasures at all, I've a tale an' a half to tell ye.\n@c0@"
  ja: "@a@bトルネコ「そういえば　宝といえば\n\tこんな話を　聞いたことが　ありますね。\n@c0@"
  ko: "@a@b토르네코: 보물 얘기가 나와서 말인데\n이런 이야기를 들은 적이 있습니다.\n@c0@"
  sl: "@a@b特鲁尼克：说起来，有关宝物的事情，\n　　我听到过这样的传闻。\n@c0@"
  tl: "@a@b特魯尼克：說起來，有關寶物的事情，\n　　我聽到過這樣的傳聞。\n@c0@"
102:
  en: "@aTorneko@bSeems some monster buried a real beauty over there in Aridea.\n㈡\nGo five steps west o' the well, then five north, an' ye'll find it, they said.\n@c0@"
  ja: "@a@bトルネコ「なんでも　カルカドという町の\n\t井戸から　西に５歩　北に５歩の所に\n\tまものが宝を　うめたそうです。\n@c0@"
  ko: "@a@b토르네코: 캘커드라는 마을의 우물에서\n서쪽으로 5걸음 북쪽으로 5걸음 간 곳에\n마물이 보물을 묻어 놓았다더군요.\n@c0@"
  sl: "@a@b特鲁尼克：好像是从加尔加德镇的\n　　水井往西５步、再向北５步之后，\n　　就能找到魔物埋藏的宝物。\n@c0@"
  tl: "@a@b特魯尼克：好像是從加爾加德鎮的\n　　水井往西５步、再向北５步之後，\n　　就能找到魔物埋藏的寶物。\n@c0@"
103:
  en: "@aTorneko@bOnly trouble is, in all me trav'llin' days, I've never heard of anywhere called Aridea.\n㈡\n'Tis a funny ole tale an' no mistake...\n@c0@"
  ja: "@a@bトルネコ「しかし　カルカドなんて町\n\t聞いたことが　ないので　さがすことも\n\tできないですよ。　トホホ……。\n@c0@"
  ko: "@a@b토르네코: 하지만 캘커드라는 마을은\n들어본 적이 없어서\n찾고 싶어도 찾을 수가 있어야 말이죠......\n@c0@"
  sl: "@a@b特鲁尼克：但是我就没听说过\n　　加尔加德这个小镇，\n　　因此也不可能找到了吧。唉……\n@c0@"
  tl: "@a@b特魯尼克：但是我就沒聽說過\n　　加爾加德這個小鎮，\n　　因此也不可能找到了吧。唉……\n@c0@"
104:
  en: "@aTorneko@bWh—?㈢ Ye've—!?㈢ No! Ye can't have! Is that...? Are those...?\n㈡\nJaney Mac! Ye've only gone an' got yerself a pair of orichalcum fangs! Well I'll be!\n@c0@"
  ja: "@a@bトルネコ「そ㈢　そ㈢　それは\n\tまさか　伝説の　オリハルコンのキバ！\n@c0@"
  ko: "@a@b토르네코: 그㈢ 그㈢ 그건\n설마 전설의 오리할콘 이빨!\n@c0@"
  sl: "@a@b特鲁尼克：那㈢、那㈢……\n　　那难道是传说中的奥利哈尔刚之牙？\n@c0@"
  tl: "@a@b特魯尼克：那㈢、那㈢……\n　　那難道是傳說中的奧利哈爾剛之牙？\n@c0@"
105:
  en: "@aTorneko@bAn' they're not just fer bitin', neither. Ye can hold them in yer hand an' do a fair ole rake o' damage, so ye can. \n@c0@"
  ja: "@a@bトルネコ「キバとしてだけではなく\n\t手に持って　きりつけることも\n\tできる　すぐれものです！\n@c0@"
  ko: "@a@b토르네코: 단순한 이빨이 아니라\n손에 들면 검 대신으로도\n쓸 수 있는 물건입니다!\n@c0@"
  sl: "@a@b特鲁尼克：它不仅可以作为武器使用，\n　　还是一个优秀的手持切割工具！\n@c0@"
  tl: "@a@b特魯尼克：它不僅可以作為武器使用，\n　　還是一個優秀的手持切割工具！\n@c0@"
106:
  en: "@aTorneko@bAye, an' they can be equipped by...\n@c0@"
  ja: "@a@bトルネコ「これを　装備できるのは……\n@c0@"
  ko: "@a@b토르네코: 이걸 장비할 수 있는 건......\n@c0@"
  sl: "@a@b特鲁尼克：能够装备它的是……\n@c0@"
  tl: "@a@b特魯尼克：能夠裝備它的是……\n@c0@"
107:
  en: "@aTorneko@bJaypers, ye'll have to forgive me. Force o' habit.\n@c0@"
  ja: "@a@bトルネコ「おっと　失礼しました。\n\tつい　昔の　クセが。\n@c0@"
  ko: "@a@b토르네코: 이런, 실례했습니다.\n옛날 버릇에 그만......\n@c0@"
  sl: "@a@b特鲁尼克：哎呀，不好意思。\n　　一不小心以前的毛病就犯了。\n@c0@"
  tl: "@a@b特魯尼克：哎呀，不好意思。\n　　一不小心以前的毛病就犯了。\n@c0@"
108:
  en: "@aTorneko@bAnyway, ye'll not lay yer hands on a set of those in any normal shop, so ye won't.\n@c0@"
  ja: "@a@bトルネコ「非常に　高価な　モノなので\n\tふつうの　店では　買いとっては\n\tくれないと　思いますよ。\n@c0@"
  ko: "@a@b토르네코: 매우 비싼 물건이라\n평범한 상점에서는\n사 주지 않을 겁니다.\n@c0@"
  sl: "@a@b特鲁尼克：因为这是非常昂贵的东西，\n　　一般的店是不会买下的。\n@c0@"
  tl: "@a@b特魯尼克：因為這是非常昂貴的東西，\n　　一般的店是不會買下的。\n@c0@"
109:
  en: "@aTorneko@bBut if ye're ever lookin' to sell them, I'll happily take them off yer hands. Don't be a stranger, now!\n@c0@"
  ja: "@a@bトルネコ「でも　もし　売りたくなったら\n\tわたしに　売ってくださいね。\n\tぜったいですよ！！\n@c0@"
  ko: "@a@b토르네코: 하지만 만약에 팔고 싶으면\n제게 팔아 주세요.\n꼭입니다!!\n@c0@"
  sl: "@a@b特鲁尼克：但若你想将它出售的话，\n　　就请卖给我吧。\n　　绝对要卖给我啊！\n@c0@"
  tl: "@a@b特魯尼克：但若你想將它出售的話，\n　　就請賣給我吧。\n　　絕對要賣給我啊！\n@c0@"
110:
  en: "@aTorneko@bWell, an' this is a quare ole cave now, isn't it just...\n@c0@"
  ja: "@a@bトルネコ「それにしても　ここは\n\tなんとも　不思議な洞くつですね。\n@c0@"
  ko: "@a@b토르네코: 그나저나 여긴\n정말 신비한 동굴이로군요.\n@c0@"
  sl: "@a@b特鲁尼克：话说回来，\n　　这里还真是个不可思议的洞窟啊。\n@c0@"
  tl: "@a@b特魯尼克：話說回來，\n　　這裡還真是個不可思議的洞窟啊。\n@c0@"
111:
  en: "@a@b*: Ye're a trav'ller, are ye? Tom Foolery, wand'rin' minstrel, at yer service.\n@c0@"
  ja: "@a@bパノン「旅のおかたですか？\n\t私は　旅芸人をやっている\n\tパノンと申します。\n@c0@"
  ko: "@a@b파논: 여행을 하고 계신가요?\n저는 유랑 광대인\n파논이라고 합니다.\n@c0@"
  sl: "@a@b帕农：你是旅行者吗？\n　　我叫帕农，是一名旅行艺人。\n@c0@"
  tl: "@a@b帕農：你是旅行者嗎？\n　　我叫帕農，是一名旅行藝人。\n@c0@"
112:
  en: "@aTom Foolery@bI've just finished me run o' shows here. It's been a great craic, so it has, but it's time fer me to be movin' on.\n@c0@"
  ja: "@a@bパノン「この村での　こうえんも\n\t終えたので　そろそろ\n\t次の場所へ　向かおうと　思っていました。\n@c0@"
  ko: "@a@b파논: 이 마을에서의 공연도\n끝나서 슬슬\n다음 장소로 가려던 참이었습니다.\n@c0@"
  sl: "@a@b帕农：在这个村子里的演出已经结束，\n　　现在也差不多该往下一个地方前进了。\n@c0@"
  tl: "@a@b帕農：在這個村子裡的演出已經結束，\n　　現在也差不多該往下一個地方前進了。\n@c0@"
113:
  en: "@aTom Foolery@bAh, but what am I to do? The roads bein' what they are these days, I had to hire me a bodyguard fer the way up here, see.\n@c0@"
  ja: "@a@bパノン「ただ　道中　なにかと\n\tあぶないですので\n\tようじんぼうを　やとったのですが……\n@c0@"
  ko: "@a@b파논: 다만, 여행길이\n위험해서 경호원을\n고용했었는데요......\n@c0@"
  sl: "@a@b帕农：但是由于这一路上\n　　似乎会有危险的样子，\n　　所以我雇佣了一名保镖……\n@c0@"
  tl: "@a@b帕農：但是由於這一路上\n　　似乎會有危險的樣子，\n　　所以我雇傭了一名保鏢……\n@c0@"
114:
  en: "@aTom Foolery@bBut the goin' was all kinds o' tough, an' it took us five days to get here, so the feen took off home again as soon as we arrived.\n@c0@"
  ja: "@a@bパノン「ここまでの道が　ふくざつで\n\t５日　かかったとかで\n\tついたとたんに　帰ってしまいました。\n@c0@"
  ko: "@a@b파논: 여기까지 오는 길이 복잡해서\n5일이나 걸렸다면서\n도착하자마자 돌아가 버렸어요.\n@c0@"
  sl: "@a@b帕农：不过到达这里的路程实在太复杂了，\n　　结果他把我花钱雇他的５天时间全都\n　　用在了赶来的路上，刚到这里就立刻回去了。\n@c0@"
  tl: "@a@b帕農：不過到達這裡的路程實在太複雜了，\n　　結果他把我花錢雇他的５天時間全都\n　　用在了趕來的路上，剛到這裡就立刻回去了。\n@c0@"
115:
  en: "@aTom Foolery@bI guess that Hardie feller's hardly as hardy as he'd had me believe, huh? Har de har!\n@c0@"
  ja: "@a@bパノン「やっぱり　デスコッドで\n\tスコットさんと　待ち合わせたのは\n\t失敗でしたかねぇ。\n@c0@"
  ko: "@a@b파논: 역시 데스코드에서\n스콧 씨를 만난 것이\n잘못이었습니다.\n@c0@"
  sl: "@a@b帕农：选在德斯科德村\n　　和斯科特碰头，\n　　我真是太失败了啊。\n@c0@"
  tl: "@a@b帕農：選在德斯科德村\n　　和斯科特碰頭，\n　　我真是太失敗了啊。\n@c0@"
116:
  en: "@a@b*: Oh, come on, Sis. How long are you going to keep me waiting like this?\n@c0@"
  ja: "@a@b＊「ちょっとー　ミネアってば\n\tあたしのことを　いつまで\n\tほうっておくつもり？\n@c0@"
  ko: "@a@b*: 아 정말, 미네아는\n날 언제까지\n그냥 내버려 둘 셈이람?\n@c0@"
  sl: "@a@b＊：可恶，米妮雅到底\n　　打算让我等到什么时候啊？\n@c0@"
  tl: "@a@b＊：可惡，米妮雅到底\n　　打算讓我等到什麼時候啊？\n@c0@"
117:
  en: "@a@b*: ...Hm? Who are you?\n@c0@"
  ja: "@a@b＊「……って　あんた　だれ？\n@c0@"
  ko: "@a@b*: ......근데 당신 누구?\n@c0@"
  sl: "@a@b＊：……啥？你谁啊？\n@c0@"
  tl: "@a@b＊：……啥？你誰啊？\n@c0@"
118:
  en: "@a@b*: Eh? Who am I?\n@c0@"
  ja: "@a@b＊「え？　あたしこそ　だれだって？\n@c0@"
  ko: "@a@b*: 응? 그러는 나는 누구냐고?\n@c0@"
  sl: "@a@b＊：诶？你居然问我是谁？\n@c0@"
  tl: "@a@b＊：誒？你居然問我是誰？\n@c0@"
119:
  en: "@a@b*: I am only the magnificent Maya, greatest dancer in all of Laissez-Fayre!\n㈡\n*: You'd have to go pretty far to find someone who hadn't heard of me!\n@c0@"
  ja: "@a@b＊「モンバーバラの　トップダンサー\n\tマーニャ様を　知らないなんて\n\t世間知らずにも　ほどがあるわね。\n@c0@"
  ko: "@a@b*: 몬바바라의 톱 댄서\n마냐 님을 모르다니\n세상을 몰라도 너무 모르네.\n@c0@"
  sl: "@a@b＊：竟然连蒙巴巴拉的首席舞者\n　　玛妮娅大人的名字都不知道，\n　　无知也得有个限度吧。\n@c0@"
  tl: "@a@b＊：竟然連蒙巴巴拉的首席舞者\n　　瑪妮婭大人的名字都不知道，\n　　無知也得有個限度吧。\n@c0@"
120:
  en: "@aMaya@bThen again, where exactly are we...?\n@c0@"
  ja: "@a@bマーニャ「それにしても　ここ　どこよ？\n@c0@"
  ko: "@a@b마냐: 그나저나 여긴 어디야?\n@c0@"
  sl: "@a@b玛妮娅：话说回来这是哪里？\n@c0@"
  tl: "@a@b瑪妮婭：話說回來這是哪裡？\n@c0@"
121:
  en: "@aMaya@bThere is no casino, no dance hall, and only the most run-down of taverns...\n@c0@"
  ja: "@a@bマーニャ「カジノも　げきじょうも　ないし\n\t酒場は　シケてるし……。\n@c0@"
  ko: "@a@b마냐: 카지노도 아니고 극장도 아니고\n주점은 물이 안 좋고......\n@c0@"
  sl: "@a@b玛妮娅：既没有赌场也没有剧场，\n　　酒馆也生意不好……\n@c0@"
  tl: "@a@b瑪妮婭：既沒有賭場也沒有劇場，\n　　酒館也生意不好……\n@c0@"
122:
  en: "@aMaya@bHonestly, my sister! I tell her we have to get out of this awful-awful place, and instead she starts with the fortune-telling!\n@c0@"
  ja: "@a@bマーニャ「はやく　別の場所に\n\t行きたいってのに　ミネアったら\n\t商売なんか　始めちゃって……。\n@c0@"
  ko: "@a@b마냐: 빨리 다른 곳에\n가고 싶다고 해도 미네아는\n장사를 시작해 버리고......\n@c0@"
  sl: "@a@b玛妮娅：真想快点到别的地方去，\n　　但是米妮雅竟然开始做什么买卖……\n@c0@"
  tl: "@a@b瑪妮婭：真想快點到別的地方去，\n　　但是米妮雅竟然開始做什麼買賣……\n@c0@"
123:
  en: "@aMaya@bThere's no knowing how long it will be until we can get out of here now...\n@c0@"
  ja: "@a@bマーニャ「いつになったら\n\tここから　出られるワケ？\n@c0@"
  ko: "@a@b마냐: 언제쯤이면\n여기서 나갈 수 있을까?\n@c0@"
  sl: "@a@b玛妮娅：到底要耗到什么时候\n　　才能离开这里啊？\n@c0@"
  tl: "@a@b瑪妮婭：到底要耗到什麼時候\n　　才能離開這裡啊？\n@c0@"
124:
  en: "@aMaya@bThis place is awful! Just awful-awful! No casino, no dance hall, and nothing but this run-down dive of a tavern.\n@c0@"
  ja: "@a@bマーニャ「ここって　カジノもないし\n\t酒場も　シケてるし　ホント\n\tサイアクなところね。\n@c0@"
  ko: "@a@b마냐: 여긴 카지노도 없고\n주점도 물이 안 좋아서\n사람 살 곳이 못 돼.\n@c0@"
  sl: "@a@b玛妮娅：这里不仅没有赌场，\n　　而且连酒馆的生意也很差，\n　　真是个糟糕透顶的地方呢。\n@c0@"
  tl: "@a@b瑪妮婭：這裡不僅沒有賭場，\n　　而且連酒館的生意也很差，\n　　真是個糟糕透頂的地方呢。\n@c0@"
125:
  en: "@aMaya@bBut Sis seems happy enough here, so I suppose we can stick around a little longer...\n@c0@"
