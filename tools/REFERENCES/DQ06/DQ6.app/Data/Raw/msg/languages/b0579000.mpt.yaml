0:
  en: "@a%0%a002000@bRemember back when the Chief's girl got snatched? Seems like ancient history now, aye?\n@c0@"
  ja: "@a@b%a002000「あの　ゆうかい事件も\n\t今となっては　いい　思い出だな。\n\tなつかしい　感じだぜ。\n@c0@"
  ko: "@a@b%a002000: 그 납치 사건도\n이제 와서 생각하면 좋은 추억이군.\n그리운 느낌이야.\n@c0@"
  sl: "@a@b%a002000：那时的绑架事件，\n　　现在也都变成了回忆。\n　　真是让人怀念啊。\n@c0@"
  tl: "@a@b%a002000：那時的綁架事件，\n　　現在也都變成了回憶。\n　　真是讓人懷念啊。\n@c0@"
1:
  en: "@a%0%a002010@bShall we visit the Chief since we've come all this way?\n@c0@"
  ja: "@a@b%a002010「せっかく　よったのだから\n\t町長さんに　会っていく？\n@c0@"
  ko: "@a@b%a002010: 이왕 여기까지 왔으니까\n촌장님을 뵙고 갈까?\n@c0@"
  sl: "@a@b%a002010：既然来了，\n　　不去见见镇长吗？\n@c0@"
  tl: "@a@b%a002010：既然來了，\n　　不去見見鎮長嗎？\n@c0@"
2:
  en: "@a%0%a002020@bI hope Cynthia's still doing alright.\n@c0@"
  ja: "@a@b%a002020「エリザちゃんは　元気に\n\tしてるかな？\n@c0@"
  ko: "@a@b%a002020: 엘리자는\n잘 지내고 있을까?\n@c0@"
  sl: "@a@b%a002020：不知道艾莉莎妹妹\n　　过得好不好呢？\n@c0@"
  tl: "@a@b%a002020：不知道艾莉莎妹妹\n　　過得好不好呢？\n@c0@"
3:
  en: "@a%0%a002030@bMay the Goddess smile on Wellshire.\n@c0@"
  ja: "@a@b%a002030「きょうも　トルッカに\n\tゲントの神の　ご加護が\n\tありますように。\n@c0@"
  ko: "@a@b%a002030: 오늘도 트루카에\n겐트 신의 가호가\n함께하기를.\n@c0@"
  sl: "@a@b%a002030：愿根特之神\n　　永远保佑特鲁卡镇。\n@c0@"
  tl: "@a@b%a002030：願根特之神\n　　永遠保佑特魯卡鎮。\n@c0@"
4:
