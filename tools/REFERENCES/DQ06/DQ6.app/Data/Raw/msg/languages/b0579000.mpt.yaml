  tl: "@a@b%a002010：鎮長的臉色相當好啊。\n　　應該是沒再遇到什麼難處。\n@c0@"
10:
  en: "@a%0%a002020@bHe must be overjoyed to see Cynthia safe again.\n@c0@"
  ja: "@a@b%a002020「エリザちゃんが　無事だったから\n\t大よろこび　って感じだね。\n@c0@"
