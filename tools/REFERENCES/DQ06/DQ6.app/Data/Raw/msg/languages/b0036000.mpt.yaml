0:
  en: "@a@b*: Huh? Visitors, eh? Let me ask you something. You ever been to a town called Amor?\n@c0@"
  ja: "@a@b＊「うん？　お客さんか……。\n\tあんた　アモールって町には\n\t行ったことあるかい？\n@c0@"
  ko: "@a@b*: 응? 손님이군......\n당신, 아모르라는 마을에는\n가 봤나?\n@c0@"
  sl: "@a@b＊：嗯？来客人了啊……\n　　你去过那个叫\n　　爱摩尔的镇子了吗？\n@c0@"
  tl: "@a@b＊：嗯？來客人了啊……\n　　你去過那個叫\n　　愛摩爾的鎮子了嗎？\n@c0@"
1:
  en: "@a@b*: I hear you can visit the phantom realm through a well south of there.\n@c0@"
  ja: "@a@b＊「なんでも　その町の南にある\n\t井戸から　まぼろしの大地に\n\t行けるって話だ。\n@c0@"
  ko: "@a@b*: 듣자하니 그 마을 남쪽에 있는\n우물을 통해 몽환의 대지로\n갈 수 있다는군.\n@c0@"
  sl: "@a@b＊：据说那个镇子\n　　南边有一口井。\n　　从那口井可以前往梦幻大地。\n@c0@"
  tl: "@a@b＊：據說那個鎮子\n　　南邊有一口井。\n　　從那口井可以前往夢幻大地。\n@c0@"
2:
  en: "@a@b*: Can't say for sure if it's true, mind you.\n@c0@"
  ja: "@a@b＊「そんなものが　本当に\n\tあるのかどうかは　知らねえけどよ。\n@c0@"
  ko: "@a@b*: 그런 게 진짜로\n있는지는 모르겠지만 말이야.\n@c0@"
  sl: "@a@b＊：不过我不知道\n　　这事是真是假。\n@c0@"
  tl: "@a@b＊：不過我不知道\n　　這事是真是假。\n@c0@"
3:
  en: "@a@b*: Huh? Visitors, eh? Well, how about I let you in on a little secret?\n@c0@"
  ja: "@a@b＊「うん？　お客さんか。\n\tせっかく　来たんだから\n\tいいことを　おしえてやろう。\n@c0@"
  ko: "@a@b*: 응? 손님이군.\n여기까지 왔으니\n좋은 정보를 알려 주지.\n@c0@"
  sl: "@a@b＊：嗯？来客人了啊。\n　　难得来一趟，\n　　我就告诉你有用的消息吧。\n@c0@"
  tl: "@a@b＊：嗯？來客人了啊。\n　　難得來一趟，\n　　我就告訴你有用的消息吧。\n@c0@"
4:
  en: "@a@b*: I hear there's a master swordsmith who lives in some town called Turnscote.\n@c0@"
  ja: "@a@b＊「ロンガデセオという町には\n\tすごうでの　剣職人が\n\t住んでいるそうだぞ。\n@c0@"
  ko: "@a@b*: 론가데세오라는 마을에는\n놀라운 실력을 가진 검 장인이\n살고 있다는군.\n@c0@"
  sl: "@a@b＊：洛卡迪塞欧镇上\n　　有一位非常高明的铸剑师。\n@c0@"
  tl: "@a@b＊：洛卡迪塞歐鎮上\n　　有一位非常高明的鑄劍師。\n@c0@"
5:
  en: "@a@b*: Apparently, this smith can take the rustiest of swords and pound 'em back into shape, good as new.\n@c0@"
  ja: "@a@b＊「そいつに　かかったら\n\tどんな　さびた剣でも　たちまち\n\t新品みたいになるって話だ。\n@c0@"
  ko: "@a@b*: 그 녀석이 잡았다 하면\n아무리 녹슨 검이라도 단번에\n새것처럼 된다고 들었어.\n@c0@"
  sl: "@a@b＊：据说不管锈成什么样的剑，\n　　到那家伙手上的话，\n　　立刻就会变得跟新的一样。\n@c0@"
  tl: "@a@b＊：據說不管鏽成什麼樣的劍，\n　　到那傢伙手上的話，\n　　立刻就會變得跟新的一樣。\n@c0@"
6:
  en: "@a@b*: Say, that sword you've got there looks plenty rusty, doesn't it?\n@c0@"
  ja: "@a@b＊「うへ。　あんたが持ってる　その剣も\n\tずいぶんと　さびついてるなあ。\n@c0@"
  ko: "@a@b*: 호오. 당신이 가지고 있는 그 검도\n제법 녹이 슬어 있군.\n@c0@"
  sl: "@a@b＊：哎呀。你的那把剑\n　　也锈迹斑斑了啊。\n@c0@"
  tl: "@a@b＊：哎呀。你的那把劍\n　　也鏽跡斑斑了啊。\n@c0@"
7:
  en: "@a@b*: Why don't you take it to him and see what he can do? You never know...\n@c0@"
  ja: "@a@b＊「ためしに　その剣職人のところへ\n\t持っていってみちゃ　どうだい？\n@c0@"
  ko: "@a@b*: 시험 삼아 그 장인에게\n가져가 보면 어떻겠나?\n@c0@"
  sl: "@a@b＊：要不要去那个铸剑师那里\n　　一探究竟？\n@c0@"
  tl: "@a@b＊：要不要去那個鑄劍師那裡\n　　一探究竟？\n@c0@"
8:
  en: "@a@b*: The swordsmith in this Turnscote place might be able to pound that rusty sword of yours right back into shape.\n@c0@"
  ja: "@a@b＊「あんたが持ってる　その　さびた剣も\n\tロンガデセオの剣職人なら\n\t新品みたいに　できるかもしれないぜ。\n@c0@"
  ko: "@a@b*: 당신이 가지고 있는 그 녹슨 검도\n론가데세오의 검 장인이라면\n새것처럼 만들어 줄지도 모른다고.\n@c0@"
  sl: "@a@b＊：洛卡迪塞欧的铸剑师\n　　说不定能把你那生锈的剑\n　　变得像新的一样。\n@c0@"
  tl: "@a@b＊：洛卡迪塞歐的鑄劍師\n　　說不定能把你那生鏽的劍\n　　變得像新的一樣。\n@c0@"
9:
  en: "@a@b*: Why don't you pay him a visit?\n@c0@"
  ja: "@a@b＊「ためしに　持っていってみちゃ\n\tどうだい？\n@c0@"
  ko: "@a@b*: 시험 삼아 가져가 보면\n어떻겠나?\n@c0@"
  sl: "@a@b＊：要不要拿剑\n　　去试一试？\n@c0@"
  tl: "@a@b＊：要不要拿劍\n　　去試一試？\n@c0@"
10:
  en: "@a@b*: Well met! I am on a quest in search of four legendary relics!\n@c0@"
  ja: "@a@b＊「オレは　伝説の武具をさがして\n\t旅をしている。\n@c0@"
  ko: "@a@b*: 나는 전설의 장비를 찾아\n여행을 하고 있지.\n@c0@"
  sl: "@a@b＊：我为了寻找传说中的武具\n　　而踏上了旅程。\n@c0@"
  tl: "@a@b＊：我為了尋找傳說中的武具\n　　而踏上了旅程。\n@c0@"
11:
  en: "@a@b*: I had heard that one among them might be found in the depths of a cave somewhere.\n@c0@"
  ja: "@a@b＊「その１つが　どこかの洞くつにあると\n\t聞き　ここまで　やってきたが……。\n@c0@"
  ko: "@a@b*: 그중 하나가 어느 동굴에 있다는\n이야기를 듣고 여기까지 왔는데......\n@c0@"
  sl: "@a@b＊：我听说其中一件在某个洞窟里，\n　　于是来到了这里……\n@c0@"
  tl: "@a@b＊：我聽說其中一件在某個洞窟裡，\n　　於是來到了這裡……\n@c0@"
12:
  en: "@a@b*: But alas, it seems that this is not the one...\n@c0@"
  ja: "@a@b＊「どうやら　この洞くつでは\n\tなかったようだな。\n@c0@"
  ko: "@a@b*: 아무래도 이 동굴은\n아닌가 보군.\n@c0@"
  sl: "@a@b＊：好像不是这个洞窟呢。\n@c0@"
  tl: "@a@b＊：好像不是這個洞窟呢。\n@c0@"
