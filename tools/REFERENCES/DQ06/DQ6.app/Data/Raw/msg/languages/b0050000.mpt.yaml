0:
  en: "@a@b*: Here we're safe and happy, so here is where we'll stay.\n㈡\n*: And near the sea where Unda went, we'll never, ever stray.\n@c0@"
  ja: "@a@b＊「ここは　とっても　おだやかよ。\n\tでも　ディーネが　まよっていた\n\tあっちの海には　行っちゃダメ！\n@c0@"
  ko: "@a@b*: 여긴 아주 평온해.\n하지만 디네가 길을 잃었던\n그쪽 바다엔 가면 안 돼!\n@c0@"
  sl: "@a@b＊：这片海域非常的宁静。\n　　但是，你们千万不要去\n　　蒂妮曾经走失的那片海域。\n@c0@"
  tl: "@a@b＊：這片海域非常的寧靜。\n　　但是，你們千萬不要去\n　　蒂妮曾經走失的那片海域。\n@c0@"
1:
  en: "@a@b*: For in that ghastly place there lurks an evil, evil mage...\n㈡\n*: Who revels in his victims' anguish, horror, fear and rage.\n@c0@"
  ja: "@a@b＊「あの海の底には\n\tとても　こわい　悪魔が\n\tすんでいるって話だから……。\n@c0@"
  ko: "@a@b*: 그 바다 깊은 곳에는\n아주 무서운 악마가\n살고 있다고 하니까......\n@c0@"
  sl: "@a@b＊：传说，那片海域的海底\n　　住着一个非常可怕的恶魔……\n@c0@"
  tl: "@a@b＊：傳說，那片海域的海底\n　　住著一個非常可怕的惡魔……\n@c0@"
2:
  en: "@a@b*: Tee hee hee!\n@c0@"
  ja: "@a@b＊「うふふ。\n@c0@"
  ko: "@a@b*: 우후후.\n@c0@"
  sl: "@a@b＊：呵呵呵。\n@c0@"
  tl: "@a@b＊：呵呵呵。\n@c0@"
3:
  en: "@a@b*: Do you like the ocean? It's where I want to be.\n㈡\n*: There seems to me no better place than down beneath the sea.\n@c0@"
  ja: "@a@b＊「どう　海の中は？\n\tここが　私たちの世界なのよ。\n@c0@"
  ko: "@a@b*: 바닷속은 어때?\n여기가 우리의 세계야.\n@c0@"
  sl: "@a@b＊：海里的感觉如何？\n　　这里可是我们的世界了哟。\n@c0@"
  tl: "@a@b＊：海裡的感覺如何？\n　　這裡可是我們的世界了喲。\n@c0@"
4:
  en: "@a@b*: Tee hee hee!\n@c0@"
  ja: "@a@b＊「うふふ。\n@c0@"
  ko: "@a@b*: 우후후.\n@c0@"
  sl: "@a@b＊：呵呵呵。\n@c0@"
  tl: "@a@b＊：呵呵呵。\n@c0@"
5:
  en: "@a@b*: Far to the south-east of this place, you'll find Poseidon's keep.\n㈡\n*: A proud and princely palace built by the King of the Deep.\n@c0@"
  ja: "@a@b＊「ここから　ずーっと南東の海にはね\n\t海底世界の王　ポセイドンさまの\n\tお城があるのよ。\n@c0@"
  ko: "@a@b*: 여기서 남동쪽으로 한참 떨어진 바다엔\n해저 세계의 왕, 포세이돈 님의\n성이 있어.\n@c0@"
  sl: "@a@b＊：海王波塞冬大人的城堡\n　　就坐落在遥远的东南方的海底。\n@c0@"
  tl: "@a@b＊：海王波塞冬大人的城堡\n　　就坐落在遙遠的東南方的海底。\n@c0@"
6:
  en: "@aTreasury Guard@bGot your beady eye on this treasure, have you?\n@c0@"
  ja: "@a@b兵士「もし　この先の宝が　ほしいなら\n\tこの私を　たおしてゆくがいい。\n@c0@"
  ko: "@a@b병사: 이 앞의 보물이 탐난다면\n여기 있는 나를 쓰러뜨리고 가거라.\n@c0@"
  sl: "@a@b士兵：想要拿到里面的宝物，\n　　必须先把我打败才行。\n@c0@"
  tl: "@a@b士兵：想要拿到裡面的寶物，\n　　必須先把我打敗才行。\n@c0@"
7:
  en: "@aTreasury Guard@bWell, you won't take it without a fight!\n@c0@"
  ja: "@a@b兵士「では　ゆくぞ！\n@c0@"
  ko: "@a@b병사: 그럼 시작한다!\n@c0@"
  sl: "@a@b士兵：看招吧！\n@c0@"
  tl: "@a@b士兵：看招吧！\n@c0@"
8:
  en: "@aTreasury Guard@bWell then, make yourself scarce!\n@c0@"
  ja: "@a@b兵士「では　立ち去るがよい。\n@c0@"
  ko: "@a@b병사: 그럼 물러가거라.\n@c0@"
  sl: "@a@b士兵：那就快些离开吧。\n@c0@"
  tl: "@a@b士兵：那就快些離開吧。\n@c0@"
