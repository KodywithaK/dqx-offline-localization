0:
  en: "@a@b*: For many years, I have been engaged in research on the Celestial Castle.\n@c0@"
  ja: "@a@b＊「私は長年　神の城についての\n\t研究をしてきた。\n@c0@"
  ko: "@a@b*: 나는 오래도록 신의 성에 대해\n연구해 왔다.\n@c0@"
  sl: "@a@b＊：多年以来我一直研究神之城。\n@c0@"
  tl: "@a@b＊：多年以來我一直研究神之城。\n@c0@"
1:
  en: "@a@b*: I've managed to uncover one of the puzzles encrypted in legend.\n@c0@"
  ja: "@a@b＊「そして　言い伝えの１つを\n\t解明することが　できたのだ。\n@c0@"
  ko: "@a@b*: 그리고 전설 중 하나를\n밝혀내는 데에 성공했지.\n@c0@"
  sl: "@a@b＊：然后终于解读了一段文字。\n@c0@"
  tl: "@a@b＊：然後終於解讀了一段文字。\n@c0@"
2:
  en: "@a@b*: Listen up and I shall enlighten you!\n@c0@"
  ja: "@a@b＊「今こそ　それを　おしえよう！\n@c0@"
  ko: "@a@b*: 지금 그것을 알려 주겠다!\n@c0@"
  sl: "@a@b＊：现在就告诉你吧！\n@c0@"
  tl: "@a@b＊：現在就告訴你吧！\n@c0@"
3:
  en: "@a@b*: ‘Head to head. Right hand to right hand. Body to body. Arrange the symbols and I shall appear.’\n@c0@"
  ja: "@a@b＊「頭は頭に　右手は右手に　胴は胴。\n\tしるしを　しめせば　我　現れん！\n@c0@"
  ko: "@a@b*: 머리는 머리에, 오른손은 오른손에,\n몸통은 몸통.\n증표를 보이면 내가 나타나리!\n@c0@"
  sl: "@a@b＊：头对着头，右手对着右手，身体对着身体。\n　　展现印记就会开启新的道路！\n@c0@"
  tl: "@a@b＊：頭對著頭，右手對著右手，身體對著身體。\n　　展現印記就會開啟新的道路！\n@c0@"
4:
  en: "@a@b*: ...Just what can this all mean!?\n@c0@"
  ja: "@a@b＊「ふーむ……。　しかし　いったい\n\tなんのことなのか……。\n@c0@"
  ko: "@a@b*: 흐음...... 헌데 대체\n무슨 소린지......\n@c0@"
  sl: "@a@b＊：嗯……\n　　不过这到底是指什么呢……\n@c0@"
  tl: "@a@b＊：嗯……\n　　不過這到底是指什麼呢……\n@c0@"
5:
  en: "@a@b%0%a000120 examines the area around %A0120%Xhis%Z%B0120%Xher%Z feet.\n@c0@"
  ja: "@a@b%a000120は　足もとを　調べた！\n@c0@"
  ko: "@a@b%a000120%F0120%X는%Y은%Z 발밑을 살펴봤다!\n@c0@"
  sl: "@a@b%a000120调查了脚下！\n@c0@"
  tl: "@a@b%a000120調查了腳下！\n@c0@"
6:
  en: "@a@b%0%a000120 finds a hidden staircase!\n@c0@"
  ja: "@a@bなんと　階段を　みつけた！\n@c0@"
  ko: "@a@b놀랍게도 계단을 발견했다!\n@c0@"
  sl: "@a@b发现了台阶！\n@c0@"
  tl: "@a@b發現了臺階！\n@c0@"
7:
  en: "@aKing Poseidon@bI say! You've managed to get hold of the legendary Shield of Valora!\n@c0@"
  ja: "@a@b＊「おお！　どうやら　伝説に語られる\n\tスフィーダの盾を\n\t手にいれたようじゃなっ！\n@c0@"
  ko: "@a@b*: 오오! 보아하니 전설로 전해 내려오는\n스피더의 방패를\n손에 넣은 모양이군!\n@c0@"
  sl: "@a@b＊：哦哦！看起来，\n　　你们已经拿到了\n　　传说中的斯费达之盾！\n@c0@"
  tl: "@a@b＊：哦哦！看起來，\n　　你們已經拿到了\n　　傳說中的斯費達之盾！\n@c0@"
8:
  en: "@aKing Poseidon@bIt is well within the realms of possibility that you will be invited to enter the Celestial Castle.\n@c0@"
  ja: "@a@b＊「そなたたちであれば\n\t神の城に　まねかれるのも\n\t夢では　あるまい。\n@c0@"
  ko: "@a@b*: 그대들이라면\n신의 성에 초대받는 일도\n꿈이 아닐 게야.\n@c0@"
  sl: "@a@b＊：这样一来，\n　　你们很快就能进入神之城了。\n@c0@"
  tl: "@a@b＊：這樣一來，\n　　你們很快就能進入神之城了。\n@c0@"
9:
  en: "@aKing Poseidon@bSay again!? You've already been to that castle in the sky?\n@c0@"
  ja: "@a@b＊「なんと！　すでに\n\t立ち入ったと　いうのか！\n\tあの　天空の城に……。\n@c0@"
  ko: "@a@b*: 아니! 이미\n들어가 봤단 말인가!\n그 천공의 성에......\n@c0@"
  sl: "@a@b＊：什么！\n　　你们已经去过了！\n　　那座天空之城……\n@c0@"
  tl: "@a@b＊：什麼！\n　　你們已經去過了！\n　　那座天空之城……\n@c0@"
10:
  en: "@aKing Poseidon@bThat would mean... Ahem! Anyway, you have indeed lived up to my expectations. Well done!\n@c0@"
  ja: "@a@b＊「すると　やはり　そなたたちが……\n\tうむっ　さすがに　わしが\n\t見込んだだけのことは　あるのう。\n@c0@"
  ko: "@a@b*: 그렇다면 역시 그대들이......\n음. 역시 내가\n인정한 자들답군.\n@c0@"
  sl: "@a@b＊：这么说你们果然是……\n　　嗯，不愧是我看重的人。\n@c0@"
  tl: "@a@b＊：這麼說你們果然是……\n　　嗯，不愧是我看重的人。\n@c0@"
11:
  en: "@a@b*: Long ago, two wise men by the names of Isaac and Benjamin ventured down here.\n@c0@"
  ja: "@a@b＊「昔　ここへ来た　マサールと\n\tクリムトっていう　２人の賢者……\n@c0@"
  ko: "@a@b*: 옛날에 이곳에 왔던 마살과\n클림트라는 두 현자......\n@c0@"
  sl: "@a@b＊：这里曾经来过两位贤者，\n　　名叫马萨尔和克林姆……\n@c0@"
  tl: "@a@b＊：這裡曾經來過兩位賢者，\n　　名叫馬薩爾和克林姆……\n@c0@"
12:
  en: "@a@b*: I wonder what ever became of them...\n@c0@"
  ja: "@a@b＊「今頃　どこで\n\tなにを　しているのかしら。\n@c0@"
  ko: "@a@b*: 지금쯤 어디서\n뭘 하고 있을까?\n@c0@"
  sl: "@a@b＊：不知道他们现在\n　　在哪里做什么。\n@c0@"
  tl: "@a@b＊：不知道他們現在\n　　在哪裡做什麼。\n@c0@"
13:
  en: "@a@b*: I know, you know. You were invited to the Celestial Castle.\n@c0@"
  ja: "@a@b＊「私　知ってるのよ。\n\tあなたたちが　神の城に\n\tまねかれたってこと！\n@c0@"
  ko: "@a@b*: 나, 알고 있어.\n당신들이 신의 성에\n초대받았던 거!\n@c0@"
  sl: "@a@b＊：我知道你们。\n　　你们是被神之城邀请的人！\n@c0@"
  tl: "@a@b＊：我知道你們。\n　　你們是被神之城邀請的人！\n@c0@"
14:
  en: "@a@b*: With a name like that, I imagine it's a spectacular place. Am I right?\n@c0@"
  ja: "@a@b＊「ねえ　やっぱり\n\t神の城って　いうくらいなんだから\n\tステキな場所なんでしょう？\n@c0@"
  ko: "@a@b*: 저기 있잖아,\n신의 성이라고 불릴 정도니까\n아주 멋진 곳이겠지?\n@c0@"
  sl: "@a@b＊：诶，我问你，\n　　神之城是一个特别漂亮的地方，\n　　对不对？\n@c0@"
  tl: "@a@b＊：誒，我問你，\n　　神之城是一個特別漂亮的地方，\n　　對不對？\n@c0@"
15:
  en: "@a@b*: Oh, I'm so very jealous! I'd give anything to go. But I'm sure Father would never allow it...\n@c0@"
  ja: "@a@b＊「いいなあ。　私も　行ってみたい！\n\tけど……　パパは絶対に\n\tダメって　いうだろうなあ……。\n@c0@"
  ko: "@a@b*: 좋겠다. 나도 가 보고 싶어!\n하지만...... 아빠는 절대로\n안 보내 주실 거야......\n@c0@"
  sl: "@a@b＊：真羡慕啊。我也想去！\n　　但是……\n　　爸爸一定不会让我去。\n@c0@"
  tl: "@a@b＊：真羡慕啊。我也想去！\n　　但是……\n　　爸爸一定不會讓我去。\n@c0@"
16:
  en: "@a@b*: Father seems ever so irritable these days. I wonder what's the matter with him.\n@c0@"
  ja: "@a@b＊「なんだか　最近\n\tピリピリしてるのよ　パパ。\n\tいったい　どうしちゃったのかしら。\n@c0@"
  ko: "@a@b*: 왠지 요새 들어서\n부쩍 예민해지셨더라구, 우리 아빠.\n대체 왜 그러시는 걸까?\n@c0@"
  sl: "@a@b＊：他最近老是绷着脸。\n　　到底是怎么了嘛。\n@c0@"
  tl: "@a@b＊：他最近老是繃著臉。\n　　到底是怎麼了嘛。\n@c0@"
17:
  en: "@a@b*: It's full of monsters...? Even though it's in the sky!?\n@c0@"
  ja: "@a@b＊「えっ　まものが　いっぱいいるの？\n\t神様の　お城なのに？\n@c0@"
  ko: "@a@b*: 응? 마물이 잔뜩 있다구?\n신이 사는 성인데도?\n@c0@"
  sl: "@a@b＊：哎，你说有许多魔物？\n　　在神明的城里？\n@c0@"
  tl: "@a@b＊：哎，你說有許多魔物？\n　　在神明的城裡？\n@c0@"
18:
  en: "@a@b*: Monsters truly are everywhere these days. The seabed, the heavens... What is going on?\n@c0@"
  ja: "@a@b＊「海だけじゃなくて　空にまで\n\tまものが　いるなんて……\n\tいったい　どうなっているのかしら。\n@c0@"
  ko: "@a@b*: 바다뿐 아니라 하늘에까지\n마물이 있다니......\n대체 어떻게 된 걸까?\n@c0@"
  sl: "@a@b＊：不止大海里，\n　　连天上都有魔物……\n　　这到底是怎么了嘛。\n@c0@"
  tl: "@a@b＊：不止大海裡，\n　　連天上都有魔物……\n　　這到底是怎麼了嘛。\n@c0@"
19:
  en: "@a@b*: I know, you know. You were invited to the Celestial Castle.\n@c0@"
  ja: "@a@b＊「私　知ってるのよ。\n\tあなたたちが　神の城に\n\tまねかれたってこと！\n@c0@"
