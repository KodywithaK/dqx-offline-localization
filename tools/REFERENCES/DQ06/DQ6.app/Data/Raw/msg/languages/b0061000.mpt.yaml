21:
  en: "@a@b*: I just knew it!\n@c0@"
  ja: "@a@b＊「あはっ　やっぱり！\n@c0@"
  ko: "@a@b*: 아하, 역시 그렇구나!\n@c0@"
  sl: "@a@b＊：啊，果然是！\n@c0@"
  tl: "@a@b＊：啊，果然是！\n@c0@"
22:
  en: "@a@b*: The castle I saw in my dreams was truly breathtaking. I can't wait to see the real thing.\n@c0@"
  ja: "@a@b＊「私が　夢の中で見た　お城も\n\tとっても　ステキだったの。\n\tいつか　本物を　見てみたいわ。\n@c0@"
  ko: "@a@b*: 내가 꿈에서 봤던 성도\n아주 멋졌어.\n언젠가 실물을 보고 싶어.\n@c0@"
  sl: "@a@b＊：我梦到过那座城堡，\n　　特别的漂亮。\n　　什么时候能真的去看看呢。\n@c0@"
  tl: "@a@b＊：我夢到過那座城堡，\n　　特別的漂亮。\n　　什麼時候能真的去看看呢。\n@c0@"
23:
  en: "@a@b*: Oh dear...\n@c0@"
  ja: "@a@b＊「えっ　そうなの？\n@c0@"
  ko: "@a@b*: 어, 그래?\n@c0@"
  sl: "@a@b＊：哎，真的吗？\n@c0@"
  tl: "@a@b＊：哎，真的嗎？\n@c0@"
24:
  en: "@a@b*: Reality doesn't measure up sometimes. Still, the castle in my dreams was truly breathtaking...\n@c0@"
  ja: "@a@b＊「現実は　キビシイのね……。\n\tでも　いいの。　私が見た　夢の中では\n\tとってもステキな　場所だったもの！\n@c0@"
  ko: "@a@b*: 현실은 냉엄하구나......\n하지만 괜찮아. 내가 봤던 꿈속에서는\n아주 멋진 곳이었으니까 말이야!\n@c0@"
  sl: "@a@b＊：现实真残酷啊……\n　　不过，没关系。\n　　梦里的城堡是个很漂亮的地方！\n@c0@"
  tl: "@a@b＊：現實真殘酷啊……\n　　不過，沒關係。\n　　夢裡的城堡是個很漂亮的地方！\n@c0@"
