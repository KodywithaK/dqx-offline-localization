  sl: "@a@b%a002030：今后的荷尔斯托克也会\n　　慢慢成为一个好国家吧。\n@c0@"
  tl: "@a@b%a002030：今後的荷爾斯托克也會\n　　慢慢成為一個好國家吧。\n@c0@"
258:
  en: "@a%0%a002020@bIf you ask me, the Prince needed a good spanking ages ago.\n@c0@"
  ja: "@a@b%a002020「あたしだったら\n\tあんな　王子のこと　さっさと\n\t投げ出しちゃってたと思うな。\n@c0@"
  ko: "@a@b%a002020: 나 같았으면\n그런 왕자는 일찌감치\n내쫓았을 거야.\n@c0@"
  sl: "@a@b%a002020：要是我的话，\n　　碰上那种王子\n　　我肯定早就破罐子破摔啦。\n@c0@"
  tl: "@a@b%a002020：要是我的話，\n　　碰上那種王子\n　　我肯定早就破罐子破摔啦。\n@c0@"
259:
  en: "@a%0%a002040@bI've heard enough about this prince.\n@c0@"
  ja: "@a@b%a002040「相手が　王子とはいえ\n\tふりまわされるほうも　悪いのさ。\n@c0@"
  ko: "@a@b%a002040: 상대가 왕자라곤 해도\n휘둘리는 쪽도 나쁘지.\n@c0@"
  sl: "@a@b%a002040：就算对方是王子，\n　　被肆意摆弄的人自身也有不对的地方。\n@c0@"
  tl: "@a@b%a002040：就算對方是王子，\n　　被肆意擺弄的人自身也有不對的地方。\n@c0@"
260:
