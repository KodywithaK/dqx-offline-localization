  tl: "@a@b%a002010：跟場所無關，\n　　重要的是有一顆想要\n　　改變自己的心。\n@c0@"
265:
  en: "@a%0%a002030@bPrince Howard is a coward no more.\n@c0@"
  ja: "@a@b%a002030「もう　ホルス王子は\n\t弱虫でも　毛虫でも　ないですね。\n@c0@"
