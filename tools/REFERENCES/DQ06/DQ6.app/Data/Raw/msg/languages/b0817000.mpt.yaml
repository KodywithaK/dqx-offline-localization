  ja: "@a@b＊「ご入金は　１０００ゴールド単位で\n\tうけたまわります。\n\tいくら　お預かりしましょうか？\n@c0@"
  ko: "@a@b*: 입금은 1000골드 단위로\n하실 수 있습니다.\n얼마를 맡아 드릴까요?\n@c0@"
  sl: "@a@b＊：存款是以１０００金币为单位的。\n　　您要存多少呢？\n@c0@"
  tl: "@a@b＊：存款是以１０００金幣為單位的。\n　　您要存多少呢？\n@c0@"
6:
