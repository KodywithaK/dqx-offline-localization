0:
  en: "@a@b*: Welcome to Rainbow's End Gold Bank, protectin' yer hard-earned gold from the likes of monsters and criminals.\n@c0@"
  ja: "@a@b＊「愛と信頼のゴールド銀行へ　ようこそ。\n\tみなさまの　大切な　お金を\n\t魔物などから　お守りします。\n@c0@"
  ko: "@a@b*: 사랑과 신용의 골드 은행입니다.\n여러분의 소중한 돈을\n마물 등으로부터 지켜 드립니다.\n@c0@"
  sl: "@a@b＊：欢迎来到爱与信赖的金币银行。\n　　我们会从魔物手中\n　　守护您最重要的财产。\n@c0@"
  tl: "@a@b＊：歡迎來到愛與信賴的金幣銀行。\n　　我們會從魔物手中\n　　守護您最重要的財產。\n@c0@"
1:
  en: "@a@b*: Here at Rainbow's End we only deal in units of a thousand gold coins. That goes for deposits an' withdrawals alike.\n@c0@"
  ja: "@a@b＊「お預かりも　お引き出しも\n\t１０００ゴールド単位で\n\tうけたまわります。\n@c0@"
  ko: "@a@b*: 돈을 맡기실 때도 찾으실 때도\n1000골드 단위로\n거래하실 수 있습니다.\n@c0@"
  sl: "@a@b＊：金币是以１０００金币为单位\n　　进行储存和提取的。\n@c0@"
  tl: "@a@b＊：金幣是以１０００金幣為單位\n　　進行儲存和提取的。\n@c0@"
2:
  en: "@a@b*: And we don't even charge ye any fees!\n@c0@"
  ja: "@a@b＊「もちろん　手数料などは\n\tいっさい　いただきません！\n@c0@"
  ko: "@a@b*: 물론 수수료 등은\n일절 받지 않습니다!\n@c0@"
  sl: "@a@b＊：当然，\n　　我们是一概不收手续费的！\n@c0@"
  tl: "@a@b＊：當然，\n　　我們是一概不收手續費的！\n@c0@"
3:
  en: "@a@b*: So, %a000120... What can we be doin' fer ye?\n@c0@"
  ja: "@a@b＊「%a000120さまは\n\tどんな　ご用でしょう？\n@c0@"
  ko: "@a@b*: %a000120 님은\n무슨 일로 오셨습니까?\n@c0@"
  sl: "@a@b＊：%a000120\n　　有什么需要吗？\n@c0@"
  tl: "@a@b＊：%a000120\n　　有什麼需要嗎？\n@c0@"
4:
  en: "@a@b*: I'm terribly sorry, %A0110%Xsir%Z%B0120%Xma'am%Z, but it seems the vault's full already. We can't be acceptin' any more deposits, like.\n@c0@"
  ja: "@a@b＊「お客さま　申しわけありませんが\n\tわたくしどもの金庫が　いっぱいで\n\tこれ以上　お預かりできません。\n@c0@"
  ko: "@a@b*: 손님, 죄송하지만\n저희의 금고가 가득 차서\n더 이상 맡아 드릴 수 없습니다.\n@c0@"
  sl: "@a@b＊：客人，非常抱歉，\n　　我们的金库已经满了，\n　　不能再存入更多金币了。\n@c0@"
  tl: "@a@b＊：客人，非常抱歉，\n　　我們的金庫已經滿了，\n　　不能再存入更多金幣了。\n@c0@"
5:
