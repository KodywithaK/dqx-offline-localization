  ja: "@a@b＊「失礼ですが\n\tお客さまは　今　それほど\n\tお持ちではないようです。\n@c0@"
  ko: "@a@b*: 죄송하지만\n손님은 지금 그 정도로\n갖고 계시지 않은 것 같습니다.\n@c0@"
  sl: "@a@b＊：不好意思，\n　　客人您现在好像\n　　没有带那么多钱。\n@c0@"
  tl: "@a@b＊：不好意思，\n　　客人您現在好像\n　　沒有帶那麼多錢。\n@c0@"
