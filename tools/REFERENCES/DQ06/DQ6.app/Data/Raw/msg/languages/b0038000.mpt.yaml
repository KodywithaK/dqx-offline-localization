0:
  en: "@a@b*: Welcome, %H0860%Xwanderer%Ywanderers%Z. Do you find %H0860%Xyourself%Yyourselves%Z lost on the road of life?\n@c0@"
  ja: "@a@b＊「ようこそ　うらないの館に。\n\t道に　お迷いですか？\n@c0@"
  ko: "@a@b*: 점술관에 오신 걸 환영합니다.\n길을 잃으셨나요?\n@c0@"
  sl: "@a@b＊：欢迎来到占卜之馆。\n　　你迷路了吗？\n@c0@"
  tl: "@a@b＊：歡迎來到占卜之館。\n　　你迷路了嗎？\n@c0@"
1:
  en: "@a@b*: Then allow me to put you back on the right path.\n@c0@"
  ja: "@a@b＊「では　うらなってしんぜましょう。\n@c0@"
  ko: "@a@b*: 그럼 점을 봐 드리지요.\n@c0@"
  sl: "@a@b＊：那我就来占上一卦吧。\n@c0@"
  tl: "@a@b＊：那我就來占上一卦吧。\n@c0@"
2:
  en: "@a@b*: Oh, dear... I...I see people fleeing in terror as the sea swallows their island...\n@c0@"
  ja: "@a@b＊「なんと！　島ごと　海に飲まれる\n\t町の人びとの姿が　見えます。\n@c0@"
  ko: "@a@b*: 세상에! 바다가 통째로 집어삼킨\n섬마을 사람들의 모습이 보입니다.\n@c0@"
  sl: "@a@b＊：什么！我看见人们\n　　跟一整块岛一起被海水吞噬。\n@c0@"
  tl: "@a@b＊：什麼！我看見人們\n　　跟一整塊島一起被海水吞噬。\n@c0@"
3:
  en: "@a@b*: C-Could this be Sorceria? The fabled city of magic that sank below the ocean all those aeons ago?\n@c0@"
  ja: "@a@b＊「こ　これは　もしや　その昔\n\t海に沈んだといわれる　伝説の\n\t魔法都市カルベローナの姿では……？\n@c0@"
  ko: "@a@b*: 이, 이건 혹시 먼 옛날 바닷속으로\n가라앉았다는 전설의 마법도시\n칼베로나의 모습이 아닐지......?\n@c0@"
  sl: "@a@b＊：这难道就是\n　　传说过去沉到了海底的\n　　魔法都市卡尔贝罗纳吗？\n@c0@"
  tl: "@a@b＊：這難道就是\n　　傳說過去沉到了海底的\n　　魔法都市卡爾貝羅納嗎？\n@c0@"
4:
  en: "@a@b*: What have you to do with this ancient disaster? Just who are you?\n@c0@"
  ja: "@a@b＊「こんな物が　見えるなんて\n\tあなたたちは　いったい……。\n@c0@"
  ko: "@a@b*: 이런 게 보이다니\n당신들은 대체......\n@c0@"
  sl: "@a@b＊：居然能看到这样的事情。\n　　你们究竟是……\n@c0@"
  tl: "@a@b＊：居然能看到這樣的事情。\n　　你們究竟是……\n@c0@"
5:
  en: "@a@b*: Then I shall leave you to find your own path. Travel true, %H0860%Xfriend%Yfriends%Z.\n@c0@"
  ja: "@a@b＊「それならば　なにも　いいますまい。\n\tどうか　お気をつけて。\n@c0@"
  ko: "@a@b*: 그렇다면 더 드릴 말씀이 없습니다.\n부디 몸조심하세요.\n@c0@"
  sl: "@a@b＊：这样的话，我无话可说了。\n　　请万事小心。\n@c0@"
  tl: "@a@b＊：這樣的話，我無話可說了。\n　　請萬事小心。\n@c0@"
