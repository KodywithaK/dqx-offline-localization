8:
  en: "@a@b*: Oh, my! I see a winged horse soaring across the sky!\n@c0@"
  ja: "@a@b＊「なんと！　空駆ける　天馬の姿が\n\t見えます。\n@c0@"
  ko: "@a@b*: 세상에! 하늘을 달리는 천마의 모습이\n보입니다.\n@c0@"
  sl: "@a@b＊：什么！我看见了\n　　在天空中驰骋的天马的身姿。\n@c0@"
  tl: "@a@b＊：什麼！我看見了\n　　在天空中馳騁的天馬的身姿。\n@c0@"
9:
  en: "@a@b*: Are...are you %H0860%Xan emissary%Yemissaries%Z of the Goddess, perhaps?㈢ But no. You could not be. What a peculiar vision...\n@c0@"
  ja: "@a@b＊「も　もしや　あなたがたは神の使い？㈢\n\t……と　いうようには　見えませんね。\n\tなんなのかしら　これは……。\n@c0@"
  ko: "@a@b*: 호, 혹시 당신들은 신의 사자?㈢\n......그런 것 같아 보이진 않는데.\n뭘까요, 이건......\n@c0@"
  sl: "@a@b＊：难、难道你们是神之使者？㈢\n　　……好像不太像呢。\n　　这到底是怎么回事啊……\n@c0@"
  tl: "@a@b＊：難、難道你們是神之使者？㈢\n　　……好像不太像呢。\n　　這到底是怎麼回事啊……\n@c0@"
