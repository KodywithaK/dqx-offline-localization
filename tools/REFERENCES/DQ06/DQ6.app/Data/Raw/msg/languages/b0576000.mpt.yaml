0:
  en: "@a%0%a002000@bHuh? Hang on, did he mutter somethin' about mermaids?\n@c0@"
  ja: "@a@b%a002000「あいつ　いま\n\t人魚とか　言ってたよな？\n\t本当なのかよ！？\n@c0@"
  ko: "@a@b%a002000: 저 녀석, 지금\n인어라고 했지?\n진짜인가!?\n@c0@"
  sl: "@a@b%a002000：那家伙\n　　刚才说了人鱼吧？\n　　真的假的？！\n@c0@"
  tl: "@a@b%a002000：那傢伙\n　　剛才說了人魚吧？\n　　真的假的？！\n@c0@"
1:
  en: "@a%0%a002010@bDid he say ‘mermaids’? What in the world could he have been talking about?\n@c0@"
  ja: "@a@b%a002010「人魚ですって？\n\tあの人　いったい　なにを\n\t言っているのかしら……？\n@c0@"
  ko: "@a@b%a002010: 인어라고?\n저 사람, 대체 무슨 소릴\n하는 걸까......?\n@c0@"
  sl: "@a@b%a002010：人鱼？\n　　那人究竟在\n　　说什么啊……\n@c0@"
  tl: "@a@b%a002010：人魚？\n　　那人究竟在\n　　說什麼啊……\n@c0@"
2:
  en: "@a%0%a002020@bI believe in mermaids! Well, I want to, anyway. The whole idea is kind of romantic, you know?\n@c0@"
  ja: "@a@b%a002020「あたし　人魚は　いると思う！\n\tだって　そう　考えたほうが\n\tロマンチックじゃない！\n@c0@"
  ko: "@a@b%a002020: 나는 인어가 있을 거라 생각해!\n그렇게 생각하는 게\n더 로맨틱하잖아!\n@c0@"
  sl: "@a@b%a002020：我相信有人鱼哦！\n　　要是有人鱼的话\n　　那多浪漫啊！\n@c0@"
  tl: "@a@b%a002020：我相信有人魚哦！\n　　要是有人魚的話\n　　那多浪漫啊！\n@c0@"
3:
  en: "@a%0%a002030@bSalty sea dogs have traded rumours of mermaid-sightings since time immemorial.\n@c0@"
  ja: "@a@b%a002030「人魚のウワサは\n\t海の男たちの間では　昔から\n\tよく　あるようです。\n@c0@"
  ko: "@a@b%a002030: 인어에 대한 소문은\n바다 남자들 사이에서는 옛날부터\n자주 있었다고 합니다.\n@c0@"
  sl: "@a@b%a002030：从很久以前开始，\n　　船员之间就在流传\n　　人鱼的传说。\n@c0@"
  tl: "@a@b%a002030：從很久以前開始，\n　　船員之間就在流傳\n　　人魚的傳說。\n@c0@"
4:
  en: "@a%0%a002050@bOld %a002050'd love to meet a mermaid! 'Course, a regular woman would be just fine too...\n@c0@"
  ja: "@a@b%a002050「本当に　人魚がいるなら\n\t１度　会ってみたいものですね！\n\t女性が　いいですが。\n@c0@"
  ko: "@a@b%a002050: 진짜 인어가 있다면\n한번 만나 보고 싶네요!\n이왕이면 여성으로 말이죠.\n@c0@"
  sl: "@a@b%a002050：要是真的有人鱼的话，\n　　我真想见一见啊！\n　　要是是女性就好了。\n@c0@"
  tl: "@a@b%a002050：要是真的有人魚的話，\n　　我真想見一見啊！\n　　要是是女性就好了。\n@c0@"
5:
  en: "@a%0%a002000@b‘Used to be’? What, did he fall overboard or somethin'?\n@c0@"
  ja: "@a@b%a002000「村いちばんの　漁師だった？\n\tいまは　ちがうってことか。\n@c0@"
  ko: "@a@b%a002000: 마을에서 제일가는 어부였다고?\n지금은 아니라는 뜻인가?\n@c0@"
  sl: "@a@b%a002000：曾经是村里最厉害的渔夫？\n　　就是说现在不是了吧。\n@c0@"
  tl: "@a@b%a002000：曾經是村裡最厲害的漁夫？\n　　就是說現在不是了吧。\n@c0@"
6:
  en: "@a%0%a002010@bI wonder what happened to this Rod...\n@c0@"
  ja: "@a@b%a002010「何が　どう\n\t困った　なのかしらね。\n@c0@"
  ko: "@a@b%a002010: 뭐 때문에\n안됐다는 걸까?\n@c0@"
  sl: "@a@b%a002010：到底为什么\n　　会伤脑筋呢。\n@c0@"
  tl: "@a@b%a002010：到底為什麼\n　　會傷腦筋呢。\n@c0@"
7:
  en: "@a%0%a002020@bHmm. Is this Rod guy a troublemaker or something?\n@c0@"
  ja: "@a@b%a002020「ロブって人\n\tなんか　村の人たちに\n\tめいわくでも　かけてるのかな？\n@c0@"
  ko: "@a@b%a002020: 롭이라는 사람,\n마을 사람들한테\n피해를 주고 있는 건가?\n@c0@"
  sl: "@a@b%a002020：那个叫洛布的人\n　　是不是给村里的人们\n　　添麻烦了啊？\n@c0@"
  tl: "@a@b%a002020：那個叫洛布的人\n　　是不是給村裡的人們\n　　添麻煩了啊？\n@c0@"
8:
  en: "@a%0%a002030@bHe must have been a fine fisherman indeed to garner such praise from the locals.\n@c0@"
  ja: "@a@b%a002030「何であれ\n\t一番に　なれるということは\n\tすばらしいことです。\n@c0@"
  ko: "@a@b%a002030: 무엇이든\n최고가 될 수 있다는 건\n훌륭한 일입니다.\n@c0@"
  sl: "@a@b%a002030：不管怎么说，\n　　能成为最厉害的人，\n　　真不简单啊。\n@c0@"
  tl: "@a@b%a002030：不管怎麼說，\n　　能成為最厲害的人，\n　　真不簡單啊。\n@c0@"
9:
  en: "@a%0%a002050@bIs he the second best fisherman now? Is there an official ranking system?\n@c0@"
  ja: "@a@b%a002050「いまは\n\t何番　なんでしょうね。\n@c0@"
  ko: "@a@b%a002050: 지금은\n몇 번째일까요?\n@c0@"
  sl: "@a@b%a002050：现在不知道\n　　是第几厉害的呢。\n@c0@"
  tl: "@a@b%a002050：現在不知道\n　　是第幾厲害的呢。\n@c0@"
10:
  en: "@a%0%a002000@bOh, was that Rod who flew off the handle earlier? Now I get it.\n@c0@"
  ja: "@a@b%a002000「そうか。　\n\tさっき　からんできたヤツは\n\tロブって　いうんだな。\n@c0@"
  ko: "@a@b%a002000: 그렇군.\n아까 시비를 걸던 녀석은\n롭이라는 사람이로군.\n@c0@"
  sl: "@a@b%a002000：这样啊。\n　　刚才找咱麻烦的那家伙\n　　就是洛布啊。\n@c0@"
  tl: "@a@b%a002000：這樣啊。\n　　剛才找咱麻煩的那傢伙\n　　就是洛布啊。\n@c0@"
11:
  en: "@a%0%a002010@bSo that was Rod earlier, was it? What could be making him so grumpy?\n@c0@"
  ja: "@a@b%a002010「ロブ……\n\tさっき　からんできた男ね。\n\tなんでピリピリしてるのかしら？\n@c0@"
  ko: "@a@b%a002010: 롭......\n아까 시비를 걸던 남자구나.\n왜 예민한 걸까?\n@c0@"
  sl: "@a@b%a002010：洛布……就是刚才\n　　找我们麻烦的那个男人吧。\n　　为什么会神经兮兮的呢？\n@c0@"
  tl: "@a@b%a002010：洛布……就是剛才\n　　找我們麻煩的那個男人吧。\n　　為什麼會神經兮兮的呢？\n@c0@"
12:
  en: "@a%0%a002020@bHey, you never know! Anyone can fall in love!\n@c0@"
  ja: "@a@b%a002020「あたしは　誰だって\n\t恋はすると思うよ！\n@c0@"
  ko: "@a@b%a002020: 난 누구든\n사랑에 빠질 수 있다고 생각해!\n@c0@"
  sl: "@a@b%a002020：我倒是觉得\n　　谁都可以谈恋爱哦！\n@c0@"
  tl: "@a@b%a002020：我倒是覺得\n　　誰都可以談戀愛哦！\n@c0@"
13:
  en: "@a%0%a002030@bI wonder why this Rod fellow is so out of sorts...\n@c0@"
  ja: "@a@b%a002030「何か　ピリピリする\n\t原因が　あるのでしょう。\n@c0@"
  ko: "@a@b%a002030: 예민해진 이유가\n있을 텐데요.\n@c0@"
  sl: "@a@b%a002030：一定是有什么原因\n　　所以才神经兮兮的吧。\n@c0@"
  tl: "@a@b%a002030：一定是有什麼原因\n　　所以才神經兮兮的吧。\n@c0@"
14:
  en: "@a%0%a002050@bLove's supposed to make a man soft and cuddly, not prickly.\n@c0@"
  ja: "@a@b%a002050「恋は　ホンワカ　するもので\n\tピリピリは　しないですよね。\n@c0@"
  ko: "@a@b%a002050: 사랑에 빠지면 온화해지지\n예민해지진 않겠죠.\n@c0@"
  sl: "@a@b%a002050：谈恋爱要沉住气静下心来，\n　　可不能神经兮兮的啊。\n@c0@"
  tl: "@a@b%a002050：談戀愛要沉住氣靜下心來，\n　　可不能神經兮兮的啊。\n@c0@"
15:
  en: "@a%0%a002000@bWhat do you call a young fisherman, aye? ‘Fisherboy’ don't sound right...\n@c0@"
  ja: "@a@b%a002000「見ろよ　%a000090。\n\tいかにも　漁師の子供って\n\t顔をしてるよな。\n@c0@"
  ko: "@a@b%a002000: 저길 봐, %a000090.\n척 봐도 어부의 아들처럼\n생겼군.\n@c0@"
  sl: "@a@b%a002000：%a000090你看。\n　　这孩子长得就像是\n　　渔夫的孩子。\n@c0@"
  tl: "@a@b%a002000：%a000090你看。\n　　這孩子長得就像是\n　　漁夫的孩子。\n@c0@"
16:
  en: "@a%0%a002010@bHe's a polite little fellow, isn't he!\n@c0@"
  ja: "@a@b%a002010「ぼうや。\n\t教えてくれて　ありがとうね！\n@c0@"
  ko: "@a@b%a002010: 꼬마야.\n알려 줘서 고마워!\n@c0@"
  sl: "@a@b%a002010：小朋友，\n　　谢谢你告诉我们！\n@c0@"
  tl: "@a@b%a002010：小朋友，\n　　謝謝你告訴我們！\n@c0@"
17:
  en: "@a%0%a002020@bWow. You see the tan on that kid?\n@c0@"
  ja: "@a@b%a002020「いかにも　元気そうな\n\t男の子だねー。\n@c0@"
  ko: "@a@b%a002020: 정말 씩씩해 보이는\n남자애네~\n@c0@"
  sl: "@a@b%a002020：小男孩真是\n　　精神饱满啊。\n@c0@"
  tl: "@a@b%a002020：小男孩真是\n　　精神飽滿啊。\n@c0@"
18:
  en: "@a%0%a002030@bSo this is Pescado...\n@c0@"
  ja: "@a@b%a002030「ペスカニ　ですか。\n\t漁師さんの　村のようですね。\n@c0@"
  ko: "@a@b%a002030: 페스카니라는 곳이군요.\n어부들의 마을인 것 같습니다.\n@c0@"
  sl: "@a@b%a002030：佩斯卡尼啊。\n　　好像是个渔夫聚集的村子呢。\n@c0@"
  tl: "@a@b%a002030：佩斯卡尼啊。\n　　好像是個漁夫聚集的村子呢。\n@c0@"
19:
  en: "@a%0%a002050@bDoesn't seem to be much life about this place.\n@c0@"
  ja: "@a@b%a002050「なんとなく\n\t活気のない　村ですねえ。\n@c0@"
  ko: "@a@b%a002050: 왠지\n활기가 없는 마을이네요.\n@c0@"
  sl: "@a@b%a002050：这村子好像\n　　没什么活力呢。\n@c0@"
  tl: "@a@b%a002050：這村子好像\n　　沒什麼活力呢。\n@c0@"
20:
  en: "@a%0%a002000@bThey're sold out, aye? Tell that to my belly!\n@c0@"
  ja: "@a@b%a002000「売り切れか。\n\tそいつは　残念だな。\n@c0@"
  ko: "@a@b%a002000: 다 팔렸다니.\n아쉽게 됐군.\n@c0@"
  sl: "@a@b%a002000：卖完了啊。\n　　真遗憾。\n@c0@"
  tl: "@a@b%a002000：賣完了啊。\n　　真遺憾。\n@c0@"
21:
  en: "@a%0%a002010@bSea monsters have always been the scourge of any fishing village.\n@c0@"
  ja: "@a@b%a002010「あいかわらず\n\t海に　まものが　いるせいで\n\t漁が　できないのね。\n@c0@"
  ko: "@a@b%a002010: 여전히\n바다에 마물이 있는 탓에\n고기를 잡으러 갈 수가 없나 봐.\n@c0@"
  sl: "@a@b%a002010：海里还是有魔物，\n　　所以不能出海打鱼啊。\n@c0@"
  tl: "@a@b%a002010：海裡還是有魔物，\n　　所以不能出海打魚啊。\n@c0@"
22:
  en: "@a%0%a002020@bAww, the poor old man...\n@c0@"
  ja: "@a@b%a002020「おじいちゃん　かわいそう。\n@c0@"
  ko: "@a@b%a002020: 할아버지 안됐어.\n@c0@"
  sl: "@a@b%a002020：老爷爷好可怜。\n@c0@"
  tl: "@a@b%a002020：老爺爺好可憐。\n@c0@"
23:
  en: "@a%0%a002030@bI pray that this village's catches become bountiful once more.\n@c0@"
  ja: "@a@b%a002030「ゲントの神に　祈りましょう。\n\tいつか必ず　魚は　もどってきます。\n@c0@"
  ko: "@a@b%a002030: 겐트 신께 기도합시다.\n물고기는 언젠가 반드시 돌아올 겁니다.\n@c0@"
  sl: "@a@b%a002030：向根特之神祈祷吧。\n　　总有一天能捕到鱼的。\n@c0@"
  tl: "@a@b%a002030：向根特之神祈禱吧。\n　　總有一天能捕到魚的。\n@c0@"
24:
  en: "@a%0%a002050@bOld %a002050 prefers a nice steak to fish any day.\n@c0@"
  ja: "@a@b%a002050「私は　肉ずき　ですが\n\t魚が　すきな人は\n\t困りますよねえ……。\n@c0@"
  ko: "@a@b%a002050: 저는 육류를 좋아하는데\n생선을 좋아하는 사람은\n곤란하겠네요......\n@c0@"
  sl: "@a@b%a002050：我喜欢吃肉，\n　　不过喜欢吃鱼的人\n　　会很伤脑筋吧……\n@c0@"
  tl: "@a@b%a002050：我喜歡吃肉，\n　　不過喜歡吃魚的人\n　　會很傷腦筋吧……\n@c0@"
25:
  en: "@a%0%a002000@bI take it that cat's hungry, aye? Good thing for us she's not a tiger...\n@c0@"
  ja: "@a@b%a002000「どうも　このネコ\n\tかわった　なきごえだと　思ったら\n\tハラが　へってるみたいだな。\n@c0@"
  ko: "@a@b%a002000: 이 고양이,\n이상한 울음소리를 낸다 싶었더니\n배가 고픈 거였군.\n@c0@"
  sl: "@a@b%a002000：俺还说这猫\n　　叫声怎么这么奇怪，\n　　看起来像是肚子饿了啊。\n@c0@"
  tl: "@a@b%a002000：俺還說這貓\n　　叫聲怎麼這麼奇怪，\n　　看起來像是肚子餓了啊。\n@c0@"
26:
  en: "@a%0%a002010@bWhat's become of the world when a cat can starve in a fishing village...?\n@c0@"
  ja: "@a@b%a002010「漁師さんの　村で\n\tネコちゃんが　おなかを\n\tすかしてるなんて……。\n@c0@"
  ko: "@a@b%a002010: 어부들의 마을에서\n고양이가 굶고\n있다니......\n@c0@"
  sl: "@a@b%a002010：在渔夫聚集的村子，\n　　小猫居然会饿肚子……\n@c0@"
  tl: "@a@b%a002010：在漁夫聚集的村子，\n　　小貓居然會餓肚子……\n@c0@"
27:
  en: "@a%0%a002020@bAww, is the wittle kitty hungry? Poor, poor kitty...\n@c0@"
  ja: "@a@b%a002020「ネコちゃん\n\tおなか　すいてるのかな。\n\tかわいそう。\n@c0@"
  ko: "@a@b%a002020: 고양이는\n배가 고픈 걸까?\n불쌍해라.\n@c0@"
  sl: "@a@b%a002020：小猫咪\n　　是不是饿了啊。\n　　好可怜。\n@c0@"
  tl: "@a@b%a002020：小貓咪\n　　是不是餓了啊。\n　　好可憐。\n@c0@"
28:
  en: "@a%0%a002030@bThat cat looks alarmingly thin...\n@c0@"
  ja: "@a@b%a002030「ネコちゃん\n\tずいぶん　やせてますね。\n@c0@"
  ko: "@a@b%a002030: 이 고양이,\n몸이 앙상하군요.\n@c0@"
  sl: "@a@b%a002030：小猫真瘦啊。\n@c0@"
  tl: "@a@b%a002030：小貓真瘦啊。\n@c0@"
29:
  en: "@a%0%a002050@bHey there, kitty cat!\n@c0@"
  ja: "@a@b%a002050「ぐるぐる　きゅ～っ……。\n@c0@"
  ko: "@a@b%a002050: 뱅글뱅글~ 꼬륵......\n@c0@"
  sl: "@a@b%a002050：咕噜咕噜～咻咻～\n@c0@"
  tl: "@a@b%a002050：咕嚕咕嚕～咻咻～\n@c0@"
30:
  en: "@a%0%a002000@bWhoa. Not enough hope here to float a thimble, aye?\n@c0@"
  ja: "@a@b%a002000「どこにも　救いのない\n\t話じゃないか……。\n@c0@"
  ko: "@a@b%a002000: 아무런 희망도 없는\n얘기잖아......\n@c0@"
  sl: "@a@b%a002000：这不是\n　　无药可救了吗……\n@c0@"
  tl: "@a@b%a002000：這不是\n　　無藥可救了嗎……\n@c0@"
31:
  en: "@a%0%a002010@bHe can't go out fishing because of sea monsters? I wonder if there's anything we could do to help...\n@c0@"
  ja: "@a@b%a002010「つまりは　海に\n\tまものが　出るからなのね。\n\tなんとか　ならないかしら……。\n@c0@"
  ko: "@a@b%a002010: 모든 건 바다에\n마물이 나온 탓에 시작된 것.\n어떻게든 해결해야 할 텐데......\n@c0@"
  sl: "@a@b%a002010：也就是说\n　　是因为海上有魔物出没吧。\n　　有没有什么办法啊……\n@c0@"
  tl: "@a@b%a002010：也就是說\n　　是因為海上有魔物出沒吧。\n　　有沒有什麼辦法啊……\n@c0@"
32:
  en: "@a%0%a002020@bBoy, that guy trumps all the grumps we've ever met! I feel for him, though...\n@c0@"
  ja: "@a@b%a002020「おじいちゃん\n\t気よわに　なっちゃってるね。\n\tかわいそう。\n@c0@"
