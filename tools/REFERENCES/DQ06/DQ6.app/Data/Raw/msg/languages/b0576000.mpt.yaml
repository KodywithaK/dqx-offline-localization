98:
  en: "@a%0%a002030@bI am not entirely comfortable with the idea of stalking someone, but it seems we have little choice.\n@c0@"
  ja: "@a@b%a002030「こそこそと　かくれて\n\t追いかけたくは　ありませんが\n\tしかたありません。\n@c0@"
  ko: "@a@b%a002030: 이렇게 몰래\n뒤쫓고 싶지는 않지만\n방법이 없습니다.\n@c0@"
  sl: "@a@b%a002030：虽然不想\n　　鬼鬼祟祟地边躲边跟踪，\n　　但是没有办法。\n@c0@"
  tl: "@a@b%a002030：雖然不想\n　　鬼鬼祟祟地邊躲邊跟蹤，\n　　但是沒有辦法。\n@c0@"
99:
  en: "@a%0%a002030@bIf we wish to uncover the truth, we must tread carefully...\n@c0@"
  ja: "@a@b%a002030「真実を　つきとめるため\n\tしばし　こそこそ　行きましょう。\n@c0@"
  ko: "@a@b%a002030: 진실을 밝히기 위해\n당분간은 조용히 움직여 보지요.\n@c0@"
  sl: "@a@b%a002030：为了找出真相，\n　　现在暂时就鬼鬼祟祟一下吧。\n@c0@"
  tl: "@a@b%a002030：為了找出真相，\n　　現在暫時就鬼鬼祟祟一下吧。\n@c0@"
100:
  en: "@a%0%a002050@bOld %a002050's heart's beatin' like a drum! I hope he can't hear it...\n@c0@"
  ja: "@a@b%a002050「うわー　私　心臓が\n\tドキドキいってます！\n\t聞こえちゃいますかね……？\n@c0@"
  ko: "@a@b%a002050: 우와~ 저, 심장이\n쿵쿵 뛰는데요!\n혹시 들리는 거 아닐까요......?\n@c0@"
  sl: "@a@b%a002050：哇啊，我的心脏\n　　跳得好厉害！\n　　会不会被听见啊……\n@c0@"
  tl: "@a@b%a002050：哇啊，我的心臟\n　　跳得好厲害！\n　　會不會被聽見啊……\n@c0@"
101:
  en: "@a%0%a002000@bBlimey. The jig is up.\n@c0@"
  ja: "@a@b%a002000「ちっ…　まずったな……。\n@c0@"
  ko: "@a@b%a002000: 쳇... 들켰군......\n@c0@"
  sl: "@a@b%a002000：嘁……失败了啊……\n@c0@"
  tl: "@a@b%a002000：嘁……失敗了啊……\n@c0@"
102:
  en: "@a%0%a002010@bThat didn't go too well...\n@c0@"
  ja: "@a@b%a002010「失敗ね……。\n@c0@"
  ko: "@a@b%a002010: 실패네......\n@c0@"
  sl: "@a@b%a002010：失败了呢……\n@c0@"
  tl: "@a@b%a002010：失敗了呢……\n@c0@"
103:
  en: "@a%0%a002020@bAww, he went back home!\n@c0@"
  ja: "@a@b%a002020「あーあ……\n\t帰って　いっちゃったね。\n@c0@"
  ko: "@a@b%a002020: 아아......\n돌아가 버렸어.\n@c0@"
  sl: "@a@b%a002020：啊……\n　　他回去了呢。\n@c0@"
  tl: "@a@b%a002020：啊……\n　　他回去了呢。\n@c0@"
104:
  en: "@a%0%a002030@bWe will have to wait until the next opportunity...\n@c0@"
  ja: "@a@b%a002030「またの　機会を\n\tまちましょうか。\n@c0@"
  ko: "@a@b%a002030: 다음번 기회를\n기다릴까요?\n@c0@"
  sl: "@a@b%a002030：等下一次机会吧。\n@c0@"
  tl: "@a@b%a002030：等下一次機會吧。\n@c0@"
105:
  en: "@a%0%a002050@bIt was a mistake to go up and chat with him like that...\n@c0@"
  ja: "@a@b%a002050「やっぱり　話しかけたのが\n\tまずかったですかね……。\n@c0@"
  ko: "@a@b%a002050: 역시 말을 걸면\n안 되나 보네요......\n@c0@"
  sl: "@a@b%a002050：果然不能\n　　跟他说话啊……\n@c0@"
  tl: "@a@b%a002050：果然不能\n　　跟他說話啊……\n@c0@"
106:
  en: "@a%0%a002000@bHuh. Even the fishmonger's surprised at how much he's buyin', aye?\n@c0@"
  ja: "@a@b%a002000「店主が　おどろくほど\n\t魚を　いっぱい　買ってるのか……？\n@c0@"
  ko: "@a@b%a002000: 가게 주인이 놀랄 정도로\n생선을 잔뜩 산다고......?\n@c0@"
  sl: "@a@b%a002000：他买的鱼之多，\n　　连店主都吓到了啊……\n@c0@"
  tl: "@a@b%a002000：他買的魚之多，\n　　連店主都嚇到了啊……\n@c0@"
107:
  en: "@a%0%a002010@bI always sensed that Rod was hiding something.\n@c0@"
  ja: "@a@b%a002010「やはり　なにか\n\tヒミツが　あるようね。\n@c0@"
  ko: "@a@b%a002010: 역시 뭔가\n비밀이 있을 것 같아.\n@c0@"
  sl: "@a@b%a002010：看起来果然\n　　有什么秘密呢。\n@c0@"
  tl: "@a@b%a002010：看起來果然\n　　有什麼秘密呢。\n@c0@"
108:
  en: "@a%0%a002020@bYou saw how much fish he was buying... What could he possibly be doing with it all?\n@c0@"
  ja: "@a@b%a002020「そんなに　たくさん\n\t魚を　買ってるんだ……。\n\tそれを　どうしているんだろうね。\n@c0@"
  ko: "@a@b%a002020: 그렇게 생선을\n잔뜩 사는구나......\n그걸 어떻게 처리하는 걸까?\n@c0@"
  sl: "@a@b%a002020：买了那么多鱼啊……\n　　买来干什么呢？\n@c0@"
  tl: "@a@b%a002020：買了那麼多魚啊……\n　　買來幹什麼呢？\n@c0@"
109:
  en: "@a%0%a002030@bPerhaps he has a fish addiction that has spiralled out of control...\n@c0@"
  ja: "@a@b%a002030「よっぽどの　魚好き……\n\tということも　考えられますかね。\n@c0@"
  ko: "@a@b%a002030: 생선을 사랑해 마지않는\n사람일 수도 있겠네요......\n@c0@"
  sl: "@a@b%a002030：这样人们会以为\n　　他很喜欢吃鱼呢……\n@c0@"
  tl: "@a@b%a002030：這樣人們會以為\n　　他很喜歡吃魚呢……\n@c0@"
110:
  en: "@a%0%a002050@bOld %a002050 has worked it out! He must have a cat the size of a house in that cave!\n@c0@"
  ja: "@a@b%a002050「それだ！　きっと\n\t家の大きさくらいの　巨大ネコが\n\tあの　洞くつに　いるんですよ！\n@c0@"
  ko: "@a@b%a002050: 바로 그거야! 틀림없이\n집채만 한 거대 고양이가\n그 동굴에 있는 겁니다!\n@c0@"
  sl: "@a@b%a002050：对了！\n　　那个洞窟里一定有一只\n　　跟房子一样大的巨猫！\n@c0@"
  tl: "@a@b%a002050：對了！\n　　那個洞窟裡一定有一隻\n　　跟房子一樣大的巨貓！\n@c0@"
111:
  en: "@a%0%a002000@bUnda's a pretty sweet fishgal, ain't she? She ought to be back with her crew, though...\n@c0@"
  ja: "@a@b%a002000「ディーネは　いい娘だな。\n\tはやく　仲間の所へ\n\tもどしてやりたいぜ。\n@c0@"
  ko: "@a@b%a002000: 디네는 착한 소녀였지.\n어서 친구들이 있는 곳으로\n돌려보내 주고 싶어.\n@c0@"
  sl: "@a@b%a002000：蒂妮是个好姑娘。\n　　真想快点送她\n　　回同伴那里啊。\n@c0@"
  tl: "@a@b%a002000：蒂妮是個好姑娘。\n　　真想快點送她\n　　回同伴那裡啊。\n@c0@"
112:
  en: "@a%0%a002010@bLet's get Unda back to her friends, %a000090!\n@c0@"
  ja: "@a@b%a002010「さあ　ディーネさんの\n\t仲間の所へ　行きましょう！\n@c0@"
  ko: "@a@b%a002010: 자, 디네 씨의\n친구들이 있는 곳으로 가자!\n@c0@"
  sl: "@a@b%a002010：我们去\n　　蒂妮的同伴那里吧！\n@c0@"
  tl: "@a@b%a002010：我們去\n　　蒂妮的同伴那裡吧！\n@c0@"
113:
  en: "@a%0%a002020@bOoh, aren't mermaids amazing...\n@c0@"
  ja: "@a@b%a002020「人魚って　ステキよね。\n@c0@"
  ko: "@a@b%a002020: 인어는 정말 멋져.\n@c0@"
  sl: "@a@b%a002020：人鱼真美啊。\n@c0@"
  tl: "@a@b%a002020：人魚真美啊。\n@c0@"
114:
  en: "@a%0%a002030@bMay the blessings of the Goddess be upon Pescado.\n@c0@"
  ja: "@a@b%a002030「この村に　ゲントの神の\n\tご加護がありますように。\n@c0@"
  ko: "@a@b%a002030: 이 마을에 겐트 신의\n가호가 함께하기를.\n@c0@"
  sl: "@a@b%a002030：愿根特之神\n　　保佑这个村子。\n@c0@"
  tl: "@a@b%a002030：願根特之神\n　　保佑這個村子。\n@c0@"
115:
  en: "@a%0%a002050@bIf someone does bag a mermaid, chances are they'll stick 'em on display.\n@c0@"
  ja: "@a@b%a002050「やっぱり　人魚は　みつかったら\n\t見世物に　されてしまうんでしょうか。\n@c0@"
  ko: "@a@b%a002050: 역시 인어는 붙잡히면\n구경거리로 전락해 버릴까요?\n@c0@"
  sl: "@a@b%a002050：人鱼要是被抓住，\n　　一定会被用来展览的吧。\n@c0@"
  tl: "@a@b%a002050：人魚要是被抓住，\n　　一定會被用來展覽的吧。\n@c0@"
116:
  en: "@a%0%a002000@bSayin' goodbye ain't easy for anyone, aye?\n@c0@"
  ja: "@a@b%a002000「そりゃあ　だれだって\n\t別れは　つらいからなあ。\n@c0@"
  ko: "@a@b%a002000: 거야 누구든\n이별은 힘든 법이니까.\n@c0@"
  sl: "@a@b%a002000：要跟人分别，\n　　没人会不难受吧。\n@c0@"
  tl: "@a@b%a002000：要跟人分別，\n　　沒人會不難受吧。\n@c0@"
117:
  en: "@a%0%a002010@bPoor Rod. He must be pining for Unda.\n@c0@"
  ja: "@a@b%a002010「ディーネさんを\n\t思ってのこと　とはいえ\n\tロブさん　さびしいわよね。\n@c0@"
  ko: "@a@b%a002010: 디네 씨를\n위해서 한 행동이지만,\n롭 씨는 많이 쓸쓸할 거야.\n@c0@"
  sl: "@a@b%a002010：虽然这是\n　　为蒂妮着想，不过洛布\n　　一定会寂寞的吧。\n@c0@"
  tl: "@a@b%a002010：雖然這是\n　　為蒂妮著想，不過洛布\n　　一定會寂寞的吧。\n@c0@"
118:
  en: "@a%0%a002020@bLet's get Unda back to her friends, okay? Rod's probably worried sick right now!\n@c0@"
  ja: "@a@b%a002020「とにかく　ディーネさんを\n\t仲間の　ところに　つれて行って\n\tロブさんを　安心させなきゃね！\n@c0@"
  ko: "@a@b%a002020: 어쨌든 디네 씨를\n친구들이 있는 곳으로 데려가서\n롭 씨를 안심시켜 줘야 해!\n@c0@"
  sl: "@a@b%a002020：总之得先把蒂妮\n　　送回同伴那里去，\n　　让洛布放下心来才行！\n@c0@"
  tl: "@a@b%a002020：總之得先把蒂妮\n　　送回同伴那裡去，\n　　讓洛布放下心來才行！\n@c0@"
119:
  en: "@a%0%a002030@bRod's heart must be deeply conflicted. Happiness and loneliness make for a far from ideal combination...\n@c0@"
  ja: "@a@b%a002030「たしかに　ロブさん\n\tうれしいけど　さびしい……\n\tという　感じでしょうね。\n@c0@"
  ko: "@a@b%a002030: 하긴, 롭 씨는\n기쁘긴 하지만 섭섭한......\n그런 느낌이었지요.\n@c0@"
  sl: "@a@b%a002030：的确，虽然感觉\n　　洛布很开心，\n　　但是一定会寂寞吧……\n@c0@"
  tl: "@a@b%a002030：的確，雖然感覺\n　　洛布很開心，\n　　但是一定會寂寞吧……\n@c0@"
120:
  en: "@a%0%a002050@bWill Unda make it back to her companions? The suspense is killin' old %a002050!\n@c0@"
  ja: "@a@b%a002050「ちゃんと　ディーネさんが\n\t仲間のところに　つくかどうか\n\t今は　ソワソワ　ドキドキ　ですね！\n@c0@"
  ko: "@a@b%a002050: 디네 양이 문제없이\n친구들이 있는 곳에 도착할 수 있을지\n지금은 걱정 반 기대 반이네요!\n@c0@"
  sl: "@a@b%a002050：不知道能不能顺利\n　　把蒂妮送回同伴那里呢，\n　　好紧张啊！\n@c0@"
  tl: "@a@b%a002050：不知道能不能順利\n　　把蒂妮送回同伴那裡呢，\n　　好緊張啊！\n@c0@"
121:
  en: "@a%0%a002000@bHardy har! He just lost his best customer, aye?\n@c0@"
  ja: "@a@b%a002000「この　店も\n\t商売　あがったり　だな。\n@c0@"
  ko: "@a@b%a002000: 이 가게도\n장사는 다 끝났군.\n@c0@"
  sl: "@a@b%a002000：这店也要关门了吧。\n@c0@"
  tl: "@a@b%a002000：這店也要關門了吧。\n@c0@"
122:
  en: "@a%0%a002010@bHee hee. Rod's not fed up of fish, is he %a000090?\n@c0@"
  ja: "@a@b%a002010「うふふ。\n\t食べあきたわけじゃ　ないわよね。\n@c0@"
  ko: "@a@b%a002010: 우후후.\n먹다가 질린 게 아닌데 말이야.\n@c0@"
  sl: "@a@b%a002010：呵呵。\n　　不是吃腻了哦。\n@c0@"
  tl: "@a@b%a002010：呵呵。\n　　不是吃膩了哦。\n@c0@"
123:
  en: "@a%0%a002020@bWouldn't it be funny if Rod actually hated fish the whole time?\n@c0@"
  ja: "@a@b%a002020「ロブさん　もともとは\n\t魚ぎらい　だったりしてね！\n@c0@"
  ko: "@a@b%a002020: 롭 씨, 알고 보면\n생선 싫어하는 거 아냐?\n@c0@"
  sl: "@a@b%a002020：因为洛布\n　　其实根本就不爱吃鱼啊！\n@c0@"
  tl: "@a@b%a002020：因為洛布\n　　其實根本就不愛吃魚啊！\n@c0@"
124:
  en: "@a%0%a002030@bI wonder how much fish Unda consumes in a day...\n@c0@"
  ja: "@a@b%a002030「ディーネさんは\n\tいつも　どのくらいの　魚を\n\t食べていたんでしょうね。\n@c0@"
  ko: "@a@b%a002030: 디네 양은\n항상 생선을 얼마나\n먹었던 걸까요?\n@c0@"
  sl: "@a@b%a002030：蒂妮平常\n　　要吃多少鱼啊？\n@c0@"
  tl: "@a@b%a002030：蒂妮平常\n　　要吃多少魚啊？\n@c0@"
125:
  en: "@a%0%a002050@bThat giant cat in the cave must have moved out!\n@c0@"
  ja: "@a@b%a002050「もう　洞くつの　巨大ネコは\n\tいなくなりましたからね。\n\tわっはっは。\n@c0@"
  ko: "@a@b%a002050: 이제 동굴 속의 거대 고양이가\n없어졌거든요.\n와하하.\n@c0@"
  sl: "@a@b%a002050：洞窟里的巨猫\n　　已经没有了呢。\n　　哇哈哈。\n@c0@"
  tl: "@a@b%a002050：洞窟裡的巨貓\n　　已經沒有了呢。\n　　哇哈哈。\n@c0@"
126:
  en: "@a%0%a002000@b...Rod's a pretty nice fella once you get to know him, aye?\n@c0@"
  ja: "@a@b%a002000「ロブ……いいヤツだな。\n@c0@"
  ko: "@a@b%a002000: 롭...... 좋은 녀석이군.\n@c0@"
  sl: "@a@b%a002000：洛布……真是个好人啊。\n@c0@"
  tl: "@a@b%a002000：洛布……真是個好人啊。\n@c0@"
127:
  en: "@a%0%a002010@bWe'll try our best not to let Rod down won't we, %a000090?\n@c0@"
  ja: "@a@b%a002010「ロブさんの　思いを\n\tしっかりと　かなえてあげましょ。\n@c0@"
  ko: "@a@b%a002010: 롭 씨의 소원을\n꼭 이루게 해 주자.\n@c0@"
  sl: "@a@b%a002010：我们帮洛布\n　　实现他的愿望吧。\n@c0@"
  tl: "@a@b%a002010：我們幫洛布\n　　實現他的願望吧。\n@c0@"
128:
  en: "@a%0%a002020@bI sure hope we can help make a happy ending for Rod and Unda.\n@c0@"
  ja: "@a@b%a002020「ロブさんと　ディーネちゃんも\n\tハッピーエンドになってほしいな。\n@c0@"
  ko: "@a@b%a002020: 롭 씨와 디네도\n해피 엔딩으로 끝났으면 좋겠어.\n@c0@"
  sl: "@a@b%a002020：真希望洛布和蒂妮\n　　也能有个完美的结局啊。\n@c0@"
  tl: "@a@b%a002020：真希望洛布和蒂妮\n　　也能有個完美的結局啊。\n@c0@"
129:
  en: "@a%0%a002030@bI pray that the Goddess leads Rod to happiness.\n@c0@"
  ja: "@a@b%a002030「ロブさんに　ゲントの神の\n\tおみちびきが　ありますように……。\n@c0@"
  ko: "@a@b%a002030: 롭 씨께 겐트 신의\n인도가 있기를......\n@c0@"
  sl: "@a@b%a002030：愿根特之神指引洛布……\n@c0@"
  tl: "@a@b%a002030：願根特之神指引洛布……\n@c0@"
130:
  en: "@a%0%a002050@bRod's got a face like a stormy sea, but a truer heart you couldn't hope to find.\n@c0@"
  ja: "@a@b%a002050「うっうっ……　ロブさんの\n\t顔と　心が　いっちしないところに\n\t感動してしまいます……。\n@c0@"
  ko: "@a@b%a002050: 으흑...... 롭 씨의\n얼굴과 마음이 따로 노는 데에\n감동해 버렸습니다......\n@c0@"
  sl: "@a@b%a002050：呜呜……\n　　洛布外表和内心的反差，\n　　真是让我太感动了……\n@c0@"
  tl: "@a@b%a002050：嗚嗚……\n　　洛布外表和內心的反差，\n　　真是讓我太感動了……\n@c0@"
131:
  en: "@a%0%a002000@bNo monsters around here, I can say that much...\n@c0@"
  ja: "@a@b%a002000「ここは　まものの　気配が\n\tまったくしないな。\n@c0@"
  ko: "@a@b%a002000: 여긴 마물의 기운이\n전혀 느껴지지 않는군.\n@c0@"
  sl: "@a@b%a002000：这里一点都感觉不到\n　　魔物的气息呢。\n@c0@"
  tl: "@a@b%a002000：這裡一點都感覺不到\n　　魔物的氣息呢。\n@c0@"
132:
  en: "@a%0%a002010@bIt really smells of the sea in here, doesn't it?\n@c0@"
  ja: "@a@b%a002010「この　洞くつの中は\n\t海の　においがするわね。\n@c0@"
  ko: "@a@b%a002010: 이 동굴 안에서는\n바다 냄새가 나.\n@c0@"
  sl: "@a@b%a002010：这洞窟里闻得到\n　　海水的气息呢。\n@c0@"
  tl: "@a@b%a002010：這洞窟裡聞得到\n　　海水的氣息呢。\n@c0@"
133:
  en: "@a%0%a002020@bI don't see anything weird here, anyway.\n@c0@"
  ja: "@a@b%a002020「とくに　なにも\n\tないみたいだねー。\n@c0@"
  ko: "@a@b%a002020: 딱히 아무것도\n없는 것 같아~\n@c0@"
  sl: "@a@b%a002020：好像没有什么\n　　特别的东西。\n@c0@"
  tl: "@a@b%a002020：好像沒有什麼\n　　特別的東西。\n@c0@"
134:
  en: "@a%0%a002030@bThis is a most spacious cave...\n@c0@"
  ja: "@a@b%a002030「けっこう\n\t広い　感じですね。\n@c0@"
  ko: "@a@b%a002030: 꽤\n넓어 보이는군요.\n@c0@"
  sl: "@a@b%a002030：这里感觉\n　　好宽敞啊。\n@c0@"
  tl: "@a@b%a002030：這裡感覺\n　　好寬敞啊。\n@c0@"
135:
  en: "@a%0%a002050@bThere might be a big monster boss hidin' round here! ...Or not.\n@c0@"
  ja: "@a@b%a002050「どこかに　まもののボスが\n\tひそんでいる！\n\tなーんてことは　ないですかね。\n@c0@"
  ko: "@a@b%a002050: 어딘가에 마물 보스가\n숨어 있다거나!\n설마 그런 일은 없겠죠?\n@c0@"
  sl: "@a@b%a002050：魔物的首领\n　　就藏在某个地方！\n　　这是不可能的吧。\n@c0@"
  tl: "@a@b%a002050：魔物的首領\n　　就藏在某個地方！\n　　這是不可能的吧。\n@c0@"
136:
  en: "@a%0%a002000@bHuh. You think the fish are really bitin' in a dark, stinky old cave like this?\n@c0@"
  ja: "@a@b%a002000「わざわざ　こんな\n\tうす暗いところで　釣りしなくても\n\tよさそうなもんだがな。\n@c0@"
  ko: "@a@b%a002000: 굳이 이렇게\n어두운 곳에서 낚시할 필요는\n없을 것 같은데 말이지.\n@c0@"
  sl: "@a@b%a002000：没必要专门跑到\n　　这种光线昏暗的地方\n　　来钓鱼吧。\n@c0@"
  tl: "@a@b%a002000：沒必要專門跑到\n　　這種光線昏暗的地方\n　　來釣魚吧。\n@c0@"
137:
  en: "@a%0%a002010@bIf he can fish here, that must mean this cave opens out into the sea.\n@c0@"
  ja: "@a@b%a002010「この洞くつは　外の海と\n\tつながって　いるみたいね。\n@c0@"
  ko: "@a@b%a002010: 이 동굴은 바깥쪽 바다랑\n연결되어 있는 것 같아.\n@c0@"
  sl: "@a@b%a002010：这个洞窟好像和\n　　外面的海是相连的呢。\n@c0@"
  tl: "@a@b%a002010：這個洞窟好像和\n　　外面的海是相連的呢。\n@c0@"
138:
  en: "@a%0%a002020@bThat guy DOES have bait on his hook, right?\n@c0@"
  ja: "@a@b%a002020「おじいちゃん\n\tちゃんと　エサつけてるのかなあ。\n@c0@"
  ko: "@a@b%a002020: 할아버지,\n미끼는 제대로 달고 하실까?\n@c0@"
  sl: "@a@b%a002020：老爷爷有没有\n　　用鱼饵啊。\n@c0@"
  tl: "@a@b%a002020：老爺爺有沒有\n　　用魚餌啊。\n@c0@"
139:
  en: "@a%0%a002030@bPerhaps he has found a secret fishing spot...\n@c0@"
  ja: "@a@b%a002030「ここは　釣りの\n\t穴場　なんでしょうかね。\n@c0@"
  ko: "@a@b%a002030: 여긴 잘 알려지지 않은\n낚시터일까요?\n@c0@"
  sl: "@a@b%a002030：这个洞窟是\n　　用来钓鱼的吧。\n@c0@"
  tl: "@a@b%a002030：這個洞窟是\n　　用來釣魚的吧。\n@c0@"
140:
  en: "@a%0%a002050@bIs it monsters stoppin' that lad catchin' fish, or is he just a bit useless?\n@c0@"
  ja: "@a@b%a002050「魚が　釣れないのは\n\t海にいる　まもののせいなのか\n\tはたまた　ウデのせいなのか……。\n@c0@"
  ko: "@a@b%a002050: 고기가 안 잡히는 건\n바다에 있는 마물 때문일까요,\n아니면 실력 때문일까요......\n@c0@"
  sl: "@a@b%a002050：钓不到鱼，\n　　到底是因为海里有魔物出没，\n　　还是只是技术不好的缘故呢……\n@c0@"
  tl: "@a@b%a002050：釣不到魚，\n　　到底是因為海裡有魔物出沒，\n　　還是只是技術不好的緣故呢……\n@c0@"
141:
  en: "@a%0%a002000@bMighty suspicious, aye?\n@c0@"
  ja: "@a@b%a002000「あやしい……\n\tあやしすぎるぜ……。\n@c0@"
  ko: "@a@b%a002000: 수상해......\n수상해도 너무 수상하다고......\n@c0@"
  sl: "@a@b%a002000：可疑……\n　　太可疑了……\n@c0@"
  tl: "@a@b%a002000：可疑……\n　　太可疑了……\n@c0@"
142:
  en: "@a%0%a002010@bMake sure he doesn't spot us!\n@c0@"
  ja: "@a@b%a002010「見つからないよう\n\t気をつけましょ。\n@c0@"
  ko: "@a@b%a002010: 들키지 않도록\n조심하자.\n@c0@"
  sl: "@a@b%a002010：小心不要\n　　被他发现。\n@c0@"
  tl: "@a@b%a002010：小心不要\n　　被他發現。\n@c0@"
143:
  en: "@a%0%a002020@bThat guy's hiding something, that's for sure!\n@c0@"
  ja: "@a@b%a002020「あの人　ぜったいに\n\tなにか　かくしてるよね！\n@c0@"
  ko: "@a@b%a002020: 저 사람, 뭔가를\n숨기고 있는 게 분명해!\n@c0@"
  sl: "@a@b%a002020：那个人绝对\n　　在隐瞒什么事情！\n@c0@"
  tl: "@a@b%a002020：那個人絕對\n　　在隱瞞什麼事情！\n@c0@"
144:
  en: "@a%0%a002030@bI can't help but feel that we are doing something wrong...\n@c0@"
  ja: "@a@b%a002030「なにか　私たちが\n\t悪いことをしているような\n\t気分になりますね……。\n@c0@"
  ko: "@a@b%a002030: 왠지 우리가\n나쁜 짓을 하는 것 같은\n기분이 드네요......\n@c0@"
  sl: "@a@b%a002030：感觉就像\n　　我们做错了什么事似的……\n@c0@"
  tl: "@a@b%a002030：感覺就像\n　　我們做錯了什麼事似的……\n@c0@"
145:
  en: "@a%0%a002050@b...Shhh! Tip-toes, everyone!\n@c0@"
  ja: "@a@b%a002050「ぬき足　さし足　しのび足……。\n@c0@"
  ko: "@a@b%a002050: 살금살금 가만가만 조심조심......\n@c0@"
  sl: "@a@b%a002050：小心翼翼……小心翼翼……\n@c0@"
  tl: "@a@b%a002050：小心翼翼……小心翼翼……\n@c0@"
146:
  en: "@a%0%a002000@bHere's an idea, %a000090 — let's not get caught next time!\n@c0@"
  ja: "@a@b%a002000「ちっ……。\n\tつぎは　見つからないよう\n\t追いかけようぜ。\n@c0@"
  ko: "@a@b%a002000: 쳇......\n다음엔 들키지 않도록\n조심하면서 쫓자고.\n@c0@"
  sl: "@a@b%a002000：嘁……\n　　下次要小心\n　　不要被他发现。\n@c0@"
  tl: "@a@b%a002000：嘁……\n　　下次要小心\n　　不要被他發現。\n@c0@"
147:
  en: "@a%0%a002010@bWe got too close, %a000090. That's why he spotted us.\n@c0@"
  ja: "@a@b%a002010「あまり　近づきすぎると\n\t見つかるわね。\n@c0@"
  ko: "@a@b%a002010: 너무 가까이 다가가면\n들키는구나.\n@c0@"
  sl: "@a@b%a002010：要是跟太近的话，\n　　会被他发现的。\n@c0@"
  tl: "@a@b%a002010：要是跟太近的話，\n　　會被他發現的。\n@c0@"
148:
  en: "@a%0%a002020@bWe'd probably be better off keeping a bit more distance.\n@c0@"
  ja: "@a@b%a002020「きっと　もう少し　はなれて\n\t追いかければ　だいじょうぶだよ。\n@c0@"
  ko: "@a@b%a002020: 아마 좀 더 떨어져서\n쫓아가면 괜찮을 거야.\n@c0@"
  sl: "@a@b%a002020：跟他隔\n　　一定的距离再跟着他，\n　　就不会被发现了。\n@c0@"
  tl: "@a@b%a002020：跟他隔\n　　一定的距離再跟著他，\n　　就不會被發現了。\n@c0@"
149:
  en: "@a%0%a002030@bIt is no mean feat to track a person without being detected...\n@c0@"
  ja: "@a@b%a002030「見つからず　追いかけるのは\n\tなかなか　むずかしいです……。\n@c0@"
  ko: "@a@b%a002030: 들키지 않고 뒤를 쫓는 건\n생각보다 어렵군요......\n@c0@"
  sl: "@a@b%a002030：要跟着他还\n　　不被他发现，挺难的啊……\n@c0@"
  tl: "@a@b%a002030：要跟著他還\n　　不被他發現，挺難的啊……\n@c0@"
150:
  en: "@a%0%a002050@bThat Rod ain't half cautious!\n@c0@"
  ja: "@a@b%a002050「かなり　けいかい　してますね。\n@c0@"
  ko: "@a@b%a002050: 상당히 경계하고 있네요.\n@c0@"
  sl: "@a@b%a002050：他的警戒心还真强啊。\n@c0@"
  tl: "@a@b%a002050：他的警戒心還真強啊。\n@c0@"
151:
  en: "@a%0%a002000@bAhoy! Was that a mermaid!?\n@c0@"
  ja: "@a@b%a002000「いまのは　人魚か！？\n@c0@"
  ko: "@a@b%a002000: 방금 본 건 인어인가!?\n@c0@"
  sl: "@a@b%a002000：刚才那是人鱼？！\n@c0@"
  tl: "@a@b%a002000：剛才那是人魚？！\n@c0@"
152:
  en: "@a%0%a002010@bSo mermaids are real! And here I was thinking they only existed in fairy tales!\n@c0@"
  ja: "@a@b%a002010「人魚は　本当に　いたのね。\n\t物語の中だけかと　思ってたわ！\n@c0@"
  ko: "@a@b%a002010: 인어는 정말로 있었구나.\n이야기 속에만 있는 건 줄 알았어!\n@c0@"
  sl: "@a@b%a002010：真的有人鱼啊。我还以为\n　　人鱼只会出现在故事里面呢！\n@c0@"
  tl: "@a@b%a002010：真的有人魚啊。我還以為\n　　人魚只會出現在故事裡面呢！\n@c0@"
153:
  en: "@a%0%a002020@bWow! A real mermaid! I saw her with my own eyes!\n@c0@"
  ja: "@a@b%a002020「すっごーい！\n\tあたし　人魚　見ちゃった！\n@c0@"
  ko: "@a@b%a002020: 우와~!\n나, 인어를 봤어!\n@c0@"
  sl: "@a@b%a002020：太棒了！\n　　我看见人鱼了！\n@c0@"
  tl: "@a@b%a002020：太棒了！\n　　我看見人魚了！\n@c0@"
154:
  en: "@a%0%a002030@bWas that...a mermaid...?\n@c0@"
  ja: "@a@b%a002030「あれが　人魚……。\n@c0@"
  ko: "@a@b%a002030: 저게 바로 인어......\n@c0@"
  sl: "@a@b%a002030：那就是人鱼……\n@c0@"
  tl: "@a@b%a002030：那就是人魚……\n@c0@"
155:
  en: "@a%0%a002050@bIt plunged into the water so fast I barely saw it, but that was a mermaid, wasn't it?\n@c0@"
  ja: "@a@b%a002050「いまの　人魚ですか！？\n\tすぐに　もぐっちゃったから\n\tよく見えませんでしたが……。\n@c0@"
  ko: "@a@b%a002050: 방금 인어였나요!?\n금방 물속으로 들어가 버려서\n잘 안 보였는데......\n@c0@"
  sl: "@a@b%a002050：刚才那是人鱼吗？！\n　　她一看到我们就潜到了水里，\n　　我没看清啊……\n@c0@"
  tl: "@a@b%a002050：剛才那是人魚嗎？！\n　　她一看到我們就潛到了水裡，\n　　我沒看清啊……\n@c0@"
156:
  en: "@a%0%a002000@bGot away, aye? What a scaredy-cat! Or is that ‘scaredy-catfish’?\n@c0@"
  ja: "@a@b%a002000「ちっ…　逃げちまったか。\n\tそんなに　こわがらなくても\n\tいいのにな……。\n@c0@"
  ko: "@a@b%a002000: 쳇... 도망가 버렸군.\n그렇게 무서워하지 않아도\n되는데......\n@c0@"
  sl: "@a@b%a002000：嘁……逃走了啊。\n　　没必要这么害怕吧……\n@c0@"
  tl: "@a@b%a002000：嘁……逃走了啊。\n　　沒必要這麼害怕吧……\n@c0@"
157:
  en: "@a%0%a002010@bIf only we could reassure her that we won't cause any harm...\n@c0@"
  ja: "@a@b%a002010「人魚さん　だいじょうぶよ！\n\tつかまえたりしないから！\n@c0@"
  ko: "@a@b%a002010: 인어님, 괜찮아요!\n잡아가지 않아요!\n@c0@"
  sl: "@a@b%a002010：小人鱼，没事的！\n　　我们不会抓你的！\n@c0@"
  tl: "@a@b%a002010：小人魚，沒事的！\n　　我們不會抓你的！\n@c0@"
158:
  en: "@a%0%a002020@bAww... She was so scared...\n@c0@"
  ja: "@a@b%a002020「人魚……\n\tこわがってたね……。\n@c0@"
  ko: "@a@b%a002020: 인어......\n겁에 질려 있었어......\n@c0@"
  sl: "@a@b%a002020：那人鱼……\n　　害怕了呢……\n@c0@"
  tl: "@a@b%a002020：那人魚……\n　　害怕了呢……\n@c0@"
159:
  en: "@a%0%a002030@bShe seems to be afraid of humans.\n@c0@"
  ja: "@a@b%a002030「どうやら　人間に\n\tおびえているようです。\n@c0@"
  ko: "@a@b%a002030: 아무래도 인간을\n무서워하는 것 같습니다.\n@c0@"
  sl: "@a@b%a002030：好像很害怕人类呢。\n@c0@"
  tl: "@a@b%a002030：好像很害怕人類呢。\n@c0@"
160:
  en: "@a%0%a002050@bThat was a pretty negative reaction... Old %a002050 is hurt, I tell you!\n@c0@"
  ja: "@a@b%a002050「イ……イヤ……とか\n\t言われちゃいましたね！\n\t私　ショックです……。\n@c0@"
  ko: "@a@b%a002050: 시......싫어......라고\n말했죠!\n저, 충격인데요......\n@c0@"
  sl: "@a@b%a002050：她说不要呢！\n　　我受打击了……\n@c0@"
  tl: "@a@b%a002050：她說不要呢！\n　　我受打擊了……\n@c0@"
161:
  en: "@a%0%a002000@bReally, %a000090? Nothing happened here?\n@c0@"
  ja: "@a@b%a002000「なあ　%a000090\n\t何も　見なかったことに\n\tしてしまって　いいのか？\n@c0@"
  ko: "@a@b%a002000: 이봐, %a000090.\n아무것도 못 본 걸로 하고\n넘어가도 되는 거냐?\n@c0@"
  sl: "@a@b%a002000：%a000090，\n　　咱要装作\n　　什么都没看见吗？\n@c0@"
  tl: "@a@b%a002000：%a000090，\n　　咱要裝作\n　　什麼都沒看見嗎？\n@c0@"
162:
  en: "@a%0%a002010@b%0%a000090, if we go back now, we won't have accomplished anything.\n@c0@"
  ja: "@a@b%a002010「ここで　帰ったら\n\tなにも　わからないままよ。\n@c0@"
  ko: "@a@b%a002010: 여기서 돌아가면\n아무것도 알 수 없다구.\n@c0@"
  sl: "@a@b%a002010：要是现在回去的话，\n　　什么事情都弄不明白啊。\n@c0@"
  tl: "@a@b%a002010：要是現在回去的話，\n　　什麼事情都弄不明白啊。\n@c0@"
163:
  en: "@a%0%a002020@bYou sure that's the best thing for them, %a000090?\n@c0@"
  ja: "@a@b%a002020「ねえ　%a000090……\n\tこれで　いいの？\n@c0@"
  ko: "@a@b%a002020: 저기, %a000090......\n이래도 괜찮은 거야?\n@c0@"
  sl: "@a@b%a002020：%a000090……\n　　这样就行了吗？\n@c0@"
  tl: "@a@b%a002020：%a000090……\n　　這樣就行了嗎？\n@c0@"
164:
  en: "@a%0%a002030@bWe must pursue the truth...\n@c0@"
  ja: "@a@b%a002030「やはり　真実を\n\tつきとめることが　必要では……。\n@c0@"
  ko: "@a@b%a002030: 역시 진실을\n밝혀내야 하는 게 아닌지......\n@c0@"
  sl: "@a@b%a002030：果然有必要\n　　查明真相呢……\n@c0@"
  tl: "@a@b%a002030：果然有必要\n　　查明真相呢……\n@c0@"
165:
  en: "@a%0%a002050@bAre we just goin' to leave?\n@c0@"
  ja: "@a@b%a002050「え…？\n\tさっさと　出て行きますか？\n@c0@"
  ko: "@a@b%a002050: 네...?\n바로 나갈 겁니까?\n@c0@"
  sl: "@a@b%a002050：诶？\n　　现在就出去吗？\n@c0@"
  tl: "@a@b%a002050：誒？\n　　現在就出去嗎？\n@c0@"
166:
  en: "@a%0%a002000@bWhat a tale, aye? You're about to see a grown man cry. (sniff)\n@c0@"
  ja: "@a@b%a002000「くうーっ\n\tいい話じゃないか！\n\t泣けてくるぜ！\n@c0@"
