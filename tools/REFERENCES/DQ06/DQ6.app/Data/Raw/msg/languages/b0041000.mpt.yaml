0:
  en: "@a@b*: This continent was once home to a mighty king who fought against a terrible evil.\n@c0@"
  ja: "@a@b＊「かつて　この大陸には\n\t大魔王と　戦おうとした王が\n\t住んでいました。\n@c0@"
  ko: "@a@b*: 과거에 이 대륙에는\n대마왕과 싸우려는 왕이\n살고 있었습니다.\n@c0@"
  sl: "@a@b＊：过去在这个大陆上曾经\n　　住着一个想要\n　　同大魔王一战的国王。\n@c0@"
  tl: "@a@b＊：過去在這個大陸上曾經\n　　住著一個想要\n　　同大魔王一戰的國王。\n@c0@"
1:
  en: "@a@b*: But one day, without warning, the king's castle was suddenly destroyed.\n@c0@"
  ja: "@a@b＊「しかし　ある時\n\t突然　その王の住む城は\n\t滅び去ったのです。\n@c0@"
  ko: "@a@b*: 하지만 어느 날\n그 왕이 사는 성이 한순간에\n멸망하고 말았죠.\n@c0@"
  sl: "@a@b＊：但是某一天，\n　　那个国王居住的城堡\n　　忽然就毁灭了。\n@c0@"
  tl: "@a@b＊：但是某一天，\n　　那個國王居住的城堡\n　　忽然就毀滅了。\n@c0@"
2:
  en: "@a@b*: Legend has it that the Armour of Orgo — one of the four legendary relics — was kept within those castle walls...\n@c0@"
  ja: "@a@b＊「その城には　伝説の武具のひとつ\n\tオルゴーの鎧が　まつられていた\n\tという話なのですが……。\n@c0@"
  ko: "@a@b*: 그 성에는 전설의 장비 중 하나인\n오르고의 갑옷이 모셔져 있었다고\n들었습니다만......\n@c0@"
  sl: "@a@b＊：据说那座城里供奉着\n　　传说中的武具之一\n　　奥尔戈铠甲……\n@c0@"
  tl: "@a@b＊：據說那座城裡供奉著\n　　傳說中的武具之一\n　　奧爾戈鎧甲……\n@c0@"
3:
  en: "@a@b*: Welcome to Castle Swanstone.\n@c0@"
  ja: "@a@b＊「フォーン城へ　ようこそ！\n@c0@"
  ko: "@a@b*: 폰 성에 오신 것을 환영합니다!\n@c0@"
  sl: "@a@b＊：欢迎来到佛恩城！\n@c0@"
  tl: "@a@b＊：歡迎來到佛恩城！\n@c0@"
4:
  en: "@a@b*: Woof woof.\n@c0@"
  ja: "@a@b＊「わおーん！\n@c0@"
  ko: "@a@b*: 왈왈~!\n@c0@"
  sl: "@a@b＊：汪汪！\n@c0@"
  tl: "@a@b＊：汪汪！\n@c0@"
5:
  en: "@a@b*: Here to see the mirror princess, eh?\n@c0@"
  ja: "@a@b＊「あんた　カガミ姫を\n\t見せて　もらったかい？\n@c0@"
  ko: "@a@b*: 당신, 거울 공주\n보여 달라고 해 봤나?\n@c0@"
  sl: "@a@b＊：国王陛下让你见\n　　明镜公主了吗？\n@c0@"
  tl: "@a@b＊：國王陛下讓你見\n　　明鏡公主了嗎？\n@c0@"
6:
  en: "@a@b*: She really is beautiful. (sigh) Once you see her... Well, you'll understand how the King feels...\n@c0@"
  ja: "@a@b＊「あれだけ　美しい娘だ。\n\t王さまの　気持ちも\n\tわかるよ。\n@c0@"
  ko: "@a@b*: 그렇게나 아름다운 아가씨라니.\n폐하의 심정도\n이해가 가.\n@c0@"
  sl: "@a@b＊：那姑娘那么漂亮，\n　　国王陛下的心情\n　　我也能理解。\n@c0@"
  tl: "@a@b＊：那姑娘那麼漂亮，\n　　國王陛下的心情\n　　我也能理解。\n@c0@"
7:
  en: "@a@b*: I know I certainly do...\n@c0@"
  ja: "@a@b＊「オレだって……なあ？\n@c0@"
  ko: "@a@b*: 나 역시 그렇고...... 너도 그렇지?\n@c0@"
  sl: "@a@b＊：我也……是吧？\n@c0@"
  tl: "@a@b＊：我也……是吧？\n@c0@"
8:
  en: "@a@b*: You should really go and have a look.\n@c0@"
  ja: "@a@b＊「いちどは　見ておいたほうが\n\tいいぞ。\n@c0@"
  ko: "@a@b*: 한 번쯤 봐 놓는 게\n좋을 거다.\n@c0@"
  sl: "@a@b＊：还是去见一次\n　　比较好。\n@c0@"
  tl: "@a@b＊：還是去見一次\n　　比較好。\n@c0@"
9:
  en: "@a@b*: You'll need to get the King's permission first, though.\n@c0@"
  ja: "@a@b＊「王さまに　たのんでみるんだな。\n@c0@"
  ko: "@a@b*: 폐하께 부탁드려 봐.\n@c0@"
  sl: "@a@b＊：去拜托国王陛下吧。\n@c0@"
  tl: "@a@b＊：去拜託國王陛下吧。\n@c0@"
10:
  en: "@a@b*: Oh, King Ludwig... What about me...?\n@c0@"
  ja: "@a@b＊「ああ！　フォーンさま……。\n\t私では……\n@c0@"
  ko: "@a@b*: 아아! 폰 님......\n저는......\n@c0@"
  sl: "@a@b＊：啊！佛恩陛下……\n　　我……\n@c0@"
  tl: "@a@b＊：啊！佛恩陛下……\n　　我……\n@c0@"
11:
  en: "@a@b*: Am I not worthy of your love...?\n@c0@"
  ja: "@a@b＊「私では　ダメなのですか？\n@c0@"
  ko: "@a@b*: 정녕 저는 안 되나요?\n@c0@"
  sl: "@a@b＊：我不行吗？\n@c0@"
  tl: "@a@b＊：我不行嗎？\n@c0@"
12:
  en: "@a@b*: Ach! Was I asking you? No!\n@c0@"
  ja: "@a@b＊「キーッ！\n\tだれも　あなた　なんかに\n\t聞いて　ないわよ！\n@c0@"
  ko: "@a@b*: 꺄아!\n당신한테 물어본 거\n아니거든!\n@c0@"
  sl: "@a@b＊：呀！\n　　没人问你！\n@c0@"
  tl: "@a@b＊：呀！\n　　沒人問你！\n@c0@"
13:
  en: "@a@b*: Hmm? Y—㈢You were listening!? Oh, you're too kind... Hoo hoo! Ⓟ\n@c0@"
  ja: "@a@b＊「え？　あ㈢　あら\n\t聞いてらしたの？\n\tイヤですわ……㈢ポッⓅ\n@c0@"
  ko: "@a@b*: 응? 어,㈢ 어머나\n듣고 있었어?\n세상에...... ㈢부끄러워라.Ⓟ\n@c0@"
  sl: "@a@b＊：诶？哎㈢、哎呀，\n　　你听到了？\n　　真讨厌……㈢Ⓟ\n@c0@"
  tl: "@a@b＊：誒？哎㈢、哎呀，\n　　你聽到了？\n　　真討厭……㈢Ⓟ\n@c0@"
14:
  en: "@a@b*: Great Goddess, how I wonder... What sort of riddles hide behind the princess in the mirror?\n@c0@"
  ja: "@a@b＊「いやはや　まったく……。\n\tカガミ姫には　どんなナゾが\n\tこめられているのだろうか？\n@c0@"
  ko: "@a@b*: 참으로 궁금하군......\n거울 공주에는 어떤 수수께끼가\n숨어 있는 것인가?\n@c0@"
  sl: "@a@b＊：哎呀，真是的……\n　　明镜公主身上到底有\n　　多少未解之谜啊？\n@c0@"
  tl: "@a@b＊：哎呀，真是的……\n　　明鏡公主身上到底有\n　　多少未解之謎啊？\n@c0@"
15:
  en: "@a@b*: In any case...\n@c0@"
  ja: "@a@b＊「それは　さておき……。\n@c0@"
  ko: "@a@b*: 그건 그렇고......\n@c0@"
  sl: "@a@b＊：话说回来……\n@c0@"
  tl: "@a@b＊：話說回來……\n@c0@"
16:
  en: "@a@b*: Oh? Are you here because you heard the rumour of the cursed mirror princess too?\n@c0@"
  ja: "@a@b＊「あら？　あなたも　呪われた\n\tカガミ姫の　ウワサを聞いて\n\tここへ　来たの？\n@c0@"
  ko: "@a@b*: 어머? 당신도 저주받은\n거울 공주에 대한 소문을 듣고\n여기 온 거야?\n@c0@"
  sl: "@a@b＊：哎呀？你也是听说了\n　　被诅咒的明镜公主的传说，\n　　才来这里的吗？\n@c0@"
  tl: "@a@b＊：哎呀？你也是聽說了\n　　被詛咒的明鏡公主的傳說，\n　　才來這裡的嗎？\n@c0@"
17:
  en: "@a@b*: Hmm... It is true that many people came here to see her in times gone by...\n@c0@"
  ja: "@a@b＊「ふーん。　でも　残念ね。\n\t昔は　たくさんのひとが\n\t見物に　来ていたんだけど……\n@c0@"
  ko: "@a@b*: 흐음. 안됐네.\n옛날에는 많은 사람들이\n구경하러 왔었지만......\n@c0@"
  sl: "@a@b＊：唔。不过很遗憾。\n　　过去有很多人来这里\n　　一睹公主芳容……\n@c0@"
  tl: "@a@b＊：唔。不過很遺憾。\n　　過去有很多人來這裡\n　　一睹公主芳容……\n@c0@"
18:
  en: "@a@b*: But the current king, Ludwig, he has decided that she is not to be displayed to the common people. (sigh)\n@c0@"
  ja: "@a@b＊「今の王さまが　ふつうのひとには\n\t見せないように　しちゃったの。\n@c0@"
  ko: "@a@b*: 지금 왕은 보통 사람들에게는\n보여 주지 않도록 하고 있어.\n@c0@"
  sl: "@a@b＊：但是现在国王陛下是\n　　不会让普通人去见公主的。\n@c0@"
  tl: "@a@b＊：但是現在國王陛下是\n　　不會讓普通人去見公主的。\n@c0@"
19:
  en: "@a@b*: A beautiful princess trapped in a cursed mirror...\n@c0@"
  ja: "@a@b＊「呪いの鏡に　とらわれた\n\t悲しみの　美しき姫……。\n@c0@"
  ko: "@a@b*: 저주의 거울에 사로잡힌\n슬프고도 아름다운 공주......\n@c0@"
  sl: "@a@b＊：被束缚在诅咒之镜里的\n　　美丽又可怜的公主……\n@c0@"
  tl: "@a@b＊：被束縛在詛咒之鏡裡的\n　　美麗又可憐的公主……\n@c0@"
20:
  en: "@a@b*: Surely you must have heard of it... It is a famous story.\n@c0@"
  ja: "@a@b＊「けっこう　有名なウワサ\n\tなんだけどね。\n@c0@"
  ko: "@a@b*: 꽤 유명한 소문인데\n몰랐나 보네.\n@c0@"
  sl: "@a@b＊：这传说挺有名的呢。\n@c0@"
  tl: "@a@b＊：這傳說挺有名的呢。\n@c0@"
21:
  en: "@a@b*: King Ludwig van Swanstone is upstairs.\n@c0@"
  ja: "@a@b＊「王の間は　この上です。\n@c0@"
  ko: "@a@b*: 국왕 폐하의 방은 이 위쪽입니다.\n@c0@"
  sl: "@a@b＊：上面就是谒见之间。\n@c0@"
  tl: "@a@b＊：上面就是謁見之間。\n@c0@"
22:
  en: "@a@b*: None shall pass without permission. Rules are rules.\n@c0@"
  ja: "@a@b＊「ゆるしなき者を\n\tこれより先に　入れることはできぬ。\n\tどうか　おひきとりを。\n@c0@"
  ko: "@a@b*: 허가받지 않은 자는\n이 앞으로 들여보낼 수 없습니다.\n돌아가 주십시오.\n@c0@"
  sl: "@a@b＊：未经许可之人，\n　　不得进入。\n　　请回吧。\n@c0@"
  tl: "@a@b＊：未經許可之人，\n　　不得進入。\n　　請回吧。\n@c0@"
23:
  en: "@a@b*: Please go ahead.\n@c0@"
  ja: "@a@b＊「どうぞ　お通りください。\n@c0@"
  ko: "@a@b*: 자, 지나가십시오.\n@c0@"
  sl: "@a@b＊：请通过吧。\n@c0@"
  tl: "@a@b＊：請通過吧。\n@c0@"
24:
  en: "@a@b*: Head downstairs and you'll find the mirror chamber and a couple of storage rooms.\n@c0@"
  ja: "@a@b＊「この下は　鏡の間と\n\t宝物庫に　なっています。\n@c0@"
  ko: "@a@b*: 이 아래층은 거울의 방과\n보물 창고로 이루어져 있습니다.\n@c0@"
  sl: "@a@b＊：这下面是\n　　镜之间和宝物库。\n@c0@"
  tl: "@a@b＊：這下面是\n　　鏡之間和寶物庫。\n@c0@"
25:
  en: "@a@b*: Don't even think of hanging around down there, though.\n@c0@"
  ja: "@a@b＊「ですから　あまり　ウロウロ\n\tしないで　くださいね。\n@c0@"
  ko: "@a@b*: 그러니 괜히 어슬렁거리지\n말아 주십시오.\n@c0@"
  sl: "@a@b＊：所以请不要\n　　在这里晃悠。\n@c0@"
  tl: "@a@b＊：所以請不要\n　　在這裡晃悠。\n@c0@"
26:
  en: "@a@b*: I saw the mirror princess once...\n@c0@"
  ja: "@a@b＊「オレさ　カガミ姫を\n\t見せてもらったこと　あるのよ。\n@c0@"
  ko: "@a@b*: 나 말이야, 거울 공주를\n보여 달라고 해서 본 적이 있어.\n@c0@"
  sl: "@a@b＊：国王陛下让我去看过\n　　明镜公主哦。\n@c0@"
  tl: "@a@b＊：國王陛下讓我去看過\n　　明鏡公主哦。\n@c0@"
27:
  en: "@a@b*: I was convinced she wasn't real, but then I laid eyes on her — she's real, alright...\n@c0@"
  ja: "@a@b＊「最初は　インチキでも\n\tしてるのかと　思ったんだけど\n\tそうじゃねえ　みたいなんだ。\n@c0@"
  ko: "@a@b*: 처음에는 무슨 속임수라도\n부리는 건가 싶었지만\n그게 아닌 것 같더라고.\n@c0@"
  sl: "@a@b＊：刚开始我以为是\n　　什么骗人的把戏，\n　　不过好像不是那样。\n@c0@"
  tl: "@a@b＊：剛開始我以為是\n　　什麼騙人的把戲，\n　　不過好像不是那樣。\n@c0@"
28:
  en: "@a@b*: It is just shameful how the new king is so infatuated with rescuing that girl in the mirror...\n㈡\n*: What would his ancestors think if they knew?\n@c0@"
  ja: "@a@b＊「鏡にうつった　女に\n\tウツツを　抜かすなど……先代の王が\n\t聞いたら　なんと　思うやら……。\n@c0@"
  ko: "@a@b*: 거울에 비친 여자한테\n온통 정신이 팔리다니...... 선대 왕께서\n들으시면 어찌 생각하실꼬......\n@c0@"
  sl: "@a@b＊：被镜中的女人迷得神魂颠倒……\n　　要是先王知道了的话\n　　会怎么想……\n@c0@"
  tl: "@a@b＊：被鏡中的女人迷得神魂顛倒……\n　　要是先王知道了的話\n　　會怎麼想……\n@c0@"
29:
  en: "@a@b*: I'm sure they'd be turning in their graves... (sigh)\n@c0@"
  ja: "@a@b＊「じいは　悲しいですぞ！\n@c0@"
  ko: "@a@b*: 이 늙은이는 슬프다오!\n@c0@"
  sl: "@a@b＊：老头子我太伤心了！\n@c0@"
  tl: "@a@b＊：老頭子我太傷心了！\n@c0@"
30:
  en: "@a@b*: I understand how the old man feels...\n@c0@"
  ja: "@a@b＊「じいの　いうことも　わかるよ。\n@c0@"
  ko: "@a@b*: 영감님 말씀도 이해는 가.\n@c0@"
  sl: "@a@b＊：我能理解老爷爷说的话。\n@c0@"
  tl: "@a@b＊：我能理解老爺爺說的話。\n@c0@"
31:
  en: "@a@b*: But the King isn't the only one who would love to see the princess freed from the mirror.\n@c0@"
  ja: "@a@b＊「でも　私だって　あの姫を\n\t鏡の中から　助け出して\n\tあげたいと　思うんだ。\n@c0@"
  ko: "@a@b*: 하지만 나 역시 그 공주를\n거울 밖으로 꺼내 주고 싶다는\n생각이 드는걸.\n@c0@"
  sl: "@a@b＊：但是我也想\n　　把那个公主从镜子里面\n　　救出来啊。\n@c0@"
  tl: "@a@b＊：但是我也想\n　　把那個公主從鏡子裡面\n　　救出來啊。\n@c0@"
32:
  en: "@a@b*: I've tried every trick I could think of. Whoever trapped her in that mirror must have used a powerful curse...\n@c0@"
  ja: "@a@b＊「あらゆる方法で　調べたすえ\n\t姫は　何者かの　呪いによって\n\t鏡の中に　閉じ込められ……\n@c0@"
  ko: "@a@b*: 갖가지 방법을 동원해서 알아본 결과\n공주는 정체 모를 자의 저주 때문에\n거울 속에 갇혀 버렸고......\n@c0@"
  sl: "@a@b＊：种种调查发现，\n　　公主是遭到某个人的诅咒，\n　　被困在了镜子里面……\n@c0@"
  tl: "@a@b＊：種種調查發現，\n　　公主是遭到某個人的詛咒，\n　　被困在了鏡子裡面……\n@c0@"
33:
  en: "@a@b*: Now, I have learnt that the curse can be broken by casting a certain spell in front of the mirror.\n@c0@"
  ja: "@a@b＊「その呪いを　解くには\n\tある呪文を　鏡の前で\n\tとなえればいいと　わかった。\n@c0@"
  ko: "@a@b*: 그 저주를 풀려면\n어떤 주문을 거울 앞에서\n외우면 된다는 걸 알았지.\n@c0@"
  sl: "@a@b＊：要想解开诅咒，\n　　只要在镜子前面\n　　念某段咒文就行了。\n@c0@"
  tl: "@a@b＊：要想解開詛咒，\n　　只要在鏡子前面\n　　念某段咒文就行了。\n@c0@"
34:
  en: "@a@b*: I've even gone as far as to learn the words of that spell...\n@c0@"
  ja: "@a@b＊「そして　その呪文の言葉も\n\t発見できたんだ。\n@c0@"
  ko: "@a@b*: 그리고 그 주문 역시\n찾아냈어.\n@c0@"
  sl: "@a@b＊：而且那段咒文内容\n　　也找到了。\n@c0@"
  tl: "@a@b＊：而且那段咒文內容\n　　也找到了。\n@c0@"
35:
  en: "@a@b*: But...it was all for naught. No matter who casts it, the spell just doesn't work... (sigh)\n@c0@"
  ja: "@a@b＊「でも　ダメだったんだよ。\n\tだれが　となえても……。\n@c0@"
  ko: "@a@b*: 그런데도 안 되더라고.\n그 누가 와서 외워도......\n@c0@"
  sl: "@a@b＊：但是不行，\n　　谁念都不行……\n@c0@"
  tl: "@a@b＊：但是不行，\n　　誰念都不行……\n@c0@"
36:
  en: "@a@b*: And so, the princess remains trapped in the mirror...\n@c0@"
