0:
  en: "@a@b*: Oh! Good day! Come to see the flying bed, perchance?\n@c0@"
  ja: "@a@b＊「あっ　あなた　もしかして\n\t空とぶベッドを　見に\n\tこの町へ　来たのですかっ？\n@c0@"
  ko: "@a@b*: 앗, 당신 혹시\n하늘을 나는 침대를 보러\n이 마을에 온 겁니까?\n@c0@"
  sl: "@a@b＊：你们难道是\n　　来这个镇上\n　　看飞天床的吗？\n@c0@"
  tl: "@a@b＊：你們難道是\n　　來這個鎮上\n　　看飛天床的嗎？\n@c0@"
1:
  en: "@a@b*: Really? My, that's simply wonderful! We hardly get any tourists in town any more...\n@c0@"
  ja: "@a@b＊「いやあ　うれしいな。　最近では\n\tあなたのような　観光客も\n\tいなくなってしまって……。\n@c0@"
