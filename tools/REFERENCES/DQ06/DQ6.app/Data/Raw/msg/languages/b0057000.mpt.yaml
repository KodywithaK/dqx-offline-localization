  ja: "@a@b＊「そうですよね……空とぶベッドなら\n\tほかの町や城でも　見かけたひとが\n\tいるっていうし。\n@c0@"
  ko: "@a@b*: 역시 그렇군요...... 하늘을 나는 침대는\n다른 마을이나 성에서도 봤다는 사람이\n있다고 하니까요.\n@c0@"
