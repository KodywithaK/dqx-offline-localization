  sl: "@a@b＊：是吗。那么，\n　　为了早日见到国王，\n　　你要立下功劳才行。\n@c0@"
  tl: "@a@b＊：是嗎。那麼，\n　　為了早日見到國王，\n　　你要立下功勞才行。\n@c0@"
123:
  en: "@a@b*: His Majesty slaves away all day and all night. He's the sire that never sleeps!\n@c0@"
  ja: "@a@b＊「王さまは　まったく　ねむらずに\n\tはたらいているのよ。\n@c0@"
  ko: "@a@b*: 같은 남자가 봐도 반할 만큼\n수려한 외모이시죠.\n@c0@"
  sl: "@a@b＊：陛下完全不休息，\n　　一直在不间断地工作。\n@c0@"
  tl: "@a@b＊：陛下完全不休息，\n　　一直在不間斷地工作。\n@c0@"
124:
  en: "@a@b*: That means we have to cook twice as many meals. A midnight snack is just another lunch to him!\n@c0@"
  ja: "@a@b＊「だから　えいようの　いっぱいある\n\tおいしい物を　つくらなきゃね。\n@c0@"
  ko: "@a@b*: 게다가 섬세하고\n근면 성실하기까지......\n@c0@"
  sl: "@a@b＊：所以，\n　　我得做些营养丰富的食物。\n@c0@"
  tl: "@a@b＊：所以，\n　　我得做些營養豐富的食物。\n@c0@"
125:
  en: "@a@b*: Mm? Ah, it's you! I received the order.\n@c0@"
  ja: "@a@b＊「おお　あんたたちか\n\t話は　聞いているぞい！\n@c0@"
  ko: "@a@b*: 그러시군요. 왕을 빨리\n만나고 싶다면 뭔가\n공을 세우는 게 좋을 겁니다.\n@c0@"
  sl: "@a@b＊：哦哦，是你们啊。\n　　我已经听说了！\n@c0@"
  tl: "@a@b＊：哦哦，是你們啊。\n　　我已經聽說了！\n@c0@"
126:
  en: "@a@b*: The wagon is (sniff) loaded and waiting for you outside. Do try and bring it back in one piece! (sniff)\n@c0@"
  ja: "@a@b＊「馬車は　おもてに出しておいたから\n\t大切に　つかうようにな。\n@c0@"
  ko: "@a@b*: 폐하는 한숨도 안 자고\n일하고 계셔.\n@c0@"
  sl: "@a@b＊：马车已在城外备好，\n　　请好好珍惜它。\n@c0@"
  tl: "@a@b＊：馬車已在城外備好，\n　　請好好珍惜它。\n@c0@"
127:
  en: "@a@b*: I promised myself I wouldn't cry when you took it. (sniff sniff). This cart was meant for His Majesty! (sniff)\n@c0@"
  ja: "@a@b＊「しかし　わしは　この国の王が\n\t馬車で　野をかける雄姿を\n\t見たかったもんじゃのう。\n@c0@"
  ko: "@a@b*: 그래서 영양 가득한\n맛있는 음식을 만들어 드려야 해.\n@c0@"
  sl: "@a@b＊：马车已经有了，\n　　不过我还想目睹\n　　我王驾车驰骋的英姿。\n@c0@"
  tl: "@a@b＊：馬車已經有了，\n　　不過我還想目睹\n　　我王駕車馳騁的英姿。\n@c0@"
128:
  en: "@a@b*: Walk up to the bars if you want to talk to prisoners.\n@c0@"
  ja: "@a@b＊「ここは　牢屋です。\n\t囚人と　話がしたいなら\n\t牢屋ごしに　話してください。\n@c0@"
  ko: "@a@b*: 오오, 자네들이군.\n이야기는 들었다네!\n@c0@"
  sl: "@a@b＊：这里是牢房。\n　　要是想与囚犯对话的话，\n　　就请隔着牢门说话。\n@c0@"
  tl: "@a@b＊：這裡是牢房。\n　　要是想與囚犯對話的話，\n　　就請隔著牢門說話。\n@c0@"
129:
  en: "@a@b*: Goddess save me! It's that monster mustang come to finish the job! Guard! Help me!\n@c0@"
  ja: "@a@b＊「げーっ！　まさか　あんたらが\n\tつれてるのは　あの草原にいた\n\tあばれ馬！\n@c0@"
  ko: "@a@b*: 마차는 밖에 내다 놓았으니\n소중히 잘 사용하게나.\n@c0@"
  sl: "@a@b＊：哇！不会吧！\n　　你们抓住的就是\n　　那匹草原上的狂暴马！\n@c0@"
  tl: "@a@b＊：哇！不會吧！\n　　你們抓住的就是\n　　那匹草原上的狂暴馬！\n@c0@"
130:
  en: "@a@b*: Wait, you actually tamed that freak of nature? Man, you got guts!\n@c0@"
  ja: "@a@b＊「そんな化け物の馬を\n\t手なずけるなんて\n\tおみそれしやした。　へへー。\n@c0@"
