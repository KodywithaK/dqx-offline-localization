  ko: "@a@b*: 여기부터는 다른 나라 영토라서\n어디에 뭐가 있는지\n잘 모른다오.\n@c0@"
  sl: "@a@b＊：那么，\n　　请您好好地休息吧。\n@c0@"
  tl: "@a@b＊：那麼，\n　　請您好好地休息吧。\n@c0@"
286:
  en: "@a@b*: May the Goddess bless you, today and always.\n@c0@"
  ja: "@a@b＊「神さま　今日も　よい１日で\n\tありますように……。\n@c0@"
  ko: "@a@b*: 레이독 성의 병사라면\n무슨 일이 있어도\n좌절하지 않아야 하오.\n@c0@"
  sl: "@a@b＊：神明啊，\n　　今天也请保佑我们……\n@c0@"
  tl: "@a@b＊：神明啊，\n　　今天也請保佑我們……\n@c0@"
287:
  en: "@a@b*: The Goddess is always watching over you. Live with a brave, kind heart and you have nothing to fear.\n@c0@"
  ja: "@a@b＊「神さまは　いつも　私たちを\n\t見まもってくださっています。\n\t心　ただしく　生きますように。\n@c0@"
  ko: "@a@b*: 무슨 사정인지는 모르겠지만\n오랜 여행으로 피곤하시겠네요.\n묵고 가시겠습니까?\n@c0@"
  sl: "@a@b＊：神明一直保佑着我们。\n　　指引我们正直地去生活。\n@c0@"
  tl: "@a@b＊：神明一直保佑著我們。\n　　指引我們正直地去生活。\n@c0@"
288:
  en: "@a@b*: Very well. Don't push yourself too hard.\n@c0@"
  ja: "@a@b＊「そうですか。　あまり　ご無理を\n\tなさいませぬように。\n@c0@"
  ko: "@a@b*: 그럼 편안히\n푹 주무시길 바랍니다.\n@c0@"
  sl: "@a@b＊：这样啊。\n　　请不要太勉强自己。\n@c0@"
  tl: "@a@b＊：這樣啊。\n　　請不要太勉強自己。\n@c0@"
289:
  en: "@a@b*: Aha! %0%a000090, right? I thought I saw you somewhere before!\n@c0@"
  ja: "@a@b＊「やや！　どこかで見たと思ったら\n\tおまえは　たしか　%a000090！\n@c0@"
  ko: "@a@b*: 신이시여, 오늘도 좋은 하루가\n되게 하소서......\n@c0@"
  sl: "@a@b＊：啊啊！我应该在哪里见过你，\n　　你是%a000090吧！\n@c0@"
  tl: "@a@b＊：啊啊！我應該在哪裡見過你，\n　　你是%a000090吧！\n@c0@"
290:
  en: "@a@b*: Remember me? I was in the group of soldiers King Somnus was briefing just before he met you.\n@c0@"
  ja: "@a@b＊「私を　おぼえておらんか！？\n\tおぬしが　レイドック王に\n\t会ったとき　うしろに　いただろう。\n@c0@"
  ko: "@a@b*: 신은 언제나 우리를\n지켜보고 계십니다.\n착하고 정직하게 사시길 바랍니다.\n@c0@"
  sl: "@a@b＊：你还记得我吗？！\n　　你会见雷多克王的时候，\n　　我就站在你后边。\n@c0@"
  tl: "@a@b＊：你還記得我嗎？！\n　　你會見雷多克王的時候，\n　　我就站在你後邊。\n@c0@"
291:
  en: "@a@b*: Guess we're on the same quest, huh?\n@c0@"
  ja: "@a@b＊「そういえば　おぬしも\n\t私と同じ指令を　うけたのだったな。\n@c0@"
  ko: "@a@b*: 그러시군요. 너무\n무리하지 않길 바랍니다.\n@c0@"
  sl: "@a@b＊：话说回来，\n　　你和我接到了同样的指令吧。\n@c0@"
  tl: "@a@b＊：話說回來，\n　　你和我接到了同樣的指令吧。\n@c0@"
292:
  en: "@a@b*: What an impossible mission. How're we supposed to find one little mirror in the whole wide world?\n@c0@"
  ja: "@a@b＊「しかし　鏡（かがみ）が　どこにあるのか\n\tまったく　雲をつかむようで\n\tまいってしまったよ。\n@c0@"
  ko: "@a@b*: 아아! 어디서 많이 본 얼굴이다\n싶었는데, 자네는 분명 %a000090!\n@c0@"
  sl: "@a@b＊：可是镜子到底在哪里，\n　　完全抓不到线索啊。\n@c0@"
  tl: "@a@b＊：可是鏡子到底在哪裡，\n　　完全抓不到線索啊。\n@c0@"
293:
  en: "@a@b*: Where in the world could that mirror be? What an impossible mission...\n@c0@"
  ja: "@a@b＊「ぶつぶつ……　いったい　どこに\n\tあるのだ……　ラーの鏡（かがみ）は！\n\tまったく　雲をつかむような話だ。\n@c0@"
  ko: "@a@b*: 내가 기억이 안 난다고!?\n자네가 레이독 왕을\n만날 때 바로 뒤에 있었잖아.\n@c0@"
  sl: "@a@b＊：真是的……\n　　太阳神镜……到底在哪里啊！\n　　完全抓不到线索啊。\n@c0@"
  tl: "@a@b＊：真是的……\n　　太陽神鏡……到底在哪裡啊！\n　　完全抓不到線索啊。\n@c0@"
294:
  en: "@a@b*: Oh, ya caught me thanking the Goddess. I got lost on my way to pick up some merchandise, ya see.\n@c0@"
  ja: "@a@b＊「私は　旅の商人ですが\n\t道に　まよってしまって……。\n@c0@"
  ko: "@a@b*: 그러고 보니 자네도\n나와 같은 지령을 받았었지.\n@c0@"
  sl: "@a@b＊：我是旅行商人，\n　　我迷路了……\n@c0@"
  tl: "@a@b＊：我是旅行商人，\n　　我迷路了……\n@c0@"
295:
  en: "@a@b*: This church was a real lifesaver for me.\n@c0@"
  ja: "@a@b＊「しかし　この教会を見つけて\n\tホント　命びろいしましたよ。\n@c0@"
  ko: "@a@b*: 하지만 거울이 어디 있는지\n도무지 뜬구름 잡기 같아서\n머리가 돌 지경이야.\n@c0@"
  sl: "@a@b＊：还好，发现了这个教会，\n　　真是捡了一条命。\n@c0@"
  tl: "@a@b＊：還好，發現了這個教會，\n　　真是撿了一條命。\n@c0@"
296:
  en: "@a@b*: That crotchety dwarf in the house down south wouldn't give me the time of day!\n@c0@"
  ja: "@a@b＊「南から来る　とちゅうにあった\n\tガンコおやじの家じゃ　休むことも\n\tできませんでしたからなあ。\n@c0@"
  ko: "@a@b*: 투덜투덜...... 대체 어디\n있다는 거야...... 라의 거울은!\n이건 뜬구름 잡기나 다름 없어.\n@c0@"
  sl: "@a@b＊：从这里往南\n　　有个顽固的老爷子，\n　　不过他家根本不能休息。\n@c0@"
  tl: "@a@b＊：從這裡往南\n　　有個頑固的老爺子，\n　　不過他家根本不能休息。\n@c0@"
297:
  en: "@a@b*: Aha! %0%a002000, right? I thought I saw you somewhere before!\n@c0@"
