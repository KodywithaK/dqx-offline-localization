  sl: "@a@b＊：国王陛下每天有很多事要做，\n　　总是非常地忙碌。\n@c0@"
  tl: "@a@b＊：國王陛下每天有很多事要做，\n　　總是非常地忙碌。\n@c0@"
104:
  en: "@a@b*: Right now, I hear he's recruiting capable soldiers for a search expedition of some sort.\n@c0@"
  ja: "@a@b＊「今は　あるものを　さがすために\n\t有能な兵士を　集めているんですって。\n\t毎日　たいへんよね。\n@c0@"
  ko: "@a@b*: 그래서 아직 국왕 폐하와\n직접 얘기해 보진 못했어요.\n@c0@"
  sl: "@a@b＊：现在在召集士兵，\n　　说是为了找什么东西。\n　　每天都很辛苦。\n@c0@"
  tl: "@a@b＊：現在在召集士兵，\n　　說是為了找什麼東西。\n　　每天都很辛苦。\n@c0@"
105:
  en: "@a@b*: I hear His Majesty has hand picked a squad to search for something.\n@c0@"
  ja: "@a@b＊「どうやら　あるものを　さがすための\n\t兵士が　えらばれたみたいね。\n@c0@"
  ko: "@a@b*: 아~아, 빨리 폐하의\n부름을 받고 싶은데.\n@c0@"
  sl: "@a@b＊：国王为了寻找某件东西，\n　　好像在征集士兵呢。\n@c0@"
  tl: "@a@b＊：國王為了尋找某件東西，\n　　好像在徵集士兵呢。\n@c0@"
106:
  en: "@a@b*: Oh, you're one of his few good men? I hope you find whatever this something is!\n@c0@"
  ja: "@a@b＊「え？　あんたも　えらばれたの！？\n\tすごいじゃないのっ。\n@c0@"
  ko: "@a@b*: 폐하는 여러 가지 일로\n매일매일 무척 바쁘시답니다.\n@c0@"
  sl: "@a@b＊：嗯？你也被选上了？！\n　　挺了不起的。\n@c0@"
  tl: "@a@b＊：嗯？你也被選上了？！\n　　挺了不起的。\n@c0@"
107:
  en: "@a@b*: The royal throne room lies up these stairs.\n@c0@"
  ja: "@a@b＊「この上は　レイドック王の\n\t王の間なのだ。\n@c0@"
  ko: "@a@b*: 지금은 어떤 물건을 찾으려고\n유능한 병사를 모은다나 봐요.\n매일 힘드시겠어요.\n@c0@"
  sl: "@a@b＊：上面是雷多克王的\n　　谒见之间。\n@c0@"
  tl: "@a@b＊：上面是雷多克王的\n　　謁見之間。\n@c0@"
108:
  en: "@a@b*: His Majesty has ordered the north-eastern checkpoint gate open. Goddesspeed on your journey, soldiers.\n@c0@"
  ja: "@a@b＊「王の命令により\n\t北東の関所の　門をひらかせた。\n\t気をつけていくのだぞ。\n@c0@"
  ko: "@a@b*: 아무래도 어떤 물건을 찾으려고\n병사를 뽑은 것 같더라고.\n@c0@"
  sl: "@a@b＊：据我王命令，\n　　已打开东北关卡大门。\n　　一路多保重。\n@c0@"
  tl: "@a@b＊：據我王命令，\n　　已打開東北關卡大門。\n　　一路多保重。\n@c0@"
109:
  en: "@a@b*: New around these parts, are you?\n@c0@"
  ja: "@a@b＊「あなた　見ない顔ですね。\n\tはは～ん　わかったぞ。\n@c0@"
  ko: "@a@b*: 뭐? 너도 뽑혔어!?\n너 대단한걸.\n@c0@"
  sl: "@a@b＊：以前没见过你。\n　　啊哈，我知道了。\n@c0@"
  tl: "@a@b＊：以前沒見過你。\n　　啊哈，我知道了。\n@c0@"
110:
  en: "@a@b*: Let me guess: a new recruit? Don't let us down, soldier!\n@c0@"
  ja: "@a@b＊「新しく　はいった　志願兵だ！\n\tがんばってくださいね。\n@c0@"
