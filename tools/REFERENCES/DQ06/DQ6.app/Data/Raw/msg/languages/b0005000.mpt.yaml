  sl: "@a@b＊：你是新来的志愿兵！\n　　请好好努力吧！\n@c0@"
  tl: "@a@b＊：你是新來的志願兵！\n　　請好好努力吧！\n@c0@"
111:
  en: "@a@b*: Are you at all familiar with the Dread Fiend Murdaw, hmm?\n@c0@"
  ja: "@a@b＊「魔王ムドーの　ことを\n\tご存知か？\n@c0@"
