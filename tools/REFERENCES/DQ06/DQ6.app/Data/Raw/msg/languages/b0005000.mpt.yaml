  sl: "@a@b＊：看起来，\n　　决战的时刻越来越近了。\n　　气氛变得紧张起来。\n@c0@"
  tl: "@a@b＊：看起來，\n　　決戰的時刻越來越近了。\n　　氣氛變得緊張起來。\n@c0@"
99:
  en: "@a@b*: If you haven't polished up your weapons, now's the time, %A0120%Xbrother%Z%B0120%Xsister%Z!\n@c0@"
  ja: "@a@b＊「武器の手入れを\n\t念入りに　しなくてはな！\n@c0@"
  ko: "@a@b*: 자네는 운이 참 좋군 그래.\n@c0@"
  sl: "@a@b＊：要好好保养手中的武器！\n@c0@"
  tl: "@a@b＊：要好好保養手中的武器！\n@c0@"
100:
  en: "@a@b*: I'm still pretty new around here. I joined right after my old man retired.\n@c0@"
  ja: "@a@b＊「ぼくは　引退した親父にかわって\n\tつい最近　兵士になりました。\n@c0@"
  ko: "@a@b*: 라의 거울......\n미안하지만 난\n금시초문이야.\n@c0@"
  sl: "@a@b＊：我的父亲退休了，\n　　最近我代替他成为了士兵。\n@c0@"
  tl: "@a@b＊：我的父親退休了，\n　　最近我代替他成為了士兵。\n@c0@"
101:
  en: "@a@b*: His Majesty hasn't said a single word to me yet...\n@c0@"
  ja: "@a@b＊「だから　まだ　王さまとは\n\t直接　話したこと　ないんです。\n@c0@"
  ko: "@a@b*: 아무래도 결전의 때가\n다가왔다는\n기분이 들어.\n@c0@"
  sl: "@a@b＊：不过，到现在为止\n　　都没跟陛下直接说过话。\n@c0@"
  tl: "@a@b＊：不過，到現在為止\n　　都沒跟陛下直接說過話。\n@c0@"
102:
  en: "@a@b*: (sigh) I wonder if I'll ever get a chance to speak with him?\n@c0@"
  ja: "@a@b＊「あ～あ　はやく　王さまに\n\t声をかけてもらいたいなあ。\n@c0@"
  ko: "@a@b*: 무기 손질에\n심혈을 기울여야겠군!\n@c0@"
  sl: "@a@b＊：啊～\n　　希望陛下早日找我谈话。\n@c0@"
  tl: "@a@b＊：啊～\n　　希望陛下早日找我談話。\n@c0@"
103:
  en: "@a@b*: His Majesty is the hardest-working man in the kingdom. His to-do list is three leagues long!\n@c0@"
  ja: "@a@b＊「王さまは　毎日　いろんなことで\n\tとても　いそがしいのよ。\n@c0@"
