  sl: "@a@b＊：魔王姆多的情报，\n　　您了解吗？\n@c0@"
  tl: "@a@b＊：魔王姆多的情報，\n　　您瞭解嗎？\n@c0@"
112:
  en: "@a@b*: You are? Interesting.\n@c0@"
  ja: "@a@b＊「そうか　ムドーのことは\n\t知っておるか……。\n@c0@"
  ko: "@a@b*: 당신은 처음 보는 얼굴이네요.\n아하~ 알겠다.\n@c0@"
  sl: "@a@b＊：哦哦，您了解\n　　魔王姆多是么……\n@c0@"
  tl: "@a@b＊：哦哦，您瞭解\n　　魔王姆多是麼……\n@c0@"
113:
  en: "@a@b*: But what about the so-called ‘phantom realm’, hmm? Stumped you on that one, huh? It's another subject of His Majesty's research.\n@c0@"
  ja: "@a@b＊「しかし　まぼろしの大地については\n\t知らないだろう。　王は　そのことも\n\t研究しているらしいのだ。\n@c0@"
  ko: "@a@b*: 새로 들어온 지원병이군요!\n수고하세요.\n@c0@"
  sl: "@a@b＊：那么，您了解梦幻大地吗？\n　　国王陛下\n　　最近好像在研究这个。\n@c0@"
  tl: "@a@b＊：那麼，您瞭解夢幻大地嗎？\n　　國王陛下\n　　最近好像在研究這個。\n@c0@"
114:
  en: "@a@b*: The Dread Fiend is no stranger to our nation. He has meddled here numerous times in the past.\n@c0@"
  ja: "@a@b＊「魔王ムドーは　この国にも\n\tすでに　何度か　あらわれた。\n@c0@"
  ko: "@a@b*: 마왕 무도를\n알고 있나?\n@c0@"
  sl: "@a@b＊：魔王姆多已经出现过几次。\n@c0@"
  tl: "@a@b＊：魔王姆多已經出現過幾次。\n@c0@"
115:
  en: "@a@b*: Each time, King Somnus has driven him back in a costly battle...\n@c0@"
