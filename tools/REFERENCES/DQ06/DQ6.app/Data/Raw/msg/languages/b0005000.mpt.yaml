  tl: "@a@b＊：啊啊！我應該在哪裡見過你，\n　　你是%a002000吧！\n@c0@"
298:
  ko: "@a@b*: 하지만 이 성당을 찾아내서\n간신히 목숨을 건졌어요.\n@c0@"
299:
  ko: "@a@b*: 남쪽에서 오던 도중에 있던\n고집불통 영감 집에서는 한시도\n쉬질 못했거든요.\n@c0@"
300:
  ko: "@a@b*: 어이! 어디서 많이 본 얼굴이다\n싶었는데, 자네는 분명 %a002000!\n@c0@"
