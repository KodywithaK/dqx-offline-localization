  tl: "@a@b＊：在俺死之前，\n　　至少要看一眼山腳下的集市\n　　和雷多克城的繁華吧。\n@c0@"
230:
  en: "@a@b*: Moooo... Moooo...\n@c0@"
  ja: "@a@b＊「モー　モー。\n@c0@"
