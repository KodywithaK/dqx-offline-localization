0:
  en: "@a@b*: What? A ring? We have no ringses here! Especially not thisss one!\n@c0@"
  ja: "@a@b＊「ゲヒゲヒゲヒ。\n\tこの宝は　オレさまが\n\tひろったものだ。\n@c0@"
  ko: "@a@b*: 크히크히크히.\n이 보물은 이 몸께서\n주운 물건이다.\n@c0@"
  sl: "@a@b＊：嘿嘿嘿。\n　　这是我捡的，\n　　是我的宝贝。\n@c0@"
  tl: "@a@b＊：嘿嘿嘿。\n　　這是我撿的，\n　　是我的寶貝。\n@c0@"
1:
  en: "@a@b*: It belongs to usss! It fell on our headses, it did!  Go find your own!\n@c0@"
  ja: "@a@b＊「だれにも　わたさねえぞ！\n@c0@"
  ko: "@a@b*: 아무한테도 못 넘겨줘!\n@c0@"
  sl: "@a@b＊：谁也别想拿走！\n@c0@"
  tl: "@a@b＊：誰也別想拿走！\n@c0@"
2:
  en: "@a@b*: You're looking at Somnia Castle.\n@c0@"
  ja: "@a@b＊「ここは　レイドック城だ。\n@c0@"
  ko: "@a@b*: 이곳은 레이독 성이다.\n@c0@"
  sl: "@a@b＊：这里是雷多克城。\n@c0@"
  tl: "@a@b＊：這裡是雷多克城。\n@c0@"
3:
  en: "@a@b*: You're not planning to try and bring that thing in here, are you?\n@c0@"
  ja: "@a@b＊「まさか　その　バカでかい馬を\n\tお城の中まで　つれてゆく気じゃ\n\tないだろうな？\n@c0@"
  ko: "@a@b*: 설마 그 터무니없이 큰 말을\n성안까지 끌고 갈 생각은\n아니겠지?\n@c0@"
  sl: "@a@b＊：你们难道是想牵着这匹\n　　大得不像话的马进城吗？\n@c0@"
  tl: "@a@b＊：你們難道是想牽著這匹\n　　大得不像話的馬進城嗎？\n@c0@"
4:
  en: "@a@b*: Good. Come back when you've got it tied up somewhere.\n@c0@"
  ja: "@a@b＊「よろしい。　それなら\n\tでなおして　くるといいだろう。\n@c0@"
  ko: "@a@b*: 좋아. 그렇다면\n다음에 다시 찾아오도록 해라.\n@c0@"
  sl: "@a@b＊：那就好。\n　　处理了马再来吧。\n@c0@"
  tl: "@a@b＊：那就好。\n　　處理了馬再來吧。\n@c0@"
5:
  en: "@a@b*: Wait...you're serious? Oh, brother...\n@c0@"
  ja: "@a@b＊「なんと　馬をつれて\n\tお城に　入る気なのかっ？\n\tふーむ……。\n@c0@"
  ko: "@a@b*: 맙소사, 말을 끌고\n성안에 들어갈 셈이었다고?\n으음......\n@c0@"
  sl: "@a@b＊：你说啥，\n　　你要带着马进城？\n　　嗯……\n@c0@"
  tl: "@a@b＊：你說啥，\n　　你要帶著馬進城？\n　　嗯……\n@c0@"
6:
  en: "@a@b*: Alright, alright. But keep it off the rugs, and upstairs is off-limits!\n@c0@"
  ja: "@a@b＊「まあ　今回だけは　目をつぶろう。\n\tただし！　２階にまで　つれて\n\tあがったり　無茶は　するなよ。\n@c0@"
  ko: "@a@b*: 그럼, 이번 한 번만 눈감아주지.\n단! 무식하게 2층까지 끌고 올라갈\n생각은 꿈도 꾸지 말도록.\n@c0@"
  sl: "@a@b＊：嗯，这次就放过你吧。\n　　但是！不许带上２楼，\n　　更不许乱来。\n@c0@"
  tl: "@a@b＊：嗯，這次就放過你吧。\n　　但是！不許帶上２樓，\n　　更不許亂來。\n@c0@"
7:
  en: "@a@b*: You're looking at Somnia Castle.\n@c0@"
  ja: "@a@b＊「ここは　レイドック城だ。\n@c0@"
  ko: "@a@b*: 이곳은 레이독 성이다.\n@c0@"
  sl: "@a@b＊：这里是雷多克城。\n@c0@"
  tl: "@a@b＊：這裡是雷多克城。\n@c0@"
8:
  en: "@a@b*: Where do you think you're going with that coffin? Not inside the castle, that's for sure.\n@c0@"
  ja: "@a@b＊「まさか　その　カンオケを\n\tひきずって　お城の中に\n\t入るつもりでは　あるまいな。\n@c0@"
  ko: "@a@b*: 설마 그 관을\n끌고 성안에\n들어갈 생각은 아니겠지?\n@c0@"
  sl: "@a@b＊：难不成，\n　　你想要拖着个棺材\n　　大摇大摆地进城吗？\n@c0@"
  tl: "@a@b＊：難不成，\n　　你想要拖著個棺材\n　　大搖大擺地進城嗎？\n@c0@"
9:
  en: "@a@b*: Go resurrect that poor soul at the church first, then we can talk about letting you in.\n@c0@"
  ja: "@a@b＊「教会へでも　いって\n\t生き返らせてあげるがよい。\n\tでなおしてまいれ。\n@c0@"
  ko: "@a@b*: 성당이라도 가서\n되살려 달라고 해.\n그리고 그 후에 다시 와라.\n@c0@"
  sl: "@a@b＊：先去教会，\n　　让伙伴复活吧。\n　　复活之后再来。\n@c0@"
  tl: "@a@b＊：先去教會，\n　　讓夥伴復活吧。\n　　復活之後再來。\n@c0@"
10:
  en: "@a@b*: What, is it ‘bring your horse to work’ day or something?\n@c0@"
  ja: "@a@b＊「これは　また　みごとな馬を\n\tつれてきたものだな。\n@c0@"
  ko: "@a@b*: 이거 정말 근사한 말을\n데려왔군.\n@c0@"
  sl: "@a@b＊：哦哦，太了不得了，\n　　你们带来的真是好马。\n@c0@"
  tl: "@a@b＊：哦哦，太了不得了，\n　　你們帶來的真是好馬。\n@c0@"
11:
  en: "@a@b*: Gah! Man, is that a real horse? In here? Don't scare me like that!\n@c0@"
  ja: "@a@b＊「うわ　びっくりした！\n\tそれ　本物の馬ですよねえ。\n\tいや～　大きいなあ……。\n@c0@"
  ko: "@a@b*: 어이쿠, 깜짝이야!\n그거 진짜 말 맞죠?\n우와~ 진짜 크다......\n@c0@"
  sl: "@a@b＊：哇，吓我一跳！\n　　这这、这真的是马吧。\n　　哇～好大的块头……\n@c0@"
  tl: "@a@b＊：哇，嚇我一跳！\n　　這這、這真的是馬吧。\n　　哇～好大的塊頭……\n@c0@"
12:
  en: "@a@b*: Are you at all familiar with the Dread Fiend Murdaw, hmm?\n@c0@"
  ja: "@a@b＊「魔王ムドーの　ことを\n\tご存知か？\n@c0@"
  ko: "@a@b*: 마왕 무도를\n알고 있나?\n@c0@"
  sl: "@a@b＊：魔王姆多的情报，\n　　您了解吗？\n@c0@"
  tl: "@a@b＊：魔王姆多的情報，\n　　您瞭解嗎？\n@c0@"
13:
  en: "@a@b*: You are? Interesting.\n@c0@"
  ja: "@a@b＊「そうか　ムドーのことは\n\t知っておるか……。\n@c0@"
  ko: "@a@b*: 그렇군. 무도가 누군지\n알고 있군......\n@c0@"
  sl: "@a@b＊：哦哦，您了解\n　　魔王姆多是么……\n@c0@"
  tl: "@a@b＊：哦哦，您瞭解\n　　魔王姆多是麼……\n@c0@"
14:
  en: "@a@b*: But what about the so-called ‘phantom realm’, hmm? Stumped you on that one, huh? It's another subject of His Majesty's research.\n@c0@"
  ja: "@a@b＊「しかし　まぼろしの大地については\n\t知らないだろう。　王は　そのことも\n\t研究しているらしいのだ。\n@c0@"
  ko: "@a@b*: 하지만 몽환의 대지에 대해서는\n모르겠지. 왕은 그것도\n연구 중인 모양이더군.\n@c0@"
  sl: "@a@b＊：那么，您了解梦幻大地吗？\n　　国王陛下\n　　最近好像在研究这个。\n@c0@"
  tl: "@a@b＊：那麼，您瞭解夢幻大地嗎？\n　　國王陛下\n　　最近好像在研究這個。\n@c0@"
15:
  en: "@a@b*: The Dread Fiend is no stranger to our nation. He has meddled here numerous times in the past.\n@c0@"
  ja: "@a@b＊「魔王ムドーは　この国にも\n\tすでに　何度か　あらわれた。\n@c0@"
  ko: "@a@b*: 마왕 무도는 이 나라에도\n이미 여러 차례 나타났었어.\n@c0@"
  sl: "@a@b＊：魔王姆多已经出现过几次。\n@c0@"
  tl: "@a@b＊：魔王姆多已經出現過幾次。\n@c0@"
16:
  en: "@a@b*: Each time, King Somnus has driven him back in a costly battle...\n@c0@"
  ja: "@a@b＊「そのつど　レイドック王が\n\t戦いを　いどんだのじゃが……。\n@c0@"
  ko: "@a@b*: 그때마다 레이독 왕이\n전투를 벌였지만......\n@c0@"
  sl: "@a@b＊：以前一直是雷多克王\n　　与他战斗的……\n@c0@"
  tl: "@a@b＊：以前一直是雷多克王\n　　與他戰鬥的……\n@c0@"
17:
  en: "@a@b*: But whenever we think we have Murdaw cornered, he always disappears in a puff of smoke!\n@c0@"
  ja: "@a@b＊「あと一歩と　いうところで\n\tいつも　けむりのように\n\t消えてしまうのじゃ！\n@c0@"
  ko: "@a@b*: 간발의 차이로\n늘 연기처럼\n사라지지 뭔가!\n@c0@"
  sl: "@a@b＊：每次要打倒他的时候，\n　　他就像烟雾一样，\n　　消失得无影无踪了！\n@c0@"
  tl: "@a@b＊：每次要打倒他的時候，\n　　他就像煙霧一樣，\n　　消失得無影無蹤了！\n@c0@"
18:
  en: "@a@b*: Where does this monster come from, and where does he go when he vanishes, hmm?\n@c0@"
  ja: "@a@b＊「魔王ムドーは　いったい\n\tどこから　来るのか\n\tどこへ　消えるのか……。\n@c0@"
  ko: "@a@b*: 마왕 무도는 대체\n어디서 와서\n어디로 사라지는 건지......\n@c0@"
  sl: "@a@b＊：魔王姆多究竟\n　　从何而来，\n　　又向何处去……\n@c0@"
  tl: "@a@b＊：魔王姆多究竟\n　　從何而來，\n　　又向何處去……\n@c0@"
19:
  en: "@a@b*: Such mysteries elude me, but I understand His Majesty is close to cracking the case...\n@c0@"
  ja: "@a@b＊「私には　なにも　おっしゃらないが\n\tレイドック王は　なにやら\n\tつかんでいる　ご様子なのだ。\n@c0@"
  ko: "@a@b*: 나에겐 아무 말씀 안 하지만\n레이독 왕은 뭔가\n알고 계신 눈치더군.\n@c0@"
  sl: "@a@b＊：雷多克王虽然嘴上没说，\n　　但我总觉得他\n　　似乎知道些什么。\n@c0@"
  tl: "@a@b＊：雷多克王雖然嘴上沒說，\n　　但我總覺得他\n　　似乎知道些什麼。\n@c0@"
20:
  en: "@a@b*: Hey, it's the new recruit! You met His Majesty yet?\n@c0@"
  ja: "@a@b＊「おや　新米さんですね。\n\tレイドック王には　もう\n\tお会いになりましたか？\n@c0@"
  ko: "@a@b*: 오호, 새로 오셨군요.\n레이독 왕은 벌써\n만나 보셨습니까?\n@c0@"
  sl: "@a@b＊：啊，是新来的啊。\n　　你见过雷多克王了吗？\n@c0@"
  tl: "@a@b＊：啊，是新來的啊。\n　　你見過雷多克王了嗎？\n@c0@"
21:
  en: "@a@b*: What a great guy, huh? He's kind to the people, a tireless worker, and he just looks so...regal!\n@c0@"
  ja: "@a@b＊「男でも　ほれぼれ　するような\n\t美しい人ですよね。\n@c0@"
  ko: "@a@b*: 같은 남자가 봐도 반할 만큼\n수려한 외모이시죠.\n@c0@"
  sl: "@a@b＊：他英俊的面貌，\n　　连男人都为之着迷。\n@c0@"
  tl: "@a@b＊：他英俊的面貌，\n　　連男人都為之著迷。\n@c0@"
22:
  en: "@a@b*: I know kings are born into their jobs, but if we ever held an election, Somnus would get my vote!\n@c0@"
  ja: "@a@b＊「しかも　心も　こまやかで\n\tはたらき者で……。\n@c0@"
  ko: "@a@b*: 게다가 섬세하고\n근면 성실하기까지......\n@c0@"
  sl: "@a@b＊：不仅如此，他心细如发，\n　　人又勤奋……\n@c0@"
  tl: "@a@b＊：不僅如此，他心細如髪，\n　　人又勤奮……\n@c0@"
23:
  en: "@a@b*: No? Then you better get out there and make a name for yourself. Get his attention!\n@c0@"
  ja: "@a@b＊「そうですか。　早く　王さまに\n\t会いたいのなら　なにか\n\tてがらを　たてることですね。\n@c0@"
  ko: "@a@b*: 그러시군요. 왕을 빨리\n만나고 싶다면 뭔가\n공을 세우는 게 좋을 겁니다.\n@c0@"
  sl: "@a@b＊：是吗。那么，\n　　为了早日见到国王，\n　　你要立下功劳才行。\n@c0@"
  tl: "@a@b＊：是嗎。那麼，\n　　為了早日見到國王，\n　　你要立下功勞才行。\n@c0@"
24:
  en: "@a@b*: Why the long face, horse? I'm sorry we don't have any oats for you.\n@c0@"
  ja: "@a@b＊「あらあら　ここにきても\n\tお馬さんのエサは　なくてよ。\n@c0@"
  ko: "@a@b*: 에구머니, 여기에 와봤자\n말한테 먹일 건 없어.\n@c0@"
  sl: "@a@b＊：哎呀哎呀，来这里也没用，\n　　我没有马饲料呀。\n@c0@"
  tl: "@a@b＊：哎呀哎呀，來這裡也沒用，\n　　我沒有馬飼料呀。\n@c0@"
25:
  en: "@a@b*: M-My Goddess! Look at this supreme specimen of equine strength!\n@c0@"
  ja: "@a@b＊「おおおおおっ　おうーっ！\n\tこれは　また　なんと\n\tたくましい馬じゃ！\n@c0@"
  ko: "@a@b*: 우오오~ 우와아앗!\n놀랍군, 이렇게 힘차고\n늠름한 말이!\n@c0@"
  sl: "@a@b＊：哦哦，哦哦哦！\n　　这真是，太棒了，\n　　这么壮硕的马！\n@c0@"
  tl: "@a@b＊：哦哦，哦哦哦！\n　　這真是，太棒了，\n　　這麼壯碩的馬！\n@c0@"
26:
  en: "@a@b*: No doubt about it, this mare is more than mighty enough to do the job.\n@c0@"
  ja: "@a@b＊「うむっ　うむっ……。\n\t引ける。　こいつなら\n\tこの馬車を　引けるぞい！\n@c0@"
  ko: "@a@b*: 음, 그래......\n가능하겠어. 이 녀석이라면\n이 마차를 끌 수 있겠어!\n@c0@"
  sl: "@a@b＊：嗯嗯……\n　　没问题。要是用它拉，\n　　一定拉得动这马车！\n@c0@"
  tl: "@a@b＊：嗯嗯……\n　　沒問題。要是用它拉，\n　　一定拉得動這馬車！\n@c0@"
27:
  en: "@a@b*: Please, sir! Allow me to hitch your fine steed to this wagon!\n@c0@"
  ja: "@a@b＊「こいつを　わしに\n\tまかせてくれるな？\n\tお　おねがいじゃっ！\n@c0@"
  ko: "@a@b*: 이 녀석을 내게\n맡기지 않겠나?\n제, 제발 부탁하네!\n@c0@"
  sl: "@a@b＊：这匹马，\n　　能不能交给我？\n　　拜托你了！\n@c0@"
  tl: "@a@b＊：這匹馬，\n　　能不能交給我？\n　　拜託你了！\n@c0@"
28:
  en: "@a@b*: But we must! This horse and wagon were made for each other!\n@c0@"
  ja: "@a@b＊「そこを　なんとか！\n\tおねがいじゃ！\n@c0@"
  ko: "@a@b---점프---> #005055로\n@c0@"
  sl: "@a@b＊：请你一定要答应！\n　　拜托你了！\n@c0@"
  tl: "@a@b＊：請你一定要答應！\n　　拜託你了！\n@c0@"
29:
  en: "@a@b*: Please! My only wish is to see this wagon in action before I die...\n@c0@"
  ja: "@a@b＊「としよりを　そう\n\tいじめんで　くだされ。\n\tお　おねがいじゃっ！\n@c0@"
  ko: "@a@b*: 그러지 말고\n꼭 좀 부탁하네!\n@c0@"
  sl: "@a@b＊：对我一个老头子，\n　　别这么狠心。\n　　求，求你啦！\n@c0@"
  tl: "@a@b＊：對我一個老頭子，\n　　別這麼狠心。\n　　求，求你啦！\n@c0@"
30:
  en: "@a@b*: Very well. So be it. I shall not push you any further.\n@c0@"
  ja: "@a@b＊「わかったわい。\n\tもう　たのまんわい。\n@c0@"
  ko: "@a@b---점프---> #005055로\n@c0@"
  sl: "@a@b＊：明白了。\n　　不愿意就算了。\n@c0@"
  tl: "@a@b＊：明白了。\n　　不願意就算了。\n@c0@"
31:
  en: "@a@b*: Oh, thank you! Thank you! Finally, the wagon will be on the road again!\n@c0@"
  ja: "@a@b＊「やれ　ありがたや！\n\tこれで　もういちど　この馬車の\n\t雄姿が　見られると　いうものじゃ！\n@c0@"
  ko: "@a@b*: 늙은이의 부탁이니\n제발 외면하지 말고\n꼭 좀 들어주게나!\n@c0@"
  sl: "@a@b＊：哎呀，感谢上苍！\n　　想不到在我有生之年\n　　还能看见这马车的雄姿！\n@c0@"
  tl: "@a@b＊：哎呀，感謝上蒼！\n　　想不到在我有生之年\n　　還能看見這馬車的雄姿！\n@c0@"
32:
  en: "@a@b*: I'll be sure to inform His Majesty of your feat!\n@c0@"
  ja: "@a@b＊「おぬしたちのこと\n\tきっと　王さまに　報告して\n\tおきますぞ！　さあ　いきなされ。\n@c0@"
  ko: "@a@b---점프---> #005055로\n@c0@"
  sl: "@a@b＊：你们二位的功劳\n　　我一定会向陛下报告！\n　　现在请让我单独待一阵子。\n@c0@"
  tl: "@a@b＊：你們二位的功勞\n　　我一定會向陛下報告！\n　　現在請讓我單獨待一陣子。\n@c0@"
33:
  en: "@a@b*: That won't be necessary!\n@c0@"
