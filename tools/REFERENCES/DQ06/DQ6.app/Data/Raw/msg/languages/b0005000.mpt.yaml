  ko: "@a@b*: 그렇군. 무도가 누군지\n알고 있군......\n@c0@"
  sl: "@a@b＊：以前一直是雷多克王\n　　与他战斗的……\n@c0@"
  tl: "@a@b＊：以前一直是雷多克王\n　　與他戰鬥的……\n@c0@"
116:
  en: "@a@b*: But whenever we think we have Murdaw cornered, he always disappears in a puff of smoke!\n@c0@"
  ja: "@a@b＊「あと一歩と　いうところで\n\tいつも　けむりのように\n\t消えてしまうのじゃ！\n@c0@"
  ko: "@a@b*: 하지만 몽환의 대지에 대해서는\n모르겠지. 왕은 그것도\n연구 중인 모양이더군.\n@c0@"
  sl: "@a@b＊：每次要打倒他的时候，\n　　他就像烟雾一样，\n　　消失得无影无踪了！\n@c0@"
  tl: "@a@b＊：每次要打倒他的時候，\n　　他就像煙霧一樣，\n　　消失得無影無蹤了！\n@c0@"
117:
  en: "@a@b*: Where does this monster come from, and where does he go when he vanishes, hmm?\n@c0@"
  ja: "@a@b＊「魔王ムドーは　いったい\n\tどこから　来るのか\n\tどこへ　消えるのか……。\n@c0@"
  ko: "@a@b*: 마왕 무도는 이 나라에도\n이미 여러 차례 나타났었어.\n@c0@"
  sl: "@a@b＊：魔王姆多究竟\n　　从何而来，\n　　又向何处去……\n@c0@"
  tl: "@a@b＊：魔王姆多究竟\n　　從何而來，\n　　又向何處去……\n@c0@"
118:
  en: "@a@b*: Such mysteries elude me, but I understand His Majesty is close to cracking the case...\n@c0@"
  ja: "@a@b＊「私には　なにも　おっしゃらないが\n\tレイドック王は　なにやら\n\tつかんでいる　ご様子なのだ。\n@c0@"
  ko: "@a@b*: 그때마다 레이독 왕은\n결투를 신청했지만......\n@c0@"
  sl: "@a@b＊：雷多克王虽然嘴上没说，\n　　但我总觉得他\n　　似乎知道些什么。\n@c0@"
  tl: "@a@b＊：雷多克王雖然嘴上沒說，\n　　但我總覺得他\n　　似乎知道些什麼。\n@c0@"
119:
  en: "@a@b*: Hey, it's the new recruit! You met His Majesty yet?\n@c0@"
  ja: "@a@b＊「おや　新米さんですね。\n\tレイドック王には　もう\n\tお会いになりましたか？\n@c0@"
  ko: "@a@b*: 간발의 차이로\n늘 연기처럼\n사라지지 뭔가!\n@c0@"
  sl: "@a@b＊：啊，是新来的啊。\n　　你见过雷多克王了吗？\n@c0@"
  tl: "@a@b＊：啊，是新來的啊。\n　　你見過雷多克王了嗎？\n@c0@"
120:
  en: "@a@b*: What a great guy, huh? He's kind to the people, a tireless worker, and he just looks so...regal!\n@c0@"
  ja: "@a@b＊「男でも　ほれぼれ　するような\n\t美しい人ですよね。\n@c0@"
  ko: "@a@b*: 마왕 무도는 대체\n어디서 와서\n어디로 사라지는 건지......\n@c0@"
  sl: "@a@b＊：他英俊的面貌，\n　　连男人都为之着迷。\n@c0@"
  tl: "@a@b＊：他英俊的面貌，\n　　連男人都為之著迷。\n@c0@"
121:
  en: "@a@b*: I know kings are born into their jobs, but if we ever held an election, Somnus would get my vote!\n@c0@"
  ja: "@a@b＊「しかも　心も　こまやかで\n\tはたらき者で……。\n@c0@"
  ko: "@a@b*: 나에겐 아무 말씀 안 하지만\n레이독 왕은 뭔가\n알고 계신 눈치더군.\n@c0@"
  sl: "@a@b＊：不仅如此，他心细如发，\n　　人又勤奋……\n@c0@"
  tl: "@a@b＊：不僅如此，他心細如髪，\n　　人又勤奮……\n@c0@"
122:
  en: "@a@b*: No? Then you better get out there and make a name for yourself. Get his attention!\n@c0@"
  ja: "@a@b＊「そうですか。　早く　王さまに\n\t会いたいのなら　なにか\n\tてがらを　たてることですね。\n@c0@"
