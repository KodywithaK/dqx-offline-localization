  ja: "@a@b%a002050「この世界で　亡くなった人も\n\tいつか　自分の　世界に\n\tもどれると　いいですね！\n@c0@"
  ko: "@a@b%a002050: 이 세계에서 죽은 사람도\n언젠가 자신의 세계에\n돌아갈 수 있으면 좋겠어요!\n@c0@"
  sl: "@a@b%a002050：如果在这个世界\n　　死去的人们也能回到\n　　原本的世界就好了呢！\n@c0@"
  tl: "@a@b%a002050：如果在這個世界\n　　死去的人們也能回到\n　　原本的世界就好了呢！\n@c0@"
228:
  en: "@a%0%a002040@bWell, there are some things that we can't control, but I hope this dream comes true...\n@c0@"
