  sl: "@a@b%a002020：快些恢复精神，\n　　然后继续引导这个镇子上的人们吧！\n@c0@"
  tl: "@a@b%a002020：快些恢復精神，\n　　然後繼續引導這個鎮子上的人們吧！\n@c0@"
