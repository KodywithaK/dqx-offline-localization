0:
  en: "@a%0%a002000@bHardy har! We made our bed, and now we're flying in it, aye, %a000090?\n@c0@"
  ja: "@a@b%a002000「いやー　ゆかいだな。\n\tなあ　%a000090！\n@c0@"
  ko: "@a@b%a002000: 정말 유쾌한걸.\n그렇지? %a000090!\n@c0@"
  sl: "@a@b%a002000：哎呀，真爽啊。\n　　是吧，%a000090！\n@c0@"
  tl: "@a@b%a002000：哎呀，真爽啊。\n　　是吧，%a000090！\n@c0@"
1:
  en: "@a%0%a002010@bHee hee!\n@c0@"
  ja: "@a@b%a002010「うふふ。\n@c0@"
  ko: "@a@b%a002010: 우후후.\n@c0@"
  sl: "@a@b%a002010：呵呵呵。\n@c0@"
  tl: "@a@b%a002010：呵呵呵。\n@c0@"
2:
  en: "@a%0%a002020@bTee hee! He was too busy staring at the bed to notice us on top of it!\n@c0@"
  ja: "@a@b%a002020「えへへ。\n\tあたしたちが　空とぶベッドに\n\t乗ってたなんて　わからないよね。\n@c0@"
  ko: "@a@b%a002020: 에헤헤.\n우리가 하늘을 나는 침대에\n타고 있었다는 건 모르겠지?\n@c0@"
  sl: "@a@b%a002020：嘿嘿。\n　　这个人不知道是我们\n　　坐在飞天床上呢。\n@c0@"
  tl: "@a@b%a002020：嘿嘿。\n　　這個人不知道是我們\n　　坐在飛天床上呢。\n@c0@"
3:
  en: "@a%0%a002030@bFlying on the bed is a pleasant experience indeed.\n@c0@"
  ja: "@a@b%a002030「空とぶベッドの　乗りごこちは\n\tじつに　良かったですね。\n@c0@"
  ko: "@a@b%a002030: 하늘을 나는 침대는\n정말 편안했습니다.\n@c0@"
  sl: "@a@b%a002030：坐在飞天床上\n　　真是太舒服了。\n@c0@"
  tl: "@a@b%a002030：坐在飛天床上\n　　真是太舒服了。\n@c0@"
4:
  en: "@a%0%a002050@bI bet his eyes popped right out of his head when we flew past on the bed!\n@c0@"
  ja: "@a@b%a002050「ぷぷっ！　この人\n\t私たちが　ベッドで　とんでるとき\n\t目を　真んまるく　してましたね！\n@c0@"
  ko: "@a@b%a002050: 푸훕! 이 사람,\n우리가 침대를 타고 날고 있을 때\n눈을 동그랗게 뜨고 쳐다보고 있었죠!\n@c0@"
  sl: "@a@b%a002050：噗！这个人看到\n　　我们坐在床上飞的时候，\n　　眼睛都瞪圆了呢！\n@c0@"
  tl: "@a@b%a002050：噗！這個人看到\n　　我們坐在床上飛的時候，\n　　眼睛都瞪圓了呢！\n@c0@"
5:
  en: "@a%0%a002000@bAye, and you gotta chase your dreams, right %a000090?\n@c0@"
  ja: "@a@b%a002000「そうだよな。\n\t夢を　忘れちゃ　いけないよな！\n@c0@"
  ko: "@a@b%a002000: 맞아.\n꿈을 잊으면 안 되지!\n@c0@"
  sl: "@a@b%a002000：没错。\n　　决不能忘记梦想啊！\n@c0@"
  tl: "@a@b%a002000：沒錯。\n　　決不能忘記夢想啊！\n@c0@"
6:
  en: "@a%0%a002010@bHee hee. I suppose we've proved that dreams can come true!\n@c0@"
  ja: "@a@b%a002010「うふふ。　ちゃんと\n\tロマンチックな　ことが\n\t起きたわよね。\n@c0@"
  ko: "@a@b%a002010: 우후후.\n로맨틱한 일이\n제대로 일어났네.\n@c0@"
  sl: "@a@b%a002010：呵呵。\n　　发生了浪漫的事情呢。\n@c0@"
  tl: "@a@b%a002010：呵呵。\n　　發生了浪漫的事情呢。\n@c0@"
7:
  en: "@a%0%a002020@bFolks sure love that flying bed, huh?\n@c0@"
  ja: "@a@b%a002020「空とぶベッドが\n\tとんでるのを　見れた人たちは\n\tうれしいだろうね！\n@c0@"
  ko: "@a@b%a002020: 하늘을 나는 침대가\n날아다니는 걸 본 사람들은\n기뻤을 거야!\n@c0@"
  sl: "@a@b%a002020：看到了\n　　飞天床的人们\n　　一定很开心吧！\n@c0@"
  tl: "@a@b%a002020：看到了\n　　飛天床的人們\n　　一定很開心吧！\n@c0@"
8:
  en: "@a%0%a002030@bIf only everyone followed their dreams, this would be a better world.\n@c0@"
  ja: "@a@b%a002030「世界中の　みんなが\n\t夢をもって　生きていけば\n\tすてきな世の中に　なりますよね！\n@c0@"
  ko: "@a@b%a002030: 온 세상 사람들이\n꿈을 가지고 살아가면\n멋진 세상이 될 겁니다!\n@c0@"
  sl: "@a@b%a002030：要是全世界的人们\n　　都活得有梦想的话，\n　　世界将变成美好的人间！\n@c0@"
  tl: "@a@b%a002030：要是全世界的人們\n　　都活得有夢想的話，\n　　世界將變成美好的人間！\n@c0@"
9:
  en: "@a%0%a002050@bOld %a002050's dream is to restore world peace together with %a000090 and co.!\n@c0@"
  ja: "@a@b%a002050「私の　今の夢は\n\t%a000090さんたちと　いっしょに\n\t世界を　平和にすることです！\n@c0@"
  ko: "@a@b%a002050: 지금 제 꿈은\n%a000090 님과 함께\n세계 평화를 되찾는 겁니다!\n@c0@"
  sl: "@a@b%a002050：我现在的梦想是\n　　和%a000090还有其他伙伴一起，\n　　为世界和平而战！\n@c0@"
  tl: "@a@b%a002050：我現在的夢想是\n　　和%a000090還有其他夥伴一起，\n　　為世界和平而戰！\n@c0@"
10:
  en: "@a%0%a002000@bHardy har! I guess we are pretty special, aye?\n@c0@"
  ja: "@a@b%a002000「おっ！　オレたちは\n\t特別なひと　らしいぜ。\n@c0@"
  ko: "@a@b%a002000: 오옷! 우린\n특별한 사람인가 보군.\n@c0@"
  sl: "@a@b%a002000：哦！咱好像很特殊呢。\n@c0@"
  tl: "@a@b%a002000：哦！咱好像很特殊呢。\n@c0@"
11:
  en: "@a%0%a002010@bHee hee!\n@c0@"
  ja: "@a@b%a002010「うふふ。\n@c0@"
  ko: "@a@b%a002010: 우후후.\n@c0@"
  sl: "@a@b%a002010：呵呵呵。\n@c0@"
  tl: "@a@b%a002010：呵呵呵。\n@c0@"
12:
  en: "@a%0%a002020@bBoy, people's spirits soar when they see that bed fly!\n@c0@"
  ja: "@a@b%a002020「空とぶベッドが　見られたから\n\tみんな　よろこんでるね。\n@c0@"
  ko: "@a@b%a002020: 하늘을 나는 침대를 보고서\n모두들 기뻐하고 있어.\n@c0@"
  sl: "@a@b%a002020：看到了飞天床，\n　　大家都很开心呢。\n@c0@"
  tl: "@a@b%a002020：看到了飛天床，\n　　大家都很開心呢。\n@c0@"
13:
  en: "@a%0%a002030@bIndeed, I believe that %a000090 was chosen by the Goddess...\n@c0@"
  ja: "@a@b%a002030「たしかに　%a000090さんは\n\tとくべつな人かも　しれません……。\n@c0@"
  ko: "@a@b%a002030: 확실히 %a000090 님은\n특별한 사람일지도 모르지요......\n@c0@"
  sl: "@a@b%a002030：%a000090的确\n　　不是一般人……\n@c0@"
  tl: "@a@b%a002030：%a000090的確\n　　不是一般人……\n@c0@"
14:
  en: "@a%0%a002050@bWe wouldn't have the bed if we hadn't had the gumption to climb that cliff. I suppose that does make us special, eh?\n@c0@"
  ja: "@a@b%a002050「まあ　高いガケを\n\tのぼれる人じゃないと\n\t手に　入りませんよね。\n@c0@"
  ko: "@a@b%a002050: 뭐, 높은 벼랑을\n오를 수 있는 사람이 아니면\n손에 넣을 수 없긴 하죠.\n@c0@"
  sl: "@a@b%a002050：要是不能爬高山，\n　　是拿不到的。\n@c0@"
  tl: "@a@b%a002050：要是不能爬高山，\n　　是拿不到的。\n@c0@"
15:
  en: "@a%0%a002000@bHardy har! We know the feelin', aye?\n@c0@"
  ja: "@a@b%a002000「おおっ　じいさん\n\tまったく　うまいこと言うな！\n@c0@"
  ko: "@a@b%a002000: 오옷, 영감님.\n멋진 말씀을 하시는군!\n@c0@"
  sl: "@a@b%a002000：哦，老爷爷说得好！\n@c0@"
  tl: "@a@b%a002000：哦，老爺爺說得好！\n@c0@"
16:
  en: "@a%0%a002010@bHee hee. I'd say he's still got it too!\n@c0@"
  ja: "@a@b%a002010「うふふ。\n\tまあ　おじいちゃんったら。\n@c0@"
  ko: "@a@b%a002010: 우후후.\n할아버지도 참.\n@c0@"
  sl: "@a@b%a002010：呵呵。\n　　老爷爷真是的。\n@c0@"
  tl: "@a@b%a002010：呵呵。\n　　老爺爺真是的。\n@c0@"
17:
  en: "@a%0%a002020@bTee hee! Sounds like that man's living the dream, huh?\n@c0@"
  ja: "@a@b%a002020「おじいちゃん\n\t恋して　夢気分だね。\n@c0@"
  ko: "@a@b%a002020: 할아버지,\n사랑에 빠져서 꿈꾸는 기분인가 봐.\n@c0@"
  sl: "@a@b%a002020：老爷爷坠入了\n　　如梦如幻的爱河呢。\n@c0@"
  tl: "@a@b%a002020：老爺爺墜入了\n　　如夢如幻的愛河呢。\n@c0@"
18:
  en: "@a%0%a002030@bThat fellow seems ever so pleased with himself.\n@c0@"
  ja: "@a@b%a002030「おじいさん　なんだか\n\tうれしそうですね。\n@c0@"
  ko: "@a@b%a002030: 할아버지, 왠지\n기뻐 보이십니다.\n@c0@"
  sl: "@a@b%a002030：老爷爷好像很开心呢。\n@c0@"
  tl: "@a@b%a002030：老爺爺好像很開心呢。\n@c0@"
19:
  en: "@a%0%a002050@bSo he feels like he's flyin' together with his young sweetheart? Some folks get all the luck!\n@c0@"
  ja: "@a@b%a002050「おじいさんは　若い娘さんと\n\t空にも　まい上がる\n\t気持ちなんでしょうねー。\n@c0@"
  ko: "@a@b%a002050: 할아버지는 젊은 아가씨와\n하늘을 나는 듯한\n기분이겠군요~\n@c0@"
  sl: "@a@b%a002050：老爷爷现在的心情，\n　　一定就像是和年轻小姑娘\n　　在空中遨游一样吧。\n@c0@"
  tl: "@a@b%a002050：老爺爺現在的心情，\n　　一定就像是和年輕小姑娘\n　　在空中遨遊一樣吧。\n@c0@"
20:
  en: "@a%0%a002000@bI bet he'd flip his lid if we told him it was us ridin' that thing.\n@c0@"
  ja: "@a@b%a002000「この　オレたちが\n\tベッドに　乗ってたって　言ったら\n\tおどろくんだろうなあ。\n@c0@"
  ko: "@a@b%a002000: 침대에 타고 있던 게\n바로 우리라고 말하면\n놀라겠지?\n@c0@"
  sl: "@a@b%a002000：要是说出来\n　　坐在床上的就是咱几个，\n　　一定会大吃一惊的吧。\n@c0@"
  tl: "@a@b%a002000：要是說出來\n　　坐在床上的就是咱幾個，\n　　一定會大吃一驚的吧。\n@c0@"
21:
  en: "@a%0%a002010@bI suppose he didn't see us riding the bed, then?\n@c0@"
  ja: "@a@b%a002010「私たちが　乗ってたのは\n\t見えなかったみたいね。\n@c0@"
  ko: "@a@b%a002010: 우리가 타고 있었던 건\n안 보였나 봐.\n@c0@"
  sl: "@a@b%a002010：好像没有看到\n　　是我们坐在床上呢。\n@c0@"
  tl: "@a@b%a002010：好像沒有看到\n　　是我們坐在床上呢。\n@c0@"
22:
  en: "@a%0%a002020@bOoh, I so want to tell him that we were the ones riding it!\n@c0@"
  ja: "@a@b%a002020「あーあ　思いっきり\n\t空とぶベッドに　乗ってたって\n\t言いふらしたい気分。\n@c0@"
  ko: "@a@b%a002020: 아아~ 눈치 보지 말고\n하늘을 나는 침대에 타고 있었다고\n퍼뜨리고 다니고 싶어.\n@c0@"
  sl: "@a@b%a002020：啊，真想\n　　大声说出来是我们\n　　坐在飞天床上呢。\n@c0@"
  tl: "@a@b%a002020：啊，真想\n　　大聲說出來是我們\n　　坐在飛天床上呢。\n@c0@"
23:
  en: "@a%0%a002030@bThis fellow behaves as if the flying bed were some kind of ghost.\n@c0@"
  ja: "@a@b%a002030「空とぶベッドのことを\n\tこの人は　オバケか　何かのように\n\t思っているみたいですね。\n@c0@"
  ko: "@a@b%a002030: 하늘을 나는 침대를\n이 사람은 유령 같은 걸로\n생각하고 있는 것 같습니다.\n@c0@"
  sl: "@a@b%a002030：这个人好像\n　　觉得飞天床是个\n　　怪物之类的东西呢。\n@c0@"
  tl: "@a@b%a002030：這個人好像\n　　覺得飛天床是個\n　　怪物之類的東西呢。\n@c0@"
24:
  en: "@a%0%a002050@bIt seems a flyin' bed makes a fine tourist attraction.\n@c0@"
  ja: "@a@b%a002050「空とぶベッドで　町を見物\n\tというのも　なかなか\n\tいいものですね。\n@c0@"
  ko: "@a@b%a002050: 하늘을 나는 침대로\n마을 구경을 하는 것도 꽤\n괜찮던데요.\n@c0@"
  sl: "@a@b%a002050：飞天床作为\n　　这个小镇一景，\n　　还真不错啊。\n@c0@"
  tl: "@a@b%a002050：飛天床作為\n　　這個小鎮一景，\n　　還真不錯啊。\n@c0@"
25:
  en: "@a%0%a002000@bHuh. I reckon Matt was that fella's owner, aye?\n@c0@"
  ja: "@a@b%a002000「そっか　ご主人ってのは\n\tジョンくん　だったってことか。\n@c0@"
  ko: "@a@b%a002000: 아아, 그 주인님이 바로\n존이었군.\n@c0@"
  sl: "@a@b%a002000：原来如此，\n　　主人指的就是约翰啊。\n@c0@"
  tl: "@a@b%a002000：原來如此，\n　　主人指的就是約翰啊。\n@c0@"
26:
  en: "@a%0%a002010@bMatt must have popped down for a quick visit.\n@c0@"
  ja: "@a@b%a002010「ジョンくん　こっそり\n\t彼のようすを　見に来たのかもね。\n@c0@"
  ko: "@a@b%a002010: 존이 몰래\n저 사람을 보러 왔던 건지도 몰라.\n@c0@"
  sl: "@a@b%a002010：约翰可能悄悄地\n　　跑来看他了呢。\n@c0@"
  tl: "@a@b%a002010：約翰可能悄悄地\n　　跑來看他了呢。\n@c0@"
27:
  en: "@a%0%a002020@bMaybe Matt's keeping an eye on him from up above, huh?\n@c0@"
  ja: "@a@b%a002020「ジョンくんは　いつでも\n\t空から　見てくれているよね！\n@c0@"
  ko: "@a@b%a002020: 존은 언제나\n하늘에서 보고 있을 거야!\n@c0@"
  sl: "@a@b%a002020：约翰一直都\n　　在天上看着他呢！\n@c0@"
  tl: "@a@b%a002020：約翰一直都\n　　在天上看著他呢！\n@c0@"
28:
  en: "@a%0%a002030@bThe Goddess moves in mysterious ways.\n@c0@"
  ja: "@a@b%a002030「きっと　神の　おみちびきが\n\tあったのです。\n@c0@"
  ko: "@a@b%a002030: 틀림없이 신의 인도가\n있었을 겁니다.\n@c0@"
  sl: "@a@b%a002030：一定是\n　　受到了神的指引吧。\n@c0@"
  tl: "@a@b%a002030：一定是\n　　受到了神的指引吧。\n@c0@"
29:
  en: "@a%0%a002050@bCrikey!\n@c0@"
  ja: "@a@b%a002050「わおーん！！\n@c0@"
  ko: "@a@b%a002050: 흐엉~!!\n@c0@"
  sl: "@a@b%a002050：汪汪！\n@c0@"
  tl: "@a@b%a002050：汪汪！\n@c0@"
30:
  en: "@a%0%a002000@bAn undersea creature, aye? Maybe we should go cruisin' to bruise 'im...\n@c0@"
  ja: "@a@b%a002000「海の底の　悪魔か……\n\tそいつは　倒しがいが\n\tありそうだぜ！\n@c0@"
  ko: "@a@b%a002000: 바닷속의 악마라......\n이거 쓰러뜨려 보면\n짜릿하겠는걸!\n@c0@"
  sl: "@a@b%a002000：海底的恶魔啊……\n　　俺手痒了呢！\n@c0@"
  tl: "@a@b%a002000：海底的惡魔啊……\n　　俺手癢了呢！\n@c0@"
31:
  en: "@a%0%a002010@bYou know, I think I've heard that rumour myself.\n@c0@"
  ja: "@a@b%a002010「そういえば　私　どこかで\n\tそんなウワサ　聞いたことが\n\tあるような　気がするわ。\n@c0@"
  ko: "@a@b%a002010: 그러고 보니 나도 어디서\n그런 소문을 들어 본 적이\n있는 것 같아.\n@c0@"
  sl: "@a@b%a002010：话说回来，\n　　我好像在哪里\n　　听到过这个传闻。\n@c0@"
  tl: "@a@b%a002010：話說回來，\n　　我好像在哪裡\n　　聽到過這個傳聞。\n@c0@"
32:
  en: "@a%0%a002010@bSomething about the souls of the city's inhabitants still floating around out there somewhere, all sad and lonely...\n@c0@"
  ja: "@a@b%a002010「いまでも　その都市の\n\t人びとの魂が　さまよってるって。\n@c0@"
  ko: "@a@b%a002010: 지금도 그 도시 사람들의\n영혼이 구천을 떠돌고 있대.\n@c0@"
  sl: "@a@b%a002010：听说那个都市里人们的灵魂\n　　至今都在彷徨游荡着。\n@c0@"
  tl: "@a@b%a002010：聽說那個都市里人們的靈魂\n　　至今都在彷徨遊蕩著。\n@c0@"
33:
  en: "@a%0%a002020@bA legendary city under the sea?\n@c0@"
  ja: "@a@b%a002020「……海に　沈められた\n\t伝説の都市。\n@c0@"
  ko: "@a@b%a002020: ......바닷속에 잠긴\n전설의 도시.\n@c0@"
  sl: "@a@b%a002020：……沉入海底的\n　　传说中的都市。\n@c0@"
  tl: "@a@b%a002020：……沉入海底的\n　　傳說中的都市。\n@c0@"
34:
