0:
  en: "@aLord Zenith@bWell done, heroes! By dint of your fortitude, Mortamor's days of tyranny are at an end. The dread realm is no more.\n@c0@"
  ja: "@a@bゼニス王「よくやった　%a000090よ！\n\tデスタムーアは　ほろびさり\n\tはざまの世界も　消えうせた。\n@c0@"
  ko: "@a@b제니스 왕: 잘해 주었네, %a000090!\n데스타무아는 쓰러졌고\n틈새 세계도 사라졌어.\n@c0@"
  sl: "@a@b泽尼斯王：干得漂亮，%a000090！\n　　德斯塔穆亚已经被彻底消灭，\n　　狭隙世界也一起消失了。\n@c0@"
  tl: "@a@b澤尼斯王：幹得漂亮，%a000090！\n　　德斯塔穆亞已經被徹底消滅，\n　　狹隙世界也一起消失了。\n@c0@"
1:
  en: "@aLord Zenith@bFear not — the tormented souls imprisoned there did find deliverance at the hands of these two sages.\n@c0@"
  ja: "@a@bゼニス王「はざまに　とらわれていた\n\t人びとも　そこの　ふたりに\n\t助けだされた。\n@c0@"
  ko: "@a@b제니스 왕: 틈새에 붙잡혀 있던\n사람들도 거기 두 사람의\n도움으로 풀려났네.\n@c0@"
  sl: "@a@b泽尼斯王：受困在狭隙中的人们，\n　　也已经被这两位\n　　救了出来。\n@c0@"
  tl: "@a@b澤尼斯王：受困在狹隙中的人們，\n　　也已經被這兩位\n　　救了出來。\n@c0@"
2:
  en: "@aLord Zenith@bGentle friends — your toil shall bear the sweetest of fruit: peace to our world...true and everlasting.\n@c0@"
  ja: "@a@bゼニス王「これで　世界は\n\t真の平和へと　むかっていくだろう。\n@c0@"
  ko: "@a@b제니스 왕: 이로써 세계는\n진정한 평화를 맞이할 테지.\n@c0@"
  sl: "@a@b泽尼斯王：这样一来，这个世界\n　　就能够得到真正的和平了。\n@c0@"
  tl: "@a@b澤尼斯王：這樣一來，這個世界\n　　就能夠得到真正的和平了。\n@c0@"
3:
  en: "@aLord Zenith@bAnd 'twas thou, %a000090, who made this possible. Full proud are we of thee and thine!\n@c0@"
  ja: "@a@bゼニス王「これも　すべて\n\tそなたたちの　おかげじゃ。\n\t本当に　ごくろうであったな。\n@c0@"
  ko: "@a@b제니스 왕: 이것도 모두\n그대들 덕분이라네.\n정말 수고 많았네.\n@c0@"
  sl: "@a@b泽尼斯王：而这一切都是\n　　多亏了各位。\n　　真的是辛苦你们了。\n@c0@"
  tl: "@a@b澤尼斯王：而這一切都是\n　　多虧了各位。\n　　真的是辛苦你們了。\n@c0@"
4:
  en: "@aLord Zenith@bWere it not for thy valorous deeds, both the real world and that of dreams would have fallen into Mortamor's clutches.\n@c0@"
  ja: "@a@bゼニス王「そなたらが　いなければ\n\t現実と夢の　両方の世界は\n\t大魔王の手に　おちていたはずじゃ。\n@c0@"
  ko: "@a@b제니스 왕: 그대들이 없었다면\n현실과 꿈의 양쪽 세계는\n대마왕의 수중에 있었을 게야.\n@c0@"
  sl: "@a@b泽尼斯王：要不是因为有你们，\n　　现实世界和梦世界都一定\n　　会同时成为大魔王的囊中之物。\n@c0@"
  tl: "@a@b澤尼斯王：要不是因為有你們，\n　　現實世界和夢世界都一定\n　　會同時成為大魔王的囊中之物。\n@c0@"
5:
  en: "@aLord Zenith@bAs ruler of this realm of dreams, where heartfelt sentiment shall ever find expression...I do salute thee!\n@c0@"
  ja: "@a@bゼニス王「この夢の世界　いわば\n\t人びとの　心の世界を　たばねる\n\t王として　心から礼をいうぞ！\n@c0@"
  ko: "@a@b제니스 왕: 꿈의 세계를\n통솔하는 왕으로서\n진심으로 고맙다는 말을 전하겠네!\n@c0@"
  sl: "@a@b泽尼斯王：作为统治这个梦世界，\n　　也就是人们内心世界的国王，\n　　我对你们表示真挚的谢意。\n@c0@"
  tl: "@a@b澤尼斯王：作為統治這個夢世界，\n　　也就是人們內心世界的國王，\n　　我對你們表示真摯的謝意。\n@c0@"
6:
  en: "@aLord Zenith@bPray accept my most humble thanks, %a000090. I shall ever be indebted to thee and thy noble companions.\n@c0@"
  ja: "@a@bゼニス王「ありがとう　%a000090よ。\n\tそして　ほかの者も\n\t本当に　よく　やったな！\n@c0@"
  ko: "@a@b제니스 왕: 고맙네, %a000090%F0090%X여%Y이여%Z.\n그리고 다른 자들도\n정말 잘해 주었네!\n@c0@"
  sl: "@a@b泽尼斯王：感激不尽，%a000090。\n　　还有其他的勇士们，\n　　你们真的太棒了！\n@c0@"
  tl: "@a@b澤尼斯王：感激不盡，%a000090。\n　　還有其他的勇士們，\n　　你們真的太棒了！\n@c0@"
7:
  en: "@aLord Zenith@bAlas...the hour of our parting draweth nigh.\n@c0@"
  ja: "@a@bゼニス王「さて…………。\n\tどうやら　そろそろ\n\tお別れの時が　きたようじゃ……。\n@c0@"
  ko: "@a@b제니스 왕: 그리고......\n아무래도 슬슬\n작별의 시간이 온 것 같군......\n@c0@"
  sl: "@a@b泽尼斯王：那么……\n　　看来，说再见的时刻\n　　也差不多到来了呢……\n@c0@"
  tl: "@a@b澤尼斯王：那麼……\n　　看來，說再見的時刻\n　　也差不多到來了呢……\n@c0@"
8:
  en: "@aLord Zenith@bThis world of dreams was not meant to be inhabited by those born below.\n@c0@"
  ja: "@a@bゼニス王「ここは　本来　そなたらが\n\t存在するはずのない　夢の世界……。\n@c0@"
  ko: "@a@b제니스 왕: 이곳은 원래 그대들이\n존재해서는 안 될 꿈의 세계......\n@c0@"
  sl: "@a@b泽尼斯王：毕竟，这里原本是\n　　你们不应该存在的梦世界啊……\n@c0@"
  tl: "@a@b澤尼斯王：畢竟，這裡原本是\n　　你們不應該存在的夢世界啊……\n@c0@"
9:
  en: "@aLord Zenith@bOnly by forcing this realm into reality could Mortamor pursue his conquest. But now his power is spent...\n@c0@"
  ja: "@a@bゼニス王「この世界を　支配するため\n\t実体化させようとしていた大魔王の\n\tチカラも　もう　つきてゆくはず。\n@c0@"
  ko: "@a@b제니스 왕: 이 세계를 지배하기 위해\n실체화하려 했던 대마왕의\n힘도 곧 사라질 터.\n@c0@"
  sl: "@a@b泽尼斯王：大魔王为了支配这个世界，\n　　本打算将它实体化的，\n　　但是这魔力随着大魔王的灭亡也即将耗尽了。\n@c0@"
  tl: "@a@b澤尼斯王：大魔王為了支配這個世界，\n　　本打算將它實體化的，\n　　但是這魔力隨著大魔王的滅亡也即將耗盡了。\n@c0@"
10:
  en: "@aLord Zenith@bAnd so, ere long, we shall once again fade from the sight of those who inhabit the realm of the real.\n@c0@"
  ja: "@a@bゼニス王「されば　現実の　そなたらには\n\tおそらく　この世界も　われわれの姿も\n\t見えなくなるであろう。\n@c0@"
  ko: "@a@b제니스 왕: 그러면 현실의 그대들에겐\n아마 이 세계나 우리의 모습도\n보이지 않게 될 게야.\n@c0@"
  sl: "@a@b泽尼斯王：这样一来，来自现实的你们\n　　应该就再也看不见\n　　这个世界的事物了。\n@c0@"
  tl: "@a@b澤尼斯王：這樣一來，來自現實的你們\n　　應該就再也看不見\n　　這個世界的事物了。\n@c0@"
11:
  en: "@aLord Zenith@bYet be not forlorn... Such is the way of this world. Thus has it ever been, and thus shall it ever remain.\n@c0@"
  ja: "@a@bゼニス王「しかし　案ずるでない。\n\t世界が　あるべき　本当の姿に\n\tもどるだけなのじゃからな。\n@c0@"
  ko: "@a@b제니스 왕: 하지만 걱정할 필요는 없네.\n세계가 본연의 모습으로\n돌아갈 뿐이니까.\n@c0@"
  sl: "@a@b泽尼斯王：不过，也不用担心。\n　　世界会恢复到它原来应有的样子的。\n@c0@"
  tl: "@a@b澤尼斯王：不過，也不用擔心。\n　　世界會恢復到它原來應有的樣子的。\n@c0@"
12:
  en: "@aLord Zenith@bNow go, my heroes. Return to those who yearn for your homecoming.\n@c0@"
  ja: "@a@bゼニス王「さあ　ゆくがよい。\n\tみなが　そなたたちの帰りを\n\tまっておるだろう。\n@c0@"
  ko: "@a@b제니스 왕: 자, 그만 가도록 하게.\n모두 그대들이 돌아오길\n기다리고 있을 테니.\n@c0@"
  sl: "@a@b泽尼斯王：去吧，是时候说再见了。\n　　你们生命中最重要的人们，\n　　还在那边等待着你们。\n@c0@"
  tl: "@a@b澤尼斯王：去吧，是時候說再見了。\n　　你們生命中最重要的人們，\n　　還在那邊等待著你們。\n@c0@"
13:
  en: "@a%0%a002040@bRight then. Shall we get going?\n@c0@"
  ja: "@a@b%a002040「さて……と　じゃあ\n\tいくと　するか……。\n@c0@"
  ko: "@a@b%a002040: 자...... 그럼\n그만 가 볼까......\n@c0@"
  sl: "@a@b%a002040：我说……\n　　我们是不是可以走了？\n@c0@"
  tl: "@a@b%a002040：我說……\n　　我們是不是可以走了？\n@c0@"
14:
  en: "@a%0%a002040@bPlaces like this aren't my forte. I'll wait for you in the wagon.\n@c0@"
  ja: "@a@b%a002040「こういう場所は　ニガ手でね。\n\tわるいけど　ひと足　先に\n\t馬車に　もどってるぜ。\n@c0@"
  ko: "@a@b%a002040: 이런 자리는 불편해.\n미안하지만 나 먼저\n마차로 돌아가 있겠다.\n@c0@"
  sl: "@a@b%a002040：我不太会应对这种场合，\n　　不好意思，\n　　我就先回马车上去了。\n@c0@"
  tl: "@a@b%a002040：我不太會應對這種場合，\n　　不好意思，\n　　我就先回馬車上去了。\n@c0@"
15:
  en: "@a%0%a002010@bHey! Wait! What's the rush...?\n@c0@"
  ja: "@a@b%a002010「あ！　まってよ！\n\tそんなに　いそがなくても……\n@c0@"
  ko: "@a@b%a002010: 아! 기다려!\n그렇게 서두르지 않아도......\n@c0@"
  sl: "@a@b%a002010：啊！等一等啊！\n　　怎么那么着急……\n@c0@"
  tl: "@a@b%a002010：啊！等一等啊！\n　　怎麼那麼著急……\n@c0@"
16:
  en: "@a%0%a002010@bThat boy... I don't know what I'm going to do with him...\n@c0@"
  ja: "@a@b%a002010「まったく　しかたない子ね……\n@c0@"
  ko: "@a@b%a002010: 정말 어쩔 수 없다니까......\n@c0@"
  sl: "@a@b%a002010：真是个头疼的孩子……\n@c0@"
  tl: "@a@b%a002010：真是個頭疼的孩子……\n@c0@"
17:
  en: "@a%0%a002010@bI'm sorry, %a000090. I think I'd better head back to the wagon too.\n@c0@"
  ja: "@a@b%a002010「ごめんなさいね　%a000090。\n\tそんなわけだから　私も\n\t先に　馬車に　もどっているわ。\n@c0@"
  ko: "@a@b%a002010: 미안해, %a000090.\n그러니까 나도\n먼저 마차로 돌아가 있을게.\n@c0@"
  sl: "@a@b%a002010：真是抱歉了，\n　　%a000090。就是这么回事，\n　　所以我也先回马车那边去啦。\n@c0@"
  tl: "@a@b%a002010：真是抱歉了，\n　　%a000090。就是這麼回事，\n　　所以我也先回馬車那邊去啦。\n@c0@"
18:
  en: "@a%0%a002010@bDon't worry about us, alright? Take your time.\n@c0@"
  ja: "@a@b%a002010「ゆっくりしてきて　いいわよ。\n@c0@"
  ko: "@a@b%a002010: 천천히 있다가 와.\n@c0@"
  sl: "@a@b%a002010：你们慢慢聊。\n@c0@"
  tl: "@a@b%a002010：你們慢慢聊。\n@c0@"
19:
  en: "@a%0%a002010@bFarewell, Lord Zenith.\n@c0@"
  ja: "@a@b%a002010「では　ゼニス王……。\n@c0@"
  ko: "@a@b%a002010: 그럼, 제니스 폐하......\n@c0@"
  sl: "@a@b%a002010：再会，泽尼斯王……\n@c0@"
  tl: "@a@b%a002010：再會，澤尼斯王……\n@c0@"
20:
  en: "@aLord Zenith@bFarewell, child.\n@c0@"
  ja: "@a@bゼニス王「ふむ……。\n@c0@"
  ko: "@a@b제니스 왕: 흐음......\n@c0@"
  sl: "@a@b泽尼斯王：唔嗯……\n@c0@"
  tl: "@a@b澤尼斯王：唔嗯……\n@c0@"
21:
  en: "@aLord Zenith@bConsider, my friend... Had Mortamor not staged his evil campaign, our paths would never have crossed...\n@c0@"
  ja: "@a@bゼニス王「思えば　夢の世界までも\n\t支配しようとした　大魔王のおかげで\n\tわしと　そなたが出会ったのだな。\n@c0@"
  ko: "@a@b제니스 왕: 꿈의 세계까지\n지배하려던 대마왕 덕분에\n나와 그대들이 만날 수 있었지.\n@c0@"
  sl: "@a@b泽尼斯王：回想起来，也还是多亏了\n　　连梦世界也想一并支配的大魔王，\n　　我才能和你们在这里相遇。\n@c0@"
  tl: "@a@b澤尼斯王：回想起來，也還是多虧了\n　　連夢世界也想一併支配的大魔王，\n　　我才能和你們在這裡相遇。\n@c0@"
22:
  en: "@aLord Zenith@bIs fate not a strange thing?\n@c0@"
  ja: "@a@bゼニス王「なんとも　運命とは\n\tふしぎな　ものよ。\n@c0@"
  ko: "@a@b제니스 왕: 운명이란 참\n신기한 것이야.\n@c0@"
  sl: "@a@b泽尼斯王：因此才说，\n　　所谓的命运，真是何等地不可思议。\n@c0@"
  tl: "@a@b澤尼斯王：因此才說，\n　　所謂的命運，真是何等地不可思議。\n@c0@"
23:
  en: "@aLord Zenith@bAlas, this world of dreams was not meant to be inhabited by those born below.\n@c0@"
  ja: "@a@bゼニス王「ここは　本来　そなたらが\n\t存在するはずのない　夢の世界……。\n@c0@"
  ko: "@a@b제니스 왕: 이곳은 원래 그대들이\n존재해서는 안 될 꿈의 세계......\n@c0@"
