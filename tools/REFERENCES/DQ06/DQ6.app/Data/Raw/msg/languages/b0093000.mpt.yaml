90:
  en: "@a@b*: Hey, %a000090! Is it really true? The King gave you secret orders to beat Mortamor? Wow!\n@c0@"
  ja: "@a@b＊「やあ　聞いたぞ　%a000090！\n\t王さま　じきじきに　大魔王討ばつを\n\t命じられていたんだってな。\n@c0@"
  ko: "@a@b*: 여어, 이야기 들었어 %a000090!\n폐하께서 직접 대마왕 토벌\n명령을 내렸다면서?\n@c0@"
  sl: "@a@b＊：哟，%a000090，我听说了！\n　　国王陛下已经钦点你\n　　讨伐大魔王了吧。\n@c0@"
  tl: "@a@b＊：喲，%a000090，我聽說了！\n　　國王陛下已經欽點你\n　　討伐大魔王了吧。\n@c0@"
91:
  en: "@a@b*: Your battle with Mortamor is one for the history books, that's for sure...\n@c0@"
  ja: "@a@b＊「おぬしたちと　大魔王デスタムーアの\n\t戦いは　まさに　歴史に残る\n\t戦いだったのであろうな。\n@c0@"
  ko: "@a@b*: 자네들과 대마왕 데스타무아의\n전투는 실로 역사에 남을 만한\n명전투였을 테지.\n@c0@"
  sl: "@a@b＊：你们和大魔王德斯塔穆亚\n　　展开的战斗，绝对是一场\n　　足以载入史册的酣战啊。\n@c0@"
  tl: "@a@b＊：你們和大魔王德斯塔穆亞\n　　展開的戰鬥，絕對是一場\n　　足以載入史冊的酣戰啊。\n@c0@"
92:
  en: "@a@b*: Aww, why couldn't I have come? I want to be in the history books too!\n@c0@"
  ja: "@a@b＊「くそ！　私も　行きたかったぜ！\n@c0@"
  ko: "@a@b*: 젠장! 나도 가고 싶었는데!\n@c0@"
  sl: "@a@b＊：该死！我也很想加入你们啊！\n@c0@"
  tl: "@a@b＊：該死！我也很想加入你們啊！\n@c0@"
93:
  en: "@a@b*: I know this is old hat to you, but this is the first time I've ever been up in the throne room.\n@c0@"
  ja: "@a@b＊「こんなときに　なんですが\n\tわたしは　王室に　上がったのは\n\t今日が　はじめてなんです。\n@c0@"
  ko: "@a@b*: 이제 와서 좀 쑥스럽지만\n저는 왕실에 오는 건\n오늘이 처음입니다.\n@c0@"
  sl: "@a@b＊：虽然现在不是说这种话的时候，\n　　不过今天可是我第一次进入宫廷呢。\n@c0@"
  tl: "@a@b＊：雖然現在不是說這種話的時候，\n　　不過今天可是我第一次進入宮廷呢。\n@c0@"
94:
  en: "@a@b*: Maybe... (sniff) Maybe now my old warhorse of a father will consider me a real soldier! (sob)\n@c0@"
  ja: "@a@b＊「これで　親父にも　ムネをはって\n\t一人前の兵士に　なったって\n\tいえますよ。　うう……。\n@c0@"
  ko: "@a@b*: 이제 아버지한테도\n가슴을 펴고 어엿한 병사가\n됐다고 말할 수 있겠군요...... 으으흑......\n@c0@"
  sl: "@a@b＊：我也终于可以向老爸挺起胸膛，\n　　说我已经是一个独当一面的士兵了。\n　　呜呜……\n@c0@"
  tl: "@a@b＊：我也終於可以向老爸挺起胸膛，\n　　說我已經是一個獨當一面的士兵了。\n　　嗚嗚……\n@c0@"
95:
  en: "@aCaptain Blade@bAh! %0%a000090 and %a002000! Good to see you back in one piece!\n@c0@"
  ja: "@a@bソルディ「おお　無事に　もどったか\n\t%a000090に　%a002000！\n@c0@"
  ko: "@a@b솔디: 오호, 무사히 돌아왔군.\n%a000090%F0090%X와%Y과%Z %a002000!\n@c0@"
  sl: "@a@b索迪：哦哦，你们平安无事地回来了吗？\n　　%a000090和%a002000！\n@c0@"
  tl: "@a@b索迪：哦哦，你們平安無事地回來了嗎？\n　　%a000090和%a002000！\n@c0@"
96:
  en: "@aCaptain Blade@bThe Supreme Sages Isaac and Benjamin were kind enough to guide me back to this castle...\n@c0@"
  ja: "@a@bソルディ「私も　大賢者マサールどのと\n\tクリムトどのに　みちびかれ\n\tもどってきたのだ。\n@c0@"
  ko: "@a@b솔디: 나도 대현자 마살 님과\n클림트 님의 인도를 받아\n돌아올 수 있었지.\n@c0@"
  sl: "@a@b索迪：我也是在大贤者马萨尔阁下，\n　　以及克林姆阁下的引导下\n　　才得以平安返回的。\n@c0@"
  tl: "@a@b索迪：我也是在大賢者馬薩爾閣下，\n　　以及克林姆閣下的引導下\n　　才得以平安返回的。\n@c0@"
97:
  en: "@aCaptain Blade@bBut I suppose no one deserves more of my gratitude than you two. Thank you, my soldiers...\n@c0@"
  ja: "@a@bソルディ「そなたらにも　ずいぶん\n\t助けられたな。　礼をいうぞ。\n@c0@"
  ko: "@a@b솔디: 그대들에게도 많은\n도움을 받았고 말이야. 고마웠네.\n@c0@"
  sl: "@a@b索迪：你们真是帮助了我们\n　　太多太多。感谢你们。\n@c0@"
  tl: "@a@b索迪：你們真是幫助了我們\n　　太多太多。感謝你們。\n@c0@"
98:
  en: "@aCaptain Blade@bI regret to say, King Somnus appears to have stepped out for the moment...\n@c0@"
  ja: "@a@bソルディ「ところで　レイドック王が\n\tさきほどから　いらっしゃらない\n\tようなのだが……\n@c0@"
  ko: "@a@b솔디: 그런데 레이독 폐하가\n아까부터 안 계신 것\n같던데......\n@c0@"
  sl: "@a@b索迪：话说回来，雷多克王\n　　从刚才开始似乎就不在……\n@c0@"
  tl: "@a@b索迪：話說回來，雷多克王\n　　從剛才開始似乎就不在……\n@c0@"
99:
  en: "@aCaptain Blade@bHe was kind enough to leave a note, however. I'll read it for you. Ahem...\n@c0@"
  ja: "@a@bソルディ「なにやら\n\t書き置きが　あってな。\n@c0@"
  ko: "@a@b솔디: 듣기론\n편지를 남기셨다더군.\n@c0@"
  sl: "@a@b索迪：不过似乎\n　　留下了一张字条。\n@c0@"
  tl: "@a@b索迪：不過似乎\n　　留下了一張字條。\n@c0@"
100:
  en: "@aCaptain Blade@b‘Well done, %a000090 and %a002000!\n㈡\n‘Tales of your many triumphs have brought me great joy, as has Blade's safe return.\n@c0@"
  ja: "@a@bソルディ「ええと……　%a000090に\n\t%a002000　ごくろうであった。\n\tソルディも　無事で　なにより。\n@c0@"
  ko: "@a@b솔디: 으음...... %a000090%F0090%X와%Y과%Z\n%a002000 수고했네\n솔디도 무사해서 다행이다.\n@c0@"
  sl: "@a@b索迪：我看看啊……%a000090，\n　　还有%a002000，你们辛苦了。\n　　索迪也平安无事真是太好了。\n@c0@"
  tl: "@a@b索迪：我看看啊……%a000090，\n　　還有%a002000，你們辛苦了。\n　　索迪也平安無事真是太好了。\n@c0@"
101:
  en: "@aCaptain Blade@b‘I'll be waiting for you down below. Please join me when you can.\n                        ㈢㈢—King Somnus’\n@c0@"
  ja: "@a@bソルディ「わしは　下で　まっているので\n\tあとで　カオを　見せるように。\n\t㈢㈢　　　　　　　　レイドック王\n@c0@"
  ko: "@a@b솔디: 나는 밑에서 기다릴 테니\n나중에 잠깐 들르게.\n㈢㈢              레이독 왕\n@c0@"
  sl: "@a@b索迪：我正在下面等待着两位，\n　　之后请务必过来一聚。\n　　㈢㈢　　　　　　　　　　　雷多克王\n@c0@"
  tl: "@a@b索迪：我正在下面等待著兩位，\n　　之後請務必過來一聚。\n　　㈢㈢　　　　　　　　　　　雷多克王\n@c0@"
102:
  en: "@aCaptain Blade@bHmm... ‘Down below’? What's that about?\n@c0@"
  ja: "@a@bソルディ「ふーむ……。　これは\n\tいったい　どういう意味なのか……。\n@c0@"
  ko: "@a@b솔디: 흐음...... 이것은\n도대체 무슨 의미지......?\n@c0@"
  sl: "@a@b索迪：唔……\n　　这番话究竟是什么意思呢……\n@c0@"
  tl: "@a@b索迪：唔……\n　　這番話究竟是什麼意思呢……\n@c0@"
103:
  en: "@a@b*: Oh? You're leaving? Well, hurry back in time for the big feast tonight!\n@c0@"
  ja: "@a@b＊「うん？　出かけるのか？\n\t今夜は　うたげだ。　それまでには\n\tもどってくるようにな。\n@c0@"
  ko: "@a@b*: 응? 나갈 건가?\n오늘 밤엔 연회가 있으니 그때까진\n반드시 돌아오게나.\n@c0@"
  sl: "@a@b＊：嗯？你要出城吗？\n　　今晚有盛大的宴会。\n　　请记得在宴会开始之前回来。\n@c0@"
  tl: "@a@b＊：嗯？你要出城嗎？\n　　今晚有盛大的宴會。\n　　請記得在宴會開始之前回來。\n@c0@"
104:
  en: "@a@bLeave Somnia and head to the next destination?\n@c0@"
  ja: "@a@bレイドックを　出て\n次の場所へ　向かいますか？\n@c0@"
  ko: "@a@b레이독을 나와\n다음 장소로 가시겠습니까?\n@c0@"
  sl: "@a@b要离开雷多克，\n前往下一个地方吗？\n@c0@"
  tl: "@a@b要離開雷多克，\n前往下一個地方嗎？\n@c0@"
