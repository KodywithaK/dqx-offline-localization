  sl: "@a@b＊：各位旅行者，你们好，\n　　这里是蒙斯托尔镇。\n@c0@"
  tl: "@a@b＊：各位旅行者，你們好，\n　　這裡是蒙斯托爾鎮。\n@c0@"
62:
  en: "@a@b*: Now that Murdaw's gone, I fear a deluge of big city sorts visitin' Scrimsley. I don't trust 'em as far as I can spit 'em!\n@c0@"
  ja: "@a@b＊「世の中　平和になって\n\tあんたらみたいな　旅人が\n\tけっこう　ふえたみたいだな。\n@c0@"
  ko: "@a@b*: 세상이 평화로워지면서\n당신들 같은 여행자가\n꽤 늘어난 모양이군.\n@c0@"
  sl: "@a@b＊：世间这样和平，\n　　像你们这样的旅行者\n　　也增多了不少呢。\n@c0@"
  tl: "@a@b＊：世間這樣和平，\n　　像你們這樣的旅行者\n　　也增多了不少呢。\n@c0@"
63:
  en: "@a@b*: By gum, I'd never seen the like of it, I tell you! Hordes of monsters, there were!\n@c0@"
  ja: "@a@b＊「ひと月前までは　この町も\n\tまものに　ねらわれて\n\tたいへんだったのさ。\n@c0@"
  ko: "@a@b*: 한 달 전까지만 해도 이 마을은\n마물의 습격을 받아서\n난리도 아니었지.\n@c0@"
  sl: "@a@b＊：一个月之前，这个镇子\n　　还被魔物盯上了呢，\n　　真是煎熬啊。\n@c0@"
  tl: "@a@b＊：一個月之前，這個鎮子\n　　還被魔物盯上了呢，\n　　真是煎熬啊。\n@c0@"
64:
  en: "@a@b*: As you'll discover, we don't take kindly to outsiders disturbin' the peace here in Scrimsley!\n@c0@"
  ja: "@a@b＊「だが　この町の勇者%a002050が\n\tまものを　退治してくれたんだ。\n@c0@"
  ko: "@a@b*: 하지만 이 마을의 용사 %a002050%F2050%X가%Y이%Z\n마물을 퇴치해 줬어.\n@c0@"
  sl: "@a@b＊：但是，这个镇子的勇者\n　　%a002050打败了那些魔物。\n@c0@"
  tl: "@a@b＊：但是，這個鎮子的勇者\n　　%a002050打敗了那些魔物。\n@c0@"
65:
  en: "@a@b*: Luckily our %a002050, hero of the hour, stopped 'em in their tracks! That %a002050, he's a right good sort, he is!\n@c0@"
  ja: "@a@b＊「いやあー。\n\tあの　戦いぶりは　みごとだったぜ！\n@c0@"
  ko: "@a@b*: 이야~\n그때 그 전투는 정말 대단했지.\n@c0@"
  sl: "@a@b＊：哎呀，他作战的身姿\n　　真是威风凛凛啊！\n@c0@"
  tl: "@a@b＊：哎呀，他作戰的身姿\n　　真是威風凜凜啊！\n@c0@"
66:
  en: "@a@b*: %H0860%XTraveller!%YTravellers!%Z By all that is sacred, I beseech you. Heed the word of the Goddess!\n@c0@"
  ja: "@a@b＊「旅のかた。\n\t暗くなる前に　この町から\n\t立ち去るのです。\n@c0@"
  ko: "@a@b*: 여행자여.\n어두워지기 전에 이 마을을\n떠나십시오.\n@c0@"
  sl: "@a@b＊：诸位旅行者。\n　　请在天黑之前\n　　离开这个镇子。\n@c0@"
  tl: "@a@b＊：諸位旅行者。\n　　請在天黑之前\n　　離開這個鎮子。\n@c0@"
67:
  en: "@a@b*: You must leave this town by nightfall! You are not wanted here!\n@c0@"
  ja: "@a@b＊「これは　天の声……。\n\t神の　みこころに\n\tしたがうが　よいでしょう。\n@c0@"
  ko: "@a@b*: 이것은 하늘의 목소리......\n신의 뜻을\n따르는 것이 좋을 것입니다.\n@c0@"
  sl: "@a@b＊：这是上天的旨意……\n　　请你们不要违背\n　　神的意志。\n@c0@"
  tl: "@a@b＊：這是上天的旨意……\n　　請你們不要違背\n　　神的意志。\n@c0@"
68:
  en: "@a@b*: I'll tell you summat, I'm not half worried about our %a002050.\n@c0@"
  ja: "@a@b＊「%a002050さんは　ご病気でね。\n\tいつも　ねてばかり……。\n@c0@"
  ko: "@a@b*: %a002050 씨는 편찮으셔서\n항상 누워 계시지.\n@c0@"
  sl: "@a@b＊：%a002050先生生病了呢。\n　　一直在睡觉……\n@c0@"
  tl: "@a@b＊：%a002050先生生病了呢。\n　　一直在睡覺……\n@c0@"
69:
  en: "@a@b*: Ever since that terrible day, he's been feelin' poorly. He's not left his bed!\n@c0@"
  ja: "@a@b＊「あの日　以来　ずっとさ。\n\tかわいそうにねえ……。\n@c0@"
  ko: "@a@b*: 그날 이후로 계속이야.\n가엾어라......\n@c0@"
  sl: "@a@b＊：那天之后一直是这个样子。\n　　真可怜啊……\n@c0@"
  tl: "@a@b＊：那天之後一直是這個樣子。\n　　真可憐啊……\n@c0@"
70:
  en: "@a@b*: Look at %H0860%Xyou%Yyou lot%Z, swannin' about with your fancy clothes and your la-de-da %H0860%Xhair-do%Yhair-dos%Z!\n@c0@"
  ja: "@a@b＊「おおっ　そなたたちは\n\t旅の者じゃな。\n@c0@"
  ko: "@a@b*: 오옷, 그대들은\n여행자로군.\n@c0@"
  sl: "@a@b＊：哦，你们是\n　　旅行者吧。\n@c0@"
  tl: "@a@b＊：哦，你們是\n　　旅行者吧。\n@c0@"
71:
  en: "@a@b*: You won't find me traipsin' round the world! Everythin' a man needs can be found right here in Scrimsley!\n@c0@"
  ja: "@a@b＊「旅は　ええ！\n\t旅は　ええもんじゃ！\n@c0@"
  ko: "@a@b*: 여행은 좋은 게야!\n암, 그렇고말고!\n@c0@"
  sl: "@a@b＊：旅行好！\n　　旅行妙啊！\n@c0@"
  tl: "@a@b＊：旅行好！\n　　旅行妙啊！\n@c0@"
72:
  en: "@a@b*: We may have showed those monsters what for, but our troubles aren't over yet.\n@c0@"
  ja: "@a@b＊「まものは　たしかに\n\t退治されたさ。\n@c0@"
  ko: "@a@b*: 마물은 확실히\n퇴치했지.\n@c0@"
  sl: "@a@b＊：魔物的确\n　　被消灭了。\n@c0@"
  tl: "@a@b＊：魔物的確\n　　被消滅了。\n@c0@"
73:
  en: "@a@b*: Every night, it is now, like clockwork... Umm...\n@c0@"
  ja: "@a@b＊「でも　毎晩　毎晩\n\tこの町には……。\n@c0@"
  ko: "@a@b*: 하지만 매일 밤\n이 마을에는......\n@c0@"
  sl: "@a@b＊：但是每天晚上，\n　　这个镇子里……\n@c0@"
  tl: "@a@b＊：但是每天晚上，\n　　這個鎮子裡……\n@c0@"
74:
  en: "@a@b*: ...Hark at me gabbin' away! I'm talkin' a right load of old blather. Don't mind me, will you?\n@c0@"
  ja: "@a@b＊「あっ　いや。　なんでもない。\n\t聞かなかったことに\n\tしてくんな！\n@c0@"
  ko: "@a@b*: 앗, 아냐. 아무것도 아니야.\n못 들은 걸로\n해 줘!\n@c0@"
  sl: "@a@b＊：啊，不，没事。\n　　请忘掉刚才的话吧！\n@c0@"
  tl: "@a@b＊：啊，不，沒事。\n　　請忘掉剛才的話吧！\n@c0@"
75:
  en: "@a@b*: You're not Scrimsley folk, are you? Well, if there's summat you're after, you'd best talk to me old man!\n@c0@"
  ja: "@a@b＊「いらっしゃいませ！\n\tご用は　ぼくのパパに\n\tいって　くださいな！\n@c0@"
  ko: "@a@b*: 어서 오세요!\n볼일 있으면 우리 아빠한테\n말해 주세요!\n@c0@"
  sl: "@a@b＊：欢迎光临！\n　　有事的话\n　　找我爸爸吧！\n@c0@"
  tl: "@a@b＊：歡迎光臨！\n　　有事的話\n　　找我爸爸吧！\n@c0@"
76:
  en: "@a@b*: You'll find we do things at our own pace here in Scrimsley!\n@c0@"
  ja: "@a@b＊「わるいね。\n\tまだ　じゅんび中　なんだ。\n@c0@"
  ko: "@a@b*: 미안하군.\n아직 준비 중이라네.\n@c0@"
  sl: "@a@b＊：不好意思，\n　　店里还在做营业前准备。\n@c0@"
  tl: "@a@b＊：不好意思，\n　　店裡還在做營業前準備。\n@c0@"
77:
  en: "@a@b*: So I'm afraid we're not open for business just yet. Try again a bit later, if you must.\n@c0@"
  ja: "@a@b＊「つかれて　いるだろうが\n\tしばらく　してから\n\tまた　きておくれ。\n@c0@"
  ko: "@a@b*: 피곤하겠지만\n좀 있다가\n다시 와 주게.\n@c0@"
  sl: "@a@b＊：想必你们都累了吧。\n　　不过还请等会再过来。\n@c0@"
  tl: "@a@b＊：想必你們都累了吧。\n　　不過還請等會再過來。\n@c0@"
78:
  en: "@a@b*: I stayed in this humble inn just last night, but I feel every bit as exhausted as I did when I arrived.\n@c0@"
  ja: "@a@b＊「ゆうべから　この宿に\n\t泊まっているのですが\n\tどうも　つかれがとれません。\n@c0@"
  ko: "@a@b*: 어젯밤부터 이 여관에\n묵고 있는데,\n피로가 풀리질 않습니다.\n@c0@"
  sl: "@a@b＊：我从昨晚就住在\n　　这个旅店里。\n　　但是疲劳一点都没消除。\n@c0@"
  tl: "@a@b＊：我從昨晚就住在\n　　這個旅店裡。\n　　但是疲勞一點都沒消除。\n@c0@"
79:
  en: "@a@b*: Such frightful noises I heard in the night! It felt like the earth itself was shaking beneath me!\n@c0@"
  ja: "@a@b＊「夜中に　何か　ものすごい\n\t地震が　あったような……。\n@c0@"
  ko: "@a@b*: 밤중에 엄청난\n지진이 있었던 것 같은데......\n@c0@"
  sl: "@a@b＊：半夜好像\n　　发生了强烈的地震……\n@c0@"
  tl: "@a@b＊：半夜好像\n　　發生了強烈的地震……\n@c0@"
80:
  en: "@a@b*: What price a good night's sleep, I ask you!\n@c0@"
  ja: "@a@b＊「はて。\n\tあれは　やはり\n\t夢だったのでしょうか？\n@c0@"
  ko: "@a@b*: 앗.\n그건 역시\n꿈이었을까요?\n@c0@"
  sl: "@a@b＊：哎，\n　　那一定是个梦吧。\n@c0@"
  tl: "@a@b＊：哎，\n　　那一定是個夢吧。\n@c0@"
81:
  en: "@a@b*: There's no one quite like our %a002050. The people of Scrimsley owe him our lives!\n@c0@"
  ja: "@a@b＊「%a002050さまの　ご病気が\n\tいちにちも　はやく\n\tなおりますように。\n@c0@"
  ko: "@a@b*: %a002050 님의 병이\n어서 빨리\n낫기를.\n@c0@"
  sl: "@a@b＊：希望%a002050大人的病\n　　能够早日康复。\n@c0@"
  tl: "@a@b＊：希望%a002050大人的病\n　　能夠早日康復。\n@c0@"
82:
  en: "@a@b*: Which makes seeing him in such a state all the more... Oh, it's just not right!\n@c0@"
  ja: "@a@b＊「私たちを　救ってくれた\n\t%a002050さまだけが\n\tあんなことに　なるなんて……。\n@c0@"
  ko: "@a@b*: 하필이면 우리를 구해 주신\n%a002050 님에게만\n그런 일이 닥치다니......\n@c0@"
  sl: "@a@b＊：居然只有救了我们的\n　　%a002050大人一个人\n　　变成了那样……\n@c0@"
  tl: "@a@b＊：居然只有救了我們的\n　　%a002050大人一個人\n　　變成了那樣……\n@c0@"
83:
  en: "@a@b*: If you're lookin' for that old duffer I call a husband, you'll find him traipsin' about outside.\n@c0@"
  ja: "@a@b＊「おじいさんなら　さんぽですよ。\n@c0@"
  ko: "@a@b*: 우리 영감은 산책 나갔다우.\n@c0@"
  sl: "@a@b＊：老头子出去散步了哦。\n@c0@"
  tl: "@a@b＊：老頭子出去散步了哦。\n@c0@"
84:
  en: "@a@b*: It were like this, see — my little lad were set upon by a right big gang of monsters. Absolute terrors, they were!\n@c0@"
  ja: "@a@b＊「私の子どもが　まものに\n\tおそわれたのです。\n@c0@"
  ko: "@a@b*: 저희 아이가 마물에게\n습격을 받았습니다.\n@c0@"
  sl: "@a@b＊：我的孩子\n　　被魔物袭击了。\n@c0@"
  tl: "@a@b＊：我的孩子\n　　被魔物襲擊了。\n@c0@"
85:
  en: "@a@b*: Well, our %a002050 won't stand for any of that, so he wades right in and rescues the little tyke!\n@c0@"
  ja: "@a@b＊「でも　あわや　と　いうとき\n\t%a002050さまに　助けていただいて。\n@c0@"
  ko: "@a@b*: 하지만 급박한 순간에\n%a002050 님께서 구해 주셨죠.\n@c0@"
  sl: "@a@b＊：就在那危急关头，\n　　是%a002050大人救了他。\n@c0@"
  tl: "@a@b＊：就在那危急關頭，\n　　是%a002050大人救了他。\n@c0@"
86:
  en: "@a@b*: Of course, he won't hear a word of thanks. A more humble hero you couldn't hope to find!\n@c0@"
  ja: "@a@b＊「あのかたは　この町の英雄。\n\tいえっ　まさしく\n\t救いの　神ですよ！\n@c0@"
  ko: "@a@b*: 그분은 이 마을의 영웅.\n아니, 진정한\n수호신이라구요!\n@c0@"
  sl: "@a@b＊：那位大人是镇子的英雄。\n　　不对，可以说\n　　是拯救我们的神！\n@c0@"
  tl: "@a@b＊：那位大人是鎮子的英雄。\n　　不對，可以說\n　　是拯救我們的神！\n@c0@"
87:
  en: "@a@b*: It's only thanks to our %a002050 that we're all here together as a family. What a smashin' fellow he is!\n@c0@"
  ja: "@a@b＊「私たち　家族３人が\n\tこうして　いられるのも\n\t%a002050さまの　おかげですわ。\n@c0@"
  ko: "@a@b*: 저희 세 가족이\n이렇게 지낼 수 있는 것도\n%a002050 님 덕분이랍니다.\n@c0@"
  sl: "@a@b＊：我们一家三口能\n　　安稳度日，也是\n　　%a002050大人的功劳。\n@c0@"
  tl: "@a@b＊：我們一家三口能\n　　安穩度日，也是\n　　%a002050大人的功勞。\n@c0@"
88:
  en: "@a@b*: Take that, monsterface! That'll learn you! ...Take that! ...And that!\n@c0@"
  ja: "@a@b＊「てやーっ　てやーっ！\n\tえーい　まものたいじだ。\n\tてやーっ　てやーっ！\n@c0@"
  ko: "@a@b*: 이얍! 이얍!\n에잇~ 마물을 퇴치하자!\n이얍! 이얍!\n@c0@"
  sl: "@a@b＊：嘿呀！嘿呀！\n　　哎！消灭魔物！\n　　嘿呀！嘿呀！\n@c0@"
  tl: "@a@b＊：嘿呀！嘿呀！\n　　哎！消滅魔物！\n　　嘿呀！嘿呀！\n@c0@"
89:
  en: "@a@b*: (sniff) Arf, arf!\n@c0@"
  ja: "@a@b＊「くーん　くーん……。\n@c0@"
  ko: "@a@b*: 킁...킁......\n@c0@"
  sl: "@a@b＊：呜、呜……\n@c0@"
  tl: "@a@b＊：嗚、嗚……\n@c0@"
90:
  en: "@a%0%a002050@bOUCH! OUCH! OUCH! ...By gum, that don't half hurt!\n@c0@"
  ja: "@a@b%a002050「いててててっ……。\n@c0@"
  ko: "@a@b%a002050: 아야야야야......\n@c0@"
  sl: "@a@b%a002050：好疼好疼……\n@c0@"
  tl: "@a@b%a002050：好疼好疼……\n@c0@"
91:
  en: "@a%0%a002050@bNow what was it you wanted? ...What's that you say? ...Town hero? ...ME?\n@c0@"
  ja: "@a@b%a002050「えっ　私が　英雄ですって？\n\tいやーっ　おはずかしい。\n@c0@"
  ko: "@a@b%a002050: 네? 제가 영웅이라고요?\n이런, 부끄럽군요.\n@c0@"
  sl: "@a@b%a002050：诶，我是英雄？\n　　哎呀，真是愧不敢当。\n@c0@"
  tl: "@a@b%a002050：誒，我是英雄？\n　　哎呀，真是愧不敢當。\n@c0@"
92:
  en: "@a%0%a002050@bOh, I'm no hero. I just can't stand idly by while the good folk of Scrimsley are terrorised by monsters!\n@c0@"
  ja: "@a@b%a002050「まものは　なんとか\n\t退治できましたが\n\tこれ　このとおり。\n@c0@"
  ko: "@a@b%a002050: 마물은 가까스로\n퇴치했지만\n보시다시피 이렇습니다.\n@c0@"
  sl: "@a@b%a002050：虽说打败了魔物，\n　　但是我自己也成了这副样子。\n@c0@"
  tl: "@a@b%a002050：雖說打敗了魔物，\n　　但是我自己也成了這副樣子。\n@c0@"
93:
  en: "@a%0%a002050@bBut that last time, I got into a spot of bother, and one of them little beasts bit me right on the behind!\n@c0@"
  ja: "@a@b%a002050「まものに　オシリを\n\tかまれちゃって……　はははっ\n\tほんとに　おはずかしい！\n@c0@"
  ko: "@a@b%a002050: 마물에게 엉덩이를\n콱 물려 버려서...... 하하하.\n정말 부끄럽군요!\n@c0@"
  sl: "@a@b%a002050：屁股被魔物\n　　咬了一口……哈哈哈，\n　　真是羞愧难当啊！\n@c0@"
  tl: "@a@b%a002050：屁股被魔物\n　　咬了一口……哈哈哈，\n　　真是羞愧難當啊！\n@c0@"
94:
  en: "@a%0%a002050@bBut a sharp nip on the rump is a small price to pay to see the smiles back on the faces of the good folk of Scrimsley!\n@c0@"
  ja: "@a@b%a002050「でも　町のみんなに\n\t笑顔が　もどったのが\n\tなにより　なんですよ。\n@c0@"
  ko: "@a@b%a002050: 하지만 마을 사람들이\n다시 웃을 수 있게 되어서\n얼마나 다행인지 모릅니다.\n@c0@"
  sl: "@a@b%a002050：不过，镇上的人们能\n　　重展笑容，\n　　这比什么都强。\n@c0@"
