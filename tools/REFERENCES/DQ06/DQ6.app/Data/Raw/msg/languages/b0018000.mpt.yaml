0:
  en: "@a@b*: There's a crazy old coot living on the island to the north, I hear.\n@c0@"
  ja: "@a@b＊「北の小島には　おかしなことをいう\n\t老人が　住んでいるそうだ。\n@c0@"
  ko: "@a@b*: 북쪽의 작은 섬에는 \n웃기는 소리를 하는\n노인이 살고 있다는군.\n@c0@"
  sl: "@a@b＊：据说北方小岛上住着一位老人，\n　　总是说些奇怪的话。\n@c0@"
  tl: "@a@b＊：據說北方小島上住著一位老人，\n　　總是說些奇怪的話。\n@c0@"
1:
  en: "@a@b*: Not that it matters to me. You can't get up there without a ship, after all.\n@c0@"
  ja: "@a@b＊「もっとも　船でも　なければ\n\t島には　わたれないがな。\n@c0@"
  ko: "@a@b*: 애초에 배를 타지 않는 이상\n섬으로 갈 수는 없겠지만.\n@c0@"
  sl: "@a@b＊：要是没有船的话，\n　　其实是不能去那座岛的吧。\n@c0@"
  tl: "@a@b＊：要是沒有船的話，\n　　其實是不能去那座島的吧。\n@c0@"
2:
  en: "@a@b*: Heh heh... Kicked out of the palace guard, and they give me a cushy job looking after this place instead... Not bad...\n@c0@"
  ja: "@a@b＊「トホホ……　しんえいたいから\n\tはずされて　こんなところの\n\t警備を　まかされるとは……。\n@c0@"
  ko: "@a@b*: 이런...... 친위대에서\n쫓겨나서 이런 곳의\n경비를 맡게 되다니......\n@c0@"
  sl: "@a@b＊：呜呜……\n　　居然将我从亲卫队除名，\n　　还让我到这种地方来放哨……\n@c0@"
  tl: "@a@b＊：嗚嗚……\n　　居然將我從親衛隊除名，\n　　還讓我到這種地方來放哨……\n@c0@"
3:
  en: "@a@b*: Hey! This is private property! What do you thin— Wait, I know you...\n@c0@"
  ja: "@a@b＊「なんだ　おまえらは？\n\tん？　たしか　おまえらは\n\tあの時の……。\n@c0@"
  ko: "@a@b*: 뭐냐 너희들은?\n응? 분명 너희들은\n그때 그......\n@c0@"
  sl: "@a@b＊：你们有什么事？\n　　嗯？是你们啊，\n　　那个时候……\n@c0@"
  tl: "@a@b＊：你們有什麼事？\n　　嗯？是你們啊，\n　　那個時候……\n@c0@"
4:
  en: "@a@b*: Glad to see you're in one piece. Still travelling around, hey?\n@c0@"
  ja: "@a@b＊「元気そうで　なによりだ。\n\tまだ　旅を　つづけてるのか？\n@c0@"
  ko: "@a@b*: 잘 지내는 것 같아 다행이군.\n아직도 계속 여행을 하는 건가?\n@c0@"
  sl: "@a@b＊：健康是福啊。\n　　各位还要继续去旅行么？\n@c0@"
  tl: "@a@b＊：健康是福啊。\n　　各位還要繼續去旅行麼？\n@c0@"
5:
  en: "@a@b*: I hear Murdaw's kicked the bucket, not that it matters to me one way or the other...\n@c0@"
  ja: "@a@b＊「風のウワサじゃ　魔王が\n\tたおされたなんて話も　聞くが\n\tそんなこた　わしには関係ないぜ。\n@c0@"
  ko: "@a@b*: 소문으로는 마왕이\n쓰러졌다고들 하던데\n그런 건 나랑은 관계없어.\n@c0@"
  sl: "@a@b＊：我听到风言风语，\n　　说是魔王被打倒了，\n　　不过这跟我没什么关系。\n@c0@"
  tl: "@a@b＊：我聽到風言風語，\n　　說是魔王被打倒了，\n　　不過這跟我沒什麼關係。\n@c0@"
6:
  en: "@a@b*: All I need is logs to split and a good place to put my wood, hey.\n@c0@"
  ja: "@a@b＊「いつものように　木を切るだけさ。\n@c0@"
  ko: "@a@b*: 평소처럼 나무를 벨 뿐.\n@c0@"
  sl: "@a@b＊：我还跟往常一样，专心砍树就是了。\n@c0@"
  tl: "@a@b＊：我還跟往常一樣，專心砍樹就是了。\n@c0@"
7:
  en: "@a@b*: Not familiar with the concept of private property, hey? This is my house, and I'd like you out of it. \n@c0@"
  ja: "@a@b＊「なんだ　あんたらは？\n\tここは　わしの家なんだぜ。\n\t出ていってくれ。\n@c0@"
  ko: "@a@b*: 뭐냐 너희들은?\n여긴 내 집이다.\n어서 나가 줘.\n@c0@"
  sl: "@a@b＊：你们是谁啊？\n　　这里是我的家。\n　　赶快出去。\n@c0@"
  tl: "@a@b＊：你們是誰啊？\n　　這裡是我的家。\n　　趕快出去。\n@c0@"
8:
  en: "@a@b*: I'm the boss's number-one apprentice, I'll have ya know! No one gives me orders but him!\n@c0@"
  ja: "@a@b＊「おいらは　親方の　１番弟子なのさ。\n\tエッヘン！\n@c0@"
  ko: "@a@b*: 나는 스승님의 1등 제자라구.\n엣헴!\n@c0@"
  sl: "@a@b＊：我可是师父的头号弟子呢！\n　　诶嘿！\n@c0@"
  tl: "@a@b＊：我可是師父的頭號弟子呢！\n　　誒嘿！\n@c0@"
9:
  en: "@a@b*: Speakin' of which, I better straighten up this mess quick, or he'll have my hide!\n@c0@"
  ja: "@a@b＊「おっと　いけない。　さっさと\n\tこいつを　カタづけちまわないと。\n@c0@"
  ko: "@a@b*: 앗, 이러고 있을 때가 아니지.\n어서 이걸 정리해야 해.\n@c0@"
  sl: "@a@b＊：哎呀糟了，\n　　得赶紧把这收拾了才行。\n@c0@"
  tl: "@a@b＊：哎呀糟了，\n　　得趕緊把這收拾了才行。\n@c0@"
10:
  en: "@a@b*: You've arrived at Alltrades Abbey. This holy place has served as a beacon in people's lives since ancient times.\n@c0@"
  ja: "@a@b＊「ここは　ダーマの神殿。\n\tいにしえより　ひとの生きる道を\n\tつかさどる　神聖な場所です。\n@c0@"
  ko: "@a@b*: 이곳은 다마 신전.\n먼 옛날부터 사람들이 살아가는 길을\n관장해 온 신성한 장소입니다.\n@c0@"
  sl: "@a@b＊：这里是达玛神殿。\n　　是自古以来掌管人们生存之道的\n　　神圣场所。\n@c0@"
  tl: "@a@b＊：這裡是達瑪神殿。\n　　是自古以來掌管人們生存之道的\n　　神聖場所。\n@c0@"
11:
  en: "@a@b*: It's a pleasure to welcome you to Alltrades Abbey.\n@c0@"
  ja: "@a@b＊「ダーマの神殿に　ようこそ\n\tおいでくださいました。\n@c0@"
  ko: "@a@b*: 다마 신전에\n잘 오셨습니다.\n@c0@"
  sl: "@a@b＊：欢迎来到\n　　达玛神殿。\n@c0@"
  tl: "@a@b＊：歡迎來到\n　　達瑪神殿。\n@c0@"
12:
  en: "@a@b*: By the Goddess, what could have happened? It's as if we were in a deep sleep this whole time.\n@c0@"
  ja: "@a@b＊「どうしたことでしょうか……。\n\t私たちは　今まで\n\t深い眠りに　ついていたような……。\n@c0@"
  ko: "@a@b*: 어떻게 된 일일까요......\n우리는 지금까지\n긴 잠에 빠져 있었던 것 같기도 하고......\n@c0@"
  sl: "@a@b＊：到底是怎么回事……\n　　我们好像之前\n　　一直在沉睡似的……\n@c0@"
  tl: "@a@b＊：到底是怎麼回事……\n　　我們好像之前\n　　一直在沉睡似的……\n@c0@"
13:
  en: "@a@b*: I feel like someone — or something — tried to wipe the Abbey from existence...\n@c0@"
  ja: "@a@b＊「何者かが　この神殿の存在を\n\t封じこめていたような……。\n\tしかし！\n@c0@"
  ko: "@a@b*: 누군가가 이 신전의 존재를\n봉인했던 것 같기도 하고......\n하지만!\n@c0@"
  sl: "@a@b＊：恐怕是有什么人\n　　将这座神殿封印了……\n　　不过……\n@c0@"
  tl: "@a@b＊：恐怕是有什麼人\n　　將這座神殿封印了……\n　　不過……\n@c0@"
14:
  en: "@a@b*: But even if they managed to erase the Abbey from the face of the earth, they couldn't erase our souls.\n@c0@"
  ja: "@a@b＊「たとえ地上の神殿をほろぼそうとも\n\t私たちの心までを　ほろぼすことは\n\tできなかったようです。\n@c0@"
  ko: "@a@b*: 지상의 신전을 파괴한들\n우리의 마음까지 파괴할 수는\n없었던 모양입니다.\n@c0@"
  sl: "@a@b＊：虽然能摧毁地面上的神殿，\n　　但是似乎没能够\n　　摧毁我们的心灵。\n@c0@"
  tl: "@a@b＊：雖然能摧毀地面上的神殿，\n　　但是似乎沒能夠\n　　摧毀我們的心靈。\n@c0@"
15:
  en: "@a@b*: All of us are wanderers on life's great journey. It's okay to change paths as often as you like — every step is progress.\n@c0@"
  ja: "@a@b＊「ひとは　みな　人生の旅人。\n\tゆくもよし　もどるも　よし。\n@c0@"
  ko: "@a@b*: 사람은 모두 인생의 여행자.\n떠나가도 좋고 돌아와도 좋지요.\n@c0@"
  sl: "@a@b＊：人生就像一段旅程，\n　　归去来兮皆有其意。\n@c0@"
  tl: "@a@b＊：人生就像一段旅程，\n　　歸去來兮皆有其意。\n@c0@"
16:
  en: "@a@b*: I hope you too can use this visit to awaken abilities you never dreamt you had.\n@c0@"
  ja: "@a@b＊「あなたは　きっと\n\t新しい能力に\n\tめざめてゆくことでしょう。\n@c0@"
  ko: "@a@b*: 당신은 틀림없이\n새로운 능력에\n눈뜨게 될 것입니다.\n@c0@"
  sl: "@a@b＊：你身上崭新的力量\n　　一定可以觉醒吧。\n@c0@"
  tl: "@a@b＊：你身上嶄新的力量\n　　一定可以覺醒吧。\n@c0@"
17:
  en: "@a@b*: Here to change vocations, are you?\n@c0@"
  ja: "@a@b＊「おぬしらも　転職に\n\tやってきたのか？\n@c0@"
  ko: "@a@b*: 자네들도 전직하러\n왔나?\n@c0@"
  sl: "@a@b＊：你们也是\n　　来转职的吗？\n@c0@"
  tl: "@a@b＊：你們也是\n　　來轉職的嗎？\n@c0@"
18:
  en: "@a@b*: Then I'd better give you a hot tip: you should look into advanced vocations as well.\n@c0@"
  ja: "@a@b＊「では　いいことを　教えてやろう。\n\t職業には　上級職というものが\n\tあってな。　たとえば……。\n@c0@"
  ko: "@a@b*: 그럼 좋은 걸 알려 주지.\n직업에는 상급직이라는 게\n있다. 예를 들면......\n@c0@"
  sl: "@a@b＊：那就告诉你们一件事吧。\n　　职业里还存在高级职业一说。\n　　比方说……\n@c0@"
  tl: "@a@b＊：那就告訴你們一件事吧。\n　　職業裡還存在高級職業一說。\n　　比方說……\n@c0@"
19:
  en: "@a@b*: Say, for example, you wanna become an armamentalist. You'd have to master both the warrior and mage vocations first.\n@c0@"
  ja: "@a@b＊「戦士と魔法使いの両方を\n\tきわめなければ　魔法戦士には\n\tなれぬ　などということだ。\n@c0@"
  ko: "@a@b*: 전사와 마법사를 둘 다\n마스터하지 않으면 마법전사가\n될 수 없는 식이지.\n@c0@"
  sl: "@a@b＊：如果不精通\n　　战士和魔法师两种职业的话，\n　　是不能成为魔法战士的。\n@c0@"
  tl: "@a@b＊：如果不精通\n　　戰士和魔法師兩種職業的話，\n　　是不能成為魔法戰士的。\n@c0@"
20:
  en: "@a@b*: Have a word with the nun over there if you want to learn more about the different types of vocation.\n@c0@"
  ja: "@a@b＊「上級職についての\n\tくわしいことは　そこにいる\n\tシスターに　聞くといいだろう。\n@c0@"
  ko: "@a@b*: 상급직에 관한\n자세한 내용은 저기 계신\n수녀님께 물어보도록.\n@c0@"
  sl: "@a@b＊：关于高级职业的详细情况，\n　　可以去向\n　　那边那位修女打听。\n@c0@"
  tl: "@a@b＊：關於高級職業的詳細情況，\n　　可以去向\n　　那邊那位修女打聽。\n@c0@"
21:
  en: "@a@b*: Oh, and one more thing.\n@c0@"
  ja: "@a@b＊「それと　もう　ひとつ！\n@c0@"
  ko: "@a@b*: 그리고 또 하나!\n@c0@"
  sl: "@a@b＊：还有一件事！\n@c0@"
  tl: "@a@b＊：還有一件事！\n@c0@"
22:
  en: "@a@b*: Any time you want to check your progress in the various vocations, just take a gander at the Attributes menu.\n@c0@"
  ja: "@a@b＊「自分が　今　どの職業を\n\tどれほど　きわめているかは\n\t自分のつよさを　見るがいい。\n@c0@"
  ko: "@a@b*: 자기가 지금 어떤 직업을\n어느 정도 마스터했는지를 보려면\n자신의 능력치를 살펴보도록.\n@c0@"
  sl: "@a@b＊：要想知道自己\n　　目前职业的精通程度，\n　　就看看自己的能力吧。\n@c0@"
  tl: "@a@b＊：要想知道自己\n　　目前職業的精通程度，\n　　就看看自己的能力吧。\n@c0@"
23:
  en: "@a@b*: There, you can see your current mastery level of any vocations you've taken on.\n@c0@"
  ja: "@a@b＊「つよさを　ふかく見てゆけば\n\t自分が　けいけんした職業の\n\tじゅくれんどが　わかるであろう。\n@c0@"
  ko: "@a@b*: 능력치를 잘 살펴보면\n자신이 경험한 직업의\n숙련도를 알 수 있을 것이다.\n@c0@"
  sl: "@a@b＊：认真研究一下自己的能力，\n　　就可以知道自己所从事过的职业\n　　熟练的程度了。\n@c0@"
  tl: "@a@b＊：認真研究一下自己的能力，\n　　就可以知道自己所從事過的職業\n　　熟練的程度了。\n@c0@"
24:
  en: "@a@b*: Then we've got nothin' to talk about.\n@c0@"
  ja: "@a@b＊「ならば　教えることは\n\tなにも　ない。\n@c0@"
  ko: "@a@b*: 그럼 가르쳐 줄 것이\n없군.\n@c0@"
  sl: "@a@b＊：这样啊，\n　　那我没什么可告诉你们的。\n@c0@"
  tl: "@a@b＊：這樣啊，\n　　那我沒什麼可告訴你們的。\n@c0@"
25:
  en: "@a@b*: I'm a tad too old to lend you a hand. How about I give you a hint instead?\n@c0@"
  ja: "@a@b＊「わしゃあ　もうトシじゃで\n\tあんたらの　仲間には　なれんが\n\tいいことを　おしえてやろう。\n@c0@"
  ko: "@a@b*: 나는 이미 나이가 나이니만큼\n자네들의 동료가 될 수는 없네만\n대신에 좋은 걸 알려 주겠네.\n@c0@"
  sl: "@a@b＊：老夫上了年纪，\n　　没办法跟各位并肩作战了，\n　　不过可以告诉你们一件事情。\n@c0@"
  tl: "@a@b＊：老夫上了年紀，\n　　沒辦法跟各位並肩作戰了，\n　　不過可以告訴你們一件事情。\n@c0@"
26:
  en: "@a@b*: Even if you change vocations, you won't lose your progress in the one you gave up.\n@c0@"
  ja: "@a@b＊「たとえ　転職しても　レベルが\n\t１に　もどることは　ないぞ。\n@c0@"
  ko: "@a@b*: 전직을 해도 레벨이\n1로 돌아가는 일은 없다네.\n@c0@"
  sl: "@a@b＊：即使转了职，\n　　等级也不会退回１级。\n@c0@"
  tl: "@a@b＊：即使轉了職，\n　　等級也不會退回１級。\n@c0@"
27:
  en: "@a@b*: In fact, you can change back to the original vocation at any time and pick up right where you left off.\n@c0@"
  ja: "@a@b＊「そればかりか　途中で　職を\n\tかえても　そこまでの修行はムダに\n\tならず　また　続きが　できる。\n@c0@"
  ko: "@a@b*: 그뿐 아니라 도중에 직업을\n바꿔도 그때까지 쌓아 온 직업 수련은\n다시 이어갈 수 있지.\n@c0@"
  sl: "@a@b＊：而且即使改变职业，\n　　之前的修行也不会作废，\n　　以后还能转职回来继续修炼。\n@c0@"
  tl: "@a@b＊：而且即使改變職業，\n　　之前的修行也不會作廢，\n　　以後還能轉職回來繼續修煉。\n@c0@"
28:
  en: "@a@b*: In other words, no matter which vocation you choose, you can't possibly lose!\n@c0@"
  ja: "@a@b＊「つまり　旅をするなら\n\tなにかの職業に　ついていたほうが\n\t絶対に　トクということじゃな。\n@c0@"
  ko: "@a@b*: 그 말인즉슨 여행을 할 때는\n어떤 직업이든 일단 가지는 게\n절대적으로 유리하다는 뜻일세.\n@c0@"
  sl: "@a@b＊：也就是说，要旅行的话，\n　　还是先选择一个职业吧，\n　　百利无一害哦。\n@c0@"
  tl: "@a@b＊：也就是說，要旅行的話，\n　　還是先選擇一個職業吧，\n　　百利無一害哦。\n@c0@"
29:
  en: "@a@b*: Hmm, yes. I've learnt a great many things over the course of my research here.\n@c0@"
  ja: "@a@b＊「ふむふむ。\n\t調べていくうちに　いろんなことが\n\tわかってきましたぞ。\n@c0@"
  ko: "@a@b*: 흐음.\n조사를 진행하면서 다양한 사실을\n알게 되었습니다.\n@c0@"
  sl: "@a@b＊：嗯嗯。\n　　通过调查，\n　　我了解到不少事情呢。\n@c0@"
  tl: "@a@b＊：嗯嗯。\n　　通過調查，\n　　我瞭解到不少事情呢。\n@c0@"
30:
  en: "@a@b*: Apparently, Alltrades Abbey was something of a thorn in Murdaw's side. Yes...\n@c0@"
  ja: "@a@b＊「世界を支配しようとする魔王にとって\n\tここ　ダーマの神殿の存在は\n\tありがたくなかったわけです。\n@c0@"
