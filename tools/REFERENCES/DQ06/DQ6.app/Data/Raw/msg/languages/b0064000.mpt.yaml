0:
  en: "@a@b*: Welcome to Weaver's Peak!\n@c0@"
  ja: "@a@b＊「ここは　ライフコッドの村だよ。\n@c0@"
  ko: "@a@b*: 여기는 라이프코드 마을이야.\n@c0@"
  sl: "@a@b＊：这里是莱夫科德村。\n@c0@"
  tl: "@a@b＊：這裡是萊夫科德村。\n@c0@"
1:
  en: "@a@b*: %0%a000090! You really took down that big, bad monster? You're the man!\n@c0@"
  ja: "@a@b＊「あっ　%a000090あんちゃん！\n\tすごいじゃん！　でっかいまものを\n\tやっつけたんだって？\n@c0@"
  ko: "@a@b*: 앗, %a000090!\n굉장한데! 엄청 큰 마물을\n쓰러뜨렸다며?\n@c0@"
  sl: "@a@b＊：啊，%a000090哥哥！\n　　听说你打倒了一个大魔物？\n　　你很强啊！\n@c0@"
  tl: "@a@b＊：啊，%a000090哥哥！\n　　聽說你打倒了一個大魔物？\n　　你很強啊！\n@c0@"
2:
  en: "@a@b*: I had you all wrong, %a000090.\n@c0@"
  ja: "@a@b＊「おいら　見なおしちゃったよ。\n@c0@"
  ko: "@a@b*: 형님, 다시 봤어.\n@c0@"
  sl: "@a@b＊：我要对你刮目相看了。\n@c0@"
  tl: "@a@b＊：我要對你刮目相看了。\n@c0@"
3:
  en: "@a@b*: Now why would all them mean monsters attack our village?\n@c0@"
  ja: "@a@b＊「あのまものたちは　いったい\n\tなにが　目的で　この村を\n\tおそったのかしら？\n@c0@"
  ko: "@a@b*: 그 마물들은 도대체\n무슨 목적으로\n이 마을을 습격한 걸까?\n@c0@"
  sl: "@a@b＊：那些魔物们为什么会袭击村子呢？\n@c0@"
  tl: "@a@b＊：那些魔物們為什麼會襲擊村子呢？\n@c0@"
4:
  en: "@a@b*: Maybe it was my feminine charms that lured 'em...㈢ Hey — it's possible!\n@c0@"
  ja: "@a@b＊「まさか　この美しい　あたしを\n\tねらって……㈢㈢なんて\n\t冗談よ　冗談。\n@c0@"
  ko: "@a@b*: 설마 이렇게 아름다운 날\n노리고...... ㈢㈢호호호~\n농담이야, 농담.\n@c0@"
  sl: "@a@b＊：难道是为了我的美貌？\n　　……㈢㈢我说笑的啦。\n@c0@"
  tl: "@a@b＊：難道是為了我的美貌？\n　　……㈢㈢我說笑的啦。\n@c0@"
5:
  en: "@a@b*: That Tania, though... She really is pretty enough to melt a monster's heart.\n@c0@"
  ja: "@a@b＊「でも　ターニアちゃんくらい\n\tかわいい娘だったら　まものでも\n\tホレちゃうかもね。\n@c0@"
  ko: "@a@b*: 근데 타니아만큼\n귀여운 애라면 마물들도\n홀딱 반해 버릴지 몰라.\n@c0@"
  sl: "@a@b＊：不过如果是塔尼娅姑娘的话，\n　　魔物或许会沉迷于她的美貌。\n@c0@"
  tl: "@a@b＊：不過如果是塔尼婭姑娘的話，\n　　魔物或許會沉迷於她的美貌。\n@c0@"
6:
  en: "@a@b*: Our little village, invaded by monsters... I never saw that comin'.\n@c0@"
  ja: "@a@b＊「もう　びっくりじゃよ。\n\tこの村が　おそわれるとはのう……。\n@c0@"
  ko: "@a@b*: 깜짝 놀랐다네.\n이 마을이 습격을 당하다니......\n@c0@"
  sl: "@a@b＊：真是吓死人了。\n　　这个村子竟然会被袭击……\n@c0@"
  tl: "@a@b＊：真是嚇死人了。\n　　這個村子竟然會被襲擊……\n@c0@"
7:
  en: "@a@b*: It put folks around here into a proper panic. Some said they even saw a second %a000090! I suppose a shock like that'll mess with your mind.\n@c0@"
  ja: "@a@b＊「みんな　あわてておったんじゃろうが\n\t%a000090が　ふたりいるのを見た！\n\tなんていう者も　出るしまつじゃ。\n@c0@"
  ko: "@a@b*: 모두 허둥지둥했지만,\n난 %a000090%F0090%X가%Y이%Z 둘이나 있는 걸 봐버렸지!\n이젠 별것이 다 나타나는구먼.\n@c0@"
  sl: "@a@b＊：那时候虽然很慌乱，\n　　不过大家都看到两个%a000090！\n　　这到底是怎么回事啊。\n@c0@"
  tl: "@a@b＊：那時候雖然很慌亂，\n　　不過大家都看到兩個%a000090！\n　　這到底是怎麼回事啊。\n@c0@"
8:
  en: "@a@b*: Oh! All my pots are in one piece! Thank the Goddess.\n@c0@"
  ja: "@a@b＊「ホッ　どうやら　つぼは\n\tぶじのようだな。\n@c0@"
  ko: "@a@b*: 휴~, 아무래도 항아리는\n무사한 모양이군.\n@c0@"
  sl: "@a@b＊：啊呀，\n　　幸好罐子没破。\n@c0@"
  tl: "@a@b＊：啊呀，\n　　幸好罐子沒破。\n@c0@"
9:
