  sl: "@a@b＊：呜呜，太好了。\n　　我还以为我没机会再喝酒了。\n@c0@"
  tl: "@a@b＊：嗚嗚，太好了。\n　　我還以為我沒機會再喝酒了。\n@c0@"
10:
  en: "@a@b*: Startin' tomorrow... (glug glug)\n@c0@"
  ja: "@a@b＊「生きてて　よかったよ　グビグビ。\n@c0@"
