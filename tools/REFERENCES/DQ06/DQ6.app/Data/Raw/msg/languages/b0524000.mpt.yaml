  tl: "@a@b%a002000：這小姑娘相當感激%a000090啊。\n@c0@"
45:
  en: "@a%0%a002010@bOh, right. You fell into the chasm helping out her father, didn't you, %a000090?\n@c0@"
  ja: "@a@b%a002010「そういえば\n\t%a000090が　お父さんの　かわりに\n\t大穴に　落ちたんだったわね。\n@c0@"
  ko: "@a@b%a002010: 그러고 보니\n%a000090%F0090%X가%Y이%Z 아버지 대신에\n큰 구멍에 떨어졌었어.\n@c0@"
  sl: "@a@b%a002010：说起来，\n　　%a000090你是为救她父亲\n　　才掉进大洞的吧。\n@c0@"
  tl: "@a@b%a002010：說起來，\n　　%a000090你是為救她父親\n　　才掉進大洞的吧。\n@c0@"
46:
  en: "@a%0%a002020@bI think that girl's giving you the eye, %a000090.\n@c0@"
