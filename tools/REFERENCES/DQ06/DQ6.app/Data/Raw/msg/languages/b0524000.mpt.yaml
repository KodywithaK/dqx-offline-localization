  ko: "@a@b%a002020: 어머?\n안 산 거야?\n@c0@"
  sl: "@a@b%a002020：啊？\n　　不买吗？\n@c0@"
  tl: "@a@b%a002020：啊？\n　　不買嗎？\n@c0@"
59:
  en: "@a%0%a002020@bI don't know... I think it'd be a big help if we had it...\n@c0@"
  ja: "@a@b%a002020「あたしは　もってると\n\tすっごく　便利だと　思うけどなー。\n@c0@"
  ko: "@a@b%a002020: 내 생각엔 가지고 있으면\n아주 편리할 것 같은데.\n@c0@"
  sl: "@a@b%a002020：我觉得，\n　　有这个钥匙会很方便的。\n@c0@"
  tl: "@a@b%a002020：我覺得，\n　　有這個鑰匙會很方便的。\n@c0@"
