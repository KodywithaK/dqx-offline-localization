  en: "@a%0%a002010@bI sense that there are plenty of places outside this town where the thief's key might come in handy as well.\n@c0@"
  ja: "@a@b%a002010「この町　いがいにも\n\tとうぞくのカギが　かかったトビラが\n\tあったような　気がするわ。\n@c0@"
  ko: "@a@b%a002010: 이 마을, 의외로\n도적의 열쇠로 잠긴 문이\n있었던 것 같은데.\n@c0@"
