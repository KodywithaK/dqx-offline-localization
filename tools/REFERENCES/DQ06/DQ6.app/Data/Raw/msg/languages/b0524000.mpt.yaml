  ko: "@a@b%a002020: 이 여자\n%a000090%F0090%X를%Y을%Z 보는 눈빛이\n뭔가 다른 것 같아......\n@c0@"
  sl: "@a@b%a002020：我觉得，\n　　那个女孩子看%a000090的眼神\n　　有点不一样……\n@c0@"
  tl: "@a@b%a002020：我覺得，\n　　那個女孩子看%a000090的眼神\n　　有點不一樣……\n@c0@"
47:
  en: "@a%0%a002020@bTee hee! We women can tell!\n@c0@"
  ja: "@a@b%a002020「えへへ。\n\tこれは　女のカンよ！\n@c0@"
  ko: "@a@b%a002020: 에헤헤.\n이건 여자의 직감이야!\n@c0@"
  sl: "@a@b%a002020：诶嘿嘿。\n　　这就是女人的直觉！\n@c0@"
  tl: "@a@b%a002020：誒嘿嘿。\n　　這就是女人的直覺！\n@c0@"
48:
  en: "@a%0%a002000@bBet you're glad the old fella's doin' okay, aye, %a000090?\n@c0@"
  ja: "@a@b%a002000「おっさんも\n\t元気そうで　何よりじゃないか。\n\tなあ　%a000090。\n@c0@"
  ko: "@a@b%a002000: 아저씨도\n잘 지내는 것 같아 다행이군.\n안 그러냐 %a000090?\n@c0@"
  sl: "@a@b%a002000：只要大叔健康就好。\n　　对吧，%a000090。\n@c0@"
  tl: "@a@b%a002000：只要大叔健康就好。\n　　對吧，%a000090。\n@c0@"
49:
  en: "@a%0%a002010@bThe workmanship on Cliff's crowns is wonderful.\n@c0@"
  ja: "@a@b%a002010「見て！\n\tどの　かんむりも\n\tすばらしい　仕上がりだわ。\n@c0@"
  ko: "@a@b%a002010: 봐봐!\n어느 화관도\n하나 같이 훌륭해.\n@c0@"
  sl: "@a@b%a002010：看呐！\n　　所有的头冠都做得这么精美。\n@c0@"
  tl: "@a@b%a002010：看呐！\n　　所有的頭冠都做得這麼精美。\n@c0@"
50:
  en: "@a%0%a002010@bHe's a true craftsman in every sense of the word!\n@c0@"
  ja: "@a@b%a002010「やっぱり　ビルテさんは\n\tホンモノの　職人さんね！\n@c0@"
  ko: "@a@b%a002010: 과연 빌테 씨야말로\n진정한 장인!\n@c0@"
  sl: "@a@b%a002010：比尔特先生\n　　不愧是出色的工匠！\n@c0@"
  tl: "@a@b%a002010：比爾特先生\n　　不愧是出色的工匠！\n@c0@"
51:
  en: "@a%0%a002020@bWow, look at all these crowns! Guess these things aren't just for kings any more...\n@c0@"
  ja: "@a@b%a002020「わあっ\n\tステキな　かんむりが　いっぱい！\n\tあたしも　かぶってみたいなあ。\n@c0@"
  ko: "@a@b%a002020: 와아\n멋진 화관이 잔뜩 있네!\n나도 한번 써보고 싶어.\n@c0@"
  sl: "@a@b%a002020：哇，\n　　全都是漂亮的头冠！\n　　人家想要戴一下嘛。\n@c0@"
  tl: "@a@b%a002020：哇，\n　　全都是漂亮的頭冠！\n　　人家想要戴一下嘛。\n@c0@"
52:
  en: "@a%0%a002000@bThe town inn, aye?\n@c0@"
  ja: "@a@b%a002000「この町の　宿屋か。\n@c0@"
  ko: "@a@b%a002000: 이 마을의 여관이군.\n@c0@"
  sl: "@a@b%a002000：他是说旅店么。\n@c0@"
  tl: "@a@b%a002000：他是說旅店麼。\n@c0@"
