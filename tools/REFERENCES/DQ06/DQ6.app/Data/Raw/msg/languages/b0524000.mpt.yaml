55:
  en: "@a%0%a002010@bNow that we've paid for it, it would be a shame not to try it out in some of the places we've visited.\n@c0@"
  ja: "@a@b%a002010「せっかくだから\n\tこれまで　おとずれた場所を\n\tまわってみるのも　いいわね。\n@c0@"
  ko: "@a@b%a002010: 이왕이면\n지금까지 방문했던 곳을\n쭉 돌아봐도 좋겠어.\n@c0@"
  sl: "@a@b%a002010：既然已经买了，\n　　不如到以前去过的地方\n　　好好转转吧。\n@c0@"
  tl: "@a@b%a002010：既然已經買了，\n　　不如到以前去過的地方\n　　好好轉轉吧。\n@c0@"
56:
  en: "@a%0%a002020@bThat thief's key only opens up one specific type of door, right?\n@c0@"
