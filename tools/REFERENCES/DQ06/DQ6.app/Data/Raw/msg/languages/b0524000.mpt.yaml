0:
  en: "@a%0%a002000@bGood thing I'm so humble, or all this praise would go right to my handsome head!\n@c0@"
  ja: "@a@b%a002000「こうして　どこに行っても\n\tほめられるのは　いい気分だぜ。\n@c0@"
  ko: "@a@b%a002000: 이렇게 어딜 가나\n칭찬 받으니 기분이 좋군.\n@c0@"
  sl: "@a@b%a002000：走到哪里都有人表扬，\n　　这感觉可真不错啊。\n@c0@"
  tl: "@a@b%a002000：走到哪裡都有人表揚，\n　　這感覺可真不錯啊。\n@c0@"
1:
  en: "@a%0%a002010@bI bet there are still some soldiers out there looking for it.\n@c0@"
  ja: "@a@b%a002010「まだ　あちこちで\n\tさがしている　人たちが\n\tいるかもしれないわね。\n@c0@"
  ko: "@a@b%a002010: 아직 여기저기서\n찾고 있는 사람들이\n있을지도 몰라.\n@c0@"
  sl: "@a@b%a002010：恐怕还有别的人\n　　在到处寻找吧。\n@c0@"
  tl: "@a@b%a002010：恐怕還有別的人\n　　在到處尋找吧。\n@c0@"
2:
  en: "@a%0%a002020@bTee hee! I helped find it too!\n@c0@"
  ja: "@a@b%a002020「えへへ。\n\tあたしも　いっしょに\n\t見つけたんだよ！\n@c0@"
  ko: "@a@b%a002020: 에헤헤.\n나도 함께\n찾았다고!\n@c0@"
  sl: "@a@b%a002020：诶嘿嘿。\n　　找镜子的过程，\n　　人家也参与了哦！\n@c0@"
  tl: "@a@b%a002020：誒嘿嘿。\n　　找鏡子的過程，\n　　人家也參與了哦！\n@c0@"
3:
  en: "@a%0%a002000@bIn a place like this, sleepin's about the only fun thing to do when you're off duty...\n@c0@"
  ja: "@a@b%a002000「こんなところにいたら\n\t楽しみは　寝ることくらいしか\n\tないかもな……。\n@c0@"
  ko: "@a@b%a002000: 이런 곳에 있으면\n잠자는 것 말고는\n낙이 없을지도......\n@c0@"
  sl: "@a@b%a002000：在这样的地方值班，\n　　唯一的乐趣\n　　恐怕就是睡觉了……\n@c0@"
  tl: "@a@b%a002000：在這樣的地方值班，\n　　唯一的樂趣\n　　恐怕就是睡覺了……\n@c0@"
4:
  en: "@a%0%a002010@bPoor thing. He seems exhausted.\n@c0@"
  ja: "@a@b%a002010「かわいそうに。\n\tよっぽど　つかれているのね。\n@c0@"
  ko: "@a@b%a002010: 가엾어라.\n어지간히 피곤한가 봐.\n@c0@"
  sl: "@a@b%a002010：好可怜啊。\n　　看来相当累啊。\n@c0@"
  tl: "@a@b%a002010：好可憐啊。\n　　看來相當累啊。\n@c0@"
5:
  en: "@a%0%a002020@b%0%a000090, shhh! Soldiers need their beauty sleep too, you know!\n@c0@"
  ja: "@a@b%a002020「シーッ　%a000090。\n\t大きな声だすと　おこしちゃうよ。\n@c0@"
  ko: "@a@b%a002020: 쉿, %a000090.\n큰 소리로 떠들면 깬단 말이야.\n@c0@"
  sl: "@a@b%a002020：嘘，%a000090。\n　　小声点，他睡着了。\n@c0@"
  tl: "@a@b%a002020：噓，%a000090。\n　　小聲點，他睡著了。\n@c0@"
6:
  en: "@a%0%a002020@bOoh, tents! Shops! But why's the place so placid?\n@c0@"
  ja: "@a@b%a002020「あっ　テントがある！\n\t……でも　そのわりには\n\tしずかな　町だね。\n@c0@"
  ko: "@a@b%a002020: 앗, 텐트가 있어!\n......하지만, 그런 것치곤\n조용한 마을이네.\n@c0@"
  sl: "@a@b%a002020：啊，有帐篷！\n　　……这个小镇意外地安静啊。\n@c0@"
  tl: "@a@b%a002020：啊，有帳篷！\n　　……這個小鎮意外地安靜啊。\n@c0@"
7:
  en: "@a%0%a002000@bThe bazaar's finally run its course, aye?\n@c0@"
  ja: "@a@b%a002000「そっか　とうとう\n\tバザーも　終わったのか。\n@c0@"
  ko: "@a@b%a002000: 아, 드디어\n장터도 파했나 보군.\n@c0@"
  sl: "@a@b%a002000：哦哦，\n　　集市也终于结束了啊。\n@c0@"
  tl: "@a@b%a002000：哦哦，\n　　集市也終於結束了啊。\n@c0@"
8:
  en: "@a%0%a002010@bThey hold an annual bazaar in this town, don't they?\n@c0@"
  ja: "@a@b%a002010「この町では　毎年\n\tバザーが　開かれているのね。\n@c0@"
  ko: "@a@b%a002010: 이 마을에서는 매년\n장터가 열린대.\n@c0@"
  sl: "@a@b%a002010：这个镇子每年都有集市啊。\n@c0@"
  tl: "@a@b%a002010：這個鎮子每年都有集市啊。\n@c0@"
9:
  en: "@a%0%a002020@bWhat!? No! And I missed it by THIS much...\n@c0@"
  ja: "@a@b%a002020「えー！？\n\tあたし　バザー見たかったー！\n@c0@"
  ko: "@a@b%a002020: 뭐~!?\n장터 구경하고 싶었는데!\n@c0@"
  sl: "@a@b%a002020：哼～\n　　人家想看集市嘛！\n@c0@"
  tl: "@a@b%a002020：哼～\n　　人家想看集市嘛！\n@c0@"
10:
  en: "@a%0%a002000@bIf he says so. Me, I never lose.\n@c0@"
  ja: "@a@b%a002000「おう　オレも\n\tおうえん　してるからな！\n@c0@"
  ko: "@a@b%a002000: 오호, 나도\n응원해 주지!\n@c0@"
  sl: "@a@b%a002000：嗯嗯，\n　　俺会给你捧场的！\n@c0@"
  tl: "@a@b%a002000：嗯嗯，\n　　俺會給你捧場的！\n@c0@"
11:
  en: "@a%0%a002010@bLocation is indeed the key to a successful business.\n@c0@"
  ja: "@a@b%a002010「そうね。\n\t商売には　場所も　だいじよね。\n@c0@"
  ko: "@a@b%a002010: 맞아.\n장사는 장소도 중요해.\n@c0@"
  sl: "@a@b%a002010：是啊。\n　　摊子的位置很重要呢。\n@c0@"
  tl: "@a@b%a002010：是啊。\n　　攤子的位置很重要呢。\n@c0@"
12:
  en: "@a%0%a002020@bYeah... When it comes to selling, it's all about location, location, location!\n@c0@"
  ja: "@a@b%a002020「たしかに\n\tこんな　ハジっこじゃ\n\tだれも　こないよね。\n@c0@"
  ko: "@a@b%a002020: 하긴\n이런 구석진 곳엔\n아무도 안 올 거야.\n@c0@"
  sl: "@a@b%a002020：说得没错，\n　　这么个角落，\n　　谁都不会来吧。\n@c0@"
  tl: "@a@b%a002020：說得沒錯，\n　　這麼個角落，\n　　誰都不會來吧。\n@c0@"
13:
  en: "@a%0%a002000@bPfft, whatever you say. Birds don't talk, anyway. They sing!\n@c0@"
  ja: "@a@b%a002000「オレたちだって\n\tメチャメチャ　いそがしいぜ！\n@c0@"
  ko: "@a@b%a002000: 우리도\n눈코 뜰 새 없이 바쁘다고!\n@c0@"
  sl: "@a@b%a002000：俺们也正忙着呢！\n@c0@"
  tl: "@a@b%a002000：俺們也正忙著呢！\n@c0@"
14:
  en: "@a%0%a002010@bHis secret operation planning keeps him up all night — every night!\n@c0@"
  ja: "@a@b%a002010「王さまは\n\t寝ないで　はたらいて\n\tいらっしゃるものね。\n@c0@"
  ko: "@a@b%a002010: 임금님은\n잠도 자지 않고\n일하나 보네.\n@c0@"
  sl: "@a@b%a002010：国王正在不眠不休地工作吧。\n@c0@"
  tl: "@a@b%a002010：國王正在不眠不休地工作吧。\n@c0@"
15:
  en: "@a%0%a002020@bRiddle me this: ‘I am awake up above but asleep down below. What am I?’\n@c0@"
  ja: "@a@b%a002020「上は　ドタバタ\n\t下は　グウグウ。\n\tこれ　なあんだ？\n@c0@"
  ko: "@a@b%a002020: 위에는 허둥지둥.\n아래는 쿨쿨.\n이게 뭔지 알아?\n@c0@"
  sl: "@a@b%a002020：上面的忙死\n　　下面的睡死。\n　　猜猜是什么？\n@c0@"
  tl: "@a@b%a002020：上面的忙死\n　　下面的睡死。\n　　猜猜是什麼？\n@c0@"
16:
  en: "@a%0%a002020@bGive up? I'm King Somnus! Tee hee!\n@c0@"
  ja: "@a@b%a002020「答えは\n\tレイドック王　でした！\n\tえへへ。\n@c0@"
  ko: "@a@b%a002020: 정답은\n레이독 왕이랍니다!\n에헤헤.\n@c0@"
  sl: "@a@b%a002020：答案是\n　　雷多克王！\n　　诶嘿嘿。\n@c0@"
  tl: "@a@b%a002020：答案是\n　　雷多克王！\n　　誒嘿嘿。\n@c0@"
17:
  en: "@a%0%a002000@bAye, that or maybe he just had a thing for overpriced knick-knacks.\n@c0@"
  ja: "@a@b%a002000「なーるほど！\n\tそれで　バザーにか。\n\tそっかあ。\n@c0@"
  ko: "@a@b%a002000: 이제야 알겠어!\n그래서 장터에.\n그렇군.\n@c0@"
  sl: "@a@b%a002000：原来如此！\n　　所以他才来集市啊。\n　　知道了。\n@c0@"
  tl: "@a@b%a002000：原來如此！\n　　所以他才來集市啊。\n　　知道了。\n@c0@"
18:
  en: "@a%0%a002010@bWell, he won't be looking for it much longer! Hee hee!\n@c0@"
  ja: "@a@b%a002010「もうすぐ　王さまの\n\tご注文の品が　お手元にとどくわ。\n\tうふふ。\n@c0@"
  ko: "@a@b%a002010: 이제 곧 임금님이\n주문하신 물건이 도착할 거야.\n우후훗.\n@c0@"
  sl: "@a@b%a002010：国王想要的东西，\n　　马上就要送到他手里了。\n　　呵呵呵。\n@c0@"
  tl: "@a@b%a002010：國王想要的東西，\n　　馬上就要送到他手裡了。\n　　呵呵呵。\n@c0@"
19:
  en: "@a%0%a002020@b‘Legendary mirror’? She means Ra's mirror, right?\n@c0@"
  ja: "@a@b%a002020「伝説の鏡って\n\tラーの鏡だよね？\n@c0@"
  ko: "@a@b%a002020: 전설의 거울이란\n라의 거울이지?\n@c0@"
  sl: "@a@b%a002020：传说中的镜子，\n　　是说太阳神镜吧？\n@c0@"
  tl: "@a@b%a002020：傳說中的鏡子，\n　　是說太陽神鏡吧？\n@c0@"
20:
  en: "@a%0%a002000@bAye! That's old news to us!\n@c0@"
  ja: "@a@b%a002000「もちろん\n\t知ってるぜ！\n@c0@"
  ko: "@a@b%a002000: 물론\n알고 있지!\n@c0@"
  sl: "@a@b%a002000：当然知道啦！\n@c0@"
  tl: "@a@b%a002000：當然知道啦！\n@c0@"
21:
  en: "@a%0%a002010@bThe speed at which rumours spread never ceases to amaze me...\n@c0@"
  ja: "@a@b%a002010「ウワサって\n\t伝わるのが　早いのね。\n@c0@"
  ko: "@a@b%a002010: 소문은\n진짜 빠르구나.\n@c0@"
  sl: "@a@b%a002010：传闻散播得好快。\n@c0@"
  tl: "@a@b%a002010：傳聞散播得好快。\n@c0@"
22:
  en: "@a%0%a002020@bBut I thought the lady with us was— Oops! I keep forgetting it's a secret!\n@c0@"
  ja: "@a@b%a002020「あたしたちと\n\tいっしょにいる　女のひとが……\n\tあ！　これ　ナイショだっけ！\n@c0@"
  ko: "@a@b%a002020: 우리랑\n같이 있는 여자가......\n아! 이건 비밀이었지!\n@c0@"
  sl: "@a@b%a002020：跟我们一起的女人就是……\n　　啊！不行，要保密！\n@c0@"
  tl: "@a@b%a002020：跟我們一起的女人就是……\n　　啊！不行，要保密！\n@c0@"
23:
  en: "@a%0%a002000@bLooks like the older brother won the sales war — or dreamt he did.\n@c0@"
  ja: "@a@b%a002000「兄弟バトルは\n\tけっきょく　兄が\n\t勝ったってワケか。\n@c0@"
  ko: "@a@b%a002000: 형제간의 싸움은\n결국 형의\n승리로 돌아갔나 보군.\n@c0@"
  sl: "@a@b%a002000：看样子，\n　　这场兄弟之战，\n　　是哥哥赢了。\n@c0@"
  tl: "@a@b%a002000：看樣子，\n　　這場兄弟之戰，\n　　是哥哥贏了。\n@c0@"
24:
  en: "@a%0%a002010@bNow there's a merchant who knows the value of a good location!\n@c0@"
  ja: "@a@b%a002010「ここは　商売するには\n\tいい場所だわね。\n@c0@"
  ko: "@a@b%a002010: 여기는 장사하기에\n좋은 장소야.\n@c0@"
  sl: "@a@b%a002010：这里是个做买卖的好地方。\n@c0@"
  tl: "@a@b%a002010：這裡是個做買賣的好地方。\n@c0@"
25:
  en: "@a%0%a002020@bHe's in a good mood. I guess money does buy happiness.\n@c0@"
  ja: "@a@b%a002020「いいなー。\n\tもうかって　いいなー。\n@c0@"
  ko: "@a@b%a002020: 부러워.\n돈 많이 벌어서 좋겠다.\n@c0@"
  sl: "@a@b%a002020：真好啊。\n　　赚钱真好啊。\n@c0@"
  tl: "@a@b%a002020：真好啊。\n　　賺錢真好啊。\n@c0@"
26:
  en: "@a%0%a002000@bWouldn't be much of a bazaar without customers.\n@c0@"
  ja: "@a@b%a002000「どんな　祭りでも\n\tにぎやかじゃ　ないとな。\n@c0@"
  ko: "@a@b%a002000: 어떤 축제든\n붐벼야 제맛이지.\n@c0@"
  sl: "@a@b%a002000：无论什么样的集会\n　　都应该热闹才对。\n@c0@"
  tl: "@a@b%a002000：無論什麼樣的集會\n　　都應該熱鬧才對。\n@c0@"
27:
  en: "@a%0%a002010@bWhen peace returns to the world, maybe I'll try opening a little stall in this town.\n@c0@"
  ja: "@a@b%a002010「平和に　なったら\n\t私も　ここに　お店を\n\t出して　みようかしら。\n@c0@"
  ko: "@a@b%a002010: 평화로워지면\n나도 여기에 가게를\n내 볼까?\n@c0@"
  sl: "@a@b%a002010：我在想，\n　　等和平来临之后，\n　　我要不要也在这里开店。\n@c0@"
  tl: "@a@b%a002010：我在想，\n　　等和平來臨之後，\n　　我要不要也在這裡開店。\n@c0@"
28:
  en: "@a%0%a002020@bWish I'd gotten here sooner!\n@c0@"
  ja: "@a@b%a002020「もっと　早く\n\t来たかったなー。\n@c0@"
  ko: "@a@b%a002020: 좀 더 빨리\n올 걸 그랬어.\n@c0@"
  sl: "@a@b%a002020：要是早点来就好了。\n@c0@"
  tl: "@a@b%a002020：要是早點來就好了。\n@c0@"
29:
  en: "@a%0%a002000@bWhy don't we just buy it? Let's live a little.\n@c0@"
  ja: "@a@b%a002000「たいした　カネじゃないし\n\tとりあえず　買っておいても\n\tいいんじゃないか？\n@c0@"
  ko: "@a@b%a002000: 큰 돈이 드는 것도 아니니까\n일단 사 둬도\n괜찮지 않을까?\n@c0@"
  sl: "@a@b%a002000：花不了几个钱，\n　　不如先买下吧？\n@c0@"
  tl: "@a@b%a002000：花不了幾個錢，\n　　不如先買下吧？\n@c0@"
30:
  en: "@a%0%a002010@bI wonder if that key will open any of the locked doors we've encountered?\n@c0@"
  ja: "@a@b%a002010「この　カギが　あれば\n\tいままでで　開けられなかった場所も\n\t開けられるように　なるのかしら？\n@c0@"
  ko: "@a@b%a002010: 이 열쇠가 있으면\n지금까지 열지 못한 곳도\n열 수 있을까?\n@c0@"
  sl: "@a@b%a002010：有了这把钥匙，\n　　以前不能开的许多门\n　　是不是可以打开了？\n@c0@"
  tl: "@a@b%a002010：有了這把鑰匙，\n　　以前不能開的許多門\n　　是不是可以打開了？\n@c0@"
31:
  en: "@a%0%a002000@bGeh! How humiliatin'.\n@c0@"
  ja: "@a@b%a002000「うっひゃー！\n\tお金が足りないとは　かっこわりいな。\n@c0@"
  ko: "@a@b%a002000: 허억!\n돈이 없다니 체면이 말이 아니군.\n@c0@"
  sl: "@a@b%a002000：哎呀！\n　　钱竟然不够，太丢人了。\n@c0@"
  tl: "@a@b%a002000：哎呀！\n　　錢竟然不夠，太丟人了。\n@c0@"
32:
  en: "@a%0%a002010@bOh dear. What a sorry state...\n@c0@"
  ja: "@a@b%a002010「ちょっと　みじめかも……。\n@c0@"
  ko: "@a@b%a002010: 조금 비참할지도......\n@c0@"
  sl: "@a@b%a002010：有一点凄惨……\n@c0@"
  tl: "@a@b%a002010：有一點淒慘……\n@c0@"
33:
  en: "@a%0%a002020@bBoy, we need to manage our money better...\n@c0@"
  ja: "@a@b%a002020「あたしたちって\n\tけっこう　びんぼう\n\tだったんだね……。\n@c0@"
  ko: "@a@b%a002020: 우리...\n이렇게\n가난했었구나......\n@c0@"
  sl: "@a@b%a002020：我们真是穷到家了……\n@c0@"
  tl: "@a@b%a002020：我們真是窮到家了……\n@c0@"
34:
  en: "@a%0%a002000@bThere won't be any more bazaars if the world ends. Yet another reason to put a stop to Murdaw...\n@c0@"
  ja: "@a@b%a002000「終わって　たまるか！\n\tムドーは　オレたちが\n\tぶっ倒してやるから　安心しな！\n@c0@"
  ko: "@a@b%a002000: 여기서 끝낼 순 없어!\n무도는 우리가\n때려눕힐 테니까 안심해라!\n@c0@"
  sl: "@a@b%a002000：怎么会完蛋啊！\n　　俺们一定会打倒姆多的！\n　　你放心吧！\n@c0@"
  tl: "@a@b%a002000：怎麼會完蛋啊！\n　　俺們一定會打倒姆多的！\n　　你放心吧！\n@c0@"
35:
  en: "@a%0%a002010@bThe bazaar may be over, but this world is not going anywhere.\n@c0@"
  ja: "@a@b%a002010「世界は　終わらないわ。\n\tえいえんに続くものよ。\n@c0@"
  ko: "@a@b%a002010: 세계는 끝나지 않아.\n영원히 이어지는 거야.\n@c0@"
  sl: "@a@b%a002010：世界不会灭亡的。\n　　它会永远存在。\n@c0@"
  tl: "@a@b%a002010：世界不會滅亡的。\n　　它會永遠存在。\n@c0@"
36:
  en: "@a%0%a002020@bThe end is near, alright — for Murdaw!\n@c0@"
  ja: "@a@b%a002020「世界が　終わるなんて\n\tあたしも　信じないもん！\n@c0@"
  ko: "@a@b%a002020: 세계 종말이라니\n나도 안 믿어!\n@c0@"
  sl: "@a@b%a002020：说世界会毁灭，\n　　人家第一个不信！\n@c0@"
  tl: "@a@b%a002020：說世界會毀滅，\n　　人家第一個不信！\n@c0@"
37:
  en: "@a%0%a002000@bSounds like Bill's done playin' second fiddle to his brother at the bazaar.\n@c0@"
  ja: "@a@b%a002000「ボガは　次の勝負で\n\t兄を　こえるつもりだからな。\n@c0@"
  ko: "@a@b%a002000: 보가는 다음 승부에서\n형을 이길 생각이니까.\n@c0@"
  sl: "@a@b%a002000：博珈大概是打算\n　　下次竞争中超过哥哥吧。\n@c0@"
  tl: "@a@b%a002000：博珈大概是打算\n　　下次競爭中超過哥哥吧。\n@c0@"
38:
  en: "@a%0%a002010@bThe bazaar's just finished and he's already planning for the next? That's dedication.\n@c0@"
  ja: "@a@b%a002010「今から　じゅんびなんて\n\t見上げたものだわね。\n@c0@"
  ko: "@a@b%a002010: 벌써부터 준비한다니\n참 대단해.\n@c0@"
  sl: "@a@b%a002010：从现在就开始准备，\n　　真让我钦佩。\n@c0@"
  tl: "@a@b%a002010：從現在就開始準備，\n　　真讓我欽佩。\n@c0@"
39:
  en: "@a%0%a002020@bBoy, there's no way I could plan that far ahead.\n@c0@"
  ja: "@a@b%a002020「あたしには\n\tそんな　計画性ないなあ。\n@c0@"
  ko: "@a@b%a002020: 나는\n그런 계획성은 없는데.\n@c0@"
  sl: "@a@b%a002020：这么有计划性，\n　　我可做不到。\n@c0@"
  tl: "@a@b%a002020：這麼有計劃性，\n　　我可做不到。\n@c0@"
40:
  en: "@a%0%a002000@bTwo Murdaws or twenty — I'm gonna knock 'em all out!\n@c0@"
  ja: "@a@b%a002000「ムドーが　何人いようと\n\tぜんぶ　ぶっ倒すまでよ！\n@c0@"
  ko: "@a@b%a002000: 무도가 몇 놈이 됐든\n모조리 때려눕혀 주마!\n@c0@"
  sl: "@a@b%a002000：不管有多少个姆多，\n　　俺们都会统统打倒的！\n@c0@"
  tl: "@a@b%a002000：不管有多少個姆多，\n　　俺們都會統統打倒的！\n@c0@"
41:
  en: "@a%0%a002010@bRunning away is not the answer. We must stand together to defeat Murdaw.\n@c0@"
  ja: "@a@b%a002010「にげだす　ことはないわ。\n\tみんなで　たたかいましょう。\n@c0@"
  ko: "@a@b%a002010: 절대 도망치지 않아.\n모두 힘을 합쳐 싸우자.\n@c0@"
  sl: "@a@b%a002010：不要逃避。\n　　大家要勇敢地战斗。\n@c0@"
  tl: "@a@b%a002010：不要逃避。\n　　大家要勇敢地戰鬥。\n@c0@"
42:
  en: "@a%0%a002020@bLots of people seem fine with this whole two worlds thing.\n@c0@"
  ja: "@a@b%a002020「世界が　ふたつあることを\n\t知ってる人も　けっこういるんだね。\n@c0@"
  ko: "@a@b%a002020: 세계가 두 개 존재한다는 걸\n아는 사람도 꽤 있구나.\n@c0@"
  sl: "@a@b%a002020：有不少人知道有两个世界呢。\n@c0@"
  tl: "@a@b%a002020：有不少人知道有兩個世界呢。\n@c0@"
43:
  en: "@a%0%a002020@bGuess that's because nobody told 'em this is the dream world...\n@c0@"
  ja: "@a@b%a002020「自分たちが\n\t夢の世界の　住人だ　とまでは\n\t知らないけど……。\n@c0@"
  ko: "@a@b%a002020: 자기들이\n꿈의 세계의 사람이라는\n것까지는 모르지만......\n@c0@"
  sl: "@a@b%a002020：虽然他们可能\n　　不知道自己是\n　　梦世界的居民……\n@c0@"
  tl: "@a@b%a002020：雖然他們可能\n　　不知道自己是\n　　夢世界的居民……\n@c0@"
44:
  en: "@a%0%a002000@bSounds like you've got a real shot with that girl, %a000090.\n@c0@"
  ja: "@a@b%a002000「この娘は　%a000090に\n\tそうとう　感謝してるよな。\n@c0@"
  ko: "@a@b%a002000: 이 아가씨는 %a000090에게\n무척 감사하고 있군.\n@c0@"
