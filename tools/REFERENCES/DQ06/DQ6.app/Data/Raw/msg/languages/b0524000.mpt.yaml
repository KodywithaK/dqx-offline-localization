  en: "@a%0%a002000@bHey %a000090, how about we go and try the place out?\n@c0@"
  ja: "@a@b%a002000「おい　%a000090。\n\tホントに　開けられるか\n\tためしてみろよ。\n@c0@"
  ko: "@a@b%a002000: 이봐, %a000090.\n진짜로 열리는지\n시험해 보자.\n@c0@"
  sl: "@a@b%a002000：喂，%a000090。\n　　到底能不能打开，\n　　咱去试试吧。\n@c0@"
  tl: "@a@b%a002000：喂，%a000090。\n　　到底能不能打開，\n　　咱去試試吧。\n@c0@"
