  ja: "@a@b%3人びとは　あるいは　歌い\nあるいは　おどり　年に１度の\nおまつりに　よいしれた。%4\n@c0@"
  ko: "@a@b타니아: 아, 오빠\n어서 와!\n@c0@"
  sl: "@a@b%3人们载歌载舞，\n完全沉浸在\n一年一度庆典的欢乐气氛中。%4\n@c0@"
  tl: "@a@b%3人們載歌載舞，\n完全沉浸在\n一年一度慶典的歡樂氣氛中。%4\n@c0@"
227:
  en: "@a@b%3Then morning came...%4\n@c0@"
  ja: "@a@b%3そして　夜が　明けた！%4\n@c0@"
  ko: "@a@b타니아: 나, 정령의 사자 역할을\n해서인지 왠지\n피곤해......\n@c0@"
  sl: "@a@b%3然后，天亮了！%4\n@c0@"
  tl: "@a@b%3然後，天亮了！%4\n@c0@"
228:
  en: "@aTania@bOh, you're finally up! I was wondering how long you'd sleep, %a000090.\n@c0@"
  ja: "@a@bターニア「あ　おにいちゃん\n\tやっと　目が　さめた？\n@c0@"
  ko: "@a@b타니아: 오빠도\n잠깐 쉬었다 갈래?\n@c0@"
  sl: "@a@b塔尼娅：啊，哥哥，\n　　你睡醒了？\n@c0@"
  tl: "@a@b塔尼婭：啊，哥哥，\n　　你睡醒了？\n@c0@"
229:
  en: "@aTania@bI shook you and shook you, but you wouldn't budge. You must have been dead tired.\n@c0@"
  ja: "@a@bターニア「いくら　起こしても\n\t起きなくて……。　よっぽど\n\tつかれていたみたいね。\n@c0@"
  ko: "@a@b타니아: 그럼 잘 자.\n@c0@"
  sl: "@a@b塔尼娅：刚才不管怎么叫\n　　你也不醒。\n　　看来你是累坏了。\n@c0@"
  tl: "@a@b塔尼婭：剛才不管怎麼叫\n　　你也不醒。\n　　看來你是累壞了。\n@c0@"
230:
  en: "@aTania@bTee hee! That's my brother, alrighty — ready to conquer the world...after breakfast. Anyway, have fun at the festival.\n@c0@"
  ja: "@a@bターニア「おにいちゃんは\n\tあいかわらず　元気よね。\n\tおまつり　楽しんできてね。\n@c0@"
  ko: "@a@b%3축제는 그날 밤 늦게까지\n성대하게 이어졌다.%4\n@c0@"
  sl: "@a@b塔尼娅：哥哥你还是老样子，\n　　精力那么旺盛。\n　　那就好好享受村祭吧。\n@c0@"
  tl: "@a@b塔尼婭：哥哥你還是老樣子，\n　　精力那麼旺盛。\n　　那就好好享受村祭吧。\n@c0@"
231:
  en: "@aMayor Spindell@bOh, %a000090. Kind of you to stop by, my boy.\n@c0@"
  ja: "@a@b村長「おお　来たか　%a000090。\n@c0@"
  ko: "@a@b%3어떤 이는 노래하고\n어떤 이는 춤을 추면서 해마다 한 번 열리는\n축제를 만끽했다.%4\n@c0@"
  sl: "@a@b村长：哦哦，%a000090你来了。\n@c0@"
  tl: "@a@b村長：哦哦，%a000090你來了。\n@c0@"
232:
  en: "@aMayor Spindell@bI understand you paid a visit to this ‘phantom realm’ earlier?\n@c0@"
  ja: "@a@b村長「じいさまから　聞いたが\n\t%a000090は　まぼろしの大地を\n\t見てきたそうじゃな。\n@c0@"
  ko: "@a@b%3그리고 날이 밝았다!%4\n@c0@"
  sl: "@a@b村长：我听老爷子说，\n　　%a000090你看到梦幻大地了。\n@c0@"
  tl: "@a@b村長：我聽老爺子說，\n　　%a000090你看到夢幻大地了。\n@c0@"
233:
  en: "@aMayor Spindell@bHmm... Between that and the little speech you received at the ceremony, I'd say you're in a rather special situation here.\n@c0@"
  ja: "@a@b村長「ふーむ。　山の精霊さまの\n\tおつげといい　%a000090には\n\tなにかが　あるのかも　しれんな。\n@c0@"
  ko: "@a@b타니아: 아, 오빠.\n이제 일어났어?\n@c0@"
  sl: "@a@b村长：嗯。还有山之精灵的启示，\n　　这些都说明了%a000090\n　　身上有神秘的使命。\n@c0@"
  tl: "@a@b村長：嗯。還有山之精靈的啟示，\n　　這些都說明了%a000090\n　　身上有神秘的使命。\n@c0@"
234:
  en: "@aMayor Spindell@bWell, who am I to stand in the way of destiny? I'll give you special permission to leave the village.\n@c0@"
  ja: "@a@b村長「よし　村長として　%a000090を\n\tこの村から　旅立つことを\n\tゆるそう！\n@c0@"
  ko: "@a@b타니아: 아무리 깨워도\n일어나지 않길래...... 많이\n피곤했던 모양이네?\n@c0@"
  sl: "@a@b村长：好吧，作为一村之长，\n　　我允许%a000090\n　　出村旅行！\n@c0@"
  tl: "@a@b村長：好吧，作為一村之長，\n　　我允許%a000090\n　　出村旅行！\n@c0@"
235:
  en: "@aMayor Spindell@bHere, take this. It's an entry pass into Somnia Castle.\n@c0@"
  ja: "@a@b村長「そして　これは\n\tレイドック城に　入るための\n\t通行証じゃ。　これを　やろう。\n@c0@"
  ko: "@a@b타니아: 오빠는\n항상 힘이 넘치는구나.\n축제, 재미있게 즐기고 와.\n@c0@"
  sl: "@a@b村长：这个是可以出入\n　　雷多克城的通行证，\n　　就把它给你吧。\n@c0@"
  tl: "@a@b村長：這個是可以出入\n　　雷多克城的通行證，\n　　就把它給你吧。\n@c0@"
236:
  en: "@a@b%0%a000090 receives the entry pass!\n@c0@"
  ja: "@a@b%a000090は　つうこうしょうを\n受け取った！\n@c0@"
  ko: "@a@b촌장: 오오, 왔느냐 %a000090.\n@c0@"
  sl: "@a@b%a000090\n收下了通行证！\n@c0@"
  tl: "@a@b%a000090\n收下了通行證！\n@c0@"
237:
  en: "@aMayor Spindell@bTake that to Somnia, and you might just get yourself an audience with King Somnus.\n@c0@"
  ja: "@a@b村長「それが　あれば\n\tレイドック王に　会うことが\n\tできるかもしれん。\n@c0@"
  ko: "@a@b촌장: 영감님께 들었는데\n%a000090 네가 몽환의 대지를\n보고 왔다지?\n@c0@"
  sl: "@a@b村长：有了这个，\n　　说不定就可以\n　　见到雷多克王。\n@c0@"
  tl: "@a@b村長：有了這個，\n　　說不定就可以\n　　見到雷多克王。\n@c0@"
238:
  en: "@aMayor Spindell@bYou're seventeen years old now, lad. It's high time you started making your own way in the world, you betcha!\n@c0@"
  ja: "@a@b村長「おまえも　もう１７才。\n\tそろそろ　自分の行く道を\n\t自分で　決めてもよい年頃じゃ。\n@c0@"
  ko: "@a@b촌장: 으흠. 산의 정령님의\n계시도 그렇고, %a000090 너에게\n뭔가 있는 건지도 모르겠군.\n@c0@"
  sl: "@a@b村长：你已经１７岁了。\n　　是时候决定\n　　自己的人生道路了。\n@c0@"
  tl: "@a@b村長：你已經１７歲了。\n　　是時候決定\n　　自己的人生道路了。\n@c0@"
239:
  en: "@aMayor Spindell@bYou stand at a crossroads, my boy. Choose your path and make us proud.\n@c0@"
  ja: "@a@b村長「気をつけて　ゆくのだぞ。\n@c0@"
  ko: "@a@b촌장: 좋아, 촌장 자격으로 허락하마.\n%a000090, 이 마을에서\n떠나도 좋다!\n@c0@"
  sl: "@a@b村长：路上要小心啊。\n@c0@"
  tl: "@a@b村長：路上要小心啊。\n@c0@"
240:
  en: "@aMayor Spindell@bNo need to hide it, my boy. It's written all over your face, plain as day!\n@c0@"
  ja: "@a@b村長「いや　かくさんでいい。\n\t見てきたと　顔にかいてあるぞ。\n@c0@"
  ko: "@a@b촌장: 그리고 이건\n레이독 성에 들어가기 위한\n통행증이니 받거라.\n@c0@"
  sl: "@a@b村长：算了别瞒着了。\n　　都写在你的脸上了。\n@c0@"
  tl: "@a@b村長：算了別瞞著了。\n　　都寫在你的臉上了。\n@c0@"
241:
  en: "@a@b%3%0%a000090... Can you hear me? It is you whom I seek...%4\n@c0@"
  ja: "@a@b%3%a000090……。\n私の声が　聞こえますね。%4\n@c0@"
  ko: "@a@b%a000090%F0090%X는%Y은%Z 통행증을\n받았다!\n@c0@"
  sl: "@a@b%3%a000090……\n听到我的声音了吧。%4\n@c0@"
  tl: "@a@b%3%a000090……\n聽到我的聲音了吧。%4\n@c0@"
242:
  en: "@a@b%3You were born unto this world with a destiny like no other.%4\n@c0@"
  ja: "@a@b%3%a000090よ……　あなたは\nふしぎな運命を　背負い\n生まれてきた者。%4\n@c0@"
  ko: "@a@b촌장: 그게 있으면\n레이독 왕을 만날 수\n있을지도 모르지.\n@c0@"
  sl: "@a@b%3%a000090……\n你是背负着\n神奇命运的人。%4\n@c0@"
  tl: "@a@b%3%a000090……\n你是背負著\n神奇命運的人。%4\n@c0@"
243:
  en: "@a@b%3Soon, darkness will swallow the land. Your power will be the key to restoring the light.%4\n@c0@"
  ja: "@a@b%3やがて　世界を　闇が　おおう時\nあなたのチカラが\n必要となるでしょう。%4\n@c0@"
  ko: "@a@b촌장: 너도 벌써 17살.\n이제 자신의 길을\n스스로 결정해도 좋을 나이이지.\n@c0@"
  sl: "@a@b%3世间将被黑暗笼罩，\n你的力量\n会有用武之地。%4\n@c0@"
  tl: "@a@b%3世間將被黑暗籠罩，\n你的力量\n會有用武之地。%4\n@c0@"
244:
  en: "@a@b%3Before that happens, you must shatter the Dread Fiend's deceptions...%4\n@c0@"
  ja: "@a@b%3その時が　来るまえに\nときあかすのです。%4\n@c0@"
  ko: "@a@b촌장: 조심해서 가거라.\n@c0@"
  sl: "@a@b%3当时机成熟，\n真相将会大白。%4\n@c0@"
  tl: "@a@b%3當時機成熟，\n真相將會大白。%4\n@c0@"
245:
  en: "@a@b%3You and your companions were but a hair's breadth from upending his misguided ambitions once.%4\n@c0@"
  ja: "@a@b%3あなたたちが　もうすこしで\nうちやぶることが　できたはずの\n魔王のまやかしを……。%4\n@c0@"
  ko: "@a@b촌장: 애써 숨길 필요 없다.\n보고 왔다고 얼굴에 써 있으니.\n@c0@"
  sl: "@a@b%3你们只差一步\n即可打败的魔王，\n解除他的陷阱……%4\n@c0@"
  tl: "@a@b%3你們只差一步\n即可打敗的魔王，\n解除他的陷阱……%4\n@c0@"
246:
  en: "@a@b%3You must succeed! Only then will you be able to rediscover your true self.%4\n@c0@"
  ja: "@a@b%3そして\nあなたの　本当の姿を\nとりもどすのです……！%4\n@c0@"
  ko: "@a@b---점프---> #002700으로\n@c0@"
  sl: "@a@b%3然后\n你也将寻回\n真正的自己……%4\n@c0@"
  tl: "@a@b%3然後\n你也將尋回\n真正的自己……%4\n@c0@"
247:
  en: "@a@b%3Go, %a000090... Go, for it is the destiny you have been given.%4\n@c0@"
  ja: "@a@b%3%a000090よ　旅立ちなさい。\nそれが　あなたに　あたえられた\n使命なのですから……。%4\n@c0@"
  ko: "@a@b%3%a000090......\n제 목소리가 들리시죠?%4\n@c0@"
  sl: "@a@b%3出发吧%a000090。\n这就是你背负的\n神圣使命……%4\n@c0@"
  tl: "@a@b%3出發吧%a000090。\n這就是你背負的\n神聖使命……%4\n@c0@"
248:
  en: "@aBuddy@bH-Holy moly, Tania! It's like you became the mountain spirit herself for a second there!\n@c0@"
  ja: "@a@bランド「す　すげーよ！\n\t本物の　精霊みたいだったよ\n\tターニアちゃん！\n@c0@"
  ko: "@a@b%3%a000090...... 당신은\n불가사의한 운명을 짊어지고\n태어난 자.%4\n@c0@"
  sl: "@a@b兰德：这，真厉害！\n　　简直就是真正的精灵。\n　　塔尼娅妹妹好棒！\n@c0@"
  tl: "@a@b蘭德：這，真厲害！\n　　簡直就是真正的精靈。\n　　塔尼婭妹妹好棒！\n@c0@"
249:
  en: "@aBuddy@bI don't know what the heck you were talkin' about, but still — that was really somethin'!\n@c0@"
  ja: "@a@bランド「……って　いっても\n\tなんの話かは　ぜんぜん\n\tわからなかったけどよ！\n@c0@"
  ko: "@a@b%3머지않아 세상이 어둠으로 뒤덮일 때\n당신의 힘이\n필요할 겁니다.%4\n@c0@"
  sl: "@a@b兰德：……不过，\n　　刚才精灵说了什么，\n　　我完全没听懂啊！\n@c0@"
  tl: "@a@b蘭德：……不過，\n　　剛才精靈說了什麼，\n　　我完全沒聽懂啊！\n@c0@"
250:
  en: "@aPriest@bAnother year, another successful ceremony. Praise be to the Goddess.\n@c0@"
  ja: "@a@b神父「やれやれ　今年も　無事に\n\t精霊の儀式が　できて\n\tよかったよ。\n@c0@"
  ko: "@a@b%3그때가 오기 전에\n밝혀내야 합니다.%4\n@c0@"
  sl: "@a@b神父：哎呀哎呀，今年也\n　　顺利地完成了精灵仪式，\n　　感谢上苍。\n@c0@"
  tl: "@a@b神父：哎呀哎呀，今年也\n　　順利地完成了精靈儀式，\n　　感謝上蒼。\n@c0@"
251:
  en: "@aPriest@bStill, I can't help but wonder what that whole...episode was all about.\n@c0@"
  ja: "@a@b神父「しかし　あれは　いったい\n\tなんだったんじゃろうな……。\n@c0@"
  ko: "@a@b%3당신들이 간발의 차이로\n타파하지 못했던\n마왕의 속임수를......%4\n@c0@"
  sl: "@a@b神父：不过，\n　　刚才到底是怎么回事……\n@c0@"
  tl: "@a@b神父：不過，\n　　剛才到底是怎麼回事……\n@c0@"
252:
  en: "@aPriest@bI have presided over the ceremony for many years, and I've never seen anything remotely like it.\n@c0@"
  ja: "@a@b神父「長年やっているが\n\tあんなことは　はじめてじゃよ。\n@c0@"
  ko: "@a@b%3그리고\n당신의 진짜 모습을\n되찾아야 합니다......!%4\n@c0@"
  sl: "@a@b神父：我主持仪式这些年，\n　　这种事还是第一次见。\n@c0@"
  tl: "@a@b神父：我主持儀式這些年，\n　　這種事還是第一次見。\n@c0@"
253:
  en: "@aPriest@bThe mountain spirit certainly seemed to have an important message for you, my child...\n@c0@"
  ja: "@a@b神父「なにやら　精霊さまが\n\t%a000090に　語りかけとるようだったが……\n@c0@"
  ko: "@a@b%3%a000090, 떠나세요.\n그것이 당신에게 주어진\n사명입니다......%4\n@c0@"
  sl: "@a@b神父：精灵大人似乎\n　　对%a000090说了些什么……\n@c0@"
  tl: "@a@b神父：精靈大人似乎\n　　對%a000090說了些什麼……\n@c0@"
254:
  en: "@aPriest@bPerhaps her words meant something to you that the rest of us were unable to fathom?\n@c0@"
  ja: "@a@b神父「お前さん　なにか\n\t思い当たることは　あるのかな？\n@c0@"
  ko: "@a@b랜드: 괴, 굉장해!\n진짜 정령 같았어.\n타니아!\n@c0@"
  sl: "@a@b神父：你有什么头绪吗？\n@c0@"
  tl: "@a@b神父：你有什麼頭緒嗎？\n@c0@"
255:
  en: "@aPriest@bMm? What's that, my child? You say you had a strange dream earlier?\n@c0@"
  ja: "@a@b神父「うん？　そういえば　変な夢を\n\t見たことが　ある？\n@c0@"
  ko: "@a@b랜드: ......하지만\n무슨 얘기인지는 전혀\n모르겠어!\n@c0@"
  sl: "@a@b神父：嗯？这么说\n　　你做了个怪梦？\n@c0@"
  tl: "@a@b神父：嗯？這麼說\n　　你做了個怪夢？\n@c0@"
256:
  en: "@aPriest@bYou were in an unknown place with a pair of companions, fighting against some sort of terrible monster?\n@c0@"
  ja: "@a@b神父「どこか　わからない場所で\n\t仲間と　魔王に立ち向かう\n\t夢だったとな？\n@c0@"
  ko: "@a@b신부: 휴우, 올해도 무사히\n정령의 의식이 끝나서 다행이야.\n@c0@"
  sl: "@a@b神父：在某个城堡里\n　　跟伙伴一起大战魔王，\n　　是这样吗？\n@c0@"
  tl: "@a@b神父：在某個城堡裡\n　　跟夥伴一起大戰魔王，\n　　是這樣嗎？\n@c0@"
257:
  en: "@aPriest@bHmm... Surely the Goddess wouldn't allow such misfortune. Not with the peace we enjoy today.\n@c0@"
  ja: "@a@b神父「う～む。　しかし　この平和な世界で\n\tそんなことが　起こるとも\n\t思えないがのう……。\n@c0@"
  ko: "@a@b신부: 그나저나 그건\n대체 뭐였을까......\n@c0@"
  sl: "@a@b神父：嗯。不过世界如此和平，\n　　要说会有这样的事情，\n　　我实在是不敢相信……\n@c0@"
  tl: "@a@b神父：嗯。不過世界如此和平，\n　　要說會有這樣的事情，\n　　我實在是不敢相信……\n@c0@"
258:
  en: "@aPriest@bAh, well. There's no use fretting over it now. Go, my child, and join the others in their revelry.\n@c0@"
