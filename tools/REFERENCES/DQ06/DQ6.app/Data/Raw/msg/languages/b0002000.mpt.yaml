0:
  en: "@a@b*: Welcome to Haggleton. The bazaar's dwindling down, but don't let that stop you shopping!\n@c0@"
  ja: "@a@b＊「ようこそ　マルシェの町へ。\n\tそろそろ　バザーも　おわりよ。\n@c0@"
  ko: "@a@b*: 마르셰 마을에 어서 와.\n슬슬 장터도 끝나가네.\n@c0@"
  sl: "@a@b＊：欢迎来到玛尔谢镇。\n　　集市马上要结束了。\n@c0@"
  tl: "@a@b＊：歡迎來到瑪爾謝鎮。\n　　集市馬上要結束了。\n@c0@"
1:
  en: "@a@b*: I got a hot shoppin' tip for ya, bub: don't buy from the first place ya visit.\n@c0@"
  ja: "@a@b＊「なにか買うときは\n\t最初に入った店で　いきなり\n\t買っちゃ　ダメだ。\n@c0@"
  ko: "@a@b*: 물건을 살 때는\n처음에 들어간 가게에서\n덥석 사면 안 돼.\n@c0@"
  sl: "@a@b＊：购物的时候，\n　　看到想要的东西，\n　　别急着买。\n@c0@"
  tl: "@a@b＊：購物的時候，\n　　看到想要的東西，\n　　別急著買。\n@c0@"
2:
  en: "@a@b*: You're guaranteed to find the same item for less at the next stall down. Happens every time!\n@c0@"
  ja: "@a@b＊「もしかしたら　同じものを\n\tもっと　安く　売っている店が\n\tあるかも　しれないからな。\n@c0@"
  ko: "@a@b*: 혹시나 같은 물건을\n더 싸게 파는 가게가\n있을지도 모르거든.\n@c0@"
  sl: "@a@b＊：说不定别处还有\n　　同样的东西，\n　　而且更便宜。\n@c0@"
  tl: "@a@b＊：說不定別處還有\n　　同樣的東西，\n　　而且更便宜。\n@c0@"
3:
  en: "@a@b*: Savvy shoppers scout out all the shops for the best deals. The same goes for when you're trying to sell things too. \n@c0@"
  ja: "@a@b＊「安く買いたいなら　歩く！\n\tこれは　売りのときも　同じだ。\n\tおぼえておきな。\n@c0@"
  ko: "@a@b*: 싸게 사고 싶으면 발품을 판다!\n이건 물건을 팔 때도 마찬가지지.\n꼭 기억해 두도록 해.\n@c0@"
  sl: "@a@b＊：买东西就是要货比三家！\n　　卖东西的时候也是这个原则。\n　　好好记住吧。\n@c0@"
  tl: "@a@b＊：買東西就是要貨比三家！\n　　賣東西的時候也是這個原則。\n　　好好記住吧。\n@c0@"
4:
  en: "@a@b*: Next year I'll skip breakfast and get here early enough to snag a better spot. Anyway...\n@c0@"
  ja: "@a@b＊「今年は　こんな場所でしたが\n\t来年こそ　いい場所をとりますよ。\n\tさてと……。\n@c0@"
  ko: "@a@b*: 올해는 이런 곳이었지만\n내년에는 꼭 좋은 자리를 잡을 겁니다.\n그런데......\n@c0@"
  sl: "@a@b＊：今年没抢占到好位置，\n　　明年一定抢占一个好位置。\n　　那么……\n@c0@"
  tl: "@a@b＊：今年沒搶佔到好位置，\n　　明年一定搶佔一個好位置。\n　　那麼……\n@c0@"
