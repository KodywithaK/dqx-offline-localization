  tl: "@a@b%a002050：不要勉強啊……\n　　雖然這麼說，要是他\n　　什麼時候又逃走了，那真傷腦筋啊。\n@c0@"
96:
  en: "@a%0%a002000@bYou heard the King. Let's finish this up 'n' everything like that.\n@c0@"
  ja: "@a@b%a002000「王さまに　たのまれちゃ\n\tしょうがない。\n\tもう　ひとがんばり　してくるか！\n@c0@"
  ko: "@a@b%a002000: 왕의 부탁을 받은 이상\n어쩔 수 없군.\n조금만 더 힘내 보자고!\n@c0@"
  sl: "@a@b%a002000：既然国王陛下拜托咱，\n　　那就没办法了。\n　　再努力一把吧！\n@c0@"
  tl: "@a@b%a002000：既然國王陛下拜託咱，\n　　那就沒辦法了。\n　　再努力一把吧！\n@c0@"
97:
  en: "@a%0%a002010@bLet's try not to disappoint the King.\n@c0@"
  ja: "@a@b%a002010「王さまの\n\t期待を　かなえられるよう\n\tがんばりましょうね。\n@c0@"
  ko: "@a@b%a002010: 폐하의\n기대를 저버리지 않도록\n열심히 하자.\n@c0@"
  sl: "@a@b%a002010：加油吧，\n　　不要辜负国王陛下的期待。\n@c0@"
  tl: "@a@b%a002010：加油吧，\n　　不要辜負國王陛下的期待。\n@c0@"
98:
  en: "@a%0%a002020@bPrince Howard is pretty respectful towards his father, huh?\n@c0@"
  ja: "@a@b%a002020「それにしても　ホルスって\n\t親の前では　めちゃめちゃ\n\tおぎょうぎが　いいのねー。\n@c0@"
  ko: "@a@b%a002020: 그나저나 홀스는\n부모님 앞에서는 정말\n예의가 바르네~\n@c0@"
  sl: "@a@b%a002020：不过荷尔斯\n　　在父母面前还真是个\n　　懂礼貌的好孩子啊。\n@c0@"
  tl: "@a@b%a002020：不過荷爾斯\n　　在父母面前還真是個\n　　懂禮貌的好孩子啊。\n@c0@"
99:
  en: "@a%0%a002030@bIt would appear that Prince Howard really is endeavouring to make his father proud.\n@c0@"
  ja: "@a@b%a002030「あと　すこし……\n\t本人が　そう言ってるのだから\n\tまちがいないのでしょうね。\n@c0@"
  ko: "@a@b%a002030: 얼마 남지 않았다고......\n본인이 한 말이니\n틀림없겠지요.\n@c0@"
  sl: "@a@b%a002030：还差一步……\n　　本人都这么说了，\n　　不会有错吧。\n@c0@"
  tl: "@a@b%a002030：還差一步……\n　　本人都這麼說了，\n　　不會有錯吧。\n@c0@"
100:
  en: "@a%0%a002050@bSo the King's called Howell, his son's Howard, and the kingdom's Howcastle...\n@c0@"
  ja: "@a@b%a002050「ところで　ホルテン王さまって\n\tホルが　みょうじで　テンが名前\n\tなんでしょうか。\n@c0@"
  ko: "@a@b%a002050: 그나저나 홀텐 왕은\n'홀'이 성이고 '텐'이 이름인\n걸까요?\n@c0@"
  sl: "@a@b%a002050：话说回来，\n　　荷尔顿国王陛下是\n　　姓荷尔名顿吗？\n@c0@"
  tl: "@a@b%a002050：話說回來，\n　　荷爾頓國王陛下是\n　　姓荷爾名頓嗎？\n@c0@"
101:
  en: "@a%0%a002050@bThat's right, isn't it? Old %a002050 is gettin' the hang of this at last!\n@c0@"
  ja: "@a@b%a002050「あ　でも　そうすると\n\t王子の名前が　ス　だけに\n\tなっちゃうから　ちがいますね。\n@c0@"
  ko: "@a@b%a002050: 아, 하지만 그러면\n왕자의 이름에 '스'만 남게 되니까\n아니겠군요.\n@c0@"
  sl: "@a@b%a002050：这么想的话，\n　　王子的名字就是斯这个字了。\n　　不过应该不是这样的吧。\n@c0@"
  tl: "@a@b%a002050：這麼想的話，\n　　王子的名字就是斯這個字了。\n　　不過應該不是這樣的吧。\n@c0@"
102:
  en: "@a%0%a002000@bShe recognised the Prince straight away, aye?\n@c0@"
  ja: "@a@b%a002000「ホルス王子は\n\tこの　ホルコッタの村でも\n\tよく　知られているんだな。\n@c0@"
  ko: "@a@b%a002000: 홀스 왕자는\n이 홀코타 마을에도\n잘 알려져 있군.\n@c0@"
  sl: "@a@b%a002000：荷尔克塔村的人\n　　也都知道荷尔斯王子啊。\n@c0@"
  tl: "@a@b%a002000：荷爾克塔村的人\n　　也都知道荷爾斯王子啊。\n@c0@"
103:
  en: "@a%0%a002010@bHmm, the Prince must visit here from time to time.\n@c0@"
  ja: "@a@b%a002010「きっと　王子は\n\tときどき　この村に\n\t来ているのでしょう。\n@c0@"
  ko: "@a@b%a002010: 아마 왕자는\n가끔 이 마을에\n오나 봐.\n@c0@"
  sl: "@a@b%a002010：王子一定\n　　时不时就跑到\n　　这个村子来吧。\n@c0@"
  tl: "@a@b%a002010：王子一定\n　　時不時就跑到\n　　這個村子來吧。\n@c0@"
104:
  en: "@a%0%a002020@bWow. The villagers show him the proper respect, at least. Guess a prince is still a prince.\n@c0@"
  ja: "@a@b%a002020「さすがは　王子さま。\n\t村の人の　あいさつも\n\tていねいね。\n@c0@"
  ko: "@a@b%a002020: 역시 왕자네.\n마을 사람들도\n공손하게 인사하고 있어.\n@c0@"
  sl: "@a@b%a002020：不愧是王子殿下。\n　　村里人跟他打招呼\n　　都客客气气的。\n@c0@"
  tl: "@a@b%a002020：不愧是王子殿下。\n　　村裡人跟他打招呼\n　　都客客氣氣的。\n@c0@"
105:
  en: "@a%0%a002030@bEven the humblest citizen of Howsworth boasts impeccable manners.\n@c0@"
  ja: "@a@b%a002030「この国は\n\t村の娘さんまで　おぎょうぎが\n\tしっかりしていますね。\n@c0@"
  ko: "@a@b%a002030: 이 나라는\n시골 소녀까지도 예의가\n바르군요.\n@c0@"
  sl: "@a@b%a002030：这个国家\n　　连村子里的小姑娘\n　　都很有礼貌呢。\n@c0@"
  tl: "@a@b%a002030：這個國家\n　　連村子裡的小姑娘\n　　都很有禮貌呢。\n@c0@"
106:
  en: "@a%0%a002050@bIf she only knew what we had to go through to get him here...\n@c0@"
  ja: "@a@b%a002050「たぶん　王子の\n\tごきげんは　まあまあ……\n\tのはずです。\n@c0@"
  ko: "@a@b%a002050: 제가 알기로\n아마 왕자님의 기분은\n그저 그럴 겁니다......\n@c0@"
  sl: "@a@b%a002050：王子的精神状态\n　　可能就一般般吧……\n@c0@"
  tl: "@a@b%a002050：王子的精神狀態\n　　可能就一般般吧……\n@c0@"
107:
  en: "@a%0%a002000@bEven this fella recognises the Prince, aye? Funny.\n@c0@"
  ja: "@a@b%a002000「こんな　おっさんにまで\n\tホルス王子の　顔は\n\t知られているんだな。\n@c0@"
  ko: "@a@b%a002000: 이런 아저씨한테까지\n홀스 왕자의 얼굴이\n알려져 있군.\n@c0@"
  sl: "@a@b%a002000：连这个大叔\n　　都能认出\n　　荷尔斯王子的脸啊。\n@c0@"
  tl: "@a@b%a002000：連這個大叔\n　　都能認出\n　　荷爾斯王子的臉啊。\n@c0@"
108:
  en: "@a%0%a002010@bI'm sure the Prince would be useless at farm work.\n@c0@"
  ja: "@a@b%a002010「いがいと　王子は\n\t人気者なのかしら。\n@c0@"
  ko: "@a@b%a002010: 왕자는 의외로\n인기인인가?\n@c0@"
  sl: "@a@b%a002010：没想到王子\n　　还挺受欢迎的呢。\n@c0@"
  tl: "@a@b%a002010：沒想到王子\n　　還挺受歡迎的呢。\n@c0@"
109:
  en: "@a%0%a002020@bPrince Howard isn't the same blabbermouth here as he was back at the castle, huh?\n@c0@"
  ja: "@a@b%a002020「ホルス王子\n\tお城に　いるときほど\n\tここでは　しゃべらないのね。\n@c0@"
  ko: "@a@b%a002020: 홀스 왕자,\n여기선 성에 있을 때만큼은\n말을 안 하네.\n@c0@"
  sl: "@a@b%a002020：荷尔斯王子\n　　在这里没有\n　　在城里的时候话多啊。\n@c0@"
  tl: "@a@b%a002020：荷爾斯王子\n　　在這裡沒有\n　　在城裡的時候話多啊。\n@c0@"
110:
  en: "@a%0%a002030@bI imagine the people of Howsworth are wondering why we're with their Prince.\n@c0@"
  ja: "@a@b%a002030「私たちと　いっしょに\n\tホルス王子が　いたので　\n\tビックリしたのでしょうかね。\n@c0@"
  ko: "@a@b%a002030: 홀스 왕자가\n우리와 함께 있어서\n놀란 걸까요?\n@c0@"
  sl: "@a@b%a002030：看到我们跟\n　　荷尔斯王子在一起，\n　　一定很吃惊吧。\n@c0@"
  tl: "@a@b%a002030：看到我們跟\n　　荷爾斯王子在一起，\n　　一定很吃驚吧。\n@c0@"
111:
  en: "@a%0%a002050@bWith his fancy royal clothes, you can see the Prince comin' a mile off.\n@c0@"
  ja: "@a@b%a002050「うしろにいても\n\t目立つカッコウ　してるから\n\tすぐに　わかるんですね。\n@c0@"
  ko: "@a@b%a002050: 뒤에 있어도\n눈에 띄는 복장이니\n금방 알 수 있나 보군요.\n@c0@"
  sl: "@a@b%a002050：即使跟在身后，\n　　样子也很引人注目呢。\n　　一看就会知道吧。\n@c0@"
  tl: "@a@b%a002050：即使跟在身後，\n　　樣子也很引人注目呢。\n　　一看就會知道吧。\n@c0@"
112:
  en: "@a%0%a002050@bOld %a002050 has just stepped in something squidgy...\n@c0@"
  ja: "@a@b%a002050「あ…　いま　私……\n\tなにか　あたたかいモノを\n\tふみました……。\n@c0@"
  ko: "@a@b%a002050: 아... 지금 저......\n뭔가 뜨뜻한 물체를\n밟았습니다......\n@c0@"
  sl: "@a@b%a002050：啊……刚才我……\n　　是不是踩到了个\n　　什么温暖的东西……\n@c0@"
  tl: "@a@b%a002050：啊……剛才我……\n　　是不是踩到了個\n　　什麼溫暖的東西……\n@c0@"
113:
  en: "@a%0%a002000@bAye, nothin' to fear — not with me on the job.\n@c0@"
  ja: "@a@b%a002000「メチャメチャ　気になる\n\t笑いかた　だったぜ……。\n@c0@"
  ko: "@a@b%a002000: 저 웃음소리\n엄청나게 신경 쓰이는군......\n@c0@"
  sl: "@a@b%a002000：俺真在意\n　　这个笑声……\n@c0@"
  tl: "@a@b%a002000：俺真在意\n　　這個笑聲……\n@c0@"
114:
  en: "@a%0%a002010@bEveryone seems surprised that Howard is going to the cave...\n@c0@"
  ja: "@a@b%a002010「王子が　洞くつに行くのは\n\tそれほど　みんなが　おどろく\n\tできごとなのね。\n@c0@"
  ko: "@a@b%a002010: 왕자가 동굴에 가는 건\n저렇게 모두가 놀랄 만한\n일인가 보구나.\n@c0@"
  sl: "@a@b%a002010：王子要去洞窟了，\n　　大家就这么吃惊么？\n@c0@"
  tl: "@a@b%a002010：王子要去洞窟了，\n　　大家就這麼吃驚麼？\n@c0@"
115:
  en: "@a%0%a002020@bI've got a bad feeling about this...\n@c0@"
  ja: "@a@b%a002020「なーんか　いやな\n\t予感……。\n@c0@"
  ko: "@a@b%a002020: 왠지 안 좋은\n예감이......\n@c0@"
  sl: "@a@b%a002020：好像有不好的预感……\n@c0@"
  tl: "@a@b%a002020：好像有不好的預感……\n@c0@"
116:
  en: "@a%0%a002030@bShe tried to hide it, but she was surprised to see the Prince heading to the cave.\n@c0@"
  ja: "@a@b%a002030「あとで　ごまかしてたけど\n\tそうとう　おどろいて　ましたね……。\n@c0@"
  ko: "@a@b%a002030: 금방 말을 덧붙이긴 했지만\n상당히 놀라는 눈치군요......\n@c0@"
  sl: "@a@b%a002030：虽然是敷衍过去了，\n　　但是这人还是很吃惊呢……\n@c0@"
  tl: "@a@b%a002030：雖然是敷衍過去了，\n　　但是這人還是很吃驚呢……\n@c0@"
117:
  en: "@a%0%a002050@bOld %a002050 can't wait to see this cave!\n@c0@"
  ja: "@a@b%a002050「まさかっ　て\n\t言われちゃいましたよ！\n\tまさかっ　て！\n@c0@"
  ko: "@a@b%a002050: 아니, 세상에\n설마가 웬 말입니까!\n설마가!\n@c0@"
  sl: "@a@b%a002050：他刚才说了\n　　难道这个词啊！\n　　他说难道了啊！\n@c0@"
  tl: "@a@b%a002050：他剛才說了\n　　難道這個詞啊！\n　　他說難道了啊！\n@c0@"
118:
  en: "@a%0%a002000@bIs he snorin', or did somethin' crawl up his nose?\n@c0@"
  ja: "@a@b%a002000「すげえ　いびきだぜ！\n@c0@"
  ko: "@a@b%a002000: 코골이 소리 한번 엄청나군!\n@c0@"
  sl: "@a@b%a002000：这鼾声真响！\n@c0@"
  tl: "@a@b%a002000：這鼾聲真響！\n@c0@"
119:
  en: "@a%0%a002010@bSnoring like a drain... He must be tired after a long journey or something.\n@c0@"
  ja: "@a@b%a002010「昼間から　たかいびき。\n\tよっぽどの　長旅で\n\tつかれて　いるのかしら。\n@c0@"
  ko: "@a@b%a002010: 대낮부터 코를 골며 자네.\n오랜 여행 때문에\n지친 걸까?\n@c0@"
  sl: "@a@b%a002010：大白天就\n　　鼾声震天响。\n　　一定是长途跋涉累了吧。\n@c0@"
  tl: "@a@b%a002010：大白天就\n　　鼾聲震天響。\n　　一定是長途跋涉累了吧。\n@c0@"
120:
  en: "@a%0%a002020@bAsleep at this hour? What is he, nocturnal?\n@c0@"
  ja: "@a@b%a002020「いまから　ねてたら\n\t夜になってから　目が\n\tギンギラギンに　なっちゃうよね。\n@c0@"
  ko: "@a@b%a002020: 지금부터 자면\n밤에 눈이\n말똥말똥할 텐데.\n@c0@"
  sl: "@a@b%a002020：现在就睡的话，\n　　晚上会困意全无的哦。\n@c0@"
  tl: "@a@b%a002020：現在就睡的話，\n　　晚上會睏意全無的哦。\n@c0@"
121:
  en: "@a%0%a002030@bWe should leave him to his slumber.\n@c0@"
  ja: "@a@b%a002030「よく　お休みです。\n\tそっと　しておいて　あげましょう。\n@c0@"
  ko: "@a@b%a002030: 깊이 잠든 모양이군요.\n푹 쉬도록 내버려둡시다.\n@c0@"
  sl: "@a@b%a002030：好好休息吧。\n　　我们就不要打扰他了。\n@c0@"
  tl: "@a@b%a002030：好好休息吧。\n　　我們就不要打擾他了。\n@c0@"
122:
  en: "@a%0%a002050@bThat's some impressive snorin', I tell you!\n@c0@"
  ja: "@a@b%a002050「たしかに　自分で\n\tずこおーって　言うほどの\n\tすごい　いびきですよね。\n@c0@"
  ko: "@a@b%a002050: 저렇게 코를 골면\n자다가 놀라서\n깨는 거 아닌가 모르겠군요.\n@c0@"
  sl: "@a@b%a002050：这鼾声的确\n　　很厉害啊。\n@c0@"
  tl: "@a@b%a002050：這鼾聲的確\n　　很厲害啊。\n@c0@"
123:
  en: "@a%0%a002000@bWhoa. As sick as he looked, he woke right up for the Prince.\n@c0@"
  ja: "@a@b%a002000「じいさん　病気で\n\t悪そうなのに　王子を見たら\n\t起きあがったぜ！\n@c0@"
  ko: "@a@b%a002000: 영감님, 몸도\n안 좋을 텐데 왕자를 보더니\n몸을 번쩍 일으켰어!\n@c0@"
  sl: "@a@b%a002000：老爷爷明明病得这么重，\n　　可是一看到王子，\n　　还是立刻就起身了呢！\n@c0@"
  tl: "@a@b%a002000：老爺爺明明病得這麼重，\n　　可是一看到王子，\n　　還是立刻就起身了呢！\n@c0@"
124:
  en: "@a%0%a002010@bThat was suspiciously polite for Prince Howard...\n@c0@"
  ja: "@a@b%a002010「ホコリっていうのは\n\t王子なりの　やさしい表現……。\n\tおじいさんには　わかるのね。\n@c0@"
  ko: "@a@b%a002010: 먼지라고 표현한 건\n왕자 나름의 배려겠지......\n할아버지는 그걸 아시는 거야.\n@c0@"
  sl: "@a@b%a002010：王子说要生气了什么的\n　　其实是他温柔的表现吧……\n　　老爷爷也明白这一点。\n@c0@"
  tl: "@a@b%a002010：王子說要生氣了什麼的\n　　其實是他溫柔的表現吧……\n　　老爺爺也明白這一點。\n@c0@"
125:
  en: "@a%0%a002020@bThe villagers around here show the Prince waaay too much respect if you ask me.\n@c0@"
  ja: "@a@b%a002020「何にしても\n\t王子は　すなおな　言い方が\n\tできないみたいね……。\n@c0@"
  ko: "@a@b%a002020: 이런 상황에서도 왕자는\n자기 기분을 솔직하게\n말하지 못하나 보네......\n@c0@"
  sl: "@a@b%a002020：不管怎样，\n　　王子说话总是\n　　心口不一呢……\n@c0@"
  tl: "@a@b%a002020：不管怎樣，\n　　王子說話總是\n　　心口不一呢……\n@c0@"
126:
  en: "@a%0%a002030@bWord of the royal rite of purification has reached even this man's sickbed.\n@c0@"
  ja: "@a@b%a002030「洗礼のぎしきの話\n\tもう　このかたの　耳にも\n\t届いていたのですね。\n@c0@"
