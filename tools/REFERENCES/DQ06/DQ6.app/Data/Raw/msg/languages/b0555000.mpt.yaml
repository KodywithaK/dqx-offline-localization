  ko: "@a@b%a002020: 나 왠지\n가슴이 찡해......\n@c0@"
  sl: "@a@b%a002020：人家稍微\n　　被感动到了呢……\n@c0@"
  tl: "@a@b%a002020：人家稍微\n　　被感動到了呢……\n@c0@"
78:
  en: "@a%0%a002030@bPerhaps the Queen was correct in her assessment of the Prince.\n@c0@"
  ja: "@a@b%a002030「王妃さまが　ホルスは\n\tやさしい子だって　おっしゃって\n\tいたのを　思い出しました。\n@c0@"
