0:
  en: "@a%0%a002000@bKeep an eye on him! He's one slippery prince!\n@c0@"
  ja: "@a@b%a002000「もう　にげないという\n\tほしょうは　どこにも　ないから\n\tしっかり　見ていような！\n@c0@"
  ko: "@a@b%a002000: 또 도망치지 않으리라는\n보장은 없으니까\n똑바로 보고 있자고!\n@c0@"
  sl: "@a@b%a002000：一点都不相信\n　　他不会再逃跑了。\n　　好好看着他吧！\n@c0@"
  tl: "@a@b%a002000：一點都不相信\n　　他不會再逃跑了。\n　　好好看著他吧！\n@c0@"
1:
  en: "@a%0%a002010@bIt looks like we're finally ready to head for Hallowed Hollow.\n@c0@"
  ja: "@a@b%a002010「いよいよ　めざすは\n\t洗礼の洞くつ　ね。\n@c0@"
  ko: "@a@b%a002010: 드디어 세례의 동굴을\n향해 출발할 수 있겠네.\n@c0@"
  sl: "@a@b%a002010：终于可以\n　　前往洗礼洞窟了呢。\n@c0@"
  tl: "@a@b%a002010：終於可以\n　　前往洗禮洞窟了呢。\n@c0@"
2:
  en: "@a%0%a002020@bHe is NOT — I repeat, NOT — getting away from me this time!\n@c0@"
  ja: "@a@b%a002020「もう　ぜっ……\n\t……ったいに\n\tにがさないんだから！！\n@c0@"
  ko: "@a@b%a002020: 이제 절......\n......대로\n안 놓칠 거야!!\n@c0@"
  sl: "@a@b%a002020：绝对不会\n　　再让他溜走了！！\n@c0@"
  tl: "@a@b%a002020：絕對不會\n　　再讓他溜走了！！\n@c0@"
3:
  en: "@a%0%a002030@bOur tedious game of hide-and-seek is finally over. ...Right?\n@c0@"
  ja: "@a@b%a002030「ようやく\n\t出発できますね！\n\t……たぶん。\n@c0@"
  ko: "@a@b%a002030: 드디어\n출발할 수 있겠군요!\n......아마도.\n@c0@"
  sl: "@a@b%a002030：终于可以出发了！\n　　……大概是这样吧。\n@c0@"
  tl: "@a@b%a002030：終於可以出發了！\n　　……大概是這樣吧。\n@c0@"
4:
  en: "@a%0%a002050@bTime to head off — and not a moment too soon!\n@c0@"
  ja: "@a@b%a002050「これで　ようやく\n\tフリダシ　なんですね……。\n@c0@"
  ko: "@a@b%a002050: 이제 겨우\n처음으로 돌아왔네요......\n@c0@"
  sl: "@a@b%a002050：这下终于\n　　迈出第一步了……\n@c0@"
  tl: "@a@b%a002050：這下終於\n　　邁出第一步了……\n@c0@"
5:
  en: "@a%0%a002000@bEven I picked up on that soldier's sarcasm.\n@c0@"
  ja: "@a@b%a002000「兵士のていねいな\n\tあいさつが　いやみっぽく\n\t聞こえるのは　気のせいか？\n@c0@"
  ko: "@a@b%a002000: 병사의 정중한\n인사가 왠지 비아냥거리는 걸로\n들리는 건 기분 탓인가?\n@c0@"
  sl: "@a@b%a002000：士兵这么热心地打招呼，\n　　听起来怎么带着刺啊。\n　　是俺的错觉吗？\n@c0@"
  tl: "@a@b%a002000：士兵這麼熱心地打招呼，\n　　聽起來怎麼帶著刺啊。\n　　是俺的錯覺嗎？\n@c0@"
6:
  en: "@a%0%a002010@bOh dear, the Prince appears to be in a foul mood...\n@c0@"
  ja: "@a@b%a002010「まあまあっていうか……\n\tどう　みても　王子は\n\tごきげん　ななめよね。\n@c0@"
  ko: "@a@b%a002010: 그저 그렇기는......\n아무리 봐도 왕자는\n심기가 불편해 보이는걸.\n@c0@"
  sl: "@a@b%a002010：虽然回答一般般……\n　　但是王子明显\n　　情绪不好啊。\n@c0@"
  tl: "@a@b%a002010：雖然回答一般般……\n　　但是王子明顯\n　　情緒不好啊。\n@c0@"
7:
  en: "@a%0%a002020@bOne minute we're the Prince's royal pursuers, the next we're his royal attendants. Isn't that funny?\n@c0@"
  ja: "@a@b%a002020「そうか　あたしたちは今\n\tホルス王子と　その　ご一行さま\n\t……なのね。\n@c0@"
  ko: "@a@b%a002020: 그렇구나. 우리는 지금\n홀스 왕자님과\n그 일행......이구나.\n@c0@"
  sl: "@a@b%a002020：只和王子说话，\n　　也就是说我们现在只是\n　　这个荷尔斯王子的跟班了吧……\n@c0@"
  tl: "@a@b%a002020：只和王子說話，\n　　也就是說我們現在只是\n　　這個荷爾斯王子的跟班了吧……\n@c0@"
8:
  en: "@a%0%a002030@bWhat is next for us, I wonder?\n@c0@"
  ja: "@a@b%a002030「さあて　これから\n\tどうしましょうか。\n@c0@"
  ko: "@a@b%a002030: 자, 이제\n어떻게 할까요?\n@c0@"
  sl: "@a@b%a002030：那么接下来\n　　怎么办呢？\n@c0@"
  tl: "@a@b%a002030：那麼接下來\n　　怎麼辦呢？\n@c0@"
9:
  en: "@a%0%a002050@bThis Prince Howard needs to mind his manners.\n@c0@"
  ja: "@a@b%a002050「いくら　家来でも\n\tあいさつされて\n\tふん！　は　ないでしょう……。\n@c0@"
  ko: "@a@b%a002050: 아무리 신하라도\n인사를 하는데\n흥! 이라니요......\n@c0@"
  sl: "@a@b%a002050：就算是家臣 ，\n　　人家跟你打招呼的时候\n　　你也不能就哼一声吧……\n@c0@"
  tl: "@a@b%a002050：就算是家臣 ，\n　　人家跟你打招呼的時候\n　　你也不能就哼一聲吧……\n@c0@"
10:
  en: "@a%0%a002000@bSmoothly? I wouldn't bet on it with this prince...\n@c0@"
  ja: "@a@b%a002000「またも……？\n\tそんな　いいかたすると　王子が\n\tへそを　まげちまうぜ。\n@c0@"
  ko: "@a@b%a002000: 또......?\n그렇게 말하면 왕자가\n토라질 텐데.\n@c0@"
  sl: "@a@b%a002000：又？\n　　说这话的话，\n　　王子又要闹情绪了。\n@c0@"
  tl: "@a@b%a002000：又？\n　　說這話的話，\n　　王子又要鬧情緒了。\n@c0@"
11:
  en: "@a%0%a002010@bHe must suspect that the Prince will run off again... \n@c0@"
  ja: "@a@b%a002010「この人は　王子が\n\tきっと　また　にげてくると\n\t思っているんじゃないかしら。\n@c0@"
  ko: "@a@b%a002010: 이 사람은 왕자가\n분명히 또 도망칠 거라고\n생각하는 거 아닐까?\n@c0@"
  sl: "@a@b%a002010：这个人\n　　一定以为王子\n　　又会逃跑吧。\n@c0@"
  tl: "@a@b%a002010：這個人\n　　一定以為王子\n　　又會逃跑吧。\n@c0@"
12:
  en: "@a%0%a002020@bBetween the Prince and the cave monsters, we're going to have our hands full.\n@c0@"
  ja: "@a@b%a002020「私たちも　気を\n\tつけましょうね。\n\t洞くつのまものと　王子さまに！\n@c0@"
  ko: "@a@b%a002020: 우리도\n조심하자.\n동굴의 마물과 왕자를!\n@c0@"
  sl: "@a@b%a002020：我们也小心一点吧。\n　　不管是洞窟里的魔物\n　　还是王子殿下！\n@c0@"
  tl: "@a@b%a002020：我們也小心一點吧。\n　　不管是洞窟裡的魔物\n　　還是王子殿下！\n@c0@"
13:
  en: "@a%0%a002030@bShall we head to Hallowed Hollow?\n@c0@"
  ja: "@a@b%a002030「さあて\n\t洗礼の洞くつに\n\t向かいましょうか。\n@c0@"
  ko: "@a@b%a002030: 자,\n세례의 동굴로\n가 볼까요.\n@c0@"
  sl: "@a@b%a002030：那我们就\n　　前往洗礼洞窟吧。\n@c0@"
  tl: "@a@b%a002030：那我們就\n　　前往洗禮洞窟吧。\n@c0@"
14:
  en: "@a%0%a002050@bIt'd be nice if these guards hailed us once in a while!\n@c0@"
  ja: "@a@b%a002050「兵隊さん　私たちにも\n\t声かけて　ほしいですね。\n\tどうか王子にお気をつけて　とか。\n@c0@"
  ko: "@a@b%a002050: 병사님, 우리한테도\n말씀 좀 걸어 줬으면 좋겠네요.\n부디 왕자님을 조심하라든가.\n@c0@"
  sl: "@a@b%a002050：真希望士兵们也能\n　　跟我们说说话啊。\n　　比如请小心王子之类的。\n@c0@"
  tl: "@a@b%a002050：真希望士兵們也能\n　　跟我們說說話啊。\n　　比如請小心王子之類的。\n@c0@"
15:
  en: "@a%0%a002000@bHardy har! Some pep talk, aye?\n@c0@"
  ja: "@a@b%a002000「コイツには\n\t話しかけないほうが\n\tよかったかな……。\n@c0@"
  ko: "@a@b%a002000: 이 녀석에게는\n말을 걸지 말걸\n그랬나......\n@c0@"
  sl: "@a@b%a002000：要是没跟\n　　这人说话会好点吧。\n@c0@"
  tl: "@a@b%a002000：要是沒跟\n　　這人說話會好點吧。\n@c0@"
16:
  en: "@a%0%a002010@bHis concern for his prince is quite genuine.\n@c0@"
  ja: "@a@b%a002010「この男の人は\n\t本当に　ホルス王子のことを\n\t心配しているようね。\n@c0@"
  ko: "@a@b%a002010: 이 남자는\n홀스 왕자를 진심으로\n걱정하나 봐.\n@c0@"
  sl: "@a@b%a002010：这个人好像\n　　真的很担心\n　　荷尔斯王子呢。\n@c0@"
  tl: "@a@b%a002010：這個人好像\n　　真的很擔心\n　　荷爾斯王子呢。\n@c0@"
17:
  en: "@a%0%a002020@bGreat... And just when the Prince was starting to gain a little confidence too!\n@c0@"
  ja: "@a@b%a002020「せっかく　王子が\n\t少し　やる気になったのに\n\tそんなこと言っちゃ　ダメじゃない！\n@c0@"
  ko: "@a@b%a002020: 모처럼 왕자가\n마음을 먹어 줬는데\n저런 소릴 하면 어떡해!\n@c0@"
  sl: "@a@b%a002020：王子好不容易\n　　才有点干劲了，\n　　怎么能说这话啊！\n@c0@"
  tl: "@a@b%a002020：王子好不容易\n　　才有點幹勁了，\n　　怎麼能說這話啊！\n@c0@"
18:
  en: "@a%0%a002030@bSympathy may not be what the Prince needs...\n@c0@"
  ja: "@a@b%a002030「同情されるのが\n\t本人にとって　いいことだとは\n\tかぎりませんからね。\n@c0@"
  ko: "@a@b%a002030: 동정받는 게\n본인에게 꼭 좋은 것만은\n아니겠죠.\n@c0@"
  sl: "@a@b%a002030：被别人表示同情，\n　　这对本人来说\n　　并不一定是好事啊。\n@c0@"
  tl: "@a@b%a002030：被別人表示同情，\n　　這對本人來說\n　　並不一定是好事啊。\n@c0@"
19:
  en: "@a%0%a002050@bWe'll do all we can to protect the Prince from any hostile monsters.\n@c0@"
  ja: "@a@b%a002050「まあ　がんばって\n\tホルス王子を　まものどもから\n\t守ると　しましょう。\n@c0@"
  ko: "@a@b%a002050: 뭐, 힘내서\n홀스 왕자를 마물들로부터\n지키자구요.\n@c0@"
  sl: "@a@b%a002050：唉，我们就\n　　努力保护荷尔斯王子\n　　不被魔物伤害吧。\n@c0@"
  tl: "@a@b%a002050：唉，我們就\n　　努力保護荷爾斯王子\n　　不被魔物傷害吧。\n@c0@"
20:
  en: "@a%0%a002000@bHardy har! So much for the Prince's ol' armour routine, aye?\n@c0@"
  ja: "@a@b%a002000「あいさつがわりに\n\tスカートめくりの話かよ……。\n@c0@"
  ko: "@a@b%a002000: 인사 대신에\n치마 들추는 얘기냐......\n@c0@"
  sl: "@a@b%a002000：连问好的时候\n　　还不忘提掀裙子的事啊……\n@c0@"
  tl: "@a@b%a002000：連問好的時候\n　　還不忘提掀裙子的事啊……\n@c0@"
21:
  en: "@a%0%a002010@bI'm glad she isn't having any of the Prince's nonsense.\n@c0@"
  ja: "@a@b%a002010「うふふ。\n\tかわいいわね。\n@c0@"
  ko: "@a@b%a002010: 우후후.\n귀엽네.\n@c0@"
  sl: "@a@b%a002010：呵呵。\n　　真可爱。\n@c0@"
  tl: "@a@b%a002010：呵呵。\n　　真可愛。\n@c0@"
22:
  en: "@a%0%a002020@bI wonder if there's some history between her and the Prince...\n@c0@"
  ja: "@a@b%a002020「このふたり\n\t本当は　仲良しさん\n\tなんじゃないかな。\n@c0@"
  ko: "@a@b%a002020: 이 두 사람,\n알고 보면 사이 좋은 거\n아냐?\n@c0@"
  sl: "@a@b%a002020：这两个人\n　　其实关系很好吧。\n@c0@"
  tl: "@a@b%a002020：這兩個人\n　　其實關係很好吧。\n@c0@"
23:
  en: "@a%0%a002030@bIs showing off one's armour really so enjoyable?\n@c0@"
  ja: "@a@b%a002030「スカートめくりって\n\tそんなに　楽しい\n\tものなのでしょうか……。\n@c0@"
  ko: "@a@b%a002030: 치마 들추는 일이\n그렇게 재밌는\n일인가요......\n@c0@"
  sl: "@a@b%a002030：掀裙子真的\n　　有那么好玩吗……\n@c0@"
  tl: "@a@b%a002030：掀裙子真的\n　　有那麼好玩嗎……\n@c0@"
24:
  en: "@a%0%a002050@bThe pair of them are like a couple of stroppy schoolchildren.\n@c0@"
  ja: "@a@b%a002050「いやはや　ふたりとも\n\tちいさい子ども　みたいで\n\tほほえましいですね。\n@c0@"
  ko: "@a@b%a002050: 이야, 둘 다\n어린아이 같아서\n미소가 절로 나는군요.\n@c0@"
  sl: "@a@b%a002050：哎呀哎呀，\n　　这两个人就像小孩子一样，\n　　看着真开心。\n@c0@"
  tl: "@a@b%a002050：哎呀哎呀，\n　　這兩個人就像小孩子一樣，\n　　看著真開心。\n@c0@"
25:
  en: "@a%0%a002000@bIt's probably safer for the Prince to leave the fightin' to us.\n@c0@"
  ja: "@a@b%a002000「オレは\n\t王子の　剣のうでには\n\t期待してないけどな。\n@c0@"
  ko: "@a@b%a002000: 나는\n왕자의 검 실력은\n기대하지 않고 있다고.\n@c0@"
  sl: "@a@b%a002000：俺倒是不指望\n　　王子的剑术会有多高。\n@c0@"
  tl: "@a@b%a002000：俺倒是不指望\n　　王子的劍術會有多高。\n@c0@"
26:
  en: "@a%0%a002010@bSomehow I doubt we'll be seeing much in the way of impressive weapon skills from the Prince.\n@c0@"
  ja: "@a@b%a002010「教えたワザを\n\tちゃんと　使えるなら\n\tいいのだけれど……。\n@c0@"
  ko: "@a@b%a002010: 가르친 기술을\n제대로 사용할 수 있다면\n좋겠지만......\n@c0@"
  sl: "@a@b%a002010：要是能好好使出\n　　学过的招数就好了……\n@c0@"
  tl: "@a@b%a002010：要是能好好使出\n　　學過的招數就好了……\n@c0@"
27:
  en: "@a%0%a002020@bWait, does that mean he actually attended some sessions?\n@c0@"
  ja: "@a@b%a002020「サボッて　ばかりだって\n\t聞いたわよね……。\n\t剣のけいこ。\n@c0@"
  ko: "@a@b%a002020: 항상 농땡이만 부린다고\n들었지......\n검술 훈련 말이야.\n@c0@"
  sl: "@a@b%a002020：我听说王子\n　　经常逃掉剑术的练习呢……\n@c0@"
  tl: "@a@b%a002020：我聽說王子\n　　經常逃掉劍術的練習呢……\n@c0@"
28:
  en: "@a%0%a002030@bEven if the Prince has some sword skills, it is clear that his heart is not in it.\n@c0@"
  ja: "@a@b%a002030「ワザは　いろいろ\n\t知ってるとしても　本人の気持ちが\n\tにげごしですからね……。\n@c0@"
  ko: "@a@b%a002030: 여러 기술을\n알고 있더라도 본인이\n자꾸 도망치려고만 하니......\n@c0@"
  sl: "@a@b%a002030：就算他剑术超群，\n　　可是却一心想着逃走的话，\n　　也是毫无用武之地啊……\n@c0@"
  tl: "@a@b%a002030：就算他劍術超群，\n　　可是卻一心想著逃走的話，\n　　也是毫無用武之地啊……\n@c0@"
29:
  en: "@a%0%a002050@bI wouldn't trust Prince Howard to beat an egg, much less a monster.\n@c0@"
  ja: "@a@b%a002050「この　王子ですら\n\tひとひねり　できちゃう　レベルの\n\tまものたち　なんですかね……。\n@c0@"
  ko: "@a@b%a002050: 이 왕자조차\n한 방에 끝낼 수 있는 수준의\n마물들이란 말인가요......\n@c0@"
  sl: "@a@b%a002050：那些魔物真的弱到\n　　就连这个王子\n　　都可以轻松解决么……\n@c0@"
  tl: "@a@b%a002050：那些魔物真的弱到\n　　就連這個王子\n　　都可以輕鬆解決麼……\n@c0@"
30:
  en: "@a%0%a002000@bThat fella was laying it on a bit thick, aye?\n@c0@"
  ja: "@a@b%a002000「こいつも　いいかげんな\n\tヤツなんだな……。\n@c0@"
  ko: "@a@b%a002000: 이 녀석도 참\n이랬다저랬다 하는군......\n@c0@"
  sl: "@a@b%a002000：这家伙\n　　也是个随便的人啊……\n@c0@"
  tl: "@a@b%a002000：這傢伙\n　　也是個隨便的人啊……\n@c0@"
31:
  en: "@a%0%a002010@bThe Prince certainly doesn't hold back with his opinions, does he?\n@c0@"
