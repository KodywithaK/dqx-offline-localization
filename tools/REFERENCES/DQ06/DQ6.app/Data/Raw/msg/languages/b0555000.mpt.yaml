  sl: "@a@b%a002010：这里比上面凉快呢。\n@c0@"
  tl: "@a@b%a002010：這裡比上面涼快呢。\n@c0@"
72:
  en: "@a%0%a002020@bHey, where're we going?\n@c0@"
