  sl: "@a@b%a002030：我想起\n　　王妃殿下说荷尔斯\n　　是个温柔的孩子了呢。\n@c0@"
  tl: "@a@b%a002030：我想起\n　　王妃殿下說荷爾斯\n　　是個溫柔的孩子了呢。\n@c0@"
79:
