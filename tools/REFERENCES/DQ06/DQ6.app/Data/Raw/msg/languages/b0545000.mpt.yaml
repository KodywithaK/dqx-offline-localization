  ja: "@a@b%a002030「なかなか　たのもしい\n\t兵士さんですね。\n@c0@"
  ko: "@a@b%a002030: 아주 믿음직스러운\n병사님이군요.\n@c0@"
  sl: "@a@b%a002030：真是一个\n　　可靠的士兵啊。\n@c0@"
  tl: "@a@b%a002030：真是一個\n　　可靠的士兵啊。\n@c0@"
99:
  en: "@a%0%a002050@bI wish that fellow luck!\n@c0@"
  ja: "@a@b%a002050「いやー\n\tすごい　野望ですねー。\n@c0@"
  ko: "@a@b%a002050: 이야~\n대단한 야망이군요~\n@c0@"
  sl: "@a@b%a002050：哎呀，\n　　野心真大呢。\n@c0@"
  tl: "@a@b%a002050：哎呀，\n　　野心真大呢。\n@c0@"
100:
  en: "@a%0%a002000@bEven tough fellas like me know to come in out of the cold...\n@c0@"
  ja: "@a@b%a002000「あれだけ　ずっと\n\tおもてにいたら　そりゃ\n\t冷えるだろうよ。\n@c0@"
  ko: "@a@b%a002000: 그렇게 계속\n밖에 있었으니\n추울 만도 하지.\n@c0@"
  sl: "@a@b%a002000：一直这么待在外面，\n　　肯定会着凉的啊。\n@c0@"
  tl: "@a@b%a002000：一直這麼待在外面，\n　　肯定會著涼的啊。\n@c0@"
101:
  en: "@a%0%a002010@bI knew he would catch a cold...\n@c0@"
  ja: "@a@b%a002010「ああ　やっぱり\n\tカゼを　引いちゃったのね……。\n@c0@"
  ko: "@a@b%a002010: 아, 역시\n감기에 걸리셨구나......\n@c0@"
  sl: "@a@b%a002010：啊，果然感冒了呢……\n@c0@"
  tl: "@a@b%a002010：啊，果然感冒了呢……\n@c0@"
102:
  en: "@a%0%a002020@bGross! What's that stuff dripping from his nose!?\n@c0@"
  ja: "@a@b%a002020「ああっ　おじいちゃん\n\tハナ水が　ゆかに！！\n@c0@"
  ko: "@a@b%a002020: 앗, 할아버지\n콧물이 바닥에 떨어졌어!!\n@c0@"
  sl: "@a@b%a002020：啊，老爷爷，\n　　鼻涕流地上了哦！！\n@c0@"
  tl: "@a@b%a002020：啊，老爺爺，\n　　鼻涕流地上了哦！！\n@c0@"
103:
  en: "@a%0%a002030@bI pray that he learns his lesson.\n@c0@"
  ja: "@a@b%a002030「ムリは　きんもつですね。\n@c0@"
  ko: "@a@b%a002030: 무리는 금물입니다.\n@c0@"
  sl: "@a@b%a002030：做事别勉强啊。\n@c0@"
  tl: "@a@b%a002030：做事別勉強啊。\n@c0@"
104:
  en: "@a%0%a002050@bAh-Ah-CHOO!!!\n@c0@"
  ja: "@a@b%a002050「ハーックション！！\n@c0@"
  ko: "@a@b%a002050: 에~에엣취!!\n@c0@"
  sl: "@a@b%a002050：阿嚏！！\n@c0@"
  tl: "@a@b%a002050：阿嚏！！\n@c0@"
105:
  en: "@a%0%a002000@bHardy hoo-boy. Some day I'll look back on this and laugh.\n@c0@"
  ja: "@a@b%a002000「いつでも\n\tごうかいな　男だぜ\n\tブラスト兵団長。\n@c0@"
  ko: "@a@b%a002000: 블래스트 병사단장은\n언제나 호쾌한\n남자로군.\n@c0@"
  sl: "@a@b%a002000：布拉斯特兵团长，\n　　一直这么豪爽啊。\n@c0@"
  tl: "@a@b%a002000：布拉斯特兵團長，\n　　一直這麼豪爽啊。\n@c0@"
106:
  en: "@a%0%a002010@bAt least he's got a sense of humour about all this.\n@c0@"
  ja: "@a@b%a002010「この国いちばんの\n\t強者も　家では　やさしい\n\tお父さん　してるのね。\n@c0@"
  ko: "@a@b%a002010: 이 나라 제일의\n실력가도 집에서는 다정한\n아빠 노릇을 하고 있구나.\n@c0@"
  sl: "@a@b%a002010：这个国家\n　　最厉害的强者，\n　　在家里是一个慈父呢。\n@c0@"
  tl: "@a@b%a002010：這個國家\n　　最厲害的強者，\n　　在家裡是一個慈父呢。\n@c0@"
107:
  en: "@a%0%a002020@bI bet we can't leave soon enough for that guy!\n@c0@"
  ja: "@a@b%a002020「ここは　兵団長さんの\n\tおうちだったんだねー。\n@c0@"
  ko: "@a@b%a002020: 여긴 병사단장의\n집이었구나~\n@c0@"
  sl: "@a@b%a002020：这里是兵团长的家呢。\n@c0@"
  tl: "@a@b%a002020：這裡是兵團長的家呢。\n@c0@"
108:
  en: "@a%0%a002030@bI imagine this is as close as Commander Brutus gets to being sympathetic.\n@c0@"
  ja: "@a@b%a002030「こうして\n\t笑い飛ばして　もらったほうが\n\t気が楽ですね。\n@c0@"
  ko: "@a@b%a002030: 이렇게\n웃고 넘겨야\n마음이 편하지요.\n@c0@"
  sl: "@a@b%a002030：这么一笑带过，\n　　我心里也舒坦多了呢。\n@c0@"
  tl: "@a@b%a002030：這麼一笑帶過，\n　　我心裡也舒坦多了呢。\n@c0@"
109:
  en: "@a%0%a002050@bCommander Brutus knows how to bounce back from adversity.\n@c0@"
  ja: "@a@b%a002050「それにしても\n\t兵団長さんは　タフですねー。\n@c0@"
  ko: "@a@b%a002050: 그나저나\n병사단장은 정말 강하군요.\n@c0@"
  sl: "@a@b%a002050：不过，兵团长\n　　还真是百折不挠啊。\n@c0@"
  tl: "@a@b%a002050：不過，兵團長\n　　還真是百折不撓啊。\n@c0@"
110:
  en: "@a%0%a002050@bHe's taken three sound beatings, after all. From the beast, from young %a002040, and from us, of course.\n@c0@"
  ja: "@a@b%a002050「まもの　%a002040さん\n\tそして　私たち……\n@c0@"
  ko: "@a@b%a002050: 마물, %a002040 씨,\n그리고 우리......\n@c0@"
  sl: "@a@b%a002050：魔物，%a002040，\n　　还有我们……\n@c0@"
  tl: "@a@b%a002050：魔物，%a002040，\n　　還有我們……\n@c0@"
111:
  en: "@a%0%a002050@bYou wouldn't tell to look at him, though...\n@c0@"
  ja: "@a@b%a002050「たとえ　敗れたとはいえ\n\tこんなに　たて続けに　戦って\n\t平気な顔　してますものね。\n@c0@"
  ko: "@a@b%a002050: 비록 지기는 했지만\n그렇게 연속으로 싸워 놓고도\n태연한 모습을 보여 주다니.\n@c0@"
  sl: "@a@b%a002050：即使被打败，\n　　也能面不改色地\n　　站起来继续战斗呢。\n@c0@"
  tl: "@a@b%a002050：即使被打敗，\n　　也能面不改色地\n　　站起來繼續戰鬥呢。\n@c0@"
112:
  en: "@a%0%a002000@bThat kid really looks up to his old man. It kinda gets ya right here...\n@c0@"
  ja: "@a@b%a002000「この子　おやじさんのこと\n\t尊敬してるんだな。\n\tとても　いいことだと　思うぜ。\n@c0@"
  ko: "@a@b%a002000: 이 아이, 아버지를\n존경하고 있군.\n정말 바람직한 일이지.\n@c0@"
  sl: "@a@b%a002000：这小鬼\n　　很崇拜自己老爸吧。\n　　这是好事啊。\n@c0@"
  tl: "@a@b%a002000：這小鬼\n　　很崇拜自己老爸吧。\n　　這是好事啊。\n@c0@"
113:
  en: "@a%0%a002010@bSuch a spirited child. I'm sure Commander Brutus was exactly the same at his age.\n@c0@"
  ja: "@a@b%a002010「まけん気の強い　ぼうや……。\n\t兵団長さんも　小さいころは\n\tこんな子　だったのでしょうね。\n@c0@"
  ko: "@a@b%a002010: 지기 싫어하는 꼬마......\n병사단장님도 어릴 때는\n이런 아이였을 거야.\n@c0@"
  sl: "@a@b%a002010：不服输的小朋友……\n　　兵团长小时候，\n　　也是这样的吧。\n@c0@"
  tl: "@a@b%a002010：不服輸的小朋友……\n　　兵團長小時候，\n　　也是這樣的吧。\n@c0@"
114:
  en: "@a%0%a002020@bWhat a great father-and-son moment! I started welling up there for a second...\n@c0@"
  ja: "@a@b%a002020「すてきな\n\t親子かんけい　だねー。\n\tちょっと　感動しちゃった……。\n@c0@"
  ko: "@a@b%a002020: 멋진\n아빠와 아들이야~\n조금 감동했어......\n@c0@"
  sl: "@a@b%a002020：父子关系真融洽啊。\n　　我有点感动了呢……\n@c0@"
  tl: "@a@b%a002020：父子關係真融洽啊。\n　　我有點感動了呢……\n@c0@"
115:
  en: "@a%0%a002030@bCommander Brutus seems to be physically incapable of ever giving up. I admire him greatly.\n@c0@"
  ja: "@a@b%a002030「ブラストさんは\n\tなにが　あっても　くじけない\n\t本当に　強い人なんですね。\n@c0@"
  ko: "@a@b%a002030: 블래스트 님은\n무슨 일이 있어도 좌절하지 않는\n진정으로 강한 사람이군요.\n@c0@"
  sl: "@a@b%a002030：不管发生了什么事，\n　　布拉斯特都坚韧不屈呢。\n　　真是一个厉害的人啊。\n@c0@"
  tl: "@a@b%a002030：不管發生了什麼事，\n　　布拉斯特都堅韌不屈呢。\n　　真是一個厲害的人啊。\n@c0@"
116:
  en: "@a%0%a002050@bI wouldn't say no to a scrap with the lad. Once he's grown a bit bigger, of course...\n@c0@"
  ja: "@a@b%a002050「この子が　強くなったら\n\t私　ぜひ戦ってみたいです！\n@c0@"
  ko: "@a@b%a002050: 이 아이가 강해지면\n저는 꼭 싸워 보고 싶습니다!\n@c0@"
  sl: "@a@b%a002050：这个孩子强大起来之后，\n　　我一定要与他一战！\n@c0@"
  tl: "@a@b%a002050：這個孩子強大起來之後，\n　　我一定要與他一戰！\n@c0@"
117:
  en: "@a%0%a002000@bI'd be lookin' into a new vocation if I was that guy.\n@c0@"
  ja: "@a@b%a002000「まあ　たしかに\n\tあまり　気持ちのいい　仕事じゃ\n\tないかもなあ。\n@c0@"
  ko: "@a@b%a002000: 뭐, 확실히\n별로 기분 좋은 일은\n아니겠군.\n@c0@"
  sl: "@a@b%a002000：唉，这的确不是个\n　　让人愉快的差事。\n@c0@"
  tl: "@a@b%a002000：唉，這的確不是個\n　　讓人愉快的差事。\n@c0@"
118:
  en: "@a%0%a002010@bThere's definitely something strange about keeping the body down here, don't you think?\n@c0@"
  ja: "@a@b%a002010「死がいの\n\tほかん場所にしては　たしかに\n\t妙かも　しれないわね。\n@c0@"
  ko: "@a@b%a002010: 시체를\n보관하는 장소로는 좀\n애매한 것 같기도 해.\n@c0@"
  sl: "@a@b%a002010：作为保管尸体的地方，\n　　这里的确很奇怪啊。\n@c0@"
  tl: "@a@b%a002010：作為保管屍體的地方，\n　　這裡的確很奇怪啊。\n@c0@"
119:
  en: "@a%0%a002020@bWhat are they guarding it from? Thieves?\n@c0@"
  ja: "@a@b%a002020「誰かに　盗まれないよう\n\t守ってるのかな？\n@c0@"
  ko: "@a@b%a002020: 누가 훔쳐 가지 못하게\n지키고 있는 건가?\n@c0@"
  sl: "@a@b%a002020：是为了不让别人偷走吧？\n@c0@"
  tl: "@a@b%a002020：是為了不讓別人偷走吧？\n@c0@"
120:
  en: "@a%0%a002020@bAre rotting monster corpses hot on the black market or something?\n@c0@"
  ja: "@a@b%a002020「死がいなんて\n\tだれも　盗まないか……。\n@c0@"
  ko: "@a@b%a002020: 하긴, 시체를 누가\n훔쳐 간다고......\n@c0@"
  sl: "@a@b%a002020：没人会偷尸体的吧……\n@c0@"
  tl: "@a@b%a002020：沒人會偷屍體的吧……\n@c0@"
121:
  en: "@a%0%a002030@bI must confess, I too am puzzled by this.\n@c0@"
  ja: "@a@b%a002030「はて　どうしてでしょうね。\n\t私にも　ちょっと\n\t見当が　つきません。\n@c0@"
  ko: "@a@b%a002030: 흐음, 왜일까요?\n저도 짐작이 잘\n가지 않는군요.\n@c0@"
  sl: "@a@b%a002030：究竟是为什么呢？\n　　我也不清楚。\n@c0@"
  tl: "@a@b%a002030：究竟是為什麼呢？\n　　我也不清楚。\n@c0@"
122:
  en: "@a%0%a002050@bWhat if in the dead of night, the coffin lid suddenly sprung open and...\n@c0@"
  ja: "@a@b%a002050「……夜中に　フタが\n\tババンッと　ひらいて\n\tカンオケの中から……！！\n@c0@"
  ko: "@a@b%a002050: ......한밤중에 뚜껑이\n쩍 열리더니\n관 속에서......!!\n@c0@"
  sl: "@a@b%a002050：……大半夜\n　　棺材盖子砰一声打开，\n　　然后从里面……\n@c0@"
  tl: "@a@b%a002050：……大半夜\n　　棺材蓋子砰一聲打開，\n　　然後從裡面……\n@c0@"
123:
  en: "@a%0%a002050@b...Arghhh! Old %a002050 has gone and scared himself!\n@c0@"
  ja: "@a@b%a002050「うわー！\n\t自分で　言ってて\n\tこわいです！\n@c0@"
  ko: "@a@b%a002050: 으앗~!\n제가 말하고도\n무섭군요!\n@c0@"
  sl: "@a@b%a002050：哇！\n　　自己说出来好可怕！\n@c0@"
  tl: "@a@b%a002050：哇！\n　　自己說出來好可怕！\n@c0@"
124:
  en: "@a%0%a002000@bI reckon ignorance is bliss in this case.\n@c0@"
  ja: "@a@b%a002000「となりの牢の　中身は\n\tこいつには　教えないほうが\n\tしんせつって　ものだろうな。\n@c0@"
  ko: "@a@b%a002000: 감옥 옆방에 뭐가 있는지\n이 녀석에게는 알려 주지 않는 게\n예의겠군.\n@c0@"
  sl: "@a@b%a002000：为了这人好，\n　　还是别告诉他旁边牢房里\n　　关着啥好了。\n@c0@"
  tl: "@a@b%a002000：為了這人好，\n　　還是別告訴他旁邊牢房裡\n　　關著啥好了。\n@c0@"
125:
  en: "@a%0%a002010@bIf we told him the truth, he probably wouldn't be able to sleep at all.\n@c0@"
  ja: "@a@b%a002010「本当のこと　言ったら\n\tますます　ねむれなく\n\tなっちゃうわよね。\n@c0@"
  ko: "@a@b%a002010: 진실을 말해 주면\n지금보다 더\n잠을 못 이루게 되겠는걸.\n@c0@"
  sl: "@a@b%a002010：告诉他实情的话，\n　　晚上更睡不好觉了吧。\n@c0@"
  tl: "@a@b%a002010：告訴他實情的話，\n　　晚上更睡不好覺了吧。\n@c0@"
126:
  en: "@a%0%a002020@bCorpses make rotten neighbours. Tee hee!\n@c0@"
  ja: "@a@b%a002020「ひとりぼっちよりは\n\tにぎやかで　いいんじゃないかと\n\t思うけど……そうでもないか……。\n@c0@"
  ko: "@a@b%a002020: 혼자 있는 것보다는\n여럿이 같이 있는 게 더 좋지 않을까\n싶긴 하지만...... 그렇지도 않은가......\n@c0@"
  sl: "@a@b%a002020：与其一个人孤零零待着，\n　　还是热闹点好……\n　　不过这也不是绝对啊……\n@c0@"
  tl: "@a@b%a002020：與其一個人孤零零待著，\n　　還是熱鬧點好……\n　　不過這也不是絕對啊……\n@c0@"
127:
  en: "@a%0%a002030@bPerhaps it is better that he does not know. I do not imagine he would be best pleased...\n@c0@"
  ja: "@a@b%a002030「まあ　さすがに\n\tおとなりさん同士　仲良くしろ\n\tというには　気が引けますね。\n@c0@"
  ko: "@a@b%a002030: 이 상황에서\n옆방끼리 잘 지내라고\n말하는 것도 좀 아닌 것 같군요.\n@c0@"
  sl: "@a@b%a002030：唉，我们实在说不出\n　　请和隔壁好好相处\n　　这种话来……\n@c0@"
  tl: "@a@b%a002030：唉，我們實在說不出\n　　請和隔壁好好相處\n　　這種話來……\n@c0@"
128:
  en: "@a%0%a002050@bWe could tell him what's really in there, but I reckon it's kinder not to.\n@c0@"
  ja: "@a@b%a002050「本当のこと　教えても\n\t信じないんじゃ　ないですか？\n@c0@"
  ko: "@a@b%a002050: 진실을 말해도\n안 믿는 거 아닐까요?\n@c0@"
  sl: "@a@b%a002050：即使告诉他实情，\n　　他也不会相信吧？\n@c0@"
  tl: "@a@b%a002050：即使告訴他實情，\n　　他也不會相信吧？\n@c0@"
129:
  en: "@a%0%a002000@bI reckon this'll be our last visit to Arkbolt for a while, aye?\n@c0@"
  ja: "@a@b%a002000「この　お城に\n\tちょくちょく　来るのも\n\t今日で　おわりかな。\n@c0@"
  ko: "@a@b%a002000: 이 성에\n이따금씩 찾아오던 것도\n오늘로 끝이겠군.\n@c0@"
  sl: "@a@b%a002000：像这样频繁来到这座城，\n　　今天也是最后一次了吧。\n@c0@"
  tl: "@a@b%a002000：像這樣頻繁來到這座城，\n　　今天也是最後一次了吧。\n@c0@"
130:
  en: "@a%0%a002010@bOnce we're done here, we should see what's on the other side of Wayfarer's Pass.\n@c0@"
  ja: "@a@b%a002010「ここを　おいとましたら\n\t旅の洞くつの　向こうへ\n\t行ってみたいわね。\n@c0@"
  ko: "@a@b%a002010: 이곳에 작별 인사를 하고 나면\n여행자의 동굴 너머로\n가 보고 싶어.\n@c0@"
  sl: "@a@b%a002010：告别这里之后，\n　　就去旅行者洞窟对面\n　　看看吧。\n@c0@"
  tl: "@a@b%a002010：告別這裡之後，\n　　就去旅行者洞窟對面\n　　看看吧。\n@c0@"
131:
  en: "@a%0%a002020@bUgh. My feet are on fire from all the walking...\n@c0@"
  ja: "@a@b%a002020「トボトボ……。\n\tあー　なんか\n\t足が　重いかもー。\n@c0@"
