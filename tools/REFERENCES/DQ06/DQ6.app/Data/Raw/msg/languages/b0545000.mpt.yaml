162:
  en: "@a%0%a002050@bIt's not easy to sleep standin' up, I tell you! I've tried...\n@c0@"
  ja: "@a@b%a002050「立ったまま　ねるって\n\tかなりの　ぎじゅつが\n\t必要ですよね！\n@c0@"
  ko: "@a@b%a002050: 선 채로 자는 건\n상당한 기술이\n필요한 일이죠!\n@c0@"
  sl: "@a@b%a002050：站着都能睡着，\n　　这是个技术活啊！\n@c0@"
  tl: "@a@b%a002050：站著都能睡著，\n　　這是個技術活啊！\n@c0@"
163:
  en: "@a%0%a002030@bThe Goddess frowns on gambling — and I have no doubt Commander Brutus does too.\n@c0@"
  ja: "@a@b%a002030「かけごとだなんて……\n\t兵団長に　知れたら\n\tたいへんでしょうにね。\n@c0@"
  ko: "@a@b%a002030: 돈을 걸었다니......\n병사단장님이 알면\n큰일 날 텐데요.\n@c0@"
  sl: "@a@b%a002030：居然参与赌博……\n　　要是被兵团长知道了的话，\n　　后果会很严重吧。\n@c0@"
  tl: "@a@b%a002030：居然參與賭博……\n　　要是被兵團長知道了的話，\n　　後果會很嚴重吧。\n@c0@"
164:
  en: "@a%0%a002000@bA sword like that was made for a fighter like %a002040, anyway. \n@c0@"
  ja: "@a@b%a002000「まあ　いいさ！\n\tあの剣は　%a002040のために\n\tあったんだろう。\n@c0@"
  ko: "@a@b%a002000: 이제 됐어!\n그 검은 %a002040%F2040%X를%Y을%Z 위해\n존재하는 거다.\n@c0@"
  sl: "@a@b%a002000：唉，算了！\n　　那把剑就是为%a002040\n　　存在的吧。\n@c0@"
  tl: "@a@b%a002000：唉，算了！\n　　那把劍就是為%a002040\n　　存在的吧。\n@c0@"
165:
  en: "@a%0%a002000@bLike the King said, it all depends on how ya look at it!\n@c0@"
  ja: "@a@b%a002000「王さまの　言うように\n\tものは考えようだからな！\n@c0@"
  ko: "@a@b%a002000: 왕의 말씀대로\n다 생각하기 나름이지!\n@c0@"
  sl: "@a@b%a002000：国王陛下说得对，\n　　事情要看两方面！\n@c0@"
  tl: "@a@b%a002000：國王陛下說得對，\n　　事情要看兩方面！\n@c0@"
166:
  en: "@a%0%a002000@bThe place is pretty dead, aye? Looks like everyone shoved off.\n@c0@"
  ja: "@a@b%a002000「おっ　人が　少ないな。\n\tみんな　出かけていったのかな。\n@c0@"
  ko: "@a@b%a002000: 엇, 사람이 적군.\n모두 밖으로 나간 건가?\n@c0@"
  sl: "@a@b%a002000：人真少啊。\n　　大伙都出去了吧。\n@c0@"
  tl: "@a@b%a002000：人真少啊。\n　　大夥都出去了吧。\n@c0@"
167:
  en: "@a%0%a002010@bLet's go farther in.\n@c0@"
  ja: "@a@b%a002010「どんどん　奥に\n\t行ってみましょ。\n@c0@"
  ko: "@a@b%a002010: 안쪽으로 계속\n들어가 보자.\n@c0@"
  sl: "@a@b%a002010：再往里\n　　走走吧。\n@c0@"
  tl: "@a@b%a002010：再往裡\n　　走走吧。\n@c0@"
168:
  en: "@a%0%a002020@bSo the monsters aren't coming out to play any more?\n@c0@"
  ja: "@a@b%a002020「まさか　もう\n\tまものは　出ないわよね？\n@c0@"
  ko: "@a@b%a002020: 설마 또\n마물이 나오는 거 아니겠지?\n@c0@"
  sl: "@a@b%a002020：难道魔物\n　　已经不会再出现了吗？\n@c0@"
  tl: "@a@b%a002020：難道魔物\n　　已經不會再出現了嗎？\n@c0@"
169:
  en: "@a%0%a002030@bAt last, Wayfarer's Pass is living up to its name.\n@c0@"
  ja: "@a@b%a002030「やっと　この洞くつも\n\t機能を　取りもどしたのですね。\n@c0@"
  ko: "@a@b%a002030: 이 동굴도 이제서야\n제 기능을 되찾았군요.\n@c0@"
  sl: "@a@b%a002030：这个洞窟终于恢复正常，\n　　人们又可以往来了。\n@c0@"
  tl: "@a@b%a002030：這個洞窟終於恢復正常，\n　　人們又可以往來了。\n@c0@"
170:
  en: "@a%0%a002050@bNot much life in this place, is there?\n@c0@"
  ja: "@a@b%a002050「なんか　がらーんと\n\tしてますね。\n@c0@"
  ko: "@a@b%a002050: 왠지 텅 빈\n느낌이군요.\n@c0@"
  sl: "@a@b%a002050：总觉得空荡荡的呢。\n@c0@"
  tl: "@a@b%a002050：總覺得空蕩蕩的呢。\n@c0@"
171:
  en: "@a%0%a002000@bHardy har! The guy finally got what he wanted, aye?\n@c0@"
  ja: "@a@b%a002000「おおっ　おっさん　とうとう\n\t酒に　ありついたな！\n@c0@"
  ko: "@a@b%a002000: 오옷, 아저씨 드디어\n술을 마실 수 있게 되었군!\n@c0@"
  sl: "@a@b%a002000：哦，\n　　大叔终于喝上酒了啊！\n@c0@"
  tl: "@a@b%a002000：哦，\n　　大叔終於喝上酒了啊！\n@c0@"
172:
  en: "@a%0%a002010@bOnce they got started, the rocks were out in no time.\n@c0@"
  ja: "@a@b%a002010「はじまって　しまえば\n\t岩をどかす作業は　あっというま\n\tだったようね。\n@c0@"
  ko: "@a@b%a002010: 한번 시작하고 나니\n바위를 치우는 작업은 순식간에\n끝나 버렸네.\n@c0@"
  sl: "@a@b%a002010：搬石头的工程\n　　一眨眼就做完了呢。\n@c0@"
  tl: "@a@b%a002010：搬石頭的工程\n　　一眨眼就做完了呢。\n@c0@"
173:
  en: "@a%0%a002020@bWow! He knocked that back like it was nothing!\n@c0@"
  ja: "@a@b%a002020「工事の　おじさん\n\tうれしそうな　顔して\n\tお酒　飲んでたねー。\n@c0@"
  ko: "@a@b%a002020: 공사하는 아저씨,\n기쁜 표정으로\n술을 마시고 있었어~\n@c0@"
  sl: "@a@b%a002020：施工的大叔\n　　喝酒的时候\n　　一脸开心呢。\n@c0@"
  tl: "@a@b%a002020：施工的大叔\n　　喝酒的時候\n　　一臉開心呢。\n@c0@"
174:
  en: "@a%0%a002030@bThey say that a drink after hard work tastes especially good.\n@c0@"
  ja: "@a@b%a002030「ひと仕事を\n\t終えた後の　いっぱいは\n\tおいしいと　言いますよね。\n@c0@"
  ko: "@a@b%a002030: 일을 마친 뒤에\n마시는 한잔은\n각별하다고들 하지요.\n@c0@"
  sl: "@a@b%a002030:工作结束之后的\n　　一杯佳酿，\n　　真是无与伦比啊。\n@c0@"
  tl: "@a@b%a002030:工作結束之後的\n　　一杯佳釀，\n　　真是無與倫比啊。\n@c0@"
175:
  en: "@a%0%a002030@bLooking at that fellow, I can well believe it.\n@c0@"
  ja: "@a@b%a002030「こうして　この人を\n\t見ていると　本当なんだな\n\tと思えますね。\n@c0@"
  ko: "@a@b%a002030: 이렇게 이 사람을\n보고 있자니 정말인가보다\n싶습니다.\n@c0@"
  sl: "@a@b%a002030：看着这个人的模样，\n　　我相信这句话\n　　说的是真的。\n@c0@"
  tl: "@a@b%a002030：看著這個人的模樣，\n　　我相信這句話\n　　說的是真的。\n@c0@"
176:
  en: "@a%0%a002050@bHe's swiggin' away like there's no tomorrow! Doesn't he have a home to go to?\n@c0@"
  ja: "@a@b%a002050「あんなに　一気に飲んで……\n\tよっぱらって　家に\n\t帰れなく　なりませんかね？\n@c0@"
  ko: "@a@b%a002050: 저렇게 한꺼번에 들이켜다니......\n취해서 집까지\n못 가게 되는 거 아닐까요?\n@c0@"
  sl: "@a@b%a002050：一下子喝这么多……\n　　要是喝醉了的话\n　　不就回不了家了？\n@c0@"
  tl: "@a@b%a002050：一下子喝這麼多……\n　　要是喝醉了的話\n　　不就回不了家了？\n@c0@"
177:
  en: "@a%0%a002000@bWhy are they still here if the stones are gone?\n@c0@"
  ja: "@a@b%a002000「まだ　工事の\n\tあとかたづけ中か。\n@c0@"
  ko: "@a@b%a002000: 아직 공사\n마무리를 하는 중이군.\n@c0@"
  sl: "@a@b%a002000：施工还在\n　　收尾阶段啊。\n@c0@"
  tl: "@a@b%a002000：施工還在\n　　收尾階段啊。\n@c0@"
178:
  en: "@a%0%a002010@bIt's nice to see people taking pride in their work.\n@c0@"
  ja: "@a@b%a002010「自分の　お仕事に\n\tほこりを　持っているのね。\n@c0@"
  ko: "@a@b%a002010: 자신의 일에\n자부심을 가지고 있구나.\n@c0@"
  sl: "@a@b%a002010：为自己的工作\n　　感到自豪呢。\n@c0@"
  tl: "@a@b%a002010：為自己的工作\n　　感到自豪呢。\n@c0@"
179:
  en: "@a%0%a002020@bThose guys are a little gruff, but we owe 'em one, nonetheless.\n@c0@"
  ja: "@a@b%a002020「クチは　悪いけど\n\tたしかに　おじさんたちの\n\tおかげよね！\n@c0@"
  ko: "@a@b%a002020: 말투는 거칠지만\n아저씨들 덕분인 건\n맞아!\n@c0@"
  sl: "@a@b%a002020：虽然大叔们\n　　嘴有点欠，\n　　但是多亏了有他们呢！\n@c0@"
  tl: "@a@b%a002020：雖然大叔們\n　　嘴有點欠，\n　　但是多虧了有他們呢！\n@c0@"
180:
  en: "@a%0%a002030@bThe workmen have done a remarkable job.\n@c0@"
  ja: "@a@b%a002030「本当に　みごとに\n\tきれいに　なっていますね。\n\tさすがです！\n@c0@"
  ko: "@a@b%a002030: 정말 깨끗하게\n치워져 있군요.\n대단합니다!\n@c0@"
  sl: "@a@b%a002030：真的变得\n　　畅通无阻了呢。\n　　真厉害！\n@c0@"
  tl: "@a@b%a002030：真的變得\n　　暢通無阻了呢。\n　　真厲害！\n@c0@"
181:
  en: "@a%0%a002050@bIt's a relief to be able to get right through to the other side at last!\n@c0@"
  ja: "@a@b%a002050「向こうがわまで\n\t行けるように　なったのは\n\tホントに　ありがたいですね。\n@c0@"
  ko: "@a@b%a002050: 반대편까지\n갈 수 있게 된 건\n정말 고마운 일입니다.\n@c0@"
  sl: "@a@b%a002050：能够去洞窟对面了，\n　　真是可喜可贺啊。\n@c0@"
  tl: "@a@b%a002050：能夠去洞窟對面了，\n　　真是可喜可賀啊。\n@c0@"
182:
  en: "@a%0%a002000@bAye, a fella could wander for days in that maze.\n@c0@"
  ja: "@a@b%a002000「中は　迷路みたいだし\n\tたしかに　うっかり入ると\n\tあぶないな。\n@c0@"
  ko: "@a@b%a002000: 안쪽은 미로처럼 되어 있으니\n실수로 들어가기라도 하면\n확실히 위험하겠군.\n@c0@"
  sl: "@a@b%a002000：里面路绕得很，\n　　要是不小心进去了的话，\n　　的确很危险啊。\n@c0@"
  tl: "@a@b%a002000：裡面路繞得很，\n　　要是不小心進去了的話，\n　　的確很危險啊。\n@c0@"
183:
  en: "@a%0%a002010@bIt seems that monsters are appearing in the cave again.\n@c0@"
  ja: "@a@b%a002010「まあ……。\n\tまた　洞くつの中に　まものが\n\t出るようになったのね……。\n@c0@"
  ko: "@a@b%a002010: 어머......\n동굴 속에서 또 마물이\n나타나게 된 거구나......\n@c0@"
  sl: "@a@b%a002010：唉……\n　　洞窟里又出现魔物了啊……\n@c0@"
  tl: "@a@b%a002010：唉……\n　　洞窟裡又出現魔物了啊……\n@c0@"
184:
  en: "@a%0%a002010@bAt least the big one is gone. Still, it's probably best that people keep their distance...\n@c0@"
  ja: "@a@b%a002010「もう　あの巨大な\n\tまものは　いないにしても\n\tふつうの人が　入るのはキケンね。\n@c0@"
  ko: "@a@b%a002010: 이제 그 거대한\n마물은 없겠지만\n일반인이 들어가는 건 위험할 거야.\n@c0@"
  sl: "@a@b%a002010：虽然那个大怪物不在了，\n　　但是普通人进去的话\n　　还是很危险啊。\n@c0@"
  tl: "@a@b%a002010：雖然那個大怪物不在了，\n　　但是普通人進去的話\n　　還是很危險啊。\n@c0@"
185:
  en: "@a%0%a002020@bWhy don't they just seal the hole and be done with it?\n@c0@"
  ja: "@a@b%a002020「穴を　ふさいじゃえれば\n\tいちばん　いいんだけどね。\n@c0@"
  ko: "@a@b%a002020: 구멍을 막을 수 있다면\n제일 좋을 텐데.\n@c0@"
  sl: "@a@b%a002020：要是把洞堵上，\n　　就一了百了了呢。\n@c0@"
  tl: "@a@b%a002020：要是把洞堵上，\n　　就一了百了了呢。\n@c0@"
186:
  en: "@a%0%a002030@bIt is a relief indeed to have such a diligent fellow standing guard.\n@c0@"
  ja: "@a@b%a002030「こうして　兵隊さんが\n\t見はってて　くれれば\n\t安心ですね。\n@c0@"
  ko: "@a@b%a002030: 이렇게 병사님이\n지켜 주신다면\n안심할 수 있겠군요.\n@c0@"
  sl: "@a@b%a002030：有士兵把守着这里，\n　　大家放心多了呢。\n@c0@"
  tl: "@a@b%a002030：有士兵把守著這裡，\n　　大家放心多了呢。\n@c0@"
187:
  en: "@a%0%a002050@bIt looks like our work here is done!\n@c0@"
  ja: "@a@b%a002050「もう　この　洞くつは\n\tいいですね。\n@c0@"
  ko: "@a@b%a002050: 이 동굴은 이제\n안 왔으면 좋겠습니다.\n@c0@"
  sl: "@a@b%a002050：这个洞窟\n　　不会再有事了吧。\n@c0@"
  tl: "@a@b%a002050：這個洞窟\n　　不會再有事了吧。\n@c0@"
188:
  en: "@a%0%a002000@bSo this is the other side, aye?\n@c0@"
  ja: "@a@b%a002000「反対がわに\n\t出た　ようだな。\n@c0@"
  ko: "@a@b%a002000: 반대편으로\n나온 모양이군.\n@c0@"
  sl: "@a@b%a002000：好像已经\n　　走到对面了呢。\n@c0@"
  tl: "@a@b%a002000：好像已經\n　　走到對面了呢。\n@c0@"
189:
  en: "@a%0%a002010@bThis must be where people stop to rest when they travel through to this side...\n@c0@"
  ja: "@a@b%a002010「反対がわの\n\tきゅうけいしつね。\n@c0@"
  ko: "@a@b%a002010: 반대편\n휴식처네.\n@c0@"
  sl: "@a@b%a002010：这里是洞窟\n　　另一边的休息室呢。\n@c0@"
  tl: "@a@b%a002010：這裡是洞窟\n　　另一邊的休息室呢。\n@c0@"
190:
  en: "@a%0%a002020@bIt feels like we're pretty close to the exit.\n@c0@"
  ja: "@a@b%a002020「もうちょっとで\n\t外に　出られそうな\n\tふんいきだね。\n@c0@"
  ko: "@a@b%a002020: 조금만 더 가면\n밖으로 나갈 수 있을 것 같은\n분위기야.\n@c0@"
  sl: "@a@b%a002020：好像马上\n　　就能走到外面了呢。\n@c0@"
  tl: "@a@b%a002020：好像馬上\n　　就能走到外面了呢。\n@c0@"
191:
  en: "@a%0%a002030@bNow that the construction work is complete, it is a rather fast trip through the pass.\n@c0@"
  ja: "@a@b%a002030「工事が　終わってしまうと\n\tこちらがわ　までは　すぐですね。\n@c0@"
  ko: "@a@b%a002030: 공사가 끝나니\n여기까지는 금방 오는군요.\n@c0@"
  sl: "@a@b%a002030：施工结束的话，\n　　很快就能走到对面了呢。\n@c0@"
  tl: "@a@b%a002030：施工結束的話，\n　　很快就能走到對面了呢。\n@c0@"
192:
  en: "@a%0%a002050@b(sniff) Is it me or does the air here smell different?\n@c0@"
  ja: "@a@b%a002050「くんくん……。\n\t気のせいか　ちがう土地の\n\tにおいが　します。\n@c0@"
  ko: "@a@b%a002050: 킁킁......\n기분 탓인지 다른 땅의\n냄새가 나네요.\n@c0@"
  sl: "@a@b%a002050：唔……\n　　总觉得这里氛围与众不同，\n　　是我的错觉吧。\n@c0@"
  tl: "@a@b%a002050：唔……\n　　總覺得這裡氛圍與眾不同，\n　　是我的錯覺吧。\n@c0@"
193:
  en: "@a%0%a002000@bLet's change the subject, aye?\n@c0@"
  ja: "@a@b%a002000「また　アイツの\n\tことか……。\n@c0@"
  ko: "@a@b%a002000: 또 그 녀석\n얘기냐......\n@c0@"
  sl: "@a@b%a002000：又在说那个家伙……\n@c0@"
  tl: "@a@b%a002000：又在說那個傢伙……\n@c0@"
194:
  en: "@a%0%a002010@bI wonder where that swordsman could have gotten to by now...\n@c0@"
  ja: "@a@b%a002010「青い剣士さん……\n\tいまごろ　どこかしらね。\n@c0@"
  ko: "@a@b%a002010: 파란 옷 검사......\n지금쯤 어디에 있을까?\n@c0@"
  sl: "@a@b%a002010：蓝衣服剑士……\n　　不知道他现在在哪。\n@c0@"
  tl: "@a@b%a002010：藍衣服劍士……\n　　不知道他現在在哪。\n@c0@"
195:
  en: "@a%0%a002020@bEveryone around here must be happy that Wayfarer's Pass is open again.\n@c0@"
