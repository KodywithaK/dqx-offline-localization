0:
  en: "@a@b*: Welcome to the Fashion Forge! We take your ordinary equipment and make it extraordinary!\n@c0@"
  ja: "@a@b＊「オレは　オシャレなかじやよ。\n\tあんたの武器や　防具を\n\tたたき直してやるぜ。\n@c0@"
  ko: "@a@b*: 나는 멋내기 대장간의 대장장이.\n당신의 무기와 방어구를\n개조해 줄게.\n@c0@"
  sl: "@a@b＊：我这里是时尚锻造屋。\n　　能够为你重新锻造\n　　武器和防具。\n@c0@"
  tl: "@a@b＊：我這裡是時尚鍛造屋。\n　　能夠為你重新鍛造\n　　武器和防具。\n@c0@"
1:
