  ja: "@a@b＊「今　持ってる　武器や防具を\n\tもっと　かっこよくしたいと\n\t思わねえかい？\n@c0@"
  ko: "@a@b*: 지금 가지고 있는 무기와 방어구를\n더 멋있게\n만들고 싶지 않아?\n@c0@"
  sl: "@a@b＊：想不想让你现在持有的\n　　武器和防具看起来\n　　更加帅气一点呢？\n@c0@"
  tl: "@a@b＊：想不想讓你現在持有的\n　　武器和防具看起來\n　　更加帥氣一點呢？\n@c0@"
