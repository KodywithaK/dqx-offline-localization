0:
  en: "@a%0%a002000@bHardy har! I thought the whole continent would know we whupped Murdaw by now!\n@c0@"
  ja: "@a@b%a002000「どこに行っても\n\tもう　ムドーを　倒したことは\n\t伝わってると　思ったのにな。\n@c0@"
  ko: "@a@b%a002000: 이제 어딜 가도\n무도를 쓰러뜨린 얘기가\n알려져 있으리라 생각했는데.\n@c0@"
  sl: "@a@b%a002000：还以为姆多被消灭的消息，\n　　已经传遍世界各地了呢。\n@c0@"
  tl: "@a@b%a002000：還以為姆多被消滅的消息，\n　　已經傳遍世界各地了呢。\n@c0@"
1:
  en: "@a%0%a002010@bEven among the Somnian military, there are those who haven't yet heard the news...\n@c0@"
  ja: "@a@b%a002010「レイドックの　兵隊さんでも\n\tまだ　ムドーの話を\n\t聞いてない人がいるのね。\n@c0@"
  ko: "@a@b%a002010: 레이독의 병사인데도\n아직 무도 이야기를\n못 들은 사람이 있구나.\n@c0@"
  sl: "@a@b%a002010：就算是雷多克城的士兵，\n　　也有人不知道\n　　姆多已经被消灭了呢。\n@c0@"
  tl: "@a@b%a002010：就算是雷多克城的士兵，\n　　也有人不知道\n　　姆多已經被消滅了呢。\n@c0@"
2:
  en: "@a%0%a002020@bI bet guard duty will be a lot easier from now on.\n@c0@"
  ja: "@a@b%a002020「これからは\n\t関所の　けいびの　仕事も\n\tだいぶ　ラクになるかもね。\n@c0@"
  ko: "@a@b%a002020: 앞으로는\n관문 경비 일도\n많이 편해지겠네.\n@c0@"
  sl: "@a@b%a002020：今后关卡的\n　　警备工作也会\n　　变得轻松不少吧。\n@c0@"
  tl: "@a@b%a002020：今後關卡的\n　　警備工作也會\n　　變得輕鬆不少吧。\n@c0@"
3:
  en: "@a%0%a002030@bNews travels slowly to outposts such as these.\n@c0@"
  ja: "@a@b%a002030「まだ　ここまでは\n\t伝わってませんでしたか。\n@c0@"
  ko: "@a@b%a002030: 아직 여기까지는\n전해지지 않았군요.\n@c0@"
  sl: "@a@b%a002030：还没有传到\n　　这里来吗？\n@c0@"
  tl: "@a@b%a002030：還沒有傳到\n　　這裡來嗎？\n@c0@"
4:
  en: "@a%0%a002050@bAnd there was me thinkin' that the world and its mother had heard the news...\n@c0@"
  ja: "@a@b%a002050「みんな　とっくに\n\t知ってると　思ってましたが……。\n@c0@"
  ko: "@a@b%a002050: 모두 진작에\n알고 있을 줄 알았는데......\n@c0@"
  sl: "@a@b%a002050：我还以为\n　　大家早就知道了呢……\n@c0@"
  tl: "@a@b%a002050：我還以為\n　　大家早就知道了呢……\n@c0@"
5:
  en: "@a%0%a002040@bThis guy's really out of touch...\n@c0@"
  ja: "@a@b%a002040「いまどき\n\tまのぬけた　質問だな。\n@c0@"
  ko: "@a@b%a002040: 이제 와서\n그런 멍청한 질문을 하는군.\n@c0@"
  sl: "@a@b%a002040：这问题现在问，\n　　真是愚蠢。\n@c0@"
  tl: "@a@b%a002040：這問題現在問，\n　　真是愚蠢。\n@c0@"
6:
  en: "@a%0%a002000@bC'mon, %a000090! A little good news would make that guy's day!\n@c0@"
  ja: "@a@b%a002000「あーあ　じょうだんを\n\t信じちゃったぜ。\n@c0@"
  ko: "@a@b%a002000: 이런~ 농담을\n믿어 버렸군.\n@c0@"
  sl: "@a@b%a002000：啊，开个玩笑\n　　被当真了。\n@c0@"
  tl: "@a@b%a002000：啊，開個玩笑\n　　被當真了。\n@c0@"
7:
  en: "@a%0%a002010@bWilful contrariness is a sign of immaturity, %a000090.\n@c0@"
  ja: "@a@b%a002010「つい反対のことを\n\t言ってしまう　%a000090って\n\tまだまだ　子供なのかもね。\n@c0@"
  ko: "@a@b%a002010: 이럴 때 꼭\n반대로 말하는 %a000090%F0090%X는%Y은%Z\n아직 어린애 같아.\n@c0@"
  sl: "@a@b%a002010：%a000090\n　　不经意间会说出反话来，\n　　真像个小孩子呢。\n@c0@"
  tl: "@a@b%a002010：%a000090\n　　不經意間會說出反話來，\n　　真像個小孩子呢。\n@c0@"
8:
  en: "@a%0%a002020@bOh, come on! Just tell him the truth!\n@c0@"
  ja: "@a@b%a002020「ちゃんと\n\t教えてあげれば　いいのにー！\n@c0@"
  ko: "@a@b%a002020: 진실을 제대로\n알려 주자구~!\n@c0@"
  sl: "@a@b%a002020：刚才要是\n　　说出实话就好了！\n@c0@"
  tl: "@a@b%a002020：剛才要是\n　　說出實話就好了！\n@c0@"
9:
  en: "@a%0%a002030@bI suppose he will have to use his own judgement to discern the truth.\n@c0@"
  ja: "@a@b%a002030「どちらの　じょうほうが\n\t本当なのか　この方が　自分で\n\t判断なさるでしょうが……。\n@c0@"
  ko: "@a@b%a002030: 어느 쪽 정보가\n진짜인지는 이분이 스스로\n판단하시겠지요......\n@c0@"
  sl: "@a@b%a002030：这个人真的\n　　能自己判断\n　　信息的真伪么……\n@c0@"
  tl: "@a@b%a002030：這個人真的\n　　能自己判斷\n　　信息的真偽麼……\n@c0@"
10:
  en: "@a%0%a002050@bI hope he doesn't get upset with us when he finds out the truth!\n@c0@"
  ja: "@a@b%a002050「この人　あとで\n\t本当のことを　知ったら\n\tおこりませんかね……。\n@c0@"
  ko: "@a@b%a002050: 이 사람, 나중에\n진실을 알면\n화내지 않을까요......\n@c0@"
  sl: "@a@b%a002050：这人要是以后\n　　知道了实情的话，\n　　会不会生气啊……\n@c0@"
  tl: "@a@b%a002050：這人要是以後\n　　知道了實情的話，\n　　會不會生氣啊……\n@c0@"
11:
  en: "@a%0%a002040@bIs there a particular reason you're doling out misleading information, %a000090?\n@c0@"
  ja: "@a@b%a002040「なぜ　そんな\n\tてきとうな　返事をしたのか\n\tオレには　わからないな。\n@c0@"
  ko: "@a@b%a002040: 왜 그런\n생각 없는 대답을 했는지\n난 도통 모르겠군.\n@c0@"
  sl: "@a@b%a002040：我完全不明白，\n　　为什么要\n　　如此随便作出答复。\n@c0@"
  tl: "@a@b%a002040：我完全不明白，\n　　為什麼要\n　　如此隨便作出答復。\n@c0@"
12:
  en: "@a%0%a002000@bHe's sleepin' like a log.\n@c0@"
  ja: "@a@b%a002000「よく　ねてるなあ。\n@c0@"
  ko: "@a@b%a002000: 잘 자는군.\n@c0@"
  sl: "@a@b%a002000：睡得真沉啊。\n@c0@"
  tl: "@a@b%a002000：睡得真沉啊。\n@c0@"
13:
  en: "@a%0%a002010@bHe must be on a break.\n@c0@"
  ja: "@a@b%a002010「あら　お休み中だったのね。\n@c0@"
  ko: "@a@b%a002010: 어머, 휴식 중인가 봐.\n@c0@"
  sl: "@a@b%a002010：哎呀，正在休息呢。\n@c0@"
  tl: "@a@b%a002010：哎呀，正在休息呢。\n@c0@"
14:
  en: "@a%0%a002020@bBeing a checkpoint guard sure looks like a relaxing job...\n@c0@"
  ja: "@a@b%a002020「関所の　けいびって\n\tじつは　ヒマなのかな。\n@c0@"
  ko: "@a@b%a002020: 관문 경비는\n알고 보면 한가한 거 아냐?\n@c0@"
  sl: "@a@b%a002020：关卡的警备，\n　　其实是个清闲差事吧。\n@c0@"
  tl: "@a@b%a002020：關卡的警備，\n　　其實是個清閒差事吧。\n@c0@"
15:
  en: "@a%0%a002030@bLet's leave him be until his shift begins.\n@c0@"
  ja: "@a@b%a002030「こうたいの　時間まで\n\tそっとしておいて　あげましょう。\n@c0@"
  ko: "@a@b%a002030: 교대 시간까지\n내버려두자구요.\n@c0@"
  sl: "@a@b%a002030：就让他好好歇到\n　　换班的时间为止吧。\n@c0@"
  tl: "@a@b%a002030：就讓他好好歇到\n　　換班的時間為止吧。\n@c0@"
16:
  en: "@a%0%a002050@bMust be tirin', guardin' these checkpoints...\n@c0@"
  ja: "@a@b%a002050「おつかれの　ごようす……。\n@c0@"
  ko: "@a@b%a002050: 피곤해 보이는군요......\n@c0@"
  sl: "@a@b%a002050：看起来很疲倦呢……\n@c0@"
  tl: "@a@b%a002050：看起來很疲倦呢……\n@c0@"
17:
  en: "@a%0%a002050@bWell, sweet dreams, fellow!\n@c0@"
  ja: "@a@b%a002050「兵隊さん！\n\tごくろうさまです！\n@c0@"
  ko: "@a@b%a002050: 병사님!\n수고 많으십니다!\n@c0@"
  sl: "@a@b%a002050：士兵先生！\n　　你辛苦了！\n@c0@"
  tl: "@a@b%a002050：士兵先生！\n　　你辛苦了！\n@c0@"
18:
  en: "@a%0%a002040@bHe certainly knows how to sleep...\n@c0@"
  ja: "@a@b%a002040「よく　寝てるな……。\n@c0@"
  ko: "@a@b%a002040: 잘 자는군......\n@c0@"
  sl: "@a@b%a002040：睡得真香啊……\n@c0@"
  tl: "@a@b%a002040：睡得真香啊……\n@c0@"
19:
  en: "@a%0%a002000@b‘Crazy’, aye? Crazy how, I wonder?\n@c0@"
  ja: "@a@b%a002000「おかしなこと　かあ。\n\tそれだけじゃ　どんな　話か\n\t想像が　つかないな。\n@c0@"
  ko: "@a@b%a002000: 웃기는 소리라.\n그것만으로는 어떤 이야기인지\n상상이 안 가는군.\n@c0@"
  sl: "@a@b%a002000：奇怪的话啊。\n　　仅凭这点，\n　　俺完全摸不着头脑啊。\n@c0@"
  tl: "@a@b%a002000：奇怪的話啊。\n　　僅憑這點，\n　　俺完全摸不著頭腦啊。\n@c0@"
20:
  en: "@a%0%a002010@bI must admit, I'm rather intrigued by this ‘coot’.\n@c0@"
  ja: "@a@b%a002010「どんなことを\n\t言っているのか　ちょっとだけ\n\tきょうみが　あるわね。\n@c0@"
  ko: "@a@b%a002010: 어떤 얘기를\n하는지 조금\n흥미가 생기는걸.\n@c0@"
  sl: "@a@b%a002010：我忽然对\n　　他说的事\n　　有点兴趣了呢。\n@c0@"
  tl: "@a@b%a002010：我忽然對\n　　他說的事\n　　有點興趣了呢。\n@c0@"
21:
  en: "@a%0%a002020@bToo bad we can't cart the Providence into this world...\n@c0@"
  ja: "@a@b%a002020「こちらの　世界では\n\t神の船は　ないしなあ……。\n@c0@"
  ko: "@a@b%a002020: 이쪽 세계에서는\n신의 배도 없고......\n@c0@"
  sl: "@a@b%a002020：这边这个世界\n　　没有神之船呢……\n@c0@"
  tl: "@a@b%a002020：這邊這個世界\n　　沒有神之船呢……\n@c0@"
22:
  en: "@a%0%a002030@bWell, until we find a suitable means of transport, let us make a mental note of this information.\n@c0@"
  ja: "@a@b%a002030「行ける方法が\n\t見つかるまで　心に　とめて\n\tおきましょうか。\n@c0@"
  ko: "@a@b%a002030: 갈 방법을\n찾을 때까지는 마음속에\n묻어 둡시다.\n@c0@"
  sl: "@a@b%a002030：在找到\n　　去那里的方法之前，\n　　还是不要太纠结于这件事比较好。\n@c0@"
  tl: "@a@b%a002030：在找到\n　　去那裡的方法之前，\n　　還是不要太糾結於這件事比較好。\n@c0@"
23:
  en: "@a%0%a002050@bA crazy old coot? He sounds like he might be a good laugh.\n@c0@"
  ja: "@a@b%a002050「おかしなことをいうって\n\tその老人は　お笑い芸人みたいな\n\t人なんでしょうかね！？\n@c0@"
  ko: "@a@b%a002050: 웃기는 소리를 한다니,\n그 노인은 광대 같은\n사람일까요!?\n@c0@"
  sl: "@a@b%a002050：说奇怪的话……\n　　那个老人难不成是\n　　搞笑艺人什么的吗？！\n@c0@"
  tl: "@a@b%a002050：說奇怪的話……\n　　那個老人難不成是\n　　搞笑藝人什麼的嗎？！\n@c0@"
24:
  en: "@a%0%a002040@bHaven't we got enough on our plates without adding crazy old coots to the menu?\n@c0@"
  ja: "@a@b%a002040「おかしなことをいう\n\t老人になど　会う必要は\n\tないだろう。\n@c0@"
  ko: "@a@b%a002040: 웃기는 소리를 하는\n노인을 굳이 만날 필요는\n없겠지.\n@c0@"
  sl: "@a@b%a002040：说奇怪的话的老头，\n　　有见他的必要么。\n@c0@"
  tl: "@a@b%a002040：說奇怪的話的老頭，\n　　有見他的必要麼。\n@c0@"
