  sl: "@a@b%a002050：真想进他的梦里去，\n　　看看他到底干了什么。\n@c0@"
  tl: "@a@b%a002050：真想進他的夢裡去，\n　　看看他到底幹了什麼。\n@c0@"
70:
  en: "@a%0%a002000@bHe really doesn't like to let a potential customer get away, huh?\n@c0@"
