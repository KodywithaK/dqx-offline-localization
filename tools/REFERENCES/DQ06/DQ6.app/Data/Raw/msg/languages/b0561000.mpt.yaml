176:
  en: "@a%0%a002000@bAll the way from Somnia, aye? That Tom Foolery must put on one heck of a show!\n@c0@"
  ja: "@a@b%a002000「わざわざ　レイドック城から\n\tこの町まで　来たのかよ。\n\tパノンってのは　すごい旅芸人なんだな。\n@c0@"
  ko: "@a@b%a002000: 레이독 성에서 이 마을까지\n그 먼 길을 왔다고?\n파논이란 자, 대단한 유랑 광대인가 보군.\n@c0@"
  sl: "@a@b%a002000：特地从雷多克城\n　　追到这个镇子啊。\n　　这个叫帕农的旅行艺人这么有魅力啊。\n@c0@"
  tl: "@a@b%a002000：特地從雷多克城\n　　追到這個鎮子啊。\n　　這個叫帕農的旅行藝人這麼有魅力啊。\n@c0@"
177:
  en: "@a%0%a002010@bThat's entertainers for you — they flit about like leaves on a breeze.\n@c0@"
  ja: "@a@b%a002010「旅芸人ですものね。\n\t風みたいに　世界を飛び回って\n\tいるのかしら。\n@c0@"
  ko: "@a@b%a002010: 유랑 광대잖아.\n바람처럼 세상을\n떠돌고 있는 거 아닐까?\n@c0@"
  sl: "@a@b%a002010：旅行艺人啊。\n　　一定是像风一样\n　　奔走于世界各地吧。\n@c0@"
  tl: "@a@b%a002010：旅行藝人啊。\n　　一定是像風一樣\n　　奔走於世界各地吧。\n@c0@"
178:
  en: "@a%0%a002020@bOoh! She's making me want to get into show business too!\n@c0@"
  ja: "@a@b%a002020「あたしも　パノンに\n\t弟子入り　してみたーい！\n@c0@"
  ko: "@a@b%a002020: 나도 파논의\n제자로 들어가 보고 싶어~!\n@c0@"
  sl: "@a@b%a002020：我也想拜帕农为师了！\n@c0@"
  tl: "@a@b%a002020：我也想拜帕農為師了！\n@c0@"
179:
  en: "@a%0%a002030@bI'm sure this Tom Foolery never made it as far as Ghent.\n@c0@"
  ja: "@a@b%a002030「旅芸人パノン……。\n\tゲントの村には　来たことが\n\tありませんね。\n@c0@"
  ko: "@a@b%a002030: 유랑 광대 파논......\n겐트 마을에는 온 적이\n없습니다.\n@c0@"
  sl: "@a@b%a002030：旅行艺人帕农……\n　　没有去过根特村呢。\n@c0@"
  tl: "@a@b%a002030：旅行藝人帕農……\n　　沒有去過根特村呢。\n@c0@"
180:
  en: "@a%0%a002050@bIf anyone needs a laugh, old %a002050 is always on hand to supply jokes, japes and joviality!\n@c0@"
  ja: "@a@b%a002050「人を笑わせるようなことが\n\t私にも　できればいいのですが……。\n@c0@"
  ko: "@a@b%a002050: 저한테도 남을 웃기는\n재주가 있었으면 좋겠군요......\n@c0@"
  sl: "@a@b%a002050：逗人们笑啊。\n　　要是我也能做到的话就好了……\n@c0@"
  tl: "@a@b%a002050：逗人們笑啊。\n　　要是我也能做到的話就好了……\n@c0@"
181:
  en: "@a%0%a002000@bShe ain't too ugly if you don't mind manly hands...\n@c0@"
  ja: "@a@b%a002000「た　たのむから\n\tオレに　近よらせないでくれ！\n@c0@"
  ko: "@a@b%a002000: 부, 부탁이니까\n나한텐 다가오지 말아 줘!\n@c0@"
  sl: "@a@b%a002000：求你了，\n　　离俺远点行不！\n@c0@"
  tl: "@a@b%a002000：求你了，\n　　離俺遠點行不！\n@c0@"
182:
  en: "@a%0%a002010@bLook at that five o'clock shadow...\n@c0@"
  ja: "@a@b%a002010「ヒゲの\n\tそりあとが　こい人ね……。\n@c0@"
  ko: "@a@b%a002010: 수염 자국이\n짙은데......\n@c0@"
  sl: "@a@b%a002010：这人胡渣好多……\n@c0@"
  tl: "@a@b%a002010：這人胡渣好多……\n@c0@"
183:
  en: "@a%0%a002020@bNo offence, but, uh...no thanks.\n@c0@"
  ja: "@a@b%a002020「あー　ダメだ！\n\t今日　ねられないよー。\n\tぜったいに　夢見るよー！\n@c0@"
  ko: "@a@b%a002020: 아~ 안 돼!\n오늘 밤에 잠 못 잔다구~\n꿈에 나올 것 같아!\n@c0@"
  sl: "@a@b%a002020：啊，不行！\n　　今晚睡不成了。\n　　绝对会梦见这个人的！\n@c0@"
  tl: "@a@b%a002020：啊，不行！\n　　今晚睡不成了。\n　　絕對會夢見這個人的！\n@c0@"
184:
  en: "@a%0%a002030@bWe give thanks to the Goddess for filling our world with people of all shapes and sizes...\n@c0@"
  ja: "@a@b%a002030「ゲントの神よ\n\t天バツを　あたえたまえ……。\n@c0@"
  ko: "@a@b%a002030: 겐트 신이시여,\n천벌을 내려 주소서......\n@c0@"
  sl: "@a@b%a002030：根特之神啊，\n　　请惩罚这个人……\n@c0@"
  tl: "@a@b%a002030：根特之神啊，\n　　請懲罰這個人……\n@c0@"
185:
  en: "@a%0%a002050@bThat would be a fine lookin' lass — if it were a lass...\n@c0@"
  ja: "@a@b%a002050「男って　わかってなかったら\n\tいいんですけどねえ……。\n@c0@"
  ko: "@a@b%a002050: 남자라는 걸 몰랐다면\n좋았을 텐데......\n@c0@"
  sl: "@a@b%a002050：要是不知道\n　　他是男的就好了啊……\n@c0@"
  tl: "@a@b%a002050：要是不知道\n　　他是男的就好了啊……\n@c0@"
186:
  en: "@a%0%a002000@bDestiny's Drop is north-east of here, aye? I'm committin' that to memory...\n@c0@"
  ja: "@a@b%a002000「この町の　北東に\n\t運命のカベが　あるんだな。\n\tそのくらいなら　覚えられるぜ。\n@c0@"
  ko: "@a@b%a002000: 이 마을 북동쪽에\n운명의 벽이 있군.\n그 정도는 외울 수 있어.\n@c0@"
  sl: "@a@b%a002000：镇子东北方\n　　有一面命运之墙。\n　　这点俺还是能记得住。\n@c0@"
  tl: "@a@b%a002000：鎮子東北方\n　　有一面命運之牆。\n　　這點俺還是能記得住。\n@c0@"
187:
  en: "@a%0%a002010@bSomething horrible must have happened to this Matt...\n@c0@"
  ja: "@a@b%a002010「ハリスさんと\n\tマゴットさん　という方たちの\n\tお子さんに　何か　あったみたいね。\n@c0@"
  ko: "@a@b%a002010: 해리스 씨와\n마고트 씨라는 사람들의 아드님에게\n무슨 일이 생겼나 보네.\n@c0@"
  sl: "@a@b%a002010：哈里斯和\n　　玛格特的孩子\n　　好像发生了什么事。\n@c0@"
  tl: "@a@b%a002010：哈里斯和\n　　瑪格特的孩子\n　　好像發生了什麼事。\n@c0@"
188:
  en: "@a%0%a002020@bWhat kind of badge did Tom Foolery promise him, I wonder...\n@c0@"
  ja: "@a@b%a002020「パノンと　ジョンくんの\n\t約束って　なんだろうね。\n@c0@"
  ko: "@a@b%a002020: 파논과 존이 했다던\n약속이 뭘까?\n@c0@"
  sl: "@a@b%a002020：帕农和约翰的约定，\n　　到底是什么啊？\n@c0@"
  tl: "@a@b%a002020：帕農和約翰的約定，\n　　到底是什麼啊？\n@c0@"
189:
  en: "@a%0%a002030@bCan Destiny's Drop really be so steep that he judges it impossible to scale?\n@c0@"
  ja: "@a@b%a002030「この人が　あきらめるほど\n\t運命のカベ　というのは\n\tけわしいもの　なのでしょう。\n@c0@"
  ko: "@a@b%a002030: 운명의 벽은\n이 사람이 포기할 정도로\n험준한 모양이군요.\n@c0@"
  sl: "@a@b%a002030：命运之墙那么险峻，\n　　让这个人都放弃了啊。\n@c0@"
  tl: "@a@b%a002030：命運之牆那麼險峻，\n　　讓這個人都放棄了啊。\n@c0@"
190:
  en: "@a%0%a002050@bI can't wait to get a look at Destiny's Drop. I'm less keen on actually climbin' the thing, though...\n@c0@"
  ja: "@a@b%a002050「そんなに　すごいカベなら\n\t私　見てみたいです！\n\tのぼらなくても　いいですが。\n@c0@"
  ko: "@a@b%a002050: 그렇게 대단한 벽이라면\n꼭 한번 보고 싶군요!\n오르지 않더라도요.\n@c0@"
  sl: "@a@b%a002050：那么厉害的墙，\n　　我真想看一看呢！\n　　哪怕只是看看。\n@c0@"
  tl: "@a@b%a002050：那麼厲害的牆，\n　　我真想看一看呢！\n　　哪怕只是看看。\n@c0@"
191:
  en: "@a%0%a002000@bDestiny's Drop is north-east, aye? Let's go have a look-see, %a000090!\n@c0@"
  ja: "@a@b%a002000「運命のカベは\n\tこの町から　北東なんだな。\n\t行ってみるか　%a000090！\n@c0@"
  ko: "@a@b%a002000: 운명의 벽은\n이 마을 북동쪽에 있군.\n가 볼까, %a000090!\n@c0@"
  sl: "@a@b%a002000：命运之墙在\n　　这个镇子的东北方啊。\n　　去看看吧，%a000090！\n@c0@"
  tl: "@a@b%a002000：命運之牆在\n　　這個鎮子的東北方啊。\n　　去看看吧，%a000090！\n@c0@"
192:
  en: "@a%0%a002010@bClimbing Destiny's Drop has become part of our own destiny, don't you think?\n@c0@"
  ja: "@a@b%a002010「運命のカベに　のぼるのも\n\t私たちの　運命なのかも\n\tしれないわね。\n@c0@"
  ko: "@a@b%a002010: 운명의 벽에 오르는 게\n우리의 운명일지도\n몰라.\n@c0@"
  sl: "@a@b%a002010：攀登命运之墙，\n　　说不定也是我们的命运。\n@c0@"
  tl: "@a@b%a002010：攀登命運之牆，\n　　說不定也是我們的命運。\n@c0@"
193:
  en: "@a%0%a002020@bI guess now's the part where we go get that badge for them, huh?\n@c0@"
  ja: "@a@b%a002020「こりゃもう\n\tあたしたちが　やるっきゃ\n\tないんじゃない？\n@c0@"
  ko: "@a@b%a002020: 이건 뭐\n우리가 하는 수밖에\n없지 않을까?\n@c0@"
  sl: "@a@b%a002020：这下子，\n　　咱非做不可了吧？\n@c0@"
  tl: "@a@b%a002020：這下子，\n　　咱非做不可了吧？\n@c0@"
194:
  en: "@a%0%a002020@bAfter all, we can't let little Matty down, can we?\n@c0@"
  ja: "@a@b%a002020「そうしたら　ジョンくんも\n\tきっと　よろこんでくれるよ！\n@c0@"
  ko: "@a@b%a002020: 그러면 존도\n분명히 기뻐할 거야!\n@c0@"
  sl: "@a@b%a002020：那样的话，\n　　约翰一定也会高兴的！\n@c0@"
  tl: "@a@b%a002020：那樣的話，\n　　約翰一定也會高興的！\n@c0@"
195:
  en: "@a%0%a002030@bI have absolute faith that no mountain or cliff can defeat us.\n@c0@"
  ja: "@a@b%a002030「きっと　私たちなら\n\tけわしい山も　運命のカベも\n\tのりきれますよ。\n@c0@"
  ko: "@a@b%a002030: 우리라면 틀림없이\n험준한 산도, 운명의 벽도\n넘을 수 있을 겁니다.\n@c0@"
  sl: "@a@b%a002030：不管是崇山峻岭，\n　　还是命运之墙，\n　　我们一定都能征服的。\n@c0@"
  tl: "@a@b%a002030：不管是崇山峻嶺，\n　　還是命運之牆，\n　　我們一定都能征服的。\n@c0@"
196:
  en: "@a%0%a002050@bSo we're settin' our sights on Destiny's Drop, are we? Righto! To the north-east we go!\n@c0@"
  ja: "@a@b%a002050「めざすは　北東にある\n\t運命のカベですかね！\n@c0@"
  ko: "@a@b%a002050: 북동쪽에 있는\n운명의 벽을 향해 가 볼까요!\n@c0@"
  sl: "@a@b%a002050：朝着东北方的\n　　命运之墙前进！\n@c0@"
  tl: "@a@b%a002050：朝著東北方的\n　　命運之牆前進！\n@c0@"
197:
  en: "@a%0%a002000@bThat's...that's a tough one, aye.\n@c0@"
  ja: "@a@b%a002000「そういう話……\n\tつらいよな。\n@c0@"
  ko: "@a@b%a002000: 그런 이야기는......\n하기 힘들지.\n@c0@"
  sl: "@a@b%a002000：这事……\n　　真让人难受。\n@c0@"
  tl: "@a@b%a002000：這事……\n　　真讓人難受。\n@c0@"
198:
  en: "@a%0%a002010@bLosing someone is never easy.\n@c0@"
  ja: "@a@b%a002010「別れは　かならず\n\tやってくるものだけどね……。\n@c0@"
  ko: "@a@b%a002010: 이별은 반드시\n찾아오는 법이지만......\n@c0@"
  sl: "@a@b%a002010：天下没有\n　　不散的宴席呢……\n@c0@"
  tl: "@a@b%a002010：天下沒有\n　　不散的宴席呢……\n@c0@"
199:
  en: "@a%0%a002020@bI hate goodbyes, you know.\n@c0@"
  ja: "@a@b%a002020「人の　別れって\n\tつらいよね……\n@c0@"
  ko: "@a@b%a002020: 누군가와 이별한다는 건\n힘든 일이야......\n@c0@"
  sl: "@a@b%a002020：跟人道别\n　　是件难过的事呢……\n@c0@"
  tl: "@a@b%a002020：跟人道別\n　　是件難過的事呢……\n@c0@"
200:
  en: "@a%0%a002020@bWhen I say my final farewell, I hope it's with a smile on my face!\n@c0@"
  ja: "@a@b%a002020「でも　あたしだったら\n\t笑って　さよならが　できるといいな！\n@c0@"
  ko: "@a@b%a002020: 하지만 난\n웃으면서 작별할 수 있었으면 좋겠어!\n@c0@"
  sl: "@a@b%a002020：不过要是我的话，\n　　能微笑着说声再见就好了呢！\n@c0@"
  tl: "@a@b%a002020：不過要是我的話，\n　　能微笑著說聲再見就好了呢！\n@c0@"
201:
  en: "@a%0%a002030@bThere are things which children are too young to fully understand.\n@c0@"
  ja: "@a@b%a002030「小さい　お子さんが\n\tりかいするには　なかなか\n\tむずかしい　ことですよね……。\n@c0@"
  ko: "@a@b%a002030: 어린아이가\n이해하기에는 정말\n어려운 문제지요......\n@c0@"
  sl: "@a@b%a002030：小孩子\n　　应该不太能\n　　理解这件事吧……\n@c0@"
  tl: "@a@b%a002030：小孩子\n　　應該不太能\n　　理解這件事吧……\n@c0@"
202:
  en: "@a%0%a002050@bI wouldn't know how to break news like that to a little lass either...\n@c0@"
  ja: "@a@b%a002050「うーん……。\n\tどう　話したら　いいでしょうねえ。\n\tうーん　うーん……。\n@c0@"
  ko: "@a@b%a002050: 으음......\n어떻게 얘기하면 좋을까요.\n으음, 으음......\n@c0@"
  sl: "@a@b%a002050：唔……\n　　该怎么说好呢。\n　　唔、唔……\n@c0@"
  tl: "@a@b%a002050：唔……\n　　該怎麼說好呢。\n　　唔、唔……\n@c0@"
203:
  en: "@a%0%a002000@bDid her friend skedaddle on her or something?\n@c0@"
  ja: "@a@b%a002000「友だちが\n\tどっか　行っちゃったのか？\n@c0@"
  ko: "@a@b%a002000: 친구가\n어디로 가 버렸어?\n@c0@"
  sl: "@a@b%a002000：是不是朋友\n　　去哪里了啊？\n@c0@"
  tl: "@a@b%a002000：是不是朋友\n　　去哪裡了啊？\n@c0@"
204:
  en: "@a%0%a002010@bHas Matt disappeared, then?\n@c0@"
  ja: "@a@b%a002010「ジョンくんが\n\tゆくえ　ふめい　なの？\n@c0@"
  ko: "@a@b%a002010: 존이\n사라져 버린 거야?\n@c0@"
  sl: "@a@b%a002010：约翰下落不明了？\n@c0@"
  tl: "@a@b%a002010：約翰下落不明了？\n@c0@"
205:
  en: "@a%0%a002020@bWell, that promise seemed a little...inappropriate.\n@c0@"
  ja: "@a@b%a002020「かわった　約束を\n\tしていたのね……。\n@c0@"
  ko: "@a@b%a002020: 희한한 약속을\n했네......\n@c0@"
  sl: "@a@b%a002020：跟人定下了\n　　奇怪的约定呢……\n@c0@"
  tl: "@a@b%a002020：跟人定下了\n　　奇怪的約定呢……\n@c0@"
206:
  en: "@a%0%a002030@bPerhaps this Matt will be home in time for his dinner?\n@c0@"
  ja: "@a@b%a002030「ゆうはん　までには\n\tもどってくるのでは\n\tないですかね。\n@c0@"
  ko: "@a@b%a002030: 저녁 먹기 전에는\n돌아오지\n않을까요?\n@c0@"
  sl: "@a@b%a002030：晚饭之前\n　　可能不会回来吧。\n@c0@"
  tl: "@a@b%a002030：晚飯之前\n　　可能不會回來吧。\n@c0@"
207:
  en: "@a%0%a002050@bA bed's not for ridin' on — it's for sleepin' in!\n@c0@"
  ja: "@a@b%a002050「ベッドは　乗るものではなく\n\tねるものだと　ちゃんと　教えて\n\tあげなくては　いけませんね。\n@c0@"
  ko: "@a@b%a002050: 침대는 타는 게 아니라\n자는 곳이라고 제대로\n가르쳐 줘야겠군요.\n@c0@"
  sl: "@a@b%a002050：必须好好告诉她，\n　　床是用来睡的，\n　　不是用来坐着飞的。\n@c0@"
  tl: "@a@b%a002050：必須好好告訴她，\n　　床是用來睡的，\n　　不是用來坐著飛的。\n@c0@"
208:
  en: "@a%0%a002000@bI dunno what to say to her. This is a toughie.\n@c0@"
  ja: "@a@b%a002000「……。\n\tオレには　なんて言ったらいいのか\n\tわからないぜ……。\n@c0@"
  ko: "@a@b%a002000: ......\n뭐라고 말해야 할지\n나는 모르겠군......\n@c0@"
  sl: "@a@b%a002000：……\n　　俺都不知道\n　　该说什么了……\n@c0@"
