  sl: "@a@b%a002050：飞天床\n　　真的很有名吗？\n　　我没听说过啊。\n@c0@"
  tl: "@a@b%a002050：飛天床\n　　真的很有名嗎？\n　　我沒聽說過啊。\n@c0@"
