  tl: "@a@b%a002050：好像很興奮呢。\n　　啊，是在向我們\n　　要吃的嗎？\n@c0@"
80:
  en: "@a%0%a002000@bWhoa! So that bed was flown by a kid? Really?\n@c0@"
