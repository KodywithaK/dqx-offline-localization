  sl: "@a@b%a002020：%a000090，\n　　我今天的装备很帅吧。\n@c0@"
  tl: "@a@b%a002020：%a000090，\n　　我今天的裝備很帥吧。\n@c0@"
8:
  en: "@a%0%a002030@bMay the Goddess bless this town.\n@c0@"
  ja: "@a@b%a002030「この町にも　ゲントの神の\n\tご加護が　ありますように……。\n@c0@"
