0:
  en: "@a@bThere's no response. It's just a corpse.\n@c0@"
  ja: "@a@b返事が　ない……。\nただの　しかばねのようだ……。\n@c0@"
  ko: "@a@b반응이 없다.\n그냥 시체인 것 같다......\n@c0@"
  sl: "@a@b没有回应……\n看来只是一具尸体……\n@c0@"
  tl: "@a@b沒有回應……\n看來只是一具屍體……\n@c0@"
1:
  en: "@a@b*: Descend from here, and ye shall find Castle Swanstone, home of the fabled mirror princess.\n@c0@"
  ja: "@a@b＊「ここから　下におりれば\n\tカガミ姫で有名な　フォーン城じゃ。\n@c0@"
  ko: "@a@b*: 여기서 아래로 내려가면\n거울 공주로 유명한 폰 성이라네.\n@c0@"
  sl: "@a@b＊：从这里下去，就是\n　　以明镜公主闻名的佛恩城。\n@c0@"
  tl: "@a@b＊：從這裡下去，就是\n　　以明鏡公主聞名的佛恩城。\n@c0@"
2:
  en: "@a@b*: Its royal residents hold the key to the floodgate south of Somnia.\n@c0@"
  ja: "@a@b＊「そうそう　フォーン城の王は\n\tレイドック南の海峡にかかる　水門の\n\tカギを　代々　管理しておるそうじゃぞ。\n@c0@"
  ko: "@a@b*: 참, 폰 성의 왕은\n레이독 남쪽 해협을 막는 수문의\n열쇠를 대대로 관리하고 있다는군.\n@c0@"
  sl: "@a@b＊：对了对了，佛恩城的国王\n　　代代掌管着能打开\n　　雷多克南边海峡水门的钥匙。\n@c0@"
  tl: "@a@b＊：對了對了，佛恩城的國王\n　　代代掌管著能打開\n　　雷多克南邊海峽水門的鑰匙。\n@c0@"
3:
  en: "@a@b*: Descend from here and ye shall find plain old Castle Swanstone.\n@c0@"
  ja: "@a@b＊「ここから　下におりれば\n\tただの　フォーン城じゃよ。\n@c0@"
  ko: "@a@b*: 여기서 아래로 내려가면\n그저 폰 성이 있을 뿐이라네.\n@c0@"
  sl: "@a@b＊：从这里下去，\n　　只有佛恩城。\n@c0@"
  tl: "@a@b＊：從這裡下去，\n　　只有佛恩城。\n@c0@"
4:
  en: "@a@b*: Descend from here, and ye shall find Castle Swanstone, home of the fabled mirror princess.\n@c0@"
  ja: "@a@b＊「ここから　下におりれば\n\tカガミ姫の鏡で　有名な\n\tフォーン城じゃ。\n@c0@"
  ko: "@a@b*: 여기서 아래로 내려가면\n거울 공주의 거울로 유명한 폰 성이라네.\n@c0@"
  sl: "@a@b＊：从这里下去，就是\n　　以明镜公主的镜子\n　　闻名的佛恩城。\n@c0@"
  tl: "@a@b＊：從這裡下去，就是\n　　以明鏡公主的鏡子\n　　聞名的佛恩城。\n@c0@"
5:
  en: "@a@b*: I'm pleased the princess was rescued, but it raised an almighty commotion! I haven't a hope of catching my afternoon nap!\n@c0@"
  ja: "@a@b＊「姫が　たすかったのは　いいが\n\tこうも　さわがしくなるとは。\n\tおちおち　ひるねも　できんわい。\n@c0@"
  ko: "@a@b*: 공주가 풀려난 건 좋지만\n이렇게나 소란스러워질 줄이야.\n마음 놓고 낮잠도 못 자겠구먼.\n@c0@"
  sl: "@a@b＊：公主得救了虽然是好事，\n　　但是这里整天变得人来人往的，\n　　想睡个午觉都睡不好了。\n@c0@"
  tl: "@a@b＊：公主得救了雖然是好事，\n　　但是這裡整天變得人來人往的，\n　　想睡個午覺都睡不好了。\n@c0@"
