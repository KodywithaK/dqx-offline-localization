106:
  en: "@a%0%a002050@bWell, I had nothing to do with Murdaw's defeat but I'm takin' pride in it all the same!\n@c0@"
  ja: "@a@b%a002050「あとから　加わった\n\t私まで　なんだか\n\tほこらしいです。\n@c0@"
  ko: "@a@b%a002050: 나중에 합류한\n저까지도 왠지\n자랑스러워지는군요.\n@c0@"
  sl: "@a@b%a002050：连之后才加入大伙的我，\n　　都感受到了无上光荣。\n@c0@"
  tl: "@a@b%a002050：連之後才加入大夥的我，\n　　都感受到了無上光榮。\n@c0@"
107:
  en: "@a%0%a002000@bYou hear that, %a000090? Someone's defeated Murdaw! ...Any idea who he's talkin' about?\n@c0@"
  ja: "@a@b%a002000「へーえ\n\t誰が　たおしたんだろうなあ。\n\t知ってるか？　%a000090。\n@c0@"
  ko: "@a@b%a002000: 오~ 그래?\n누가 쓰러뜨렸지?\n넌 알고 있나? %a000090.\n@c0@"
  sl: "@a@b%a002000：哎，\n　　到底是谁打倒的呢。\n　　你知道吗，%a000090？\n@c0@"
  tl: "@a@b%a002000：哎，\n　　到底是誰打倒的呢。\n　　你知道嗎，%a000090？\n@c0@"
108:
  en: "@a%0%a002010@bThis man's got his finger on the pulse, hasn't he! Hee hee.\n@c0@"
  ja: "@a@b%a002010「うふっ。\n\t大ニュースよね。\n@c0@"
  ko: "@a@b%a002010: 우훗.\n빅뉴스네.\n@c0@"
  sl: "@a@b%a002010：唔，\n　　真是条爆炸性新闻啊。\n@c0@"
  tl: "@a@b%a002010：唔，\n　　真是條爆炸性新聞啊。\n@c0@"
109:
  en: "@a%0%a002020@bWhy's he shouting? Does he think we're deaf?\n@c0@"
  ja: "@a@b%a002020「おじさん　そんなに\n\t大声ださなくても\n\t聞こえるわよ……。\n@c0@"
  ko: "@a@b%a002020: 아저씨, 그렇게\n큰 소리로 얘기 안 해도\n다 들려......\n@c0@"
  sl: "@a@b%a002020：大叔，不用这么大声，\n　　我们又不是聋子……\n@c0@"
  tl: "@a@b%a002020：大叔，不用這麼大聲，\n　　我們又不是聾子……\n@c0@"
110:
  en: "@a%0%a002030@bI'm sorely tempted to enlighten this fellow... But perhaps there really are times when it's best to just smile and nod...\n@c0@"
  ja: "@a@b%a002030「とっくに\n\t知ってました……とは\n\t答えにくいですね。\n@c0@"
  ko: "@a@b%a002030: 벌써부터\n알고 있었거든요......\n라고 말하긴 좀 그렇군요.\n@c0@"
  sl: "@a@b%a002030：我们早就知道了……\n　　但是这话好像说不出口。\n@c0@"
  tl: "@a@b%a002030：我們早就知道了……\n　　但是這話好像說不出口。\n@c0@"
111:
  en: "@a%0%a002050@bOh, I heard alright! Murdaw's finally gone for good! I'll never get tired of hearin' that one!\n@c0@"
  ja: "@a@b%a002050「あっ　はい！\n\t私ちゃんと　聞いてますから。\n@c0@"
  ko: "@a@b%a002050: 앗, 네!\n잘 듣고 있습니다.\n@c0@"
  sl: "@a@b%a002050：啊，我在这呢！\n　　听着呢听着呢！\n@c0@"
  tl: "@a@b%a002050：啊，我在這呢！\n　　聽著呢聽著呢！\n@c0@"
112:
  en: "@a%0%a002000@bWell, %a000090, whether they're sayin' good things or bad things, at least everyone's talkin' about ya!\n@c0@"
  ja: "@a@b%a002000「%a000090は\n\tよくも　わるくも\n\tすっかり有名人だな！\n@c0@"
  ko: "@a@b%a002000: %a000090%F0090%X는%Y은%Z\n좋은 의미로든 나쁜 의미로든\n벌써 유명인이로군!\n@c0@"
  sl: "@a@b%a002000：%a000090你\n　　已经是个名人了啊！\n　　管它是好事还是坏事呢！\n@c0@"
  tl: "@a@b%a002000：%a000090你\n　　已經是個名人了啊！\n　　管它是好事還是壞事呢！\n@c0@"
113:
  en: "@a%0%a002010@b‘Gang’? That makes us sound so uncivilised...\n@c0@"
  ja: "@a@b%a002010「ニセ者一味\n\t……って　ちょっと\n\t傷つく　いわれかたね。\n@c0@"
  ko: "@a@b%a002010: 가짜 왕자님\n일당이라니...... 무슨 그런\n상처 주는 말이 다 있어.\n@c0@"
  sl: "@a@b%a002010：居然把我们说成是一群冒牌货……\n　　听上去真心寒呢。\n@c0@"
  tl: "@a@b%a002010：居然把我們說成是一群冒牌貨……\n　　聽上去真心寒呢。\n@c0@"
114:
  en: "@a%0%a002020@bTee hee! Not quite the exact same gang, but close enough.\n@c0@"
  ja: "@a@b%a002020「えへへ。\n\tメンバーは　ビミョーに\n\tちがうんだけどね。\n@c0@"
  ko: "@a@b%a002020: 에헤헷.\n멤버는 그때랑 조~금\n다르지만.\n@c0@"
  sl: "@a@b%a002020：诶嘿嘿。\n　　战斗成员倒是有一点点不同啦。\n@c0@"
  tl: "@a@b%a002020：誒嘿嘿。\n　　戰鬥成員倒是有一點點不同啦。\n@c0@"
115:
  en: "@a%0%a002030@bThat was no fake prince who defeated Murdaw — that much is certain!\n@c0@"
  ja: "@a@b%a002030「ムドーは　たおしましたが\n\tニセ者では　ありません。\n@c0@"
  ko: "@a@b%a002030: 무도를 쓰러뜨린 건 맞지만\n가짜는 아닙니다.\n@c0@"
  sl: "@a@b%a002030：打倒姆多的的确是我们，\n　　而且我们也不是什么冒牌货。\n@c0@"
  tl: "@a@b%a002030：打倒姆多的的確是我們，\n　　而且我們也不是什麼冒牌貨。\n@c0@"
116:
  en: "@a%0%a002050@bWhat's all this talk of fake princes!? Is old %a002050 a little slow on the uptake again or what?\n@c0@"
  ja: "@a@b%a002050「えっ！？\n\tムドーを　たおしたのは\n\tニセ者の一味だったんですか！？\n@c0@"
  ko: "@a@b%a002050: 네!?\n무도를 쓰러뜨린 건\n가짜 일당이었나요!?\n@c0@"
  sl: "@a@b%a002050：什么？！\n　　打倒姆多的\n　　是一群冒牌货？！\n@c0@"
  tl: "@a@b%a002050：什麼？！\n　　打倒姆多的\n　　是一群冒牌貨？！\n@c0@"
117:
  en: "@a%0%a002000@bSo they've got the news posted here. Word is officially out!\n@c0@"
  ja: "@a@b%a002000「さっそく　しらせが\n\tここにも　掲示されたんだな。\n@c0@"
  ko: "@a@b%a002000: 공지가 벌써\n이곳에도 붙은 모양이군.\n@c0@"
  sl: "@a@b%a002000：这里也这么快\n　　就贴出告示来了啊。\n@c0@"
  tl: "@a@b%a002000：這裡也這麼快\n　　就貼出告示來了啊。\n@c0@"
118:
  en: "@a%0%a002010@bIt's good to get a little excited now and then!\n@c0@"
  ja: "@a@b%a002010「よかったわね\n\tおばさん。\n@c0@"
  ko: "@a@b%a002010: 잘됐네,\n아줌마.\n@c0@"
  sl: "@a@b%a002010：真是太好了呢，大婶。\n@c0@"
  tl: "@a@b%a002010：真是太好了呢，大嬸。\n@c0@"
119:
  en: "@a%0%a002020@bHey, it doesn't say who defeated him — not even in the fine print!\n@c0@"
  ja: "@a@b%a002020「誰が　倒したかまでは\n\t書いてないのね。\n\tま　いいか……。\n@c0@"
  ko: "@a@b%a002020: 누가 쓰러뜨렸는지까지는\n안 쓰여 있네.\n뭐, 됐어......\n@c0@"
  sl: "@a@b%a002020：不过没有写是谁打倒姆多的。\n　　唉，算了……\n@c0@"
  tl: "@a@b%a002020：不過沒有寫是誰打倒姆多的。\n　　唉，算了……\n@c0@"
120:
  en: "@a%0%a002030@bWe must not take excessive pride in our achievements. There is much that remains to be done.\n@c0@"
  ja: "@a@b%a002030「まあ　やるべきことは\n\tまだまだ　多いようですが\n\tよろこんでいただけて　幸いです。\n@c0@"
  ko: "@a@b%a002030: 뭐, 해야 할 일은\n아직 많이 남은 것 같지만\n기뻐해 주시니 다행이군요.\n@c0@"
  sl: "@a@b%a002030：哎，我们还有很多事没做呢。\n　　不过看到大家这么开心，倒也算是欣慰。\n@c0@"
  tl: "@a@b%a002030：哎，我們還有很多事沒做呢。\n　　不過看到大家這麼開心，倒也算是欣慰。\n@c0@"
121:
  en: "@a%0%a002050@bThis is the best news I've ever heard! (sniff)\n@c0@"
  ja: "@a@b%a002050「私も　うれしいです！\n\tうっ…うっ……。\n@c0@"
  ko: "@a@b%a002050: 저도 기쁩니다!\n으흑... 으흑......\n@c0@"
  sl: "@a@b%a002050：我也很高兴啊！\n　　呜……呜……\n@c0@"
  tl: "@a@b%a002050：我也很高興啊！\n　　嗚……嗚……\n@c0@"
122:
  en: "@a%0%a002000@bA ‘brush with greatness’? I think it'd be great if you kept that brush to yourself...\n@c0@"
  ja: "@a@b%a002000「いやいや\n\tなんの　なんの！\n@c0@"
  ko: "@a@b%a002000: 아뇨,\n아무것도 아닙니다!\n@c0@"
  sl: "@a@b%a002000：哎呀哎呀，\n　　这没啥，没啥啦！\n@c0@"
  tl: "@a@b%a002000：哎呀哎呀，\n　　這沒啥，沒啥啦！\n@c0@"
123:
  en: "@a%0%a002010@bIt was our pleasure, wasn't it %a000090?\n@c0@"
  ja: "@a@b%a002010「どういたしまして。\n@c0@"
  ko: "@a@b%a002010: 별 말씀을요.\n@c0@"
  sl: "@a@b%a002010：不客气。\n@c0@"
  tl: "@a@b%a002010：不客氣。\n@c0@"
124:
  en: "@a%0%a002020@bWow! He's about to explode! Maybe we should give him some room.\n@c0@"
  ja: "@a@b%a002020「うれしくて　うれしくて\n\t元気いっぱい！　って感じね。\n@c0@"
  ko: "@a@b%a002020: 정말 기뻐서\n기운이 펄펄 샘솟나 봐.\n@c0@"
  sl: "@a@b%a002020：我太开心了，\n　　感觉浑身充满了使不完的劲！\n@c0@"
  tl: "@a@b%a002020：我太開心了，\n　　感覺渾身充滿了使不完的勁！\n@c0@"
125:
  en: "@a%0%a002030@bThe Goddess counsels us not to put our faith in praise, for it can just as quickly change to blame.\n@c0@"
  ja: "@a@b%a002030「これほど　感謝されて\n\t私は　しあわせ者です。\n@c0@"
  ko: "@a@b%a002030: 감사 인사를 이렇게 많이 받다니\n저는 정말 행복한 사람이군요.\n@c0@"
  sl: "@a@b%a002030：大家这么感谢我们，\n　　我真是太幸福了。\n@c0@"
  tl: "@a@b%a002030：大家這麼感謝我們，\n　　我真是太幸福了。\n@c0@"
126:
  en: "@a%0%a002050@bI don't think old %a002050 qualifies as part of this ‘brush with greatness’, more's the pity!\n@c0@"
  ja: "@a@b%a002050「あなたがたって\n\t私は　その場には\n\tいなかったんですけどね……。\n@c0@"
  ko: "@a@b%a002050: 여러분이라고 하셨지만\n저는 그 자리에\n없었답니다......\n@c0@"
  sl: "@a@b%a002050：说的是你们？\n　　我当时不在现场……\n@c0@"
  tl: "@a@b%a002050：說的是你們？\n　　我當時不在現場……\n@c0@"
127:
  en: "@a%0%a002000@bAye, that is a fine breeze.\n@c0@"
  ja: "@a@b%a002000「いわれてみれば\n\tたしかに今日は\n\t空気が　うまいな。\n@c0@"
  ko: "@a@b%a002000: 말을 듣고 보니\n확실히 오늘은\n공기가 상쾌하군.\n@c0@"
  sl: "@a@b%a002000：经你这么一说，\n　　好像是觉得空气\n　　清新了不少呢。\n@c0@"
  tl: "@a@b%a002000：經你這麼一說，\n　　好像是覺得空氣\n　　清新了不少呢。\n@c0@"
128:
  en: "@a%0%a002010@bIndeed! There's nothing better than a shining sun and a cool breeze.\n@c0@"
  ja: "@a@b%a002010「ほんと！\n\t今日は　天気もいいし\n\t空気が　おいしいわね。\n@c0@"
  ko: "@a@b%a002010: 정말이네!\n오늘은 날씨도 좋고\n공기도 상쾌한걸.\n@c0@"
  sl: "@a@b%a002010：真的耶！\n　　今天天气也不错，\n　　空气都变得甜美了呢。\n@c0@"
  tl: "@a@b%a002010：真的耶！\n　　今天天氣也不錯，\n　　空氣都變得甜美了呢。\n@c0@"
129:
  en: "@a%0%a002020@bI hope this peace lasts for a long, long time.\n@c0@"
  ja: "@a@b%a002020「おばさんも\n\tこの平和が　長く続くことを\n\t祈ってね！\n@c0@"
  ko: "@a@b%a002020: 아줌마도\n이 평화가 오래 지속되기를\n기도해 줘!\n@c0@"
  sl: "@a@b%a002020：今后也请为了世界和平\n　　继续祈祷哦，大婶！\n@c0@"
  tl: "@a@b%a002020：今後也請為了世界和平\n　　繼續祈禱哦，大嬸！\n@c0@"
130:
  en: "@a%0%a002030@bD-Does anyone else feel we should apologise for using the back exit?\n@c0@"
  ja: "@a@b%a002030「ちなみに……\n\t裏口から　入ってきてしまって\n\tごめんなさい。\n@c0@"
  ko: "@a@b%a002030: 그건 그렇고......\n뒷문으로 들어와서\n죄송합니다.\n@c0@"
  sl: "@a@b%a002030：顺便说一句……\n　　从后门进来，真是抱歉。\n@c0@"
  tl: "@a@b%a002030：順便說一句……\n　　從後門進來，真是抱歉。\n@c0@"
131:
  en: "@a%0%a002050@bThis breeze on my face takes me back to my carefree days as a nipper playing in the fields.\n@c0@"
  ja: "@a@b%a002050「空気が　まずいと\n\tごはんも　まずいですからねえ。\n@c0@"
  ko: "@a@b%a002050: 공기가 맛없으면\n밥도 맛이 없죠.\n@c0@"
  sl: "@a@b%a002050：要是空气质量不好的话，\n　　连饭菜都会变得难吃。\n@c0@"
  tl: "@a@b%a002050：要是空氣品質不好的話，\n　　連飯菜都會變得難吃。\n@c0@"
132:
  en: "@a%0%a002000@bHow are we goin' to find the other %a000090? Where do we even start?\n@c0@"
  ja: "@a@b%a002000「もうひとりの　%a000090……。\n\tいったい　どこに　いるんだろうな。\n@c0@"
  ko: "@a@b%a002000: 또 하나의 %a000090......\n대체 어디 있는 건지.\n@c0@"
  sl: "@a@b%a002000：另一个%a000090……\n　　到底在哪啊？\n@c0@"
  tl: "@a@b%a002000：另一個%a000090……\n　　到底在哪啊？\n@c0@"
133:
  en: "@a%0%a002010@bWell, some of us are less in the dark than others... Hee hee.\n@c0@"
  ja: "@a@b%a002010「うふふ。\n\tそりゃあ　にてるわよね。\n@c0@"
  ko: "@a@b%a002010: 우후훗.\n그거야 당연히 닮았겠지.\n@c0@"
  sl: "@a@b%a002010：呵呵。\n　　当然像了。\n@c0@"
  tl: "@a@b%a002010：呵呵。\n　　當然像了。\n@c0@"
134:
  en: "@a%0%a002020@bSounds like the Prince was right on the money.\n@c0@"
  ja: "@a@b%a002020「王子さまの　考えは\n\tどんぴしゃり　だったのね！\n@c0@"
  ko: "@a@b%a002020: 왕자님의 생각이\n딱 맞았던 거네!\n@c0@"
  sl: "@a@b%a002020：王子殿下想得分毫不差呢！\n@c0@"
  tl: "@a@b%a002020：王子殿下想得分毫不差呢！\n@c0@"
135:
  en: "@a%0%a002030@b%0%a000090, the search for yourself will double as the search for the Prince of Somnia.\n@c0@"
  ja: "@a@b%a002030「%a000090さんの\n\t自分を　探す旅は　王子さまを\n\t探す旅でも　あるわけですね。\n@c0@"
  ko: "@a@b%a002030: %a000090 님의\n자신을 찾는 여행은 왕자님을\n찾는 여행이기도 하네요.\n@c0@"
  sl: "@a@b%a002030：%a000090，\n　　你寻找自身的旅程，\n　　同时也是寻找王子的旅程。\n@c0@"
  tl: "@a@b%a002030：%a000090，\n　　你尋找自身的旅程，\n　　同時也是尋找王子的旅程。\n@c0@"
136:
  en: "@a%0%a002050@bSo we're lookin' for someone who looks just like %a000090? That should be a breeze!\n@c0@"
  ja: "@a@b%a002050「あらためて　しみじみと\n\t%a000090さんの　顔を\n\t見てしまいますねえ。\n@c0@"
  ko: "@a@b%a002050: %a000090 님의 얼굴을\n다시 한 번 진지하게\n바라보게 되네요.\n@c0@"
  sl: "@a@b%a002050：让我再好好看看\n　　%a000090的脸吧。\n@c0@"
  tl: "@a@b%a002050：讓我再好好看看\n　　%a000090的臉吧。\n@c0@"
137:
  en: "@a%0%a002000@bI don't recall the Goddess sendin' me anywhere, but I don't feel like arguin'.\n@c0@"
  ja: "@a@b%a002000「救世主とか　いわれると\n\tさすがに　ちょっと　てれるよな。\n@c0@"
  ko: "@a@b%a002000: 구세주라는 말까지 들으니\n좀 부끄럽잖아.\n@c0@"
  sl: "@a@b%a002000：被叫做救世主什么的，\n　　怪不好意思呢。\n@c0@"
  tl: "@a@b%a002000：被叫做救世主什麼的，\n　　怪不好意思呢。\n@c0@"
138:
  en: "@a%0%a002010@bAll this praise is awfully flattering!\n@c0@"
  ja: "@a@b%a002010「ありがとう　シスター。\n@c0@"
  ko: "@a@b%a002010: 고마워요, 수녀님.\n@c0@"
  sl: "@a@b%a002010：谢谢你，修女姐姐。\n@c0@"
  tl: "@a@b%a002010：謝謝你，修女姐姐。\n@c0@"
139:
  en: "@a%0%a002020@bSent from the Goddess, huh...? Is that where I came from?\n@c0@"
  ja: "@a@b%a002020「救世主かあ……。\n\tなれるといいんだけど。\n@c0@"
  ko: "@a@b%a002020: 구세주라......\n될 수 있으면 좋겠네.\n@c0@"
  sl: "@a@b%a002020：救世主啊……\n　　习惯习惯就好了。\n@c0@"
  tl: "@a@b%a002020：救世主啊……\n　　習慣習慣就好了。\n@c0@"
140:
  en: "@a%0%a002030@bIf the Goddess sees fit to use us to fulfil Her higher purpose, then so be it.\n@c0@"
  ja: "@a@b%a002030「そうなれるように\n\tがんばりたいですね。\n@c0@"
  ko: "@a@b%a002030: 그렇게 될 수 있도록\n더 열심히 하겠습니다.\n@c0@"
  sl: "@a@b%a002030：我会尝试着习惯的……\n@c0@"
  tl: "@a@b%a002030：我會嘗試著習慣的……\n@c0@"
141:
  en: "@a%0%a002050@bTo think that I used to blush when they called me the town hero in Scrimsley! This is all too much for me!\n@c0@"
  ja: "@a@b%a002050「私も　町の英雄　くらいなら\n\t言われたこと　ありますが\n\tそれでも　テレくさかったです！\n@c0@"
  ko: "@a@b%a002050: 저도 마을 영웅 정도는\n들어 본 적이 있지만\n그걸 들었을 때도 부끄러웠죠!\n@c0@"
  sl: "@a@b%a002050：我过去也被\n　　大家称作城镇英雄，\n　　现在想想真是怪不好意思的！\n@c0@"
  tl: "@a@b%a002050：我過去也被\n　　大家稱作城鎮英雄，\n　　現在想想真是怪不好意思的！\n@c0@"
142:
  en: "@a%0%a002000@bI do hope business picks up for him!\n@c0@"
  ja: "@a@b%a002000「あんたも\n\t道中　気をつけてな！\n@c0@"
  ko: "@a@b%a002000: 당신도\n조심해서 다니도록 해!\n@c0@"
  sl: "@a@b%a002000：你也是！\n　　路上小心啊！\n@c0@"
  tl: "@a@b%a002000：你也是！\n　　路上小心啊！\n@c0@"
143:
  en: "@a%0%a002010@bPeaceful peddling sounds wonderful! As long as he's careful to avoid monsters, that is...\n@c0@"
  ja: "@a@b%a002010「いってらっしゃい。\n\tまものに　気をつけてね。\n@c0@"
  ko: "@a@b%a002010: 잘 다녀와.\n마물 조심하구.\n@c0@"
  sl: "@a@b%a002010：一路顺风。\n　　要小心魔物哦。\n@c0@"
  tl: "@a@b%a002010：一路順風。\n　　要小心魔物哦。\n@c0@"
144:
  en: "@a%0%a002020@bYou couldn't pay me to be a travelling merchant. What a tough job!\n@c0@"
  ja: "@a@b%a002020「いまの世の中では\n\t旅の商売も　たいへんよね。\n@c0@"
  ko: "@a@b%a002020: 지금 같은 세상에선\n행상도 참 힘들겠네.\n@c0@"
  sl: "@a@b%a002020：现在这个世道，\n　　做行商不容易吧。\n@c0@"
  tl: "@a@b%a002020：現在這個世道，\n　　做行商不容易吧。\n@c0@"
145:
  en: "@a%0%a002030@bIf he's travelling, he should take a trip to Ghent. I only wish I could pay it a visit myself.\n@c0@"
  ja: "@a@b%a002030「わたしの　ふるさと\n\tゲントの村にも　ぜひどうぞ。\n@c0@"
  ko: "@a@b%a002030: 제 고향인\n겐트 마을에도 꼭 들러 주세요.\n@c0@"
  sl: "@a@b%a002030：欢迎去我的家乡根特村。\n@c0@"
  tl: "@a@b%a002030：歡迎去我的家鄉根特村。\n@c0@"
146:
  en: "@a%0%a002050@bThe folk in Scrimsley have got their heads screwed on, so they won't let any salesman short-change 'em!\n@c0@"
  ja: "@a@b%a002050「もし　モンストルに\n\t立ち寄ったときには\n\t安くしてあげてください！\n@c0@"
  ko: "@a@b%a002050: 혹시 몬스톨에\n들르신다면\n싸게 팔아 주세요!\n@c0@"
  sl: "@a@b%a002050：要是到了蒙斯托尔的话，\n　　请给那里的人卖便宜点！\n@c0@"
  tl: "@a@b%a002050：要是到了蒙斯托爾的話，\n　　請給那裡的人賣便宜點！\n@c0@"
147:
  en: "@a%0%a002000@bNow ‘Blade’ is a good name for a fighter! Not as good as ‘%a002000’, but what can you do?\n@c0@"
  ja: "@a@b%a002000「たしかに　トムより\n\tソルディのほうが\n\tいさましい感じだよな。\n@c0@"
  ko: "@a@b%a002000: 확실히 톰보다는\n솔디라는 이름이\n더 용맹스럽긴 하군.\n@c0@"
  sl: "@a@b%a002000：和托姆比起来，\n　　索迪这名字听起来\n　　确实感觉更威风啊。\n@c0@"
  tl: "@a@b%a002000：和托姆比起來，\n　　索迪這名字聽起來\n　　確實感覺更威風啊。\n@c0@"
148:
  en: "@a%0%a002010@bWe've met Captain Rusty's dream world self...\n@c0@"
  ja: "@a@b%a002010「トム兵士長の\n\t夢のすがた……。\n@c0@"
  ko: "@a@b%a002010: 톰 병사단장의\n꿈속 모습......\n@c0@"
  sl: "@a@b%a002010：托姆士兵长在梦中的形态……\n@c0@"
  tl: "@a@b%a002010：托姆士兵長在夢中的形態……\n@c0@"
149:
  en: "@a%0%a002020@bWait — so this Rusty guy was Captain Blade in the dream world?\n@c0@"
  ja: "@a@b%a002020「えっ　つまり\n\tトム兵士長が\n\t夢の中では　ソルディ……？\n@c0@"
  ko: "@a@b%a002020: 앗, 그러니까\n톰 병사단장이\n꿈속에서는 솔디라고......?\n@c0@"
  sl: "@a@b%a002020：诶？也就是说，\n　　托姆士兵长在梦世界中\n　　就是索迪？\n@c0@"
  tl: "@a@b%a002020：誒？也就是說，\n　　托姆士兵長在夢世界中\n　　就是索迪？\n@c0@"
150:
  en: "@a%0%a002030@bHmm... So in Captain Rusty's dreams, he becomes a soldier by the name of ‘Blade’...\n@c0@"
  ja: "@a@b%a002030「トム兵士長の夢は\n\tソルディという名の\n\t兵士になること……ふーむ。\n@c0@"
  ko: "@a@b%a002030: 톰 병사단장의 꿈은\n솔디라는 이름의\n병사가 되는 것...... 흐음.\n@c0@"
  sl: "@a@b%a002030：托姆士兵长在梦里\n　　变成了名叫索迪的士兵……\n　　唔。\n@c0@"
  tl: "@a@b%a002030：托姆士兵長在夢裡\n　　變成了名叫索迪的士兵……\n　　唔。\n@c0@"
151:
  en: "@a%0%a002050@bSeems a shame not to like your own name. I'm quite a fan of ‘%a002050’...\n@c0@"
  ja: "@a@b%a002050「兵隊ごっこ　ですか。\n\tなつかしいなあ。\n@c0@"
  ko: "@a@b%a002050: 병정 놀이라.\n오랜만에 듣네요.\n@c0@"
  sl: "@a@b%a002050：士兵游戏吗。\n　　好怀念啊。\n@c0@"
  tl: "@a@b%a002050：士兵遊戲嗎。\n　　好懷念啊。\n@c0@"
152:
  en: "@a%0%a002050@bMy old mother used to say that one day the whole world would know my name...\n@c0@"
  ja: "@a@b%a002050「私も　よくやりましたよ。\n\tいつも　まものの役でしたけどね。\n@c0@"
  ko: "@a@b%a002050: 저도 자주 했었습니다.\n항상 마물 역할만 맡았지만.\n@c0@"
  sl: "@a@b%a002050：我以前也经常玩哦。\n　　虽然都是扮演魔物的角色。\n@c0@"
  tl: "@a@b%a002050：我以前也經常玩哦。\n　　雖然都是扮演魔物的角色。\n@c0@"
153:
  en: "@a%0%a002000@bNever in my wildest dreams did I think I'd have so many strangers sayin' nice things about me!\n@c0@"
  ja: "@a@b%a002000「ああ　夢みたいだけど\n\tホントに　おきたことだぜ！\n@c0@"
  ko: "@a@b%a002000: 그래, 꿈 같지만\n실제로 일어난 일이야!\n@c0@"
  sl: "@a@b%a002000：这种事情简直像在做梦！\n　　居然真的发生了啊！\n@c0@"
  tl: "@a@b%a002000：這種事情簡直像在做夢！\n　　居然真的發生了啊！\n@c0@"
154:
  en: "@a%0%a002010@bI'm sure she'll be able to enjoy this peaceful world for many years to come!\n@c0@"
  ja: "@a@b%a002010「おばあさん　これからも\n\t安心して　長生きしてくださいね。\n@c0@"
  ko: "@a@b%a002010: 할머니, 앞으로도\n마음 놓고 오래 사세요.\n@c0@"
  sl: "@a@b%a002010：老婆婆，今后您也可以\n　　一直安心地生活下去了。\n@c0@"
  tl: "@a@b%a002010：老婆婆，今後您也可以\n　　一直安心地生活下去了。\n@c0@"
155:
  en: "@a%0%a002020@bIt's a wonderful life, alright.\n@c0@"
  ja: "@a@b%a002020「ほんとに　よかったよね！\n@c0@"
  ko: "@a@b%a002020: 정말 잘됐어!\n@c0@"
  sl: "@a@b%a002020：真是太好了呢！\n@c0@"
  tl: "@a@b%a002020：真是太好了呢！\n@c0@"
156:
  en: "@a%0%a002030@bWorld peace is the best medicine there is. I pray she lives for many more years yet.\n@c0@"
  ja: "@a@b%a002030「長生きの　ためには\n\t世界平和が\n\tいちばんの　薬ですよね。\n@c0@"
  ko: "@a@b%a002030: 장수를 위해서는\n세계 평화가\n가장 좋은 약이로군요.\n@c0@"
  sl: "@a@b%a002030：世界和平才是\n　　最有效的长寿之道呢。\n@c0@"
  tl: "@a@b%a002030：世界和平才是\n　　最有效的長壽之道呢。\n@c0@"
157:
  en: "@a%0%a002050@bI never thought I'd see a peaceful world either. It seems like just yesterday that those monsters were attackin' Scrimsley...\n@c0@"
  ja: "@a@b%a002050「こんなに　はやく\n\t平和な世の中になるとは\n\t私も　思いませんでした！\n@c0@"
  ko: "@a@b%a002050: 이렇게 빨리\n평화로운 세상이 찾아오리라고는\n저도 생각지 못했습니다!\n@c0@"
  sl: "@a@b%a002050：我想都没想过，\n　　世界竟然会这么快\n　　迎来和平！\n@c0@"
  tl: "@a@b%a002050：我想都沒想過，\n　　世界竟然會這麼快\n　　迎來和平！\n@c0@"
158:
  en: "@a%0%a002000@bThat's right! We need to pay a little visit to Alltrades Abbey!\n@c0@"
  ja: "@a@b%a002000「そうだ！　ダーマ神殿を\n\t調べに　行かなくっちゃな！\n@c0@"
  ko: "@a@b%a002000: 그래! 다마 신전을\n살펴보러 가 봐야겠군!\n@c0@"
  sl: "@a@b%a002000：对了！\n　　还得去调查调查达玛神殿！\n@c0@"
  tl: "@a@b%a002000：對了！\n　　還得去調查調查達瑪神殿！\n@c0@"
159:
  en: "@a%0%a002010@bSounds like her husband's telling the truth!\n@c0@"
  ja: "@a@b%a002010「きっと　おじいさんの\n\t言っていることは　本当ね。\n@c0@"
  ko: "@a@b%a002010: 할아버지 얘기는\n틀림없는 사실일 거야.\n@c0@"
  sl: "@a@b%a002010：老爷爷说的话\n　　一定是真的。\n@c0@"
  tl: "@a@b%a002010：老爺爺說的話\n　　一定是真的。\n@c0@"
160:
  en: "@a%0%a002020@bShe oughta believe in her husband more, I'd say...\n@c0@"
  ja: "@a@b%a002020「おじいちゃん\n\t信用ないんだ……。\n@c0@"
  ko: "@a@b%a002020: 할아버지,\n믿음을 주지 못하나 보네......\n@c0@"
  sl: "@a@b%a002020：那老爷爷的话\n　　我可不怎么相信……\n@c0@"
  tl: "@a@b%a002020：那老爺爺的話\n　　我可不怎麼相信……\n@c0@"
161:
  en: "@a%0%a002030@bHmm... This man's constant sleep is likely not the work of Murdaw. I wonder...\n@c0@"
  ja: "@a@b%a002030「おじいさんが　ねているのは\n\tべつに　ムドーのせいでは\n\tないのでは……。\n@c0@"
  ko: "@a@b%a002030: 할아버지가 주무시는 건\n딱히 무도 때문은\n아니지 않을지......\n@c0@"
  sl: "@a@b%a002030：老爷爷之所以会沉睡，\n　　可能并不是因为姆多的缘故……\n@c0@"
  tl: "@a@b%a002030：老爺爺之所以會沉睡，\n　　可能並不是因為姆多的緣故……\n@c0@"
162:
  en: "@a%0%a002050@bI might be wrong, but I'm pretty sure this house isn't an abbey. What could that dream be about?\n@c0@"
  ja: "@a@b%a002050「この　おうちは\n\tどう見ても　神殿には\n\t見えないですものねえ……。\n@c0@"
  ko: "@a@b%a002050: 이 집은\n아무리 봐도 신전처럼은\n안 보이는데 말이죠......\n@c0@"
  sl: "@a@b%a002050：这个房子怎么看，\n　　都看不出神殿的影子啊……\n@c0@"
  tl: "@a@b%a002050：這個房子怎麼看，\n　　都看不出神殿的影子啊……\n@c0@"
163:
  en: "@a%0%a002000@bIf I run into one of these ‘pattycake princesses’ in the dream world, I'm goin' to watch my back...\n@c0@"
  ja: "@a@b%a002000「夢の世界で\n\tピチピチギャルに　あったら\n\t気をつけようぜ……。\n@c0@"
  ko: "@a@b%a002000: 꿈의 세계에서\n쭉쭉빵빵 아가씨를 만나면\n조심하자고......\n@c0@"
  sl: "@a@b%a002000：要是在梦世界\n　　遇到了靓妹，\n　　大家要注意……\n@c0@"
  tl: "@a@b%a002000：要是在夢世界\n　　遇到了靚妹，\n　　大家要注意……\n@c0@"
164:
  en: "@a%0%a002010@bSounds like this gentleman is currently visiting the dream world.\n@c0@"
  ja: "@a@b%a002010「この　おじいさんは\n\tいま　夢の世界に　いるのね。\n@c0@"
  ko: "@a@b%a002010: 이 할아버지는\n지금 꿈의 세계에 있나 봐.\n@c0@"
  sl: "@a@b%a002010：这个老爷爷\n　　现在正身处梦世界里吧。\n@c0@"
  tl: "@a@b%a002010：這個老爺爺\n　　現在正身處夢世界裡吧。\n@c0@"
165:
  en: "@a%0%a002020@bDream big, I always say. Dream big.\n@c0@"
  ja: "@a@b%a002020「いくらなんでも\n\tピチピチギャルは　ムリがあるでしょ\n\tおじいちゃん……。\n@c0@"
  ko: "@a@b%a002020: 아무리 그래도\n쭉쭉빵빵 아가씨는 좀 무리수잖아,\n할아버지......\n@c0@"
  sl: "@a@b%a002020：再怎么说，\n　　他老人家想当靓妹，\n　　这事也太困难了吧……\n@c0@"
  tl: "@a@b%a002020：再怎麼說，\n　　他老人家想當靚妹，\n　　這事也太困難了吧……\n@c0@"
166:
  en: "@a%0%a002030@bWell, he doesn't seem to be suffering any discomfort, at least.\n@c0@"
  ja: "@a@b%a002030「べつに\n\t悪い病気というわけでは\n\tなさそうですね。\n@c0@"
  ko: "@a@b%a002030: 딱히\n나쁜 병에 걸린 건\n아닌 것 같습니다.\n@c0@"
  sl: "@a@b%a002030：好像不是因为\n　　生了病才这样吧。\n@c0@"
  tl: "@a@b%a002030：好像不是因為\n　　生了病才這樣吧。\n@c0@"
167:
  en: "@a%0%a002050@bI've always been happiest when I'm asleep. Except for that monster episode, but let's not dwell on that...\n@c0@"
  ja: "@a@b%a002050「私も　ねているときと\n\t食べているときが\n\tいちばん　しあわせですね！\n@c0@"
  ko: "@a@b%a002050: 저도 잘 때와\n먹을 때가\n가장 행복하답니다!\n@c0@"
  sl: "@a@b%a002050：我也是！\n　　睡觉和吃饭是我人生两大幸事！\n@c0@"
  tl: "@a@b%a002050：我也是！\n　　睡覺和吃飯是我人生兩大幸事！\n@c0@"
168:
  en: "@a%0%a002000@bWe could tell him the whole story, but that would take days. We defeated Murdaw, and that's that!\n@c0@"
  ja: "@a@b%a002000「くわしい話を　したら\n\tコシを　抜かすくらい\n\tおどろくんじゃないか？\n@c0@"
  ko: "@a@b%a002000: 자세한 이야기를 해 주면\n기겁하는 거\n아냐?\n@c0@"
  sl: "@a@b%a002000：要是把经过详细道来的话，\n　　绝对会吓得他魂飞魄散吧？\n@c0@"
  tl: "@a@b%a002000：要是把經過詳細道來的話，\n　　絕對會嚇得他魂飛魄散吧？\n@c0@"
169:
  en: "@a%0%a002010@b......\n@c0@"
  ja: "@a@b%a002010「……。\n@c0@"
  ko: "@a@b%a002010: ......\n@c0@"
  sl: "@a@b%a002010：……\n@c0@"
  tl: "@a@b%a002010：……\n@c0@"
170:
  en: "@a%0%a002020@bSounds like the exact details haven't quite reached Wellshire yet.\n@c0@"
  ja: "@a@b%a002020「あまり　くわしい話は\n\tこの町までは\n\t伝わってないのかな。\n@c0@"
  ko: "@a@b%a002020: 그렇게 자세한 이야기는\n이 마을까지는\n전해지지 않았나 보네.\n@c0@"
  sl: "@a@b%a002020：还是不要把详细的经过\n　　告诉这个镇上的人比较好。\n@c0@"
  tl: "@a@b%a002020：還是不要把詳細的經過\n　　告訴這個鎮上的人比較好。\n@c0@"
171:
  en: "@a%0%a002030@bIt appears that word of Murdaw's defeat has reached even here.\n@c0@"
  ja: "@a@b%a002030「とりあえず\n\tムドーが　たおれたことは\n\t伝わっているようですね。\n@c0@"
  ko: "@a@b%a002030: 일단\n무도가 쓰러졌다는 사실은\n알려진 모양이군요.\n@c0@"
  sl: "@a@b%a002030：总之，\n　　姆多被打倒了这件事情，\n　　好像已经被传开了呢。\n@c0@"
  tl: "@a@b%a002030：總之，\n　　姆多被打倒了這件事情，\n　　好像已經被傳開了呢。\n@c0@"
172:
  en: "@a%0%a002050@bBy heck, his attitude didn't half change when he found out who we were!\n@c0@"
  ja: "@a@b%a002050「コロッと\n\tたいどが　かわりましたね。\n@c0@"
  ko: "@a@b%a002050: 태도가 갑자기\n바뀌었군요.\n@c0@"
  sl: "@a@b%a002050：态度１８０度大转弯啊。\n@c0@"
  tl: "@a@b%a002050：態度１８０度大轉彎啊。\n@c0@"
173:
  en: "@a%0%a002000@bMaybe we should've told him the truth, but we ain't got all day!\n@c0@"
  ja: "@a@b%a002000「ちゃんと\n\t教えてやったほうが\n\tよかったかな……。\n@c0@"
  ko: "@a@b%a002000: 사실대로\n가르쳐 줄걸\n그랬나......\n@c0@"
  sl: "@a@b%a002000：还是实话实说\n　　比较好吗……\n@c0@"
  tl: "@a@b%a002000：還是實話實說\n　　比較好嗎……\n@c0@"
174:
  en: "@a%0%a002010@bEveryone likes to feel useful, don't they?\n@c0@"
  ja: "@a@b%a002010「人間は\n\t自分が　必要とされたほうが\n\tうれしいものなのよ。\n@c0@"
  ko: "@a@b%a002010: 인간은\n자기를 필요로 하는 곳이 있어야\n기쁜 법이야.\n@c0@"
  sl: "@a@b%a002010：只要知道有人还需要自己，\n　　就会觉得无比开心呢。\n@c0@"
  tl: "@a@b%a002010：只要知道有人還需要自己，\n　　就會覺得無比開心呢。\n@c0@"
175:
  en: "@a%0%a002020@bI think this guy's a legend in his own mind. Tee hee!\n@c0@"
  ja: "@a@b%a002020「このひと　そんなに\n\t強そうには　見えないけど。\n@c0@"
  ko: "@a@b%a002020: 이 사람, 그렇게\n강해 보이지는 않는데.\n@c0@"
  sl: "@a@b%a002020：这人看上去没那么强啊。\n@c0@"
  tl: "@a@b%a002020：這人看上去沒那麼強啊。\n@c0@"
176:
  en: "@a%0%a002030@bWell, hopefully his guarding skills are superior to his rather brusque manners.\n@c0@"
  ja: "@a@b%a002030「おやおや。\n\tいさましい　人ですね。\n@c0@"
  ko: "@a@b%a002030: 오호,\n용맹한 사람이로군요.\n@c0@"
  sl: "@a@b%a002030：哎呀哎呀，\n　　真是个勇敢的人呢。\n@c0@"
  tl: "@a@b%a002030：哎呀哎呀，\n　　真是個勇敢的人呢。\n@c0@"
177:
  en: "@a%0%a002050@bThis chap's got no shortage of confidence, has he?\n@c0@"
  ja: "@a@b%a002050「自信たっぷりですね……。\n@c0@"
  ko: "@a@b%a002050: 자신만만하네요......\n@c0@"
  sl: "@a@b%a002050：自信满满呢……\n@c0@"
  tl: "@a@b%a002050：自信滿滿呢……\n@c0@"
178:
  en: "@a%0%a002000@bAye, even the sun seems to know we walloped Murdaw.\n@c0@"
  ja: "@a@b%a002000「魔王を　たおしたから\n\t心の中まで　はればれだぜ！\n@c0@"
  ko: "@a@b%a002000: 마왕을 쓰러뜨렸으니\n가슴속까지 맑아졌을 거야!\n@c0@"
  sl: "@a@b%a002000：打倒了魔王，\n　　心情都变得畅快了起来！\n@c0@"
  tl: "@a@b%a002000：打倒了魔王，\n　　心情都變得暢快了起來！\n@c0@"
179:
  en: "@a%0%a002010@bIt's a glorious day indeed!\n@c0@"
  ja: "@a@b%a002010「本当に\n\tいい天気だわ。\n@c0@"
  ko: "@a@b%a002010: 정말\n날씨가 좋구나.\n@c0@"
  sl: "@a@b%a002010：天气真是不错呢。\n@c0@"
  tl: "@a@b%a002010：天氣真是不錯呢。\n@c0@"
180:
  en: "@a%0%a002020@bCouldn't ask for a better laundry day, right?\n@c0@"
  ja: "@a@b%a002020「こんな日は\n\tお洗たくに　ピッタリよね！\n@c0@"
  ko: "@a@b%a002020: 이런 날에는\n빨래하면 정말 좋은데!\n@c0@"
  sl: "@a@b%a002020：这种天气\n　　就应该好好地洗洗衣服！\n@c0@"
  tl: "@a@b%a002020：這種天氣\n　　就應該好好地洗洗衣服！\n@c0@"
181:
  en: "@a%0%a002030@bThe Goddess has truly pulled out all the stops today!\n@c0@"
  ja: "@a@b%a002030「いい天気は\n\t人の心を　いやしますね。\n@c0@"
  ko: "@a@b%a002030: 맑은 날씨는\n사람의 마음을 어루만져 주죠.\n@c0@"
  sl: "@a@b%a002030：好天气可以治愈人的内心呢。\n@c0@"
  tl: "@a@b%a002030：好天氣可以治癒人的內心呢。\n@c0@"
182:
  en: "@a%0%a002050@bAnyone else fancy a picnic? ...No? Prefer to carry on adventurin'? That's fine too!\n@c0@"
  ja: "@a@b%a002050「はい\n\t気持ちのいい　天気ですね。\n@c0@"
  ko: "@a@b%a002050: 네,\n기분 좋은 날씨로군요.\n@c0@"
  sl: "@a@b%a002050：没错，天气真棒啊。\n@c0@"
  tl: "@a@b%a002050：沒錯，天氣真棒啊。\n@c0@"
183:
  en: "@a%0%a002000@bThe kid should be allowed to play where he likes!\n@c0@"
  ja: "@a@b%a002000「まあ\n\t大丈夫なんじゃないか？\n@c0@"
  ko: "@a@b%a002000: 뭐,\n괜찮지 않을까?\n@c0@"
  sl: "@a@b%a002000：哎，没问题吧？\n@c0@"
  tl: "@a@b%a002000：哎，沒問題吧？\n@c0@"
184:
  en: "@a%0%a002010@bAt least those ruffians are gone now. I'm sure he'll be just fine.\n@c0@"
  ja: "@a@b%a002010「もう　悪い人たちは\n\tいないでしょうから　大丈夫よね。\n@c0@"
  ko: "@a@b%a002010: 이제 나쁜 사람들은\n없을 테니까 괜찮을 거야.\n@c0@"
  sl: "@a@b%a002010：已经没有坏人了，\n　　放心地让孩子们去玩吧。\n@c0@"
  tl: "@a@b%a002010：已經沒有壞人了，\n　　放心地讓孩子們去玩吧。\n@c0@"
185:
  en: "@a%0%a002020@bIf I were him, I'd probably go regardless of what my mom said!\n@c0@"
  ja: "@a@b%a002020「あたしだったら\n\tおゆるしが　出なくても\n\tどんどん　出かけちゃうわね。\n@c0@"
  ko: "@a@b%a002020: 나였다면\n허락을 안 받아도\n마음껏 놀러 다녔을 텐데.\n@c0@"
  sl: "@a@b%a002020：即使不允许我出门，\n　　我也会不管三七二十一跑出去的。\n@c0@"
  tl: "@a@b%a002020：即使不允許我出門，\n　　我也會不管三七二十一跑出去的。\n@c0@"
186:
  en: "@a%0%a002030@bIt's only right that a mother should worry about her son. But you've got to cut the apron strings sometime!\n@c0@"
  ja: "@a@b%a002030「母親は\n\tいつでも　子供のことが\n\t心配なものなのですね。\n@c0@"
  ko: "@a@b%a002030: 어머니는\n항상 아이를\n걱정하는 법이죠.\n@c0@"
  sl: "@a@b%a002030：可怜天下父母心啊。\n@c0@"
  tl: "@a@b%a002030：可憐天下父母心啊。\n@c0@"
187:
  en: "@a%0%a002050@bIf you ask old %a002050 — which no one did — nippers should be allowed to play in any well they fancy!\n@c0@"
  ja: "@a@b%a002050「そういうことを\n\t私に　きかれても……。\n@c0@"
  ko: "@a@b%a002050: 그런 걸\n저한테 물으시면 제가 뭐라고 해야......\n@c0@"
  sl: "@a@b%a002050：这事问我也没用啊……\n@c0@"
  tl: "@a@b%a002050：這事問我也沒用啊……\n@c0@"
188:
  en: "@a%0%a002000@bHe should still watch his back. There's no shortage of monsters with a taste for travelling salesmen out there!\n@c0@"
  ja: "@a@b%a002000「外は　まだまだ\n\tまものが　うようよしてるから\n\t気をつけてな！\n@c0@"
  ko: "@a@b%a002000: 밖에는 아직도\n마물들이 우글대니\n조심하라고!\n@c0@"
  sl: "@a@b%a002000：外面还有魔物在晃悠，\n　　小心点啊！\n@c0@"
  tl: "@a@b%a002000：外面還有魔物在晃悠，\n　　小心點啊！\n@c0@"
189:
  en: "@a%0%a002010@bPeaceful times mean that everyone can enjoy seeing more of the world.\n@c0@"
  ja: "@a@b%a002010「これからは\n\t人びとの　行動はんいも\n\t広がっていくわね。\n@c0@"
  ko: "@a@b%a002010: 앞으로는\n사람들의 행동 범위도\n넓어지겠네.\n@c0@"
  sl: "@a@b%a002010：今后人们的活动范围\n　　还会继续扩大吧。\n@c0@"
  tl: "@a@b%a002010：今後人們的活動範圍\n　　還會繼續擴大吧。\n@c0@"
190:
  en: "@a%0%a002020@bSure is nice to have a piece of peace, huh?\n@c0@"
  ja: "@a@b%a002020「ほ～んと\n\t平和って　いいものよね！\n@c0@"
  ko: "@a@b%a002020: 평화란\n참~ 좋은 거구나!\n@c0@"
  sl: "@a@b%a002020：和平真～好～啊！\n@c0@"
  tl: "@a@b%a002020：和平真～好～啊！\n@c0@"
191:
  en: "@a%0%a002030@bIt is heartening to see that people can once again go about their business in relative peace.\n@c0@"
  ja: "@a@b%a002030「前より　ずいぶん\n\t気軽に　旅ができるように\n\tなったようですね。\n@c0@"
  ko: "@a@b%a002030: 전보다는 훨씬\n가벼운 마음으로 여행을\n할 수 있게 된 것 같군요.\n@c0@"
  sl: "@a@b%a002030：旅途比起之前来\n　　轻松了不少呢。\n@c0@"
  tl: "@a@b%a002030：旅途比起之前來\n　　輕鬆了不少呢。\n@c0@"
192:
  en: "@a%0%a002050@bMurdaw's been defeated good and proper, but there's other bad sorts out there!\n@c0@"
  ja: "@a@b%a002050「魔王は　いませんが\n\t魔王みたいな人は　たくさんいますから\n\t気をつけてくださいね！\n@c0@"
  ko: "@a@b%a002050: 마왕은 없지만\n마왕 같은 사람은 잔뜩 있으니까\n조심하세요!\n@c0@"
  sl: "@a@b%a002050：魔王虽然不在了，\n　　但是还有很多跟魔王一样凶险恶毒之人。\n　　一定要小心行事！\n@c0@"
  tl: "@a@b%a002050：魔王雖然不在了，\n　　但是還有很多跟魔王一樣凶險惡毒之人。\n　　一定要小心行事！\n@c0@"
193:
  en: "@a%0%a002000@bGood for him! The dream well is now officially free of all kidnappers and shady sorts.\n@c0@"
  ja: "@a@b%a002000「うんうん。\n\tもう　あやしいヤツらも\n\tいないからな。\n@c0@"
  ko: "@a@b%a002000: 그래, 그래.\n이제 수상한 놈들도\n없으니 괜찮단다.\n@c0@"
  sl: "@a@b%a002000：嗯嗯。\n　　可疑的家伙都已经被干掉了吧。\n@c0@"
  tl: "@a@b%a002000：嗯嗯。\n　　可疑的傢伙都已經被幹掉了吧。\n@c0@"
194:
  en: "@a%0%a002010@bStill, without adult supervision, I'd be concerned about letting a child run free out there.\n@c0@"
  ja: "@a@b%a002010「だれか　おとなが\n\tいっしょじゃないと\n\tちょっと　心配かもね。\n@c0@"
  ko: "@a@b%a002010: 어른 중 누군가가\n같이 가 주지 않으면\n조금 걱정되겠는걸.\n@c0@"
  sl: "@a@b%a002010：没有大人陪着的话，\n　　真是叫人担心。\n@c0@"
  tl: "@a@b%a002010：沒有大人陪著的話，\n　　真是叫人擔心。\n@c0@"
195:
  en: "@a%0%a002020@bI don't know of any well games, but I bet they'd be wet and wild if I did!\n@c0@"
  ja: "@a@b%a002020「井戸あそびかあ。\n\tなんだか　楽しそう。\n@c0@"
  ko: "@a@b%a002020: 우물에 놀러 가는구나.\n정말 재밌겠다.\n@c0@"
  sl: "@a@b%a002020：在井边玩啊……\n　　好像很有趣的样子。\n@c0@"
  tl: "@a@b%a002020：在井邊玩啊……\n　　好像很有趣的樣子。\n@c0@"
196:
  en: "@a%0%a002030@bI was never allowed to play in wells. I suppose that's what you get for being the ‘Chosen One’. Maybe I missed out...\n@c0@"
  ja: "@a@b%a002030「子供たちだけでは\n\tまだ　あぶないのでは……。\n@c0@"
  ko: "@a@b%a002030: 아이들만 보내면\n아직 위험한 거 아닌지......\n@c0@"
  sl: "@a@b%a002030：小孩子们没有大人陪的话，\n　　还是会很危险的吧……\n@c0@"
  tl: "@a@b%a002030：小孩子們沒有大人陪的話，\n　　還是會很危險的吧……\n@c0@"
197:
  en: "@a%0%a002050@bWe used to have contests to see who could drink the most well water. It wasn't a great game, lookin' back...\n@c0@"
  ja: "@a@b%a002050「どちらが　たくさん\n\t井戸水を　飲めるか！？\n\tなんて遊びは　どうでしょうか！\n@c0@"
  ko: "@a@b%a002050: 누가 더 많은\n우물물을 마실 수 있나!?\n이런 놀이는 어떨까요!\n@c0@"
  sl: "@a@b%a002050：要比一比谁喝井水喝得多吗？！\n　　这个游戏怎么样！\n@c0@"
  tl: "@a@b%a002050：要比一比誰喝井水喝得多嗎？！\n　　這個遊戲怎麼樣！\n@c0@"
198:
  en: "@a%0%a002000@bI hope they don't bump into a real well wisher. We'd best wish them well if they do! Hardy har!\n@c0@"
  ja: "@a@b%a002000「ホンモノの\n\tいどまじんに　会わないように\n\t気をつけてな！\n@c0@"
  ko: "@a@b%a002000: 진짜\n우물 마신을 만나지 않도록\n조심하라고!\n@c0@"
  sl: "@a@b%a002000：要小心不要碰到\n　　真正的深井魔人啊！\n@c0@"
  tl: "@a@b%a002000：要小心不要碰到\n　　真正的深井魔人啊！\n@c0@"
199:
  en: "@a%0%a002010@bWell, as long as they're careful, everything should be fine.\n@c0@"
  ja: "@a@b%a002010「くれぐれも\n\t井戸には　気をつけてね！\n@c0@"
  ko: "@a@b%a002010: 그래도\n우물은 조심하도록 해!\n@c0@"
  sl: "@a@b%a002010：去井边一定要万事小心！\n@c0@"
  tl: "@a@b%a002010：去井邊一定要萬事小心！\n@c0@"
200:
  en: "@a%0%a002020@bOooh, that does sound fun! Maybe I could try that out sometime!\n@c0@"
  ja: "@a@b%a002020「楽しそう……\n\tあたしも　いっしょに\n\tあそびたいかも。\n@c0@"
  ko: "@a@b%a002020: 재밌겠다......\n나도 같이\n놀았으면 좋겠어.\n@c0@"
  sl: "@a@b%a002020：好好玩的样子……\n　　我也想跟他们一起去玩。\n@c0@"
  tl: "@a@b%a002020：好好玩的樣子……\n　　我也想跟他們一起去玩。\n@c0@"
201:
  en: "@a%0%a002030@b‘Pretend to be a well wisher’!? What can it all mean!? Perhaps my youth was a little too sheltered...\n@c0@"
  ja: "@a@b%a002030「いどまじんごっこ……\n\tどんな　あそびなんでしょうね。\n@c0@"
  ko: "@a@b%a002030: 우물 마신 놀이라......\n어떤 놀이일까요?\n@c0@"
  sl: "@a@b%a002030：深井魔人捉迷藏……\n　　是个什么样的游戏呢？\n@c0@"
  tl: "@a@b%a002030：深井魔人捉迷藏……\n　　是個什麼樣的遊戲呢？\n@c0@"
202:
  en: "@a%0%a002050@bNow that's a fine game! I'd like to join in if I didn't have adventurin' duties!\n@c0@"
  ja: "@a@b%a002050「どっちの　かたが\n\tいどまじんの　役なんですか？\n@c0@"
  ko: "@a@b%a002050: 어느 분이\n우물 마신 역할을 맡는 거죠?\n@c0@"
  sl: "@a@b%a002050：谁扮深井魔人呢？\n@c0@"
  tl: "@a@b%a002050：誰扮深井魔人呢？\n@c0@"
203:
  en: "@a%0%a002000@bThe poor kid shouldn't study his whole life away. He needs to get out and live a little.\n@c0@"
  ja: "@a@b%a002000「学力だけじゃなく\n\t体力だって　ひつようだぜ！\n@c0@"
  ko: "@a@b%a002000: 학력뿐 아니라\n체력도 필요하다고!\n@c0@"
  sl: "@a@b%a002000：不仅是知识，\n　　体力也很重要啊！\n@c0@"
  tl: "@a@b%a002000：不僅是知識，\n　　體力也很重要啊！\n@c0@"
204:
  en: "@a%0%a002010@bIt's a mother's lot to worry about her child's education.\n@c0@"
  ja: "@a@b%a002010「教育熱心な　おかあさんね。\n@c0@"
  ko: "@a@b%a002010: 교육에 열성적인 어머니네.\n@c0@"
  sl: "@a@b%a002010：这位母亲很关心孩子的教育呢。\n@c0@"
  tl: "@a@b%a002010：這位母親很關心孩子的教育呢。\n@c0@"
205:
  en: "@a%0%a002020@bRaising a kid is a real adventure, I'll bet.\n@c0@"
  ja: "@a@b%a002020「子育てって\n\t大変そう。\n@c0@"
  ko: "@a@b%a002020: 아이 키우는 일,\n힘들겠어.\n@c0@"
  sl: "@a@b%a002020：教育孩子真不容易呢。\n@c0@"
  tl: "@a@b%a002020：教育孩子真不容易呢。\n@c0@"
206:
  en: "@a%0%a002030@bI can only commend the boy's diligence. A bright future awaits him, I'm sure!\n@c0@"
  ja: "@a@b%a002030「お子さんが　かしこいと\n\t夢がふくらみますよね。\n@c0@"
  ko: "@a@b%a002030: 자녀가 똑똑하면\n꿈에 부풀게 되죠.\n@c0@"
  sl: "@a@b%a002030：孩子教养得好，\n　　做父母的睡着都会笑醒吧。\n@c0@"
  tl: "@a@b%a002030：孩子教養得好，\n　　做父母的睡著都會笑醒吧。\n@c0@"
207:
  en: "@a%0%a002050@bMy old mother wanted me to become a famous scholar too! Sadly, things didn't quite pan out that way...\n@c0@"
  ja: "@a@b%a002050「学者さんですかあ。\n\tそういえば私も　学者に　なれなれって\n\tよく母親に　言われました。\n@c0@"
  ko: "@a@b%a002050: 학자 말입니까.\n그러고 보니 저도 학자가 되란 소리를\n어머니한테서 자주 들었죠.\n@c0@"
  sl: "@a@b%a002050：学者啊。\n　　说起来，我的母亲也想让我成为学者呢。\n@c0@"
  tl: "@a@b%a002050：學者啊。\n　　說起來，我的母親也想讓我成為學者呢。\n@c0@"
208:
  en: "@a%0%a002000@bBooks are all well and good, but seein' is believin'!\n@c0@"
  ja: "@a@b%a002000「オレだって　武術以外は\n\t知らないことのほうが　多いけどな。\n@c0@"
  ko: "@a@b%a002000: 난 무술 말고 다른 건\n모르는 게 더 많은데 말이지.\n@c0@"
  sl: "@a@b%a002000：俺除了打架，\n　　其它好多事情基本上是一窍不通呢。\n@c0@"
  tl: "@a@b%a002000：俺除了打架，\n　　其它好多事情基本上是一竅不通呢。\n@c0@"
209:
  en: "@a%0%a002010@bGood for him! Developing your own thirst for knowledge is the most important part of education.\n@c0@"
  ja: "@a@b%a002010「えらいわね。\n\t自分から　きょうみを　持つのが\n\tいちばん　だいじよ。\n@c0@"
  ko: "@a@b%a002010: 기특하네.\n스스로 흥미를 가지는 게\n가장 중요해.\n@c0@"
  sl: "@a@b%a002010：真了不起。\n　　兴趣才是最好的老师呢。\n@c0@"
  tl: "@a@b%a002010：真了不起。\n　　興趣才是最好的老師呢。\n@c0@"
210:
  en: "@a%0%a002020@bIf he wants amazin', he should try studying magic. It's got a million-and-one uses!\n@c0@"
  ja: "@a@b%a002020「魔法も\n\t勉強してみるといいよ！\n@c0@"
  ko: "@a@b%a002020: 마법도\n공부해 보면 좋을 거야!\n@c0@"
  sl: "@a@b%a002020：学学魔法也不错哦！\n@c0@"
  tl: "@a@b%a002020：學學魔法也不錯哦！\n@c0@"
211:
  en: "@a%0%a002030@bIt's good to see a smart young man who's hungry for further knowledge. Rather reminds me of myself...\n@c0@"
  ja: "@a@b%a002030「好奇心の　強い\n\tお子さんの　ようですね。\n@c0@"
  ko: "@a@b%a002030: 호기심이 강한\n아이 같네요.\n@c0@"
  sl: "@a@b%a002030：真是个好奇心旺盛的孩子啊。\n@c0@"
  tl: "@a@b%a002030：真是個好奇心旺盛的孩子啊。\n@c0@"
212:
  en: "@a%0%a002050@bHe's got himself a nice little set-up here! Wish I'd had a room to study in as a lad.\n@c0@"
  ja: "@a@b%a002050「りっぱな\n\t勉強べや　ですねえ。\n@c0@"
  ko: "@a@b%a002050: 훌륭한\n공부방이로군요.\n@c0@"
  sl: "@a@b%a002050：这个小书房真不错呢。\n@c0@"
  tl: "@a@b%a002050：這個小書房真不錯呢。\n@c0@"
213:
  en: "@a%0%a002000@bWe haven't run into anything we can't handle yet.\n@c0@"
  ja: "@a@b%a002000「むすめさんが\n\tゆうかいされたときは\n\t町長も　大変だったけど……\n@c0@"
  ko: "@a@b%a002000: 따님이\n납치되었을 때는\n촌장님도 많이 힘드셨겠지만......\n@c0@"
  sl: "@a@b%a002000：女儿被拐走那段日子，\n　　镇长也不好过呢……\n@c0@"
  tl: "@a@b%a002000：女兒被拐走那段日子，\n　　鎮長也不好過呢……\n@c0@"
214:
  en: "@a%0%a002000@bKidnappers, sorcerers, run-of-the-mill crooks — they're all goin' down when we're in town!\n@c0@"
  ja: "@a@b%a002000「いまは　とくに\n\t心配ごとも　ないようだな！\n@c0@"
  ko: "@a@b%a002000: 지금은 특별히\n걱정할 일도 없겠군!\n@c0@"
  sl: "@a@b%a002000：不过现在\n　　没啥可担心了！\n@c0@"
  tl: "@a@b%a002000：不過現在\n　　沒啥可擔心了！\n@c0@"
215:
  en: "@a%0%a002010@bMy word, the Chief's aura is blinding!\n@c0@"
  ja: "@a@b%a002010「町長さん\n\tとっても　顔いろが\n\tいいわね。\n@c0@"
  ko: "@a@b%a002010: 촌장님,\n얼굴이 많이\n좋아지셨네.\n@c0@"
  sl: "@a@b%a002010：镇长的脸色也变得红润起来了呢。\n@c0@"
  tl: "@a@b%a002010：鎮長的臉色也變得紅潤起來了呢。\n@c0@"
216:
  en: "@a%0%a002020@bBoy, this village chief sure looks the part.\n@c0@"
  ja: "@a@b%a002020「この人　いかにも\n\t町長って　感じだね。\n@c0@"
  ko: "@a@b%a002020: 이 사람, 아무리 봐도\n촌장같이 생겼네.\n@c0@"
  sl: "@a@b%a002020：这个人镇长范十足呢。\n@c0@"
  tl: "@a@b%a002020：這個人鎮長范十足呢。\n@c0@"
217:
  en: "@a%0%a002030@bIt's good to see the village chief carefree and smiling. He's been through rather a trying time.\n@c0@"
  ja: "@a@b%a002030「笑いかたが\n\tごうかいですね。\n@c0@"
  ko: "@a@b%a002030: 호탕한\n웃음소리로군요.\n@c0@"
  sl: "@a@b%a002030：笑得真豪爽啊。\n@c0@"
  tl: "@a@b%a002030：笑得真豪爽啊。\n@c0@"
218:
  en: "@a%0%a002050@bI had nothing to do with any of that. Makes me feel quite left out, it does...\n@c0@"
  ja: "@a@b%a002050「その　キミたち…　に\n\t私が　入っていないのが\n\tなんとも　ざんねんで……。\n@c0@"
  ko: "@a@b%a002050: 그 자네들......에\n제가 들어가 있지 않은 것이\n참 유감입니다만......\n@c0@"
  sl: "@a@b%a002050：那个……\n　　没能加入你们，\n　　真是遗憾啊……\n@c0@"
  tl: "@a@b%a002050：那個……\n　　沒能加入你們，\n　　真是遺憾啊……\n@c0@"
219:
  en: "@a%0%a002000@bGood to see Cynthia doin' well, aye?\n@c0@"
  ja: "@a@b%a002000「エリザさん\n\t元気そうで　よかったな。\n@c0@"
  ko: "@a@b%a002000: 엘리자 씨,\n잘 지내고 있는 것 같아 다행이군.\n@c0@"
  sl: "@a@b%a002000：艾莉莎看起来精神不错，\n　　太好了。\n@c0@"
  tl: "@a@b%a002000：艾莉莎看起來精神不錯，\n　　太好了。\n@c0@"
220:
  en: "@a%0%a002010@bPoor Cynthia. I still shiver when I think of what she must have been through...\n@c0@"
  ja: "@a@b%a002010「エリザさん　こんにちは。\n\tゆうかい　されたときは\n\t大変だったでしょうけど……\n@c0@"
  ko: "@a@b%a002010: 엘리자 씨, 안녕?\n납치되었을 땐\n많이 힘들었겠지만......\n@c0@"
  sl: "@a@b%a002010：你好，艾莉莎。\n　　被拐走一定很难受吧……\n@c0@"
  tl: "@a@b%a002010：你好，艾莉莎。\n　　被拐走一定很難受吧……\n@c0@"
221:
  en: "@a%0%a002010@bBut I must say, she seems to be doing much better these days!\n@c0@"
  ja: "@a@b%a002010「いまは　もう\n\tすっかり　元気そうね。\n@c0@"
  ko: "@a@b%a002010: 이제는\n건강하게 잘 지내는 것 같네.\n@c0@"
  sl: "@a@b%a002010：不过现在的你，\n　　看起来精神饱满呢。\n@c0@"
  tl: "@a@b%a002010：不過現在的你，\n　　看起來精神飽滿呢。\n@c0@"
222:
  en: "@a%0%a002020@bHer name's Cynthia, right? Good thing she didn't get her looks from her father!\n@c0@"
  ja: "@a@b%a002020「エリザさん　だっけ？\n\tお父さんに　似なくて\n\tよかったよね～。\n@c0@"
  ko: "@a@b%a002020: 엘리자 씨였던가?\n아버지를 안 닮아서\n다행이네~\n@c0@"
  sl: "@a@b%a002020：你是叫艾莉莎吧？\n　　幸好你长得不像你爸～\n@c0@"
  tl: "@a@b%a002020：你是叫艾莉莎吧？\n　　幸好你長得不像你爸～\n@c0@"
223:
  en: "@a%0%a002030@bIt is pleasant indeed to be given such a warm welcome. In fact, I feel a little flushed...\n@c0@"
  ja: "@a@b%a002030「どうも\n\tおじゃましております。\n@c0@"
  ko: "@a@b%a002030: 안녕하세요.\n좀 들렀다 가겠습니다.\n@c0@"
  sl: "@a@b%a002030：你好，打扰了。\n@c0@"
  tl: "@a@b%a002030：你好，打擾了。\n@c0@"
224:
  en: "@a%0%a002050@bI probably don't count as one of this lady's ‘heroes’, but it's grand to be here all the same!\n@c0@"
  ja: "@a@b%a002050「私まで　おじゃまして\n\tすいません！\n@c0@"
  ko: "@a@b%a002050: 저까지 찾아와서\n죄송합니다!\n@c0@"
  sl: "@a@b%a002050：连我也来打扰，\n　　真是抱歉！\n@c0@"
  tl: "@a@b%a002050：連我也來打擾，\n　　真是抱歉！\n@c0@"
