  sl: "@a@b%a002050：我要是遇到了那个人的话，\n　　会不会立刻就明白\n　　他跟%a000090是同一个人呢……\n@c0@"
  tl: "@a@b%a002050：我要是遇到了那個人的話，\n　　會不會立刻就明白\n　　他跟%a000090是同一個人呢……\n@c0@"
32:
  en: "@a%0%a002000@bHey, about that lightning staff the King gave us...\n@c0@"
