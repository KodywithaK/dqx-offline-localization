0:
  en: "@a%0%a002000@bTake it from me, %a000090: havin' your real body back feels great! We'll track yours down too, don't worry!\n@c0@"
  ja: "@a@b%a002000「そうだな　%a000090。\n\t今度は　おまえの　身体を\n\t見つけなくっちゃな！\n@c0@"
  ko: "@a@b%a002000: 맞아, %a000090.\n이제 네 몸을\n찾아야지!\n@c0@"
  sl: "@a@b%a002000：没错，%a000090。\n　　接下来要去找你的身体！\n@c0@"
  tl: "@a@b%a002000：沒錯，%a000090。\n　　接下來要去找你的身體！\n@c0@"
1:
  en: "@a%0%a002010@bIt seems that Queen Apnea has been giving your situation a lot of thought, %a000090...\n@c0@"
  ja: "@a@b%a002010「王妃さまは\n\t本当に　%a000090のことを\n\t思っていらっしゃるのね。\n@c0@"
  ko: "@a@b%a002010: 왕비님은\n%a000090%F0090%X를%Y을%Z 진심으로\n생각하고 계신가 보네.\n@c0@"
  sl: "@a@b%a002010：王妃殿下真是为%a000090\n　　操了不少心呢。\n@c0@"
  tl: "@a@b%a002010：王妃殿下真是為%a000090\n　　操了不少心呢。\n@c0@"
2:
  en: "@a%0%a002020@bWell, despite the confusing circumstances, this lady's definitely your mother, %a000090! I'm sure of it!\n@c0@"
  ja: "@a@b%a002020「細かいことは　ともかく\n\tきっと　この人が\n\t%a000090の　お母さんなのね！\n@c0@"
  ko: "@a@b%a002020: 자세한 건 모르겠지만\n이 사람이 바로\n%a000090의 어머니구나!\n@c0@"
  sl: "@a@b%a002020：具体怎么样我不好说，\n　　不过这个人绝对就是\n　　%a000090的母亲吧！\n@c0@"
  tl: "@a@b%a002020：具體怎麼樣我不好說，\n　　不過這個人絕對就是\n　　%a000090的母親吧！\n@c0@"
3:
  en: "@a%0%a002030@bI fear that Murdaw's downfall has not resolved all the world's problems. Stern tests may yet lie ahead...\n@c0@"
  ja: "@a@b%a002030「ムドーが　倒れたいまも\n\tまだ　すべてが　解決したわけでは\n\tないのかもしれませんね。\n@c0@"
  ko: "@a@b%a002030: 무도가 쓰러진 지금도\n아직 모든 것이 해결되진\n않은 걸지도 모르겠네요.\n@c0@"
  sl: "@a@b%a002030：虽说打倒了姆多，\n　　但是这并不意味着所有问题都已经解决。\n@c0@"
  tl: "@a@b%a002030：雖說打倒了姆多，\n　　但是這並不意味著所有問題都已經解決。\n@c0@"
4:
  en: "@a%0%a002050@bThe Queen of Somnia is quite a looker, if I may be so bold!\n@c0@"
  ja: "@a@b%a002050「レイドック城の　王妃さまは\n\tとっても　おキレイな方ですね。\n@c0@"
  ko: "@a@b%a002050: 레이독 성의 왕비님은\n매우 아름다운 분이로군요.\n@c0@"
  sl: "@a@b%a002050：雷多克城的王妃殿下\n　　真是美丽优雅啊。\n@c0@"
  tl: "@a@b%a002050：雷多克城的王妃殿下\n　　真是美麗優雅啊。\n@c0@"
5:
  en: "@a%0%a002050@bFair reminds me of my old mother, she does. With fancier hair.\n@c0@"
  ja: "@a@b%a002050「失礼ながら　私の母を\n\t思い出しちゃいましたよ！\n@c0@"
  ko: "@a@b%a002050: 실례인 줄은 알지만 저희\n어머니를 떠올려 버렸습니다!\n@c0@"
  sl: "@a@b%a002050：不好意思，看到她，\n　　我想起了我的母亲！\n@c0@"
  tl: "@a@b%a002050：不好意思，看到她，\n　　我想起了我的母親！\n@c0@"
6:
  en: "@a%0%a002000@bC'mon gang! We're rarin' to go and ready for anything!\n@c0@"
  ja: "@a@b%a002000「オレたちも\n\t気をひきしめて　いこうぜ！\n@c0@"
  ko: "@a@b%a002000: 우리도\n긴장 풀지 말고 가 보자!\n@c0@"
  sl: "@a@b%a002000：咱们也调整好状态，\n　　出发吧！\n@c0@"
  tl: "@a@b%a002000：咱們也調整好狀態，\n　　出發吧！\n@c0@"
7:
  en: "@a%0%a002010@bIn a way, we're all searching for ourselves on this quest. I know I am...\n@c0@"
  ja: "@a@b%a002010「私も　旅をしながら\n\t自分の　いきかたを\n\t探してみようかしら……。\n@c0@"
  ko: "@a@b%a002010: 나도 여행을 하면서\n앞으로의 삶의 방향을\n좀 찾아볼까......\n@c0@"
  sl: "@a@b%a002010：我也通过旅行，\n　　去寻找自己人生的道路吧……\n@c0@"
  tl: "@a@b%a002010：我也通過旅行，\n　　去尋找自己人生的道路吧……\n@c0@"
8:
  en: "@a%0%a002020@bYou heard the King — let's go!\n@c0@"
  ja: "@a@b%a002020「はーい\n\tいってきまーす。\n@c0@"
  ko: "@a@b%a002020: 네~\n다녀올게요~\n@c0@"
  sl: "@a@b%a002020：好～的～\n　　我们走了。\n@c0@"
  tl: "@a@b%a002020：好～的～\n　　我們走了。\n@c0@"
9:
  en: "@a%0%a002030@bIt is hard to comprehend how this good-hearted king could become Murdaw in the dream world.\n@c0@"
  ja: "@a@b%a002030「この　やさしそうな王さまが\n\t夢の世界では　ムドーだったとは\n\t何か　信じられませんね。\n@c0@"
  ko: "@a@b%a002030: 이 온화해 보이는 왕이\n꿈의 세계에서는 무도였다니\n왠지 믿기지가 않는군요.\n@c0@"
  sl: "@a@b%a002030：这么温柔的国王陛下，\n　　在梦世界中居然就是姆多，\n　　实在是难以置信。\n@c0@"
  tl: "@a@b%a002030：這麼溫柔的國王陛下，\n　　在夢世界中居然就是姆多，\n　　實在是難以置信。\n@c0@"
10:
  en: "@a%0%a002050@bI'm just flabbergasted that a two-bit adventurer like me can have an audience with the King of Somnia!\n@c0@"
  ja: "@a@b%a002050「いや　それにしても\n\tレイドック王に　おめどおりが\n\tできるなんて　おそれおおいですね！\n@c0@"
  ko: "@a@b%a002050: 이야, 그나저나\n레이독 왕을 직접 뵙다니\n황공할 따름이군요!\n@c0@"
  sl: "@a@b%a002050：哎呀！\n　　我竟然有幸一睹雷多克王的尊容，\n　　真是惶恐至极！\n@c0@"
  tl: "@a@b%a002050：哎呀！\n　　我竟然有幸一睹雷多克王的尊容，\n　　真是惶恐至極！\n@c0@"
11:
  en: "@a%0%a002000@bNothin' can stop us now that we've got free use of that boat. The world's our seaslime!\n@c0@"
  ja: "@a@b%a002000「やったな！\n\tあの　船さえあれば　これからも\n\t好きなところに　行けるぜ！\n@c0@"
  ko: "@a@b%a002000: 좋았어!\n그 배만 있으면 이제\n원하는 곳으로 갈 수 있겠군!\n@c0@"
  sl: "@a@b%a002000：太棒了！\n　　只要有了那艘船，\n　　想去哪都行！\n@c0@"
  tl: "@a@b%a002000：太棒了！\n　　只要有了那艘船，\n　　想去哪都行！\n@c0@"
12:
  en: "@a%0%a002010@bNow that we have command of the Providence, we're free to explore much more of the world. How exciting!\n@c0@"
  ja: "@a@b%a002010「神の船が　あれば\n\tこの世界を　あちこち\n\t航海できるわね。\n@c0@"
  ko: "@a@b%a002010: 신의 배가 있으면\n이 세계를 두루\n항해할 수 있겠는걸.\n@c0@"
  sl: "@a@b%a002010：有了神之船，\n　　就能在这个世界的海面上\n　　畅通无阻了呢。\n@c0@"
  tl: "@a@b%a002010：有了神之船，\n　　就能在這個世界的海面上\n　　暢通無阻了呢。\n@c0@"
13:
  en: "@a%0%a002020@bEast of Somnia Castle, right? Let's go check it out!\n@c0@"
  ja: "@a@b%a002020「神の船は\n\tずっと東に行った　海岸だって！\n\t早く　行ってみようよ！\n@c0@"
  ko: "@a@b%a002020: 신의 배는\n동쪽으로 한참 떨어진 해안에 있대!\n어서 가 보자!\n@c0@"
  sl: "@a@b%a002020：神之船好像停靠在\n　　一直往东的海岸边上！\n　　赶紧去看看吧！\n@c0@"
  tl: "@a@b%a002020：神之船好像停靠在\n　　一直往東的海岸邊上！\n　　趕緊去看看吧！\n@c0@"
14:
  en: "@a%0%a002030@bThe Elder of Ghent has once again given me more than I could ever thank him for...\n@c0@"
  ja: "@a@b%a002030「おじいさま……。\n\tいつも　感謝しています。\n@c0@"
  ko: "@a@b%a002030: 할아버님......\n항상 감사하고 있습니다.\n@c0@"
  sl: "@a@b%a002030：爷爷……\n　　谢谢您一直以来对我的照顾。\n@c0@"
  tl: "@a@b%a002030：爺爺……\n　　謝謝您一直以來對我的照顧。\n@c0@"
15:
  en: "@a%0%a002050@bHang about! Forgive old %a002050 if he's a bit slow off the mark...\n@c0@"
  ja: "@a@b%a002050「あ！　みなさんの船は\n\tゲントの村に　まつられるという\n\tあの　神の船だったんですか！？\n@c0@"
  ko: "@a@b%a002050: 앗! 여러분의 배는\n겐트 마을에 모셔져 있다는\n그 신의 배였단 말입니까!?\n@c0@"
  sl: "@a@b%a002050：啊！你们的船难道是\n　　根特村一直供奉着的\n　　那艘神之船么？！\n@c0@"
  tl: "@a@b%a002050：啊！你們的船難道是\n　　根特村一直供奉著的\n　　那艘神之船麼？！\n@c0@"
16:
  en: "@a%0%a002050@bAre you really sayin' we're gettin' free use of the sacred ship of Ghent!? Well, I'll be!\n@c0@"
  ja: "@a@b%a002050「なんかもう\n\tすごすぎて　笑っちゃいますね。\n\tわっはっは！\n@c0@"
  ko: "@a@b%a002050: 너무 대단해서\n웃음밖에 안 나오는군요.\n와하하!\n@c0@"
  sl: "@a@b%a002050：你们实在是太厉害了。\n　　我都忍不住为你们感到高兴了呢，\n　　哇哈哈！\n@c0@"
  tl: "@a@b%a002050：你們實在是太厲害了。\n　　我都忍不住為你們感到高興了呢，\n　　哇哈哈！\n@c0@"
17:
  en: "@a%0%a002000@bSometimes a dream is just a dream. No use losin' sleep over it.\n@c0@"
  ja: "@a@b%a002000「まあ\n\t夢は　夢だからなあ。\n@c0@"
  ko: "@a@b%a002000: 뭐,\n꿈은 꿈이니까.\n@c0@"
  sl: "@a@b%a002000：哎，梦这东西果然就是梦啊。\n@c0@"
  tl: "@a@b%a002000：哎，夢這東西果然就是夢啊。\n@c0@"
18:
  en: "@a%0%a002010@bIt makes perfect sense! Alltrades Abbey must be restored in the dream world!\n@c0@"
  ja: "@a@b%a002010「わかったわ！\n\t夢の世界で　ダーマ神殿が\n\t復活したと　いうことよね。\n@c0@"
  ko: "@a@b%a002010: 알았다!\n꿈의 세계에서 다마 신전이\n부활했다는 얘기구나?\n@c0@"
  sl: "@a@b%a002010：我懂了！\n　　也就是说梦世界的达玛神殿\n　　已经复活了！\n@c0@"
  tl: "@a@b%a002010：我懂了！\n　　也就是說夢世界的達瑪神殿\n　　已經復活了！\n@c0@"
19:
  en: "@a%0%a002020@bAlltrades Abbey is back? This I gotta see!\n@c0@"
  ja: "@a@b%a002020「ダーマ神殿が　復活した？\n\t行ってみたいー！\n@c0@"
  ko: "@a@b%a002020: 다마 신전이 부활했다구?\n가 보고 싶어~\n@c0@"
  sl: "@a@b%a002020：达玛神殿复活了？\n　　好想去看看！\n@c0@"
  tl: "@a@b%a002020：達瑪神殿復活了？\n　　好想去看看！\n@c0@"
20:
  en: "@a%0%a002030@bIt is feasible that this fellow has witnessed an event that has occurred in the dream world...\n@c0@"
  ja: "@a@b%a002030「ひょっとすると\n\tあちらの世界の出来事を\n\t夢で見たのでしょうか？\n@c0@"
  ko: "@a@b%a002030: 이거 혹시\n저쪽 세계에서 일어난 일을\n꿈을 통해 본 걸까요?\n@c0@"
  sl: "@a@b%a002030：难不成那个梦，\n　　梦到的是那边那个世界\n　　发生的事情？\n@c0@"
  tl: "@a@b%a002030：難不成那個夢，\n　　夢到的是那邊那個世界\n　　發生的事情？\n@c0@"
21:
  en: "@a%0%a002050@bAlltrades Abbey? Am I right in thinkin' that we stopped by there on our travels?\n@c0@"
  ja: "@a@b%a002050「あれ？\n\t私たち　行きませんでしたっけ？\n\tダーマ神殿。\n@c0@"
  ko: "@a@b%a002050: 어라?\n우리 가 보지 않았나요?\n다마 신전.\n@c0@"
  sl: "@a@b%a002050：诶？\n　　我们还没有去过达玛神殿么？\n@c0@"
  tl: "@a@b%a002050：誒？\n　　我們還沒有去過達瑪神殿麼？\n@c0@"
22:
  en: "@a%0%a002000@bThink all this praise'll give us big heads? Mine's already mighty huge.\n@c0@"
  ja: "@a@b%a002000「おう！\n\t兵士の　みんなも　がんばってな！\n@c0@"
  ko: "@a@b%a002000: 여어!\n병사들도 모두 힘내라고!\n@c0@"
  sl: "@a@b%a002000：哦！各位士兵们！\n　　你们也要好好干啊！\n@c0@"
  tl: "@a@b%a002000：哦！各位士兵們！\n　　你們也要好好幹啊！\n@c0@"
23:
  en: "@a%0%a002010@bIt was our pleasure, wasn't it %a000090?\n@c0@"
  ja: "@a@b%a002010「どういたしまして。\n@c0@"
  ko: "@a@b%a002010: 별 말씀을요.\n@c0@"
  sl: "@a@b%a002010：不客气。\n@c0@"
  tl: "@a@b%a002010：不客氣。\n@c0@"
24:
  en: "@a%0%a002020@bI'm a hero too? Little ol' me? Really?\n@c0@"
  ja: "@a@b%a002020「え　あたしも？\n@c0@"
  ko: "@a@b%a002020: 어, 나도?\n@c0@"
  sl: "@a@b%a002020：诶？我也算是勇者么？\n@c0@"
  tl: "@a@b%a002020：誒？我也算是勇者麼？\n@c0@"
25:
  en: "@a%0%a002030@bI do no more than the noble traditions of Ghent demand.\n@c0@"
  ja: "@a@b%a002030「おつかれさまです。\n@c0@"
  ko: "@a@b%a002030: 수고 많으십니다.\n@c0@"
  sl: "@a@b%a002030：辛苦了。\n@c0@"
  tl: "@a@b%a002030：辛苦了。\n@c0@"
26:
  en: "@a%0%a002050@bNo, no, don't go praisin' old %a002050 to the hilt! I was just along for the ride really!\n@c0@"
  ja: "@a@b%a002050「いやその　私は\n\tわりと最近　仲間に\n\t加わったばかりでして……。\n@c0@"
  ko: "@a@b%a002050: 아, 그러니까 저는\n비교적 최근에 동료로\n합류해서 말이죠......\n@c0@"
  sl: "@a@b%a002050：哎呀，\n　　我是最近才加入大伙的……\n@c0@"
  tl: "@a@b%a002050：哎呀，\n　　我是最近才加入大夥的……\n@c0@"
27:
  en: "@a%0%a002000@bThere's another %a000090 out there somewhere. Your fate is to find your real self.\n@c0@"
  ja: "@a@b%a002000「もうひとりの\n\t%a000090……　はやく実物にも\n\t会ってみたいぜ。\n@c0@"
  ko: "@a@b%a002000: 또 하나의\n%a000090...... 어서 실물을\n만나 보고 싶군.\n@c0@"
  sl: "@a@b%a002000：另一个%a000090……\n　　真想快点看看长什么样啊。\n@c0@"
  tl: "@a@b%a002000：另一個%a000090……\n　　真想快點看看長什麼樣啊。\n@c0@"
28:
  en: "@a%0%a002010@bCertainly not the first time we've heard this...\n@c0@"
  ja: "@a@b%a002010「なんども\n\tまちがえられたものね。\n@c0@"
  ko: "@a@b%a002010: 널 왕자로 착각하는 일은\n지금까지도 종종 있었지.\n@c0@"
  sl: "@a@b%a002010：已经被认错很多次了。\n@c0@"
  tl: "@a@b%a002010：已經被認錯很多次了。\n@c0@"
29:
  en: "@a%0%a002020@bHmm...\n@c0@"
  ja: "@a@b%a002020「ふーん……。\n@c0@"
  ko: "@a@b%a002020: 흐음......\n@c0@"
  sl: "@a@b%a002020：唔……\n@c0@"
  tl: "@a@b%a002020：唔……\n@c0@"
30:
  en: "@a%0%a002030@bIt seems that in some respects, you are not identical to the real prince. I find this most fascinating...\n@c0@"
  ja: "@a@b%a002030「ぎゃくに　完全に\n\tそっくりでは　ないらしい点が\n\t興味ぶかいですね。\n@c0@"
  ko: "@a@b%a002030: 반대로 완전히\n똑같지는 않다는 점이\n흥미롭군요.\n@c0@"
  sl: "@a@b%a002030：我反倒比较好奇，\n　　两人有什么地方不一样。\n@c0@"
  tl: "@a@b%a002030：我反倒比較好奇，\n　　兩人有什麼地方不一樣。\n@c0@"
