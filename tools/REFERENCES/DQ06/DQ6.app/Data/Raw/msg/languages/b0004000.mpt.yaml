  ja: "@a@bソルディ「しかし　ざんねんながら\n\tたった今　%a002000という者を\n\t兵士に採用したところだ。\n@c0@"
  ko: "@a@b솔디: 그런데 아쉽게도\n방금 전에 %a002000%F2000%X라%Y이라%Z는 자를\n병사로 채용했지 뭔가.\n@c0@"
  sl: "@a@b索迪：不过很遗憾，\n　　那个名叫%a002000的人\n　　已经被录用了。\n@c0@"
  tl: "@a@b索迪：不過很遺憾，\n　　那個名叫%a002000的人\n　　已經被錄用了。\n@c0@"
36:
  en: "@aCaptain Blade@bThat'll be the last test for a while, sadly. But keep training, recruit. Never give up on your dreams. \n@c0@"
  ja: "@a@bソルディ「ここ　しばらくは　兵士を\n\tぼしゅうすることも　ないが\n\tチカラを　おとすでないぞ。\n@c0@"
  ko: "@a@b솔디: 당분간 병사를\n모집할 일은 없지만\n낙심하지 말도록.\n@c0@"
  sl: "@a@b索迪：现在这里暂时不需要士兵，\n　　但是你不必灰心丧气。\n@c0@"
  tl: "@a@b索迪：現在這裡暫時不需要士兵，\n　　但是你不必灰心喪氣。\n@c0@"
37:
  en: "@a@b*: It won't be long until the final battle with Murdaw. I can feel it in my bones.\n@c0@"
  ja: "@a@b＊「どうやら　決戦のときが\n\t近づいているような\n\tそんな気が　するのだ。\n@c0@"
  ko: "@a@b*: 아무래도 결전의 때가\n다가왔다는\n기분이 들어.\n@c0@"
  sl: "@a@b＊：看起来，\n　　决战的时刻越来越近了。\n　　气氛变得紧张起来。\n@c0@"
  tl: "@a@b＊：看起來，\n　　決戰的時刻越來越近了。\n　　氣氛變得緊張起來。\n@c0@"
38:
  en: "@a@b*: If you haven't polished up your weapons, now's the time, %A0120%Xbrother%Z%B0120%Xsister%Z!\n@c0@"
  ja: "@a@b＊「武器の手入れを\n\t念入りに　しなくてはな！\n@c0@"
  ko: "@a@b*: 무기 손질에\n심혈을 기울여야겠군!\n@c0@"
  sl: "@a@b＊：要好好保养手中的武器！\n@c0@"
  tl: "@a@b＊：要好好保養手中的武器！\n@c0@"
39:
  en: "@a@b*: I'm still pretty new around here. I joined right after my old man retired.\n@c0@"
  ja: "@a@b＊「ぼくは　引退した親父にかわって\n\tつい最近　兵士になりました。\n@c0@"
  ko: "@a@b*: 저는 은퇴한 아버지를 대신해\n이제 갓 병사가 되었습니다.\n@c0@"
  sl: "@a@b＊：我的父亲退休了，\n　　最近我代替他成为了士兵。\n@c0@"
  tl: "@a@b＊：我的父親退休了，\n　　最近我代替他成為了士兵。\n@c0@"
40:
  en: "@a@b*: His Majesty hasn't said a single word to me yet...\n@c0@"
  ja: "@a@b＊「だから　まだ　王さまとは\n\t直接　話したこと　ないんです。\n@c0@"
  ko: "@a@b*: 그래서 아직 국왕 폐하와\n직접 얘기해보진 못했지요.\n@c0@"
  sl: "@a@b＊：不过，到现在为止\n　　都没跟陛下直接说过话。\n@c0@"
  tl: "@a@b＊：不過，到現在為止\n　　都沒跟陛下直接說過話。\n@c0@"
41:
  en: "@a@b*: (sigh) I wonder if I'll ever get a chance to speak with him…\n@c0@"
  ja: "@a@b＊「あ～あ　はやく　王さまに\n\t声をかけてもらいたいなあ。\n@c0@"
  ko: "@a@b*: 아아~ 빨리 폐하의\n부르심을 받고 싶은데.\n@c0@"
  sl: "@a@b＊：啊～\n　　希望陛下早日找我谈话。\n@c0@"
  tl: "@a@b＊：啊～\n　　希望陛下早日找我談話。\n@c0@"
42:
  en: "@a@b*: His Majesty is the hardest working man in the kingdom. His to-do list is three leagues long!\n@c0@"
  ja: "@a@b＊「王さまは　毎日　いろんなことで\n\tとても　いそがしいのよ。\n@c0@"
  ko: "@a@b*: 폐하는 여러 가지 일로\n매일매일 무척 바쁘시답니다.\n@c0@"
  sl: "@a@b＊：国王陛下每天有很多事要做，\n　　总是非常地忙碌。\n@c0@"
  tl: "@a@b＊：國王陛下每天有很多事要做，\n　　總是非常地忙碌。\n@c0@"
43:
  en: "@a@b*: Right now, I hear he's recruiting capable soldiers for a search expedition of some sort.\n@c0@"
  ja: "@a@b＊「今は　あるものを　さがすために\n\t有能な兵士を　集めているんですって。\n\t毎日　たいへんよね。\n@c0@"
  ko: "@a@b*: 지금은 어떤 물건을 찾으려고\n유능한 병사를 모은다나 봐요.\n매일 힘드시겠어요.\n@c0@"
  sl: "@a@b＊：现在在召集士兵，\n　　说是为了找什么东西。\n　　每天都很辛苦。\n@c0@"
  tl: "@a@b＊：現在在召集士兵，\n　　說是為了找什麼東西。\n　　每天都很辛苦。\n@c0@"
44:
  en: "@a@b*: This stairway leads to the throne room. Do you have business with His Majesty?\n@c0@"
  ja: "@a@b＊「この上は　レイドック王の間。\n\t王さまに　よばれてきたのか？\n@c0@"
  ko: "@a@b*: 이 위는 레이독 폐하의 옥좌이다. \n폐하의 부르심을 받고 왔는가?\n@c0@"
  sl: "@a@b＊：上面是谒见之间。\n　　是陛下召唤你来吗？\n@c0@"
  tl: "@a@b＊：上面是謁見之間。\n　　是陛下召喚你來嗎？\n@c0@"
45:
  en: "@a@b*: Very well. You may pass. But mind your manners in front of the King, you hear?\n@c0@"
  ja: "@a@b＊「では　通ってよろしい。\n\t王さまの前では　くれぐれも\n\tそそうの　ないようにな。\n@c0@"
  ko: "@a@b*: 그렇다면 지나가도 좋다.\n폐하 앞에서는 부디\n실례를 범하지 않도록!\n@c0@"
  sl: "@a@b＊：那你过去吧。\n　　不过你要谨慎，\n　　陛下面前可不能失礼。\n@c0@"
  tl: "@a@b＊：那你過去吧。\n　　不過你要謹慎，\n　　陛下面前可不能失禮。\n@c0@"
46:
  en: "@a@b*: ...Is what I WOULD have said if you actually had an appointment with him. But you don't, so beat it!\n@c0@"
  ja: "@a@b＊「と思ったが　やはり\n\tお前のような者が　よばれたとは\n\t聞いていなかった！\n@c0@"
  ko: "@a@b*: 아니, 역시\n너 같은 놈을 부르셨다는 말씀은\n들은 바 없다!\n@c0@"
  sl: "@a@b＊：不对！\n　　你说你是奉命来的，\n　　但我根本没听说这样的命令！\n@c0@"
  tl: "@a@b＊：不對！\n　　你說你是奉命來的，\n　　但我根本沒聽說這樣的命令！\n@c0@"
47:
  en: "@a@b*: What kind of an idiot do you take me for, anyway?\n@c0@"
  ja: "@a@b＊「お前は　うそつきだな。\n@c0@"
  ko: "@a@b*: 거짓말은 안 통해.\n@c0@"
  sl: "@a@b＊：你在骗我吧。\n@c0@"
  tl: "@a@b＊：你在騙我吧。\n@c0@"
48:
  en: "@a@b*: Then I'm afraid I can't let you pass.\n@c0@"
  ja: "@a@b＊「ならば　わるいが\n\t通すわけには　いかない。\n@c0@"
  ko: "@a@b*: 미안하지만\n그냥 통과시킬 수 없지.\n@c0@"
  sl: "@a@b＊：那就不好意思了，\n　　不能让你通过。\n@c0@"
  tl: "@a@b＊：那就不好意思了，\n　　不能讓你通過。\n@c0@"
49:
  en: "@a@b*: His Majesty is busy dealing with pressing matters.\n@c0@"
  ja: "@a@b＊「王さまは　とても\n\tいそがしいのだ。\n@c0@"
  ko: "@a@b*: 폐하께선 무척\n바쁘시다.\n@c0@"
  sl: "@a@b＊：国王陛下忙得很，\n　　没时间见你。\n@c0@"
  tl: "@a@b＊：國王陛下忙得很，\n　　沒時間見你。\n@c0@"
50:
  en: "@a@b*: So, you passed the test, huh? Congratulations.\n@c0@"
  ja: "@a@b＊「そうか　兵士に採用されたのか。\n\tそれは　よかったな。\n@c0@"
  ko: "@a@b*: 그랬군, 병사로 채용되었군.\n거참 잘 된 일이야.\n@c0@"
  sl: "@a@b＊：是吗，你当上士兵了。\n　　那恭喜你了。\n@c0@"
  tl: "@a@b＊：是嗎，你當上士兵了。\n　　那恭喜你了。\n@c0@"
51:
  en: "@a@b*: Now don't go resting on your laurels. The trial was only the first step in your career, brother-in-arms.\n@c0@"
  ja: "@a@b＊「あとは　なにか手がらをたてて\n\t皆に　みとめてもらうことだ。\n@c0@"
  ko: "@a@b*: 이제 뭔가 공훈을 세워\n모두에게 인정받으면 되겠군.\n@c0@"
  sl: "@a@b＊：如果你以后立了功，\n　　大家就会认可你了。\n@c0@"
  tl: "@a@b＊：如果你以後立了功，\n　　大家就會認可你了。\n@c0@"
52:
  en: "@a@b*: Go out and accomplish great deeds. You'll catch the King's attention before long.\n@c0@"
  ja: "@a@b＊「そうすれば　王さまから\n\tじきじきに　お声が　かかるかも\n\tしれないぞ。\n@c0@"
  ko: "@a@b*: 그러면 폐하께서\n친히 불러주실 지도\n모르지.\n@c0@"
  sl: "@a@b＊：然后国王陛下就会\n　　亲自接见你。\n@c0@"
  tl: "@a@b＊：然後國王陛下就會\n　　親自接見你。\n@c0@"
53:
  en: "@a@b*: So you failed the test, huh? Well, not everyone's cut out for service.\n@c0@"
  ja: "@a@b＊「そうか　兵士になれなかったか。\n\tそれは　ざんねんだったな。\n@c0@"
  ko: "@a@b*: 그랬군, 병사가 되지 못했군.\n거참 아쉽게 됐군.\n@c0@"
  sl: "@a@b＊：是吗，没能成为士兵。\n　　那是挺遗憾的。\n@c0@"
  tl: "@a@b＊：是嗎，沒能成為士兵。\n　　那是挺遺憾的。\n@c0@"
54:
  en: "@a@b*: Oh, our kingdom for a worthy horse! The royal wagon sits immobile for want of a beast to pull it!\n@c0@"
  ja: "@a@b＊「王家に代々伝わる　この馬車も\n\tいまでは　これを引ける馬が\n\tいなくなってしまったのじゃ。\n@c0@"
  ko: "@a@b*: 왕가 대대로 전해지는\n이 마차도 지금은 끌 말이\n없어서 탈이지.\n@c0@"
  sl: "@a@b＊：这是王家代代相传的马车，\n　　但是现在没有一匹马\n　　能拉得动它。\n@c0@"
  tl: "@a@b＊：這是王家代代相傳的馬車，\n　　但是現在沒有一匹馬\n　　能拉得動它。\n@c0@"
55:
  en: "@a@b*: Not just any old nag will do. Why, the wagon's gilt alone weighs a ton!\n@c0@"
  ja: "@a@b＊「馬車が　立派すぎて\n\t重すぎるからとはいえ\n\tなさけないことよ。\n@c0@"
  ko: "@a@b*: 아무리 멋지고\n육중한 마차라지만\n한심한 일이지 뭔가.\n@c0@"
  sl: "@a@b＊：拉不动的原因是，\n　　太豪华导致它过于沉重，\n　　这真令我羞愧呀。\n@c0@"
  tl: "@a@b＊：拉不動的原因是，\n　　太豪華導致它過於沉重，\n　　這真令我羞愧呀。\n@c0@"
56:
  en: "@a@b*: Surely there's got to be a decent horse around here somewhere? Have you seen any with a bit of git-up-and-go in them? \n@c0@"
  ja: "@a@b＊「どこかに　いせいのよい馬は\n\tおらんものかのう……。\n@c0@"
  ko: "@a@b*: 이 마차에 어울릴 힘찬 말은\n정녕 없단 말인가......\n@c0@"
  sl: "@a@b＊：有没有哪里能够找到\n　　威风又有力的马啊……\n@c0@"
  tl: "@a@b＊：有沒有哪裡能夠找到\n　　威風又有力的馬啊……\n@c0@"
57:
  en: "@a@b*: Really!? Splendid! Bring me this beast, post-haste!\n@c0@"
  ja: "@a@b＊「おお！　だったら　その馬を\n\tつれてきて　くださらんか！\n@c0@"
  ko: "@a@b*: 오호! 그렇다면 그 말을\n끌고와주지 않겠나!?\n@c0@"
  sl: "@a@b＊：哦哦！那么\n　　请你把那匹马带给我！\n@c0@"
  tl: "@a@b＊：哦哦！那麼\n　　請你把那匹馬帶給我！\n@c0@"
58:
  en: "@a@b*: We can't let this magnificent cart rust away in the courtyard. What would neighbouring kingdoms think?\n@c0@"
  ja: "@a@b＊「死ぬまでに　もう　いちど\n\t馬車の雄姿を　この　じじいに\n\t見せてくだされ！\n@c0@"
  ko: "@a@b*: 이 늙은이가 죽기 전에\n마차의 웅장한 모습을 꼭 한번\n볼 수 있게 해주게!\n@c0@"
  sl: "@a@b＊：在我归西之前，\n　　真想再一次看见\n　　这马车的雄姿！\n@c0@"
  tl: "@a@b＊：在我歸西之前，\n　　真想再一次看見\n　　這馬車的雄姿！\n@c0@"
59:
  en: "@a@b*: Oh, what a sorry state of affairs...\n@c0@"
  ja: "@a@b＊「わしゃ　もう　死にたいわい……。\n@c0@"
  ko: "@a@b*: 나는 이제 세상을 뜨고 싶다네......\n@c0@"
  sl: "@a@b＊：老朽已经生无可恋……\n@c0@"
  tl: "@a@b＊：老朽已經生無可戀……\n@c0@"
60:
  en: "@a@b*: New around these parts, are you?\n@c0@"
  ja: "@a@b＊「あなた　見ない顔ですね。\n\tはは～ん　わかったぞ。\n@c0@"
  ko: "@a@b*: 당신은 처음 보는 얼굴이네요.\n아하~ 알겠다.\n@c0@"
  sl: "@a@b＊：以前没见过你。\n　　啊哈，我知道了。\n@c0@"
  tl: "@a@b＊：以前沒見過你。\n　　啊哈，我知道了。\n@c0@"
61:
  en: "@a@b*: Let me guess — a new recruit? Don't let us down, soldier!\n@c0@"
  ja: "@a@b＊「新しく　はいった　志願兵だ！\n\tがんばってくださいね！\n@c0@"
  ko: "@a@b*: 새로 들어온 지원병이군요!\n수고하세요!\n@c0@"
  sl: "@a@b＊：你是新来的志愿兵！\n　　请好好努力吧！\n@c0@"
  tl: "@a@b＊：你是新來的志願兵！\n　　請好好努力吧！\n@c0@"
62:
  en: "@a@b*: New around these parts, are you?\n@c0@"
  ja: "@a@b＊「あなた　見ない顔ですね。\n\tはは～ん　わかったぞ。\n@c0@"
  ko: "@a@b*: 당신은 처음 보는 얼굴이네요.\n아하~ 알겠다.\n@c0@"
  sl: "@a@b＊：以前没见过你。\n　　啊哈，我知道了。\n@c0@"
  tl: "@a@b＊：以前沒見過你。\n　　啊哈，我知道了。\n@c0@"
63:
  en: "@a@b*: Let me guess — a new recruit? Oh, no? Sorry...\n@c0@"
  ja: "@a@b＊「新しく　はいった　志願兵だ！\n\tえ？　でも　だめだった？\n\tそ　そうですか……。\n@c0@"
  ko: "@a@b*: 새로 들어온 지원병이군요!\n네? 떨어졌다고요?\n그, 그랬군요......\n@c0@"
  sl: "@a@b＊：你是新来的志愿兵！\n　　啊？其实没当上？\n　　呃，这样啊……\n@c0@"
  tl: "@a@b＊：你是新來的志願兵！\n　　啊？其實沒當上？\n　　呃，這樣啊……\n@c0@"
64:
  en: "@a@b*: Well, the world needs merchants and ditch diggers too. Accomplish great things and His Majesty may take notice.\n@c0@"
  ja: "@a@b＊「しかし　べつのことで\n\t手がらを　たてれば　王さまに\n\tお声をかけられるかもしれませんよ。\n@c0@"
  ko: "@a@b*: 하지만 다른 일로\n공훈을 세우면 폐하께서\n불러 주실지도 모릅니다.\n@c0@"
  sl: "@a@b＊：不过，如果有机会\n　　立下个大功劳，\n　　陛下说不定会接见你。\n@c0@"
  tl: "@a@b＊：不過，如果有機會\n　　立下個大功勞，\n　　陛下說不定會接見你。\n@c0@"
65:
  en: "@a@b*: Are you at all familiar with the Dread Fiend Murdaw, hmm?\n@c0@"
  ja: "@a@b＊「魔王ムドーの　ことを\n\tご存知か？\n@c0@"
  ko: "@a@b*: 마왕 무도를\n알고 있나?\n@c0@"
  sl: "@a@b＊：魔王姆多的情报，\n　　您了解吗？\n@c0@"
  tl: "@a@b＊：魔王姆多的情報，\n　　您瞭解嗎？\n@c0@"
66:
  en: "@a@b*: You are? Interesting.\n@c0@"
  ja: "@a@b＊「そうか　ムドーのことは\n\t知っておるか……。\n@c0@"
  ko: "@a@b*: 그렇군. 무도가 누군지\n알고 있군......\n@c0@"
  sl: "@a@b＊：哦哦，您了解\n　　魔王姆多是么……\n@c0@"
  tl: "@a@b＊：哦哦，您瞭解\n　　魔王姆多是麼……\n@c0@"
67:
  en: "@a@b*: But what about the so-called ‘phantom realm’, hmm? Stumped you on that one, huh? It's another subject of His Majesty's research.\n@c0@"
  ja: "@a@b＊「しかし　まぼろしの大地については\n\t知らないだろう。　王は　そのことも\n\t研究しているらしいのだ。\n@c0@"
  ko: "@a@b*: 하지만 몽환의 대지에 대해서는\n모르겠지. 왕은 그것도\n연구 중인 모양이더군.\n@c0@"
  sl: "@a@b＊：那么，您了解梦幻大地吗？\n　　国王陛下\n　　最近好像在研究这个。\n@c0@"
  tl: "@a@b＊：那麼，您瞭解夢幻大地嗎？\n　　國王陛下\n　　最近好像在研究這個。\n@c0@"
68:
  en: "@a@b*: The Dread Fiend is no stranger to our nation. He has meddled here numerous times in the past.\n@c0@"
  ja: "@a@b＊「魔王ムドーは　この国にも\n\tすでに　何度か　あらわれた。\n@c0@"
  ko: "@a@b*: 마왕 무도는 이 나라에도\n이미 여러 차례 나타났었어.\n@c0@"
  sl: "@a@b＊：魔王姆多已经出现过几次。\n@c0@"
  tl: "@a@b＊：魔王姆多已經出現過幾次。\n@c0@"
69:
  en: "@a@b*: Each time, King Somnus has driven him back in a costly battle...\n@c0@"
  ja: "@a@b＊「そのつど　レイドック王が\n\t戦いを　いどんだのじゃが……。\n@c0@"
  ko: "@a@b*: 그때마다 레이독 왕이\n전투를 벌였지만......\n@c0@"
  sl: "@a@b＊：以前一直是雷多克王\n　　与他战斗的……\n@c0@"
  tl: "@a@b＊：以前一直是雷多克王\n　　與他戰鬥的……\n@c0@"
70:
  en: "@a@b*: But whenever we think we have Murdaw cornered, he always disappears in a puff of smoke!\n@c0@"
  ja: "@a@b＊「あと一歩と　いうところで\n\tいつも　けむりのように\n\t消えてしまうのじゃ！\n@c0@"
  ko: "@a@b*: 간발의 차이로\n늘 연기처럼\n사라지지 뭔가!\n@c0@"
  sl: "@a@b＊：每次要打倒他的时候，\n　　他就像烟雾一样，\n　　消失得无影无踪了！\n@c0@"
  tl: "@a@b＊：每次要打倒他的時候，\n　　他就像煙霧一樣，\n　　消失得無影無蹤了！\n@c0@"
71:
  en: "@a@b*: Where does this monster come from, and where does he go when he vanishes, hmm?\n@c0@"
  ja: "@a@b＊「魔王ムドーは　いったい\n\tどこから　来るのか\n\tどこへ　消えるのか……。\n@c0@"
  ko: "@a@b*: 마왕 무도는 대체\n어디서 와서\n어디로 사라지는 건지......\n@c0@"
  sl: "@a@b＊：魔王姆多究竟\n　　从何而来，\n　　又向何处去……\n@c0@"
  tl: "@a@b＊：魔王姆多究竟\n　　從何而來，\n　　又向何處去……\n@c0@"
72:
  en: "@a@b*: Such mysteries elude me, but I understand His Majesty is close to cracking the case...\n@c0@"
  ja: "@a@b＊「私には　なにも　おっしゃらないが\n\tレイドック王は　なにやら\n\tつかんでいる　ご様子なのだ。\n@c0@"
  ko: "@a@b*: 나에겐 아무 말씀 안 하지만\n레이독 왕은 뭔가\n알고 계신 눈치더군.\n@c0@"
  sl: "@a@b＊：雷多克王虽然嘴上没说，\n　　但我总觉得他\n　　似乎知道些什么。\n@c0@"
  tl: "@a@b＊：雷多克王雖然嘴上沒說，\n　　但我總覺得他\n　　似乎知道些什麼。\n@c0@"
73:
  en: "@a@b*: Hey, it's the new recruit! You met His Majesty yet?\n@c0@"
  ja: "@a@b＊「おや　新米さんですね。\n\tレイドック王には　もう\n\tお会いになりましたか？\n@c0@"
  ko: "@a@b*: 오호, 새로 오셨군요.\n레이독 왕은 벌써\n만나 보셨습니까?\n@c0@"
  sl: "@a@b＊：啊，是新来的啊。\n　　你见过雷多克王了吗？\n@c0@"
  tl: "@a@b＊：啊，是新來的啊。\n　　你見過雷多克王了嗎？\n@c0@"
74:
  en: "@a@b*: What a great guy, huh? He's kind to the people, a tireless worker, and he just looks so...regal!\n@c0@"
  ja: "@a@b＊「男でも　ほれぼれ　するような\n\t美しいひとですよね。\n@c0@"
  ko: "@a@b*: 남자가 봐도 반할 만큼\n수려한 외모시죠.\n@c0@"
  sl: "@a@b＊：他英俊的面貌，\n　　连男人都为之着迷。\n@c0@"
  tl: "@a@b＊：他英俊的面貌，\n　　連男人都為之著迷。\n@c0@"
75:
  en: "@a@b*: I know kings are born into their jobs, but if we ever held an election, Somnus would get my vote!\n@c0@"
  ja: "@a@b＊「しかも　心も　こまやかで\n\tはたらき者で……。\n@c0@"
  ko: "@a@b*: 게다가 섬세하고\n근면 성실하기까지......\n@c0@"
  sl: "@a@b＊：不仅如此，他心细如发，\n　　人又勤奋……\n@c0@"
  tl: "@a@b＊：不僅如此，他心細如髪，\n　　人又勤奮……\n@c0@"
76:
  en: "@a@b*: No? Then you better get out there and make a name for yourself. Get his attention!\n@c0@"
  ja: "@a@b＊「そうですか。　早く　王さまに\n\t会いたいのなら　なにか\n\tてがらを　たてることですね。\n@c0@"
  ko: "@a@b*: 그러시군요. 왕을 빨리\n만나고 싶다면 뭔가\n공을 세우는 게 좋을 거예요.\n@c0@"
  sl: "@a@b＊：是吗。那么，\n　　为了早日见到国王，\n　　你要立下功劳才行。\n@c0@"
  tl: "@a@b＊：是嗎。那麼，\n　　為了早日見到國王，\n　　你要立下功勞才行。\n@c0@"
77:
  en: "@a@b*: His Majesty slaves away all day and all night. He's the sire that never sleeps!\n@c0@"
  ja: "@a@b＊「王さまは　まったく　ねむらずに\n\tはたらいているのよ。\n@c0@"
  ko: "@a@b*: 폐하는 한숨도 안 자고\n일하고 계셔.\n@c0@"
  sl: "@a@b＊：陛下完全不休息，\n　　一直在不间断地工作。\n@c0@"
  tl: "@a@b＊：陛下完全不休息，\n　　一直在不間斷地工作。\n@c0@"
78:
  en: "@a@b*: That means we have to cook twice as many meals. A midnight snack is just another lunch to him!\n@c0@"
  ja: "@a@b＊「だから　えいようの　いっぱいある\n\tおいしい物を　つくらなきゃね。\n@c0@"
  ko: "@a@b*: 그래서 영양 가득한\n맛있는 음식을 만들어 드려야 해.\n@c0@"
  sl: "@a@b＊：所以，\n　　我得做些营养丰富的食物。\n@c0@"
  tl: "@a@b＊：所以，\n　　我得做些營養豐富的食物。\n@c0@"
79:
  en: "@a@b*: Walk up to the bars if you want to talk to prisoners.\n@c0@"
  ja: "@a@b＊「ここは　牢屋です。\n\t囚人と　話がしたいなら\n\t牢屋ごしに　話してください。\n@c0@"
  ko: "@a@b*: 이곳은 감옥입니다.\n죄인들과 이야기하려면\n쇠창살 너머로 말하세요.\n@c0@"
  sl: "@a@b＊：这里是牢房。\n　　要是想与囚犯对话的话，\n　　就请隔着牢门说话。\n@c0@"
  tl: "@a@b＊：這裡是牢房。\n　　要是想與囚犯對話的話，\n　　就請隔著牢門說話。\n@c0@"
80:
  en: "@a@b*: Dag nabbit! I woulda gotten away with it if it weren't for that crazy horse!\n@c0@"
  ja: "@a@b＊「くそー！　あの馬にさえ\n\t出くわさなきゃ　つかまることは\n\tなかったのによお！\n@c0@"
  ko: "@a@b*: 젠장! 그 말만\n맞닥뜨리지 않았더라면\n붙들리지 않았을 텐데!\n@c0@"
  sl: "@a@b＊：可恨！\n　　要不是因为那匹马，\n　　我怎么会被抓住！\n@c0@"
  tl: "@a@b＊：可恨！\n　　要不是因為那匹馬，\n　　我怎麼會被抓住！\n@c0@"
81:
  en: "@a@b*: I wasn't gonna hurt dem merchants — just relieve 'em of their gold, is all. But then that beast charged in and WHAM!\n@c0@"
  ja: "@a@b＊「商人たちを　おそってるところへ\n\tあの　あばれ馬が　やってきて\n\t気がついたら　このなかよ。\n@c0@"
  ko: "@a@b*: 상인들을 덮치고 있는데\n그 날뛰는 말이 들이닥치더니\n정신 차리고 보니 여기 있지 뭐야.\n@c0@"
  sl: "@a@b＊：那时候我正要对商人们下手，\n　　然后那匹马来了，\n　　然后我就在这里了。\n@c0@"
  tl: "@a@b＊：那時候我正要對商人們下手，\n　　然後那匹馬來了，\n　　然後我就在這裡了。\n@c0@"
82:
  en: "@a@b*: Goddess, it was gigantic! That ain't no ordinary horse, lemme tell ya...\n@c0@"
  ja: "@a@b＊「にしても　でかい馬だったよなあ。\n\t化け物だぜ　あれは……。\n@c0@"
  ko: "@a@b*: 아무튼 엄청 큰 말이었어.\n그 정도면 괴물이야, 괴물......\n@c0@"
  sl: "@a@b＊：话说回来，那马真壮。\n　　简直就是怪物……\n@c0@"
  tl: "@a@b＊：話說回來，那馬真壯。\n　　簡直就是怪物……\n@c0@"
83:
  en: "@a@b*: Gulp...\n@c0@"
  ja: "@a@b＊「ドキドキドキ……。\n@c0@"
  ko: "@a@b*: 두근두근두근......\n@c0@"
  sl: "@a@b＊：好紧张好紧张……\n@c0@"
  tl: "@a@b＊：好緊張好緊張……\n@c0@"
84:
  en: "@a@b*: I hear His Majesty's hand-picking personnel for a dangerous mission right now. Only the best of the best!\n@c0@"
  ja: "@a@b＊「今　王さまは　ある重要な使命を\n\tだれに　やらせるか　人えらびを\n\tしているみたいなのだ。\n@c0@"
  ko: "@a@b*: 지금 폐하께선 어떤 중요한 임무를\n누구에게 맡길지 사람을 고르고\n있는 모양이야.\n@c0@"
  sl: "@a@b＊：陛下有个重要的任务，\n　　现在正在挑选人手。\n@c0@"
  tl: "@a@b＊：陛下有個重要的任務，\n　　現在正在挑選人手。\n@c0@"
85:
  en: "@a@b*: Y-You don't think he'll pick me, will he? I'm really more of a walk-the-walls kind of soldier...\n@c0@"
  ja: "@a@b＊「も　もし！　この私が\n\tえらばれたなら　きっと\n\t役に立ってみせるぞ！\n@c0@"
  ko: "@a@b*: 호, 혹시! 내가\n뽑힌다면 반드시\n해내고야 말겠어!\n@c0@"
  sl: "@a@b＊：我想被选中！\n　　要是能中选，\n　　我一定好好表现！\n@c0@"
  tl: "@a@b＊：我想被選中！\n　　要是能中選，\n　　我一定好好表現！\n@c0@"
86:
  en: "@a@b*: You know that old gent in the castle courtyard? I've just about had it with him.\n@c0@"
  ja: "@a@b＊「中庭にいる　じいさんには\n\tまいってしまいますよ。\n@c0@"
  ko: "@a@b*: 안뜰에 있는 영감님한테는\n두 손 두 발 다 들었어요.\n@c0@"
  sl: "@a@b＊：城堡的后院里\n　　有个老爷爷。\n@c0@"
  tl: "@a@b＊：城堡的後院裡\n　　有個老爺爺。\n@c0@"
87:
  en: "@a@b*: Every day, it's ‘wagon’ this and ‘wagon’ that...  If he likes it so much, why don't he marry it?\n@c0@"
  ja: "@a@b＊「なにかというと　馬車　馬車って\n\t馬車の話ばかりで……\n\t頭の中が　バシャバシャですよ。\n@c0@"
  ko: "@a@b*: 말만 꺼내면 마차, 마차\n온통 마차 이야기뿐......\n머리가 돌 지경이에요.\n@c0@"
  sl: "@a@b＊：总是抓住人说些\n　　马车什么的……\n　　听得我耳朵都长茧了。\n@c0@"
  tl: "@a@b＊：總是抓住人說些\n　　馬車什麼的……\n　　聽得我耳朵都長繭了。\n@c0@"
88:
  en: "@a@b*: Welcome to Somnia. Stay out of trouble.\n@c0@"
  ja: "@a@b＊「ここは　レイドックの城下町だ。\n\tさわぎなど　おこさぬようにな。\n@c0@"
  ko: "@a@b*: 이곳은 레이독 성 시가지다.\n소란 피우지 말도록.\n@c0@"
  sl: "@a@b＊：这里是雷多克城区。\n　　任何人不得无端生事。\n@c0@"
  tl: "@a@b＊：這裡是雷多克城區。\n　　任何人不得無端生事。\n@c0@"
89:
  en: "@a@b*: Oh, If only I had the skills to become a soldier in the royal military.\n@c0@"
  ja: "@a@b＊「あ～あ　もし私が　男だったら\n\t私も　兵隊さんに　なったのに。\n@c0@"
  ko: "@a@b*: 아~ 만약 내가 남자였다면\n병사가 되었을 텐데.\n@c0@"
  sl: "@a@b＊：我也想当兵啊~\n　　真可惜，如果我是男人就好了。\n@c0@"
  tl: "@a@b＊：我也想當兵啊~\n　　真可惜，如果我是男人就好了。\n@c0@"
90:
  en: "@a@b*: Then I could get an audience with King Somnus whenever I wanted, right?\n@c0@"
  ja: "@a@b＊「そしたら　いつでも\n\tレイドック王に　会えるでしょ。\n\tねえ　そう思わない？\n@c0@"
  ko: "@a@b*: 그러면 언제든\n레이독 왕을 만날 수 있잖아.\n안 그래?\n@c0@"
  sl: "@a@b＊：那样的话，\n　　我就可以随时见到雷多克王了。\n　　你说对不对？\n@c0@"
  tl: "@a@b＊：那樣的話，\n　　我就可以隨時見到雷多克王了。\n　　你說對不對？\n@c0@"
91:
  en: "@a@b*: I thought so! (sigh) I suppose it's a little late for a career change...\n@c0@"
  ja: "@a@b＊「そうよねえ　やっぱり。\n\tう～ん　ざんねんだわ。\n@c0@"
  ko: "@a@b*: 역시 그렇구나.\n아잉, 아쉬워라.\n@c0@"
  sl: "@a@b＊：对吧对吧。\n　　嗯……真可惜耶。\n@c0@"
  tl: "@a@b＊：對吧對吧。\n　　嗯……真可惜耶。\n@c0@"
92:
  en: "@a@b*: Hey! It's not like I was serious. Can't a girl dream?\n@c0@"
  ja: "@a@b＊「あなたって　いじわるね！\n@c0@"
  ko: "@a@b*: 너, 보니까 심술쟁이구나!\n@c0@"
  sl: "@a@b＊：讨厌你讨厌你讨厌你！\n@c0@"
  tl: "@a@b＊：討厭你討厭你討厭你！\n@c0@"
93:
  en: "@a@b*: I hope no one wallops Murdaw before I grow up. I'm gonna be the toughest soldier ever!\n@c0@"
  ja: "@a@b＊「ぼくね　大きくなったら\n\t兵隊さんになって\n\t魔王ムドーを　やっつけるんだ。\n@c0@"
  ko: "@a@b*: 난 말야, 이담에 크면\n병사가 돼서\n마왕 무도를 해치울 거야.\n@c0@"
  sl: "@a@b＊：等我长大了，\n　　我要加入军队，\n　　讨伐魔王姆多。\n@c0@"
  tl: "@a@b＊：等我長大了，\n　　我要加入軍隊，\n　　討伐魔王姆多。\n@c0@"
94:
  en: "@a@b*: Arf arf!\n@c0@"
  ja: "@a@b＊「わん　わん！\n@c0@"
  ko: "@a@b*: 멍멍!\n@c0@"
  sl: "@a@b＊：汪汪！\n@c0@"
  tl: "@a@b＊：汪汪！\n@c0@"
95:
  en: "@a@b*: That royal decree has sure attracted a lot of strapping young men to the city.\n@c0@"
  ja: "@a@b＊「王さまの　おふれが出てから\n\tいろんな男たちが\n\tこの町に　やってくるの。\n@c0@"
  ko: "@a@b*: 왕이 공고를 냈더니\n많은 남자들이\n이 마을에 몰려들고 있어.\n@c0@"
  sl: "@a@b＊：自从国王发布告示，\n　　许许多多的男人\n　　都聚集到这里来了。\n@c0@"
  tl: "@a@b＊：自從國王發佈告示，\n　　許許多多的男人\n　　都聚集到這裡來了。\n@c0@"
96:
  en: "@a@b*: What is it about joining the military that's so alluring? The low pay? The drab uniforms? The all-you-can-eat salt pork?\n@c0@"
  ja: "@a@b＊「男って　そんなに\n\t兵隊に　なりたいのかしら……。\n@c0@"
  ko: "@a@b*: 남자들은 그렇게\n병사가 되고 싶은 걸까......\n@c0@"
  sl: "@a@b＊：男人真奇怪，\n　　为什么都想当兵呢……\n@c0@"
  tl: "@a@b＊：男人真奇怪，\n　　為什麼都想當兵呢……\n@c0@"
97:
  en: "@a@b*: How peculiar... Apparently, giant chasms have been opening up in the earth. Murdaw's handiwork, they say.\n@c0@"
  ja: "@a@b＊「あなた　知ってますか？\n\t魔王ムドーのせいで　大地に\n\t大穴をあけられた所もあるそうです。\n@c0@"
  ko: "@a@b*: 당신은 알고 있나요?\n마왕 무도 때문에 대지에\n큰 구멍이 난 곳도 있다고 합니다.\n@c0@"
  sl: "@a@b＊：您知道吗？\n　　魔王姆多作乱，\n　　很多地方都出现了大空洞。\n@c0@"
  tl: "@a@b＊：您知道嗎？\n　　魔王姆多作亂，\n　　很多地方都出現了大空洞。\n@c0@"
98:
  en: "@a@b*: I shouldn't be saying this, but...Murdaw's been gaining more power by the hour. \n@c0@"
  ja: "@a@b＊「あまり大きな声では　いえぬが\n\t魔王ムドーは　日増しに\n\tチカラをつけているらしい。\n@c0@"
  ko: "@a@b*: 큰 소리로 말할 순 없지만\n마왕 무도의 힘이\n갈수록 커지고 있다더군.\n@c0@"
  sl: "@a@b＊：小声告诉你啊，\n　　魔王姆多的力量\n　　越来越强大了。\n@c0@"
  tl: "@a@b＊：小聲告訴你啊，\n　　魔王姆多的力量\n　　越來越強大了。\n@c0@"
99:
  en: "@a@b*: His Majesty knows we've no time to spare, so he's been working day and night to come up with a plan.\n@c0@"
  ja: "@a@b＊「今のうちに　どうにかせねばと\n\t王さまは　必死の思いで\n\t対さくを　考えられているのだ。\n@c0@"
  ko: "@a@b*: 더 늦기 전에 손을 쓰려고\n왕께선 필사적으로\n대책을 강구하고 계시지.\n@c0@"
  sl: "@a@b＊：现在一定要做出行动，\n　　所以国王陛下\n　　在拼命思考对策。\n@c0@"
  tl: "@a@b＊：現在一定要做出行動，\n　　所以國王陛下\n　　在拼命思考對策。\n@c0@"
100:
  en: "@a@b*: Wonderful. Just wonderful. I had to go and drop my precious ring into the well, didn't I?\n@c0@"
  ja: "@a@b＊「あーら　こまったわ。\n\t井戸のなかに　ゆびわを\n\tおとしちゃったのよ。\n@c0@"
  ko: "@a@b*: 어머나, 큰일이네.\n우물 속에 반지를\n떨어뜨리고 말았어.\n@c0@"
  sl: "@a@b＊：哎呀，不好了。\n　　我的戒指掉进井里了。\n@c0@"
  tl: "@a@b＊：哎呀，不好了。\n　　我的戒指掉進井裡了。\n@c0@"
101:
  en: "@a@b*: If only I could convince some nice youngster to climb down and fetch it. Know anyone who fits that description?\n@c0@"
  ja: "@a@b＊「だれか　ひろってきて\n\tくれないものかねえ。\n@c0@"
  ko: "@a@b*: 어디 주워 줄 사람\n없으려나?\n@c0@"
  sl: "@a@b＊：怎么办……\n　　谁能帮我捞上来。\n@c0@"
  tl: "@a@b＊：怎麼辦……\n　　誰能幫我撈上來。\n@c0@"
102:
  en: "@a@b*: Oh, joy! Thank you for volunteering!\n@c0@"
  ja: "@a@b＊「え？　あんたが？\n\tそうかい　わるいねえ。\n@c0@"
  ko: "@a@b*: 응? 네가?\n이거 미안해서 어쩌나.\n@c0@"
  sl: "@a@b＊：啊？你要帮我？\n　　那就麻烦你了。\n@c0@"
  tl: "@a@b＊：啊？你要幫我？\n　　那就麻煩你了。\n@c0@"
103:
  en: "@a@b*: No? Oh, fine then. I don't mind climbing into a dank, slimy, monster-infested well. No, not at all...\n@c0@"
  ja: "@a@b＊「そうだわよね。　井戸のなかは\n\t暗いし　ときどき　まものも\n\t出るって話だからねえ。\n@c0@"
  ko: "@a@b*: 역시 그렇겠지? 우물 속은\n어둡고 가끔씩 마물도\n나온다고 하니.\n@c0@"
  sl: "@a@b＊：没人帮也正常吧。\n　　井底下那么黑，\n　　动不动还会有魔物。\n@c0@"
  tl: "@a@b＊：沒人幫也正常吧。\n　　井底下那麼黑，\n　　動不動還會有魔物。\n@c0@"
104:
  en: "@a@b*: Oh! That's my ring you've got there! Thank you!\n@c0@"
  ja: "@a@b＊「おや？　あんたが　もってる\n\tその　ゆびわ。　そうかい\n\tひろってきて　くれたのかい。\n@c0@"
  ko: "@a@b*: 어머나? 네가 가지고 있는\n그 반지. 세상에\n주워 와 줬구나.\n@c0@"
  sl: "@a@b＊：哎呀。\n　　我的戒指。\n　　是你帮我拿上来的吗？\n@c0@"
  tl: "@a@b＊：哎呀。\n　　我的戒指。\n　　是你幫我拿上來的嗎？\n@c0@"
105:
  en: "@a@b*: Hope you didn't have too much trouble finding it. Now how should I repay you...\n@c0@"
  ja: "@a@b＊「ありがとうよ。\n\tなにか　お礼を　しなくちゃ\n\tいけないねえ……。\n@c0@"
  ko: "@a@b*: 고마워.\n뭔가 답례를\n해야겠는데......\n@c0@"
  sl: "@a@b＊：真是谢谢你啦。\n　　给你点什么\n　　做报答才好呢……\n@c0@"
  tl: "@a@b＊：真是謝謝你啦。\n　　給你點什麼\n　　做報答才好呢……\n@c0@"
106:
  en: "@a@b*: Oh, I know! Here, take this.\n@c0@"
  ja: "@a@b＊「そうだ。　これを　あげるわよ。\n@c0@"
  ko: "@a@b*: 옳지. 이걸 줄게.\n@c0@"
  sl: "@a@b＊：有了。这个送给你吧。\n@c0@"
  tl: "@a@b＊：有了。這個送給你吧。\n@c0@"
107:
  en: "@a@b%0%a000090 receives a seed of strength!\n@c0@"
  ja: "@a@b%a000090は　ちからのたねを\nもらった！\n@c0@"
  ko: "@a@b%a000090%F0090%X는%Y은%Z 힘의 씨앗을\n받았다!\n@c0@"
  sl: "@a@b%a000090得到了力量种子！\n@c0@"
  tl: "@a@b%a000090得到了力量種子！\n@c0@"
108:
  en: "@a@b*: You're not from around here, right? Well, enjoy the big city! Good luck finding fame and glory and whatnot.\n@c0@"
  ja: "@a@b＊「田舎から　出てきたんだろ。\n\tはやく出世して　ふるさとに\n\tにしきを　かざりなよ。\n@c0@"
  ko: "@a@b*: 시골 출신 맞지?\n어서 출세해서\n금의환향해야지.\n@c0@"
  sl: "@a@b＊：你是从乡村来的吧。\n　　预祝你早日出人头地，\n　　快快衣锦还乡。\n@c0@"
  tl: "@a@b＊：你是從鄉村來的吧。\n　　預祝你早日出人頭地，\n　　快快衣錦還鄉。\n@c0@"
109:
  en: "@a@b*: Let's see here... ‘Monster Threat Level: High! Do Not Venture Outside Town Until Further Notice!’\n@c0@"
  ja: "@a@b＊「ふーむ　なになに……。\n\tまものに　おそわれないよう\n\t町の外には　いかないように…か。\n@c0@"
  ko: "@a@b*: 흐음, 어디 보자......\n마물의 습격이 있을지 모르니\n마을 밖에는 나가지 마라...\n@c0@"
  sl: "@a@b＊：嗯，我看看……\n　　为免受魔物袭击，\n　　请不要去镇子外面……\n@c0@"
  tl: "@a@b＊：嗯，我看看……\n　　為免受魔物襲擊，\n　　請不要去鎮子外面……\n@c0@"
110:
  en: "@a@b*: Hmph. I didn't want to go anywhere anyway — especially not to the western forest!\n㈡\n*: I hear it's home to some kind of monster mustang...\n@c0@"
  ja: "@a@b＊「そうだよなあ。　とくに　西の\n\t森にかこまれた草原には\n\t化け物の馬が出るっていうしな。\n@c0@"
  ko: "@a@b*: 맞는 말이야. 특히 서쪽에\n숲으로 둘러싸인 초원에는\n괴물 말이 나타난다는 소문도 있으니까.\n@c0@"
  sl: "@a@b＊：说得没错啊。\n　　特别是西边森林里的草地，\n　　那里有怪物马出没。\n@c0@"
  tl: "@a@b＊：說得沒錯啊。\n　　特別是西邊森林裡的草地，\n　　那裡有怪物馬出沒。\n@c0@"
111:
  en: "@a@b*: They say our young leader Somnus is starting to muster troops for the fight against Murdaw.\n@c0@"
  ja: "@a@b＊「若き国王　レイドックさまは\n\t魔王ムドーに　立ちむかうべく\n\t兵を集めておられるのじゃ。\n@c0@"
  ko: "@a@b*: 젊은 국왕 레이독 님은\n마왕 무도와 맞서기 위해\n병사를 모집하고 계신다네.\n@c0@"
  sl: "@a@b＊：年轻的国王雷多克陛下\n　　要与魔王姆多战斗，\n　　正在募集士兵啊。\n@c0@"
  tl: "@a@b＊：年輕的國王雷多克陛下\n　　要與魔王姆多戰鬥，\n　　正在募集士兵啊。\n@c0@"
112:
  en: "@a@b*: If I were five years younger, I'd give that Murdaw such a thrashin— Ow, my back! Okay, maybe fifteen years younger...\n@c0@"
  ja: "@a@b＊「わしも　あと５年　若ければ\n\tお手伝いが　できたものをっ。\n\tちょわ！　てい！　ふがっ……。\n@c0@"
  ko: "@a@b*: 나도 5년만 젊었어도\n도울 수 있었건만.\n빠샤! 이얍! 움찔!......\n@c0@"
  sl: "@a@b＊：要是我再年轻５岁，\n　　一定积极响应。\n　　喝！哈！腰扭了……\n@c0@"
  tl: "@a@b＊：要是我再年輕５歲，\n　　一定積極響應。\n　　喝！哈！腰扭了……\n@c0@"
113:
  en: "@a@b*: Ah, King Somnus... Your beauty has me vexed. Vexed, I say!\n@c0@"
  ja: "@a@b＊「ああ　レイドック王さま……。\n\tなんと　美しい　お姿。\n@c0@"
  ko: "@a@b*: 아아, 레이독 폐하......\n그 수려하신 외모.\n@c0@"
  sl: "@a@b＊：啊啊，雷多克王陛下……\n　　多么优美的身姿。\n@c0@"
  tl: "@a@b＊：啊啊，雷多克王陛下……\n　　多麼優美的身姿。\n@c0@"
114:
  en: "@a@b*: How does one become unvexed? A hex? Does a hex cure a vex? I'm perplexed.\n@c0@"
  ja: "@a@b＊「でも　どうせ　かなわぬ恋ですわ。\n\tああ　この　せつなさを\n\tどうしましょう……。\n@c0@"
  ko: "@a@b*: 하지만 어차피,\n이룰 수 없는 사랑인걸요.\n아, 이 애절함을 어떻게 할까요...\n@c0@"
  sl: "@a@b＊：不过，我也只有单相思吧。\n　　啊啊，这种悲伤的感觉，\n　　我该如何是好……\n@c0@"
  tl: "@a@b＊：不過，我也只有單相思吧。\n　　啊啊，這種悲傷的感覺，\n　　我該如何是好……\n@c0@"
115:
  en: "@a@b*: You're looking at Somnia Castle.\n@c0@"
  ja: "@a@b＊「ここは　レイドック城だ。\n@c0@"
  ko: "@a@b*: 이곳은 레이독 성이다.\n@c0@"
  sl: "@a@b＊：这里是雷多克城。\n@c0@"
  tl: "@a@b＊：這裡是雷多克城。\n@c0@"
116:
  en: "@a@b*: His Majesty has challenged the power of Murdaw many times in the past...\n@c0@"
  ja: "@a@b＊「王さまは　これまで　なんども\n\t魔王ムドーに\n\t戦いをいどんだのじゃ。\n@c0@"
  ko: "@a@b*: 왕은 그 동안 수 차례에\n걸쳐 마왕 무도와\n혈투를 벌여 왔다네.\n@c0@"
  sl: "@a@b＊：国王陛下以前\n　　也跟魔王姆多战斗过。\n@c0@"
  tl: "@a@b＊：國王陛下以前\n　　也跟魔王姆多戰鬥過。\n@c0@"
117:
  en: "@a@b*: Sadly, the lives of many brave young men were lost in each conflict...\n@c0@"
  ja: "@a@b＊「じゃが　そのたびに\n\t多くの兵を　うしなって……。\n@c0@"
  ko: "@a@b*: 하지만 그때마다\n수많은 병사들을 잃었지......\n@c0@"
  sl: "@a@b＊：但是每次都会\n　　牺牲大量的士兵……\n@c0@"
  tl: "@a@b＊：但是每次都會\n　　犧牲大量的士兵……\n@c0@"
118:
  en: "@a@b*: Please, O Goddess! May Your divine guidance bring victory to Somnia. Lead us down the one true path!\n@c0@"
  ja: "@a@b＊「神さま！　今度こそ　今度こそ\n\tレイドック王に　勝たせて\n\tやってくだされ！\n@c0@"
  ko: "@a@b*: 신이시여! 이번엔 반드시\n레이독 왕이 이길 수 있게\n해주소서!\n@c0@"
  sl: "@a@b＊：神啊！\n　　请你保佑雷多克王，\n　　让他得胜吧！\n@c0@"
  tl: "@a@b＊：神啊！\n　　請你保佑雷多克王，\n　　讓他得勝吧！\n@c0@"
119:
  en: "@a@b*: It's enough to make a merchant change careers, I tell ya...\n@c0@"
  ja: "@a@b＊「いやはや　えらいめに\n\tあいましたよ。\n@c0@"
  ko: "@a@b*: 아아, 정말 끔찍한\n일을 당했어요.\n@c0@"
  sl: "@a@b＊：哎呀哎呀，\n　　遭遇真是曲折啊。\n@c0@"
  tl: "@a@b＊：哎呀哎呀，\n　　遭遇真是曲折啊。\n@c0@"
120:
  en: "@a@b*: First, a bandit ambushes our caravan, and then this wild mustang charges out of nowhere...\n@c0@"
  ja: "@a@b＊「山ぞくに　おそわれたと思うと\n\tあばれ馬まで　やってきて……。\n@c0@"
  ko: "@a@b*: 산적에게 습격을 당하나 했더니\n날뛰는 말까지 뛰어와서......\n@c0@"
  sl: "@a@b＊：那时候被山贼袭击了，\n　　然后那匹狂暴马来了……\n@c0@"
  tl: "@a@b＊：那時候被山賊襲擊了，\n　　然後那匹狂暴馬來了……\n@c0@"
121:
  en: "@a@b*: Course, if it weren't for that beast, the rogue might've taken more than just my gold.\n@c0@"
  ja: "@a@b＊「でも　よく考えると　あの馬が\n\tこなかったら　山ぞくに\n\t殺されていたかもしれませんな。\n@c0@"
  ko: "@a@b*: 그래도 잘 생각해 보면, 그 말이\n오지 않았더라면 산적 손에\n죽었을지도 모르죠.\n@c0@"
  sl: "@a@b＊：现在回想起来，\n　　如果没有那马的话，\n　　我们说不定就被杀了。\n@c0@"
  tl: "@a@b＊：現在回想起來，\n　　如果沒有那馬的話，\n　　我們說不定就被殺了。\n@c0@"
122:
  en: "@a@b*: We're travelling merchants, him and I. At least, we were.\n@c0@"
  ja: "@a@b＊「私たちは　旅の商人です。\n@c0@"
  ko: "@a@b*: 저는 떠돌이 상인입니다.\n@c0@"
  sl: "@a@b＊：我们是旅行商人。\n@c0@"
  tl: "@a@b＊：我們是旅行商人。\n@c0@"
123:
  en: "@a@b*: My partner was mauled by a mustang in the forest north of the bridge out west.\n@c0@"
  ja: "@a@b＊「西の岩山の向こうの橋を　わたって\n\t北に行った森の中で　仲間が\n\tあばれ馬におそわれ　ケガをしました。\n@c0@"
  ko: "@a@b*: 서쪽 바위산 너머 다리 건너\n북쪽 숲 속에서 동료가\n날뛰는 말의 습격에 다쳤습니다.\n@c0@"
  sl: "@a@b＊：西边石山的另一侧有座桥，\n　　过桥之后向北走有片森林，\n　　我的同伴被森林里的狂暴马袭击了。\n@c0@"
  tl: "@a@b＊：西邊石山的另一側有座橋，\n　　過橋之後向北走有片森林，\n　　我的同伴被森林裡的狂暴馬襲擊了。\n@c0@"
124:
  en: "@a@b*: Fortunately, his injuries seem to be improving. Hopefully, we'll be on our way before long.\n@c0@"
  ja: "@a@b＊「しかし　さいわい\n\tケガも　よくなってきたみたいで\n\t本当に　たすかりました。\n@c0@"
  ko: "@a@b*: 그런데 다행히도\n목숨은 건졌고 이젠 상처도\n많이 아물어서 한시름 놓았어요.\n@c0@"
  sl: "@a@b＊：不过好在现在伤也\n　　好得差不多了，\n　　这可实在是太好了。\n@c0@"
  tl: "@a@b＊：不過好在現在傷也\n　　好得差不多了，\n　　這可實在是太好了。\n@c0@"
125:
  en: "@a@b*: Wow, you've been to the castle, huh? Did you notice the wagon in the courtyard?\n@c0@"
  ja: "@a@b＊「へえ　お城のなかに\n\tはいれたのですか。　だったら\n\t中庭の馬車は　見ましたか？\n@c0@"
  ko: "@a@b*: 허, 성안에 들어\n갔었나요. 그럼 안뜰에 \n있는 마차는 보셨나요?\n@c0@"
  sl: "@a@b＊：哦，你已经进去过城堡了吗？\n　　那应该看到后院的马车了吧？\n@c0@"
  tl: "@a@b＊：哦，你已經進去過城堡了嗎？\n　　那應該看到後院的馬車了吧？\n@c0@"
126:
  en: "@a@b*: Legend has it the kings of old rode in that wagon, dashing across the wilderness pulled by mighty steeds...\n@c0@"
  ja: "@a@b＊「なんでも昔　歴代の王さまたちは\n\tあの馬車に乗って　荒野を\n\t駆けめぐっていたそうです。\n@c0@"
  ko: "@a@b*: 듣자 하니 역대 왕들은\n그 마차를 타고 황야를\n누볐다더군요.\n@c0@"
  sl: "@a@b＊：据说历代国王都曾\n　　乘着那辆马车\n　　在荒野中往来驱驰。\n@c0@"
  tl: "@a@b＊：據說歷代國王都曾\n　　乘著那輛馬車\n　　在荒野中往來驅馳。\n@c0@"
127:
  en: "@a@b*: Now it just sits there getting dirty. What a shame! It'd be a treat to see it in action again some day.\n@c0@"
  ja: "@a@b＊「そんな　馬車の雄姿を\n\tもう１回　見てみたいものですね。\n@c0@"
  ko: "@a@b*: 마차의 그 웅장한 모습을\n다시 한번 보고 싶네요.\n@c0@"
  sl: "@a@b＊：真想再看一次\n　　那辆马车的雄姿。\n@c0@"
  tl: "@a@b＊：真想再看一次\n　　那輛馬車的雄姿。\n@c0@"
128:
  en: "@a@b*: Oh, it's a heck of a ride, alright. You should really check it out.\n@c0@"
  ja: "@a@b＊「すごく立派な馬車なんです。\n\tせっかくだから　見ておいても\n\tソンはないと　思いますよ。\n@c0@"
  ko: "@a@b*: 아주 훌륭한 마차랍니다.\n이왕 여기까지 왔으니 보고\n가도 손해는 아니라고 생각합니다.\n@c0@"
  sl: "@a@b＊：那可是架很气派的马车。\n　　难得进去一次，\n　　去看看也没坏处。\n@c0@"
  tl: "@a@b＊：那可是架很氣派的馬車。\n　　難得進去一次，\n　　去看看也沒壞處。\n@c0@"
129:
  en: "@a@b*: Ahhh! Nothing beats a hot bath.\n@c0@"
  ja: "@a@b＊「あ～あ　さっぱりしたわ。\n@c0@"
  ko: "@a@b*: 아아, 개운해.\n@c0@"
  sl: "@a@b＊：啊～心情真好呀。\n@c0@"
  tl: "@a@b＊：啊～心情真好呀。\n@c0@"
130:
  en: "@a@b*: Funny how different folks can be. Take my worthless daughter-in-law here... She sleeps the whole day away.\n@c0@"
  ja: "@a@b＊「うちの　ヨメみたいに\n\tねてばかりの　ヤツもいれば\n\tまったく　ねむらない方もおる。\n@c0@"
  ko: "@a@b*: 우리 며느리처럼\n온종일 잠만 자는 곰탱이가 있는가 하면\n아예 안 주무시는 분도 계시지.\n@c0@"
  sl: "@a@b＊：世界上有我儿媳妇这样\n　　整天只会睡觉的，\n　　也有完全不会睡觉的。\n@c0@"
  tl: "@a@b＊：世界上有我兒媳婦這樣\n　　整天只會睡覺的，\n　　也有完全不會睡覺的。\n@c0@"
131:
  en: "@a@b*: But then King Somnus doesn't get any shut-eye at all. He hasn't so much as catnapped in years.\n@c0@"
