  ja: "@a@b%a002020「よろいは　どこかに\n\tあるかも　しれないけど\n\tあの　兵士長さんは……。\n@c0@"
  ko: "@a@b%a002020: 갑옷은 어딘가에\n있을지도 모르지만\n그 병사단장님은......\n@c0@"
  sl: "@a@b%a002020：铠甲应该\n　　就放在某个地方，\n　　可那位士兵长就……\n@c0@"
  tl: "@a@b%a002020：鎧甲應該\n　　就放在某個地方，\n　　可那位士兵長就……\n@c0@"
69:
  en: "@a%0%a002050@bDidn't the Captain say he'd seal the armour away in the treasure chamber underground?\n@c0@"
  ja: "@a@b%a002050「そういえば　兵士長が\n\tよろいを　宝物庫の地下に\n\t封印するとか　いっていましたが……\n@c0@"
  ko: "@a@b%a002050: 그러고 보니 병사단장이\n갑옷을 보물 창고 지하에\n봉인한다고 했던 것 같은데......\n@c0@"
  sl: "@a@b%a002050：如此说来，\n　　记得士兵长说过要把铠甲\n　　封印到宝物库的地底下……\n@c0@"
  tl: "@a@b%a002050：如此說來，\n　　記得士兵長說過要把鎧甲\n　　封印到寶物庫的地底下……\n@c0@"
70:
  en: "@a%0%a002050@bBut with the castle in this state, how would you know where the entrance was?\n@c0@"
  ja: "@a@b%a002050「こんなに　崩れてしまったら\n\tもう　どこが　入口だか\n\tわかりませんね……。\n@c0@"
  ko: "@a@b%a002050: 이렇게 무너져 버렸으니\n어디가 입구인지\n알 수가 없네요......\n@c0@"
  sl: "@a@b%a002050：可是这里一片残垣断壁，\n　　已经看不出哪里是入口了……\n@c0@"
  tl: "@a@b%a002050：可是這裡一片殘垣斷壁，\n　　已經看不出哪裡是入口了……\n@c0@"
71:
  en: "@a%0%a002070@bBoing?\n@c0@"
  ja: "@a@b%a002070「プルップル？\n@c0@"
  ko: "@a@b%a002070: 뽀용~뽀용?\n@c0@"
  sl: "@a@b%a002070：噗噜，噗噜？\n@c0@"
  tl: "@a@b%a002070：噗嚕，噗嚕？\n@c0@"
72:
  en: "@a%0%a002000@bCrikey, %a000090! Jokin' or not, ya don't say ‘yes’ to somethin' like that!\n@c0@"
  ja: "@a@b%a002000「おいおい　%a000090。\n\tウソでも　はい　なんて\n\tいわないでくれよな！\n@c0@"
  ko: "@a@b%a002000: 어이, %a000090.\n농담으로라도 팔겠다는 말은\n하지 말라고!\n@c0@"
  sl: "@a@b%a002000：喂，%a000090，\n　　就算你想逗他玩，\n　　可也不能答应他啊！\n@c0@"
  tl: "@a@b%a002000：喂，%a000090，\n　　就算你想逗他玩，\n　　可也不能答應他啊！\n@c0@"
73:
  en: "@a%0%a002010@bYou shouldn't answer like that if you've got no intention of selling, %a000090.\n@c0@"
  ja: "@a@b%a002010「売る気がないのに\n\tそんな　返事をしちゃ\n\tだめなんじゃない？\n@c0@"
  ko: "@a@b%a002010: 팔 생각도 없으면서\n그런 대답을 하면\n안 되잖아?\n@c0@"
  sl: "@a@b%a002010：明明不想卖，\n　　那么回答可不对吧！\n@c0@"
  tl: "@a@b%a002010：明明不想賣，\n　　那麼回答可不對吧！\n@c0@"
74:
  en: "@a%0%a002030@bI would strongly suggest that we ignore such characters.\n@c0@"
  ja: "@a@b%a002030「こういう　ヤカラは\n\t相手にしないほうが　よいです。\n@c0@"
  ko: "@a@b%a002030: 이런 사람은\n상대하지 않는 게 상책입니다.\n@c0@"
  sl: "@a@b%a002030：最好还是\n　　不要和这种家伙打交道。\n@c0@"
  tl: "@a@b%a002030：最好還是\n　　不要和這種傢伙打交道。\n@c0@"
75:
  en: "@a%0%a002020@bYou were just kidding, right, %a000090? Right?\n@c0@"
  ja: "@a@b%a002020「%a000090……\n\tいまの　本気じゃないよね？\n@c0@"
  ko: "@a@b%a002020: %a000090......\n방금 그거 진심 아니었지?\n@c0@"
  sl: "@a@b%a002020：%a000090……\n　　你刚才不是真心的吧？\n@c0@"
  tl: "@a@b%a002020：%a000090……\n　　你剛才不是真心的吧？\n@c0@"
76:
  en: "@a%0%a002050@bAnd if he'd stumped up enough money, what would you have done, %a000090?\n@c0@"
  ja: "@a@b%a002050「お金が　足りてたら\n\t%a000090さん　どうするつもり\n\tだったんですか……。\n@c0@"
  ko: "@a@b%a002050: 돈이 충분히 있었다면\n%a000090 님은 어떻게 하실\n생각이었을까요......\n@c0@"
  sl: "@a@b%a002050：他要是钱带够了的话，\n　　%a000090你打算怎么收场呢……\n@c0@"
  tl: "@a@b%a002050：他要是錢帶夠了的話，\n　　%a000090你打算怎麼收場呢……\n@c0@"
77:
  en: "@a%0%a002070@bBoing? Boing!? Boing!\n@c0@"
  ja: "@a@b%a002070「プルプルル！！\n@c0@"
  ko: "@a@b%a002070: 뽀용뽀요용!!\n@c0@"
  sl: "@a@b%a002070：噗噜噗噜噜！\n@c0@"
  tl: "@a@b%a002070：噗嚕噗嚕嚕！\n@c0@"
78:
  en: "@a%0%a002000@bHardy har! He couldn't equip it even if he did buy it. He'd just turn around 'n' sell it for double, I bet.\n@c0@"
  ja: "@a@b%a002000「どうせ　コイツには\n\t使いこなせないんだからな。\n\tすぐに　売りとばす　つもりだろう。\n@c0@"
  ko: "@a@b%a002000: 어차피 이 녀석은\n쓸 수도 없는 물건이니까.\n어디다가 또 팔아먹을 작정이겠지.\n@c0@"
  sl: "@a@b%a002000：反正就算卖给他，\n　　他也不能用，\n　　肯定是打算立刻转卖出去吧。\n@c0@"
  tl: "@a@b%a002000：反正就算賣給他，\n　　他也不能用，\n　　肯定是打算立刻轉賣出去吧。\n@c0@"
79:
  en: "@a%0%a002010@bThis armour is imbued with the memories of many people. It isn't something that one simply sells...\n@c0@"
  ja: "@a@b%a002010「このよろいには　多くの人の\n\t思いが　こめられているのですもの。\n\t売れるはずがないわよね。\n@c0@"
  ko: "@a@b%a002010: 이 갑옷에는 많은 사람들의\n마음이 담겨 있잖아.\n이걸 어떻게 팔겠어.\n@c0@"
  sl: "@a@b%a002010：这件铠甲里\n　　凝聚着很多人的寄托，\n　　绝对不能卖给别人。\n@c0@"
  tl: "@a@b%a002010：這件鎧甲裡\n　　凝聚著很多人的寄託，\n　　絕對不能賣給別人。\n@c0@"
80:
  en: "@a%0%a002030@bI would strongly suggest that we ignore such characters.\n@c0@"
  ja: "@a@b%a002030「こういう　ヤカラは\n\t相手にしないほうが　よいです。\n@c0@"
  ko: "@a@b%a002030: 이런 사람은\n상대하지 않는 게 상책입니다.\n@c0@"
  sl: "@a@b%a002030：最好还是\n　　不要和这种家伙打交道。\n@c0@"
  tl: "@a@b%a002030：最好還是\n　　不要和這種傢伙打交道。\n@c0@"
81:
  en: "@a%0%a002020@bI don't care if he offered a billion gold coins. It's not for sale.\n@c0@"
  ja: "@a@b%a002020「１００万ゴールドだって\n\t売らないもんねーだ！\n@c0@"
