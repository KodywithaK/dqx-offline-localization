82:
  en: "@a%0%a002050@bOld %a002050 was terrified you'd actually go and sell it for a second there!\n@c0@"
  ja: "@a@b%a002050「ふう。\n\tいっしゅん　売ってしまうのかと\n\tドキドキ　しましたよ！\n@c0@"
  ko: "@a@b%a002050: 휴우.\n혹시 파시는 거 아닌가 하고\n조마조마했다구요!\n@c0@"
  sl: "@a@b%a002050：嗯……\n　　突然在卖与不卖之间\n　　犹豫了一下呢！\n@c0@"
  tl: "@a@b%a002050：嗯……\n　　突然在賣與不賣之間\n　　猶豫了一下呢！\n@c0@"
83:
  en: "@a%0%a002070@bBoing! (jiggle)\n@c0@"
  ja: "@a@b%a002070「プルプルーッ！\n@c0@"
  ko: "@a@b%a002070: 뽀용뽀요용~!\n@c0@"
  sl: "@a@b%a002070：噗噜噗噜！\n@c0@"
  tl: "@a@b%a002070：噗嚕噗嚕！\n@c0@"
84:
  en: "@a%0%a002000@bCrikey! You hit the nail right on the head, %a000090! Not bad!\n@c0@"
