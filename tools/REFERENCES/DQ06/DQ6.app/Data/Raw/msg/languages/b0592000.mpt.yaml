  ko: "@a@b%a002000: 대단한걸, %a000090!\n그 위치에 계단이 있었다는 걸\n알고 있었군!\n@c0@"
  sl: "@a@b%a002000：真行啊！\n　　%a000090居然把台阶的位置\n　　记得这么牢！\n@c0@"
  tl: "@a@b%a002000：真行啊！\n　　%a000090居然把臺階的位置\n　　記得這麼牢！\n@c0@"
85:
