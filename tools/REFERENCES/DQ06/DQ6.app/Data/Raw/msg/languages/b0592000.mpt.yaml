87:
  en: "@a%0%a002020@bHow much time do you think has passed since that ceremony?\n@c0@"
  ja: "@a@b%a002020「あの　儀式の日から\n\tいまは　どのくらい　時間が\n\tたっているんだろう……。\n@c0@"
  ko: "@a@b%a002020: 그 의식의 날로부터\n지금은 시간이 얼마나\n흐른 걸까......\n@c0@"
