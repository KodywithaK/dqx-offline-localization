90:
  en: "@a%0%a002070@b(jiggle) Boing.\n@c0@"
  ja: "@a@b%a002070「プルプル……。\n@c0@"
  ko: "@a@b%a002070: 뽀용뽀용......\n@c0@"
  sl: "@a@b%a002070：噗噜噗噜……\n@c0@"
  tl: "@a@b%a002070：噗嚕噗嚕……\n@c0@"
