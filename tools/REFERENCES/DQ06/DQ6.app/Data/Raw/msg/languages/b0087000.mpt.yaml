0:
  en: "@a@b*: You've reached Greedmore Valley. Of course, that name just won't do any more...\n@c0@"
  ja: "@a@b＊「ここは　欲望の町だよ。\n\tけど　もう　そんな名前は\n\t似合わないかもねえ。\n@c0@"
  ko: "@a@b*: 여기는 욕망의 마을이야.\n하지만 이젠 그런 이름은\n어울리지 않을지도.\n@c0@"
  sl: "@a@b＊：这里是欲望之镇。\n　　不过，这个名字似乎\n　　已经不再适合这里了。\n@c0@"
  tl: "@a@b＊：這裡是欲望之鎮。\n　　不過，這個名字似乎\n　　已經不再適合這裡了。\n@c0@"
1:
  en: "@a@b*: It's like we all snapped to our senses the second we heard there was nothing in Isaac's chest...\n@c0@"
  ja: "@a@b＊「大賢者マサールの宝箱が\n\tからっぽだったって聞いたとたん\n\tみんな　つきものが落ちたように……\n@c0@"
  ko: "@a@b*: 대현자 마살의 보물 상자가\n비어 있었다는 소릴 듣자마자\n모두 정신을 차린 것 같아.......\n@c0@"
  sl: "@a@b＊：自从得知大贤者马萨尔\n　　留下的宝箱是空的，\n　　大家仿佛也都摆脱了心魔……\n@c0@"
  tl: "@a@b＊：自從得知大賢者馬薩爾\n　　留下的寶箱是空的，\n　　大家仿佛也都擺脫了心魔……\n@c0@"
2:
  en: "@a@b*: And we owe it all to you. Thank you.\n@c0@"
  ja: "@a@b＊「あんたたちの　おかげだよ。\n\tありがとうよ。\n@c0@"
  ko: "@a@b*: 너희들 덕분이야.\n고마워.\n@c0@"
