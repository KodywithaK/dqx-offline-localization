146:
  en: "@a%0%a002010@bSurely the Archfiend hasn't got hold of them...?\n@c0@"
  ja: "@a@b%a002010「まさか　大魔王の手が\n\tお二人に　のびてきているとか？\n@c0@"
  ko: "@a@b%a002010: 설마 대마왕의 손이\n두 사람에게 뻗치고 있는 걸까?\n@c0@"
  sl: "@a@b%a002010：难道说大魔王的魔爪\n　　已经伸向了２位贤者吗？\n@c0@"
  tl: "@a@b%a002010：難道說大魔王的魔爪\n　　已經伸向了２位賢者嗎？\n@c0@"
147:
  en: "@a%0%a002030@bAli Kazam, Benjamin, Isaac — all three of them are famed sages.\n@c0@"
  ja: "@a@b%a002030「ザム…クリムト…マサール……\n\tどのかたも　有名な賢者さまです。\n@c0@"
  ko: "@a@b%a002030: 자무... 클림트... 마살......\n모두 유명한 현자님입니다.\n@c0@"
  sl: "@a@b%a002030：扎姆……克林姆……\n　　马萨尔……无论哪位都是著名的贤者大人。\n@c0@"
  tl: "@a@b%a002030：扎姆……克林姆……\n　　馬薩爾……無論哪位都是著名的賢者大人。\n@c0@"
148:
  en: "@a%0%a002020@bBenjamin and Isaac, huh...? Haven't we heard a few stories about them?\n@c0@"
  ja: "@a@b%a002020「クリムト……マサール……\n\tどっかで　ウワサ　聞いたっけ？\n@c0@"
  ko: "@a@b%a002020: 클림트...... 마살......\n소문을 들은 적이 있던가?\n@c0@"
  sl: "@a@b%a002020：克林姆……马萨尔……\n　　是不是在哪里听说过他们的传闻来着？\n@c0@"
  tl: "@a@b%a002020：克林姆……馬薩爾……\n　　是不是在哪裡聽說過他們的傳聞來著？\n@c0@"
149:
