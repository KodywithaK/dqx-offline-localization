  ko: "@a@b%a002000: 대충 말하는 거 같은\n아저씨지만 암호도 제법 도움이 됐고\n패스도 받을 수 있어서 고맙긴 하구먼.\n@c0@"
  sl: "@a@b%a002000：虽说是个随便的大叔，\n　　不过他说的暗语也勉强用上了，\n　　还给咱们通行证，真是值得感谢啊。\n@c0@"
  tl: "@a@b%a002000：雖說是個隨便的大叔，\n　　不過他說的暗語也勉強用上了，\n　　還給咱們通行證，真是值得感謝啊。\n@c0@"
73:
  en: "@a%0%a002010@bIf these swordsmiths are as mythical as Ali says, they should have no problem fixing this sword!\n@c0@"
  ja: "@a@b%a002010「すごうでの　剣職人って\n\tいうくらいだから　きっと　この剣も\n\t直してくれるに　ちがいないわね！\n@c0@"
  ko: "@a@b%a002010: 굉장한 솜씨의 검 장인이라고\n할 정도니까 틀림없이 이 검도\n고쳐 줄 거야!\n@c0@"
  sl: "@a@b%a002010：既然被誉为\n　　技艺高超的铸剑师，\n　　一定能将这把剑复原的！\n@c0@"
  tl: "@a@b%a002010：既然被譽為\n　　技藝高超的鑄劍師，\n　　一定能將這把劍復原的！\n@c0@"
74:
  en: "@a%0%a002030@bIn this sorry state, the legendary sword is no use to anyone. We have urgent need of a swordsmith.\n@c0@"
  ja: "@a@b%a002030「いかに　伝説の剣でも\n\tサビたままでは　しかたありません。\n\t剣職人さんを　たずねましょう。\n@c0@"
  ko: "@a@b%a002030: 아무리 전설의 검이라도\n녹슬어 있으면 쓸 수가 없지요.\n검 장인을 찾아갑시다.\n@c0@"
  sl: "@a@b%a002030：就算是传说之剑，\n　　就这么锈着可什么也做不了。\n　　还是去拜托铸剑师吧。\n@c0@"
  tl: "@a@b%a002030：就算是傳說之劍，\n　　就這麼鏽著可什麼也做不了。\n　　還是去拜託鑄劍師吧。\n@c0@"
75:
  en: "@a%0%a002020@bGuess our next stop is Turnscote, huh?\n@c0@"
  ja: "@a@b%a002020「こりゃもう　ロンガデセオに\n\t行くっきゃないね！\n@c0@"
  ko: "@a@b%a002020: 이거, 론가데세오에\n갈 수밖에 없겠군!\n@c0@"
  sl: "@a@b%a002020：这样一来就只能\n　　去洛卡迪塞欧镇探个究竟了！\n@c0@"
  tl: "@a@b%a002020：這樣一來就只能\n　　去洛卡迪塞歐鎮探個究竟了！\n@c0@"
76:
  en: "@a%0%a002050@bWith this, we can get into Turnscote. Let's hop to it!\n@c0@"
  ja: "@a@b%a002050「これさえあれば\n\tロンガデセオに　入れるんですね。\n\tやりましたね！\n@c0@"
  ko: "@a@b%a002050: 이것만 있으면\n론가데세오에 들어갈 수 있어요.\n해냈군요!\n@c0@"
  sl: "@a@b%a002050：只要有了这个，\n　　就能进入洛卡迪塞欧镇了吧。\n　　太好了！\n@c0@"
  tl: "@a@b%a002050：只要有了這個，\n　　就能進入洛卡迪塞歐鎮了吧。\n　　太好了！\n@c0@"
77:
  en: "@a%0%a002070@bBoing. Boi-oing!\n@c0@"
  ja: "@a@b%a002070「プルプルル！\n@c0@"
  ko: "@a@b%a002070: 뽀용뽀요용!\n@c0@"
  sl: "@a@b%a002070：噗噜噗噜噜！\n@c0@"
  tl: "@a@b%a002070：噗嚕噗嚕嚕！\n@c0@"
78:
  en: "@a%0%a002000@bSouth of which Alltrades, though...? Ah, we'll find out soon enough, aye?\n@c0@"
  ja: "@a@b%a002000「ダーマ神殿の　南だな！\n\tん？　どっちの　ダーマだ？\n\tまあ　行ってみればわかるか！\n@c0@"
  ko: "@a@b%a002000: 다마 신전의 남쪽이었지!\n응? 어느 쪽 다마야?\n뭐, 가 보면 알겠지!\n@c0@"
  sl: "@a@b%a002000：在达玛神殿的南边！\n　　嗯？哪边的达玛？\n　　去看看就知道了吧！\n@c0@"
  tl: "@a@b%a002000：在達瑪神殿的南邊！\n　　嗯？哪邊的達瑪？\n　　去看看就知道了吧！\n@c0@"
79:
  en: "@a%0%a002010@bI wonder if these swordsmiths are still in Turnscote... There's only one way to find out...\n@c0@"
  ja: "@a@b%a002010「ロンガデセオの\n\tすごうで　剣職人ね……。\n\t行けば　わかるかしら？\n@c0@"
  ko: "@a@b%a002010: 론가데세오의\n굉장한 솜씨의 검 장인이라......\n가 보면 알 수 있을까?\n@c0@"
  sl: "@a@b%a002010：洛卡迪塞欧镇的\n　　技艺高超的铸剑师呢……\n　　去找找应该就能知道了吧？\n@c0@"
  tl: "@a@b%a002010：洛卡迪塞歐鎮的\n　　技藝高超的鑄劍師呢……\n　　去找找應該就能知道了吧？\n@c0@"
80:
  en: "@a%0%a002030@bA famous family of swordsmiths? I look forward to finding out more!\n@c0@"
  ja: "@a@b%a002030「どんな　すごうでの\n\t剣職人なんでしょう。\n\t楽しみですね！\n@c0@"
  ko: "@a@b%a002030: 얼마나 굉장한 솜씨의\n검 장인일까요?\n기대되는군요!\n@c0@"
  sl: "@a@b%a002030：铸剑师的技术\n　　会有多高超呢。\n　　真是令人感到期待！\n@c0@"
  tl: "@a@b%a002030：鑄劍師的技術\n　　會有多高超呢。\n　　真是令人感到期待！\n@c0@"
81:
  en: "@a%0%a002020@bI get that Ali's trying to help us out, but he hasn't been to this place in fifty years. That's, like, forever!\n@c0@"
  ja: "@a@b%a002020「ザム神官の　話だから\n\t５０年以上　前のことだね……。\n@c0@"
  ko: "@a@b%a002020: 자무 신관의 이야기니까\n50년도 더 된 일이지......\n@c0@"
  sl: "@a@b%a002020：既然是扎姆神官说的，\n　　那应该是５０年前的事情了吧……\n@c0@"
  tl: "@a@b%a002020：既然是扎姆神官說的，\n　　那應該是５０年前的事情了吧……\n@c0@"
