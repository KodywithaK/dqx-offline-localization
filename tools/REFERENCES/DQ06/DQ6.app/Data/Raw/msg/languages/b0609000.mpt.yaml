  ja: "@a@b%a002010「うふふ。\n\t若い頃は　少しくらい\n\tはじけていたほうが　頼もしいのよね。\n@c0@"
  ko: "@a@b%a002010: 우후훗.\n젊었을 때 조금은\n놀아본 사람이 듬직하긴 하지.\n@c0@"
  sl: "@a@b%a002010：呵呵呵。\n　　年轻时候活得奔放一些的人\n　　会比较可靠呢。\n@c0@"
  tl: "@a@b%a002010：呵呵呵。\n　　年輕時候活得奔放一些的人\n　　會比較可靠呢。\n@c0@"
