  en: "@a%0%a002010@bGoddess, I can hardly bear to think of it...\n@c0@"
  ja: "@a@b%a002010「うーん……。\n\tあまり　考えたくないわね。\n@c0@"
  ko: "@a@b%a002010: 으음......\n별로 생각하고 싶지 않은걸.\n@c0@"
  sl: "@a@b%a002010：唔……\n　　真不想考虑这个问题。\n@c0@"
  tl: "@a@b%a002010：唔……\n　　真不想考慮這個問題。\n@c0@"
69:
  en: "@a%0%a002020@bI'd go stir-crazy after a day!\n@c0@"
  ja: "@a@b%a002020「あたしだったら\n\t１日だって　イヤだよ！\n@c0@"
  ko: "@a@b%a002020: 나라면\n하루도 들어가 있기 싫어!\n@c0@"
  sl: "@a@b%a002020：我一天都\n　　待不下去啊！\n@c0@"
  tl: "@a@b%a002020：我一天都\n　　待不下去啊！\n@c0@"
70:
  en: "@a%0%a002030@bShe was trapped like a bird in a cage, poor thing...\n@c0@"
  ja: "@a@b%a002030「いわゆる\n\tカゴの中の　トリでしょうか。\n@c0@"
  ko: "@a@b%a002030: 이른바\n새장 속의 새 같은 느낌일까요?\n@c0@"
  sl: "@a@b%a002030：那就是\n　　所谓的笼中鸟吧。\n@c0@"
  tl: "@a@b%a002030：那就是\n　　所謂的籠中鳥吧。\n@c0@"
71:
  en: "@a%0%a002050@bI wonder what your reflection looks like when you're inside the mirror...\n@c0@"
  ja: "@a@b%a002050「中から　見たら\n\t自分の　すがたは\n\tどう　うつるんですかね……。\n@c0@"
  ko: "@a@b%a002050: 안에서 보면\n자기 모습은\n어떻게 비칠까요......\n@c0@"
  sl: "@a@b%a002050：在镜子里面看\n　　映在镜子上的自己的身影\n　　是怎样的呢……\n@c0@"
  tl: "@a@b%a002050：在鏡子裡面看\n　　映在鏡子上的自己的身影\n　　是怎樣的呢……\n@c0@"
72:
  en: "@a%0%a002000@bWonder how he'll describe me... Can words even do my pecs justice? I doubt it...\n@c0@"
  ja: "@a@b%a002000「おいおい　じいさん！\n\tだったら　オレを　カッコよく\n\t書いておいてくれよ　なっ！\n@c0@"
  ko: "@a@b%a002000: 어이 어이, 영감님!\n이왕이면 나를 멋있게\n묘사해 달라고!\n@c0@"
  sl: "@a@b%a002000：喂喂，老爷爷！\n　　既然要写，就把俺写帅一点啊！\n　　拜托了！\n@c0@"
  tl: "@a@b%a002000：喂喂，老爺爺！\n　　既然要寫，就把俺寫帥一點啊！\n　　拜託了！\n@c0@"
73:
  en: "@a%0%a002010@bCould that old gentleman be the one who read King Ludwig the story when he was a child?\n@c0@"
  ja: "@a@b%a002010「この　おじいさんが\n\tあの物語を　王さまに\n\t伝えた人なのかしらね。\n@c0@"
  ko: "@a@b%a002010: 이 할아버지가\n그 이야기를 폐하께\n전한 사람일까?\n@c0@"
  sl: "@a@b%a002010：这个老爷爷就是\n　　把那个故事告诉\n　　国王陛下的人吧。\n@c0@"
  tl: "@a@b%a002010：這個老爺爺就是\n　　把那個故事告訴\n　　國王陛下的人吧。\n@c0@"
74:
  en: "@a%0%a002020@bOh, I totally agree! Happy endings just make me so...happy!\n@c0@"
  ja: "@a@b%a002020「そうよね～　やっぱり\n\tハッピーエンドが　いちばんよね！\n@c0@"
  ko: "@a@b%a002020: 맞아~ 역시\n해피 엔딩이 최고지!\n@c0@"
  sl: "@a@b%a002020：没错～\n　　完美结局果然才是最棒的！\n@c0@"
  tl: "@a@b%a002020：沒錯～\n　　完美結局果然才是最棒的！\n@c0@"
75:
  en: "@a%0%a002030@bIt will doubtless make for a splendid tale.\n@c0@"
  ja: "@a@b%a002030「すてきな　お話に\n\tなりそうですね。\n@c0@"
  ko: "@a@b%a002030: 멋진 이야기가\n되겠군요.\n@c0@"
  sl: "@a@b%a002030：好像会变成\n　　一段佳话呢。\n@c0@"
  tl: "@a@b%a002030：好像會變成\n　　一段佳話呢。\n@c0@"
76:
  en: "@a%0%a002050@bHere's hopin' old %a002050 gets a happy endin' to his story as well! ...Well, I'm not ready for the endin' just yet, mind you...\n@c0@"
  ja: "@a@b%a002050「私の　人生も\n\tハッピーエンドで……って\n\tまだ　終わらせませんけど！\n@c0@"
  ko: "@a@b%a002050: 제 인생도\n해피 엔딩으로...... 앗,\n잠깐만요. 아직 안 끝낼 건데요!\n@c0@"
  sl: "@a@b%a002050：我的人生要是\n　　也有个完美的结局……不对！\n　　我的人生还没有结束呢！\n@c0@"
  tl: "@a@b%a002050：我的人生要是\n　　也有個完美的結局……不對！\n　　我的人生還沒有結束呢！\n@c0@"
77:
  en: "@a%0%a002000@bHe's got that right!\n@c0@"
  ja: "@a@b%a002000「夢の世界まで\n\tあったりするから　まったく\n\t世の中　不思議だらけだぜ！\n@c0@"
  ko: "@a@b%a002000: 꿈의 세계까지\n있을 정도니 정말\n이 세상엔 알 수 없는 일이 잔뜩 있지!\n@c0@"
  sl: "@a@b%a002000：既然连梦世界\n　　都能真实存在，只能说\n　　世界之大无奇不有啊！\n@c0@"
  tl: "@a@b%a002000：既然連夢世界\n　　都能真實存在，只能說\n　　世界之大無奇不有啊！\n@c0@"
78:
  en: "@a%0%a002010@bHe's right — this whole mirror princess affair was nothing if not bizarre.\n@c0@"
  ja: "@a@b%a002010「カガミ姫の　事件は\n\t本当に　不思議な\n\t事件だったわね。\n@c0@"
  ko: "@a@b%a002010: 거울 공주 사건은\n정말 신기한\n사건이었어.\n@c0@"
  sl: "@a@b%a002010：明镜公主这事，\n　　真是太不可思议了啊。\n@c0@"
  tl: "@a@b%a002010：明鏡公主這事，\n　　真是太不可思議了啊。\n@c0@"
79:
  en: "@a%0%a002020@bBoy, he said it! We run into crazier things with each passing day!\n@c0@"
  ja: "@a@b%a002020「まったくだわ。\n\t人間の　想像をこえた　事件が\n\tいっぱい　あるもんね。\n@c0@"
  ko: "@a@b%a002020: 정말이야.\n인간의 상상을 초월한 사건이\n얼마나 많은지 모른다구.\n@c0@"
  sl: "@a@b%a002020：真是的。\n　　世间有不少事真是超乎\n　　人们的想象呢。\n@c0@"
  tl: "@a@b%a002020：真是的。\n　　世間有不少事真是超乎\n　　人們的想像呢。\n@c0@"
80:
  en: "@a%0%a002030@bIn life, one never knows what waits around the next corner.\n@c0@"
  ja: "@a@b%a002030「なにが　起こるか\n\tわからないのが　人生ですから。\n@c0@"
  ko: "@a@b%a002030: 무슨 일이 일어날지\n알 수 없는 것이 인생이지요.\n@c0@"
  sl: "@a@b%a002030：人生就是这样，\n　　不知道接下来会发生什么事。\n@c0@"
  tl: "@a@b%a002030：人生就是這樣，\n　　不知道接下來會發生什麼事。\n@c0@"
81:
  en: "@a%0%a002050@bIn this case, the fairy tale was real, so the truth was exactly as strange as the fiction!\n@c0@"
  ja: "@a@b%a002050「事実は　物語どおり……\n\tだったりも　しますけどね。\n\tわっはっは！\n@c0@"
  ko: "@a@b%a002050: 사실은 이야기와 똑같다......\n그런 일도 가끔 있죠.\n와하하!\n@c0@"
  sl: "@a@b%a002050：现实有时候\n　　就跟故事一样呢。\n　　哇哈哈！\n@c0@"
  tl: "@a@b%a002050：現實有時候\n　　就跟故事一樣呢。\n　　哇哈哈！\n@c0@"
82:
  en: "@a%0%a002000@bThat fella must've nearly passed out when she sauntered by, aye?\n@c0@"
  ja: "@a@b%a002000「ここを　通ったときに\n\tさぞ　ビックリしたんだろうな。\n@c0@"
  ko: "@a@b%a002000: 여길 지나갔을 때\n정말 놀란 모양이군.\n@c0@"
  sl: "@a@b%a002000：经过这里的时候，\n　　一定非常吃惊吧。\n@c0@"
  tl: "@a@b%a002000：經過這裡的時候，\n　　一定非常吃驚吧。\n@c0@"
83:
  en: "@a%0%a002010@bMiralda did indeed look fantastic. Her aura was positively glittering!\n@c0@"
  ja: "@a@b%a002010「イリカ姫は　本当に\n\tかがやいて　いたわよね。\n@c0@"
  ko: "@a@b%a002010: 일리카 공주는 정말로\n반짝반짝 빛나 보였어.\n@c0@"
  sl: "@a@b%a002010：伊丽卡公主\n　　真的闪耀着光辉呢。\n@c0@"
  tl: "@a@b%a002010：伊麗卡公主\n　　真的閃耀著光輝呢。\n@c0@"
84:
  en: "@a%0%a002020@bShe was so beautiful, even I was a little jealous. There, I said it.\n@c0@"
  ja: "@a@b%a002020「女の　あたしが見ても\n\tうらやましい　くらいだものね。\n@c0@"
  ko: "@a@b%a002020: 여자인 내가 봐도\n부러울 정도였지.\n@c0@"
  sl: "@a@b%a002020：虽然我也是女孩子，\n　　看到她也觉得羡慕呢。\n@c0@"
  tl: "@a@b%a002020：雖然我也是女孩子，\n　　看到她也覺得羡慕呢。\n@c0@"
85:
  en: "@a%0%a002030@bI have never seen such a stunning woman... Er... Perhaps I should pray for a while...\n@c0@"
  ja: "@a@b%a002030「私も　いままで\n\tあれほど　美しいかたは\n\t見たことが　ありませんね。\n@c0@"
  ko: "@a@b%a002030: 저도 지금까지\n그렇게 아름다운 분은\n본 적이 없습니다.\n@c0@"
  sl: "@a@b%a002030：我从来没有\n　　见过那么美的人。\n@c0@"
  tl: "@a@b%a002030：我從來沒有\n　　見過那麼美的人。\n@c0@"
86:
  en: "@a%0%a002050@bShe might be a few millennia old, but true beauty never ages!\n@c0@"
  ja: "@a@b%a002050「本当に　美しい女性は\n\tいくつに　なっても\n\t美しいものなのですね！\n@c0@"
  ko: "@a@b%a002050: 정말 아름다운 여성은\n몇 살이 되어도\n아름다운 법이군요!\n@c0@"
  sl: "@a@b%a002050：真正美丽的女性\n　　不管到了多少岁\n　　都照样美丽动人呢！\n@c0@"
  tl: "@a@b%a002050：真正美麗的女性\n　　不管到了多少歲\n　　都照樣美麗動人呢！\n@c0@"
87:
  en: "@a%0%a002000@bAhh, come on. Were things really that bad for that long?\n@c0@"
  ja: "@a@b%a002000「へえ……。\n\tそんなもん　なのかな。\n@c0@"
  ko: "@a@b%a002000: 흐음......\n그런가?\n@c0@"
  sl: "@a@b%a002000：诶……\n　　是这样啊。\n@c0@"
  tl: "@a@b%a002000：誒……\n　　是這樣啊。\n@c0@"
88:
  en: "@a%0%a002010@bI certainly hope he can manage something better than that.\n@c0@"
  ja: "@a@b%a002010「がんばって　よろこびの歌を\n\t作ってもらわなくっちゃね！\n@c0@"
  ko: "@a@b%a002010: 기쁨의 노래도 더 열심히\n만들어 줘야겠는걸!\n@c0@"
  sl: "@a@b%a002010：一定要加油\n　　写出欢乐的歌啊！\n@c0@"
  tl: "@a@b%a002010：一定要加油\n　　寫出歡樂的歌啊！\n@c0@"
89:
  en: "@a%0%a002020@bThat guy will never be the king of pop with lyrics like that...\n@c0@"
  ja: "@a@b%a002020「あたしは　悲しいときも\n\t楽しい歌を　歌うよ！\n@c0@"
  ko: "@a@b%a002020: 난 슬플 때도\n즐거운 노래를 불러!\n@c0@"
  sl: "@a@b%a002020：我即使是在伤心的时候，\n　　也会唱欢快的歌哦！\n@c0@"
  tl: "@a@b%a002020：我即使是在傷心的時候，\n　　也會唱歡快的歌哦！\n@c0@"
90:
  en: "@a%0%a002030@bIf I had even a modicum of musical ability, I would compose a song for the King myself.\n@c0@"
  ja: "@a@b%a002030「私に　歌の　才能があれば\n\t１曲作って　王さまに　プレゼント\n\tしたい　ところですね。\n@c0@"
  ko: "@a@b%a002030: 제가 노래에 소질이 있다면\n한 곡 만들어서 폐하께\n선물해 드리고 싶군요.\n@c0@"
  sl: "@a@b%a002030：要是我有音乐的\n　　才能的话，真想写一首歌\n　　送给国王陛下呢。\n@c0@"
  tl: "@a@b%a002030：要是我有音樂的\n　　才能的話，真想寫一首歌\n　　送給國王陛下呢。\n@c0@"
91:
  en: "@a%0%a002050@bI bet if he wrote a sad song now, he'd get the sack!\n@c0@"
  ja: "@a@b%a002050「もし　いま\n\t悲しい　歌なんか　作ったら\n\tクビに　なりますよね！\n@c0@"
  ko: "@a@b%a002050: 만약 지금\n슬픈 노래를 만든다면\n잘리겠네요!\n@c0@"
  sl: "@a@b%a002050：要是现在写\n　　悲伤的歌曲的话，\n　　会被炒鱿鱼的吧！\n@c0@"
  tl: "@a@b%a002050：要是現在寫\n　　悲傷的歌曲的話，\n　　會被炒魷魚的吧！\n@c0@"
92:
  en: "@a%0%a002000@bWhatever he can't eat, I'd be happy to help out with.\n@c0@"
  ja: "@a@b%a002000「きっと　今まで\n\t食べられなかった分まで\n\t食べるんじゃないか？\n@c0@"
  ko: "@a@b%a002000: 아마 지금까지\n못 먹었던 만큼\n더 먹는 거 아닐까?\n@c0@"
  sl: "@a@b%a002000：一定会比之前\n　　吃的多得多吧？\n@c0@"
  tl: "@a@b%a002000：一定會比之前\n　　吃的多得多吧？\n@c0@"
93:
  en: "@a%0%a002010@bI hope she realises there's now one more royal mouth to feed!\n@c0@"
  ja: "@a@b%a002010「これからは　１人分\n\t作る　お料理が　ふえるわね。\n@c0@"
  ko: "@a@b%a002010: 앞으로는 만들 요리가\n1인분 늘겠구나.\n@c0@"
  sl: "@a@b%a002010：今后需要\n　　多做一个人的饭了呢。\n@c0@"
  tl: "@a@b%a002010：今後需要\n　　多做一個人的飯了呢。\n@c0@"
94:
  en: "@a%0%a002020@bI just realised that Princess Miralda hasn't eaten in thousands of years! Her tummy must be roaring!\n@c0@"
  ja: "@a@b%a002020「あ！　イリカ姫は\n\t何千年分も　おなかが　すいて\n\tいるんじゃない！？\n@c0@"
  ko: "@a@b%a002020: 아! 일리카 공주는\n몇천 년 못 먹었던 것만큼\n배가 고프지 않을까!?\n@c0@"
  sl: "@a@b%a002020：啊！难道\n　　伊丽卡公主已经\n　　饿了好几千年了？！\n@c0@"
  tl: "@a@b%a002020：啊！難道\n　　伊麗卡公主已經\n　　餓了好幾千年了？！\n@c0@"
95:
  en: "@a%0%a002030@bIt is time for her to do what she does best!\n@c0@"
  ja: "@a@b%a002030「これからが　この方の\n\tうでの　ふるいどころ　ですね！\n@c0@"
  ko: "@a@b%a002030: 이제 이분이 실력을\n발휘할 때가 왔군요!\n@c0@"
  sl: "@a@b%a002030：今后这个人\n　　一定可以一展厨艺了！\n@c0@"
  tl: "@a@b%a002030：今後這個人\n　　一定可以一展廚藝了！\n@c0@"
96:
  en: "@a%0%a002050@bOld %a002050 isn't half peckish, I tell you!\n@c0@"
  ja: "@a@b%a002050「私も　ひと仕事おえて\n\tおなかが　すきました……。\n@c0@"
  ko: "@a@b%a002050: 저도 일을 하나 끝냈더니\n배가 고픕니다......\n@c0@"
  sl: "@a@b%a002050：做完一件工作，\n　　我肚子也饿了呢……\n@c0@"
  tl: "@a@b%a002050：做完一件工作，\n　　我肚子也餓了呢……\n@c0@"
97:
  en: "@a%0%a002000@bNot that I care about all that lovey-dovey stuff, but those two really do deserve to be happy.\n@c0@"
  ja: "@a@b%a002000「これまでの分も\n\tしあわせに　なってもらわなきゃ\n\t困るぜ！\n@c0@"
  ko: "@a@b%a002000: 지금껏 고생했던 것까지\n행복해지지 않으면\n곤란하지!\n@c0@"
  sl: "@a@b%a002000：咱这么辛苦，\n　　他们要是不幸福的话，\n　　实在是对不起咱啊！\n@c0@"
  tl: "@a@b%a002000：咱這麼辛苦，\n　　他們要是不幸福的話，\n　　實在是對不起咱啊！\n@c0@"
98:
  en: "@a%0%a002010@bNo wonder they look happy — imagine finally being able to embrace someone after staring at them from afar for years!\n@c0@"
  ja: "@a@b%a002010「これからが　おふたりの\n\t本当の　スタートですものね。\n@c0@"
  ko: "@a@b%a002010: 지금부터가 두 분의\n진정한 새 출발이야.\n@c0@"
  sl: "@a@b%a002010：两人的未来\n　　现在才开始呢。\n@c0@"
  tl: "@a@b%a002010：兩人的未來\n　　現在才開始呢。\n@c0@"
99:
  en: "@a%0%a002020@bI'm more than a bit envious. I'm a LOT envious!\n@c0@"
  ja: "@a@b%a002020「あたしも　うらやましい！\n@c0@"
  ko: "@a@b%a002020: 나도 부러워!\n@c0@"
  sl: "@a@b%a002020：我也好羡慕！\n@c0@"
  tl: "@a@b%a002020：我也好羡慕！\n@c0@"
100:
  en: "@a%0%a002030@bThere is no need for envy — the Goddess has a plan for us all.\n@c0@"
  ja: "@a@b%a002030「やっと　カガミ姫のことが\n\t明るい　話題に　なったのだから\n\tとうぜんですね。\n@c0@"
  ko: "@a@b%a002030: 이제서야 거울 공주가\n밝은 화제가 되었으니\n당연한 일이겠군요.\n@c0@"
