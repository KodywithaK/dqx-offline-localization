  sl: "@a@b%a002050：%a000090\n　　你不要命了啊！\n@c0@"
  tl: "@a@b%a002050：%a000090\n　　你不要命了啊！\n@c0@"
142:
  en: "@a%0%a002000@bWhatever world we're in right now, she ain't livin' in it.\n@c0@"
  ja: "@a@b%a002000「現実を　受け入れるのが\n\tつらいんだろうな……。\n@c0@"
  ko: "@a@b%a002000: 현실을 받아들이는 게\n힘들겠군......\n@c0@"
  sl: "@a@b%a002000：接受现实\n　　很痛苦吧……\n@c0@"
  tl: "@a@b%a002000：接受現實\n　　很痛苦吧……\n@c0@"
143:
  en: "@a%0%a002010@bShe shouldn't get her hopes up. This story's ending has already been written...\n@c0@"
  ja: "@a@b%a002010「でも　もう\n\tこの　物語の　結末は\n\t書き終えたかも……。\n@c0@"
  ko: "@a@b%a002010: 하지만 벌써\n이 이야기의 결말은\n마무리가 되었을 텐데......\n@c0@"
  sl: "@a@b%a002010：不过，这个故事\n　　已经有结局了……\n@c0@"
  tl: "@a@b%a002010：不過，這個故事\n　　已經有結局了……\n@c0@"
144:
  en: "@a%0%a002020@bThat girl's crazy for the King — emphasis on ‘crazy’.\n@c0@"
  ja: "@a@b%a002020「この人　フォーン王に\n\tくびったけ　なんだね。\n@c0@"
  ko: "@a@b%a002020: 이 사람, 폰 왕한테\n홀딱 반했구나.\n@c0@"
  sl: "@a@b%a002020：这个人\n　　深爱着佛恩王呢。\n@c0@"
  tl: "@a@b%a002020：這個人\n　　深愛著佛恩王呢。\n@c0@"
145:
  en: "@a%0%a002030@bIt may be hopeless, but I fear she still may not give up.\n@c0@"
