  ko: "@a@b%a002010: 아니 땐 굴뚝에\n연기는 나지 않는 법이잖아......\n@c0@"
  sl: "@a@b%a002010：无风不起浪……\n@c0@"
  tl: "@a@b%a002010：無風不起浪……\n@c0@"
133:
  en: "@a%0%a002010@bThis Dread Fiend of the deep sea might be out there somewhere...\n@c0@"
  ja: "@a@b%a002010「海の魔王も　きっと\n\tどこかに　いるんじゃない？\n@c0@"
  ko: "@a@b%a002010: 바다의 마왕도 분명\n어딘가에 있는 거 아닐까?\n@c0@"
  sl: "@a@b%a002010：海之魔王一定\n　　就在什么地方吧？\n@c0@"
  tl: "@a@b%a002010：海之魔王一定\n　　就在什麼地方吧？\n@c0@"
134:
  en: "@a%0%a002020@bI guess you have to take the bad legends with the good ones.\n@c0@"
  ja: "@a@b%a002020「伝説が　すべて\n\tハッピーエンドなら　いいのにね。\n@c0@"
  ko: "@a@b%a002020: 전설이 모두\n해피 엔딩이면 좋을 텐데 말이야.\n@c0@"
  sl: "@a@b%a002020：要是传说全部\n　　都有个好结局就好了啊。\n@c0@"
  tl: "@a@b%a002020：要是傳說全部\n　　都有個好結局就好了啊。\n@c0@"
135:
  en: "@a%0%a002030@bBut how might one travel to the ocean floor...?\n@c0@"
  ja: "@a@b%a002030「海の底なんて　どうやって\n\t行くのでしょうか……。\n@c0@"
  ko: "@a@b%a002030: 바다 밑바닥으로는 어떻게\n갈 수 있는 걸까요......\n@c0@"
  sl: "@a@b%a002030：到底要怎样\n　　才能去海底啊……\n@c0@"
  tl: "@a@b%a002030：到底要怎樣\n　　才能去海底啊……\n@c0@"
136:
  en: "@a%0%a002050@bAre there any legends where a man who turns into a monster marries a beautiful princess?\n@c0@"
  ja: "@a@b%a002050「まものに　変身できる　男が\n\t美しい姫と　結婚する…　みたいな\n\t伝説は　ありませんかね。\n@c0@"
  ko: "@a@b%a002050: 마물로 변신할 수 있는 남자가\n아름다운 공주와 결혼한다......\n뭐 이런 전설은 없을까요?\n@c0@"
  sl: "@a@b%a002050：有没有哪个故事讲的是\n　　可以变身成魔物的男子\n　　娶了美丽的公主啊……\n@c0@"
  tl: "@a@b%a002050：有沒有哪個故事講的是\n　　可以變身成魔物的男子\n　　娶了美麗的公主啊……\n@c0@"
137:
  en: "@a%0%a002000@bCrikey! She went from sweet to sour quick, aye?\n@c0@"
  ja: "@a@b%a002000「おー　こわっ！\n@c0@"
  ko: "@a@b%a002000: 오~ 무서워라!\n@c0@"
  sl: "@a@b%a002000：哦，真可怕！\n@c0@"
  tl: "@a@b%a002000：哦，真可怕！\n@c0@"
138:
  en: "@a%0%a002010@bI don't think she was actually looking for an answer, %a000090.\n@c0@"
  ja: "@a@b%a002010「いまの　受け答えは\n\tちょっと　失礼だったかもね。\n@c0@"
  ko: "@a@b%a002010: 방금 그건\n좀 실례되는 대답이었을지도 몰라.\n@c0@"
  sl: "@a@b%a002010：刚才那种回答\n　　有点失礼吧。\n@c0@"
  tl: "@a@b%a002010：剛才那種回答\n　　有點失禮吧。\n@c0@"
139:
  en: "@a%0%a002020@bHonestly, %a000090, you were asking for that.\n@c0@"
  ja: "@a@b%a002020「あそこで\n\tはい　なんて言ったら　そりゃ\n\tおこられるわよ　%a000090。\n@c0@"
  ko: "@a@b%a002020: 거기서\n네 하고 대답하면 그거야 당연히\n화내겠지, %a000090.\n@c0@"
  sl: "@a@b%a002020：这种时候点头称是，\n　　对方肯定会生气的啊，\n　　%a000090。\n@c0@"
  tl: "@a@b%a002020：這種時候點頭稱是，\n　　對方肯定會生氣的啊，\n　　%a000090。\n@c0@"
140:
  en: "@a%0%a002030@bUrgh. That little exchange could have gone better...\n@c0@"
  ja: "@a@b%a002030「いや……\n\tいくらなんでも　いまのは\n\tちょっと……。\n@c0@"
  ko: "@a@b%a002030: 저기......\n아무리 그래도 방금 건\n좀......\n@c0@"
  sl: "@a@b%a002030：哎呀……\n　　不管怎么说，\n　　刚才那实在有点……\n@c0@"
  tl: "@a@b%a002030：哎呀……\n　　不管怎麼說，\n　　剛才那實在有點……\n@c0@"
141:
  en: "@a%0%a002050@bYou're not afraid of chancin' your arm, are you, %a000090?\n@c0@"
