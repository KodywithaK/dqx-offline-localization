  tl: "@a@b%a002030：好像還\n　　不想放棄呢。\n　　真可憐……\n@c0@"
146:
  en: "@a%0%a002050@bProbably best we don't tell her we're the ones that rescued the mirror princess!\n@c0@"
  ja: "@a@b%a002050「あっ！　この人には\n\tカガミ姫を　助けたのは\n\t私たちだとは　言えないかも！\n@c0@"
  ko: "@a@b%a002050: 앗! 이 사람에게는\n거울 공주를 구한 게\n우리라고는 말 못 하겠네요!\n@c0@"
  sl: "@a@b%a002050：啊！救出明镜公主的\n　　其实是我们，这话我们\n　　对她说不出口啊！\n@c0@"
  tl: "@a@b%a002050：啊！救出明鏡公主的\n　　其實是我們，這話我們\n　　對她說不出口啊！\n@c0@"
