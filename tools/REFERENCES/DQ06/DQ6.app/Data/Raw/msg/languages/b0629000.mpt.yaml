  sl: "@a@b%a002050：如果把葡萄酒用来\n　　贿赂这个人的话，\n　　他会让我们进去吗？\n@c0@"
  tl: "@a@b%a002050：如果把葡萄酒用來\n　　賄賂這個人的話，\n　　他會讓我們進去嗎？\n@c0@"
390:
  en: "@a%0%a002040@bIt seems low-ranking soldiers can't just visit Blackmar as they please.\n@c0@"
  ja: "@a@b%a002040「下っぱの　兵士は\n\tアクバーに　会うことすら\n\tできない　ようだな。\n@c0@"
