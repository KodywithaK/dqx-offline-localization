  sl: "@a@b%a002040：只是基层的士兵，\n　　想要见到阿库巴看来\n　　也是不可能的事情。\n@c0@"
  tl: "@a@b%a002040：只是基層的士兵，\n　　想要見到阿庫巴看來\n　　也是不可能的事情。\n@c0@"
391:
