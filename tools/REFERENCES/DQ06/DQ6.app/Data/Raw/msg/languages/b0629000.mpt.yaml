  sl: "@a@b%a002060：葡萄酒……\n　　我没带着……\n@c0@"
  tl: "@a@b%a002060：葡萄酒……\n　　我沒帶著……\n@c0@"
392:
  en: "@a%0%a002070@bBoing! B-Boing!\n@c0@"
  ja: "@a@b%a002070「プル……！\n@c0@"
