  sl: "@a@b%a002010：简直喜欢到了\n　　连在工作中都会一直想着的程度。\n@c0@"
  tl: "@a@b%a002010：簡直喜歡到了\n　　連在工作中都會一直想著的程度。\n@c0@"
395:
  en: "@a%0%a002020@bOh, brother! I wish I could just throw him right off the side!\n@c0@"
