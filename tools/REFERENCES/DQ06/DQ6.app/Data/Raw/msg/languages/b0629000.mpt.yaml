  ko: "@a@b%a002000: 자기 부하도\n제대로 알아보지 못하는 녀석한테\n멍청하단 소릴 듣고 싶진 않군!\n@c0@"
  sl: "@a@b%a002000：连是不是自己的部下\n　　都不能好好看清楚的家伙，\n　　你没资格说俺们是笨蛋！\n@c0@"
  tl: "@a@b%a002000：連是不是自己的部下\n　　都不能好好看清楚的傢伙，\n　　你沒資格說俺們是笨蛋！\n@c0@"
385:
  en: "@a%0%a002000@bOh, I'm gonna enjoy watchin' him eat his words!\n@c0@"
  ja: "@a@b%a002000「ま　いいや。\n\t今日の　ところは\n\tおとなしく　しておくか。\n@c0@"
  ko: "@a@b%a002000: 뭐, 됐어.\n오늘은 이만\n얌전히 있자고.\n@c0@"
  sl: "@a@b%a002000：不过，也无所谓了。\n　　今天就还是稍微老实一点吧。\n@c0@"
  tl: "@a@b%a002000：不過，也無所謂了。\n　　今天就還是稍微老實一點吧。\n@c0@"
386:
  en: "@a%0%a002010@bArranging a meeting with an enemy like Blackmar was never going to be easy.\n@c0@"
  ja: "@a@b%a002010「さすがに　そう\n\tかんたんには　会わせて\n\tくれないでしょうね。\n@c0@"
  ko: "@a@b%a002010: 아무리 그래도\n그렇게 쉽게 만나게\n해 주지는 않을 거야.\n@c0@"
  sl: "@a@b%a002010：果然还是\n　　没那么容易就让我们见到的啊。\n@c0@"
  tl: "@a@b%a002010：果然還是\n　　沒那麼容易就讓我們見到的啊。\n@c0@"
387:
  en: "@a%0%a002020@bWine connoisseur, huh? I'd like to give him something to whine about...\n@c0@"
  ja: "@a@b%a002020「こいつ\n\tぶどう酒が　好きなんだって。\n\tだから　どうしたって　話だけど。\n@c0@"
  ko: "@a@b%a002020: 이 녀석\n포도주를 좋아한대.\n그게 뭐 어쨌다는 거람.\n@c0@"
  sl: "@a@b%a002020：这家伙说\n　　自己很喜欢葡萄酒，\n　　不过关我们什么事。\n@c0@"
  tl: "@a@b%a002020：這傢伙說\n　　自己很喜歡葡萄酒，\n　　不過關我們什麼事。\n@c0@"
388:
  en: "@a%0%a002030@bShould we cause any trouble, swarms of guards will be here in no time.\n@c0@"
  ja: "@a@b%a002030「もし　ここで\n\tひとあばれしたら　兵士が　おおぜい\n\t集まって　きちゃいますよね……。\n@c0@"
  ko: "@a@b%a002030: 만일 여기서\n한바탕 벌이면 병사들이\n몽땅 몰려 오겠지요......\n@c0@"
  sl: "@a@b%a002030：如果在这里引发\n　　大骚乱的话，会有许多的\n　　士兵聚集过来吧……\n@c0@"
  tl: "@a@b%a002030：如果在這裡引發\n　　大騷亂的話，會有許多的\n　　士兵聚集過來吧……\n@c0@"
389:
  en: "@a%0%a002050@bMaybe if we bribed him with some fine wine, he'd let us slip on through.\n@c0@"
