32:
  en: "@a@b*: Very well. The naming god has been appeased. Let us proceed with changing %a000180's name.\n@c0@"
  ja: "@a@b＊「よろしい。　では　%a000180の\n\t新しい名前を　教えてくれ。\n@c0@"
  ko: "@a@b*: 좋네. 그럼 %a000180의\n새 이름을 알려 주게나.\n@c0@"
  sl: "@a@b＊：好。那就把\n　　%a000180的新名字告诉我吧。\n@c0@"
  tl: "@a@b＊：好。那就把\n　　%a000180的新名字告訴我吧。\n@c0@"
33:
  en: "@a@b*: It looks like you're short of funds. You'll just have to put up with the name as it is for now, I'm afraid.\n@c0@"
  ja: "@a@b＊「ん？　残念ながら\n\tそのような大金は　ないようじゃな。\n\t今は　がまんするしかあるまい。\n@c0@"
  ko: "@a@b*: 응? 아쉽게도\n그런 큰돈은 없나 보군.\n지금은 참는 수밖에 없겠어.\n@c0@"
  sl: "@a@b＊：唔？很遗憾，\n　　你没有那么多钱。\n　　现在只能先忍忍了。\n@c0@"
  tl: "@a@b＊：唔？很遺憾，\n　　你沒有那麼多錢。\n　　現在只能先忍忍了。\n@c0@"
34:
  en: "@a@b*: Do you wish to suggest a different name?\n@c0@"
  ja: "@a@b＊「他の名前に　変えるか？\n@c0@"
  ko: "@a@b*: 다른 이름으로 바꾸겠나?\n@c0@"
  sl: "@a@b＊：还想改变其他的名字吗？\n@c0@"
  tl: "@a@b＊：還想改變其他的名字嗎？\n@c0@"
35:
  en: "@a@b*: Changed your mind? If you're satisfied with your names as they are, that is well and good.\n@c0@"
  ja: "@a@b＊「なんじゃ　名前を変えないのか？\n\tまあ　それも　よかろう。\n@c0@"
  ko: "@a@b*: 뭐야, 이름을 바꾸지 않겠다고?\n그것도 나쁘지 않지.\n@c0@"
  sl: "@a@b＊：不改变名字吗？\n　　那也无妨。\n@c0@"
  tl: "@a@b＊：不改變名字嗎？\n　　那也無妨。\n@c0@"
36:
  en: "@a@b*: How else can I serve you today?\n@c0@"
  ja: "@a@b＊「他に　誰か　名前を\n\t変えたい者は　おるか？\n@c0@"
  ko: "@a@b*: 그 밖에도 이름을\n바꾸고자 하는 자가 있는가?\n@c0@"
  sl: "@a@b＊：还想改变谁的名字？\n@c0@"
  tl: "@a@b＊：還想改變誰的名字？\n@c0@"
37:
  en: "@a@b*: I see. Well, if you ever wish to change anyone's name, I will be waiting here on behalf of the almighty naming god.\n@c0@"
  ja: "@a@b＊「そうか。　名前を変えたくなったら\n\tいつでも　来るがよいぞ。\n\t名前の護りが　あらんことを……。\n@c0@"
  ko: "@a@b*: 그렇군. 이름을 바꾸고 싶으면\n언제든 찾아오게나.\n이름의 가호가 함께하기를......\n@c0@"
  sl: "@a@b＊：是吗。想改变名字的话\n　　随时欢迎光临。\n　　愿神的守护与你们同在……\n@c0@"
  tl: "@a@b＊：是嗎。想改變名字的話\n　　隨時歡迎光臨。\n　　願神的守護與你們同在……\n@c0@"
38:
  en: "@a@b*: With the blessing of the almighty naming god, I'll restore %a000180's original name.\n@c0@"
  ja: "@a@b＊「よし。　では　%a000180の\n\t名前を　元に戻すぞ。\n@c0@"
  ko: "@a@b*: 좋네. 그럼 %a000180의\n이름을 원래대로 되돌리겠네.\n@c0@"
  sl: "@a@b＊：好的。那就让%a000180\n　　恢复到以前的名字了。\n@c0@"
  tl: "@a@b＊：好的。那就讓%a000180\n　　恢復到以前的名字了。\n@c0@"
