  ja: "@a@b＊「誰か　名前を変えるか？\n@c0@"
  ko: "@a@b*: 이름을 바꾸고자 하는 자가 있는가?\n@c0@"
  sl: "@a@b＊：想改变谁的名字？\n@c0@"
  tl: "@a@b＊：想改變誰的名字？\n@c0@"
3:
