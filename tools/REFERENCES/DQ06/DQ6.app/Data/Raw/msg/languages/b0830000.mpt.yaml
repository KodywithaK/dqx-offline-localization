0:
  en: "@a@b*: I am a humble servant of Appello, the almighty naming god.\n@c0@"
  ja: "@a@b＊「わしは　命名神マリナン様に\n\t仕える　神官じゃ。\n@c0@"
  ko: "@a@b*: 나는 이름의 신 마리난 님을\n모시는 신관일세.\n@c0@"
  sl: "@a@b＊：我是侍奉命名神玛里纳恩的神官。\n@c0@"
  tl: "@a@b＊：我是侍奉命名神瑪里納恩的神官。\n@c0@"
1:
  en: "@a@b*: If there are any among your party who wish to change their name, speak unto me now!\n@c0@"
  ja: "@a@b＊「おぬしたちの中で　今の名前を\n\t別のものに　変えたい者がおったら\n\tわしに　言うがよい。\n@c0@"
  ko: "@a@b*: 자네들 가운데 지금 가진 이름을\n바꾸고자 하는 자가 있다면\n내게 말해 주게나.\n@c0@"
  sl: "@a@b＊：你们当中\n　　如果有人想改变名字的话\n　　跟我说就好了。\n@c0@"
  tl: "@a@b＊：你們當中\n　　如果有人想改變名字的話\n　　跟我說就好了。\n@c0@"
2:
