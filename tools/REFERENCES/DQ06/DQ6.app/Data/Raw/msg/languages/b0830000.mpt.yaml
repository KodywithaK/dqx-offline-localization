  ja: "@a@b＊「%a000180の名前を変えるのじゃな。\n\tでは　新しい名前を　わしに\n\t教えてくれ。\n@c0@"
  ko: "@a@b*: %a000180의 이름을 바꾸는 게로군.\n그럼 새로운 이름을 내게\n알려 주게.\n@c0@"
  sl: "@a@b＊：要改变%a000180的名字啊。\n　　那就把新名字告诉我吧。\n@c0@"
  tl: "@a@b＊：要改變%a000180的名字啊。\n　　那就把新名字告訴我吧。\n@c0@"
4:
  en: "@a@b*: Curious. You wish to give your bag a name?\n@c0@"
  ja: "@a@b＊「むう　それは……　ふくろか？\n\tはっはっは　よいじゃろう。\n@c0@"
