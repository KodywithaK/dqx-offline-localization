64:
  en: "@a@b*: My, my! Is that the flying carpet in your possession?\n@c0@"
  ja: "@a@b＊「おや　魔法のじゅうたんを\n\t持っているのかい。\n@c0@"
  ko: "@a@b*: 오, 마법의 융단을\n가지고 있나?\n@c0@"
  sl: "@a@b＊：哎呀！你们拿着的\n　　不正是魔法绒毯吗？\n@c0@"
  tl: "@a@b＊：哎呀！你們拿著的\n　　不正是魔法絨毯嗎？\n@c0@"
65:
  en: "@a@b*: Hmm... Looks like its get-up-and-go got up and went. The magic's been sucked right out of it.\n@c0@"
  ja: "@a@b＊「でも　今は　飛ぶチカラを\n\tうしなっているようだね。\n@c0@"
  ko: "@a@b*: 하지만 지금은 하늘을 나는 힘을\n잃은 것 같군.\n@c0@"
  sl: "@a@b＊：不过，它似乎\n　　失去了飞行的能力。\n@c0@"
  tl: "@a@b＊：不過，它似乎\n　　失去了飛行的能力。\n@c0@"
66:
  en: "@a@b*: You know, that carpet was crafted by the Sorens, the old couple that live here in town.\n@c0@"
  ja: "@a@b＊「それは　もともと　この町の\n\tカルベ老夫婦が　作ったもの。\n@c0@"
  ko: "@a@b*: 그건 원래 이 마을의\n칼베 노부부가 만든 물건이지.\n@c0@"
  sl: "@a@b＊：这件物品是由镇上的\n　　卡尔贝老夫妇制作的。\n@c0@"
  tl: "@a@b＊：這件物品是由鎮上的\n　　卡爾貝老夫婦製作的。\n@c0@"
67:
  en: "@a@b*: I bet they could infuse some spirit into that old rug again for you, just so.\n@c0@"
  ja: "@a@b＊「あの　ふたりなら　きっと\n\tじゅうたんに　たましいを\n\t吹き込んでくれるよ。\n@c0@"
  ko: "@a@b*: 그 두 사람이라면 아마\n융단에 영혼을\n불어넣어 줄 거야.\n@c0@"
  sl: "@a@b＊：两位老人一定\n　　能够为绒毯\n　　重新灌入灵魂的。\n@c0@"
  tl: "@a@b＊：兩位老人一定\n　　能夠為絨毯\n　　重新灌入靈魂的。\n@c0@"
68:
  en: "@a@b*: It brings joy to my heart to see you here.\n@c0@"
  ja: "@a@b＊「ようこそ　おいでくださいました。\n@c0@"
  ko: "@a@b*: 어서 오십시오.\n@c0@"
  sl: "@a@b＊：欢迎大家的到来。\n@c0@"
  tl: "@a@b＊：歡迎大家的到來。\n@c0@"
69:
  en: "@a@b*: Isnomor, our town's Eldress, lives in a house on the water. Use the staircase just ahead to make your way over there.\n@c0@"
  ja: "@a@b＊「この町の長老　ブボールさまは\n\tそこの階段を　おりた先にある\n\t湖のお屋敷に　おわします。\n@c0@"
  ko: "@a@b*: 이 마을의 장로이신 부볼 님은\n거기 보이는 계단을 통해 갈 수\n있는 호수의 저택에 계십니다.\n@c0@"
  sl: "@a@b＊：长老布泊尔就住在\n　　湖中间的屋子里。\n　　从那边的楼梯下去就能到了。\n@c0@"
  tl: "@a@b＊：長老布泊爾就住在\n　　湖中間的屋子裡。\n　　從那邊的樓梯下去就能到了。\n@c0@"
70:
  en: "@a@b*: We Sorcerians have the power to detach our souls from our physical forms.\n@c0@"
  ja: "@a@b＊「私たちは　肉体から　精神を\n\tときはなつことが　できます。\n@c0@"
  ko: "@a@b*: 우리는 육체에서 정신을\n분리시킬 수 있습니다.\n@c0@"
  sl: "@a@b＊：我们可以将精神\n　　从肉体中解放出来。\n@c0@"
  tl: "@a@b＊：我們可以將精神\n　　從肉體中解放出來。\n@c0@"
71:
  en: "@a@b*: If we're blessed with enough magical might, we can even transform our bodies.\n@c0@"
  ja: "@a@b＊「それぞれが持つ　魔法力にも\n\tよりますが　その肉体を　別のものに\n\t変身させることも　できるのです。\n@c0@"
  ko: "@a@b*: 각자 지닌 마력에 따라\n다르지만, 그 육체를 다른 존재로\n변신시킬 수도 있지요.\n@c0@"
  sl: "@a@b＊：根据各自所拥有的\n　　魔法力的不同，\n　　我们还能将肉体变成其他形态。\n@c0@"
  tl: "@a@b＊：根據各自所擁有的\n　　魔法力的不同，\n　　我們還能將肉體變成其他形態。\n@c0@"
72:
  en: "@a@b*: %0%a002020 the Acolyte has the blood of Sorceress Ashmerelda coursing through her veins. I bet she could turn into anything... Even a dragon!\n@c0@"
  ja: "@a@b＊「偉大なる大魔女　バーバレラの\n\t血を引く　%a002020さまなら\n\tきっと　ドラゴンにでも……。\n@c0@"
  ko: "@a@b*: 위대한 대마녀 바바렐라의\n피를 이어받은 %a002020 님이라면\n틀림없이 드래곤으로도......\n@c0@"
  sl: "@a@b＊：身为伟大的大魔女芭芭蕾拉大人的\n　　继承人，%a002020大人\n　　一定可以变身成龙的形态……\n@c0@"
  tl: "@a@b＊：身為偉大的大魔女芭芭蕾拉大人的\n　　繼承人，%a002020大人\n　　一定可以變身成龍的形態……\n@c0@"
73:
  en: "@a%0%a002020@bHuh? I'm related to this Sorceress? What's going on here? Like, is this really my hometown?\n@c0@"
  ja: "@a@b%a002020「え？　あたしが　大魔女の血を？\n\tそれに　この町が　あたしの\n\tふるさとだなんて……\n@c0@"
  ko: "@a@b%a002020: 응? 내가 대마녀의 피를?\n게다가 이 마을이 내\n고향이라니......\n@c0@"
  sl: "@a@b%a002020：诶？我是大魔女的继承人？\n　　还说什么这里是我的故乡……\n@c0@"
  tl: "@a@b%a002020：誒？我是大魔女的繼承人？\n　　還說什麼這裡是我的故鄉……\n@c0@"
74:
  en: "@a@b*: I am sure this must all be terribly confusing to you. Being robbed of one's memories is a most cruel thing.\n@c0@"
  ja: "@a@b＊「とまどわれるのも　当然です。\n\tきおくを　なくして\n\tいらっしゃるのですから。\n@c0@"
  ko: "@a@b*: 그렇게 생각하시는 게 당연합니다.\n기억을 잃으신\n상태니까요.\n@c0@"
  sl: "@a@b＊：感到困惑也是正常的。\n　　毕竟您的记忆还没有恢复。\n@c0@"
  tl: "@a@b＊：感到困惑也是正常的。\n　　畢竟您的記憶還沒有恢復。\n@c0@"
75:
  en: "@a@b*: But the blood of Ashmerelda flows within you. I am certain it shall assert itself over time.\n@c0@"
  ja: "@a@b＊「でも　%a002020さまの　たましいに宿る\n\tバーバレラの血が　少しずつ\n\t目覚めさせて　くださるはず。\n@c0@"
  ko: "@a@b*: 하지만 %a002020 님의 영혼에 깃든\n바바렐라의 피가 서서히\n각성을 도와줄 터.\n@c0@"
  sl: "@a@b＊：但是，流淌在%a002020大人\n　　身体中的芭芭蕾拉的血，\n　　一定会慢慢苏醒的。\n@c0@"
  tl: "@a@b＊：但是，流淌在%a002020大人\n　　身體中的芭芭蕾拉的血，\n　　一定會慢慢甦醒的。\n@c0@"
76:
  en: "@a@b*: All you can do is keep up your training. You must remain strong, %a002020.\n@c0@"
  ja: "@a@b＊「どうか　あせらず　修業を\n\tおつづけください。\n@c0@"
  ko: "@a@b*: 부디 초조해 말고\n수련을 계속하십시오.\n@c0@"
  sl: "@a@b＊：请您务必不要焦躁，\n　　继续努力地修炼。\n@c0@"
  tl: "@a@b＊：請您務必不要焦躁，\n　　繼續努力地修煉。\n@c0@"
77:
  en: "@a@b*: My entire inventory of weapons has been instilled with the arcane forces of magic.\n@c0@"
  ja: "@a@b＊「ここで売っている武器には　全て\n\t魔法のチカラを　吹き込んである。\n@c0@"
  ko: "@a@b*: 여기서 파는 무기에는 모두\n마법의 힘이 깃들어 있지.\n@c0@"
  sl: "@a@b＊：这里卖的武器中\n　　全都灌入了魔法的力量。\n@c0@"
  tl: "@a@b＊：這裡賣的武器中\n　　全都灌入了魔法的力量。\n@c0@"
78:
  en: "@a@b*: They are like pearls before slimes to the brutish warrior. You should find more inventive ways to wield them.\n@c0@"
  ja: "@a@b＊「ただ　ふりまわすのではなく\n\tときには　工夫して\n\tつかってみると　いいだろう。\n@c0@"
  ko: "@a@b*: 그저 휘두르기만 할 게 아니라\n때로는 전략적으로\n사용해 보는 것도 좋을 거다.\n@c0@"
  sl: "@a@b＊：不要只是用它们来攻击，\n　　时不时地动动脑筋\n　　使用一下看看如何？\n@c0@"
  tl: "@a@b＊：不要只是用它們來攻擊，\n　　時不時地動動腦筋\n　　使用一下看看如何？\n@c0@"
79:
  en: "@a@b*: The equipment in this shop was forged by the Sorens themselves for the benefit of the Acolyte.\n@c0@"
  ja: "@a@b＊「この店にある　%a002020さまのための\n\t防具は　みな　カルベ老夫婦によって\n\t作られた物です。\n@c0@"
  ko: "@a@b*: 이 가게에 있는 %a002020 님을 위한\n방어구는 모두 칼베 노부부가\n만드신 물건입니다.\n@c0@"
  sl: "@a@b＊：店里这些为%a002020大人\n　　专门准备的防具，\n　　全都出自卡尔贝老夫妇之手。\n@c0@"
  tl: "@a@b＊：店裡這些為%a002020大人\n　　專門準備的防具，\n　　全都出自卡爾貝老夫婦之手。\n@c0@"
80:
  en: "@a@b*: Sorceress Ashmerelda was the creator of Magic Burst, the most powerful of all spells.\n@c0@"
  ja: "@a@b＊「大魔女バーバレラさまは\n\t究極の呪文　マダンテを\n\t編み出された。\n@c0@"
  ko: "@a@b*: 대마녀 바바렐라 님은\n궁극의 주문 마단테를\n창조해 내셨다네.\n@c0@"
  sl: "@a@b＊：大魔女芭芭蕾拉大人\n　　开发出了终极的咒文\n　　玛达恩特。\n@c0@"
  tl: "@a@b＊：大魔女芭芭蕾拉大人\n　　開發出了終極的咒文\n　　瑪達恩特。\n@c0@"
81:
  en: "@a@b*: The magic is so vast in its power, however, that few can fully wield it.\n@c0@"
  ja: "@a@b＊「じゃが　あまりにも　強大すぎて\n\t使いこなせた者は\n\tほとんど　おらなんだ。\n@c0@"
  ko: "@a@b*: 허나 너무나 강력한 탓에\n제대로 사용할 수 있는 자는\n거의 존재하지 않아.\n@c0@"
  sl: "@a@b＊：可是，那咒文\n　　实在是太过强大，\n　　只有少数人能将它运用自如。\n@c0@"
  tl: "@a@b＊：可是，那咒文\n　　實在是太過強大，\n　　只有少數人能將它運用自如。\n@c0@"
82:
  en: "@a@b*: The only one remaining who has mastered it is Isnomor, our town's Eldress.\n@c0@"
  ja: "@a@b＊「今では　長老ブボールさまだけが\n\tマダンテを　受け継ぐ\n\tただひとりの　おかたなのじゃよ。\n@c0@"
  ko: "@a@b*: 지금은 장로 부볼 님이\n마단테를 전수받은\n유일한 분이라네.\n@c0@"
  sl: "@a@b＊：现如今，能够掌握玛达恩特的人\n　　就只剩下布泊尔长老自己了。\n@c0@"
  tl: "@a@b＊：現如今，能夠掌握瑪達恩特的人\n　　就只剩下布泊爾長老自己了。\n@c0@"
83:
  en: "@a@b*: There is nary a soul in Sorceria who cannot cast magic.\n@c0@"
  ja: "@a@b＊「ここは　魔法を　あやつれる者のみが\n\t暮らす町　カルベローナです。\n@c0@"
  ko: "@a@b*: 이곳은 마법을 사용할 줄 아는 자만이\n살고 있는 마을 칼베로나입니다.\n@c0@"
  sl: "@a@b＊：这里是卡尔贝罗纳，\n　　镇上住的人全都会用魔法。\n@c0@"
  tl: "@a@b＊：這裡是卡爾貝羅納，\n　　鎮上住的人全都會用魔法。\n@c0@"
84:
  en: "@a@b*: Allow me to show you. ...Frizzle!\n@c0@"
  ja: "@a@b＊「それ　メラミ……っと。\n@c0@"
  ko: "@a@b*: 어디 보자, 메라미......\n@c0@"
  sl: "@a@b＊：比如，这是美拉米……\n@c0@"
  tl: "@a@b＊：比如，這是美拉米……\n@c0@"
85:
  en: "@a@b*: Oh my! Hot, hot, hot!\n@c0@"
  ja: "@a@b＊「うわっ！　あぢぢーーっ！！\n@c0@"
  ko: "@a@b*: 으악! 뜨거워~~!!\n@c0@"
  sl: "@a@b＊：啊呀！好烫好烫！！\n@c0@"
  tl: "@a@b＊：啊呀！好燙好燙！！\n@c0@"
86:
  en: "@a@b*: Ah, how long we have awaited %a002020 the Acolyte's return...\n@c0@"
  ja: "@a@b＊「われわれは　%a002020さまが\n\tもどられる日を　どれだけ\n\t待ちわびたことか。\n@c0@"
  ko: "@a@b*: 우리는 %a002020 님이\n돌아오시는 날을 얼마나\n학수고대했는지.\n@c0@"
  sl: "@a@b＊：大家一直都在翘首等待着\n　　%a002020大人的归来。\n@c0@"
  tl: "@a@b＊：大家一直都在翹首等待著\n　　%a002020大人的歸來。\n@c0@"
87:
  en: "@a@b*: It has taken what seemed like an eternity for our next leader to enter this world and reach maturity.\n@c0@"
  ja: "@a@b＊「長老の　後継ぎとなる\n\t%a002020さまが　生まれ　そして\n\t成長するまでの　長い長い時間。\n@c0@"
  ko: "@a@b*: 장로님의 후계자가 될\n%a002020 님이 태어난 후\n성장하시기까지의 기나긴 시간.\n@c0@"
  sl: "@a@b＊：%a002020大人命中注定\n　　将要成为长老的继承人，\n　　但却需要很长很长的时间去成长。\n@c0@"
  tl: "@a@b＊：%a002020大人命中註定\n　　將要成為長老的繼承人，\n　　但卻需要很長很長的時間去成長。\n@c0@"
88:
  en: "@a@b*: Alas, the Eldress's spirit is in a weakened state. We have erected a magical barrier around her for her own protection.\n@c0@"
  ja: "@a@b＊「たましいのチカラが　弱まった長老を\n\tお護りするため　長老のまわりに\n\t結界を　はっていたのです。\n@c0@"
  ko: "@a@b*: 영혼의 힘이 약해진 장로님을\n지켜 드리기 위해 장로님 주변에\n결계를 쳤던 겁니다.\n@c0@"
  sl: "@a@b＊：长老的精神力量正不断减弱，\n　　为了保护长老，\n　　我们只好在她的周围张开了结界。\n@c0@"
  tl: "@a@b＊：長老的精神力量正不斷減弱，\n　　為了保護長老，\n　　我們只好在她的周圍張開了結界。\n@c0@"
89:
  en: "@a@b*: The sparkling sands by the entrance are known as ‘sands of time’. They were put there to protect the Eldress from intruders.\n@c0@"
  ja: "@a@b＊「お屋敷の入口の　キラキラした砂は\n\t時の砂といって　しんにゅう者から\n\t長老さまを　守るために作られたもの。\n@c0@"
  ko: "@a@b*: 저택 입구의 반짝이는 모래는\n시간의 모래라는 것으로, 침입자로부터\n장로님을 지키기 위해 만들어졌습니다.\n@c0@"
  sl: "@a@b＊：屋子入口处闪闪发光的沙子就是时之沙，\n　　当时制作它的目的，\n　　是为了保护长老不被入侵者打扰。\n@c0@"
  tl: "@a@b＊：屋子入口處閃閃發光的沙子就是時之沙，\n　　當時製作它的目的，\n　　是為了保護長老不被入侵者打擾。\n@c0@"
90:
  en: "@a@b*: You would need a sand urn to scoop up the temporal grains and enter the house proper, you see.\n@c0@"
  ja: "@a@b＊「しかし　砂の器を使って\n\t時の砂を　すいこめば\n\t屋敷の中に　入ることができるのです。\n@c0@"
  ko: "@a@b*: 하지만 모래 그릇을 사용해서\n시간의 모래를 빨아들이면\n저택 안으로 들어갈 수 있지요.\n@c0@"
  sl: "@a@b＊：不过，只要使用沙之器\n　　把时之沙全都吸进去的话，\n　　大家就可以进入屋里了。\n@c0@"
  tl: "@a@b＊：不過，只要使用沙之器\n　　把時之沙全都吸進去的話，\n　　大家就可以進入屋裡了。\n@c0@"
91:
  en: "@a@b*: But from what I hear, our urn was sequestered to the briny depths when our town was sealed away...\n@c0@"
  ja: "@a@b＊「しかし　この町が封印されたときに\n\t砂の器も　海底深くに\n\t沈められたと　聞いています。\n@c0@"
  ko: "@a@b*: 그런데 이 마을이 봉인되었을 때\n모래 그릇 역시 바다 깊은 곳으로\n가라앉았다고 들었습니다.\n@c0@"
  sl: "@a@b＊：只是我听说当初镇子\n　　被封印的时候，\n　　沙之器也被沉到了大海深处。\n@c0@"
  tl: "@a@b＊：只是我聽說當初鎮子\n　　被封印的時候，\n　　沙之器也被沉到了大海深處。\n@c0@"
92:
  en: "@a@b*: Where could it be now? None can say.\n@c0@"
  ja: "@a@b＊「ああ　砂の器は　いったい\n\tどこに……。\n@c0@"
  ko: "@a@b*: 아아, 모래 그릇은 대체\n어디에......\n@c0@"
  sl: "@a@b＊：唉，沙之器\n　　到底在哪里啊……\n@c0@"
  tl: "@a@b＊：唉，沙之器\n　　到底在哪裡啊……\n@c0@"
93:
  en: "@a@b*: To be frank, losing the sand urn has put all of Sorceria in something of a bind.\n@c0@"
  ja: "@a@b＊「砂の器が　うばわれて\n\tわたくしたちも\n\tこまっておりました。\n@c0@"
