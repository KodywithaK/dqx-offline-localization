0:
  en: "@a@bWell met! You are welcome at the court of Poseidon, ruler of the deep.\n@c0@"
  ja: "@a@b＊「よくぞ　来た！\n\tわしは　海の王　ポセイドンじゃ。\n@c0@"
  ko: "@a@b*: 어서 오게!\n나는 바다의 왕 포세이돈이라네.\n@c0@"
  sl: "@a@b＊：欢迎你们！\n　　我是海王波塞冬。\n@c0@"
  tl: "@a@b＊：歡迎你們！\n　　我是海王波塞冬。\n@c0@"
1:
  en: "@aKing Poseidon@bWith that miserable miscreant Gracos out of the picture, the ocean is a much more pleasant place.\n@c0@"
  ja: "@a@b＊「そなたたちが　グラコスを\n\t倒してくれたおかげで　海の中も\n\tだいぶ　落ち着いてきたわい。\n@c0@"
  ko: "@a@b*: 그대들이 그라코스를\n해치운 덕분에 바닷속도\n점점 안정을 되찾고 있다네.\n@c0@"
  sl: "@a@b＊：多亏你们打倒了古拉柯斯，\n　　大海也终于变得平静了。\n@c0@"
  tl: "@a@b＊：多虧你們打倒了古拉柯斯，\n　　大海也終於變得平靜了。\n@c0@"
2:
  en: "@aKing Poseidon@bI thank you for your efforts. Now, I promised to share a secret with you, and so I shall...\n@c0@"
  ja: "@a@b＊「その礼といっては　なんだが\n\tいいことを　教えようぞ。\n@c0@"
  ko: "@a@b*: 그 보답이라고 하긴 뭐하네만,\n좋은 정보를 알려 주겠네.\n@c0@"
  sl: "@a@b＊：作为回礼，我就告诉你们\n　　一些有用的事情吧。\n@c0@"
  tl: "@a@b＊：作為回禮，我就告訴你們\n　　一些有用的事情吧。\n@c0@"
3:
  en: "@aKing Poseidon@bThis secret concerns a legendary shield...\n@c0@"
  ja: "@a@b＊「これは　伝説の盾にまつわる\n\t言い伝えの　ひとつじゃ。\n@c0@"
  ko: "@a@b*: 이것은 전설의 방패에 대해\n전해 내려오는 이야기 중 하나라네.\n@c0@"
  sl: "@a@b＊：这是一个关于\n　　传说中的盾牌的传说。\n@c0@"
  tl: "@a@b＊：這是一個關於\n　　傳說中的盾牌的傳說。\n@c0@"
4:
  en: "@aKing Poseidon@b‘In the small room of repetition, the true path forward lies at three levels down and two levels up.’\n@c0@"
  ja: "@a@b＊「まよいの小部屋は\n\t下に３階　上に２階。\n\tさすれば　道が　ひらけよう。\n@c0@"
  ko: "@a@b*: 방황하는 작은 방은\n아래로 3층, 위로 2층.\n그러면 길이 열리리라.\n@c0@"
  sl: "@a@b＊：迷幻小屋的正确走法为\n　　向下３层，向上２层。\n　　完成的话道路就会打开了。\n@c0@"
  tl: "@a@b＊：迷幻小屋的正確走法為\n　　向下３層，向上２層。\n　　完成的話道路就會打開了。\n@c0@"
5:
  en: "@aKing Poseidon@bSo? Does that sound useful to you? I have heard that there are three such secrets in total.\n@c0@"
  ja: "@a@b＊「どうじゃ？　役に立ちそうか？\n\tわしの知るかぎり　言い伝えは\n\t全部で　３つある。\n@c0@"
  ko: "@a@b*: 어떤가? 도움이 될 것 같나?\n내가 알기로 그런 전설은\n총 3가지가 있다네.\n@c0@"
  sl: "@a@b＊：如何？有用吧？\n　　据我所知，\n　　这样的传说一共有三个。\n@c0@"
  tl: "@a@b＊：如何？有用吧？\n　　據我所知，\n　　這樣的傳說一共有三個。\n@c0@"
6:
  en: "@aKing Poseidon@bI am afraid I only know that one, but I'm sure if you travel the world, you'll hear the others too.\n@c0@"
  ja: "@a@b＊「わしは　この１つしか知らんが\n\t世界中を　くまなく　まわれば\n\t全ての言い伝えが　集まるはずじゃ。\n@c0@"
  ko: "@a@b*: 나는 그중 하나밖에 모르네만,\n전 세계를 구석구석 돌다 보면\n모든 전설이 모일 게야.\n@c0@"
  sl: "@a@b＊：我只知道这一个，\n　　但是如果你们走遍整个世界，\n　　应该可以收集到全部的传说吧。\n@c0@"
  tl: "@a@b＊：我只知道這一個，\n　　但是如果你們走遍整個世界，\n　　應該可以收集到全部的傳說吧。\n@c0@"
7:
  en: "@aKing Poseidon@bI wish you brave souls much luck on your quest!\n@c0@"
  ja: "@a@b＊「そなたたちの　これからの\n\t活躍に　期待しておるぞ。\n@c0@"
  ko: "@a@b*: 앞으로 그대들의\n활약을 기대하겠네.\n@c0@"
  sl: "@a@b＊：我很期待你们今后的表现。\n@c0@"
  tl: "@a@b＊：我很期待你們今後的表現。\n@c0@"
8:
  en: "@a@b*: I hear that evil sea fiend has suffered his defeat.\n㈡\n*: In terms of bashing baddies, you people can't be beat!\n@c0@"
  ja: "@a@b＊「海の悪魔を　やっつけてくれて\n\tありがとう。\n@c0@"
  ko: "@a@b*: 바다의 악마를 해치워 줘서\n고마워.\n@c0@"
  sl: "@a@b＊：谢谢你们杀死了海里的恶魔。\n@c0@"
  tl: "@a@b＊：謝謝你們殺死了海裡的惡魔。\n@c0@"
9:
  en: "@a@b*: The seabed sadly slithers still with foes we mermaids fear.\n㈡\n*: And that's why I've decided — I'm staying right here!\n@c0@"
  ja: "@a@b＊「でも　海の底には　私たちにも\n\t知らないことが　まだまだ\n\tいっぱい　あるの。\n@c0@"
  ko: "@a@b*: 하지만 바닷속에는 우리도\n모르는 일이 아직\n많이 있어.\n@c0@"
  sl: "@a@b＊：不过，海底还有很多\n　　连我们都不知道的事情。\n@c0@"
  tl: "@a@b＊：不過，海底還有很多\n　　連我們都不知道的事情。\n@c0@"
10:
  en: "@a@b*: On behalf of mermaidkind, I wish you all the best.\n㈡\n*: %H0860%XYou truly are a hero%YEach one of you's a hero%Z, so good luck on your quest!\n@c0@"
  ja: "@a@b＊「気をつけて　旅をつづけてね。\n@c0@"
  ko: "@a@b*: 조심해서 여행하도록 해.\n@c0@"
  sl: "@a@b＊：你们今后也要小心哦。\n@c0@"
  tl: "@a@b＊：你們今後也要小心哦。\n@c0@"
11:
  en: "@a@b*: Welcome, honoured %H0860%Xvisitor%Yvisitors%Z, to Sorceria. As we like to say, ‘This is where the magic happens!’\n@c0@"
  ja: "@a@b＊「魔法都市　カルベローナへ\n\tようこそ。\n@c0@"
  ko: "@a@b*: 마법 도시 칼베로나에\n오신 걸 환영해요.\n@c0@"
  sl: "@a@b＊：欢迎来到魔法都市\n　　卡尔贝罗纳。\n@c0@"
  tl: "@a@b＊：歡迎來到魔法都市\n　　卡爾貝羅納。\n@c0@"
12:
  en: "@a@b*: Our homeland is finally free, now that you've defeated the Dread Fiend of Seabed Shrine.\n@c0@"
  ja: "@a@b＊「あなたがたが　海底神殿の魔王を\n\tほろぼして　くださったおかげで\n\t封印から　解放されました。\n@c0@"
  ko: "@a@b*: 여러분이 해저 신전의 마왕을\n해치워 주신 덕분에\n봉인에서 풀려나게 되었습니다.\n@c0@"
  sl: "@a@b＊：多亏你们消灭了\n　　海底神殿的魔王，\n　　这里的封印也被解除了。\n@c0@"
  tl: "@a@b＊：多虧你們消滅了\n　　海底神殿的魔王，\n　　這裡的封印也被解除了。\n@c0@"
13:
  en: "@a@b*: Ah, how long we Sorcerians have awaited your arrival! Too long!\n@c0@"
  ja: "@a@b＊「わたしたち　カルベローナの民は\n\tみなさまが　いらっしゃるのを\n\tずっと　お待ちしていたのです。\n@c0@"
  ko: "@a@b*: 우리 칼베로나 사람들은\n여러분이 오시기를\n줄곧 기다리고 있었어요.\n@c0@"
  sl: "@a@b＊：我们这些卡尔贝罗纳的子民\n　　一直在等待着你们的到来。\n@c0@"
  tl: "@a@b＊：我們這些卡爾貝羅納的子民\n　　一直在等待著你們的到來。\n@c0@"
14:
  en: "@a@b*: Welcome, honoured %H0860%Xvisitor%Yvisitors%Z, to Sorceria. As we like to say, ‘This is where the magic happens!’\n@c0@"
  ja: "@a@b＊「魔法都市　カルベローナへ\n\tようこそ。\n@c0@"
  ko: "@a@b*: 마법 도시 칼베로나에\n오신 걸 환영해요.\n@c0@"
  sl: "@a@b＊：欢迎来到魔法都市\n　　卡尔贝罗纳。\n@c0@"
  tl: "@a@b＊：歡迎來到魔法都市\n　　卡爾貝羅納。\n@c0@"
15:
  en: "@a@b*: Our homeland was created long ago by the great Sorceress Ashmerelda.\n@c0@"
  ja: "@a@b＊「この町は　はるか昔\n\t偉大なる大魔女　バーバレラさまが\n\tおつくりになりました。\n@c0@"
  ko: "@a@b*: 이 마을은 먼 옛날\n위대한 대마녀 바바렐라 님이\n만드신 곳이랍니다.\n@c0@"
  sl: "@a@b＊：这座城镇是很久很久以前\n　　由伟大的大魔女\n　　芭芭蕾拉大人建立的。\n@c0@"
  tl: "@a@b＊：這座城鎮是很久很久以前\n　　由偉大的大魔女\n　　芭芭蕾拉大人建立的。\n@c0@"
16:
  en: "@a@b*: It is a wonderful thing to see you here. Quite wonderful.\n@c0@"
  ja: "@a@b＊「よくぞ　おいでになられました。\n@c0@"
  ko: "@a@b*: 어서 오십시오.\n@c0@"
  sl: "@a@b＊：衷心欢迎大家的到来。\n@c0@"
  tl: "@a@b＊：衷心歡迎大家的到來。\n@c0@"
17:
  en: "@a@b*: We weren't entirely idle during our long imprisonment, you know. Our minds were ever observant, constantly watching over the world.\n@c0@"
  ja: "@a@b＊「われわれは　封印されている時でも\n\t心の目で　世界を　見渡して\n\tおりました。\n@c0@"
  ko: "@a@b*: 저희는 봉인되어 있었을 때도\n마음의 눈으로 세계를 둘러보고\n있었습니다.\n@c0@"
  sl: "@a@b＊：我们即使在被封印的时候，\n　　依然用心眼观察着整个世界。\n@c0@"
  tl: "@a@b＊：我們即使在被封印的時候，\n　　依然用心眼觀察著整個世界。\n@c0@"
18:
  en: "@a@b*: Yes, we even watched %a002020 the Acolyte grow into a fine young woman.\n@c0@"
  ja: "@a@b＊「また　%a002020さまの　成長も\n\t祈る思いで　見守っていたのです。\n@c0@"
  ko: "@a@b*: 또 %a002020 님의 성장을\n기도하는 마음으로 지켜보고 있었지요.\n@c0@"
  sl: "@a@b＊：大家一边期待着%a002020大人的\n　　成长，一边守护着她。\n@c0@"
  tl: "@a@b＊：大家一邊期待著%a002020大人的\n　　成長，一邊守護著她。\n@c0@"
19:
  en: "@a@b*: Just so! This is the Acolyte's place of birth...\n@c0@"
  ja: "@a@b＊「そう　ここは　%a002020さまの\n\tふるさと……。\n@c0@"
  ko: "@a@b*: 그렇습니다. 이곳은 %a002020 님의\n고향......\n@c0@"
  sl: "@a@b＊：没错，这里就是\n　　%a002020大人的故乡……\n@c0@"
  tl: "@a@b＊：沒錯，這裡就是\n　　%a002020大人的故鄉……\n@c0@"
20:
  en: "@a@b*: And her magical strength was quite mighty enough to deflect the Dread Fiend's binding seal.\n@c0@"
  ja: "@a@b＊「かつて　魔王が　この町を\n\t封じようとしたとき　%a002020さまの\n\t魔法力は　大きく反発した……\n@c0@"
  ko: "@a@b*: 과거에 마왕이 이 마을을\n봉인하려 했을 때, %a002020 님의\n마력은 크게 반발하였고......\n@c0@"
  sl: "@a@b＊：当魔王想要封印这座城镇的时候，\n　　%a002020大人的魔法力\n　　发起了全力的反击……\n@c0@"
  tl: "@a@b＊：當魔王想要封印這座城鎮的時候，\n　　%a002020大人的魔法力\n　　發起了全力的反擊……\n@c0@"
21:
  en: "@a@b*: That is why the Acolyte's mind was not locked away like ours. \n@c0@"
  ja: "@a@b＊「そのため　%a002020さまの心は\n\tわれわれのように　封印されず\n\t逃れることが　できたのです。\n@c0@"
  ko: "@a@b*: 그 때문에 %a002020 님의 마음은\n저희들처럼 봉인되지 않고\n도망칠 수가 있었지요.\n@c0@"
  sl: "@a@b＊：因此，%a002020大人的内心\n　　并没有像我们一样被封印起来，\n　　而是逃了出去。\n@c0@"
  tl: "@a@b＊：因此，%a002020大人的內心\n　　並沒有像我們一樣被封印起來，\n　　而是逃了出去。\n@c0@"
22:
  en: "@a@b*: But at what cost...? It was the brute force of that magical clash that likely brought about %a002020's amnesia.\n@c0@"
  ja: "@a@b＊「ただ　あまりに　大きなチカラが\n\tほとばしったために　きおくを\n\tなくしてしまわれたのでしょう。\n@c0@"
  ko: "@a@b*: 다만, 너무나 큰 힘이\n빠져나간 탓에 기억을\n잃으시고 만 겁니다.\n@c0@"
  sl: "@a@b＊：只是，由于迸发的\n　　力量太过强大，\n　　她也因此失去了记忆。\n@c0@"
  tl: "@a@b＊：只是，由於迸發的\n　　力量太過強大，\n　　她也因此失去了記憶。\n@c0@"
23:
  en: "@a%0%a002020@b...Huh?\n@c0@"
  ja: "@a@b%a002020「？？？？\n@c0@"
  ko: "@a@b%a002020: ????\n@c0@"
  sl: "@a@b%a002020：嗯？\n@c0@"
  tl: "@a@b%a002020：嗯？\n@c0@"
24:
  en: "@a@b*: That despicable Dread Fiend has wrought doom and gloom on Sorceria more than once, you know.\n@c0@"
  ja: "@a@b＊「カルベローナは　魔王によって\n\t２度　滅ぼされたと\n\tいっても　よいでしょう。\n@c0@"
  ko: "@a@b*: 칼베로나는 마왕으로 인해\n두 번 멸망한 것이나\n다름없습니다.\n@c0@"
  sl: "@a@b＊：卡尔贝罗纳可以说是\n　　被魔王毁灭了两次。\n@c0@"
  tl: "@a@b＊：卡爾貝羅納可以說是\n　　被魔王毀滅了兩次。\n@c0@"
25:
  en: "@a@b*: Calamity first called when a rain of fire wiped our town from the face of the real world.\n@c0@"
  ja: "@a@b＊「１回目は　現実の世界で\n\t町ごと　死の炎で\n\t焼きつくされました。\n@c0@"
  ko: "@a@b*: 처음에는 현실 세계에서\n타오르는 죽음의 화염이\n마을을 통째로 집어삼켜 버렸지요.\n@c0@"
  sl: "@a@b＊：第一次是在现实世界，\n　　整个镇子被死亡的火焰\n　　烧得一干二净。\n@c0@"
  tl: "@a@b＊：第一次是在現實世界，\n　　整個鎮子被死亡的火焰\n　　燒得一乾二淨。\n@c0@"
26:
  en: "@a@b*: Thus we escaped to the dream world, our souls rent forever from our flesh.\n@c0@"
  ja: "@a@b＊「そのとき　私たちは　肉体から\n\t精神を　ときはなち　たましいだけの\n\t存在となって　夢世界へ逃れたのです。\n@c0@"
  ko: "@a@b*: 그때 우리는 육체에서\n정신을 분리시켜서 영혼만 남은\n존재가 되어 꿈의 세계로 도망쳤습니다.\n@c0@"
  sl: "@a@b＊：当时，我们把精神从\n　　肉体中解放，以灵魂的\n　　形态逃到了梦世界。\n@c0@"
  tl: "@a@b＊：當時，我們把精神從\n　　肉體中解放，以靈魂的\n　　形態逃到了夢世界。\n@c0@"
27:
  en: "@a@b*: But our respite was to be short-lived. The Dread Fiend soon found our sanctuary...\n@c0@"
  ja: "@a@b＊「しかし　魔王は\n\tその強大な　チカラを\n\t夢の中にまで　のばし……\n@c0@"
  ko: "@a@b*: 하지만 마왕은\n그 강력한 힘을\n꿈의 세계에까지 뻗쳤고......\n@c0@"
  sl: "@a@b＊：可是，没想到\n　　魔王那强大的力量\n　　竟然能够追到梦里……\n@c0@"
  tl: "@a@b＊：可是，沒想到\n　　魔王那強大的力量\n　　竟然能夠追到夢裡……\n@c0@"
28:
  en: "@a@b*: Before long, our new dream city and the island it was built upon were banished.\n@c0@"
  ja: "@a@b＊「私たちが　夢の世界に\n\t築いたこの町を　今度は　島ごと全て\n\t封印してしまったのですから。\n@c0@"
  ko: "@a@b*: 그 다음에는 우리가 꿈의 세계에\n세웠던 이 마을이 속한 섬까지 통째로\n봉인시켜 버렸던 겁니다.\n@c0@"
  sl: "@a@b＊：结果，我们在梦世界里\n　　建造的这个小镇，\n　　随着整个岛都被封印了起来。\n@c0@"
  tl: "@a@b＊：結果，我們在夢世界裡\n　　建造的這個小鎮，\n　　隨著整個島都被封印了起來。\n@c0@"
29:
  en: "@a@b*: Is it so tragic? With the kind of magic we wield, we can continue to lead normal lives, even without our physical bodies.\n@c0@"
  ja: "@a@b＊「わしら　魔法をあやつる者は\n\tたましいだけの　存在となって\n\t生きることが　できるのじゃ。\n@c0@"
  ko: "@a@b*: 마법을 다루는 우리 같은 사람들은\n영혼뿐인 존재가 되어서도\n살 수 있다네.\n@c0@"
  sl: "@a@b＊：我们这些掌控着魔法的人\n　　即使只剩下灵魂，\n　　依然还可以活着。\n@c0@"
  tl: "@a@b＊：我們這些掌控著魔法的人\n　　即使只剩下靈魂，\n　　依然還可以活著。\n@c0@"
30:
