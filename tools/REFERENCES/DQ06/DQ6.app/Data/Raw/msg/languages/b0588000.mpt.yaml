137:
  en: "@a%0%a002000@bWhoa! That sand urn sure earned its name!\n@c0@"
  ja: "@a@b%a002000「おお　すごいぜ！\n\t砂の器に　時の砂が\n\tすいこまれたぜ！\n@c0@"
  ko: "@a@b%a002000: 오오, 대단한데!\n모래 그릇에 시간의 모래가\n빨려들어갔어!\n@c0@"
  sl: "@a@b%a002000：哎呀！太棒了！\n　　时之沙全都被\n　　吸到沙之器里面了！\n@c0@"
  tl: "@a@b%a002000：哎呀！太棒了！\n　　時之沙全都被\n　　吸到沙之器裡面了！\n@c0@"
138:
  en: "@a%0%a002010@bThe sands of time are gone. In we go!\n@c0@"
  ja: "@a@b%a002010「時の砂が　なくなったわ。\n\tこれで　前に　進めるわね。\n@c0@"
  ko: "@a@b%a002010: 시간의 모래가 없어졌어.\n이제 앞으로 갈 수 있을 거야.\n@c0@"
  sl: "@a@b%a002010：时之沙已经没有了，\n　　这下我们可以前进了。\n@c0@"
  tl: "@a@b%a002010：時之沙已經沒有了，\n　　這下我們可以前進了。\n@c0@"
139:
  en: "@a%0%a002030@bWe've done it! The barrier that surrounded this place is no more.\n@c0@"
  ja: "@a@b%a002030「やりましたね！\n\tあたりを　つつんでいた\n\t結界も　なくなったようです！\n@c0@"
  ko: "@a@b%a002030: 해냈군요!\n주변을 감싸던\n결계도 없어진 것 같습니다!\n@c0@"
  sl: "@a@b%a002030：成功了！\n　　周围笼罩着的结界\n　　似乎也消失了！\n@c0@"
  tl: "@a@b%a002030：成功了！\n　　周圍籠罩著的結界\n　　似乎也消失了！\n@c0@"
140:
  en: "@a%0%a002020@bWow...! I did it! This sand urn is incredible!\n@c0@"
  ja: "@a@b%a002020「やったね　あたし！\n\tすごいよ　砂の器！\n@c0@"
  ko: "@a@b%a002020: 내가 해냈어!\n모래 그릇, 대단한걸!\n@c0@"
  sl: "@a@b%a002020：我成功了呢！\n　　沙之器真是太棒了！\n@c0@"
  tl: "@a@b%a002020：我成功了呢！\n　　沙之器真是太棒了！\n@c0@"
141:
  en: "@a%0%a002050@bSo only Sorcerians can use that sand urn...\n@c0@"
  ja: "@a@b%a002050「カルベローナの\n\t住人にしか　使えない\n\t砂の器……。\n@c0@"
  ko: "@a@b%a002050: 칼베로나의\n주민만이 사용할 수 있다는\n모래 그릇......\n@c0@"
  sl: "@a@b%a002050：只有卡尔贝罗纳本地人\n　　才能使用沙之器……\n@c0@"
  tl: "@a@b%a002050：只有卡爾貝羅納本地人\n　　才能使用沙之器……\n@c0@"
142:
  en: "@a%0%a002050@bI wonder how long you have to live here before you're granted citizenship...\n@c0@"
  ja: "@a@b%a002050「いったい　何年くらい\n\tここに　住んだら　住人として\n\t認めてもらえますかね！\n@c0@"
  ko: "@a@b%a002050: 과연 몇 년이나\n이곳에 살면 주민으로\n인정받을 수 있는 걸까요!\n@c0@"
  sl: "@a@b%a002050：可是究竟要\n　　在这里住多少年\n　　才会被承认是本地人啊！\n@c0@"
