126:
  en: "@a%0%a002010@bThey're both sleeping like logs. Let's not wake them up.\n@c0@"
  ja: "@a@b%a002010「おふたりとも\n\tよく　眠っているわ。\n\tしずかに　しましょうね。\n@c0@"
  ko: "@a@b%a002010: 두 분 모두\n깊이 잠드신 것 같아.\n조용히 하는 게 좋겠어.\n@c0@"
  sl: "@a@b%a002010：两位睡得正香，\n　　我们要安静一点。\n@c0@"
  tl: "@a@b%a002010：兩位睡得正香，\n　　我們要安靜一點。\n@c0@"
127:
  en: "@a%0%a002030@bIt seems they're both fast asleep.\n@c0@"
  ja: "@a@b%a002030「おふたりとも\n\tおやすみに　なってらっしゃるようです。\n@c0@"
  ko: "@a@b%a002030: 두 분 모두\n주무시는 것 같습니다.\n@c0@"
  sl: "@a@b%a002030：两位似乎已经睡着了。\n@c0@"
  tl: "@a@b%a002030：兩位似乎已經睡著了。\n@c0@"
128:
  en: "@a%0%a002020@bThat's weird... I feel so calm when I look at these people's faces. I wonder why...\n@c0@"
  ja: "@a@b%a002020「この人たちの\n\t顔を　見ていると　なんだか\n\tホッとするのは　なぜかな……。\n@c0@"
  ko: "@a@b%a002020: 이 사람들의\n얼굴을 보니까\n마음이 놓이는 건 왜일까......\n@c0@"
  sl: "@a@b%a002020：不知为什么，\n　　看着他们的表情，\n　　心情一下子就放松了下来……\n@c0@"
  tl: "@a@b%a002020：不知為什麼，\n　　看著他們的表情，\n　　心情一下子就放鬆了下來……\n@c0@"
129:
  en: "@a%0%a002050@bShhh... Let's keep our voices down!\n@c0@"
  ja: "@a@b%a002050「大声を　出しちゃ　ダメですよ。\n\tしずかに　しずかに。\n@c0@"
  ko: "@a@b%a002050: 큰 소리 내지 말자구요.\n조용조용.\n@c0@"
  sl: "@a@b%a002050：不要大声说话呀。\n　　小声点，小声点。\n@c0@"
  tl: "@a@b%a002050：不要大聲說話呀。\n　　小聲點，小聲點。\n@c0@"
130:
  en: "@a%0%a002070@b(slurp) Boing!\n@c0@"
  ja: "@a@b%a002070「プルプル。\n@c0@"
