  sl: "@a@b%a002070：噗，噗噜噜。\n@c0@"
  tl: "@a@b%a002070：噗，噗嚕嚕。\n@c0@"
125:
  en: "@a%0%a002000@bHmm... I doubt they'll be up any time soon.\n@c0@"
  ja: "@a@b%a002000「こりゃ　とうぶん　\n\t起きそうにもないな。\n@c0@"
