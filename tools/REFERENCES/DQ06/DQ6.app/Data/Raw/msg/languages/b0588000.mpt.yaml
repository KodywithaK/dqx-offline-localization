  ja: "@a@b%a002060「よく…すわったまま…\n\tねむれる…ものだ……。\n@c0@"
  ko: "@a@b%a002060: 앉은...채로...\n잘도...잔다......\n@c0@"
  sl: "@a@b%a002060：竟然能……坐着……\n　　睡着……啊……\n@c0@"
  tl: "@a@b%a002060：竟然能……坐著……\n　　睡著……啊……\n@c0@"
108:
  en: "@a%0%a002070@bBoing!\n@c0@"
  ja: "@a@b%a002070「プップル　プップル……。\n@c0@"
  ko: "@a@b%a002070: 뽀~뽀르 뽀~뽀르......\n@c0@"
  sl: "@a@b%a002070：噗噗噜～噗噗噜……\n@c0@"
  tl: "@a@b%a002070：噗噗嚕～噗噗嚕……\n@c0@"
109:
  en: "@a%0%a002000@bGeh. Kind of a catty ol' lady, aye?\n@c0@"
  ja: "@a@b%a002000「まったく　しょうがない\n\tばあさんだぜ……。\n@c0@"
  ko: "@a@b%a002000: 정말 못 말리는\n할머니로군......\n@c0@"
  sl: "@a@b%a002000：真拿这个老奶奶\n　　没办法……\n@c0@"
  tl: "@a@b%a002000：真拿這個老奶奶\n　　沒辦法……\n@c0@"
110:
  en: "@a%0%a002010@bMy word. She doesn't seem at all bothered by her current condition.\n@c0@"
  ja: "@a@b%a002010「あらあら。\n\tあまり　困ったふうでも\n\tないようね。\n@c0@"
  ko: "@a@b%a002010: 어머머.\n그렇게 곤란해 보이지도\n않는걸.\n@c0@"
  sl: "@a@b%a002010：哎呀呀，\n　　似乎一点都不发愁呢。\n@c0@"
  tl: "@a@b%a002010：哎呀呀，\n　　似乎一點都不發愁呢。\n@c0@"
111:
  en: "@a%0%a002030@bShe seems to have accepted her fate with a smile.\n@c0@"
  ja: "@a@b%a002030「なかなか　おちゃめな\n\tおばあさんです。\n@c0@"
  ko: "@a@b%a002030: 할머니 역시\n장난기가 가득하군요.\n@c0@"
  sl: "@a@b%a002030：真是个\n　　爱恶作剧的老奶奶。\n@c0@"
  tl: "@a@b%a002030：真是個\n　　愛惡作劇的老奶奶。\n@c0@"
112:
  en: "@a%0%a002020@bBoy, it must be awful when your memory starts slipping like that.\n@c0@"
  ja: "@a@b%a002020「あー。\n\t物忘れが　はげしくなると\n\tいろいろ　大変なんだね！\n@c0@"
  ko: "@a@b%a002020: 아~\n건망증이 심해지면\n이래저래 힘들겠구나!\n@c0@"
  sl: "@a@b%a002020：诶……\n　　要是越来越健忘的话\n　　可是会很麻烦呢！\n@c0@"
  tl: "@a@b%a002020：誒……\n　　要是越來越健忘的話\n　　可是會很麻煩呢！\n@c0@"
113:
  en: "@a%0%a002040@bWas that sorry cat tale really worth hearing?\n@c0@"
  ja: "@a@b%a002040「フッ……。\n\tわざわざ　いうほどの\n\t話でもないだろう。\n@c0@"
  ko: "@a@b%a002040: 훗......\n어차피 그런 얘기까지\n굳이 할 생각은 없다고.\n@c0@"
  sl: "@a@b%a002040：哼……\n　　这种事不用\n　　特意强调一遍吧。\n@c0@"
  tl: "@a@b%a002040：哼……\n　　這種事不用\n　　特意強調一遍吧。\n@c0@"
114:
  en: "@a%0%a002050@bIn her cat form, you can't tell that old dear's age.\n@c0@"
  ja: "@a@b%a002050「たとえ　おばあさんでも\n\tネコの　姿に　なっていると\n\t年齢が　わかりませんねー。\n@c0@"
  ko: "@a@b%a002050: 할머니이긴 해도\n고양이의 모습으로 변해 있으니\n연세를 알 수가 없네요~\n@c0@"
  sl: "@a@b%a002050：即使是老奶奶，\n　　变成猫的话\n　　也就看不出年纪了呢。\n@c0@"
  tl: "@a@b%a002050：即使是老奶奶，\n　　變成貓的話\n　　也就看不出年紀了呢。\n@c0@"
115:
  en: "@a%0%a002060@b(snarl) Grrragh... (spit)\n@c0@"
  ja: "@a@b%a002060「ギルル……ン。\n@c0@"
  ko: "@a@b%a002060: 캬르르......릉.\n@c0@"
  sl: "@a@b%a002060：咕噜噜……\n@c0@"
  tl: "@a@b%a002060：咕嚕嚕……\n@c0@"
116:
  en: "@a%0%a002070@b(slurp)\n@c0@"
  ja: "@a@b%a002070「ピキッ！\n@c0@"
  ko: "@a@b%a002070: 피키!\n@c0@"
  sl: "@a@b%a002070：哔叽！\n@c0@"
  tl: "@a@b%a002070：嗶嘰！\n@c0@"
117:
  en: "@a%0%a002000@bI'm still a little freaked out by all the cats in this joint.\n@c0@"
  ja: "@a@b%a002000「ホントに　このうちは\n\tネコばっかりだな。\n@c0@"
  ko: "@a@b%a002000: 정말 이 집은\n온통 고양이뿐이군.\n@c0@"
  sl: "@a@b%a002000：这间屋子里\n　　真的到处都是猫啊。\n@c0@"
  tl: "@a@b%a002000：這間屋子裡\n　　真的到處都是貓啊。\n@c0@"
118:
  en: "@a%0%a002010@bHee hee. What a cute little cat.\n@c0@"
  ja: "@a@b%a002010「うふふ。\n\tネコさん　こんにちは。\n@c0@"
  ko: "@a@b%a002010: 우후후.\n야옹아, 안녕.\n@c0@"
  sl: "@a@b%a002010：呵呵呵，\n　　小猫你好啊。\n@c0@"
  tl: "@a@b%a002010：呵呵呵，\n　　小貓你好啊。\n@c0@"
119:
  en: "@a%0%a002030@bThere's something about that cat's eyes that tells me it is no ordinary feline.\n@c0@"
  ja: "@a@b%a002030「何となく　このネコは\n\tふつうのネコと　ちがう目を\n\tしているような　気がします……。\n@c0@"
  ko: "@a@b%a002030: 왠지 이 고양이는\n보통 고양이와는 다른 눈을\n가진 것 같은데......\n@c0@"
  sl: "@a@b%a002030：我总觉得\n　　这只猫的眼神好像\n　　和普通的猫不太一样……\n@c0@"
  tl: "@a@b%a002030：我總覺得\n　　這隻貓的眼神好像\n　　和普通的貓不太一樣……\n@c0@"
120:
  en: "@a%0%a002020@bThe old guy here must really like cats, huh?\n@c0@"
  ja: "@a@b%a002020「ここの　おじいさんは\n\tよっぽど　ネコが好きなんだね！\n@c0@"
  ko: "@a@b%a002020: 이 집 할아버지는\n고양이를 정말 좋아하시나 봐!\n@c0@"
  sl: "@a@b%a002020：这家的老爷爷\n　　实在是很喜欢猫呢！\n@c0@"
  tl: "@a@b%a002020：這家的老爺爺\n　　實在是很喜歡貓呢！\n@c0@"
121:
  en: "@a%0%a002040@bHow much conversation do you hope to get out of a cat?\n@c0@"
  ja: "@a@b%a002040「そりゃ　ネコに　話しても\n\tにゃーん　だよな。\n@c0@"
  ko: "@a@b%a002040: 고양이한테 말을 건들\n대답은 야옹밖에 더 있겠나?\n@c0@"
  sl: "@a@b%a002040：就算跟猫说话，\n　　它也只会喵喵叫吧。\n@c0@"
  tl: "@a@b%a002040：就算跟貓說話，\n　　它也只會喵喵叫吧。\n@c0@"
122:
  en: "@a%0%a002050@bOnce you start strokin' a cat, you just can't stop!\n@c0@"
  ja: "@a@b%a002050「なでなで。\n\tああ…　この手ざわりが\n\tたまりませんねー！\n@c0@"
  ko: "@a@b%a002050: 쓰다듬어 줘야지.\n아아... 손에 닿는 이 감촉,\n끝내주네요~!\n@c0@"
  sl: "@a@b%a002050：让我摸摸。\n　　啊……这种触感\n　　真是让人欲罢不能啊！\n@c0@"
  tl: "@a@b%a002050：讓我摸摸。\n　　啊……這種觸感\n　　真是讓人欲罷不能啊！\n@c0@"
123:
  en: "@a%0%a002060@b(snarl) Cat...cute... (slobber)\n@c0@"
  ja: "@a@b%a002060「ネコ…かわいい……。\n\tギルルルル……。\n@c0@"
  ko: "@a@b%a002060: 고양이...귀엽다......\n캬르르르르......\n@c0@"
  sl: "@a@b%a002060：小猫……好可爱……\n　　咕噜噜噜噜……\n@c0@"
  tl: "@a@b%a002060：小貓……好可愛……\n　　咕嚕嚕嚕嚕……\n@c0@"
