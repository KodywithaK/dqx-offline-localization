  ko: "@a@b%a002000: 흐음.\n정말 우리 존재를\n모르는 모양이야.\n@c0@"
  sl: "@a@b%a002000：嗯。\n　　果然感觉不到咱们么。\n@c0@"
  tl: "@a@b%a002000：嗯。\n　　果然感覺不到咱們麼。\n@c0@"
19:
  en: "@a%0%a002000@bHold on... Am I hearin' things, or did he just say ‘Somnia’?\n@c0@"
  ja: "@a@b%a002000「うん？　気のせいか…？\n\tいま　レイドック城とか\n\t言ってたような……。\n@c0@"
  ko: "@a@b%a002000: 응? 기분 탓인가...?\n지금 레이독 성이라고\n말한 것 같은데......\n@c0@"
  sl: "@a@b%a002000：嗯？俺听错了么……\n　　刚才好像听到了雷多克城……\n@c0@"
  tl: "@a@b%a002000：嗯？俺聽錯了麼……\n　　剛才好像聽到了雷多克城……\n@c0@"
20:
  en: "@a%0%a002000@bCrikey. I feel like she was THIS close to seein' us.\n@c0@"
  ja: "@a@b%a002000「あー　ビックリしたぜ！！\n\tシスターには　オレたちが\n\t見えるのかと　思ったよ！\n@c0@"
  ko: "@a@b%a002000: 앗, 깜짝 놀랐어!!\n수녀님에겐 우리가\n보이는가 싶어서!!\n@c0@"
  sl: "@a@b%a002000：哎妈呀，吓俺一跳！！\n　　还以为修女能看见咱呢！\n@c0@"
  tl: "@a@b%a002000：哎媽呀，嚇俺一跳！！\n　　還以為修女能看見咱呢！\n@c0@"
21:
  en: "@a%0%a002000@bHuh. Nothin'.\n@c0@"
  ja: "@a@b%a002000「この　ばあさん\n\tまったく　気づいてないな……。\n@c0@"
