31:
  en: "@a%0%a002000@bAye, that old salt might've heard us! We're here! Ahoy! (cough) My voice is startin' to crack.\n@c0@"
  ja: "@a@b%a002000「いやいや　じいさん\n\tトシの　せいじゃないぜ　って言っても\n\t聞こえないんだよな……。\n@c0@"
