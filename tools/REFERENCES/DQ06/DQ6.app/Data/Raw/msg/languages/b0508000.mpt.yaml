0:
  en: "@a%0%a002000@bWhat a dump! Is this really Alltrades Abbey?\n@c0@"
  ja: "@a@b%a002000「何なんだ　ここは？\n\tまるで　はいきょじゃないか。\n\tここが　ダーマ神殿なのか？\n@c0@"
  ko: "@a@b%a002000: 뭐지 이곳은?\n폐허나 다름없잖아.\n여기가 다마 신전이라고?\n@c0@"
  sl: "@a@b%a002000：这里是咋回事？\n　　根本就是废墟。\n　　这就是达玛神殿吗？\n@c0@"
  tl: "@a@b%a002000：這裡是咋回事？\n　　根本就是廢墟。\n　　這就是達瑪神殿嗎？\n@c0@"
1:
  en: "@a%0%a002000@bWhat a mess! How'd the Abbey wind up like this, anyway?\n@c0@"
  ja: "@a@b%a002000「こいつは　ひどいな。\n\tどうすれば　こんなに\n\tボロボロに　なるんだよ。\n@c0@"
  ko: "@a@b%a002000: 이거야 원, 참혹하군.\n어떻게 하면 이렇게\n만신창이가 될 수 있지?\n@c0@"
  sl: "@a@b%a002000：这简直太惨了。\n　　到底发生了什么，\n　　才会变成这样破破烂烂。\n@c0@"
  tl: "@a@b%a002000：這簡直太慘了。\n　　到底發生了什麼，\n　　才會變成這樣破破爛爛。\n@c0@"
2:
  en: "@a%0%a002000@bAgh! A-Avast, %a000090! I can see right through your body!\n@c0@"
  ja: "@a@b%a002000「うわっ！！\n\tどうしたんだ　%a000090\n\tカラダが　すけて見えるぞ！？\n@c0@"
  ko: "@a@b%a002000: 으악!!\n어떻게 된 거야, %a000090.\n몸이 투명해졌잖아!?\n@c0@"
  sl: "@a@b%a002000：哇啊！！\n　　怎么了%a000090？\n　　身体怎么变透明了？！\n@c0@"
  tl: "@a@b%a002000：哇啊！！\n　　怎麼了%a000090？\n　　身體怎麼變透明了？！\n@c0@"
3:
  en: "@a%0%a002000@bWhoa! I can see right through MY body too!\n@c0@"
  ja: "@a@b%a002000「どっひゃー！\n\tよく見りゃ　オレも　じゃないか！\n@c0@"
  ko: "@a@b%a002000: 으아!\n이제 보니 나도 그렇군!\n@c0@"
  sl: "@a@b%a002000：哇啊！\n　　俺也变透明啦！\n@c0@"
  tl: "@a@b%a002000：哇啊！\n　　俺也變透明啦！\n@c0@"
4:
  en: "@a%0%a002000@bAre we d-dead? Are we gh-ghosts? What's going on here!?\n@c0@"
  ja: "@a@b%a002000「こ…　これは　いったい\n\tどうしたってんだ……。\n@c0@"
  ko: "@a@b%a002000: 이... 이게 도대체\n무슨 일인지......\n@c0@"
  sl: "@a@b%a002000：这、这到底是怎么了……\n@c0@"
  tl: "@a@b%a002000：這、這到底是怎麼了……\n@c0@"
5:
  en: "@a%0%a002000@bIf this really is Alltrades, then it looks like Murdaw's already gotten to it, aye?\n@c0@"
  ja: "@a@b%a002000「ここが　ダーマ神殿なら\n\tすでに　魔王ムドーに　よって\n\tほろぼされちまったって　ことなのか？\n@c0@"
  ko: "@a@b%a002000: 여기가 다마 신전이라면\n이미 마왕 무도 때문에\n멸망했다는 건가?\n@c0@"
  sl: "@a@b%a002000：如果这里是达玛神殿，\n　　就是说它已经被魔王姆多毁灭了吗？\n@c0@"
  tl: "@a@b%a002000：如果這裡是達瑪神殿，\n　　就是說它已經被魔王姆多毀滅了嗎？\n@c0@"
6:
  en: "@a%0%a002000@bHey, uh...you don't think we're invisible, do ya?\n@c0@"
  ja: "@a@b%a002000「もしかして　オレたち\n\tとうめい人間に　なっちまったのか！？\n@c0@"
  ko: "@a@b%a002000: 혹시 우리\n투명인간이 된 거냐!?\n@c0@"
  sl: "@a@b%a002000：咱们是变成透明人了吗？！\n@c0@"
  tl: "@a@b%a002000：咱們是變成透明人了嗎？！\n@c0@"
7:
  en: "@a%0%a002000@b(sniff) Take a whiff of that fresh sea air... This must be a port town.\n@c0@"
  ja: "@a@b%a002000「海の　ニオイがするぜ。\n\tどうやら　ここは　港町だな。\n@c0@"
  ko: "@a@b%a002000: 바다 냄새가 나는군.\n여기는 아마 항구 마을인가 보군.\n@c0@"
  sl: "@a@b%a002000：有海的味道。\n　　这里应该是港口镇吧。\n@c0@"
  tl: "@a@b%a002000：有海的味道。\n　　這裡應該是港口鎮吧。\n@c0@"
8:
  en: "@a%0%a002000@bPretty big town, aye? I bet it'd be quicker to cut through that middle building instead of goin' the long way around.\n@c0@"
  ja: "@a@b%a002000「けっこう　広い町だな。\n\tけど　まん中のたてものを\n\t左右に　つっきれば　早いかもな。\n@c0@"
  ko: "@a@b%a002000: 상당히 넓은 마을이군.\n하지만 가운데 건물을 좌우로\n가로지르면 빠를지도 모르겠어.\n@c0@"
  sl: "@a@b%a002000：这镇子真大。\n　　要想到对面去的话，\n　　横穿中间那座建筑物比较快吧。\n@c0@"
  tl: "@a@b%a002000：這鎮子真大。\n　　要想到對面去的話，\n　　橫穿中間那座建築物比較快吧。\n@c0@"
9:
  en: "@a%0%a002000@bSomethin' about the smell of the ocean and that sea breeze... It's calmin', aye?\n@c0@"
  ja: "@a@b%a002000「この町の　しおかぜや\n\t海の　ニオイは　いいなあ。\n\tなんとなく　落ちつくぜ。\n@c0@"
  ko: "@a@b%a002000: 이 마을의 바닷바람과\n냄새는 사람을 기분 좋게 해.\n왠지 편안해진단 말이지.\n@c0@"
  sl: "@a@b%a002000：这里的海风吹来海的味道，\n　　感觉真好啊。\n　　一下子平静了。\n@c0@"
  tl: "@a@b%a002000：這裡的海風吹來海的味道，\n　　感覺真好啊。\n　　一下子平靜了。\n@c0@"
10:
  en: "@a%0%a002000@bHe really can't see us. Wild!\n@c0@"
  ja: "@a@b%a002000「やっぱり　オレたちの姿は\n\t見えていないようだな……。\n@c0@"
  ko: "@a@b%a002000: 역시 우리 모습이\n안 보이는가 보군......  \n@c0@"
  sl: "@a@b%a002000：果然看不见咱们啊……\n@c0@"
  tl: "@a@b%a002000：果然看不見咱們啊……\n@c0@"
11:
  en: "@a%0%a002000@bAye, she's right. Even good dogs do bad things sometimes.\n@c0@"
  ja: "@a@b%a002000「うん　たしかにな。\n\tいくら　おとなしくても\n\tはなしがいは　まずいよな。\n@c0@"
  ko: "@a@b%a002000: 으음, 그건 그래.\n아무리 순한 개라도\n풀어놓으면 곤란하지.\n@c0@"
  sl: "@a@b%a002000：嗯，说得没错。\n　　不管再怎么老实，\n　　完全放养也不好。\n@c0@"
  tl: "@a@b%a002000：嗯，說得沒錯。\n　　不管再怎麼老實，\n　　完全放養也不好。\n@c0@"
12:
  en: "@a%0%a002000@bEither that's one noisy mutt, or animals can sense our presence.\n@c0@"
  ja: "@a@b%a002000「さすがに　どうぶつは\n\tオレたちのことが　わかるんだな。\n@c0@"
