23:
  en: "@a%0%a002000@bI thought this was a prison, but it seems like they're mostly just using it for storage.\n@c0@"
  ja: "@a@b%a002000「ふーん。\n\tここは　牢屋かと　思ったけど\n\tどうやら　地下倉庫　みたいだな。\n@c0@"
