  sl: "@a@b%a002000：喂！\n　　俺在这里啊！！\n@c0@"
  tl: "@a@b%a002000：喂！\n　　俺在這裡啊！！\n@c0@"
18:
  en: "@a%0%a002000@bAlright, that clinches it. He really can't see us.\n@c0@"
