  tl: "@a@b%a002000：每次咱跟人說話，\n　　他們總是一副不可思議的表情。\n@c0@"
15:
  en: "@a%0%a002000@bThis is actually kind of fun, aye?\n@c0@"
  ja: "@a@b%a002000「これは　これで\n\tちょっと　おもしろく　なってきたぜ。\n@c0@"
  ko: "@a@b%a002000: 이 상황도 그럭저럭\n재미있어지기 시작했어.\n@c0@"
  sl: "@a@b%a002000：越来越觉得有趣了。\n@c0@"
  tl: "@a@b%a002000：越來越覺得有趣了。\n@c0@"
16:
  en: "@a%0%a002000@bIf animals can see us, does that mean they're smarter than people?\n@c0@"
  ja: "@a@b%a002000「やっぱり　どうぶつは\n\tかしこいな。\n\tオレたちのこと　わかってるもんな。\n@c0@"
  ko: "@a@b%a002000: 역시 동물들은\n영리하단 말이지.\n우리를 알아보잖아.\n@c0@"
