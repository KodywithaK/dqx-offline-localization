  sl: "@a@b%a002000：看来只有动物\n　　才感觉得到咱们。\n@c0@"
  tl: "@a@b%a002000：看來只有動物\n　　才感覺得到咱們。\n@c0@"
13:
  en: "@a%0%a002000@bSo this is the Mayor, aye? I don't like him already.\n@c0@"
  ja: "@a@b%a002000「へえ。　この　オッサンが\n\tこの町の　町長なのか。\n\t気が　みじかそうな　ヤツだな。\n@c0@"
  ko: "@a@b%a002000: 아하, 이 영감이\n이 마을 촌장인가 보군.\n꽤나 성미가 급해 보여.\n@c0@"
  sl: "@a@b%a002000：哦。这大叔是镇长啊。\n　　真是个急脾气的家伙。\n@c0@"
  tl: "@a@b%a002000：哦。這大叔是鎮長啊。\n　　真是個急脾氣的傢伙。\n@c0@"
14:
  en: "@a%0%a002000@bPeople do the oddest things when we talk to them.\n@c0@"
  ja: "@a@b%a002000「話しかけると\n\tみんな　ふしぎそうな\n\t顔を　するよな。\n@c0@"
  ko: "@a@b%a002000: 말을 걸면\n하나 같이 이상하다는 듯한\n표정을 짓는군.\n@c0@"
