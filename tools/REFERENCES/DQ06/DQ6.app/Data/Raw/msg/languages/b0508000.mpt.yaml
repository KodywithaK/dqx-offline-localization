  sl: "@a@b%a002000：这位老婆婆也没看到咱们……\n@c0@"
  tl: "@a@b%a002000：這位老婆婆也沒看到咱們……\n@c0@"
22:
  en: "@a%0%a002000@bHuh. I suppose folks of faith are better at sensing things than regular people...\n@c0@"
  ja: "@a@b%a002000「う～む……　やっぱ\n\t神父さんには　何かを感じる能力が\n\tあるのかもしれないぜ。\n@c0@"
