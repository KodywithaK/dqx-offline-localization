0:
  en: "@a@b*: Oi, %H0860%Xyou%Yyou lot%Z! Who said you could come here!?\n@c0@"
  ja: "@a@b＊「おい　あんた。\n\t誰に聞いて　この町に来たんだ？\n@c0@"
  ko: "@a@b*: 이봐, 당신. 누구한테\n이 마을 이야기를 듣고 온 거지?\n@c0@"
  sl: "@a@b＊：喂，说你呢。\n　　谁叫你来这个镇子的？\n@c0@"
  tl: "@a@b＊：喂，說你呢。\n　　誰叫你來這個鎮子的？\n@c0@"
1:
  en: "@a@b*: This here's the rogue town o' Turnscote!\n@c0@"
  ja: "@a@b＊「ここは　ならず者の町\n\tロンガデセオ。\n@c0@"
  ko: "@a@b*: 여긴 불량배들의 마을\n론가데세오.\n@c0@"
  sl: "@a@b＊：这里是无赖聚居的镇子\n　　洛卡迪塞欧。\n@c0@"
  tl: "@a@b＊：這裡是無賴聚居的鎮子\n　　洛卡迪塞歐。\n@c0@"
2:
  en: "@a@b*: I don't fink you'd fit in here. It ain't your scene. Now clear off!\n@c0@"
  ja: "@a@b＊「悪いが　あんたらみたいなひとは\n\tこの町に　ふさわしくないぜ。\n\t出ていってくんな。\n@c0@"
  ko: "@a@b*: 미안하지만, 당신들 같은 사람은\n이 마을에 어울리지 않아.\n나가 줬으면 좋겠군.\n@c0@"
  sl: "@a@b＊：不好意思，这里不是\n　　你们这样的人来的地方。\n　　请回吧。\n@c0@"
  tl: "@a@b＊：不好意思，這裡不是\n　　你們這樣的人來的地方。\n　　請回吧。\n@c0@"
