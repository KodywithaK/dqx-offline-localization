5:
  en: "@a@b*: The likes o' you ain't got no reason to be here.\n@c0@"
  ja: "@a@b＊「あんたらみたいなひとを　この町に\n\t入れるわけにゃあ　いかねえな。\n@c0@"
  ko: "@a@b*: 당신들 같은 사람을 이 마을에\n들일 수는 없어.\n@c0@"
  sl: "@a@b＊：不能让你们这样的人\n　　进这个镇子。\n@c0@"
  tl: "@a@b＊：不能讓你們這樣的人\n　　進這個鎮子。\n@c0@"
6:
  en: "@a@b*: If you're desperate to come in, a certain someone'll have to vouch for you. Then I might just consider it...\n@c0@"
  ja: "@a@b＊「ま　あのお方の\n\tクチききでもあれば\n\t考えてやっても　いいけどよ。\n@c0@"
  ko: "@a@b*: 뭐, 그분의\n소개라도 있다면\n다시 생각해 볼 수도 있지.\n@c0@"
  sl: "@a@b＊：不过要是那位大人\n　　介绍你们来的话，\n　　倒是另当别论。\n@c0@"
  tl: "@a@b＊：不過要是那位大人\n　　介紹你們來的話，\n　　倒是另當別論。\n@c0@"
7:
  en: "@a@b*: 'Course, last I heard, he was livin' near a huge snowy mountain over the sea to the east.\n@c0@"
  ja: "@a@b＊「この町から出て　海を東へ進んでゆくと\n\t大きな雪山が見えてくる。　あのお方は\n\tたしか　そこに住んでいたはずだぜ。\n@c0@"
  ko: "@a@b*: 이 마을 밖 바다에서 동쪽으로 가면\n눈이 쌓인 큰 산이 보일 거다. 그분은\n아마 거기 살고 계셨을 거야.\n@c0@"
  sl: "@a@b＊：从这个镇子出去，往东越过大海，\n　　就能看到一座大雪山。\n　　那位大人应该就住在那里。\n@c0@"
  tl: "@a@b＊：從這個鎮子出去，往東越過大海，\n　　就能看到一座大雪山。\n　　那位大人應該就住在那裡。\n@c0@"
8:
  en: "@a@b*: To be honest with you, I wouldn't waste your time. Now, shove off!\n@c0@"
  ja: "@a@b＊「もっとも　行くだけムダだと思うがな。\n\t……そういうわけだ。\n\t悪いが　出て行ってくんな。\n@c0@"
  ko: "@a@b*: 하긴, 가 봐야 헛걸음이겠지만.\n......이야기는 끝났다.\n미안하지만 이제 나가 줬으면 좋겠군.\n@c0@"
  sl: "@a@b＊：其实你们去也没用。\n　　……就是这么回事。\n　　不好意思，请回吧。\n@c0@"
  tl: "@a@b＊：其實你們去也沒用。\n　　……就是這麼回事。\n　　不好意思，請回吧。\n@c0@"
