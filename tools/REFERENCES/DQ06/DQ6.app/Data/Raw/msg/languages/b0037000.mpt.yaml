13:
  en: "@a@b*: I'm on a quest to find the Shield of Valora. It's one of four legendary relics.\n@c0@"
  ja: "@a@b＊「オレは　伝説の武具のひとつ\n\tスフィーダの盾を　探して\n\t旅をしている者だ。\n@c0@"
  ko: "@a@b*: 나는 전설의 장비 중 하나인\n스피더의 방패를 찾아\n여행을 하는 자다.\n@c0@"
  sl: "@a@b＊：我为了寻找\n　　传说中的武具之一\n　　斯费达之盾而踏上了旅途。\n@c0@"
  tl: "@a@b＊：我為了尋找\n　　傳說中的武具之一\n　　斯費達之盾而踏上了旅途。\n@c0@"
14:
  en: "@a@b*: But I think I might have hit a bit of a brick wall.\n@c0@"
  ja: "@a@b＊「しかし　もう　ダメかもしれぬ。\n@c0@"
  ko: "@a@b*: 허나 이제 틀렸을지도 몰라.\n@c0@"
  sl: "@a@b＊：不过可能找不到了。\n@c0@"
  tl: "@a@b＊：不過可能找不到了。\n@c0@"
15:
  en: "@a@b*: ‘Northward till the road doth end,\nEastward then you go,‘\n㈡\n‘North from yonder crossroads wend,\nWestward, then below.’\n@c0@"
  ja: "@a@b＊「まず北へ。　つきあたりを東に。\n\tひとつめの十字路を北へすすみ\n\t西の十字路を南にすすむべし。\n@c0@"
  ko: "@a@b*: 일단 북쪽으로. 막다른 곳에서 동쪽으로.\n첫 번째 사거리에서 북쪽으로 간 다음\n서쪽 사거리에서는 남쪽으로 갈 것.\n@c0@"
  sl: "@a@b＊：先往北走到底，然后往东走。\n　　在第一个十字路口往北走。\n　　在西边的十字路口再往南走。\n@c0@"
  tl: "@a@b＊：先往北走到底，然後往東走。\n　　在第一個十字路口往北走。\n　　在西邊的十字路口再往南走。\n@c0@"
16:
  en: "@a@b*: It's some kind of ancient clue, but I can't for the life of me figure out what it means...\n@c0@"
  ja: "@a@b＊「などという　言い伝えだけでは\n\tまるで　雲をつかむような話で……\n\tもう　あきらめようかと思ってるのだ。\n@c0@"
  ko: "@a@b*: 이런 설명만으로는\n꼭 뜬구름을 잡는 것 같아서......\n이제 포기할까 생각하던 참이었다.\n@c0@"
  sl: "@a@b＊：光知道这么一句传言，\n　　简直摸不着头脑啊……\n　　我都想放弃了。\n@c0@"
  tl: "@a@b＊：光知道這麼一句傳言，\n　　簡直摸不著頭腦啊……\n　　我都想放棄了。\n@c0@"
