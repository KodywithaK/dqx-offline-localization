0:
  en: "@a@b*: Wayward sheep of the great shepherdess, welcome to this house of the Goddess. How may we help you?\n@c0@"
  ja: "@a@b＊「神にみちびかれし　迷える子羊よ。\n\tわが教会へ　ようこそ。\n\tご用は　なんでしょう？\n@c0@"
  ko: "@a@b*: 신의 인도 속에서 길 잃은 어린양이여,\n우리 성당에 오신 것을 환영합니다.\n무슨 일이신가요?\n@c0@"
  sl: "@a@b＊：受神指引的迷途羔羊啊。\n　　欢迎来到这座教会。\n　　有什么事吗？\n@c0@"
  tl: "@a@b＊：受神指引的迷途羔羊啊。\n　　歡迎來到這座教會。\n　　有什麼事嗎？\n@c0@"
1:
  en: "@a@b*: Welcome to our house of the Goddess. Is something troubling you at this late hour, child?\n@c0@"
  ja: "@a@b＊「ようこそ　わが教会へ。\n\tこのような夜更けに　なにか\n\tお困りごとでしょうか？\n@c0@"
  ko: "@a@b*: 우리 성당에 오신 것을 환영합니다.\n이런 늦은 밤에\n곤란한 일이라도 있으신지요?\n@c0@"
  sl: "@a@b＊：欢迎来到这座教会。\n　　深夜来访，是遇到了什么困难吗？\n@c0@"
  tl: "@a@b＊：歡迎來到這座教會。\n　　深夜來訪，是遇到了什麼困難嗎？\n@c0@"
2:
  en: "@a@b*: Confess all that you have done before the almighty Goddess, child. \n@c0@"
  ja: "@a@b＊「では　神の前に\n\tこれまでの　おこないを\n\t告白なさい。\n@c0@"
  ko: "@a@b*: 그럼 신 앞에서\n지금까지의 행동을\n고백하세요.\n@c0@"
  sl: "@a@b＊：那么，请在神的面前\n　　告白至今为止\n　　你的所作所为吧。\n@c0@"
  tl: "@a@b＊：那麼，請在神的面前\n　　告白至今為止\n　　你的所作所為吧。\n@c0@"
3:
  en: "@a@b*: Would you allow me to record your works in an adventure log?\n@c0@"
  ja: "@a@b＊「そして　この冒険の書に\n\t記録しても　よろしいですか？\n@c0@"
  ko: "@a@b*: 그리고 이 모험의 서에\n기록해도 괜찮겠습니까?\n@c0@"
  sl: "@a@b＊：要记录在\n　　冒险之书上吗？\n@c0@"
  tl: "@a@b＊：要記錄在\n　　冒險之書上嗎？\n@c0@"
4:
  en: "@a@b*: Into which adventure log do you wish me to record this?\n@c0@"
  ja: "@a@b＊「なんばんの　冒険の書に\n\t記録なさいますか？\n@c0@"
  ko: "@a@b*: 모험의 서 몇 번에\n기록하시겠습니까?\n@c0@"
  sl: "@a@b＊：要记录到\n　　几号冒险之书呢？\n@c0@"
  tl: "@a@b＊：要記錄到\n　　幾號冒險之書呢？\n@c0@"
5:
  en: "@a@b*: In that case, I must overwrite\n‘%a000660: %a000090 %a000240’.\nDo you wish me to proceed, my child?\n@c0@"
  ja: "@a@b＊「%a000660：%a000090　%a000240の\n\t記録に　上書きしてしまいますが\n\tそれでも　よろしいですか？\n@c0@"
  ko: "@a@b*: %a000660 : %a000090 %a000240의\n기록에 덮어써도\n괜찮겠습니까?\n@c0@"
  sl: "@a@b＊：这样会覆盖\n　　%a000660：%a000090　%a000240的记录，\n　　确定吗？\n@c0@"
  tl: "@a@b＊：這樣會覆蓋\n　　%a000660：%a000090　%a000240的記錄，\n　　確定嗎？\n@c0@"
6:
  en: "@a@bSaving adventure log...\nPlease do not turn off the power.\n@c0@"
  ja: "@a@b冒険の書に　記録しています。\n電源を切らないで下さい。\n@c0@"
  ko: "@a@b모험의 서에 기록하고 있습니다.\n전원을 끄지 마십시오.\n@c0@"
  sl: "@a@b正在记录冒险之书。\n请不要切断电源。\n@c0@"
  tl: "@a@b正在記錄冒險之書。\n請不要切斷電源。\n@c0@"
7:
  en: "@a@b*: Woe is me! Alas, unhappy day! It appears my attempt to record the adventure log has failed!\n@c0@"
  ja: "@a@b＊「まあ！　どうしたことでしょう？\n\t記録に　失敗したようですわ。\n@c0@"
  ko: "@a@b*: 어머나! 세상에!\n기록에 실패한 것 같군요.\n@c0@"
  sl: "@a@b＊：咦！这是怎么回事？\n　　记录失败了。\n@c0@"
  tl: "@a@b＊：咦！這是怎麼回事？\n　　記錄失敗了。\n@c0@"
8:
  en: "@a@b*: I successfully recorded your adventure log. Do you plan to continue on your adventure at this point?\n@c0@"
  ja: "@a@b＊「たしかに　記録いたしました。\n\tまだ　冒険を　お続けになりますか？\n@c0@"
  ko: "@a@b*: 무사히 기록했습니다.\n모험을 계속하시겠습니까?\n@c0@"
  sl: "@a@b＊：记录完毕。\n　　要继续冒险吗？\n@c0@"
  tl: "@a@b＊：記錄完畢。\n　　要繼續冒險嗎？\n@c0@"
9:
  en: "@a@b*: You would prefer not to make a record of your adventure? Then so be it. You are free to do as you please.\n@c0@"
  ja: "@a@b＊「では　これまでのことは\n\t記録しないでおきましょう。\n@c0@"
  ko: "@a@b*: 그럼 지금까지의 일은\n기록하지 않도록 하겠습니다.\n@c0@"
  sl: "@a@b＊：那么至今为止的事情\n　　就先不记录了。\n@c0@"
  tl: "@a@b＊：那麼至今為止的事情\n　　就先不記錄了。\n@c0@"
10:
  en: "@a@b*: Do you plan on continuing your adventure at this point?\n@c0@"
  ja: "@a@b＊「まだ　冒険を\n\tお続けになりますか？\n@c0@"
  ko: "@a@b*: 모험을\n계속하시겠습니까?\n@c0@"
  sl: "@a@b＊：要继续冒险吗？\n@c0@"
  tl: "@a@b＊：要繼續冒險嗎？\n@c0@"
11:
  en: "@a@b*: You intend to rest from your adventures without recording your deeds in an adventure log?\n@c0@"
  ja: "@a@b＊「では　記録せずに\n\t休むと　おっしゃるのですね。\n@c0@"
  ko: "@a@b*: 그럼 기록하지 않고\n쉬시는군요.\n@c0@"
  sl: "@a@b＊：那么，\n　　你想不记录就休息是吗。\n@c0@"
  tl: "@a@b＊：那麼，\n　　你想不記錄就休息是嗎。\n@c0@"
12:
  en: "@a@b*: This will mean you will restart your adventure from the point of your last confession. Are you sure?\n@c0@"
  ja: "@a@b＊「そうすると　冒険が\n\t前の記録まで　もどりますが\n\tよろしいのですか？\n@c0@"
  ko: "@a@b*: 그럼 모험이\n이전 기록으로 되돌아가는데\n그래도 괜찮겠습니까?\n@c0@"
  sl: "@a@b＊：那冒险就会\n　　回到上次记录。\n　　这样可以吗？\n@c0@"
  tl: "@a@b＊：那冒險就會\n　　回到上次記錄。\n　　這樣可以嗎？\n@c0@"
13:
  en: "@a@b*: O great shepherdess, please allow this faithful lamb to rest in peace for a while!\n@c0@"
  ja: "@a@b＊「ああ　われらが神よ！\n\tこの迷える子羊に　ひとときの\n\t休息を　おあたえください！\n@c0@"
  ko: "@a@b*: 오오, 신이시여!\n이 길 잃은 어린양에게 잠시 동안\n휴식을 내려 주소서!\n@c0@"
  sl: "@a@b＊：啊，我们的神啊！\n　　请赐予这迷途的羔羊\n　　片刻的休息！\n@c0@"
  tl: "@a@b＊：啊，我們的神啊！\n　　請賜予這迷途的羔羊\n　　片刻的休息！\n@c0@"
14:
  en: "@a@b                  Bless you, my child.              Please turn the power OFF.\n@c0@"
  ja: "@a@b　　　　　　おつかれさまでした。\n　このまま　電源をＯＦＦにしてください。\n@c0@"
  ko: "@a@b　　　　　　플레이가 끝났습니다.\n이대로 전원을 꺼 주세요.\n@c0@"
  sl: "@a@b　　　　　　辛苦了。\n　　　　请直接关闭电源。\n@c0@"
  tl: "@a@b　　　　　　辛苦了。\n　　　　請直接關閉電源。\n@c0@"
15:
  en: "@a@b*: The great and benevolent Goddess offers Her wisdom...\n@c0@"
  ja: "@a@b＊「神の声が　聞こえます。\n@c0@"
  ko: "@a@b*: 신의 목소리가 들립니다.\n@c0@"
  sl: "@a@b＊：能够听到神的声音。\n@c0@"
