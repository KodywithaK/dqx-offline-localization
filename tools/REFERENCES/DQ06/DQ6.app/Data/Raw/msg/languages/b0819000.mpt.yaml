  ja: "@a@b＊「%a000060よ。　\n\tあなたは　もう　じゅうぶん　\n\t強く　おなりですわ。\n@c0@"
  ko: "@a@b*: %a000060.\n당신은 이미\n충분히 강해졌군요.\n@c0@"
  sl: "@a@b＊：%a000060啊。\n　　你已经足够强了。\n@c0@"
