318:
  en: "@aKing Benedict@bWelcome, %H0860%Xfriend%Yfriends%Z. I am King Benedict, the monarch charged with keeping the peace here in Felonia.\n@c0@"
  ja: "@a@b王「よくぞ来た　旅の者たちよ。\n\t私が　このガンディーノの国を\n\tあずかる者だ。\n@c0@"
