  tl: "@a@b＊：別對別人說啊……\n　　我覺得吧，\n　　前任國王比現任好。\n@c0@"
309:
  en: "@a@b*: He used to let us give all the hard work to the slaves.\n@c0@"
  ja: "@a@b＊「なんたって　仕事は　みんな\n\tドレイに　押しつけて\n\t楽が　できたし……。\n@c0@"
