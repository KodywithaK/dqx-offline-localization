303:
  en: "@a@b*: That was terrifying...\n@c0@"
  ja: "@a@b＊「ああ　こわかった……。\n@c0@"
  ko: "@a@b*: 그래 봐야\n정말 형편없는 음식이었지만 말이야.\n@c0@"
  sl: "@a@b＊：啊啊，太吓人了……\n@c0@"
  tl: "@a@b＊：啊啊，太嚇人了……\n@c0@"
304:
