  sl: "@a@b＊：越过东边的大海，沿河而上，\n　　在那里有一个奇异洞窟，\n　　它就沉睡在洞窟深处。\n@c0@"
  tl: "@a@b＊：越過東邊的大海，沿河而上，\n　　在那裡有一個奇異洞窟，\n　　它就沉睡在洞窟深處。\n@c0@"
296:
  en: "@a@b*: In any case, it's not something the likes of the Gandino clan could get their grubby mitts on.\n@c0@"
