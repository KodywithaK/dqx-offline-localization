  ko: "@a@b*: 그건 순 가짜였지만\n말이야.\n@c0@"
  sl: "@a@b＊：以前城堡里有许多奴隶。\n　　我负责给他们做饭。\n@c0@"
  tl: "@a@b＊：以前城堡裡有許多奴隸。\n　　我負責給他們做飯。\n@c0@"
298:
