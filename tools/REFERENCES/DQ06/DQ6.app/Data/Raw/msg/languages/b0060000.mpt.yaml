  tl: "@a@b＊：這也是那時候僅有的好事。\n@c0@"
311:
  en: "@a@b*: Welcome to Felonia! You should know that while the King is kind-hearted, the Queen Mother needs to be handled with kid gloves.\n@c0@"
  ja: "@a@b＊「旅の者か？　王さまは\n\t心やさしいお方じゃが　皇太后さま\n\tだけには　そそうのないようにな。\n@c0@"
