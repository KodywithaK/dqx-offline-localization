  tl: "@a@b＊：所以很多人得了病，\n　　根本治不好。\n@c0@"
300:
  en: "@a@b*: This is where the soldiers of Felonia wait between shifts.\n@c0@"
  ja: "@a@b＊「ここは　われわれ　兵士たちの\n\tたいき所だ。\n@c0@"
  ko: "@a@b*: 머나먼 동쪽 바다에서 강을 올라가면\n아주 신비한 동굴이 보이는데,\n그 동굴 깊숙이 숨어 있다더군.\n@c0@"
  sl: "@a@b＊：这里是士兵待命的地方。\n@c0@"
  tl: "@a@b＊：這裡是士兵待命的地方。\n@c0@"
301:
  en: "@a@b*: Waaargh! Who are you!?\n@c0@"
