  ja: "@a@b＊「%a000180さんは　これを\n\t装備できませんが\n\tそれでも　よろしいですか？\n@c0@"
  ko: "@a@b*: %a000180 님은\n이것을 장비할 수 없는데,\n그래도 가져가시겠습니까?\n@c0@"
