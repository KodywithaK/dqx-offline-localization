  ja: "@a@b＊「おや？　でも\n\t%a000180さんの　持ち物は\n\t大切なものばかりですね。\n@c0@"
  ko: "@a@b*: 어라? 하지만\n%a000180 님의 소지품은\n중요한 것들뿐이네요.\n@c0@"
