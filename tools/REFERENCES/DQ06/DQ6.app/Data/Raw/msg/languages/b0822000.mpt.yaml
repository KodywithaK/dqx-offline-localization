  ja: "@a@b＊「どなたが　お使いになりますか？\n@c0@"
  ko: "@a@b*: 어느 분이 사용하시겠습니까?\n@c0@"
  sl: "@a@b＊：要交给谁呢？\n@c0@"
  tl: "@a@b＊：要交給誰呢？\n@c0@"
8:
