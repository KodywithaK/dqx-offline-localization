  ja: "@a@b＊「でも　%a000180さんは　それ以上\n\tお持ちになれないようですよ。\n\t持ち物を　整理しましょうか？\n@c0@"
  ko: "@a@b*: 하지만 %a000180 님은 그 이상\n물건을 소지하실 수 없는 것 같습니다.\n소지품을 정리할까요?\n@c0@"
  sl: "@a@b＊：但是%a000180\n　　已经拿不下其他东西了。\n　　要整理一下随身物品吗？\n@c0@"
  tl: "@a@b＊：但是%a000180\n　　已經拿不下其他東西了。\n　　要整理一下隨身物品嗎？\n@c0@"
10:
