0:
  en: "@a@b*: You can trade in your casino tokens here for all sorts of exciting things.\n@c0@"
  ja: "@a@b＊「ここは　コインを　景品にかえる\n\tこうかん所です。\n@c0@"
  ko: "@a@b*: 이곳은 코인을 경품으로 바꾸는\n교환소입니다.\n@c0@"
  sl: "@a@b＊：这里是用代币兑换奖品的交换所。\n@c0@"
  tl: "@a@b＊：這裡是用代幣兌換獎品的交換所。\n@c0@"
1:
  en: "@a@b*: You currently have... Oh dear! It looks like you don't have any tokens at all.\n@c0@"
  ja: "@a@b＊「%a000120さんは　現在……\n\tあら？　１枚もコインを\n\tお持ちではありませんね。\n@c0@"
  ko: "@a@b*: %a000120 님은 현재......\n어라? 코인이 하나도\n없으시네요.\n@c0@"
  sl: "@a@b＊：%a000120现在……\n　　咦？１枚代币也没有呢。\n@c0@"
  tl: "@a@b＊：%a000120現在……\n　　咦？１枚代幣也沒有呢。\n@c0@"
2:
  en: "@a@b*: Come back again when you've got some.\n@c0@"
  ja: "@a@b＊「コインが　たまったら\n\tまた　いつでも　おこしください。\n@c0@"
  ko: "@a@b*: 코인을 모으면\n언제든지 또 와 주세요.\n@c0@"
  sl: "@a@b＊：欢迎您在积攒了代币后\n　　随时光临。\n@c0@"
  tl: "@a@b＊：歡迎您在積攢了代幣後\n　　隨時光臨。\n@c0@"
3:
  en: "@a@b*: You currently have %a000420 token%H0420%X%Ys%Z. Would you like to exchange %H0420%Xit%Ythem%Z for a prize?\n@c0@"
  ja: "@a@b＊「%a000120さんは　現在　コインを\n\t%a000420枚　お持ちですが\n\t景品と　こうかん　しますか？\n@c0@"
  ko: "@a@b*: %a000120 님은 현재 코인을\n%a000420개 소지하고 계십니다.\n경품과 교환하시겠습니까?\n@c0@"
  sl: "@a@b＊：%a000120现在持有\n　　%a000420枚代币，\n　　要交换奖品吗？\n@c0@"
  tl: "@a@b＊：%a000120現在持有\n　　%a000420枚代幣，\n　　要交換獎品嗎？\n@c0@"
4:
  en: "@a@b*: Which prize do you want?\n@c0@"
  ja: "@a@b＊「どれと　こうかんしましょう？\n@c0@"
  ko: "@a@b*: 어느 것과 교환하시겠습니까?\n@c0@"
  sl: "@a@b＊：要交换哪个呢？\n@c0@"
  tl: "@a@b＊：要交換哪個呢？\n@c0@"
5:
  en: "@a@b*: I'm afraid you don't have enough tokens for %a040100.\n@c0@"
  ja: "@a@b＊「%a000100と\n\tこうかん　するには\n\tコインが　たりないようです。\n@c0@"
  ko: "@a@b*: %a000100%F0100%X와%Y과%Z\n교환하기에는\n코인이 부족한 것 같군요.\n@c0@"
  sl: "@a@b＊：代币的数量不够，\n　　不能交换%a000100。\n@c0@"
  tl: "@a@b＊：代幣的數量不夠，\n　　不能交換%a000100。\n@c0@"
6:
  en: "@a@b*: %0%a040100, right?\n@c0@"
  ja: "@a@b＊「%a000100ですね？\n@c0@"
  ko: "@a@b*: %a000100 말씀이죠?\n@c0@"
  sl: "@a@b＊：%a000100是吗？\n@c0@"
  tl: "@a@b＊：%a000100是嗎？\n@c0@"
