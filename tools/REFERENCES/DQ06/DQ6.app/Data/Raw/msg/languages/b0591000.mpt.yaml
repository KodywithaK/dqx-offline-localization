  tl: "@a@b%a002000：這樣啊……\n　　他說的似乎也有道理。\n@c0@"
196:
  en: "@a%0%a002010@bIt seems many of the locals are just as anxious as we are about the King's plan.\n@c0@"
  ja: "@a@b%a002010「お城の　人びとの\n\t不安は　なくなりそうも\n\tないわね。\n@c0@"
  ko: "@a@b%a002010: 성 사람들의\n불안은 가라앉을 것 같지\n않아.\n@c0@"
