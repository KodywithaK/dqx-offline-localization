184:
  en: "@a%0%a002030@bThe Princess's cat, perhaps? Its luxuriant coat suggests it lives in the lap of luxury.\n@c0@"
  ja: "@a@b%a002030「お姫さまの　飼っている\n\tネコでしょうか。\n\t毛が　つやつや　していますね。\n@c0@"
  ko: "@a@b%a002030: 공주님이 기르고 계신\n고양이일까요?\n털에서 윤기가 나는군요.\n@c0@"
  sl: "@a@b%a002030：这是公主养的猫吗？\n　　毛色真是鲜亮呢。\n@c0@"
  tl: "@a@b%a002030：這是公主養的貓嗎？\n　　毛色真是鮮亮呢。\n@c0@"
185:
  en: "@a%0%a002020@bAww... Even when I'm stressed out, kitties always calm me down.\n@c0@"
