  ja: "@a@b%a002050「さすが　伝説の防具！\n\tすばらしい細工が\n\tほどこしてありますね。\n@c0@"
  ko: "@a@b%a002050: 역시 전설의 방어구로군요!\n훌륭하게 세공되어\n있습니다.\n@c0@"
  sl: "@a@b%a002050：真不愧是传说中的防具！\n　　简直是巧夺天工啊。\n@c0@"
  tl: "@a@b%a002050：真不愧是傳說中的防具！\n　　簡直是巧奪天工啊。\n@c0@"
169:
  en: "@a%0%a002070@bB-Boing! B-Boing!\n@c0@"
  ja: "@a@b%a002070「プルプルルン！\n@c0@"
  ko: "@a@b%a002070: 뽀용뽀요요용!\n@c0@"
  sl: "@a@b%a002070：噗噜噗噜噜！\n@c0@"
  tl: "@a@b%a002070：噗嚕噗嚕嚕！\n@c0@"
170:
  en: "@a%0%a002000@bThat Princess has a point, ya know.\n@c0@"
  ja: "@a@b%a002000「この　姫さんが\n\t心配するのも　ムリはないぜ。\n@c0@"
  ko: "@a@b%a002000: 이 공주님이\n걱정하는 것도 당연한 일이지.\n@c0@"
