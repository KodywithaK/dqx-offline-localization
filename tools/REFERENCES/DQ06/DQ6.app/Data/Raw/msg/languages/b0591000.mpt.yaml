  sl: "@a@b%a002050：也就是所谓的\n　　“信主者得永生！”吧。\n@c0@"
  tl: "@a@b%a002050：也就是所謂的\n　　“信主者得永生！”吧。\n@c0@"
194:
  en: "@a%0%a002070@bBoing...\n@c0@"
  ja: "@a@b%a002070「プルルル……。\n@c0@"
  ko: "@a@b%a002070: 뽀르르르......\n@c0@"
  sl: "@a@b%a002070：噗噜噜噜……\n@c0@"
  tl: "@a@b%a002070：噗嚕嚕嚕……\n@c0@"
195:
  en: "@a%0%a002000@bThe man's got a point.\n@c0@"
  ja: "@a@b%a002000「なるほど……\n\tそりゃそうかも　しれないな。\n@c0@"
  ko: "@a@b%a002000: 맞아......\n그건 그렇지.\n@c0@"
