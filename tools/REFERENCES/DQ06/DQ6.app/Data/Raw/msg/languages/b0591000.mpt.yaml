  sl: "@a@b%a002070：噗噜噜。\n@c0@"
  tl: "@a@b%a002070：噗嚕嚕。\n@c0@"
188:
  en: "@a%0%a002000@bHuh. So this demon's got a thing for folks' hearts just like the Archfiend, aye?\n@c0@"
  ja: "@a@b%a002000「ひとの心の　暗闇を\n\tねらってくる　っていう話なら\n\t大魔王も　同じようなもんだな。\n@c0@"
  ko: "@a@b%a002000: 사람들 마음속의 어둠을\n노린다는 면에서는\n대마왕도 비슷한 존재겠군.\n@c0@"
  sl: "@a@b%a002000：恶魔会攻击\n　　人心中隐藏的黑暗，\n　　这简直和大魔王一样嘛。\n@c0@"
  tl: "@a@b%a002000：惡魔會攻擊\n　　人心中隱藏的黑暗，\n　　這簡直和大魔王一樣嘛。\n@c0@"
189:
  en: "@a%0%a002010@bI've no doubt that this demon has the power to see into the darkest corners of one's heart...\n@c0@"
  ja: "@a@b%a002010「悪魔は　したたかだから\n\tどんな　小さな　心のすきまも\n\t見のがさないでしょうね。\n@c0@"
