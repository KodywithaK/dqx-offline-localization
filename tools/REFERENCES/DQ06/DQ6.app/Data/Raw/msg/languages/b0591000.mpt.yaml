  tl: "@a@b%a002000：公主殿下的擔心\n　　也不是沒有道理的。\n@c0@"
171:
  en: "@a%0%a002010@bThey wouldn't be calling it a demon if it were a natural ally to humans...\n@c0@"
  ja: "@a@b%a002010「もともと　人間の味方なら\n\t悪魔とは　言われないはずよね。\n@c0@"
  ko: "@a@b%a002010: 인간의 편이라면 애초에\n악마라고 불리지도 않았을 거야.\n@c0@"
  sl: "@a@b%a002010：恶魔要是站在人类\n　　这一边的话，也就不会被称为恶魔了。\n@c0@"
  tl: "@a@b%a002010：惡魔要是站在人類\n　　這一邊的話，也就不會被稱為惡魔了。\n@c0@"
172:
  en: "@a%0%a002030@bI fear the Archfiend cannot be destroyed as easily as they hope.\n@c0@"
  ja: "@a@b%a002030「大魔王とて\n\tそうかんたんに　滅びるとも\n\t思えませんが……。\n@c0@"
  ko: "@a@b%a002030: 대마왕 역시\n그렇게 쉽게 쓰러질 거란 보장이\n없습니다만......\n@c0@"
  sl: "@a@b%a002030：我虽然不认为\n　　大魔王会这么\n　　轻易地就被消灭……\n@c0@"
  tl: "@a@b%a002030：我雖然不認為\n　　大魔王會這麼\n　　輕易地就被消滅……\n@c0@"
173:
  en: "@a%0%a002020@bHow can anyone predict what a demon's going to do?\n@c0@"
  ja: "@a@b%a002020「悪魔が　何するかなんて\n\t人間に　わかるはずないよ……。\n@c0@"
  ko: "@a@b%a002020: 악마가 무슨 짓을 할지\n인간이 어떻게 알아......\n@c0@"
  sl: "@a@b%a002020：人类是绝不可能知道\n　　恶魔会做出什么事的……\n@c0@"
  tl: "@a@b%a002020：人類是絕不可能知道\n　　惡魔會做出什麼事的……\n@c0@"
174:
  en: "@a%0%a002050@bIf only the demon and the Archfiend would destroy each other at the exact same time — how great would that be?\n@c0@"
  ja: "@a@b%a002050「大魔王と　悪魔が\n\tともだおれに　なってくれるのが\n\tいちばん　いいんですよね！\n@c0@"
  ko: "@a@b%a002050: 대마왕과 악마가\n함께 쓰러져 주는 게\n제일 좋겠네요!\n@c0@"
  sl: "@a@b%a002050：要是大魔王和恶魔\n　　打了个两败俱伤，\n　　那就最棒了！\n@c0@"
  tl: "@a@b%a002050：要是大魔王和惡魔\n　　打了個兩敗俱傷，\n　　那就最棒了！\n@c0@"
175:
  en: "@a%0%a002070@bBoing, boing.\n@c0@"
  ja: "@a@b%a002070「プルプル　ピキー！\n@c0@"
  ko: "@a@b%a002070: 뽀용뽀용~ 피키~!\n@c0@"
  sl: "@a@b%a002070：噗噜噗噜，哔叽！\n@c0@"
  tl: "@a@b%a002070：噗嚕噗嚕，嗶嘰！\n@c0@"
176:
  en: "@a%0%a002000@bSo he only eats monsters' souls? I dunno if I buy that...\n@c0@"
  ja: "@a@b%a002000「まものの　たましいだけを\n\t食べて　生きているのか？\n\t信じられんな。\n@c0@"
  ko: "@a@b%a002000: 마물의 영혼만\n먹고 산다고?\n못 믿겠군.\n@c0@"
  sl: "@a@b%a002000：真的只吃\n　　魔物们的魂魄吗？\n　　有些不太可信呢。\n@c0@"
  tl: "@a@b%a002000：真的只吃\n　　魔物們的魂魄嗎？\n　　有些不太可信呢。\n@c0@"
177:
  en: "@a%0%a002010@bThe Queen seems to have complete faith in her husband.\n@c0@"
  ja: "@a@b%a002010「王妃さまは　王さまを\n\t信頼されて　いるようね。\n@c0@"
  ko: "@a@b%a002010: 왕비님은 폐하를\n신뢰하고 계신가 봐.\n@c0@"
  sl: "@a@b%a002010：王妃似乎\n　　很信任国王呢。\n@c0@"
  tl: "@a@b%a002010：王妃似乎\n　　很信任國王呢。\n@c0@"
178:
  en: "@a%0%a002030@bEven scholars are capable of making mistakes. I fear it's too early to relax...\n@c0@"
  ja: "@a@b%a002030「学者さんだって\n\tまちがうことが　あるでしょう。\n\t安心するには　早いですよね。\n@c0@"
  ko: "@a@b%a002030: 아무리 학자라도\n틀릴 때가 있는 법.\n안심하기는 이릅니다.\n@c0@"
  sl: "@a@b%a002030：就算是学者，\n　　也会有犯错的时候吧。\n　　现在放心还太早了。\n@c0@"
  tl: "@a@b%a002030：就算是學者，\n　　也會有犯錯的時候吧。\n　　現在放心還太早了。\n@c0@"
179:
  en: "@a%0%a002020@bNobody here's even seen a real demon. What makes them think they're experts?\n@c0@"
  ja: "@a@b%a002020「悪魔なんて\n\tだれも　見たことないんだから\n\tホントのことは　わかんないよ。\n@c0@"
  ko: "@a@b%a002020: 아무도 악마를\n본 적이 없으니까\n진실은 아무도 몰라.\n@c0@"
  sl: "@a@b%a002020：既然没人见过恶魔，\n　　恐怕谁都不会知道\n　　真实的情况究竟是什么样呢。\n@c0@"
  tl: "@a@b%a002020：既然沒人見過惡魔，\n　　恐怕誰都不會知道\n　　真實的情況究竟是什麼樣呢。\n@c0@"
180:
  en: "@a%0%a002050@bSo if the scholar's right, this demon's terrifyin' to monsters but no bother for humans?\n@c0@"
  ja: "@a@b%a002050「もしそれが　本当なら\n\tまものにとっては　恐ろしい存在でも\n\t人間には　安全ですよね！\n@c0@"
  ko: "@a@b%a002050: 만약 그게 사실이라면\n마물에게는 무시무시한 존재라도\n인간한테는 안전하겠네요!\n@c0@"
  sl: "@a@b%a002050：要真是这样的话，\n　　对魔物可是个巨大的威胁，\n　　不过对人类来说倒是安全的呢！\n@c0@"
  tl: "@a@b%a002050：要真是這樣的話，\n　　對魔物可是個巨大的威脅，\n　　不過對人類來說倒是安全的呢！\n@c0@"
181:
  en: "@a%0%a002070@bBoing! (jiggle)\n@c0@"
  ja: "@a@b%a002070「プルプルーッ！\n@c0@"
  ko: "@a@b%a002070: 뽀용뽀용~!\n@c0@"
  sl: "@a@b%a002070：噗噜噗噜！\n@c0@"
  tl: "@a@b%a002070：噗嚕噗嚕！\n@c0@"
182:
  en: "@a%0%a002000@bCats have it good, aye? He has no idea what's goin' on.\n@c0@"
  ja: "@a@b%a002000「ネコは　なにも\n\t知らなくて　しあわせだぜ。\n@c0@"
  ko: "@a@b%a002000: 고양이는 아무것도\n몰라서 행복하겠군.\n@c0@"
  sl: "@a@b%a002000：小猫什么\n　　都不知道，真是幸福啊。\n@c0@"
  tl: "@a@b%a002000：小貓什麼\n　　都不知道，真是幸福啊。\n@c0@"
183:
