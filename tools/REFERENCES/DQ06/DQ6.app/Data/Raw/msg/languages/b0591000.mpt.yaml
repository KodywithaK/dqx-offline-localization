  sl: "@a@b%a002020：等到世界和平了……\n　　意思是说\n　　她相信仪式会顺利地进行吧……\n@c0@"
  tl: "@a@b%a002020：等到世界和平了……\n　　意思是說\n　　她相信儀式會順利地進行吧……\n@c0@"
235:
  en: "@a%0%a002050@bWhat old %a002050 wouldn't give for a daughter like that...\n@c0@"
  ja: "@a@b%a002050「うう…　いい娘ですね。\n\t私にも　こんな娘が　いたら\n\t安心して　病気になれるのに……。\n@c0@"
  ko: "@a@b%a002050: 으흑... 착한 따님이군요.\n저한테도 이런 딸이 있다면\n안심하고 병상에 누울 텐데......\n@c0@"
  sl: "@a@b%a002050：呜呜……真是个好姑娘。\n　　要是有个这样的女孩在身边，\n　　我即使生了病也不会担心了……\n@c0@"
