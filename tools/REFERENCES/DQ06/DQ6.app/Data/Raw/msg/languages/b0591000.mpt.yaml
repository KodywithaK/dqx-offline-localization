  sl: "@a@b%a002030：不过如果\n　　是特意去召唤恶魔的话，\n　　可就又是两回事了……\n@c0@"
  tl: "@a@b%a002030：不過如果\n　　是特意去召喚惡魔的話，\n　　可就又是兩回事了……\n@c0@"
192:
  en: "@a%0%a002020@bNo offence to the priest, but things here have gotten a little too serious for faith and prayers alone.\n@c0@"
