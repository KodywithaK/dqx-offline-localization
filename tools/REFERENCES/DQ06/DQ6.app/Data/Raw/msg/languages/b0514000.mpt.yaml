  ko: "@a@b%a002000: 낭, 낭패다. \n%a000090%F0090%X가%Y이%Z 왕자가 아닌 걸 \n알아보는 인간도 있나 봐. \n@c0@"
  sl: "@a@b%a002000：啊，不妙了。\n　　%a000090你假扮王子，\n　　竟然还有人能看出来。\n@c0@"
  tl: "@a@b%a002000：啊，不妙了。\n　　%a000090你假扮王子，\n　　竟然還有人能看出來。\n@c0@"
64:
  en: "@a%0%a002010@bThis child is sharp. Dream seers often claim that innocent eyes are best equipped to see the truth.\n@c0@"
  ja: "@a@b%a002010「子供は　するどいわ。\n\tすなおな　目には\n\t真実が　よく見えるものなのよ。\n@c0@"
