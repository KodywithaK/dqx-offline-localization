  sl: "@a@b%a002000：他这么说……\n　　不知道是信还是不信，\n　　感觉有点奇怪……\n@c0@"
  tl: "@a@b%a002000：他這麼說……\n　　不知道是信還是不信，\n　　感覺有點奇怪……\n@c0@"
72:
  en: "@a%0%a002010@bUgh. These cells are all damp and horrible.\n@c0@"
