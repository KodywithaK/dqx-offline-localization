66:
  en: "@a%0%a002010@bWhat an adorable little kitty!\n@c0@"
  ja: "@a@b%a002010「ニャンちゃん\n\tこんにちは。\n@c0@"
  ko: "@a@b%a002010: 야옹아,\n안녕.\n@c0@"
  sl: "@a@b%a002010：小猫咪，\n　　你好啊。\n@c0@"
  tl: "@a@b%a002010：小貓咪，\n　　你好啊。\n@c0@"
67:
  en: "@a%0%a002000@bWhoa, that's some spicy soup! If that won't wake up the King, nothin' will.\n@c0@"
  ja: "@a@b%a002000「とんがらしのスープで\n\t起きるくらいなら　もうとっくに\n\t起きているんじゃないか……？\n@c0@"
