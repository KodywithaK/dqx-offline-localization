  sl: "@a@b%a002000：唤醒之书？\n　　俺不管看什么书，\n　　只会越看越困。\n@c0@"
  tl: "@a@b%a002000：喚醒之書？\n　　俺不管看什麼書，\n　　只會越看越睏。\n@c0@"
70:
