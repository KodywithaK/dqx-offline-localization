69:
  en: "@a%0%a002000@bReadin' books about stayin' awake would put me right to sleep.\n@c0@"
  ja: "@a@b%a002000「目のさめる本？\n\tオレなんか　どんな本を　読んでも\n\tすぐに　ねむくなるぜ。\n@c0@"
