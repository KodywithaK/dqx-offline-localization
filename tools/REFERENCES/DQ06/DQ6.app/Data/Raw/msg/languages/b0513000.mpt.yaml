0:
  en: "@a%0%a002000@bI'm gettin' tired. It'd be nice to see the inside of an inn right about now…\n@c0@"
  ja: "@a@b%a002000「ちょっと　つかれたぜ。\n\tこんなときは　宿で休む　なんてのも\n\tいいかもな。\n@c0@"
  ko: "@a@b%a002000: 살짝 피곤하군.\n이럴 때는 여관에서라도\n쉬는 게 나을지도 몰라.\n@c0@"
  sl: "@a@b%a002000：有点累了啊。\n　　现在能去旅店休息一下就好了。\n@c0@"
  tl: "@a@b%a002000：有點累了啊。\n　　現在能去旅店休息一下就好了。\n@c0@"
1:
  en: "@a%0%a002010@bThe Chief must be relieved to have Cynthia back safe and sound.\n@c0@"
  ja: "@a@b%a002010「娘さんが　無事だったから\n\t町長さんも　ホッとしているでしょうね。\n@c0@"
  ko: "@a@b%a002010: 따님이 무사해서\n촌장님도 한시름 놓았을 거야.\n@c0@"
  sl: "@a@b%a002010：小妹妹平安无事，\n　　镇长先生也就放心了吧。\n@c0@"
  tl: "@a@b%a002010：小妹妹平安無事，\n　　鎮長先生也就放心了吧。\n@c0@"
2:
  en: "@a%0%a002020@bI bet Cynthia's back home by now.\n@c0@"
  ja: "@a@b%a002020「エリザちゃん\n\tいまごろ　お家だね　きっと。\n@c0@"
  ko: "@a@b%a002020: 엘리자는 분명\n지금쯤 집에 있을 거야.\n@c0@"
  sl: "@a@b%a002020：艾莉莎妹妹现在一定在家吧。\n@c0@"
  tl: "@a@b%a002020：艾莉莎妹妹現在一定在家吧。\n@c0@"
3:
  en: "@a%0%a002030@bI would imagine that the Chief and his newly rescued daughter have returned to their home.\n@c0@"
  ja: "@a@b%a002030「町長さんたちは\n\tもう　自分の　お家に\n\tもどっているでしょうかね。\n@c0@"
  ko: "@a@b%a002030: 촌장님 일행은\n이미 댁에\n돌아가셨겠죠.\n@c0@"
  sl: "@a@b%a002030：镇长已经回到自己家里了吧。\n@c0@"
  tl: "@a@b%a002030：鎮長已經回到自己家裡了吧。\n@c0@"
4:
  en: "@a%0%a002050@bIf those kidnappers show their faces here again, old %a002050 will be the first to show 'em what for!\n@c0@"
  ja: "@a@b%a002050「もしまた　犯人たちが\n\tこの町に　いたら\n\t私が　とっちめて　やりますから！\n@c0@"
  ko: "@a@b%a002050: 혹시 또 범인들이\n이 마을에 있다면\n제가 혼쭐을 내주겠습니다!\n@c0@"
  sl: "@a@b%a002050：如果那两个坏蛋\n　　还在这镇上的话，\n　　要好好教训他们一下！\n@c0@"
  tl: "@a@b%a002050：如果那兩個壞蛋\n　　還在這鎮上的話，\n　　要好好教訓他們一下！\n@c0@"
5:
  en: "@a%0%a002000@bGood thing we weren't still transparent, or Goddess knows what woulda happened!\n@c0@"
  ja: "@a@b%a002000「自分の　カラダが\n\tとうめいの　ままだったら\n\t助けてやれなかったよ。　あぶねー。\n@c0@"
  ko: "@a@b%a002000: 몸이 계속해서\n투명한 상태였다면\n도와줄 수 없었어. 큰일 날뻔했지.\n@c0@"
  sl: "@a@b%a002000：要是像以前一样，\n　　身体还是透明的，\n　　这次就没法帮忙了。万幸万幸。\n@c0@"
  tl: "@a@b%a002000：要是像以前一樣，\n　　身體還是透明的，\n　　這次就沒法幫忙了。萬幸萬幸。\n@c0@"
6:
  en: "@a%0%a002010@bI dread to think what would have happened if we'd arrived just a little later...\n@c0@"
  ja: "@a@b%a002010「私たちの　行くのが\n\tもう少し　おそかったら\n\t娘さん　あぶなかったかもね。\n@c0@"
  ko: "@a@b%a002010: 우리가 조금만 더\n늦었더라면\n촌장님 따님, 큰일 날뻔했어.\n@c0@"
  sl: "@a@b%a002010：要是我们再去得晚一点，\n　　小妹妹就危险了。\n@c0@"
  tl: "@a@b%a002010：要是我們再去得晚一點，\n　　小妹妹就危險了。\n@c0@"
7:
  en: "@a%0%a002020@bThere's nothing this crew can't accomplish. Go team!\n@c0@"
  ja: "@a@b%a002020「あたしたち\n\tがんばったものね！\n@c0@"
  ko: "@a@b%a002020: 우리가\n열심히 했거든!\n@c0@"
  sl: "@a@b%a002020：我们也很努力呀！\n@c0@"
  tl: "@a@b%a002020：我們也很努力呀！\n@c0@"
8:
  en: "@a%0%a002030@bIt seems the people of this village have found peace.\n@c0@"
  ja: "@a@b%a002030「どうやら　みなさんも\n\t安心しているようですね。\n@c0@"
  ko: "@a@b%a002030: 아무래도 다들\n안심하고 있는 것 같습니다.\n@c0@"
  sl: "@a@b%a002030：看起来，大家都安心了。\n@c0@"
  tl: "@a@b%a002030：看起來，大家都安心了。\n@c0@"
9:
  en: "@a%0%a002050@bSeems a sense of ‘well’-being has returned to Wellshire! …Geddit?\n@c0@"
  ja: "@a@b%a002050「よかったです　よかったです。\n@c0@"
  ko: "@a@b%a002050: 잘됐네요, 천만다행입니다.\n@c0@"
  sl: "@a@b%a002050：太好了，太好了。\n@c0@"
  tl: "@a@b%a002050：太好了，太好了。\n@c0@"
10:
  en: "@a%0%a002000@bThe light doesn't look any brighter to me. Everyone seems happier, though, so that's good.\n@c0@"
  ja: "@a@b%a002000「オレたちに　かかれば\n\tこんな　事件くらい\n\tあっというまに　解決だぜ！\n@c0@"
  ko: "@a@b%a002000: 우리한테 걸리면\n이 정도 사건 쯤은\n후딱 해치울 수 있지!\n@c0@"
  sl: "@a@b%a002000：只要有咱们在，\n　　这点小事情，\n　　马上就能解决了！\n@c0@"
  tl: "@a@b%a002000：只要有咱們在，\n　　這點小事情，\n　　馬上就能解決了！\n@c0@"
11:
  en: "@a%0%a002010@bI'm just glad nothing untoward happened to her...\n@c0@"
  ja: "@a@b%a002010「ホント　娘さんに\n\t何もなくて　よかったわね。\n@c0@"
  ko: "@a@b%a002010: 따님이 무사해서\n정말 다행이야.\n@c0@"
  sl: "@a@b%a002010：小妹妹平安，\n　　真是太让人高兴了。\n@c0@"
  tl: "@a@b%a002010：小妹妹平安，\n　　真是太讓人高興了。\n@c0@"
12:
  en: "@a%0%a002000@bAye, all's clear. Those two can get back to their childhoods now.\n@c0@"
  ja: "@a@b%a002000「もう　大丈夫だから\n\tどんどん　あそびに行っていいぞ！\n@c0@"
  ko: "@a@b%a002000: 이젠 괜찮으니까\n맘껏 놀러 다녀도 돼!\n@c0@"
  sl: "@a@b%a002000：已经没事了，\n　　尽情地玩去吧！\n@c0@"
  tl: "@a@b%a002000：已經沒事了，\n　　盡情地玩去吧！\n@c0@"
13:
  en: "@a%0%a002010@bThose thugs might be gone, but children should still be careful when playing outside town.\n@c0@"
  ja: "@a@b%a002010「犯人たちは　いないけど\n\t町から　遠いから　気をつけてね。\n@c0@"
  ko: "@a@b%a002010: 범인들은 없지만\n마을에서 멀리 떨어졌으니 조심해.\n@c0@"
  sl: "@a@b%a002010：坏蛋虽然不在了，\n　　但那里毕竟离镇子很远，还是要小心啊。\n@c0@"
  tl: "@a@b%a002010：壞蛋雖然不在了，\n　　但那裡畢竟離鎮子很遠，還是要小心啊。\n@c0@"
14:
  en: "@a%0%a002050@bThat's the spirit! It's good to see young'uns with a sense of adventure.\n@c0@"
  ja: "@a@b%a002050「子供は　元気で\n\tいいですねー。\n@c0@"
  ko: "@a@b%a002050: 아이들이 활기차서\n보기 좋군요.\n@c0@"
  sl: "@a@b%a002050：小孩子健康活泼真好啊。\n@c0@"
  tl: "@a@b%a002050：小孩子健康活潑真好啊。\n@c0@"
15:
  en: "@a%0%a002000@bNow that's a kid after my own heart. \n@c0@"
  ja: "@a@b%a002000「オレは　もともと強いから\n\tどんな　ムチャだって　できたぜ！\n@c0@"
  ko: "@a@b%a002000: 나는 원래부터 힘이 세서\n어떤 모험도 가능했어!\n@c0@"
  sl: "@a@b%a002000：俺本来就很强，\n　　所以怎么淘气都可以！\n@c0@"
  tl: "@a@b%a002000：俺本來就很強，\n　　所以怎麼淘氣都可以！\n@c0@"
16:
  en: "@a%0%a002010@bHee hee. Reckless boys can be exasperating, but they do have a certain charm.\n@c0@"
  ja: "@a@b%a002010「うふっ　そうね。\n\tちょっと　あぶない男の子のほうが\n\tみりょくは　あるかもね。\n@c0@"
  ko: "@a@b%a002010: 우훗, 맞아.\n조금은 위험한 남자가\n매력적이긴 해.\n@c0@"
  sl: "@a@b%a002010：呵呵，是啊。\n　　看起来有点危险的男孩，\n　　似乎更加有魅力啊。\n@c0@"
  tl: "@a@b%a002010：呵呵，是啊。\n　　看起來有點危險的男孩，\n　　似乎更加有魅力啊。\n@c0@"
17:
  en: "@a%0%a002020@bYep, definitely more mature than me...\n@c0@"
  ja: "@a@b%a002020「やっぱ　この子\n\tあたしより　大人だわ……。\n@c0@"
  ko: "@a@b%a002020: 이 아이는 역시\n나보다 어른이네......\n@c0@"
  sl: "@a@b%a002020：这孩子果然比我成熟啊……\n@c0@"
  tl: "@a@b%a002020：這孩子果然比我成熟啊……\n@c0@"
18:
  en: "@a%0%a002030@bYouthful high spirits are all well and good, but one should draw the line at out-and-out mischief!\n@c0@"
  ja: "@a@b%a002030「ムチャは　いけません\n\tムチャは。\n\tいつも　冷静なのが　いちばんです。\n@c0@"
  ko: "@a@b%a002030: 무턱대고\n모험을 해서는 안 됩니다.\n언제나 냉정한 판단이 최고죠.\n@c0@"
  sl: "@a@b%a002030：太淘气可不好啊。\n　　还是安静点比较好。\n@c0@"
  tl: "@a@b%a002030：太淘氣可不好啊。\n　　還是安靜點比較好。\n@c0@"
19:
  en: "@a%0%a002050@bI got up to my fair share of mischief when I was a nipper! Grand days, they were!\n@c0@"
  ja: "@a@b%a002050「はい！\n\t私も　ムチャばかりして\n\t強くなりました。\n@c0@"
  ko: "@a@b%a002050: 네!\n저도 무조건 모험만 해서\n강하게 되었습니다.\n@c0@"
  sl: "@a@b%a002050：没错！\n　　我就是在淘气的过程中变强的。\n@c0@"
  tl: "@a@b%a002050：沒錯！\n　　我就是在淘氣的過程中變強的。\n@c0@"
20:
  en: "@a%0%a002000@bI don't know about parenting, but havin' a pretty daughter must bring its own set of hassles for parents.\n@c0@"
  ja: "@a@b%a002000「キレイな　娘がいたら\n\tそれは　また　それで\n\t心配なんだろうけどな。\n@c0@"
  ko: "@a@b%a002000: 예쁜 딸이 있으면\n좋긴 하지만, 그만큼\n걱정도 많겠지.\n@c0@"
  sl: "@a@b%a002000：女儿长得漂亮，\n　　恐怕也有长得漂亮的烦恼吧。\n@c0@"
  tl: "@a@b%a002000：女兒長得漂亮，\n　　恐怕也有長得漂亮的煩惱吧。\n@c0@"
21:
  en: "@a%0%a002010@bMen and their simple minds... I'm sure his wife is a wonderful woman.\n@c0@"
  ja: "@a@b%a002010「男の人の\n\t考えって　単純ね。\n@c0@"
  ko: "@a@b%a002010: 남자들의\n생각은 참 단순해.\n@c0@"
  sl: "@a@b%a002010：男人的头脑真简单。\n@c0@"
  tl: "@a@b%a002010：男人的頭腦真簡單。\n@c0@"
22:
  en: "@a%0%a002020@bRemind me to never get married to a guy like this...\n@c0@"
  ja: "@a@b%a002020「おじさんに　似たら\n\t無理かも……。\n@c0@"
  ko: "@a@b%a002020: 아저씨를 닮았다면\n좀 어렵겠어......\n@c0@"
  sl: "@a@b%a002020：长得像大叔的话\n　　就惨了……\n@c0@"
  tl: "@a@b%a002020：長得像大叔的話\n　　就慘了……\n@c0@"
23:
  en: "@a%0%a002030@bI'm sorry to hear that this fellow is hen-pecked, but we hardly have time to hear about his woes!\n@c0@"
  ja: "@a@b%a002030「人は　見た目では\n\tありません。\n\tココロが　きれいなのが　何よりです。\n@c0@"
  ko: "@a@b%a002030: 사람을 겉보기로\n판단하면 안 됩니다.\n마음씨 착한 게 최고죠.\n@c0@"
  sl: "@a@b%a002030：以貌取人可不好。\n　　心灵美比什么都重要。\n@c0@"
  tl: "@a@b%a002030：以貌取人可不好。\n　　心靈美比什麼都重要。\n@c0@"
24:
  en: "@a%0%a002050@bI wouldn't mind havin' a ray of sunshine to brighten up my day, let me tell you!\n@c0@"
  ja: "@a@b%a002050「私も　キレイな　娘が\n\tほしいものです。\n@c0@"
  ko: "@a@b%a002050: 저도 예쁜 딸이\n하나 있으면 좋겠어요.\n@c0@"
  sl: "@a@b%a002050：我也想要个漂亮的女儿。\n@c0@"
  tl: "@a@b%a002050：我也想要個漂亮的女兒。\n@c0@"
25:
  en: "@a%0%a002050@bBut there's plenty of adventurin' to be done before old %a002050 can settle down and raise a family!\n@c0@"
  ja: "@a@b%a002050「ま…\n\tその前に　キレイな　お嫁さんが\n\tほしいですけど……。\n@c0@"
  ko: "@a@b%a002050: 뭐...\n그 전에 예쁜 신부부터\n필요하겠지만......\n@c0@"
  sl: "@a@b%a002050：啊……\n　　不过在那之前，\n　　得先有个漂亮的老婆……\n@c0@"
  tl: "@a@b%a002050：啊……\n　　不過在那之前，\n　　得先有個漂亮的老婆……\n@c0@"
26:
  en: "@a%0%a002000@bWhat a cute pooch. Nothin' to worry 'bout now, is there!\n@c0@"
  ja: "@a@b%a002000「よし　よし！\n\tもう何も　心配しなくて\n\tいいんだからな！\n@c0@"
  ko: "@a@b%a002000: 그래 그래!\n이제 아무 걱정\n안 해도 돼!\n@c0@"
  sl: "@a@b%a002000：好了好了！\n　　现在什么都不用担心了！\n@c0@"
  tl: "@a@b%a002000：好了好了！\n　　現在什麼都不用擔心了！\n@c0@"
27:
  en: "@a%0%a002010@bAww, he must've been so worried about Cynthia. What a clever pup!\n@c0@"
  ja: "@a@b%a002010「娘さんのこと\n\tずっと　心配していたのね。\n\tおりこうさん。\n@c0@"
  ko: "@a@b%a002010: 내내 주인 아가씨\n걱정을 했구나.\n기특해라.\n@c0@"
  sl: "@a@b%a002010：它一直在担心小妹妹啊。\n　　真是个好孩子。\n@c0@"
  tl: "@a@b%a002010：它一直在擔心小妹妹啊。\n　　真是個好孩子。\n@c0@"
28:
  en: "@a%0%a002020@bThat poor puppy. But everything's dandy now!\n@c0@"
  ja: "@a@b%a002020「ワンちゃん！\n\tもう　大丈夫だよ！\n@c0@"
  ko: "@a@b%a002020: 멍멍아!\n이젠 괜찮아!\n@c0@"
  sl: "@a@b%a002020：小狗狗！\n　　已经没事啦！\n@c0@"
  tl: "@a@b%a002020：小狗狗！\n　　已經沒事啦！\n@c0@"
29:
  en: "@a%0%a002030@bI get the distinct feeling that this dog knew exactly what was going on...\n@c0@"
  ja: "@a@b%a002030「ちゃんと　すべてが\n\tわかっているのでしょう。\n\tかしこいですね。\n@c0@"
  ko: "@a@b%a002030: 모든 걸 똑똑히\n알고 있나 봅니다.\n영리하군요.\n@c0@"
  sl: "@a@b%a002030：它已经全都明白了吧。\n　　真是聪明啊。\n@c0@"
  tl: "@a@b%a002030：它已經全都明白了吧。\n　　真是聰明啊。\n@c0@"
30:
  en: "@a%0%a002050@bSeems my doggy chum's perked up! Looks like he's as happy to see Cynthia as everyone else!\n@c0@"
  ja: "@a@b%a002050「ワンくん！\n\tエリザさんが　無事で\n\tよかったな！\n@c0@"
  ko: "@a@b%a002050: 멍멍이 친구!\n엘리자 씨가 무사해서\n기쁘겠구나!\n@c0@"
  sl: "@a@b%a002050：小狗！\n　　艾莉莎姑娘平安，\n　　真是太好了！\n@c0@"
  tl: "@a@b%a002050：小狗！\n　　艾莉莎姑娘平安，\n　　真是太好了！\n@c0@"
31:
  en: "@a%0%a002000@bI'm just glad they didn't hurt the lass.\n@c0@"
  ja: "@a@b%a002000「うんうん！\n\tキズひとつ　なかったんだ。\n\t本当に　よかったぜ！\n@c0@"
  ko: "@a@b%a002000: 응, 맞아!\n상처 하나 없이 깨끗하니\n정말 다행이야!\n@c0@"
  sl: "@a@b%a002000：嗯嗯！\n　　她没有受伤。\n　　真是太好了！\n@c0@"
  tl: "@a@b%a002000：嗯嗯！\n　　她沒有受傷。\n　　真是太好了！\n@c0@"
32:
  en: "@a%0%a002010@bWell, it's all over now, so hopefully she can relax and get on with her life.\n@c0@"
  ja: "@a@b%a002010「もう　終わったのだから\n\tできれば　事件のことは\n\t忘れてしまえるといいわね。\n@c0@"
  ko: "@a@b%a002010: 이미 끝난 일이니\n되도록 그 사건은\n잊어버리면 좋겠어.\n@c0@"
  sl: "@a@b%a002010：事情已经过去了，\n　　希望她能尽早忘掉吧。\n@c0@"
  tl: "@a@b%a002010：事情已經過去了，\n　　希望她能儘早忘掉吧。\n@c0@"
33:
  en: "@a%0%a002020@bI'm glad we were able to help Cynthia!\n@c0@"
  ja: "@a@b%a002020「エリザちゃん\n\t助かって　よかったね！\n@c0@"
