  ko: "@a@b%a002010: 따님도 무사히 집으로 돌아왔고\n마을이 다시 평온해졌어.\n@c0@"
  sl: "@a@b%a002010：小妹妹平安地回家了，\n　　镇上也该恢复平静了吧。\n@c0@"
  tl: "@a@b%a002010：小妹妹平安地回家了，\n　　鎮上也該恢復平靜了吧。\n@c0@"
68:
  en: "@a%0%a002020@bHey, since we're here, why don't we pay a visit to Cynthia's house?\n@c0@"
  ja: "@a@b%a002020「ねえねえ　せっかくだから\n\tエリザちゃん家に　よって行こうよ！\n@c0@"
  ko: "@a@b%a002020: 있잖아, 모처럼 왔으니\n엘리자네 들렀다 가자!\n@c0@"
  sl: "@a@b%a002020：喂喂，既然来了，\n　　就去艾莉莎妹妹家看看吧！\n@c0@"
  tl: "@a@b%a002020：喂喂，既然來了，\n　　就去艾莉莎妹妹家看看吧！\n@c0@"
69:
  en: "@a%0%a002030@b%0%a000090, do we have any further business in this village?\n@c0@"
  ja: "@a@b%a002030「%a000090さん。\n\tまだ　この町に　なにか\n\t用事があるのですか？\n@c0@"
  ko: "@a@b%a002030: %a000090 님.\n아직도 이 마을에\n볼일이 남아 있나요?\n@c0@"
  sl: "@a@b%a002030：%a000090。\n　　在这个镇子上，\n　　还有什么事没做吗？\n@c0@"
  tl: "@a@b%a002030：%a000090。\n　　在這個鎮子上，\n　　還有什麼事沒做嗎？\n@c0@"
70:
  en: "@a%0%a002030@bIf not, I'd humbly suggest that we be on our way.\n@c0@"
  ja: "@a@b%a002030「ないのでしたら\n\t先を　いそぎませんか？\n@c0@"
  ko: "@a@b%a002030: 없으시면\n어서 가실까요?\n@c0@"
  sl: "@a@b%a002030：没其他事情的话，\n　　就继续旅行吧？\n@c0@"
  tl: "@a@b%a002030：沒其他事情的話，\n　　就繼續旅行吧？\n@c0@"
71:
  en: "@a%0%a002000@bSeems it's the same price comin' or goin'.\n@c0@"
  ja: "@a@b%a002000「ふむふむ。\n\tちゃんと　行きも　帰りも\n\t同じ　ねだんだな。\n@c0@"
  ko: "@a@b%a002000: 흠흠.\n확실히 가는 것도 오는 것도\n같은 가격이군.\n@c0@"
  sl: "@a@b%a002000：嗯嗯。\n　　不管是去还是回，\n　　价格都一样啊。\n@c0@"
  tl: "@a@b%a002000：嗯嗯。\n　　不管是去還是回，\n　　價格都一樣啊。\n@c0@"
72:
  en: "@a%0%a002010@bIt'd be nice to make the return trip by ferry as well. It's so relaxing...\n@c0@"
  ja: "@a@b%a002010「帰りも　船旅\n\tというのも　のんびりしてて\n\tいいかも　しれないわね。\n@c0@"
  ko: "@a@b%a002010: 배를 타고\n돌아가는 것도 괜찮겠어.\n여유롭게 말이지.\n@c0@"
  sl: "@a@b%a002010：回程也坐船，\n　　悠闲的旅行也不错啊。\n@c0@"
  tl: "@a@b%a002010：回程也坐船，\n　　悠閒的旅行也不錯啊。\n@c0@"
73:
  en: "@a%0%a002000@bKeep this between you 'n' me, but I get seasick sometimes. Only when I'm on a boat, of course.\n@c0@"
  ja: "@a@b%a002000「じつは　オレ\n\tちょっとだけ　船に　弱いんだが……。\n@c0@"
  ko: "@a@b%a002000: 사실 난\n배에 좀 약한데......\n@c0@"
  sl: "@a@b%a002000：俺其实\n　　有点晕船……\n@c0@"
  tl: "@a@b%a002000：俺其實\n　　有點暈船……\n@c0@"
74:
  en: "@a%0%a002010@bNo matter how you travel, as long as you're with good company, any journey can be enjoyable.\n@c0@"
  ja: "@a@b%a002010「いっしょにいる\n\tメンバーが　たのしければ\n\tどんな旅も　たのしいものよね。\n@c0@"
  ko: "@a@b%a002010: 함께 다니는\n일행이 즐거우면\n어떤 여행도 즐거워.\n@c0@"
  sl: "@a@b%a002010：只要能跟伙伴们\n　　快快乐乐地在一起，\n　　什么样的旅程都会变得有趣起来。\n@c0@"
  tl: "@a@b%a002010：只要能跟夥伴們\n　　快快樂樂地在一起，\n　　什麼樣的旅程都會變得有趣起來。\n@c0@"
75:
  en: "@a%0%a002000@bAhoy! I suppose we're bound for Somnia next, aye, %a000090?\n@c0@"
  ja: "@a@b%a002000「よっしゃ　%a000090！\n\tレイドック城を　めざすとするか。\n@c0@"
  ko: "@a@b%a002000: 좋았어, %a000090!\n이제 레이독 성으로 가보자고.\n@c0@"
  sl: "@a@b%a002000：走吧%a000090！\n　　目标雷多克城。\n@c0@"
  tl: "@a@b%a002000：走吧%a000090！\n　　目標雷多克城。\n@c0@"
76:
  en: "@a%0%a002010@bWhat a pleasant voyage. The view was fantastic!\n@c0@"
  ja: "@a@b%a002010「いい　船旅だったわね。\n\tとちゅうの　けしきも\n\tすてきだったわ。\n@c0@"
  ko: "@a@b%a002010: 좋은 여행이였어.\n오는 도중 경치도\n멋있었고 말이야.\n@c0@"
  sl: "@a@b%a002010：坐船旅行真好啊。\n　　途中的景色多漂亮。\n@c0@"
  tl: "@a@b%a002010：坐船旅行真好啊。\n　　途中的景色多漂亮。\n@c0@"
77:
  en: "@a%0%a002000@bOther passengers? I never noticed. I spent the whole voyage bowin' over the bow...\n@c0@"
  ja: "@a@b%a002000「ほかの　お客もいたんだな。\n\tずっと　甲板の先に　立ってたから\n\t気づかなかったよ。\n@c0@"
  ko: "@a@b%a002000: 다른 손님도 있었군.\n계속 갑판 끝에 서 있어서\n전혀 몰랐어.\n@c0@"
  sl: "@a@b%a002000：还有别的客人啊。\n　　咱一直站在甲板前头，\n　　都没注意到。\n@c0@"
  tl: "@a@b%a002000：還有別的客人啊。\n　　咱一直站在甲板前頭，\n　　都沒注意到。\n@c0@"
78:
  en: "@a%0%a002010@bOther passengers can do as they please. We'll continue our journey at our own pace.\n@c0@"
  ja: "@a@b%a002010「私たちは\n\t私たちの　ペースで\n\t旅を　続けましょ。\n@c0@"
  ko: "@a@b%a002010: 우리는\n우리 페이스대로\n여행을 계속하자.\n@c0@"
  sl: "@a@b%a002010：我们就以自己的步调，\n　　继续旅行吧。\n@c0@"
  tl: "@a@b%a002010：我們就以自己的步調，\n　　繼續旅行吧。\n@c0@"
79:
  en: "@a%0%a002000@bLooks like it'll be a while before we can sail back, aye?\n@c0@"
  ja: "@a@b%a002000「ふーん。\n\t次の船は　すぐには\n\t出航しないってことか。\n@c0@"
  ko: "@a@b%a002000: 으흠.\n다음 배는 바로\n출항하지 않는단 말이군.\n@c0@"
  sl: "@a@b%a002000：嗯。\n　　下一班船\n　　现在还不出发吗。\n@c0@"
  tl: "@a@b%a002000：嗯。\n　　下一班船\n　　現在還不出發嗎。\n@c0@"
80:
  en: "@a%0%a002010@bWe've no plans to head back just yet anyway. First we need to have a look at Somnia Castle.\n@c0@"
  ja: "@a@b%a002010「今すぐ　もどるわけでもないし。\n\tさあ　レイドック城を　めざしましょう。\n@c0@"
  ko: "@a@b%a002010: 당장 돌아갈 건 아니니까.\n자, 레이독 성으로 가자.\n@c0@"
  sl: "@a@b%a002010：现在没理由回去吧。\n　　走吧，向雷多克城进发。\n@c0@"
  tl: "@a@b%a002010：現在沒理由回去吧。\n　　走吧，向雷多克城進發。\n@c0@"
81:
  en: "@a%0%a002000@bHow far is it between here 'n' Somnia, I wonder?\n@c0@"
  ja: "@a@b%a002000「レイドック城まで\n\tここから　どのくらいの\n\tきょり　なんだろうな。\n@c0@"
  ko: "@a@b%a002000: 레이독 성까지는\n여기서 거리가\n얼마나 될까?\n@c0@"
  sl: "@a@b%a002000：不知道雷多克城离这里有多远。\n@c0@"
  tl: "@a@b%a002000：不知道雷多克城離這裡有多遠。\n@c0@"
82:
  en: "@a%0%a002010@bSomnia must be quite a city if merchants are this enthusiastic about it.\n@c0@"
  ja: "@a@b%a002010「商人さんも　はりきっている\n\tということは　レイドックは\n\tにぎやかな町なんでしょうね。\n@c0@"
  ko: "@a@b%a002010: 상인들의 기운이\n넘치는 걸 보면 레이독은 분명\n번화한 마을일 거야.\n@c0@"
  sl: "@a@b%a002010：商人先生这么兴奋，\n　　想必雷多克城很热闹吧。\n@c0@"
  tl: "@a@b%a002010：商人先生這麼興奮，\n　　想必雷多克城很熱鬧吧。\n@c0@"
83:
  en: "@a%0%a002000@bNorth from the western mountains... Or was it west from the northern mountains?\n@c0@"
  ja: "@a@b%a002000「レイドックへは\n\t西の岩山を　北から……\n\tちょっと　西へ……\n@c0@"
  ko: "@a@b%a002000: 레이독에 가려면\n서쪽 바위산에서 북쪽으로......\n그리고 서쪽으로 조금......\n@c0@"
  sl: "@a@b%a002000：要去雷多克城，\n　　要从西边的石山往北……\n　　然后往西……\n@c0@"
  tl: "@a@b%a002000：要去雷多克城，\n　　要從西邊的石山往北……\n　　然後往西……\n@c0@"
84:
  en: "@a%0%a002000@bOne thing's for sure — I definitely heard ‘west’.  Uh, maybe you should handle the navigatin', %a000090...\n@c0@"
  ja: "@a@b%a002000「ようするに\n\t西に行けば　いいんだな。\n\t%a000090　まかせたぜ！\n@c0@"
  ko: "@a@b%a002000: 그러니까\n서쪽으로 가면 된다 이거군.\n%a000090, 네게 맡기겠어!\n@c0@"
  sl: "@a@b%a002000：总之往西走就行了吧。\n　　%a000090，方向就拜托你了！\n@c0@"
  tl: "@a@b%a002000：總之往西走就行了吧。\n　　%a000090，方向就拜託你了！\n@c0@"
85:
  en: "@a%0%a002010@bSo we travel north around the mountains to the west, and Somnia Castle should be west of there? Sounds simple enough.\n@c0@"
  ja: "@a@b%a002010「レイドック城は　ここから\n\t西の岩山を　北からこえて\n\tすこし西に　行ったところなのね。\n@c0@"
  ko: "@a@b%a002010: 레이독 성은 여기서\n서쪽에 있는 바위산을 북쪽으로 넘은 뒤\n조금 더 서쪽으로 가면 나오는구나.\n@c0@"
  sl: "@a@b%a002010：要去雷多克城，\n　　要从北侧越过西边的石山，\n　　然后再向西走。\n@c0@"
  tl: "@a@b%a002010：要去雷多克城，\n　　要從北側越過西邊的石山，\n　　然後再向西走。\n@c0@"
86:
  en: "@a%0%a002000@bNo ‘arrr and arrr’ for us, that's for sure.\n@c0@"
  ja: "@a@b%a002000「オレたちは　あまり\n\tのんびりも　していられないぜ。\n@c0@"
  ko: "@a@b%a002000: 우리에겐 한가로이\n늑장 부릴 여유가 없어.\n@c0@"
  sl: "@a@b%a002000：咱们别这么慢腾腾的啦。\n@c0@"
  tl: "@a@b%a002000：咱們別這麼慢騰騰的啦。\n@c0@"
87:
  en: "@a%0%a002000@bWe've got a mirror to find 'n' everything like that.\n@c0@"
  ja: "@a@b%a002000「早いとこ　ラーの鏡を\n\tさがさなくっちゃな。\n@c0@"
  ko: "@a@b%a002000: 얼른 라의 거울을\n찾아야 하니까.\n@c0@"
  sl: "@a@b%a002000：必须快点找到太阳神镜。\n@c0@"
  tl: "@a@b%a002000：必須快點找到太陽神鏡。\n@c0@"
88:
  en: "@a%0%a002010@bThe sailors are really busy when on deck. I'm sure they can't wait to relax once they reach land.\n@c0@"
  ja: "@a@b%a002010「船の上では　おおいそがしの\n\t船員さんだから　りくに上がったら\n\tのんびりしたいのね。\n@c0@"
  ko: "@a@b%a002010: 선원이야 배 위에서는\n무척 바쁘니까 육지에서나마\n푹 쉬고 싶겠지.\n@c0@"
  sl: "@a@b%a002010：船员先生在船上那么忙，\n　　上了岸之后\n　　就悠闲多了。\n@c0@"
  tl: "@a@b%a002010：船員先生在船上那麼忙，\n　　上了岸之後\n　　就悠閒多了。\n@c0@"
89:
  en: "@a%0%a002000@bIf that was a joke, then hardy har. He should try it on someone more fresh off the boat than us veteran voyagers.\n@c0@"
  ja: "@a@b%a002000「なんだ　おどかすなよ。\n\t本当に　キップが\n\tいるのかと　思ったぜ！\n@c0@"
  ko: "@a@b%a002000: 뭐야, 놀라게\n하지 말라고. 정말 승선권이\n필요한 건가 생각했잖아!\n@c0@"
  sl: "@a@b%a002000：吓了俺一跳，\n　　还以为真的要收咱们的票！\n@c0@"
  tl: "@a@b%a002000：嚇了俺一跳，\n　　還以為真的要收咱們的票！\n@c0@"
90:
  en: "@a%0%a002010@bI do hope we get to take another relaxing trip on this ferry some day.\n@c0@"
  ja: "@a@b%a002010「いつかまた　この船で\n\tのんびりとした　船旅を\n\tしたいものね。\n@c0@"
  ko: "@a@b%a002010: 언젠가 \n또 이 배를 타고 한가롭게 \n여행하고 싶어.\n@c0@"
  sl: "@a@b%a002010：什么时候能再悠闲地乘船就好了。\n@c0@"
  tl: "@a@b%a002010：什麼時候能再悠閒地乘船就好了。\n@c0@"
