  tl: "@a@b＊：睏死了啊。\n　　但是睡著了的話就慘了。\n@c0@"
3:
  en: "@a@b*: I heard a rumour, see. I'm sure that's all it is, but they say there's a disease that kills people in their sleep!\n@c0@"
  ja: "@a@b＊「これは　うわさだけんどよ。\n\t近頃　ねむったまま\n\t死んでしまう病気が　あるそうだべ。\n@c0@"
