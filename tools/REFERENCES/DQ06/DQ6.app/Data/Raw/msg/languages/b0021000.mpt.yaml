2:
  en: "@a@b*: I'm right sleepy, I am. But I can't let meself drop off. Oh no, it's too scary!\n@c0@"
  ja: "@a@b＊「ねむいだよ。\n\tけど　ねむるのが　おっかねえだよ。\n@c0@"
