  ko: "@a@b%a002040: 흐음......\n일전에 뭔가 축하할 만한 일이\n있었나 보군.\n@c0@"
  sl: "@a@b%a002040：唔……\n　　之前发生了什么\n　　值得庆贺的事吗？\n@c0@"
  tl: "@a@b%a002040：唔……\n　　之前發生了什麼\n　　值得慶賀的事嗎？\n@c0@"
212:
  en: "@a%0%a002060@b(snarl) Howard make good king... (spit)\n@c0@"
