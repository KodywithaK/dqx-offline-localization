  sl: "@a@b%a002010：魔法的钥匙……\n　　得到了个好东西呢。\n@c0@"
  tl: "@a@b%a002010：魔法的鑰匙……\n　　得到了個好東西呢。\n@c0@"
278:
  en: "@a%0%a002010@bI sense that we'll be making plenty of use of it.\n@c0@"
