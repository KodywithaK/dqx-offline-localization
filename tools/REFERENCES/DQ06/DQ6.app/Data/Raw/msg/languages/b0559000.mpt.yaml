  tl: "@a@b%a002040：人們大多是會\n　　隨著成長而改變的……\n@c0@"
271:
  en: "@a%0%a002040@bSeems to me this Howard fellow just changed faster than most.\n@c0@"
  ja: "@a@b%a002040「その　ホルス王子ってのは\n\t急に　変わったのか。\n\tそういうことも　あるんだろうな。\n@c0@"
  ko: "@a@b%a002040: 그 홀스 왕자라는 자는\n갑자기 변했단 말이지?\n그런 일도 있나 보군.\n@c0@"
  sl: "@a@b%a002040：那个荷尔斯王子\n　　突然之间就改变了啊。\n　　还有这样的事呢。\n@c0@"
  tl: "@a@b%a002040：那個荷爾斯王子\n　　突然之間就改變了啊。\n　　還有這樣的事呢。\n@c0@"
272:
  en: "@a%0%a002060@b(snarl) %0%a002060 meet Queen... (slobber)\n@c0@"
  ja: "@a@b%a002060「王妃…はじめ…まして…だ。\n@c0@"
  ko: "@a@b%a002060: 왕비...처음...뵙는...다.\n@c0@"
  sl: "@a@b%a002060：第一次……见到王妃。\n@c0@"
  tl: "@a@b%a002060：第一次……見到王妃。\n@c0@"
273:
  en: "@a%0%a002070@bBoing? Boing.\n@c0@"
  ja: "@a@b%a002070「プルリリン　プルッ！\n@c0@"
  ko: "@a@b%a002070: 뽀르르르~ 뽀용!\n@c0@"
  sl: "@a@b%a002070：噗噜哩哩～噗噜！\n@c0@"
  tl: "@a@b%a002070：噗嚕哩哩～噗嚕！\n@c0@"
274:
  en: "@a%0%a002000@bThat's that for our obligation to the King, aye?\n@c0@"
  ja: "@a@b%a002000「これで　本当に\n\tここでの　オレたちの　役目は\n\t終わったな。\n@c0@"
  ko: "@a@b%a002000: 이제 정말\n이곳에서의 임무도\n끝났군.\n@c0@"
  sl: "@a@b%a002000：这下咱\n　　在这里的任务\n　　就结束了吧。\n@c0@"
  tl: "@a@b%a002000：這下咱\n　　在這裡的任務\n　　就結束了吧。\n@c0@"
275:
  en: "@a%0%a002000@bCrikey, I'm glad he remembered!\n@c0@"
  ja: "@a@b%a002000「そんな　だいじなこと\n\t忘れるかな　ふつう……。\n\tまあ　でも　ありがたい話だな。\n@c0@"
  ko: "@a@b%a002000: 그런 중요한 건\n보통 안 잊어버리지 않나......\n뭐, 어쨌든 고마운 얘기군.\n@c0@"
  sl: "@a@b%a002000：这种重要的事情\n　　一般是不可能忘的吧……\n　　唉，不过这真是谢天谢地。\n@c0@"
  tl: "@a@b%a002000：這種重要的事情\n　　一般是不可能忘的吧……\n　　唉，不過這真是謝天謝地。\n@c0@"
276:
  en: "@a%0%a002010@bSo, %a000090... Ready for our next adventure?\n@c0@"
  ja: "@a@b%a002010「……さあ　私たちは\n\tまた　新たな　冒険に\n\t旅立ちましょうか。\n@c0@"
  ko: "@a@b%a002010: ......자, 우리는\n또 새로운 모험을\n떠나 볼까?\n@c0@"
