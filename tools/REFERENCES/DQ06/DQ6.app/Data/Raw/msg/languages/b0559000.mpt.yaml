  ja: "@a@b%a002030「ここを　歩くと\n\t向こうから　ホルス王子が\n\t走ってくるような　気がします。\n@c0@"
  ko: "@a@b%a002030: 이곳을 걷고 있자니\n저쪽에서 홀스 왕자가\n달려올 것만 같습니다.\n@c0@"
  sl: "@a@b%a002030：走在这里，\n　　总觉得荷尔斯王子会\n　　从对面跑过来呢。\n@c0@"
  tl: "@a@b%a002030：走在這裡，\n　　總覺得荷爾斯王子會\n　　從對面跑過來呢。\n@c0@"
198:
  en: "@a%0%a002050@bI guess we might not be seein' this place again any time soon.\n@c0@"
  ja: "@a@b%a002050「もう　とうぶん　私たちは\n\tこの　地下通路にも\n\t来なくなるでしょうねえ。\n@c0@"
  ko: "@a@b%a002050: 이제 당분간 우리는\n이 지하 통로에도\n올 일이 없겠군요.\n@c0@"
  sl: "@a@b%a002050：我们以后\n　　不会再来这个\n　　地下通道了吧。\n@c0@"
  tl: "@a@b%a002050：我們以後\n　　不會再來這個\n　　地下通道了吧。\n@c0@"
199:
  en: "@a%0%a002040@bNo monsters? A pity — it might help kill the time.\n@c0@"
  ja: "@a@b%a002040「なんだ　ふつうの　地下道か。\n\tまものでも　出てくれば\n\tヒマが　つぶれるのに。\n@c0@"
  ko: "@a@b%a002040: 뭐야, 평범한 지하도잖아.\n마물이라도 나오면\n심심하지나 않을 텐데.\n@c0@"
  sl: "@a@b%a002040：什么啊，就是个\n　　普通的地下通道啊。要是有\n　　魔物出没的话倒是可以消遣了呢。\n@c0@"
  tl: "@a@b%a002040：什麼啊，就是個\n　　普通的地下通道啊。要是有\n　　魔物出沒的話倒是可以消遣了呢。\n@c0@"
200:
  en: "@a%0%a002060@b(snarl) This short cut...? (spit)\n@c0@"
  ja: "@a@b%a002060「地下…道…で…\n\tちかみち…か。\n@c0@"
  ko: "@a@b%a002060: 지하...도...가...\n지름길...인가.\n@c0@"
  sl: "@a@b%a002060：走地下通道……\n　　一下就到啊。\n@c0@"
  tl: "@a@b%a002060：走地下通道……\n　　一下就到啊。\n@c0@"
201:
  en: "@a%0%a002070@bBoing? (slurp)\n@c0@"
  ja: "@a@b%a002070「プルルッ！\n@c0@"
  ko: "@a@b%a002070: 뽀요용!\n@c0@"
  sl: "@a@b%a002070：噗噜噜！\n@c0@"
  tl: "@a@b%a002070：噗嚕嚕！\n@c0@"
202:
  en: "@a%0%a002000@bThat fella was pretty helpful to us once upon a time, aye?\n@c0@"
  ja: "@a@b%a002000「この人には\n\tオレたち　けっこう\n\t情報を　もらったよな。\n@c0@"
  ko: "@a@b%a002000: 이 사람에게서\n우린 꽤 많은\n정보를 얻었지.\n@c0@"
  sl: "@a@b%a002000：咱从这个人这里\n　　打听到了不少消息呢。\n@c0@"
  tl: "@a@b%a002000：咱從這個人這裡\n　　打聽到了不少消息呢。\n@c0@"
203:
  en: "@a%0%a002000@bWell, he was asleep just as often, but still!\n@c0@"
  ja: "@a@b%a002000「せっかく　あてにして\n\t話を　聞きに　来たのに\n\tねてたことも　あったけど……。\n@c0@"
  ko: "@a@b%a002000: 이야기를 좀\n들어 보려고 일부러 찾아왔는데\n자고 있었을 때도 있었지만......\n@c0@"
  sl: "@a@b%a002000：虽然有时候\n　　特地来找他打听消息，\n　　他却睡着了……\n@c0@"
  tl: "@a@b%a002000：雖然有時候\n　　特地來找他打聽消息，\n　　他卻睡著了……\n@c0@"
204:
  en: "@a%0%a002010@bWe'll always be grateful to that gentleman for the help he gave us.\n@c0@"
  ja: "@a@b%a002010「この　おじいさんには\n\tいろいろ　ヒントを\n\tもらえて　うれしかったわ。\n@c0@"
  ko: "@a@b%a002010: 이 할아버지한테는\n여러모로 힌트를\n얻어서 다행이었어.\n@c0@"
  sl: "@a@b%a002010：从这个老爷爷这里\n　　得到了不少线索呢，\n　　真开心。\n@c0@"
  tl: "@a@b%a002010：從這個老爺爺這裡\n　　得到了不少線索呢，\n　　真開心。\n@c0@"
205:
