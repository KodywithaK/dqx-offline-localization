  ja: "@a@b%a002020「おじいちゃん\n\tいつごろ　それ　知ったの？\n@c0@"
  ko: "@a@b%a002020: 할아버지,\n그거 언제 안 거야?\n@c0@"
  sl: "@a@b%a002020：老爷爷是什么时候\n　　知道这件事的啊？\n@c0@"
  tl: "@a@b%a002020：老爺爺是什麼時候\n　　知道這件事的啊？\n@c0@"
206:
  en: "@a%0%a002020@bHe probably still thinks it's all some crazy dream.\n@c0@"
  ja: "@a@b%a002020「じつは　ずっと　ねていて\n\tつい　さっき　知ったとか……！？\n@c0@"
  ko: "@a@b%a002020: 설마 계속 자다가\n방금 전에 들은 거 아냐......!?\n@c0@"
