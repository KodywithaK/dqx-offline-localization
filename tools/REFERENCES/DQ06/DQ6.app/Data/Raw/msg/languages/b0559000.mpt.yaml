266:
  en: "@a%0%a002010@bBasking in the Queen's joyous aura is all the reward I'll ever need.\n@c0@"
  ja: "@a@b%a002010「王妃さまの　よろこびは\n\tお手伝いした　私たちにとっての\n\tよろこびでも　あるわよね。\n@c0@"
  ko: "@a@b%a002010: 왕비님의 기쁨은\n그걸 도운 우리들의\n기쁨이기도 해.\n@c0@"
  sl: "@a@b%a002010：看到王妃殿下这么开心，\n　　出手相助的我们\n　　也感到开心呢。\n@c0@"
  tl: "@a@b%a002010：看到王妃殿下這麼開心，\n　　出手相助的我們\n　　也感到開心呢。\n@c0@"
267:
  en: "@a%0%a002020@bShe's not kidding. He's a whole different person in a lot of ways.\n@c0@"
  ja: "@a@b%a002020「少しっていうか……\n\tもう　ほとんど　別人に\n\t思えたり　するけれどね。\n@c0@"
  ko: "@a@b%a002020: 조금 바뀌었다기보단......\n이제 거의 다른 사람이\n된 것 같기도 한데 말야.\n@c0@"
  sl: "@a@b%a002020：这哪里变得慢啊……\n　　这完全让人觉得\n　　变成了另外一个人了啊。\n@c0@"
