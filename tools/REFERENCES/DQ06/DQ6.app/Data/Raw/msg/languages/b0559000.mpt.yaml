  ko: "@a@b%a002050: 이 영감님,\n가끔씩은 햇볕을 쬐는 게\n좋지 않을까요?\n@c0@"
  sl: "@a@b%a002050：这个老爷爷\n　　偶尔也去晒晒太阳\n　　比较好吧。\n@c0@"
  tl: "@a@b%a002050：這個老爺爺\n　　偶爾也去曬曬太陽\n　　比較好吧。\n@c0@"
210:
  en: "@a%0%a002050@bThere'll be mould growin' on him next time we see him...\n@c0@"
  ja: "@a@b%a002050「このままじゃ\n\tカビが　はえちゃいますよ。\n@c0@"
  ko: "@a@b%a002050: 이대로 가다간\n곰팡이가 생긴다구요.\n@c0@"
  sl: "@a@b%a002050：这样下去\n　　会发霉的哦。\n@c0@"
  tl: "@a@b%a002050：這樣下去\n　　會發霉的哦。\n@c0@"
211:
  en: "@a%0%a002040@bSo that old guy helped you out?\n@c0@"
