  tl: "@a@b%a002010：……那麼我們\n　　就繼續踏上新的\n　　冒險旅程吧。\n@c0@"
277:
  en: "@a%0%a002010@bA magic key... What a wonderful reward.\n@c0@"
  ja: "@a@b%a002010「魔法のカギ……\n\tいい物を　いただいたわね。\n@c0@"
