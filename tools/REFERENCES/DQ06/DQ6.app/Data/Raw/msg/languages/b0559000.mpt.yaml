  tl: "@a@b%a002020：其實是一直在睡覺，\n　　剛剛才知道的吧？！\n@c0@"
207:
  en: "@a%0%a002030@bCome to think of it, no one we have met harboured genuine hatred for the Prince.\n@c0@"
  ja: "@a@b%a002030「考えてみれば\n\tホルス王子を　本気で　きらう\n\t人なんて　いなかったのかも。\n@c0@"
  ko: "@a@b%a002030: 생각해 보면\n홀스 왕자를 진심으로 미워하는\n사람은 없을지도 모릅니다.\n@c0@"
  sl: "@a@b%a002030：好好想一想的话，\n　　其实没有人真正讨厌\n　　荷尔斯王子吧。\n@c0@"
  tl: "@a@b%a002030：好好想一想的話，\n　　其實沒有人真正討厭\n　　荷爾斯王子吧。\n@c0@"
208:
  en: "@a%0%a002030@bAll seem to wish him well in his future role as King.\n@c0@"
