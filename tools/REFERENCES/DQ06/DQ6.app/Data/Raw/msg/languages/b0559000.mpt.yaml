  tl: "@a@b%a002050：濕成了那樣，\n　　人當然是會變的！\n@c0@"
270:
  en: "@a%0%a002040@bEveryone changes as they get older...\n@c0@"
  ja: "@a@b%a002040「人間　たいていは\n\t成長すれば　変わるもんだが……\n@c0@"
  ko: "@a@b%a002040: 사람은 대부분\n성장하면 변하는 법이지만......\n@c0@"
