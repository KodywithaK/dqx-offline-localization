280:
  en: "@a%0%a002020@bOooh! The key's so pretty! Can I hold it for a second?\n@c0@"
  ja: "@a@b%a002020「わーい！\n\tきれいな　カギだね。\n\tみせて　みせてー！\n@c0@"
  ko: "@a@b%a002020: 우와~!\n예쁜 열쇠네.\n나도 보여 줘~!\n@c0@"
  sl: "@a@b%a002020：哇！\n　　这钥匙真漂亮。\n　　给我看看给我看看！\n@c0@"
  tl: "@a@b%a002020：哇！\n　　這鑰匙真漂亮。\n　　給我看看給我看看！\n@c0@"
281:
