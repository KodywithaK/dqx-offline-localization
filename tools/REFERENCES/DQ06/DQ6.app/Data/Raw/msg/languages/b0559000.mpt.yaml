268:
  en: "@a%0%a002030@bI too am looking forward to seeing how Prince Howard turns out.\n@c0@"
  ja: "@a@b%a002030「ホルス王子の\n\tこれからの　成長……\n\t私たちも　楽しみですね。\n@c0@"
  ko: "@a@b%a002030: 앞으로\n홀스 왕자가 얼마나 성장할지......\n저희도 기대되는군요.\n@c0@"
  sl: "@a@b%a002030：荷尔斯王子\n　　今后的成长……\n　　我们也很期待呢。\n@c0@"
  tl: "@a@b%a002030：荷爾斯王子\n　　今後的成長……\n　　我們也很期待呢。\n@c0@"
269:
  en: "@a%0%a002050@bI reckon anyone'd change if they had to stand under a freezin' waterfall for a spell!\n@c0@"
  ja: "@a@b%a002050「あれだけ\n\tビショビショに　なれば\n\t人も　変わりますよね！\n@c0@"
  ko: "@a@b%a002050: 그 정도로\n흠뻑 젖으면\n사람이 바뀌나 보네요!\n@c0@"
