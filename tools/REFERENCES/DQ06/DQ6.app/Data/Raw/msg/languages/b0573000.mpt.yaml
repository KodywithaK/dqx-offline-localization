  tl: "@a@b%a002010：呵呵。\n　　這就是少女的小心思啊。\n　　真可愛。\n@c0@"
33:
  en: "@a%0%a002020@bThat girl must be one of those royalophiles.\n@c0@"
  ja: "@a@b%a002020「この人　フォーン王に\n\tくびったけ　みたいだね。\n@c0@"
  ko: "@a@b%a002020: 이 사람, 폰 왕한테\n홀딱 반했나 봐.\n@c0@"
  sl: "@a@b%a002020：这个人好像\n　　深爱着佛恩王呢。\n@c0@"
  tl: "@a@b%a002020：這個人好像\n　　深愛著佛恩王呢。\n@c0@"
34:
  en: "@a%0%a002030@bShe appears to be quite bashful.\n@c0@"
  ja: "@a@b%a002030「テレてますね。\n@c0@"
  ko: "@a@b%a002030: 수줍어하고 있군요.\n@c0@"
  sl: "@a@b%a002030：在害羞呢。\n@c0@"
  tl: "@a@b%a002030：在害羞呢。\n@c0@"
35:
  en: "@a%0%a002050@bIs old %a002050 not worthy of someone's love?\n@c0@"
  ja: "@a@b%a002050「あのー。\n\t私では　ダメでしょうか？\n@c0@"
  ko: "@a@b%a002050: 저기~\n저는 안 되나요?\n@c0@"
  sl: "@a@b%a002050：你看我……\n　　可以吗？\n@c0@"
  tl: "@a@b%a002050：你看我……\n　　可以嗎？\n@c0@"
36:
  en: "@a%0%a002000@bCrikey. Well ain't that a kick in the teeth.\n@c0@"
