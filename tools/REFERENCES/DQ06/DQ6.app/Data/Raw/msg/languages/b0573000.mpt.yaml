0:
  en: "@a%0%a002000@bI reckon we'd better say ahoy to the King first.\n@c0@"
  ja: "@a@b%a002000「まずは　王さまに\n\tあいさつしないとな。\n@c0@"
  ko: "@a@b%a002000: 우선은 왕에게\n인사부터 해야겠군.\n@c0@"
  sl: "@a@b%a002000：得先去跟\n　　国王陛下打招呼。\n@c0@"
  tl: "@a@b%a002000：得先去跟\n　　國王陛下打招呼。\n@c0@"
1:
  en: "@a%0%a002010@bThis castle is rather compact, but it is still a fine old structure.\n@c0@"
  ja: "@a@b%a002010「こじんまりしてるけど\n\tなかなか　いいお城よね。\n@c0@"
  ko: "@a@b%a002010: 아담하지만\n제법 괜찮은 성이네.\n@c0@"
  sl: "@a@b%a002010：这城小是小点，\n　　但是还不错嘛。\n@c0@"
  tl: "@a@b%a002010：這城小是小點，\n　　但是還不錯嘛。\n@c0@"
2:
  en: "@a%0%a002020@bDo you think the King of Swanstone is young? And nice? And good-looking? ...And single?\n@c0@"
  ja: "@a@b%a002020「ここの　王さまって\n\tどんな人かな。\n\t若くて　ハンサムだと　いいなあ！\n@c0@"
  ko: "@a@b%a002020: 여기 왕은\n어떤 사람일까?\n젊고 잘생긴 사람이면 좋겠다!\n@c0@"
  sl: "@a@b%a002020：这里的国王陛下\n　　是个怎样的人呢？\n　　要是个年轻帅哥就好了！\n@c0@"
  tl: "@a@b%a002020：這裡的國王陛下\n　　是個怎樣的人呢？\n　　要是個年輕帥哥就好了！\n@c0@"
3:
  en: "@a%0%a002030@bThe blessings of the Goddess be upon this castle.\n@c0@"
  ja: "@a@b%a002030「この　お城にも\n\tゲントの神の　ご加護が\n\tありますように……。\n@c0@"
  ko: "@a@b%a002030: 이 성에도\n겐트 신의 가호가\n함께하기를......\n@c0@"
  sl: "@a@b%a002030：愿根特之神\n　　也能保佑这座城……\n@c0@"
  tl: "@a@b%a002030：願根特之神\n　　也能保佑這座城……\n@c0@"
4:
  en: "@a%0%a002050@bThis isn't the biggest castle in the world, but it looks solidly built.\n@c0@"
  ja: "@a@b%a002050「小さい　わりには\n\tガッチリと　作られた\n\tお城ですねー。\n@c0@"
  ko: "@a@b%a002050: 작은 것 치고는\n빈틈없이 만들어진\n성이네요~\n@c0@"
  sl: "@a@b%a002050：这城虽小，\n　　却修建得非常\n　　精致紧凑呢。\n@c0@"
  tl: "@a@b%a002050：這城雖小，\n　　卻修建得非常\n　　精緻緊湊呢。\n@c0@"
5:
  en: "@a%0%a002000@bGuardin' the castle gate is the hardest gig in the soldierin' trade, ya know.\n@c0@"
  ja: "@a@b%a002000「どこの　城も\n\t見張りの　兵隊は　大変だよな。\n@c0@"
  ko: "@a@b%a002000: 어느 성을 가도\n파수병들은 고생이 많군.\n@c0@"
  sl: "@a@b%a002000：不管哪座城，\n　　守卫的士兵都很辛苦啊。\n@c0@"
  tl: "@a@b%a002000：不管哪座城，\n　　守衛的士兵都很辛苦啊。\n@c0@"
6:
  en: "@a%0%a002010@bI do like these polite soldiers.\n@c0@"
  ja: "@a@b%a002010「兵隊さん　こんにちは。\n@c0@"
  ko: "@a@b%a002010: 병사님, 안녕하세요.\n@c0@"
  sl: "@a@b%a002010：你好，这位士兵。\n@c0@"
  tl: "@a@b%a002010：你好，這位士兵。\n@c0@"
7:
  en: "@a%0%a002020@bThe soldiers sure seem nice — not intimidating at all.\n@c0@"
  ja: "@a@b%a002020「この　お城の\n\t兵隊さんは　やさしそうだねー。\n@c0@"
  ko: "@a@b%a002020: 이 성의\n병사들은 친절해 보여~\n@c0@"
  sl: "@a@b%a002020：这座城的兵哥哥\n　　看起来好温柔哦。\n@c0@"
  tl: "@a@b%a002020：這座城的兵哥哥\n　　看起來好溫柔哦。\n@c0@"
8:
  en: "@a%0%a002030@bThe castle does not appear to be very heavily guarded.\n@c0@"
  ja: "@a@b%a002030「城の　警備は\n\tそんなに　きびしくは\n\tないようですね。\n@c0@"
  ko: "@a@b%a002030: 성의 경비는\n그렇게 삼엄하지\n않은 것 같습니다.\n@c0@"
  sl: "@a@b%a002030：城的警备好像\n　　不是很严呢。\n@c0@"
  tl: "@a@b%a002030：城的警備好像\n　　不是很嚴呢。\n@c0@"
9:
  en: "@a%0%a002050@bIt doesn't look like we'll be scrappin' with the soldiers in this here castle.\n@c0@"
  ja: "@a@b%a002050「この　お城では\n\t兵隊さんと　戦うことは\n\tなさそうですね。\n@c0@"
  ko: "@a@b%a002050: 이 성에서는\n병사랑 싸울 일은\n없어 보이네요.\n@c0@"
  sl: "@a@b%a002050：好像不用跟\n　　这座城的士兵战斗呢。\n@c0@"
  tl: "@a@b%a002050：好像不用跟\n　　這座城的士兵戰鬥呢。\n@c0@"
10:
  en: "@a%0%a002000@bHuh. What's that pup doin' up here?\n@c0@"
  ja: "@a@b%a002000「こんな　ところで\n\t何してるんだろうな　このイヌ。\n@c0@"
  ko: "@a@b%a002000: 이런 곳에서\n뭘 하고 있는 걸까, 이 개는.\n@c0@"
  sl: "@a@b%a002000：这狗在\n　　这种地方做什么啊。\n@c0@"
  tl: "@a@b%a002000：這狗在\n　　這種地方做什麼啊。\n@c0@"
11:
  en: "@a%0%a002010@bI hope someone takes him for a walk in this lovely weather.\n@c0@"
  ja: "@a@b%a002010「ワンちゃん　こんにちは。\n\t天気がいいから　お散歩かしら？\n@c0@"
  ko: "@a@b%a002010: 멍멍아, 안녕.\n날씨가 좋아서 산책하는 거니?\n@c0@"
  sl: "@a@b%a002010：你好啊，小狗狗。\n　　天气这么好，是在散步吗？\n@c0@"
  tl: "@a@b%a002010：你好啊，小狗狗。\n　　天氣這麼好，是在散步嗎？\n@c0@"
12:
  en: "@a%0%a002020@bAww... What a cute wittle puppy!\n@c0@"
  ja: "@a@b%a002020「あはは。\n\tこのコ　おもしろい顔してるねー。\n@c0@"
  ko: "@a@b%a002020: 아하하.\n얘 얼굴 웃기게 생겼어~\n@c0@"
  sl: "@a@b%a002020：啊哈哈。\n　　这小狗表情好好玩啊。\n@c0@"
  tl: "@a@b%a002020：啊哈哈。\n　　這小狗表情好好玩啊。\n@c0@"
13:
  en: "@a%0%a002030@bWhatever might that dog be barking at?\n@c0@"
  ja: "@a@b%a002030「何に　むかって\n\tほえているのでしょうね。\n@c0@"
  ko: "@a@b%a002030: 뭘 향해\n짖고 있는 걸까요?\n@c0@"
  sl: "@a@b%a002030：在朝着\n　　什么东西叫啊？\n@c0@"
  tl: "@a@b%a002030：在朝著\n　　什麼東西叫啊？\n@c0@"
14:
  en: "@a%0%a002050@bI agree with the pooch. Woof!\n@c0@"
  ja: "@a@b%a002050「わおーん！\n@c0@"
  ko: "@a@b%a002050: 왈왈~!\n@c0@"
  sl: "@a@b%a002050：汪汪！\n@c0@"
  tl: "@a@b%a002050：汪汪！\n@c0@"
15:
  en: "@a%0%a002000@bThe world's just full of mysterious mirrors, aye?\n@c0@"
  ja: "@a@b%a002000「カガミ姫か……。\n\tオレも　会ってみたいぜ。\n@c0@"
  ko: "@a@b%a002000: 거울 공주라......\n나도 만나 보고 싶군.\n@c0@"
  sl: "@a@b%a002000：明镜公主啊……\n　　俺也想见一见。\n@c0@"
  tl: "@a@b%a002000：明鏡公主啊……\n　　俺也想見一見。\n@c0@"
16:
  en: "@a%0%a002010@bHe seems rather fond of the mirror princess himself.\n@c0@"
  ja: "@a@b%a002010「この人も\n\tカガミ姫が　好きみたいね。\n@c0@"
  ko: "@a@b%a002010: 이 사람도\n거울 공주를 좋아하나 보네.\n@c0@"
  sl: "@a@b%a002010：这个人好像\n　　也喜欢明镜公主呢。\n@c0@"
  tl: "@a@b%a002010：這個人好像\n　　也喜歡明鏡公主呢。\n@c0@"
17:
  en: "@a%0%a002020@bOoh, I bet this is one of those stories with an evil queen and a Prince Charming and a talking frog and...\n@c0@"
  ja: "@a@b%a002020「きっと　王子さまの\n\tくちづけを　まっているのよ。\n\tそうに　ちがいないわ！\n@c0@"
  ko: "@a@b%a002020: 분명 왕자님의\n입맞춤을 기다리고 있는 거야.\n틀림없다구!\n@c0@"
  sl: "@a@b%a002020：她一定是在\n　　等着王子殿下的吻呢。\n　　一定是这样！\n@c0@"
  tl: "@a@b%a002020：她一定是在\n　　等著王子殿下的吻呢。\n　　一定是這樣！\n@c0@"
18:
  en: "@a%0%a002030@bI am not entirely certain that I trust this fellow...\n@c0@"
  ja: "@a@b%a002030「何か　あやしい\n\t雰囲気がしますが……。\n@c0@"
  ko: "@a@b%a002030: 왠지 수상한\n분위기가 느껴집니다만......\n@c0@"
  sl: "@a@b%a002030：气氛好像\n　　有点诡异……\n@c0@"
  tl: "@a@b%a002030：氣氛好像\n　　有點詭異……\n@c0@"
19:
  en: "@a%0%a002050@bIt takes more than just a pretty face to lure old %a002050!\n@c0@"
  ja: "@a@b%a002050「なあ？　……とか言われても\n\t私には　王さまの　気持ちは\n\tさっぱり　わかりません！\n@c0@"
  ko: "@a@b%a002050: 너도 그렇지? 라니......\n제가 폐하의 심정을\n어떻게 알겠습니까!\n@c0@"
  sl: "@a@b%a002050：就算这么问，\n　　我也不清楚国王陛下\n　　在想什么啊！\n@c0@"
  tl: "@a@b%a002050：就算這麼問，\n　　我也不清楚國王陛下\n　　在想什麼啊！\n@c0@"
20:
  en: "@a%0%a002000@bIf the King gives the go-ahead we can ‘have a look’?\n@c0@"
  ja: "@a@b%a002000「王さまに　たのむと\n\tカガミ姫を　見られるのか？\n@c0@"
  ko: "@a@b%a002000: 왕에게 부탁하면\n거울 공주를 볼 수 있는 건가?\n@c0@"
  sl: "@a@b%a002000：拜托国王陛下，\n　　就能看明镜公主了吗？\n@c0@"
  tl: "@a@b%a002000：拜託國王陛下，\n　　就能看明鏡公主了嗎？\n@c0@"
21:
  en: "@a%0%a002000@bWhy didn't he just say we can meet her?\n@c0@"
  ja: "@a@b%a002000「っていうか……。\n\tそもそも　見るものなのかよ。\n\t会うんじゃないのか？\n@c0@"
  ko: "@a@b%a002000: 아니, 그보다도......\n보여 달라고 하라니.\n사람을 구경하라는 건가?\n@c0@"
  sl: "@a@b%a002000：话是这么说……\n　　不过她可不是用来“看”的，\n　　而是用来“见”的吧？\n@c0@"
  tl: "@a@b%a002000：話是這麼說……\n　　不過她可不是用來“看”的，\n　　而是用來“見”的吧？\n@c0@"
22:
  en: "@a%0%a002010@bI suppose we should pay the King a visit, then.\n@c0@"
  ja: "@a@b%a002010「とにかく　王さまに\n\t会ってみることね。\n@c0@"
  ko: "@a@b%a002010: 우선은 폐하부터\n만나뵈어야 하겠네.\n@c0@"
  sl: "@a@b%a002010：总之要先去\n　　见国王陛下。\n@c0@"
  tl: "@a@b%a002010：總之要先去\n　　見國王陛下。\n@c0@"
23:
  en: "@a%0%a002020@bWow! Now I really want to see what's up with this princess!\n@c0@"
  ja: "@a@b%a002020「カガミ姫って\n\tホント　どんな人なんだろうね！\n@c0@"
  ko: "@a@b%a002020: 거울 공주는\n정말 어떤 사람일까!\n@c0@"
  sl: "@a@b%a002020：说真的，明镜公主\n　　到底是个什么样的人啊！\n@c0@"
  tl: "@a@b%a002020：說真的，明鏡公主\n　　到底是個什麼樣的人啊！\n@c0@"
24:
  en: "@a%0%a002030@bI am not entirely certain that I trust this fellow...\n@c0@"
  ja: "@a@b%a002030「何か　あやしい\n\t雰囲気がしますが……。\n@c0@"
  ko: "@a@b%a002030: 왠지 수상한\n분위기가 느껴집니다만......\n@c0@"
  sl: "@a@b%a002030：气氛好像\n　　有点诡异……\n@c0@"
  tl: "@a@b%a002030：氣氛好像\n　　有點詭異……\n@c0@"
25:
  en: "@a%0%a002050@bLet's go and see the King!\n@c0@"
  ja: "@a@b%a002050「ぜひ　王さまに\n\tたのんでみましょう！\n@c0@"
