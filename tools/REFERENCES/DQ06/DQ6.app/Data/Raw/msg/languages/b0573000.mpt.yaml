  en: "@a%0%a002000@bWhoa. That mirror's been around the castle for a while now, aye?\n@c0@"
  ja: "@a@b%a002000「へえ。\n\tあの鏡は　ずいぶん前から\n\tこの城に　あったんだな。\n@c0@"
  ko: "@a@b%a002000: 호오.\n그 거울은 한참 전부터\n이 성에 있었던 거군.\n@c0@"
  sl: "@a@b%a002000：那面镜子\n　　从很久以前开始\n　　就在这座城里了啊。\n@c0@"
  tl: "@a@b%a002000：那面鏡子\n　　從很久以前開始\n　　就在這座城裡了啊。\n@c0@"
175:
  en: "@a%0%a002010@bWe've agreed to help the King, so let's hurry up and lift that curse!\n@c0@"
  ja: "@a@b%a002010「引き受けたからには\n\t早いところ　カガミ姫の\n\t呪いを　といてあげましょ！\n@c0@"
  ko: "@a@b%a002010: 일을 수락한 이상\n한시라도 빨리 거울 공주의\n저주를 풀어 주자!\n@c0@"
  sl: "@a@b%a002010：既然接受了请求，\n　　就快点去解开\n　　明镜公主的诅咒吧！\n@c0@"
  tl: "@a@b%a002010：既然接受了請求，\n　　就快點去解開\n　　明鏡公主的詛咒吧！\n@c0@"
176:
  en: "@a%0%a002020@bThe King's got nothing to worry about — if anyone can save that princess, it's us!\n@c0@"
  ja: "@a@b%a002020「王さま　まかしといて！\n\tあたしたち　きっと　カガミ姫を\n\t助け出すからね！\n@c0@"
  ko: "@a@b%a002020: 폐하, 우리한테 맡겨요!\n우린 꼭 거울 공주를\n구해내고 말 테니까요!\n@c0@"
  sl: "@a@b%a002020：交给我们吧，\n　　国王陛下！我们一定会\n　　救出明镜公主的！\n@c0@"
  tl: "@a@b%a002020：交給我們吧，\n　　國王陛下！我們一定會\n　　救出明鏡公主的！\n@c0@"
177:
  en: "@a%0%a002030@bQuickly! We must locate this Spiegel character!\n@c0@"
  ja: "@a@b%a002030「まずは　ミラルゴの\n\t居場所を　さがしましょう！\n@c0@"
  ko: "@a@b%a002030: 우선 미랄고가\n있는 곳을 찾아보지요!\n@c0@"
  sl: "@a@b%a002030：首先必须要先找到\n　　米拉尔戈在哪里才行！\n@c0@"
  tl: "@a@b%a002030：首先必須要先找到\n　　米拉爾戈在哪裡才行！\n@c0@"
178:
  en: "@a%0%a002050@bHavin' a mirror for a best friend? That's tragic.\n@c0@"
  ja: "@a@b%a002050「鏡が　お友だち……\n\tというのも　ちょっと　さびしい\n\t感じですが……。\n@c0@"
  ko: "@a@b%a002050: 거울이 친구였다니......\n이것도 왠지 좀\n슬픈데요......\n@c0@"
  sl: "@a@b%a002050：只有镜子作伴……\n　　感觉那样真是\n　　有点寂寞啊……\n@c0@"
  tl: "@a@b%a002050：只有鏡子作伴……\n　　感覺那樣真是\n　　有點寂寞啊……\n@c0@"
179:
  en: "@a%0%a002000@bThe tower is there, except that it ain't? Great, now what?\n@c0@"
  ja: "@a@b%a002000「北の湖に　塔はない？\n\tそいつは　困ったな……。\n@c0@"
  ko: "@a@b%a002000: 북쪽 호수에 탑이 없다고?\n거참 귀찮게 됐군......\n@c0@"
  sl: "@a@b%a002000：北方的湖里没有塔？\n　　那可真是不好办了啊……\n@c0@"
  tl: "@a@b%a002000：北方的湖裡沒有塔？\n　　那可真是不好辦了啊……\n@c0@"
180:
  en: "@a%0%a002010@bDid you get that, %a000090? Cast Peep in front of the tower door.\n@c0@"
  ja: "@a@b%a002010「塔のトビラの前で\n\tインパスね。\n@c0@"
  ko: "@a@b%a002010: 탑의 문 앞에선\n인파스를 외치면 되는구나.\n@c0@"
  sl: "@a@b%a002010：要在塔的大门前\n　　咏唱伊恩帕斯啊。\n@c0@"
  tl: "@a@b%a002010：要在塔的大門前\n　　詠唱伊恩帕斯啊。\n@c0@"
181:
  en: "@a%0%a002020@bSounds like the first step is to find that tower.\n@c0@"
  ja: "@a@b%a002020「じゃあ　まずは　塔を\n\t見つけなきゃ！\n@c0@"
  ko: "@a@b%a002020: 그럼 일단 탑을\n찾아야겠네!\n@c0@"
  sl: "@a@b%a002020：那么首先\n　　必须找出塔才行！\n@c0@"
  tl: "@a@b%a002020：那麼首先\n　　必須找出塔才行！\n@c0@"
182:
  en: "@a%0%a002030@bIf the tower is not in this world, perhaps it can be found in the world above...\n@c0@"
  ja: "@a@b%a002030「この世界になければ\n\t上の世界の話　ということも\n\tかんがえられます！\n@c0@"
  ko: "@a@b%a002030: 이 세계에 없다면\n위쪽 세계의 이야기라고\n생각해 볼 수도 있겠군요!\n@c0@"
  sl: "@a@b%a002030：如果不在\n　　这个世界的话，我觉得\n　　可能在上面那个世界！\n@c0@"
  tl: "@a@b%a002030：如果不在\n　　這個世界的話，我覺得\n　　可能在上面那個世界！\n@c0@"
183:
  en: "@a%0%a002050@bWhat would happen if you cast Sizzle by mistake?\n@c0@"
  ja: "@a@b%a002050「まちがえて\n\tベギラマ　とか　となえたら\n\tどうなるんでしょう！？\n@c0@"
  ko: "@a@b%a002050: 실수로\n베기라마 같은 걸 외우면\n어떻게 될까요!?\n@c0@"
  sl: "@a@b%a002050：要是一不小心咏唱错了，\n　　咏唱成了贝基拉玛，\n　　那会怎么样啊？！\n@c0@"
  tl: "@a@b%a002050：要是一不小心詠唱錯了，\n　　詠唱成了貝基拉瑪，\n　　那會怎麼樣啊？！\n@c0@"
184:
  en: "@a%0%a002000@bA fairy tale without an ending, aye?\n@c0@"
  ja: "@a@b%a002000「結末のない物語か……。\n@c0@"
  ko: "@a@b%a002000: 결말이 없는 이야기라......\n@c0@"
  sl: "@a@b%a002000：这故事没有结尾啊……\n@c0@"
  tl: "@a@b%a002000：這故事沒有結尾啊……\n@c0@"
185:
  en: "@a%0%a002000@bI reckon it's our job to write it.\n@c0@"
  ja: "@a@b%a002000「オレたちが　ハッピーエンドに\n\tしてやろうぜ！\n@c0@"
  ko: "@a@b%a002000: 우리가 해피 엔딩으로\n만들어 주자고!\n@c0@"
  sl: "@a@b%a002000：咱给它写个\n　　完美的结局吧！\n@c0@"
  tl: "@a@b%a002000：咱給它寫個\n　　完美的結局吧！\n@c0@"
186:
  en: "@a%0%a002010@bOh my... Condemning her to the mirror for eternity... That is unspeakable...\n@c0@"
  ja: "@a@b%a002010「永遠の命の　呪い……\n\tざんこくね……。\n@c0@"
  ko: "@a@b%a002010: 영원한 생명의 저주......\n잔인해......\n@c0@"
  sl: "@a@b%a002010：被诅咒长生不老……\n　　太残酷了……\n@c0@"
  tl: "@a@b%a002010：被詛咒長生不老……\n　　太殘酷了……\n@c0@"
187:
  en: "@a%0%a002020@bOoh, love stories with sad endings always make me cry.\n@c0@"
  ja: "@a@b%a002020「恋する　ふたりに\n\t悲しい終わりは　いや！\n@c0@"
  ko: "@a@b%a002020: 사랑하는 사람들에게\n슬픈 결말은 싫어!\n@c0@"
  sl: "@a@b%a002020：人家不想看到明明相恋的\n　　两个人结局却那么悲惨啊！\n@c0@"
  tl: "@a@b%a002020：人家不想看到明明相戀的\n　　兩個人結局卻那麼悲慘啊！\n@c0@"
188:
  en: "@a%0%a002020@bWe better beat Spiegel before I bawl my eyes out!\n@c0@"
  ja: "@a@b%a002020「ミラルゴを　たおさなきゃ！\n@c0@"
  ko: "@a@b%a002020: 미랄고를 쓰러뜨려야 해!\n@c0@"
  sl: "@a@b%a002020：必须打倒米拉尔戈才行！\n@c0@"
  tl: "@a@b%a002020：必須打倒米拉爾戈才行！\n@c0@"
189:
  en: "@a%0%a002030@bThe ending of this tale is for us to write.\n@c0@"
  ja: "@a@b%a002030「結末は　私たちが\n\tつづるのです。\n@c0@"
  ko: "@a@b%a002030: 결말은 우리가\n짓도록 하자구요.\n@c0@"
  sl: "@a@b%a002030：就让我们\n　　来为它写上结局吧。\n@c0@"
  tl: "@a@b%a002030：就讓我們\n　　來為它寫上結局吧。\n@c0@"
190:
  en: "@a%0%a002050@bIf we lose to Spiegel, will the book end with our demise?\n@c0@"
  ja: "@a@b%a002050「ミラルゴに　負けたら\n\tその本の　結末に　私たちが\n\tのっちゃうんでしょうか！？\n@c0@"
  ko: "@a@b%a002050: 미랄고한테 지면\n그 책의 결말에 우리가\n실리는 건가요!?\n@c0@"
  sl: "@a@b%a002050：要是输给米拉尔戈的话，\n　　我们是不是也会被\n　　写进那本书的结局里啊？！\n@c0@"
  tl: "@a@b%a002050：要是輸給米拉爾戈的話，\n　　我們是不是也會被\n　　寫進那本書的結局裡啊？！\n@c0@"
191:
  en: "@a%0%a002000@bHuh... You don't think the story in that book's happenin' right in front of our eyes, do ya?\n@c0@"
  ja: "@a@b%a002000「いま起きていることが\n\tその本に　書かれている……\n\tということなのか？\n@c0@"
  ko: "@a@b%a002000: 지금 일어나는 일이\n그 책에 쓰여 있다......\n그런 뜻인가?\n@c0@"
  sl: "@a@b%a002000：就是说，\n　　现在发生的事情\n　　都写在了那本书里啊……\n@c0@"
  tl: "@a@b%a002000：就是說，\n　　現在發生的事情\n　　都寫在了那本書裡啊……\n@c0@"
192:
  en: "@a%0%a002010@bIf that were true, it would be very interesting indeed...\n@c0@"
  ja: "@a@b%a002010「それが　本当ならば\n\tとっても　きょうみ深いわね。\n@c0@"
  ko: "@a@b%a002010: 그게 사실이라면\n정말 흥미로운걸.\n@c0@"
  sl: "@a@b%a002010：如果真是那样，\n　　那还挺有意思呢。\n@c0@"
  tl: "@a@b%a002010：如果真是那樣，\n　　那還挺有意思呢。\n@c0@"
193:
  en: "@a%0%a002020@bI thought the same thing! It's like that book's been predicting the future!\n@c0@"
  ja: "@a@b%a002020「やっぱり　そうだよ！\n\tその本には　未来のことが\n\t書かれて　いたんだよ！\n@c0@"
  ko: "@a@b%a002020: 역시 그랬어!\n그 책에는 미래의 일이\n쓰여 있었다구!\n@c0@"
  sl: "@a@b%a002020：果然是这样啊！\n　　那本书里写了未来\n　　会发生的事情啊！\n@c0@"
  tl: "@a@b%a002020：果然是這樣啊！\n　　那本書裡寫了未來\n　　會發生的事情啊！\n@c0@"
194:
  en: "@a%0%a002030@bCould that really be possible?\n@c0@"
  ja: "@a@b%a002030「そんなことが\n\tあるものなのでしょうか……。\n@c0@"
  ko: "@a@b%a002030: 그런 일도\n있을 수 있는 겁니까......\n@c0@"
  sl: "@a@b%a002030：真的会有\n　　这样的事情吗……\n@c0@"
  tl: "@a@b%a002030：真的會有\n　　這樣的事情嗎……\n@c0@"
195:
  en: "@a%0%a002050@bYeah, he might be readin' too much into this.\n@c0@"
  ja: "@a@b%a002050「たまたま　だと\n\t思いますがねー。\n@c0@"
  ko: "@a@b%a002050: 우연히 닮은 거\n아닐까 싶은데요~\n@c0@"
  sl: "@a@b%a002050：这只是巧合吧。\n@c0@"
  tl: "@a@b%a002050：這只是巧合吧。\n@c0@"
196:
  en: "@a%0%a002000@bI reckon we'll find out once we get there, aye?\n@c0@"
  ja: "@a@b%a002000「ま　行ってみりゃ\n\tわかるってもんだな。\n@c0@"
  ko: "@a@b%a002000: 뭐, 가 보면\n알겠지.\n@c0@"
  sl: "@a@b%a002000：去看看就知道了。\n@c0@"
  tl: "@a@b%a002000：去看看就知道了。\n@c0@"
197:
  en: "@a%0%a002010@bLet's go and look for that tower, %a000090!\n@c0@"
  ja: "@a@b%a002010「さあ　%a000090。\n\t塔を　さがしに　出発しましょう！\n@c0@"
  ko: "@a@b%a002010: 자, %a000090.\n탑을 찾으러 출발하자!\n@c0@"
  sl: "@a@b%a002010：%a000090。\n　　我们出发去找塔吧！\n@c0@"
  tl: "@a@b%a002010：%a000090。\n　　我們出發去找塔吧！\n@c0@"
198:
  en: "@a%0%a002020@bThe sooner we start searching for Spiegel's tower, the sooner we'll find it!\n@c0@"
  ja: "@a@b%a002020「とにかく\n\tミラルゴのいる　塔を　さがしに\n\tレッツ　ゴーね！\n@c0@"
  ko: "@a@b%a002020: 아무튼\n미랄고가 있는 탑을 찾으러\n어서 떠나자!\n@c0@"
  sl: "@a@b%a002020：总之我们\n　　先去找米拉尔戈藏身的\n　　那座塔吧！\n@c0@"
  tl: "@a@b%a002020：總之我們\n　　先去找米拉爾戈藏身的\n　　那座塔吧！\n@c0@"
199:
  en: "@a%0%a002030@bThe tower must exist somewhere. We must find it, and quickly!\n@c0@"
  ja: "@a@b%a002030「行きましょう！\n\t塔が　どこかに　あることは\n\tまちがいありません！\n@c0@"
  ko: "@a@b%a002030: 갑시다!\n탑이 어딘가에 있다는 건\n틀림없는 사실일 테니까요!\n@c0@"
  sl: "@a@b%a002030：走吧！\n　　塔一定在某个地方，\n　　这点不会有错！\n@c0@"
  tl: "@a@b%a002030：走吧！\n　　塔一定在某個地方，\n　　這點不會有錯！\n@c0@"
200:
  en: "@a%0%a002050@bIt would be nice if she'd bothered to actually find out where this tower was...\n@c0@"
  ja: "@a@b%a002050「どうせなら　ちゃんと\n\t調べておいてくれると\n\t助かるんですけどねえ……。\n@c0@"
  ko: "@a@b%a002050: 이왕이면 제대로\n조사를 해 주셨다면\n편했을 텐데......\n@c0@"
  sl: "@a@b%a002050：既然话都说到这份上，\n　　要是能好好帮我们调查一下的话，\n　　那可帮我们大忙了啊……\n@c0@"
  tl: "@a@b%a002050：既然話都說到這份上，\n　　要是能好好幫我們調查一下的話，\n　　那可幫我們大忙了啊……\n@c0@"
