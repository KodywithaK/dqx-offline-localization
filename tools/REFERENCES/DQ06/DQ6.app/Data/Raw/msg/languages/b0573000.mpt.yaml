  sl: "@a@b%a002050：一定要去\n　　拜托国王陛下！\n@c0@"
  tl: "@a@b%a002050：一定要去\n　　拜託國王陛下！\n@c0@"
26:
  en: "@a%0%a002000@bCrikey! She went from sweet to sour quick, aye?\n@c0@"
  ja: "@a@b%a002000「おー　こわっ！\n@c0@"
  ko: "@a@b%a002000: 오~ 무서워라!\n@c0@"
  sl: "@a@b%a002000：哦，真可怕！\n@c0@"
  tl: "@a@b%a002000：哦，真可怕！\n@c0@"
27:
  en: "@a%0%a002010@bI don't think she was actually looking for an answer, %a000090.\n@c0@"
  ja: "@a@b%a002010「いまの　受け答えは\n\tちょっと　失礼だったかもね。\n@c0@"
  ko: "@a@b%a002010: 방금 그건\n좀 실례되는 대답이었을지도 몰라.\n@c0@"
  sl: "@a@b%a002010：刚才那种回答\n　　有点失礼吧。\n@c0@"
  tl: "@a@b%a002010：剛才那種回答\n　　有點失禮吧。\n@c0@"
28:
  en: "@a%0%a002020@bSheesh, %a000090... Haven't you ever heard of thinking out loud?\n@c0@"
  ja: "@a@b%a002020「いきなり\n\tはい　なんて言ったら　そりゃ\n\tおこられるわよ　%a000090。\n@c0@"
  ko: "@a@b%a002020: 갑자기\n네 하고 대답하면 그거야 당연히\n화내겠지, %a000090.\n@c0@"
  sl: "@a@b%a002020：突然点头称是，\n　　对方肯定是会生气的啊，\n　　%a000090。\n@c0@"
  tl: "@a@b%a002020：突然點頭稱是，\n　　對方肯定是會生氣的啊，\n　　%a000090。\n@c0@"
29:
  en: "@a%0%a002030@bUrgh. That little exchange could have gone better...\n@c0@"
  ja: "@a@b%a002030「いや……\n\tいくらなんでも　いまのは\n\tちょっと……。\n@c0@"
  ko: "@a@b%a002030: 저기......\n아무리 그래도 방금 건\n좀......\n@c0@"
  sl: "@a@b%a002030：哎呀……\n　　不管怎么说，\n　　刚才那实在有点……\n@c0@"
  tl: "@a@b%a002030：哎呀……\n　　不管怎麼說，\n　　剛才那實在有點……\n@c0@"
30:
  en: "@a%0%a002050@bYou're not afraid of chancin' your arm, are you, %a000090?\n@c0@"
  ja: "@a@b%a002050「%a000090さん\n\t命しらず　ですねー！\n@c0@"
  ko: "@a@b%a002050: %a000090 님,\n목숨 아까운 줄을 모르시네요~!\n@c0@"
  sl: "@a@b%a002050：%a000090\n　　你不要命了啊！\n@c0@"
  tl: "@a@b%a002050：%a000090\n　　你不要命了啊！\n@c0@"
31:
  en: "@a%0%a002000@bSounds like King Ludwig is a real ladies' man, aye?\n@c0@"
  ja: "@a@b%a002000「フォーン王は\n\t女性に　もてるタイプ\n\tみたいだな。\n@c0@"
  ko: "@a@b%a002000: 폰 왕은\n여성들에게 인기 있는\n타입인가 보군.\n@c0@"
  sl: "@a@b%a002000：佛恩王好像\n　　女人缘挺好。\n@c0@"
  tl: "@a@b%a002000：佛恩王好像\n　　女人緣挺好。\n@c0@"
32:
  en: "@a%0%a002010@bHee hee. Any girl could understand how she's feeling, I'm sure.\n@c0@"
  ja: "@a@b%a002010「うふふ。\n\tおとめ心　ってやつね。\n\tかわいらしいわ。\n@c0@"
  ko: "@a@b%a002010: 우후후.\n애타는 소녀의 마음이네.\n귀여운걸.\n@c0@"
