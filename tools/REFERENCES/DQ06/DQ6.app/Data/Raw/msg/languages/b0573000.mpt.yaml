  en: "@a%0%a002030@bIt seems as though the mirror princess might be a woman reflected in a mirror.\n@c0@"
  ja: "@a@b%a002030「鏡に　うつった\n\t女性なんですね　カガミ姫。\n@c0@"
  ko: "@a@b%a002030: 거울에 비친\n여자분이었군요. 거울 공주.\n@c0@"
  sl: "@a@b%a002030：明镜公主就是\n　　映在镜子里的女人吧。\n@c0@"
  tl: "@a@b%a002030：明鏡公主就是\n　　映在鏡子裡的女人吧。\n@c0@"
75:
  en: "@a%0%a002050@bThis old boy looks like a stubborn sort.\n@c0@"
  ja: "@a@b%a002050「ガンコそうな\n\tおじいさんですねー。\n@c0@"
  ko: "@a@b%a002050: 완고해 보이는\n영감님이네요~\n@c0@"
  sl: "@a@b%a002050：老爷爷好像很顽固呢。\n@c0@"
  tl: "@a@b%a002050：老爺爺好像很頑固呢。\n@c0@"
76:
  en: "@a%0%a002000@bCrikey. All that research for nothin'...\n@c0@"
  ja: "@a@b%a002000「どうやら　いろいろと\n\t調べては　いるようだな。\n@c0@"
  ko: "@a@b%a002000: 보아하니 이래저래\n조사는 한 모양이군.\n@c0@"
  sl: "@a@b%a002000：好像调查了不少东西呢。\n@c0@"
  tl: "@a@b%a002000：好像調查了不少東西呢。\n@c0@"
77:
  en: "@a%0%a002010@bI wonder who placed the curse on the Princess that trapped her in the mirror...\n@c0@"
  ja: "@a@b%a002010「呪いを　かけたのは\n\tどこの　だれなのかしら。\n@c0@"
  ko: "@a@b%a002010: 저주를 건 게\n대체 누구일까?\n@c0@"
  sl: "@a@b%a002010：不知道诅咒公主的人是谁，\n　　也不知道在哪里。\n@c0@"
  tl: "@a@b%a002010：不知道詛咒公主的人是誰，\n　　也不知道在哪裡。\n@c0@"
78:
  en: "@a%0%a002020@bWell, that clinches it! We have to help save the mirror princess!\n@c0@"
  ja: "@a@b%a002020「よーし　あたしたちが\n\tカガミ姫を　助け出しちゃおうよ！\n@c0@"
  ko: "@a@b%a002020: 좋아~ 우리가\n거울 공주를 구해내는 거야!\n@c0@"
  sl: "@a@b%a002020：好！我们去把\n　　明镜公主救出来吧！\n@c0@"
  tl: "@a@b%a002020：好！我們去把\n　　明鏡公主救出來吧！\n@c0@"
79:
  en: "@a%0%a002020@bSo, uh, go ahead and figure out how we do that, okay %a000090?\n@c0@"
  ja: "@a@b%a002020「方法は　%a000090が\n\tかんがえてね！\n@c0@"
  ko: "@a@b%a002020: 방법은 %a000090%F0090%X가%Y이%Z\n생각해 달라구!\n@c0@"
  sl: "@a@b%a002020：方法就由\n　　%a000090来想吧！\n@c0@"
  tl: "@a@b%a002020：方法就由\n　　%a000090來想吧！\n@c0@"
80:
  en: "@a%0%a002030@bIt seems we need to pursue another solution.\n@c0@"
  ja: "@a@b%a002030「何か　べつの方法を\n\tさがすしか　ないようですね。\n@c0@"
  ko: "@a@b%a002030: 다른 방법을\n찾는 수밖에 없겠군요.\n@c0@"
  sl: "@a@b%a002030：好像只能\n　　找别的方法了呢。\n@c0@"
  tl: "@a@b%a002030：好像只能\n　　找別的方法了呢。\n@c0@"
81:
  en: "@a%0%a002050@bSo he's tried recitin' a spell in front of the mirror...\n@c0@"
  ja: "@a@b%a002050「呪文を　となえても\n\tダメだった　と言うことは……\n@c0@"
  ko: "@a@b%a002050: 주문을 외워도\n안 되었다니......\n@c0@"
  sl: "@a@b%a002050：咏唱咒文都没用，\n　　那说明……\n@c0@"
  tl: "@a@b%a002050：詠唱咒文都沒用，\n　　那說明……\n@c0@"
82:
  en: "@a%0%a002050@bWell, they do talk a bit funny round here. Maybe it didn't work because of his accent...\n@c0@"
  ja: "@a@b%a002050「この国の　みなさんは\n\tナマリでも　あるのでしょうか！？\n@c0@"
  ko: "@a@b%a002050: 이 나라 사람들은\n사투리라도 쓰는 걸까요!?\n@c0@"
  sl: "@a@b%a002050：这个国家的人\n　　说话带口音吗？！\n@c0@"
  tl: "@a@b%a002050：這個國家的人\n　　說話帶口音嗎？！\n@c0@"
83:
  en: "@a%0%a002000@bHuh. I wonder who takes care of his royal duties 'n' everything like that...\n@c0@"
  ja: "@a@b%a002000「そんなことしてたら\n\t王さまの　本来の　仕事が\n\tできなくなっちまうだろう。\n@c0@"
  ko: "@a@b%a002000: 그러고 있으면\n국왕 본연의 업무를\n할 수가 없게 되겠군.\n@c0@"
  sl: "@a@b%a002000：要是有这种事的话，\n　　国王陛下就做不了\n　　原本的工作了吧。\n@c0@"
  tl: "@a@b%a002000：要是有這種事的話，\n　　國王陛下就做不了\n　　原本的工作了吧。\n@c0@"
84:
  en: "@a%0%a002010@bIt sounds like the King is obsessed with this mirror princess.\n@c0@"
  ja: "@a@b%a002010「王さまは　しんけんに\n\tなやんで　いらっしゃるのね。\n@c0@"
  ko: "@a@b%a002010: 폐하께선 진심으로\n걱정하고 계신가 보네.\n@c0@"
  sl: "@a@b%a002010：国王陛下好像\n　　真的很烦恼呢。\n@c0@"
  tl: "@a@b%a002010：國王陛下好像\n　　真的很煩惱呢。\n@c0@"
85:
  en: "@a%0%a002020@bSince when does staring at something fix anything?\n@c0@"
  ja: "@a@b%a002020「ながめてたって\n\tどうしようも　ないだろうにね。\n@c0@"
  ko: "@a@b%a002020: 바라본다고\n아무것도 해결되지 않을 텐데.\n@c0@"
  sl: "@a@b%a002020：光是凝视着\n　　也没用啊。\n@c0@"
  tl: "@a@b%a002020：光是凝視著\n　　也沒用啊。\n@c0@"
86:
  en: "@a%0%a002030@bI would like to see this princess for myself...\n@c0@"
  ja: "@a@b%a002030「私も\n\tカガミ姫の　ようすを\n\t見てみたく　なってきました。\n@c0@"
  ko: "@a@b%a002030: 저도\n거울 공주의 모습을\n보고 싶어졌습니다.\n@c0@"
  sl: "@a@b%a002030：我也想一睹\n　　明镜公主的芳容呢。\n@c0@"
  tl: "@a@b%a002030：我也想一睹\n　　明鏡公主的芳容呢。\n@c0@"
87:
  en: "@a%0%a002050@bIf the King's not on his throne, maybe old %a002050 could keep it warm.\n@c0@"
  ja: "@a@b%a002050「いまなら　玉座に\n\tすわれるかも　しれませんね！\n@c0@"
  ko: "@a@b%a002050: 지금이라면 옥좌에\n앉을 수 있을지도 모르겠네요!\n@c0@"
  sl: "@a@b%a002050：趁现在也许可以\n　　坐一坐国王的座椅哦！\n@c0@"
  tl: "@a@b%a002050：趁現在也許可以\n　　坐一坐國王的座椅哦！\n@c0@"
88:
  en: "@a%0%a002000@bI wonder if there's any way to track down whoever put her in that mirror...\n@c0@"
  ja: "@a@b%a002000「姫を　そんな目に\n\tあわせたヤツを　なんとか\n\tさがしだせないかな……。\n@c0@"
  ko: "@a@b%a002000: 공주를 그렇게\n만든 녀석을 어떻게든\n찾아내야 할 텐데......\n@c0@"
  sl: "@a@b%a002000：得找出是\n　　哪个家伙害公主\n　　变得这么惨才行……\n@c0@"
  tl: "@a@b%a002000：得找出是\n　　哪個傢伙害公主\n　　變得這麼慘才行……\n@c0@"
89:
  en: "@a%0%a002010@bSuch a tragic story. I don't suppose there's any way we could help?\n@c0@"
  ja: "@a@b%a002010「悲しみの姫……。\n\t私たちで　なんとかして\n\tあげられないかしらね。\n@c0@"
  ko: "@a@b%a002010: 슬픔에 잠긴 공주......\n우리가 어떻게\n도울 방법이 없을까?\n@c0@"
  sl: "@a@b%a002010：可怜的公主……\n　　我们有没有什么\n　　能为她做的事呢？\n@c0@"
  tl: "@a@b%a002010：可憐的公主……\n　　我們有沒有什麼\n　　能為她做的事呢？\n@c0@"
90:
  en: "@a%0%a002020@bWell, that was a depressing little ditty, huh?\n@c0@"
  ja: "@a@b%a002020「いまの　歌って\n\tまんま　じゃないの……？\n@c0@"
  ko: "@a@b%a002020: 방금 들은 노래,\n가사를 너무 갖다 쓴 거 아냐......?\n@c0@"
  sl: "@a@b%a002020：刚才那歌……\n　　唱的不都是事实吗？\n@c0@"
  tl: "@a@b%a002020：剛才那歌……\n　　唱的不都是事實嗎？\n@c0@"
91:
  en: "@a%0%a002030@bSet in verse, her plight seems somehow more tragic than ever.\n@c0@"
  ja: "@a@b%a002030「カガミ姫の　ようすが\n\t手にとるように　わかりますね。\n@c0@"
  ko: "@a@b%a002030: 거울 공주의 모습을\n안 봐도 알겠군요.\n@c0@"
  sl: "@a@b%a002030：明镜公主的样子\n　　好像浮现在眼前了呢。\n@c0@"
  tl: "@a@b%a002030：明鏡公主的樣子\n　　好像浮現在眼前了呢。\n@c0@"
92:
  en: "@a%0%a002050@bThe song was nothin' special, but at least it was short!\n@c0@"
  ja: "@a@b%a002050「歌は　まあまあですが\n\tみじかい　ですよね。\n@c0@"
  ko: "@a@b%a002050: 노래는 그저 그렇지만\n짧네요.\n@c0@"
  sl: "@a@b%a002050：歌倒是还不错，\n　　就是有点短啊。\n@c0@"
  tl: "@a@b%a002050：歌倒是還不錯，\n　　就是有點短啊。\n@c0@"
93:
  en: "@a%0%a002000@bWorld-famous, aye? This I gotta eat!\n@c0@"
  ja: "@a@b%a002000「オレなら　毎日　しっかり\n\t食べてやるのにな。\n@c0@"
  ko: "@a@b%a002000: 나라면 매일 빠짐없이\n챙겨 먹을 텐데 말이지.\n@c0@"
  sl: "@a@b%a002000：要是换了俺，\n　　肯定每天都会好好吃饭的啊。\n@c0@"
  tl: "@a@b%a002000：要是換了俺，\n　　肯定每天都會好好吃飯的啊。\n@c0@"
94:
  en: "@a%0%a002010@bPerhaps the King's heavy heart is weighing down his stomach...\n@c0@"
  ja: "@a@b%a002010「王さまは　恋する心で\n\tおなかが　いっぱいなのよね。\n@c0@"
  ko: "@a@b%a002010: 폐하는 사랑을 많이 먹어서\n안 먹어도 배가 부르신가 봐.\n@c0@"
  sl: "@a@b%a002010：国王陛下坠入爱河，\n　　茶不思饭不想了呢。\n@c0@"
  tl: "@a@b%a002010：國王陛下墜入愛河，\n　　茶不思飯不想了呢。\n@c0@"
95:
  en: "@a%0%a002020@bThe King is acting more like a lovesick teenager than a monarch.\n@c0@"
  ja: "@a@b%a002020「恋する気もちは\n\t男も女も　関係ないよね！\n@c0@"
  ko: "@a@b%a002020: 사랑하는 마음은\n남녀를 가리지 않는다구!\n@c0@"
  sl: "@a@b%a002020：爱情这种事，\n　　性别不是问题！\n@c0@"
  tl: "@a@b%a002020：愛情這種事，\n　　性別不是問題！\n@c0@"
96:
  en: "@a%0%a002030@bThey say nothing kills the appetite like lovesickness.\n@c0@"
  ja: "@a@b%a002030「恋の病は　温泉でも\n\t治らないらしいです。\n@c0@"
  ko: "@a@b%a002030: 상사병엔\n약도 없다지요.\n@c0@"
  sl: "@a@b%a002030：即使泡温泉，\n　　好像也治不好相思病呢。\n@c0@"
  tl: "@a@b%a002030：即使泡溫泉，\n　　好像也治不好相思病呢。\n@c0@"
97:
  en: "@a%0%a002050@bMaybe if the schnitzel was chopped into little bits he could keep it down.\n@c0@"
  ja: "@a@b%a002050「もう少し　材料を\n\t小さめに　きざんでみたら\n\tノドを　通りませんかね。\n@c0@"
  ko: "@a@b%a002050: 재료를 좀 더\n잘게 썰면\n목으로 넘어갈까요?\n@c0@"
  sl: "@a@b%a002050：把食物切得\n　　再碎一点的话，\n　　可能就会吃了吧。\n@c0@"
  tl: "@a@b%a002050：把食物切得\n　　再碎一點的話，\n　　可能就會吃了吧。\n@c0@"
98:
  en: "@a%0%a002000@bRa's Mirror? Aye, we already got the thing!\n@c0@"
  ja: "@a@b%a002000「ラーの鏡！？\n\tオレたち　持ってるじゃないか。\n@c0@"
  ko: "@a@b%a002000: 라의 거울!?\n그거 우리가 갖고 있잖아.\n@c0@"
  sl: "@a@b%a002000：太阳神镜？！\n　　咱不是有吗？\n@c0@"
  tl: "@a@b%a002000：太陽神鏡？！\n　　咱不是有嗎？\n@c0@"
99:
  en: "@a%0%a002010@bIf Ra's Mirror can be of assistance, we should take it to the King right away!\n@c0@"
  ja: "@a@b%a002010「ラーの鏡が\n\t役に　立つのなら　ぜひ王さまに\n\t使ってもらいましょうよ！\n@c0@"
  ko: "@a@b%a002010: 라의 거울이\n통한다면 꼭 폐하가\n써 보시게 하자구!\n@c0@"
  sl: "@a@b%a002010：要是太阳神镜\n　　有用的话，就让\n　　国王陛下用一用吧！\n@c0@"
  tl: "@a@b%a002010：要是太陽神鏡\n　　有用的話，就讓\n　　國王陛下用一用吧！\n@c0@"
100:
  en: "@a%0%a002020@bHey, why don't we go tell the King that we've got Ra's Mirror right here?\n@c0@"
  ja: "@a@b%a002020「あたしたちが\n\tラーの鏡を　持っているって\n\t王さまに　話してみる？\n@c0@"
  ko: "@a@b%a002020: 우리가\n라의 거울을 갖고 있다고\n폐하께 얘기해 볼까?\n@c0@"
  sl: "@a@b%a002020：要不要\n　　告诉国王陛下我们\n　　其实有太阳神镜？\n@c0@"
  tl: "@a@b%a002020：要不要\n　　告訴國王陛下我們\n　　其實有太陽神鏡？\n@c0@"
101:
  en: "@a%0%a002030@bRa's Mirror reflects only the truth... Sure enough, it may produce some results.\n@c0@"
  ja: "@a@b%a002030「真実を　うつしだす\n\tラーの鏡……　たしかに　なにか\n\t効果が　ありそうな　気がしますね。\n@c0@"
  ko: "@a@b%a002030: 진실을 비추는\n라의 거울...... 듣고 보니 왠지\n효과가 있을 것 같네요.\n@c0@"
  sl: "@a@b%a002030：映出真实的\n　　太阳神镜……的确好像\n　　会有什么效果呢。\n@c0@"
  tl: "@a@b%a002030：映出真實的\n　　太陽神鏡……的確好像\n　　會有什麼效果呢。\n@c0@"
102:
  en: "@a%0%a002050@bIf you reflect one mirror in another, you'll just end up with endless reflections.\n@c0@"
  ja: "@a@b%a002050「鏡と　鏡を　合わせたら\n\tずーっと　鏡が　うつるだけじゃ\n\tないでしょうか……。\n@c0@"
  ko: "@a@b%a002050: 거울과 거울을 마주 놓으면\n끝도 없이 거울만 비치는 거\n아닐까요......\n@c0@"
  sl: "@a@b%a002050：两面镜子面对面，\n　　里面只会映出\n　　一连串的镜子吧……\n@c0@"
  tl: "@a@b%a002050：兩面鏡子面對面，\n　　裡面只會映出\n　　一連串的鏡子吧……\n@c0@"
103:
  en: "@a%0%a002000@bGreat! Well, let's get goin', aye?\n@c0@"
  ja: "@a@b%a002000「よし！　ぜんは　急げだ！\n@c0@"
  ko: "@a@b%a002000: 좋아! 이런 건 서두르자고!\n@c0@"
  sl: "@a@b%a002000：好！做好事不宜迟！\n@c0@"
  tl: "@a@b%a002000：好！做好事不宜遲！\n@c0@"
104:
  en: "@a%0%a002010@bWhat a pleasant man.\n@c0@"
  ja: "@a@b%a002010「本当に　親切な\n\t大臣さんだことね。\n@c0@"
  ko: "@a@b%a002010: 정말 친절하신\n대신님이네.\n@c0@"
  sl: "@a@b%a002010：这大臣\n　　真是热心肠啊。\n@c0@"
  tl: "@a@b%a002010：這大臣\n　　真是熱心腸啊。\n@c0@"
105:
  en: "@a%0%a002020@bSo he's in the cellar, right? C'mon, let's hurry!\n@c0@"
  ja: "@a@b%a002020「地下ね。\n\tレッツ　ゴー！\n@c0@"
  ko: "@a@b%a002020: 지하구나.\n어서 가자!\n@c0@"
  sl: "@a@b%a002020：地下啊。\n　　出发吧！\n@c0@"
  tl: "@a@b%a002020：地下啊。\n　　出發吧！\n@c0@"
106:
  en: "@a%0%a002030@bLet us make haste to the cellar.\n@c0@"
  ja: "@a@b%a002030「お城の　地下の\n\t鏡の間ですね。\n\t急ぎましょう！\n@c0@"
  ko: "@a@b%a002030: 성 지하에 있는\n거울의 방이로군요.\n어서 가지요!\n@c0@"
  sl: "@a@b%a002030：城地下的\n　　镜之间啊。\n　　赶快走吧！\n@c0@"
  tl: "@a@b%a002030：城地下的\n　　鏡之間啊。\n　　趕快走吧！\n@c0@"
107:
  en: "@a%0%a002050@bThe Chancellor'll send word to the guard himself? What a nice chap!\n@c0@"
  ja: "@a@b%a002050「え？　大臣さんが\n\tちょくせつ　連絡しに行って\n\tくれるのでしょうか！？\n@c0@"
  ko: "@a@b%a002050: 어? 대신님이\n직접 연락하러\n가 주시는 걸까요!?\n@c0@"
  sl: "@a@b%a002050：诶？大臣要\n　　亲自帮我们去跟\n　　守卫联系啊？！\n@c0@"
  tl: "@a@b%a002050：誒？大臣要\n　　親自幫我們去跟\n　　守衛聯繫啊？！\n@c0@"
108:
  en: "@a%0%a002000@bWhoa, hang on, %a000090! You plannin' on just bummin' around the castle all day or what?\n@c0@"
  ja: "@a@b%a002000「いやいや　%a000090。\n\t今は　ゆるりと　してる場合じゃ\n\tないと思うぜ。\n@c0@"
  ko: "@a@b%a002000: 이봐, %a000090.\n지금은 여유 부릴 때가\n아닌 것 같은데.\n@c0@"
  sl: "@a@b%a002000：哎呀，%a000090。\n　　现在可不是这么\n　　优哉游哉的时候啊。\n@c0@"
  tl: "@a@b%a002000：哎呀，%a000090。\n　　現在可不是這麼\n　　優哉遊哉的時候啊。\n@c0@"
109:
  en: "@a%0%a002010@bAren't we going to see the King, %a000090?\n@c0@"
  ja: "@a@b%a002010「あら　%a000090。\n\t王さまに　会うんじゃ\n\tなかったのかしら？\n@c0@"
  ko: "@a@b%a002010: 어머, %a000090.\n폐하를 뵈러 가는 거\n아니었어?\n@c0@"
  sl: "@a@b%a002010：哎呀，%a000090。\n　　我们不是要见\n　　国王陛下吗？\n@c0@"
  tl: "@a@b%a002010：哎呀，%a000090。\n　　我們不是要見\n　　國王陛下嗎？\n@c0@"
110:
  en: "@a%0%a002020@bOh, come on! We've got nothing but business with him!\n@c0@"
  ja: "@a@b%a002020「ちゃんと\n\t用があるって　言おうよー！\n@c0@"
  ko: "@a@b%a002020: 이럴 땐 볼일이 있어서 왔다고\n제대로 말해야지~!\n@c0@"
  sl: "@a@b%a002020：好好跟他说\n　　咱有事要找他啊！\n@c0@"
  tl: "@a@b%a002020：好好跟他說\n　　咱有事要找他啊！\n@c0@"
111:
  en: "@a%0%a002030@bThere is only one place we want to see in this castle.\n@c0@"
  ja: "@a@b%a002030「城の中で　見たいのは\n\t今は　いっかしょ　だけですよね！\n@c0@"
  ko: "@a@b%a002030: 성안에서 보고 싶은 건\n지금은 한 곳뿐입니다!\n@c0@"
  sl: "@a@b%a002030：这城里我们\n　　想看的地方只有一处啊！\n@c0@"
  tl: "@a@b%a002030：這城裡我們\n　　想看的地方只有一處啊！\n@c0@"
112:
  en: "@a%0%a002050@bSo we're just goin' to do a bit of castle sightseein'?\n@c0@"
  ja: "@a@b%a002050「お城の　見学から\n\tはじめるんですか？\n@c0@"
  ko: "@a@b%a002050: 성 구경부터\n시작하나요?\n@c0@"
  sl: "@a@b%a002050：打算先在\n　　城里参观一下吗？\n@c0@"
  tl: "@a@b%a002050：打算先在\n　　城裡參觀一下嗎？\n@c0@"
113:
  en: "@a%0%a002000@bHe already has a companion, aye? Well, she's locked in a mirror 'n' everything like that, but still...\n@c0@"
  ja: "@a@b%a002000「お相手ね。\n\tヘンに　いるから\n\t困るんじゃないか？\n@c0@"
  ko: "@a@b%a002000: 상대라.\n희한한 상대가 있어서\n문제 아닌가?\n@c0@"
  sl: "@a@b%a002000：另一半啊。\n　　有是有，就是状况有些特殊。\n　　大家一定很伤脑筋吧？\n@c0@"
  tl: "@a@b%a002000：另一半啊。\n　　有是有，就是狀況有些特殊。\n　　大家一定很傷腦筋吧？\n@c0@"
114:
  en: "@a%0%a002010@bI'm sure her sentiments reflect those of everyone in the castle.\n@c0@"
  ja: "@a@b%a002010「お世話を　していたら\n\tだれでも　そう思うでしょうね。\n@c0@"
  ko: "@a@b%a002010: 시중을 들다 보면\n누구라도 그렇게 생각할 거야.\n@c0@"
  sl: "@a@b%a002010：照顾国王陛下的人\n　　都会这么想吧。\n@c0@"
  tl: "@a@b%a002010：照顧國王陛下的人\n　　都會這麼想吧。\n@c0@"
115:
  en: "@a%0%a002020@bOh, I wish I could do something for the King...\n@c0@"
  ja: "@a@b%a002020「王さまを　なんとか\n\tしてあげられないかなあ。\n@c0@"
  ko: "@a@b%a002020: 폐하를 어떻게\n해야 할 텐데.\n@c0@"
  sl: "@a@b%a002020：真想帮帮\n　　国王陛下啊。\n@c0@"
  tl: "@a@b%a002020：真想幫幫\n　　國王陛下啊。\n@c0@"
116:
  en: "@a%0%a002020@bI didn't mean marry him! Let's not get carried away here!\n@c0@"
  ja: "@a@b%a002020「あ！\n\tあたしが　結婚する　っていう\n\t意味じゃないからね！\n@c0@"
  ko: "@a@b%a002020: 아!\n내가 결혼하겠다는\n뜻은 아니야!\n@c0@"
  sl: "@a@b%a002020：啊！我的意思\n　　不是说我要嫁给\n　　国王陛下啊！\n@c0@"
  tl: "@a@b%a002020：啊！我的意思\n　　不是說我要嫁給\n　　國王陛下啊！\n@c0@"
117:
  en: "@a%0%a002030@bI fear the situation will change little as long as the Princess stays imprisoned in that mirror.\n@c0@"
  ja: "@a@b%a002030「鏡の中の　姫では\n\tしかたありませんものね。\n@c0@"
  ko: "@a@b%a002030: 거울 속 공주에만 빠져 계시니\n방법이 없군요.\n@c0@"
  sl: "@a@b%a002030：公主被困在镜中，\n　　我们也没办法啊。\n@c0@"
  tl: "@a@b%a002030：公主被困在鏡中，\n　　我們也沒辦法啊。\n@c0@"
118:
  en: "@a%0%a002050@bMaybe we could borrow the bed for a quick nap?\n@c0@"
  ja: "@a@b%a002050「私たちが　ベッドを\n\tもらっていきます？\n@c0@"
  ko: "@a@b%a002050: 그 침대, 우리한테\n달라고 해 볼까요?\n@c0@"
  sl: "@a@b%a002050：让她把床\n　　送给我们吧？\n@c0@"
  tl: "@a@b%a002050：讓她把床\n　　送給我們吧？\n@c0@"
119:
  en: "@a%0%a002000@bHmm... Wish I could get a peek in there, at least.\n@c0@"
  ja: "@a@b%a002000「うーん……。\n\tちょっとだけで　いいから\n\tのぞいてみたいよな。\n@c0@"
  ko: "@a@b%a002000: 으음......\n잠시라도 좋으니\n슬쩍 보고 싶은걸.\n@c0@"
  sl: "@a@b%a002000：唔……\n　　真想偷看一眼啊。\n　　一眼就好。\n@c0@"
  tl: "@a@b%a002000：唔……\n　　真想偷看一眼啊。\n　　一眼就好。\n@c0@"
120:
  en: "@a%0%a002010@bThere's no way we're getting past. What shall we do?\n@c0@"
  ja: "@a@b%a002010「しかたないわね。\n\t%a000090　どうする？\n@c0@"
  ko: "@a@b%a002010: 어쩔 수 없겠어.\n%a000090, 어떻게 할까?\n@c0@"
  sl: "@a@b%a002010：没办法了。\n　　%a000090，怎么办？\n@c0@"
  tl: "@a@b%a002010：沒辦法了。\n　　%a000090，怎麼辦？\n@c0@"
121:
  en: "@a%0%a002020@bThe Chancellor told us to go down and see the King, right? We should just go on in anyway!\n@c0@"
  ja: "@a@b%a002020「大臣が　地下に行って\n\t王さまに　会えって　いったんだから\n\tきっと入っても　大丈夫だよ！\n@c0@"
  ko: "@a@b%a002020: 대신이 지하로 가서\n왕을 만나라고 했으니까\n들어가도 괜찮을 거야!\n@c0@"
  sl: "@a@b%a002020：大臣都让我们\n　　去地下见国王陛下了，\n　　那我们肯定是可以进去的吧！\n@c0@"
  tl: "@a@b%a002020：大臣都讓我們\n　　去地下見國王陛下了，\n　　那我們肯定是可以進去的吧！\n@c0@"
122:
  en: "@a%0%a002030@bI wonder if King Ludwig is in the mirror chamber as we speak.\n@c0@"
  ja: "@a@b%a002030「王さまは\n\tこの　鏡の間の　中に\n\tいらっしゃるのですよね？\n@c0@"
  ko: "@a@b%a002030: 폐하는\n이 거울의 방 안에\n계시는 거 맞겠죠?\n@c0@"
  sl: "@a@b%a002030：国王陛下就在\n　　这个镜之间里吧？\n@c0@"
  tl: "@a@b%a002030：國王陛下就在\n　　這個鏡之間裡吧？\n@c0@"
123:
  en: "@a%0%a002050@bWe've got the Chancellor's permission! Let's just saunter in.\n@c0@"
  ja: "@a@b%a002050「大臣の　許可があるのです！\n\tどうどうと　部屋を　のぞきましょう！\n@c0@"
  ko: "@a@b%a002050: 대신의 허가가 있었잖습니까!\n당당하게 방 안을 보자구요!\n@c0@"
  sl: "@a@b%a002050：得到大臣的许可了！\n　　那就光明正大地偷窥那个房间吧！\n@c0@"
  tl: "@a@b%a002050：得到大臣的許可了！\n　　那就光明正大地偷窺那個房間吧！\n@c0@"
124:
  en: "@a%0%a002000@bThere he goes... I reckon we might as well follow him back upstairs.\n@c0@"
  ja: "@a@b%a002000「ああ……行っちゃったぜ。\n\tとりあえず　王さまの　ところまで\n\t行くとするか。\n@c0@"
  ko: "@a@b%a002000: 아아...... 가 버렸군.\n일단 왕이 있는 곳으로\n가도록 하지.\n@c0@"
  sl: "@a@b%a002000：啊……他走了。\n　　总之先到国王陛下\n　　那里去吧。\n@c0@"
  tl: "@a@b%a002000：啊……他走了。\n　　總之先到國王陛下\n　　那裡去吧。\n@c0@"
125:
  en: "@a%0%a002010@bLet's go and properly introduce ourselves to the King.\n@c0@"
  ja: "@a@b%a002010「王さまに　ちゃんと\n\tごあいさつしましょう。\n@c0@"
  ko: "@a@b%a002010: 폐하께 제대로\n인사를 드리자.\n@c0@"
  sl: "@a@b%a002010：去跟国王陛下\n　　好好打个招呼吧。\n@c0@"
  tl: "@a@b%a002010：去跟國王陛下\n　　好好打個招呼吧。\n@c0@"
126:
  en: "@a%0%a002020@bThe King looked downright depressed.\n@c0@"
  ja: "@a@b%a002020「王さま　部屋の中で\n\tとっても　かなしそうだったね。\n@c0@"
  ko: "@a@b%a002020: 폐하는 방 안에서\n아주 슬퍼하는 것 같았어.\n@c0@"
  sl: "@a@b%a002020：国王陛下在房间里面\n　　好伤心的样子呢。\n@c0@"
  tl: "@a@b%a002020：國王陛下在房間裡面\n　　好傷心的樣子呢。\n@c0@"
127:
  en: "@a%0%a002030@bWe must hurry to the King.\n@c0@"
  ja: "@a@b%a002030「まずは　王さまに\n\tごあいさつです。\n@c0@"
  ko: "@a@b%a002030: 우선은 폐하께\n인사부터 하지요.\n@c0@"
  sl: "@a@b%a002030：先要跟\n　　国王陛下打招呼。\n@c0@"
  tl: "@a@b%a002030：先要跟\n　　國王陛下打招呼。\n@c0@"
128:
  en: "@a%0%a002050@bI reckon he thinks we're a rum bunch.\n@c0@"
  ja: "@a@b%a002050「変な　やつらだと\n\t思われたでしょうか！？\n@c0@"
  ko: "@a@b%a002050: 수상한 사람들이라고\n생각했을까요?\n@c0@"
  sl: "@a@b%a002050：他觉得我们\n　　很奇怪吗？！\n@c0@"
  tl: "@a@b%a002050：他覺得我們\n　　很奇怪嗎？！\n@c0@"
129:
  en: "@a%0%a002000@bHardy har! I'll behave myself, alright.\n@c0@"
  ja: "@a@b%a002000「そそうなんか\n\tするわけ　ないだろ！\n@c0@"
  ko: "@a@b%a002000: 무슨 결례를\n범한다고 그래!\n@c0@"
  sl: "@a@b%a002000：怎么可能会冒犯啊！\n@c0@"
  tl: "@a@b%a002000：怎麼可能會冒犯啊！\n@c0@"
130:
  en: "@a%0%a002010@bHe doesn't need to tell us to behave in front of royalty.\n@c0@"
  ja: "@a@b%a002010「言われるまでもなく\n\t王さまの　前では　失礼の\n\tないように　しましょうね。\n@c0@"
  ko: "@a@b%a002010: 저런 말 굳이 듣지 않더라도\n폐하 앞에서는\n실례가 없도록 하자구.\n@c0@"
  sl: "@a@b%a002010：在国王陛下面前\n　　我们不要失礼啊。\n　　这话不用多说吧。\n@c0@"
  tl: "@a@b%a002010：在國王陛下面前\n　　我們不要失禮啊。\n　　這話不用多說吧。\n@c0@"
131:
  en: "@a%0%a002020@bTee hee! When am I not on my best behaviour?\n@c0@"
  ja: "@a@b%a002020「そそうなんか\n\tしないもんね！\n@c0@"
  ko: "@a@b%a002020: 누가 결례를\n범한단 말이야!\n@c0@"
  sl: "@a@b%a002020：我们才不会冒犯呢！\n@c0@"
  tl: "@a@b%a002020：我們才不會冒犯呢！\n@c0@"
132:
  en: "@a%0%a002030@bI am not sure what behaviour might cause offence, but we should tread carefully.\n@c0@"
  ja: "@a@b%a002030「何が　失礼にあたるか\n\tわかりませんから　ここは\n\tていねいに　ごあいさつしましょう。\n@c0@"
  ko: "@a@b%a002030: 뭐가 결례에 해당하는지\n알 수가 없으니 일단\n정중하게 인사하도록 합시다.\n@c0@"
  sl: "@a@b%a002030：虽然不知道\n　　做什么事会冒犯到国王陛下，\n　　打招呼的时候还是礼貌一点吧。\n@c0@"
  tl: "@a@b%a002030：雖然不知道\n　　做什麼事會冒犯到國王陛下，\n　　打招呼的時候還是禮貌一點吧。\n@c0@"
133:
  en: "@a%0%a002050@bDon't we look like we're always on our best behaviour?\n@c0@"
  ja: "@a@b%a002050「私たちって　そんなに\n\tそそうを　しそうに\n\t見えるんでしょうかね……。\n@c0@"
  ko: "@a@b%a002050: 우리가 그렇게\n결례를 범할 사람처럼\n보이는 걸까요......\n@c0@"
  sl: "@a@b%a002050：我们的样子\n　　看起来像是\n　　会冒犯国王陛下么……\n@c0@"
  tl: "@a@b%a002050：我們的樣子\n　　看起來像是\n　　會冒犯國王陛下麼……\n@c0@"
134:
  en: "@a%0%a002000@bWell? Let's do it!\n@c0@"
  ja: "@a@b%a002000「よし！　やろうぜ！\n@c0@"
  ko: "@a@b%a002000: 좋아! 해 보자고!\n@c0@"
  sl: "@a@b%a002000：好！就这么做！\n@c0@"
  tl: "@a@b%a002000：好！就這麼做！\n@c0@"
135:
  en: "@a%0%a002010@bI do hope Ra's Mirror triggers something...\n@c0@"
  ja: "@a@b%a002010「ラーの鏡が\n\tなにか効果を　はっきすると\n\tいいわね！\n@c0@"
  ko: "@a@b%a002010: 라의 거울이\n어떻게든 효과를 발휘하면\n좋겠어!\n@c0@"
  sl: "@a@b%a002010：要是太阳神镜\n　　能发挥作用就好了啊！\n@c0@"
  tl: "@a@b%a002010：要是太陽神鏡\n　　能發揮作用就好了啊！\n@c0@"
136:
  en: "@a%0%a002020@bWhat a pretty, pretty princess! She sure lived up to the hype!\n@c0@"
  ja: "@a@b%a002020「きれいな　お姫さまね。\n\tわくわくするね！\n@c0@"
  ko: "@a@b%a002020: 아름다운 공주님이네.\n가슴이 두근거려!\n@c0@"
  sl: "@a@b%a002020：公主真漂亮啊。\n　　我好激动！\n@c0@"
  tl: "@a@b%a002020：公主真漂亮啊。\n　　我好激動！\n@c0@"
137:
  en: "@a%0%a002030@bTh-This is extraordinary! There really is someone imprisoned within the mirror!\n@c0@"
  ja: "@a@b%a002030「信じられません！\n\t本当に　鏡の中に　人がいます！\n@c0@"
  ko: "@a@b%a002030: 믿을 수 없어요!\n정말 거울 속에 사람이 있습니다!\n@c0@"
  sl: "@a@b%a002030：难以置信！\n　　镜子里面真的有人啊！\n@c0@"
  tl: "@a@b%a002030：難以置信！\n　　鏡子裡面真的有人啊！\n@c0@"
138:
  en: "@a%0%a002050@bIt's not just glass with someone in a room behind it, right...?\n@c0@"
  ja: "@a@b%a002050「あれって　ガラスのうしろに\n\t部屋があって　そこに人が\n\tいるんじゃないんですか！？\n@c0@"
  ko: "@a@b%a002050: 저거, 유리 뒤에\n방이 있고 거기에 사람이\n있는 거 아닌가요!?\n@c0@"
  sl: "@a@b%a002050：那难道不是\n　　玻璃后面有一间屋子，\n　　人在那屋子里面吗？！\n@c0@"
  tl: "@a@b%a002050：那難道不是\n　　玻璃後面有一間屋子，\n　　人在那屋子裡面嗎？！\n@c0@"
139:
  en: "@a%0%a002000@bHer gums were flappin', but I couldn't hear anything.\n@c0@"
  ja: "@a@b%a002000「カガミ姫が\n\t何か　言ってる　ようだが\n\t聞こえないぜ……。\n@c0@"
  ko: "@a@b%a002000: 거울 공주가\n뭔가를 말하려는 것 같은데\n들리지 않는군......\n@c0@"
  sl: "@a@b%a002000：明镜公主\n　　好像说了什么东西，\n　　但是听不见啊……\n@c0@"
  tl: "@a@b%a002000：明鏡公主\n　　好像說了什麼東西，\n　　但是聽不見啊……\n@c0@"
140:
  en: "@a%0%a002010@bShe was trying to say something... Her mouth was moving, but I couldn't read her lips.\n@c0@"
  ja: "@a@b%a002010「なんて　言ってるのかしら。\n\tクチの　動きを　見ていても\n\tわからないわね。\n@c0@"
  ko: "@a@b%a002010: 무슨 말을 하는 걸까?\n입 모양을 살펴봐도\n잘 모르겠어.\n@c0@"
  sl: "@a@b%a002010：她说了什么呢？\n　　看嘴型看不出来啊。\n@c0@"
  tl: "@a@b%a002010：她說了什麼呢？\n　　看嘴型看不出來啊。\n@c0@"
141:
  en: "@a%0%a002020@bThat poor princess, all cooped up like that. Just looking at her was enough to make me sad...\n@c0@"
  ja: "@a@b%a002020「なんだか\n\tお姫さまを　見ているだけで\n\tかなしく　なっちゃうよ……。\n@c0@"
  ko: "@a@b%a002020: 왠지\n공주님을 보고만 있어도\n마음이 슬퍼져......\n@c0@"
