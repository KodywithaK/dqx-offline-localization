  tl: "@a@b%a002010：沿著東邊的河\n　　向北方前進，\n　　就能到達根特村。\n@c0@"
78:
  en: "@a%0%a002020@bI bet these Ghentiles think they're holy hot stuff. Hope we don't get a lot of attitude...\n@c0@"
