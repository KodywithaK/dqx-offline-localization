  tl: "@a@b%a002000：神之使者根特族……\n　　真想早點看看\n　　他們是什麼樣的人。\n@c0@"
77:
  en: "@a%0%a002010@bSo if we follow the eastern river north into the mountains, we'll reach Ghent, will we? Sounds simple enough.\n@c0@"
  ja: "@a@b%a002010「東の　川ぞいを\n\t北に　のぼって行けば\n\tゲント族の　村があるのね。\n@c0@"
  ko: "@a@b%a002010: 동쪽 강변을 따라\n북쪽으로 올라가면\n겐트족 마을이 나오는구나.\n@c0@"
