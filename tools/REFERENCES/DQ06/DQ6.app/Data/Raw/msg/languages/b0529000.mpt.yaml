  tl: "@a@b%a002010：夢世界的存在\n　　好像已經傳開了呢。\n@c0@"
29:
  en: "@a%0%a002020@bIt must've been Murdaw's curse that kept them asleep all this time...\n@c0@"
  ja: "@a@b%a002020「ずっと　ねてたのは\n\tやっぱり　ムドーの\n\tのろいだったのかな。\n@c0@"
  ko: "@a@b%a002020: 계속 잠들어 있던 건\n역시 무도의\n저주 때문이었나?\n@c0@"
  sl: "@a@b%a002020：他们睡这么久，\n　　还是因为姆多的诅咒吧。\n@c0@"
  tl: "@a@b%a002020：他們睡這麼久，\n　　還是因為姆多的詛咒吧。\n@c0@"
30:
  en: "@a%0%a002000@bOh, boo hoo! Who'd fall for a girl who might sabotage your supper?\n@c0@"
  ja: "@a@b%a002000「この女の　恋人になっても\n\tいつ　きらわれて　毒をもられるか\n\tわかったもんじゃないぜ……。\n@c0@"
  ko: "@a@b%a002000: 이 여자의 연인이 되었다간\n언제 미움을 사서 음식에 독을 탈지\n알 수 없겠는걸......\n@c0@"
  sl: "@a@b%a002000：跟这女人谈恋爱，\n　　说不定什么时候就被甩了，\n　　然后被下毒……\n@c0@"
  tl: "@a@b%a002000：跟這女人談戀愛，\n　　說不定什麼時候就被甩了，\n　　然後被下毒……\n@c0@"
31:
  en: "@a%0%a002010@bWhat goes around, comes around, or so they say... Still, I wouldn't wish loneliness upon anyone.\n@c0@"
  ja: "@a@b%a002010「好きな人が　いないのは\n\tさびしいものね。\n@c0@"
  ko: "@a@b%a002010: 사랑하는 사람이 없다는 건\n쓸쓸한 일이야.\n@c0@"
  sl: "@a@b%a002010：没有喜欢的人真的很寂寞啊。\n@c0@"
  tl: "@a@b%a002010：沒有喜歡的人真的很寂寞啊。\n@c0@"
32:
  en: "@a%0%a002020@bMe, I like guys with a mix of brains and brawn, you know?\n@c0@"
  ja: "@a@b%a002020「あたしはね\n\t頭がよくて　ちから持ちの人が\n\t好きだなー。\n@c0@"
  ko: "@a@b%a002020: 난 말이야,\n똑똑하고 힘센 사람이\n좋아.\n@c0@"
  sl: "@a@b%a002020：人家喜欢的类型是\n　　聪明又有力气的。\n@c0@"
  tl: "@a@b%a002020：人家喜歡的類型是\n　　聰明又有力氣的。\n@c0@"
33:
  en: "@a%0%a002000@bNothin's gonna ruin our good luck. Murdaw's a goner, regardless.\n@c0@"
