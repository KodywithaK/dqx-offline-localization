  en: "@a%0%a002020@bHey %a000090, who do you think is prettier — me or the Queen?\n@c0@"
  ja: "@a@b%a002020「ねえねえ\n\tあたしと　どっちが　美人かな。\n@c0@"
  ko: "@a@b%a002020: 있잖아,\n나랑 비교하면 누가 더 예쁠까?\n@c0@"
  sl: "@a@b%a002020：喂喂，\n　　我和她谁比较漂亮？\n@c0@"
  tl: "@a@b%a002020：喂喂，\n　　我和她誰比較漂亮？\n@c0@"
70:
  en: "@a%0%a002000@bHaulin' all that cargo looks like a great workout. Wonder if he needs a spotter?\n@c0@"
  ja: "@a@b%a002000「これだけの　荷物を　運べば\n\tそうとう　カラダが　きたえられるぜ！\n@c0@"
  ko: "@a@b%a002000: 이 정도의 짐을 옮기면\n몸이 제법 단련되겠어!\n@c0@"
  sl: "@a@b%a002000：搬运了这么多货物，\n　　身体才会变得这么强壮吧！\n@c0@"
  tl: "@a@b%a002000：搬運了這麼多貨物，\n　　身體才會變得這麼強壯吧！\n@c0@"
71:
  en: "@a%0%a002010@bI bet there are lots of excited Somnians waiting for these parcels to be delivered!\n@c0@"
  ja: "@a@b%a002010「きっと　この荷物を\n\tレイドックの人たちが\n\t待っているのね。\n@c0@"
  ko: "@a@b%a002010: 이 짐들은 분명\n레이독 사람들이\n기다리고 있을 거야.\n@c0@"
  sl: "@a@b%a002010：雷多克的人们\n　　在等着这些货物吧。\n@c0@"
  tl: "@a@b%a002010：雷多克的人們\n　　在等著這些貨物吧。\n@c0@"
72:
  en: "@a%0%a002020@bSeems like a lot of cargo. The ship won't sink, will it?\n@c0@"
  ja: "@a@b%a002020「こんなに　荷物つんだら\n\tお船が　しずんじゃうんじゃない？\n@c0@"
  ko: "@a@b%a002020: 이렇게 짐을 많이 쌓으면\n배가 가라앉지 않을까?\n@c0@"
  sl: "@a@b%a002020：这些货物这么重，\n　　船会不会沉啊？\n@c0@"
  tl: "@a@b%a002020：這些貨物這麼重，\n　　船會不會沉啊？\n@c0@"
73:
  en: "@a%0%a002000@bHuzzah! New territory to tame! More monsters to massacre!\n@c0@"
  ja: "@a@b%a002000「くうう～っ！\n\tまた　新たな　土地での\n\tたたかいが　はじまるぜ！\n@c0@"
  ko: "@a@b%a002000: 크으으~윽!\n또다시 새로운 땅에서\n싸움이 시작되는군!\n@c0@"
