  sl: "@a@b%a002010：谢谢你。\n　　我们会小心行动的。\n@c0@"
  tl: "@a@b%a002010：謝謝你。\n　　我們會小心行動的。\n@c0@"
75:
  en: "@a%0%a002020@bWe'd better make a beeline for Ghent!\n@c0@"
  ja: "@a@b%a002020「ゲント族の村を\n\tめざさなくっちゃ！\n@c0@"
