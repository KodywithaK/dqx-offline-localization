  sl: "@a@b%a002010：雷多克城里的人\n　　真的都很高兴呢。\n@c0@"
  tl: "@a@b%a002010：雷多克城裡的人\n　　真的都很高興呢。\n@c0@"
20:
  en: "@a%0%a002020@bI love parties!\n@c0@"
  ja: "@a@b%a002020「あたしも\n\tおまつり　大好き！\n@c0@"
  ko: "@a@b%a002020: 나도\n축제 완전 좋아해!\n@c0@"
  sl: "@a@b%a002020：人家最喜欢热闹啦！\n@c0@"
  tl: "@a@b%a002020：人家最喜歡熱鬧啦！\n@c0@"
21:
  en: "@a%0%a002000@bAvast! So they really woke up, aye?\n@c0@"
  ja: "@a@b%a002000「そっか！\n\t本当に　目ざめたんだな！\n@c0@"
  ko: "@a@b%a002000: 그렇군!\n정말로 눈을 떴구나!\n@c0@"
  sl: "@a@b%a002000：是吗？\n　　真的醒了啊！\n@c0@"
  tl: "@a@b%a002000：是嗎？\n　　真的醒了啊！\n@c0@"
22:
  en: "@a%0%a002010@bI suppose we'll finally be able to meet them, then.\n@c0@"
  ja: "@a@b%a002010「今度こそ　王さまたちに\n\tお会いできるわね。\n@c0@"
  ko: "@a@b%a002010: 이번에야말로 왕과 왕비를\n만날 수 있겠네.\n@c0@"
  sl: "@a@b%a002010：这次终于可以见到雷多克王了。\n@c0@"
  tl: "@a@b%a002010：這次終於可以見到雷多克王了。\n@c0@"
23:
  en: "@a%0%a002020@bThey must've woken up once we beat Murdaw over in the dream world.\n@c0@"
  ja: "@a@b%a002020「夢の世界の\n\tムドーを　たおしたから\n\t目ざめたのかな。\n@c0@"
  ko: "@a@b%a002020: 꿈의 세계의\n무도를 해치웠기 때문에\n잠에서 깬 걸까?\n@c0@"
  sl: "@a@b%a002020：大概是因为\n　　梦世界的姆多被打倒了，\n　　他才能醒来的吧。\n@c0@"
  tl: "@a@b%a002020：大概是因為\n　　夢世界的姆多被打倒了，\n　　他才能醒來的吧。\n@c0@"
24:
  en: "@a%0%a002000@bI reckon you could say we're wanderin' around in our dreams too!\n@c0@"
  ja: "@a@b%a002000「まあ　オレたちだって\n\t夢の世界を　さまよっているような\n\tもんだけどな。\n@c0@"
  ko: "@a@b%a002000: 하긴, 우리도\n꿈의 세계를 헤매고 있는\n것과 다름없지.\n@c0@"
  sl: "@a@b%a002000：比起他们，\n　　咱们才是迷失在梦世界了吧。\n@c0@"
  tl: "@a@b%a002000：比起他們，\n　　咱們才是迷失在夢世界了吧。\n@c0@"
25:
  en: "@a%0%a002010@bEven when they were fast asleep, the King and Queen's hearts were as one. Isn't it moving?\n@c0@"
  ja: "@a@b%a002010「ずっと　ねむったままでも\n\tおふたりの心は　ひとつだったわね。\n\t感動しちゃった。\n@c0@"
  ko: "@a@b%a002010: 잠들어 있는 동안에도\n두 사람의 마음은 하나였어.\n너무 감동적이야.\n@c0@"
  sl: "@a@b%a002010：即使睡了那么久，\n　　他们俩的心也一直在一起。\n　　太感人了。\n@c0@"
  tl: "@a@b%a002010：即使睡了那麼久，\n　　他們倆的心也一直在一起。\n　　太感人了。\n@c0@"
26:
  en: "@a%0%a002020@b‘Curious incident’? Story of my life these days...\n@c0@"
  ja: "@a@b%a002020「ふしぎなことって\n\t意外と　いっぱいあるよね。\n@c0@"
  ko: "@a@b%a002020: 세상엔 신기한 일이\n생각보다 훨씬 많구나.\n@c0@"
  sl: "@a@b%a002020：不可思议的事情\n　　真的到处都存在啊。\n@c0@"
  tl: "@a@b%a002020：不可思議的事情\n　　真的到處都存在啊。\n@c0@"
27:
  en: "@a%0%a002000@bWonder what he'd think if he knew we actually come from the dream world! Not that he'd believe us...\n@c0@"
  ja: "@a@b%a002000「オレたちが\n\tその　夢の世界の　住人だぜ！\n\tっていっても　信じないだろうな。\n@c0@"
  ko: "@a@b%a002000: 우리가 바로\n그 꿈의 세계의 사람들이다!\n라고 말해도 믿지 않겠지.\n@c0@"
  sl: "@a@b%a002000：俺们就是那个梦世界的人！\n　　但是恐怕没人会相信的。\n@c0@"
  tl: "@a@b%a002000：俺們就是那個夢世界的人！\n　　但是恐怕沒人會相信的。\n@c0@"
28:
  en: "@a%0%a002010@bEveryone's talking about the dream world these days...\n@c0@"
  ja: "@a@b%a002010「夢の世界のことが\n\tかなりの　ウワサに\n\tなってるみたいね。\n@c0@"
  ko: "@a@b%a002010: 꿈의 세계에\n관한 이야기가\n소문이 난 모양이네.\n@c0@"
