  sl: "@a@b%a002020：目标根特村！\n@c0@"
  tl: "@a@b%a002020：目標根特村！\n@c0@"
76:
  en: "@a%0%a002000@bSpecially favoured, aye? Can't wait to see what all that's about!\n@c0@"
  ja: "@a@b%a002000「神の使い　ゲント族……。\n\tどんな　連中なのか\n\t早いとこ　会ってみたいぜ！\n@c0@"
