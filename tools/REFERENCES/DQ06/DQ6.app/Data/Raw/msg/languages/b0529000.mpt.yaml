0:
  en: "@a%0%a002000@bBeatin' Murdaw in the dream world musta woken 'em up, aye?\n@c0@"
  ja: "@a@b%a002000「夢の世界の　ムドーを\n\tたおしたから　下のレイドック王が\n\t目ざめたんだな！\n@c0@"
  ko: "@a@b%a002000: 꿈의 세계의 무도를\n해치웠기 때문에 아래쪽 세계의\n레이독 왕이 눈을 뜬 거군!\n@c0@"
  sl: "@a@b%a002000：打倒了梦世界的姆多，\n　　现实世界的雷多克王\n　　就醒过来了！\n@c0@"
  tl: "@a@b%a002000：打倒了夢世界的姆多，\n　　現實世界的雷多克王\n　　就醒過來了！\n@c0@"
1:
  en: "@a%0%a002010@bIsn't that wonderful, %a000090? They've finally awoken from their slumber!\n@c0@"
  ja: "@a@b%a002010「よかった！\n\t長いねむりから　さめたのね。\n@c0@"
  ko: "@a@b%a002010: 다행이야!\n오랜 잠에서 깨어났구나.\n@c0@"
  sl: "@a@b%a002010：太好了！\n　　终于从长眠中醒来了。\n@c0@"
  tl: "@a@b%a002010：太好了！\n　　終於從長眠中醒來了。\n@c0@"
2:
  en: "@a%0%a002020@b‘Cured’? Who says they were sick?\n@c0@"
  ja: "@a@b%a002020「みんなは\n\t病気だと　思ってたんだね。\n@c0@"
  ko: "@a@b%a002020: 사람들은\n병에 걸린 줄 알았구나.\n@c0@"
  sl: "@a@b%a002020：大家都以为是生病了。\n@c0@"
  tl: "@a@b%a002020：大家都以為是生病了。\n@c0@"
3:
  en: "@a%0%a002000@bThat ain't news to us.\n@c0@"
  ja: "@a@b%a002000「もっちろん　知ってるぜ！\n@c0@"
  ko: "@a@b%a002000: 물론 알고 있고 말고!\n@c0@"
  sl: "@a@b%a002000：当然知道啦！\n@c0@"
  tl: "@a@b%a002000：當然知道啦！\n@c0@"
4:
  en: "@a%0%a002010@bThere was quite a commotion over in Somnia, wasn't there, %a000090?\n@c0@"
  ja: "@a@b%a002010「レイドックでは\n\tもう　大さわぎだったわね。\n@c0@"
  ko: "@a@b%a002010: 레이독에서는\n난리법석이었나 봐.\n@c0@"
  sl: "@a@b%a002010：雷多克城里的人们\n　　全都兴奋得不得了呢。\n@c0@"
  tl: "@a@b%a002010：雷多克城裡的人們\n　　全都興奮得不得了呢。\n@c0@"
5:
  en: "@a%0%a002020@b‘Cured’? Who says they were sick?\n@c0@"
  ja: "@a@b%a002020「みんなは\n\t病気だと　思ってたんだね。\n@c0@"
  ko: "@a@b%a002020: 사람들은\n병에 걸린 줄 알았구나.\n@c0@"
  sl: "@a@b%a002020：大家都以为是生病了。\n@c0@"
  tl: "@a@b%a002020：大家都以為是生病了。\n@c0@"
6:
  en: "@a%0%a002000@bWe'd better go and see the King before too long, aye?\n@c0@"
  ja: "@a@b%a002000「オレたちも\n\t早いとこ　王さまに\n\t会いに　行かなくちゃな。\n@c0@"
  ko: "@a@b%a002000: 우리도\n얼른 왕을\n만나야겠어.\n@c0@"
  sl: "@a@b%a002000：咱们也快点去见国王吧。\n@c0@"
  tl: "@a@b%a002000：咱們也快點去見國王吧。\n@c0@"
7:
  en: "@a%0%a002010@bWhat do you think? Shall we take the ferry to Somnia, or should we Zoom there to save time?\n@c0@"
  ja: "@a@b%a002010「どうする？\n\tレイドック城へは　船で行く？\n\t急ぐなら　ルーラね。\n@c0@"
  ko: "@a@b%a002010: 어떡할래?\n레이독 성에는 배 타고 갈 거야?\n급하면 루라를 쓰든지.\n@c0@"
  sl: "@a@b%a002010：怎么办？\n　　要坐船去吗？\n　　着急的话就用鲁拉吧。\n@c0@"
  tl: "@a@b%a002010：怎麼辦？\n　　要坐船去嗎？\n　　著急的話就用魯拉吧。\n@c0@"
8:
  en: "@a%0%a002020@bThat soldier looked like he was about to burst into tears!\n@c0@"
  ja: "@a@b%a002020「この　兵隊さん\n\t泣いてる　みたいだよ。\n@c0@"
  ko: "@a@b%a002020: 이 병사 아저씨\n울고 있나 봐.\n@c0@"
  sl: "@a@b%a002020：这位士兵好像在哭啊。\n@c0@"
  tl: "@a@b%a002020：這位士兵好像在哭啊。\n@c0@"
9:
  en: "@a%0%a002000@bSeems like anyone who knew those two is happy now, aye?\n@c0@"
  ja: "@a@b%a002000「レイドック王を\n\t知ってる人間は　みな\n\tうれしいよな。\n@c0@"
  ko: "@a@b%a002000: 레이독 왕을\n알고 있는 사람들은\n모두 기쁠 거야.\n@c0@"
  sl: "@a@b%a002000：知道雷多克王的人\n　　都为他醒来而高兴。\n@c0@"
  tl: "@a@b%a002000：知道雷多克王的人\n　　都為他醒來而高興。\n@c0@"
10:
  en: "@a%0%a002010@bEven as far away as Port Haven, news of King Somnus's recovery is raising people's spirits!\n@c0@"
  ja: "@a@b%a002010「ここにも\n\tよろこんでくれる人がいて\n\tよかったわね。\n@c0@"
  ko: "@a@b%a002010: 여기도\n기뻐하는 사람이 있어서\n다행이야.\n@c0@"
  sl: "@a@b%a002010：这里也有人为国王高兴，\n　　真好啊。\n@c0@"
  tl: "@a@b%a002010：這裡也有人為國王高興，\n　　真好啊。\n@c0@"
11:
  en: "@a%0%a002020@bThat soldier looked like he was about to burst into tears!\n@c0@"
  ja: "@a@b%a002020「この　兵隊さん\n\t泣いてる　みたいだよ。\n@c0@"
  ko: "@a@b%a002020: 이 병사 아저씨\n울고 있나 봐.\n@c0@"
  sl: "@a@b%a002020：这位士兵好像在哭啊。\n@c0@"
  tl: "@a@b%a002020：這位士兵好像在哭啊。\n@c0@"
12:
  en: "@a%0%a002000@bLooks like the ferries have a hard-workin' crew.\n@c0@"
  ja: "@a@b%a002000「よかったな。\n\tこれからも　がんばれよ！\n@c0@"
  ko: "@a@b%a002000: 참 잘됐군.\n앞으로도 열심히 해!\n@c0@"
  sl: "@a@b%a002000：太好了。\n　　以后你要更努力！\n@c0@"
  tl: "@a@b%a002000：太好了。\n　　以後你要更努力！\n@c0@"
13:
  en: "@a%0%a002010@bHmm. The sea is still full of monsters, though, so we do need to be careful.\n@c0@"
  ja: "@a@b%a002010「でもまだ　海には\n\tたくさんの　まものが　いるから\n\t航海は　気をつけてね。\n@c0@"
  ko: "@a@b%a002010: 하지만 바다에는 여전히\n마물들이 많으니까\n항해할 때는 조심해야 해.\n@c0@"
  sl: "@a@b%a002010：但是海里还有许多魔物，\n　　出海要小心啊。\n@c0@"
  tl: "@a@b%a002010：但是海裡還有許多魔物，\n　　出海要小心啊。\n@c0@"
14:
  en: "@a%0%a002020@bWow, this guy's in amazing shape! Guess hauling cargo is the best workout there is.\n@c0@"
  ja: "@a@b%a002020「この人　見かけによらず\n\tすっごい　きん肉だね！\n\tおもい物を　運んでるからかな。\n@c0@"
  ko: "@a@b%a002020: 이 사람 보기와는\n다르게 근육이 굉장해! 무거운 \n짐을 옮기다 보니 단련이 됐나?\n@c0@"
  sl: "@a@b%a002020：这人外表不起眼，\n　　没想到这么有肌肉！\n　　是因为老搬运重物吗。\n@c0@"
  tl: "@a@b%a002020：這人外表不起眼，\n　　沒想到這麼有肌肉！\n　　是因為老搬運重物嗎。\n@c0@"
15:
  en: "@a%0%a002000@bI wouldn't mind knockin' back a few drinks too! What do ya say, %a000090?\n@c0@"
  ja: "@a@b%a002000「まつりは　いいよな！\n\t何ていうか　こう　血がさわぐんだよな！\n@c0@"
  ko: "@a@b%a002000: 축제는 참 좋단 말이지!\n뭐랄까, 뜨거운 피가 꿈틀거려!\n@c0@"
  sl: "@a@b%a002000：那多好啊！\n　　只要想想俺就热血沸腾了！\n@c0@"
  tl: "@a@b%a002000：那多好啊！\n　　只要想想俺就熱血沸騰了！\n@c0@"
16:
  en: "@a%0%a002010@b‘Wild party’? Sounds like the news from Somnia is really spreading fast!\n@c0@"
  ja: "@a@b%a002010「おまつりさわぎ？\n\t何か　レイドック城の　ウワサが\n\t入ったのかしら。\n@c0@"
  ko: "@a@b%a002010: 축제로 떠들썩?\n뭔가 레이독 성의 소문이\n퍼졌나?\n@c0@"
  sl: "@a@b%a002010：欢腾？\n　　雷多克城的消息\n　　已经传到这里了啊。\n@c0@"
  tl: "@a@b%a002010：歡騰？\n　　雷多克城的消息\n　　已經傳到這裡了啊。\n@c0@"
17:
  en: "@a%0%a002020@bI love parties!\n@c0@"
  ja: "@a@b%a002020「あたしも\n\tおまつり　大好き！\n@c0@"
  ko: "@a@b%a002020: 나도\n축제 완전 좋아해!\n@c0@"
  sl: "@a@b%a002020：人家最喜欢热闹啦！\n@c0@"
  tl: "@a@b%a002020：人家最喜歡熱鬧啦！\n@c0@"
18:
  en: "@a%0%a002000@bSomnia seems like an awful long way to drag an anchor.\n@c0@"
  ja: "@a@b%a002000「オレたちは\n\tひとあし　おさきに\n\t行って来たぜ！\n@c0@"
  ko: "@a@b%a002000: 우리는\n한걸음 앞서\n다녀왔지!\n@c0@"
  sl: "@a@b%a002000：咱们没等庆祝结束\n　　就提前从那里离开了！\n@c0@"
  tl: "@a@b%a002000：咱們沒等慶祝結束\n　　就提前從那裡離開了！\n@c0@"
19:
  en: "@a%0%a002010@bIt really was nice, wasn't it? Everyone in Somnia's got a spring in their step!\n@c0@"
