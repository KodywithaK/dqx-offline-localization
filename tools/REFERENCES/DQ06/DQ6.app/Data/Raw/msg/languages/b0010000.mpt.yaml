  sl: "@a@b＊：她以前的名号是疾风吉娜。\n@c0@"
  tl: "@a@b＊：她以前的名號是疾風吉娜。\n@c0@"
72:
  en: "@a@b*: Who'd 'ave thought there'd be a certified legend livin' in a church in this no-horse town?\n@c0@"
