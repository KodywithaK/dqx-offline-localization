  ko: "@a@b지나: 달거울 탑에 가려면......\n그래, 레이독 성에서 동북쪽으로\n빙 돌아서 서쪽으로 가면 돼.\n@c0@"
  sl: "@a@b吉娜：想去月镜之塔的话……\n　　只要先绕到雷多克城的东北，\n　　再径直向西走就可以了。\n@c0@"
  tl: "@a@b吉娜：想去月鏡之塔的話……\n　　只要先繞到雷多克城的東北，\n　　再徑直向西走就可以了。\n@c0@"
67:
  en: "@a@b*: It is rare indeed for Evgenya to have a visitor. Could that old gentleman be a figure from her past?\n@c0@"
  ja: "@a@b＊「さきほど　ジーナばあさんに\n\t旅のご老人が　たずねてきたが\n\t古い知り合いか　なにかかのう。\n@c0@"
  ko: "@a@b*: 아까 지나 할머니한테\n여행 중인 웬 노인이 찾아왔는데\n오래전부터 아는 사이 같더군.\n@c0@"
  sl: "@a@b＊：刚刚有位旅行的老人家\n　　来找吉娜婆婆，\n　　大概是她的旧相识吧。\n@c0@"
  tl: "@a@b＊：剛剛有位旅行的老人家\n　　來找吉娜婆婆，\n　　大概是她的舊相識吧。\n@c0@"
68:
  en: "@a@b*: Welcome to Amor, home of amor seco essence. Accept no substitute!\n@c0@"
  ja: "@a@b＊「水　きよき町\n\tアモールに　ようこそ。\n@c0@"
