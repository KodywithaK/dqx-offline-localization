  ko: "@a@b*: 아무도 내 모습이 안 보이는지\n말을 걸어도 대답도 없고......\n정말 외로웠거든.\n@c0@"
  sl: "@a@b＊：你看你看，\n　　镜子里也没有我的影子。\n　　真是太讨厌了。\n@c0@"
  tl: "@a@b＊：你看你看，\n　　鏡子裡也沒有我的影子。\n　　真是太討厭了。\n@c0@"
102:
