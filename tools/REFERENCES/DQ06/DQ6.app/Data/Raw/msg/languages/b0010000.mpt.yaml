  sl: "@a@b＊：我公公去年过世了。\n　　他在世的时候，\n　　曾经很照顾吉娜婆婆。\n@c0@"
  tl: "@a@b＊：我公公去年過世了。\n　　他在世的時候，\n　　曾經很照顧吉娜婆婆。\n@c0@"
75:
