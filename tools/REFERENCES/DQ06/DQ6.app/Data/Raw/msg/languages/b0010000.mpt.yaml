  sl: "@a@b＊：你在骗谁啊。\n　　能跟人家对话，\n　　不就证明能看见人家吗。\n@c0@"
  tl: "@a@b＊：你在騙誰啊。\n　　能跟人家對話，\n　　不就證明能看見人家嗎。\n@c0@"
99:
  en: "@a@b*: Finally, someone in this mad world can see me! It's like a dream come true!\n@c0@"
  ja: "@a@b＊「やっと　見つけたわ！\n\tあたしの姿が　見えるひとを！\n@c0@"
  ko: "@a@b*: 무슨 소리야.\n보이니까 나한테\n말을 걸었을 거 아냐?\n@c0@"
  sl: "@a@b＊：终于找到了！\n　　能看见我的人！\n@c0@"
  tl: "@a@b＊：終於找到了！\n　　能看見我的人！\n@c0@"
100:
  en: "@a@b*: You'd think being invisible would be fun, but it's totally boring! Everyone ignores me, or worse — they try to walk through me!\n@c0@"
  ja: "@a@b＊「みんな　見えないみたいで\n\t話しかけても　返事もなくて……。\n\tホント　さみしかったわよ。\n@c0@"
  ko: "@a@b*: 이제야 찾았어!\n내 모습이 보이는 사람을!\n@c0@"
  sl: "@a@b＊：别人好像都看不见，\n　　跟他们说话也不理人家……\n　　真是寂寞呢。\n@c0@"
  tl: "@a@b＊：別人好像都看不見，\n　　跟他們說話也不理人家……\n　　真是寂寞呢。\n@c0@"
101:
  en: "@a@b*: I can't even fix my hair! See my reflection in the mirror? There isn't one! What a pain!\n@c0@"
