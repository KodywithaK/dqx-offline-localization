  tl: "@a@b＊：嘖嘖，人不可貌相，\n　　說的就是她吧。\n@c0@"
74:
  en: "@a@b*: My old father passed away last year, but he used to always go out of his way for Evgenya.\n@c0@"
  ja: "@a@b＊「去年　死んだ　うちのじいさんは\n\tなにかと　ジーナばあさんの\n\tめんどうを　みたそうよ。\n@c0@"
