  tl: "@a@b＊：不好意思。\n　　瀑布聲音太大，\n　　我聽不清……\n@c0@"
80:
  en: "@a@b*: Gurgh-phew, gurgh-phew...\n@c0@"
  ja: "@a@b＊「ぐおー　ぐおー。\n@c0@"
  ko: "@a@b*: 드르렁 드르렁.\n@c0@"
  sl: "@a@b＊：呼噜，呼噜。\n@c0@"
  tl: "@a@b＊：呼嚕，呼嚕。\n@c0@"
81:
  en: "@a@b*: When I was a wee nipper, I heard about a pair of bandits who came here in search of spoils to plunder.\n@c0@"
  ja: "@a@b＊「もう　ずいぶん　昔のことだが\n\tこの町に　男女のふたり組の\n\tとうぞくが　やってきてな。\n@c0@"
  ko: "@a@b*: 이미 오래 전 일이지만\n남녀 2인조 도적이\n이 마을에 왔었어.\n@c0@"
