  sl: "@a@b＊：欢迎来到\n　　清水镇爱摩尔。\n@c0@"
  tl: "@a@b＊：歡迎來到\n　　清水鎮愛摩爾。\n@c0@"
69:
  en: "@a@b*: ...What? Our precious water ran red!? Are you certain you weren't dreaming? I've never heard anything so preposterous!\n@c0@"
  ja: "@a@b＊「え？　川の水が　赤く　そまった？\n\tいやだよ　なに　言ってんだか。\n\tきっと　夢でも見てたね。\n@c0@"
  ko: "@a@b*: 뭐? 강물이 붉게 물들었다고?\n무슨 말도 안 되는 소릴 하는 거야.\n꿈이라도 꿨나 봐.\n@c0@"
  sl: "@a@b＊：诶？河水被染成血红色？\n　　你在胡说什么啊。\n　　一定是做噩梦了吧。\n@c0@"
  tl: "@a@b＊：誒？河水被染成血紅色？\n　　你在胡說什麼啊。\n　　一定是做噩夢了吧。\n@c0@"
70:
  en: "@a@b*: So as it turns out, the ol' dragon in the church is none other than the famed bandit, Evgenya the Cyclone!\n@c0@"
  ja: "@a@b＊「いやはや　おどろいたよ。\n\t教会で　下ばたらきをしている\n\tばあさんの　ことだがな。\n@c0@"
  ko: "@a@b*: 이야, 깜짝 놀랐어.\n성당에서 허드렛일을 거들고 있는\n할머니 말이야.\n@c0@"
  sl: "@a@b＊：啧啧，真令我吃惊。\n　　想不到在教会帮佣的老婆婆\n　　还有这样的过去。\n@c0@"
  tl: "@a@b＊：嘖嘖，真令我吃驚。\n　　想不到在教會幫傭的老婆婆\n　　還有這樣的過去。\n@c0@"
71:
  en: "@a@b*: That's what they used to call 'er, anyway. She was quite the force of nature, I'll warrant.\n@c0@"
