  tl: "@a@b＊：啊啊？你說什麼？\n@c0@"
77:
  en: "@a@b*: THAT HOUSE TO THE EAST, YOU SAY? YES, THAT'S MY SON ALRIGHT. A FINE YOUNG MAN!\n@c0@"
  ja: "@a@b＊「ああ　そうじゃ。\n\t東の家の主人は　たしかに\n\tわしのムスコじゃよ。\n@c0@"
