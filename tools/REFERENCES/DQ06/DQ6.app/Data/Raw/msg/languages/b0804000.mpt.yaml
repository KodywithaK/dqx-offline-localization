  ja: "@a@bトビラは　ふしぎなチカラで\n閉ざされているようだ……。\n@c0@"
  ko: "@a@b문은 신비한 힘으로\n잠겨 있는 모양이다......\n@c0@"
  sl: "@a@b门似乎被一股\n不可思议的力量封闭着……\n@c0@"
  tl: "@a@b門似乎被一股\n不可思議的力量封閉著……\n@c0@"
137:
  en: "@a@b%0%a000120 finds a hidden staircase!\n@c0@"
  ja: "@a@bなんと　階段を　みつけた！\n@c0@"
  ko: "@a@b놀랍게도 계단을 발견했다!\n@c0@"
  sl: "@a@b发现了台阶！\n@c0@"
  tl: "@a@b發現了臺階！\n@c0@"
138:
  en: "@a@b‘Sometimes even the brave must fall’\n@c0@"
  ja: "@a@b『時には　自ら　落ちる勇気も必要だ』\n@c0@"
  ko: "@a@b'때로는 스스로 떨어질 용기도 필요하다'\n@c0@"
  sl: "@a@b“有时需要有自己跳下去的勇气”\n@c0@"
  tl: "@a@b“有時需要有自己跳下去的勇氣”\n@c0@"
