  tl: "@a@b然後%a002010\n迅速地補了妝。\n@c0@"
85:
  en: "@a%0%a002010@bI'm sure that Madame Luca would be able to see the future in this mirror...\n@c0@"
  ja: "@a@b%a002010「おばあちゃんなら\n\t鏡を　使って　占いも\n\tできるんだけど……。\n@c0@"
  ko: "@a@b%a002010: 할머니라면\n거울을 사용해서 점도\n볼 수 있을 텐데......\n@c0@"
  sl: "@a@b%a002010：婆婆的话\n　　可以使用镜子占卜……\n@c0@"
  tl: "@a@b%a002010：婆婆的話\n　　可以使用鏡子占卜……\n@c0@"
86:
  en: "@a%0%a002010@bI'm still struggling to see anything beyond my own face, though.\n@c0@"
  ja: "@a@b%a002010「私には　まだ\n\t無理みたいね。\n@c0@"
  ko: "@a@b%a002010: 난 아직\n어려울 것 같아.\n@c0@"
  sl: "@a@b%a002010：我的话还不行。\n@c0@"
  tl: "@a@b%a002010：我的話還不行。\n@c0@"
87:
  en: "@a@bShe seems to be lost in deep thought.\n@c0@"
  ja: "@a@b%a002010は　鏡の前で\n何かを　考えこんでいる。\n@c0@"
  ko: "@a@b%a002010%F2010%X는%Y은%Z 거울 앞에서\n뭔가를 곰곰이 생각하고 있다.\n@c0@"
  sl: "@a@b%a002010站在镜子前\n好像在思考着什么。\n@c0@"
  tl: "@a@b%a002010站在鏡子前\n好像在思考著什麼。\n@c0@"
88:
  en: "@a%0%a002010@bI've been told that %a002040 and I have similar eyes...\n@c0@"
  ja: "@a@b%a002010「%a002040と　私って\n\t目元が　似ているって\n\t言われるのよ。\n@c0@"
