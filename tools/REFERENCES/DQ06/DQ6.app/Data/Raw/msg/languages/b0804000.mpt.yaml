  sl: "@a@b%a002010：别人说\n　　%a002040和我的眼神很像。\n@c0@"
  tl: "@a@b%a002010：別人說\n　　%a002040和我的眼神很像。\n@c0@"
89:
  en: "@a%0%a002010@bLooking at them closely, I think I'm starting to agree.\n@c0@"
  ja: "@a@b%a002010「よく見てみると\n\tそうかもしれないわね。\n@c0@"
  ko: "@a@b%a002010: 잘 보면\n진짜 그런 것 같기도 하네.\n@c0@"
  sl: "@a@b%a002010：仔细观察的话\n　　好像还真是这样。\n@c0@"
  tl: "@a@b%a002010：仔細觀察的話\n　　好像還真是這樣。\n@c0@"
90:
  en: "@a@bHe brings himself closer to his reflection.\n@c0@"
  ja: "@a@b%a002030は　さらに　鏡に\n顔を　近づけた。\n@c0@"
  ko: "@a@b%a002030%F2030%X는%Y은%Z 거울에 얼굴을\n더욱 바싹 갖다댔다.\n@c0@"
  sl: "@a@b%a002030\n把脸又凑近了镜子一点。\n@c0@"
  tl: "@a@b%a002030\n把臉又湊近了鏡子一點。\n@c0@"
91:
  en: "@a%0%a002030@bHmm... This is no good. I appear to be getting more nearsighted by the minute...\n@c0@"
  ja: "@a@b%a002030「……いけませんね。\n\tまた　近眼が　進んだようです。\n@c0@"
  ko: "@a@b%a002030: ......이런, 이런.\n또 근시가 진행된 모양입니다.\n@c0@"
  sl: "@a@b%a002030：……这样可不行。\n　　好像近视又加重了。\n@c0@"
  tl: "@a@b%a002030：……這樣可不行。\n　　好像近視又加重了。\n@c0@"
92:
  en: "@a@bHe notices that his hat has fallen off-centre...\n@c0@"
  ja: "@a@bぼうしが　ずれている……。\n@c0@"
  ko: "@a@b모자가 비뚤어져 있다......\n@c0@"
  sl: "@a@b帽子歪了……\n@c0@"
  tl: "@a@b帽子歪了……\n@c0@"
93:
  en: "@a@bHe hastily repositions it.\n@c0@"
  ja: "@a@b%a002030は　あわてて\nぼうしを　なおした。\n@c0@"
  ko: "@a@b%a002030%F2030%X는%Y은%Z 황급히\n모자를 고쳐 썼다.\n@c0@"
  sl: "@a@b%a002030慌忙\n扶正了帽子。\n@c0@"
  tl: "@a@b%a002030慌忙\n扶正了帽子。\n@c0@"
94:
  en: "@a%0%a002030@bIt wouldn't do to wear my hat at a sloppy angle. I am representing Ghent, after all!\n@c0@"
  ja: "@a@b%a002030「ゲントの民の　代表として\n\t世界を　回るわけですから\n\tはずかしい　かっこうは　できません。\n@c0@"
  ko: "@a@b%a002030: 겐트족 대표로서\n이 세계를 돌고 있는 거니까\n창피하게 입고 돌아다닐 순 없죠.\n@c0@"
  sl: "@a@b%a002030：我现在是代表\n　　根特人民在环游世界，\n　　所以样子不能太寒酸。\n@c0@"
  tl: "@a@b%a002030：我現在是代表\n　　根特人民在環遊世界，\n　　所以樣子不能太寒酸。\n@c0@"
95:
  en: "@a%0%a002030@bI'm always nervous around large mirrors. You can't help but feel like someone might step out of them at any moment...\n@c0@"
  ja: "@a@b%a002030「大きな　鏡を見ていると\n\t中から　誰かが出てくるのではと\n\t思ってしまいますね。\n@c0@"
  ko: "@a@b%a002030: 커다란 거울을 보고 있자니\n안에서 누가 튀어나오진 않을까\n싶은 생각이 드네요.\n@c0@"
  sl: "@a@b%a002030：一直盯着一面大镜子看，\n　　总感觉会有什么人\n　　从里面跳出来似的。\n@c0@"
  tl: "@a@b%a002030：一直盯著一面大鏡子看，\n　　總感覺會有什麼人\n　　從裡面跳出來似的。\n@c0@"
96:
  en: "@a@bHe notices that his eyeglass frames are a tad dented.\n@c0@"
  ja: "@a@bよく見ると　メガネのふちが\nすこし　曲がっている。\n@c0@"
  ko: "@a@b잘 보니 안경테 끝이\n살짝 휘어져 있다.\n@c0@"
  sl: "@a@b仔细一看发现\n镜框有点弯曲。\n@c0@"
  tl: "@a@b仔細一看發現\n鏡框有點彎曲。\n@c0@"
97:
  en: "@a@b%0%a002030 takes them off and makes a half-hearted effort to fix them.\n@c0@"
  ja: "@a@b%a002030は　メガネをはずし\n直そうとしたが　ダメだった。\n@c0@"
  ko: "@a@b%a002030%F2030%X는%Y은%Z 안경을 벗고\n고쳐 보려 했지만 실패했다.\n@c0@"
  sl: "@a@b%a002030摘下眼镜\n想要掰回来，可是不行。\n@c0@"
  tl: "@a@b%a002030摘下眼鏡\n想要掰回來，可是不行。\n@c0@"
98:
  en: "@a%0%a002020@bI used to take my reflection for granted, but not any more.\n@c0@"
  ja: "@a@b%a002020「やっぱり　こうして\n\t自分の姿が　うつってると\n\tホッと　するわね。\n@c0@"
  ko: "@a@b%a002020: 역시 이렇게\n내 모습이 비치는 걸 보면\n안심이 된다니까.\n@c0@"
  sl: "@a@b%a002020：果然像现在这样\n　　看到自己的身影映在镜中，\n　　真是让人松一口气。\n@c0@"
  tl: "@a@b%a002020：果然像現在這樣\n　　看到自己的身影映在鏡中，\n　　真是讓人鬆一口氣。\n@c0@"
99:
  en: "@a@bShe tries to recall the past, but everything's a blur...\n@c0@"
  ja: "@a@b%a002020は　むかしのことを\n思い出そうとしたが　無理だった……。\n@c0@"
  ko: "@a@b%a002020%F2020%X는%Y은%Z 옛날 일을\n떠올리려고 했지만 실패했다......\n@c0@"
  sl: "@a@b%a002020试着回想过去的事情，\n但还是想不起来……\n@c0@"
  tl: "@a@b%a002020試著回想過去的事情，\n但還是想不起來……\n@c0@"
100:
  en: "@a%0%a002020@bSometimes when I look at a mirror, I get the strangest feeling that — poof! — I'm going to disappear.\n@c0@"
  ja: "@a@b%a002020「鏡を見てると　そのうち\n\t自分が　消えちゃうんじゃないかって\n\t不安に　思うことも　あるのよね。\n@c0@"
  ko: "@a@b%a002020: 거울을 보고 있으면 언젠가\n내가 사라지는 게 아닐까 하고\n불안해질 때가 있어.\n@c0@"
  sl: "@a@b%a002020：有时照着镜子，\n　　会担心自己会不会某天突然消失掉，\n　　心里特别忐忑不安。\n@c0@"
  tl: "@a@b%a002020：有時照著鏡子，\n　　會擔心自己會不會某天突然消失掉，\n　　心裡特別忐忑不安。\n@c0@"
101:
  en: "@a%0%a002020@bUgh. Is that a blackhead? Last thing I need...\n@c0@"
  ja: "@a@b%a002020「あれ？　こんなところに\n\tニキビが　できてる！？\n@c0@"
  ko: "@a@b%a002020: 어머? 이런 곳에\n여드름이 생기다니!\n@c0@"
  sl: "@a@b%a002020：诶？居然会\n　　在这种地方长出粉刺？！\n@c0@"
  tl: "@a@b%a002020：誒？居然會\n　　在這種地方長出粉刺？！\n@c0@"
102:
  en: "@a%0%a002020@bOh, good — it's just soot. Oh, but there's a blackhead underneath it!\n@c0@"
  ja: "@a@b%a002020「あとが　のこったら\n\tイヤだから　はやめに\n\tおていれ　しなきゃ。\n@c0@"
  ko: "@a@b%a002020: 자국이 남는 건\n싫으니까 어서\n손을 써 둬야지.\n@c0@"
  sl: "@a@b%a002020：要是留下痕迹就糟了，\n　　必须得尽早护理。\n@c0@"
  tl: "@a@b%a002020：要是留下痕跡就糟了，\n　　必須得儘早護理。\n@c0@"
103:
  en: "@a%0%a002020@bYou know, maybe it's about time I start wearing some make-up, too.\n@c0@"
  ja: "@a@b%a002020「あたしも　そろそろ\n\tお化粧とか　してみようかな。\n@c0@"
  ko: "@a@b%a002020: 나도 이제\n화장을 시작해 볼까?\n@c0@"
  sl: "@a@b%a002020：我也差不多\n　　该试着学化妆了。\n@c0@"
  tl: "@a@b%a002020：我也差不多\n　　該試著學化妝了。\n@c0@"
104:
  en: "@a%0%a002020@bI know — I'll ask %a002010 to make me over later!\n@c0@"
  ja: "@a@b%a002020「そうだ！　こんど\n\t%a002010に　教えてもらおうっと。\n@c0@"
  ko: "@a@b%a002020: 그러면 되겠다! 담번에\n%a002010한테 가르쳐 달라고 해야지.\n@c0@"
  sl: "@a@b%a002020：对了！下次就让\n　　%a002010来教我化妆吧。\n@c0@"
  tl: "@a@b%a002020：對了！下次就讓\n　　%a002010來教我化妝吧。\n@c0@"
105:
  en: "@a@bHe nonchalantly fixes his hair.\n@c0@"
  ja: "@a@b%a002040は　さりげなく\nまえがみを　かきあげた。\n@c0@"
  ko: "@a@b%a002040%F2040%X는%Y은%Z 자연스럽게\n앞머리를 쓸어올렸다.\n@c0@"
  sl: "@a@b%a002040若无其事地\n把刘海梳了上去。\n@c0@"
  tl: "@a@b%a002040若無其事地\n把劉海梳了上去。\n@c0@"
106:
  en: "@a@bHe flashes a defiant smile at himself.\n@c0@"
  ja: "@a@bそして　%a002040は\n不敵な　笑みを　うかべた。\n@c0@"
  ko: "@a@b그리고 %a002040%F2040%X는%Y은%Z\n대담하게 웃음을 띄웠다.\n@c0@"
  sl: "@a@b然后%a002040露出了\n无畏的微笑。\n@c0@"
  tl: "@a@b然後%a002040露出了\n無畏的微笑。\n@c0@"
107:
  en: "@a%0%a002040@bThey say a true warrior shouldn't be concerned about his personal appearance...\n@c0@"
  ja: "@a@b%a002040「強くなるのに　身なりは\n\t関係ないんだが……\n@c0@"
  ko: "@a@b%a002040: 강해지는 데에 옷차림이\n무슨 상관인가 싶지만......\n@c0@"
  sl: "@a@b%a002040：虽说变强与身形无关……\n@c0@"
  tl: "@a@b%a002040：雖說變強與身形無關……\n@c0@"
108:
  en: "@a%0%a002040@b...but looking good never hurt anyone!\n@c0@"
  ja: "@a@b%a002040「鏡があると　つい\n\t気にしてしまうぜ。\n@c0@"
  ko: "@a@b%a002040: 거울이 있으면 나도 모르게\n신경을 써 버린단 말이지.\n@c0@"
  sl: "@a@b%a002040：但是有了镜子之后，\n　　还是会变得在意。\n@c0@"
  tl: "@a@b%a002040：但是有了鏡子之後，\n　　還是會變得在意。\n@c0@"
109:
  en: "@a%0%a002040@bWhen my sister saw my face again, she told me I hadn't changed a bit.\n@c0@"
  ja: "@a@b%a002040「あのとき　アネキは\n\tオレの顔を見て　やっぱりって\n\t言ってたよな。\n@c0@"
  ko: "@a@b%a002040: 그때 누나는\n내 얼굴을 보고는 하나도 안 변했다고\n말했었지.\n@c0@"
  sl: "@a@b%a002040：那时姐姐看着我的脸，\n　　说了果然什么什么的对吧。\n@c0@"
  tl: "@a@b%a002040：那時姐姐看著我的臉，\n　　說了果然什麼什麼的對吧。\n@c0@"
110:
  en: "@a%0%a002040@bAnd there was me hoping the years of battles and bravado had made me look all rugged and manly...\n@c0@"
  ja: "@a@b%a002040「そんなに　オレの顔って\n\t昔から　変わってないのか？\n@c0@"
  ko: "@a@b%a002040: 내 얼굴이 그렇게\n옛날이랑 똑같이 생겼나?\n@c0@"
  sl: "@a@b%a002040：难道我真的和以前一样，\n　　一点都没有变吗？\n@c0@"
  tl: "@a@b%a002040：難道我真的和以前一樣，\n　　一點都沒有變嗎？\n@c0@"
111:
  en: "@a@bHe notices that his eyebrows are different lengths from each other!\n@c0@"
  ja: "@a@b%a002040は　左右のまゆげの\n長さが　ちがうことに気がついた！\n@c0@"
  ko: "@a@b%a002040%F2040%X는%Y은%Z 좌우 눈썹의 길이가\n다르다는 사실을 깨달았다!\n@c0@"
  sl: "@a@b%a002040发现\n左右的眉毛长度不一样！\n@c0@"
  tl: "@a@b%a002040發現\n左右的眉毛長度不一樣！\n@c0@"
112:
  en: "@a@b%0%a002040 engages in an impromptu round of furious eyebrow-plucking.\n@c0@"
  ja: "@a@b%a002040は　いそいで\nまゆげの手入れを　行った！\n@c0@"
  ko: "@a@b%a002040%F2040%X는%Y은%Z 서둘러\n눈썹 정리를 했다!\n@c0@"
  sl: "@a@b%a002040立刻\n开始了眉毛的护理！\n@c0@"
  tl: "@a@b%a002040立刻\n開始了眉毛的護理！\n@c0@"
113:
  en: "@a@bHe stares intently at his reflection.\n@c0@"
  ja: "@a@b%a002050は　念入りに\n鏡を　見ている。\n@c0@"
  ko: "@a@b%a002050%F2050%X는%Y은%Z 거울을\n유심히 보고 있다.\n@c0@"
  sl: "@a@b%a002050仔细地\n看着镜子。\n@c0@"
  tl: "@a@b%a002050仔細地\n看著鏡子。\n@c0@"
114:
  en: "@a%0%a002050@bYou'd think that transformin' into a monster might have changed me, but I'm still the same old %a002050.\n@c0@"
  ja: "@a@b%a002050「何度も　怪物に\n\tなっていたから　顔が変わってたり\n\tしてないですよね。\n@c0@"
  ko: "@a@b%a002050: 몇 번이나 괴물로\n변했다고 얼굴까지 변한 건\n아니겠죠?\n@c0@"
  sl: "@a@b%a002050：之前多次变成了怪物，\n　　不知道脸型有没有因此发生变化。\n@c0@"
  tl: "@a@b%a002050：之前多次變成了怪物，\n　　不知道臉型有沒有因此發生變化。\n@c0@"
115:
  en: "@a@bHe looks like he's about to transform!\n@c0@"
  ja: "@a@b%a002050は　鏡の前で\n怪物に　変身しようとした！\n@c0@"
  ko: "@a@b%a002050%F2050%X는%Y은%Z 거울 앞에서\n괴물로 변신하려고 했다!\n@c0@"
  sl: "@a@b%a002050站在镜子前面，\n想要变身成怪物！\n@c0@"
  tl: "@a@b%a002050站在鏡子前面，\n想要變身成怪物！\n@c0@"
116:
  en: "@a@b...But he quickly stops, not wanting to be seen by anyone.\n@c0@"
  ja: "@a@b……が　誰かに　見られると\nまずいと思い　やめることにした。\n@c0@"
  ko: "@a@b......하지만 누가 보면\n곤란할 것 같아 그만두기로 했다.\n@c0@"
  sl: "@a@b……不过一想到要是被别人看见\n就不好了，于是放弃了。\n@c0@"
  tl: "@a@b……不過一想到要是被別人看見\n就不好了，於是放棄了。\n@c0@"
117:
  en: "@a%0%a002050@bWhere did I pick up all these nicks and pock marks?\n@c0@"
  ja: "@a@b%a002050「おや？　いつのまに\n\t切りキズなんて\n\t作ったんでしたっけ？\n@c0@"
  ko: "@a@b%a002050: 으음? 언제\n이런 찰과상이\n생긴 거죠?\n@c0@"
  sl: "@a@b%a002050：哎呀？\n　　什么时候弄的\n　　这么一个刀伤？\n@c0@"
  tl: "@a@b%a002050：哎呀？\n　　什麼時候弄的\n　　這麼一個刀傷？\n@c0@"
118:
  en: "@a%0%a002050@bMaybe I got 'em when I was paradin' around Scrimsley in my monstrous form.\n@c0@"
  ja: "@a@b%a002050「うーん……\n\t怪物に　なっていたときの\n\tものでしょうか？\n@c0@"
  ko: "@a@b%a002050: 흠......\n괴물로 변했을 때\n생긴 걸까요?\n@c0@"
  sl: "@a@b%a002050：唔……\n　　是变成怪物时\n　　留下的吧？\n@c0@"
  tl: "@a@b%a002050：唔……\n　　是變成怪物時\n　　留下的吧？\n@c0@"
119:
  en: "@a%0%a002050@bI wonder what would happen if I gawped at Ra's mirror.\n@c0@"
  ja: "@a@b%a002050「そういえば　みなさんが\n\tもっている　ラーの鏡。\n@c0@"
  ko: "@a@b%a002050: 참, 여러분이\n가지고 계신 라의 거울 말인데요.\n@c0@"
  sl: "@a@b%a002050：说起来，我们带着的\n　　那个太阳神镜。\n@c0@"
  tl: "@a@b%a002050：說起來，我們帶著的\n　　那個太陽神鏡。\n@c0@"
120:
  en: "@a%0%a002050@bWould I see my monstrous form glarin' back at me?\n@c0@"
  ja: "@a@b%a002050「それで　私を　うつしたら\n\tそこには　怪物のすがたが……\n@c0@"
  ko: "@a@b%a002050: 그걸로 저를 비추면\n거기엔 괴물의 모습이......\n@c0@"
  sl: "@a@b%a002050：只要用那个照向我，\n　　我就会当场变成怪物什么的……\n@c0@"
  tl: "@a@b%a002050：只要用那個照向我，\n　　我就會當場變成怪物什麼的……\n@c0@"
121:
  en: "@a%0%a002050@bNo, I like to think I'd just see good old %a002050 with his familiar face starin' back.\n@c0@"
  ja: "@a@b%a002050「なんてことは\n\tありませんよね。\n@c0@"
  ko: "@a@b%a002050: 설마 그런 일은\n없겠죠?\n@c0@"
  sl: "@a@b%a002050：应该不会吧。\n@c0@"
  tl: "@a@b%a002050：應該不會吧。\n@c0@"
122:
  en: "@a%0%a002050@bI've never seen my reflection while I'm transformed into a monster. I dread to think what it looks like!\n@c0@"
  ja: "@a@b%a002050「怪物のときの　私って\n\tどんな顔に　なっているのでしょう？\n@c0@"
  ko: "@a@b%a002050: 괴물로 변했을 때의 저는\n어떤 얼굴일까요?\n@c0@"
  sl: "@a@b%a002050：变成怪物时的我，\n　　不知道是什么样子呢？\n@c0@"
  tl: "@a@b%a002050：變成怪物時的我，\n　　不知道是什麼樣子呢？\n@c0@"
123:
  en: "@a@b%A0120%XHe gazes curiously at his%Z%B0120%XShe gazes curiously at her%Z reflection.\n@c0@"
  ja: "@a@b%a000120は　不思議そうな顔で\n鏡に映った自分の姿を　ながめている。\n@c0@"
  ko: "@a@b%a000120%F0120%X는%Y은%Z 이상하다는 표정으로\n거울에 비친 자신의 모습을 바라보고 있다.\n@c0@"
  sl: "@a@b%a000120一脸惊奇地端详着\n镜中映出的自己。\n@c0@"
  tl: "@a@b%a000120一臉驚奇地端詳著\n鏡中映出的自己。\n@c0@"
124:
  en: "@a@b%A0120%XHe%Z%B0120%XShe%Z's sizing up the opposition!\n@c0@"
  ja: "@a@b%a000120は　様子を見ている！\n@c0@"
  ko: "@a@b%a000120%F0120%X는%Y은%Z 분위기를 살피고 있다!\n@c0@"
  sl: "@a@b%a000120正看着自己的模样！\n@c0@"
  tl: "@a@b%a000120正看著自己的模樣！\n@c0@"
125:
  en: "@a@b%A0120%XHe%Z%B0120%XShe%Z spins swiftly around several times.\n@c0@"
  ja: "@a@b%a000120は　鏡の前で\nくるくると　回っている。\n@c0@"
  ko: "@a@b%a000120%F0120%X는%Y은%Z 거울 앞에서\n뱅글뱅글 돌고 있다.\n@c0@"
  sl: "@a@b%a000120在镜子前转圈。\n@c0@"
  tl: "@a@b%a000120在鏡子前轉圈。\n@c0@"
126:
  en: "@a@b%A0120%XHe%Z%B0120%XShe%Z seems to be trying to get a look at %A0120%Xhimself%Z%B0120%Xherself%Z from behind.\n@c0@"
  ja: "@a@bどうやら　自分の後ろ側を\n見ようとしているようだ。\n@c0@"
  ko: "@a@b보아하니 자신의 뒷모습을\n보려는 것 같다.\n@c0@"
  sl: "@a@b看来是想看看自己的后背。\n@c0@"
  tl: "@a@b看來是想看看自己的後背。\n@c0@"
127:
  en: "@a@b%A0120%XHe%Z%B0120%XShe%Z growls ominously at %A0120%Xhis%Z%B0120%Xher%Z reflection!\n@c0@"
  ja: "@a@b%a000120は　鏡に向かって\nうなり声を　あげている！\n@c0@"
  ko: "@a@b%a000120%F0120%X는%Y은%Z 거울을 향해\n낮은 소리를 내고 있다!\n@c0@"
  sl: "@a@b%a000120面对镜子\n发出了低吼！\n@c0@"
  tl: "@a@b%a000120面對鏡子\n發出了低吼！\n@c0@"
128:
  en: "@a@bApparently %A0120%Xhe's%Z%B0120%Xshe's%Z trying to scare off %A0120%Xhis%Z%B0120%Xher%Z new rival.\n@c0@"
  ja: "@a@bどうやら　%a000120は　鏡にうつった\n自分を　ライバルと思い\nいかくしているようだ。\n@c0@"
  ko: "@a@b아무래도 %a000120%F0120%X는%Y은%Z 거울에 비친\n자신을 라이벌로 생각하고\n위협하고 있는 모양이다.\n@c0@"
  sl: "@a@b看来%a000120把镜中的自己\n当成了对手，\n正在威吓对方。\n@c0@"
  tl: "@a@b看來%a000120把鏡中的自己\n當成了對手，\n正在威嚇對方。\n@c0@"
129:
  en: "@a@b%A0120%XHe%Z%B0120%XShe%Z starts chirping away excitedly at %A0120%Xhis%Z%B0120%Xher%Z reflection!\n@c0@"
  ja: "@a@b%a000120は　鏡に向かって\nしきりに　ほえている！\n@c0@"
  ko: "@a@b%a000120%F0120%X는%Y은%Z 거울을 향해\n자꾸만 말을 걸고 있다.\n@c0@"
  sl: "@a@b%a000120面对镜子\n不断吼叫！\n@c0@"
  tl: "@a@b%a000120面對鏡子\n不斷吼叫！\n@c0@"
130:
  en: "@a@bApparently %A0120%Xhe's%Z%B0120%Xshe's%Z trying to have a conversation with %A0120%Xhimself%Z%B0120%Xherself%Z.\n@c0@"
  ja: "@a@bどうやら　%a000120は　鏡にうつった\n自分と　会話をしているつもりのようだ。\n@c0@"
  ko: "@a@b아무래도 %a000120%F0120%X는%Y은%Z 거울에 비친\n자신과 대화를 하려는 것 같다.\n@c0@"
  sl: "@a@b%a000120似乎是\n想要和镜子里的自己对话。\n@c0@"
  tl: "@a@b%a000120似乎是\n想要和鏡子里的自己對話。\n@c0@"
131:
  en: "@a@bBut there's no reflection to be seen!\n@c0@"
  ja: "@a@bしかし　そこには\nだれも　うつっていなかった……。\n@c0@"
  ko: "@a@b그러나 거기에는 아무도\n비치지 않았다......\n@c0@"
  sl: "@a@b但是那里\n谁也没有映出来……\n@c0@"
  tl: "@a@b但是那裡\n誰也沒有映出來……\n@c0@"
132:
  en: "@a@bThe door is firmly locked.\n@c0@"
  ja: "@a@bトビラには　カギが　かかっている！\n@c0@"
  ko: "@a@b문은 잠겨 있다!\n@c0@"
  sl: "@a@b门上着锁！\n@c0@"
  tl: "@a@b門上著鎖！\n@c0@"
133:
  en: "@a@bThe door is locked, and it doesn't look like any of the keys in %H0860%X%a000120%Ythe party%Z's possession will open it.\n@c0@"
  ja: "@a@bトビラには　カギがかかっている！\nもっている　カギでは　開きそうにない。\n@c0@"
  ko: "@a@b문은 잠겨 있다!\n가지고 있는 열쇠로는 열리지 않을 것 같다.\n@c0@"
  sl: "@a@b门上着锁。\n现有的钥匙似乎无法打开它。\n@c0@"
  tl: "@a@b門上著鎖。\n現有的鑰匙似乎無法打開它。\n@c0@"
134:
