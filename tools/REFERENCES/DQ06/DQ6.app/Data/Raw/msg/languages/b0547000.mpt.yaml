  tl: "@a@b%a002050：我想起了\n　　留在蒙斯托爾的我那條狗，\n　　不知道過得好不好。\n@c0@"
52:
  en: "@a%0%a002000@bI wish I could help, but wells are a pretty deep subject.\n@c0@"
  ja: "@a@b%a002000「手伝って　やりたいが\n\tオレ　井戸ほりは\n\tくわしくないからなあ。\n@c0@"
  ko: "@a@b%a002000: 도와주고 싶지만\n우물 파는 건\n지식이 없어서 말이지.\n@c0@"
