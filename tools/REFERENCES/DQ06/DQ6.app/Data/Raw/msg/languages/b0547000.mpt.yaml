  sl: "@a@b%a002020：镇上唯一的一口井\n　　变成了这样？\n　　出不了水啊……\n@c0@"
  tl: "@a@b%a002020：鎮上唯一的一口井\n　　變成了這樣？\n　　出不了水啊……\n@c0@"
