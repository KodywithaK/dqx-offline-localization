0:
  en: "@a%0%a002000@bAhh-CHOO!!! Eh, sorry. I must have breathed in some sand.\n@c0@"
  ja: "@a@b%a002000「ふあっくしょん！！\n\tいきなり　ハナの中に\n\t砂が　入っちまったぜ。\n@c0@"
  ko: "@a@b%a002000: 흐에에엣취!!\n갑자기 콧속에\n모래가 들어가 버렸군.\n@c0@"
  sl: "@a@b%a002000：阿嚏！！\n　　沙子突然就飞进鼻子里了。\n@c0@"
  tl: "@a@b%a002000：阿嚏！！\n　　沙子突然就飛進鼻子裡了。\n@c0@"
1:
  en: "@a%0%a002010@bI wonder what this place is called? Everything is covered in sand.\n@c0@"
  ja: "@a@b%a002010「ここは　なんという\n\t町かしら。\n\tいちめん　砂だらけね。\n@c0@"
  ko: "@a@b%a002010: 여긴 무슨\n마을일까?\n온통 모래밖에 안 보이는걸.\n@c0@"
  sl: "@a@b%a002010：不知道\n　　这个镇子叫什么名字。\n　　到处都是沙子。\n@c0@"
  tl: "@a@b%a002010：不知道\n　　這個鎮子叫什麼名字。\n　　到處都是沙子。\n@c0@"
2:
  en: "@a%0%a002020@bNot exactly the most...lively of places, is it?\n@c0@"
  ja: "@a@b%a002020「ばかに\n\tさっぱりした　町だねー。\n@c0@"
  ko: "@a@b%a002020: 엄청나게\n휑한 마을이네.\n@c0@"
  sl: "@a@b%a002020：这镇子真是\n　　荒凉得吓人。\n@c0@"
  tl: "@a@b%a002020：這鎮子真是\n　　荒涼得嚇人。\n@c0@"
3:
  en: "@a%0%a002030@bThe air's so dry here, it hurts to breathe it in.\n@c0@"
  ja: "@a@b%a002030「かわききった　空気の\n\tにおいが　します。\n@c0@"
  ko: "@a@b%a002030: 말라붙은 공기\n냄새가 납니다.\n@c0@"
  sl: "@a@b%a002030：空气真是干燥啊。\n@c0@"
  tl: "@a@b%a002030：空氣真是乾燥啊。\n@c0@"
4:
  en: "@a%0%a002050@bWhy would anyone choose to live here?\n@c0@"
  ja: "@a@b%a002050「こんな　砂ばくの中にも\n\t人が　住んでいるんですね。\n@c0@"
  ko: "@a@b%a002050: 이런 사막에서도\n사람이 살고 있군요.\n@c0@"
  sl: "@a@b%a002050：有人住在这种沙漠里呢。\n@c0@"
  tl: "@a@b%a002050：有人住在這種沙漠裡呢。\n@c0@"
5:
  en: "@a%0%a002000@bIt's like this town's had the life sucked out of it.\n@c0@"
  ja: "@a@b%a002000「しかし　活気のない\n\t町だよな。\n@c0@"
  ko: "@a@b%a002000: 그나저나 활기가 없는\n마을이군.\n@c0@"
  sl: "@a@b%a002000：说来这镇子\n　　真是死气沉沉的。\n@c0@"
  tl: "@a@b%a002000：說來這鎮子\n　　真是死氣沉沉的。\n@c0@"
6:
  en: "@a%0%a002010@bI don't envy the people who have to live here.\n@c0@"
  ja: "@a@b%a002010「この町での　暮らしは\n\tなにかと　大変でしょうね。\n@c0@"
  ko: "@a@b%a002010: 이 마을은\n이래저래 살기 불편하겠어.\n@c0@"
  sl: "@a@b%a002010：在这个镇子里生活，\n　　一定很不容易吧。\n@c0@"
  tl: "@a@b%a002010：在這個鎮子裡生活，\n　　一定很不容易吧。\n@c0@"
7:
  en: "@a%0%a002020@bI can't stand all this sand! It gets everywhere!\n@c0@"
  ja: "@a@b%a002020「ほんとに　砂だらけで\n\t肌あれ　しそう……。\n@c0@"
  ko: "@a@b%a002020: 온통 모래뿐이라\n피부가 거칠어질 것 같아......\n@c0@"
  sl: "@a@b%a002020：真的到处都是沙子，\n　　皮肤都变差了……\n@c0@"
  tl: "@a@b%a002020：真的到處都是沙子，\n　　皮膚都變差了……\n@c0@"
8:
  en: "@a%0%a002030@bIt seems this place is suffering from a crippling drought. People and plants alike are wilting...\n@c0@"
  ja: "@a@b%a002030「ひでりが　続いて\n\tいるようですね。　ただでさえ\n\tとぼしい緑が　くすんでる……。\n@c0@"
  ko: "@a@b%a002030: 가뭄이 계속되고\n있는 모양입니다. 안 그래도\n몇 없는 풀들에 생기가 없군요.\n@c0@"
  sl: "@a@b%a002030：一直受到太阳直射呢。\n　　这一点零星的植物　　\n　　都要被晒干了……\n@c0@"
  tl: "@a@b%a002030：一直受到太陽直射呢。\n　　這一點零星的植物　　\n　　都要被曬乾了……\n@c0@"
9:
  en: "@a%0%a002050@bBlast! My shoes are all full of sand!\n@c0@"
  ja: "@a@b%a002050「いやー　もう\n\tクツの中　砂だらけです。\n@c0@"
  ko: "@a@b%a002050: 이런~ 신발 속이\n모래로 가득 찼습니다.\n@c0@"
  sl: "@a@b%a002050：哎呀，\n　　连鞋里都尽是沙子。\n@c0@"
  tl: "@a@b%a002050：哎呀，\n　　連鞋裡都盡是沙子。\n@c0@"
10:
  en: "@a%0%a002000@bShe ain't lying, aye?\n@c0@"
  ja: "@a@b%a002000「本当に\n\tなんにも　ない感じだぜ。\n@c0@"
  ko: "@a@b%a002000: 정말\n아무것도 없어 보이는군.\n@c0@"
  sl: "@a@b%a002000：这里真是什么都没有啊。\n@c0@"
  tl: "@a@b%a002000：這裡真是什麼都沒有啊。\n@c0@"
11:
  en: "@a%0%a002010@bHow sad. I'm not sensing much in the way of hopes and dreams here...\n@c0@"
  ja: "@a@b%a002010「物だけじゃなくて\n\t夢や　希望も　感じられないわね。\n@c0@"
  ko: "@a@b%a002010: 눈에 보이는 것뿐 아니라\n꿈과 희망도 느껴지지 않아.\n@c0@"
  sl: "@a@b%a002010：不仅没有生物，\n　　连梦想和希望都感觉不到呢。\n@c0@"
  tl: "@a@b%a002010：不僅沒有生物，\n　　連夢想和希望都感覺不到呢。\n@c0@"
12:
  en: "@a%0%a002020@bThey'll never attract travellers with that attitude. Anything's better than nothing!\n@c0@"
  ja: "@a@b%a002020「何にも　ないのが\n\tこの町の　じまん　なのかしら。\n@c0@"
  ko: "@a@b%a002020: 아무것도 없는 게\n이 마을의 자랑인가?\n@c0@"
  sl: "@a@b%a002020：这个镇子\n　　难道以什么都没有为荣吗？\n@c0@"
  tl: "@a@b%a002020：這個鎮子\n　　難道以什麼都沒有為榮嗎？\n@c0@"
13:
  en: "@a%0%a002030@bThat poor woman's face betrays a deep weariness with life.\n@c0@"
  ja: "@a@b%a002030「この女性……\n\t生活に　つかれたような\n\t顔を　されてますね。\n@c0@"
  ko: "@a@b%a002030: 이 여성......\n생활에 지친 듯한\n표정이군요.\n@c0@"
  sl: "@a@b%a002030：这位女士……\n　　看上去好像被生活\n　　折磨得疲惫不堪呢……\n@c0@"
  tl: "@a@b%a002030：這位女士……\n　　看上去好像被生活\n　　折磨得疲憊不堪呢……\n@c0@"
14:
  en: "@a%0%a002050@bWell, they've got no shortage of sand!\n@c0@"
  ja: "@a@b%a002050「砂だけは\n\tたくさん　ありますね！\n@c0@"
  ko: "@a@b%a002050: 모래만큼은\n많이 있네요!\n@c0@"
  sl: "@a@b%a002050：这里最不缺的\n　　也就是沙子了！\n@c0@"
  tl: "@a@b%a002050：這裡最不缺的\n　　也就是沙子了！\n@c0@"
15:
  en: "@a%0%a002000@bI don't see how the well runnin' dry was Murdaw's doing...\n@c0@"
  ja: "@a@b%a002000「この井戸が　枯れてるのは\n\t魔王の　せいというより……\n@c0@"
  ko: "@a@b%a002000: 이 우물이 말라 있는 건\n마왕 탓이라기보다는......\n@c0@"
  sl: "@a@b%a002000：这口井枯成这样，\n　　与其说是魔王干的……\n@c0@"
  tl: "@a@b%a002000：這口井枯成這樣，\n　　與其說是魔王幹的……\n@c0@"
16:
  en: "@a%0%a002000@bIt probably has more to do with this bein' a desert 'n' everything like that.\n@c0@"
  ja: "@a@b%a002000「きびしい　かんきょうの\n\tせいなんだろうな。\n@c0@"
  ko: "@a@b%a002000: 혹독한 환경\n때문이겠지.\n@c0@"
  sl: "@a@b%a002000：还不如说是因为\n　　这里这么恶劣的环境造成的呢。\n@c0@"
  tl: "@a@b%a002000：還不如說是因為\n　　這裡這麼惡劣的環境造成的呢。\n@c0@"
17:
  en: "@a%0%a002010@bA dry well is an even bigger problem than a Dread Fiend for these people.\n@c0@"
  ja: "@a@b%a002010「この町では\n\t魔王のことより　井戸のほうが\n\t大もんだいなのね。\n@c0@"
  ko: "@a@b%a002010: 이 마을에서는\n마왕보다도 우물이\n훨씬 큰 문제겠어.\n@c0@"
  sl: "@a@b%a002010：这个镇子\n　　面临的问题不是魔王，\n　　而是这口井吧。\n@c0@"
  tl: "@a@b%a002010：這個鎮子\n　　面臨的問題不是魔王，\n　　而是這口井吧。\n@c0@"
18:
  en: "@a%0%a002020@bSomething tells me this town has seen better days — far better days!\n@c0@"
  ja: "@a@b%a002020「きっと　以前は\n\t今より　うるおいのある\n\t町だったのね。\n@c0@"
  ko: "@a@b%a002020: 분명 예전엔\n지금보다 충분히 물을 얻을 수 있는\n마을이었을 거야.\n@c0@"
  sl: "@a@b%a002020：这里以前\n　　一定比现在\n　　更加富饶丰润吧。\n@c0@"
  tl: "@a@b%a002020：這裡以前\n　　一定比現在\n　　更加富饒豐潤吧。\n@c0@"
19:
  en: "@a%0%a002030@bSo when the well dried up, the life was sucked out of this sorry place...\n@c0@"
  ja: "@a@b%a002030「ふむ。　この町は\n\t井戸が　枯れたから　こんなふうに\n\tなってしまったのですね。\n@c0@"
  ko: "@a@b%a002030: 흠. 이 마을은\n우물이 말라붙었기 때문에 이렇게\n변해 버린 거군요.\n@c0@"
  sl: "@a@b%a002030：唔。\n　　这个镇子因为井水干涸，\n　　变成了这个样子啊。\n@c0@"
  tl: "@a@b%a002030：唔。\n　　這個鎮子因為井水乾涸，\n　　變成了這個樣子啊。\n@c0@"
20:
  en: "@a%0%a002050@bThere's no water here!? How am I goin' to wash the sand out of my hair?\n@c0@"
  ja: "@a@b%a002050「うひゃあっ\n\tこの　町には　水すら\n\tろくに　ないのですか！？\n@c0@"
  ko: "@a@b%a002050: 세상에,\n이 마을에는 물조차\n변변히 없는 겁니까!?\n@c0@"
  sl: "@a@b%a002050：哎呀，\n　　这个镇子\n　　连水都缺啊？！\n@c0@"
  tl: "@a@b%a002050：哎呀，\n　　這個鎮子\n　　連水都缺啊？！\n@c0@"
21:
  en: "@a%0%a002000@bWhen times are bad, I reckon ya can always escape to the bottom of a cup.\n@c0@"
  ja: "@a@b%a002000「酔ってる　わりには\n\tすなおだな……。\n@c0@"
  ko: "@a@b%a002000: 취한 사람 치고는\n고분고분하군......\n@c0@"
  sl: "@a@b%a002000：虽然醉成这样，\n　　人倒是挺实诚……\n@c0@"
  tl: "@a@b%a002000：雖然醉成這樣，\n　　人倒是挺實誠……\n@c0@"
22:
  en: "@a%0%a002010@bI'm amazed that he could understand a word you said, %a000090.\n@c0@"
  ja: "@a@b%a002010「まだ　人の言うことは\n\tわかるみたいね。\n@c0@"
  ko: "@a@b%a002010: 남이 하는 말은\n알아듣는 모양이야.\n@c0@"
  sl: "@a@b%a002010：好像还听得懂\n　　别人在说什么呢。\n@c0@"
  tl: "@a@b%a002010：好像還聽得懂\n　　別人在說什麼呢。\n@c0@"
23:
  en: "@a%0%a002020@bMen sure are weak sometimes.\n@c0@"
  ja: "@a@b%a002020「ホント　男って\n\t弱いわね……。\n@c0@"
  ko: "@a@b%a002020: 정말 남자란\n약하다니까......\n@c0@"
  sl: "@a@b%a002020：男人真是太不像样了呢……\n@c0@"
  tl: "@a@b%a002020：男人真是太不像樣了呢……\n@c0@"
24:
  en: "@a%0%a002030@bThe Goddess frowns on public displays of drunkenness.\n@c0@"
  ja: "@a@b%a002030「この　酔いっぷりは\n\tかなりのものですね。\n@c0@"
  ko: "@a@b%a002030: 보아하니 제법\n많이 취했는걸요.\n@c0@"
  sl: "@a@b%a002030：居然醉成了这样。\n@c0@"
  tl: "@a@b%a002030：居然醉成了這樣。\n@c0@"
25:
  en: "@a%0%a002050@bOld %a002050 isn't one to talk, but that lad really can't hold his drink!\n@c0@"
  ja: "@a@b%a002050「飲んでも　酔うな！\n\t酔うなら　飲むな！　です。\n@c0@"
  ko: "@a@b%a002050: 마셔도 취하지 마라!\n취할 거면 마시지 마라! 명심하세요.\n@c0@"
  sl: "@a@b%a002050：要喝就别醉！\n　　要醉就别喝！就是这么回事。\n@c0@"
  tl: "@a@b%a002050：要喝就別醉！\n　　要醉就別喝！就是這麼回事。\n@c0@"
26:
  en: "@a%0%a002000@bThe Isle o' Smiles, aye? That name sounds a mite fishy to me...\n@c0@"
  ja: "@a@b%a002000「しあわせの国か。\n\tいかにも　あやしげな\n\tひびきのする　名前だぜ。\n@c0@"
  ko: "@a@b%a002000: 행복의 나라라.\n아무리 생각해도 수상한\n느낌이 드는 이름인걸.\n@c0@"
  sl: "@a@b%a002000：幸福国啊。\n　　这名字听起来\n　　就很可疑。\n@c0@"
  tl: "@a@b%a002000：幸福國啊。\n　　這名字聽起來\n　　就很可疑。\n@c0@"
27:
  en: "@a%0%a002010@bIs that island so attractive it can make a woman leave her husband...?\n@c0@"
  ja: "@a@b%a002010「だんなさんを　おいてまで\n\t行きたいと　思う　みりょくが\n\tその国には　あるということかしら。\n@c0@"
  ko: "@a@b%a002010: 남편까지 두고\n가고 싶다는 생각이 들 정도로\n그 나라에는 매력이 넘치는 걸까?\n@c0@"
  sl: "@a@b%a002010：竟然抛下丈夫不管\n　　就这么走了，\n　　那个国度真有这样的魅力么？\n@c0@"
  tl: "@a@b%a002010：竟然拋下丈夫不管\n　　就這麼走了，\n　　那個國度真有這樣的魅力麼？\n@c0@"
28:
  en: "@a%0%a002020@bShe ran away from that winner? I can't imagine why...\n@c0@"
  ja: "@a@b%a002020「それって　ただ\n\t奥さんに　逃げられたんじゃ……？\n@c0@"
  ko: "@a@b%a002020: 그냥 부인이 짐 싸서\n도망간 거 아닌가......?\n@c0@"
  sl: "@a@b%a002020：这难道\n　　不就是老婆跑了么……\n@c0@"
  tl: "@a@b%a002020：這難道\n　　不就是老婆跑了麼……\n@c0@"
29:
  en: "@a%0%a002030@bIntriguing. I would like to find out more about this Isle o' Smiles. We should ask around.\n@c0@"
  ja: "@a@b%a002030「しあわせの国のこと……\n\tもうちょっと　ほかの人にも\n\tきいて　みましょうか。\n@c0@"
  ko: "@a@b%a002030: 행복의 나라에 대해......\n다른 사람들한테도 좀 더\n물어보는 게 좋겠습니다.\n@c0@"
  sl: "@a@b%a002030：关于幸福国的事……\n　　再去找别人\n　　打听打听吧。\n@c0@"
  tl: "@a@b%a002030：關於幸福國的事……\n　　再去找別人\n　　打聽打聽吧。\n@c0@"
30:
  en: "@a%0%a002050@bSo his missus ran off to the Isle o' Smiles? That would explain the lad's permanent frown.\n@c0@"
  ja: "@a@b%a002050「すると　奥さんが\n\tしあわせの国に　行ったために\n\tだんなさんが　ふしあわせに！？\n@c0@"
  ko: "@a@b%a002050: 그럼 부인이\n행복의 나라에 가는 바람에\n남편이 불행해진 건가요!?\n@c0@"
  sl: "@a@b%a002050：所以说，\n　　因为妻子去了幸福国，\n　　丈夫变得不幸了？！\n@c0@"
  tl: "@a@b%a002050：所以說，\n　　因為妻子去了幸福國，\n　　丈夫變得不幸了？！\n@c0@"
31:
  en: "@a%0%a002050@bCan you really be happy if you're makin' the people around you miserable?\n@c0@"
  ja: "@a@b%a002050「まわりの　人を\n\tふしあわせに　してしまう\n\tしあわせの国って　いったい……。\n@c0@"
  ko: "@a@b%a002050: 주변 사람을\n불행하게 만드는\n행복의 나라라니......\n@c0@"
  sl: "@a@b%a002050：让身边的人\n　　遭遇不幸的幸福国，\n　　到底是……\n@c0@"
  tl: "@a@b%a002050：讓身邊的人\n　　遭遇不幸的幸福國，\n　　到底是……\n@c0@"
32:
  en: "@a%0%a002000@bA little island? When did ya see that, %a000090?\n@c0@"
  ja: "@a@b%a002000「小さな島？\n\tおいおい　%a000090\n\tホントに　見たのか？\n@c0@"
  ko: "@a@b%a002000: 작은 섬?\n어이, %a000090.\n정말 본 거냐?\n@c0@"
  sl: "@a@b%a002000：小岛？\n　　喂，%a000090，\n　　你真的看到了吗？\n@c0@"
  tl: "@a@b%a002000：小島？\n　　喂，%a000090，\n　　你真的看到了嗎？\n@c0@"
33:
  en: "@a%0%a002010@bLittle island? I didn't notice anything like that...\n@c0@"
  ja: "@a@b%a002010「小さな島……？\n\t私は　とくに\n\t気がつかなかったけど。\n@c0@"
  ko: "@a@b%a002010: 작은 섬......?\n난 딱히\n본 기억이 없는데.\n@c0@"
  sl: "@a@b%a002010：小岛？\n　　我倒是没注意到。\n@c0@"
  tl: "@a@b%a002010：小島？\n　　我倒是沒注意到。\n@c0@"
34:
  en: "@a%0%a002020@bYou shouldn't pick on gullible people like that, %a000090. He believed you!\n@c0@"
  ja: "@a@b%a002020「オトナを　からかっちゃ\n\tだめでしょ　%a000090。\n\tあの人　本気に　しちゃったよ。\n@c0@"
