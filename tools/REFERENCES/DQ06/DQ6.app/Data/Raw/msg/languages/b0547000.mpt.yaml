  sl: "@a@b%a002050：假设真的能乘坐那座岛的话，\n　　会被带到哪去呢？\n@c0@"
  tl: "@a@b%a002050：假設真的能乘坐那座島的話，\n　　會被帶到哪去呢？\n@c0@"
