  sl: "@a@b%a002030：哎呀哎呀……\n　　不过，岛会来这事，\n　　实在是捉摸不透。\n@c0@"
  tl: "@a@b%a002030：哎呀哎呀……\n　　不過，島會來這事，\n　　實在是捉摸不透。\n@c0@"
