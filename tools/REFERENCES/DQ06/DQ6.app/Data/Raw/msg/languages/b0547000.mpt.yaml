  sl: "@a@b%a002020：这小狗，\n　　眼神看起来\n　　是不是很伤心？\n@c0@"
  tl: "@a@b%a002020：這小狗，\n　　眼神看起來\n　　是不是很傷心？\n@c0@"
50:
