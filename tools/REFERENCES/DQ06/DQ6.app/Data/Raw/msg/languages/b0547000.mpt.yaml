  sl: "@a@b%a002000：这镇子里\n　　没啥像样的食物呢。\n　　连狗都这么瘦。\n@c0@"
  tl: "@a@b%a002000：這鎮子裡\n　　沒啥像樣的食物呢。\n　　連狗都這麼瘦。\n@c0@"
48:
  en: "@a%0%a002010@bI'm worried about that poor dog. His aura isn't very bright...\n@c0@"
  ja: "@a@b%a002010「ワンちゃん\n\t元気が　ないわね。\n\t心配だわ。\n@c0@"
