  sl: "@a@b%a002020：不要欺骗成年人哦，\n　　%a000090。\n　　那个人当真了呢。\n@c0@"
  tl: "@a@b%a002020：不要欺騙成年人哦，\n　　%a000090。\n　　那個人當真了呢。\n@c0@"
35:
  en: "@a%0%a002030@bNo sooner had that man heard your words than he raced off.\n@c0@"
  ja: "@a@b%a002030「あの人　あわてて\n\t行っちゃいましたね……。\n@c0@"
