  sl: "@a@b%a002050：好好确认一下\n　　再回答比较好吧！\n@c0@"
  tl: "@a@b%a002050：好好確認一下\n　　再回答比較好吧！\n@c0@"
37:
  en: "@a%0%a002000@bI don't get that fella. He hasn't missed what yet?\n@c0@"
  ja: "@a@b%a002000「島に　乗りおくれるって\n\tどういうことだ？\n\tよく　わからないよなあ……。\n@c0@"
