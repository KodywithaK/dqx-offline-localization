  sl: "@a@b%a002050：这个人说的话\n　　完全不知所云。\n@c0@"
  tl: "@a@b%a002050：這個人說的話\n　　完全不知所云。\n@c0@"
42:
  en: "@a%0%a002000@bWhat an odd fella. Either an island's there or it ain't.\n@c0@"
