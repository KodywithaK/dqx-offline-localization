  ja: "@a@b%a002000「ふーん。\n\tこの子は　浮かぶ島ってのを\n\t見たことが　あるようだな。\n@c0@"
  ko: "@a@b%a002000: 흐음.\n이 아이는 부유하는 섬을\n본 적이 있는 모양이군.\n@c0@"
  sl: "@a@b%a002000：唔。\n　　这孩子好像\n　　见到过那个浮岛啊。\n@c0@"
  tl: "@a@b%a002000：唔。\n　　這孩子好像\n　　見到過那個浮島啊。\n@c0@"
95:
  en: "@a%0%a002010@bSo the island only appears when the moon is full...\n@c0@"
  ja: "@a@b%a002010「満月の　夜にしか\n\t島は　見れないのかしら……。\n@c0@"
  ko: "@a@b%a002010: 보름달이 뜨는 밤에만\n섬을 볼 수 있는 걸까......\n@c0@"
  sl: "@a@b%a002010：只有在月圆的晚上，\n　　才能见到那个岛啊……\n@c0@"
  tl: "@a@b%a002010：只有在月圓的晚上，\n　　才能見到那個島啊……\n@c0@"
96:
  en: "@a%0%a002020@bAn island? On the full moon? When you put it that way, it sounds kind of romantic!\n@c0@"
  ja: "@a@b%a002020「満月で　島が　プカプカ。\n\tその話だけ聞くぶんには\n\tステキな景色だけど……。\n@c0@"
  ko: "@a@b%a002020: 보름달이 뜨면 섬이 둥실둥실.\n이야기만 들었을 때는\n아름다운 광경일 것 같은데......\n@c0@"
  sl: "@a@b%a002020：月亮圆，海水升……\n　　听上去倒是觉得\n　　那样的景色真不错……\n@c0@"
  tl: "@a@b%a002020：月亮圓，海水升……\n　　聽上去倒是覺得\n　　那樣的景色真不錯……\n@c0@"
97:
  en: "@a%0%a002030@bThat boy seems to be getting a bit carried away. Can we really trust his words?\n@c0@"
  ja: "@a@b%a002030「この子　かなり\n\tこうふん気味に　話しますね。\n\t本当のこと　なのでしょう。\n@c0@"
  ko: "@a@b%a002030: 이 아이, 상당히\n흥분된 어조로 말하는군요.\n진짜가 맞을 겁니다.\n@c0@"
  sl: "@a@b%a002030：这孩子\n　　说这话的时候一脸兴奋呢。\n　　他说的应该是真的吧。\n@c0@"
  tl: "@a@b%a002030：這孩子\n　　說這話的時候一臉興奮呢。\n　　他說的應該是真的吧。\n@c0@"
98:
  en: "@a%0%a002050@bIs that lad talkin' nonsense? He sounds like he means it...\n@c0@"
  ja: "@a@b%a002050「じょうねつは　伝わりますが\n\t何を　言いたいのかが\n\tいまひとつ　伝わりませんね。\n@c0@"
  ko: "@a@b%a002050: 흥분해서 말하는 건 알겠는데\n무슨 말을 하고 싶은 건지\n하나도 와닿질 않네요.\n@c0@"
  sl: "@a@b%a002050：虽然能感受到这个孩子的热情，\n　　但是他到底想说什么，\n　　现在还不太清楚。\n@c0@"
  tl: "@a@b%a002050：雖然能感受到這個孩子的熱情，\n　　但是他到底想說什麼，\n　　現在還不太清楚。\n@c0@"
99:
  en: "@a%0%a002000@bAn island free of toil or tears? I'd die of boredom in a place like that.\n@c0@"
  ja: "@a@b%a002000「苦労も　なやみもない\n\t国なんて……きっと　ぜんぜん\n\tつまんないぜ。\n@c0@"
  ko: "@a@b%a002000: 고통도 걱정도 없는\n나라라...... 아마 하나도\n재미없을걸.\n@c0@"
  sl: "@a@b%a002000：没有烦恼\n　　没有忧愁的国度……\n　　绝对无聊透顶吧。\n@c0@"
  tl: "@a@b%a002000：沒有煩惱\n　　沒有憂愁的國度……\n　　絕對無聊透頂吧。\n@c0@"
100:
  en: "@a%0%a002010@bThat nun managed to sum the situation up nicely, didn't she, %a000090?\n@c0@"
  ja: "@a@b%a002010「シスターのお話で\n\tだいぶ　くわしいことが\n\tわかってきたわね。\n@c0@"
  ko: "@a@b%a002010: 수녀님 이야기를 들으니까\n무슨 사정인지\n자세히 알 것 같아.\n@c0@"
  sl: "@a@b%a002010：听了修女的话，\n　　大体能知道\n　　具体情况了。\n@c0@"
  tl: "@a@b%a002010：聽了修女的話，\n　　大體能知道\n　　具體情況了。\n@c0@"
101:
  en: "@a%0%a002010@bBut the only way to find out exactly what happens around here at night will be to see it with our own eyes...\n@c0@"
  ja: "@a@b%a002010「この町や　近くの海で\n\t今夜　なにが　起こるか……\n\tぜひ　見とどけましょう。\n@c0@"
  ko: "@a@b%a002010: 이 마을과 근처 바다에서\n오늘 밤 무슨 일이 일어나는지......\n꼭 봐 두자구.\n@c0@"
  sl: "@a@b%a002010：今晚这个镇子\n　　和附近的海上会发生什么事情……\n　　就让我们拭目以待吧。\n@c0@"
  tl: "@a@b%a002010：今晚這個鎮子\n　　和附近的海上會發生什麼事情……\n　　就讓我們拭目以待吧。\n@c0@"
102:
  en: "@a%0%a002020@bRight. Let's go find a way to kill some time until nightfall.\n@c0@"
  ja: "@a@b%a002020「夜まで　どうやって\n\t時間つぶそうかー。\n@c0@"
  ko: "@a@b%a002020: 밤까지 뭐 하면서\n시간을 보낸담.\n@c0@"
  sl: "@a@b%a002020：天黑之前这段时间，\n　　要怎么消磨才好呢？\n@c0@"
  tl: "@a@b%a002020：天黑之前這段時間，\n　　要怎麼消磨才好呢？\n@c0@"
103:
  en: "@a%0%a002030@bI sense that we have a long night ahead of us...\n@c0@"
  ja: "@a@b%a002030「……今夜は\n\t眠ってる　時間は　ないかも\n\tしれませんね。\n@c0@"
  ko: "@a@b%a002030: ......오늘 밤은\n잠잘 시간이 없을지도\n모르겠군요.\n@c0@"
  sl: "@a@b%a002030：……今晚可能\n　　没时间睡觉了吧。\n@c0@"
  tl: "@a@b%a002030：……今晚可能\n　　沒時間睡覺了吧。\n@c0@"
104:
  en: "@a%0%a002050@bDon't worry! It may be a full moon but old %a002050 won't be up to his old monster-transformin' tricks!\n@c0@"
  ja: "@a@b%a002050「私は　満月だからといって\n\tもう　まものに　なったりしませんから\n\tご心配なく！\n@c0@"
  ko: "@a@b%a002050: 저는 보름달이 뜬다고\n또 마물이 되고 그러진 않을 테니\n걱정 마세요!\n@c0@"
  sl: "@a@b%a002050：虽然是满月，\n　　但是我已经不会再\n　　变成魔物了，不用担心！\n@c0@"
  tl: "@a@b%a002050：雖然是滿月，\n　　但是我已經不會再\n　　變成魔物了，不用擔心！\n@c0@"
105:
  en: "@a%0%a002000@bSeems like half the people in Aridea came here just to get to the island.\n@c0@"
  ja: "@a@b%a002000「この町には　そういう目的で\n\tやってくる　人たちが\n\tかなり　いるようだな。\n@c0@"
  ko: "@a@b%a002000: 이 마을에는 그런 목적으로\n찾아오는 사람들이\n상당히 많은가 보군.\n@c0@"
  sl: "@a@b%a002000：有不少人抱着\n　　那样的目的\n　　跑到这镇子来呢。\n@c0@"
  tl: "@a@b%a002000：有不少人抱著\n　　那樣的目的\n　　跑到這鎮子來呢。\n@c0@"
106:
  en: "@a%0%a002010@bI've never seen such a dedicated hedonist.\n@c0@"
  ja: "@a@b%a002010「いっしょうけんめい\n\t遊んで　暮らすのね……。\n@c0@"
  ko: "@a@b%a002010: 힘 닿는 데까지\n놀면서 살겠다고......\n@c0@"
  sl: "@a@b%a002010：想要痛快地玩啊……\n@c0@"
  tl: "@a@b%a002010：想要痛快地玩啊……\n@c0@"
107:
  en: "@a%0%a002020@bI wonder how many people this island can hold. Think we can all fit on it too?\n@c0@"
  ja: "@a@b%a002020「その島って\n\t何人　乗れるんだろうね。\n\tあたしたち　全員　乗れるかな？\n@c0@"
  ko: "@a@b%a002020: 그 섬에는\n몇 명이 탈 수 있을까?\n우리 다 탈 수 있나?\n@c0@"
  sl: "@a@b%a002020：那座岛\n　　能坐多少人啊？\n　　我们所有人都能坐上去吧？\n@c0@"
  tl: "@a@b%a002020：那座島\n　　能坐多少人啊？\n　　我們所有人都能坐上去吧？\n@c0@"
108:
  en: "@a%0%a002030@bThe way that man is talking, one would think his spirit was already on the Isle o' Smiles.\n@c0@"
  ja: "@a@b%a002030「どうも　この人\n\tすでに　もうそうの世界に\n\t入っちゃってるみたいですね。\n@c0@"
  ko: "@a@b%a002030: 아무래도 이 사람은\n이미 망상의 세계로\n들어가 버린 것 같습니다.\n@c0@"
  sl: "@a@b%a002030：这个人\n　　好像已经陷入\n　　妄想的世界了呢。\n@c0@"
  tl: "@a@b%a002030：這個人\n　　好像已經陷入\n　　妄想的世界了呢。\n@c0@"
109:
  en: "@a%0%a002050@bWell, the lad is enthusiastic, I'll give him that.\n@c0@"
  ja: "@a@b%a002050「意気ごみ　だけは\n\tりっぱですね。\n@c0@"
  ko: "@a@b%a002050: 의욕만큼은\n대단하군요.\n@c0@"
  sl: "@a@b%a002050：气势上倒是\n　　丝毫不弱呢。\n@c0@"
  tl: "@a@b%a002050：氣勢上倒是\n　　絲毫不弱呢。\n@c0@"
110:
  en: "@a%0%a002000@bIt's nice to see someone with a little sense around here.\n@c0@"
  ja: "@a@b%a002000「オレたちと　にた意見の\n\t持ち主に　会えたのは\n\tうれしいな。\n@c0@"
  ko: "@a@b%a002000: 우리와 비슷한 생각을\n가진 사람을 만나다니\n기쁘군.\n@c0@"
  sl: "@a@b%a002000：能见到\n　　跟咱想法一样的人，\n　　真是高兴。\n@c0@"
  tl: "@a@b%a002000：能見到\n　　跟咱想法一樣的人，\n　　真是高興。\n@c0@"
111:
  en: "@a%0%a002010@bWell, if anyone was going to be sceptical...\n@c0@"
  ja: "@a@b%a002010「やはり　そういう\n\t意見の人も　いらっしゃるのね。\n@c0@"
  ko: "@a@b%a002010: 역시 이런 생각을\n가진 사람도 있구나.\n@c0@"
  sl: "@a@b%a002010：果然还是有人\n　　有这样的想法呢。\n@c0@"
  tl: "@a@b%a002010：果然還是有人\n　　有這樣的想法呢。\n@c0@"
112:
  en: "@a%0%a002020@bI think Skip's right. Unfortunately, he might be the only one around here with a good head on his shoulders.\n@c0@"
  ja: "@a@b%a002020「マハメドさんの\n\t言うとおりだと　思うわ！\n\tたよりに　なりそうね　この人！\n@c0@"
  ko: "@a@b%a002020: 마메하드 씨\n말이 맞아!\n왠지 든든한걸, 이 사람!\n@c0@"
  sl: "@a@b%a002020：我觉得\n　　穆罕默德说得没错！\n　　真是个可靠的人！\n@c0@"
  tl: "@a@b%a002020：我覺得\n　　穆罕默德說得沒錯！\n　　真是個可靠的人！\n@c0@"
113:
  en: "@a%0%a002030@bEven if the Isle o' Smiles were to be all illusion and trickery, people like him would not be fooled.\n@c0@"
  ja: "@a@b%a002030「こういう人　ばかりなら\n\tたとえ　しあわせの国が　まやかしでも\n\tだまされることは　ないのですが。\n@c0@"
  ko: "@a@b%a002030: 모두 이 사람만 같다면\n설령 행복의 나라가 가짜라도\n속는 일이 없을 텐데.\n@c0@"
  sl: "@a@b%a002030：要是人们都这样想，\n　　就不会被幸福国的\n　　传说所蒙蔽了吧。\n@c0@"
  tl: "@a@b%a002030：要是人們都這樣想，\n　　就不會被幸福國的\n　　傳說所矇蔽了吧。\n@c0@"
114:
  en: "@a%0%a002050@bIt may sound like a kid's tale, but there's plenty of full-grown adults who seem to have swallowed it.\n@c0@"
  ja: "@a@b%a002050「子どもどころか\n\tいい大人が　みんな　その気に\n\tなってますよね……。\n@c0@"
  ko: "@a@b%a002050: 어린애라뇨.\n다 큰 어른도 모두\n넘어가 버리던데요......\n@c0@"
  sl: "@a@b%a002050：别说小孩，\n　　连好多大人都完全\n　　把这事当真了呢……\n@c0@"
  tl: "@a@b%a002050：別說小孩，\n　　連好多大人都完全\n　　把這事當真了呢……\n@c0@"
115:
  en: "@a%0%a002000@bEh... That conversation went nowhere, aye...?\n@c0@"
  ja: "@a@b%a002000「話が\n\tおわっちまったな……。\n@c0@"
  ko: "@a@b%a002000: 이야기를\n끝내 버리는군......\n@c0@"
  sl: "@a@b%a002000：话说完了啊……\n@c0@"
  tl: "@a@b%a002000：話說完了啊……\n@c0@"
116:
  en: "@a%0%a002010@bLet's try talking to some of the other people in town.\n@c0@"
  ja: "@a@b%a002010「もう少し　町を　まわって\n\tほかの人からも　話を　聞いて\n\tみましょうか。\n@c0@"
  ko: "@a@b%a002010: 마을을 더 돌아보면서\n다른 사람들의 이야기도\n들어 볼까?\n@c0@"
  sl: "@a@b%a002010：再在镇里转转，\n　　找别人打听打听吧。\n@c0@"
  tl: "@a@b%a002010：再在鎮裡轉轉，\n　　找別人打聽打聽吧。\n@c0@"
117:
  en: "@a%0%a002020@b‘Never mind’? That just makes me want to pay it all the more mind!\n@c0@"
  ja: "@a@b%a002020「なにも　いうまい\n\t……なんて　言われると　かえって\n\t気に　なっちゃうわよ　ねえ。\n@c0@"
  ko: "@a@b%a002020: 아무 말 않겠다고\n하니까 반대로\n더 듣고 싶잖아.\n@c0@"
  sl: "@a@b%a002020：说什么\n　　我无话可说……\n　　这样人家反而更好奇了呢。\n@c0@"
  tl: "@a@b%a002020：說什麼\n　　我無話可說……\n　　這樣人家反而更好奇了呢。\n@c0@"
118:
  en: "@a%0%a002030@bI think it best to find out more about this floating island and the so-called Isle o' Smiles.\n@c0@"
  ja: "@a@b%a002030「しあわせの国と\n\tうかぶ島の話は　もう少しどこかで\n\t聞いてみたほうがいいですね。\n@c0@"
  ko: "@a@b%a002030: 행복의 나라와\n부유하는 섬에 관한 정보는\n다른 곳에서도 얻는 게 좋겠어요.\n@c0@"
  sl: "@a@b%a002030：幸福国和浮岛的事情，\n　　再找人打听一下\n　　会比较好。\n@c0@"
  tl: "@a@b%a002030：幸福國和浮島的事情，\n　　再找人打聽一下\n　　會比較好。\n@c0@"
119:
  en: "@a%0%a002050@bNow I really want to hear more about this place!\n@c0@"
  ja: "@a@b%a002050「なにも　言うまい\n\t…なんて　言われると　何かを\n\t言ってほしく　なりますよね。\n@c0@"
  ko: "@a@b%a002050: 아무 말 않겠다는\n말을 들으니까 괜히\n더 듣고 싶어지네요.\n@c0@"
  sl: "@a@b%a002050：说什么\n　　我无话可说……\n　　我反倒更想听他说了呢。\n@c0@"
  tl: "@a@b%a002050：說什麼\n　　我無話可說……\n　　我反倒更想聽他說了呢。\n@c0@"
120:
  en: "@a%0%a002000@bGets dark quick in the desert, aye?\n@c0@"
  ja: "@a@b%a002000「おっと\n\tもう　夜か……。\n@c0@"
  ko: "@a@b%a002000: 오옷,\n벌써 밤이군......\n@c0@"
  sl: "@a@b%a002000：哎呀，\n　　已经到晚上了啊……\n@c0@"
  tl: "@a@b%a002000：哎呀，\n　　已經到晚上了啊……\n@c0@"
121:
  en: "@a%0%a002010@bIt's already dark. I wonder if the inn's open...\n@c0@"
  ja: "@a@b%a002010「もう　まっくらね。\n\t宿屋は　あいてるかしら。\n@c0@"
  ko: "@a@b%a002010: 벌써 깜깜하네.\n여관에는 빈방이 있을까?\n@c0@"
  sl: "@a@b%a002010：夜已经深了，\n　　不知道旅店还有没有空房间。\n@c0@"
  tl: "@a@b%a002010：夜已經深了，\n　　不知道旅店還有沒有空房間。\n@c0@"
122:
  en: "@a%0%a002020@bWhoa! Night already? I didn't notice.\n@c0@"
  ja: "@a@b%a002020「気がついたら\n\tもう　こんなよふけ？\n@c0@"
  ko: "@a@b%a002020: 어느새\n이렇게 밤이 깊어졌지?\n@c0@"
  sl: "@a@b%a002020：一不留神，\n　　都已经这么晚了？\n@c0@"
  tl: "@a@b%a002020：一不留神，\n　　都已經這麼晚了？\n@c0@"
123:
  en: "@a%0%a002030@bThe night is drawing in.\n@c0@"
  ja: "@a@b%a002030「夜も　だいぶ\n\tふけてきましたね。\n@c0@"
  ko: "@a@b%a002030: 밤도 꽤\n깊어졌군요.\n@c0@"
  sl: "@a@b%a002030：夜已经很深了。\n@c0@"
  tl: "@a@b%a002030：夜已經很深了。\n@c0@"
124:
  en: "@a%0%a002050@bOld %a002050 tends to get a tad jumpy of an evenin'. But don't worry — there'll be no monster antics from me!\n@c0@"
  ja: "@a@b%a002050「夜って　ドキドキしますねー。\n\tあ　だいじょうぶですよ。\n\t変身　しませんから。\n@c0@"
  ko: "@a@b%a002050: 밤이 되면 가슴이 뛰죠~\n아, 괜찮습니다.\n변신하는 거 아니니까요.\n@c0@"
  sl: "@a@b%a002050：一到晚上我就很激动呢。\n　　啊，没事的啦。\n　　我不会变成魔物的。\n@c0@"
  tl: "@a@b%a002050：一到晚上我就很激動呢。\n　　啊，沒事的啦。\n　　我不會變成魔物的。\n@c0@"
125:
  en: "@a%0%a002000@bAhoy! That's definitely a full moon up there.\n@c0@"
  ja: "@a@b%a002000「満月の夜か……。\n\tたしかに　お月さまが\n\tまん丸だぜ。\n@c0@"
  ko: "@a@b%a002000: 보름달이 뜬 밤......\n확실히 달이\n아주 동그랗군.\n@c0@"
  sl: "@a@b%a002000：月圆之夜啊……\n　　月亮的确是圆圆的。\n@c0@"
  tl: "@a@b%a002000：月圓之夜啊……\n　　月亮的確是圓圓的。\n@c0@"
126:
  en: "@a%0%a002010@bThe moon is nice and bright. It should be safe to walk around, even outside of town.\n@c0@"
  ja: "@a@b%a002010「月明かりで　明るいわ。\n\t町の外でも　らくに　歩けそう。\n@c0@"
  ko: "@a@b%a002010: 달빛 덕분에 밝구나.\n마을 밖에서도 편하게 걸을 수 있겠어.\n@c0@"
  sl: "@a@b%a002010：月光真是明亮。\n　　即使在镇子外面也能轻松行走。\n@c0@"
  tl: "@a@b%a002010：月光真是明亮。\n　　即使在鎮子外面也能輕鬆行走。\n@c0@"
127:
  en: "@a%0%a002020@bSure gets cold when the sun drops around here...\n@c0@"
  ja: "@a@b%a002020「少し\n\t冷えこんで　きたわね。\n@c0@"
  ko: "@a@b%a002020: 조금\n쌀쌀해졌네.\n@c0@"
  sl: "@a@b%a002020：气温有些下降呢。\n@c0@"
  tl: "@a@b%a002020：氣溫有些下降呢。\n@c0@"
128:
  en: "@a%0%a002030@bThe number of people out on the streets has dwindled...\n@c0@"
  ja: "@a@b%a002030「さすがに\n\t人影が　まばらですね。\n@c0@"
  ko: "@a@b%a002030: 확실히\n인적이 드물어졌군요.\n@c0@"
  sl: "@a@b%a002030：人还真少呢。\n@c0@"
  tl: "@a@b%a002030：人還真少呢。\n@c0@"
129:
  en: "@a%0%a002050@bI know it's gettin' dark, but doesn't there seem to be a shortage of townsfolk?\n@c0@"
  ja: "@a@b%a002050「あれー？\n\t夜だとは言え　町の人が\n\t少なくないですか？\n@c0@"
  ko: "@a@b%a002050: 어?\n아무리 밤이라지만 마을 사람이\n너무 적은 거 아닌가요?\n@c0@"
  sl: "@a@b%a002050：诶？\n　　虽说现在是晚上，\n　　但镇上的人是不是太少了点？\n@c0@"
  tl: "@a@b%a002050：誒？\n　　雖說現在是晚上，\n　　但鎮上的人是不是太少了點？\n@c0@"
130:
  en: "@a%0%a002000@bSo what was the story again? A floating island from the Isle o' Smiles that makes port under the full moon, aye?\n@c0@"
  ja: "@a@b%a002000「満月の夜\n\tしあわせの国から　むかえの\n\tうかぶ島が　やってくる……。\n@c0@"
  ko: "@a@b%a002000: 보름달이 뜨는 밤\n행복의 나라에서 사람들을 데리러\n부유하는 섬이 다가온다......\n@c0@"
  sl: "@a@b%a002000：在月圆之夜，\n　　会有浮岛出现\n　　接大家去幸福国……\n@c0@"
  tl: "@a@b%a002000：在月圓之夜，\n　　會有浮島出現\n　　接大家去幸福國……\n@c0@"
131:
  en: "@a%0%a002000@bIf we're gonna find out if it's true, tonight's the night!\n@c0@"
  ja: "@a@b%a002000「本当か　どうか\n\t今夜のうちに　確かめようぜ！\n@c0@"
  ko: "@a@b%a002000: 진짜인지 아닌지는\n오늘 밤에 확인해 보자고!\n@c0@"
  sl: "@a@b%a002000：今晚一定要好好瞧瞧，\n　　这到底是不是真的！\n@c0@"
  tl: "@a@b%a002000：今晚一定要好好瞧瞧，\n　　這到底是不是真的！\n@c0@"
132:
  en: "@a%0%a002010@bThe island that goes to the Isle o' Smiles should be arriving at the western cape.\n@c0@"
  ja: "@a@b%a002010「しあわせの国行きの\n\tうかぶ島って　たしか\n\t西の岬に　つくのよね。\n@c0@"
  ko: "@a@b%a002010: 행복의 나라로 간다는\n부유하는 섬은\n서쪽 곶으로 온다고 했지?\n@c0@"
  sl: "@a@b%a002010：前往幸福国的浮岛，\n　　好像是会停靠在\n　　西边的海峡吧。\n@c0@"
  tl: "@a@b%a002010：前往幸福國的浮島，\n　　好像是會停靠在\n　　西邊的海峽吧。\n@c0@"
133:
  en: "@a%0%a002020@bOnce we're done looking around town, I think I'd like to check out that western cape a bit.\n@c0@"
  ja: "@a@b%a002020「町のようすを\n\tしらべ　おえたら……\n\t西の岬に　行ってみようね。\n@c0@"
  ko: "@a@b%a002020: 마을을 다\n둘러보고 나면......\n서쪽 곶으로 가 보자.\n@c0@"
  sl: "@a@b%a002020：调查完\n　　镇子的情况之后……\n　　就去西边的海峡吧。\n@c0@"
  tl: "@a@b%a002020：調查完\n　　鎮子的情況之後……\n　　就去西邊的海峽吧。\n@c0@"
134:
  en: "@a%0%a002030@bI want to see this island with my own eyes.\n@c0@"
  ja: "@a@b%a002030「本当に　そんな　島が\n\tやってくるのか　この目で\n\t確かめて　みたいです。\n@c0@"
  ko: "@a@b%a002030: 정말 그런 섬이\n찾아오는지 제 눈으로\n확인하고 싶습니다.\n@c0@"
  sl: "@a@b%a002030：一定要好好看看，\n　　是不是真的\n　　会出现那样的岛。\n@c0@"
  tl: "@a@b%a002030：一定要好好看看，\n　　是不是真的\n　　會出現那樣的島。\n@c0@"
135:
  en: "@a%0%a002050@bLooks like we'll be workin' the night-shift tonight!\n@c0@"
  ja: "@a@b%a002050「今夜は　いそがしく\n\tなりそうですね！\n\tワクワク！\n@c0@"
  ko: "@a@b%a002050: 오늘 밤에는\n바빠지겠네요!\n두근두근!\n@c0@"
  sl: "@a@b%a002050：今晚会变得很忙呢！\n　　好期待！\n@c0@"
  tl: "@a@b%a002050：今晚會變得很忙呢！\n　　好期待！\n@c0@"
136:
  en: "@a%0%a002000@bThat fella oughta move away from the well. It's probably freezin' in there!\n@c0@"
  ja: "@a@b%a002000「じいさん\n\t井戸の　そばにいたら\n\tよけいに　冷えるぜ。\n@c0@"
  ko: "@a@b%a002000: 할아버지,\n우물 옆에 있으면\n더 추울걸.\n@c0@"
  sl: "@a@b%a002000：老爷爷，\n　　在井边待着的话\n　　会着凉的啊。\n@c0@"
  tl: "@a@b%a002000：老爺爺，\n　　在井邊待著的話\n　　會著涼的啊。\n@c0@"
137:
  en: "@a%0%a002010@bIndeed. We'll freeze to death out here if we aren't careful.\n@c0@"
  ja: "@a@b%a002010「ホント。\n\t気がついたら　ずいぶんと\n\t冷えてきているわね。\n@c0@"
  ko: "@a@b%a002010: 맞아.\n어느샌가\n꽤 쌀쌀해졌어.\n@c0@"
  sl: "@a@b%a002010：真的呢。\n　　一不留神，\n　　都已经这么冷了呢。\n@c0@"
  tl: "@a@b%a002010：真的呢。\n　　一不留神，\n　　都已經這麼冷了呢。\n@c0@"
138:
  en: "@a%0%a002020@bSheesh. If he's that cold, why doesn't he go home and warm up?\n@c0@"
  ja: "@a@b%a002020「おじいさん\n\t早く　おうちに　かえれば\n\tいいのに。\n@c0@"
  ko: "@a@b%a002020: 할아버지도 참\n어서 집으로 돌아가시면\n좋을 텐데.\n@c0@"
  sl: "@a@b%a002020：老爷爷，\n　　早点回家吧。\n@c0@"
  tl: "@a@b%a002020：老爺爺，\n　　早點回家吧。\n@c0@"
139:
  en: "@a%0%a002030@bThe Goddess has blessed us with a beautiful full moon in the cold, clear sky.\n@c0@"
  ja: "@a@b%a002030「満月が　きれいですね。\n\t寒さで　空気がすんでいるから\n\tきれいに　みえるんですよー。\n@c0@"
  ko: "@a@b%a002030: 보름달이 아름답군요.\n추워서 공기가 맑아진 덕에\n깨끗하게 보이는 겁니다.\n@c0@"
  sl: "@a@b%a002030：满月真美啊。\n　　因为气温低，空气清新，\n　　看上去很美呢。\n@c0@"
  tl: "@a@b%a002030：滿月真美啊。\n　　因為氣溫低，空氣清新，\n　　看上去很美呢。\n@c0@"
140:
  en: "@a%0%a002050@bAh-CHOO!!!\n@c0@"
  ja: "@a@b%a002050「ハーックショイ！！\n@c0@"
  ko: "@a@b%a002050: 에~에엣취!!\n@c0@"
  sl: "@a@b%a002050：阿嚏！！\n@c0@"
  tl: "@a@b%a002050：阿嚏！！\n@c0@"
141:
  en: "@a%0%a002000@bSeein' a full moon makes me wanna howl too.\n@c0@"
  ja: "@a@b%a002000「月に　向かって\n\tほえているのかな？\n@c0@"
  ko: "@a@b%a002000: 달을 향해\n짖고 있는 건가?\n@c0@"
  sl: "@a@b%a002000：在朝着月亮\n　　叫唤吧？\n@c0@"
  tl: "@a@b%a002000：在朝著月亮\n　　叫喚吧？\n@c0@"
142:
  en: "@a%0%a002010@bIs he howling because something's coming?\n@c0@"
  ja: "@a@b%a002010「何かが　来るから\n\tほえて　いるのかも？\n@c0@"
  ko: "@a@b%a002010: 뭔가가 오니까\n짖고 있는 걸지도 몰라.\n@c0@"
  sl: "@a@b%a002010：是因为有什么东西要来，\n　　所以才叫吧？\n@c0@"
  tl: "@a@b%a002010：是因為有什麼東西要來，\n　　所以才叫吧？\n@c0@"
143:
  en: "@a%0%a002020@bI wonder what he's howling at.\n@c0@"
  ja: "@a@b%a002020「とおぼえ　してる！\n@c0@"
  ko: "@a@b%a002020: 멀리까지 들리게 짖고 있네!\n@c0@"
  sl: "@a@b%a002020：朝着远方在叫呢！\n@c0@"
  tl: "@a@b%a002020：朝著遠方在叫呢！\n@c0@"
144:
  en: "@a%0%a002030@bThat dog sounds as if he is giving a send-off of sorts to those who are off to the Isle 'o' Smiles.\n@c0@"
  ja: "@a@b%a002030「まるで　今夜\n\tしあわせの国へ　旅立つ人たちを\n\t見送るかのような　なき声……。\n@c0@"
  ko: "@a@b%a002030: 마치 오늘 밤\n행복의 나라로 떠나는 사람들을\n배웅하는 듯한 울음소리......\n@c0@"
  sl: "@a@b%a002030：这叫声就像是为\n　　今晚起程前往幸福国的人们\n　　送行似的……\n@c0@"
  tl: "@a@b%a002030：這叫聲就像是為\n　　今晚起程前往幸福國的人們\n　　送行似的……\n@c0@"
145:
  en: "@a%0%a002050@bOld %a002050 feels like stayin' and howlin' as well!\n@c0@"
  ja: "@a@b%a002050「いやー　つい\n\tつられそうに　なりますね。\n@c0@"
  ko: "@a@b%a002050: 이야~ 저도 모르게\n따라할 뻔했네요.\n@c0@"
  sl: "@a@b%a002050：哎呀，一不小心\n　　就入迷了呢。\n@c0@"
  tl: "@a@b%a002050：哎呀，一不小心\n　　就入迷了呢。\n@c0@"
146:
  en: "@a%0%a002000@bIf you ask me, this seems like the worst seat in the house for moon-gazing.\n@c0@"
  ja: "@a@b%a002000「ここから　見たら\n\t月が　よけい　とおくに\n\t思えるよな。\n@c0@"
  ko: "@a@b%a002000: 여기서 보니까\n달이 더 멀리 있는 것처럼\n느껴지는군.\n@c0@"
  sl: "@a@b%a002000：从这里看的话，\n　　月亮感觉好远。\n@c0@"
  tl: "@a@b%a002000：從這裡看的話，\n　　月亮感覺好遠。\n@c0@"
147:
  en: "@a%0%a002010@b(shiver) It's even colder here in the well.\n@c0@"
  ja: "@a@b%a002010「井戸の底は\n\tいちだんと　冷えるわね。\n@c0@"
  ko: "@a@b%a002010: 우물 속은\n훨씬 더 춥네.\n@c0@"
  sl: "@a@b%a002010：井底感觉更冷呢。\n@c0@"
  tl: "@a@b%a002010：井底感覺更冷呢。\n@c0@"
148:
  en: "@a%0%a002020@bSheesh. Does that guy ever go home?\n@c0@"
  ja: "@a@b%a002020「こんな　夜まで\n\t井戸ほりを　やってるのかしら。\n@c0@"
  ko: "@a@b%a002020: 이렇게 늦은 밤까지\n우물을 파고 있는 걸까?\n@c0@"
  sl: "@a@b%a002020：都这么晚了，\n　　还在挖井吗？\n@c0@"
  tl: "@a@b%a002020：都這麼晚了，\n　　還在挖井嗎？\n@c0@"
149:
  en: "@a%0%a002030@bSo there is beauty to be found even in a desolate town such as this...\n@c0@"
  ja: "@a@b%a002030「カルカドは　何にもない\n\t町だと　誰か　言ってましたが……\n\tこのながめは　すてきですよ。\n@c0@"
  ko: "@a@b%a002030: 캘커드는 아무것도\n없는 마을이라고 누군가가 말했지만......\n이 풍경은 참 멋있는걸요.\n@c0@"
  sl: "@a@b%a002030：虽然有人说加尔加德\n　　是个什么都没有的镇子……\n　　但是这幅景致真的很美啊。\n@c0@"
  tl: "@a@b%a002030：雖然有人說加爾加德\n　　是個什麼都沒有的鎮子……\n　　但是這幅景致真的很美啊。\n@c0@"
150:
  en: "@a%0%a002050@bLook! The moon's the same size as the well!\n@c0@"
  ja: "@a@b%a002050「井戸の　まん丸に\n\tお月さまの　まん丸が\n\tぴったり　はまりますねー。\n@c0@"
  ko: "@a@b%a002050: 둥근 우물과\n둥근 달이\n딱 맞네요~!\n@c0@"
  sl: "@a@b%a002050：圆圆的井口\n　　正好跟圆圆的月亮\n　　相契合呢～\n@c0@"
  tl: "@a@b%a002050：圓圓的井口\n　　正好跟圓圓的月亮\n　　相契合呢～\n@c0@"
151:
  en: "@a%0%a002000@bFeels good to warm up the bones a bit, aye?\n@c0@"
  ja: "@a@b%a002000「外は　冷えるが\n\tこの　うちの中は\n\tあったかいな。\n@c0@"
  ko: "@a@b%a002000: 밖은 춥지만\n이 집 안은\n따뜻하군.\n@c0@"
  sl: "@a@b%a002000：外面那么冷，\n　　这里面还挺暖和的啊。\n@c0@"
  tl: "@a@b%a002000：外面那麼冷，\n　　這裡面還挺暖和的啊。\n@c0@"
152:
  en: "@a%0%a002010@bThat old gentleman.... Is he napping?\n@c0@"
  ja: "@a@b%a002010「おじいさんは……\n\tあらあら　いねむり　してる？\n@c0@"
  ko: "@a@b%a002010: 할아버지는......\n어머, 졸고 계시는 건가?\n@c0@"
  sl: "@a@b%a002010：老爷爷……\n　　哎呀哎呀，在打盹吗？\n@c0@"
  tl: "@a@b%a002010：老爺爺……\n　　哎呀哎呀，在打盹嗎？\n@c0@"
153:
  en: "@a%0%a002020@bThis is the couple who keep turning down offers to see the Isle o' Smiles, right?\n@c0@"
  ja: "@a@b%a002020「ここの　ふたりは\n\tしあわせの国に　行くつもりは\n\tないって　言ってたわね。\n@c0@"
  ko: "@a@b%a002020: 여기 사는 두 분은\n행복의 나라로 갈 생각이\n없다고 하셨지.\n@c0@"
  sl: "@a@b%a002020：这两人说\n　　他们不想去\n　　幸福国吧。\n@c0@"
  tl: "@a@b%a002020：這兩人說\n　　他們不想去\n　　幸福國吧。\n@c0@"
154:
  en: "@a%0%a002030@bThis couple seem to have found perfect contentment in one another's company.\n@c0@"
  ja: "@a@b%a002030「おふたりは　ここでの\n\tつつましい　暮らしだけで\n\tじゅうぶん　しあわせ……。\n@c0@"
  ko: "@a@b%a002030: 두 분은 이곳에서의\n검소한 삶만으로도\n충분히 행복해 보이는군요......\n@c0@"
  sl: "@a@b%a002030：两人在这里\n　　这样谨小慎微地生活着，\n　　已经十分幸福了……\n@c0@"
  tl: "@a@b%a002030：兩人在這裡\n　　這樣謹小慎微地生活著，\n　　已經十分幸福了……\n@c0@"
155:
  en: "@a%0%a002030@bJust being in the same place as them makes one feel at peace.\n@c0@"
  ja: "@a@b%a002030「見ている　だけで\n\tそんな　ふんいきが\n\t伝わって　きますね。\n@c0@"
  ko: "@a@b%a002030: 보고만 있어도\n그런 느낌이\n전해집니다.\n@c0@"
  sl: "@a@b%a002030：只是看着，\n　　都能感受到两人\n　　流露出的这种气氛呢。\n@c0@"
  tl: "@a@b%a002030：只是看著，\n　　都能感受到兩人\n　　流露出的這種氣氛呢。\n@c0@"
156:
  en: "@a%0%a002050@bThat old fellow will catch his death if he doesn't sleep in his bed.\n@c0@"
  ja: "@a@b%a002050「おじいさん　ちゃんと\n\tベッドで　ねないと\n\tかぜひきそうで　心配です。\n@c0@"
  ko: "@a@b%a002050: 할아버지, 침대에\n누워서 주무시지 않으면\n감기 걸리실지도 몰라요.\n@c0@"
  sl: "@a@b%a002050：要是不去床上睡的话，\n　　老爷爷会感冒的啊。\n　　真担心。\n@c0@"
  tl: "@a@b%a002050：要是不去床上睡的話，\n　　老爺爺會感冒的啊。\n　　真擔心。\n@c0@"
157:
  en: "@a%0%a002000@bShe's one sweet old lady, aye?\n@c0@"
  ja: "@a@b%a002000「ほんとに\n\tやさしそうな　おばあさんだぜ。\n@c0@"
  ko: "@a@b%a002000: 정말\n자상해 보이는 할머니로군.\n@c0@"
