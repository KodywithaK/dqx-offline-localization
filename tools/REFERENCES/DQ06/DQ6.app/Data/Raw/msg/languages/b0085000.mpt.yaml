  tl: "@a@b＊：在各位的幫助下，\n　　大家好不容易\n　　都恢復了神智……\n@c0@"
67:
  en: "@a@b*: But the second anyone hops in the spring to try and reach the portal, they're sapped of all their strength again...\n@c0@"
