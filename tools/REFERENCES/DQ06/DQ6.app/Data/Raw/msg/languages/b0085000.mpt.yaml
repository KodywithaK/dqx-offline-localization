  ko: "@a@b*: 으아악~ 제 탓이\n아닙니다.\n@c0@"
  sl: "@a@b＊：不、不，\n　　不是我的错啊。\n@c0@"
  tl: "@a@b＊：不、不，\n　　不是我的錯啊。\n@c0@"
64:
  en: "@a@b*: I didn't mix any of our drinks — I just served them. Honest!\n@c0@"
  ja: "@a@b＊「自分でも　知らないうちに\n\tこの酒を　みなさんに\n\t飲ませていたんです。\n@c0@"
  ko: "@a@b*: 저도 모르는 사이에\n이 술을 사람들에게\n마시게 했던 모양입니다.\n@c0@"
  sl: "@a@b＊：我在不知不觉中\n　　就把酒送给大家，\n　　让他们喝下了。\n@c0@"
  tl: "@a@b＊：我在不知不覺中\n　　就把酒送給大家，\n　　讓他們喝下了。\n@c0@"
65:
  en: "@a@b*: Ahh, life is good. I just love it in there...\n@c0@"
  ja: "@a@b＊「うーん　気持ちいい。\n\t温泉は　本当に　いいなあ。\n@c0@"
  ko: "@a@b*: 으~음 기분 좋군.\n온천은 정말 좋아.\n@c0@"
  sl: "@a@b＊：嗯……好舒服！\n　　这温泉还真是不错。\n@c0@"
  tl: "@a@b＊：嗯……好舒服！\n　　這溫泉還真是不錯。\n@c0@"
66:
