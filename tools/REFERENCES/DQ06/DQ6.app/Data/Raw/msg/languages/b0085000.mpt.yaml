0:
  en: "@a@b*: Oh, you're awake! I have wonderful news! Hope has been rekindled in this town, and it's all thanks to you!\r\n\n@c0@"
  ja: "@a@b＊「あら　目が　覚めたのね。\n\tあなた方のおかげで　皆が\n\t希望を　とりもどしたわ。\n@c0@"
  ko: "@a@b*: 어머, 잠이 깼나 보네.\n당신들 덕분에 모두\n희망을 되찾았어.\n@c0@"
  sl: "@a@b＊：哎呀！感觉清醒了不少呢！\n　　多亏了你们的帮忙，\n　　大家又重新拥有了希望。\n@c0@"
  tl: "@a@b＊：哎呀！感覺清醒了不少呢！\n　　多虧了你們的幫忙，\n　　大家又重新擁有了希望。\n@c0@"
1:
  en: "@a@b*: We really can't thank you enough.\n@c0@"
  ja: "@a@b＊「本当に　ありがとう。\n@c0@"
  ko: "@a@b*: 정말 고마워.\n@c0@"
  sl: "@a@b＊：真是太感谢了。\n@c0@"
  tl: "@a@b＊：真是太感謝了。\n@c0@"
2:
  en: "@a@b*: That equipment's all yours, by the way. Mr Wynne said that it was made just for you.\n@c0@"
  ja: "@a@b＊「それから　エンデじいさんが\n\tあの　%a002380を　%a000120さんにって。\n@c0@"
  ko: "@a@b*: 그리고 엔데 영감님이\n그 %a002380%F2380%X를%Y을%Z %a000120에게 전해 주랬어.\n@c0@"
  sl: "@a@b＊：而且，听说恩迪爷爷还把%a002380\n　　送给了%a000120。\n@c0@"
  tl: "@a@b＊：而且，聽說恩迪爺爺還把%a002380\n　　送給了%a000120。\n@c0@"
3:
  en: "@a@b*: How wonderful it is to see him back at work! He's a model for us all, I'd say.\n@c0@"
  ja: "@a@b＊「おじいさんも　元気になってくれて\n\tよかったわ。\n\t私も　がんばらなくちゃ！\n@c0@"
  ko: "@a@b*: 영감님도 기운을\n되찾아서 다행이야.\n나도 힘내야겠어!\n@c0@"
  sl: "@a@b＊：恩迪爷爷也打起精神了，\n　　真是太好了。\n　　我也要努力工作了！\n@c0@"
  tl: "@a@b＊：恩迪爺爺也打起精神了，\n　　真是太好了。\n　　我也要努力工作了！\n@c0@"
4:
  en: "@a@b*: Good heavens, what a miracle! It's like the weight of the world has been lifted from my shoulders!\n@c0@"
  ja: "@a@b＊「なんだか　身体が　かるく\n\tなったようじゃよ。\n\tありがたいことじゃ。\n@c0@"
  ko: "@a@b*: 왠지 몸이\n가벼워진 것 같군.\n고맙구려.\n@c0@"
  sl: "@a@b＊：感觉身子似乎\n　　轻便了许多呢！\n　　真是太感谢你们了。\n@c0@"
  tl: "@a@b＊：感覺身子似乎\n　　輕便了許多呢！\n　　真是太感謝你們了。\n@c0@"
5:
  en: "@a@b*: I can't believe I was ready to just give up on life. What a fool I was!\n@c0@"
  ja: "@a@b＊「このまま　死んでしまおうなんて\n\tバカなことを　考えていたもんです。\n@c0@"
  ko: "@a@b*: 이대로 죽어버릴까 하는\n바보 같은 생각을 했었습니다.\n@c0@"
  sl: "@a@b＊：我真是个傻瓜，\n　　居然曾经想着就这么死了算了。\n@c0@"
  tl: "@a@b＊：我真是個傻瓜，\n　　居然曾經想著就這麼死了算了。\n@c0@"
6:
  en: "@a@b*: Goddess, what would my dearly departed love have thought of me?\n@c0@"
  ja: "@a@b＊「こんなことじゃ　亡くなった\n\tボクの恋人に　顔むけできないや。\n@c0@"
  ko: "@a@b*: 이래서야 이미 죽은\n내 애인을 만날 낯이 없지.\n@c0@"
  sl: "@a@b＊：真就这么死了的话，我也没有脸\n　　去见我那已经去世的女友啊。\n@c0@"
  tl: "@a@b＊：真就這麼死了的話，我也沒有臉\n　　去見我那已經去世的女友啊。\n@c0@"
7:
  en: "@a@b*: All of us will make it back home someday. I'm sure of that now!\n@c0@"
  ja: "@a@b＊「私たち　きっといつか\n\tもとの世界に　もどれるんですよね！\n@c0@"
  ko: "@a@b*: 우린 틀림없이 언젠가\n원래 세계로 돌아갈 수 있을 겁니다!\n@c0@"
  sl: "@a@b＊：我们一定能够\n　　回到原来的世界的！\n@c0@"
  tl: "@a@b＊：我們一定能夠\n　　回到原來的世界的！\n@c0@"
8:
  en: "@a@b*: But I still have to keep the kids fed in the meantime. We'll need to keep their spirits high!\n@c0@"
  ja: "@a@b＊「さあ　子どもたちに\n\tおいしいゴハンを　食べさせて\n\t元気を　つけなくちゃ。\n@c0@"
  ko: "@a@b*: 자, 아이들에게\n맛있는 밥을 먹여서\n기운을 북돋아 줘야지.\n@c0@"
  sl: "@a@b＊：我也得给孩子们\n　　多做些好吃的，\n　　这样才能健健康康地回去！\n@c0@"
  tl: "@a@b＊：我也得給孩子們\n　　多做些好吃的，\n　　這樣才能健健康康地回去！\n@c0@"
9:
  en: "@a@b*: Outta the way! We're training here!\n@c0@"
  ja: "@a@b＊「ジャマしないでよ！\n\tくんれん中なんだから。\n@c0@"
  ko: "@a@b*: 방해하지 마!\n훈련 중이니까.\n@c0@"
  sl: "@a@b＊：别碍事！\n　　没看到我在锻炼吗？\n@c0@"
  tl: "@a@b＊：別礙事！\n　　沒看到我在鍛煉嗎？\n@c0@"
10:
  en: "@a@b*: Mortamor's in big trouble once we get big 'n' strong!\n@c0@"
  ja: "@a@b＊「ボクたち　大魔王デスタムーアを\n\tやっつけるために　身体を\n\tきたえてるんだ！\n@c0@"
  ko: "@a@b*: 우린 대마왕 데스타무아를\n쓰러뜨리기 위해\n몸을 단련하고 있어!\n@c0@"
  sl: "@a@b＊：为了打倒大魔王德斯塔穆亚，\n　　我们决定从现在开始\n　　努力锻炼身体！\n@c0@"
  tl: "@a@b＊：為了打倒大魔王德斯塔穆亞，\n　　我們決定從現在開始\n　　努力鍛煉身體！\n@c0@"
11:
  en: "@a@b*: The town's spirits are soaring once again, thanks to you.\n@c0@"
  ja: "@a@b＊「あなた方のおかげで　町の皆が\n\t気力を　とりもどしたようです。\n@c0@"
  ko: "@a@b*: 당신들 덕분에 마을 사람들이\n기력을 되찾은 것 같습니다.\n@c0@"
  sl: "@a@b＊：多亏了你们的帮忙，\n　　镇上的人们全都充满了干劲。\n@c0@"
  tl: "@a@b＊：多虧了你們的幫忙，\n　　鎮上的人們全都充滿了幹勁。\n@c0@"
12:
  en: "@a@b*: You've given us hope that there's a way out of here. Now we have a goal. We have drive. We have a reason to care.\n@c0@"
  ja: "@a@b＊「いつか　もとの世界に\n\tもどれるかもしれないという\n\t希望が　皆を元気づけてくれました。\n@c0@"
  ko: "@a@b*: 언젠가 원래 있던 세계로\n되돌아갈 수 있다는 희망이\n모두의 힘을 되찾아 주었죠.\n@c0@"
  sl: "@a@b＊：说不定哪一天\n　　就可以回到原来的世界，\n　　这个希望鼓舞了大家。\n@c0@"
  tl: "@a@b＊：說不定哪一天\n　　就可以回到原來的世界，\n　　這個希望鼓舞了大家。\n@c0@"
13:
  en: "@a@b*: One thing's for sure — I won't let anyone call this place ‘Despairia’ any longer!\n@c0@"
  ja: "@a@b＊「もう　だれにも　この町を\n\t絶望の町だなんて\n\tよばせませんわ。\n@c0@"
  ko: "@a@b*: 이제 그 누구도 이 마을을\n절망의 마을이라고\n부를 수 없을 거예요.\n@c0@"
  sl: "@a@b＊：已经没有人\n　　再把这个小镇\n　　叫做绝望之镇了。\n@c0@"
  tl: "@a@b＊：已經沒有人\n　　再把這個小鎮\n　　叫做絕望之鎮了。\n@c0@"
14:
  en: "@a@b*: Wow... I don't know what hit me.\n@c0@"
  ja: "@a@b＊「オレは　いったい\n\t何をしていたのだろうか？\n@c0@"
  ko: "@a@b*: 나는 도대체\n뭘 하고 있었던 걸까?\n@c0@"
  sl: "@a@b＊：我以前都\n　　做过些什么？\n@c0@"
  tl: "@a@b＊：我以前都\n　　做過些什麼？\n@c0@"
15:
  en: "@a@b*: I remember going for a dip in the lagoon, which felt reeeally nice... But then everything gets hazy...\n@c0@"
  ja: "@a@b＊「西の温泉に　いって……\n\t気分が　良くなったところまでは\n\tおぼえているのだが……。\n@c0@"
  ko: "@a@b*: 서쪽 온천에 가서......\n기분이 좋았던 것까지는\n기억나는데......\n@c0@"
  sl: "@a@b＊：我只记得自己去了西边的温泉，\n　　泡过温泉后心情变得十分舒畅……\n　　之后的事情就忘记了。\n@c0@"
  tl: "@a@b＊：我只記得自己去了西邊的溫泉，\n　　泡過溫泉後心情變得十分舒暢……\n　　之後的事情就忘記了。\n@c0@"
16:
  en: "@a@b*: Wait... That's weird... How'd I get here?\n@c0@"
  ja: "@a@b＊「あら　私……？　へんねえ。\n\tどうして　こんな所に\n\tいるのかしら。\n@c0@"
  ko: "@a@b*: 어머, 내가 왜......? 이상해라.\n어째서 이런 곳에\n있는 걸까?\n@c0@"
  sl: "@a@b＊：诶？我这是……\n　　为什么会在\n　　这种地方啊？\n@c0@"
  tl: "@a@b＊：誒？我這是……\n　　為什麼會在\n　　這種地方啊？\n@c0@"
17:
  en: "@a@b*: One minute I was having a nightmare about Mortamor kidnapping me, and then... Ahh, I just can't remember!\n@c0@"
  ja: "@a@b＊「大魔王に　さらわれる夢を見て\n\tそれから　えーと……\n\tあーん　何も　思い出せないわ！\n@c0@"
  ko: "@a@b*: 대마왕에게 납치되는 꿈을 꾸고\n그리고 나서 으음......\n아~ 아무것도 기억나지 않아!\n@c0@"
  sl: "@a@b＊：我梦见自己被大魔王抓走了，\n　　然后是……\n　　哎呀！什么都想不起来了！\n@c0@"
  tl: "@a@b＊：我夢見自己被大魔王抓走了，\n　　然後是……\n　　哎呀！什麼都想不起來了！\n@c0@"
18:
  en: "@a@b*: Now that my body's back in business, I should be, too! Time to sell, sell, sell!\n@c0@"
  ja: "@a@b＊「身体に　チカラが　わいてきた\n\tおかげで　また　商売が\n\tやりたくなりましたよ！\n@c0@"
  ko: "@a@b*: 몸에 힘이 솟아난\n덕분에 다시 장사를\n하고 싶어졌습니다!\n@c0@"
  sl: "@a@b＊：我感觉身体里充满了力量。\n　　多亏了你们，\n　　我又开始想做生意了！\n@c0@"
  tl: "@a@b＊：我感覺身體裡充滿了力量。\n　　多虧了你們，\n　　我又開始想做生意了！\n@c0@"
19:
  en: "@a@b*: So you can really go back and forth between this world and ours, yeah? I heard all about it.\n@c0@"
  ja: "@a@b＊「聞いたぜ。　あんたら　自由に\n\tこの世界と　もとの世界を\n\tいきき　できるんだってな。\n@c0@"
  ko: "@a@b*: 들었어. 너희는 자유롭게\n이 세계와 원래의 세계를\n왕래할 수 있다며?\n@c0@"
  sl: "@a@b＊：我听说了！\n　　你们能够在这个世界和\n　　原来的世界之间自由穿梭。\n@c0@"
  tl: "@a@b＊：我聽說了！\n　　你們能夠在這個世界和\n　　原來的世界之間自由穿梭。\n@c0@"
20:
