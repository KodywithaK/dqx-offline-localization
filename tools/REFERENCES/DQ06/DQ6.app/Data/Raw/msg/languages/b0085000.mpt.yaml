  tl: "@a@b＊：我也是一泡進溫泉\n　　就感覺渾身沒勁了。\n　　再加上這酒似乎也有點問題……\n@c0@"
60:
  en: "@a@b*: You folks must really be somethin', huh?\n@c0@"
  ja: "@a@b＊「あんたら　ただ者じゃないな。\n@c0@"
  ko: "@a@b*: 자네들은 보통내기가 아니군.\n@c0@"
  sl: "@a@b＊：你们真不是一般人。\n@c0@"
  tl: "@a@b＊：你們真不是一般人。\n@c0@"
61:
  en: "@a@b*: The drinks here were making me hallucinate. I kept seeing visions of my dearly departed!\n@c0@"
  ja: "@a@b＊「わしゃ　この酒のせいで\n\tばあさんの　まぼろしを\n\t見せられておったようじゃ。\n@c0@"
  ko: "@a@b*: 난 이 술 때문에\n할멈의 환영을\n보았나 보군.\n@c0@"
  sl: "@a@b＊：喝了酒之后，\n　　我好像见到了\n　　老婆子的幻象。\n@c0@"
  tl: "@a@b＊：喝了酒之後，\n　　我好像見到了\n　　老婆子的幻象。\n@c0@"
62:
  en: "@a@b*: Well, enough of that. My wife's right here — inside my heart!\n@c0@"
  ja: "@a@b＊「本物の　ばあさんは\n\tわしの心の中に　おるわい。\n\tふんっ。\n@c0@"
  ko: "@a@b*: 진짜 할멈은\n내 마음 속에 있지.\n그렇고 말고.\n@c0@"
  sl: "@a@b＊：真正的老婆子\n　　其实一直住在我的心里。\n　　嗯。\n@c0@"
  tl: "@a@b＊：真正的老婆子\n　　其實一直住在我的心裡。\n　　嗯。\n@c0@"
63:
  en: "@a@b*: W-Wait a minute! It's not my fault, I swear!\n@c0@"
