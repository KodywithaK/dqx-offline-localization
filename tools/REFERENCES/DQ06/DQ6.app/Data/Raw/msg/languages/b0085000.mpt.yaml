  en: "@a@b*: You're the %H0860%Xone%Yones%Z who saved those folks over in Despairia, eh? I figured as much.\n@c0@"
  ja: "@a@b＊「どうやら　その様子じゃと\n\t絶望の町の　人びとを\n\t救ってあげたようじゃの。\n@c0@"
