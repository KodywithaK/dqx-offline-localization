  ja: "@a@b＊「ここに　よく来ていた\n\t町長まで　やってたことがあるって\n\tいってた　おっさん……\n@c0@"
  ko: "@a@b*: 여기 자주 오던\n촌장까지 했다던\n아저씨 말이야......\n@c0@"
