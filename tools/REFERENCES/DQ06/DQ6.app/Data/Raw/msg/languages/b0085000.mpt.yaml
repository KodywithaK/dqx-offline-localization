  ja: "@a@b＊「すっかり身体が　なまっちまった\n\t今のオレには　まだ無理かも\n\tしれないが……\n@c0@"
  ko: "@a@b*: 몸이 완전히 굳어 버렸어.\n지금의 나에겐 아직 무리일지\n모르겠지만......\n@c0@"
  sl: "@a@b＊：我的身体还\n　　没有完全恢复，\n　　暂时可能还不行……\n@c0@"
  tl: "@a@b＊：我的身體還\n　　沒有完全恢復，\n　　暫時可能還不行……\n@c0@"
21:
  en: "@a@b*: Just give me a few weeks to train. I'm sure I'll be back in the game!\n@c0@"
  ja: "@a@b＊「なーに　きたえなおせば\n\tまだまだ　やれるさ。\n@c0@"
  ko: "@a@b*: 까짓거 다시 단련하면\n아직 쓸만하다고.\n@c0@"
