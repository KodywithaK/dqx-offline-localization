  sl: "@a@b%a002020：法尔西昂\n　　仿佛散发出了光芒呢！\n@c0@"
  tl: "@a@b%a002020：法爾西昂\n　　仿佛散發出了光芒呢！\n@c0@"
220:
  en: "@a%0%a002020@bWow...! Peggy Sue looks beautiful!\n@c0@"
  ja: "@a@b%a002020「ファルシオン……\n\tステキよ！\n@c0@"
  ko: "@a@b%a002020: 팔시온......\n멋있어!\n@c0@"
  sl: "@a@b%a002020：法尔西昂……\n　　真是好漂亮！\n@c0@"
  tl: "@a@b%a002020：法爾西昂……\n　　真是好漂亮！\n@c0@"
221:
  en: "@a%0%a002040@bSo this is the real Pegasus...\n@c0@"
  ja: "@a@b%a002040「これが　ホンモノの\n\tペガサスか……。\n@c0@"
  ko: "@a@b%a002040: 이게 진짜\n페가수스로군......\n@c0@"
  sl: "@a@b%a002040：这就是\n　　珀伽索斯的真身啊……\n@c0@"
  tl: "@a@b%a002040：這就是\n　　珀伽索斯的真身啊……\n@c0@"
222:
  en: "@a%0%a002040@bI always knew Peggy Sue was a magnificent steed...\n@c0@"
  ja: "@a@b%a002040「オレが　初めて\n\tコイツを　見たとき　すばらしい\n\t馬だと　感じたんだ。\n@c0@"
  ko: "@a@b%a002040: 나는 처음\n이 녀석을 봤을 때\n훌륭한 말이라고 느꼈지.\n@c0@"
  sl: "@a@b%a002040：我第一次\n　　见到这家伙的时候，\n　　就感到它是一匹不寻常的马。\n@c0@"
  tl: "@a@b%a002040：我第一次\n　　見到這傢伙的時候，\n　　就感到它是一匹不尋常的馬。\n@c0@"
223:
