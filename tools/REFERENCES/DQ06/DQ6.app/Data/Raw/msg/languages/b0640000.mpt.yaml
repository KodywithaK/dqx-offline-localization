  tl: "@a@b%a002010：這個魔法絨毯\n　　究竟能載著多重的東西飛行呢？\n@c0@"
17:
  en: "@a%0%a002030@bWith the flying carpet at our disposal, perhaps we can travel to previously unreachable locations.\n@c0@"
  ja: "@a@b%a002030「魔法のじゅうたんが　あれば\n\t今まで　行けなかった場所にも\n\t行けるかも　しれませんね。\n@c0@"
  ko: "@a@b%a002030: 마법의 융단이 있으면\n지금까지 가지 못했던 곳에\n갈 수도 있을 겁니다.\n@c0@"
  sl: "@a@b%a002030：有了魔法绒毯，\n　　那些以前没办法去的地方\n　　现在应该也可以去了。\n@c0@"
  tl: "@a@b%a002030：有了魔法絨毯，\n　　那些以前沒辦法去的地方\n　　現在應該也可以去了。\n@c0@"
18:
  en: "@a%0%a002020@bWe owe the Sorens more than they know, huh?\n@c0@"
  ja: "@a@b%a002020「カルベの\n\tおじいちゃん　おばあちゃん\n\tありがとう……。\n@c0@"
  ko: "@a@b%a002020: 칼베 할아버지,\n그리고 할머니.\n고마워......\n@c0@"
  sl: "@a@b%a002020：卡尔贝爷爷，\n　　还有卡尔贝奶奶，\n　　谢谢你们……\n@c0@"
  tl: "@a@b%a002020：卡爾貝爺爺，\n　　還有卡爾貝奶奶，\n　　謝謝你們……\n@c0@"
19:
  en: "@a%0%a002050@bWho'd have thought that plush rug would turn out to be a flying carpet?\n@c0@"
  ja: "@a@b%a002050「きれいなじゅうたんが\n\t魔法のじゅうたん　だったなんて\n\tおどろきです。\n@c0@"
  ko: "@a@b%a002050: 아름다운 융단이\n마법의 융단이었다니,\n놀랍습니다.\n@c0@"
  sl: "@a@b%a002050：美丽的毯子\n　　居然会是魔法绒毯，\n　　真是让人大吃一惊。\n@c0@"
  tl: "@a@b%a002050：美麗的毯子\n　　居然會是魔法絨毯，\n　　真是讓人大吃一驚。\n@c0@"
20:
  en: "@a%0%a002050@bIf Seymour Sass had known that, he might not have been willin' to give it away as a prize.\n@c0@"
  ja: "@a@b%a002050「もし　ジャンポルテさんが\n\t知ってたら　コンテストの賞品で\n\tくれなかったかも　しれませんね！\n@c0@"
  ko: "@a@b%a002050: 만약 장포르테 씨가\n알고 있었다면 경연대회 상품으로\n내주지는 않았을지도 모르죠!\n@c0@"
  sl: "@a@b%a002050：约翰波尔泰当初\n　　要是知道这件事，\n　　我们恐怕就不会得到这件奖品了！\n@c0@"
  tl: "@a@b%a002050：約翰波爾泰當初\n　　要是知道這件事，\n　　我們恐怕就不會得到這件獎品了！\n@c0@"
21:
  en: "@a%0%a002070@b(slurp) Boi-oi-oing!\n@c0@"
  ja: "@a@b%a002070「プルルルーン！\n@c0@"
  ko: "@a@b%a002070: 뽀르르르~르!\n@c0@"
  sl: "@a@b%a002070：噗噜噜噜！\n@c0@"
  tl: "@a@b%a002070：噗嚕嚕嚕！\n@c0@"
22:
  en: "@a%0%a002000@bHey, %a000090 — why don't we go and say hello to the folks back in Somnia?\n@c0@"
  ja: "@a@b%a002000「なあなあ　%a000090。\n\tとりあえず　レイドック城に　顔を\n\t見せたほうが　いいんじゃないか？\n@c0@"
  ko: "@a@b%a002000: 어이, %a000090.\n일단 레이독 성에 얼굴을\n비치고 가는 게 좋지 않을까?\n@c0@"
  sl: "@a@b%a002000：喂，%a000090。\n　　你还是先回雷多克城\n　　露个脸比较好吧？\n@c0@"
  tl: "@a@b%a002000：喂，%a000090。\n　　你還是先回雷多克城\n　　露個臉比較好吧？\n@c0@"
23:
  en: "@a%0%a002000@bLet's show 'em the real you! Oh, and we oughta head to Weaver's Peak while we're at it!\n@c0@"
  ja: "@a@b%a002000「本来の　%a000090を\n\t見てもらおうぜ。\n\tあ！　ライフコッドも　行かなきゃな。\n@c0@"
  ko: "@a@b%a002000: 진짜 %a000090%F0090%X를%Y을%Z\n보여 주자고.\n아! 라이프코드에도 들러야겠군.\n@c0@"
  sl: "@a@b%a002000：也让大家看看\n　　找回了自己的%a000090。\n　　对了！还得回一趟莱夫科德。\n@c0@"
  tl: "@a@b%a002000：也讓大家看看\n　　找回了自己的%a000090。\n　　對了！還得回一趟萊夫科德。\n@c0@"
24:
  en: "@a%0%a002010@bIt might be my imagination, but you somehow look more impressive when you walk now, %a000090.\n@c0@"
  ja: "@a@b%a002010「気のせいか\n\tふつうに　歩いていても\n\t%a000090が　大きく見えるわ。\n@c0@"
  ko: "@a@b%a002010: 똑같이 걷고 있는데도\n%a000090의 모습이\n괜히 더 커 보여.\n@c0@"
  sl: "@a@b%a002010：是心理作用吧，\n　　不过是走路而已，\n　　感觉%a000090很高大啊。\n@c0@"
  tl: "@a@b%a002010：是心理作用吧，\n　　不過是走路而已，\n　　感覺%a000090很高大啊。\n@c0@"
25:
  en: "@a%0%a002030@b%0%a000090, do you not find that the world looks somewhat different now?\n@c0@"
  ja: "@a@b%a002030「%a000090さん。\n\tいままでと　なんだか　世界が\n\tちがって見えるんじゃないですか？\n@c0@"
  ko: "@a@b%a002030: %a000090 님.\n이 세상이 지금까지와는\n좀 다르게 보이시나요?\n@c0@"
  sl: "@a@b%a002030：%a000090，\n　　你感觉眼中的世界\n　　和以前有什么不一样吗？\n@c0@"
  tl: "@a@b%a002030：%a000090，\n　　你感覺眼中的世界\n　　和以前有什麼不一樣嗎？\n@c0@"
26:
  en: "@a%0%a002020@bHow about another trip to Somnia, now that you're back to your old self and all?\n@c0@"
  ja: "@a@b%a002020「せっかく　本当の自分を\n\t取り戻したんだから　１度\n\tレイドックに　戻らない？\n@c0@"
  ko: "@a@b%a002020: 이제 진짜 자신을\n찾았으니까 레이독으로\n돌아가 보지 않을래?\n@c0@"
  sl: "@a@b%a002020：好不容易\n　　才找回了真正的自己，\n　　不回一趟雷多克城吗？\n@c0@"
  tl: "@a@b%a002020：好不容易\n　　才找回了真正的自己，\n　　不回一趟雷多克城嗎？\n@c0@"
27:
  en: "@a%0%a002020@bI bet Queen Apnea can't wait to see the real %a000090 too. Let's go!\n@c0@"
  ja: "@a@b%a002020「きっと　シェーラ様も\n\t本当の　%a000090に\n\t会いたがってると　思うな。\n@c0@"
  ko: "@a@b%a002020: 아마 시엘라 님도\n진짜 %a000090%F0090%X를%Y을%Z\n보고 싶어 하실 거야.\n@c0@"
  sl: "@a@b%a002020：谢菈王妃\n　　肯定也盼望着见到\n　　真正的%a000090呢。\n@c0@"
  tl: "@a@b%a002020：謝菈王妃\n　　肯定也盼望著見到\n　　真正的%a000090呢。\n@c0@"
