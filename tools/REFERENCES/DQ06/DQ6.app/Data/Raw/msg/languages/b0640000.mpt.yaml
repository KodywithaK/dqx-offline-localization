  en: "@a%0%a002050@bYou know, %a000090, there's somethin' a tad awkward about your movements.\n@c0@"
  ja: "@a@b%a002050「あれ？　なんだか\n\t%a000090さんの　動きが\n\tぎこちないですね。\n@c0@"
