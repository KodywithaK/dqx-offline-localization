0:
  en: "@a%0%a002000@bIt's been one adventure after another, aye? Who knew the world was so big.\n@c0@"
  ja: "@a@b%a002000「次から　次へと\n\t不思議なことが　おこるよな。\n\tまったく　世界は　広いぜ。\n@c0@"
  ko: "@a@b%a002000: 신기한 일들이\n줄줄이 일어나는군.\n세상은 참 넓다니까.\n@c0@"
  sl: "@a@b%a002000：不可思议的事情\n　　一件接着一件，\n　　真是世界之大无奇不有。\n@c0@"
  tl: "@a@b%a002000：不可思議的事情\n　　一件接著一件，\n　　真是世界之大無奇不有。\n@c0@"
1:
  en: "@a%0%a002010@bWe're now able to explore both the surface of the land and the bottom of the sea.\n@c0@"
  ja: "@a@b%a002010「これからは　地上と\n\t海の底の　両方を　しらべて\n\tまわることに　なるわね。\n@c0@"
  ko: "@a@b%a002010: 앞으로는 지상과\n바닷속을 모두 살피면서\n돌아다니게 되겠네.\n@c0@"
  sl: "@a@b%a002010：从现在起，我们要\n　　在地上和海底两边展开调查了。\n@c0@"
  tl: "@a@b%a002010：從現在起，我們要\n　　在地上和海底兩邊展開調查了。\n@c0@"
2:
  en: "@a%0%a002010@bThere's still a long way to go, however. Let's stay focused.\n@c0@"
  ja: "@a@b%a002010「まだまだ　先は\n\t長そうだけど　がんばりましょうね。\n@c0@"
  ko: "@a@b%a002010: 아직 갈 길이\n먼 것 같지만 힘내자구.\n@c0@"
  sl: "@a@b%a002010：前面的路还很长，\n　　大家继续加油吧。\n@c0@"
  tl: "@a@b%a002010：前面的路還很長，\n　　大家繼續加油吧。\n@c0@"
3:
  en: "@a%0%a002030@bExploring the ocean is no easy task, but I feel we should spend some time beneath the waves.\n@c0@"
  ja: "@a@b%a002030「海の中を　冒険するのも\n\tたいへんですが　しばらくは　あちこち\n\t見てまわったほうが　いいですよね。\n@c0@"
  ko: "@a@b%a002030: 바닷속을 모험하는 게\n힘들긴 하지만 당분간은 이곳저곳을\n열심히 돌아다니는 게 좋겠군요.\n@c0@"
  sl: "@a@b%a002030：海底的冒险虽然很危险，\n　　不过还是应该先去各个地方看看吧。\n@c0@"
  tl: "@a@b%a002030：海底的冒險雖然很危險，\n　　不過還是應該先去各個地方看看吧。\n@c0@"
4:
  en: "@a%0%a002020@bFor something that makes me so sick sometimes, the sea sure is nice to watch. It's just so...calming.\n@c0@"
  ja: "@a@b%a002020「なんだか　知らないけど\n\t海を　見てると　心が\n\t落ちついてくるのよねー。\n@c0@"
  ko: "@a@b%a002020: 왜인지는 모르겠지만\n바다를 보고 있으면 마음이\n편안해져.\n@c0@"
  sl: "@a@b%a002020：不知为什么，\n　　只要看到大海，\n　　整个心情都平静了下来。\n@c0@"
  tl: "@a@b%a002020：不知為什麼，\n　　只要看到大海，\n　　整個心情都平靜了下來。\n@c0@"
5:
  en: "@a%0%a002020@bMaybe I was a mermaid in a former life.\n@c0@"
  ja: "@a@b%a002020「ひょっとしたら　あたしって\n\tずっと昔は　人魚だったのかしら？\n@c0@"
  ko: "@a@b%a002020: 혹시 나,\n아주 옛날에는 인어였을까?\n@c0@"
  sl: "@a@b%a002020：难道在很久很久以前\n　　我也是条人鱼吗？\n@c0@"
  tl: "@a@b%a002020：難道在很久很久以前\n　　我也是條人魚嗎？\n@c0@"
6:
  en: "@a%0%a002050@bUsin' Lorelei's harp on the floatin' island will let us dive under the ocean here in the upper world.\n@c0@"
  ja: "@a@b%a002050「マーメイドハープが\n\t浮き島にも　使えると　こっちでも\n\t海にもぐれて　いいですよね。\n@c0@"
  ko: "@a@b%a002050: 인어의 하프를\n부유하는 섬에서도 쓸 수 있다면 여기서도\n바닷속으로 들어갈 수 있어서 좋을 텐데.\n@c0@"
  sl: "@a@b%a002050：人鱼竖琴要是\n　　能在浮岛上使用，\n　　让我们在这个世界也能潜水就好了。\n@c0@"
  tl: "@a@b%a002050：人魚豎琴要是\n　　能在浮島上使用，\n　　讓我們在這個世界也能潛水就好了。\n@c0@"
7:
  en: "@a%0%a002050@bBut if we go underwater here, will we fall through to the lower world!?\n@c0@"
  ja: "@a@b%a002050「あ　でも　上の世界の\n\t海にもぐると　下の世界に\n\t落ちちゃいますかね！？\n@c0@"
  ko: "@a@b%a002050: 아, 하지만 위쪽 세계에서\n바닷속으로 들어가면 아래쪽 세계로\n떨어지게 될까요!?\n@c0@"
  sl: "@a@b%a002050：不过，如果从上面的世界\n　　潜入海里的话，\n　　难道会掉到下面的世界吗？！\n@c0@"
  tl: "@a@b%a002050：不過，如果從上面的世界\n　　潛入海裡的話，\n　　難道會掉到下面的世界嗎？！\n@c0@"
8:
  en: "@a%0%a002070@b(slurp) B-Boing!\n@c0@"
  ja: "@a@b%a002070「プルンプルン。\n@c0@"
  ko: "@a@b%a002070: 뽀요용뽀용.\n@c0@"
  sl: "@a@b%a002070：噗噜噗噜。\n@c0@"
  tl: "@a@b%a002070：噗嚕噗嚕。\n@c0@"
9:
  en: "@a%0%a002000@bHmm... Now where's that island we brought back from the dead?\n@c0@"
  ja: "@a@b%a002000「うーん……。\n\tグラコスを　倒して　復活した島は\n\t海の　どのあたり　だったっけな？\n@c0@"
  ko: "@a@b%a002000: 으음......\n그라코스를 물리치고 부활한 섬은\n바다의 어디쯤에 있었더라?\n@c0@"
  sl: "@a@b%a002000：嗯……\n　　打倒古拉柯斯之后复活的那个岛\n　　到底在大海的什么地方啊？\n@c0@"
  tl: "@a@b%a002000：嗯……\n　　打倒古拉柯斯之後復活的那個島\n　　到底在大海的什麼地方啊？\n@c0@"
10:
  en: "@a%0%a002010@bHey, Sorceria is the city on that restored island, isn't it? Let's go and have a look!\n@c0@"
  ja: "@a@b%a002010「そういえば　復活した島に\n\tあった町が　カルベローナよね。\n\t行ってみましょ！\n@c0@"
  ko: "@a@b%a002010: 참, 부활한 섬에\n있었던 마을이 칼베로나였지?\n가 보자!\n@c0@"
  sl: "@a@b%a002010：如此说来，那个建在\n　　复活了的小岛上的城镇，应该就是\n　　卡尔贝罗纳了。我们快去看看！\n@c0@"
  tl: "@a@b%a002010：如此說來，那個建在\n　　復活了的小島上的城鎮，應該就是\n　　卡爾貝羅納了。我們快去看看！\n@c0@"
11:
  en: "@a%0%a002030@bWe should make haste to the island released from Gracos's seal.\n@c0@"
  ja: "@a@b%a002030「グラコスの　封印から\n\t解かれた　あの島に　急ぎましょう。\n@c0@"
  ko: "@a@b%a002030: 그라코스의 봉인에서\n풀려난 그 섬으로 어서 가 보자구요.\n@c0@"
  sl: "@a@b%a002030：我们快去那个从\n　　古拉柯斯的封印中解放出来的小岛吧。\n@c0@"
  tl: "@a@b%a002030：我們快去那個從\n　　古拉柯斯的封印中解放出來的小島吧。\n@c0@"
12:
  en: "@a%0%a002020@bI can't wait to see Sorceria!\n@c0@"
  ja: "@a@b%a002020「カルベローナ……。\n\tはやく　行ってみたいよ。\n@c0@"
  ko: "@a@b%a002020: 칼베로나......\n어서 가 보고 싶어.\n@c0@"
  sl: "@a@b%a002020：卡尔贝罗纳……\n　　我们快去看看吧。\n@c0@"
  tl: "@a@b%a002020：卡爾貝羅納……\n　　我們快去看看吧。\n@c0@"
13:
  en: "@a%0%a002050@bI'm relieved to see that giant leak in the upper world's been plugged up!\n@c0@"
  ja: "@a@b%a002050「とにかく　上の世界の\n\t大きな　水もれが　なおって\n\tよかったですね！\n@c0@"
  ko: "@a@b%a002050: 어쨌든 위쪽 세계에서\n물이 새는 큰 구멍이 막혀서\n다행이군요!\n@c0@"
  sl: "@a@b%a002050：总算是把上面世界的\n　　那个大漏水口给堵上了，实在是太好了！\n@c0@"
  tl: "@a@b%a002050：總算是把上面世界的\n　　那個大漏水口給堵上了，實在是太好了！\n@c0@"
14:
  en: "@a%0%a002070@b(slurp)\n@c0@"
  ja: "@a@b%a002070「プルプルン。\n@c0@"
  ko: "@a@b%a002070: 뽀용뽀요용.\n@c0@"
  sl: "@a@b%a002070：噗噜噗噜。\n@c0@"
  tl: "@a@b%a002070：噗嚕噗嚕。\n@c0@"
15:
  en: "@a%0%a002000@bAhoy, %a000090, let's put that fancy flying carpet of ours to good use.\n@c0@"
  ja: "@a@b%a002000「なあなあ　%a000090。\n\t手に入れた　魔法のじゅうたん\n\tどんどん　使ってみようぜ！\n@c0@"
  ko: "@a@b%a002000: 어이, %a000090.\n손에 넣은 마법의 융단을\n종종 활용해 보자고!\n@c0@"
  sl: "@a@b%a002000：喂，%a000090。\n　　咱以后要多用用咱得到的\n　　那个魔法绒毯啊！\n@c0@"
  tl: "@a@b%a002000：喂，%a000090。\n　　咱以後要多用用咱得到的\n　　那個魔法絨毯啊！\n@c0@"
16:
  en: "@a%0%a002010@bI wonder if the flying carpet can take the weight of us all and still fly...\n@c0@"
  ja: "@a@b%a002010「魔法のじゅうたんって\n\tどのくらいの　重さまで　乗せて\n\t飛べるのかしら？\n@c0@"
