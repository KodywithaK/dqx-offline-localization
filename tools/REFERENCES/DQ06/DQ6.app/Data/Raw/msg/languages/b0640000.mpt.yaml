  ko: "@a@b%a002010: 어쩌면 나의 감각도\n조금씩 바뀌어 가고 있는 걸지도\n몰라.\n@c0@"
  sl: "@a@b%a002010：一定是我的感觉\n　　也在不断地向这方面发生着变化。\n@c0@"
  tl: "@a@b%a002010：一定是我的感覺\n　　也在不斷地向這方面發生著變化。\n@c0@"
190:
  en: "@a%0%a002030@b%0%a000090, do you recall the inscriptions on the legendary equipment?\n@c0@"
  ja: "@a@b%a002030「%a000090さん\n\t伝説の武具に　きざまれた　しるしを\n\tおぼえていますか？\n@c0@"
  ko: "@a@b%a002030: %a000090 님,\n전설의 장비에 새겨진 문양을\n기억하십니까?\n@c0@"
  sl: "@a@b%a002030：%a000090，\n　　你还记得传说中的武具上\n　　刻着的印记吗？\n@c0@"
  tl: "@a@b%a002030：%a000090，\n　　你還記得傳說中的武具上\n　　刻著的印記嗎？\n@c0@"
191:
  en: "@a%0%a002030@bThey will doubtless direct us to our true path.\n@c0@"
  ja: "@a@b%a002030「この　しるしが\n\t私たちの　進むべき道を\n\tさししめしてくれるはずです。\n@c0@"
  ko: "@a@b%a002030: 이 문양이\n우리가 가야 할 길을\n알려줄 겁니다.\n@c0@"
  sl: "@a@b%a002030：这些印记\n　　一定能够指引着\n　　我们找到前进的道路。\n@c0@"
  tl: "@a@b%a002030：這些印記\n　　一定能夠指引著\n　　我們找到前進的道路。\n@c0@"
192:
  en: "@a%0%a002020@bWho knows how long it'll take me to find myself...\n@c0@"
  ja: "@a@b%a002020「あたしは　まだ\n\t自分さがしの旅が　つづきそう。\n@c0@"
  ko: "@a@b%a002020: 난 나를 찾는 여행을\n계속해야 할 것 같아.\n@c0@"
  sl: "@a@b%a002020：我今后恐怕\n　　还会继续踏上寻找自己的旅程。\n@c0@"
  tl: "@a@b%a002020：我今後恐怕\n　　還會繼續踏上尋找自己的旅程。\n@c0@"
193:
  en: "@a%0%a002020@bBut for now, my home is with you guys.\n@c0@"
  ja: "@a@b%a002020「でも　今は\n\tこのパーティが　あたしの\n\t居場所だよね。\n@c0@"
  ko: "@a@b%a002020: 하지만 지금은\n모두가 함께하는 이 팀이\n내가 있을 곳이겠지.\n@c0@"
  sl: "@a@b%a002020：不过现在的我\n　　就是这个团队的一分子。\n@c0@"
  tl: "@a@b%a002020：不過現在的我\n　　就是這個團隊的一分子。\n@c0@"
194:
  en: "@a%0%a002020@bWe sure have a lot to thank Welda for, don't we?\n@c0@"
  ja: "@a@b%a002020「サリイさんに\n\t感謝しないとね。\n@c0@"
  ko: "@a@b%a002020: 샐리 씨에게\n고마워해야 해.\n@c0@"
  sl: "@a@b%a002020：真是太谢谢萨利伊了。\n@c0@"
  tl: "@a@b%a002020：真是太謝謝薩利伊了。\n@c0@"
195:
  en: "@a%0%a002020@bIf we ever do find her dad, we oughta tell her, post-haste! Right, %a000090?\n@c0@"
  ja: "@a@b%a002020「だから　%a000090\n\tサリイさんの　お父さんを　みつけたら\n\tすぐに　知らせてあげようね。\n@c0@"
  ko: "@a@b%a002020: 그러니까 %a000090,\n샐리 씨의 아버지를 찾으면\n바로 알려 주자구.\n@c0@"
  sl: "@a@b%a002020：%a000090，\n　　所以说，一旦知道了萨利伊父亲的下落，\n　　必须要尽快告诉她才行。\n@c0@"
  tl: "@a@b%a002020：%a000090，\n　　所以說，一旦知道了薩利伊父親的下落，\n　　必須要儘快告訴她才行。\n@c0@"
196:
  en: "@a%0%a002020@bWe sure have a lot to thank Welda for, don't we?\n@c0@"
  ja: "@a@b%a002020「サリイさんに\n\t感謝しないとね。\n@c0@"
  ko: "@a@b%a002020: 샐리 씨에게\n고마워해야 해.\n@c0@"
  sl: "@a@b%a002020：真是太谢谢萨利伊了。\n@c0@"
  tl: "@a@b%a002020：真是太謝謝薩利伊了。\n@c0@"
197:
  en: "@a%0%a002020@bWe'd probably better not tell her what happened to her dad, though.\n@c0@"
  ja: "@a@b%a002020「でも　お父さんのことは\n\t教えないほうが　いいよね。\n@c0@"
  ko: "@a@b%a002020: 하지만 아버지에 대한 건\n알려 주지 않는 게 좋겠어.\n@c0@"
  sl: "@a@b%a002020：不过，还是\n　　不要把父亲的事告诉她比较好。\n@c0@"
  tl: "@a@b%a002020：不過，還是\n　　不要把父親的事告訴她比較好。\n@c0@"
198:
  en: "@a%0%a002050@b%0%a000090, when you're all dressed up in that legendary get-up, you look spiffin'!\n@c0@"
  ja: "@a@b%a002050「伝説の武具を\n\t身に　まとった　%a000090さんは\n\tかなり　かっこいいですよ！\n@c0@"
  ko: "@a@b%a002050: 전설의 장비를\n착용한 %a000090 님은\n제법 멋있는데요!\n@c0@"
  sl: "@a@b%a002050：%a000090把\n　　传说中的武具穿上后，\n　　看上去还真帅！\n@c0@"
  tl: "@a@b%a002050：%a000090把\n　　傳說中的武具穿上後，\n　　看上去還真帥！\n@c0@"
199:
  en: "@a%0%a002050@bWell, we've got all the legendary gear...\n@c0@"
  ja: "@a@b%a002050「全ての　伝説の武具を\n\tそろえた　今……。\n@c0@"
  ko: "@a@b%a002050: 모든 전설의 장비를\n갖춘 지금......\n@c0@"
  sl: "@a@b%a002050：传说中的武具\n　　已经全都找齐了，只剩下……\n@c0@"
  tl: "@a@b%a002050：傳說中的武具\n　　已經全都找齊了，只剩下……\n@c0@"
200:
  en: "@a%0%a002050@bNow we just have to see where it'll lead us.\n@c0@"
  ja: "@a@b%a002050「どんな　答えが出るのか\n\t楽しみですね。\n@c0@"
  ko: "@a@b%a002050: 어떤 해답이 나올지\n기대되는군요.\n@c0@"
  sl: "@a@b%a002050：谜题的答案会是什么呢？\n　　真令人期待啊。\n@c0@"
  tl: "@a@b%a002050：謎題的答案會是什麼呢？\n　　真令人期待啊。\n@c0@"
201:
  en: "@a%0%a002070@b(slurp) Boi-oing!\n@c0@"
  ja: "@a@b%a002070「プル　プルルン！\n@c0@"
  ko: "@a@b%a002070: 뽀용 뽀요요용!\n@c0@"
  sl: "@a@b%a002070：噗噜，噗噜噜！\n@c0@"
  tl: "@a@b%a002070：噗嚕，噗嚕嚕！\n@c0@"
202:
  en: "@a%0%a002070@bBoing.\n@c0@"
  ja: "@a@b%a002070「プルルン。\n@c0@"
  ko: "@a@b%a002070: 뽀요용.\n@c0@"
  sl: "@a@b%a002070：噗噜噜。\n@c0@"
  tl: "@a@b%a002070：噗嚕嚕。\n@c0@"
203:
  en: "@a%0%a002000@bAlright! Let's hurry up 'n' wrangle Pegasus!\n@c0@"
  ja: "@a@b%a002000「よーしっ！\n\tさっさと　ペガサスを\n\tみつけだそうぜ！\n@c0@"
  ko: "@a@b%a002000: 좋았어!\n어서 페가수스를\n찾아내자고!\n@c0@"
  sl: "@a@b%a002000：好嘞！\n　　赶紧去把珀伽索斯\n　　找出来吧！\n@c0@"
  tl: "@a@b%a002000：好嘞！\n　　趕緊去把珀伽索斯\n　　找出來吧！\n@c0@"
204:
  en: "@a%0%a002010@bLet's hurry, before the Archfiend gets in our way!\n@c0@"
  ja: "@a@b%a002010「大魔王の　ジャマが\n\t入らないうちに　目的を\n\tはたしましょ！\n@c0@"
  ko: "@a@b%a002010: 대마왕의 방해가\n시작되기 전에 목적을\n이뤄야 해!\n@c0@"
  sl: "@a@b%a002010：趁着大魔王没来捣乱，\n　　赶快去把事情做完吧！\n@c0@"
  tl: "@a@b%a002010：趁著大魔王沒來搗亂，\n　　趕快去把事情做完吧！\n@c0@"
205:
  en: "@a%0%a002030@bWe learnt much from Lord Zenith, though no shortage of mysteries yet remain.\n@c0@"
  ja: "@a@b%a002030「ゼニス王の　お話で\n\tいろいろなことが　わかったとはいえ\n\tまだまだ　ナゾだらけですね。\n@c0@"
  ko: "@a@b%a002030: 제니스 왕의 말씀 덕분에\n다양한 정보를 얻게 되었지만\n아직 풀리지 않은 것들이 많습니다.\n@c0@"
  sl: "@a@b%a002030：听了泽尼斯王的话，\n　　虽然知道了不少事情，\n　　但是剩下的谜题也还很多。\n@c0@"
  tl: "@a@b%a002030：聽了澤尼斯王的話，\n　　雖然知道了不少事情，\n　　但是剩下的謎題也還很多。\n@c0@"
206:
  en: "@a%0%a002020@bI hope Pegasus is okay...\n@c0@"
  ja: "@a@b%a002020「ペガサス　元気で\n\tいるのかな……。\n@c0@"
  ko: "@a@b%a002020: 페가수스, 건강하게\n잘 지내고 있을까......\n@c0@"
  sl: "@a@b%a002020：珀伽索斯\n　　不会有事吧……\n@c0@"
  tl: "@a@b%a002020：珀伽索斯\n　　不會有事吧……\n@c0@"
207:
  en: "@a%0%a002040@bThe Archfiend thinks he's got Pegasus safely sealed away. Let's give him a nasty surprise!\n@c0@"
  ja: "@a@b%a002040「ペガサスの　チカラを\n\t封印して　安心している\n\t大魔王の　ハナを　あかそうぜ！\n@c0@"
  ko: "@a@b%a002040: 페가수스의 힘을\n봉인하고서 안심하고 있을\n대마왕의 코를 납작하게 만들어 주자고!\n@c0@"
  sl: "@a@b%a002040：大魔王封印了\n　　珀伽索斯的力量后就安心了，\n　　我们必须要攻其不备才行！\n@c0@"
  tl: "@a@b%a002040：大魔王封印了\n　　珀伽索斯的力量後就安心了，\n　　我們必須要攻其不備才行！\n@c0@"
208:
  en: "@a%0%a002050@bCan't wait to meet old Pegasus!\n@c0@"
  ja: "@a@b%a002050「ペガサス……\n\tはやく　出会ってみたいものですね。\n@c0@"
  ko: "@a@b%a002050: 페가수스......\n빨리 만나 보고 싶군요.\n@c0@"
  sl: "@a@b%a002050：珀伽索斯……\n　　真想快些见到它啊。\n@c0@"
  tl: "@a@b%a002050：珀伽索斯……\n　　真想快些見到它啊。\n@c0@"
209:
  en: "@a%0%a002060@b(snarl) %0%a002060...fight...hard...! (spit)\n@c0@"
  ja: "@a@b%a002060「私も…がんばる……。\n\tギルル……ン……。\n@c0@"
  ko: "@a@b%a002060: 나도...최선을 다한다......\n캬르르......릉......\n@c0@"
  sl: "@a@b%a002060：我也会……努力的……\n　　咕噜噜……噜……\n@c0@"
  tl: "@a@b%a002060：我也會……努力的……\n　　咕嚕嚕……嚕……\n@c0@"
210:
  en: "@a%0%a002070@bBoing.\n@c0@"
  ja: "@a@b%a002070「プルルン。\n@c0@"
  ko: "@a@b%a002070: 뽀요용.\n@c0@"
  sl: "@a@b%a002070：噗噜噜。\n@c0@"
  tl: "@a@b%a002070：噗嚕嚕。\n@c0@"
211:
  en: "@a%0%a002000@bWe better get Pegasus back to Lord Zenith on the double, aye?\n@c0@"
  ja: "@a@b%a002000「なには　ともあれ\n\tはやいとこ　ゼニス王の　ところに\n\tペガサスを　つれていかなくちゃ！\n@c0@"
  ko: "@a@b%a002000: 무슨 일이 있어도\n어서 제니스 왕이 있는 곳으로\n페가수스를 끌고 가야 해!\n@c0@"
  sl: "@a@b%a002000：不论如何，\n　　必须尽快将珀伽索斯\n　　带到泽尼斯王那里！\n@c0@"
  tl: "@a@b%a002000：不論如何，\n　　必須儘快將珀伽索斯\n　　帶到澤尼斯王那裡！\n@c0@"
212:
  en: "@a%0%a002000@bPeggy Sue? OUR Peggy Sue...? Avast!\n@c0@"
  ja: "@a@b%a002000「ファルシオンが……\n\tオレたちの　ファルシオンが……\n\tスゴイぜ！\n@c0@"
  ko: "@a@b%a002000: 팔시온이......\n우리의 팔시온이......\n대단해!\n@c0@"
  sl: "@a@b%a002000：法尔西昂是……\n　　咱们的法尔西昂是……\n　　太厉害了！\n@c0@"
  tl: "@a@b%a002000：法爾西昂是……\n　　咱們的法爾西昂是……\n　　太厲害了！\n@c0@"
213:
  en: "@a%0%a002010@bPeggy Sue is always looking after us.\n@c0@"
  ja: "@a@b%a002010「ファルシオンは　きっと\n\t私たちのことを　ずっと　見守って\n\tくれていたのね。\n@c0@"
  ko: "@a@b%a002010: 팔시온은 우리를\n줄곧 지켜보고\n있었던 거야.\n@c0@"
  sl: "@a@b%a002010：法尔西昂肯定\n　　一直都在守护着我们。\n@c0@"
  tl: "@a@b%a002010：法爾西昂肯定\n　　一直都在守護著我們。\n@c0@"
214:
  en: "@a%0%a002010@bThank you, Peggy Sue.\n@c0@"
  ja: "@a@b%a002010「ありがとう……\n\tファルシオン。\n@c0@"
  ko: "@a@b%a002010: 고마워......\n팔시온.\n@c0@"
  sl: "@a@b%a002010：谢谢你……\n　　法尔西昂。\n@c0@"
  tl: "@a@b%a002010：謝謝你……\n　　法爾西昂。\n@c0@"
215:
  en: "@a%0%a002010@bI wonder if she can start flying immediately...\n@c0@"
  ja: "@a@b%a002010「さっそく　空を\n\t飛んでくれるかしら？\n@c0@"
  ko: "@a@b%a002010: 바로 하늘을\n날 수 있으려나?\n@c0@"
  sl: "@a@b%a002010：马上就可以\n　　带着我们飞到天上了吧？\n@c0@"
  tl: "@a@b%a002010：馬上就可以\n　　帶著我們飛到天上了吧？\n@c0@"
216:
  en: "@a%0%a002030@bAll that remains is to enter the realm of the Archfiend.\n@c0@"
  ja: "@a@b%a002030「もう　あとは\n\t大魔王のところへ\n\tのりこむだけですね。\n@c0@"
  ko: "@a@b%a002030: 이제\n대마왕이 있는 곳으로\n잠입하는 일만 남았군요.\n@c0@"
  sl: "@a@b%a002030：接下来\n　　就只剩下去大魔王的老巢了。\n@c0@"
  tl: "@a@b%a002030：接下來\n　　就只剩下去大魔王的老巢了。\n@c0@"
217:
  en: "@a%0%a002030@bI must confess to being a touch jittery...\n@c0@"
  ja: "@a@b%a002030「ちょっと　緊張して\n\tきました……。\n@c0@"
  ko: "@a@b%a002030: 조금\n긴장되기 시작했습니다......\n@c0@"
  sl: "@a@b%a002030：突然感觉有些紧张……\n@c0@"
  tl: "@a@b%a002030：突然感覺有些緊張……\n@c0@"
218:
  en: "@a%0%a002030@bNow we're able to break through into the realm of the Archfiend!\n@c0@"
  ja: "@a@b%a002030「これで　大魔王の　結界を\n\tやぶることが　できますね！\n@c0@"
  ko: "@a@b%a002030: 이제 대마왕의 결계를\n깨뜨릴 수 있겠군요!\n@c0@"
  sl: "@a@b%a002030：这下终于可以\n　　冲破大魔王布下的结界了！\n@c0@"
  tl: "@a@b%a002030：這下終於可以\n　　衝破大魔王布下的結界了！\n@c0@"
219:
  en: "@a%0%a002020@bIs it me, or is Peggy Sue a lot shinier than she used to be?\n@c0@"
  ja: "@a@b%a002020「なんだか　ファルシオンが\n\tちょっと　まぶしいよ！\n@c0@"
