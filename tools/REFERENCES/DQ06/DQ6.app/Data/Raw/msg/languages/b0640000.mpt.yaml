  tl: "@a@b%a002030：海底世界\n　　也是我們的世界的\n　　重要組成部分啊。\n@c0@"
256:
  en: "@a%0%a002020@bSo that's why we never saw any fish down here. Gracos must've scared them away.\n@c0@"
