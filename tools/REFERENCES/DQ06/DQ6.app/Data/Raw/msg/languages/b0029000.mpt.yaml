  tl: "@a@b＊：呵呵呵。沒想到\n　　還有這麼年輕的小姑娘\n　　喜歡老夫啊。\n@c0@"
14:
  en: "@a@b*: If this is a dream, I don't want to wake up! Heh heh.\n@c0@"
