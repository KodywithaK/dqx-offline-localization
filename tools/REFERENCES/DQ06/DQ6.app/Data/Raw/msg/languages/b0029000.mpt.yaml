0:
  en: "@a@b*: I have every faith that with the grace of the Goddess, Prince Howard will prove a worthy ruler.\n@c0@"
  ja: "@a@b＊「ホルス王子も　かならずや\n\t立派な王となり　国を\n\tおさめて　ゆくであろう。\n@c0@"
  ko: "@a@b*: 홀스 왕자도 틀림없이\n훌륭한 왕이 되어 이 나라를\n다스릴 것이야.\n@c0@"
  sl: "@a@b＊：荷尔斯王子一定能\n　　成为出色的国王，\n　　统治这个国家的。\n@c0@"
  tl: "@a@b＊：荷爾斯王子一定能\n　　成為出色的國王，\n　　統治這個國家的。\n@c0@"
1:
  en: "@a@b*: Welcome to Clearvale! Our town slogan is ‘Eye the skies for the bed that flies!’ \n@c0@"
  ja: "@a@b＊「ここは　空とぶベッドで有名な\n\tクリアベールの町よ。\n@c0@"
  ko: "@a@b*: 여긴 하늘을 나는 침대로 유명한\n클리어베일 마을이야.\n@c0@"
  sl: "@a@b＊：这里就是以飞天床闻名的\n　　克里亚贝尔镇。\n@c0@"
  tl: "@a@b＊：這裡就是以飛天床聞名的\n　　克里亞貝爾鎮。\n@c0@"
2:
  en: "@a@b*: Good day! Come to see the flying bed, have you?\n@c0@"
  ja: "@a@b＊「やあ　あなたも　空とぶベッドを\n\t見に来たんですか？\n@c0@"
  ko: "@a@b*: 여어, 당신도 하늘을 나는 침대를\n보러 온 겁니까?\n@c0@"
  sl: "@a@b＊：哎呀，你也是来\n　　看飞天床的吗？\n@c0@"
  tl: "@a@b＊：哎呀，你也是來\n　　看飛天床的嗎？\n@c0@"
3:
  en: "@a@b*: Oh, shucks. I hate to be a wet blanket, but we haven't had a bed sighting in quite a spell.\n@c0@"
  ja: "@a@b＊「でも　残念ですね。　最近では\n\tなぜか　空とぶベッドを\n\t見かけなくなってしまったんです。\n@c0@"
  ko: "@a@b*: 이걸 어쩌나. 최근에는 무슨\n이유에선지 하늘을 나는 침대를\n볼 수가 없게 됐습니다.\n@c0@"
  sl: "@a@b＊：不过很遗憾。\n　　最近不知道为什么，\n　　看不到飞天床了呢。\n@c0@"
  tl: "@a@b＊：不過很遺憾。\n　　最近不知道為什麼，\n　　看不到飛天床了呢。\n@c0@"
4:
  en: "@a@b*: That's just as well. It's been quite a spell since we saw it.\n㈡\n*: But what a sight it is — a soaring spectacle of bedspreads and pillows!\n@c0@"
  ja: "@a@b＊「昔は　この町の空を　フワフワと\n\tベッドが　飛んでいるのを\n\tよく　見かけたものです。\n@c0@"
  ko: "@a@b*: 옛날에는 이 마을 하늘에\n침대가 둥둥 떠 다니는 모습이\n자주 보였습니다.\n@c0@"
  sl: "@a@b＊：过去经常可以看见\n　　有一张床从这个镇子的空中\n　　缓缓飞过呢。\n@c0@"
  tl: "@a@b＊：過去經常可以看見\n　　有一張床從這個鎮子的空中\n　　緩緩飛過呢。\n@c0@"
5:
  en: "@a@b*: Word got out, and our little town became quite the tourist destination. That bed is our bread and butter!\n@c0@"
  ja: "@a@b＊「それで　おもしろがって\n\tほかの町から　空とぶベッドを\n\t見に来るひとも　いたんですよ。\n@c0@"
  ko: "@a@b*: 그게 재밌어서\n다른 마을에서 하늘을 나는 침대를\n보러 오는 사람도 있었죠.\n@c0@"
  sl: "@a@b＊：有不少人对此感兴趣，\n　　从别的镇子到这里\n　　来看飞天床呢。\n@c0@"
  tl: "@a@b＊：有不少人對此感興趣，\n　　從別的鎮子到這裡\n　　來看飛天床呢。\n@c0@"
6:
  en: "@a@b*: Hark! I have journeyed many leagues to this hamlet in search of the truth behind tales of a bed that flies.\n@c0@"
  ja: "@a@b＊「私は　空とぶベッドの\n\tウワサを　聞いて\n\tこの町に　やって来ました。\n@c0@"
  ko: "@a@b*: 저는 하늘을 나는 침대에 대한\n소문을 듣고\n이 마을을 찾아왔습니다.\n@c0@"
  sl: "@a@b＊：我听说了飞天床的传说，\n　　才到这个镇子来的。\n@c0@"
  tl: "@a@b＊：我聽說了飛天床的傳說，\n　　才到這個鎮子來的。\n@c0@"
7:
  en: "@a@b*: ‘Forsooth,’ I figured, ‘only a fairy-tale village would play host to such a romantic spectacle.’\n@c0@"
  ja: "@a@b＊「そんな　ロマンチックなことが\n\tおこる町だったら　きっと\n\tステキな所だろうと思いましてね。\n@c0@"
  ko: "@a@b*: 그런 로맨틱한 일이\n일어나는 마을이라면 분명\n멋진 곳일 거라 생각했죠.\n@c0@"
  sl: "@a@b＊：这个镇子会发生\n　　这么浪漫的事情，\n　　一定是个很棒的地方。\n@c0@"
  tl: "@a@b＊：這個鎮子會發生\n　　這麼浪漫的事情，\n　　一定是個很棒的地方。\n@c0@"
8:
  en: "@a@b*: Alas, the magical mystery bed is missing in action, and this town's a bit of a bore. 'Tis the story of my life...\n@c0@"
  ja: "@a@b＊「でも　残念なことに　ある時から\n\tぷっつりと　空とぶベッドが\n\t見られなくなったそうです。\n@c0@"
  ko: "@a@b*: 하지만 아쉽게도 어느 순간부터\n하늘을 나는 침대가\n통 보이질 않게 됐다네요.\n@c0@"
  sl: "@a@b＊：不过遗憾的是，\n　　据说从不知道什么时候开始，\n　　就再也见不到飞天床了。\n@c0@"
  tl: "@a@b＊：不過遺憾的是，\n　　據說從不知道什麼時候開始，\n　　就再也見不到飛天床了。\n@c0@"
9:
  en: "@a@b*: I admit it: I'm the biggest flying-bed fanatic around.\n@c0@"
  ja: "@a@b＊「私も　空とぶベッドのウワサを聞き\n\tこの町に　やってきたのですが……。\n@c0@"
  ko: "@a@b*: 저도 하늘을 나는 침대 소문을 듣고\n이 마을을 찾아왔는데......\n@c0@"
  sl: "@a@b＊：我也是听说了飞天床的传说，\n　　才到这个镇子来的……\n@c0@"
  tl: "@a@b＊：我也是聽說了飛天床的傳說，\n　　才到這個鎮子來的……\n@c0@"
10:
  en: "@a@b*: But I'll have to find a new obsession if I don't catch a glimpse of it soon...\n@c0@"
  ja: "@a@b＊「いやはや　残念ですよ。\n@c0@"
  ko: "@a@b*: 얼마나 아쉬운지 모릅니다.\n@c0@"
  sl: "@a@b＊：哎呀，真是遗憾。\n@c0@"
  tl: "@a@b＊：哎呀，真是遺憾。\n@c0@"
11:
  en: "@a@b*: I know it's absolutely scandalous, but what can I say? I cannot stop thinking about this older man.\n@c0@"
  ja: "@a@b＊「わたし　自分でも\n\tよくわからないんだけど\n\tなぜか　このひとに　ひかれるの。\n@c0@"
  ko: "@a@b*: 나 말이야, 스스로도\n이해가 안 되지만\n왠지 이 사람에게 끌려.\n@c0@"
