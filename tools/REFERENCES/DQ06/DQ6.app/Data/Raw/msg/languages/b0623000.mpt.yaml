166:
  en: "@a%0%a002000@bHavin' all the money in the world don't mean squat when that world's the dread realm, aye?\n@c0@"
  ja: "@a@b%a002000「そりゃ　いくら　金持ちでも\n\tこの世界に　しばられてるかぎり\n\t居心地は　よくないだろうな。\n@c0@"
  ko: "@a@b%a002000: 아무리 부자라도\n이 세계에 묶여 있는 한\n마음 편히 있지는 못하겠지.\n@c0@"
  sl: "@a@b%a002000：即使有再多的钱，\n　　终归是被束缚在这个世界，\n　　能开心就怪了。\n@c0@"
  tl: "@a@b%a002000：即使有再多的錢，\n　　終歸是被束縛在這個世界，\n　　能開心就怪了。\n@c0@"
167:
  en: "@a%0%a002010@bI've no idea what this Gallows Moor could be like...\n@c0@"
  ja: "@a@b%a002010「牢ごくの町……\n\tどんなところなのか　よく\n\tわからないけれど……\n@c0@"
  ko: "@a@b%a002010: 감옥 마을......\n어떤 곳인지 잘\n모르겠지만......\n@c0@"
  sl: "@a@b%a002010：牢狱之镇……\n　　虽然不知道那里\n　　是个什么地方……\n@c0@"
  tl: "@a@b%a002010：牢獄之鎮……\n　　雖然不知道那裡\n　　是個什麼地方……\n@c0@"
168:
  en: "@a%0%a002010@bBut it's plain to see that everyone here is simply terrified of the place.\n@c0@"
  ja: "@a@b%a002010「この町の　人たちに\n\tとても　おそれられている\n\tということだけは　わかったわ。\n@c0@"
  ko: "@a@b%a002010: 이 마을 사람들이\n겁을 먹고 있었다는\n것만은 알았어.\n@c0@"
  sl: "@a@b%a002010：不过很显然，\n　　这个镇上的人们\n　　非常害怕那里。\n@c0@"
  tl: "@a@b%a002010：不過很顯然，\n　　這個鎮上的人們\n　　非常害怕那裡。\n@c0@"
169:
  en: "@a%0%a002020@bI guess a dull life in this world is better than no life at all...\n@c0@"
  ja: "@a@b%a002020「退屈する　余裕があるだけ\n\tこの世界では　めぐまれている\n\tほうでしょうね。\n@c0@"
  ko: "@a@b%a002020: 심심할 정도로 여유가 있다는 건\n이 세계에선 축복받은\n일일지 몰라.\n@c0@"
  sl: "@a@b%a002020：在这个世界\n　　唯一的好处就是\n　　有一堆无聊的时间可以打发。\n@c0@"
  tl: "@a@b%a002020：在這個世界\n　　唯一的好處就是\n　　有一堆無聊的時間可以打發。\n@c0@"
170:
  en: "@a%0%a002030@bWealth is no defence against the Archfiend.\n@c0@"
  ja: "@a@b%a002030「あいてが\n\t大魔王ですから　お金など\n\t意味のないものでしょう……。\n@c0@"
  ko: "@a@b%a002030: 상대가\n대마왕이니까 돈 같은 건\n의미가 없겠지요......\n@c0@"
  sl: "@a@b%a002030：对手可是大魔王，\n　　有再多金银财宝也没意义啊……\n@c0@"
  tl: "@a@b%a002030：對手可是大魔王，\n　　有再多金銀財寶也沒意義啊……\n@c0@"
171:
  en: "@a%0%a002050@bGallows Moor means certain death, does it? Blimey!\n@c0@"
  ja: "@a@b%a002050「牢ごくの町って\n\t中に　入っただけで\n\t死んじゃうんですか！？\n@c0@"
  ko: "@a@b%a002050: 감옥 마을에는\n들어가기만 하면\n죽어버리는 걸까요!?\n@c0@"
  sl: "@a@b%a002050：牢狱之镇，\n　　是说人只要进去\n　　就会死在里面？！\n@c0@"
  tl: "@a@b%a002050：牢獄之鎮，\n　　是說人只要進去\n　　就會死在裡面？！\n@c0@"
172:
  en: "@a%0%a002040@bRich folks make me sick — no matter what world they're in.\n@c0@"
  ja: "@a@b%a002040「ふん。\n\tどこの　世界でも　金持ちの\n\t考えることは　くだらないな。\n@c0@"
  ko: "@a@b%a002040: 흥.\n어느 세계나 부자들의\n생각은 시시하군.\n@c0@"
  sl: "@a@b%a002040：哼。\n　　无论哪个世界的有钱人，\n　　整天想的也都是些无聊事。\n@c0@"
  tl: "@a@b%a002040：哼。\n　　無論哪個世界的有錢人，\n　　整天想的也都是些無聊事。\n@c0@"
173:
  en: "@a%0%a002060@b(snarl) Gallows Moor... Sounds scary... (spit)\n@c0@"
  ja: "@a@b%a002060「私も…ろうや…は…きらい。\n@c0@"
  ko: "@a@b%a002060: 나도...감옥...은...싫다.\n@c0@"
  sl: "@a@b%a002060：我也……讨厌……监狱。\n@c0@"
  tl: "@a@b%a002060：我也……討厭……監獄。\n@c0@"
174:
  en: "@a%0%a002070@b(slurp)\n@c0@"
  ja: "@a@b%a002070「ルルププルッ！\n@c0@"
  ko: "@a@b%a002070: 르르 뽀뽀요용!\n@c0@"
  sl: "@a@b%a002070：噜噜噗噗噜！\n@c0@"
  tl: "@a@b%a002070：嚕嚕噗噗嚕！\n@c0@"
175:
  en: "@a%0%a002000@bThe wealthiest man in town, aye? Hmm... How rich are we talkin' here, do ya think?\n@c0@"
  ja: "@a@b%a002000「この町　１番の　お金持ち？\n\tふーん…　どのくらいの　お金を\n\t持ってるんだろうな。\n@c0@"
  ko: "@a@b%a002000: 이 마을에서 가장 부자?\n흐음... 돈을 얼마나\n가지고 있는 걸까?\n@c0@"
  sl: "@a@b%a002000：这个镇上的头号富豪？\n　　嗯……那是富到了什么程度呢？\n@c0@"
  tl: "@a@b%a002000：這個鎮上的頭號富豪？\n　　嗯……那是富到了什麼程度呢？\n@c0@"
176:
  en: "@a%0%a002010@bI wonder how he made his fortune. Anyone who strikes it rich in a town like this can't help but be a little dubious...\n@c0@"
  ja: "@a@b%a002010「どうやって　そんなに\n\tお金持ちに　なったのかしらね。\n\t欲望の町だけに　あやしいわね。\n@c0@"
  ko: "@a@b%a002010: 어떻게 그렇게\n부자가 될 수 있었을까?\n욕망의 마을이다 보니 좀 수상한데.\n@c0@"
  sl: "@a@b%a002010：怎样才能这么有钱呢？\n　　就欲望之镇而言，这的确很可疑。\n@c0@"
  tl: "@a@b%a002010：怎樣才能這麼有錢呢？\n　　就欲望之鎮而言，這的確很可疑。\n@c0@"
177:
  en: "@a%0%a002020@bThe wealthiest? In this greedy town? Something tells me he didn't do it honestly.\n@c0@"
  ja: "@a@b%a002020「悪いことしてなきゃ\n\t何でも　１番って　いうのは\n\tいいことだけどね。\n@c0@"
  ko: "@a@b%a002020: 나쁜 짓만 안 하면\n뭘 하든 1등은\n좋은 거지만 말이야.\n@c0@"
  sl: "@a@b%a002020：只要不是做坏事，\n　　任何事情能当第一名\n　　都还是挺不错的。\n@c0@"
  tl: "@a@b%a002020：只要不是做壞事，\n　　任何事情能當第一名\n　　都還是挺不錯的。\n@c0@"
178:
  en: "@a%0%a002030@bHmm... This place is not as opulent as I expected.\n@c0@"
  ja: "@a@b%a002030「おやしき　と　いうほど\n\tぜいたくな　感じは　しませんね。\n@c0@"
  ko: "@a@b%a002030: 저택이라 불릴 만큼\n호화롭지는 않군요.\n@c0@"
  sl: "@a@b%a002030：虽说是宅邸，\n　　可也没有那般奢华嘛。\n@c0@"
  tl: "@a@b%a002030：雖說是宅邸，\n　　可也沒有那般奢華嘛。\n@c0@"
179:
  en: "@a%0%a002050@bI wonder if he's got stacks of gold gatherin' dust in there.\n@c0@"
  ja: "@a@b%a002050「どっかに　お金が\n\tくさってたり　しないですかね。\n@c0@"
  ko: "@a@b%a002050: 어딘가에서 돈이\n썩고 있지는 않을까요?\n@c0@"
  sl: "@a@b%a002050：估计这人钱多得\n　　只能放在某个地方烂掉了吧。\n@c0@"
  tl: "@a@b%a002050：估計這人錢多得\n　　只能放在某個地方爛掉了吧。\n@c0@"
180:
  en: "@a%0%a002040@bHe may be the wealthiest man in town, but I'll bet he's not the most popular.\n@c0@"
  ja: "@a@b%a002040「この町の　金持ちじゃ\n\tさぞかし　人から　うらまれてたりも\n\tするんだろうな。\n@c0@"
  ko: "@a@b%a002040: 이 마을에서 부자는 분명\n사람들한테 원망을\n받기도 할 거야.\n@c0@"
  sl: "@a@b%a002040：这个镇上的富翁\n　　肯定全都生活在其他人的\n　　愤恨之中吧。\n@c0@"
  tl: "@a@b%a002040：這個鎮上的富翁\n　　肯定全都生活在其他人的\n　　憤恨之中吧。\n@c0@"
181:
  en: "@a%0%a002060@b(snarl) Morgan Gainmore...live here...? (spit)\n@c0@"
  ja: "@a@b%a002060「ここ…モルガンの…\n\tやしき…か……。\n@c0@"
  ko: "@a@b%a002060: 여기...모건의...\n저택...인가......\n@c0@"
  sl: "@a@b%a002060：这里是……摩根的……\n　　宅邸……吗？\n@c0@"
  tl: "@a@b%a002060：這裡是……摩根的……\n　　宅邸……嗎？\n@c0@"
182:
  en: "@a%0%a002070@bBoing! (jiggle)\n@c0@"
  ja: "@a@b%a002070「プルプルーッ！\n@c0@"
  ko: "@a@b%a002070: 뽀용뽀요용~!\n@c0@"
  sl: "@a@b%a002070：噗噜噗噜！\n@c0@"
  tl: "@a@b%a002070：噗嚕噗嚕！\n@c0@"
183:
  en: "@a%0%a002000@bThat fella gets right to the point, aye? I wouldn't mind chasin' a bit of treasure, though.\n@c0@"
  ja: "@a@b%a002000「何だか　よく　わからないが\n\tとりあえず　宝さがし　ってのを\n\tやってみるのも　悪くないかな。\n@c0@"
  ko: "@a@b%a002000: 뭔지 잘은 모르겠지만\n아무튼 보물찾기를\n해 보는 것도 나쁘지 않겠어.\n@c0@"
  sl: "@a@b%a002000：虽然不明白他说什么，\n　　不过既然让咱们去寻宝，\n　　咱们先去找找也不错吧。\n@c0@"
  tl: "@a@b%a002000：雖然不明白他說什麼，\n　　不過既然讓咱們去尋寶，\n　　咱們先去找找也不錯吧。\n@c0@"
184:
  en: "@a%0%a002010@bIt doesn't seem we'll get any help here.\n@c0@"
  ja: "@a@b%a002010「何も　助けては\n\tくれないようね。\n@c0@"
  ko: "@a@b%a002010: 아무것도 도와주지\n않을 거야.\n@c0@"
  sl: "@a@b%a002010：似乎不能指望这里了。\n@c0@"
  tl: "@a@b%a002010：似乎不能指望這裡了。\n@c0@"
185:
  en: "@a%0%a002020@bI get the feeling this Gainmore guy isn't exactly the charitable type.\n@c0@"
  ja: "@a@b%a002020「しゃべり方に\n\tケチな　性格が\n\tにじみでてるわねー。\n@c0@"
  ko: "@a@b%a002020: 말투에서\n구두쇠 같은 성격이\n베어 나오는구나~\n@c0@"
  sl: "@a@b%a002020：从他说话就能看出来，\n　　这人绝对是个小气鬼。\n@c0@"
  tl: "@a@b%a002020：從他說話就能看出來，\n　　這人絕對是個小氣鬼。\n@c0@"
186:
  en: "@a%0%a002030@bI'll warrant we are not the first treasure hunters to visit him here...\n@c0@"
  ja: "@a@b%a002030「よほど　たくさんの人が\n\t宝さがしの　話を　聞きに\n\tここへ　来るようですね。\n@c0@"
  ko: "@a@b%a002030: 정말 많은 사람이\n보물찾기 이야기를 들으러\n이곳에 온 것 같습니다.\n@c0@"
  sl: "@a@b%a002030：恐怕已经有很多人\n　　都来这里询问过宝物的事了。\n@c0@"
  tl: "@a@b%a002030：恐怕已經有很多人\n　　都來這裡詢問過寶物的事了。\n@c0@"
187:
  en: "@a%0%a002030@bWell, you heard his words, %a000090. We shall just have to search for the treasure on our own.\n@c0@"
  ja: "@a@b%a002030「まあ　いわれたとおり\n\tその　宝とやらを　自分たちで\n\tさがして　みましょうか。\n@c0@"
  ko: "@a@b%a002030: 뭐, 시키는 대로\n그 보물이라는 걸\n우리 손으로 찾아 볼까요?\n@c0@"
  sl: "@a@b%a002030：好吧，如他所说，\n　　宝物什么的我们还是靠自己的\n　　力量去找找看吧。\n@c0@"
  tl: "@a@b%a002030：好吧，如他所說，\n　　寶物什麼的我們還是靠自己的\n　　力量去找找看吧。\n@c0@"
188:
  en: "@a%0%a002050@bMaybe he just didn't like our faces...?\n@c0@"
  ja: "@a@b%a002050「何だか　勝手に\n\t決めつけられて　勝手に\n\t放り出されちゃいましたね……。\n@c0@"
  ko: "@a@b%a002050: 왠지 마음대로\n결정하더니 마음대로\n내쫓아 버리는군요......\n@c0@"
  sl: "@a@b%a002050：总觉得是被人\n　　莫名其妙地骂了一顿，\n　　又被莫名其妙地赶了出来……\n@c0@"
  tl: "@a@b%a002050：總覺得是被人\n　　莫名其妙地罵了一頓，\n　　又被莫名其妙地趕了出來……\n@c0@"
189:
  en: "@a%0%a002040@bLet's get going. We don't have time to waste on guys like this.\n@c0@"
  ja: "@a@b%a002040「行こうぜ。\n\tこんな　ヤツの　相手をしてるだけ\n\t時間の　ムダだろう。\n@c0@"
  ko: "@a@b%a002040: 가자고!\n이런 녀석을 상대하는\n시간이 아깝다.\n@c0@"
  sl: "@a@b%a002040：走吧。\n　　和这种家伙打交道，\n　　纯粹是浪费时间。\n@c0@"
  tl: "@a@b%a002040：走吧。\n　　和這種傢伙打交道，\n　　純粹是浪費時間。\n@c0@"
190:
  en: "@a%0%a002060@b(snarl) %0%a000090...hunt for treasure...? (slobber)\n@c0@"
  ja: "@a@b%a002060「%a000090…宝……\n\tさがすのか……？\n@c0@"
  ko: "@a@b%a002060: %a000090...보물...\n찾을 거냐......?\n@c0@"
  sl: "@a@b%a002060：%a000090……\n　　我们……去找……宝物吗？\n@c0@"
  tl: "@a@b%a002060：%a000090……\n　　我們……去找……寶物嗎？\n@c0@"
191:
  en: "@a%0%a002070@bBoing! (jiggle)\n@c0@"
  ja: "@a@b%a002070「プルプルーッ！\n@c0@"
  ko: "@a@b%a002070: 뽀용뽀요용~!\n@c0@"
  sl: "@a@b%a002070：噗噜噗噜！\n@c0@"
  tl: "@a@b%a002070：噗嚕噗嚕！\n@c0@"
192:
  en: "@a%0%a002000@bCrikey. What a grump.\n@c0@"
  ja: "@a@b%a002000「ちっ…\n\tイヤな　ヤツだぜ……。\n@c0@"
  ko: "@a@b%a002000: 쳇...\n짜증나는 녀석이로군......\n@c0@"
  sl: "@a@b%a002000：嘁……\n　　真是个讨厌的家伙……\n@c0@"
  tl: "@a@b%a002000：嘁……\n　　真是個討厭的傢伙……\n@c0@"
193:
  en: "@a%0%a002010@bHe wouldn't even give us the time of day.\n@c0@"
  ja: "@a@b%a002010「とりつく　しまも\n\tないって　感じね。\n@c0@"
  ko: "@a@b%a002010: 말을 붙여볼\n여지도 없는 것 같네.\n@c0@"
  sl: "@a@b%a002010：他就没打算\n　　听我们说话吧。\n@c0@"
  tl: "@a@b%a002010：他就沒打算\n　　聽我們說話吧。\n@c0@"
194:
  en: "@a%0%a002020@bHow rude! We don't need this. Let's go!\n@c0@"
  ja: "@a@b%a002020「めちゃめちゃ\n\t失礼な　人ね！\n\tもう　いいわ！　行こ！\n@c0@"
  ko: "@a@b%a002020: 말도 못하게\n무례한 사람이야!\n이제 됐어! 빨리 가자!\n@c0@"
  sl: "@a@b%a002020：这人真是\n　　太没礼貌了！\n　　算了，我们走！\n@c0@"
  tl: "@a@b%a002020：這人真是\n　　太沒禮貌了！\n　　算了，我們走！\n@c0@"
195:
  en: "@a%0%a002030@bDo we really look like riff-raff?\n@c0@"
  ja: "@a@b%a002030「私たち\n\tそんなに　物ほしそうに\n\t見えるのでしょうか……。\n@c0@"
  ko: "@a@b%a002030: 우리가\n구걸하는 사람처럼\n보이는 걸까요......\n@c0@"
  sl: "@a@b%a002030：我们看起来\n　　真的那么像乞丐吗？\n@c0@"
  tl: "@a@b%a002030：我們看起來\n　　真的那麼像乞丐嗎？\n@c0@"
196:
  en: "@a%0%a002050@bWhat — does he think we're bleedin' beggars?\n@c0@"
  ja: "@a@b%a002050「ものごいに　来たなんて\n\tひとことも　いってないのに\n\tひどいです！\n@c0@"
  ko: "@a@b%a002050: 구걸하러 왔다니?\n그런 말은 꺼낸 적도 없는데\n너무하군요!\n@c0@"
  sl: "@a@b%a002050：我们可从没说过\n　　我们是来要东西的，\n　　真是太过分了。\n@c0@"
  tl: "@a@b%a002050：我們可從沒說過\n　　我們是來要東西的，\n　　真是太過分了。\n@c0@"
197:
  en: "@a%0%a002050@b...Not to say I'd refuse any stuff he was givin' away...\n@c0@"
  ja: "@a@b%a002050「まあ　どうしても\n\t何か　くれるっていうなら　もらって\n\tあげても　いいですけども。\n@c0@"
  ko: "@a@b%a002050: 뭐, 제발 좀\n가져가 달라고 한다면\n가져가 주겠지만요.\n@c0@"
  sl: "@a@b%a002050：不过要是无论如何\n　　都要给点什么的话，\n　　我们也不介意勉强收下。\n@c0@"
  tl: "@a@b%a002050：不過要是無論如何\n　　都要給點什麼的話，\n　　我們也不介意勉強收下。\n@c0@"
198:
