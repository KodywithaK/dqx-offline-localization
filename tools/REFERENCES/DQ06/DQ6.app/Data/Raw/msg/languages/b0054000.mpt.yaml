0:
  en: "@a@bThere's no response. It's just a corpse.\n@c0@"
  ja: "@a@b返事がない。\nただの　しかばねの　ようだ……。\n@c0@"
  ko: "@a@b반응이 없다.\n그냥 시체인 것 같다......\n@c0@"
  sl: "@a@b没有回应。\n看来只是一具尸体……\n@c0@"
  tl: "@a@b沒有回應。\n看來只是一具屍體……\n@c0@"
1:
  en: "@a@b*: %0%a000090. I knew that %H0860%Xyou%Yyou and your companions%Z would eventually come.\n@c0@"
  ja: "@a@b＊「%a000090と　その仲間たちですね。\n\t私には　あなたたちが　やがて\n\t来ることが　わかっていました。\n@c0@"
  ko: "@a@b*: %a000090%F0090%X와%Y과%Z 그 동료들이군요.\n저는 여러분이 이제 이곳으로\n오리라는 것을 알고 있었습니다.\n@c0@"
  sl: "@a@b＊：你们是%a000090一行吧。\n　　我早已知道你们会来找我。\n@c0@"
  tl: "@a@b＊：你們是%a000090一行吧。\n　　我早已知道你們會來找我。\n@c0@"
2:
  en: "@a@b*: My name is Rubiss. It is my duty to watch over and protect this world.\n@c0@"
  ja: "@a@b＊「私は　ルビス。\n\tこの世界を　見守る者です。\n@c0@"
  ko: "@a@b*: 저는 루비스.\n이 세계를 지켜보는 자입니다.\n@c0@"
  sl: "@a@b＊：我叫卢比斯，\n　　是这个世界的守护者。\n@c0@"
  tl: "@a@b＊：我叫盧比斯，\n　　是這個世界的守護者。\n@c0@"
3:
  en: "@aRubiss@bDid you hear my voice calling out to you?\n@c0@"
  ja: "@a@bルビス「私の呼ぶ声が　聞こえましたか？\n@c0@"
  ko: "@a@b루비스: 제가 부르는 소리가 들리던가요?\n@c0@"
  sl: "@a@b卢比斯：听到过我的呼唤吧？\n@c0@"
  tl: "@a@b盧比斯：聽到過我的呼喚吧？\n@c0@"
4:
  en: "@aRubiss@b%0%a000090, you were born unto this world with a destiny like no other.\n@c0@"
  ja: "@a@bルビス「%a000090よ　あなたは\n\t不思議な運命を　背負い\n\t生まれてきた者……。\n@c0@"
  ko: "@a@b루비스: %a000090, 당신은\n불가사의한 운명을 지니고\n태어난 자......\n@c0@"
  sl: "@a@b卢比斯：%a000090，你是\n　　背负着重要的使命\n　　出生在这个世界上的……\n@c0@"
  tl: "@a@b盧比斯：%a000090，你是\n　　背負著重要的使命\n　　出生在這個世界上的……\n@c0@"
5:
  en: "@aRubiss@bThe fate of the world depends on the success of your journey.\n@c0@"
  ja: "@a@bルビス「世界の行く末は\n\tあなたたちの　はたらきに\n\tゆだねられています。\n@c0@"
  ko: "@a@b루비스: 이 세계의 결말은\n당신들의 행동에\n달려 있습니다.\n@c0@"
  sl: "@a@b卢比斯：世界的未来，\n　　全都寄托在你们身上。\n@c0@"
  tl: "@a@b盧比斯：世界的未來，\n　　全都寄託在你們身上。\n@c0@"
6:
  en: "@aRubiss@bGo, my child. Venture forth and discover your true destiny.\n@c0@"
  ja: "@a@bルビス「ゆくのです。\n\tそして　ときあかすのです。\n@c0@"
  ko: "@a@b루비스: 가십시오.\n그리고 밝혀내십시오.\n@c0@"
  sl: "@a@b卢比斯：不停地去寻找，\n　　不停地去探索。\n@c0@"
  tl: "@a@b盧比斯：不停地去尋找，\n　　不停地去探索。\n@c0@"
7:
  en: "@aRubiss@bTravel to every corner of the world, and the path you must take will surely be revealed to you.\n@c0@"
  ja: "@a@bルビス「世界のすべてを　くまなく\n\tまわれば　なにをすべきか\n\tわかることでしょう。\n@c0@"
  ko: "@a@b루비스: 이 세계 모든 곳을 빠짐없이\n돌아다녀 보면 무엇을 해야 할지\n알 수 있을 것입니다.\n@c0@"
  sl: "@a@b卢比斯：当踏遍世界上\n　　每一个角落的时候，\n　　你们就会知道自己到底该做什么。\n@c0@"
  tl: "@a@b盧比斯：當踏遍世界上\n　　每一個角落的時候，\n　　你們就會知道自己到底該做什麼。\n@c0@"
8:
  en: "@aRubiss@bI will always be watching over %H0860%Xyou%Yyou and your companions%Z, my child.\n@c0@"
  ja: "@a@bルビス「私は　いつも　あなたたちを\n\t見守っています。\n@c0@"
  ko: "@a@b루비스: 저는 항상 여러분을\n지켜보고 있습니다.\n@c0@"
  sl: "@a@b卢比斯：我将会永远守护着你们。\n@c0@"
  tl: "@a@b盧比斯：我將會永遠守護著你們。\n@c0@"
9:
  en: "@aRubiss@bThe island where you fought Murdaw has been home to countless evils over the ages.\n@c0@"
  ja: "@a@bルビス「ムドーがいた島には\n\tいくどとなく　悪魔が\n\t住みつきました。\n@c0@"
  ko: "@a@b루비스: 무도가 있었던 섬에는\n몇 번씩이나 악마가\n자리를 잡았습니다.\n@c0@"
  sl: "@a@b卢比斯：恶魔们曾经\n　　无数次地占据姆多岛。\n@c0@"
  tl: "@a@b盧比斯：惡魔們曾經\n　　無數次地佔據姆多島。\n@c0@"
10:
  en: "@aRubiss@bPerhaps there is some sort of presence there that attracts the powers of darkness.\n@c0@"
  ja: "@a@bルビス「あの場所には\n\t闇のチカラが　集まりやすい\n\tなにかが　あるのかもしれません。\n@c0@"
  ko: "@a@b루비스: 그곳에는\n어둠의 힘을 끌어들이는\n뭔가가 있는 건지도 모릅니다.\n@c0@"
  sl: "@a@b卢比斯：由于某些不为人知的原因，\n　　黑暗的力量很喜欢在那里聚集。\n@c0@"
  tl: "@a@b盧比斯：由於某些不為人知的原因，\n　　黑暗的力量很喜歡在那裡聚集。\n@c0@"
11:
  en: "@aRubiss@bIt was for that reason that I once took the precaution of creating a certain ocarina...\n@c0@"
  ja: "@a@bルビス「そのため　私は　かつて\n\tある笛を　つくっておいたのですが……\n@c0@"
  ko: "@a@b루비스: 그 때문에 저는 과거에\n어떤 피리를 만들어 두었는데......\n@c0@"
  sl: "@a@b卢比斯：为此，我曾经\n　　制作了一只笛子……\n@c0@"
  tl: "@a@b盧比斯：為此，我曾經\n　　製作了一隻笛子……\n@c0@"
12:
  en: "@aRubiss@bI am delighted to see that it seems to have proved its worth.\n@c0@"
  ja: "@a@bルビス「めぐり　めぐって　その笛も\n\t役に立ったようですね。\n@c0@"
  ko: "@a@b루비스: 돌고 돌아 그 피리도\n도움이 되었나 보군요.\n@c0@"
  sl: "@a@b卢比斯：没想到几经周折之后，\n　　那个笛子终于发挥了它的作用。\n@c0@"
  tl: "@a@b盧比斯：沒想到幾經周折之後，\n　　那個笛子終於發揮了它的作用。\n@c0@"
13:
  en: "@aRubiss@bI sense a great evil drawing breath somewhere in this world...\n@c0@"
  ja: "@a@bルビス「私は　感じます。\n\t世界のどこかで　息づく\n\t大きな　邪悪なチカラを……。\n@c0@"
  ko: "@a@b루비스: 저는 느낍니다.\n이 세계 어딘가에서 숨쉬고 있는\n거대하고도 사악한 힘을......\n@c0@"
  sl: "@a@b卢比斯：我能感觉到，\n　　一股庞大的邪恶力量\n　　就躲在这世界的某个地方……\n@c0@"
  tl: "@a@b盧比斯：我能感覺到，\n　　一股龐大的邪惡力量\n　　就躲在這世界的某個地方……\n@c0@"
