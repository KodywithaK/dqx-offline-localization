8:
  en: "@a@b*: The ‘Best-Dressed Contest’ aims to separate the stylish sheep from the grotty goats.\n@c0@"
  ja: "@a@b＊「この　ベストドレッサーコンテストは\n\t参加者のみなさまに　かっこよさを\n\t競いあっていただく　というものです。\n@c0@"
  ko: "@a@b*: 이 베스트 드레서 경연대회는\n참가자 여러분들의 멋을\n겨루는 대회입니다.\n@c0@"
  sl: "@a@b＊：这个时尚达人大赛\n　　是让参赛者们\n　　比试美型度的比赛。\n@c0@"
  tl: "@a@b＊：這個時尚達人大賽\n　　是讓參賽者們\n　　比試美型度的比賽。\n@c0@"
9:
  en: "@a@b*: There are eight separate contests, from Level 1 for absolute beginners to Level 8 for style superstars.\n@c0@"
  ja: "@a@b＊「コンテストは　初級者用のランク１から\n\t最上級者のみ参加できる　ランク８まで\n\t全部で　８つ　ございます。\n@c0@"
  ko: "@a@b*: 경연은 초급자용 랭크1부터\n최상급자만 참가 가능한 랭크8까지\n총 8가지가 있습니다.\n@c0@"
  sl: "@a@b＊：大赛共分为８个等级，\n　　包括了从供初级人员参加的等级１\n　　到只有最高级人员才能参加的等级８。\n@c0@"
  tl: "@a@b＊：大賽共分為８個等級，\n　　包括了從供初級人員參加的等級１\n　　到只有最高級人員才能參加的等級８。\n@c0@"
10:
  en: "@a@b*: You can't just dive in at the deep end, though. You'll have to win the lower level contests first.\n@c0@"
  ja: "@a@b＊「低い方のランクで　優勝しないと\n\t次のランクには　進めません。\n@c0@"
  ko: "@a@b*: 낮은 랭크에서 우승하지 못하면\n다음 랭크로 넘어갈 수 없죠.\n@c0@"
  sl: "@a@b＊：没有在较低等级中取得优胜的话\n　　就无法进入到下一等级当中。\n@c0@"
  tl: "@a@b＊：沒有在較低等級中取得優勝的話\n　　就無法進入到下一等級當中。\n@c0@"
11:
  en: "@a@b*: Leave the others in the shade and you'll get a prize from our own maven of modishness, Seymour Sass!\n@c0@"
  ja: "@a@b＊「なお　優勝者には　この館のあるじ\n\tジャンポルテ様より　ステキな賞品が\n\t出ますので　がんばってくださいね！\n@c0@"
  ko: "@a@b*: 또한 우승하신 분께는 이 저택의\n주인인 장포르테 님으로부터 멋진 상품이\n수여될 예정이오니 열심히 해 주세요!\n@c0@"
  sl: "@a@b＊：另外，优胜者还可以从这里的馆主\n　　约翰波尔泰那里获得丰厚奖品，\n　　所以请大家好好加油吧！\n@c0@"
  tl: "@a@b＊：另外，優勝者還可以從這裡的館主\n　　約翰波爾泰那裡獲得豐厚獎品，\n　　所以請大家好好加油吧！\n@c0@"
12:
  en: "@a@b*: The higher the contest level, the more fabulous the prize — and the more fierce the competition.\n@c0@"
  ja: "@a@b＊「コンテストの　ランクが上がると\n\t賞品も良くなりますが　ライバルたちも\n\t当然　手ごわくなりますよ！\n@c0@"
