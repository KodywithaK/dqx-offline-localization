  sl: "@a@b＊：随着等级的提升，\n　　奖品会更加丰厚，\n　　相对地对手实力也会更强！\n@c0@"
  tl: "@a@b＊：隨著等級的提升，\n　　獎品會更加豐厚，\n　　相對地對手實力也會更強！\n@c0@"
13:
  en: "@a@b*: Our glamorous judges will award each contestant points for style and sensibility.\n@c0@"
  ja: "@a@b＊「しんさ委員が　参加者の　かっこよさと\n\t着こなしを見て　点数をつけます。\n\t１番　高い点を取った人が優勝です！\n@c0@"
  ko: "@a@b*: 심사위원이 참가자들의 멋과\n옷맵시를 보고 점수를 매깁니다.\n가장 높은 점수를 받은 사람이 우승하죠!\n@c0@"
