0:
  en: "@a@b*: %0%a000120! Glad you could join us! You're here for the contest, I take it? Of course you are!\n@c0@"
  ja: "@a@b＊「おおっ　待ってましたよ\n\t%a000120さん！\n\tもちろん　参加のご希望ですよね？\n@c0@"
