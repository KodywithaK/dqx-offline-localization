  tl: "@a@b＊：評委們會根據參賽人員的\n　　美型度和穿著來打分。\n　　獲得最高分數的人獲勝！\n@c0@"
14:
  en: "@a@b*: ...What's that? You want some tips for grabbing a top score? Well, just between you and me...\n@c0@"
