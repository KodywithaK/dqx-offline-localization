0:
  en: "@aAli Kazam@bNow that looks like the face of someone who's recently come into possession of a legendary sword...\n@c0@"
  ja: "@a@bザム「ふむ　その顔つきからすると\n\t伝説の剣を　手に入れることが\n\tできたようじゃな。\n@c0@"
  ko: "@a@b자무: 흠, 표정을 보니\n전설의 검을\n손에 넣은 모양이로군.\n@c0@"
  sl: "@a@b扎姆：嗯，从你们的表情看来，\n　　应该是已经得到了传说之剑了吧。\n@c0@"
  tl: "@a@b扎姆：嗯，從你們的表情看來，\n　　應該是已經得到了傳說之劍了吧。\n@c0@"
1:
  en: "@aAli Kazam@bI'm certain my advice proved invaluable. I do hope you're grateful.\n@c0@"
  ja: "@a@bザム「わしの教えは\n\t役に立ったであろう？\n\t感謝するのじゃぞ。　んー。\n@c0@"
  ko: "@a@b자무: 나의 가르침이\n도움이 됐을 테지?\n그럼 내게 감사하게나. 으음.\n@c0@"
  sl: "@a@b扎姆：老夫告诉你们的暗语\n　　派上用场了吧？\n　　记得感谢老夫啊。嗯……\n@c0@"
  tl: "@a@b扎姆：老夫告訴你們的暗語\n　　派上用場了吧？\n　　記得感謝老夫啊。嗯……\n@c0@"
2:
  en: "@aAli Kazam@bWell, chop-chop. Where is it? Aren't you going to show me your shiny new sword?\n@c0@"
  ja: "@a@bザム「どれどれ　その　剣とやらを\n\tこのわしにも　見せてみい。\n@c0@"
  ko: "@a@b자무: 어디 보자 그 검이라는 걸\n내게도 보여 주게.\n@c0@"
  sl: "@a@b扎姆：对了，把那把剑\n　　拿给老夫看看。\n@c0@"
  tl: "@a@b扎姆：對了，把那把劍\n　　拿給老夫看看。\n@c0@"
3:
  en: "@aAli Kazam@bHoly frostbite! It's nothing but a hunk of rust!\n@c0@"
  ja: "@a@bザム「うわっ！　なんじゃ　これは！？\n\tまるっきり　くちはてて\n\tいるでは　ないかっ。\n@c0@"
  ko: "@a@b자무: 으앗! 뭔가 이건!?\n완전히 녹슬어 버린\n검이 아닌가?\n@c0@"
  sl: "@a@b扎姆：呜哇！这是什么？！\n　　完全锈得不行了嘛。\n@c0@"
  tl: "@a@b扎姆：嗚哇！這是什麼？！\n　　完全鏽得不行了嘛。\n@c0@"
4:
  en: "@aAli Kazam@bAhh... What to do, what to do...? Hmm...㈢㈢ Hmmmm...㈢㈢㈢ Aha! I've got it!\n@c0@"
  ja: "@a@bザム「これは　どうしたものかのう。\n\tんー㈢㈢　んー。㈢㈢㈢\n\tおお　そうじゃっ！\n@c0@"
  ko: "@a@b자무: 이게 대체 어찌 된 일이지.\n으음, ㈢㈢으음. ㈢㈢㈢\n아, 그렇군!\n@c0@"
  sl: "@a@b扎姆：这可怎么办呢。\n　　嗯……㈢㈢嗯……㈢㈢㈢\n　　哦哦，对了！\n@c0@"
  tl: "@a@b扎姆：這可怎麼辦呢。\n　　嗯……㈢㈢嗯……㈢㈢㈢\n　　哦哦，對了！\n@c0@"
5:
  en: "@aAli Kazam@bTrek south from Alltrades Abbey and you should find a town.\n@c0@"
  ja: "@a@bザム「かつて　ダーマの神殿があった\n\tあたりから　まっすぐ南へ\n\t行ったところに　町があったの。\n@c0@"
  ko: "@a@b자무: 예전에 다마 신전이 있던\n근처에서 곧바로 남쪽으로 가면 마을이 있다네.\n@c0@"
  sl: "@a@b扎姆：过去从达玛神殿那一带\n　　直着往南走，有一个城镇。\n@c0@"
  tl: "@a@b扎姆：過去從達瑪神殿那一帶\n　　直著往南走，有一個城鎮。\n@c0@"
6:
  en: "@aAli Kazam@bTurnscote, it's called. It's a dodgy place for dodgy people...\n@c0@"
  ja: "@a@bザム「その町の名は　ロンガデセオ。\n\tいかがわしい者が　たむろする\n\tならず者の町じゃが……\n@c0@"
  ko: "@a@b자무: 그 마을의 이름은 론가데세오.\n뒤가 구린 자들이 모여드는\n불량배들의 마을이지......\n@c0@"
  sl: "@a@b扎姆：那个城镇叫洛卡迪塞欧。\n　　是个聚集了无赖之人的\n　　无赖之镇……\n@c0@"
  tl: "@a@b扎姆：那個城鎮叫洛卡迪塞歐。\n　　是個聚集了無賴之人的\n　　無賴之鎮……\n@c0@"
7:
  en: "@aAli Kazam@bBut it's also the ancestral home of a famous family of swordsmiths. Their work has achieved nearly mythical status.\n@c0@"
  ja: "@a@bザム「そこに　伝説になるほど\n\tすごうでの　剣職人の家系の者が\n\t代々　住んでおったはずじゃ。\n@c0@"
  ko: "@a@b자무: 그곳에 전설이 될 정도로\n굉장한 실력의 검 장인 혈통인 사람이\n대대로 살고 있을 것이네.\n@c0@"
  sl: "@a@b扎姆：听说有一位传说级的\n　　技术极其高超的铸剑师，\n　　他们一家人世世代代都住在那里。\n@c0@"
  tl: "@a@b扎姆：聽說有一位傳說級的\n　　技術極其高超的鑄劍師，\n　　他們一家人世世代代都住在那裡。\n@c0@"
8:
  en: "@aAli Kazam@bThis is all rather old knowledge, of course. I can't be certain that the family still plies its trade in the town.\n@c0@"
  ja: "@a@bザム「なにぶん　古いことなので\n\t今も　いるかどうかは\n\tわからんがの。　んー。\n@c0@"
  ko: "@a@b자무: 꽤 오래 전 이야기니까\n지금도 있을지는\n모르겠지만 말이야. 으음.\n@c0@"
  sl: "@a@b扎姆：不过这也是很久以前听说的，\n　　不知道他们现在还在不在那里。嗯……\n@c0@"
  tl: "@a@b扎姆：不過這也是很久以前聽說的，\n　　不知道他們現在還在不在那裡。嗯……\n@c0@"
9:
  en: "@aAli Kazam@bAh, but let me give you this before it slips my mind...\n@c0@"
  ja: "@a@bザム「よし　たすけついでに\n\tこれを　やろう！\n@c0@"
  ko: "@a@b자무: 그럼 도와주는 김에\n이것도 주지!\n@c0@"
  sl: "@a@b扎姆：好吧，帮人帮到底，\n　　就把这个给你吧！\n@c0@"
  tl: "@a@b扎姆：好吧，幫人幫到底，\n　　就把這個給你吧！\n@c0@"
10:
  en: "@a@b%0%a000120 receives the Turnscote pendant.\n@c0@"
  ja: "@a@b%a000120は　デセオのパスを\nうけとった！\n@c0@"
  ko: "@a@b%a000120%F0120%X는%Y은%Z 데세오 패스를\n받았다!\n@c0@"
  sl: "@a@b%a000120收下了迪塞欧通行证！\n@c0@"
  tl: "@a@b%a000120收下了迪塞歐通行證！\n@c0@"
11:
  en: "@aAli Kazam@bIf you show them that at the entrance, they're sure to let you into the town.\n@c0@"
  ja: "@a@bザム「それが　あれば　町の中に\n\t入れてもらえるはずじゃよ。　んー。\n@c0@"
  ko: "@a@b자무: 그게 있으면 마을 안에\n들어갈 수 있을걸세.\n@c0@"
  sl: "@a@b扎姆：有了这个，\n　　应该就能随意出入镇子了。嗯……\n@c0@"
  tl: "@a@b扎姆：有了這個，\n　　應該就能隨意出入鎮子了。嗯……\n@c0@"
