16:
  en: "@aAli Kazam@bOh, it's you again. Well? Was I right or was I right about Turnscote?\n@c0@"
  ja: "@a@bザム「んー。　また　お前さんたちか。\n\tどうじゃ　わしの　いった\n\tとおりで　あったろう。\n@c0@"
  ko: "@a@b자무: 으음. 또 자네들인가?\n어떤가? 내가 말한\n그대로이지 않던가?\n@c0@"
  sl: "@a@b扎姆：嗯，又是你们啊。\n　　怎么样，是不是正如老夫所言啊。\n@c0@"
  tl: "@a@b扎姆：嗯，又是你們啊。\n　　怎麼樣，是不是正如老夫所言啊。\n@c0@"
17:
  en: "@aAli Kazam@bI suppose I can tell you now... I used to be a regular over in Turnscote — a real VIP, if you know what I mean. Ahh, yes.\n@c0@"
  ja: "@a@bザム「今だから　いうがな。　わしも\n\t若い頃は　あの町で　ブイブイ\n\tいわせてたもんじゃ。　んー。\n@c0@"
  ko: "@a@b자무: 지금에서야 말하네만. 나도\n젊었을 때는 그 마을에서\n이름 좀 날렸지. 으흠.\n@c0@"
  sl: "@a@b扎姆：事到如今告诉你们也无妨。\n　　老夫年轻时在那个镇子里\n　　也是有头有脸的人物呢。嗯……\n@c0@"
  tl: "@a@b扎姆：事到如今告訴你們也無妨。\n　　老夫年輕時在那個鎮子裡\n　　也是有頭有臉的人物呢。嗯……\n@c0@"
18:
  en: "@a@b%0%a000120 shows the rusted sword to Ali.\n@c0@"
  ja: "@a@b%a000120は　さびた剣を\nザムに　見せてあげた。\n@c0@"
  ko: "@a@b%a000120%F0120%X는%Y은%Z 녹슨 검을\n자무에게 보여줬다.\n@c0@"
  sl: "@a@b%a000120把锈剑拿给扎姆看了。\n@c0@"
  tl: "@a@b%a000120把鏽劍拿給扎姆看了。\n@c0@"
19:
  en: "@a@b*: I've travelled many leagues in search of the legendary sword... But I shan't be looking for it any more.\n@c0@"
  ja: "@a@b＊「私は　伝説の剣を　もとめて\n\tここまで　やってきたのだが……\n\tもう　あきらめることにしたよ。\n@c0@"
  ko: "@a@b*: 나는 전설의 검을 찾아\n여기까지 왔는데......\n이젠 포기하기로 했어.\n@c0@"
  sl: "@a@b＊：我为了传说之剑千里跋涉，\n　　终于来到这里……\n　　但是现在也已经放弃了。\n@c0@"
  tl: "@a@b＊：我為了傳說之劍千里跋涉，\n　　終於來到這裡……\n　　但是現在也已經放棄了。\n@c0@"
20:
  en: "@a@b*: I hear a king on the southern continent is in possession of the legendary armour. I'm off to pay him a visit instead.\n@c0@"
  ja: "@a@b＊「南の大陸の　城主が\n\t伝説のよろいを　持っていたらしいから\n\t今度は　そちらをあたるつもりだ。\n@c0@"
  ko: "@a@b*: 남쪽 대륙의 영주가\n전설의 갑옷을 가지고 있다고 해서\n이번엔 그걸 찾으러 갈까 하네.\n@c0@"
  sl: "@a@b＊：听说南边大陆的城主拥有\n　　传说中的铠甲，\n　　接下来我打算去那边看看。\n@c0@"
  tl: "@a@b＊：聽說南邊大陸的城主擁有\n　　傳說中的鎧甲，\n　　接下來我打算去那邊看看。\n@c0@"
21:
  en: "@a@b*: What!? Ali Kazam is still alive 'n' spry!?\n@c0@"
  ja: "@a@b＊「なんだってえ！　ザム神官が\n\t生きてたってえ！？\n@c0@"
  ko: "@a@b*: 뭐라고! 자무 신관이\n살아 있었다고!?\n@c0@"
  sl: "@a@b＊：你说什么！扎姆神官还活着？！\n@c0@"
  tl: "@a@b＊：你說什麼！扎姆神官還活著？！\n@c0@"
22:
  en: "@a@b*: Cor blimey. What an innings, eh? These wise types are different from the likes of us, I s'pose.\n@c0@"
  ja: "@a@b＊「ふええー。　とんでもなく\n\t長生き　してるんだなあ。\n\tさすがに　えらいひとは　ちがうわ。\n@c0@"
  ko: "@a@b*: 으아아, 터무니없게\n정말 오래 사네.\n역시 높은 사람은 뭐가 달라도 다르다니까.\n@c0@"
  sl: "@a@b＊：诶诶诶……真是长寿啊。\n　　真不愧是伟人，\n　　和普通人就是不一样。\n@c0@"
  tl: "@a@b＊：誒誒誒……真是長壽啊。\n　　真不愧是偉人，\n　　和普通人就是不一樣。\n@c0@"
23:
  en: "@a@b*: Crikey, you had me goin' there! Of course he's kicked it. No human could live that long!\n@c0@"
  ja: "@a@b＊「なんだよ　ビックリさせんなよ！\n\tそうだよな　もし生きてたら\n\tバケモノだよな。\n@c0@"
  ko: "@a@b*: 뭐야, 놀랐잖아!\n그래, 만약 살아 있다면\n귀신일 거야.\n@c0@"
  sl: "@a@b＊：什么啊，别吓我啊！\n　　说的也是，要是能活到现在\n　　简直就是怪物嘛。\n@c0@"
  tl: "@a@b＊：什麼啊，別嚇我啊！\n　　說的也是，要是能活到現在\n　　簡直就是怪物嘛。\n@c0@"
24:
  en: "@a@b*: Pray tell... Is Ali Kazam truly still alive?\n@c0@"
  ja: "@a@b＊「ザム神官が　ご存命だったと\n\tいうのは　本当ですか？\n@c0@"
  ko: "@a@b*: 자무 신관께서 살아 계시다는 건\n정말입니까?\n@c0@"
  sl: "@a@b＊：据说扎姆神官尚在人世，\n　　是真的吗？\n@c0@"
  tl: "@a@b＊：據說扎姆神官尚在人世，\n　　是真的嗎？\n@c0@"
25:
  en: "@a@b*: Oh, my... Sounds like you had quite an experience in that little village!\n@c0@"
  ja: "@a@b＊「おお……　……なるほど\n\tそのようなことが　あの村に\n\t起こっていたとは……。\n@c0@"
  ko: "@a@b*: 오오...... ......그렇군.\n그런 일이 그 마을에서\n일어났었다니......\n@c0@"
  sl: "@a@b＊：哦哦……原来如此，\n　　那座村庄发生了这样的事啊……\n@c0@"
  tl: "@a@b＊：哦哦……原來如此，\n　　那座村莊發生了這樣的事啊……\n@c0@"
26:
  en: "@a@b*: Ali Kazam was a great sage, you know. He scaled the highest peaks of academia.\n@c0@"
  ja: "@a@b＊「ザム神官は　高度な学問を\n\tきわめられた　賢者のひとり。\n@c0@"
  ko: "@a@b*: 자무 신관은 고도의 학문을\n닦으신 현자 중 한 분이십니다.\n@c0@"
  sl: "@a@b＊：扎姆神官是将学识精研到极致的\n　　贤者之一。\n@c0@"
  tl: "@a@b＊：扎姆神官是將學識精研到極致的\n　　賢者之一。\n@c0@"
27:
  en: "@a@b*: Only the sages Benjamin and Isaac surpassed him in fame.\n@c0@"
  ja: "@a@b＊「賢者といえば　クリムトと\n\tマサールという　ふたりの\n\t大賢者のほうが　有名ですが……\n@c0@"
  ko: "@a@b*: 현자라 하면 클림트와\n마살이라는 두 분의\n대현자가 유명합니다만......\n@c0@"
  sl: "@a@b＊：说到贤者，\n　　最有名的当属克林姆和马萨尔\n　　这两位大贤者了……\n@c0@"
  tl: "@a@b＊：說到賢者，\n　　最有名的當屬克林姆和馬薩爾\n　　這兩位大賢者了……\n@c0@"
28:
  en: "@a@b*: Though I must admit, it's been an age since I heard anything of those two...\n@c0@"
