  sl: "@a@b＊：不好意思，这里不是\n　　你们这样的人来的地方。\n　　请回吧。\n@c0@"
  tl: "@a@b＊：不好意思，這裡不是\n　　你們這樣的人來的地方。\n　　請回吧。\n@c0@"
6:
  en: "@a@b%0%a000120 shows the Turnscote pendant received from Ali Kazam.\n@c0@"
  ja: "@a@b%a000120は　ザム神官から　もらった\nデセオのパスを　見せた。\n@c0@"
