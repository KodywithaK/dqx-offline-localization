  sl: "@a@b＊：虽然是座乱糟糟的城镇，\n　　只求别给我闹出人命就好。\n@c0@"
  tl: "@a@b＊：雖然是座亂糟糟的城鎮，\n　　只求別給我鬧出人命就好。\n@c0@"
9:
  en: "@a@b*: I ain't seen your %H0860%Xugly mug%Yugly mugs%Z round here before.\n@c0@"
  ja: "@a@b＊「あんたら　見ない顔だな。\n@c0@"
  ko: "@a@b*: 자네들은 못 보던 얼굴이군.\n@c0@"
  sl: "@a@b＊：你们很脸生啊。\n@c0@"
