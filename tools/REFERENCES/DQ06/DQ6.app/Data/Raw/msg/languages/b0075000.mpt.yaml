  sl: "@a@b%a000120将从扎姆神官那里得到的\n迪塞欧通行证亮了出来。\n@c0@"
  tl: "@a@b%a000120將從扎姆神官那裡得到的\n迪塞歐通行證亮了出來。\n@c0@"
7:
