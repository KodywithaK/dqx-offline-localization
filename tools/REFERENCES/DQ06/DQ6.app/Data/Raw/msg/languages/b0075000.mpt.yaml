  ko: "@a@b호크: 그래? 그럼 이 이야기는\n없던 걸로 하지.\n@c0@"
  sl: "@a@b霍克：是吗。\n　　那前面这些话就当我没说吧。\n@c0@"
  tl: "@a@b霍克：是嗎。\n　　那前面這些話就當我沒說吧。\n@c0@"
149:
