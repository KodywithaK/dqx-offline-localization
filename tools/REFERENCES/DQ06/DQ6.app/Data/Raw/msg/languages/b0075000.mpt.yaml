  ja: "@a@bホック「よし　話は　きまった！\n\tオレは　誰かに変装して\n\tこの町の　どこかに　いるはずだ。\n@c0@"
  ko: "@a@b호크: 좋았어. 계약 성립이야!\n난 누군가로 변장해서\n이 마을 어딘가에 숨어 있을 거야.\n@c0@"
  sl: "@a@b霍克：好，那就这么定了！\n　　我会乔装成其他人，\n　　躲在镇子的某处。\n@c0@"
  tl: "@a@b霍克：好，那就這麼定了！\n　　我會喬裝成其他人，\n　　躲在鎮子的某處。\n@c0@"
146:
  en: "@aMo@bGood luck findin' me. Catch you later!\n@c0@"
  ja: "@a@bホック「ま　がんばって　見つけてくれよ。\n\tそんじゃ　いってくらあ。\n@c0@"
  ko: "@a@b호크: 잘 찾아봐라!\n그럼 나 먼저 간다.\n@c0@"
  sl: "@a@b霍克：你就加油找吧。\n　　我走啦。\n@c0@"
  tl: "@a@b霍克：你就加油找吧。\n　　我走啦。\n@c0@"
147:
  en: "@a@b*: Wot's that? Mo the Mole ain't around any more.\n@c0@"
  ja: "@a@b＊「なんじゃ？\n\tホックなら　もう　いないぞ。\n@c0@"
  ko: "@a@b*: 뭔가?\n호크라면 벌써 갔다네.\n@c0@"
  sl: "@a@b＊：干什么？\n　　要找霍克的话，他已经走了。\n@c0@"
  tl: "@a@b＊：幹什麼？\n　　要找霍克的話，他已經走了。\n@c0@"
148:
