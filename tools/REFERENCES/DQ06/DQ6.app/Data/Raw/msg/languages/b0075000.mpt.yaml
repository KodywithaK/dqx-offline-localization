  sl: "@a@b＊：总之，在风头过去之前，\n　　就在这里好好待着吧。\n@c0@"
  tl: "@a@b＊：總之，在風頭過去之前，\n　　就在這裡好好待著吧。\n@c0@"
12:
  en: "@a@b*: Welcome to Turnscote — a town where anythin' goes. And I do mean anythin'…\n@c0@"
  ja: "@a@b＊「あーら　いらっしゃい。\n\tここは　自由の町　ロンガデセオよ。\n@c0@"
  ko: "@a@b*: 와~우, 어서 와.\n여긴 자유의 마을 론가데세오야.\n@c0@"
  sl: "@a@b＊：啊呀，欢迎光临。\n　　这里是自由之镇洛卡迪塞欧。\n@c0@"
  tl: "@a@b＊：啊呀，歡迎光臨。\n　　這裡是自由之鎮洛卡迪塞歐。\n@c0@"
