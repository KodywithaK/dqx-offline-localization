0:
  en: "@a@b*: Ribbit! I'm the most fabulously fashionable frog around.\n@c0@"
  ja: "@a@b＊「ケロケロッ！\n\tボクは　おしゃれな　カエルさ。\n@c0@"
  ko: "@a@b*: 개굴개굴!\n나는 멋쟁이 개구리야.\n@c0@"
  sl: "@a@b＊：呱呱！\n　　咱是爱打扮的青蛙。\n@c0@"
  tl: "@a@b＊：呱呱！\n　　咱是愛打扮的青蛙。\n@c0@"
1:
  en: "@a@b*: Bear in mind that only a limited number of items can have their style boosted.\n@c0@"
  ja: "@a@b＊「かっこよさを　きたえられる\n\t装備品は　かぎられてるから\n\tよく　考えてね。\n@c0@"
  ko: "@a@b*: 멋을 부릴 수 있는\n장비품은 한정되어 있으니까\n잘 생각해.\n@c0@"
  sl: "@a@b＊：能够通过锻造提升\n　　美型度的装备是有限的，\n　　要好好考虑哦。\n@c0@"
