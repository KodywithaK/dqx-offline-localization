  sl: "@a@b霍克：说起来，关于报酬\n　　还没跟你说过吧。\n@c0@"
  tl: "@a@b霍克：說起來，關於報酬\n　　還沒跟你說過吧。\n@c0@"
138:
  en: "@aMo@bFindin' someone in this town don't come cheap. It'll cost you fifty thousand gold coins.\n@c0@"
  ja: "@a@bホック「この町での　さがしものは\n\t高いぜ。　そうだな……\n\t５００００ゴールドだ。\n@c0@"
  ko: "@a@b호크: 이 마을에서 사람 찾기는\n좀 비싸지. 음......\n50000골드야.\n@c0@"
  sl: "@a@b霍克：在这座城镇找人\n　　可是很贵的。这个嘛……\n　　５００００金币。\n@c0@"
  tl: "@a@b霍克：在這座城鎮找人\n　　可是很貴的。這個嘛……\n　　５００００金幣。\n@c0@"
139:
  en: "@aMo@bBut don't worry. Mo knows no one's goin' to stump up that kind of money straight away.\n@c0@"
  ja: "@a@bホック「といっても　いきなり\n\tそんな大金を　はらうバカは\n\tいねえだろう。\n@c0@"
  ko: "@a@b호크: 근데 갑자기\n그렇게 큰 돈을 낼 바보는\n세상에 없겠지.\n@c0@"
  sl: "@a@b霍克：不过估计也没有哪个白痴\n　　会一口气付这么多钱吧。\n@c0@"
  tl: "@a@b霍克：不過估計也沒有哪個白癡\n　　會一口氣付這麼多錢吧。\n@c0@"
140:
  en: "@aMo@bThat's why Mo's goin' to propose a little wager...\n@c0@"
  ja: "@a@bホック「だから　オレと\n\tちょっとした　賭けをしようぜ。\n@c0@"
  ko: "@a@b호크: 그러니까 나랑\n내기를 하나 하지.\n@c0@"
  sl: "@a@b霍克：所以跟我打个小赌好了。\n@c0@"
  tl: "@a@b霍克：所以跟我打個小賭好了。\n@c0@"
141:
  en: "@aMo@bListen up! Mo's goin' to disguise himself and go undercover in the town.\n@c0@"
  ja: "@a@bホック「よーく　聞けよ。\n\tオレは　今から　変装して\n\t町に　もぐりこむ。\n@c0@"
  ko: "@a@b호크: 잘 들어.\n나는 지금부터 변장을 하고\n마을에 숨어들 거야.\n@c0@"
  sl: "@a@b霍克：听好了。\n　　我现在要乔装起来，\n　　藏在这个镇子里。\n@c0@"
  tl: "@a@b霍克：聽好了。\n　　我現在要喬裝起來，\n　　藏在這個鎮子裡。\n@c0@"
142:
  en: "@aMo@bTo gather information, it's goin' to take maybe three separate disguises.\n@c0@"
  ja: "@a@bホック「そうだな。　情報を集めるには\n\t３回くらい　変装しなきゃ\n\tならんだろう。\n@c0@"
  ko: "@a@b호크: 어디 보자, 정보를 수집하려면\n3번 정도 변장을\n해야 할 것 같은데.\n@c0@"
  sl: "@a@b霍克：对了。要想收集情报\n　　至少得乔装３次吧。\n@c0@"
  tl: "@a@b霍克：對了。要想收集情報\n　　至少得喬裝３次吧。\n@c0@"
143:
  en: "@aMo@bIf you see through all three of Mo's disguises, I'll slash the price to a mere two thousand gold coins.\n@c0@"
  ja: "@a@bホック「その変装を　３回とも\n\t見やぶったら　５００００を\n\t２０００に　まけてやるよ。\n@c0@"
  ko: "@a@b호크: 내 변장을 3번 모두\n알아보면 50000을\n2000으로 깎아 주지.\n@c0@"
  sl: "@a@b霍克：你要是能把这３次乔装都看穿，\n　　我就把价格从５００００金币\n　　给你降到２０００金币。\n@c0@"
  tl: "@a@b霍克：你要是能把這３次喬裝都看穿，\n　　我就把價格從５００００金幣\n　　給你降到２０００金幣。\n@c0@"
144:
  en: "@aMo@bSo what do you say? You up for it?\n@c0@"
  ja: "@a@bホック「どうだ　やるかい？\n@c0@"
  ko: "@a@b호크: 어때? 해 볼 텐가?\n@c0@"
  sl: "@a@b霍克：怎么样，成交吗？\n@c0@"
  tl: "@a@b霍克：怎麼樣，成交嗎？\n@c0@"
145:
