  sl: "@a@b＊：还有，传说中的武具重新锻造后\n　　不仅可以提高美型度，\n　　装备本身效果也会上升，所以很不错哦。\n@c0@"
  tl: "@a@b＊：還有，傳說中的武具重新鍛造後\n　　不僅可以提高美型度，\n　　裝備本身效果也會上升，所以很不錯哦。\n@c0@"
3:
  en: "@a@b*: Oi, %H0860%Xyou%Yyou lot%Z! Who said you could come here!?\n@c0@"
  ja: "@a@b＊「おい　あんた。\n\t誰に聞いて　この町に来たんだ？\n@c0@"
