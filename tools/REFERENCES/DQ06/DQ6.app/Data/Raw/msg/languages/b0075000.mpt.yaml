  ja: "@a@bホック「気が　変わったら\n\tいつでも　声をかけてくれよ。\n@c0@"
  ko: "@a@b호크: 생각이 바뀌면\n언제든지 나한테 말해!\n@c0@"
  sl: "@a@b霍克：要是改变主意了，\n　　可以随时来找我哦。\n@c0@"
  tl: "@a@b霍克：要是改變主意了，\n　　可以隨時來找我哦。\n@c0@"
150:
  en: "@a@b*: Wot's that? Mo the Mole's right there.\n@c0@"
