11:
  en: "@a@b*: Well, wotever it was you did, you should hide out here in Turnscote till the heat dies down.\n@c0@"
  ja: "@a@b＊「まっ　ほとぼりが　さめるまで\n\tのんびりしていくが　いいや。\n@c0@"
