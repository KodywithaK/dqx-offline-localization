  ko: "@a@b*: 절도, 공갈, 살인......\n무슨 일을 저질러서 이 마을까지\n왔는지는 모르겠지만.\n@c0@"
  sl: "@a@b＊：偷盗，恐吓，杀人……\n　　不知道你们是干了什么\n　　才流落到这个镇子的。\n@c0@"
