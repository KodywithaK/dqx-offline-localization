  ja: "@a@b＊「とろくさいわね。\n\tあんた　上を見ながら　歩いて\n\tカベに　ぶつかっちゃうタイプでしょ。\n@c0@"
  ko: "@a@b*: 너무 굼뜨잖아.\n너 하늘 보면서 걷다가\n벽에 부딪히는 타입이지?\n@c0@"
  sl: "@a@b＊：真够蠢的。\n　　你是那种走路看天\n　　然后撞到墙壁的类型吧。\n@c0@"
  tl: "@a@b＊：真夠蠢的。\n　　你是那種走路看天\n　　然後撞到牆壁的類型吧。\n@c0@"
136:
  en: "@a@b*: Tee hee.\n@c0@"
  ja: "@a@b＊「うっふん。\n@c0@"
  ko: "@a@b*: 읏흥.\n@c0@"
  sl: "@a@b＊：嗯～哼。\n@c0@"
  tl: "@a@b＊：嗯～哼。\n@c0@"
137:
  en: "@aMo@bWe ain't got down to brass tacks yet. Or should I say gold tacks?\n@c0@"
  ja: "@a@bホック「そういや　カネの話を\n\tまだ　していなかったな。\n@c0@"
