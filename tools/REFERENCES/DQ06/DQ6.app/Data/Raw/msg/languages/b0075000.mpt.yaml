2:
  en: "@a@b*: However, legendary items won't just increase in style — they'll become more effective, too! Ribbit!\n@c0@"
  ja: "@a@b＊「それから　伝説の武具は\n\tかっこよさだけじゃなくて　効果も\n\tアップするから　おトクだよ。\n@c0@"
