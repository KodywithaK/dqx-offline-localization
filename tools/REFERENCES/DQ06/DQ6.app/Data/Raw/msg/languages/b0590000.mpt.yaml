22:
  en: "@a%0%a002050@bI've never seen anyone look as happy as that old boy when he's hooked a fish!\n@c0@"
  ja: "@a@b%a002050「魚を　釣りあげたときの\n\tおじいさんの　うれしそうな顔！\n\tきっと　忘れられませんね！\n@c0@"
  ko: "@a@b%a002050: 고기를 낚아올렸을 때 지으시던\n할아버지의 기쁜 표정!\n아마 못 잊을 겁니다!\n@c0@"
  sl: "@a@b%a002050：我永远也忘不了\n　　当鱼被钓上来时\n　　老爷爷那高兴的表情！\n@c0@"
  tl: "@a@b%a002050：我永遠也忘不了\n　　當魚被釣上來時\n　　老爺爺那高興的表情！\n@c0@"
