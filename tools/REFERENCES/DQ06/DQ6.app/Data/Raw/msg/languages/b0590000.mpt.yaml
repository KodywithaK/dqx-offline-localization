  ko: "@a@b%a002030: 아직도 바닷속에서\n디네 양이 나올 것 같은\n기분이 듭니다.\n@c0@"
  sl: "@a@b%a002030：给人感觉\n　　蒂妮还会从海里出现呢。\n@c0@"
  tl: "@a@b%a002030：給人感覺\n　　蒂妮還會從海裡出現呢。\n@c0@"
28:
  en: "@a%0%a002020@bThis cove seems a lot bigger than the first time we visited, huh?\n@c0@"
  ja: "@a@b%a002020「なんか　ガラーンと\n\tしちゃってるね。\n@c0@"
  ko: "@a@b%a002020: 왠지 텅 빈\n느낌이네.\n@c0@"
  sl: "@a@b%a002020：心里感觉空落落的呢。\n@c0@"
  tl: "@a@b%a002020：心裡感覺空落落的呢。\n@c0@"
29:
  en: "@a%0%a002040@bA dead end, huh?\n@c0@"
