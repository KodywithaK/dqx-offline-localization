  en: "@a%0%a002000@bHey, didn't we run into that swordsman in the blue getup here?\n@c0@"
  ja: "@a@b%a002000「そういやあ　ここで\n\t青い服の　剣士と\n\t会ったんだったっけな。\n@c0@"
