0:
  en: "@a%0%a002000@bRemember how Rod kept lookin' over his shoulder in here? Drove ya nuts, aye?\n@c0@"
  ja: "@a@b%a002000「ここでは　さんざん\n\tロブに　ふり向かれて\n\tひやひや　させられたっけなあ。\n@c0@"
  ko: "@a@b%a002000: 여기는 몇 번이나\n롭이 뒤를 돌아보는 바람에\n간담이 서늘해졌던 곳이지.\n@c0@"
  sl: "@a@b%a002000：咱们当初\n　　在这里提心吊胆的，\n　　生怕洛布会突然回头呢。\n@c0@"
  tl: "@a@b%a002000：咱們當初\n　　在這裡提心吊膽的，\n　　生怕洛布會突然回頭呢。\n@c0@"
1:
  en: "@a%0%a002010@bThis cave reminds me of when we first met Unda.\n@c0@"
  ja: "@a@b%a002010「この奥で　ディーネさんと\n\tはじめて　会ったときのことを\n\t思い出すわね。\n@c0@"
  ko: "@a@b%a002010: 이 안쪽에서 디네 씨를\n처음 만났을 때가\n떠올라.\n@c0@"
  sl: "@a@b%a002010：我想起了在最深处\n　　第一次见到蒂妮的时候呢。\n@c0@"
  tl: "@a@b%a002010：我想起了在最深處\n　　第一次見到蒂妮的時候呢。\n@c0@"
2:
  en: "@a%0%a002030@bThe rocks are slippery — let's be careful.\n@c0@"
  ja: "@a@b%a002030「足元が　すべりますね。\n\t気をつけないと。\n@c0@"
  ko: "@a@b%a002030: 발밑이 미끄럽군요.\n조심해야겠습니다.\n@c0@"
  sl: "@a@b%a002030：脚下很滑，\n　　千万要小心。\n@c0@"
  tl: "@a@b%a002030：腳下很滑，\n　　千萬要小心。\n@c0@"
3:
  en: "@a%0%a002020@bI wonder where Rod is right now...\n@c0@"
  ja: "@a@b%a002020「ロブさんは　いったい今\n\tどこに　いるんだろうね。\n@c0@"
  ko: "@a@b%a002020: 롭 씨는 지금 대체\n어디 있는 걸까?\n@c0@"
  sl: "@a@b%a002020：洛布现在\n　　到底在哪里呢？\n@c0@"
  tl: "@a@b%a002020：洛布現在\n　　到底在哪裡呢？\n@c0@"
4:
  en: "@a%0%a002040@bThere are no monsters here to relieve the tedium.\n@c0@"
  ja: "@a@b%a002040「この　洞くつには\n\tまものが　まったく　いないんだな。\n\tたいくつだぜ。\n@c0@"
  ko: "@a@b%a002040: 이 동굴에는\n마물이 전혀 없네.\n지루하군.\n@c0@"
  sl: "@a@b%a002040：这个洞窟里\n　　完全没有魔物呢。\n　　真是无聊透顶。\n@c0@"
  tl: "@a@b%a002040：這個洞窟裡\n　　完全沒有魔物呢。\n　　真是無聊透頂。\n@c0@"
5:
  en: "@a%0%a002050@bI can't wait to tell old Rod that we battered Gracos.\n@c0@"
  ja: "@a@b%a002050「はやく　ロブさんにも\n\tグラコスを　倒したことを\n\t報告したいですね！\n@c0@"
  ko: "@a@b%a002050: 어서 롭 씨에게도\n그라코스를 쓰러뜨린 이야기를\n해 주고 싶군요!\n@c0@"
  sl: "@a@b%a002050：真想赶快告诉洛布\n　　我们已经打倒了古拉柯斯呢！\n@c0@"
  tl: "@a@b%a002050：真想趕快告訴洛布\n　　我們已經打倒了古拉柯斯呢！\n@c0@"
6:
  en: "@a%0%a002060@b(sniff) Smells...like...sea... (snarl)\n@c0@"
