  tl: "@a@b%a002000：哎呀，這位老爺爺\n　　似乎釣起了一條相當大的魚呢。\n@c0@"
18:
  en: "@a%0%a002010@bWith Gracos gone, hopefully the fish will keep biting from now on.\n@c0@"
  ja: "@a@b%a002010「もう　グラコスは\n\tいないんだから　もっと　たくさん\n\t釣れるように　なるといいわね。\n@c0@"
  ko: "@a@b%a002010: 이제 그라코스가\n없으니 더 많이\n잡을 수 있게 되면 좋겠네.\n@c0@"
