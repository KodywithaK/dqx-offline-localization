26:
  en: "@a%0%a002010@bIt wasn't that long ago we were here, and yet I feel all nostalgic.\n@c0@"
  ja: "@a@b%a002010「ここに　来たのは\n\tそんなに　前でもないのに\n\tなつかしい　気がするわね。\n@c0@"
  ko: "@a@b%a002010: 여기에 온 지가\n그렇게 오래 된 것도 아닌데\n그리운 느낌이 들어.\n@c0@"
  sl: "@a@b%a002010：距离上次来这里\n　　明明没有过去多久，\n　　却让人十分怀念呢。\n@c0@"
