  tl: "@a@b＊：有了。這個送給你吧。\n@c0@"
17:
  en: "@a@b%0%a000090 receives a seed of strength!\n@c0@"
  ja: "@a@b%a000090は　ちからのたねを\nもらった！\n@c0@"
