  ko: "@a@b*: 이곳은 레이독 성 시가지다.\n소란스럽게 하면...... 음?\n자네들은 분명!\n@c0@"
  sl: "@a@b＊：这里是雷多克城区。\n　　任何人不得……嗯？\n　　是你们啊！\n@c0@"
  tl: "@a@b＊：這裡是雷多克城區。\n　　任何人不得……嗯？\n　　是你們啊！\n@c0@"
1:
