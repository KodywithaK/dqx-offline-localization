  sl: "@a@b＊：哎呀。\n　　我的戒指。\n　　是你帮我拿上来的吗？\n@c0@"
  tl: "@a@b＊：哎呀。\n　　我的戒指。\n　　是你幫我拿上來的嗎？\n@c0@"
