9:
  en: "@a@b*: Murdaw is poised to attack, and the King sends us hunting for an antique mirror? Hmph...\n@c0@"
  ja: "@a@b＊「ふーむ。　レイドック王は　なぜ\n\t鏡などを　さがさせて\n\tいるのだろうか……。\n@c0@"
