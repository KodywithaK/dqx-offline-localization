  ja: "@a@bソルディ「せっかく　ラーの鏡を\n\t手に入れたというのに\n\tこんなことに　なるとは……。\n@c0@"
  ko: "@a@b시엘라: 그러면 모든 게\n뚜렷해질 겁니다!\n@c0@"
  sl: "@a@b索迪：好不容易得到太阳神镜，\n　　没想到发生这样的事……\n@c0@"
  tl: "@a@b索迪：好不容易得到太陽神鏡，\n　　沒想到發生這樣的事……\n@c0@"
134:
  en: "@aCaptain Blade@bI hope your victory over Murdaw yields some answers, %a000090. Goddesspeed to you.\n@c0@"
  ja: "@a@bソルディ「ことの真相の　報告を\n\t首を長くして　まっているぞ！\n@c0@"
  ko: "@a@b시엘라: 제가 왜 이 세계에서\n레이독 왕이 돼 있었는지도\n알게 될 거에요.\n@c0@"
  sl: "@a@b索迪：我期待着你回来报告真相！\n@c0@"
  tl: "@a@b索迪：我期待著你回來報告真相！\n@c0@"
135:
  en: "@a@b*: Just because the King's away doesn't mean his guards can play.\n@c0@"
  ja: "@a@b＊「王が　いない間　城や町を\n\t守るのも　兵士の仕事だ。\n@c0@"
  ko: "@a@b시엘라: 자, 가요.\n@c0@"
  sl: "@a@b＊：国王外出的时候，\n　　士兵的职责是守好城池。\n@c0@"
  tl: "@a@b＊：國王外出的時候，\n　　士兵的職責是守好城池。\n@c0@"
136:
  en: "@a@b*: It's a soldier's duty to keep his castle and town safe, even if his liege lord is away on campaign.\n@c0@"
  ja: "@a@b＊「王に　ついてゆけなくても\n\t私は　いじけたり　しないぞ。\n@c0@"
