  ja: "@a@b＊「なんと！　それは　まことか！\n\t王も　さぞ　おどろかれるだろう。\n\tさあ　はやく　王のもとへ！\n@c0@"
  ko: "@a@b*: 아니! 그게 사실인가!?\n폐하도 필시 놀라실 거다.\n자 어서 폐하에게!\n@c0@"
  sl: "@a@b＊：什么！这是真的吗！\n　　国王一定会非常惊喜。\n　　快，快去见国王吧！\n@c0@"
  tl: "@a@b＊：什麼！這是真的嗎！\n　　國王一定會非常驚喜。\n　　快，快去見國王吧！\n@c0@"
3:
  en: "@a@b*: Mmm... Well, good hunting.\n@c0@"
