265:
  en: "@a@b*: He bolted off after His Majesty without telling anyone! It's his job to stay here and protect us! \n@c0@"
  ja: "@a@b＊「とつぜん　王のあとを追うと\n\t出かけてしまって　結局\n\tなにも聞けなかったわい。\n@c0@"
  ko: "@a@b*: 나도 이제 늙은 게 아닌가\n하는 생각마저 듭니다그려.\n어찌 된 일인지......\n@c0@"
  sl: "@a@b＊：就那么一言不发地，\n　　突然追着国王\n　　跑出去了。\n@c0@"
  tl: "@a@b＊：就那麼一言不發地，\n　　突然追著國王\n　　跑出去了。\n@c0@"
266:
  en: "@a@b*: His Majesty sure is late... I hope Murdaw didn't... No, I dare not even think it...\n@c0@"
  ja: "@a@b＊「おそいよなあ　王さま……。\n\tまさか　ムドーに\n\tやられてしまったんじゃ……。\n@c0@"
  ko: "@a@b*: 우리 남편이 아무래도 이상해.\n나까지 실은 할머니가 \n아니냐고...... 싫어라.\n@c0@"
  sl: "@a@b＊：陛下怎么还不回来……\n　　难道说，\n　　他被魔王杀死了……\n@c0@"
  tl: "@a@b＊：陛下怎麼還不回來……\n　　難道說，\n　　他被魔王殺死了……\n@c0@"
267:
  en: "@a@b*: His Majesty will be famished from the fight when he returns — we must prepare an enormous victory feast!\n@c0@"
  ja: "@a@b＊「王さまが　帰ってくるまでに\n\tいっぱい　いっぱい　おいしい物を\n\tつくっておかなきゃね！\n@c0@"
  ko: "@a@b*: 흠냐흠냐......\n응? 레이독 왕의 병환이\n나았다고!? 쿨쿨......\n@c0@"
  sl: "@a@b＊：在国王陛下回来之前，\n　　我得做好多好多的美味才行！\n@c0@"
  tl: "@a@b＊：在國王陛下回來之前，\n　　我得做好多好多的美味才行！\n@c0@"
268:
  en: "@a@b*: Just ignore that stupid prisoner. He loves the sound of his own voice is all.\n@c0@"
  ja: "@a@b＊「囚人が　バカなことを\n\t言っているようですが\n\t気にしないでください。\n@c0@"
  ko: "@a@b*: 앗? 너희로군.\n왕과 함께 떠난 줄\n알았는데 그게 아니었군.\n@c0@"
  sl: "@a@b＊：犯人说的话\n　　只是胡言乱语，\n　　请不要当真。\n@c0@"
  tl: "@a@b＊：犯人說的話\n　　只是胡言亂語，\n　　請不要當真。\n@c0@"
269:
  en: "@a@b*: We're so dead! All of us! The King shoulda been back by now!\n@c0@"
  ja: "@a@b＊「もう　おしめえだよ！\n\t王さまは　まだ　もどって\n\t来ないって　いうじゃないか！\n@c0@"
  ko: "@a@b*: 알고 계십니까?\n레이독 왕의 뒤를 따라\n솔디 님도 길을 떠났답니다.\n@c0@"
  sl: "@a@b＊：这下完蛋了！\n　　国王到现在还没回来！\n@c0@"
  tl: "@a@b＊：這下完蛋了！\n　　國王到現在還沒回來！\n@c0@"
270:
  en: "@a@b*: Murdaw done him in, and you better believe he'll come after us next. Lemme out!\n@c0@"
  ja: "@a@b＊「今度こそ　魔王ムドーに\n\tやられてしまったんだよ！\n@c0@"
  ko: "@a@b*: 도대체 무슨 일이 있었던 게지?\n솔디 병사단장도 뭔가\n이상하고 말이지......\n@c0@"
  sl: "@a@b＊：这次一定是被魔王杀死了！\n@c0@"
  tl: "@a@b＊：這次一定是被魔王殺死了！\n@c0@"
271:
  en: "@a@b*: Did you run into Captain Blade? He hit the road right after you left...\n@c0@"
  ja: "@a@b＊「ソルディ兵士長と　会わなかったか？\n\t兵士長も　おぬしたちが出て　すぐ\n\t王のあとを追っていったのだが……。\n@c0@"
  ko: "@a@b*: 갑자기 왕의 뒤를\n쫓아간 뒤로\n아무 소식이 없다네.\n@c0@"
  sl: "@a@b＊：你们没见到索迪士兵长吗？\n　　你们出发之后不久，\n　　士兵长就追出去了。\n@c0@"
  tl: "@a@b＊：你們沒見到索迪士兵長嗎？\n　　你們出發之後不久，\n　　士兵長就追出去了。\n@c0@"
272:
  en: "@a@b*: What could the chancellor be so nervous about? He should be setting an example for us all!\n@c0@"
  ja: "@a@b＊「どうしたんでしょう。\n\t大臣が　なにやら\n\t落ちつかないようす　なんです。\n@c0@"
  ko: "@a@b*: 늦구먼, 폐하가.....\n설마 무도한테\n당한 건 아니겠지......\n@c0@"
  sl: "@a@b＊：发生什么了。\n　　大臣好像很焦急的样子。\n@c0@"
  tl: "@a@b＊：發生什麼了。\n　　大臣好像很焦急的樣子。\n@c0@"
273:
  en: "@a@b*: I sure hope His Majesty and Captain Blade are alright! I feel so useless guarding an empty castle!\n@c0@"
  ja: "@a@b＊「わが王と　ソルディ兵士長は\n\tご無事であろうか……。\n\tくそ！　私も　行きたかったな！\n@c0@"
  ko: "@a@b*: 폐하가 돌아오실 때까지\n맛있는 음식을\n듬뿍 준비해 놔야지!\n@c0@"
  sl: "@a@b＊：国王和索迪士兵长\n　　是否平安无事呢……\n　　可惜！我要是也能去就好了！\n@c0@"
  tl: "@a@b＊：國王和索迪士兵長\n　　是否平安無事呢……\n　　可惜！我要是也能去就好了！\n@c0@"
274:
  en: "@a@b*: His Majesty won't lose, will he? I mean, he can't, right? Ohh, my poor stomach can't take this...\n@c0@"
  ja: "@a@b＊「王さまは　ムドーに負けないよね。\n\tぜったいに　勝ってくるよね。\n\tああ　もう　気が気じゃないよ。\n@c0@"
  ko: "@a@b*: 죄수가 황당한 말을\n지껄이는 것 같던데\n신경 쓰지 마십시오.\n@c0@"
  sl: "@a@b＊：国王不会输给姆多吧。\n　　他一定会赢的。\n　　哎呀，实在没法冷静啊。\n@c0@"
  tl: "@a@b＊：國王不會輸給姆多吧。\n　　他一定會贏的。\n　　哎呀，實在沒法冷靜啊。\n@c0@"
275:
  en: "@a@b*: Ah! Finally, you're back! Do you know where Captain Blade is?\n@c0@"
  ja: "@a@b＊「おお　おぬしたち！\n\tやっと　もどったかっ！\n\tして　あの女性と兵士長は？\n@c0@"
  ko: "@a@b*: 이제 다 끝장이야!\n아직도 폐하가\n돌아오지 않았다잖아!\n@c0@"
  sl: "@a@b＊：哦哦，是你们啊！\n　　终于回来了！\n　　那么，那位女性和士兵长呢？\n@c0@"
  tl: "@a@b＊：哦哦，是你們啊！\n　　終於回來了！\n　　那麼，那位女性和士兵長呢？\n@c0@"
276:
  en: "@a@b*: What? He and that woman made the return trip ahead of you? Well, they certainly aren't here!\n@c0@"
  ja: "@a@b＊「なんと！　女性と兵士長は\n\t先に城に　もどったはずだと！？\n\tしかし　もどっては　おらぬぞ！\n@c0@"
  ko: "@a@b*: 이번엔 분명 마왕 무도한테\n당한 게 틀림없어!\n@c0@"
  sl: "@a@b＊：什么！你说\n　　她和士兵长先回来了？！\n　　但是他们没回这里啊！\n@c0@"
  tl: "@a@b＊：什麼！你說\n　　她和士兵長先回來了？！\n　　但是他們沒回這裡啊！\n@c0@"
277:
  en: "@a@b*: Wait, there's more? Murdaw was King Somnus all along? Talk sense, will you! Are you serious?\n@c0@"
  ja: "@a@b＊「え？　なに？　それに\n\tムドーは　やはり\n\tレイドック王だったと？\n@c0@"
  ko: "@a@b*: 솔디 병사단장과 못 만난 거야?\n병사단장도 자네들이 나간 뒤 곧바로\n왕의 뒤를 따라갔는데......\n@c0@"
  sl: "@a@b＊：啊？什么？\n　　姆多的确是\n　　雷多克王变的？\n@c0@"
  tl: "@a@b＊：啊？什麼？\n　　姆多的確是\n　　雷多克王變的？\n@c0@"
278:
  en: "@a@b*: Gahh! I don't understand a single word you're saying! Did you get hit on the head or something?\n@c0@"
  ja: "@a@b＊「どうしたというのだっ！\n\tおぬしたちの　いっていることは\n\tさっぱり　わからんわい！\n@c0@"
  ko: "@a@b*: 어찌 된 걸까요?\n대신이 뭔가\n불안해 보입니다.\n@c0@"
  sl: "@a@b＊：这到底是怎么回事！\n　　我完全无法理解\n　　你们在说什么！\n@c0@"
  tl: "@a@b＊：這到底是怎麼回事！\n　　我完全無法理解\n　　你們在說什麼！\n@c0@"
279:
  en: "@a@b*: I only know one thing for sure: they aren't back yet. Perhaps they stopped at an inn? Or took a detour? \n@c0@"
  ja: "@a@b＊「まあ　よい。　先にもどったと\n\tいうのなら　どこかで　行きちがいに\n\tなったのかもしれぬ。\n@c0@"
  ko: "@a@b*: 폐하와 솔디 병사단장은\n무사하실까......?\n빌어먹을! 나도 가고 싶었는데!\n@c0@"
  sl: "@a@b＊：算了。\n　　他们先行一步，\n　　也许与你们走了不同的路。\n@c0@"
  tl: "@a@b＊：算了。\n　　他們先行一步，\n　　也許與你們走了不同的路。\n@c0@"
280:
  en: "@a@b*: All we can do is wait. You'd better rest here until they return.\n@c0@"
  ja: "@a@b＊「とにかく　待つことにしよう。\n\tおぬしたちも　ゆっくりと\n\t休むがよい。\n@c0@"
  ko: "@a@b*: 폐하가 무도한테 질 리가 없어.\n꼭 이기고 돌아오실 거야.\n아아, 안절부절못하겠어.\n@c0@"
  sl: "@a@b＊：先等等看吧。\n　　你们可以好好休息一下。\n@c0@"
  tl: "@a@b＊：先等等看吧。\n　　你們可以好好休息一下。\n@c0@"
281:
  en: "@a@b%3One look into Ra's mirror transformed the young King Somnus into a mysterious woman named Apnea...%4\n@c0@"
  ja: "@a@b%3若きレイドック王は　ラーの鏡（かがみ）で\nシェーラという女性に　姿をかえ……%4\n@c0@"
  ko: "@a@b*: 오호, 자네들!\n드디어 돌아왔군!\n그 여자와 병사단장은?\n@c0@"
  sl: "@a@b%3年轻的雷多克王照了镜子，\n变成了名叫谢菈的女性……%4\n@c0@"
  tl: "@a@b%3年輕的雷多克王照了鏡子，\n變成了名叫謝菈的女性……%4\n@c0@"
282:
  en: "@a@b%3Another look turned the dark tyrant Murdaw into a second, much older King Somnus...%4\n@c0@"
  ja: "@a@b%3魔王ムドーも　また　ラーの鏡で\nもうひとりの　レイドック王に……%4\n@c0@"
  ko: "@a@b*: 뭐라고! 그 여자와 병사단장은\n먼저 성에 돌아갔다고!?\n하지만 아무도 돌아오지 않았네!\n@c0@"
  sl: "@a@b%3魔王姆多照了镜子，\n变成了另一个雷多克王……%4\n@c0@"
  tl: "@a@b%3魔王姆多照了鏡子，\n變成了另一個雷多克王……%4\n@c0@"
283:
  en: "@a@b%3Where could they be? And what of Captain Blade, whom they both referred to as ‘Rusty’?%4\n@c0@"
  ja: "@a@b%3そして　トムとよばれるソルディ兵士長。\nいったい　３人は　どこに行って\nしまったのか……。%4\n@c0@"
  ko: "@a@b*: 응? 뭐라? 게다가\n레이독 왕이 역시\n무도였다고?\n@c0@"
  sl: "@a@b%3还有被称为托姆的索迪士兵长。\n他们三个人\n究竟去哪里了……%4\n@c0@"
  tl: "@a@b%3還有被稱為托姆的索迪士兵長。\n他們三個人\n究竟去哪裡了……%4\n@c0@"
284:
  en: "@a@b%3His numerous questions unanswered, the chancellor endured a long, sleepless night...%4\n@c0@"
  ja: "@a@b%3王たちの帰りを待つ大臣の\n眠れぬ　長い夜が　明けた……。%4\n@c0@"
  ko: "@a@b*: 무슨 헛소리!\n자네들이 하는 말은\n도통 이해가 되질 않는군!\n@c0@"
  sl: "@a@b%3等待国王归来的大臣彻夜未眠。\n然后，天亮了……%4\n@c0@"
  tl: "@a@b%3等待國王歸來的大臣徹夜未眠。\n然後，天亮了……%4\n@c0@"
285:
  en: "@a@b*: Well, I am officially at my wits' end. We have waited all night with no word whatsoever.\n@c0@"
  ja: "@a@b＊「ど　どうしたと　いうのだ……。\n\tこれほど待っても　いまだ\n\tもどってこぬとは……。\n@c0@"
  ko: "@a@b*: 뭐, 좋네. 먼저 돌아갔다면\n어디선가 길이 엇갈린 \n걸 수도 있지.\n@c0@"
  sl: "@a@b＊：这、这到底是怎么回事……\n　　等了这么久，\n　　现在还没回来……\n@c0@"
  tl: "@a@b＊：這、這到底是怎麼回事……\n　　等了這麼久，\n　　現在還沒回來……\n@c0@"
286:
  en: "@a@b*: I have no other option but to consider them officially missing. I implore you, you must go in search of them...\n@c0@"
  ja: "@a@b＊「おお　そうじゃ！\n\tおぬしたち　もう　いっぺん\n\tさがしてきてくれぬか？\n@c0@"
  ko: "@a@b*: 아무튼 기다리기로 하지.\n자네들도 푹\n쉬게나.\n@c0@"
  sl: "@a@b＊：哦哦对了！\n　　能不能请你们几位\n　　去找一找？\n@c0@"
  tl: "@a@b＊：哦哦對了！\n　　能不能請你們幾位\n　　去找一找？\n@c0@"
287:
  en: "@a@b*: We had best keep this situation secret from the rest of the castle for the time being.\n@c0@"
  ja: "@a@b＊「城の者たちには　このこと\n\tいましばらく　ないしょに\n\tしておこうぞ。\n@c0@"
  ko: "@a@b%3젊은 레이독 왕은 라의 거울로\n시엘라라는 여성으로 모습을 바꾸었고......%4  \n@c0@"
  sl: "@a@b＊：这件事情暂时要对\n　　城堡里的人保密。\n@c0@"
  tl: "@a@b＊：這件事情暫時要對\n　　城堡裡的人保密。\n@c0@"
288:
  en: "@a%0%a002020@bWait! That's it! I think I get what's going on! The King told us to come to his castle, right?\n@c0@"
  ja: "@a@b%a002020「わかったわ！\n\tあの時　王さまは　城に来いって\n\t言ったわよねっ。\n@c0@"
  ko: "@a@b%3마왕 무도도 라의 거울로\n또 다른 레이독 왕으로 변신......%4  \n@c0@"
  sl: "@a@b%a002020：我明白了！\n　　那个时候，国王说的是\n　　“到城堡来”对吧。\n@c0@"
  tl: "@a@b%a002020：我明白了！\n　　那個時候，國王說的是\n　　“到城堡來”對吧。\n@c0@"
289:
  ko: "@a@b%3그리고 톰이라고 불리는 솔디 병사단장.\n대체 이 세 사람은 어디로\n가버렸을까......%4\n@c0@"
290:
  ko: "@a@b%3왕과 그 일행들의 귀환을 기다리는 대신의\n잠 못 이루는 긴 밤이 밝았다......%4  \n@c0@"
291:
  ko: "@a@b*: 대, 대체 무슨 영문인지......\n아무리 기다려도\n돌아오질 않으니......\n@c0@"
292:
  ko: "@a@b*: 오오, 그렇지!\n자네들이 한 번 더\n찾아봐 주지 않겠나?\n@c0@"
293:
  ko: "@a@b*: 성안 사람들한테는\n이 사실을 잠시 비밀로\n해두겠네.\n@c0@"
294:
  ko: "@a@b%a002020: 알겠다!\n그때 왕이 성에\n오라고 했었잖아?\n@c0@"
