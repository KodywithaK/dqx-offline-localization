  tl: "@a@b＊：但是我仍然不想死。\n　　人一旦死了，\n　　就什麼都沒了。\n@c0@"
21:
  en: "@a@b*: Young King Somnus, leading the battle charge himself... He's a warrior king, that's for sure.\n@c0@"
