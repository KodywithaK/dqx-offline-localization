  sl: "@a@b＊：啊！我也想去啊！\n@c0@"
  tl: "@a@b＊：啊！我也想去啊！\n@c0@"
140:
  en: "@a@b*: Well, the day is finally here. King Somnus of Somnia against Murdaw the Dread Fiend.\n@c0@"
  ja: "@a@b＊「いよいよ　王さまが\n\t魔王ムドーを　たおしに\n\t行くんだってね。\n@c0@"
