  sl: "@a@b＊：你们受了雷多克王的命令，\n　　出去寻找太阳神镜了。\n　　那么，找到了吗？\n@c0@"
  tl: "@a@b＊：你們受了雷多克王的命令，\n　　出去尋找太陽神鏡了。\n　　那麼，找到了嗎？\n@c0@"
2:
