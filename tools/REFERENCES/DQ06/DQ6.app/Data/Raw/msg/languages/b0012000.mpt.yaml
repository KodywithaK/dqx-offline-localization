18:
  en: "@a@b*: You're not from around here, right? Well, enjoy the big city! Good luck finding fame and glory and whatnot.\n@c0@"
  ja: "@a@b＊「田舎から　出てきたんだろ。\n\tはやく出世して　ふるさとに\n\tにしきを　かざりなよ。\n@c0@"
