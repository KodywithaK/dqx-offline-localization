  sl: "@a@b＊：昨晚王宫中发生了什么？\n　　我看见士兵长\n　　匆匆忙忙地走过……\n@c0@"
  tl: "@a@b＊：昨晚王宮中發生了什麼？\n　　我看見士兵長\n　　匆匆忙忙地走過……\n@c0@"
138:
  en: "@a@b*: I heard the news from Captain Blade. His Majesty set off for Murdaw last night, no?\n@c0@"
  ja: "@a@b＊「ソルディ兵士長から　聞いたぞ。\n\t昨夜のうちに　レイドック王は\n\tムドー討ばつに　むかったと。\n@c0@"
