  sl: "@a@b＊：即使不能跟在陛下身边，\n　　我也会好好工作的。\n@c0@"
  tl: "@a@b＊：即使不能跟在陛下身邊，\n　　我也會好好工作的。\n@c0@"
137:
  en: "@a@b*: Did something happen in the throne room last night? Captain Blade looked shaken up...\n@c0@"
