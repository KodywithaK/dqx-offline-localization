10:
  en: "@a@b*: Wonderful. Just wonderful. I had to go and drop my precious ring into the well, didn't I?\n@c0@"
  ja: "@a@b＊「あーら　こまったわ。\n\t井戸のなかに　ゆびわを\n\tおとしちゃったのよ。\n@c0@"
