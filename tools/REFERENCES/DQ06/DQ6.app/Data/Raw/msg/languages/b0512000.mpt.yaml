  ja: "@a@b%a002050「いちど　だんなさまに\n\tちょくせつ　聞いてみては\n\tいかがでしょう？\n@c0@"
  ko: "@a@b%a002050: 일단 남편 분께\n직접 물어보는 게\n어떨까요?\n@c0@"
  sl: "@a@b%a002050：不如直接问你丈夫吧？\n@c0@"
  tl: "@a@b%a002050：不如直接問你丈夫吧？\n@c0@"
66:
  en: "@a%0%a002000@bHuh. Maybe he's got a gamblin' problem.\n@c0@"
  ja: "@a@b%a002000「まさか　町長が\n\tカジノで　大ぞんしたとか……。\n@c0@"
  ko: "@a@b%a002000: 혹시 촌장이\n카지노에서 큰 돈을 잃었다든가......\n@c0@"
  sl: "@a@b%a002000：是不是镇长\n　　在赌场输了很多钱……\n@c0@"
  tl: "@a@b%a002000：是不是鎮長\n　　在賭場輸了很多錢……\n@c0@"
67:
  en: "@a%0%a002010@bIf the Village Chief is short of money, he must be in some kind of trouble...\n@c0@"
  ja: "@a@b%a002010「町長さんには\n\tなにか　とても　こまったことが\n\tおきているみたいね。\n@c0@"
