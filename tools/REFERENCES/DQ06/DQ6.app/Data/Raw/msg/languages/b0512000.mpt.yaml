  ja: "@a@b%a002050「心配するな　ワンくん！\n\tエリザさんは　きっと私たちが\n\t助けてみせる！\n@c0@"
  ko: "@a@b%a002050: 걱정 마, 멍멍아!\n엘리자 씨는 우리가 반드시\n구해낼 테니까!\n@c0@"
