  ja: "@a@b%a002010「町長さんの\n\t娘さんが　心配ね。\n@c0@"
  ko: "@a@b%a002010: 촌장님의\n따님이 걱정이네요.\n@c0@"
  sl: "@a@b%a002010：真为镇长的女儿担心。\n@c0@"
  tl: "@a@b%a002010：真為鎮長的女兒擔心。\n@c0@"
74:
  en: "@a%0%a002010@bLet's get to that overgrown well up north right away!\n@c0@"
  ja: "@a@b%a002010「北の荒れ井戸に\n\t行ってみましょう！\n@c0@"
