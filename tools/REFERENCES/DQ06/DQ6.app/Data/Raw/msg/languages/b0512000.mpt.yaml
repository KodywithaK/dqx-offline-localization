  sl: "@a@b%a002010：镇长可能碰到了什么大麻烦。\n@c0@"
  tl: "@a@b%a002010：鎮長可能碰到了什麼大麻煩。\n@c0@"
68:
  en: "@a%0%a002020@bI hope he didn't do anything illegal!\n@c0@"
  ja: "@a@b%a002020「タバコ　けむ～い！\n@c0@"
  ko: "@a@b%a002020: 담배 연기 싫어!\n@c0@"
  sl: "@a@b%a002020：烟味好呛人～\n@c0@"
  tl: "@a@b%a002020：煙味好嗆人～\n@c0@"
69:
  en: "@a%0%a002030@bFor the Village Chief to be scrabbling around for gold coins is rather unseemly... I wonder what's the matter?\n@c0@"
  ja: "@a@b%a002030「町長ほどの　かたが\n\t人から　お金を借りるというのは\n\tよほどのことが　あったのでしょう。\n@c0@"
