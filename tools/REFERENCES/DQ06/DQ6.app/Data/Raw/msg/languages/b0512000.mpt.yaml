  en: "@a%0%a002020@b%0%a000090! Let's find who did this and rough 'em up!\n@c0@"
  ja: "@a@b%a002020「%a000090！\n\tあたしたちで　犯人を\n\tやっつけて　やろうよ！\n@c0@"
