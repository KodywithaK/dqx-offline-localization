  tl: "@a@b%a002050：為了這種突發事件，\n　　平時還是存點錢比較好吧。\n@c0@"
71:
  en: "@a%0%a002050@bYou won't see old %a002050 havin' to go round beggin' for money! That's not how I was brought up!\n@c0@"
  ja: "@a@b%a002050「ほら　昔からいうじゃないですか\n\tそなえあれば　うれしいな…\n\t…でしたっけ？\n@c0@"
  ko: "@a@b%a002050: 옛말에도 있잖아요.\n무비유환......이라고.\n......맞나요?\n@c0@"
  sl: "@a@b%a002050：你看，有句老话说得好，\n　　人有储金而后无忧……\n　　……是这么说的吧？\n@c0@"
  tl: "@a@b%a002050：你看，有句老話說得好，\n　　人有儲金而後無憂……\n　　……是這麼說的吧？\n@c0@"
72:
  en: "@a%0%a002000@bHuh. He must've come here lookin' for help with the ransom money...\n@c0@"
  ja: "@a@b%a002000「そっか。\n\t町長は　娘を　さらわれたから\n\tここに　金を借りに……。\n@c0@"
  ko: "@a@b%a002000: 그랬군.\n촌장은 딸이 납치당했기 때문에\n이곳에 돈을 빌리러......\n@c0@"
  sl: "@a@b%a002000：这样啊。\n　　女儿被绑架了，\n　　所以镇长要筹措赎金……\n@c0@"
  tl: "@a@b%a002000：這樣啊。\n　　女兒被綁架了，\n　　所以鎮長要籌措贖金……\n@c0@"
73:
