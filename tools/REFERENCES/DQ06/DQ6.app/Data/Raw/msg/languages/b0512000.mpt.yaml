  sl: "@a@b%a002010：我们去北边的废井看看吧！\n@c0@"
  tl: "@a@b%a002010：我們去北邊的廢井看看吧！\n@c0@"
75:
  en: "@a%0%a002020@bC'mon, let's go save Cynthia!\n@c0@"
  ja: "@a@b%a002020「早く　エリザちゃんを\n\t助けに　行こ！\n@c0@"
  ko: "@a@b%a002020: 빨리 엘리자를\n구하러 가자!\n@c0@"
  sl: "@a@b%a002020：我们快点去救艾莉莎妹妹！\n@c0@"
  tl: "@a@b%a002020：我們快點去救艾莉莎妹妹！\n@c0@"
76:
