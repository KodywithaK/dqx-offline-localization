  sl: "@a@b%a002030：镇长已经不在这里了。\n　　我们去北边的废井吧！\n@c0@"
  tl: "@a@b%a002030：鎮長已經不在這裡了。\n　　我們去北邊的廢井吧！\n@c0@"
77:
  en: "@a%0%a002050@b...So did this fellow lend the Village Chief those five-thousand gold coins in the end? It's hard to tell!\n@c0@"
  ja: "@a@b%a002050「こっ　このかたは\n\t５０００ゴールド　貸したんでしょうか\n\t貸さなかったんでしょうか！？\n@c0@"
