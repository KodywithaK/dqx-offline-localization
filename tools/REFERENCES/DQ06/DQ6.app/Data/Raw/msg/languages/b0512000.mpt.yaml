  ko: "@a@b%a002000: 그래, 그래.\n너도 걱정되나 보구나.\n착하기도 하지.\n@c0@"
  sl: "@a@b%a002000：你也在担心啊，\n　　真是个乖孩子。\n@c0@"
  tl: "@a@b%a002000：你也在擔心啊，\n　　真是個乖孩子。\n@c0@"
79:
  en: "@a%0%a002010@bSeems like even this dog is worried about poor Cynthia.\n@c0@"
  ja: "@a@b%a002010「ワンちゃんも\n\t心配しているみたい。\n\tおりこうさんね。\n@c0@"
  ko: "@a@b%a002010: 멍멍이도\n걱정하고 있나 봐.\n기특해라.\n@c0@"
  sl: "@a@b%a002010：小狗好像也在担心啊。\n　　真是个好孩子。\n@c0@"
  tl: "@a@b%a002010：小狗好像也在擔心啊。\n　　真是個好孩子。\n@c0@"
80:
