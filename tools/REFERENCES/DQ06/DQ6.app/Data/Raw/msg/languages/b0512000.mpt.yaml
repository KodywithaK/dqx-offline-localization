  sl: "@a@b%a002030：如果连镇长这样的人\n　　也要向别人借钱的话，\n　　一定是发生了什么大事了。\n@c0@"
  tl: "@a@b%a002030：如果連鎮長這樣的人\n　　也要向別人借錢的話，\n　　一定是發生了什麼大事了。\n@c0@"
70:
  en: "@a%0%a002050@bAs a young lad, I was always taught to save my gold coins for a rainy day.\n@c0@"
  ja: "@a@b%a002050「もしものときに　そなえて\n\tお金は　ためておいたほうが\n\tいいですよね。\n@c0@"
