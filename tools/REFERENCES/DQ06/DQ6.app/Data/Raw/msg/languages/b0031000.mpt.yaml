  tl: "@a@b＊：而且從那裡一直往北，\n　　能到達一口井，據說從那口井\n　　能去往另外一個世界。\n@c0@"
57:
  en: "@a@b*: If I only had possession of the flying bed, I could journey there in a trice and confirm the truth of these tales...\n@c0@"
  ja: "@a@b＊「もし　空とぶベッドを　手に入れたなら\n\tそんな不思議な場所へも　自由に\n\t行けるかもしれませんね。\n@c0@"
  ko: "@a@b*: 사람이 인어도 아니고\n바다 밑바닥까지 확인하러 갈 수는\n없는 노릇이지.\n@c0@"
  sl: "@a@b＊：如果得到了飞天床的话，\n　　应该就能自由地去往那种\n　　不可思议的地方了吧。\n@c0@"
  tl: "@a@b＊：如果得到了飛天床的話，\n　　應該就能自由地去往那種\n　　不可思議的地方了吧。\n@c0@"
58:
  en: "@a@b*: Gooness gracious! Was that you gooing by like greased lightning on that bed?\n@c0@"
  ja: "@a@b＊「わわっ！　キミは\n\t空とぶベッドに　乗ってたひと？\n@c0@"
  ko: "@a@b*: 소문으로는 여기서 한참 북서쪽\n바다 어딘가에 커다란 구멍이\n나 있다고 합니다.\n@c0@"
  sl: "@a@b＊：哇！你就是\n　　坐在飞天床上的人？\n@c0@"
  tl: "@a@b＊：哇！你就是\n　　坐在飛天床上的人？\n@c0@"
59:
  en: "@a@b*: By the Gooddess, I'd love to goo around the world on one of thooze some day!\n@c0@"
  ja: "@a@b＊「やった！\n\tボク　空を　思いっきり\n\t飛んでみたかったんだ。\n@c0@"
  ko: "@a@b*: 게다가 거기서 더 북쪽으로\n한참 가면 어떤 우물이 나오는데\n거길 통해 다른 세계로 갈 수도 있다고.\n@c0@"
  sl: "@a@b＊：太好了！\n　　我也想尽情地\n　　在空中飞呢。\n@c0@"
  tl: "@a@b＊：太好了！\n　　我也想盡情地\n　　在空中飛呢。\n@c0@"
60:
  en: "@a@b*: Let me goo with you! You will say yes, won't you?\n@c0@"
  ja: "@a@b＊「空とぶベッドに　乗せてよ！\n@c0@"
  ko: "@a@b*: 혹시 하늘을 나는 침대를 얻으면\n그런 신비한 곳으로도 자유롭게\n갈 수 있을지 모르죠.\n@c0@"
  sl: "@a@b＊：让我也坐坐飞天床吧！\n@c0@"
  tl: "@a@b＊：讓我也坐坐飛天床吧！\n@c0@"
61:
  en: "@a@b*: Gooray! My name's %a002110, by the way.\n@c0@"
