  sl: "@a@b＊：啊！\n　　是飞天床啊！\n　　床又在天上飞了！\n@c0@"
  tl: "@a@b＊：啊！\n　　是飛天床啊！\n　　床又在天上飛了！\n@c0@"
34:
  en: "@a@b*: Why, I have no idea who is riding on it, but it sure is wonderful to see it back!\n@c0@"
  ja: "@a@b＊「だれが　のっとるかは知らんが\n\tよかったのう。\n\t本当に　よかったのう。\n@c0@"
  ko: "@a@b존: %a000120,\n정말 고마워!\n그럼 안녕......\n@c0@"
  sl: "@a@b＊：虽然不知道谁坐在上面，\n　　不过这真是太好了，\n　　太好了啊。\n@c0@"
  tl: "@a@b＊：雖然不知道誰坐在上面，\n　　不過這真是太好了，\n　　太好了啊。\n@c0@"
35:
  en: "@a@b%0%a000120 receives the flying bed!\n@c0@"
  ja: "@a@b%a000120は　空とぶベッドを\n手に入れた！\n@c0@"
  ko: "@a@b*: 우왓!! 저건 뭐지?!\n@c0@"
  sl: "@a@b%a000120得到了飞天床！\n@c0@"
  tl: "@a@b%a000120得到了飛天床！\n@c0@"
36:
  en: "@a@b*: G-Golly. Did...did you see it!?\n@c0@"
  ja: "@a@b＊「あ　あんた　見たかいっ？\n@c0@"
  ko: "@a@b*: 아앗~!\n하늘을 나는 침대다! 침대가\n또 하늘을 날고 있어!\n@c0@"
  sl: "@a@b＊：啊，你看到了吗？\n@c0@"
  tl: "@a@b＊：啊，你看到了嗎？\n@c0@"
37:
  en: "@a@b*: You did? I say, wasn't it simply wonderful!?\n@c0@"
  ja: "@a@b＊「そうか！　見たか！\n\tきれいだったろう。　なっなっ！\n@c0@"
  ko: "@a@b*: 누가 타고 있는지는 모르겠지만\n다행이구먼.\n참말로 다행이야......\n@c0@"
  sl: "@a@b＊：是吗！看到了啊！\n　　是不是很漂亮！\n@c0@"
  tl: "@a@b＊：是嗎！看到了啊！\n　　是不是很漂亮！\n@c0@"
38:
  en: "@a@b*: You didn't!? My, that's a shame. It came back, you know! The flying bed soars through the skies once more!\n@c0@"
  ja: "@a@b＊「そりゃ　ざんねんだったな。\n\tベッドが……　空とぶベッドが\n\tもどってきたんだよ！\n@c0@"
  ko: "@a@b%a000120%F0120%X는%Y은%Z 하늘을 나는 침대를\n획득했다!\n@c0@"
  sl: "@a@b＊：那可真是遗憾啊。\n　　那床……飞天床\n　　又回来了哦！\n@c0@"
  tl: "@a@b＊：那可真是遺憾啊。\n　　那床……飛天床\n　　又回來了哦！\n@c0@"
39:
  en: "@a@b*: Hark! I have journeyed many leagues to this hamlet in search of the truth behind tales of a bed that flies.\n@c0@"
  ja: "@a@b＊「私は　空とぶベッドの\n\tウワサを　聞いて\n\tこの町に　やって来ました。\n@c0@"
  ko: "@a@b*: 다, 당신 봤어?\n@c0@"
  sl: "@a@b＊：我听说了飞天床的传说，\n　　才到这个镇子来的。\n@c0@"
  tl: "@a@b＊：我聽說了飛天床的傳說，\n　　才到這個鎮子來的。\n@c0@"
40:
  en: "@a@b*: ‘Forsooth,’ I figured, ‘only a fairy-tale village would play host to such a romantic spectacle.’\n@c0@"
  ja: "@a@b＊「そんな　ロマンチックなことが\n\tおこる町だったら　きっと\n\tステキな所だろうと思いましてね。\n@c0@"
  ko: "@a@b*: 그래! 봤군!\n아름다웠어. 그렇지!\n@c0@"
  sl: "@a@b＊：这个镇子会发生\n　　这么浪漫的事情，\n　　一定是个很棒的地方。\n@c0@"
  tl: "@a@b＊：這個鎮子會發生\n　　這麼浪漫的事情，\n　　一定是個很棒的地方。\n@c0@"
41:
  en: "@a@b*: I am fortunate to have been born into a world rich with such wonders. Perhaps they will inspire my dreams!\n@c0@"
  ja: "@a@b＊「せっかく　この世に\n\t生まれてきたのなら　夢のある\n\t人生を　おくりたいものです。\n@c0@"
  ko: "@a@b*: 거참 아깝겠군.\n침대가...... 하늘을 나는 침대가\n돌아왔다고!\n@c0@"
  sl: "@a@b＊：人生难得一世，\n　　真希望能够活得\n　　有梦想有追求啊。\n@c0@"
  tl: "@a@b＊：人生難得一世，\n　　真希望能夠活得\n　　有夢想有追求啊。\n@c0@"
42:
  en: "@a@b*: I finally saw it, by golly! The fabled flying bed! I saw it with my own peepers!\n@c0@"
  ja: "@a@b＊「見ましたよ！　ついに　ウワサの\n\t空とぶベッドを！\n@c0@"
  ko: "@a@b*: 저는 하늘을 나는 침대에 대한\n소문을 듣고\n이 마을을 찾아왔습니다.\n@c0@"
  sl: "@a@b＊：我终于看到了\n　　传说中的飞天床！\n@c0@"
  tl: "@a@b＊：我終於看到了\n　　傳說中的飛天床！\n@c0@"
43:
  en: "@a@b*: It looks as though piloting it requires a little more bravery than I can muster, though. I doubt I could fly it myself.\n@c0@"
  ja: "@a@b＊「しかし　とても　私などが\n\t手に入れられるような物では\n\tないですな。\n@c0@"
  ko: "@a@b*: 그런 로맨틱한 일이\n일어나는 마을이라면 분명\n멋진 곳일 거라 생각했죠.\n@c0@"
  sl: "@a@b＊：不过那种东西\n　　不是我这种人能得到的。\n@c0@"
  tl: "@a@b＊：不過那種東西\n　　不是我這種人能得到的。\n@c0@"
44:
  en: "@a@b*: I suppose such unique thrills must be reserved for rather more...special individuals than myself...\n@c0@"
  ja: "@a@b＊「きっと　なにか　特別なひとの\n\t乗り物だと　思いますよ。\n@c0@"
  ko: "@a@b*: 이왕 이 세상에\n태어난 거, 꿈이 있는\n인생을 살고 싶습니다.\n@c0@"
  sl: "@a@b＊：那一定是某个\n　　特殊人物乘坐的东西吧。\n@c0@"
  tl: "@a@b＊：那一定是某個\n　　特殊人物乘坐的東西吧。\n@c0@"
45:
  en: "@a@b*: Eh heh heh! The little missy's quite smitten with me. Guess I still got it.\n@c0@"
  ja: "@a@b＊「ほっほっほっ。　こんな　若いムスメに\n\tほれられるとはのう。\n@c0@"
  ko: "@a@b*: 봤어요! 드디어 소문으로만 듣던\n하늘을 나는 침대를 봤다구요!\n@c0@"
  sl: "@a@b＊：呵呵呵，居然被\n　　这么年轻的小姑娘仰慕啊。\n@c0@"
  tl: "@a@b＊：呵呵呵，居然被\n　　這麼年輕的小姑娘仰慕啊。\n@c0@"
46:
  en: "@a@b*: Who needs a flying bed? I feel like I'm soaring right here on solid ground!\n@c0@"
  ja: "@a@b＊「まるで　ベッドにのって\n\t空を　とんでいるような気分じゃよ。\n@c0@"
  ko: "@a@b*: 하지만 겨우 저 같은 사람이\n가질 수 있는 물건이\n아닌 것 같더군요.\n@c0@"
  sl: "@a@b＊：这心情就像坐在床上\n　　在天上飞呢。\n@c0@"
  tl: "@a@b＊：這心情就像坐在床上\n　　在天上飛呢。\n@c0@"
47:
  en: "@a@b*: Gee-whiz. I...I really saw it, didn't I?\n@c0@"
  ja: "@a@b＊「オ……　オレ\n\tやっぱり　見ちゃったよ。\n@c0@"
  ko: "@a@b*: 틀림없이 특별한 사람이\n타는 물건일 겁니다.\n@c0@"
  sl: "@a@b＊：我……\n　　我的确是看到了。\n@c0@"
  tl: "@a@b＊：我……\n　　我的確是看到了。\n@c0@"
48:
  en: "@a@b*: The flying bed, launching out from the second-floor balcony... What a sight!\n@c0@"
  ja: "@a@b＊「そこの家の　２階から\n\tベッドが　すーっと　空に\n\tとんで行くのを……。\n@c0@"
  ko: "@a@b*: 홋홋홋. 이렇게 젊은 아가씨한테\n구애를 받을 줄이야.\n@c0@"
  sl: "@a@b＊：从那家房子的２楼，\n　　有一张床嗖地一下\n　　飞到了空中……\n@c0@"
  tl: "@a@b＊：從那家房子的２樓，\n　　有一張床嗖地一下\n　　飛到了空中……\n@c0@"
49:
  en: "@a@b*: The boy in this grave was more than my master — he was my best friend...\n@c0@"
  ja: "@a@b＊「ここには　ボクの　大切な\n\tご主人さまが　眠っているんです。\n@c0@"
  ko: "@a@b*: 마치 침대를 타고\n하늘을 나는 기분이로구먼.\n@c0@"
  sl: "@a@b＊：我最爱的主人\n　　长眠于此。\n@c0@"
  tl: "@a@b＊：我最愛的主人\n　　長眠於此。\n@c0@"
50:
  en: "@a@b*: Strange, though — it felt almost as if he was here for a moment earlier...\n@c0@"
  ja: "@a@b＊「でも　さっき　ご主人さまが\n\tもどってきたような……。\n@c0@"
  ko: "@a@b*: 나......나 말이야,\n또 봐 버렸어.\n@c0@"
  sl: "@a@b＊：不过，感觉主人\n　　刚才好像回来了……\n@c0@"
  tl: "@a@b＊：不過，感覺主人\n　　剛才好像回來了……\n@c0@"
51:
  en: "@a@b*: I say, this is just a rumour...\n@c0@"
  ja: "@a@b＊「これは　あくまで\n\tウワサなのだが……\n@c0@"
  ko: "@a@b*: 저 집 2층에서\n침대가 스윽 하늘로\n날아가는 모습을......\n@c0@"
  sl: "@a@b＊：这只是个传言……\n@c0@"
  tl: "@a@b＊：這只是個傳言……\n@c0@"
52:
  en: "@a@b*: But I've been hearing word of a simply horrid creature that lives under the sea to the west.\n@c0@"
  ja: "@a@b＊「ずっと西のほうの　海の底には\n\tとんでもない悪魔が\n\t住んでいるということだ。\n@c0@"
  ko: "@a@b*: 이곳에는 저의 소중한\n주인님께서 잠들어 계십니다.\n@c0@"
  sl: "@a@b＊：据说西边的海底\n　　住着一个\n　　很可怕的恶魔。\n@c0@"
  tl: "@a@b＊：據說西邊的海底\n　　住著一個\n　　很可怕的惡魔。\n@c0@"
53:
  en: "@a@b*: I've also heard tell of a legendary city that was sent to the seabed by this beastly being.\n@c0@"
  ja: "@a@b＊「その悪魔によって　海に\n\t沈められた伝説の都市も\n\tあるそうだが……\n@c0@"
  ko: "@a@b*: 그런데 방금 주인님께서\n돌아오신 것 같은 기분이......\n@c0@"
  sl: "@a@b＊：因为那个恶魔的缘故，\n　　有一座传说中的都市\n　　沉到了海底……\n@c0@"
  tl: "@a@b＊：因為那個惡魔的緣故，\n　　有一座傳說中的都市\n　　沉到了海底……\n@c0@"
54:
  en: "@a@b*: Of course, I cannot confirm any of this. I suppose only a mermaid could say for certain...\n@c0@"
  ja: "@a@b＊「まさか　人魚でもあるまいし\n\t海の底まで　確かめにゆくことは\n\tできないだろう。\n@c0@"
  ko: "@a@b*: 이건 어디까지나\n떠도는 소문인데......\n@c0@"
  sl: "@a@b＊：我又不是人鱼之类的生物，\n　　不可能潜到海底\n　　去确认的啊。\n@c0@"
  tl: "@a@b＊：我又不是人魚之類的生物，\n　　不可能潛到海底\n　　去確認的啊。\n@c0@"
55:
  en: "@a@b*: Hark! Rumours tell of a yawning abyss that has opened in the seas to the north-west.\n@c0@"
  ja: "@a@b＊「ウワサですが　ここからはるか北西の\n\t海のどこかに　大きな穴が\n\tあいてしまっているとか。\n@c0@"
  ko: "@a@b*: 머나먼 서쪽 바다 바닥에는\n엄청난 악마가\n살고 있다는군.\n@c0@"
