  tl: "@a@b＊：有傳言說，\n　　從這裡往西北方去的海上\n　　出現了一個大空洞。\n@c0@"
56:
  en: "@a@b*: That is not all. Travel due north from there, and you shall find a well that leads to another world, I hear.\n@c0@"
