  ko: "@a@b*: 우왓! 너는\n하늘을 나는 침대에 타고 있던 사람?\n@c0@"
  sl: "@a@b＊：太好了太好了。\n　　诶？名字？我叫%a002110哦。\n@c0@"
  tl: "@a@b＊：太好了太好了。\n　　誒？名字？我叫%a002110哦。\n@c0@"
62:
  en: "@a@b%0%a002110 joined the party!\n@c0@"
  ja: "@a@b%a002110が　仲間に　くわわった！\n@c0@"
  ko: "@a@b*: 야호!\n나, 하늘을 마음껏\n날아 보고 싶었어.\n@c0@"
