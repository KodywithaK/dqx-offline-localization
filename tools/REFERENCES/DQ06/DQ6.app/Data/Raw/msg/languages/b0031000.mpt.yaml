  tl: "@a@b%a002110：那我就去外面等著了。\n　　好期待。\n@c0@"
64:
  en: "@a@b%0%a002110 floats off to the wagon.\n@c0@"
  ja: "@a@b%a002110は　おもての馬車まで\n走っていった！\n@c0@"
  ko: "@a@b*: 와아~ 신 난다~\n응? 내 이름? 나는 %a002110%F2110%X야%Y이야%Z.\n@c0@"
