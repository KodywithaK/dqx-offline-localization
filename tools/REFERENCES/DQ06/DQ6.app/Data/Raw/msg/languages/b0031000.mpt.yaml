  tl: "@a@b%a002110跑向了外面的馬車！\n@c0@"
65:
  en: "@a@bBut the wagon's already full!\n@c0@"
  ja: "@a@bしかし　馬車は　いっぱいだった！\n@c0@"
  ko: "@a@b%a002110%F2110%X가%Y이%Z 동료로 합류했다!\n@c0@"
  sl: "@a@b但是，马车中已经满员了！\n@c0@"
