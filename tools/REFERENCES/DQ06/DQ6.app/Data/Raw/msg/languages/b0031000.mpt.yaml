0:
  en: "@aMr Tress@bOh... It's you again. Do you have some business here?\n@c0@"
  ja: "@a@bハリス「おや　あなたがたは？\n\tなにか用ですかな？\n@c0@"
  ko: "@a@b해리스: 음? 당신들은?\n무슨 일이시죠?\n@c0@"
  sl: "@a@b哈里斯：哎呀，是你们啊？\n　　有什么事吗？\n@c0@"
  tl: "@a@b哈里斯：哎呀，是你們啊？\n　　有什麼事嗎？\n@c0@"
1:
  en: "@aMr Tress@bThen do please leave us in peace. I'm afraid I'm not in the right frame of mind to talk to travellers.\n@c0@"
  ja: "@a@bハリス「では　お引き取りを。\n\t今は　旅の人たちと　ひとときの\n\t語らいをする気分では　ないので。\n@c0@"
  ko: "@a@b---점프---> #031009로\n@c0@"
  sl: "@a@b哈里斯：那就请回吧。\n　　现在我没有心情\n　　跟旅行者说话。\n@c0@"
  tl: "@a@b哈里斯：那就請回吧。\n　　現在我沒有心情\n　　跟旅行者說話。\n@c0@"
2:
  en: "@a@b%0%a000120 hands the shard of courage to Mr Tress.\n@c0@"
  ja: "@a@b%a000120は　勇気のかけらを\nハリスに　手わたした。\n@c0@"
  ko: "@a@b해리스: 그럼 돌아가 주십시오.\n지금은 여행자분과 한가로이\n담소를 나눌 기분이 아니라서.\n@c0@"
  sl: "@a@b%a000120把勇气碎片\n交给了哈里斯。\n@c0@"
  tl: "@a@b%a000120把勇氣碎片\n交給了哈里斯。\n@c0@"
3:
  en: "@aMr Tress@bHmm? W-Wait, is this—? I say! I'm not seeing things, am I? This is a shard of courage!\n@c0@"
  ja: "@a@bハリス「うん？　も　もしや　これは……\n\tおお！　まちがいないっ\n\tまぎれもなく　勇気のかけらっ！\n@c0@"
  ko: "@a@b%a000120%F0120%X는%Y은%Z 용기의 조각을\n해리스에게 건넸다.\n@c0@"
  sl: "@a@b哈里斯：嗯？这难道是……\n　　哦！没错！\n　　这正是勇气碎片！\n@c0@"
  tl: "@a@b哈里斯：嗯？這難道是……\n　　哦！沒錯！\n　　這正是勇氣碎片！\n@c0@"
4:
  en: "@aMr Tress@bB-But why...? How did you...?\n@c0@"
  ja: "@a@bハリス「しかし　ど　どうして　これを\n\tあなたたちが……。\n@c0@"
  ko: "@a@b해리스: 음? 호, 혹시 이것은......\n오오! 틀림없어.\n이건 분명히 용기의 조각!\n@c0@"
  sl: "@a@b哈里斯：不过，\n　　为什么你们会有这个……\n@c0@"
  tl: "@a@b哈里斯：不過，\n　　為什麼你們會有這個……\n@c0@"
5:
  en: "@aMr Tress@bWhat!? You scaled Destiny's Drop!? Why, that was a mighty risk you took...\n@c0@"
  ja: "@a@bハリス「なんと！　運命のカベに\n\tのぼって……。　そ　そうでしたか。\n\tそんなに　キケンな所へ……。\n@c0@"
  ko: "@a@b해리스: 하지만 어, 어째서 이것을\n당신들이......\n@c0@"
  sl: "@a@b哈里斯：你们居然去攀登了\n　　命运之墙……这样啊。\n　　居然去了那么危险的地方……\n@c0@"
  tl: "@a@b哈里斯：你們居然去攀登了\n　　命運之牆……這樣啊。\n　　居然去了那麼危險的地方……\n@c0@"
6:
  en: "@aMr Tress@bHow can we possibly ever repay you?\n@c0@"
  ja: "@a@bハリス「いや　これは　なんと\n\tお礼を　申し上げたらいいか。\n@c0@"
  ko: "@a@b해리스: 아니! 운명의 벽을\n올랐다니...... 그, 그러셨군요.\n그렇게 위험한 곳으로......\n@c0@"
  sl: "@a@b哈里斯：哎呀，\n　　该怎么感谢你们才好呢。\n@c0@"
  tl: "@a@b哈里斯：哎呀，\n　　該怎麼感謝你們才好呢。\n@c0@"
7:
  en: "@aMr Tress@bNow that we have a shard of courage, we can finally make the badge of courage that Matt wanted so badly.\n@c0@"
  ja: "@a@bハリス「この　勇気のかけらが　あれば\n\tジョンの　ほしがっていた\n\t勇気のバッジを　作ることができます。\n@c0@"
  ko: "@a@b해리스: 세상에, 뭐라고\n감사를 드려야 할지.\n@c0@"
  sl: "@a@b哈里斯：有了这个勇气碎片，\n　　就可以制作约翰一直\n　　想要的勇气徽章了。\n@c0@"
  tl: "@a@b哈里斯：有了這個勇氣碎片，\n　　就可以製作約翰一直\n　　想要的勇氣徽章了。\n@c0@"
8:
  en: "@aMr Tress@bThank you, from the bottom of my heart!\n@c0@"
  ja: "@a@bハリス「本当に　ありがとう\n\tございました。\n@c0@"
  ko: "@a@b해리스: 이 용기의 조각이 있으면\n존이 갖고 싶어 했던\n용기의 배지를 만들 수 있습니다.\n@c0@"
  sl: "@a@b哈里斯：真的太感谢了。\n@c0@"
  tl: "@a@b哈里斯：真的太感謝了。\n@c0@"
9:
  en: "@aMr Tress@bBut wait... Surely you must be jiggered after climbing that precipitous peak?\n@c0@"
  ja: "@a@bハリス「ところで　みなさん。　あのような\n\t険しい山から　お戻りになったばかりで\n\tさぞや　おつかれでしょう？\n@c0@"
  ko: "@a@b해리스: 정말로\n고맙습니다.\n@c0@"
  sl: "@a@b哈里斯：话说回来，各位从\n　　那么险峻的山上回到这里，\n　　一定很累了吧？\n@c0@"
  tl: "@a@b哈里斯：話說回來，各位從\n　　那麼險峻的山上回到這裡，\n　　一定很累了吧？\n@c0@"
10:
  en: "@aMr Tress@bI'm afraid I have nothing to offer you in the way of a reward, but perhaps you'd like a bed for the night?\n@c0@"
  ja: "@a@bハリス「お礼に　さしあげられるような\n\tものは　何もありませんが　せめて\n\t泊まっていってくださいませんか？\n@c0@"
  ko: "@a@b해리스: 그나저나 여러분. 그런\n험한 산에서 지금 막 돌아오셨다면\n많이 지치셨겠죠?\n@c0@"
  sl: "@a@b哈里斯：我没有什么东西\n　　能表达我的感谢，\n　　就请在我家留宿一晚吧？\n@c0@"
  tl: "@a@b哈里斯：我沒有什麼東西\n　　能表達我的感謝，\n　　就請在我家留宿一晚吧？\n@c0@"
11:
  en: "@aMr Tress@bI see... Well, you'll always be welcome here, I can assure you.\n@c0@"
  ja: "@a@bハリス「そうですか……。\n\tでは　また　いつでも\n\tおいでください。\n@c0@"
  ko: "@a@b해리스: 보답으로 드릴 만한\n물건이 아무것도 없습니다만,\n여기서 휴식이라도 취하고 가시면 어떨까요?\n@c0@"
  sl: "@a@b哈里斯：这样啊……\n　　我家随时欢迎你们。\n@c0@"
  tl: "@a@b哈里斯：這樣啊……\n　　我家隨時歡迎你們。\n@c0@"
12:
  en: "@aMr Tress@bThe only free bed that we have is poor Matt's, but it's always there for you if you want it.\n@c0@"
  ja: "@a@bハリス「あいにく　あいているベッドは\n\t亡くなった息子のものしか\n\tありませんが。\n@c0@"
  ko: "@a@b---점프---> #031025로\n@c0@"
  sl: "@a@b哈里斯：不巧的是，\n　　现在空着的床\n　　只有去世的儿子的那张。\n@c0@"
  tl: "@a@b哈里斯：不巧的是，\n　　現在空著的床\n　　只有去世的兒子的那張。\n@c0@"
13:
  en: "@aMr Tress@bOh, it's you again! Thanks for stopping by!\n@c0@"
  ja: "@a@bハリス「おお　あなたがたは！\n\tようこそ　いらっしゃいました。\n@c0@"
  ko: "@a@b해리스: 그렇군요......\n그럼 또 언제든\n찾아와 주십시오.\n@c0@"
  sl: "@a@b哈里斯：哦，是你们！\n　　欢迎欢迎。\n@c0@"
  tl: "@a@b哈里斯：哦，是你們！\n　　歡迎歡迎。\n@c0@"
14:
  en: "@aMr Tress@bNow, I can't allow the %H0860%Xperson%Ypeople%Z who retrieved the shard of courage for my son to leave without somehow showing my gratitude.\n@c0@"
  ja: "@a@bハリス「ジョンのために　勇気のかけらを\n\t取ってきてくださった方を　ただで\n\tお帰しするわけには　いきません。\n@c0@"
  ko: "@a@b해리스: 비록 비어 있는 침대는\n죽은 아들 것밖에\n없습니다만.\n@c0@"
  sl: "@a@b哈里斯：各位为约翰\n　　拿来了勇气碎片，\n　　怎么能就这样走了呢。\n@c0@"
  tl: "@a@b哈里斯：各位為約翰\n　　拿來了勇氣碎片，\n　　怎麼能就這樣走了呢。\n@c0@"
15:
  en: "@aMr Tress@bExcellent! Please, come with me.\n@c0@"
  ja: "@a@bハリス「そうですか！\n\tでは　どうぞ　こちらへ。\n@c0@"
  ko: "@a@b해리스: 오오, 당신들은!\n어서 오십시오.\n@c0@"
  sl: "@a@b哈里斯：这样啊！\n　　那就这边请。\n@c0@"
  tl: "@a@b哈里斯：這樣啊！\n　　那就這邊請。\n@c0@"
16:
  en: "@a@bThe door is locked, and it doesn't look like any of the keys in %H0860%X%a000120%Ythe party%Z's possession will open it.\n@c0@"
  ja: "@a@bトビラには　カギが　かかっている！\nもっているカギでは　あけられなかった。\n@c0@"
  ko: "@a@b해리스: 존을 위해 용기의 조각을\n가져와 주신 분을 그냥\n보내 드릴 수는 없습니다.\n@c0@"
  sl: "@a@b门上着锁！\n现有的钥匙似乎无法打开它。\n@c0@"
  tl: "@a@b門上著鎖！\n現有的鑰匙似乎無法打開它。\n@c0@"
17:
  en: "@aMr Tress@bI'm terribly sorry, but the only free bed we have is Matt's old one.\n@c0@"
  ja: "@a@bハリス「あいにく　あいているベッドは\n\t亡くなった息子のものしか　なくて\n\t申しわけありません。\n@c0@"
  ko: "@a@b---점프---> #031017로\n@c0@"
  sl: "@a@b哈里斯：不巧的是现在空着的床\n　　只有去世的儿子的那张。\n　　十分抱歉。\n@c0@"
  tl: "@a@b哈里斯：不巧的是現在空著的床\n　　只有去世的兒子的那張。\n　　十分抱歉。\n@c0@"
18:
  en: "@aMr Tress@bBut I'm sure that our son would be delighted to let you use it, especially after what you did.\n@c0@"
  ja: "@a@bハリス「でも　あなた方が\n\t使ってくださるなら　ジョンも\n\tきっと　よろこぶと思います。\n@c0@"
  ko: "@a@b해리스: 알겠습니다!\n그럼 이쪽으로 오십시오.\n@c0@"
  sl: "@a@b哈里斯：不过，\n　　要是由你们使用的话，\n　　我想约翰也一定会高兴的。\n@c0@"
  tl: "@a@b哈里斯：不過，\n　　要是由你們使用的話，\n　　我想約翰也一定會高興的。\n@c0@"
19:
  en: "@aMr Tress@bCome on in and make %H0860%Xyourself%Yyourselves%Z at home.\n@c0@"
  ja: "@a@bハリス「さあ　どうぞ。\n@c0@"
  ko: "@a@b문은 잠겨 있다!\n가지고 있는 열쇠로는 열리지 않았다.\n@c0@"
  sl: "@a@b哈里斯：请吧。\n@c0@"
  tl: "@a@b哈里斯：請吧。\n@c0@"
20:
  en: "@aMr Tress@bDarling! You'll scarcely believe this! %H0860%XThis wonderful person has%YThese wonderful people have%Z brought us a shard of courage!\n@c0@"
  ja: "@a@bハリス「なあ　聞いて　おどろくなよ。\n\tこの方たちが　勇気のかけらを\n\t持ってきてくださったんだ！\n@c0@"
  ko: "@a@b해리스: 마침 비어 있는 침대는\n죽은 아들 것밖에 없어서\n죄송합니다.\n@c0@"
  sl: "@a@b哈里斯：听我说，你可别吃惊哦。\n　　这几位给我们拿来了\n　　勇气碎片呢！\n@c0@"
  tl: "@a@b哈里斯：聽我說，你可別吃驚哦。\n　　這幾位給我們拿來了\n　　勇氣碎片呢！\n@c0@"
21:
  en: "@aMrs Tress@bA shard of courage!? Crikey!\n@c0@"
  ja: "@a@bマゴット「まあ！　勇気のかけらを？\n@c0@"
  ko: "@a@b해리스: 하지만 여러분이\n사용해 주신다면 존도\n틀림없이 기뻐할 겁니다.\n@c0@"
  sl: "@a@b玛格特：啊！拿来了勇气碎片？\n@c0@"
  tl: "@a@b瑪格特：啊！拿來了勇氣碎片？\n@c0@"
22:
  en: "@aMr Tress@bAs thanks, I've insisted %H0860%X%A0120%Xhe%Z%B0120%Xshe%Z%Ythey%Z stay the night. It's the least we can do to repay %H0860%X%A0120%Xhim%Z%B0120%Xher%Z%Ythem%Z.\n@c0@"
  ja: "@a@bハリス「それで　今日は\n\t泊まって行ってくださるよう\n\tお願いしたんだよ。\n@c0@"
  ko: "@a@b해리스: 자, 들어오십시오.\n@c0@"
  sl: "@a@b哈里斯：我已经请他们\n　　今晚留宿在我们家里了。\n@c0@"
  tl: "@a@b哈里斯：我已經請他們\n　　今晚留宿在我們家裡了。\n@c0@"
23:
  en: "@aMrs Tress@bB-But of course! Please, stay as long as you like. I can't believe we finally have a shard of courage...\n@c0@"
  ja: "@a@bマゴット「そ　そうね。　もちろん\n\tごゆっくりして　いただかなきゃ。\n\tああ　本当に　勇気のかけらを……。\n@c0@"
  ko: "@a@b해리스: 여보, 듣고 놀라지 마.\n이분들이 용기의 조각을\n가지고 와 주셨어!\n@c0@"
  sl: "@a@b玛格特：对啊。得请他们\n　　好好休息才行。\n　　啊，真的拿来了勇气碎片……\n@c0@"
  tl: "@a@b瑪格特：對啊。得請他們\n　　好好休息才行。\n　　啊，真的拿來了勇氣碎片……\n@c0@"
24:
  en: "@aMr Tress@bWell, we'll leave you to it. I'm afraid the room's a bit of a mess, but do enjoy your stay.\n@c0@"
  ja: "@a@bハリス「さあ　どうぞ。\n\tちらかってますが　ごゆっくり\n\tお休みください。\n@c0@"
  ko: "@a@b마고트: 어머나! 용기의 조각을?\n@c0@"
  sl: "@a@b哈里斯：请吧。\n　　虽然有点乱，\n　　还请各位好好休息啊。\n@c0@"
  tl: "@a@b哈里斯：請吧。\n　　雖然有點亂，\n　　還請各位好好休息啊。\n@c0@"
25:
  en: "@aMr Tress@bWe'll be sleeping downstairs.\n@c0@"
  ja: "@a@bハリス「われわれも　下で\n\t休ませていただきますから。\n@c0@"
  ko: "@a@b해리스: 그래서 오늘은\n우리 집에서 쉬고 가시라고\n부탁을 드렸어.\n@c0@"
  sl: "@a@b哈里斯：我们也去下面休息了。\n@c0@"
  tl: "@a@b哈里斯：我們也去下面休息了。\n@c0@"
26:
  en: "@aMr Tress@bGood night, then!\n@c0@"
  ja: "@a@bハリス「それでは　お休みなさい。\n@c0@"
  ko: "@a@b마고트: 그, 그렇죠. 물론\n쉬고 가시게 해야지요.\n아아, 정말로 용기의 조각을......\n@c0@"
  sl: "@a@b哈里斯：请好好休息吧。\n@c0@"
  tl: "@a@b哈里斯：請好好休息吧。\n@c0@"
27:
  en: "@a@b*: Bet you've never seen a bed this neat, huh?\n@c0@"
  ja: "@a@b＊「それ　いいベッドでしょ。\n@c0@"
  ko: "@a@b해리스: 자, 그럼\n방이 좀 어수선하지만\n편히 쉬십시오.\n@c0@"
  sl: "@a@b＊：那床不错吧。\n@c0@"
  tl: "@a@b＊：那床不錯吧。\n@c0@"
28:
  en: "@a@b*: I'm Matt. Nice to meet you!\n@c0@"
  ja: "@a@b＊「はじめまして。\n\tボクが　ジョンです。\n@c0@"
  ko: "@a@b해리스: 저희도 아래층에서\n쉬고 있겠습니다.\n@c0@"
  sl: "@a@b＊：我们是第一次见吧。\n　　我是约翰。\n@c0@"
  tl: "@a@b＊：我們是第一次見吧。\n　　我是約翰。\n@c0@"
29:
  en: "@aMatt Tress@bIt sure would be rude not to thank you for fetching the shard and stuff, so go on, take the bed! It's yours!\n@c0@"
  ja: "@a@bジョン「勇気のかけら\n\tどうもありがとう！　お礼に\n\tそのベッドを　あげるよ。\n@c0@"
  ko: "@a@b해리스: 그럼 안녕히 주무십시오.\n@c0@"
  sl: "@a@b约翰：谢谢你拿来的勇气碎片！\n　　作为谢礼，\n　　我就把那床送你吧。\n@c0@"
  tl: "@a@b約翰：謝謝你拿來的勇氣碎片！\n　　作為謝禮，\n　　我就把那床送你吧。\n@c0@"
30:
  en: "@aMatt Tress@bIt's not like I need it — I can fly by myself nowadays.\n@c0@"
  ja: "@a@bジョン「ボクには　もう\n\t必要ないんだ。　だって　自由に\n\t空を　飛べるようになったんだもん。\n@c0@"
  ko: "@a@b*: 그 침대 좋지?\n@c0@"
  sl: "@a@b约翰：我已经不需要了。\n　　因为我已经可以自由地\n　　在空中飞了呢。\n@c0@"
  tl: "@a@b約翰：我已經不需要了。\n　　因為我已經可以自由地\n　　在空中飛了呢。\n@c0@"
31:
  en: "@aMatt Tress@bI can't thank you enough, %a000120! So long, and don't fall asleep while flying!\n@c0@"
  ja: "@a@bジョン「%a000120さん\n\t本当に　ありがとう！\n\tさようなら……。\n@c0@"
  ko: "@a@b*: 안녕?\n내가 바로 존이야.\n@c0@"
  sl: "@a@b约翰：%a000120，\n　　真的很感谢你！\n　　再见了……\n@c0@"
  tl: "@a@b約翰：%a000120，\n　　真的很感謝你！\n　　再見了……\n@c0@"
32:
  en: "@a@b*: Whoa! What's that up there!?\n@c0@"
  ja: "@a@b＊「わっ！！　あれは　何だ？！\n@c0@"
  ko: "@a@b존: 용기의 조각\n정말 고마워! 보답으로\n그 침대 줄게.\n@c0@"
  sl: "@a@b＊：哇！！那是什么？！\n@c0@"
  tl: "@a@b＊：哇！！那是什麼？！\n@c0@"
33:
  en: "@a@b*: The bed! Hey, it's the flying bed! It's back!\n@c0@"
  ja: "@a@b＊「あーっ！\n\t空とぶベッドだ！　ベッドが\n\tまた　空を　とんでるっ！\n@c0@"
