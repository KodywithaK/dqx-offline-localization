  ko: "@a@b*: 자, 마을로 돌아가볼까요.\n@c0@"
  sl: "@a@b＊：好了，那我先回镇子了。\n@c0@"
  tl: "@a@b＊：好了，那我先回鎮子了。\n@c0@"
