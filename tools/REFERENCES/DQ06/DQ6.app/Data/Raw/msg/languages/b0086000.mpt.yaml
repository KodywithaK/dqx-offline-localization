0:
  en: "@a@b*: I'm Morgan Gainmore, proprietor of this estate. I suppose you think you have business here?\n@c0@"
  ja: "@a@b＊「私が　この　やしきの主\n\tモルガンだが　なにか用かね？\n@c0@"
  ko: "@a@b*: 내가 이 저택 주인인\n모건이네만 무슨 볼일인가?\n@c0@"
  sl: "@a@b＊：我就是这家的主人摩根，\n　　找我有事吗？\n@c0@"
  tl: "@a@b＊：我就是這家的主人摩根，\n　　找我有事嗎？\n@c0@"
1:
  en: "@aMorgan Gainmore@bThen leave at once. I'm far too busy to talk to riff-raff.\n@c0@"
  ja: "@a@bモルガン「ならば　出ていってくれ。\n\tここには　めぐんでやるような物は\n\tなにも　ないぞ。\n@c0@"
  ko: "@a@b모건: 그렇다면 어서 나가 주게.\n이곳에 적선할 만한 건\n아무것도 없으니까.\n@c0@"
  sl: "@a@b摩根：那就请你给我出去！\n　　这里没有什么能施舍给你的。\n@c0@"
  tl: "@a@b摩根：那就請你給我出去！\n　　這裡沒有什麼能施捨給你的。\n@c0@"
2:
  en: "@aMorgan Gainmore@bWell, well, well... You found my little letter in the cave, did you?\n@c0@"
  ja: "@a@bモルガン「ほほう　洞くつで\n\t私の　手紙を　見つけたのかね？\n@c0@"
  ko: "@a@b모건: 호오, 동굴에서\n내 편지를 발견했다고?\n@c0@"
  sl: "@a@b摩根：哈哈，你们发现\n　　我留在洞窟里的信了吗？\n@c0@"
  tl: "@a@b摩根：哈哈，你們發現\n　　我留在洞窟裡的信了嗎？\n@c0@"
3:
  en: "@aMorgan Gainmore@bVery well. I shall tell you of the sage's treasure, as promised.\n@c0@"
  ja: "@a@bモルガン「よろしい。　賢者の宝の\n\t情報を　教えよう。\n@c0@"
  ko: "@a@b모건: 좋아. 현자의 보물에 대한\n정보를 주겠네.\n@c0@"
  sl: "@a@b摩根：好吧！我就告诉你们\n　　贤者的宝物的情报吧。\n@c0@"
  tl: "@a@b摩根：好吧！我就告訴你們\n　　賢者的寶物的情報吧。\n@c0@"
4:
  en: "@aMorgan Gainmore@b...But I can't very well give such valuable information away for free! A fee of 5000 gold coins should do. Do we have a deal?\n@c0@"
  ja: "@a@bモルガン「ただし！　むりょうで\n\t教えるわけにはいかん。\n\t５０００ゴールド　いただこう。\n@c0@"
  ko: "@a@b모건: 단! 공짜로\n알려줄 순 없지.\n5000골드를 내놓게.\n@c0@"
  sl: "@a@b摩根：不过！世上可没有\n　　什么不要钱的好事。\n　　先拿５０００金币来吧。\n@c0@"
  tl: "@a@b摩根：不過！世上可沒有\n　　什麼不要錢的好事。\n　　先拿５０００金幣來吧。\n@c0@"
5:
  en: "@aMorgan Gainmore@bI see. So you went right to the heart of the cave for nothing.\n@c0@"
  ja: "@a@bモルガン「そうか。　せっかく洞くつの\n\t奥までいったのに　その苦労を\n\t無にするというのだな。\n@c0@"
  ko: "@a@b모건: 그런가? 힘들게 동굴\n안쪽까지 갔는데, 그 고생을\n헛되이 할 셈이군.\n@c0@"
  sl: "@a@b摩根：是嘛，好不容易找到\n　　洞窟的最里面，\n　　结果白跑了一趟啊。\n@c0@"
  tl: "@a@b摩根：是嘛，好不容易找到\n　　洞窟的最裡面，\n　　結果白跑了一趟啊。\n@c0@"
6:
  en: "@aMorgan Gainmore@bWell, how you waste your time is none of my concern. Now get out of my sight!\n@c0@"
  ja: "@a@bモルガン「まあ　いい。\n\t私としては　どちらでもいいのだ。\n\tさあ　出ていってくれるか。\n@c0@"
  ko: "@a@b모건: 뭐, 좋아.\n난 아무래도 상관없으니.\n자, 그만 나가 주겠나?\n@c0@"
  sl: "@a@b摩根：不过呢，\n　　这些全都跟我没什么关系。\n　　你们到底是打算滚出去呢……\n@c0@"
  tl: "@a@b摩根：不過呢，\n　　這些全都跟我沒什麼關係。\n　　你們到底是打算滾出去呢……\n@c0@"
7:
  en: "@aMorgan Gainmore@bOr...have you changed your mind about the 5000 gold coins?\n@c0@"
  ja: "@a@bモルガン「それとも……\n\t５０００ゴールドを\n\tはらう気に　なったかね？\n@c0@"
  ko: "@a@b모건: 아니면......\n5000골드를\n낼 마음이 생긴 건가?\n@c0@"
  sl: "@a@b摩根：还是……\n　　打算支付５０００金币了呢？\n@c0@"
  tl: "@a@b摩根：還是……\n　　打算支付５０００金幣了呢？\n@c0@"
8:
  en: "@aMorgan Gainmore@bThen leave at once! We're finished here.\n@c0@"
  ja: "@a@bモルガン「ならば　出ていきたまえ！\n\t私に　もう用は　ないだろう。\n@c0@"
  ko: "@a@b모건: 그렇다면 당장 나가게!\n내게는 더 볼일이 없을 테니.\n@c0@"
  sl: "@a@b摩根：那就给我出去！\n　　我还有别的事情呢！\n@c0@"
  tl: "@a@b摩根：那就給我出去！\n　　我還有別的事情呢！\n@c0@"
9:
  en: "@aMorgan Gainmore@bIndeed? Wait, you lack sufficient funds.\n@c0@"
  ja: "@a@bモルガン「ん？　しかし　カネが\n\tたりないようだな。\n@c0@"
  ko: "@a@b모건: 응? 하지만 돈이\n부족한 모양이군.\n@c0@"
  sl: "@a@b摩根：嗯？不过，\n　　你们的钱似乎不够啊。\n@c0@"
  tl: "@a@b摩根：嗯？不過，\n　　你們的錢似乎不夠啊。\n@c0@"
10:
  en: "@aMorgan Gainmore@bIt must be dreadful being poor. Still, I am not a charity. Come back when you have the gold.\n@c0@"
  ja: "@a@bモルガン「まあ　びんぼう人には\n\t大変だろうが　また　出なおして\n\t来たまえ。　わっはっはっ！\n@c0@"
  ko: "@a@b모건: 뭐, 가난한 사람에겐\n힘들겠지만 돈이 준비되면\n그때 다시 찾아오게나. 와하하하!\n@c0@"
  sl: "@a@b摩根：对于你们这帮穷鬼来说\n　　确实不是个小数目呢。\n　　等凑够了钱再来吧。哈！哈！哈！\n@c0@"
  tl: "@a@b摩根：對於你們這幫窮鬼來說\n　　確實不是個小數目呢。\n　　等湊夠了錢再來吧。哈！哈！哈！\n@c0@"
11:
  en: "@a@b%0%a000120 hands over 5000 gold coins.\n@c0@"
  ja: "@a@b%a000120は　５０００ゴールドを\n手わたした。\n@c0@"
  ko: "@a@b%a000120%F0120%X는%Y은%Z 5000골드를\n건네주었다.\n@c0@"
  sl: "@a@b%a000120交出了\n５０００金币。\n@c0@"
  tl: "@a@b%a000120交出了\n５０００金幣。\n@c0@"
12:
  en: "@aMorgan Gainmore@bVery well. I shall tell you everything I know. In the forest to the north-west of here lies a hidden lake.\n@c0@"
  ja: "@a@bモルガン「では　教えてやろう。\n\t町の北西の森の　まん中あたりに\n\tかくされた湖が　ある。\n@c0@"
  ko: "@a@b모건: 그럼 알려 주겠네.\n마을 북서쪽 숲의 한가운데쯤에\n숨겨진 호수가 있지.\n@c0@"
  sl: "@a@b摩根：那我就告诉你们吧。\n　　这个镇子的西北边有一片森林，\n　　森林的正中央附近藏着一个湖。\n@c0@"
  tl: "@a@b摩根：那我就告訴你們吧。\n　　這個鎮子的西北邊有一片森林，\n　　森林的正中央附近藏著一個湖。\n@c0@"
13:
  en: "@aMorgan Gainmore@bAt its bottom, you will find the treasure that the sage left to this town.\n@c0@"
  ja: "@a@bモルガン「その湖の底に　賢者が\n\tこの町に　残していった　宝が\n\tしずんでいるそうだ。\n@c0@"
  ko: "@a@b모건: 그 호수 바닥에 현자가\n이 마을에 남겨둔 보물이\n가라앉아 있다더군.\n@c0@"
  sl: "@a@b摩根：贤者留给这个镇子的宝物，\n　　听说就沉在那个湖的湖底。\n@c0@"
  tl: "@a@b摩根：賢者留給這個鎮子的寶物，\n　　聽說就沉在那個湖的湖底。\n@c0@"
14:
  en: "@aMorgan Gainmore@bCarefully search the forest to the north-west of here and you're sure to find it eventually.\n@c0@"
  ja: "@a@bモルガン「この町の北西にある森を\n\tくまなく　歩いてみるがいい。\n@c0@"
  ko: "@a@b모건: 이 마을의 북서쪽 숲을\n구석구석 걸어다녀 보게나.\n@c0@"
  sl: "@a@b摩根：你们去把镇子西北边的森林\n　　不留死角地翻个遍就能找到了。\n@c0@"
  tl: "@a@b摩根：你們去把鎮子西北邊的森林\n　　不留死角地翻個遍就能找到了。\n@c0@"
15:
  en: "@aMorgan Gainmore@bApparently, there's a secret lake in the forest to the north-west of here.\n@c0@"
  ja: "@a@bモルガン「この町の北西にある森の\n\tまん中あたりに　ひみつの湖が\n\tあるそうだ。\n@c0@"
  ko: "@a@b모건: 이 마을 북서쪽 숲\n한가운데쯤에 숨겨진 호수가\n있다고 하더군.\n@c0@"
  sl: "@a@b摩根：这个镇子的西北边有一片森林，\n　　听说森林的正中央附近有一个\n　　秘密的湖。\n@c0@"
  tl: "@a@b摩根：這個鎮子的西北邊有一片森林，\n　　聽說森林的正中央附近有一個\n　　秘密的湖。\n@c0@"
16:
  en: "@aMorgan Gainmore@bThe sage's treasure lies at the bottom of it. Scour the forest, and you're sure to find it eventually.\n@c0@"
  ja: "@a@bモルガン「賢者の宝は　その湖の底に\n\t眠っている。　森の中を\n\tくまなく　歩いてみるがいい。\n@c0@"
  ko: "@a@b모건: 현자의 보물은 그 호수 바닥에\n잠들어 있어. 숲 안을\n구석구석 걸어다녀 보게나.\n@c0@"
  sl: "@a@b摩根：贤者的宝物就沉睡在\n　　那个湖的湖底。你们去把那个森林\n　　不留死角地翻个遍就找到了。\n@c0@"
  tl: "@a@b摩根：賢者的寶物就沉睡在\n　　那個湖的湖底。你們去把那個森林\n　　不留死角地翻個遍就找到了。\n@c0@"
17:
  en: "@a@b*: Huh? Don't tell me you're here for that sage's treasure too?\n@c0@"
  ja: "@a@b＊「ん？　なんだ　あなたも\n\t賢者の宝の話を　聞いて\n\t来たんですか！\n@c0@"
  ko: "@a@b*: 응? 뭡니까 당신도\n현자의 보물 이야기를\n듣고 온 건가요!?\n@c0@"
  sl: "@a@b＊：嗯？你说什么？\n　　你们也是来这里\n　　找贤者的宝物吗？\n@c0@"
  tl: "@a@b＊：嗯？你說什麼？\n　　你們也是來這裡\n　　找賢者的寶物嗎？\n@c0@"
18:
  en: "@a@b*: Of all the...! How many people did that greedy Gainmore sell his story to...?\n@c0@"
  ja: "@a@b＊「モルガンさんは　いったい\n\tなん人に　ここの　情報を\n\t売ったんだろう……。\n@c0@"
  ko: "@a@b*: 모건 씨는 도대체\n몇 명에게 이 정보를\n판 거지......\n@c0@"
  sl: "@a@b＊：摩根老爷到底把\n　　这里藏着宝物的情报\n　　卖给了多少人啊……\n@c0@"
  tl: "@a@b＊：摩根老爺到底把\n　　這裡藏著寶物的情報\n　　賣給了多少人啊……\n@c0@"
19:
  en: "@a@b*: Goddess-dang it! How are we s'posed to grab the treasure if it's at the bottom of a lake!?\n@c0@"
  ja: "@a@b＊「くそーっ！　湖の底なんて\n\tどうやって　さがせってんだ！\n@c0@"
  ko: "@a@b*: 젠장! 호수 바닥을\n어떻게 찾으란 말이야!\n@c0@"
  sl: "@a@b＊：可恶！居然说什么湖底，\n　　这让人怎么下去啊！\n@c0@"
  tl: "@a@b＊：可惡！居然說什麼湖底，\n　　這讓人怎麼下去啊！\n@c0@"
20:
  en: "@a@b*: Hey, what are you waiting for? You're a man, aren't you? Jump in there and bring us back that treasure!\n@c0@"
  ja: "@a@b＊「ちょいと　お前さん！　男だろっ！\n\t男なら　ザバッと　湖に　とびこんで\n\t宝を　さがしておくれよっ！\n@c0@"
  ko: "@a@b*: 이봐, 당신! 남자잖아!\n남자라면 호수에 풍덩 뛰어들어서\n보물을 찾아오란 말이야!\n@c0@"
  sl: "@a@b＊：你到底怎么搞的？！你是男人吧！\n　　你要还是个男人，就应该\n　　毫不犹豫地跳进去找宝物才对！\n@c0@"
  tl: "@a@b＊：你到底怎麼搞的？！你是男人吧！\n　　你要還是個男人，就應該\n　　毫不猶豫地跳進去找寶物才對！\n@c0@"
21:
  en: "@a@b*: The Supreme Sage's treasure... What could it be?\n@c0@"
  ja: "@a@b＊「大賢者の宝か……\n\tいったい　どんな物なんだろうか。\n@c0@"
  ko: "@a@b*: 대현자의 보물이라......\n도대체 어떤 물건일까?\n@c0@"
  sl: "@a@b＊：大贤者的宝物啊……\n　　究竟会是什么东西呢？\n@c0@"
  tl: "@a@b＊：大賢者的寶物啊……\n　　究竟會是什麼東西呢？\n@c0@"
22:
  en: "@a@b*: The bottom of the lake...? Really? I mean, I want the treasure, but I kind of like being alive too...\n@c0@"
  ja: "@a@b＊「ああ　湖の底だなんて……。\n\t宝は　欲しいが　命は　おしい……\n@c0@"
  ko: "@a@b*: 아~ 호수 바닥이라니......\n보물은 갖고 싶지만 목숨은 아깝고......\n@c0@"
  sl: "@a@b＊：啊啊！湖底啊……\n　　宝物很重要，性命也很宝贵啊……\n@c0@"
  tl: "@a@b＊：啊啊！湖底啊……\n　　寶物很重要，性命也很寶貴啊……\n@c0@"
23:
  en: "@a@b*: I certainly don't want to end up like that innkeeper who drowned down there...\n@c0@"
  ja: "@a@b＊「とびこんで　死んじまった\n\t宿屋の　だんな　みたいには\n\tなりたくないしなあ。\n@c0@"
  ko: "@a@b*: 뛰어들어서 죽어 버린\n여관 주인처럼은\n되고 싶지 않아.\n@c0@"
  sl: "@a@b＊：实在不想跟那个\n　　旅店老板一样，\n　　跳进湖里淹死啊。\n@c0@"
  tl: "@a@b＊：實在不想跟那個\n　　旅店老闆一樣，\n　　跳進湖裡淹死啊。\n@c0@"
24:
  en: "@a@b*: It's gonna be me and that's that! I'm the one who'll find the treasure!\n@c0@"
  ja: "@a@b＊「わしじゃ！\n\tわしが　宝を見つけるんじゃ！\n@c0@"
  ko: "@a@b*: 내가 찾는다!\n내가 보물을 찾겠어!\n@c0@"
  sl: "@a@b＊：是我的！\n　　宝物肯定是我的！\n@c0@"
  tl: "@a@b＊：是我的！\n　　寶物肯定是我的！\n@c0@"
25:
  en: "@a@b*: And I ain't sharin' it with nobody!\n@c0@"
  ja: "@a@b＊「だれにも　わたさんぞいっ！\n@c0@"
  ko: "@a@b*: 아무한테도 못 넘겨줘!\n@c0@"
  sl: "@a@b＊：你们谁都别想抢走！\n@c0@"
  tl: "@a@b＊：你們誰都別想搶走！\n@c0@"
26:
  en: "@a@b*: Huh? More treasure seekers? Well, I hope you're happy with nothin', 'cause that treasure's all mine!\n@c0@"
  ja: "@a@b＊「けっ！　また　ひとが増えたか！\n\tけど　宝は　絶対に　オレの物だぜ！\n@c0@"
  ko: "@a@b*: 켁! 또 사람이 늘었나!\n하지만 보물은 무조건 내 거다!\n@c0@"
  sl: "@a@b＊：可恶！人数又增加了啊！\n　　不过，这宝物绝对是本大爷的！\n@c0@"
  tl: "@a@b＊：可惡！人數又增加了啊！\n　　不過，這寶物絕對是本大爺的！\n@c0@"
27:
  en: "@a@b*: I-Isaac's treasure is at the bottom of this lake!\n@c0@"
  ja: "@a@b＊「こ　こ　この湖の底に\n\t大賢者マサールさまの宝が！\n@c0@"
  ko: "@a@b*: 이 이 이 호수 바닥에\n대현자 마살 님의 보물이!\n@c0@"
  sl: "@a@b＊：大贤者马萨尔的宝物就在\n　　这、这、这个湖的湖底！\n@c0@"
  tl: "@a@b＊：大賢者馬薩爾的寶物就在\n　　這、這、這個湖的湖底！\n@c0@"
28:
  en: "@a@b*: Oh... So close and yet so far!\n@c0@"
  ja: "@a@b＊「それが　わかっていながら\n\tとれないなんてっ！\n@c0@"
  ko: "@a@b*: 그걸 알면서도\n찾으러 가질 못하다니!\n@c0@"
  sl: "@a@b＊：明明找到了地方，\n　　可就是拿不到啊！\n@c0@"
  tl: "@a@b＊：明明找到了地方，\n　　可就是拿不到啊！\n@c0@"
29:
  en: "@a@b*: Why, I'd sell my soul to the dark side to have that lake drained. Wouldn't you?\n@c0@"
  ja: "@a@b＊「も　もし　湖の水が　ひくのなら\n\t悪魔にだって　たましいを\n\t売っちゃいますよ。　ねえ？\n@c0@"
