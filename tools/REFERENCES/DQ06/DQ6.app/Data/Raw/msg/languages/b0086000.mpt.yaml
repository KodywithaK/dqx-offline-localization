  ja: "@a@b＊「そうですね。　どうやら　自分を\n\t見うしなってたみたいです。\n@c0@"
  ko: "@a@b*: 그렇군요. 아무래도 제 자신을\n잃어버렸던 모양입니다.\n@c0@"
  sl: "@a@b＊：原来如此。之前的我\n　　确实已经迷失了自我。\n@c0@"
  tl: "@a@b＊：原來如此。之前的我\n　　確實已經迷失了自我。\n@c0@"
70:
  en: "@a@b*: I dunno know who you are, but I'm much obliged. You opened our eyes.\n@c0@"
  ja: "@a@b＊「どこの　だれかは　知らねえが\n\tありがとうよ。\n\tおかげで　目が　さめたぜ。\n@c0@"
  ko: "@a@b*: 누군지는 모르겠지만\n정말 고마워.\n덕분에 정신을 차렸어.\n@c0@"
  sl: "@a@b＊：虽然不认识你们，\n　　但还是要说声谢谢！\n　　多亏了你们我才能清醒过来。\n@c0@"
  tl: "@a@b＊：雖然不認識你們，\n　　但還是要說聲謝謝！\n　　多虧了你們我才能清醒過來。\n@c0@"
71:
  en: "@a@b*: So, uh... Shall we head back to town?\n@c0@"
  ja: "@a@b＊「さあて　町に　もどるか……。\n@c0@"
  ko: "@a@b*: 그럼 마을로 돌아갈까......\n@c0@"
  sl: "@a@b＊：那我先回镇子了……\n@c0@"
  tl: "@a@b＊：那我先回鎮子了……\n@c0@"
72:
  en: "@a@b*: Yes. We must tell everyone what happened here. We have to show them how greed has corrupted our hearts.\n@c0@"
  ja: "@a@b＊「そうだね　あんた。\n\tもどって　皆に　この話をすれば\n\t皆も　目がさめるかもしれないし……\n@c0@"
  ko: "@a@b*: 그래, 당신이\n돌아가서 모두에게 이 말을 하면\n모두 정신을 차릴지도 모르지......\n@c0@"
  sl: "@a@b＊：对了，等你们回到镇子，\n　　把整件事告诉镇上的人，\n　　大家应该都会清醒过来了……\n@c0@"
  tl: "@a@b＊：對了，等你們回到鎮子，\n　　把整件事告訴鎮上的人，\n　　大家應該都會清醒過來了……\n@c0@"
73:
  en: "@a@b*: Supreme Sage Isaac's treasure really was valuable, after all...\n@c0@"
  ja: "@a@b＊「いやはや　さすが　大賢者\n\tマサールの宝物ですな。\n@c0@"
  ko: "@a@b*: 이게 바로 대현자\n마살의 보물이군요.\n@c0@"
  sl: "@a@b＊：哎呀，真不愧是\n　　大贤者马萨尔留下的宝物。\n@c0@"
  tl: "@a@b＊：哎呀，真不愧是\n　　大賢者馬薩爾留下的寶物。\n@c0@"
74:
