  ja: "@a@b＊「わたしたちに　正気を\n\tとりもどさせて　くれました。\n@c0@"
  ko: "@a@b*: 우리가 제정신을\n차리게 해 주었으니.\n@c0@"
  sl: "@a@b＊：让我们重新\n　　恢复了神智。\n@c0@"
  tl: "@a@b＊：讓我們重新\n　　恢復了神智。\n@c0@"
75:
