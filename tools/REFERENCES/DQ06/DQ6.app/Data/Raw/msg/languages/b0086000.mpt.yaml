  ko: "@a@b*: 결국 이 텅 빈 보물 상자는\n욕망으로 가득 찬 우리의 눈을\n뜨게 하기 위해서......?\n@c0@"
  sl: "@a@b＊：大贤者在这里放一个空宝箱，\n　　就是为了让我们睁开那\n　　已经被欲望蒙蔽的双眼吗？\n@c0@"
  tl: "@a@b＊：大賢者在這裡放一個空寶箱，\n　　就是為了讓我們睜開那\n　　已經被欲望矇蔽的雙眼嗎？\n@c0@"
