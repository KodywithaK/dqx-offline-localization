  ja: "@a@b＊「なるほど　欲に　目がくらんで\n\t近道をしたら　宝が　開けられず\n\tまわり道をすれば　開けられたとは……\n@c0@"
  ko: "@a@b*: 그랬군, 욕심에 눈이 멀어\n빠른 길로 오면 상자가 안 열리고\n멀리 돌아오면 열린다니......\n@c0@"
