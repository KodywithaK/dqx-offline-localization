  tl: "@a@b%a002020：這個大嬸\n　　一定認為這次\n　　又會失敗吧。\n@c0@"
123:
  en: "@a%0%a002030@bFolks here will be stunned if the Prince actually manages to undergo the royal rite.\n@c0@"
