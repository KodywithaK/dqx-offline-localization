  ko: "@a@b%a002050: 이번 호위대는\n최강이거든요!\n@c0@"
  sl: "@a@b%a002050：这次陪同他的人\n　　是史上最强的！\n@c0@"
  tl: "@a@b%a002050：這次陪同他的人\n　　是史上最強的！\n@c0@"
125:
  en: "@a%0%a002000@bThis was all hide-'n'-seek to him? Blimey!\n@c0@"
  ja: "@a@b%a002000「かくれんぼ\n\tだったのかよ！\n@c0@"
