  sl: "@a@b%a002010：大家都\n　　认识王子，\n　　藏起来也没用啊。\n@c0@"
  tl: "@a@b%a002010：大家都\n　　認識王子，\n　　藏起來也沒用啊。\n@c0@"
116:
  en: "@a%0%a002020@bDoes this guy ever take five?\n@c0@"
  ja: "@a@b%a002020「おじさん　あいかわらず\n\tいそがしそうね。\n@c0@"
  ko: "@a@b%a002020: 아저씨, 여전히\n바빠 보이네.\n@c0@"
  sl: "@a@b%a002020：大叔还是\n　　这么忙啊。\n@c0@"
  tl: "@a@b%a002020：大叔還是\n　　這麼忙啊。\n@c0@"
117:
  en: "@a%0%a002030@bIf we're done exchanging pleasantries, we should make our way to the cave.\n@c0@"
  ja: "@a@b%a002030「ごあいさつが　すんだら\n\tすぐに　洗礼の洞くつに\n\t向かいましょう。\n@c0@"
  ko: "@a@b%a002030: 인사를 마치면\n어서 세례의 동굴로\n갑시다.\n@c0@"
  sl: "@a@b%a002030：打完招呼之后，\n　　就前往洗礼洞窟吧。\n@c0@"
  tl: "@a@b%a002030：打完招呼之後，\n　　就前往洗禮洞窟吧。\n@c0@"
118:
  en: "@a%0%a002050@bThat fellow seems to gain tremendous satisfaction from ploughin' his fields every day.\n@c0@"
  ja: "@a@b%a002050「畑仕事に　おわれる毎日……\n\t充実している　みたいですね。\n@c0@"
