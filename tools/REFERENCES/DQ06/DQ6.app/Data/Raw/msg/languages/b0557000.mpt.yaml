  sl: "@a@b%a002030：打完招呼之后，\n　　就前往洗礼洞窟吧。\n@c0@"
  tl: "@a@b%a002030：打完招呼之後，\n　　就前往洗禮洞窟吧。\n@c0@"
113:
  en: "@a%0%a002050@bWe won't be able to relax till this royal rite is done and dusted.\n@c0@"
  ja: "@a@b%a002050「私たちは　ホルス王子の\n\t洗礼のぎしきが　おわるまで\n\t気が　やすまりませんね……。\n@c0@"
