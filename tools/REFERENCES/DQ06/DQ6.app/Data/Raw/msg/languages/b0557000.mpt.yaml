  tl: "@a@b%a002050：啊……我剛才\n　　踩到了個什麼\n　　很溫暖的東西……\n@c0@"
120:
  en: "@a%0%a002000@bBack to the cave, aye? We ain't quittin', no matter how many trips this takes.\n@c0@"
  ja: "@a@b%a002000「また洞くつに……か。\n\tもう　こうなったら　何度でも\n\tつきあって　やるさ。\n@c0@"
  ko: "@a@b%a002000: 또 동굴에......\n이렇게 된 이상 몇 번이고\n같이 가 주지.\n@c0@"
  sl: "@a@b%a002000：又要去洞窟啊……\n　　既然这样，不管去几次，\n　　俺都奉陪到底。\n@c0@"
  tl: "@a@b%a002000：又要去洞窟啊……\n　　既然這樣，不管去幾次，\n　　俺都奉陪到底。\n@c0@"
121:
  en: "@a%0%a002010@bHopefully this time Prince Howard can finally finish the deed.\n@c0@"
  ja: "@a@b%a002010「うふふ。\n\t王子さまの　こういう　評判も\n\tこれで　最後に　したいわね。\n@c0@"
