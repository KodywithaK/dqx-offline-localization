  sl: "@a@b%a002010：这孩子不管什么时候\n　　都想跟王子玩呢。\n@c0@"
  tl: "@a@b%a002010：這孩子不管什麼時候\n　　都想跟王子玩呢。\n@c0@"
127:
  en: "@a%0%a002020@bIt's no wonder the Prince is so good at disappearing — he plays hide-and-seek with kids all day! \n@c0@"
  ja: "@a@b%a002020「ホルス王子　いつも\n\t子供たちと　きたえてるから\n\tかくれんぼ　上手なのよね……。\n@c0@"
