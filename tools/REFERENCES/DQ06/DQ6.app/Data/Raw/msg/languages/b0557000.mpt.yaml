  sl: "@a@b%a002020：要是再练练\n　　别的能力就好了呢……\n@c0@"
  tl: "@a@b%a002020：要是再練練\n　　別的能力就好了呢……\n@c0@"
129:
  en: "@a%0%a002030@bIf the Prince goes missing again, we might consider enlisting that boy's services to find him.\n@c0@"
  ja: "@a@b%a002030「もしまた　王子が\n\tいなくなったら　今度は　この子に\n\t手伝ってもらいましょう！\n@c0@"
  ko: "@a@b%a002030: 혹시 왕자가 또\n없어진다면 그때는 이 아이에게\n도움을 요청합시다!\n@c0@"
  sl: "@a@b%a002030：要是下次\n　　王子再跑了的话，\n　　就让这个孩子也来帮忙找吧！\n@c0@"
  tl: "@a@b%a002030：要是下次\n　　王子再跑了的話，\n　　就讓這個孩子也來幫忙找吧！\n@c0@"
130:
  en: "@a%0%a002050@bI'm hopin' there's no third act to Howard's hidin'.\n@c0@"
