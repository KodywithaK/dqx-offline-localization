  en: "@a%0%a002030@bIt is a relief to find the Prince at last, but the real trial begins now.\n@c0@"
  ja: "@a@b%a002030「まずは　よかった……。\n\tとはいえ　これからが\n\t大変ですね……。\n@c0@"
  ko: "@a@b%a002030: 일단은 다행이군요......\n하지만 앞으로가\n큰일입니다.\n@c0@"
  sl: "@a@b%a002030：暂时可以放心了……\n　　虽然这么说，\n　　但接下来也会很辛苦呢……\n@c0@"
  tl: "@a@b%a002030：暫時可以放心了……\n　　雖然這麼說，\n　　但接下來也會很辛苦呢……\n@c0@"
102:
  en: "@a%0%a002030@bI pray the Goddess grants us the patience to put up with Howard's cowardly nature.\n@c0@"
  ja: "@a@b%a002030「この　弱気な王子を\n\t一緒に　つれての　洞くつたんけん\n\tですからねえ……。\n@c0@"
  ko: "@a@b%a002030: 이 겁쟁이 왕자를\n데리고 함께 동굴 탐험을\n해야 하니까요......\n@c0@"
  sl: "@a@b%a002030：因为要跟\n　　这个胆小鬼王子\n　　去洞窟里探险啊……\n@c0@"
  tl: "@a@b%a002030：因為要跟\n　　這個膽小鬼王子\n　　去洞窟裡探險啊……\n@c0@"
103:
  en: "@a%0%a002050@bRight, second time lucky!\n@c0@"
  ja: "@a@b%a002050「さあ　２回目の　フリダシです。\n\t出発しましょう！\n@c0@"
  ko: "@a@b%a002050: 자, 원점으로 돌아온 것도 2번째군요.\n출발하죠!\n@c0@"
  sl: "@a@b%a002050：好了，\n　　第二次出发！\n@c0@"
  tl: "@a@b%a002050：好了，\n　　第二次出發！\n@c0@"
104:
  en: "@a%0%a002000@bC'mon, people! To the cave!\n@c0@"
  ja: "@a@b%a002000「さあ　さあ！\n\t洗礼の洞くつへ　まっしぐらだぜ！\n@c0@"
  ko: "@a@b%a002000: 자, 서둘러!\n세례의 동굴로 곧장 가자고!\n@c0@"
  sl: "@a@b%a002000：走吧走吧！\n　　朝洗礼洞窟前进！\n@c0@"
  tl: "@a@b%a002000：走吧走吧！\n　　朝洗禮洞窟前進！\n@c0@"
105:
  en: "@a%0%a002010@bThank the Goddess that we found the Prince.\n@c0@"
  ja: "@a@b%a002010「王子が　この村で\n\t見つかって　よかったわね。\n@c0@"
  ko: "@a@b%a002010: 왕자를 이 마을에서\n찾게 되어서 다행이야.\n@c0@"
  sl: "@a@b%a002010：在这个村里\n　　找到王子真是太好了。\n@c0@"
  tl: "@a@b%a002010：在這個村裡\n　　找到王子真是太好了。\n@c0@"
106:
  en: "@a%0%a002020@bPrince Howard looks down in the dumps... Not that I blame him.\n@c0@"
  ja: "@a@b%a002020「ホルス王子\n\tうかない顔　してるよ。\n\tま　しょうがないね。\n@c0@"
  ko: "@a@b%a002020: 홀스 왕자,\n떨떠름한 표정을 짓고 있어.\n뭐, 어쩔 수 없지만.\n@c0@"
  sl: "@a@b%a002020：荷尔斯王子\n　　一脸不快呢。\n　　唉，没办法啊。\n@c0@"
  tl: "@a@b%a002020：荷爾斯王子\n　　一臉不快呢。\n　　唉，沒辦法啊。\n@c0@"
107:
  en: "@a%0%a002030@bWe must get the job done this time!\n@c0@"
  ja: "@a@b%a002030「さて　これからが\n\t本番ですね！\n@c0@"
  ko: "@a@b%a002030: 자, 지금부터가\n시작이군요!\n@c0@"
  sl: "@a@b%a002030：接下来才进入正题啊！\n@c0@"
  tl: "@a@b%a002030：接下來才進入正題啊！\n@c0@"
108:
  en: "@a%0%a002050@bMaybe we can get back to Howcastle by dinner time...\n@c0@"
  ja: "@a@b%a002050「ホルストック城に\n\tばんごはん　までに\n\t帰れますかね？\n@c0@"
  ko: "@a@b%a002050: 홀스톡 성에\n저녁 식사 시간 전까지\n돌아갈 수 있을까요?\n@c0@"
  sl: "@a@b%a002050：能不能\n　　赶在晚饭之前\n　　回荷尔斯托克城呢？\n@c0@"
  tl: "@a@b%a002050：能不能\n　　趕在晚飯之前\n　　回荷爾斯托克城呢？\n@c0@"
109:
  en: "@a%0%a002000@bAye, thanks for the greetin', but we've got ourselves a cave to get to!\n@c0@"
  ja: "@a@b%a002000「オレの　ごきげんも\n\tうるわしいぜ！\n@c0@"
  ko: "@a@b%a002000: 내 기분도\n아주 괜찮아!\n@c0@"
  sl: "@a@b%a002000：俺的精神也好着呢！\n@c0@"
  tl: "@a@b%a002000：俺的精神也好著呢！\n@c0@"
110:
  en: "@a%0%a002010@bThe Prince's aura doesn't suggest he's very happy to be here. Hee hee.\n@c0@"
  ja: "@a@b%a002010「うふふ。　あんまり\n\tホルス王子の　ごきげんは\n\tうるわしそうじゃ　ないわね。\n@c0@"
  ko: "@a@b%a002010: 우후후.\n홀스 왕자의 기분은\n그렇게 괜찮아 보이지 않는걸.\n@c0@"
  sl: "@a@b%a002010：呵呵，\n　　荷尔斯王子\n　　兴致可没那么高呢。\n@c0@"
  tl: "@a@b%a002010：呵呵，\n　　荷爾斯王子\n　　興致可沒那麼高呢。\n@c0@"
111:
  en: "@a%0%a002020@bThe Prince is still with us, right? Just checking.\n@c0@"
