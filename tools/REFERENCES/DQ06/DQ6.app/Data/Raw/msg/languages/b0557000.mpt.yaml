  tl: "@a@b%a002030：要是\n　　洗禮儀式成功了的話……\n　　一定會很吃驚的吧。\n@c0@"
124:
  en: "@a%0%a002050@bThe Prince has nothing to fear — we're the best in the business!\n@c0@"
