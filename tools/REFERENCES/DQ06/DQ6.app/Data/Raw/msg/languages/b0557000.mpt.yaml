  sl: "@a@b%a002000：刚才那是\n　　捉迷藏啊！\n@c0@"
  tl: "@a@b%a002000：剛才那是\n　　捉迷藏啊！\n@c0@"
126:
  en: "@a%0%a002010@bI've never seen such an appetite for hide-and-seek.\n@c0@"
