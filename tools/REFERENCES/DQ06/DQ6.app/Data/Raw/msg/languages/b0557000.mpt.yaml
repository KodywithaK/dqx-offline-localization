  sl: "@a@b%a002050：每天都忙着下地干活……\n　　日子很充实呢。\n@c0@"
  tl: "@a@b%a002050：每天都忙著下地幹活……\n　　日子很充實呢。\n@c0@"
119:
  en: "@a%0%a002050@bOh heck! I've just stepped in something squishy...\n@c0@"
  ja: "@a@b%a002050「あ…　いま　私……\n\tなにか　ナマぬるい物を\n\tふみました……。\n@c0@"
  ko: "@a@b%a002050: 아... 지금 저......\n뭔가 미지근한 물체를\n밟았습니다......\n@c0@"
