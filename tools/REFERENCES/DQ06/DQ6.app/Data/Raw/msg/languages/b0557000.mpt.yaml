  tl: "@a@b%a002010：呵呵。\n　　真希望這是最後一次\n　　有人這樣評價王子呢。\n@c0@"
122:
  en: "@a%0%a002020@bI can read her like a book. She thinks we're gonna fail again.\n@c0@"
  ja: "@a@b%a002020「この　おばさん\n\tまた　失敗するだろうと\n\t思ってるのかなー。\n@c0@"
  ko: "@a@b%a002020: 이 아줌마,\n또 실패할 거라고\n생각하는 걸까~\n@c0@"
