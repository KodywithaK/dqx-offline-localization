  tl: "@a@b%a002000：這個大叔，\n　　真的對幹農活\n　　滿腔熱血呢。\n@c0@"
115:
  en: "@a%0%a002010@bI'm amazed the Prince managed to hide in this village, considering how well-known he is.\n@c0@"
  ja: "@a@b%a002010「こんなに　王子は\n\tみんなから　知られているのだもの\n\tかくれてなんか　いられないわね。\n@c0@"
