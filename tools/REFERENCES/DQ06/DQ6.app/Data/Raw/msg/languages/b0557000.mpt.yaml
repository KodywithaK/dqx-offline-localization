  ko: "@a@b%a002050: 2번 일어난 일은\n3번도 일어날 수 있는 걸까요......\n@c0@"
  sl: "@a@b%a002050：有第二次就会有第三次啊……\n@c0@"
  tl: "@a@b%a002050：有第二次就會有第三次啊……\n@c0@"
131:
  en: "@a%0%a002000@bCrikey, is that fella ever awake?\n@c0@"
  ja: "@a@b%a002000「よく　ねる\n\tおっさんだなあ。\n@c0@"
  ko: "@a@b%a002000: 아저씨\n정말 잘 자는군.\n@c0@"
  sl: "@a@b%a002000：这大叔\n　　瞌睡真多啊。\n@c0@"
  tl: "@a@b%a002000：這大叔\n　　瞌睡真多啊。\n@c0@"
132:
  en: "@a%0%a002010@bThe island isn't exactly ‘gone’ — you might just say it's on loan to someone. Hee hee.\n@c0@"
  ja: "@a@b%a002010「うふふ。　その島は\n\t今は　私たちが　使わせて\n\tもらっているものね。\n@c0@"
  ko: "@a@b%a002010: 우후후. 그 섬은\n지금 우리가\n사용하고 있지.\n@c0@"
  sl: "@a@b%a002010：呵呵。\n　　那个岛现在是\n　　我们在用着呢。\n@c0@"
  tl: "@a@b%a002010：呵呵。\n　　那個島現在是\n　　我們在用著呢。\n@c0@"
133:
