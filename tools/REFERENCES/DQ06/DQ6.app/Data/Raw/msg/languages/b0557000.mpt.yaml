0:
  en: "@a%0%a002000@bHmm... Where is that Prince?\n@c0@"
  ja: "@a@b%a002000「むーん……。\n\tいったい　どこに　いるんだよ。\n@c0@"
  ko: "@a@b%a002000: 으음.......\n대체 어디 있는 거야.\n@c0@"
  sl: "@a@b%a002000：唔……\n　　到底在哪啊？\n@c0@"
  tl: "@a@b%a002000：唔……\n　　到底在哪啊？\n@c0@"
1:
  en: "@a%0%a002010@bWhere is that Prince...\n@c0@"
  ja: "@a@b%a002010「どこかしら　ホルス王子……。\n@c0@"
  ko: "@a@b%a002010: 어디 있을까, 홀스 왕자......\n@c0@"
  sl: "@a@b%a002010：荷尔斯王子在哪啊……\n@c0@"
  tl: "@a@b%a002010：荷爾斯王子在哪啊……\n@c0@"
2:
  en: "@a%0%a002020@bThe Prince is the king of rotten manners!\n@c0@"
  ja: "@a@b%a002020「まったく　世話の　やける\n\t王子さまよね。\n@c0@"
  ko: "@a@b%a002020: 정말 사람 귀찮게 하는\n왕자라니까.\n@c0@"
  sl: "@a@b%a002020：真是个不让人\n　　省心的王子殿下啊。\n@c0@"
  tl: "@a@b%a002020：真是個不讓人\n　　省心的王子殿下啊。\n@c0@"
3:
  en: "@a%0%a002030@bThe Prince's hide-and-seek skills are unparalleled.\n@c0@"
  ja: "@a@b%a002030「彼は　かくれんぼの\n\t名人ですからねえ。\n@c0@"
  ko: "@a@b%a002030: 왕자는 숨바꼭질의\n달인 아닙니까.\n@c0@"
  sl: "@a@b%a002030：他可是个\n　　捉迷藏小明星啊。\n@c0@"
  tl: "@a@b%a002030：他可是個\n　　捉迷藏小明星啊。\n@c0@"
4:
  en: "@a%0%a002050@bOld %a002050's main priority is not steppin' in anythin' squelchy, squidgy or squashy.\n@c0@"
  ja: "@a@b%a002050「ヘンな物を　ふまないよう\n\tこの村では　くれぐれも　足もとに\n\t気をつけたほうが　いいですよ。\n@c0@"
  ko: "@a@b%a002050: 이상한 물체를 밟지 않도록\n이 마을에서는 발밑을 꼭\n조심하는 게 좋을 겁니다.\n@c0@"
  sl: "@a@b%a002050：在这个村子里\n　　走路要小心脚下，\n　　不要踩到奇怪的东西。\n@c0@"
  tl: "@a@b%a002050：在這個村子裡\n　　走路要小心腳下，\n　　不要踩到奇怪的東西。\n@c0@"
5:
  en: "@a%0%a002000@bSo he ran here to Howsworth, aye? We're hot on his trail now!\n@c0@"
  ja: "@a@b%a002000「ホルコッタに\n\tにげて来て　いたんだな。\n\tもう　にがさないぜ！\n@c0@"
  ko: "@a@b%a002000: 홀코타로\n도망쳐 온 모양이군.\n이제 놓치지 않을 테다!\n@c0@"
  sl: "@a@b%a002000：逃到荷尔克塔来了啊。\n　　不会再让他跑了！\n@c0@"
  tl: "@a@b%a002000：逃到荷爾克塔來了啊。\n　　不會再讓他跑了！\n@c0@"
6:
  en: "@a%0%a002010@bHe's here somewhere, but the village has plenty of places to hide... Let's knuckle down and find him!\n@c0@"
  ja: "@a@b%a002010「村の　中といっても\n\tけっこう　広いわね……\n\tがんばって　さがしましょう。\n@c0@"
  ko: "@a@b%a002010: 마을 안이라도 해도\n범위가 넓은걸......\n힘내서 찾아 보자.\n@c0@"
  sl: "@a@b%a002010：虽然是在村里，\n　　但是范围还是很广。\n　　加油找吧。\n@c0@"
  tl: "@a@b%a002010：雖然是在村裡，\n　　但是範圍還是很廣。\n　　加油找吧。\n@c0@"
7:
  en: "@a%0%a002020@bHe's in the village! Let's go!\n@c0@"
  ja: "@a@b%a002020「村の奥だって！\n\t早く　行ってみよっ！\n@c0@"
  ko: "@a@b%a002020: 마을 안쪽으로 갔대!\n어서 가 보자!\n@c0@"
  sl: "@a@b%a002020：她说王子跑向了\n　　村子深处！我们快去看看吧！\n@c0@"
  tl: "@a@b%a002020：她說王子跑向了\n　　村子深處！我們快去看看吧！\n@c0@"
8:
  en: "@a%0%a002030@bA verified sighting of the Prince, at last! This is a positive sign!\n@c0@"
  ja: "@a@b%a002030「とびっきりの\n\t情報ですね！　よかった。\n\t見とおしは　明るいです！\n@c0@"
  ko: "@a@b%a002030: 확실한\n정보로군요! 다행입니다.\n찾을 수 있겠어요!\n@c0@"
  sl: "@a@b%a002030：这情报真是\n　　及时雨啊！太好了。\n　　线索清晰起来了！\n@c0@"
  tl: "@a@b%a002030：這情報真是\n　　及時雨啊！太好了。\n　　線索清晰起來了！\n@c0@"
9:
  en: "@a%0%a002050@bPoor lad. Slime slobber is no laughin' matter.\n@c0@"
  ja: "@a@b%a002050「どこを　かまれたんでしょう。\n\tやっぱり　オシリですかねえ。\n@c0@"
  ko: "@a@b%a002050: 어딜 물린 걸까요?\n역시 엉덩이일까요?\n@c0@"
  sl: "@a@b%a002050：不知道哪里被咬了。\n　　一定是屁股吧。\n@c0@"
  tl: "@a@b%a002050：不知道哪裡被咬了。\n　　一定是屁股吧。\n@c0@"
10:
  en: "@a%0%a002000@bAye, it'd do the Prince good to get a bit dirty — after gettin' purified first, of course.\n@c0@"
  ja: "@a@b%a002000「いい　アイディアだが\n\t今はまだ　ほかに　やることが\n\tたくさん　あるだろうからな。\n@c0@"
  ko: "@a@b%a002000: 좋은 생각이지만\n지금은 그거 말고도 할 일이\n많이 있다고.\n@c0@"
  sl: "@a@b%a002000：这主意倒是不错。\n　　不过王子还有很多\n　　事情要做啊。\n@c0@"
  tl: "@a@b%a002000：這主意倒是不錯。\n　　不過王子還有很多\n　　事情要做啊。\n@c0@"
11:
  en: "@a%0%a002010@bThe future king probably should know how his subjects live.\n@c0@"
  ja: "@a@b%a002010「国の　人びとの\n\t生活を　知るのにも\n\tちょうど　いいわね。\n@c0@"
  ko: "@a@b%a002010: 백성들의\n생활상을 알기 위해서라도\n해 보면 정말 좋겠네.\n@c0@"
  sl: "@a@b%a002010：这可以帮助他\n　　了解到这个国家\n　　老百姓的生活状况呢。\n@c0@"
  tl: "@a@b%a002010：這可以幫助他\n　　瞭解到這個國家\n　　老百姓的生活狀況呢。\n@c0@"
12:
  en: "@a%0%a002020@bI bet the Prince would bolt before he got within a hundred feet of those fields.\n@c0@"
  ja: "@a@b%a002020「畑仕事　させたって\n\tきっと　にげちゃうと　思うな。\n@c0@"
  ko: "@a@b%a002020: 밭일을 시켜도\n분명히 도망칠걸.\n@c0@"
  sl: "@a@b%a002020：让他下地干活的话，\n　　肯定会逃走的吧。\n@c0@"
  tl: "@a@b%a002020：讓他下地幹活的話，\n　　肯定會逃走的吧。\n@c0@"
13:
  en: "@a%0%a002030@bNever mind his agricultural prospects — where is he?\n@c0@"
  ja: "@a@b%a002030「それにしても\n\tどこに　いるのでしょうね\n\tホルス王子……。\n@c0@"
  ko: "@a@b%a002030: 그나저나\n어디에 있는 걸까요,\n홀스 왕자......\n@c0@"
  sl: "@a@b%a002030：不过荷尔斯王子\n　　到底在哪啊……\n@c0@"
  tl: "@a@b%a002030：不過荷爾斯王子\n　　到底在哪啊……\n@c0@"
14:
  en: "@a%0%a002050@bThis fellow's desperate for some help around the farm, eh?\n@c0@"
  ja: "@a@b%a002050「この人　よっぽど\n\t人手が　ほしいのでしょうか。\n@c0@"
  ko: "@a@b%a002050: 이 사람, 그렇게나\n일손이 필요한 걸까요?\n@c0@"
  sl: "@a@b%a002050：这人一定非常想\n　　找人帮忙干活吧。\n@c0@"
  tl: "@a@b%a002050：這人一定非常想\n　　找人幫忙幹活吧。\n@c0@"
15:
  en: "@a%0%a002000@bI see where that lady's coming from, but rules are rules 'n' everything like that.\n@c0@"
  ja: "@a@b%a002000「おばさんの　気持ちは\n\tまあ　わかるけど　ルールってのも\n\tだいじな　ことだからな。\n@c0@"
  ko: "@a@b%a002000: 아줌마의 마음은\n모르는 바가 아니지만 규칙이란 것도\n중요하다고.\n@c0@"
  sl: "@a@b%a002000：俺能理解\n　　大婶的心情，\n　　不过规矩就是规矩啊。\n@c0@"
  tl: "@a@b%a002000：俺能理解\n　　大嬸的心情，\n　　不過規矩就是規矩啊。\n@c0@"
16:
  en: "@a%0%a002010@bMany of the villagers are quite fond of the Prince, aren't they?\n@c0@"
  ja: "@a@b%a002010「この村には\n\t王子に　好意的な　人たちが\n\tたくさんいるのね。\n@c0@"
  ko: "@a@b%a002010: 이 마을에는\n왕자에게 호의적인 사람들이\n많네.\n@c0@"
  sl: "@a@b%a002010：这个村\n　　喜欢王子的人真不少呢。\n@c0@"
  tl: "@a@b%a002010：這個村\n　　喜歡王子的人真不少呢。\n@c0@"
17:
  en: "@a%0%a002020@bI can see why the King's giving the Prince a little push. Otherwise, he's the sort who would goof off from cradle to grave.\n@c0@"
  ja: "@a@b%a002020「王子みたいな　タイプは\n\t少しくらい　強引に　やらないと\n\t自分からは　何もしないわよね！\n@c0@"
  ko: "@a@b%a002020: 왕자 같은 타입은\n억지로라도 시키지 않으면\n자기 혼자서는 아무것도 안 한다구!\n@c0@"
  sl: "@a@b%a002020：王子这种人，\n　　就是要对他强硬一点，\n　　要不他是不肯主动做事的！\n@c0@"
  tl: "@a@b%a002020：王子這種人，\n　　就是要對他強硬一點，\n　　要不他是不肯主動做事的！\n@c0@"
18:
  en: "@a%0%a002030@bHarsh though it may sound, Prince Howard has no choice but to fulfil his duty.\n@c0@"
  ja: "@a@b%a002030「もし　やめさせたら\n\t他の者たちに　しめしが\n\tつかないでしょう。\n@c0@"
  ko: "@a@b%a002030: 만약 그만두게 하면\n다른 사람들에게 본보기가\n되지 않겠지요.\n@c0@"
  sl: "@a@b%a002030：要是不让他去的话，\n　　是无法对他人起到\n　　示范作用的。\n@c0@"
  tl: "@a@b%a002030：要是不讓他去的話，\n　　是無法對他人起到\n　　示範作用的。\n@c0@"
19:
  en: "@a%0%a002030@bWith royal blood comes power, but also the burden of responsibility.\n@c0@"
  ja: "@a@b%a002030「上に立つ者は\n\tそれなりの　宿命も　背負って\n\t行くものなのですよね。\n@c0@"
  ko: "@a@b%a002030: 위에서 군림하는 자는\n그 나름의 숙명을 지고\n가야 하는 법입니다.\n@c0@"
  sl: "@a@b%a002030：位居高者，\n　　必须肩负起其\n　　应当肩负的命运。\n@c0@"
  tl: "@a@b%a002030：位居高者，\n　　必須肩負起其\n　　應當肩負的命運。\n@c0@"
20:
  en: "@a%0%a002050@bPrince Howard's made it perfectly clear that he's in no rush to fulfil his royal duty.\n@c0@"
  ja: "@a@b%a002050「王子が　そうとう\n\tイヤがってることは　私たちも　\n\tかなり　思い知っていますが……。\n@c0@"
  ko: "@a@b%a002050: 왕자가 상당히\n싫어한다는 건 저희도\n뼈저리게 느끼고 있죠......\n@c0@"
  sl: "@a@b%a002050：我们也很清楚，\n　　王子他也不愿意做这事……\n@c0@"
  tl: "@a@b%a002050：我們也很清楚，\n　　王子他也不願意做這事……\n@c0@"
21:
  en: "@a%0%a002000@bPrince Howard came here!? He must be inside! That's that — we got him cornered!\n@c0@"
  ja: "@a@b%a002000「ホルス王子が　来た！？\n\tよーし　この中だな？\n\tもう　にがさないぜ！\n@c0@"
  ko: "@a@b%a002000: 홀스 왕자가 왔다고!?\n좋았어! 이 안에 있단 말이지?\n이제 놓치지 않을 거다!\n@c0@"
  sl: "@a@b%a002000：荷尔斯王子来了？！\n　　好，就在这里面是吧？\n　　不会再让他跑了！\n@c0@"
  tl: "@a@b%a002000：荷爾斯王子來了？！\n　　好，就在這裡面是吧？\n　　不會再讓他跑了！\n@c0@"
22:
  en: "@a%0%a002010@bHave we finally found him!?\n@c0@"
  ja: "@a@b%a002010「やっと　見つけた！？\n@c0@"
  ko: "@a@b%a002010: 이제 겨우 찾은 걸까!?\n@c0@"
  sl: "@a@b%a002010：终于找到了么？！\n@c0@"
  tl: "@a@b%a002010：終於找到了麼？！\n@c0@"
23:
  en: "@a%0%a002020@bShaking? Ugh... I should've figured.\n@c0@"
  ja: "@a@b%a002020「ブルブル　ふるえてた？\n\tああ……やっぱりというか\n\tなんというか……。\n@c0@"
  ko: "@a@b%a002020: 덜덜 떨고 있었다고?\n아...... 이것 참\n예상대로이긴 한데......\n@c0@"
  sl: "@a@b%a002020：浑身发抖？\n　　啊……这到底算是意料之中\n　　还是什么啊……\n@c0@"
  tl: "@a@b%a002020：渾身發抖？\n　　啊……這到底算是意料之中\n　　還是什麼啊……\n@c0@"
24:
  en: "@a%0%a002030@bIf he is this shaken from merely entering the cave, how will he ever make it far enough inside to complete the rite?\n@c0@"
  ja: "@a@b%a002030「コワイも　なにも\n\tまだ　入口でしたよね……。\n@c0@"
  ko: "@a@b%a002030: 무섭고 말고 할 게\n뭐 있습니까? 입구까지밖에 못 갔는데......\n@c0@"
  sl: "@a@b%a002030：没什么可怕的吧。\n　　刚刚走到入口而已啊……\n@c0@"
  tl: "@a@b%a002030：沒什麼可怕的吧。\n　　剛剛走到入口而已啊……\n@c0@"
25:
  en: "@a%0%a002050@bI'm guessin' the Prince wasn't shakin' and sobbin' with excitement...\n@c0@"
  ja: "@a@b%a002050「王子の　ブルブル　は\n\tむしゃぶるいでは\n\tないですよね。\n@c0@"
  ko: "@a@b%a002050: 왕자가 떨고 있었던 건\n설레어서 떨고 있었던 건\n아니겠죠.\n@c0@"
  sl: "@a@b%a002050：王子应该不是因为\n　　战前太过激动\n　　而浑身发抖吧。\n@c0@"
  tl: "@a@b%a002050：王子應該不是因為\n　　戰前太過激動\n　　而渾身發抖吧。\n@c0@"
26:
  en: "@a%0%a002000@bPrince? You about?\n@c0@"
  ja: "@a@b%a002000「王子　いるかな？\n@c0@"
  ko: "@a@b%a002000: 혹시 왕자가 있으려나?\n@c0@"
  sl: "@a@b%a002000：王子在吗？\n@c0@"
  tl: "@a@b%a002000：王子在嗎？\n@c0@"
27:
  en: "@a%0%a002010@bWe can't rest until we've searched every corner.\n@c0@"
  ja: "@a@b%a002010「とりあえず　くまなく\n\t探してみるしか　ないわね。\n@c0@"
  ko: "@a@b%a002010: 우선 빠짐없이\n찾아보는 수밖엔 없어.\n@c0@"
  sl: "@a@b%a002010：总之先\n　　彻彻底底找找看吧。\n@c0@"
  tl: "@a@b%a002010：總之先\n　　徹徹底底找找看吧。\n@c0@"
28:
  en: "@a%0%a002020@bI doubt he'd be in here — not with that lady eyeballing the entrance.\n@c0@"
  ja: "@a@b%a002020「こんな　入口で\n\tおばさんが　見ているような\n\tところには　こないわよね。\n@c0@"
  ko: "@a@b%a002020: 이렇게 입구에서\n아줌마가 뻔히 보고 있는\n곳엔 안 오겠지.\n@c0@"
  sl: "@a@b%a002020：这种入口处，\n　　谁进来大婶都会看得一清二楚，\n　　王子应该不会来的吧。\n@c0@"
  tl: "@a@b%a002020：這種入口處，\n　　誰進來大嬸都會看得一清二楚，\n　　王子應該不會來的吧。\n@c0@"
29:
  en: "@a%0%a002030@bNo sign of him here...\n@c0@"
  ja: "@a@b%a002030「いませんよね……。\n@c0@"
  ko: "@a@b%a002030: 없겠지요......\n@c0@"
  sl: "@a@b%a002030：不在吧……\n@c0@"
  tl: "@a@b%a002030：不在吧……\n@c0@"
30:
  en: "@a%0%a002050@bNothing princely round here.\n@c0@"
  ja: "@a@b%a002050「……いない\n\tみたいですねえ。\n@c0@"
  ko: "@a@b%a002050: ......없는 것\n같군요.\n@c0@"
  sl: "@a@b%a002050：……好像不在呢。\n@c0@"
  tl: "@a@b%a002050：……好像不在呢。\n@c0@"
31:
  en: "@a%0%a002000@bCrikey. Folks're still dreamin' about the Isle o' Smiles?\n@c0@"
  ja: "@a@b%a002000「いまごろ\n\tしあわせの国の夢を\n\t見ているのかよ……。\n@c0@"
  ko: "@a@b%a002000: 이제 와서\n행복의 나라가 꿈에\n나온 거냐......\n@c0@"
  sl: "@a@b%a002000：事到如今\n　　还在做幸福国\n　　的美梦啊……\n@c0@"
  tl: "@a@b%a002000：事到如今\n　　還在做幸福國\n　　的美夢啊……\n@c0@"
32:
  en: "@a%0%a002010@bThere's no point in asking him about the Prince.\n@c0@"
  ja: "@a@b%a002010「王子のこと　聞いても\n\tしかたなさそうね。　\n@c0@"
  ko: "@a@b%a002010: 왕자에 대해서 물어봐도\n소용이 없겠는걸.　\n@c0@"
  sl: "@a@b%a002010：好像问他王子的事情\n　　也没什么用呢。\n@c0@"
  tl: "@a@b%a002010：好像問他王子的事情\n　　也沒什麼用呢。\n@c0@"
33:
