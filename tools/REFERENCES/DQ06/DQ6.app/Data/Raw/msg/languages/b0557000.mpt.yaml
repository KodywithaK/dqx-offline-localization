  sl: "@a@b%a002050：荷尔斯王子的\n　　洗礼仪式一分钟不结束，\n　　我们就一分钟都不能懈怠呢……\n@c0@"
  tl: "@a@b%a002050：荷爾斯王子的\n　　洗禮儀式一分鐘不結束，\n　　我們就一分鐘都不能懈怠呢……\n@c0@"
114:
  en: "@a%0%a002000@bThat fella's gotta learn that agriculturin' ain't for everyone.\n@c0@"
  ja: "@a@b%a002000「この　おっさん\n\tホント　畑仕事に\n\tせいが　出るよな。\n@c0@"
