0:
  en: "@a@b*: Welcome to the Slimopolis! Here to enter some prime slime-time battles, are you?\n@c0@"
  ja: "@a@b＊「スライム格闘場へ　ようこそ！\n\tあなたも　試合に　参加しますか？\n@c0@"
  ko: "@a@b*: 슬라임 격투장에 어서 오십시오!\n당신도 시합에 참가하시겠습니까?\n@c0@"
  sl: "@a@b＊：欢迎来到史莱姆格斗场！\n　　你也要参加比赛吗？\n@c0@"
  tl: "@a@b＊：歡迎來到史萊姆格鬥場！\n　　你也要參加比賽嗎？\n@c0@"
1:
  en: "@a@b*: Well, if it isn't the champion's party! Welcome to the Slimopolis!\n@c0@"
  ja: "@a@b＊「おや　これは　チャンピオンの\n\tご一行さま。\n\tスライム格闘場へ　ようこそ！\n@c0@"
  ko: "@a@b*: 오, 이게 누구십니까!\n챔피언 일행 아니십니까?\n슬라임 격투장에 어서 오십시오!\n@c0@"
  sl: "@a@b＊：哎呀！这不是\n　　冠军一行吗。\n　　欢迎来到史莱姆格斗场！\n@c0@"
  tl: "@a@b＊：哎呀！這不是\n　　冠軍一行嗎。\n　　歡迎來到史萊姆格鬥場！\n@c0@"
2:
  en: "@a@b*: Here to test your strength once more?\n@c0@"
  ja: "@a@b＊「また　チカラだめしに\n\t参加なさいますか？\n@c0@"
  ko: "@a@b*: 힘을 시험해 볼 겸\n다시 참가하시겠습니까?\n@c0@"
  sl: "@a@b＊：又要来参加比赛\n　　小试身手？\n@c0@"
  tl: "@a@b＊：又要來參加比賽\n　　小試身手？\n@c0@"
3:
  en: "@a@b*: If you're here to participate, then you'll have to come back with your master.\n@c0@"
  ja: "@a@b＊「試合に　参加するんでしたら\n\tご主人と　ごいっしょに\n\tいらして　ください。\n@c0@"
  ko: "@a@b*: 시합에 참가하시려면\n주인님과 함께\n오십시오.\n@c0@"
  sl: "@a@b＊：如果是要参加比赛的话\n　　请与主人同行。\n@c0@"
  tl: "@a@b＊：如果是要參加比賽的話\n　　請與主人同行。\n@c0@"
4:
  en: "@a@b*: If you're here to test your strength, then you'll have to come back with your master.\n@c0@"
  ja: "@a@b＊「また　チカラだめしに\n\t参加するんでしたら　ご主人と\n\tいっしょに　いらしてください。\n@c0@"
  ko: "@a@b*: 힘을 시험해 볼 겸\n다시 참가하고 싶으시다면\n주인님과 함께 오십시오.\n@c0@"
  sl: "@a@b＊：又要来参加比赛\n　　小试身手的话\n　　请与主人同行。\n@c0@"
  tl: "@a@b＊：又要來參加比賽\n　　小試身手的話\n　　請與主人同行。\n@c0@"
5:
  en: "@a@b*: In that case, enjoy today's combat card.\n@c0@"
  ja: "@a@b＊「では　本日　おこなわれる\n\tほかの　スライムたちの　試合を\n\tお楽しみください。\n@c0@"
  ko: "@a@b*: 그럼 오늘 열릴\n다른 슬라임들의 시합을\n즐겁게 관전해 주십시오.\n@c0@"
  sl: "@a@b＊：那么请尽情欣赏\n　　今天其他史莱姆们\n　　的比赛。\n@c0@"
  tl: "@a@b＊：那麼請盡情欣賞\n　　今天其他史萊姆們\n　　的比賽。\n@c0@"
6:
  en: "@a@b*: Sorry, but this arena's for slimes only. \n@c0@"
  ja: "@a@b＊「おそれいりますが　スライム以外は\n\t試合に　参加できません。\n@c0@"
  ko: "@a@b*: 죄송하지만 슬라임이 아니면\n참가할 수 없습니다.\n@c0@"
  sl: "@a@b＊：十分抱歉，\n　　只有史莱姆能参加比赛。\n@c0@"
  tl: "@a@b＊：十分抱歉，\n　　只有史萊姆能參加比賽。\n@c0@"
7:
  en: "@a@b*: Hate to be the one to break it to you, but %a000180 is dead.\n@c0@"
  ja: "@a@b＊「まいったな。\n\t%a000180さんは　死んでますよ。\n@c0@"
  ko: "@a@b*: 저런.\n%a000180 님은 죽은 상태잖습니까.\n@c0@"
  sl: "@a@b＊：这下难办了。\n　　%a000180死了。\n@c0@"
  tl: "@a@b＊：這下難辦了。\n　　%a000180死了。\n@c0@"
8:
  en: "@a@b*: We have no opponents left that could hope to match your strength. Would you like to see your certificate?\n@c0@"
  ja: "@a@b＊「あなた方は　強すぎるので　もう\n\t参加できる試合は　ありませんが……\n\t認定証を　ごらんになりますか？\n@c0@"
  ko: "@a@b*: 여러분은 너무 강해서 더 이상\n참가할 수 있는 시합이 없습니다만......\n인증서를 보시겠습니까?\n@c0@"
  sl: "@a@b＊：你们实在是太强了，\n　　已经没有你们能够参加的比赛了……\n　　要看一看认定证明吗？\n@c0@"
  tl: "@a@b＊：你們實在是太強了，\n　　已經沒有你們能夠參加的比賽了……\n　　要看一看認定證明嗎？\n@c0@"
9:
  en: "@a@b*: Be sure to check out the day's other battles while you're here!\n@c0@"
  ja: "@a@b＊「本日　おこなわれる試合も\n\tどうぞ　見学していってくださいね。\n@c0@"
  ko: "@a@b*: 오늘 열릴 시합도\n꼭 보고 가십시오.\n@c0@"
  sl: "@a@b＊：请好好观看\n　　今天举行的比赛。\n@c0@"
  tl: "@a@b＊：請好好觀看\n　　今天舉行的比賽。\n@c0@"
10:
  en: "@a@b*: Need a rundown of how the Slimopolis works?\n@c0@"
  ja: "@a@b＊「格闘場についての　説明を\n\t聞きますか？\n@c0@"
  ko: "@a@b*: 격투장에 대한 설명을\n들으시겠습니까?\n@c0@"
  sl: "@a@b＊：要听取\n　　关于格斗场的说明吗？\n@c0@"
  tl: "@a@b＊：要聽取\n　　關於格鬥場的說明嗎？\n@c0@"
11:
  en: "@a@b*: The fights here are divided into eight ranks based on strength.\n@c0@"
  ja: "@a@b＊「試合は　選手の強さによって\n\t８つのランクが　あります。\n@c0@"
  ko: "@a@b*: 시합은 선수의 실력에 따라\n8개의 랭크로 나뉩니다.\n@c0@"
  sl: "@a@b＊：比赛根据选手的强弱\n　　分为８个等级。\n@c0@"
  tl: "@a@b＊：比賽根據選手的強弱\n　　分為８個等級。\n@c0@"
12:
  en: "@a@b*: Stalwart slimes that manage to survive earn a slurptacular prize at the end of each rank.\n@c0@"
  ja: "@a@b＊「８つのランク　それぞれに\n\tすてきな　優勝賞品が\n\t用意されています。\n@c0@"
  ko: "@a@b*: 8개의 랭크에는 각각\n멋진 우승 상품이\n준비되어 있죠.\n@c0@"
  sl: "@a@b＊：８个等级中\n　　都各自准备了\n　　丰富的优胜奖品。\n@c0@"
  tl: "@a@b＊：８個等級中\n　　都各自準備了\n　　豐富的優勝獎品。\n@c0@"
13:
  en: "@a@b*: To clear a rank, you need to win three consecutive rounds.\n@c0@"
  ja: "@a@b＊「各ランクごとに\n\t３回戦　勝ち抜きで　優勝です！\n@c0@"
  ko: "@a@b*: 각 랭크마다 3회전을\n모두 이기면 우승입니다!\n@c0@"
  sl: "@a@b＊：各等级中\n　　获得３轮战斗的胜利即为优胜！\n@c0@"
  tl: "@a@b＊：各等級中\n　　獲得３輪戰鬥的勝利即為優勝！\n@c0@"
14:
  en: "@a@b*: If you can manage to clear the highest rank, you'll get a crack at the Slimopolis champion!\n@c0@"
  ja: "@a@b＊「最高ランクで　優勝すると\n\tチャンピオンとの　最終決戦が\n\tおこなわれます。\n@c0@"
  ko: "@a@b*: 최고 랭크에서 우승하면\n챔피언과의 최종 결승전이\n열립니다.\n@c0@"
  sl: "@a@b＊：在最高等级中获得优胜后\n　　会进行与冠军之间的\n　　最终决战。\n@c0@"
  tl: "@a@b＊：在最高等級中獲得優勝後\n　　會進行與冠軍之間的\n　　最終決戰。\n@c0@"
15:
  en: "@a@b*: Once you've cleared a rank, you're free to challenge it again at any time — except for the highest rank.\n@c0@"
  ja: "@a@b＊「なお　最高のランクいがいは\n\t優勝しても　もう一度\n\tチャレンジ　できます。\n@c0@"
  ko: "@a@b*: 또한 최고 랭크를 제외한 랭크는\n우승한 후에도 한 번 더\n도전할 수 있습니다.\n@c0@"
  sl: "@a@b＊：另外，除了最高等级以外，\n　　其他等级获得优胜后\n　　均可再次挑战。\n@c0@"
  tl: "@a@b＊：另外，除了最高等級以外，\n　　其他等級獲得優勝後\n　　均可再次挑戰。\n@c0@"
16:
  en: "@a@b*: You'll have to fight with a health and magic handicap, though. Have to keep the fights interesting, after all!\n@c0@"
  ja: "@a@b＊「ただし　その場合　体力や\n\t魔法力を　少し落として戦う\n\tハンディー戦と　なります！\n@c0@"
  ko: "@a@b*: 단, 그 경우에는 체력과\n마법력을 조금 떨어뜨리는\n핸디캡을 적용합니다!\n@c0@"
  sl: "@a@b＊：不过，此时会是\n　　损失一部分体力和魔法力\n　　的让步战！\n@c0@"
  tl: "@a@b＊：不過，此時會是\n　　損失一部分體力和魔法力\n　　的讓步戰！\n@c0@"
17:
  en: "@a@b*: Each rank has its own entry fee. I'd recommend starting with rank H, if I were you!\n@c0@"
  ja: "@a@b＊「参加料は　ランクによって\n\tちがいますが　最初は\n\tＡランクから始めると　いいですよ！\n@c0@"
  ko: "@a@b*: 참가비는 랭크에 따라\n다르지만 처음에는\nA랭크부터 시작하시면 될 겁니다!\n@c0@"
  sl: "@a@b＊：参加的费用会根据等级高低\n　　而有所不同，\n　　初期建议从Ａ等级开始哦！\n@c0@"
  tl: "@a@b＊：參加的費用會根據等級高低\n　　而有所不同，\n　　初期建議從Ａ等級開始哦！\n@c0@"
18:
  en: "@a@b*: Alright, %a002190! Which rank do you want to try?\n@c0@"
  ja: "@a@b＊「では　%a002190さん\n\tどの　試合に　参加するか\n\tえらんで　いただきましょう！\n@c0@"
  ko: "@a@b*: 그럼 %a002190 님,\n어느 시합에 참가하실지\n결정해 주십시오!\n@c0@"
  sl: "@a@b＊：那么%a002190，\n　　请选择\n　　要参加哪个等级的比赛！\n@c0@"
  tl: "@a@b＊：那麼%a002190，\n　　請選擇\n　　要參加哪個等級的比賽！\n@c0@"
19:
  en: "@a@b*: Since you've already cleared this rank once, you'll have to fight with a handicap, alright?\n@c0@"
  ja: "@a@b＊「同じランク　２回目なので\n\tハンディー戦に　なりますが\n\tいいですか？\n@c0@"
  ko: "@a@b*: 같은 랭크에 다시 도전하면\n핸디캡을 적용하는데\n괜찮으시겠습니까?\n@c0@"
  sl: "@a@b＊：由于是第２次参加同一等级的比赛，\n　　因此会进行让步赛，\n　　这样可以吗？\n@c0@"
  tl: "@a@b＊：由於是第２次參加同一等級的比賽，\n　　因此會進行讓步賽，\n　　這樣可以嗎？\n@c0@"
20:
  en: "@a@b*: Sorry, but I'm afraid you can't fight at that rank any more!\n@c0@"
  ja: "@a@b＊「ざんねんですが　そのランクに\n\tもう参加することは\n\tできません！\n@c0@"
  ko: "@a@b*: 아쉽게도 그 랭크에는\n이제 도전하실 수\n없습니다!\n@c0@"
  sl: "@a@b＊：非常遗憾，\n　　已经不能再参加\n　　这个等级的比赛了！\n@c0@"
  tl: "@a@b＊：非常遺憾，\n　　已經不能再參加\n　　這個等級的比賽了！\n@c0@"
21:
  en: "@a@b*: Alright. That'll be %a002200 gold coins, please.\n@c0@"
  ja: "@a@b＊「参加料　%a002200ゴールド\n\tいただきます。\n@c0@"
  ko: "@a@b*: 참가료 %a002200골드\n받겠습니다.\n@c0@"
  sl: "@a@b＊：收下了参加费用\n　　%a002200金币。\n@c0@"
  tl: "@a@b＊：收下了參加費用\n　　%a002200金幣。\n@c0@"
22:
  en: "@a@b*: What's that? Looks like you're a little short on funds, I'm afraid.\n@c0@"
  ja: "@a@b＊「おや？　ざんねんですが\n\tお金が　たりないようですね。\n@c0@"
  ko: "@a@b*: 음? 죄송하지만\n돈이 모자란 것 같군요.\n@c0@"
  sl: "@a@b＊：啊呀？真遗憾，\n　　您的钱似乎不够啊。\n@c0@"
  tl: "@a@b＊：啊呀？真遺憾，\n　　您的錢似乎不夠啊。\n@c0@"
23:
  en: "@a@b*: Hope to see you again soon!\n@c0@"
  ja: "@a@b＊「またの　おこしを\n\tおまちしております。\n@c0@"
  ko: "@a@b*: 그럼 또 오시길\n기다리겠습니다.\n@c0@"
  sl: "@a@b＊：期待您\n　　下次光临。\n@c0@"
  tl: "@a@b＊：期待您\n　　下次光臨。\n@c0@"
24:
  en: "@a@b*: Right! This next match is a rank %a002210 contest.\n@c0@"
  ja: "@a@b＊「では　%a002210ランクの\n\t試合を　おこないます。\n@c0@"
  ko: "@a@b*: 그럼 %a002210랭크\n시합을 시작하겠습니다.\n@c0@"
  sl: "@a@b＊：接下来举行\n　　等级%a002210的比赛。\n@c0@"
  tl: "@a@b＊：接下來舉行\n　　等級%a002210的比賽。\n@c0@"
25:
  en: "@a@b*: %0%a002190, jiggle on through the fighter's entrance!\n@c0@"
  ja: "@a@b＊「出場する　%a002190さんは\n\t選手の入場口へ　どうぞ！\n@c0@"
  ko: "@a@b*: 출전하실 %a002190 님은\n선수 입장 게이트로 가 주십시오!\n@c0@"
  sl: "@a@b＊：即将出场的%a002190\n　　请到选手入场口处！\n@c0@"
  tl: "@a@b＊：即將出場的%a002190\n　　請到選手入場口處！\n@c0@"
26:
  en: "@a@b*: It's your time to shine, slime! Round 1... Fight!\n@c0@"
  ja: "@a@b＊「では　１回戦目の\n\tバトルスタート！\n@c0@"
  ko: "@a@b*: 그럼 1회전\n배틀을 시작합니다!\n@c0@"
  sl: "@a@b＊：那么第１轮战斗\n　　开始！\n@c0@"
  tl: "@a@b＊：那麼第１輪戰鬥\n　　開始！\n@c0@"
27:
  en: "@a@b*: Congratulations, %a002190! Round %a000850 is yours. Now, on to round %a002230!\n@c0@"
  ja: "@a@b＊「おめでとう　ございます！\n\t%a002190さん　%a000850回戦　勝ち抜き\n\t%a002230回戦に　進出です！\n@c0@"
  ko: "@a@b*: 축하드립니다!\n%a002190 님은 %a000850회전에서 이겼으므로\n%a002230회전에 진출하셨습니다!\n@c0@"
  sl: "@a@b＊：恭喜恭喜！\n　　%a002190在第%a000850轮战斗中胜出，\n　　成功进入到第%a002230轮战斗中！\n@c0@"
  tl: "@a@b＊：恭喜恭喜！\n　　%a002190在第%a000850輪戰鬥中勝出，\n　　成功進入到第%a002230輪戰鬥中！\n@c0@"
28:
  en: "@a@b*: Keep it clean out there — and slimy! Round 2... Fight!\n@c0@"
  ja: "@a@b＊「では　２回戦目の\n\tバトルスタート！\n@c0@"
  ko: "@a@b*: 그럼 2회전\n배틀을 시작합니다!\n@c0@"
  sl: "@a@b＊：那么第２轮战斗\n　　开始！\n@c0@"
  tl: "@a@b＊：那麼第２輪戰鬥\n　　開始！\n@c0@"
29:
  en: "@a@b*: It's time for the final fight! Goo for the win! Round 3... Fiiight!\n@c0@"
  ja: "@a@b＊「３回戦目は　いよいよ　決勝です！\n\t相手も　かなり強敵ですよ。\n\tこうふんの　バトルスタートっ！！\n@c0@"
  ko: "@a@b*: 3회전은 결승전입니다!\n상대도 상당한 강적이죠.\n손에 땀을 쥐는 배틀을 시작합니다!\n@c0@"
  sl: "@a@b＊：第３轮战斗就是决胜局了！\n　　对手也是非常地强悍。\n　　令人振奋的战斗开始！！\n@c0@"
  tl: "@a@b＊：第３輪戰鬥就是決勝局了！\n　　對手也是非常地強悍。\n　　令人振奮的戰鬥開始！！\n@c0@"
30:
  en: "@a@b*: Congratulations! You've cleared rank A!\n@c0@"
  ja: "@a@b＊「ランクＨでの　優勝\n\tおめでとう　ございますっ！\n@c0@"
  ko: "@a@b*: H랭크 우승\n축하드립니다!\n@c0@"
  sl: "@a@b＊：恭喜在等级Ｈ中\n　　取得优胜！\n@c0@"
  tl: "@a@b＊：恭喜在等級Ｈ中\n　　取得優勝！\n@c0@"
31:
  en: "@a@b*: And now, ladies and gentlemen, the final battle against our very own Hammer!\n@c0@"
  ja: "@a@b＊「では　いよいよ　最終決戦！\n\tわれらが　チャンプとの対決です！\n@c0@"
  ko: "@a@b*: 그럼 대망의 최종 결승전!\n챔프와의 대결입니다!\n@c0@"
  sl: "@a@b＊：那么最终决战马上就要开始了！\n　　是与我们的强普进行对决！\n@c0@"
  tl: "@a@b＊：那麼最終決戰馬上就要開始了！\n　　是與我們的強普進行對決！\n@c0@"
32:
