24:
  en: "@a@b*: Humans, fearful humans... I'll never understand.\n㈡\n*: Do us all a favour and keep yourselves on land!\n@c0@"
  ja: "@a@b＊「なーんてね。\n\tキャハハハ！\n@c0@"
  ko: "@a@b*: 장난이지롱~\n꺄하하하!\n@c0@"
  sl: "@a@b＊：开玩笑啦。\n　　哈哈哈哈哈！\n@c0@"
  tl: "@a@b＊：開玩笑啦。\n　　哈哈哈哈哈！\n@c0@"
25:
  en: "@aUnda@bThough I miss Rod terribly, I suppose it's for the best...\n㈡\nBut spending time away from him is such a painful test!\n@c0@"
  ja: "@a@bディーネ「ロブは　元気にして\n\tいるのかしら……。\n@c0@"
