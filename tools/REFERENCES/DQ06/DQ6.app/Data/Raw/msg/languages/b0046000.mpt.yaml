  ja: "@a@bディーネ「あっ　それから……\n@c0@"
  ko: "@a@b디네: 아, 그리고......\n@c0@"
  sl: "@a@b蒂妮：啊，还有……\n@c0@"
  tl: "@a@b蒂妮：啊，還有……\n@c0@"
