  sl: "@a@b洛布：如果再见到蒂妮的话，\n　　请务必帮我转告她！\n@c0@"
  tl: "@a@b洛布：如果再見到蒂妮的話，\n　　請務必幫我轉告她！\n@c0@"
12:
  en: "@aRod@bTell her that one of these days, I'll be gettin' back in my boat to come and see—\n@c0@"
  ja: "@a@bロブ「いつか　かならず　オレが\n\tオレの船で　おまえに\n\t会いに……\n@c0@"
