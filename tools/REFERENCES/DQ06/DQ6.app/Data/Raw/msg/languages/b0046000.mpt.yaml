  ja: "@a@b＊「ぜったいに　オレは　また\n\t海へ　出てみせる！\n@c0@"
  ko: "@a@b*: 무슨 일이 있어도 나는 다시\n바다로 나가고 말 테다!\n@c0@"
  sl: "@a@b＊：等着瞧吧！\n　　我绝对还会出海的！\n@c0@"
  tl: "@a@b＊：等著瞧吧！\n　　我絕對還會出海的！\n@c0@"
7:
  en: "@a@b*: It's good to see him back on an even keel!\n@c0@"
  ja: "@a@b＊「なんて　いいだしてな。\n\tなにか　こう……\n\tふっきれたようじゃな。\n@c0@"
  ko: "@a@b*: 그렇게 말하더군.\n뭐라고 할까......\n훌훌 털어낸 것 같았다네.\n@c0@"
  sl: "@a@b＊：整天说着类似的话。\n　　怎么说呢……\n　　心里的大石头好像终于落地了。\n@c0@"
  tl: "@a@b＊：整天說著類似的話。\n　　怎麼說呢……\n　　心裡的大石頭好像終於落地了。\n@c0@"
8:
  en: "@aRod@b%0%a000120! How'd it go with my Unda?\n@c0@"
  ja: "@a@bロブ「おお　%a000120！\n\tディーネは？\n\tディーネは　どうした！？\n@c0@"
  ko: "@a@b롭: 오오, %a000120!\n디네는?\n디네는 어떻게 됐어!?\n@c0@"
  sl: "@a@b洛布：喂！%a000120！\n　　蒂妮呢？\n　　蒂妮怎么样了？\n@c0@"
  tl: "@a@b洛布：喂！%a000120！\n　　蒂妮呢？\n　　蒂妮怎麼樣了？\n@c0@"
9:
  en: "@aRod@bShe made it back safely to her companions? Thank the Goddess!\n@c0@"
  ja: "@a@bロブ「そ　そうか　仲間たちの\n\tところに　もどれたんだな。\n\tよーし　よし！！\n@c0@"
  ko: "@a@b롭: 그, 그렇군. 친구들이\n있는 곳으로 돌아갔다고?\n좋아. 잘됐군!!\n@c0@"
  sl: "@a@b洛布：是、是吗，已经回到\n　　伙伴们的身边了啊。\n　　太好了！太好了！\n@c0@"
  tl: "@a@b洛布：是、是嗎，已經回到\n　　夥伴們的身邊了啊。\n　　太好了！太好了！\n@c0@"
10:
  en: "@aRod@bI can't thank you enough. I really owe you one! And since I'm rackin' up a debt...\n@c0@"
  ja: "@a@bロブ「ありがとよ。\n\tあんたにゃ　世話んなった。\n\t世話ついでに　もうひとつ……\n@c0@"
  ko: "@a@b롭: 고맙다.\n너한테 신세를 지고 말았네.\n신세 지는 김에 하나만 더......\n@c0@"
  sl: "@a@b洛布：谢谢。\n　　真是辛苦你们了。\n　　不过，我还有件事……\n@c0@"
  tl: "@a@b洛布：謝謝。\n　　真是辛苦你們了。\n　　不過，我還有件事……\n@c0@"
11:
  en: "@aRod@bCould I ask you to pass Unda a message if you ever bump into her again?\n@c0@"
  ja: "@a@bロブ「もし　また　ディーネに\n\t会ったら　伝えといてくれ！\n@c0@"
