0:
  en: "@a@b*: Rod's been calm as a carp lately. I wonder what's happened to him...\n@c0@"
  ja: "@a@b＊「なんだか　最近　あのロブが\n\tおとなしくなったのよ。\n\tなにか　あったのかしらね。\n@c0@"
  ko: "@a@b*: 어찌 된 일인지 요새 롭이\n얌전해졌어.\n무슨 일이 있었던 걸까?\n@c0@"
  sl: "@a@b＊：总觉得洛布最近\n　　变得稳重了很多，\n　　到底是为什么呢？\n@c0@"
  tl: "@a@b＊：總覺得洛布最近\n　　變得穩重了很多，\n　　到底是為什麼呢？\n@c0@"
1:
  en: "@a@b*: People, eh? Just when you think you know someone, they change beyond all recognition.\n@c0@"
  ja: "@a@b＊「人って　変われば\n\t変わるものよねえ……。\n@c0@"
  ko: "@a@b*: 사람은 변하려고 마음만 먹으면\n변할 수 있는 건가 봐......\n@c0@"
  sl: "@a@b＊：人真是\n　　说改变就能改变啊……\n@c0@"
  tl: "@a@b＊：人真是\n　　說改變就能改變啊……\n@c0@"
2:
  en: "@a@b*: I keep hearin' tales of a terrifyin' monster that lurks at the bottom of the south-eastern sea.\n@c0@"
  ja: "@a@b＊「ウワサでは　南東の海の底に\n\tものすごい化け物が\n\t住んでいるそうじゃ。\n@c0@"
  ko: "@a@b*: 듣기로 남동쪽 바다 밑바닥에\n엄청난 괴물이\n살고 있다고 하네.\n@c0@"
  sl: "@a@b＊：传说，东南边的海底下\n　　住着一个十分可怕的怪物。\n@c0@"
  tl: "@a@b＊：傳說，東南邊的海底下\n　　住著一個十分可怕的怪物。\n@c0@"
3:
  en: "@a@b*: If only someone would catch, gut, and fillet the blighter. I miss goin' fishin'!\n@c0@"
  ja: "@a@b＊「だれぞ　その化け物を\n\t倒してくれりゃ　ちっとは\n\t魚がとれるようになるじゃろうか。\n@c0@"
  ko: "@a@b*: 누구든 그 괴물을\n쓰러뜨려 준다면 고기가 조금쯤은\n잡히게 되지 않을까 싶은데 말일세.\n@c0@"
  sl: "@a@b＊：要是有人能够把\n　　那个怪物打倒，我们\n　　也能稍微捕到几条鱼了吧。\n@c0@"
  tl: "@a@b＊：要是有人能夠把\n　　那個怪物打倒，我們\n　　也能稍微捕到幾條魚了吧。\n@c0@"
4:
  en: "@a@b*: Looks like the Plaice to Be is serving fish again!\n@c0@"
  ja: "@a@b＊「この店で　また　魚を\n\t売るように　なったんだ。\n@c0@"
  ko: "@a@b*: 이 가게에서 다시 생선을\n팔게 됐어.\n@c0@"
  sl: "@a@b＊：这家店\n　　又开始卖鱼了。\n@c0@"
  tl: "@a@b＊：這家店\n　　又開始賣魚了。\n@c0@"
5:
  en: "@a@b*: Rod really seems like a new man these days.\n@c0@"
  ja: "@a@b＊「ロブの　ようすが\n\t変わったんじゃよ。\n@c0@"
  ko: "@a@b*: 요새 롭의 태도가\n변했다네.\n@c0@"
  sl: "@a@b＊：洛布完全\n　　变了个样子呢。\n@c0@"
  tl: "@a@b＊：洛布完全\n　　變了個樣子呢。\n@c0@"
6:
