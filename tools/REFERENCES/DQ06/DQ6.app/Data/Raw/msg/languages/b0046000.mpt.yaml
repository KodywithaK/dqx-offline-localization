  sl: "@a@b洛布：总有一天我一定会\n　　驾着我自己的船\n　　去见她……\n@c0@"
  tl: "@a@b洛布：總有一天我一定會\n　　駕著我自己的船\n　　去見她……\n@c0@"
13:
  en: "@aRod@bNo, make that come and GET her. It's a promise!\n@c0@"
  ja: "@a@bロブ「……いや　おまえを\n\tむかえに　いくってな！！\n@c0@"
  ko: "@a@b롭: ......아니, 널\n데리러 가겠다고!!\n@c0@"
  sl: "@a@b洛布：……不对，\n　　是去接她！！\n@c0@"
  tl: "@a@b洛布：……不對，\n　　是去接她！！\n@c0@"
14:
  en: "@aOva@bWe mermaids are retiring — timid, bashful, shy.\n㈡\nThat's why we take such pains to hide from prying human eyes.\n@c0@"
  ja: "@a@bディーナ「この　岩場のことは\n\t他の人間には　ヒミツに\n\tしておいて　くださいね。\n@c0@"
  ko: "@a@b디나: 이 암반에 관한 건\n다른 인간들에게는\n비밀로 해 주세요.\n@c0@"
  sl: "@a@b蒂娜：这片礁岩的事情\n　　请千万不要告诉别人。\n@c0@"
  tl: "@a@b蒂娜：這片礁岩的事情\n　　請千萬不要告訴別人。\n@c0@"
15:
  en: "@aOva@bSo please do not tell others of anything you've seen.\n㈡\nJust leave us to our favoured rocks  to pose and primp and preen.\n@c0@"
  ja: "@a@bディーナ「お願いですから\n\t私たちを　そっとしておいて\n\tください……。\n@c0@"
  ko: "@a@b디나: 부탁이에요.\n우리를 그냥\n내버려두세요......\n@c0@"
  sl: "@a@b蒂娜：拜托你了。\n　　就让我们在这里\n　　安静地生活吧……\n@c0@"
  tl: "@a@b蒂娜：拜託你了。\n　　就讓我們在這裡\n　　安靜地生活吧……\n@c0@"
16:
  en: "@a@b*: Ah, the eternal question! One posed many times!\n㈡\n*: Why is it that mermen are never mentioned in our rhymes?\n@c0@"
  ja: "@a@b＊「え？　男の人魚は\n\tいないのか　ですって？\n@c0@"
  ko: "@a@b*: 응? 남자 인어는\n없냐구?\n@c0@"
  sl: "@a@b＊：嗯？你是问\n　　有没有男性人鱼？\n@c0@"
  tl: "@a@b＊：嗯？你是問\n　　有沒有男性人魚？\n@c0@"
17:
  en: "@a@b*: I'm afraid I can't reveal to you if mermen do exist.\n㈡\n*: The answer is a secret! So please do not insist! Ⓟ\n@c0@"
  ja: "@a@b＊「うふふ　ナ・イ・ショⓅ\n@c0@"
  ko: "@a@b*: 우후후. 비밀이지롱Ⓟ\n@c0@"
  sl: "@a@b＊：呵呵呵，保，密，哟Ⓟ\n@c0@"
  tl: "@a@b＊：呵呵呵，保，密，喲Ⓟ\n@c0@"
18:
  en: "@a@b*: Creatures of the land are a mystery to me.\n㈡\n*: I often wonder what it's like to roam outside the sea…\n@c0@"
  ja: "@a@b＊「ほんとは　ちょっとだけ\n\t人間の暮らしに\n\t興味あったりするのよ。\n@c0@"
  ko: "@a@b*: 사실은 인간의 삶에\n조금쯤은\n흥미가 생기기도 해.\n@c0@"
  sl: "@a@b＊：老实说，\n　　我对人类的生活\n　　也有一点好奇呢。\n@c0@"
  tl: "@a@b＊：老實說，\n　　我對人類的生活\n　　也有一點好奇呢。\n@c0@"
19:
  en: "@a@b*: Sleeping while you float along is really a delight.\n㈡\n*: I like to bed down on the waves each and every night!\n@c0@"
  ja: "@a@b＊「ゆれる波に　身をあずけて\n\tゆらゆらと　ただよいながら\n\tねむるの……。\n@c0@"
  ko: "@a@b*: 흔들리는 파도에 몸을 \n맡기고 너울너울 떠다니면서\n잠이 들어......\n@c0@"
  sl: "@a@b＊：让身体随着摇曳的海浪\n　　晃晃悠悠地漂着睡上一觉……\n@c0@"
  tl: "@a@b＊：讓身體隨著搖曳的海浪\n　　晃晃悠悠地漂著睡上一覺……\n@c0@"
20:
  en: "@a@b*: But often, when it's stormy, I wake from my repose...\n㈡\n*: To the truly dreadful feeling of seawater up my nose!\n@c0@"
  ja: "@a@b＊「とっても　気持ちいいのよ。\n@c0@"
  ko: "@a@b*: 정말 기분이 좋아.\n@c0@"
  sl: "@a@b＊：那才叫舒服呢！\n@c0@"
  tl: "@a@b＊：那才叫舒服呢！\n@c0@"
21:
  en: "@a@b*: What fun it is to frolic here within the salty sea!\n㈡\n*: Come, my fair-finned sister! Try and capture me!\n@c0@"
  ja: "@a@b＊「キャハハハ！\n\tキャッ　キャッ！\n@c0@"
  ko: "@a@b*: 꺄하하하!\n꺄아~ 꺄아!\n@c0@"
  sl: "@a@b＊：哈哈哈哈！\n　　哇！哇！\n@c0@"
  tl: "@a@b＊：哈哈哈哈！\n　　哇！哇！\n@c0@"
22:
  en: "@a@b*: ...Eek! Look at that boat! Its presence is divine!\n㈡\n*: Never have I seen a ship more pleasant or sublime!\n@c0@"
  ja: "@a@b＊「あー　おふねだー。\n\tスゴーイ！\n@c0@"
  ko: "@a@b*: 우와~ 배다~\n멋있어~!\n@c0@"
  sl: "@a@b＊：啊！是船啊！\n　　了不起！\n@c0@"
  tl: "@a@b＊：啊！是船啊！\n　　了不起！\n@c0@"
23:
  en: "@a@b*: Humans, my dear sister! Are they here to stare?\n㈡\n*: As long as they don't kidnap us, I honestly don't care!\n@c0@"
  ja: "@a@b＊「ひー　にんげん　だわ！\n\tさらわれて　しまうわ！\n@c0@"
