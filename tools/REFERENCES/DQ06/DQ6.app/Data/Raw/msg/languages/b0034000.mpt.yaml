  en: "@aSkip Tickle@bWell, when he died, I could swear he whispered someone's name...\n@c0@"
  ja: "@a@bマハメド「だれかの名を呼んだような\n\tそんな気が　するんだ。\n@c0@"
  ko: "@a@b마하메드: 누군가의 이름을 부른 듯한\n느낌이 든단 말이지.\n@c0@"
  sl: "@a@b穆罕默德：我总觉得\n　　它叫了谁的名字。\n@c0@"
  tl: "@a@b穆罕默德：我總覺得\n　　它叫了誰的名字。\n@c0@"
32:
  en: "@aSkip Tickle@bIt sounded like ‘Mor’-something. Or maybe it was something-‘mor’? I can't be sure...\n@c0@"
  ja: "@a@bマハメド「もし　聞きちがいで\n\tなかったら　たしか\n\tなんとかムーアさまと……。\n@c0@"
  ko: "@a@b마하메드: 혹시 잘못 들은 게\n아니라면 내 기억에\n무슨 무아 님이라고 했던 것 같은데......\n@c0@"
  sl: "@a@b穆罕默德：要是没听错的话，\n　　叫的好像是\n　　什么什么穆亚大人……\n@c0@"
  tl: "@a@b穆罕默德：要是沒聽錯的話，\n　　叫的好像是\n　　什麼什麼穆亞大人……\n@c0@"
33:
  en: "@aSkip Tickle@bThat ring any bells? I wonder who it could be...\n@c0@"
  ja: "@a@bマハメド「いったい　だれなんだ！\n@c0@"
  ko: "@a@b마하메드: 대체 누구란 말인가!\n@c0@"
  sl: "@a@b穆罕默德：那到底是谁啊！\n@c0@"
  tl: "@a@b穆罕默德：那到底是誰啊！\n@c0@"
