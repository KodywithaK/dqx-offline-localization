  sl: "@a@b%a002010：我有些时候\n　　也一样会感到心中\n　　惴惴不安呢。\n@c0@"
  tl: "@a@b%a002010：我有些時候\n　　也一樣會感到心中\n　　惴惴不安呢。\n@c0@"
313:
  en: "@a%0%a002020@bShe makes a good point. It doesn't really seem over yet, somehow.\n@c0@"
  ja: "@a@b%a002020「くよくよ　しすぎるのは\n\tよくないけれど　スッキリしないのも\n\tたしかよね。\n@c0@"
