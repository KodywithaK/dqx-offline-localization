  tl: "@a@b%a002050：我真想為修女\n　　撫平她心中的不安啊！\n@c0@"
317:
  en: "@a%0%a002000@bBlimey, this armour's really something! I bet it's blessed by spirits 'n' everything like that!\n@c0@"
