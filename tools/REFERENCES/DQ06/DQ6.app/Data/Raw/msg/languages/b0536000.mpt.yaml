168:
  en: "@a%0%a002020@bThat guy needs to buy a nicer personality!\n@c0@"
  ja: "@a@b%a002020「この人　こわいよー！\n@c0@"
  ko: "@a@b%a002020: 이 사람 무서워~!\n@c0@"
  sl: "@a@b%a002020：这人好可怕！\n@c0@"
  tl: "@a@b%a002020：這人好可怕！\n@c0@"
169:
  en: "@a%0%a002030@bIn the real world, Chancellor Keating had the run of the kingdom while King Somnus slept...\n@c0@"
