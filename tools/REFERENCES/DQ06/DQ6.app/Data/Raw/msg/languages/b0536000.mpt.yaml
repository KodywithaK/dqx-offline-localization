  sl: "@a@b%a002030：现实世界的盖班\n　　趁着国王陛下沉睡期间，\n　　在雷多克为所欲为……\n@c0@"
  tl: "@a@b%a002030：現實世界的蓋班\n　　趁著國王陛下沉睡期間，\n　　在雷多克為所欲為……\n@c0@"
170:
  en: "@a%0%a002030@bHe no doubt spent money like water, which is why his dreams have taken this sorry form..\n@c0@"
  ja: "@a@b%a002030「お金も　自分の\n\t自由にしたのでしょう。\n\tそのすがたが　きっと彼なのです。\n@c0@"
