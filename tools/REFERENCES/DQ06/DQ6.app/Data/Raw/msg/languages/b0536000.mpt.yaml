309:
  en: "@a%0%a002050@bLook at her go! Let's see if old %a002050 is half as healthy when I get to her age!\n@c0@"
  ja: "@a@b%a002050「この　手つき。\n\tそして　足さばき。\n\tいやー　べんきょうに　なりますね！\n@c0@"
  ko: "@a@b%a002050: 이 손놀림.\n그리고 발놀림.\n이야~ 공부가 되네요!\n@c0@"
  sl: "@a@b%a002050：这手法。\n　　还有这脚法。\n　　哎呀，真是受教了呢！\n@c0@"
  tl: "@a@b%a002050：這手法。\n　　還有這腳法。\n　　哎呀，真是受教了呢！\n@c0@"
310:
  en: "@a%0%a002000@bI reckon it'll take a while before folks can really rest easy.\n@c0@"
  ja: "@a@b%a002000「たしかに　まだまだ\n\t心から　安心できない人も\n\tいるんだろうな。\n@c0@"
