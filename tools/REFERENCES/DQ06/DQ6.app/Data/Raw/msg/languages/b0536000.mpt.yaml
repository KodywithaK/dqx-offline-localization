  sl: "@a@b%a002060：得到……宝物……\n　　宝物……愉悦……\n@c0@"
  tl: "@a@b%a002060：得到……寶物……\n　　寶物……愉悅……\n@c0@"
179:
  en: "@a%0%a002070@bB-boing, b-boing, b-boing!\n@c0@"
  ja: "@a@b%a002070「ピキ　ピキピィーッ！！\n@c0@"
  ko: "@a@b%a002070: 피키 피키피이~!!\n@c0@"
  sl: "@a@b%a002070：哔叽哔叽哔！！\n@c0@"
  tl: "@a@b%a002070：嗶嘰嗶嘰嗶！！\n@c0@"
180:
  en: "@a%0%a002000@bAye! Time for a little chest-raidin'!\n@c0@"
