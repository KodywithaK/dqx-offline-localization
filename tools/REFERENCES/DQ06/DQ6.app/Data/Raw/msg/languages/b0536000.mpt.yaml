  sl: "@a@b%a002050：为了塔尼娅小姐，\n　　万死不辞！\n　　就是这个感觉！\n@c0@"
  tl: "@a@b%a002050：為了塔尼婭小姐，\n　　萬死不辭！\n　　就是這個感覺！\n@c0@"
396:
