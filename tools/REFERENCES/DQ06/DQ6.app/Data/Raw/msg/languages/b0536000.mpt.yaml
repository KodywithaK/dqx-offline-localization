  sl: "@a@b%a002030：花钱也是随心所欲。\n　　这绝对是他没错。\n@c0@"
  tl: "@a@b%a002030：花錢也是隨心所欲。\n　　這絕對是他沒錯。\n@c0@"
171:
  en: "@a%0%a002050@bOld %a002050 might not have two gold coins to rub together, but at least I know wrong from right.\n@c0@"
  ja: "@a@b%a002050「お金持ちが　えらいなら\n\t私は　ちっとも　えらくないです！\n\tえっへん！\n@c0@"
  ko: "@a@b%a002050: 부자가 훌륭한 거라면\n저는 전혀 훌륭하지 않습니다!\n엣헴!\n@c0@"
  sl: "@a@b%a002050：要是有钱就算伟大的话，\n　　我还真是卑如草芥啊！\n　　哼！\n@c0@"
  tl: "@a@b%a002050：要是有錢就算偉大的話，\n　　我還真是卑如草芥啊！\n　　哼！\n@c0@"
172:
  en: "@a%0%a002000@bYou heard the man. Let's help ourselves, aye?\n@c0@"
  ja: "@a@b%a002000「せっかくの　おことばだ。\n\tえんりょなく　いただいておくか。\n@c0@"
  ko: "@a@b%a002000: 모처럼 신경 써 주시니\n사양 말고 가져갈까?\n@c0@"
  sl: "@a@b%a002000：都说到这份上了，\n　　咱就不客气收下吧。\n@c0@"
  tl: "@a@b%a002000：都說到這份上了，\n　　咱就不客氣收下吧。\n@c0@"
173:
  en: "@a%0%a002010@bBut can we actually access our reward?\n@c0@"
