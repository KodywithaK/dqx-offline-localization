  tl: "@a@b%a002030：這足以證明\n　　姆多的力量\n　　是多麼讓人感到恐懼。\n@c0@"
316:
  en: "@a%0%a002050@bI'd like to reassure her, but I get tongue-tied at times like these.\n@c0@"
