  ko: "@a@b%a002010: 어머나.\n포상을 받을 수 있는 거야?\n@c0@"
  sl: "@a@b%a002010：哎呀，\n　　是要奖励我们吗？\n@c0@"
  tl: "@a@b%a002010：哎呀，\n　　是要獎勵我們嗎？\n@c0@"
174:
  en: "@a%0%a002020@bOh, wow! Presents from the King himself!\n@c0@"
