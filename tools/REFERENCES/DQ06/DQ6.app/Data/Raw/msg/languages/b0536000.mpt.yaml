  sl: "@a@b%a002020：这铠甲真棒！\n@c0@"
  tl: "@a@b%a002020：這鎧甲真棒！\n@c0@"
320:
  en: "@a%0%a002030@bJust gazing at armour like that makes me feel safer.\n@c0@"
