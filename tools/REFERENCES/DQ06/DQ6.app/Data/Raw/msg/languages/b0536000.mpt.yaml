  ko: "@a@b%a002020: 두근두근!\n왕이 주신 선물이구나!\n@c0@"
  sl: "@a@b%a002020：好期待啊！\n　　国王陛下赏赐的礼物哦！\n@c0@"
  tl: "@a@b%a002020：好期待啊！\n　　國王陛下賞賜的禮物哦！\n@c0@"
