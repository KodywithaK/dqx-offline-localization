  ja: "@a@b%a002010「きっと　%a000090なら\n\tお似合いだわ。\n\tすぐに　装備してみたら？\n@c0@"
  ko: "@a@b%a002010: %a000090에게는 분명\n어울릴 거야.\n어서 장비해 봐.\n@c0@"
