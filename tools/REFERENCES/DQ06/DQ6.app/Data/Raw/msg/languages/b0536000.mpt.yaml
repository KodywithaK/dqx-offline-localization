  tl: "@a@b%a002000：的確還有很多人\n　　仍然放不下心來啊。\n@c0@"
311:
  en: "@a%0%a002010@bI know exactly what that nun means.\n@c0@"
  ja: "@a@b%a002010「シスターの　言うことは\n\tよくわかるわ。\n@c0@"
