  tl: "@a@b%a002010：%a000090穿的話，\n　　一定再合適不過了。\n　　要立刻裝備上嗎？\n@c0@"
319:
  en: "@a%0%a002020@bDon't you just love that new-armour smell?\n@c0@"
  ja: "@a@b%a002020「ホント\n\tりっぱな　ヨロイだねー！\n@c0@"
