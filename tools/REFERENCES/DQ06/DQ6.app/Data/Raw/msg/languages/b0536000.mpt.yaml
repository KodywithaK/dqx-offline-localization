  ko: "@a@b%a002010: 다음에 꼭\n사러 오자!\n@c0@"
  sl: "@a@b%a002010：下次再来买吧！\n@c0@"
  tl: "@a@b%a002010：下次再來買吧！\n@c0@"
325:
  en: "@a%0%a002020@bSeven thousand gold coins, huh? That's not exactly cheap.\n@c0@"
