  ko: "@a@b%a002040: 쓸 만한 물건이면\n좋을 텐데.\n@c0@"
  sl: "@a@b%a002040：要是有用的东西就好了。\n@c0@"
  tl: "@a@b%a002040：要是有用的東西就好了。\n@c0@"
186:
  en: "@a%0%a002060@b(snarl) Treasure! %0%a002060 take treasure! (slobber)\n@c0@"
  ja: "@a@b%a002060「たから…もらう……。\n\tたから…うれしい……。\n@c0@"
  ko: "@a@b%a002060: 보물...받는다......\n보물...기쁘다......\n@c0@"
  sl: "@a@b%a002060：得到……宝物……\n　　宝物……愉悦……\n@c0@"
  tl: "@a@b%a002060：得到……寶物……\n　　寶物……愉悅……\n@c0@"
187:
  en: "@a%0%a002070@bB-boing, b-boing, b-boing!\n@c0@"
  ja: "@a@b%a002070「ピキ　ピキピィーッ！！\n@c0@"
