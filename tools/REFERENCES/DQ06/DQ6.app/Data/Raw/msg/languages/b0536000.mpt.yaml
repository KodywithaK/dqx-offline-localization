  sl: "@a@b%a002050：话说回来……\n　　我梦到过自己不知道在哪\n　　被猎人盯上了呢！\n@c0@"
  tl: "@a@b%a002050：話說回來……\n　　我夢到過自己不知道在哪\n　　被獵人盯上了呢！\n@c0@"
299:
  en: "@a%0%a002000@bNo one here but the cow, aye?\n@c0@"
  ja: "@a@b%a002000「牛　いがいは\n\tだれも　いないみたいだな。\n@c0@"
  ko: "@a@b%a002000: 소 말고는\n아무도 없나 보군.\n@c0@"
  sl: "@a@b%a002000：这里除了牛，\n　　人影都见不到一个。\n@c0@"
  tl: "@a@b%a002000：這裡除了牛，\n　　人影都見不到一個。\n@c0@"
300:
  en: "@a%0%a002010@bWhat a wonderfully glossy coat. That cow must be well taken care of.\n@c0@"
  ja: "@a@b%a002010「まあ　毛なみの　いい\n\tウシさんだこと。\n\t手入れが　いいのね　きっと。\n@c0@"
  ko: "@a@b%a002010: 어머나, 털에서\n윤기가 흐르는 소네.\n관리를 잘 받고 있나 봐.\n@c0@"
  sl: "@a@b%a002010：这牛的皮毛真美，\n　　一定被精心照顾着呢吧。\n@c0@"
  tl: "@a@b%a002010：這牛的皮毛真美，\n　　一定被精心照顧著呢吧。\n@c0@"
301:
  en: "@a%0%a002020@bYou think that cow's got milk? I'm thirsty.\n@c0@"
  ja: "@a@b%a002020「もう～　鼻いき　あらすぎ～。\n@c0@"
  ko: "@a@b%a002020: 아아~ 콧바람이 너무 세~\n@c0@"
  sl: "@a@b%a002020：哎呀～别舔人家啦～\n@c0@"
  tl: "@a@b%a002020：哎呀～別舔人家啦～\n@c0@"
302:
  en: "@a%0%a002030@bAre cows' faces supposed to be so large?\n@c0@"
  ja: "@a@b%a002030「そばで　見ると\n\tカオが　大きいんですね。\n@c0@"
  ko: "@a@b%a002030: 옆에서 보니\n얼굴이 크군요.\n@c0@"
  sl: "@a@b%a002030：从旁边看的话，\n　　脸显得真大啊。\n@c0@"
  tl: "@a@b%a002030：從旁邊看的話，\n　　臉顯得真大啊。\n@c0@"
303:
  en: "@a%0%a002050@bHmm... That cow looks deliciou—\n@c0@"
  ja: "@a@b%a002050「おいし……\n@c0@"
  ko: "@a@b%a002050: 맛있겠......\n@c0@"
  sl: "@a@b%a002050：看起来很好吃……\n@c0@"
  tl: "@a@b%a002050：看起來很好吃……\n@c0@"
304:
  en: "@a%0%a002050@bI mean, it looks like a healthy, strappin' beast!\n@c0@"
  ja: "@a@b%a002050「いやー　元気そうな\n\tウシさんですねー！\n@c0@"
  ko: "@a@b%a002050: 아, 아니! 건강해 보이는\n소네요!\n@c0@"
  sl: "@a@b%a002050：啊不对……\n　　真是头健壮的小牛啊！\n@c0@"
  tl: "@a@b%a002050：啊不對……\n　　真是頭健壯的小牛啊！\n@c0@"
305:
  en: "@a%0%a002000@bShe looks as good at weavin' as I am at fightin'!\n@c0@"
  ja: "@a@b%a002000「たった　ひとりで\n\tせっせと　はたおり　か……\n\tずいぶん　せいが　でるなあ。\n@c0@"
  ko: "@a@b%a002000: 혼자서\n부지런히 베를 짜고 계시는군......\n정말 열심인걸.\n@c0@"
  sl: "@a@b%a002000：独自一人在织布啊……\n　　真是敬业啊。\n@c0@"
  tl: "@a@b%a002000：獨自一人在織布啊……\n　　真是敬業啊。\n@c0@"
306:
  en: "@a%0%a002010@bBeing able to do what you love will bring happiness at any age.\n@c0@"
  ja: "@a@b%a002010「いくつに　なっても\n\t好きなことが　できるのは\n\tしあわせな　ことだわね。\n@c0@"
  ko: "@a@b%a002010: 몇 살이 되어도\n좋아하는 일을 할 수 있다는 건\n행복한 일이야.\n@c0@"
  sl: "@a@b%a002010：不管到多少岁，\n　　能做自己喜欢的事情，\n　　就是一种幸福啊。\n@c0@"
  tl: "@a@b%a002010：不管到多少歲，\n　　能做自己喜歡的事情，\n　　就是一種幸福啊。\n@c0@"
307:
  en: "@a%0%a002020@bWow, she's weaving up a storm!\n@c0@"
  ja: "@a@b%a002020「わあ。\n\tおばあさん　じょうずだねー。\n@c0@"
  ko: "@a@b%a002020: 와아.\n할머니 잘한다~\n@c0@"
  sl: "@a@b%a002020：哇！\n　　婆婆的手艺真棒啊。\n@c0@"
  tl: "@a@b%a002020：哇！\n　　婆婆的手藝真棒啊。\n@c0@"
308:
  en: "@a%0%a002030@bIt just goes to show that nothing is more important than good health.\n@c0@"
  ja: "@a@b%a002030「おばあさんを　見ていると\n\tあらためて　けんこうが\n\tいちばんだと　感じますね。\n@c0@"
  ko: "@a@b%a002030: 할머님을 보고 있으니\n새삼 건강이 최고라는 걸\n느끼게 됩니다.\n@c0@"
  sl: "@a@b%a002030：看到婆婆的样子，\n　　我再次体会到\n　　健康才是万福之福啊。\n@c0@"
