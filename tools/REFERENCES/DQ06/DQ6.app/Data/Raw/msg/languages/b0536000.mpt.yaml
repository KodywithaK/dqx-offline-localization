  tl: "@a@b%a002050：我……這是第一次\n　　覲見這邊的國王陛下呢。\n　　好緊張！\n@c0@"
193:
  en: "@a%0%a002000@bNow we know why the King was so excited! Losin' a few decades will do that to ya!\n@c0@"
  ja: "@a@b%a002000「若がえったから\n\t大よろこび　だったよな。\n@c0@"
  ko: "@a@b%a002000: 젊어져서\n엄청 기뻐하더군.\n@c0@"
  sl: "@a@b%a002000：变这么年轻，\n　　他特高兴吧。\n@c0@"
  tl: "@a@b%a002000：變這麼年輕，\n　　他特高興吧。\n@c0@"
194:
  en: "@a%0%a002010@bHee hee. He was right about the gushing!\n@c0@"
  ja: "@a@b%a002010「うふふ。\n\tそれは　楽しい\n\t王さまだったわよね。\n@c0@"
  ko: "@a@b%a002010: 우후훗.\n정말 쾌활한\n왕이셨지.\n@c0@"
  sl: "@a@b%a002010：呵呵。\n　　国王陛下是一个\n　　开朗乐观的人呢。\n@c0@"
  tl: "@a@b%a002010：呵呵。\n　　國王陛下是一個\n　　開朗樂觀的人呢。\n@c0@"
195:
  en: "@a%0%a002020@bWe already got ourselves to him! Tee hee!\n@c0@"
