  tl: "@a@b%a002030：知道國王陛下的房間在哪吧。\n　　趕緊走吧。\n@c0@"
192:
  en: "@a%0%a002050@bI'm in a bit of a flap here, to be honest. I always get nervous round these royal types!\n@c0@"
