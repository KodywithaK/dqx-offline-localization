  sl: "@a@b%a002070：哔叽哔叽哔！！\n@c0@"
  tl: "@a@b%a002070：嗶嘰嗶嘰嗶！！\n@c0@"
188:
  en: "@a%0%a002000@bSounds good to me. Let's shove off.\n@c0@"
  ja: "@a@b%a002000「よし。\n\tいわれたとおりに\n\t王さまのところに　行こうぜ。\n@c0@"
  ko: "@a@b%a002000: 좋아.\n이 병사 말대로\n왕이 있는 곳으로 가자구.\n@c0@"
