  sl: "@a@b%a002030：有这么懂事的妹妹，\n　　%a000090真是幸福啊。\n@c0@"
  tl: "@a@b%a002030：有這麼懂事的妹妹，\n　　%a000090真是幸福啊。\n@c0@"
395:
