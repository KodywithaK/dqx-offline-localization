  sl: "@a@b%a002030：兰德的父亲\n　　是个猎人呢。\n@c0@"
  tl: "@a@b%a002030：蘭德的父親\n　　是個獵人呢。\n@c0@"
298:
  en: "@a%0%a002050@bI once had a dream where some hunters were tryin' to bag old %a002050. Terrifyin', it was.\n@c0@"
  ja: "@a@b%a002050「そういえば　私……。\n\tどこかで　狩人に　ねらわれた\n\t夢を　見たことがありますね！\n@c0@"
