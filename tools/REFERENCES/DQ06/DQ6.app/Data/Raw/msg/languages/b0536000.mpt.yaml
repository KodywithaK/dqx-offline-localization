  tl: "@a@b%a002010：為了得到獎勵，\n　　這條路真是充滿艱辛呢。\n@c0@"
182:
  en: "@a%0%a002020@bAnd we have the key we need!\n@c0@"
  ja: "@a@b%a002020「カギ　持って\n\t来たもんねー！\n@c0@"
  ko: "@a@b%a002020: 열쇠 가지고\n왔지롱~!\n@c0@"
  sl: "@a@b%a002020：钥匙拿来了呢！\n@c0@"
  tl: "@a@b%a002020：鑰匙拿來了呢！\n@c0@"
183:
  en: "@a%0%a002030@bRoyal treasure is truly something to be grateful for.\n@c0@"
