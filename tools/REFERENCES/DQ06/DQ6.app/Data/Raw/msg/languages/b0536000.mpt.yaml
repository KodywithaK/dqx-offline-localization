0:
  en: "@a%0%a002000@bYou'd better believe it was outstanding! I ain't capable of anything less!\n@c0@"
  ja: "@a@b%a002000「いやあ\n\tわれながら　みごとな\n\tはたらきだったと　思うぜ！\n@c0@"
  ko: "@a@b%a002000: 그래,\n내가 생각해도\n훌륭한 활약이었지!\n@c0@"
  sl: "@a@b%a002000：哎呀！\n　　咱们干得还真不错啊！\n@c0@"
  tl: "@a@b%a002000：哎呀！\n　　咱們幹得還真不錯啊！\n@c0@"
1:
  en: "@a%0%a002010@bSpeaking of which, what happened to the King Somnus in this world?\n@c0@"
  ja: "@a@b%a002010「そういえば\n\tこちらの　レイドックの　王さまは\n\tどうなったのかしら？\n@c0@"
  ko: "@a@b%a002010: 그러고 보니\n이쪽 세계의 레이독 왕은\n어떻게 되었을까?\n@c0@"
  sl: "@a@b%a002010：话说回来，\n　　这边的雷多克王\n　　不知道怎么样了。\n@c0@"
  tl: "@a@b%a002010：話說回來，\n　　這邊的雷多克王\n　　不知道怎麼樣了。\n@c0@"
2:
  en: "@a%0%a002010@bThe young king turned into Queen Apnea, so that should leave them without a ruler...\n@c0@"
  ja: "@a@b%a002010「若き王さまは\n\tシェーラ王妃に　なってしまって\n\tそれっきりのはずだし……。\n@c0@"
  ko: "@a@b%a002010: 젊은 왕은\n시엘라 왕비로 돌아갔고\n그걸로 끝일 텐데......\n@c0@"
  sl: "@a@b%a002010：年轻的国王陛下\n　　变成了谢菈王妃，\n　　后来的事情我们就不知道了……\n@c0@"
  tl: "@a@b%a002010：年輕的國王陛下\n　　變成了謝菈王妃，\n　　後來的事情我們就不知道了……\n@c0@"
3:
  en: "@a%0%a002020@bI wonder if Apnea and Captain Blade are back yet...\n@c0@"
  ja: "@a@b%a002020「シェーラさんと\n\tソルディ兵士長は　もう\n\tもどってきてるかな？\n@c0@"
  ko: "@a@b%a002020: 시엘라 씨랑\n솔디 병사단장은 이제\n돌아왔으려나?\n@c0@"
  sl: "@a@b%a002020：谢菈王妃\n　　和索迪士兵长\n　　已经回来了吧？\n@c0@"
  tl: "@a@b%a002020：謝菈王妃\n　　和索迪士兵長\n　　已經回來了吧？\n@c0@"
4:
  en: "@a%0%a002030@bHmm... This would appear to be the dream world version of Somnia Castle.\n@c0@"
  ja: "@a@b%a002030「ええっと……\n\tこちらは　夢の世界のほうの\n\tレイドック城ですね。\n@c0@"
  ko: "@a@b%a002030: 으음......\n이쪽은 꿈의 세계에 있는\n레이독 성이로군요.\n@c0@"
  sl: "@a@b%a002030：那个……\n　　这里是梦世界的\n　　雷多克城吧。\n@c0@"
  tl: "@a@b%a002030：那個……\n　　這裡是夢世界的\n　　雷多克城吧。\n@c0@"
5:
  en: "@a%0%a002050@bIt looks like there's a bit of life in this town! That's always good to see!\n@c0@"
  ja: "@a@b%a002050「にぎやかそうな\n\t城下町　ですねえ！\n@c0@"
  ko: "@a@b%a002050: 활기차 보이는\n시가지로군요!\n@c0@"
  sl: "@a@b%a002050：真是一个\n　　热闹的城区呢！\n@c0@"
  tl: "@a@b%a002050：真是一個\n　　熱鬧的城區呢！\n@c0@"
6:
  en: "@a%0%a002000@bAye, life sure is good with Murdaw gone.\n@c0@"
  ja: "@a@b%a002000「いきなり\n\tああ幸せ！　……だなんて\n\tいったい　何のことかと　思ったぜ。\n@c0@"
  ko: "@a@b%a002000: 느닷없이\n아, 행복해! ......라길래\n대체 무슨 일인가 싶었네.\n@c0@"
  sl: "@a@b%a002000：突然就蹦出\n　　“啊真幸福”这种话，\n　　还以为出什么事了呢。\n@c0@"
  tl: "@a@b%a002000：突然就蹦出\n　　“啊真幸福”這種話，\n　　還以為出什麼事了呢。\n@c0@"
7:
  en: "@a%0%a002010@bA world without Murdaw seems almost like a dream...\n@c0@"
  ja: "@a@b%a002010「魔王ムドーが　いない世界。\n\tいまさらながら\n\t本当に　夢みたいね……。\n@c0@"
  ko: "@a@b%a002010: 마왕 무도가 없는 세계.\n이제 와서 말하기 새삼스럽지만\n정말 꿈만 같구나......\n@c0@"
  sl: "@a@b%a002010：没有魔王姆多的世界，\n　　现在想想看，\n　　还觉得像是在做梦呢……\n@c0@"
  tl: "@a@b%a002010：沒有魔王姆多的世界，\n　　現在想想看，\n　　還覺得像是在做夢呢……\n@c0@"
8:
  en: "@a%0%a002010@bBut then again, we are in the dream world...\n@c0@"
  ja: "@a@b%a002010「……って\n\tここは本当に　夢の世界だけど。\n@c0@"
  ko: "@a@b%a002010: ......생각해 보니\n여긴 진짜 꿈의 세계지만.\n@c0@"
  sl: "@a@b%a002010：……不过，\n　　这里确实就是梦世界啊。\n@c0@"
  tl: "@a@b%a002010：……不過，\n　　這裡確實就是夢世界啊。\n@c0@"
9:
  en: "@a%0%a002020@bC'mon, let's go see what's going on in the castle!\n@c0@"
  ja: "@a@b%a002020「ねえねえ。\n\t早く　お城に　行ってみようよ！\n@c0@"
  ko: "@a@b%a002020: 저기, 있잖아.\n어서 성으로 가 보자!\n@c0@"
  sl: "@a@b%a002020：喂喂，\n　　快点回城里去吧！\n@c0@"
  tl: "@a@b%a002020：喂喂，\n　　快點回城裡去吧！\n@c0@"
10:
  en: "@a%0%a002030@bLife is indeed a wonderful thing. Long may this peace last!\n@c0@"
  ja: "@a@b%a002030「本当の　平和を\n\tいつまでも　かみしめて\n\tもらいたいですね。\n@c0@"
  ko: "@a@b%a002030: 진짜 평화를\n영원히 누려 주었으면\n좋겠군요.\n@c0@"
  sl: "@a@b%a002030：真正的和平\n　　要是能持续下去就好了。\n@c0@"
  tl: "@a@b%a002030：真正的和平\n　　要是能持續下去就好了。\n@c0@"
11:
  en: "@a%0%a002050@bRight enough, life's been wonderful ever since I fell in with this bunch of brave adventurers!\n@c0@"
  ja: "@a@b%a002050「私も　みなさんと\n\tいっしょに　旅ができて\n\tああ　幸せ……　ですよ！\n@c0@"
  ko: "@a@b%a002050: 저 역시 여러분과\n함께 여행할 수 있어서\n아, 행복해......요!\n@c0@"
  sl: "@a@b%a002050：我能够跟各位同行，\n　　啊，真的很幸福啊！\n@c0@"
  tl: "@a@b%a002050：我能夠跟各位同行，\n　　啊，真的很幸福啊！\n@c0@"
12:
  en: "@a%0%a002000@bHardy har! I never thought we'd get in trouble for takin' Murdaw down!\n@c0@"
  ja: "@a@b%a002000「いやあ　オレたちが\n\t先を　こしちまって\n\tすまなかったな　ぼうず！\n@c0@"
  ko: "@a@b%a002000: 헤헷, 우리가\n먼저 처리해 버려서\n미안하게 됐구나, 꼬마야!\n@c0@"
  sl: "@a@b%a002000：哎呀，被咱抢了先，\n　　对不住了啊，小子！\n@c0@"
  tl: "@a@b%a002000：哎呀，被咱搶了先，\n　　對不住了啊，小子！\n@c0@"
13:
  en: "@a%0%a002010@bHe would do better to set his sights on a world where soldiers are not needed...\n@c0@"
  ja: "@a@b%a002010「そんなこと　いわずに\n\t兵隊さんが　いらなくなる世界を\n\tめざしてほしいわ……。\n@c0@"
  ko: "@a@b%a002010: 그러지 말고\n병사가 더 이상 필요 없는 세계를\n만들어 줬으면 좋겠어......\n@c0@"
  sl: "@a@b%a002010：他的理想如果是\n　　实现一个不需要军队的\n　　世界该多好……\n@c0@"
  tl: "@a@b%a002010：他的理想如果是\n　　實現一個不需要軍隊的\n　　世界該多好……\n@c0@"
14:
  en: "@a%0%a002020@bI can sympathise with the little rascal — but it's not like Murdaw was just gonna read a book until the kid grew up.\n@c0@"
  ja: "@a@b%a002020「気持ちは　わかるけど\n\t大きくなるまで　ムドーがいたら\n\tたいへんなのにね。\n@c0@"
  ko: "@a@b%a002020: 마음은 알겠지만\n저 아이가 커서도 무도가 있다면\n큰일인데 말이야.\n@c0@"
  sl: "@a@b%a002020：虽然能理解你的心情，\n　　但是如果等你长大了姆多还在的话，\n　　那就麻烦了啊。\n@c0@"
  tl: "@a@b%a002020：雖然能理解你的心情，\n　　但是如果等你長大了姆多還在的話，\n　　那就麻煩了啊。\n@c0@"
15:
  en: "@a%0%a002030@bI pray that this child can find a new goal for himself before he gets into any mischief.\n@c0@"
  ja: "@a@b%a002030「この子なりの\n\t新しい人生の目標が\n\tはやく　見つかると　いいですね。\n@c0@"
  ko: "@a@b%a002030: 이 아이 나름의\n새로운 인생 목표를\n빨리 발견했으면 좋겠군요.\n@c0@"
  sl: "@a@b%a002030：要是这孩子\n　　能找到新的人生目标\n　　就好了呢。\n@c0@"
  tl: "@a@b%a002030：要是這孩子\n　　能找到新的人生目標\n　　就好了呢。\n@c0@"
16:
  en: "@a%0%a002050@bI had nowt to do with Murdaw gettin' clobbered, so I feel a bit left out.\n@c0@"
  ja: "@a@b%a002050「みなさんと　いっしょに\n\tムドーを　たおせなかった　私も\n\tちょっぴり　さびしい思いですが……\n@c0@"
  ko: "@a@b%a002050: 여러분과 함께\n무도를 쓰러뜨릴 수 없었던 저도\n조금 섭섭하긴 한데......\n@c0@"
  sl: "@a@b%a002050：没能跟大家一起\n　　去讨伐姆多，\n　　感觉有些寂寞呢……\n@c0@"
  tl: "@a@b%a002050：沒能跟大家一起\n　　去討伐姆多，\n　　感覺有些寂寞呢……\n@c0@"
17:
  en: "@a%0%a002050@bStill, I'm sure there's no shortage of adventure waitin' out there for old %a002050!\n@c0@"
  ja: "@a@b%a002050「でも　まだまだ　これからも\n\tやるべきことは　たくさん\n\tありそうですよね！\n@c0@"
  ko: "@a@b%a002050: 하지만 앞으로도 아직\n할 일이 많이\n있겠죠!\n@c0@"
  sl: "@a@b%a002050：不过，\n　　今后还有好多事情\n　　等待着我们去做呢！\n@c0@"
  tl: "@a@b%a002050：不過，\n　　今後還有好多事情\n　　等待著我們去做呢！\n@c0@"
18:
  en: "@a%0%a002000@bAye? Is this dog hungry or something?\n@c0@"
  ja: "@a@b%a002000「ん？　この　いぬ\n\tはらでも　へってるのかな。\n@c0@"
  ko: "@a@b%a002000: 응? 이 개,\n배가 고픈 건가?\n@c0@"
  sl: "@a@b%a002000：嗯？这狗是不是饿了？\n@c0@"
  tl: "@a@b%a002000：嗯？這狗是不是餓了？\n@c0@"
19:
  en: "@a%0%a002010@bIt must be the armour merchant's dog. Such a cute puppy!\n@c0@"
  ja: "@a@b%a002010「防具屋さんの\n\tワンちゃん　かしらね。\n\tこんにちは！\n@c0@"
  ko: "@a@b%a002010: 방어구점에서\n기르는 강아지일까?\n안녕!\n@c0@"
  sl: "@a@b%a002010：是防具店的小狗吧。\n　　你好啊！\n@c0@"
  tl: "@a@b%a002010：是防具店的小狗吧。\n　　你好啊！\n@c0@"
20:
  en: "@a%0%a002020@bAw, poor pooch. We're too busy to play with him right now.\n@c0@"
  ja: "@a@b%a002020「ごめんね　ワンちゃん。\n\tあそんで　あげたいけど\n\tあたしたちも　いそがしいの。\n@c0@"
  ko: "@a@b%a002020: 멍멍아, 미안해.\n놀아 주고 싶지만\n우리도 바쁘거든.\n@c0@"
  sl: "@a@b%a002020：对不起啊小狗狗。\n　　虽然很想跟你一起玩，\n　　但是我们好忙的。\n@c0@"
  tl: "@a@b%a002020：對不起啊小狗狗。\n　　雖然很想跟你一起玩，\n　　但是我們好忙的。\n@c0@"
21:
  en: "@a%0%a002030@bThis is a most amiable-looking dog.\n@c0@"
  ja: "@a@b%a002030「人なつこそうな\n\tいぬ　ですね。\n@c0@"
  ko: "@a@b%a002030: 사람을 잘 따를 것 같은\n개네요.\n@c0@"
  sl: "@a@b%a002030：真是只亲近人的狗呢。\n@c0@"
  tl: "@a@b%a002030：真是隻親近人的狗呢。\n@c0@"
22:
  en: "@a%0%a002050@bNow, maybe it's just me, but this dog looks like it's a lot sharper than old %a002050.\n@c0@"
  ja: "@a@b%a002050「この　ワンちゃんは\n\t私より　かしこそうな\n\t顔を　してますね～。\n@c0@"
  ko: "@a@b%a002050: 이 개는\n얼굴을 보니 저보다 더\n똑똑해 보이는군요~\n@c0@"
  sl: "@a@b%a002050：这小狗长得\n　　看起来比我\n　　聪明多了呢～\n@c0@"
  tl: "@a@b%a002050：這小狗長得\n　　看起來比我\n　　聰明多了呢～\n@c0@"
23:
  en: "@a%0%a002000@bAye, only a real stick-in-the-mud would be in a lousy mood these days!\n@c0@"
  ja: "@a@b%a002000「魔王は　もう　いないから\n\t大丈夫だぜ！\n@c0@"
  ko: "@a@b%a002000: 마왕은 이제 없으니까\n마음 놓으라구!\n@c0@"
  sl: "@a@b%a002000：魔王已经不在了，\n　　没事啦！\n@c0@"
  tl: "@a@b%a002000：魔王已經不在了，\n　　沒事啦！\n@c0@"
24:
  en: "@a%0%a002010@bI sense that she's still harbouring some anxiety...\n@c0@"
  ja: "@a@b%a002010「彼女は　まだ\n\tどことなく　心のどこかに\n\t不安が　残っているようね。\n@c0@"
  ko: "@a@b%a002010: 이분은 아직\n마음 한구석에\n불안감이 남아 있는 모양이야.\n@c0@"
  sl: "@a@b%a002010：她好像\n　　心里还有些担心呢。\n@c0@"
  tl: "@a@b%a002010：她好像\n　　心裡還有些擔心呢。\n@c0@"
25:
  en: "@a%0%a002020@bYep! Everything's a-okay now that we took care of the big bad guy!\n@c0@"
  ja: "@a@b%a002020「魔王は　もう\n\tあたしたちが　たおしたから\n\t大丈夫よ！\n@c0@"
  ko: "@a@b%a002020: 마왕은 벌써\n우리가 쓰러뜨렸으니까\n괜찮아!\n@c0@"
  sl: "@a@b%a002020：魔王我们已经干掉啦。\n　　没事了呢！\n@c0@"
  tl: "@a@b%a002020：魔王我們已經幹掉啦。\n　　沒事了呢！\n@c0@"
26:
  en: "@a%0%a002030@bThe reality of Murdaw's absence will take some time to fully sink in.\n@c0@"
  ja: "@a@b%a002030「ムドーが　いないのが\n\tまだ　実感として\n\tわかないのでしょうね。\n@c0@"
  ko: "@a@b%a002030: 무도가 없다는 사실이\n아직 실감 나지\n않는 모양이군요.\n@c0@"
  sl: "@a@b%a002030：姆多被打倒这件事情，\n　　对她来说\n　　还无法切身体会到吧。\n@c0@"
  tl: "@a@b%a002030：姆多被打倒這件事情，\n　　對她來說\n　　還無法切身體會到吧。\n@c0@"
27:
  en: "@a%0%a002050@bI wouldn't fancy bein' done in by Murdaw either! Still, there's nowt to worry about now!\n@c0@"
  ja: "@a@b%a002050「私だって\n\t魔王に　殺されるのは\n\tイヤですから！\n@c0@"
  ko: "@a@b%a002050: 저 역시\n마왕한테 죽는 건\n싫다구요!\n@c0@"
  sl: "@a@b%a002050：我也不想\n　　被魔王杀掉啊！\n@c0@"
  tl: "@a@b%a002050：我也不想\n　　被魔王殺掉啊！\n@c0@"
28:
  en: "@a%0%a002000@bI don't care how many chasms Murdaw dug — we'll fill 'em back up any time, any place!\n@c0@"
  ja: "@a@b%a002000「ムドーが　いくら\n\tあちこちに　穴を　あけようが\n\tオレたちが　全部ふさいでやるぜ！\n@c0@"
  ko: "@a@b%a002000: 무도가 아무리\n여기저기 구멍을 내 놓아도\n우리가 모두 막으면 된다고!\n@c0@"
  sl: "@a@b%a002000：不管姆多在哪凿了洞，\n　　俺们都会把它填平的！\n@c0@"
  tl: "@a@b%a002000：不管姆多在哪鑿了洞，\n　　俺們都會把它填平的！\n@c0@"
29:
  en: "@a%0%a002010@bI wonder if he's talking about the chasm above the ruins of Alltrades Abbey...\n@c0@"
  ja: "@a@b%a002010「これって\n\tほろぼされた　ダーマ神殿の\n\t上の穴の　ことかしら……。\n@c0@"
  ko: "@a@b%a002010: 이거 혹시\n폐허가 된 다마 신전\n위에 난 구멍 얘길까......\n@c0@"
  sl: "@a@b%a002010：这是在说\n　　被摧毁的达玛神殿\n　　上方的洞穴吧……\n@c0@"
  tl: "@a@b%a002010：這是在說\n　　被摧毀的達瑪神殿\n　　上方的洞穴吧……\n@c0@"
30:
  en: "@a%0%a002020@bSo many rumours floating around these days!\n@c0@"
  ja: "@a@b%a002020「いろんな　ウワサが\n\tとびかってる　みたいね。\n@c0@"
  ko: "@a@b%a002020: 다양한 소문이\n여기저기 퍼지고 있나 보네.\n@c0@"
  sl: "@a@b%a002020：好像有不少流言出现了呢。\n@c0@"
  tl: "@a@b%a002020：好像有不少流言出現了呢。\n@c0@"
31:
  en: "@a%0%a002030@bHmm... Giant chasms in the ground... So this occurred in the dream world...\n@c0@"
