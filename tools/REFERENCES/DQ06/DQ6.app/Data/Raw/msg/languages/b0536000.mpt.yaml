  tl: "@a@b%a002030：還有很多人\n　　也是一樣\n　　心中不安呢吧。\n@c0@"
315:
  en: "@a%0%a002030@bMurdaw's baneful shadow lay over all of our hearts for far too long...\n@c0@"
  ja: "@a@b%a002030「それほど\n\tムドーの　悪しき　チカラが\n\t大きかったのでしょう。\n@c0@"
