  ko: "@a@b%a002030: 그것참\n고마운 일이로군요!\n@c0@"
  sl: "@a@b%a002030：真是值得庆贺的事呢！\n@c0@"
  tl: "@a@b%a002030：真是值得慶賀的事呢！\n@c0@"
