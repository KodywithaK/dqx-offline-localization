  tl: "@a@b%a002020：感覺真好呢……\n@c0@"
292:
  en: "@a%0%a002030@bFrom young to old, it would seem all are celebrating.\n@c0@"
  ja: "@a@b%a002030「子供から\n\tお年寄りまで　みなさん\n\t楽しんでいますね。\n@c0@"
  ko: "@a@b%a002030: 아이부터\n노인까지 모두들\n즐기고 있군요.\n@c0@"
  sl: "@a@b%a002030：下至幼童，\n　　上至老翁，大家\n　　都很高兴啊。\n@c0@"
  tl: "@a@b%a002030：下至幼童，\n　　上至老翁，大家\n　　都很高興啊。\n@c0@"
293:
  en: "@a%0%a002050@bThat old boy's spillin' more than he's gettin' down his throat! Oh well, as long as he's happy!\n@c0@"
  ja: "@a@b%a002050「あっ　おじいさん！\n\tいま　お酒が　こぼれましたよ！\n\tもったいないです！\n@c0@"
  ko: "@a@b%a002050: 앗, 할아버지!\n방금 술이 흘렀습니다!\n아깝잖아요!\n@c0@"
  sl: "@a@b%a002050：啊，老人家！\n　　酒洒出来了啊！\n　　真浪费！\n@c0@"
  tl: "@a@b%a002050：啊，老人家！\n　　酒灑出來了啊！\n　　真浪費！\n@c0@"
294:
  en: "@a%0%a002000@bI could see myself bein' a hunter. It's a job for manly men, aye?\n@c0@"
  ja: "@a@b%a002000「オレは　狩人のほうが\n\t男らしくて　いいと思うけどな。\n@c0@"
  ko: "@a@b%a002000: 나는 사냥꾼이 훨씬\n남자답고 좋은 것 같은걸.\n@c0@"
  sl: "@a@b%a002000：俺觉得猎人\n　　更是个纯爷们的活啊。\n@c0@"
  tl: "@a@b%a002000：俺覺得獵人\n　　更是個純爺們的活啊。\n@c0@"
295:
  en: "@a%0%a002010@bMaybe he could be a guide for the local hunters... Hee hee.\n@c0@"
  ja: "@a@b%a002010「野山を　めぐる仕事\n\tという意味では　狩人とガイドは\n\t似ている気もするわね。\n@c0@"
  ko: "@a@b%a002010: 산과 들을 돌아다니는\n직업이니까, 사냥꾼과 가이드는\n비슷하다고 생각할 수도 있겠네.\n@c0@"
  sl: "@a@b%a002010：猎人和导游\n　　都需要翻山越岭，\n　　还是有相似点的呢。\n@c0@"
  tl: "@a@b%a002010：獵人和導遊\n　　都需要翻山越嶺，\n　　還是有相似點的呢。\n@c0@"
296:
  en: "@a%0%a002020@bHunting sounds fun, but I'm pretty happy with my adventuring career right now.\n@c0@"
  ja: "@a@b%a002020「へえ　この人\n\t狩人なんだ。\n\tなんだか　カッコいいね！\n@c0@"
  ko: "@a@b%a002020: 호오, 이 사람\n사냥꾼이구나.\n왠지 멋진걸!\n@c0@"
  sl: "@a@b%a002020：哎，\n　　那个人是个猎人啊。\n　　真帅气！\n@c0@"
  tl: "@a@b%a002020：哎，\n　　那個人是個獵人啊。\n　　真帥氣！\n@c0@"
297:
  en: "@a%0%a002030@bSo Buddy's father is a hunter...\n@c0@"
  ja: "@a@b%a002030「ランドさんの\n\tおとうさまは\n\t狩人なのですね。\n@c0@"
