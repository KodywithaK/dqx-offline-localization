  tl: "@a@b%a002000：唉，在這邊這個世界，\n　　即使解釋也沒用啊。\n@c0@"
162:
  en: "@a%0%a002010@bI only wish we could lock up the other Keating as well...\n@c0@"
  ja: "@a@b%a002010「あっちの　ゲバンも\n\tなんとか　したいものよね。\n@c0@"
  ko: "@a@b%a002010: 저쪽 게반도\n어떻게 좀 해 줬으면 좋겠는걸.\n@c0@"
  sl: "@a@b%a002010：那边世界的盖班，\n　　我也想教训一下呢。\n@c0@"
  tl: "@a@b%a002010：那邊世界的蓋班，\n　　我也想教訓一下呢。\n@c0@"
163:
  en: "@a%0%a002020@bWonder what the Keating down in the real world is up to...\n@c0@"
  ja: "@a@b%a002020「下の世界の　ゲバンって\n\tいまごろ　どうしてるのかなあ。\n@c0@"
  ko: "@a@b%a002020: 아래쪽 세계의 게반은\n지금쯤 어떻게 지내고 있을까?\n@c0@"
  sl: "@a@b%a002020：下面那个世界的盖班，\n　　不知道怎么样了。\n@c0@"
  tl: "@a@b%a002020：下面那個世界的蓋班，\n　　不知道怎麼樣了。\n@c0@"
164:
  en: "@a%0%a002030@bI wonder if the Keating here in the dream world has the faintest idea why he is imprisoned...\n@c0@"
  ja: "@a@b%a002030「こちらの　ゲバンは\n\t自分が　なぜ　つかまったのか\n\tわからないでしょうね。\n@c0@"
