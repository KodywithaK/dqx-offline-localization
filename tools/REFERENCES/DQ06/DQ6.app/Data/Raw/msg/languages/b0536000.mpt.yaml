  sl: "@a@b%a002010：修女说的话，\n　　我能够理解。\n@c0@"
  tl: "@a@b%a002010：修女說的話，\n　　我能夠理解。\n@c0@"
312:
  en: "@a%0%a002010@bI must admit that I share her unease.\n@c0@"
  ja: "@a@b%a002010「この私も\n\t同じような　胸さわぎを\n\t感じるときが　あるもの。\n@c0@"
