  tl: "@a@b%a002030：這邊這個蓋班，\n　　還不知道自己為什麼\n　　會被抓起來吧。\n@c0@"
165:
  en: "@a%0%a002050@bIf the King wants him locked up, this Keating fellow must be a real bad egg!\n@c0@"
  ja: "@a@b%a002050「王さまが　いうんだから\n\tそうとうの　悪人なんでしょうね。\n\t気をつけなくては！\n@c0@"
  ko: "@a@b%a002050: 국왕 폐하의 말씀이니\n정말 나쁜 사람이겠군요.\n조심해야겠어요!\n@c0@"
  sl: "@a@b%a002050：既然国王陛下都这么说了，\n　　那一定是一个大坏蛋吧。\n　　一定要小心才行！\n@c0@"
  tl: "@a@b%a002050：既然國王陛下都這麼說了，\n　　那一定是一個大壞蛋吧。\n　　一定要小心才行！\n@c0@"
166:
  en: "@a%0%a002000@bKeating, aye...? I can see why he got this royal treatment from the King.\n@c0@"
  ja: "@a@b%a002000「ゲバンか……。\n\t王さまの　気持ちは\n\tオレにも　わかるぜ。\n@c0@"
  ko: "@a@b%a002000: 게반이군......\n왕의 심정은\n나도 알겠어.\n@c0@"
  sl: "@a@b%a002000：盖班啊……\n　　俺其实能够\n　　理解国王陛下的感受。\n@c0@"
  tl: "@a@b%a002000：蓋班啊……\n　　俺其實能夠\n　　理解國王陛下的感受。\n@c0@"
167:
  en: "@a%0%a002010@bThis Keating has no idea what's been going on in the real world... No wonder he's angry!\n@c0@"
  ja: "@a@b%a002010「夢の世界のゲバンは\n\t何にも　知らないわけだから\n\tおこるのも　むりはないわね。\n@c0@"
  ko: "@a@b%a002010: 꿈의 세계에서 게반은\n아무것도 모를 테니까\n화내는 것도 어찌 보면 당연한 거야.\n@c0@"
  sl: "@a@b%a002010：梦世界的盖班\n　　完全不知道发生了什么事，\n　　会生气也是理所当然的啊。\n@c0@"
