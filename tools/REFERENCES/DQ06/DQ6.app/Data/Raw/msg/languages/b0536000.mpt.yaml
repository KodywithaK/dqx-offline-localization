  sl: "@a@b%a002020：一直心烦意乱的话不好，\n　　不过的确是还有\n　　不尽如人意的地方呢。\n@c0@"
  tl: "@a@b%a002020：一直心煩意亂的話不好，\n　　不過的確是還有\n　　不盡如人意的地方呢。\n@c0@"
314:
  en: "@a%0%a002030@bI think that many people throughout the world share this fear.\n@c0@"
