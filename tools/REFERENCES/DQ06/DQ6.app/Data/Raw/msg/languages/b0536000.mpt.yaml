  tl: "@a@b%a002000：好。\n　　就按他說的做好了。\n　　去國王陛下那裡吧。\n@c0@"
189:
  en: "@a%0%a002010@bIt seems that the King has been waiting for us.\n@c0@"
  ja: "@a@b%a002010「王さまは\n\tお待ちかね　みたいね。\n@c0@"
  ko: "@a@b%a002010: 폐하가\n기다리고 계신가 봐.\n@c0@"
  sl: "@a@b%a002010：国王陛下好像\n　　等不及了呢。\n@c0@"
  tl: "@a@b%a002010：國王陛下好像\n　　等不及了呢。\n@c0@"
190:
  en: "@a%0%a002020@bWhat got into that guy? Hope we're not in trouble or anything...\n@c0@"
  ja: "@a@b%a002020「おこられたんだか\n\tほめられたんだか\n\tよく　わからないね。\n@c0@"
  ko: "@a@b%a002020: 혼이 난 건지\n칭찬을 받은 건지\n잘 모르겠네.\n@c0@"
  sl: "@a@b%a002020：都不知道\n　　这是在批评\n　　还是在表扬我们了呢。\n@c0@"
  tl: "@a@b%a002020：都不知道\n　　這是在批評\n　　還是在表揚我們了呢。\n@c0@"
191:
  en: "@a%0%a002030@bWe know where the throne room is, do we not? Let us head there without delay.\n@c0@"
