397:
  en: "@a%0%a002000@bFolks're countin' on us, aye? We really need to settle the score with Blackmar!\n@c0@"
  ja: "@a@b%a002000「期待されたからには\n\tアクバーを　バッチリ\n\t倒さなくっちゃな！\n@c0@"
  ko: "@a@b%a002000: 이렇게까지 기대해 주는데\n아크바 정도는 깔끔하게\n쓰러뜨려 줘야지!\n@c0@"
  sl: "@a@b%a002000：正是因为被别人期待，\n　　就必须更漂亮地打倒阿库巴！\n@c0@"
  tl: "@a@b%a002000：正是因為被別人期待，\n　　就必須更漂亮地打倒阿庫巴！\n@c0@"
398:
  en: "@a%0%a002010@bLet's keep the gatekeepers' words in mind when we do battle with Blackmar.\n@c0@"
  ja: "@a@b%a002010「門番さんたちの\n\t思いも　胸に　アクバーと\n\t戦ってきましょうね。\n@c0@"
  ko: "@a@b%a002010: 문지기들의\n염원까지 가슴에 품고\n아크바와 싸우러 가자고!\n@c0@"
  sl: "@a@b%a002010：我们就带着\n　　守门人兄弟的心愿，\n　　和阿库巴战斗吧。\n@c0@"
  tl: "@a@b%a002010：我們就帶著\n　　守門人兄弟的心願，\n　　和阿庫巴戰鬥吧。\n@c0@"
399:
  en: "@a%0%a002020@bThese gatekeepers have been praying for the day when the Archfiend is finally overthrown.\n@c0@"
  ja: "@a@b%a002020「この　門番さんたちの\n\t願いは　打倒　大魔王だものね。\n@c0@"
  ko: "@a@b%a002020: 이 문지기들의 소원은\n대마왕을 쓰러뜨리는 거구나.\n@c0@"
  sl: "@a@b%a002020：这两位守门人的愿望，\n　　就是打倒大魔王对吧。\n@c0@"
  tl: "@a@b%a002020：這兩位守門人的願望，\n　　就是打倒大魔王對吧。\n@c0@"
400:
  en: "@a%0%a002020@bIf we're going to answer their prayers, we need to be strong enough to swat Blackmar like a fly!\n@c0@"
  ja: "@a@b%a002020「アクバーなんか\n\tちょちょい　と　やっつけないと\n\tいけないね！\n@c0@"
  ko: "@a@b%a002020: 아크바 따윈\n한 방에 확\n해치워 버려야 하는데!\n@c0@"
  sl: "@a@b%a002020：阿库巴什么的，\n　　一定要三两下就干掉他！\n@c0@"
  tl: "@a@b%a002020：阿庫巴什麼的，\n　　一定要三兩下就幹掉他！\n@c0@"
401:
  en: "@a%0%a002030@bThe Archfiend wiped out all of their kind. It falls to us to avenge them.\n@c0@"
  ja: "@a@b%a002030「大魔王に　ほろぼされた\n\t巨人族の　うらみ……\n\t私たちが　きっと　はらします！\n@c0@"
  ko: "@a@b%a002030: 대마왕한테 멸망당한\n거인족의 원한......\n우리가 풀어 줄게요!\n@c0@"
  sl: "@a@b%a002030：被大魔王灭绝的巨人族，\n　　他们的仇恨……\n　　我们一定会为他们雪耻！\n@c0@"
  tl: "@a@b%a002030：被大魔王滅絕的巨人族，\n　　他們的仇恨……\n　　我們一定會為他們雪恥！\n@c0@"
402:
  en: "@a%0%a002050@bIt's only thanks to that giant that we got this far. Let's do him proud!\n@c0@"
  ja: "@a@b%a002050「そもそも　この人の　おかげで\n\tここまで　来れたんです。\n\tあと　ひといき　がんばりましょう！\n@c0@"
  ko: "@a@b%a002050: 원래 이 사람 덕분에\n여기까지 올 수 있었습니다.\n조금만 더 힘내자구요!\n@c0@"
  sl: "@a@b%a002050：原本我们就是多亏他\n　　才能走到这一步的。\n　　再努力一把！\n@c0@"
  tl: "@a@b%a002050：原本我們就是多虧他\n　　才能走到這一步的。\n　　再努力一把！\n@c0@"
403:
  en: "@a%0%a002040@bNext time we speak to him, I hope we can report on Blackmar's demise.\n@c0@"
  ja: "@a@b%a002040「アクバー打倒の\n\tほうこくを　楽しみに\n\t待っていてもらおうか。\n@c0@"
  ko: "@a@b%a002040: 아크바를 타도했다는\n소식을 꼭 전해주지.\n기대하고 있어라!\n@c0@"
  sl: "@a@b%a002040：那他们就期待着\n　　我们打倒了阿库巴的捷报吧。\n@c0@"
  tl: "@a@b%a002040：那他們就期待著\n　　我們打倒了阿庫巴的捷報吧。\n@c0@"
404:
  en: "@a%0%a002060@b(snarl) Giant is...on our side... (slobber)\n@c0@"
  ja: "@a@b%a002060「私たちを…おうえん…\n\tしてくれて…いるのだな…？\n@c0@"
  ko: "@a@b%a002060: 우리를...응원...\n해 주고...있는 건가......?\n@c0@"
  sl: "@a@b%a002060：他们……一直……在……\n　　支持着……我们的吧……\n@c0@"
  tl: "@a@b%a002060：他們……一直……在……\n　　支持著……我們的吧……\n@c0@"
405:
  en: "@a%0%a002070@bBoi-oing! Boi-oing!\n@c0@"
  ja: "@a@b%a002070「プルプルピッ！\n@c0@"
  ko: "@a@b%a002070: 뽀용뽀용 삐!\n@c0@"
  sl: "@a@b%a002070：噗噜噗噜哔！\n@c0@"
  tl: "@a@b%a002070：噗嚕噗嚕嗶！\n@c0@"
406:
  en: "@a%0%a002000@bHuh. He must've drunk that wine, aye?\n@c0@"
  ja: "@a@b%a002000「なんと！\n\tすいみん薬　入りの　ぶどう酒を\n\t飲んじまったのか……！？\n@c0@"
  ko: "@a@b%a002000: 이런!\n수면제를 넣은 포도주를\n마셔 버린 것인가......!?\n@c0@"
  sl: "@a@b%a002000：什么！\n　　这是喝了添加安眠药的\n　　葡萄酒了吗……\n@c0@"
  tl: "@a@b%a002000：什麼！\n　　這是喝了添加安眠藥的\n　　葡萄酒了嗎……\n@c0@"
407:
  en: "@a%0%a002010@bOh my... The rebels must have given him some wine, not knowing he was on their side...\n@c0@"
  ja: "@a@b%a002010「町の人たちは　彼らが\n\t味方だとは　知らずに　ぶどう酒を\n\t飲ませてしまったのね……。\n@c0@"
  ko: "@a@b%a002010: 마을 사람들은 그들이\n우리 편인 줄 모르고 포도주를\n마시게 한 모양이야......\n@c0@"
  sl: "@a@b%a002010：可能是由于镇上的人\n　　不知道他们是自己人，所以\n　　才给了他们葡萄酒喝吧……\n@c0@"
  tl: "@a@b%a002010：可能是由於鎮上的人\n　　不知道他們是自己人，所以\n　　才給了他們葡萄酒喝吧……\n@c0@"
408:
  en: "@a%0%a002020@bAnother wine connoisseur, huh?\n@c0@"
  ja: "@a@b%a002020「この人　ぶどう酒が\n\t大好きだったのかしら……。\n@c0@"
  ko: "@a@b%a002020: 이 사람, 포도주를\n정말 좋아했나 봐......\n@c0@"
  sl: "@a@b%a002020：这个人\n　　很喜欢喝葡萄酒吗？\n@c0@"
  tl: "@a@b%a002020：這個人\n　　很喜歡喝葡萄酒嗎？\n@c0@"
409:
  en: "@a%0%a002030@bLet's leave him to his slumber.\n@c0@"
  ja: "@a@b%a002030「そっと　しておきましょう。\n@c0@"
  ko: "@a@b%a002030: 푹 쉬도록 내버려두자구요.\n@c0@"
  sl: "@a@b%a002030：就让他睡吧。\n@c0@"
  tl: "@a@b%a002030：就讓他睡吧。\n@c0@"
410:
  en: "@a%0%a002050@bDo giants dream of giant sheep? I wonder...\n@c0@"
  ja: "@a@b%a002050「カラダが　大きいと\n\tイビキも　すごいですね……。\n@c0@"
  ko: "@a@b%a002050: 몸이 크면\n코 고는 소리도 크군요......\n@c0@"
  sl: "@a@b%a002050：块头够大，\n　　鼾声也是够厉害的……\n@c0@"
  tl: "@a@b%a002050：塊頭夠大，\n　　鼾聲也是夠厲害的……\n@c0@"
411:
  en: "@a%0%a002040@bHe's asleep at a time like this...?\n@c0@"
  ja: "@a@b%a002040「ねてるのかよ……。\n@c0@"
  ko: "@a@b%a002040: 자고 있어......?\n@c0@"
  sl: "@a@b%a002040：是睡着了吗……\n@c0@"
  tl: "@a@b%a002040：是睡著了嗎……\n@c0@"
412:
  en: "@a%0%a002060@b(snarl) Giant...fast asleep... (slobber)\n@c0@"
  ja: "@a@b%a002060「大きい人…ねてる。\n@c0@"
  ko: "@a@b%a002060: 큰 사람...자고 있다.\n@c0@"
  sl: "@a@b%a002060：高大的人……睡着了。\n@c0@"
  tl: "@a@b%a002060：高大的人……睡著了。\n@c0@"
413:
  en: "@a%0%a002070@bBoing? Boing...?\n@c0@"
  ja: "@a@b%a002070「プルーッ！\n\tプルーッ！\n@c0@"
  ko: "@a@b%a002070: 뽀르~!\n뽀르~!\n@c0@"
  sl: "@a@b%a002070：噗噜！噗噜！\n@c0@"
  tl: "@a@b%a002070：噗嚕！噗嚕！\n@c0@"
414:
  en: "@a%0%a002000@bWell, that was easy. He must be pretty helpless without his partner in crime, aye?\n@c0@"
  ja: "@a@b%a002000「思ったより　弱かったな。\n\t相ぼうが　いなくて　ひとりだと\n\tこんなもん　だったのか……？\n@c0@"
  ko: "@a@b%a002000: 생각했던 것보다 약했군.\n부하 없이 혼자라\n이 정도 밖에 안 되나......?\n@c0@"
  sl: "@a@b%a002000：比想象中的还要弱。\n　　没了同伴的支援，只有他一个人的话，\n　　结果就只是这样吗……\n@c0@"
  tl: "@a@b%a002000：比想像中的還要弱。\n　　沒了同伴的支援，只有他一個人的話，\n　　結果就只是這樣嗎……\n@c0@"
415:
  en: "@a%0%a002010@bWe've only got Blackmar left to defeat! Brace yourselves, everybody!\n@c0@"
  ja: "@a@b%a002010「これで　もはや\n\tのこる敵は　アクバーのみ！\n\tみんな　もう　ひとふんばりよ！\n@c0@"
  ko: "@a@b%a002010: 이걸로 이제\n남은 적은 아크바뿐!\n모두 조금만 더 힘내자!\n@c0@"
  sl: "@a@b%a002010：这样一来，\n　　剩下的敌人就只有阿库巴了！\n　　大家再加把劲！\n@c0@"
  tl: "@a@b%a002010：這樣一來，\n　　剩下的敵人就只有阿庫巴了！\n　　大家再加把勁！\n@c0@"
416:
  en: "@a%0%a002020@bWow! He's, like, totally pathetic without Dogmus at his side, huh?\n@c0@"
  ja: "@a@b%a002020「あの　ドグマっていう\n\t部下が　いないからか\n\tあっけなかったね。\n@c0@"
  ko: "@a@b%a002020: 그 도그마라는\n부하가 없어서 그런지\n너무 싱거웠어.\n@c0@"
  sl: "@a@b%a002020：是因为那个叫多古马的\n　　部下不在吗？\n　　真是没劲呢。\n@c0@"
  tl: "@a@b%a002020：是因為那個叫多古馬的\n　　部下不在嗎？\n　　真是沒勁呢。\n@c0@"
417:
  en: "@a%0%a002020@bI guess two heads are deadlier than one.\n@c0@"
  ja: "@a@b%a002020「やっぱり\n\tコンビネーションって\n\tだいじ　なんだなー。\n@c0@"
  ko: "@a@b%a002020: 역시\n쿵짝이 잘 맞아야\n하는 거라니까~\n@c0@"
  sl: "@a@b%a002020：果然合作这东西\n　　是非常重要的啊。\n@c0@"
  tl: "@a@b%a002020：果然合作這東西\n　　是非常重要的啊。\n@c0@"
418:
  en: "@a%0%a002030@bThat battle cost us time we can ill afford. We must press on.\n@c0@"
  ja: "@a@b%a002030「この　戦いで\n\t少し　時間を　ロスしました。\n\t中に　急ぎましょう。\n@c0@"
  ko: "@a@b%a002030: 이 전투에서\n시간을 조금 많이 뺏겼군요.\n어서 안쪽으로 가시죠.\n@c0@"
  sl: "@a@b%a002030：这场战斗耗费了\n　　我们一点时间。\n　　现在快进去吧。\n@c0@"
  tl: "@a@b%a002030：這場戰鬥耗費了\n　　我們一點時間。\n　　現在快進去吧。\n@c0@"
419:
  en: "@a%0%a002050@bBlimey! I got the shock of my life when he woke up!\n@c0@"
  ja: "@a@b%a002050「いやー　ビックリしました！\n\tまさか　起きちゃうとは\n\t思いませんでしたね。\n@c0@"
  ko: "@a@b%a002050: 이야~ 깜짝 놀랐습니다!\n설마 깨어나 버릴 줄은\n꿈에도 생각 못 했습니다.\n@c0@"
  sl: "@a@b%a002050：哎呀，还真是吓了一跳！\n　　没想到他真的会醒过来。\n@c0@"
  tl: "@a@b%a002050：哎呀，還真是嚇了一跳！\n　　沒想到他真的會醒過來。\n@c0@"
420:
  en: "@a%0%a002040@bI wish we hadn't spoken to him.\n@c0@"
  ja: "@a@b%a002040「話しかけなきゃ\n\tよかったな……。\n@c0@"
  ko: "@a@b%a002040: 말을 걸지 않았으면\n좋았을 텐데......\n@c0@"
  sl: "@a@b%a002040：早知道\n　　就不跟他说话了……\n@c0@"
  tl: "@a@b%a002040：早知道\n　　就不跟他說話了……\n@c0@"
421:
  en: "@a%0%a002060@b(snarl) Blackmar next... (spit)\n@c0@"
  ja: "@a@b%a002060「つぎ…アクバー……。\n@c0@"
  ko: "@a@b%a002060: 다음...아크바......\n@c0@"
  sl: "@a@b%a002060：下一个……阿库巴……\n@c0@"
  tl: "@a@b%a002060：下一個……阿庫巴……\n@c0@"
422:
  en: "@a%0%a002070@bBoing boing! Boing boing!\n@c0@"
  ja: "@a@b%a002070「プリリン　プルーッ！\n@c0@"
  ko: "@a@b%a002070: 뽀르르 뽀르~!\n@c0@"
  sl: "@a@b%a002070：噗哩哩，噗噜！\n@c0@"
  tl: "@a@b%a002070：噗哩哩，噗嚕！\n@c0@"
423:
  en: "@a%0%a002000@bAh, leave him be.\n@c0@"
  ja: "@a@b%a002000「こいつは\n\tほっとこう。\n@c0@"
  ko: "@a@b%a002000: 이 녀석은\n내버려두자.\n@c0@"
  sl: "@a@b%a002000：别管这家伙了。\n@c0@"
  tl: "@a@b%a002000：別管這傢伙了。\n@c0@"
424:
  en: "@a%0%a002010@bYou can see for miles from here... I wonder if Mortamor's castle is visible...\n@c0@"
  ja: "@a@b%a002010「ここからは　ずいぶん\n\tとおくまで　見えるけど……\n\tデスタムーアの城は　見える……？\n@c0@"
  ko: "@a@b%a002010: 여기서부터는 꽤\n멀리까지 보이긴 하는데......\n데스타무아의 성도 보여......?\n@c0@"
  sl: "@a@b%a002010：从这里能看到\n　　相当远的地方……\n　　能够看到德斯塔穆亚城堡吗……\n@c0@"
  tl: "@a@b%a002010：從這裡能看到\n　　相當遠的地方……\n　　能夠看到德斯塔穆亞城堡嗎……\n@c0@"
425:
  en: "@a%0%a002020@bThat's the problem with an army of lackeys — pea-brained guys like him are your most faithful.\n@c0@"
  ja: "@a@b%a002020「手下に　するなら\n\tこういう　たんじゅん　なのが\n\tいいのね　きっと。\n@c0@"
  ko: "@a@b%a002020: 부하로 삼기에는\n이렇게 단순한 녀석이\n딱인데 말이야.\n@c0@"
  sl: "@a@b%a002020：若是作为手下的话，\n　　像这样单纯的家伙\n　　一定很不错的吧。\n@c0@"
  tl: "@a@b%a002020：若是作為手下的話，\n　　像這樣單純的傢伙\n　　一定很不錯的吧。\n@c0@"
426:
  en: "@a%0%a002030@bCurrying favour with the Archfiend in his sleep. Pitiful...\n@c0@"
  ja: "@a@b%a002030「まぎらわしい\n\tねごと　ですね……。\n@c0@"
  ko: "@a@b%a002030: 잠꼬대인지\n분간이 안 가는군요......\n@c0@"
  sl: "@a@b%a002030：这梦话说得\n　　很模糊不清……\n@c0@"
  tl: "@a@b%a002030：這夢話說得\n　　很模糊不清……\n@c0@"
427:
  en: "@a%0%a002050@bFor a second there, I thought he was awake!\n@c0@"
  ja: "@a@b%a002050「ああ　ビックリした。\n\t起きてるのかと　思いましたよ。\n@c0@"
  ko: "@a@b%a002050: 아~ 깜짝이야.\n잠이 깬 줄 알았어요.\n@c0@"
  sl: "@a@b%a002050：没错，吓了人一跳。\n　　还以为他是醒着的。\n@c0@"
  tl: "@a@b%a002050：沒錯，嚇了人一跳。\n　　還以為他是醒著的。\n@c0@"
428:
  en: "@a%0%a002040@bHe's not waking up any time soon.\n@c0@"
  ja: "@a@b%a002040「ぐっすり\n\tおねんねか……。\n@c0@"
  ko: "@a@b%a002040: 푹\n자고 있군......\n@c0@"
  sl: "@a@b%a002040：睡得这么沉吗……\n@c0@"
  tl: "@a@b%a002040：睡得這麼沉嗎……\n@c0@"
429:
  en: "@a%0%a002060@b(snarl) Guard sleeping...on the job... (spit)\n@c0@"
  ja: "@a@b%a002060「みはり…ねてる……。\n@c0@"
  ko: "@a@b%a002060: 보초...자고 있다......\n@c0@"
  sl: "@a@b%a002060：哨兵……在睡觉……\n@c0@"
  tl: "@a@b%a002060：哨兵……在睡覺……\n@c0@"
430:
  en: "@a%0%a002070@bBoing...\n@c0@"
  ja: "@a@b%a002070「プルル……。\n@c0@"
  ko: "@a@b%a002070: 뽀르르......\n@c0@"
  sl: "@a@b%a002070：噗噜噜……\n@c0@"
  tl: "@a@b%a002070：噗嚕嚕……\n@c0@"
