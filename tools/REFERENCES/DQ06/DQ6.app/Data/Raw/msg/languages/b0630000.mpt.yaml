20:
  en: "@a%0%a002020@bThey're just lucky we didn't beat the stuffing out of 'em!\n@c0@"
  ja: "@a@b%a002020「ねむってる　兵士たちは\n\tあたしたちに　倒されなくて\n\tラッキーだね！\n@c0@"
  ko: "@a@b%a002020: 잠든 병사들은\n우리랑 안 싸워도 되니까\n정말 운이 좋은 거야!\n@c0@"
  sl: "@a@b%a002020：这些睡得半死的士兵，\n　　没有被我们放倒，\n　　真是幸运！\n@c0@"
  tl: "@a@b%a002020：這些睡得半死的士兵，\n　　沒有被我們放倒，\n　　真是幸運！\n@c0@"
