11:
  en: "@a%0%a002010@bWe don't want to be left behind if there's a coup going on! Let's go!\n@c0@"
  ja: "@a@b%a002010「これは　クーデターね。\n\t私たちが　おくれを　とったら\n\tはずかしいわ。　急ぎましょう！\n@c0@"
  ko: "@a@b%a002010: 이건 쿠데타야.\n우리가 뒤처지면\n창피하잖아. 서두르자구!\n@c0@"
  sl: "@a@b%a002010：这就是政变呢。\n　　我们要是落后了感觉会很不好意思。\n　　大家赶快吧！\n@c0@"
