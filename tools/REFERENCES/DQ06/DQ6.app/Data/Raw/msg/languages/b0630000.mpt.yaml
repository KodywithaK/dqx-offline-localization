5:
  en: "@a%0%a002030@bBlackmar's underlings were far more powerful than I had foreseen.\n@c0@"
  ja: "@a@b%a002030「アクバーの　手下が\n\tあれほど　手ごわいとは\n\t思いませんでしたね……。\n@c0@"
  ko: "@a@b%a002030: 아크바의 부하가\n저렇게 강할 줄은\n생각지 못했습니다......\n@c0@"
  sl: "@a@b%a002030：真的没有想到，\n　　就连阿库巴的手下都\n　　难以对付到那个程度……\n@c0@"
  tl: "@a@b%a002030：真的沒有想到，\n　　就連阿庫巴的手下都\n　　難以對付到那個程度……\n@c0@"
6:
