  en: "@a%0%a002050@bI gave that sleepin' fellow a poke, but he's out for the count.\n@c0@"
  ja: "@a@b%a002050「ちょっと　つっついて\n\tみましたが　起きる　気配は\n\tないですね。\n@c0@"
  ko: "@a@b%a002050: 살짝 찔러 봤는데요\n일어날 기색은\n전혀 없는 것 같습니다.\n@c0@"
