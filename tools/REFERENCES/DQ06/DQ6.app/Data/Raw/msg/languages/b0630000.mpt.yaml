12:
  en: "@a%0%a002020@bWow! The townspeople are finally rising up! Let's go join them!\n@c0@"
  ja: "@a@b%a002020「すっごーい！\n\t町のみんなが　立ち上がったのね。\n\tあたしたちも　行きましょ！\n@c0@"
  ko: "@a@b%a002020: 굉장해~!\n마을 사람들이 들고 일어섰구나.\n우리도 가자!\n@c0@"
  sl: "@a@b%a002020：好厉害！\n　　镇上的人们全都振奋起来了啊。\n　　那么我们也走吧！\n@c0@"
