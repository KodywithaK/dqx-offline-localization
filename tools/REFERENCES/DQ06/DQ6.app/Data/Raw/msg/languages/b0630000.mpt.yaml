  ja: "@a@b%a002050「なんだか　まだ\n\tカラダの　しびれが\n\tのこって　いるようです。\n@c0@"
  ko: "@a@b%a002050: 아직 여기저기\n몸이 쑤시는 것\n같습니다.\n@c0@"
  sl: "@a@b%a002050：总感觉身子到现在\n　　都还有些麻麻的。\n@c0@"
  tl: "@a@b%a002050：總感覺身子到現在\n　　都還有些麻麻的。\n@c0@"
