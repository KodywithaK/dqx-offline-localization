  sl: "@a@b%a002010：真没想到，\n　　事情会变成这样……\n@c0@"
  tl: "@a@b%a002010：真沒想到，\n　　事情會變成這樣……\n@c0@"
3:
  en: "@a%0%a002020@bUgh... This has to be the worst morning ever.\n@c0@"
  ja: "@a@b%a002020「あーあ。\n\t最悪の　朝ね……。\n@c0@"
  ko: "@a@b%a002020: 아~아\n끔찍한 아침이네......\n@c0@"
  sl: "@a@b%a002020：啊啊，真是个\n　　最差劲的早晨……\n@c0@"
  tl: "@a@b%a002020：啊啊，真是個\n　　最差勁的早晨……\n@c0@"
4:
  en: "@a%0%a002020@bWe have no key, no uniforms, and no hope of getting out of here now...\n@c0@"
  ja: "@a@b%a002020「カギも　服もないし\n\tどうやって　ここから　出れば\n\tいいのかなあ……？\n@c0@"
