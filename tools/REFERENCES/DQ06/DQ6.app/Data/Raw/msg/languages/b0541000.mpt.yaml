248:
  en: "@a%0%a002050@bAny chance of gettin' him to repeat all that?\n@c0@"
  ja: "@a@b%a002050「あ……　す　すみません\n\tあいづちが　ダジャレに\n\tなってしまいました！\n@c0@"
  ko: "@a@b%a002050: 아...... 죄, 죄송합니다.\n그냥 저도 모르게\n생각이 나서요!\n@c0@"
  sl: "@a@b%a002050：啊……不、不好意思，\n　　一不小心\n　　说了个冷笑活！\n@c0@"
  tl: "@a@b%a002050：啊……不、不好意思，\n　　一不小心\n　　說了個冷笑活！\n@c0@"
249:
  en: "@a%0%a002000@bHardy har! Good thing we found another way in.\n@c0@"
  ja: "@a@b%a002000「ちゃーんと　オレたちは\n\t抜け道から　たどり着いたぜ。\n@c0@"
  ko: "@a@b%a002000: 우린 그\n샛길을 통해서 갔다구.\n@c0@"
  sl: "@a@b%a002000：俺们确实是绕了\n　　好远的路才到达那里呢。\n@c0@"
  tl: "@a@b%a002000：俺們確實是繞了\n　　好遠的路才到達那裡呢。\n@c0@"
250:
  en: "@a%0%a002010@bYes, conventional means are not the answer...\n@c0@"
  ja: "@a@b%a002010「おじいさんの　いうとおり\n\tふつうの方法では　あそこまで\n\t行けなかったわね……。\n@c0@"
  ko: "@a@b%a002010: 할아버지 말씀대로\n보통 방법으로는 거기까지\n갈 수 없었지......\n@c0@"
  sl: "@a@b%a002010：老爷爷说得没错，\n　　用普通的方法的确是\n　　去不了那里呢……\n@c0@"
  tl: "@a@b%a002010：老爺爺說得沒錯，\n　　用普通的方法的確是\n　　去不了那裡呢……\n@c0@"
251:
  en: "@a%0%a002020@bLittle does he know, we've already been there! Tee hee!\n@c0@"
  ja: "@a@b%a002020「フォーン城には　もう\n\t行ってきたよ　おじいさん。\n@c0@"
  ko: "@a@b%a002020: 폰 성에는 벌써\n다녀왔어, 할아버지.\n@c0@"
  sl: "@a@b%a002020：佛恩城\n　　我们已经去过了哦，老爷爷。\n@c0@"
  tl: "@a@b%a002020：佛恩城\n　　我們已經去過了哦，老爺爺。\n@c0@"
252:
  en: "@a%0%a002030@bCastle Swanstone was a most impressive castle, to be sure.\n@c0@"
  ja: "@a@b%a002030「フォーン城は\n\tなかなか　りっぱな\n\tお城でしたね。\n@c0@"
  ko: "@a@b%a002030: 폰 성은\n아주 훌륭한\n성이었죠.\n@c0@"
  sl: "@a@b%a002030：佛恩城\n　　真是雄伟壮观呢。\n@c0@"
  tl: "@a@b%a002030：佛恩城\n　　真是雄偉壯觀呢。\n@c0@"
253:
  en: "@a%0%a002050@bThat shortcut was bloomin' well hidden, I tell you!\n@c0@"
  ja: "@a@b%a002050「まあ　たしかに\n\tふつうは　あの抜け道には\n\t気付かないですよね。\n@c0@"
  ko: "@a@b%a002050: 맞습니다.\n보통은 그 샛길이 있다는 걸\n눈치채지 못하겠죠.\n@c0@"
  sl: "@a@b%a002050：哎，普通人确实\n　　很难想到还能那样绕过去呢。\n@c0@"
  tl: "@a@b%a002050：哎，普通人確實\n　　很難想到還能那樣繞過去呢。\n@c0@"
254:
  en: "@a%0%a002050@bOld %a002050 wouldn't have dreamt of lookin' there if it hadn't been for you folks!\n@c0@"
  ja: "@a@b%a002050「私も　みなさんの仲間になるまで\n\tあんな方法が　あるなんて\n\t夢にも思いませんでした！　な～んて。\n@c0@"
  ko: "@a@b%a002050: 저도 여러분의 동료가 되기 전엔\n그런 방법이 있으리라고는\n상상도 못 했으니까요! 하하.\n@c0@"
  sl: "@a@b%a002050：我在加入大伙之前，\n　　做梦都没想过\n　　还有这样的方法！\n@c0@"
  tl: "@a@b%a002050：我在加入大夥之前，\n　　做夢都沒想過\n　　還有這樣的方法！\n@c0@"
255:
  en: "@a%0%a002000@bAvast! So that key from King Ludwig fits the floodgate? Let's go and open her up!\n@c0@"
  ja: "@a@b%a002000「フォーン王がくれたのって\n\tこの先にある　水門のカギだったのか。\n\tさっそく　開けに行ってみようぜ。\n@c0@"
  ko: "@a@b%a002000: 폰 왕이 준 게 바로\n이 앞에 있는 수문의 열쇠였군.\n어서 열러 가 보자고.\n@c0@"
  sl: "@a@b%a002000：佛恩王给咱的，\n　　就是前面那个水门的钥匙吧。\n　　赶紧过去把它打开吧。\n@c0@"
  tl: "@a@b%a002000：佛恩王給咱的，\n　　就是前面那個水門的鑰匙吧。\n　　趕緊過去把它打開吧。\n@c0@"
256:
  en: "@a%0%a002010@bI wonder what awaits us beyond the floodgate...\n@c0@"
  ja: "@a@b%a002010「水門の先には\n\tいったい　何があるのかしら。\n@c0@"
  ko: "@a@b%a002010: 수문 너머에는\n과연 뭐가 있을까?\n@c0@"
  sl: "@a@b%a002010：水门对面\n　　究竟有什么啊。\n@c0@"
  tl: "@a@b%a002010：水門對面\n　　究竟有什麼啊。\n@c0@"
257:
  en: "@a%0%a002020@bI wonder what's on the other side of the floodgate... Aren't you curious?\n@c0@"
  ja: "@a@b%a002020「水門の先って\n\tどんなところなのかな？\n\tちょっと　楽しみかも。\n@c0@"
  ko: "@a@b%a002020: 수문 너머는\n어떤 세계일까?\n궁금한걸.\n@c0@"
  sl: "@a@b%a002020：水门对面\n　　是个怎样的地方呢？\n　　有点期待啊。\n@c0@"
  tl: "@a@b%a002020：水門對面\n　　是個怎樣的地方呢？\n　　有點期待啊。\n@c0@"
258:
  en: "@a%0%a002030@bI wonder why the floodgate was closed in the first place? There must be some explanation...\n@c0@"
  ja: "@a@b%a002030「それにしても　なぜ\n\t水門が　閉ざされていたのでしょう？\n\t何か　理由がありそうですが……。\n@c0@"
  ko: "@a@b%a002030: 그나저나 왜\n수문이 폐쇄되었던 걸까요?\n뭔가 이유가 있을 것 같은데......\n@c0@"
  sl: "@a@b%a002030：不过，为什么\n　　水门会被关闭啊？\n　　有什么原因吗……\n@c0@"
  tl: "@a@b%a002030：不過，為什麼\n　　水門會被關閉啊？\n　　有什麼原因嗎……\n@c0@"
259:
  en: "@a%0%a002050@bThere's a whole new world waitin' for us beyond the floodgate. I can't wait to see it!\n@c0@"
  ja: "@a@b%a002050「水門の先に　新しい世界が\n\t待っているんですよね！\n\t私　もう　ワクワクしっぱなしです！\n@c0@"
  ko: "@a@b%a002050: 수문 너머에 새로운 세계가\n기다리고 있군요!\n저, 아까부터 가슴이 계속 뜁니다!\n@c0@"
  sl: "@a@b%a002050：水门对面\n　　有一个崭新的世界等待着我们呢！\n　　真是期待啊！\n@c0@"
  tl: "@a@b%a002050：水門對面\n　　有一個嶄新的世界等待著我們呢！\n　　真是期待啊！\n@c0@"
260:
  en: "@a%0%a002000@bThis fella's pretty up on things for a hermit, aye?\n@c0@"
  ja: "@a@b%a002000「こんな場所に\n\tたったひとりで　暮らしてるのに\n\t物知りな　じいさんだよな。\n@c0@"
  ko: "@a@b%a002000: 이런 곳에서\n혼자 살고 있는데도\n많은 걸 알고 있는 영감님이군.\n@c0@"
  sl: "@a@b%a002000：这个老爷爷一个人\n　　生活在这偏僻的地方，\n　　没想到却什么事情都知道呢。\n@c0@"
  tl: "@a@b%a002000：這個老爺爺一個人\n　　生活在這偏僻的地方，\n　　沒想到卻什麽事情都知道呢。\n@c0@"
261:
  en: "@a%0%a002000@bMaybe he gets more visitors now that the floodgate's open.\n@c0@"
  ja: "@a@b%a002000「水門が　開いて\n\tオレたちみたいな　通りがかりの客が\n\t増えたってことか？\n@c0@"
  ko: "@a@b%a002000: 수문이 열리면서\n우리 같은 여행객이\n늘어난 건가?\n@c0@"
  sl: "@a@b%a002000：难道是因为水门打开后，\n　　像咱们一样从这里经过的\n　　过客也增多了的缘故？\n@c0@"
  tl: "@a@b%a002000：難道是因為水門打開后，\n　　像咱們一樣從這裡經過的\n　　過客也增多了的緣故？\n@c0@"
262:
  en: "@a%0%a002010@bI sense a dark force south of the floodgate. It must be the cause of the rough seas too.\n@c0@"
  ja: "@a@b%a002010「たしかに　水門の先から\n\t強い　闇のチカラを　感じるわ。\n\t海が荒れているのも　そのせいね。\n@c0@"
  ko: "@a@b%a002010: 맞아, 수문 너머에서\n강한 어둠의 힘이 느껴져.\n바다가 거친 것도 그 때문일 거야.\n@c0@"
  sl: "@a@b%a002010：的确能感受到水门对面\n　　强大的黑暗力量呢。海上之所以\n　　不平静，也是因为这股力量吧。\n@c0@"
  tl: "@a@b%a002010：的確能感受到水門對面\n　　強大的黑暗力量呢。海上之所以\n　　不平靜，也是因為這股力量吧。\n@c0@"
263:
  en: "@a%0%a002020@bChoppy seas? Great. It ain't easy being queasy...\n@c0@"
  ja: "@a@b%a002020「水門の先って\n\tあんまり　いいところじゃなかったね。\n\tちょっと　がっかりかも。\n@c0@"
  ko: "@a@b%a002020: 수문 너머는\n그렇게 좋은 곳이 아니었어.\n좀 실망했지 뭐야.\n@c0@"
  sl: "@a@b%a002020：水门对面\n　　没什么好玩的东西呢。\n　　好失望。\n@c0@"
  tl: "@a@b%a002020：水門對面\n　　沒什麼好玩的東西呢。\n　　好失望。\n@c0@"
264:
  en: "@a%0%a002030@bSo the floodgate was closed because of the rough waters that lie beyond it.\n@c0@"
  ja: "@a@b%a002030「水門が　閉ざされていたのは\n\t海が荒れていたから　なのですね。\n\tようやく　理由がわかりました。\n@c0@"
  ko: "@a@b%a002030: 수문이 폐쇄되었던 건\n거친 바다 때문이었군요.\n이제 이유를 알겠습니다.\n@c0@"
  sl: "@a@b%a002030：水门关闭是因为\n　　海上波涛汹涌啊。\n　　我终于知道了。\n@c0@"
  tl: "@a@b%a002030：水門關閉是因為\n　　海上波濤洶湧啊。\n　　我終於知道了。\n@c0@"
265:
  en: "@a%0%a002050@bNot a lot of folks know this, but old %a002050 isn't too keen on choppy oceans. \n@c0@"
  ja: "@a@b%a002050「越えるべき波が\n\t高ければ　高いほど　燃えるのが\n\t男というものです！\n@c0@"
  ko: "@a@b%a002050: 넘어야 할 파도가\n높으면 높을수록 불타오르는 게\n바로 사나이랍니다!\n@c0@"
  sl: "@a@b%a002050：迎难而上，\n　　愈挫愈勇，\n　　这才是铁血真汉子！\n@c0@"
  tl: "@a@b%a002050：迎難而上，\n　　愈挫愈勇，\n　　這才是鐵血真漢子！\n@c0@"
266:
  en: "@a%0%a002050@bDon't be alarmed if I start lookin' a little green round the gills...\n@c0@"
  ja: "@a@b%a002050「あっ　そういう意味じゃ\n\tないんですか……　すみません。\n@c0@"
  ko: "@a@b%a002050: 앗, 그런 뜻이\n아니었군요...... 죄송합니다.\n@c0@"
  sl: "@a@b%a002050：啊，不是这个意思啊……\n　　对不起。\n@c0@"
  tl: "@a@b%a002050：啊，不是這個意思啊……\n　　對不起。\n@c0@"
267:
  en: "@a%0%a002000@bThis fella's pretty up on things for a hermit, aye?\n@c0@"
  ja: "@a@b%a002000「こんな場所に\n\tたったひとりで　暮らしてるのに\n\t物知りな　じいさんだぜ。\n@c0@"
  ko: "@a@b%a002000: 이런 곳에서\n혼자 살고 있는데도\n많은 걸 알고 있는 영감님이군.\n@c0@"
  sl: "@a@b%a002000：这个老爷爷一个人\n　　生活在这偏僻的地方，\n　　没想到却什么事情都知道呢。\n@c0@"
  tl: "@a@b%a002000：這個老爺爺一個人\n　　生活在這偏僻的地方，\n　　沒想到卻什麽事情都知道呢。\n@c0@"
268:
  en: "@a%0%a002000@bMaybe he gets a lot more visitors than he's lettin' on.\n@c0@"
  ja: "@a@b%a002000「こう見えて　けっこう\n\t客が来ているのかも　しれないな。\n@c0@"
  ko: "@a@b%a002000: 이래 봬도 제법\n손님들이 드나들 수도 있겠어.\n@c0@"
  sl: "@a@b%a002000：别看这里这么偏僻，\n　　来往的客人恐怕挺多的呢。\n@c0@"
  tl: "@a@b%a002000：別看這裡這麼偏僻，\n　　來往的客人恐怕挺多的呢。\n@c0@"
269:
  en: "@a%0%a002010@b‘Was’? Does this mean that it's no longer there?\n@c0@"
  ja: "@a@b%a002010「かつて……　ということは\n\t今は　存在していない　と\n\tいう意味なのかしら……？\n@c0@"
  ko: "@a@b%a002010: 과거에...... 그렇다면\n지금은 존재하지 않는다는\n뜻일까......?\n@c0@"
  sl: "@a@b%a002010：以前……也就是说\n　　现在已经不存在了吗？\n@c0@"
  tl: "@a@b%a002010：以前……也就是說\n　　現在已經不存在了嗎？\n@c0@"
270:
  en: "@a%0%a002020@b...Mmm? That's weird.\n@c0@"
  ja: "@a@b%a002020「あれ……？\n\tあたし　どうしたんだろ。\n@c0@"
  ko: "@a@b%a002020: 어라......?\n나 왜 이러지?\n@c0@"
  sl: "@a@b%a002020：诶……\n　　我是怎么了？\n@c0@"
  tl: "@a@b%a002020：誒……\n　　我是怎麼了？\n@c0@"
271:
  en: "@a%0%a002020@bSomething about the words ‘enchanted city’ really stuck in my head for some reason...\n@c0@"
  ja: "@a@b%a002020「よくわからないけど……\n\tその　魔法都市のことが\n\tすっごく気になるの。\n@c0@"
  ko: "@a@b%a002020: 이유는 모르겠지만......\n그 마법 도시라는 곳이\n자꾸만 머릿속에 맴돌아.\n@c0@"
  sl: "@a@b%a002020：不知道为什么，\n　　我好在意\n　　那个魔法都市的事啊。\n@c0@"
  tl: "@a@b%a002020：不知道為什麼，\n　　我好在意\n　　那個魔法都市的事啊。\n@c0@"
272:
  en: "@a%0%a002030@bI recall reading about a legendary enchanted city in my school books.\n@c0@"
  ja: "@a@b%a002030「伝説の魔法都市のことは\n\t以前　本で読んだことがあります。\n@c0@"
  ko: "@a@b%a002030: 전설의 마법 도시에 대한 걸\n예전에 책에서 읽은 적이 있습니다.\n@c0@"
  sl: "@a@b%a002030：传说中的魔法都市，\n　　以前在书里看到过。\n@c0@"
  tl: "@a@b%a002030：傳說中的魔法都市，\n　　以前在書裡看到過。\n@c0@"
273:
  en: "@a%0%a002030@bI must confess I thought it a mere myth.\n@c0@"
  ja: "@a@b%a002030「ただの　おとぎ話だと\n\t思っていたのですが……。\n@c0@"
  ko: "@a@b%a002030: 그저 옛이야기라고만\n생각했지요......\n@c0@"
  sl: "@a@b%a002030：我还以为\n　　那只是个故事呢……\n@c0@"
  tl: "@a@b%a002030：我還以為\n　　那只是個故事呢……\n@c0@"
274:
  en: "@a%0%a002050@bAn enchanted city, no less! Old %a002050 hasn't looked back since we left Scrimsley!\n@c0@"
  ja: "@a@b%a002050「今度は　魔法都市ですか！\n\tホント　みなさんと旅をしていると\n\tタイクツしませんね！\n@c0@"
  ko: "@a@b%a002050: 이번에는 마법 도시로군요!\n정말 여러분과 함께 여행을 하면\n지루할 틈이 없어요!\n@c0@"
  sl: "@a@b%a002050：这回是魔法都市啊！\n　　跟大家出来旅行\n　　真是妙趣丛生啊！\n@c0@"
  tl: "@a@b%a002050：這回是魔法都市啊！\n　　跟大家出來旅行\n　　真是妙趣叢生啊！\n@c0@"
275:
  en: "@a%0%a002000@bAye, we can imagine, alright. Just not in this world...\n@c0@"
  ja: "@a@b%a002000「たしかに\n\t伝説の魔法都市は　あったよな。\n\tこっちの世界じゃ　なかったけどよ。\n@c0@"
  ko: "@a@b%a002000: 맞아.\n전설의 마법 도시는 존재했지.\n이쪽 세계는 아니었지만.\n@c0@"
  sl: "@a@b%a002000：传说中的魔法都市\n　　真的有啊。\n　　不过好像不在这边这个世界。\n@c0@"
  tl: "@a@b%a002000：傳說中的魔法都市\n　　真的有啊。\n　　不過好像不在這邊這個世界。\n@c0@"
276:
  en: "@a%0%a002010@bThe enchanted city of Sorceria... Truly a mysterious and tragic place.\n@c0@"
  ja: "@a@b%a002010「魔法都市カルベローナ……\n\tとても不思議で　そして\n\t悲しい場所でしたね……。\n@c0@"
  ko: "@a@b%a002010: 마법 도시 칼베로나......\n아주 신비롭고도\n슬픈 곳이었어......\n@c0@"
  sl: "@a@b%a002010：魔法都市卡尔贝罗纳……\n　　那是个不可思议\n　　但是又让人伤感的地方呢……\n@c0@"
  tl: "@a@b%a002010：魔法都市卡爾貝羅納……\n　　那是個不可思議\n　　但是又讓人傷感的地方呢……\n@c0@"
277:
  en: "@a%0%a002020@bThat city wasn't always just in the dream world... It used to be here too...\n@c0@"
  ja: "@a@b%a002020「あの町……　昔は\n\t夢の中だけじゃなくて　こっちにも\n\t存在していたんだよね……。\n@c0@"
  ko: "@a@b%a002020: 그 마을..... 옛날에는\n꿈속뿐 아니라 이쪽에도\n존재했던 곳이었지......\n@c0@"
  sl: "@a@b%a002020：那个镇子……\n　　过去不仅是在梦中，\n　　在这边的世界也实际存在过呢……\n@c0@"
  tl: "@a@b%a002020：那個鎮子……\n　　過去不僅是在夢中，\n　　在這邊的世界也實際存在過呢……\n@c0@"
278:
  en: "@a%0%a002030@bSorceria was a profoundly mysterious place.\n@c0@"
  ja: "@a@b%a002030「伝説と　いわれるだけあって\n\t本当に　神秘的な都市でしたね。\n@c0@"
  ko: "@a@b%a002030: 전설이라는 이름이 붙을 만큼\n참으로 신비로운 도시였지요.\n@c0@"
  sl: "@a@b%a002030：不愧是成为了传说的城市，\n　　真是个神秘感十足的地方。\n@c0@"
  tl: "@a@b%a002030：不愧是成為了傳說的城市，\n　　真是個神秘感十足的地方。\n@c0@"
279:
  en: "@a%0%a002030@bI realised how much I have to learn. I would dearly love to go there again and study.\n@c0@"
  ja: "@a@b%a002030「機会が　あれば\n\tぜひ　あの町で　多くのことを\n\t学んでみたいものです。\n@c0@"
  ko: "@a@b%a002030: 기회가 있으면\n꼭 그 마을에서 다양한 것을\n배워 보고 싶습니다.\n@c0@"
  sl: "@a@b%a002030：要是有机会的话，\n　　真想去那个镇子\n　　多学点东西啊。\n@c0@"
  tl: "@a@b%a002030：要是有機會的話，\n　　真想去那個鎮子\n　　多學點東西啊。\n@c0@"
280:
