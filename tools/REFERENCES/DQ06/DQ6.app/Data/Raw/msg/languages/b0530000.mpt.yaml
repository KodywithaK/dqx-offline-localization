  en: "@a%0%a002020@bI better say thanks to the Goddess too! You know, for being well fed and finding friends and all...\n@c0@"
  ja: "@a@b%a002020「あたしも\n\tおいしく　食べてるから\n\t神さまに　感謝しようっと！\n@c0@"
  ko: "@a@b%a002020: 나도 맛있게\n먹고 있으니까\n신께 감사 드려야지!\n@c0@"
