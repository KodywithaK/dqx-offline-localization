  en: "@a%0%a002000@bNow's probably not a good time to tell him we were sailin' on the thing, aye?\n@c0@"
  ja: "@a@b%a002000「その　神の船に\n\tオレたちが　乗ってた　なんて言ったら\n\tもっと　くやしがるだろうな。\n@c0@"
  ko: "@a@b%a002000: 그 신의 배에\n우리가 타고 있다고 하면\n훨씬 더 분해할 거야.\n@c0@"
  sl: "@a@b%a002000：要是对他说，\n　　咱们坐了这艘神之船，\n　　他会更难受吧。\n@c0@"
  tl: "@a@b%a002000：要是對他說，\n　　咱們坐了這艘神之船，\n　　他會更難受吧。\n@c0@"
143:
  en: "@a%0%a002010@bIf he were to pop outside now, he could have a look... But we'd better not tell him that!\n@c0@"
  ja: "@a@b%a002010「いまなら\n\t外に　行けば　見られるけど\n\tナイショかしらね？\n@c0@"
  ko: "@a@b%a002010: 지금 밖으로\n나가면 보일 텐데\n비밀인가?\n@c0@"
  sl: "@a@b%a002010：现在去外面就能看见了，\n　　不过还是别告诉他比较好吧？\n@c0@"
  tl: "@a@b%a002010：現在去外面就能看見了，\n　　不過還是別告訴他比較好吧？\n@c0@"
144:
  en: "@a%0%a002020@bWow, it sure was a surprise when we came out on that river in the Providence!\n@c0@"
  ja: "@a@b%a002020「船が　川に出るときは\n\tビックリしちゃったよー！\n@c0@"
  ko: "@a@b%a002020: 배가 강으로 나갈 때는\n깜짝 놀랐어~!\n@c0@"
  sl: "@a@b%a002020：船开出去的时候\n　　声音可大了呢！\n@c0@"
  tl: "@a@b%a002020：船開出去的時候\n　　聲音可大了呢！\n@c0@"
145:
  en: "@a%0%a002030@bSo it seems this rather rough-spoken gentleman desired to see the Providence.\n@c0@"
  ja: "@a@b%a002030「このかたは\n\t神の船を　見に来られて\n\tいたのですね？\n@c0@"
  ko: "@a@b%a002030: 이분은\n신의 배를 보러\n오신 거겠죠?\n@c0@"
  sl: "@a@b%a002030：这位先生是来看神之船的？\n@c0@"
  tl: "@a@b%a002030：這位先生是來看神之船的？\n@c0@"
146:
  en: "@a%0%a002030@bWell, I'm afraid it's a divine vessel, not some sort of tourist attraction!\n@c0@"
  ja: "@a@b%a002030「残念ながら\n\t神殿の中を　お見せすることは\n\tできなかったですからね。\n@c0@"
  ko: "@a@b%a002030: 안타깝게도\n신전 안을 보여 드릴 수는\n없었으니까요.\n@c0@"
  sl: "@a@b%a002030：真是遗憾，\n　　没能让你在神殿里\n　　看到它的样子。\n@c0@"
  tl: "@a@b%a002030：真是遺憾，\n　　沒能讓你在神殿裡\n　　看到它的樣子。\n@c0@"
147:
  en: "@a%0%a002000@bWell... I mean, we haven't fought him yet, so...\n@c0@"
  ja: "@a@b%a002000「いや…\n\tまだ　たたかってないし。\n@c0@"
  ko: "@a@b%a002000: 아니...\n아직 싸우지 않았어.\n@c0@"
  sl: "@a@b%a002000：啊……\n　　还没开始战斗呢。\n@c0@"
  tl: "@a@b%a002000：啊……\n　　還沒開始戰鬥呢。\n@c0@"
148:
  en: "@a%0%a002010@bNo picnic? The entire island is shrouded by an aura of evil. That would be some picnic...\n@c0@"
  ja: "@a@b%a002010「あの島から　感じる\n\t邪悪な気配は　そうとうなものね。\n@c0@"
  ko: "@a@b%a002010: 그 섬에서 느껴지는\n사악한 기운은 정말 엄청난 것 같아.\n@c0@"
  sl: "@a@b%a002010：我感觉到了，\n　　岛上传来强烈的邪恶气息。\n@c0@"
  tl: "@a@b%a002010：我感覺到了，\n　　島上傳來強烈的邪惡氣息。\n@c0@"
149:
  en: "@a%0%a002020@bThe Murdaw over in the dream world was pretty tough too, wasn't he?\n@c0@"
  ja: "@a@b%a002020「そういえば\n\t夢の世界の　ムドーも\n\tすっごく　強かったもんね。\n@c0@"
  ko: "@a@b%a002020: 그러고 보니\n꿈의 세계 무도도\n굉장히 강했잖아.\n@c0@"
  sl: "@a@b%a002020：说起来，\n　　梦世界的姆多也很强吧。\n@c0@"
  tl: "@a@b%a002020：說起來，\n　　夢世界的姆多也很強吧。\n@c0@"
150:
  en: "@a%0%a002030@bIt will take an exceptional effort to defeat Murdaw. We must rely on the infinite grace of the Goddess.\n@c0@"
  ja: "@a@b%a002030「ひとすじなわでは\n\tムドーを　倒すことは\n\tできないでしょうね。\n@c0@"
  ko: "@a@b%a002030: 평범한 방법으로는\n무도를 이길 수\n없겠어요.\n@c0@"
  sl: "@a@b%a002030：用普通的手段\n　　恐怕没法打倒姆多。\n@c0@"
  tl: "@a@b%a002030：用普通的手段\n　　恐怕沒法打倒姆多。\n@c0@"
151:
  en: "@a%0%a002000@bBah! Next time, we'll drop him for sure! Mark my words!\n@c0@"
  ja: "@a@b%a002000｢つ…　つぎは\n　　かならず　たおしてみせるぜ！\n@c0@"
  ko: "@a@b%a002000: 다, 다음에는\n반드시 때려눕히겠다!\n@c0@"
  sl: "@a@b%a002000：嗯……\n　　下次俺们一定会打倒姆多！\n@c0@"
  tl: "@a@b%a002000：嗯……\n　　下次俺們一定會打倒姆多！\n@c0@"
152:
  en: "@a%0%a002010@bNext time, we'll spare no effort in our fight against Murdaw.\n@c0@"
  ja: "@a@b%a002010「私たち　がんばるからね\n\tおばあちゃん。\n@c0@"
  ko: "@a@b%a002010: 우리 열심히 할게,\n할머니.\n@c0@"
  sl: "@a@b%a002010：老婆婆，\n　　我们会继续努力的。\n@c0@"
  tl: "@a@b%a002010：老婆婆，\n　　我們會繼續努力的。\n@c0@"
153:
  en: "@a%0%a002020@b......\n@c0@"
  ja: "@a@b%a002020「……。\n@c0@"
  ko: "@a@b%a002020: ......\n@c0@"
  sl: "@a@b%a002020：……\n@c0@"
  tl: "@a@b%a002020：……\n@c0@"
154:
  en: "@a%0%a002030@bNo matter how many times we suffer defeat, our spirits will not be vanquished!\n@c0@"
  ja: "@a@b%a002030「なんど　倒されようとも\n\tくじけは　しません！\n@c0@"
  ko: "@a@b%a002030: 몇 번을 쓰러져도\n저는 좌절하지 않겠습니다!\n@c0@"
  sl: "@a@b%a002030：无论被打倒多少次，\n　　我们都不会退缩！\n@c0@"
  tl: "@a@b%a002030：無論被打倒多少次，\n　　我們都不會退縮！\n@c0@"
155:
  en: "@a%0%a002000@bAye! It's time to take out Murdaw!\n@c0@"
  ja: "@a@b%a002000「よーし！\n\tそれじゃ　ムドーを\n\tぶっ倒しに　行くぜ！\n@c0@"
  ko: "@a@b%a002000: 좋아!\n그럼 무도를\n쓰러뜨리러 가자고!\n@c0@"
  sl: "@a@b%a002000：走啦！\n　　现在就去揍扁姆多！\n@c0@"
  tl: "@a@b%a002000：走啦！\n　　現在就去揍扁姆多！\n@c0@"
156:
  en: "@a%0%a002010@bI only hope the Elder will continue to pray for us.\n@c0@"
  ja: "@a@b%a002010「長老さま\n\t私たちを　見守っていて\n\tくださいね。\n@c0@"
  ko: "@a@b%a002010: 장로님,\n우리를 지켜봐\n주세요.\n@c0@"
  sl: "@a@b%a002010：长老，请您保佑我们。\n@c0@"
  tl: "@a@b%a002010：長老，請您保佑我們。\n@c0@"
157:
  en: "@a%0%a002020@bYes... I have my own role to fulfil...\n@c0@"
  ja: "@a@b%a002020「そう…\n\tあたしには　あたしの\n\t役目が　あるの……。\n@c0@"
  ko: "@a@b%a002020: 그래...\n내게는 나만의\n역할이 있어......\n@c0@"
  sl: "@a@b%a002020：没错……\n　　我也有我该做的……\n@c0@"
  tl: "@a@b%a002020：沒錯……\n　　我也有我該做的……\n@c0@"
158:
  en: "@a%0%a002030@bI will not let my grandfather down. I pledge that we will return victorious!\n@c0@"
  ja: "@a@b%a002030「おじいさま。\n\t私たち　がんばってまいります。\n@c0@"
  ko: "@a@b%a002030: 할아버님.\n우리 열심히 싸우고 돌아오겠습니다.\n@c0@"
  sl: "@a@b%a002030：爷爷，我们一定会努力的。\n@c0@"
  tl: "@a@b%a002030：爺爺，我們一定會努力的。\n@c0@"
159:
  en: "@a%0%a002000@bAye! It's time to take out Murdaw!\n@c0@"
  ja: "@a@b%a002000「よーし！\n\tそれじゃ　ムドーを\n\tぶっ倒しに　行くぜ！\n@c0@"
  ko: "@a@b%a002000: 좋아!\n그럼 무도를\n쓰러뜨리러 가자고!\n@c0@"
  sl: "@a@b%a002000：走啦！\n　　现在就去揍扁姆多！\n@c0@"
  tl: "@a@b%a002000：走啦！\n　　現在就去揍扁姆多！\n@c0@"
160:
  en: "@a%0%a002010@bI only hope the Elder will continue to pray for us.\n@c0@"
  ja: "@a@b%a002010「長老さま\n\t私たちを　見守っていて\n\tくださいね。\n@c0@"
  ko: "@a@b%a002010: 장로님,\n우리를 지켜봐\n주세요.\n@c0@"
  sl: "@a@b%a002010：长老，请您保佑我们。\n@c0@"
  tl: "@a@b%a002010：長老，請您保佑我們。\n@c0@"
161:
  en: "@a%0%a002020@bYes... I have my own role to fulfil...\n@c0@"
  ja: "@a@b%a002020「そう…\n\tあたしには　あたしの\n\t役目が　あるの……。\n@c0@"
  ko: "@a@b%a002020: 그래...\n내게는 나만의\n역할이 있어......\n@c0@"
  sl: "@a@b%a002020：没错……\n　　我也有我该做的……\n@c0@"
  tl: "@a@b%a002020：沒錯……\n　　我也有我該做的……\n@c0@"
162:
  en: "@a%0%a002030@bI will not let my grandfather down. I pledge that we will return victorious!\n@c0@"
  ja: "@a@b%a002030「おじいさま。\n\t私たち　がんばってまいります。\n@c0@"
  ko: "@a@b%a002030: 할아버님.\n우리 열심히 싸우고 돌아오겠습니다.\n@c0@"
  sl: "@a@b%a002030：爷爷，我们一定会努力的。\n@c0@"
  tl: "@a@b%a002030：爺爺，我們一定會努力的。\n@c0@"
163:
  en: "@a%0%a002000@bNothin' like the feel of the sea breeze in your mohawk, aye, %a000090?\n@c0@"
  ja: "@a@b%a002000「ありがたく\n\t使わせて　もらってるぜ！\n@c0@"
  ko: "@a@b%a002000: 감사히\n잘 쓸게!\n@c0@"
  sl: "@a@b%a002000：多谢你们肯借船给俺们用！\n@c0@"
  tl: "@a@b%a002000：多謝你們肯借船給俺們用！\n@c0@"
164:
  en: "@a%0%a002010@bThe Providence is the pride of the Ghentiles. Let's be sure to treat her with due reverence, %a000090.\n@c0@"
  ja: "@a@b%a002010「みなさんが　守ってきた\n\t神聖な　神の船。\n\t大切に　使わせてもらいますね。\n@c0@"
  ko: "@a@b%a002010: 여러분이 지켜온\n신성한 신의 배.\n소중히 사용할게요.\n@c0@"
  sl: "@a@b%a002010：这么宝贵的神之船，\n　　我们一定会小心使用的。\n@c0@"
  tl: "@a@b%a002010：這麼寶貴的神之船，\n　　我們一定會小心使用的。\n@c0@"
165:
  en: "@a%0%a002020@bShe's a real pleasure cruiser!\n@c0@"
  ja: "@a@b%a002020「乗りごこち　いいよ！\n@c0@"
  ko: "@a@b%a002020: 승선감이 참 좋아!\n@c0@"
  sl: "@a@b%a002020：乘上去真舒服！\n@c0@"
  tl: "@a@b%a002020：乘上去真舒服！\n@c0@"
166:
  en: "@a%0%a002030@bIt has been a while...\n@c0@"
  ja: "@a@b%a002030「船の番。\n\t長いあいだ　ごくろうさまでした。\n@c0@"
  ko: "@a@b%a002030: 배를 지키시느라\n오랫동안 수고하셨습니다.\n@c0@"
  sl: "@a@b%a002030：辛苦了。\n　　多谢你们一直保养这艘船。\n@c0@"
  tl: "@a@b%a002030：辛苦了。\n　　多謝你們一直保養這艘船。\n@c0@"
167:
  en: "@a%0%a002000@bI've never experienced such smooth sailing. I almost feel bad that we're the only passengers!\n@c0@"
  ja: "@a@b%a002000「船の調子は　サイコー！\n\tオレたちだけで　使うのは\n\tもったいないくらいだぜ。\n@c0@"
  ko: "@a@b%a002000: 배의 상태는 최고야!\n우리끼리만 쓰기에는\n아까울 정도로군.\n@c0@"
  sl: "@a@b%a002000：这船真不错！\n　　只给俺们用太浪费了。\n@c0@"
  tl: "@a@b%a002000：這船真不錯！\n　　只給俺們用太浪費了。\n@c0@"
168:
  en: "@a%0%a002010@bThe craftsmanship is magnificent. It's impossible to tell when the ship was made.\n@c0@"
  ja: "@a@b%a002010「いつの時代に\n\t作られた船か　わからないけど\n\tりっぱな　お手入れでしたね。\n@c0@"
  ko: "@a@b%a002010: 어느 시대에\n만들어진 배인지 모르겠지만\n참 관리를 잘해 왔네요.\n@c0@"
  sl: "@a@b%a002010：不知道这艘船\n　　是什么年代建造的，\n　　不过保养得真好。\n@c0@"
  tl: "@a@b%a002010：不知道這艘船\n　　是什麼年代建造的，\n　　不過保養得真好。\n@c0@"
169:
  en: "@a%0%a002020@bThis ship's so clean you could eat off its decks!\n@c0@"
  ja: "@a@b%a002020「本当に　ピカピカで\n\tチリひとつ　なかったよ！\n@c0@"
  ko: "@a@b%a002020: 정말 반짝반짝 윤이 나고\n티끌 하나 없어!\n@c0@"
  sl: "@a@b%a002020：看它全身亮闪闪的，\n　　连一点灰尘都没有！\n@c0@"
  tl: "@a@b%a002020：看它全身亮閃閃的，\n　　連一點灰塵都沒有！\n@c0@"
170:
  en: "@a%0%a002030@bThe Goddess will reward those who have tended to the sacred Providence.\n@c0@"
  ja: "@a@b%a002030「ありがとう。\n\t心から　感謝していますよ！\n@c0@"
  ko: "@a@b%a002030: 고맙습니다.\n진심으로 감사드립니다!\n@c0@"
  sl: "@a@b%a002030：辛苦了。\n　　衷心地感谢你们！\n@c0@"
  tl: "@a@b%a002030：辛苦了。\n　　衷心地感謝你們！\n@c0@"
171:
  en: "@a%0%a002000@bHuh? Have we got some kinda business with this old coot?\n@c0@"
  ja: "@a@b%a002000「あれ？\n\tまた　ここの　オヤジに\n\t何か用事でも　あるのか？\n@c0@"
  ko: "@a@b%a002000: 어?\n여기 영감한테\n뭔가 볼일이라도 있는 거냐?\n@c0@"
  sl: "@a@b%a002000：嗯？\n　　找这里的老爷子\n　　还有什么事吗？\n@c0@"
  tl: "@a@b%a002000：嗯？\n　　找這裡的老爺子\n　　還有什麼事嗎？\n@c0@"
172:
  en: "@a%0%a002010@bThe surrounding area is rather bleak, but this cottage is wonderfully homely.\n@c0@"
  ja: "@a@b%a002010「まわりには　何もないけど\n\tホント　いいところだわ。\n@c0@"
  ko: "@a@b%a002010: 주변에 아무것도 없지만\n정말 좋은 곳이네.\n@c0@"
  sl: "@a@b%a002010：周围什么都没有，\n　　不过这地方真不错。\n@c0@"
  tl: "@a@b%a002010：周圍什麼都沒有，\n　　不過這地方真不錯。\n@c0@"
173:
  en: "@a%0%a002020@bAww, this cottage is so cute!\n@c0@"
  ja: "@a@b%a002020「あたし\n\tここの　おうち　好きだな～。\n@c0@"
  ko: "@a@b%a002020: 난 말이야,\n이 집이 맘에 쏙 들어~\n@c0@"
  sl: "@a@b%a002020：人家喜欢这里的房子～\n@c0@"
  tl: "@a@b%a002020：人家喜歡這裡的房子～\n@c0@"
174:
  en: "@a%0%a002030@bI find this place greatly to my liking.\n@c0@"
  ja: "@a@b%a002030「なかなか\n\tすてきな　場所ですね。\n@c0@"
  ko: "@a@b%a002030: 무척이나\n멋진 곳이군요.\n@c0@"
  sl: "@a@b%a002030：这个环境相当不错。\n@c0@"
  tl: "@a@b%a002030：這個環境相當不錯。\n@c0@"
175:
  en: "@a%0%a002000@bWhat a slave-driver! He's still bossin' folks around, aye?\n@c0@"
  ja: "@a@b%a002000「あの　オヤジめ。\n\tどうやら　いつも\n\tいばってる　みたいだな。\n@c0@"
  ko: "@a@b%a002000: 그 영감.\n언제 봐도\n고집이 세단 말이지.\n@c0@"
  sl: "@a@b%a002000：可恶的老头子。\n　　总是爱逞威风。\n@c0@"
  tl: "@a@b%a002000：可惡的老頭子。\n　　總是愛逞威風。\n@c0@"
176:
  en: "@a%0%a002010@bThis certainly is a sturdy-looking hut.\n@c0@"
  ja: "@a@b%a002010「ここは　なかなか　\n\tりっぱな　小屋ね。\n@c0@"
  ko: "@a@b%a002010: 여기는 정말\n멋진 오두막이구나.\n@c0@"
  sl: "@a@b%a002010：这间房子真漂亮啊。\n@c0@"
  tl: "@a@b%a002010：這間房子真漂亮啊。\n@c0@"
177:
  en: "@a%0%a002020@bStacking wood, huh? Sounds like a career with a lot of room for growth. Ha ha! Get it? Wood? Growth? Ah, fun.\n@c0@"
  ja: "@a@b%a002020「こういう　タイプは\n\t出世しない　タイプだよね。\n@c0@"
