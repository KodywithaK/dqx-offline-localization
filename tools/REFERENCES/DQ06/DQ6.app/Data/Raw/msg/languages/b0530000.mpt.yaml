0:
  en: "@a%0%a002000@bSo this is Ghent, aye?\n@c0@"
  ja: "@a@b%a002000「おお～　ここが\n\tゲントの村か！\n@c0@"
  ko: "@a@b%a002000: 오오~ 여기가\n겐트 마을이군!\n@c0@"
  sl: "@a@b%a002000：哦哦～\n　　这里就是根特村！\n@c0@"
  tl: "@a@b%a002000：哦哦～\n　　這裡就是根特村！\n@c0@"
1:
  en: "@a%0%a002000@bLots of room to roam here... Hey, look at that big building at the other end!  \n@c0@"
  ja: "@a@b%a002000「けっこう　でけえ！\n\tおい　なんか奥に　すごそうな\n\tたてものが　見えるぞ！\n@c0@"
  ko: "@a@b%a002000: 생각보다 훨씬 크군!\n어이, 안쪽에 뭔가 굉장해 보이는\n건물이 보여!\n@c0@"
  sl: "@a@b%a002000：真够大的！\n　　看，最里面好像\n　　有个很雄伟的建筑物！\n@c0@"
  tl: "@a@b%a002000：真夠大的！\n　　看，最裡面好像\n　　有個很雄偉的建築物！\n@c0@"
2:
  en: "@a%0%a002010@bThe sacred village of Ghent... I can sense holiness pervading every nook and cranny of this place...\n@c0@"
  ja: "@a@b%a002010「神の使いの村　ゲント。\n\tさすがに　神聖な　雰囲気を\n\t感じさせるわね。\n@c0@"
  ko: "@a@b%a002010: 신의 사자의 마을, 겐트.\n역시 신성한 분위기가\n느껴져.\n@c0@"
  sl: "@a@b%a002010：神之使者的村子，根特。\n　　的确能感到神圣的氛围呢。\n@c0@"
  tl: "@a@b%a002010：神之使者的村子，根特。\n　　的確能感到神聖的氛圍呢。\n@c0@"
3:
  en: "@a%0%a002020@bWow! This place is pretty amazing. It doesn't have that small village feel at all.\n@c0@"
  ja: "@a@b%a002020「うわあ。\n\tすっごい　ところだね～。\n\t村って感じじゃないよ！\n@c0@"
  ko: "@a@b%a002020: 우와.\n대단한 곳이구나~\n마을이란 느낌이 안 들어!\n@c0@"
  sl: "@a@b%a002020：哇啊。\n　　这地方真漂亮～\n　　不像是个小山村！\n@c0@"
  tl: "@a@b%a002020：哇啊。\n　　這地方真漂亮～\n　　不像是個小山村！\n@c0@"
4:
  en: "@a%0%a002000@bThere's somethin' extra holy about this place, ya know? I can feel it in the back of my soul or somethin'.\n@c0@"
  ja: "@a@b%a002000「なんか　首のあたりが\n\tスースー　するっつうか……\n\t神聖なニオイが　するぜ。\n@c0@"
  ko: "@a@b%a002000: 왠지 목 언저리가\n으스스하달까......\n신성한 분위기가 나는군.\n@c0@"
  sl: "@a@b%a002000：脖子周围凉飕飕的……\n　　这就是神圣的感觉吧。\n@c0@"
  tl: "@a@b%a002000：脖子周圍涼颼颼的……\n　　這就是神聖的感覺吧。\n@c0@"
5:
  en: "@a%0%a002010@bThis village appears to attract all types of visitors.\n@c0@"
  ja: "@a@b%a002010「いろいろな　ところから\n\tおとずれている人たちも\n\tたくさん　いるみたいね。\n@c0@"
  ko: "@a@b%a002010: 곳곳에서\n찾아오는 사람들도\n많은 모양이야.\n@c0@"
  sl: "@a@b%a002010：有许多人从世界各地\n　　赶到这里来呢。\n@c0@"
  tl: "@a@b%a002010：有許多人從世界各地\n　　趕到這裡來呢。\n@c0@"
6:
  en: "@a%0%a002020@bThere's something different about these Ghentiles... You can see it in their faces.\n@c0@"
  ja: "@a@b%a002020「ゲントって\n\t住んでる　人たちの\n\t顔つきも　ちがうね。\n@c0@"
  ko: "@a@b%a002020: 겐트 사람들은\n얼굴 생김새도\n다르네.\n@c0@"
  sl: "@a@b%a002020：在根特村住着的人，\n　　长相跟别处的人不一样呢。\n@c0@"
  tl: "@a@b%a002020：在根特村住著的人，\n　　長相跟別處的人不一樣呢。\n@c0@"
7:
  en: "@a%0%a002020@bEverybody just looks so...smart!\n@c0@"
  ja: "@a@b%a002020「みーんな\n\tあたま　よさそうだよ。\n@c0@"
  ko: "@a@b%a002020: 하나 같이\n똑똑해 보여.\n@c0@"
  sl: "@a@b%a002020：而且大家都很聪明。\n@c0@"
  tl: "@a@b%a002020：而且大家都很聰明。\n@c0@"
8:
  en: "@a%0%a002030@bThe sacred village of Ghent is where I was fortunate enough to be born and raised.\n@c0@"
  ja: "@a@b%a002030「私は　ここで　生まれ\n\tここで　育ちました。\n@c0@"
  ko: "@a@b%a002030: 저는 여기서 나고\n자랐습니다.\n@c0@"
  sl: "@a@b%a002030：我就是在这里出生，\n　　这里成长的。\n@c0@"
  tl: "@a@b%a002030：我就是在這裡出生，\n　　這裡成長的。\n@c0@"
9:
  en: "@a%0%a002030@bGhent's rich history and deep spiritual traditions have taught me all I know — and I know a lot!\n@c0@"
  ja: "@a@b%a002030「ゲントの村は\n\t私の　親であり　先生なのです。\n@c0@"
  ko: "@a@b%a002030: 겐트 마을은\n저의 부모이자 스승이죠.\n@c0@"
  sl: "@a@b%a002030：根特村既养育了我，\n　　又教给我很多东西。\n@c0@"
  tl: "@a@b%a002030：根特村既養育了我，\n　　又教給我很多東西。\n@c0@"
10:
  en: "@a%0%a002000@bHardy har! So that's why gettin' here was such smooth sailing. Fate was pushin' us along!\n@c0@"
  ja: "@a@b%a002000「そっかあ。\n\t神のみちびきが　あったから\n\tあまり迷わず　これたんだな！\n@c0@"
  ko: "@a@b%a002000: 그렇군.\n신이 인도해 주신 덕분에\n많이 헤매지 않고 올 수 있었어!\n@c0@"
  sl: "@a@b%a002000：是啊。\n　　有了神的启示，\n　　就不会迷失方向了吧！\n@c0@"
  tl: "@a@b%a002000：是啊。\n　　有了神的啟示，\n　　就不會迷失方向了吧！\n@c0@"
11:
  en: "@a%0%a002010@bWhat a wonderful village!\n@c0@"
  ja: "@a@b%a002010「こんにちは。\n\tとても　すてきな　ところですね。\n@c0@"
  ko: "@a@b%a002010: 안녕하세요.\n아주 멋진 곳이네요.\n@c0@"
  sl: "@a@b%a002010：你好。\n　　这里真是个漂亮的地方。\n@c0@"
  tl: "@a@b%a002010：你好。\n　　這裡真是個漂亮的地方。\n@c0@"
12:
  en: "@a%0%a002020@bThe people here sure seem, uh, different, don't they?\n@c0@"
  ja: "@a@b%a002020「ゲントの　人たちって\n\tどこか　雰囲気も　ちがうね。\n@c0@"
  ko: "@a@b%a002020: 겐트 사람들은\n어딘가 분위기도 달라.\n@c0@"
  sl: "@a@b%a002020：根特村的人\n　　给人的感觉有点不一样呢。\n@c0@"
  tl: "@a@b%a002020：根特村的人\n　　給人的感覺有點不一樣呢。\n@c0@"
13:
  en: "@a%0%a002000@bWhoa. Ghent must be the best village around.\n@c0@"
  ja: "@a@b%a002000「ゲントって\n\tすごい　ところなんだな。\n@c0@"
  ko: "@a@b%a002000: 겐트는\n굉장한 곳이로군.\n@c0@"
  sl: "@a@b%a002000：根特村真是个了不起的地方。\n@c0@"
  tl: "@a@b%a002000：根特村真是個了不起的地方。\n@c0@"
14:
  en: "@a%0%a002000@bRemind me to come here if I ever get sick.\n@c0@"
  ja: "@a@b%a002000「オレも　病気になったら\n\tお世話になってみるか。\n@c0@"
  ko: "@a@b%a002000: 만약 나도 병에 걸린다면\n신세를 져볼까?\n@c0@"
  sl: "@a@b%a002000：俺以后要是生病了，\n　　也要来找他们治病。\n@c0@"
  tl: "@a@b%a002000：俺以後要是生病了，\n　　也要來找他們治病。\n@c0@"
15:
  en: "@a%0%a002010@bHmm, yes... I do seem to recall hearing about the healing powers of Ghent.\n@c0@"
  ja: "@a@b%a002010「そう　たしか\n\tゲントは　いやしの　チカラでも\n\tゆうめい　だったわね。\n@c0@"
  ko: "@a@b%a002010: 맞아, 분명히\n겐트는 치유의 힘으로도\n유명한 곳이었어.\n@c0@"
  sl: "@a@b%a002010：没错，\n　　根特村会出名，\n　　正是因为这里有治愈的力量。\n@c0@"
  tl: "@a@b%a002010：沒錯，\n　　根特村會出名，\n　　正是因為這裡有治癒的力量。\n@c0@"
16:
  en: "@a%0%a002020@bWonder if they could fix my memory here...\n@c0@"
  ja: "@a@b%a002020「あたしの　きおくも\n\tもどらないかなあ……。\n@c0@"
  ko: "@a@b%a002020: 내 기억도\n돌아오지 않으려나......\n@c0@"
  sl: "@a@b%a002020：我的失忆不知道能不能治好……\n@c0@"
  tl: "@a@b%a002020：我的失憶不知道能不能治好……\n@c0@"
17:
  en: "@a%0%a002000@bIf ya don't count a few cuts 'n' bruises, I'm as healthy as Peggy Sue!\n@c0@"
  ja: "@a@b%a002000「小さな　キズなら\n\t山ほど　あるけどな！\n@c0@"
  ko: "@a@b%a002000: 작은 상처라면\n셀 수 없을 만큼 많지만!\n@c0@"
  sl: "@a@b%a002000：要说小伤的话，\n　　俺有一堆！\n@c0@"
  tl: "@a@b%a002000：要說小傷的話，\n　　俺有一堆！\n@c0@"
18:
  en: "@a%0%a002010@bFortunately we all seem to be in one piece, don't we, %a000090?\n@c0@"
  ja: "@a@b%a002010「おかげさまで\n\t今は　みんな　けんこうだわ。\n@c0@"
  ko: "@a@b%a002010: 덕분에\n지금은 모두 건강해.\n@c0@"
  sl: "@a@b%a002010：托您的福，\n　　现在大家都很健康。\n@c0@"
  tl: "@a@b%a002010：托您的福，\n　　現在大家都很健康。\n@c0@"
19:
  en: "@a%0%a002020@bOh, we're right as rain!\n@c0@"
  ja: "@a@b%a002020「あたしたち\n\t元気　元気！\n@c0@"
  ko: "@a@b%a002020: 우린\n엄청 건강해!\n@c0@"
  sl: "@a@b%a002020：我们几个很健康！\n@c0@"
  tl: "@a@b%a002020：我們幾個很健康！\n@c0@"
20:
  en: "@a%0%a002000@bHmm... You think this Elder knows how to resurrect folks 'n' everything like that?\n@c0@"
  ja: "@a@b%a002000「へえ。　もしかして\n\tゲントの長老には　生きかえしの\n\tチカラも　あるのか？\n@c0@"
  ko: "@a@b%a002000: 호오. 혹시\n겐트 마을 장로에게는 사람을\n되살리는 힘도 있는 건가?\n@c0@"
  sl: "@a@b%a002000：哦？\n　　莫非根特族的长老\n　　可以让死人复活？\n@c0@"
  tl: "@a@b%a002000：哦？\n　　莫非根特族的長老\n　　可以讓死人復活？\n@c0@"
21:
  en: "@a%0%a002010@bI think we should go and meet this Elder.\n@c0@"
  ja: "@a@b%a002010「長老さまに\n\tお会いしてみましょう。\n@c0@"
  ko: "@a@b%a002010: 장로님을\n만나 보자.\n@c0@"
  sl: "@a@b%a002010：我们去面见长老吧。\n@c0@"
  tl: "@a@b%a002010：我們去面見長老吧。\n@c0@"
22:
  en: "@a%0%a002020@bSeems like they really respect their Elders around here!\n@c0@"
  ja: "@a@b%a002020「やっぱ　どこでも\n\t長老さまは　えらいんだよね！\n@c0@"
  ko: "@a@b%a002020: 역시 어딜 가나\n장로님은 훌륭한가 봐!\n@c0@"
  sl: "@a@b%a002020：看来所有的长老都很厉害呢！\n@c0@"
  tl: "@a@b%a002020：看來所有的長老都很厲害呢！\n@c0@"
23:
  en: "@a%0%a002000@bWho cares about sacredness? Let's find the Providence, %a000090!\n@c0@"
  ja: "@a@b%a002000「おまいりじゃなくて\n\t神の船を　さがしに\n\tきたんだけどな。\n@c0@"
  ko: "@a@b%a002000: 참배하러 \n온 게 아니라 신의 배를 \n찾으러 왔는데.\n@c0@"
  sl: "@a@b%a002000：俺们不是来朝拜的，\n　　俺们是来找神之船的。\n@c0@"
  tl: "@a@b%a002000：俺們不是來朝拜的，\n　　俺們是來找神之船的。\n@c0@"
24:
  en: "@a%0%a002010@bThat large shrine in the rear of the village must be where the pilgrims go.\n@c0@"
  ja: "@a@b%a002010「村の　奥のほうに\n\t大きな　神殿が　見えているけど\n\tあそこで　おまいりするのかしら。\n@c0@"
  ko: "@a@b%a002010: 마을 안쪽에\n큰 신전이 보이던데\n거기까지 참배하러 가는 걸까?\n@c0@"
  sl: "@a@b%a002010：村子尽头\n　　有个很大的神殿，\n　　我们去那里拜一下吧。\n@c0@"
  tl: "@a@b%a002010：村子盡頭\n　　有個很大的神殿，\n　　我們去那裡拜一下吧。\n@c0@"
25:
  en: "@a%0%a002020@bI won't complain if I pick up a little sacredness while we're here.\n@c0@"
  ja: "@a@b%a002020「おまいりも\n\tしていこうね！\n@c0@"
  ko: "@a@b%a002020: 우리도\n참배하러 가자!\n@c0@"
  sl: "@a@b%a002020：去朝拜吧！\n@c0@"
  tl: "@a@b%a002020：去朝拜吧！\n@c0@"
26:
  en: "@a%0%a002000@bWhoa. Those weapons must dish out holy heck!\n@c0@"
  ja: "@a@b%a002000「へえ。\n\tなんか　すごそうだな！\n@c0@"
  ko: "@a@b%a002000: 우와.\n왠지 대단해 보이는군!\n@c0@"
  sl: "@a@b%a002000：哦～\n　　听起来很厉害啊！\n@c0@"
  tl: "@a@b%a002000：哦～\n　　聽起來很厲害啊！\n@c0@"
27:
  en: "@a%0%a002000@bCouldn't hurt to stock up on a set or two...\n@c0@"
  ja: "@a@b%a002000「少し　ここで\n\tそうびを　そろえていくか！\n@c0@"
  ko: "@a@b%a002000: 여기서 잠깐\n장비를 갖추고 가자고!\n@c0@"
  sl: "@a@b%a002000：咱们在这里买点装备吧！\n@c0@"
  tl: "@a@b%a002000：咱們在這裡買點裝備吧！\n@c0@"
28:
  en: "@a%0%a002010@bWe'd have nothing to worry about. We always fight in the name of justice and rightitude.\n㈡\nIsn't that right, %a000090?\n@c0@"
  ja: "@a@b%a002010「私たちの　たたかいは\n\tせいぎの　たたかい。\n\tなにも　心配ないわね。\n@c0@"
  ko: "@a@b%a002010: 우리의 싸움은\n정의로운 싸움.\n아무 걱정 없어.\n@c0@"
  sl: "@a@b%a002010：我们的战斗\n　　是正义的战斗。\n　　请不必担心。\n@c0@"
  tl: "@a@b%a002010：我們的戰鬥\n　　是正義的戰鬥。\n　　請不必擔心。\n@c0@"
29:
  en: "@a%0%a002020@bI'd say wielding these arms against Murdaw is a just form of rightitude.\n@c0@"
  ja: "@a@b%a002020「天ばつは\n\tムドーに　くだるんだよね！\n@c0@"
  ko: "@a@b%a002020: 천벌은\n무도에게 떨어질 거야!\n@c0@"
  sl: "@a@b%a002020：惩罚还是留给姆多吧！\n@c0@"
  tl: "@a@b%a002020：懲罰還是留給姆多吧！\n@c0@"
30:
  en: "@a%0%a002000@bHuh. So even the Ghentiles have warriors, aye?\n@c0@"
  ja: "@a@b%a002000「へえ。\n\t神の使い　ゲント族にも\n\t戦士が　いるんだな。\n@c0@"
  ko: "@a@b%a002000: 우아.\n신의 사자 겐트족도\n전사가 있구나.\n@c0@"
  sl: "@a@b%a002000：哦～\n　　根特族身为神之使者，\n　　也有战士啊。\n@c0@"
  tl: "@a@b%a002000：哦～\n　　根特族身為神之使者，\n　　也有戰士啊。\n@c0@"
31:
  en: "@a%0%a002010@bAncient times... Holy warriors... This really is an awe-inspiring place.\n@c0@"
  ja: "@a@b%a002010「はるか　いにしえより\n\t神につかえる　ゲントの民。\n\tすてきだわ。\n@c0@"
  ko: "@a@b%a002010: 먼 옛날부터\n신을 섬기는 겐트 백성.\n너무 멋져.\n@c0@"
  sl: "@a@b%a002010：长久以来，\n　　根特子民一直侍奉着神灵。\n　　真了不起。\n@c0@"
  tl: "@a@b%a002010：長久以來，\n　　根特子民一直侍奉著神靈。\n　　真了不起。\n@c0@"
32:
  en: "@a%0%a002020@bWonder what these holy warriors are like. I bet they look super tough in their armour!\n@c0@"
  ja: "@a@b%a002020「ゲント族の　戦士って\n\tどんな人かなあ。\n\tきっと　かっこいい人だよね！\n@c0@"
  ko: "@a@b%a002020: 겐트족의 전사는\n어떤 사람일까?\n분명 멋진 사람일 거야!\n@c0@"
  sl: "@a@b%a002020：根特族的战士\n　　是什么样的人呢？\n　　一定是很帅气的人吧！\n@c0@"
  tl: "@a@b%a002020：根特族的戰士\n　　是什麼樣的人呢？\n　　一定是很帥氣的人吧！\n@c0@"
33:
  en: "@a%0%a002000@b...Why would we want to do that?\n@c0@"
  ja: "@a@b%a002000「そそうは　しないぜ！\n@c0@"
  ko: "@a@b%a002000: 결례 같은 건 범하지 않아!\n@c0@"
  sl: "@a@b%a002000：俺们不会乱来的！\n@c0@"
  tl: "@a@b%a002000：俺們不會亂來的！\n@c0@"
34:
  en: "@a%0%a002010@bSounds like an offer we can't refuse. Shall we go inside?\n@c0@"
  ja: "@a@b%a002010「お言葉に　あまえて\n\tおじゃましてみる？\n@c0@"
  ko: "@a@b%a002010: 사양 말고\n들어가 볼래?\n@c0@"
  sl: "@a@b%a002010：那我们就恭敬不如从命，\n　　去叨扰一下吧？\n@c0@"
  tl: "@a@b%a002010：那我們就恭敬不如從命，\n　　去叨擾一下吧？\n@c0@"
35:
  en: "@a%0%a002020@bWe can go in? Really? Wow, the Ghentiles sure are nice!\n@c0@"
  ja: "@a@b%a002020「わーい！\n\t中に　入っても　いいって！\n\tゲントの人って　やさしいね。\n@c0@"
  ko: "@a@b%a002020: 와아!\n안에 들어가도 된대!\n겐트 마을 사람들은 친절하구나.\n@c0@"
  sl: "@a@b%a002020：万岁！\n　　让咱们进喽！\n　　根特族的人真和气。\n@c0@"
  tl: "@a@b%a002020：萬歲！\n　　讓咱們進嘍！\n　　根特族的人真和氣。\n@c0@"
36:
  en: "@a%0%a002000@bHe's got the blood of the Elder, aye? Must be one tough kid.\n@c0@"
  ja: "@a@b%a002000「長老の　血をひく者か。\n\tすごそうな　感じがするよな。\n@c0@"
  ko: "@a@b%a002000: 장로의 피를 이어받은 자?\n왠지 대단할 것 같군.\n@c0@"
  sl: "@a@b%a002000：长老的后代啊。\n　　听起来很厉害。\n@c0@"
  tl: "@a@b%a002000：長老的後代啊。\n　　聽起來很厲害。\n@c0@"
37:
  en: "@a%0%a002010@bI wonder what this ‘holiness’ means in practical terms...\n@c0@"
  ja: "@a@b%a002010「どんな　チカラを\n\t持ったかたなのかしらね。\n@c0@"
  ko: "@a@b%a002010: 어떤 힘을\n가진 분일까?\n@c0@"
  sl: "@a@b%a002010：不知道他有什么样的力量。\n@c0@"
  tl: "@a@b%a002010：不知道他有什麼樣的力量。\n@c0@"
38:
  en: "@a%0%a002020@b%0%a002030, huh? That's an...interesting name.\n@c0@"
  ja: "@a@b%a002020「%a002030だって。\n\tかわった名前だねー。\n@c0@"
  ko: "@a@b%a002020: %a002030%F2030%X래%Y이래%Z.\n별난 이름이네.\n@c0@"
  sl: "@a@b%a002020：他叫%a002030耶。\n　　好奇怪的名字。\n@c0@"
  tl: "@a@b%a002020：他叫%a002030耶。\n　　好奇怪的名字。\n@c0@"
39:
  en: "@a%0%a002000@bA staff like that's bound to be handy on the battlefield.\n@c0@"
  ja: "@a@b%a002000「ゲントのつえかあ。\n\tそういう物が　あれば\n\t安心して　たたかえるよな。\n@c0@"
  ko: "@a@b%a002000: 겐트의 지팡이?\n그런 게 있으면 안심하고\n싸울 수 있겠군.\n@c0@"
  sl: "@a@b%a002000：根特之杖啊。\n　　要是有了这个东西，\n　　就能放心战斗了。\n@c0@"
  tl: "@a@b%a002000：根特之杖啊。\n　　要是有了這個東西，\n　　就能放心戰鬥了。\n@c0@"
40:
  en: "@a%0%a002010@bSurely the staff of Ghent must be imbued with the power of the Goddess.\n@c0@"
  ja: "@a@b%a002010「ゲントのつえには\n\tきっと　神のちからが\n\tこめられているんだわ。\n@c0@"
  ko: "@a@b%a002010: 겐트의 지팡이에는\n분명 신의 힘이\n깃들어 있을 거야.\n@c0@"
  sl: "@a@b%a002010：根特之杖里\n　　一定有神的力量。\n@c0@"
  tl: "@a@b%a002010：根特之杖裡\n　　一定有神的力量。\n@c0@"
41:
  en: "@a%0%a002020@bHey, do they sell those anywhere around here? Like, as souvenirs or something?\n@c0@"
  ja: "@a@b%a002020「ゲントのつえって\n\tどこかで　おみやげみたいに\n\t売っているのかなあ。\n@c0@"
  ko: "@a@b%a002020: 겐트의 지팡이는\n상점 같은 데서 선물처럼\n팔고 있나?\n@c0@"
  sl: "@a@b%a002020：根特之杖啊，\n　　不知道能不能买来当纪念品。\n@c0@"
  tl: "@a@b%a002020：根特之杖啊，\n　　不知道能不能買來當紀念品。\n@c0@"
42:
  en: "@a%0%a002000@bAvast! We're really not gettin' in!? \n@c0@"
  ja: "@a@b%a002000「なんだ　チェッ！\n\t入れてくれないのかよ。\n@c0@"
  ko: "@a@b%a002000: 뭐야, 쳇!\n못 들어가게 하다니.\n@c0@"
  sl: "@a@b%a002000：嘁，真小气！\n　　让俺们进去又能怎么样。\n@c0@"
  tl: "@a@b%a002000：嘁，真小氣！\n　　讓俺們進去又能怎麼樣。\n@c0@"
43:
  en: "@a%0%a002010@bSo the Providence is enshrined in there...\n@c0@"
  ja: "@a@b%a002010「神の船は\n\tこの中に　まつられているのね。\n@c0@"
  ko: "@a@b%a002010: 신의 배는\n이 안에 모셔져 있을 거야.\n@c0@"
  sl: "@a@b%a002010：神之船就供奉在里面吧。\n@c0@"
  tl: "@a@b%a002010：神之船就供奉在裡面吧。\n@c0@"
44:
  en: "@a%0%a002020@bJust when I was starting to think everyone around here was super nice...\n@c0@"
  ja: "@a@b%a002020「ここには\n\tおまいり　できないのかなあ。\n@c0@"
  ko: "@a@b%a002020: 여기는\n참배 못 하나?\n@c0@"
  sl: "@a@b%a002020：这里不让随便拜啊。\n@c0@"
  tl: "@a@b%a002020：這裡不讓隨便拜啊。\n@c0@"
45:
  en: "@a%0%a002000@bMust be quite a ship if folks are comin' from all over to see it!\n@c0@"
  ja: "@a@b%a002000「おおっ！　わざわざ\n\t見にくるヤツも　いるってことは\n\tこりゃ　かなりの船だぞ！\n@c0@"
  ko: "@a@b%a002000: 오호! 일부러\n구경하러 오는 사람도 있는 걸 보면\n이건 대단한 배야!\n@c0@"
  sl: "@a@b%a002000：哦哦！\n　　竟然有人特意跑过来看，\n　　看来这艘船很出名啊！\n@c0@"
  tl: "@a@b%a002000：哦哦！\n　　竟然有人特意跑過來看，\n　　看來這艘船很出名啊！\n@c0@"
46:
  en: "@a%0%a002010@bSeems like proof positive that the Ghentiles are intent on protecting their ship.\n@c0@"
  ja: "@a@b%a002010「それだけ　ゲントの民が\n\tたいせつに　守っている\n\tしょうこなのよ。\n@c0@"
  ko: "@a@b%a002010: 그만큼 겐트의 백성이\n소중하게 지킨다는\n증거겠지.\n@c0@"
  sl: "@a@b%a002010：看来根特族人\n　　对这艘船视如珍宝啊。\n@c0@"
  tl: "@a@b%a002010：看來根特族人\n　　對這艘船視如珍寶啊。\n@c0@"
47:
  en: "@a%0%a002020@bThe guy's got a point. What could one little peek hurt?\n@c0@"
  ja: "@a@b%a002020「ちょっとくらい　見ても\n\tへらないのにね！\n@c0@"
  ko: "@a@b%a002020: 잠깐 구경한다고\n닳는 것도 아니고!\n@c0@"
  sl: "@a@b%a002020：就让我们看一下嘛，\n　　又不会少块木头！\n@c0@"
  tl: "@a@b%a002020：就讓我們看一下嘛，\n　　又不會少塊木頭！\n@c0@"
48:
  en: "@a%0%a002000@bA ‘divine steed’, aye? We've got one of those. I'd put Peggy Sue up against this fella any day.\n@c0@"
  ja: "@a@b%a002000「天馬かあ。\n\tファルシオンと　どっちが\n\tすごいかな。\n@c0@"
  ko: "@a@b%a002000: 천마라.\n팔시온이랑 어느 쪽이\n대단할까?\n@c0@"
  sl: "@a@b%a002000：天马啊……\n　　和法尔西昂比，\n　　不知道哪个比较厉害。\n@c0@"
  tl: "@a@b%a002000：天馬啊……\n　　和法爾西昂比，\n　　不知道哪個比較厲害。\n@c0@"
49:
  en: "@a%0%a002010@bCan you imagine if Peggy Sue descended from the heavens? She's so pretty — sometimes I wonder!\n@c0@"
  ja: "@a@b%a002010「ファルシオンが\n\tもし　天馬の子孫だったら\n\tすごいことね。\n@c0@"
  ko: "@a@b%a002010: 팔시온이\n만약 천마의 후손이라면\n굉장한 일이야.\n@c0@"
  sl: "@a@b%a002010：如果法尔西昂\n　　是天马的后代，\n　　那就太了不得了。\n@c0@"
  tl: "@a@b%a002010：如果法爾西昂\n　　是天馬的後代，\n　　那就太了不得了。\n@c0@"
50:
  en: "@a%0%a002020@bI'll bet Peggy Sue has some neighs to say on this issue...\n@c0@"
  ja: "@a@b%a002020「ねえねえ\n\tファルシオンに　聞いてみようか！\n@c0@"
  ko: "@a@b%a002020: 있잖아,\n팔시온한테 물어보자!\n@c0@"
  sl: "@a@b%a002020：喂喂，\n　　问问法尔西昂吧！\n@c0@"
  tl: "@a@b%a002020：喂喂，\n　　問問法爾西昂吧！\n@c0@"
51:
  en: "@a%0%a002000@bWhoa. This horse is a fiery one, aye?\n@c0@"
  ja: "@a@b%a002000「こいつも　なかなか\n\t元気そうな　馬だな。\n@c0@"
  ko: "@a@b%a002000: 이 녀석도 꽤나\n건장한 말이군.\n@c0@"
  sl: "@a@b%a002000：这匹马很活泼啊。\n@c0@"
  tl: "@a@b%a002000：這匹馬很活潑啊。\n@c0@"
52:
  en: "@a%0%a002010@bWhat a beautiful steed!\n@c0@"
  ja: "@a@b%a002010「お馬さん　こんにちは！\n@c0@"
  ko: "@a@b%a002010: 말 아저씨~ 안녕!\n@c0@"
  sl: "@a@b%a002010：马先生，你好啊！\n@c0@"
  tl: "@a@b%a002010：馬先生，你好啊！\n@c0@"
53:
  en: "@a%0%a002020@bOh, yuck! He got some spittle on me!\n@c0@"
  ja: "@a@b%a002020「あーん！\n\tいま　ヨダレが　飛んできたー！\n@c0@"
  ko: "@a@b%a002020: 아잉~!\n방금 이쪽으로 침이 튀었어!\n@c0@"
  sl: "@a@b%a002020：啊啊！\n　　刚才它的口水飞出来了！\n@c0@"
  tl: "@a@b%a002020：啊啊！\n　　剛才它的口水飛出來了！\n@c0@"
54:
  en: "@a%0%a002000@bOh, so the Elder called on the King while he was sleepin'?\n@c0@"
  ja: "@a@b%a002000「そうか。\n\t王が　ねむっているあいだにも\n\t長老は　来てくれていたんだな。\n@c0@"
  ko: "@a@b%a002000: 그렇군.\n왕이 잠든 동안에도\n장로는 와 줬었군.\n@c0@"
  sl: "@a@b%a002000：哦哦……\n　　国王沉睡的时候，\n　　长老曾经给他治疗过啊。\n@c0@"
  tl: "@a@b%a002000：哦哦……\n　　國王沉睡的時候，\n　　長老曾經給他治療過啊。\n@c0@"
55:
  en: "@a%0%a002010@bKing Somnus wasn't actually sick to begin with, so perhaps they were just praying for the wrong thing.\n@c0@"
  ja: "@a@b%a002010「なおせなくても\n\tしかたないわね。\n\tあれは　病気じゃなかったし。\n@c0@"
  ko: "@a@b%a002010: 누구라도\n고칠 수 없었겠지.\n그건 병도 아니었으니.\n@c0@"
  sl: "@a@b%a002010：治不好也很正常。\n　　因为那不是疾病。\n@c0@"
  tl: "@a@b%a002010：治不好也很正常。\n　　因為那不是疾病。\n@c0@"
56:
  en: "@a%0%a002020@bSounds to me like their prayers were answered!\n@c0@"
  ja: "@a@b%a002020「祈りが　つうじて\n\tのろいが　とけたんだよ！\n@c0@"
  ko: "@a@b%a002020: 기도가 통해서\n저주가 풀렸어!\n@c0@"
  sl: "@a@b%a002020：通过祈祷解除诅咒！\n@c0@"
  tl: "@a@b%a002020：通過祈禱解除詛咒！\n@c0@"
57:
  en: "@a%0%a002000@bFolks are pretty nice around here, aye, %a000090? All humble 'n' everything like that.\n@c0@"
  ja: "@a@b%a002000「みんな　そぼくで\n\tいい人たちじゃないか。\n\tなあ　%a000090。\n@c0@"
  ko: "@a@b%a002000: 다들 소박하고\n좋은 사람들이군.\n안 그래 %a000090?\n@c0@"
  sl: "@a@b%a002000：大家都是单纯的好人啊，\n　　对吧%a000090。\n@c0@"
  tl: "@a@b%a002000：大家都是單純的好人啊，\n　　對吧%a000090。\n@c0@"
58:
  en: "@a%0%a002010@bIt's nice to see people who understand the importance of humility and gratitude.\n@c0@"
  ja: "@a@b%a002010「いつでも　感謝の気持ちは\n\tたいせつよね。\n@c0@"
  ko: "@a@b%a002010: 감사하는 마음은\n언제나 소중한 거야.\n@c0@"
  sl: "@a@b%a002010：保持一颗感恩的心很重要。\n@c0@"
  tl: "@a@b%a002010：保持一顆感恩的心很重要。\n@c0@"
