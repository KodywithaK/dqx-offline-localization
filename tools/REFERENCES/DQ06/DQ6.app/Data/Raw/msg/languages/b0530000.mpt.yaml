  en: "@a%0%a002010@bYes, that's a cow alright...\n@c0@"
  ja: "@a@b%a002010「ウシさん　こんにちは！\n@c0@"
  ko: "@a@b%a002010: 소야, 안녕!\n@c0@"
  sl: "@a@b%a002010：牛先生，你好！\n@c0@"
  tl: "@a@b%a002010：牛先生，你好！\n@c0@"
