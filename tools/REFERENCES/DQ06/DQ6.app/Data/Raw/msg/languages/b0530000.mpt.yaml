  sl: "@a@b%a002010：没关系的%a002020。\n　　我能理解你。\n@c0@"
  tl: "@a@b%a002010：沒關係的%a002020。\n　　我能理解你。\n@c0@"
119:
  en: "@a%0%a002030@bI confess, understanding the eternal mysteries of women is something I've never excelled at...\n@c0@"
