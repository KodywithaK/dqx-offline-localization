  sl: "@a@b%a002000：%a002020你不用担心。\n　　虽然你不在，\n　　但俺们会加倍努力的！\n@c0@"
  tl: "@a@b%a002000：%a002020你不用擔心。\n　　雖然你不在，\n　　但俺們會加倍努力的！\n@c0@"
121:
