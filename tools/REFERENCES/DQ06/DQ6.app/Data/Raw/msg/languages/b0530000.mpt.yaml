  ko: "@a@b%a002020: 아악!\n침이 질질 흘러.\n@c0@"
  sl: "@a@b%a002020：哇啊！\n　　好多口水啊。\n@c0@"
  tl: "@a@b%a002020：哇啊！\n　　好多口水啊。\n@c0@"
