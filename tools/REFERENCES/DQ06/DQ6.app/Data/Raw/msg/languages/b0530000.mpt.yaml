  tl: "@a@b%a002020：人家也想一邊吃飯\n　　一邊感謝神明！\n@c0@"
60:
  en: "@a%0%a002000@bCrikey. She treats those cows better than she treats her husband...\n@c0@"
  ja: "@a@b%a002000「うは。\n\tウシと　ていしゅは\n\t同じ　あつかいかよ。\n@c0@"
  ko: "@a@b%a002000: 우와.\n소와 남편을\n똑같이 취급하고 있어.\n@c0@"
  sl: "@a@b%a002000：哈哈。\n　　牛跟老公被平等对待了。\n@c0@"
  tl: "@a@b%a002000：哈哈。\n　　牛跟老公被平等對待了。\n@c0@"
61:
  en: "@a%0%a002010@bI sense that even this moaner is pure of heart. Maybe she just has some difficulty showing it...\n@c0@"
  ja: "@a@b%a002010「クチの　悪い人には\n\t心の　やさしい人が　多いのよ。\n\tきっとね……。\n@c0@"
  ko: "@a@b%a002010: 입이 험한 \n사람 중에는 착한 사람이 많아.\n틀림없어......\n@c0@"
  sl: "@a@b%a002010：世界上有很多人\n　　刀子嘴豆腐心呢。\n　　她也一定……\n@c0@"
  tl: "@a@b%a002010：世界上有很多人\n　　刀子嘴豆腐心呢。\n　　她也一定……\n@c0@"
62:
  en: "@a%0%a002020@bWow. I wonder if she makes her husband sleep in the pasture at night too?\n@c0@"
  ja: "@a@b%a002020「ここの　おじちゃんが\n\t食べてるのも　エサなんだ……。\n@c0@"
  ko: "@a@b%a002020: 이곳 아저씨가\n먹고 있는 것도 먹이구나......\n@c0@"
  sl: "@a@b%a002020：这位大叔吃的\n　　不会也是饲料吧……\n@c0@"
  tl: "@a@b%a002020：這位大叔吃的\n　　不會也是飼料吧……\n@c0@"
63:
  en: "@a%0%a002000@bAm I the only one with a sudden craving for meat?\n@c0@"
  ja: "@a@b%a002000「どの　ウシも\n\t手入れが　行きとどいていて\n\tけんこうそうだな。\n@c0@"
  ko: "@a@b%a002000: 모든 소가\n관리가 잘 되어있어서\n건강한 것 같네.\n@c0@"
  sl: "@a@b%a002000：这些牛都被照顾得很健康。\n@c0@"
  tl: "@a@b%a002000：這些牛都被照顧得很健康。\n@c0@"
