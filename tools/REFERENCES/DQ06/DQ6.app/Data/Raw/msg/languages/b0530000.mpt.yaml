  sl: "@a@b%a002000：咱们走吧！\n@c0@"
  tl: "@a@b%a002000：咱們走吧！\n@c0@"
129:
  en: "@a%0%a002010@bWe'll be back soon!\n@c0@"
  ja: "@a@b%a002010「行ってきますね。\n@c0@"
