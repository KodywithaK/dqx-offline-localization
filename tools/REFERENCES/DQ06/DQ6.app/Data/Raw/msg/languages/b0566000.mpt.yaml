  sl: "@a@b%a002060：庄稼……啊……\n　　爱情的……花儿……开……\n　　我记住了……一点……\n@c0@"
  tl: "@a@b%a002060：莊稼……啊……\n　　愛情的……花兒……開……\n　　我記住了……一點……\n@c0@"
212:
  en: "@a%0%a002070@bBoing! (jiggle)\n@c0@"
  ja: "@a@b%a002070「プルプルーッ！\n@c0@"
  ko: "@a@b%a002070: 뽀용뽀요용~!\n@c0@"
  sl: "@a@b%a002070：噗噜噗噜！\n@c0@"
  tl: "@a@b%a002070：噗嚕噗嚕！\n@c0@"
213:
  en: "@a%0%a002000@bSister Grinn? Is she a nun or somethin'?\n@c0@"
  ja: "@a@b%a002000「マザー・ヘレンって\n\tシスターなのかな？\n@c0@"
