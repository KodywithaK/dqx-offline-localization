  sl: "@a@b%a002000：哦哦。\n　　燃起斗志来了啊。\n@c0@"
  tl: "@a@b%a002000：哦哦。\n　　燃起鬥志來了啊。\n@c0@"
190:
  en: "@a%0%a002010@bHe's a good guard dog, but we're not intruders.\n@c0@"
  ja: "@a@b%a002010「大丈夫よ　ワンちゃん。\n\t私たち　なにも　しないから。\n@c0@"
