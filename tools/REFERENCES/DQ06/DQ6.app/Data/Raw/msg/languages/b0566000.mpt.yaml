  ja: "@a@b%a002040「こいつなりに　必死だな。\n@c0@"
  ko: "@a@b%a002040: 나름대로 필사적이군.\n@c0@"
  sl: "@a@b%a002040：这家伙还真拼命啊。\n@c0@"
  tl: "@a@b%a002040：這傢伙還真拼命啊。\n@c0@"
195:
  en: "@a%0%a002060@b(slobber) %0%a002060 not like dogs... (snarl)\n@c0@"
  ja: "@a@b%a002060「ウウー…ギルルルー！！\n@c0@"
  ko: "@a@b%a002060: 우우...캬르르르!!\n@c0@"
  sl: "@a@b%a002060：呜呜……嗷嗷嗷！！\n@c0@"
  tl: "@a@b%a002060：嗚嗚……嗷嗷嗷！！\n@c0@"
196:
  en: "@a%0%a002070@b(slurp)\n@c0@"
  ja: "@a@b%a002070「プルルルルーッ！\n@c0@"
  ko: "@a@b%a002070: 뽀요요요요용~!\n@c0@"
  sl: "@a@b%a002070：噗噜噜噜！\n@c0@"
  tl: "@a@b%a002070：噗嚕嚕嚕！\n@c0@"
197:
  en: "@a%0%a002000@bThat cat's as laid-back as this town.\n@c0@"
  ja: "@a@b%a002000「イヌと　ちがって\n\tネコは　のんびりしてるな。\n@c0@"
  ko: "@a@b%a002000: 개와는 달리\n고양이는 여유로운걸.\n@c0@"
  sl: "@a@b%a002000：猫跟狗不一样，\n　　倒是很悠闲呢。\n@c0@"
  tl: "@a@b%a002000：貓跟狗不一樣，\n　　倒是很悠閒呢。\n@c0@"
198:
  en: "@a%0%a002010@bThat kitty is so at ease with strangers.\n@c0@"
  ja: "@a@b%a002010「人見知りしない\n\tいいコだわね。\n@c0@"
  ko: "@a@b%a002010: 낯을 가리지 않는\n착한 고양이네.\n@c0@"
  sl: "@a@b%a002010：这小猫真乖，\n　　不怕生呢。\n@c0@"
  tl: "@a@b%a002010：這小貓真乖，\n　　不怕生呢。\n@c0@"
199:
  en: "@a%0%a002020@bWhat do you think they feed that cat, way up here in the mountains?\n@c0@"
  ja: "@a@b%a002020「山おくの　ネコって\n\tなに食べているんだろうね。\n@c0@"
  ko: "@a@b%a002020: 산골 고양이는\n뭘 먹고 살까?\n@c0@"
  sl: "@a@b%a002020：这么深的大山里，\n　　猫都吃些什么啊？\n@c0@"
  tl: "@a@b%a002020：這麼深的大山裡，\n　　貓都吃些什麼啊？\n@c0@"
200:
  en: "@a%0%a002030@bAhh, what a delightful little cat! Here, kitty, kitty!\n@c0@"
  ja: "@a@b%a002030「なかなか　あいきょうのある\n\t顔をしてますね。\n@c0@"
  ko: "@a@b%a002030: 상당히 애교스러운\n얼굴이네요.\n@c0@"
  sl: "@a@b%a002030：长得真可爱啊。\n@c0@"
  tl: "@a@b%a002030：長得真可愛啊。\n@c0@"
201:
  en: "@a%0%a002050@bOld %a002050 once tugged a cat's tail and got scratched on the nose. You can still see the scar!\n@c0@"
  ja: "@a@b%a002050「子供のころ　ネコの　シッポを\n\t引っぱって　ひっかかれた　キズが\n\t今も　のこってますねー。\n@c0@"
  ko: "@a@b%a002050: 어릴 때 고양이 꼬리를\n잡아당겨서 고양이가 할퀸 자국이\n아직도 남아 있죠~\n@c0@"
  sl: "@a@b%a002050：小时候扯猫尾巴\n　　被猫抓伤了，\n　　那伤痕现在还在呢。\n@c0@"
  tl: "@a@b%a002050：小時候扯貓尾巴\n　　被貓抓傷了，\n　　那傷痕現在還在呢。\n@c0@"
202:
  en: "@a%0%a002040@bI don't mind animals. Most of them, anyway...\n@c0@"
