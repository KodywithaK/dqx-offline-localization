  sl: "@a@b%a002030：为了不让敌人靠近，\n　　而在威慑敌人吧。\n@c0@"
  tl: "@a@b%a002030：為了不讓敵人靠近，\n　　而在威懾敵人吧。\n@c0@"
193:
  en: "@a%0%a002050@bArf! Arf! Grrrrrr... ...Good boy!\n@c0@"
