  ko: "@a@b%a002020: 헬렌 씨는\n어떤 사람일까?\n만나 보고 싶어!\n@c0@"
  sl: "@a@b%a002020：好想看一看\n　　海伦到底是个\n　　怎样的人啊！\n@c0@"
  tl: "@a@b%a002020：好想看一看\n　　海倫到底是個\n　　怎樣的人啊！\n@c0@"
216:
