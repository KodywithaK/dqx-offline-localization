  ko: "@a@b%a002060: 소......\n평온해...보이는...얼굴이다.\n@c0@"
  sl: "@a@b%a002060：这牛……\n　　表情……安祥。\n@c0@"
  tl: "@a@b%a002060：這牛……\n　　表情……安祥。\n@c0@"
188:
  en: "@a%0%a002070@b(slurrrp)\n@c0@"
  ja: "@a@b%a002070「プルプルン！\n@c0@"
  ko: "@a@b%a002070: 뽀용뽀요용!\n@c0@"
  sl: "@a@b%a002070：噗噜噗噜！\n@c0@"
  tl: "@a@b%a002070：噗嚕噗嚕！\n@c0@"
189:
  en: "@a%0%a002000@bThat mutt's got some fight in him, aye?\n@c0@"
  ja: "@a@b%a002000「おお　おお。\n\t闘志　まる出しだな。\n@c0@"
