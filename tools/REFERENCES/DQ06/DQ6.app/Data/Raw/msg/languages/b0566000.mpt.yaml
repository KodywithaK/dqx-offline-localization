184:
  en: "@a%0%a002030@bIt appears that they work their animals here rather hard...\n@c0@"
  ja: "@a@b%a002030「この　ウシさんは\n\tはたらきもの　のようですね。\n@c0@"
  ko: "@a@b%a002030: 이 소는\n일을 잘하나 보군요.\n@c0@"
  sl: "@a@b%a002030：这头牛好像\n　　挺能干活的呢。\n@c0@"
