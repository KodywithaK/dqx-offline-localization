  ko: "@a@b%a002040: 나도 동물은\n싫지 않다.\n@c0@"
  sl: "@a@b%a002040：我也不讨厌动物。\n@c0@"
  tl: "@a@b%a002040：我也不討厭動物。\n@c0@"
203:
  en: "@a%0%a002060@b(snarl) Cat... No worry... %0%a002060 friend... (spit)\n@c0@"
  ja: "@a@b%a002060「よし…よし……。\n\t私を…　こわがらない……\n\tいいこだ……。\n@c0@"
  ko: "@a@b%a002060: 그래...그래......\n나를...무서워하지 않는다......\n착한 고양이다......\n@c0@"
  sl: "@a@b%a002060：乖……乖……\n　　别怕我……真乖……\n@c0@"
  tl: "@a@b%a002060：乖……乖……\n　　別怕我……真乖……\n@c0@"
204:
  en: "@a%0%a002070@bBoing! Boing!\n@c0@"
  ja: "@a@b%a002070「プル　プル。\n@c0@"
  ko: "@a@b%a002070: 뽀용 뽀용.\n@c0@"
  sl: "@a@b%a002070：噗噜～噗噜。\n@c0@"
  tl: "@a@b%a002070：噗嚕～噗嚕。\n@c0@"
205:
  en: "@a%0%a002000@b(yawn) ...Oh, what'd he say? This place is puttin' me to sleep...\n@c0@"
  ja: "@a@b%a002000「どっちかっていうと\n\t……オンチだな。\n@c0@"
