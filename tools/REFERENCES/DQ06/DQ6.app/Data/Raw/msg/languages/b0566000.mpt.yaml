  tl: "@a@b%a002050：到底是誰啊！\n@c0@"
147:
  en: "@a%0%a002070@bBoing? Boing?\n@c0@"
  ja: "@a@b%a002070「プープ　プループ！\n@c0@"
  ko: "@a@b%a002070: 뿌뿌~ 뽀르르!\n@c0@"
  sl: "@a@b%a002070：噗噗～噗噜噗！\n@c0@"
  tl: "@a@b%a002070：噗噗～噗嚕噗！\n@c0@"
148:
