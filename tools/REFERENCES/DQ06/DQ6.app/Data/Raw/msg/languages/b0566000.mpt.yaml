219:
  en: "@a%0%a002060@b(snarl) Here no priest... Only Sister Grinn... (slobber)\n@c0@"
  ja: "@a@b%a002060「ここ…神父…いない……。\n\tマザー…ヘレン…いる。\n@c0@"
  ko: "@a@b%a002060: 여기...신부...없다.....\n마더...헬렌...있다.\n@c0@"
  sl: "@a@b%a002060：这里……没有……神父……\n　　有……海伦……嬷嬷。\n@c0@"
  tl: "@a@b%a002060：這裡……沒有……神父……\n　　有……海倫……嬤嬤。\n@c0@"
220:
  en: "@a%0%a002070@b(slurp) Boing.\n@c0@"
  ja: "@a@b%a002070「プルー　プルン。\n@c0@"
  ko: "@a@b%a002070: 뽀용~ 뽀요용.\n@c0@"
  sl: "@a@b%a002070：噗噜～噗噜。\n@c0@"
  tl: "@a@b%a002070：噗嚕～噗嚕。\n@c0@"
221:
  en: "@a%0%a002000@bHardy har! I thought I was gonna die laughing!\n@c0@"
  ja: "@a@b%a002000「笑い死に　するかと\n\t思ったぜ……。\n@c0@"
