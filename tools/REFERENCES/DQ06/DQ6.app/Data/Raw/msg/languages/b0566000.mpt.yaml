  tl: "@a@b%a002030：幹活幹得順利的話，\n　　會禁不住哼起歌來的吧。\n@c0@"
209:
  en: "@a%0%a002050@bI can't wait for the next excitin' event!\n@c0@"
  ja: "@a@b%a002050「どう見ても\n\t恋の花　らしきものは\n\t咲いてませんよねえ……。\n@c0@"
  ko: "@a@b%a002050: 아무리 봐도\n사랑의 꽃처럼 생긴 건\n안 피어 있는데요......\n@c0@"
  sl: "@a@b%a002050：不管怎么看，\n　　爱情的花儿也没有开吧……\n@c0@"
  tl: "@a@b%a002050：不管怎麼看，\n　　愛情的花兒也沒有開吧……\n@c0@"
210:
  en: "@a%0%a002040@b...That was the worst story I've ever heard.\n@c0@"
  ja: "@a@b%a002040「家の中で　歌ったほうが\n\tいいんじゃないか……。\n@c0@"
  ko: "@a@b%a002040: 집 안에서 부르는 게\n좋지 않겠나......\n@c0@"
  sl: "@a@b%a002040：要唱歌回家唱啊……\n@c0@"
  tl: "@a@b%a002040：要唱歌回家唱啊……\n@c0@"
211:
  en: "@a%0%a002060@b(snarl) Dullerton...dull... (slobber)\n@c0@"
  ja: "@a@b%a002060「オラが…ハァー……\n\t恋の…花が…咲くう……。\n\tちょっと…だけ…おぼえた……。\n@c0@"
