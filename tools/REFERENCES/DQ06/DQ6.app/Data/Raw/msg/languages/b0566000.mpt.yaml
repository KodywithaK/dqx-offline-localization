  sl: "@a@b%a002000：这个人五音不全啊……\n@c0@"
  tl: "@a@b%a002000：這個人五音不全啊……\n@c0@"
206:
  en: "@a%0%a002010@bWas he being sarcastic...?\n@c0@"
  ja: "@a@b%a002010「うふふ。\n\tごきげんだわね。\n@c0@"
  ko: "@a@b%a002010: 우후후.\n유쾌해 보이네.\n@c0@"
  sl: "@a@b%a002010：呵呵。\n　　心情真不错啊。\n@c0@"
  tl: "@a@b%a002010：呵呵。\n　　心情真不錯啊。\n@c0@"
207:
  en: "@a%0%a002020@bI'd love to know where this ‘somewhere else’ is — maybe we could go there instead.\n@c0@"
  ja: "@a@b%a002020「歌は　うまくないけど\n\t伝わってくるものは　あるわね。\n@c0@"
  ko: "@a@b%a002020: 노래는 못 부르지만\n전달은 되는걸.\n@c0@"
  sl: "@a@b%a002020：歌虽然不怎么样，\n　　不过还挺有深意的呢。\n@c0@"
  tl: "@a@b%a002020：歌雖然不怎麼樣，\n　　不過還挺有深意的呢。\n@c0@"
208:
  en: "@a%0%a002030@bAn official history of Dullerton would be a slim volume indeed.\n@c0@"
  ja: "@a@b%a002030「仕事が　順調だと\n\tハナ歌の　ひとつも\n\t出るのでしょうね。\n@c0@"
