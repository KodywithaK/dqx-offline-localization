  tl: "@a@b%a002020：嗯？\n　　有人朝我們這邊來了呢。\n@c0@"
20:
  en: "@a%0%a002030@bThis is an imposing place. Oppressive even...\n@c0@"
  ja: "@a@b%a002030「なんだか\n\tものものしい　ふんいきの\n\tところですね。\n@c0@"
  ko: "@a@b%a002030: 왠지\n분위기가\n삼엄해 보이는걸요.\n@c0@"
