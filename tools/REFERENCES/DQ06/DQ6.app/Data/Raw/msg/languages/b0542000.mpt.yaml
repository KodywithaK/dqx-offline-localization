  en: "@a%0%a002050@bIf that old boy stays out in the fresh air too long, he'll dry up!\n@c0@"
  ja: "@a@b%a002050「おじいさん！　あんまり\n\tお日さまと　風に　あたっていると\n\tひからびてしまいますよ！\n@c0@"
  ko: "@a@b%a002050: 할아버지!\n햇볕이랑 바람을 너무 쐬시면\n바짝 말라 버리십니다!\n@c0@"
  sl: "@a@b%a002050：老爷爷，风吹日晒太久的话，\n　　人会变成咸鱼哦！\n@c0@"
  tl: "@a@b%a002050：老爺爺，風吹日曬太久的話，\n　　人會變成鹹魚哦！\n@c0@"
66:
  en: "@a%0%a002000@bC'mon, let's do this, %a000090! It's about time we got some royal attention 'n' everything like that.\n@c0@"
  ja: "@a@b%a002000「こいつらを　倒せば\n\tいよいよ　王さまに　会える。\n\tやろうぜ　%a000090！\n@c0@"
  ko: "@a@b%a002000: 이 녀석을 쓰러뜨리면\n드디어 왕을 만날 수 있는 거군.\n붙어 보자고, %a000090!\n@c0@"
  sl: "@a@b%a002000：打倒这些家伙的话，\n　　就可以见到国王陛下了。\n　　动手吧，%a000090！\n@c0@"
  tl: "@a@b%a002000：打倒這些傢伙的話，\n　　就可以見到國王陛下了。\n　　動手吧，%a000090！\n@c0@"
67:
  en: "@a%0%a002010@bWe haven't come this far just to turn back, %a000090!\n@c0@"
  ja: "@a@b%a002010「ここまで　きたら\n\tやるだけよ　%a000090！\n@c0@"
  ko: "@a@b%a002010: 여기까지 온 이상\n도전하는 수밖에 없어, %a000090!\n@c0@"
  sl: "@a@b%a002010：都走到这一步了，\n　　只能上了，%a000090！\n@c0@"
  tl: "@a@b%a002010：都走到這一步了，\n　　只能上了，%a000090！\n@c0@"
68:
  en: "@a%0%a002020@bWhat!? Hey, %a000090, are you gonna let them get away with that?\n@c0@"
  ja: "@a@b%a002020「いくじが　ないなんて\n\tいわせておくつもり？\n\t%a000090！\n@c0@"
  ko: "@a@b%a002020: 패기가 없다는 소리나\n듣고 있을 거야?\n%a000090!\n@c0@"
  sl: "@a@b%a002020：你想让人\n　　说我们没勇气么？\n　　%a000090！\n@c0@"
  tl: "@a@b%a002020：你想讓人\n　　說我們沒勇氣麼？\n　　%a000090！\n@c0@"
69:
  en: "@a%0%a002030@bThese guards don't look like they're open to persuasion.\n@c0@"
  ja: "@a@b%a002030「さすがに\n\tまもりが　かたいですねえ。\n@c0@"
  ko: "@a@b%a002030: 역시\n수비가 만만치 않군요.\n@c0@"
  sl: "@a@b%a002030：果然警备森严呢。\n@c0@"
  tl: "@a@b%a002030：果然警備森嚴呢。\n@c0@"
70:
  en: "@a%0%a002030@bIf we desire an audience with the King, we'd better roll up our sleeves and prepare for battle.\n@c0@"
  ja: "@a@b%a002030「しかし\n\t王さまに　会うには　彼らと\n\t勝負するしかありませんよ。\n@c0@"
  ko: "@a@b%a002030: 하지만\n왕을 뵙기 위해서는 저들과\n겨뤄 보는 수밖에 없습니다.\n@c0@"
  sl: "@a@b%a002030：不过，\n　　要想面见国王陛下，\n　　必须先战胜他们才行。\n@c0@"
  tl: "@a@b%a002030：不過，\n　　要想面見國王陛下，\n　　必須先戰勝他們才行。\n@c0@"
71:
  en: "@a%0%a002050@bC'mon, %a000090! Let's give these upstarts a lesson they won't forget!\n@c0@"
  ja: "@a@b%a002050「ええいっ\n\tひとあわ　ふかせて\n\tやりましょうよ　%a000090さん！\n@c0@"
  ko: "@a@b%a002050: 에잇,\n한 방 먹여 주자구요.\n%a000090 님!\n@c0@"
  sl: "@a@b%a002050：哎，就让他们\n　　见识一下我们的实力吧，\n　　%a000090！\n@c0@"
  tl: "@a@b%a002050：哎，就讓他們\n　　見識一下我們的實力吧，\n　　%a000090！\n@c0@"
72:
  en: "@a%0%a002000@bHardy har! And that was just a light workout!\n@c0@"
  ja: "@a@b%a002000「オレたちの　実力は\n\tまだまだ　こんなもんじゃないぜ！\n@c0@"
  ko: "@a@b%a002000: 우리 실력은\n이게 끝이 아니라고!\n@c0@"
  sl: "@a@b%a002000：咱的实力不只如此呢！\n@c0@"
  tl: "@a@b%a002000：咱的實力不只如此呢！\n@c0@"
73:
  en: "@a%0%a002010@bHee hee. Seems we passed their little test.\n@c0@"
  ja: "@a@b%a002010「うふふ。\n\tおゆるしが　でたようね。\n@c0@"
  ko: "@a@b%a002010: 우후훗.\n통과 허가가 떨어졌네.\n@c0@"
  sl: "@a@b%a002010：呵呵，\n　　好像得到许可了呢。\n@c0@"
  tl: "@a@b%a002010：呵呵，\n　　好像得到許可了呢。\n@c0@"
74:
  en: "@a%0%a002020@bTee hee! As if there was ever any doubt we'd win!\n@c0@"
  ja: "@a@b%a002020「えへへ。\n\tこういう　結果に　なることは\n\tわかってたけどね。\n@c0@"
  ko: "@a@b%a002020: 에헤헷.\n이런 결과가 될 줄\n알고 있었지.\n@c0@"
  sl: "@a@b%a002020：诶嘿嘿。\n　　我就知道会是这个结果。\n@c0@"
  tl: "@a@b%a002020：誒嘿嘿。\n　　我就知道會是這個結果。\n@c0@"
75:
  en: "@a%0%a002030@bAt least they were as good as their word. Let's go!\n@c0@"
  ja: "@a@b%a002030「それでは\n\tおことばに　あまえて　王さまに\n\t会いに　いきましょう。\n@c0@"
  ko: "@a@b%a002030: 그럼\n이분들 말씀대로 왕을\n뵈러 갑시다.\n@c0@"
  sl: "@a@b%a002030：那我们\n　　就恭敬不如从命，\n　　去面见国王陛下吧。\n@c0@"
  tl: "@a@b%a002030：那我們\n　　就恭敬不如從命，\n　　去面見國王陛下吧。\n@c0@"
76:
  en: "@a%0%a002050@bNicely done!\n@c0@"
  ja: "@a@b%a002050「えっへん！\n@c0@"
  ko: "@a@b%a002050: 엣헴!\n@c0@"
  sl: "@a@b%a002050：嗯哼！\n@c0@"
  tl: "@a@b%a002050：嗯哼！\n@c0@"
77:
  en: "@a%0%a002000@bAye, let's shove off, %a000090!\n@c0@"
  ja: "@a@b%a002000「よし　いこうぜ\n\t%a000090！\n@c0@"
  ko: "@a@b%a002000: 좋아. 가자,\n%a000090!\n@c0@"
  sl: "@a@b%a002000：走吧，%a000090！\n@c0@"
  tl: "@a@b%a002000：走吧，%a000090！\n@c0@"
78:
  en: "@a%0%a002010@bI don't envy their job. It must get tiresome.\n@c0@"
  ja: "@a@b%a002010「考えてみれば\n\tこのふたりも　たいへんな\n\t役目よね。\n@c0@"
  ko: "@a@b%a002010: 생각해 보면\n이 두 사람도 참 힘든\n역할을 맡고 있구나.\n@c0@"
  sl: "@a@b%a002010：想想看的话，\n　　这两个人的差事\n　　也不轻松呢。\n@c0@"
  tl: "@a@b%a002010：想想看的話，\n　　這兩個人的差事\n　　也不輕鬆呢。\n@c0@"
79:
  en: "@a%0%a002020@bThey still seem pretty uppity, considering the blow we just gave their egos.\n@c0@"
  ja: "@a@b%a002020「あたしたちに\n\t負けたわりに　えらそうな\n\tたいどの　まんまね。\n@c0@"
  ko: "@a@b%a002020: 우리한테\n져 놓고서 태도는\n여전히 거만하네.\n@c0@"
  sl: "@a@b%a002020：即使输给了我们，\n　　依然这么趾高气扬啊。\n@c0@"
  tl: "@a@b%a002020：即使輸給了我們，\n　　依然這麼趾高氣揚啊。\n@c0@"
80:
  en: "@a%0%a002030@bShall we go inside, then?\n@c0@"
  ja: "@a@b%a002030「さあ　それでは\n\t中に　入らせてもらいましょう。\n@c0@"
  ko: "@a@b%a002030: 자, 그럼\n안으로 들어가 봅시다.\n@c0@"
  sl: "@a@b%a002030：那我们就进去吧。\n@c0@"
  tl: "@a@b%a002030：那我們就進去吧。\n@c0@"
81:
  en: "@a%0%a002050@bWhat a thrill! But old %a002050 never knows what to say to royalty...\n@c0@"
  ja: "@a@b%a002050「どこの国に　行っても\n\t王さまに　会うときは\n\tドキドキしますね！\n@c0@"
  ko: "@a@b%a002050: 어느 나라에 가든\n왕을 뵈러 갈 때는\n떨리는군요!\n@c0@"
  sl: "@a@b%a002050：不管去哪个国家，\n　　面见国王的时候\n　　心都砰砰直跳呢！\n@c0@"
  tl: "@a@b%a002050：不管去哪個國家，\n　　面見國王的時候\n　　心都砰砰直跳呢！\n@c0@"
82:
  en: "@a%0%a002000@bRight to business, aye? That merchant's got gumption!\n@c0@"
  ja: "@a@b%a002000「どんなときでも\n\t商売に　つなげられるのは\n\tたいしたもんだな。\n@c0@"
  ko: "@a@b%a002000: 어떤 상황도\n장사로 연결시킬 수 있다는 건\n대단하군.\n@c0@"
  sl: "@a@b%a002000：任何时候\n　　都能不忘记做生意，\n　　真不简单啊。\n@c0@"
  tl: "@a@b%a002000：任何時候\n　　都能不忘記做生意，\n　　真不簡單啊。\n@c0@"
83:
  en: "@a%0%a002010@bHe's certainly making the most of his situation.\n@c0@"
  ja: "@a@b%a002010「この人\n\t旅の商人さん　だったのね。\n@c0@"
  ko: "@a@b%a002010: 이 사람\n떠돌이 상인이었구나.\n@c0@"
  sl: "@a@b%a002010：这个人是\n　　旅行商人吧。\n@c0@"
  tl: "@a@b%a002010：這個人是\n　　旅行商人吧。\n@c0@"
84:
  en: "@a%0%a002020@bKind of a weak selection, huh?\n@c0@"
  ja: "@a@b%a002020「もうちょっと\n\t品ぞろえが　いいと\n\tよかったのになー。\n@c0@"
  ko: "@a@b%a002020: 괜찮은 물건이\n좀 더 많았다면\n좋았을 텐데~\n@c0@"
  sl: "@a@b%a002020：要是卖的东西\n　　齐全一点\n　　就好了啊。\n@c0@"
  tl: "@a@b%a002020：要是賣的東西\n　　齊全一點\n　　就好了啊。\n@c0@"
85:
  en: "@a%0%a002030@bThe castle does seem to have been deliberately constructed to confuse outsiders.\n@c0@"
  ja: "@a@b%a002030「この城は　中も　外も\n\t迷いやすい　つくりなのかも\n\tしれませんね。\n@c0@"
  ko: "@a@b%a002030: 이 성은 안쪽도 바깥쪽도\n헤매기 쉬운 구조로\n만들어진 모양입니다.\n@c0@"
  sl: "@a@b%a002030：这座城的构造，\n　　城里城外都\n　　容易让人迷路呢。\n@c0@"
  tl: "@a@b%a002030：這座城的構造，\n　　城裡城外都\n　　容易讓人迷路呢。\n@c0@"
86:
  en: "@a%0%a002050@bThat merchant's got his eye on the ball, I tell you!\n@c0@"
  ja: "@a@b%a002050「この　城には\n\t道具屋さんが　なかった\n\tみたいですから……\n@c0@"
  ko: "@a@b%a002050: 이 성에는\n도구점이 없었던 것\n같으니......\n@c0@"
  sl: "@a@b%a002050：这个城里\n　　好像没有\n　　道具店啊……\n@c0@"
  tl: "@a@b%a002050：這個城裡\n　　好像沒有\n　　道具店啊……\n@c0@"
87:
  en: "@a%0%a002050@bI didn't see an item shop here, so I bet he's rakin' it in!\n@c0@"
  ja: "@a@b%a002050「このまま　ここで\n\t商売してたら　もうかるんじゃ\n\tないですかね。\n@c0@"
  ko: "@a@b%a002050: 이대로 여기서\n장사를 하면 잘 벌리지\n않을까요?\n@c0@"
  sl: "@a@b%a002050：所以就这样\n　　在这里做生意的话，\n　　一定可以赚钱的吧。\n@c0@"
  tl: "@a@b%a002050：所以就這樣\n　　在這裡做生意的話，\n　　一定可以賺錢的吧。\n@c0@"
88:
  en: "@a%0%a002000@bRoomy in here, aye?\n@c0@"
  ja: "@a@b%a002000「へええ。\n\t中は　けっこう　広いんだな。\n@c0@"
  ko: "@a@b%a002000: 호오.\n안쪽은 꽤 넓군.\n@c0@"
  sl: "@a@b%a002000：诶，\n　　里面还挺宽敞的啊。\n@c0@"
  tl: "@a@b%a002000：誒，\n　　裡面還挺寬敞的啊。\n@c0@"
89:
  en: "@a%0%a002010@bIt looks like a lot of people live within the castle walls.\n@c0@"
  ja: "@a@b%a002010「お城の中には\n\tたくさんの人たちが\n\tくらしている　ようね。\n@c0@"
  ko: "@a@b%a002010: 성안에서는\n많은 사람들이\n살고 있는 모양이네.\n@c0@"
  sl: "@a@b%a002010：城里面\n　　住了不少人呢。\n@c0@"
  tl: "@a@b%a002010：城裡面\n　　住了不少人呢。\n@c0@"
90:
  en: "@a%0%a002020@bI like this place! Indoor shopping is always a plus!\n@c0@"
  ja: "@a@b%a002020「このお城は　\n\t雨がふっても　ぬれずに\n\tお買い物が　できていいね！\n@c0@"
  ko: "@a@b%a002020: 이 성은\n비가 와도 젖지 않고\n물건을 살 수 있어서 좋아!\n@c0@"
  sl: "@a@b%a002020：这座城即使下雨，\n　　地面也不会湿吧。\n　　雨天也可以上街买东西真好！\n@c0@"
  tl: "@a@b%a002020：這座城即使下雨，\n　　地面也不會濕吧。\n　　雨天也可以上街買東西真好！\n@c0@"
91:
  en: "@a%0%a002030@bShops, a church... This castle really has it all!\n@c0@"
  ja: "@a@b%a002030「ほう　城の中に\n\tお店やら　教会やら\n\tいろいろ　あるみたいですね。\n@c0@"
  ko: "@a@b%a002030: 호오, 성안에\n상점이나 성당 등\n여러 시설들이 있군요.\n@c0@"
  sl: "@a@b%a002030：哦，\n　　城里面店铺啊教会啊，\n　　一应俱全呢。\n@c0@"
  tl: "@a@b%a002030：哦，\n　　城裡面店鋪啊教會啊，\n　　一應俱全呢。\n@c0@"
92:
  en: "@a%0%a002050@bI thought this place would be packed with hard-nuts who've seen that sign.\n@c0@"
  ja: "@a@b%a002050「立て札を　見てきた\n\t強そうな人が　いっぱい\n\tいるかと　思いましたが……\n@c0@"
  ko: "@a@b%a002050: 팻말을 보고 찾아온\n강한 사람들이 잔뜩\n있을 줄 알았는데......\n@c0@"
  sl: "@a@b%a002050：我本来以为，\n　　会有很多强者\n　　看到告示进城来的呢……\n@c0@"
  tl: "@a@b%a002050：我本來以為，\n　　會有很多強者\n　　看到告示進城來的呢……\n@c0@"
93:
  en: "@a%0%a002050@bBut they haven't exactly put it in the most accessible location...\n@c0@"
  ja: "@a@b%a002050「立て札が　あそこじゃ\n\tあまり　効果が\n\tないんでしょうかね。\n@c0@"
  ko: "@a@b%a002050: 팻말 위치 때문에\n별로 효과가\n없었나 보군요.\n@c0@"
  sl: "@a@b%a002050：告示立在那里，\n　　没起到什么效果呢。\n@c0@"
  tl: "@a@b%a002050：告示立在那裡，\n　　沒起到什麼效果呢。\n@c0@"
94:
  en: "@a%0%a002000@b‘Really tough soldiers’, aye? Hardy har! That's a job we were born for, %a000090!\n@c0@"
  ja: "@a@b%a002000「強い者か……\n\tたぶん　大丈夫だと\n\t思うけどな　へへ。\n@c0@"
  ko: "@a@b%a002000: 강한 자라......\n아마 괜찮지 않을까\n싶은데. 헤헷.\n@c0@"
  sl: "@a@b%a002000：强者啊……\n　　咱应该没问题的吧，\n　　嘿嘿。\n@c0@"
  tl: "@a@b%a002000：強者啊……\n　　咱應該沒問題的吧，\n　　嘿嘿。\n@c0@"
95:
  en: "@a%0%a002010@bI wonder how the King decides which soldiers are tough enough...\n@c0@"
  ja: "@a@b%a002010「どうやって\n\t強い者か　どうかを\n\tたしかめるのかしら……。\n@c0@"
  ko: "@a@b%a002010: 어떻게\n강한지 아닌지를\n확인하는 걸까......\n@c0@"
  sl: "@a@b%a002010：到底要怎么检验\n　　是不是强者呢……\n@c0@"
  tl: "@a@b%a002010：到底要怎麼檢驗\n　　是不是強者呢……\n@c0@"
96:
  en: "@a%0%a002020@bI wonder how ‘really tough’ you have to be?\n@c0@"
  ja: "@a@b%a002020「どのくらい\n\t強ければ　いいんだろうね。\n@c0@"
  ko: "@a@b%a002020: 얼마나 강하면\n되는 거지?\n@c0@"
  sl: "@a@b%a002020：到底\n　　多强才算是强呢？\n@c0@"
  tl: "@a@b%a002020：到底\n　　多強才算是強呢？\n@c0@"
97:
  en: "@a%0%a002030@bLet us proceed. It does not pay to tarry!\n@c0@"
  ja: "@a@b%a002030「とにかく　奥へ\n\t行ってみましょう。\n@c0@"
  ko: "@a@b%a002030: 어쨌든 안으로\n가 봅시다.\n@c0@"
  sl: "@a@b%a002030：总之先到里面去吧。\n@c0@"
  tl: "@a@b%a002030：總之先到裡面去吧。\n@c0@"
98:
  en: "@a%0%a002050@bSomehow I doubt we'll be able to just march in and meet the King.\n@c0@"
  ja: "@a@b%a002050「うーん…　なんだか\n\tすんなりとは　会えない\n\t気が　してきました……。\n@c0@"
  ko: "@a@b%a002050: 으음... 왠지\n쉽게 만날 수 있을 것 같진\n않군요......\n@c0@"
