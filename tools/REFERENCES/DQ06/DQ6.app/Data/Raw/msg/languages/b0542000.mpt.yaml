  tl: "@a@b%a002050：應該是個相當厲害的人吧。\n@c0@"
33:
  en: "@a%0%a002000@bThink the Somnian military would mind if we moonlit, %a000090?\n@c0@"
  ja: "@a@b%a002000「なんだ　これは？\n\tずいぶん　いさましいな。\n@c0@"
