  tl: "@a@b%a002050：哇，\n　　這城真大啊！\n@c0@"
22:
  en: "@a%0%a002000@bPretty fancy joint, this place.\n@c0@"
  ja: "@a@b%a002000「しかし　なんとも\n\tりっぱな　つくりの　城だな。\n@c0@"
