27:
  en: "@a%0%a002000@bWhat was up with that fella? And where was he draggin' that coffin off to?\n@c0@"
  ja: "@a@b%a002000「なんだ　あいつ？\n\tカンオケなんか　ひきずって\n\tどこへ　行くんだ？\n@c0@"
