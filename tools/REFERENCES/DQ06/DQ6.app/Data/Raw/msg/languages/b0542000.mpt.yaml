  tl: "@a@b%a002010：不過，\n　　構造還真是複雜呢……\n@c0@"
24:
  en: "@a%0%a002020@bWe'd better not split up in this place. It'd take us weeks to find each other.\n@c0@"
  ja: "@a@b%a002020「もし　ここで\n\tみんなと　はぐれたら\n\tさがすの　たいへんそう……。\n@c0@"
