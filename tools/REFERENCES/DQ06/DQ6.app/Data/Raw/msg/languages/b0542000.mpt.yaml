28:
  en: "@a%0%a002010@b......?\n@c0@"
  ja: "@a@b%a002010「……？\n@c0@"
  ko: "@a@b%a002010: ......?\n@c0@"
  sl: "@a@b%a002010：……\n@c0@"
  tl: "@a@b%a002010：……\n@c0@"
29:
  en: "@a%0%a002020@bHmm. Not the friendliest guy, huh?\n@c0@"
  ja: "@a@b%a002020「あいその　ない人\n\tだったわねえ。\n@c0@"
