  sl: "@a@b%a002000：这城修得\n　　可真是壮观啊。\n@c0@"
  tl: "@a@b%a002000：這城修得\n　　可真是壯觀啊。\n@c0@"
23:
  en: "@a%0%a002010@bThis castle's layout seems rather complex...\n@c0@"
  ja: "@a@b%a002010「それにしても\n\tふくざつな　つくりに\n\tなっているのね……。\n@c0@"
