30:
  en: "@a%0%a002030@bThat brusque fellow had a confidence and presence rare in one so young.\n@c0@"
  ja: "@a@b%a002030「若いけど\n\tなんだか　ふんいきに\n\tすごみが　ありましたね。\n@c0@"
