164:
  en: "@a%0%a002000@bSo the monsters haven't slacked off around here, aye?\n@c0@"
  ja: "@a@b%a002000「あいかわらず\n\tまものは　へってない\n\tってことだな。\n@c0@"
  ko: "@a@b%a002000: 여전히\n마물은 줄지 않은\n모양이군.\n@c0@"
  sl: "@a@b%a002000：也就是说，\n　　魔物还是没有减少啊。\n@c0@"
  tl: "@a@b%a002000：也就是說，\n　　魔物還是沒有減少啊。\n@c0@"
165:
  en: "@a%0%a002010@bIt's true, not much has changed since Murdaw was defeated.\n@c0@"
  ja: "@a@b%a002010「ムドーが　倒れてからも\n\tじょうきょうは　あまり\n\t変わっていないのね。\n@c0@"
  ko: "@a@b%a002010: 무도가 쓰러진 후에도\n상황은 크게\n바뀌지 않았나 봐.\n@c0@"
  sl: "@a@b%a002010：姆多被打倒之后，\n　　情况似乎一点都没有好转呢。\n@c0@"
  tl: "@a@b%a002010：姆多被打倒之後，\n　　情況似乎一點都沒有好轉呢。\n@c0@"
166:
  en: "@a%0%a002020@bFighting monsters seems to be the national pastime around here. More power to them!\n@c0@"
  ja: "@a@b%a002020「この国は　まものと\n\tせっきょく的に　戦っていて\n\tたのもしいわよね。\n@c0@"
  ko: "@a@b%a002020: 이 나라는 마물과\n적극적으로 싸우고 있어서\n든든하네.\n@c0@"
  sl: "@a@b%a002020：这个国家在\n　　积极同魔物作战呢，\n　　真是让人心里踏实啊。\n@c0@"
  tl: "@a@b%a002020：這個國家在\n　　積極同魔物作戰呢，\n　　真是讓人心裡踏實啊。\n@c0@"
167:
  en: "@a%0%a002030@bThe Arkbolt Army is devoted to its ongoing struggle against monsterkind.\n@c0@"
  ja: "@a@b%a002030「長い間　国をあげて\n\tまものと　戦い続けている\n\tというわけですね。\n@c0@"
  ko: "@a@b%a002030: 오랫동안 온 나라가\n총력을 기울여 마물과의 싸움을\n계속하고 있군요.\n@c0@"
  sl: "@a@b%a002030：这么长时间，\n　　一直倾举国之力\n　　在同魔物战斗呢。\n@c0@"
  tl: "@a@b%a002030：這麼長時間，\n　　一直傾舉國之力\n　　在同魔物戰鬥呢。\n@c0@"
168:
  en: "@a%0%a002050@bI'm sure the Goddess is takin' careful note of all their prayers!\n@c0@"
  ja: "@a@b%a002050「その　祈りが\n\tちゃんと　神さまに　つうじて\n\tいるんですね　きっと。\n@c0@"
  ko: "@a@b%a002050: 그 기도는\n틀림없이 신께서도\n들어 주실 겁니다. 그럼요.\n@c0@"
  sl: "@a@b%a002050：这份祈祷，\n　　一定能够传达到\n　　神明那里去吧。\n@c0@"
  tl: "@a@b%a002050：這份祈禱，\n　　一定能夠傳達到\n　　神明那裡去吧。\n@c0@"
169:
  en: "@a%0%a002000@bBlue get-up? You think he means that fella we passed near the entrance?\n@c0@"
  ja: "@a@b%a002000「青い服の剣士？\n\t城の　入口で　すれちがった\n\tあの　若いヤツの　ことか……？\n@c0@"
  ko: "@a@b%a002000: 파란 옷을 입은 검사?\n성 입구에서 스쳤던\n그 젊은 녀석 말인가......?\n@c0@"
  sl: "@a@b%a002000：穿蓝衣服的剑士？\n　　就是在城门口跟咱\n　　擦肩而过的那家伙吧？\n@c0@"
  tl: "@a@b%a002000：穿藍衣服的劍士？\n　　就是在城門口跟咱\n　　擦肩而過的那傢伙吧？\n@c0@"
170:
  en: "@a%0%a002010@bHe may have been rough-looking, but still...\n@c0@"
  ja: "@a@b%a002010「いけすかない感じって\n\tいわれても……。\n@c0@"
  ko: "@a@b%a002010: 재수 없게 생긴\n사람이라니......\n@c0@"
  sl: "@a@b%a002010：虽说是有点高傲……\n@c0@"
  tl: "@a@b%a002010：雖說是有點高傲……\n@c0@"
171:
  en: "@a%0%a002020@bWait... Does he mean Mr Mean? That rude guy is really that strong?\n@c0@"
  ja: "@a@b%a002020「えー！\n\tあの　あいそのない人でしょ？\n\tそんなに　強いのー！？\n@c0@"
  ko: "@a@b%a002020: 어~!\n그때 그 무뚝뚝했던 사람이지?\n그렇게 강한 거야~!?\n@c0@"
  sl: "@a@b%a002020：诶，\n　　就是那个态度冷淡的人吧？\n　　他有那么厉害吗？！\n@c0@"
  tl: "@a@b%a002020：誒，\n　　就是那個態度冷淡的人吧？\n　　他有那麼厲害嗎？！\n@c0@"
172:
  en: "@a%0%a002030@bAh, that brusque swordsman? I had no idea he was such a gifted fighter.\n@c0@"
  ja: "@a@b%a002030「青い服の剣士。\n\tそれほどまでの　使い手とは\n\t思いませんでした……。\n@c0@"
  ko: "@a@b%a002030: 파란 옷을 입은 검사.\n그 정도의 실력가일 줄은\n몰랐군요......\n@c0@"
  sl: "@a@b%a002030：穿蓝衣服的剑士。\n　　没想到居然是\n　　那么厉害的人。\n@c0@"
  tl: "@a@b%a002030：穿藍衣服的劍士。\n　　沒想到居然是\n　　那麼厲害的人。\n@c0@"
173:
  en: "@a%0%a002050@bA rough-looking swordsman in blue? He's not talkin' about old %a002050?\n@c0@"
  ja: "@a@b%a002050「いっしゅん　青い服って\n\t私のことかと　思いましたが\n\tちがっていましたね……。\n@c0@"
  ko: "@a@b%a002050: 순간적으로 그 파란 옷이\n저인 줄 알았는데\n아니네요......\n@c0@"
  sl: "@a@b%a002050：穿蓝衣服，\n　　一瞬间还以为是说我呢。\n　　想错了啊……\n@c0@"
  tl: "@a@b%a002050：穿藍衣服，\n　　一瞬間還以為是說我呢。\n　　想錯了啊……\n@c0@"
174:
  en: "@a%0%a002000@bWell, I'd be bored too if they put me on guard duty in Somnia...\n@c0@"
  ja: "@a@b%a002000「オレも　レイドックで\n\t見はりを　やらされてたら\n\tきっと　たいくつしてるだろうな。\n@c0@"
  ko: "@a@b%a002000: 나도 레이독에서\n순찰을 맡았다면\n틀림없이 따분해 했을 테지.\n@c0@"
  sl: "@a@b%a002000：俺要是在雷多克\n　　也干放哨这活的话，\n　　一定也挺无聊的吧。\n@c0@"
  tl: "@a@b%a002000：俺要是在雷多克\n　　也幹放哨這活的話，\n　　一定也挺無聊的吧。\n@c0@"
175:
  en: "@a%0%a002010@bThat poor guard seems restless.\n@c0@"
  ja: "@a@b%a002010「ほんとに\n\tヒマそうね。\n@c0@"
  ko: "@a@b%a002010: 정말\n할일이 없어 보이네.\n@c0@"
  sl: "@a@b%a002010：看起来的确是\n　　很清闲呢。\n@c0@"
  tl: "@a@b%a002010：看起來的確是\n　　很清閒呢。\n@c0@"
176:
  en: "@a%0%a002020@b%0%a000090, be careful when you strike up conversations with random soldiers!\n@c0@"
  ja: "@a@b%a002020「%a000090\n\t兵隊に　話しかけるときは\n\t気をつけないと！\n@c0@"
  ko: "@a@b%a002020: %a000090,\n병사에게 말을 걸 때는\n조심해야지!\n@c0@"
  sl: "@a@b%a002020：%a000090，\n　　跟士兵说话的时候\n　　要小心才行！\n@c0@"
  tl: "@a@b%a002020：%a000090，\n　　跟士兵說話的時候\n　　要小心才行！\n@c0@"
177:
  en: "@a%0%a002020@bAny of these guys might challenge us to another one of those dumb duels. These guys are so gung-ho!\n@c0@"
  ja: "@a@b%a002020「またまた\n\t勝負しろとか　いわれると\n\tやっかいだしね！\n@c0@"
  ko: "@a@b%a002020: 또\n겨뤄 보자고 하면\n귀찮잖아!\n@c0@"
  sl: "@a@b%a002020：要是再让我们\n　　跟他打的话，\n　　太麻烦了啊！\n@c0@"
  tl: "@a@b%a002020：要是再讓我們\n　　跟他打的話，\n　　太麻煩了啊！\n@c0@"
178:
  en: "@a%0%a002030@bBoredom is the price of peace, they say. It is to be welcomed.\n@c0@"
  ja: "@a@b%a002030「たいくつは　平和のあかし。\n\t本当は　いいことなのですが。\n@c0@"
  ko: "@a@b%a002030: 따분하다는 것은 평화의 증거.\n알고 보면 좋은 겁니다.\n@c0@"
  sl: "@a@b%a002030：无聊就是和平的证明啊。\n　　这其实是件好事。\n@c0@"
  tl: "@a@b%a002030：無聊就是和平的證明啊。\n　　這其實是件好事。\n@c0@"
179:
  en: "@a%0%a002050@bI know what that fellow means. It might be dangerous, but there's nothin' quite like bashin' monsters!\n@c0@"
  ja: "@a@b%a002050「キケンですが\n\tまもの退治とかの　仕事のほうが\n\tやりがいは　あるでしょうね。\n@c0@"
  ko: "@a@b%a002050: 위험하긴 하지만\n마물 퇴치 같은 일이\n보람은 더 있겠네요.\n@c0@"
  sl: "@a@b%a002050：虽然讨伐魔物\n　　之类的工作很危险，\n　　但是更有价值啊。\n@c0@"
  tl: "@a@b%a002050：雖然討伐魔物\n　　之類的工作很危險，\n　　但是更有價值啊。\n@c0@"
180:
  en: "@a%0%a002000@bHardy har! I'd be interested in meetin' those monsters!\n@c0@"
  ja: "@a@b%a002000「どんな　まものなのか\n\tちょっと　興味が　わいてきたぜ。\n@c0@"
  ko: "@a@b%a002000: 어떤 마물인지\n조금 흥미가 생기는군.\n@c0@"
  sl: "@a@b%a002000：到底是个啥样的魔物，\n　　忽然来兴趣了啊。\n@c0@"
  tl: "@a@b%a002000：到底是個啥樣的魔物，\n　　忽然來興趣了啊。\n@c0@"
181:
  en: "@a%0%a002010@bA monster like that sounds incredibly dangerous.\n@c0@"
  ja: "@a@b%a002010「そんなに　強いまものが\n\tこの国の　どこかに\n\tいるわけね。\n@c0@"
  ko: "@a@b%a002010: 그렇게 강한 마물이\n이 나라 어딘가에\n있는 모양이구나.\n@c0@"
  sl: "@a@b%a002010：那么强大的魔物，\n　　就在这个国家的\n　　某个地方吧。\n@c0@"
  tl: "@a@b%a002010：那麼強大的魔物，\n　　就在這個國家的\n　　某個地方吧。\n@c0@"
182:
  en: "@a%0%a002020@bHow'd that 'fraidy-cat soldier make the cut?\n@c0@"
  ja: "@a@b%a002020「このひと　くよくよ\n\tしすぎじゃないの？\n@c0@"
  ko: "@a@b%a002020: 이 사람, 벌써부터\n너무 걱정하는 거 아니야?\n@c0@"
  sl: "@a@b%a002020：这个人\n　　想太多了吧。\n@c0@"
  tl: "@a@b%a002020：這個人\n　　想太多了吧。\n@c0@"
183:
  en: "@a%0%a002030@bI think I'm starting to understand why the King is recruiting skilled fighters.\n@c0@"
  ja: "@a@b%a002030「強い者を　求めている\n\t理由が　少し　見えてきた\n\t気がしますね。\n@c0@"
  ko: "@a@b%a002030: 강한 자를 찾는\n이유를 조금 알 수\n있을 것 같습니다.\n@c0@"
  sl: "@a@b%a002030：我觉得\n　　好像能猜到一点\n　　寻找强者的原因了。\n@c0@"
  tl: "@a@b%a002030：我覺得\n　　好像能猜到一點\n　　尋找強者的原因了。\n@c0@"
184:
  en: "@a%0%a002050@bWe'll need to battle this Brutus lad first, then we can judge how hard those monsters are.\n@c0@"
  ja: "@a@b%a002050「まずは　ブラスト兵団長と\n\t戦ってみないと　そのまものの\n\t強さは　わかりませんね！\n@c0@"
  ko: "@a@b%a002050: 우선은 블래스트 병사단장과\n싸워 보지 않으면 그 마물이\n얼마나 강한지를 알 수 없겠네요!\n@c0@"
  sl: "@a@b%a002050：不先和\n　　布拉斯特兵团长打一场的话，\n　　就不知道那个魔物到底有多强了呢！\n@c0@"
  tl: "@a@b%a002050：不先和\n　　布拉斯特兵團長打一場的話，\n　　就不知道那個魔物到底有多強了呢！\n@c0@"
185:
  en: "@a%0%a002000@bNettle shakes, aye? I prefer drinkin' raw egg yolks.\n@c0@"
  ja: "@a@b%a002000「へえ。\n\tうまそうな　料理を\n\t作ってるみたいだな。\n@c0@"
  ko: "@a@b%a002000: 호오.\n맛있어 보이는\n음식을 만들고 있군.\n@c0@"
  sl: "@a@b%a002000：哎，\n　　好像在做什么\n　　好吃的东西呢。\n@c0@"
  tl: "@a@b%a002000：哎，\n　　好像在做什麼\n　　好吃的東西呢。\n@c0@"
186:
  en: "@a%0%a002010@bI'm sure her cooking is the cornerstone of Arkbolt's peace-keeping efforts!\n@c0@"
  ja: "@a@b%a002010「この人は　お料理で\n\tこの国の　平和を\n\t支えている　わけね。\n@c0@"
  ko: "@a@b%a002010: 이 사람은 요리로\n이 나라의 평화를\n지켜주고 있네.\n@c0@"
  sl: "@a@b%a002010：这个人是用\n　　自己做的饭菜为这个国家的和平\n　　贡献着力量呢。\n@c0@"
  tl: "@a@b%a002010：這個人是用\n　　自己做的飯菜為這個國家的和平\n　　貢獻著力量呢。\n@c0@"
187:
  en: "@a%0%a002020@bTee hee! I love watching people scarf down a big meal!\n@c0@"
  ja: "@a@b%a002020「あたしも\n\t気持ちよく　たくさん食べる人\n\t好きだなー！\n@c0@"
  ko: "@a@b%a002020: 나도\n기분 좋게 많이 먹어 주는 사람\n정말 좋아~!\n@c0@"
  sl: "@a@b%a002020：我也喜欢\n　　能吃的人！爽快！\n@c0@"
  tl: "@a@b%a002020：我也喜歡\n　　能吃的人！爽快！\n@c0@"
188:
  en: "@a%0%a002030@bEven the cuisine in Arkbolt packs a punch!\n@c0@"
  ja: "@a@b%a002030「台所にも\n\t活気が　ありますね。\n@c0@"
  ko: "@a@b%a002030: 주방에도\n활기가 넘치는군요.\n@c0@"
  sl: "@a@b%a002030：厨房里\n　　也生气盎然呢。\n@c0@"
  tl: "@a@b%a002030：廚房裡\n　　也生氣盎然呢。\n@c0@"
189:
  en: "@a%0%a002050@bI'll have to get hold of one of those uniforms if it'll impress the lasses.\n@c0@"
  ja: "@a@b%a002050「私も　これから\n\t女の人に　好かれるくらい\n\tゴハンを　いっぱい食べます！\n@c0@"
  ko: "@a@b%a002050: 저도 앞으로\n여자분들이 좋아하실 정도로\n밥을 많이 먹겠습니다!\n@c0@"
  sl: "@a@b%a002050：我今后也\n　　多吃点饭，\n　　来讨姑娘们欢心好了。\n@c0@"
  tl: "@a@b%a002050：我今後也\n　　多吃點飯，\n　　來討姑娘們歡心好了。\n@c0@"
190:
  en: "@a%0%a002000@bPoor kid. Nobody wants to see their dad get dressed down in public, aye?\n@c0@"
  ja: "@a@b%a002000「父親より　強いヤツが\n\tいるなんて　信じたくない……\n\tその気持ち　ちょっと　わかるぜ。\n@c0@"
  ko: "@a@b%a002000: 아버지보다 강한 녀석이\n있다는 걸 믿고 싶지 않겠지......\n그 마음 나도 안다고.\n@c0@"
  sl: "@a@b%a002000：不相信有比自己老爸\n　　更厉害的家伙……\n　　俺能理解这种心情。\n@c0@"
  tl: "@a@b%a002000：不相信有比自己老爸\n　　更厲害的傢伙……\n　　俺能理解這種心情。\n@c0@"
191:
  en: "@a%0%a002010@bIt's good to know that Commander Brutus is beatable, at least.\n@c0@"
  ja: "@a@b%a002010「私たちが　まだ\n\t戦ってもいない　ブラスト兵団長に\n\tすでに勝った　相手がいるのね。\n@c0@"
  ko: "@a@b%a002010: 우리가 아직\n싸워 보지도 못한 블래스트 병사단장을\n이긴 상대가 이미 있나 보구나.\n@c0@"
  sl: "@a@b%a002010：有人已经打败了\n　　布拉斯特兵团长啊。\n　　我们都还没跟他打呢。\n@c0@"
  tl: "@a@b%a002010：有人已經打敗了\n　　布拉斯特兵團長啊。\n　　我們都還沒跟他打呢。\n@c0@"
192:
  en: "@a%0%a002020@bSomething in his eye? Riiight.\n@c0@"
  ja: "@a@b%a002020「ゴミは　あっても\n\tガビョウは　ないと思うな……。\n@c0@"
  ko: "@a@b%a002020: 먼지는 들어갔을 수도 있는데\n압정은 아닐걸......\n@c0@"
  sl: "@a@b%a002020：灰尘倒是可能有，\n　　钉子就不太可能了……\n@c0@"
  tl: "@a@b%a002020：灰塵倒是可能有，\n　　釘子就不太可能了……\n@c0@"
193:
  en: "@a%0%a002030@bThat would appear to be Commander Brutus's son.\n@c0@"
  ja: "@a@b%a002030「この城の　兵団長の\n\tお子さんの　ようですね。\n@c0@"
  ko: "@a@b%a002030: 이 성의 병사단장님\n자제분인가 보네요.\n@c0@"
  sl: "@a@b%a002030：好像是这座城\n　　兵团长的孩子呢。\n@c0@"
  tl: "@a@b%a002030：好像是這座城\n　　兵團長的孩子呢。\n@c0@"
194:
  en: "@a%0%a002050@bI wonder what that lad's called... Brutus Jr?\n@c0@"
  ja: "@a@b%a002050「ブラスト兵団長さんの\n\tお子さんですと\n\tコブラストさん　でしょうか！\n@c0@"
  ko: "@a@b%a002050: 블래스트 병사단장님의\n자제분......\n자제 좀 해 주셨으면 좋겠는데요!\n@c0@"
  sl: "@a@b%a002050：要是这是\n　　布拉斯特兵团长的孩子的话，\n　　那就是小布拉斯特吧！\n@c0@"
  tl: "@a@b%a002050：要是這是\n　　布拉斯特兵團長的孩子的話，\n　　那就是小布拉斯特吧！\n@c0@"
195:
  en: "@a%0%a002000@bOh, he's hurt. For a second I thought he was nappin'.\n@c0@"
  ja: "@a@b%a002000「ひるまっから\n\tねている　兵士が　いると\n\t思ったら　けが人か……。\n@c0@"
  ko: "@a@b%a002000: 대낮부터\n웬 잠인가 했더니\n부상병이었군......\n@c0@"
  sl: "@a@b%a002000：俺还以为是个\n　　大白天睡觉的士兵呢，\n　　原来是受了伤……\n@c0@"
  tl: "@a@b%a002000：俺還以為是個\n　　大白天睡覺的士兵呢，\n　　原來是受了傷……\n@c0@"
196:
  en: "@a%0%a002010@bThe poor thing sounds like he's really in pain.\n@c0@"
  ja: "@a@b%a002010「強い　痛みに\n\tうなされて　いるようね。\n\tかわいそうに……。\n@c0@"
  ko: "@a@b%a002010: 강한 고통에\n시달리는 모양이야.\n가엾어라......\n@c0@"
  sl: "@a@b%a002010：好像受了\n　　很严重的伤呢。\n　　真可怜……\n@c0@"
  tl: "@a@b%a002010：好像受了\n　　很嚴重的傷呢。\n　　真可憐……\n@c0@"
197:
  en: "@a%0%a002020@bWow, that guy's been beaten into next week.\n@c0@"
  ja: "@a@b%a002020「かなり　こっぴどく\n\tやられてるわね。\n@c0@"
  ko: "@a@b%a002020: 정말 호되게\n당했네.\n@c0@"
  sl: "@a@b%a002020：被打得相当惨呢。\n@c0@"
  tl: "@a@b%a002020：被打得相當慘呢。\n@c0@"
198:
  en: "@a%0%a002030@bJudging from that man's injuries, his opponent was no monster...\n@c0@"
  ja: "@a@b%a002030「この　兵士さんの\n\tけがの　ようすから　見ると\n\t相手は　まものでは　ありませんね。\n@c0@"
  ko: "@a@b%a002030: 이 병사의\n상처를 보니\n마물에게 당한 건 아닙니다.\n@c0@"
  sl: "@a@b%a002030：从这士兵的伤情来看，\n　　对手不是魔物呢。\n@c0@"
  tl: "@a@b%a002030：從這士兵的傷情來看，\n　　對手不是魔物呢。\n@c0@"
199:
  en: "@a%0%a002050@bA soldier's life is not an easy one, I tell you!\n@c0@"
  ja: "@a@b%a002050「いやあ\n\t兵士の　仕事は　ホント\n\t命がけなんですねえ。\n@c0@"
  ko: "@a@b%a002050: 저런,\n병사는 일하려면\n목숨을 걸어야 하는군요.\n@c0@"
  sl: "@a@b%a002050：哎呀，\n　　士兵这差事\n　　真是命悬一线啊。\n@c0@"
  tl: "@a@b%a002050：哎呀，\n　　士兵這差事\n　　真是命懸一線啊。\n@c0@"
200:
  en: "@a%0%a002000@b‘Swordsman’, aye...? Three guesses who he's talkin' about...\n@c0@"
  ja: "@a@b%a002000「剣士か……。\n\tあいつの　ことだな　きっと。\n@c0@"
  ko: "@a@b%a002000: 검사라......\n역시 그 녀석이군.\n@c0@"
  sl: "@a@b%a002000：剑士啊……\n　　一定是指那家伙吧。\n@c0@"
  tl: "@a@b%a002000：劍士啊……\n　　一定是指那傢伙吧。\n@c0@"
201:
  en: "@a%0%a002010@bBoth the soldiers in this room have been beaten black and blue.\n@c0@"
  ja: "@a@b%a002010「この部屋の　兵士さん\n\tふたりとも　キズだらけだわ……。\n@c0@"
  ko: "@a@b%a002010: 이 방에 있는 병사,\n둘 다 상처투성이야......\n@c0@"
  sl: "@a@b%a002010：这个房间的士兵，\n　　两人都浑身是伤……\n@c0@"
  tl: "@a@b%a002010：這個房間的士兵，\n　　兩人都渾身是傷……\n@c0@"
202:
  en: "@a%0%a002020@bI'll bet he must've given the blue swordsman one of Arkbolt's ‘tests’.\n@c0@"
  ja: "@a@b%a002020「この兵士さんが\n\tあの　青い服の　剣士の\n\t強さを　ためしたのかな。\n@c0@"
  ko: "@a@b%a002020: 이 병사가\n그 파란 옷 입은 검사의\n실력을 시험한 걸까?\n@c0@"
  sl: "@a@b%a002020：不知道这个士兵\n　　有没有检验到那个\n　　穿蓝衣服的剑士的实力呢。\n@c0@"
  tl: "@a@b%a002020：不知道這個士兵\n　　有沒有檢驗到那個\n　　穿藍衣服的劍士的實力呢。\n@c0@"
203:
  en: "@a%0%a002030@bIt appears that this swordsman knows how to temper his power in order to avoid striking a fatal blow.\n@c0@"
  ja: "@a@b%a002030「ふむ。　あの剣士……\n\t相手に　キズを　あたえていても\n\t手かげんは　しているようです。\n@c0@"
  ko: "@a@b%a002030: 흠. 그 검사......\n상대에게 상처를 주긴 했지만\n나름대로 조절은 한 모양입니다.\n@c0@"
  sl: "@a@b%a002030：唔。那个剑士……\n　　即使把别人打得遍体鳞伤，\n　　还是手下留情了呢。\n@c0@"
  tl: "@a@b%a002030：唔。那個劍士……\n　　即使把別人打得遍體鱗傷，\n　　還是手下留情了呢。\n@c0@"
204:
  en: "@a%0%a002050@bOld %a002050 wouldn't mind a swing at that swordsman in blue!\n@c0@"
  ja: "@a@b%a002050「私　あの　青い剣士と\n\t戦ってみたく　なってきました！\n@c0@"
  ko: "@a@b%a002050: 저, 그 파란 옷 검사와\n싸워 보고 싶어졌습니다!\n@c0@"
  sl: "@a@b%a002050：我真想跟那个\n　　穿蓝衣服的剑士一较高下！\n@c0@"
  tl: "@a@b%a002050：我真想跟那個\n　　穿藍衣服的劍士一較高下！\n@c0@"
205:
  en: "@a%0%a002000@bHey, ya think that Brutus guy wrote this?\n@c0@"
  ja: "@a@b%a002000「兵士心得　かあ……\n\t兵団長とか　いう人が\n\t書いたのかな。\n@c0@"
  ko: "@a@b%a002000: 병사의 수칙이라......\n병사단장이라는 사람이\n쓴 건가?\n@c0@"
  sl: "@a@b%a002000：士兵要领啊……\n　　是兵团长之类的人\n　　写的吧。\n@c0@"
  tl: "@a@b%a002000：士兵要領啊……\n　　是兵團長之類的人\n　　寫的吧。\n@c0@"
206:
  en: "@a%0%a002010@bA soldier's life is his weapon, or so they say.\n@c0@"
  ja: "@a@b%a002010「武器は\n\t兵隊さんたちの　命かもね。\n@c0@"
  ko: "@a@b%a002010: 무기는\n병사들에게는 생명이나 다름없지.\n@c0@"
  sl: "@a@b%a002010：武器就是士兵的命啊。\n@c0@"
  tl: "@a@b%a002010：武器就是士兵的命啊。\n@c0@"
207:
  en: "@a%0%a002020@bWhat a rule! Wouldn't that make it hard to eat? Or brush your hair? \n@c0@"
  ja: "@a@b%a002020「そうよね　いざってとき\n\tもし　サビて　いたりしたら\n\t自分が　やられちゃうものね。\n@c0@"
  ko: "@a@b%a002020: 맞아. 정작 써야 할 때\n무기가 녹슬어 있다면\n자기가 당하니까.\n@c0@"
  sl: "@a@b%a002020：是啊。要是关键时候\n　　武器生了锈什么的，\n　　那就没命了呢。\n@c0@"
  tl: "@a@b%a002020：是啊。要是關鍵時候\n　　武器生了鏽什麼的，\n　　那就沒命了呢。\n@c0@"
208:
  en: "@a%0%a002030@bThis is clearly a place where rules and regulations must be obeyed.\n@c0@"
  ja: "@a@b%a002030「兵士の　きりつが\n\tきびしそうな　お城ですねえ。\n@c0@"
  ko: "@a@b%a002030: 병사의 규율이\n엄격해 보이는 성이군요.\n@c0@"
  sl: "@a@b%a002030：这个城的士兵\n　　纪律真严呢。\n@c0@"
  tl: "@a@b%a002030：這個城的士兵\n　　紀律真嚴呢。\n@c0@"
209:
  en: "@a%0%a002050@bIt's good advice! You never know when you're goin' to have to unsheathe your sword!\n@c0@"
  ja: "@a@b%a002050「うっ　武器の手入れ？\n\t……そういえば　私　さいきん\n\tちょっと　さぼっていたかも。\n@c0@"
  ko: "@a@b%a002050: 엇, 무기 손질?\n......그러고 보니 저는 요새\n좀 게을리 했던 것 같은걸요.\n@c0@"
  sl: "@a@b%a002050：唔，武器维护？\n　　……说起来，我最近\n　　也有些怠慢了呢。\n@c0@"
  tl: "@a@b%a002050：唔，武器維護？\n　　……說起來，我最近\n　　也有些怠慢了呢。\n@c0@"
210:
  en: "@a%0%a002000@bI get the sense Commander Brutus can protect the castle just dandy without that fella.\n@c0@"
  ja: "@a@b%a002000「ふたり…　っていうか\n\t兵団長が　いるから\n\t大丈夫なんじゃないのか？\n@c0@"
  ko: "@a@b%a002000: 저 둘...보다도\n병사단장이 있으니\n괜찮은 거 아닌가?\n@c0@"
  sl: "@a@b%a002000：只有两个人啊……\n　　有兵团长在，\n　　绝对不会有事的吧？\n@c0@"
  tl: "@a@b%a002000：只有兩個人啊……\n　　有兵團長在，\n　　絕對不會有事的吧？\n@c0@"
211:
  en: "@a%0%a002010@bSometimes self-confidence is the best weapon a soldier can have.\n@c0@"
  ja: "@a@b%a002010「これだけ　強い\n\t自信を　持っているのは\n\t何よりな　ことね。\n@c0@"
  ko: "@a@b%a002010: 이렇게 강한\n자신감을 가지고 있으니\n걱정할 게 없겠네.\n@c0@"
  sl: "@a@b%a002010：这么有自信\n　　真是再好不过了。\n@c0@"
  tl: "@a@b%a002010：這麼有自信\n　　真是再好不過了。\n@c0@"
212:
  en: "@a%0%a002020@bThat guy doesn't seem quite in the same league as Brutus.\n@c0@"
  ja: "@a@b%a002020「この人　そんなに\n\t強そうに　見えないけどなー。\n@c0@"
  ko: "@a@b%a002020: 이 사람, 그렇게\n강해 보이지는 않는걸~\n@c0@"
  sl: "@a@b%a002020：这个人\n　　看上去没那么强啊……\n@c0@"
  tl: "@a@b%a002020：這個人\n　　看上去沒那麼強啊……\n@c0@"
213:
  en: "@a%0%a002030@bWell, it's clear that Commander Brutus is far from a weakling.\n@c0@"
  ja: "@a@b%a002030「まあ　兵団長が\n\tかなり　強い人だと　いうのは\n\tわかりましたね……。\n@c0@"
  ko: "@a@b%a002030: 뭐, 병사단장님이\n상당히 강한 사람이라는 건\n알 수 있군요......\n@c0@"
  sl: "@a@b%a002030：哎，\n　　不过我倒是知道兵团长\n　　是一个相当厉害的人了……\n@c0@"
  tl: "@a@b%a002030：哎，\n　　不過我倒是知道兵團長\n　　是一個相當厲害的人了……\n@c0@"
214:
  en: "@a%0%a002050@bWith just two guards, you can only keep an eye on the front and back gates!\n@c0@"
  ja: "@a@b%a002050「たった　ふたりだったら\n\t入口と　出口しか\n\tまもれませんよね！？\n@c0@"
  ko: "@a@b%a002050: 두 사람뿐이라면\n입구와 출구밖에\n못 지키잖아요!?\n@c0@"
  sl: "@a@b%a002050：只有两个人的话，\n　　不是只能把守入口和出口\n　　两个地方么？！\n@c0@"
  tl: "@a@b%a002050：只有兩個人的話，\n　　不是只能把守入口和出口\n　　兩個地方麼？！\n@c0@"
215:
  en: "@a%0%a002000@bAhoy! That's an easy one to remember!\n@c0@"
  ja: "@a@b%a002000「なんだか　はりがみも\n\tきあいが　入ってるぜ。\n@c0@"
  ko: "@a@b%a002000: 왠지 종이에도\n힘이 팍 들어갔군.\n@c0@"
  sl: "@a@b%a002000：总觉得这张贴出来的纸\n　　也斗志满满的呢。\n@c0@"
  tl: "@a@b%a002000：總覺得這張貼出來的紙\n　　也鬥志滿滿的呢。\n@c0@"
216:
  en: "@a%0%a002010@bThe life of a soldier doesn't sound very appealing, I must say.\n@c0@"
  ja: "@a@b%a002010「兵士さんも\n\tいろいろ　たいへんだわね。\n@c0@"
  ko: "@a@b%a002010: 병사들도\n이래저래 고생이겠어.\n@c0@"
  sl: "@a@b%a002010：士兵们\n　　也不容易啊。\n@c0@"
  tl: "@a@b%a002010：士兵們\n　　也不容易啊。\n@c0@"
217:
  en: "@a%0%a002020@bThis place seems more about the Three P's: Posters, Posters, Posters.\n@c0@"
  ja: "@a@b%a002020「あちこち\n\tはりがみが　はってあるのね。\n@c0@"
  ko: "@a@b%a002020: 여기저기에\n종이가 붙어 있네.\n@c0@"
  sl: "@a@b%a002020：到处都贴有公告呢。\n@c0@"
  tl: "@a@b%a002020：到處都貼有公告呢。\n@c0@"
218:
  en: "@a%0%a002030@bYou can almost sense the high morale in this castle.\n@c0@"
  ja: "@a@b%a002030「この城の　兵士たちの\n\t士気の高さを　感じますね。\n@c0@"
  ko: "@a@b%a002030: 이 성에 있는 병사들의\n높은 사기가 느껴지는군요.\n@c0@"
  sl: "@a@b%a002030：能感觉到这座城\n　　士兵们的高涨士气呢。\n@c0@"
  tl: "@a@b%a002030：能感覺到這座城\n　　士兵們的高漲士氣呢。\n@c0@"
219:
  en: "@a%0%a002050@bI'm not even a soldier in this kingdom, but I'm inspired by this sign!\n@c0@"
  ja: "@a@b%a002050「こういうのを　読んでいると\n\t何だか　私まで　やる気に\n\tなってくるから　ふしぎですね！\n@c0@"
  ko: "@a@b%a002050: 이런 걸 읽고 있으면\n왠지 저까지 의욕이 샘솟으니\n참 신기하군요!\n@c0@"
  sl: "@a@b%a002050：读了这个，总觉得\n　　连我都燃起斗志了呢！\n　　真不可思议！\n@c0@"
  tl: "@a@b%a002050：讀了這個，總覺得\n　　連我都燃起鬥志了呢！\n　　真不可思議！\n@c0@"
220:
  en: "@a%0%a002000@bHe's right. Let's shove off, %a000090.\n@c0@"
  ja: "@a@b%a002000「たしかに　ジャマだな。\n\t行こうぜ　%a000090。\n@c0@"
  ko: "@a@b%a002000: 우리가 있으면 방해되겠군.\n가자, %a000090.\n@c0@"
  sl: "@a@b%a002000：的确是咱打扰了啊。\n　　走吧，%a000090。\n@c0@"
  tl: "@a@b%a002000：的確是咱打擾了啊。\n　　走吧，%a000090。\n@c0@"
221:
  en: "@a%0%a002010@bHe probably spends every day training like this.\n@c0@"
  ja: "@a@b%a002010「毎日　こうして\n\tきびしい訓練を　しているのね。\n@c0@"
  ko: "@a@b%a002010: 매일 이렇게\n고된 훈련을 하고 있구나.\n@c0@"
  sl: "@a@b%a002010：每天都这么\n　　严格训练呢。\n@c0@"
  tl: "@a@b%a002010：每天都這麼\n　　嚴格訓練呢。\n@c0@"
222:
  en: "@a%0%a002020@bYow! Give him some room before someone loses an eye.\n@c0@"
  ja: "@a@b%a002020「すごい　いきおいだねー。\n@c0@"
  ko: "@a@b%a002020: 기운이 넘치는걸~\n@c0@"
  sl: "@a@b%a002020：真有气势啊。\n@c0@"
  tl: "@a@b%a002020：真有氣勢啊。\n@c0@"
223:
  en: "@a%0%a002030@bShall we watch him train a bit? From a distance, of course.\n@c0@"
  ja: "@a@b%a002030「ジャマに　ならないよう\n\t少し　はなれて\n\t訓練を　見ていきますか？\n@c0@"
  ko: "@a@b%a002030: 방해가 되지 않도록\n조금 떨어져서\n훈련을 보고 갈까요?\n@c0@"
  sl: "@a@b%a002030：我们还是\n　　隔远一点看他们训练吧，\n　　别打扰了他们。\n@c0@"
  tl: "@a@b%a002030：我們還是\n　　隔遠一點看他們訓練吧，\n　　別打擾了他們。\n@c0@"
224:
  en: "@a%0%a002050@bThat lad's got a set of lungs on him!\n@c0@"
  ja: "@a@b%a002050「いい　かけ声ですね。\n\tぬおりゃー！！\n@c0@"
  ko: "@a@b%a002050: 기합 소리 한번 우렁차네요.\n흐아압~!!\n@c0@"
  sl: "@a@b%a002050：声音真有气势啊。\n　　嘿呀！！\n@c0@"
  tl: "@a@b%a002050：聲音真有氣勢啊。\n　　嘿呀！！\n@c0@"
225:
  en: "@a%0%a002000@bWhat's there to see in a prison, aye?\n@c0@"
  ja: "@a@b%a002000「牢屋　か……。\n\tとくに　見るべきものは\n\tないようだな。\n@c0@"
  ko: "@a@b%a002000: 감옥이군......\n딱히 봐 둬야 할 건\n없는 것 같다.\n@c0@"
  sl: "@a@b%a002000：牢房啊……\n　　没什么好看的。\n@c0@"
  tl: "@a@b%a002000：牢房啊……\n　　沒什麼好看的。\n@c0@"
226:
  en: "@a%0%a002010@bWandering all around this castle is quite tiring...\n@c0@"
  ja: "@a@b%a002010「あちこち　お城の中を\n\t見てあるくと　けっこう\n\tつかれるわね。\n@c0@"
  ko: "@a@b%a002010: 성안을 여기저기\n살펴보고 돌아다녔더니\n피곤한걸.\n@c0@"
