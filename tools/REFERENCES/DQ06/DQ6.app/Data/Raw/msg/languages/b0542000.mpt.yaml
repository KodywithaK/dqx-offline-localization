0:
  en: "@a%0%a002000@bSo we're stuck on this side, aye? Ah, well.\n@c0@"
  ja: "@a@b%a002000「つまり　ここで\n\tとおせんぼって　わけかい。\n\tまいったな。\n@c0@"
  ko: "@a@b%a002000: 그러니까 여기서\n통행이 막혀 버린 건가?\n큰일이군.\n@c0@"
  sl: "@a@b%a002000：也就是说，\n　　咱过不去是吧。\n　　真倒霉。\n@c0@"
  tl: "@a@b%a002000：也就是說，\n　　咱過不去是吧。\n　　真倒楣。\n@c0@"
1:
  en: "@a%0%a002010@bNo wonder people are frustrated. What could have happened to the guard?\n@c0@"
  ja: "@a@b%a002010「まあ……\n\tみなさん　お困りのようね。\n\t門番のひと　どうしたのかしら？\n@c0@"
  ko: "@a@b%a002010: 어머......\n다들 곤란해 보이네.\n문지기한테 무슨 일이 생긴 걸까?\n@c0@"
  sl: "@a@b%a002010：唉……\n　　大家好像都很困扰呢。\n　　守门的人到底怎么了啊？\n@c0@"
  tl: "@a@b%a002010：唉……\n　　大家好像都很困擾呢。\n　　守門的人到底怎麼了啊？\n@c0@"
2:
  en: "@a%0%a002020@bWhat's the point of a checkpoint if the guard's asleep?\n@c0@"
  ja: "@a@b%a002020「えーっ\n\t門番がねてて　とおれないって\n\tちょっと　ひどいんじゃない？\n@c0@"
  ko: "@a@b%a002020: 뭐~?\n문지기가 잠들어서 지나갈 수 없다니\n너무한 거 아냐?\n@c0@"
  sl: "@a@b%a002020：诶，\n　　守门的睡了所以我们过不去，\n　　这有点过分吧？\n@c0@"
  tl: "@a@b%a002020：誒，\n　　守門的睡了所以我們過不去，\n　　這有點過分吧？\n@c0@"
3:
  en: "@a%0%a002030@bHmm... A guard who cannot be awoken... What could be the matter with him?\n@c0@"
  ja: "@a@b%a002030「いくら　おこしても\n\tおきない……ふうむ。\n\tどういうことでしょうね。\n@c0@"
  ko: "@a@b%a002030: 아무리 깨워도\n일어나지 않는다니...... 흐음.\n어찌 된 일일까요.\n@c0@"
  sl: "@a@b%a002030：怎么叫都叫不醒……\n　　唔，\n　　这是怎么一回事呢？\n@c0@"
  tl: "@a@b%a002030：怎麼叫都叫不醒……\n　　唔，\n　　這是怎麼一回事呢？\n@c0@"
4:
  en: "@a%0%a002050@bSo that's where all that snorin' was comin' from!\n@c0@"
  ja: "@a@b%a002050「そういえば　どこからか\n\tいびきの　おとが\n\t聞こえてきますね。\n@c0@"
  ko: "@a@b%a002050: 그러고 보니 어디서\n코 고는 소리가\n들리네요.\n@c0@"
  sl: "@a@b%a002050：话说回来，\n　　我好像听见\n　　有呼噜声。\n@c0@"
  tl: "@a@b%a002050：話說回來，\n　　我好像聽見\n　　有呼嚕聲。\n@c0@"
5:
  en: "@a%0%a002000@bWhoa! So you just sleep yourself to death? Sounds creepy!\n@c0@"
  ja: "@a@b%a002000「ええっ\n\tそのまま　死んでゆく？\n\tなんだか　おそろしいぜ……。\n@c0@"
  ko: "@a@b%a002000: 뭐어?\n그대로 죽어 간다고?\n왠지 무시무시한걸......\n@c0@"
  sl: "@a@b%a002000：诶，\n　　就这样死了？\n　　真吓人……\n@c0@"
  tl: "@a@b%a002000：誒，\n　　就這樣死了？\n　　真嚇人……\n@c0@"
6:
  en: "@a%0%a002010@bHas such a sickness really been doing the rounds?\n@c0@"
  ja: "@a@b%a002010「そんなに　あちこちに\n\t病気が　ひろがって\n\tいるのかしら。\n@c0@"
  ko: "@a@b%a002010: 그렇게 여기저기에\n병이 퍼지고\n있는 걸까?\n@c0@"
  sl: "@a@b%a002010：这病真的\n　　蔓延到各地了么。\n@c0@"
  tl: "@a@b%a002010：這病真的\n　　蔓延到各地了麼。\n@c0@"
7:
  en: "@a%0%a002020@bYou never wake up until you're dead? What a nightmare!\n@c0@"
  ja: "@a@b%a002020「ねむったまま\n\t死んじゃうのって\n\tなんだか　こわい……。\n@c0@"
  ko: "@a@b%a002020: 잠든 채\n죽어 버리다니\n왠지 무서워......\n@c0@"
  sl: "@a@b%a002020：在睡梦中死去，\n　　好可怕啊……\n@c0@"
  tl: "@a@b%a002020：在睡夢中死去，\n　　好可怕啊……\n@c0@"
8:
  en: "@a%0%a002030@bA fatal sleeping sickness? We cannot turn a blind eye to this.\n@c0@"
  ja: "@a@b%a002030「ねむり病　ですか……。\n\t死ぬことも　あるとなると\n\tほうっておけませんね。\n@c0@"
  ko: "@a@b%a002030: 수면병이라......\n사람이 죽는다니\n내버려둘 수 없군요.\n@c0@"
  sl: "@a@b%a002030：嗜眠症啊……\n　　都已经出人命了，\n　　这事不能不管。\n@c0@"
  tl: "@a@b%a002030：嗜眠症啊……\n　　都已經出人命了，\n　　這事不能不管。\n@c0@"
9:
  en: "@a%0%a002030@bIf only there were something we could do to come to this poor man's aid.\n@c0@"
  ja: "@a@b%a002030「私たちに　何か\n\tかいけつの　手だすけが\n\tできれば　いいのですが。\n@c0@"
  ko: "@a@b%a002030: 우리도 어떻게든\n해결을 도울 방법이\n있다면 좋을 텐데.\n@c0@"
  sl: "@a@b%a002030：要是我们\n　　能帮忙找到解决的办法\n　　就好了。\n@c0@"
  tl: "@a@b%a002030：要是我們\n　　能幫忙找到解決的辦法\n　　就好了。\n@c0@"
10:
  en: "@a%0%a002050@bIf I were to grab forty winks beside that fellow, do you think I'd get sick as well?\n@c0@"
  ja: "@a@b%a002050「その　病気の人の\n\tそばで　ねたりしたら\n\tやっぱり　うつりますかね！？\n@c0@"
  ko: "@a@b%a002050: 그 병에 걸린 사람\n옆에서 자면\n옮는 겁니까!?\n@c0@"
  sl: "@a@b%a002050：要是挨着\n　　得了这病的人睡觉，\n　　一定会传染的吧？！\n@c0@"
  tl: "@a@b%a002050：要是挨著\n　　得了這病的人睡覺，\n　　一定會傳染的吧？！\n@c0@"
11:
  en: "@a%0%a002000@bAye, he's out like a bent nail, alright.\n@c0@"
  ja: "@a@b%a002000「ほんとだ。\n\tぜんぜん　起きそうに　ないな。\n@c0@"
  ko: "@a@b%a002000: 정말이군.\n일어날 기미가 안 보이는걸.\n@c0@"
  sl: "@a@b%a002000：真的啊。\n　　完全叫不醒。\n@c0@"
  tl: "@a@b%a002000：真的啊。\n　　完全叫不醒。\n@c0@"
12:
  en: "@a%0%a002010@bThe Isle o' Smiles... Where have I heard that name before...?\n@c0@"
  ja: "@a@b%a002010「しあわせの国……\n\tその名前は　どこかで\n\t聞いたことが　あったかも……。\n@c0@"
  ko: "@a@b%a002010: 행복의 나라......\n그 이름, 어디서\n들어 본 적이 있는 것 같아......\n@c0@"
  sl: "@a@b%a002010：幸福国……\n　　好像在哪里\n　　听到过这个名字……\n@c0@"
  tl: "@a@b%a002010：幸福國……\n　　好像在哪裡\n　　聽到過這個名字……\n@c0@"
13:
  en: "@a%0%a002020@bThose must be some crazy dreams he's having!\n@c0@"
  ja: "@a@b%a002020「すごい\n\tねごとだね……。\n@c0@"
  ko: "@a@b%a002020: 엄청난\n잠꼬대네......\n@c0@"
  sl: "@a@b%a002020：居然说了\n　　这么多梦话……\n@c0@"
  tl: "@a@b%a002020：居然說了\n　　這麼多夢話……\n@c0@"
14:
  en: "@a%0%a002030@bCrossing the mountains north of Arkbolt? This fellow is dreaming some very detailed directions.\n@c0@"
  ja: "@a@b%a002030「ん？　アークボルトから\n\t山をこえて　北の地とは　また\n\tずいぶんと　具体的な夢ですね。\n@c0@"
  ko: "@a@b%a002030: 음? 아크볼트에서\n산을 넘어 북쪽 땅까지 갔다니,\n몹시 구체적인 꿈이군요.\n@c0@"
  sl: "@a@b%a002030：嗯？从阿克博尔特\n　　翻山越岭到达北方？\n　　这梦还真是具体呢。\n@c0@"
  tl: "@a@b%a002030：嗯？從阿克博爾特\n　　翻山越嶺到達北方？\n　　這夢還真是具體呢。\n@c0@"
15:
  en: "@a%0%a002050@bIsle o' Smiles!? There can't really be a place with a name like that, can there?\n@c0@"
  ja: "@a@b%a002050「しあわせの国なんて\n\tあるわけ　ないですよね！\n@c0@"
  ko: "@a@b%a002050: 행복의 나라라는 곳이\n세상에 어디 있겠습니까!\n@c0@"
  sl: "@a@b%a002050：怎么可能会有\n　　幸福国啊！\n@c0@"
  tl: "@a@b%a002050：怎麼可能會有\n　　幸福國啊！\n@c0@"
16:
  en: "@a%0%a002050@bWell, I suppose folks can go wherever they like in their dreams...\n@c0@"
  ja: "@a@b%a002050「まあ　だから　せめて\n\t夢のなかで　行った気に\n\tなっているのでしょうけど。\n@c0@"
  ko: "@a@b%a002050: 뭐, 그러니까\n꿈에서라도 그런 곳에\n가 보는 거겠지만.\n@c0@"
  sl: "@a@b%a002050：唉，至少他会认为\n　　自己是去过了吧，\n　　虽然是在梦里。\n@c0@"
  tl: "@a@b%a002050：唉，至少他會認為\n　　自己是去過了吧，\n　　雖然是在夢裡。\n@c0@"
17:
  en: "@a%0%a002000@bAvast. What's with that tough-lookin' fella in the blue outfit leavin' the castle?\n@c0@"
  ja: "@a@b%a002000「ん…　なんだ？\n\t前から　青い服を着た\n\t若いのが　来るぞ。\n@c0@"
  ko: "@a@b%a002000: 어... 뭐지?\n앞쪽에서 파란 옷을 입은\n청년이 다가오는군.\n@c0@"
  sl: "@a@b%a002000：嗯……怎么？\n　　前面来了个\n　　穿蓝衣服的小子呢。\n@c0@"
  tl: "@a@b%a002000：嗯……怎麼？\n　　前面來了個\n　　穿藍衣服的小子呢。\n@c0@"
18:
  en: "@a%0%a002010@bThere's a signpost over there.\n@c0@"
  ja: "@a@b%a002010「あそこに　なにかの\n\t立て札が　あるわ。\n@c0@"
  ko: "@a@b%a002010: 저기 무슨\n팻말이 있어.\n@c0@"
  sl: "@a@b%a002010：那边好像\n　　立了一个什么告示呢。\n@c0@"
  tl: "@a@b%a002010：那邊好像\n　　立了一個什麼告示呢。\n@c0@"
19:
  en: "@a%0%a002020@bHmm? Hey, someone's coming.\n@c0@"
  ja: "@a@b%a002020「ん？\n\tだれか　向かってくるよ。\n@c0@"
