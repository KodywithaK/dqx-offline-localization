0:
  en: "@a%0%a002000@bThe mermaids must live under them craggy li'l rocks up there, aye?\n@c0@"
  ja: "@a@b%a002000「岩場の下は　どうやら\n\t人魚のすみか　みたいだな。\n@c0@"
  ko: "@a@b%a002000: 암반 아래쪽은\n인어의 보금자리 같군.\n@c0@"
  sl: "@a@b%a002000：原来人鱼们的家\n　　就在礁岩的下面啊。\n@c0@"
  tl: "@a@b%a002000：原來人魚們的家\n　　就在礁岩的下面啊。\n@c0@"
1:
  en: "@a%0%a002010@bIt's beautiful... So there are still some worlds out there that we know nothing about...\n@c0@"
  ja: "@a@b%a002010「きれい……。\n\t私たちの　知らない世界が\n\tまだまだ　あるみたいね。\n@c0@"
  ko: "@a@b%a002010: 아름다워......\n우리가 모르는 세계가\n아직 많이 남아 있나 봐.\n@c0@"
  sl: "@a@b%a002010：好漂亮……\n　　原来还有这么多\n　　我们不知道的世界呢。\n@c0@"
  tl: "@a@b%a002010：好漂亮……\n　　原來還有這麼多\n　　我們不知道的世界呢。\n@c0@"
2:
  en: "@a%0%a002030@bSo this is the world the mermaids inhabit.\n@c0@"
  ja: "@a@b%a002030「人魚たちは　ここで\n\tくらしてきたのですね。\n@c0@"
  ko: "@a@b%a002030: 인어들은 여기서\n살고 있군요.\n@c0@"
  sl: "@a@b%a002030：人鱼们就是\n　　在这里生活啊。\n@c0@"
  tl: "@a@b%a002030：人魚們就是\n　　在這裡生活啊。\n@c0@"
3:
  en: "@a%0%a002020@bI always figured mermaids would be pretty, but...wow! My eyeballs are in shock!\n@c0@"
  ja: "@a@b%a002020「人魚って　みんな\n\tきれいで　びっくり！\n@c0@"
  ko: "@a@b%a002020: 인어는 모두\n예뻐서 깜짝 놀랐어!\n@c0@"
  sl: "@a@b%a002020：人鱼们全都好漂亮！\n　　真是太让人吃惊了！\n@c0@"
  tl: "@a@b%a002020：人魚們全都好漂亮！\n　　真是太讓人吃驚了！\n@c0@"
4:
  en: "@a%0%a002050@bWonder where the mermen are hidin' themselves...\n@c0@"
  ja: "@a@b%a002050「どこかに　人魚の男が\n\tかくれていたり　しませんよね？\n@c0@"
  ko: "@a@b%a002050: 어딘가에 남자 인어가\n숨어 있는 거 아니겠죠?\n@c0@"
  sl: "@a@b%a002050：男性人鱼不会\n　　就藏在什么地方吧？\n@c0@"
  tl: "@a@b%a002050：男性人魚不會\n　　就藏在什麼地方吧？\n@c0@"
5:
  en: "@a%0%a002000@bI'd love for this ‘mage’ to meet my fist.\n@c0@"
  ja: "@a@b%a002000「悪魔だってよ。\n\tオレたちが　ぶっとばしてやろうぜ！\n@c0@"
  ko: "@a@b%a002000: 악마라는데?\n우리가 물리쳐 주자!\n@c0@"
  sl: "@a@b%a002000：管它什么恶魔，\n　　看俺们不臭揍它一顿！\n@c0@"
  tl: "@a@b%a002000：管它什麼惡魔，\n　　看俺們不臭揍它一頓！\n@c0@"
6:
  en: "@a%0%a002010@bThis ‘evil mage’... Could it be...? How curious...\n@c0@"
  ja: "@a@b%a002010「悪魔って　もしかして……\n\t気になるわ。\n@c0@"
  ko: "@a@b%a002010: 악마라면 혹시......\n마음에 걸려.\n@c0@"
  sl: "@a@b%a002010：恶魔难道是指……\n　　让人有点在意呢。\n@c0@"
  tl: "@a@b%a002010：惡魔難道是指……\n　　讓人有點在意呢。\n@c0@"
7:
  en: "@a%0%a002030@bSo the dark shadow of evil is cast over mermaidkind as well.\n@c0@"
  ja: "@a@b%a002030「人魚たちにも　悪魔の影が\n\tしのびよって　いるのでしょうか。\n@c0@"
  ko: "@a@b%a002030: 인어들에게도 악마의 그림자가\n드리우고 있는 걸까요?\n@c0@"
  sl: "@a@b%a002030：人鱼们的背后\n　　也有恶魔的身影在不断靠近吗？\n@c0@"
  tl: "@a@b%a002030：人魚們的背後\n　　也有惡魔的身影在不斷靠近嗎？\n@c0@"
8:
  en: "@a%0%a002020@bAren't we, like, really far from Pescado? Rod really bucked the odds running into her.\n@c0@"
  ja: "@a@b%a002020「それにしても　ここから\n\tロブさんのいた　ペスカニの海までは\n\t遠いよねー。\n@c0@"
  ko: "@a@b%a002020: 그나저나 여기서\n롭 씨가 있던 페스카니 바다까지는\n멀구나~\n@c0@"
  sl: "@a@b%a002020：话说回来，\n　　可这里距离洛布居住的\n　　佩斯卡尼海远得很呢。\n@c0@"
  tl: "@a@b%a002020：話說回來，\n　　可這裡距離洛布居住的\n　　佩斯卡尼海遠得很呢。\n@c0@"
9:
  en: "@a%0%a002050@bWe were told not to stray there, but you just know we're goin' to go anyway.\n@c0@"
  ja: "@a@b%a002050「海に　もぐるなといわれても\n\tやっぱり　もぐっちゃいますよね。\n@c0@"
  ko: "@a@b%a002050: 바다로 들어가지 말라고 해도\n꼭 들어가 버린다니까요.\n@c0@"
  sl: "@a@b%a002050：虽说不让我们潜入大海，\n　　可这不还是潜进来了。\n@c0@"
  tl: "@a@b%a002050：雖說不讓我們潛入大海，\n　　可這不還是潛進來了。\n@c0@"
10:
  en: "@a%0%a002000@bShe ain't so skittish around us now, aye?\n@c0@"
  ja: "@a@b%a002000「だいぶ　オレたちに\n\tなじんでくれた　ようだな。\n@c0@"
  ko: "@a@b%a002000: 우리를 제법\n잘 따르는걸.\n@c0@"
  sl: "@a@b%a002000：看来已经\n　　和咱们混得很熟了。\n@c0@"
  tl: "@a@b%a002000：看來已經\n　　和咱們混得很熟了。\n@c0@"
11:
  en: "@a%0%a002010@bHee hee.\n@c0@"
  ja: "@a@b%a002010「うふふ。\n@c0@"
  ko: "@a@b%a002010: 우후후.\n@c0@"
  sl: "@a@b%a002010：呵呵呵。\n@c0@"
  tl: "@a@b%a002010：呵呵呵。\n@c0@"
12:
  en: "@a%0%a002030@bMermaids look so carefree when they swim.\n@c0@"
  ja: "@a@b%a002030「気持ち　よさそうに\n\tおよいでますね。\n@c0@"
  ko: "@a@b%a002030: 기분 좋게\n헤엄치고 있네요.\n@c0@"
  sl: "@a@b%a002030：心情舒畅地在游泳呢。\n@c0@"
