15:
  en: "@a%0%a002000@bShe's rhymin' the truth. I wonder if the fishes feel the same way...\n@c0@"
  ja: "@a@b%a002000「サカナたちも\n\tこんな　感じで　見ているのかな。\n\tなんか　おもしろいぜ。\n@c0@"
  ko: "@a@b%a002000: 물고기들의 눈에도\n이런 식으로 보이는 건가?\n왠지 재밌는걸.\n@c0@"
  sl: "@a@b%a002000：居然还能从这个角度\n　　观赏鱼群，真是太有意思了。\n@c0@"
  tl: "@a@b%a002000：居然還能從這個角度\n　　觀賞魚群，真是太有意思了。\n@c0@"
16:
  en: "@a%0%a002010@bThe undersea world is still a complete mystery to humans like us.\n@c0@"
  ja: "@a@b%a002010「海の中は\n\t私たち　人間の　まったく\n\t知らない　世界だわね。\n@c0@"
  ko: "@a@b%a002010: 바닷속은\n우리 인간이 전혀\n모르는 세계구나.\n@c0@"
  sl: "@a@b%a002010：大海里面\n　　是我们人类完全不了解的世界。\n@c0@"
  tl: "@a@b%a002010：大海裡面\n　　是我們人類完全不瞭解的世界。\n@c0@"
17:
  en: "@a%0%a002030@bM-Mermaids are rather beautiful, I must say... Er, as are all of the Goddess's creatures!\n@c0@"
  ja: "@a@b%a002030「本当に\n\tきれい　ですねえ……。\n@c0@"
  ko: "@a@b%a002030: 정말\n아름답군요......\n@c0@"
  sl: "@a@b%a002030：真是\n　　好漂亮啊……\n@c0@"
  tl: "@a@b%a002030：真是\n　　好漂亮啊……\n@c0@"
18:
  en: "@a%0%a002020@bDo I like the ocean? The jury's still out on that one. It's just a whole new world down here.\n@c0@"
  ja: "@a@b%a002020「どうって　いわれても\n\tどうにも　不思議な　感じよね。\n@c0@"
  ko: "@a@b%a002020: 어떻냐고?\n아주 신비로운 느낌이야.\n@c0@"
  sl: "@a@b%a002020：问我感觉怎么样？\n　　我觉得很不可思议呢。\n@c0@"
  tl: "@a@b%a002020：問我感覺怎麼樣？\n　　我覺得很不可思議呢。\n@c0@"
19:
  en: "@a%0%a002050@bYou don't think the air in this bubble could run out, do you?\n@c0@"
  ja: "@a@b%a002050「ずっと　もぐっていたら\n\tアワの中の　空気が\n\tなくなりませんかね……？\n@c0@"
  ko: "@a@b%a002050: 계속 잠수만 하면\n거품 속 공기가\n없어지지 않을까요......?\n@c0@"
  sl: "@a@b%a002050：一直潜在海里的话，\n　　泡泡中的空气\n　　会不会被消耗光啊……\n@c0@"
  tl: "@a@b%a002050：一直潛在海裡的話，\n　　泡泡中的空氣\n　　會不會被消耗光啊……\n@c0@"
