  en: "@a%0%a002020@bWhat's the deal with this place? It's like a castle, but...not.\n@c0@"
  ja: "@a@b%a002020「お城かと　思ったけど\n\tそうじゃないみたいね。\n\tなんだろ　ここ。\n@c0@"
  ko: "@a@b%a002020: 성인 줄 알았더니\n아닌가 보네.\n뭘까 여기는?\n@c0@"
  sl: "@a@b%a002020：还以为会是个\n　　城堡呢，原来搞错了啊。\n　　这里到底是什么地方啊？\n@c0@"
  tl: "@a@b%a002020：還以為會是個\n　　城堡呢，原來搞錯了啊。\n　　這裡到底是什麼地方啊？\n@c0@"
29:
  en: "@a%0%a002040@b%0%a000090, are you battle-ready?\n@c0@"
