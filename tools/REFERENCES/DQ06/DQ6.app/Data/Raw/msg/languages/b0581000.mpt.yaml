34:
  en: "@a%0%a002010@bWell, let's go!\n@c0@"
  ja: "@a@b%a002010「さあ　いきましょう！\n@c0@"
  ko: "@a@b%a002010: 자, 가자!\n@c0@"
  sl: "@a@b%a002010：我们走吧！\n@c0@"
  tl: "@a@b%a002010：我們走吧！\n@c0@"
