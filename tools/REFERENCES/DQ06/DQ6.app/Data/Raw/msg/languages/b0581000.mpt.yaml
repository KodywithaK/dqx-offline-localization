13:
  en: "@a%0%a002020@bTee hee...\n@c0@"
  ja: "@a@b%a002020「えへへ。\n@c0@"
  ko: "@a@b%a002020: 에헤헤.\n@c0@"
  sl: "@a@b%a002020：诶嘿嘿。\n@c0@"
  tl: "@a@b%a002020：誒嘿嘿。\n@c0@"
14:
  en: "@a%0%a002050@bThese mermaids are lookers, alright!\n@c0@"
  ja: "@a@b%a002050「いやー　みなさん\n\tおきれい　ですねー。\n@c0@"
  ko: "@a@b%a002050: 이야~ 여러분,\n아름다우시군요~\n@c0@"
  sl: "@a@b%a002050：哎呀！大家都好漂亮。\n@c0@"
