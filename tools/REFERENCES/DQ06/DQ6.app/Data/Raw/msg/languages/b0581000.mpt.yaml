  ko: "@a@b%a002030: 마물의 기운은\n딱히 느껴지지 않습니다만......\n다른 강한 기운을 느낍니다.\n@c0@"
  sl: "@a@b%a002030：虽然感觉不到\n　　魔物的气息……\n　　不过却能感觉到另一股强大的气息。\n@c0@"
