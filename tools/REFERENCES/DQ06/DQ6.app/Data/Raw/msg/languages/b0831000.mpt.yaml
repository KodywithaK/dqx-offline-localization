  sl: "@a@b＊：啊！掌管这世上一切生命的神啊！\n　　请让%a000180\n　　踏上全新的人生吧！\n@c0@"
  tl: "@a@b＊：啊！掌管這世上一切生命的神啊！\n　　請讓%a000180\n　　踏上全新的人生吧！\n@c0@"
11:
