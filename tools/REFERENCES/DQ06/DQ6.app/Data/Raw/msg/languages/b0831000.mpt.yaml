0:
  en: "@a@b*: Welcome to Alltrades Abbey, %H0860%Xchild%Ychildren%Z.\n@c0@"
  ja: "@a@b＊「ここは　ダーマの神殿。\n@c0@"
  ko: "@a@b*: 이곳은 다마 신전.\n@c0@"
  sl: "@a@b＊：这里是达玛神殿。\n@c0@"
  tl: "@a@b＊：這裡是達瑪神殿。\n@c0@"
1:
  en: "@a@b*: This Abbey is a haven for reflection... A place of peace to think back on life's road, and to plot the journey ahead...\n@c0@"
  ja: "@a@b＊「おのれ自身を　見つめなおし\n\tこれからの生き方を　考える\n\t神聖な場所じゃ。\n@c0@"
  ko: "@a@b*: 자기 자신을 되돌아보고\n앞으로의 삶의 방향을 모색하는\n신성한 장소라네.\n@c0@"
  sl: "@a@b＊：是人们用来重新审视自己，\n　　并且思考今后的人生的\n　　神圣的场所。\n@c0@"
  tl: "@a@b＊：是人們用來重新審視自己，\n　　並且思考今後的人生的\n　　神聖的場所。\n@c0@"
2:
  en: "@a@b*: Should you decide to walk a different path in life, then new skills and abilities will surely line the road like guideposts...\n@c0@"
  ja: "@a@b＊「新たなる　人生を歩めば\n\tそれに　ふさわしい　新たなる能力が\n\tそなたに　めばえるであろう。\n@c0@"
  ko: "@a@b*: 새로운 인생을 걷다 보면\n그에 걸맞은 새로운 능력이\n그대에게 움틀 터.\n@c0@"
  sl: "@a@b＊：想要开始全新的人生，\n　　就应该让自己具备\n　　适合自己的新能力。\n@c0@"
  tl: "@a@b＊：想要開始全新的人生，\n　　就應該讓自己具備\n　　適合自己的新能力。\n@c0@"
3:
  en: "@a@b*: Do you or one of your companions wish to change paths?\n@c0@"
  ja: "@a@b＊「生き方を変えたいと　お望みか？\n@c0@"
  ko: "@a@b*: 삶의 방향을 바꾸고 싶은가?\n@c0@"
  sl: "@a@b＊：您是希望转职吗？\n@c0@"
  tl: "@a@b＊：您是希望轉職嗎？\n@c0@"
