  ko: "@a@b*: 그래도\n%a002160%F2160%X로%Y으로%Z\n살아가고 싶은가?\n@c0@"
  sl: "@a@b＊：即便如此\n　　也要转职成为%a002160吗？\n@c0@"
  tl: "@a@b＊：即便如此\n　　也要轉職成為%a002160嗎？\n@c0@"
9:
  en: "@a@b*: Very well. Then close your eyes, %a000180, and visualise the %a002160 in your mind.\n@c0@"
  ja: "@a@b＊「それでは　%a000180よ\n\t%a002160　の\n\t気持ちになって　祈りなさい。\n@c0@"
  ko: "@a@b*: 그럼 %a000180,\n%a002160의\n마음으로 기도하게나.\n@c0@"
  sl: "@a@b＊：那么%a000180，\n　　怀揣着想要成为%a002160的\n　　愿望进行祈祷吧。\n@c0@"
  tl: "@a@b＊：那麼%a000180，\n　　懷揣著想要成為%a002160的\n　　願望進行祈禱吧。\n@c0@"
10:
  en: "@a@b*: Great Goddess, guide and shepherdess of all! Please lead %a000180 to a new path in life!\n@c0@"
