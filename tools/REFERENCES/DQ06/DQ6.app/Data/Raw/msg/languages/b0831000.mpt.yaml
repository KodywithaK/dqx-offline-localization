  ko: "@a@b*: 허나 %a000180%F0180%X는%Y은%Z\n%a002160%F2160%X로%Y으로%Z서 이미\n충분한 수행을 쌓았다네.\n@c0@"
  sl: "@a@b＊：但是%a000180\n　　作为%a002160\n　　已经积累了足够的修行。\n@c0@"
