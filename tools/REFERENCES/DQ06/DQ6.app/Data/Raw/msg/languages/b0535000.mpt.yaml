  tl: "@a@b%a002030：這種時候\n　　還是看看地圖\n　　確認一下比較好吧。\n@c0@"
299:
  en: "@a%0%a002050@bGoin' down that staircase was a hike and a half! My knees are jigglin' like a pair of jumpin' slimes!\n@c0@"
