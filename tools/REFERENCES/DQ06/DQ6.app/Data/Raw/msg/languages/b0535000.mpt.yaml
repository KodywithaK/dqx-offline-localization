  tl: "@a@b%a002000：出來之後，\n　　周圍居然盡是毒沼，\n　　真是要命！\n@c0@"
295:
  en: "@a%0%a002010@bHmm, so we're in the lower world now, but I've no idea where...\n@c0@"
  ja: "@a@b%a002010「ここは　下の世界の……\n\tどのへんかしらね。\n@c0@"
