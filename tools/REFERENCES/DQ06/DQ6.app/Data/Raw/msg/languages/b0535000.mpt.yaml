69:
  en: "@a%0%a002010@bHer healing powers are impressive!\n@c0@"
  ja: "@a@b%a002010「すばらしいわね\n\tシスターの　いやしのチカラ。\n@c0@"
  ko: "@a@b%a002010: 멋지네,\n수녀님이 가진 치유의 힘.\n@c0@"
  sl: "@a@b%a002010：修女治愈的力量，\n　　真厉害啊。\n@c0@"
  tl: "@a@b%a002010：修女治癒的力量，\n　　真厲害啊。\n@c0@"
70:
  en: "@a%0%a002020@bAmazing! He's like a new person!\n@c0@"
  ja: "@a@b%a002020「さっきより　ぜんぜん\n\t顔いろが　よくなってる。\n\tすっごーい！\n@c0@"
  ko: "@a@b%a002020: 아까보다 훨씬\n혈색이 좋아 보이네.\n대단해~!\n@c0@"
  sl: "@a@b%a002020：脸色已经比刚才好多了呢。\n　　好厉害！\n@c0@"
  tl: "@a@b%a002020：臉色已經比剛才好多了呢。\n　　好厲害！\n@c0@"
71:
  en: "@a%0%a002030@bI'm glad to see that he's made a full recovery.\n@c0@"
  ja: "@a@b%a002030「すぐに　なおって\n\tよかったですね。\n@c0@"
  ko: "@a@b%a002030: 금방 나아서\n다행이군요.\n@c0@"
  sl: "@a@b%a002030：这么快就治好了，\n　　真是太好了呢。\n@c0@"
  tl: "@a@b%a002030：這麼快就治好了，\n　　真是太好了呢。\n@c0@"
72:
  en: "@a%0%a002050@bYou're really feelin' right as rain? That's a relief! Old %a002050 can't stand to see folks in distress.\n@c0@"
  ja: "@a@b%a002050「もう　本当に\n\tいたくないんですか？\n\tはあー　ミラクルですね……。\n@c0@"
  ko: "@a@b%a002050: 정말로 이제\n안 아픈 겁니까?\n와~ 기적이네요......\n@c0@"
  sl: "@a@b%a002050：真的已经不疼了么？\n　　哈……真是奇迹啊……\n@c0@"
  tl: "@a@b%a002050：真的已經不疼了麼？\n　　哈……真是奇跡啊……\n@c0@"
73:
  en: "@a%0%a002000@bSo he just ate too much!? Then he ain't gettin' any sympathy from me, either!\n@c0@"
  ja: "@a@b%a002000「なんだよ……\n\tただの　食べすぎだったのかよ。\n@c0@"
  ko: "@a@b%a002000: 뭐야......\n많이 먹어서 그런 거였냐?\n@c0@"
  sl: "@a@b%a002000：什么啊……\n　　原来只是吃撑了啊。\n@c0@"
  tl: "@a@b%a002000：什麼啊……\n　　原來只是吃撐了啊。\n@c0@"
74:
  en: "@a%0%a002010@bHe's practically dancing home! That nun certainly did a good job of healing him!\n@c0@"
  ja: "@a@b%a002010「足どりも　軽かったわね。\n\tすっかり　なおったのでしょう。\n@c0@"
  ko: "@a@b%a002010: 발걸음도 가벼워졌네.\n완전히 나았나 봐.\n@c0@"
  sl: "@a@b%a002010：脚步都轻快起来了呢。\n　　已经痊愈了吧。\n@c0@"
  tl: "@a@b%a002010：腳步都輕快起來了呢。\n　　已經痊癒了吧。\n@c0@"
75:
  en: "@a%0%a002020@bWow. What a pig!\n@c0@"
  ja: "@a@b%a002020「あの　おじさん\n\tいやしんぼなんだね！\n@c0@"
  ko: "@a@b%a002020: 저 아저씨,\n식탐이 많나 보네!\n@c0@"
  sl: "@a@b%a002020：那个大叔\n　　真能吃啊！\n@c0@"
  tl: "@a@b%a002020：那個大叔\n　　真能吃啊！\n@c0@"
76:
  en: "@a%0%a002030@bThe Goddess frowns upon unbridled greed and gluttony. I pray that this is the last time.\n@c0@"
  ja: "@a@b%a002030「また　食べすぎなければ\n\tいいのですが……。\n@c0@"
  ko: "@a@b%a002030: 또 과식하는 일이\n없어야 할 텐데......\n@c0@"
  sl: "@a@b%a002030：别再吃撑就好了……\n@c0@"
  tl: "@a@b%a002030：別再吃撐就好了……\n@c0@"
77:
  en: "@a%0%a002050@bMaybe it's not my place to say this, but you shouldn't be runnin' to a nun with a case of indigestion!\n@c0@"
  ja: "@a@b%a002050「シスターは　胃ぐすりじゃ\n\tないんですから！\n@c0@"
  ko: "@a@b%a002050: 수녀님은 위장약이\n아니잖아요!\n@c0@"
  sl: "@a@b%a002050：修女又不是胃药！\n@c0@"
  tl: "@a@b%a002050：修女又不是胃藥！\n@c0@"
78:
  en: "@a%0%a002000@bHe's shovellin' down dessert like there's no tomorrow! He's never gonna learn!\n@c0@"
  ja: "@a@b%a002000「こいつ……。\n\tちっとも　コリてないぜ。\n@c0@"
  ko: "@a@b%a002000: 이 녀석......\n질리지도 않나 보군.\n@c0@"
  sl: "@a@b%a002000：这家伙……\n　　一点都不长记性。\n@c0@"
  tl: "@a@b%a002000：這傢伙……\n　　一點都不長記性。\n@c0@"
79:
  en: "@a%0%a002010@bI'm sure the Goddess is just delighted to see him eating again...\n@c0@"
  ja: "@a@b%a002010「神さまも\n\tにが笑い　していそうね……。\n@c0@"
  ko: "@a@b%a002010: 신께서도\n쓴웃음을 짓고 계시겠는걸......\n@c0@"
  sl: "@a@b%a002010：连神明也只能苦笑了吧……\n@c0@"
  tl: "@a@b%a002010：連神明也只能苦笑了吧……\n@c0@"
80:
  en: "@a%0%a002020@bLook at all that food! How much can a belly hold before it busts?\n@c0@"
  ja: "@a@b%a002020「この　食べっぷりじゃ\n\tおなかも　いたくなるわ……。\n@c0@"
  ko: "@a@b%a002020: 이렇게 먹으니\n배가 안 아프고 배기겠어......\n@c0@"
  sl: "@a@b%a002020：这种吃法，\n　　肚子不吃坏才怪呢……\n@c0@"
  tl: "@a@b%a002020：這種吃法，\n　　肚子不吃壞才怪呢……\n@c0@"
81:
  en: "@a%0%a002030@bJust because one is lucky enough to live in Ghent, that does not mean one is able to wilfully disregard one's health.\n@c0@"
  ja: "@a@b%a002030「すぐに　なおして\n\tもらえるからといって\n\t食べすぎは　きんもつですね。\n@c0@"
  ko: "@a@b%a002030: 금방 낫게\n해 준다고 해서 \n과식하는 건 금물입니다.\n@c0@"
  sl: "@a@b%a002030：虽然吃坏了肚子\n　　能够立刻治好，\n　　但是也不能这么暴饮暴食啊。\n@c0@"
  tl: "@a@b%a002030：雖然吃壞了肚子\n　　能夠立刻治好，\n　　但是也不能這麼暴飲暴食啊。\n@c0@"
82:
  en: "@a%0%a002050@bMaybe he should show his gratitude to the Goddess by takin' the odd break from eatin'...\n@c0@"
  ja: "@a@b%a002050「おなかが　いたくなるまで\n\t食べるのは　神さまの　おかげじゃ\n\tないですよ！\n@c0@"
  ko: "@a@b%a002050: 배가 아플 때까지\n먹는 건 신 덕분이\n아니라구요!\n@c0@"
  sl: "@a@b%a002050：神明可没有让你\n　　吃到肚子疼哦！\n@c0@"
  tl: "@a@b%a002050：神明可沒有讓你\n　　吃到肚子疼哦！\n@c0@"
83:
  en: "@a%0%a002000@bWhy don't she get her hubby to make his own dinner? That'd teach him!\n@c0@"
  ja: "@a@b%a002000「ダンナの食事を\n\tすこし　へらしたほうが\n\tいいんじゃないか……？\n@c0@"
  ko: "@a@b%a002000: 남편 식사를\n좀 줄이는 게\n좋지 않을까......?\n@c0@"
  sl: "@a@b%a002000：让你老公少吃点吧……\n@c0@"
  tl: "@a@b%a002000：讓你老公少吃點吧……\n@c0@"
84:
  en: "@a%0%a002010@bHer husband may be greedy, but at least he's healthy.\n@c0@"
  ja: "@a@b%a002010「なには　ともあれ\n\t元気そうなのは　なによりね。\n@c0@"
  ko: "@a@b%a002010: 어쨌든\n건강해져서 다행이네.\n@c0@"
  sl: "@a@b%a002010：身体健康才是最重要的呢。\n@c0@"
  tl: "@a@b%a002010：身體健康才是最重要的呢。\n@c0@"
85:
  en: "@a%0%a002020@bHow much do you wanna bet her husband packs away more than the cows?\n@c0@"
  ja: "@a@b%a002020「この　おじさん\n\tひょっとしたら　ウシより\n\t食べてるんじゃないの……？\n@c0@"
  ko: "@a@b%a002020: 이 아저씨\n혹시 소보다 더\n많이 먹는 거 아냐......?\n@c0@"
  sl: "@a@b%a002020：这个大叔，\n　　难不成吃得\n　　比牛还多？\n@c0@"
  tl: "@a@b%a002020：這個大叔，\n　　難不成吃得\n　　比牛還多？\n@c0@"
86:
  en: "@a%0%a002030@bHer husband appears to have learnt his eating habits from those cows. I disapprove of such gluttony.\n@c0@"
  ja: "@a@b%a002030「何ごとも\n\tほどほどが　いいのです。\n@c0@"
  ko: "@a@b%a002030: 뭐든\n정도껏 하는 게 좋습니다.\n@c0@"
  sl: "@a@b%a002030：凡事都要有个度啊。\n@c0@"
  tl: "@a@b%a002030：凡事都要有個度啊。\n@c0@"
87:
  en: "@a%0%a002050@bIf this woman's husband keeps eatin' like a cow, he might just turn into one!\n@c0@"
  ja: "@a@b%a002050「私…　こちらの\n\tウシさんと　ダンナさんの顔が\n\tおなじに　見えてきました……。\n@c0@"
  ko: "@a@b%a002050: 저... 여기 있는\n소와 아저씨의 얼굴이\n똑같아 보이기 시작했어요......\n@c0@"
  sl: "@a@b%a002050：在我眼中，\n　　您先生的脸和牛看起来是一样的……\n@c0@"
  tl: "@a@b%a002050：在我眼中，\n　　您先生的臉和牛看起來是一樣的……\n@c0@"
88:
  en: "@a%0%a002000@bAll the martial arts abilities in the world won't stop sickness, aye?\n@c0@"
  ja: "@a@b%a002000「なくならない　っていう\n\t意味なら　病気や　ケガのほうが\n\t魔王より　こわいよな。\n@c0@"
  ko: "@a@b%a002000: 없어지지 않는다는\n면에서는 병이나 상처가\n마왕보다 무섭겠군.\n@c0@"
  sl: "@a@b%a002000：魔王消失不见了，\n　　但是伤病却没有消失啊。\n　　这么看来伤病比魔王更可怕啊。\n@c0@"
  tl: "@a@b%a002000：魔王消失不見了，\n　　但是傷病卻沒有消失啊。\n　　這麼看來傷病比魔王更可怕啊。\n@c0@"
89:
  en: "@a%0%a002010@bThe Ghentiles devote their lives to helping others. How humbling...\n@c0@"
  ja: "@a@b%a002010「人の　役にたつことが\n\t村の人たちの　生きがいなのね……\n\tほんと　すばらしいわ。\n@c0@"
  ko: "@a@b%a002010: 남에게 도움이 되는 게\n마을 사람들의 보람이라니......\n정말 훌륭해.\n@c0@"
  sl: "@a@b%a002010：这个村的人们\n　　将服务于他人作为人生目标呢……\n　　真是太棒了。\n@c0@"
  tl: "@a@b%a002010：這個村的人們\n　　將服務于他人作為人生目標呢……\n　　真是太棒了。\n@c0@"
90:
  en: "@a%0%a002020@bI certainly know where to go the next time I get sick!\n@c0@"
  ja: "@a@b%a002020「あたしも　病気したら\n\tよろしく　おねがいしまーす！\n@c0@"
  ko: "@a@b%a002020: 저도 병에 걸리면\n잘 부탁해요~!\n@c0@"
  sl: "@a@b%a002020：要是我哪天生了病，\n　　就拜托你们了！\n@c0@"
  tl: "@a@b%a002020：要是我哪天生了病，\n　　就拜託你們了！\n@c0@"
91:
  en: "@a%0%a002030@bI am inspired once again by the healing powers of Ghent. I too must strive to improve myself.\n@c0@"
  ja: "@a@b%a002030「もっと　もっと\n\t私も　がんばりましょう。\n@c0@"
  ko: "@a@b%a002030: 저도 지금보다 더\n열심히 할 겁니다.\n@c0@"
  sl: "@a@b%a002030：我还要继续努力才行！\n@c0@"
  tl: "@a@b%a002030：我還要繼續努力才行！\n@c0@"
92:
  en: "@a%0%a002050@bEverythin' I heard about Ghent is true! It's a special place, and no mistake!\n@c0@"
  ja: "@a@b%a002050「ゲントの　みなさんは\n\t本当に　すごいですよね！\n@c0@"
  ko: "@a@b%a002050: 겐트 마을 여러분들은\n정말 대단하네요!\n@c0@"
  sl: "@a@b%a002050：根特族的人们\n　　真是太厉害了！\n@c0@"
  tl: "@a@b%a002050：根特族的人們\n　　真是太厲害了！\n@c0@"
93:
  en: "@a%0%a002050@bAll this healin' seems to be goin' on free of charge! Now that's what I call a miracle!\n@c0@"
  ja: "@a@b%a002050「ふつうだったら\n\tお金　とりません？\n\tなんと　ぜんぶ　タダですよ！？\n@c0@"
  ko: "@a@b%a002050: 이런 거 보통\n돈 받고 하지 않나요?\n근데 다 공짜로 해 주잖아요!\n@c0@"
  sl: "@a@b%a002050：通常看病要收钱的吧？\n　　他们居然不要钱？！\n@c0@"
  tl: "@a@b%a002050：通常看病要收錢的吧？\n　　他們居然不要錢？！\n@c0@"
94:
  en: "@a%0%a002000@bLooks like we might be interruptin' somethin'...\n@c0@"
  ja: "@a@b%a002000「おっと\n\t病人の　しんさつ中か。\n@c0@"
  ko: "@a@b%a002000: 이런,\n환자 진찰 중이었군.\n@c0@"
  sl: "@a@b%a002000：啊，\n　　正在给病人看病啊。\n@c0@"
  tl: "@a@b%a002000：啊，\n　　正在給病人看病啊。\n@c0@"
95:
  en: "@a%0%a002010@bLet's stay out of the way and observe the Elder at work.\n@c0@"
  ja: "@a@b%a002010「しばらく\n\tようすを　みましょうか。\n@c0@"
  ko: "@a@b%a002010: 잠시\n지켜보도록 하자.\n@c0@"
  sl: "@a@b%a002010：再观察一阵子吧。\n@c0@"
  tl: "@a@b%a002010：再觀察一陣子吧。\n@c0@"
96:
  en: "@a%0%a002020@bHmm. They must have come all this way from some remote village...\n@c0@"
  ja: "@a@b%a002020「とおくの　村から\n\t来たひとたち　みたいね。\n@c0@"
  ko: "@a@b%a002020: 옆 마을에서\n온 사람들인가 봐.\n@c0@"
  sl: "@a@b%a002020：好像是从\n　　远方的村庄来的人吧。\n@c0@"
  tl: "@a@b%a002020：好像是從\n　　遠方的村莊來的人吧。\n@c0@"
97:
  en: "@a%0%a002030@bLet us watch and witness the healing powers of the Elder of Ghent at work.\n@c0@"
  ja: "@a@b%a002030「まあ　みていてください。\n\tすぐに　なおりますよ。\n@c0@"
  ko: "@a@b%a002030: 한번 지켜보세요.\n금방 나을 겁니다.\n@c0@"
  sl: "@a@b%a002030：请看着吧。\n　　马上就治好了哦。\n@c0@"
  tl: "@a@b%a002030：請看著吧。\n　　馬上就治好了哦。\n@c0@"
98:
  en: "@a%0%a002050@bI wonder what the matter could be...\n@c0@"
  ja: "@a@b%a002050「おやっ\n\tどうなさったんでしょうね。\n@c0@"
  ko: "@a@b%a002050: 어라,\n어디가 편찮으신 걸까요.\n@c0@"
  sl: "@a@b%a002050：哎呀，\n　　效果如何呢。\n@c0@"
  tl: "@a@b%a002050：哎呀，\n　　效果如何呢。\n@c0@"
99:
  en: "@a%0%a002000@bShe's havin' a rotten day. I wonder what her story is...\n@c0@"
  ja: "@a@b%a002000「ずいぶん\n\t苦しそうだぜ……。\n@c0@"
  ko: "@a@b%a002000: 상당히\n힘들어 보이는걸......\n@c0@"
  sl: "@a@b%a002000：好像被病痛折腾得很惨呢……\n@c0@"
  tl: "@a@b%a002000：好像被病痛折騰得很慘呢……\n@c0@"
100:
  en: "@a%0%a002010@bShe seems to be in terrible shape...\n@c0@"
  ja: "@a@b%a002010「こんなに　せきこんで……。\n@c0@"
  ko: "@a@b%a002010: 저렇게 심하게 기침을......\n@c0@"
  sl: "@a@b%a002010：咳得这么厉害……\n@c0@"
  tl: "@a@b%a002010：咳得這麼厲害……\n@c0@"
101:
  en: "@a%0%a002020@bAww... Poor lady.\n@c0@"
  ja: "@a@b%a002020「おばあさん\n\tかわいそう……\n@c0@"
  ko: "@a@b%a002020: 할머니\n정말 안됐다......\n@c0@"
  sl: "@a@b%a002020：老奶奶好可怜……\n@c0@"
  tl: "@a@b%a002020：老奶奶好可憐……\n@c0@"
102:
  en: "@a%0%a002030@bThis is no mere case of indigestion. This poor woman is gravely ill.\n@c0@"
  ja: "@a@b%a002030「うーん　かなり重い\n\t病気の　ようですね。\n@c0@"
  ko: "@a@b%a002030: 으음, 꽤 중한\n병인가 봅니다.\n@c0@"
  sl: "@a@b%a002030：好像病得不轻呢。\n@c0@"
  tl: "@a@b%a002030：好像病得不輕呢。\n@c0@"
103:
  en: "@a%0%a002050@bIt sounds like her son's havin' a tough time of it too!\n@c0@"
  ja: "@a@b%a002050「せきを　すると\n\t思いのほか　体力を\n\tつかいますからね……。\n@c0@"
  ko: "@a@b%a002050: 기침을 하면\n의외로 체력을\n많이 소모하죠......\n@c0@"
  sl: "@a@b%a002050：真想不到\n　　咳嗽其实\n　　挺耗费体力的呢……\n@c0@"
  tl: "@a@b%a002050：真想不到\n　　咳嗽其實\n　　挺耗費體力的呢……\n@c0@"
104:
  en: "@a%0%a002000@bJust listenin' to the Elder's soothin' voice seems to have fixed up all my aches and pains!\n@c0@"
  ja: "@a@b%a002000「長老の　話をきくと\n\tケガだけじゃなく　つかれていた\n\t気持ちまで　元気になるぜ！\n@c0@"
  ko: "@a@b%a002000: 장로의 말을 들으니\n상처뿐 아니라 피곤한\n마음까지 건강해지는 기분이군!\n@c0@"
  sl: "@a@b%a002000：听了长老的话，\n　　别说伤病了，\n　　连疲惫都消失得一干二净了呢！\n@c0@"
  tl: "@a@b%a002000：聽了長老的話，\n　　別說傷病了，\n　　連疲憊都消失得一乾二淨了呢！\n@c0@"
105:
  en: "@a%0%a002010@bWe really are indebted to the Elder for blessing us with health and courage.\n@c0@"
  ja: "@a@b%a002010「長老さま……\n\tいつも　わたしたちに\n\t元気と　勇気を　ありがとう。\n@c0@"
  ko: "@a@b%a002010: 장로님......\n항상 우리에게 기운과 용기를\n북돋워 주셔서 고마워요.\n@c0@"
  sl: "@a@b%a002010：长老大人……\n　　谢谢您一直鼓励我们，\n　　让我们精神百倍，勇往直前。\n@c0@"
  tl: "@a@b%a002010：長老大人……\n　　謝謝您一直鼓勵我們，\n　　讓我們精神百倍，勇往直前。\n@c0@"
106:
  en: "@a%0%a002020@bWith the Ghentiles on our side, how can we lose?\n@c0@"
  ja: "@a@b%a002020「ありがとう　長老さま。\n\tあたしたち　がんばってくる！\n@c0@"
  ko: "@a@b%a002020: 고마워요, 장로님.\n우리 잘하고 올게요!\n@c0@"
  sl: "@a@b%a002020：谢谢您，长老大人。\n　　我们会努力的！\n@c0@"
  tl: "@a@b%a002020：謝謝您，長老大人。\n　　我們會努力的！\n@c0@"
107:
  en: "@a%0%a002030@bI will not let the people of Ghent down! I will come to the aid of all those who are suffering!\n@c0@"
  ja: "@a@b%a002030「おじいさま。\n\t私は　かならずや　世界の人々の\n\t助けとなってみせます。\n@c0@"
  ko: "@a@b%a002030: 할아버님.\n저는 반드시 세상 사람들에게\n힘이 되겠습니다.\n@c0@"
  sl: "@a@b%a002030：爷爷。\n　　我一定会竭尽全力\n　　帮助世界各地的人们。\n@c0@"
  tl: "@a@b%a002030：爺爺。\n　　我一定會竭盡全力\n　　幫助世界各地的人們。\n@c0@"
108:
  en: "@a%0%a002050@bI'm truly blessed to be gettin' this kind of treatment in Ghent! I don't know if I deserve it!\n@c0@"
  ja: "@a@b%a002050「長老さま！\n\tゲントの神の　祝福を\n\tありがとうございます！\n@c0@"
  ko: "@a@b%a002050: 장로님!\n겐트 신의 축복을 주셔서\n감사합니다!\n@c0@"
  sl: "@a@b%a002050：长老大人！\n　　谢谢您赐予我们\n　　根特族的祝福！\n@c0@"
  tl: "@a@b%a002050：長老大人！\n　　謝謝您賜予我們\n　　根特族的祝福！\n@c0@"
109:
  en: "@a%0%a002000@bI never get sick. But in case I do, bring me straight to the Elder of Ghent! He's amazing!\n@c0@"
  ja: "@a@b%a002000「やっぱり\n\t%a002030の　じいさんは\n\tすごい人だぜ！\n@c0@"
  ko: "@a@b%a002000: 역시\n%a002030의 할아버지는\n대단한 사람이군!\n@c0@"
  sl: "@a@b%a002000：%a002030的爷爷，\n　　果然很厉害啊！\n@c0@"
  tl: "@a@b%a002000：%a002030的爺爺，\n　　果然很厲害啊！\n@c0@"
110:
  en: "@a%0%a002010@bThank the Goddess... His mother seems to have been cured.\n@c0@"
  ja: "@a@b%a002010「お母さま　すっかり\n\tらくになった　みたいね。\n@c0@"
  ko: "@a@b%a002010: 어머님은 한층\n편해지신 모양이네.\n@c0@"
  sl: "@a@b%a002010：你母亲好像\n　　已经痊愈了呢。\n@c0@"
  tl: "@a@b%a002010：你母親好像\n　　已經痊癒了呢。\n@c0@"
111:
  en: "@a%0%a002020@bWow! She was that poorly, and the Elder fixed her up just like that! Incredible!\n@c0@"
  ja: "@a@b%a002020「それほど重い　病気を\n\t長老さまは　あっというまに\n\tなおしちゃったんだ　すっごーい！\n@c0@"
  ko: "@a@b%a002020: 그 정도로 중한 병을\n장로님은 순식간에\n고쳐 버리는구나. 대단해~!\n@c0@"
  sl: "@a@b%a002020：这么重的病，\n　　长老大人居然这么轻松就治好了！\n　　太厉害了！\n@c0@"
  tl: "@a@b%a002020：這麼重的病，\n　　長老大人居然這麼輕鬆就治好了！\n　　太厲害了！\n@c0@"
112:
  en: "@a%0%a002030@bAiding those in distress is what gives the people of Ghent their purpose in life.\n@c0@"
  ja: "@a@b%a002030「人びとの　くるしみを\n\tいやすことが　私たちの\n\t生きがいなのです。\n@c0@"
  ko: "@a@b%a002030: 사람들의 괴로움을\n치유하는 것이 저희의\n보람입니다.\n@c0@"
  sl: "@a@b%a002030：将人们从痛苦中拯救出来，\n　　这就是我们存在的意义。\n@c0@"
  tl: "@a@b%a002030：將人們從痛苦中拯救出來，\n　　這就是我們存在的意義。\n@c0@"
113:
  en: "@a%0%a002050@bSo that old dear was at death's door, but the Elder brought her back from the brink?\n@c0@"
  ja: "@a@b%a002050「なおる見こみのない\n\t病気すら　なおしてしまう……\n@c0@"
  ko: "@a@b%a002050: 나을 가망이 없는\n병까지 고친다니......\n@c0@"
  sl: "@a@b%a002050：居然治好了\n　　这种不治之症……\n@c0@"
  tl: "@a@b%a002050：居然治好了\n　　這種不治之症……\n@c0@"
114:
  en: "@a%0%a002050@bI take my helmet off to the Elder of Ghent!\n@c0@"
  ja: "@a@b%a002050「長老さまこそ\n\t神さまに　見えますよ！\n@c0@"
  ko: "@a@b%a002050: 장로님이야말로 마치\n신으로 보이는군요!\n@c0@"
  sl: "@a@b%a002050：我从长老大人身上\n　　看到了神的影子！\n@c0@"
  tl: "@a@b%a002050：我從長老大人身上\n　　看到了神的影子！\n@c0@"
115:
  en: "@a%0%a002000@bWell, she seems to be dozin' peacefully now.\n@c0@"
  ja: "@a@b%a002000「すっかり　よくなった\n\tみたいだな。\n@c0@"
  ko: "@a@b%a002000: 완전히 나은\n모양이군.\n@c0@"
  sl: "@a@b%a002000：好像已经痊愈了吧。\n@c0@"
  tl: "@a@b%a002000：好像已經痊癒了吧。\n@c0@"
116:
  en: "@a%0%a002010@bHer difficulties seem to have eased.\n@c0@"
  ja: "@a@b%a002010「ねいきが　やすらかね。\n@c0@"
  ko: "@a@b%a002010: 숨소리가 편안하네.\n@c0@"
  sl: "@a@b%a002010：睡觉的呼吸也平稳下来了呢。\n@c0@"
  tl: "@a@b%a002010：睡覺的呼吸也平穩下來了呢。\n@c0@"
117:
  en: "@a%0%a002020@bShe's out like a candle. This is probably her first good rest in a while, huh?\n@c0@"
  ja: "@a@b%a002020「ぐっすり　ねむってる……\n\tきっと　これまで　苦しくて\n\tじゅうぶん　ねむれなかったのね。\n@c0@"
  ko: "@a@b%a002020: 깊이 잠들어 있어......\n분명 지금까지는 괴로워서\n충분히 주무실 수도 없었을 거야.\n@c0@"
  sl: "@a@b%a002020：睡得真香……\n　　之前一定因为病痛，\n　　没怎么好好睡过觉吧。\n@c0@"
  tl: "@a@b%a002020：睡得真香……\n　　之前一定因為病痛，\n　　沒怎麼好好睡過覺吧。\n@c0@"
118:
  en: "@a%0%a002030@bHer countenance looks remarkably trouble-free. I pray that she enjoys good health for many years to come.\n@c0@"
  ja: "@a@b%a002030「この　ようすなら\n\tもう　完全に　大丈夫ですね。\n@c0@"
  ko: "@a@b%a002030: 이 모습을 보니\n이제 마음을 놓아도 되겠군요.\n@c0@"
  sl: "@a@b%a002030：看这个样子，\n　　应该已经没事了吧。\n@c0@"
  tl: "@a@b%a002030：看這個樣子，\n　　應該已經沒事了吧。\n@c0@"
119:
  en: "@a%0%a002050@bShe's lucky to have such a carin' son, despite all the flak he has to put up with.\n@c0@"
  ja: "@a@b%a002050「こんな　親孝行な\n\tムスコさんを　持って\n\tおかあさんも　しあわせですね！\n@c0@"
  ko: "@a@b%a002050: 이런\n효자를 둔 어머니도\n행복한 사람이군요!\n@c0@"
  sl: "@a@b%a002050：有这么个孝顺的儿子，\n　　做母亲的真幸福啊！\n@c0@"
  tl: "@a@b%a002050：有這麼個孝順的兒子，\n　　做母親的真幸福啊！\n@c0@"
120:
  en: "@a%0%a002000@bAll that effort has given us one fine ship!\n@c0@"
  ja: "@a@b%a002000「これから　ますます\n\t船旅が　多くなりそうだしな。\n@c0@"
  ko: "@a@b%a002000: 앞으로는 점점\n배 여행이 많아질 것 같고.\n@c0@"
  sl: "@a@b%a002000：今后坐船的旅行\n　　会增多吧。\n@c0@"
  tl: "@a@b%a002000：今後坐船的旅行\n　　會增多吧。\n@c0@"
121:
  en: "@a%0%a002000@bLooks like we'll be gettin' a lot more use out of her from here on out!\n@c0@"
  ja: "@a@b%a002000「ほんとに\n\tこの村の　人たちには\n\tおんにきるぜ。\n@c0@"
  ko: "@a@b%a002000: 이 마을\n사람들한테는 정말\n신세 많이 졌군.\n@c0@"
  sl: "@a@b%a002000：真是，\n　　欠这个村的人一份人情了啊。\n@c0@"
  tl: "@a@b%a002000：真是，\n　　欠這個村的人一份人情了啊。\n@c0@"
122:
  en: "@a%0%a002010@bShe's a worthy vessel indeed. Thanks to the Providence, we can explore new lands we were unable to reach before.\n@c0@"
  ja: "@a@b%a002010「神の船の　おかげで\n\tこれまで　行けなかったところも\n\tあちこち　探検できるのよね。\n@c0@"
  ko: "@a@b%a002010: 신의 배 덕분에\n지금까지 갈 수 없었던 곳도\n여기저기 탐색할 수 있게 되었어.\n@c0@"
  sl: "@a@b%a002010：多亏了神之船，\n　　之前去不了的那些地方，\n　　现在也可以去探险了呢。\n@c0@"
  tl: "@a@b%a002010：多虧了神之船，\n　　之前去不了的那些地方，\n　　現在也可以去探險了呢。\n@c0@"
123:
  en: "@a%0%a002020@bShe's a smooth ride, alright! I haven't lost my lunch once while aboard her!\n@c0@"
  ja: "@a@b%a002020「乗りごこちも　最高よね。\n\tあたし　あれから　ちっとも\n\t船よい　しないもの。\n@c0@"
  ko: "@a@b%a002020: 승선감도 최고야.\n나, 그 이후로 한 번도\n배멀미를 안 했거든.\n@c0@"
  sl: "@a@b%a002020：这船坐着真舒服啊。\n　　从那之后我就\n　　再也没晕过船了。\n@c0@"
  tl: "@a@b%a002020：這船坐著真舒服啊。\n　　從那之後我就\n　　再也沒暈過船了。\n@c0@"
124:
  en: "@a%0%a002030@bThere is indeed no worthier vessel on the ocean waves. Wouldn't you agree, %a000090?\n@c0@"
  ja: "@a@b%a002030「もちろん　神の船は\n\tいつも快調ですとも。\n\tね？　%a000090さん。\n@c0@"
  ko: "@a@b%a002030: 물론 신의 배는\n언제나 순항 중이지요.\n그렇죠? %a000090 님.\n@c0@"
  sl: "@a@b%a002030：神之船一直都是\n　　处于最佳状态哦。\n　　对吧，%a000090。\n@c0@"
  tl: "@a@b%a002030：神之船一直都是\n　　處於最佳狀態哦。\n　　對吧，%a000090。\n@c0@"
125:
  en: "@a%0%a002050@bNow there's a lad who loves his ship!\n@c0@"
  ja: "@a@b%a002050「その　自信にみちた\n\t笑いごえが　たのもしいです！\n@c0@"
  ko: "@a@b%a002050: 그 자신감 넘치는\n웃음소리를 들으니 든든하군요!\n@c0@"
  sl: "@a@b%a002050：听到这么自信满满的笑声，\n　　心里真踏实！\n@c0@"
  tl: "@a@b%a002050：聽到這麼自信滿滿的笑聲，\n　　心裡真踏實！\n@c0@"
126:
  en: "@a%0%a002000@bAye, it's always a plus to have the Goddess on your side!\n@c0@"
  ja: "@a@b%a002000「よほど　がんじょうに\n\tできてるんだろうな。\n@c0@"
  ko: "@a@b%a002000: 정말 튼튼하게\n만들어졌나 보군.\n@c0@"
  sl: "@a@b%a002000：这船修得真结实啊。\n@c0@"
  tl: "@a@b%a002000：這船修得真結實啊。\n@c0@"
127:
  en: "@a%0%a002010@bI have indeed sensed a remarkable power protecting us whenever we are aboard the Providence.\n@c0@"
  ja: "@a@b%a002010「神の船に　乗ると\n\tなにか　ふしぎな力に\n\tまもられているのを　感じるわ。\n@c0@"
  ko: "@a@b%a002010: 신의 배를 타면\n왠지 신비한 힘의 수호를\n받는 듯한 기분이 들어.\n@c0@"
  sl: "@a@b%a002010：每次坐上神之船，\n　　都能感觉到自己\n　　被一股神奇的力量保护着呢。\n@c0@"
  tl: "@a@b%a002010：每次坐上神之船，\n　　都能感覺到自己\n　　被一股神奇的力量保護著呢。\n@c0@"
128:
  en: "@a%0%a002020@bI don't need any convincing — that ship is unsinkable!\n@c0@"
  ja: "@a@b%a002020「うん　あたし　信じるよ。\n\t神の船が　しずむはず\n\tないもんね！\n@c0@"
  ko: "@a@b%a002020: 응, 난 믿어.\n신의 배가 침몰할 리가\n없어!\n@c0@"
  sl: "@a@b%a002020：嗯！我相信\n　　神之船是不可能沉的！\n@c0@"
  tl: "@a@b%a002020：嗯！我相信\n　　神之船是不可能沉的！\n@c0@"
129:
  en: "@a%0%a002030@bI too used to tend to the Providence every day. Those were happy times indeed!\n@c0@"
  ja: "@a@b%a002030「私も　村にいたころは\n\tまいにち　船の手入れに\n\t参加していました。\n@c0@"
  ko: "@a@b%a002030: 저도 마을에 있을 때는\n매일 배 관리에\n참여했었죠.\n@c0@"
  sl: "@a@b%a002030：我还在村子里的时候，\n　　每天都要\n　　参加船的维护工作。\n@c0@"
  tl: "@a@b%a002030：我還在村子裡的時候，\n　　每天都要\n　　參加船的維護工作。\n@c0@"
130:
  en: "@a%0%a002050@bI'm glad to hear the Providence can't sink, but I'm not too keen on putting the theory to the test!\n@c0@"
  ja: "@a@b%a002050「……とはいえ　ためしに\n\t荒波に　もまれてみる　なんてのは\n\tゴメンですよね。\n@c0@"
  ko: "@a@b%a002050: ......그렇다고 시험 삼아\n풍파를 만나고 싶지는\n않군요.\n@c0@"
  sl: "@a@b%a002050：……话虽这么说，\n　　还是别想着试试这船结不结实，\n　　跑到大风大浪中去吧。\n@c0@"
  tl: "@a@b%a002050：……話雖這麼說，\n　　還是別想著試試這船結不結實，\n　　跑到大風大浪中去吧。\n@c0@"
131:
  en: "@a%0%a002000@bNow, where was the Providence anchored again?\n@c0@"
  ja: "@a@b%a002000「そういえば　神の船は\n\tどこに　あるんだっけか……？\n@c0@"
  ko: "@a@b%a002000: 그러고 보니 신의 배는\n어디에 있었더라......?\n@c0@"
  sl: "@a@b%a002000：话说回来，\n　　神之船停到哪里去了？\n@c0@"
  tl: "@a@b%a002000：話說回來，\n　　神之船停到哪裡去了？\n@c0@"
132:
  en: "@a%0%a002000@bDidn't someone say somethin' about the coast to the east of Somnia Castle? Aye, that was it!\n@c0@"
  ja: "@a@b%a002000「あっ！　レイドック城の\n\t東がわが　海岸だったから\n\tそこに　あるかもな！\n@c0@"
  ko: "@a@b%a002000: 앗! 레이독 성의\n동쪽이 해안이니까\n그쪽에 있을지도 모르겠군!\n@c0@"
  sl: "@a@b%a002000：对了！\n　　雷多克城东边是个海岸。\n　　船可能在那里！\n@c0@"
  tl: "@a@b%a002000：對了！\n　　雷多克城東邊是個海岸。\n　　船可能在那裡！\n@c0@"
133:
  en: "@a%0%a002000@bLet's shove off already!\n@c0@"
  ja: "@a@b%a002000「よっしゃー\n\t行くぜ　行くぜ！\n@c0@"
  ko: "@a@b%a002000: 좋아~\n가 보자고!\n@c0@"
  sl: "@a@b%a002000：好！\n　　走着！走着！\n@c0@"
  tl: "@a@b%a002000：好！\n　　走著！走著！\n@c0@"
134:
  en: "@a%0%a002000@bI don't know what's waitin' for us out in the big, bad world, but I can't wait to find out!\n@c0@"
  ja: "@a@b%a002000「どこで　何が\n\t待ってるのか　知らないが\n\t世界中を　まわってやろうぜ！\n@c0@"
  ko: "@a@b%a002000: 어디에 뭐가\n기다리고 있을지 모르겠지만\n온 세계를 돌아 줄 테다!\n@c0@"
  sl: "@a@b%a002000：环游世界去吧！\n　　管他路上\n　　会碰到些啥！\n@c0@"
  tl: "@a@b%a002000：環遊世界去吧！\n　　管他路上\n　　會碰到些啥！\n@c0@"
135:
  en: "@a%0%a002010@bIf we're going to be travelling around the world, I'd certainly rather do it in a ship than on foot.\n@c0@"
  ja: "@a@b%a002010「世界を　めぐるのなら\n\t歩くより　船旅だわね。\n@c0@"
  ko: "@a@b%a002010: 세계를 돌려면 역시\n걷는 것보다는 배 여행이야.\n@c0@"
  sl: "@a@b%a002010：要环游世界的话，\n　　坐船比走路来得快呢。\n@c0@"
  tl: "@a@b%a002010：要環遊世界的話，\n　　坐船比走路來得快呢。\n@c0@"
136:
  en: "@a%0%a002010@bI sense that our adventures are just beginning!\n@c0@"
  ja: "@a@b%a002010「これからが　本当の\n\t冒険の　はじまりよ！\n@c0@"
  ko: "@a@b%a002010: 지금부터가 진정한\n모험의 시작이라구!\n@c0@"
  sl: "@a@b%a002010：真正的冒险\n　　就要开始了！\n@c0@"
  tl: "@a@b%a002010：真正的冒險\n　　就要開始了！\n@c0@"
137:
  en: "@a%0%a002020@bGuess this is the start of a new adventure! I hope we find your double soon, %a000090!\n@c0@"
  ja: "@a@b%a002020「新しい旅の　はじまりね！\n\t早く　もうひとりの　%a000090も\n\t見つかると　いいなあ。\n@c0@"
  ko: "@a@b%a002020: 새로운 여행의 시작이구나!\n어서 또 하나의 %a000090도\n찾을 수 있게 되면 좋겠어.\n@c0@"
  sl: "@a@b%a002020：新旅程新气象！\n　　快点去找另外一个\n　　%a000090吧！\n@c0@"
  tl: "@a@b%a002020：新旅程新氣象！\n　　快點去找另外一個\n　　%a000090吧！\n@c0@"
138:
  en: "@a%0%a002020@bSo, uh, where to now, %a000090?\n@c0@"
  ja: "@a@b%a002020「ねえ　%a000090\n\tこれから　どこに行くの？\n@c0@"
  ko: "@a@b%a002020: 있잖아, %a000090.\n이제 어디로 갈 거야?\n@c0@"
  sl: "@a@b%a002020：%a000090，\n　　接下来去哪？\n@c0@"
  tl: "@a@b%a002020：%a000090，\n　　接下來去哪？\n@c0@"
139:
  en: "@a%0%a002020@bLet's go some place really, really far! What's the point of having a ship if we don't use it?\n@c0@"
  ja: "@a@b%a002020「やっぱ　船で\n\tどこか　遠くまで\n\t行ってみようよ！\n@c0@"
  ko: "@a@b%a002020: 이왕이면 배를 타고\n멀리까지\n가 보자!\n@c0@"
  sl: "@a@b%a002020：既然坐船的话，\n　　那就去远一点的地方\n　　看看怎么样！\n@c0@"
  tl: "@a@b%a002020：既然坐船的話，\n　　那就去遠一點的地方\n　　看看怎麼樣！\n@c0@"
140:
  en: "@a%0%a002030@bHmm... Where would the Providence be waiting...? Let us look near the coast to the east of Somnia Castle.\n@c0@"
  ja: "@a@b%a002030「えーと　船　船……と。\n\tレイドック東の　海岸に\n\t行ってみましょうか。\n@c0@"
  ko: "@a@b%a002030: 으음~ 배를 찾아야겠군요.\n레이독 동쪽 해안으로\n가 봅시다.\n@c0@"
  sl: "@a@b%a002030：话说……找船的话……\n　　去雷多克东边的海岸看看吧。\n@c0@"
  tl: "@a@b%a002030：話說……找船的話……\n　　去雷多克東邊的海岸看看吧。\n@c0@"
141:
  en: "@a%0%a002030@bA new adventure begins here. There are monsters yet to defeat, and %a000090's true self must be located.\n@c0@"
  ja: "@a@b%a002030「残りの　まものを　倒したり\n\t%a000090さんの　本体を　さがしたり\n\t新しい旅の　スタートですね。\n@c0@"
  ko: "@a@b%a002030: 남은 마물을 물리치고\n진짜 %a000090 님을 찾는\n새로운 여행이 시작되었군요.\n@c0@"
  sl: "@a@b%a002030：一边解决剩下的魔物，\n　　一边找%a000090的本来的身体，\n　　开始新的旅程吧。\n@c0@"
  tl: "@a@b%a002030：一邊解決剩下的魔物，\n　　一邊找%a000090的本來的身體，\n　　開始新的旅程吧。\n@c0@"
142:
  en: "@a%0%a002030@bIn the great tradition of the holy warriors of Ghent, my task is to fight for justice and peace, and to help those in need!\n@c0@"
  ja: "@a@b%a002030「これから　さらなる\n\t修行をして　世界の　人びとの\n\t役に立つ　人間に　なりたいです！\n@c0@"
  ko: "@a@b%a002030: 앞으로도 계속\n수련을 거듭해서 온 세상 사람들에게\n도움이 되는 사람이 되고 싶습니다!\n@c0@"
  sl: "@a@b%a002030：今后我要更加\n　　精进修行，尽力去\n　　帮助世界上的人们！\n@c0@"
  tl: "@a@b%a002030：今後我要更加\n　　精進修行，盡力去\n　　幫助世界上的人們！\n@c0@"
143:
  en: "@a%0%a002000@bThere's a town up ahead. Worth takin' a look, aye, %a000090?\n@c0@"
  ja: "@a@b%a002000「この先に　進めば\n\t町があるってわけだな。\n\tどうする？　%a000090。\n@c0@"
  ko: "@a@b%a002000: 이 앞으로 가면\n마을이 있겠군.\n어떻게 할까? %a000090.\n@c0@"
  sl: "@a@b%a002000：再往前走的话\n　　好像有个城镇。\n　　咋办？%a000090。\n@c0@"
  tl: "@a@b%a002000：再往前走的話\n　　好像有個城鎮。\n　　咋辦？%a000090。\n@c0@"
144:
  en: "@a%0%a002010@bWe're not in any particular hurry. Why don't we pay this town a quick visit?\n@c0@"
  ja: "@a@b%a002010「いそぐ　旅でもないし\n\tちょっと　寄ってみるのも\n\t悪くないかも　しれないわね。\n@c0@"
  ko: "@a@b%a002010: 서두를 것도 없으니\n잠시 들렀다 가는 것도\n나쁘지 않을 것 같아.\n@c0@"
  sl: "@a@b%a002010：反正我们也不急着赶路，\n　　去那里看看\n　　倒也无妨。\n@c0@"
  tl: "@a@b%a002010：反正我們也不急著趕路，\n　　去那裡看看\n　　倒也無妨。\n@c0@"
145:
  en: "@a%0%a002020@bHmm. Scrimsley, huh? Wonder what it's like...\n@c0@"
  ja: "@a@b%a002020「ふ～ん　モンストルかあ。\n\tどんな　町なんだろうね！\n@c0@"
  ko: "@a@b%a002020: 호오~ 몬스톨이라.\n어떤 마을일까!\n@c0@"
  sl: "@a@b%a002020：唔～蒙斯托尔啊。\n　　那是个怎样的城镇呢？\n@c0@"
  tl: "@a@b%a002020：唔～蒙斯托爾啊。\n　　那是個怎樣的城鎮呢？\n@c0@"
146:
  en: "@a%0%a002030@bI have heard tell of the town of Scrimsley, but I haven't yet had the opportunity to visit it.\n@c0@"
  ja: "@a@b%a002030「モンストルという\n\t町があるのは　知っていましたが\n\t訪ねたことは　ありませんね。\n@c0@"
  ko: "@a@b%a002030: 몬스톨이라는\n마을이 있다는 것은 알고 있었지만\n방문해 본 적은 없습니다.\n@c0@"
  sl: "@a@b%a002030：我倒是听说过\n　　蒙斯托尔镇的名字，\n　　但是没有去过那里。\n@c0@"
  tl: "@a@b%a002030：我倒是聽說過\n　　蒙斯托爾鎮的名字，\n　　但是沒有去過那裡。\n@c0@"
147:
  en: "@a%0%a002000@bThe mountains around here are rough. My calves are on fire!\n@c0@"
  ja: "@a@b%a002000「この　あたりは\n\tけわしい山が　多いよなあ。\n\t移動も　楽じゃないぜ。\n@c0@"
  ko: "@a@b%a002000: 이 부근에는\n험준한 산이 많군.\n이동하기가 쉽지 않아.\n@c0@"
  sl: "@a@b%a002000：这一带的山\n　　还真是险峻啊。\n　　都快累死俺了。\n@c0@"
  tl: "@a@b%a002000：這一帶的山\n　　還真是險峻啊。\n　　都快累死俺了。\n@c0@"
148:
  en: "@a%0%a002010@bThis area is full of monsters that we haven't encountered before...\n@c0@"
  ja: "@a@b%a002010「この　あたりには\n\t今まで　見たことのない\n\tまものが　たくさんいるわ……。\n@c0@"
  ko: "@a@b%a002010: 이 주변엔\n지금까지 보지 못했던\n마물이 많이 있어......\n@c0@"
  sl: "@a@b%a002010：这一带有好多\n　　之前没有见过的魔物呢……\n@c0@"
  tl: "@a@b%a002010：這一帶有好多\n　　之前沒有見過的魔物呢……\n@c0@"
149:
  en: "@a%0%a002010@bWe had better focus until we become accustomed to fighting them.\n@c0@"
  ja: "@a@b%a002010「新しい　まものとの\n\t戦いに　なれるまでは\n\tしんちょうに　いきましょうね。\n@c0@"
  ko: "@a@b%a002010: 새로운 마물과의\n전투에 익숙해질 때까지는\n신중하게 가도록 하자.\n@c0@"
  sl: "@a@b%a002010：在习惯和\n　　新出现的魔物战斗之前，\n　　还是小心前进吧。\n@c0@"
  tl: "@a@b%a002010：在習慣和\n　　新出現的魔物戰鬥之前，\n　　還是小心前進吧。\n@c0@"
150:
  en: "@a%0%a002020@bI dunno why, but I just have the best time on the road with you folks. Weird, huh?\n@c0@"
  ja: "@a@b%a002020「あたしねー　こうして\n\tみんなと　歩いているだけでも\n\t楽しいの。　なんでだろうね！\n@c0@"
  ko: "@a@b%a002020: 나 있잖아~ 이렇게\n너희랑 걷는 것만으로도\n즐거워. 왜일까!\n@c0@"
  sl: "@a@b%a002020：只要和大家在一起，\n　　哪怕只是简简单单的走路，\n　　我都觉得很开心。为什么呢？\n@c0@"
  tl: "@a@b%a002020：只要和大家在一起，\n　　哪怕只是簡簡單單的走路，\n　　我都覺得很開心。爲什麽呢？\n@c0@"
151:
  en: "@a%0%a002030@bThere is certainly no shortage of mountains in this locale. I am afraid mountaineering is not my forte...\n@c0@"
  ja: "@a@b%a002030「山　また山……。\n\tそんな　感じの　地形ですね\n\tこのあたりは。\n@c0@"
  ko: "@a@b%a002030: 산 너머 산......\n그런 지형이네요.\n이 부근은.\n@c0@"
  sl: "@a@b%a002030：一山接着又是一山……\n　　这一带感觉\n　　尽是这种地形呢。\n@c0@"
  tl: "@a@b%a002030：一山接著又是一山……\n　　這一帶感覺\n　　盡是這種地形呢。\n@c0@"
152:
  en: "@a%0%a002000@bI wonder how many monsters we've sent to the great beyond...\n@c0@"
  ja: "@a@b%a002000「それにしても　オレたち\n\tいったい　今までに　何匹くらいの\n\tまものと　戦ってきたかなあ。\n@c0@"
  ko: "@a@b%a002000: 그나저나 우리는\n지금껏 몇 마리나 되는 마물과\n싸워 왔을까?\n@c0@"
  sl: "@a@b%a002000：话说回来，\n　　咱们打到现在\n　　到底干掉了多少魔物了啊。\n@c0@"
  tl: "@a@b%a002000：話說回來，\n　　咱們打到現在\n　　到底幹掉了多少魔物了啊。\n@c0@"
153:
  en: "@a%0%a002000@bI should've kept score... Well, always more where they came from, aye?\n@c0@"
  ja: "@a@b%a002000「数えていたとしても\n\tきっと　もう　わかんなく\n\tなってるだろうけどな。\n@c0@"
  ko: "@a@b%a002000: 세고 있었어도\n지금쯤이면 헷갈려서\n잊어버렸겠지만.\n@c0@"
  sl: "@a@b%a002000：这个数字恐怕会多到\n　　数也数不过来了吧。\n@c0@"
  tl: "@a@b%a002000：這個數字恐怕會多到\n　　數也數不過來了吧。\n@c0@"
154:
  en: "@a%0%a002010@bA day like this does wonders for one's positivity. Look, even Peggy Sue is chomping at the bit!\n@c0@"
  ja: "@a@b%a002010「天気が　いいと\n\t気分も　いいわね。\n\tほら　ファルシオンも　元気みたい。\n@c0@"
  ko: "@a@b%a002010: 날씨가 좋으니\n기분도 좋은걸.\n저길 봐. 팔시온도 씩씩해 보여.\n@c0@"
  sl: "@a@b%a002010：天气好的话，\n　　心情也会变得愉快起来呢。\n　　你们看法尔西昂也活力四射呢。\n@c0@"
  tl: "@a@b%a002010：天氣好的話，\n　　心情也會變得愉快起來呢。\n　　你們看法爾西昂也活力四射呢。\n@c0@"
155:
  en: "@aPeggy Sue@b(snort) Neeeigh!\n@c0@"
  ja: "@a@bファルシオン「ヒヒヒーンッ！\n@c0@"
  ko: "@a@b팔시온: 히히힝~!\n@c0@"
  sl: "@a@b法尔西昂：嘶嘶嘶嘶！\n@c0@"
  tl: "@a@b法爾西昂：嘶嘶嘶嘶！\n@c0@"
156:
  en: "@a%0%a002020@bHmm... I've been a bit run-down lately, y'know? Maybe I should take better care of myself...\n@c0@"
  ja: "@a@b%a002020「うーん　あたし\n\t最近　おつかれ気味かもー。\n\t気をつけようっと！\n@c0@"
  ko: "@a@b%a002020: 으음~\n나 요즘 좀 지친 것 같아~\n조심해야지!\n@c0@"
  sl: "@a@b%a002020：嗯……我最近\n　　总是会觉得疲倦。\n　　不注意不行呢！\n@c0@"
  tl: "@a@b%a002020：嗯……我最近\n　　總是會覺得疲倦。\n　　不注意不行呢！\n@c0@"
157:
  en: "@a%0%a002030@bI sense that there are monsters lurking in the vicinity. We must be on our guard.\n@c0@"
  ja: "@a@b%a002030「まものたちが　こちらを\n\tうかがっている　気配がありますね。\n\t気をつけて　進みましょう。\n@c0@"
  ko: "@a@b%a002030: 마물들이 이쪽을\n살피고 있는 눈치입니다.\n조심해서 갑시다.\n@c0@"
  sl: "@a@b%a002030：我察觉到\n　　有魔物正窥探着我们这边。\n　　走路小心一点。\n@c0@"
  tl: "@a@b%a002030：我察覺到\n　　有魔物正窺探著我們這邊。\n　　走路小心一點。\n@c0@"
158:
  en: "@a%0%a002050@bA nice bracin' walk, scrappin' with some monsters... There's nothin' quite like a good adventure!\n@c0@"
  ja: "@a@b%a002050「いやー　私\n\tみなさんと　冒険が　できて\n\tワクワク　ドキドキです！\n@c0@"
  ko: "@a@b%a002050: 이야~ 저는\n여러분과 모험할 수 있게 되어\n가슴이 두근두근 콩닥콩닥합니다!\n@c0@"
  sl: "@a@b%a002050：哎呀，\n　　我能跟大家一起冒险，\n　　真是激动得心砰砰直跳啊！\n@c0@"
  tl: "@a@b%a002050：哎呀，\n　　我能跟大家一起冒險，\n　　真是激動得心砰砰直跳啊！\n@c0@"
159:
  en: "@a%0%a002000@bIs this coffin full of rocks or somethin'? Well, at least I'm gettin' a workout.\n@c0@"
  ja: "@a@b%a002000「カンオケ　おもいぜ……。\n\tまあ　たのまれた以上\n\tしょうがないけどな。\n@c0@"
  ko: "@a@b%a002000: 관이 뭐 이리 무겁냐......\n뭐, 부탁받은 이상\n어쩔 수 없지만.\n@c0@"
  sl: "@a@b%a002000：这棺材真是死沉死沉的……\n　　唉，既然人家都拜托咱们了，\n　　真是没办法，只能坚持坚持了。\n@c0@"
  tl: "@a@b%a002000：這棺材真是死沉死沉的……\n　　唉，既然人家都拜託咱們了，\n　　真是沒辦法，只能堅持堅持了。\n@c0@"
160:
  en: "@a%0%a002010@bHmm. Commander Brutus was certainly a capable soldier...\n@c0@"
  ja: "@a@b%a002010「それにしても　あの\n\tブラスト兵団長は　強かったわね。\n@c0@"
  ko: "@a@b%a002010: 그나저나 그\n블래스트 병사단장은 정말 강했어.\n@c0@"
  sl: "@a@b%a002010：话说回来，\n　　那个布拉斯特兵团长真是厉害呢。\n@c0@"
  tl: "@a@b%a002010：話說回來，\n　　那個布拉斯特兵團長真是厲害呢。\n@c0@"
161:
  en: "@a%0%a002010@bBut it would seem that the monster in the cave is even tougher.\n@c0@"
  ja: "@a@b%a002010「でも　洞くつの　まものは\n\tあの人よりも　\n\tもっと　強いということよね。\n@c0@"
  ko: "@a@b%a002010: 하지만 동굴의 마물은\n그 사람보다도\n더 강한 거겠지?\n@c0@"
  sl: "@a@b%a002010：不过，\n　　洞窟里的魔物　\n　　应该比他更强吧。\n@c0@"
  tl: "@a@b%a002010：不過，\n　　洞窟裡的魔物　\n　　應該比他更強吧。\n@c0@"
162:
  en: "@a%0%a002020@b%0%a002040 was dragging one of these coffins along all by himself, wasn't he?\n@c0@"
  ja: "@a@b%a002020「%a002040っていう　剣士は\n\tひとりで　この　カンオケを\n\t引きずってるんだよね。\n@c0@"
  ko: "@a@b%a002020: %a002040%F2040%X라%Y이라%Z는 검사는\n혼자서 이 관을\n끌고 갔었지.\n@c0@"
  sl: "@a@b%a002020：那个叫%a002040\n　　的剑士，仅凭一己之力\n　　就拖动了这么重的棺材呢。\n@c0@"
  tl: "@a@b%a002020：那個叫%a002040\n　　的劍士，僅憑一己之力\n　　就拖動了這麼重的棺材呢。\n@c0@"
163:
  en: "@a%0%a002020@bHe's not that big of a guy, but he must be solid muscle!\n@c0@"
  ja: "@a@b%a002020「カラダ　ちっちゃいのに\n\tけっこう　チカラあるんだねー。\n@c0@"
  ko: "@a@b%a002020: 몸도 조그맣던데\n힘이 꽤 센가 봐~\n@c0@"
  sl: "@a@b%a002020：明明是个小不点，\n　　没想到力气不可小觑啊。\n@c0@"
  tl: "@a@b%a002020：明明是個小不點，\n　　沒想到力氣不可小覷啊。\n@c0@"
164:
  en: "@a%0%a002030@bThe sunderbolt blade! It has an impressive ring to it, right enough! I pray that we can get hold of it.\n@c0@"
  ja: "@a@b%a002030「雷鳴の剣！\n\tなんとしても　私たちが\n\t手に　入れたいものですね！\n@c0@"
  ko: "@a@b%a002030: 우렛소리 검!\n어떻게든 우리가\n손에 넣었으면 좋겠군요!\n@c0@"
  sl: "@a@b%a002030：雷鸣之剑！\n　　我们无论如何\n　　都要把它拿到手！\n@c0@"
  tl: "@a@b%a002030：雷鳴之劍！\n　　我們無論如何\n　　都要把它拿到手！\n@c0@"
165:
  en: "@a%0%a002050@bSo this fine steed goes by the name of Peggy Sue, does she? She's a mare and a half, I tell you!\n@c0@"
  ja: "@a@b%a002050「この　お馬さん\n\tファルシオンって　言いましたっけ？\n\tホント　かわいいですね～。\n@c0@"
  ko: "@a@b%a002050: 이 말, 이름이\n팔시온이라고 했던가요?\n정말 귀엽네요~\n@c0@"
  sl: "@a@b%a002050：这匹马，\n　　是叫法尔西昂吧？\n　　它真可爱～\n@c0@"
  tl: "@a@b%a002050：這匹馬，\n　　是叫法爾西昂吧？\n　　它真可愛～\n@c0@"
166:
  en: "@a%0%a002000@bWell, at least we got rid of that coffin. Talk about dead weight!\n@c0@"
  ja: "@a@b%a002000「やれやれ……\n\tカンオケが　なくなった\n\tことだけは　助かったな。\n@c0@"
  ko: "@a@b%a002000: 휴우......\n관을 안 끌어도 되는 것만큼은\n다행이군.\n@c0@"
  sl: "@a@b%a002000：哎呀哎呀……\n　　终于不用抬那棺材了，\n　　真是不幸中的万幸啊。\n@c0@"
  tl: "@a@b%a002000：哎呀哎呀……\n　　終於不用抬那棺材了，\n　　真是不幸中的萬幸啊。\n@c0@"
167:
  en: "@a%0%a002010@bLet's return to Arkbolt for now.\n@c0@"
  ja: "@a@b%a002010「いったん\n\tアークボルト城に　もどりましょう。\n@c0@"
  ko: "@a@b%a002010: 일단은\n아크볼트 성으로 돌아가자.\n@c0@"
  sl: "@a@b%a002010：我们还是\n　　先回阿克博尔特城一趟吧。\n@c0@"
  tl: "@a@b%a002010：我們還是\n　　先回阿克博爾特城一趟吧。\n@c0@"
168:
  en: "@a%0%a002020@bIt'll probably be a while yet before Wayfarer's Pass is open.\n@c0@"
  ja: "@a@b%a002020「旅人の洞くつの\n\t開通までは　まだ　しばらく\n\tかかりそう　だったわよね。\n@c0@"
  ko: "@a@b%a002020: 여행자의 동굴이\n개통되려면 아직 시간이\n걸릴 것 같았어.\n@c0@"
  sl: "@a@b%a002020：旅行者洞窟\n　　好像还需要花一点时间\n　　才能打通呢。\n@c0@"
  tl: "@a@b%a002020：旅行者洞窟\n　　好像還需要花一點時間\n　　才能打通呢。\n@c0@"
169:
  en: "@a%0%a002030@bSo the young warrior named %a002040 has departed with the sunderbolt blade...\n@c0@"
  ja: "@a@b%a002030「雷鳴の剣……。\n\tあの　%a002040とか言う　若者に\n\t持っていかれてしまいましたね……。\n@c0@"
  ko: "@a@b%a002030: 우렛소리 검......\n그 %a002040인가 하는 청년이\n가져가 버렸군요......\n@c0@"
  sl: "@a@b%a002030：雷鸣之剑……\n　　被那个叫做%a002040的年轻人\n　　拿走了呢……\n@c0@"
  tl: "@a@b%a002030：雷鳴之劍……\n　　被那個叫做%a002040的年輕人\n　　拿走了呢……\n@c0@"
170:
  en: "@a%0%a002050@bAnd there was me thinkin' that a young whippersnapper like that would never get the better of us.\n@c0@"
  ja: "@a@b%a002050「それにしても\n\tあんな　若い　剣士ひとりに\n\t先を　こされるなんて……。\n@c0@"
  ko: "@a@b%a002050: 아무리 그래도 그렇지,\n그런 젊은 검사 하나한테\n선수를 빼앗기다니......\n@c0@"
  sl: "@a@b%a002050：话说回来，\n　　居然被那样一个年轻剑士\n　　只身一人抢了先机……\n@c0@"
  tl: "@a@b%a002050：話說回來，\n　　居然被那樣一個年輕劍士\n　　隻身一人搶了先機……\n@c0@"
171:
  en: "@a%0%a002050@bJust goes to show that old %a002050 has still got a fair bit to learn!\n@c0@"
  ja: "@a@b%a002050「同じ　青い者　としては\n\tちょっと　ショックですね……。\n@c0@"
  ko: "@a@b%a002050: 같은 파란 옷으로서\n조금 충격이네요......\n@c0@"
  sl: "@a@b%a002050：明明都穿蓝衣服，\n　　这还真是让人受打击啊……\n@c0@"
  tl: "@a@b%a002050：明明都穿藍衣服，\n　　這還真是讓人受打擊啊……\n@c0@"
172:
  en: "@a%0%a002000@bWayfarer's Pass should be all fixed up by now, aye? Why not head over that way?\n@c0@"
  ja: "@a@b%a002000「もう　旅人の洞くつの\n\t工事も　終わってるんじゃないか？\n\tいってみようぜ！\n@c0@"
  ko: "@a@b%a002000: 이제 여행자의 동굴\n공사도 끝나지 않았을까?\n가 보자고!\n@c0@"
  sl: "@a@b%a002000：旅行者洞窟\n　　施工完了？\n　　走着！\n@c0@"
  tl: "@a@b%a002000：旅行者洞窟\n　　施工完了？\n　　走著！\n@c0@"
173:
  en: "@a%0%a002010@bI'm sure that we'll get the opportunity to atone for our failure at the Pass...\n@c0@"
  ja: "@a@b%a002010「ここでの　失敗は\n\tほかで　取りもどしましょう。\n@c0@"
  ko: "@a@b%a002010: 여기서의 실패는\n다른 곳에서 만회하도록 하자.\n@c0@"
  sl: "@a@b%a002010：把这次的失败\n　　作为下次成功的垫脚石吧。\n@c0@"
  tl: "@a@b%a002010：把這次的失敗\n　　作為下次成功的墊腳石吧。\n@c0@"
174:
  en: "@a%0%a002020@bI sure wish we could just forget everything that happened here...\n@c0@"
  ja: "@a@b%a002020「ここで　起きたことは\n\t全部　わすれたい　気分だね！\n@c0@"
  ko: "@a@b%a002020: 여기서 일어난 일은\n모두 잊어버리고 싶어!\n@c0@"
  sl: "@a@b%a002020：真想把这里发生的事\n　　忘得一干二净！\n@c0@"
  tl: "@a@b%a002020：真想把這裡發生的事\n　　忘得一乾二淨！\n@c0@"
175:
  en: "@a%0%a002030@bI have a peculiar feeling that we shall encounter %a002040 again on our travels.\n@c0@"
  ja: "@a@b%a002030「あの　%a002040には\n\tいつか　また　どこかで\n\tあいそうな　気がします。\n@c0@"
  ko: "@a@b%a002030: 그 %a002040%F2040%X라%Y이라%Z는 사람은\n언젠가 또 어디서\n만날 것 같은 기분이 듭니다.\n@c0@"
  sl: "@a@b%a002030：我总觉得，\n　　我们总有一天还会在某个地方\n　　遇到那个%a002040的。\n@c0@"
  tl: "@a@b%a002030：我總覺得，\n　　我們總有一天還會在某個地方\n　　遇到那個%a002040的。\n@c0@"
176:
  en: "@a%0%a002050@bThat King of Arkbolt isn't half stingy! Fancy not even givin' us a reward!\n@c0@"
  ja: "@a@b%a002050「アークボルトの　王さま\n\tはっきり言って　ケチですよね！\n\tごほうび　ゼロ　だなんて。\n@c0@"
  ko: "@a@b%a002050: 아크볼트의 왕,\n솔직히 진짜 짠돌이네요!\n포상을 하나도 안 주다니.\n@c0@"
  sl: "@a@b%a002050：那个阿克博尔特的国王陛下，\n　　说得难听点，简直是个小气鬼！\n　　居然什么奖赏都不给我们。\n@c0@"
  tl: "@a@b%a002050：那個阿克博爾特的國王陛下，\n　　說得難聽點，簡直是個小氣鬼！\n　　居然什麼獎賞都不給我們。\n@c0@"
177:
  en: "@a%0%a002050@bHe could have at least given us an oaken club or somethin'!\n@c0@"
  ja: "@a@b%a002050「せめて　こんぼう　くらい\n\tくれればいいのに……。\n@c0@"
  ko: "@a@b%a002050: 적어도 곤봉 정도는\n줄 수 있는 거 아닙니까......\n@c0@"
  sl: "@a@b%a002050：至少奖励根棍棒，\n　　也比什么都没有强啊……\n@c0@"
  tl: "@a@b%a002050：至少獎勵根棍棒，\n　　也比什麼都沒有強啊……\n@c0@"
178:
  en: "@a%0%a002000@bI wish I'd beaten that cave monster. If my old man taught me anything, it's to never leave somethin' half done.\n@c0@"
  ja: "@a@b%a002000「うーん　それにしても\n\t洞くつの　まものを　倒せなかったのは\n\t心のこりだぜ……。\n@c0@"
  ko: "@a@b%a002000: 으음~ 하지만\n동굴의 마물을 쓰러뜨리지 못한 건\n마음에 걸리는군......\n@c0@"
  sl: "@a@b%a002000：唔，不过啊，\n　　没有灭掉洞窟里的魔物，\n　　俺真是心有不甘呐……\n@c0@"
  tl: "@a@b%a002000：唔，不過啊，\n　　沒有滅掉洞窟裡的魔物，\n　　俺真是心有不甘呐……\n@c0@"
179:
  en: "@a%0%a002010@bI don't believe this area is part of the kingdom of Arkbolt...\n@c0@"
  ja: "@a@b%a002010「この　あたりは　もう\n\tアークボルトの　統治から\n\tはずれているのかしらね。\n@c0@"
  ko: "@a@b%a002010: 이 주변은 이미\n아크볼트가 통치하는 땅에서\n벗어난 걸까?\n@c0@"
  sl: "@a@b%a002010：这一带好像已经\n　　不再是阿克博尔特的\n　　统辖范围了。\n@c0@"
  tl: "@a@b%a002010：這一帶好像已經\n　　不再是阿克博爾特的\n　　統轄範圍了。\n@c0@"
180:
  en: "@a%0%a002020@bSay, Commander Brutus's kid was pretty cute, wasn't he? All stubborn and precocious and...\n@c0@"
  ja: "@a@b%a002020「そういえばさあ\n\tブラスト兵士長の　子供……\n\tいじっぱりで　かわいかったね！\n@c0@"
  ko: "@a@b%a002020: 그러고 보니\n블래스트 병사단장의 아이......\n고집 부리는 모습이 귀여웠어!\n@c0@"
  sl: "@a@b%a002020：话说回来，\n　　布拉斯特兵团长的小孩……\n　　真是又固执又可爱呢！\n@c0@"
  tl: "@a@b%a002020：話說回來，\n　　布拉斯特兵團長的小孩……\n　　真是又固執又可愛呢！\n@c0@"
181:
  en: "@a%0%a002030@bWhat a truly desolate area. There is no sight of even the most humble hamlet.\n@c0@"
  ja: "@a@b%a002030「さびしい　土地ですね。\n\t町や　村が　いっこうに\n\t見あたりません……。\n@c0@"
  ko: "@a@b%a002030: 적막한 땅이군요.\n마을 같은 것이 전혀\n보이지 않습니다......\n@c0@"
  sl: "@a@b%a002030：这片土地真是荒凉啊。\n　　城镇也好村庄也好，\n　　什么都看不到……\n@c0@"
  tl: "@a@b%a002030：這片土地真是荒涼啊。\n　　城鎮也好村莊也好，\n　　什麼都看不到……\n@c0@"
182:
  en: "@a%0%a002050@bOld %a002050 is startin' to get a mite peckish. Is no one else hungry?\n@c0@"
  ja: "@a@b%a002050「ちょっと　おなかが\n\tすいてきましたね……。\n@c0@"
  ko: "@a@b%a002050: 배가 좀\n고프네요......\n@c0@"
  sl: "@a@b%a002050：肚子\n　　有点饿了……\n@c0@"
  tl: "@a@b%a002050：肚子\n　　有點餓了……\n@c0@"
183:
  en: "@a%0%a002000@bHow'd we end up here!?\n@c0@"
  ja: "@a@b%a002000「あれっ？\n\tこんな　ところに　出たぞ。\n\tこりゃ　いったい　どこだ？\n@c0@"
  ko: "@a@b%a002000: 어엇?\n이런 곳으로 나와 버렸군.\n여긴 대체 어디지?\n@c0@"
  sl: "@a@b%a002000：哎呀？\n　　竟然来到了这么个鸟不拉屎的地方。\n　　这到底是哪？\n@c0@"
  tl: "@a@b%a002000：哎呀？\n　　竟然來到了這麼個鳥不拉屎的地方。\n　　這到底是哪？\n@c0@"
184:
  en: "@a%0%a002000@bWho in their right mind would visit this place, anyhow?\n@c0@"
  ja: "@a@b%a002000「この　あたりも\n\t何も　なさそうな　ところだなあ。\n@c0@"
  ko: "@a@b%a002000: 이 주변도\n아무것도 없어 보이는 곳이군.\n@c0@"
  sl: "@a@b%a002000：这一带好像也\n　　啥都没有啊。\n@c0@"
  tl: "@a@b%a002000：這一帶好像也\n　　啥都沒有啊。\n@c0@"
185:
  en: "@a%0%a002010@bWe seem to be back in the dream world... I wonder where exactly we've ended up.\n@c0@"
  ja: "@a@b%a002010「ここは……\n\t上の世界の　どこかよね？\n\tどこなのかしら。\n@c0@"
  ko: "@a@b%a002010: 여긴......\n위쪽 세계의 어딘가겠지?\n대체 어딜까?\n@c0@"
  sl: "@a@b%a002010：这里是……\n　　上面世界的某个地方吧？\n　　到底是哪呢？\n@c0@"
  tl: "@a@b%a002010：這裡是……\n　　上面世界的某個地方吧？\n　　到底是哪呢？\n@c0@"
186:
  en: "@a%0%a002010@bLet's look for signs of civilisation. A town, a village — even a hut. Anything will do!\n@c0@"
  ja: "@a@b%a002010「とにかく　村でも　町でも\n\t人の　いるところを　さがしましょ！\n@c0@"
  ko: "@a@b%a002010: 일단은 사람이\n있을 것 같은 마을을 찾아보자!\n@c0@"
  sl: "@a@b%a002010：总之，村庄也好城镇也好，\n　　先找个有人的地方吧！\n@c0@"
  tl: "@a@b%a002010：總之，村莊也好城鎮也好，\n　　先找個有人的地方吧！\n@c0@"
187:
  en: "@a%0%a002020@bHaah... Haah... Taking the stairs between worlds is no fun... There's gotta be a better way...\n@c0@"
  ja: "@a@b%a002020「はあはあ…！\n\t下の世界から　上の世界まで\n\t階段で　来るなんて　つらいよ……。\n@c0@"
  ko: "@a@b%a002020: 헉헉...!\n아래쪽 세계에서 위쪽 세계까지\n계단으로 올라오니까 힘들잖아......\n@c0@"
  sl: "@a@b%a002020：哈……哈……\n　　从下面的世界到上面的世界，\n　　居然用爬楼梯这么丧心病狂的方式……\n@c0@"
  tl: "@a@b%a002020：哈……哈……\n　　從下面的世界到上面的世界，\n　　居然用爬樓梯這麼喪心病狂的方式……\n@c0@"
188:
  en: "@a%0%a002020@bI'm beat. My legs are completely numb...\n@c0@"
  ja: "@a@b%a002020「あー　足が　つかれた……。\n@c0@"
  ko: "@a@b%a002020: 아~ 다리가 후들거려......\n@c0@"
  sl: "@a@b%a002020：啊，我走不动了……\n@c0@"
  tl: "@a@b%a002020：啊，我走不動了……\n@c0@"
189:
  en: "@a%0%a002030@bTwo worlds joined by a staircase... Truly, reality is stranger than my textbooks have led me to believe...\n@c0@"
  ja: "@a@b%a002030「こうして　階段で\n\t２つの世界が　つながっているのは\n\tとても　不思議な　感じです……。\n@c0@"
  ko: "@a@b%a002030: 이렇게 계단으로\n두 세계가 이어져 있다니\n정말 신기한 느낌이군요......\n@c0@"
  sl: "@a@b%a002030：两个世界\n　　竟然由楼梯来连接。\n　　这种感觉真是不可思议……\n@c0@"
  tl: "@a@b%a002030：兩個世界\n　　竟然由樓梯來連接。\n　　這種感覺真是不可思議……\n@c0@"
190:
  en: "@a%0%a002030@bAs we travel across unfamiliar terrain, we should take extra care to maintain our stamina levels.\n@c0@"
  ja: "@a@b%a002030「見知らぬ　土地を\n\t歩くのですから　体力などには\n\tより　いっそう　気をつけましょう。\n@c0@"
  ko: "@a@b%a002030: 낯선 곳을\n걸어야 하니 체력에는\n더욱더 주의를 기울입시다.\n@c0@"
  sl: "@a@b%a002030：行走在未知的土地上时，\n　　请一定要更加注意\n　　自己的体力等等。\n@c0@"
  tl: "@a@b%a002030：行走在未知的土地上時，\n　　請一定要更加注意\n　　自己的體力等等。\n@c0@"
191:
  en: "@a%0%a002050@bWho'd have thought we'd find a place like this at the top of a staircase!? We're not in Scrimsley any more!\n@c0@"
  ja: "@a@b%a002050「いやー　階段の上にも\n\tこんな　広大な　世界が\n\tあるなんて　ビックリですね！\n@c0@"
  ko: "@a@b%a002050: 이야~ 계단 위에도\n이렇게 넓은 세계가\n있다니 놀랍네요!\n@c0@"
  sl: "@a@b%a002050：哎呀，楼梯尽头\n　　竟然也有一个这么广阔的世界。\n　　太震撼了！\n@c0@"
  tl: "@a@b%a002050：哎呀，樓梯盡頭\n　　竟然也有一個這麼廣闊的世界。\n　　太震撼了！\n@c0@"
192:
  en: "@a%0%a002050@bIt takes a lot to rattle old %a002050, but wanderin' about unfamiliar terrain makes me a tad nervous...\n@c0@"
  ja: "@a@b%a002050「どこに　何が　あるかどうか\n\tわからずに　進む　というのは\n\t心ぼそい　ものですね……。\n@c0@"
  ko: "@a@b%a002050: 어디에 뭐가 있는지 없는지도\n모르면서 계속 가니\n마음이 불안하군요......\n@c0@"
  sl: "@a@b%a002050：在完全不知道\n　　前面会出现什么东西的情况下前行，\n　　真是提心吊胆啊……\n@c0@"
  tl: "@a@b%a002050：在完全不知道\n　　前面會出現什麼東西的情況下前行，\n　　真是提心吊膽啊……\n@c0@"
193:
  en: "@a%0%a002000@bAhoy! A town, here? In the middle of the desert?\n@c0@"
  ja: "@a@b%a002000「おっ　見ろよ！\n\tこんな　砂ばくの　真ん中に\n\t町が　あるみたいだぜ！\n@c0@"
  ko: "@a@b%a002000: 오오, 저길 봐!\n이런 사막 한가운데에\n마을이 있는 것 같군!\n@c0@"
  sl: "@a@b%a002000：哦！看那里！\n　　居然在沙漠中央有个城镇！\n@c0@"
  tl: "@a@b%a002000：哦！看那裡！\n　　居然在沙漠中央有個城鎮！\n@c0@"
194:
  en: "@a%0%a002010@bSand, sand, and — oh my, what's that over there!? Oh... More sand.\n@c0@"
  ja: "@a@b%a002010「すな　すな　すな……ね。\n@c0@"
  ko: "@a@b%a002010: 모래, 모래, 모래밖에 없어......\n@c0@"
  sl: "@a@b%a002010：沙子、沙子……都是沙子……\n@c0@"
  tl: "@a@b%a002010：沙子、沙子……都是沙子……\n@c0@"
195:
  en: "@a%0%a002020@bThis dry air is murder on my skin. It's practically cracking in front of my eyes! Gross!\n@c0@"
  ja: "@a@b%a002020「うわー　こっちは\n\t空気が　かんそうしてるね。\n\tおはだが　カサカサに　なっちゃう！\n@c0@"
  ko: "@a@b%a002020: 세상에~ 여긴\n공기가 건조하네.\n피부가 거칠어지잖아!\n@c0@"
  sl: "@a@b%a002020：呜哇！\n　　这里的空气真干燥。\n　　人家的皮肤都变得跟老太婆一样了呢！\n@c0@"
  tl: "@a@b%a002020：嗚哇！\n　　這裡的空氣真乾燥。\n　　人家的皮膚都變得跟老太婆一樣了呢！\n@c0@"
196:
  en: "@a%0%a002030@bHave you caught sight of the town that lies over there? I suggest we pay it a visit!\n@c0@"
  ja: "@a@b%a002030「ん？　向こうのほうに\n\t町が　見えませんか！？\n\t行ってみましょう！\n@c0@"
  ko: "@a@b%a002030: 음? 저쪽에\n마을이 보이는 것 같지 않습니까!?\n가 봅시다!\n@c0@"
  sl: "@a@b%a002030：嗯？前面那座城镇！\n　　看见了吗各位？！\n　　过去看看！\n@c0@"
  tl: "@a@b%a002030：嗯？前面那座城鎮！\n　　看見了嗎各位？！\n　　過去看看！\n@c0@"
197:
  en: "@a%0%a002050@bSo you squeeze yourself through a tunnel only to find yourself in the desert...\n@c0@"
  ja: "@a@b%a002050「トンネルを　ぬけたら\n\tそこは　砂ばく　だった……。\n@c0@"
  ko: "@a@b%a002050: 터널을 빠져나오니\n그곳은 사막이었다......\n@c0@"
  sl: "@a@b%a002050：穿过通道之后，\n　　对面是一片茫茫沙漠……\n@c0@"
  tl: "@a@b%a002050：穿過通道之後，\n　　對面是一片茫茫沙漠……\n@c0@"
198:
  en: "@a%0%a002000@bHmm... So they seem to be losin' people in Aridea. But where does everybody go?\n@c0@"
  ja: "@a@b%a002000「カルカドの町からは\n\tずいぶん　人が　へっていた\n\tようだったな。\n@c0@"
  ko: "@a@b%a002000: 캘커드 마을에서는\n사람이 꽤 많이\n줄어든 것 같더군.\n@c0@"
  sl: "@a@b%a002000：加尔加德镇的人口数量，\n　　看上去好像\n　　减少了不少啊。\n@c0@"
  tl: "@a@b%a002000：加爾加德鎮的人口數量，\n　　看上去好像\n　　減少了不少啊。\n@c0@"
199:
  en: "@a%0%a002010@bA floating island that visits the western cape on a full moon? That's the kind of talk that tickles my curiosity!\n@c0@"
  ja: "@a@b%a002010「満月の夜　西の岬に\n\t浮かぶ島が　来る……。\n\tしんそうを　ぜひ確かめなくてはね。\n@c0@"
  ko: "@a@b%a002010: 보름달이 뜨는 밤, 서쪽 곶에\n부유하는 섬이 온다......\n꼭 진상을 확인해야 해.\n@c0@"
  sl: "@a@b%a002010：在月圆之夜，\n　　西面海峡会有一座岛屿浮上海面……\n　　必须找出真相才行呢。\n@c0@"
  tl: "@a@b%a002010：在月圓之夜，\n　　西面海峽會有一座島嶼浮上海面……\n　　必須找出真相才行呢。\n@c0@"
200:
  en: "@a%0%a002020@bI wonder if all the desert-town deserters are already at the western coastline...\n@c0@"
  ja: "@a@b%a002020「しあわせの国に\n\t行きたがってた人たち……\n\tもう　西の岬に　ついたのかしら。\n@c0@"
  ko: "@a@b%a002020: 행복의 나라로\n가고 싶어 하는 사람들......\n벌써 서쪽 곶에 도착했을까?\n@c0@"
  sl: "@a@b%a002020：想要前往\n　　幸福国的人们……\n　　全都去西面的海峡了么？\n@c0@"
  tl: "@a@b%a002020：想要前往\n　　幸福國的人們……\n　　全都去西面的海峽了麼？\n@c0@"
201:
  en: "@a%0%a002030@bA full moon hangs in the night sky... Everything is bathed in a cold, crisp light...\n@c0@"
  ja: "@a@b%a002030「こよいは　満月。\n\t夜とはいえ　見とおしは\n\tよいですね。\n@c0@"
  ko: "@a@b%a002030: 오늘 밤은 보름달.\n밤이기는 하지만 멀리까지\n잘 보이는군요.\n@c0@"
  sl: "@a@b%a002030：今晚是满月。\n　　虽说夜幕已经降临，\n　　视线却没受到什么影响呢。\n@c0@"
  tl: "@a@b%a002030：今晚是滿月。\n　　雖說夜幕已經降臨，\n　　視線卻沒受到什麼影響呢。\n@c0@"
202:
  en: "@a%0%a002050@bThe desert gets a bit nippy at night, I tell you!\n@c0@"
  ja: "@a@b%a002050「夜の　砂ばくは\n\tしんしんと　ひえますね……。\n@c0@"
  ko: "@a@b%a002050: 밤의 사막은\n오싹오싹하고 춥군요......\n@c0@"
  sl: "@a@b%a002050：夜晚的沙漠\n　　冷飕飕的呢……\n@c0@"
  tl: "@a@b%a002050：夜晚的沙漠\n　　冷颼颼的呢……\n@c0@"
203:
  en: "@a%0%a002050@bAh...ah-CHOO!\n@c0@"
  ja: "@a@b%a002050「ヘーックション！！\n@c0@"
  ko: "@a@b%a002050: 흐엣~취!!\n@c0@"
  sl: "@a@b%a002050：阿嚏！！\n@c0@"
  tl: "@a@b%a002050：阿嚏！！\n@c0@"
204:
  en: "@a%0%a002000@bAye, it's a full moon tonight, alright. Looks like tonight's the big night!\n@c0@"
  ja: "@a@b%a002000「今夜は　満月か……。\n@c0@"
  ko: "@a@b%a002000: 오늘 밤이 보름......\n@c0@"
  sl: "@a@b%a002000：今晚是满月啊……\n@c0@"
  tl: "@a@b%a002000：今晚是滿月啊……\n@c0@"
205:
  en: "@a%0%a002010@bThe moon is full — which means the floating island must be at the western cape. Let's hurry!\n@c0@"
  ja: "@a@b%a002010「西の岬に\n\t浮かぶ島が　きているはず。\n\t急ぎましょう。\n@c0@"
  ko: "@a@b%a002010: 서쪽 곶에\n부유하는 섬이 와 있을 거야.\n서두르자.\n@c0@"
  sl: "@a@b%a002010：西面的海峡那里\n　　一定有浮岛在等着。\n　　我们赶紧过去。\n@c0@"
  tl: "@a@b%a002010：西面的海峽那裡\n　　一定有浮島在等著。\n　　我們趕緊過去。\n@c0@"
206:
  en: "@a%0%a002020@bWe're gonna get to the bottom of this Isle o' Smiles business tonight. I just know it!\n@c0@"
  ja: "@a@b%a002020「しあわせの国って\n\tなんなのか　今夜こそ\n\t正体を　あばいてやるわ！\n@c0@"
  ko: "@a@b%a002020: 행복의 나라가\n대체 뭔지 오늘 밤에 꼭\n정체를 밝히고 말 거야!\n@c0@"
  sl: "@a@b%a002020：幸福国的本来面目\n　　到底是什么，\n　　今晚一定要揪出它的狐狸尾巴！\n@c0@"
  tl: "@a@b%a002020：幸福國的本來面目\n　　到底是什麼，\n　　今晚一定要揪出它的狐狸尾巴！\n@c0@"
207:
  en: "@a%0%a002030@bPerhaps we should drop by Aridea on our way...\n@c0@"
  ja: "@a@b%a002030「カルカドの町にも\n\tよって　いきますか？\n@c0@"
  ko: "@a@b%a002030: 캘커드 마을에도\n들렀다 갈까요?\n@c0@"
  sl: "@a@b%a002030：要顺便去一趟\n　　加尔加德吗？\n@c0@"
  tl: "@a@b%a002030：要順便去一趟\n　　加爾加德嗎？\n@c0@"
208:
  en: "@a%0%a002050@bAh...ah-CHOO!\n@c0@"
  ja: "@a@b%a002050「ヘーックション！！\n@c0@"
  ko: "@a@b%a002050: 흐엣~취!!\n@c0@"
  sl: "@a@b%a002050：阿嚏！！\n@c0@"
  tl: "@a@b%a002050：阿嚏！！\n@c0@"
209:
  en: "@a%0%a002050@bFear not! It'll take more than a bit of a sniffle to get the better of old %a002050! (sniff)\n@c0@"
  ja: "@a@b%a002050「うー　ぶるぶる\n\tさむいですね……。\n@c0@"
  ko: "@a@b%a002050: 우우~ 덜덜 떨릴 만큼\n춥군요......\n@c0@"
  sl: "@a@b%a002050：唔，冷死了冷死了。\n　　真是冷啊……\n@c0@"
  tl: "@a@b%a002050：唔，冷死了冷死了。\n　　真是冷啊……\n@c0@"
210:
  en: "@a%0%a002000@bSeems like all those poor folks trapped on the altar have been released.\n@c0@"
  ja: "@a@b%a002000「もう　あの　神殿に\n\tとらわれていた　人たちは\n\t誰も　残って　いなかったよな。\n@c0@"
  ko: "@a@b%a002000: 그 신전에 묶여 있던\n사람들은 이제\n아무도 안 남아 있었지.\n@c0@"
  sl: "@a@b%a002000：被抓到那个神殿去的那些人，\n　　好像全部都不在了。\n@c0@"
  tl: "@a@b%a002000：被抓到那個神殿去的那些人，\n　　好像全部都不在了。\n@c0@"
211:
  en: "@a%0%a002000@bThat's that. Our work here is done.\n@c0@"
  ja: "@a@b%a002000「やったぜ！\n\tって　感じだな。\n@c0@"
  ko: "@a@b%a002000: 드디어 한 건\n해낸 느낌이군.\n@c0@"
  sl: "@a@b%a002000：总算是摆平了！\n@c0@"
  tl: "@a@b%a002000：總算是擺平了！\n@c0@"
212:
  en: "@a%0%a002010@bThe only way off this island is via the floating island we came here on. I hope we can work out how to steer it...\n@c0@"
  ja: "@a@b%a002010「帰る方法といえば\n\tあの　浮かぶ島だけね。\n\tちゃんと　動くかしら。\n@c0@"
  ko: "@a@b%a002010: 돌아갈 방법은\n그 부유하는 섬뿐이겠네.\n제대로 움직여 주려나?\n@c0@"
  sl: "@a@b%a002010：回去的方法\n　　貌似只剩下那个浮岛了。\n　　不知道它能不能好好运作。\n@c0@"
  tl: "@a@b%a002010：回去的方法\n　　貌似只剩下那個浮島了。\n　　不知道它能不能好好運作。\n@c0@"
213:
  en: "@a%0%a002020@bThat King Medford guy was a real character, huh? Twirling around in the air like that...\n@c0@"
  ja: "@a@b%a002020「そういえば　あの\n\tクルクルまわって　飛び出してきた\n\tメダル王さまは　おもしろかったね！\n@c0@"
  ko: "@a@b%a002020: 참, 그\n뱅글뱅글 돌아서 튀어나왔던\n메달 왕이란 사람, 웃겼어!\n@c0@"
  sl: "@a@b%a002020：话说回来，\n　　那个吱溜溜转个不停跑出来的徽章王，\n　　还真是有趣啊！\n@c0@"
  tl: "@a@b%a002020：話說回來，\n　　那個吱溜溜轉個不停跑出來的徽章王，\n　　還真是有趣啊！\n@c0@"
214:
  en: "@a%0%a002030@bIt troubles me still. Just what nature of beast was that Jamirus?\n@c0@"
  ja: "@a@b%a002030「それにしても\n\tあの　ジャミラスという　まもの……\n\t何者だったのでしょう……。\n@c0@"
  ko: "@a@b%a002030: 그나저나\n그 쟈미라스라는 마물......\n정체가 무엇이었을까요......\n@c0@"
  sl: "@a@b%a002030：不过，\n　　那个叫做贾米拉斯的魔物……\n　　到底是何来头……\n@c0@"
  tl: "@a@b%a002030：不過，\n　　那個叫做賈米拉斯的魔物……\n　　到底是何來頭……\n@c0@"
215:
  en: "@a%0%a002050@bRight folks! Let's get on board that island! (Never thought I'd say that...)\n@c0@"
  ja: "@a@b%a002050「みなさん　島に\n\tのりこみましょう！\n@c0@"
  ko: "@a@b%a002050: 여러분, 섬을\n타러 갑시다!\n@c0@"
  sl: "@a@b%a002050：各位！\n　　进岛里去吧！\n@c0@"
  tl: "@a@b%a002050：各位！\n　　進島裡去吧！\n@c0@"
216:
  en: "@a%0%a002000@bMedford's Manor might not be the biggest castle I've ever seen, but it's one classy joint!\n@c0@"
  ja: "@a@b%a002000「メダル王の　城って\n\tちっこいけど　ゴージャスだよな。\n\t中は　まぶしいくらいだもんな。\n@c0@"
  ko: "@a@b%a002000: 메달 왕의 성은\n손바닥만 하지만 화려하지.\n내부는 눈이 부실 정도야.\n@c0@"
  sl: "@a@b%a002000：那徽章王的城堡，\n　　小是小了点，还真是奢华啊。\n　　城堡里耀眼得俺都睁不开眼睛了。\n@c0@"
  tl: "@a@b%a002000：那徽章王的城堡，\n　　小是小了點，還真是奢華啊。\n　　城堡裡耀眼得俺都睜不開眼睛了。\n@c0@"
217:
  en: "@a%0%a002010@bI wonder... How many mini medals can there be in this world?\n@c0@"
  ja: "@a@b%a002010「それにしても\n\t世界中には　いったい　どのくらい\n\tメダルが　あるのかしらね。\n@c0@"
  ko: "@a@b%a002010: 그나저나\n전 세계에는 얼마나 많은\n메달이 있는 걸까?\n@c0@"
  sl: "@a@b%a002010：不过，\n　　这个世界上\n　　到底有多少徽章呢？\n@c0@"
  tl: "@a@b%a002010：不過，\n　　這個世界上\n　　到底有多少徽章呢？\n@c0@"
218:
  en: "@a%0%a002010@bI suppose the only way to find out is to try and collect every last one!\n@c0@"
  ja: "@a@b%a002010「できるものなら\n\t私たちで　全部の　メダルを\n\t集めてみたいものね！\n@c0@"
  ko: "@a@b%a002010: 가능하면\n우리가 모든 메달을\n모아 봤으면 좋겠어!\n@c0@"
  sl: "@a@b%a002010：要是可能的话，\n　　我真想收齐\n　　全部的徽章呢！\n@c0@"
  tl: "@a@b%a002010：要是可能的話，\n　　我真想收齊\n　　全部的徽章呢！\n@c0@"
219:
  en: "@a%0%a002020@bLet's come back once we get more mini medals, okay?\n@c0@"
  ja: "@a@b%a002020「小さなメダルを\n\tもっと　もっと　集めて　また\n\tメダル王の　お城に　来ようね！\n@c0@"
  ko: "@a@b%a002020: 작은 메달을\n더 많이 모아서 또\n메달 왕의 성으로 오자!\n@c0@"
  sl: "@a@b%a002020：我们再多收集些\n　　小徽章后，\n　　再到徽章王的城堡里来吧！\n@c0@"
  tl: "@a@b%a002020：我們再多收集些\n　　小徽章後，\n　　再到徽章王的城堡裡來吧！\n@c0@"
220:
  en: "@a%0%a002030@bThanks to King Medford's taste for medals, exploring's going to be just that bit more fun from here on out!\n@c0@"
  ja: "@a@b%a002030「メダル王の　おかげで\n\t旅先での　小さな発見が\n\t本当に　楽しみに　なりますね。\n@c0@"
  ko: "@a@b%a002030: 메달 왕 덕분에\n여행지에서의 작은 발견이\n큰 즐거움으로 이어지겠군요.\n@c0@"
  sl: "@a@b%a002030：多亏了徽章王，\n　　旅途中的一点小小的发现\n　　都变得令人期待起来了呢。\n@c0@"
  tl: "@a@b%a002030：多虧了徽章王，\n　　旅途中的一點小小的發現\n　　都變得令人期待起來了呢。\n@c0@"
221:
  en: "@a%0%a002050@bFar be it from me to be nosy, but I wonder what His Highness does with all those medals?\n@c0@"
  ja: "@a@b%a002050「メダル王さまは\n\tあんなに　メダルを　集めて\n\tどうするんでしょうね……。\n@c0@"
  ko: "@a@b%a002050: 메달 왕은\n메달을 그렇게 많이 모아서\n뭐에 쓰려는 걸까요......\n@c0@"
  sl: "@a@b%a002050：徽章王大人\n　　收集那么多徽章，\n　　究竟要做什么呢……\n@c0@"
  tl: "@a@b%a002050：徽章王大人\n　　收集那麼多徽章，\n　　究竟要做什麼呢……\n@c0@"
222:
  en: "@a%0%a002050@bMaybe he trades 'em in some place for even bigger rewards! \n@c0@"
  ja: "@a@b%a002050「はっ！　もっと　すごい\n\t景品と　かえてくれる　ところが\n\tほかに　あるのかも！？\n@c0@"
  ko: "@a@b%a002050: 헛! 더 엄청난\n물건과 교환해 주는 곳이\n또 있는 거 아닙니까!?\n@c0@"
  sl: "@a@b%a002050：哈！\n　　不会是拿去别的地方\n　　换更棒的奖品吧？！\n@c0@"
  tl: "@a@b%a002050：哈！\n　　不會是拿去別的地方\n　　換更棒的獎品吧？！\n@c0@"
223:
  en: "@a%0%a002040@bWell, each to their own. If he wants to collect medals, then so be it...\n@c0@"
  ja: "@a@b%a002040「メダル王か……。\n\tかわった　趣味だよな。\n@c0@"
  ko: "@a@b%a002040: 메달 왕이라......\n독특한 취미를 가졌군.\n@c0@"
  sl: "@a@b%a002040：徽章王……\n　　这兴趣真奇特。\n@c0@"
  tl: "@a@b%a002040：徽章王……\n　　這興趣真奇特。\n@c0@"
224:
  en: "@a%0%a002060@b(snarl) Next prize... How many medals...we need? (slobber)\n@c0@"
  ja: "@a@b%a002060「メダル…次は……\n\t何枚…ひつよう…だったか？\n@c0@"
  ko: "@a@b%a002060: 메달...다음번엔......\n몇 개...필요...하지?\n@c0@"
  sl: "@a@b%a002060：徽章……接下来……\n　　还需要……多少枚？\n@c0@"
  tl: "@a@b%a002060：徽章……接下來……\n　　還需要……多少枚？\n@c0@"
225:
  en: "@a%0%a002070@bBoing! Boing boing!\n@c0@"
  ja: "@a@b%a002070「プルンプルプルルーッ！\n@c0@"
  ko: "@a@b%a002070: 뽀요용 뽀뽀뽀용~!\n@c0@"
  sl: "@a@b%a002070：噗噜噗噜噗噜噜！\n@c0@"
  tl: "@a@b%a002070：噗嚕噗嚕噗嚕嚕！\n@c0@"
226:
  en: "@a%0%a002000@bWhere we headed next, aye? No sense wanderin' round like headless hacksauruses...\n@c0@"
  ja: "@a@b%a002000「さてさて　ここから\n\tどこに　行けるのかな？\n@c0@"
  ko: "@a@b%a002000: 그나저나 여긴\n어디로 이어져 있는 거지?\n@c0@"
  sl: "@a@b%a002000：好了！\n　　这里究竟通向什么地方呢？\n@c0@"
  tl: "@a@b%a002000：好了！\n　　這裡究竟通向什麼地方呢？\n@c0@"
227:
  en: "@a%0%a002010@bThe sea breeze here is frightfully strong. It's playing havoc with my hair!\n@c0@"
  ja: "@a@b%a002010「この　あたりは\n\t海からの　風が　強いのね。\n\tカミの毛が　ボサボサだわ。\n@c0@"
  ko: "@a@b%a002010: 이 주변은\n바닷바람이 강한걸.\n머릿결이 거칠어졌어.\n@c0@"
  sl: "@a@b%a002010：这一带\n　　海风很强呢。\n　　头发都被吹得乱蓬蓬的。\n@c0@"
  tl: "@a@b%a002010：這一帶\n　　海風很強呢。\n　　頭髮都被吹得亂蓬蓬的。\n@c0@"
228:
  en: "@a%0%a002020@bThat wasn't fun... I came THIS close to falling down the stairs at one point.\n@c0@"
  ja: "@a@b%a002020「さっき　階段で\n\t足を　すべらせそうに\n\tなっちゃって　こわかったー！\n@c0@"
  ko: "@a@b%a002020: 아까 계단에서\n발이 미끄러질 뻔해서\n무서웠어~!\n@c0@"
  sl: "@a@b%a002020：刚才在楼梯上，\n　　差点滑了一跤，\n　　吓死我了！\n@c0@"
  tl: "@a@b%a002020：剛才在樓梯上，\n　　差點滑了一跤，\n　　嚇死我了！\n@c0@"
229:
  en: "@a%0%a002030@bSo we're stuck between steep mountains and the deep blue sea. We'll have to keep pressing forward!\n@c0@"
  ja: "@a@b%a002030「片側は　けわしい山\n\t片側は　海。\n\tまっすぐ進むしか　ないようですね。\n@c0@"
  ko: "@a@b%a002030: 한쪽은 가파른 산,\n한쪽은 바다.\n앞으로 쭉 갈 수밖에 없겠군요.\n@c0@"
  sl: "@a@b%a002030：一边是险峻的高山，\n　　一边是深海。\n　　好像只有向前一条路可以走了呢。\n@c0@"
  tl: "@a@b%a002030：一邊是險峻的高山，\n　　一邊是深海。\n　　好像只有向前一條路可以走了呢。\n@c0@"
230:
  en: "@a%0%a002050@bI was a tad concerned about my ears poppin' in the upper world, but it seems there's nothing to fear.\n@c0@"
  ja: "@a@b%a002050「上の世界と　下の世界って\n\t気圧なんかは　かわらないですね。\n\t耳　キーンと　しないし。\n@c0@"
  ko: "@a@b%a002050: 위쪽 세계와 아래쪽 세계는\n기압 같은 건 다르지 않나 보죠?\n귀가 아프지 않습니다.\n@c0@"
  sl: "@a@b%a002050：上下两个世界，\n　　气压好像差不多呢。\n　　我居然都没有耳鸣。\n@c0@"
  tl: "@a@b%a002050：上下兩個世界，\n　　氣壓好像差不多呢。\n　　我居然都沒有耳鳴。\n@c0@"
231:
  en: "@a%0%a002000@bSo we're stuck twiddlin' our thumbs 'cause that guard's catchin' up on his beauty sleep? Can't say I'm too happy about this...\n@c0@"
  ja: "@a@b%a002000「関所の　番兵が\n\tねているから　先に\n\t進めないなんて　妙な話だな。\n@c0@"
  ko: "@a@b%a002000: 관문 파수병이\n잠드는 바람에 앞으로\n나아갈 수 없다니, 희한한 일이군.\n@c0@"
  sl: "@a@b%a002000：因为关卡的哨兵没睡醒，\n　　所以不放咱们过去，\n　　实在是说不通啊。\n@c0@"
  tl: "@a@b%a002000：因為關卡的哨兵沒睡醒，\n　　所以不放咱們過去，\n　　實在是說不通啊。\n@c0@"
232:
  en: "@a%0%a002010@bSo the checkpoint is currently impassable...\n@c0@"
  ja: "@a@b%a002010「今のところ\n\t関所までで　行きどまり……\n\tという　ことね。\n@c0@"
  ko: "@a@b%a002010: 일단 지금은\n관문에서 길이 막혀 있는\n상태네......\n@c0@"
  sl: "@a@b%a002010：也就是说，\n　　现在我们只能走到关卡那里……\n　　是这个意思吧。\n@c0@"
  tl: "@a@b%a002010：也就是說，\n　　現在我們只能走到關卡那裡……\n　　是這個意思吧。\n@c0@"
233:
  en: "@a%0%a002020@bI'd love to see the other side of that checkpoint some day...\n@c0@"
  ja: "@a@b%a002020「いつか　関所の\n\t向こうまで　行きたいわね。\n@c0@"
  ko: "@a@b%a002020: 언젠가 관문\n너머로 가고 싶어.\n@c0@"
  sl: "@a@b%a002020：我们什么时候\n　　才能去关卡对面呢。\n@c0@"
  tl: "@a@b%a002020：我們什麼時候\n　　才能去關卡對面呢。\n@c0@"
234:
  en: "@a%0%a002030@bIt seems that we won't be able to pass for the moment. Everything in its own time, I suppose...\n@c0@"
  ja: "@a@b%a002030「ざんねんですが\n\tこの先の　たんさくは\n\tいつか　また……。\n@c0@"
  ko: "@a@b%a002030: 아쉽지만\n이 너머를 탐색하는 건\n언젠가 다시......\n@c0@"
  sl: "@a@b%a002030：真是遗憾。\n　　关卡对面的风景，\n　　等有机会再饱眼福吧。\n@c0@"
  tl: "@a@b%a002030：真是遺憾。\n　　關卡對面的風景，\n　　等有機會再飽眼福吧。\n@c0@"
235:
  en: "@a%0%a002050@bSeems a bit like we went out of our way for nothing. Still, mustn't grumble, I suppose.\n@c0@"
  ja: "@a@b%a002050「ちょっと　まわり道\n\tしちゃった　感じですね。\n@c0@"
  ko: "@a@b%a002050: 길을 좀 돌아 온\n느낌이군요.\n@c0@"
  sl: "@a@b%a002050：我总觉得\n　　我们好像绕了远路。\n@c0@"
  tl: "@a@b%a002050：我總覺得\n　　我們好像繞了遠路。\n@c0@"
236:
  en: "@a%0%a002000@bThe landscape's wide open here. Looks like we've got some serious walkin' to do.\n@c0@"
  ja: "@a@b%a002000「この　あたりは\n\t土地が　広びろ　してるな。\n\t歩きでが　ありそうだぜ。\n@c0@"
  ko: "@a@b%a002000: 이 부근은\n탁 트여 있군.\n넓어서 걸을 맛이 나겠어.\n@c0@"
  sl: "@a@b%a002000：这一带\n　　地形这么宽广啊。\n　　看来可有的走了。\n@c0@"
  tl: "@a@b%a002000：這一帶\n　　地形這麼寬廣啊。\n　　看來可有的走了。\n@c0@"
237:
  en: "@a%0%a002010@bThis place has a real air of tranquility — and some tranquil air too!\n@c0@"
  ja: "@a@b%a002010「のどかな　ところね。\n\t空気も　おいしいじゃない。\n@c0@"
  ko: "@a@b%a002010: 한적한 곳이네.\n공기도 상쾌한걸.\n@c0@"
  sl: "@a@b%a002010：真是个悠闲舒适的地方。\n　　空气这么清新，好好享受一下也好。\n@c0@"
  tl: "@a@b%a002010：真是個悠閒舒適的地方。\n　　空氣這麼清新，好好享受一下也好。\n@c0@"
238:
  en: "@a%0%a002020@bBoy, is it me, or are even the monsters around here a little... You know, ‘backwoodsy’?\n@c0@"
  ja: "@a@b%a002020「なんかさー。\n\t気のせいか　このへんって\n\tまものたちまで　いなか臭くない？\n@c0@"
  ko: "@a@b%a002020: 있잖아~\n기분 탓인지 모르겠지만 이 주변은\n마물까지도 촌스럽지 않아?\n@c0@"
  sl: "@a@b%a002020：我总觉得吧，\n　　这一带魔物的乡土气真重。\n　　是我的错觉？\n@c0@"
  tl: "@a@b%a002020：我總覺得吧，\n　　這一帶魔物的鄉土氣真重。\n　　是我的錯覺？\n@c0@"
239:
  en: "@a%0%a002030@bThis area has a rather calmer feel to it. It seems we can breathe a little more easily here.\n@c0@"
  ja: "@a@b%a002030「この　あたりは\n\tこれまでになく　のんびりとした\n\t雰囲気の　ところですね。\n@c0@"
  ko: "@a@b%a002030: 이 주변은\n지금까지와는 달리 유유자적한\n분위기군요.\n@c0@"
  sl: "@a@b%a002030：这一带的氛围\n　　真是前所未有地\n　　让人心旷神怡呢。\n@c0@"
  tl: "@a@b%a002030：這一帶的氛圍\n　　真是前所未有地\n　　讓人心曠神怡呢。\n@c0@"
240:
  en: "@a%0%a002050@bI could have sworn I just heard some monsters scrapping with each other in the woods.\n@c0@"
  ja: "@a@b%a002050「いま…　森の中から\n\tまものどうしで　あらそうような\n\t声が　聞こえました……。\n@c0@"
  ko: "@a@b%a002050: 지금... 숲 속에서\n마물끼리 말다툼을 하는 듯한\n소리가 들렸습니다......\n@c0@"
  sl: "@a@b%a002050：刚才我好像听到\n　　从森林中传来\n　　魔物内讧的声音……\n@c0@"
  tl: "@a@b%a002050：剛才我好像聽到\n　　從森林中傳來\n　　魔物內訌的聲音……\n@c0@"
241:
  en: "@a%0%a002050@bIf only all monsters had the decency to fight each other, I could retire happily to Scrimsley!\n@c0@"
  ja: "@a@b%a002050「どうせなら　みんな\n\tまものどうしで　戦ってくれれば\n\tいいんですがね。\n@c0@"
  ko: "@a@b%a002050: 이왕이면 마물끼리\n치고받고 싸워 주면\n좋겠는데 말이죠.\n@c0@"
  sl: "@a@b%a002050：要是魔物们\n　　全部自己内部消耗了，\n　　我们可就落得轻松了啊。\n@c0@"
  tl: "@a@b%a002050：要是魔物們\n　　全部自己內部消耗了，\n　　我們可就落得輕鬆了啊。\n@c0@"
242:
  en: "@a%0%a002000@bNo use wastin' our time huntin' for the Prince out here. We wouldn't know where to start.\n@c0@"
  ja: "@a@b%a002000「外じゃ　広すぎて\n\t王子を　さがしようが　ないよな。\n@c0@"
  ko: "@a@b%a002000: 밖은 너무 넓어서\n왕자를 찾을 방법이 없겠는걸.\n@c0@"
  sl: "@a@b%a002000：外面那么大，\n　　去哪找王子啊。\n@c0@"
  tl: "@a@b%a002000：外面那麼大，\n　　去哪找王子啊。\n@c0@"
243:
  en: "@a%0%a002010@bIf I were a spoilt delinquent prince, where would I go...?\n@c0@"
  ja: "@a@b%a002010「ホルス王子の　行きそうな\n\t場所といえば……。\n@c0@"
  ko: "@a@b%a002010: 홀스 왕자가 갈 만한\n곳이라면......\n@c0@"
  sl: "@a@b%a002010：荷尔斯王子\n　　可能会去的地方……\n@c0@"
  tl: "@a@b%a002010：荷爾斯王子\n　　可能會去的地方……\n@c0@"
244:
  en: "@a%0%a002020@bWe should probably pick a specific point and start searching. Wandering willy-nilly won't do us any good.\n@c0@"
  ja: "@a@b%a002020「あまり　うろうろしないで\n\tあたりを　つけて　さがしたほうが\n\tいいかもしれないね。\n@c0@"
  ko: "@a@b%a002020: 정처 없이 돌아다니지 말고\n후보를 정해서 찾아보는 게\n좋을지도 몰라.\n@c0@"
  sl: "@a@b%a002020：别神游了，\n　　先想想他可能会去哪，\n　　再去找他吧。\n@c0@"
  tl: "@a@b%a002020：別神遊了，\n　　先想想他可能會去哪，\n　　再去找他吧。\n@c0@"
245:
  en: "@a%0%a002030@bThe Goddess counsels us to have patience in times of adversity... But WHERE has that little brat got to!?\n@c0@"
  ja: "@a@b%a002030「ホルス王子……いったい\n\tどこに　いったんでしょう……。\n@c0@"
  ko: "@a@b%a002030: 홀스 왕자...... 대체\n어디로 간 걸까요......\n@c0@"
  sl: "@a@b%a002030：荷尔斯王子\n　　究竟在哪……\n@c0@"
  tl: "@a@b%a002030：荷爾斯王子\n　　究竟在哪……\n@c0@"
246:
  en: "@a%0%a002050@bThat Prince Howard doesn't need a royal rite of purification, he needs a rite royal clip round the ear!\n@c0@"
  ja: "@a@b%a002050「まったく　あんな弱虫王子は\n\t洗礼よりも　おせっきょうを\n\t受けさせたほうが　いいですね！\n@c0@"
  ko: "@a@b%a002050: 그런 겁쟁이 왕자는\n세례보다도 설교를\n받는 게 좋겠는데요!\n@c0@"
  sl: "@a@b%a002050：真是的，\n　　那个胆小鬼王子需要的不是洗礼，\n　　而是好好地被说一顿！\n@c0@"
  tl: "@a@b%a002050：真是的，\n　　那個膽小鬼王子需要的不是洗禮，\n　　而是好好地被說一頓！\n@c0@"
247:
  en: "@a%0%a002000@bIs that Prince Howard still taggin' along?\n@c0@"
  ja: "@a@b%a002000「ホルス王子は\n\tついてきてるかあ？\n@c0@"
  ko: "@a@b%a002000: 홀스 왕자는\n따라오고 있나?\n@c0@"
  sl: "@a@b%a002000：荷尔斯王子？\n　　跟上了吗？\n@c0@"
  tl: "@a@b%a002000：荷爾斯王子？\n　　跟上了嗎？\n@c0@"
248:
  en: "@aPrince Howard@bOh, I'm here alright! Against my better judgement...\n@c0@"
  ja: "@a@bホルス「ああ…いるぞ……。\n@c0@"
  ko: "@a@b홀스: 그래... 여기 있다......\n@c0@"
  sl: "@a@b荷尔斯：啊……我在呢……\n@c0@"
  tl: "@a@b荷爾斯：啊……我在呢……\n@c0@"
249:
  en: "@a%0%a002010@bAre you ready for the rite of purification, Prince Howard?\n@c0@"
  ja: "@a@b%a002010「めざすは\n\t洗礼の洞くつね。\n@c0@"
  ko: "@a@b%a002010: 목적지는\n세례의 동굴이야.\n@c0@"
  sl: "@a@b%a002010：目的地是\n　　洗礼洞窟吧。\n@c0@"
  tl: "@a@b%a002010：目的地是\n　　洗禮洞窟吧。\n@c0@"
250:
  en: "@aPrince Howard@bHmph!\n@c0@"
  ja: "@a@bホルス「……。\n@c0@"
  ko: "@a@b홀스: ......\n@c0@"
  sl: "@a@b荷尔斯：……\n@c0@"
  tl: "@a@b荷爾斯：……\n@c0@"
251:
  en: "@a%0%a002020@bI feel like I can't really let my hair down with the Prince around.\n@c0@"
  ja: "@a@b%a002020「王子と　いると\n\t気が　休まらないわ。\n@c0@"
  ko: "@a@b%a002020: 왕자랑 있으면\n마음이 가시방석이라니까.\n@c0@"
  sl: "@a@b%a002020：这王子真是\n　　一点都不让人省心。\n@c0@"
  tl: "@a@b%a002020：這王子真是\n　　一點都不讓人省心。\n@c0@"
252:
  en: "@aPrince Howard@bAnd you think I can relax with you around!?\n@c0@"
  ja: "@a@bホルス「オレだって　休まらないさ……。\n@c0@"
  ko: "@a@b홀스: 나도 마찬가지라구......\n@c0@"
  sl: "@a@b荷尔斯：我也是一刻都没歇着呢……\n@c0@"
  tl: "@a@b荷爾斯：我也是一刻都沒歇著呢……\n@c0@"
253:
  en: "@a%0%a002030@bI pray to the Goddess that we may carry our collective burdens with grace and forbearance...\n@c0@"
  ja: "@a@b%a002030「今日は　すべての\n\t物ごとが　つつがなく\n\t運びますように……。\n@c0@"
  ko: "@a@b%a002030: 오늘은 모든 일이\n아무 탈 없이\n진행되기를......\n@c0@"
  sl: "@a@b%a002030：希望今天\n　　一切事情都办得\n　　万无一失……\n@c0@"
  tl: "@a@b%a002030：希望今天\n　　一切事情都辦得\n　　萬無一失……\n@c0@"
254:
  en: "@aPrince Howard@bAre you referring to me as a burden?\n@c0@"
  ja: "@a@bホルス「オレは……\n\t運ばれるモノ　なのか……？\n@c0@"
