0:
  en: "@a%0%a002000@bAye, we're back, alright.\n@c0@"
  ja: "@a@b%a002000「よっ！\n\tまた　来たぜ！\n@c0@"
  ko: "@a@b%a002000: 여어!\n또 왔어!\n@c0@"
  sl: "@a@b%a002000：你好！\n　　俺们又来了！\n@c0@"
  tl: "@a@b%a002000：你好！\n　　俺們又來了！\n@c0@"
1:
  en: "@a%0%a002010@bI hope we're not intruding.\n@c0@"
  ja: "@a@b%a002010「おじゃまします。\n@c0@"
  ko: "@a@b%a002010: 잠시 들렀다 갈게요.\n@c0@"
  sl: "@a@b%a002010：打扰了。\n@c0@"
  tl: "@a@b%a002010：打擾了。\n@c0@"
2:
  en: "@a%0%a002020@bGood to be here!\n@c0@"
  ja: "@a@b%a002020「こんにちはー！\n@c0@"
  ko: "@a@b%a002020: 안녕~!\n@c0@"
  sl: "@a@b%a002020：你好！\n@c0@"
  tl: "@a@b%a002020：你好！\n@c0@"
3:
  en: "@a%0%a002030@bIt is indeed good to be back.\n@c0@"
  ja: "@a@b%a002030「ありがとう。\n\tただいま　もどりました。\n@c0@"
  ko: "@a@b%a002030: 감사합니다.\n다녀왔습니다.\n@c0@"
  sl: "@a@b%a002030：谢谢。\n　　我们回来了。\n@c0@"
  tl: "@a@b%a002030：謝謝。\n　　我們回來了。\n@c0@"
4:
  en: "@a%0%a002050@bBy heck, this is a fancy place! So this is where %a002030 was born and raised?\n@c0@"
  ja: "@a@b%a002050「いやー　すごいところですね！\n\t%a002030さんは　この村で\n\tうまれ　そだったのですか！？\n@c0@"
  ko: "@a@b%a002050: 우와~ 대단한 곳이네요!\n%a002030 님은 이 마을에서\n태어나서 자란 겁니까!?\n@c0@"
  sl: "@a@b%a002050：哎呀，真是厉害！\n　　%a002030是在这个村子里\n　　出生长大的么？！\n@c0@"
  tl: "@a@b%a002050：哎呀，真是厲害！\n　　%a002030是在這個村子裡\n　　出生長大的麼？！\n@c0@"
5:
  en: "@a%0%a002000@bGood to see the girl back on her feet! Kids should be gettin' into trouble — it's nature's way!\n@c0@"
  ja: "@a@b%a002000「おばさん　よかったな！\n\t子供の　病気ほど\n\tつらいもの　ないもんな！\n@c0@"
  ko: "@a@b%a002000: 아줌마, 잘됐군!\n아이가 아픈 것만큼\n힘든 일은 없지!\n@c0@"
  sl: "@a@b%a002000：太好了，大婶！\n　　孩子生了病，\n　　做父母的绝对难受死了吧！\n@c0@"
  tl: "@a@b%a002000：太好了，大嬸！\n　　孩子生了病，\n　　做父母的絕對難受死了吧！\n@c0@"
6:
  en: "@a%0%a002010@bThe Ghentiles do not discriminate when it comes to healing. They really are a wonderful people.\n@c0@"
  ja: "@a@b%a002010「誰でも　わけへだてなく\n\tいやしてくれる……。\n\t本当に　ゲントの人びとは　すばらしいわ。\n@c0@"
  ko: "@a@b%a002010: 누구든 가리지 않고\n치유해 준다니......\n겐트 사람들은 정말 훌륭해.\n@c0@"
  sl: "@a@b%a002010：不管是谁\n　　都一视同仁地救治……\n　　根特族的人们都是好人啊。\n@c0@"
  tl: "@a@b%a002010：不管是誰\n　　都一視同仁地救治……\n　　根特族的人們都是好人啊。\n@c0@"
7:
  en: "@a%0%a002020@bThis town sure is a hot ticket for the sick and injured.\n@c0@"
  ja: "@a@b%a002020「病気の人たちにとって\n\tこの村の　そんざいが\n\tとっても　大きいのが　わかるわね。\n@c0@"
  ko: "@a@b%a002020: 아픈 사람들에게\n이 마을의 존재가\n엄청나다는 걸 알 수 있네.\n@c0@"
  sl: "@a@b%a002020：我能理解，\n　　这个村子对于患病的人来说，\n　　是一个神圣的地方呢。\n@c0@"
  tl: "@a@b%a002020：我能理解，\n　　這個村子對於患病的人來說，\n　　是一個神聖的地方呢。\n@c0@"
8:
  en: "@a%0%a002030@bSeeing the joy in the faces of those who have been healed in Ghent is our highest pleasure.\n@c0@"
  ja: "@a@b%a002030「みなさんの　よろこぶ顔が\n\t私たち　ゲント族にとって\n\t最高の　ごほうびですね。\n@c0@"
  ko: "@a@b%a002030: 사람들이 기뻐하는 모습이\n바로 저희 겐트족에게는\n최고의 선물이죠.\n@c0@"
  sl: "@a@b%a002030：大家的笑脸\n　　对于我们根特族来说，\n　　就是至上的褒奖。\n@c0@"
  tl: "@a@b%a002030：大家的笑臉\n　　對於我們根特族來說，\n　　就是至上的褒獎。\n@c0@"
9:
  en: "@a%0%a002050@bMy word! It looks like old %a002050 is tearin' up once again! (sniff)\n@c0@"
  ja: "@a@b%a002050「あ…　私の目に\n\tなぜか　雨水が……。\n@c0@"
  ko: "@a@b%a002050: 아... 제 눈에서\n영문 모를 땀이......\n@c0@"
  sl: "@a@b%a002050：啊……我的眼睛里……\n　　怎么进了雨水……\n@c0@"
  tl: "@a@b%a002050：啊……我的眼睛裡……\n　　怎麼進了雨水……\n@c0@"
10:
  en: "@a%0%a002000@bIf ya don't count a few cuts 'n' bruises, I'm as healthy as Peggy Sue!\n@c0@"
  ja: "@a@b%a002000「小さな　キズなら\n\t山ほど　あるけどな！\n@c0@"
  ko: "@a@b%a002000: 작은 상처라면\n잔뜩 있는데 말이지!\n@c0@"
  sl: "@a@b%a002000：要说小伤的话，\n　　俺有一堆！\n@c0@"
  tl: "@a@b%a002000：要說小傷的話，\n　　俺有一堆！\n@c0@"
11:
  en: "@a%0%a002010@bFortunately we all seem to be in one piece, don't we, %a000090?\n@c0@"
  ja: "@a@b%a002010「おかげさまで\n\t今は　みんな　けんこうだわ。\n@c0@"
  ko: "@a@b%a002010: 덕분에\n지금은 모두 건강해.\n@c0@"
  sl: "@a@b%a002010：托您的福，\n　　现在大家都很健康。\n@c0@"
  tl: "@a@b%a002010：托您的福，\n　　現在大家都很健康。\n@c0@"
12:
  en: "@a%0%a002020@bOh, we're right as rain!\n@c0@"
  ja: "@a@b%a002020「あたしたち\n\t元気　元気！\n@c0@"
  ko: "@a@b%a002020: 우리\n엄청 건강해!\n@c0@"
  sl: "@a@b%a002020：我们几个很健康！\n@c0@"
  tl: "@a@b%a002020：我們幾個很健康！\n@c0@"
13:
  en: "@a%0%a002050@bWell, to be honest, I did have a rather embarrassing illness for a while there, but I'm right as rain now!\n@c0@"
  ja: "@a@b%a002050「私の　病気は　もう\n\tすっかり　よくなりました！\n@c0@"
  ko: "@a@b%a002050: 제 병은 이제\n완전히 나았습니다!\n@c0@"
  sl: "@a@b%a002050：我的病已经痊愈了！\n@c0@"
  tl: "@a@b%a002050：我的病已經痊癒了！\n@c0@"
14:
  en: "@a%0%a002000@bRight then! Let's see what the Elder's got to say for himself!\n@c0@"
  ja: "@a@b%a002000「そうだった！\n\t長老に　会いに行こうぜ！\n@c0@"
  ko: "@a@b%a002000: 그렇지!\n장로를 만나러 가자!\n@c0@"
  sl: "@a@b%a002000：对了！\n　　去见见长老吧！\n@c0@"
  tl: "@a@b%a002000：對了！\n　　去見見長老吧！\n@c0@"
15:
  en: "@a%0%a002010@bThe Elder is sure to help us out.\n@c0@"
  ja: "@a@b%a002010「長老さまなら\n\tなんとかして　くださるわ。\n@c0@"
  ko: "@a@b%a002010: 장로님이라면\n어떻게든 손을 써 주실 거야.\n@c0@"
  sl: "@a@b%a002010：长老大人\n　　一定会有办法的。\n@c0@"
  tl: "@a@b%a002010：長老大人\n　　一定會有辦法的。\n@c0@"
16:
  en: "@a%0%a002020@bOh, right! We can get the Elder to handle the resurrection!\n@c0@"
  ja: "@a@b%a002020「長老さまに\n\t生きかえらせて　もらうんだね！\n@c0@"
  ko: "@a@b%a002020: 장로님한테\n살려 달라고 하면 되겠네!\n@c0@"
  sl: "@a@b%a002020：长老大人\n　　一定能复活这个人吧！\n@c0@"
  tl: "@a@b%a002020：長老大人\n　　一定能復活這個人吧！\n@c0@"
17:
  en: "@a%0%a002050@bThe Elder of Ghent must be powerful. Old %a002050 hasn't met anyone this holy-feeling ever before!\n@c0@"
  ja: "@a@b%a002050「ゲントの　長老さまは\n\tすごい　チカラを\n\tお持ちなんですねー！\n@c0@"
  ko: "@a@b%a002050: 겐트의 장로님은\n엄청난 힘을\n가지고 계시는군요~!\n@c0@"
  sl: "@a@b%a002050：根特族的长老\n　　拥有很厉害的力量呢！\n@c0@"
  tl: "@a@b%a002050：根特族的長老\n　　擁有很厲害的力量呢！\n@c0@"
18:
  en: "@a%0%a002000@bWe're not here for any sacred sacredness! We're here to tell the Elder that Murdaw's history!\n@c0@"
  ja: "@a@b%a002000「おまいり　というより\n\tムドーを　たおしたっていう\n\tほうこくかな。\n@c0@"
  ko: "@a@b%a002000: 참배하러 왔다기보단\n무도를 쓰러뜨린 걸\n보고하러 왔다고 봐야지.\n@c0@"
  sl: "@a@b%a002000：咱们不是来朝拜的，\n　　是来报告姆多已经被打倒了的。\n@c0@"
  tl: "@a@b%a002000：咱們不是來朝拜的，\n　　是來報告姆多已經被打倒了的。\n@c0@"
19:
  en: "@a%0%a002010@bSpeaking of sacredness... Shall we pay the Elder a visit?\n@c0@"
  ja: "@a@b%a002010「長老さまに\n\tごあいさつ　していきましょう。\n@c0@"
  ko: "@a@b%a002010: 장로님께\n인사드리고 가자.\n@c0@"
  sl: "@a@b%a002010：去跟长老大人\n　　问声好吧。\n@c0@"
  tl: "@a@b%a002010：去跟長老大人\n　　問聲好吧。\n@c0@"
20:
  en: "@a%0%a002020@bHey, I think I just heard some kid shout %a002030's name!\n@c0@"
  ja: "@a@b%a002020「あっ　どこからか\n\t元気な　子供の声が\n\tきこえるよ！\n@c0@"
  ko: "@a@b%a002020: 앗, 어디선가\n건강한 아이의 목소리가\n들려!\n@c0@"
  sl: "@a@b%a002020：啊，\n　　我听见从哪传来了\n　　孩子们欢快的声音！\n@c0@"
  tl: "@a@b%a002020：啊，\n　　我聽見從哪傳來了\n　　孩子們歡快的聲音！\n@c0@"
21:
  en: "@a%0%a002050@bI wouldn't mind some of that sacredness! It'd be sure to impress the folks back home!\n@c0@"
  ja: "@a@b%a002050「私　おまいり\n\tしたいです！\n@c0@"
  ko: "@a@b%a002050: 저, 참배하고\n싶어요!\n@c0@"
  sl: "@a@b%a002050：我也想去朝拜啊！\n@c0@"
  tl: "@a@b%a002050：我也想去朝拜啊！\n@c0@"
22:
  en: "@a%0%a002030@bIt is good to be back. My fellow Ghentiles are looking well, may the Goddess be praised.\n@c0@"
  ja: "@a@b%a002030「はい　あなたも\n\tお元気そうで　なによりです。\n@c0@"
  ko: "@a@b%a002030: 네. 당신도\n건강해 보여서 다행입니다.\n@c0@"
  sl: "@a@b%a002030：嗯，你看起来精神也不错，\n　　太好了。\n@c0@"
  tl: "@a@b%a002030：嗯，你看起來精神也不錯，\n　　太好了。\n@c0@"
23:
  en: "@a%0%a002000@bSo %a002030's gonna star in his own poem!? Better him than me! I've got no time for rhyme!\n@c0@"
  ja: "@a@b%a002000「へえー\n\tもう　%a002030のことが\n\t物語に　なってるんだな。\n@c0@"
  ko: "@a@b%a002000: 호오,\n벌써 %a002030%F2030%X가%Y이%Z\n전설 속 인물이 되었군.\n@c0@"
  sl: "@a@b%a002000：哎，\n　　%a002030的事迹已经被写进\n　　故事中了啊。\n@c0@"
  tl: "@a@b%a002000：哎，\n　　%a002030的事蹟已經被寫進\n　　故事中了啊。\n@c0@"
24:
  en: "@a%0%a002010@bWow, I'm so proud of %a002030. He truly is a holy warrior of Ghent!\n@c0@"
  ja: "@a@b%a002010「ゲント族の　戦士は\n\t%a002030の　ことね。\n@c0@"
  ko: "@a@b%a002010: 겐트족 전사는\n%a002030%F2030%X를%Y을%Z 말하는 거겠지?\n@c0@"
  sl: "@a@b%a002010：根特族的战士，\n　　说的是%a002030吧。\n@c0@"
  tl: "@a@b%a002010：根特族的戰士，\n　　說的是%a002030吧。\n@c0@"
25:
  en: "@a%0%a002020@bWow! This is how legends are made!\n@c0@"
  ja: "@a@b%a002020「新しい　伝説の\n\tたんじょうだね！\n@c0@"
  ko: "@a@b%a002020: 새로운 전설이\n탄생했네!\n@c0@"
  sl: "@a@b%a002020：新的传说诞生了！\n@c0@"
  tl: "@a@b%a002020：新的傳說誕生了！\n@c0@"
26:
  en: "@a%0%a002030@bPlease, do not praise me too highly. All we have achieved has been in line with the will of the Goddess.\n@c0@"
  ja: "@a@b%a002030「ありがとう　ございます。\n\tみなさんの　おうえんの\n\tおかげです。\n@c0@"
  ko: "@a@b%a002030: 고맙습니다.\n여러분이 응원해 주신\n덕분입니다.\n@c0@"
  sl: "@a@b%a002030：谢谢！\n　　这都是因为有大家对我的支持。\n@c0@"
  tl: "@a@b%a002030：謝謝！\n　　這都是因為有大家對我的支持。\n@c0@"
27:
  en: "@a%0%a002050@bFancy that! Appearin' in your very own poem! Do you think there's any room for old %a002050 in there?\n@c0@"
  ja: "@a@b%a002050「感動的です！\n\tカッコいいです！\n@c0@"
  ko: "@a@b%a002050: 감동적입니다!\n멋있어요!\n@c0@"
  sl: "@a@b%a002050：我太感动了！\n　　帅呆了！\n@c0@"
  tl: "@a@b%a002050：我太感動了！\n　　帥呆了！\n@c0@"
28:
  en: "@a%0%a002000@bSeems like %a002030's a big-shot around here. Maybe I should ask for his autograph?\n@c0@"
  ja: "@a@b%a002000「この村では\n\t%a002030は　ほんとうに\n\t大スターだなあ。\n@c0@"
  ko: "@a@b%a002000: 이 마을에서\n%a002030%F2030%X는%Y은%Z 정말\n대단한 스타로군.\n@c0@"
  sl: "@a@b%a002000：%a002030已经成为\n　　这个村庄的大红人了呢。\n@c0@"
  tl: "@a@b%a002000：%a002030已經成為\n　　這個村莊的大紅人了呢。\n@c0@"
29:
  en: "@a%0%a002010@bWell, well... %0%a002030 seems to be the mothers' favourite!\n@c0@"
  ja: "@a@b%a002010「%a002030は\n\t人気者ねえ。\n@c0@"
  ko: "@a@b%a002010: %a002030%F2030%X는%Y은%Z\n인기인이네~\n@c0@"
  sl: "@a@b%a002010：%a002030\n　　已经是个名人了呢。\n@c0@"
  tl: "@a@b%a002010：%a002030\n　　已經是個名人了呢。\n@c0@"
30:
  en: "@a%0%a002020@bTee hee! Energy to spare, huh?\n@c0@"
  ja: "@a@b%a002020「あはっ\n\t元気いっぱいね。\n@c0@"
  ko: "@a@b%a002020: 아하핫,\n기운이 넘치네.\n@c0@"
  sl: "@a@b%a002020：啊哈，\n　　精神饱满呢。\n@c0@"
  tl: "@a@b%a002020：啊哈，\n　　精神飽滿呢。\n@c0@"
31:
  en: "@a%0%a002030@bNeedless to say, I did not defeat Murdaw alone!\n@c0@"
  ja: "@a@b%a002030「こらこら　ぼうや。\n\t私だけの力で　やったことでは\n\tありませんから。\n@c0@"
  ko: "@a@b%a002030: 이런. 얘야,\n나 혼자의 힘으로 해낸 건\n아니란다.\n@c0@"
  sl: "@a@b%a002030：喂喂，小朋友。\n　　我可不是凭借一己之力\n　　做到的哦。\n@c0@"
  tl: "@a@b%a002030：喂喂，小朋友。\n　　我可不是憑藉一己之力\n　　做到的哦。\n@c0@"
32:
  en: "@a%0%a002050@bI know a thing or two about bein' a hometown hero. It's got its perks, but you have to work hard too!\n@c0@"
  ja: "@a@b%a002050「%a002030さんは\n\t子供たちの　ヒーローなんですね！\n\tいや　すばらしいです！\n@c0@"
  ko: "@a@b%a002050: %a002030 님은\n아이들의 영웅이군요!\n이야, 멋집니다!\n@c0@"
  sl: "@a@b%a002050：%a002030成为了\n　　孩子们的英雄呢！\n　　哎呀，真棒！\n@c0@"
  tl: "@a@b%a002050：%a002030成為了\n　　孩子們的英雄呢！\n　　哎呀，真棒！\n@c0@"
33:
  en: "@a%0%a002000@bGood to see this kid so rarin' to go again. I just hope she doesn't overdo it!\n@c0@"
  ja: "@a@b%a002000「せっかく　病気なおったのに\n\tころんで　ケガするなよ！\n@c0@"
  ko: "@a@b%a002000: 겨우 병이 나았는데\n넘어져서 다치지 말라고!\n@c0@"
  sl: "@a@b%a002000：好不容易病才好，\n　　别又摔伤了！\n@c0@"
  tl: "@a@b%a002000：好不容易病才好，\n　　別又摔傷了！\n@c0@"
34:
  en: "@a%0%a002010@bWonderful! The child has been cured!\n@c0@"
  ja: "@a@b%a002010「この子も　すっかり\n\t元気に　なったのね。\n@c0@"
  ko: "@a@b%a002010: 이 아이도 몰라보게\n건강해졌구나.\n@c0@"
  sl: "@a@b%a002010：这个孩子也变得\n　　充满朝气了呢。\n@c0@"
  tl: "@a@b%a002010：這個孩子也變得\n　　充滿朝氣了呢。\n@c0@"
35:
  en: "@a%0%a002020@bI'm no doctor, but I'd say she's made a full recovery. She's so spry!\n@c0@"
