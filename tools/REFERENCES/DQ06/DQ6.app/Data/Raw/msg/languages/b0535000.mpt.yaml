315:
  en: "@a%0%a002050@bRight, let's hurry back to Clearvale before that Tom Foolery fellow puts in an appearance.\n@c0@"
  ja: "@a@b%a002050「さあ　さあ！　パノンさんが\n\t来ちゃったり　しないうちに\n\tクリアベールに　急ぎましょう！\n@c0@"
  ko: "@a@b%a002050: 자! 혹시 파논 씨가\n와 버리기 전에\n클리어베일로 어서 돌아가죠!\n@c0@"
  sl: "@a@b%a002050：好了好了！\n　　趁着帕农还没来，\n　　赶紧回克里亚贝尔吧！\n@c0@"
  tl: "@a@b%a002050：好了好了！\n　　趁著帕農還沒來，\n　　趕緊回克里亞貝爾吧！\n@c0@"
316:
  en: "@a%0%a002000@bA flyin' bed! Sounds like a first-class way to travel, aye?\n@c0@"
  ja: "@a@b%a002000「空飛ぶベッド\n\tいいものを　手に入れたな！\n@c0@"
  ko: "@a@b%a002000: 하늘을 나는 침대라.\n좋은 걸 얻었군!\n@c0@"
  sl: "@a@b%a002000：咱们居然得到了\n　　飞天床这么个了不得的玩意！\n@c0@"
  tl: "@a@b%a002000：咱們居然得到了\n　　飛天床這麼個了不得的玩意！\n@c0@"
317:
  en: "@a%0%a002010@bWe got an even better present in return. How nice!\n@c0@"
  ja: "@a@b%a002010「私たちの　ほうが\n\tすてきな　プレゼントを\n\tもらっちゃったわね。\n@c0@"
  ko: "@a@b%a002010: 오히려 우리가\n멋진 선물을\n받아 버렸네.\n@c0@"
  sl: "@a@b%a002010：得到了珍贵礼物的，\n　　反倒是我们呢。\n@c0@"
  tl: "@a@b%a002010：得到了珍貴禮物的，\n　　反倒是我們呢。\n@c0@"
318:
  en: "@a%0%a002020@bOur own flying bed? Now I feel like we owe the kid!\n@c0@"
  ja: "@a@b%a002020「ジョンくんに\n\tありがとうって　気持ちだね！\n@c0@"
  ko: "@a@b%a002020: 존에게\n고마운 마음이야!\n@c0@"
  sl: "@a@b%a002020：我们要谢谢\n　　小约翰才行呢！\n@c0@"
  tl: "@a@b%a002020：我們要謝謝\n　　小約翰才行呢！\n@c0@"
319:
  en: "@a%0%a002030@bThe altitude achieved by the bed in full flight isn't sufficient to clear tall trees or mountains.\n@c0@"
  ja: "@a@b%a002030「ベッドの飛ぶ　高さをみると\n\t高い木や　山のあるところを\n\tこえるのは　ムリのようです。\n@c0@"
  ko: "@a@b%a002030: 침대가 나는 높이를 보니\n높은 나무나 산이 있는 곳을\n넘어가기는 힘들 것 같습니다.\n@c0@"
  sl: "@a@b%a002030：这床只能飞这么高，\n　　所以森林那种树木很高的地方，\n　　以及有山的地方是过不去的。\n@c0@"
  tl: "@a@b%a002030：這床只能飛這麼高，\n　　所以森林那種樹木很高的地方，\n　　以及有山的地方是過不去的。\n@c0@"
320:
  en: "@a%0%a002030@bHowever, it WILL take us over oceans and rivers. And what could offer a more comfortable flight than a bed?\n@c0@"
  ja: "@a@b%a002030「でも　そのまま\n\t川や　海にも　出れますから\n\t行ける場所が　広がりましたね！\n@c0@"
  ko: "@a@b%a002030: 하지만 그대로\n강이나 바다로 나갈 수도 있으니\n갈 수 있는 곳이 늘어났겠군요!\n@c0@"
  sl: "@a@b%a002030：不过，我们能乘坐飞天床\n　　越过大海，穿过平原，\n　　能去的地方又增多了呢！\n@c0@"
  tl: "@a@b%a002030：不過，我們能乘坐飛天床\n　　越過大海，穿過平原，\n　　能去的地方又增多了呢！\n@c0@"
321:
  en: "@a%0%a002050@bI'm not keen on heights, but I won't pass up the opportunity of seein' the world from aboard a flyin' bed!\n@c0@"
  ja: "@a@b%a002050「ベッドに　のって\n\t空を飛ぶなんて　今まで　夢にも\n\t見たことが　ありませんでした！\n@c0@"
  ko: "@a@b%a002050: 침대를 타고\n하늘을 날다니, 지금껏 꿈속에서도\n본 적이 없는걸요!\n@c0@"
  sl: "@a@b%a002050：我做梦都没有想过\n　　居然能坐在床上\n　　在空中翱翔！\n@c0@"
  tl: "@a@b%a002050：我做夢都沒有想過\n　　居然能坐在床上\n　　在空中翱翔！\n@c0@"
322:
  en: "@a%0%a002000@bA flyin' bed can take us to all kinds of new places. The only question is, where shall we go first?\n@c0@"
  ja: "@a@b%a002000「空飛ぶベッドが　手に入って\n\t行ける場所が　ふえたのはいいが\n\tわけが　わからなく　なりそうだな。\n@c0@"
  ko: "@a@b%a002000: 하늘을 나는 침대를 얻고서\n갈 수 있는 곳이 늘어난 건 좋지만\n여기가 어딘지 통 모르겠군.\n@c0@"
  sl: "@a@b%a002000：拿到飞天床之后能去更多的地方，\n　　听起来倒是不错，\n　　但这东西还是让人觉得莫名其妙。\n@c0@"
  tl: "@a@b%a002000：拿到飛天床之後能去更多的地方，\n　　聽起來倒是不錯，\n　　但這東西還是讓人覺得莫名其妙。\n@c0@"
323:
  en: "@a%0%a002010@bIt seems we've arrived in yet another new location in the real world. Let's investigate!\n@c0@"
  ja: "@a@b%a002010「さあ　下の世界の\n\t知らない　土地に　ついたわ。\n\tいろいろ　調べてみましょ！\n@c0@"
  ko: "@a@b%a002010: 이제 아래쪽 세계의\n모르는 곳에 도착했어.\n이것저것 살펴보자구.\n@c0@"
  sl: "@a@b%a002010：好了，\n　　已经到达下面世界中没到过的地方了。\n　　好好调查一下吧！\n@c0@"
  tl: "@a@b%a002010：好了，\n　　已經到達下面世界中沒到過的地方了。\n　　好好調查一下吧！\n@c0@"
324:
  en: "@a%0%a002020@bHaah... Haah... Yay... Stairs again...\n@c0@"
  ja: "@a@b%a002020「はあ……。\n\tやっぱ　階段は　つかれるわー。\n@c0@"
  ko: "@a@b%a002020: 휴......\n역시 계단은 피곤해.\n@c0@"
  sl: "@a@b%a002020：哈……\n　　爬楼梯果真累死人。\n@c0@"
  tl: "@a@b%a002020：哈……\n　　爬樓梯果真累死人。\n@c0@"
325:
  en: "@a%0%a002030@bI would suggest that we begin by looking for any nearby towns or villages.\n@c0@"
  ja: "@a@b%a002030「とにかく　町か　村を\n\tさがしましょう。\n@c0@"
  ko: "@a@b%a002030: 어쨌든 마을부터\n찾아봅시다.\n@c0@"
  sl: "@a@b%a002030：总之先找找\n　　有没有城镇或者村庄吧。\n@c0@"
  tl: "@a@b%a002030：總之先找找\n　　有沒有城鎮或者村莊吧。\n@c0@"
326:
  en: "@a%0%a002050@bSo is this the basement or what? Old %a002050 is gettin' a touch confused.\n@c0@"
  ja: "@a@b%a002050「えーと　ここは\n\t地下２階　とかじゃ\n\tないですよね……。\n@c0@"
  ko: "@a@b%a002050: 음~ 여긴\n설마 지하 2층은\n아니겠죠......\n@c0@"
  sl: "@a@b%a002050：那个……\n　　这里应该不是地下二层之类的地方吧……\n@c0@"
  tl: "@a@b%a002050：那個……\n　　這裡應該不是地下二層之類的地方吧……\n@c0@"
327:
  en: "@a%0%a002000@bDid I hear the gatekeeper say Turnscote? Somethin' familiar about that name...\n@c0@"
  ja: "@a@b%a002000「いま　門番は\n\tロンガデセオって　言ってたか？\n\tどっかで　聞いたような……。\n@c0@"
  ko: "@a@b%a002000: 지금 문지기가\n론가데세오라고 했나?\n어디서 들어본 것 같은데......\n@c0@"
  sl: "@a@b%a002000：刚才看门的是说\n　　这里是洛卡迪塞欧吧？\n　　好像在哪听过这名字……\n@c0@"
  tl: "@a@b%a002000：剛才看門的是說\n　　這裡是洛卡迪塞歐吧？\n　　好像在哪聽過這名字……\n@c0@"
328:
  en: "@a%0%a002010@bSo that was Turnscote. I sense that we'd do well to remember that name.\n@c0@"
  ja: "@a@b%a002010「この町が\n\tロンガデセオなのね。\n\tおぼえておきましょ。\n@c0@"
  ko: "@a@b%a002010: 이 마을이\n론가데세오구나.\n기억해 두자.\n@c0@"
  sl: "@a@b%a002010：这个城镇叫做洛卡迪塞欧吧。\n　　这个要好好记住才行。\n@c0@"
  tl: "@a@b%a002010：這個城鎮叫做洛卡迪塞歐吧。\n　　這個要好好記住才行。\n@c0@"
329:
  en: "@a%0%a002020@bWe wouldn't fit in that town? What'd that guy mean by that?\n@c0@"
  ja: "@a@b%a002020「なーんか　今の町\n\tあたしたち　みたいな　品のいい\n\t人間は　入れないって言ってたね！\n@c0@"
  ko: "@a@b%a002020: 으음, 방금 그 마을은\n우리 같은 품격 있는\n사람들은 들어갈 수 없다고 했지!\n@c0@"
  sl: "@a@b%a002020：我总觉得他的意思是说，\n　　这里不是我们这样\n　　高贵冷艳的人该来的地方！\n@c0@"
  tl: "@a@b%a002020：我總覺得他的意思是說，\n　　這裡不是我們這樣\n　　高貴冷豔的人該來的地方！\n@c0@"
330:
  en: "@a%0%a002020@bOh, he must mean we were too classy for it. What a nice thing to say! Tee hee!\n@c0@"
  ja: "@a@b%a002020「えへへ。\n\tけっこう　人を　見る目が\n\tあるじゃん！\n@c0@"
  ko: "@a@b%a002020: 에헤헤.\n사람 보는 눈이\n있는걸!\n@c0@"
  sl: "@a@b%a002020：诶嘿嘿。\n　　还挺有看人的眼光的嘛！\n@c0@"
  tl: "@a@b%a002020：誒嘿嘿。\n　　還挺有看人的眼光的嘛！\n@c0@"
331:
  en: "@a%0%a002030@bThis is rather frustrating. Just how can we gain access to the town?\n@c0@"
  ja: "@a@b%a002030「まいりましたね。\n\tどうすれば　町の中に\n\t入れてもらえるのでしょうか。\n@c0@"
  ko: "@a@b%a002030: 난처하게 됐군요.\n어떻게 하면 마을 안으로\n들어갈 수 있을까요?\n@c0@"
  sl: "@a@b%a002030：真伤脑筋。\n　　到底怎样才能进到城里面去呢？\n@c0@"
  tl: "@a@b%a002030：真傷腦筋。\n　　到底怎樣才能進到城裡面去呢？\n@c0@"
332:
  en: "@a%0%a002030@bIn any case, let's bear its location in mind. It may come in useful later.\n@c0@"
  ja: "@a@b%a002030「今は　とにかく\n\t場所だけでも　おぼえて\n\tおきましょう。\n@c0@"
  ko: "@a@b%a002030: 지금은 일단\n장소만이라도 기억해\n두도록 합시다.\n@c0@"
  sl: "@a@b%a002030：总之现在\n　　先记下这个地方的方位吧。\n@c0@"
  tl: "@a@b%a002030：總之現在\n　　先記下這個地方的方位吧。\n@c0@"
333:
  en: "@a%0%a002050@bAnd there was me thinking Scrimsley folk were hostile to strangers!\n@c0@"
  ja: "@a@b%a002050「いきなり　追い出すなんて\n\tひどいことを　しますよね！\n@c0@"
  ko: "@a@b%a002050: 느닷없이 쫓아내다니\n너무하잖아요!\n@c0@"
  sl: "@a@b%a002050：突然把我们赶了出来，\n　　这真是过分！\n@c0@"
  tl: "@a@b%a002050：突然把我們趕了出來，\n　　這真是過分！\n@c0@"
334:
  en: "@a%0%a002050@bStill, it doesn't seem like the kind of place I'd be overly keen on visitin' anyway.\n@c0@"
  ja: "@a@b%a002050「でも　ならず者の町……\n\tとか　いってたから　入らなくても\n\tいいんじゃないですか？\n@c0@"
  ko: "@a@b%a002050: 하지만 불량배 마을이라고\n하니...... 굳이 안 들어가도\n되는 거 아닐까요?\n@c0@"
  sl: "@a@b%a002050：不过这个地方\n　　既然被称作无赖之镇，\n　　还是别进去好了。\n@c0@"
  tl: "@a@b%a002050：不過這個地方\n　　既然被稱作無賴之鎮，\n　　還是別進去好了。\n@c0@"
335:
  en: "@a%0%a002000@bI took a nasty knock to my leg in that last battle.\n@c0@"
  ja: "@a@b%a002000「いてて……。\n\tさっきの　戦闘で　足の横を\n\tちょっと　ケガしてた　ようだぜ。\n@c0@"
  ko: "@a@b%a002000: 아야야......\n아까 전투에서 다리 옆에\n상처가 좀 생긴 것 같군.\n@c0@"
  sl: "@a@b%a002000：好疼……\n　　刚才那战，\n　　俺好像伤到脚了。\n@c0@"
  tl: "@a@b%a002000：好疼……\n　　剛才那戰，\n　　俺好像傷到腳了。\n@c0@"
336:
  en: "@a%0%a002000@bIt's just a flesh wound — nothin' I can't walk off. Ouch... Ouch... Ouch...\n@c0@"
  ja: "@a@b%a002000「ま　ツバでも　つけときゃ\n\tこんなキズ　すぐなおるから\n\t心配ないけどな　へへ。\n@c0@"
  ko: "@a@b%a002000: 하긴, 침이라도 발라 놓으면\n이런 상처쯤은 금방 나을 테니까\n걱정 없지만. 헤헷.\n@c0@"
  sl: "@a@b%a002000：哎，抹把口水就好了，\n　　不用担心，嘿嘿。\n@c0@"
  tl: "@a@b%a002000：哎，抹把口水就好了，\n　　不用擔心，嘿嘿。\n@c0@"
337:
  en: "@a%0%a002000@bYa know, we've gotten a lot tougher than we used to be.\n@c0@"
  ja: "@a@b%a002000「しかし　オレたち\n\tもう　だいぶ　強くなって\n\tいるはずだよな。\n@c0@"
  ko: "@a@b%a002000: 그나저나\n우리 이제 제법\n강해졌겠지?\n@c0@"
  sl: "@a@b%a002000：不过，\n　　咱们现在应该已经\n　　算是挺强了吧。\n@c0@"
  tl: "@a@b%a002000：不過，\n　　咱們現在應該已經\n　　算是挺強了吧。\n@c0@"
338:
  en: "@a%0%a002000@bI bet we could batter that Murdaw in a rematch with one arm tied behind our backs!\n@c0@"
  ja: "@a@b%a002000「いま　もういちど\n\tムドーと戦ったら　あっという間に\n\t倒しちまうんじゃないか？\n@c0@"
  ko: "@a@b%a002000: 지금 다시 한 번\n무도와 싸우면 눈 깜짝할 사이에\n해치우는 거 아냐?\n@c0@"
  sl: "@a@b%a002000：要是现在\n　　再去跟姆多打一架的话，\n　　三下五除二就能搞定吧。\n@c0@"
  tl: "@a@b%a002000：要是現在\n　　再去跟姆多打一架的話，\n　　三下五除二就能搞定吧。\n@c0@"
339:
  en: "@a%0%a002000@bThe sun's shinin'... The birds are chirpin'... This is perfect fightin' weather!\n@c0@"
  ja: "@a@b%a002000「今日も　いい天気で\n\t気分も　サイコーだぜ！\n@c0@"
  ko: "@a@b%a002000: 오늘도 날씨가 좋아서\n기분이 최고로군!\n@c0@"
  sl: "@a@b%a002000：今天天气真好，\n　　痛快！痛快！\n@c0@"
  tl: "@a@b%a002000：今天天氣真好，\n　　痛快！痛快！\n@c0@"
340:
  en: "@a%0%a002000@bLine up twenty monsters, and I bet I could knock 'em all down without breakin' a sweat!\n@c0@"
  ja: "@a@b%a002000「こんな時は\n\tまものの　１０匹や　２０匹\n\tパパっと　倒せるんだがな！\n@c0@"
  ko: "@a@b%a002000: 이럴 땐\n마물을 10마리건 20마리건\n순식간에 해치울 수 있는데 말이지!\n@c0@"
  sl: "@a@b%a002000：这样的状态，\n　　来他个１０只２０只魔物，\n　　都不在话下！\n@c0@"
  tl: "@a@b%a002000：這樣的狀態，\n　　來他個１０隻２０隻魔物，\n　　都不在話下！\n@c0@"
341:
  en: "@a%0%a002010@bThe search for your real self has taken us far and wide, %a000090, but we're still rather short on clues.\n@c0@"
  ja: "@a@b%a002010「%a000090の　本体を\n\tさがして　もう　ずいぶんたつけど\n\t手がかりが　少ないわよね。\n@c0@"
  ko: "@a@b%a002010: %a000090의 몸을\n찾아 떠난 지 한참이 되었는데\n단서를 많이 찾지 못했네.\n@c0@"
  sl: "@a@b%a002010：我们寻找%a000090本来的身体\n　　也找了好久了。\n　　但是得到的线索不多呢。\n@c0@"
  tl: "@a@b%a002010：我們尋找%a000090本來的身體\n　　也找了好久了。\n　　但是得到的線索不多呢。\n@c0@"
342:
  en: "@a%0%a002010@bBut it's your destiny to be reunited — you must have faith in this and keep pushing forward!\n@c0@"
  ja: "@a@b%a002010「でも　かならず\n\t見つかることを　信じて\n\tあせらずに　行きましょ！\n@c0@"
  ko: "@a@b%a002010: 하지만 반드시\n찾으리라 믿고\n침착하게 나아가자!\n@c0@"
  sl: "@a@b%a002010：但是，\n　　我相信我们一定会找到的。\n　　慢慢找吧！\n@c0@"
  tl: "@a@b%a002010：但是，\n　　我相信我們一定會找到的。\n　　慢慢找吧！\n@c0@"
343:
  en: "@a%0%a002010@b(sigh) What a pleasant breeze...\n@c0@"
  ja: "@a@b%a002010「ああ……\n\t風が　気持ちいいわ。\n@c0@"
  ko: "@a@b%a002010: 아아......\n바람이 상쾌해.\n@c0@"
  sl: "@a@b%a002010：啊……\n　　这风吹着真舒服。\n@c0@"
  tl: "@a@b%a002010：啊……\n　　這風吹著真舒服。\n@c0@"
344:
  en: "@a%0%a002010@bIf it weren't for the perpetual monster attacks, this would truly be a thoroughly enjoyable trip.\n@c0@"
  ja: "@a@b%a002010「どの　土地でも\n\tまものさえ　いなければ\n\tすてきな旅　なんだけどね。\n@c0@"
  ko: "@a@b%a002010: 어디서든\n마물만 없다면\n멋진 여행이 될 텐데 말이야.\n@c0@"
  sl: "@a@b%a002010：要是没有魔物的话，\n　　不管在哪\n　　都可以好好享受美妙的旅行呢。\n@c0@"
  tl: "@a@b%a002010：要是沒有魔物的話，\n　　不管在哪\n　　都可以好好享受美妙的旅行呢。\n@c0@"
345:
  en: "@a%0%a002010@bI wonder how Madame Luca is getting on...\n@c0@"
  ja: "@a@b%a002010「……グランマーズの\n\tおばあちゃん　どうしてるかな。\n@c0@"
  ko: "@a@b%a002010: ......그랜마즈 할머니,\n어떻게 지내실까?\n@c0@"
  sl: "@a@b%a002010：……玛兹婆婆，\n　　不知道过得怎么样了。\n@c0@"
  tl: "@a@b%a002010：……瑪茲婆婆，\n　　不知道過得怎麼樣了。\n@c0@"
346:
  en: "@a%0%a002010@bI'm not feeling homesick or anything, but I do think of her every now and then. I hope she's doing well!\n@c0@"
  ja: "@a@b%a002010「べつに　ホームシックじゃ\n\tないんだけど　ふとした時に\n\t思い出しちゃうのよね。\n@c0@"
  ko: "@a@b%a002010: 향수병인 \n것은 아니지만, 문득 \n생각이 날 때가 있어.\n@c0@"
  sl: "@a@b%a002010：我倒没有那么严重的思乡病。\n　　只是不经意间\n　　会想到一些往事而已。\n@c0@"
  tl: "@a@b%a002010：我倒沒有那麼嚴重的思鄉病。\n　　只是不經意間\n　　會想到一些往事而已。\n@c0@"
347:
  en: "@a%0%a002020@bYou know, I think I've really honed my magic lately.\n@c0@"
  ja: "@a@b%a002020「最近さあ\n\tあたしの　呪文の　キレが\n\tすっごく　いいんだよね。\n@c0@"
  ko: "@a@b%a002020: 요새 말이야,\n내 주문 정말 멋있게\n나가지 않아?\n@c0@"
  sl: "@a@b%a002020：我最近的咒文，\n　　杀敌效果不错吧。\n@c0@"
  tl: "@a@b%a002020：我最近的咒文，\n　　殺敵效果不錯吧。\n@c0@"
348:
  en: "@a%0%a002020@bIt's like I get an image in my head, and then — poof! — I make it happen in real life! Neat, huh? Tee hee!\n@c0@"
  ja: "@a@b%a002020「もう　頭に浮かんだ\n\tイメージどおりに　なるんだよ！\n\tすごいでしょ？　えへへ。\n@c0@"
  ko: "@a@b%a002020: 머릿속에 떠오른\n이미지가 그대로 표현된다구!\n대단하지? 에헤헤.\n@c0@"
  sl: "@a@b%a002020：我的脑海中想的什么样，\n　　咒文就会变成什么样！\n　　很厉害吧！嘿嘿。\n@c0@"
  tl: "@a@b%a002020：我的腦海中想的什麼樣，\n　　咒文就會變成什麼樣！\n　　很厲害吧！嘿嘿。\n@c0@"
349:
  en: "@a%0%a002020@bOww... I think the blisters on my feet are getting blisters!\n@c0@"
  ja: "@a@b%a002020「あーん……。\n\tクツずれが　できちゃって\n\t足が　いたいかもー。\n@c0@"
  ko: "@a@b%a002020: 아앙......\n신발 때문에 발이 쓸려서\n좀 아파~\n@c0@"
  sl: "@a@b%a002020：啊……\n　　脚都被磨破了，好疼。\n@c0@"
  tl: "@a@b%a002020：啊……\n　　腳都被磨破了，好疼。\n@c0@"
350:
  en: "@a%0%a002020@bHey, %a000090! I'm just going to put this out there: I could sure use some lighter, stronger armour.\n@c0@"
  ja: "@a@b%a002020「ねえねえ　%a000090。\n\t今度で　いいから　あたし\n\t軽くて　強い　防具がほしいの。\n@c0@"
  ko: "@a@b%a002020: 저기, %a000090.\n당장은 아니더라도 나\n가볍고 강한 방어구가 필요해.\n@c0@"
  sl: "@a@b%a002020：%a000090啊，\n　　下次我想要\n　　更轻巧但是又坚固的防具。\n@c0@"
  tl: "@a@b%a002020：%a000090啊，\n　　下次我想要\n　　更輕巧但是又堅固的防具。\n@c0@"
351:
  en: "@a%0%a002020@bOh, and if it comes in pink, that'd be just perfect!\n@c0@"
  ja: "@a@b%a002020「あ　それから\n\tできたら　色は　ピンク系が\n\tいいんだけどなー。\n@c0@"
  ko: "@a@b%a002020: 아, 그리고\n색깔은 가능하면 핑크색 계열이\n좋겠어~\n@c0@"
  sl: "@a@b%a002020：啊，对了，\n　　如果可以的话，\n　　我想要粉红色系的防具呢。\n@c0@"
  tl: "@a@b%a002020：啊，對了，\n　　如果可以的話，\n　　我想要粉紅色系的防具呢。\n@c0@"
352:
  en: "@a%0%a002030@bWe've ended up with an impressive array of vehicles at our disposal...\n@c0@"
  ja: "@a@b%a002030「考えてみれば\n\tいろいろな　乗り物が\n\tふえてきましたね。\n@c0@"
  ko: "@a@b%a002030: 생각해 보면\n다양한 탈것들이\n늘어났군요.\n@c0@"
  sl: "@a@b%a002030：我们还真是\n　　拿到了不少交通工具呢。\n@c0@"
  tl: "@a@b%a002030：我們還真是\n　　拿到了不少交通工具呢。\n@c0@"
353:
  en: "@a%0%a002030@bA sacred ship, a floating island, a flying bed... What other unconventional modes of transport await us?\n@c0@"
  ja: "@a@b%a002030「神の船は　もちろん\n\tうかぶ島……　空飛ぶベッド……\n\tまだ　ほかにも　出会うでしょうかね。\n@c0@"
  ko: "@a@b%a002030: 신의 배도 있고\n부유하는 섬...... 하늘을 나는 침대......\n앞으로 다른 것도 만나게 될까요?\n@c0@"
  sl: "@a@b%a002030：除了神之船，\n　　还有浮岛……飞天床……\n　　以后还会不会遇到其它的东西呢？\n@c0@"
  tl: "@a@b%a002030：除了神之船，\n　　還有浮島……飛天床……\n　　以後還會不會遇到其它的東西呢？\n@c0@"
354:
  en: "@a%0%a002030@bOh my! I seem to have torn my clothing!\n@c0@"
  ja: "@a@b%a002030「さっき　服を見たら\n\tそでの　ところが　すっぱり\n\t切れて　いたんです……。\n@c0@"
  ko: "@a@b%a002030: 아까 옷을 살펴봤더니\n소매 부분이 싹둑\n잘려 있더군요......\n@c0@"
  sl: "@a@b%a002030：刚才检查了下衣服，\n　　发现袖子完全被割破了……\n@c0@"
  tl: "@a@b%a002030：剛才檢查了下衣服，\n　　發現袖子完全被割破了……\n@c0@"
355:
  en: "@a%0%a002030@bA monster must have got its claws into it in the last battle. It seems my fighting skills still need some work.\n@c0@"
  ja: "@a@b%a002030「前の戦いで　まものに\n\t切られたのでしょうかね……\n\tまだまだ　修行が　足りません。\n@c0@"
  ko: "@a@b%a002030: 이전 전투에서 마물이\n베어 버린 걸까요......\n아직 수련이 부족합니다.\n@c0@"
  sl: "@a@b%a002030：是被之前打倒的魔物弄破的吧……\n　　我的修行还远远不够啊。\n@c0@"
  tl: "@a@b%a002030：是被之前打倒的魔物弄破的吧……\n　　我的修行還遠遠不夠啊。\n@c0@"
356:
  en: "@a%0%a002030@b...Take that! ...And that! Avast, you foul beasts!\n@c0@"
  ja: "@a@b%a002030「ハッ！\n\tトリャーッ！！\n@c0@"
  ko: "@a@b%a002030: 하앗!\n이얍~!!\n@c0@"
  sl: "@a@b%a002030：哈！\n　　看招！！\n@c0@"
  tl: "@a@b%a002030：哈！\n　　看招！！\n@c0@"
357:
  en: "@a%0%a002030@b...Ahem! I do beg your pardon. I was just engaging in some battle training. One can never be too prepared!\n@c0@"
  ja: "@a@b%a002030「あ　これは　失礼！\n\t次の　戦いに　そなえて\n\tイメージトレーニングを　してました。\n@c0@"
  ko: "@a@b%a002030: 앗, 실례했습니다!\n다음 전투를 대비해서\n머릿속으로 훈련을 하던 참이었습니다.\n@c0@"
  sl: "@a@b%a002030：啊，失礼了！\n　　我只是在想象下一场战斗的敌人，\n　　做了下模拟对战。\n@c0@"
  tl: "@a@b%a002030：啊，失禮了！\n　　我只是在想像下一場戰鬥的敵人，\n　　做了下模擬對戰。\n@c0@"
358:
  en: "@a%0%a002050@bLook at the way Peggy Sue carts that heavy wagon around without a whinny of complaint.\n@c0@"
  ja: "@a@b%a002050「いつも　ファルシオンは\n\tこんな　おもたい馬車を　元気に\n\t引いてくれていますよね。\n@c0@"
  ko: "@a@b%a002050: 팔시온은 언제나\n이렇게 무거운 마차를 씩씩하게\n끌어 주는군요.\n@c0@"
  sl: "@a@b%a002050：法尔西昂一直都精神饱满地\n　　拉着这么重的马车呢。\n@c0@"
  tl: "@a@b%a002050：法爾西昂一直都精神飽滿地\n　　拉著這麼重的馬車呢。\n@c0@"
359:
  en: "@a%0%a002050@bI dare say we could all learn a lot from her about keepin' a stiff upper lip!\n@c0@"
  ja: "@a@b%a002050「それを　見ていると\n\t自分が　つかれた　なんて言っちゃ\n\tいられないなって　思うんですよ！\n@c0@"
  ko: "@a@b%a002050: 그걸 보고 있으면\n제가 지쳤다는 말을 하고 있기가\n미안한 마음이 든답니다!\n@c0@"
  sl: "@a@b%a002050：看着它这副努力的样子，\n　　我都不好意思再喊累了！\n@c0@"
  tl: "@a@b%a002050：看著它這副努力的樣子，\n　　我都不好意思再喊累了！\n@c0@"
360:
  en: "@a%0%a002050@bI'm not one to sing my own praises, but I'm gettin' the hang of bashin' an assortment of mighty monsters.\n@c0@"
  ja: "@a@b%a002050「だいぶ　まものの　クセなんかを\n\tおぼえてきて　戦いが　うまく\n\tこなせるように　なりましたよ。\n@c0@"
  ko: "@a@b%a002050: 마물의 행동을 제법\n파악한 덕분에 전투를 더\n능숙하게 이끌 수 있게 되었지요.\n@c0@"
  sl: "@a@b%a002050：我们已经大致摸清了魔物的秉性，\n　　这样战斗起来就容易多了。\n@c0@"
  tl: "@a@b%a002050：我們已經大致摸清了魔物的秉性，\n　　這樣戰鬥起來就容易多了。\n@c0@"
361:
  en: "@a%0%a002050@bI reckon I could take on a couple of Murdaws without the least bit of bother!\n@c0@"
  ja: "@a@b%a002050「自分で　言うのも　何ですが\n\tいまなら　ムドーの　一人や二人\n\t指先で　ピュンピュンですね！\n@c0@"
  ko: "@a@b%a002050: 제 입으로 말하기도 뭣하지만\n지금이라면 무도 한둘쯤은\n손가락으로도 잡을 수 있겠는데요!\n@c0@"
  sl: "@a@b%a002050：虽然这话从我口中说出来不太合适，\n　　不过现在即使有两个姆多出现在我们面前，\n　　我们闭着眼睛都能获胜！\n@c0@"
  tl: "@a@b%a002050：雖然這話從我口中說出來不太合適，\n　　不過現在即使有兩個姆多出現在我們面前，\n　　我們閉著眼睛都能獲勝！\n@c0@"
362:
  en: "@a%0%a002050@bIs it me or are more monsters scarperin' when they see us comin'? Word about us must be gettin' around!\n@c0@"
  ja: "@a@b%a002050「最近　私たちの　すがたを見て\n\t逃げていく　まものが　ふえたように\n\t思えるのは　気のせいでしょうかね？\n@c0@"
  ko: "@a@b%a002050: 요새 우리를 보고\n도망치는 마물이 늘어난 것 같은데\n제 착각일까요?\n@c0@"
  sl: "@a@b%a002050：最近有不少魔物\n　　一看到我们就跑，\n　　这是我的错觉吗？\n@c0@"
  tl: "@a@b%a002050：最近有不少魔物\n　　一看到我們就跑，\n　　這是我的錯覺嗎？\n@c0@"
363:
  en: "@a%0%a002000@bSo we're back in another unknown part of the lower world? I'm losin' track here...\n@c0@"
  ja: "@a@b%a002000「また　下の世界の\n\t見知らぬところに　来たな。\n\tここは　どのあたりだろう。\n@c0@"
  ko: "@a@b%a002000: 또 아래쪽 세계에서\n낯선 곳으로 오게 되었군.\n여긴 어디쯤이지?\n@c0@"
  sl: "@a@b%a002000：咱又到了下面世界\n　　没到过的地方了啊。\n　　这是哪啊？\n@c0@"
  tl: "@a@b%a002000：咱又到了下面世界\n　　沒到過的地方了啊。\n　　這是哪啊？\n@c0@"
364:
  en: "@a%0%a002010@bAs soon as we entered this area, I could sense the overwhelming presence of monsters. We must take care.\n@c0@"
  ja: "@a@b%a002010「この　エリアに入って\n\tまものの　気配が　強くなったわよ。\n\tあたりに　気をつけてね。\n@c0@"
  ko: "@a@b%a002010: 이 지역에 들어온 후로\n마물의 기운이 강해졌어.\n주변을 조심하자.\n@c0@"
  sl: "@a@b%a002010：进入这个区域之后，\n　　魔物的气息变强了呢。\n　　要小心我们四周。\n@c0@"
  tl: "@a@b%a002010：進入這個區域之後，\n　　魔物的氣息變強了呢。\n　　要小心我們四周。\n@c0@"
365:
  en: "@a%0%a002020@bIt's like we just keep going and going, but we never run out of new things to see! It's a big old world we live in, huh?\n@c0@"
  ja: "@a@b%a002020「冒険しても　しても\n\t知らないとこだらけ。\n\t世界は　広いよねー。\n@c0@"
  ko: "@a@b%a002020: 아무리 모험을 해도\n모르는 곳이 또 등장해.\n세계는 넓구나~\n@c0@"
  sl: "@a@b%a002020：不管我们再怎么冒险，\n　　未知的事物依然随处可见。\n　　世界真大啊。\n@c0@"
  tl: "@a@b%a002020：不管我們再怎麼冒險，\n　　未知的事物依然隨處可見。\n　　世界真大啊。\n@c0@"
366:
  en: "@a%0%a002030@bWe must never overestimate our strength. In new terrain, unforeseen perils may await us.\n@c0@"
  ja: "@a@b%a002030「いかに　装備や　体力が\n\tととのっていても　知らない土地では\n\t油断は　きんもつです！\n@c0@"
  ko: "@a@b%a002030: 아무리 장비와 체력을\n갖추었다 할지라도 모르는 곳에서\n방심은 금물입니다!\n@c0@"
  sl: "@a@b%a002030：即使装备得再好，体力再充沛，\n　　来到未知的土地之后\n　　也绝对不能大意！\n@c0@"
  tl: "@a@b%a002030：即使裝備得再好，體力再充沛，\n　　來到未知的土地之後\n　　也絕對不能大意！\n@c0@"
367:
  en: "@a%0%a002050@bIf there's one thing I learnt as a nipper, it's to always remember the path home.\n@c0@"
  ja: "@a@b%a002050「ちゃんと　帰り道を\n\tおぼえておかないと\n\tまいごに　なりそうですね。\n@c0@"
  ko: "@a@b%a002050: 돌아갈 길을 제대로\n외워 두지 않으면\n헤맬 것 같군요.\n@c0@"
  sl: "@a@b%a002050：要是不牢牢记住回去的路的话，\n　　恐怕会迷路。\n@c0@"
  tl: "@a@b%a002050：要是不牢牢記住回去的路的話，\n　　恐怕會迷路。\n@c0@"
368:
  en: "@a%0%a002000@bIf someone had told me about a princess stuck in a mirror, I'd say they had slime for brains...\n@c0@"
  ja: "@a@b%a002000「しかし　カガミ姫のことは\n\t自分の目で　見なければ\n\t信じられなかったろうな。\n@c0@"
  ko: "@a@b%a002000: 그나저나 거울 공주는\n내 눈으로 직접 보지 않았다면\n믿지 못했을 거야.\n@c0@"
  sl: "@a@b%a002000：但是，\n　　不亲眼见到明镜公主，\n　　俺是不会相信这回事的。\n@c0@"
  tl: "@a@b%a002000：但是，\n　　不親眼見到明鏡公主，\n　　俺是不會相信這回事的。\n@c0@"
369:
  en: "@a%0%a002000@bBut we've seen it with our own eyes! We can't let the King down — let's give this Spiegel character what for!\n@c0@"
  ja: "@a@b%a002000「王さま　じきじきに\n\tたのまれたからには　ミラルゴとかを\n\tぶっとばして　こようぜ！\n@c0@"
  ko: "@a@b%a002000: 왕으로부터 직접\n부탁을 받은 이상 미랄고인가 \n하는 놈을 날려 버리고 오자!\n@c0@"
  sl: "@a@b%a002000：既然国王陛下亲自拜托咱们，\n　　区区米拉尔戈，\n　　咱立刻就去揍扁它！\n@c0@"
  tl: "@a@b%a002000：既然國王陛下親自拜託咱們，\n　　區區米拉爾戈，\n　　咱立刻就去揍扁它！\n@c0@"
370:
  en: "@a%0%a002010@bIf there's no tower where they said it would be, let's try the world up above!\n@c0@"
  ja: "@a@b%a002010「お城で　聞いた場所に\n\t塔が　なければ　上の世界に\n\t行ってみましょう！\n@c0@"
  ko: "@a@b%a002010: 성에서 들은 곳에\n탑이 없으면 위쪽 세계로\n가 보자!\n@c0@"
  sl: "@a@b%a002010：去看看在城里打听到的那些地方，\n　　如果找不到塔的话，\n　　再去上面的世界看看！\n@c0@"
  tl: "@a@b%a002010：去看看在城裡打聽到的那些地方，\n　　如果找不到塔的話，\n　　再去上面的世界看看！\n@c0@"
371:
  en: "@a%0%a002020@bYou think Spiegel's magic is pretty tough? Ah, what does it matter. I know we'll beat him, no matter what!\n@c0@"
  ja: "@a@b%a002020「ミラルゴって\n\t強いのかなあ……。\n\tでも　あたしたち　勝てるよね！\n@c0@"
  ko: "@a@b%a002020: 미랄고는\n강하려나......\n하지만 우리가 이길 수 있을 거야!\n@c0@"
  sl: "@a@b%a002020：米拉尔戈到底有多强啊……\n　　不过，我们一定能赢吧！\n@c0@"
  tl: "@a@b%a002020：米拉爾戈到底有多強啊……\n　　不過，我們一定能贏吧！\n@c0@"
372:
  en: "@a%0%a002030@bSpiegel is a powerful sorcerer, so we must be on our guard against his spells and charms!\n@c0@"
  ja: "@a@b%a002030「ミラルゴは　魔法使い！\n\t呪文の　こうげきに　気をつけて\n\t戦いましょう。\n@c0@"
  ko: "@a@b%a002030: 미랄고는 마법사!\n주문 공격을 조심하면서\n싸웁시다.\n@c0@"
  sl: "@a@b%a002030：米拉尔戈会使用魔法！\n　　战斗的时候\n　　要小心它用咒文攻击。\n@c0@"
  tl: "@a@b%a002030：米拉爾戈會使用魔法！\n　　戰鬥的時候\n　　要小心它用咒文攻擊。\n@c0@"
373:
  en: "@a%0%a002050@bIt was a boyhood dream of mine to rescue a beautiful princess! Let's roll up our sleeves and get cracking!\n@c0@"
  ja: "@a@b%a002050「さあ　うでが　なりますね！\n\t美しい　姫を　助けるのですから\n\tなおさらです！\n@c0@"
  ko: "@a@b%a002050: 실력 발휘 좀 해야겠군요!\n아름다운 공주를 구하기 위함이니\n더더욱 그렇습니다!\n@c0@"
  sl: "@a@b%a002050：走吧！我手都痒了！\n　　况且还能救出美丽的公主呢！\n@c0@"
  tl: "@a@b%a002050：走吧！我手都癢了！\n　　況且還能救出美麗的公主呢！\n@c0@"
374:
  en: "@a%0%a002000@bHardy har! He didn't know what hit him! Now let's head back to Castle Swanstone, aye?\n@c0@"
  ja: "@a@b%a002000「どんなもんだい！\n\tって　感じだな。\n\tさあ　フォーン城に　もどろうぜ！\n@c0@"
  ko: "@a@b%a002000: 훗,\n이 정도쯤이야!\n자, 폰 성으로 돌아가자고!\n@c0@"
  sl: "@a@b%a002000：那都是些啥啊！\n　　算了，回佛恩城去吧！\n@c0@"
  tl: "@a@b%a002000：那都是些啥啊！\n　　算了，回佛恩城去吧！\n@c0@"
375:
  en: "@a%0%a002010@bI'm certain that Miralda has been freed from the mirror. We must hurry back to King Ludwig.\n@c0@"
  ja: "@a@b%a002010「イリカ姫は　もう\n\t鏡から　出ることが　できたかしら。\n\t早く　フォーン城へ行きましょう！\n@c0@"
  ko: "@a@b%a002010: 일리카 공주는 벌써\n거울에서 나왔을까?\n어서 폰 성으로 가 보자!\n@c0@"
  sl: "@a@b%a002010：不知道伊丽卡公主\n　　有没有从镜子里出来。\n　　赶紧回佛恩城去吧！\n@c0@"
  tl: "@a@b%a002010：不知道伊麗卡公主\n　　有沒有從鏡子裡出來。\n　　趕緊回佛恩城去吧！\n@c0@"
376:
  en: "@a%0%a002020@bYuck! This wind! I'm getting sand everywhere — and I mean, everywhere!\n@c0@"
  ja: "@a@b%a002020「うわー　風がふくと\n\t砂ばくの　砂が　とんで来て\n\t目に入るよー。\n@c0@"
  ko: "@a@b%a002020: 우와아~ 바람이 부니까\n사막의 모래가 날아와서\n눈 속으로 들어가~\n@c0@"
  sl: "@a@b%a002020：唔啊！\n　　风把沙子吹进眼睛里了！\n@c0@"
  tl: "@a@b%a002020：唔啊！\n　　風把沙子吹進眼睛裡了！\n@c0@"
377:
  en: "@a%0%a002020@bMy feet are on fire too. Can we ride the bed through this? Pleeease?\n@c0@"
  ja: "@a@b%a002020「足のうらも\n\tすぐ　あつくなっちゃうから\n\t早く　ベッドで　行こうよ！\n@c0@"
  ko: "@a@b%a002020: 발바닥도\n금방 뜨거워지니까\n어서 침대 타고 가자!\n@c0@"
  sl: "@a@b%a002020：脚底也跟\n　　火烧一样呢，\n　　快点坐飞天床吧！\n@c0@"
  tl: "@a@b%a002020：腳底也跟\n　　火燒一樣呢，\n　　快點坐飛天床吧！\n@c0@"
378:
  en: "@a%0%a002030@bI'm all a-fluster! That duel with Spiegel really got the old blood flowing!\n@c0@"
  ja: "@a@b%a002030「まだ　ミラルゴとの\n\t戦いの　こうふんが　さめません。\n@c0@"
  ko: "@a@b%a002030: 아직 미랄고와의\n전투에서 느꼈던 흥분이 가시질 않습니다.\n@c0@"
  sl: "@a@b%a002030：战胜了米拉尔戈，\n　　大家都还沉浸在胜利的喜悦中。\n@c0@"
  tl: "@a@b%a002030：戰勝了米拉爾戈，\n　　大家都還沉浸在勝利的喜悅中。\n@c0@"
379:
  en: "@a%0%a002030@bI, I must calm down! It wouldn't do for a Ghentile to get over-excited...\n@c0@"
  ja: "@a@b%a002030「なんだか　あたまから\n\tゆげが　出ているような\n\t気分ですね。　ははは。\n@c0@"
  ko: "@a@b%a002030: 왠지 머리에서\n김이 나는 것 같은\n기분이군요. 하하하.\n@c0@"
  sl: "@a@b%a002030：感觉脑袋都发热了。\n　　哈哈哈。\n@c0@"
  tl: "@a@b%a002030：感覺腦袋都發熱了。\n　　哈哈哈。\n@c0@"
380:
  en: "@a%0%a002050@bWouldn't you know it! Old %a002050 has clean forgotten the way back! Do you remember it, %a000090?\n@c0@"
  ja: "@a@b%a002050「あらー　フォーン城への\n\tもどりかた　忘れてしまいました！\n\t%a000090さん　おぼえてますか？\n@c0@"
  ko: "@a@b%a002050: 어, 폰 성으로\n돌아가는 방법을 까먹었네요!\n%a000090 님, 기억하고 있습니까?\n@c0@"
  sl: "@a@b%a002050：哎呀，忘记回佛恩城的路了！\n　　%a000090，你记得路吗？\n@c0@"
  tl: "@a@b%a002050：哎呀，忘記回佛恩城的路了！\n　　%a000090，你記得路嗎？\n@c0@"
