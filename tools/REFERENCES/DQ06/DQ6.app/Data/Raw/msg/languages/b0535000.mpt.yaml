  tl: "@a@b%a002020：啊……\n　　上面的世界……下面的世界……\n　　我已經混亂了……\n@c0@"
297:
  en: "@a%0%a002030@bI confess to being somewhat disorientated. Is this terrain new to us or not?\n@c0@"
  ja: "@a@b%a002030「うーん……\n\tみなれない　土地のような\n\tそうでも　ないような……。\n@c0@"
