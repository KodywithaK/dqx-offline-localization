136:
  en: "@aDhuran@bCome, %a002040!\n@c0@"
  ja: "@a@bデュラン「いでよ　%a002040！\n@c0@"
  ko: "@a@b---점프---> #079118로\n@c0@"
  sl: "@a@b迪兰：出来吧，%a002040！\n@c0@"
  tl: "@a@b迪蘭：出來吧，%a002040！\n@c0@"
137:
  en: "@aDhuran@bI will grant you another chance.\n@c0@"
  ja: "@a@bデュラン「お前に　ふたたび\n\t機会を　あたえよう。\n@c0@"
