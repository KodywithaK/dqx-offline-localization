  sl: "@a@b迪兰：集齐了传说中的武具的勇士，\n　　其实力要是只有那种程度，\n　　那就太令我失望了。\n@c0@"
  tl: "@a@b迪蘭：集齊了傳說中的武具的勇士，\n　　其實力要是只有那種程度，\n　　那就太令我失望了。\n@c0@"
134:
