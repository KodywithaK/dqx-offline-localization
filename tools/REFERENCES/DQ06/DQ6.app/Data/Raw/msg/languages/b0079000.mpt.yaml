  ja: "@a@b＊「城の中まで　入ってこられるとは\n\tキキーッ！　ただ者では　ないな！\n@c0@"
  ko: "@a@b*: 성안까지 들어올 수 있다니\n키키! 범상치 않은 놈들이군!\n@c0@"
  sl: "@a@b＊：居然能进到城堡里来，\n　　叽叽！不是一般人啊！\n@c0@"
  tl: "@a@b＊：居然能進到城堡裡來，\n　　嘰嘰！不是一般人啊！\n@c0@"
2:
