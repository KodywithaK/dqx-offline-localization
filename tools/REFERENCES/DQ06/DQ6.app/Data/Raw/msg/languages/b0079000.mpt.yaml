  sl: "@a@b迪兰：出来吧，%a002040！\n　　又得劳烦你出手了。\n@c0@"
  tl: "@a@b迪蘭：出來吧，%a002040！\n　　又得勞煩你出手了。\n@c0@"
132:
  en: "@aDhuran@bWell, well... You have returned. But that is as it should be.\n@c0@"
