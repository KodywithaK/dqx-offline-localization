  ko: "@a@b*: 키~키키키!\n너희도 자신의 욕망을 위해\n여기까지 온 거냐?\n@c0@"
  sl: "@a@b＊：叽！叽叽叽！\n　　你们也是为了自己的欲望\n　　来投奔我方的吗？\n@c0@"
  tl: "@a@b＊：嘰！嘰嘰嘰！\n　　你們也是為了自己的欲望\n　　來投奔我方的嗎？\n@c0@"
26:
  en: "@a@b*: Well, it matters not. While you're here, you will faithfully serve our master, Lord Dhuran!\n@c0@"
  ja: "@a@b＊「まあ　そんなことは　いい。\n\tこっちに来たかぎりは　心して\n\tデュランさまに　仕えるのだぞ。\n@c0@"
  ko: "@a@b*: 뭐 그런 건 상관없다.\n여기에 온 이상 진심으로\n듀란 님에게 충성을 다하거라.\n@c0@"
  sl: "@a@b＊：哎呀，打听这种事情也没有意义。\n　　你们既然来到这里了，\n　　就得用心服侍迪兰大人。\n@c0@"
  tl: "@a@b＊：哎呀，打聽這種事情也沒有意義。\n　　你們既然來到這裡了，\n　　就得用心服侍迪蘭大人。\n@c0@"
27:
