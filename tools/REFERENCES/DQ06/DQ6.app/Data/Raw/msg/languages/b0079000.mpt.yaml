145:
  en: "@a@b*: Oh... I see...\n@c0@"
  ja: "@a@b＊「そうですか……。\n@c0@"
  ko: "@a@b*: 넵!\n@c0@"
  sl: "@a@b＊：是吗……\n@c0@"
  tl: "@a@b＊：是嗎……\n@c0@"
146:
  en: "@a@b*: Lo! %H0860%XThou art the warrior%YYou are the warriors%Z possessed of the four legendary relics!\n@c0@"
