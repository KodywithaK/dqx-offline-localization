  ja: "@a@b＊「しかし　邪悪なる者らにより\n\tゼニス王は封印され　この城も\n\tまた　その者らの手に……。\n@c0@"
  ko: "@a@b*: 하지만 사악한 자들에 의해\n제니스 왕은 봉인되었고\n또 그자들의 손에......\n@c0@"
  sl: "@a@b＊：但是泽尼斯王被邪恶的家伙们\n　　所封印，这座城也落入敌手……\n@c0@"
