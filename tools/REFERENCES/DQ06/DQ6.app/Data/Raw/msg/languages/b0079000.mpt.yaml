  sl: "@a@b＊：给，这是世界树之露！\n　　记得对大家保密。\n　　要珍惜着用哦！\n@c0@"
  tl: "@a@b＊：給，這是世界樹之露！\n　　記得對大家保密。\n　　要珍惜著用哦！\n@c0@"
159:
  en: "@a@b%0%a000180 acquires a phial of Yggdrasil dew!\n@c0@"
