  ja: "@a@b＊「キキッ！　そんなことは　どうでもいい。\n\t招かれざる客には　それなりの\n\tもてなしを　させてもらおうぜ！\n@c0@"
  ko: "@a@b*: 키키! 그딴 건 상관없다.\n초대받지 않은 손님에겐 그에 맞는\n대접을 해주마!\n@c0@"
  sl: "@a@b＊：叽叽！那些都无所谓啦。\n　　对待不速之客，也要拿出相应的\n　　款待才行啊！\n@c0@"
  tl: "@a@b＊：嘰嘰！那些都無所謂啦。\n　　對待不速之客，也要拿出相應的\n　　款待才行啊！\n@c0@"
4:
  en: "@a@b*: Skreeeee!\n@c0@"
  ja: "@a@b＊「キキーッ！！\n@c0@"
  ko: "@a@b*: 키키!!\n@c0@"
  sl: "@a@b＊：叽叽！！\n@c0@"
  tl: "@a@b＊：嘰嘰！！\n@c0@"
5:
  en: "@a@b%3Halt!%4\n@c0@"
  ja: "@a@b%3まてっ！！%4\n@c0@"
  ko: "@a@b%3멈춰라!!%4\n@c0@"
  sl: "@a@b%3等一下！！%4\n@c0@"
  tl: "@a@b%3等一下！！%4\n@c0@"
6:
  en: "@a@b*: S-Skree...?\n@c0@"
  ja: "@a@b＊「キッ　キキーッ！？\n@c0@"
