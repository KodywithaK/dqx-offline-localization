  sl: "@a@b＊：真、真的非常感谢！\n@c0@"
  tl: "@a@b＊：真、真的非常感謝！\n@c0@"
150:
  en: "@a@b*: The dreams of countless people in the real world begat us. We are their offspring.\n@c0@"
  ja: "@a@b＊「わたしたちは　現実の世界にいる\n\tさまざまなひとたちの　夢が\n\t集まって　生まれました。\n@c0@"
