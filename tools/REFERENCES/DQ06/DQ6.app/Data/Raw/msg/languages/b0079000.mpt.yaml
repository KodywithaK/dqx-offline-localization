  ko: "@a@b---점프---> #079103으로\n@c0@"
  sl: "@a@b迪兰：嚯嚯，又来了吗。\n　　不过正合我意。\n@c0@"
  tl: "@a@b迪蘭：嚯嚯，又來了嗎。\n　　不過正合我意。\n@c0@"
133:
  en: "@aDhuran@bI confess that I was disappointed to find that the bearers of the legendary relics possessed such meagre powers...\n@c0@"
  ja: "@a@bデュラン「伝説の武具を　集めし者の\n\tチカラが　あの程度では\n\t正直　がっかりだからな。\n@c0@"
