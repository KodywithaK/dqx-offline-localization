0:
  en: "@a@b*: Skree? Who goes there!?\n@c0@"
  ja: "@a@b＊「キキーッ！？\n\tきさまら　何者だ！\n@c0@"
  ko: "@a@b*: 키키!?\n웬 놈들이냐!\n@c0@"
  sl: "@a@b＊：叽叽？！\n　　你们是什么人！\n@c0@"
  tl: "@a@b＊：嘰嘰？！\n　　你們是什麼人！\n@c0@"
1:
