  ko: "@a@b*: 듀란 님이야말로 이 세계를\n다스릴 수 있는 유일한 분이시다.\n@c0@"
  sl: "@a@b＊：迪兰大人才是能够\n　　征服这个世界的人。\n@c0@"
  tl: "@a@b＊：迪蘭大人才是能夠\n　　征服這個世界的人。\n@c0@"
15:
  en: "@a@b*: Heh heh. I've got nooze for you!\n@c0@"
  ja: "@a@b＊「エヘヘ　ぼく　知ってるよ。\n@c0@"
  ko: "@a@b*: 에헤헤, 난 알고 있어.\n@c0@"
  sl: "@a@b＊：诶嘿嘿，我知道哦。\n@c0@"
  tl: "@a@b＊：誒嘿嘿，我知道哦。\n@c0@"
16:
  en: "@a@b*: This castle was once in the dream world, where it was slurposed to have been sealed off.\n@c0@"
  ja: "@a@b＊「このお城は　夢の世界にあって\n\tホントは　封印しなきゃ\n\tいけなかったんだ。\n@c0@"
  ko: "@a@b*: 이 성은 꿈의 세계에 \n있었고 사실은 봉인\n했어야만 했어.\n@c0@"
  sl: "@a@b＊：在梦世界里的这个城堡，\n　　本来是必须被封印的。\n@c0@"
  tl: "@a@b＊：在夢世界裡的這個城堡，\n　　本來是必須被封印的。\n@c0@"
17:
  en: "@a@b*: But instead, Lord Dhuran made it his base and brought it down to this world without sealing it.\n@c0@"
  ja: "@a@b＊「でも　デュランさまは\n\t封印せずに　下界にもってきて\n\t自分のお城に　してるんだよ。\n@c0@"
  ko: "@a@b*: 하지만 듀란 님은\n봉인하지 않고 하계로 가져와\n자신의 성으로 사용하고 있지.\n@c0@"
  sl: "@a@b＊：但是迪兰大人不但没有封印，\n　　还将它带到下界来，\n　　作为自己的居城。\n@c0@"
  tl: "@a@b＊：但是迪蘭大人不但沒有封印，\n　　還將它帶到下界來，\n　　作為自己的居城。\n@c0@"
18:
  en: "@a@b*: Now we can fly anywhere we want! The mighty Dhuran is no dummy!\n@c0@"
  ja: "@a@b＊「だから　空も　とべるし……。\n\tデュランさまって　ホント\n\tあたま　いいよね。\n@c0@"
  ko: "@a@b*: 그러니까 하늘도 나는 거고......\n듀란 님은 정말\n명석하신 분이셔.\n@c0@"
  sl: "@a@b＊：所以这座城还能飞在空中……\n　　迪兰大人真是聪明啊。\n@c0@"
  tl: "@a@b＊：所以這座城還能飛在空中……\n　　迪蘭大人真是聰明啊。\n@c0@"
19:
  en: "@a@b*: It...it is too much to bear...\n@c0@"
  ja: "@a@b＊「く　くちおしや……。\n@c0@"
  ko: "@a@b*: 부, 분하다......\n@c0@"
  sl: "@a@b＊：好、好悔恨啊……\n@c0@"
  tl: "@a@b＊：好、好悔恨啊……\n@c0@"
20:
  en: "@a@b*: This is Cloudsgate Citadel, home of the dream world's supreme ruler, Lord Zenith...\n@c0@"
  ja: "@a@b＊「ここは　クラウド城。\n\t夢の世界を　たばねる\n\tゼニス王の城……。\n@c0@"
  ko: "@a@b*: 여긴 클라우드 성.\n꿈의 세계를 통솔하는\n제니스 왕의 성......\n@c0@"
  sl: "@a@b＊：这里是云城。\n　　是统治梦世界的\n　　泽尼斯王的城堡……\n@c0@"
  tl: "@a@b＊：這裡是雲城。\n　　是統治夢世界的\n　　澤尼斯王的城堡……\n@c0@"
21:
