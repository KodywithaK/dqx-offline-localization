  sl: "@a@b迪兰：再给你一次机会。\n@c0@"
  tl: "@a@b迪蘭：再給你一次機會。\n@c0@"
138:
  en: "@aDhuran@b%H0860%XThis coffin is%YThese coffins are%Z an eyesore. Remove %H0860%Xit%Ythem%Z from my castle!\n@c0@"
