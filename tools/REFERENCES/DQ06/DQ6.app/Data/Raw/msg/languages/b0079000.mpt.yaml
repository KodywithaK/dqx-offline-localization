  sl: "@a@b迪兰：那么，你们究竟变强了多少，\n　　就让我好好见识一下吧。\n@c0@"
  tl: "@a@b迪蘭：那麼，你們究竟變強了多少，\n　　就讓我好好見識一下吧。\n@c0@"
135:
