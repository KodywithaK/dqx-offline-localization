  sl: "@a@b＊：给，这是世界树之露！\n　　记得对大家保密。\n　　要珍惜着用哦！\n@c0@"
  tl: "@a@b＊：給，這是世界樹之露！\n　　記得對大家保密。\n　　要珍惜著用哦！\n@c0@"
164:
  en: "@a@b%0%a000180 acquires a phial of Yggdrasil dew!\n@c0@"
  ja: "@a@b%a000180は　せかいじゅのしずくを\n手にいれた！\n@c0@"
  ko: "@a@b*: 자, 세계수의 수액이야!\n다른 사람한테는 비밀이야.\n소중한 데 쓰도록 해!\n@c0@"
  sl: "@a@b%a000180得到了世界树之露！\n@c0@"
  tl: "@a@b%a000180得到了世界樹之露！\n@c0@"
165:
  en: "@a@b*: Whence %H0860%Xcamest thou, traveller%Ycame you, travellers%Z? The world below? Ooh, I must know! Is it nice down there?\n@c0@"
  ja: "@a@b＊「あら　あなたたちは\n\t下の世界の住人ね。　ねえ……\n\t下の世界って　どんなところ？\n@c0@"
  ko: "@a@b%a000180%F0180%X는%Y은%Z 세계수의 수액을\n획득했다!\n@c0@"
  sl: "@a@b＊：哎呀，你们就是\n　　下面的世界的居民吧。\n　　呐……下面的世界有趣吗？\n@c0@"
  tl: "@a@b＊：哎呀，你們就是\n　　下面的世界的居民吧。\n　　呐……下面的世界有趣嗎？\n@c0@"
166:
  en: "@a@b*: Oh, how I long to visit that realm!\n@c0@"
  ja: "@a@b＊「へえ　いいなあ\n\t私も　行ってみたいなあ。\n@c0@"
  ko: "@a@b*: 세계수의 수액은\n단 한 개만 소지할 수 있지만\n전원을 한꺼번에 회복시킬 수 있어!\n@c0@"
  sl: "@a@b＊：嘿，真不错，\n　　我也好想去看一看啊。\n@c0@"
  tl: "@a@b＊：嘿，真不錯，\n　　我也好想去看一看啊。\n@c0@"
167:
  en: "@a@b*: Perchance I might even court a handsome soul there. Tee hee...\n@c0@"
  ja: "@a@b＊「もしかしたら　すごく\n\tかっこいいひとが　いたりしてね。\n\tエヘヘ……。\n@c0@"
  ko: "@a@b*: 응? 세계수의 수액을 갖고 싶다고?\n@c0@"
  sl: "@a@b＊：或许会邂逅\n　　非常帅气的人呢。\n　　诶嘿嘿……\n@c0@"
  tl: "@a@b＊：或許會邂逅\n　　非常帥氣的人呢。\n　　誒嘿嘿……\n@c0@"
168:
  en: "@a@b*: Oh... How truly disappointing...\n@c0@"
  ja: "@a@b＊「ふ～ん　そうなんだ。\n@c0@"
  ko: "@a@b*: 욕심부리면 안 돼.\n다 떨어지면 또 줄 테니까 걱정 마.\n@c0@"
  sl: "@a@b＊：嗯～是吗。\n@c0@"
  tl: "@a@b＊：嗯～是嗎。\n@c0@"
169:
  en: "@a@b*: Prithee come no closer.\n@c0@"
  ja: "@a@b＊「ゼニス王の　許しがなければ\n\tここを　お通しするわけには\n\tまいりません。\n@c0@"
  ko: "@a@b*: 자, 세계수의 수액이야!\n다른 사람한테는 비밀이야.\n소중한 데 쓰도록 해!\n@c0@"
  sl: "@a@b＊：没有泽尼斯王的许可，\n　　这里禁止通行。\n@c0@"
  tl: "@a@b＊：沒有澤尼斯王的許可，\n　　這裡禁止通行。\n@c0@"
170:
  en: "@a@b*: None shall pass without the permission of Lord Zenith himself.\n@c0@"
  ja: "@a@b＊「どうか　おひきとりを。\n@c0@"
  ko: "@a@b%a000180%F0180%X는%Y은%Z 세계수의 수액을\n획득했다!\n@c0@"
  sl: "@a@b＊：请回吧。\n@c0@"
  tl: "@a@b＊：請回吧。\n@c0@"
171:
  en: "@a@b*: Lord Zenith is all-seeing. Neither glen nor glade of our world escapeth his scrutiny.\n@c0@"
  ja: "@a@b＊「ゼニス王は　世界のすべてを\n\tいつも　見守っています。\n@c0@"
  ko: "@a@b*: 어머, 당신들은\n아래쪽 세계의 사람들이구나.\n아래쪽 세계는 어떤 곳이야?\n@c0@"
  sl: "@a@b＊：泽尼斯王一直\n　　守护着世界万物。\n@c0@"
  tl: "@a@b＊：澤尼斯王一直\n　　守護著世界萬物。\n@c0@"
172:
  en: "@a@b*: But, alas, even our ruler is a denizen of dreams...\n@c0@"
  ja: "@a@b＊「しかし　王も　また\n\t夢の国の住人。\n@c0@"
  ko: "@a@b*: 우와 좋겠다.\n나도 한번 가보고 싶어.\n@c0@"
  sl: "@a@b＊：但是，国王大人也同样是\n　　梦之国的居民。\n@c0@"
  tl: "@a@b＊：但是，國王大人也同樣是\n　　夢之國的居民。\n@c0@"
173:
  en: "@a@b*: His power floweth from the hearts of those below. It is but pure emotion, insufficient to bestow omnipotence.\n@c0@"
  ja: "@a@b＊「心のチカラだけでは\n\tどうすることも　できぬことが\n\tあります。\n@c0@"
  ko: "@a@b*: 어쩌면 굉장히\n멋진 사람이 있을지도 모르고.\n에헤헤......\n@c0@"
  sl: "@a@b＊：当然会有只靠心之力\n　　无法做到的事情。\n@c0@"
  tl: "@a@b＊：當然會有只靠心之力\n　　無法做到的事情。\n@c0@"
174:
  en: "@a@b*: Visit Lord Zenith, %H0860%Xchild%Ychildren%Z of the world below. Lend him %H0860%Xthy%Yyour%Z strength.\n@c0@"
  ja: "@a@b＊「あなたがたは　下の世界の者。\n\tどうか　ゼニス王の　おチカラに\n\tなってくださいまし。\n@c0@"
  ko: "@a@b*: 흐~음, 그렇구나.\n@c0@"
  sl: "@a@b＊：各位是下面的世界的住民。\n　　请各位务必助泽尼斯王一臂之力。\n@c0@"
  tl: "@a@b＊：各位是下面的世界的住民。\n　　請各位務必助澤尼斯王一臂之力。\n@c0@"
175:
  en: "@a@b*: It's my job to tend to this here egg. His Lordship hired me to watch over it, y'see.\n@c0@"
  ja: "@a@b＊「オラ　王さまから\n\tおあずかりした　このタマゴの\n\t世話を　してるだよ。\n@c0@"
  ko: "@a@b*: 제니스 왕의 허락이 없으면\n이곳은 지나가실 수\n없습니다.\n@c0@"
  sl: "@a@b＊：俺正在照顾\n　　国王大人存放在\n　　俺这里的蛋呐。\n@c0@"
  tl: "@a@b＊：俺正在照顧\n　　國王大人存放在\n　　俺這裡的蛋呐。\n@c0@"
176:
  en: "@a@b*: They tell me this thing holds the future, or somethin' like that. Hey, don't ask me. I just work here.\n@c0@"
  ja: "@a@b＊「なんでも　こんなかにゃ\n\t未来が　入ってるって\n\t話だっただよ。\n@c0@"
  ko: "@a@b*: 돌아가십시오.\n@c0@"
  sl: "@a@b＊：据说在这个蛋里的东西是未来呐。\n@c0@"
  tl: "@a@b＊：據說在這個蛋裡的東西是未來呐。\n@c0@"
177:
  en: "@a@b*: I ain't much for deep thinkin', truth be told...\n㈡\nAnyway, I'm hopin' it's the bright kind of future!\n@c0@"
  ja: "@a@b＊「おら　むずかしいこたあ\n\tわかんねえけど　同じ未来なら\n\t明るいやつが　いいやな！\n@c0@"
  ko: "@a@b*: 제니스 왕은 세계의 모든 것을\n항상 지켜보고 계십니다.\n@c0@"
  sl: "@a@b＊：俺虽然不太明白太复杂的事，\n　　不过都是未来的话，\n　　当然是光明的那个比较好啦！\n@c0@"
  tl: "@a@b＊：俺雖然不太明白太複雜的事，\n　　不過都是未來的話，\n　　當然是光明的那個比較好啦！\n@c0@"
178:
  en: "@a@b*: I reckon it'll be hatchin' before long. See for yerself if ya don't believe me!\n@c0@"
  ja: "@a@b＊「ホレッ　もうすぐ\n\t生まれっかも　しんねえだよ。\n@c0@"
  ko: "@a@b*: 하지만 그 폐하 또한\n꿈의 나라에 속한 몸.\n@c0@"
  sl: "@a@b＊：看呐，说不定\n　　马上就要孵出来了。\n@c0@"
  tl: "@a@b＊：看呐，說不定\n　　馬上就要孵出來了。\n@c0@"
179:
  en: "@a@b*: (scratch scratch)\n@c0@"
  ja: "@a@b＊「キュルルン　キュルルン！\n@c0@"
  ko: "@a@b*: 마음의 힘만으로는\n어찌할 수 없는 일이\n있습니다.\n@c0@"
  sl: "@a@b＊：咕噜噜，咕噜噜！\n@c0@"
  tl: "@a@b＊：咕嚕嚕，咕嚕嚕！\n@c0@"
180:
  en: "@a@b*: Pegasus is wailing. Wailing!\n@c0@"
  ja: "@a@b＊「ないてるよ　ペガサス。\n\tないてるよ。\n@c0@"
  ko: "@a@b*: 당신들은 아래쪽 세계의 사람.\n부디 제니스 왕의\n힘이 되어 주십시오.\n@c0@"
  sl: "@a@b＊：在哭泣哦，珀伽索斯。\n　　在哭泣哦。\n@c0@"
  tl: "@a@b＊：在哭泣哦，珀伽索斯。\n　　在哭泣哦。\n@c0@"
181:
  en: "@a@b*: Pegasus is waiting. Waiting!\n@c0@"
  ja: "@a@b＊「まってるよ　ペガサス。\n\tまってるよ。\n@c0@"
  ko: "@a@b*: 난 폐하에게 받은\n이 알을\n돌보고 있어.\n@c0@"
  sl: "@a@b＊：在等待哦，珀伽索斯。\n　　在等待哦。\n@c0@"
  tl: "@a@b＊：在等待哦，珀伽索斯。\n　　在等待哦。\n@c0@"
182:
  en: "@a@b*: Pegasus will fly again. Pegasus knows!\n@c0@"
  ja: "@a@b＊「知ってるよ　ペガサス。\n\tまた　飛べるって！\n@c0@"
  ko: "@a@b*: 듣기론 이 안에\n미래가 들어있다고\n했는데.\n@c0@"
  sl: "@a@b＊：明白的哦，珀伽索斯。\n　　你还能够，再次飞翔！\n@c0@"
  tl: "@a@b＊：明白的哦，珀伽索斯。\n　　你還能夠，再次飛翔！\n@c0@"
183:
  en: "@a@b*: With dreams of courage, hope, strength, and the future on her saddle, Pegasus will fly again!\n@c0@"
  ja: "@a@b＊「勇気　希望　チカラ　未来……\n\tいろんな夢を　背中にのせて\n\tまた　飛べるんだって！\n@c0@"
  ko: "@a@b*: 난 어려운 건 잘 모르지만\n어차피 다가올 미래라면\n밝은 미래가 좋겠어!\n@c0@"
  sl: "@a@b＊：勇气，希望，力量，未来……\n　　种种梦想，背负肩上，\n　　你还能够，再次飞翔！\n@c0@"
  tl: "@a@b＊：勇氣，希望，力量，未來……\n　　種種夢想，背負肩上，\n　　你還能夠，再次飛翔！\n@c0@"
184:
  en: "@a@b*: Dhuran may have banished our castle to oblivion, but Lord Zenith knows he was but an underling of Mortamor, the Archfiend.\n@c0@"
  ja: "@a@b＊「ゼニス王によると　この城を\n\t封じていた　デュランも　また\n\t大魔王の配下に　すぎなかったと。\n@c0@"
  ko: "@a@b*: 이거 봐, 이제 곧\n태어날지도 몰라.\n@c0@"
  sl: "@a@b＊：据泽尼斯王所说，\n　　封印了这座城堡的迪兰，\n　　也不过是大魔王的手下而已。\n@c0@"
  tl: "@a@b＊：據澤尼斯王所說，\n　　封印了這座城堡的迪蘭，\n　　也不過是大魔王的手下而已。\n@c0@"
185:
  en: "@a@b*: This Mortamor means to build a world of his own design — a world which will swallow all others.\n@c0@"
  ja: "@a@b＊「大魔王　デスタムーアは\n\t自分だけの　世界をつくり　そこに\n\tすべての世界を　飲み込むつもりです。\n@c0@"
  ko: "@a@b*: 큐르릉 큐르릉!\n@c0@"
  sl: "@a@b＊：大魔王德斯塔穆亚建造出了\n　　只属于自己的世界，并且企图\n　　从那里将所有的世界吞噬。\n@c0@"
  tl: "@a@b＊：大魔王德斯塔穆亞建造出了\n　　只屬於自己的世界，並且企圖\n　　從那裡將所有的世界吞噬。\n@c0@"
186:
  en: "@a@b*: It is said that a great many victims have already been swept into his evil domain...\n@c0@"
  ja: "@a@b＊「すでに　大勢の人びとが　その世界に\n\t飲み込まれていったとか……。\n@c0@"
  ko: "@a@b*: 울고 있어, 페가수스.\n울고 있어.\n@c0@"
  sl: "@a@b＊：据说已经有大量的人\n　　被吞入了那个世界了……\n@c0@"
  tl: "@a@b＊：據說已經有大量的人\n　　被吞入了那個世界了……\n@c0@"
187:
  en: "@a@b*: Are you familiar with the dread realm?\n@c0@"
  ja: "@a@b＊「はざまの世界を　ごぞんじか？\n@c0@"
  ko: "@a@b*: 기다릴게, 페가수스.\n기다릴게.\n@c0@"
  sl: "@a@b＊：您知道狭隙世界吗？\n@c0@"
  tl: "@a@b＊：您知道狹隙世界嗎？\n@c0@"
188:
  en: "@a@b*: The dread realm is a world of darkness... It is neither dream nor reality. It exists somewhere in between.\n@c0@"
  ja: "@a@b＊「夢でもない……\n\t現実でもない　暗黒の世界。\n@c0@"
  ko: "@a@b*: 알고 있어, 페가수스.\n다시 날 수 있어!\n@c0@"
  sl: "@a@b＊：那是个既不是梦境……\n　　也不是现实的，暗黑的世界。\n@c0@"
  tl: "@a@b＊：那是個既不是夢境……\n　　也不是現實的，暗黑的世界。\n@c0@"
189:
  en: "@a@b*: It is also the domain of the Archfiend, Mortamor.\n@c0@"
  ja: "@a@b＊「それこそが　大魔王\n\tデスタムーアが　住まうという\n\tはざまの世界　なのじゃ。\n@c0@"
  ko: "@a@b*: 용기, 희망, 힘, 미래......\n다양한 꿈을 등에 태우고\n다시 날 수 있어!\n@c0@"
  sl: "@a@b＊：大魔王德斯塔穆亚所居住的世界。\n　　那正是狭隙世界。\n@c0@"
  tl: "@a@b＊：大魔王德斯塔穆亞所居住的世界。\n　　那正是狹隙世界。\n@c0@"
190:
  en: "@a@b*: None may enter this world of their own free will. None save Pegasus, that is.\n@c0@"
  ja: "@a@b＊「だれも　自分の意志では\n\t行くことが　できん……。\n\tペガサスを　のぞいてはな。\n@c0@"
  ko: "@a@b*: 제니스 왕의 말씀에 따르면\n이 성을 봉인한 듀란도\n대마왕의 부하에 지나지 않았다고.\n@c0@"
  sl: "@a@b＊：任何人都不能凭借自己的意志\n　　到达那个世界……\n　　除了珀伽索斯。\n@c0@"
  tl: "@a@b＊：任何人都不能憑藉自己的意志\n　　到達那個世界……\n　　除了珀伽索斯。\n@c0@"
191:
  en: "@a@b*: Within this castle lies the only known path to the Pillar of Pegasus, home of the winged horse of legend.\n@c0@"
  ja: "@a@b＊「この城には　天駆ける天馬\n\tペガサスがすむといわれる　塔に\n\t通じる　ただひとつの道がある。\n@c0@"
  ko: "@a@b*: 대마왕 데스타무아는\n자신만의 세계를 만들어서\n모든 세계를 집어삼킬 작정인 겁니다.\n@c0@"
  sl: "@a@b＊：据说能够飞翔于空中的天马珀伽索斯\n　　居住在一座塔中，而通向那座塔的\n　　唯一一条路，就在这座城里。\n@c0@"
  tl: "@a@b＊：據說能夠飛翔於空中的天馬珀伽索斯\n　　居住在一座塔中，而通向那座塔的\n　　唯一一條路，就在這座城裡。\n@c0@"
192:
  en: "@a@b*: It is for this reason that Mortamor attempted to smite the castle from existence.\n@c0@"
  ja: "@a@b＊「それゆえに　デスタムーアは\n\tこの城を　封じたのであろうな。\n@c0@"
  ko: "@a@b*: 이미 많은 사람이 그 세계에\n빨려 들어갔다던데......\n@c0@"
  sl: "@a@b＊：正因如此，德斯塔穆亚才会\n　　将这座城给封印起来吧。\n@c0@"
  tl: "@a@b＊：正因如此，德斯塔穆亞才會\n　　將這座城給封印起來吧。\n@c0@"
193:
  en: "@a@b*: On behalf of us all, I offer %H0860%Xthee%Yyou%Z my heartfelt thanks for freeing us from our accursed punishment!\n@c0@"
  ja: "@a@b＊「このたびは　われらが封印を\n\t解いていただき　まことに\n\tありがとうございました！\n@c0@"
  ko: "@a@b*: 틈새 세계를 알고 있나?\n@c0@"
  sl: "@a@b＊：此次承蒙诸位解开\n　　加于我们之身的封印，\n　　实在是非常感谢！\n@c0@"
  tl: "@a@b＊：此次承蒙諸位解開\n　　加於我們之身的封印，\n　　實在是非常感謝！\n@c0@"
194:
  en: "@a@b*: Pray make haste! Lord Zenith awaiteth %H0860%Xthy%Yyour%Z coming!\n@c0@"
  ja: "@a@b＊「ささ　ゼニス王が\n\tおまちかねです！\n@c0@"
  ko: "@a@b*: 꿈도 아니고......\n현실도 아닌 암흑의 세계.\n@c0@"
  sl: "@a@b＊：请吧，泽尼斯王正在等候诸位！\n@c0@"
  tl: "@a@b＊：請吧，澤尼斯王正在等候諸位！\n@c0@"
195:
  en: "@a@b*: I bid %H0860%Xthee%Yyou%Z good fortune!\n@c0@"
  ja: "@a@b＊「ご武運を！\n@c0@"
  ko: "@a@b*: 그곳이 바로 대마왕\n데스타무아가 살고 있다는\n틈새 세계라네.\n@c0@"
  sl: "@a@b＊：祝武运昌隆！\n@c0@"
  tl: "@a@b＊：祝武運昌隆！\n@c0@"
196:
  en: "@a@b*: Welcome, %a000140! I am Lord Zenith, keeper of the world of dreams.\n@c0@"
  ja: "@a@b＊「よくぞ来た　%a000140！\n\tわしの名は　ゼニス。\n\tこの　夢の世界を　たばねる者だ。\n@c0@"
  ko: "@a@b*: 그 누구도 자기 의지로는\n갈 수가 없다네......\n페가수스를 제외하고 말일세.\n@c0@"
  sl: "@a@b＊：终于来了，%a000140！\n　　我的名字是泽尼斯。\n　　是统治着这个梦世界的王。\n@c0@"
  tl: "@a@b＊：終於來了，%a000140！\n　　我的名字是澤尼斯。\n　　是統治著這個夢世界的王。\n@c0@"
197:
  en: "@aLord Zenith@bThou didst well to liberate Cloudsgate Citadel from the clutches of evil. From the depths of my heart, I thank thee.\n@c0@"
  ja: "@a@bゼニス王「よくぞ　このクラウド城を\n\t封印から　解放してくれた。\n\t心から　礼をいうぞ。\n@c0@"
  ko: "@a@b*: 이 성에는 하늘을 달리는 천마\n페가수스가 사는 탑으로\n통하는 단 하나의 길이 있지.\n@c0@"
  sl: "@a@b泽尼斯王：对于将这座云城从\n　　封印中解放出来的诸位，\n　　我表示由衷地感谢。\n@c0@"
  tl: "@a@b澤尼斯王：對於將這座雲城從\n　　封印中解放出來的諸位，\n　　我表示由衷地感謝。\n@c0@"
198:
  en: "@aLord Zenith@bFrom my seat in this castle, I see all and know all — including thy motives for travelling here.\n@c0@"
  ja: "@a@bゼニス王「さて……　わしは　ここにいて\n\t世界の全てを　知ることができる。\n\tそなたたちが　ここへ来た理由もな。\n@c0@"
  ko: "@a@b*: 그래서 데스타무아는\n이 성을 봉인한 것일 테지.\n@c0@"
  sl: "@a@b泽尼斯王：接下来……这个世界的一切\n　　我都了如指掌。\n　　包括诸位来此的理由。\n@c0@"
  tl: "@a@b澤尼斯王：接下來……這個世界的一切\n　　我都瞭如指掌。\n　　包括諸位來此的理由。\n@c0@"
199:
  en: "@aLord Zenith@bThou art familiar with the name of Mortamor, art thou not? The one whom men call the Archfiend...\n@c0@"
  ja: "@a@bゼニス王「もう　すでに\n\t聞きおよんで　いるであろう？\n\t大魔王デスタムーアの　名を。\n@c0@"
  ko: "@a@b*: 저희의 봉인을\n풀어주셔서 정말로\n고마웠습니다!\n@c0@"
  sl: "@a@b泽尼斯王：想必大魔王\n　　德斯塔穆亚之名\n　　诸位已经有所耳闻了吧？\n@c0@"
  tl: "@a@b澤尼斯王：想必大魔王\n　　德斯塔穆亞之名\n　　諸位已經有所耳聞了吧？\n@c0@"
200:
  en: "@aLord Zenith@bHe is the true mastermind of this chaos. The fiend would see all of creation plunged into darkness.\n@c0@"
  ja: "@a@bゼニス王「かの者こそが　全ての元凶。\n\t世界の全てを　闇の底に\n\t沈めようとする　邪悪なる存在……。\n@c0@"
  ko: "@a@b*: 제니스 왕께서\n기다리고 계십니다!\n@c0@"
  sl: "@a@b泽尼斯王：他正是一切的罪魁祸首。\n　　意欲将全世界埋葬于黑暗深处的\n　　邪恶的存在……\n@c0@"
  tl: "@a@b澤尼斯王：他正是一切的罪魁禍首。\n　　意欲將全世界埋葬於黑暗深處的\n　　邪惡的存在……\n@c0@"
201:
  en: "@aLord Zenith@bHis power is immense...yet he is not invulnerable.\n@c0@"
  ja: "@a@bゼニス王「そのチカラは　とてつもなく\n\t強大だ。　しかし　つけいるスキが\n\t全くないわけでは　ない。\n@c0@"
  ko: "@a@b*: 무운을 빕니다!\n@c0@"
  sl: "@a@b泽尼斯王：他拥有不可估量的强大实力，\n　　但也并不是无懈可击的。\n@c0@"
  tl: "@a@b澤尼斯王：他擁有不可估量的強大實力，\n　　但也並不是無懈可擊的。\n@c0@"
202:
  en: "@aLord Zenith@bThus did he seal away the four legends that did threaten his rule:\n@c0@"
  ja: "@a@bゼニス王「その証拠に　デスタムーアは\n\t自分をおびやかす　おそれのある\n\t４つの伝説を　封印した。\n@c0@"
  ko: "@a@b*: 잘 왔도다, %a000140!\n나의 이름은 제니스.\n이 꿈의 세계를 통솔하는 자일세.\n@c0@"
  sl: "@a@b泽尼斯王：证据就是德斯塔穆亚将\n　　有可能威胁到自己的\n　　４个传说封印了起来。\n@c0@"
  tl: "@a@b澤尼斯王：證據就是德斯塔穆亞將\n　　有可能威脅到自己的\n　　４個傳說封印了起來。\n@c0@"
203:
  en: "@aLord Zenith@bFirst, Alltrades Abbey, which nurtureth the latent abilities of mankind and might someday produce the next hero of humanity.\n@c0@"
  ja: "@a@bゼニス王「ひとの持つ　さまざまな\n\t能力を拡大させ　やがては勇者を\n\t生むかもしれぬ　ダーマ神殿。\n@c0@"
  ko: "@a@b제니스 왕: 클라우드 성의 \n봉인을 해방해 줘 \n진심으로 고맙네.\n@c0@"
  sl: "@a@b泽尼斯王：能将人们拥有的能力放大，\n　　最终诞生出勇者的达玛神殿。\n@c0@"
  tl: "@a@b澤尼斯王：能將人們擁有的能力放大，\n　　最終誕生出勇者的達瑪神殿。\n@c0@"
204:
  en: "@aLord Zenith@bSecond, Medford's Manor, home of Medford Medallion, who doth so magnanimously bestow mighty arms from his own hoard.\n@c0@"
  ja: "@a@bゼニス王「すぐれた　武器や\n\t防具などを与える　メダル王。\n@c0@"
  ko: "@a@b제니스 왕: 음...... 나는 여기에 있지만\n세계의 모든 것을 알 수 있지.\n그대들이 여기에 온 이유까지 말이네.\n@c0@"
  sl: "@a@b泽尼斯王：赐予人们优秀武器\n　　及防具的徽章王。\n@c0@"
  tl: "@a@b澤尼斯王：賜予人們優秀武器\n　　及防具的徽章王。\n@c0@"
205:
  en: "@aLord Zenith@bThird, Sorceria, the enchanted city wherein is taught the greatest of all the arcane arts...Magic Burst.\n@c0@"
  ja: "@a@bゼニス王「究極の大呪文\n\tマダンテを　今に伝える\n\t魔法都市カルベローナ。\n@c0@"
  ko: "@a@b제니스 왕: 이미\n들어서 알고 있겠지?\n대마왕 데스타무아의 이름을.\n@c0@"
  sl: "@a@b泽尼斯王：将究极的大咒文\n　　“玛达恩特”流传至今的\n　　魔法都市卡尔贝罗纳。\n@c0@"
  tl: "@a@b澤尼斯王：將究極的大咒文\n　　“瑪達恩特”流傳至今的\n　　魔法都市卡爾貝羅納。\n@c0@"
206:
  en: "@aLord Zenith@bAnd fourth...this very castle, which holdeth the key to reaching Mortamor's home in the dread realm!\n@c0@"
  ja: "@a@bゼニス王「そして　デスタムーアの住まう\n\tはざまの世界へ　行き着くための\n\tカギをにぎる　この　クラウド城を！\n@c0@"
  ko: "@a@b제니스 왕: 그자야말로 모든 것의 원흉.\n세계의 모든 것을 어둠의 나락에\n빠뜨리려는 사악한 존재......\n@c0@"
  sl: "@a@b泽尼斯王：以及握有到达\n　　德斯塔穆亚所在狭隙世界的\n　　钥匙的这座云城！\n@c0@"
  tl: "@a@b澤尼斯王：以及握有到達\n　　德斯塔穆亞所在狹隙世界的\n　　鑰匙的這座雲城！\n@c0@"
207:
  en: "@aLord Zenith@bAnd what form taketh this key? Why, that of winged Pegasus.\n@c0@"
  ja: "@a@bゼニス王「そのカギとは……\n\t背中に　かがやく翼を持ち\n\t空駆ける天馬　ペガサスのことだ。\n@c0@"
  ko: "@a@b제니스 왕: 그 힘은 엄청나게\n강하지. 하지만 빈틈이\n아주 없는 것은 아닐세.\n@c0@"
  sl: "@a@b泽尼斯王：所谓钥匙……\n　　指的就是拥有光辉的翅膀，\n　　能够翱翔于天空的天马珀伽索斯。\n@c0@"
  tl: "@a@b澤尼斯王：所謂鑰匙……\n　　指的就是擁有光輝的翅膀，\n　　能夠翱翔於天空的天馬珀伽索斯。\n@c0@"
208:
  en: "@aLord Zenith@bOnly this celestial steed hath the might to pierce the barrier which barreth the path to Mortamor's realm.\n@c0@"
  ja: "@a@bゼニス王「ペガサスには\n\tはざまの世界の　入口の結界を\n\t打ちやぶる　チカラがあった。\n@c0@"
  ko: "@a@b제니스 왕: 그 증거로 데스타무아는\n자신에게 위협이 될 우려가 있는\n4개의 전설을 봉인했지.\n@c0@"
  sl: "@a@b泽尼斯王：珀伽索斯拥有\n　　能够打破狭隙世界入口处\n　　结界的力量。\n@c0@"
  tl: "@a@b澤尼斯王：珀伽索斯擁有\n　　能夠打破狹隙世界入口處\n　　結界的力量。\n@c0@"
209:
  en: "@aLord Zenith@b...Alas, the Archfiend hath gone so far as to plunder Pegasus' powers...\n@c0@"
  ja: "@a@bゼニス王「だが……　大魔王によって\n\tそのチカラは　うばわれた……。\n@c0@"
  ko: "@a@b제니스 왕: 인간이 지닌 다양한\n능력을 확장하여 용사를\n탄생시킬지도 모를 다마 신전.\n@c0@"
  sl: "@a@b泽尼斯王：但是……这份力量\n　　被大魔王夺走了……\n@c0@"
  tl: "@a@b澤尼斯王：但是……這份力量\n　　被大魔王奪走了……\n@c0@"
210:
  en: "@aLord Zenith@bHearken unto me, %a000140! Thou must descend into the castle well and return with Pegasus at thy side.\n@c0@"
  ja: "@a@bゼニス王「よいか　%a000140よ。\n\tこの城の井戸から　地上へおり\n\tペガサスを　つれてくるのだ。\n@c0@"
  ko: "@a@b제니스 왕: 뛰어난 무기나\n방어구 등을 주는 메달 왕.\n@c0@"
  sl: "@a@b泽尼斯王：听着，%a000140。\n　　从这座城的水井中降落到地面，\n　　将珀伽索斯带回来。\n@c0@"
  tl: "@a@b澤尼斯王：聽著，%a000140。\n　　從這座城的水井中降落到地面，\n　　將珀伽索斯帶回來。\n@c0@"
211:
  en: "@aLord Zenith@bThen, and only then, may I restore that which the Archfiend so cunningly took.\n@c0@"
  ja: "@a@bゼニス王「さすれば　このわしが\n\t再び　ペガサスに\n\tそのチカラを　さずけようぞ！\n@c0@"
  ko: "@a@b제니스 왕: 궁극의 대주문\n마단테를 현세에 전하는\n마법도시 칼베로나.\n@c0@"
  sl: "@a@b泽尼斯王：之后就由我再次\n　　将神力授予珀伽索斯！\n@c0@"
  tl: "@a@b澤尼斯王：之後就由我再次\n　　將神力授予珀伽索斯！\n@c0@"
212:
  en: "@aLord Zenith@bHearken unto me, %a000140! Thou must descend into the castle well and return with Pegasus at thy side.\n@c0@"
  ja: "@a@bゼニス王「よいか　%a000140よ。\n\tこの城の井戸から　地上へおり\n\tペガサスを　つれてくるのだ。\n@c0@"
  ko: "@a@b제니스 왕: 그리고 데스타무아가 사는\n틈새 세계에 가는 데 필요한\n열쇠를 쥐고 있는 이 클라우드 성을!\n@c0@"
  sl: "@a@b泽尼斯王：听着，%a000140。\n　　从这座城的水井中降落到地面，\n　　将珀伽索斯带回来。\n@c0@"
  tl: "@a@b澤尼斯王：聽著，%a000140。\n　　從這座城的水井中降落到地面，\n　　將珀伽索斯帶回來。\n@c0@"
213:
  en: "@aLord Zenith@bThen, and only then, may I restore that which the Archfiend so cunningly took.\n@c0@"
  ja: "@a@bゼニス王「さすれば　このわしが\n\t再び　ペガサスに\n\tそのチカラを　さずけようぞ！\n@c0@"
  ko: "@a@b제니스 왕: 그 열쇠란......\n등에 빛나는 날개를 지니고\n하늘을 나는 천마 페가수스라네.\n@c0@"
  sl: "@a@b泽尼斯王：之后就由我再次\n　　将神力授予珀伽索斯！\n@c0@"
  tl: "@a@b澤尼斯王：之後就由我再次\n　　將神力授予珀伽索斯！\n@c0@"
214:
  en: "@a@b*: Lord Zenith sent word that I should expect %H0860%Xthee%Yyou%Z. Pray take care, %H0860%Xfriend%Yfriends%Z.\n@c0@"
  ja: "@a@b＊「ゼニス王から　話は\n\t聞いております。\n\tどうか　お気をつけて。\n@c0@"
  ko: "@a@b제니스 왕: 페가수스에게는\n틈새 세계 입구의 결계를\n뚫을 수 있는 힘이 있지.\n@c0@"
  sl: "@a@b＊：事情已经从\n　　泽尼斯王那里听说了。\n　　请多加小心。\n@c0@"
  tl: "@a@b＊：事情已經從\n　　澤尼斯王那裡聽說了。\n　　請多加小心。\n@c0@"
215:
  ko: "@a@b제니스 왕: 하지만...... 대마왕때문에\n그 힘을 잃고 말았어......\n@c0@"
216:
  ko: "@a@b제니스 왕: 잘 듣게, %a000140.\n이 성의 우물을 통해 지상으로 내려가\n페가수스를 데리고 오게나.\n@c0@"
217:
  ko: "@a@b제니스 왕: 그러면 내가\n다시 페가수스에게\n그 힘을 내려 주겠네!\n@c0@"
218:
  ko: "@a@b제니스 왕: 잘 듣게, %a000140.\n이 성의 우물을 통해 지상으로 내려가\n페가수스를 데리고 오게나.\n@c0@"
219:
  ko: "@a@b제니스 왕: 그러면 내가\n다시 페가수스에게\n그 힘을 내려 주겠네!\n@c0@"
220:
  ko: "@a@b*: 제니스 왕으로부터\n말씀 들었습니다.\n부디 조심하십시오.\n@c0@"
