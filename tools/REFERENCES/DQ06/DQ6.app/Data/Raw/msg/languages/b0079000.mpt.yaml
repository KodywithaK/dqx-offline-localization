22:
  en: "@a@b*: I can only pray that stout-hearted warriors hear my plea...\n@c0@"
  ja: "@a@b＊「もし　心ある者が　いれば\n\tわが願いを　聞いてほしい……。\n@c0@"
  ko: "@a@b*: 인정이 있는 분이라면\n제 소원을 들어 주세요......\n@c0@"
  sl: "@a@b＊：愿有心人能听听我的心愿……\n@c0@"
  tl: "@a@b＊：願有心人能聽聽我的心願……\n@c0@"
23:
  en: "@a@b*: Please, free Lord Zenith and return this castle to its rightful place in the dream world...\n@c0@"
  ja: "@a@b＊「ゼニス王の　封印を　解き放ち\n\tこの城を　夢の大地に……。\n@c0@"
  ko: "@a@b*: 제니스 왕의 봉인을 풀어\n이 성을 꿈의 대지로......\n@c0@"
  sl: "@a@b＊：解开泽尼斯王的封印，\n　　让这座城重归梦之大地……\n@c0@"
  tl: "@a@b＊：解開澤尼斯王的封印，\n　　讓這座城重歸夢之大地……\n@c0@"
24:
  en: "@a@bThere's no response. It's just a corpse.\n@c0@"
  ja: "@a@b返事がない。\nただの　しかばねの　ようだ……。\n@c0@"
  ko: "@a@b반응이 없다.\n그냥 시체인 것 같다......\n@c0@"
  sl: "@a@b没有回应。\n看来只是一具尸体……\n@c0@"
