  tl: "@a@b迪蘭：但是那種程度的力量，\n　　還無法令我感到愉悅。\n@c0@"
131:
  en: "@aDhuran@bCome, %a002040! I have need of you once more.\n@c0@"
  ja: "@a@bデュラン「いでよ　%a002040！\n\tふたたび　お前の手をわずらわす。\n@c0@"
