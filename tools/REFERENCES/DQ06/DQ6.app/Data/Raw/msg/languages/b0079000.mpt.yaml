  sl: "@a@b＊：就快了。再过不久，\n　　世界就会落入我们魔族之手！\n　　叽叽叽！\n@c0@"
  tl: "@a@b＊：就快了。再過不久，\n　　世界就會落入我們魔族之手！\n　　嘰嘰嘰！\n@c0@"
34:
  en: "@a@b*: Grrrrrr...\n@c0@"
  ja: "@a@b＊「ガルルルーー。\n@c0@"
  ko: "@a@b*: 크르르릉~\n@c0@"
  sl: "@a@b＊：嘎噜噜噜。\n@c0@"
  tl: "@a@b＊：嘎嚕嚕嚕。\n@c0@"
35:
  en: "@a@b*: Do you know how it all works?\n@c0@"
  ja: "@a@b＊「お前　知ってるか？\n@c0@"
  ko: "@a@b*: 알고 있어?\n@c0@"
  sl: "@a@b＊：你知道吗？\n@c0@"
  tl: "@a@b＊：你知道嗎？\n@c0@"
36:
  en: "@a@b*: Of course you do.\n@c0@"
  ja: "@a@b＊「やっぱりな。\n@c0@"
  ko: "@a@b*: 역시나.\n@c0@"
  sl: "@a@b＊：果然如此啊。\n@c0@"
  tl: "@a@b＊：果然如此啊。\n@c0@"
37:
  en: "@a@b*: Then listen up. Even regular humans can find their way to our side, if they fall victim to the strength of their desires...\n@c0@"
  ja: "@a@b＊「じゃあ　教えてやろう。\n\tふつうの人間でも\n\tあまりに　自分の欲望が強すぎると……\n@c0@"
  ko: "@a@b*: 그럼 알려주마.\n평범한 인간이라도\n자기 욕망이 너무 강하면......\n@c0@"
  sl: "@a@b＊：那我就告诉你。\n　　就算是普通人类，\n　　如果对自己的欲望过于执着……\n@c0@"
  tl: "@a@b＊：那我就告訴你。\n　　就算是普通人類，\n　　如果對自己的欲望過於執著……\n@c0@"
38:
  en: "@a@b*: When their hearts are overtaken by darkness, they sometimes come to us.\n@c0@"
  ja: "@a@b＊「心が　闇に支配されてしまい\n\tこちら側に　来ることが\n\tあるらしいぞ。\n@c0@"
  ko: "@a@b*: 마음이 어둠의 지배를 받아\n이쪽 세상으로 오는\n경우가 있다더군.\n@c0@"
  sl: "@a@b＊：心灵也会被黑暗所支配，\n　　然后成为我们的同伴。\n　　好像有这种人存在哦。\n@c0@"
  tl: "@a@b＊：心靈也會被黑暗所支配，\n　　然後成為我們的同伴。\n　　好像有這種人存在哦。\n@c0@"
39:
  en: "@a@b*: If you ask me, they should be thrilled to become our allies! Skree!\n@c0@"
  ja: "@a@b＊「でも　オレたちの仲間に\n\tなれるんだから　その人間は\n\tしあわせ者だよな。\n@c0@"
  ko: "@a@b*: 하지만 우리와 친구가\n될 수 있으니 그런 인간은\n행복하다고 봐야겠지.\n@c0@"
  sl: "@a@b＊：不过，既然能成为我们的同伴，\n　　这人也算是幸运儿了。\n@c0@"
  tl: "@a@b＊：不過，既然能成為我們的同伴，\n　　這人也算是幸運兒了。\n@c0@"
40:
  en: "@a@bTwo voices can be heard deep in discussion...\n@c0@"
  ja: "@a@b２匹の話し声が聞こえる……。\n@c0@"
  ko: "@a@b두 마리의 대화 소리가 들린다......\n@c0@"
  sl: "@a@b能听到两只魔物的谈话声……\n@c0@"
  tl: "@a@b能聽到兩隻魔物的談話聲……\n@c0@"
41:
  en: "@a@b*: So one who possesses all four of the legendary relics can gain entry to this castle?\n@c0@"
  ja: "@a@b＊「すると　伝説の武具を\n\tすべて　そろえた者は　この城へ\n\t導かれるように　なっていたと……？\n@c0@"
  ko: "@a@b*: 그럼 전설의 장비를\n모두 갖춘 자는\n이 성으로 오게 된다는......?\n@c0@"
  sl: "@a@b＊：就是说，\n　　只要有人集齐所有传说中的武具，\n　　那人就会被指引前来这座城？\n@c0@"
  tl: "@a@b＊：就是說，\n　　只要有人集齊所有傳說中的武具，\n　　那人就會被指引前來這座城？\n@c0@"
42:
  en: "@a@b*: That's right. But it defies belief that any human could ever find them all.\n@c0@"
  ja: "@a@b＊「ああ　そういうことだ。\n\tただ　集められる人間が\n\tいるとは　思えないがな。\n@c0@"
  ko: "@a@b*: 그래 맞아.\n그걸 전부 모으는 인간이\n있을 리 없겠지만......\n@c0@"
  sl: "@a@b＊：是啊，就是这样。\n　　只不过我想大概没有人类\n　　能够做得到吧。\n@c0@"
  tl: "@a@b＊：是啊，就是這樣。\n　　只不過我想大概沒有人類\n　　能夠做得到吧。\n@c0@"
43:
  en: "@a@b*: But let's just say it was possible. Is Lord Dhuran aware of this?\n@c0@"
  ja: "@a@b＊「でも　もし　いたとしたら……。\n\tデュランさまは　そのことを\n\tごぞんじなのか？\n@c0@"
  ko: "@a@b*: 하지만 만약 있다면......\n듀란 님은 그걸\n알고 계실까?\n@c0@"
  sl: "@a@b＊：但是，如果有的话……\n　　迪兰大人知道这件事吗？\n@c0@"
  tl: "@a@b＊：但是，如果有的話……\n　　迪蘭大人知道這件事嗎？\n@c0@"
44:
  en: "@a@b*: Naturally. It could only ever happen with his knowledge and consent.\n@c0@"
  ja: "@a@b＊「ああ　もちろん。\n\t知っていて　そのままに\n\tしてあるらしいぞ。\n@c0@"
  ko: "@a@b*: 물론이지.\n아시면서도 그대로\n두시는 것 같더군.\n@c0@"
  sl: "@a@b＊：啊啊，当然知道。\n　　而且似乎他明明知道，\n　　却还是放任不管。\n@c0@"
  tl: "@a@b＊：啊啊，當然知道。\n　　而且似乎他明明知道，\n　　卻還是放任不管。\n@c0@"
45:
  en: "@a@b*: So if, against all odds, a human were to gather all the relics...you're saying he could come here whenever he chose?\n@c0@"
  ja: "@a@b＊「じゃあ　万が一\n\t集めた人間が　いたら　この城に\n\t来てしまうじゃないか！\n@c0@"
  ko: "@a@b*: 그럼 그걸 전부\n모은 인간이 이 성에\n올 수도 있다는 거잖아!\n@c0@"
  sl: "@a@b＊：那么，万一有人集齐了，\n　　不就会到这座城来了吗！\n@c0@"
  tl: "@a@b＊：那麼，萬一有人集齊了，\n　　不就會到這座城來了嗎！\n@c0@"
46:
  en: "@a@b*: Exactly. Which makes me wonder just what in the world our master is doing...\n@c0@"
  ja: "@a@b＊「その　とおりだ。\n\tいったい　デュランさまは\n\tどういう　おつもりなのか……。\n@c0@"
  ko: "@a@b*: 그래 맞아.\n도대체 듀란 님은\n무슨 생각이신 걸까......\n@c0@"
  sl: "@a@b＊：没错。\n　　迪兰大人到底是怎么想的呢……\n@c0@"
  tl: "@a@b＊：沒錯。\n　　迪蘭大人到底是怎麼想的呢……\n@c0@"
47:
  en: "@a@b*: What do you want!?\n@c0@"
  ja: "@a@b＊「なんだ　お前らは？\n@c0@"
  ko: "@a@b*: 뭐냐, 네놈들은?\n@c0@"
  sl: "@a@b＊：干什么啊，你们？\n@c0@"
  tl: "@a@b＊：幹什麼啊，你們？\n@c0@"
48:
  en: "@a@b*: Skree! Go on, get lost!\n@c0@"
  ja: "@a@b＊「あっちに　いけよ。　キキー！\n@c0@"
  ko: "@a@b*: 저리 가. 키키!\n@c0@"
  sl: "@a@b＊：一边去。叽叽！\n@c0@"
  tl: "@a@b＊：一邊去。嘰嘰！\n@c0@"
49:
  en: "@a@b*: At last, we meet. I am Dhuran, ruler of Stormsgate Citadel.\n@c0@"
  ja: "@a@b＊「初に　お目に　かかる。\n\tわが名は　デュラン。\n\tこのヘルクラウド城の　主だ。\n@c0@"
  ko: "@a@b*: 만나서 반갑다.\n내 이름은 듀란.\n이 헬 클라우드 성의 성주이지.\n@c0@"
  sl: "@a@b＊：初次见面。\n　　我名为迪兰，\n　　是这座地狱云城的城主。\n@c0@"
  tl: "@a@b＊：初次見面。\n　　我名為迪蘭，\n　　是這座地獄雲城的城主。\n@c0@"
50:
  en: "@aDhuran@bI see you possess the four legendary relics... You have my respect, even as my foe.\n@c0@"
  ja: "@a@bデュラン「ほほう……　たしかに\n\t伝説の４つの武具を　持っておる。\n\t敵ながら　みごとなものよな。\n@c0@"
  ko: "@a@b듀란: 호오...... 틀림없이\n전설의 장비 4개를 모두 가졌군.\n비록 적이지만 아주 훌륭해.\n@c0@"
  sl: "@a@b迪兰：嚯嚯……你们确实持有着\n　　传说中的４件武具。\n　　身为敌人，干得着实漂亮。\n@c0@"
  tl: "@a@b迪蘭：嚯嚯……你們確實持有著\n　　傳說中的４件武具。\n　　身為敵人，幹得著實漂亮。\n@c0@"
51:
  en: "@aDhuran@bSeeking out the legendary relics from around the world and making it to this castle is no small feat...\n@c0@"
  ja: "@a@bデュラン「世界中にちらばる　伝説の武具\n\tすべてを集め　この城へと導かれる\n\t資格を得る人間が　いたとしたら……\n@c0@"
  ko: "@a@b듀란: 세계에 흩어진 전설의 장비를\n모두 모아서 이 성으로 인도될\n자격을 얻은 인간이 있다면......\n@c0@"
  sl: "@a@b迪兰：将散落世界各地的传说中的武具集齐，\n　　获得被指引前来这座城的资格。\n　　倘若这样的人类真的存在……\n@c0@"
  tl: "@a@b迪蘭：將散落世界各地的傳說中的武具集齊，\n　　獲得被指引前來這座城的資格。\n　　倘若這樣的人類真的存在……\n@c0@"
52:
  en: "@aDhuran@bSurely, any human capable of such an undertaking would pose a serious threat to all monsterkind.\n@c0@"
  ja: "@a@bデュラン「その者は　かならずや\n\tわれら　魔族にとって\n\tやっかいな存在と　なるであろう。\n@c0@"
  ko: "@a@b듀란: 그자는 언젠가 틀림없이\n우리 마족에게\n성가신 존재가 될 터.\n@c0@"
  sl: "@a@b迪兰：他对于我们魔族而言，\n　　必将成为一个巨大的妨碍吧。\n@c0@"
  tl: "@a@b迪蘭：他對於我們魔族而言，\n　　必將成為一個巨大的妨礙吧。\n@c0@"
53:
  en: "@aDhuran@bThus I have been waiting here for your arrival — waiting to show the watching world the folly of opposing me!\n@c0@"
  ja: "@a@bデュラン「ならば　そうならぬうちに\n\tその芽を　つみとっておこうと\n\tこうして　待っていたのだが……。\n@c0@"
  ko: "@a@b듀란: 따라서 그리 되기 전에\n그 싹을 잘라 두려고\n이렇게 기다리고 있었지......\n@c0@"
  sl: "@a@b迪兰：那么，为了防止这样的事发生，\n　　必须将其扼杀于萌芽状态。\n　　所以我才这样一直等待……\n@c0@"
  tl: "@a@b迪蘭：那麼，為了防止這樣的事發生，\n　　必須將其扼殺於萌芽狀態。\n　　所以我才這樣一直等待……\n@c0@"
54:
  en: "@aDhuran@b%0%a000140! That is your name, is it not? In all honesty, I am delighted!\n@c0@"
  ja: "@a@bデュラン「ほう　%a000140と　申すのか。\n\t%a000140！\n\t正直いって　私は　うれしいぞ！\n@c0@"
  ko: "@a@b듀란: 호오, 이름이 %a000140인가?\n%a000140!\n솔직히 이 몸은 기쁘다!\n@c0@"
  sl: "@a@b迪兰：哦，你叫%a000140是吗。\n　　%a000140！\n　　实话说，我简直欣喜若狂！\n@c0@"
  tl: "@a@b迪蘭：哦，你叫%a000140是嗎。\n　　%a000140！\n　　實話說，我簡直欣喜若狂！\n@c0@"
55:
  en: "@aDhuran@bI was convinced no human could ever collect these relics — but you have proved me wrong.\n@c0@"
  ja: "@a@bデュラン「よもや　すべての武具を\n\t集められる人間など\n\tいるはずもないと　思っていたからな。\n@c0@"
  ko: "@a@b듀란: 설마 장비를 전부\n모을 수 있는 인간이\n있으리라고는 전혀 생각하지 못했으니.\n@c0@"
  sl: "@a@b迪兰：因为我根本没想过\n　　居然真的有人类能够\n　　集齐所有武具。\n@c0@"
  tl: "@a@b迪蘭：因為我根本沒想過\n　　居然真的有人類能夠\n　　集齊所有武具。\n@c0@"
56:
  en: "@aDhuran@bNow, I wish to see the power you possess. My pulse is racing for the first time in aeons!\n@c0@"
  ja: "@a@bデュラン「その実力　どれほどのものか。\n\tひさしぶりに　血が　さわぐわ！\n@c0@"
  ko: "@a@b듀란: 그 실력이 궁금하군.\n오랜만에 피가 끓는구나!\n@c0@"
  sl: "@a@b迪兰：这份实力强大到何等地步呢。\n　　我已经很久没有这么热血沸腾过了！\n@c0@"
  tl: "@a@b迪蘭：這份實力強大到何等地步呢。\n　　我已經很久沒有這麼熱血沸騰過了！\n@c0@"
57:
  en: "@aDhuran@bCome now, my minions!\n@c0@"
  ja: "@a@bデュラン「いでよ！　わが　しもべよ！\n@c0@"
  ko: "@a@b듀란: 나오거라! 나의 종이여!\n@c0@"
  sl: "@a@b迪兰：出来吧！我的仆从们！\n@c0@"
  tl: "@a@b迪蘭：出來吧！我的僕從們！\n@c0@"
58:
  en: "@aDhuran@bLet the entertainment begin!\n@c0@"
  ja: "@a@bデュラン「さあ　楽しませてもらおう！\n@c0@"
  ko: "@a@b듀란: 자, 어디 즐겨 보실까!\n@c0@"
  sl: "@a@b迪兰：那么，让我好好享受一番吧！\n@c0@"
  tl: "@a@b迪蘭：那麼，讓我好好享受一番吧！\n@c0@"
59:
  en: "@aDhuran@bAh ha! Good show! If you had been defeated, you would have betrayed all my expectations.\n@c0@"
  ja: "@a@bデュラン「ふぁっふぁっふぁ。\n\tその調子だ。　ここで負けるようなら\n\t待ったかいが　ないというもの。\n@c0@"
  ko: "@a@b---점프---> #079135로\n@c0@"
  sl: "@a@b迪兰：哈哈哈。就是这股干劲。\n　　只是这样就被打败的话，\n　　根本不值得我等这么久。\n@c0@"
  tl: "@a@b迪蘭：哈哈哈。就是這股幹勁。\n　　只是這樣就被打敗的話，\n　　根本不值得我等這麼久。\n@c0@"
60:
  en: "@aDhuran@bBut your next challenge is of a different order. This opponent is one of your fellow humans.\n@c0@"
  ja: "@a@bデュラン「しかし　次は　どうかな。\n\tこの者は　お前たちと同じ　人間。\n@c0@"
  ko: "@a@b듀란: 으하하하.\n아주 좋다. 여기서 쓰러지고 만다면\n그동안 기다린 보람이 없으니.\n@c0@"
  sl: "@a@b迪兰：那么，接下来又如何呢。\n　　这个人是和你们一样的人类。\n@c0@"
  tl: "@a@b迪蘭：那麼，接下來又如何呢。\n　　這個人是和你們一樣的人類。\n@c0@"
61:
  en: "@aDhuran@bHe was led here by his overwhelming desire to become more powerful.\n@c0@"
  ja: "@a@bデュラン「しかし　強くなりたいという\n\tおのれの欲望が　あまりに強く\n\tこちら側に　来てしまった者だ。\n@c0@"
  ko: "@a@b듀란: 그러나 다음은 어떨까?\n이자는 너희와 같은 인간이다.\n@c0@"
  sl: "@a@b迪兰：但是他想要变强的欲望\n　　实在太强烈，才会投奔我而来。\n@c0@"
  tl: "@a@b迪蘭：但是他想要變強的欲望\n　　實在太強烈，才會投奔我而來。\n@c0@"
62:
  en: "@aDhuran@bSome fight for the good of the world... Others fight only for themselves...\n@c0@"
  ja: "@a@bデュラン「世のためなどという\n\tたわけた理由で　戦う者と\n\tおのれだけのために　戦う者……\n@c0@"
  ko: "@a@b듀란: 하지만 강해지고자 하는\n자신의 욕망이 너무 강해\n이쪽 세계로 넘어온 자이지.\n@c0@"
  sl: "@a@b迪兰：为了“拯救世界”\n　　这种愚蠢理由而战的人，\n　　和为了自己而战的人……\n@c0@"
  tl: "@a@b迪蘭：為了“拯救世界”\n　　這種愚蠢理由而戰的人，\n　　和為了自己而戰的人……\n@c0@"
63:
  en: "@aDhuran@bNow, these two philosophies shall vie for supremacy.\n@c0@"
  ja: "@a@bデュラン「どちらが　勝つのか\n\tこれは　なかなか見ものだな。\n@c0@"
  ko: "@a@b듀란: 세상을 위한다는\n한심하기 짝이 없는 이유로 싸우는 자와\n자기 자신만을 위해 싸우는 자......\n@c0@"
  sl: "@a@b迪兰：到底哪边会赢呢，\n　　这可真是值得一看啊。\n@c0@"
  tl: "@a@b迪蘭：到底哪邊會贏呢，\n　　這可真是值得一看啊。\n@c0@"
64:
  en: "@aDhuran@bCome, my minion!\n@c0@"
  ja: "@a@bデュラン「いでよ！\n\tつぎなる　わが　しもべよ！\n@c0@"
  ko: "@a@b듀란: 어느 쪽이 이기든\n이거 참 볼 만하겠군.\n@c0@"
  sl: "@a@b迪兰：出来吧！我的下一个仆从！\n@c0@"
  tl: "@a@b迪蘭：出來吧！我的下一個僕從！\n@c0@"
65:
  en: "@aDhuran@bAllow me to introduce to you the world's strongest warrior — a man who offered his soul to me. His name is %a002040.\n@c0@"
  ja: "@a@bデュラン「紹介しよう。\n\tこの私に　たましいを　ささげし\n\t世界最強の男　%a002040だ。\n@c0@"
  ko: "@a@b듀란: 나오너라!\n또 다른 나의 종이여!\n@c0@"
  sl: "@a@b迪兰：介绍一下。\n　　这是为我迪兰献上了自己的灵魂的，\n　　世界第一强者%a002040。\n@c0@"
  tl: "@a@b迪蘭：介紹一下。\n　　這是為我迪蘭獻上了自己的靈魂的，\n　　世界第一強者%a002040。\n@c0@"
66:
  en: "@aDhuran@bNow gather all your strength and prepare to do battle — to the death!\n@c0@"
  ja: "@a@bデュラン「さあ　死力をつくし\n\tぞんぶんに　戦うがよい！\n@c0@"
  ko: "@a@b듀란: 소개하마.\n이 몸에게 영혼을 바친\n세계 최강의 사나이 %a002040%F2040%X다%Y이다%Z.\n@c0@"
  sl: "@a@b迪兰：那么，竭尽全力去战斗吧，\n　　至死方休！\n@c0@"
  tl: "@a@b迪蘭：那麼，竭盡全力去戰鬥吧，\n　　至死方休！\n@c0@"
67:
  en: "@aDhuran@bWell, well... A fine victory. But I expected nothing less.\n@c0@"
