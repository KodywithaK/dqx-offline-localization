139:
  en: "@a@b*: As you wish, my lord!\n@c0@"
  ja: "@a@b＊「ははっ！\n@c0@"
  ko: "@a@b듀란: 그럼 얼마나\n강해졌는지 보여주실까.\n@c0@"
  sl: "@a@b＊：遵命！\n@c0@"
  tl: "@a@b＊：遵命！\n@c0@"
140:
  en: "@a@b*: I bid thee welcome to Cloudsgate Citadel — home of Lord Zenith, keeper of dreams.\n@c0@"
  ja: "@a@b＊「クラウド城へ　ようこそ！\n\tここは　夢の世界をたばねる\n\tゼニス王の　お城です。\n@c0@"
  ko: "@a@b듀란: 하지만 그 후로\n수행을 더 쌓은 건\n그대들뿐만이 아니야.\n@c0@"
  sl: "@a@b＊：欢迎来到云城！\n　　这里是统治梦世界的王，\n　　泽尼斯王的居城。\n@c0@"
  tl: "@a@b＊：歡迎來到雲城！\n　　這裡是統治夢世界的王，\n　　澤尼斯王的居城。\n@c0@"
141:
  en: "@a@b*: Hmm? Wait... Do you recognise me?\n@c0@"
