  sl: "@a@b＊：没想到你这样的家伙\n　　竟然是迪兰大人的客人啊。\n@c0@"
  tl: "@a@b＊：沒想到你這樣的傢伙\n　　竟然是迪蘭大人的客人啊。\n@c0@"
12:
  en: "@a@b*: Tch! Get out of my sight!\n@c0@"
