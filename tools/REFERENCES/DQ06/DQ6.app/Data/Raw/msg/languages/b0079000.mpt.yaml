  tl: "@a@b＊：貪心可不好。\n　　等你用完了我會再給你的啦。\n@c0@"
163:
  en: "@a@b*: Here you go: authentic Yggdrasil dew! Use it wisely, and don't tell anyone where you got it.\n@c0@"
  ja: "@a@b＊「はいっ　世界樹のしずく！\n\tみんなには　ナイショだよ。\n\tたいせつに　つかってね！\n@c0@"
