  tl: "@a@b＊：我們是由現實世界的\n　　各種各樣的人們所做的夢\n　　集合在一起而誕生的。\n@c0@"
151:
  en: "@a@b*: Our king, Lord Zenith, guided those dreams, and through them, he ruleth the dream world.\n@c0@"
