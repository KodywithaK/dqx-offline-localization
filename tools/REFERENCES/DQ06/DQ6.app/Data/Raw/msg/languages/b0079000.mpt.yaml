  sl: "@a@b＊：不是，就算你们\n　　现在没有带在身上，\n　　我也能够知道！\n@c0@"
  tl: "@a@b＊：不是，就算你們\n　　現在沒有帶在身上，\n　　我也能夠知道！\n@c0@"
148:
  en: "@a@b*: Then...it was thou that didst dispel the curse upon our castle! Glad tidings!\n@c0@"
