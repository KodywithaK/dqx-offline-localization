  sl: "@a@b＊：叽叽叽！\n　　人类们已经没有神明了！\n@c0@"
  tl: "@a@b＊：嘰嘰嘰！\n　　人類們已經沒有神明了！\n@c0@"
33:
  en: "@a@b*: It is almost time! The world is but a claw's breadth from our grasp! Skreeee!\n@c0@"
  ja: "@a@b＊「もうすぐだ。　もうすぐ世界は\n\tわれら　魔族のものに！\n\tキーキッキ！\n@c0@"
