  tl: "@a@b＊：哎呀？是你們！\n　　還記得我嗎？\n@c0@"
142:
  en: "@a@b*: Verily, then it was you!\n@c0@"
  ja: "@a@b＊「やはり！\n@c0@"
  ko: "@a@b듀란: 너에게 다시 한번\n기회를 주겠노라.\n@c0@"
  sl: "@a@b＊：果然没错！\n@c0@"
  tl: "@a@b＊：果然沒錯！\n@c0@"
143:
  en: "@a@b*: When we were sealed away, I was forced to wander about in spirit form...\n@c0@"
  ja: "@a@b＊「封印され　たましいだけで\n\tさまよっているとき\n\tあなたたちに会ったような……。\n@c0@"
  ko: "@a@b---점프---> #079118로\n@c0@"
  sl: "@a@b＊：在我被封印，\n　　只有灵魂四处游荡的时候\n　　好像和你们见过面……\n@c0@"
  tl: "@a@b＊：在我被封印，\n　　只有靈魂四處遊蕩的時候\n　　好像和你們見過面……\n@c0@"
144:
  en: "@a@b*: It was then our paths did cross, I believe.\n@c0@"
