  ko: "@a@b*: 힛힛힛.\n얼마 전에 여기에 온 인간은\n꽤 쓸만한 모양이더군.\n@c0@"
  sl: "@a@b＊：嘻嘻嘻。\n　　据说之前来的人类\n　　可是派上了大用场呢。\n@c0@"
  tl: "@a@b＊：嘻嘻嘻。\n　　據說之前來的人類\n　　可是派上了大用場呢。\n@c0@"
28:
  en: "@a@b*: We expect no less from you! Skree!\n@c0@"
  ja: "@a@b＊「お前たちも　負けないようにな。\n\tヒッヒッヒ。\n@c0@"
  ko: "@a@b*: 너희들도 지지 말도록 해라.\n힛힛힛.\n@c0@"
  sl: "@a@b＊：你们也别输给他啊。\n　　嘻嘻嘻。\n@c0@"
  tl: "@a@b＊：你們也別輸給他啊。\n　　嘻嘻嘻。\n@c0@"
29:
  en: "@a@b*: Three of the areas we sealed off have been restored. Our enemies' power grows daily.\n@c0@"
  ja: "@a@b＊「封印された　３つの大地が\n\tよみがえり　われらが敵は　日ごと\n\tチカラをつけて　いるらしいぞ。\n@c0@"
  ko: "@a@b*: 봉인된 3개의 대지가\n되살아나고 우리의 적은 나날이\n세력을 키워가고 있지.\n@c0@"
  sl: "@a@b＊：被封印的３个地方已经复苏，\n　　敌人的实力似乎也是与日俱增啊。\n@c0@"
  tl: "@a@b＊：被封印的３個地方已經復甦，\n　　敵人的實力似乎也是與日俱增啊。\n@c0@"
30:
  en: "@a@b*: Yet our master, Lord Dhuran, hasn't reacted. If anything, he seems to be enjoying the situation...\n@c0@"
  ja: "@a@b＊「しかし　デュランさまは\n\tいっこうに　動こうとしないばかりか\n\t何やら　楽しんでいるようにも見える。\n@c0@"
  ko: "@a@b*: 하지만 듀란 님은\n전혀 움직일 기미가 없을 뿐더러\n오히려 즐기고 있는 것 같더군.\n@c0@"
  sl: "@a@b＊：但是迪兰大人非但按兵不动，\n　　简直就像在享受着这一切似的。\n@c0@"
  tl: "@a@b＊：但是迪蘭大人非但按兵不動，\n　　簡直就像在享受著這一切似的。\n@c0@"
31:
  en: "@a@b*: I wonder what exactly he could be planning...\n@c0@"
  ja: "@a@b＊「いったい　デュランさまは\n\tどういう　おつもりなのか……。\n@c0@"
  ko: "@a@b*: 도대체 듀란 님은\n무슨 생각인 걸까......\n@c0@"
  sl: "@a@b＊：迪兰大人究竟想要做什么呢……\n@c0@"
  tl: "@a@b＊：迪蘭大人究竟想要做什麼呢……\n@c0@"
32:
  en: "@a@b*: Skree! The Goddess can do nothing to save humankind!\n@c0@"
  ja: "@a@b＊「キーキキ！\n\tもはや　人間どもには\n\t神など　いない。\n@c0@"
