0:
  en: "@a%0%a002000@bKeep mum, %a000090. Sometimes folks're better off not knowin' the whole truth.\n@c0@"
  ja: "@a@b%a002000「知らないほうが　いいことも\n\tあるんだけどな……。\n\tよけいなこと　いうなよ　%a000090。\n@c0@"
  ko: "@a@b%a002000: 차라리 모르는 게\n약일 수도 있어......\n쓸데없는 얘기는 하지 마, %a000090.\n@c0@"
  sl: "@a@b%a002000：有些事情\n　　还是不知道为好吧……\n　　别乱说话啊%a000090。\n@c0@"
  tl: "@a@b%a002000：有些事情\n　　還是不知道為好吧……\n　　別亂說話啊%a000090。\n@c0@"
1:
  en: "@a%0%a002010@bThe blood that dirtied the water was the cause of Evgenya's distress...\n@c0@"
  ja: "@a@b%a002010「あれは　きっと\n\tジーナさんの\n\t悲しみの色　だったのよ。\n@c0@"
  ko: "@a@b%a002010: 그건 분명\n지나 씨의 슬픔이\n빚어낸 색깔이었을 거야.\n@c0@"
  sl: "@a@b%a002010：那一定是\n　　吉娜悲伤的颜色。\n@c0@"
  tl: "@a@b%a002010：那一定是\n　　吉娜悲傷的顏色。\n@c0@"
2:
  en: "@a%0%a002000@bThe Goddess is gettin' all the credit for our handiwork. Ah, well.\n@c0@"
  ja: "@a@b%a002000「神さまは　ぜんぜん\n\tかんけい　ないんだけどな。\n\tま　いっか。\n@c0@"
  ko: "@a@b%a002000: 신과는 전혀\n관계 없는 일이지만.\n뭐, 아무려면 어때.\n@c0@"
  sl: "@a@b%a002000：跟神明完全没关系吧。\n　　算了。\n@c0@"
  tl: "@a@b%a002000：跟神明完全沒關係吧。\n　　算了。\n@c0@"
3:
  en: "@a%0%a002010@bIt's important to show gratitude for the blessings you receive.\n㈡\nI'm grateful to have companions like you and %a002000 to travel with, %a000090!\n@c0@"
  ja: "@a@b%a002010「どんな　ことにも\n\tかんしゃする　気持ちが\n\tだいじなのよね。\n@c0@"
  ko: "@a@b%a002010: 어떤 일이든\n감사하는 마음이\n소중한 거야.\n@c0@"
  sl: "@a@b%a002010：保持对神明感恩的态度，\n　　这一点很重要呢。\n@c0@"
  tl: "@a@b%a002010：保持對神明感恩的態度，\n　　這一點很重要呢。\n@c0@"
4:
  en: "@a%0%a002000@bAye, we know the sales pitch: this stuff cures disease 'n' everything like that.\n@c0@"
  ja: "@a@b%a002000「この　水の色なら\n\t病気も　なおりそうだよな。\n@c0@"
  ko: "@a@b%a002000: 이런 물 색깔이면\n병도 금방 낫겠어.\n@c0@"
  sl: "@a@b%a002000：这样清澈的水才能治病吧。\n@c0@"
  tl: "@a@b%a002000：這樣清澈的水才能治病吧。\n@c0@"
5:
  en: "@a%0%a002010@bThe town will be back on its feet in no time. This water's crystal clear again!\n@c0@"
  ja: "@a@b%a002010「本当。\n\tきよらかな　色ね。\n@c0@"
  ko: "@a@b%a002010: 정말이야.\n맑고 깨끗해.\n@c0@"
  sl: "@a@b%a002010：是啊。\n　　多清澈的水。\n@c0@"
  tl: "@a@b%a002010：是啊。\n　　多清澈的水。\n@c0@"
6:
  en: "@a%0%a002000@bGeh. So where'd they run off to?\n@c0@"
  ja: "@a@b%a002000「ちっ……。\n\tいったい　どこに　いっちまったんだ。\n@c0@"
  ko: "@a@b%a002000: 쳇......\n도대체 어디로 간 거야.\n@c0@"
  sl: "@a@b%a002000：嘁……\n　　到底去哪里了。\n@c0@"
  tl: "@a@b%a002000：嘁……\n　　到底去哪裡了。\n@c0@"
7:
  en: "@a%0%a002010@bKnowing those two, I bet they're already far away by now.\n@c0@"
  ja: "@a@b%a002010「あのふたり……\n\tもう　どこか　とおくに\n\tいって　しまったのかしら。\n@c0@"
  ko: "@a@b%a002010: 그 두 사람......\n이미 어딘가 멀리\n가버린 걸까?\n@c0@"
  sl: "@a@b%a002010：那两位……\n　　大概已经去了遥远的地方。\n@c0@"
  tl: "@a@b%a002010：那兩位……\n　　大概已經去了遙遠的地方。\n@c0@"
8:
  en: "@a%0%a002000@bYou hear that, %a000090? The mirror's in Moonmirror Tower!\n@c0@"
  ja: "@a@b%a002000「きいたか　%a000090！\n\tラーの鏡は　月鏡の塔に\n\tあるんだってよ！！\n@c0@"
  ko: "@a@b%a002000: 들었어 %a000090!?\n라의 거울은 달거울 탑에\n있다는군.\n@c0@"
  sl: "@a@b%a002000：听到了吗%a000090！\n　　太阳神镜在月镜之塔！！\n@c0@"
  tl: "@a@b%a002000：聽到了嗎%a000090！\n　　太陽神鏡在月鏡之塔！！\n@c0@"
9:
