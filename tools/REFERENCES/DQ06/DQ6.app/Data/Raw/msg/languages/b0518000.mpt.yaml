  sl: "@a@b%a002000：呃……\n　　月镜之塔在哪里？\n@c0@"
  tl: "@a@b%a002000：呃……\n　　月鏡之塔在哪裡？\n@c0@"
10:
  en: "@a%0%a002010@bThe mirror key, Moonmirror Tower and Ra's mirror... At last, everything is clear.\n@c0@"
  ja: "@a@b%a002010「鏡のカギ。　月鏡の塔。\n\tそして　ラーの鏡。\n\tやっと　すべてが　つながったわね。\n@c0@"
  ko: "@a@b%a002010: 거울의 열쇠, 달거울 탑.\n그리고 라의 거울.\n이제야 모든 게 이해돼.\n@c0@"
  sl: "@a@b%a002010：镜之钥。月镜之塔。\n　　还有太阳神镜。\n　　这下所有的线索都连起来了。\n@c0@"
  tl: "@a@b%a002010：鏡之鑰。月鏡之塔。\n　　還有太陽神鏡。\n　　這下所有的線索都連起來了。\n@c0@"
11:
  en: "@a%0%a002010@bRa's mirror is in Moonmirror Tower!\n@c0@"
  ja: "@a@b%a002010「ラーの鏡は\n\t月鏡の塔に！\n@c0@"
  ko: "@a@b%a002010: 라의 거울은\n달거울 탑에!\n@c0@"
  sl: "@a@b%a002010：太阳神镜一定在月镜之塔！\n@c0@"
  tl: "@a@b%a002010：太陽神鏡一定在月鏡之塔！\n@c0@"
12:
  en: "@a%0%a002010@bThe next step is to find the tower. Let's go!\n@c0@"
  ja: "@a@b%a002010「さあ　月鏡の塔を\n\tさがしに　いきましょう！\n@c0@"
  ko: "@a@b%a002010: 자, 달거울 탑을\n찾으러 가자!\n@c0@"
  sl: "@a@b%a002010：走吧，我们去找月镜之塔！\n@c0@"
  tl: "@a@b%a002010：走吧，我們去找月鏡之塔！\n@c0@"
13:
  en: "@a%0%a002000@b‘Adopt’, aye? You know what it means, %a000090? It's on the tip of my brain...\n@c0@"
  ja: "@a@b%a002000「ようし？\n\tオレも　よく　わからないぜ。\n\t%a000090　わかるか？\n@c0@"
  ko: "@a@b%a002000: 양자?\n나도 잘 모르겠군.\n%a000090, 너는 알아?\n@c0@"
  sl: "@a@b%a002000：养子？\n　　俺也不太明白。\n　　%a000090你知道不？\n@c0@"
  tl: "@a@b%a002000：養子？\n　　俺也不太明白。\n　　%a000090你知道不？\n@c0@"
14:
  en: "@a%0%a002010@bWe know they've left town, but where did they go? That's the key question...\n@c0@"
  ja: "@a@b%a002010「それに　しても\n\tジーナさんたちは　どこへ……？\n@c0@"
  ko: "@a@b%a002010: 그나저나\n지나 씨와 일리아 씨는 어디로......?\n@c0@"
  sl: "@a@b%a002010：话说回来，\n　　吉娜他们去哪里了……\n@c0@"
  tl: "@a@b%a002010：話說回來，\n　　吉娜他們去哪裡了……\n@c0@"
15:
  en: "@a%0%a002000@bYou'd think a gulp of that miracle water would work wonders on shot nerves.\n@c0@"
  ja: "@a@b%a002000「いくら　病気にきいても\n\tあの色じゃ　飲む気は\n\tしないもんな。\n@c0@"
  ko: "@a@b%a002000: 아무리 병에 좋다고 해도\n그런 색깔의 물은 아무도\n마시고 싶지 않겠지.\n@c0@"
  sl: "@a@b%a002000：再怎么能治病，\n　　变成那个颜色的水\n　　也没人敢喝吧。\n@c0@"
  tl: "@a@b%a002000：再怎麼能治病，\n　　變成那個顏色的水\n　　也沒人敢喝吧。\n@c0@"
16:
  en: "@a%0%a002010@bWell, at least the water will be clean and fresh from now on.\n@c0@"
  ja: "@a@b%a002010「大丈夫。\n\tこれからは　ずっと\n\t水は　きれいなままよ。\n@c0@"
  ko: "@a@b%a002010: 괜찮아.\n이제 강물이\n더럽혀질 일은 없어.\n@c0@"
  sl: "@a@b%a002010：不要紧。\n　　从今以后水会一直很清澈。\n@c0@"
  tl: "@a@b%a002010：不要緊。\n　　從今以後水會一直很清澈。\n@c0@"
17:
  en: "@a%0%a002000@b‘Back in the black’? Is that a good thing, %a000090?\n@c0@"
  ja: "@a@b%a002000「へへ。\n\tやる気が　出てきたようだな。\n@c0@"
  ko: "@a@b%a002000: 헤헤.\n이제 의욕이 나나 보군.\n@c0@"
  sl: "@a@b%a002000：嘿嘿。\n　　好像有了干劲了。\n@c0@"
  tl: "@a@b%a002000：嘿嘿。\n　　好像有了幹勁了。\n@c0@"
18:
  en: "@a%0%a002010@bIt's good to know things are getting back to normal here.\n@c0@"
  ja: "@a@b%a002010「がんばってね\n\t道具屋さん。\n@c0@"
  ko: "@a@b%a002010: 힘내세요.\n도구점 아저씨.\n@c0@"
  sl: "@a@b%a002010：加油啊，\n　　道具店老板。\n@c0@"
  tl: "@a@b%a002010：加油啊，\n　　道具店老闆。\n@c0@"
19:
  en: "@a%0%a002000@bWhat the—? First he was terrified, and now he's bouncin' off the walls. He needs a medium settin'.\n@c0@"
  ja: "@a@b%a002000「なんだよ。\n\tおそろしくても　うれしくても\n\tいちどは　悩むのかよ。\n@c0@"
  ko: "@a@b%a002000: 뭐야.\n무서워도 기뻐도\n일단 고민부터 하는군.\n@c0@"
  sl: "@a@b%a002000：啥意思嘛。\n　　害怕也好高兴也罢，\n　　你倒是激动一次啊。\n@c0@"
  tl: "@a@b%a002000：啥意思嘛。\n　　害怕也好高興也罷，\n　　你倒是激動一次啊。\n@c0@"
20:
  en: "@a%0%a002010@bNow he can sell his armour without any disturbances.\n@c0@"
  ja: "@a@b%a002010「もう　大丈夫よ\n\t防具屋さん。\n@c0@"
  ko: "@a@b%a002010: 이제 괜찮아요.\n방어구점 아저씨.\n@c0@"
  sl: "@a@b%a002010：防具店老板，\n　　已经没事了。\n@c0@"
  tl: "@a@b%a002010：防具店老闆，\n　　已經沒事了。\n@c0@"
21:
  en: "@a%0%a002000@bCrikey! Nothin' rattles this guy. We could use a fella like him.\n@c0@"
  ja: "@a@b%a002000「何が　あっても\n\t動じない…　ってか\n\tおっさん　大物だな！\n@c0@"
  ko: "@a@b%a002000: 무슨 일이 있어도\n동요하지 않아......?\n아저씨, 대범하군!\n@c0@"
