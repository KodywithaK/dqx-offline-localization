  sl: "@a@b%a002010：聊过之后，\n　　再考虑我们下一步该做什么。\n@c0@"
  tl: "@a@b%a002010：聊過之後，\n　　再考慮我們下一步該做什麼。\n@c0@"
30:
  en: "@a%0%a002000@bWhat does she mean, ‘how we got here’? We took the wagon over, and...\n@c0@"
  ja: "@a@b%a002000「なにを　いってんだ？\n\tどうやって　ここに　来たかって\n\tそりゃあ　馬車で……\n@c0@"
  ko: "@a@b%a002000: 뭐라는 거야?\n어떻게 여기에 왔냐고?\n그야 마차를 타고......\n@c0@"
  sl: "@a@b%a002000：在说什么啊？\n　　问俺们怎么来的，\n　　当然是马车啦……\n@c0@"
  tl: "@a@b%a002000：在說什麼啊？\n　　問俺們怎麼來的，\n　　當然是馬車啦……\n@c0@"
31:
  en: "@a%0%a002000@bWait! No! We fell asleep at the church, and then we wound up here!\n@c0@"
  ja: "@a@b%a002000「いや　ちがう！\n\t教会の　ベッドで　ねて\n\tおきたら　ここだったんだ！\n@c0@"
  ko: "@a@b%a002000: 아차차, 그게 아냐!\n성당의 침대에서 자고\n일어나니 여기였어!\n@c0@"
  sl: "@a@b%a002000：啊，不对！\n　　在教会的床上睡了一觉，\n　　然后就来这里了！\n@c0@"
  tl: "@a@b%a002000：啊，不對！\n　　在教會的床上睡了一覺，\n　　然後就來這裡了！\n@c0@"
32:
  en: "@a%0%a002010@bI suppose you could say we came to Amor...from Amor!\n@c0@"
  ja: "@a@b%a002010「そう。\n\tアモールから　アモールに\n\t来たことになるのね　私たち。\n@c0@"
  ko: "@a@b%a002010: 그래.\n아모르에서 아모르에\n온 거야, 우린.\n@c0@"
  sl: "@a@b%a002010：没错。\n　　我们是从一个爱摩尔\n　　来到了另一个爱摩尔。\n@c0@"
  tl: "@a@b%a002010：沒錯。\n　　我們是從一個愛摩爾\n　　來到了另一個愛摩爾。\n@c0@"
33:
