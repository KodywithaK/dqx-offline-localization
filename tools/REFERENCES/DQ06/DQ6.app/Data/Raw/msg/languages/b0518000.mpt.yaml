  sl: "@a@b%a002000：啥意思嘛。\n　　结果还是不能住。\n@c0@"
  tl: "@a@b%a002000：啥意思嘛。\n　　結果還是不能住。\n@c0@"
24:
  en: "@a%0%a002010@bOoh, a kindred spirit! Whenever I'm feeling happy, I start cleaning too.\n@c0@"
  ja: "@a@b%a002010「うれしいときに\n\tおそうじ　したくなることって\n\t私にも　あるわ。\n@c0@"
  ko: "@a@b%a002010: 기쁠 때\n청소하고 싶어지는 마음,\n나도 알 것 같아.\n@c0@"
  sl: "@a@b%a002010：喜庆的时候\n　　就想打扫卫生，\n　　我也是这样。\n@c0@"
  tl: "@a@b%a002010：喜慶的時候\n　　就想打掃衛生，\n　　我也是這樣。\n@c0@"
25:
  en: "@a%0%a002000@bThey ain't here, that much is for sure.\n@c0@"
  ja: "@a@b%a002000「もう　ふたりとも\n\tここには　いない　ってことか。\n@c0@"
  ko: "@a@b%a002000: 이제 둘 다\n여기에는 없다는 말이로군.\n@c0@"
  sl: "@a@b%a002000：他们两人\n　　已经不在这里了吧。\n@c0@"
  tl: "@a@b%a002000：他們兩人\n　　已經不在這裡了吧。\n@c0@"
26:
  en: "@a%0%a002010@bIlya and Evgenya have such a good relationship. I'm almost a little jealous!\n@c0@"
  ja: "@a@b%a002010「ジーナさんたち\n\t本当に　仲が　よかったわね。\n\tうらやましい。\n@c0@"
  ko: "@a@b%a002010: 지나 씨와 일리아 씨\n정말 사이가 좋았어.\n부러워.\n@c0@"
  sl: "@a@b%a002010：吉娜他们\n　　关系真的很亲密。\n　　好羡慕啊。\n@c0@"
  tl: "@a@b%a002010：吉娜他們\n　　關係真的很親密。\n　　好羡慕啊。\n@c0@"
27:
  en: "@a%0%a002000@bAh, so they did pay one more visit to Amor before shovin' off.\n@c0@"
  ja: "@a@b%a002000「やっぱり　いちどは\n\tアモールに　もどっているんだな。\n@c0@"
  ko: "@a@b%a002000: 역시 일단은\n아모르에 돌아왔구나.\n@c0@"
  sl: "@a@b%a002000：他们果然回来过\n　　爱摩尔一趟啊。\n@c0@"
  tl: "@a@b%a002000：他們果然回來過\n　　愛摩爾一趟啊。\n@c0@"
28:
  en: "@a%0%a002010@bWhy don't we have a word with the villagers before we move on?\n@c0@"
  ja: "@a@b%a002010「もう　少し\n\t町の人たちから\n\t話を　聞いてみましょうか。\n@c0@"
  ko: "@a@b%a002010: 마을 사람들한테\n좀 더 이야기를\n들어보자.\n@c0@"
  sl: "@a@b%a002010：我们再跟镇上的人\n　　聊一聊吧。\n@c0@"
  tl: "@a@b%a002010：我們再跟鎮上的人\n　　聊一聊吧。\n@c0@"
29:
  en: "@a%0%a002010@bOnce we've heard all that they have to say, we can decide on what to do next.\n@c0@"
  ja: "@a@b%a002010「それから　この先\n\t私たちが　なにを　すべきか\n\t考えましょう。\n@c0@"
