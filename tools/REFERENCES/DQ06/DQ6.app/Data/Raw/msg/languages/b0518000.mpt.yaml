  tl: "@a@b%a002000：無論發生什麼\n　　都不為所動，\n　　這大叔是條漢子！\n@c0@"
22:
  en: "@a%0%a002010@bWell, he's rather blunt... I hope his weapons aren't! Hee hee.\n@c0@"
  ja: "@a@b%a002010「いい　性格ね\n\t武器屋さん。\n@c0@"
  ko: "@a@b%a002010: 성격 참 좋아.\n무기점 아저씨.\n@c0@"
  sl: "@a@b%a002010：武器店老板性格真不错。\n@c0@"
  tl: "@a@b%a002010：武器店老闆性格真不錯。\n@c0@"
23:
  en: "@a%0%a002000@bSo, uh, we still can't stay the night?\n@c0@"
  ja: "@a@b%a002000「なんだよ。\n\tけっきょく　泊めて\n\tくれないのかよ。\n@c0@"
