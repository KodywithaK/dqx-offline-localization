  ja: "@a@b%a002010「上の世界でも　下の世界でも\n\t私たちのウワサは　流れてるみたいね。\n@c0@"
  ko: "@a@b%a002010: 위쪽 세계나 아래쪽 세계나\n우리 소문이 자자한가 봐.\n@c0@"
  sl: "@a@b%a002010：无论是上面的世界还是\n　　下面的世界，似乎都在流传着我们的传闻呢。\n@c0@"
