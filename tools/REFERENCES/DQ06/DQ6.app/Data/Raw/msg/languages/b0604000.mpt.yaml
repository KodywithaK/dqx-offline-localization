0:
  en: "@a%0%a002000@bWhoa! These tales are travellin' faster than us.\n@c0@"
  ja: "@a@b%a002000「おっ！　ウワサは　ここまで\n\t届いてるみたいだぜ。\n@c0@"
  ko: "@a@b%a002000: 오옷! 소문이 여기까지\n퍼진 모양이군.\n@c0@"
