  ja: "@a@b%a002030「ナゾを　ひとつ　とくと\n\tまた　新しい　ナゾが　あらわれる。\n\tそれが　ナゾと　いうものなのです。\n@c0@"
  ko: "@a@b%a002030: 수수께끼를 하나 풀면\n또 새로운 수수께끼가 나타납니다.\n그것이 수수께끼라는 것이지요.\n@c0@"
  sl: "@a@b%a002030：解开一个谜团，\n　　就会诞生新的谜团。\n　　所谓的谜团就是这么回事。\n@c0@"
  tl: "@a@b%a002030：解開一個謎團，\n　　就會誕生新的謎團。\n　　所謂的謎團就是這麼回事。\n@c0@"
