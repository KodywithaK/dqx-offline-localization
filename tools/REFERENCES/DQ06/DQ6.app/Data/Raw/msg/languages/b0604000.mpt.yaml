  tl: "@a@b%a002000：說起來是不是\n　　有個傢伙搬岩石\n　　搬了３０年來著？\n@c0@"
192:
  en: "@a%0%a002010@bThe very existence of this dream world is probably the main mystery, eh?\n@c0@"
  ja: "@a@b%a002010「この　上の世界が\n\tあることからして　ナゾだわよね。\n@c0@"
  ko: "@a@b%a002010: 위쪽 세계라는 게\n있다는 것 자체가 수수께끼야.\n@c0@"
