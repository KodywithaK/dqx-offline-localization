  en: "@aOva@bNow thanks again, we'll see you when the harp calls from afar...\n㈡\nMay fame and fortune follow you no matter where you are!\n@c0@"
  ja: "@a@bディーナ「みなさん。\n\t本当に　ありがとうございました。\n\tどうか　お気をつけて……。\n@c0@"
  ko: "@a@b디나: 여러분.\n정말 고맙습니다.\n부디 몸조심하시길......\n@c0@"
  sl: "@a@b蒂娜：各位。\n　　真的太感谢了。\n　　请万事小心……\n@c0@"
  tl: "@a@b蒂娜：各位。\n　　真的太感謝了。\n　　請萬事小心……\n@c0@"
