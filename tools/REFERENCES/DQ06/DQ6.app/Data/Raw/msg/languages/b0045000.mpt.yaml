  tl: "@a@b%a002020：婆婆一定能\n　　為我們占卜出\n　　我們的目的地。\n@c0@"
104:
  en: "@a%0%a002000@b...Though if we just wander aimlessly round the ocean, we'll end up gettin' lost.\n@c0@"
  ja: "@a@b%a002000「とはいっても　さすがに\n\tこの広い海の中を　あてもないまま\n\t動き回ったら　迷っちまいそうだな。\n@c0@"
  ko: "@a@b%a002000: 하지만 역시\n이 넓은 바닷속을 정처 없이\n떠돌다 보면 길을 잃을 것만 같군.\n@c0@"
  sl: "@a@b%a002000：话虽如此，在这么大的\n　　海里面漫无目的地转来转去，\n　　会迷路的啊。\n@c0@"
  tl: "@a@b%a002000：話雖如此，在這麼大的\n　　海裡面漫無目的地轉來轉去，\n　　會迷路的啊。\n@c0@"
105:
  en: "@a%0%a002000@bWell, if it comes to that, we can always pay a little visit to everybody's favourite dream seer.\n@c0@"
