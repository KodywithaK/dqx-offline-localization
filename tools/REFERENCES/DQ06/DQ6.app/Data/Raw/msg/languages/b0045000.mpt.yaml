  ko: "@a@b디나: 행선지를 잃어 버렸을 때는\n육지의 해몽가에게 새로운 길을\n알려 달라고 하면 될 거예요.\n@c0@"
  sl: "@a@b蒂娜：你们迷失了方向的话，\n　　就去找陆地上的占梦师，\n　　请她为你们指明方向吧。\n@c0@"
  tl: "@a@b蒂娜：你們迷失了方向的話，\n　　就去找陸地上的占夢師，\n　　請她為你們指明方向吧。\n@c0@"
