107:
  en: "@a%0%a002050@bOld %a002050 was always taught not to be too proud to ask for advice...\n@c0@"
  ja: "@a@b%a002050「高名な　占い師さんですし\n\tきっと　いいアドバイスを\n\tくださるんじゃ　ないですかね？\n@c0@"
  ko: "@a@b%a002050: 유명한 점술가이기도 하니,\n분명 좋은 조언을\n주시지 않을까요?\n@c0@"
