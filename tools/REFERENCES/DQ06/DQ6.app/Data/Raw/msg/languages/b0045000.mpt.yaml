  ko: "@a@b%a002010: 또 하나의 새로운 세계가\n우리 앞에 펼쳐진 거야.\n@c0@"
  sl: "@a@b%a002010：又有崭新的世界\n　　向我们敞开了呢。\n@c0@"
  tl: "@a@b%a002010：又有嶄新的世界\n　　向我們敞開了呢。\n@c0@"
98:
  en: "@a%0%a002010@bIf we're ever unsure of how to proceed, it's worth paying Madame Luca a little visit.\n@c0@"
  ja: "@a@b%a002010「もし　道に迷ったら\n\tいちど　グランマーズの館へ\n\t寄ってみましょう。\n@c0@"
  ko: "@a@b%a002010: 혹시 길을 잃으면\n일단 그랜마즈의 저택에\n들러 보자.\n@c0@"
  sl: "@a@b%a002010：要是迷路了的话，\n　　就去一趟\n　　玛兹婆婆之馆吧。\n@c0@"
  tl: "@a@b%a002010：要是迷路了的話，\n　　就去一趟\n　　瑪茲婆婆之館吧。\n@c0@"
99:
  en: "@a%0%a002010@bShe can see where our fate lies in the crystal, and offer us guidance.\n@c0@"
  ja: "@a@b%a002010「おばあちゃんなら\n\tきっと　私たちが　行くべき場所を\n\t占ってくれるはずよ。\n@c0@"
  ko: "@a@b%a002010: 할머니라면\n틀림없이 우리가 가야 할 곳을\n점쳐 주실 거야.\n@c0@"
  sl: "@a@b%a002010：婆婆一定能\n　　为我们占卜出\n　　我们该去的地方。\n@c0@"
  tl: "@a@b%a002010：婆婆一定能\n　　為我們占卜出\n　　我們該去的地方。\n@c0@"
100:
  en: "@a%0%a002030@bIf we are unsure how to proceed, I think it wise to repair to Madame Luca's home.\n@c0@"
  ja: "@a@b%a002030「もし　道に迷ったら\n\tグランマーズさんのところへ\n\t寄ってみませんか？\n@c0@"
  ko: "@a@b%a002030: 혹시 길을 잃으면\n그랜마즈 님이 계신 곳에\n들러 볼까요?\n@c0@"
  sl: "@a@b%a002030：要是迷路了的话，\n　　要不要去一趟\n　　玛兹婆婆之馆？\n@c0@"
  tl: "@a@b%a002030：要是迷路了的話，\n　　要不要去一趟\n　　瑪茲婆婆之館？\n@c0@"
101:
  en: "@a%0%a002030@bThe Goddess has gifted her with the power to point us in the right direction.\n@c0@"
  ja: "@a@b%a002030「あのかたなら\n\tわれわれの　行くべき場所を\n\t指し示してくださると　思います。\n@c0@"
  ko: "@a@b%a002030: 그분이라면\n우리가 가야 할 곳을\n알려 주시리라 생각합니다.\n@c0@"
  sl: "@a@b%a002030：她一定能\n　　为我们指出\n　　我们应该去的地方。\n@c0@"
  tl: "@a@b%a002030：她一定能\n　　為我們指出\n　　我們應該去的地方。\n@c0@"
102:
  en: "@a%0%a002020@bYou know, if we're ever really lost, we can always head back to Madame Luca's.\n@c0@"
