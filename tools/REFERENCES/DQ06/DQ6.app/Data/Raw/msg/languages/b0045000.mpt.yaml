  tl: "@a@b%a002050：那麼有名的占夢師，\n　　一定能給我們\n　　提出好建議吧？\n@c0@"
108:
  en: "@a@bOva's sing-song voice emanates from the harp...\n@c0@"
  ja: "@a@bマーメイドハープから\nディーナの声が　聞こえてきた……。\n@c0@"
  ko: "@a@b인어의 하프로부터\n디나의 목소리가 들려 왔다......\n@c0@"
  sl: "@a@b从人鱼竖琴里\n传来蒂娜的声音……\n@c0@"
  tl: "@a@b從人魚豎琴裡\n傳來蒂娜的聲音……\n@c0@"
109:
  en: "@aOva@bThe harp you hold will take you down far, far beneath the sea...\n㈡\nBut do not plunge without a plan, no, listen carefully.\n@c0@"
  ja: "@a@bディーナ「おっしゃる通り　このハープは\n\tあなたがたを　海の世界へと導きます。\n\tですが　もし……\n@c0@"
