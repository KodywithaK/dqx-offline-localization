106:
  en: "@a%0%a002050@bNow I come to think of it, we can pay a visit to Madame Luca's place if we ever get ourselves lost.\n@c0@"
  ja: "@a@b%a002050「あ　そうそう　道に迷ったら\n\t夢占い師の　グランマーズさんを\n\tたずねてみましょうよ。\n@c0@"
  ko: "@a@b%a002050: 아참, 길을 잃으면\n해몽가인 그랜마즈 님을\n찾아가도록 하죠.\n@c0@"
