66:
  en: "@a%0%a002000@bSeems like a fun joint now, but I bet you'd get sick of it soon enough.\n@c0@"
  ja: "@a@b%a002000「どんな　楽しいことも\n\tずっと　やってりゃ\n\tあきると　思うけどな。\n@c0@"
