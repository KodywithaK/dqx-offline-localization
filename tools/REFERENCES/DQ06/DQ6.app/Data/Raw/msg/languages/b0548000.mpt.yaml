  tl: "@a@b%a002010：這個人\n　　也和其他人一樣……\n　　對幸福國深信不疑呢。\n@c0@"
73:
  en: "@a%0%a002020@bIn a way, the Isle o' Smiles is even creepier than Murdaw... At least it was obvious he was evil.\n@c0@"
