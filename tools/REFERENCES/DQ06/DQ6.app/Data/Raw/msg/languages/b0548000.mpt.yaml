  ko: "@a@b%a002050: 먹고 마시는 게 공짜라구요?\n어디 사는 누가 그런 돈을\n내고 있는지 어서 알고 싶군요.\n@c0@"
  sl: "@a@b%a002050：免费吃喝啊。\n　　真想快点知道是谁\n　　付了这笔钱。\n@c0@"
  tl: "@a@b%a002050：免費吃喝啊。\n　　真想快點知道是誰\n　　付了這筆錢。\n@c0@"
71:
