  tl: "@a@b%a002020：從某種意義上來說，\n　　幸福國比姆多更可怕……\n@c0@"
74:
  en: "@a%0%a002030@bIt seems everyone on board has truly thrown caution to the wind.\n@c0@"
  ja: "@a@b%a002030「ふつうの考えは\n\tもう　ここに　いる人たちには\n\t通用しないのでしょうね。\n@c0@"
