  sl: "@a@b%a002010：唉，现在说这话，\n　　估计也听不进去了吧。\n@c0@"
  tl: "@a@b%a002010：唉，現在說這話，\n　　估計也聽不進去了吧。\n@c0@"
79:
  en: "@a%0%a002020@bBut growing old is good. I mean, it's part of life.\n@c0@"
