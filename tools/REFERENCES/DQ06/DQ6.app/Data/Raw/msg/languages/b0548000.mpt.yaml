  sl: "@a@b%a002000：不管多有趣的事情，\n　　一直做的话\n　　也会腻的吧。\n@c0@"
  tl: "@a@b%a002000：不管多有趣的事情，\n　　一直做的話\n　　也會膩的吧。\n@c0@"
67:
  en: "@a%0%a002010@bThe buffet is keeping people from asking questions, such as who made the Isle o' Smiles and why...\n@c0@"
