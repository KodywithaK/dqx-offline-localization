0:
  en: "@a%0%a002000@bCrikey! What's this now? That thing really does move!?\n@c0@"
  ja: "@a@b%a002000「うひゃあ　なんだ　こりゃ！\n\tこれが　ホントに　動くのかよ！\n@c0@"
  ko: "@a@b%a002000: 으앗~ 이게 뭐야!\n진짜 움직이는 거냐!\n@c0@"
  sl: "@a@b%a002000：哎呀，怎么回事啊！\n　　这玩意还真的会动啊！\n@c0@"
  tl: "@a@b%a002000：哎呀，怎麼回事啊！\n　　這玩意還真的會動啊！\n@c0@"
1:
  en: "@a%0%a002010@bLook %a000090, there's someone waiting on the bridge.\n@c0@"
  ja: "@a@b%a002010「橋の　向こうがわに\n\tだれか　いるわ。\n@c0@"
  ko: "@a@b%a002010: 다리 건너편에\n누가 있어.\n@c0@"
  sl: "@a@b%a002010：桥那边\n　　好像有人在那里。\n@c0@"
  tl: "@a@b%a002010：橋那邊\n　　好像有人在那裡。\n@c0@"
2:
  en: "@a%0%a002020@bWow. Why do I have a bad feeling about this?\n@c0@"
  ja: "@a@b%a002020「なーんか　いやな予感が\n\tする……。\n@c0@"
  ko: "@a@b%a002020: 왠지 안 좋은 예감이\n들어......\n@c0@"
  sl: "@a@b%a002020：好像有不好的预感……\n@c0@"
  tl: "@a@b%a002020：好像有不好的預感……\n@c0@"
3:
  en: "@a%0%a002030@bI presume they won't suddenly attack us if we try and speak with them?\n@c0@"
  ja: "@a@b%a002030「話しかけたら\n\tいきなり　おそいかかってくる……\n\tなんてことは　ないですよね。\n@c0@"
  ko: "@a@b%a002030: 말을 걸면\n갑자기 달려든다거나......\n그런 일은 없겠지요.\n@c0@"
  sl: "@a@b%a002030：要是跟他说话……\n　　他应该不会突然\n　　就袭击我们吧。\n@c0@"
  tl: "@a@b%a002030：要是跟他說話……\n　　他應該不會突然\n　　就襲擊我們吧。\n@c0@"
4:
  en: "@a%0%a002050@bLet's get on board! Err...can you say that about an island?\n@c0@"
  ja: "@a@b%a002050「とにかく　乗船しましょう。\n\tあ　島だから　上陸か……。\n@c0@"
  ko: "@a@b%a002050: 어쨌든 승선해 봅시다.\n앗, 섬이니까 상륙하자고 해야 하나......\n@c0@"
  sl: "@a@b%a002050：总之先上船吧。\n　　啊，既然是座岛，应该说上岸……\n@c0@"
  tl: "@a@b%a002050：總之先上船吧。\n　　啊，既然是座島，應該說上岸……\n@c0@"
5:
  en: "@a%0%a002000@bHuh. So this is it, aye?\n@c0@"
  ja: "@a@b%a002000「へえ…　こんなふうに\n\tなってるのか　へえ……。\n@c0@"
  ko: "@a@b%a002000: 호오... 이런 구조로\n되어 있군. 호오......\n@c0@"
  sl: "@a@b%a002000：哦，是这么回事啊……\n@c0@"
  tl: "@a@b%a002000：哦，是這麼回事啊……\n@c0@"
6:
  en: "@a%0%a002010@bOh my, it's wobbly. It really is riding the waves.\n@c0@"
  ja: "@a@b%a002010「少し　ゆれてるわ。\n\tホントに　海の上に\n\t浮いてるのね。\n@c0@"
  ko: "@a@b%a002010: 조금 흔들리는걸.\n정말 바다 위에\n떠 있나 봐.\n@c0@"
  sl: "@a@b%a002010：有点摇晃啊。\n　　真的是浮在海面上呢。\n@c0@"
  tl: "@a@b%a002010：有點搖晃啊。\n　　真的是浮在海面上呢。\n@c0@"
7:
  en: "@a%0%a002020@bHey... Is it just me, or is that big-shot over there giving us the eye?\n@c0@"
  ja: "@a@b%a002020「あの　えらそうな人\n\tずっと　こっちを　見てるね。\n@c0@"
  ko: "@a@b%a002020: 저 높아 보이는 사람\n계속 이쪽을 보고 있어.\n@c0@"
  sl: "@a@b%a002020：那个看上去很了不起的人，\n　　一直在看这边呢。\n@c0@"
  tl: "@a@b%a002020：那個看上去很了不起的人，\n　　一直在看這邊呢。\n@c0@"
8:
  en: "@a%0%a002030@bLet's speak to the crewman, shall we?\n@c0@"
  ja: "@a@b%a002030「そろそろ　船員に\n\t声かけましょうか。\n@c0@"
  ko: "@a@b%a002030: 선원들에게도\n말을 걸어 보죠.\n@c0@"
  sl: "@a@b%a002030：准备好了的话，\n　　就去跟船员说一声吧。\n@c0@"
  tl: "@a@b%a002030：準備好了的話，\n　　就去跟船員說一聲吧。\n@c0@"
9:
  en: "@a%0%a002050@bIt's not too late to go back over the bridge if we need to.\n@c0@"
  ja: "@a@b%a002050「%a000090さん　今なら　まだ\n\t橋をわたって　引きかえすことも\n\tできる　ようですよ。\n@c0@"
  ko: "@a@b%a002050: %a000090 님, 아직은\n다리를 건너면 내릴 수도\n있을 것 같습니다.\n@c0@"
  sl: "@a@b%a002050：%a000090，\n　　现在好像还能\n　　走那座桥回去哦。\n@c0@"
  tl: "@a@b%a002050：%a000090，\n　　現在好像還能\n　　走那座橋回去哦。\n@c0@"
10:
  en: "@a%0%a002000@bNo turnin' back now, aye? That's that.\n@c0@"
  ja: "@a@b%a002000「もう　あともどりは\n\tできないな。\n@c0@"
  ko: "@a@b%a002000: 이제 돌아갈 수\n없게 되었군.\n@c0@"
  sl: "@a@b%a002000：已经回不了头了啊。\n@c0@"
  tl: "@a@b%a002000：已經回不了頭了啊。\n@c0@"
11:
  en: "@a%0%a002010@bWe don't want to raise suspicions. Let's at least pretend to go along with what they're saying.\n@c0@"
  ja: "@a@b%a002010「あやしまれないよう\n\tとうぶん　彼らの　いいなりに\n\tなってるフリを　しましょうか。\n@c0@"
  ko: "@a@b%a002010: 의심받지 않도록\n당분간은 저들이 하라는 대로\n행동하자구.\n@c0@"
  sl: "@a@b%a002010：眼下我们就装作\n　　听他们的话吧，\n　　别被他们怀疑了。\n@c0@"
  tl: "@a@b%a002010：眼下我們就裝作\n　　聽他們的話吧，\n　　別被他們懷疑了。\n@c0@"
12:
  en: "@a%0%a002020@bI'd like this floating island a lot more if the Isle o' Smiles people weren't so creepy.\n@c0@"
  ja: "@a@b%a002020「しあわせの国の人は\n\tあやしいけど　この島は\n\t面白いわね。\n@c0@"
  ko: "@a@b%a002020: 행복의 나라 사람들은\n수상하지만 이 섬은\n재밌네.\n@c0@"
  sl: "@a@b%a002020：虽然\n　　幸福国的人很可疑，\n　　这岛倒是很好玩呢。\n@c0@"
  tl: "@a@b%a002020：雖然\n　　幸福國的人很可疑，\n　　這島倒是很好玩呢。\n@c0@"
13:
  en: "@a%0%a002030@bI hear sounds of revelry coming from beyond that entrance over there.\n@c0@"
  ja: "@a@b%a002030「奥の建物から\n\tにぎやかな　人の声が\n\t聞こえてきますね。\n@c0@"
  ko: "@a@b%a002030: 안쪽 건물에서\n사람들의 떠들썩한 목소리가\n들려옵니다.\n@c0@"
  sl: "@a@b%a002030：我听到里面\n　　那座建筑中\n　　人声鼎沸呢。\n@c0@"
  tl: "@a@b%a002030：我聽到裡面\n　　那座建築中\n　　人聲鼎沸呢。\n@c0@"
14:
  en: "@a%0%a002050@bHow do you get an island to move!? This is all a bit above old %a002050's head...\n@c0@"
  ja: "@a@b%a002050「この島　いったい\n\tどういう　しかけで\n\t動いているんでしょうかね。\n@c0@"
  ko: "@a@b%a002050: 이 섬은 대체\n무슨 장치가 있길래\n움직이는 걸까요?\n@c0@"
  sl: "@a@b%a002050：这座岛的构造\n　　到底是怎样，\n　　才能被驱动的啊？\n@c0@"
  tl: "@a@b%a002050：這座島的構造\n　　到底是怎樣，\n　　才能被驅動的啊？\n@c0@"
15:
  en: "@a%0%a002000@bBlah, blah, blah. Pass me the shovel, %a000090.\n@c0@"
  ja: "@a@b%a002000「正しい　せんたくだの\n\t明るい未来だの……\n\tいちいち　うさんくさいな。\n@c0@"
  ko: "@a@b%a002000: 올바른 선택이라는 둥\n밝은 미래라는 둥......\n모든 게 수상하군.\n@c0@"
  sl: "@a@b%a002000：什么明智的选择，\n　　什么似锦前程……\n　　越听越可疑啊。\n@c0@"
  tl: "@a@b%a002000：什麼明智的選擇，\n　　什麼似錦前程……\n　　越聽越可疑啊。\n@c0@"
16:
  en: "@a%0%a002010@bWhere are all the people from Aridea...?\n@c0@"
  ja: "@a@b%a002010「町にいた　人たちは\n\tどこかしら……。\n@c0@"
  ko: "@a@b%a002010: 마을에 있던 사람들은\n어디에 있지......\n@c0@"
  sl: "@a@b%a002010：镇上的人们\n　　在哪里呢……\n@c0@"
  tl: "@a@b%a002010：鎮上的人們\n　　在哪裡呢……\n@c0@"
17:
  en: "@a%0%a002020@bThe crewman...? Wait, someone drives this thing?\n@c0@"
  ja: "@a@b%a002020「島なのに　船員が\n\t動かすのね。\n@c0@"
  ko: "@a@b%a002020: 섬인데도 선원이\n조종해서 움직이나 보구나.\n@c0@"
  sl: "@a@b%a002020：明明是座岛，\n　　船员却能开动它呢。\n@c0@"
  tl: "@a@b%a002020：明明是座島，\n　　船員卻能開動它呢。\n@c0@"
18:
  en: "@a%0%a002030@bJust who are these people?\n@c0@"
  ja: "@a@b%a002030「いったい\n\t何者なんでしょうね。\n@c0@"
  ko: "@a@b%a002030: 대체\n정체가 뭘까요?\n@c0@"
  sl: "@a@b%a002030：到底是何方神圣啊。\n@c0@"
  tl: "@a@b%a002030：到底是何方神聖啊。\n@c0@"
19:
  en: "@a%0%a002050@b%0%a000090, if we want to head back, we'd better do it sharpish.\n@c0@"
  ja: "@a@b%a002050「%a000090さん\n\t引きかえすなら\n\t今のうちですよ……。\n@c0@"
  ko: "@a@b%a002050: %a000090 님,\n돌아가려면\n지금밖에 없습니다......\n@c0@"
  sl: "@a@b%a002050：%a000090，\n　　要想回去的话\n　　就趁现在……\n@c0@"
  tl: "@a@b%a002050：%a000090，\n　　要想回去的話\n　　就趁現在……\n@c0@"
20:
  en: "@a%0%a002000@bI reckon we ain't allowed in that building until they shove off.\n@c0@"
  ja: "@a@b%a002000「出発するまで\n\t建物の中には　入れて\n\tくれないらしいな。\n@c0@"
  ko: "@a@b%a002000: 출발할 때까지\n건물 안으로는\n들여보내지 않는 모양이군.\n@c0@"
  sl: "@a@b%a002000：好像在出发之前，\n　　不让咱进那座建筑呢。\n@c0@"
  tl: "@a@b%a002000：好像在出發之前，\n　　不讓咱進那座建築呢。\n@c0@"
21:
  en: "@a%0%a002010@bWell %a000090, are you ready to smile? Let's go!\n@c0@"
  ja: "@a@b%a002010「うふふ。\n\tそれじゃ　私たちも　しあわせに\n\tしてもらいに　行きましょう。\n@c0@"
  ko: "@a@b%a002010: 우후후.\n그럼 우리도 행복해지러\n가 보자구.\n@c0@"
  sl: "@a@b%a002010：呵呵。\n　　我们也去获得幸福吧。\n@c0@"
  tl: "@a@b%a002010：呵呵。\n　　我們也去獲得幸福吧。\n@c0@"
22:
  en: "@a%0%a002020@bWe've come too far to chicken out now. Let's go tell that crewman to set sail or whatever.\n@c0@"
  ja: "@a@b%a002020「もう　ここまできたら\n\t先へ　進むしか　ないわね。\n\t船員に　声をかけましょう。\n@c0@"
  ko: "@a@b%a002020: 여기까지 온 이상\n가 보는 수밖에 없어.\n선원에게 말을 걸어 보자.\n@c0@"
  sl: "@a@b%a002020：都已经走到这一步了，\n　　只有继续走下去了吧。\n　　去跟船员说一声吧。\n@c0@"
  tl: "@a@b%a002020：都已經走到這一步了，\n　　只有繼續走下去了吧。\n　　去跟船員說一聲吧。\n@c0@"
23:
  en: "@a%0%a002030@bI would imagine the townsfolk are ensconced inside.\n@c0@"
  ja: "@a@b%a002030「町の人は　おそらく\n\tこの　建物の中ですね……。\n@c0@"
  ko: "@a@b%a002030: 마을 사람들은 아마도\n이 건물 안에 있겠군요......\n@c0@"
  sl: "@a@b%a002030：镇上的人估计\n　　是在这座建筑里……\n@c0@"
  tl: "@a@b%a002030：鎮上的人估計\n　　是在這座建築裡……\n@c0@"
24:
  en: "@a%0%a002050@b%0%a000090, if you want to go back, we can still cross the jetty to dry land...\n@c0@"
  ja: "@a@b%a002050「%a000090さん　今なら\n\tまだ　さんばしから\n\t引きかえせますよ……。\n@c0@"
  ko: "@a@b%a002050: %a000090 님, 지금이라면\n부두를 통해\n돌아갈 수 있습니다......\n@c0@"
  sl: "@a@b%a002050：%a000090，\n　　现在的话还能\n　　走栈桥回去哦……\n@c0@"
  tl: "@a@b%a002050：%a000090，\n　　現在的話還能\n　　走棧橋回去哦……\n@c0@"
25:
  en: "@a%0%a002000@bAhoy! This thing actually sails!\n@c0@"
  ja: "@a@b%a002000「うおお！\n\t本当に　動き出したぜ！\n@c0@"
  ko: "@a@b%a002000: 우와앗!\n진짜 움직이기 시작했어!\n@c0@"
  sl: "@a@b%a002000：哦哦！\n　　真的动起来了！\n@c0@"
  tl: "@a@b%a002000：哦哦！\n　　真的動起來了！\n@c0@"
26:
  en: "@a%0%a002010@bAt last, we're off to the Isle o' Smiles!\n@c0@"
  ja: "@a@b%a002010「いよいよ\n\tしあわせの国に　向けて\n\t出発ね。\n@c0@"
  ko: "@a@b%a002010: 드디어\n행복의 나라를 향해\n출발했네.\n@c0@"
  sl: "@a@b%a002010：终于出发\n　　前往幸福国了。\n@c0@"
  tl: "@a@b%a002010：終於出發\n　　前往幸福國了。\n@c0@"
27:
  en: "@a%0%a002020@bI'm pretty used to sailing on the Providence now, but will my sea legs work on a floating island?\n@c0@"
  ja: "@a@b%a002020「神の船には　なれたけど\n\t島の　ゆれは　どうかなあ……。\n@c0@"
  ko: "@a@b%a002020: 신의 배에는 익숙해졌는데\n섬이 흔들릴 땐 어떨려나......\n@c0@"
  sl: "@a@b%a002020：虽然已经习惯了神之船，\n　　但是岛这么摇晃……\n@c0@"
  tl: "@a@b%a002020：雖然已經習慣了神之船，\n　　但是島這麼搖晃……\n@c0@"
28:
  en: "@a%0%a002030@bI can feel the island swaying. I hope none of us suffers from motion sickness.\n@c0@"
  ja: "@a@b%a002030「ちょっと　ゆれてますね。\n\tみなさん　乗り物酔いに\n\t気をつけて。\n@c0@"
  ko: "@a@b%a002030: 조금 흔들리는군요.\n여러분, 멀미\n조심하십시오.\n@c0@"
  sl: "@a@b%a002030：有点摇晃呢。\n　　大家要注意，\n　　不要晕了啊。\n@c0@"
  tl: "@a@b%a002030：有點搖晃呢。\n　　大家要注意，\n　　不要暈了啊。\n@c0@"
29:
  en: "@a%0%a002050@bCome on! Old %a002050 is ready for anythin'!\n@c0@"
  ja: "@a@b%a002050「もう　ヤリでも　鉄砲でも\n\tしあわせでも　不幸でも\n\t何でも　持ってこい！です。\n@c0@"
  ko: "@a@b%a002050: 이렇게 된 이상\n수단과 방법을 가리지 않고\n부딪쳐 보는 수밖에요!\n@c0@"
  sl: "@a@b%a002050：兵来将挡，\n　　水来土掩！\n@c0@"
  tl: "@a@b%a002050：兵來將擋，\n　　水來土掩！\n@c0@"
30:
  en: "@a%0%a002000@bCold feet, %a000090? Looks like we can still get off if you want.\n@c0@"
  ja: "@a@b%a002000「なんだ　そうなのか。\n\t%a000090　今なら　いったん\n\tおりても　いいってさ。\n@c0@"
  ko: "@a@b%a002000: 뭐야, 그런 거야?\n%a000090, 일단\n내렸다가 다시 타도 된다는군.\n@c0@"
  sl: "@a@b%a002000：这样啊。\n　　%a000090，现在的话\n　　还可以从岛上下去。　\n@c0@"
  tl: "@a@b%a002000：這樣啊。\n　　%a000090，現在的話\n　　還可以從島上下去。　\n@c0@"
31:
  en: "@a%0%a002010@bWho knows what awaits us from here on out, %a000090. I suggest we make any necessary preparations now.\n@c0@"
  ja: "@a@b%a002010「この先は　どうなるか\n\tまったく　わからないから\n\t準備を　するなら　今のうちね。\n@c0@"
  ko: "@a@b%a002010: 앞으로 어떻게 될지\n전혀 알 수가 없으니\n준비하려면 지금밖에 없어.\n@c0@"
  sl: "@a@b%a002010：完全不知道\n　　接下来会发生什么事呢。\n　　要做准备的话就趁现在。\n@c0@"
  tl: "@a@b%a002010：完全不知道\n　　接下來會發生什麼事呢。\n　　要做準備的話就趁現在。\n@c0@"
32:
  en: "@a%0%a002020@bI don't know about you, but I'm good to go.\n@c0@"
  ja: "@a@b%a002020「うーん。\n\tとくに　もう　必要なものは\n\tなかったと　思うけどな。\n@c0@"
  ko: "@a@b%a002020: 으음~\n딱히 필요한 건 더\n없었던 것 같은데.\n@c0@"
