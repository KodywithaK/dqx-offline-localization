  tl: "@a@b＊：什麼，\n　　想不記錄就休息嗎……\n@c0@"
12:
  en: "@a@b*: You would have to restart your adventure from the time of your last confession. Are you sure this is what you want?\n@c0@"
  ja: "@a@b＊「では　そなたの冒険が\n\t前の記録まで　もどっても\n\tよろしいのじゃな？\n@c0@"
  ko: "@a@b*: 그럼 그대의 모험이\n이전 기록으로 되돌아가는데\n그래도 괜찮겠나?\n@c0@"
