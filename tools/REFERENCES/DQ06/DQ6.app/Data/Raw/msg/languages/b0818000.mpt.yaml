  tl: "@a@b＊：那冒險就會\n　　回到上次記錄。\n　　這樣沒問題嗎？\n@c0@"
13:
  en: "@a@b*: O great and compassionate Goddess, please grant this child a peaceful respite!\n@c0@"
  ja: "@a@b＊「おお　神よ！\n\tこの者に　ひとときの\n\t休息を　あたえたまえ。\n@c0@"
