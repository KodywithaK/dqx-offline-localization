0:
  en: "@a@b*: All living creatures are children of the Goddess. What brings you to our church, child?\n@c0@"
  ja: "@a@b＊「生きとし生けるものは\n\tみな　神の子。\n\tわが教会に　どんな　ご用かな？\n@c0@"
  ko: "@a@b*: 이 세상에 살아 있는 모든 생명은\n신의 자식.\n우리 성당에는 무슨 일이신가?\n@c0@"
  sl: "@a@b＊：世间众生，皆为神子。\n　　来我教会有何贵干？\n@c0@"
  tl: "@a@b＊：世間眾生，皆為神子。\n　　來我教會有何貴幹？\n@c0@"
1:
  en: "@a@b*: What brings you to our church in the dead of night, child?\n@c0@"
  ja: "@a@b＊「このような夜ふけに\n\tわが教会を　おとずれるとは。\n\t何か　困りごとかの？\n@c0@"
  ko: "@a@b*: 이런 야심한 시각에\n우리 성당을 찾아오다니.\n곤란한 일이라도 있으신가?\n@c0@"
  sl: "@a@b＊：深夜来到我教会，\n　　是遇到了什么困难吗？\n@c0@"
  tl: "@a@b＊：深夜來到我教會，\n　　是遇到了什麼困難嗎？\n@c0@"
2:
  en: "@a@b*: Confess all that you have done before the almighty Goddess, child. \n@c0@"
  ja: "@a@b＊「では　神の前に\n\tこれまでの　おこないを\n\t告白なさい。\n@c0@"
  ko: "@a@b*: 그럼 신 앞에서\n지금까지의 행동을\n고백하시게.\n@c0@"
  sl: "@a@b＊：那么，请在神的面前\n　　告白至今为止\n　　你的所作所为吧。\n@c0@"
  tl: "@a@b＊：那麼，請在神的面前\n　　告白至今為止\n　　你的所作所為吧。\n@c0@"
3:
  en: "@a@b*: And would you permit me to record your works in an adventure log?\n@c0@"
  ja: "@a@b＊「そして　この冒険の書に\n\t記録しても　よろしいかな？\n@c0@"
  ko: "@a@b*: 그리고 이 모험의 서에\n기록해도 괜찮겠나?\n@c0@"
  sl: "@a@b＊：要记录在\n　　冒险之书上吗？\n@c0@"
  tl: "@a@b＊：要記錄在\n　　冒險之書上嗎？\n@c0@"
4:
  en: "@a@b*: Into which adventure log do you wish me to record this?\n@c0@"
  ja: "@a@b＊「なんばんの　冒険の書に\n\t記録する　おつもりか？\n@c0@"
  ko: "@a@b*: 모험의 서 몇 번에\n기록하겠나?\n@c0@"
  sl: "@a@b＊：要记录到\n　　几号冒险之书？\n@c0@"
  tl: "@a@b＊：要記錄到\n　　幾號冒險之書？\n@c0@"
5:
  en: "@a@b*: In that case, I must overwrite\n‘%a000660: %a000090 %a000240’.\nDo you wish me to proceed, my child?\n@c0@"
  ja: "@a@b＊「%a000660：%a000090　%a000240の\n\t記録に　上書きするが\n\tそれでも　よろしいかな？\n@c0@"
  ko: "@a@b*: %a000660 : %a000090 %a000240의\n기록에 덮어쓰게 되는데\n그래도 괜찮겠나?\n@c0@"
  sl: "@a@b＊：这样会覆盖\n　　%a000660：%a000090　%a000240的记录，\n　　确定吗？\n@c0@"
  tl: "@a@b＊：這樣會覆蓋\n　　%a000660：%a000090　%a000240的記錄，\n　　確定嗎？\n@c0@"
6:
  en: "@a@bSaving adventure log...\nPlease do not turn off the power.\n@c0@"
  ja: "@a@b冒険の書に　記録しています。\n電源を切らないで下さい。\n@c0@"
  ko: "@a@b모험의 서에 기록하고 있습니다.\n전원을 끄지 마십시오.\n@c0@"
  sl: "@a@b正在记录冒险之书。\n请不要切断电源。\n@c0@"
  tl: "@a@b正在記錄冒險之書。\n請不要切斷電源。\n@c0@"
7:
  en: "@a@b*: By the Goddess, whatever could have happened? It appears that my attempt to record the adventure log has failed!\n@c0@"
  ja: "@a@b＊「あやや　どうしたことじゃ！\n\t記録に　失敗したようじゃ。\n@c0@"
  ko: "@a@b*: 아니, 이게 무슨 일인가!\n기록에 실패한 것 같군.\n@c0@"
  sl: "@a@b＊：哎呀，怎么会这样！\n　　记录失败了。\n@c0@"
  tl: "@a@b＊：哎呀，怎麼會這樣！\n　　記錄失敗了。\n@c0@"
8:
  en: "@a@b*: I have successfully recorded your adventure log. Do you intend to continue on your adventure at this point, my child?\n@c0@"
  ja: "@a@b＊「たしかに　記録しましたぞ。\n\tまだ　冒険を　続けられる\n\tおつもりか？\n@c0@"
  ko: "@a@b*: 틀림없이 기록했소.\n모험을 계속할\n생각이신가?\n@c0@"
  sl: "@a@b＊：记录完毕。\n　　要继续冒险吗？\n@c0@"
  tl: "@a@b＊：記錄完畢。\n　　要繼續冒險嗎？\n@c0@"
9:
  en: "@a@b*: You would prefer not to record your adventure? Well, that is your decision.\n@c0@"
  ja: "@a@b＊「記録しないと申されるか。\n\tそれも　また　よろしかろう。\n@c0@"
  ko: "@a@b*: 기록하지 않겠다는 겐가?\n그것도 나쁘지 않지.\n@c0@"
  sl: "@a@b＊：不想记录吗？\n　　那也罢。\n@c0@"
  tl: "@a@b＊：不想記錄嗎？\n　　那也罷。\n@c0@"
10:
  en: "@a@b*: Do you intend to continue on your adventure at this point, my child?\n@c0@"
  ja: "@a@b＊「まだ　冒険を\n\t続けられる　おつもりか？\n@c0@"
  ko: "@a@b*: 모험을 계속할\n생각이신가?\n@c0@"
  sl: "@a@b＊：要继续冒险吗？\n@c0@"
  tl: "@a@b＊：要繼續冒險嗎？\n@c0@"
11:
  en: "@a@b*: By the Goddess! You intend to rest from your adventures without recording what you have done in an adventure log?\n@c0@"
  ja: "@a@b＊「なんと　記録をせずに\n\t休むと　申されるか……。\n@c0@"
  ko: "@a@b*: 아니, 기록도 하지 않고\n쉬시겠단 말인가......\n@c0@"
