130:
  en: "@aKing Somnus@bMortamor, the Archfiend... It's all clear to me now. His very existence must be holding peace at bay. That must be it...\n@c0@"
  ja: "@a@bレイドック王「大魔王　デスタムーア……\n\tなるほど　世界が平和にならぬのは\n\tその存在ゆえ……か。\n@c0@"
