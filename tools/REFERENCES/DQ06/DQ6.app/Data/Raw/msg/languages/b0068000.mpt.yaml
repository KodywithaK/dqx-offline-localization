133:
  en: "@aKing Somnus@bIt gives me no pleasure to place such a burden on your young shoulders, but I am afraid we have no other choice.\n@c0@"
  ja: "@a@bレイドック王「そなたたちに　ばかり\n\t重荷を背負わせるのは　心苦しいが\n\tもはや　ほかに　望みはないのじゃ。\n@c0@"
