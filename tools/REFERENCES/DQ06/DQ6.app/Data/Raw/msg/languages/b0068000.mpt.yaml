134:
  en: "@aKing Somnus@bI'll keep Somnia safe. You look after the rest of the world.\n@c0@"
  ja: "@a@bレイドック王「この国は　わしが守る。\n\tじゃから　お前たちは　世界の\n\t人びとのため　がんばってくれい。\n@c0@"
  ko: "@a@b레이독 왕: 이 나라는 내가 지키마.\n그러니 너희는 전 세계의\n사람들을 위해 힘쓰거라.\n@c0@"
