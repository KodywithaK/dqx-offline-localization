21:
  en: "@aCaptain Rusty@bWe've consulted the most famous scholars — even the Elder of Ghent — but no one can shed any light on the matter...\n@c0@"
  ja: "@a@bトム「有名な　学者にも　ゲント族という\n\tふしぎなチカラを　もつ民にも\n\tたずねましたが　原因は　わからず……\n@c0@"
  ko: "@a@b톰: 유명한 학자나, 겐트족이라는\n신기한 힘을 가진 민족에게도\n물어 봤지만, 원인을 모른다고......\n@c0@"
  sl: "@a@b托姆：无论是有名的学者，\n　　还是有神奇力量的根特族人，\n　　都没能找出真正的原因……\n@c0@"
  tl: "@a@b托姆：無論是有名的學者，\n　　還是有神奇力量的根特族人，\n　　都沒能找出真正的原因……\n@c0@"
22:
  en: "@aCaptain Rusty@bPerhaps you were right all along — killing the Dread Fiend Murdaw really is the only way to wake them.\n@c0@"
  ja: "@a@bトム「やはり　王子の　おっしゃるように\n\t魔王ムドーを　倒すしか\n\t方法は　ないのかもしれませぬ。\n@c0@"
  ko: "@a@b톰: 역시 왕자님 말씀대로\n마왕 무도를 쓰러뜨리는 것밖에\n다른 방법은 없을 것 같습니다.\n@c0@"
  sl: "@a@b托姆：我认为，\n　　还是像王子说的那样，\n　　只有打倒姆多才行。\n@c0@"
  tl: "@a@b托姆：我認為，\n　　還是像王子說的那樣，\n　　只有打倒姆多才行。\n@c0@"
23:
  en: "@a@b*: B-But Captain! If we all set out to take down Murdaw, who would guard the castle?\n@c0@"
  ja: "@a@b＊「しかし　兵士長！　われわれが\n\tムドー討ばつに　向かってしまうと\n\t城を守る者が　いなくなりますが……\n@c0@"
  ko: "@a@b*: 하지만 병사단장님! 우리가\n무도 토벌에 나서면\n성을 지키는 사람이 없습니다만......\n@c0@"
  sl: "@a@b＊：士兵长！\n　　如果我们去讨伐姆多，\n　　谁来守卫城堡呢……\n@c0@"
  tl: "@a@b＊：士兵長！\n　　如果我們去討伐姆多，\n　　誰來守衛城堡呢……\n@c0@"
24:
