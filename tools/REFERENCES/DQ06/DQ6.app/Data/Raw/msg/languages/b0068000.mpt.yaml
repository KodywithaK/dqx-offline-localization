  ja: "@a@bトム「うむ……　たしかに　城を\n\tほうったまま　全員で　討ばつに\n\t向かうわけには　いかん。\n@c0@"
  ko: "@a@b톰: 으음...... 그렇겠군. 성을\n비워두고 전원이 토벌에\n나설 순 없지.\n@c0@"
  sl: "@a@b托姆：嗯……\n　　不能抛下城堡不管，\n　　全员讨伐姆多。\n@c0@"
  tl: "@a@b托姆：嗯……\n　　不能拋下城堡不管，\n　　全員討伐姆多。\n@c0@"
25:
  en: "@aCaptain Rusty@bIn any case, you must prepare for battle at the double! Give some thought to our battle plan, as well.\n@c0@"
  ja: "@a@bトム「とにかく　早急に　作戦を\n\t立てねば！　お前たちも　なにか\n\t討ばつ案を　考えてみてくれ。\n@c0@"
  ko: "@a@b톰: 아무튼 서둘러 작전을\n세워야 한다! 자네들도\n토벌 대책을 생각해 보게나.\n@c0@"
  sl: "@a@b托姆：总之，大家要集思广益，\n　　必须尽快拿出作战计划。\n@c0@"
