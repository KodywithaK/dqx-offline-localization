  sl: "@a@b雷多克王：大魔王德斯塔穆亚……\n　　原来如此啊，由于他的存在，\n　　世界还没和平啊……\n@c0@"
  tl: "@a@b雷多克王：大魔王德斯塔穆亞……\n　　原來如此啊，由於他的存在，\n　　世界還沒和平啊……\n@c0@"
131:
  en: "@aKing Somnus@b...But I implore you, %a000140 — do not breathe a word of this to anyone.\n@c0@"
  ja: "@a@bレイドック王「……%a000140よ。\n\tこのことは　まだ\n\tほかの者に　話さぬようにな。\n@c0@"
