  tl: "@a@b＊：瑪茲婆婆一早就回去了。\n　　她讓我代她向王子問好。\n@c0@"
143:
  en: "@a@b*: Your Highness's safe return has really improved the mood around here — both inside and outside the castle walls.\n@c0@"
  ja: "@a@b＊「王子さまが　ご無事と　わかって\n\tお城にも　城下町にも　活気が\n\tもどったようです。\n@c0@"
  ko: "@a@b*: 왕자님이 무사하시다는 걸 알고\n성도 시가지도\n활기를 되찾은 것 같습니다.\n@c0@"
  sl: "@a@b＊：得知王子平安无事，\n　　城里和城区一片欢腾之声。\n@c0@"
  tl: "@a@b＊：得知王子平安無事，\n　　城裡和城區一片歡騰之聲。\n@c0@"
144:
  en: "@a@b*: I am in the midst of composing an epic work for when you return from your travels, my liege.\n@c0@"
