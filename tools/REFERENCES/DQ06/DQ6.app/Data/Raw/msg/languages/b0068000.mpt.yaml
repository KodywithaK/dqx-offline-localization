128:
  en: "@aKing Somnus@bIt's no coincidence that this helmet found its way into your possession, %a000090!\n@c0@"
  ja: "@a@bレイドック王「そして　それを　我が息子\n\t%a000090が　身につけられるとは！\n@c0@"
  ko: "@a@b레이독 왕: 그리고 그것을 내 아들\n%a000090%F0090%X가%Y이%Z 착용할 수 있다니!\n@c0@"
  sl: "@a@b雷多克王：而且我的儿子%a000090\n　　竟然可以戴上它！\n@c0@"
  tl: "@a@b雷多克王：而且我的兒子%a000090\n　　竟然可以戴上它！\n@c0@"
129:
  en: "@aKing Somnus@bThis is your destiny, my boy... I can feel it...\n@c0@"
  ja: "@a@bレイドック王「ただの　偶然というには\n\tあまりにも　できすぎて　おる。\n\t運命を感じずには　おれぬのう……。\n@c0@"
  ko: "@a@b레이독 왕: 그저 우연이라 하기엔\n모든 게 준비되어 있는 느낌이군.\n강한 운명이 느껴져......\n@c0@"
  sl: "@a@b雷多克王：如果说这是巧合，\n　　那简直是太巧了。\n　　这应该是命运的安排吧……\n@c0@"
