  tl: "@a@b＊：雖然在下說晚了，\n　　不過王子您太見外了。\n@c0@"
150:
  en: "@a@b*: I mean, you had room in your party for %a002000 and %a002010... What's wrong with us?\n@c0@"
  ja: "@a@b＊「われわれではなく\n\t%a002000どのや　%a002010どのと\n\tムドーの城へ　行かれたとは。\n@c0@"
