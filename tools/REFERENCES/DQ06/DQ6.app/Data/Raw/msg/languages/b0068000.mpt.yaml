  tl: "@a@b雷多克王：……%a000140。\n　　這件事情先不要對別人說。\n@c0@"
132:
  en: "@aKing Somnus@bPeople who live in fear will find their minds consumed by darkness. That is exactly what our enemies want.\n@c0@"
  ja: "@a@bレイドック王「不安は　より大きな闇を\n\tもたらすことが　ある。\n\tそれこそ　敵の　思うツボじゃろうて。\n@c0@"
