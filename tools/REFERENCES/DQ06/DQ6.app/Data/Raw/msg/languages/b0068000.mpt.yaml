188:
  en: "@a@b*: Oh, Your Highness! If you have a minute to spare, could you possibly pay my grandfather a visit?\n@c0@"
  ja: "@a@b＊「あら　王子さま！　お時間が\n\tあるなら　うちの　おじいちゃんにも\n\tお声を　かけてあげてくださいな。\n@c0@"
  ko: "@a@b*: 어머, 왕자님! 시간이\n있으면 우리 할아버지한테도\n말을 걸어 주세요.\n@c0@"
