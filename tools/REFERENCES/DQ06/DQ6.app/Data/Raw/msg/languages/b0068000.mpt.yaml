  sl: "@a@b雷多克王：我有一种预感……\n　　解开这个印记上的谜团，\n　　可能会是你们旅行的关键。\n@c0@"
  tl: "@a@b雷多克王：我有一種預感……\n　　解開這個印記上的謎團，\n　　可能會是你們旅行的關鍵。\n@c0@"
125:
  en: "@aKing Somnus@bNow go, %a000140. There must be a reason why peace has not yet returned to the world! Seek it out!\n@c0@"
  ja: "@a@bレイドック王「ゆけ　%a000140よ！\n\tそして　見つけ出すのじゃ。\n\t世界に平和が訪れぬ　その理由を！\n@c0@"
  ko: "@a@b레이독 왕: 가거라, %a000140!\n그리고 밝혀내거라.\n세계에 평화가 찾아오지 않는 이유를!\n@c0@"
  sl: "@a@b雷多克王：去吧%a000140！\n　　为什么和平没有造访世界，\n　　去找出答案吧！\n@c0@"
  tl: "@a@b雷多克王：去吧%a000140！\n　　為什麼和平沒有造訪世界，\n　　去找出答案吧！\n@c0@"
126:
  en: "@aKing Somnus@bI'll keep Somnia safe. You look after the rest of the world.\n@c0@"
  ja: "@a@bレイドック王「この国は　わしが守る。\n\tじゃから　お前は　世界の\n\t人びとのため　がんばってくれい。\n@c0@"
  ko: "@a@b레이독 왕: 이 나라는 내가 지키마.\n그러니 너는 전 세계의\n사람들을 위해 힘쓰거라.\n@c0@"
  sl: "@a@b雷多克王：我来保护这个国家。\n　　你则要为保护世界而努力战斗。\n@c0@"
  tl: "@a@b雷多克王：我來保護這個國家。\n　　你則要為保護世界而努力戰鬥。\n@c0@"
127:
  en: "@aKing Somnus@bWhat's this!? You claim that the helmet I gave you is one of the four legendary relics that can summon the Celestial Castle!?\n@c0@"
  ja: "@a@bレイドック王「なんと！　あのかぶとが\n\t神の城を　呼ぶことができるという\n\t伝説の武具の　１つだった　とな！？\n@c0@"
  ko: "@a@b레이독 왕: 아니! 그 투구가\n신의 성을 불러낼 수 있다는\n전설의 장비 중 하나란 말이더냐!?\n@c0@"
  sl: "@a@b雷多克王：哦哦！那个头盔\n　　是传说中的武具之一，\n　　可以呼唤神之城？！\n@c0@"
