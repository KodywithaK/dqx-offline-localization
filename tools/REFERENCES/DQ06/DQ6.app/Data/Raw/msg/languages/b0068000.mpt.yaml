  sl: "@a@b＊：我们家老爷子曾经培养过王子，\n　　这是他最自豪的事情。\n@c0@"
  tl: "@a@b＊：我們家老爺子曾經培養過王子，\n　　這是他最自豪的事情。\n@c0@"
191:
