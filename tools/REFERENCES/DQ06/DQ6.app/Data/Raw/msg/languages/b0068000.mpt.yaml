20:
  en: "@aCaptain Rusty@bPrince %a000090... It's been an entire month since the King and Queen took to bed, and we still have no idea what's causing this sleeping sickness.\n@c0@"
  ja: "@a@bトム「%a000090王子。　王と王妃が\n\t原因不明の　長い眠りに　つかれて\n\tはや　ひと月。\n@c0@"
  ko: "@a@b톰: %a000090 왕자님. 폐하와 왕비님이\n원인 불명의 깊은 잠에 빠진지\n벌써 한 달.\n@c0@"
  sl: "@a@b托姆：%a000090王子，\n　　国王和王妃陷入原因不明的\n　　睡眠已经一个月了。\n@c0@"
