  tl: "@a@b＊：只要遇見好事，\n　　我就會高興地叫起來。\n@c0@"
184:
  en: "@a@b*: What a shocker, eh? Who'd have thought our very own Prince was tough enough to take down Murdaw.\n@c0@"
