142:
  en: "@a@b*: Madame Luca went home early this morning, my liege. She asked me to pass on her regards.\n@c0@"
  ja: "@a@b＊「グランマーズさんは　朝はやく\n\tお帰りになりました。　王子さまに\n\tよろしくと　おっしゃってましたよ。\n@c0@"
  ko: "@a@b*: 그랜마즈 씨는 아침 일찍\n돌아가셨습니다. 왕자님께\n잘 부탁한다고 전해달라더군요.\n@c0@"
