146:
  en: "@a@b*: No harm will come to the King and Queen in Your Highness's absence. We'll triple our security efforts.\n@c0@"
  ja: "@a@b＊「王子の　お留守中　王さまと\n\t王妃さまに　キケンが　およばぬよう\n\t城の守りを　かためておきます。\n@c0@"
  ko: "@a@b*: 왕자님이 안 계시는 동안 폐하와\n왕비님께서 위험에 처하지 않도록\n성의 수비를 강화해 두겠습니다.\n@c0@"
