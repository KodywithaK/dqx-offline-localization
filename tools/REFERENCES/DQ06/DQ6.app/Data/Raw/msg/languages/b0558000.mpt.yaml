  tl: "@a@b%a002050：就像是陷入了\n　　混亂狀態一樣呢。\n@c0@"
29:
  en: "@a%0%a002050@bHe's gone!? He's not run back to Howsworth, has he!?\n@c0@"
  ja: "@a@b%a002050「うわー！\n\tまた　ホルコッタとか\n\tでしょうか！\n@c0@"
  ko: "@a@b%a002050: 으앗~!\n또 홀코타 같은 곳으로\n간 겁니까!\n@c0@"
  sl: "@a@b%a002050：哇！\n　　又跑到荷尔克塔去了吗！\n@c0@"
  tl: "@a@b%a002050：哇！\n　　又跑到荷爾克塔去了嗎！\n@c0@"
30:
  en: "@a%0%a002000@bAye, well... Let's get him.\n@c0@"
  ja: "@a@b%a002000「しかたがない……。\n\t王子を　さがすか。\n@c0@"
  ko: "@a@b%a002000: 어쩔 수 없지......\n왕자를 찾아보자고.\n@c0@"
  sl: "@a@b%a002000：没办法……\n　　去找王子吧。\n@c0@"
  tl: "@a@b%a002000：沒辦法……\n　　去找王子吧。\n@c0@"
31:
  en: "@a%0%a002010@bHe can't have gone too far.\n@c0@"
  ja: "@a@b%a002010「まだ　そう　とおくへは\n\t行っていないと　思うわね。\n@c0@"
  ko: "@a@b%a002010: 아직 그렇게 멀리는\n못 갔을 거야.\n@c0@"
  sl: "@a@b%a002010：我觉得\n　　他不会跑那么远。\n@c0@"
  tl: "@a@b%a002010：我覺得\n　　他不會跑那麼遠。\n@c0@"
32:
  en: "@a%0%a002020@bThat's it! When we find him, I'm spanking his royal rear!\n@c0@"
  ja: "@a@b%a002020「あいつめー！\n\tオシリ　つねっちゃうからね！\n@c0@"
  ko: "@a@b%a002020: 그 녀석~!\n엉덩이를 꼬집어 버릴 테야!\n@c0@"
  sl: "@a@b%a002020：那家伙！\n　　绝对要打他屁股！\n@c0@"
  tl: "@a@b%a002020：那傢伙！\n　　絕對要打他屁股！\n@c0@"
33:
  en: "@a%0%a002030@bWe cannot let Prince Howard out of our sight, even when we are fighting.\n@c0@"
  ja: "@a@b%a002030「ホルス王子には\n\tひとり歩きは　なおさら　キケンだと\n\tわかって　いただかないと……。\n@c0@"
  ko: "@a@b%a002030: 혼자서 가는 게\n훨씬 더 위험하다는 걸 홀스 왕자가\n알아야 할 텐데......\n@c0@"
  sl: "@a@b%a002030：必须要让荷尔斯王子\n　　知道一个人行动\n　　是非常危险的才行……\n@c0@"
  tl: "@a@b%a002030：必須要讓荷爾斯王子\n　　知道一個人行動\n　　是非常危險的才行……\n@c0@"
34:
  en: "@a%0%a002050@bWe need to put the lad on a leash, I tell you!\n@c0@"
  ja: "@a@b%a002050「クサリか　なにかで\n\tつないで　おかないと……。\n@c0@"
