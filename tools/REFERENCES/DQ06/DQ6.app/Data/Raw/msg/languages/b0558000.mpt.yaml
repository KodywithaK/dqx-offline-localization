  sl: "@a@b%a002030：好像是\n　　看到我们在战斗，\n　　见机逃走的……\n@c0@"
  tl: "@a@b%a002030：好像是\n　　看到我們在戰鬥，\n　　見機逃走的……\n@c0@"
27:
  en: "@a%0%a002050@bOld %a002050 doesn't remember much about that last fight except the monster was a toughie.\n@c0@"
  ja: "@a@b%a002050「いやー　敵が強くて\n\t夢中だったので　どう　戦ったのか\n\tよく　覚えていません。\n@c0@"
