0:
  en: "@a%0%a002000@bWell, we're here. Time to get down to brass tacks 'n' everything like that.\n@c0@"
  ja: "@a@b%a002000「さあ　洗礼の洞くつだ！\n\tようやく　本格的に\n\t探検の　スタートだぜ！\n@c0@"
  ko: "@a@b%a002000: 자, 세례의 동굴이다!\n드디어 본격적으로\n탐험을 시작할 수 있겠군!\n@c0@"
  sl: "@a@b%a002000：到洗礼洞窟了！\n　　终于要开始\n　　真正的探险了！\n@c0@"
  tl: "@a@b%a002000：到洗禮洞窟了！\n　　終於要開始\n　　真正的探險了！\n@c0@"
1:
  en: "@a%0%a002010@bLet's keep moving — don't let your guard down.\n@c0@"
  ja: "@a@b%a002010「いろいろ　ゆだんしないで\n\t行きましょう。\n@c0@"
  ko: "@a@b%a002010: 여러모로 방심하지 말고\n가자구.\n@c0@"
  sl: "@a@b%a002010：不要放松警惕，\n　　小心前进吧。\n@c0@"
  tl: "@a@b%a002010：不要放鬆警惕，\n　　小心前進吧。\n@c0@"
2:
  en: "@a%0%a002020@bLet's hurry before he chickens out again!\n@c0@"
  ja: "@a@b%a002020「今度こそ\n\t１番奥まで　行かなっくっちゃ！\n@c0@"
  ko: "@a@b%a002020: 이번에는 꼭\n제일 안쪽까지 가야 해!\n@c0@"
  sl: "@a@b%a002020：这次一定要\n　　进到最深处才行！\n@c0@"
  tl: "@a@b%a002020：這次一定要\n　　進到最深處才行！\n@c0@"
3:
  en: "@a%0%a002030@bYou may rest assured that the Prince is still with us.\n@c0@"
  ja: "@a@b%a002030「大丈夫。\n\t王子は　ちゃんと　いますよ！\n@c0@"
  ko: "@a@b%a002030: 괜찮습니다.\n왕자는 잘 따라오고 있어요!\n@c0@"
  sl: "@a@b%a002030：没问题。\n　　王子乖乖跟着呢！\n@c0@"
  tl: "@a@b%a002030：沒問題。\n　　王子乖乖跟著呢！\n@c0@"
4:
  en: "@a%0%a002050@bWe can at least get further than we did last time!\n@c0@"
  ja: "@a@b%a002050「まずは　前回\n\tクリアできなかった　このフロアの\n\t先に　行けるかが　勝負ですね！\n@c0@"
  ko: "@a@b%a002050: 우선은 지난번에\n끝까지 가지 못했던 이 층 너머로\n갈 수 있느냐가 관건이겠군요!\n@c0@"
  sl: "@a@b%a002050：上次咱们可是\n　　连这一层都没能走通呢，\n　　这次能否下到更深的地方是关键啊！\n@c0@"
  tl: "@a@b%a002050：上次咱們可是\n　　連這一層都沒能走通呢，\n　　這次能否下到更深的地方是關鍵啊！\n@c0@"
5:
  en: "@a%0%a002000@bCrikey. This cave just got a whole lot bigger, aye.\n@c0@"
  ja: "@a@b%a002000「いきなり　ずいぶん\n\t広いところに　出たな。\n@c0@"
  ko: "@a@b%a002000: 느닷없이 꽤\n넓은 곳으로 나와 버렸군.\n@c0@"
  sl: "@a@b%a002000：突然就到了个\n　　这么宽敞的地方呢。\n@c0@"
  tl: "@a@b%a002000：突然就到了個\n　　這麼寬敞的地方呢。\n@c0@"
6:
  en: "@a%0%a002010@bThese scattered shafts of light are rather pretty.\n@c0@"
  ja: "@a@b%a002010「ところ　どころ\n\t光が　差しこんでいて\n\tキレイだわね。\n@c0@"
  ko: "@a@b%a002010: 곳곳에\n빛이 들어와서\n아름다워.\n@c0@"
  sl: "@a@b%a002010：到处都有\n　　光线照射进来，\n　　真好看。\n@c0@"
  tl: "@a@b%a002010：到處都有\n　　光線照射進來，\n　　真好看。\n@c0@"
7:
  en: "@a%0%a002020@bHey, where's the Prince!?\n@c0@"
  ja: "@a@b%a002020「あれ？　王子は！？\n@c0@"
  ko: "@a@b%a002020: 어? 왕자는!?\n@c0@"
  sl: "@a@b%a002020：哎呀？王子人呢？！\n@c0@"
  tl: "@a@b%a002020：哎呀？王子人呢？！\n@c0@"
8:
  en: "@a%0%a002020@b...Oh. There he is. Whew.\n@c0@"
  ja: "@a@b%a002020「あ…　いるか……。\n@c0@"
  ko: "@a@b%a002020: 아... 있구나......\n@c0@"
  sl: "@a@b%a002020：啊……在这啊……\n@c0@"
  tl: "@a@b%a002020：啊……在這啊……\n@c0@"
9:
  en: "@a%0%a002030@bTake care not to tread on any stalagmites.\n@c0@"
  ja: "@a@b%a002030「足元の　とがった\n\tしょうにゅうせきに\n\t気をつけてくださいね。\n@c0@"
  ko: "@a@b%a002030: 발밑에 있는\n뾰족한 종유석을\n조심하세요.\n@c0@"
  sl: "@a@b%a002030：要小心\n　　脚边那些\n　　锋利的钟乳石啊。\n@c0@"
  tl: "@a@b%a002030：要小心\n　　腳邊那些\n　　鋒利的鐘乳石啊。\n@c0@"
10:
  en: "@a%0%a002050@bURGH!\n@c0@"
  ja: "@a@b%a002050「うわあーっ！！！\n@c0@"
  ko: "@a@b%a002050: 으아앗~!!!\n@c0@"
  sl: "@a@b%a002050：哇啊！！！\n@c0@"
  tl: "@a@b%a002050：哇啊！！！\n@c0@"
11:
  en: "@a%0%a002050@b...Er, sorry about that. A drip just went down my back...\n@c0@"
  ja: "@a@b%a002050「あ　すいません\n\tせなかに　ポツリと　水が……。\n@c0@"
  ko: "@a@b%a002050: 아, 죄송합니다.\n등에 물이 한 방울 떨어져서......\n@c0@"
  sl: "@a@b%a002050：啊，对不起。\n　　突然有水滴到了背上……\n@c0@"
  tl: "@a@b%a002050：啊，對不起。\n　　突然有水滴到了背上……\n@c0@"
12:
  en: "@a%0%a002000@bFor such a big cave, there ain't that many paths, aye?\n@c0@"
  ja: "@a@b%a002000「見た目は　広い場所だが\n\t通れる　みちすじは\n\t少ない　みたいだな。\n@c0@"
  ko: "@a@b%a002000: 겉보기엔 넓어 보이는 곳이지만\n지나갈 수 있는 길은\n적은 모양이군.\n@c0@"
  sl: "@a@b%a002000：表面上看上去\n　　是个宽敞的地方，\n　　但是能走的路好像很少呢。\n@c0@"
  tl: "@a@b%a002000：表面上看上去\n　　是個寬敞的地方，\n　　但是能走的路好像很少呢。\n@c0@"
13:
  en: "@a%0%a002010@bI wonder how big this cave could be?\n@c0@"
  ja: "@a@b%a002010「洞くつは\n\tどこまで　続くのかしらね。\n@c0@"
  ko: "@a@b%a002010: 동굴은\n어디까지 이어져 있을까?\n@c0@"
  sl: "@a@b%a002010：这洞窟到底\n　　通向什么地方啊。\n@c0@"
  tl: "@a@b%a002010：這洞窟到底\n　　通向什麼地方啊。\n@c0@"
14:
  en: "@a%0%a002020@bWow. More monsters than I thought...\n@c0@"
  ja: "@a@b%a002020「思ったより\n\tまものが　出るのね。\n@c0@"
  ko: "@a@b%a002020: 생각보다\n마물이 꽤 나오네.\n@c0@"
  sl: "@a@b%a002020：魔物比想象的多呢。\n@c0@"
  tl: "@a@b%a002020：魔物比想像的多呢。\n@c0@"
15:
  en: "@a%0%a002020@bThose soldiers who tried to escort the Prince before sure must've had a rough time of it.\n@c0@"
  ja: "@a@b%a002020「これじゃ\n\tおつきの　兵隊さんたちも\n\tたいへん　だったろうなあ。\n@c0@"
  ko: "@a@b%a002020: 이러니\n호위 병사들도\n힘들었을 거야.\n@c0@"
  sl: "@a@b%a002020：这个样子，\n　　之前陪同的士兵们\n　　一定也很辛苦吧。\n@c0@"
  tl: "@a@b%a002020：這個樣子，\n　　之前陪同的士兵們\n　　一定也很辛苦吧。\n@c0@"
16:
  en: "@a%0%a002030@bWe must proceed with caution, and take care not to expend energy unnecessarily.\n@c0@"
  ja: "@a@b%a002030「体力の　消もう　などに\n\t気をつけながら　進みましょう。\n@c0@"
  ko: "@a@b%a002030: 체력 소모에\n주의하면서 갑시다.\n@c0@"
  sl: "@a@b%a002030：不要浪费体力，\n　　小心前进。\n@c0@"
  tl: "@a@b%a002030：不要浪費體力，\n　　小心前進。\n@c0@"
17:
  en: "@a%0%a002050@bSlow and steady wins the race! If you go rushin' around, old %a002050 will get lost.\n@c0@"
  ja: "@a@b%a002050「はぐれないように\n\tゆっくり歩いて　くださいね。\n\t私　方向オンチ　なんですから。\n@c0@"
  ko: "@a@b%a002050: 제가 여러분을 놓치지 않도록\n천천히 걸어가 주세요.\n저, 방향치거든요.\n@c0@"
  sl: "@a@b%a002050：慢些走，不要走散了。\n　　我是个路痴啊。\n@c0@"
  tl: "@a@b%a002050：慢些走，不要走散了。\n　　我是個路癡啊。\n@c0@"
18:
  en: "@a%0%a002000@bThat one was a whole different beast from the other monsters here, aye?\n@c0@"
  ja: "@a@b%a002000「この　試練とやらは\n\tきっと　まものとは　ぜんぜんちがう\n\tそんざい　なんだろうな。\n@c0@"
  ko: "@a@b%a002000: 이 시련인가 뭔가 하는 건\n분명 마물과는 전혀 다른\n존재겠지.\n@c0@"
  sl: "@a@b%a002000：这个自称是\n　　试炼的家伙，\n　　和魔物应该完全是两回事吧。\n@c0@"
  tl: "@a@b%a002000：這個自稱是\n　　試煉的傢伙，\n　　和魔物應該完全是兩回事吧。\n@c0@"
19:
  en: "@a%0%a002000@bCrikey, what a handful...\n@c0@"
  ja: "@a@b%a002000「しかし　強いぜ……。\n@c0@"
  ko: "@a@b%a002000: 그나저나 강한걸......\n@c0@"
  sl: "@a@b%a002000：不过，真是厉害啊……\n@c0@"
  tl: "@a@b%a002000：不過，真是厲害啊……\n@c0@"
20:
  en: "@a%0%a002000@bAvast! He's gone again!\n@c0@"
  ja: "@a@b%a002000「げげっ！\n\tあいつ　また　にげやがった！\n@c0@"
  ko: "@a@b%a002000: 으억!\n녀석 또 도망쳤잖아!\n@c0@"
  sl: "@a@b%a002000：啊！\n　　那家伙又跑了！\n@c0@"
  tl: "@a@b%a002000：啊！\n　　那傢伙又跑了！\n@c0@"
21:
  en: "@a%0%a002010@bI wonder how long that monster had been standing there waiting...\n@c0@"
  ja: "@a@b%a002010「いつも　こうして\n\tとおせんぼ　しているのかしら。\n@c0@"
  ko: "@a@b%a002010: 항상 이렇게\n길을 막고 있는 걸까?\n@c0@"
  sl: "@a@b%a002010：一直都这样\n　　挡人路么？\n@c0@"
  tl: "@a@b%a002010：一直都這樣\n　　擋人路麼？\n@c0@"
22:
  en: "@a%0%a002010@bWe lost the Prince again? Well that was careless... Let's go and look for him.\n@c0@"
  ja: "@a@b%a002010「うかつ　だったわね……。\n\tさがしましょう。\n@c0@"
  ko: "@a@b%a002010: 우리의 불찰이야......\n찾아보자.\n@c0@"
  sl: "@a@b%a002010：大意了……\n　　去找吧。\n@c0@"
  tl: "@a@b%a002010：大意了……\n　　去找吧。\n@c0@"
23:
  en: "@a%0%a002020@bWe must be tested, huh? I wonder how many more of these tests are waiting for us.\n@c0@"
  ja: "@a@b%a002020「われは　試練なり……か。\n\tここには　いったい　いくつの\n\t試練が　あるのかしらね……。\n@c0@"
  ko: "@a@b%a002020: 나는 시련이노라......라네.\n여기엔 대체 몇 개의\n시련이 있는 걸까......\n@c0@"
  sl: "@a@b%a002020：它就是试炼啊……\n　　这里到底有多少试炼啊……\n@c0@"
  tl: "@a@b%a002020：它就是試煉啊……\n　　這裡到底有多少試煉啊……\n@c0@"
24:
  en: "@a%0%a002020@bOh, brother! He ran off again!?\n@c0@"
  ja: "@a@b%a002020「なによー！\n\tまた　アイツ　にげたのー！？\n@c0@"
  ko: "@a@b%a002020: 뭐야~!\n또 그 녀석 도망친 거야~!?\n@c0@"
  sl: "@a@b%a002020：什么嘛！\n　　那家伙又跑了啊？！\n@c0@"
  tl: "@a@b%a002020：什麼嘛！\n　　那傢伙又跑了啊？！\n@c0@"
25:
  en: "@a%0%a002030@bI now see why Prince Howard was so fearful of the tests awaiting him.\n@c0@"
  ja: "@a@b%a002030「これが　試練ならば\n\tたしかに　ホルス王子には\n\tつらいかも　しれませんね……。\n@c0@"
