  sl: "@a@b%a002030：如果这就是试炼的话，\n　　对王子来说的确是\n　　有些勉为其难呢。\n@c0@"
  tl: "@a@b%a002030：如果這就是試煉的話，\n　　對王子來說的確是\n　　有些勉為其難呢。\n@c0@"
26:
  en: "@a%0%a002030@bWhile we were busy fighting, it appears the Prince ran away again.\n@c0@"
  ja: "@a@b%a002030「私たちが　戦いに\n\t気を　取られている　スキに\n\tにげだした　ようですね……。\n@c0@"
