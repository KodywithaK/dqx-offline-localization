  tl: "@a@b%a002010：不在嗎？\n　　他果然還在洞窟裡\n　　某個地方吧……\n@c0@"
173:
  en: "@a%0%a002020@bHe's not here? Hmm...\n@c0@"
  ja: "@a@b%a002020「いないんだ。\n\t困ったね……。\n@c0@"
  ko: "@a@b%a002020: 없구나.\n어떡하지......\n@c0@"
  sl: "@a@b%a002020：不在啊。\n　　真伤脑筋……\n@c0@"
  tl: "@a@b%a002020：不在啊。\n　　真傷腦筋……\n@c0@"
174:
  en: "@a%0%a002020@bSo he's either still in the cave or over in the castle. This is driving me crazy!\n@c0@"
  ja: "@a@b%a002020「ここに　いなければ\n\t洗礼の洞くつか　お城よね。\n\tああ　もう！\n@c0@"
  ko: "@a@b%a002020: 여기 없으면\n세례의 동굴 아니면 성에 있겠네.\n아, 정말!\n@c0@"
  sl: "@a@b%a002020：如果不在这里的话，\n　　那就应该是在洗礼洞窟或者城里吧。\n　　啊，真是受够了！\n@c0@"
  tl: "@a@b%a002020：如果不在這裡的話，\n　　那就應該是在洗禮洞窟或者城裡吧。\n　　啊，真是受夠了！\n@c0@"
175:
  en: "@a%0%a002030@bHmm... And I thought it highly likely that Prince Howard would come here...\n@c0@"
  ja: "@a@b%a002030「そうですか……\n\tこの村に　来ている可能性は\n\t高いと　思ったんですが。\n@c0@"
  ko: "@a@b%a002030: 그렇군요......\n이 마을에 와 있을 가능성이\n높을 거라 생각했는데.\n@c0@"
  sl: "@a@b%a002030：这样啊……\n　　我还觉得他十有八九\n　　会来这个村子呢。\n@c0@"
  tl: "@a@b%a002030：這樣啊……\n　　我還覺得他十有八九\n　　會來這個村子呢。\n@c0@"
176:
  en: "@a%0%a002050@bLooks like we've not got a clue.\n@c0@"
  ja: "@a@b%a002050「まいったなー。\n\t手がかり　なし　ですか……。\n@c0@"
  ko: "@a@b%a002050: 큰일이네요.\n단서가 없다니......\n@c0@"
  sl: "@a@b%a002050：真倒霉，\n　　没什么线索啊……\n@c0@"
  tl: "@a@b%a002050：真倒楣，\n　　沒什麼線索啊……\n@c0@"
177:
  en: "@a%0%a002000@bAye, it'd do the Prince good to get a bit dirty — after gettin' purified first, of course.\n@c0@"
  ja: "@a@b%a002000「いい　アイディアだが\n\t今はまだ　ほかに　やることが\n\tたくさん　あるだろうからな。\n@c0@"
  ko: "@a@b%a002000: 좋은 생각이지만\n지금은 그거 말고도 할 일이\n많이 있다고.\n@c0@"
  sl: "@a@b%a002000：这主意倒是不错。\n　　不过王子还有很多\n　　事情要做啊。\n@c0@"
  tl: "@a@b%a002000：這主意倒是不錯。\n　　不過王子還有很多\n　　事情要做啊。\n@c0@"
178:
  en: "@a%0%a002010@bThe future king probably should know how his subjects live.\n@c0@"
  ja: "@a@b%a002010「国の　人びとの\n\t生活を　知るのにも\n\tちょうど　いいわね。\n@c0@"
  ko: "@a@b%a002010: 백성들의\n생활상을 알기 위해서라도\n해 보면 정말 좋겠네.\n@c0@"
  sl: "@a@b%a002010：这可以帮助他\n　　了解到这个国家\n　　老百姓的生活状况呢。\n@c0@"
  tl: "@a@b%a002010：這可以幫助他\n　　瞭解到這個國家\n　　老百姓的生活狀況呢。\n@c0@"
179:
  en: "@a%0%a002020@bI bet the Prince would bolt before he got within a hundred feet of those fields.\n@c0@"
  ja: "@a@b%a002020「畑仕事　させたって\n\tきっと　にげちゃうと　思うな。\n@c0@"
  ko: "@a@b%a002020: 밭일을 시켜도\n분명히 도망칠걸.\n@c0@"
  sl: "@a@b%a002020：让他下地干活的话，\n　　肯定会逃走的吧。\n@c0@"
  tl: "@a@b%a002020：讓他下地幹活的話，\n　　肯定會逃走的吧。\n@c0@"
180:
  en: "@a%0%a002030@bNever mind his agricultural prospects — where is he?\n@c0@"
  ja: "@a@b%a002030「それにしても\n\tどこに　いるのでしょうね\n\tホルス王子……。\n@c0@"
  ko: "@a@b%a002030: 그나저나\n어디에 있는 걸까요,\n홀스 왕자......\n@c0@"
  sl: "@a@b%a002030：不过荷尔斯王子\n　　到底在哪啊……\n@c0@"
  tl: "@a@b%a002030：不過荷爾斯王子\n　　到底在哪啊……\n@c0@"
181:
  en: "@a%0%a002050@bThis fellow's desperate for some help around the farm, eh?\n@c0@"
  ja: "@a@b%a002050「この人　よっぽど\n\t人手が　ほしいのでしょうか。\n@c0@"
  ko: "@a@b%a002050: 이 사람, 그렇게나\n일손이 필요한 걸까요?\n@c0@"
  sl: "@a@b%a002050：这人一定非常想\n　　找人帮忙干活吧。\n@c0@"
  tl: "@a@b%a002050：這人一定非常想\n　　找人幫忙幹活吧。\n@c0@"
182:
  en: "@a%0%a002000@bI see where the lady's coming from, but rules are rules 'n' everything like that.\n@c0@"
  ja: "@a@b%a002000「おばさんの　気持ちは\n\tまあ　わかるけど　ルールってのも\n\tだいじな　ことだからな。\n@c0@"
  ko: "@a@b%a002000: 아줌마의 마음은\n모르는 바가 아니지만 규칙이란 것도\n중요하다고.\n@c0@"
  sl: "@a@b%a002000：俺能理解\n　　大婶的心情，\n　　不过规矩就是规矩啊。\n@c0@"
  tl: "@a@b%a002000：俺能理解\n　　大嬸的心情，\n　　不過規矩就是規矩啊。\n@c0@"
183:
  en: "@a%0%a002010@bMany of the villagers are quite fond of the Prince, aren't they?\n@c0@"
  ja: "@a@b%a002010「この村には\n\t王子に　好意的な　人たちが\n\tたくさんいるのね。\n@c0@"
  ko: "@a@b%a002010: 이 마을에는\n왕자에게 호의적인 사람들이\n많네.\n@c0@"
  sl: "@a@b%a002010：这个村\n　　喜欢王子的人真不少呢。\n@c0@"
  tl: "@a@b%a002010：這個村\n　　喜歡王子的人真不少呢。\n@c0@"
184:
  en: "@a%0%a002020@bI can see why the King's giving the Prince a little push. Otherwise, he's the sort who would goof off from cradle to grave.\n@c0@"
  ja: "@a@b%a002020「王子みたいな　タイプは\n\t少しくらい　強引に　やらないと\n\t自分からは　何もしないわよね！\n@c0@"
  ko: "@a@b%a002020: 왕자 같은 타입은\n억지로라도 시키지 않으면\n자기 혼자서는 아무것도 안 한다구!\n@c0@"
  sl: "@a@b%a002020：王子这种人，\n　　就是要对他强硬一点，\n　　要不他是不肯主动做事的！\n@c0@"
  tl: "@a@b%a002020：王子這種人，\n　　就是要對他強硬一點，\n　　要不他是不肯主動做事的！\n@c0@"
185:
  en: "@a%0%a002030@bHarsh though it may sound, Prince Howard has no choice but to fulfil his duty.\n@c0@"
  ja: "@a@b%a002030「もし　やめさせたら\n\t他の者たちに　しめしが\n\tつかないでしょう。\n@c0@"
  ko: "@a@b%a002030: 만약 그만두게 하면\n다른 사람들에게 본보기가\n되지 않겠지요.\n@c0@"
  sl: "@a@b%a002030：要是不让他去的话，\n　　是无法对他人起到\n　　示范作用的。\n@c0@"
  tl: "@a@b%a002030：要是不讓他去的話，\n　　是無法對他人起到\n　　示範作用的。\n@c0@"
186:
  en: "@a%0%a002030@bWith royal blood comes power, but also the burden of responsibility.\n@c0@"
  ja: "@a@b%a002030「上に立つ者は\n\tそれなりの　宿命も　背負って\n\t行くものなのですよね。\n@c0@"
  ko: "@a@b%a002030: 위에서 군림하는 자는\n그 나름의 숙명을 지고\n가야 하는 법입니다.\n@c0@"
  sl: "@a@b%a002030：位居高者，\n　　必须肩负起其\n　　应当肩负的命运。\n@c0@"
  tl: "@a@b%a002030：位居高者，\n　　必須肩負起其\n　　應當肩負的命運。\n@c0@"
187:
  en: "@a%0%a002050@bPrince Howard's made it perfectly clear that he's in no rush to fulfil his royal duty.\n@c0@"
  ja: "@a@b%a002050「王子が　そうとう\n\tイヤがってることは　私たちも　\n\tかなり　思い知っていますが……。\n@c0@"
  ko: "@a@b%a002050: 왕자가 상당히\n싫어한다는 건 저희도\n뼈저리게 느끼고 있죠......\n@c0@"
  sl: "@a@b%a002050：我们也很清楚，\n　　王子他也不愿意做这事……\n@c0@"
  tl: "@a@b%a002050：我們也很清楚，\n　　王子他也不願意做這事……\n@c0@"
188:
  en: "@a%0%a002000@bThat kid should get in line. The Prince is busy playin' hide-'n'-seek with us right now!\n@c0@"
  ja: "@a@b%a002000「ホルス王子は　いま\n\tオレたちとの　かくれんぼで\n\tいそがしいから　そのうちな……。\n@c0@"
  ko: "@a@b%a002000: 홀스 왕자는 지금\n우리랑 숨바꼭질하느라\n바쁘니까 다음에 놀아라......\n@c0@"
  sl: "@a@b%a002000：荷尔斯王子\n　　现在正跟咱玩捉迷藏玩得\n　　不亦乐乎呢，下次吧……\n@c0@"
  tl: "@a@b%a002000：荷爾斯王子\n　　現在正跟咱玩捉迷藏玩得\n　　不亦樂乎呢，下次吧……\n@c0@"
189:
  en: "@a%0%a002010@bIf he hasn't come here, I'd say it's unlikely that he's in Howcastle either.\n@c0@"
  ja: "@a@b%a002010「ここに　来ていない\n\tということは　ホルコッタにいる\n\t可能性は　ひくいわね。\n@c0@"
  ko: "@a@b%a002010: 여기도 안 왔다면\n홀코타에 있을\n가능성은 낮겠어.\n@c0@"
  sl: "@a@b%a002010：如果这里都没有的话，\n　　那他来荷尔克塔的\n　　可能性就很低了。\n@c0@"
  tl: "@a@b%a002010：如果這裡都沒有的話，\n　　那他來荷爾克塔的\n　　可能性就很低了。\n@c0@"
190:
  en: "@a%0%a002020@bSeems like a good kid. If he'd seen the Prince, I'm sure he would've told us.\n@c0@"
  ja: "@a@b%a002020「この子　すなおだから\n\t王子を　見ていたら　ちゃんと\n\t教えてくれる　はずよねえ。\n@c0@"
  ko: "@a@b%a002020: 이 아이는 솔직하니까\n왕자를 봤다면 틀림없이\n가르쳐 줬을 거야.\n@c0@"
  sl: "@a@b%a002020：这个孩子很诚实，\n　　要是看到了王子的话，\n　　肯定会告诉我们的。\n@c0@"
  tl: "@a@b%a002020：這個孩子很誠實，\n　　要是看到了王子的話，\n　　肯定會告訴我們的。\n@c0@"
191:
  en: "@a%0%a002030@bSo Prince Howard really isn't in Howsworth...\n@c0@"
  ja: "@a@b%a002030「うーん。\n\tやっぱり　ホルコッタには\n\tいないのでしょうかね。\n@c0@"
  ko: "@a@b%a002030: 으음.\n역시 홀코타에는\n없는 걸까요?\n@c0@"
  sl: "@a@b%a002030：唔。\n　　果然不在荷尔克塔啊。\n@c0@"
  tl: "@a@b%a002030：唔。\n　　果然不在荷爾克塔啊。\n@c0@"
192:
  en: "@a%0%a002050@bWell, at least we know he's not back here playin' hide-and-seek with that lad.\n@c0@"
  ja: "@a@b%a002050「あそびに　来られても\n\t困りますよね！\n@c0@"
  ko: "@a@b%a002050: 지금 놀러왔다면\n그건 그거대로 문제라구요!\n@c0@"
  sl: "@a@b%a002050：即使来玩的话，\n　　那也很伤脑筋啊！\n@c0@"
  tl: "@a@b%a002050：即使來玩的話，\n　　那也很傷腦筋啊！\n@c0@"
193:
  en: "@a%0%a002000@bPrince? You about?\n@c0@"
  ja: "@a@b%a002000「王子　いるかな？\n@c0@"
  ko: "@a@b%a002000: 혹시 왕자가 있으려나?\n@c0@"
  sl: "@a@b%a002000：王子在吗？\n@c0@"
  tl: "@a@b%a002000：王子在嗎？\n@c0@"
194:
  en: "@a%0%a002010@bWe can't rest until we've searched every corner.\n@c0@"
  ja: "@a@b%a002010「とりあえず　くまなく\n\t探してみるしか　ないわね。\n@c0@"
  ko: "@a@b%a002010: 우선 빠짐없이\n찾아보는 수밖엔 없어.\n@c0@"
  sl: "@a@b%a002010：总之先\n　　彻彻底底找找看吧。\n@c0@"
  tl: "@a@b%a002010：總之先\n　　徹徹底底找找看吧。\n@c0@"
195:
  en: "@a%0%a002020@bI doubt he'd be in here — not with that lady eyeballing the entrance.\n@c0@"
  ja: "@a@b%a002020「こんな　入口で\n\tおばさんが　見ているような\n\tところには　こないわよね。\n@c0@"
  ko: "@a@b%a002020: 이렇게 입구에서\n아줌마가 뻔히 보고 있는\n곳엔 안 오겠지.\n@c0@"
  sl: "@a@b%a002020：这种入口处，\n　　谁进来大婶都会看得一清二楚，\n　　王子应该不会来的吧。\n@c0@"
  tl: "@a@b%a002020：這種入口處，\n　　誰進來大嬸都會看得一清二楚，\n　　王子應該不會來的吧。\n@c0@"
196:
  en: "@a%0%a002030@bNo sign of him here...\n@c0@"
  ja: "@a@b%a002030「いませんよね……。\n@c0@"
  ko: "@a@b%a002030: 없겠지요......\n@c0@"
  sl: "@a@b%a002030：不在吧……\n@c0@"
  tl: "@a@b%a002030：不在吧……\n@c0@"
197:
  en: "@a%0%a002050@bNothing princely round here.\n@c0@"
  ja: "@a@b%a002050「……いない\n\tみたいですねえ。\n@c0@"
  ko: "@a@b%a002050: ......없는 것\n같군요.\n@c0@"
  sl: "@a@b%a002050：……好像不在呢。\n@c0@"
  tl: "@a@b%a002050：……好像不在呢。\n@c0@"
198:
  en: "@a%0%a002000@bHe probably ain't here. It's too quiet.\n@c0@"
  ja: "@a@b%a002000「静かだな。\n\tいそうも　ないぜ。\n@c0@"
  ko: "@a@b%a002000: 조용하군.\n있을 것 같지 않은걸.\n@c0@"
  sl: "@a@b%a002000：真安静。\n　　应该不在这里吧。\n@c0@"
  tl: "@a@b%a002000：真安靜。\n　　應該不在這裡吧。\n@c0@"
199:
  en: "@a%0%a002010@bLet's give this house a once-over.\n@c0@"
  ja: "@a@b%a002010「念のために\n\tよくしらべて　おきましょう。\n@c0@"
  ko: "@a@b%a002010: 혹시 모르니\n잘 살펴보자.\n@c0@"
  sl: "@a@b%a002010：以防万一，\n　　还是好好找一找吧。\n@c0@"
  tl: "@a@b%a002010：以防萬一，\n　　還是好好找一找吧。\n@c0@"
200:
  en: "@a%0%a002020@bIt'd make my day if he was in here, so of course he isn't.\n@c0@"
  ja: "@a@b%a002020「いてくれると　いいけど\n\t期待うす　ね。\n@c0@"
  ko: "@a@b%a002020: 있어 주면 좋겠지만\n기대는 말자구.\n@c0@"
  sl: "@a@b%a002020：要是在就好了。\n　　不过希望渺茫啊。\n@c0@"
  tl: "@a@b%a002020：要是在就好了。\n　　不過希望渺茫啊。\n@c0@"
201:
  en: "@a%0%a002030@bThe old gentleman seems to be awake.\n@c0@"
  ja: "@a@b%a002030「おじいさんは\n\t……おきて\n\tらっしゃるようですね。\n@c0@"
  ko: "@a@b%a002030: 할아버지는\n......일어나\n계신 모양이군요.\n@c0@"
  sl: "@a@b%a002030：老爷爷好像……\n　　醒着的吧。\n@c0@"
  tl: "@a@b%a002030：老爺爺好像……\n　　醒著的吧。\n@c0@"
202:
  en: "@a%0%a002050@bNope. No Prince here.\n@c0@"
  ja: "@a@b%a002050「……いないようですね。\n@c0@"
  ko: "@a@b%a002050: ......없나 보네요.\n@c0@"
  sl: "@a@b%a002050：……好像不在呢。\n@c0@"
  tl: "@a@b%a002050：……好像不在呢。\n@c0@"
203:
  en: "@a%0%a002000@bI'm rulin' this fella out. He ain't hidin' the Prince...\n@c0@"
  ja: "@a@b%a002000「おじいさんは\n\t洗礼を　受けさせたがっている\n\t人だものな。\n@c0@"
  ko: "@a@b%a002000: 이 영감님은\n세례를 받게 하고 싶어하는\n사람이었지.\n@c0@"
  sl: "@a@b%a002000：老爷爷很想让\n　　王子接受洗礼呢。\n@c0@"
  tl: "@a@b%a002000：老爺爺很想讓\n　　王子接受洗禮呢。\n@c0@"
204:
  en: "@a%0%a002000@bHe wants him to go through that royal rite as much as we do.\n@c0@"
  ja: "@a@b%a002000「王子が　おじいさんを\n\tたよって　くることは\n\tありえないな。\n@c0@"
  ko: "@a@b%a002000: 왕자가 영감님을\n찾아왔을 일은\n없겠군.\n@c0@"
  sl: "@a@b%a002000：王子应该不会到\n　　老爷爷这里来求助吧。\n@c0@"
  tl: "@a@b%a002000：王子應該不會到\n　　老爺爺這裡來求助吧。\n@c0@"
205:
  en: "@a%0%a002010@bLet's not ruin things for him by mentioning that the Prince has run off...again.\n@c0@"
  ja: "@a@b%a002010「王子が　逃げたことは\n\tおじいさんには　ナイショに\n\tしておきましょう。\n@c0@"
  ko: "@a@b%a002010: 왕자가 도망쳤단 사실은\n할아버지한텐 비밀로\n해 두자.\n@c0@"
