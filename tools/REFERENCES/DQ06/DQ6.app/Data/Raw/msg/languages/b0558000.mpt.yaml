  tl: "@a@b%a002030：真想進到\n　　洞窟深處去看看啊……\n@c0@"
242:
  en: "@a%0%a002050@bSounds to me like there's been no sign of the Prince...\n@c0@"
  ja: "@a@b%a002050「この人の　話のようすでは\n\tホルス王子は　ここには\n\t来てない　ようですね。\n@c0@"
  ko: "@a@b%a002050: 이 사람의 말을 들어 보니\n홀스 왕자는 이곳에\n오지 않았나 보군요.\n@c0@"
  sl: "@a@b%a002050：按这个人的话说，\n　　荷尔斯王子好像\n　　没有到这里来呢。\n@c0@"
  tl: "@a@b%a002050：按這個人的話說，\n　　荷爾斯王子好像\n　　沒有到這裡來呢。\n@c0@"
