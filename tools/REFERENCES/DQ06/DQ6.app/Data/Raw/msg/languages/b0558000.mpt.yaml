  sl: "@a@b%a002050：哎呀，敌人太厉害了，\n　　所以我打得太投入，\n　　都已经想不起来是怎么打的了。\n@c0@"
  tl: "@a@b%a002050：哎呀，敵人太厲害了，\n　　所以我打得太投入，\n　　都已經想不起來是怎麼打的了。\n@c0@"
28:
  en: "@a%0%a002050@bIt's like I was all befuddled or somethin'.\n@c0@"
  ja: "@a@b%a002050「まるで　こんらん\n\tさせられた　みたいですよ。\n@c0@"
  ko: "@a@b%a002050: 마치 혼란 공격이라도\n당한 것 같더라니까요.\n@c0@"
