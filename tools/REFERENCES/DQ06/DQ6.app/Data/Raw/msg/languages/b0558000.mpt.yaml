  ja: "@a@b%a002010「どうやら　ここにも\n\t王子は　来ていないようね。\n@c0@"
  ko: "@a@b%a002010: 왕자는 여기에도\n안 왔나 봐.\n@c0@"
  sl: "@a@b%a002010：王子好像\n　　没有来这里呢。\n@c0@"
  tl: "@a@b%a002010：王子好像\n　　沒有來這裡呢。\n@c0@"
240:
  en: "@a%0%a002020@bYes, but what happens when royal folk don't WANT to go in there!?\n@c0@"
  ja: "@a@b%a002020「王族なのに　洞くつに\n\t入りたがらない　人がいるのが\n\t問題なのよね……。\n@c0@"
  ko: "@a@b%a002020: 왕족인데도 동굴에\n들어가려고 하지 않는 사람이 있는 게\n문제라구......\n@c0@"
  sl: "@a@b%a002020：明明是王室成员，\n　　却有人不想进那个洞窟，\n　　真是个大问题……\n@c0@"
  tl: "@a@b%a002020：明明是王室成員，\n　　卻有人不想進那個洞窟，\n　　真是個大問題……\n@c0@"
241:
  en: "@a%0%a002030@bI pray we get to delve deeper into Hallowed Hollow soon.\n@c0@"
  ja: "@a@b%a002030「ぜひ　奥まで\n\t行ってみたいものです……。\n@c0@"
  ko: "@a@b%a002030: 꼭 안쪽까지\n들어가 보고 싶습니다......\n@c0@"
