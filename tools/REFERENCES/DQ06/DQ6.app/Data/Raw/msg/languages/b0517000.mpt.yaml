  en: "@a%0%a002000@bWait, he said a ‘young’ couple... A different Evgenya, maybe? I don't know what's what around here any more...\n@c0@"
  ja: "@a@b%a002000「いや……\n\t若いって　いってたな。\n\tってことは　別人か……。\n@c0@"
  ko: "@a@b%a002000: 아니......\n젊다고 그랬는데.\n그럼, 다른 사람인가......\n@c0@"
  sl: "@a@b%a002000：不对……\n　　他说是年轻人。\n　　难道是另外的……\n@c0@"
  tl: "@a@b%a002000：不對……\n　　他說是年輕人。\n　　難道是另外的……\n@c0@"
23:
  en: "@a%0%a002010@bA young girl named Evgenya came through here...and the old lady we met before was also called Evgenya...\n@c0@"
  ja: "@a@b%a002010「若い　ジーナさんと\n\tさっき　私たちの　会った\n\tジーナおばあちゃん……\n@c0@"
  ko: "@a@b%a002010: 젊은 지나 씨와\n아까 우리가 본\n지나 할머니......\n@c0@"
