  en: "@a%0%a002010@bIt's at times like these that people reveal their true colours. And I'm not just talking about their auras.\n@c0@"
  ja: "@a@b%a002010「こういうときにこそ\n\t人の　本当の　強さが\n\tわかるものなのね。\n@c0@"
  ko: "@a@b%a002010: 이런 때야말로\n그 사람의 진짜 저력을\n알 수 있는 법이지.\n@c0@"
