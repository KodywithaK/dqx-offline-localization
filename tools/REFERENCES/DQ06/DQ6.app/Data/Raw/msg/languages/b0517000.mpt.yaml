28:
  en: "@a%0%a002010@bWe won't be able to put the villagers at ease unless we get to the bottom of this bloody water business.\n@c0@"
  ja: "@a@b%a002010「原因が　わからないと\n\tみんなの　不安も　とれないわ。\n@c0@"
