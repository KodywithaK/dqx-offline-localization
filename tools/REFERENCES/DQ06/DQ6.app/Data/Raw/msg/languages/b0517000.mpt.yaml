  tl: "@a@b%a002010：不查明原因，\n　　也就沒法解開大家的不安。\n@c0@"
29:
  en: "@a%0%a002000@bWhoa. Nerves of iron, aye? Me and this fella have a lot in common.\n@c0@"
  ja: "@a@b%a002000「このくらい　神経がふといと\n\t何がおきても　だいじょうぶだろうな。\n@c0@"
  ko: "@a@b%a002000: 이 정도로 신경이 무디면\n무슨 일이 일어나도 끄떡없겠군.\n@c0@"
