  sl: "@a@b%a002010：为了让爱摩尔镇\n　　早日恢复安定，\n　　我们去调查原因吧！\n@c0@"
  tl: "@a@b%a002010：為了讓愛摩爾鎮\n　　早日恢復安定，\n　　我們去調查原因吧！\n@c0@"
19:
  en: "@a%0%a002000@bAye, we'd better go up there and check it out!\n@c0@"
  ja: "@a@b%a002000「わかったぜ　ぼうず！\n\tオレたちが　北の洞くつに　行って\n\t見てきてやるぜ！\n@c0@"
