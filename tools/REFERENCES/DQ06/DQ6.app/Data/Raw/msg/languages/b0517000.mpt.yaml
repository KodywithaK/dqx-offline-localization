  ko: "@a@b%a002010: 그래, 북쪽 동굴에\n빨리 가봐야 해!\n@c0@"
  sl: "@a@b%a002010：没错，\n　　我们快点去北边的洞窟！\n@c0@"
  tl: "@a@b%a002010：沒錯，\n　　我們快點去北邊的洞窟！\n@c0@"
21:
  en: "@a%0%a002000@b‘Evgenya’!? So she WAS here!\n@c0@"
  ja: "@a@b%a002000「ジーナだって！？\n\tやっぱり　ジーナばあさんは\n\tここに　いたのか！？\n@c0@"
  ko: "@a@b%a002000: 지나라고!?\n역시 지나 할머니는\n여기에 있었나!?\n@c0@"
  sl: "@a@b%a002000：吉娜？！\n　　吉娜婆婆果然在这里吧？！\n@c0@"
  tl: "@a@b%a002000：吉娜？！\n　　吉娜婆婆果然在這裡吧？！\n@c0@"
