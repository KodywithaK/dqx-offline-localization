0:
  en: "@a%0%a002000@bNo old ladies? Is this bumpkin blind or somethin'? Ain't he ever seen Evgenya?\n@c0@"
  ja: "@a@b%a002000「ばあさんは　いないって？\n\tこいつ　なに言ってんだ。\n\tジーナばあさんのこと　知らないのか？\n@c0@"
  ko: "@a@b%a002000: 할머니가 없다고?\n무슨 말도 안 되는 소릴.\n지나 할머니를 몰라?\n@c0@"
  sl: "@a@b%a002000：没有老婆婆？\n　　这家伙说什么呢。\n　　他不知道吉娜婆婆吗？\n@c0@"
  tl: "@a@b%a002000：沒有老婆婆？\n　　這傢伙說什麼呢。\n　　他不知道吉娜婆婆嗎？\n@c0@"
1:
  en: "@a%0%a002010@bYou don't think...?\n@c0@"
  ja: "@a@b%a002010「ここは……？\n@c0@"
  ko: "@a@b%a002010: 여기는......?\n@c0@"
  sl: "@a@b%a002010：这里是……\n@c0@"
  tl: "@a@b%a002010：這裡是……\n@c0@"
2:
  en: "@a%0%a002000@bSo this fella comes here all the time, but he expects us to believe he's never seen Evgenya?\n@c0@"
  ja: "@a@b%a002000「お…　おかしいな。\n\t本当に　ジーナばあさんのこと\n\t知らないみたいだぞ。\n@c0@"
  ko: "@a@b%a002000: 이... 이상하군.\n진짜로 지나 할머니를\n모르는 모양이야.\n@c0@"
  sl: "@a@b%a002000：这，真奇怪啊。\n　　好像真的不知道吉娜婆婆。\n@c0@"
  tl: "@a@b%a002000：這，真奇怪啊。\n　　好像真的不知道吉娜婆婆。\n@c0@"
3:
  en: "@a%0%a002010@bI sense we've somehow entered a different world again. This isn't the same church we were in before.\n@c0@"
  ja: "@a@b%a002010「どうやら　私たち\n\tまた　別の世界に　来たようね。\n\tここは　さっきの　教会じゃないわ。\n@c0@"
  ko: "@a@b%a002010: 아무래도 우리는\n또 다른 세계로 온 것 같아.\n여기는 아까 그 성당이 아냐.\n@c0@"
  sl: "@a@b%a002010：看起来，\n　　我们又来到另一个世界了。\n　　这里不是刚才的教会。\n@c0@"
  tl: "@a@b%a002010：看起來，\n　　我們又來到另一個世界了。\n　　這裡不是剛才的教會。\n@c0@"
4:
  en: "@a%0%a002000@bWhat, did the previous priest quit last night or somethin'?\n@c0@"
  ja: "@a@b%a002000「いつの間にか\n\t神父さんも　かわってるぜ。\n@c0@"
  ko: "@a@b%a002000: 어느새\n신부님도 바뀌었군.\n@c0@"
  sl: "@a@b%a002000：什么时候换了神父啊。\n@c0@"
  tl: "@a@b%a002000：什麼時候換了神父啊。\n@c0@"
5:
  en: "@a%0%a002000@bThings have gone from weird to weirder. Where are we?\n@c0@"
  ja: "@a@b%a002000「いったい\n\tここは　どこなんだ？\n\tオレたちは　どこに　いるんだ。\n@c0@"
  ko: "@a@b%a002000: 도대체\n여기가 어디지?\n우리는 어디 있는 거야.\n@c0@"
  sl: "@a@b%a002000：这里究竟是啥地方？\n　　咱们这是在哪里啊。\n@c0@"
  tl: "@a@b%a002000：這裡究竟是啥地方？\n　　咱們這是在哪裡啊。\n@c0@"
6:
  en: "@a%0%a002010@bIt seems as though we went to sleep and woke up in a different world...\n@c0@"
  ja: "@a@b%a002010「ねむって　起きたら\n\tちがう世界に　来ていた……\n\tという　ことみたいね。\n@c0@"
  ko: "@a@b%a002010: 자고 일어나니까\n다른 세계였다......\n이런 상황이구나.\n@c0@"
  sl: "@a@b%a002010：睡了一觉起来之后，\n　　就来到了不同的世界……\n　　好像是这样呢。\n@c0@"
  tl: "@a@b%a002010：睡了一覺起來之後，\n　　就來到了不同的世界……\n　　好像是這樣呢。\n@c0@"
7:
  en: "@a%0%a002000@bWhoa! Is that... Is that what I think it is? Blood...?\n@c0@"
  ja: "@a@b%a002000「ええっ　血！？\n\tいや　そんなはずはないぜ！\n@c0@"
  ko: "@a@b%a002000: 으아, 피!?\n아니, 그럴 리가 없잖아!\n@c0@"
  sl: "@a@b%a002000：什么，血？！\n　　不，应该不会是血！\n@c0@"
  tl: "@a@b%a002000：什麼，血？！\n　　不，應該不會是血！\n@c0@"
8:
  en: "@a%0%a002010@bThis water flows down from that cave upstream, doesn't it?\n@c0@"
  ja: "@a@b%a002010「この水は　たしか\n\t上流の　洞くつから\n\t流れて　きていたはず！\n@c0@"
  ko: "@a@b%a002010: 이 물은 분명히\n상류의 동굴에서\n흘러온 거야!\n@c0@"
  sl: "@a@b%a002010：这水好像是从\n　　上面洞窟流下来的！\n@c0@"
  tl: "@a@b%a002010：這水好像是從\n　　上面洞窟流下來的！\n@c0@"
9:
  en: "@a%0%a002000@bEveryone's in a panic round here. But I'd be anxious too if the local watering hole turned into...that.\n@c0@"
  ja: "@a@b%a002000「みんな　あせりまくってるぜ。\n\tまあ　この水の　色を見たら\n\tしかたないけどな。\n@c0@"
  ko: "@a@b%a002000: 모두 무척 당황하고 있어.\n하긴, 이 물 색깔을 보면\n당연하겠지만.\n@c0@"
  sl: "@a@b%a002000：大家都不知所措。\n　　这也难怪啊，\n　　水都变成这样了。\n@c0@"
  tl: "@a@b%a002000：大家都不知所措。\n　　這也難怪啊，\n　　水都變成這樣了。\n@c0@"
10:
  en: "@a%0%a002010@bThere must be some reason why the water's changed colour. Let's investigate, %a000090!\n@c0@"
  ja: "@a@b%a002010「水の色が　かわった\n\t原因を　調べてみましょう！\n@c0@"
  ko: "@a@b%a002010: 물 색깔이 바뀐\n원인을 알아보자!\n@c0@"
  sl: "@a@b%a002010：我们去调查水变色的原因吧！\n@c0@"
  tl: "@a@b%a002010：我們去調查水變色的原因吧！\n@c0@"
11:
  en: "@a%0%a002000@bThis ain't natural, or the current would've cleared it up by now. Somethin' strange is goin' on here!\n@c0@"
  ja: "@a@b%a002000「何かが　流れてきたのなら\n\tすぐに　もとに　もどりそうなものだが\n\tこいつは　ふつうじゃないぜ！\n@c0@"
  ko: "@a@b%a002000: 뭔가가 흘러왔다면\n금방 원래대로 돌아가는 게 정상인데\n이건 예사롭지 않군!\n@c0@"
  sl: "@a@b%a002000：如果是水里混进东西，\n　　应该不久就会复原，\n　　这个情况看起来不简单！\n@c0@"
  tl: "@a@b%a002000：如果是水裡混進東西，\n　　應該不久就會復原，\n　　這個情況看起來不簡單！\n@c0@"
12:
  en: "@a%0%a002010@bThe water has exactly the same colour and consistency as blood...\n@c0@"
  ja: "@a@b%a002010「本当に　血の色みたい……。\n@c0@"
  ko: "@a@b%a002010: 정말 핏빛 같아......\n@c0@"
  sl: "@a@b%a002010：真的很像血色……\n@c0@"
  tl: "@a@b%a002010：真的很像血色……\n@c0@"
13:
  en: "@a%0%a002000@bEveryone needs to stay calm. There's gotta be a good explanation.\n@c0@"
  ja: "@a@b%a002000「しっかりしろ！\n\tそんな　わけ　ないだろ！\n@c0@"
  ko: "@a@b%a002000: 정신 차려!\n그럴 리가 없잖아!\n@c0@"
  sl: "@a@b%a002000：别害怕！\n　　不可能是那样！\n@c0@"
  tl: "@a@b%a002000：別害怕！\n　　不可能是那樣！\n@c0@"
14:
  en: "@a%0%a002010@bI understand the villagers' reactions. This can't be an easy thing to witness...\n@c0@"
  ja: "@a@b%a002010「だれだって　これを見たら\n\tふつうじゃ　いられないわね。\n@c0@"
  ko: "@a@b%a002010: 누구라도 이걸 보면\n놀라는 게 당연해.\n@c0@"
  sl: "@a@b%a002010：看见这种情况，\n　　大家都不可能平静吧。\n@c0@"
  tl: "@a@b%a002010：看見這種情況，\n　　大家都不可能平靜吧。\n@c0@"
15:
  en: "@a%0%a002000@bWhatever they cook better be well-done. Anythin' rare would just remind people of the river...\n@c0@"
  ja: "@a@b%a002000「いまは　ごはんとか\n\tそんな　場合じゃないだろ！\n@c0@"
  ko: "@a@b%a002000: 지금은 밥이니 뭐니\n할 때가 아니잖아!\n@c0@"
  sl: "@a@b%a002000：这种时候还想着做饭啊！\n@c0@"
  tl: "@a@b%a002000：這種時候還想著做飯啊！\n@c0@"
16:
  en: "@a%0%a002010@bIt's good to have calm, practical people in the village at times like this.\n@c0@"
  ja: "@a@b%a002010「まあ　ある意味\n\tこういう　れいせいな人がいて\n\t助かるのかもしれないわね……。\n@c0@"
  ko: "@a@b%a002010: 어떤 면에선\n이런 침착한 사람이 있어서\n다행인지도 몰라......\n@c0@"
  sl: "@a@b%a002010：某种意义上来说，\n　　有这样冷静的人，\n　　我们会轻松些……\n@c0@"
  tl: "@a@b%a002010：某種意義上來說，\n　　有這樣冷靜的人，\n　　我們會輕鬆些……\n@c0@"
17:
  en: "@a%0%a002000@bAww, nasty water ain't the end of the world.\n@c0@"
  ja: "@a@b%a002000「しっかりしろよ！\n\t水の色が　かわったくらいで\n\t世界は　ほろんだりしないぜ！\n@c0@"
  ko: "@a@b%a002000: 정신들 차려!\n물 색깔이 변했다고\n세상이 망하는 것도 아니잖아!\n@c0@"
  sl: "@a@b%a002000：别害怕！\n　　只是水变个颜色而已，\n　　世界不会毁灭的！\n@c0@"
  tl: "@a@b%a002000：別害怕！\n　　只是水變個顏色而已，\n　　世界不會毀滅的！\n@c0@"
18:
  en: "@a%0%a002010@bLet's hurry and get to the bottom of this so that the villagers can be at ease again.\n@c0@"
  ja: "@a@b%a002010「早く　アモールの\n\t人たちが　落ちつけるように\n\t原因を　さぐりましょう！\n@c0@"
