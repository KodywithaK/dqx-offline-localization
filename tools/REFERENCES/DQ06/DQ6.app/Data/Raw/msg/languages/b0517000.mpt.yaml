  sl: "@a@b%a002000：这种情况还能做生意，\n　　这份镇定俺最钦佩了。\n@c0@"
  tl: "@a@b%a002000：這種情況還能做生意，\n　　這份鎮定俺最欽佩了。\n@c0@"
