  tl: "@a@b%a002010：就是這樣的場合，\n　　才容易看出一個人\n　　真正的潛力。\n@c0@"
27:
  en: "@a%0%a002000@bThat's the spirit! A real man's gotta do his job, no matter what!\n@c0@"
  ja: "@a@b%a002000「どんなときでも\n\t自分のしごとを　つらぬく！\n\tくうっ　男じゃないか！\n@c0@"
