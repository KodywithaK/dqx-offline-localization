  tl: "@a@b%a002010：這個年輕的吉娜\n　　和我們剛才見過的吉娜婆婆……\n@c0@"
24:
  en: "@a%0%a002010@bSurely there must be some connection? We'd better investigate.\n@c0@"
  ja: "@a@b%a002010「どういう　関係なのか\n\t調べなくてはね。\n@c0@"
  ko: "@a@b%a002010: 어떤 관계인지\n알아봐야 해.\n@c0@"
  sl: "@a@b%a002010：两人之间有怎样的关联，\n　　去调查一下吧。\n@c0@"
  tl: "@a@b%a002010：兩人之間有怎樣的關聯，\n　　去調查一下吧。\n@c0@"
25:
  en: "@a%0%a002000@bAye, he needs all the customers he can get.\n@c0@"
  ja: "@a@b%a002000「こんな中でも　商売するとは\n\tみあげたもんだぜ。\n@c0@"
