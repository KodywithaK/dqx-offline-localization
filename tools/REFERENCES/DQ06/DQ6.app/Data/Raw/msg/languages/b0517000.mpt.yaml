  tl: "@a@b%a002000：神經粗到這種地步，\n　　無論發生什麼都不要緊了吧。\n@c0@"
30:
  en: "@a%0%a002010@bI like his attitude. ‘Stuff’ does indeed happen, after all.\n@c0@"
  ja: "@a@b%a002010「そうね。\n\t人生には　いろいろ　あるものよ。\n@c0@"
  ko: "@a@b%a002010: 맞아.\n인생은 다양하니까.\n@c0@"
  sl: "@a@b%a002010：是啊。\n　　人生的确多姿多彩呢。\n@c0@"
  tl: "@a@b%a002010：是啊。\n　　人生的確多姿多彩呢。\n@c0@"
31:
  en: "@a%0%a002000@bWe'd better not tell him. He might have a heart attack.\n@c0@"
  ja: "@a@b%a002000「じいさんは\n\t知らないほうが　いいぜ。\n@c0@"
  ko: "@a@b%a002000: 영감님은\n모르는 게 좋아.\n@c0@"
  sl: "@a@b%a002000：老爷爷\n　　还是不知道的好。\n@c0@"
  tl: "@a@b%a002000：老爺爺\n　　還是不知道的好。\n@c0@"
32:
  en: "@a%0%a002010@bNo need to worry him. It's best to let him rest.\n@c0@"
