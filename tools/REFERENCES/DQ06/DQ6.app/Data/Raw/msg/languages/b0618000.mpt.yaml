  tl: "@a@b%a002000：澤尼斯王應該也被\n　　封印在這座城的某處。\n　　咱去把他救出來吧！\n@c0@"
47:
  en: "@a%0%a002010@bWe simply must break the seal on Cloudsgate Citadel!\n@c0@"
