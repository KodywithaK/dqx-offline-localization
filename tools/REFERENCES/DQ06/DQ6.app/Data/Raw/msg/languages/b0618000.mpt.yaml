  sl: "@a@b%a002040：梦世界的居民，\n　　却做着现实世界的梦……\n　　不觉得哪里怪怪的吗？\n@c0@"
  tl: "@a@b%a002040：夢世界的居民，\n　　卻做著現實世界的夢……\n　　不覺得哪裡怪怪的嗎？\n@c0@"
222:
