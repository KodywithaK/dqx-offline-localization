  tl: "@a@b%a002000：澤尼斯王？！\n　　他才是這座城真正的王嗎！\n@c0@"
40:
  en: "@a%0%a002010@bSo this castle actually belongs to Lord Zenith, ruler of the dream world...\n@c0@"
  ja: "@a@b%a002010「この　クラウド城は\n\t本当は　夢の世界を　たばねる\n\tゼニス王の　お城なのね。\n@c0@"
