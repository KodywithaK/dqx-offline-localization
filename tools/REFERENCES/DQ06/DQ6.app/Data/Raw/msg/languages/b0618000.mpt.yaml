  sl: "@a@b%a002070：噗噜噗噜！\n@c0@"
  tl: "@a@b%a002070：噗嚕噗嚕！\n@c0@"
39:
  en: "@a%0%a002000@bLord Zenith? That must be the real lord of this joint, aye?\n@c0@"
