  ja: "@a@b%a002000「また　もらっちゃったな。\n\tこいつは　ありがたいぜ。\n@c0@"
  ko: "@a@b%a002000: 또 받아 버렸어.\n이거 정말 고맙군.\n@c0@"
  sl: "@a@b%a002000：又得到了呢。\n　　这可真是感激不尽啊。\n@c0@"
  tl: "@a@b%a002000：又得到了呢。\n　　這可真是感激不盡啊。\n@c0@"
210:
  en: "@a%0%a002010@bThis should give us some peace of mind, even when fighting the toughest enemies.\n@c0@"
  ja: "@a@b%a002010「さあ　これでまた\n\t強い敵とも　安心して\n\t戦えるわね。\n@c0@"
  ko: "@a@b%a002010: 자, 이제 다시\n강한 적과도 안심하고\n싸울 수 있겠군.\n@c0@"
  sl: "@a@b%a002010：这样一来就又可以\n　　放心和强敌作战了呢。\n@c0@"
  tl: "@a@b%a002010：這樣一來就又可以\n　　放心和強敵作戰了呢。\n@c0@"
211:
  en: "@a%0%a002030@bYggdrasil dew yields impressive results.\n@c0@"
  ja: "@a@b%a002030「世界樹のしずくの　きき目は\n\t本当に　すごかったですね。\n@c0@"
