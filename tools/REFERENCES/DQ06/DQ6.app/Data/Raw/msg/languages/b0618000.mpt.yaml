  ko: "@a@b%a002020: 이 수액은\n어디서 나는 걸까?\n@c0@"
  sl: "@a@b%a002020：这滴露水\n　　是从哪里采来的呢？\n@c0@"
  tl: "@a@b%a002020：這滴露水\n　　是從哪裡采來的呢？\n@c0@"
213:
