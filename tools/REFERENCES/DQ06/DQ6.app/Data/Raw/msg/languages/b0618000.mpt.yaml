  sl: "@a@b%a002040：仅仅一滴世界树之露，\n　　就能发挥出极大的疗效啊。\n@c0@"
  tl: "@a@b%a002040：僅僅一滴世界樹之露，\n　　就能發揮出極大的療效啊。\n@c0@"
214:
