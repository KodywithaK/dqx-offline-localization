  ko: "@a@b%a002020: 위나 아래나 그다지\n변함이 없을지도.\n가끔 착각한다니까.\n@c0@"
  sl: "@a@b%a002020：上面和下面\n　　好像没啥区别呢？\n　　有时候都会弄混掉呢。\n@c0@"
  tl: "@a@b%a002020：上面和下面\n　　好像沒啥區別呢？\n　　有時候都會弄混掉呢。\n@c0@"
221:
