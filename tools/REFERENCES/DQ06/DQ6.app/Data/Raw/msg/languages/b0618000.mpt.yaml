  tl: "@a@b%a002000：哎呀，像俺這麼帥氣的\n　　爺們可不多了啊！\n@c0@"
218:
  en: "@a%0%a002010@bIt would seem that young ladies have the same concerns no matter what world we visit.\n@c0@"
  ja: "@a@b%a002010「夢の世界も　現実の世界も\n\t女の子の　考えることは　みな同じね。\n@c0@"
  ko: "@a@b%a002010: 꿈의 세계나 현실 세계나\n여자가 생각하는 건 모두 같구나.\n@c0@"
  sl: "@a@b%a002010：无论梦世界还是现实世界，\n　　女孩子们想的事情都一样呢。\n@c0@"
  tl: "@a@b%a002010：無論夢世界還是現實世界，\n　　女孩子們想的事情都一樣呢。\n@c0@"
219:
  en: "@a%0%a002030@bOnce the world is at peace, she would be more than welcome to visit us.\n@c0@"
  ja: "@a@b%a002030「世界が　平和になったら\n\t１度　遊びに来て　もらいたいですね。\n@c0@"
  ko: "@a@b%a002030: 세계가 평화로워지면\n한번 놀러 오라고 하고 싶군요.\n@c0@"
  sl: "@a@b%a002030：等到世界和平了，\n　　真想邀请她去玩一次呢。\n@c0@"
  tl: "@a@b%a002030：等到世界和平了，\n　　真想邀請她去玩一次呢。\n@c0@"
220:
