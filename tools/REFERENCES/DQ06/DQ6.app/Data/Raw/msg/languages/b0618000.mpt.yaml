  sl: "@a@b%a002050：是打算从\n　　梦世界的城堡开始\n　　逐步支配现实世界吗……\n@c0@"
  tl: "@a@b%a002050：是打算從\n　　夢世界的城堡開始\n　　逐步支配現實世界嗎……\n@c0@"
38:
  en: "@a%0%a002070@bBoing! (jiggle)\n@c0@"
  ja: "@a@b%a002070「プルプルーッ！\n@c0@"
