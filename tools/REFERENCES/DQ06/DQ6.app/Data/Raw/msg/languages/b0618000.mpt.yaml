239:
  en: "@a%0%a002060@b(snarl) Grrrargh... (spit)\n@c0@"
  ja: "@a@b%a002060「ギルル……ン。\n@c0@"
  ko: "@a@b%a002060: 캬르르......릉.\n@c0@"
  sl: "@a@b%a002060：咕噜噜……\n@c0@"
  tl: "@a@b%a002060：咕嚕嚕……\n@c0@"
240:
  en: "@a%0%a002070@b(jiggle) Boing.\n@c0@"
