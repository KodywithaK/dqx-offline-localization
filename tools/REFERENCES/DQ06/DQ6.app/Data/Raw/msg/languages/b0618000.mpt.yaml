  sl: "@a@b%a002060：我……感谢……\n　　咕噜噜……\n@c0@"
  tl: "@a@b%a002060：我……感謝……\n　　咕嚕嚕……\n@c0@"
216:
  en: "@a%0%a002070@b(slurp) Boing!\n@c0@"
