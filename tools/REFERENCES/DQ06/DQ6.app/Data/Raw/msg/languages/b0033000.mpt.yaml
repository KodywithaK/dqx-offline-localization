  ja: "@a@b＊「ジーナばあちゃんたちは　この町で\n\t再会してから　ずっと　仲良く\n\t暮らしていたよ。\n@c0@"
  ko: "@a@b*: 지나 할머니랑 일리아 할아버지는\n이 마을에서 다시 만난 후로 쭉\n사이좋게 사셨어.\n@c0@"
  sl: "@a@b＊：吉娜婆婆他们\n　　在这个镇子重逢之后，\n　　一直和睦地生活着呢。\n@c0@"
  tl: "@a@b＊：吉娜婆婆他們\n　　在這個鎮子重逢之後，\n　　一直和睦地生活著呢。\n@c0@"
93:
  en: "@a@b*: To think, they both passed away at exactly the same time...\n㈡\n*: The Goddess in Her infinite wisdom must have known they wouldn't want to be separated.\n@c0@"
  ja: "@a@b＊「天に召される時まで　いっしょだなんて\n\t本当に仲がいいっていうか　神さまも\n\tイキなことを　なさるもんだね。\n@c0@"
  ko: "@a@b*: 하늘의 부름까지 동시에 받다니\n사이가 좋은 걸 뛰어넘어서\n신께서도 제법 센스가 있으신걸.\n@c0@"
  sl: "@a@b＊：连去天堂的时候都在一起，\n　　关系真好啊，\n　　神明也真懂得成人之美呢。\n@c0@"
  tl: "@a@b＊：連去天堂的時候都在一起，\n　　關係真好啊，\n　　神明也真懂得成人之美呢。\n@c0@"
94:
  en: "@a@b*: If my old man doesn't know it, then it isn't worth knowing!\n@c0@"
  ja: "@a@b＊「うちのパパ　とっても\n\t物知りでしょ。\n@c0@"
  ko: "@a@b*: 우리 아빠 진짜\n똑똑하지?\n@c0@"
  sl: "@a@b＊：我爸爸很博学哦。\n@c0@"
  tl: "@a@b＊：我爸爸很博學哦。\n@c0@"
95:
  en: "@a@b*: He was always talking to Ilya and Evgenya and taking notes about their stories and travels.\n@c0@"
  ja: "@a@b＊「でも　イリアじいちゃんや\n\tジーナばあちゃんも　いろんな\n\tお話を　してくれたんだ。\n@c0@"
  ko: "@a@b*: 하지만 일리아 할아버지랑\n지나 할머니도 이야기를 많이 해 주셨어.\n@c0@"
  sl: "@a@b＊：不过，伊利亚爷爷\n　　和吉娜婆婆也给我讲了\n　　好多故事呢。\n@c0@"
  tl: "@a@b＊：不過，伊利亞爺爺\n　　和吉娜婆婆也給我講了\n　　好多故事呢。\n@c0@"
96:
  en: "@a@b*: He says they saw a lot of the world — and made off with a lot of treasure!\n@c0@"
  ja: "@a@b＊「世界中を　旅してきた　お話だよ！\n\t宝物が　いっぱい　あって\n\t強いまものと　たたかって。\n@c0@"
  ko: "@a@b*: 전 세계를 여행하는 이야기 말이야!\n보물이 잔뜩 있고\n강한 마물이랑도 싸우고.\n@c0@"
  sl: "@a@b＊：关于环游世界的故事哦！\n　　他们找到了很多宝物，\n　　还跟很厉害的魔物战斗。\n@c0@"
  tl: "@a@b＊：關於環遊世界的故事哦！\n　　他們找到了很多寶物，\n　　還跟很厲害的魔物戰鬥。\n@c0@"
97:
  en: "@a@b*: Now he says they've set off on their final journey. I'll miss not hearing their stories any more...\n@c0@"
  ja: "@a@b＊「でも　おばあちゃんたち　また\n\t旅に出たんだって　パパが　いってた。\n\tちょっぴり　さびしいな……。\n@c0@"
  ko: "@a@b*: 근데 할머니랑 할아버지는 또\n여행을 떠났다고 아빠가 그랬어.\n조금 섭섭해......\n@c0@"
  sl: "@a@b＊：不过爸爸说，\n　　婆婆他们又去旅行了呢。\n　　真有点寂寞啊……\n@c0@"
  tl: "@a@b＊：不過爸爸說，\n　　婆婆他們又去旅行了呢。\n　　真有點寂寞啊……\n@c0@"
98:
  en: "@a@b*: Ah, I see that you have come to visit our town once more. The blessings of the Goddess be upon you!\n@c0@"
  ja: "@a@b＊「おおっ　みなさんは　あの時の。\n\t元気にして　おられましたかな。\n@c0@"
  ko: "@a@b*: 오오, 여러분은 그때 그 분들.\n잘 지내셨습니까?\n@c0@"
  sl: "@a@b＊：哦，是那个时候的各位啊。\n　　过得还不错吧。\n@c0@"
  tl: "@a@b＊：哦，是那個時候的各位啊。\n　　過得還不錯吧。\n@c0@"
99:
  en: "@a@b*: I... I take it you made your way here today in order to visit Evgenya?\n@c0@"
  ja: "@a@b＊「ごほっ！　そ……そういえば\n\t今日は　ジーナさんたちに\n\t会いに　いらしたのですかな？\n@c0@"
  ko: "@a@b*: 으흠! 어......어디 보자.\n오늘은 지나 씨와 일리아 씨를\n만나러 오신 겁니까?\n@c0@"
  sl: "@a@b＊：咳咳！话……话说回来，\n　　今天是来见\n　　吉娜他们的吗？\n@c0@"
  tl: "@a@b＊：咳咳！話……話說回來，\n　　今天是來見\n　　吉娜他們的嗎？\n@c0@"
100:
  en: "@a@b*: I see. Well, there is something I think you should know.\n@c0@"
  ja: "@a@b＊「どちらにしても　あなたたちには\n\tお話　しておいたほうが\n\tよいでしょう。\n@c0@"
  ko: "@a@b---점프---> #033581로\n@c0@"
  sl: "@a@b＊：不管怎么样，\n　　还是先告诉你们吧。\n@c0@"
  tl: "@a@b＊：不管怎麼樣，\n　　還是先告訴你們吧。\n@c0@"
101:
  en: "@a@b*: Ilya and Evgenya...no longer reside here with us...\n@c0@"
  ja: "@a@b＊「そう……　実は\n\tジーナさんと　イリアさんは\n\tもう　ここには　いないのです。\n@c0@"
  ko: "@a@b*: 어찌 됐든 당신들에게는\n이야기를 해 두는 게\n좋겠군요.\n@c0@"
  sl: "@a@b＊：其实……\n　　吉娜和伊利亚\n　　已经不在这里了。\n@c0@"
  tl: "@a@b＊：其實……\n　　吉娜和伊利亞\n　　已經不在這裡了。\n@c0@"
102:
  en: "@a@b*: No, they have not moved away. The Goddess has taken them back to their true home.\n@c0@"
  ja: "@a@b＊「いえ。　旅に出たのではなく\n\t天に　召されたのです\n\tおふたりとも……。\n@c0@"
  ko: "@a@b*: 그래요...... 실은\n지나 씨와 일리아 씨는\n이제 이곳에 없습니다.\n@c0@"
  sl: "@a@b＊：不。两人不是出去旅行了，\n　　而是去了天堂。\n@c0@"
  tl: "@a@b＊：不。兩人不是出去旅行了，\n　　而是去了天堂。\n@c0@"
103:
  en: "@a@b*: They slipped away peacefully in their sleep, weary travellers at the end of their long and fruitful lives.\n@c0@"
  ja: "@a@b＊「ジーナさんも　イリアさんも\n\tかなりの　お年でしたが\n\tいざ　亡くなってみると……\n@c0@"
  ko: "@a@b*: 아니요. 여행을 떠난 게 아니라\n하늘의 부름을 받았습니다.\n두 분 모두......\n@c0@"
  sl: "@a@b＊：吉娜和伊利亚\n　　年纪虽然也不轻了，\n　　但是这么突然去世……\n@c0@"
  tl: "@a@b＊：吉娜和伊利亞\n　　年紀雖然也不輕了，\n　　但是這麼突然去世……\n@c0@"
104:
  en: "@a@b*: The people of Amor have been deeply affected by their loss. Truly, we were blessed to know them both.\n@c0@"
  ja: "@a@b＊「心に　ぽっかりと　穴があいたようで\n\tさびしい　気持ちは　かくせませんね。\n@c0@"
  ko: "@a@b*: 지나 씨도 일리아 씨도\n꽤 연세가 있는 분들이었지만\n막상 가시고 나니......\n@c0@"
  sl: "@a@b＊：我心中就像出现了一个空洞一样，\n　　无法掩饰心中的寂寞啊。\n@c0@"
  tl: "@a@b＊：我心中就像出現了一個空洞一樣，\n　　無法掩飾心中的寂寞啊。\n@c0@"
105:
  en: "@a@b*: But I believe that, with the grace of the Goddess, Ilya and Evgenya live on in the hearts of the people who loved them.\n@c0@"
  ja: "@a@b＊「でも　あの人たちは　今でも\n\t町の人たちの　胸の中で\n\t生きているのです。\n@c0@"
  ko: "@a@b*: 가슴에 구멍이라도 뻥 뚫린 것처럼\n쓸쓸한 마음을 감출 수가 없군요.\n@c0@"
  sl: "@a@b＊：不过，他们如今\n　　都活在镇里人们的心中。\n@c0@"
  tl: "@a@b＊：不過，他們如今\n　　都活在鎮裡人們的心中。\n@c0@"
106:
  en: "@a@b*: Speak to the people of Amor, and you will sense the depth of their feelings.\n@c0@"
  ja: "@a@b＊「２人と　親しかった　人たちに\n\t会って　おゆきなさい。\n@c0@"
  ko: "@a@b*: 하지만 그 사람들은 지금도\n마을 사람들의 가슴속에서\n살아가고 있습니다.\n@c0@"
  sl: "@a@b＊：去见见跟两人\n　　关系亲近的人吧。\n@c0@"
  tl: "@a@b＊：去見見跟兩人\n　　關係親近的人吧。\n@c0@"
107:
  en: "@a@b*: They are sure to tell you their most treasured tales of that remarkable couple.\n@c0@"
  ja: "@a@b＊「きっと　いろいろな　思い出や\n\tなつかしい話が　聞けることでしょう。\n@c0@"
  ko: "@a@b*: 두 사람과 친했던 사람들을\n만나고 가십시오.\n@c0@"
  sl: "@a@b＊：一定能听到很多关于他们的回忆，\n　　还有让人怀恋的故事的。\n@c0@"
  tl: "@a@b＊：一定能聽到很多關於他們的回憶，\n　　還有讓人懷戀的故事的。\n@c0@"
108:
  en: "@a@b*: Ilya and Evgenya, you say? They worked here, but I'm afraid I never got the chance to meet them.\n@c0@"
  ja: "@a@b＊「うん？　ジーナばあさんに\n\tイリアじいさんだって？\n@c0@"
  ko: "@a@b*: 여러 추억과 그리운 이야기들을\n들을 수 있을 겁니다.\n@c0@"
  sl: "@a@b＊：嗯？\n　　吉娜婆婆和伊利亚爷爷？\n@c0@"
  tl: "@a@b＊：嗯？\n　　吉娜婆婆和伊利亞爺爺？\n@c0@"
109:
  en: "@a@b*: By the time I arrived, they had sadly already passed away.\n@c0@"
  ja: "@a@b＊「ああ。　なんでも　オレが来る前に\n\tここで　はたらいてたらしいな。\n@c0@"
  ko: "@a@b*: 응? 지나 할머니와\n일리아 할아버지 말이야?\n@c0@"
  sl: "@a@b＊：啊。在我来之前，\n　　他们好像在这里工作过。\n@c0@"
  tl: "@a@b＊：啊。在我來之前，\n　　他們好像在這裡工作過。\n@c0@"
110:
  en: "@a@b*: But the people of the town have had nothing but wonderful things to say about them.\n@c0@"
  ja: "@a@b＊「オレは　会ったことが　ないんだが\n\t町の人の話だと　よく　はたらいて\n\tみんなに　好かれていたようだぜ。\n@c0@"
  ko: "@a@b*: 아아. 듣자하니 내가 오기 전에\n여기서 일했다지?\n@c0@"
  sl: "@a@b＊：我没见过他们，不过镇上的人们\n　　说他们是勤劳工作的人，\n　　大家好像都喜欢他们呢。\n@c0@"
  tl: "@a@b＊：我沒見過他們，不過鎮上的人們\n　　說他們是勤勞工作的人，\n　　大家好像都喜歡他們呢。\n@c0@"
111:
  en: "@a@b*: I hope I end up being that well-liked in my old age!\n@c0@"
  ja: "@a@b＊「オレも　年とったら\n\t２人みたいに　なりたいもんさね！\n@c0@"
  ko: "@a@b*: 나는 만난 적이 없지만\n마을 사람들 얘기를 들어 보니 일도 잘하고\n모두가 좋아하는 사람들이었다는군.\n@c0@"
  sl: "@a@b＊：等我老了，\n　　也想成为他们俩那样的人啊！\n@c0@"
  tl: "@a@b＊：等我老了，\n　　也想成為他們倆那樣的人啊！\n@c0@"
112:
  ko: "@a@b*: 나도 나이를 먹으면\n그 두 사람처럼 되고 싶어!\n@c0@"
