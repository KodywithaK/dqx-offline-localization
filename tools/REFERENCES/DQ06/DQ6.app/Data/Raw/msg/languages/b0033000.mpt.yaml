0:
  en: "@a@b*: Welcome to Amor, home of the light and refreshing amor seco essence.\n@c0@"
  ja: "@a@b＊「水　きよき町\n\tアモールへ　ようこそ。\n@c0@"
  ko: "@a@b*: 물 맑은 마을\n아모르에 어서 와.\n@c0@"
  sl: "@a@b＊：欢迎来到\n　　清水镇爱摩尔。\n@c0@"
  tl: "@a@b＊：歡迎來到\n　　清水鎮愛摩爾。\n@c0@"
1:
  en: "@a@b*: They say we are at peace, but I cannot shake this feeling of an evil presence...\n@c0@"
  ja: "@a@b＊「平和になったと　いうけれど\n\t邪悪な気配が　消えることは\n\tありません。\n@c0@"
  ko: "@a@b*: 평화로워졌다고 하지만\n사악한 기운은 사라질 줄\n모르고 있습니다.\n@c0@"
  sl: "@a@b＊：虽然世界和平了，\n　　但是邪恶的力量\n　　还没有消失。\n@c0@"
  tl: "@a@b＊：雖然世界和平了，\n　　但是邪惡的力量\n　　還沒有消失。\n@c0@"
2:
  en: "@a@b*: I can only pray the world will soon be as pure and wholesome as Amor's waters.\n@c0@"
  ja: "@a@b＊「１日も早く　このアモールの\n\t水のように　清らかな世界に\n\tなるように　祈っているのです。\n@c0@"
  ko: "@a@b*: 하루라도 빨리 이 아모르의\n물처럼 맑은 세계가\n되길 기도할 뿐입니다.\n@c0@"
  sl: "@a@b＊：我衷心祈祷世界能\n　　早日变得像这爱摩尔的水\n　　一样纯净无瑕。\n@c0@"
  tl: "@a@b＊：我衷心祈禱世界能\n　　早日變得像這愛摩爾的水\n　　一樣純淨無瑕。\n@c0@"
3:
  en: "@a@b*: Heh. Look at them little scamps playin' over there. Warms the cockles of your heart, eh?\n@c0@"
  ja: "@a@b＊「ほれっ　見なされ。\n\t子どもたちが　楽しそうに\n\t遊んでおる。\n@c0@"
  ko: "@a@b*: 저길 보게.\n아이들이 즐겁게\n뛰어 놀고 있다네.\n@c0@"
  sl: "@a@b＊：快看快看，\n　　孩子们玩得真开心啊。\n@c0@"
  tl: "@a@b＊：快看快看，\n　　孩子們玩得真開心啊。\n@c0@"
4:
  en: "@a@b*: Let me be burying a little deeper. There. Is good!\n@c0@"
  ja: "@a@b＊「えいっ！　えいっ！\n\tこれで　よしっ　と！\n@c0@"
  ko: "@a@b*: 이얍! 이얍!\n자, 됐어!\n@c0@"
  sl: "@a@b＊：嘿！嘿！\n　　这样就可以了！\n@c0@"
  tl: "@a@b＊：嘿！嘿！\n　　這樣就可以了！\n@c0@"
5:
  en: "@a@b*: When we finish with the growing up, we will discovering even bigger treasures!\n@c0@"
  ja: "@a@b＊「大きくなって　オトナになったら\n\tもっと　すごい　宝ものを\n\t見つけて　みせるぜ。\n@c0@"
  ko: "@a@b*: 이담에 커서 어른이 되면\n더 대단한 보물을\n찾아내고 말 거야.\n@c0@"
  sl: "@a@b＊：等我长大了，\n　　我一定会找到\n　　更了不起的宝物。\n@c0@"
  tl: "@a@b＊：等我長大了，\n　　我一定會找到\n　　更了不起的寶物。\n@c0@"
6:
  en: "@a@b*: I am going on big treasure hunt. Do not worry — I take you along.\n@c0@"
  ja: "@a@b＊「宝さがしの　旅に出るときには\n\tお前も　つれていって　やるから\n\t心配するなよな。\n@c0@"
  ko: "@a@b*: 보물을 찾으러 떠날 땐\n너도 데려가 줄 테니까\n걱정 말라구.\n@c0@"
  sl: "@a@b＊：踏上寻宝之旅的时候，\n　　我会带上你一起的，\n　　别担心。\n@c0@"
  tl: "@a@b＊：踏上尋寶之旅的時候，\n　　我會帶上你一起的，\n　　別擔心。\n@c0@"
7:
  en: "@a@b*: Let us be going. Priest no like when I play the hooky from church!\n@c0@"
  ja: "@a@b＊「さあ　いくぞ。\n\tそろそろ　帰らないと　神父さまに\n\tおこられちまうからな。\n@c0@"
  ko: "@a@b*: 이제 그만 가자.\n슬슬 돌아가지 않으면 신부님한테\n혼날 거야.\n@c0@"
  sl: "@a@b＊：走吧。\n　　再不回去的话，\n　　神父大人会生气的。\n@c0@"
  tl: "@a@b＊：走吧。\n　　再不回去的話，\n　　神父大人會生氣的。\n@c0@"
8:
  en: "@a@b*: Ack! You wait!\n@c0@"
  ja: "@a@b＊「あーんっ　まってよ！\n@c0@"
  ko: "@a@b*: 으앙~ 기다려!\n@c0@"
  sl: "@a@b＊：啊，等等嘛！\n@c0@"
  tl: "@a@b＊：啊，等等嘛！\n@c0@"
9:
  en: "@a@b*: No, you hurry! You no can follow now, how you expect follow when I big strong grown-up?\n@c0@"
  ja: "@a@b＊「今から　そんなじゃ　オトナになっても\n\tオレに　ついてこれないぞ。\n\tさあっ　早くこいよ！\n@c0@"
  ko: "@a@b*: 벌써부터 그러면 어른이 되어서도\n날 따라올 수 없다구.\n자, 어서 따라와!\n@c0@"
  sl: "@a@b＊：要像现在这样的话，\n　　等长大了你可跟不上我哦。\n　　快来啊！\n@c0@"
  tl: "@a@b＊：要像現在這樣的話，\n　　等長大了你可跟不上我哦。\n　　快來啊！\n@c0@"
10:
  en: "@a@b*: You stop being mean, Ilya!\n@c0@"
  ja: "@a@b＊「もうっ　イリアの　いじわる！\n@c0@"
  ko: "@a@b*: 일리아는 정말 짓궂어!\n@c0@"
  sl: "@a@b＊：伊利亚欺负人！\n@c0@"
  tl: "@a@b＊：伊利亞欺負人！\n@c0@"
11:
  en: "@a@b%0%a000120 examines the area around %A0120%Xhis%Z%B0120%Xher%Z feet.\n@c0@"
  ja: "@a@b%a000120は　足もとを　調べた！\n@c0@"
  ko: "@a@b%a000120%F0120%X는%Y은%Z 발밑을 살펴봤다!\n@c0@"
  sl: "@a@b%a000120调查了脚下！\n@c0@"
  tl: "@a@b%a000120調查了腳下！\n@c0@"
12:
  en: "@a@b%0%a000120 discovers some of the children's precious trinkets buried in the earth.\n@c0@"
  ja: "@a@b%a000120に　とっては　ガラクタだが\n子どもたちの　宝物が　埋まっている！\n@c0@"
  ko: "@a@b%a000120에게는 잡동사니지만\n아이들의 보물이 묻혀 있다!\n@c0@"
  sl: "@a@b地上埋着对%a000120来说只是个破烂，\n但孩子们却视为珍宝的东西！\n@c0@"
  tl: "@a@b地上埋著對%a000120來說只是個破爛，\n但孩子們卻視為珍寶的東西！\n@c0@"
13:
  en: "@a@b%0%a000120 puts the trinkets back in the ground.\n@c0@"
  ja: "@a@b%a000120は　そっと　元にもどしておいた。\n@c0@"
  ko: "@a@b%a000120%F0120%X는%Y은%Z 슬며시 원래대로 돌려놓았다.\n@c0@"
  sl: "@a@b%a000120轻轻地把它放回了原位。\n@c0@"
  tl: "@a@b%a000120輕輕地把它放回了原位。\n@c0@"
14:
  en: "@a@b*: Heh. The kids of Amor have hearts just as pure and refreshing as the water itself!\n@c0@"
  ja: "@a@b＊「子どもたちの心と　アモール川の水。\n\tどちらも　清らかで\n\tすがすがしい　ものよのう。\n@c0@"
  ko: "@a@b*: 아이들의 마음과 아모르 강의 물.\n둘 다 맑고\n깨끗하다네.\n@c0@"
  sl: "@a@b＊：孩童的心灵以及爱摩尔河的水，\n　　都如此干净无瑕，\n　　清新纯洁呢。\n@c0@"
  tl: "@a@b＊：孩童的心靈以及愛摩爾河的水，\n　　都如此乾淨無瑕，\n　　清新純潔呢。\n@c0@"
15:
  en: "@a@b*: Seems like we can hear monsters howling outside of town every night lately.\n@c0@"
  ja: "@a@b＊「最近　夜になると　まものの声が\n\tよく聞こえるのよ。\n@c0@"
  ko: "@a@b*: 요새 밤이 되면 마물 소리가\n자주 들려.\n@c0@"
  sl: "@a@b＊：最近一到晚上，\n　　就会听到魔物的叫声。\n@c0@"
  tl: "@a@b＊：最近一到晚上，\n　　就會聽到魔物的叫聲。\n@c0@"
16:
  en: "@a@b*: So much for our troubles being over...\n@c0@"
  ja: "@a@b＊「この町は　大丈夫かしら……。\n@c0@"
  ko: "@a@b*: 이 마을은 괜찮을까......\n@c0@"
  sl: "@a@b＊：这个镇子不会有事吧……\n@c0@"
  tl: "@a@b＊：這個鎮子不會有事吧……\n@c0@"
17:
  en: "@a@b*: You! Have you heard about the key that can open any door in the world? The ultimate key?\n@c0@"
  ja: "@a@b＊「あなた！　どんなトビラでも\n\t開けてしまう　さいごのカギ\n\tというものを　知ってますか？\n@c0@"
  ko: "@a@b*: 당신! 어떤 문이든\n열 수 있다는 최후의 열쇠라는\n물건을 알고 있습니까?\n@c0@"
  sl: "@a@b＊：你知道吗？有一把\n　　最后的钥匙，\n　　不论什么样的门都能打开。\n@c0@"
  tl: "@a@b＊：你知道嗎？有一把\n　　最後的鑰匙，\n　　不論什麼樣的門都能打開。\n@c0@"
18:
  en: "@a@b*: Oh, you have, huh? Guess the word is out...\n@c0@"
  ja: "@a@b＊「え？　知ってる？\n\tなんだ。　けっこう　有名な話\n\tなんですね。　そっか……。\n@c0@"
  ko: "@a@b*: 네? 알고 있다고요?\n이런. 그렇게 유명한 거였나요?\n그랬군요......\n@c0@"
  sl: "@a@b＊：诶？你知道？\n　　什么啊。这事这么有名呢。\n　　这样啊……\n@c0@"
  tl: "@a@b＊：誒？你知道？\n　　什麼啊。這事這麼有名呢。\n　　這樣啊……\n@c0@"
19:
  en: "@a@b*: Well, get this: word is, the ship carrying the key was sunk by monsters.\n@c0@"
  ja: "@a@b＊「いえね。　ウワサでは　そのカギを\n\tつんだ船が　まものに　おそわれて\n\t海底深くに　沈んだって話です。\n@c0@"
  ko: "@a@b*: 그게 말입니다. 소문으로는 그 열쇠를\n실은 배가 마물의 습격을 받아\n바다 깊은 곳으로 침몰했다는군요.\n@c0@"
  sl: "@a@b＊：没听说过啊。\n　　传说载有那把钥匙的船，\n　　受到了魔物的袭击沉入海底了。\n@c0@"
  tl: "@a@b＊：沒聽說過啊。\n　　傳說載有那把鑰匙的船，\n　　受到了魔物的襲擊沉入海底了。\n@c0@"
20:
  en: "@a@b*: Now it's at the bottom of the sea. No way you're finding it...unless you're a mermaid or something.\n@c0@"
  ja: "@a@b＊「でも　海の底じゃ\n\tもう　さがしようが　ないよなあ。\n\t人魚でもないかぎりは……さ。\n@c0@"
  ko: "@a@b*: 하지만 바다 밑바닥까지\n어떻게 찾으러 가겠습니까?\n사람이 인어도 아니고 말이죠......\n@c0@"
  sl: "@a@b＊：不过，既然沉到了海底，\n　　那就无从找起了吧。\n　　除非你是人鱼……\n@c0@"
  tl: "@a@b＊：不過，既然沉到了海底，\n　　那就無從找起了吧。\n　　除非你是人魚……\n@c0@"
21:
  en: "@a@b*: The man in the house over the bridge said he'd give me all the sweets I can eat if I let him adopt me. Sign me up!\n@c0@"
  ja: "@a@b＊「右の家の　おじちゃんが\n\tようしになったら　おいしい食べものや\n\tお菓子を　いっぱい　くれるって。\n@c0@"
  ko: "@a@b*: 오른쪽 집 아저씨가\n자기 집에 양자로 들어오면 맛있는\n음식이랑 과자를 잔뜩 준대.\n@c0@"
  sl: "@a@b＊：右边那家的叔叔说，\n　　要是做他的养子的话，\n　　就会给我很多好吃的东西还有点心。\n@c0@"
  tl: "@a@b＊：右邊那家的叔叔說，\n　　要是做他的養子的話，\n　　就會給我很多好吃的東西還有點心。\n@c0@"
22:
  en: "@a@b*: I suppose I should be happy things are back to normal, but that bloody water was murder on my nerves. (shudder)\n@c0@"
  ja: "@a@b＊「もとに　もどったから\n\tよかったようなものの　一時は\n\tどうなるかと　思ったよ。\n@c0@"
  ko: "@a@b*: 원래대로 돌아왔기\n망정이지, 한때는 저러다\n큰일 나는 거 아닌가 싶었어.\n@c0@"
  sl: "@a@b＊：能恢复原状就好。\n　　当时我还以为没有希望了。\n@c0@"
  tl: "@a@b＊：能恢復原狀就好。\n　　當時我還以為沒有希望了。\n@c0@"
23:
  en: "@a@b*: Hmm? Ilya and Evgenya? Oh, you mean the kids the church is takin' care of?\n@c0@"
  ja: "@a@b＊「え？　イリアと　ジーナ？\n\tああ　教会で　世話になってる\n\t子どもたちの　ことだね。\n@c0@"
  ko: "@a@b*: 응? 일리아와 지나?\n아아, 성당에서 거둬 주신\n아이들 말이로군.\n@c0@"
  sl: "@a@b＊：诶？伊利亚和吉娜？\n　　啊，是在教会长大的\n　　那两个孩子啊。\n@c0@"
  tl: "@a@b＊：誒？伊利亞和吉娜？\n　　啊，是在教會長大的\n　　那兩個孩子啊。\n@c0@"
24:
  en: "@a@b*: Funny thing about those two...\n@c0@"
  ja: "@a@b＊「しかし　不思議なことが\n\tあるもんだよな。\n@c0@"
  ko: "@a@b*: 그나저나 참\n신기한 일도 다 있지.\n@c0@"
  sl: "@a@b＊：不过，天下之大\n　　无奇不有啊。\n@c0@"
  tl: "@a@b＊：不過，天下之大\n　　無奇不有啊。\n@c0@"
25:
  en: "@a@b*: I can't for the life of me remember when they showed up. It was like — Poof! — and there they were!\n@c0@"
  ja: "@a@b＊「あの子どもたちが　いつから\n\t教会にいるようになったのか\n\tぜんぜん　思い出せないんだ。\n@c0@"
  ko: "@a@b*: 그 아이들이 언제부터\n성당에서 살게 됐는지\n전혀 기억이 나질 않아.\n@c0@"
  sl: "@a@b＊：我完全想不起来\n　　那两个孩子是从\n　　什么时候开始就在教会里的。\n@c0@"
  tl: "@a@b＊：我完全想不起來\n　　那兩個孩子是從\n　　什麼時候開始就在教會裡的。\n@c0@"
26:
  en: "@a@b*: For the love of the Goddess, be quiet! I can't hear myself pray!\n@c0@"
  ja: "@a@b＊「これ　これっ！　そうぞうしい。\n\t少しは　しずかに　しなさい！\n@c0@"
  ko: "@a@b*: 얘들아! 시끄럽잖니.\n조용히 좀 하려무나!\n@c0@"
  sl: "@a@b＊：哎呀哎呀！吵死了。\n　　安静点！\n@c0@"
  tl: "@a@b＊：哎呀哎呀！吵死了。\n　　安靜點！\n@c0@"
27:
  en: "@a@b*: Oh! Er, pardon me. I wasn't talking to you, I was speaking to this child here...\n@c0@"
  ja: "@a@b＊「あっ　これは　失礼。\n\tみなさんに　ではなく　子どもに……。\n@c0@"
  ko: "@a@b*: 앗, 실례했습니다.\n여러분께 한 말이 아니라 아이들한테......\n@c0@"
  sl: "@a@b＊：啊，真是失礼了。\n　　不是说你们，是说孩子们……\n@c0@"
  tl: "@a@b＊：啊，真是失禮了。\n　　不是說你們，是說孩子們……\n@c0@"
28:
  en: "@a@b*: It would be nice if he took his studies more seriously, but at least he's healthy and full of pep.\n@c0@"
  ja: "@a@b＊「少しは　勉強でも　してくれれば\n\tとも思いますが　それはそれ。\n\tやはり子どもは　元気が　なによりです。\n@c0@"
  ko: "@a@b*: 공부나 좀 해 줬으면\n싶기도 했지만 그건 그거고,\n역시 아이들은 건강한 게 최곱니다.\n@c0@"
  sl: "@a@b＊：本来觉得他们至少应该学点东西吧。\n　　不过小孩子健健康康精神饱满，\n　　就再好不过了。\n@c0@"
  tl: "@a@b＊：本來覺得他們至少應該學點東西吧。\n　　不過小孩子健健康康精神飽滿，\n　　就再好不過了。\n@c0@"
29:
  en: "@a@b*: I should count my blessings, I suppose. But enough about my problems...\n@c0@"
  ja: "@a@b＊「さあ。　すっかり　おまたせしました。\n\tおつとめを　いたしましょう。\n@c0@"
  ko: "@a@b*: 많이 기다리시게 했군요.\n그럼 제 소임을 수행하겠습니다.\n@c0@"
  sl: "@a@b＊：让你们久等了。\n　　让我尽到我的职责吧。\n@c0@"
  tl: "@a@b＊：讓你們久等了。\n　　讓我盡到我的職責吧。\n@c0@"
30:
  en: "@a@b*: Let us pray for peace, my child. It is the least we can do for the world's children.\n@c0@"
  ja: "@a@b＊「世界中の　子どもたちのために\n\t世界平和を　祈りながら\n\tおつとめを　いたしましょう。\n@c0@"
  ko: "@a@b*: 전 세계 아이들을 위해\n세계 평화를 기도하며\n제 소임을 수행하겠습니다.\n@c0@"
  sl: "@a@b＊：我会一边为全世界的孩子们\n　　和世界的和平祈祷，\n　　一边尽到我的职责。\n@c0@"
  tl: "@a@b＊：我會一邊為全世界的孩子們\n　　和世界的和平祈禱，\n　　一邊盡到我的職責。\n@c0@"
31:
  en: "@a@b*: Chaaarge! Take that! And that!\n@c0@"
  ja: "@a@b＊「えいっ　えいっ　やあっ！\n@c0@"
  ko: "@a@b*: 이얍! 이얍! 이야압~!\n@c0@"
