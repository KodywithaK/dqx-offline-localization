0:
  en: "@a%0%a002000@bMust be a real riot livin' in a sleepy little village like this...\n@c0@"
  ja: "@a@b%a002000「村の　暮らしってのも\n\t楽しそうだな。\n@c0@"
  ko: "@a@b%a002000: 시골 마을에서 사는 것도\n즐겁겠군.\n@c0@"
  sl: "@a@b%a002000：住在村子里\n　　也挺有意思的啊。\n@c0@"
  tl: "@a@b%a002000：住在村子裡\n　　也挺有意思的啊。\n@c0@"
1:
  en: "@a%0%a002010@bThe village is right in the shadow of the mountain.\n@c0@"
  ja: "@a@b%a002010「村の　北側は\n\t急な　がけなのね。\n@c0@"
  ko: "@a@b%a002010: 마을 북쪽은\n경사가 심한 낭떠러지네.\n@c0@"
  sl: "@a@b%a002010：村子北边\n　　是陡峭的悬崖呢。\n@c0@"
  tl: "@a@b%a002010：村子北邊\n　　是陡峭的懸崖呢。\n@c0@"
2:
  en: "@a%0%a002020@bI'd probably die of boredom if I lived here.\n@c0@"
  ja: "@a@b%a002020「あたし　もし\n\tこういうところに　住んだら\n\tたいくつしちゃうかも。\n@c0@"
  ko: "@a@b%a002020: 내가 만약\n이런 곳에 산다면\n심심해서 못 견딜 거야.\n@c0@"
  sl: "@a@b%a002020：要是我住在\n　　这种地方的话，\n　　可能会觉得无聊吧。\n@c0@"
  tl: "@a@b%a002020：要是我住在\n　　這種地方的話，\n　　可能會覺得無聊吧。\n@c0@"
3:
  en: "@a%0%a002030@bA quiet little village, to be sure — if not for the neighing horses, I might suspect I had gone deaf.\n@c0@"
  ja: "@a@b%a002030「のんびりした　村ですね。\n\t馬の　いななきが　聞こえます。\n@c0@"
  ko: "@a@b%a002030: 한적한 마을이군요.\n말의 울음소리가 들립니다.\n@c0@"
  sl: "@a@b%a002030：真是个悠闲的村子。\n　　能听得见马的嘶鸣呢。\n@c0@"
  tl: "@a@b%a002030：真是個悠閒的村子。\n　　能聽得見馬的嘶鳴呢。\n@c0@"
4:
  en: "@a%0%a002050@bThis really is the middle of nowhere!\n@c0@"
  ja: "@a@b%a002050「しかし　いかにも\n\tいなか　ってところですねー。\n@c0@"
  ko: "@a@b%a002050: 그나저나 정말\n시골 느낌이 나는 곳이군요~\n@c0@"
  sl: "@a@b%a002050：哇啊，\n　　这里乡土气息真浓啊。\n@c0@"
  tl: "@a@b%a002050：哇啊，\n　　這裡鄉土氣息真濃啊。\n@c0@"
5:
  en: "@a%0%a002050@b...Urgh! I just trod on somethin' squelchy.\n@c0@"
  ja: "@a@b%a002050「あ…　いま　私……\n\tなにか　やわらかいモノを\n\tふみました……。\n@c0@"
  ko: "@a@b%a002050: 아... 지금 저......\n뭔가 부드러운 물체를\n밟았습니다......\n@c0@"
  sl: "@a@b%a002050：啊……我刚才……\n　　是不是踩到了个\n　　软软的东西……\n@c0@"
  tl: "@a@b%a002050：啊……我剛才……\n　　是不是踩到了個\n　　軟軟的東西……\n@c0@"
6:
  en: "@a%0%a002000@bHowsworth, aye? Nice name. Kinda rustic 'n' everything like that.\n@c0@"
  ja: "@a@b%a002000「ホルコッタか。\n\t名前も　いなかっぽくて\n\tいいんじゃないか。\n@c0@"
  ko: "@a@b%a002000: 홀코타라.\n이름도 시골스럽고\n좋은걸.\n@c0@"
  sl: "@a@b%a002000：荷尔克塔啊。\n　　名字也这么乡土气，\n　　挺好的。\n@c0@"
  tl: "@a@b%a002000：荷爾克塔啊。\n　　名字也這麼鄉土氣，\n　　挺好的。\n@c0@"
7:
  en: "@a%0%a002010@bSo we're in the nation of Howcastle...\n@c0@"
  ja: "@a@b%a002010「たしか　この国の\n\t名前は　ホルストック\n\tだったわね。\n@c0@"
  ko: "@a@b%a002010: 아마 이 왕국의\n이름은 홀스톡\n이었지?\n@c0@"
  sl: "@a@b%a002010：这个国家的名字，\n　　是叫荷尔斯托克吧。\n@c0@"
  tl: "@a@b%a002010：這個國家的名字，\n　　是叫荷爾斯托克吧。\n@c0@"
8:
  en: "@a%0%a002010@bHowsworth... Howcastle... How convenient!\n@c0@"
  ja: "@a@b%a002010「ホルストックに\n\tホルコッタの村。\n\t覚えやすくて　いいわよね。\n@c0@"
  ko: "@a@b%a002010: 홀스톡에 있는\n홀코타 마을.\n외우기 쉬워서 좋네.\n@c0@"
  sl: "@a@b%a002010：荷尔斯托克，\n　　然后是荷尔克塔村。\n　　还挺好记的呢。\n@c0@"
  tl: "@a@b%a002010：荷爾斯托克，\n　　然後是荷爾克塔村。\n　　還挺好記的呢。\n@c0@"
9:
  en: "@a%0%a002020@bOh, look! All the houses here are made out of wood!\n@c0@"
  ja: "@a@b%a002020「見てみて！\n\tこの　ホルコッタ村の　おうちは\n\tぜんぶ　木で　できているよ。\n@c0@"
  ko: "@a@b%a002020: 저길 봐!\n이 홀코타 마을의 집은\n모두 나무로 지어져 있어.\n@c0@"
  sl: "@a@b%a002020：快看快看！\n　　这个荷尔克塔村的屋子\n　　全是木头搭起来的哦。\n@c0@"
  tl: "@a@b%a002020：快看快看！\n　　這個荷爾克塔村的屋子\n　　全是木頭搭起來的哦。\n@c0@"
10:
  en: "@a%0%a002030@bOne finds beautiful women no matter where one goes. Er... I mean, isn't it time for prayers already?\n@c0@"
  ja: "@a@b%a002030「どこにでも　美人さんが\n\tいるものなんですねえ。\n@c0@"
  ko: "@a@b%a002030: 어디에나 미인은\n있는 법이군요.\n@c0@"
  sl: "@a@b%a002030：真是哪里\n　　都不缺美人呢。\n@c0@"
  tl: "@a@b%a002030：真是哪裡\n　　都不缺美人呢。\n@c0@"
11:
  en: "@a%0%a002050@bI'm thinkin' of investin' in this village — how much is Howsworth worth, d'you think?\n@c0@"
  ja: "@a@b%a002050「この町の　キャッチフレーズ\n\tが　思い浮かびました。\n\tなんてコッタ　ほるコッタ！\n@c0@"
  ko: "@a@b%a002050: 홀코타로 삼행시를 지어 볼까요?\n홀로 코끼리를\n타고 간다네!\n@c0@"
  sl: "@a@b%a002050：我为这个镇子\n　　想了个标语。\n　　何以解忧，荷尔克塔！\n@c0@"
  tl: "@a@b%a002050：我為這個鎮子\n　　想了個標語。\n　　何以解憂，荷爾克塔！\n@c0@"
12:
  en: "@a%0%a002000@bHardy har! That fella cracks me up.\n@c0@"
  ja: "@a@b%a002000「ははっ。\n\tおもしろい　おっさんだな。\n@c0@"
  ko: "@a@b%a002000: 하핫.\n재밌는 아저씨로군.\n@c0@"
  sl: "@a@b%a002000：哈哈。\n　　这大叔真有意思。\n@c0@"
  tl: "@a@b%a002000：哈哈。\n　　這大叔真有意思。\n@c0@"
13:
  en: "@a%0%a002010@bFarming does seem like pretty hard work.\n@c0@"
  ja: "@a@b%a002010「こういう　仕事も\n\tいそがしそうね。\n@c0@"
  ko: "@a@b%a002010: 이런 일도\n참 바쁘겠어.\n@c0@"
  sl: "@a@b%a002010：这种工作也很忙呢。\n@c0@"
  tl: "@a@b%a002010：這種工作也很忙呢。\n@c0@"
14:
  en: "@a%0%a002020@bWhew... I thought he was serious.\n@c0@"
  ja: "@a@b%a002020「本気かと　思った……。\n@c0@"
  ko: "@a@b%a002020: 진짠 줄 알았네......\n@c0@"
  sl: "@a@b%a002020：我差点当真了……\n@c0@"
  tl: "@a@b%a002020：我差點當真了……\n@c0@"
15:
  en: "@a%0%a002030@bJoking aside, there does seem to be a shortage of farmhands around...\n@c0@"
  ja: "@a@b%a002030「人手ぶそく\n\tなんですかねえ。\n@c0@"
  ko: "@a@b%a002030: 일손이\n부족한 걸까요?\n@c0@"
  sl: "@a@b%a002030：因为人手不足吧。\n@c0@"
  tl: "@a@b%a002030：因為人手不足吧。\n@c0@"
16:
  en: "@a%0%a002050@bOld %a002050 can think of worse things than settlin' down here in Howsworth.\n@c0@"
  ja: "@a@b%a002050「ここで　養子になって\n\t暮らすというのも\n\t悪くは　ないですがね。\n@c0@"
  ko: "@a@b%a002050: 여기에 양자로 들어가서\n사는 것도\n나쁘지 않겠는데요.\n@c0@"
  sl: "@a@b%a002050：当他的养子，\n　　在这里过日子\n　　也不错呢。\n@c0@"
  tl: "@a@b%a002050：當他的養子，\n　　在這裡過日子\n　　也不錯呢。\n@c0@"
17:
  en: "@a%0%a002000@bWhoa! That horse has some spirit, aye?\n@c0@"
  ja: "@a@b%a002000「おお　おおっ！\n\t元気な　馬だぜ！\n@c0@"
  ko: "@a@b%a002000: 오옷! 오오옷!\n건강한 말이군!\n@c0@"
  sl: "@a@b%a002000：哦！这马真精神！\n@c0@"
  tl: "@a@b%a002000：哦！這馬真精神！\n@c0@"
18:
  en: "@a%0%a002010@bThe horse probably belongs to that old gentleman over there.\n@c0@"
  ja: "@a@b%a002010「そこにいる　おじさんが\n\t飼っている　馬かしら。\n@c0@"
  ko: "@a@b%a002010: 저기 있는 아저씨가\n키우는 말일까?\n@c0@"
  sl: "@a@b%a002010：是那边的大叔\n　　养的马吧。\n@c0@"
  tl: "@a@b%a002010：是那邊的大叔\n　　養的馬吧。\n@c0@"
19:
  en: "@a%0%a002020@bBetter keep your distance — he might be a biter.\n@c0@"
  ja: "@a@b%a002020「あんまり　ちかよると\n\tけとばされるかもよ。\n@c0@"
  ko: "@a@b%a002020: 너무 가까이 가면\n발굽에 차일지도 모른다구.\n@c0@"
  sl: "@a@b%a002020：要是靠太近的话，\n　　会被它踢翻的吧。\n@c0@"
  tl: "@a@b%a002020：要是靠太近的話，\n　　會被它踢翻的吧。\n@c0@"
20:
  en: "@a%0%a002030@bThat is clearly a well-fed animal.\n@c0@"
  ja: "@a@b%a002030「えいようが\n\tゆきとどいてますね。\n@c0@"
  ko: "@a@b%a002030: 영양분을 충분히\n섭취한 말이군요.\n@c0@"
  sl: "@a@b%a002030：营养充足呢。\n@c0@"
  tl: "@a@b%a002030：營養充足呢。\n@c0@"
21:
  en: "@a%0%a002050@bThat horse is packin' plenty of horsepower.\n@c0@"
  ja: "@a@b%a002050「チカラが　ありそうだなあ。\n@c0@"
  ko: "@a@b%a002050: 제법 힘이 셀 것 같은데요.\n@c0@"
  sl: "@a@b%a002050：力气看起来挺大的呢。\n@c0@"
  tl: "@a@b%a002050：力氣看起來挺大的呢。\n@c0@"
22:
  en: "@a%0%a002000@bThat fella's a farmer through and through, aye? It's written all over his face.\n@c0@"
  ja: "@a@b%a002000「この人　畑仕事が\n\t３度のメシより　好きだって\n\t顔に　かいてあるな。\n@c0@"
  ko: "@a@b%a002000: 이 사람, 밭일을 하는 게\n밥 먹는 것보다 좋다고\n얼굴에 쓰여 있구만.\n@c0@"
  sl: "@a@b%a002000：比起一日三餐，\n　　这个人更喜欢下地干活吧。\n　　他脸上都写着呢。\n@c0@"
  tl: "@a@b%a002000：比起一日三餐，\n　　這個人更喜歡下地幹活吧。\n　　他臉上都寫著呢。\n@c0@"
23:
  en: "@a%0%a002010@bSome work in the open fields might be a nice change of pace from all those dingy dungeons.\n@c0@"
  ja: "@a@b%a002010「くる日も　くる日も\n\t畑のお世話……か。\n\t私には　なんだか　しんせんね。\n@c0@"
  ko: "@a@b%a002010: 날마다\n밭을 가는 생활이라......\n나한텐 왠지 신선한걸.\n@c0@"
  sl: "@a@b%a002010：日复一日地\n　　照看田地啊……\n　　对我来说真是件新鲜事呢。\n@c0@"
  tl: "@a@b%a002010：日復一日地\n　　照看田地啊……\n　　對我來說真是件新鮮事呢。\n@c0@"
24:
  en: "@a%0%a002020@bThirteen years? That'd make him a beginner around these parts!\n@c0@"
  ja: "@a@b%a002020「１３年……\n\tいがいと　若手なのね。\n@c0@"
  ko: "@a@b%a002020: 13년......\n의외로 경력이 짧네.\n@c0@"
  sl: "@a@b%a002020：１３年……\n　　看上去明明这么年轻呢。\n@c0@"
  tl: "@a@b%a002020：１３年……\n　　看上去明明這麼年輕呢。\n@c0@"
25:
  en: "@a%0%a002030@bThat rustic accent can be rather off-putting.\n@c0@"
  ja: "@a@b%a002030「ごせいが\n\tでますねえ。\n@c0@"
  ko: "@a@b%a002030: 열심히\n하시는군요.\n@c0@"
  sl: "@a@b%a002030：真是精力充沛啊。\n@c0@"
  tl: "@a@b%a002030：真是精力充沛啊。\n@c0@"
26:
  en: "@a%0%a002050@bSeems these good folks aren't afraid of gettin' their hands dirty.\n@c0@"
  ja: "@a@b%a002050「見るからに　まじめで\n\tはたらきものの人が\n\t多そうな　町ですねえ。\n@c0@"
  ko: "@a@b%a002050: 척 보기에도 성실하고\n부지런한 사람들이\n많을 것 같은 마을이네요.\n@c0@"
  sl: "@a@b%a002050：看样子这个村子\n　　有很多老实干活的人呢。\n@c0@"
  tl: "@a@b%a002050：看樣子這個村子\n　　有很多老實幹活的人呢。\n@c0@"
27:
  en: "@a%0%a002000@bAye, no use tryin' to turn back the clock.\n@c0@"
  ja: "@a@b%a002000「まあ　若がえったりは\n\tしないだろうなあ。\n@c0@"
  ko: "@a@b%a002000: 뭐, 젊어지지는\n않겠지.\n@c0@"
  sl: "@a@b%a002000：哎，不会返老还童吧。\n@c0@"
  tl: "@a@b%a002000：哎，不會返老還童吧。\n@c0@"
28:
  en: "@a%0%a002010@bI'm sure it's just the ripples on the water that look like wrinkles.\n@c0@"
  ja: "@a@b%a002010「池の水が　ゆれると\n\tそれも　自分の　シワに\n\t見えてしまうかもね。\n@c0@"
  ko: "@a@b%a002010: 연못 물이 흔들리면\n그것도 자기 주름처럼\n보일지도 몰라.\n@c0@"
  sl: "@a@b%a002010：水塘里的水有波纹的话，\n　　看起来就像自己\n　　脸上长了皱纹似的。\n@c0@"
  tl: "@a@b%a002010：水塘裡的水有波紋的話，\n　　看起來就像自己\n　　臉上長了皺紋似的。\n@c0@"
29:
  en: "@a%0%a002020@bI know what he means. Whenever I see my face in the water, I wonder, ‘Is that a pimple?’\n@c0@"
  ja: "@a@b%a002020「水に　うつった\n\tあたしの　カオは……\n\tま　こんなものかな。\n@c0@"
  ko: "@a@b%a002020: 물에 비친\n내 얼굴은......\n이렇게 생겼구나.\n@c0@"
  sl: "@a@b%a002020：水里映出的\n　　我的脸……\n　　唉，就是这么回事啊。\n@c0@"
  tl: "@a@b%a002020：水裡映出的\n　　我的臉……\n　　唉，就是這麼回事啊。\n@c0@"
30:
  en: "@a%0%a002030@bThis is truly a tranquil spot to reflect on one's life.\n@c0@"
  ja: "@a@b%a002030「ものおもいに　ふけるには\n\tよさそうな　場所ですね。\n@c0@"
  ko: "@a@b%a002030: 생각에 잠기기\n좋을 것 같은 장소로군요.\n@c0@"
  sl: "@a@b%a002030：这个地方\n　　很适合沉下心来思考问题呢。\n@c0@"
  tl: "@a@b%a002030：這個地方\n　　很適合沉下心來思考問題呢。\n@c0@"
31:
  en: "@a%0%a002050@bWell, none of us are gettin' any younger.\n@c0@"
  ja: "@a@b%a002050「少しずつ　ですが\n\t見るたびに　時間がたつから\n\tそりゃ　フケますよね。\n@c0@"
  ko: "@a@b%a002050: 볼 때마다 조금씩\n시간이 지날 테니까\n늙기는 하겠죠.\n@c0@"
  sl: "@a@b%a002050：每次看的时候，\n　　时间都在一分一秒慢慢流逝。\n　　当然是会老的哦。\n@c0@"
  tl: "@a@b%a002050：每次看的時候，\n　　時間都在一分一秒慢慢流逝。\n　　當然是會老的哦。\n@c0@"
32:
  en: "@a%0%a002000@bIf we're near the castle, we might as well pay it a visit.\n@c0@"
  ja: "@a@b%a002000「お城まで　近いのなら\n\tちょっと　行ってみてもいいな。\n@c0@"
  ko: "@a@b%a002000: 성이 여기서 가깝다면\n가 봐도 좋겠군.\n@c0@"
  sl: "@a@b%a002000：离那城很近的话，\n　　那就去看看吧。\n@c0@"
  tl: "@a@b%a002000：離那城很近的話，\n　　那就去看看吧。\n@c0@"
33:
  en: "@a%0%a002010@bThe people here seem to enjoy an excellent quality of life.\n@c0@"
  ja: "@a@b%a002010「暮らしぶりは\n\tゆたかな　村のようね。\n@c0@"
  ko: "@a@b%a002010: 제법 풍족한\n마을인가 봐.\n@c0@"
  sl: "@a@b%a002010：这村子的生活状态\n　　真是悠闲安宁呢。\n@c0@"
  tl: "@a@b%a002010：這村子的生活狀態\n　　真是悠閒安寧呢。\n@c0@"
34:
  en: "@a%0%a002020@bI bet every meal at Howcastle is packed with produce from Howsworth.\n@c0@"
  ja: "@a@b%a002020「お城の　食たくは\n\tこの村でとれた　新鮮やさいが\n\tたっぷり　なんでしょうね。\n@c0@"
