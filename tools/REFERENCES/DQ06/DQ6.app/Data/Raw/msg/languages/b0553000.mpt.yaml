  sl: "@a@b%a002010：这个孩子叫他\n　　荷尔斯哥哥呢。\n@c0@"
  tl: "@a@b%a002010：這個孩子叫他\n　　荷爾斯哥哥呢。\n@c0@"
140:
  en: "@a%0%a002020@bOf course he likes the Prince — kids like anyone who plays with them. \n@c0@"
