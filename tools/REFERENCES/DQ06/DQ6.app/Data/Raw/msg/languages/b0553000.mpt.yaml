  sl: "@a@b%a002010：是不是跟王子吵架了啊……\n@c0@"
  tl: "@a@b%a002010：是不是跟王子吵架了啊……\n@c0@"
145:
  en: "@a%0%a002020@bBoy, that soldier looked frazzled.\n@c0@"
