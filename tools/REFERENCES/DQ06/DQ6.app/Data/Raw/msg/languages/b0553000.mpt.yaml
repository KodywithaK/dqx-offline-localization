  sl: "@a@b%a002000：荷尔斯哥哥啊……\n　　他一定很受孩子们的喜爱吧。\n@c0@"
  tl: "@a@b%a002000：荷爾斯哥哥啊……\n　　他一定很受孩子們的喜愛吧。\n@c0@"
139:
  en: "@a%0%a002010@bWell that's one citizen who admires the Prince.\n@c0@"
  ja: "@a@b%a002010「この子は\n\tホルス兄ちゃんって\n\t呼んでいるのね。\n@c0@"
