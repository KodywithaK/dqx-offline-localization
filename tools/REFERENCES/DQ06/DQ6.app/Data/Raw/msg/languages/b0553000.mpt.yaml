  tl: "@a@b%a002030：不管從事什麼工作，\n　　都會有諸多不滿的吧……\n　　唔。\n@c0@"
152:
  en: "@a%0%a002050@bTo be sure, baby-sittin' falls outside a soldier's duty.\n@c0@"
  ja: "@a@b%a002050「ふむふむ\n\tホルス王子の　おもりは\n\t大変だ……と。\n@c0@"
  ko: "@a@b%a002050: 흠흠.\n홀스 왕자를 돌보는 일은\n힘들다고......\n@c0@"
  sl: "@a@b%a002050：唔。\n　　是说保护\n　　荷尔斯王子很辛苦啊……\n@c0@"
  tl: "@a@b%a002050：唔。\n　　是說保護\n　　荷爾斯王子很辛苦啊……\n@c0@"
153:
  en: "@a%0%a002000@bIt's kind of a maze down here, aye?\n@c0@"
