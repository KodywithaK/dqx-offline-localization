  tl: "@a@b%a002010：王子殿下從\n　　地下逃出去？\n　　好在意……\n@c0@"
160:
  en: "@a%0%a002020@bOoh, a secret tunnel! I love this kinda stuff!\n@c0@"
  ja: "@a@b%a002020「ヒミツの　脱出口かあ。\n\tなんか　そういうのって\n\tあたし　ワクワク　しちゃう。\n@c0@"
  ko: "@a@b%a002020: 비밀의 탈출구라.\n왠지 그런 거 보면\n난 가슴이 뛰어.\n@c0@"
  sl: "@a@b%a002020：秘密逃脱口啊。\n　　这种东西\n　　我还真想看一看呢。\n@c0@"
  tl: "@a@b%a002020：秘密逃脫口啊。\n　　這種東西\n　　我還真想看一看呢。\n@c0@"
161:
  en: "@a%0%a002030@bI see. So one can exit the castle by traversing a subterranean passageway...\n@c0@"
  ja: "@a@b%a002030「なるほど　地下通路を\n\t通れば　こっそり　お城の外まで\n\t出られるワケなんですね。\n@c0@"
  ko: "@a@b%a002030: 오호라. 지하 통로를\n통해서 몰래 성 밖으로\n나갈 수 있게끔 되어 있군요.\n@c0@"
  sl: "@a@b%a002030：原来如此，\n　　走地下通道的话，\n　　就可以悄悄地溜出城了。\n@c0@"
  tl: "@a@b%a002030：原來如此，\n　　走地下通道的話，\n　　就可以悄悄地溜出城了。\n@c0@"
162:
  en: "@a%0%a002050@bWhy would a Prince be sneakin' away from his own castle? Old %a002050 hasn't got the foggiest.\n@c0@"
  ja: "@a@b%a002050「脱出　ですか……\n\tなぜ　王子が　脱出する必要が\n\tあるのか　よく　わかりませんが。\n@c0@"
  ko: "@a@b%a002050: 탈출이라......\n왜 왕자가 탈출을 해야 하는지\n잘 모르겠지만.\n@c0@"
  sl: "@a@b%a002050：逃脱啊……\n　　为什么王子一定要逃出去呢，\n　　我真搞不懂。\n@c0@"
  tl: "@a@b%a002050：逃脫啊……\n　　為什麼王子一定要逃出去呢，\n　　我真搞不懂。\n@c0@"
163:
  en: "@a%0%a002000@b‘Impressive’? Nothin' about him is impressive.\n@c0@"
  ja: "@a@b%a002000「大きな声じゃ\n\t言えないが……\n\tなんだ　こいつ！\n@c0@"
  ko: "@a@b%a002000: 큰 소리로\n말할 수는 없지만......\n이 녀석 뭐냐!\n@c0@"
  sl: "@a@b%a002000：虽然不能\n　　大声说出来……\n　　但是这家伙怎么回事啊！\n@c0@"
  tl: "@a@b%a002000：雖然不能\n　　大聲說出來……\n　　但是這傢伙怎麼回事啊！\n@c0@"
164:
  en: "@a%0%a002010@bFinally, an audience with Prince Howard!\n@c0@"
  ja: "@a@b%a002010「やっと　ホルス王子に\n\t会えたわね。\n@c0@"
  ko: "@a@b%a002010: 드디어 홀스 왕자를\n만났네.\n@c0@"
  sl: "@a@b%a002010：终于见到\n　　荷尔斯王子了呢。\n@c0@"
  tl: "@a@b%a002010：終於見到\n　　荷爾斯王子了呢。\n@c0@"
165:
  en: "@a%0%a002020@bThat's Prince Howard? What an ego! Just goes to show, not all princes are dashing!\n@c0@"
  ja: "@a@b%a002020「この子が　ホルス王子？\n\tなんだか　たいどが　大きいわね。\n\tまあ王子じゃ　しかたないか……。\n@c0@"
  ko: "@a@b%a002020: 얘가 홀스 왕자야?\n왠지 태도가 거만한걸.\n뭐, 왕자니까 별 수 없나......\n@c0@"
  sl: "@a@b%a002020：这孩子就是荷尔斯王子？\n　　态度真是傲慢啊。\n　　不过是王子的话就没办法了啊……\n@c0@"
  tl: "@a@b%a002020：這孩子就是荷爾斯王子？\n　　態度真是傲慢啊。\n　　不過是王子的話就沒辦法了啊……\n@c0@"
166:
  en: "@a%0%a002030@bPrince Howard certainly makes quite an impression.\n@c0@"
  ja: "@a@b%a002030「ホルス王子……ですか。\n\t二度と　忘れないほど\n\tいんしょうぶかい方ですね。\n@c0@"
  ko: "@a@b%a002030: 홀스 왕자......로군요.\n두 번 다시 잊지 못할 만큼\n인상 깊은 분입니다.\n@c0@"
  sl: "@a@b%a002030：荷尔斯王子啊……\n　　还真是会给人留下\n　　无法忘记的深刻印象呢。\n@c0@"
  tl: "@a@b%a002030：荷爾斯王子啊……\n　　還真是會給人留下\n　　無法忘記的深刻印象呢。\n@c0@"
167:
  en: "@a%0%a002050@bThat's the Prince!? Bloomin' heck...\n@c0@"
  ja: "@a@b%a002050「はっはっは　って……\n\tこの人が　王子さまー！？\n@c0@"
  ko: "@a@b%a002050: '핫핫핫'은 무슨......\n네? 이 사람이 왕자라구요!?\n@c0@"
  sl: "@a@b%a002050：什么哈哈哈啊……\n　　这人就是王子殿下？！\n@c0@"
  tl: "@a@b%a002050：什麼哈哈哈啊……\n　　這人就是王子殿下？！\n@c0@"
168:
  en: "@a%0%a002000@bA room this fancy is fit for a king, aye?\n@c0@"
  ja: "@a@b%a002000「王さまの部屋\n\tけっこう　りっぱだな。\n@c0@"
  ko: "@a@b%a002000: 왕이 있는 방은\n제법 멋지군.\n@c0@"
  sl: "@a@b%a002000：国王陛下的房间\n　　真是华丽啊。\n@c0@"
  tl: "@a@b%a002000：國王陛下的房間\n　　真是華麗啊。\n@c0@"
169:
  en: "@a%0%a002010@bTuck your shirt in, %a000090 — we're meeting royalty.\n@c0@"
  ja: "@a@b%a002010「みんな　えりもとぐらい\n\tなおしておきましょ。\n@c0@"
  ko: "@a@b%a002010: 모두 옷매무새를\n잘 매만져 두자.\n@c0@"
  sl: "@a@b%a002010：大家整理一下着装吧。\n@c0@"
  tl: "@a@b%a002010：大家整理一下著裝吧。\n@c0@"
170:
  en: "@a%0%a002020@bFix your hair! Don't slouch! Be on your best behaviour!\n@c0@"
  ja: "@a@b%a002020「おぎょうぎ　よく\n\tしてようね。\n@c0@"
  ko: "@a@b%a002020: 예의 바르게\n행동하자구.\n@c0@"
  sl: "@a@b%a002020：要注意礼节哦。\n@c0@"
  tl: "@a@b%a002020：要注意禮節哦。\n@c0@"
171:
  en: "@a%0%a002030@bIt seems strange that passing travellers like us are granted an audience with the King so easily.\n@c0@"
  ja: "@a@b%a002030「通りがかりの　旅人の\n\t私たちが　これほど　すんなり\n\t王さまに　お会いできるとは。\n@c0@"
  ko: "@a@b%a002030: 그저 지나가는 여행자인\n우리가 이렇게 쉽게\n왕을 만날 수 있다니.\n@c0@"
  sl: "@a@b%a002030：像我们这样\n　　过路的旅行者，\n　　居然都能这么顺利见到国王。\n@c0@"
  tl: "@a@b%a002030：像我們這樣\n　　過路的旅行者，\n　　居然都能這麼順利見到國王。\n@c0@"
172:
  en: "@a%0%a002050@bRemember to mind your manners!\n@c0@"
  ja: "@a@b%a002050「だから…\n\tそそうなんか　しませんよね！\n@c0@"
  ko: "@a@b%a002050: 그러니까...\n누가 결례를 범한단 말입니까!\n@c0@"
  sl: "@a@b%a002050：我们不会冒犯的啦！\n@c0@"
  tl: "@a@b%a002050：我們不會冒犯的啦！\n@c0@"
173:
  en: "@a%0%a002000@bI'm not used to gettin' this kinda treatment from the get-go.\n@c0@"
  ja: "@a@b%a002000「こんなに　あっさり\n\tかんげい　してくれるなんて\n\tめずらしいよな。\n@c0@"
  ko: "@a@b%a002000: 이렇게 시원스럽게\n환영해 주다니\n희한한 일이군.\n@c0@"
  sl: "@a@b%a002000：这么爽快地欢迎咱，\n　　真是少见啊。\n@c0@"
  tl: "@a@b%a002000：這麼爽快地歡迎咱，\n　　真是少見啊。\n@c0@"
174:
  en: "@a%0%a002010@bThe Chancellor seems nice.\n@c0@"
  ja: "@a@b%a002010「しんせつそうな　大臣さんね。\n@c0@"
  ko: "@a@b%a002010: 친절해 보이는 대신님이네.\n@c0@"
  sl: "@a@b%a002010：真是个热心的大臣。\n@c0@"
  tl: "@a@b%a002010：真是個熱心的大臣。\n@c0@"
175:
  en: "@a%0%a002020@bHey, um, weren't we here because the King wanted help with something?\n@c0@"
  ja: "@a@b%a002020「ゆっくり　するって……\n\t何か　たのまれるんじゃ\n\tなかったっけ。\n@c0@"
  ko: "@a@b%a002020: 편히 지내다 가라니......\n뭐 부탁하려던 거\n아니었나?\n@c0@"
  sl: "@a@b%a002020：什么去吧……\n　　不是说有什么事情\n　　要拜托我们吗？\n@c0@"
  tl: "@a@b%a002020：什麼去吧……\n　　不是說有什麼事情\n　　要拜託我們嗎？\n@c0@"
176:
  en: "@a%0%a002030@bIt is pleasant indeed to be given such a warm welcome.\n@c0@"
  ja: "@a@b%a002030「かんげいムードですね。\n@c0@"
  ko: "@a@b%a002030: 환영받고 있군요.\n@c0@"
  sl: "@a@b%a002030：很欢迎我们呢。\n@c0@"
  tl: "@a@b%a002030：很歡迎我們呢。\n@c0@"
177:
  en: "@a%0%a002050@bMaybe they don't see our sort very often round these parts.\n@c0@"
  ja: "@a@b%a002050「この　あたりは\n\t旅人が　だれも　来ないほど\n\tいなか　なんですね　きっと。\n@c0@"
  ko: "@a@b%a002050: 이 부근은\n여행자가 아무도 오지 않을 만큼\n시골인가 봅니다.\n@c0@"
  sl: "@a@b%a002050：这一带都\n　　没什么旅行者来啊。\n　　这也太偏远了。\n@c0@"
  tl: "@a@b%a002050：這一帶都\n　　沒什麼旅行者來啊。\n　　這也太偏遠了。\n@c0@"
178:
  en: "@a%0%a002000@bHuh. If she says so. I don't really know the fella.\n@c0@"
  ja: "@a@b%a002000「はあ　そうなのですか……\n\tとしか　言いようが　ないぜ。\n\t王子のこと　よく　知らないしな。\n@c0@"
  ko: "@a@b%a002000: 아, 그렇군요......\n이렇게 말할 수밖에 없잖아.\n왕자를 잘 알지도 못하고 말이야.\n@c0@"
  sl: "@a@b%a002000：呼，这样啊……\n　　除了这个好像也说不出别的话来了。\n　　荷尔斯王子的事情俺也不清楚啊。\n@c0@"
  tl: "@a@b%a002000：呼，這樣啊……\n　　除了這個好像也說不出別的話來了。\n　　荷爾斯王子的事情俺也不清楚啊。\n@c0@"
179:
  en: "@a%0%a002010@bPrince Howard's mother seems like a very kind-hearted lady.\n@c0@"
  ja: "@a@b%a002010「ホルス王子の\n\tおかあさまね。\n\tとても　やさしそうな方だわ。\n@c0@"
  ko: "@a@b%a002010: 홀스 왕자의\n어머니인가 봐.\n아주 자상해 보이는 분인걸.\n@c0@"
  sl: "@a@b%a002010：这位王妃殿下就是\n　　荷尔斯王子的母亲吧。\n　　真是个温柔的人。\n@c0@"
  tl: "@a@b%a002010：這位王妃殿下就是\n　　荷爾斯王子的母親吧。\n　　真是個溫柔的人。\n@c0@"
180:
  en: "@a%0%a002020@bWell, she is his mother, after all. What else would she say?\n@c0@"
  ja: "@a@b%a002020「子供のことを\n\tぜったいてきに　しんらい\n\tしているんだね。\n@c0@"
  ko: "@a@b%a002020: 자기 아이를\n절대적으로 신뢰하고\n있네.\n@c0@"
  sl: "@a@b%a002020：对孩子是\n　　百分之百信赖呢。\n@c0@"
  tl: "@a@b%a002020：對孩子是\n　　百分之百信賴呢。\n@c0@"
181:
  en: "@a%0%a002030@bIt is natural for a mother to be concerned about her son's reputation.\n@c0@"
  ja: "@a@b%a002030「息子さんに　よくない\n\tひょうばんが　たっていることを\n\t心配して　らっしゃるようですね。\n@c0@"
  ko: "@a@b%a002030: 아드님께 좋지 않은\n평판이 따라붙는 걸\n걱정하고 계시는 모양입니다.\n@c0@"
  sl: "@a@b%a002030：好像因为\n　　儿子的口碑不好，\n　　所以感到担心呢。\n@c0@"
  tl: "@a@b%a002030：好像因為\n　　兒子的口碑不好，\n　　所以感到擔心呢。\n@c0@"
182:
  en: "@a%0%a002050@bIt's hard to credit now, but when old %a002050 was a nipper, folks used to call me a coward too.\n@c0@"
  ja: "@a@b%a002050「弱虫かあ……\n\t私も　小さいころ　そう\n\tいわれたこと　ありましたねえ。\n@c0@"
  ko: "@a@b%a002050: 겁쟁이라......\n저도 어릴 때 그런 소릴\n들은 적이 있죠.\n@c0@"
  sl: "@a@b%a002050：胆小鬼啊……\n　　我小时候也有人\n　　这么说过我呢。\n@c0@"
  tl: "@a@b%a002050：膽小鬼啊……\n　　我小時候也有人\n　　這麼說過我呢。\n@c0@"
183:
  en: "@a%0%a002050@bThat's why I rolled my sleeves up and trained myself in the arts of scrappin' and adventurin' and so on.\n@c0@"
  ja: "@a@b%a002050「はんたいに　実力以上に\n\t強いと　思われて\n\t苦労も　しましたっけ……。\n@c0@"
  ko: "@a@b%a002050: 반대로 실력 이상으로\n강할 거라는 오해를 받고\n고생한 적도 있었고요......\n@c0@"
  sl: "@a@b%a002050：为了让他们改变想法，\n　　觉得我很厉害，\n　　真是下了不少功夫呢……\n@c0@"
  tl: "@a@b%a002050：為了讓他們改變想法，\n　　覺得我很厲害，\n　　真是下了不少功夫呢……\n@c0@"
184:
  en: "@a%0%a002050@b...Beg your pardon! Old %a002050 got a bit lost down memory lane for a minute there. Don't mind me!\n@c0@"
  ja: "@a@b%a002050「あ！　すみません。\n\tあまり　私らしくないことを\n\t言ってしまいましたね！\n@c0@"
  ko: "@a@b%a002050: 아! 죄송합니다.\n저답지 않은 말을\n해 버렸네요!\n@c0@"
  sl: "@a@b%a002050：啊！对不起。\n　　我说这话\n　　都不像我自己了！\n@c0@"
  tl: "@a@b%a002050：啊！對不起。\n　　我說這話\n　　都不像我自己了！\n@c0@"
185:
  en: "@a%0%a002000@bI'm no expert on royal etiquette, but shouldn't ya at least hear the King out before you say no?\n@c0@"
  ja: "@a@b%a002000「なんにも　話を　きかずに\n\tことわるのは　さすがに　ちょっと\n\t王さまに　失礼じゃないか？\n@c0@"
  ko: "@a@b%a002000: 아무 말도 듣지 않은 상태로\n거절하는 건 아무래도\n왕에게 실례가 아닐까?\n@c0@"
  sl: "@a@b%a002000：听都不听就拒绝，\n　　对国王陛下有点失礼吧？\n@c0@"
  tl: "@a@b%a002000：聽都不聽就拒絕，\n　　對國王陛下有點失禮吧？\n@c0@"
186:
  en: "@a%0%a002000@bI know it might be tougher to turn him down once he's had his say 'n' everything like that, but still...\n@c0@"
  ja: "@a@b%a002000「まあ　聞いてしまうと\n\tことわりにくい…　みたいな\n\t不安も　あるけどな……。\n@c0@"
  ko: "@a@b%a002000: 뭐, 듣고 나면\n거절하기 힘들어지는 거 아닌가 하는\n불안도 있지만......\n@c0@"
  sl: "@a@b%a002000：唉，不过俺担心\n　　要是听了的话\n　　就不好拒绝了……\n@c0@"
  tl: "@a@b%a002000：唉，不過俺擔心\n　　要是聽了的話\n　　就不好拒絕了……\n@c0@"
187:
  en: "@a%0%a002010@bCome on now %a000090, it won't do any harm just to listen to what he has to say.\n@c0@"
  ja: "@a@b%a002010「どんな　ねがいか\n\tお話ぐらいは　聞いてみても\n\tいいんじゃないかしら？\n@c0@"
  ko: "@a@b%a002010: 어떤 부탁인지\n이야기 정도는 들어 봐도\n괜찮지 않을까?\n@c0@"
  sl: "@a@b%a002010：是个怎样的请求，\n　　听听看也没什么吧？\n@c0@"
  tl: "@a@b%a002010：是個怎樣的請求，\n　　聽聽看也沒什麼吧？\n@c0@"
188:
  en: "@a%0%a002020@b%0%a000090! You can't just say ‘no’ like that!\n@c0@"
  ja: "@a@b%a002020「%a000090\n\tいきなりすぎだよー！\n@c0@"
  ko: "@a@b%a002020: %a000090,\n그렇게 거절하는 게 어딨어~!\n@c0@"
  sl: "@a@b%a002020：%a000090，\n　　你拒绝得太直接了吧！\n@c0@"
  tl: "@a@b%a002020：%a000090，\n　　你拒絕得太直接了吧！\n@c0@"
189:
  en: "@a%0%a002030@bIt is curious that the King would ask for help from travellers who are just passing through.\n@c0@"
  ja: "@a@b%a002030「私たちのような\n\t通りすがりの者に　王じきじきの\n\tたのみごとですから……\n@c0@"
  ko: "@a@b%a002030: 우리 같은\n떠돌이에게 왕이 직접\n하시는 부탁이라......\n@c0@"
  sl: "@a@b%a002030：国王陛下到底\n　　有什么事情想要亲自拜托\n　　我们这样路过的旅行者呢……\n@c0@"
  tl: "@a@b%a002030：國王陛下到底\n　　有什麽事情想要親自拜託\n　　我們這樣路過的旅行者呢……\n@c0@"
190:
  en: "@a%0%a002030@bI must confess that this has rather piqued my curiosity...\n@c0@"
  ja: "@a@b%a002030「私としては　かなり\n\t好奇心が　つのります。\n@c0@"
  ko: "@a@b%a002030: 저로서는 상당히\n호기심이 동합니다.\n@c0@"
  sl: "@a@b%a002030：我好奇起来了呢。\n@c0@"
  tl: "@a@b%a002030：我好奇起來了呢。\n@c0@"
191:
  en: "@a%0%a002050@bSo we've got Howsworth, Howcastle, Howard and Howell. ...Which one was which again...?\n@c0@"
  ja: "@a@b%a002050「ホルストック城には\n\tホルテン王と　ホルス王子ですか\n\tいやー　まちがえそうですね。\n@c0@"
