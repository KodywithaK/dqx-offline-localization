  tl: "@a@b%a002030：這個人做的飯\n　　聞起來真香，\n　　看起來很好吃呢。\n@c0@"
137:
  en: "@a%0%a002050@bSo Prince Howard likes his food, it seems.\n@c0@"
  ja: "@a@b%a002050「ふむふむ\n\tホルスさまは　くいしんぼう\n\t……と。\n@c0@"
  ko: "@a@b%a002050: 흠흠.\n홀스 님은\n먹보인가......\n@c0@"
  sl: "@a@b%a002050：唔。\n　　是说荷尔斯王子\n　　是个大胃王啊……\n@c0@"
  tl: "@a@b%a002050：唔。\n　　是說荷爾斯王子\n　　是個大胃王啊……\n@c0@"
138:
