  tl: "@a@b%a002030：完全無法揣摩\n　　荷爾斯王子究竟\n　　是個怎樣的人啊……\n@c0@"
142:
  en: "@a%0%a002050@bI wonder what games this lad plays with the Prince.\n@c0@"
  ja: "@a@b%a002050「ふむふむ　ホルスさまは\n\tいっしょに　あそんでくれる\n\t……と。\n@c0@"
  ko: "@a@b%a002050: 흠흠.\n홀스 님은\n같이 놀아준다고......\n@c0@"
  sl: "@a@b%a002050：唔。\n　　是说荷尔斯王子殿下\n　　会来陪他一起玩啊……\n@c0@"
  tl: "@a@b%a002050：唔。\n　　是說荷爾斯王子殿下\n　　會來陪他一起玩啊……\n@c0@"
143:
