  ko: "@a@b%a002050: 이 성의 왕자님은\n도박을 좋아하나 보군요!\n@c0@"
  sl: "@a@b%a002050：这座城的王子殿下\n　　喜欢赌博啊！\n@c0@"
  tl: "@a@b%a002050：這座城的王子殿下\n　　喜歡賭博啊！\n@c0@"
133:
  en: "@a%0%a002000@bCrikey! And here I was wonderin' how she knows my old man.\n@c0@"
  ja: "@a@b%a002000「びっくり　したぜ……。\n@c0@"
  ko: "@a@b%a002000: 깜짝이야......\n@c0@"
  sl: "@a@b%a002000：吓俺一跳……\n@c0@"
  tl: "@a@b%a002000：嚇俺一跳……\n@c0@"
134:
  en: "@a%0%a002010@bIt didn't take much to make her snap, did it?\n@c0@"
  ja: "@a@b%a002010「いきなり\n\tおこられたわね。\n@c0@"
