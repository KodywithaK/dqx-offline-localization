  sl: "@a@b%a002020：荷尔斯王子\n　　已经贪吃到了\n　　这种地步了么……\n@c0@"
  tl: "@a@b%a002020：荷爾斯王子\n　　已經貪吃到了\n　　這種地步了麼……\n@c0@"
136:
