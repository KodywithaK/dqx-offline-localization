  en: "@a%0%a002050@bWell, let's head on in!\n@c0@"
  ja: "@a@b%a002050「さあ　さあ。\n\t入れてもらいましょう！\n@c0@"
  ko: "@a@b%a002050: 자, 어서\n안으로 들어갑시다!\n@c0@"
  sl: "@a@b%a002050：我们进去吧！\n@c0@"
  tl: "@a@b%a002050：我們進去吧！\n@c0@"
98:
  en: "@a%0%a002000@bWho said it should be easy or fun? It's a rite, right?\n@c0@"
  ja: "@a@b%a002000「たしかに　ふつうなら\n\tそんなところに　すき好んでは\n\t行かないだろうな。\n@c0@"
  ko: "@a@b%a002000: 뭐, 보통은\n자기가 좋아서 그런 곳에\n가지는 않겠지.\n@c0@"
  sl: "@a@b%a002000：的确啊，\n　　通常情况下谁会想去\n　　那种地方啊。\n@c0@"
  tl: "@a@b%a002000：的確啊，\n　　通常情況下誰會想去\n　　那種地方啊。\n@c0@"
99:
  en: "@a%0%a002010@bSo the Prince is being forced to visit some monster-infested cave?\n@c0@"
  ja: "@a@b%a002010「なにか　まものの出る\n\t洞くつに　行かなきゃいけない\n\t話でもあるのかしら。\n@c0@"
  ko: "@a@b%a002010: 마물이 나오는\n동굴로 가야만 하는\n사정이 있는 걸까?\n@c0@"
  sl: "@a@b%a002010：是有什么必须\n　　要去一个有魔物\n　　出没的洞窟才能办的事情么？\n@c0@"
  tl: "@a@b%a002010：是有什麼必須\n　　要去一個有魔物\n　　出沒的洞窟才能辦的事情麼？\n@c0@"
100:
  en: "@a%0%a002020@bYou mean normal people don't venture into dank caves all the time? I guess that's just us!\n@c0@"
  ja: "@a@b%a002020「あたしたちは\n\tよく行くけど　まあ　そんなに\n\tふつうじゃ　ないか。\n@c0@"
  ko: "@a@b%a002020: 우린\n자주 가는데 그게 그렇게\n보통이 아닌 건가?\n@c0@"
  sl: "@a@b%a002020：我们倒是经常去呢。\n　　不过我们不能算是普通啦……\n@c0@"
  tl: "@a@b%a002020：我們倒是經常去呢。\n　　不過我們不能算是普通啦……\n@c0@"
101:
  en: "@a%0%a002030@bHe seems to be genuinely concerned about the Prince's well-being.\n@c0@"
  ja: "@a@b%a002030「この方は\n\t本気で　心配している\n\tようすですね。\n@c0@"
  ko: "@a@b%a002030: 이분은\n진심으로 걱정하고 있는 것\n같군요.\n@c0@"
  sl: "@a@b%a002030：这个人好像\n　　真的很担心呢。\n@c0@"
  tl: "@a@b%a002030：這個人好像\n　　真的很擔心呢。\n@c0@"
102:
  en: "@a%0%a002050@bTo be honest, old %a002050 doesn't much like dank caves or monsters either...\n@c0@"
  ja: "@a@b%a002050「あたり前の　ことを\n\t言っているだけで　その先が\n\tよく　わかりませんね。\n@c0@"
  ko: "@a@b%a002050: 너무 당연한 말을 하니까\n말한 의도를\n알 수가 없네요.\n@c0@"
  sl: "@a@b%a002050：虽然他说的这些\n　　都是理所当然，\n　　不过没听懂到底是什么事情。\n@c0@"
  tl: "@a@b%a002050：雖然他說的這些\n　　都是理所當然，\n　　不過沒聽懂到底是什麼事情。\n@c0@"
103:
  en: "@a%0%a002000@bSounds like the Prince could stand to grow up a bit, aye?\n@c0@"
  ja: "@a@b%a002000「小さい子供なら\n\tまだ　わかるが　王子は\n\tそれほど　子供じゃないよな。\n@c0@"
  ko: "@a@b%a002000: 어린 꼬마라면\n그나마 알겠는데 왕자는\n그 정도로 어리지 않겠지.\n@c0@"
  sl: "@a@b%a002000：要是小孩子\n　　干这事还能理解。\n　　但是王子可不是小孩子了啊。\n@c0@"
  tl: "@a@b%a002000：要是小孩子\n　　幹這事還能理解。\n　　但是王子可不是小孩子了啊。\n@c0@"
104:
  en: "@a%0%a002010@bThis would seem to be one of the more...laid back...royal families I've encountered...\n@c0@"
  ja: "@a@b%a002010「こんなふうに　言えるのは\n\tこの国の　王家の人たちが\n\tおおらかな　しょうこね。\n@c0@"
  ko: "@a@b%a002010: 이런 식으로 말할 수 있는 건\n이 나라 왕가의 사람들이\n대범하다는 증거일 거야.\n@c0@"
  sl: "@a@b%a002010：能说这种话，\n　　说明王室的人还真是\n　　不拘小节呢。\n@c0@"
  tl: "@a@b%a002010：能說這種話，\n　　說明王室的人還真是\n　　不拘小節呢。\n@c0@"
105:
  en: "@a%0%a002020@bWhat's the Prince need armour for? Wouldn't it just slow him down when he runs screaming from monsters?\n@c0@"
  ja: "@a@b%a002020「スカートめくり！？\n\tそんなこと　されたら　ズボンを\n\tおろしちゃえばいいのよ！\n@c0@"
  ko: "@a@b%a002020: 치마를 들췄다고!?\n그런 걸 당했을 때는\n바지를 내려 버리라구!\n@c0@"
  sl: "@a@b%a002020：掀裙子？！\n　　谁要是这么对老娘，\n　　老娘绝对扒他裤子！\n@c0@"
  tl: "@a@b%a002020：掀裙子？！\n　　誰要是這麼對老娘，\n　　老娘絕對扒他褲子！\n@c0@"
106:
  en: "@a%0%a002030@bI am afraid I do not understand... Why would he want her to see his armour collection?\n@c0@"
  ja: "@a@b%a002030「スカートめくりですか。\n\t私は　やったこと　ないですが\n\t楽しいものなのでしょうか。\n@c0@"
  ko: "@a@b%a002030: 치마를 들췄다고요?\n저는 해 본 적이 없습니다만\n즐거운 일입니까?\n@c0@"
  sl: "@a@b%a002030：掀裙子啊。\n　　我没做过这种事。\n　　很有意思吗？\n@c0@"
  tl: "@a@b%a002030：掀裙子啊。\n　　我沒做過這種事。\n　　很有意思嗎？\n@c0@"
107:
  en: "@a%0%a002050@bIt seems everyone's havin' a pop at poor old Prince Howard.\n@c0@"
  ja: "@a@b%a002050「めちゃくちゃ　いわれてますね。\n\tこの国の　王子。\n@c0@"
  ko: "@a@b%a002050: 불만이 자자하네요.\n이 나라의 왕자.\n@c0@"
  sl: "@a@b%a002050：关于这个国家的王子，\n　　真是众说纷纭呢。\n@c0@"
  tl: "@a@b%a002050：關於這個國家的王子，\n　　真是眾說紛紜呢。\n@c0@"
108:
  en: "@a%0%a002000@bWhy's he askin' us? We just got here.\n@c0@"
  ja: "@a@b%a002000「オレたち\n\tここに　来たばかり　だしなあ。\n\tいきなり　聞かれても……。\n@c0@"
  ko: "@a@b%a002000: 우린\n지금 막 여기 온 참이라고.\n갑자기 그런 걸 묻다니......\n@c0@"
  sl: "@a@b%a002000：咱刚来这里不久，\n　　突然这么问，\n　　咱也……\n@c0@"
  tl: "@a@b%a002000：咱剛來這裡不久，\n　　突然這麼問，\n　　咱也……\n@c0@"
109:
  en: "@a%0%a002010@bThis must be the Prince's weapon instructor.\n@c0@"
  ja: "@a@b%a002010「王子さまの　剣じゅつの\n\t先生なのね　きっと。\n@c0@"
  ko: "@a@b%a002010: 왕자님의 검술\n선생님인가 봐.\n@c0@"
  sl: "@a@b%a002010：好像是教授\n　　王子殿下剑术的老师呢。\n@c0@"
  tl: "@a@b%a002010：好像是教授\n　　王子殿下劍術的老師呢。\n@c0@"
110:
  en: "@a%0%a002020@bYou know, my impression of the Prince is getting worse with each passing moment.\n@c0@"
  ja: "@a@b%a002020「王子さまの　印象が\n\tなんだか　どんどん\n\t悪くなってるんですけど。\n@c0@"
  ko: "@a@b%a002020: 왕자님의 인상이\n점점 더\n나빠지고 있다구.\n@c0@"
  sl: "@a@b%a002020：对王子殿下的印象，\n　　好像变得\n　　越来越不好了呢。\n@c0@"
  tl: "@a@b%a002020：對王子殿下的印象，\n　　好像變得\n　　越來越不好了呢。\n@c0@"
111:
  en: "@a%0%a002030@bI believe I am starting to get the measure of this Prince...\n@c0@"
  ja: "@a@b%a002030「サボりぐせ……\n\tよほど　しょっちゅう　そういう\n\tことが　あるのでしょうね。\n@c0@"
  ko: "@a@b%a002030: 습관적인 농땡이라......\n이런 일이 어지간히\n자주 있나 보군요.\n@c0@"
  sl: "@a@b%a002030：偷懒的毛病……\n　　这种事看来经常发生呢。\n@c0@"
  tl: "@a@b%a002030：偷懶的毛病……\n　　這種事看來經常發生呢。\n@c0@"
112:
  en: "@a%0%a002050@bNo princes to be found here, far as I can see.\n@c0@"
  ja: "@a@b%a002050「私は　見ませんでしたが\n\tなにか？\n@c0@"
  ko: "@a@b%a002050: 저는 못 봤는데\n그게 왜요?\n@c0@"
  sl: "@a@b%a002050：我没有看到呢。\n　　怎么了？\n@c0@"
  tl: "@a@b%a002050：我沒有看到呢。\n　　怎麼了？\n@c0@"
113:
  en: "@a%0%a002000@bHardy har! How about ‘crammed full of cowardice’?\n@c0@"
  ja: "@a@b%a002000「いさましく……ないのか\n\t王子って。\n@c0@"
  ko: "@a@b%a002000: 용맹하지...... 않은가 보군.\n그 왕자.\n@c0@"
  sl: "@a@b%a002000：那王子\n　　不是那么英勇啊……\n@c0@"
  tl: "@a@b%a002000：那王子\n　　不是那麼英勇啊……\n@c0@"
114:
  en: "@a%0%a002010@bWorking for this royal family is not without its problems, it would seem...\n@c0@"
  ja: "@a@b%a002010「王家に　お仕えするのは\n\t気ぐろうも　多いでしょうね。\n@c0@"
  ko: "@a@b%a002010: 왕가를 위해 일하다 보면\n정신적으로 힘든 일도 많을 거야.\n@c0@"
  sl: "@a@b%a002010：侍奉王室，\n　　总是会有身心俱疲的时候呢。\n@c0@"
  tl: "@a@b%a002010：侍奉王室，\n　　總是會有身心俱疲的時候呢。\n@c0@"
115:
  en: "@a%0%a002020@bWow. He's a poet, and boy does he know it!\n@c0@"
  ja: "@a@b%a002020「ここで　ひとりで\n\tなやんでいたのね　この人。\n@c0@"
  ko: "@a@b%a002020: 여기서 혼자\n고민하고 있었구나, 이 사람.\n@c0@"
  sl: "@a@b%a002020：这个人\n　　独自一人在这里烦恼呢。\n@c0@"
  tl: "@a@b%a002020：這個人\n　　獨自一人在這裡煩惱呢。\n@c0@"
116:
  en: "@a%0%a002030@bIt seems Prince Howard's reputation leaves a lot to be desired.\n@c0@"
  ja: "@a@b%a002030「王子の　ひょうばんが\n\tどうにも　よくないですねえ。\n@c0@"
  ko: "@a@b%a002030: 왕자의 평판이\n아주 안 좋은걸요.\n@c0@"
  sl: "@a@b%a002030：大家对王子的\n　　评价好像不太好呢。\n@c0@"
  tl: "@a@b%a002030：大家對王子的\n　　評價好像不太好呢。\n@c0@"
117:
  en: "@a%0%a002050@bHe's right — you shouldn't tell fibs.\n@c0@"
  ja: "@a@b%a002050「ウソは　いけませんよね……。\n@c0@"
  ko: "@a@b%a002050: 거짓말은 안 되죠......\n@c0@"
  sl: "@a@b%a002050：说谎是不对的呢……\n@c0@"
  tl: "@a@b%a002050：說謊是不對的呢……\n@c0@"
118:
  en: "@a%0%a002000@bWhew! I thought he was gonna challenge us to a battle for a second there.\n@c0@"
  ja: "@a@b%a002000「いっしゅん\n\tこの兵士と　戦うのかと　思って\n\tビックリしたぜ！\n@c0@"
  ko: "@a@b%a002000: 순간적으로\n이 병사랑 싸우는 건가 싶어서\n깜짝 놀랐다고!\n@c0@"
  sl: "@a@b%a002000：一瞬间还以为\n　　要跟这个士兵打一架呢。\n　　吓死俺了！\n@c0@"
  tl: "@a@b%a002000：一瞬間還以為\n　　要跟這個士兵打一架呢。\n　　嚇死俺了！\n@c0@"
119:
  en: "@a%0%a002010@bWell, that request came out of nowhere. I wonder what the King needs a hand with?\n@c0@"
  ja: "@a@b%a002010「いきなりの　おさそいね。\n\tどんな　ウデマエを\n\tみこまれたのかしら……。\n@c0@"
  ko: "@a@b%a002010: 갑작스런 권유네.\n어떤 실력을\n기대한 걸까......\n@c0@"
  sl: "@a@b%a002010：突然就被邀请了。\n　　不知道在他看来\n　　我们的实力到底怎样……\n@c0@"
  tl: "@a@b%a002010：突然就被邀請了。\n　　不知道在他看來\n　　我們的實力到底怎樣……\n@c0@"
120:
  en: "@a%0%a002020@bI guess we have time. Why don't we go see what the King has to say?\n@c0@"
  ja: "@a@b%a002020「ヒマでもないけど\n\tいまは　時間があるから\n\t話だけでも　聞いてみる？\n@c0@"
  ko: "@a@b%a002020: 한가한 건 아니지만\n지금은 시간이 좀 있으니까\n이야기나 들어보는 게 어때?\n@c0@"
  sl: "@a@b%a002020：虽然我们事很多，\n　　但这点时间还是有的。\n　　就去看看国王要说什么吧？\n@c0@"
  tl: "@a@b%a002020：雖然我們事很多，\n　　但這點時間還是有的。\n　　就去看看國王要說什麼吧？\n@c0@"
121:
  en: "@a%0%a002030@bThere is nothing to be lost by hearing the King out.\n@c0@"
  ja: "@a@b%a002030「まあ　お話だけでも\n\tうかがってみるのは\n\tかまわないと　思いますが……。\n@c0@"
  ko: "@a@b%a002030: 뭐, 이야기를\n들어 보는 정도는\n괜찮지 않을까 싶습니다만......\n@c0@"
  sl: "@a@b%a002030：要是只是\n　　去听听国王有什么事，\n　　应该没关系吧……\n@c0@"
  tl: "@a@b%a002030：要是只是\n　　去聽聽國王有什麽事，\n　　應該沒關係吧……\n@c0@"
122:
  en: "@a%0%a002050@bDoes that soldier really think we look tough, or was he just butterin' us up?\n@c0@"
  ja: "@a@b%a002050「人を　見る目があるのか\n\tてきとうなのか……。\n\tこの兵隊さんは　どっちでしょう。\n@c0@"
  ko: "@a@b%a002050: 사람을 보는 눈이 있는 건지\n그냥 대충 찍은 건지......\n이 병사는 어느 쪽일까요?\n@c0@"
  sl: "@a@b%a002050：这个士兵\n　　到底是独具慧眼，\n　　还是只是随便说说啊……\n@c0@"
  tl: "@a@b%a002050：這個士兵\n　　到底是獨具慧眼，\n　　還是只是隨便說說啊……\n@c0@"
123:
  en: "@a%0%a002000@bWhat do ya think? Go up and see the King now, or explore the castle a bit longer?\n@c0@"
  ja: "@a@b%a002000「すぐに　上に行って\n\t王さまに会うか　もう少し　あたりを\n\t見て回るか　どうするかな。\n@c0@"
  ko: "@a@b%a002000: 바로 위로 올라가서\n왕을 만날까, 아니면 주변을\n좀 더 둘러볼까?\n@c0@"
  sl: "@a@b%a002000：是要直接\n　　上去见国王陛下呢，\n　　还是再去附近转两圈？\n@c0@"
  tl: "@a@b%a002000：是要直接\n　　上去見國王陛下呢，\n　　還是再去附近轉兩圈？\n@c0@"
124:
  en: "@a%0%a002010@bLet's go upstairs and meet the King.\n@c0@"
  ja: "@a@b%a002010「王さまに　会うなら\n\t階段を　あがりましょうか。\n@c0@"
  ko: "@a@b%a002010: 왕을 만날 거면\n계단으로 올라가면 되겠네.\n@c0@"
  sl: "@a@b%a002010：要想面见国王陛下的话，\n　　就走楼梯上去吧。\n@c0@"
  tl: "@a@b%a002010：要想面見國王陛下的話，\n　　就走樓梯上去吧。\n@c0@"
125:
  en: "@a%0%a002020@bAn audience with the King? No waiting? Let's go!\n@c0@"
  ja: "@a@b%a002020「王さま　じきじきに\n\tめんかいして　くれるんなら\n\t行ってみたいわ。\n@c0@"
  ko: "@a@b%a002020: 왕을 직접\n알현할 수 있다면\n가 보고 싶어.\n@c0@"
  sl: "@a@b%a002020：要是国王陛下\n　　亲自召见的话，\n　　真想去看一看呢。\n@c0@"
  tl: "@a@b%a002020：要是國王陛下\n　　親自召見的話，\n　　真想去看一看呢。\n@c0@"
126:
  en: "@a%0%a002030@bPerhaps we should gather some more information before having an audience with the King...\n@c0@"
  ja: "@a@b%a002030「もう少し　じょうほうを\n\t仕入れてからの方が\n\tいいような　気もしますが……。\n@c0@"
  ko: "@a@b%a002030: 좀 더 정보를\n얻은 다음에 가는 게\n좋을 것 같기도 합니다만......\n@c0@"
  sl: "@a@b%a002030：再多打听一些消息\n　　比较好吧……\n@c0@"
  tl: "@a@b%a002030：再多打聽一些消息\n　　比較好吧……\n@c0@"
127:
  en: "@a%0%a002050@bWhy is it that Kings are always upstairs? You never find 'em downstairs, do you now?\n@c0@"
  ja: "@a@b%a002050「あまり　王さまが\n\t地下にいる　ところって\n\tないですよね。\n@c0@"
  ko: "@a@b%a002050: 왕이 지하에\n있는 곳은 별로\n없네요.\n@c0@"
  sl: "@a@b%a002050：国王陛下一般\n　　不会在地下吧。\n@c0@"
  tl: "@a@b%a002050：國王陛下一般\n　　不會在地下吧。\n@c0@"
128:
  en: "@a%0%a002000@bI wonder if he has to let the Prince win...\n@c0@"
  ja: "@a@b%a002000「この城じゃ\n\t王子との　カードあそびも\n\t仕事のうち　らしいな。\n@c0@"
  ko: "@a@b%a002000: 이 성에서는\n왕자와의 카드 놀이도\n업무의 일환인가 보군.\n@c0@"
  sl: "@a@b%a002000：在这座城里，\n　　陪王子打牌也是\n　　工作的一部分啊。\n@c0@"
  tl: "@a@b%a002000：在這座城裡，\n　　陪王子打牌也是\n　　工作的一部分啊。\n@c0@"
129:
  en: "@a%0%a002010@bOh dear. There's nothing worse than sleep deprivation.\n@c0@"
  ja: "@a@b%a002010「あらあら。\n\tねむれないのは　つらそうね。\n@c0@"
  ko: "@a@b%a002010: 어머나.\n잠을 못 자서 힘들겠어.\n@c0@"
  sl: "@a@b%a002010：哎呀哎呀，\n　　睡不着真难受。\n@c0@"
  tl: "@a@b%a002010：哎呀哎呀，\n　　睡不著真難受。\n@c0@"
130:
  en: "@a%0%a002020@bA prince who plays with queens, kings and aces all night? Sounds like a real joker.\n@c0@"
  ja: "@a@b%a002020「まいばん　カードあそび\n\tしている　王子さま！？\n\tなーんか　ダメなやつって感じね。\n@c0@"
  ko: "@a@b%a002020: 매일 밤 카드 놀이를\n하는 왕자님!?\n구제 불능이네.\n@c0@"
  sl: "@a@b%a002020：王子殿下\n　　每天晚上都要打牌？！\n　　不会是个玩物丧志的家伙吧。\n@c0@"
  tl: "@a@b%a002020：王子殿下\n　　每天晚上都要打牌？！\n　　不會是個玩物喪志的傢伙吧。\n@c0@"
131:
  en: "@a%0%a002030@bI haven't the first clue about card games. I fear I wouldn't last long as a soldier in Howcastle.\n@c0@"
  ja: "@a@b%a002030「私が　兵隊だったら\n\tカードあそび　できないから\n\tクビに　なっていますね。\n@c0@"
  ko: "@a@b%a002030: 제가 병사였다면\n카드 놀이를 못해서\n잘렸겠군요.\n@c0@"
  sl: "@a@b%a002030：要是我是士兵的话，\n　　会因为不会打牌\n　　而被开除的吧。\n@c0@"
  tl: "@a@b%a002030：要是我是士兵的話，\n　　會因為不會打牌\n　　而被開除的吧。\n@c0@"
132:
  en: "@a%0%a002050@bSo the Prince is a gamblin' man, is he?\n@c0@"
