  sl: "@a@b%a002020：小孩子最喜欢\n　　陪自己玩的人了。\n@c0@"
  tl: "@a@b%a002020：小孩子最喜歡\n　　陪自己玩的人了。\n@c0@"
141:
  en: "@a%0%a002030@bThe more I learn about this Prince, the less I feel I know him...\n@c0@"
  ja: "@a@b%a002030「ホルスさんの\n\t人物ぞうが　まったく\n\tつかめません……。\n@c0@"
