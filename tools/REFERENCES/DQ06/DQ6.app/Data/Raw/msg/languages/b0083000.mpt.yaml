  tl: "@a@b＊：我爸爸靠挖金礦\n　　掙了好多好多錢。\n@c0@"
27:
  en: "@a@b*: That's why we live in this here mansion. Whoever said money can't buy happiness must've been dirt poor. Hee hee!\n@c0@"
  ja: "@a@b＊「おかげで　この　おやしきに\n\t住んでます。　なんたって　あなた\n\t世の中　カネですよ！　はっはっ。\n@c0@"
  ko: "@a@b*: 덕분에 이 저택에\n살고 있죠. 뭐니뭐니해도\n세상살이 돈이지요! 하하핫.\n@c0@"
  sl: "@a@b＊：多亏了他，我才能住在\n　　这所大房子里。所以你记住，\n　　这个世界上最重要的就是钱！哈哈。\n@c0@"
