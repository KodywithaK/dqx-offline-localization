  sl: "@a@b＊：嘁！摩根那家伙\n　　真是贪得无厌！\n@c0@"
  tl: "@a@b＊：嘁！摩根那傢伙\n　　真是貪得無厭！\n@c0@"
68:
  en: "@a@b*: He says he can't get the sage's treasure himself, so he sends poor folks like us to do his dirty work.\n@c0@"
  ja: "@a@b＊「自分が　賢者の宝を\n\t取って来られないからって\n\tオレたち　びんぼう人を使って……\n@c0@"
  ko: "@a@b*: 쳇, 모건 녀석\n악덕 장사꾼 주제에!\n@c0@"
  sl: "@a@b＊：自己没办法\n　　拿到贤者的宝物，\n　　就指使我们这些穷人……\n@c0@"
  tl: "@a@b＊：自己沒辦法\n　　拿到賢者的寶物，\n　　就指使我們這些窮人……\n@c0@"
69:
  en: "@a@b*: Hmm? Oh! Ahem... I didn't say nothin', ya hear?\n@c0@"
  ja: "@a@b＊「おっと！　今の話は\n\t聞かなかったことに　してくんな！\n@c0@"
  ko: "@a@b*: 자기가 현자의 보물을\n못 찾아 오니까\n우리처럼 가난한 사람들을 부려서......\n@c0@"
  sl: "@a@b＊：哎呀！刚才的话\n　　你就当做没听到吧！\n@c0@"
  tl: "@a@b＊：哎呀！剛才的話\n　　你就當做沒聽到吧！\n@c0@"
70:
  en: "@a@b*: They say Gainmore's been secretly bribing the soldiers at Gallows Moor.\n@c0@"
  ja: "@a@b＊「モルガンは　牢ごくの町の\n\t兵士に　ひそかに　ワイロを\n\tおくってるらしくて。\n@c0@"
  ko: "@a@b*: 앗! 이 얘기는\n못 들은 걸로 해 줘!\n@c0@"
  sl: "@a@b＊：我听说，摩根私下\n　　给了牢狱之镇的士兵\n　　不少的贿赂。\n@c0@"
  tl: "@a@b＊：我聽說，摩根私下\n　　給了牢獄之鎮的士兵\n　　不少的賄賂。\n@c0@"
71:
  en: "@a@b*: All he wants is information, I hear. Whatever they're telling him, it must be valuable...\n@c0@"
  ja: "@a@b＊「そのかわりに　何か　カネもうけの\n\t情報を　もらってる　という\n\tウワサですよ。\n@c0@"
  ko: "@a@b*: 모건은 감옥 마을의\n병사에게 몰래 뇌물을\n주고 있는 것 같아요.\n@c0@"
  sl: "@a@b＊：之后从士兵那里\n　　打听到了一个\n　　能挣大钱的消息。\n@c0@"
  tl: "@a@b＊：之後從士兵那裡\n　　打聽到了一個\n　　能掙大錢的消息。\n@c0@"
72:
  en: "@a@b*: This whole town reeks of evil. It's like it's possessed, somehow...\n@c0@"
  ja: "@a@b＊「この町は　なにか　邪悪な\n\tニオイに　みちています。　まるで\n\tなにかに　とりつかれているような……。\n@c0@"
  ko: "@a@b*: 그 대신에 뭔가 돈이 될 만한\n정보를 얻는다는\n소문입니다.\n@c0@"
  sl: "@a@b＊：这个城镇总让人觉得\n　　很不舒服，仿佛被某种\n　　邪恶的力量包裹着一样。\n@c0@"
  tl: "@a@b＊：這個城鎮總讓人覺得\n　　很不舒服，仿佛被某種\n　　邪惡的力量包裹著一樣。\n@c0@"
73:
  en: "@a@b*: But what can one nun do about it?\n@c0@"
  ja: "@a@b＊「でも　私のチカラでは\n\tどうすることも　できません。\n@c0@"
  ko: "@a@b*: 이 마을은 뭔가 사악한\n냄새로 가득합니다.\n마치 귀신에 씐 것처럼......\n@c0@"
  sl: "@a@b＊：可是，我却没有\n　　力量去改变什么。\n@c0@"
  tl: "@a@b＊：可是，我卻沒有\n　　力量去改變什麼。\n@c0@"
74:
  en: "@a@b*: What I can do is try to help you along on your journey. With that in mind...\n@c0@"
  ja: "@a@b＊「せめて　あなたの　旅の助けに\n\tなりますよう　私のチカラを\n\tお役立てください。\n@c0@"
  ko: "@a@b*: 하지만 제 힘으로는\n어찌할 수가 없습니다.\n@c0@"
  sl: "@a@b＊：不过，\n　　希望我的力量能为\n　　你的冒险出一份力。\n@c0@"
  tl: "@a@b＊：不過，\n　　希望我的力量能為\n　　你的冒險出一份力。\n@c0@"
75:
  en: "@a@b*: Hello, hello! Welcome to our casino!\n@c0@"
  ja: "@a@b＊「いらっしゃいませ！\n\tカジノへ　ようこそ。\n@c0@"
  ko: "@a@b*: 적어도 당신의 여행에\n도움이 될 수 있도록\n저의 힘을 사용하십시오.\n@c0@"
  sl: "@a@b＊：客人您好！\n　　欢迎光临赌场。\n@c0@"
  tl: "@a@b＊：客人您好！\n　　歡迎光臨賭場。\n@c0@"
76:
  en: "@a@b*: Why go chasing after some silly treasure when you could just kick back in the casino instead?\n@c0@"
  ja: "@a@b＊「お客さん。　わけのわからない\n\t宝さがしより　気楽に　カジノを\n\t楽しんでた方が　いいですよ！\n@c0@"
  ko: "@a@b*: 어서 오십시오!\n카지노에 오신 걸 환영합니다.\n@c0@"
  sl: "@a@b＊：客人啊，与其去做那些\n　　莫名其妙的寻宝工作，还不如\n　　在这里轻松愉快地赌上两把！\n@c0@"
  tl: "@a@b＊：客人啊，與其去做那些\n　　莫名其妙的尋寶工作，還不如\n　　在這裡輕鬆愉快地賭上兩把！\n@c0@"
77:
  en: "@a@b*: I mean, unless you want to end up like that poor fella who drowned in the lake, of course.\n@c0@"
  ja: "@a@b＊「どこかの　誰かさんみたいに\n\t湖に落ちて　死んでもいいってんなら\n\tべつですけどね。\n@c0@"
  ko: "@a@b*: 손님. 영문 모를 보물찾기보다\n그냥 속 편하게 카지노에서\n즐기시는 게 좋다니까요!\n@c0@"
  sl: "@a@b＊：否则的话，搞不好就会\n　　像那个谁家的小谁一样，\n　　掉进湖里死掉了。\n@c0@"
  tl: "@a@b＊：否則的話，搞不好就會\n　　像那個誰家的小誰一樣，\n　　掉進湖裡死掉了。\n@c0@"
78:
  en: "@a@b*: Just having a schooner for luck before I get back on the treasure trail. You'll have one too, aye? Come on, down the hatch!\n@c0@"
  ja: "@a@b＊「宝さがしの　前祝いじゃ。\n\tほれ　あんたも　食え　食え！\n@c0@"
  ko: "@a@b*: 어디 사는 누구처럼\n호수에 빠져서 죽고 싶다면\n모르겠지만요.\n@c0@"
  sl: "@a@b＊：预祝寻宝成功！\n　　你也一起吃啊！吃吧！\n@c0@"
  tl: "@a@b＊：預祝尋寶成功！\n　　你也一起吃啊！吃吧！\n@c0@"
79:
  en: "@a@b*: Ah, if it ain't some fresh meat! Listen here: a fool and his money are easily parted in this town. Stay sharp, ya hear?\n@c0@"
  ja: "@a@b＊「あなた　見かけない顔ね。\n\tこの町じゃ　ゆだんすると　すぐに\n\tお金をとられるから　気をつけてね。\n@c0@"
  ko: "@a@b*: 미리 보물찾기를 축하해야지.\n뭐 하나? 자네도 얼른 먹게나!\n@c0@"
  sl: "@a@b＊：以前没有见过您啊。\n　　在这个镇上可要小心哦，\n　　一不留神钱就会被拿走哟。\n@c0@"
  tl: "@a@b＊：以前沒有見過您啊。\n　　在這個鎮上可要小心哦，\n　　一不留神錢就會被拿走喲。\n@c0@"
80:
  en: "@a@b*: Drat! These machines aren't paying out at all!\n@c0@"
  ja: "@a@b＊「チキショー！　ちっとも\n\t出やしねえ！\n@c0@"
  ko: "@a@b*: 당신, 못 보던 얼굴인데?\n이 마을에서 방심했다간\n돈을 잃을 테니까 조심해.\n@c0@"
  sl: "@a@b＊：可恶！\n　　完全不中啊！\n@c0@"
  tl: "@a@b＊：可惡！\n　　完全不中啊！\n@c0@"
81:
  en: "@a@b*: ‘Winning big has never been easier’!? It's flamin' impossible!\n@c0@"
  ja: "@a@b＊「なにが　たたいて　たたいて\n\tたたけます　だっ！\n@c0@"
  ko: "@a@b*: 젠장! 전혀\n안 터지잖아!\n@c0@"
  sl: "@a@b＊：再这么输下去，\n　　连明天吃饭的钱都没了！\n@c0@"
  tl: "@a@b＊：再這麼輸下去，\n　　連明天吃飯的錢都沒了！\n@c0@"
82:
  en: "@a@b*: See that robe hangin' there? It belonged to a great sage who used to live in this town.\n@c0@"
  ja: "@a@b＊「そこに　かざってある　ローブは\n\t昔　この町に　住んでいた　賢者が\n\t身につけていたものだそうです。\n@c0@"
  ko: "@a@b*: 뭐가 마구마구\n터진다는 거냐고!\n@c0@"
  sl: "@a@b＊：据说那边挂着的长袍\n　　是以前住在这个镇上的\n　　贤者穿过的东西。\n@c0@"
  tl: "@a@b＊：據說那邊掛著的長袍\n　　是以前住在這個鎮上的\n　　賢者穿過的東西。\n@c0@"
83:
  en: "@a@b*: It suits ya, methinks. Fancy buyin' it?\n@c0@"
  ja: "@a@b＊「どうです？　もしも　欲しいなら\n\t売ってあげましょうか？\n@c0@"
  ko: "@a@b*: 거기에 걸려 있는 로브는\n옛날 이 마을에 살았던 현자가\n입던 것이라고 들었습니다.\n@c0@"
  sl: "@a@b＊：怎么样？\n　　想要的话卖给你如何？\n@c0@"
  tl: "@a@b＊：怎麼樣？\n　　想要的話賣給你如何？\n@c0@"
84:
  en: "@a@b*: Hee haw! I was only pullin' your leg!\n@c0@"
  ja: "@a@b＊「わっはっはっ　じょうだんですよ！\n@c0@"
  ko: "@a@b*: 어떻습니까? 혹시 원한다면\n사시겠습니까?\n@c0@"
  sl: "@a@b＊：哈哈哈！跟你开玩笑的！\n@c0@"
  tl: "@a@b＊：哈哈哈！跟你開玩笑的！\n@c0@"
85:
  en: "@a@b*: That robe's my most treasured possession. I wouldn't sell it for all the gold in the world.\n@c0@"
  ja: "@a@b＊「あれは　わが家の宝　ですからね。\n\tどんなに　大金を　つまれても\n\t売るつもりは　ありません。\n@c0@"
  ko: "@a@b*: 와하하하, 농담입니다!\n@c0@"
  sl: "@a@b＊：那是我家的传家宝。\n　　无论谁花多少钱，\n　　我都不会卖的。\n@c0@"
  tl: "@a@b＊：那是我家的傳家寶。\n　　無論誰花多少錢，\n　　我都不會賣的。\n@c0@"
86:
  en: "@a@bA splendid robe is on display. It appears to be imbued with great magical power.\n@c0@"
  ja: "@a@bかなりの魔法力が　こめられていそうな\nローブが　かざってある。\n@c0@"
  ko: "@a@b*: 저건 우리 집안 가보거든요.\n아무리 돈을 싸 들고 와도\n팔 생각은 없습니다.\n@c0@"
  sl: "@a@b挂着一件看起来充满了魔法力的长袍。\n@c0@"
  tl: "@a@b掛著一件看起來充滿了魔法力的長袍。\n@c0@"
87:
  en: "@a@b*: It doesn't matter how much gold you've got... Life in a tiny town like this is duller than dirt.\n@c0@"
  ja: "@a@b＊「いくら　おカネが　あっても\n\tこんな　せまい町の中だけの\n\t生活なんて　たいくつですわ。\n@c0@"
  ko: "@a@b상당한 마력이 깃들어 있는 듯한\n로브가 걸려 있다.\n@c0@"
  sl: "@a@b＊：这镇子太小了，\n　　即使再有钱，\n　　生活久了也没什么意思。\n@c0@"
  tl: "@a@b＊：這鎮子太小了，\n　　即使再有錢，\n　　生活久了也沒什麼意思。\n@c0@"
88:
  en: "@a@b*: But if you try to leave, the monsters'll get you...\n@c0@"
  ja: "@a@b＊「でも　外に出たら　まものが\n\tおそってくるし……\n@c0@"
  ko: "@a@b*: 아무리 돈이 많아도\n이런 조그만 마을 안에서만\n살다 보니 너무 따분해요.\n@c0@"
  sl: "@a@b＊：可是离开城镇的话，\n　　又会被魔物袭击……\n@c0@"
  tl: "@a@b＊：可是離開城鎮的話，\n　　又會被魔物襲擊……\n@c0@"
89:
  en: "@a@b*: And if you rile up the Archfiend, it's a one-way ticket to Gallows Moor and certain death. I'll stick with boredom, thanks...\n@c0@"
  ja: "@a@b＊「大魔王さまに　目をつけられて\n\t牢ごくの町に　入れられたりしたら\n\t死んじゃいますものね。\n@c0@"
  ko: "@a@b*: 하지만 밖에 나가면\n마물이 습격해 오고......\n@c0@"
  sl: "@a@b＊：要是不小心被大魔王大人\n　　看见，抓到牢狱之镇的话，\n　　那就死定了。\n@c0@"
  tl: "@a@b＊：要是不小心被大魔王大人\n　　看見，抓到牢獄之鎮的話，\n　　那就死定了。\n@c0@"
90:
  en: "@a@b*: This is the residence of Morgan Gainmore, the wealthiest man in town.\n@c0@"
  ja: "@a@b＊「ここは　この町　１ばんの\n\tお金持ち　モルガンさまの\n\tおやしきだよ。\n@c0@"
  ko: "@a@b*: 대마왕의 눈 밖에 나서\n감옥 마을에 보내지기라도 하면\n죽어 버릴 거예요.\n@c0@"
  sl: "@a@b＊：这里是这个镇上的\n　　头号富豪\n　　摩根老爷的宅邸。\n@c0@"
  tl: "@a@b＊：這裡是這個鎮上的\n　　頭號富豪\n　　摩根老爺的宅邸。\n@c0@"
91:
  en: "@a@b*: I'm Morgan Gainmore, proprietor of this estate. I suppose you think you have business here?\n@c0@"
  ja: "@a@b＊「私が　この　やしきの主\n\tモルガンだが　なにか用かね？\n@c0@"
  ko: "@a@b*: 여기는 이 마을에서\n가장 부자인 모건 님의\n저택이야.\n@c0@"
  sl: "@a@b＊：我就是这家的主人摩根，\n　　找我有事吗？\n@c0@"
  tl: "@a@b＊：我就是這家的主人摩根，\n　　找我有事嗎？\n@c0@"
92:
  en: "@aMorgan Gainmore@bYou're here to hunt for the treasure, hm? Well, why don't you try looking for it before bothering me with your questions?\n@c0@"
  ja: "@a@bモルガン「どうせ　宝さがしの話だろう。\n\tであれば　まず　自分の足で\n\tさがすことだな。\n@c0@"
  ko: "@a@b*: 내가 이 저택 주인인\n모건이네만 무슨 볼일인가?\n@c0@"
  sl: "@a@b摩根：无非又是寻宝的事情吧？\n　　想要宝物的话，\n　　就先自己去找啊。\n@c0@"
  tl: "@a@b摩根：無非又是尋寶的事情吧？\n　　想要寶物的話，\n　　就先自己去找啊。\n@c0@"
93:
  en: "@aMorgan Gainmore@bWe can talk more after that. Off you go!\n@c0@"
  ja: "@a@bモルガン「話は　そのあとで聞こう。\n\tさあ　出ていってくれ！\n@c0@"
  ko: "@a@b모건: 어차피 보물찾기 이야기겠지.\n그렇다면 먼저 자기 발로\n직접 찾아보도록 해.\n@c0@"
  sl: "@a@b摩根：好好找过之后再来这里吧。\n　　好了，快给我出去！\n@c0@"
  tl: "@a@b摩根：好好找過之後再來這裡吧。\n　　好了，快給我出去！\n@c0@"
94:
  en: "@aMorgan Gainmore@bThen leave at once. I'm far too busy to talk to riff-raff.\n@c0@"
  ja: "@a@bモルガン「ならば　出ていってくれ。\n\tここには　めぐんでやるような物は\n\tなにも　ないぞ。\n@c0@"
  ko: "@a@b모건: 이야기는 그 다음에 듣기로 하지.\n자 그럼 어서 나가 줘!\n@c0@"
  sl: "@a@b摩根：那就请你给我出去！\n　　这里没有什么能施舍给你的。\n@c0@"
  tl: "@a@b摩根：那就請你給我出去！\n　　這裡沒有什麼能施捨給你的。\n@c0@"
95:
  en: "@a@b*: Grrr!\n@c0@"
  ja: "@a@b＊「ガルルル～！\n@c0@"
  ko: "@a@b모건: 그렇다면 어서 나가 주게.\n이곳에 적선할 만한 건\n아무것도 없으니까.\n@c0@"
  sl: "@a@b＊：嗷呜呜呜！\n@c0@"
  tl: "@a@b＊：嗷嗚嗚嗚！\n@c0@"
96:
  en: "@a@b‘Gold things come to those who don't wait!’\n@c0@"
  ja: "@a@b『もとめよ\n　さらば　あたえられん！』\n@c0@"
  ko: "@a@b*: 크르르릉~!\n@c0@"
  sl: "@a@b“祈祷吧！神会护佑你们的！”\n@c0@"
  tl: "@a@b“祈禱吧！神會護佑你們的！”\n@c0@"
97:
  en: "@a@b*: What? You don't even have fifty gold coins?\n@c0@"
  ja: "@a@b＊「なんだ。\n\t５０ゴールドも　ないのかよ。\n@c0@"
  ko: "@a@b''두드려라\n그러면 열릴 것이다!''\n@c0@"
  sl: "@a@b＊：什么？\n　　５０金币都没有？\n@c0@"
  tl: "@a@b＊：什麼？\n　　５０金幣都沒有？\n@c0@"
98:
  en: "@a@b*: Then beat it. Poor folk ain't welcome here!\n@c0@"
  ja: "@a@b＊「カネが　ないなら\n\tさっさと　出てってくんな！\n@c0@"
  ko: "@a@b*: 뭐야.\n50골드도 없어?\n@c0@"
  sl: "@a@b＊：没钱的话，\n　　快点出去吧！\n@c0@"
  tl: "@a@b＊：沒錢的話，\n　　快點出去吧！\n@c0@"
99:
