  ja: "@a@b＊「ムニャムニャ……\n\tカ…　カネ……　カネさえあれば……\n\tぐごー　ぐごー。\n@c0@"
  ko: "@a@b*: 흠냐흠냐......\n도... 돈... 돈만 있으면......\n드르렁드르렁.\n@c0@"
  sl: "@a@b＊：吧唧吧唧……\n　　等、等我有了钱……\n　　呼噜……呼噜……\n@c0@"
  tl: "@a@b＊：吧唧吧唧……\n　　等、等我有了錢……\n　　呼嚕……呼嚕……\n@c0@"
