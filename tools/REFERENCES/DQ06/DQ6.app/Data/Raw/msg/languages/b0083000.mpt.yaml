  tl: "@a@b＊：我家主人摩根老爺\n　　是一位非常嚴厲、\n　　很難打交道的人。\n@c0@"
29:
  en: "@a@b*: Goddess knows how much pain that man has caused the people around here over the years...\n@c0@"
  ja: "@a@b＊「おまけに　がめつくて……\n\t今まで　ずいぶん　多くのひとが\n\t泣かされてるだ。\n@c0@"
  ko: "@a@b*: 게다가 욕심이......\n지금까지 꽤 많은 사람들이\n억울한 일을 당했지.\n@c0@"
