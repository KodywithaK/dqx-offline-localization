  ja: "@a@b＊「入場料を　はらってくれなきゃ！\n\t５０ゴールドに　まけとくよ。\n@c0@"
  ko: "@a@b*: 입장료를 내야지!\n50골드만 내놔.\n@c0@"
  sl: "@a@b＊：别想不花钱就上来！\n　　入场费５０金币。\n@c0@"
  tl: "@a@b＊：別想不花錢就上來！\n　　入場費５０金幣。\n@c0@"
5:
  en: "@a@b*: Heh, heh. Sucker— I mean, thanks!\n@c0@"
  ja: "@a@b＊「へへっ　まいど　どうも！\n@c0@"
  ko: "@a@b*: 헤헷, 고마워서 어쩌나!\n@c0@"
  sl: "@a@b＊：嘿嘿……感谢光顾！\n@c0@"
  tl: "@a@b＊：嘿嘿……感謝光顧！\n@c0@"
6:
