  sl: "@a@b＊：欢迎您再来！\n@c0@"
  tl: "@a@b＊：歡迎您再來！\n@c0@"
14:
  en: "@a@b*: Come again when you're ready to spend!\n@c0@"
  ja: "@a@b＊「また　いつでも　どうぞ！\n@c0@"
  ko: "@a@b*: 언제든지 또 들러줘!\n@c0@"
  sl: "@a@b＊：欢迎您再来！\n@c0@"
  tl: "@a@b＊：歡迎您再來！\n@c0@"
15:
  en: "@a@b*: Listen, gramps! Who said you could hawk your stuff here?\n@c0@"
  ja: "@a@b＊「おい　じじい！\n\tいったい　誰に　ことわって\n\tここで　商売してんだ！？\n@c0@"
  ko: "@a@b*: 이봐, 영감!\n도대체 누구 허락을 받고\n여기서 장사하는 거야!?\n@c0@"
