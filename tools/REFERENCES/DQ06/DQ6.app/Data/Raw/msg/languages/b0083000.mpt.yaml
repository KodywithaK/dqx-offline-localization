  ko: "@a@b*: 어라, 동굴에 가시는 건가요?\n그렇다면 필요한 물건을\n사가는 게 좋을 겁니다!\n@c0@"
  sl: "@a@b＊：哦？要去洞窟吗？\n　　那还是买些必要的\n　　东西以防万一吧！\n@c0@"
  tl: "@a@b＊：哦？要去洞窟嗎？\n　　那還是買些必要的\n　　東西以防萬一吧！\n@c0@"
31:
  en: "@a@b*: I've had it with this cold, cruel world...\n@c0@"
  ja: "@a@b＊「わしゃ　死にたいわい。\n@c0@"
  ko: "@a@b*: 난 죽고 싶지 않네.\n@c0@"
  sl: "@a@b＊：老夫真是不想活了。\n@c0@"
  tl: "@a@b＊：老夫真是不想活了。\n@c0@"
32:
  en: "@a@b*: Life in this town was almost bearable when Supreme Sage Isaac was around to guide us.\n@c0@"
  ja: "@a@b＊「大賢者マサールさまが　いた頃は\n\tこの町も　もう　ちょっとは\n\tましじゃったよ。\n@c0@"
  ko: "@a@b*: 대현자 마살 님이 있었을 때는\n이 마을도 조금은\n살만 했었다네.\n@c0@"
  sl: "@a@b＊：大贤者马萨尔大人在的时候，\n　　这个小镇虽然也不怎么样，\n　　不过至少比现在还强一点。\n@c0@"
  tl: "@a@b＊：大賢者馬薩爾大人在的時候，\n　　這個小鎮雖然也不怎麼樣，\n　　不過至少比現在還強一點。\n@c0@"
33:
  en: "@a@b*: But then Isaac managed to anger the Archfiend Mortamor, and he was taken away...\n@c0@"
  ja: "@a@b＊「じゃが　マサールさまが\n\t大魔王デスタムーアの怒りにふれ\n\tつれてゆかれてからは……\n@c0@"
