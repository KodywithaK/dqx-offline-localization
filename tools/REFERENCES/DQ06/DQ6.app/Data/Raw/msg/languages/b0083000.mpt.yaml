  sl: "@a@b＊：哼！在哪里卖东西\n　　是我的自由！\n@c0@"
  tl: "@a@b＊：哼！在哪裡賣東西\n　　是我的自由！\n@c0@"
18:
  en: "@a@b*: Money makes the world go round. That's a fact.\n@c0@"
  ja: "@a@b＊「世の中　生きていくには\n\tまず　カネだべな。\n@c0@"
