  sl: "@a@b＊：人生在世，\n　　最重要的就是钱了！\n@c0@"
  tl: "@a@b＊：人生在世，\n　　最重要的就是錢了！\n@c0@"
19:
  en: "@a@b*: If I could just get a little of the shiny stuff, I bet I could turn it into a lot, and buy a mansion like the one north of here.\n@c0@"
  ja: "@a@b＊「カネさえ　ありゃあ　オラにも\n\t北の　おやしき　みたいな家が\n\tたてられるのによお。\n@c0@"
  ko: "@a@b*: 돈만 있으면 나도\n북쪽 저택 같은 집을\n지을 수 있을 텐데.\n@c0@"
  sl: "@a@b＊：只要有钱，我也能\n　　盖一栋和城镇北边\n　　那所豪宅一样的房子。\n@c0@"
  tl: "@a@b＊：只要有錢，我也能\n　　蓋一棟和城鎮北邊\n　　那所豪宅一樣的房子。\n@c0@"
20:
  en: "@a@b*: Look at all the graves! Look at them, I say!\n@c0@"
  ja: "@a@b＊「見るがええ！\n\tこの　墓の数を！\n@c0@"
  ko: "@a@b*: 이걸 보아라!\n이 수많은 묘지를!\n@c0@"
  sl: "@a@b＊：看看吧！\n　　这数不清的墓！\n@c0@"
  tl: "@a@b＊：看看吧！\n　　這數不清的墓！\n@c0@"
21:
  en: "@a@b*: Here lie the victims of an epidemic of greed! Every one of these fools lost his life chasing the treasure of some sage.\n@c0@"
  ja: "@a@b＊「皆　えらい賢者が　残したとかいう\n\t宝さがしで　命を　おとした\n\t大バカ者の　墓じゃ。\n@c0@"
  ko: "@a@b*: 전부 훌륭한 현자가 남겼다는\n보물을 찾으려다 목숨을 잃은\n멍청이들의 묘지라네.\n@c0@"
  sl: "@a@b＊：这些墓里埋的，都是来寻找\n　　传说中贤者的宝物，\n　　却丧命于此的傻瓜们。\n@c0@"
  tl: "@a@b＊：這些墓裡埋的，都是來尋找\n　　傳說中賢者的寶物，\n　　卻喪命於此的傻瓜們。\n@c0@"
22:
  en: "@a@b*: Welcome to our casino — the pride of the town!\n@c0@"
  ja: "@a@b＊「さあ　いらっしゃい！\n\tこの町じまんの　カジノですよ！\n@c0@"
  ko: "@a@b*: 어서 오세요!\n이 마을의 자랑거리인 카지노입니다!\n@c0@"
  sl: "@a@b＊：欢迎光临！\n　　这里是本镇最棒的赌场！\n@c0@"
  tl: "@a@b＊：歡迎光臨！\n　　這裡是本鎮最棒的賭場！\n@c0@"
23:
  en: "@a@b*: We've got some great new games for you today. Try the poker! Winning big has never been easier!\n@c0@"
  ja: "@a@b＊「本日開店　大サービス！\n\tポーカーも　たたいて　たたいて\n\tたたけます！\n@c0@"
  ko: "@a@b*: 오늘만 개장 기념 대박 서비스!\n포커가 대박 납니다.\n완전 대박 납니다!\n@c0@"
  sl: "@a@b＊：今天开业大酬宾！\n　　快来打牌吧！\n　　大家都来试试手气呀！\n@c0@"
  tl: "@a@b＊：今天開業大酬賓！\n　　快來打牌吧！\n　　大家都來試試手氣呀！\n@c0@"
24:
  en: "@a@b*: I heard someone struck gold in this town's cave. That's why I came here, you see.\n@c0@"
  ja: "@a@b＊「この町の　洞くつで\n\t金がとれるという　ウワサを\n\t聞いて　来たのだが……\n@c0@"
  ko: "@a@b*: 이 마을의 동굴에서\n금이 나온다는 소문을\n듣고 오긴 했지만......\n@c0@"
  sl: "@a@b＊：我是听说了这个镇上的\n　　洞窟里能挖到金子，\n　　才特地跑来的……\n@c0@"
  tl: "@a@b＊：我是聽說了這個鎮上的\n　　洞窟裡能挖到金子，\n　　才特地跑來的……\n@c0@"
25:
  en: "@a@b*: Turns out I made the trip for nothing. It seems the cave was stripped bare ages ago...\n@c0@"
  ja: "@a@b＊「どうやら　とっくの昔に\n\t掘りつくされちまったようだな。\n@c0@"
  ko: "@a@b*: 아무래도 벌써 다\n캐 버린 모양이군.\n@c0@"
