  sl: "@a@b＊：那我就把它\n　　放到%a001400中了。\n　　欢迎您再来！\n@c0@"
  tl: "@a@b＊：那我就把它\n　　放到%a001400中了。\n　　歡迎您再來！\n@c0@"
