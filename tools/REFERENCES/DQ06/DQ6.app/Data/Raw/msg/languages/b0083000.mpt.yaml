0:
  en: "@a@b*: You've reached Greedmore Valley.\n@c0@"
  ja: "@a@b＊「ここは　欲望の町だよ。\n@c0@"
  ko: "@a@b*: 여기는 욕망의 마을이야.\n@c0@"
  sl: "@a@b＊：这里是欲望之镇。\n@c0@"
  tl: "@a@b＊：這裡是欲望之鎮。\n@c0@"
1:
  en: "@a@b*: Well, that's what everyone calls it, anyway. Seems it had a different name once upon a time.\n@c0@"
  ja: "@a@b＊「もっとも　本当は　別の名前が\n\tあったらしいけどね。　今じゃ\n\t誰もが　そう呼ぶのさ。\n@c0@"
  ko: "@a@b*: 사실은 원래 다른 이름이\n있었지만, 지금은\n다들 그렇게 부르고 있지.\n@c0@"
  sl: "@a@b＊：这个城镇本来不叫这个名字，\n　　也不知从什么时候开始，\n　　大家就都叫它欲望之镇了。\n@c0@"
  tl: "@a@b＊：這個城鎮本來不叫這個名字，\n　　也不知從什麼時候開始，\n　　大家就都叫它欲望之鎮了。\n@c0@"
2:
  en: "@a@b*: Listen, you better watch yourself. Folks around here can practically smell fresh gold, and they'll stop at nothing to get it.\n@c0@"
  ja: "@a@b＊「あんたも　気をつけないと\n\t町の住人の欲の　えじきに\n\tされちまうよ。\n@c0@"
  ko: "@a@b*: 너도 조심하지 않으면\n마을 사람들의 욕망의 먹이가\n되어 버릴 거야.\n@c0@"
  sl: "@a@b＊：你也要小心点，\n　　不要成为人们\n　　欲望的牺牲品。\n@c0@"
  tl: "@a@b＊：你也要小心點，\n　　不要成為人們\n　　欲望的犧牲品。\n@c0@"
3:
  en: "@a@b*: Hey! Stop spreadin' dirt on our mat!\n@c0@"
  ja: "@a@b＊「ちょっと　あんた！\n\tここは　オイラの場所だぜ。\n@c0@"
  ko: "@a@b*: 이봐 당신!\n여긴 우리 구역이야.\n@c0@"
  sl: "@a@b＊：喂！说你呢！\n　　这里是小爷的地盘！\n@c0@"
  tl: "@a@b＊：喂！說你呢！\n　　這裡是小爺的地盤！\n@c0@"
4:
