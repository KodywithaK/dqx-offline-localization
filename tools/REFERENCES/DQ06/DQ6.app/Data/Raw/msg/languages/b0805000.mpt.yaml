21:
  en: "@a@b‘What do you call a robber hiding in a suit of armour?\n㈡\n‘A thief in the knight!’\n@c0@"
  ja: "@a@b“盗賊「お宝の眠る　ばしょまで\n\t　ばしょ（馬車）で　行くぜっ！”\n@c0@"
  ko: "@a@b''도적: 보물 지도가 있는 곳을\n알 수 있을지도......''\n@c0@"
