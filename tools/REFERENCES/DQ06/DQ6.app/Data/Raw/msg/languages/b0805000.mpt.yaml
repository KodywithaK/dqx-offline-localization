25:
  en: "@a@b‘It was I who gambled away all of the donation money in the casino.\n@c0@"
  ja: "@a@b“いただいた　寄付金を　すべて\n　カジノで　すってしまったのは　私です。\n@c0@"
  ko: "@a@b''받은 기부금을 모두\n카지노에서 탕진해 버린 건 바로 접니다.''\n@c0@"
  sl: "@a@b“我把收到的捐赠\n  全都在赌场里输光了。\n@c0@"
  tl: "@a@b“我把收到的捐贈\n  全都在賭場里輸光了。\n@c0@"
26:
