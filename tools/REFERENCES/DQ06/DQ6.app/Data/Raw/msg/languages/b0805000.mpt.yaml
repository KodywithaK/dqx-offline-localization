  ja: "@a@b“みなさんに　平和を。\n　　　　　　　　　　　　とくめいきぼう”\n@c0@"
  ko: "@a@b''모두에게 평화가 있기를.\n　　　　　　　　　　　　익명의 기도자''\n@c0@"
  sl: "@a@b“祝大家平安。\n　　　　　　　　　　　　作者要求匿名”\n@c0@"
  tl: "@a@b“祝大家平安。\n　　　　　　　　　　　　作者要求匿名”\n@c0@"
27:
  en: "@a@bThere's a book entitled ‘Let's Explore the Ocean!’ %0%a000120 takes it from the shelf and reads an excerpt.\n@c0@"
  ja: "@a@b「いざ！　大海原へ」と\n書かれた本がある。\n%a000120は　手にとってみた。\n@c0@"
  ko: "@a@b'가자! 망망대해로'라고\n쓰인 책이 있다.\n%a000120%F0120%X는%Y은%Z 책을 집어들었다.\n@c0@"
  sl: "@a@b有一本\n《来吧！前往大海》。\n%a000120拿起来阅读。\n@c0@"
  tl: "@a@b有一本\n《來吧！前往大海》。\n%a000120拿起來閱讀。\n@c0@"
28:
  en: "@a@b‘Shoals of adventure and excitement await you in the deep blue sea.\n@c0@"
  ja: "@a@b“この　大海原には\n　数々の　なぞと　ロマンが\n　みちあふれている。\n@c0@"
  ko: "@a@b''이 드넓은 대해에는\n수많은 수수께끼와 로망이\n잠들어 있다.''\n@c0@"
  sl: "@a@b“在这片大海之中，\n　充满了无数的\n　谜和浪漫色彩。\n@c0@"
  tl: "@a@b“在這片大海之中，\n　充滿了無數的\n　謎和浪漫色彩。\n@c0@"
29:
  en: "@a@b‘A reef under which mermaids are said to reside, sunken ships still laden with treasure, a sacred shrine dedicated to the naming god...\n@c0@"
  ja: "@a@b“人魚たちが　住むといわれる　岩場\n　宝物をつんだまま　沈んだ船\n　名前の　神さまを　まつるほこら……\n@c0@"
  ko: "@a@b''인어들이 산다는 암반,\n보물을 실은 채 침몰한 배,\n이름의 신을 섬기는 성소......''\n@c0@"
  sl: "@a@b“人鱼们居住的聚集地，\n　载满了宝物沉没的船，\n　供奉着名字之神的祠堂……\n@c0@"
  tl: "@a@b“人魚們居住的聚集地，\n　載滿了寶物沉沒的船，\n　供奉著名字之神的祠堂……\n@c0@"
30:
  en: "@a@b‘All of this and much more is waiting for you beneath the ocean waves!\n@c0@"
  ja: "@a@b“地上では　決して　見ることができない\n　ふしぎが　君を待っている！\n@c0@"
  ko: "@a@b''지상에서는 절대 볼 수 없는\n신비한 일들이 당신을 기다린다!''\n@c0@"
  sl: "@a@b“在地上绝对无法看到的神奇\n　正在等待着你！\n@c0@"
  tl: "@a@b“在地上絕對無法看到的神奇\n　正在等待著你！\n@c0@"
31:
  en: "@a@b‘So why not take a deep breath and explore the sea today!’\n@c0@"
  ja: "@a@b“さあ　今こそ　帆をあげ\n　大海原へ　こぎだすのだ！！”\n@c0@"
  ko: "@a@b''자, 지금 당장 돛을 올리고\n망망대해로 나아가자!!''\n@c0@"
  sl: "@a@b“就在今日，面朝大海，\n　扬帆起航吧！！”\n@c0@"
  tl: "@a@b“就在今日，面朝大海，\n　揚帆起航吧！！”\n@c0@"
32:
