4:
  en: "@a@bIt includes such gems as ‘There's no slime like the present!’, a favourite saying of Sir Slimon Gooington-Smythe.\n@c0@"
  ja: "@a@b“ピッピピー\n　\n　　　　　　　　　　　　　　　　　スラ３世”\n@c0@"
  ko: "@a@b''삐~ 삐삐~\n　\n　　　　　　　　　　　　　　　　　슬라 3세''\n@c0@"
  sl: "@a@b“哔哔哔……\n　\n　　　　　　　　　　　　　　　　　史莱３世”\n@c0@"
  tl: "@a@b“嗶嗶嗶……\n　\n　　　　　　　　　　　　　　　　　史萊３世”\n@c0@"
5:
  en: "@a@bThere's a book entitled ‘A Slime's Story: Part One’. %0%a000120 takes it from the shelf and reads an excerpt.\n@c0@"
  ja: "@a@b「ボクのスライム冒険記１」と\n書かれた本がある。\n%a000120は　手にとってみた。\n@c0@"
  ko: "@a@b'나의 슬라임 모험기 1'이라고\n쓰인 책이 있다.\n%a000120%F0120%X는%Y은%Z 책을 집어들었다.\n@c0@"
  sl: "@a@b有一本\n《我的史莱姆冒险记１》。\n%a000120拿起来阅读。\n@c0@"
  tl: "@a@b有一本\n《我的史萊姆冒險記１》。\n%a000120拿起來閱讀。\n@c0@"
6:
  en: "@a@b‘I am a nameless slime who has dreamt of fame ever since I was an infant dollop of goo...\n@c0@"
  ja: "@a@b“ボクは　名もない　スライム。\n　けど　いつか　世界一のスライムって\n　言われるのが　夢なんだッピ！\n@c0@"
  ko: "@a@b''나는 이름 없는 슬라임.\n하지만 언젠가 세계 최고의 슬라임으로\n불리는 게 꿈이다삐!''\n@c0@"
  sl: "@a@b“我是一只连名字都没有的史莱姆。\n　但是我的梦想是终有一天\n　成为大家口中的世界第一的史莱姆哔！\n@c0@"
  tl: "@a@b“我是一隻連名字都沒有的史萊姆。\n　但是我的夢想是終有一天\n　成為大家口中的世界第一的史萊姆嗶！\n@c0@"
7:
  en: "@a@b‘I wanted all the people of the world to speak my name with reverence and awe...\n@c0@"
  ja: "@a@b“今日は　名を上げるために\n　名もない村に\n　やってきたんだッピ！\n@c0@"
  ko: "@a@b''오늘은 이름을 알리기 위해\n이름 없는 마을을\n찾아왔다삐!''\n@c0@"
  sl: "@a@b“今天为了提高知名度，\n　我来到了一个\n　无名的村子里哔！\n@c0@"
  tl: "@a@b“今天為了提高知名度，\n　我來到了一個\n　無名的村子裡嗶！\n@c0@"
8:
  en: "@a@b‘My quest for celebrity began in this nameless village. I ordered its people to hear my name and quake!\n@c0@"
  ja: "@a@b“あっ！　しまった！　ッピ！\n@c0@"
  ko: "@a@b''앗! 큰일이다! 삐!''\n@c0@"
  sl: "@a@b“啊！糟了！哔！\n@c0@"
  tl: "@a@b“啊！糟了！嗶！\n@c0@"
9:
  en: "@a@b‘Some plucky villager looked me in the eye and asked me what my name was...\n@c0@"
  ja: "@a@b“名前がなければ\n　名を上げられない！？　ッピ！？\n@c0@"
  ko: "@a@b''이름이 없으면\n이름을 알릴 수 없는 거 아닌가!? 삐!?''\n@c0@"
  sl: "@a@b“连名字都没有的话，\n　更别提提高知名度啦？！哔？！\n@c0@"
  tl: "@a@b“連名字都沒有的話，\n　更別提提高知名度啦？！嗶？！\n@c0@"
10:
  en: "@a@b‘At that moment I realised that I didn't have a name. I had encountered the first hitch in my plan for worldwide fame...’\n@c0@"
  ja: "@a@b“ボクは　人生で　はじめて\n　大きなカベに　ぶつかったんだッピ。”\n@c0@"
  ko: "@a@b''나는 태어나서 처음으로\n커다란 벽에 부딪히고 말았다삐.''\n@c0@"
  sl: "@a@b“这是我人生中的\n　第一个大难题哔。”\n@c0@"
  tl: "@a@b“這是我人生中的\n　第一個大難題嗶。”\n@c0@"
11:
  en: "@a@bThere's a book entitled ‘Warrior Cat Tales: Part One’. %0%a000120 takes it from the shelf and reads an excerpt.\n@c0@"
  ja: "@a@b「武勇伝　ネコ　１巻」と\n書かれた本がある。\n%a000120は　手にとってみた。\n@c0@"
  ko: "@a@b'고양이 무용담 1권'이라고\n쓰인 책이 있다.\n%a000120%F0120%X는%Y은%Z 책을 집어들었다.\n@c0@"
  sl: "@a@b有一本\n《英雄事迹　猫　１卷》。\n%a000120拿起来阅读。\n@c0@"
  tl: "@a@b有一本\n《英雄事蹟　貓　１卷》。\n%a000120拿起來閱讀。\n@c0@"
12:
  en: "@a@b‘Miaow! Welcome to one cat's catalogue of feline fabulousness!\n@c0@"
  ja: "@a@b“にゃ～ん。\n　あたしは　ネコにゃん。\n　人呼んで　ネコ。\n@c0@"
  ko: "@a@b''냥~\n나는 고양이다냥.\n이름하여 고양이.''\n@c0@"
  sl: "@a@b“喵。\n　我是猫喵。\n　人送外号猫。\n@c0@"
  tl: "@a@b“喵。\n　我是貓喵。\n　人送外號貓。\n@c0@"
13:
  en: "@a@b‘Ever since I was a kitten, I was a born brawler.\n@c0@"
  ja: "@a@b“そのまま　にゃ～ん。\n@c0@"
  ko: "@a@b''그대로다냥~''\n@c0@"
  sl: "@a@b“就是这样，喵。\n@c0@"
  tl: "@a@b“就是這樣，喵。\n@c0@"
14:
  en: "@a@b‘But there is one blot on my otherwise purrfect record. Yes, I suffered one catastrophic defeat...’\n@c0@"
  ja: "@a@b“あたしは　じまんじゃにゃいけど\n　今まで　ケンカに負けたことは\n　一度しか　にゃいにゃん。”\n@c0@"
  ko: "@a@b''자랑하기 쑥쓰럽지만\n난 지금까지 싸움에서 진 적이\n딱 한 번밖에 없다냥.''\n@c0@"
  sl: "@a@b“不是我自吹，\n　在打架方面迄今为止\n　我只输过一次喵。”\n@c0@"
  tl: "@a@b“不是我自吹，\n　在打架方面迄今為止\n　我只輸過一次喵。”\n@c0@"
15:
  en: "@a@bThere's a book entitled ‘The Mysterious Medal King’. %0%a000120 takes it from the shelf and reads an excerpt.\n@c0@"
  ja: "@a@b「メダル王のなぞ」と\n書かれた本がある。\n%a000120は　手にとってみた。\n@c0@"
