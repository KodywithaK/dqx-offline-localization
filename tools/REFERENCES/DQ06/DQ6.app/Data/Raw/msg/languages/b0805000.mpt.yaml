94:
  en: "@a@bThere's a book entitled ‘A Slime's Story: Part Four’. %0%a000120 takes it from the shelf and reads an excerpt.\n@c0@"
  ja: "@a@b「ボクのスライム冒険記４」と\n書かれた本がある。\n%a000120は　手にとってみた。\n@c0@"
  ko: "@a@b'나의 슬라임 모험기 4'라고\n쓰인 책이 있다.\n%a000120%F0120%X는%Y은%Z 책을 집어들었다.\n@c0@"
  sl: "@a@b有一本\n《我的史莱姆冒险记４》。\n%a000120拿起来阅读。\n@c0@"
  tl: "@a@b有一本\n《我的史萊姆冒險記４》。\n%a000120拿起來閱讀。\n@c0@"
95:
  en: "@a@b‘It is I! Ooozo! Excuse my sh-shaky p-penmanship, for I have been beaten black and...er...even bluer.\n@c0@"
  ja: "@a@b“ボ……　ボクの名は……\n　ス……　ラ……　ピー。\n@c0@"
  ko: "@a@b''나......나의 이름은......\n슬......라......삐.''\n@c0@"
  sl: "@a@b“我……我的名字是……\n　史……莱……皮。\n@c0@"
  tl: "@a@b“我……我的名字是……\n　史……萊……皮。\n@c0@"
96:
  en: "@a@b‘I was well and truly mauled by a nameless cat in that nameless village who unleashed a nameless special attack.\n@c0@"
  ja: "@a@b“名もなき村の　名もなきネコの\n　名もなき必殺技を　くらって\n　ひんしの　ダメージだッピ……。\n@c0@"
  ko: "@a@b''이름 없는 마을의 이름 없는 고양이의\n이름 없는 필살기를 맞고\n빈사 상태가 되었다삐......''\n@c0@"
  sl: "@a@b“吃了无名村庄的无名小猫的\n　一招无名必杀技，\n　使我受到了濒死的重创哔……\n@c0@"
  tl: "@a@b“吃了無名村莊的無名小貓的\n　一招無名必殺技，\n　使我受到了瀕死的重創嗶……\n@c0@"
97:
  en: "@a@b‘While I gloopily licked my wounds, I sought solace in my goo-eared copy of “The Quotable Slime”...\n@c0@"
  ja: "@a@b“ボクは　スライム名言集にある\n　かの有名な　スラースランの言葉を\n　思い出したんだ！　ッピ。\n@c0@"
  ko: "@a@b''나는 슬라임 명언집에 있는\n그 유명한 슬라슬라랑의 명언을\n떠올렸다! 삐.''\n@c0@"
  sl: "@a@b“我想起了史莱姆名言集中\n　提及的那个有名的\n　史莱史兰的名言了！哔。\n@c0@"
  tl: "@a@b“我想起了史萊姆名言集中\n　提及的那個有名的\n　史萊史蘭的名言了！嗶。\n@c0@"
98:
  en: "@a@b‘The wise words of Lord Dripping-Ooze have never rung truer...\n@c0@"
  ja: "@a@b“『たとえ　負けても　くじけるな。\n　　スライムの　生きる道は\n　　無数にあるのだから。　　スラースラン』\n@c0@"
  ko: "@a@b''만약 지더라도 주저앉지 말라.\n슬라임이 살아갈 길은\n무수히 많으니.   -슬라슬라랑''\n@c0@"
  sl: "@a@b“‘就算输了也不要气馁。\n　　因为史莱姆的生存之道\n　　数不胜数。　　史莱史兰’\n@c0@"
  tl: "@a@b“‘就算輸了也不要氣餒。\n　　因為史萊姆的生存之道\n　　數不勝數。　　史萊史蘭’\n@c0@"
99:
  en: "@a@b‘“There are countless roads open to the open-hearted slime!”\n@c0@"
  ja: "@a@b“なんて　心強い名言なのだろうッピ。\n　今の　ボクに　ぴったりな名言ッピ。\n@c0@"
  ko: "@a@b''어쩜 이렇게 든든한 명언이 다 있을까삐.\n지금 내게 딱 필요한 명언이다삐.''\n@c0@"
  sl: "@a@b“多么振奋人心的名言啊哔。\n　简直是为现在的我量身定做的哔。\n@c0@"
  tl: "@a@b“多麼振奮人心的名言啊嗶。\n　簡直是為現在的我量身定做的嗶。\n@c0@"
100:
  en: "@a@b‘Inspired by these words, I knew I could not give up if I wanted to succeed in my quest!’\n@c0@"
  ja: "@a@b“そうだ！　ッピ。　\n　ボクは　こんなところで\n　くじけてちゃ　いけない！　ッピ。”\n@c0@"
  ko: "@a@b''그래! 삐.\n나는 이런 데서\n주저앉지 않을 거다! 삐.''\n@c0@"
  sl: "@a@b“没错！哔。　\n　我不应该在这个时候\n　消沉颓废！哔。”\n@c0@"
  tl: "@a@b“沒錯！嗶。　\n　我不應該在這個時候\n　消沉頹廢！嗶。”\n@c0@"
101:
  en: "@a@b%0%a000120 carefully scans the titles of the books on the shelf.\n@c0@"
  ja: "@a@b%a000120は　背表紙のタイトルを\n注意ぶかく　ながめた。\n@c0@"
  ko: "@a@b%a000120%F0120%X는%Y은%Z 책등의 제목을\n주의 깊게 살펴보았다.\n@c0@"
  sl: "@a@b%a000120仔细地观察着\n书脊上的文字。\n@c0@"
  tl: "@a@b%a000120仔細地觀察著\n書脊上的文字。\n@c0@"
102:
  en: "@a@bThey seem to be arranged in no particular order.\n@c0@"
  ja: "@a@bどうも　まとまりがなく\n気になる……。\n@c0@"
  ko: "@a@b뒤죽박죽으로 꽂혀 있어서\n괜히 신경 쓰인다......\n@c0@"
  sl: "@a@b顺序乱得忍无可忍……\n@c0@"
  tl: "@a@b順序亂得忍無可忍……\n@c0@"
103:
  en: "@a@b%0%a000120 decides to rearrange them in alphabetical order.\n@c0@"
  ja: "@a@b%a000120は　きちんと\nあいうえお順に　ならびかえておいた。\n@c0@"
  ko: "@a@b%a000120%F0120%X는%Y은%Z 책을\n가나다순으로 다시 꽂아 두었다.\n@c0@"
  sl: "@a@b%a000120\n按发音顺序重新排列。\n@c0@"
  tl: "@a@b%a000120\n按發音順序重新排列。\n@c0@"
104:
  en: "@a@bThere's a book entitled ‘V Is for Victory!’ %0%a000120 takes it from the shelf and reads an excerpt.\n@c0@"
  ja: "@a@b「戦いの極意（ごくい）」と\n書かれた本がある。\n%a000120は　手にとってみた。\n@c0@"
  ko: "@a@b'싸움의 비법'이라고\n쓰인 책이 있다.\n%a000120%F0120%X는%Y은%Z 책을 집어들었다.\n@c0@"
  sl: "@a@b有一本\n《战斗的奥义》。\n%a000120拿起来阅读。\n@c0@"
  tl: "@a@b有一本\n《戰鬥的奧義》。\n%a000120拿起來閱讀。\n@c0@"
105:
  en: "@a@b‘Victory is not gained by charging at the enemy and unleashing everything you've got.\n@c0@"
  ja: "@a@b“ただ　やみくもに\n　敵に　向かっていくことが\n　戦いの極意ではない。\n@c0@"
  ko: "@a@b''그저 무턱대고\n적에게 들이대는 것은\n싸움의 비법이 아니다.''\n@c0@"
  sl: "@a@b“只是盲目地\n　冲向敌人\n　并非是战斗的奥义。\n@c0@"
  tl: "@a@b“只是盲目地\n　衝向敵人\n　並非是戰鬥的奧義。\n@c0@"
106:
  en: "@a@b‘True victory is gained by first protecting your allies and being aware of your own weaknesses.\n@c0@"
  ja: "@a@b“弱き味方を　かばい\n　敵の　能力を　見きわめ\n　己の　弱点を　知る。\n@c0@"
  ko: "@a@b''약한 아군을 감싸고\n적의 능력을 살피면서\n자신의 약점을 아는 것.''\n@c0@"
  sl: "@a@b“保护弱小的同伴，\n　看清敌人的能力，\n　清楚自己的弱点。\n@c0@"
  tl: "@a@b“保護弱小的同伴，\n　看清敵人的能力，\n　清楚自己的弱點。\n@c0@"
107:
  en: "@a@b‘Only then can you look for chinks in your enemy's armour and sally forth to gain victory!’\n@c0@"
  ja: "@a@b“これが　すなわち\n　戦いの極意である。”\n@c0@"
  ko: "@a@b''그것이 바로\n싸움의 비법이다.''\n@c0@"
  sl: "@a@b“这就是所谓的\n　战斗的奥义。”\n@c0@"
  tl: "@a@b“這就是所謂的\n　戰鬥的奧義。”\n@c0@"
108:
  en: "@a@bThere's a book entitled ‘1001 Jokes for Adventurers’. %0%a000120 takes it from the shelf and has a closer look.\n@c0@"
  ja: "@a@b「冒険者たちのダジャレ全集」と\n書かれた本がある。\n%a000120は　手にとってみた。\n@c0@"
  ko: "@a@b'모험자들의 말장난 전집'이라고\n쓰인 책이 있다.\n%a000120%F0120%X는%Y은%Z 책을 집어들었다.\n@c0@"
  sl: "@a@b有一本\n《冒险者们的冷笑话全集》。\n%a000120拿起来阅读。\n@c0@"
  tl: "@a@b有一本\n《冒險者們的冷笑話全集》。\n%a000120拿起來閱讀。\n@c0@"
109:
  en: "@a@b‘Which artist should you never commission to paint your portrait?\n㈡\n‘A martial artist!’\n@c0@"
  ja: "@a@b“ぶとう家「わたしは　旅の武芸者。\n\t　市内で　竹刀を　ふりまわしたりなんか\n\t　しない！”\n@c0@"
  ko: "@a@b''모험가: 나는 떠돌이 여행자.\n작은 메달을\n매달 모으고 있지!''\n@c0@"
  sl: "@a@b“武术家：吾乃旅行习武之人。\n　　　不会在大街上舞刀弄枪\n　　　什么的！”\n@c0@"
  tl: "@a@b“武術家：吾乃旅行習武之人。\n　　　不會在大街上舞刀弄槍\n　　　什麼的！”\n@c0@"
110:
  en: "@a@b%0%a000120 quietly returns the book to the shelf...\n@c0@"
  ja: "@a@b%a000120は　無言で\n本を　もとにもどした……。\n@c0@"
  ko: "@a@b%a000120%F0120%X는%Y은%Z 말없이\n책을 원래 자리에 되돌려 놓았다......\n@c0@"
  sl: "@a@b%a000120默默地\n把书放回了原处……\n@c0@"
  tl: "@a@b%a000120默默地\n把書放回了原處……\n@c0@"
111:
  en: "@a@bThere is a single mangy, dog-eared book on the shelf. %0%a000120 has read it before...\n@c0@"
  ja: "@a@b中に　ひとつだけ　昔　読んだことのある\n本が　置いてあった。\n@c0@"
  ko: "@a@b그중에는 읽어 본 적 있는 책이\n딱 한 권 있었다.\n@c0@"
  sl: "@a@b其中只有一本\n曾经读过的书。\n@c0@"
  tl: "@a@b其中只有一本\n曾經讀過的書。\n@c0@"
112:
  en: "@a@bThere's a book entitled ‘Hidden Treasure’. %0%a000120 takes it from the shelf and has a closer look.\n@c0@"
  ja: "@a@b「秘宝のありか」と　書かれた本がある。\n%a000120は　手にとって開いた。\n@c0@"
  ko: "@a@b'보물이 숨겨진 곳'이라고 쓰인 책이 있다.\n%a000120%F0120%X는%Y은%Z 책을 집어들어 펼쳤다.\n@c0@"
  sl: "@a@b有一本《秘宝所在地》。\n%a000120拿起来阅读。\n@c0@"
  tl: "@a@b有一本《秘寶所在地》。\n%a000120拿起來閱讀。\n@c0@"
113:
  en: "@a@bSadly, it looks like all of the important pages have been torn out.\n@c0@"
  ja: "@a@bしかし　かんじんな　ページが\nやぶりとられてしまっていた……。\n@c0@"
  ko: "@a@b그러나 제일 중요한 페이지가\n찢어져 있었다......\n@c0@"
  sl: "@a@b但是最重要的部分\n被撕掉了……\n@c0@"
  tl: "@a@b但是最重要的部分\n被撕掉了……\n@c0@"
114:
  en: "@a@bThere's a book entitled ‘Mini Medal Mending’. %0%a000120 takes it from the shelf and reads an excerpt.\n@c0@"
  ja: "@a@b「メダル工」について　書かれた本がある。\n%a000120は　手にとって読んだ。\n@c0@"
  ko: "@a@b'메달 수리공'이라고 쓰인 책이 있다.\n%a000120%F0120%X는%Y은%Z 손에 들고 읽었다.\n@c0@"
  sl: "@a@b有一本《徽章工》。\n%a000120拿起来阅读。\n@c0@"
  tl: "@a@b有一本《徽章工》。\n%a000120拿起來閱讀。\n@c0@"
115:
  en: "@a@b‘Mini medals don't fix themselves! Oh no! Mending them requires real craftsmanship.\n@c0@"
  ja: "@a@b“メダル工は　ちいさなメダルを\n　修理する　職人だ。\n@c0@"
  ko: "@a@b''메달 수리공은 작은 메달을\n수리하는 장인이다.''\n@c0@"
  sl: "@a@b“徽章工是负责\n　修理小徽章的工匠。\n@c0@"
  tl: "@a@b“徽章工是負責\n　修理小徽章的工匠。\n@c0@"
116:
  en: "@a@b‘Spare a thought for the poor medal mender the next time you chance upon a cracked mini medal.’\n@c0@"
  ja: "@a@b“メダル王と　字づらは　よく似ているが\n　まちがえないように。”\n@c0@"
  ko: "@a@b''메탈이 아니라 메달이므로\n잘 구분해서 틀리지 말 것.''\n@c0@"
  sl: "@a@b“由于名字看起来跟徽章王十分相似，\n　所以可千万不要弄混了。”\n@c0@"
  tl: "@a@b“由於名字看起來跟徽章王十分相似，\n　所以可千萬不要弄混了。”\n@c0@"
117:
  en: "@a@bThere's a book entitled ‘A Slime's Story: Part Five’. %0%a000120 takes it from the shelf and reads an excerpt.\n@c0@"
  ja: "@a@b「ボクのスライム冒険記５」と\n書かれた本がある。\n%a000120は　手にとってみた。\n@c0@"
  ko: "@a@b'나의 슬라임 모험기 5'라고\n쓰인 책이 있다.\n%a000120%F0120%X는%Y은%Z 책을 집어들었다.\n@c0@"
  sl: "@a@b有一本\n《我的史莱姆冒险记５》。\n%a000120拿起来阅读。\n@c0@"
  tl: "@a@b有一本\n《我的史萊姆冒險記５》。\n%a000120拿起來閱讀。\n@c0@"
118:
  en: "@a@b‘My name is Ooozo! My dream is for this name to drip from the lips of all the people of the world!\n@c0@"
  ja: "@a@b“ボクの名は　スラピー。\n　名を上げて　世界一のスライムって\n　言われるのが　夢なんだッピ！\n@c0@"
  ko: "@a@b''나는 슬라삐.\n이름을 날려 세계 제일의 슬라임으로\n불리는 게 꿈이다삐!''\n@c0@"
  sl: "@a@b“我的名字叫史莱皮。\n　我的梦想是提高知名度，\n　成为大家口中的世界第一的史莱姆哔！\n@c0@"
  tl: "@a@b“我的名字叫史萊皮。\n　我的夢想是提高知名度，\n　成為大家口中的世界第一的史萊姆嗶！\n@c0@"
119:
  en: "@a@b‘I have recently heard of a slime so powerful that it can defeat entire gangs of cats with its little finger.\n@c0@"
  ja: "@a@b“この世のどこかに　指先１つで　何匹もの\n　ネコを　ねころがしてしまうほどの\n　チカラを持つ　スライムがいるって話ッピ。\n@c0@"
  ko: "@a@b''이 세상 어딘가에 손가락 하나로 수많은\n고양이들을 바닥에 나뒹굴게 할 만큼\n힘이 센 슬라임이 있다고 한다삐.''\n@c0@"
  sl: "@a@b“据说在这个世界的某处，\n　有一只仅凭１根手指头\n　就能放倒好几只猫的史莱姆哔。\n@c0@"
  tl: "@a@b“據說在這個世界的某處，\n　有一隻僅憑１根手指頭\n　就能放倒好幾隻貓的史萊姆嗶。\n@c0@"
120:
  en: "@a@b‘Now, obviously slimes don't have little fingers, so I'm not quite sure what to believe.\n@c0@"
  ja: "@a@b“スライムに　指先なんてないから\n　半信半疑（はんしんはんぎ）\n　なんだけれども……　ッピ。\n@c0@"
  ko: "@a@b''슬라임한테는\n손가락이 없으니까\n믿거나 말거나지만......삐.''\n@c0@"
  sl: "@a@b“不过由于史莱姆本身就没有手指头，\n　所以我对此也是\n　半信半疑……哔。\n@c0@"
  tl: "@a@b“不過由於史萊姆本身就沒有手指頭，\n　所以我對此也是\n　半信半疑……嗶。\n@c0@"
121:
  en: "@a@b‘But if this fabled slime does indeed exist, I can give my dreams of being the world's toughest slime a gloopy kiss goodbye.\n@c0@"
  ja: "@a@b“けれども　そんなスライムがいるならば\n　チカラで　世界一のスライムになる道は\n　あきらめるッピ。\n@c0@"
  ko: "@a@b''하지만 그런 슬라임이 있다면\n힘으로 세계 제일의 슬라임이 되는 길은\n포기할 거다삐.''\n@c0@"
  sl: "@a@b“但是如果世上真有这样一只史莱姆，\n　那么我会放弃凭借力量成为\n　世界第一的史莱姆这条路哔。\n@c0@"
  tl: "@a@b“但是如果世上真有這樣一隻史萊姆，\n　那麼我會放棄憑藉力量成為\n　世界第一的史萊姆這條路嗶。\n@c0@"
122:
  en: "@a@b‘In any case, I have arrived at an important decision and must leave this nameless village behind.’\n@c0@"
  ja: "@a@b“ボクは　ある決意を　胸にしまい\n　名もなき村を　あとにしたッピ。”\n@c0@"
  ko: "@a@b''나는 어떤 결의를 가슴속에 다지며\n이름 없는 마을을 뒤로했다삐.''\n@c0@"
  sl: "@a@b“我怀揣着某种信念，\n　离开了无名村庄哔。”\n@c0@"
  tl: "@a@b“我懷揣著某種信念，\n　離開了無名村莊嗶。”\n@c0@"
123:
  en: "@a@bThere's a book entitled ‘The Good King's Guide’. %0%a000120 takes it from the shelf and has a closer look.\n@c0@"
  ja: "@a@b「よき王になるためのこころえ」と\n書かれた本がある。\n%a000120は　手にとってみた。\n@c0@"
  ko: "@a@b'좋은 왕이 되기 위한 마음가짐'이라고\n쓰인 책이 있다.\n%a000120%F0120%X는%Y은%Z 책을 집어들었다.\n@c0@"
  sl: "@a@b有一本\n《成为优秀的国王的心得》。\n%a000120拿起来阅读。\n@c0@"
  tl: "@a@b有一本\n《成為優秀的國王的心得》。\n%a000120拿起來閱讀。\n@c0@"
124:
