  ko: "@a@b'모험자들의 말장난 전집'이라고\n쓰인 책이 있다.\n%a000120%F0120%X는%Y은%Z 책을 집어들었다.\n@c0@"
  sl: "@a@b有一本\n《冒险者们的冷笑话全集》。\n%a000120拿起来阅读。\n@c0@"
  tl: "@a@b有一本\n《冒險者們的冷笑話全集》。\n%a000120拿起來閱讀。\n@c0@"
187:
  en: "@a@b‘What did the magician set the table with at his enchanted tea party?\n@c0@"
  ja: "@a@b“老賢者「ほっほっほ。\n\t　本だなを　しらべたようじゃな。\n@c0@"
  ko: "@a@b''늙은 현자: 홋홋홋.\n나이가 드니 안 아픈 곳이 없구먼.''\n@c0@"
  sl: "@a@b“老贤者：哈哈哈。\n　　　看来你已经调查过书架了啊。\n@c0@"
  tl: "@a@b“老賢者：哈哈哈。\n　　　看來你已經調查過書架了啊。\n@c0@"
188:
  en: "@a@b‘Cups and sorcerers!’\n@c0@"
  ja: "@a@b“老賢者「むしろ　ムシロの上を\n\t　しらべるとよいぞ。”\n@c0@"
  ko: "@a@b''늙은 현자: 관절은\n대관절 왜 아픈 것인지.''\n@c0@"
  sl: "@a@b“老贤者：我建议你调查一下\n　　　草席上面。”\n@c0@"
  tl: "@a@b“老賢者：我建議你調查一下\n　　　草席上面。”\n@c0@"
189:
  en: "@a@b%0%a000120 sighs and returns the book to the shelf...\n@c0@"
  ja: "@a@b%a000120は　残念そうに\n本を　もとにもどした……。\n@c0@"
  ko: "@a@b%a000120%F0120%X는%Y은%Z 씁쓸한 표정으로\n책을 원래 자리에 되돌려 놓았다.\n@c0@"
  sl: "@a@b%a000120失望地\n把书放回了原处……\n@c0@"
  tl: "@a@b%a000120失望地\n把書放回了原處……\n@c0@"
190:
  en: "@a@bOne of the books on the shelf is glowing gently.\n@c0@"
  ja: "@a@b本棚の中に　光りかがやく\n本が　ある……。\n@c0@"
  ko: "@a@b책장 속에 찬란하게 빛나는\n책이 있다......\n@c0@"
  sl: "@a@b书架中有一本\n闪耀着的书……\n@c0@"
  tl: "@a@b書架中有一本\n閃耀著的書……\n@c0@"
191:
  en: "@a@bWait, that's no book—it's a dream in disguise!\n@c0@"
  ja: "@a@bなんと！\n夢のカケラを　みつけた！\n@c0@"
  ko: "@a@b놀랍게도!\n꿈 조각을 발견했다!\n@c0@"
  sl: "@a@b发现了梦之碎片！\n@c0@"
  tl: "@a@b發現了夢之碎片！\n@c0@"
192:
  en: "@a@bSet free at last, the dream flies off into the ether.\n@c0@"
  ja: "@a@b夢のカケラは\nかがやきながら　とんでいった！\n@c0@"
  ko: "@a@b꿈 조각은\n반짝이며 날아갔다!\n@c0@"
  sl: "@a@b梦之碎片\n闪耀着飞了起来！\n@c0@"
  tl: "@a@b夢之碎片\n閃耀著飛了起來！\n@c0@"
193:
  en: "@a@bThe dreams you find won't appear in your inventory, as they are immediately returned to where they came from.\n@c0@"
  ja: "@a@bなお　夢のカケラは\nもちもの　には　入りません。\n@c0@"
  ko: "@a@b꿈 조각은\n소지품에는 들어가지 않습니다.\n@c0@"
  sl: "@a@b另外，梦之碎片\n不会进入随身物品中。\n@c0@"
  tl: "@a@b另外，夢之碎片\n不會進入隨身物品中。\n@c0@"
194:
  en: "@a@bYou can check how many you've found by asking a certain someone at the place where dreams gather.\n@c0@"
  ja: "@a@bあつめた数は　まぼろしの館\nと呼ばれる場所で\n確認することが　できます。\n@c0@"
  ko: "@a@b몇 개를 모았는지는\n몽환의 저택이라 불리는 곳에 가면\n확인할 수 있습니다.\n@c0@"
  sl: "@a@b收集的数量\n可以在梦幻之馆中\n进行确认。\n@c0@"
  tl: "@a@b收集的數量\n可以在夢幻之館中\n進行確認。\n@c0@"
