23:
  en: "@a@bThere's a note with ‘My Confession’ written on it. %0%a000120 takes it from the shelf and reads it.\n@c0@"
  ja: "@a@b「罪と告白」と　書かれたノートがある。\n%a000120は　手にとって読んだ。\n@c0@"
  ko: "@a@b'죄와 고백'이라고 쓰인 노트가 있다.\n%a000120%F0120%X는%Y은%Z 손에 들고 읽었다.\n@c0@"
  sl: "@a@b有一本\n《罪与告白》笔记。\n%a000120拿起来阅读。\n@c0@"
  tl: "@a@b有一本\n《罪與告白》筆記。\n%a000120拿起來閱讀。\n@c0@"
24:
  en: "@a@b‘Dear Goddess, I am profoundly sorry for what I have done...\n@c0@"
  ja: "@a@b“神様　ごめんなさい……。\n@c0@"
  ko: "@a@b''신이시여, 죄송합니다......''\n@c0@"
  sl: "@a@b“神啊，宽恕我吧……\n@c0@"
