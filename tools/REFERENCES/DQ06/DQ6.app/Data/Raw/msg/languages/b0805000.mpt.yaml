126:
  en: "@a@b‘My name is Ooozo! My dream is for this name to drip from the lips of all the people of the world!\n@c0@"
  ja: "@a@b“ボクの名は　スラピー。\n　名を上げて　世界一のスライムって\n　言われるのが　夢なんだッピ！\n@c0@"
  ko: "@a@b''나는 슬라삐.\n이름을 날려 세계 제일의 슬라임으로\n불리는 게 꿈이다삐!''\n@c0@"
  sl: "@a@b“我的名字叫史莱皮。\n　我的梦想是提高知名度，\n　成为大家口中的世界第一的史莱姆哔！\n@c0@"
  tl: "@a@b“我的名字叫史萊皮。\n　我的夢想是提高知名度，\n　成為大家口中的世界第一的史萊姆嗶！\n@c0@"
127:
  en: "@a@b‘Lord Dripping-Ooze had oft said: “There are countless roads open to the open-hearted slime”...\n@c0@"
  ja: "@a@b“『スライムの　生きる道は　無数にある』\n@c0@"
  ko: "@a@b''슬라임이 살아갈 길은 무수히 많다.''\n@c0@"
  sl: "@a@b“‘史莱姆的生存之道数不胜数’\n@c0@"
  tl: "@a@b“‘史萊姆的生存之道數不勝數’\n@c0@"
128:
  en: "@a@b‘With these words in mind, I squelched back to my home for the first time in three days since embarking on my epic quest.\n@c0@"
  ja: "@a@b“ボクは　スラースランの　言葉を思い出し\n　３日ぶりに　我が家に　もどったッピ！\n@c0@"
  ko: "@a@b''나는 슬라슬라랑의 명언을 떠올리며\n3일 만에 집으로 돌아왔다삐!''\n@c0@"
  sl: "@a@b“我想起了史莱史兰的名言，\n　时隔３日回到了家中哔！\n@c0@"
  tl: "@a@b“我想起了史萊史蘭的名言，\n　時隔３日回到了家中嗶！\n@c0@"
129:
  en: "@a@b‘With some trepidation, and a fair amount of difficulty, I took up my new weapon — the pen!\n@c0@"
  ja: "@a@b“そして　はやる気持ちを　おさえつつ\n　ペンという　武器を手にしたんだッピ。\n@c0@"
  ko: "@a@b''그리고 설레는 마음을 누르며\n펜이라는 무기를 손에 넣었다삐.''\n@c0@"
  sl: "@a@b“然后抑制住兴奋的心情，\n　拿起了笔这件武器哔。\n@c0@"
  tl: "@a@b“然後抑制住興奮的心情，\n　拿起了筆這件武器嗶。\n@c0@"
130:
  en: "@a@b‘The words oozed from within, and before I knew it, I had completed the tome you now hold...\n@c0@"
  ja: "@a@b“そう！　ボクは　冒険記を書くッピ！　\n　冒険記を書いて　世界一の\n　スライム作家になるッピ！\n@c0@"
  ko: "@a@b''그래! 난 모험기를 쓸 거다삐!\n모험기를 써서 세계 제일의\n슬라임 작가가 될 거다삐!''\n@c0@"
  sl: "@a@b“没错！我要写冒险记哔！　\n　我要写冒险记，\n　成为世界第一的史莱姆作家哔！\n@c0@"
  tl: "@a@b“沒錯！我要寫冒險記嗶！　\n　我要寫冒險記，\n　成為世界第一的史萊姆作家嗶！\n@c0@"
131:
  en: "@a@b‘I have no doubt that “A Slime's Story” will make me the world's foremost literary slime!’                                    THE END\n@c0@"
  ja: "@a@b“プルプルが止まらないっ！？\n　『ボクのスライム冒険記』は\n　ぜったい　書き上げるッピ！”　　　　－完－\n@c0@"
  ko: "@a@b''뽀용뽀용이 멈추질 않네!?\n'나의 슬라임 모험기'는\n꼭 완성하고 말 거다삐!''   -끝-\n@c0@"
  sl: "@a@b“抖抖根本停不下来？！\n　我一定要完成\n　《我的史莱姆冒险记》哔！”　　　　－完－\n@c0@"
  tl: "@a@b“抖抖根本停不下來？！\n　我一定要完成\n　《我的史萊姆冒險記》嗶！”　　　　－完－\n@c0@"
