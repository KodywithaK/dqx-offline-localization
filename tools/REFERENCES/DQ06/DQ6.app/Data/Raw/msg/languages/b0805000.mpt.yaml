3:
  en: "@a@bThere's a book entitled ‘The Quotable Slime: Volume One’. %0%a000120 takes it from the shelf and has a closer look.\n@c0@"
  ja: "@a@b「スライム名言集１」と\n書かれた本がある。\n%a000120は　手にとってみた。\n@c0@"
  ko: "@a@b'슬라임 명언집 1'이라고\n쓰인 책이 있다.\n%a000120%F0120%X는%Y은%Z 책을 집어들었다.\n@c0@"
