16:
  en: "@a@b‘Legend speaks of a king who lavished wonderful prizes on any who helped him collect mini medals.\n@c0@"
  ja: "@a@b“ちいさなメダルを　集めると\n　いろんなものを　くれる　王さまが\n　どこかに　いたらしい。\n@c0@"
  ko: "@a@b''작은 메달을 모으면\n다양한 물건을 주는 왕이\n어딘가에 있다고 한다.''\n@c0@"
  sl: "@a@b“据说在世界的某处有个国王，\n　只要收集一定数量的小徽章，\n　就可以从他那里换来很多东西。\n@c0@"
  tl: "@a@b“據說在世界的某處有個國王，\n　只要收集一定數量的小徽章，\n　就可以從他那裡換來很多東西。\n@c0@"
17:
  en: "@a@b‘But whether or not this king still exists is shrouded in mystery...’\n@c0@"
  ja: "@a@b“しかし　今も　いるのか\n　それは　なぞである……。”\n@c0@"
  ko: "@a@b''하지만 지금도 존재하는지는\n수수께끼다......''\n@c0@"
  sl: "@a@b“但是不知道\n　他现在是否还健在……”\n@c0@"
  tl: "@a@b“但是不知道\n　他現在是否還健在……”\n@c0@"
18:
  en: "@a@bThere's a book entitled ‘The Quotable Slime: Volume Two’. %0%a000120 takes it from the shelf and has a closer look.\n@c0@"
  ja: "@a@b「スライム名言集２」と\n書かれた本がある。\n%a000120は　手にとってみた。\n@c0@"
  ko: "@a@b'슬라임 명언집 2'라고\n쓰인 책이 있다.\n%a000120%F0120%X는%Y은%Z 책을 집어들었다.\n@c0@"
