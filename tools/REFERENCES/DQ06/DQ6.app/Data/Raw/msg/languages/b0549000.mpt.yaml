0:
  en: "@a%0%a002000@bHardy har! I shoulda known the Isle o' Smiles would be a sham.\n@c0@"
  ja: "@a@b%a002000「しあわせの国。\n\tやっぱり　こんなオチ　だったな。\n@c0@"
  ko: "@a@b%a002000: 행복의 나라.\n역시 이런 비밀이 있었군.\n@c0@"
  sl: "@a@b%a002000：幸福国果然\n　　落得这么个下场啊。\n@c0@"
  tl: "@a@b%a002000：幸福國果然\n　　落得這麼個下場啊。\n@c0@"
1:
  en: "@a%0%a002000@bWell, I suppose we're headed back to Aridea for now, aye?\n@c0@"
  ja: "@a@b%a002000「さて　それじゃ\n\tいったん　カルカドに　もどるか。\n@c0@"
  ko: "@a@b%a002000: 자, 그럼\n일단 캘커드로 돌아갈까?\n@c0@"
  sl: "@a@b%a002000：那么咱就先\n　　回趟加尔加德吧。\n@c0@"
  tl: "@a@b%a002000：那麼咱就先\n　　回趟加爾加德吧。\n@c0@"
2:
  en: "@a%0%a002000@bI bet the rest of the passengers are waitin' for us back on the floating island.\n@c0@"
  ja: "@a@b%a002000「ここに　来た連中も\n\t浮き島で　オレたちが　来るのを\n\t待ってるはずだぜ。\n@c0@"
  ko: "@a@b%a002000: 여기 있었던 녀석들도\n아까 그 섬에서 우리가 오기를\n기다리고 있을걸.\n@c0@"
  sl: "@a@b%a002000：来这里的人们\n　　应该也在浮岛上\n　　等着咱吧。\n@c0@"
  tl: "@a@b%a002000：來這裡的人們\n　　應該也在浮島上\n　　等著咱吧。\n@c0@"
3:
  en: "@a%0%a002010@bDid you notice, %a000090? Jamirus spoke someone's name when he died...\n@c0@"
  ja: "@a@b%a002010「ジャミラス……あいつ\n\t誰かの　名を呼びながら\n\t死んでいったわ。\n@c0@"
  ko: "@a@b%a002010: 쟈미라스...... 녀석은\n누군가의 이름을 부르며\n죽어갔어.\n@c0@"
  sl: "@a@b%a002010：贾米拉斯……\n　　那家伙在死的时候\n　　叫了一个名字呢……\n@c0@"
  tl: "@a@b%a002010：賈米拉斯……\n　　那傢伙在死的時候\n　　叫了一個名字呢……\n@c0@"
4:
  en: "@a%0%a002010@bCould this mean that more Dread Fiends await us now that Jamirus is gone...?\n@c0@"
  ja: "@a@b%a002010「ジャミラスを　倒しても\n\tまだ　次の相手がいる……\n\tということなのでしょうね。\n@c0@"
  ko: "@a@b%a002010: 쟈미라스를 쓰러뜨려도\n또 다음 상대가 있다......\n그런 뜻일까?\n@c0@"
  sl: "@a@b%a002010：也就是说，\n　　即使打倒了贾米拉斯，\n　　接下来还会有别的敌人吧。\n@c0@"
  tl: "@a@b%a002010：也就是說，\n　　即使打倒了賈米拉斯，\n　　接下來還會有別的敵人吧。\n@c0@"
5:
  en: "@a%0%a002020@bThank the Goddess all those trapped souls were released from their prison or whatever!\n@c0@"
  ja: "@a@b%a002020「いけにえに　なっていた\n\t人たちの　たましいが\n\t解放されて　よかったわね！\n@c0@"
  ko: "@a@b%a002020: 제물이 되었던\n사람들의 영혼이\n풀려나서 다행이야!\n@c0@"
  sl: "@a@b%a002020：成为了祭品的\n　　人们的灵魂得到解脱了！\n　　真是太好了！\n@c0@"
  tl: "@a@b%a002020：成為了祭品的\n　　人們的靈魂得到解脫了！\n　　真是太好了！\n@c0@"
6:
  en: "@a%0%a002020@bBut where did that King Medallion guy go after he popped out at the end?\n@c0@"
  ja: "@a@b%a002020「それにしても　最後に\n\t飛び出してきた　メダル王さまって\n\tどこに　いるんだろう……。\n@c0@"
  ko: "@a@b%a002020: 그나저나 마지막에\n튀어나왔던 메달 왕이라는 사람은\n어디 있는 걸까......\n@c0@"
  sl: "@a@b%a002020：不过，\n　　最后蹦出来的那个徽章王，\n　　现在在哪呢……\n@c0@"
  tl: "@a@b%a002020：不過，\n　　最後蹦出來的那個徽章王，\n　　現在在哪呢……\n@c0@"
7:
  en: "@a%0%a002020@bI think we have some mini medals, but what's the point if we don't know where to take them?\n@c0@"
  ja: "@a@b%a002020「小さなメダルは\n\t持ってるけど　お城の　場所が\n\tわかんないよね。\n@c0@"
  ko: "@a@b%a002020: 작은 메달을\n가지고 있는데 성의 위치를\n알 수가 없다니까.\n@c0@"
  sl: "@a@b%a002020：虽然我们\n　　手里有小徽章，\n　　但是不知道城堡在哪呢。\n@c0@"
  tl: "@a@b%a002020：雖然我們\n　　手裡有小徽章，\n　　但是不知道城堡在哪呢。\n@c0@"
8:
  en: "@a%0%a002030@bIt seems that with Jamirus defeated, all of his underlings have fled.\n@c0@"
  ja: "@a@b%a002030「ジャミラスを倒したら\n\t部下の　まものたちは　みんな\n\t逃げてしまったようです。\n@c0@"
  ko: "@a@b%a002030: 쟈미라스를 쓰러뜨리니\n그 아래에 있던 마물들은 모두\n도망친 것 같습니다.\n@c0@"
  sl: "@a@b%a002030：贾米拉斯被打倒之后，\n　　手下的魔物好像都\n　　树倒猢狲散了呢。\n@c0@"
  tl: "@a@b%a002030：賈米拉斯被打倒之後，\n　　手下的魔物好像都\n　　樹倒猢猻散了呢。\n@c0@"
9:
  en: "@a%0%a002050@bJustice will always prevail, I tell you!\n@c0@"
  ja: "@a@b%a002050「わっはっは！\n\t正義は　つねに　勝つのです！\n@c0@"
  ko: "@a@b%a002050: 와하하!\n정의는 항상 이긴다구요!\n@c0@"
  sl: "@a@b%a002050：哇哈哈！\n　　邪不胜正啊！\n@c0@"
  tl: "@a@b%a002050：哇哈哈！\n　　邪不勝正啊！\n@c0@"
10:
  en: "@a%0%a002000@bPretty crazy place, aye?\n@c0@"
  ja: "@a@b%a002000「しかし　まあ\n\tすごい　ところだぜ……。\n@c0@"
  ko: "@a@b%a002000: 그나저나\n엄청난 곳이었어......\n@c0@"
  sl: "@a@b%a002000：不过，\n　　这地方还真厉害……\n@c0@"
  tl: "@a@b%a002000：不過，\n　　這地方還真厲害……\n@c0@"
11:
  en: "@a%0%a002010@bShall we return to Aridea to see how it's doing?\n@c0@"
  ja: "@a@b%a002010「さあ　カルカドへ\n\tようすを見に　もどりましょう。\n@c0@"
  ko: "@a@b%a002010: 자, 캘커드를\n살펴보러 가 보자.\n@c0@"
  sl: "@a@b%a002010：我们还是\n　　回加尔加德看一看吧。\n@c0@"
  tl: "@a@b%a002010：我們還是\n　　回加爾加德看一看吧。\n@c0@"
12:
  en: "@a%0%a002020@b‘Isle o' Smiles’? ‘Mound of Frowns’ is more like it.\n@c0@"
  ja: "@a@b%a002020「よく　こんなとこを\n\tしあわせの国　だなんて\n\t呼んだものよね。\n@c0@"
  ko: "@a@b%a002020: 이런 곳을 잘도\n행복의 나라라고\n불렀단 말이지?\n@c0@"
  sl: "@a@b%a002020：居然把这种地方\n　　叫做幸福国啊。\n@c0@"
  tl: "@a@b%a002020：居然把這種地方\n　　叫做幸福國啊。\n@c0@"
13:
  en: "@a%0%a002030@bI am afraid that the folly of man has been amply demonstrated by this affair.\n@c0@"
  ja: "@a@b%a002030「今回の事件は\n\tあらためて　人間の　おろかさを\n\t教えてくれましたね。\n@c0@"
  ko: "@a@b%a002030: 이번 사건은\n인간의 우둔함을 다시 한 번\n일깨워 줬습니다.\n@c0@"
  sl: "@a@b%a002030：通过这次事件，\n　　我再次深刻体会到了\n　　人类的愚蠢。\n@c0@"
  tl: "@a@b%a002030：通過這次事件，\n　　我再次深刻體會到了\n　　人類的愚蠢。\n@c0@"
14:
  en: "@a%0%a002050@bAll of these victims happily came of their own accord.\n@c0@"
  ja: "@a@b%a002050「だまっていても\n\tいけにえが　自分から\n\tよろこんで　来てくれる。\n@c0@"
  ko: "@a@b%a002050: 아무 말 하지 않아도\n제물이 알아서\n기꺼이 와 주는 곳.\n@c0@"
  sl: "@a@b%a002050：即使什么都不说，\n　　祭品也会屁颠屁颠地\n　　自己送上门的吧。\n@c0@"
  tl: "@a@b%a002050：即使什麼都不說，\n　　祭品也會屁顛屁顛地\n　　自己送上門的吧。\n@c0@"
15:
  en: "@a%0%a002050@bIf you think about it, the only ones who could call this place a paradise are the monsters!\n@c0@"
  ja: "@a@b%a002050「ここは　まものにとっての\n\tしあわせの国　だったんですね。\n@c0@"
  ko: "@a@b%a002050: 이곳은 마물들 입장에서\n행복의 나라였던 거군요.\n@c0@"
  sl: "@a@b%a002050：这里对于魔物来说，\n　　的确是幸福国呢。\n@c0@"
  tl: "@a@b%a002050：這裡對於魔物來說，\n　　的確是幸福國呢。\n@c0@"
16:
  en: "@a%0%a002000@bOur ride's still here! Time to shove off to Aridea, aye?\n@c0@"
  ja: "@a@b%a002000「よーし！\n\tそれじゃ　カルカドに　向けて\n\t出発するか！\n@c0@"
  ko: "@a@b%a002000: 좋아!\n그럼 캘커드를 향해\n출발해 볼까!\n@c0@"
  sl: "@a@b%a002000：好了！\n　　朝着加尔加德出发吧！\n@c0@"
  tl: "@a@b%a002000：好了！\n　　朝著加爾加德出發吧！\n@c0@"
17:
  en: "@a%0%a002010@bI wonder if all the people who've awoken from that nightmare are waiting quietly inside?\n@c0@"
  ja: "@a@b%a002010「夢から　さめた\n\tみなさんは　中で　おとなしく\n\t待っているかしらね？\n@c0@"
  ko: "@a@b%a002010: 꿈에서 깬\n사람들은 안에서 얌전히\n기다리고 있을까?\n@c0@"
  sl: "@a@b%a002010：从美梦中\n　　清醒过来的人们，\n　　在里面老老实实等着呢吧？\n@c0@"
  tl: "@a@b%a002010：從美夢中\n　　清醒過來的人們，\n　　在裡面老老實實等著呢吧？\n@c0@"
18:
  en: "@a%0%a002020@bHey, do you think we could learn how to drive this thing?\n@c0@"
  ja: "@a@b%a002020「ねえねえ。\n\tこの島　あたしたちで\n\tあやつれるかなあ……？\n@c0@"
  ko: "@a@b%a002020: 있잖아.\n이 섬 우리가\n움직일 수 있을까......?\n@c0@"
  sl: "@a@b%a002020：喂喂，\n　　我们能开得动\n　　这座岛吗？\n@c0@"
  tl: "@a@b%a002020：喂喂，\n　　我們能開得動\n　　這座島嗎？\n@c0@"
19:
  en: "@a%0%a002020@b...Oh — there's already someone at the controls!\n@c0@"
  ja: "@a@b%a002020「……って　あら？\n\tそうじゅう台に　だれか\n\tいるみたいよ？\n@c0@"
  ko: "@a@b%a002020: ......어머?\n조종대에 누가\n있는 것 같은데?\n@c0@"
  sl: "@a@b%a002020：……诶？\n　　操纵台那里\n　　好像有个人？\n@c0@"
  tl: "@a@b%a002020：……誒？\n　　操縱臺那裡\n　　好像有個人？\n@c0@"
20:
  en: "@a%0%a002030@bWith no monsters to worry about, we have free use of this island.\n@c0@"
  ja: "@a@b%a002030「まものは　すっかり\n\tいなくなったから　この島は\n\t自由に　使えますね。\n@c0@"
  ko: "@a@b%a002030: 마물이 완전히\n없어졌으니 이 섬은\n자유롭게 사용할 수 있겠군요.\n@c0@"
  sl: "@a@b%a002030：魔物已经全部消灭了，\n　　所以这座岛也能\n　　自由使用了呢。\n@c0@"
  tl: "@a@b%a002030：魔物已經全部消滅了，\n　　所以這座島也能\n　　自由使用了呢。\n@c0@"
21:
  en: "@a%0%a002050@bThere's someone standin' by the entrance to that there buildin'. D'you reckon it's a monster?\n@c0@"
  ja: "@a@b%a002050「建物の　入口にも\n\tだれか　立っていますが……\n\tまものじゃ　ないですよね？\n@c0@"
  ko: "@a@b%a002050: 건물 입구에도\n누가 서 있는데......\n마물은 아니겠죠?\n@c0@"
  sl: "@a@b%a002050：建筑的入口处\n　　也有人站在那里……\n　　应该不是魔物吧？\n@c0@"
  tl: "@a@b%a002050：建築的入口處\n　　也有人站在那裡……\n　　應該不是魔物吧？\n@c0@"
22:
  en: "@a%0%a002000@bHardy har is right! Lucky thing we had a salty sailor aboard. Let's leave the driving to him, aye?\n@c0@"
  ja: "@a@b%a002000「船を　あやつれる人がいて\n\tたすかったな。\n\tこの人に　まかせようや。\n@c0@"
  ko: "@a@b%a002000: 배를 조종할 수 있는 사람이\n있어서 다행이군.\n이 사람에게 맡기자고.\n@c0@"
  sl: "@a@b%a002000：有人能开船，\n　　真是帮大忙了啊。\n　　就交给这个人吧。\n@c0@"
  tl: "@a@b%a002000：有人能開船，\n　　真是幫大忙了啊。\n　　就交給這個人吧。\n@c0@"
23:
  en: "@a%0%a002010@bHee hee. The old gent is in his element.\n@c0@"
  ja: "@a@b%a002010「うふふ　おじいさん\n\tあんなに　はりきっちゃって。\n@c0@"
  ko: "@a@b%a002010: 우후훗. 할아버지\n대단한 의욕인걸.\n@c0@"
  sl: "@a@b%a002010：呵呵。\n　　老爷爷干劲十足呢。\n@c0@"
  tl: "@a@b%a002010：呵呵。\n　　老爺爺幹勁十足呢。\n@c0@"
24:
  en: "@a%0%a002020@bWow! That's one guy who loves his job!\n@c0@"
  ja: "@a@b%a002020「おじいさん\n\tうれしそう！\n@c0@"
  ko: "@a@b%a002020: 할아버지\n즐거워 보여!\n@c0@"
  sl: "@a@b%a002020：老爷爷\n　　看上去好开心！\n@c0@"
  tl: "@a@b%a002020：老爺爺\n　　看上去好開心！\n@c0@"
25:
  en: "@a%0%a002030@bThe Providence is one thing, but sailing an entire island might prove to be something of an ordeal.\n@c0@"
  ja: "@a@b%a002030「私たちは　神の船で\n\tなれてるとはいえ　島を動かす\n\tとなると　勝手がちがいそうです。\n@c0@"
  ko: "@a@b%a002030: 우리는 신의 배에\n익숙하긴 하지만, 섬을 움직이는 건\n또 다른 문제일 겁니다.\n@c0@"
  sl: "@a@b%a002030：虽然我们已经\n　　习惯了神之船，但是岛的操作\n　　跟我们知道的完全不一样呢。\n@c0@"
  tl: "@a@b%a002030：雖然我們已經\n　　習慣了神之船，但是島的操作\n　　跟我們知道的完全不一樣呢。\n@c0@"
26:
  en: "@a%0%a002030@bFor now at least, we should leave it to this gentleman.\n@c0@"
  ja: "@a@b%a002030「今は　この人に\n\tおまかせしましょう。\n@c0@"
  ko: "@a@b%a002030: 지금은 이 사람에게\n맡겨 둡시다.\n@c0@"
  sl: "@a@b%a002030：现在就\n　　交给这个人吧。\n@c0@"
  tl: "@a@b%a002030：現在就\n　　交給這個人吧。\n@c0@"
27:
  en: "@a%0%a002050@bThat fellow's a dab hand with a rudder, and no mistake!\n@c0@"
  ja: "@a@b%a002050「おじいさん\n\tなかなか　あざやかな\n\tカジさばきですねー！\n@c0@"
  ko: "@a@b%a002050: 할아버지\n굉장히 시원시원하게\n키를 잡으시는군요~!\n@c0@"
  sl: "@a@b%a002050：老爷爷掌舵的手法\n　　真是花哨娴熟啊！\n@c0@"
  tl: "@a@b%a002050：老爺爺掌舵的手法\n　　真是花哨嫺熟啊！\n@c0@"
28:
  en: "@a%0%a002000@bI feel pretty safe leavin' the island in his hands.\n@c0@"
  ja: "@a@b%a002000「この人に　まかせておいて\n\tだいじょうぶそうだな。\n@c0@"
  ko: "@a@b%a002000: 이 사람에게 맡겨도\n문제없겠군.\n@c0@"
  sl: "@a@b%a002000：交给这个人\n　　应该就没问题了。\n@c0@"
  tl: "@a@b%a002000：交給這個人\n　　應該就沒問題了。\n@c0@"
29:
  en: "@a%0%a002010@bNow's his opportunity to look for real happiness.\n@c0@"
  ja: "@a@b%a002010「おじいさん\n\tいまこそ　本当の　しあわせを\n\t見つけたって　顔しているわ。\n@c0@"
  ko: "@a@b%a002010: 할아버지는\n이제서야 진정한 행복을\n찾았다는 듯한 표정이야.\n@c0@"
  sl: "@a@b%a002010：老爷爷此时此刻\n　　才终于找到了真正的幸福，\n　　一脸开心呢。\n@c0@"
  tl: "@a@b%a002010：老爺爺此時此刻\n　　才終於找到了真正的幸福，\n　　一臉開心呢。\n@c0@"
30:
  en: "@a%0%a002020@bI wish he'd keep his eyes on the ocean while he's manning the helm or whatever it's called...\n@c0@"
  ja: "@a@b%a002020「そうじゅう中に\n\tこっちを　見るのは　ちょっと\n\tこわいんですけど……。\n@c0@"
  ko: "@a@b%a002020: 조종 중에\n이쪽을 보는 건 좀\n무서운데......\n@c0@"
  sl: "@a@b%a002020：开船的时候\n　　看着这边，\n　　倒是有点可怕呢……\n@c0@"
  tl: "@a@b%a002020：開船的時候\n　　看著這邊，\n　　倒是有點可怕呢……\n@c0@"
31:
  en: "@a%0%a002030@bThat man seems to have found his true calling.\n@c0@"
  ja: "@a@b%a002030「ひとは\n\t生きがいを　見つけたとき\n\tいい顔に　なるものですね。\n@c0@"
  ko: "@a@b%a002030: 사람은\n삶의 보람을 찾았을 때\n좋은 표정을 짓는군요.\n@c0@"
  sl: "@a@b%a002030：人们在找到\n　　人生价值的时候，\n　　都会露出幸福的表情呢。\n@c0@"
  tl: "@a@b%a002030：人們在找到\n　　人生價值的時候，\n　　都會露出幸福的表情呢。\n@c0@"
32:
  en: "@a%0%a002050@bHis rudder arm's clearly had a few years' practice.\n@c0@"
  ja: "@a@b%a002050「若いころ　きたえたウデは\n\tたしかな　ようですね。\n@c0@"
  ko: "@a@b%a002050: 젊은 시절에 쌓았던 실력이\n아직 안 죽었군요.\n@c0@"
  sl: "@a@b%a002050：看来年轻的时候\n　　的确练就了一身本事呢。\n@c0@"
  tl: "@a@b%a002050：看來年輕的時候\n　　的確練就了一身本事呢。\n@c0@"
33:
  en: "@a%0%a002000@bCrikey! Someone's drivin' us? We should see who it is.\n@c0@"
  ja: "@a@b%a002000「へえ　そうなのか。\n\tちょっと　見に行って\n\tみようぜ。\n@c0@"
  ko: "@a@b%a002000: 호오, 그런가?\n잠깐 보러\n다녀오자.\n@c0@"
  sl: "@a@b%a002000：诶，是吗？\n　　那咱就去看看吧。\n@c0@"
  tl: "@a@b%a002000：誒，是嗎？\n　　那咱就去看看吧。\n@c0@"
34:
  en: "@a%0%a002010@bMaybe we should go and introduce ourselves to the driver.\n@c0@"
  ja: "@a@b%a002010「すすんで　やってくださる\n\t人が　いるなら　かんげいよね。\n@c0@"
  ko: "@a@b%a002010: 나서서 하겠다고 하는\n사람이 있으면 대환영이야.\n@c0@"
  sl: "@a@b%a002010：能有人载我们回去的话，\n　　我们很欢迎呢。\n@c0@"
  tl: "@a@b%a002010：能有人載我們回去的話，\n　　我們很歡迎呢。\n@c0@"
35:
  en: "@a%0%a002020@bC'mon, let's go see!\n@c0@"
  ja: "@a@b%a002020「見にいこ　見にいこ。\n@c0@"
  ko: "@a@b%a002020: 보러 가자~\n@c0@"
  sl: "@a@b%a002020：去看看去看看。\n@c0@"
  tl: "@a@b%a002020：去看看去看看。\n@c0@"
36:
  en: "@a%0%a002030@bOur time on the Providence has blessed us with some competence in sailing.\n@c0@"
  ja: "@a@b%a002030「私たちも　みな\n\t航海術は　神の船で\n\t身につけて　いますからね。\n@c0@"
  ko: "@a@b%a002030: 우리도 모두\n신의 배를 몰면서 항해술을\n익혔지요.\n@c0@"
  sl: "@a@b%a002030：我们也在\n　　神之船上学习到了\n　　航海的技术呢。\n@c0@"
  tl: "@a@b%a002030：我們也在\n　　神之船上學習到了\n　　航海的技術呢。\n@c0@"
37:
  en: "@a%0%a002030@bShould that man get into trouble, I am sure we will be able to assist him.\n@c0@"
  ja: "@a@b%a002030「もし　あぶなそうなら\n\tそのとき　お手伝いすれば\n\tいいと　思います。\n@c0@"
  ko: "@a@b%a002030: 혹시 위험해 보이면\n그때 가서 도와 드리면\n될 겁니다.\n@c0@"
  sl: "@a@b%a002030：要是觉得危险的话，\n　　那个时候再去帮忙\n　　就好了。\n@c0@"
  tl: "@a@b%a002030：要是覺得危險的話，\n　　那個時候再去幫忙\n　　就好了。\n@c0@"
38:
  en: "@a%0%a002050@bJust lookin' at that fellow's back, you can tell he's puttin' his heart and soul into it.\n@c0@"
  ja: "@a@b%a002050「あの　おじいさんの\n\t背中からは　やる気の　オーラを\n\t感じますね。\n@c0@"
  ko: "@a@b%a002050: 저 할아버지의\n뒷모습에서는 의욕의 기운이\n뿜어져 나오는군요.\n@c0@"
  sl: "@a@b%a002050：从那个老爷爷的背影里，\n　　能够感觉得到他的\n　　十足干劲呢。\n@c0@"
  tl: "@a@b%a002050：從那個老爺爺的背影裡，\n　　能夠感覺得到他的\n　　十足幹勁呢。\n@c0@"
39:
  en: "@a%0%a002000@bHe's lucky they didn't throw him overboard. Hope he learnt a lesson from this.\n@c0@"
  ja: "@a@b%a002000「やつらの　正体を見て\n\tよく　殺されなかったよな。\n\tしあわせもんだぜ　あんた！\n@c0@"
  ko: "@a@b%a002000: 놈들의 정체를 보고\n용케도 살아남았군.\n당신, 행복한 줄 알라고!\n@c0@"
  sl: "@a@b%a002000：发现了那些家伙\n　　的真实身份，居然还能活命。\n　　你还真幸运啊！\n@c0@"
  tl: "@a@b%a002000：發現了那些傢伙\n　　的真實身份，居然還能活命。\n　　你還真幸運啊！\n@c0@"
40:
  en: "@a%0%a002010@bThey must have just forgotten about him after throwing him in here, the poor thing.\n@c0@"
  ja: "@a@b%a002010「ここに　入れられたっきり\n\t忘れられて　いたようね。\n@c0@"
  ko: "@a@b%a002010: 여기에 집어넣곤\n잊어버렸나 봐.\n@c0@"
  sl: "@a@b%a002010：被关进这里之后\n　　就被忘了吧。\n@c0@"
  tl: "@a@b%a002010：被關進這裡之後\n　　就被忘了吧。\n@c0@"
41:
  en: "@a%0%a002020@bHe could've wound up with a lot worse than a bum back!\n@c0@"
  ja: "@a@b%a002020「おー　いてて　くらいだから\n\tまあ　たいしたことなくて\n\tよかったわよね。\n@c0@"
  ko: "@a@b%a002020: 그 정도로 아프고 끝났다면\n별일 없어서\n다행이네.\n@c0@"
  sl: "@a@b%a002020：这么精神地喊疼，\n　　看上去也没什么大碍呢，\n　　太好了。\n@c0@"
  tl: "@a@b%a002020：這麼精神地喊疼，\n　　看上去也沒什麼大礙呢，\n　　太好了。\n@c0@"
42:
  en: "@a%0%a002030@bI think we can rest easy knowing that we have come to the aid of all who needed it.\n@c0@"
  ja: "@a@b%a002030「これで　もう\n\t助けられる人は　みなさん\n\t助けたんじゃ　ないでしょうか。\n@c0@"
  ko: "@a@b%a002030: 이제\n구할 수 있는 사람은 모두\n구한 거 아닐까요?\n@c0@"
  sl: "@a@b%a002030：这下子，\n　　需要救助的人\n　　我们都救下了吧。\n@c0@"
  tl: "@a@b%a002030：這下子，\n　　需要救助的人\n　　我們都救下了吧。\n@c0@"
43:
  en: "@a%0%a002050@bOld %a002050 was a tad worried the lad might up and attack us there for a moment...\n@c0@"
  ja: "@a@b%a002050「話しかけたら　いきなり\n\tおそいかかってくるかと\n\tドキドキしてましたよ。\n@c0@"
  ko: "@a@b%a002050: 말을 걸면 갑자기\n달려들까 싶어서\n가슴이 뛰었다구요.\n@c0@"
  sl: "@a@b%a002050：我之前担心要是跟他说话，\n　　他会突然袭击我们，\n　　一直好紧张呢。\n@c0@"
  tl: "@a@b%a002050：我之前擔心要是跟他說話，\n　　他會突然襲擊我們，\n　　一直好緊張呢。\n@c0@"
44:
  en: "@a%0%a002000@bLet's hope this whole experience'll push these folks back in the right direction, aye?\n@c0@"
  ja: "@a@b%a002000「これに　こりて\n\tマジメに　はたらくように\n\tなってくれりゃ　いいけどな。\n@c0@"
  ko: "@a@b%a002000: 이번 일을 계기로\n성실하게 일하게\n된다면 다행이군.\n@c0@"
  sl: "@a@b%a002000：要是能吸取这次教训，\n　　今后老实干活的话\n　　就好了啊。\n@c0@"
  tl: "@a@b%a002000：要是能吸取這次教訓，\n　　今後老實幹活的話\n　　就好了啊。\n@c0@"
45:
  en: "@a%0%a002010@bThese people thought they were going to heaven, but they ended up going to hell and back.\n@c0@"
  ja: "@a@b%a002010「この人たちは\n\t天国と　じごくを　いっぺんに\n\tけいけんしたような　ものね。\n@c0@"
  ko: "@a@b%a002010: 이 사람만큼은\n천국과 지옥을 동시에\n경험한 거나 마찬가지야.\n@c0@"
  sl: "@a@b%a002010：这些人同时\n　　经历了从天堂到地狱的\n　　两重天呢。\n@c0@"
  tl: "@a@b%a002010：這些人同時\n　　經歷了從天堂到地獄的\n　　兩重天呢。\n@c0@"
46:
  en: "@a%0%a002020@bHey, wasn't that the guy we found in the corner by the bar before?\n@c0@"
  ja: "@a@b%a002020「ひょっとして　この人って\n\t行きの船の　カウンターの横で\n\tコソコソしてた人？\n@c0@"
  ko: "@a@b%a002020: 혹시 이 사람,\n아까 가는 길에 카운터 옆에서\n수군대던 그 사람인가?\n@c0@"
  sl: "@a@b%a002020：这个人难不成就是\n　　在来的时候一直在船的柜台边\n　　蹑手蹑脚的人？\n@c0@"
  tl: "@a@b%a002020：這個人難不成就是\n　　在來的時候一直在船的櫃檯邊\n　　躡手躡腳的人？\n@c0@"
47:
  en: "@a%0%a002030@bHopefully they will all have learned a valuable lesson from this — home is where true happiness lives.\n@c0@"
  ja: "@a@b%a002030「これから　帰るところが\n\tみなさんにとって　本当の\n\tしあわせの国ですね。\n@c0@"
  ko: "@a@b%a002030: 앞으로 돌아갈 곳이\n여러분들에게는 진정한\n행복의 나라지요.\n@c0@"
  sl: "@a@b%a002030：接下来要回去的地方，\n　　对于大家来说才是\n　　真正的幸福国呢。\n@c0@"
  tl: "@a@b%a002030：接下來要回去的地方，\n　　對於大家來說才是\n　　真正的幸福國呢。\n@c0@"
48:
  en: "@a%0%a002050@bLet's hope that fellow pulls his socks up from now on!\n@c0@"
  ja: "@a@b%a002050「いろんな意味で\n\tこれからは　マジメに\n\t生きていって　ほしいですね。\n@c0@"
  ko: "@a@b%a002050: 여러 의미로\n앞으로는 성실하게\n살아 줬으면 좋겠군요.\n@c0@"
  sl: "@a@b%a002050：从各种意义上来说，\n　　真希望他们今后能\n　　好好生活，努力工作呢。\n@c0@"
  tl: "@a@b%a002050：從各種意義上來說，\n　　真希望他們今後能\n　　好好生活，努力工作呢。\n@c0@"
49:
  en: "@a%0%a002000@bI'm surprised he even remembers, given how many drinks he had.\n@c0@"
  ja: "@a@b%a002000「ずいぶん　酔ってたくせに\n\tちゃんと　そういうことは\n\t覚えてるんだな。\n@c0@"
  ko: "@a@b%a002000: 엄청 취했으면서\n그런 건 꼭 제대로\n기억하고 있네.\n@c0@"
  sl: "@a@b%a002000：明明喝得这么醉，\n　　这事倒是记得\n　　比谁都清楚呢。\n@c0@"
  tl: "@a@b%a002000：明明喝得這麼醉，\n　　這事倒是記得\n　　比誰都清楚呢。\n@c0@"
50:
  en: "@a%0%a002010@bThat old drunk is something of a monster himself...\n@c0@"
  ja: "@a@b%a002010「うふふ。\n\tいっきに酔いも　さめたでしょう。\n@c0@"
  ko: "@a@b%a002010: 우후후.\n술기운이 단번에 싹 가시지?\n@c0@"
  sl: "@a@b%a002010：呵呵。\n　　一下子就从酒醉里清醒了呢。\n@c0@"
  tl: "@a@b%a002010：呵呵。\n　　一下子就從酒醉裡清醒了呢。\n@c0@"
51:
  en: "@a%0%a002020@bI bet he could gargle with holy water and still taste that kiss.\n@c0@"
  ja: "@a@b%a002020「きっと　この人の　夢に\n\tこれから　何度も　出てくるわね。\n\tまものの　バニーちゃん。\n@c0@"
  ko: "@a@b%a002020: 이 사람 꿈에\n앞으로 계속 나올 거야.\n마물 바니걸.\n@c0@"
  sl: "@a@b%a002020：魔物乔装的兔女郎，\n　　今后也会不断在\n　　这个人的梦里出现吧。\n@c0@"
  tl: "@a@b%a002020：魔物喬裝的兔女郎，\n　　今後也會不斷在\n　　這個人的夢裡出現吧。\n@c0@"
52:
  en: "@a%0%a002030@bDid that fellow plant those kisses before or after he was drunk?\n@c0@"
  ja: "@a@b%a002030「本当に　酔ってたから\n\tチュー　したのでしょうか……。\n@c0@"
  ko: "@a@b%a002030: 정말 취해서\n뽀뽀를 한 걸까요......\n@c0@"
  sl: "@a@b%a002030：真的是因为喝醉\n　　才亲的么……\n@c0@"
  tl: "@a@b%a002030：真的是因為喝醉\n　　才親的麼……\n@c0@"
53:
  en: "@a%0%a002050@bHe'd have been better off just givin' 'em a peck on the cheek!\n@c0@"
  ja: "@a@b%a002050「いやー　ホッペで\n\tよかったじゃないですか！\n@c0@"
  ko: "@a@b%a002050: 이야~ 볼에 해서\n그나마 다행 아닌가요!\n@c0@"
  sl: "@a@b%a002050：哎呀，\n　　亲的只是脸真是万幸啊！\n@c0@"
  tl: "@a@b%a002050：哎呀，\n　　親的只是臉真是萬幸啊！\n@c0@"
54:
  en: "@a%0%a002000@bHardy har! He's probably better off not knowin', aye?\n@c0@"
  ja: "@a@b%a002000「ま　知らないほうが\n\tしあわせって　ことだな。\n@c0@"
  ko: "@a@b%a002000: 뭐, 모르는 게\n행복하겠군.\n@c0@"
  sl: "@a@b%a002000：唉，无知是福啊。\n@c0@"
  tl: "@a@b%a002000：唉，無知是福啊。\n@c0@"
55:
  en: "@a%0%a002010@bHmph. I've a mind to tell him the truth, in the hope that it straightens him out a bit.\n@c0@"
  ja: "@a@b%a002010「本当のことを\n\t言って　あげたほうが\n\tこの人には　いい　クスリかも？\n@c0@"
  ko: "@a@b%a002010: 진실을\n말해 주는 게\n이 사람에겐 약이 될 텐데?\n@c0@"
  sl: "@a@b%a002010：告诉这个人真相，\n　　说不定是\n　　一剂不错的醒酒药呢？\n@c0@"
  tl: "@a@b%a002010：告訴這個人真相，\n　　說不定是\n　　一劑不錯的醒酒藥呢？\n@c0@"
56:
  en: "@a%0%a002020@bTee hee! How does he know those beasts were even female?\n@c0@"
  ja: "@a@b%a002020「あたし　わかってた。\n\tホントは　みんな　まもので\n\tしかも　オス　だったよね！\n@c0@"
  ko: "@a@b%a002020: 난 다 알고 있었어.\n사실 모두 마물이었고\n심지어 모두 수컷이었지!\n@c0@"
  sl: "@a@b%a002020：我知道了。\n　　其实它们都是魔物，\n　　而且都是公的！\n@c0@"
  tl: "@a@b%a002020：我知道了。\n　　其實它們都是魔物，\n　　而且都是公的！\n@c0@"
57:
  en: "@a%0%a002030@bThose girls did indeed have voices most unbecoming of bunnies...\n@c0@"
  ja: "@a@b%a002030「声の　ふとい\n\tバニーでしたよね……。\n@c0@"
  ko: "@a@b%a002030: 목소리가 굵은\n바니걸이었지요......\n@c0@"
  sl: "@a@b%a002030：那个兔女郎\n　　声音真粗……\n@c0@"
  tl: "@a@b%a002030：那個兔女郎\n　　聲音真粗……\n@c0@"
58:
  en: "@a%0%a002050@bI must confess, those bunnies did have their charms...\n@c0@"
  ja: "@a@b%a002050「あの　バニーちゃんたち\n\tあやしいとは　わかっていても\n\tやっぱり　魅力ありましたねー。\n@c0@"
  ko: "@a@b%a002050: 그 바니걸들,\n수상하다는 건 알았지만\n그래도 매력적이었죠~\n@c0@"
  sl: "@a@b%a002050：虽然知道\n　　那些兔女郎很可疑，\n　　但是还是挺有魅力的呢。\n@c0@"
  tl: "@a@b%a002050：雖然知道\n　　那些兔女郎很可疑，\n　　但是還是挺有魅力的呢。\n@c0@"
59:
  en: "@a%0%a002000@bHardy har! Sometimes it takes guts to follow your gut.\n@c0@"
  ja: "@a@b%a002000「よく　いうぜ……。\n@c0@"
  ko: "@a@b%a002000: 말 한번 잘하네......\n@c0@"
  sl: "@a@b%a002000：放屁……\n@c0@"
  tl: "@a@b%a002000：放屁……\n@c0@"
60:
  en: "@a%0%a002010@b(sigh) Human beings... The weakness of our resolve amazes me sometimes.\n@c0@"
  ja: "@a@b%a002010「ふう……。\n\t人間の心って　つくづく\n\t弱いものね。\n@c0@"
  ko: "@a@b%a002010: 후우......\n사람의 마음이란 정말\n약한가 봐.\n@c0@"
  sl: "@a@b%a002010：呼……\n　　人心还真是脆弱啊。\n@c0@"
  tl: "@a@b%a002010：呼……\n　　人心還真是脆弱啊。\n@c0@"
61:
  en: "@a%0%a002020@bSkip looks like a lean, mean warrior type, but he sure doesn't act the part.\n@c0@"
  ja: "@a@b%a002020「マハメドさんって\n\tみかけは　たくましい　戦士だけど\n\t性格が　軽すぎ。\n@c0@"
  ko: "@a@b%a002020: 마하메드 씨,\n겉보기엔 늠름한 전사 같지만\n너무 가벼워.\n@c0@"
  sl: "@a@b%a002020：穆罕默德这人，\n　　外表看上去是个强悍的战士，\n　　性格却这么轻率。\n@c0@"
  tl: "@a@b%a002020：穆罕默德這人，\n　　外表看上去是個強悍的戰士，\n　　性格卻這麼輕率。\n@c0@"
62:
  en: "@a%0%a002030@bHe claims to have known it was too good to be true, but he appeared to be entirely taken in...\n@c0@"
  ja: "@a@b%a002030「そうは　いかんって……\n\t思いっきり\n\tだまされてたような　気が……。\n@c0@"
  ko: "@a@b%a002030: 그렇게는 안 된다니......\n실컷 당하신 것\n같은데......\n@c0@"
  sl: "@a@b%a002030：这样可不行啊……\n　　我觉得他是\n　　彻底被骗了呢……\n@c0@"
  tl: "@a@b%a002030：這樣可不行啊……\n　　我覺得他是\n　　徹底被騙了呢……\n@c0@"
63:
  en: "@a%0%a002050@bIt's good that he can laugh about it now.\n@c0@"
  ja: "@a@b%a002050「しあわせな人ですね……。\n@c0@"
  ko: "@a@b%a002050: 행복한 사람이네요......\n@c0@"
  sl: "@a@b%a002050：这人活得真幸福啊……\n@c0@"
  tl: "@a@b%a002050：這人活得真幸福啊……\n@c0@"
64:
  en: "@a%0%a002000@bHe's right, aye? I couldn't make out the name, though.\n@c0@"
  ja: "@a@b%a002000「ああ　そうだったな。\n\tでも　何を　言ってるのか\n\tよく　聞こえなかったぜ。\n@c0@"
  ko: "@a@b%a002000: 맞아, 그랬다.\n하지만 무슨 말을 하는지\n잘 들리지 않았지.\n@c0@"
  sl: "@a@b%a002000：啊，是啊。\n　　不过说的什么\n　　倒是没有听清楚。\n@c0@"
  tl: "@a@b%a002000：啊，是啊。\n　　不過說的什麼\n　　倒是沒有聽清楚。\n@c0@"
65:
  en: "@a%0%a002010@bI heard it too! I don't know whose name he said, though...\n@c0@"
  ja: "@a@b%a002010「私も　覚えているわ。\n\t残念ながら　名前そのものは\n\t聞き取れなかったけど。\n@c0@"
  ko: "@a@b%a002010: 나도 기억해.\n아쉽게도 이름까지는\n들리지 않았지만.\n@c0@"
  sl: "@a@b%a002010：我也记得呢。\n　　但是很遗憾，\n　　我没有听清那个名字。\n@c0@"
  tl: "@a@b%a002010：我也記得呢。\n　　但是很遺憾，\n　　我沒有聽清那個名字。\n@c0@"
66:
  en: "@a%0%a002020@bI'm surprised he was able to remember all that! Things got pretty hairy back there.\n@c0@"
  ja: "@a@b%a002020「この人　あの状況で\n\tよくそこまで　覚えているわね。\n\t根性あるわ。\n@c0@"
  ko: "@a@b%a002020: 이 사람, 그 상황에서\n용케도 거기까지 기억하고 있네.\n대단한 배짱인걸.\n@c0@"
  sl: "@a@b%a002020：那种状况下，\n　　这个人居然还记得这么清楚。\n　　真有毅力。\n@c0@"
  tl: "@a@b%a002020：那種狀況下，\n　　這個人居然還記得這麼清楚。\n　　真有毅力。\n@c0@"
67:
  en: "@a%0%a002030@bThere may well be monsters that are equal to — nay, even stronger than — Murdaw and Jamirus.\n@c0@"
  ja: "@a@b%a002030「ムドーや　ジャミラスなみ\n\tいや　さらに　強いまものが　いても\n\t不思議でも　何でもありません。\n@c0@"
  ko: "@a@b%a002030: 무도나 쟈미라스만큼,\n아니 그보다 강한 마물이 있더라도\n전혀 이상하지 않겠군요.\n@c0@"
  sl: "@a@b%a002030：即使那家伙跟姆多\n　　和贾米拉斯，不，即使比它们还厉害，\n　　也没什么好惊讶的。\n@c0@"
  tl: "@a@b%a002030：即使那傢伙跟姆多\n　　和賈米拉斯，不，即使比它們還厲害，\n　　也沒什麼好驚訝的。\n@c0@"
68:
  en: "@a%0%a002050@bJamirus was trying to say someone's name!? I hope he wasn't calling for old %a002050!\n@c0@"
  ja: "@a@b%a002050「だれかの名前って……\n\tまさか　私の名前じゃ\n\tなかったですよね？\n@c0@"
  ko: "@a@b%a002050: 누군가의 이름이라니......\n설마 제 이름은\n아니었죠?\n@c0@"
  sl: "@a@b%a002050：谁的名字……\n　　难不成是我的名字？\n@c0@"
  tl: "@a@b%a002050：誰的名字……\n　　難不成是我的名字？\n@c0@"
69:
  en: "@a%0%a002000@bI'm sure we're all pretty knackered after tanglin' with Jamirus...\n@c0@"
  ja: "@a@b%a002000「みんな　ジャミラスと\n\t命がけで　戦って\n\tかなり　疲れているはず。\n@c0@"
  ko: "@a@b%a002000: 모두들 쟈미라스와\n목숨 걸고 싸운 탓에\n많이 지쳐 있겠지.\n@c0@"
  sl: "@a@b%a002000：大伙拼了命\n　　跟贾米拉斯战斗，\n　　一定相当累了吧。\n@c0@"
  tl: "@a@b%a002000：大夥拼了命\n　　跟賈米拉斯戰鬥，\n　　一定相當累了吧。\n@c0@"
70:
  en: "@a%0%a002000@bSome rest might do us right, aye?\n@c0@"
  ja: "@a@b%a002000「ちょっと　くらい\n\t休んでも　いいかもな。\n@c0@"
  ko: "@a@b%a002000: 조금\n쉬었다 가도 좋겠군.\n@c0@"
  sl: "@a@b%a002000：休息一下比较好。\n@c0@"
  tl: "@a@b%a002000：休息一下比較好。\n@c0@"
71:
  en: "@a%0%a002010@bIt's terribly kind of the innkeeper to take such good care of us.\n@c0@"
  ja: "@a@b%a002010「私たちに\n\t気をつかってもらって\n\t本当に　ありがたいわね。\n@c0@"
  ko: "@a@b%a002010: 우리를\n신경 써 주니\n정말 고마운걸.\n@c0@"
  sl: "@a@b%a002010：这么为我们着想，\n　　真是感激不尽。\n@c0@"
  tl: "@a@b%a002010：這麼為我們著想，\n　　真是感激不盡。\n@c0@"
72:
  en: "@a%0%a002010@bWe should take him up on his offer.\n@c0@"
  ja: "@a@b%a002010「おことばに　あまえても\n\tいいんじゃないかしら。\n@c0@"
  ko: "@a@b%a002010: 말씀대로 좀 쉬어도\n괜찮지 않을까?\n@c0@"
  sl: "@a@b%a002010：那就恭敬不如从命吧。\n@c0@"
  tl: "@a@b%a002010：那就恭敬不如從命吧。\n@c0@"
73:
  en: "@a%0%a002020@bThat innkeeper's still got the knack. I sure feel sleepy all of a sudden...\n@c0@"
  ja: "@a@b%a002020「宿屋の　おじさんに\n\t言われたら　あたし急に\n\tおねむに　なってきたかも……。\n@c0@"
  ko: "@a@b%a002020: 여관 아저씨가\n저렇게 얘기하니까 나 갑자기\n졸음이 밀려와......\n@c0@"
  sl: "@a@b%a002020：被旅店老板\n　　这么一说，\n　　我忽然就犯困了呢……\n@c0@"
  tl: "@a@b%a002020：被旅店老闆\n　　這麼一說，\n　　我忽然就犯睏了呢……\n@c0@"
74:
  en: "@a%0%a002030@bIt may be a good idea to rest while we make the voyage to Aridea.\n@c0@"
  ja: "@a@b%a002030「カルカドまでなら\n\tひと休みするのに　ちょうどよい\n\tきょりかも　しれませんね。\n@c0@"
  ko: "@a@b%a002030: 캘커드까지라면\n잠시 쉬기에는 딱 좋은\n거리겠군요.\n@c0@"
  sl: "@a@b%a002030：到达加尔加德的\n　　这段距离，\n　　正好适合小憩一番呢。\n@c0@"
  tl: "@a@b%a002030：到達加爾加德的\n　　這段距離，\n　　正好適合小憩一番呢。\n@c0@"
75:
  en: "@a%0%a002050@bWith a real live innkeeper lookin' after us, I bet we'll sleep like logs!\n@c0@"
  ja: "@a@b%a002050「ホンモノの　宿屋さんの\n\tお世話になれば\n\tじゅくすい　できそうです！\n@c0@"
  ko: "@a@b%a002050: 진짜 여관 주인이\n돌봐 주신다면\n푹 잘 수 있을 것 같습니다!\n@c0@"
  sl: "@a@b%a002050：既然是真正的旅店老板，\n　　那应该可以睡个好觉了！\n@c0@"
  tl: "@a@b%a002050：既然是真正的旅店老闆，\n　　那應該可以睡個好覺了！\n@c0@"
