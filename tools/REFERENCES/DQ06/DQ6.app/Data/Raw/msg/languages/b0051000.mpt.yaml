7:
  en: "@a@b*: He said he'd be gooped up in a place where dreams goo to gather together...\n@c0@"
  ja: "@a@b＊「まぼろしの館にいるって\n\tいってたよ。\n@c0@"
  ko: "@a@b*: 몽환의 저택에 있다고\n들었어.\n@c0@"
  sl: "@a@b＊：它说过它住在梦幻之馆。\n@c0@"
