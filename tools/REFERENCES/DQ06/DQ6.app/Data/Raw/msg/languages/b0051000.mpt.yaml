8:
  en: "@a@b*: Gooness, I shouldn't have let that slip! I'm supposed to be a bad seaslime! But you're pretty devious too...\n@c0@"
  ja: "@a@b＊「は！　思わず答えちゃった。\n\tアタシ　悪い　マリンスライムなのに。\n\t……アンタも　ワルよね～。\n@c0@"
  ko: "@a@b*: 앗! 나도 모르게 대답해 버렸네.\n난 나쁜 마린 슬라임인데.\n......너도 나빠~\n@c0@"
  sl: "@a@b＊：哈！我居然一不小心告诉你了。\n　　可我明明是个坏蛋海生史莱姆。\n　　……你也是个坏蛋呢。\n@c0@"
  tl: "@a@b＊：哈！我居然一不小心告訴你了。\n　　可我明明是個壞蛋海生史萊姆。\n　　……你也是個壞蛋呢。\n@c0@"
9:
  en: "@a@b*: Oh? You didn't say that? Well, excooze me, then.\n@c0@"
  ja: "@a@b＊「あれ？　そんなこといってない？\n\tなら　いいの。\n@c0@"
  ko: "@a@b*: 어라? 그런 거 안 물었다고?\n그럼 됐어.\n@c0@"
