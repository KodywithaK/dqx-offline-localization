0:
  en: "@a@b*: Goo of you to join us! You did well to find this place.\n@c0@"
  ja: "@a@b＊「ピキー！\n\tよく　ここを　見つけたね。\n@c0@"
  ko: "@a@b*: 피키~!\n여길 찾아내다니 대단하네.\n@c0@"
  sl: "@a@b＊：哔叽！\n　　你们居然能够找到这里。\n@c0@"
  tl: "@a@b＊：嗶嘰！\n　　你們居然能夠找到這裡。\n@c0@"
1:
  en: "@a@b*: This temple is dedicated to the almighty naming god.\n@c0@"
  ja: "@a@b＊「ここは　名前の神さまを\n\tまつっている　ほこらだよ。\n@c0@"
  ko: "@a@b*: 여긴 이름의 신을\n모시는 성소야.\n@c0@"
  sl: "@a@b＊：这里可是供奉\n　　名字之神的祠堂哟。\n@c0@"
  tl: "@a@b＊：這裡可是供奉\n　　名字之神的祠堂喲。\n@c0@"
2:
  en: "@a@b*: Surface just south of here and you'll find yourself out on the open sea.\n@c0@"
  ja: "@a@b＊「ここから　南にぬけると外海だよ。\n@c0@"
  ko: "@a@b*: 여기서 남쪽으로 나가면 먼바다야.\n@c0@"
  sl: "@a@b＊：从这里再往南走就是外海了。\n@c0@"
  tl: "@a@b＊：從這裡再往南走就是外海了。\n@c0@"
3:
  en: "@a@b*: I recommend a good night's sleep before you set off. Who knows what dangers await you there? \n@c0@"
  ja: "@a@b＊「どんなキケンが　まっているかも\n\tしれないから　うちの宿屋で\n\tゆっくり　休んでゆきなさいよ。\n@c0@"
  ko: "@a@b*: 어떤 위험이 도사리고 있을지\n모르니까 우리 여관에서\n푹 쉬고 가도록 해.\n@c0@"
  sl: "@a@b＊：前面不知道会有什么危险，\n　　先在旅店里好好休息一下吧。\n@c0@"
  tl: "@a@b＊：前面不知道會有什麼危險，\n　　先在旅店裡好好休息一下吧。\n@c0@"
4:
  en: "@a@b*: (scuttle scuttle) Oh, for gooness' sake... I'm a bad, bad seaslime...\n@c0@"
  ja: "@a@b＊「キュルルン　キュルルン。\n\tほっといてよ。\n\tアタシ　悪い　マリンスライムなの。\n@c0@"
  ko: "@a@b*: 큐르릉, 큐르릉.\n날 좀 내버려 둬.\n난 나쁜 마린 슬라임이야.\n@c0@"
  sl: "@a@b＊：咕噜噜，咕噜噜。\n　　别靠近我。\n　　我是坏蛋海生史莱姆。\n@c0@"
  tl: "@a@b＊：咕嚕嚕，咕嚕嚕。\n　　別靠近我。\n　　我是壞蛋海生史萊姆。\n@c0@"
5:
  en: "@a@b*: My pal %a002120 said he wanted to meet with me, but I went for a dip in the sea instead.\n@c0@"
  ja: "@a@b＊「ともだちの　%a002120が\n\t会いたいって　いっていたのに\n\t海に　逃げこんだんだ。\n@c0@"
  ko: "@a@b*: 친구 %a002120%F2120%X가%Y이%Z\n보고 싶다고 했는데도\n바다로 도망쳤단 말이야.\n@c0@"
  sl: "@a@b＊：好朋友%a002120\n　　明明都说它想我了，\n　　我却逃到了海里。\n@c0@"
  tl: "@a@b＊：好朋友%a002120\n　　明明都說它想我了，\n　　我卻逃到了海裡。\n@c0@"
6:
  en: "@a@b*: What's that? You want to know where %a002120 is?\n@c0@"
  ja: "@a@b＊「え？　%a002120は\n\tどこに　いるのかって？\n@c0@"
  ko: "@a@b*: 응? %a002120%F2120%X는%Y은%Z\n어디에 있냐고?\n@c0@"
  sl: "@a@b＊：诶？你们是问\n　　%a002120现在在哪里？\n@c0@"
