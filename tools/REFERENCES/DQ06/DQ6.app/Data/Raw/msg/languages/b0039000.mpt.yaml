  ja: "@a@bモネ「この館は　今は　訪れる人も\n\t少なくなりましたが　以前は\n\t多くの旅人で　にぎわっていました。\n@c0@"
  ko: "@a@b모네: 지금은 이 저택에 찾아오는\n사람들도 적어졌지만, 옛날에는\n수많은 여행자들로 붐볐지요.\n@c0@"
  sl: "@a@b莫奈：如今造访这座馆的人\n　　已经变少了，\n　　之前这里可是门庭若市呢。\n@c0@"
  tl: "@a@b莫奈：如今造訪這座館的人\n　　已經變少了，\n　　之前這裡可是門庭若市呢。\n@c0@"
107:
  en: "@aSharon Hope@bPeople used to come here from all over to share their dreams with one another.\n@c0@"
  ja: "@a@bモネ「ここで皆が　それぞれの\n\t夢を　語り合っていたんですよ。\n@c0@"
  ko: "@a@b모네: 여기서 모든 사람들이 각자의\n꿈에 대해 이야기를 나누곤 했답니다.\n@c0@"
  sl: "@a@b莫奈：大家都在这里\n　　分享自己做的梦。\n@c0@"
  tl: "@a@b莫奈：大家都在這裡\n　　分享自己做的夢。\n@c0@"
108:
  en: "@a@b*: I'd love to let you through right away, but Sharon said she had something she wanted to talk to you about first.\n@c0@"
  ja: "@a@b＊「すぐにでも　通してあげたいけど\n\tモネが　話したいことが\n\tあるみたいだから……\n@c0@"
  ko: "@a@b*: 당장이라도 비켜 주고 싶지만\n모네가 할 말이 있다고\n하니까......\n@c0@"
  sl: "@a@b＊：虽然我很想现在\n　　就放你们过去，\n　　但是莫奈好像还有话要说……\n@c0@"
  tl: "@a@b＊：雖然我很想現在\n　　就放你們過去，\n　　但是莫奈好像還有話要說……\n@c0@"
109:
  en: "@a@b*: Why don't you go and see what she has to say?\n@c0@"
  ja: "@a@b＊「まずは　話を\n\t聞いてあげて　くれるかな？\n@c0@"
  ko: "@a@b*: 우선 이야기부터\n듣고 와 줄래?\n@c0@"
  sl: "@a@b＊：能不能先去\n　　听她说话？\n@c0@"
  tl: "@a@b＊：能不能先去\n　　聽她說話？\n@c0@"
110:
  en: "@a@b*: But somehow, being here made me feel like I'd been everywhere I needed to go already, so I decided to stick around.\n@c0@"
  ja: "@a@b＊「でも　ここにいると　ふしぎと\n\t世界中を　旅した気持ちになれるから\n\tそのまま　いついちゃったのよね。\n@c0@"
  ko: "@a@b*: 하지만 여기 있으면 신기하게도\n전 세계를 여행한 것 같은 기분이 드니까\n그대로 눌러앉게 된 거지.\n@c0@"
  sl: "@a@b＊：但是到这里以后，不可思议的是，\n　　我觉得我已经环游过全世界了，\n　　所以就停在这里不走了。\n@c0@"
  tl: "@a@b＊：但是到這裡以後，不可思議的是，\n　　我覺得我已經環遊過全世界了，\n　　所以就停在這裡不走了。\n@c0@"
111:
  en: "@a@b*: I suppose that's the effect of so many travellers' dreams all gathered in one place...\n@c0@"
  ja: "@a@b＊「やっぱり　旅人たちの　夢が\n\t集まってる　場所だからなのかな？\n@c0@"
  ko: "@a@b*: 역시 여행자들의 꿈이\n모이는 장소이기 때문일까?\n@c0@"
  sl: "@a@b＊：一定是因为这里是收集\n　　旅行者的梦的地方吧？\n@c0@"
  tl: "@a@b＊：一定是因為這裡是收集\n　　旅行者的夢的地方吧？\n@c0@"
112:
  en: "@a@b*: Hullo! I may not look it, but I'm really good at counting, you know.\n@c0@"
  ja: "@a@b＊「こうみえても　ボクは\n\t数を　数えるのが　とくいなんだ！\n@c0@"
  ko: "@a@b*: 이래 봬도 난\n숫자 세는 걸 잘해!\n@c0@"
  sl: "@a@b＊：别看我这样，\n　　我可是很擅长数数的哦！\n@c0@"
  tl: "@a@b＊：別看我這樣，\n　　我可是很擅長數數的哦！\n@c0@"
113:
  en: "@a@b*: I'll be keeping a close eye on how many dreams you've gathered, so check back with me if you want to know.\n@c0@"
  ja: "@a@b＊「ボクに　聞いてくれれば\n\t集まっている　夢のカケラの\n\t目安を　教えてあげるね！\n@c0@"
  ko: "@a@b*: 나한테 물어보면\n남은 꿈 조각\n개수를 알려 줄게!\n@c0@"
  sl: "@a@b＊：要是来问我的话，\n　　我可以告诉你\n　　你收集到的梦之碎片的程度哦！\n@c0@"
  tl: "@a@b＊：要是來問我的話，\n　　我可以告訴你\n　　你收集到的夢之碎片的程度哦！\n@c0@"
114:
  en: "@a@b*: You haven't gathered any of the scattered dreams yet! Not a single one! You're rubbish!\n@c0@"
  ja: "@a@b＊「夢のカケラは　まだ\n\tぜんぜん　集まってないよ！\n@c0@"
  ko: "@a@b*: 꿈 조각은 아직\n하나도 못 모았네!\n@c0@"
  sl: "@a@b＊：几乎没怎么收集到\n　　梦之碎片啊！\n@c0@"
  tl: "@a@b＊：幾乎沒怎麼收集到\n　　夢之碎片啊！\n@c0@"
115:
