125:
  en: "@a@bThe book is filled from cover to cover with tales of incredible dreams.\n@c0@"
  ja: "@a@b本には　さまざまな　夢が\n書かれている。\n@c0@"
  ko: "@a@b책에는 다양한 꿈이\n쓰여 있다.\n@c0@"
  sl: "@a@b书里记载了\n各种各样的梦。\n@c0@"
