  sl: "@a@b好像是造访这里的\n旅行者们写的东西。\n@c0@"
  tl: "@a@b好像是造訪這裡的\n旅行者們寫的東西。\n@c0@"
127:
  en: "@a@b%3I seek only those who possess all of the legendary relics. Begone!%4\n@c0@"
  ja: "@a@b%3われは　伝説の武器　防具を\n身につけたる者のみ　もとめるなり。\nなんじらは　それに　あらず！%4\n@c0@"
  ko: "@a@b%3나는 전설의 무기와 방어구를\n착용한 자만을 원하노라.\n너희는 그렇지 않거늘!%4\n@c0@"
  sl: "@a@b%3吾之所求，\n乃手持传说中的武器与防具之人。\n并非汝等！%4\n@c0@"
  tl: "@a@b%3吾之所求，\n乃手持傳說中的武器與防具之人。\n並非汝等！%4\n@c0@"
