  ko: "@a@b*: 꿈이라도 꾼 거 아니냐?\n......카흠.\n드르렁~ 드르렁~!\n@c0@"
  sl: "@a@b＊：你不会是在做梦吧？\n　　……呼噜。\n　　呼呼！\n@c0@"
  tl: "@a@b＊：你不會是在做夢吧？\n　　……呼嚕。\n　　呼呼！\n@c0@"
