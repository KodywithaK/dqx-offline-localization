0:
  en: "@a@b*: Welcome, %H0860%Xchild%Ychildren%Z, to the place where our night-time imaginings gather and take shape.\n@c0@"
  ja: "@a@b＊「いらっしゃいませ。\n\tここは　旅人たちの　夢がつどう\n\tいこいの館。\n@c0@"
  ko: "@a@b*: 어서 오세요.\n이곳은 여행자들의 꿈이 모이는\n휴식의 저택.\n@c0@"
  sl: "@a@b＊：欢迎光临。\n　　这里是收集旅行者梦境的\n　　休憩之馆。\n@c0@"
  tl: "@a@b＊：歡迎光臨。\n　　這裡是收集旅行者夢境的\n　　休憩之館。\n@c0@"
1:
  en: "@a@b*: Please, step inside.\n@c0@"
  ja: "@a@b＊「さあ　中へ　どうぞ。\n@c0@"
  ko: "@a@b*: 어서 안으로 들어오세요.\n@c0@"
  sl: "@a@b＊：进来吧。\n@c0@"
  tl: "@a@b＊：進來吧。\n@c0@"
2:
  en: "@a@b*: It's my calling to aid those who stop by here.\n@c0@"
  ja: "@a@b＊「私は　ここで　旅人たちの\n\tお手伝いを　しております。\n@c0@"
  ko: "@a@b*: 저는 여기서 여행자들을\n돕고 있습니다.\n@c0@"
  sl: "@a@b＊：我在这里为旅行者们\n　　提供帮助。\n@c0@"
  tl: "@a@b＊：我在這裡為旅行者們\n　　提供幫助。\n@c0@"
3:
  en: "@a@b*: Oh ho! This here is a place made of dreams and illusions, friend. You lost, perhaps?\n@c0@"
  ja: "@a@b＊「ふぉっふぉっふぉっ。\n\tここは　まぼろしの館じゃ。\n\t道に　迷いなされたかな？\n@c0@"
  ko: "@a@b*: 홋홋홋.\n여긴 몽환의 저택이라네.\n길을 잃었는가?\n@c0@"
  sl: "@a@b＊：呵呵呵，\n　　这里是梦幻之馆啊。\n　　迷路了吗？\n@c0@"
  tl: "@a@b＊：呵呵呵，\n　　這裡是夢幻之館啊。\n　　迷路了嗎？\n@c0@"
4:
  en: "@a@b*: Must be your own dreams that led you here, then. Welcome, %H0860%Xwanderer%Ywanderers%Z.\n@c0@"
  ja: "@a@b＊「ほう　ならば　夢に導かれて\n\tやってきたのじゃろうな。\n@c0@"
  ko: "@a@b*: 호오, 그럼 꿈에 이끌려\n찾아온 게로군.\n@c0@"
  sl: "@a@b＊：哦，这么说，\n　　你是受到梦的指引来这里的吧。\n@c0@"
  tl: "@a@b＊：哦，這麼說，\n　　你是受到夢的指引來這裡的吧。\n@c0@"
5:
  en: "@a@b*: Ah, you do have that lost look. Do you know about the well far north of here, across the sea?\n@c0@"
  ja: "@a@b＊「ここより　海を越え\n\tはるか北に　とある井戸がある。\n@c0@"
  ko: "@a@b*: 여기서 바다를 건너 북쪽으로\n한참을 가면 우물 하나가 있을걸세.\n@c0@"
  sl: "@a@b＊：从这里越过大海，\n　　在遥远的北方有一口井。\n@c0@"
  tl: "@a@b＊：從這裡越過大海，\n　　在遙遠的北方有一口井。\n@c0@"
6:
  en: "@a@b*: They say that leaping into that well will land you in another world! Oh ho!\n@c0@"
  ja: "@a@b＊「その井戸より　もうひとつの世界に\n\tゆけるという話じゃ。\n@c0@"
  ko: "@a@b*: 그 우물을 통해 또 하나의 세계로\n갈 수 있다고 들었네.\n@c0@"
  sl: "@a@b＊：传说从那口井\n　　能前往另一个世界。\n@c0@"
  tl: "@a@b＊：傳說從那口井\n　　能前往另一個世界。\n@c0@"
7:
  en: "@a@b*: Ah, you do have that lost look. Have you heard of the enchanted city of Sorceria?\n@c0@"
  ja: "@a@b＊「ここより　東の海には\n\tその昔　伝説の魔法都市\n\tカルベローナが　あったそうじゃ。\n@c0@"
  ko: "@a@b*: 이 저택의 동쪽 바다에는\n먼 옛날 전설의 마법 도시\n칼베로나가 있었다는구먼.\n@c0@"
  sl: "@a@b＊：据说从这里往东的海域，\n　　过去曾有一座传说中的魔法都市\n　　卡尔贝罗纳。\n@c0@"
  tl: "@a@b＊：據說從這裡往東的海域，\n　　過去曾有一座傳說中的魔法都市\n　　卡爾貝羅納。\n@c0@"
8:
  en: "@a@b*: They say it used to lie somewhere in the eastern seas. Might be worth checking things out over there, eh?\n@c0@"
  ja: "@a@b＊「そこが　今　どうなっておるのか\n\t見ておくのも　よいじゃろうな。\n@c0@"
  ko: "@a@b*: 그곳이 지금 어떻게 되었는지\n봐 두는 것도 좋을 게야.\n@c0@"
  sl: "@a@b＊：去看看那里现在\n　　变成什么样了也不错。\n@c0@"
  tl: "@a@b＊：去看看那裡現在\n　　變成什麼樣了也不錯。\n@c0@"
9:
  en: "@a@b*: Well, it could be worse. You could be lost in this ‘other’ realm I keep hearing about.\n㈡\n*: Apparently, it's somewhere between dreams and reality.\n@c0@"
  ja: "@a@b＊「現実でもない　夢でもない\n\tもうひとつの世界が　あるとしたら\n\tそれは　おそらく　闇じゃろう。\n@c0@"
  ko: "@a@b*: 꿈도 현실도 아닌\n또 하나의 세계가 있다면\n그건 아마도 어둠일 게야.\n@c0@"
  sl: "@a@b＊：如果还有一个既不是现实世界，\n　　也不是梦世界的世界存在的话，\n　　那里一定就是暗世界了。\n@c0@"
  tl: "@a@b＊：如果還有一個既不是現實世界，\n　　也不是夢世界的世界存在的話，\n　　那里一定就是暗世界了。\n@c0@"
10:
  en: "@a@b*: Such a land could only be a place of darkness! And darkness only serves to prey upon the souls of the weak!\n@c0@"
  ja: "@a@b＊「闇は　心よわき者をむしばむ！\n\tおそろしいことじゃ……。\n@c0@"
  ko: "@a@b*: 어둠은 마음이 약한 자를 침식하지!\n무서운 일일세......\n@c0@"
  sl: "@a@b＊：黑暗会吞噬弱者的内心！\n　　这太可怕了……\n@c0@"
  tl: "@a@b＊：黑暗會吞噬弱者的內心！\n　　這太可怕了……\n@c0@"
11:
  en: "@a@b*: You used to be able to go down to the basement from here.\n@c0@"
  ja: "@a@b＊「本当は　ここから　地下に\n\t行けたんだけど……。\n@c0@"
  ko: "@a@b*: 원래는 여기서 지하로\n내려갈 수 있었는데......\n@c0@"
  sl: "@a@b＊：其实从这里可以去地下的……\n@c0@"
  tl: "@a@b＊：其實從這裡可以去地下的……\n@c0@"
12:
  en: "@a@b*: But that part's not here any more. Not since the place started coming to pieces.\n@c0@"
  ja: "@a@b＊「今は　カタチが　なくなってるから\n\t行くことは　できないわよ。\n@c0@"
  ko: "@a@b*: 지금은 지하의 형체가 없어져서\n내려가면 안 돼.\n@c0@"
  sl: "@a@b＊：但是现在只剩下残垣断壁，\n　　去不了了。\n@c0@"
  tl: "@a@b＊：但是現在只剩下殘垣斷壁，\n　　去不了了。\n@c0@"
13:
  en: "@a@b*: There used to be a door to a huge forest behind this curtain.\n@c0@"
  ja: "@a@b＊「このカーテンの　うしろにも\n\tトビラが　あって　広い森に\n\tつながってたんだけど……\n@c0@"
  ko: "@a@b*: 이 커튼 뒤쪽에도\n문이 있어서 넓은 숲이랑\n이어져 있었는데......\n@c0@"
  sl: "@a@b＊：这帘子后面有一扇门，\n　　通向一片茂密的森林……\n@c0@"
  tl: "@a@b＊：這簾子後面有一扇門，\n　　通向一片茂密的森林……\n@c0@"
14:
  en: "@a@b*: But it's not here any more. Not since the place started coming to pieces.\n@c0@"
  ja: "@a@b＊「そこは　まだ　カタチを\n\t取りもどせていないんだよね。\n@c0@"
  ko: "@a@b*: 거긴 아직 제 모습을\n되찾지 못했어.\n@c0@"
  sl: "@a@b＊：那里也还没有恢复原状。\n@c0@"
  tl: "@a@b＊：那裡也還沒有恢復原狀。\n@c0@"
15:
  en: "@a@b*: You're amazing, %a000140! I can't believe you found all the dreams we lost!\n@c0@"
  ja: "@a@b＊「%a000140さん！\n\t夢のカケラを　全部集めるなんて\n\tすごいじゃないの！\n@c0@"
  ko: "@a@b*: %a000140!\n꿈 조각을 모두 모으다니\n대단한걸!\n@c0@"
  sl: "@a@b＊：%a000140！\n　　居然将全部的梦之碎片\n　　收集齐了，太厉害了！\n@c0@"
  tl: "@a@b＊：%a000140！\n　　居然將全部的夢之碎片\n　　收集齊了，太厲害了！\n@c0@"
16:
  en: "@a@b*: Now we have the forest back and everything!\n@c0@"
  ja: "@a@b＊「おかげで　森も\n\t元に　もどったみたいよ。\n@c0@"
  ko: "@a@b*: 덕분에 숲도\n원래대로 돌아왔어.\n@c0@"
  sl: "@a@b＊：多亏了你们，\n　　森林好像也恢复原状了。\n@c0@"
  tl: "@a@b＊：多虧了你們，\n　　森林好像也恢復原狀了。\n@c0@"
17:
  en: "@a@b*: You're amazing, %a000140! I can't believe you found all the dreams we lost!\n@c0@"
  ja: "@a@b＊「%a000140さん！\n\t夢のカケラを　全部集めるなんて\n\tすごいじゃないの！\n@c0@"
  ko: "@a@b*: %a000140!\n꿈 조각을 모두 모으다니\n대단한걸!\n@c0@"
  sl: "@a@b＊：%a000140！\n　　居然将全部的梦之碎片\n　　收集齐了，太厉害了！\n@c0@"
  tl: "@a@b＊：%a000140！\n　　居然將全部的夢之碎片\n　　收集齊了，太厲害了！\n@c0@"
18:
  en: "@a@b*: Now we have the forest back and everything! I can let you through to see it if you like!\n@c0@"
  ja: "@a@b＊「森も　元通りになったから\n\tここを　通してあげられるわね。\n@c0@"
  ko: "@a@b*: 숲이 원래대로 돌아왔으니\n여길 비켜 줄 수 있어.\n@c0@"
  sl: "@a@b＊：森林也恢复原状了，\n　　可以放你们过去了。\n@c0@"
  tl: "@a@b＊：森林也恢復原狀了，\n　　可以放你們過去了。\n@c0@"
19:
  en: "@a@b*: There used to be these incredibly nimble creatures that lived there.\n@c0@"
  ja: "@a@b＊「そういえば　前は森に\n\tとっても　すばしっこい\n\t生き物が　いたのよね。\n@c0@"
  ko: "@a@b*: 참, 전에는 숲에\n아주 날렵한\n생물이 살고 있었어.\n@c0@"
  sl: "@a@b＊：话说回来，\n　　之前森林里出现过一只\n　　动作非常敏捷的生物呢。\n@c0@"
  tl: "@a@b＊：話說回來，\n　　之前森林裡出現過一隻\n　　動作非常敏捷的生物呢。\n@c0@"
20:
  en: "@a@b*: I wonder if they're still around...\n@c0@"
  ja: "@a@b＊「今も　まだ　いるかしら？\n@c0@"
  ko: "@a@b*: 지금도 있으려나?\n@c0@"
  sl: "@a@b＊：不知道还在不在呢？\n@c0@"
  tl: "@a@b＊：不知道還在不在呢？\n@c0@"
21:
  en: "@a@b*: You know, when I first came here, I only meant to stop for a rest. I was travelling, you see.\n@c0@"
  ja: "@a@b＊「あたしも　本当は　旅の途中で\n\t立ちよっただけ　だったのよ。\n@c0@"
  ko: "@a@b*: 나도 원래는 여행 중에\n잠깐 들렀던 거였어.\n@c0@"
  sl: "@a@b＊：我其实只是在旅行途中\n　　路过了这里而已。\n@c0@"
  tl: "@a@b＊：我其實只是在旅行途中\n　　路過了這裡而已。\n@c0@"
22:
  en: "@a@b*: Zzzz...\n@c0@"
  ja: "@a@b＊「ごあー　ごあー！\n@c0@"
  ko: "@a@b*: 드르렁~ 드르렁~!\n@c0@"
  sl: "@a@b＊：呼呼！\n@c0@"
  tl: "@a@b＊：呼呼！\n@c0@"
23:
