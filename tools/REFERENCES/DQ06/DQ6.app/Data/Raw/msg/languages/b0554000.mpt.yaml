  sl: "@a@b%a002050：我听说有很多人\n　　说王子的坏话。\n　　我完全能够理解。\n@c0@"
  tl: "@a@b%a002050：我聽說有很多人\n　　說王子的壞話。\n　　我完全能夠理解。\n@c0@"
23:
  en: "@a%0%a002000@bHuh. I doubt this guy knows where the Prince went.\n@c0@"
