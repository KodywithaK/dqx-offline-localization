34:
  en: "@a%0%a002010@bHis aura is truly frazzled.\n@c0@"
  ja: "@a@b%a002010「苦労　なさっているようね。\n@c0@"
  ko: "@a@b%a002010: 고생이 많으시겠어.\n@c0@"
  sl: "@a@b%a002010：好像很辛苦呢。\n@c0@"
  tl: "@a@b%a002010：好像很辛苦呢。\n@c0@"
35:
  en: "@a%0%a002020@bSounds like the Prince goes missing quite a bit.\n@c0@"
  ja: "@a@b%a002020「こんなことは\n\tしょっちゅう　なんでしょうね。\n@c0@"
  ko: "@a@b%a002020: 이런 일은\n자주 있겠지.\n@c0@"
  sl: "@a@b%a002020：这种事情\n　　经常发生吧。\n@c0@"
  tl: "@a@b%a002020：這種事情\n　　經常發生吧。\n@c0@"
36:
  en: "@a%0%a002030@bI gather that Prince Howard has made a habit of disappearing. This is cause for some concern.\n@c0@"
  ja: "@a@b%a002030「王子は　行方不明の\n\t常習犯って　わけですか。\n\tこれは　手ごわいかも……。\n@c0@"
  ko: "@a@b%a002030: 왕자가 행방불명\n상습범이란 겁니까?\n만만한 상대가 아닌걸요......\n@c0@"
  sl: "@a@b%a002030：王子经常\n　　行踪不明啊。\n　　这还真是棘手……\n@c0@"
  tl: "@a@b%a002030：王子經常\n　　行蹤不明啊。\n　　這還真是棘手……\n@c0@"
37:
  en: "@a%0%a002050@bWhat have we got ourselves into...?\n@c0@"
  ja: "@a@b%a002050「やはり　私たち\n\t大変な　役目を　引き受けて\n\tしまったようですね……。\n@c0@"
  ko: "@a@b%a002050: 역시 우리\n아주 힘든 일을 맡아 버린 것\n같은데요......\n@c0@"
  sl: "@a@b%a002050：我们果然是接下了\n　　一个很困难的任务呢……\n@c0@"
  tl: "@a@b%a002050：我們果然是接下了\n　　一個很困難的任務呢……\n@c0@"
38:
  en: "@a%0%a002000@bHardy har! But who's gonna protect the Prince from himself?\n@c0@"
  ja: "@a@b%a002000「まあ　やるだけ\n\tやってみるか！\n@c0@"
  ko: "@a@b%a002000: 뭐, 할 수 있는 데까지\n해 보자고!\n@c0@"
  sl: "@a@b%a002000：唉，咱就尽力吧！\n@c0@"
  tl: "@a@b%a002000：唉，咱就盡力吧！\n@c0@"
39:
  en: "@a%0%a002010@bWe've made a promise to the King, %a000090. We can't back out now.\n@c0@"
  ja: "@a@b%a002010「私たち　もう\n\t王さまとも　約束したんだから\n\tいやなんて　言えないわね。\n@c0@"
  ko: "@a@b%a002010: 우린 이미\n왕과도 약속을 해 버렸으니\n싫다고는 못해.\n@c0@"
  sl: "@a@b%a002010：我们跟国王陛下\n　　都已经说好了。\n　　不能反悔了吧。\n@c0@"
  tl: "@a@b%a002010：我們跟國王陛下\n　　都已經說好了。\n　　不能反悔了吧。\n@c0@"
40:
  en: "@a%0%a002020@bI'm not exactly excited to help out some spoilt Prince, but a promise is a promise...\n@c0@"
  ja: "@a@b%a002020「ちょっと　気が重く\n\tなってきたけど……\n\tやるしか　ないわよね。\n@c0@"
  ko: "@a@b%a002020: 조금 기분이\n침울해졌지만......\n하는 수밖에 없겠지.\n@c0@"
  sl: "@a@b%a002020：心情好像\n　　沉重起来了呢……\n　　只能硬着头皮干了吧。\n@c0@"
  tl: "@a@b%a002020：心情好像\n　　沉重起來了呢……\n　　只能硬著頭皮幹了吧。\n@c0@"
41:
  en: "@a%0%a002030@bI do not know what lies ahead, but with the grace of the Goddess, we will succeed.\n@c0@"
  ja: "@a@b%a002030「私たちで　つとまるのか\n\tいまだ　不安ですが\n\tまあ　なんとか　なるかと……。\n@c0@"
  ko: "@a@b%a002030: 우리가 해낼 수 있을지\n아직 불안하지만\n뭐, 어떻게든 되리라 믿고......\n@c0@"
  sl: "@a@b%a002030：我真担心\n　　我们到底能不能胜任。\n　　唉，车到山前必有路……\n@c0@"
  tl: "@a@b%a002030：我真擔心\n　　我們到底能不能勝任。\n　　唉，車到山前必有路……\n@c0@"
42:
  en: "@a%0%a002050@bYou're as worried as I am, aren't you %a000090? Let's just keep it to ourselves for now.\n@c0@"
  ja: "@a@b%a002050「私　%a000090さんと\n\t同じ心境だと　思いますが\n\t今は　言いますまい……。\n@c0@"
  ko: "@a@b%a002050: 저는 %a000090 님과\n같은 심경일 것 같습니다만\n지금은 아무 말 않겠습니다......\n@c0@"
  sl: "@a@b%a002050：我跟%a000090\n　　的心情是一样的。\n　　不过现在说不出口啊……\n@c0@"
  tl: "@a@b%a002050：我跟%a000090\n　　的心情是一樣的。\n　　不過現在說不出口啊……\n@c0@"
43:
  en: "@a%0%a002000@bMaybe some day, but right now he's got a lot to learn, aye?\n@c0@"
  ja: "@a@b%a002000「先のことは　ともかく\n\tとりあえず　いまは\n\tチカラを　かすと　しようぜ。\n@c0@"
  ko: "@a@b%a002000: 앞일이 어찌 되든\n우선 지금은\n우리의 힘을 빌려드리자고.\n@c0@"
  sl: "@a@b%a002000：之后的事情先不提，\n　　眼下咱就先\n　　帮这个忙吧。\n@c0@"
  tl: "@a@b%a002000：之後的事情先不提，\n　　眼下咱就先\n　　幫這個忙吧。\n@c0@"
44:
  en: "@a%0%a002010@bThe depth of the Queen's love for her son is plain to see.\n@c0@"
  ja: "@a@b%a002010「王妃さまは\n\t本当に　ホルス王子を\n\t愛して　いらっしゃるのね。\n@c0@"
  ko: "@a@b%a002010: 왕비님은\n진심으로 홀스 왕자를\n사랑하시나 봐.\n@c0@"
  sl: "@a@b%a002010：王妃殿下\n　　真的很爱\n　　荷尔斯王子呢。\n@c0@"
  tl: "@a@b%a002010：王妃殿下\n　　真的很愛\n　　荷爾斯王子呢。\n@c0@"
45:
  en: "@a%0%a002020@bA problem child growing up to become a great man? I guess crazier things have happened...\n@c0@"
  ja: "@a@b%a002020「まあ　もんだい児が\n\tしょうらい大物に　なるのって\n\tよく聞く　話では　あるわね。\n@c0@"
  ko: "@a@b%a002020: 뭐, 문제아가\n커서 거물이 되었다는 이야기는\n자주 듣긴 해.\n@c0@"
  sl: "@a@b%a002020：我倒是经常听说，\n　　小时候调皮捣蛋，\n　　长大了能成大事。\n@c0@"
  tl: "@a@b%a002020：我倒是經常聽說，\n　　小時候調皮搗蛋，\n　　長大了能成大事。\n@c0@"
46:
  en: "@a%0%a002030@bThe Queen seems to be rather defensive of her son.\n@c0@"
  ja: "@a@b%a002030「びみょうな\n\tおっしゃりかたですね。\n\t今は　どうあれって……。\n@c0@"
  ko: "@a@b%a002030: 이상한\n표현이군요.\n지금이야 어떻든이라니......\n@c0@"
  sl: "@a@b%a002030：这话说得好奇怪。\n　　什么叫不管现在怎样啊……\n@c0@"
  tl: "@a@b%a002030：這話說得好奇怪。\n　　什麼叫不管現在怎樣啊……\n@c0@"
47:
  en: "@a%0%a002050@bA fine king? Right now I'd settle for a fair-to-average prince!\n@c0@"
  ja: "@a@b%a002050「まずは\n\tりっぱな　王子さまに\n\tなってほしいですね！\n@c0@"
  ko: "@a@b%a002050: 그러기 전에 먼저\n훌륭한 왕자님이\n되어 줬으면 좋겠는데요!\n@c0@"
  sl: "@a@b%a002050：真希望他\n　　首先能当一个\n　　出色的王子啊！\n@c0@"
  tl: "@a@b%a002050：真希望他\n　　首先能當一個\n　　出色的王子啊！\n@c0@"
48:
  en: "@a%0%a002000@bGreat. So first we gotta find the royal brat, aye?\n@c0@"
  ja: "@a@b%a002000「やれやれ……\n\tいきなり　王子の　そうさくかよ。\n@c0@"
  ko: "@a@b%a002000: 이런......\n갑자기 왕자를 찾으라니.\n@c0@"
  sl: "@a@b%a002000：哎呀……\n　　一来就让咱找王子。\n@c0@"
  tl: "@a@b%a002000：哎呀……\n　　一來就讓咱找王子。\n@c0@"
49:
  en: "@a%0%a002000@bAh, well. It'll give us a chance to learn our way around the castle, I guess.\n@c0@"
  ja: "@a@b%a002000「まあいい。\n\tお城の中を　見学がてら\n\tちょっと　回ってみるか。\n@c0@"
  ko: "@a@b%a002000: 어쩔 수 없지.\n성 내부 구경이라도 할 겸\n돌아다녀 볼까?\n@c0@"
  sl: "@a@b%a002000：唉，算了，\n　　就当在城里参观，\n　　去转一转好了。\n@c0@"
  tl: "@a@b%a002000：唉，算了，\n　　就當在城裡參觀，\n　　去轉一轉好了。\n@c0@"
50:
  en: "@a%0%a002010@bI get the feeling that this is going to be an incredibly annoying mission...\n@c0@"
  ja: "@a@b%a002010「もしかして　私たち\n\tとてつもなく　やっかいな仕事を\n\tひきうけて　しまったのかしら……。\n@c0@"
  ko: "@a@b%a002010: 혹시 우리\n엄청나게 귀찮은 일을\n수락해 버린 걸까......\n@c0@"
  sl: "@a@b%a002010：难道说\n　　我们接了个\n　　十分棘手的工作……\n@c0@"
  tl: "@a@b%a002010：難道說\n　　我們接了個\n　　十分棘手的工作……\n@c0@"
51:
  en: "@a%0%a002020@bWell, no turning back now! Let's go find us a prince!\n@c0@"
  ja: "@a@b%a002020「のりかかった　船よ！\n\t王子さまを　さがしましょ！\n@c0@"
  ko: "@a@b%a002020: 이제 와서 그만둘 수도 없잖아!\n왕자를 찾아보자!\n@c0@"
  sl: "@a@b%a002020：箭在弦上不得不发！\n　　去找王子殿下吧！\n@c0@"
  tl: "@a@b%a002020：箭在弦上不得不發！\n　　去找王子殿下吧！\n@c0@"
52:
  en: "@a%0%a002030@bWe can't very well accompany the Prince to the cave if we can't find him first. Let's go!\n@c0@"
  ja: "@a@b%a002030「本人を　見つけないと\n\t洞くつに　つれていきようが\n\tないですね……　さがしましょう！\n@c0@"
  ko: "@a@b%a002030: 당사자를 찾지 못하면\n동굴로 데려갈 수가\n없지요...... 찾아봅시다!\n@c0@"
  sl: "@a@b%a002030：要是不找到王子本人，\n　　就没办法带他去洞窟了……\n　　去找吧！\n@c0@"
  tl: "@a@b%a002030：要是不找到王子本人，\n　　就沒辦法帶他去洞窟了……\n　　去找吧！\n@c0@"
53:
  en: "@a%0%a002050@bI heard the Chancellor use the words ‘once again’...\n@c0@"
  ja: "@a@b%a002050「さっき　あの大臣さん　\n\tまたしても！　とか\n\t言ってましたよね。\n@c0@"
  ko: "@a@b%a002050: 아까 저 대신은\n왕자가 또 사라졌다고\n했죠.\n@c0@"
  sl: "@a@b%a002050：刚才那个大臣\n　　是不是说了个又字啊。\n@c0@"
  tl: "@a@b%a002050：剛才那個大臣\n　　是不是說了個又字啊。\n@c0@"
54:
  en: "@a%0%a002050@bIt sounds like Prince Howard might pull this disappearin' act on a regular basis.\n@c0@"
  ja: "@a@b%a002050「そんなに　しょっちゅう\n\tいなくなるんですかね。\n\tなんだか　不安だなあ……。\n@c0@"
  ko: "@a@b%a002050: 그렇게 자주\n사라지는 걸까요?\n왠지 불안하군요......\n@c0@"
  sl: "@a@b%a002050：经常这样\n　　不见踪影啊。\n　　好不安……\n@c0@"
  tl: "@a@b%a002050：經常這樣\n　　不見蹤影啊。\n　　好不安……\n@c0@"
55:
  en: "@a%0%a002000@bAye. We should leave no stone unturned.\n@c0@"
  ja: "@a@b%a002000「とにかく　かたっぱしから\n\tあちこち　あたってみよう。\n@c0@"
  ko: "@a@b%a002000: 아무튼 끝에서부터\n구석구석 찾아보자고.\n@c0@"
  sl: "@a@b%a002000：总之先翻箱倒柜找找吧。\n@c0@"
  tl: "@a@b%a002000：總之先翻箱倒櫃找找吧。\n@c0@"
56:
  en: "@a%0%a002010@bI wonder if anyone has seen the Prince?\n@c0@"
  ja: "@a@b%a002010「誰か　王子を\n\t見かけた人　いないかしら。\n@c0@"
  ko: "@a@b%a002010: 왕자를\n봤다는 사람 어디 없을까?\n@c0@"
  sl: "@a@b%a002010：没有人看到王子么？\n@c0@"
  tl: "@a@b%a002010：沒有人看到王子麼？\n@c0@"
57:
  en: "@a%0%a002020@bThe King told us his son's hiding somewhere in the castle, didn't he?\n@c0@"
  ja: "@a@b%a002020「お城の　中に\n\tいるはずだって　王さまは\n\tおっしゃってたわよね。\n@c0@"
  ko: "@a@b%a002020: 왕은 틀림없이\n성안에 있을 거라고\n했지.\n@c0@"
  sl: "@a@b%a002020：国王陛下说\n　　他应该还在城里吧。\n@c0@"
  tl: "@a@b%a002020：國王陛下說\n　　他應該還在城裡吧。\n@c0@"
58:
  en: "@a%0%a002030@bHe could have concealed himself in the shadows...\n@c0@"
  ja: "@a@b%a002030「ものかげにでも\n\tかくれているのかなあ。\n@c0@"
  ko: "@a@b%a002030: 사각 지대에\n숨어 있으려나.\n@c0@"
  sl: "@a@b%a002030：会不会藏在\n　　某个隐蔽处了呢。\n@c0@"
  tl: "@a@b%a002030：會不會藏在\n　　某個隱蔽處了呢。\n@c0@"
59:
  en: "@a%0%a002050@bWhat a castle!\n@c0@"
  ja: "@a@b%a002050「きょろ　きょろ……。\n@c0@"
  ko: "@a@b%a002050: 두리번두리번......\n@c0@"
  sl: "@a@b%a002050：啧啧啧……\n@c0@"
  tl: "@a@b%a002050：嘖嘖嘖……\n@c0@"
60:
  en: "@a%0%a002000@bReady to head back to the throne room, %a000090?\n@c0@"
  ja: "@a@b%a002000「じゃあ　%a000090\n\t王さまのところに　もどろうか。\n@c0@"
  ko: "@a@b%a002000: 그럼 %a000090,\n왕이 계신 곳으로 돌아갈까?\n@c0@"
  sl: "@a@b%a002000：%a000090，\n　　回国王陛下那里去吧。\n@c0@"
  tl: "@a@b%a002000：%a000090，\n　　回國王陛下那裡去吧。\n@c0@"
61:
  en: "@a%0%a002010@bThis child is definitely still a flight risk...\n@c0@"
  ja: "@a@b%a002010「あの子　また　逃げる\n\t可能性も　ありそうだけど……。\n@c0@"
  ko: "@a@b%a002010: 그 아이, 또 도망쳤을\n가능성도 있을 것 같은데......\n@c0@"
  sl: "@a@b%a002010：那孩子\n　　还有可能再次逃走……\n@c0@"
  tl: "@a@b%a002010：那孩子\n　　還有可能再次逃走……\n@c0@"
62:
  en: "@a%0%a002010@bBut there's no use in worrying about that now. Let's go back to the King.\n@c0@"
  ja: "@a@b%a002010「まあ　王さまの部屋を\n\tたしかめないうちに\n\tそこまで　考えるのは　ムダね。\n@c0@"
  ko: "@a@b%a002010: 하긴, 왕의 방을\n확인하기 전에\n거기까지 생각하는 건 쓸데없는 일이겠네.\n@c0@"
  sl: "@a@b%a002010：不过，不去\n　　国王陛下的房间确认一下的话，\n　　想再多也没用。\n@c0@"
  tl: "@a@b%a002010：不過，不去\n　　國王陛下的房間確認一下的話，\n　　想再多也沒用。\n@c0@"
63:
  en: "@a%0%a002020@bTime to check on our pal the King.\n@c0@"
  ja: "@a@b%a002020「もどろ　もどろ\n\t王さまのところに　もどろ。\n@c0@"
  ko: "@a@b%a002020: 돌아가자, 돌아가자.\n왕이 계신 곳으로 돌아가자.\n@c0@"
  sl: "@a@b%a002020：回国王陛下那里去吧。\n@c0@"
  tl: "@a@b%a002020：回國王陛下那裡去吧。\n@c0@"
64:
  en: "@a%0%a002030@bIt's a relief that our search is at an end.\n@c0@"
  ja: "@a@b%a002030「もう　探さなくて\n\tいいので　ホッとしてます。\n@c0@"
  ko: "@a@b%a002030: 이제 찾지 않아도 되니\n안심입니다.\n@c0@"
  sl: "@a@b%a002030：不用再找了，\n　　真是松了口气。\n@c0@"
  tl: "@a@b%a002030：不用再找了，\n　　真是鬆了口氣。\n@c0@"
65:
  en: "@a%0%a002050@bOld %a002050 is worn out, I tell you!\n@c0@"
  ja: "@a@b%a002050「ちょっと\n\t疲れちゃいました。\n@c0@"
  ko: "@a@b%a002050: 조금\n지치는군요.\n@c0@"
  sl: "@a@b%a002050：有点累了呢。\n@c0@"
  tl: "@a@b%a002050：有點累了呢。\n@c0@"
66:
  en: "@a%0%a002000@bWell that settles that, aye? Let's head back inside.\n@c0@"
  ja: "@a@b%a002000「ここ以外に\n\t出口は　ないよな。\n\t中を　探そう。\n@c0@"
  ko: "@a@b%a002000: 여기 말고\n출구는 없는 모양이군.\n안쪽을 찾아보자.\n@c0@"
  sl: "@a@b%a002000：除了这里以外\n　　没别的出口了呢。\n　　去里面找找吧。\n@c0@"
  tl: "@a@b%a002000：除了這裡以外\n　　沒別的出口了呢。\n　　去裡面找找吧。\n@c0@"
67:
  en: "@a%0%a002010@bIf neither of these guards saw him come out, he must be inside the castle.\n@c0@"
  ja: "@a@b%a002010「ふたりで　見はっていて\n\t見かけなかったのなら\n\tやはり　中なのでしょうね。\n@c0@"
  ko: "@a@b%a002010: 둘이서 지키고 있는데도\n못 봤다면\n역시 안에 있나 보네.\n@c0@"
  sl: "@a@b%a002010：两个放哨的人\n　　都没看见的话，\n　　那一定是在里面吧。\n@c0@"
  tl: "@a@b%a002010：兩個放哨的人\n　　都沒看見的話，\n　　那一定是在裡面吧。\n@c0@"
68:
