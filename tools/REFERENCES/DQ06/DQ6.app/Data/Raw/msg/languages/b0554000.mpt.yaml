  sl: "@a@b%a002050：%a000090，\n　　现在要先去\n　　国王陛下那里。\n@c0@"
  tl: "@a@b%a002050：%a000090，\n　　現在要先去\n　　國王陛下那裡。\n@c0@"
119:
  en: "@a%0%a002000@bCrikey! I don't see him anywhere!\n@c0@"
  ja: "@a@b%a002000「くそっ……。\n\tどこにも　いないぜ！\n@c0@"
  ko: "@a@b%a002000: 제길......\n어딜 찾아도 없잖아!\n@c0@"
  sl: "@a@b%a002000：可恶……\n　　哪都找不到！\n@c0@"
  tl: "@a@b%a002000：可惡……\n　　哪都找不到！\n@c0@"
120:
  en: "@a%0%a002010@bI doubt he's just going to appear out of thin air...\n@c0@"
  ja: "@a@b%a002010「そんなに　パッとは\n\t見つからないわよね。\n@c0@"
  ko: "@a@b%a002010: 그렇게 금방\n나오지는 않네.\n@c0@"
  sl: "@a@b%a002010：不可能\n　　一下子就找得到呢。\n@c0@"
  tl: "@a@b%a002010：不可能\n　　一下子就找得到呢。\n@c0@"
121:
  en: "@a%0%a002020@bHmm... Now where could he be?\n@c0@"
  ja: "@a@b%a002020「う～ん\n\tどこだろうね……。\n@c0@"
  ko: "@a@b%a002020: 으음~\n어디 있는 걸까......\n@c0@"
  sl: "@a@b%a002020：唔～\n　　到底在哪啊……\n@c0@"
  tl: "@a@b%a002020：唔～\n　　到底在哪啊……\n@c0@"
122:
  en: "@a%0%a002030@bWe must leave no stone unturned.\n@c0@"
  ja: "@a@b%a002030「根気よく\n\tさがしましょう。\n@c0@"
  ko: "@a@b%a002030: 단념하지 말고\n찾아봅시다.\n@c0@"
  sl: "@a@b%a002030：耐心找找吧。\n@c0@"
  tl: "@a@b%a002030：耐心找找吧。\n@c0@"
123:
  en: "@a%0%a002050@bThis reminds me of playin' hide-and-seek as a nipper.\n@c0@"
  ja: "@a@b%a002050「子供のころの\n\tかくれんぼを　思い出しますね。\n@c0@"
  ko: "@a@b%a002050: 어릴 때 하던\n숨바꼭질이 생각나네요.\n@c0@"
  sl: "@a@b%a002050：我想起了孩童时代\n　　玩过的捉迷藏呢。\n@c0@"
  tl: "@a@b%a002050：我想起了孩童時代\n　　玩過的捉迷藏呢。\n@c0@"
124:
  en: "@a%0%a002000@bReady to head back to the throne room, %a000090?\n@c0@"
  ja: "@a@b%a002000「じゃあ　%a000090\n\t王さまのところに　もどろうか。\n@c0@"
  ko: "@a@b%a002000: 그럼 %a000090,\n왕이 계신 곳으로 돌아갈까?\n@c0@"
  sl: "@a@b%a002000：%a000090，\n　　回国王陛下那里去吧。\n@c0@"
  tl: "@a@b%a002000：%a000090，\n　　回國王陛下那裡去吧。\n@c0@"
125:
  en: "@a%0%a002010@bThis child is definitely still a flight risk...\n@c0@"
  ja: "@a@b%a002010「あの子　また　逃げる\n\t可能性も　ありそうだけど……。\n@c0@"
  ko: "@a@b%a002010: 그 아이, 또 도망쳤을\n가능성도 있을 것 같은데......\n@c0@"
  sl: "@a@b%a002010：那孩子\n　　还有可能再次逃走……\n@c0@"
  tl: "@a@b%a002010：那孩子\n　　還有可能再次逃走……\n@c0@"
126:
  en: "@a%0%a002010@bBut there's no use in worrying about that now. Let's go back to the King.\n@c0@"
  ja: "@a@b%a002010「まあ　王さまの部屋を\n\tたしかめないうちに\n\tそこまで　考えるのは　ムダね。\n@c0@"
  ko: "@a@b%a002010: 하긴, 왕의 방을\n확인하기 전에\n거기까지 생각하는 건 쓸데없는 일이겠네.\n@c0@"
  sl: "@a@b%a002010：不过，不去\n　　国王陛下的房间确认一下的话，\n　　想再多也没用。\n@c0@"
  tl: "@a@b%a002010：不過，不去\n　　國王陛下的房間確認一下的話，\n　　想再多也沒用。\n@c0@"
127:
  en: "@a%0%a002020@bTime to check on our pal the King.\n@c0@"
  ja: "@a@b%a002020「もどろ　もどろ\n\t王さまのところに　もどろ。\n@c0@"
  ko: "@a@b%a002020: 돌아가자, 돌아가자.\n왕이 계신 곳으로 돌아가자.\n@c0@"
  sl: "@a@b%a002020：回国王陛下那里去吧。\n@c0@"
  tl: "@a@b%a002020：回國王陛下那裡去吧。\n@c0@"
128:
  en: "@a%0%a002030@bIt's a relief that our search is at an end.\n@c0@"
  ja: "@a@b%a002030「もう　探さなくて\n\tいいので　ホッとしてます。\n@c0@"
  ko: "@a@b%a002030: 이제 찾지 않아도 되니\n안심입니다.\n@c0@"
  sl: "@a@b%a002030：不用再找了，\n　　真是松了口气。\n@c0@"
  tl: "@a@b%a002030：不用再找了，\n　　真是鬆了口氣。\n@c0@"
129:
  en: "@a%0%a002050@bOld %a002050 could do with forty winks, I tell you!\n@c0@"
  ja: "@a@b%a002050「さすがに　ちょっと\n\t疲れちゃいましたね。\n@c0@"
  ko: "@a@b%a002050: 이렇게 돌아다니니 조금\n지치는군요.\n@c0@"
  sl: "@a@b%a002050：还真是累人啊。\n@c0@"
  tl: "@a@b%a002050：還真是累人啊。\n@c0@"
130:
  en: "@a%0%a002000@bHuh. I loved playin' hide-'n-seek...when I was five.\n@c0@"
  ja: "@a@b%a002000「彼が　知らないってことは\n\t王子は　こっちじゃないな。\n@c0@"
  ko: "@a@b%a002000: 이 사람이 모른다는 건\n왕자가 이쪽에 없다는 뜻이겠군.\n@c0@"
  sl: "@a@b%a002000：他不知道的话，\n　　说明王子不在这里。\n@c0@"
  tl: "@a@b%a002000：他不知道的話，\n　　說明王子不在這裡。\n@c0@"
131:
  en: "@a%0%a002010@bThat gentleman will keep watch over this area for us. Let's search somewhere else.\n@c0@"
  ja: "@a@b%a002010「このへんは　この人に\n\tまかせて　私たちは　別のところを\n\tさがしましょうか。\n@c0@"
  ko: "@a@b%a002010: 이쪽은 이 사람에게\n맡겨 두고 우리는 다른 곳을\n찾아 볼까?\n@c0@"
  sl: "@a@b%a002010：这里就\n　　交给这个人了。\n　　我们去别的地方找吧。\n@c0@"
  tl: "@a@b%a002010：這裡就\n　　交給這個人了。\n　　我們去別的地方找吧。\n@c0@"
132:
  en: "@a%0%a002020@bAt least we know that guy will spot the Prince if he runs through here.\n@c0@"
  ja: "@a@b%a002020「王子が　ここを　通れば\n\tかくじつに　この人が\n\t見つけてくれるわね！\n@c0@"
  ko: "@a@b%a002020: 왕자가 여길 지나가면\n이 사람이 확실히\n발견해 줄 거야!\n@c0@"
  sl: "@a@b%a002020：要是王子\n　　经过这里的话，\n　　一定会被这个人看到的吧！\n@c0@"
  tl: "@a@b%a002020：要是王子\n　　經過這裡的話，\n　　一定會被這個人看到的吧！\n@c0@"
133:
  en: "@a%0%a002030@bEven the castle's soldiers are joining the hunt.\n@c0@"
  ja: "@a@b%a002030「兵士のみなさんも\n\tさがしている　ようですね。\n@c0@"
  ko: "@a@b%a002030: 병사 여러분도\n찾고 있는 모양이군요.\n@c0@"
  sl: "@a@b%a002030：士兵们\n　　好像也在找呢。\n@c0@"
  tl: "@a@b%a002030：士兵們\n　　好像也在找呢。\n@c0@"
134:
  en: "@a%0%a002050@bHide-and-seek is no activity for a military man.\n@c0@"
  ja: "@a@b%a002050「王子を　さがすのは\n\t本来の　兵士の　役目とは\n\tちがいますよね……。\n@c0@"
