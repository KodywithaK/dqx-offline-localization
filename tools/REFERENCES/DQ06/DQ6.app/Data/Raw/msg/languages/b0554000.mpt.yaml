  en: "@a%0%a002050@bWell, we can't say that no one warned us. The Prince seems like a bad egg, and no mistake!\n@c0@"
  ja: "@a@b%a002050「王子を　悪くいう人が\n\t多いって　ききましたが\n\tわかる気が　するなあ。\n@c0@"
