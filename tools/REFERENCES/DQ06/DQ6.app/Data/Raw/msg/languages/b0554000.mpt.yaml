  ja: "@a@b%a002020「ねえ　とりあえず\n\t王さまのところに　もどろうよ！\n@c0@"
  ko: "@a@b%a002020: 저기, 일단은\n왕이 계신 곳으로 돌아가자!\n@c0@"
  sl: "@a@b%a002020：总之先回\n　　国王陛下那里去吧！\n@c0@"
  tl: "@a@b%a002020：總之先回\n　　國王陛下那裡去吧！\n@c0@"
168:
  en: "@a%0%a002030@bSo it seems Prince Howard didn't come this way.\n@c0@"
  ja: "@a@b%a002030「ホルス王子は\n\tあれから　こちらには\n\t来てないと　いうことですね。\n@c0@"
  ko: "@a@b%a002030: 홀스 왕자는\n그 후로 이곳에는\n오지 않았나 봅니다.\n@c0@"
  sl: "@a@b%a002030：也就是说\n　　荷尔斯王子那之后\n　　就没到这里来过了。\n@c0@"
  tl: "@a@b%a002030：也就是說\n　　荷爾斯王子那之後\n　　就沒到這裡來過了。\n@c0@"
169:
  en: "@a%0%a002050@b%0%a000090, I think we should make seein' the King our top priority.\n@c0@"
  ja: "@a@b%a002050「%a000090さん\n\tいまは　王さまの　ところに\n\t行くのが　先かと。\n@c0@"
  ko: "@a@b%a002050: %a000090 님,\n지금은 왕이 계신 곳으로\n가는 게 먼저입니다.\n@c0@"
  sl: "@a@b%a002050：%a000090，\n　　现在要先去\n　　国王陛下那里。\n@c0@"
  tl: "@a@b%a002050：%a000090，\n　　現在要先去\n　　國王陛下那裡。\n@c0@"
170:
  en: "@a%0%a002000@bWhoa! Like shootin' fish in a barrel, aye?\n@c0@"
  ja: "@a@b%a002000「……なんと\n\tこんなところに。\n@c0@"
  ko: "@a@b%a002000: ......세상에\n이런 곳에 있었다니.\n@c0@"
  sl: "@a@b%a002000：……居然在\n　　这种地方。\n@c0@"
  tl: "@a@b%a002000：……居然在\n　　這種地方。\n@c0@"
171:
  en: "@a%0%a002010@bHee hee. He actually answered back! He's still got a lot to learn about hide-and-seek...\n@c0@"
  ja: "@a@b%a002010「うふ。\n\t返事しちゃう　ところが\n\t子供よね。\n@c0@"
  ko: "@a@b%a002010: 우훗.\n대답해 버리는 게\n아이다운걸.\n@c0@"
  sl: "@a@b%a002010：唔。\n　　做出这样的反应，\n　　倒挺像个孩子。\n@c0@"
  tl: "@a@b%a002010：唔。\n　　做出這樣的反應，\n　　倒挺像個孩子。\n@c0@"
172:
  en: "@a%0%a002020@bHe fit inside that barrel...? He's not exactly a small child, either!\n@c0@"
  ja: "@a@b%a002020「タルの　中に\n\tかくれてるなんて……\n\tちっちゃな子じゃ　あるまいし。\n@c0@"
  ko: "@a@b%a002020: 나무통 속에\n숨어 있었다니......\n조그만 애도 아닐 텐데.\n@c0@"
  sl: "@a@b%a002020：居然藏在桶里……\n　　又不是身材娇小的豆丁。\n@c0@"
  tl: "@a@b%a002020：居然藏在桶裡……\n　　又不是身材嬌小的豆丁。\n@c0@"
173:
  en: "@a%0%a002030@bLet us return to King Howell.\n@c0@"
  ja: "@a@b%a002030「それじゃ\n\t私たちも　王さまの　ところへ\n\tいきましょうか。\n@c0@"
  ko: "@a@b%a002030: 그럼\n우리도 왕이 계신 곳으로\n가지요.\n@c0@"
  sl: "@a@b%a002030：那么我们\n　　也回国王陛下那里去吧。\n@c0@"
  tl: "@a@b%a002030：那麼我們\n　　也回國王陛下那裡去吧。\n@c0@"
174:
  en: "@a%0%a002050@bYou wouldn't find old %a002050 clamberin' into pots and barrels, I tell you!\n@c0@"
  ja: "@a@b%a002050「私じゃ　とても\n\tつぼの中　なんかには\n\tかくれられませんね。\n@c0@"
  ko: "@a@b%a002050: 저라면 그런\n항아리 속 같은 곳에는\n도저히 못 숨어 있을 겁니다.\n@c0@"
  sl: "@a@b%a002050：我可藏不进\n　　罐子这种东西里去啊。\n@c0@"
  tl: "@a@b%a002050：我可藏不進\n　　罐子這種東西裡去啊。\n@c0@"
175:
  en: "@a%0%a002000@bHardy har! The Prince must be a real handful if his guards are gripin' to strangers!\n@c0@"
  ja: "@a@b%a002000「兵士　ふたりで\n\tこそこそ　グチの\n\tいいあいか……。\n@c0@"
  ko: "@a@b%a002000: 병사 둘이서\n작은 목소리로 질세라 서로 불평을\n늘어놓고 있군......\n@c0@"
  sl: "@a@b%a002000：两个士兵\n　　在悄悄地互相抱怨啊……\n@c0@"
  tl: "@a@b%a002000：兩個士兵\n　　在悄悄地互相抱怨啊……\n@c0@"
176:
  en: "@a%0%a002010@bWhat could the Prince have done to them?\n@c0@"
  ja: "@a@b%a002010「なにか　王子と\n\tもめごとでも……？\n@c0@"
  ko: "@a@b%a002010: 왕자랑\n싸우기라도 했나......?\n@c0@"
  sl: "@a@b%a002010：是不是跟王子吵架了啊……\n@c0@"
  tl: "@a@b%a002010：是不是跟王子吵架了啊……\n@c0@"
177:
  en: "@a%0%a002020@bBoy, that soldier looked frazzled.\n@c0@"
  ja: "@a@b%a002020「なんだか　ストレス\n\tたまってるみたいね。\n@c0@"
  ko: "@a@b%a002020: 스트레스가\n쌓였나 봐.\n@c0@"
  sl: "@a@b%a002020：好像积攒了\n　　不少压力呢。\n@c0@"
  tl: "@a@b%a002020：好像積攢了\n　　不少壓力呢。\n@c0@"
178:
  en: "@a%0%a002030@bDo these soldiers not worry their gripes might make their way back to the King?\n@c0@"
  ja: "@a@b%a002030「あんなこと\n\t堂々と　言っちゃってますけど\n\t平気なのでしょうか……。\n@c0@"
  ko: "@a@b%a002030: 저런 말을\n다 들리게 하는데\n그래도 괜찮은 걸까요......\n@c0@"
  sl: "@a@b%a002030：居然这么直言不讳，\n　　真的不会有事么……\n@c0@"
  tl: "@a@b%a002030：居然這麼直言不諱，\n　　真的不會有事麼……\n@c0@"
179:
  en: "@a%0%a002050@bSounds like this fellow's at the end of his tether.\n@c0@"
  ja: "@a@b%a002050「ふむふむ\n\tホルス王子の　お供は\n\t大変だ……と。\n@c0@"
  ko: "@a@b%a002050: 흠흠.\n홀스 왕자의 비위를 맞추는 일은\n힘들다고......\n@c0@"
  sl: "@a@b%a002050：唔。\n　　是说陪同\n　　荷尔斯王子很辛苦啊……\n@c0@"
  tl: "@a@b%a002050：唔。\n　　是說陪同\n　　荷爾斯王子很辛苦啊……\n@c0@"
180:
  en: "@a%0%a002000@bNot many places to hide around here, I suppose.\n@c0@"
  ja: "@a@b%a002000「ここには\n\tかくれようが　ないか。\n@c0@"
  ko: "@a@b%a002000: 여기에는\n숨을 방법이 없겠군.\n@c0@"
  sl: "@a@b%a002000：没藏在这里啊。\n@c0@"
  tl: "@a@b%a002000：沒藏在這裡啊。\n@c0@"
181:
  en: "@a%0%a002010@bShall we check around this room, %a000090? I'm sure he's not here, but still...\n@c0@"
  ja: "@a@b%a002010「%a000090　いちおう\n\tへやじゅう　探してみる？\n\tその必要　ないとは　思うけど。\n@c0@"
  ko: "@a@b%a002010: %a000090, 일단\n방 전체를 찾아볼까?\n그럴 필요가 없을 것 같긴 하지만.\n@c0@"
  sl: "@a@b%a002010：%a000090，\n　　要不要在这个房间里找找？\n　　虽然我觉得其实没什么必要。\n@c0@"
  tl: "@a@b%a002010：%a000090，\n　　要不要在這個房間裡找找？\n　　雖然我覺得其實沒什麼必要。\n@c0@"
182:
  en: "@a%0%a002020@bI doubt he'd hide in a room guarded by soldiers who can't stand him.\n@c0@"
  ja: "@a@b%a002020「王子の　悪口で\n\tもりあがってるような　ところに\n\tいるわけ　ないわね。\n@c0@"
  ko: "@a@b%a002020: 한창 왕자의 험담을\n재밌게 하고 있는 곳인데\n여기 있을 리가 없겠지.\n@c0@"
  sl: "@a@b%a002020：王子应该不会藏在\n　　大家都在说他\n　　坏话的地方吧。\n@c0@"
  tl: "@a@b%a002020：王子應該不會藏在\n　　大家都在說他\n　　壞話的地方吧。\n@c0@"
183:
  en: "@a%0%a002030@bWell, there's no prince here.\n@c0@"
  ja: "@a@b%a002030「そりゃ　ここには\n\tいないでしょうね。\n@c0@"
  ko: "@a@b%a002030: 하기야, 여기에는\n없겠지요.\n@c0@"
  sl: "@a@b%a002030：不在这里呢。\n@c0@"
  tl: "@a@b%a002030：不在這裡呢。\n@c0@"
184:
  en: "@a%0%a002050@bHe couldn't be in here.\n@c0@"
  ja: "@a@b%a002050「どう　見ても\n\tいないですよね。\n@c0@"
  ko: "@a@b%a002050: 아무리 봐도\n없네요.\n@c0@"
  sl: "@a@b%a002050：怎么看都不在呢。\n@c0@"
  tl: "@a@b%a002050：怎麼看都不在呢。\n@c0@"
185:
  en: "@a%0%a002000@bIt's kind of a maze down here, aye?\n@c0@"
  ja: "@a@b%a002000「地下は　ちょっとした\n\t迷路だな。\n@c0@"
  ko: "@a@b%a002000: 지하는 약간\n미로처럼 되어 있군.\n@c0@"
  sl: "@a@b%a002000：地下的路真是复杂啊。\n@c0@"
  tl: "@a@b%a002000：地下的路真是複雜啊。\n@c0@"
186:
  en: "@a%0%a002010@bThe atmosphere down here is completely different.\n@c0@"
  ja: "@a@b%a002010「上の　階とは\n\tぜんぜん　ふんいきが\n\tちがうわね。\n@c0@"
  ko: "@a@b%a002010: 위층과는\n분위기가 전혀\n다르네.\n@c0@"
  sl: "@a@b%a002010：跟上面那层的\n　　氛围完全不一样呢。\n@c0@"
  tl: "@a@b%a002010：跟上面那層的\n　　氛圍完全不一樣呢。\n@c0@"
187:
  en: "@a%0%a002020@bNot much foot traffic down here...\n@c0@"
  ja: "@a@b%a002020「とおる人も\n\t見かけないわね。\n@c0@"
  ko: "@a@b%a002020: 지나가는 사람도\n안 보여.\n@c0@"
  sl: "@a@b%a002020：连路过的人\n　　也看不见呢。\n@c0@"
  tl: "@a@b%a002020：連路過的人\n　　也看不見呢。\n@c0@"
188:
  en: "@a%0%a002030@bThis area of the castle is rather sparsely decorated.\n@c0@"
  ja: "@a@b%a002030「お城の　中にしては\n\tかざりけに　とぼしいですね。\n@c0@"
  ko: "@a@b%a002030: 성 내부 치고는\n장식이 적군요.\n@c0@"
  sl: "@a@b%a002030：这里作为城堡的\n　　一部分，修得还挺寒酸的呢。\n@c0@"
  tl: "@a@b%a002030：這裡作為城堡的\n　　一部分，修得還挺寒酸的呢。\n@c0@"
189:
  en: "@a%0%a002050@bAh-Ah-CHOO!!! ...Don't mind me! It's just a tad dusty!\n@c0@"
  ja: "@a@b%a002050「ヘックシュン！\n\tちょっと　ほこりっぽいですね。\n@c0@"
  ko: "@a@b%a002050: 엣취!\n조금 먼지가 날리네요.\n@c0@"
  sl: "@a@b%a002050：阿嚏！\n　　到处都是灰尘呢。\n@c0@"
  tl: "@a@b%a002050：阿嚏！\n　　到處都是灰塵呢。\n@c0@"
190:
  en: "@a%0%a002000@bHe's out like a light. That ain't helpful.\n@c0@"
  ja: "@a@b%a002000「ねてるぜ……\n\tたよりに　ならないなあ。\n@c0@"
  ko: "@a@b%a002000: 자고 있네......\n도움이 안 되는군.\n@c0@"
  sl: "@a@b%a002000：睡着了啊……\n　　真靠不住。\n@c0@"
  tl: "@a@b%a002000：睡著了啊……\n　　真靠不住。\n@c0@"
191:
  en: "@a%0%a002010@bWith that old man asleep, the Prince could go wherever he pleases undetected.\n@c0@"
  ja: "@a@b%a002010「この人も　ねてるし\n\t王子は　地下道を　通れば\n\tあちこちに　行けたはずね。\n@c0@"
  ko: "@a@b%a002010: 이 사람도 자고 있으니,\n왕자는 지하도를 통과하면\n여기저기로 갈 수 있었을 거야.\n@c0@"
  sl: "@a@b%a002010：这个人睡着了，\n　　那么王子就可以\n　　从地下通道去任何地方了呢。\n@c0@"
  tl: "@a@b%a002010：這個人睡著了，\n　　那麼王子就可以\n　　從地下通道去任何地方了呢。\n@c0@"
192:
  en: "@a%0%a002020@bI wouldn't hide down here if I were the Prince. You'd be a sitting duck.\n@c0@"
  ja: "@a@b%a002020「あたしだったら\n\tここには　かくれないわ。\n\tふくろの　ねずみだもの。\n@c0@"
  ko: "@a@b%a002020: 나라면\n여기는 안 숨을 거야.\n독 안에 든 쥐나 다름없잖아.\n@c0@"
  sl: "@a@b%a002020：我可不想\n　　藏在这种地方。\n　　简直就是瓮中之鳖嘛。\n@c0@"
  tl: "@a@b%a002020：我可不想\n　　藏在這種地方。\n　　簡直就是甕中之鱉嘛。\n@c0@"
193:
  en: "@a%0%a002030@bWell, he doesn't appear to be around here. Where next?\n@c0@"
  ja: "@a@b%a002030「ここを　ひととおり\n\t探しても　いないようなら\n\tあとは……うーん。\n@c0@"
  ko: "@a@b%a002030: 여기를 한 번씩\n다 찾았는데도 없다면\n남은 곳은...... 으음.\n@c0@"
  sl: "@a@b%a002030：这里差不多翻遍了，\n　　还找不到的话，\n　　接下来……唔。\n@c0@"
  tl: "@a@b%a002030：這裡差不多翻遍了，\n　　還找不到的話，\n　　接下來……唔。\n@c0@"
194:
  en: "@a%0%a002050@bThere's nowhere underground that you could really hide yourself except for here.\n@c0@"
  ja: "@a@b%a002050「地下通路には　ここ以外\n\tかくれられそうな　ところは\n\tなかったですね。\n@c0@"
  ko: "@a@b%a002050: 지하 통로에는 여기 외에\n숨을 수 있는 곳이\n없었죠.\n@c0@"
  sl: "@a@b%a002050：地下通道里除了这里，\n　　没有别的可以\n　　藏身的地方了吧。\n@c0@"
  tl: "@a@b%a002050：地下通道裡除了這裡，\n　　沒有別的可以\n　　藏身的地方了吧。\n@c0@"
195:
  en: "@a%0%a002000@bHide-'n'-seek, aye...?\n@c0@"
  ja: "@a@b%a002000「かくれんぼね……。\n@c0@"
  ko: "@a@b%a002000: 숨바꼭질이라......\n@c0@"
  sl: "@a@b%a002000：捉迷藏啊……\n@c0@"
  tl: "@a@b%a002000：捉迷藏啊……\n@c0@"
196:
  en: "@a%0%a002010@bHe didn't even know Prince Howard had run away.\n@c0@"
  ja: "@a@b%a002010「この子は\n\t王子が　いなくなったことは\n\t知らないんだわね。\n@c0@"
  ko: "@a@b%a002010: 이 아이는\n왕자가 사라진 사실을\n모르는구나.\n@c0@"
  sl: "@a@b%a002010：这孩子不知道\n　　王子不见了呢。\n@c0@"
  tl: "@a@b%a002010：這孩子不知道\n　　王子不見了呢。\n@c0@"
197:
  en: "@a%0%a002020@bThis castle has too many places to hide...\n@c0@"
  ja: "@a@b%a002020「城の中には\n\tかくれるところは　いっぱい\n\tあるからなあ……。\n@c0@"
  ko: "@a@b%a002020: 성안에는\n숨을 만한 곳이\n잔뜩 있으니까......\n@c0@"
  sl: "@a@b%a002020：城里面有很多\n　　可以藏身的地方呢……\n@c0@"
  tl: "@a@b%a002020：城裡面有很多\n　　可以藏身的地方呢……\n@c0@"
198:
  en: "@a%0%a002020@bIf Prince Howard is that good at hide-and-seek, this could be a looong day.\n@c0@"
  ja: "@a@b%a002020「ホルス王子が\n\tかくれんぼが　とくいだとしたら\n\t見つけるのは　大変かもね。\n@c0@"
  ko: "@a@b%a002020: 홀스 왕자가\n숨바꼭질을 잘한다면\n찾는 게 힘들지도 몰라.\n@c0@"
  sl: "@a@b%a002020：要是荷尔斯王子\n　　玩捉迷藏很拿手的话，\n　　要找他还真麻烦呢。\n@c0@"
  tl: "@a@b%a002020：要是荷爾斯王子\n　　玩捉迷藏很拿手的話，\n　　要找他還真麻煩呢。\n@c0@"
199:
  en: "@a%0%a002030@bA barrel? Intriguing...\n@c0@"
  ja: "@a@b%a002030「タル……ですか。\n@c0@"
  ko: "@a@b%a002030: 나무통......인가요.\n@c0@"
  sl: "@a@b%a002030：桶里啊……\n@c0@"
  tl: "@a@b%a002030：桶裡啊……\n@c0@"
200:
  en: "@a%0%a002050@bHidin' in a barrel?\n@c0@"
  ja: "@a@b%a002050「なるほど！\n\tその手が　あったか！\n@c0@"
  ko: "@a@b%a002050: 아니!\n그런 방법이 있었냐!\n@c0@"
  sl: "@a@b%a002050：原来如此！\n　　还有这招！\n@c0@"
  tl: "@a@b%a002050：原來如此！\n　　還有這招！\n@c0@"
201:
  en: "@a%0%a002050@bThis lad's a clever one, I tell you!\n@c0@"
  ja: "@a@b%a002050「あ　すいません……。\n\tちょっと　この子の　マネして\n\t言ってみただけ　なんです。\n@c0@"
  ko: "@a@b%a002050: 아, 죄송합니다......\n잠시 이 아이의 흉내를\n내 봤을 뿐입니다.\n@c0@"
  sl: "@a@b%a002050：啊，不好意思……\n　　我只是模仿\n　　这孩子的语气说话而已。\n@c0@"
  tl: "@a@b%a002050：啊，不好意思……\n　　我只是模仿\n　　這孩子的語氣說話而已。\n@c0@"
202:
  en: "@a%0%a002000@bC'mon, %a000090! Back to the King!\n@c0@"
