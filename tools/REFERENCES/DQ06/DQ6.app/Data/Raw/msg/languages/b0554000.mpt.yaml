  ko: "@a@b%a002020: 그 왕자라면\n카드 놀이도\n입으로 이길 것 같아.\n@c0@"
  sl: "@a@b%a002020：那个王子的话，\n　　即使打牌也是\n　　靠嘴炮赢的吧。\n@c0@"
  tl: "@a@b%a002020：那個王子的話，\n　　即使打牌也是\n　　靠嘴炮贏的吧。\n@c0@"
235:
  en: "@a%0%a002030@bThe Prince plays cards all night and gives folks the run-around all day. Where does he get his energy?\n@c0@"
  ja: "@a@b%a002030「王子は　ご自分が\n\tねぶそくに　ならないとしたら\n\tすごい　エネルギーですね。\n@c0@"
  ko: "@a@b%a002030: 왕자 본인도\n잠이 모자라지 않다면\n에너지가 엄청난가 보군요.\n@c0@"
  sl: "@a@b%a002030：要是王子自己\n　　不会睡眠不足的话，\n　　那可真是精力充沛啊。\n@c0@"
  tl: "@a@b%a002030：要是王子自己\n　　不會睡眠不足的話，\n　　那可真是精力充沛啊。\n@c0@"
236:
  en: "@a%0%a002050@bSeems like there's no one hidin' under the bed.\n@c0@"
  ja: "@a@b%a002050「ベッドの　下には\n\tだれも　いないようですね。\n@c0@"
  ko: "@a@b%a002050: 침대 아래에는\n아무도 없는 것 같네요.\n@c0@"
  sl: "@a@b%a002050：床下面好像没人呢。\n@c0@"
  tl: "@a@b%a002050：床下面好像沒人呢。\n@c0@"
237:
  en: "@a%0%a002000@bCrikey! That lady needs to look before she yells!\n@c0@"
  ja: "@a@b%a002000「この　おばさんも\n\tもう少し　たしかめてから\n\tおこれば　いいと思うがな。\n@c0@"
  ko: "@a@b%a002000: 이 아줌마도\n확인 좀 하고\n화내면 좋을 텐데.\n@c0@"
  sl: "@a@b%a002000：这个大婶发火之前\n　　都不搞清楚对象啊。\n@c0@"
  tl: "@a@b%a002000：這個大嬸發火之前\n　　都不搞清楚對象啊。\n@c0@"
238:
  en: "@a%0%a002010@bIf the Prince stays hidden like this, he's going to miss his dinner.\n@c0@"
  ja: "@a@b%a002010「このまま　かくれてたら\n\tホルス王子は　昼ごはん　ぬきに\n\tなってしまうのにね。\n@c0@"
  ko: "@a@b%a002010: 이대로\n숨어 있으면 홀스 왕자는\n점심을 굶게 되겠네.\n@c0@"
  sl: "@a@b%a002010：再这么藏下去的话，\n　　荷尔斯王子会\n　　赶不上吃午饭的。\n@c0@"
  tl: "@a@b%a002010：再這麼藏下去的話，\n　　荷爾斯王子會\n　　趕不上吃午飯的。\n@c0@"
239:
  en: "@a%0%a002020@bPrince Howard must have a bottomless belly.\n@c0@"
  ja: "@a@b%a002020「ホルス王子って\n\tよっぽど　いやしいのね……。\n@c0@"
  ko: "@a@b%a002020: 홀스 왕자란 사람,\n어지간히 사고 치고 다니나 보네......\n@c0@"
  sl: "@a@b%a002020：荷尔斯王子\n　　还真是贪吃呢……\n@c0@"
  tl: "@a@b%a002020：荷爾斯王子\n　　還真是貪吃呢……\n@c0@"
240:
  en: "@a%0%a002030@bHer words are harsh, but I detect no malice in her tone.\n@c0@"
  ja: "@a@b%a002030「べつに　この人は\n\tホルス王子を　きらってる\n\tわけでも　ないみたいですね。\n@c0@"
  ko: "@a@b%a002030: 이 사람은 딱히\n홀스 왕자를 싫어하는 것\n같지는 않습니다.\n@c0@"
  sl: "@a@b%a002030：这个人好像\n　　并不是讨厌王子呢。\n@c0@"
  tl: "@a@b%a002030：這個人好像\n　　並不是討厭王子呢。\n@c0@"
241:
  en: "@a%0%a002030@bI would almost say she rather enjoys bantering with the Prince.\n@c0@"
  ja: "@a@b%a002030「むしろ　王子との\n\tこういう　やりとりも\n\t楽しいことなのかも　しれません。\n@c0@"
  ko: "@a@b%a002030: 오히려 왕자와의\n이런 교류가 즐거운\n걸 수도 있지요.\n@c0@"
  sl: "@a@b%a002030：好像还挺喜欢\n　　王子做这些事的呢。\n@c0@"
  tl: "@a@b%a002030：好像還挺喜歡\n　　王子做這些事的呢。\n@c0@"
242:
  en: "@a%0%a002050@bWe've gone and got ourselves shouted at again!\n@c0@"
  ja: "@a@b%a002050「ま　また　おこられて\n\tしまいましたね！\n@c0@"
  ko: "@a@b%a002050: 또, 또다시 혼이\n났군요!\n@c0@"
  sl: "@a@b%a002050：又、又被骂了！\n@c0@"
  tl: "@a@b%a002050：又、又被罵了！\n@c0@"
243:
  en: "@a%0%a002000@bThe kids are Prince Howard's only fans around here.\n@c0@"
  ja: "@a@b%a002000「ホルス王子も\n\t子供に　だけは　人気だな。\n@c0@"
  ko: "@a@b%a002000: 홀스 왕자도\n어린애한테만큼은 인기가 있군.\n@c0@"
  sl: "@a@b%a002000：荷尔斯王子\n　　只受孩子们的欢迎呢。\n@c0@"
  tl: "@a@b%a002000：荷爾斯王子\n　　只受孩子們的歡迎呢。\n@c0@"
244:
  en: "@a%0%a002010@bChildren are always so affectionate towards their playmates, bless them.\n@c0@"
  ja: "@a@b%a002010「子供は　いっしょに\n\tあそんでくれる人が　大好きよね。\n@c0@"
  ko: "@a@b%a002010: 아이들은 같이\n놀아 주는 사람을 좋아하지.\n@c0@"
  sl: "@a@b%a002010：小孩子最喜欢\n　　陪自己玩的人了。\n@c0@"
  tl: "@a@b%a002010：小孩子最喜歡\n　　陪自己玩的人了。\n@c0@"
245:
  en: "@a%0%a002020@bPlaying games all day? At the Prince's age? I guess he's childish in more ways than one.\n@c0@"
  ja: "@a@b%a002020「あの年に　なって\n\tあそんで　ばかり　いたんじゃ\n\t困るんだけどね。\n@c0@"
  ko: "@a@b%a002020: 그 나이가 되도록\n놀고만 있어서는\n곤란한데 말이야.\n@c0@"
  sl: "@a@b%a002020：都这个年纪了\n　　还整天到处玩，\n　　真是伤脑筋啊。\n@c0@"
  tl: "@a@b%a002020：都這個年紀了\n　　還整天到處玩，\n　　真是傷腦筋啊。\n@c0@"
246:
  en: "@a%0%a002030@bOne could argue we're playing with the Prince as well — a perpetual game of hide-and-seek.\n@c0@"
  ja: "@a@b%a002030「私たちは\n\tずっと　かくれんぼの\n\tオニなんでしょうかね……。\n@c0@"
  ko: "@a@b%a002030: 우리는\n계속 숨바꼭질에서\n술래를 하고 있는 걸까요......\n@c0@"
  sl: "@a@b%a002030：我们一直在被迫\n　　陪王子玩捉迷藏呢……\n　　而且总是我们去找……\n@c0@"
  tl: "@a@b%a002030：我們一直在被迫\n　　陪王子玩捉迷藏呢……\n　　而且總是我們去找……\n@c0@"
247:
  en: "@a%0%a002050@bI wonder if Howie's teachin' that lad to gamble and all...\n@c0@"
  ja: "@a@b%a002050「この子と\n\tカードゲームも\n\tするのでしょうかね。\n@c0@"
  ko: "@a@b%a002050: 이 아이랑\n카드 게임도\n할까요?\n@c0@"
  sl: "@a@b%a002050：跟这个孩子也打牌吗？\n@c0@"
  tl: "@a@b%a002050：跟這個孩子也打牌嗎？\n@c0@"
248:
  en: "@a%0%a002000@bI wonder if these two ever stop their bellyaching.\n@c0@"
  ja: "@a@b%a002000「あいかわらず\n\tこのふたりは　ここで\n\tダベッてるのか。\n@c0@"
  ko: "@a@b%a002000: 이 둘은\n여전히 여기서\n잡담을 하고 있군.\n@c0@"
  sl: "@a@b%a002000：这两个人\n　　还在这里\n　　絮絮叨叨的啊。\n@c0@"
  tl: "@a@b%a002000：這兩個人\n　　還在這裡\n　　絮絮叨叨的啊。\n@c0@"
249:
  en: "@a%0%a002010@bHe's getting well ahead of himself. We need to get the Prince to the cave first.\n@c0@"
  ja: "@a@b%a002010「先のことは　ともかく\n\tまずは　王子には　洗礼を\n\t受けてもらわないとね。\n@c0@"
  ko: "@a@b%a002010: 뒷일은 그때 가서 생각하고\n일단은 왕자가\n세례를 받아 줘야 해.\n@c0@"
  sl: "@a@b%a002010：暂时别管以后的事，\n　　先得让王子\n　　接受洗礼才行。\n@c0@"
  tl: "@a@b%a002010：暫時別管以後的事，\n　　先得讓王子\n　　接受洗禮才行。\n@c0@"
250:
  en: "@a%0%a002020@bIf Prince Howard heard what that soldier just said, he'd probably have him fired — or worse.\n@c0@"
  ja: "@a@b%a002020「そんな話が\n\tホルス王子に　知れたら\n\tクビに　なっちゃうよね。\n@c0@"
  ko: "@a@b%a002020: 그런 이야기가\n홀스 왕자의 귀에 들어가면\n잘리겠네.\n@c0@"
  sl: "@a@b%a002020：这话要是\n　　被荷尔斯王子听到的话，\n　　会被炒鱿鱼的哦。\n@c0@"
  tl: "@a@b%a002020：這話要是\n　　被荷爾斯王子聽到的話，\n　　會被炒魷魚的哦。\n@c0@"
251:
  en: "@a%0%a002030@bOnce the Prince has undergone the rite, he will be considered worthy of taking the throne.\n@c0@"
  ja: "@a@b%a002030「洗礼がすめば\n\tいずれ　ホルス王子が\n\tホルストックの王に……。\n@c0@"
  ko: "@a@b%a002030: 세례를 마치면\n언젠가 홀스 왕자가\n홀스톡의 왕으로......\n@c0@"
  sl: "@a@b%a002030：洗礼结束的话，\n　　荷尔斯王子总有一天\n　　会成为荷尔斯托克王……\n@c0@"
  tl: "@a@b%a002030：洗禮結束的話，\n　　荷爾斯王子總有一天\n　　會成為荷爾斯托克王……\n@c0@"
252:
  en: "@a%0%a002030@b...A worrying proposition, indeed...\n@c0@"
  ja: "@a@b%a002030「うーん　心配するのも\n\tムリのない　ことかも……。\n@c0@"
  ko: "@a@b%a002030: 으음, 걱정하는 것도\n무리는 아니겠군요......\n@c0@"
  sl: "@a@b%a002030：唔。担心也是\n　　情有可原的呢……\n@c0@"
  tl: "@a@b%a002030：唔。擔心也是\n　　情有可原的呢……\n@c0@"
253:
  en: "@a%0%a002050@bHavin' Howard for a King doesn't sound like a walk in the park to me either.\n@c0@"
  ja: "@a@b%a002050「どっちに　ころんでも\n\t頭のイタイ　問題なんですね。\n@c0@"
  ko: "@a@b%a002050: 어찌 되든\n골치 아픈 문제네요.\n@c0@"
  sl: "@a@b%a002050：不管怎样，\n　　这问题都很头疼呢。\n@c0@"
  tl: "@a@b%a002050：不管怎樣，\n　　這問題都很頭疼呢。\n@c0@"
254:
  en: "@a%0%a002000@bSo the rite's a mystery to everyone, aye?\n@c0@"
  ja: "@a@b%a002000「誰も　見たことが\n\tないのか……。\n@c0@"
  ko: "@a@b%a002000: 아무도 본 사람이\n없는 건가......\n@c0@"
  sl: "@a@b%a002000：谁都没见过啊……\n@c0@"
  tl: "@a@b%a002000：誰都沒見過啊……\n@c0@"
255:
  en: "@a%0%a002010@bThese rites differ from kingdom to kingdom. We'll just have to see this one for ourselves.\n@c0@"
  ja: "@a@b%a002010「場所によって\n\tぎしきにも　いろいろあるから\n\t見てみないと　わからないわね。\n@c0@"
  ko: "@a@b%a002010: 장소에 따라\n의식에도 여러 종류가 있으니까\n직접 보지 않으면 모르겠지.\n@c0@"
  sl: "@a@b%a002010：地方不同，\n　　仪式内容也会多种多样。\n　　不亲眼看看的话是不会知道的。\n@c0@"
  tl: "@a@b%a002010：地方不同，\n　　儀式內容也會多種多樣。\n　　不親眼看看的話是不會知道的。\n@c0@"
256:
  en: "@a%0%a002020@bThe cave's usually off limits to everyone except royalty...\n@c0@"
  ja: "@a@b%a002020「洞くつに　入れるのは\n\t王族だけ　だけど……\n@c0@"
  ko: "@a@b%a002020: 동굴에 들어갈 수 있는 건\n왕족뿐이지만......\n@c0@"
  sl: "@a@b%a002020：只有王家的人\n　　才可以进入那个洞窟……\n@c0@"
  tl: "@a@b%a002020：只有王家的人\n　　才可以進入那個洞窟……\n@c0@"
257:
  en: "@a%0%a002020@bBut if we tag along with the Prince, we can see the ceremony for ourselves! That's worth it...right? \n@c0@"
  ja: "@a@b%a002020「あたしたちは\n\t王子の　おともで　行けば\n\tぎしきを　見られるのよね！\n@c0@"
  ko: "@a@b%a002020: 우리는\n왕자의 호위를 하러 갈 거니까\n의식을 볼 수 있겠네!\n@c0@"
  sl: "@a@b%a002020：不过我们\n　　作为王子的陪同，\n　　应该能看到仪式吧！\n@c0@"
  tl: "@a@b%a002020：不過我們\n　　作為王子的陪同，\n　　應該能看到儀式吧！\n@c0@"
258:
  en: "@a%0%a002030@bOnly those accompanying the Prince are allowed to witness the rite.\n@c0@"
  ja: "@a@b%a002030「ゆいいつ　王子の\n\tおともを　した者だけが　その\n\tぎしきを　見られるのですが……\n@c0@"
  ko: "@a@b%a002030: 유일하게 왕자를\n호위한 자만이\n그 의식을 볼 수 있지만......\n@c0@"
  sl: "@a@b%a002030：只有\n　　陪同王子去的人\n　　才能看到那个仪式啊……\n@c0@"
  tl: "@a@b%a002030：只有\n　　陪同王子去的人\n　　才能看到那個儀式啊……\n@c0@"
259:
  en: "@a%0%a002030@bSo it is only logical that none of the soldiers are familiar with the ceremony.\n@c0@"
  ja: "@a@b%a002030「いつも　王子が\n\t逃げてしまうので　見た者が\n\tいないのですね……。\n@c0@"
  ko: "@a@b%a002030: 항상 왕자가\n도망쳐 버리니 본 자가\n없는 것이로군요......\n@c0@"
  sl: "@a@b%a002030：每次\n　　王子都会逃走，\n　　所以没有人看到过吧……\n@c0@"
  tl: "@a@b%a002030：每次\n　　王子都會逃走，\n　　所以沒有人看到過吧……\n@c0@"
260:
  en: "@a%0%a002050@bAre we ever goin' to see this rite for ourselves?\n@c0@"
  ja: "@a@b%a002050「その　ぎしきを\n\t私たちが　この目で　見られる\n\tときは　来るのでしょうか……。\n@c0@"
  ko: "@a@b%a002050: 그 의식을\n저희가 이 눈으로 볼 수 있는\n날이 오긴 할까요......\n@c0@"
  sl: "@a@b%a002050：我们会不会有\n　　看到的那天呢……\n@c0@"
  tl: "@a@b%a002050：我們會不會有\n　　看到的那天呢……\n@c0@"
261:
  en: "@a%0%a002000@bThe Prince's private escape hatch, aye? Hey, wasn't there an exit to outside the castle somewhere?\n@c0@"
  ja: "@a@b%a002000「王子が　脱出……か。\n\tそういや　どっか外に\n\t出るところが　あったっけな。\n@c0@"
  ko: "@a@b%a002000: 왕자가 탈출이라......\n그러고 보니 밖으로\n나갈 만한 곳이 있었던가?\n@c0@"
  sl: "@a@b%a002000：王子不会跑出去了吧。\n　　话说回来，好像是有地方\n　　通向外面呢。\n@c0@"
  tl: "@a@b%a002000：王子不會跑出去了吧。\n　　話說回來，好像是有地方\n　　通向外面呢。\n@c0@"
262:
  en: "@a%0%a002010@bSounds like he's spotted him coming down here before. Let's keep searching.\n@c0@"
  ja: "@a@b%a002010「この　地下通路に\n\t入ったのを　見たわけだから\n\tもう少し　探してみましょう。\n@c0@"
  ko: "@a@b%a002010: 이 지하 통로로\n들어오는 걸 봤으니까\n좀 더 찾아보자.\n@c0@"
  sl: "@a@b%a002010：既然他以前曾经\n　　被人看到来过这个地下密道，\n　　我们就再在这里好好找一下吧。\n@c0@"
  tl: "@a@b%a002010：既然他以前曾經\n　　被人看到來過這個地下密道，\n　　我們就再在這裡好好找一下吧。\n@c0@"
263:
  en: "@a%0%a002020@bThese corridors go all over the place... It'll be tough to check them all...\n@c0@"
  ja: "@a@b%a002020「この通路から\n\tいろんなところに　出られるから\n\t探すのたいへんだよね。\n@c0@"
  ko: "@a@b%a002020: 이 통로에서\n다양한 곳으로 나갈 수 있으니까\n찾는 게 힘들어.\n@c0@"
  sl: "@a@b%a002020：这个密道\n　　有好多个出口呢。\n　　找起来好费劲。\n@c0@"
  tl: "@a@b%a002020：這個密道\n　　有好多個出口呢。\n　　找起來好費勁。\n@c0@"
264:
  en: "@a%0%a002030@bLet's press on and keep searching for the Prince.\n@c0@"
  ja: "@a@b%a002030「とにかく\n\tかくごを　決めて\n\tさがして　まわりましょう！\n@c0@"
  ko: "@a@b%a002030: 어쨌든\n각오를 다지고\n찾아다녀 봅시다!\n@c0@"
  sl: "@a@b%a002030：总之，\n　　做好心理准备，\n　　好好找一找吧！\n@c0@"
  tl: "@a@b%a002030：總之，\n　　做好心理準備，\n　　好好找一找吧！\n@c0@"
265:
  en: "@a%0%a002050@bThis underground passage looks like a perfect escape route for the young prince.\n@c0@"
  ja: "@a@b%a002050「この　地下通路は\n\tホルス王子が　脱走するのには\n\t最高の　かんきょうですね。\n@c0@"
  ko: "@a@b%a002050: 이 지하 통로는\n홀스 왕자가 탈출하기에는\n최고의 환경이군요.\n@c0@"
  sl: "@a@b%a002050：这个地下通道\n　　非常适合\n　　荷尔斯王子逃走呢。\n@c0@"
  tl: "@a@b%a002050：這個地下通道\n　　非常適合\n　　荷爾斯王子逃走呢。\n@c0@"
266:
  en: "@a%0%a002000@bNo way he'd be in here...\n@c0@"
  ja: "@a@b%a002000「ここに\n\tいるわけないか……。\n@c0@"
  ko: "@a@b%a002000: 여기에\n있을 리가 없나......\n@c0@"
  sl: "@a@b%a002000：不在这里啊……\n@c0@"
  tl: "@a@b%a002000：不在這裡啊……\n@c0@"
267:
  en: "@a%0%a002010@bI doubt he'd make it this easy for us.\n@c0@"
  ja: "@a@b%a002010「ここで　見つかるなら\n\tくろうは　ないわね。\n@c0@"
  ko: "@a@b%a002010: 여기서 찾을 수 있다면\n고생할 일도 없을 거야.\n@c0@"
  sl: "@a@b%a002010：要是在这里找到的话，\n　　就不用再劳累了。\n@c0@"
  tl: "@a@b%a002010：要是在這裡找到的話，\n　　就不用再勞累了。\n@c0@"
268:
  en: "@a%0%a002020@bNo prince here...\n@c0@"
  ja: "@a@b%a002020「いないわね。\n@c0@"
  ko: "@a@b%a002020: 없네.\n@c0@"
  sl: "@a@b%a002020：不在呢。\n@c0@"
  tl: "@a@b%a002020：不在呢。\n@c0@"
269:
  en: "@a%0%a002030@bNo sign of Prince Howard...\n@c0@"
  ja: "@a@b%a002030「いませんねえ。\n@c0@"
  ko: "@a@b%a002030: 없군요.\n@c0@"
  sl: "@a@b%a002030：不在呢。\n@c0@"
  tl: "@a@b%a002030：不在呢。\n@c0@"
270:
  en: "@a%0%a002050@bThere's no pots here for him to hide in...\n@c0@"
  ja: "@a@b%a002050「ここに　つぼは\n\tなさそうですね……。\n@c0@"
  ko: "@a@b%a002050: 여기에 항아리는\n없어 보이네요......\n@c0@"
  sl: "@a@b%a002050：这里好像\n　　没有罐子呢……\n@c0@"
  tl: "@a@b%a002050：這裡好像\n　　沒有罐子呢……\n@c0@"
271:
  en: "@a%0%a002000@bWe'll just have to comb every inch of this place, I reckon.\n@c0@"
  ja: "@a@b%a002000「しつこく　くまなく\n\tさがすしか　ないな。\n@c0@"
  ko: "@a@b%a002000: 끈질기게 구석구석\n찾는 수밖에 없겠군.\n@c0@"
  sl: "@a@b%a002000：只能认认真真\n　　彻彻底底找一找了。\n@c0@"
  tl: "@a@b%a002000：只能認認真真\n　　徹徹底底找一找了。\n@c0@"
272:
  en: "@a%0%a002010@bDon't give up. We'll find that prince!\n@c0@"
  ja: "@a@b%a002010「きっと　見つかるわ。\n\tあきらめずに　さがしましょう。\n@c0@"
  ko: "@a@b%a002010: 꼭 찾을 수 있을 거야.\n포기하지 말고 찾아보자.\n@c0@"
  sl: "@a@b%a002010：一定能找到的。\n　　不要放弃，好好找一找吧。\n@c0@"
  tl: "@a@b%a002010：一定能找到的。\n　　不要放棄，好好找一找吧。\n@c0@"
273:
  en: "@a%0%a002020@bThis is getting really, really old.\n@c0@"
  ja: "@a@b%a002020「だんだん\n\tハラが　立ってくるわね……。\n@c0@"
  ko: "@a@b%a002020: 점점\n짜증이 나기 시작하는걸......\n@c0@"
  sl: "@a@b%a002020：我可要生气了啊……\n@c0@"
  tl: "@a@b%a002020：我可要生氣了啊……\n@c0@"
274:
  en: "@a%0%a002030@bJust one more push, and I sense we will find him.\n@c0@"
  ja: "@a@b%a002030「もう　ひといきの　ような\n\t気は　するんですけどねえ。\n@c0@"
  ko: "@a@b%a002030: 이제 얼마 안 남은 것\n같기도 한데 말이죠.\n@c0@"
  sl: "@a@b%a002030：总觉得\n　　还差一点就能找到了呢。\n@c0@"
  tl: "@a@b%a002030：總覺得\n　　還差一點就能找到了呢。\n@c0@"
275:
  en: "@a%0%a002050@bDoes anyone else get the feelin' that he's somewhere right under our noses?\n@c0@"
  ja: "@a@b%a002050「パッと　ふり向いたら\n\tちゃっかり　うしろに\n\tいるような　気がしません？\n@c0@"
  ko: "@a@b%a002050: 뒤로 확 돌아보면\n맹랑하게 뒤에 딱 붙어 있을 것 같은\n느낌 안 드십니까?\n@c0@"
  sl: "@a@b%a002050：要是忽然回头的话，\n　　他应该不会突然\n　　正好就出现在身后吧？\n@c0@"
  tl: "@a@b%a002050：要是忽然回頭的話，\n　　他應該不會突然\n　　正好就出現在身後吧？\n@c0@"
276:
  en: "@a%0%a002000@bI don't suppose you've got some kinda prince-detector, aye?\n@c0@"
  ja: "@a@b%a002000「ふう……。\n\tなかなか　見つからないな。\n@c0@"
  ko: "@a@b%a002000: 후우......\n정말 못 찾겠군.\n@c0@"
  sl: "@a@b%a002000：唔……\n　　找不到啊。\n@c0@"
  tl: "@a@b%a002000：唔……\n　　找不到啊。\n@c0@"
277:
  en: "@a%0%a002010@bThere's no way that the Prince came through here without being spotted.\n@c0@"
  ja: "@a@b%a002010「人の目に　ふれずに\n\t王子が　ここから　出て行く\n\tことは　どう　みても不可能。\n@c0@"
  ko: "@a@b%a002010: 남들 눈에 띄지 않고\n왕자가 여기서 밖으로 나가는 건\n아무리 봐도 불가능해.\n@c0@"
  sl: "@a@b%a002010：王子应该不可能\n　　从这里跑出去\n　　还不被人看见吧。\n@c0@"
  tl: "@a@b%a002010：王子應該不可能\n　　從這裡跑出去\n　　還不被人看見吧。\n@c0@"
278:
  en: "@a%0%a002010@bHe must be hiding somewhere in the castle.\n@c0@"
  ja: "@a@b%a002010「絶対　お城のどこかに\n\tかくれて　いるんだと　思うわ。\n@c0@"
  ko: "@a@b%a002010: 성안 어딘가에 반드시\n숨어 있을 거야.\n@c0@"
  sl: "@a@b%a002010：绝对还藏在\n　　城里的某个地方。\n@c0@"
  tl: "@a@b%a002010：絕對還藏在\n　　城裡的某個地方。\n@c0@"
279:
  en: "@a%0%a002020@bI can't shake the feeling that he's somewhere nearby...\n@c0@"
  ja: "@a@b%a002020「すぐ近くに\n\tひそんでいるような\n\t気は　するのよね。\n@c0@"
  ko: "@a@b%a002020: 바로 근처에\n숨어 있을 것 같은\n느낌이 드네.\n@c0@"
  sl: "@a@b%a002020：我觉得他\n　　就藏在这附近。\n@c0@"
  tl: "@a@b%a002020：我覺得他\n　　就藏在這附近。\n@c0@"
280:
  en: "@a%0%a002030@bIs there somewhere we've overlooked?\n@c0@"
  ja: "@a@b%a002030「なにか　見落としている\n\tことは　ないでしょうか……。\n@c0@"
  ko: "@a@b%a002030: 뭔가 빠뜨린 건\n없을까요......\n@c0@"
  sl: "@a@b%a002030：是不是有哪里\n　　看漏了呢……\n@c0@"
  tl: "@a@b%a002030：是不是有哪裡\n　　看漏了呢……\n@c0@"
281:
  en: "@a%0%a002050@bIt doesn't seem like we'll be headin' to that cave any time soon.\n@c0@"
  ja: "@a@b%a002050「いつになったら\n\t王子を　洗礼の洞くつに\n\tつれていけるやら……。\n@c0@"
  ko: "@a@b%a002050: 언제쯤\n왕자를 세례의 동굴로\n데려갈 수 있을지......\n@c0@"
  sl: "@a@b%a002050：到底什么时候\n　　才能带王子\n　　去洗礼洞窟啊……\n@c0@"
  tl: "@a@b%a002050：到底什麼時候\n　　才能帶王子\n　　去洗禮洞窟啊……\n@c0@"
282:
  en: "@a%0%a002000@bWonder what kind of monsters we're talkin' about with this cave, aye?\n@c0@"
  ja: "@a@b%a002000「洞くつの　まものって\n\tどんなヤツ　なんだろうな。\n@c0@"
  ko: "@a@b%a002000: 동굴 안의 마물은\n어떤 녀석들일까?\n@c0@"
  sl: "@a@b%a002000：洞窟里的魔物\n　　不知道是些什么样的家伙。\n@c0@"
  tl: "@a@b%a002000：洞窟裡的魔物\n　　不知道是些什麼樣的傢伙。\n@c0@"
283:
  en: "@a%0%a002010@b...I suppose he hasn't seen the Prince, then.\n@c0@"
  ja: "@a@b%a002010「……いずれにしても\n\tホルス王子を　みかけては\n\tいないみたいね。\n@c0@"
  ko: "@a@b%a002010: ......어쨌든\n홀스 왕자랑 마주치지는\n않았나 보네.\n@c0@"
  sl: "@a@b%a002010：……不管怎样，\n　　好像没有看到王子呢。\n@c0@"
  tl: "@a@b%a002010：……不管怎樣，\n　　好像沒有看到王子呢。\n@c0@"
284:
  en: "@a%0%a002020@bI'll bet that's the reason he's hiding from us in the first place.\n@c0@"
  ja: "@a@b%a002020「ホルス王子が\n\t洞くつに　いきたがらないのは\n\tそれが　理由だものね。\n@c0@"
  ko: "@a@b%a002020: 홀스 왕자가\n동굴에 가고 싶지 않아 하는 이유가\n바로 그거지.\n@c0@"
  sl: "@a@b%a002020：荷尔斯王子\n　　不想去洞窟，\n　　原因就在此呢。\n@c0@"
  tl: "@a@b%a002020：荷爾斯王子\n　　不想去洞窟，\n　　原因就在此呢。\n@c0@"
285:
  en: "@a%0%a002030@bIt doesn't seem as if the Prince has come this way...\n@c0@"
  ja: "@a@b%a002030「ふーむ。\n\t王子が　ここに来た　ようすは\n\tなさそうですね。\n@c0@"
  ko: "@a@b%a002030: 흐음.\n왕자가 이곳에 온 것 같지는\n않군요.\n@c0@"
  sl: "@a@b%a002030：唔。\n　　王子好像没有来这里呢。\n@c0@"
  tl: "@a@b%a002030：唔。\n　　王子好像沒有來這裡呢。\n@c0@"
286:
  en: "@a%0%a002050@bYou'll forgive old %a002050 if he's a little short on sympathy for the Prince right now.\n@c0@"
  ja: "@a@b%a002050「ホルス王子は\n\tふつうの人じゃ\n\tないと思います……。\n@c0@"
  ko: "@a@b%a002050: 홀스 왕자는\n보통 사람이\n아니잖습니까......\n@c0@"
  sl: "@a@b%a002050：我觉得\n　　荷尔斯王子不是普通人……\n@c0@"
  tl: "@a@b%a002050：我覺得\n　　荷爾斯王子不是普通人……\n@c0@"
287:
  en: "@a%0%a002000@bAye, thanks for the news flash!\n@c0@"
  ja: "@a@b%a002000「それだから\n\t困ってるんだよな！\n@c0@"
  ko: "@a@b%a002000: 그래서\n곤란한 거라고!\n@c0@"
  sl: "@a@b%a002000：就是因为这样\n　　俺很是心烦啊！\n@c0@"
  tl: "@a@b%a002000：就是因為這樣\n　　俺很是心煩啊！\n@c0@"
288:
  en: "@a%0%a002010@bHe doesn't seem to be in here.\n@c0@"
  ja: "@a@b%a002010「ここには\n\t来ていないみたいね。\n@c0@"
  ko: "@a@b%a002010: 여기에는\n안 왔나 봐.\n@c0@"
  sl: "@a@b%a002010：好像没到这里来呢。\n@c0@"
  tl: "@a@b%a002010：好像沒到這裡來呢。\n@c0@"
289:
  en: "@a%0%a002020@bUgh, I'm exhausted! This is driving me crazy!\n@c0@"
  ja: "@a@b%a002020「あー　つかれた！\n\tもー　やだ！\n@c0@"
  ko: "@a@b%a002020: 아~ 피곤해!\n이제 그만하고 싶어~!\n@c0@"
  sl: "@a@b%a002020：啊，累死了！\n　　不干了！\n@c0@"
  tl: "@a@b%a002020：啊，累死了！\n　　不幹了！\n@c0@"
290:
  en: "@a%0%a002030@bWe must continue with our search!\n@c0@"
  ja: "@a@b%a002030「とにかく　王子を\n\tさがしましょう。\n@c0@"
  ko: "@a@b%a002030: 아무튼 왕자를\n찾아봅시다.\n@c0@"
  sl: "@a@b%a002030：总之我们去找王子吧。\n@c0@"
  tl: "@a@b%a002030：總之我們去找王子吧。\n@c0@"
291:
  en: "@a%0%a002050@bLooks like he stopped issuing invitations to check out his armour collection.\n@c0@"
  ja: "@a@b%a002050「この　女の人の　ところで\n\t待っていたら　王子が　また\n\tスカートめくりに　来ませんかね。\n@c0@"
  ko: "@a@b%a002050: 이 여자분이 계신 곳에서\n기다리고 있다 보면 왕자가 또\n치마를 들추러 오지 않을까요?\n@c0@"
  sl: "@a@b%a002050：要是在\n　　这位女士这里等的话，\n　　王子会不会又来掀裙子呢？\n@c0@"
  tl: "@a@b%a002050：要是在\n　　這位女士這裡等的話，\n　　王子會不會又來掀裙子呢？\n@c0@"
292:
  en: "@a%0%a002000@bGood question, aye? How many times would ya guess? A hundred?\n@c0@"
  ja: "@a@b%a002000「何回目なんだろう\n\tじっさいの話。\n\t１００回くらいか？\n@c0@"
  ko: "@a@b%a002000: 진짜\n몇 번째일까?\n100번째 정도?\n@c0@"
  sl: "@a@b%a002000：说真的，\n　　这是第几次了啊。\n　　有１００次了吗？\n@c0@"
  tl: "@a@b%a002000：說真的，\n　　這是第幾次了啊。\n　　有１００次了嗎？\n@c0@"
293:
  en: "@a%0%a002010@bWell, this will be the last time!\n@c0@"
  ja: "@a@b%a002010「今回で　最後に\n\tしたいものよね。\n@c0@"
  ko: "@a@b%a002010: 이번이 마지막이\n되었으면 좋겠어.\n@c0@"
  sl: "@a@b%a002010：真希望这是\n　　最后一次了呢。\n@c0@"
  tl: "@a@b%a002010：真希望這是\n　　最後一次了呢。\n@c0@"
294:
  en: "@a%0%a002020@bIt'd probably make that soldier's day to know the Prince ran off before he even set off this time.\n@c0@"
  ja: "@a@b%a002020「今回は　まだ\n\t出発も　できてないよ！\n@c0@"
  ko: "@a@b%a002020: 이번엔 아직\n출발도 못 했다구!\n@c0@"
  sl: "@a@b%a002020：这回都还没有出发呢！\n@c0@"
  tl: "@a@b%a002020：這回都還沒有出發呢！\n@c0@"
295:
  en: "@a%0%a002030@bThe last thing we want is to help the Prince break his dubious record.\n@c0@"
  ja: "@a@b%a002030「へんな　記録の\n\tお手伝いは　したくない\n\tものですね……。\n@c0@"
  ko: "@a@b%a002030: 이상한 기록을\n추가해 드리고 싶지는\n않습니다......\n@c0@"
  sl: "@a@b%a002030：真希望他\n　　别帮我们记录这种\n　　奇怪的数据了……\n@c0@"
  tl: "@a@b%a002030：真希望他\n　　別幫我們記錄這種\n　　奇怪的數據了……\n@c0@"
296:
  en: "@a%0%a002050@bMaybe the Prince is makin' a notch in a tree trunk every time he dodges the rite.\n@c0@"
  ja: "@a@b%a002050「どこかの　木にでも\n\t王子は　にげた　かいすうを\n\tきざんだり　してませんかね。\n@c0@"
  ko: "@a@b%a002050: 왕자는 나무 같은 곳에다\n도망친 횟수를\n새겨 두고 그러는 거 아닙니까?\n@c0@"
  sl: "@a@b%a002050：没有在哪棵树上\n　　刻下王子逃走的次数吧。\n@c0@"
  tl: "@a@b%a002050：沒有在哪棵樹上\n　　刻下王子逃走的次數吧。\n@c0@"
297:
  en: "@a%0%a002000@bThat's a song I wouldn't mind singin'!\n@c0@"
  ja: "@a@b%a002000「その歌　オレたちも\n\tいっしょに　歌いたいぜ。\n\tまったく！\n@c0@"
  ko: "@a@b%a002000: 그 노래, 우리도\n함께 부르고 싶군.\n나 참!\n@c0@"
  sl: "@a@b%a002000：俺们也想\n　　跟你一起咏这首诗呢。\n　　真是的！\n@c0@"
  tl: "@a@b%a002000：俺們也想\n　　跟你一起詠這首詩呢。\n　　真是的！\n@c0@"
298:
  en: "@a%0%a002010@bExpressing one's feelings in song is an excellent stress-reliever.\n@c0@"
  ja: "@a@b%a002010「ホンネを　歌にして\n\tストレスかいしょう　ね。\n@c0@"
  ko: "@a@b%a002010: 본심을 노래로 만들어서\n스트레스를 풀고 있네.\n@c0@"
  sl: "@a@b%a002010：把真话写进诗里，\n　　压力会小很多呢。\n@c0@"
  tl: "@a@b%a002010：把真話寫進詩裡，\n　　壓力會小很多呢。\n@c0@"
299:
  en: "@a%0%a002020@bPretend this never happened? Why? That sounded like a surefire hit! \n@c0@"
  ja: "@a@b%a002020「聞かなかったことに？\n\tそこまでは　もう\n\tおぼえちゃったもんねー！\n@c0@"
  ko: "@a@b%a002020: 못 들은 걸로?\n거기까진 벌써\n다 외웠지롱~!\n@c0@"
  sl: "@a@b%a002020：当没听见？\n　　我们都已经背下来了哦！\n@c0@"
  tl: "@a@b%a002020：當沒聽見？\n　　我們都已經背下來了哦！\n@c0@"
300:
  en: "@a%0%a002030@bI'd very much like to hear how that ballad continues...\n@c0@"
  ja: "@a@b%a002030「最後まで　ちゃんと\n\t聞きたい　くらいですね……。\n@c0@"
  ko: "@a@b%a002030: 끝까지 제대로\n듣고 싶을 정도로군요......\n@c0@"
  sl: "@a@b%a002030：真想听到最后呢……\n@c0@"
  tl: "@a@b%a002030：真想聽到最後呢……\n@c0@"
301:
