0:
  en: "@a%0%a002000@bGreat. So first we gotta find the royal brat, aye?\n@c0@"
  ja: "@a@b%a002000「やれやれ……\n\tいきなり　王子の　そうさくかよ。\n@c0@"
  ko: "@a@b%a002000: 이런......\n갑자기 왕자를 찾으라니.\n@c0@"
  sl: "@a@b%a002000：哎呀……\n　　一来就让咱找王子。\n@c0@"
  tl: "@a@b%a002000：哎呀……\n　　一來就讓咱找王子。\n@c0@"
1:
  en: "@a%0%a002000@bAh, well. It'll give us a chance to learn our way around the castle, I guess.\n@c0@"
  ja: "@a@b%a002000「まあいい。\n\tお城の中を　見学がてら\n\tちょっと　回ってみるか。\n@c0@"
  ko: "@a@b%a002000: 어쩔 수 없지.\n성 내부 구경이라도 할 겸\n돌아다녀 볼까?\n@c0@"
  sl: "@a@b%a002000：唉，算了，\n　　就当在城里参观，\n　　去转一转好了。\n@c0@"
  tl: "@a@b%a002000：唉，算了，\n　　就當在城裡參觀，\n　　去轉一轉好了。\n@c0@"
2:
  en: "@a%0%a002010@bI get the feeling that this is going to be an incredibly annoying mission...\n@c0@"
  ja: "@a@b%a002010「もしかして　私たち\n\tとてつもなく　やっかいな仕事を\n\tひきうけて　しまったのかしら……。\n@c0@"
  ko: "@a@b%a002010: 혹시 우리\n엄청나게 귀찮은 일을\n수락해 버린 걸까......\n@c0@"
  sl: "@a@b%a002010：难道说\n　　我们接了个\n　　十分棘手的工作……\n@c0@"
  tl: "@a@b%a002010：難道說\n　　我們接了個\n　　十分棘手的工作……\n@c0@"
3:
  en: "@a%0%a002020@bWell, no turning back now! Let's go find us a prince!\n@c0@"
  ja: "@a@b%a002020「のりかかった　船よ！\n\t王子さまを　さがしましょ！\n@c0@"
  ko: "@a@b%a002020: 이제 와서 그만둘 수도 없잖아!\n왕자를 찾아보자!\n@c0@"
  sl: "@a@b%a002020：箭在弦上不得不发！\n　　去找王子殿下吧！\n@c0@"
  tl: "@a@b%a002020：箭在弦上不得不發！\n　　去找王子殿下吧！\n@c0@"
4:
  en: "@a%0%a002030@bWe can't very well accompany the Prince to the cave if we can't find him. Let's go!\n@c0@"
  ja: "@a@b%a002030「本人を　見つけないと\n\t洞くつに　つれていきようが\n\tないですね……　さがしましょう！\n@c0@"
  ko: "@a@b%a002030: 당사자를 찾지 못하면\n동굴로 데려갈 수가\n없지요...... 찾아봅시다!\n@c0@"
  sl: "@a@b%a002030：要是不找到王子本人，\n　　就没办法带他去洞窟了……\n　　去找吧！\n@c0@"
  tl: "@a@b%a002030：要是不找到王子本人，\n　　就沒辦法帶他去洞窟了……\n　　去找吧！\n@c0@"
5:
  en: "@a%0%a002050@bI heard the Chancellor use the words ‘once again’...\n@c0@"
  ja: "@a@b%a002050「さっき　あの大臣さん　\n\tまたしても！　とか\n\t言ってましたよね。\n@c0@"
  ko: "@a@b%a002050: 아까 저 대신은\n왕자가 또 사라졌다고\n했죠.\n@c0@"
  sl: "@a@b%a002050：刚才那个大臣\n　　是不是说了个又字啊。\n@c0@"
  tl: "@a@b%a002050：剛才那個大臣\n　　是不是說了個又字啊。\n@c0@"
6:
  en: "@a%0%a002050@bIt sounds like Prince Howard might pull this disappearin' act on a regular basis.\n@c0@"
  ja: "@a@b%a002050「そんなに　しょっちゅう\n\tいなくなるんですかね。\n\tなんだか　不安だなあ……。\n@c0@"
  ko: "@a@b%a002050: 그렇게 자주\n사라지는 걸까요?\n왠지 불안하군요......\n@c0@"
  sl: "@a@b%a002050：经常这样\n　　不见踪影啊。\n　　好不安……\n@c0@"
  tl: "@a@b%a002050：經常這樣\n　　不見蹤影啊。\n　　好不安……\n@c0@"
7:
  en: "@a%0%a002000@bAlright, let's get searchin' for this fella!\n@c0@"
  ja: "@a@b%a002000「さーてと。\n\tそれじゃあ　探しにいくか！\n@c0@"
  ko: "@a@b%a002000: 자.\n그럼 찾으러 가 볼까!\n@c0@"
  sl: "@a@b%a002000：那咱就去找他吧！\n@c0@"
  tl: "@a@b%a002000：那咱就去找他吧！\n@c0@"
8:
  en: "@a%0%a002010@bWe don't know the castle half as well as the Prince, which will make finding him difficult.\n@c0@"
  ja: "@a@b%a002010「私たちは　お城のことを\n\t王子のようには　よく知らないから\n\t見つけるのは　ちょっと大変かも。\n@c0@"
  ko: "@a@b%a002010: 우리는 이 성을\n왕자만큼은 잘 모르니까\n찾기 힘들지도 몰라.\n@c0@"
  sl: "@a@b%a002010：王子比我们\n　　更熟悉这座城，\n　　找他可能会有点困难。\n@c0@"
  tl: "@a@b%a002010：王子比我們\n　　更熟悉這座城，\n　　找他可能會有點困難。\n@c0@"
9:
  en: "@a%0%a002010@bLet's ask around and keep our eyes peeled.\n@c0@"
  ja: "@a@b%a002010「お城の人から\n\tいろいろと　話を聞いて\n\tしっかり　探しましょう。\n@c0@"
  ko: "@a@b%a002010: 성에 있는 사람들에게\n정보를 얻으면서\n꼼꼼하게 찾아보자.\n@c0@"
  sl: "@a@b%a002010：向城里的人\n　　多打听点消息，\n　　好好找一找吧。\n@c0@"
  tl: "@a@b%a002010：向城裡的人\n　　多打聽點消息，\n　　好好找一找吧。\n@c0@"
10:
  en: "@a%0%a002020@bI hope this isn't a sign of things to come...\n@c0@"
  ja: "@a@b%a002020「先が\n\t思いやられるわ……。\n@c0@"
  ko: "@a@b%a002020: 앞으로가\n걱정돼......\n@c0@"
  sl: "@a@b%a002020：接下来会很辛苦吧……\n@c0@"
  tl: "@a@b%a002020：接下來會很辛苦吧……\n@c0@"
11:
  en: "@a%0%a002030@bWhere shall we begin our search?\n@c0@"
  ja: "@a@b%a002030「さて　まずは\n\tどこから　行きましょうか。\n@c0@"
  ko: "@a@b%a002030: 자, 우선\n어디부터 가 볼까요?\n@c0@"
  sl: "@a@b%a002030：那先从哪找起呢？\n@c0@"
  tl: "@a@b%a002030：那先從哪找起呢？\n@c0@"
12:
  en: "@a%0%a002050@b(sniff) Old %a002050 can't get a whiff of that Prince!\n@c0@"
  ja: "@a@b%a002050「くんくん……。\n\tさて　王子は　どこに？\n@c0@"
  ko: "@a@b%a002050: 킁킁......\n왕자님은 어디로?\n@c0@"
  sl: "@a@b%a002050：嗯嗯……\n　　王子去哪里了呢？\n@c0@"
  tl: "@a@b%a002050：嗯嗯……\n　　王子去哪里了呢？\n@c0@"
13:
  en: "@a%0%a002000@bWhew... We haven't even started our mission yet, and I'm exhausted already.\n@c0@"
  ja: "@a@b%a002000「ふう……\n\t本題の前に　王子さがしで\n\tつかれちまったな。\n@c0@"
  ko: "@a@b%a002000: 후......\n일이 시작되기도 전에 왕자를 찾느라\n지쳐 버렸군.\n@c0@"
  sl: "@a@b%a002000：唔……\n　　还没开始干正事，\n　　就被找王子这事累垮了啊。\n@c0@"
  tl: "@a@b%a002000：唔……\n　　還沒開始幹正事，\n　　就被找王子這事累垮了啊。\n@c0@"
14:
  en: "@a%0%a002010@bAt least the Prince showed up here when he was supposed to.\n@c0@"
  ja: "@a@b%a002010「王子　ちゃんと\n\tこちらに　来ていたわね。\n@c0@"
  ko: "@a@b%a002010: 왕자, 어디로 도망치지 않고\n이리로 와 있었네.\n@c0@"
  sl: "@a@b%a002010：王子的确是\n　　来这里了吧。\n@c0@"
  tl: "@a@b%a002010：王子的確是\n　　來這裡了吧。\n@c0@"
15:
  en: "@a%0%a002020@bI really, REALLY hope this isn't a sign of things to come...\n@c0@"
  ja: "@a@b%a002020「なんだか　本当に\n\t先が　思いやられるんですけど。\n@c0@"
  ko: "@a@b%a002020: 왠지 진짜로\n앞으로가 걱정되는데 어쩌지?\n@c0@"
  sl: "@a@b%a002020：感觉接下来真的\n　　会很辛苦呢。\n@c0@"
  tl: "@a@b%a002020：感覺接下來真的\n　　會很辛苦呢。\n@c0@"
16:
  en: "@a%0%a002030@bIt seems it is time to get started.\n@c0@"
  ja: "@a@b%a002030「ようやく　ふりだし\n\tという　ところですか。\n@c0@"
  ko: "@a@b%a002030: 이제 겨우 처음으로\n돌아왔군요.\n@c0@"
  sl: "@a@b%a002030：总算是\n　　迈出第一步了呢。\n@c0@"
  tl: "@a@b%a002030：總算是\n　　邁出第一步了呢。\n@c0@"
17:
  en: "@a%0%a002050@bThe Prince changes his tune when he's in front of his old man, doesn't he?\n@c0@"
  ja: "@a@b%a002050「王子は　王さまの　前では\n\tおとなしそうですねえ。\n@c0@"
  ko: "@a@b%a002050: 왕자는 왕 앞에서는\n얌전하네요.\n@c0@"
  sl: "@a@b%a002050：王子在国王陛下面前\n　　还挺老实的呢。\n@c0@"
  tl: "@a@b%a002050：王子在國王陛下面前\n　　還挺老實的呢。\n@c0@"
18:
  en: "@a%0%a002000@bLet's have a chat with the Prince later, alright?\n@c0@"
  ja: "@a@b%a002000「まあ　王子とは\n\tいずれ　きちんと\n\t話を　しようぜ。\n@c0@"
  ko: "@a@b%a002000: 뭐, 왕자와는\n언젠가 제대로\n이야기를 해 보자고.\n@c0@"
