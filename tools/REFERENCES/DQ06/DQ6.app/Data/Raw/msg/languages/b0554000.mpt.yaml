  ko: "@a@b%a002010: 발견하면 우리가\n동굴로 데려가야\n하니까.\n@c0@"
  sl: "@a@b%a002010：要是找到他的话，\n　　按计划我们\n　　还要带他进洞的。\n@c0@"
  tl: "@a@b%a002010：要是找到他的話，\n　　按計劃我們\n　　還要帶他進洞的。\n@c0@"
101:
  en: "@a%0%a002020@bI guess we're not the only ones the Prince is ducking out on.\n@c0@"
  ja: "@a@b%a002020「どこに　いるのか\n\tこっちが　聞きたいのに。\n@c0@"
  ko: "@a@b%a002020: 어디 있는지\n우리가 묻고 싶다구.\n@c0@"
  sl: "@a@b%a002020：我们还想问\n　　他在哪呢。\n@c0@"
  tl: "@a@b%a002020：我們還想問\n　　他在哪呢。\n@c0@"
102:
  en: "@a%0%a002030@bIf the Prince routinely eschews weapon training, we cannot rely on his fighting skills.\n@c0@"
  ja: "@a@b%a002030「王子に　剣のうでまえは\n\tきたい　できない……と　まあ\n\tそのことだけは　わかりました。\n@c0@"
  ko: "@a@b%a002030: 왕자에게 검술은\n기대할 수 없겠는걸요......\n그것만큼은 잘 알겠습니다.\n@c0@"
  sl: "@a@b%a002030：是说不要指望\n　　王子的剑术了吧。\n　　这我倒是知道。\n@c0@"
  tl: "@a@b%a002030：是說不要指望\n　　王子的劍術了吧。\n　　這我倒是知道。\n@c0@"
103:
  en: "@a%0%a002050@bWell, askin' him turned out to be a waste of time.\n@c0@"
  ja: "@a@b%a002050「この人に　聞いたのは\n\tまるっきり　ムダでしたね。\n@c0@"
  ko: "@a@b%a002050: 이 사람한테 물은 건\n정말 도움이 안 됐네요.\n@c0@"
  sl: "@a@b%a002050：问这人根本没用啊。\n@c0@"
  tl: "@a@b%a002050：問這人根本沒用啊。\n@c0@"
104:
  en: "@a%0%a002000@bC'mon, %a000090! Back to the King!\n@c0@"
  ja: "@a@b%a002000「さあ　%a000090\n\t王さまの　ところに　もどろうぜ。\n@c0@"
  ko: "@a@b%a002000: 자, %a000090.\n왕이 계신 곳으로 돌아가자.\n@c0@"
  sl: "@a@b%a002000：%a000090，\n　　回国王陛下那里去吧。\n@c0@"
  tl: "@a@b%a002000：%a000090，\n　　回國王陛下那裡去吧。\n@c0@"
105:
  en: "@a%0%a002010@bHoward must have gone straight back to the King.\n@c0@"
  ja: "@a@b%a002010「ホルス王子は\n\tあのまま　王さまの部屋に\n\t行ったんじゃない？\n@c0@"
  ko: "@a@b%a002010: 홀스 왕자는\n그대로 왕이 계신 곳으로\n간 게 아닐까?\n@c0@"
  sl: "@a@b%a002010：荷尔斯王子\n　　应该直接回\n　　国王陛下的房间了吧？\n@c0@"
  tl: "@a@b%a002010：荷爾斯王子\n　　應該直接回\n　　國王陛下的房間了吧？\n@c0@"
106:
  en: "@a%0%a002020@bAaand back to the King again!\n@c0@"
  ja: "@a@b%a002020「ねえ　とりあえず\n\t王さまのところに　もどろうよ！\n@c0@"
  ko: "@a@b%a002020: 저기, 일단은\n왕이 계신 곳으로 돌아가자!\n@c0@"
  sl: "@a@b%a002020：总之先回\n　　国王陛下那里去吧！\n@c0@"
  tl: "@a@b%a002020：總之先回\n　　國王陛下那裡去吧！\n@c0@"
107:
  en: "@a%0%a002030@bSo it seems Prince Howard didn't come this way.\n@c0@"
  ja: "@a@b%a002030「ホルス王子は\n\tあれから　こちらには\n\t来てないと　いうことですね。\n@c0@"
  ko: "@a@b%a002030: 홀스 왕자는\n그 후로 이곳에는\n오지 않았나 봅니다.\n@c0@"
  sl: "@a@b%a002030：也就是说\n　　荷尔斯王子那之后\n　　就没到这里来过了。\n@c0@"
  tl: "@a@b%a002030：也就是說\n　　荷爾斯王子那之後\n　　就沒到這裡來過了。\n@c0@"
108:
  en: "@a%0%a002050@b%0%a000090, I think we should make seein' the King our top priority.\n@c0@"
  ja: "@a@b%a002050「%a000090さん\n\tいまは　王さまの　ところに\n\t行くのが　先かと。\n@c0@"
  ko: "@a@b%a002050: %a000090 님,\n지금은 왕이 계신 곳으로\n가는 게 먼저입니다.\n@c0@"
  sl: "@a@b%a002050：%a000090，\n　　现在要先去\n　　国王陛下那里。\n@c0@"
  tl: "@a@b%a002050：%a000090，\n　　現在要先去\n　　國王陛下那裡。\n@c0@"
109:
  en: "@a%0%a002000@bI reckon he ain't back there. That fancy fella would tell us if he was.\n@c0@"
  ja: "@a@b%a002000「こっちじゃ　ないな。\n\t彼がもし　王子のいばしょを\n\t知ってたら　教えてくれるだろう。\n@c0@"
  ko: "@a@b%a002000: 이쪽이 아닌 것 같군.\n이 사람은 왕자가 있는 곳을\n알았다면 가르쳐 줬을걸.\n@c0@"
  sl: "@a@b%a002000：不在这里啊。\n　　他要是知道王子在哪的话，\n　　应该会告诉咱吧。\n@c0@"
  tl: "@a@b%a002000：不在這裡啊。\n　　他要是知道王子在哪的話，\n　　應該會告訴咱吧。\n@c0@"
110:
  en: "@a%0%a002010@bA lovely composition, but it doesn't get us any closer to locating the Prince.\n@c0@"
  ja: "@a@b%a002010「こんな　はじのほうまで\n\t探したのに……いないわねえ。\n@c0@"
  ko: "@a@b%a002010: 이렇게 구석까지\n찾아봤지만...... 없는걸.\n@c0@"
  sl: "@a@b%a002010：这种角落都找了，\n　　还是没有找到啊。\n@c0@"
  tl: "@a@b%a002010：這種角落都找了，\n　　還是沒有找到啊。\n@c0@"
111:
  en: "@a%0%a002020@bI'd rather hear a poem about where the Prince likes to hide...\n@c0@"
  ja: "@a@b%a002020「王子の　いばしょを\n\t詩にして　ほしいなあ……。\n@c0@"
  ko: "@a@b%a002020: 왕자가 있는 곳을\n노래로 만들어 줬으면 좋겠어......\n@c0@"
  sl: "@a@b%a002020：真希望他能把\n　　王子在哪里写到诗里啊……\n@c0@"
  tl: "@a@b%a002020：真希望他能把\n　　王子在哪裡寫到詩裡啊……\n@c0@"
112:
  en: "@a%0%a002030@bA poet's job is more difficult than I had imagined.\n@c0@"
  ja: "@a@b%a002030「詩人の　仕事も\n\tいろいろ大変な　ようですね。\n@c0@"
  ko: "@a@b%a002030: 시인이 하는 일도\n이래저래 힘든 일이 많겠군요.\n@c0@"
  sl: "@a@b%a002030：当诗人\n　　也不容易啊。\n@c0@"
  tl: "@a@b%a002030：當詩人\n　　也不容易啊。\n@c0@"
113:
  en: "@a%0%a002050@bWe've got no time for rhyme!\n@c0@"
  ja: "@a@b%a002050「歌ってる　場合じゃ\n\tないですよ！\n@c0@"
  ko: "@a@b%a002050: 노래나 부르고 있을 때가\n아니라구요!\n@c0@"
  sl: "@a@b%a002050：现在不是咏诗的时候哦！\n@c0@"
  tl: "@a@b%a002050：現在不是詠詩的時候哦！\n@c0@"
114:
  en: "@a%0%a002000@bC'mon, %a000090! Back to the King!\n@c0@"
  ja: "@a@b%a002000「さあ　%a000090\n\t王さまの　ところに　もどろうぜ。\n@c0@"
  ko: "@a@b%a002000: 자, %a000090.\n왕이 계신 곳으로 돌아가자.\n@c0@"
  sl: "@a@b%a002000：%a000090，\n　　回国王陛下那里去吧。\n@c0@"
  tl: "@a@b%a002000：%a000090，\n　　回國王陛下那裡去吧。\n@c0@"
