  tl: "@a@b%a002000：還要有證據\n　　讓鎮上的人們相信才行啊……\n@c0@"
60:
  en: "@a%0%a002010@bIt seems we're the only ones whose minds aren't affected by the lagoon...\n@c0@"
  ja: "@a@b%a002010「あの　温泉につかって\n\t正気のままで　いられるのは\n\tどうやら　私たち　だけのようね。\n@c0@"
  ko: "@a@b%a002010: 그 온천에 들어가서\n제정신인 건\n우리밖에 없는 것 같아.\n@c0@"
