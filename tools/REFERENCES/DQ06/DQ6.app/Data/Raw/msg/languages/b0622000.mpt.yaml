  sl: "@a@b%a002000：即使找到了\n　　回去原来世界的路……\n@c0@"
  tl: "@a@b%a002000：即使找到了\n　　回去原來世界的路……\n@c0@"
59:
  en: "@a%0%a002000@bNow we've just gotta prove it to all the townspeople, aye?\n@c0@"
  ja: "@a@b%a002000「町の　みんなに\n\t信じてもらうには　何かの\n\tしょうこが　ないとな……。\n@c0@"
  ko: "@a@b%a002000: 마을 사람들이\n믿게 하려면\n뭔가 증거가 필요해......\n@c0@"
