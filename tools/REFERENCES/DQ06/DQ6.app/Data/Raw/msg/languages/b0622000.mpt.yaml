  tl: "@a@b%a002010：泡過那個溫泉\n　　卻能不受影響的\n　　大概只有我們而已。\n@c0@"
61:
  en: "@a%0%a002010@bWhich is all the more reason for us to stop talking and take action!\n@c0@"
