  ja: "@a@b%a002040「とりあえず　いろいろ\n\tじたばたしてみれば　おのずと\n\t道も　ひらけるんじゃ　ないか？\n@c0@"
  ko: "@a@b%a002040: 아무튼 이래저래\n바둥거리다 보면 저절로\n길도 열리지 않을까?\n@c0@"
  sl: "@a@b%a002040：总之，先把能做的事情\n　　全都试过一遍，\n　　方法自然会出现的吧？\n@c0@"
  tl: "@a@b%a002040：總之，先把能做的事情\n　　全都試過一遍，\n　　方法自然會出現的吧？\n@c0@"
44:
  en: "@a%0%a002060@b(snarl) %0%a002060 not want...lose hope... Not want...die here... (spit)\n@c0@"
  ja: "@a@b%a002060「生きる…希望…だいじ。\n\t私…こんなところで…死なない。\n@c0@"
  ko: "@a@b%a002060: 살고자 하는...희망...중요하다.\n나...이런 곳에서...죽지 않는다.\n@c0@"
  sl: "@a@b%a002060：活下去……希望……很重要。\n　　我……不会……死在这里。\n@c0@"
  tl: "@a@b%a002060：活下去……希望……很重要。\n　　我……不會……死在這裡。\n@c0@"
45:
  en: "@a%0%a002070@bBoing boing...\n@c0@"
  ja: "@a@b%a002070「プルルン　プキッ！\n@c0@"
  ko: "@a@b%a002070: 뽀요용 뽀끼!\n@c0@"
  sl: "@a@b%a002070：噗噜哩，噗叽！\n@c0@"
  tl: "@a@b%a002070：噗嚕哩，噗嘰！\n@c0@"
46:
  en: "@a%0%a002000@bWell, at least the priest believes us...\n@c0@"
  ja: "@a@b%a002000「オレたちのこと\n\tとりあえず　この　神父さんは\n\t信じて　くれたようだが……\n@c0@"
  ko: "@a@b%a002000: 아무튼 우리 이야길\n이 신부님은\n믿어준 모양이지만......\n@c0@"
  sl: "@a@b%a002000：这个神父似乎\n　　暂时相信了咱们的话……\n@c0@"
  tl: "@a@b%a002000：這個神父似乎\n　　暫時相信了咱們的話……\n@c0@"
47:
  en: "@a%0%a002000@bWe're gonna need some solid evidence to convince the rest of these sad sacks, though.\n@c0@"
  ja: "@a@b%a002000「たしかに　町じゅうの\n\t人たちに　信じてもらうには\n\t何か　しょうこが　必要だな。\n@c0@"
  ko: "@a@b%a002000: 온 마을 사람들이\n믿게 하려면\n뭔가 증거가 필요해.\n@c0@"
