  ja: "@a@b%a002030「この人の　ようすが\n\t温泉の　せいだとすると\n\tおそろしいほどの　作用ですね。\n@c0@"
  ko: "@a@b%a002030: 이 사람 상태가\n온천 탓이라고 한다면\n무시무시할 정도의 효과로군요.\n@c0@"
  sl: "@a@b%a002030：如果真的是温泉\n　　把这个人变成了这副样子，\n　　那还真是挺可怕的。\n@c0@"
  tl: "@a@b%a002030：如果真的是溫泉\n　　把這個人變成了這副樣子，\n　　那還真是挺可怕的。\n@c0@"
32:
  en: "@a%0%a002050@bMaybe he just overdosed on the lagoon.\n@c0@"
  ja: "@a@b%a002050「温泉に　つかりすぎて\n\tただ　のぼせてる　わけじゃ\n\tないんですよね　この人……。\n@c0@"
  ko: "@a@b%a002050: 온천에 너무 오래 있어서\n그저 현기증이 나는 게\n아니었군요, 이 사람......\n@c0@"
  sl: "@a@b%a002050：这人不应该只是温泉泡多了，\n　　脑子有点进水而已吧……\n@c0@"
  tl: "@a@b%a002050：這人不應該只是溫泉泡多了，\n　　腦子有點進水而已吧……\n@c0@"
33:
  en: "@a%0%a002040@bThere's something about that lagoon...\n@c0@"
  ja: "@a@b%a002040「あの　温泉には\n\t人を　これだけ　ダメにする\n\tチカラが　あるって　ことだな。\n@c0@"
  ko: "@a@b%a002040: 그 온천에는\n사람을 이렇게 망치는\n힘이 있다는 것이로군.\n@c0@"
  sl: "@a@b%a002040：那个温泉居然会\n　　把人变得这么没用啊。　\n@c0@"
  tl: "@a@b%a002040：那個溫泉居然會\n　　把人變得這麼沒用啊。　\n@c0@"
34:
  en: "@a%0%a002060@b(snarl) We went...lagoon already... (slobber)\n@c0@"
  ja: "@a@b%a002060「私…たち…もう\n\t…温泉…行った。\n@c0@"
  ko: "@a@b%a002060: 우리...는...벌써\n...온천...갔다.\n@c0@"
  sl: "@a@b%a002060：我们……已经……\n　　去过了……温泉。\n@c0@"
  tl: "@a@b%a002060：我們……已經……\n　　去過了……溫泉。\n@c0@"
35:
  en: "@a%0%a002070@b(slurp) Boing.\n@c0@"
  ja: "@a@b%a002070「ブルブルルッ！\n@c0@"
  ko: "@a@b%a002070: 보용 보요용!\n@c0@"
  sl: "@a@b%a002070：噗噜噗噜噜！\n@c0@"
  tl: "@a@b%a002070：噗嚕噗嚕嚕！\n@c0@"
36:
  en: "@a%0%a002000@bWho does she think she's talkin' to? No way Mortamor's gonna be the boss o' me!\n@c0@"
  ja: "@a@b%a002000「じょうだん　じゃない！\n\tオレは　ぜったいに　大魔王の\n\t思うようには　ならないぜ！\n@c0@"
  ko: "@a@b%a002000: 젠장!\n난 절대 대마왕이\n제멋대로 하게 두지 않을 거야!\n@c0@"
  sl: "@a@b%a002000：开什么玩笑！\n　　俺绝对不会让\n　　大魔王如愿的！\n@c0@"
  tl: "@a@b%a002000：開什麼玩笑！\n　　俺絕對不會讓\n　　大魔王如願的！\n@c0@"
37:
  en: "@a%0%a002000@bSure, I feel a little run down now, but I'm sure it's just a bug or somethin'.\n@c0@"
  ja: "@a@b%a002000「たしかに　何となく\n\tチカラが　入らないが……\n\tどうってこと　ないさ！\n@c0@"
  ko: "@a@b%a002000: 분명 몸에\n힘이 들어가진 않지만......\n그딴 건 나랑 상관없어!\n@c0@"
  sl: "@a@b%a002000：虽然确实觉得\n　　有些使不上力气……\n　　不过这都不是什么问题！\n@c0@"
  tl: "@a@b%a002000：雖然確實覺得\n　　有些使不上力氣……\n　　不過這都不是什麼問題！\n@c0@"
38:
  en: "@a%0%a002010@bIf we lose the motivation that brought us this far, it'll all be over for us.\n@c0@"
  ja: "@a@b%a002010「自力で　ここへ来た\n\t私たちが　絶望してしまったら\n\tまさに　おわりね。\n@c0@"
  ko: "@a@b%a002010: 자기 힘으로 여기까지 온\n우리가 절망해 버린다면\n그야말로 끝이야.\n@c0@"
  sl: "@a@b%a002010：我们这些靠自身力量\n　　来到这里的人都变绝望的话，\n　　一切就全完了。\n@c0@"
  tl: "@a@b%a002010：我們這些靠自身力量\n　　來到這裡的人都變絕望的話，\n　　一切就全完了。\n@c0@"
39:
  en: "@a%0%a002010@bWe have to escape from this world, and soon.\n@c0@"
  ja: "@a@b%a002010「まず　私たちが\n\tこの世界から　ぬけ出せるよう\n\tがんばってみましょう。\n@c0@"
  ko: "@a@b%a002010: 우선 우리가\n이 세계에서 탈출할 수 있도록\n힘을 내 보자.\n@c0@"
  sl: "@a@b%a002010：我们必须想办法\n　　先离开这个世界才行。\n@c0@"
  tl: "@a@b%a002010：我們必須想辦法\n　　先離開這個世界才行。\n@c0@"
40:
  en: "@a%0%a002020@bSo we're gonna be slaves to Mortamor soon if things don't change?\n@c0@"
  ja: "@a@b%a002020「ようするに\n\tこのままでは　大魔王の\n\t思うつぼってことよね。\n@c0@"
  ko: "@a@b%a002020: 요컨대\n이대로 있다간 대마왕의 계략에\n빠지는 거란 말이네.\n@c0@"
  sl: "@a@b%a002020：总之，\n　　这样下去就正中\n　　大魔王的下怀了吧。\n@c0@"
  tl: "@a@b%a002020：總之，\n　　這樣下去就正中\n　　大魔王的下懷了吧。\n@c0@"
41:
  en: "@a%0%a002020@bUgh! That can't happen! We have to do something, %a000090!\n@c0@"
  ja: "@a@b%a002020「くやしー！\n\t何とか　しないと　%a000090！\n@c0@"
  ko: "@a@b%a002020: 아~ 분해 죽겠어!\n어떻게 좀 해봐, %a000090!\n@c0@"
  sl: "@a@b%a002020：我不甘心！\n　　%a000090，快想点办法啊！\n@c0@"
  tl: "@a@b%a002020：我不甘心！\n　　%a000090，快想點辦法啊！\n@c0@"
42:
  en: "@a%0%a002050@bJust listenin' to her could make us lose hope of ever returnin' home.\n@c0@"
  ja: "@a@b%a002050「彼女の　お話を\n\tうかがっていたら　私たちも\n\tもう　帰れないような　気が！\n@c0@"
  ko: "@a@b%a002050: 그녀의 이야기를\n듣다 보니 우리도\n돌아갈 수 없다는 생각이 들어요!\n@c0@"
  sl: "@a@b%a002050：在听过了她说的话之后，\n　　感觉我们可能\n　　也无法回到原来的世界了。\n@c0@"
  tl: "@a@b%a002050：在聽過了她說的話之後，\n　　感覺我們可能\n　　也無法回到原來的世界了。\n@c0@"
43:
