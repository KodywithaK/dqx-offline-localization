49:
  en: "@a%0%a002010@bI'll believe that we're able to come and go from this world once we manage to make it out of here!\n@c0@"
  ja: "@a@b%a002010「私たちが　外の世界と\n\t行き来　できることを　証明するには\n\tまず　ここから　出られないとね！\n@c0@"
