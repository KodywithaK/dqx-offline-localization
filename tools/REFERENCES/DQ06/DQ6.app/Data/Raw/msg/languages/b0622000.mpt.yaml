  ja: "@a@b%a002020「%a000090　神父さまと\n\tお話してみて　よかったわね。\n\tヒントに　なったんじゃない？\n@c0@"
  ko: "@a@b%a002020: %a000090, 신부님과\n이야기하길 잘한 것 같아.\n힌트를 얻었잖아?\n@c0@"
  sl: "@a@b%a002020：%a000090，\n　　能和神父聊一聊真是太好了。\n　　这不是找到线索了吗？\n@c0@"
  tl: "@a@b%a002020：%a000090，\n　　能和神父聊一聊真是太好了。\n　　這不是找到線索了嗎？\n@c0@"
51:
  en: "@a%0%a002030@bJust hearing our words was enough to bring life back to the priest's face.\n@c0@"
  ja: "@a@b%a002030「私たちの　話を聞いて\n\t神父さま　少しだけ\n\t顔いろが　よくなりましたね。\n@c0@"
