48:
  en: "@a%0%a002000@bFindin' a way outta this world oughta do it, I suppose.\n@c0@"
  ja: "@a@b%a002000「まずは　オレたちが\n\tこの　はざまの世界から\n\t脱出する　方法を　見つけようぜ！\n@c0@"
