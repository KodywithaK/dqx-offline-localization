64:
  en: "@a%0%a002000@bHardy har! Feels good to help, aye?\n@c0@"
  ja: "@a@b%a002000「よかったな　じいさん！\n@c0@"
  ko: "@a@b%a002000: 영감님, 다행이군!\n@c0@"
  sl: "@a@b%a002000：太好了，老爷爷。\n@c0@"
  tl: "@a@b%a002000：太好了，老爺爺。\n@c0@"
65:
  en: "@a%0%a002010@bThey must have a lot to talk about. Shall we leave them to it?\n@c0@"
  ja: "@a@b%a002010「つもる話も　あるでしょう。\n\t私たちは　このへんで\n\tおいとましましょうか。\n@c0@"
  ko: "@a@b%a002010: 못다 한 이야기도 많을 거야.\n우리는 이쯤에서\n자리를 비켜 드릴까?\n@c0@"
  sl: "@a@b%a002010：他一定有\n　　很多话想说吧。\n　　我们暂时先走吧。\n@c0@"
  tl: "@a@b%a002010：他一定有\n　　很多話想說吧。\n　　我們暫時先走吧。\n@c0@"
66:
  en: "@a%0%a002020@bHopefully that son will appreciate his parents more than ever now.\n@c0@"
  ja: "@a@b%a002020「おじいさん　これからは\n\tばっちり　親孝行\n\tしてもらえそうね。\n@c0@"
  ko: "@a@b%a002020: 할아버지, 앞으로는\n제대로 효도 받으며\n사실 수 있겠네.\n@c0@"
  sl: "@a@b%a002020：老爷爷的孩子\n　　今后一定会孝敬\n　　他老人家的吧。\n@c0@"
  tl: "@a@b%a002020：老爺爺的孩子\n　　今後一定會孝敬\n　　他老人家的吧。\n@c0@"
67:
  en: "@a%0%a002030@bI feel a little guilty for interrupting such an intimate family reunion...\n@c0@"
  ja: "@a@b%a002030「久しぶりの\n\t親子水入らずの場に　おジャマして\n\tもうしわけなかったですね。\n@c0@"
  ko: "@a@b%a002030: 오랜만에\n가족들이 단란하게 모였는데\n방해하다니 미안하게 됐군요.\n@c0@"
  sl: "@a@b%a002030：父子久别重逢，\n　　我们外人还是\n　　不要打扰他们吧。\n@c0@"
  tl: "@a@b%a002030：父子久別重逢，\n　　我們外人還是\n　　不要打擾他們吧。\n@c0@"
68:
  en: "@a%0%a002050@bWho needs the Isle o' Smiles when you've got yourself a happy family?\n@c0@"
  ja: "@a@b%a002050「しあわせの国は　ともかく\n\tいつも　しあわせな家族で\n\tあってほしい　ですよね！\n@c0@"
  ko: "@a@b%a002050: 행복의 나라를 떠나서\n항상 행복한 가족으로\n남아 있었으면 좋겠네요!\n@c0@"
  sl: "@a@b%a002050：别说幸福国了，\n　　要是这个家能一直\n　　幸福下去就好了！\n@c0@"
  tl: "@a@b%a002050：別說幸福國了，\n　　要是這個家能一直\n　　幸福下去就好了！\n@c0@"
69:
  en: "@a%0%a002000@bHe may not be a fat cat, but at least he's chipper!\n@c0@"
  ja: "@a@b%a002000「おおっ\n\tよろこんでる　よろこんでる。\n@c0@"
  ko: "@a@b%a002000: 오옷,\n기뻐하고 있군.\n@c0@"
  sl: "@a@b%a002000：哦，\n　　在笑呢在笑呢。\n@c0@"
  tl: "@a@b%a002000：哦，\n　　在笑呢在笑呢。\n@c0@"
70:
  en: "@a%0%a002010@bThat kitty looks very contented.\n@c0@"
  ja: "@a@b%a002010「ネコちゃん\n\tごきげん　よさそうね。\n@c0@"
  ko: "@a@b%a002010: 고양이도\n기분이 좋아 보이네.\n@c0@"
  sl: "@a@b%a002010：小猫咪看起来\n　　心情不错呢。\n@c0@"
  tl: "@a@b%a002010：小貓咪看起來\n　　心情不錯呢。\n@c0@"
71:
  en: "@a%0%a002020@bOoh, look! He's purring!\n@c0@"
  ja: "@a@b%a002020「ゴロゴロ　いってるー。\n@c0@"
  ko: "@a@b%a002020: 갸르릉거리고 있네.\n@c0@"
  sl: "@a@b%a002020：喵喵地叫着呢。\n@c0@"
  tl: "@a@b%a002020：喵喵地叫著呢。\n@c0@"
72:
  en: "@a%0%a002030@bHe appears to be licking his lips. He must have just been fed.\n@c0@"
  ja: "@a@b%a002030「クチの　まわりを\n\tなめてますね。　エサを\n\tもらった　ばかりでしょうか。\n@c0@"
  ko: "@a@b%a002030: 입 근처를\n핥고 있군요. 지금 막\n먹이를 먹은 걸까요?\n@c0@"
  sl: "@a@b%a002030：在擦着嘴呢。\n　　刚才有人给它喂食了吧。\n@c0@"
  tl: "@a@b%a002030：在擦著嘴呢。\n　　剛才有人給它餵食了吧。\n@c0@"
73:
  en: "@a%0%a002050@bOld %a002050 has quite a soft spot for cats!\n@c0@"
  ja: "@a@b%a002050「ネコは　しぐさが\n\tかわいいですよね。\n@c0@"
  ko: "@a@b%a002050: 고양이는 행동이\n귀엽군요.\n@c0@"
  sl: "@a@b%a002050：猫的动作真是可爱啊。\n@c0@"
  tl: "@a@b%a002050：貓的動作真是可愛啊。\n@c0@"
74:
  en: "@a%0%a002000@bHuh. I stopped payin' attention halfway through all that, but what I heard sounded good.\n@c0@"
  ja: "@a@b%a002000「うーん……。\n\tオレには　むずかしい　話だけど\n\tま　要するに　そういうことだな。\n@c0@"
  ko: "@a@b%a002000: 으음......\n나한텐 어려운 이야기지만\n뭐 결국 그런 뜻이겠지.\n@c0@"
  sl: "@a@b%a002000：唔……\n　　俺虽然听不太懂，\n　　不过总之，就是这么回事吧。\n@c0@"
  tl: "@a@b%a002000：唔……\n　　俺雖然聽不太懂，\n　　不過總之，就是這麼回事吧。\n@c0@"
75:
  en: "@a%0%a002010@bI couldn't have said it better myself. Happiness can be found wherever you look for it!\n@c0@"
  ja: "@a@b%a002010「ほんとね。\n\tしあわせは　どこにいても\n\t見つけられると思うわ。\n@c0@"
  ko: "@a@b%a002010: 맞아.\n행복은 어디에 있어도\n찾을 수 있는 거라고 생각해.\n@c0@"
  sl: "@a@b%a002010：真的呢。\n　　不管在哪，\n　　都可以找到幸福。\n@c0@"
  tl: "@a@b%a002010：真的呢。\n　　不管在哪，\n　　都可以找到幸福。\n@c0@"
76:
  en: "@a%0%a002020@bWhat makes me happy? A tummy full of roast beast, some cute clothes and a clear complexion!\n@c0@"
  ja: "@a@b%a002020「あたしは……そうね\n\tとりあえず　おいしい　ごはん\n\t食べてるときが　しあわせだな。\n@c0@"
  ko: "@a@b%a002020: 나는...... 글쎄.\n일단은 맛있는 밥을\n먹고 있을 때가 행복해.\n@c0@"
  sl: "@a@b%a002020：要说我嘛……\n　　总之在吃好吃的东西的时候，\n　　我就觉得很幸福。\n@c0@"
  tl: "@a@b%a002020：要說我嘛……\n　　總之在吃好吃的東西的時候，\n　　我就覺得很幸福。\n@c0@"
77:
  en: "@a%0%a002030@bI really couldn't have put it better myself.\n@c0@"
  ja: "@a@b%a002030「そうですね。\n\tしあわせは　自分で\n\t見つけるものですからね。\n@c0@"
  ko: "@a@b%a002030: 맞습니다.\n행복은 스스로\n찾는 것이지요.\n@c0@"
  sl: "@a@b%a002030：没错啊。\n　　幸福要靠\n　　自己的手去争取。\n@c0@"
  tl: "@a@b%a002030：沒錯啊。\n　　幸福要靠\n　　自己的手去爭取。\n@c0@"
78:
  en: "@a%0%a002050@bAll this philosophical yabber about happiness is giving old %a002050 a sore head!\n@c0@"
  ja: "@a@b%a002050「いろいろ　しあわせについて\n\t考えていたら　あたまが　いたく\n\tなってしまいました……。\n@c0@"
  ko: "@a@b%a002050: 행복에 대해 이것저것\n생각했더니 머리가\n아파지네요......\n@c0@"
  sl: "@a@b%a002050：关于幸福的问题，\n　　我想了好多，\n　　想得头都疼了……\n@c0@"
  tl: "@a@b%a002050：關於幸福的問題，\n　　我想了好多，\n　　想得頭都疼了……\n@c0@"
79:
  en: "@a%0%a002000@bWell, good thing her old man made it back, aye?\n@c0@"
  ja: "@a@b%a002000「そうかあ。\n\tお父さん　帰ってきて\n\tよかったよな！\n@c0@"
  ko: "@a@b%a002000: 그랬군.\n아버지가 돌아와서\n다행이네!\n@c0@"
  sl: "@a@b%a002000：这样啊。\n　　老爸回来了\n　　真是太好了啊。\n@c0@"
  tl: "@a@b%a002000：這樣啊。\n　　老爸回來了\n　　真是太好了啊。\n@c0@"
80:
  en: "@a%0%a002010@bHer aura looks much healthier. Here's to a full recovery!\n@c0@"
  ja: "@a@b%a002010「顔色が　とてもいいわ。\n\tこのまま　よくなると　いいわね！\n@c0@"
  ko: "@a@b%a002010: 혈색이 아주 좋아.\n이대로 회복되면 좋겠어!\n@c0@"
  sl: "@a@b%a002010：脸色不错呢。\n　　能就这样痊愈就好了呢。\n@c0@"
  tl: "@a@b%a002010：臉色不錯呢。\n　　能就這樣痊癒就好了呢。\n@c0@"
81:
  en: "@a%0%a002020@bHer father's disappearance must be what made her sick.\n@c0@"
  ja: "@a@b%a002020「お父さんを　心配して\n\t体調を　くずしていたのよ　きっと。\n@c0@"
  ko: "@a@b%a002020: 아버지가 걱정되어서\n몸이 더 안 좋아진 거라구.\n@c0@"
  sl: "@a@b%a002020：一定是因为担心父亲，\n　　所以身体状况之前才那么糟吧。\n@c0@"
  tl: "@a@b%a002020：一定是因為擔心父親，\n　　所以身體狀況之前才那麼糟吧。\n@c0@"
82:
  en: "@a%0%a002030@bHaving her father beside her is the best medicine she could ask for.\n@c0@"
  ja: "@a@b%a002030「やっぱり　お父さんが\n\tそばに　いるのが　何よりの\n\tクスリに　なっているんですよね。\n@c0@"
  ko: "@a@b%a002030: 역시 아버지가\n곁에 계셔 주는 것이 최고의\n약인 모양입니다.\n@c0@"
  sl: "@a@b%a002030：父亲在身边，\n　　果然就是\n　　胜过一切的良药呢。\n@c0@"
  tl: "@a@b%a002030：父親在身邊，\n　　果然就是\n　　勝過一切的良藥呢。\n@c0@"
83:
  en: "@a%0%a002050@bI'm glad to hear she's feelin' better, but I don't want to see the lass overdoin' it!\n@c0@"
  ja: "@a@b%a002050「安心したからといって\n\t飛んだり　はねたり　走ったり\n\tおよいだり　しちゃダメですよ！\n@c0@"
  ko: "@a@b%a002050: 안심했다고 해서\n뛰고 솟고 달리고\n헤엄치고 그러시면 안 됩니다!\n@c0@"
  sl: "@a@b%a002050：不要因为放下心来，\n　　就到处乱蹦乱跳哦！\n@c0@"
  tl: "@a@b%a002050：不要因為放下心來，\n　　就到處亂蹦亂跳哦！\n@c0@"
84:
  en: "@a%0%a002000@bI bet that fella'll be fine from now on. He seems decent enough.\n@c0@"
  ja: "@a@b%a002000「オヤジさん\n\t根は　マジメな人らしいから\n\tこれからは　だいじょうぶだな。\n@c0@"
  ko: "@a@b%a002000: 아버지도\n근본은 성실한 사람 같으니\n앞으로는 괜찮을 것 같군.\n@c0@"
  sl: "@a@b%a002000：大叔其实是个\n　　心地善良的人。\n　　今后一定不会有问题的。\n@c0@"
  tl: "@a@b%a002000：大叔其實是個\n　　心地善良的人。\n　　今後一定不會有問題的。\n@c0@"
85:
  en: "@a%0%a002010@bWhat's done is done. The important thing now is for him to take care of his daughter.\n@c0@"
  ja: "@a@b%a002010「すんだことは　すんだこと。\n\tこれから　何をするかが\n\tだいじ　だわよね。\n@c0@"
  ko: "@a@b%a002010: 지나간 일은 지나간 일.\n앞으로 어떻게 할지가\n중요한 거야.\n@c0@"
  sl: "@a@b%a002010：过去的事就别追究了。\n　　今后要做的事\n　　才是最重要的。\n@c0@"
  tl: "@a@b%a002010：過去的事就別追究了。\n　　今後要做的事\n　　才是最重要的。\n@c0@"
86:
  en: "@a%0%a002020@bI sure hope he keeps up this Father of the Year act, for the kid's sake...\n@c0@"
  ja: "@a@b%a002020「がんばれ　お父さん！\n@c0@"
  ko: "@a@b%a002020: 힘내요, 아버지!\n@c0@"
  sl: "@a@b%a002020：大叔，加油！\n@c0@"
  tl: "@a@b%a002020：大叔，加油！\n@c0@"
87:
  en: "@a%0%a002030@bAlthough that man went astray, he seems ready to make amends.\n@c0@"
  ja: "@a@b%a002030「お父さん　しばらく\n\t努力する　方向を\n\tまちがえちゃってたんですね。\n@c0@"
  ko: "@a@b%a002030: 아버지가 잠시 동안\n노력할 방향을\n잘못 잡으셨던 것 같군요.\n@c0@"
  sl: "@a@b%a002030：这位父亲一段时间内\n　　弄错了自己\n　　努力的方向呢。\n@c0@"
  tl: "@a@b%a002030：這位父親一段時間內\n　　弄錯了自己\n　　努力的方向呢。\n@c0@"
88:
  en: "@a%0%a002050@bWhatever mistakes that man made, he had his daughter's best interests at heart, I'm sure.\n@c0@"
  ja: "@a@b%a002050「なんだかんだ　言っても\n\tずっと　娘さんのことを\n\t気づかって　いたのですよね！\n@c0@"
  ko: "@a@b%a002050: 어쨌든 아버님도\n계속 따님을\n걱정하고 계셨군요!\n@c0@"
  sl: "@a@b%a002050：虽然说了这么多，\n　　但心里还是在\n　　为女儿着想呢！\n@c0@"
  tl: "@a@b%a002050：雖然說了這麼多，\n　　但心裡還是在\n　　為女兒著想呢！\n@c0@"
89:
  en: "@a%0%a002000@bNow that I think about it, that kid must've been watching us from the coast, aye?\n@c0@"
  ja: "@a@b%a002000「そうか　この子\n\t島には行かず　どこか　近くで\n\tようすを　見ていたんだな。\n@c0@"
  ko: "@a@b%a002000: 그랬군. 이 아이는\n섬에는 가지 않고 근처에서\n구경하고 있었던 거야.\n@c0@"
  sl: "@a@b%a002000：这样啊。\n　　这孩子没有到岛上去，\n　　而是在附近看到的啊。\n@c0@"
  tl: "@a@b%a002000：這樣啊。\n　　這孩子沒有到島上去，\n　　而是在附近看到的啊。\n@c0@"
90:
  en: "@a%0%a002000@bGood. I got worried when I didn't see him in town or on the island.\n@c0@"
  ja: "@a@b%a002000「町の中でも　島でも\n\tしばらく　みかけないから\n\t心配したぜ。\n@c0@"
  ko: "@a@b%a002000: 마을 안에서도 섬에서도\n한동안 안 보이길래\n걱정했지.\n@c0@"
  sl: "@a@b%a002000：这阵子无论是镇子上\n　　还是岛上都没见到他，\n　　俺还担心了呢。\n@c0@"
  tl: "@a@b%a002000：這陣子無論是鎮子上\n　　還是島上都沒見到他，\n　　俺還擔心了呢。\n@c0@"
91:
  en: "@a%0%a002010@bThat's because we're sailing it! We'll have to come visit him again soon.\n@c0@"
  ja: "@a@b%a002010「ぼうや。\n\tおねえちゃんたち　スイスイ　海から\n\tあの島！　また来るね！\n@c0@"
  ko: "@a@b%a002010: 꼬마야.\n누나도 바다에서 휙휙\n그 섬! 또 올게!\n@c0@"
  sl: "@a@b%a002010：小朋友。\n　　大姐姐还会坐着那个\n　　嗖嗖嗖从海上冒出的岛来这里的。\n@c0@"
  tl: "@a@b%a002010：小朋友。\n　　大姐姐還會坐著那個\n　　嗖嗖嗖從海上冒出的島來這裡的。\n@c0@"
92:
  en: "@a%0%a002020@bThink that kid'll be sad to see us sail the island away?\n@c0@"
  ja: "@a@b%a002020「あたしたちが　島に\n\t乗っていっちゃうと　この子\n\t悲しむかなあ……。\n@c0@"
  ko: "@a@b%a002020: 우리가 섬을\n타고 가 버리면 이 아이는\n슬퍼하려나......\n@c0@"
  sl: "@a@b%a002020：要是我们\n　　坐着那岛走了，\n　　这孩子一定会伤心的吧……\n@c0@"
  tl: "@a@b%a002020：要是我們\n　　坐著那島走了，\n　　這孩子一定會傷心的吧……\n@c0@"
93:
  en: "@a%0%a002030@bIt's best not to tell him that the island was sailed by monsters all along.\n@c0@"
  ja: "@a@b%a002030「あれは　まものたちの船\n\t……なんてことは　知らないままで\n\tいてほしいですね。\n@c0@"
  ko: "@a@b%a002030: 그게 마물들의 배였다는\n사실은...... 계속 모른 채\n지내 줬으면 좋겠습니다.\n@c0@"
  sl: "@a@b%a002030：还是别让他知道\n　　那是魔物们的船\n　　比较好吧……\n@c0@"
  tl: "@a@b%a002030：還是別讓他知道\n　　那是魔物們的船\n　　比較好吧……\n@c0@"
94:
  en: "@a%0%a002050@bThe lad has quite a soft spot for that island.\n@c0@"
  ja: "@a@b%a002050「コトバの順序が\n\tめちゃくちゃでも　言ってることは\n\t大体わかりますね。\n@c0@"
  ko: "@a@b%a002050: 단어 순서가\n엉망이지만 무슨 말인지\n대충 알겠네요.\n@c0@"
  sl: "@a@b%a002050：虽然说的话乱七八糟的，\n　　但是大概意思\n　　还是能听懂。\n@c0@"
  tl: "@a@b%a002050：雖然說的話亂七八糟的，\n　　但是大概意思\n　　還是能聽懂。\n@c0@"
95:
  en: "@a%0%a002000@bPurely in soul form, aye...? I ain't sure that's the best way to put it, but I better not say any more...\n@c0@"
  ja: "@a@b%a002000「心だけの　存在……か。\n\tちょっと　ちがうとは　思うけど\n\tオレには　答えられないな。\n@c0@"
  ko: "@a@b%a002000: 마음만 존재하는 사람들이라......\n좀 다르긴 하지만\n난 대답 못 하겠군.\n@c0@"
  sl: "@a@b%a002000：只是灵魂的存在吗……\n　　虽然跟事实有点偏差，\n　　不过俺不能说啊。\n@c0@"
  tl: "@a@b%a002000：只是靈魂的存在嗎……\n　　雖然跟事實有點偏差，\n　　不過俺不能說啊。\n@c0@"
96:
  en: "@a%0%a002010@bThat nun is as sharp as you'd expect...\n@c0@"
  ja: "@a@b%a002010「シスターさん\n\tさすがに　するどいわね……。\n@c0@"
  ko: "@a@b%a002010: 수녀님은\n역시 날카로운걸......\n@c0@"
  sl: "@a@b%a002010：修女真是敏锐啊……\n@c0@"
  tl: "@a@b%a002010：修女真是敏銳啊……\n@c0@"
97:
  en: "@a%0%a002020@b......\n@c0@"
  ja: "@a@b%a002020「……。\n@c0@"
  ko: "@a@b%a002020: ......\n@c0@"
  sl: "@a@b%a002020：……\n@c0@"
  tl: "@a@b%a002020：……\n@c0@"
98:
  en: "@a%0%a002030@bThis may be the dream world, but to its inhabitants, it is as real as our own.\n@c0@"
  ja: "@a@b%a002030「ここは　夢の世界ですが\n\tすんでいる　人たちにとっては\n\t現実の世界です。\n@c0@"
  ko: "@a@b%a002030: 여긴 꿈의 세계지만\n이곳에 살고 있는 사람들에게는\n현실 세계지요.\n@c0@"
  sl: "@a@b%a002030：虽然这里是梦世界，\n　　但是对住在这里的人来说，\n　　这里就是现实世界。\n@c0@"
  tl: "@a@b%a002030：雖然這裡是夢世界，\n　　但是對住在這裡的人來說，\n　　這裡就是現實世界。\n@c0@"
99:
  en: "@a%0%a002030@bIt is not our place to tell them the truth about their world.\n@c0@"
  ja: "@a@b%a002030「ただ　本当のことを\n\t伝えれば　いいと言うものでは\n\tありませんよね。\n@c0@"
  ko: "@a@b%a002030: 그저 진실을\n전한다고 다 좋은 건\n아닐 겁니다.\n@c0@"
  sl: "@a@b%a002030：不过，\n　　我们也不能\n　　将真相讲出来。\n@c0@"
  tl: "@a@b%a002030：不過，\n　　我們也不能\n　　將真相講出來。\n@c0@"
100:
  en: "@a%0%a002050@bThat nun's words gave old %a002050 plenty of food for thought.\n@c0@"
  ja: "@a@b%a002050「いま　私\n\tドキッと　しました！\n@c0@"
  ko: "@a@b%a002050: 방금 저\n가슴이 뭉클했어요!\n@c0@"
  sl: "@a@b%a002050：刚才我的心\n　　砰地一下！\n@c0@"
  tl: "@a@b%a002050：剛才我的心\n　　砰地一下！\n@c0@"
101:
  en: "@a%0%a002000@bHuh. Not a single guest, aye?\n@c0@"
  ja: "@a@b%a002000「あれ？　泊まり客は\n\tだれも　いないのか。\n@c0@"
  ko: "@a@b%a002000: 어? 묵고 가는 사람은\n아무도 없는 건가?\n@c0@"
  sl: "@a@b%a002000：诶？\n　　一个留宿的客人都没有啊。\n@c0@"
  tl: "@a@b%a002000：誒？\n　　一個留宿的客人都沒有啊。\n@c0@"
102:
  en: "@a%0%a002010@bI do feel for the poor innkeeper — the number of visitors is sure to dwindle.\n@c0@"
  ja: "@a@b%a002010「宿屋さん　これから\n\tお客が　へって　ちょっと\n\t困るかも　しれないわね。\n@c0@"
  ko: "@a@b%a002010: 앞으로 여관에\n손님이 줄어들어서 조금\n힘들지도 모르겠네.\n@c0@"
  sl: "@a@b%a002010：要是客人减少了的话，\n　　旅店老板一定\n　　会很伤脑筋吧。\n@c0@"
  tl: "@a@b%a002010：要是客人減少了的話，\n　　旅店老闆一定\n　　會很傷腦筋吧。\n@c0@"
103:
  en: "@a%0%a002010@bAfter all, their main tourist attraction is no more...\n@c0@"
  ja: "@a@b%a002010「しあわせの国行きが\n\t目的で　この町に　来る人は\n\tもう　いなくなるから……。\n@c0@"
  ko: "@a@b%a002010: 행복의 나라에 가는 걸\n목적으로 이 마을로 오는 사람은\n이제 없어질 테니까......\n@c0@"
  sl: "@a@b%a002010：已经不会有人\n　　为了前往幸福国\n　　而来这个镇子了。\n@c0@"
  tl: "@a@b%a002010：已經不會有人\n　　為了前往幸福國\n　　而來這個鎮子了。\n@c0@"
104:
  en: "@a%0%a002020@bSure is quiet, huh?\n@c0@"
  ja: "@a@b%a002020「なんか　静かだねー。\n@c0@"
  ko: "@a@b%a002020: 왠지 조용하네~\n@c0@"
  sl: "@a@b%a002020：总觉得好安静啊。\n@c0@"
  tl: "@a@b%a002020：總覺得好安靜啊。\n@c0@"
105:
  en: "@a%0%a002030@bI suppose the people who came here from afar to find the Isle o' Smiles must have all returned home...\n@c0@"
  ja: "@a@b%a002030「よそから　やって来て\n\tしあわせの国に　行った人は　もう\n\tふるさとに　帰ったんでしょうね。\n@c0@"
  ko: "@a@b%a002030: 외부에서 찾아와서\n행복의 나라로 갔던 사람들은 이미\n고향으로 돌아갔겠지요.\n@c0@"
  sl: "@a@b%a002030：从别的地方来这里，\n　　前往幸福国的人，\n　　现在已经回家乡了吧。\n@c0@"
  tl: "@a@b%a002030：從別的地方來這裡，\n　　前往幸福國的人，\n　　現在已經回家鄉了吧。\n@c0@"
106:
  en: "@a%0%a002050@bThe rest of the town's full of life, but the poor innkeeper seems to have been left twiddlin' his thumbs.\n@c0@"
  ja: "@a@b%a002050「よそは　活気づいたのに\n\t宿屋さん　だけが\n\tヒマそうですね。\n@c0@"
  ko: "@a@b%a002050: 다른 곳엔 활기가 넘치는데\n여관만큼은\n한가로워 보이는군요.\n@c0@"
  sl: "@a@b%a002050：别的地方\n　　都生气勃勃的，\n　　这旅店倒是清闲啊。\n@c0@"
  tl: "@a@b%a002050：別的地方\n　　都生氣勃勃的，\n　　這旅店倒是清閒啊。\n@c0@"
107:
  en: "@a%0%a002000@bNow he's stayin' here? This fella can't make up his mind about anything, aye?\n@c0@"
  ja: "@a@b%a002000「この町に　のこる？\n\tとことん　いきあたりばったりな\n\t男だな。\n@c0@"
  ko: "@a@b%a002000: 이 마을에 남겠다고?\n진짜 대책 없는\n남자로군.\n@c0@"
  sl: "@a@b%a002000：留在这个镇上？\n　　这男的还真是说干就干啊。\n@c0@"
  tl: "@a@b%a002000：留在這個鎮上？\n　　這男的還真是說幹就幹啊。\n@c0@"
108:
  en: "@a%0%a002010@bWhy, that's exactly what I was going to suggest...\n@c0@"
  ja: "@a@b%a002010「私たちが\n\tやろうとしていることを　かなり\n\t言い当てては　いるわね……。\n@c0@"
  ko: "@a@b%a002010: 우리가\n하려고 하는 걸 의외로\n알아맞히긴 하는걸.\n@c0@"
  sl: "@a@b%a002010：他倒是说对了\n　　我们接下来要做的事呢……\n@c0@"
  tl: "@a@b%a002010：他倒是說對了\n　　我們接下來要做的事呢……\n@c0@"
109:
  en: "@a%0%a002020@bI can never tell if that guy is messing with us or not.\n@c0@"
  ja: "@a@b%a002020「どこから　マジメで\n\tどこが　冗談なのか\n\tわかんない人だね。\n@c0@"
  ko: "@a@b%a002020: 어디까지가 진담이고\n어디까지가 농담인지\n알 수 없는 사람이네.\n@c0@"
  sl: "@a@b%a002020：真是不知道他说的话\n　　几分是真，\n　　几分是假。\n@c0@"
  tl: "@a@b%a002020：真是不知道他說的話\n　　幾分是真，\n　　幾分是假。\n@c0@"
110:
  en: "@a%0%a002030@bI worry about Skip's ability to protect the people of this town...\n@c0@"
  ja: "@a@b%a002030「マハメドさんに\n\tまかされても　こまりますね……。\n@c0@"
  ko: "@a@b%a002030: 마하메드 씨가\n우리한테 뭘 맡기겠단 겁니까......\n@c0@"
  sl: "@a@b%a002030：要是交给穆罕默德的话，\n　　还真放心不下呢……\n@c0@"
  tl: "@a@b%a002030：要是交給穆罕默德的話，\n　　還真放心不下呢……\n@c0@"
111:
  en: "@a%0%a002050@bThat lad's liable to live up to his name and skip town sooner than defend it.\n@c0@"
  ja: "@a@b%a002050「マハメド　イコール\n\tいいかげん！！\n\t私　おぼえました。\n@c0@"
  ko: "@a@b%a002050: 마하메드는 언제나\n얼렁뚱땅!!\n저, 이 공식 외웠습니다.\n@c0@"
  sl: "@a@b%a002050：穆罕默德就是\n　　随便散漫的代名词！！\n　　我记住了。\n@c0@"
  tl: "@a@b%a002050：穆罕默德就是\n　　隨便散漫的代名詞！！\n　　我記住了。\n@c0@"
112:
  en: "@a%0%a002000@bHe's right. We oughta show our faces around Aridea one more time before we shove off.\n@c0@"
  ja: "@a@b%a002000「そうだよな。\n\tやっぱり　カルカドには\n\t顔を出して　おきたいよな。\n@c0@"
  ko: "@a@b%a002000: 그래.\n역시 캘커드에는\n얼굴을 비추고 가는 게 좋겠지.\n@c0@"
  sl: "@a@b%a002000：是啊。\n　　咱还是去加尔加德\n　　露个脸吧。\n@c0@"
  tl: "@a@b%a002000：是啊。\n　　咱還是去加爾加德\n　　露個臉吧。\n@c0@"
113:
  en: "@a%0%a002010@bIt wouldn't feel right to leave without saying a word. Let's pay Aridea a visit, %a000090.\n@c0@"
  ja: "@a@b%a002010「だまって　行くのも\n\tなんとなく　気が引けるから\n\tいったん寄って　行きましょうよ。\n@c0@"
  ko: "@a@b%a002010: 말없이 떠나는 것도\n왠지 마음에 걸리니까\n일단 들렀다 가자.\n@c0@"
  sl: "@a@b%a002010：一言不发地离开\n　　是有点不合适。\n　　我们还是顺路去一趟吧。\n@c0@"
  tl: "@a@b%a002010：一言不發地離開\n　　是有點不合適。\n　　我們還是順路去一趟吧。\n@c0@"
114:
  en: "@a%0%a002020@bLet's go back to Aridea, %a000090!\n@c0@"
  ja: "@a@b%a002020「カルカドに\n\t行ってみようよ　%a000090。\n@c0@"
  ko: "@a@b%a002020: 캘커드로\n가 보자, %a000090.\n@c0@"
  sl: "@a@b%a002020：去加尔加德看看吧，\n　　%a000090。\n@c0@"
  tl: "@a@b%a002020：去加爾加德看看吧，\n　　%a000090。\n@c0@"
115:
  en: "@a%0%a002020@bMaybe we'll find some of those freed souls back there!\n@c0@"
  ja: "@a@b%a002020「たましいが　解放された\n\t人たちが　いるかもしれないよ！\n@c0@"
  ko: "@a@b%a002020: 영혼이 풀려난\n사람들이 있을지도 몰라!\n@c0@"
  sl: "@a@b%a002020：可能会有灵魂\n　　得到解脱了的人哦！\n@c0@"
  tl: "@a@b%a002020：可能會有靈魂\n　　得到解脫了的人哦！\n@c0@"
116:
  en: "@a%0%a002030@bI would dearly love to see how the townsfolk who escaped the Isle o' Smiles are faring...\n@c0@"
  ja: "@a@b%a002030「とにかく　町にもどった\n\t皆さんが　どうしているか\n\t私もぜひ　たしかめたいですね。\n@c0@"
  ko: "@a@b%a002030: 마을로 돌아간\n사람들이 어떻게 지내는지\n저도 꼭 확인해 보고 싶습니다.\n@c0@"
  sl: "@a@b%a002030：总之，我很想\n　　去看看回到镇子的人们\n　　现在怎么样了。\n@c0@"
  tl: "@a@b%a002030：總之，我很想\n　　去看看回到鎮子的人們\n　　現在怎麼樣了。\n@c0@"
117:
  en: "@a%0%a002050@bFor a second there, I wondered if it was monsters shakin' us awake again.\n@c0@"
  ja: "@a@b%a002050「いやー　じつは　私\n\t起こされたときに　また　まものか！？\n\tとか　思っちゃいましたよ。\n@c0@"
  ko: "@a@b%a002050: 이야~ 사실 저는\n아까 깨울 때 혹시 또 마물인가!?\n하고 생각했답니다.\n@c0@"
  sl: "@a@b%a002050：哎呀。其实我\n　　被吵醒的话，有时候会\n　　以为又来了魔物呢！\n@c0@"
  tl: "@a@b%a002050：哎呀。其實我\n　　被吵醒的話，有時候會\n　　以為又來了魔物呢！\n@c0@"
118:
  en: "@a%0%a002000@bCrikey! I can't believe I'm travelling the world on my own island! Talk about ridin' in style! \n@c0@"
  ja: "@a@b%a002000「この島で　世界中を\n\t旅することを　考えたら\n\tワクワク　するぜ！\n@c0@"
  ko: "@a@b%a002000: 이 섬으로 전 세계를\n여행한다고 생각하니\n가슴이 뛰는걸!\n@c0@"
  sl: "@a@b%a002000：一想到可以\n　　乘坐着岛环游世界，\n　　还真是期待啊！\n@c0@"
  tl: "@a@b%a002000：一想到可以\n　　乘坐著島環遊世界，\n　　還真是期待啊！\n@c0@"
119:
  en: "@a%0%a002010@bThe wheel on that little platform can be used to make the ship move.\n@c0@"
  ja: "@a@b%a002010「島を　動かすときには\n\tそうじゅう台の　ところの\n\tカジを　使うんだったわね。\n@c0@"
  ko: "@a@b%a002010: 섬을 움직이려면\n조종대에 있는\n키를 사용하면 되는 거였지?\n@c0@"
  sl: "@a@b%a002010：想要开动岛的时候，\n　　需要使用操纵台\n　　那里的舵盘吧。\n@c0@"
  tl: "@a@b%a002010：想要開動島的時候，\n　　需要使用操縱臺\n　　那裡的舵盤吧。\n@c0@"
120:
  en: "@a%0%a002020@bA sweet ride like this is bound to turn heads wherever we go.\n@c0@"
  ja: "@a@b%a002020「この島が　海の上を\n\t走っているのを　見たら\n\tみんな　おどろくでしょうね。\n@c0@"
  ko: "@a@b%a002020: 이 섬이 바다 위를\n항해하는 걸 보면\n아마도 다들 놀랄 거야.\n@c0@"
  sl: "@a@b%a002020：要是大家看到\n　　这座岛在海上航行的话，\n　　一定会很吃惊吧。\n@c0@"
  tl: "@a@b%a002020：要是大家看到\n　　這座島在海上航行的話，\n　　一定會很吃驚吧。\n@c0@"
121:
  en: "@a%0%a002030@bThis is marvellous! Now we have a sea-faring vessel up here in the dream world too!\n@c0@"
  ja: "@a@b%a002030「ついに！　上の世界でも\n\t船が　使えるように\n\tなりましたね！\n@c0@"
  ko: "@a@b%a002030: 드디어! 위쪽 세계에서도\n배를 사용할 수 있게\n되었군요!\n@c0@"
  sl: "@a@b%a002030：在上面这个世界\n　　终于也有船可以用了！\n@c0@"
  tl: "@a@b%a002030：在上面這個世界\n　　終於也有船可以用了！\n@c0@"
122:
  en: "@a%0%a002050@bOld %a002050 is just a bit concerned by what folk'll think if we commandeer this island.\n@c0@"
  ja: "@a@b%a002050「でも\n\tとうぶんの　あいだは\n\tこの島に　乗っていると……\n@c0@"
  ko: "@a@b%a002050: 하지만\n당분간은\n이 섬을 타고 다니면......\n@c0@"
  sl: "@a@b%a002050：不过，\n　　要是这个时候\n　　出现在这座岛上的话……\n@c0@"
  tl: "@a@b%a002050：不過，\n　　要是這個時候\n　　出現在這座島上的話……\n@c0@"
123:
  en: "@a%0%a002050@bWon't they think we're hucksters sellin' a one-way trip to the Isle o' Smiles?\n@c0@"
  ja: "@a@b%a002050「私たちが\n\tしあわせの国の　まわし者だと\n\t思われちゃいますね！\n@c0@"
  ko: "@a@b%a002050: 우리가\n행복의 나라 앞잡이라고\n오해받겠네요!\n@c0@"
  sl: "@a@b%a002050：我们会被\n　　当做是幸福国\n　　派来的人的！\n@c0@"
  tl: "@a@b%a002050：我們會被\n　　當做是幸福國\n　　派來的人的！\n@c0@"
124:
  en: "@a%0%a002000@bIt almost boggles the mind, aye? This entire island, servin' as our personal ship! It's good to be us!\n@c0@"
  ja: "@a@b%a002000「あらためて　この島が\n\tオレたちの　船なんだ　って\n\t考えると　たのもしいな！\n@c0@"
  ko: "@a@b%a002000: 이 섬이 우리의 배라고\n새삼 생각하니\n든든한걸!\n@c0@"
  sl: "@a@b%a002000：一想到这座岛\n　　成为了咱的船，\n　　心里还真是踏实啊！\n@c0@"
  tl: "@a@b%a002000：一想到這座島\n　　成為了咱的船，\n　　心裡還真是踏實啊！\n@c0@"
125:
  en: "@a%0%a002010@bNow that we've got this island, we'll be able to float effortlessly across the sea!\n@c0@"
  ja: "@a@b%a002010「この　うかぶ島が　あれば\n\tもう　海の　向こうにも\n\tラクラク　行けるわね！\n@c0@"
  ko: "@a@b%a002010: 이 부유하는 섬이 있으면\n이제 바다 건너편에도\n쉽게 갈 수 있겠어!\n@c0@"
  sl: "@a@b%a002010：有了这座岛的话，\n　　即使是大洋彼岸，\n　　我们也能轻松到达呢！\n@c0@"
  tl: "@a@b%a002010：有了這座島的話，\n　　即使是大洋彼岸，\n　　我們也能輕鬆到達呢！\n@c0@"
