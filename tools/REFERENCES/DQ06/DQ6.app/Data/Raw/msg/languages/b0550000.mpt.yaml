0:
  en: "@a%0%a002000@bHuh. Seems a lot livelier around here than before, aye?\n@c0@"
  ja: "@a@b%a002000「へえっ\n\tなんだか　前より　活気が\n\t出てきたんじゃないか？\n@c0@"
  ko: "@a@b%a002000: 호오,\n전에 비해 활기가\n도는 것 같은데?\n@c0@"
  sl: "@a@b%a002000：哎，\n　　这镇子跟之前比起来\n　　有活力多了呢。\n@c0@"
  tl: "@a@b%a002000：哎，\n　　這鎮子跟之前比起來\n　　有活力多了呢。\n@c0@"
1:
  en: "@a%0%a002010@bThe cruel wind that was blowing before seems like a fresh breeze now, doesn't it?\n@c0@"
  ja: "@a@b%a002010「こころなしか\n\t町を吹きぬける　風が\n\tさわやかに　なったようだわ。\n@c0@"
  ko: "@a@b%a002010: 기분 탓인지\n마을에 부는 바람이\n상쾌해진 것만 같아.\n@c0@"
  sl: "@a@b%a002010：是我的错觉吗？\n　　吹过镇子的风\n　　好像都变得清爽起来了呢。\n@c0@"
  tl: "@a@b%a002010：是我的錯覺嗎？\n　　吹過鎮子的風\n　　好像都變得清爽起來了呢。\n@c0@"
2:
  en: "@a%0%a002020@bThe sand sure hasn't gone anywhere, huh?\n@c0@"
  ja: "@a@b%a002020「あいかわらず\n\t砂だらけだねー。\n@c0@"
  ko: "@a@b%a002020: 여전히\n모래뿐이네~\n@c0@"
  sl: "@a@b%a002020：还是老样子，\n　　到处都是沙呢。\n@c0@"
  tl: "@a@b%a002020：還是老樣子，\n　　到處都是沙呢。\n@c0@"
3:
  en: "@a%0%a002030@bAridea seems a good deal less desolate already.\n@c0@"
  ja: "@a@b%a002030「カルカド……\n\tもう　なにも　ない町では\n\tありませんね。\n@c0@"
  ko: "@a@b%a002030: 캘커드......\n이제 아무것도 없는 마을이\n아니군요.\n@c0@"
  sl: "@a@b%a002030：加尔加德……\n　　已经不再是个\n　　什么都没有的镇子了吧。\n@c0@"
  tl: "@a@b%a002030：加爾加德……\n　　已經不再是個\n　　什麼都沒有的鎮子了吧。\n@c0@"
4:
  en: "@a%0%a002050@bI wonder where all the folks who've returned from the Isle o' Smiles have got to...\n@c0@"
  ja: "@a@b%a002050「さて　もどってきた\n\tみなさんは　どちらに\n\tいらっしゃるでしょうか。\n@c0@"
  ko: "@a@b%a002050: 자, 돌아온\n마을 분들은 어디에\n계실까요?\n@c0@"
  sl: "@a@b%a002050：大家回来之后，\n　　都在哪里呢？\n@c0@"
  tl: "@a@b%a002050：大家回來之後，\n　　都在哪裡呢？\n@c0@"
5:
  en: "@a%0%a002000@bThat lady's mood turned right around, aye?\n@c0@"
  ja: "@a@b%a002000「おばさん　すっかり\n\t表情が　明るくなってるな。\n@c0@"
  ko: "@a@b%a002000: 아줌마, 표정이\n완전히 밝아졌군.\n@c0@"
  sl: "@a@b%a002000：大婶的表情\n　　变得开朗了呢。\n@c0@"
  tl: "@a@b%a002000：大嬸的表情\n　　變得開朗了呢。\n@c0@"
6:
  en: "@a%0%a002010@bI can't wait to see everyone who returned.\n@c0@"
  ja: "@a@b%a002010「町に　もどってきた\n\t皆さんの　ようすを\n\tたくさん　見たいわ。\n@c0@"
  ko: "@a@b%a002010: 마을로 돌아온\n사람들의 모습을\n많이 보고 싶어.\n@c0@"
  sl: "@a@b%a002010：真想好好\n　　看一看大家\n　　回来之后的样子。\n@c0@"
  tl: "@a@b%a002010：真想好好\n　　看一看大家\n　　回來之後的樣子。\n@c0@"
7:
  en: "@a%0%a002020@bSure is refreshing to see folks happy around here.\n@c0@"
  ja: "@a@b%a002020「よろこんで　もらえて\n\tあたしたちも　うれしいわよね。\n@c0@"
  ko: "@a@b%a002020: 기뻐해 주니\n우리도 기분이 좋네.\n@c0@"
  sl: "@a@b%a002020：看到他们开心的话，\n　　我们也很高兴呢。\n@c0@"
  tl: "@a@b%a002020：看到他們開心的話，\n　　我們也很高興呢。\n@c0@"
8:
  en: "@a%0%a002030@bI pray that Aridea gets itself back on its feet.\n@c0@"
  ja: "@a@b%a002030「これから　ここが\n\t少しずつでも　ゆたかな町に\n\tなっていくと　いいですね。\n@c0@"
  ko: "@a@b%a002030: 앞으로 이곳이\n조금씩 풍요로운 마을로\n변해 가면 좋겠군요.\n@c0@"
  sl: "@a@b%a002030：要是今后这里\n　　逐渐变得富饶起来的话\n　　就好了。\n@c0@"
  tl: "@a@b%a002030：要是今後這裡\n　　逐漸變得富饒起來的話\n　　就好了。\n@c0@"
9:
  en: "@a%0%a002050@bI take it there'll be no mass exodus next time there's a full moon!\n@c0@"
  ja: "@a@b%a002050「これからは　満月の夜に\n\t人びとが　つれさられることも\n\tありませんしね！\n@c0@"
  ko: "@a@b%a002050: 앞으로는 보름달이 뜨는 밤에\n사람들이 사라지는 일도\n없을 겁니다!\n@c0@"
  sl: "@a@b%a002050：今后在月圆之夜，\n　　不会再有人被带走了吧！\n@c0@"
  tl: "@a@b%a002050：今後在月圓之夜，\n　　不會再有人被帶走了吧！\n@c0@"
10:
  en: "@a%0%a002000@bAll's well if ya have a workin' well, aye?\n@c0@"
  ja: "@a@b%a002000「井戸は　生活の\n\t基本中の　基本だからな。\n\t水が出ると　いいよなあ。\n@c0@"
  ko: "@a@b%a002000: 우물은 생활하는 데 있어\n기본 중의 기본이지.\n물이 나와야 할 텐데.\n@c0@"
  sl: "@a@b%a002000：井在生活中\n　　是基础中的基础啊。\n　　要是能出水就好了。\n@c0@"
  tl: "@a@b%a002000：井在生活中\n　　是基礎中的基礎啊。\n　　要是能出水就好了。\n@c0@"
11:
  en: "@a%0%a002010@bIt's impossible to work together when everyone is only focused on their own happiness.\n@c0@"
  ja: "@a@b%a002010「自分の　しあわせのことで\n\t頭がいっぱいで　みんなの心が\n\tバラバラな　感じだったものね。\n@c0@"
  ko: "@a@b%a002010: 자신의 행복에\n정신이 팔려서 사람들의 마음이\n모두 흩어져 있었던 거야.\n@c0@"
  sl: "@a@b%a002010：过去，这里的人满脑子\n　　只考虑自己的幸福，\n　　结果人心变得涣散了呢。\n@c0@"
  tl: "@a@b%a002010：過去，這裡的人滿腦子\n　　只考慮自己的幸福，\n　　結果人心變得渙散了呢。\n@c0@"
12:
  en: "@a%0%a002020@bIf they succeed, maybe things'll start looking a little greener around here.\n@c0@"
  ja: "@a@b%a002020「井戸に　お水さえ\n\t出てくれれば　お花も　草も\n\tみんな　元気になるよね。\n@c0@"
  ko: "@a@b%a002020: 우물에서 물만\n나와 준다면 꽃도 풀도\n모두 싱싱해질 텐데.\n@c0@"
  sl: "@a@b%a002020：只要井里能出水，\n　　花草树木都能\n　　打起精神了吧。\n@c0@"
  tl: "@a@b%a002020：只要井裡能出水，\n　　花草樹木都能\n　　打起精神了吧。\n@c0@"
13:
  en: "@a%0%a002030@bI pray that both the well and the town experience a full recovery!\n@c0@"
  ja: "@a@b%a002030「井戸と　いっしょに\n\t町も　生き返る　という\n\tわけですね！\n@c0@"
  ko: "@a@b%a002030: 우물과 함께\n마을도 되살아나는\n느낌이군요!\n@c0@"
  sl: "@a@b%a002030：镇子也跟井一样，\n　　能够重现生机了呢！\n@c0@"
  tl: "@a@b%a002030：鎮子也跟井一樣，\n　　能夠重現生機了呢！\n@c0@"
14:
  en: "@a%0%a002050@bIf the townsfolk put some effort in, the well'll be flowin' in no time.\n@c0@"
  ja: "@a@b%a002050「早く　井戸が\n\t復活すると　いいですねえ。\n@c0@"
  ko: "@a@b%a002050: 어서 우물이\n부활하면 좋겠군요.\n@c0@"
  sl: "@a@b%a002050：要是井能\n　　早些复苏就好了呢。\n@c0@"
  tl: "@a@b%a002050：要是井能\n　　早些復甦就好了呢。\n@c0@"
15:
  en: "@a%0%a002000@bHardy har! Ain't that romantical 'n' everything like that!\n@c0@"
  ja: "@a@b%a002000「何は　ともあれ\n\tよかったよな！\n@c0@"
  ko: "@a@b%a002000: 뭐 어찌 됐든\n다행이군!\n@c0@"
  sl: "@a@b%a002000：不管怎么说，\n　　这真是太好了！\n@c0@"
  tl: "@a@b%a002000：不管怎麼說，\n　　這真是太好了！\n@c0@"
16:
  en: "@a%0%a002010@bI assume that's his wife? I wonder what she sees in a lout like him?\n@c0@"
  ja: "@a@b%a002010「となりの　女性が\n\t奥さんなのね。\n\t若くて　きれいな人じゃない。\n@c0@"
  ko: "@a@b%a002010: 옆에 있는 여성이\n부인인가 봐.\n젊고 예쁜걸?\n@c0@"
  sl: "@a@b%a002010：旁边的那位\n　　就是他的妻子吧。\n　　真是个年轻貌美的人啊。\n@c0@"
  tl: "@a@b%a002010：旁邊的那位\n　　就是他的妻子吧。\n　　真是個年輕貌美的人啊。\n@c0@"
17:
  en: "@a%0%a002020@bYou think he'll quit drinking now that he's got her back? Somehow I doubt it...\n@c0@"
  ja: "@a@b%a002020「これでもう　お酒は\n\tやめられるのかな。\n@c0@"
  ko: "@a@b%a002020: 이제 이걸로 술은\n끊을 수 있는 걸까?\n@c0@"
  sl: "@a@b%a002020：今后他能\n　　戒酒了吧。\n@c0@"
  tl: "@a@b%a002020：今後他能\n　　戒酒了吧。\n@c0@"
18:
  en: "@a%0%a002030@bThey seem to have rekindled their love.\n@c0@"
  ja: "@a@b%a002030「よっぽど\n\tホレて　いるようですね……。\n@c0@"
  ko: "@a@b%a002030: 정말\n홀딱 반한 모양이군요......\n@c0@"
  sl: "@a@b%a002030：他真的很爱妻子呢……\n@c0@"
  tl: "@a@b%a002030：他真的很愛妻子呢……\n@c0@"
19:
  en: "@a%0%a002050@bI hope that couple can put the past behind 'em and come out of this stronger.\n@c0@"
  ja: "@a@b%a002050「これからだって\n\t苦労するかも　しれませんが\n\tがんばって　もらいましょう。\n@c0@"
  ko: "@a@b%a002050: 앞으로도\n고생할지도 모르겠지만\n열심히 하세요.\n@c0@"
  sl: "@a@b%a002050：虽然今后会有诸多劳苦，\n　　但是请加油吧。\n@c0@"
  tl: "@a@b%a002050：雖然今後會有諸多勞苦，\n　　但是請加油吧。\n@c0@"
20:
  en: "@a%0%a002000@bHoneymoon's over, aye?\n@c0@"
  ja: "@a@b%a002000「このヨメさんじゃ\n\t一生　苦労しそうだよな。\n@c0@"
  ko: "@a@b%a002000: 이런 부인이라면\n평생 고생하겠군.\n@c0@"
  sl: "@a@b%a002000：娶这么个姑娘的话，\n　　一辈子都没好日子过吧。\n@c0@"
  tl: "@a@b%a002000：娶這麼個姑娘的話，\n　　一輩子都沒好日子過吧。\n@c0@"
21:
  en: "@a%0%a002000@bOr maybe she's just attracted to the bad-boy type.\n@c0@"
  ja: "@a@b%a002000「まあ　それが　よくて\n\tいっしょに　なったのかも\n\tしれないから　ま　いっか。\n@c0@"
  ko: "@a@b%a002000: 뭐, 그게 좋아서\n결혼했을지도 모르는 일이니\n상관없나?\n@c0@"
  sl: "@a@b%a002000：唉，\n　　也许人家两口子就是这么\n　　你情我愿的呢。算了。\n@c0@"
  tl: "@a@b%a002000：唉，\n　　也許人家兩口子就是這麼\n　　你情我願的呢。算了。\n@c0@"
22:
  en: "@a%0%a002010@bAt least she seems to know her husband well...\n@c0@"
  ja: "@a@b%a002010「だんなさまも\n\tたいへんだわね。\n@c0@"
  ko: "@a@b%a002010: 남편도\n참 힘들겠네.\n@c0@"
  sl: "@a@b%a002010：她丈夫\n　　真不容易呢。\n@c0@"
  tl: "@a@b%a002010：她丈夫\n　　真不容易呢。\n@c0@"
23:
  en: "@a%0%a002020@bHuh... She's not the kind of wife I imagined he'd have, that's for sure...\n@c0@"
  ja: "@a@b%a002020「ふーん\n\tあの人　こういうタイプのコが\n\t好きなんだ……。\n@c0@"
  ko: "@a@b%a002020: 흐음~\n저 사람은 이런 타입의 여자를\n좋아하는구나......\n@c0@"
  sl: "@a@b%a002020：哎，\n　　那个人喜欢这个类型的啊……\n@c0@"
  tl: "@a@b%a002020：哎，\n　　那個人喜歡這個類型的啊……\n@c0@"
24:
  en: "@a%0%a002030@bHer husband will have to pull out all the stops to make it up to her.\n@c0@"
  ja: "@a@b%a002030「だんなさまが\n\tしあわせの国の　うめあわせを\n\tさせられるのですね……。\n@c0@"
  ko: "@a@b%a002030: 행복의 나라에 대한 보충을\n남편이 하셔야\n하는 거군요......\n@c0@"
  sl: "@a@b%a002030：她丈夫\n　　要对幸福国的事情\n　　作补偿啊……\n@c0@"
  tl: "@a@b%a002030：她丈夫\n　　要對幸福國的事情\n　　作補償啊……\n@c0@"
25:
  en: "@a%0%a002050@bI've got a funny feelin' I know why she set her sights on a new life on the Isle o' Smiles.\n@c0@"
  ja: "@a@b%a002050「たしかに　この奥さんなら\n\tまっ先に　しあわせの国を\n\tめざしそうですね。\n@c0@"
  ko: "@a@b%a002050: 하긴, 이 부인이라면\n제일 먼저 행복의 나라로\n찾아갔겠군요.\n@c0@"
  sl: "@a@b%a002050：这位夫人的话，\n　　的确像是会第一个\n　　冲向幸福国的人呢。\n@c0@"
  tl: "@a@b%a002050：這位夫人的話，\n　　的確像是會第一個\n　　衝向幸福國的人呢。\n@c0@"
26:
  en: "@a%0%a002000@bThat's what happens when you give in to your base desires. You get burned.\n@c0@"
  ja: "@a@b%a002000「あまい　ゆうわくが\n\tにがい経験を　呼んじまったって\n\tとこかな。\n@c0@"
  ko: "@a@b%a002000: 달콤한 유혹이\n씁쓸한 경험을\n불러왔군.\n@c0@"
  sl: "@a@b%a002000：甜蜜的诱惑\n　　换来了痛苦的回忆呢。\n@c0@"
  tl: "@a@b%a002000：甜蜜的誘惑\n　　換來了痛苦的回憶呢。\n@c0@"
27:
  en: "@a%0%a002000@b...Whoa, I'm startin' to sound all serious 'n' everything like that. I need to lighten up!\n@c0@"
  ja: "@a@b%a002000「おっと。　ガラにもなく\n\tまじめなこと　言っちまったぜ。\n@c0@"
  ko: "@a@b%a002000: 오옷. 나답지 않게\n제법 쓸 만한 말을 했는걸.\n@c0@"
  sl: "@a@b%a002000：哎呀，说了这么正经的话，\n　　真不符合俺的风格。\n@c0@"
  tl: "@a@b%a002000：哎呀，說了這麼正經的話，\n　　真不符合俺的風格。\n@c0@"
28:
  en: "@a%0%a002010@bI sense that he learnt an important lesson on the Isle, one that'll stay with him for the rest of his life.\n@c0@"
  ja: "@a@b%a002010「しあわせの国で\n\t失敗したことを　生かせれば\n\tこの先の　人生は　大丈夫ね。\n@c0@"
  ko: "@a@b%a002010: 행복의 나라에서\n실패한 경험을 살리면\n앞으로의 인생은 걱정 없을 거야.\n@c0@"
  sl: "@a@b%a002010：能从幸福国的失败中\n　　吸取教训的话，\n　　今后的人生也会一帆风顺吧。\n@c0@"
  tl: "@a@b%a002010：能從幸福國的失敗中\n　　吸取教訓的話，\n　　今後的人生也會一帆風順吧。\n@c0@"
29:
  en: "@a%0%a002020@bOh, please. I bet we could start a rumour about the ‘Glen o' Grins’ and he'd go lookin' for it all over again.\n@c0@"
  ja: "@a@b%a002020「こういう男は\n\t超しあわせの国！　なんていうのが\n\t来たら　また行く　タイプね。\n@c0@"
  ko: "@a@b%a002020: 이런 남자는\n'진짜 행복의 나라' 같은 게\n오면 또 달려갈 타입이네.\n@c0@"
  sl: "@a@b%a002020：这种男的，\n　　要是下次来个什么超级幸福国，\n　　他还会去的吧。\n@c0@"
  tl: "@a@b%a002020：這種男的，\n　　要是下次來個什麼超級幸福國，\n　　他還會去的吧。\n@c0@"
30:
  en: "@a%0%a002030@bHe at least appears to have come out of this experience a little wiser.\n@c0@"
  ja: "@a@b%a002030「今回のことで\n\tそうとう　コリた　ようですね。\n@c0@"
  ko: "@a@b%a002030: 이번 일로\n완전히 진저리가 난 모양이군요.\n@c0@"
  sl: "@a@b%a002030：这次的事情\n　　能给他好好上一课呢。\n@c0@"
  tl: "@a@b%a002030：這次的事情\n　　能給他好好上一課呢。\n@c0@"
31:
  en: "@a%0%a002050@bYou can't be happy all the time! What would life be without a few rough edges?\n@c0@"
  ja: "@a@b%a002050「世の中は　あまかったり\n\tからかったり　しょっぱかったり\n\tいろんな味が　しますよね！\n@c0@"
  ko: "@a@b%a002050: 세상은 달콤하기도 하고\n매콤하기도 하고 짭짤하기도 하고\n여러 맛이 나죠!\n@c0@"
