0:
  en: "@a@b*: Ahhh, now THIS is water! It is nice finally to — how you say? — wet my whistle!\n@c0@"
  ja: "@a@b＊「ごく　ごくっ\n\tいやあ　のどが\n\tうるおいましたよ。\n@c0@"
  ko: "@a@b*: 꿀꺽꿀꺽\n캬~ 이제야 갈증이\n싹 가셨구려.\n@c0@"
  sl: "@a@b＊：咕嘟，咕嘟，\n　　哎呀呀，\n　　喉咙终于不干了。\n@c0@"
  tl: "@a@b＊：咕嘟，咕嘟，\n　　哎呀呀，\n　　喉嚨終於不乾了。\n@c0@"
1:
  en: "@a@b*: At my age, I probably should avoid the dangerous journeys like this.\n@c0@"
  ja: "@a@b＊「この　としよりに　長旅は\n\tすこしばかり　きついようです。\n@c0@"
  ko: "@a@b*: 이 나이에 솔직히\n긴 여행은 무리지요.\n@c0@"
  sl: "@a@b＊：这么长的旅途，\n　　我这上年纪的有点吃不消啊。\n@c0@"
  tl: "@a@b＊：這麼長的旅途，\n　　我這上年紀的有點吃不消啊。\n@c0@"
2:
  en: "@a@b*: What's that you say? Where am I going?\n@c0@"
  ja: "@a@b＊「えっ　旅の目的？\n@c0@"
  ko: "@a@b*: 음? 여행의 목적?\n@c0@"
  sl: "@a@b＊：你问旅行目的？\n@c0@"
  tl: "@a@b＊：你問旅行目的？\n@c0@"
3:
  en: "@a@b*: Let us just say that I'm searching for the misplaced dream and leave it at that.\n@c0@"
  ja: "@a@b＊「おはずかしいが\n\tなくした　ゆめを　さがしに……\n\tとでも　言っておきましょうか。\n@c0@"
  ko: "@a@b*: 좀 쑥스럽지만\n잃어버린 꿈을 찾아서......\n라고 말해 두지요.\n@c0@"
  sl: "@a@b＊：有点不好意思，\n　　我在寻找逝去的梦……\n　　姑且算是吧。\n@c0@"
  tl: "@a@b＊：有點不好意思，\n　　我在尋找逝去的夢……\n　　姑且算是吧。\n@c0@"
4:
  en: "@a@b*: But as you can see, this is just a boring old cave. Nothing here, am I wrong?\n@c0@"
  ja: "@a@b＊「しかし　見てのとおり　ここは\n\tなにもない　洞くつ。\n@c0@"
  ko: "@a@b*: 하지만 보다시피 여기는\n아무것도 없는 동굴.\n@c0@"
  sl: "@a@b＊：不过你也看到了，\n　　这洞窟里什么也没有。\n@c0@"
  tl: "@a@b＊：不過你也看到了，\n　　這洞窟裡什麼也沒有。\n@c0@"
5:
  en: "@a@b*: If that is all, then I shall be bidding you the good day! Farewell!\n@c0@"
  ja: "@a@b＊「あなたがたには　ご用は\n\tないでしょう。\n@c0@"
  ko: "@a@b*: 당신들에겐 볼일\n없을 겝니다.\n@c0@"
  sl: "@a@b＊：你们留在这里\n　　也没什么用吧。\n@c0@"
  tl: "@a@b＊：你們留在這裡\n　　也沒什麼用吧。\n@c0@"
6:
  en: "@a@b*: Welcome to Amor, home of amor seco essence. Accept no substitute!\n@c0@"
  ja: "@a@b＊「水　きよき町\n\tアモールに　ようこそ。\n@c0@"
  ko: "@a@b*: 물 맑은 마을\n아모르에 어서 와.\n@c0@"
  sl: "@a@b＊：欢迎来到\n　　清水镇爱摩尔。\n@c0@"
  tl: "@a@b＊：歡迎來到\n　　清水鎮愛摩爾。\n@c0@"
7:
  en: "@a@b*: I take it you're here to sample our famed amor seco essence, made from our peerlessly pure water?\n@c0@"
  ja: "@a@b＊「あなたたちも　アモール川の\n\t水を　くみに　いらしたの？\n@c0@"
  ko: "@a@b*: 당신들도 아모르 강물을\n길으러 오신 건가?\n@c0@"
  sl: "@a@b＊：你们也是来取\n　　爱摩尔河的水吗？\n@c0@"
  tl: "@a@b＊：你們也是來取\n　　愛摩爾河的水嗎？\n@c0@"
8:
  en: "@a@b*: Of course you are! Beware cheap imitations! Only real amor seco essence hits the spot!\n@c0@"
  ja: "@a@b＊「そうっ　やっぱり。\n\tあなたたちの町でも\n\tこの川の水は　有名なのね！\n@c0@"
  ko: "@a@b*: 그래, 역시.\n당신들 마을에서도\n이 강물이 유명하구나!\n@c0@"
  sl: "@a@b＊：嗯，果然是啊。\n　　在你们那个镇子，\n　　这条河的水也很有名吧！\n@c0@"
  tl: "@a@b＊：嗯，果然是啊。\n　　在你們那個鎮子，\n　　這條河的水也很有名吧！\n@c0@"
9:
  en: "@a@b*: ...You're not? Well, you're missing out! Take a draught of amor seco essence to cure what ails you!\n@c0@"
  ja: "@a@b＊「この川の水を　わかして　のめば\n\tたいがいの　病気は\n\tなおって　しまうのよ！\n@c0@"
  ko: "@a@b*: 이 강의 물을 끓여서 마시면\n대부분의 병은\n깨끗이 낫거든!\n@c0@"
  sl: "@a@b＊：把这条河的水\n　　烧开了喝下去，\n　　能治许多病呢！\n@c0@"
  tl: "@a@b＊：把這條河的水\n　　燒開了喝下去，\n　　能治許多病呢！\n@c0@"
10:
  en: "@a@b*: We grew up drinking Amor's water, so we're bursting with rude health!\n@c0@"
  ja: "@a@b＊「この町は　水が　とっても\n\tきれいでしょ。　だから\n\tみんな　長生きなの。\n@c0@"
  ko: "@a@b*: 이 마을 물이 아주\n맑고 깨끗하지? 바로 이게\n장수의 비결이야.\n@c0@"
  sl: "@a@b＊：这个小镇的水很清澈对吧。\n　　所以镇上的\n　　人们全都非常长寿。\n@c0@"
  tl: "@a@b＊：這個小鎮的水很清澈對吧。\n　　所以鎮上的\n　　人們全都非常長壽。\n@c0@"
11:
  en: "@a@b*: Of all the monsters I've faced in my time, that ol' dragon workin' in the church is the fiercest!\n@c0@"
  ja: "@a@b＊「いやはや　まいってしまったよ。\n\t教会で　下ばたらきをしている\n\tばあさんが　うるさくてな。\n@c0@"
  ko: "@a@b*: 나 참, 미치겠다니까.\n성당에서 허드렛일을 하고 있는\n할머니의 잔소리가 보통 심해야지.\n@c0@"
  sl: "@a@b＊：哎呀哎呀，真是头疼。\n　　在教会做杂事的那个婆婆\n　　简直烦死人了。\n@c0@"
  tl: "@a@b＊：哎呀哎呀，真是頭疼。\n　　在教會做雜事的那個婆婆\n　　簡直煩死人了。\n@c0@"
12:
  en: "@a@b*: I just said I was lookin' for treasure and she 'ad a right go at me! Nearly bit my 'ead off, she did!\n@c0@"
  ja: "@a@b＊「オレが　宝をさがして旅をしてる\n\tといったら　思いっきり\n\t説教をたれるんだよ。\n@c0@"
  ko: "@a@b*: 내가 보물을 찾아\n여행 중이라고 하니까 기다렸다는 듯\n설교를 퍼붓더라고.\n@c0@"
  sl: "@a@b＊：我说我在寻找宝藏，\n　　没想到被她\n　　狠狠地训了一顿。\n@c0@"
  tl: "@a@b＊：我說我在尋找寶藏，\n　　沒想到被她\n　　狠狠地訓了一頓。\n@c0@"
13:
  en: "@a@b*: She seems to 'ave some bee in 'er bonnet about treasure-'unters. 'Ates 'em wiv a passion, she does!\n@c0@"
  ja: "@a@b＊「あの　ばあさん　よっぽど\n\t宝さがしをしている連中が\n\tきらいなんだな。\n@c0@"
  ko: "@a@b*: 그 할머니, 어지간히\n보물 찾는 사람들이\n싫은 모양이야.\n@c0@"
  sl: "@a@b＊：那个老婆婆\n　　对寻找宝藏的人\n　　非常厌恶吧。\n@c0@"
  tl: "@a@b＊：那個老婆婆\n　　對尋找寶藏的人\n　　非常厭惡吧。\n@c0@"
14:
  en: "@a@b*: For now, the waters of Amor run clear, but I live in fear of the day the Dread Fiend descends upon us.\n@c0@"
  ja: "@a@b＊「あたしゃ　こわいよ。\n\tそのうち　魔王が　この町を\n\tおそうんじゃないかってね。\n@c0@"
  ko: "@a@b*: 난 무서워 죽겠어.\n조만간 마왕이 이 마을을\n습격해올까 봐 말이야.\n@c0@"
  sl: "@a@b＊：我很害怕呀。\n　　不知道什么时候，\n　　魔王就会袭击这个镇子。\n@c0@"
  tl: "@a@b＊：我很害怕呀。\n　　不知道什麼時候，\n　　魔王就會襲擊這個鎮子。\n@c0@"
15:
  en: "@a@b*: His sole desire seems to be to destroy all beauty and taint all purity.\n@c0@"
  ja: "@a@b＊「だって　そうだろう。\n\t魔王が　こんな　きれいな水を\n\tほうっておくわけが　ないよ。\n@c0@"
  ko: "@a@b*: 생각해 봐.\n마왕이 이렇게 깨끗한 물을\n내버려둘 리 없잖아?\n@c0@"
  sl: "@a@b＊：这是当然的吧。\n　　这么纯净的水，\n　　魔王一定想要。\n@c0@"
  tl: "@a@b＊：這是當然的吧。\n　　這麼純淨的水，\n　　魔王一定想要。\n@c0@"
16:
  en: "@a@b*: Ah, more tourists. Just what we need! Anyway, I suppose that cave to the north is in your guidebook?\n@c0@"
  ja: "@a@b＊「あんたら　よその町から\n\t来なすったのかい？　だったら\n\tこの町の北に　洞くつがあったろ？\n@c0@"
  ko: "@a@b*: 너희들 다른 마을에서\n왔어? 그럼\n이 마을의 북쪽에서 동굴을 봤겠군?\n@c0@"
  sl: "@a@b＊：你们是从外面来的吧？\n　　是不是看到了\n　　镇北边的洞窟？\n@c0@"
  tl: "@a@b＊：你們是從外面來的吧？\n　　是不是看到了\n　　鎮北邊的洞窟？\n@c0@"
17:
  en: "@a@b*: Well, I suppose tourists nowadays aren't interested in old, blocked-up caves...\n@c0@"
  ja: "@a@b＊「そうか　見なかったか。\n\tだったら　もう　完全に\n\tふさがったのかもしれんな。\n@c0@"
  ko: "@a@b*: 그래, 못 봤군.\n그럼 이제 완전히\n막혔는지도 모르겠군.\n@c0@"
  sl: "@a@b＊：是吗，你没见过啊。\n　　那里现在也许已经\n　　完全塌方了。\n@c0@"
  tl: "@a@b＊：是嗎，你沒見過啊。\n　　那裡現在也許已經\n　　完全塌方了。\n@c0@"
18:
  en: "@a@b*: WHAT'S THAT!? I'M AFRAID YOU'LL HAVE TO SPEAK UP!\n@c0@"
  ja: "@a@b＊「ああ？　なんじゃと？\n@c0@"
  ko: "@a@b*: 응? 뭐라고?\n@c0@"
  sl: "@a@b＊：啊啊？你说什么？\n@c0@"
  tl: "@a@b＊：啊啊？你說什麼？\n@c0@"
19:
  en: "@a@b*: THE CAVE, YOU SAY? THE ROOF COLLAPSED YEARS AGO SO YOU WON'T GET FAR GOING IN THERE!\n@c0@"
  ja: "@a@b＊「洞くつは　とっくに\n\tくずれてしまって\n\tなかには　すすめんぞ。\n@c0@"
  ko: "@a@b*: 동굴은 오래 전에\n무너져서\n안으로 들어갈 수 없다네.\n@c0@"
  sl: "@a@b＊：洞窟里面塌方了，\n　　现在进不去了。\n@c0@"
  tl: "@a@b＊：洞窟裡面塌方了，\n　　現在進不去了。\n@c0@"
20:
  en: "@a@b*: WHAT'S THAT!? YOU DIDN'T ASK ME ABOUT THAT, YOU SAY!?\n@c0@"
  ja: "@a@b＊「ああ　なに？\n\tそんなことは　聞いておらんと？\n@c0@"
  ko: "@a@b*: 으응? 뭣이?\n그런 거 안 물어봤다고?\n@c0@"
  sl: "@a@b＊：啊，什么？\n　　你没问这个？\n@c0@"
  tl: "@a@b＊：啊，什麼？\n　　你沒問這個？\n@c0@"
21:
  en: "@a@b*: FORGIVE ME! WITH THE SOUND OF THAT WATERFALL, I CAN BARELY HEAR MYSELF THINK!\n@c0@"
  ja: "@a@b＊「すまんのう。\n\t滝の音が　うるそうて\n\tよく　聞こえんのじゃよ……。\n@c0@"
  ko: "@a@b*: 미안허이.\n폭포 소리가 시끄러워서\n잘 안 들리네......\n@c0@"
  sl: "@a@b＊：不好意思。\n　　瀑布声音太大，\n　　我听不清……\n@c0@"
  tl: "@a@b＊：不好意思。\n　　瀑布聲音太大，\n　　我聽不清……\n@c0@"
22:
  en: "@a@b*: You've come in high season! The tourists are out in force, so I'm afraid there's no room at the inn.\n@c0@"
  ja: "@a@b＊「旅の宿に　ようこそ！\n\tと　いいたいところですが\n\t今日は　もう　いっぱいなんです。\n@c0@"
  ko: "@a@b*: 우리 여관에 어서 오세요!\n...라고 말하고 싶지만\n오늘은 이미 꽉 차서요.\n@c0@"
  sl: "@a@b＊：欢迎光临旅店！\n　　虽然想留您住店，\n　　不过今天已经满员了。\n@c0@"
  tl: "@a@b＊：歡迎光臨旅店！\n　　雖然想留您住店，\n　　不過今天已經滿員了。\n@c0@"
23:
  en: "@a@b*: I'm really sorry, but you should have made a reservation in advance! Better luck next time...\n@c0@"
  ja: "@a@b＊「すいませんねえ。\n\tまた　来てくださいよ。\n@c0@"
  ko: "@a@b*: 죄송하게 됐네요.\n다음에 들러 주세요.\n@c0@"
  sl: "@a@b＊：不好意思啊。\n　　请您下次再来吧。\n@c0@"
  tl: "@a@b＊：不好意思啊。\n　　請您下次再來吧。\n@c0@"
24:
  en: "@a@b*: If you've just arrived in town, you must be looking for a place to lay your weary heads.\n@c0@"
  ja: "@a@b＊「おや　あなたたちも　この町に\n\t着いたばかりですね。\n@c0@"
  ko: "@a@b*: 아하, 당신들도 이 마을에\n지금 막 도착한 모양이군요.\n@c0@"
  sl: "@a@b＊：哦哦，你们几位\n　　也刚到这镇子上吧。\n@c0@"
  tl: "@a@b＊：哦哦，你們幾位\n　　也剛到這鎮子上吧。\n@c0@"
25:
  en: "@a@b*: But I'm afraid you're not the only ones. This inn often gets booked up well in advance.\n@c0@"
  ja: "@a@b＊「でも　ちょっと　おそかった。\n\tもう　部屋は　いっぱいかも\n\tしれませんよ。\n@c0@"
  ko: "@a@b*: 그런데 한발 늦었네요.\n이미 객실이 다 찼을지도\n모르거든요.\n@c0@"
  sl: "@a@b＊：不过有点晚了。\n　　大概已经没有空房间了。\n@c0@"
  tl: "@a@b＊：不過有點晚了。\n　　大概已經沒有空房間了。\n@c0@"
26:
  en: "@a@b*: You can have a word with the innkeeper, but I doubt he'll even have a broom cupboard for you to squeeze into.\n@c0@"
  ja: "@a@b＊「ねんのため　宿屋の主人に\n\t聞いてみたら　どうです。\n@c0@"
  ko: "@a@b*: 혹시 모르니까 여관 주인에게\n물어보시든지요.\n@c0@"
  sl: "@a@b＊：你可以去问问旅店主人。\n@c0@"
  tl: "@a@b＊：你可以去問問旅店主人。\n@c0@"
27:
  en: "@a@b*: The innkeeper told me that this inn only uses water drawn from its own well.\n@c0@"
  ja: "@a@b＊「宿の主人から　聞いたのですが\n\tこの店では　川の水ではなく\n\t井戸水を　使っているそうです。\n@c0@"
  ko: "@a@b*: 여관 주인한테 들었습니다만,\n이 가게에서는 강물이 아니라\n우물물을 쓴다는군요.\n@c0@"
  sl: "@a@b＊：我听旅店主人说，\n　　这家店没有用河水，\n　　而是用的井水。\n@c0@"
  tl: "@a@b＊：我聽旅店主人說，\n　　這家店沒有用河水，\n　　而是用的井水。\n@c0@"
28:
  en: "@a@b*: Makes sense, I suppose. If they used Amor's water, the guests would be trying to bottle the stuff and take it home with them.\n@c0@"
  ja: "@a@b＊「まあ　そうでもしないと\n\t勝手に持って行く人も\n\tでてきそうですしね。\n@c0@"
  ko: "@a@b*: 하긴, 안 그랬다간\n마음대로 가져가는 사람도\n있을 테니까요.\n@c0@"
  sl: "@a@b＊：嗯，如果不这么做，\n　　说不定就会有人\n　　随便拿走吧。\n@c0@"
  tl: "@a@b＊：嗯，如果不這麼做，\n　　說不定就會有人\n　　隨便拿走吧。\n@c0@"
29:
  en: "@a@b*: (groan) Hrm? Oh no, not again!\n@c0@"
  ja: "@a@b＊「グガオーンッ！\n\t…………。\n\tどわっ！？\n@c0@"
  ko: "@a@b*: 드르렁~!\n............\n우왓!?\n@c0@"
  sl: "@a@b＊：咣当！\n　　……\n　　哇？！\n@c0@"
  tl: "@a@b＊：咣噹！\n　　……\n　　哇？！\n@c0@"
30:
  en: "@a@b*: Look at the state of me! Upside down again!\n@c0@"
  ja: "@a@b＊「あちゃーっ\n\tまた　はんたいだぜっ。\n@c0@"
  ko: "@a@b*: 아차,\n또 거꾸로 잤군.\n@c0@"
  sl: "@a@b＊：唉呀～\n　　又睡反了。\n@c0@"
  tl: "@a@b＊：唉呀～\n　　又睡反了。\n@c0@"
31:
  en: "@a@b*: Even that sweet amor seco essence hasn't managed to stop me tossing and turning in my sleep...\n@c0@"
  ja: "@a@b＊「さすがに　この川の水でも\n\tオレの　ねぞうの悪さだけは\n\tなおせないようだな。\n@c0@"
  ko: "@a@b*: 역시 이 강물로도\n내 고약한 잠버릇은\n고칠 수 없나 보군.\n@c0@"
  sl: "@a@b＊：我这睡相不好的毛病\n　　这么严重，\n　　竟然连这里的河水都治不好。\n@c0@"
  tl: "@a@b＊：我這睡相不好的毛病\n　　這麼嚴重，\n　　竟然連這裡的河水都治不好。\n@c0@"
32:
  en: "@a@b*: When I was a wee nipper, I heard about a pair of love-struck bandits who came here in search of spoils to plunder.\n@c0@"
