  tl: "@a@b%a002020：要是在一起的話，\n　　就不用這麼累了。真是的。\n@c0@"
53:
  en: "@a%0%a002030@bShall we delve a little deeper into the castle and see what we can find?\n@c0@"
  ja: "@a@b%a002030「とりあえず\n\tもう少し　城の奥の方を\n\tしらべましょう。\n@c0@"
  ko: "@a@b%a002030: 일단\n성 안쪽을 더\n찾아봅시다.\n@c0@"
  sl: "@a@b%a002030：总之，\n　　再到城堡深处看一看吧。\n@c0@"
  tl: "@a@b%a002030：總之，\n　　再到城堡深處看一看吧。\n@c0@"
54:
  en: "@a%0%a002050@bWe need to find that Prince!\n@c0@"
