  sl: "@a@b%a002010：所以王子掀你裙子，\n　　其实是因为他\n　　对你有好感吧。\n@c0@"
  tl: "@a@b%a002010：所以王子掀你裙子，\n　　其實是因為他\n　　對你有好感吧。\n@c0@"
37:
  en: "@a%0%a002020@bYou think if we wait long enough, the Prince'll show up here to put the moves on her?\n@c0@"
  ja: "@a@b%a002020「ここで　待ってたら\n\t王子は　この娘の　スカートを\n\tめくりに　来るかなあ……。\n@c0@"
