  sl: "@a@b%a002020：在这里等的话，\n　　王子会不会来掀\n　　这个姑娘的裙子呢……\n@c0@"
  tl: "@a@b%a002020：在這裡等的話，\n　　王子會不會來掀\n　　這個姑娘的裙子呢……\n@c0@"
38:
  en: "@a%0%a002030@bPerhaps I have something to learn from Prince Howard when it comes to impressing women...\n@c0@"
  ja: "@a@b%a002030「私も　スカートくらい\n\tめくらなくては　一人前じゃ\n\tないのでしょうかね……。\n@c0@"
  ko: "@a@b%a002030: 저도 치마 한 번쯤은\n들춰 봐야 제대로 된 인생 경험을\n했다고 할 수 있을까요......\n@c0@"
  sl: "@a@b%a002030：我要是\n　　不掀裙子的话，\n　　是不是也不算男子汉呢……\n@c0@"
  tl: "@a@b%a002030：我要是\n　　不掀裙子的話，\n　　是不是也不算男子漢呢……\n@c0@"
39:
  en: "@a%0%a002050@bI bet no one's interested in old %a002050's armour collection...\n@c0@"
  ja: "@a@b%a002050「私が　スカートはいて\n\tここで　オトリに　なりましょうか？\n@c0@"
  ko: "@a@b%a002050: 제가 치마를 입고\n여기서 미끼가 되어 볼까요?\n@c0@"
  sl: "@a@b%a002050：要不要我穿上裙子\n　　在这里做诱饵啊？\n@c0@"
  tl: "@a@b%a002050：要不要我穿上裙子\n　　在這裡做誘餌啊？\n@c0@"
40:
  en: "@a%0%a002000@bThat's a good question. How many times do ya think? A hundred-ish?\n@c0@"
  ja: "@a@b%a002000「何回目なんだろう\n\tじっさいの話。\n\t１００回くらい？\n@c0@"
  ko: "@a@b%a002000: 진짜\n몇 번째일까?\n100번째 정도?\n@c0@"
  sl: "@a@b%a002000：说真的，\n　　这是第几次了啊。\n　　有１００次了吗？\n@c0@"
  tl: "@a@b%a002000：說真的，\n　　這是第幾次了啊。\n　　有１００次了嗎？\n@c0@"
41:
  en: "@a%0%a002010@bWe'll do whatever it takes this time!\n@c0@"
  ja: "@a@b%a002010「なんとしても\n\t今回で　最後に　しないとね。\n@c0@"
  ko: "@a@b%a002010: 어떻게 해서든\n이번을 마지막으로 만들어야 해.\n@c0@"
  sl: "@a@b%a002010：真希望这是\n　　最后一次了呢。\n@c0@"
  tl: "@a@b%a002010：真希望這是\n　　最後一次了呢。\n@c0@"
42:
  en: "@a%0%a002020@bThat sneaky Prince missed his calling. He'd make a great thief!\n@c0@"
  ja: "@a@b%a002020「にげ出すための\n\t能力は　超一流の\n\tアスリートなみだわね。\n@c0@"
  ko: "@a@b%a002020: 줄행랑치는\n능력은 초일류\n선수 못지않네.\n@c0@"
  sl: "@a@b%a002020：逃跑的水平\n　　倒是世界一流啊。\n@c0@"
  tl: "@a@b%a002020：逃跑的水平\n　　倒是世界一流啊。\n@c0@"
43:
  en: "@a%0%a002030@bThe last thing we want is to help the Prince break his dubious record.\n@c0@"
  ja: "@a@b%a002030「へんな　記録の\n\tお手伝いは　したくない\n\tものですね……。\n@c0@"
  ko: "@a@b%a002030: 이상한 기록을\n추가해 드리고 싶지는\n않습니다......\n@c0@"
  sl: "@a@b%a002030：真希望他\n　　别帮我们记录这种\n　　奇怪的数据了……\n@c0@"
  tl: "@a@b%a002030：真希望他\n　　別幫我們記錄這種\n　　奇怪的數據了……\n@c0@"
44:
