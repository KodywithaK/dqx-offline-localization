  tl: "@a@b%a002050：%a000090，\n　　要上去的話，\n　　看一眼就馬上下來哦。\n@c0@"
60:
  en: "@a%0%a002000@bI tell ya, he needs to stock up on shut-eye while the Prince is away.\n@c0@"
  ja: "@a@b%a002000「だから　王子が\n\t洞くつ行ってるあいだに\n\tゆっくり　ねろっていうのに。\n@c0@"
  ko: "@a@b%a002000: 그러니까 왕자가\n동굴에 간 사이에\n푹 자 두라고 했는데 말이지.\n@c0@"
  sl: "@a@b%a002000：所以说，\n　　趁着王子去洞窟的时候，\n　　好好睡一觉不就好了吗？\n@c0@"
  tl: "@a@b%a002000：所以說，\n　　趁著王子去洞窟的時候，\n　　好好睡一覺不就好了嗎？\n@c0@"
