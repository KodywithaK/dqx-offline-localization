  ko: "@a@b%a002050: 이야~ 몸을 더 크게\n비트는데요......\n@c0@"
  sl: "@a@b%a002050：哎呀，\n　　摇晃得越来越厉害了……\n@c0@"
  tl: "@a@b%a002050：哎呀，\n　　搖晃得越來越厲害了……\n@c0@"
