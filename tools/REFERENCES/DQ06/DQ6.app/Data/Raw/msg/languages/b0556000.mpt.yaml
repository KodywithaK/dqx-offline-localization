  tl: "@a@b%a002000：%a000090，\n　　要去見國王陛下嗎？\n　　俺倒是沒這個想法……\n@c0@"
56:
  en: "@a%0%a002010@bThe King and Queen are sure to be anxious.\n@c0@"
