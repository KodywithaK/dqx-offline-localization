  sl: "@a@b%a002020：现在不是很想\n　　去见国王陛下呢。\n　　荷尔斯王子又不在……\n@c0@"
  tl: "@a@b%a002020：現在不是很想\n　　去見國王陛下呢。\n　　荷爾斯王子又不在……\n@c0@"
58:
  en: "@a%0%a002030@bWhile I feel that we owe the King a visit, if I go, I go with a heavy heart...\n@c0@"
