81:
  en: "@a%0%a002050@bI hope we get to witness the rite sometime this century...\n@c0@"
  ja: "@a@b%a002050「もうすぐ　私たちが\n\tこの目で　その　ぎしきを……\n\t見られれば　いいですねえ。\n@c0@"
