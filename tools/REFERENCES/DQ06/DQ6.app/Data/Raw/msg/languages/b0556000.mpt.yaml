  en: "@a%0%a002000@bLooks like the kitchen's closed, aye?\n@c0@"
  ja: "@a@b%a002000「食事の　したくは\n\tいちだんらくか。\n@c0@"
  ko: "@a@b%a002000: 식사 준비가\n일단락되었나 보군.\n@c0@"
  sl: "@a@b%a002000：饭做得差不多了啊。\n@c0@"
  tl: "@a@b%a002000：飯做得差不多了啊。\n@c0@"
66:
  en: "@a%0%a002010@bUnfortunately, the situation means the exact opposite for us...\n@c0@"
  ja: "@a@b%a002010「私たちは\n\t休んで　いられないわね。\n@c0@"
  ko: "@a@b%a002010: 우리는\n쉬고 있을 수 없어.\n@c0@"
  sl: "@a@b%a002010：我们不能休息呢。\n@c0@"
  tl: "@a@b%a002010：我們不能休息呢。\n@c0@"
67:
  en: "@a%0%a002020@bAfter dealing with the Prince all this time, I'd say she deserves a break today.\n@c0@"
  ja: "@a@b%a002020「おばさん　ヒマそうね。\n\tホルス王子も　ぬすみ食いに\n\t来てそうに　ないし……。\n@c0@"
  ko: "@a@b%a002020: 아줌마 한가하겠네.\n홀스 왕자가 훔쳐 먹으러\n오지도 않은 것 같고......\n@c0@"
  sl: "@a@b%a002020：大婶好闲的样子呢。\n　　因为荷尔斯王子看起来\n　　也不会来偷吃东西了嘛……\n@c0@"
  tl: "@a@b%a002020：大嬸好閒的樣子呢。\n　　因為荷爾斯王子看起來\n　　也不會來偷吃東西了嘛……\n@c0@"
68:
  en: "@a%0%a002030@bI believe it would be safe to assume that the Prince will not be returning in time for dinner.\n@c0@"
  ja: "@a@b%a002030「この分では　私たちも\n\t王子も　ばんごはんまでには\n\tもどれそうに　なさそうですね。\n@c0@"
  ko: "@a@b%a002030: 이래서는 우리도 왕자도\n저녁 시간 전까지\n돌아올 수 없겠군요.\n@c0@"
  sl: "@a@b%a002030：这样下去的话，\n　　我们和王子好像都\n　　赶不上吃晚饭了呢。\n@c0@"
  tl: "@a@b%a002030：這樣下去的話，\n　　我們和王子好像都\n　　趕不上吃晚飯了呢。\n@c0@"
69:
  en: "@a%0%a002050@bI can't wait to get this royal rite over and done with!\n@c0@"
  ja: "@a@b%a002050「早く　王子の　洗礼を終えて\n\tゆっくり　休みたいですね。\n@c0@"
  ko: "@a@b%a002050: 어서 왕자의 세례를 마치고\n푹 쉬고 싶습니다.\n@c0@"
  sl: "@a@b%a002050：尽快完成王子的洗礼吧。\n　　好想休息一下呢。\n@c0@"
  tl: "@a@b%a002050：儘快完成王子的洗禮吧。\n　　好想休息一下呢。\n@c0@"
70:
  en: "@a%0%a002000@bI wonder if these two ever stop their bellyaching.\n@c0@"
  ja: "@a@b%a002000「あいかわらず\n\tこのふたりは　ここで\n\tダベッてるのか。\n@c0@"
  ko: "@a@b%a002000: 이 둘은\n여전히 여기서\n잡담을 하고 있군.\n@c0@"
  sl: "@a@b%a002000：这两个人\n　　还在这里\n　　絮絮叨叨的啊。\n@c0@"
  tl: "@a@b%a002000：這兩個人\n　　還在這裡\n　　絮絮叨叨的啊。\n@c0@"
71:
  en: "@a%0%a002000@bGood thing the Prince ain't with us...\n@c0@"
  ja: "@a@b%a002000「王子が　いっしょでなくて\n\tよかったな……。\n@c0@"
  ko: "@a@b%a002000: 왕자가 같이 있지 않아서\n다행인걸......\n@c0@"
  sl: "@a@b%a002000：王子没跟咱在一起\n　　真是太好了……\n@c0@"
  tl: "@a@b%a002000：王子沒跟咱在一起\n　　真是太好了……\n@c0@"
72:
  en: "@a%0%a002010@bHe's getting well ahead of himself. We need to get the Prince to the cave first.\n@c0@"
  ja: "@a@b%a002010「先のことは　ともかく\n\tまずは　王子には　洗礼を\n\t受けてもらわないとね。\n@c0@"
