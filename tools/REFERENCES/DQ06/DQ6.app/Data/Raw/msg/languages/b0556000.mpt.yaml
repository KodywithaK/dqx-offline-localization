  sl: "@a@b%a002030：洗礼结束的话，\n　　荷尔斯王子总有一天\n　　会成为荷尔斯托克王……\n@c0@"
  tl: "@a@b%a002030：洗禮結束的話，\n　　荷爾斯王子總有一天\n　　會成為荷爾斯托克王……\n@c0@"
75:
  en: "@a%0%a002030@bA worrying proposition indeed...\n@c0@"
  ja: "@a@b%a002030「うーん　心配するのも\n\tムリのない　ことかも……。\n@c0@"
  ko: "@a@b%a002030: 으음, 걱정하는 것도\n무리는 아니겠군요......\n@c0@"
  sl: "@a@b%a002030：唔。担心也是\n　　情有可原的呢……\n@c0@"
  tl: "@a@b%a002030：唔。擔心也是\n　　情有可原的呢……\n@c0@"
76:
  en: "@a%0%a002050@bI doubt Prince Howard would be hangin' round here.\n@c0@"
  ja: "@a@b%a002050「まちがっても　王子は\n\tここに　来そうに　ないですね。\n@c0@"
  ko: "@a@b%a002050: 왕자는 실수로라도\n이쪽으로 오지는 않을 것 같군요.\n@c0@"
  sl: "@a@b%a002050：王子不会走错路\n　　走到这里来吧。\n@c0@"
  tl: "@a@b%a002050：王子不會走錯路\n　　走到這裡來吧。\n@c0@"
77:
  en: "@a%0%a002000@bI'd like to find out too. Let's catch that Prince!\n@c0@"
  ja: "@a@b%a002000「オレも　早いとこ　\n\t見てみたいぜ……。\n@c0@"
  ko: "@a@b%a002000: 나도 어서\n보고 싶다고......\n@c0@"
  sl: "@a@b%a002000：俺也想快点看到啊……\n@c0@"
  tl: "@a@b%a002000：俺也想快點看到啊……\n@c0@"
78:
  en: "@a%0%a002010@bLet's find the Prince and go and witness this mysterious rite.\n@c0@"
  ja: "@a@b%a002010「どんな　ぎしきか\n\t知るために　早く　王子を\n\tつれもどしましょう。\n@c0@"
  ko: "@a@b%a002010: 어떤 의식인지\n알기 위해 어서 왕자를\n다시 데려가자.\n@c0@"
  sl: "@a@b%a002010：快点把王子找回来，\n　　然后去看看仪式\n　　是什么样的吧。\n@c0@"
  tl: "@a@b%a002010：快點把王子找回來，\n　　然後去看看儀式\n　　是什麼樣的吧。\n@c0@"
79:
