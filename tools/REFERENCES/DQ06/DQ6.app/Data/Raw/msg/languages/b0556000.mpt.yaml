  ko: "@a@b%a002050: 어서 합류해야\n할 텐데요......\n@c0@"
  sl: "@a@b%a002050：必须快点找到他……\n@c0@"
  tl: "@a@b%a002050：必須快點找到他……\n@c0@"
55:
  en: "@a%0%a002000@bYou wanna see the King right now, %a000090? Eh, I dunno...\n@c0@"
