  ko: "@a@b%a002050: 이 성 아니면 홀코타 성.\n포기하지 말고 찾아 보자구요!\n@c0@"
  sl: "@a@b%a002050：这座城还有荷尔克塔村。\n　　不要放弃，好好找吧！\n@c0@"
  tl: "@a@b%a002050：這座城還有荷爾克塔村。\n　　不要放棄，好好找吧！\n@c0@"
94:
  en: "@a%0%a002000@bHe ain't back, aye?\n@c0@"
  ja: "@a@b%a002000「もどって　ないか……。\n@c0@"
  ko: "@a@b%a002000: 돌아오지 않았군......\n@c0@"
  sl: "@a@b%a002000：没有回来啊……\n@c0@"
  tl: "@a@b%a002000：沒有回來啊……\n@c0@"
95:
