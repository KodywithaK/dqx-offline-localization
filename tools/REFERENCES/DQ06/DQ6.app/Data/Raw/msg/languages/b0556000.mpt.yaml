  tl: "@a@b%a002010：要是討厭的話，\n　　可能會欺負得\n　　更厲害呢。\n@c0@"
36:
  en: "@a%0%a002010@bBut I sense that he has a soft spot for this one.\n@c0@"
  ja: "@a@b%a002010「だから　王子の\n\tスカートめくりは　好意的な\n\tイタズラなんじゃ　ないかしら。\n@c0@"
