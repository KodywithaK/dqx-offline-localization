  tl: "@a@b%a002030：搜尋範圍縮小了，\n　　真是鬆了口氣呢。\n@c0@"
93:
  en: "@a%0%a002050@bSo he's either in the castle or over in Howsworth? Let's go and get him!\n@c0@"
