  tl: "@a@b%a002020：跟他一起\n　　打牌的王子\n　　倒是精神滿滿呢。\n@c0@"
63:
  en: "@a%0%a002030@bIn his exhausted state, I doubt he would notice the Prince if he walked right past him.\n@c0@"
