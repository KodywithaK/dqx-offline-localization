  tl: "@a@b%a002020：倒是可能厚臉皮地\n　　跑回自己的房間\n　　睡大覺呢。\n@c0@"
85:
  en: "@a%0%a002030@bNo sign of him...\n@c0@"
  ja: "@a@b%a002030「うーん。\n\tいませんね。\n@c0@"
  ko: "@a@b%a002030: 으음.\n없네요.\n@c0@"
  sl: "@a@b%a002030：唔。\n　　不在呢。\n@c0@"
  tl: "@a@b%a002030：唔。\n　　不在呢。\n@c0@"
86:
