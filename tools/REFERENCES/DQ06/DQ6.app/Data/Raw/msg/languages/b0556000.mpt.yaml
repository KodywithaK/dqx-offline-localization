  tl: "@a@b%a002010：哎呀，\n　　這個人還醒著呢？\n@c0@"
62:
  en: "@a%0%a002020@bWhy's that guy so tired when Prince Howard isn't? I thought they stayed up all night playing cards together?\n@c0@"
  ja: "@a@b%a002020「カードあそびを\n\tいっしょに　やっていたはずの\n\t王子は　元気なのにね。\n@c0@"
