  sl: "@a@b%a002030：真想听到最后呢……\n@c0@"
  tl: "@a@b%a002030：真想聽到最後呢……\n@c0@"
49:
  en: "@a%0%a002050@bJust hearin' that rhyme takes the wind right out of my sails, I tell you.\n@c0@"
  ja: "@a@b%a002050「聞いてる　こっちも\n\tなさけなくなりました……。\n@c0@"
  ko: "@a@b%a002050: 듣고 있는 우리도\n비참하군요......\n@c0@"
  sl: "@a@b%a002050：听着这诗，\n　　连我们都觉得不好意思了……\n@c0@"
  tl: "@a@b%a002050：聽著這詩，\n　　連我們都覺得不好意思了……\n@c0@"
50:
  en: "@a%0%a002000@bCrikey, that guy really likes puttin' us on the spot, aye?\n@c0@"
  ja: "@a@b%a002000「この人\n\t答えにくい　ことを\n\tずばずば　聞くな。\n@c0@"
  ko: "@a@b%a002000: 이 사람,\n대답하기 힘든 질문을\n거침없이 하는군.\n@c0@"
