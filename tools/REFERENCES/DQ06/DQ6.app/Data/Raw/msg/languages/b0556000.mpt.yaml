  sl: "@a@b%a002010：暂时别管以后的事，\n　　先得让王子\n　　接受洗礼才行。\n@c0@"
  tl: "@a@b%a002010：暫時別管以後的事，\n　　先得讓王子\n　　接受洗禮才行。\n@c0@"
73:
  en: "@a%0%a002020@bI guess Prince Howard isn't here after all.\n@c0@"
  ja: "@a@b%a002020「やっぱり　いないね\n\tホルス王子……。\n@c0@"
  ko: "@a@b%a002020: 여기도 없네,\n홀스 왕자......\n@c0@"
  sl: "@a@b%a002020：荷尔斯王子\n　　果然不在呢……\n@c0@"
  tl: "@a@b%a002020：荷爾斯王子\n　　果然不在呢……\n@c0@"
74:
  en: "@a%0%a002030@bOnce the Prince has undergone the rite, he will be considered worthy of the throne.\n@c0@"
  ja: "@a@b%a002030「洗礼がすめば\n\tいずれ　ホルス王子が\n\tホルストックの王に……。\n@c0@"
