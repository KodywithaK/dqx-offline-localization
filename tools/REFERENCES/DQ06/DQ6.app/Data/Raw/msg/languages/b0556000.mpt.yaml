  sl: "@a@b%a002050：我们马上就能\n　　亲眼看到那个仪式了……\n　　要是这样就好了啊。\n@c0@"
  tl: "@a@b%a002050：我們馬上就能\n　　親眼看到那個儀式了……\n　　要是這樣就好了啊。\n@c0@"
82:
  en: "@a%0%a002000@bNo Prince here...\n@c0@"
  ja: "@a@b%a002000「いないか……。\n@c0@"
  ko: "@a@b%a002000: 없군......\n@c0@"
  sl: "@a@b%a002000：不在啊……\n@c0@"
  tl: "@a@b%a002000：不在啊……\n@c0@"
83:
  en: "@a%0%a002010@bHe's not in here...\n@c0@"
  ja: "@a@b%a002010「いないようね……。\n@c0@"
  ko: "@a@b%a002010: 없는 것 같네......\n@c0@"
  sl: "@a@b%a002010：好像不在呢……\n@c0@"
  tl: "@a@b%a002010：好像不在呢……\n@c0@"
84:
  en: "@a%0%a002020@bWhat if he was just asleep in his own room right now? Wouldn't that be rich.\n@c0@"
  ja: "@a@b%a002020「自分の　部屋で\n\tねてたりする　ずぶとさは\n\tありそうだけどね。\n@c0@"
  ko: "@a@b%a002020: 자기 방에서\n뻔뻔스럽게 자고 있을 법하기도\n한데 말이야.\n@c0@"
