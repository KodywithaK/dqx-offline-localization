  sl: "@a@b%a002010：国王陛下和王妃殿下，\n　　想必也很焦虑不安吧。\n@c0@"
  tl: "@a@b%a002010：國王陛下和王妃殿下，\n　　想必也很焦慮不安吧。\n@c0@"
57:
  en: "@a%0%a002020@bI'm in no hurry to see the King — especially without the Prince at our side.\n@c0@"
  ja: "@a@b%a002020「いま　王さまに　会うのは\n\t気が　すすまないなあ。\n\tホルス王子　いないし……。\n@c0@"
