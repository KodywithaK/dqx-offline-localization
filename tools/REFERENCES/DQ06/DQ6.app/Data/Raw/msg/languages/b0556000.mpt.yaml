  ko: "@a@b%a002050: 이게 마지막이 되도록\n열심히 하는 수밖엔 없겠네요.\n@c0@"
  sl: "@a@b%a002050：只有努力\n　　让这事不再发生了呢。\n@c0@"
  tl: "@a@b%a002050：只有努力\n　　讓這事不再發生了呢。\n@c0@"
45:
  en: "@a%0%a002000@bPretend this never happened? Crikey, we're ready to join in the chorus!\n@c0@"
  ja: "@a@b%a002000「いまは　その歌\n\tオレたちも　歌いたい\n\t気分だぜ　まったく！\n@c0@"
  ko: "@a@b%a002000: 지금은 그 노래\n우리도 함께 부르고 싶은\n기분이라고. 나 참!\n@c0@"
  sl: "@a@b%a002000：现在连俺们都想\n　　咏这首诗了啊。\n　　真是的！\n@c0@"
  tl: "@a@b%a002000：現在連俺們都想\n　　詠這首詩了啊。\n　　真是的！\n@c0@"
46:
  en: "@a%0%a002010@bExpressing one's feelings in song is an excellent stress-reliever.\n@c0@"
