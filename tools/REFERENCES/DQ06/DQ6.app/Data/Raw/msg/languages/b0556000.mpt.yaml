0:
  en: "@a%0%a002000@bSo this is the place, aye? It ain't quite how I imagined it.\n@c0@"
  ja: "@a@b%a002000「これが　洗礼の洞くつか。\n\tそうぞうしていたのと\n\tちょっと　ふんいきが　ちがうな。\n@c0@"
  ko: "@a@b%a002000: 여기가 세례의 동굴이군.\n상상했던 것과는\n분위기가 좀 다른걸.\n@c0@"
  sl: "@a@b%a002000：这里就是洗礼洞窟啊。\n　　这气氛跟想象的\n　　有点不一样呢。\n@c0@"
  tl: "@a@b%a002000：這裡就是洗禮洞窟啊。\n　　這氣氛跟想像的\n　　有點不一樣呢。\n@c0@"
1:
  en: "@a%0%a002010@bLet's stay alert.\n@c0@"
  ja: "@a@b%a002010「ゆだん　しないで\n\t行きましょう。\n@c0@"
  ko: "@a@b%a002010: 방심하지 말고\n가자구.\n@c0@"
  sl: "@a@b%a002010：不要放松警惕。\n@c0@"
  tl: "@a@b%a002010：不要放鬆警惕。\n@c0@"
2:
  en: "@a%0%a002020@bWhat's that smell? (sniff) It smells...wet...\n@c0@"
  ja: "@a@b%a002020「かすかに　水の\n\tにおいが　するね……。\n@c0@"
  ko: "@a@b%a002020: 어렴풋이\n물 냄새가 나네......\n@c0@"
  sl: "@a@b%a002020：有很微弱的\n　　水的气息呢……\n@c0@"
  tl: "@a@b%a002020：有很微弱的\n　　水的氣息呢……\n@c0@"
3:
  en: "@a%0%a002030@bIs there someone waiting in the depths of this cave?\n@c0@"
  ja: "@a@b%a002030「奥のほうには　だれか\n\tいるのでしょうか……。\n@c0@"
  ko: "@a@b%a002030: 안쪽에는 누군가가\n있는 걸까요......\n@c0@"
  sl: "@a@b%a002030：里面有谁在吗……\n@c0@"
  tl: "@a@b%a002030：裡面有誰在嗎……\n@c0@"
4:
  en: "@a%0%a002050@bI've got a funny feelin' about this place. And not funny ha ha, either...\n@c0@"
  ja: "@a@b%a002050「なんか　いやーな\n\t予感が　します。\n\tなんだろう　この　感じは……。\n@c0@"
  ko: "@a@b%a002050: 왠지 좋지 않은\n예감이 듭니다.\n뭘까요, 이 느낌은......\n@c0@"
  sl: "@a@b%a002050：总觉得\n　　有不好的预感。\n　　这感觉是怎么回事啊……\n@c0@"
  tl: "@a@b%a002050：總覺得\n　　有不好的預感。\n　　這感覺是怎麼回事啊……\n@c0@"
5:
  en: "@a%0%a002000@bAvast! Where's the Prince!?\n@c0@"
  ja: "@a@b%a002000「ややっ！？\n\t王子は　どこに　行ったんだ！？\n@c0@"
  ko: "@a@b%a002000: 아니!?\n왕자는 어디로 간 거지!?\n@c0@"
  sl: "@a@b%a002000：哎呀？！\n　　王子跑哪去了？！\n@c0@"
  tl: "@a@b%a002000：哎呀？！\n　　王子跑哪去了？！\n@c0@"
6:
  en: "@a%0%a002010@bI think the Prince has run off again...\n@c0@"
  ja: "@a@b%a002010「ホルス王子\n\tにげちゃった　みたいね……。\n@c0@"
  ko: "@a@b%a002010: 홀스 왕자,\n도망쳐 버렸나 보네......\n@c0@"
  sl: "@a@b%a002010：荷尔斯王子\n　　好像逃走了呢……\n@c0@"
  tl: "@a@b%a002010：荷爾斯王子\n　　好像逃走了呢……\n@c0@"
7:
  en: "@a%0%a002020@bArgh! He's done it again!\n@c0@"
  ja: "@a@b%a002020「あーっ！\n\tホルスったら　さっそく\n\tやらかしてくれたわ！\n@c0@"
  ko: "@a@b%a002020: 아앗!\n홀스 녀석 벌써\n사고를 치다니!\n@c0@"
  sl: "@a@b%a002020：啊！\n　　荷尔斯这家伙！\n　　这么快就给我们找事！\n@c0@"
  tl: "@a@b%a002020：啊！\n　　荷爾斯這傢伙！\n　　這麼快就給我們找事！\n@c0@"
8:
  en: "@a%0%a002030@bWe seem to have mislaid the Prince. We should retrace our steps.\n@c0@"
  ja: "@a@b%a002030「王子が　いませんね……\n\t不注意でした……。\n\tいったん　引きかえしましょう。\n@c0@"
  ko: "@a@b%a002030: 왕자가 사라졌군요......\n부주의했습니다.\n일단 물러나지요.\n@c0@"
  sl: "@a@b%a002030：王子不在呢……\n　　大意了……\n　　我们先退回去吧。\n@c0@"
  tl: "@a@b%a002030：王子不在呢……\n　　大意了……\n　　我們先退回去吧。\n@c0@"
9:
  en: "@a%0%a002050@bEh!? No Prince!?\n@c0@"
  ja: "@a@b%a002050「ありゃー！？\n\t王子が　いませんよ！\n\tしまったー！\n@c0@"
  ko: "@a@b%a002050: 어엇~!?\n왕자가 없어졌어요!\n당했군!\n@c0@"
  sl: "@a@b%a002050：哎呀？！\n　　王子不在了啊？！\n　　糟了！\n@c0@"
  tl: "@a@b%a002050：哎呀？！\n　　王子不在了啊？！\n　　糟了！\n@c0@"
10:
  en: "@a%0%a002000@bCrikey! The slippery devil!\n@c0@"
  ja: "@a@b%a002000「なにーっ！\n\tしまった　やられたか！\n@c0@"
  ko: "@a@b%a002000: 뭣이!\n제길, 당했군!\n@c0@"
  sl: "@a@b%a002000：什么！\n　　糟了，被摆了一道！\n@c0@"
  tl: "@a@b%a002000：什麼！\n　　糟了，被擺了一道！\n@c0@"
11:
  en: "@a%0%a002010@bHe's off... I sense that finding him again will be quite the ordeal...\n@c0@"
  ja: "@a@b%a002010「にげちゃったのね……。\n\tまた　さがすのに\n\tホネが　おれそうだわ……。\n@c0@"
  ko: "@a@b%a002010: 도망쳐 버렸네......\n또 찾느라\n고생하겠어......\n@c0@"
  sl: "@a@b%a002010：逃走了呢……\n　　要找他又得\n　　费一番力气了……\n@c0@"
  tl: "@a@b%a002010：逃走了呢……\n　　要找他又得\n　　費一番力氣了……\n@c0@"
12:
  en: "@a%0%a002020@bUgh! What have I done to deserve that little sneak? I'm a good person, right?\n@c0@"
  ja: "@a@b%a002020「なによ　もう！\n\tあの　弱虫ったら\n\tせわが　やけるんだから！\n@c0@"
  ko: "@a@b%a002020: 뭐야, 정말!\n그 겁쟁이\n정말 성가시다니까!\n@c0@"
  sl: "@a@b%a002020：什么啊，真是的！\n　　那个胆小鬼\n　　还真爱给人添麻烦！\n@c0@"
  tl: "@a@b%a002020：什麼啊，真是的！\n　　那個膽小鬼\n　　還真愛給人添麻煩！\n@c0@"
13:
  en: "@a%0%a002030@bOutsmarted once again! Come, let us head back and find the recalcitrant royal.\n@c0@"
  ja: "@a@b%a002030「やられましたね……\n\tいったん　引きかえして\n\tまた　つれてこなくては。\n@c0@"
  ko: "@a@b%a002030: 우리가 당했군요......\n일단 물러났다가\n다시 데리고 오는 수밖에.\n@c0@"
  sl: "@a@b%a002030：被摆了一道呢……\n　　得暂时退回去，\n　　再把他带过来才行。\n@c0@"
  tl: "@a@b%a002030：被擺了一道呢……\n　　得暫時退回去，\n　　再把他帶過來才行。\n@c0@"
14:
  en: "@a%0%a002050@bDon't tell me it's back to the starting line again!?\n@c0@"
  ja: "@a@b%a002050「うわー！\n\tまた　フリダシより\n\t前にもどる……ですか！？\n@c0@"
  ko: "@a@b%a002050: 으앗~!\n또 처음부터\n다시 시작해야 하는 겁니까......!?\n@c0@"
  sl: "@a@b%a002050：哇啊！\n　　又要退回到\n　　一开始的地方了啊？！\n@c0@"
  tl: "@a@b%a002050：哇啊！\n　　又要退回到\n　　一開始的地方了啊？！\n@c0@"
15:
  en: "@a%0%a002000@bGoddess knows if he's back here or not, but...\n@c0@"
  ja: "@a@b%a002000「やっぱ城には\n\tいないかなあ……。\n@c0@"
  ko: "@a@b%a002000: 역시 성에는\n없는 건가......\n@c0@"
  sl: "@a@b%a002000：果然不在城里啊……\n@c0@"
  tl: "@a@b%a002000：果然不在城裡啊……\n@c0@"
16:
  en: "@a%0%a002010@bWhere could he have got to this time?\n@c0@"
  ja: "@a@b%a002010「どこへ　行って\n\tしまったんでしょう。\n@c0@"
  ko: "@a@b%a002010: 어디로\n가 버린 걸까?\n@c0@"
  sl: "@a@b%a002010：跑到哪里去了啊。\n@c0@"
  tl: "@a@b%a002010：跑到哪裡去了啊。\n@c0@"
17:
  en: "@a%0%a002020@bUgh! I've had it up to here with that stupid prince!\n@c0@"
  ja: "@a@b%a002020「ホルス王子ってば\n\tほんとうに　もう！\n@c0@"
  ko: "@a@b%a002020: 홀스 왕자는\n정말 사람을 귀찮게 한다니까!\n@c0@"
  sl: "@a@b%a002020：荷尔斯王子这家伙，\n　　真是的！\n@c0@"
  tl: "@a@b%a002020：荷爾斯王子這傢伙，\n　　真是的！\n@c0@"
18:
  en: "@a%0%a002030@bMy patience is beginning to fray...\n@c0@"
  ja: "@a@b%a002030「うーん。　弱りました。\n@c0@"
  ko: "@a@b%a002030: 으음. 난처하게 됐군요.\n@c0@"
  sl: "@a@b%a002030：唔。真是累啊。\n@c0@"
  tl: "@a@b%a002030：唔。真是累啊。\n@c0@"
19:
  en: "@a%0%a002050@bWhich nook or cranny is the Prince lurkin' in now?\n@c0@"
  ja: "@a@b%a002050「どこか　そのへんの\n\tすみっこに　いないですか？\n@c0@"
  ko: "@a@b%a002050: 어디 거기\n구석쯤에 없나요?\n@c0@"
  sl: "@a@b%a002050：不在某个角落旮旯里么？\n@c0@"
  tl: "@a@b%a002050：不在某個角落旮旯裡麼？\n@c0@"
20:
  en: "@a%0%a002000@bCould the Prince've slipped by that fella? Probably not, aye?\n@c0@"
  ja: "@a@b%a002000「うっかり\n\t見落としたってことは……\n\tないだろうな。\n@c0@"
  ko: "@a@b%a002000: 실수로\n못 봤을 리는......\n없겠지.\n@c0@"
  sl: "@a@b%a002000：不会\n　　一不小心看漏了吧……\n@c0@"
  tl: "@a@b%a002000：不會\n　　一不小心看漏了吧……\n@c0@"
21:
  en: "@a%0%a002010@bHmm. What shall we do? We know he's not here — that's a start, I suppose...\n@c0@"
  ja: "@a@b%a002010「うーん　どうしましょう。\n\tとりあえず　ここには\n\tいないみたいだけど……\n@c0@"
  ko: "@a@b%a002010: 으음, 어쩌지?\n일단 여기에는\n없는 것 같은데......\n@c0@"
  sl: "@a@b%a002010：唔。怎么办啊。\n　　总之好像\n　　不在这里呢……\n@c0@"
  tl: "@a@b%a002010：唔。怎麼辦啊。\n　　總之好像\n　　不在這裡呢……\n@c0@"
22:
  en: "@a%0%a002010@bSomeone in the castle might know where Howard likes to run off to. Shall we ask around?\n@c0@"
  ja: "@a@b%a002010「王子が　行きそうな\n\t場所については　お城の人たちが\n\tくわしいはずだから　聞いてみる？\n@c0@"
  ko: "@a@b%a002010: 왕자가 갈 것 같은\n장소는 성 사람들이\n잘 알 테니까 물어볼까?\n@c0@"
  sl: "@a@b%a002010：城里的人应该知道\n　　王子可能会去哪里。\n　　去问问吧？\n@c0@"
  tl: "@a@b%a002010：城裡的人應該知道\n　　王子可能會去哪裡。\n　　去問問吧？\n@c0@"
23:
  en: "@a%0%a002020@bThere's only one way into the castle, right? So that means he's not here...\n@c0@"
  ja: "@a@b%a002020「お城には　ここからしか\n\t入れないんだったわよね。\n\tいないのかー。\n@c0@"
  ko: "@a@b%a002020: 성에 들어가려면\n여길 통과하는 수밖에 없잖아.\n여긴 없는 건가~\n@c0@"
  sl: "@a@b%a002020：进城只能\n　　从这里走呢。\n　　不在啊。\n@c0@"
  tl: "@a@b%a002020：進城只能\n　　從這裡走呢。\n　　不在啊。\n@c0@"
24:
  en: "@a%0%a002030@bSo Prince Howard has not returned...\n@c0@"
  ja: "@a@b%a002030「うーむ。\n\tこちらには　もどってないですか。\n\tそうですか……。\n@c0@"
  ko: "@a@b%a002030: 으음.\n여기로 돌아오지는 않았다고요.\n그렇군요......\n@c0@"
  sl: "@a@b%a002030：唔。\n　　没有回这里来啊。\n　　这样啊……\n@c0@"
  tl: "@a@b%a002030：唔。\n　　沒有回這裡來啊。\n　　這樣啊……\n@c0@"
25:
  en: "@a%0%a002030@bStill, I feel there may be clues to be found here.\n@c0@"
  ja: "@a@b%a002030「でも　なにかしら\n\t手がかりは　みつかるかも\n\tしれませんね。\n@c0@"
  ko: "@a@b%a002030: 하지만 뭔가\n단서가 될 만한 것은\n찾을 수 있을지도 모릅니다.\n@c0@"
  sl: "@a@b%a002030：不过，\n　　可能会找到\n　　什么线索呢。\n@c0@"
  tl: "@a@b%a002030：不過，\n　　可能會找到\n　　什麼線索呢。\n@c0@"
26:
  en: "@a%0%a002030@bWe do not have much time, but perhaps speaking to a few folks in the castle would be a good idea.\n@c0@"
  ja: "@a@b%a002030「あまり　ゆっくりは\n\tしていられませんが　お城の\n\tみなさんに　話を　きいてみては。\n@c0@"
  ko: "@a@b%a002030: 그렇게 오래\n지체할 수는 없지만, 성에 있는\n사람들에게 이야기를 들어 보면 어떨지.\n@c0@"
  sl: "@a@b%a002030：虽然我们要抓紧，\n　　但是还是向城里的人们\n　　打听一下吧。\n@c0@"
  tl: "@a@b%a002030：雖然我們要抓緊，\n　　但是還是向城裡的人們\n　　打聽一下吧。\n@c0@"
27:
  en: "@a%0%a002050@bSo Prince Howard's givin' the castle a wide berth...\n@c0@"
  ja: "@a@b%a002050「そうですか　つまり\n\tお城は　シロ　ですね……。\n@c0@"
  ko: "@a@b%a002050: 그렇군요. 그 말인즉슨,\n성은 성에 안 찼다는 뜻이군요......\n@c0@"
  sl: "@a@b%a002050：这样啊。\n　　就是说不在城里啊……\n@c0@"
  tl: "@a@b%a002050：這樣啊。\n　　就是說不在城裡啊……\n@c0@"
28:
  en: "@a%0%a002000@bAin't no point askin' that guy about the Prince, aye?\n@c0@"
  ja: "@a@b%a002000「やっぱり　この男に\n\t王子のことを　たずねても\n\tしかたないか……。\n@c0@"
  ko: "@a@b%a002000: 역시 이 남자한테\n왕자에 대한 걸 물어도\n소용이 없겠군......\n@c0@"
  sl: "@a@b%a002000：果然，\n　　问这个男的\n　　王子的事情也没用……\n@c0@"
  tl: "@a@b%a002000：果然，\n　　問這個男的\n　　王子的事情也沒用……\n@c0@"
29:
  en: "@a%0%a002010@bThat chap's got caves on the brain...\n@c0@"
  ja: "@a@b%a002010「ずっと　そんなことばかり\n\t考えているのね　この人。\n@c0@"
  ko: "@a@b%a002010: 계속 그런 생각만\n하고 있네, 이 사람.\n@c0@"
  sl: "@a@b%a002010：这个人\n　　一直在想这事呢。\n@c0@"
  tl: "@a@b%a002010：這個人\n　　一直在想這事呢。\n@c0@"
30:
  en: "@a%0%a002020@bNot all monsters are horrible. Some of them are horribly cute!\n@c0@"
  ja: "@a@b%a002020「怖いまものも　いるけど\n\tかわいい　まものも　いるわよね！\n@c0@"
  ko: "@a@b%a002020: 무서운 마물도 있지만\n귀여운 마물도 있다구!\n@c0@"
  sl: "@a@b%a002020：虽然有的魔物是很可怕，\n　　但是有的魔物也很可爱哦！\n@c0@"
  tl: "@a@b%a002020：雖然有的魔物是很可怕，\n　　但是有的魔物也很可愛哦！\n@c0@"
31:
  en: "@a%0%a002030@bI confess that I am often filled with dread at the prospect of encountering monsters.\n@c0@"
  ja: "@a@b%a002030「私は　しょうじき\n\tまものは　怖いと思います。\n\tでも……\n@c0@"
  ko: "@a@b%a002030: 저는 솔직히\n마물이 무섭다고 생각합니다.\n하지만......\n@c0@"
  sl: "@a@b%a002030：其实我很怕魔物。\n　　但是……\n@c0@"
  tl: "@a@b%a002030：其實我很怕魔物。\n　　但是……\n@c0@"
32:
  en: "@a%0%a002030@bBut the only way to overcome your fears is to face them head on.\n@c0@"
  ja: "@a@b%a002030「たとえ　怖くても\n\t目の前に　たちはだかる　まものには\n\tたちむかう　べきですよね。\n@c0@"
  ko: "@a@b%a002030: 아무리 무서워도\n눈앞을 가로막은 마물과는\n맞서 싸워야 한다고 생각하지요.\n@c0@"
  sl: "@a@b%a002030：即使害怕，\n　　挡在面前的魔物\n　　还是应该勇敢面对的。\n@c0@"
  tl: "@a@b%a002030：即使害怕，\n　　擋在面前的魔物\n　　還是應該勇敢面對的。\n@c0@"
33:
  en: "@a%0%a002050@bOld %a002050 can't afford to be afraid of monsters — I'd end up scared of myself!\n@c0@"
  ja: "@a@b%a002050「まものが　怖かったら\n\t私……　自分を\n\tやってられませんね。\n@c0@"
  ko: "@a@b%a002050: 마물이 무섭다면\n저는...... 저이길\n포기해야 합니다.\n@c0@"
  sl: "@a@b%a002050：要是害怕魔物的话，\n　　我……\n　　可能会疯掉的吧。\n@c0@"
  tl: "@a@b%a002050：要是害怕魔物的話，\n　　我……\n　　可能會瘋掉的吧。\n@c0@"
34:
  en: "@a%0%a002000@bLove ain't just blind — it's dumb too.\n@c0@"
  ja: "@a@b%a002000「そうかも　しれないし\n\tそうじゃないかも　しれないな。\n@c0@"
  ko: "@a@b%a002000: 그럴 수도 있고\n아닐 수도 있지.\n@c0@"
  sl: "@a@b%a002000：可能是这样，\n　　也可能不是这样。\n@c0@"
  tl: "@a@b%a002000：可能是這樣，\n　　也可能不是這樣。\n@c0@"
35:
  en: "@a%0%a002010@bPrince Howard probably offers to show his armour to all the girls...\n@c0@"
  ja: "@a@b%a002010「きらいだったら\n\tもっと　ひどい　イタズラを\n\tするかも　しれないわね。\n@c0@"
