  sl: "@a@b%a002010：把真话写进诗里，\n　　压力会小很多呢。\n@c0@"
  tl: "@a@b%a002010：把真話寫進詩裡，\n　　壓力會小很多呢。\n@c0@"
47:
  en: "@a%0%a002020@bPretend this never happened? Why? That sounded like a surefire hit! \n@c0@"
  ja: "@a@b%a002020「聞かなかったことに？\n\tそこまでは　もう\n\tおぼえちゃったもんねー！\n@c0@"
  ko: "@a@b%a002020: 못 들은 걸로?\n거기까진 벌써\n다 외웠지롱~!\n@c0@"
  sl: "@a@b%a002020：当没听见？\n　　我们都已经背下来了哦！\n@c0@"
  tl: "@a@b%a002020：當沒聽見？\n　　我們都已經背下來了哦！\n@c0@"
48:
  en: "@a%0%a002030@bI would very much like to hear how the rest of that ballad goes...\n@c0@"
  ja: "@a@b%a002030「最後まで　ちゃんと\n\t聞きたい　くらいですね……。\n@c0@"
