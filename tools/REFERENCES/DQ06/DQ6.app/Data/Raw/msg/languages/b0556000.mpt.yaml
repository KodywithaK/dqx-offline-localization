  sl: "@a@b%a002050：不在啊？\n　　猜都猜得到呢。\n@c0@"
  tl: "@a@b%a002050：不在啊？\n　　猜都猜得到呢。\n@c0@"
99:
  en: "@a%0%a002000@bNot in here...but I expected as much.\n@c0@"
  ja: "@a@b%a002000「さすがに\n\tここには　いないか……。\n@c0@"
  ko: "@a@b%a002000: 역시\n여긴 있을 리가 없겠지......\n@c0@"
  sl: "@a@b%a002000：果然不在这里啊……\n@c0@"
  tl: "@a@b%a002000：果然不在這裡啊……\n@c0@"
100:
  en: "@a%0%a002010@bThere's no way he's here.\n@c0@"
  ja: "@a@b%a002010「いくらなんでも\n\tここには　いないでしょう。\n@c0@"
