32:
  en: "@a%0%a002000@bSo folks around here don't trust this Buddy guy, aye?\n@c0@"
  ja: "@a@b%a002000「ランドってやつは\n\tあまり　しんらい　されて\n\tいないのか？\n@c0@"
  ko: "@a@b%a002000: 랜드라는 녀석은\n그다지 믿음직하지\n못한가 보지?\n@c0@"
  sl: "@a@b%a002000：兰德这人好像不太被信任？\n@c0@"
  tl: "@a@b%a002000：蘭德這人好像不太被信任？\n@c0@"
33:
  en: "@a%0%a002000@bHe seemed reliable enough to me.\n@c0@"
  ja: "@a@b%a002000「オレには　\n\tしっかりしているように\n\tみえるけどな。\n@c0@"
  ko: "@a@b%a002000: 내가 보기엔\n잘하고 있는 것\n같은데 말이지.\n@c0@"
  sl: "@a@b%a002000：俺倒觉得他很踏实工作啊。\n@c0@"
  tl: "@a@b%a002000：俺倒覺得他很踏實工作啊。\n@c0@"
34:
  en: "@a%0%a002000@bGood to know you've got someone watchin' over ya in this village.\n@c0@"
  ja: "@a@b%a002000「ライフコッドってのは\n\tきっと　精霊のチカラによって\n\t守られているんだな。\n@c0@"
  ko: "@a@b%a002000: 라이프코드는\n정령의 힘이 지켜주고\n있는 게 틀림없어.\n@c0@"
  sl: "@a@b%a002000：莱夫科德一定\n　　受到了精灵之力的保佑吧。\n@c0@"
  tl: "@a@b%a002000：萊夫科德一定\n　　受到了精靈之力的保佑吧。\n@c0@"
35:
  en: "@a%0%a002000@bWhoa! That armour is out of this world! I bet it's packed with spirit power!\n@c0@"
  ja: "@a@b%a002000「すごいな　そのヨロイ！\n\tきっと　精霊のチカラが\n\t宿っているに　ちがいないぜ！\n@c0@"
  ko: "@a@b%a002000: 굉장하군, 그 갑옷!\n틀림없이 정령의 힘이\n깃들어 있을 거야!\n@c0@"
  sl: "@a@b%a002000：这铠甲太棒啦！\n　　里面一定有精灵之力，\n　　绝对错不了！\n@c0@"
  tl: "@a@b%a002000：這鎧甲太棒啦！\n　　裡面一定有精靈之力，\n　　絕對錯不了！\n@c0@"
36:
  en: "@a%0%a002000@bThat armour must be unbreakable, aye?\n@c0@"
  ja: "@a@b%a002000「あの　ヨロイは\n\tきっと　すごい物なんだぜ。\n@c0@"
  ko: "@a@b%a002000: 저 갑옷은\n굉장한 물건임에 틀림없어.\n@c0@"
  sl: "@a@b%a002000：那铠甲一定是高级货。\n@c0@"
  tl: "@a@b%a002000：那鎧甲一定是高級貨。\n@c0@"
37:
  en: "@a%0%a002000@bI can feel the power pulsin' from it. It's givin' me goosebumps!\n@c0@"
  ja: "@a@b%a002000「なんだか　こう\n\tビンビンと　感じるものが\n\tあるからな。\n@c0@"
  ko: "@a@b%a002000: 뭔지 모를\n용맹무쌍한 기운이\n느껴지거든.\n@c0@"
  sl: "@a@b%a002000：因为看起来非常坚固耐用。\n@c0@"
  tl: "@a@b%a002000：因為看起來非常堅固耐用。\n@c0@"
38:
  en: "@a%0%a002000@bYour mayor sure seems like a nice fella, %a000090.\n@c0@"
  ja: "@a@b%a002000「なかなか　人の良さそうな\n\tおっさんだな　%a000090。\n@c0@"
  ko: "@a@b%a002000: 인정 많아 보이는\n아저씨로군, %a000090.\n@c0@"
  sl: "@a@b%a002000：这位大叔人不错啊，\n　　是吧%a000090。\n@c0@"
  tl: "@a@b%a002000：這位大叔人不錯啊，\n　　是吧%a000090。\n@c0@"
39:
  en: "@a%0%a002000@bWhoa, %a000090. I didn't know ya had it in you!\n@c0@"
  ja: "@a@b%a002000「へえ。\n\t%a000090も　すみにおけないな。\n@c0@"
  ko: "@a@b%a002000: 호오.\n%a000090도 얕잡아보면 안 되겠는걸.\n@c0@"
  sl: "@a@b%a002000：嘿嘿。\n　　%a000090你也不容小看啊。\n@c0@"
  tl: "@a@b%a002000：嘿嘿。\n　　%a000090你也不容小看啊。\n@c0@"
40:
  en: "@a%0%a002000@bYer sister's out of this world, %a000090. She doesn't look much like you, though.\n@c0@"
  ja: "@a@b%a002000「かわいい妹じゃないか。\n\t%a000090には　似てないけどな。\n@c0@"
  ko: "@a@b%a002000: 귀여운 여동생이야.\n그런데 %a000090%F0090%X와%Y과%Z는 안 닮았어.\n@c0@"
  sl: "@a@b%a002000：%a000090你妹妹真可爱。\n　　跟你一点也不像。\n@c0@"
  tl: "@a@b%a002000：%a000090你妹妹真可愛。\n　　跟你一點也不像。\n@c0@"
41:
  en: "@a%0%a002010@bYou must feel blessed to have such a cute sister, %a000090.\n@c0@"
  ja: "@a@b%a002010「こんなに　かわいい\n\t妹さんが　いるなんて\n\t%a000090は　しあわせね。\n@c0@"
  ko: "@a@b%a002010: 이렇게 귀여운\n여동생이 있다니\n%a000090%F0090%X는%Y은%Z 참 행복하겠네.\n@c0@"
  sl: "@a@b%a002010：竟然有这么可爱的妹妹，\n　　%a000090你真幸福。\n@c0@"
  tl: "@a@b%a002010：竟然有這麼可愛的妹妹，\n　　%a000090你真幸福。\n@c0@"
