0:
  en: "@a%0%a002000@bThis place brings back memories. Wasn't that long ago we climbed this tower, ya know…\n@c0@"
  ja: "@a@b%a002000「ここの　試練が終わって\n\tまだ　いくらも　たってないのに\n\tなつかしい　感じがするな。\n@c0@"
  ko: "@a@b%a002000: 이곳의 시련이 끝난 지\n얼마 되지도 않았는데\n벌써 추억처럼 여겨지는군.\n@c0@"
  sl: "@a@b%a002000：距离这里的试炼结束\n　　明明没过多久，\n　　但是觉得很怀念啊。\n@c0@"
  tl: "@a@b%a002000：距離這裡的試煉結束\n　　明明沒過多久，\n　　但是覺得很懷念啊。\n@c0@"
1:
  en: "@a%0%a002000@bAlright, %a000090, let's get to the north-eastern checkpoint.\n@c0@"
  ja: "@a@b%a002000「さあ　%a000090\n\t北東の関所を　めざそうぜ！\n@c0@"
  ko: "@a@b%a002000: 자, %a000090\n북동쪽 관문으로 가자!\n@c0@"
  sl: "@a@b%a002000：走吧%a000090，\n　　目标东北关卡！\n@c0@"
  tl: "@a@b%a002000：走吧%a000090，\n　　目標東北關卡！\n@c0@"
2:
  en: "@a%0%a002000@bWhew! Got my lower-body workout for today.\n@c0@"
  ja: "@a@b%a002000「ふーい。\n\tついた　ついた！\n@c0@"
  ko: "@a@b%a002000: 후우.\n도착했다, 도착했어!\n@c0@"
  sl: "@a@b%a002000：嘿。\n　　到了到了！\n@c0@"
  tl: "@a@b%a002000：嘿。\n　　到了到了！\n@c0@"
3:
  en: "@a%0%a002000@bSo this is your home village, aye, %a000090? Not too shabby.\n@c0@"
  ja: "@a@b%a002000「ここが　%a000090の\n\tふるさとかあ。\n\tいいところじゃないか。\n@c0@"
  ko: "@a@b%a002000: 여기가 %a000090의\n고향인가.\n멋진 곳인데?\n@c0@"
  sl: "@a@b%a002000：这里就是%a000090的故乡对吧。\n　　真是个世外桃源。\n@c0@"
  tl: "@a@b%a002000：這裡就是%a000090的故鄉對吧。\n　　真是個世外桃源。\n@c0@"
4:
  en: "@a%0%a002010@bSo this is Weaver's Peak, is it? What a lovely place!\n@c0@"
  ja: "@a@b%a002010「まあ！\n\tここが　ライフコッドなのね？\n\tなんて　すてきな　ところなの！\n@c0@"
  ko: "@a@b%a002010: 우아!\n여기가 라이프코드야?\n정말 멋진 곳이네!\n@c0@"
  sl: "@a@b%a002010：哇！\n　　这里就是莱夫科德？\n　　竟然有这么美的地方！\n@c0@"
  tl: "@a@b%a002010：哇！\n　　這裡就是萊夫科德？\n　　竟然有這麼美的地方！\n@c0@"
5:
  en: "@a%0%a002000@bIt's really quiet around here. Tranquil, even.\n@c0@"
  ja: "@a@b%a002000「ライフコッドって　ところは\n\t本当に　のどかな村だなあ。\n@c0@"
  ko: "@a@b%a002000: 라이프코드는\n정말 평화로운 마을이군.\n@c0@"
  sl: "@a@b%a002000：莱夫科德的生活真悠闲啊。\n@c0@"
  tl: "@a@b%a002000：萊夫科德的生活真悠閒啊。\n@c0@"
6:
  en: "@a%0%a002000@bWow, your village is great. The air's fresh, the folks are down to earth — and what a view!\n@c0@"
  ja: "@a@b%a002000「ここは　高台で\n\tけしきも　いいし　最高だよな。\n@c0@"
  ko: "@a@b%a002000: 이곳은 지대가 높아서\n경치도 좋고 최고야.\n@c0@"
  sl: "@a@b%a002000：在这里登高望远的感觉真不错。\n@c0@"
  tl: "@a@b%a002000：在這裡登高望遠的感覺真不錯。\n@c0@"
7:
  en: "@a%0%a002000@bSeems like a place like this would breed hardy folk, %a000090. So what's your excuse?\n@c0@"
  ja: "@a@b%a002000「しかし　%a000090が\n\t山育ちってのは　意外だよ。\n\tそんな　ほそっこい身体してさ。\n@c0@"
  ko: "@a@b%a002000: 그나저나 %a000090%F0090%X가%Y이%Z\n산에서 자랐다니 뜻밖이야.\n그런 호리호리한 몸매에.\n@c0@"
  sl: "@a@b%a002000：但是真想不到啊，\n　　%a000090是山里长大的。\n　　你这细小的身板。\n@c0@"
  tl: "@a@b%a002000：但是真想不到啊，\n　　%a000090是山裡長大的。\n　　你這細小的身板。\n@c0@"
8:
  en: "@a%0%a002010@bWhat a wonderful village. I could see myself settling down in a place like this one day…\n@c0@"
  ja: "@a@b%a002010「すてきな　ところね。\n\t私も　こういうところで\n\t暮らしたいわ。\n@c0@"
  ko: "@a@b%a002010: 멋진 곳이네.\n나도 이런 곳에서\n살고 싶어.\n@c0@"
  sl: "@a@b%a002010：这里真漂亮。\n　　我愿意在这样的地方生活。\n@c0@"
  tl: "@a@b%a002010：這裡真漂亮。\n　　我願意在這樣的地方生活。\n@c0@"
9:
  en: "@a%0%a002010@bThe air here is so fresh and clean! It's like a different world up here in the mountains.\n@c0@"
  ja: "@a@b%a002010「ああ　空気がおいしい。\n\t少し　登ってきただけで\n\tこんなに　ちがうのね。\n@c0@"
  ko: "@a@b%a002010: 아아, 상쾌한 공기.\n조금 올라왔을 뿐인데\n이렇게 다르다니.\n@c0@"
  sl: "@a@b%a002010：啊啊，空气真好。\n　　想不到上面的环境大不一样。\n@c0@"
  tl: "@a@b%a002010：啊啊，空氣真好。\n　　想不到上面的環境大不一樣。\n@c0@"
10:
