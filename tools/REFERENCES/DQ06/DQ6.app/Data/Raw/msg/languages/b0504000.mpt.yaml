  ja: "@a@b%a002000「家の前にいる　ネコは\n\t%a000090んちの　ネコなんだろ？\n\tかわいいよなあ。\n@c0@"
  ko: "@a@b%a002000: 집 앞에 있는 고양이는\n%a000090네 고양이?\n귀엽군.\n@c0@"
  sl: "@a@b%a002000：门口的小猫\n　　是%a000090家养的吗？\n　　真可爱。\n@c0@"
  tl: "@a@b%a002000：門口的小貓\n　　是%a000090家養的嗎？\n　　真可愛。\n@c0@"
11:
  en: "@a%0%a002010@bAww... That cat reminds me of Madame Luca's kitty.\n@c0@"
  ja: "@a@b%a002010「あの　ニャンコちゃん\n\tおばあちゃんちの　ネコちゃんに\n\tちょっと　似てるみたい。\n@c0@"
  ko: "@a@b%a002010: 저 야옹이\n할머니네 고양이랑\n약간 닮았어.\n@c0@"
  sl: "@a@b%a002010：那只小猫咪\n　　跟婆婆养的猫有一点像。\n@c0@"
  tl: "@a@b%a002010：那隻小貓咪\n　　跟婆婆養的貓有一點像。\n@c0@"
12:
  en: "@a%0%a002000@bI'm sure all the monsters'll disappear once we take out Murdaw.\n@c0@"
  ja: "@a@b%a002000「ムドーを　倒せば\n\tきっと　まものは　いなくなる。\n@c0@"
  ko: "@a@b%a002000: 무도를 쓰러뜨리면\n분명 마물도 사라질 거야.\n@c0@"
