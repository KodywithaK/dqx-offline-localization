  tl: "@a@b＊：蓋班大臣現在外出了。\n@c0@"
199:
  en: "@a@b*: When he sees that you've returned, I wager he'll be somewhat taken aback!\n@c0@"
  ja: "@a@b＊「ゲバンさまも　王子の顔を見れば\n\tきっと　おどろかれることでしょう！\n@c0@"
