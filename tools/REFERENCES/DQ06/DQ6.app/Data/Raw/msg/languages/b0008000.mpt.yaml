74:
  en: "@a@b*: You saved my precious daughter's life. You'll always be welcome in my house!\n@c0@"
  ja: "@a@b＊「キミたちは　娘の命の恩人だ。\n\tいつでも　わが家に　遊びに\n\t来てくれて　いいぞ。\n@c0@"
  ko: "@a@b*: 여어, 너희를\n기다리고 있었어.\n@c0@"
  sl: "@a@b＊：你们是我女儿的救命恩人。\n　　无论何时都欢迎你们来我家。\n@c0@"
  tl: "@a@b＊：你們是我女兒的救命恩人。\n　　無論何時都歡迎你們來我家。\n@c0@"
75:
  en: "@a@b*: Relax an' take a breather. You saved my precious daughter's life!\n@c0@"
  ja: "@a@b＊「まあ　ゆっくりしていってくれ。\n\tキミたちは　娘の命の恩人だ。\n@c0@"
  ko: "@a@b*: 그 동안의 얘기는 내 딸한테\n전해들었어.\n@c0@"
  sl: "@a@b＊：请你们多留一段时间。\n　　你们是我女儿的救命恩人。\n@c0@"
  tl: "@a@b＊：請你們多留一段時間。\n　　你們是我女兒的救命恩人。\n@c0@"
76:
  en: "@a@b*: Accordin' to Cynthia, if you hadn't showed up when you did, she could've been in real danger.\n@c0@"
  ja: "@a@b＊「キミたちが　行ってくれなかったら\n\t娘の命が　あぶなかったと\n\tいうじゃないか。\n@c0@"
  ko: "@a@b*: 너희가 가 주지 않았더라면\n하마터면 목숨을 잃을 뻔\n했다더군.\n@c0@"
  sl: "@a@b＊：如果没有你们，\n　　我女儿现在可能就没命了。\n@c0@"
  tl: "@a@b＊：如果沒有你們，\n　　我女兒現在可能就沒命了。\n@c0@"
77:
  en: "@a@b*: I can't hope to ever express my gratitude, but I'd be honoured if you'd accept this small reward.\n@c0@"
  ja: "@a@b＊「そこで　お礼を　用意させて\n\tもらったよ。\n@c0@"
  ko: "@a@b*: 그래서 답례를\n준비했지.\n@c0@"
  sl: "@a@b＊：请收下我的礼物。\n@c0@"
  tl: "@a@b＊：請收下我的禮物。\n@c0@"
78:
  en: "@a@b*: It's a seed of life. I hope you'll find a use for it.\n@c0@"
  ja: "@a@b＊「いのちのきのみ　だ。\n\tキミたちの　役に　たててほしい。\n@c0@"
  ko: "@a@b*: 생명의 나무 열매야.\n요긴하게 썼으면 줗겠군.\n@c0@"
  sl: "@a@b＊：生命果实。\n　　希望能帮到你们。\n@c0@"
  tl: "@a@b＊：生命果實。\n　　希望能幫到你們。\n@c0@"
79:
  en: "@a@b%0%a000120 receives a seed of life.\n㈡\n%0%a000120 puts the seed of life in the bag.\n@c0@"
  ja: "@a@b%a000120は　いのちのきのみを\n%a001400に　入れた！\n@c0@"
  ko: "@a@b%a000120%F0120%X는%Y은%Z 생명의 나무 열매를\n%a001400에 넣었다!\n@c0@"
  sl: "@a@b%a000120把生命果实\n放入了%a001400！\n@c0@"
  tl: "@a@b%a000120把生命果實\n放入了%a001400！\n@c0@"
80:
  en: "@a@b*: One more thing before it slips my mind! My daughter tells me you paid the ransom out of yer own pocket!\n@c0@"
  ja: "@a@b＊「それと　もうひとつ。\n\tキミは　犯人たちに　自分たちの\n\t金を　わたしたそうじゃないか。\n@c0@"
