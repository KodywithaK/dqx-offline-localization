  sl: "@a@b＊：然后关上了贝壳，\n　　错过了%a002120。\n@c0@"
  tl: "@a@b＊：然後關上了貝殼，\n　　錯過了%a002120。\n@c0@"
109:
  en: "@a@b*: Welcome to Somnia, a city of class and distinction. Let's try to keep it that way, shall we?\n@c0@"
  ja: "@a@b＊「あら　旅のかたね。\n\tここは　レイドックの城下町よ。\n@c0@"
