  tl: "@a@b＊：咕嚕嚕，咕嚕嚕。\n　　別靠近我。\n　　我是壞蛋海生史萊姆。\n@c0@"
107:
  en: "@a@b*: My pal %a002120 said he wanted to meet up, but I scuttled off to the sea instead.\n@c0@"
  ja: "@a@b＊「ともだちの　%a002120が\n\t会いたいって　言っているのに\n\t海に　逃げこむんだ。\n@c0@"
