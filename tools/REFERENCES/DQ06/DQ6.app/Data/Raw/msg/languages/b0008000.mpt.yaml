  sl: "@a@b＊：如果你的打扮能再高贵一点，\n　　效果一定会更好。\n@c0@"
  tl: "@a@b＊：如果你的打扮能再高貴一點，\n　　效果一定會更好。\n@c0@"
122:
  en: "@a@b*: Stop messin' around! I wasn't born yesterday, you know!\n@c0@"
  ja: "@a@b＊「なにを　とぼけてるんだよ。\n@c0@"
  ko: "@a@b*: 괴물한테 잡혀먹혔을 거라고\n모두 수군거리고 있어.\n@c0@"
