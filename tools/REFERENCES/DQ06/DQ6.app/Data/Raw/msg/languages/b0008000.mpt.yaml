  tl: "@a@b＊：知道王子殿下回來的消息，\n　　國王和王妃一定會非常歡喜。\n@c0@"
178:
  en: "@a@b*: But locked in sleep's embrace, they know nothing of the world outside. It is a tragic state of affairs!\n@c0@"
  ja: "@a@b＊「しかし　おふたりは　いまだ\n\tねむったまま……。　おいたわしい\n\tかぎりで　ございます。\n@c0@"
