  tl: "@a@b＊：不過，\n　　你長得這麼像，\n　　被騙的肯定大有人在。\n@c0@"
121:
  en: "@a@b*: If you were just decked out in some fancier gear, you'd have everyone fooled!\n@c0@"
  ja: "@a@b＊「もっと　リッパな　カッコでも\n\tしていれば　なおさらだろうよ。\n@c0@"
