  tl: "@a@b＊：我們等待這一天\n　　已經太久太久了！\n@c0@"
203:
  en: "@a@b*: Now that you are here, I trust that you have discovered a method to bring your parents back to us?\n@c0@"
  ja: "@a@b＊「さあ！　はやく\n\t王子さまが　みつけてきた方法で\n\t王さまと王妃さまを……！\n@c0@"
  ko: "@a@b*: 오오! 왕자님이\n돌아오셨다는 게\n사실이란 말인가!\n@c0@"
  sl: "@a@b＊：请吧！\n　　快点用王子殿下您找到的方法\n　　将国王和王妃……\n@c0@"
  tl: "@a@b＊：請吧！\n　　快點用王子殿下您找到的方法\n　　將國王和王妃……\n@c0@"
204:
  en: "@a@b*: B-But you look uncomfortable!㈢㈢ Is something the matter?㈢㈢ Wh-Why do you say nothing?\n@c0@"
  ja: "@a@b＊「ど　どうしたのです！？\n\tなぜ　だまっているのです！？\n\tお㈢㈢　お㈢㈢　王子さま……。\n@c0@"
