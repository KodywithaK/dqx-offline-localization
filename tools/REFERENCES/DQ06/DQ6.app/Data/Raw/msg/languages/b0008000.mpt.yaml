134:
  en: "@a@b*: Of course you are! Only an ignoramus wouldn't be! Now, let me outline a humble theory of my own.\n@c0@"
  ja: "@a@b＊「オレが　思うに\n\t国王や　王妃さまは\n\t病気なんかじゃない。\n@c0@"
