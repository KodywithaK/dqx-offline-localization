  tl: "@a@b＊：喂，你知道嗎？\n　　這個國家的王子去討伐怪物，\n　　到現在還沒有回來。\n@c0@"
114:
  en: "@a@b*: But no one's seen or heard from him since. I hope he didn't get gobbled up by a monster...\n@c0@"
  ja: "@a@b＊「もう　怪物に食べられたんじゃって\n\tみんな　言ってるよ。\n@c0@"
