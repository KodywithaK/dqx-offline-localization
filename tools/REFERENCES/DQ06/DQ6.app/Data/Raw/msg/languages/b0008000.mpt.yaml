  sl: "@a@b＊：哦，你叫%a000090啊。\n　　真像啊……\n　　跟本国的王子真像。\n@c0@"
  tl: "@a@b＊：哦，你叫%a000090啊。\n　　真像啊……\n　　跟本國的王子真像。\n@c0@"
117:
