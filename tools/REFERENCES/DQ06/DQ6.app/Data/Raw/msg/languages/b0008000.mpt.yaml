  sl: "@a@b＊：还有一件事。\n　　听我女儿说，你们用\n　　自己的钱支付了赎金。\n@c0@"
  tl: "@a@b＊：還有一件事。\n　　聽我女兒說，你們用\n　　自己的錢支付了贖金。\n@c0@"
81:
  en: "@a@b*: You kept that one under yer hat, didn't you? You shoulda mentioned it!\n@c0@"
  ja: "@a@b＊「どうして　それを\n\t言ってくれなかったのだ？\n@c0@"
  ko: "@a@b*: 천천히 쉬었다 가.\n너희는 내 딸의 생명을 구해준 은인이니까.\n@c0@"
  sl: "@a@b＊：为什么你们不说呢？\n@c0@"
  tl: "@a@b＊：為什麼你們不說呢？\n@c0@"
82:
  en: "@a@b*: I've already paid back the money I collected. I'm afraid I haven't got two gold coins to rub together!\n@c0@"
  ja: "@a@b＊「用意してあった　金は　もう\n\t返してしまって　ここに　ない。\n@c0@"
