  sl: "@a@b＊：啊？是你！\n　　就是你！\n@c0@"
  tl: "@a@b＊：啊？是你！\n　　就是你！\n@c0@"
116:
  en: "@a@b*: What's that? You say your name's %a000090? Well, if you say so. But you really do look a heck of a lot like our Prince.\n@c0@"
  ja: "@a@b＊「そうか　%a000090って　いうのか。\n\tにしても　にてるよなあ……。\n\tこの国の　王子さまに。\n@c0@"
