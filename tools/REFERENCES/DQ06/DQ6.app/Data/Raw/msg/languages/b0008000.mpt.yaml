126:
  en: "@a@b*: You can't just go round draggin' a coffin behind you! You're bringin' down the tone of the place!\n@c0@"
  ja: "@a@b＊「なんだい　あんたら\n\tカンオケなんか　ひきずって\n\tエンギが　わるいなあ。\n@c0@"
