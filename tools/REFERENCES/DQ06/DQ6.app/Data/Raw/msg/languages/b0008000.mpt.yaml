  sl: "@a@b＊：啊啊，可恨可恨！\n　　盖班大臣趁着国王陛下生病，\n　　为非作歹，为所欲为。\n@c0@"
  tl: "@a@b＊：啊啊，可恨可恨！\n　　蓋班大臣趁著國王陛下生病，\n　　為非作歹，為所欲為。\n@c0@"
112:
  en: "@a@b*: I feel a terrible foreboding. The very survival of the Kingdom of Somnia hangs in the balance.\n@c0@"
