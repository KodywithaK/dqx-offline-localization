  sl: "@a@b＊：凑好的钱已经还回去了，\n　　现在我没有钱了。\n@c0@"
  tl: "@a@b＊：湊好的錢已經還回去了，\n　　現在我沒有錢了。\n@c0@"
83:
  en: "@a@b*: So I hope that you'll see fit to accept a humble gift as a token of my gratitude.\n@c0@"
  ja: "@a@b＊「だから　かわりに　これを\n\t受けとってくれ。\n@c0@"
  ko: "@a@b*: 그래서 답례를\n준비했지.\n@c0@"
  sl: "@a@b＊：作为回报，\n　　请收下这个吧。\n@c0@"
  tl: "@a@b＊：作為回報，\n　　請收下這個吧。\n@c0@"
84:
  en: "@a@b*: This is somefin' that's been handed down through the generations in this family. It's a prayer ring.\n@c0@"
  ja: "@a@b＊「わが家の　家宝\n\tいのりのゆびわ　だ。\n\tエンリョは　いらないぞ。\n@c0@"
  ko: "@a@b*: 생명의 나무 열매야.\n요긴하게 썼으면 줗겠군.\n@c0@"
  sl: "@a@b＊：我的传家之宝，\n　　祈祷戒指。\n　　请千万不要客气。\n@c0@"
  tl: "@a@b＊：我的傳家之寶，\n　　祈禱戒指。\n　　請千萬不要客氣。\n@c0@"
85:
  en: "@a@b%0%a000120 receives a prayer ring.\n㈡\n%0%a000120 puts the prayer ring in the bag.\n@c0@"
  ja: "@a@b%a000120は　いのりのゆびわを\n%a001400に　入れた！\n@c0@"
