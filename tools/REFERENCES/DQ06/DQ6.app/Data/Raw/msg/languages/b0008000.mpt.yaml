  tl: "@a@b＊：誒？你、你你，\n　　你莫非是真正的王子？\n@c0@"
119:
  en: "@a@b*: Ha ha! You almost got me! You really had me goin' for a second there with your japery!\n@c0@"
  ja: "@a@b＊「どひゃー！　なーんて\n\tもう　ちょっとで\n\t信用してしまうところだったな。\n@c0@"
  ko: "@a@b*: 아아, 싫다 싫어.\n폐하의 병환을 빌미로\n대신인 게반이 제멋대로 설치고 있어.\n@c0@"
  sl: "@a@b＊：哈哈！\n　　差点就被你骗过去了。\n@c0@"
  tl: "@a@b＊：哈哈！\n　　差點就被你騙過去了。\n@c0@"
120:
  en: "@a@b*: Still, let me tell you — there are plenty of folks here who'd take you for the Prince.\n@c0@"
  ja: "@a@b＊「けどよ　そんだけ　にてれば\n\tだまされるヤツが　いるかも\n\tしれないぜ。\n@c0@"
