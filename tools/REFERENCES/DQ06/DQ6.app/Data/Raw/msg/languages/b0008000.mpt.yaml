  tl: "@a@b＊：王子殿下出發\n　　去尋找喚醒二位的方法，\n　　到現在已經一年了。\n@c0@"
202:
  en: "@a@b*: We have awaited your return, hoping each day that you would bring good tidings.\n@c0@"
  ja: "@a@b＊「この日のくるのを\n\tどれほど　まちわびたことかっ！\n@c0@"
