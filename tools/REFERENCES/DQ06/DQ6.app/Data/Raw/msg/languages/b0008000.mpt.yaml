  tl: "@a@b＊：嗯……為了奪回世界的和平！\n　　我們要積極準備，與魔王姆多決一死戰，\n　　為此每人加稅５０枚金幣！唉……\n@c0@"
131:
  en: "@a@b*: We're being squeezed dry, I tell you! Now they want another fifty gold coins out of each of us! Honestly!\n@c0@"
