86:
  en: "@a@b*: You saved my precious daughter's life. You'll always be welcome in my house!\n@c0@"
  ja: "@a@b＊「キミたちは　娘の命の恩人だ。\n\tいつでも　わが家に　遊びに\n\t来てくれて　いいぞ。\n@c0@"
  ko: "@a@b*: 그리고 또 한 가지.\n범인들에게 네가 가진\n돈을 건네줬다지?\n@c0@"
