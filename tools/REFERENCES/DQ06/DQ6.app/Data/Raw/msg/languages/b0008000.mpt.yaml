132:
  en: "@a@b*: When our King and Queen were healthy, we were never taxed like this! Something is seriously awry!\n@c0@"
  ja: "@a@b＊「王さまや　王妃さまが\n\t元気なときは　こんなことは\n\tなかったのに……。\n@c0@"
