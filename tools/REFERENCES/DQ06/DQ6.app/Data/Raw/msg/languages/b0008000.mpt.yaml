  sl: "@a@b＊：国王和王妃\n　　还醒着的时候，\n　　绝不会有这种事……\n@c0@"
  tl: "@a@b＊：國王和王妃\n　　還醒著的時候，\n　　絕不會有這種事……\n@c0@"
133:
