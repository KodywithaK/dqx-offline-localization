  sl: "@a@b＊：好朋友%a002120\n　　明明都说它想我了，\n　　我却逃到了海里。\n@c0@"
  tl: "@a@b＊：好朋友%a002120\n　　明明都說它想我了，\n　　我卻逃到了海裡。\n@c0@"
108:
  en: "@a@b*: Not much chance for a chance encounter if I keep gooing back inside my shell...\n@c0@"
