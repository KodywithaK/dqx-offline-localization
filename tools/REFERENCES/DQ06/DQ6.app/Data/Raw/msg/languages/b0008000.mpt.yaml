  tl: "@a@b＊：看到王子殿下回來的話，\n　　蓋班大臣會嚇一跳吧！\n@c0@"
200:
  en: "@a@b*: My liege, I am sorry to report that your parents continue to sleep without any sign of waking.\n@c0@"
  ja: "@a@b＊「王子さま！　あなたさまの父と母\n\t王と王妃さまは　いまだ\n\tねむったままで　ございます。\n@c0@"
  ko: "@a@b*: 헉! 혹시 왕자님!?\n어, 어서 오십시오!  \n@c0@"
  sl: "@a@b＊：王子殿下！\n　　您的父母，国王和王妃\n　　如今正在沉睡。\n@c0@"
  tl: "@a@b＊：王子殿下！\n　　您的父母，國王和王妃\n　　如今正在沉睡。\n@c0@"
201:
  en: "@a@b*: An entire year has passed since you set out on your quest to find a way to rouse them.\n@c0@"
  ja: "@a@b＊「王子さまが　おふたりを\n\t目ざめさせる方法を　さがして\n\t旅に出てから　はや１年。\n@c0@"
