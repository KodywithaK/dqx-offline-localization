  sl: "@a@b＊：井里面有另一个世界！\n　　不可能有这种事吧。\n@c0@"
  tl: "@a@b＊：井裡面有另一個世界！\n　　不可能有這種事吧。\n@c0@"
130:
  en: "@a@b*: I know we're at war with Murdaw's forces, but who ends up paying for everything? The taxpayer, that's who!\n@c0@"
