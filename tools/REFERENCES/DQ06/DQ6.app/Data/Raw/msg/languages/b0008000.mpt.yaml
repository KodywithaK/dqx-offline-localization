  sl: "@a@b＊：这样下去，\n　　雷多克国要完蛋了。\n@c0@"
  tl: "@a@b＊：這樣下去，\n　　雷多克國要完蛋了。\n@c0@"
113:
  en: "@a@b*: Have you heard? Our brave Prince went off to bash monsters and defend Somnia...\n@c0@"
  ja: "@a@b＊「ねえ　知ってる？\n\tこの国の王子さま　怪物を退治に\n\t行ったまま　もどらないんだって。\n@c0@"
