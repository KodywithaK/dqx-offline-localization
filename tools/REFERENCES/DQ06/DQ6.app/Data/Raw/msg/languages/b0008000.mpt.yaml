  tl: "@a@b＊：趕快去教會，\n　　把問題解決了再說吧。\n@c0@"
128:
  en: "@a@b*: My dad says Chancellor Keating is a grasping, power-hungry leech! But he also told me never to repeat that... Whoops!\n@c0@"
  ja: "@a@b＊「大臣のゲバンなんか\n\tだいっきらいだよ！\n@c0@"
