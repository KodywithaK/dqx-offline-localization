  sl: "@a@b＊：哎呀，是旅行者。\n　　这里是雷多克城区。\n@c0@"
  tl: "@a@b＊：哎呀，是旅行者。\n　　這裡是雷多克城區。\n@c0@"
110:
  en: "@a@b*: Woof! Woof, woof!\n@c0@"
  ja: "@a@b＊「わん　わん　わん！\n@c0@"
  ko: "@a@b*: 서쪽에 있는 바위산을 북쪽으로 \n넘어간 뒤 좀더 서쪽으로 걷다 보면 \n나오지.\n@c0@"
  sl: "@a@b＊：汪汪，汪！\n@c0@"
  tl: "@a@b＊：汪汪，汪！\n@c0@"
111:
  en: "@a@b*: With the King incapacitated, Chancellor Keating couldn't wait to get his hands on the levers of power!\n@c0@"
  ja: "@a@b＊「ああ　いやだ　いやだ。\n\t王さまが　ご病気なのを　いいことに\n\t大臣のゲバンは　やりたい放だい。\n@c0@"
