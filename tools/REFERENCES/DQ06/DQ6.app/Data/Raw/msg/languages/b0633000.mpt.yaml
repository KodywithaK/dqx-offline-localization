  tl: "@a@b%a002020：去到下面的世界後，\n　　或許會戀上某個很不錯的人吧！\n　　哎嘿。\n@c0@"
228:
  en: "@a%0%a002000@bIt's really gonna fade away soon, huh...?\n@c0@"
  ja: "@a@b%a002000「本当に　見えなく\n\tなっちまうのかよ……。\n@c0@"
  ko: "@a@b%a002000: 정말 보이지 않게\n되어 버리는 걸까......\n@c0@"
  sl: "@a@b%a002000：真的再也\n　　看不到这里了吗……\n@c0@"
  tl: "@a@b%a002000：真的再也\n　　看不到這裡了嗎……\n@c0@"
229:
  en: "@a%0%a002000@bWell, even if it disappeared right before my eyes, I'd never forget any of the folks here!\n@c0@"
