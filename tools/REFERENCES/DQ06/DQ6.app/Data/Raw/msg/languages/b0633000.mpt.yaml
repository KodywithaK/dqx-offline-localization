  sl: "@a@b%a002030：世界树之露\n　　发挥了非常大的作用呢！\n@c0@"
  tl: "@a@b%a002030：世界樹之露\n　　發揮了非常大的作用呢！\n@c0@"
223:
  en: "@a%0%a002020@bI guess only one World Tree can grow at a time, huh?\n@c0@"
