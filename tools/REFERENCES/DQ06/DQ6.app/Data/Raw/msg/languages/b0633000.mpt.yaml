  tl: "@a@b%a002000：啊！俺這麼說\n　　並不是在開玩笑啊！\n　　誒？聽起來不像？這樣啊……\n@c0@"
222:
  en: "@a%0%a002030@bYggdrasil's dew proved indispensable!\n@c0@"
  ja: "@a@b%a002030「世界樹のしずくは\n\tとても　役に　立ちましたね！\n@c0@"
