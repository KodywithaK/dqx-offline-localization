  ko: "@a@b%a002000: 마음만은 고맙게\n받아 두자고!\n@c0@"
  sl: "@a@b%a002000：大伙的那份心意，\n　　咱们就很感恩地收下吧！\n@c0@"
  tl: "@a@b%a002000：大夥的那份心意，\n　　咱們就很感恩地收下吧！\n@c0@"
234:
  en: "@a%0%a002030@bI find the priest's words deeply moving...\n@c0@"
