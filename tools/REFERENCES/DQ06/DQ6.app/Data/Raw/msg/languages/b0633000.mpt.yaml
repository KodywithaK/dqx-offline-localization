  tl: "@a@b%a002000：原本，咱們就從來\n　　沒有指望著要誰向咱們報恩什麼的。\n@c0@"
233:
  en: "@a%0%a002000@bStill, it's the thought that counts 'n' everything like that.\n@c0@"
