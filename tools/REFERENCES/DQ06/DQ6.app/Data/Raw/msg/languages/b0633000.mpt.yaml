175:
  en: "@a%0%a002030@bI too would dearly love to stay and learn more from Lord Zenith about his extraordinary castle.\n@c0@"
  ja: "@a@b%a002030「できれば　私も\n\tこの　お城について　いろいろと\n\t調べてみたいと　思いますね。\n@c0@"
  ko: "@a@b%a002030: 가능하다면 저도\n이 성에 관해서 이것저것\n조사해보고 싶습니다.\n@c0@"
  sl: "@a@b%a002030：如果可以的话，\n　　有关这座城堡的很多情况\n　　我都想去调查看看。\n@c0@"
  tl: "@a@b%a002030：如果可以的話，\n　　有關這座城堡的很多情況\n　　我都想去調查看看。\n@c0@"
176:
  en: "@a%0%a002020@bDid you see Isaac's eyes? They're practically tearing up, he's so excited.\n@c0@"
  ja: "@a@b%a002020「マサールさん\n\t目が　キラキラ　かがやいてるよ。\n@c0@"
  ko: "@a@b%a002020: 마살 님\n눈이 반짝반짝 빛나고 있어요.\n@c0@"
  sl: "@a@b%a002020：你快看，\n　　马萨尔先生都两眼放光了。\n@c0@"
  tl: "@a@b%a002020：你快看，\n　　馬薩爾先生都兩眼放光了。\n@c0@"
177:
  en: "@a%0%a002000@bHardy har! The high-'n'-mighty sages of legend thankin' us personally! Imagine that!\n@c0@"
  ja: "@a@b%a002000「うへへっ\n\t伝説の　大賢者さまに\n\t礼を　いわれちゃったぜ！\n@c0@"
  ko: "@a@b%a002000: 우헤헤\n전설의 대현자님에게\n고맙다는 말을 들었어!\n@c0@"
  sl: "@a@b%a002000：呜嘿嘿，\n　　传说中的大贤者大人\n　　对俺说谢谢啦！\n@c0@"
  tl: "@a@b%a002000：嗚嘿嘿，\n　　傳說中的大賢者大人\n　　對俺說謝謝啦！\n@c0@"
178:
  en: "@a%0%a002030@bOnly by working together were we able to bring peace back to the world.\n@c0@"
  ja: "@a@b%a002030「みんなが　チカラを\n\t合わせたからこそ　世界に　平和が\n\tおとずれたのですよね！\n@c0@"
  ko: "@a@b%a002030: 모두 힘을 합쳐서\n싸웠기 때문에 세계에 평화가\n찾아온 겁니다!\n@c0@"
  sl: "@a@b%a002030：正是因为大家的\n　　同心协力，才能为世界\n　　取回和平的呢！\n@c0@"
  tl: "@a@b%a002030：正是因為大家的\n　　同心協力，才能為世界\n　　取回和平的呢！\n@c0@"
179:
  en: "@a%0%a002020@bTee hee! He didn't have to thank us! We were just doing our jobs!\n@c0@"
  ja: "@a@b%a002020「えへへ　そんなあ。\n\tお礼を　いわれるほどでも～。\n\tえっへん！\n@c0@"
  ko: "@a@b%a002020: 에헤헤, 그렇게\n고마워할 것까진~\n에헴!\n@c0@"
  sl: "@a@b%a002020：诶嘿嘿，才没有啦。\n　　还没到该被感谢的地步啦～\n　　嗯哼！\n@c0@"
  tl: "@a@b%a002020：誒嘿嘿，才沒有啦。\n　　還沒到該被感謝的地步啦～\n　　嗯哼！\n@c0@"
180:
  en: "@a%0%a002000@bHmm... He makes it sound like we'll never see each other again. Wouldn't that be sad...?\n@c0@"
  ja: "@a@b%a002000「なんだか　ホントに\n\tお別れの　あいさつみたいで\n\tさびしいじゃないかよ……。\n@c0@"
  ko: "@a@b%a002000: 왠지 정말\n이별 인사 같아서\n슬퍼지는군......\n@c0@"
  sl: "@a@b%a002000：感觉这怎么说得\n　　跟真的永别似的，\n　　让人感觉很伤感啊……\n@c0@"
  tl: "@a@b%a002000：感覺這怎麼說得\n　　跟真的永別似的，\n　　讓人感覺很傷感啊……\n@c0@"
181:
  en: "@a%0%a002030@bI fear the time has come for us to take our leave.\n@c0@"
  ja: "@a@b%a002030「さあ　私たちも\n\t行きましょう。\n@c0@"
  ko: "@a@b%a002030: 자, 우리도\n가도록 하죠.\n@c0@"
  sl: "@a@b%a002030：走吧，我们也该回去了。\n@c0@"
  tl: "@a@b%a002030：走吧，我們也該回去了。\n@c0@"
182:
  en: "@a%0%a002020@bWe better hurry up. Don't want to keep %a002010 and %a002040 waiting!\n@c0@"
  ja: "@a@b%a002020「%a002010たちが\n\t待ってるよ。　はやく　行こ！\n@c0@"
  ko: "@a@b%a002020: %a002010%F2010%X가%Y이%Z\n기다리잖아. 어서 가자!\n@c0@"
  sl: "@a@b%a002020：%a002010他们\n　　正等着呢。我们赶紧走吧！\n@c0@"
  tl: "@a@b%a002020：%a002010他們\n　　正等著呢。我們趕緊走吧！\n@c0@"
183:
  en: "@a%0%a002000@bHe sounded a bit flustered, aye? He must be too nervous to say much else to ya, %a000090.\n@c0@"
  ja: "@a@b%a002000「いまの　兵隊\n\t%a000090に　声かけられて\n\t緊張してたみたいだったぜ。\n@c0@"
  ko: "@a@b%a002000: 방금 그 병사\n%a000090%F0090%X가%Y이%Z 말을 걸어서\n긴장한 것 같더군.\n@c0@"
  sl: "@a@b%a002000：刚才%a000090\n　　跟那个士兵说话的时候，\n　　他看上去非常紧张啊。\n@c0@"
  tl: "@a@b%a002000：剛才%a000090\n　　跟那個士兵說話的時候，\n　　他看上去非常緊張啊。\n@c0@"
184:
  en: "@a%0%a002030@bLet's bid farewell to the castle's other residents.\n@c0@"
  ja: "@a@b%a002030「ほかの　みなさんにも\n\tごあいさつして　行きましょう。\n@c0@"
  ko: "@a@b%a002030: 다른 사람들한테도\n인사하러 가시죠.\n@c0@"
  sl: "@a@b%a002030：我们再去和\n　　其他人打声招呼吧。\n@c0@"
  tl: "@a@b%a002030：我們再去和\n　　其他人打聲招呼吧。\n@c0@"
185:
  en: "@a%0%a002020@bCome on, guys! Or %a002040's gonna be all grumpy!\n@c0@"
  ja: "@a@b%a002020「下で　%a002040たちが\n\t待ってるよ！\n@c0@"
  ko: "@a@b%a002020: 밑에서 %a002040%F2040%X가%Y이%Z\n기다리고 있어!\n@c0@"
  sl: "@a@b%a002020：%a002040他们\n　　正在下面等着呢！\n@c0@"
  tl: "@a@b%a002020：%a002040他們\n　　正在下面等著呢！\n@c0@"
186:
  en: "@a%0%a002000@bCan't sneak anything past Lord Zenith, aye?\n@c0@"
  ja: "@a@b%a002000「ゼニス王は　なにもかも\n\tお見通しのようだな。\n@c0@"
  ko: "@a@b%a002000: 제니스 왕은 뭐든\n다 꿰뚫어보는구나.\n@c0@"
  sl: "@a@b%a002000：泽尼斯王似乎\n　　早就洞察一切了。\n@c0@"
  tl: "@a@b%a002000：澤尼斯王似乎\n　　早就洞察一切了。\n@c0@"
187:
  en: "@a%0%a002030@bIt matters little who actually defeated Mortamor, as long as the world is truly at peace.\n@c0@"
  ja: "@a@b%a002030「世界が　平和にさえ　なれば\n\t誰が　デスタムーアを　倒したかなど\n\t問題では　ありませんよね。\n@c0@"
  ko: "@a@b%a002030: 세계에 평화만 찾아온다면\n누가 데스타무아를 쓰러뜨렸는지는\n문제가 아니지요.\n@c0@"
  sl: "@a@b%a002030：只要世界重新归于和平，\n　　那么究竟是谁打倒了德斯塔穆亚\n　　也变得无关紧要了呢。\n@c0@"
  tl: "@a@b%a002030：只要世界重新歸於和平，\n　　那麼究竟是誰打倒了德斯塔穆亞\n　　也變得無關緊要了呢。\n@c0@"
188:
  en: "@a%0%a002020@bWe actually did something a heck of a lot tougher than beating Mortamor!\n@c0@"
  ja: "@a@b%a002020「デスタムーアを　倒すより\n\tもーっと　たいへんなことを\n\tしてきたんだもんねー！\n@c0@"
  ko: "@a@b%a002020: 데스타무아를 쓰러뜨리는\n것보다 더 대단한 일을\n하고 왔잖아~!\n@c0@"
  sl: "@a@b%a002020：除了打倒德斯塔穆亚，\n　　我们还做过更多了不起的事哦！\n@c0@"
  tl: "@a@b%a002020：除了打倒德斯塔穆亞，\n　　我們還做過更多了不起的事哦！\n@c0@"
189:
  en: "@a%0%a002000@bThe ‘sound of life’? From an egg? What's that about?\n@c0@"
  ja: "@a@b%a002000「タマゴから　いのちの音？\n\tなんのこと　だろうな？\n@c0@"
  ko: "@a@b%a002000: 알에서 생명의 소리?\n무슨 말이지?\n@c0@"
  sl: "@a@b%a002000：蛋里面有生命的声音？\n　　这是什么意思啊？\n@c0@"
  tl: "@a@b%a002000：蛋裡面有生命的聲音？\n　　這是什麼意思啊？\n@c0@"
190:
  en: "@a%0%a002030@bWhatever nature of egg that may be, new life stirs within.\n@c0@"
  ja: "@a@b%a002030「どんな　タマゴにだって\n\tいのちが　つまっていますから。\n@c0@"
  ko: "@a@b%a002030: 어떤 알이든\n생명이 있지 않나요?\n@c0@"
  sl: "@a@b%a002030：无论是哪一颗蛋里，\n　　都存在着演变出生命的可能性。\n@c0@"
  tl: "@a@b%a002030：無論是哪一顆蛋裡，\n　　都存在著演變出生命的可能性。\n@c0@"
191:
  en: "@a%0%a002020@bThe egg's making noises? This I gotta hear!\n@c0@"
  ja: "@a@b%a002020「タマゴの　いのちの音！？\n\tあたし　聞いてみたーい！\n@c0@"
  ko: "@a@b%a002020: 알에서 생명의 소리!?\n나도 들어보고 싶어~!\n@c0@"
  sl: "@a@b%a002020：蛋里面生命的声音？！\n　　我想听听～\n@c0@"
  tl: "@a@b%a002020：蛋裡面生命的聲音？！\n　　我想聽聽～\n@c0@"
192:
  en: "@a%0%a002000@bHuh. I didn't know new eras hatched from eggs.\n@c0@"
  ja: "@a@b%a002000「未来って　タマゴから\n\t生まれる　ものだったのか……？\n@c0@"
  ko: "@a@b%a002000: 미래는 알에서\n태어나는 것이었나......?\n@c0@"
  sl: "@a@b%a002000：未来这种东西\n　　是从蛋里孵出来的吗？\n@c0@"
  tl: "@a@b%a002000：未來這種東西\n　　是從蛋裡孵出來的嗎？\n@c0@"
193:
  en: "@a%0%a002030@bI wonder what kind of future is about to be born...\n@c0@"
  ja: "@a@b%a002030「生まれてくるのは\n\tどんな　未来なのでしょう？\n@c0@"
  ko: "@a@b%a002030: 어떤 미래가\n태어날까요?\n@c0@"
  sl: "@a@b%a002030：会有什么样的未来\n　　孕育出来呢？\n@c0@"
  tl: "@a@b%a002030：會有什麼樣的未來\n　　孕育出來呢？\n@c0@"
194:
  en: "@a%0%a002020@bLet's hope this new era hatches sunny side up! Tee hee!\n@c0@"
  ja: "@a@b%a002020「タマゴから　生まれるなんて\n\tなんか　おいしそうな　未来だねー！\n@c0@"
  ko: "@a@b%a002020: 알에서 태어난다니\n왠지 맛있는 미래일 것 같아!\n@c0@"
  sl: "@a@b%a002020：从蛋里生出来的未来，\n　　听上去都觉得很好吃呢！\n@c0@"
  tl: "@a@b%a002020：從蛋裡生出來的未來，\n　　聽上去都覺得很好吃呢！\n@c0@"
195:
  en: "@a%0%a002000@bHuh. Is any of this making sense to you, %a000090?\n@c0@"
  ja: "@a@b%a002000「うーん……\n\tすまないが　なんのことだか\n\tオレには　よくわからないぜ。\n@c0@"
  ko: "@a@b%a002000: 으음......\n미안하지만 난 무슨 말인지\n전혀 모르겠군.\n@c0@"
  sl: "@a@b%a002000：嗯……\n　　俺不是太明白\n　　他们在说些啥。\n@c0@"
  tl: "@a@b%a002000：嗯……\n　　俺不是太明白\n　　他們在說些啥。\n@c0@"
196:
  en: "@a%0%a002030@bIt sounds as if the future is bright.\n@c0@"
  ja: "@a@b%a002030「未来は　かがやかしいほうが\n\tいいですよね。\n@c0@"
  ko: "@a@b%a002030: 미래는 빛나는 편이\n좋겠지요.\n@c0@"
  sl: "@a@b%a002030：要说未来的话，还是\n　　闪闪发光一点比较好呢。\n@c0@"
  tl: "@a@b%a002030：要說未來的話，還是\n　　閃閃發光一點比較好呢。\n@c0@"
197:
  en: "@a%0%a002020@bMaybe she just means the future's bright now that Mortamor's gone...?\n@c0@"
  ja: "@a@b%a002020「大魔王を　倒したあとの\n\t未来は　明るい　ってことかな？\n@c0@"
  ko: "@a@b%a002020: 대마왕을 쓰러뜨린 후의\n미래는 밝다는 뜻인가?\n@c0@"
  sl: "@a@b%a002020：也就是说大魔王\n　　被消灭后的未来充满了光明啊！\n@c0@"
  tl: "@a@b%a002020：也就是說大魔王\n　　被消滅後的未來充滿了光明啊！\n@c0@"
198:
  en: "@a%0%a002000@bI heard it alright! There's life in there, believe you me!\n@c0@"
  ja: "@a@b%a002000「聞こえたぜ！\n\tあの　キュルキュル　ってのが\n\tいのちの音だったんだな！\n@c0@"
  ko: "@a@b%a002000: 들렸어!\n저 큐릉큐릉 하는 소리가\n생명의 소리였구나!\n@c0@"
  sl: "@a@b%a002000：俺已经听见了！\n　　那个咕噜咕噜的声音\n　　就是生命的声音吧？\n@c0@"
  tl: "@a@b%a002000：俺已經聽見了！\n　　那個咕嚕咕嚕的聲音\n　　就是生命的聲音吧？\n@c0@"
199:
  en: "@a%0%a002030@bWhatever nature of egg that may be, new life stirs within.\n@c0@"
  ja: "@a@b%a002030「どんな　タマゴにだって\n\tいのちが　つまっていますから。\n@c0@"
  ko: "@a@b%a002030: 어떤 알이든\n생명이 있지 않나요?\n@c0@"
  sl: "@a@b%a002030：无论是哪一颗蛋里，\n　　都存在着演变出生命的可能性。\n@c0@"
  tl: "@a@b%a002030：無論是哪一顆蛋裡，\n　　都存在著演變出生命的可能性。\n@c0@"
200:
  en: "@a%0%a002020@bYep! We sure heard it!\n@c0@"
  ja: "@a@b%a002020「いのちの音\n\t聞いちゃったもんねー！\n@c0@"
  ko: "@a@b%a002020: 생명의 소리\n들어 버렸어~!\n@c0@"
  sl: "@a@b%a002020：生命的声音，\n　　我也听见了呢！\n@c0@"
  tl: "@a@b%a002020：生命的聲音，\n　　我也聽見了呢！\n@c0@"
201:
  en: "@a%0%a002000@bHope she's right. It'd be a real let-down if it was just a plain ol' lizard in there, aye?\n@c0@"
  ja: "@a@b%a002000「まちがって　トカゲとか\n\t生まれないだろうな……。\n@c0@"
  ko: "@a@b%a002000: 그러다가 도마뱀이\n태어난다거나 그러진 않겠지......\n@c0@"
  sl: "@a@b%a002000：可别搞错了\n　　生出来一条蜥蜴什么的啊……\n@c0@"
  tl: "@a@b%a002000：可別搞錯了\n　　生出來一條蜥蜴什麼的啊……\n@c0@"
202:
  en: "@a%0%a002030@bI have faith that a bright future is about to be born.\n@c0@"
  ja: "@a@b%a002030「生まれてくるのは\n\tきっと　明るい　未来です！\n@c0@"
  ko: "@a@b%a002030: 태어나는 건\n틀림없이 밝은 미래일 겁니다!\n@c0@"
  sl: "@a@b%a002030：生出来的一定会是\n　　光明伟大的未来！\n@c0@"
  tl: "@a@b%a002030：生出來的一定會是\n　　光明偉大的未來！\n@c0@"
203:
  en: "@a%0%a002020@bYou hear it shuffling in there? That thing's gonna crack any time now!\n@c0@"
  ja: "@a@b%a002020「今にも　生まれそうに\n\t動いてたよね！\n@c0@"
  ko: "@a@b%a002020: 당장에라도\n태어날 듯이 움직여!\n@c0@"
  sl: "@a@b%a002020：听这动静，\n　　感觉好像马上就要破壳而出了！\n@c0@"
  tl: "@a@b%a002020：聽這動靜，\n　　感覺好像馬上就要破殼而出了！\n@c0@"
204:
  en: "@a%0%a002000@bThis is all over my head, but I'm sure it'll make sense once it hatches.\n@c0@"
  ja: "@a@b%a002000「オレには　よくわからないが\n\tタマゴから　未来が　生まれるところは\n\t見てみたいぜ。\n@c0@"
  ko: "@a@b%a002000: 난 잘 모르겠지만\n알에서 미래가 태어나는 순간을\n보고 싶긴 하군.\n@c0@"
  sl: "@a@b%a002000：虽然俺不是太明白，\n　　但是也想亲眼见证从蛋里\n　　孕育出来的未来呢。\n@c0@"
  tl: "@a@b%a002000：雖然俺不是太明白，\n　　但是也想親眼見證從蛋裡\n　　孕育出來的未來呢。\n@c0@"
205:
  en: "@a%0%a002030@bIt sounds as if the future is bright!\n@c0@"
  ja: "@a@b%a002030「未来は　かがやかしいほうが\n\tいいですよね。\n@c0@"
  ko: "@a@b%a002030: 미래는 빛나는 편이\n좋겠지요.\n@c0@"
  sl: "@a@b%a002030：要说未来的话，还是\n　　闪闪发光一点比较好呢。\n@c0@"
  tl: "@a@b%a002030：要說未來的話，還是\n　　閃閃發光一點比較好呢。\n@c0@"
206:
  en: "@a%0%a002020@bThe future's bright for all of us now that Mortamor's gone, huh?\n@c0@"
  ja: "@a@b%a002020「大魔王を　倒したあとの\n\t未来は　明るい　ってことだね！\n@c0@"
  ko: "@a@b%a002020: 대마왕을 쓰러뜨린 후의\n미래는 밝다는 뜻이지!\n@c0@"
  sl: "@a@b%a002020：打倒大魔王之后，\n　　也就是说未来会很光明对吧！\n@c0@"
  tl: "@a@b%a002020：打倒大魔王之後，\n　　也就是說未來會很光明對吧！\n@c0@"
207:
  en: "@a%0%a002000@bThey'd better not falter, aye? I've had my fill of savin' the world for one lifetime.\n@c0@"
  ja: "@a@b%a002000「オレたちも　こんな戦いは\n\tにどと　ゴメンだぜ。\n@c0@"
  ko: "@a@b%a002000: 우리도 이런 전투는\n두 번 다시 사양이야.\n@c0@"
  sl: "@a@b%a002000：这种战斗，\n　　俺们可不想再经历一次了。\n@c0@"
  tl: "@a@b%a002000：這種戰鬥，\n　　俺們可不想再經歷一次了。\n@c0@"
208:
  en: "@a%0%a002000@bNext time we go on a journey together, it'd better be for a holiday!\n@c0@"
  ja: "@a@b%a002000「次に　みんなで　旅するときは\n\t楽しい旅を　したいもんだな！\n@c0@"
  ko: "@a@b%a002000: 다음에 모두 함께 여행할 땐\n즐거운 여행을 하고 싶군!\n@c0@"
  sl: "@a@b%a002000：下次再和大伙一起\n　　旅行的话，希望能够轻松愉快呢！\n@c0@"
  tl: "@a@b%a002000：下次再和大夥一起\n　　旅行的話，希望能夠輕鬆愉快呢！\n@c0@"
209:
  en: "@a%0%a002030@bI have faith that Lord Zenith's research will find a way to keep darkness at bay.\n@c0@"
  ja: "@a@b%a002030「ゼニス王たちの\n\t研究に　期待しましょう。\n@c0@"
  ko: "@a@b%a002030: 제니스 왕의\n연구를 기대해 보자구요.\n@c0@"
  sl: "@a@b%a002030：那就期待着泽尼斯王\n　　他们的研究吧。\n@c0@"
  tl: "@a@b%a002030：那就期待著澤尼斯王\n　　他們的研究吧。\n@c0@"
210:
  en: "@a%0%a002020@bWe'll just have to pray that Mortamor is the last of these diabolical destroyer types, huh?\n@c0@"
  ja: "@a@b%a002020「また　デスタムーアみたいな\n\tとんでもないヤツが　出てこないように\n\t祈らなくっちゃね！\n@c0@"
  ko: "@a@b%a002020: 또 데스타무아 같은\n황당한 녀석이 나오지 않도록\n기도해야겠어!\n@c0@"
  sl: "@a@b%a002020：衷心祈求不要\n　　再有像德斯塔穆亚那样\n　　不得了的家伙跑出来！\n@c0@"
  tl: "@a@b%a002020：衷心祈求不要\n　　再有像德斯塔穆亞那樣\n　　不得了的傢伙跑出來！\n@c0@"
211:
  en: "@a%0%a002000@bAye, maybe I should write a chapter on how amazin' we are.\n@c0@"
  ja: "@a@b%a002000「オレたちの　強さは\n\tだれも　想像　できないほどの\n\t強さだった　ってことだな。\n@c0@"
  ko: "@a@b%a002000: 우리의 실력은\n아무도 상상하지 못할 정도로\n강했다는 거겠지.\n@c0@"
  sl: "@a@b%a002000：也就是说，\n　　咱们已经拥有了谁都\n　　无法想象的强大力量了吧。\n@c0@"
  tl: "@a@b%a002000：也就是說，\n　　咱們已經擁有了誰都\n　　無法想像的強大力量了吧。\n@c0@"
212:
  en: "@a%0%a002030@bThis quest has taught me that there is so much out there that cannot be learnt from books alone.\n@c0@"
  ja: "@a@b%a002030「私も　この旅で\n\t本では　学べないものが\n\tたくさん　あることを　知りました。\n@c0@"
  ko: "@a@b%a002030: 저도 이 여행에서\n책에서는 배울 수 없는 것을\n많이 배웠습니다.\n@c0@"
  sl: "@a@b%a002030：在这次旅途中，\n　　我也学到了很多\n　　在书本上学不到的东西。\n@c0@"
  tl: "@a@b%a002030：在這次旅途中，\n　　我也學到了很多\n　　在書本上學不到的東西。\n@c0@"
213:
  en: "@a%0%a002020@bSomebody's bound to write a book about us now, huh?\n@c0@"
