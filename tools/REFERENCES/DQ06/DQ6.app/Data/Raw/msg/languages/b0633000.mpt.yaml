217:
  en: "@a%0%a002000@bMight as well give the castle one final look-see, aye? I doubt we'll be back any time soon.\n@c0@"
  ja: "@a@b%a002000「せっかくだから\n\t帰る前に　もういちど\n\t城の中を　見ていこうぜ。\n@c0@"
  ko: "@a@b%a002000: 모처럼 왔으니까\n가기 전에 한 번 더\n성 안을 둘러보자.\n@c0@"
  sl: "@a@b%a002000：既然难得来一趟了，\n　　在回家之前，俺还想再\n　　好好在城堡里逛逛。\n@c0@"
  tl: "@a@b%a002000：既然難得來一趟了，\n　　在回家之前，俺還想再\n　　好好在城堡裡逛逛。\n@c0@"
218:
  en: "@a%0%a002030@bI believe %a002010 and %a002040 have already made their way outside.\n@c0@"
  ja: "@a@b%a002030「%a002010さんたちは\n\tもう　外に　行ってしまったようですね。\n@c0@"
  ko: "@a@b%a002030: %a002010 님은\n벌써 밖에 나가버린 모양이군요.\n@c0@"
  sl: "@a@b%a002030：%a002010他们\n　　好像已经到外面去了。\n@c0@"
  tl: "@a@b%a002030：%a002010他們\n　　好像已經到外面去了。\n@c0@"
219:
  en: "@a%0%a002020@bBoy... It still hasn't really sunk in that we've beaten the Archfiend, huh? It's like a dream...\n@c0@"
  ja: "@a@b%a002020「ふう……\n\tなんだか　まだ　大魔王を\n\tたおしたっていう実感がないね。\n@c0@"
  ko: "@a@b%a002020: 휴우......\n왠지 아직 대마왕을\n쓰러뜨렸다는 실감이 나지 않아.\n@c0@"
  sl: "@a@b%a002020：呼……总觉得\n　　到现在都还没有已经打倒了\n　　大魔王的真实感。\n@c0@"
  tl: "@a@b%a002020：呼……總覺得\n　　到現在都還沒有已經打倒了\n　　大魔王的真實感。\n@c0@"
220:
  en: "@a%0%a002000@bI'm afraid I don't know squat about keepin' Yggdrasil healthy...\n@c0@"
  ja: "@a@b%a002000「世界中に　世界樹が\n\tあると　いいのにな！\n@c0@"
  ko: "@a@b%a002000: 온 세계에 세계수가\n있으면 좋을 텐데!\n@c0@"
  sl: "@a@b%a002000：要是世界上\n　　到处都是世界树就好了！\n@c0@"
  tl: "@a@b%a002000：要是世界上\n　　到處都是世界樹就好了！\n@c0@"
221:
  en: "@a%0%a002000@bI mean, I can barely pronounce the word. Iggydrazzle? Iggdrowsy? Ah, close enough.\n@c0@"
  ja: "@a@b%a002000「あ！　べつに　これは\n\tシャレ　じゃないぜ！\n\tえ？　そう聞こえない？　そうか……。\n@c0@"
  ko: "@a@b%a002000: 그럼 세계수 그늘 아래서\n낮잠도 잘 수 있고\n좋잖아~~~~\n@c0@"
