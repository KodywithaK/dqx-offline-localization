  tl: "@a@b%a002000：只要有澤尼斯王負責守望著，\n　　就能夠讓人安心下來了。\n@c0@"
237:
  en: "@a%0%a002000@bAnd if some new evil fella shows up, we can always take our team out of retirement!\n@c0@"
  ja: "@a@b%a002000「もし　また　新たな敵が\n\t現れるようなことが　あったら\n\tいっしょに　戦おうな！\n@c0@"
  ko: "@a@b%a002000: 만약 또 새로운 적이\n나타난다면\n함께 싸우자고!\n@c0@"
  sl: "@a@b%a002000：万一哪一天，\n　　又有新的敌人出现了的话，\n　　那就再次一起战斗呗！\n@c0@"
  tl: "@a@b%a002000：萬一哪一天，\n　　又有新的敵人出現了的話，\n　　那就再次一起戰鬥唄！\n@c0@"
238:
  en: "@a%0%a002030@bWe shall never forget Lord Zenith and all the denizens of the dream world.\n@c0@"
  ja: "@a@b%a002030「ゼニス王のこと\n\t上の世界の　みなさんのこと\n\t絶対に　忘れませんとも！\n@c0@"
  ko: "@a@b%a002030: 제니스 왕과\n위쪽 세계 사람들을\n절대로 잊지 않을 겁니다!\n@c0@"
  sl: "@a@b%a002030：泽尼斯王，\n　　以及上面的世界的所有人，\n　　我是绝对不会忘记的！\n@c0@"
  tl: "@a@b%a002030：澤尼斯王，\n　　以及上面的世界的所有人，\n　　我是絕對不會忘記的！\n@c0@"
239:
  en: "@a%0%a002020@bIt'd be so sad if everyone were forgotten...\n@c0@"
  ja: "@a@b%a002020「忘れられちゃうと\n\tかなしいもんね……。\n@c0@"
  ko: "@a@b%a002020: 잊혀버린다면\n슬플 거야......\n@c0@"
  sl: "@a@b%a002020：真若忘记了的话，\n　　会很让人悲伤的……\n@c0@"
  tl: "@a@b%a002020：真若忘記了的話，\n　　會很讓人悲傷的……\n@c0@"
240:
  en: "@a%0%a002000@bHow's he tendin' to that thing, anyway? What, does he sit on it when we're not around?\n@c0@"
  ja: "@a@b%a002000「タマゴの　せわって\n\tエサを　やるわけでも　ないだろうし\n\tどうやるんだ？\n@c0@"
  ko: "@a@b%a002000: 알을 돌본다니?\n먹이를 주는 것도 아닐 테고\n어떻게 하는 거야?\n@c0@"
  sl: "@a@b%a002000：照顾这颗蛋的话，\n　　又不是给它喂饵食，\n　　究竟应该怎么做？\n@c0@"
  tl: "@a@b%a002000：照顧這顆蛋的話，\n　　又不是給它喂餌食，\n　　究竟應該怎麼做？\n@c0@"
241:
  en: "@a%0%a002030@bI have faith that the future will indeed be bright.\n@c0@"
  ja: "@a@b%a002030「未来ですか。\n\tきっと　明るい　未来に\n\tちがいありませんね！\n@c0@"
  ko: "@a@b%a002030: 미래 말입니까?\n분명 밝은 미래가\n찾아올 것입니다!\n@c0@"
  sl: "@a@b%a002030：未来吗？\n　　一定会是光明的未来，\n　　不会有错的！\n@c0@"
  tl: "@a@b%a002030：未來嗎？\n　　一定會是光明的未來，\n　　不會有錯的！\n@c0@"
242:
  en: "@a%0%a002020@bWow! It'll pop any minute, he said! This is exciting!\n@c0@"
  ja: "@a@b%a002020「もうすぐ　生まれるって！\n\tどうしよう　どうしよう！\n@c0@"
  ko: "@a@b%a002020: 이제 곧 태어난대!\n어떡해? 어떡하냐구!?\n@c0@"
  sl: "@a@b%a002020：好像很快就要出生了！\n　　怎么办？怎么办？\n@c0@"
  tl: "@a@b%a002020：好像很快就要出生了！\n　　怎麼辦？怎麼辦？\n@c0@"
243:
  en: "@a%0%a002000@bHardy har! Sounds like it's nearly someone's birthday!\n@c0@"
  ja: "@a@b%a002000「なんだか　楽しそうな音だな。\n\tよろこんでいるのか？\n@c0@"
  ko: "@a@b%a002000: 왠지 즐거워 보이는 소리로군.\n기뻐하고 있는 건가?\n@c0@"
  sl: "@a@b%a002000：似乎是很快乐的声音呢。\n　　它现在的心情很高兴吗？\n@c0@"
  tl: "@a@b%a002000：似乎是很快樂的聲音呢。\n　　它現在的心情很高興嗎？\n@c0@"
244:
  en: "@a%0%a002030@bEven the sounds it makes resonate with hope.\n@c0@"
  ja: "@a@b%a002030「希望にみちた　音ですね！\n@c0@"
  ko: "@a@b%a002030: 희망으로 가득 찬 소리로군요!\n@c0@"
  sl: "@a@b%a002030：是满溢着希望的声音呢！\n@c0@"
  tl: "@a@b%a002030：是滿溢著希望的聲音呢！\n@c0@"
245:
  en: "@a%0%a002020@bOoh, you hear that shuffling? It must be itching to hatch!\n@c0@"
  ja: "@a@b%a002020「なんか　いってるよ！\n\tなんて　いってるのかな？\n@c0@"
  ko: "@a@b%a002020: 뭐라 말하는데!?\n뭐라고 하는 걸까?\n@c0@"
  sl: "@a@b%a002020：好像在说着什么哦！\n　　它在说着什么呢？\n@c0@"
  tl: "@a@b%a002020：好像在說著什麼哦！\n　　它在說著什麼呢？\n@c0@"
246:
  en: "@a%0%a002000@bSame to him, aye?\n@c0@"
  ja: "@a@b%a002000「あんたらも　元気でな！\n@c0@"
  ko: "@a@b%a002000: 그쪽도 부디 몸 건강하길!\n@c0@"
  sl: "@a@b%a002000：你们也要保重啊！\n@c0@"
  tl: "@a@b%a002000：你們也要保重啊！\n@c0@"
247:
  en: "@a%0%a002030@bI pray for long life and happiness for everyone who resides here.\n@c0@"
  ja: "@a@b%a002030「みなさんも　どうか\n\tいつまでも　お元気で。\n@c0@"
  ko: "@a@b%a002030: 여러분도 부디\n건강하시길.\n@c0@"
  sl: "@a@b%a002030：希望大家能一直\n　　这样永远开心。\n@c0@"
  tl: "@a@b%a002030：希望大家能一直\n　　這樣永遠開心。\n@c0@"
248:
  en: "@a%0%a002020@bI'll bet %a002010 and %a002040 are getting a little tired of waiting about now...\n@c0@"
  ja: "@a@b%a002020「そろそろ　%a002010たちが\n\tしびれを　切らして　待ってるかな？\n@c0@"
  ko: "@a@b%a002020: 슬슬 %a002010도\n기다리다 지칠 시간이잖아?\n@c0@"
  sl: "@a@b%a002020：%a002010他们\n　　都快等得不耐烦了吧？\n@c0@"
  tl: "@a@b%a002020：%a002010他們\n　　都快等得不耐煩了吧？\n@c0@"
249:
  en: "@a%0%a002000@bThis castle looks huge from the outside, aye?\n@c0@"
  ja: "@a@b%a002000「こうして　見ると\n\tいかにも　でっかい城だぜ。\n@c0@"
  ko: "@a@b%a002000: 이렇게 보니\n정말 큰 성이군.\n@c0@"
  sl: "@a@b%a002000：这样看起来，\n　　还真是座够大的城堡啊。\n@c0@"
  tl: "@a@b%a002000：這樣看起來，\n　　還真是座夠大的城堡啊。\n@c0@"
250:
  en: "@a%0%a002030@bWe should all be sure to take a final look at the castle.\n@c0@"
  ja: "@a@b%a002030「この　お城も\n\t見おさめ　なのでしょうか……。\n@c0@"
  ko: "@a@b%a002030: 이 성을 보는 것도\n이게 마지막이겠군요......\n@c0@"
  sl: "@a@b%a002030：再看这城堡\n　　最后一眼吧……\n@c0@"
  tl: "@a@b%a002030：再看這城堡\n　　最後一眼吧……\n@c0@"
251:
  en: "@a%0%a002020@bYou think this castle'll ever soar across the horizon again?\n@c0@"
  ja: "@a@b%a002020「この　お城\n\tいつか　また　空を　飛ぶのかな？\n@c0@"
  ko: "@a@b%a002020: 이 성 말이야.\n언젠가 다시 하늘을 날 수 있을까?\n@c0@"
  sl: "@a@b%a002020：这座城堡，\n　　是不是有一天会重回天空呢？\n@c0@"
  tl: "@a@b%a002020：這座城堡，\n　　是不是有一天會重回天空呢？\n@c0@"
252:
  en: "@a%0%a002000@bSo what she's sayin' is don't stop dreamin', aye? Got it.\n@c0@"
  ja: "@a@b%a002000「オレには　むずかしいことは\n\tよく　わからないが　夢を信じていれば\n\tいいってことだな。\n@c0@"
  ko: "@a@b%a002000: 나는 어려운 건\n잘 모르지만, 꿈을 믿으면\n되는 거 아닐까?\n@c0@"
  sl: "@a@b%a002000：太复杂的事情\n　　俺想不明白，\n　　不过只要相信梦想就对了吧。\n@c0@"
  tl: "@a@b%a002000：太複雜的事情\n　　俺想不明白，\n　　不過只要相信夢想就對了吧。\n@c0@"
253:
  en: "@a%0%a002030@bI have faith that we shall continue to see this realm in our dreams.\n@c0@"
  ja: "@a@b%a002030「大丈夫です。\n\tきっと　私たちは　いつまでも\n\t見ることが　できますよ。\n@c0@"
  ko: "@a@b%a002030: 괜찮습니다.\n틀림없이 우리는 언제까지나\n볼 수 있을 겁니다.\n@c0@"
  sl: "@a@b%a002030：没问题的。\n　　我们一定能够做到\n　　无论何时都相信梦想的。\n@c0@"
  tl: "@a@b%a002030：沒問題的。\n　　我們一定能夠做到\n　　無論何時都相信夢想的。\n@c0@"
254:
  en: "@a%0%a002020@bYes... We need to hang on to our dreams...like, forever and ever.\n@c0@"
  ja: "@a@b%a002020「いつまでも……\n\tいつまでも　夢を信じていけば\n\tいいんだよね。\n@c0@"
  ko: "@a@b%a002020: 언제까지나......\n언제까지나 꿈을 믿고 있으면\n되는 거지?\n@c0@"
  sl: "@a@b%a002020：无论何时……\n　　无论何时，只要相信梦想\n　　就可以了对吧。\n@c0@"
  tl: "@a@b%a002020：無論何時……\n　　無論何時，只要相信夢想\n　　就可以了對吧。\n@c0@"
255:
  en: "@a%0%a002000@bRight! We've got a date with Peggy Sue right about now, aye?\n@c0@"
  ja: "@a@b%a002000「さあ　ファルシオンと\n\tいっしょに　行こうぜ！\n@c0@"
  ko: "@a@b%a002000: 자, 팔시온과\n함께 가자고!\n@c0@"
  sl: "@a@b%a002000：好了！\n　　跟着法尔西昂一同前进吧！\n@c0@"
  tl: "@a@b%a002000：好了！\n　　跟著法爾西昂一同前進吧！\n@c0@"
256:
  en: "@a%0%a002030@bLet's be on our way.\n@c0@"
  ja: "@a@b%a002030「行きましょう！\n@c0@"
  ko: "@a@b%a002030: 갑시다!\n@c0@"
  sl: "@a@b%a002030：我们走吧！\n@c0@"
  tl: "@a@b%a002030：我們走吧！\n@c0@"
257:
  en: "@a%0%a002020@bI can't wait to see how the world looks from the sky now that the Archfiend's gone.\n@c0@"
  ja: "@a@b%a002020「大魔王のいない\n\t平和な　空からは　きっと　景色も\n\tちがって　見えるよね！\n@c0@"
  ko: "@a@b%a002020: 대마왕이 없는\n평화로운 하늘에선 분명 경치도\n달라 보일 거야!\n@c0@"
  sl: "@a@b%a002020：大魔王现在已经不在，\n　　这片和平的景色，从空中看下来\n　　也一定和之前不一样呢！\n@c0@"
  tl: "@a@b%a002020：大魔王現在已經不在，\n　　這片和平的景色，從空中看下來\n　　也一定和之前不一樣呢！\n@c0@"
258:
  en: "@a%0%a002000@bWell, I reckon it's about that time.\n@c0@"
  ja: "@a@b%a002000「さて　それじゃ　そろそろ\n\t行くとするか！\n@c0@"
  ko: "@a@b%a002000: 자, 그럼 슬슬\n가 볼까!\n@c0@"
  sl: "@a@b%a002000：好了，咱们差不多该走了！\n@c0@"
  tl: "@a@b%a002000：好了，咱們差不多該走了！\n@c0@"
259:
  en: "@a%0%a002030@bI pray that we will meet again. Now, we must bid farewell to all who are here.\n@c0@"
  ja: "@a@b%a002030「きっと　また　会えますとも。\n\tみなさんも　お元気で！\n@c0@"
  ko: "@a@b%a002030: 꼭 다시 만날 수 있을 겁니다.\n여러분도 건강하세요!\n@c0@"
  sl: "@a@b%a002030：相信我们一定会再见的。\n　　大家请多多保重！\n@c0@"
  tl: "@a@b%a002030：相信我們一定會再見的。\n　　大家請多多保重！\n@c0@"
260:
  en: "@a%0%a002020@b%0%a002010 and %a002040 should be waiting for us in the wagon.\n@c0@"
  ja: "@a@b%a002020「%a002010たちも\n\t馬車で　待ってるね！\n@c0@"
  ko: "@a@b%a002020: %a002010도\n마차에서 기다릴 거야!\n@c0@"
  sl: "@a@b%a002020：%a002010他们\n　　也在马车上等着呢！\n@c0@"
  tl: "@a@b%a002020：%a002010他們\n　　也在馬車上等著呢！\n@c0@"
261:
  en: "@a%0%a002000@bOh, did we forget to do somethin'?\n@c0@"
  ja: "@a@b%a002000「おっと　まだ　この城に\n\t何か　用があったっけか？\n@c0@"
  ko: "@a@b%a002000: 오옷! 아직 이 성에\n무슨 볼일이 있는 거야?\n@c0@"
  sl: "@a@b%a002000：喂喂，你在\n　　这座城堡还有事吗？\n@c0@"
  tl: "@a@b%a002000：喂喂，你在\n　　這座城堡還有事嗎？\n@c0@"
262:
  en: "@a%0%a002030@bSo you mean to tarry here a while longer?\n@c0@"
  ja: "@a@b%a002030「おや？\n\tもう少し　ここに　のこりますか？\n@c0@"
  ko: "@a@b%a002030: 이런?\n조금 더 이곳에 있으실 건가요?\n@c0@"
  sl: "@a@b%a002030：哦？\n　　那就再在这里逗留一会吧？\n@c0@"
  tl: "@a@b%a002030：哦？\n　　那就再在這裡逗留一會吧？\n@c0@"
263:
  en: "@a%0%a002020@bI know how you feel, %a000090. I hate goodbyes too.\n@c0@"
  ja: "@a@b%a002020「%a000090。\n\tおなごり　おしいんでしょ？\n\tわかるよ　その気もち。\n@c0@"
  ko: "@a@b%a002020: %a000090,\n많이 아쉽지?\n알아, 그 기분.\n@c0@"
  sl: "@a@b%a002020：%a000090。\n　　有些舍不得这里吧？\n　　你的心情我能理解。\n@c0@"
  tl: "@a@b%a002020：%a000090。\n　　有些捨不得這裡吧？\n　　你的心情我能理解。\n@c0@"
