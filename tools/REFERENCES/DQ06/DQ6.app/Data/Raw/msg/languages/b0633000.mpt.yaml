  tl: "@a@b%a002020：被大家感謝得太多的話，\n　　就有點渾身不自在了。\n@c0@"
236:
  en: "@a%0%a002000@bThe world's in safe hands with Lord Zenith watchin' over it, I'd say.\n@c0@"
