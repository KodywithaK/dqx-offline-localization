226:
  en: "@a%0%a002030@bI did wonder where we could possibly start in explaining the nature of our world...\n@c0@"
  ja: "@a@b%a002030「どこから　どこまで\n\t説明すれば　いいのか\n\tいっしゅん　なやみました……。\n@c0@"
  ko: "@a@b%a002030: 어디에서 어디까지\n설명해야 좋을지\n순간 고민했습니다......\n@c0@"
  sl: "@a@b%a002030：要从哪里开始说明呢。\n　　还真是让人头疼啊……\n@c0@"
  tl: "@a@b%a002030：要從哪裡開始說明呢。\n　　還真是讓人頭疼啊……\n@c0@"
227:
  en: "@a%0%a002020@bTee hee! Maybe she'll find a nice man down there and start a family.\n@c0@"
