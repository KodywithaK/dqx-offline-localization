  ko: "@a@b%a002020: 하지만 세계수의 숲을\n한번 보고 싶어~\n@c0@"
  sl: "@a@b%a002020：但是，好想看看\n　　全都是世界树的森林啊。\n@c0@"
  tl: "@a@b%a002020：但是，好想看看\n　　全都是世界樹的森林啊。\n@c0@"
225:
  en: "@a%0%a002000@bAye... Sometimes ya just have to see things for yourself.\n@c0@"
