  ko: "@a@b%a002020: 틀림없이 앞으로\n누군가가 써 줄 거야!\n@c0@"
  sl: "@a@b%a002020：想必今后就会有人\n　　把这件事情写在书里了吧！\n@c0@"
  tl: "@a@b%a002020：想必今後就會有人\n　　把這件事情寫在書裡了吧！\n@c0@"
214:
  en: "@a%0%a002000@bWell, my carpentry will serve the good of all behinds...with comfy chairs 'n' everything like that.\n@c0@"
  ja: "@a@b%a002000「%a000090は　王子として\n\tオレは　大工のあと取りとして\n\t人の役に立ちたいな。\n@c0@"
  ko: "@a@b%a002000: %a000090%F0090%X는%Y은%Z 왕자로서\n나는 목수의 후계자로서\n사람들에게 도움이 되어야겠지.\n@c0@"
  sl: "@a@b%a002000：%a000090当王子，\n　　俺继承老爸的手艺当木匠，\n　　咱们要各尽所能为人民服务啊。\n@c0@"
  tl: "@a@b%a002000：%a000090當王子，\n　　俺繼承老爸的手藝當木匠，\n　　咱們要各盡所能為人民服務啊。\n@c0@"
215:
  en: "@a%0%a002030@bWe will do whatever we can for the good of all.\n@c0@"
  ja: "@a@b%a002030「私たちは　これからも\n\t私たちに　できることを\n\tやっていくだけです。\n@c0@"
  ko: "@a@b%a002030: 우리는 앞으로도\n우리가 할 수 있는 일을\n할 뿐입니다.\n@c0@"
  sl: "@a@b%a002030：从今以后，\n　　我们也会做好\n　　力所能及的事情。\n@c0@"
  tl: "@a@b%a002030：從今以後，\n　　我們也會做好\n　　力所能及的事情。\n@c0@"
216:
  en: "@a%0%a002020@bBoy, I'd love it if we could keep putting our talents to good use!\n@c0@"
  ja: "@a@b%a002020「あたしたちの　チカラが\n\tこれからも　役に立つなら\n\tうれしいね！\n@c0@"
  ko: "@a@b%a002020: 우리의 힘이\n앞으로도 도움이 된다면\n정말 기쁠 거야!\n@c0@"
  sl: "@a@b%a002020：在往后的日子里，\n　　要是我们的力量能够发挥\n　　应有的作用，那就太好了！\n@c0@"
