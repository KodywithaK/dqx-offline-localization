  sl: "@a@b%a002030：就算有人叫我们忘记，\n　　我们也绝对不会忘记的。\n@c0@"
  tl: "@a@b%a002030：就算有人叫我們忘記，\n　　我們也絕對不會忘記的。\n@c0@"
231:
  en: "@a%0%a002020@b.........\n@c0@"
  ja: "@a@b%a002020「…………。\n@c0@"
  ko: "@a@b%a002020: ............\n@c0@"
  sl: "@a@b%a002020：……\n@c0@"
  tl: "@a@b%a002020：……\n@c0@"
232:
  en: "@a%0%a002000@bIt's not like we were asking for payment anyway, aye?\n@c0@"
  ja: "@a@b%a002000「もともと　オレたちは\n\t恩を　返してもらおうなんて\n\tこれっぽっちも　思ってないもんな。\n@c0@"
