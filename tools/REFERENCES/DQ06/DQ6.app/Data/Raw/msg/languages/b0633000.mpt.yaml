  ko: "@a@b%a002000: 하지만 설령 그렇더라도\n우리가 이 세계를\n잊는 일은 없을 거야!\n@c0@"
  sl: "@a@b%a002000：但尽管如此，\n　　咱们也绝对不会忘记\n　　这个世界的存在的！\n@c0@"
  tl: "@a@b%a002000：但儘管如此，\n　　咱們也絕對不會忘記\n　　這個世界的存在的！\n@c0@"
230:
  en: "@a%0%a002030@bWe couldn't forget if we tried.\n@c0@"
