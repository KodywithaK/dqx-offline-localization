  sl: "@a@b%a002010：人鱼果然\n　　真的存在呢。\n@c0@"
  tl: "@a@b%a002010：人魚果然\n　　真的存在呢。\n@c0@"
13:
  en: "@a%0%a002020@bOoh! Look, they're back!\n@c0@"
