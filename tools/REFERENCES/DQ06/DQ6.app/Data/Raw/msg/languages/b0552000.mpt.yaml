0:
  en: "@a%0%a002000@bWhat is this place?\n@c0@"
  ja: "@a@b%a002000「こ…　ここは\n\tいったい……！？\n@c0@"
  ko: "@a@b%a002000: 여...여긴\n대체......!?\n@c0@"
  sl: "@a@b%a002000：这、\n　　这里到底是……\n@c0@"
  tl: "@a@b%a002000：這、\n　　這裡到底是……\n@c0@"
1:
  en: "@a%0%a002010@bLook — over there! Is that...a mermaid!?\n@c0@"
  ja: "@a@b%a002010「見て　あれ！\n\tもしかして　人魚じゃない？\n@c0@"
  ko: "@a@b%a002010: 저기 좀 봐!\n혹시 저거 인어 아니야?\n@c0@"
