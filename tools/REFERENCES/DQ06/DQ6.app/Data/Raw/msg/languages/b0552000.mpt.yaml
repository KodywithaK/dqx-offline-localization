  ko: "@a@b%a002000: 이...있군.\n조용히 다가가 볼까?\n@c0@"
  sl: "@a@b%a002000：……找到了。\n　　悄悄地过去吧？\n@c0@"
  tl: "@a@b%a002000：……找到了。\n　　悄悄地過去吧？\n@c0@"
12:
  en: "@a%0%a002010@bIt seems mermaids exist after all, %a000090.\n@c0@"
