  tl: "@a@b%a002020：啊……\n　　好想跟她們交朋友呢……\n@c0@"
20:
  en: "@a%0%a002030@bEven if we are able to draw close, none among our number speaks their language. Come, let us be on our way...\n@c0@"
  ja: "@a@b%a002030「いまは　人魚と\n\t話す方法は　ないようですね。\n\tざんねんですが　行きましょうか。\n@c0@"
