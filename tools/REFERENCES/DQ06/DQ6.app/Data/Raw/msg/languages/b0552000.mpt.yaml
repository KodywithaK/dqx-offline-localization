  ko: "@a@b%a002020: 아아~!\n모두 도망갔어!\n@c0@"
  sl: "@a@b%a002020：啊！\n　　大家都逃走了啊！\n@c0@"
  tl: "@a@b%a002020：啊！\n　　大家都逃走了啊！\n@c0@"
9:
  en: "@a%0%a002030@bI doubted my own eyes, but this was no dream.\n@c0@"
  ja: "@a@b%a002030「自分の目を\n\tうたがってしまいますが……\n\t今のは　夢ではありませんね。\n@c0@"
  ko: "@a@b%a002030: 제 눈을\n의심했습니다만......\n방금 건 꿈이 아니었군요.\n@c0@"
  sl: "@a@b%a002030：虽然不敢\n　　相信自己的眼睛，\n　　但眼前的景象不是在做梦呢。\n@c0@"
  tl: "@a@b%a002030：雖然不敢\n　　相信自己的眼睛，\n　　但眼前的景象不是在做夢呢。\n@c0@"
