  ko: "@a@b%a002050: 이곳은 관문이지만\n누구나 자유롭게 지나가도\n상관없는 모양이네요.\n@c0@"
  sl: "@a@b%a002050：虽说这里是关卡，\n　　但是好像谁都可以\n　　自由通行呢。\n@c0@"
  tl: "@a@b%a002050：雖說這裡是關卡，\n　　但是好像誰都可以\n　　自由通行呢。\n@c0@"
27:
  en: "@a%0%a002000@bCrikey. He dreamt about the Isle o' Smiles, aye? That fella doesn't know how lucky he is.\n@c0@"
  ja: "@a@b%a002000「この男も　夢の中で\n\tしあわせの国に……。\n\tまあ　助かって　よかったよな。\n@c0@"
  ko: "@a@b%a002000: 이 남자도 꿈속에서\n행복의 나라로......\n뭐, 깨어나서 다행이군.\n@c0@"
  sl: "@a@b%a002000：这个男的\n　　也在梦里去了幸福国……\n　　救了他真是太好了。\n@c0@"
  tl: "@a@b%a002000：這個男的\n　　也在夢裡去了幸福國……\n　　救了他真是太好了。\n@c0@"
28:
  en: "@a%0%a002010@bIt seems Jamirus's influence extended even as far as this checkpoint.\n@c0@"
  ja: "@a@b%a002010「ジャミラスの\n\tチカラは　こんなところまで\n\tえいきょうして　いたのね。\n@c0@"
  ko: "@a@b%a002010: 쟈미라스의\n힘은 이런 곳까지\n영향을 미치고 있었구나.\n@c0@"
  sl: "@a@b%a002010：贾米拉斯的力量\n　　竟然影响到了这里。\n@c0@"
  tl: "@a@b%a002010：賈米拉斯的力量\n　　竟然影響到了這裡。\n@c0@"
29:
  en: "@a%0%a002020@bTee hee! Sounds like that soldier owes us big!\n@c0@"
  ja: "@a@b%a002020「兵隊さん\n\tあたしたちの　おかげで\n\tいのちびろい　したわけね。\n@c0@"
  ko: "@a@b%a002020: 이 병사는\n우리 덕분에\n목숨을 건진 거나 마찬가지네.\n@c0@"
  sl: "@a@b%a002020：因为我们出手相助，\n　　兵哥哥才捡回了一条命呢。\n@c0@"
  tl: "@a@b%a002020：因為我們出手相助，\n　　兵哥哥才撿回了一條命呢。\n@c0@"
30:
  en: "@a%0%a002030@bReality and dreams are becoming rather tangled...\n@c0@"
  ja: "@a@b%a002030「かなり　夢と現実が\n\tおたがいに　からみあって\n\tいるようですね。\n@c0@"
  ko: "@a@b%a002030: 꿈과 현실이 서로\n상당히 얽혀 있는\n모양입니다.\n@c0@"
