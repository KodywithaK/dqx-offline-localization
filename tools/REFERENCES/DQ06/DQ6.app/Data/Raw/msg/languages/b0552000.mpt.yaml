  tl: "@a@b%a002050：剛才往水裡看了一眼，\n　　難道船下面有人魚？！\n@c0@"
22:
  en: "@a%0%a002000@bKind of poorly guarded for a checkpoint, aye?\n@c0@"
  ja: "@a@b%a002000「関所なのに\n\t見はりを　しているヤツが\n\tだれも　いないな。\n@c0@"
  ko: "@a@b%a002000: 명색이 관문인데\n지키고 있는 자가\n아무도 없다니.\n@c0@"
  sl: "@a@b%a002000：这里明明是个关卡，\n　　但是一个放哨的人\n　　都没有呢。\n@c0@"
  tl: "@a@b%a002000：這裡明明是個關卡，\n　　但是一個放哨的人\n　　都沒有呢。\n@c0@"
23:
  en: "@a%0%a002010@bLet's keep moving, %a000090.\n@c0@"
  ja: "@a@b%a002010「さあ　道を\n\tいそぎましょう。\n@c0@"
  ko: "@a@b%a002010: 자, 어서\n가던 길을 마저 가자.\n@c0@"
  sl: "@a@b%a002010：我们赶路吧。\n@c0@"
  tl: "@a@b%a002010：我們趕路吧。\n@c0@"
24:
  en: "@a%0%a002020@bWhat's the point of a checkpoint if no one's around to check it?\n@c0@"
  ja: "@a@b%a002020「なんか　ここ\n\tむぼうびだね。\n@c0@"
  ko: "@a@b%a002020: 지금 여긴\n무방비 상태네.\n@c0@"
  sl: "@a@b%a002020：这里没人守卫呢。\n@c0@"
  tl: "@a@b%a002020：這裡沒人守衛呢。\n@c0@"
25:
  en: "@a%0%a002030@bAn unguarded checkpoint would have been unthinkable during Murdaw's reign of terror.\n@c0@"
  ja: "@a@b%a002030「関所に　見はりがいない\n\tなんて　ムドーがいた　時代には\n\t考えられませんでしたね。\n@c0@"
  ko: "@a@b%a002030: 관문에 파수병이 없다니,\n무도가 있었던 시대에는\n상상도 못할 일입니다.\n@c0@"
  sl: "@a@b%a002030：关卡没人放哨，\n　　在姆多嚣张跋扈的时代里，\n　　这种事简直无法想象。\n@c0@"
  tl: "@a@b%a002030：關卡沒人放哨，\n　　在姆多囂張跋扈的時代裡，\n　　這種事簡直無法想像。\n@c0@"
26:
  en: "@a%0%a002050@bSeems like folks can just come and go as they please...\n@c0@"
