  en: "@a%0%a002050@bWe should've hung back instead of just blunderin' up to 'em like that.\n@c0@"
  ja: "@a@b%a002050「ああ……。\n\tもっと　そっと　近づかないと\n\tダメだったのでしょうか……。\n@c0@"
  ko: "@a@b%a002050: 아아......\n좀 더 살금살금 다가가야\n했던 걸까요......\n@c0@"
  sl: "@a@b%a002050：啊……\n　　不能再靠近一点吗？\n　　就靠近一点点……\n@c0@"
  tl: "@a@b%a002050：啊……\n　　不能再靠近一點嗎？\n　　就靠近一點點……\n@c0@"
11:
