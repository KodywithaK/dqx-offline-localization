  ko: "@a@b%a002000: 여, 여긴 인어가\n사는 곳이었나!?\n@c0@"
  sl: "@a@b%a002000：这里是\n　　人鱼住的地方吗？！\n@c0@"
  tl: "@a@b%a002000：這裡是\n　　人魚住的地方嗎？！\n@c0@"
7:
  en: "@a%0%a002010@bThey all swam off when they spotted our ship.\n@c0@"
  ja: "@a@b%a002010「船を見たら\n\t逃げて　しまったわね。\n@c0@"
