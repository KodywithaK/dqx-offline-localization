21:
  en: "@a%0%a002050@bMaybe if old %a002050 stuck his head under the water they'd come swimmin' back?\n@c0@"
  ja: "@a@b%a002050「今　水の中を　のぞいたら\n\t下に　いますかね！？\n@c0@"
  ko: "@a@b%a002050: 지금 물속을 살펴보면\n아래쪽에 있을까요!?\n@c0@"
