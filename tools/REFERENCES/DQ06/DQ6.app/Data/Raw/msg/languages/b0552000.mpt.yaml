  tl: "@a@b%a002000：不管旅行者從哪邊來，\n　　都有投宿的地方了呢。\n@c0@"
34:
  en: "@a%0%a002010@bShall we get going?\n@c0@"
  ja: "@a@b%a002010「じゃ　行きましょうか。\n@c0@"
  ko: "@a@b%a002010: 그럼 가 볼까?\n@c0@"
  sl: "@a@b%a002010：我们走吧。\n@c0@"
  tl: "@a@b%a002010：我們走吧。\n@c0@"
35:
  en: "@a%0%a002020@bRight! Off we go!\n@c0@"
  ja: "@a@b%a002020「しゅっぱつ！\n\tしゅっぱーつ！\n@c0@"
