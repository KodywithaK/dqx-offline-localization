  sl: "@a@b%a002050：我在做梦吗？\n　　……掐一下自己看看……\n@c0@"
  tl: "@a@b%a002050：我在做夢嗎？\n　　……掐一下自己看看……\n@c0@"
5:
  en: "@a%0%a002050@b...OUCH! Pinched myself — and I'm awake!\n@c0@"
