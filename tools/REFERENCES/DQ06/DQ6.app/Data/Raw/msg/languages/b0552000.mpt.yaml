  tl: "@a@b%a002030：看來夢與現實\n　　緊緊交錯在一起了呢。\n@c0@"
31:
  en: "@a%0%a002050@bI wonder who that fellow was in his Isle o' Smiles dream...\n@c0@"
  ja: "@a@b%a002050「この人　しあわせの国では\n\tどんな人　だったのでしょうね。\n@c0@"
  ko: "@a@b%a002050: 이 사람, 행복의 나라에서는\n어떤 사람이었을까요?\n@c0@"
  sl: "@a@b%a002050：这个人在幸福国的时候\n　　是个怎样的人呢？\n@c0@"
  tl: "@a@b%a002050：這個人在幸福國的時候\n　　是個怎樣的人呢？\n@c0@"
32:
  en: "@a%0%a002000@bHavin' an inn next to a checkpoint is a good idea, ain't it?\n@c0@"
  ja: "@a@b%a002000「関所の　となりで\n\t宿屋を　やるってのは\n\tいい　アイディアだな。\n@c0@"
  ko: "@a@b%a002000: 관문 옆에서\n여관을 열다니\n좋은 아이디어로군.\n@c0@"
  sl: "@a@b%a002000：在关卡旁边开旅店，\n　　点子不错啊。\n@c0@"
  tl: "@a@b%a002000：在關卡旁邊開旅店，\n　　點子不錯啊。\n@c0@"
33:
  en: "@a%0%a002000@bI bet this fella gets business from both sides of the border.\n@c0@"
  ja: "@a@b%a002000「旅人たちが\n\tどちらがわから　来ても\n\t泊まるだろうからな。\n@c0@"
  ko: "@a@b%a002000: 여행자가\n어느 쪽에서 건너와도\n묵을 테니까.\n@c0@"
