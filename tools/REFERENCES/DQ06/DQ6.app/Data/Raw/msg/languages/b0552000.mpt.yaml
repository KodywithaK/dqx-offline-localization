  sl: "@a@b%a002050：好疼！！掐了一下\n　　自己的脸发现这不是梦啊！\n　　真的有人鱼啊！\n@c0@"
  tl: "@a@b%a002050：好疼！！掐了一下\n　　自己的臉發現這不是夢啊！\n　　真的有人魚啊！\n@c0@"
6:
