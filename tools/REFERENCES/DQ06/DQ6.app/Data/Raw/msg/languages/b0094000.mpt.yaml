14:
  en: "@aOld Man Soren@bYou've done brilliant work for us all, %a002020. Just brilliant! You too, %a000090.\n@c0@"
  ja: "@a@bカルベ「ほんに　よくやったぞ\n\t%a002020　それに　%a000090たちも。\n@c0@"
  ko: "@a@b칼베: 정말 잘해 주었다.\n%a002020, 그리고 %a000090%F0090%X와%Y과%Z 동료들도.\n@c0@"
