16:
  en: "@a@b*: Ah, how I look forward to the day when %a002020 becomes our Eldress!\n@c0@"
  ja: "@a@b＊「%a002020さまが　長老になる日を\n\t楽しみに　しています。\n@c0@"
  ko: "@a@b*: %a002020 님이 장로가 되는 날을\n손꼽아 기다리겠습니다.\n@c0@"
  sl: "@a@b＊：我们期待着%a002020大人\n　　成为长老的那一天。\n@c0@"
  tl: "@a@b＊：我們期待著%a002020大人\n　　成為長老的那一天。\n@c0@"
17:
  en: "@a@b*: Not that the term ‘Eldress’ would befit someone as young as the Acolyte. Oh, no, no, no.\n@c0@"
  ja: "@a@b＊「しかし　%a002020さまの　トシで\n\t長老という　よびかたは\n\t似合いませんな。\n@c0@"
  ko: "@a@b*: 하지만 %a002020 님의 나이에\n장로라는 호칭은 아직\n어울리지 않겠군요.\n@c0@"
  sl: "@a@b＊：但是%a002020大人的年龄\n　　跟长老这个称呼\n　　不太相符啊。\n@c0@"
  tl: "@a@b＊：但是%a002020大人的年齡\n　　跟長老這個稱呼\n　　不太相符啊。\n@c0@"
18:
  en: "@a@b*: We'll just have to think up a more appropriate title, I suppose.\n@c0@"
  ja: "@a@b＊「こりゃ　なにか　いい　よびかたを\n\t考えておかないとなっ。\n@c0@"
  ko: "@a@b*: 뭔가 좋은 호칭을\n생각해 둬야겠군요.\n@c0@"
  sl: "@a@b＊：这样一来，必须得\n　　想出一个合适的称呼才行。\n@c0@"
  tl: "@a@b＊：這樣一來，必須得\n　　想出一個合適的稱呼才行。\n@c0@"
19:
  en: "@a@bLeave Sorceria and head to the next destination?\n@c0@"
  ja: "@a@bカルベローナを　出て\n次の場所へ　向かいますか？\n@c0@"
  ko: "@a@b칼베로나를 나와\n다음 장소로 가시겠습니까?\n@c0@"
  sl: "@a@b要离开卡尔贝罗纳，\n前往下一个地方吗？\n@c0@"
  tl: "@a@b要離開卡爾貝羅納，\n前往下一個地方嗎？\n@c0@"
20:
  en: "@a@b*: Hey! %0%a000090! Speak o' the devil!\n@c0@"
  ja: "@a@b＊「よっ　%a000090！\n\t帰ってきたか！\n@c0@"
  ko: "@a@b*: 오오 %a000090!\n돌아왔구나!\n@c0@"
  sl: "@a@b＊：哟！%a000090！\n　　你回来了啊！\n@c0@"
  tl: "@a@b＊：喲！%a000090！\n　　你回來了啊！\n@c0@"
21:
  en: "@a@b*: We were just talkin' about ya. Come over here a for a sec!\n@c0@"
  ja: "@a@b＊「いま　みんなで　お前の話を\n\tしてたところだぜ。\n\tさあ　こっちへ　来いよ！\n@c0@"
  ko: "@a@b*: 지금 다 같이 네 얘길\n하고 있었어.\n자, 이쪽으로 와!\n@c0@"
  sl: "@a@b＊：现在大家正好谈论着\n　　和你有关的话题呢。\n　　快，到这边来啊！\n@c0@"
  tl: "@a@b＊：現在大家正好談論著\n　　和你有關的話題呢。\n　　快，到這邊來啊！\n@c0@"
22:
  en: "@aMayor Spindell@bWell, well! %0%a000090! I've been waiting for you!\n@c0@"
  ja: "@a@b村長「おお　%a000090！\n\tまっておったぞ！\n@c0@"
  ko: "@a@b촌장: 오오 %a000090!\n기다리고 있었다!\n@c0@"
  sl: "@a@b村长：哦哦，%a000090！\n　　我们等你很久了！\n@c0@"
  tl: "@a@b村長：哦哦，%a000090！\n　　我們等你很久了！\n@c0@"
23:
  en: "@aMayor Spindell@bYou've done it, haven't you! You've really done it!\n@c0@"
  ja: "@a@b村長「やはり　おまえの　おかげ\n\tだったのだな？\n@c0@"
  ko: "@a@b촌장: 역시 모두\n네 덕분인 게냐?\n@c0@"
  sl: "@a@b村长：果然，还是\n　　多亏了你对吧？\n@c0@"
  tl: "@a@b村長：果然，還是\n　　多虧了你對吧？\n@c0@"
24:
  en: "@aMayor Spindell@bAh, no need to say more — your feats speak for themselves. The monsters are gone. All of them! \n@c0@"
  ja: "@a@b村長「ああ　いわずとも　わかっとる！\n\tなにしろ　まものが　ちっとも\n\tいなくなったのだからな。\n@c0@"
  ko: "@a@b촌장: 말하지 않아도 안다!\n무엇보다 마물이 하나도\n안 보이게 됐으니 말이다.\n@c0@"
  sl: "@a@b村长：算了，你不说我们也知道！\n　　毕竟魔物们\n　　全都消失不见了啊。\n@c0@"
  tl: "@a@b村長：算了，你不說我們也知道！\n　　畢竟魔物們\n　　全都消失不見了啊。\n@c0@"
25:
  en: "@aMayor Spindell@bYou've no doubt gone and knocked off some big shot of the monster world, haven't you?\n@c0@"
  ja: "@a@b村長「これは　おそらく　%a000090が\n\tなにか　とんでもない　まものの\n\t親玉を　たおしたに　ちがいないと……\n@c0@"
  ko: "@a@b촌장: 이건 틀림없이 %a000090\n네가 무시무시한 마물의 두목을\n쓰러뜨렸기 때문일 거라고…\n@c0@"
  sl: "@a@b村长：这恐怕是因为%a000090\n　　打倒了什么很不得了的魔物头子，\n　　嗯，不会错的……\n@c0@"
  tl: "@a@b村長：這恐怕是因為%a000090\n　　打倒了什麼很不得了的魔物頭子，\n　　嗯，不會錯的……\n@c0@"
26:
  en: "@aMayor Spindell@bIn any case, we all talked it over and decided to throw a little celebration in your honour. You deserve it, %a000090!\n@c0@"
  ja: "@a@b村長「そう　みんなで　話して\n\t祝っておったのだ。　いや\n\t%a000090よ　よくやった！\n@c0@"
  ko: "@a@b촌장: 모두 그 이야기로 들떠서\n축하하고 있던 참이었다.\n%a000090, 정말 잘해 주었어!\n@c0@"
  sl: "@a@b村长：没错，大家正聚在一起\n　　给你庆祝呢。哎呀，\n　　%a000090啊，干得好！\n@c0@"
  tl: "@a@b村長：沒錯，大家正聚在一起\n　　給你慶祝呢。哎呀，\n　　%a000090啊，幹得好！\n@c0@"
27:
  en: "@aMayor Spindell@bHere, here, everyone! Drinks are on me today! It's time to eat, drink, and be very, very merry!\n@c0@"
