  ja: "@a@b村長「さあ　%a000090も……。\n\tそれから　そこの仲間たちも\n\t本当に　ごくろうじゃったな。\n@c0@"
  ko: "@a@b촌장: 자, %a000090도......\n그리고 거기 동료들도\n정말 고생 많았어.\n@c0@"
  sl: "@a@b村长：快点，%a000090你也来……\n　　另外还有那边的各位同伴们，\n　　真的辛苦你们了啊。\n@c0@"
