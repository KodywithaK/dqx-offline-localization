0:
  en: "@aLady Soren@bYou have made us so very proud, %a002020. Because of you, the world is safe from Mortamor.\n@c0@"
  ja: "@a@bカルベ夫人「ごくろうじゃったな　%a002020。\n\t大魔王の魔の手から　世界は\n\tすくわれた。\n@c0@"
  ko: "@a@b칼베 부인: 고생 많았다, %a002020.\n대마왕의 마수로부터 세계를\n구해냈구나.\n@c0@"
  sl: "@a@b卡尔贝夫人：辛苦你了，%a002020。\n　　你从大魔王的魔掌里拯救了世界。\n@c0@"
  tl: "@a@b卡爾貝夫人：辛苦你了，%a002020。\n　　你從大魔王的魔掌裡拯救了世界。\n@c0@"
1:
  en: "@aLady Soren@bAnd how powerful you have grown! Yes, powerful enough to be worthy of the name ‘Sorceress’.\n@c0@"
  ja: "@a@bカルベ夫人「そして　お前は　もう\n\t大魔女と　名のっても\n\tはずかしくないほどの　魔力も身につけた。\n@c0@"
  ko: "@a@b칼베 부인: 그리고 너는 이제\n대마녀라 불려도\n부끄럽지 않을 정도의 마력을 가지게 됐어.\n@c0@"
  sl: "@a@b卡尔贝夫人：而且，你现在掌握的魔力，\n　　已经足以配得上大魔女这一称号了。\n@c0@"
  tl: "@a@b卡爾貝夫人：而且，你現在掌握的魔力，\n　　已經足以配得上大魔女這一稱號了。\n@c0@"
2:
  en: "@aLady Soren@bI am certain the Eldress would have approved of this. Quite certain.\n@c0@"
  ja: "@a@bカルベ夫人「長老さまも　よろこんで\n\tおられるじゃろうて……。\n@c0@"
  ko: "@a@b칼베 부인: 장로님도 많이\n기뻐하시겠지......\n@c0@"
  sl: "@a@b卡尔贝夫人：长老大人\n　　也一定会为你高兴的……\n@c0@"
  tl: "@a@b卡爾貝夫人：長老大人\n　　也一定會為你高興的……\n@c0@"
3:
  en: "@a@b*: Lady Soren, I'm not sure I can impersonate the Eldress in the hearts and minds of the townsfolk much longer.\n@c0@"
  ja: "@a@b＊「しかし　私が長老さまのフリを\n\tしているのも　そろそろ限界かと……\n@c0@"
  ko: "@a@b*: 그리고 내가 장로님의\n흉내를 내는 것도 이제 한계로구나......\n@c0@"
  sl: "@a@b＊：话说回来，让我一直扮演长老的角色，\n　　现在也快到极限了……\n@c0@"
  tl: "@a@b＊：話說回來，讓我一直扮演長老的角色，\n　　現在也快到極限了……\n@c0@"
4:
  en: "@a%0%a002020@bSo, uh...what are you saying? I'm gonna be the Eldress now?\n@c0@"
  ja: "@a@b%a002020「じゃあ　あたしに　長老に\n\tなれって　いうの？\n@c0@"
  ko: "@a@b%a002020: 그럼 나한테 장로가\n되라는 거야?\n@c0@"
  sl: "@a@b%a002020：那么，你的意思是\n　　让我成为长老吗？\n@c0@"
  tl: "@a@b%a002020：那麼，你的意思是\n　　讓我成為長老嗎？\n@c0@"
5:
  en: "@aLady Soren@bNot at all, my dear. You are still young. There is much left for you to learn.\n@c0@"
  ja: "@a@bカルベ夫人「いや　そうは　いわん。\n\tお前は　若い。　まだまだ\n\t学ぶことは　多いはずじゃ。\n@c0@"
  ko: "@a@b칼베 부인: 아니 그건 아니란다.\n넌 아직 어려. 아직\n배워야 할 게 많아.\n@c0@"
  sl: "@a@b卡尔贝夫人：不，我没有那么说。\n　　你现在还年轻，还有很多\n　　需要学习的东西。\n@c0@"
  tl: "@a@b卡爾貝夫人：不，我沒有那麼說。\n　　你現在還年輕，還有很多\n　　需要學習的東西。\n@c0@"
6:
  en: "@aLady Soren@bI recommend that you seek the tutelage of Lord Zenith.\n@c0@"
  ja: "@a@bカルベ夫人「わしは　ゼニス王のもとで\n\t学ぶことを　すすめる。\n@c0@"
  ko: "@a@b칼베 부인: 내 생각엔 제니스 왕 밑에서\n배우는 게 좋겠구나.\n@c0@"
  sl: "@a@b卡尔贝夫人：我建议你去\n　　泽尼斯王身边学学东西。\n@c0@"
  tl: "@a@b卡爾貝夫人：我建議你去\n　　澤尼斯王身邊學學東西。\n@c0@"
7:
  en: "@aLady Soren@bWho knows what magic may lurk within his archives. Some of it might be new even to us!\n@c0@"
  ja: "@a@bカルベ夫人「あそこには　わしらですら\n\t知らぬ魔法が　ねむっているかも\n\tしれんからのう。\n@c0@"
  ko: "@a@b칼베 부인: 그곳에는 우리조차\n알지 못하는 마법이 숨겨져 있을지\n모르니까 말이다.\n@c0@"
  sl: "@a@b卡尔贝夫人：在那个地方，\n　　有可能沉睡着就连我们也\n　　还不知道的魔法。\n@c0@"
  tl: "@a@b卡爾貝夫人：在那個地方，\n　　有可能沉睡著就連我們也\n　　還不知道的魔法。\n@c0@"
8:
  en: "@a%0%a002020@bHmm... Can I think about this a bit more? I need to decide what's best for me.\n@c0@"
  ja: "@a@b%a002020「うーん……。　でも　あたし\n\tもうちょっと　考えてみる。\n\tどうするか　自分で決めたいの。\n@c0@"
  ko: "@a@b%a002020: 으음...... 하지만 난\n조금 더 생각해 볼게.\n어떻게 할지는 내가 정하고 싶어.\n@c0@"
  sl: "@a@b%a002020：嗯……\n　　请再让我考虑一下吧。\n　　我想自己做出决定。\n@c0@"
  tl: "@a@b%a002020：嗯……\n　　請再讓我考慮一下吧。\n　　我想自己做出決定。\n@c0@"
9:
  en: "@aLady Soren@bYou have every right, %a002020.\n@c0@"
  ja: "@a@bカルベ夫人「うむ\n\tそれが　よいじゃろう。\n@c0@"
  ko: "@a@b칼베 부인: 음......\n그럼 그렇게 하렴.\n@c0@"
  sl: "@a@b卡尔贝夫人：嗯，那就好。\n@c0@"
  tl: "@a@b卡爾貝夫人：嗯，那就好。\n@c0@"
10:
  en: "@a%0%a002020@bSorry if I seem wishy-washy. I just feel like I don't really know myself well enough yet...\n@c0@"
  ja: "@a@b%a002020「ごめんね　まだ　自分で\n\t自分が　よく　わからなくて……。\n@c0@"
  ko: "@a@b%a002020: 미안해, 아직 나도\n날 잘 모르겠어......\n@c0@"
  sl: "@a@b%a002020：对不起，因为我\n　　对自己都还不够了解……\n@c0@"
  tl: "@a@b%a002020：對不起，因為我\n　　對自己都還不夠瞭解……\n@c0@"
11:
  en: "@a%0%a002020@bAlright, %a000090. Let's go. We've still got to see everyone else off, right?\n@c0@"
  ja: "@a@b%a002020「行こっ　%a000090。\n\tほかのみんなを　送ってあげなきゃ。\n@c0@"
  ko: "@a@b%a002020: 가자, %a000090.\n다른 사람들을 데려다 줘야지.\n@c0@"
  sl: "@a@b%a002020：走吧%a000090。\n　　还要把其他人送回家呢。\n@c0@"
  tl: "@a@b%a002020：走吧%a000090。\n　　還要把其他人送回家呢。\n@c0@"
