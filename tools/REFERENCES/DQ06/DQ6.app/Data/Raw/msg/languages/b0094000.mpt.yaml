29:
  en: "@aMayor Spindell@bHah hah! Oh, I haven't felt so happy-go-lucky in ages! \n@c0@"
  ja: "@a@b村長「わっはっは！　ゆかいじゃ！\n\tこんなに　きぶんが　いいのは\n\tひさしぶりだわい。\n@c0@"
