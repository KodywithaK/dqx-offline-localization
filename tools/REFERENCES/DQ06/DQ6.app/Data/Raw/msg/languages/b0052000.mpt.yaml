0:
  en: "@a@b*: Travellers, you say? We don't often see your sort round here.\n@c0@"
  ja: "@a@b＊「おや　お客さんとは\n\tめずらしいのう。\n@c0@"
  ko: "@a@b*: 오오, 웬일로 손님이 다\n찾아왔구먼.\n@c0@"
  sl: "@a@b＊：哎呀，这里已经\n　　很久没有来过客人了。\n@c0@"
  tl: "@a@b＊：哎呀，這裡已經\n　　很久沒有來過客人了。\n@c0@"
1:
  en: "@a@b*: Who am I? Just a lonely survivor from Sorceria, the fabled enchanted city.\n@c0@"
  ja: "@a@b＊「わしは　伝説の魔法都市\n\tカルベローナの　生き残りじゃ。\n@c0@"
  ko: "@a@b*: 나는 전설의 마법 도시\n칼베로나에서 살아남은 자라네.\n@c0@"
  sl: "@a@b＊：我是传说中的魔法都市\n　　卡尔贝罗纳的幸存者。\n@c0@"
  tl: "@a@b＊：我是傳說中的魔法都市\n　　卡爾貝羅納的倖存者。\n@c0@"
2:
  en: "@a@b*: Do you youngsters know about Sorceria?\n@c0@"
  ja: "@a@b＊「あんた　カルベローナの話を\n\t知っとるかね？\n@c0@"
  ko: "@a@b*: 자네, 칼베로나 이야기를\n알고 있나?\n@c0@"
  sl: "@a@b＊：你们听说过卡尔贝罗纳的故事吗？\n@c0@"
  tl: "@a@b＊：你們聽說過卡爾貝羅納的故事嗎？\n@c0@"
3:
  en: "@a@b*: You do? Well, I suppose that's no surprise. Sorceria has become quite a legend, after all.\n@c0@"
  ja: "@a@b＊「そうか　知っとるか。\n\tまあ　有名な話じゃからな。\n@c0@"
  ko: "@a@b*: 그래, 알고 있다고?\n하긴, 유명한 이야기니 그럴 법도 하지.\n@c0@"
  sl: "@a@b＊：是嘛，听说过啊。\n　　也难怪，本来就是个有名的故事。\n@c0@"
  tl: "@a@b＊：是嘛，聽說過啊。\n　　也難怪，本來就是個有名的故事。\n@c0@"
4:
  en: "@a@b*: Once upon a time, Sorceria was a city on a small island in the bay to the west of here.\n@c0@"
  ja: "@a@b＊「カルベローナは　ここから西の\n\t沖に浮かぶ　小島にあった町じゃ。\n@c0@"
  ko: "@a@b*: 칼베로나는 서쪽 바다의\n작은 섬에 있었던 마을이라네.\n@c0@"
  sl: "@a@b＊：卡尔贝罗纳是一座小镇，\n　　就坐落在西面的海岛上。\n@c0@"
  tl: "@a@b＊：卡爾貝羅納是一座小鎮，\n　　就坐落在西面的海島上。\n@c0@"
5:
  en: "@a@b*: Sorcerers of all stripes would conduct all manner of magical research there.\n@c0@"
  ja: "@a@b＊「そこでは　毎日　いろんな魔法の\n\t研究が　されておってのう……。\n@c0@"
  ko: "@a@b*: 거기서는 매일 다양한\n마법 연구가 이루어졌지......\n@c0@"
  sl: "@a@b＊：那里每天都在进行着\n　　各种魔法的研究工作……\n@c0@"
  tl: "@a@b＊：那裡每天都在進行著\n　　各種魔法的研究工作……\n@c0@"
6:
  en: "@a@b*: There were even those who were learning the most potent spell of them all — Magic Burst!\n@c0@"
  ja: "@a@b＊「マダンテなる　究極の魔法も\n\t伝えられておったぞ。\n@c0@"
  ko: "@a@b*: 마단테 같은 궁극의 마법도\n전해지는 곳이었다네.\n@c0@"
  sl: "@a@b＊：最后甚至开发出了\n　　终极魔法玛达恩特。\n@c0@"
  tl: "@a@b＊：最後甚至開發出了\n　　終極魔法瑪達恩特。\n@c0@"
7:
  en: "@a@b*: Then one day without warning, the island sank and came to rest on the ocean floor.\n@c0@"
  ja: "@a@b＊「しかし　ある時　その小島ごと\n\t海の底に　沈んでしまったんじゃ。\n@c0@"
  ko: "@a@b*: 헌데 어느 날 도시가 섬과 함께 통째로\n바닷속으로 가라앉아 버리고 만 게야.\n@c0@"
  sl: "@a@b＊：不过，突然有一天，\n　　整个小岛全部沉入了海底。\n@c0@"
  tl: "@a@b＊：不過，突然有一天，\n　　整個小島全部沉入了海底。\n@c0@"
8:
  en: "@a@b*: To this day, I do not know whether it was accident, fate, or some dastardly soul's devilish design.\n@c0@"
  ja: "@a@b＊「それが　運命だったのか……。\n\t何者かの　しわざだったのか……。\n\t今となっては　わからんわい。\n@c0@"
  ko: "@a@b*: 과연 그건 운명이었는지......\n누군가의 계략이었는지......\n이제 와선 알 길이 없다네.\n@c0@"
  sl: "@a@b＊：直到现在都没有人知道，\n　　这到底是命运的安排……\n　　还是有人在背后搞鬼……\n@c0@"
  tl: "@a@b＊：直到現在都沒有人知道，\n　　這到底是命運的安排……\n　　還是有人在背後搞鬼……\n@c0@"
9:
  en: "@a@b*: But you know, recently I have been having strange dreams...\n@c0@"
  ja: "@a@b＊「そういえば　最近　ふしぎな夢を\n\t見たのう……。\n@c0@"
  ko: "@a@b*: 참, 그러고 보니 최근에\n희한한 꿈을 꿨는데 말이야.\n@c0@"
  sl: "@a@b＊：不过，我最近倒是\n　　做了一个不可思议的梦……\n@c0@"
  tl: "@a@b＊：不過，我最近倒是\n　　做了一個不可思議的夢……\n@c0@"
10:
  en: "@a@b*: In my dreams, Sorceria is resurrected and thriving once again...\n@c0@"
  ja: "@a@b＊「そのカルベローナが　ふたたび\n\tよみがえる夢じゃったよ。\n@c0@"
  ko: "@a@b*: 그 칼베로나가 다시\n부활하는 꿈이었다네.\n@c0@"
  sl: "@a@b＊：在那个梦里，\n　　卡尔贝罗纳又重新出现了。\n@c0@"
  tl: "@a@b＊：在那個夢裡，\n　　卡爾貝羅納又重新出現了。\n@c0@"
11:
  en: "@a@b‘Still no one comes to my aid... I fear my time is at hand...\n@c0@"
  ja: "@a@b『○月×日　今日も\n　たすけは　こなかった……。\n@c0@"
  ko: "@a@b''O월 X일 오늘도\n아무도 구하러 오지 않았다......''\n@c0@"
  sl: "@a@b○月×日\n今天也没有等到救援……\n@c0@"
  tl: "@a@b○月×日\n今天也沒有等到救援……\n@c0@"
12:
  en: "@a@b‘My final wish is for Ethyl and Welda to be happy. Please forgive me...’\n@c0@"
  ja: "@a@b『オレは　もう　だめだ……。\n　すまない　メアリ　そして　サリイ。\n　しあわせに　なっておくれ……。\n@c0@"
  ko: "@a@b''난 이제 틀렸다......\n미안하다, 메어리. 그리고 샐리.\n부디 행복하기를......''\n@c0@"
  sl: "@a@b我已经不行了……\n梅娅莉，还有萨利伊，对不起了。\n你们一定要幸福啊……\n@c0@"
  tl: "@a@b我已經不行了……\n梅婭莉，還有薩利伊，對不起了。\n你們一定要幸福啊……\n@c0@"
13:
  en: "@a@bThere's no response. It's just a corpse.\n@c0@"
  ja: "@a@b返事がない。\nただの　しかばねの　ようだ……。\n@c0@"
  ko: "@a@b반응이 없다.\n그냥 시체인 것 같다......\n@c0@"
  sl: "@a@b没有回应。\n看来只是一具尸体……\n@c0@"
  tl: "@a@b沒有回應。\n看來只是一具屍體……\n@c0@"
14:
  en: "@a@bThere seems to be some kind of journal gripped tightly in its hand. Do you want to read it?\n@c0@"
  ja: "@a@bしかし　その手には\n日記のようなものが　にぎられている。\n読んでみますか？\n@c0@"
  ko: "@a@b그러나 그 손에는\n일기 같은 것이 쥐어져 있다.\n읽어 보겠습니까?\n@c0@"
  sl: "@a@b但是，他的手里\n握着一本日记。\n要阅读吗？\n@c0@"
  tl: "@a@b但是，他的手裡\n握著一本日記。\n要閱讀嗎？\n@c0@"
