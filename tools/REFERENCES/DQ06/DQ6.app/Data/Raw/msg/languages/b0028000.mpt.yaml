1:
  en: "@a@b*: Welcome to Howcastle!\n@c0@"
  ja: "@a@b＊「ホルストック城へ　ようこそ！\n@c0@"
  ko: "@a@b*: 홀스톡 성에 오신 걸 환영합니다!\n@c0@"
  sl: "@a@b＊：欢迎来到荷尔斯托克城！\n@c0@"
  tl: "@a@b＊：歡迎來到荷爾斯托克城！\n@c0@"
2:
  en: "@a@b*: You wouldn't catch me tryin' to become a king! It sounds too much like hard work to me!\n@c0@"
  ja: "@a@b＊「王さま　なんて　だれにでも\n\tできるなんてものじゃ\n\tないしね。\n@c0@"
