  sl: "@a@b＊：国王可不是\n　　谁都能当的。\n@c0@"
  tl: "@a@b＊：國王可不是\n　　誰都能當的。\n@c0@"
3:
  en: "@a@b*: I'll stick with my carefree life o' leisure, if it's all the same to you!\n@c0@"
  ja: "@a@b＊「ホルス王子は　王位を\n\t継がないつもり　なのかな。\n@c0@"
  ko: "@a@b*: 홀스 왕자님은 왕위를\n잇지 않을 생각일까?\n@c0@"
  sl: "@a@b＊：荷尔斯王子\n　　是不是不打算即位啊……\n@c0@"
  tl: "@a@b＊：荷爾斯王子\n　　是不是不打算即位啊……\n@c0@"
4:
  en: "@a@b*: Since the Prince got back from his rite o' purification, he ain't asked me to come and look at his armour collection even once!\n@c0@"
  ja: "@a@b＊「ホルス王子　あれから\n\tあたしのスカート　めくらなく\n\tなったの……。\n@c0@"
  ko: "@a@b*: 홀스 왕자, 그날 이후로\n내 치마를 들추지 않게\n됐어......\n@c0@"
  sl: "@a@b＊：那之后荷尔斯王子\n　　就没再掀过\n　　人家的裙子了……\n@c0@"
  tl: "@a@b＊：那之後荷爾斯王子\n　　就沒再掀過\n　　人家的裙子了……\n@c0@"
5:
