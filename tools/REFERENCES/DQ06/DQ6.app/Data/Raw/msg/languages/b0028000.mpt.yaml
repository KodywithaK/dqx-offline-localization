  tl: "@a@b＊：這個荷爾克塔村\n　　是第一任荷爾斯托克王在位時\n　　興建起來的。\n@c0@"
66:
  en: "@a@b*: Whatever decision the King makes, we normally end up payin' for it!\n@c0@"
  ja: "@a@b＊「だから　村の名前に\n\tおんなじ　ホルっていうのが\n\tついているのよね。\n@c0@"
  ko: "@a@b*: 그래서 마을 이름에\n홀이라는 글자가 똑같이\n들어가 있지.\n@c0@"
  sl: "@a@b＊：所以村子的名字里面\n　　同样含有荷尔\n　　这两个字。\n@c0@"
  tl: "@a@b＊：所以村子的名字裡面\n　　同樣含有荷爾\n　　這兩個字。\n@c0@"
67:
  en: "@a@b*: There's no point playin' hide-and-seek on my own! Where's Prince Howard when you need him!?\n@c0@"
