  ko: "@a@b*: 홀스 왕자님이 우리의 왕이\n되는 날이 머지않아 찾아올지도......\n@c0@"
  sl: "@a@b＊：荷尔斯王子\n　　登基即位的日子不远了吧。\n@c0@"
  tl: "@a@b＊：荷爾斯王子\n　　登基即位的日子不遠了吧。\n@c0@"
