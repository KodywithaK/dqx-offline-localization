  ko: "@a@b*: 성실한 사람으로\n다시 태어난 걸까?\n@c0@"
  sl: "@a@b＊：难道他洗心革面，\n　　变成了一个正经的人了吗？\n@c0@"
  tl: "@a@b＊：難道他洗心革面，\n　　變成了一個正經的人了嗎？\n@c0@"
6:
  en: "@a@b*: ...Either that or he just don't fancy me any more!\n@c0@"
