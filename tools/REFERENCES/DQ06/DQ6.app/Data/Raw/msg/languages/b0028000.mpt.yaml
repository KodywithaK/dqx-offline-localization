  sl: "@a@b＊：哦，英勇的王子！\n　　其名为荷尔斯！\n@c0@"
  tl: "@a@b＊：哦，英勇的王子！\n　　其名為荷爾斯！\n@c0@"
10:
  en: "@a@b*: Finally, I can write these words without feeling like a fraud!\n@c0@"
