25:
  en: "@aPrince Howard@b%0%a000120! I fear I led you and your trusty band of companions on quite the merry chase!\n@c0@"
  ja: "@a@bホルス「やあ　%a000120か。\n\t今回のことは　いろいろと苦労を\n\tかけて　わるかったな。\n@c0@"
