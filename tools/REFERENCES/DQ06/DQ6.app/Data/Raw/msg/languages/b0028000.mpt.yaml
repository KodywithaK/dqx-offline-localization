  sl: "@a@b＊：真是给你们添麻烦了。\n　　要是你们没来的话，\n　　现在……\n@c0@"
  tl: "@a@b＊：真是給你們添麻煩了。\n　　要是你們沒來的話，\n　　現在……\n@c0@"
8:
