29:
  en: "@aPrince Howard@bYou are honest to a fault. But I'll overlook it. You will always be welcome in the realm of King Howard!\n@c0@"
  ja: "@a@bホルス「ははっ　%a000120は\n\tなかなか　正直だな。\n@c0@"
  ko: "@a@b홀스: 하하하, %a000120%F0120%X는%Y은%Z\n정말 솔직하군.\n@c0@"
  sl: "@a@b荷尔斯：哈哈，\n　　%a000120你还真诚实。\n@c0@"
