  en: "@a@b*: Owin' to yer bravery, the guards o' Howcastle can stay well away from caves and monsters for the foreseeable.\n@c0@"
  ja: "@a@b＊「おまえたちの　おかげで\n\tオレたちが　王子のお供に\n\tかりだされなくて　すんだよ。\n@c0@"
