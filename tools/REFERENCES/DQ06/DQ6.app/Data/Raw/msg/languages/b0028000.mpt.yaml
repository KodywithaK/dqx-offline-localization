  tl: "@a@b荷爾斯：我也學習你們的\n　　執著精神，好好努力吧。\n　　謝謝了，%a000120。\n@c0@"
34:
  en: "@a@b*: It's always a pleasure to see %H0860%Xyou%Yyou and yer allies%Z, %a000120!\n@c0@"
  ja: "@a@b＊「これは　%a000120どの。\n\tようこそ　おいでくださいました。\n@c0@"
