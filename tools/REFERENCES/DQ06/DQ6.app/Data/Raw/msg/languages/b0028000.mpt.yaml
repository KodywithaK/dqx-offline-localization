30:
  en: "@aPrince Howard@bMany tried to coax me through the rite of purification, but only you and your companions succeeded.\n@c0@"
  ja: "@a@bホルス「まあ　オレに　洗礼を\n\t受けさせようとしたヤツは\n\tいっぱい　いたけどな。\n@c0@"
  ko: "@a@b홀스: 나에게 세례를\n받게 하려던 녀석들은\n많이 있었지만 말이야.\n@c0@"
