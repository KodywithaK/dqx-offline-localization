9:
  en: "@a@b*: ‘Brimming with bravery, crammed full of courage and vested with boundless valour! The mighty Prince of Howcastle...’\n@c0@"
  ja: "@a@b＊「おおー　勇ましき王子ー！\n\tその名はー　ホルスー！\n@c0@"
