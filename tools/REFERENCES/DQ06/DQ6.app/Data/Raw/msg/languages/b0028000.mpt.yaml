  sl: "@a@b＊：这下子肯定会忙起来吧。\n@c0@"
  tl: "@a@b＊：這下子肯定會忙起來吧。\n@c0@"
23:
  en: "@a@b*: I always knew Prince Howard would get through the royal rite o' purification!\n@c0@"
