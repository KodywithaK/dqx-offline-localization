  tl: "@a@b荷爾斯：唉，雖說想要讓我\n　　接受洗禮的人有一大群。\n@c0@"
31:
  en: "@aPrince Howard@bI have never seen such dedication, such a sense of duty, such superlative hide-and-seek skills...\n@c0@"
  ja: "@a@bホルス「お前たちみたいに\n\tしつこかったヤツらは\n\tはじめてだったよ。\n@c0@"
