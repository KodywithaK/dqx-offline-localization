  sl: "@a@b＊：多亏了你们，\n　　我们不用被迫\n　　陪同王子去接受洗礼了。\n@c0@"
  tl: "@a@b＊：多虧了你們，\n　　我們不用被迫\n　　陪同王子去接受洗禮了。\n@c0@"
13:
  en: "@a@b*: We never were much of a fightin' force, to be honest. We just like the uniform.\n@c0@"
  ja: "@a@b＊「いや　本当に　助かった。\n\tありがとう。\n@c0@"
  ko: "@a@b*: 정말 다행이야.\n고맙다.\n@c0@"
  sl: "@a@b＊：哎呀，真是帮大忙了。\n　　谢谢了啊。\n@c0@"
  tl: "@a@b＊：哎呀，真是幫大忙了。\n　　謝謝了啊。\n@c0@"
14:
  en: "@a@b*: Prince Howard never comes round to pester me any more.\n@c0@"
  ja: "@a@b＊「ホルスさまが　つまみ食いを\n\tしなくなったんだ。\n@c0@"
