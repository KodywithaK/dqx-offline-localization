  ja: "@a@b＊「この城から　兵士が　すべて\n\tいなくなって　しまうところ\n\tだったよ。\n@c0@"
  ko: "@a@b*: 이 성에서 병사가\n모두 없어지고\n말았을 거라고.\n@c0@"
