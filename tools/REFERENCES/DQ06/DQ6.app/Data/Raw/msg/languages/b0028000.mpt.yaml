  ja: "@a@b＊「ふええー　あの弱虫と\n\tひょうばんの　王子が\n\tみごと　洗礼を　受けただか。\n@c0@"
  ko: "@a@b*: 세상에~ 겁쟁이라고\n평판이 자자한 왕자가\n제대로 세례를 받았네 그려.\n@c0@"
