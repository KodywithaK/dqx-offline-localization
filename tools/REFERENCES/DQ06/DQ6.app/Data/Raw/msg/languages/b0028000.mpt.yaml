15:
  en: "@a@b*: I must admit, I miss it a little bit...\n@c0@"
  ja: "@a@b＊「なんだか　さみしいねえ。\n@c0@"
  ko: "@a@b*: 왠지 섭섭하네.\n@c0@"
  sl: "@a@b＊：感觉有点寂寞呢。\n@c0@"
  tl: "@a@b＊：感覺有點寂寞呢。\n@c0@"
16:
  en: "@a@b*: Prince Howard's a new man! No more late-night card sessions for me!\n@c0@"
