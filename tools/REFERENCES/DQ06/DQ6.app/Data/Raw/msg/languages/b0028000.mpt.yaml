  tl: "@a@b＊：荷爾斯哥哥最近\n　　很少來找我玩了呢。\n@c0@"
18:
  en: "@a@b*: He never has time to play hide-and-seek with me any more!\n@c0@"
  ja: "@a@b＊「なんだか　いそがしいって……。\n@c0@"
