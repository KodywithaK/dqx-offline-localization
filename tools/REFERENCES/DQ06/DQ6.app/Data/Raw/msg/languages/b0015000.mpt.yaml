  sl: "@a@b雷多克王：为了表达我由衷的感谢，\n　　这是一点小小的礼物。\n　　你能收下吗？\n@c0@"
  tl: "@a@b雷多克王：為了表達我由衷的感謝，\n　　這是一點小小的禮物。\n　　你能收下嗎？\n@c0@"
43:
  en: "@aKing Somnus@bNow, now. No need to be humble. You just saved the world! Here, I insist.\n@c0@"
  ja: "@a@bレイドック王「まあ　そう\n\tえんりょせずとも　よいぞ。\n\tさあ　うけとれい。\n@c0@"
