  sl: "@a@b雷多克王：哎呀，\n　　何必这么推辞。\n　　来，快收下吧。\n@c0@"
  tl: "@a@b雷多克王：哎呀，\n　　何必這麼推辭。\n　　來，快收下吧。\n@c0@"
44:
  en: "@a@b%0%a000090 receives a lightning staff!\n㈡\n%0%a000090 puts the lightning staff in the bag.\n@c0@"
