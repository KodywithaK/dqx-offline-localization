  tl: "@a@b雷多克王：這一次，\n　　你們幾位的表現\n　　實在是太精彩了！\n@c0@"
40:
  en: "@aKing Somnus@bSurely the time for peace has returned at last. And we owe it all to your hard work.\n@c0@"
  ja: "@a@bレイドック王「これで　この世界にも\n\t平和が　おとずれるであろう。\n\tすべては　そなたらの　おかげじゃ。\n@c0@"
  ko: "@a@b레이독 왕: 이번에\n그대들이 세운 공적은\n매우 훌륭했네!\n@c0@"
