97:
  en: "@a@b*: The King and Queen are cured, Chancellor Keating is gone from the castle, and best of all, Murdaw's been defeated!\n@c0@"
  ja: "@a@b＊「王と王妃さまの病気は　なおる。\n\t大臣のゲバンは　お城を出てゆく。\n\tおまけに　ムドーも　たおされる。\n@c0@"
  ko: "@a@b*: 아니! 여러분은!\n자, 어서 들어가십시오.\n@c0@"
  sl: "@a@b＊：国王陛下和王妃殿下康复了，\n　　盖班大臣滚蛋了。\n　　而且姆多也被消灭了。\n@c0@"
  tl: "@a@b＊：國王陛下和王妃殿下康復了，\n　　蓋班大臣滾蛋了。\n　　而且姆多也被消滅了。\n@c0@"
98:
  en: "@a@b*: But wait... That seems like almost too many good things... I hope I'm not being set up for a massive disappointment...\n@c0@"
  ja: "@a@b＊「でも　こんなに　いい事ばかりが\n\tつづくと　いきなり　ドカンと……。\n\tいやいや　これは考えすぎですよね。\n@c0@"
  ko: "@a@b*: 아하핫,\n기분 좋다! 좋아!\n@c0@"
  sl: "@a@b＊：不过，这样的好事接二连三地来，\n　　会不会突然……\n　　不不，是我想多了吧。\n@c0@"
  tl: "@a@b＊：不過，這樣的好事接二連三地來，\n　　會不會突然……\n　　不不，是我想多了吧。\n@c0@"
99:
  en: "@a@b*: Yippee! Murdaw's gone forever! It's all peaceful again!\n@c0@"
  ja: "@a@b＊「わーい！　ムドーが　たおされたよ！\n\t平和になったよ　わーい！\n@c0@"
  ko: "@a@b*: 폐하와 왕비님의 병은 나았고,\n대신인 게반은 성을 나갔고,\n거기다 무도까지 쓰러졌죠.\n@c0@"
  sl: "@a@b＊：哇！姆多被打倒了！\n　　世界和平了！哇！\n@c0@"
  tl: "@a@b＊：哇！姆多被打倒了！\n　　世界和平了！哇！\n@c0@"
100:
  en: "@a@b*: Hey, have you heard? That evil old Murdaw's been beaten! He's finally gone!\n@c0@"
  ja: "@a@b＊「おい！　聞いてくれよ！\n\tついに　魔王ムドーが\n\tたおされたんだとっ！\n@c0@"
  ko: "@a@b*: 하지만 이렇게 좋은 일만 줄줄이\n이어지면 언젠가 갑자기 뒤통수를......\n아냐, 제가 너무 앞서 나간 거겠죠?\n@c0@"
  sl: "@a@b＊：喂！听我说啊！\n　　听说魔王姆多\n　　终于被打倒了！\n@c0@"
  tl: "@a@b＊：喂！聽我說啊！\n　　聽說魔王姆多\n　　終於被打倒了！\n@c0@"
101:
  en: "@a@b*: I say, do you remember that fake prince from the ‘Fake Prince Incident’ who turned up here with his gang?\n@c0@"
  ja: "@a@b＊「ねえ　知ってる？\n\t前に　この城下町に　ニセ者の\n\t王子さま一味が　きたんだけどね。\n@c0@"
  ko: "@a@b*: 와아! 무도가 쓰러졌어!\n평화가 찾아왔어! 와아!\n@c0@"
  sl: "@a@b＊：诶，你知道吗？\n　　之前这个城区来了一帮\n　　冒充王子殿下一行的人。\n@c0@"
  tl: "@a@b＊：誒，你知道嗎？\n　　之前這個城區來了一幫\n　　冒充王子殿下一行的人。\n@c0@"
102:
  en: "@a@b*: Apparently, it was the same gang that defeated Murdaw! Not that I believe a word of it, of course.\n@c0@"
  ja: "@a@b＊「なんでも　ムドーをたおしたのは\n\tそのひとたち　らしいわよ。\n\tウソみたいな話よねえ。\n@c0@"
  ko: "@a@b*: 이봐! 내 말 좀 들어 봐!\n드디어 마왕 무도가\n쓰러졌다는군!\n@c0@"
  sl: "@a@b＊：但是打倒姆多的\n　　好像就是他们哦。\n　　这事太扯了是吧。\n@c0@"
  tl: "@a@b＊：但是打倒姆多的\n　　好像就是他們哦。\n　　這事太扯了是吧。\n@c0@"
103:
  en: "@a@b*: Let's see... ‘Dread Fiend...’㈢ ‘Murdaw...’㈢ ‘Defeated...’㈢ ...Well, fancy that!\n@c0@"
  ja: "@a@b＊「魔王ムドー　退治される\n\t……だって！\n@c0@"
  ko: "@a@b*: 저기, 알고 있어?\n요전에 이 성 시가지에 가짜\n왕자님 일당이 왔었거든.\n@c0@"
  sl: "@a@b＊：上面写的是……\n　　魔王姆多被打倒了！\n@c0@"
  tl: "@a@b＊：上面寫的是……\n　　魔王姆多被打倒了！\n@c0@"
104:
  en: "@a@b*: Im not one to get overexcited, but this is without a doubt the best news I've ever heard!\n@c0@"
  ja: "@a@b＊「これで　平和な時代が来るんだね。\n\tわたしゃ　今まで　生きてきて\n\tこんな　うれしい日は　ないよ。\n@c0@"
  ko: "@a@b*: 듣자 하니 무도를 쓰러뜨린 건\n그 사람들이었대.\n꼭 거짓말 같아.\n@c0@"
  sl: "@a@b＊：这样和平的时代会来临了吧。\n　　我活到今天，\n　　还没有一天像现在这么开心过呢。\n@c0@"
  tl: "@a@b＊：這樣和平的時代會來臨了吧。\n　　我活到今天，\n　　還沒有一天像現在這麼開心過呢。\n@c0@"
105:
  en: "@a@b*: Wait, you're %H0860%Xone of the ones%Ythe ones%Z who disposed of Murdaw!? It is an honour to have this brush with greatness!\n@c0@"
  ja: "@a@b＊「もしや　あなたがたは　ムドーを\n\tたおしたひとたち　ではっ！？\n\tあ　ありがとうございました！\n@c0@"
  ko: "@a@b*: 마왕 무도 퇴치되다\n......어머나 세상에!\n@c0@"
  sl: "@a@b＊：难不成你们就是\n　　打倒姆多的那些人？！\n　　谢、谢谢你们！\n@c0@"
  tl: "@a@b＊：難不成你們就是\n　　打倒姆多的那些人？！\n　　謝、謝謝你們！\n@c0@"
106:
  en: "@a@b*: Everything seems much better when the world is peaceful. This breeze has never felt so refreshing!\n@c0@"
  ja: "@a@b＊「平和って　いいもんだねえ。\n\t空気を　こんなに　すがすがしく\n\t感じたのは　ひさしぶりだよ。\n@c0@"
  ko: "@a@b*: 이제 평화로운 시대가 찾아오겠구나.\n나는 지금까지 살면서\n이렇게 기쁜 날이 없었어.\n@c0@"
  sl: "@a@b＊：和平这东西真是太好了。\n　　我已经好久没有呼吸过\n　　这么清爽的空气了呢。\n@c0@"
  tl: "@a@b＊：和平這東西真是太好了。\n　　我已經好久沒有呼吸過\n　　這麼清爽的空氣了呢。\n@c0@"
107:
  en: "@a@b*: Our brave young Prince embarked on a journey to defeat Murdaw and find a cure for his parents' illness.\n@c0@"
  ja: "@a@b＊「この国の　王子さまはのう\n\t王さまと王妃さまの病気をなおすため\n\tムドー討ばつに　旅立ったのじゃ。\n@c0@"
  ko: "@a@b*: 혹시 여러분은 무도를\n쓰러뜨린 분들이 아닌가요!?\n가, 감사합니다!\n@c0@"
  sl: "@a@b＊：这个国家的王子\n　　为了治好国王和王妃\n　　而踏上了讨伐姆多的征途。\n@c0@"
  tl: "@a@b＊：這個國家的王子\n　　為了治好國王和王妃\n　　而踏上了討伐姆多的征途。\n@c0@"
108:
  en: "@a@b*: He must've believed that Murdaw was responsible for his parents' condition.\n@c0@"
  ja: "@a@b＊「おふたりの病気の原因が\n\tムドーにあると考えたんじゃろ。\n@c0@"
  ko: "@a@b*: 평화란 참 좋군.\n이렇게 상쾌한 공기를\n느껴본 건 오랜만이야.\n@c0@"
  sl: "@a@b＊：他认为两人之所以得病，\n　　其原因在于姆多。\n@c0@"
  tl: "@a@b＊：他認為兩人之所以得病，\n　　其原因在於姆多。\n@c0@"
109:
  en: "@a@b*: Sadly though, we're all in the dark as to what became of him...\n@c0@"
  ja: "@a@b＊「じゃが　それっきり　ゆくえ知れず。\n@c0@"
  ko: "@a@b*: 이 나라의 왕자님은 말일세,\n왕과 왕비님의 병을 고치기 위해\n무도를 무찌르러 여행을 떠났다네.\n@c0@"
  sl: "@a@b＊：但那之后一直下落不明。\n@c0@"
  tl: "@a@b＊：但那之後一直下落不明。\n@c0@"
110:
  en: "@a@b*: But I have to say — you do bear a striking resemblance to the lad.\n@c0@"
  ja: "@a@b＊「そういえば　あんた\n\tその王子さまに　少し　にてるのう。\n@c0@"
  ko: "@a@b*: 두 분이 병이 난 원인이\n무도에게 있다고 생각하신 게지.\n@c0@"
  sl: "@a@b＊：话说回来，\n　　你跟王子殿下还有几分相似呢。\n@c0@"
  tl: "@a@b＊：話說回來，\n　　你跟王子殿下還有幾分相似呢。\n@c0@"
111:
  en: "@a@b*: Now that awful Murdaw has been dealt with, the world can return to being peaceful.\n@c0@"
  ja: "@a@b＊「魔王ムドーは　ほろびさり\n\t世界は　日に日に　平和を\n\tとりもどしてゆくことでしょう。\n@c0@"
  ko: "@a@b*: 헌데 그 뒤로 종적을 감추고 말았다네.\n@c0@"
  sl: "@a@b＊：魔王姆多覆灭，\n　　世界也一定会\n　　日渐恢复和平吧。\n@c0@"
  tl: "@a@b＊：魔王姆多覆滅，\n　　世界也一定會\n　　日漸恢復和平吧。\n@c0@"
112:
  en: "@a@b*: Could it be that you were sent from the Goddess to save us?\n@c0@"
  ja: "@a@b＊「あなたがたは　神がつかわせた\n\t救世主なのかもしれませんね。\n@c0@"
  ko: "@a@b*: 그러고 보니 자네,\n그 왕자님과 조금 닮았구먼.\n@c0@"
  sl: "@a@b＊：你们说不定是\n　　神赐予我们的救世主呢。\n@c0@"
  tl: "@a@b＊：你們說不定是\n　　神賜予我們的救世主呢。\n@c0@"
113:
  en: "@a@b*: Thanks to you, travelling around is so much safer now. I'll finally be able to peddle in peace!\n@c0@"
  ja: "@a@b＊「ありがとうございました！\n\tこれで　安心して　いろんな所に\n\t商売に　行けます！\n@c0@"
  ko: "@a@b*: 마왕 무도가 쓰러졌으니\n이 세계는 나날이 평화를\n되찾아갈 것입니다.\n@c0@"
  sl: "@a@b＊：谢谢你们！\n　　这下子我可以放心地\n　　去各地做买卖了！\n@c0@"
  tl: "@a@b＊：謝謝你們！\n　　這下子我可以放心地\n　　去各地做買賣了！\n@c0@"
114:
  en: "@a@b*: The world may be peaceful again, but Captain Rusty will never return...\n@c0@"
  ja: "@a@b＊「世の中が　せっかく平和になったのに\n\tトム兵士長は　もう　もどってこん。\n@c0@"
  ko: "@a@b*: 여러분은 신께서 보내신\n구세주일지도 모르겠군요.\n@c0@"
  sl: "@a@b＊：世界好不容易恢复了和平，\n　　托姆士兵长却再也回不来了。\n@c0@"
  tl: "@a@b＊：世界好不容易恢復了和平，\n　　托姆士兵長卻再也回不來了。\n@c0@"
115:
  en: "@a@b*: I knew him from when he was a lad. He always hated the name ‘Rusty’ as I recall...\n@c0@"
  ja: "@a@b＊「わしは　あのトムを　小さい頃から\n\t知ってるけど　トムという\n\t自分の名前を　イヤがってな……。\n@c0@"
  ko: "@a@b*: 고맙습니다!\n앞으로는 마음 놓고 다양한 장소로\n장사하러 갈 수 있겠어요!\n@c0@"
  sl: "@a@b＊：从托姆士兵长小的时候，\n　　我就认识他了，\n　　他很讨厌托姆这个名字……\n@c0@"
  tl: "@a@b＊：從托姆士兵長小的時候，\n　　我就認識他了，\n　　他很討厭托姆這個名字……\n@c0@"
116:
  en: "@a@b*: When he used to play soldiers, he called himself ‘Blade’. Well, you can always dream...\n@c0@"
  ja: "@a@b＊「ソルディなんて　いさましい名を\n\tかってにつけて　よく\n\t兵隊ごっこを　しておったのう。\n@c0@"
  ko: "@a@b*: 이 세상이 이리도 평화로워졌건만\n톰 병사단장은 돌아올 수 없는 몸이 되었군.\n@c0@"
  sl: "@a@b＊：他给自己取了个威风的名字\n　　叫索迪，\n　　还经常假扮士兵玩游戏。\n@c0@"
  tl: "@a@b＊：他給自己取了個威風的名字\n　　叫索迪，\n　　還經常假扮士兵玩遊戲。\n@c0@"
117:
  en: "@a@b*: Never in my wildest dreams did I think I'd live to see a peaceful world.\n@c0@"
  ja: "@a@b＊「生きてるうちに\n\t平和な世の中になるとは\n\t夢にも　思わんかったよ。\n@c0@"
  ko: "@a@b*: 나는 톰이 어렸을 때부터\n알고 지냈네만, 그는 톰이라는\n자기 이름을 싫어했다네......\n@c0@"
  sl: "@a@b＊：我连做梦都没想到过，\n　　在我有生之年\n　　世界会恢复和平。\n@c0@"
  tl: "@a@b＊：我連做夢都沒想到過，\n　　在我有生之年\n　　世界會恢復和平。\n@c0@"
118:
  en: "@a@b*: Of course, it's all thanks to you. May the Goddess be with you!\n@c0@"
  ja: "@a@b＊「ほんに　ありがたいことじゃて。\n@c0@"
  ko: "@a@b*: 솔디인가 하는 용맹스러운 이름을\n멋대로 붙이고는 종종\n병정 놀이를 하곤 했지.\n@c0@"
  sl: "@a@b＊：真是谢天谢地。\n@c0@"
  tl: "@a@b＊：真是謝天謝地。\n@c0@"
119:
  en: "@a@b*: Murdaw's been defeated, but my other half just lies there asleep all day!\n@c0@"
  ja: "@a@b＊「ムドーが退治されたというのに\n\tうちの　じいさんは\n\tねてばかりじゃ。\n@c0@"
  ko: "@a@b*: 살아생전에 평화로운 \n세상이 될 줄\n꿈에도 생각하지 못했어.\n@c0@"
  sl: "@a@b＊：姆多被打倒了，\n　　但是我家老头\n　　还是卧床不起。\n@c0@"
  tl: "@a@b＊：姆多被打倒了，\n　　但是我家老頭\n　　還是臥床不起。\n@c0@"
120:
  en: "@a@b*: He says he's been having dreams about an abbey somewhere, but I do wonder...\n@c0@"
  ja: "@a@b＊「どこかの神殿にいる夢をみると\n\t言うておったが\n\tあやしいもんじゃわい。\n@c0@"
  ko: "@a@b*: 참말로 고마운 일이야.\n@c0@"
  sl: "@a@b＊：还说梦到自己\n　　身处一个不知道在哪的神殿里面。\n　　真是奇怪。\n@c0@"
  tl: "@a@b＊：還說夢到自己\n　　身處一個不知道在哪的神殿裡面。\n　　真是奇怪。\n@c0@"
121:
  en: "@a@b*: Ah-phew... Ah-phew... I'm not cut out for monster taming... I'd rather be a pattycake princess...\n@c0@"
  ja: "@a@b＊「ムニャムニャ……。\n\tわしは　やっぱり　まものマスターより\n\tピチピチギャルに　なりたいのう……。\n@c0@"
  ko: "@a@b*: 무도가 퇴치되었다는데\n우리 집 영감은\n잠만 자고 있다우.\n@c0@"
  sl: "@a@b＊：呼……呼……\n　　比起魔物大师，\n　　我更想做个靓妹啊……\n@c0@"
  tl: "@a@b＊：呼……呼……\n　　比起魔物大師，\n　　我更想做個靚妹啊……\n@c0@"
122:
  en: "@aQueen Apnea@bI am truly sorry, %a000090. I did not want to bring this up on such a joyous day...\n@c0@"
  ja: "@a@bシェーラ「%a000090　ごめんなさいね。\n\tこのような　めでたい日に\n\t言いたくはないのですが……\n@c0@"
  ko: "@a@b*: 어느 신전에 있는 꿈을\n꾼다고는 하는데\n수상해서, 원.\n@c0@"
  sl: "@a@b谢菈：%a000090，很抱歉。\n　　在这么可喜可贺的日子里\n　　本来不应该说这话……\n@c0@"
  tl: "@a@b謝菈：%a000090，很抱歉。\n　　在這麼可喜可賀的日子裡\n　　本來不應該說這話……\n@c0@"
123:
  en: "@aQueen Apnea@bBut if Murdaw has been defeated, and the world is finally peaceful again...\n@c0@"
  ja: "@a@bシェーラ「魔王ムドーが　ほろび\n\t本当に　平和がおとずれたなら……\n@c0@"
  ko: "@a@b*: 흠냐흠냐......\n나는 마물 마스터보다는\n쭉쭉빵빵 아가씨가 되고 싶구먼......\n@c0@"
  sl: "@a@b谢菈：打倒了魔王姆多，\n　　世界真的就能迎来和平的话……\n@c0@"
  tl: "@a@b謝菈：打倒了魔王姆多，\n　　世界真的就能迎來和平的話……\n@c0@"
124:
  en: "@aQueen Apnea@bThen why has your true self not yet returned?\n@c0@"
  ja: "@a@bシェーラ「なぜ　あなたは……\n\tあなたの　現実の身体は\n\tもどって来ないのでしょう。\n@c0@"
  ko: "@a@b시엘라: %a000090, 미안하군요.\n이렇게 기쁜 날에\n할 얘기는 아니지만......\n@c0@"
  sl: "@a@b谢菈：为什么你……\n　　你在现实世界的身体\n　　没有回来呢。\n@c0@"
  tl: "@a@b謝菈：為什麼你……\n　　你在現實世界的身體\n　　沒有回來呢。\n@c0@"
125:
  en: "@aQueen Apnea@bI can't stop thinking about it...\n@c0@"
  ja: "@a@bシェーラ「そのことが　どうしても\n\t私には　ひっかかるのです。\n@c0@"
  ko: "@a@b시엘라: 마왕 무도가 사라져서\n이 세상에 정말 평화가 찾아온 거라면......\n@c0@"
  sl: "@a@b谢菈：这个问题\n　　我实在是百思不得其解。\n@c0@"
  tl: "@a@b謝菈：這個問題\n　　我實在是百思不得其解。\n@c0@"
126:
