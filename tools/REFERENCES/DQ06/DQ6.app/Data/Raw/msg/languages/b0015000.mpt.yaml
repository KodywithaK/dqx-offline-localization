  sl: "@a@b雷多克王：作为这个国家的国王……\n　　不，作为这个世界的居民，\n　　我要衷心感谢你们！\n@c0@"
  tl: "@a@b雷多克王：作為這個國家的國王……\n　　不，作為這個世界的居民，\n　　我要衷心感謝你們！\n@c0@"
42:
  en: "@aKing Somnus@bPlease accept this as a token of our gratitude. It's nothing much, but, well...will you take it?\n@c0@"
