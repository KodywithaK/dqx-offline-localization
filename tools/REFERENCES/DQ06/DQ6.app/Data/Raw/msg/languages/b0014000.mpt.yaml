  ko: "@a@b장로: 걱정 말거라.\n확실하게 거절해 두었단다.\n@c0@"
  sl: "@a@b%a002030：唔！\n@c0@"
  tl: "@a@b%a002030：唔！\n@c0@"
70:
  en: "@a@b%3%0%a002030... Can you hear me? It is you whom I seek...%4\n@c0@"
  ja: "@a@b%3%a002030　%a002030よ……。\n私の声が　聞こえますね。%4\n@c0@"
  ko: "@a@b%a002030: 이제 아셨죠?\n그만 돌아가시는 게 좋겠습니다.\n@c0@"
  sl: "@a@b%3%a002030，%a002030……\n能听到我的声音吧。%4\n@c0@"
  tl: "@a@b%3%a002030，%a002030……\n能聽到我的聲音吧。%4\n@c0@"
71:
  en: "@a@b%3You must not send these visitors away... For your destiny lies with them...%4\n@c0@"
  ja: "@a@b%3この者たちを　帰しては　なりません。%4\n@c0@"
  ko: "@a@b%a002030: 으윽!\n@c0@"
  sl: "@a@b%3不应该赶这些人走。%4\n@c0@"
  tl: "@a@b%3不應該趕這些人走。%4\n@c0@"
72:
  en: "@a@b%3Together you must embark on a voyage to the Isle of Murdaw aboard the Providence...%4\n@c0@"
  ja: "@a@b%3この者たちと　ともに　神の船で\nムドーの島に　むかうのです……。%4\n@c0@"
  ko: "@a@b%3%a002030, %a002030......\n제 목소리가 들리시죠.%4\n@c0@"
  sl: "@a@b%3你应该跟这些人一起\n坐神之船去姆多岛……%4\n@c0@"
  tl: "@a@b%3你應該跟這些人一起\n坐神之船去姆多島……%4\n@c0@"
73:
  en: "@aElder@b%0%a002030! Wh-What is it, my child!? What afflicts you?\n@c0@"
  ja: "@a@b長老「ど　どうしたのじゃ　%a002030？\n@c0@"
  ko: "@a@b%3이 사람들을 그냥 돌려보내면 안 됩니다.%4\n@c0@"
  sl: "@a@b长老：你、你怎么了，%a002030？\n@c0@"
  tl: "@a@b長老：你、你怎麼了，%a002030？\n@c0@"
74:
  en: "@a%0%a002030@bIt has been decided. We must allow our visitors free use of the Providence. And I must join them.\n@c0@"
  ja: "@a@b%a002030「このひとたちに\n\t船をかすことに　しましょう。\n\t私も　ともに　行きます。\n@c0@"
  ko: "@a@b%3이 사람들과 함께 신의 배를 타고\n무도의 섬에 가야 합니다......%4\n@c0@"
  sl: "@a@b%a002030：爷爷，\n　　请把船借给这些人吧。\n　　我也跟他们一起去。\n@c0@"
  tl: "@a@b%a002030：爺爺，\n　　請把船借給這些人吧。\n　　我也跟他們一起去。\n@c0@"
75:
  en: "@aElder@bB-But wh-why the sudden change of heart!? It is not like you!\n@c0@"
  ja: "@a@b長老「ど　どうしたのじゃ　とつぜん？\n@c0@"
  ko: "@a@b장로: %a002030, 왜, 왜 그러느냐?\n@c0@"
  sl: "@a@b长老：你、你这是怎么了？\n@c0@"
  tl: "@a@b長老：你、你這是怎麼了？\n@c0@"
76:
  en: "@a%0%a002030@bA higher power made the decision, not I. The Goddess deigned to speak to me...\n@c0@"
