  sl: "@a@b＊：面对那位强者，\n　　即使是魔王姆多大人\n　　也撑不了几个回合。\n@c0@"
  tl: "@a@b＊：面對那位強者，\n　　即使是魔王姆多大人\n　　也撐不了幾個回合。\n@c0@"
218:
  en: "@a@b*: I was imprisoned here so I would not share this knowledge! But now I have! Tee hee hee!\n@c0@"
