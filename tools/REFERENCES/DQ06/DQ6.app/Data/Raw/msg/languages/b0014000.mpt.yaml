  sl: "@a@b＊：在这世界的某处，\n　　有一位强者，\n　　比魔王姆多大人还强大。\n@c0@"
  tl: "@a@b＊：在這世界的某處，\n　　有一位強者，\n　　比魔王姆多大人還強大。\n@c0@"
217:
