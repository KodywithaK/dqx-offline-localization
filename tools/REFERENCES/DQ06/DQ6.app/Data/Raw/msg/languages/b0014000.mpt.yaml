  tl: "@a@b%a002030：那麼我在這裡等你們。\n　　等你們做完別的事情再來找我。\n@c0@"
99:
  en: "@a%0%a002030@bVery well. It is time for us to embark on our quest. Our destinies are entwined.\n@c0@"
  ja: "@a@b%a002030「わかりました。\n\tでは　私も　あなたがたに　お供して\n\t神の船を　めざめさせましょう。\n@c0@"
  ko: "@a@b%a002030: 준비되셨나요?\n@c0@"
  sl: "@a@b%a002030：明白了。\n　　那么就让我跟你们一起，\n　　乘着神之船旅行吧。\n@c0@"
  tl: "@a@b%a002030：明白了。\n　　那麼就讓我跟你們一起，\n　　乘著神之船旅行吧。\n@c0@"
100:
  en: "@a@b%0%a002030 joins the party.\n@c0@"
  ja: "@a@b%a002030が　仲間に　くわわった！\n@c0@"
  ko: "@a@b---점프---> #014265로\n@c0@"
  sl: "@a@b%a002030成为了伙伴！\n@c0@"
  tl: "@a@b%a002030成為了夥伴！\n@c0@"
101:
  en: "@a@b%0%a002030 closes his eyes and begins to pray...\n@c0@"
  ja: "@a@b%a002030は　しずかに目をとじて\n祈りはじめた……。\n@c0@"
  ko: "@a@b%a002030: 그럼 여기서 기다리고 있겠습니다.\n일이 끝나면 꼭 오십시오.\n@c0@"
  sl: "@a@b%a002030闭上眼睛\n小声地开始祈祷……\n@c0@"
  tl: "@a@b%a002030閉上眼睛\n小聲地開始祈禱……\n@c0@"
102:
  en: "@a%0%a002030@bO Goddess, since ancient times, the people of Ghent have served as Your most faithful vassals.\n@c0@"
  ja: "@a@b%a002030「われ　ゲントの民にして\n\tいにしえより　神に仕えるものなり。\n@c0@"
  ko: "@a@b%a002030: 알겠습니다.\n그럼 저도 여러분과 함께\n신의 배를 깨우겠습니다.\n@c0@"
  sl: "@a@b%a002030：我等根特族子民\n　　虔诚地匍匐在您的脚下。\n@c0@"
  tl: "@a@b%a002030：我等根特族子民\n　　虔誠地匍匐在您的腳下。\n@c0@"
103:
  en: "@a%0%a002030@bNow, as the sacred seal of the Providence is broken, we pray that You will send the wind to fill her sails...\n@c0@"
  ja: "@a@b%a002030「神よ。　いだいなる神よ。\n\t今ここに　さずかりし神の封印を\n\tときはなち　われに　チカラを……。\n@c0@"
  ko: "@a@b%a002030%F2030%X가%Y이%Z 동료로 합류했다!\n@c0@"
  sl: "@a@b%a002030：神啊。伟大的神。\n　　祈求您解开神之船上的封印，\n　　赐予我等力量……\n@c0@"
  tl: "@a@b%a002030：神啊。偉大的神。\n　　祈求您解開神之船上的封印，\n　　賜予我等力量……\n@c0@"
104:
  en: "@a%0%a002030@bDEVOTIOR MERCU VOTARO INSTIA TOR! O Goddess, hear my prayer!\n@c0@"
  ja: "@a@b%a002030「アーレサンドウ　マーキャ\n\tネーハイ　キサント　ベシテ\n\tパラキレ　ベニベニ　パラキレ……。\n@c0@"
