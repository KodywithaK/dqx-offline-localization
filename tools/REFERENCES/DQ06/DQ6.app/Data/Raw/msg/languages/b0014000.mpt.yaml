  sl: "@a@b%a002030：刚才，神说话了……\n@c0@"
  tl: "@a@b%a002030：剛才，神說話了……\n@c0@"
77:
  en: "@aElder@bBut wait! This can only mean that the visitors who stand before us are the heroes spoken of in legend!\n@c0@"
  ja: "@a@b長老「す　すると　この者たちが\n\t伝説の勇者だと……！？\n@c0@"
  ko: "@a@b장로: 갑자기 왜 그러는 게냐?\n@c0@"
  sl: "@a@b长老：这、这就是说，\n　　他们是传说的勇者？！\n@c0@"
  tl: "@a@b長老：這、這就是說，\n　　他們是傳說的勇者？！\n@c0@"
78:
  en: "@a%0%a002030@bIndeed, that may be so. But it is impossible for us to know.\n@c0@"
  ja: "@a@b%a002030「そうかもしれませんし\n\tそうでないかもしれません。\n@c0@"
  ko: "@a@b%a002030: 방금...... 신의 목소리가......\n@c0@"
  sl: "@a@b%a002030：可能是，\n　　也可能不是。\n@c0@"
  tl: "@a@b%a002030：可能是，\n　　也可能不是。\n@c0@"
79:
  en: "@a%0%a002030@bAll I know is that we must break the seal and return the Providence to the ocean.\n@c0@"
  ja: "@a@b%a002030「しかし　神にさずかりし\n\t船の封印を　とくことが\n\tどんな結果を　もたらすのか……。\n@c0@"
  ko: "@a@b장로: 그, 그렇다면 이 사람들이\n전설의 용사......?\n@c0@"
  sl: "@a@b%a002030：我不太清楚\n　　解开神授之船的封印\n　　会有什么后果……\n@c0@"
  tl: "@a@b%a002030：我不太清楚\n　　解開神授之船的封印\n　　會有什麼後果……\n@c0@"
80:
  en: "@a%0%a002030@bWhat will happen beyond that, only the Goddess knows. But I must witness it with my own eyes. I must go.\n@c0@"
  ja: "@a@b%a002030「この先　世界は\n\tどうなってゆくのかを　この目で\n\tたしかめたいと思います。\n@c0@"
  ko: "@a@b%a002030: 그럴지도 모르고\n아닐지도 모르죠.\n@c0@"
  sl: "@a@b%a002030：但是，\n　　我想亲眼看到\n　　这个世界的未来。\n@c0@"
  tl: "@a@b%a002030：但是，\n　　我想親眼看到\n　　這個世界的未來。\n@c0@"
81:
  en: "@aElder@bThe Goddess has spoken, and it is not in our power to ignore Her divine voice when it calls.\n@c0@"
  ja: "@a@b長老「ふむっ！　よくぞ　申した！\n@c0@"
  ko: "@a@b%a002030: 하지만 신께서 내려주신\n배의 봉인을 풀면\n어떤 결과가 나타날지......\n@c0@"
  sl: "@a@b长老：嗯！说得好！\n@c0@"
  tl: "@a@b長老：嗯！說得好！\n@c0@"
82:
  en: "@aElder@bI cannot stand in your way. I have seen how your powers have grown, and I know the heavens have their own plans for you.\n@c0@"
  ja: "@a@b長老「近頃　日ましに　お前の\n\tチカラが　強くなっているのも\n\t神の　おぼしめしかもしれん。\n@c0@"
  ko: "@a@b%a002030: 앞으로 세상이\n어떻게 변해 가는지 제 눈으로\n직접 확인하고 싶습니다.\n@c0@"
  sl: "@a@b长老：这一阵子，\n　　你的力量越来越强大，\n　　这或许就是神的启示。\n@c0@"
  tl: "@a@b長老：這一陣子，\n　　你的力量越來越強大，\n　　這或許就是神的啟示。\n@c0@"
83:
  en: "@aElder@bGo, my child! It is time to break the seal! It is time for the Providence to set sail once more!\n@c0@"
  ja: "@a@b長老「ゆけ！　わがマゴよ！\n\t今こそ　封印をとく　時じゃ！\n@c0@"
  ko: "@a@b장로: 오호! 기특한 이야기로다!\n@c0@"
  sl: "@a@b长老：去吧！我的孙子！\n　　现在就是解开封印的时候！\n@c0@"
  tl: "@a@b長老：去吧！我的孫子！\n　　現在就是解開封印的時候！\n@c0@"
84:
  en: "@a%0%a002030@bCome. It is time for us to go. We must head to the shrine where the Providence awaits.\n@c0@"
  ja: "@a@b%a002030「みなさん　行きましょう。\n\t村の奥の　神の船の神殿へ。\n@c0@"
