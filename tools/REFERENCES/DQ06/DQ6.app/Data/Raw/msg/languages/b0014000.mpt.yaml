  ko: "@a@b%a002000: 에잇, 일일이 말하려니\n귀찮아 죽겠네!\n@c0@"
  sl: "@a@b＊：我就是因为\n　　知道了这个秘密，\n　　才会被关在这里。嘿嘿嘿……\n@c0@"
  tl: "@a@b＊：我就是因為\n　　知道了這個秘密，\n　　才會被關在這裡。嘿嘿嘿……\n@c0@"
219:
