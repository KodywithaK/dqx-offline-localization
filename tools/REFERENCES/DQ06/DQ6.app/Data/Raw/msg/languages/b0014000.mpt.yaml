142:
  en: "@aElder@bI see. Do not be downhearted. Prepare for your next attempt well, and with the grace of the Goddess, you shall prevail.\n@c0@"
  ja: "@a@b長老「ふむ　そうか……。\n\tしかし　あせるでないぞ。\n@c0@"
  ko: "@a@b장로: 나는 믿고 있다네.\n@c0@"
  sl: "@a@b长老：嗯，这样啊……\n　　不要过于急躁。\n@c0@"
  tl: "@a@b長老：嗯，這樣啊……\n　　不要過於急躁。\n@c0@"
143:
  en: "@aElder@bHmm. But before we go any further...\n@c0@"
  ja: "@a@b長老「ふむ　その前に……。\n@c0@"
  ko: "@a@b장로: 언젠가 자네들이\n마왕 무도를 해치우고\n돌아올 거라고 말일세.\n@c0@"
  sl: "@a@b长老：嗯，谈话之前……\n@c0@"
  tl: "@a@b長老：嗯，談話之前……\n@c0@"
144:
  en: "@a@bThe Elder closes his eyes and begins to pray intently...\n@c0@"
  ja: "@a@b長老は　目をとじて　しずかに\nめいそうを　はじめた。\n@c0@"
  ko: "@a@b장로: 오호, 돌아왔구나.\n그래, 어떠했느냐?\n@c0@"
  sl: "@a@b长老闭上了双眼，\n开始静静地冥想。\n@c0@"
  tl: "@a@b長老閉上了雙眼，\n開始靜靜地冥想。\n@c0@"
145:
  en: "@a@b%0%a000180 returns to life!\n@c0@"
  ja: "@a@bなんと　%a000180が　生き返った！\n@c0@"
  ko: "@a@b장로: 으흠, 그랬구나......\n허나 조급해 하지 말거라.\n@c0@"
  sl: "@a@b%a000180复活了！\n@c0@"
  tl: "@a@b%a000180復活了！\n@c0@"
146:
  en: "@aElder@bSo, how did you fare?\n@c0@"
  ja: "@a@b長老「して　どうじゃったのじゃ？\n@c0@"
  ko: "@a@b장로: 으흠, 그 전에......\n@c0@"
  sl: "@a@b长老：说说结果吧？\n@c0@"
  tl: "@a@b長老：說說結果吧？\n@c0@"
147:
  en: "@a@b*: At long last, the Providence rides the waves once more!\n@c0@"
  ja: "@a@b＊「神の船は　ついに\n\t出航いたしました。\n@c0@"
  ko: "@a@b장로는 눈을 감고 조용히\n명상을 시작했다.\n@c0@"
  sl: "@a@b＊：神之船终于出航了。\n@c0@"
  tl: "@a@b＊：神之船終於出航了。\n@c0@"
148:
  en: "@a@b*: To think that none other than blessed %a002030, the chosen one, now sails aboard the Providence...\n@c0@"
  ja: "@a@b＊「私たちが　手入れしてきた船に\n\t%a002030さまが　乗られる。\n@c0@"
  ko: "@a@b놀랍게도 %a000180%F0180%X가%Y이%Z 되살아났다!\n@c0@"
  sl: "@a@b＊：我们昼夜不停地保养这艘船，\n　　现在能够被%a002030大人乘坐。\n@c0@"
  tl: "@a@b＊：我們晝夜不停地保養這艘船，\n　　現在能夠被%a002030大人乘坐。\n@c0@"
149:
  en: "@a@b*: It makes all those years we worked on keeping it seaworthy worthwhile!\n@c0@"
  ja: "@a@b＊「こんな　うれしいことは\n\tありません。\n@c0@"
  ko: "@a@b장로: 그래 어찌 되었느냐?\n@c0@"
  sl: "@a@b＊：这真是太让人激动了。\n@c0@"
  tl: "@a@b＊：這真是太讓人激動了。\n@c0@"
150:
  en: "@a%0%a002020@bYou got it! ...㈢㈢Sorry to drop out like this.\n@c0@"
  ja: "@a@b%a002020「うんっ！\n\t……㈢㈢　わがまま言って\n\tごめんね。\n@c0@"
  ko: "@a@b---점프---> #014355로\n@c0@"
  sl: "@a@b%a002020：嗯！\n　　……㈢㈢我太任性了，\n　　真对不起。\n@c0@"
  tl: "@a@b%a002020：嗯！\n　　……㈢㈢我太任性了，\n　　真對不起。\n@c0@"
151:
  en: "@a%0%a002020@bOh, by the way, do you want me to put my gear in the bag for you?\n@c0@"
  ja: "@a@b%a002020「あっ　そうだ。　あたしの\n\tにもつを　%a001400に　入れて\n\t持っていく？\n@c0@"
  ko: "@a@b*: 신의 배가 드디어\n출항했습니다.\n@c0@"
  sl: "@a@b%a002020：啊，对了。\n　　我身上的东西\n　　要不要放进%a001400？\n@c0@"
  tl: "@a@b%a002020：啊，對了。\n　　我身上的東西\n　　要不要放進%a001400？\n@c0@"
152:
  en: "@a%0%a002020@bOkay, you got it.\n@c0@"
  ja: "@a@b%a002020「じゃあ　入れておくね。\n@c0@"
  ko: "@a@b*: 우리가 관리해온 배에\n%a002030 님이 타신다니.\n@c0@"
  sl: "@a@b%a002020：那我放进去喽。\n@c0@"
  tl: "@a@b%a002020：那我放進去嘍。\n@c0@"
153:
  en: "@a%0%a002020@bOkay, I'll keep all my stuff, then.\n@c0@"
  ja: "@a@b%a002020「じゃあ　このまま\n\tあたしが　持っておくね。\n@c0@"
  ko: "@a@b*: 더 이상 기쁠 수는\n없습니다.\n@c0@"
  sl: "@a@b%a002020：那就留在我这里咯。\n@c0@"
  tl: "@a@b%a002020：那就留在我這裡咯。\n@c0@"
154:
  en: "@aElder@bThe destiny that lies before you is no ordinary one. The power of the Goddess is with you!\n@c0@"
  ja: "@a@b長老「わしは　信じているぞ。\n\t%a002030に　神のチカラが　やどり……\n@c0@"
  ko: "@a@b%a002020: 응!\n......㈢㈢제멋대로 굴어서\n미안.\n@c0@"
  sl: "@a@b长老：我相信你们。\n　　%a002030身上有神的力量……\n@c0@"
  tl: "@a@b長老：我相信你們。\n　　%a002030身上有神的力量……\n@c0@"
155:
  en: "@aElder@bI have an unshakeable faith that you will one day prevail, and return to Ghent victorious.\n@c0@"
  ja: "@a@b長老「いつの日か　おまえたちが\n\t魔王ムドーを　たおすことをな。\n@c0@"
  ko: "@a@b%a002020: 아참, 깜빡했네.\n내 짐은 %a001400에\n넣어갈 거야?\n@c0@"
  sl: "@a@b长老：总有一天，\n　　你们一定能打倒姆多。\n@c0@"
  tl: "@a@b長老：總有一天，\n　　你們一定能打倒姆多。\n@c0@"
156:
  en: "@a@b*: Not familiar with the concept of private property, hey? This is my house, and I'd like you out of it. \n@c0@"
  ja: "@a@b＊「なんだ　あんたらは？\n\tここは　わしの家なんだぜ。\n\t出ていってくれ。\n@c0@"
  ko: "@a@b%a002020: 그럼, 넣어둘게.\n@c0@"
  sl: "@a@b＊：你们是谁啊？\n　　这里是我的家。\n　　赶快出去。\n@c0@"
  tl: "@a@b＊：你們是誰啊？\n　　這裡是我的家。\n　　趕快出去。\n@c0@"
157:
  en: "@a@b*: If you're lost, head north-west of here and you'll find yourself back on Somnian soil soon enough.\n@c0@"
  ja: "@a@b＊「道に　迷ったって　言うなら\n\t北西へ　行けば　レイドックの国へ\n\t出るぞ。\n@c0@"
  ko: "@a@b%a002020: 그럼, 이대로\n내가 가지고 있을게.\n@c0@"
  sl: "@a@b＊：迷路了？\n　　向西北走就是雷多克王国。\n　　出去吧。\n@c0@"
  tl: "@a@b＊：迷路了？\n　　向西北走就是雷多克王國。\n　　出去吧。\n@c0@"
158:
  en: "@a@bThere's no response. It's just a corpse.\n@c0@"
  ja: "@a@b返事がない。\nただの　しかばねの　ようだ……。\n@c0@"
  ko: "@a@b장로: 나는 믿고 있다네.\n%a002030에게 신의 힘이 깃들어......\n@c0@"
  sl: "@a@b没有回应。\n看来只是一具尸体……\n@c0@"
  tl: "@a@b沒有回應。\n看來只是一具屍體……\n@c0@"
159:
  en: "@a@bThere's no response. It's just a corpse.\n@c0@"
  ja: "@a@b返事がない。\nただの　しかばねの　ようだ……。\n@c0@"
  ko: "@a@b장로: 언젠가 자네들이\n마왕 무도를 해치울 거라고 말일세.\n@c0@"
  sl: "@a@b没有回应。\n看来只是一具尸体……\n@c0@"
  tl: "@a@b沒有回應。\n看來只是一具屍體……\n@c0@"
160:
  en: "@a@bThere's a message scrawled into the dirt beside it...\n@c0@"
  ja: "@a@bしかし　まわりの土に　なにやら\n文字が　書かれている。\n@c0@"
  ko: "@a@b*: 뭐냐 너희들은?\n여긴 내 집이다.\n어서 나가 줘.\n@c0@"
  sl: "@a@b但是，旁边的地上\n有一行字迹。\n@c0@"
  tl: "@a@b但是，旁邊的地上\n有一行字跡。\n@c0@"
161:
  en: "@a@b‘May the Goddess protect you, my prince...’\n@c0@"
  ja: "@a@b『王子さま　どうか　ご無事で』\n@c0@"
  ko: "@a@b*: 길을 잃은 거라면\n북서쪽으로 가면 레이독 왕국이\n나올 거다.\n@c0@"
  sl: "@a@b“王子殿下，愿您平安。”\n@c0@"
  tl: "@a@b“王子殿下，願您平安。”\n@c0@"
162:
  en: "@a%0%a002030@bTh-This is uncanny... There is something sacred about this place... I sense the Goddess watching over us...\n@c0@"
  ja: "@a@b%a002030「ふしぎなことですが\n\tここには　聖なるチカラを\n\t感じます。\n@c0@"
  ko: "@a@b반응이 없다.\n그냥 시체인 것 같다......\n@c0@"
  sl: "@a@b%a002030：我感觉到\n　　这里有一股神圣的力量，\n　　真不可思议。\n@c0@"
  tl: "@a@b%a002030：我感覺到\n　　這裡有一股神聖的力量，\n　　真不可思議。\n@c0@"
163:
  en: "@a%0%a002030@bWe must rest here tonight, under Her watchful and most merciful gaze.\n@c0@"
  ja: "@a@b%a002030「今日は　ここで\n\tひと休みすることに　しましょう。\n@c0@"
  ko: "@a@b반응이 없다.\n그냥 시체인 것 같다......\n@c0@"
  sl: "@a@b%a002030：今天我们就在这里休息一下吧。\n@c0@"
  tl: "@a@b%a002030：今天我們就在這裡休息一下吧。\n@c0@"
164:
  en: "@a@b%0%a000140 and the others sense that there is something sacred about this place.\n@c0@"
  ja: "@a@bふしぎなことに　%a000140たちは\nこの場所に　聖なるチカラを　感じた。\n@c0@"
  ko: "@a@b그런데 주위의 땅에 뭔가\n글자가 적혀 있다.\n@c0@"
  sl: "@a@b不可思议的是，%a000140一行\n在这里感到了神圣的力量。\n@c0@"
  tl: "@a@b不可思議的是，%a000140一行\n在這裡感到了神聖的力量。\n@c0@"
165:
  en: "@a@b%0%a000140 and the others decide to rest here tonight.\n@c0@"
  ja: "@a@b%a000140たちは　この場所で\nひとときの休そくを　とることにした。\n@c0@"
  ko: "@a@b''왕자님, 부디 무사하시길''\n@c0@"
  sl: "@a@b%a000140一行决定\n就在这里休息一下。\n@c0@"
  tl: "@a@b%a000140一行決定\n就在這裡休息一下。\n@c0@"
166:
  en: "@a%0%a002010@bTrouble sleeping?\n@c0@"
  ja: "@a@b%a002010「あら？　もう　目がさめた？\n\tあまり　ねむれなかったのかしら？\n@c0@"
  ko: "@a@b%a002030: 신기하게도\n이곳에는 성스러운 힘이\n느껴집니다.\n@c0@"
  sl: "@a@b%a002010：咦？你醒了？\n　　睡得不踏实吗？\n@c0@"
  tl: "@a@b%a002010：咦？你醒了？\n　　睡得不踏實嗎？\n@c0@"
167:
  en: "@a%0%a002010@bWell, that's a relief. You looked restless. I sensed that your dreams were not tranquil ones...\n@c0@"
  ja: "@a@b%a002010「それなら　いいのだけど。\n\tちょっと　うなされていた\n\tみたいだから。\n@c0@"
  ko: "@a@b%a002030: 오늘은 여기서\n하룻밤 묵도록 합시다.\n@c0@"
  sl: "@a@b%a002010：那就好。\n　　因为看你的样子，\n　　刚才似乎在做噩梦。\n@c0@"
  tl: "@a@b%a002010：那就好。\n　　因為看你的樣子，\n　　剛才似乎在做噩夢。\n@c0@"
168:
  en: "@a%0%a002010@bIt's only natural. The time is almost at hand, after all.\n@c0@"
  ja: "@a@b%a002010「無理もないわね。\n\tいよいよ　ですものね。\n@c0@"
  ko: "@a@b신기하게도 %a000140 일행은\n이곳에서 성스러운 힘을 느꼈다.\n@c0@"
  sl: "@a@b%a002010：这也难怪啊。\n　　马上就是关键时刻了。\n@c0@"
  tl: "@a@b%a002010：這也難怪啊。\n　　馬上就是關鍵時刻了。\n@c0@"
169:
  en: "@a%0%a002010@bNow, where did that muscle-bound lump get to? He went to check the path ahead, but that was some time ago...\n@c0@"
  ja: "@a@b%a002010「ところで　彼　どこまで\n\t見にいったのかしら……。\n\tずいぶん　おそいようだけど。\n@c0@"
  ko: "@a@b%a000140 일행은 이곳에서\n잠깐 휴식을 취하기로 했다.\n@c0@"
  sl: "@a@b%a002010：也不知道他\n　　到哪里打探去了……\n　　这么久还不回来。\n@c0@"
  tl: "@a@b%a002010：也不知道他\n　　到哪裡打探去了……\n　　這麼久還不回來。\n@c0@"
170:
  en: "@a%0%a002000@bAhoy! Are you three done sawin' logs?\n@c0@"
  ja: "@a@b%a002000「おっ！　３人とも　もう\n\t起きていたか！\n@c0@"
  ko: "@a@b%a002010: 어머? 벌써 일어났어?\n편히 못 잤나 봐?\n@c0@"
  sl: "@a@b%a002000：哦！你们仨都起来啦！\n@c0@"
  tl: "@a@b%a002000：哦！你們仨都起來啦！\n@c0@"
171:
  en: "@a%0%a002000@bI was out scoutin'. Ain't no doubt about it — this is definitely the place, but...\n@c0@"
  ja: "@a@b%a002000「ちょっと　まわりを見てきたが\n\tやっぱ　あの城に\n\tまちがいなさそうだぜ。　しかし……。\n@c0@"
  ko: "@a@b---점프---> #014721로\n@c0@"
  sl: "@a@b%a002000：俺刚才去周围转了一圈，\n　　就是那座城堡，\n　　应该不会错了。不过……\n@c0@"
  tl: "@a@b%a002000：俺剛才去周圍轉了一圈，\n　　就是那座城堡，\n　　應該不會錯了。不過……\n@c0@"
172:
  en: "@a%0%a002030@bBut what? You look somewhat puzzled. What is it?\n@c0@"
  ja: "@a@b%a002030「どうしたのですか？\n\tなにか　気になることでも？\n@c0@"
  ko: "@a@b%a002010: 그럼 다행이지만\n가위 눌린 것처럼\n보였거든.\n@c0@"
  sl: "@a@b%a002030：你怎么了？\n　　有什么不对劲吗？\n@c0@"
  tl: "@a@b%a002030：你怎麼了？\n　　有什麼不對勁嗎？\n@c0@"
173:
  en: "@a%0%a002000@bI dunno... I can't shake the feelin' that we've been down this road before.\n@c0@"
  ja: "@a@b%a002000「ずっと　まえにも\n\tこんなことが　あったような……。\n@c0@"
  ko: "@a@b%a002010: 이해해.\n이제 곧이니까.\n@c0@"
  sl: "@a@b%a002000：俺总觉得，\n　　以前好像来过这里……\n@c0@"
  tl: "@a@b%a002000：俺總覺得，\n　　以前好像來過這裡……\n@c0@"
174:
  en: "@a%0%a002000@bBah, no point frettin' over it, though. You get enough rest? It's high time we shoved off.\n@c0@"
  ja: "@a@b%a002000「考えてても　しょうがないや。\n\tさて　そろそろ　行かないか？\n\tもう　じゅうぶんに休んだだろ。\n@c0@"
  ko: "@a@b%a002010: 그런데 그는 어디까지\n보러 간 거람......\n좀 늦는 것 같은데.\n@c0@"
  sl: "@a@b%a002000：算了，想多了也没用。\n　　那咱们现在就走吧？\n　　休息得也差不多了。\n@c0@"
  tl: "@a@b%a002000：算了，想多了也沒用。\n　　那咱們現在就走吧？\n　　休息得也差不多了。\n@c0@"
175:
  en: "@a%0%a002010@bHe's right. We've nothing to gain from dallying here.\n@c0@"
  ja: "@a@b%a002010「そうね。　こうしてても\n\tはじまらないわ。\n@c0@"
  ko: "@a@b%a002000: 앗! 셋 다 벌써\n일어났군!\n@c0@"
  sl: "@a@b%a002010：嗯，再耽搁下去\n　　我怕夜长梦多。\n@c0@"
  tl: "@a@b%a002010：嗯，再耽擱下去\n　　我怕夜長夢多。\n@c0@"
176:
  en: "@a%0%a002030@bBy the grace of the Goddess, we have made our way here from afar. Now our goal is in sight. We must press on.\n@c0@"
  ja: "@a@b%a002030「そうですね。　そのために\n\t今まで　ずいぶん長い旅を\n\tしてきたことでしょうから。\n@c0@"
  ko: "@a@b%a002000: 근방을 잠시 둘러봤는데\n역시 그 성이\n틀림없는 것 같아. 그런데......\n@c0@"
  sl: "@a@b%a002030：说得没错。\n　　我们旅行了这么久，\n　　不都是为了这个目标么。\n@c0@"
  tl: "@a@b%a002030：說得沒錯。\n　　我們旅行了這麼久，\n　　不都是為了這個目標麼。\n@c0@"
177:
  en: "@a%0%a002000@bLet's do this, %a000090! The Dread Fiend ain't gonna defeat himself!\n@c0@"
  ja: "@a@b%a002000「行くぜ　%a000090！\n\t相手は　魔王ムドーだ！\n\t死んだ気で　戦おうぜ！\n@c0@"
  ko: "@a@b%a002030: 왜 그러십니까?\n뭐 마음에 걸리는 거라도?\n@c0@"
  sl: "@a@b%a002000：走了%a000090！\n　　敌人是大魔王！\n　　咱们要背水一战！\n@c0@"
  tl: "@a@b%a002000：走了%a000090！\n　　敵人是大魔王！\n　　咱們要背水一戰！\n@c0@"
178:
  en: "@a%0%a002010@bThe fate of the world rests on this battle. If we can emerge victorious, peace will be restored.\n@c0@"
  ja: "@a@b%a002010「もし　この戦いに勝てば\n\t世界に　平和が　おとずれるはずよ。\n@c0@"
  ko: "@a@b%a002000: 분명 예전에도\n이런 일이 있었던 것 같은데......\n@c0@"
  sl: "@a@b%a002010：这一战如果赢了，\n　　世界就会和平了吧。\n@c0@"
  tl: "@a@b%a002010：這一戰如果贏了，\n　　世界就會和平了吧。\n@c0@"
179:
  en: "@a%0%a002010@bWe're as ready as we'll ever be. Come, %a000090. We must go.\n@c0@"
  ja: "@a@b%a002010「準備は　いいわね　%a000090？\n\tさあ　行きましょう。\n@c0@"
  ko: "@a@b%a002000: 생각해 봤자 소용없겠지.\n그럼 슬슬 출발해 볼까?\n이제 쉴 만큼 쉬었으니까.\n@c0@"
  sl: "@a@b%a002010：%a000090你准备好了吗？\n　　我们这就出发吧。\n@c0@"
  tl: "@a@b%a002010：%a000090你準備好了嗎？\n　　我們這就出發吧。\n@c0@"
180:
  en: "@a%0%a002030@bYou seem troubled. Do you too feel that you...know this place already?\n@c0@"
  ja: "@a@b%a002030「どうかしたのですか？\n\tまさか　%a000090さんも\n\tこの場所に　おぼえがあるとか？\n@c0@"
  ko: "@a@b%a002010: 그래. 이러고 있어 봤자\n별 수 없잖아.\n@c0@"
  sl: "@a@b%a002030：怎么了？\n　　难道%a000090你也\n　　记得这个场景吗？\n@c0@"
  tl: "@a@b%a002030：怎麼了？\n　　難道%a000090你也\n　　記得這個場景嗎？\n@c0@"
181:
  en: "@a%0%a002030@bIt is puzzling, but perhaps it is not our place to understand. Only the Goddess knows the truth.\n@c0@"
  ja: "@a@b%a002030「そうなのですか。\n\tふしぎなことも　あるものですね。\n@c0@"
  ko: "@a@b%a002030: 그래요. 그러기 위해서\n지금까지 오랜 여행을\n해 왔으니까요.\n@c0@"
  sl: "@a@b%a002030：真的是这样吗？\n　　竟然会有这样奇怪的事情……\n@c0@"
  tl: "@a@b%a002030：真的是這樣嗎？\n　　竟然會有這樣奇怪的事情……\n@c0@"
182:
  en: "@a%0%a002030@bOf course. There is no way we could have been here before.\n@c0@"
  ja: "@a@b%a002030「そうですよね。\n\tそんなことが　あるわけ\n\tないでしょうから。\n@c0@"
  ko: "@a@b%a002000: 출발하자, %a000090!\n상대는 마왕 무도다!\n죽을 힘을 다해 싸워 보자고!\n@c0@"
  sl: "@a@b%a002030：我就说嘛。\n　　怎么会有这样的怪事。\n@c0@"
  tl: "@a@b%a002030：我就說嘛。\n　　怎麼會有這樣的怪事。\n@c0@"
183:
  en: "@a%0%a002030@bWell, we had better go. Our destiny awaits us.\n@c0@"
  ja: "@a@b%a002030「さて　私たちも\n\tまいりましょう。\n@c0@"
  ko: "@a@b%a002010: 만약 이 싸움에서 이긴다면\n세계에 평화가 찾아올 거야.\n@c0@"
  sl: "@a@b%a002030：总之，我们还是先走吧。\n@c0@"
  tl: "@a@b%a002030：總之，我們還是先走吧。\n@c0@"
184:
  en: "@a@bThe campfire is burning brightly. Put it out?\n@c0@"
  ja: "@a@bたき火が　もえさかっている。\n消していきますか？\n@c0@"
  ko: "@a@b%a002010: 준비됐지, %a000090?\n자, 어서 가자.\n@c0@"
  sl: "@a@b篝火在静静地燃烧。\n要熄灭它吗？\n@c0@"
  tl: "@a@b篝火在靜靜地燃燒。\n要熄滅它嗎？\n@c0@"
185:
  en: "@a%0%a002030@bMurdaw's keep awaits us at the bottom of this precipice. But how do we descend safely...?\n@c0@"
  ja: "@a@b%a002030「どうやら　このガケの下が\n\tムドーの居城のようです。\n\tしかし　どうやって　あそこまで……。\n@c0@"
  ko: "@a@b%a002030: 왜 그러십니까?\n설마 %a000090 님도\n이곳이 기억에 있다던가?\n@c0@"
  sl: "@a@b%a002030：看起来，\n　　悬崖下面就是姆多的城堡。\n　　但是怎么才能过去呢……\n@c0@"
  tl: "@a@b%a002030：看起來，\n　　懸崖下面就是姆多的城堡。\n　　但是怎麼才能過去呢……\n@c0@"
186:
  en: "@a%0%a002000@bI feel like I been here before... Maybe it's dayla view... Uh, déjà brew... Er, my imagination?\n@c0@"
  ja: "@a@b%a002000「うーむ……。\n\tやっぱり　こんなことが前にも……。\n@c0@"
  ko: "@a@b%a002030: 그렇군요.\n참 신기한 일도 다 있네요.\n@c0@"
  sl: "@a@b%a002000：嗯……\n　　果然，这样的场景以前也……\n@c0@"
  tl: "@a@b%a002000：嗯……\n　　果然，這樣的場景以前也……\n@c0@"
187:
  en: "@a%0%a002000@bBah! I'm through with thinkin'! I got more important stuff to worry about right now!\n@c0@"
  ja: "@a@b%a002000「くそっ！　こんなときに\n\tいったい　オレの頭は\n\tどうなっちまったんだ！\n@c0@"
  ko: "@a@b---점프---> #014747로\n@c0@"
  sl: "@a@b%a002000：哇呀！\n　　在这种要命的时候，\n　　俺到底在想些啥啊！\n@c0@"
  tl: "@a@b%a002000：哇呀！\n　　在這種要命的時候，\n　　俺到底在想些啥啊！\n@c0@"
188:
  en: "@a%0%a002010@bThe final leg of our journey awaits.\n@c0@"
  ja: "@a@b%a002010「いよいよですね……。\n@c0@"
  ko: "@a@b%a002030: 그렇겠지요.\n그런 일이 있을 리\n없으니까요.\n@c0@"
  sl: "@a@b%a002010：终于要面对他了……\n@c0@"
  tl: "@a@b%a002010：終於要面對他了……\n@c0@"
189:
  en: "@a%0%a002010@bIf the legends are true, all that remains is to play this ocarina.\n@c0@"
  ja: "@a@b%a002010「この笛を吹けば\n\t私たちは　魔王ムドーの城に\n\tはこばれてゆくでしょう。\n@c0@"
  ko: "@a@b%a002030: 자 그럼,\n우리도 갑시다.\n@c0@"
  sl: "@a@b%a002010：我吹响这支笛子，\n　　我们就能到达姆多的城堡了。\n@c0@"
  tl: "@a@b%a002010：我吹響這隻笛子，\n　　我們就能到達姆多的城堡了。\n@c0@"
190:
  en: "@a%0%a002010@bYes, just like before...\n@c0@"
  ja: "@a@b%a002010「そう。　あの時のように……。\n@c0@"
  ko: "@a@b모닥불이 타오르고 있다.\n끄고 가시겠습니까?\n@c0@"
  sl: "@a@b%a002010：没错。就像那次一样……\n@c0@"
  tl: "@a@b%a002010：沒錯。就像那次一樣……\n@c0@"
191:
  en: "@a%0%a002010@bWell, here goes nothing...\n@c0@"
  ja: "@a@b%a002010「さあ　吹くわよ。\n@c0@"
  ko: "@a@b%a002030: 아무래도 이 절벽 아래에\n무도의 성이 있는 것 같습니다.\n그나저나 어떻게 저기까지......\n@c0@"
  sl: "@a@b%a002010：我要吹了。\n@c0@"
  tl: "@a@b%a002010：我要吹了。\n@c0@"
192:
  en: "@a@bThe door is locked, and it doesn't look like any of the keys in %H0860%X%a000120%Ythe party%Z's possession will open it.\n@c0@"
  ja: "@a@bトビラには　カギが　かかっている！\nもっているカギでは　あけられなかった。\n@c0@"
  ko: "@a@b%a002000: 으음......\n역시 전에도 이 비슷한 일이......\n@c0@"
  sl: "@a@b门上着锁！\n现有的钥匙似乎无法打开它。\n@c0@"
  tl: "@a@b門上著鎖！\n現有的鑰匙似乎無法打開它。\n@c0@"
193:
  en: "@a%0%a002010@bIt seems we've no other choice but to keep moving forward. Lead the way, %a000090.\n@c0@"
  ja: "@a@b%a002010「ここまで来たら\n\t前にすすむしか　なさそうね。\n\t%a000090　先にいって。\n@c0@"
  ko: "@a@b%a002000: 빌어먹을! 이런 때\n도대체 내 머리는\n어떻게 돼 버린 거야!\n@c0@"
  sl: "@a@b%a002010：事到如今，\n　　我们只有前进这一条路了。\n　　%a000090你先走吧。\n@c0@"
  tl: "@a@b%a002010：事到如今，\n　　我們只有前進這一條路了。\n　　%a000090你先走吧。\n@c0@"
194:
  en: "@a%0%a002000@bAvast! What's the matter with this door? It's the only one in the joint with no keyhole...\n@c0@"
  ja: "@a@b%a002000「だめだ！　このトビラだけは\n\tカギあなが　見えねえ……。\n@c0@"
  ko: "@a@b%a002010: 드디어 때가 왔어......\n@c0@"
  sl: "@a@b%a002000：不行！\n　　这扇门上没有钥匙孔。\n@c0@"
  tl: "@a@b%a002000：不行！\n　　這扇門上沒有鑰匙孔。\n@c0@"
195:
  en: "@a%0%a002000@bI smell a trick, aye. Maybe we gotta beat Murdaw to break the illusion or somethin'...\n@c0@"
  ja: "@a@b%a002000「これが　もし　まやかしなら\n\tムドーと　戦って　まやかしを\n\tやぶるしか　なさそうだぜ。\n@c0@"
  ko: "@a@b%a002010: 이 피리를 불면\n우리는 마왕 무도의 성으로\n가게 될 거야.\n@c0@"
  sl: "@a@b%a002000：如果这是陷阱，\n　　咱们就只有与姆多战斗，\n　　才能打破这个陷阱了。\n@c0@"
  tl: "@a@b%a002000：如果這是陷阱，\n　　咱們就只有與姆多戰鬥，\n　　才能打破這個陷阱了。\n@c0@"
196:
  en: "@a%0%a002030@bOnly the Goddess knows what perils lie ahead. For our protection, I will place a sacred barrier here.\n@c0@"
  ja: "@a@b%a002030「もしもの時のために\n\tここに結界を作っておきましょう。\n@c0@"
  ko: "@a@b%a002010: 그래. 그때처럼......\n@c0@"
  sl: "@a@b%a002030：以防万一，\n　　我在这里设置结界吧。\n@c0@"
  tl: "@a@b%a002030：以防萬一，\n　　我在這裡設置結界吧。\n@c0@"
197:
  en: "@a@b%0%a002030 closes his eyes and mouths a silent prayer...\n@c0@"
  ja: "@a@b%a002030は　目をとじて\nなにやら　いのりはじめた。\n@c0@"
  ko: "@a@b%a002010: 자, 그럼 피리를 불게.\n@c0@"
  sl: "@a@b%a002030闭上眼睛\n默默地祈祷。\n@c0@"
  tl: "@a@b%a002030閉上眼睛\n默默地祈禱。\n@c0@"
198:
  en: "@a%0%a002030@bThere. Now whatever may befall us, we will always be able to return to this location.\n@c0@"
  ja: "@a@b%a002030「これで　なにかあっても\n\tふたたび　この場所に\n\tもどってこられるはずです。\n@c0@"
  ko: "@a@b문은 잠겨 있다!\n가지고 있는 열쇠로는 열리지 않았다.\n@c0@"
  sl: "@a@b%a002030：好了，如果有什么不测，\n　　我们还能再次回到这个结界。\n@c0@"
  tl: "@a@b%a002030：好了，如果有什麼不測，\n　　我們還能再次回到這個結界。\n@c0@"
199:
  en: "@a%0%a002000@bIt... ㈢㈢It looks like...m-me!\n@c0@"
  ja: "@a@b%a002000「こ　こ　これは\n\tも　も㈢㈢　もしかして\n\tオレじゃねえのかっ！？\n@c0@"
  ko: "@a@b%a002010: 여기까지 온 이상\n계속 갈 수밖에 없겠어.\n%a000090, 앞장서.\n@c0@"
  sl: "@a@b%a002000：这、这是，\n　　莫㈢㈢，莫非\n　　这是俺？！\n@c0@"
  tl: "@a@b%a002000：這、這是，\n　　莫㈢㈢，莫非\n　　這是俺？！\n@c0@"
200:
  en: "@a%0%a002000@bI-Is he dead? He sure ain't movin'.\n@c0@"
  ja: "@a@b%a002000「けど　うごいてねえぞ。\n\t死んでるのか？\n@c0@"
  ko: "@a@b%a002000: 소용없어! 이 문은\n열쇠 구멍이 안 보여......\n@c0@"
  sl: "@a@b%a002000：不过好像没动。\n　　是死了吗？\n@c0@"
  tl: "@a@b%a002000：不過好像沒動。\n　　是死了嗎？\n@c0@"
201:
  en: "@a%0%a002000@bNo. No, he ain't dead — just sleepin' like the dead.\n@c0@"
  ja: "@a@b%a002000「ちがうな……。\n\t死んだように　ねてるだけだ……。\n@c0@"
  ko: "@a@b%a002000: 이게 만약 속임수라면\n무도와 싸워 허상을\n깨부술 수밖에 없겠군.\n@c0@"
  sl: "@a@b%a002000：不对……\n　　好像是睡死过去了……\n@c0@"
  tl: "@a@b%a002000：不對……\n　　好像是睡死過去了……\n@c0@"
202:
  en: "@a%0%a002000@bBut why's there a double o' me in this joint? Here, of all places?\n@c0@"
  ja: "@a@b%a002000「でもよ　どうして\n\tオレが　ふたりも　いるんだ？\n\tそれも　こんなところによ……。\n@c0@"
  ko: "@a@b%a002030: 만일을 대비해서\n이곳에 결계를 만들어 둡시다.\n@c0@"
  sl: "@a@b%a002000：先不管这个，\n　　为什么有两个俺？\n　　还有为什么会在这里……\n@c0@"
  tl: "@a@b%a002000：先不管這個，\n　　為什麼有兩個俺？\n　　還有為什麼會在這裡……\n@c0@"
203:
  en: "@a%0%a002000@bWait... Huh?\n@c0@"
  ja: "@a@b%a002000「ん？\n@c0@"
  ko: "@a@b%a002030%F2030%X는%Y은%Z 눈을 감고\n무언가 기도하기 시작했다.\n@c0@"
  sl: "@a@b%a002000：嗯？\n@c0@"
  tl: "@a@b%a002000：嗯？\n@c0@"
204:
  en: "@a%0%a002000@bWh-What's happenin' to...\n@c0@"
  ja: "@a@b%a002000「なんだ　なんだ？\n@c0@"
  ko: "@a@b%a002030: 이제 무슨 일이 생겨도\n이곳으로 다시\n돌아올 수 있을 겁니다.\n@c0@"
  sl: "@a@b%a002000：咋回事咋回事？\n@c0@"
  tl: "@a@b%a002000：咋回事咋回事？\n@c0@"
205:
  en: "@a%0%a002000 @bWhat's goin' on here!? Crikey, hold on! It's all floodin' back to me...\n@c0@"
  ja: "@a@b%a002000「思い出したぞっ！\n\t今　すべてを　思い出したぜ！\n@c0@"
  ko: "@a@b%a002000: 이, 이건\n호, ㈢㈢혹시\n나 아니냐!?\n@c0@"
  sl: "@a@b%a002000：俺想起来了！\n　　现在全都想起来了！\n@c0@"
  tl: "@a@b%a002000：俺想起來了！\n　　現在全都想起來了！\n@c0@"
206:
  en: "@a%0%a002000 @bThe name's %a002000. I'm a carpenter's son from Port Haven. Best in the business too!\n@c0@"
  ja: "@a@b%a002000「オレは　たしかに\n\tサンマリーノの大工の息子\n\t%a002000だ！\n@c0@"
  ko: "@a@b%a002000: 그런데 움직이질 않아.\n죽은 걸까?\n@c0@"
  sl: "@a@b%a002000：俺的确是圣马力诺的\n　　木工的儿子，\n　　%a002000！\n@c0@"
  tl: "@a@b%a002000：俺的確是聖馬力諾的\n　　木工的兒子，\n　　%a002000！\n@c0@"
207:
  en: "@a%0%a002000 @bAnyway, that dreary town wasn't really floatin' my boat, so I left home.\n@c0@"
  ja: "@a@b%a002000「けど　それがイヤで\n\t家をとびだして　%a000090たちと\n\t知り合ったんだったよな！\n@c0@"
  ko: "@a@b%a002000: 아니군......\n죽은 듯 잠들어 있을 뿐이야......\n@c0@"
  sl: "@a@b%a002000：但是俺讨厌做木工，\n　　就从家里跑出来了，\n　　还认识了%a000090你们几个！\n@c0@"
  tl: "@a@b%a002000：但是俺討厭做木工，\n　　就從家裡跑出來了，\n　　還認識了%a000090你們幾個！\n@c0@"
208:
  en: "@a%0%a002000 @bAnd that's when I fell in with %a000090...\n@c0@"
  ja: "@a@b%a002000「それで……。\n@c0@"
  ko: "@a@b%a002000: 그래도 그렇지, 어떻게\n내가 둘이나 존재하지?\n게다가 이런 곳에 말이야......\n@c0@"
  sl: "@a@b%a002000：然后……\n@c0@"
  tl: "@a@b%a002000：然後……\n@c0@"
209:
  en: "@a%0%a002000 @bWe came here to face Murdaw. To show him what for 'n' everything like that.\n@c0@"
  ja: "@a@b%a002000「そうだよ！\n\tムドーに戦いを　いどんだは\n\tいいけどよ……。\n@c0@"
  ko: "@a@b%a002000: 으음?\n@c0@"
  sl: "@a@b%a002000：对了！\n　　俺向姆多发起进攻……\n@c0@"
  tl: "@a@b%a002000：對了！\n　　俺向姆多發起進攻……\n@c0@"
210:
  en: "@a%0%a002000 @bBut as you hardly need remindin', Murdaw clobbered us and turned us to stone. My spirit got sent straight to the dream world.\n@c0@"
  ja: "@a@b%a002000「やつの　じゅつにかかって\n\tオレは　心だけが　夢の世界に\n\tとばされちまったんだ。\n@c0@"
  ko: "@a@b%a002000: 뭐지, 뭐야?\n@c0@"
  sl: "@a@b%a002000：但是中了他的魔法，\n　　然后俺的意识\n　　就飘到了梦世界。\n@c0@"
  tl: "@a@b%a002000：但是中了他的魔法，\n　　然後俺的意識\n　　就飄到了夢世界。\n@c0@"
211:
  en: "@a%0%a002000 @bI became what I always was in my dreams — a roamin' warrior with a nose for adventure...\n@c0@"
  ja: "@a@b%a002000「そこでは　オレは\n\t旅のぶとう家で……。\n@c0@"
  ko: "@a@b%a002000: 생각났어!\n지금 모든 게 기억났어!\n@c0@"
  sl: "@a@b%a002000：到了梦世界，\n　　俺变成了旅行的武术家……\n@c0@"
  tl: "@a@b%a002000：到了夢世界，\n　　俺變成了旅行的武術家……\n@c0@"
212:
  en: "@a%0%a002000 @bBut listen to me ramblin' on about my life and times! I'm sure you get the gist...\n@c0@"
