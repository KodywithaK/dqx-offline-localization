  tl: "@a@b%a002030：各位，我們走吧。\n　　神之船就在村子盡頭的神殿裡。\n@c0@"
85:
  en: "@aElder@bGo %a002030! Fulfil your divine destiny! All of our prayers go with you.\n@c0@"
  ja: "@a@b長老「%a002030を　たのみましたぞ！\n@c0@"
