  sl: "@a@b＊：长老非常疼爱%a002030。\n@c0@"
  tl: "@a@b＊：長老非常疼愛%a002030。\n@c0@"
87:
  en: "@a@b*: Blessed %a002030, the chosen one! You have come!\n@c0@"
  ja: "@a@b＊「ややっ　これは　%a002030さま！\n@c0@"
  ko: "@a@b장로: %a002030%F2030%X를%Y을%Z 잘 부탁하네!\n@c0@"
  sl: "@a@b＊：哎呀，这不是%a002030大人吗！\n@c0@"
  tl: "@a@b＊：哎呀，這不是%a002030大人嗎！\n@c0@"
88:
  en: "@a@b*: You say the seal must be broken and the Providence must take to the seas again?\n@c0@"
