  sl: "@a@b长老：%a002030就交给你们了！\n@c0@"
  tl: "@a@b長老：%a002030就交給你們了！\n@c0@"
86:
  en: "@a@b*: Our Elder always told %a002030 that he was destined to walk a different path from us regular folks.\n@c0@"
  ja: "@a@b＊「長老さまは　%a002030さまを\n\tとっても　かわいがっていますのよ。\n@c0@"
