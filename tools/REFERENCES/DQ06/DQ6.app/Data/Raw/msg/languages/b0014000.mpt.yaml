  sl: "@a@b%a002030：走吧，我们进去。\n@c0@"
  tl: "@a@b%a002030：走吧，我們進去。\n@c0@"
91:
  en: "@a@b*: So it is time for the ship's seal to be broken? Please proceed. May the Goddess sail with you!\n@c0@"
  ja: "@a@b＊「ついに　神の船の封印を\n\tとかれるのですね。\n\tさあ　どうぞ　なかへ。\n@c0@"
  ko: "@a@b*: 알겠습니다.\n자, 어서 신전으로 드시죠.\n@c0@"
