  sl: "@a@b%a002030：准备好了吗？\n@c0@"
  tl: "@a@b%a002030：準備好了嗎？\n@c0@"
98:
  en: "@a%0%a002030@bIn that case, I shall await your return here. May the Goddess walk beside you!\n@c0@"
