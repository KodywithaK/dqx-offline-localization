0:
  en: "@a@b*: We have received orders from King Somnus to allow you to pass. Mind how you go!\n@c0@"
  ja: "@a@b＊「レイドック王より　すでに\n\t伝令を　うけています。\n\tどうか　お気をつけて。\n@c0@"
  ko: "@a@b*: 레이독 왕의 전령을\n받았습니다.\n부디 몸조심하십시오.\n@c0@"
  sl: "@a@b＊：我们已经接到了\n　　雷多克王的命令。\n　　请您一定要小心。\n@c0@"
  tl: "@a@b＊：我們已經接到了\n　　雷多克王的命令。\n　　請您一定要小心。\n@c0@"
1:
  en: "@a@b*: To get to the sacred village of Ghent, head east to the river and follow it north into the mountains.\n@c0@"
  ja: "@a@b＊「ここから北に出て　東の川ぞいを\n\t北へのぼった　山奥に……\n@c0@"
  ko: "@a@b*: 여기서 북쪽으로 가서 동쪽 강변을 따라\n북쪽으로 올라가면 산속에......\n@c0@"
  sl: "@a@b＊：从这里沿着东面的河向北，\n　　登上一座山……\n@c0@"
  tl: "@a@b＊：從這裡沿著東面的河向北，\n　　登上一座山……\n@c0@"
2:
  en: "@a@b*: You'll find Ghent just past where the river ends.\n@c0@"
  ja: "@a@b＊「ゲント族とよばれる　人びとが\n\t住んでいる村が　あるんだ。\n@c0@"
  ko: "@a@b*: 겐트족이라 불리는 사람들이\n살고 있는 마을이 있지.\n@c0@"
  sl: "@a@b＊：根特族的人们\n　　就住在山上的一个小村子里。\n@c0@"
  tl: "@a@b＊：根特族的人們\n　　就住在山上的一個小村子裡。\n@c0@"
3:
  en: "@a@b*: The population there believes itself to be specially favoured by the Goddess. They're not always easy to deal with...\n@c0@"
  ja: "@a@b＊「なんでも　自分たちを\n\t神の使いだと　信じているそうで\n\tけっこう気むずかしい連中だぞ。\n@c0@"
  ko: "@a@b*: 자신들이 신의 사자라고\n믿고 있는 모양인데,\n무척 까다로운 사람들이야.\n@c0@"
  sl: "@a@b＊：他们自称为神之使者，\n　　都是些难以相处的人。\n@c0@"
  tl: "@a@b＊：他們自稱為神之使者，\n　　都是些難以相處的人。\n@c0@"
4:
  en: "@a@b*: Welcome, %H0860%Xpilgrim%Ypilgrims%Z, to Ghent. The blessings of the Goddess be upon you.\n@c0@"
  ja: "@a@b＊「ここは　いだいなる神の使い\n\tゲントの村。\n@c0@"
  ko: "@a@b*: 이곳은 위대한 신의 사자\n겐트 마을.\n@c0@"
  sl: "@a@b＊：这里是伟大的神之使者\n　　根特族的村子。\n@c0@"
  tl: "@a@b＊：這裡是偉大的神之使者\n　　根特族的村子。\n@c0@"
5:
  en: "@a@b*: If the winding path of destiny has brought you here, then surely it was meant to be.\n@c0@"
  ja: "@a@b＊「あなたがたが　ここに来たのも\n\tきっと　神の　おみちびきでしょう。\n@c0@"
  ko: "@a@b*: 여러분이 이곳에 오신 것도\n틀림없이 신의 인도 덕분일 겁니다.\n@c0@"
  sl: "@a@b＊：你们来到这里\n　　一定是神的旨意。\n@c0@"
  tl: "@a@b＊：你們來到這裡\n　　一定是神的旨意。\n@c0@"
6:
  en: "@a@b*: When my daughter was struck down by a cruel sickness, we made pilgrimages to every other so-called holy site.\n@c0@"
  ja: "@a@b＊「わたしゃ　この村に\n\t娘の病気をなおしてもらうために\n\tやってきたのさ。\n@c0@"
  ko: "@a@b*: 나는 이 마을에\n딸의 병을 치료하려고\n왔어.\n@c0@"
  sl: "@a@b＊：我为了治好女儿的病来到这个村子。\n@c0@"
  tl: "@a@b＊：我為了治好女兒的病來到這個村子。\n@c0@"
7:
  en: "@a@b*: But until we came to Ghent, I thought she'd never get better! She's been looking more chipper every day since we arrived!\n@c0@"
  ja: "@a@b＊「もう　だめかと思ったけど\n\tここにいると　日に日に元気になって\n\tこんな　うれしいことは　ないよ。\n@c0@"
  ko: "@a@b*: 가망 없다고 생각했는데\n여기 있으니 날로 건강해져서\n더할 나위 없이 기뻐.\n@c0@"
  sl: "@a@b＊：本以为没有希望了，\n　　没想到女儿在这里渐渐好起来，\n　　真是太好了。\n@c0@"
  tl: "@a@b＊：本以為沒有希望了，\n　　沒想到女兒在這裡漸漸好起來，\n　　真是太好了。\n@c0@"
8:
  en: "@a@b*: Have you travelled here to be cured of some terrible illness?\n@c0@"
  ja: "@a@b＊「あなたたちも　この村に\n\t病気をなおしに　いらしたの？\n@c0@"
  ko: "@a@b*: 당신들도 이 마을에\n병을 고치려고 온 거야?\n@c0@"
  sl: "@a@b＊：你们来这个村子\n　　也是为了治病吗？\n@c0@"
  tl: "@a@b＊：你們來這個村子\n　　也是為了治病嗎？\n@c0@"
9:
  en: "@a@b*: ...Really? Well, you look just fine to me...\n@c0@"
  ja: "@a@b＊「そう……。　でも\n\tそういうふうには　見えないわね。\n@c0@"
  ko: "@a@b---점프---> #014112로\n@c0@"
  sl: "@a@b＊：不过……\n　　你们看起来不像有病的人呢。\n@c0@"
  tl: "@a@b＊：不過……\n　　你們看起來不像有病的人呢。\n@c0@"
10:
  en: "@a@b*: The Elder of Ghent is the only one who can aid you in your pitiable plight.\n@c0@"
  ja: "@a@b＊「まあ　たいへん！\n\tはやく長老さまに　お会いになって！\n@c0@"
  ko: "@a@b*: 그렇구나...... 하지만\n그렇게 보이지는 않아.\n@c0@"
  sl: "@a@b＊：哦，真糟糕！\n　　快去见长老吧！\n@c0@"
  tl: "@a@b＊：哦，真糟糕！\n　　快去見長老吧！\n@c0@"
11:
  en: "@a@b*: No one else in Ghent even approaches him in terms of general holiness and so on.\n@c0@"
  ja: "@a@b＊「長老さまは　この村で\n\tいちばん　チカラが　あるのよ。\n@c0@"
  ko: "@a@b*: 이런, 큰일이네!\n어서 장로님을 뵙도록 해!\n@c0@"
  sl: "@a@b＊：长老是这个村子里\n　　最厉害的人了。\n@c0@"
  tl: "@a@b＊：長老是這個村子裡\n　　最厲害的人了。\n@c0@"
12:
  en: "@a@b*: I see. So you're just here hoping some of our town's sacredness rubs off on you? Well, good luck!\n@c0@"
  ja: "@a@b＊「じゃあ　おまいりに来たのね。\n\tようこそ　おいでました。\n@c0@"
  ko: "@a@b*: 장로님은 이 마을에서\n가장 힘 있는 분이거든.\n@c0@"
  sl: "@a@b＊：那就是来朝拜的吧。\n　　欢迎你们来这里。\n@c0@"
  tl: "@a@b＊：那就是來朝拜的吧。\n　　歡迎你們來這裡。\n@c0@"
13:
  en: "@a@b*: The armaments crafted in Ghent are each imbued with the divine grace of the Goddess.\n@c0@"
  ja: "@a@b＊「この村で売られている武器・防具は\n\t神の祝福を　うけているそうだ。\n@c0@"
  ko: "@a@b*: 그럼 참배하러 왔구나.\n잘 왔어.\n@c0@"
  sl: "@a@b＊：这个村子出售的武器和防具\n　　都是被神祝福过的。\n@c0@"
  tl: "@a@b＊：這個村子出售的武器和防具\n　　都是被神祝福過的。\n@c0@"
14:
  en: "@a@b*: Woe betide anyone who doesn't use them in the cause of justice and rightitude!\n@c0@"
  ja: "@a@b＊「まちがった使い方をすれば\n\tそれこそ　天ばつが　くだるぞ。\n@c0@"
  ko: "@a@b*: 이 마을에서 판매하는 무기와 방어구는\n신의 축복을 받았다더군.\n@c0@"
  sl: "@a@b＊：如果胡乱使用的话，\n　　会被上天惩罚。\n@c0@"
  tl: "@a@b＊：如果胡亂使用的話，\n　　會被上天懲罰。\n@c0@"
15:
  en: "@a@b*: Since ancient times, bards and balladeers have celebrated the holy warriors of Ghent...\n@c0@"
  ja: "@a@b＊「いにしえの　ころより\n\t私たちは　神の　みこころに\n\tしたがって　きました。\n@c0@"
  ko: "@a@b*: 잘못 사용했다가는\n그야말로 천벌을 받게 돼.\n@c0@"
  sl: "@a@b＊：亘古以来，\n　　我们怀着对神的敬畏\n　　直至现在。\n@c0@"
  tl: "@a@b＊：亙古以來，\n　　我們懷著對神的敬畏\n　　直至現在。\n@c0@"
16:
  en: "@a@b*: When the world is in danger, they have always risen to battle evil and injustice in all its forms.\n@c0@"
  ja: "@a@b＊「世界に　悪が　はびこるとき\n\tわが　ゲント族の戦士も\n\t神のチカラに　めざめるのです。\n@c0@"
  ko: "@a@b*: 먼 옛날부터\n저희는 신의 뜻에\n따라 왔습니다.\n@c0@"
  sl: "@a@b＊：当邪恶蔓延世界之时，\n　　吾等根特族战士将获\n　　神赐之力。\n@c0@"
  tl: "@a@b＊：當邪惡蔓延世界之時，\n　　吾等根特族戰士將獲\n　　神賜之力。\n@c0@"
17:
  en: "@a@b*: Gaze upon this sacred abode! For this is where our Elder resides! A more holy man you will not meet!\n@c0@"
  ja: "@a@b＊「ここは　われらがゲント族の\n\t長老さまの家。\n@c0@"
  ko: "@a@b*: 세계에 악이 만연하면\n저희 겐트족 전사도\n신의 힘을 각성하게 되지요.\n@c0@"
  sl: "@a@b＊：这里是我们根特族长老的屋子。\n@c0@"
  tl: "@a@b＊：這裡是我們根特族長老的屋子。\n@c0@"
18:
  en: "@a@b*: ...You can go in and have a poke around if you like. Just don't rearrange the furniture or anything.\n@c0@"
  ja: "@a@b＊「入っても　かまわぬが\n\tそそうのないようにな。\n@c0@"
  ko: "@a@b*: 여기는 우리 겐트족\n장로님의 집이라네.\n@c0@"
  sl: "@a@b＊：您可以随便进去，\n　　但是千万不能失礼。\n@c0@"
  tl: "@a@b＊：您可以隨便進去，\n　　但是千萬不能失禮。\n@c0@"
19:
  en: "@a@b*: I pray that I grow up to be just like blessed %a002030, the chosen one!\n@c0@"
  ja: "@a@b＊「ボク　%a002030さまに\n\tあこがれているんだ。\n@c0@"
  ko: "@a@b*: 들어가도 되지만\n결례가 없도록 조심하게나.\n@c0@"
  sl: "@a@b＊：我可崇拜%a002030大哥哥了。\n@c0@"
  tl: "@a@b＊：我可崇拜%a002030大哥哥了。\n@c0@"
20:
  en: "@a@b*: %0%a002030 may still be young, but he's fast approaching his grandfather the Elder in terms of sheer holiness.\n@c0@"
  ja: "@a@b＊「%a002030さまはね\n\t長老さまのマゴで　まだ若いけど\n\tすごい　チカラの持ち主なんだよ！\n@c0@"
  ko: "@a@b*: %a002030 님은\n나의 우상이야.\n@c0@"
  sl: "@a@b＊：%a002030大哥哥是长老的孙子，\n　　虽然还很年轻，\n　　但是他的本事非常大！\n@c0@"
  tl: "@a@b＊：%a002030大哥哥是長老的孫子，\n　　雖然還很年輕，\n　　但是他的本事非常大！\n@c0@"
21:
  en: "@a@b*: He who wields the staff of Ghent has unparalleled power to cure those around him.\n@c0@"
  ja: "@a@b＊「ゲントのつえは　いやしのつえ。\n@c0@"
  ko: "@a@b*: %a002030 님은 장로님의\n손자인데, 아직 어리지만\n엄청난 힘을 가지고 있거든!\n@c0@"
  sl: "@a@b＊：根特之杖是治愈的法杖。\n@c0@"
  tl: "@a@b＊：根特之杖是治癒的法杖。\n@c0@"
22:
  en: "@a@b*: Even in the heat of battle, a wave of the staff can restore health in the blink of an eye.\n@c0@"
  ja: "@a@b＊「たとえ　戦いのさなかでも\n\tそのつえを　ふると　たちまち\n\tキズが　いやされるそうです。\n@c0@"
  ko: "@a@b*: 겐트의 지팡이는 치유의 지팡이.\n@c0@"
  sl: "@a@b＊：只要在战斗中挥舞法杖，\n　　马上就能治愈伤痛。\n@c0@"
  tl: "@a@b＊：只要在戰鬥中揮舞法杖，\n　　馬上就能治癒傷痛。\n@c0@"
23:
  en: "@a@b*: The sacred ship dubbed the Providence has long been enshrined here.\n@c0@"
  ja: "@a@b＊「ここは　わがゲントの\n\t神の船をまつる　聖なる神殿。\n@c0@"
  ko: "@a@b*: 가령 한창 싸우는 중이라도\n그 지팡이를 쓰면 금방\n상처가 치유된다고 합니다.\n@c0@"
  sl: "@a@b＊：我们根特的神之船\n　　就供奉在这座神圣神殿中。\n@c0@"
  tl: "@a@b＊：我們根特的神之船\n　　就供奉在這座神聖神殿中。\n@c0@"
24:
  en: "@a@b*: ...But if you think you can just wander aboard, you've got another thing coming!\n㈡\n*: Without the Elder's permission, this is as close as you'll get!\n@c0@"
  ja: "@a@b＊「長老さまの　ゆるしなき者を\n\t通すわけにはいかぬ。\n\tどうか　おひきとりを！\n@c0@"
  ko: "@a@b*: 여기는 우리 겐트의\n신의 배를 기리는 성스러운 신전.\n@c0@"
  sl: "@a@b＊：没有长老的允许，\n　　谁也不许通过。\n　　请回去吧！\n@c0@"
  tl: "@a@b＊：沒有長老的允許，\n　　誰也不許通過。\n　　請回去吧！\n@c0@"
25:
  en: "@a@b*: Do they know how bleedin' far I've travelled to get a look at their bleedin' ship?\n㈡\n*: And now they tell me I need bleedin' permission from the bleedin' Elder!?\n@c0@"
  ja: "@a@b＊「ゲント族って　ケチだよな。\n\tわざわざ　この村に来たんだから\n\t神の船を見せてくれても　いいのによ。\n@c0@"
  ko: "@a@b*: 장로님이 허락하지 않은 자를\n들여보낼 수는 없지.\n그만 돌아가시게!\n@c0@"
  sl: "@a@b＊：根特族的人真小气。\n　　我为了神之船特意到这里来，\n　　为什么不让我看。\n@c0@"
  tl: "@a@b＊：根特族的人真小氣。\n　　我為了神之船特意到這裡來，\n　　為什麼不讓我看。\n@c0@"
26:
  en: "@a@b*: Legend speaks of a divine steed that descended from the heavens and landed here in Ghent.\n@c0@"
  ja: "@a@b＊「伝説では　かつてこの村に\n\t天馬が　まいおりて来たそうです。\n@c0@"
  ko: "@a@b*: 인정머리 없는 겐트족.\n애써 이 마을까지 왔으니\n신의 배를 보여줘도 좋잖아.\n@c0@"
  sl: "@a@b＊：传说这个村子\n　　以前有天马降临。\n@c0@"
  tl: "@a@b＊：傳說這個村子\n　　以前有天馬降臨。\n@c0@"
27:
  en: "@a@b*: Could this humble horse be a descendent of that sacred steed? I sincerely doubt it!\n@c0@"
  ja: "@a@b＊「この馬が　その天馬の子孫……\n\tなんてことは　ないでしょうね。\n@c0@"
  ko: "@a@b*: 일찍이 이 마을에 천마가\n내려왔다는 전설이 있더군요.\n@c0@"
  sl: "@a@b＊：这匹马是它的后代么……\n　　应该不会这么巧吧。\n@c0@"
  tl: "@a@b＊：這匹馬是它的後代麼……\n　　應該不會這麼巧吧。\n@c0@"
28:
  en: "@a@b*: (snort) (whinny) Neeeeiiighhhh!!!\n@c0@"
  ja: "@a@b＊「ブヒヒヒヒーンッ！\n@c0@"
  ko: "@a@b*: 이 말이 혹시 그 천마의 자손......\n설마 그럴 리가 없겠죠.\n@c0@"
  sl: "@a@b＊：嘶嘶嘶嘶！\n@c0@"
  tl: "@a@b＊：嘶嘶嘶嘶！\n@c0@"
29:
  en: "@a@b*: I hear that our blessed Elder tried to cure King Somnus without any luck.\n@c0@"
  ja: "@a@b＊「ここだけの話じゃが\n\tレイドック王のご病気は\n\t長老さまでも　なおせんかったよ。\n@c0@"
  ko: "@a@b*: 이히히힝~!\n@c0@"
  sl: "@a@b＊：你不要对别人说啊，\n　　雷多克王的病\n　　就连长老都没治好。\n@c0@"
  tl: "@a@b＊：你不要對別人說啊，\n　　雷多克王的病\n　　就連長老都沒治好。\n@c0@"
30:
  en: "@a@b*: What's that you say!? King Somnus is back on his feet!?\n@c0@"
  ja: "@a@b＊「なんと！　王は　すでに\n\t元気に　なられたじゃとっ！？\n\tそうか　そうじゃったか。\n@c0@"
  ko: "@a@b*: 이건 비밀인데\n레이독 왕의 병환은\n장로님조차도 고칠 수가 없었구먼.\n@c0@"
  sl: "@a@b＊：什么！\n　　国王已经恢复健康了？！\n　　原来如此。\n@c0@"
  tl: "@a@b＊：什麼！\n　　國王已經恢復健康了？！\n　　原來如此。\n@c0@"
31:
  en: "@a@b*: Well, there you go! The Elder's prayers must have finally reached the Goddess!\n@c0@"
  ja: "@a@b＊「時間は　かかったが\n\tやはり　長老さまの　祈りが\n\tつうじたのかもしれんのう。\n@c0@"
  ko: "@a@b*: 뭣이! 레이독 왕이\n이미 건강해지셨다고!?\n으흠, 그랬구먼.\n@c0@"
  sl: "@a@b＊：虽然时间有点长，\n　　不过长老的祈祷终于生效了。\n@c0@"
  tl: "@a@b＊：雖然時間有點長，\n　　不過長老的祈禱終於生效了。\n@c0@"
32:
  en: "@a@b*: We humble citizens of Ghent live our daily lives in a spirit of gratitude to the Goddess.\n@c0@"
  ja: "@a@b＊「わしらゲントの者じゃけん\n\tどんな時でも　神さまへの感謝を\n\tわすれたことは　ないべよ。\n@c0@"
