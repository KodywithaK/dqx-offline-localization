  tl: "@a@b%a001260：嗯～看起來你應該懂得\n　　更時尚的戰鬥方式。\n@c0@"
26:
  en: "@a%0%a001260@bThe monsters here are naturally stylish, but I sense very little interest in matters of fashion... (glurp)\n@c0@"
  ja: "@a@b%a001260「ここの　まものは\n\tかっこいいのに　オシャレに\n\tきょうみが　なさそうだなあ～。\n@c0@"
  ko: "@a@b%a001260: 여기 있는 마물은\n다들 잘생겼는데도 멋 내기에는\n관심이 없는 것 같군~\n@c0@"
  sl: "@a@b%a001260：这里的魔物虽然很帅气，\n　　但是对时尚\n　　似乎没什么兴趣啊～\n@c0@"
  tl: "@a@b%a001260：這裡的魔物雖然很帥氣，\n　　但是對時尚\n　　似乎沒什麼興趣啊～\n@c0@"
27:
  en: "@a%0%a001260@bI have always believed that one needs stylish weapons in order to fight the goo fight. (glurp)\n@c0@"
  ja: "@a@b%a001260「かっこいい　武器で\n\tかっこよく　戦う。\n\tそういう生き方って　あこがれるな。\n@c0@"
  ko: "@a@b%a001260: 멋있는 무기로\n멋있게 싸우는 것.\n그런 삶을 살고 싶군.\n@c0@"
  sl: "@a@b%a001260：拿着帅气的武器\n　　帅气地战斗。\n　　真羡慕这种生活方式。\n@c0@"
  tl: "@a@b%a001260：拿著帥氣的武器\n　　帥氣地戰鬥。\n　　真羡慕這種生活方式。\n@c0@"
28:
  en: "@a%0%a001260@bIt's v-very nice here... (squelch)\n@c0@"
  ja: "@a@b%a001260「ここは\n\tいごこちが　いいね。\n@c0@"
  ko: "@a@b%a001260: 여긴\n참 아늑하네.\n@c0@"
  sl: "@a@b%a001260：待在这里真舒服。\n@c0@"
  tl: "@a@b%a001260：待在這裡真舒服。\n@c0@"
29:
  en: "@a%0%a001260@bLet's goo dig some holes! (squelch)\n@c0@"
  ja: "@a@b%a001260「ねえねえ\n\tそろそろ　穴ほりをしに　行こうよ。\n@c0@"
  ko: "@a@b%a001260: 저기 있잖아,\n이제 구멍을 파러 가자.\n@c0@"
  sl: "@a@b%a001260：喂喂，\n　　差不多该去挖洞了吧。\n@c0@"
  tl: "@a@b%a001260：喂喂，\n　　差不多該去挖洞了吧。\n@c0@"
30:
  en: "@a%0%a001260@bHorsing around with Peggy Sue is goo clean fun! (squelch)\n@c0@"
  ja: "@a@b%a001260「ファルシオンと\n\t話していると　楽しいよ。\n@c0@"
  ko: "@a@b%a001260: 팔시온이랑\n얘기하는 거 재밌어.\n@c0@"
  sl: "@a@b%a001260：跟法尔西昂说话\n　　真开心。\n@c0@"
  tl: "@a@b%a001260：跟法爾西昂說話\n　　真開心。\n@c0@"
31:
  en: "@a%0%a001260@b(squelch) It's a s-scary world outside the w-wagon...\n@c0@"
  ja: "@a@b%a001260「ブルブルブル。\n\t馬車の外は　きんちょうするなぁ。\n@c0@"
  ko: "@a@b%a001260: 부르부르부르.\n마차 밖은 긴장돼.\n@c0@"
  sl: "@a@b%a001260：噗噜噗噜噗噜。\n　　马车的外面好紧张。\n@c0@"
  tl: "@a@b%a001260：噗嚕噗嚕噗嚕。\n　　馬車的外面好緊張。\n@c0@"
32:
  en: "@a%0%a001260@bMy gloopy steed and I are ready to ride into battle!\n@c0@"
  ja: "@a@b%a001260「そりゃっ！　うりゃっ！\n@c0@"
  ko: "@a@b%a001260: 이랴! 히얍!\n@c0@"
  sl: "@a@b%a001260：嘿呀！哎呀！\n@c0@"
  tl: "@a@b%a001260：嘿呀！哎呀！\n@c0@"
33:
  en: "@a%0%a001260@bI must constantly strive to slurpass myself!\n@c0@"
  ja: "@a@b%a001260「私のことを\n\t必要としてくださる方の　ためにも\n\t今より　もっと　強くならなければ。\n@c0@"
  ko: "@a@b%a001260: 나를\n필요로 해 주시는 분들을 위해서라도\n지금보다 더 강해져야 한다오.\n@c0@"
  sl: "@a@b%a001260：为了那些需要我的人们，\n　　我要变得更加强大。\n@c0@"
  tl: "@a@b%a001260：為了那些需要我的人們，\n　　我要變得更加強大。\n@c0@"
34:
  en: "@a%0%a001260@bStrong weapons are wasted without a strong heart. I must train harder!\n@c0@"
  ja: "@a@b%a001260「強き心を　持たなければ\n\t強き武器も　宝の持ちぐされ。\n\tしょうじんせねば。\n@c0@"
