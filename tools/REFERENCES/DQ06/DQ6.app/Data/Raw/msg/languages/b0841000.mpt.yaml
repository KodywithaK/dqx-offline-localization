  tl: "@a@b%a001260：馬車好懷念啊……\n　　噗嚕噗嚕噗嚕噗嚕。\n@c0@"
1:
  en: "@a%0%a001260@bLet's goo dig some holes! (squelch)\n@c0@"
  ja: "@a@b%a001260「ねえねえ\n\tそろそろ　穴ほりをしに　行こうよ。\n@c0@"
  ko: "@a@b%a001260: 저기 있잖아,\n이제 구멍을 파러 가자.\n@c0@"
  sl: "@a@b%a001260：喂喂，\n　　差不多该去挖洞了吧。\n@c0@"
  tl: "@a@b%a001260：喂喂，\n　　差不多該去挖洞了吧。\n@c0@"
2:
  en: "@a%0%a001260@bG-Gooness gracious... I'm j-jigglin' with f-fear! (squelch)\n@c0@"
  ja: "@a@b%a001260「うぅ……　こわいなぁ。\n\tブルブル。\n@c0@"
  ko: "@a@b%a001260: 우우...... 무서워.\n부르부르.\n@c0@"
  sl: "@a@b%a001260：唔……好可怕啊。\n　　噗噜噗噜。\n@c0@"
  tl: "@a@b%a001260：唔……好可怕啊。\n　　噗嚕噗嚕。\n@c0@"
3:
