  sl: "@a@b%a001260：如果没有强大的内心，\n　　纵使拿着强大的武器也是徒劳。\n　　必须要专心努力。\n@c0@"
  tl: "@a@b%a001260：如果沒有強大的內心，\n　　縱使拿著強大的武器也是徒勞。\n　　必須要專心努力。\n@c0@"
35:
  en: "@a%0%a001260@bIt is a fine thing indeed to have companions on the road of life!\n@c0@"
