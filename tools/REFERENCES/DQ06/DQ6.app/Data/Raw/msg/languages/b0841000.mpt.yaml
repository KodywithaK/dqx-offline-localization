  ja: "@a@b%a001260「この辺りの\n\tまものって　強そうだね。\n\tブルブルブルブル。\n@c0@"
  ko: "@a@b%a001260: 이 근방의\n마물은 강할 것 같아.\n부르부르부르부르.\n@c0@"
  sl: "@a@b%a001260：这附近的魔物\n　　好像很强啊。\n　　噗噜噗噜噗噜噗噜。\n@c0@"
  tl: "@a@b%a001260：這附近的魔物\n　　好像很強啊。\n　　噗嚕噗嚕噗嚕噗嚕。\n@c0@"
4:
  en: "@a%0%a001260@bMy gloopy steed and I are ready to ride into battle!\n@c0@"
  ja: "@a@b%a001260「そりゃっ！　うりゃっ！\n@c0@"
  ko: "@a@b%a001260: 이랴! 히얍!\n@c0@"
  sl: "@a@b%a001260：嘿呀！哎呀！\n@c0@"
  tl: "@a@b%a001260：嘿呀！哎呀！\n@c0@"
5:
  en: "@a%0%a001260@bWhenever you require it, I will lend you my not insubstantial supplies of valour.\n@c0@"
  ja: "@a@b%a001260「いざとなったら\n\t私が　盾となりますぞ。\n@c0@"
  ko: "@a@b%a001260: 여차하면\n내가 방패가 되겠소.\n@c0@"
  sl: "@a@b%a001260：到了万不得已的时候\n　　我就当作盾牌。\n@c0@"
  tl: "@a@b%a001260：到了萬不得已的時候\n　　我就當作盾牌。\n@c0@"
6:
  en: "@a%0%a001260@bWhoa there! Patience, my gloopy steed...\n@c0@"
  ja: "@a@b%a001260「こりゃっ！　ハイドー！\n@c0@"
  ko: "@a@b%a001260: 이랴! 가자!\n@c0@"
  sl: "@a@b%a001260：看招！走你！\n@c0@"
  tl: "@a@b%a001260：看招！走你！\n@c0@"
7:
  en: "@a%0%a001260@bBy all means avail yourself of my courage and downright dashing demeanour!\n@c0@"
  ja: "@a@b%a001260「私の力……\n\t役に立っているだろうか。\n@c0@"
  ko: "@a@b%a001260: 나의 힘......\n과연 도움이 되고 있는가?\n@c0@"
  sl: "@a@b%a001260：不知道我……\n　　有没有帮上忙啊。\n@c0@"
  tl: "@a@b%a001260：不知道我……\n　　有沒有幫上忙啊。\n@c0@"
8:
  en: "@a%0%a001260@bChing, ching! (bloop)\n@c0@"
  ja: "@a@b%a001260「キュルッ　キュルッ！\n@c0@"
  ko: "@a@b%a001260: 큐우 큐우!\n@c0@"
  sl: "@a@b%a001260：呦隆！呦隆！\n@c0@"
  tl: "@a@b%a001260：呦隆！呦隆！\n@c0@"
9:
  en: "@a%0%a001260@bChing!?\n@c0@"
  ja: "@a@b%a001260「キュンッ！？\n@c0@"
  ko: "@a@b%a001260: 큐웅!?\n@c0@"
  sl: "@a@b%a001260：咻？！\n@c0@"
  tl: "@a@b%a001260：咻？！\n@c0@"
10:
  en: "@a%0%a001260@bChiiing! (bloop)\n@c0@"
  ja: "@a@b%a001260「キューン！\n@c0@"
  ko: "@a@b%a001260: 큐잉~!\n@c0@"
  sl: "@a@b%a001260：咻咻！\n@c0@"
  tl: "@a@b%a001260：咻咻！\n@c0@"
11:
  en: "@a%0%a001260@bChi-ching! Ching!\n@c0@"
  ja: "@a@b%a001260「キュキュキュッ！\n@c0@"
  ko: "@a@b%a001260: 큐큐큐!\n@c0@"
  sl: "@a@b%a001260：咻咻咻！\n@c0@"
  tl: "@a@b%a001260：咻咻咻！\n@c0@"
12:
  en: "@a%0%a001260@bOnce upon a time, I was an ordinary slime, you know. (slurp)\n@c0@"
  ja: "@a@b%a001260「むかーし　むかしは\n\tボク　ふつうの　スライムだったんだ。\n@c0@"
  ko: "@a@b%a001260: 아주 옛날에는\n나도 보통 슬라임이었어.\n@c0@"
  sl: "@a@b%a001260：很～久很久以前，\n　　我只是一只很普通的史莱姆。\n@c0@"
  tl: "@a@b%a001260：很～久很久以前，\n　　我只是一隻很普通的史萊姆。\n@c0@"
13:
  en: "@a%0%a001260@bBy goolly, I wish I could float higher than this!\n@c0@"
  ja: "@a@b%a001260「フワフワ。\n\tもっと　高く　飛びたいな。\n@c0@"
  ko: "@a@b%a001260: 둥실둥실.\n더 높이 날고 싶어.\n@c0@"
  sl: "@a@b%a001260：飘飘飘。\n　　我想要飞得更高。\n@c0@"
  tl: "@a@b%a001260：飄飄飄。\n　　我想要飛得更高。\n@c0@"
14:
  en: "@a%0%a001260@bGoo-whiz, I'm thirsty... (slurp)\n@c0@"
  ja: "@a@b%a001260「のど　かわいたなぁ～。\n@c0@"
  ko: "@a@b%a001260: 목말라~\n@c0@"
  sl: "@a@b%a001260：渴了～\n@c0@"
  tl: "@a@b%a001260：渴了～\n@c0@"
15:
  en: "@a%0%a001260@bWhooze in need of some healing?\n@c0@"
  ja: "@a@b%a001260「そろそろ　ホイミ使う？\n@c0@"
  ko: "@a@b%a001260: 이제 호이미 쓸까?\n@c0@"
  sl: "@a@b%a001260：差不多该使用霍伊米了吧？\n@c0@"
  tl: "@a@b%a001260：差不多該使用霍伊米了吧？\n@c0@"
16:
  en: "@a%0%a001260@bIf you get hurt, I cast Fullheal. Just say word.\n@c0@"
  ja: "@a@b%a001260「キズついたら\n\tベホマしてやる。\n\tえんりょなく　言え。\n@c0@"
  ko: "@a@b%a001260: 상처 입으면\n베호마 써 준다.\n부담 없이 말해라.\n@c0@"
  sl: "@a@b%a001260：受伤了的话\n　　就对你使用贝霍玛。\n　　别客气尽管跟我说。\n@c0@"
  tl: "@a@b%a001260：受傷了的話\n　　就對你使用貝霍瑪。\n　　別客氣儘管跟我說。\n@c0@"
17:
  en: "@a%0%a001260@b%0%a002130 protect. I heal. Also, slurp. Ultimate buddy team.\n@c0@"
  ja: "@a@b%a001260「守りの　%a002130。\n\t回復の　オレ。\n\t名コンビ　なんだぜ。\n@c0@"
  ko: "@a@b%a001260: 수호 담당은 %a002130.\n회복 담당은 나.\n우린 명콤비다.\n@c0@"
  sl: "@a@b%a001260：负责防守的%a002130。\n　　负责恢复的我。\n　　真是一对人气组合啊。\n@c0@"
  tl: "@a@b%a001260：負責防守的%a002130。\n　　負責恢復的我。\n　　真是一對人氣組合啊。\n@c0@"
18:
  en: "@a%0%a001260@bCareful. (slurp) Something here.\n@c0@"
  ja: "@a@b%a001260「ここ　何かいる。\n\t気をつけろ。\n@c0@"
  ko: "@a@b%a001260: 여기 뭔가 있다.\n조심해라.\n@c0@"
  sl: "@a@b%a001260：这里好像有什么。\n　　多加小心。\n@c0@"
  tl: "@a@b%a001260：這裡好像有什麼。\n　　多加小心。\n@c0@"
19:
  en: "@a%0%a001260@bI like fighting. Gets blood pumping. (slurrrp) Wait...slimes no have blood. Or do they?\n@c0@"
  ja: "@a@b%a001260「オレ　戦い　スキ。\n\tウデが　鳴るな。\n\tあっ……　アシを　鳴らしてシマッタ。\n@c0@"
  ko: "@a@b%a001260: 나 싸우는 거 좋다.\n몸이 근질근질하다.\n앗...... 안 씻어서 그런가?\n@c0@"
  sl: "@a@b%a001260：我喜欢战斗。\n　　手都痒了呢。\n　　啊……连脚也痒了。\n@c0@"
  tl: "@a@b%a001260：我喜歡戰鬥。\n　　手都癢了呢。\n　　啊……連腳也癢了。\n@c0@"
20:
  en: "@a%0%a001260@bI'm such a bad seaslime. All I can see are people's feet because of this big old shell...\n@c0@"
  ja: "@a@b%a001260「アタシ　カラが　ジャマして\n\tひとの足元しか　見られないの。\n\t悪い　マリンスライムでしょ？\n@c0@"
  ko: "@a@b%a001260: 나, 껍데기 때문에\n사람 발밖에 못 봐.\n나쁜 마린 슬라임이지?\n@c0@"
  sl: "@a@b%a001260：因为外壳太碍事，\n　　我只能看见别人的脚部。\n　　我不是个好的海生史莱姆吧？\n@c0@"
  tl: "@a@b%a001260：因為外殼太礙事，\n　　我只能看見別人的腳部。\n　　我不是個好的海生史萊姆吧？\n@c0@"
21:
  en: "@a%0%a001260@b(scuttle scuttle) I'll protect you if anything goos wrong. Aren't I a good seaslime?\n@c0@"
  ja: "@a@b%a001260「何かあったら　守ってあげるね。\n\tいい　マリンスライムでしょ？\n@c0@"
  ko: "@a@b%a001260: 무슨 일 생기면 지켜 줄게.\n착한 마린 슬라임이지?\n@c0@"
  sl: "@a@b%a001260：一旦有事我会保护你的。\n　　我是个好的海生史莱姆吧？\n@c0@"
  tl: "@a@b%a001260：一旦有事我會保護你的。\n　　我是個好的海生史萊姆吧？\n@c0@"
