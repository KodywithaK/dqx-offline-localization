  en: "@a%0%a001260@bI wonder if I'd make a good weapon if you threw me. My shell's pretty hard, you know.\n@c0@"
  ja: "@a@b%a001260「アタシを　投げつけたら\n\tいい武器に　なるかな？\n@c0@"
  ko: "@a@b%a001260: 나를 던지면\n좋은 무기로 쓸 수 있을까?\n@c0@"
  sl: "@a@b%a001260：如果把我扔出去的话\n　　不知道能否起到武器的效果呢？\n@c0@"
  tl: "@a@b%a001260：如果把我扔出去的話\n　　不知道能否起到武器的效果呢？\n@c0@"
23:
  en: "@a%0%a001260@bMy shell's in bad, bad shape. (scuttle) I'd better goo trade for a new one soon.\n@c0@"
  ja: "@a@b%a001260「このカラも　いたんできたかな。\n\tそろそろ　取りかえないとね。\n@c0@"
  ko: "@a@b%a001260: 이 껍데기도 많이 상했네.\n새걸로 바꿔야겠어.\n@c0@"
  sl: "@a@b%a001260：这个外壳也快不好使了。\n　　差不多该换个新的了。\n@c0@"
  tl: "@a@b%a001260：這個外殼也快不好使了。\n　　差不多該換個新的了。\n@c0@"
24:
  en: "@a%0%a001260@bThis is a stylish place indeed. Fit for a king slime, you might say! Goo ha ha! (glurp)\n@c0@"
  ja: "@a@b%a001260「ふぉっほっほっ。\n\tこれは　これは\n\tオシャレな　場所だねえ。\n@c0@"
  ko: "@a@b%a001260: 홋홋홋.\n여기가 어딘가? 아주\n멋진 곳이로군.\n@c0@"
  sl: "@a@b%a001260：噗哈哈。\n　　这里还真是\n　　有够时尚啊。\n@c0@"
  tl: "@a@b%a001260：噗哈哈。\n　　這裡還真是\n　　有夠時尚啊。\n@c0@"
25:
  en: "@a%0%a001260@bI dare say your fighting style could use a touch more...panache. (glurp)\n@c0@"
  ja: "@a@b%a001260「ん～。　キミは　もっと\n\tオシャレな　戦い方　できそうだねえ。\n@c0@"
  ko: "@a@b%a001260: 으음~ 자네는 좀 더\n멋지게 싸울 수 있을 것 같은걸.\n@c0@"
