0:
  en: "@a%0%a001260@bI'd g-give all my spots to goo b-back to the wagon! (squelch)\n@c0@"
  ja: "@a@b%a001260「馬車が　こいしいな……\n\tブルブルブルブル。\n@c0@"
  ko: "@a@b%a001260: 마차가 그리워......\n부르부르부르부르.\n@c0@"
