  ja: "@a@b%a002050「なんだか　どこを歩いても\n\t同じところのような　気がします……。\n@c0@"
  ko: "@a@b%a002050: 왠지 어딜 가도\n같은 곳처럼 느껴집니다......\n@c0@"
  sl: "@a@b%a002050：好像不管走到哪里，\n　　周围的景色都是一样的……\n@c0@"
