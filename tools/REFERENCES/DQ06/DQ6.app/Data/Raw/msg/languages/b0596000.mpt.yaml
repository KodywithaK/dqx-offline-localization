  sl: "@a@b%a002040：这姑娘真天真……\n@c0@"
  tl: "@a@b%a002040：這姑娘真天真……\n@c0@"
128:
  en: "@a%0%a002050@bOld %a002050 would be happy to be the Princess's tour guide.\n@c0@"
