  sl: "@a@b%a002050：海王波塞冬\n　　竟然看重咱们！\n　　啊哈！\n@c0@"
  tl: "@a@b%a002050：海王波塞冬\n　　竟然看重咱們！\n　　啊哈！\n@c0@"
104:
  en: "@a%0%a002070@bBoing! (jiggle)\n@c0@"
  ja: "@a@b%a002070「プルプルーッ！\n@c0@"
  ko: "@a@b%a002070: 뽀용뽀요용~!\n@c0@"
  sl: "@a@b%a002070：噗噜噗噜！\n@c0@"
  tl: "@a@b%a002070：噗嚕噗嚕！\n@c0@"
105:
  en: "@a%0%a002000@bA coupla wise guys, aye? Didn't we hear a rumour about these fellas somewhere...?\n@c0@"
  ja: "@a@b%a002000「２人の賢者？\n\tよそでも　そんな　ウワサを\n\t聞いたっけか？\n@c0@"
  ko: "@a@b%a002000: 두 현자?\n다른 데서도 그런 소문을\n들었던가?\n@c0@"
  sl: "@a@b%a002000：两位贤者？\n　　咱们在外面\n　　听过这样的传闻吗？\n@c0@"
  tl: "@a@b%a002000：兩位賢者？\n　　咱們在外面\n　　聽過這樣的傳聞嗎？\n@c0@"
106:
  en: "@a%0%a002010@bIsaac and Benjamin... I sense we'd do well to remember those names.\n@c0@"
  ja: "@a@b%a002010「マサールと　クリムト。\n\t２人の名前は　覚えておいたほうが\n\tいいかも　しれないわね。\n@c0@"
  ko: "@a@b%a002010: 마살과 클림트.\n두 사람의 이름은 기억해 두는 게\n좋을 것 같아.\n@c0@"
  sl: "@a@b%a002010：马萨尔和克林姆。\n　　最好记住这两个名字。\n@c0@"
  tl: "@a@b%a002010：馬薩爾和克林姆。\n　　最好記住這兩個名字。\n@c0@"
107:
  en: "@a%0%a002030@bTwo wise men? I'd very much like to meet them.\n@c0@"
  ja: "@a@b%a002030「２人の賢者さま……。\n\tお目にかかって　みたいものです。\n@c0@"
  ko: "@a@b%a002030: 두 현자님......\n만나뵙고 싶습니다.\n@c0@"
  sl: "@a@b%a002030：两位贤者大人……\n　　真想拜见他们。\n@c0@"
  tl: "@a@b%a002030：兩位賢者大人……\n　　真想拜見他們。\n@c0@"
108:
  en: "@a%0%a002020@bIsaac and Benjamin? Hmm... Nope, doesn't ring a bell.\n@c0@"
  ja: "@a@b%a002020「マサールと　クリムト？\n\tうーん……。\n\tあたしは　聞いたことないかも。\n@c0@"
  ko: "@a@b%a002020: 마살과 클림트?\n으음......\n나는 들어 본 적이 없는 것 같아.\n@c0@"
  sl: "@a@b%a002020：马萨尔和克林姆？\n　　嗯……\n　　人家好像没听过呢。\n@c0@"
  tl: "@a@b%a002020：馬薩爾和克林姆？\n　　嗯……\n　　人家好像沒聽過呢。\n@c0@"
