112:
  en: "@a%0%a002010@bHey, don't encourage her, %a000090.\n@c0@"
  ja: "@a@b%a002010「ほら。　ステキなところ\n\tなんていうから　お姫さまが\n\t興味を　もっちゃうのよ。\n@c0@"
