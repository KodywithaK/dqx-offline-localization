0:
  en: "@a%0%a002000@bI don't like the looks of this place. Watch your back, aye?\n@c0@"
  ja: "@a@b%a002000「あやしい　洞くつだな……。\n\t気をつけて　進もうぜ！\n@c0@"
  ko: "@a@b%a002000: 수상한 동굴이군......\n조심해서 가자!\n@c0@"
  sl: "@a@b%a002000：这洞窟真奇怪。\n　　咱们要小心前进！\n@c0@"
  tl: "@a@b%a002000：這洞窟真奇怪。\n　　咱們要小心前進！\n@c0@"
1:
  en: "@a%0%a002010@bWe could easily get lost in a sprawling cave like this. Let's take care.\n@c0@"
  ja: "@a@b%a002010「とても　広そうだわね。\n\t迷わないように　行きましょう。\n@c0@"
  ko: "@a@b%a002010: 아주 넓은 곳 같아.\n길을 잃지 않도록 조심하면서 가자.\n@c0@"
  sl: "@a@b%a002010：真宽广啊。\n　　千万不要迷路。\n@c0@"
  tl: "@a@b%a002010：真寬廣啊。\n　　千萬不要迷路。\n@c0@"
2:
  en: "@a%0%a002030@bI sense there are monsters nearby. Let us be on our guard.\n@c0@"
  ja: "@a@b%a002030「まものの　気配がします。\n\tしんちょうに　いきます。\n@c0@"
  ko: "@a@b%a002030: 마물의 기운이 느껴집니다.\n신중하게 나아가도록 하죠.\n@c0@"
  sl: "@a@b%a002030：有魔物的气息。\n　　要小心谨慎地前行。\n@c0@"
  tl: "@a@b%a002030：有魔物的氣息。\n　　要小心謹慎地前行。\n@c0@"
3:
  en: "@a%0%a002020@bGreat. I'm already lost.\n@c0@"
  ja: "@a@b%a002020「どこが　どこだか\n\tさっぱり　わからないよー。\n@c0@"
  ko: "@a@b%a002020: 어디가 어딘지\n전혀 모르겠어~\n@c0@"
  sl: "@a@b%a002020：人家完全\n　　分不清东西南北了。\n@c0@"
  tl: "@a@b%a002020：人家完全\n　　分不清東西南北了。\n@c0@"
4:
  en: "@a%0%a002050@bDon't leave old %a002050 behind, d'you hear?\n@c0@"
  ja: "@a@b%a002050「みなさん　くれぐれも\n\t私を　おいていかないでくださいね！\n@c0@"
  ko: "@a@b%a002050: 여러분, 제발 부탁이니\n저를 두고 가지는 말아 주세요!\n@c0@"
  sl: "@a@b%a002050：各位啊，\n　　你们万万不能把我一个人丢在这里！\n@c0@"
  tl: "@a@b%a002050：各位啊，\n　　你們萬萬不能把我一個人丟在這裡！\n@c0@"
5:
  en: "@a%0%a002070@bBoing?\n@c0@"
  ja: "@a@b%a002070「ピキーッ！\n@c0@"
  ko: "@a@b%a002070: 피키~!\n@c0@"
  sl: "@a@b%a002070：哔叽！\n@c0@"
  tl: "@a@b%a002070：嗶嘰！\n@c0@"
6:
  en: "@a%0%a002000@bCrikey, this cave is twisty. Blink and you're lost.\n@c0@"
  ja: "@a@b%a002000「この洞くつは　どうなってんだ？\n\tすぐに　迷っちまうぜ……。\n@c0@"
  ko: "@a@b%a002000: 이 동굴은 어떻게 생긴 거지?\n금방이라도 길을 잃을 것 같군......\n@c0@"
  sl: "@a@b%a002000：这洞窟应该怎么走？\n　　太容易迷路了……\n@c0@"
  tl: "@a@b%a002000：這洞窟應該怎麼走？\n　　太容易迷路了……\n@c0@"
7:
  en: "@a%0%a002010@bSomething's just occurred to me, %a000090. Do you recall what that fellow in the cave east of Clearvale told us?\n@c0@"
  ja: "@a@b%a002010「ふと　思い出したんだけど\n\tクリアベールの東の洞くつにいた人の\n\t話を　おぼえてる？\n@c0@"
  ko: "@a@b%a002010: 갑자기 생각난 건데,\n클리어베일 동쪽 동굴에 있었던 사람이\n했던 말 기억해?\n@c0@"
  sl: "@a@b%a002010：克里亚贝尔东边的\n　　洞窟里的那个人说的话，\n　　你还记得吗？\n@c0@"
  tl: "@a@b%a002010：克里亞貝爾東邊的\n　　洞窟裡的那個人說的話，\n　　你還記得嗎？\n@c0@"
8:
  en: "@a%0%a002010@b‘First, north. At the end, east. North at the first four-way intersection, then south at the four-way intersection to the west.’\n@c0@"
  ja: "@a@b%a002010「まず北へ。　つきあたりを東に。\n\tひとつめの十字路を北へすすみ\n\t西の十字路を南にすすむべし。\n@c0@"
  ko: "@a@b%a002010: 일단 북쪽으로. 막다른 곳에서 동쪽으로.\n첫 번째 사거리에서 북쪽으로 간 다음\n서쪽 사거리에서는 남쪽으로 갈 것.\n@c0@"
  sl: "@a@b%a002010：先往北走到底，再往东走。\n　　在第一个十字路口往北走。\n　　在西边的十字路口再往南走。\n@c0@"
  tl: "@a@b%a002010：先往北走到底，再往東走。\n　　在第一個十字路口往北走。\n　　在西邊的十字路口再往南走。\n@c0@"
9:
  en: "@a%0%a002010@bThat is what he said, isn't it?\n@c0@"
  ja: "@a@b%a002010「たしか　そんなこと\n\tいってなかったかしら？\n@c0@"
  ko: "@a@b%a002010: 내 기억엔 그렇게\n들은 것 같은데 어때?\n@c0@"
  sl: "@a@b%a002010：那个人是这么说的吧？\n@c0@"
  tl: "@a@b%a002010：那個人是這麼說的吧？\n@c0@"
