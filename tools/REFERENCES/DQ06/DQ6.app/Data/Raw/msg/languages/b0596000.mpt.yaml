  tl: "@a@b%a002000：漂亮不漂亮\n　　俺說不出來，\n　　只是覺得那城堡真氣派。\n@c0@"
132:
  en: "@a%0%a002010@bThe ones who first invited us weren't the best hosts, but the castle's current residents are simply wonderful people.\n@c0@"
