  ja: "@a@b%a002030「え？　%a000090さん。\n\tまだ　なにか　あのお城に\n\t問題が　ありましたっけ？\n@c0@"
  ko: "@a@b%a002030: 어? %a000090 님.\n아직 그 성에\n문제가 남아 있었던가요?\n@c0@"
