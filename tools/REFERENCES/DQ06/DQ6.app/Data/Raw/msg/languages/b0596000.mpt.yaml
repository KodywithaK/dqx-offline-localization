  en: "@a%0%a002020@bFrom the outside, the castle is to die for. But when you step inside, you realize it's more a place to die ‘in’.\n@c0@"
  ja: "@a@b%a002020「お城は　ステキだけど\n\t中身が　ちょっとねー。\n@c0@"
