  ja: "@a@b%a002010「上の階の　ときのように\n\t何か　情報らしいものは\n\tなかったかしらね……。\n@c0@"
  ko: "@a@b%a002010: 위층에서처럼\n뭔가 정보가 될 만한 게\n없을까......\n@c0@"
