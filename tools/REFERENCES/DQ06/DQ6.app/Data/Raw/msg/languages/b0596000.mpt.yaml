130:
  en: "@a%0%a002070@bBoing! (jiggle)\n@c0@"
  ja: "@a@b%a002070「プルプルーッ！\n@c0@"
  ko: "@a@b%a002070: 뽀용뽀요용~!\n@c0@"
  sl: "@a@b%a002070：噗噜噗噜！\n@c0@"
  tl: "@a@b%a002070：噗嚕噗嚕！\n@c0@"
131:
  en: "@a%0%a002000@bThat castle was really somethin', but I don't think it ever took my breath any place.\n@c0@"
  ja: "@a@b%a002000「ステキか　どうかは\n\tオレには　わからないが\n\tりっぱな　城だと　思うぞ。\n@c0@"
  ko: "@a@b%a002000: 멋진지 아닌지\n나는 잘 모르겠지만\n훌륭한 성이긴 하지.\n@c0@"
