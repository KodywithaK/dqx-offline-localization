  ja: "@a@b%a002010「つぎに　ポセイドン王に\n\t会うときは　大魔王を　たおして\n\t会いたいわね。\n@c0@"
  ko: "@a@b%a002010: 다음에 포세이돈 왕을\n만날 때는 대마왕을 쓰러뜨린\n뒤였으면 좋겠어.\n@c0@"
  sl: "@a@b%a002010：下次见到波塞冬的时候，\n　　我们也许已经打倒大魔王了吧。\n@c0@"
  tl: "@a@b%a002010：下次見到波塞冬的時候，\n　　我們也許已經打倒大魔王了吧。\n@c0@"
101:
  en: "@a%0%a002030@bFinding the Shield of Valora was no mean feat.\n@c0@"
  ja: "@a@b%a002030「スフィーダの盾を　見つけるため\n\tずいぶんと　苦労しました。\n@c0@"
  ko: "@a@b%a002030: 스피더의 방패를 찾기 위해\n제법 고생을 했답니다.\n@c0@"
  sl: "@a@b%a002030：为了找到斯费达之盾，\n　　我们费了好大一番功夫。\n@c0@"
  tl: "@a@b%a002030：為了找到斯費達之盾，\n　　我們費了好大一番功夫。\n@c0@"
102:
  en: "@a%0%a002020@bOkay, %a000090, where to next?\n@c0@"
  ja: "@a@b%a002020「ねえ　%a000090！\n\tつぎは　どうする？\n@c0@"
  ko: "@a@b%a002020: 저기, %a000090!\n이제 어떻게 할까?\n@c0@"
  sl: "@a@b%a002020：%a000090！\n　　接下来做什么？\n@c0@"
  tl: "@a@b%a002020：%a000090！\n　　接下來做什麼？\n@c0@"
103:
  en: "@a%0%a002050@bWe lived up to Poseidon's expectations!? Er, I mean... Of course we did!\n@c0@"
  ja: "@a@b%a002050「私たち　ポセイドン王に\n\t見込まれて　いたんですね！\n\tえっへん！\n@c0@"
