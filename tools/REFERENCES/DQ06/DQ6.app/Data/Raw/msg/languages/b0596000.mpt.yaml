  sl: "@a@b%a002020：城堡外面很漂亮，\n　　里面就有点……\n@c0@"
  tl: "@a@b%a002020：城堡外面很漂亮，\n　　裡面就有點……\n@c0@"
115:
  en: "@a%0%a002050@bI wonder why Poseidon's so irritable... Maybe he got out of the wrong side of the seabed!\n@c0@"
  ja: "@a@b%a002050「ピリピリって……\n\tポセイドン王は　何かに\n\tしびれているのでしょうか！\n@c0@"
  ko: "@a@b%a002050: 포세이돈 왕이\n왜 갑자기 예민해지신\n걸까요?\n@c0@"
