  sl: "@a@b%a002050：他们能成为贤者，\n　　想必是很贤明的人吧。\n@c0@"
  tl: "@a@b%a002050：他們能成為賢者，\n　　想必是很賢明的人吧。\n@c0@"
110:
  en: "@a%0%a002070@bBoi-oing! (slurp)\n@c0@"
  ja: "@a@b%a002070「プルプル？\n@c0@"
