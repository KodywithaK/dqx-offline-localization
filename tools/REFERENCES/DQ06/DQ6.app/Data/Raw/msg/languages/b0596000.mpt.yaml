  tl: "@a@b%a002030：誒？%a000090，\n　　你覺得那座城裡\n　　還有什麼問題嗎？\n@c0@"
134:
  en: "@a%0%a002020@bThat castle wasn't much for first impressions, but now — wow! It's stunning!\n@c0@"
  ja: "@a@b%a002020「最初は　ともかく\n\tいまは　ステキな　お城だよー。\n@c0@"
  ko: "@a@b%a002020: 처음엔 좀 그랬지만\n지금은 멋진 성이지~\n@c0@"
