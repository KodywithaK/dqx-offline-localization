  ko: "@a@b%a002050: 전설의 장비의 문양이\n가리키는 곳은\n틀림없이 여기입니다!\n@c0@"
  sl: "@a@b%a002050：跟传说中的武具\n　　的印记有关系的，\n　　绝对是这里没错吧！\n@c0@"
