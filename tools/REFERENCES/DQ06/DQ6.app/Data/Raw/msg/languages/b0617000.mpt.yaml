0:
  en: "@a%0%a002000@bShe discovered the truth about the dream world, aye? It's an eye-opener, alright.\n@c0@"
  ja: "@a@b%a002000「夢の世界だって\n\t気づいたのか……。\n\t認めるのが　つらかっただろうな。\n@c0@"
  ko: "@a@b%a002000: 꿈의 세계라는 걸\n눈치챘나......\n인정하기 괴로웠을 테지.\n@c0@"
  sl: "@a@b%a002000：居然察觉到这里是\n　　梦世界了吗……要承认这个事实，\n　　内心一定挣扎了很久吧。\n@c0@"
  tl: "@a@b%a002000：居然察覺到這裡是\n　　夢世界了嗎……要承認這個事實，\n　　內心一定掙扎了很久吧。\n@c0@"
1:
  en: "@a%0%a002010@bNot being able to tell anyone must have been a terrible burden for her.\n@c0@"
  ja: "@a@b%a002010「このシスターは\n\t誰にも　いえなくて\n\t苦しかったでしょうね。\n@c0@"
  ko: "@a@b%a002010: 이 수녀님은\n누구한테도 말 못하고\n괴로웠겠지.\n@c0@"
  sl: "@a@b%a002010：这位修女不能告诉别人，\n　　一定很痛苦吧。\n@c0@"
  tl: "@a@b%a002010：這位修女不能告訴別人，\n　　一定很痛苦吧。\n@c0@"
2:
  en: "@a%0%a002030@bWhether this is real life or a dream, the important thing is that we're still alive.\n@c0@"
  ja: "@a@b%a002030「現実であろうが\n\t夢であろうが　生きていることには\n\tかわりありません。\n@c0@"
  ko: "@a@b%a002030: 현실이든\n꿈이든 살아 있는 건\n변함없습니다.\n@c0@"
  sl: "@a@b%a002030：无论现实还是梦境，\n　　至少活着的事实不会改变。\n@c0@"
  tl: "@a@b%a002030：無論現實還是夢境，\n　　至少活著的事實不會改變。\n@c0@"
3:
  en: "@a%0%a002020@bThe Archfiend's trying to destroy everything — even people's dreams... He's gonna pay!\n@c0@"
  ja: "@a@b%a002020「人々の　夢の世界まで\n\tこわそうとする　大魔王を\n\tあたしは　ゆるせないよ！\n@c0@"
  ko: "@a@b%a002020: 사람들의 꿈의 세계까지\n부수려는 대마왕을\n난 절대로 용서 못해.\n@c0@"
  sl: "@a@b%a002020：大魔王连大家的\n　　梦世界都想要毁坏，\n　　人家决不轻饶他！\n@c0@"
  tl: "@a@b%a002020：大魔王連大家的\n　　夢世界都想要毀壞，\n　　人家決不輕饒他！\n@c0@"
4:
  en: "@a%0%a002040@bWe're going to put an end to the Archfiend's antics.\n@c0@"
  ja: "@a@b%a002040「大魔王の　好きには\n\tさせないぜ。\n@c0@"
  ko: "@a@b%a002040: 대마왕 마음대로\n하게 놔두지 않겠어.\n@c0@"
  sl: "@a@b%a002040：不能让大魔王为所欲为。\n@c0@"
  tl: "@a@b%a002040：不能讓大魔王為所欲為。\n@c0@"
5:
  en: "@a%0%a002050@bDream world? Real world? We'll save all the worlds we can find!\n@c0@"
  ja: "@a@b%a002050「夢の世界も　現実の世界も\n\t私たちが　救ってみせます！\n@c0@"
  ko: "@a@b%a002050: 꿈의 세계도 현실 세계도\n우리가 구하겠습니다!\n@c0@"
  sl: "@a@b%a002050：无论是梦世界还是\n　　现实世界，我们都要拯救！\n@c0@"
  tl: "@a@b%a002050：無論是夢世界還是\n　　現實世界，我們都要拯救！\n@c0@"
