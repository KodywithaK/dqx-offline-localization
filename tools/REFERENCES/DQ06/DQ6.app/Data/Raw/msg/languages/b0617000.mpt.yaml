  en: "@a%0%a002000@bHuh? Does that nun wanna tell us her story or not?\n@c0@"
  ja: "@a@b%a002000「この　シスター……\n\t聞いてほしいのか　ほしくないのか\n\t本当は　どっちなんだ？\n@c0@"
  ko: "@a@b%a002000: 이 수녀님......\n물어 봐 달라는 건지 아닌 건지\n본심은 어느 쪽일까?\n@c0@"
  sl: "@a@b%a002000：这位修女……\n　　该不会其实很想\n　　把这个秘密说出来吧？\n@c0@"
  tl: "@a@b%a002000：這位修女……\n　　該不會其實很想\n　　把這個秘密說出來吧？\n@c0@"
9:
  en: "@a%0%a002010@bThe ‘workings of the world’? Let's find out what she knows, %a000090.\n@c0@"
  ja: "@a@b%a002010「世界の　しくみ？\n\tなにを　どう　知ったのか\n\t聞いてみましょうよ。\n@c0@"
  ko: "@a@b%a002010: 세계의 구조?\n무엇을 어떻게 알았는지\n물어 보자.\n@c0@"
  sl: "@a@b%a002010：世界的秘密？\n　　就听听她知道些什么，\n　　又是怎么知道的吧。\n@c0@"
  tl: "@a@b%a002010：世界的秘密？\n　　就聽聽她知道些什麼，\n　　又是怎麼知道的吧。\n@c0@"
10:
  en: "@a%0%a002030@bShe seems relieved.\n@c0@"
  ja: "@a@b%a002030「ほっと　してますね……。\n@c0@"
  ko: "@a@b%a002030: 안심이 되는군요......\n@c0@"
  sl: "@a@b%a002030：悬着的心总算放下来了……\n@c0@"
  tl: "@a@b%a002030：懸著的心總算放下來了……\n@c0@"
11:
  en: "@a%0%a002020@bDo you think she knows what we know?\n@c0@"
  ja: "@a@b%a002020「しくみを　知った\n\tと　いうことは……！？\n@c0@"
  ko: "@a@b%a002020: 구조를 알았다고\n한다면......!?\n@c0@"
  sl: "@a@b%a002020：知道秘密……\n　　就，就是说？！\n@c0@"
  tl: "@a@b%a002020：知道秘密……\n　　就，就是說？！\n@c0@"
12:
  en: "@a%0%a002040@bBeing alone, I don't suppose she was ever tempted to spill the beans to anyone else.\n@c0@"
  ja: "@a@b%a002040「まわりに　人がいると\n\tつい　話してしまうかも　しれないから\n\tここに　１人で　いるってわけか。\n@c0@"
  ko: "@a@b%a002040: 주변에 사람이 있으면\n무심코 말해 버릴지 모르니까\n여기에서 혼자 있는 거로군.\n@c0@"
  sl: "@a@b%a002040：周围有人的话\n　　可能一不小心就会说漏嘴，\n　　所以才独自生活的吗。\n@c0@"
  tl: "@a@b%a002040：周圍有人的話\n　　可能一不小心就會說漏嘴，\n　　所以才獨自生活的嗎。\n@c0@"
