17:
  en: "@a%0%a002010@bThe legendary relics should now lead us to the Celestial Castle.\n@c0@"
  ja: "@a@b%a002010「さあ　伝説の武具が\n\t私たちを　ここから　神の城へ\n\tみちびいて　くれるはずよ。\n@c0@"
  ko: "@a@b%a002010: 자, 전설의 장비가\n우리를 여기에서 신의 성으로\n인도해 줄 거야.\n@c0@"
  sl: "@a@b%a002010：传说中的武具\n　　一定会引导我们\n　　前往神之城的。\n@c0@"
