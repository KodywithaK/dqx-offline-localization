  ja: "@a@b%a002030「伝説の武具は　そろえましたが\n\tどうやったら　神の城に\n\t行けるのでしょう？\n@c0@"
  ko: "@a@b%a002030: 전설의 장비는 모두 모았는데\n어떻게 하면 신의 성에\n갈 수 있는 걸까요?\n@c0@"
  sl: "@a@b%a002030：传说中的武具\n　　倒是集齐了，但是怎么\n　　才能去神之城呢？\n@c0@"
  tl: "@a@b%a002030：傳說中的武具\n　　倒是集齊了，但是怎麼\n　　才能去神之城呢？\n@c0@"
19:
  en: "@a%0%a002020@bSay, what about those symbols on the legendary equipment...?\n@c0@"
