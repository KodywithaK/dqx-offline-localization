  tl: "@a@b%a002000：不過，\n　　還是先聽聽她說什麼吧……\n@c0@"
263:
  en: "@a%0%a002010@bGood morning, %a000090. You look like you slept well.\n@c0@"
  ja: "@a@b%a002010「おはよう　%a000090。\n\tゆうべは　よく\n\tねむっていたみたいね。\n@c0@"
  ko: "@a@b%a002000: 뭐, 일단\n이야기를\n들어볼 수밖에......\n@c0@"
  sl: "@a@b%a002010：早上好%a000090。\n　　看起来你们昨晚睡得很好。\n@c0@"
  tl: "@a@b%a002010：早上好%a000090。\n　　看起來你們昨晚睡得很好。\n@c0@"
264:
  en: "@aMadame Luca@bAhem. New to this seeing business, are you? Madame Luca's powers require certain protocols to be followed, you know.\n@c0@"
  ja: "@a@bグランマーズ「これこれ　どこから\n\t話しかけておるのじゃ。\n\tねぼけておるのかい？\n@c0@"
  ko: "@a@b%a002010: 잘 잤어, %a000090?\n어젯밤에는 곤히\n잘 자는 것 같던데.\n@c0@"
  sl: "@a@b玛兹婆婆：为什么要从这里跟我对话。\n　　你们睡傻了吗？\n@c0@"
  tl: "@a@b瑪茲婆婆：為什麼要從這裡跟我對話。\n　　你們睡傻了嗎？\n@c0@"
265:
  en: "@aMadame Luca@bStop sleepwalking and speak from the other side of the crystal ball.\n@c0@"
  ja: "@a@bグランマーズ「しっかり\n\tこの　すいしょう玉の　むこうから\n\t話しかけんかい！\n@c0@"
  ko: "@a@b그랜마즈: 이런 이런, 어디서\n말을 거는 게야.\n아직 잠이 덜 깬 거냐?\n@c0@"
  sl: "@a@b玛兹婆婆：精神点，\n　　到水晶球对面去，\n　　然后再跟我说话！\n@c0@"
  tl: "@a@b瑪茲婆婆：精神點，\n　　到水晶球對面去，\n　　然後再跟我說話！\n@c0@"
266:
  en: "@aMadame Luca@bFinally awake, are you? Madame Luca rises with the sun while you young fools waste the day in bed. Wisdom comes with age, yes?  \n@c0@"
  ja: "@a@bグランマーズ「やっと　起きたかい。\n\tわしゃ　年のせいか　朝が\n\t早くてね。　まちくたびれたよ。\n@c0@"
  ko: "@a@b그랜마즈: 이 수정구 너머로\n제대로\n말을 걸어야지!\n@c0@"
  sl: "@a@b玛兹婆婆：你们终于醒了。\n　　我这上了年纪的早上醒得早。\n　　已经等你们很久了。\n@c0@"
  tl: "@a@b瑪茲婆婆：你們終於醒了。\n　　我這上了年紀的早上醒得早。\n　　已經等你們很久了。\n@c0@"
267:
  en: "@aMadame Luca@bAnyway, enough lectures from old Luca Luminista. You have things to do and people to see.\n@c0@"
  ja: "@a@bグランマーズ「さて……と\n\tお前さんたちのことだがね……\n@c0@"
  ko: "@a@b그랜마즈: 이제 일어났나 보군.\n나는 늙어서인지 잠이 없어서\n꼭두새벽부터 기다리다 지쳤어.\n@c0@"
  sl: "@a@b玛兹婆婆：那么……\n　　就说说你们的事情吧……\n@c0@"
  tl: "@a@b瑪茲婆婆：那麼……\n　　就說說你們的事情吧……\n@c0@"
268:
