  sl: "@a@b＊：刚才那女人好像在跟谁说话。\n@c0@"
  tl: "@a@b＊：剛才那女人好像在跟誰說話。\n@c0@"
237:
  en: "@a@b*: But there don't seem to be anybody here...\n@c0@"
  ja: "@a@b＊「けど　まわりには　だれも\n\tいなかったしなあ……。\n@c0@"
  ko: "@a@b*: 방금 그 여자, 누군가와\n얘기하는 것 같았어.\n@c0@"
  sl: "@a@b＊：但是周围一个人也没有啊……\n@c0@"
  tl: "@a@b＊：但是周圍一個人也沒有啊……\n@c0@"
238:
  en: "@a%0%a002010@bAlright, then. Please follow me.\n@c0@"
  ja: "@a@b%a002010「さあ\n\t私に　ついて来て。\n@c0@"
  ko: "@a@b*: 주위에 아무도\n없는데 말이지......\n@c0@"
  sl: "@a@b%a002010：来吧，\n　　请跟我来。\n@c0@"
  tl: "@a@b%a002010：來吧，\n　　請跟我來。\n@c0@"
239:
  en: "@a@bIt seems she doesn't notice %a000140's presence.\n@c0@"
  ja: "@a@bしかし　%a000140には\n気づかないようだ。\n@c0@"
  ko: "@a@b%a002010: 그럼\n나를 따라와.\n@c0@"
  sl: "@a@b但是没有注意到%a000140。\n@c0@"
  tl: "@a@b但是沒有注意到%a000140。\n@c0@"
240:
  en: "@a@bThe door is locked.\n@c0@"
  ja: "@a@bドアには　カギが　かかっている！\n@c0@"
  ko: "@a@b하지만 %a000140%F0140%X를%Y을%Z\n눈치채지 못했다.\n@c0@"
  sl: "@a@b门上着锁！\n@c0@"
  tl: "@a@b門上著鎖！\n@c0@"
241:
  en: "@a@bA strange voice echoes from afar...\n@c0@"
  ja: "@a@bどこからともなく　ふしぎな声が\nひびいてきた……。\n@c0@"
  ko: "@a@b문은 열쇠로 잠겨 있다!\n@c0@"
  sl: "@a@b不知从哪里\n传来了不可思议的声音……\n@c0@"
  tl: "@a@b不知從哪裡\n傳來了不可思議的聲音……\n@c0@"
242:
  en: "@a@b*: Now is not the time to be entering this cave, mmm-hmm. Be gone until it's your fate to venture farther!\n@c0@"
  ja: "@a@b＊「わしの許可なく　この洞くつに\n\t入ることは　ゆるさん！\n\tそうそうに　立ち去るのじゃ。\n@c0@"
  ko: "@a@b어디선가 이상한 목소리가\n울려 퍼졌다......\n@c0@"
  sl: "@a@b＊：没有我的允许，\n　　任何人不得进入洞窟！\n　　速速离去吧。\n@c0@"
  tl: "@a@b＊：沒有我的允許，\n　　任何人不得進入洞窟！\n　　速速離去吧。\n@c0@"
243:
  en: "@a%0%a002010@bWell, here we are.\n@c0@"
  ja: "@a@b%a002010「さあ　どうぞ\n\tこっちよ。\n@c0@"
  ko: "@a@b*: 내 허락 없이 이 동굴에\n들어가면 용서하지 않겠다!\n썩 물러가라.\n@c0@"
  sl: "@a@b%a002010：来吧，请走这边。\n@c0@"
  tl: "@a@b%a002010：來吧，請走這邊。\n@c0@"
244:
  en: "@a@b*: %a002010, you're back. Mmm-hmm. No surprising one who sees all, yes? The crystal did speak of your return — and your success.\n@c0@"
  ja: "@a@b＊「ひゃーひゃっひゃっ。\n\tおかえり　%a002010。　どうやら\n\t見つけてきたようじゃね。\n@c0@"
  ko: "@a@b%a002010: 어서 와,\n이쪽이야.\n@c0@"
  sl: "@a@b＊：哈哈哈。\n　　你回来啦%a002010。\n　　看来你是找到他们了。\n@c0@"
  tl: "@a@b＊：哈哈哈。\n　　你回來啦%a002010。\n　　看來你是找到他們了。\n@c0@"
245:
  en: "@a%0%a002010@bYes, Madame Luca. I found them!\n@c0@"
  ja: "@a@b%a002010「ただいま　おばあちゃん。\n\tそのとおりよ。　見つけてきたの。\n@c0@"
  ko: "@a@b*: 호~호호홋.\n어서 오너라, %a002010. 보아하니\n찾아낸 모양이구나.\n@c0@"
  sl: "@a@b%a002010：我回来了，婆婆。\n　　您说的对，我找到了。\n@c0@"
  tl: "@a@b%a002010：我回來了，婆婆。\n　　您說的對，我找到了。\n@c0@"
246:
  en: "@a%0%a002010@bIt was exactly like you said it would be!\n@c0@"
  ja: "@a@b%a002010「おばあちゃんの\n\t言ったとおり　だったわ！\n@c0@"
  ko: "@a@b%a002010: 다녀왔어요, 할머니.\n맞아요. 찾아냈어요.\n@c0@"
  sl: "@a@b%a002010：就像您所预言的那样！\n@c0@"
  tl: "@a@b%a002010：就像您所預言的那樣！\n@c0@"
247:
  en: "@a%0%a002010@bAllow me to introduce you to Luca Luminista, the dream seer. She's been looking forward to meeting you.\n@c0@"
  ja: "@a@b%a002010「こちらは\n\t夢占い師の　グランマーズ。\n\tあなたたちを　待っていたのよ。\n@c0@"
  ko: "@a@b%a002010: 할머니가\n말씀하신 그대로였어요!\n@c0@"
  sl: "@a@b%a002010：这位是占梦师玛兹婆婆。\n　　她一直在等你们。\n@c0@"
  tl: "@a@b%a002010：這位是占夢師瑪茲婆婆。\n　　她一直在等你們。\n@c0@"
248:
  en: "@aMadame Luca@bMmm-hmm, and for quite some time. You two are %a000090 and %a002000, yes?\n@c0@"
  ja: "@a@bグランマーズ「そういうことじゃ。\n\tたしか　お前さんたちは\n\t%a000090と　%a002000だったね。\n@c0@"
  ko: "@a@b%a002010: 이쪽은\n해몽가 그랜마즈.\n너희를 기다리고 있었어.\n@c0@"
  sl: "@a@b玛兹婆婆：没错。\n　　你们就是\n　　%a000090和%a002000对吧。\n@c0@"
  tl: "@a@b瑪茲婆婆：沒錯。\n　　你們就是\n　　%a000090和%a002000對吧。\n@c0@"
249:
  en: "@aMadame Luca@bHah hee! Don't be looking so stunned, you boys!\n@c0@"
  ja: "@a@bグランマーズ「ふぉっほっほっ\n\tそんなに　ふしぎそうな顔を\n\tしなさんな。\n@c0@"
  ko: "@a@b그랜마즈: 그렇단다.\n분명 너희는 %a000090%F0090%X와%Y과%Z %a002000%F2000%X였%Y이었%Z지.\n@c0@"
  sl: "@a@b玛兹婆婆：呵呵呵，\n　　不用摆出一副惊奇的表情。\n@c0@"
  tl: "@a@b瑪茲婆婆：呵呵呵，\n　　不用擺出一副驚奇的表情。\n@c0@"
250:
  en: "@aMadame Luca@bYou must be wondering why %a002010 and Madame Luca can see you, yes?\n@c0@"
  ja: "@a@bグランマーズ「わしや　%a002010に\n\tどうして　お前さんたちの姿が\n\t見えるのか……\n@c0@"
  ko: "@a@b그랜마즈: 호호호.\n그렇게 이상한 얼굴로\n쳐다보지 말아라.\n@c0@"
  sl: "@a@b玛兹婆婆：我和%a002010\n　　能看见你们的原因……\n@c0@"
  tl: "@a@b瑪茲婆婆：我和%a002010\n　　能看見你們的原因……\n@c0@"
251:
  en: "@aMadame Luca@bOr perhaps you wonder why everyone else in this world cannot?\n@c0@"
  ja: "@a@bグランマーズ「そもそも　どうして\n\tこっちの世界では　お前さんたちの姿が\n\t見えないのか……\n@c0@"
  ko: "@a@b그랜마즈: 나와 %a002010에게는\n어떻게 너희들의 모습이\n보이는지......\n@c0@"
  sl: "@a@b玛兹婆婆：或者说，\n　　这个世界的人\n　　为什么看不见你们……\n@c0@"
  tl: "@a@b瑪茲婆婆：或者說，\n　　這個世界的人\n　　為什麼看不見你們……\n@c0@"
252:
  en: "@aMadame Luca@bPoor little lambs. You must be positively perplexed.\n@c0@"
  ja: "@a@bグランマーズ「あれこれ　わからなくて\n\tこまっとるんじゃろ？\n@c0@"
  ko: "@a@b그랜마즈: 애당초 어째서\n이쪽 세계에서는 너희의 모습이\n안 보이는지......\n@c0@"
  sl: "@a@b玛兹婆婆：这让你们很困惑吧？\n@c0@"
  tl: "@a@b瑪茲婆婆：這讓你們很困惑吧？\n@c0@"
253:
  en: "@aMadame Luca@bRegardless, you simply wish to get on with your mission.\n@c0@"
  ja: "@a@bグランマーズ「……ふむ　そうかい。\n\tしかし　お前さんたちには　しっかりと\n\t目的が　あるようじゃ。\n@c0@"
  ko: "@a@b그랜마즈: 이런저런 의문 때문에\n고민이 많을 테지?\n@c0@"
  sl: "@a@b玛兹婆婆：……哦，是这样啊。\n　　你们两个人有自己的目标。\n@c0@"
  tl: "@a@b瑪茲婆婆：……哦，是這樣啊。\n　　你們兩個人有自己的目標。\n@c0@"
254:
  en: "@aMadame Luca@bMmm-hmm, that's it. You've been sent to search for Ra's mirror, yes? On the orders of King Somnus of Somnia...\n@c0@"
  ja: "@a@bグランマーズ「レイドック王の兵士として\n\tラーの鏡を　さがせと……\n\tそう　言われているはずだからのう。\n@c0@"
  ko: "@a@b그랜마즈: ......으음, 그래.\n하지만, 너희는 목적이\n뚜렷해 보이는구나.\n@c0@"
  sl: "@a@b玛兹婆婆：作为雷多克王的士兵，\n　　找到太阳神镜……\n　　你们的任务是这样吧。\n@c0@"
  tl: "@a@b瑪茲婆婆：作為雷多克王的士兵，\n　　找到太陽神鏡……\n　　你們的任務是這樣吧。\n@c0@"
255:
  en: "@aMadame Luca@bWell, you will never accomplish anything if you look like nothing. Hee hah! \n@c0@"
  ja: "@a@bグランマーズ「だが　それには\n\tまず　お前さんたちの姿を\n\tなんとかしなければならん。\n@c0@"
  ko: "@a@b그랜마즈: 레이독 왕의 병사로서\n라의 거울을 찾으라는 명을\n받았을 테니 말이다.\n@c0@"
  sl: "@a@b玛兹婆婆：但是，在这之前，\n　　必须解决你们自身的问题。\n@c0@"
  tl: "@a@b瑪茲婆婆：但是，在這之前，\n　　必須解決你們自身的問題。\n@c0@"
256:
  en: "@aMadame Luca@bAfter all, you must be seen and heard in order to buy a ferry ticket to Somnia. Madame Luca can make it happen.\n@c0@"
  ja: "@a@bグランマーズ「この世界で　姿が\n\t見えなければ　レイドックへの\n\t乗船券も　買えんのじゃから。\n@c0@"
  ko: "@a@b그랜마즈: 하지만 그러려면\n우선 너희의 모습부터\n어떻게 해야만 해.\n@c0@"
  sl: "@a@b玛兹婆婆：如果这世界的人看不见你们，\n　　连船票都买不了。\n@c0@"
  tl: "@a@b瑪茲婆婆：如果這世界的人看不見你們，\n　　連船票都買不了。\n@c0@"
257:
  en: "@aMadame Luca@bBut you must have patience, little lambs. Preparations must be made, and fate runs on its own schedule.\n@c0@"
  ja: "@a@bグランマーズ「ただ　お前さんたちを\n\tたすけるには　すこし　じゅんびが\n\t必要じゃ。\n@c0@"
  ko: "@a@b그랜마즈: 이 세계에서 모습이\n보이지 않으면 레이독으로 가는 승선권조차\n살 수 없으니 말이다.\n@c0@"
  sl: "@a@b玛兹婆婆：要帮你们，我得先做点准备。\n@c0@"
  tl: "@a@b瑪茲婆婆：要幫你們，我得先做點準備。\n@c0@"
258:
  en: "@aMadame Luca@bSo for now, let us be calling it a day. Just because Madame Luca is a dream seer doesn't mean she can sleep on the job.\n@c0@"
  ja: "@a@bグランマーズ「ともかく\n\t今日のところは　ひと休みおし。\n@c0@"
  ko: "@a@b그랜마즈: 단, 너희를\n도와주려면 약간의 준비가\n필요하단다.\n@c0@"
  sl: "@a@b玛兹婆婆：今天你们就在这里休息吧。\n@c0@"
  tl: "@a@b瑪茲婆婆：今天你們就在這裡休息吧。\n@c0@"
259:
  en: "@aMadame Luca@bThe rest can wait until tomorrow. And speaking of rest...goodnight!\n@c0@"
  ja: "@a@bグランマーズ「話の　つづきは\n\tまた　明日にしよう。\n@c0@"
  ko: "@a@b그랜마즈: 아무튼 오늘은\n이만 푹 쉬거라.\n@c0@"
  sl: "@a@b玛兹婆婆：剩下的话明天再说。\n@c0@"
  tl: "@a@b瑪茲婆婆：剩下的話明天再說。\n@c0@"
260:
  en: "@a%0%a002000@bHey. You up yet?\n@c0@"
  ja: "@a@b%a002000「よう　%a000090\n\t起きたかい？\n@c0@"
  ko: "@a@b그랜마즈: 이야기는\n내일 계속해 주마.\n@c0@"
  sl: "@a@b%a002000：嗨，%a000090你起床了？\n@c0@"
  tl: "@a@b%a002000：嗨，%a000090你起床了？\n@c0@"
261:
  en: "@a%0%a002000@bHow can ya sleep in at a time like this? That lady gives me the willies...\n@c0@"
  ja: "@a@b%a002000「なんだか　ヘンなことに\n\tなってきたなあ。\n\tあの　ばあさんも　あやしいし。\n@c0@"
  ko: "@a@b%a002000: 어이, %a000090\n일어났어?\n@c0@"
  sl: "@a@b%a002000：总觉得咱碰到了奇怪的事情。\n　　那个老婆婆也很可疑啊。\n@c0@"
  tl: "@a@b%a002000：總覺得咱碰到了奇怪的事情。\n　　那個老婆婆也很可疑啊。\n@c0@"
262:
  en: "@a%0%a002000@bGuess we'll have to hear her out, though... It's not like there's anyone else we can turn to.\n@c0@"
  ja: "@a@b%a002000「まあ　とりあえずは\n\t話を　聞いてみるしか\n\tなさそうだけどな……。\n@c0@"
  ko: "@a@b%a002000: 뭔가 일이\n이상하게 됐군. 저 할머니도\n수상하고 말이야.\n@c0@"
