130:
  en: "@a@b*: Have you spoken to the King?\n@c0@"
  ja: "@a@b＊「王さまに　お会いになりましたか？\n@c0@"
  ko: "@a@b레이독 왕: 여기 내가 쓴\n소개장이 있네. 이걸 보여 주면\n분명히 배를 빌려줄 걸세.\n@c0@"
  sl: "@a@b＊：您见到国王了吗？\n@c0@"
