  sl: "@a@b雷多克王：我有一事相求。\n　　能不能请你们代替我打倒姆多？\n@c0@"
  tl: "@a@b雷多克王：我有一事相求。\n　　能不能請你們代替我打倒姆多？\n@c0@"
114:
  en: "@aKing Somnus@bBlessed as you are with the ability to travel between worlds, you may be able to better withstand Murdaw's trickery.\n@c0@"
