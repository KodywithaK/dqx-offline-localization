  sl: "@a@b雷多克王：这是我写的介绍信。\n　　把这个给他们看，\n　　一定可以借到船。\n@c0@"
  tl: "@a@b雷多克王：這是我寫的介紹信。\n　　把這個給他們看，\n　　一定可以借到船。\n@c0@"
127:
  en: "@a@b%0%a000140 receives the Royal Missive.\n㈡\n%0%a000140 puts the Royal Missive in the bag.\n@c0@"
  ja: "@a@b%a000140は　王の書状を\n%a001400に　入れた！\n@c0@"
  ko: "@a@b레이독 왕: 그런데\n사실 이 성에는......\n㈢㈢이제 배가 없다네.\n@c0@"
  sl: "@a@b%a000140把王的书信\n放进了%a001400！\n@c0@"
  tl: "@a@b%a000140把王的書信\n放進了%a001400！\n@c0@"
128:
  en: "@aKing Somnus@bThe sacred village of Ghent lies in the mountains to the north of here.\n@c0@"
  ja: "@a@bレイドック王「ゲント族の村は\n\tここより　北の山のなか。\n@c0@"
