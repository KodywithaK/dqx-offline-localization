  sl: "@a@b＊：不行！没有船的话，\n　　就到不了姆多的岛！\n@c0@"
  tl: "@a@b＊：不行！沒有船的話，\n　　就到不了姆多的島！\n@c0@"
99:
  en: "@a@b*: Mind you, even with a ship, we'll only be able to take a fraction of the troops. We don't want a repeat of last time...\n@c0@"
  ja: "@a@b＊「しかし　船だと　多くの兵士を\n\tはこべないし　また　あんなことに\n\tなってしまったら。　ふーむ。\n@c0@"
  ko: "@a@b*: 폐하와 왕비님이 잠에서 깨어나신 뒤로\n병사들의 사기도 높아졌습니다!\n@c0@"
  sl: "@a@b＊：但是用船又运不了多少士兵，\n　　势必又一次失败。\n　　嗯……\n@c0@"
  tl: "@a@b＊：但是用船又運不了多少士兵，\n　　勢必又一次失敗。\n　　嗯……\n@c0@"
100:
  en: "@a@b*: So I hear that we owe the kingdom's revival of fortune to you!\n@c0@"
