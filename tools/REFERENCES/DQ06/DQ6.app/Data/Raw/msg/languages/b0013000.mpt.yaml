  sl: "@a@b雷多克王：你们来了。\n　　劳烦你们了。\n　　我要说的不是别的。\n@c0@"
  tl: "@a@b雷多克王：你們來了。\n　　勞煩你們了。\n　　我要說的不是別的。\n@c0@"
109:
  en: "@aKing Somnus@bIt is Murdaw alone who occupies my thoughts. Thanks to your courage, he has been banished from the dream world.\n@c0@"
  ja: "@a@bレイドック王「魔王ムドーのことだ。\n\tそなたたちの　おかげで\n\t夢の世界のムドーは　もう　いない。\n@c0@"
  ko: "@a@b*: 그렇습니까......\n꿈이 없는 분이군요.\n@c0@"
  sl: "@a@b雷多克王：是关于魔王姆多。\n　　拜你们所赐，\n　　梦世界的姆多消失了。\n@c0@"
  tl: "@a@b雷多克王：是關於魔王姆多。\n　　拜你們所賜，\n　　夢世界的姆多消失了。\n@c0@"
110:
  en: "@aKing Somnus@bBut in this world, he is very much alive and well. And his power is growing...\n@c0@"
  ja: "@a@bレイドック王「しかし　こちらの世界の\n\tムドーは　日増しに　強大な存在と\n\tなっていっているようなのだ。\n@c0@"
  ko: "@a@b*: 레이독 폐하라면\n잠시 바람을 쐬고 오겠다며\n밖으로 나가셨습니다만.\n@c0@"
  sl: "@a@b雷多克王：但是，这个世界中，\n　　姆多的力量似乎越来越强大。\n@c0@"
  tl: "@a@b雷多克王：但是，這個世界中，\n　　姆多的力量似乎越來越強大。\n@c0@"
111:
  en: "@aKing Somnus@bIf we do not strike soon, this world will fall into his clutches. This is the thought that haunts me.\n@c0@"
  ja: "@a@bレイドック王「このままにしておけば\n\tやがて世界は　ムドーの手に\n\tおちてしまうだろう。\n@c0@"
  ko: "@a@b레이독 왕: 와 주었군.\n귀찮게 해서 미안하네.\n다름이 아니라...... \n@c0@"
  sl: "@a@b雷多克王：如果放任不管的话，\n　　世界就会被姆多统治。\n@c0@"
  tl: "@a@b雷多克王：如果放任不管的話，\n　　世界就會被姆多統治。\n@c0@"
112:
  en: "@aKing Somnus@bYet there is no cause for despair! We still have time!\n@c0@"
  ja: "@a@bレイドック王「しかし　今なら\n\tまだ　間に合うはず！\n@c0@"
  ko: "@a@b레이독 왕: 마왕 무도에 대해서일세.\n그대들 덕분에\n꿈의 세계 속 무도는 이제 없어.\n@c0@"
  sl: "@a@b雷多克王：但是，现在动手还来得及！\n@c0@"
