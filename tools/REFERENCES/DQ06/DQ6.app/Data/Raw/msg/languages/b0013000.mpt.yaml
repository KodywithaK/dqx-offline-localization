  tl: "@a@b雷多克王：拜託！\n　　請務必答應！\n@c0@"
116:
  en: "@aKing Somnus@bI am saddened to hear this, but I understand.\n@c0@"
  ja: "@a@bレイドック王「そうか……。\n\tやはり　気がすすまぬか……。\n@c0@"
  ko: "@a@b레이독 왕: 부탁하네.\n나 대신 무도를 토벌하러\n가줄 수 없겠나?\n@c0@"
  sl: "@a@b雷多克王：这样啊……\n　　果然不愿意做啊……\n@c0@"
  tl: "@a@b雷多克王：這樣啊……\n　　果然不願意做啊……\n@c0@"
117:
  en: "@aKing Somnus@bYou have battled bravely already, and I have no right to insist.\n@c0@"
  ja: "@a@bレイドック王「あい　わかった！\n\t無理には　たのまぬ。\n@c0@"
  ko: "@a@b레이독 왕: 꿈과 현실, 두 세계를\n오가는 그대들이라면\n속임수 따위도 이겨낼 수 있을 터.\n@c0@"
  sl: "@a@b雷多克王：嗯，明白了！\n　　我不会强求的。\n@c0@"
  tl: "@a@b雷多克王：嗯，明白了！\n　　我不會強求的。\n@c0@"
118:
  en: "@aKing Somnus@bI had already begun making arrangements to furnish you with a ship for the assault on Murdaw.\n@c0@"
  ja: "@a@bレイドック王「もし　行ってくれるなら\n\tそなたたちのため　船を手配する\n\tつもりじゃったが　ざんねんじゃ。\n@c0@"
  ko: "@a@b레이독 왕: 제발 부탁하네!\n내 얘긴 이상일세!\n@c0@"
  sl: "@a@b雷多克王：你们打算去的话，\n　　还想给你们弄一条船，\n　　不过真是遗憾。\n@c0@"
  tl: "@a@b雷多克王：你們打算去的話，\n　　還想給你們弄一條船，\n　　不過真是遺憾。\n@c0@"
119:
  en: "@aKing Somnus@bNow I will have to make other plans... If you have no more business here, I suggest that you leave.\n@c0@"
  ja: "@a@bレイドック王「さあ　ゆくがよい。\n\tわしは　ここで　べつの方法を\n\t考えることにしよう。\n@c0@"
  ko: "@a@b---점프---> #013517\n@c0@"
  sl: "@a@b雷多克王：请你们离开吧。\n　　我要待在这里，\n　　想想别的办法。\n@c0@"
  tl: "@a@b雷多克王：請你們離開吧。\n　　我要待在這裡，\n　　想想別的辦法。\n@c0@"
120:
  en: "@aKing Somnus@bI see that you have returned. Do you have some business with me?\n@c0@"
  ja: "@a@bレイドック王「うん　どうしたのだ？\n\tわしに　まだ　なにか用なのか？\n@c0@"
  ko: "@a@b레이독 왕: 그런가......\n역시 마음이 내키지 않는가 보군......\n@c0@"
  sl: "@a@b雷多克王：嗯，怎么了？\n　　找我还有什么事吗？\n@c0@"
  tl: "@a@b雷多克王：嗯，怎麼了？\n　　找我還有什麼事嗎？\n@c0@"
121:
  en: "@aKing Somnus@bIs it possible? Have you changed your mind? Will you take the fight to Murdaw?\n@c0@"
  ja: "@a@bレイドック王「もしや　気がかわって\n\tムドー討ばつに　行ってくれる気に\n\tなったのではっ！？\n@c0@"
  ko: "@a@b레이독 왕: 좋아, 알겠네!\n무리하게 부탁은 안 하겠네.\n@c0@"
  sl: "@a@b雷多克王：难道，\n　　你们改变了心意，\n　　愿意去讨伐姆多了？！\n@c0@"
  tl: "@a@b雷多克王：難道，\n　　你們改變了心意，\n　　願意去討伐姆多了？！\n@c0@"
122:
  en: "@aKing Somnus@bI am delighted to hear it! I sensed that you would not let me down!\n@c0@"
  ja: "@a@bレイドック王「そうかっ！\n\tそなたたちなら　きっと引きうけて\n\tくれると　信じていたぞっ！\n@c0@"
  ko: "@a@b레이독 왕: 만약 가 준다면\n그대들을 위해 배를 내어줄\n생각이었는데 아쉽군.\n@c0@"
  sl: "@a@b雷多克王：是吗！\n　　我就知道你们一定会答应的！\n@c0@"
  tl: "@a@b雷多克王：是嗎！\n　　我就知道你們一定會答應的！\n@c0@"
123:
  en: "@aKing Somnus@bAlas, I am afraid that we no longer have a ship capable of transporting our troops to the battlefield...\n@c0@"
  ja: "@a@bレイドック王「ところで\n\tじつは　この城には……\n\t㈢㈢もう船は　ないんじゃ。\n@c0@"
  ko: "@a@b레이독 왕: 그만 돌아가게나.\n나는 여기서 다른 방법을\n궁리해야겠네.\n@c0@"
  sl: "@a@b雷多克王：不过，这座城里……\n　　㈢㈢已经没有船了。\n@c0@"
  tl: "@a@b雷多克王：不過，這座城裡……\n　　㈢㈢已經沒有船了。\n@c0@"
124:
  en: "@aKing Somnus@bBut we need not despair just yet — have you heard of the sacred village of Ghent?\n@c0@"
  ja: "@a@bレイドック王「じゃが　心配はいらんぞ。\n\tそなたらは　ゲント族という民族を\n\t知っておるか？\n@c0@"
  ko: "@a@b레이독 왕: 응? 왜 그러는가? \n내게 아직 볼일이 남아 있나?\n@c0@"
  sl: "@a@b雷多克王：但是，不必担心。\n　　你们知道根特族吗？\n@c0@"
  tl: "@a@b雷多克王：但是，不必擔心。\n　　你們知道根特族嗎？\n@c0@"
125:
  en: "@aKing Somnus@bThe devout people of this Goddess-fearing place possess a sacred ship known as the Providence.\n@c0@"
  ja: "@a@bレイドック王「彼らは　神の使いとされ\n\t彼らの神殿には　神の船とよばれる\n\t船が　まつられているのじゃ。\n@c0@"
  ko: "@a@b레이독 왕: 혹시 마음이 변해서\n무도를 토벌하러\n가줄 생각인가!?\n@c0@"
  sl: "@a@b雷多克王：他们被称为神之使者，\n　　他们的神殿中，\n　　有一条名叫神之船的大船。\n@c0@"
  tl: "@a@b雷多克王：他們被稱為神之使者，\n　　他們的神殿中，\n　　有一條名叫神之船的大船。\n@c0@"
126:
  en: "@aKing Somnus@bGo to Ghent and show the authorities this Royal Missive I have prepared for you.\n㈡\nThey will be sure to give you free use of the Providence.\n@c0@"
  ja: "@a@bレイドック王「ここに　わしが書いた\n\t紹介状がある。　これを見せれば\n\tきっと船を　かしてくれるじゃろう。\n@c0@"
