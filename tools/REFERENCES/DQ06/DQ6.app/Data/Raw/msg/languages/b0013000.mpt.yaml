  ko: "@a@b*: 당장이라도 무도를 쓰러뜨릴\n기세인데 폐하는 어째서\n명령을 안 내리시는지...... \n@c0@"
  sl: "@a@b＊：啊啊！我听说了！\n　　国王能恢复健康，\n　　都是你的功劳。\n@c0@"
  tl: "@a@b＊：啊啊！我聽說了！\n　　國王能恢復健康，\n　　都是你的功勞。\n@c0@"
101:
  en: "@a@b*: I don't know how you managed to rouse the King and Queen from their slumber, but I'm impressed!\n@c0@"
  ja: "@a@b＊「どういう　いきさつかは知りませぬが\n\tありがとうございましたっ！\n@c0@"
  ko: "@a@b*: 안 되겠어! 역시 배가 있어야\n무도가 있는 섬에 갈 수 있겠어!\n@c0@"
  sl: "@a@b＊：虽然不清楚事情的经过，\n　　不过非常感谢你！\n@c0@"
  tl: "@a@b＊：雖然不清楚事情的經過，\n　　不過非常感謝你！\n@c0@"
102:
  en: "@a@b*: Imagine it! A world where each and every one of us can meet the self of our dreams!\n@c0@"
  ja: "@a@b＊「王さまが　言うように\n\t夢の世界が　本当に　あるのなら\n\t行ってみたいものですね。\n@c0@"
  ko: "@a@b*: 하지만 배라면 병사를 많이\n데리고 갈 수 없고 전과 같은 \n일이 또 벌어진다면... 흠.\n@c0@"
  sl: "@a@b＊：如果梦世界真的像\n　　国王说的那样存在的话，\n　　我想去看看啊。\n@c0@"
  tl: "@a@b＊：如果夢世界真的像\n　　國王說的那樣存在的話，\n　　我想去看看啊。\n@c0@"
103:
  en: "@a@b*: Who am I in this dream world? Am I a poet, as I am here, or something entirely different? Like a pirate!\n@c0@"
  ja: "@a@b＊「そこには　この私と同じ　しかし\n\t別の私がいて　今の私とは\n\tちがう生活を　しているのかも……。\n@c0@"
  ko: "@a@b*: 아아! 얘기 들었습니다!\n폐하가 건강해진 건\n모두 당신 덕분이라고.\n@c0@"
  sl: "@a@b＊：看看那边的另一个我，\n　　跟现在的我\n　　有怎样的不同……\n@c0@"
  tl: "@a@b＊：看看那邊的另一個我，\n　　跟現在的我\n　　有怎樣的不同……\n@c0@"
104:
  en: "@a@b*: Wouldn't you like to meet your dream self one day?\n@c0@"
  ja: "@a@b＊「もうひとりの自分と　会って\n\t話してみたいと　思いませんか？\n@c0@"
  ko: "@a@b*: 전후 사정은 잘 모르겠지만\n아무튼 고마웠습니다!\n@c0@"
  sl: "@a@b＊：你想不想跟另一个自己对话？\n@c0@"
  tl: "@a@b＊：你想不想跟另一個自己對話？\n@c0@"
105:
  en: "@a@b*: Yes, you share my yearning to know who we are in that other world. But can it really be possible...?\n@c0@"
  ja: "@a@b＊「そうでしょうとも！\n\tしかし　そんなことが　本当に\n\tできるのでしょうか……。\n@c0@"
  ko: "@a@b*: 폐하의 말씀대로\n꿈의 세계가 정말로 있다면\n한번 가보고 싶군요.\n@c0@"
  sl: "@a@b＊：英雄所见略同！\n　　但是，这种事情\n　　真的能做到吗……\n@c0@"
  tl: "@a@b＊：英雄所見略同！\n　　但是，這種事情\n　　真的能做到嗎……\n@c0@"
106:
  en: "@a@b*: Hmph! You're a very unimaginative sort, aren't you? Well, leave the dreaming to poets like me!\n@c0@"
  ja: "@a@b＊「そうですか……。\n\t夢のないひとですね。\n@c0@"
  ko: "@a@b*: 그곳에는 또 하나의 내가 존재하고\n지금의 나와는 다른\n생활을 하고 있는지도......\n@c0@"
  sl: "@a@b＊：是这样啊……\n　　你这没有梦想的人。\n@c0@"
  tl: "@a@b＊：是這樣啊……\n　　你這沒有夢想的人。\n@c0@"
107:
  en: "@a@b*: If you seek the King, he is taking the air outside.\n@c0@"
  ja: "@a@b＊「レイドック王なら\n\tすこし風にあたると　申されて\n\t外に出てゆかれましたが。\n@c0@"
  ko: "@a@b*: 또 다른 나 자신과 만나\n이야기해 보고 싶지 않나요?\n@c0@"
  sl: "@a@b＊：雷多克王说\n　　他要到外面吹吹风。\n@c0@"
  tl: "@a@b＊：雷多克王說\n　　他要到外面吹吹風。\n@c0@"
108:
  en: "@aKing Somnus@bThank you for joining me. My only concern now that I am awake is... Well, I am sure that you can guess.\n@c0@"
  ja: "@a@bレイドック王「来てくれたか。\n\tわざわざ　すまんな。\n\t話というのは　ほかでもない。\n@c0@"
