115:
  en: "@aKing Somnus@bWill you take on the heavy burden of this mission? The entire Kingdom of Somnia will stand beside you.\n@c0@"
  ja: "@a@bレイドック王「たのむっ！\n\tこのとおりじゃ！\n@c0@"
  ko: "@a@b레이독 왕: 하지만 지금이라면\n아직 늦지 않았을 터!\n@c0@"
