  sl: "@a@b雷多克王：根特族的村子\n　　在北方之山里。\n@c0@"
  tl: "@a@b雷多克王：根特族的村子\n　　在北方之山裡。\n@c0@"
129:
  en: "@aKing Somnus@bI have ordered the checkpoint that guards the path to the northern mountains be opened. I wish you Goddesspeed!\n@c0@"
  ja: "@a@bレイドック王「北の山に　はいる関所を\n\tそなたたちのために　ひらかせよう。\n\t気をつけて　ゆくのじゃぞ。\n@c0@"
