0:
  en: "@a%0%a002020@bWell, I don't think he was jerking us around. He was talking about HIS castle!\n@c0@"
  ja: "@a@b%a002020「あれは　べつに\n\tウソじゃないんだよ。\n\tだから　城に行けば　いいのよ！\n@c0@"
  ko: "@a@b%a002020: 그건 분명\n거짓말이 아니야.\n그러니까 성에 가면 되는 거야!\n@c0@"
  sl: "@a@b%a002020：那不是骗人的。\n　　所以我们只要去城堡就对了！\n@c0@"
  tl: "@a@b%a002020：那不是騙人的。\n　　所以我們只要去城堡就對了！\n@c0@"
1:
  en: "@a%0%a002020@bYou follow me, %a000090?\n@c0@"
  ja: "@a@b%a002020「ねっ　%a000090。\n\tもう　わかったでしょ？\n@c0@"
  ko: "@a@b%a002020: 어때, %a000090.\n이제 알겠지?\n@c0@"
  sl: "@a@b%a002020：%a000090。\n　　你明白了吗？\n@c0@"
  tl: "@a@b%a002020：%a000090。\n　　你明白了嗎？\n@c0@"
2:
  en: "@a%0%a002020@bHee hee! I knew you'd understand. So what are we waiting for? Let's go!\n@c0@"
  ja: "@a@b%a002020「さすが　%a000090だわ。\n\tじゃあ　あとは　まかせたからね。\n@c0@"
  ko: "@a@b%a002020: 역시 %a000090%F0090%X야%Y이야%Z.\n자, 이젠 네가 알아서 해.\n@c0@"
  sl: "@a@b%a002020：不愧是%a000090。\n　　那就请你带路喽。\n@c0@"
  tl: "@a@b%a002020：不愧是%a000090。\n　　那就請你帶路嘍。\n@c0@"
3:
  en: "@a%0%a002020@bSeriously? Helllooo! He was talking about his castle, but not necessarily this castle. Don't think so one-dimensionally!\n@c0@"
  ja: "@a@b%a002020「もう　しょうがないわねえ。\n\tお城は　お城でも　ここでは\n\tなかったのよ。\n@c0@"
  ko: "@a@b%a002020: 정말, 그렇게 모르겠어?\n성은 성인데 여기가\n아니란 뜻이라구.\n@c0@"
  sl: "@a@b%a002020：哎呀真是笨死啦。\n　　城堡是城堡，\n　　不过不是这个城堡啊。\n@c0@"
  tl: "@a@b%a002020：哎呀真是笨死啦。\n　　城堡是城堡，\n　　不過不是這個城堡啊。\n@c0@"
4:
  en: "@a%0%a002020@bThere's more than one Somnia Castle out there, right? So go pay the other one a visit! Sheesh. What would you do without me?\n@c0@"
  ja: "@a@b%a002020「ここ以外に　もうひとつ\n\tレイドック城が　あるでしょ。\n\tさあ　行こう　%a000090！\n@c0@"
  ko: "@a@b%a002020: 여기 말고 또 다른\n레이독 성이 있을 거야.\n자, 가자. %a000090!\n@c0@"
  sl: "@a@b%a002020：除了这里以外，\n　　还有一个雷多克城对吧。\n　　走吧，%a000090！\n@c0@"
  tl: "@a@b%a002020：除了這裡以外，\n　　還有一個雷多克城對吧。\n　　走吧，%a000090！\n@c0@"
5:
  en: "@a%0%a002000@bHey, what's goin' on here, aye?\n@c0@"
  ja: "@a@b%a002000「まったく……。\n\tどうなっているんだか……。\n@c0@"
  ko: "@a@b%a002000: 젠장.......\n뭐가 어떻게 돌아가는 거야......\n@c0@"
  sl: "@a@b%a002000：真是的……\n　　到底啥意思嘛……\n@c0@"
  tl: "@a@b%a002000：真是的……\n　　到底啥意思嘛……\n@c0@"
6:
  en: "@a%0%a002000@bDidn't the King say he had a reward waitin' for us when we got back to the castle?\n@c0@"
  ja: "@a@b%a002000「ほうびをやるから\n\tあとで　城に来い　なんて\n\t言っておいてよ。\n@c0@"
  ko: "@a@b%a002000: 포상을 줄 테니\n나중에 성으로\n오라더니.\n@c0@"
  sl: "@a@b%a002000：说是要奖赏咱，\n　　让咱来城堡里。\n@c0@"
  tl: "@a@b%a002000：說是要獎賞咱，\n　　讓咱來城堡裡。\n@c0@"
7:
  en: "@a%0%a002000@bAnd then he heads for the hills when we come to collect! Ya think he's playin' us for suckers?\n@c0@"
  ja: "@a@b%a002000「それで　どこかに\n\t行っちゃうとは　オレたちを\n\tバカにしてるとは思わねえか？\n@c0@"
  ko: "@a@b%a002000: 그래 놓고 어디론가\n사라지다니, 우리를\n바보로 만들 셈인가?\n@c0@"
  sl: "@a@b%a002000：现在不知道跑哪去了，\n　　难道把咱们当傻瓜了吗？\n@c0@"
  tl: "@a@b%a002000：現在不知道跑哪去了，\n　　難道把咱們當傻瓜了嗎？\n@c0@"
8:
  en: "@a%0%a002000@bAye, you said it, man.\n@c0@"
  ja: "@a@b%a002000「ほんと　そうだよなあ。\n@c0@"
  ko: "@a@b%a002000: 진짜 그런 모양이군.\n@c0@"
  sl: "@a@b%a002000：俺看就是这样。\n@c0@"
  tl: "@a@b%a002000：俺看就是這樣。\n@c0@"
9:
  en: "@a%0%a002020@bShh! Keep it down, guys. The Chancellor can hear you!\n@c0@"
  ja: "@a@b%a002020「シーーーーッ！\n\tちょっと　あんた　声が大きいわよっ。\n\t大臣さんに　聞こえるでしょ。\n@c0@"
  ko: "@a@b%a002020: 쉬잇, 조용!\n목소리가 너무 크잖아.\n그러다 대신님이 듣겠어.\n@c0@"
  sl: "@a@b%a002020：嘘～～\n　　你小声一点。\n　　别被大臣听见。\n@c0@"
  tl: "@a@b%a002020：噓～～\n　　你小聲一點。\n　　別被大臣聽見。\n@c0@"
10:
  en: "@a%0%a002000@bEh? I like ya, %a000090, but sometimes I just don't get ya.\n@c0@"
  ja: "@a@b%a002000「なんだよ　%a000090\n\tなにか　言いたそうだな。\n@c0@"
  ko: "@a@b%a002000: 뭐야, %a000090.\n하고 싶은 말이라도 있나 보군.\n@c0@"
  sl: "@a@b%a002000：气死俺了。%a000090，\n　　你倒是说句话啊。\n@c0@"
  tl: "@a@b%a002000：氣死俺了。%a000090，\n　　你倒是說句話啊。\n@c0@"
11:
  en: "@a%0%a002000@bYer too trustin' 'n' everything like that. It could get ya in real trouble some day.\n@c0@"
  ja: "@a@b%a002000「まっ　おひとよしの\n\tおまえのことだから　腹をたてたりは\n\tしてないんだろうさ。\n@c0@"
  ko: "@a@b%a002000: 너야 호인이니까\n설마 화를 내거나\n하지 않겠지.\n@c0@"
  sl: "@a@b%a002000：算了，你这老好人，\n　　大概字典里没有生气两个字吧。\n@c0@"
  tl: "@a@b%a002000：算了，你這老好人，\n　　大概字典裡沒有生氣兩個字吧。\n@c0@"
12:
  en: "@a@b*: Ah, pardon me. I am an itinerant priest, as you can see. If I can be of service to you...\n@c0@"
  ja: "@a@b＊「見てのとおり　私は旅の神父です。\n\tこんな私に　できることと\n\tいったら……。\n@c0@"
  ko: "@a@b*: 보시다시피 저는 여행 중인 신부입니다.\n이런 제가 할 수 있는\n일이라면......\n@c0@"
  sl: "@a@b＊：如你所见，我是旅行的神父。\n　　说到我能做的事情……\n@c0@"
  tl: "@a@b＊：如你所見，我是旅行的神父。\n　　說到我能做的事情……\n@c0@"
13:
  en: "@a@b*: The good times are back in Somnia!\n@c0@"
  ja: "@a@b＊「わっはっはっはっ。\n\tゆかい　ゆかい！\n@c0@"
  ko: "@a@b*: 와하하핫.\n좋다 좋아!\n@c0@"
  sl: "@a@b＊：哇哈哈哈。\n　　太棒了，太爽了！\n@c0@"
  tl: "@a@b＊：哇哈哈哈。\n　　太棒了，太爽了！\n@c0@"
14:
  en: "@a@b*: The King's awake again and that grasping Chancellor Keating has left the castle in disgrace!\n@c0@"
  ja: "@a@b＊「王さまが　目ざめられたら\n\t大臣のゲバンは　お城を\n\t出ていっちゃいましたよ。\n@c0@"
  ko: "@a@b*: 페하께서 눈을 뜨시니\n대신인 게반이 성을\n나가 버렸답니다.\n@c0@"
  sl: "@a@b＊：国王醒来之后\n　　就把盖班大臣\n　　赶出了城堡。\n@c0@"
  tl: "@a@b＊：國王醒來之後\n　　就把蓋班大臣\n　　趕出了城堡。\n@c0@"
15:
  en: "@a@b*: Maybe now our fine, upstanding Captain Rusty will have his unfairly tarnished reputation restored...\n@c0@"
  ja: "@a@b＊「これで　トム兵士長も\n\tうかばれるってもんですよ。\n@c0@"
  ko: "@a@b*: 이제야 톰 병사단장도\n편히 잠들 수 있겠군요.\n@c0@"
  sl: "@a@b＊：这样一来，\n　　托姆士兵长也能瞑目了。\n@c0@"
  tl: "@a@b＊：這樣一來，\n　　托姆士兵長也能瞑目了。\n@c0@"
16:
  en: "@a@b*: Everyone in Somnia's so happy. I feel like I'm walking on air! Yippee!\n@c0@"
  ja: "@a@b＊「わーい　王さまの病気が\n\tなおったよ。　わーい。\n@c0@"
  ko: "@a@b*: 와아~ 폐하의 병이\n나았어. 와아~\n@c0@"
  sl: "@a@b＊：万岁，万岁，\n　　国王的病治好啦。\n@c0@"
  tl: "@a@b＊：萬歲，萬歲，\n　　國王的病治好啦。\n@c0@"
17:
  en: "@a@b*: The King and Queen have woken up! The Kingdom of Somnia is officially back on its feet!\n@c0@"
  ja: "@a@b＊「おい！　知ってるかっ！？\n\tついに　王と王妃さまが\n\t目ざめられたぜっ！\n@c0@"
  ko: "@a@b*: 어이! 알고 있나!?\n드디어 왕과 왕비님이\n잠에서 깨어났어!\n@c0@"
  sl: "@a@b＊：喂！你知道吗？\n　　国王和王妃终于醒了！\n@c0@"
  tl: "@a@b＊：喂！你知道嗎？\n　　國王和王妃終於醒了！\n@c0@"
18:
  en: "@a@b*: This calls for a celebration! I think I'm goin' to buy a commemorative flagon!\n@c0@"
  ja: "@a@b＊「つうことは　ご病気も\n\tなおったって　ことだな。\n\tいや～　めでてえなあ　おい！\n@c0@"
  ko: "@a@b*: 말하자면 병환이\n나았다는 뜻이지.\n이야~ 이런 경사가 또 어디 있겠어!\n@c0@"
  sl: "@a@b＊：也就是说，\n　　他们的病治好了吧。\n　　啊，可喜可贺呀，是吧！\n@c0@"
  tl: "@a@b＊：也就是說，\n　　他們的病治好了吧。\n　　啊，可喜可賀呀，是吧！\n@c0@"
19:
  en: "@a@b*: My dad's the biggest, bravest, bestest soldier up at the castle!\n@c0@"
  ja: "@a@b＊「ボクの父ちゃん\n\tトム兵士長と　仲がよかったんだ。\n@c0@"
  ko: "@a@b*: 우리 아빠는\n톰 병사단장이랑 친했거든.\n@c0@"
  sl: "@a@b＊：我爸爸跟托姆士兵长\n　　关系可好了。\n@c0@"
  tl: "@a@b＊：我爸爸跟托姆士兵長\n　　關係可好了。\n@c0@"
20:
  en: "@a@b*: He says that what happened to Captain Rusty wasn't fair, and my dad's never wrong!\n@c0@"
  ja: "@a@b＊「トム兵士長は　本当に\n\tいいひと　だったのにって\n\t父ちゃんは　言ってたよ。\n@c0@"
  ko: "@a@b*: 톰 병사단장은 참\n좋은 사람이라고\n아빠가 그랬어.\n@c0@"
  sl: "@a@b＊：爸爸说，\n　　托姆士兵长是个大好人。\n@c0@"
  tl: "@a@b＊：爸爸說，\n　　托姆士兵長是個大好人。\n@c0@"
21:
  en: "@a@b*: I'm sure you're aware of the Fake Prince Incident.\n@c0@"
  ja: "@a@b＊「ねえねえ　聞いてよ。\n\t王さまの病気がなおる　すこし前に\n\tニセ王子が　あらわれたんだけど……\n@c0@"
  ko: "@a@b*: 내 말 좀 들어 봐.\n폐하의 병이 낫기 직전에\n가짜 왕자가 나타났었는데......\n@c0@"
  sl: "@a@b＊：喂喂，听我说。\n　　国王的病治好以前，\n　　城里来了个冒牌王子……\n@c0@"
  tl: "@a@b＊：喂喂，聽我說。\n　　國王的病治好以前，\n　　城裡來了個冒牌王子……\n@c0@"
22:
  en: "@a@b*: Apparently, King Somnus is now searching for the impostor. I wonder what he wants with him...\n@c0@"
  ja: "@a@b＊「その　ニセモノの王子を\n\tこんどは　王さまが\n\tさがしているんですって。\n@c0@"
  ko: "@a@b*: 이번에는 폐하가\n오히려 그 가짜 왕자를\n찾고 있대.\n@c0@"
  sl: "@a@b＊：国王现在在找这个冒牌王子。\n@c0@"
  tl: "@a@b＊：國王現在在找這個冒牌王子。\n@c0@"
23:
  en: "@a@b*: Let me see... ‘Any information...’ ‘Fake Prince...’ ‘Go directly to the castle...’\n@c0@"
  ja: "@a@b＊「えーと　なになに\n\t王子に似た男の情報を\n\tどんなことでも　お城まで……　か。\n@c0@"
  ko: "@a@b*: 으음, 어디 보자.\n왕자와 닮은 남자의 정보는\n그 무엇이든 성에 알릴 것.....\n@c0@"
  sl: "@a@b＊：嗯，我看看……\n　　如有像王子的男性的消息，\n　　无论巨细，请上报到城堡……\n@c0@"
  tl: "@a@b＊：嗯，我看看……\n　　如有像王子的男性的消息，\n　　無論巨細，請上報到城堡……\n@c0@"
24:
  en: "@a@b*: It seems there's a hunt on for that impostor who managed to wheedle his way into the castle.\n@c0@"
  ja: "@a@b＊「これって　前に　やってきた\n\tニセ王子のことかねえ。\n@c0@"
  ko: "@a@b*: 이거 전에 왔었던\n가짜 왕자를 말하는 건가?\n@c0@"
  sl: "@a@b＊：这是说以前来的冒牌王子吧。\n@c0@"
  tl: "@a@b＊：這是說以前來的冒牌王子吧。\n@c0@"
25:
  en: "@a@b*: Has anyone ever told you that you look a lot like the Prince? But surely you couldn't be the one...\n@c0@"
  ja: "@a@b＊「おや　そういえば　あんたも\n\t王子さまに似てるよ。\n\tでも　まさかねえ……。\n@c0@"
  ko: "@a@b*: 어라, 그러고 보니 너도\n왕자님과 많이 닮았는걸?\n에이 설마.......\n@c0@"
  sl: "@a@b＊：哎呀，说起来，\n　　你也挺像王子的。\n　　不过，不可能吧……\n@c0@"
  tl: "@a@b＊：哎呀，說起來，\n　　你也挺像王子的。\n　　不過，不可能吧……\n@c0@"
26:
  en: "@a@b*: I'd warrant that the King and Queen have a higher class of dream than the likes of you and I will ever have!\n@c0@"
  ja: "@a@b＊「王さまと　王妃さまは　長い間\n\t夢の世界を　さまよっていたとか。\n\tふしぎなことも　あるものですね。\n@c0@"
  ko: "@a@b*: 폐하와 왕비님이 오랫동안\n꿈의 세계를 헤매셨다고.\n신기한 일도 다 있군요.\n@c0@"
  sl: "@a@b＊：这么长时间以来，\n　　国王和王妃都迷失在梦世界。\n　　真是不可思议的事情。\n@c0@"
  tl: "@a@b＊：這麼長時間以來，\n　　國王和王妃都迷失在夢世界。\n　　真是不可思議的事情。\n@c0@"
27:
  en: "@a@b*: There are all sorts of theories as to why the King and Queen finally awoke.\n@c0@"
  ja: "@a@b＊「王さまと王妃さまの\n\tご病気が　なおったってことはだね。\n@c0@"
  ko: "@a@b*: 폐하와 왕비님의 병환이\n나았다는 소식을 들었어.\n@c0@"
  sl: "@a@b＊：国王和王妃的病\n　　已经治好了吧。\n@c0@"
  tl: "@a@b＊：國王和王妃的病\n　　已經治好了吧。\n@c0@"
28:
  en: "@a@b*: I know why. Our dear missing Prince defeated the monster that cursed his parents. It's the only explanation.\n@c0@"
  ja: "@a@b＊「ゆくえ知れずの王子さまが　どこかで\n\t王さまたちを病気にした　怪物を\n\tやっつけたってことかねえ。\n@c0@"
  ko: "@a@b*: 행방불명인 왕자님이 어디선가\n폐하와 왕비님을 병들게 한 괴물을\n해치웠다는 것일까?\n@c0@"
  sl: "@a@b＊：大概是因为行踪不明的王子\n　　打倒了某只\n　　让国王生病的怪物。\n@c0@"
  tl: "@a@b＊：大概是因為行蹤不明的王子\n　　打倒了某隻\n　　讓國王生病的怪物。\n@c0@"
29:
  en: "@a@b*: Our brave young Prince embarked on a journey to find a cure for his parents' illness.\n@c0@"
  ja: "@a@b＊「この国の　王子さまはのう\n\t王さまと王妃さまの　病気を\n\tなおすため　旅立ったのじゃ。\n@c0@"
  ko: "@a@b*: 이 나라의 왕자님은\n왕과 왕비의 병을\n고치려고 길을 나섰다네.\n@c0@"
  sl: "@a@b＊：这个国家的王子\n　　为了治好国王和王妃\n　　而踏上了旅途。\n@c0@"
  tl: "@a@b＊：這個國家的王子\n　　為了治好國王和王妃\n　　而踏上了旅途。\n@c0@"
30:
  en: "@a@b*: Now they've recovered, it is surely time for him to return. But where is he? As ever, the common man is left in the dark.\n@c0@"
  ja: "@a@b＊「じゃが　それっきり　ゆくえ知れず。\n\tせっかく　おふたりの　ご病気も\n\tなおったというのにのう。\n@c0@"
  ko: "@a@b*: 한데 그 뒤로 행방불명이라네.\n모처럼 두 분의 병환도\n나았는데 말일세.\n@c0@"
  sl: "@a@b＊：但那之后一直下落不明。\n　　现在国王和王妃已经痊愈了，\n　　他却还没回来。\n@c0@"
