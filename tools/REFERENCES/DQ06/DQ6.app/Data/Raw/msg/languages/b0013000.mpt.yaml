  tl: "@a@b謝菈：%a000090……\n　　你真的是我們的……\n@c0@"
93:
  en: "@aQueen Apnea@b...No, never mind. I must not speak of this now. Please take care on your journey.\n@c0@"
  ja: "@a@bシェーラ「いえ。　なんでも　ありません。\n\t気をつけて　ゆくのですよ。\n@c0@"
  ko: "@a@b시엘라: 어쨌든 남편 레이독이\n구원받았으니 신에게 감사할 따름입니다.\n@c0@"
  sl: "@a@b谢菈：算了，没什么。\n　　路上小心点呀。\n@c0@"
  tl: "@a@b謝菈：算了，沒什麼。\n　　路上小心點呀。\n@c0@"
94:
  en: "@a@b*: (pat pat) There we go, the sheets are all changed!\n@c0@"
  ja: "@a@b＊「ポン　ポン……と！\n\tよし　これで　おフトンの\n\tとりかえ　おわり！\n@c0@"
  ko: "@a@b시엘라: 물론 당신에게도.\n%a000090......\n@c0@"
  sl: "@a@b＊：拍一拍……\n　　好了，\n　　被子换好了！\n@c0@"
  tl: "@a@b＊：拍一拍……\n　　好了，\n　　被子換好了！\n@c0@"
95:
  en: "@a@b*: But are the King and Queen really going to want to go back to sleep? Seems to me they've slept enough!\n@c0@"
  ja: "@a@b＊「これからは　おふたりには\n\t気持ちよく　ねむって\n\tいただかなくっちゃね！\n@c0@"
  ko: "@a@b시엘라: %a000090......\n당신은 사실 우리의......\n@c0@"
  sl: "@a@b＊：要让他们二位好好睡上一觉才行！\n@c0@"
  tl: "@a@b＊：要讓他們二位好好睡上一覺才行！\n@c0@"
96:
  en: "@a@b*: Now that the King and Queen are back with us, the troops are chock-full of vim and vigour!\n@c0@"
  ja: "@a@b＊「王と王妃さまが　めざめられて\n\t兵士たちの士気も　あがっています！\n@c0@"
  ko: "@a@b시엘라: 아니, 아무것도 아닙니다.\n조심해서 가시길.\n@c0@"
  sl: "@a@b＊：国王和王妃醒了，\n　　士兵们的士气也提升了！\n@c0@"
  tl: "@a@b＊：國王和王妃醒了，\n　　士兵們的士氣也提升了！\n@c0@"
97:
  en: "@a@b*: We can't wait to show that Murdaw what for! ...But why won't the King give the order to mobilise!?\n@c0@"
  ja: "@a@b＊「今なら　ムドーをたおせる気が\n\tするのですが　どうして　王は\n\t命令をださないのでしょうか……。\n@c0@"
  ko: "@a@b*: 탁탁...... 됐어!\n이제 이불보\n가는 일은 끝!\n@c0@"
  sl: "@a@b＊：现在大家都摩拳擦掌，\n　　准备打倒姆多，\n　　为什么国王还不下命令呢……\n@c0@"
  tl: "@a@b＊：現在大家都摩拳擦掌，\n　　準備打倒姆多，\n　　為什麼國王還不下命令呢……\n@c0@"
98:
  en: "@a@b*: Without a ship, we're not going to be able to reach the Isle of Murdaw.\n@c0@"
