  sl: "@a@b%a002050：而且，打倒姆多的居然是\n　　跟我结伴而行的各位，\n　　这又让我吃了一惊！\n@c0@"
  tl: "@a@b%a002050：而且，打倒姆多的居然是\n　　跟我結伴而行的各位，\n　　這又讓我吃了一驚！\n@c0@"
17:
  en: "@a%0%a002000@bThey weren't sick to begin with, but oh well...\n@c0@"
  ja: "@a@b%a002000「病気じゃないけど\n\tま　いっか！\n@c0@"
