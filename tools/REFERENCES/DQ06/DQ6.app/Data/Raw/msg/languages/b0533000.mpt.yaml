  tl: "@a@b%a002030：國王陛下\n　　受到人們的愛戴，\n　　這是國家之幸啊。\n@c0@"
31:
  en: "@a%0%a002050@bWell, whoever's power was responsible, the main thing is that ordinary folk are happy.\n@c0@"
  ja: "@a@b%a002050「まあ　なんにせよ\n\tよろこばしいことだと\n\t私も　思います。　はい！\n@c0@"
  ko: "@a@b%a002050: 뭐, 어쨌든\n저 역시 기쁜 일이라고\n생각합니다. 그럼요!\n@c0@"
  sl: "@a@b%a002050：哎，不管怎样，\n　　我觉得这是一件好事！\n@c0@"
  tl: "@a@b%a002050：哎，不管怎樣，\n　　我覺得這是一件好事！\n@c0@"
32:
  en: "@a%0%a002000@bAlways been a little jealous of sailors. Life's such a breeze for them. Hardy har!\n@c0@"
