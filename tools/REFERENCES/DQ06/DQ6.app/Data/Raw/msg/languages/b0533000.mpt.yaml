  sl: "@a@b%a002050：佛、佛、佛恩……\n　　走吧！朝着水门前进！\n@c0@"
  tl: "@a@b%a002050：佛、佛、佛恩……\n　　走吧！朝著水門前進！\n@c0@"
301:
  en: "@a%0%a002000@bSo Luca says there's someone in the village of Pescado who needs our help, aye?\n@c0@"
