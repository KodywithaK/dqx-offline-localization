  sl: "@a@b%a002000：猫在心情好的时候，\n　　叫的声音也不一样啊。\n@c0@"
  tl: "@a@b%a002000：貓在心情好的時候，\n　　叫的聲音也不一樣啊。\n@c0@"
23:
  en: "@a%0%a002010@bIt's nice to see such a happy cat!\n@c0@"
  ja: "@a@b%a002010「うふふ。\n\tネコちゃんも　ごきげんね！\n@c0@"
