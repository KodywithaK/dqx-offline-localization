  sl: "@a@b%a002020：我想起了佛恩王\n　　和伊丽卡公主呢！\n@c0@"
  tl: "@a@b%a002020：我想起了佛恩王\n　　和伊麗卡公主呢！\n@c0@"
298:
  en: "@a%0%a002030@bBeneath the ocean waves, cruel monsters lie in wait for hapless voyagers.\n@c0@"
