296:
  en: "@a%0%a002020@bThat's near Castle Swanstone...\n@c0@"
  ja: "@a@b%a002020「フォーン城の　近くかぁ～。\n@c0@"
  ko: "@a@b%a002020: 폰 성 근처라~\n@c0@"
  sl: "@a@b%a002020：在佛恩城附近啊～\n@c0@"
  tl: "@a@b%a002020：在佛恩城附近啊～\n@c0@"
297:
  en: "@a%0%a002020@bI can't help but remember King Ludwig and Princess Miralda!\n@c0@"
  ja: "@a@b%a002020「フォーン王と\n\tイリカ姫のこと　思い出すね！\n@c0@"
