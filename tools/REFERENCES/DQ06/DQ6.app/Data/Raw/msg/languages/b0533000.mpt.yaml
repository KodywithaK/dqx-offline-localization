  sl: "@a@b%a002030：这前面的大海中\n　　也有魔物作祟，\n　　人们苦不堪言呢。\n@c0@"
  tl: "@a@b%a002030：這前面的大海中\n　　也有魔物作祟，\n　　人們苦不堪言呢。\n@c0@"
299:
  en: "@a%0%a002030@bI pray that true peace visits land and sea in the not too distant future...\n@c0@"
  ja: "@a@b%a002030「早く　本当の\n\t平和を　取りもどさなくては！\n@c0@"
  ko: "@a@b%a002030: 어서 진짜\n평화를 되찾아야겠습니다!\n@c0@"
  sl: "@a@b%a002030：一定要尽早\n　　让世界恢复和平才行！\n@c0@"
  tl: "@a@b%a002030：一定要儘早\n　　讓世界恢復和平才行！\n@c0@"
300:
  en: "@a%0%a002050@bLet's be headin' to this floodgate, then! Time's a-wastin'!\n@c0@"
