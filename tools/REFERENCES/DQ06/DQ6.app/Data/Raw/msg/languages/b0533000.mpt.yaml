  sl: "@a@b%a002030：啊……\n　　求他别再往后看了……\n@c0@"
  tl: "@a@b%a002030：啊……\n　　求他別再往後看了……\n@c0@"
310:
  en: "@a%0%a002050@bI'm a bit sheepish about askin', but I wasn't blabberin' away in my sleep, was I?\n@c0@"
