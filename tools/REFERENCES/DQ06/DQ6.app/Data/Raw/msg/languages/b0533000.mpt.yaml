  tl: "@a@b%a002030：洛布……\n　　他去的那個洞窟裡，\n　　有什麼秘密呢？\n@c0@"
309:
  en: "@a%0%a002030@bIf only he had not insisted on continually looking back over his shoulder...\n@c0@"
