  sl: "@a@b%a002050：没错！\n　　听说姆多被打倒了，\n　　我大吃一惊。\n@c0@"
  tl: "@a@b%a002050：沒錯！\n　　聽說姆多被打倒了，\n　　我大吃一驚。\n@c0@"
16:
  en: "@a%0%a002050@bI never thought I'd end up seein' the world with the very folk who were responsible!\n@c0@"
  ja: "@a@b%a002050「しかも　たおしたのが　いま\n\tいっしょにいる人たち　なんですから\n\t二度ビックリ　ですよ！\n@c0@"
