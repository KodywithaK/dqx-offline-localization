  sl: "@a@b%a002000：昨天婆婆\n　　是让咱去帮助\n　　佩斯卡尼的什么人吧。\n@c0@"
  tl: "@a@b%a002000：昨天婆婆\n　　是讓咱去幫助\n　　佩斯卡尼的什麼人吧。\n@c0@"
302:
