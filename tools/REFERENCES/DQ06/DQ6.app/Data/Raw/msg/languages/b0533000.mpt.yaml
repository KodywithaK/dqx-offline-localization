0:
  en: "@a%0%a002000@bSo here I am again! Feels funny comin' back to the ol' place.\n@c0@"
  ja: "@a@b%a002000「よっ！　また来たぜ！\n@c0@"
  ko: "@a@b%a002000: 여어! 또 왔어!\n@c0@"
  sl: "@a@b%a002000：你好！俺们又来了！\n@c0@"
  tl: "@a@b%a002000：你好！俺們又來了！\n@c0@"
1:
  en: "@a%0%a002010@bYou know, we've been through so much together, it feels like an age since I first met you here, %a000090...\n@c0@"
  ja: "@a@b%a002010「いろいろあったから\n\t%a000090たちと　出会ったのが\n\tすごく　前だったように　感じるわ。\n@c0@"
  ko: "@a@b%a002010: 그동안 많은 일이 있어서\n%a000090 일행과 만났던 게\n훨씬 옛날처럼 느껴져.\n@c0@"
  sl: "@a@b%a002010：经历了这么多事情，\n　　总觉得遇到%a000090你们\n　　好像是很久之前的事了。\n@c0@"
  tl: "@a@b%a002010：經歷了這麼多事情，\n　　總覺得遇到%a000090你們\n　　好像是很久之前的事了。\n@c0@"
2:
  en: "@a%0%a002020@bYahoo! We made it to Port Haven!\n@c0@"
  ja: "@a@b%a002020「サンマリーノに\n\tついた～！\n@c0@"
  ko: "@a@b%a002020: 산마리노\n도착~!\n@c0@"
  sl: "@a@b%a002020：到圣马力诺啦～\n@c0@"
  tl: "@a@b%a002020：到聖馬力諾啦～\n@c0@"
3:
  en: "@a%0%a002030@bPort Haven... That's a fine name for a town. May it offer us a haven from the storms of life!\n@c0@"
  ja: "@a@b%a002030「サンマリーノ。\n\t明るい　感じのする\n\tいい名前の　町ですよね。\n@c0@"
  ko: "@a@b%a002030: 산마리노.\n밝은 느낌이 드는 게\n좋은 이름의 마을이네요.\n@c0@"
  sl: "@a@b%a002030：圣马力诺。\n　　这个镇子的名字听起来\n　　就让人觉得神清气爽呢。\n@c0@"
  tl: "@a@b%a002030：聖馬力諾。\n　　這個鎮子的名字聽起來\n　　就讓人覺得神清氣爽呢。\n@c0@"
4:
  en: "@a%0%a002050@b(sniff) Ahh... Now that's a fine sea breeze for you!\n@c0@"
  ja: "@a@b%a002050「くんくん。\n\t海の　においがしますね。\n@c0@"
  ko: "@a@b%a002050: 킁킁.\n바다 냄새가 나네요.\n@c0@"
  sl: "@a@b%a002050：呵呵。\n　　闻到海的味道了呢。\n@c0@"
  tl: "@a@b%a002050：呵呵。\n　　聞到海的味道了呢。\n@c0@"
5:
  en: "@a%0%a002000@bWell, I ain't no out-of-towner, and Mayor %a002000 does have a nice ring to it...\n@c0@"
  ja: "@a@b%a002000「町長……か。\n\tまあ　オレは　この町の\n\t生まれだけどさ……。\n@c0@"
  ko: "@a@b%a002000: 촌장이라......\n뭐, 나는 이 마을에서\n태어나긴 했지만......\n@c0@"
  sl: "@a@b%a002000：镇长啊……\n　　唉，俺倒是在这个镇子里\n　　出生的……\n@c0@"
  tl: "@a@b%a002000：鎮長啊……\n　　唉，俺倒是在這個鎮子裡\n　　出生的……\n@c0@"
6:
  en: "@a%0%a002000@b...But I'm not ready to run for office 'n' everything like that. I've got places to visit and monsters to bash!\n@c0@"
  ja: "@a@b%a002000「ここに　落ち着くより\n\tまだまだ　みんなと\n\t旅を　続けたいしな！\n@c0@"
  ko: "@a@b%a002000: 여기에 정착하기보다는\n아직 너희와\n여행을 계속하고 싶단 말이지!\n@c0@"
  sl: "@a@b%a002000：与其在这里虚度光阴，\n　　还不如和大伙一起闯荡世界\n　　来得痛快！\n@c0@"
  tl: "@a@b%a002000：與其在這裡虛度光陰，\n　　還不如和大夥一起闖蕩世界\n　　來得痛快！\n@c0@"
7:
  en: "@a%0%a002010@bI'm glad the Mayor's job isn't being offered around willy-nilly. It's a position with a lot of responsibility.\n@c0@"
  ja: "@a@b%a002010「だれでも\n\tいいってものじゃ\n\tないものね。\n@c0@"
  ko: "@a@b%a002010: 아무나\n할 수 있는 게\n아닌가 보네.\n@c0@"
  sl: "@a@b%a002010：并不是说谁都可以哦。\n@c0@"
  tl: "@a@b%a002010：並不是說誰都可以哦。\n@c0@"
8:
  en: "@a%0%a002020@bMakes sense to me. Picking strangers for mayor isn't what I'd call smart government.\n@c0@"
  ja: "@a@b%a002020「びっくりした～！\n\t町長に　ならないか　だなんて\n\tいくらなんでも　とっぴよね。\n@c0@"
  ko: "@a@b%a002020: 깜짝이야~!\n촌장을 해 보라니\n아무리 그래도 너무 갑작스럽잖아.\n@c0@"
  sl: "@a@b%a002020：吓死啦～\n　　居然问我们要不要当镇长\n　　这么不着边际的问题。\n@c0@"
  tl: "@a@b%a002020：嚇死啦～\n　　居然問我們要不要當鎮長\n　　這麼不著邊際的問題。\n@c0@"
9:
  en: "@a%0%a002030@bI pray that a suitable mayor makes an appearance before long. It's certainly not my idea of a dream job...\n@c0@"
  ja: "@a@b%a002030「まあ　そのうちに\n\t町長に　ふさわしい\n\tこうほしゃが　あらわれますよ。\n@c0@"
  ko: "@a@b%a002030: 뭐, 곧\n촌장에 걸맞은\n후보자가 나올 겁니다.\n@c0@"
  sl: "@a@b%a002030：哎，镇长的最佳继任者\n　　一定会出现的。\n@c0@"
  tl: "@a@b%a002030：哎，鎮長的最佳繼任者\n　　一定會出現的。\n@c0@"
10:
  en: "@a%0%a002050@bI was a bit worried she was gonna make old %a002050 mayor there! Town hero's one thing, but town leader!?\n@c0@"
  ja: "@a@b%a002050「ああ　よかった……。\n\t私が　たのまれたら\n\tどうしようかと　思いましたよ。\n@c0@"
  ko: "@a@b%a002050: 아, 다행이다......\n저한테 하라고 하면\n어떻게 해야 하나 싶었거든요.\n@c0@"
  sl: "@a@b%a002050：啊，太好了……\n　　要是我被委以如此重任，\n　　绝对会惊慌失措的。\n@c0@"
  tl: "@a@b%a002050：啊，太好了……\n　　要是我被委以如此重任，\n　　絕對會驚慌失措的。\n@c0@"
11:
  en: "@a%0%a002000@bAye, here's hopin' his sales pick up. It'd be good to see my hometown thrivin'!\n@c0@"
  ja: "@a@b%a002000「うんうん。\n\t安心して　暮らしてくれよな！\n@c0@"
  ko: "@a@b%a002000: 그래.\n마음 놓고 지내라고!\n@c0@"
  sl: "@a@b%a002000：嗯嗯。\n　　可以过安稳日子了吧！\n@c0@"
  tl: "@a@b%a002000：嗯嗯。\n　　可以過安穩日子了吧！\n@c0@"
12:
  en: "@a%0%a002010@bHe really is excited!\n@c0@"
  ja: "@a@b%a002010「とっても　うれしそうね。\n@c0@"
  ko: "@a@b%a002010: 정말 기뻐 보이네.\n@c0@"
  sl: "@a@b%a002010：看起来真开心啊。\n@c0@"
  tl: "@a@b%a002010：看起來真開心啊。\n@c0@"
13:
  en: "@a%0%a002020@bI bet he'd be even more shocked if he heard that we're the heroes who beat him!\n@c0@"
  ja: "@a@b%a002020「あたしたちが\n\tムドーを　たおしたっていったら\n\tもっと　ビックリするよね。\n@c0@"
  ko: "@a@b%a002020: 우리가\n무도를 쓰러뜨렸다고 말하면\n더 깜짝 놀라겠네.\n@c0@"
  sl: "@a@b%a002020：要是告诉他们\n　　是我们打倒姆多的，\n　　大家肯定会更吃惊的吧。\n@c0@"
  tl: "@a@b%a002020：要是告訴他們\n　　是我們打倒姆多的，\n　　大家肯定會更吃驚的吧。\n@c0@"
14:
  en: "@a%0%a002030@bIt's a fine thing to see a smile on every face!\n@c0@"
  ja: "@a@b%a002030「この町の人たちも\n\t表情が　明るいですね。\n@c0@"
  ko: "@a@b%a002030: 이 마을 사람들도\n표정이 밝군요.\n@c0@"
  sl: "@a@b%a002030：这个镇上的人们，\n　　脸上都洋溢着开心的笑容呢。\n@c0@"
  tl: "@a@b%a002030：這個鎮上的人們，\n　　臉上都洋溢著開心的笑容呢。\n@c0@"
15:
  en: "@a%0%a002050@bI remember I wasn't half shocked when I heard Murdaw had been beaten.\n@c0@"
  ja: "@a@b%a002050「そう！　私も　ムドーが\n\tたおされたと　聞いたときには\n\tビックリしましたよ。\n@c0@"
