21:
  en: "@a%0%a002050@bI used to have problems sleepin' myself, but thanks to %a000090 and company, I'm over 'em now!\n@c0@"
  ja: "@a@b%a002050「私も　この方たちに\n\t病気を　なおして\n\tいただいたんですよ！\n@c0@"
  ko: "@a@b%a002050: 제 병도\n이분들이 낫게 해\n주셨답니다!\n@c0@"
  sl: "@a@b%a002050：我的病也是被\n　　这里的各位治好的哦！\n@c0@"
  tl: "@a@b%a002050：我的病也是被\n　　這裡的各位治好的哦！\n@c0@"
22:
  en: "@a%0%a002000@bEven the cat seems to be in a good mood.\n@c0@"
  ja: "@a@b%a002000「ネコだって　うれしいときには\n\t声が　ちがうようだな。\n@c0@"
