  en: "@a%0%a002020@bWow! The start of another adventure, huh? Keep 'em coming, I say!\n@c0@"
  ja: "@a@b%a002020「また　新しい\n\tぼうけんの　はじまりね！\n\tわくわくするわ！\n@c0@"
  ko: "@a@b%a002020: 또 새로운\n모험이 시작되는구나!\n두근두근해!\n@c0@"
  sl: "@a@b%a002020：又是一段崭新旅程的开始呢！\n　　好期待！\n@c0@"
  tl: "@a@b%a002020：又是一段嶄新旅程的開始呢！\n　　好期待！\n@c0@"
237:
  en: "@a%0%a002030@bSo we sail east from south of Scrimsley, then land and hike even further east. I hope I can remember all that...\n@c0@"
  ja: "@a@b%a002030「ええと\n\tモンストルの南から　船で東\n\t上陸してさらに東　ですね。\n@c0@"
  ko: "@a@b%a002030: 그러니까\n몬스톨 남쪽에서 배로 동쪽으로 갔다가,\n상륙 후 또다시 동쪽으로 가는 거군요.\n@c0@"
  sl: "@a@b%a002030：唔，\n　　从蒙斯托尔南边坐船往东走，\n　　上了陆地继续向东对吧。\n@c0@"
  tl: "@a@b%a002030：唔，\n　　從蒙斯托爾南邊坐船往東走，\n　　上了陸地繼續向東對吧。\n@c0@"
238:
  en: "@a%0%a002050@bWho'd have thought there'd be such a place far to the east of good old Scrimsley?\n@c0@"
  ja: "@a@b%a002050「私のいた　モンストルの\n\tずっと東に　そんな国が\n\tあったんですね。\n@c0@"
  ko: "@a@b%a002050: 제가 있었던 몬스톨에서\n동쪽으로 한참 떨어진 곳에\n그런 나라가 있었군요.\n@c0@"
  sl: "@a@b%a002050：我一直居住的蒙斯托尔东边\n　　有这么一个国家啊。\n@c0@"
  tl: "@a@b%a002050：我一直居住的蒙斯托爾東邊\n　　有這麼一個國家啊。\n@c0@"
239:
  en: "@a%0%a002050@bI had my hands so full defendin' my patch, I never had any free time to explore the area.\n@c0@"
  ja: "@a@b%a002050「自分の町を\n\tまもるのが　せいいっぱいで\n\tぜんぜん　知りませんでした！\n@c0@"
  ko: "@a@b%a002050: 저희 마을을\n지키는 것만 신경 쓰다 보니\n전혀 몰랐지 뭡니까!\n@c0@"
  sl: "@a@b%a002050：我把精力全都放在\n　　保护自己的镇子上了，\n　　完全不知道有这么个国家的存在！\n@c0@"
  tl: "@a@b%a002050：我把精力全都放在\n　　保護自己的鎮子上了，\n　　完全不知道有這麼個國家的存在！\n@c0@"
240:
  en: "@a%0%a002000@bI'll drag this monster kickin' and growlin' out of the shadows myself!\n@c0@"
  ja: "@a@b%a002000「どうやら　そうとうに\n\tたおしがいのある　敵のようだな！\n@c0@"
  ko: "@a@b%a002000: 제법 쓰러뜨릴\n가치가 있는 적인 것 같군!\n@c0@"
  sl: "@a@b%a002000：听起来是个\n　　不打会后悔的敌人呢！\n@c0@"
  tl: "@a@b%a002000：聽起來是個\n　　不打會後悔的敵人呢！\n@c0@"
241:
  en: "@a%0%a002010@bWe'd best bear Madame Luca's warning in mind as we go.\n@c0@"
  ja: "@a@b%a002010「おばあちゃん\n\tヒントを　ありがとう。\n\t心に　とめておきます。\n@c0@"
  ko: "@a@b%a002010: 할머니,\n힌트를 줘서 고마워요.\n마음에 새겨 둘게요.\n@c0@"
  sl: "@a@b%a002010：谢谢婆婆的指点。\n　　我们会谨记于心的。\n@c0@"
  tl: "@a@b%a002010：謝謝婆婆的指點。\n　　我們會謹記於心的。\n@c0@"
242:
  en: "@a%0%a002020@bWhat kind of monster? And where? A situation this serious needs some specifics!\n@c0@"
  ja: "@a@b%a002020「どこで？　どんなやつ？\n\tあーん　もうちょっと　くわしく\n\t教えてくれれば　いいのに……。\n@c0@"
  ko: "@a@b%a002020: 어디서? 어떤 녀석이야?\n아앙~ 좀 더 자세히\n가르쳐 주면 좋을 텐데......\n@c0@"
  sl: "@a@b%a002020：在哪里？打谁？\n　　啊，再多告诉我们一些就好了嘛……\n@c0@"
  tl: "@a@b%a002020：在哪裡？打誰？\n　　啊，再多告訴我們一些就好了嘛……\n@c0@"
243:
  en: "@a%0%a002030@bThe blood of the most holy warriors of Ghent flows through my veins...\n@c0@"
  ja: "@a@b%a002030「うーむ…　人びとを\n\tナゾの病気に　してしまう\n\t悪しき　まもの……。\n@c0@"
  ko: "@a@b%a002030: 으음... 사람들을\n의문의 병으로 몰아넣는\n사악한 마물이라......\n@c0@"
  sl: "@a@b%a002030：唔……\n　　这个邪恶的魔物\n　　会让人们染上怪病……\n@c0@"
  tl: "@a@b%a002030：唔……\n　　這個邪惡的魔物\n　　會讓人們染上怪病……\n@c0@"
244:
  en: "@a%0%a002030@bIf there is a monster terrorising the sleep of the innocent, I have no choice but to intervene.\n@c0@"
  ja: "@a@b%a002030「ゲントの者としては\n\tみすごせませんね！\n@c0@"
  ko: "@a@b%a002030: 겐트족으로서\n묵과할 수 없군요!\n@c0@"
  sl: "@a@b%a002030：作为根特族的一员，\n　　绝对不能饶过这个家伙！\n@c0@"
  tl: "@a@b%a002030：作為根特族的一員，\n　　絕對不能饒過這個傢伙！\n@c0@"
245:
  en: "@a%0%a002050@bSo people are all tucked up in bed for the night and then they're just dyin'!? That's just not right!\n@c0@"
  ja: "@a@b%a002050「ねむったまま\n\t亡くなってしまうと\n\tもう　起きれないですよね……。\n@c0@"
  ko: "@a@b%a002050: 잠든 채\n죽어 버리면\n다시 일어날 수 없겠죠......\n@c0@"
  sl: "@a@b%a002050：在睡梦中死去，\n　　再也醒不过来了吧……\n@c0@"
  tl: "@a@b%a002050：在睡夢中死去，\n　　再也醒不過來了吧……\n@c0@"
246:
  en: "@a%0%a002000@bSo Luca said something about a place called Howcastle, aye?\n@c0@"
  ja: "@a@b%a002000「そういえば　ばあさんが\n\tホルなんとか　というお城のことを\n\t話してたっけな。\n@c0@"
  ko: "@a@b%a002000: 그러고 보니 할머니가\n홀...어쩌고 하는 성에 대해\n말해 줬었지.\n@c0@"
  sl: "@a@b%a002000：话说回来，\n　　婆婆提到了个\n　　叫做荷尔啥的城吧……\n@c0@"
  tl: "@a@b%a002000：話說回來，\n　　婆婆提到了個\n　　叫做荷爾啥的城吧……\n@c0@"
247:
  en: "@a%0%a002000@bI've learnt to take her hints seriously. How about payin' it a little visit?\n@c0@"
  ja: "@a@b%a002000「とりあえず　そこへ\n\tいってみるか？\n@c0@"
  ko: "@a@b%a002000: 우선 거기로\n가 볼까?\n@c0@"
  sl: "@a@b%a002000：总之\n　　先去那里看看吧？\n@c0@"
  tl: "@a@b%a002000：總之\n　　先去那裡看看吧？\n@c0@"
248:
  en: "@a%0%a002010@bIf Madame Luca says that we should sail west to Howcastle, then, well...\n@c0@"
  ja: "@a@b%a002010「おばあちゃんは\n\t西のほうにある　ホルストック城へ\n\t船でむかえと　言っていたけど……。\n@c0@"
  ko: "@a@b%a002010: 할머니는\n서쪽에 있는 홀스톡 성에\n배를 타고 가 보라고 하셨는데......\n@c0@"
  sl: "@a@b%a002010：婆婆说，\n　　让我们坐船\n　　去西边的荷尔斯托克城……\n@c0@"
  tl: "@a@b%a002010：婆婆說，\n　　讓我們坐船\n　　去西邊的荷爾斯托克城……\n@c0@"
249:
  en: "@a%0%a002020@bLuca unloaded a whopper of a fortune on us last night, huh?\n@c0@"
  ja: "@a@b%a002020「昨夜の\n\tおばあちゃんの　占いは\n\t長かったわねえ。\n@c0@"
  ko: "@a@b%a002020: 어젯밤\n할머니의 점은\n좀 길었지.\n@c0@"
  sl: "@a@b%a002020：昨天晚上\n　　婆婆占卜了好长时间呢。\n@c0@"
  tl: "@a@b%a002020：昨天晚上\n　　婆婆占卜了好長時間呢。\n@c0@"
250:
  en: "@a%0%a002020@bI think I got the specifics, though. First, we ‘tack’ west. That means sail, right?\n@c0@"
  ja: "@a@b%a002020「でも大体　おぼえてるわ。\n\t……まず　船で　西を　目指せ。\n@c0@"
  ko: "@a@b%a002020: 하지만 거의 외우고 있어.\n......우선 배를 타고 서쪽으로 갈 것.\n@c0@"
  sl: "@a@b%a002020：不过大致内容我还记得。\n　　……先坐船往西走。\n@c0@"
  tl: "@a@b%a002020：不過大致內容我還記得。\n　　……先坐船往西走。\n@c0@"
251:
  en: "@a%0%a002020@bOnce we pass a rocky mountain to the south-west, we'll see a checkpoint.\n@c0@"
  ja: "@a@b%a002020「すると\n\t南西に見える岩山を　こえたあたりに\n\t関所が　見える。\n@c0@"
  ko: "@a@b%a002020: 그리고\n남서쪽에 보이는 바위산을 지나면\n관문이 보일 테지.\n@c0@"
  sl: "@a@b%a002020：然后，\n　　西南边岩山附近\n　　有一座关卡。\n@c0@"
  tl: "@a@b%a002020：然後，\n　　西南邊岩山附近\n　　有一座關卡。\n@c0@"
252:
  en: "@a%0%a002020@bPass through there and walk a little further, and we'll get to Howcastle.\n@c0@"
  ja: "@a@b%a002020「関所をとおって\n\tしばらく歩くと　ホルストック城に\n\tたどりつく。\n@c0@"
  ko: "@a@b%a002020: 관문을 지나서\n조금 더 걸으면 홀스톡 성에\n도착.\n@c0@"
  sl: "@a@b%a002020：穿过关卡再走一段路，\n　　就可以到达荷尔斯托克了。\n@c0@"
  tl: "@a@b%a002020：穿過關卡再走一段路，\n　　就可以到達荷爾斯托克了。\n@c0@"
253:
  en: "@a%0%a002020@bWhat we're looking for is there. That was the gist of it, right?\n@c0@"
  ja: "@a@b%a002020「その城で\n\tさがしものは　見つかるだろう。\n\t……って　たしかそんな感じ。\n@c0@"
  ko: "@a@b%a002020: 찾는 물건은\n그 성에 있을 것이다.\n......대충 이랬던 것 같은데.\n@c0@"
  sl: "@a@b%a002020：在那座城中，\n　　应该能找到我们要找的东西吧……\n　　差不多就是这么个意思。\n@c0@"
  tl: "@a@b%a002020：在那座城中，\n　　應該能找到我們要找的東西吧……\n　　差不多就是這麼個意思。\n@c0@"
254:
  en: "@a%0%a002020@bHa! Who says %a002010's the only one who's any good at remembering stuff?\n@c0@"
  ja: "@a@b%a002020「あたしも　けっこう\n\t%a002010みたいに　きおくは\n\tいいんだから。　えっへん！\n@c0@"
  ko: "@a@b%a002020: 나도 알고 보면\n%a002010처럼 기억력은\n좋은 편이거든. 엣헴!\n@c0@"
  sl: "@a@b%a002020：我的记忆力\n　　跟%a002010一样棒哦！\n　　哎嘿！\n@c0@"
  tl: "@a@b%a002020：我的記憶力\n　　跟%a002010一樣棒哦！\n　　哎嘿！\n@c0@"
255:
  en: "@a%0%a002030@bIf Luca tells us that our destiny lies to the west, I think we must take the Providence and go forth to meet it.\n@c0@"
  ja: "@a@b%a002030「さて　どうします？\n\tグランマーズさんの　占いどおり\n\t船で　西に　むかいますか？\n@c0@"
  ko: "@a@b%a002030: 그럼 어떻게 할까요?\n그랜마즈 님의 점괘대로\n배를 타고 서쪽으로 갈까요?\n@c0@"
  sl: "@a@b%a002030：怎么办？\n　　要按照玛兹婆婆所说的，\n　　坐船往西走吗？\n@c0@"
  tl: "@a@b%a002030：怎麼辦？\n　　要按照瑪茲婆婆所說的，\n　　坐船往西走嗎？\n@c0@"
256:
  en: "@a%0%a002050@bThe cat must have been lickin' my face in the night. It's still a little sticky to the touch.\n@c0@"
  ja: "@a@b%a002050「いやあ　夜中に\n\tネコちゃんに　なめられたのか\n\t顔が　ゴワゴワなんですよ。\n@c0@"
  ko: "@a@b%a002050: 휴우, 밤중에\n고양이가 절 핥고 갔는지\n얼굴이 까슬하네요.\n@c0@"
  sl: "@a@b%a002050：哎呀，\n　　大半夜好像被小猫咪舔了脸，\n　　脸上湿乎乎的。\n@c0@"
  tl: "@a@b%a002050：哎呀，\n　　大半夜好像被小貓咪舔了臉，\n　　臉上濕乎乎的。\n@c0@"
257:
  en: "@a%0%a002050@bWhat's that you say!? Droolin'!? Pull the other one! You can't fool old %a002050 that easily!\n@c0@"
  ja: "@a@b%a002050「ち　ちがいますよ！\n\tヨダレじゃ　ありませんって！\n@c0@"
  ko: "@a@b%a002050: 아, 아닙니다!\n침 흘린 게 아니라고요!\n@c0@"
  sl: "@a@b%a002050：不！不是！\n　　这绝对不是口水！\n@c0@"
  tl: "@a@b%a002050：不！不是！\n　　這絕對不是口水！\n@c0@"
258:
  en: "@a%0%a002000@bAye, much as I'd love to stay here with Luca and her cat forever, I think we should shove off!\n@c0@"
  ja: "@a@b%a002000「まあ　とにかく\n\tでかけようぜ。\n@c0@"
  ko: "@a@b%a002000: 뭐, 일단 한번\n나가 보자고.\n@c0@"
  sl: "@a@b%a002000：哎，总之先出去吧。\n@c0@"
  tl: "@a@b%a002000：哎，總之先出去吧。\n@c0@"
259:
  en: "@a%0%a002010@bGood to know we got the all-clear.\n@c0@"
  ja: "@a@b%a002010「ありがとう\n\tおばあちゃん。\n\tとにかく　でかけるわ。\n@c0@"
  ko: "@a@b%a002010: 고마워요,\n할머니.\n일단 나가 볼게요.\n@c0@"
  sl: "@a@b%a002010：谢谢您，婆婆。\n　　我们走了。\n@c0@"
  tl: "@a@b%a002010：謝謝您，婆婆。\n　　我們走了。\n@c0@"
260:
  en: "@a%0%a002020@bDid I understand her right? She was talking about the future, right?\n@c0@"
  ja: "@a@b%a002020「いまの予言\n\tよくわからないけど　ずっと未来の\n\t話なのかな……？\n@c0@"
  ko: "@a@b%a002020: 방금 예언은\n들어도 잘 모르겠는데\n먼 미래의 일일까......?\n@c0@"
  sl: "@a@b%a002020：刚才的预言，\n　　我没怎么听明白，\n　　是很遥远的未来的事么……\n@c0@"
  tl: "@a@b%a002020：剛才的預言，\n　　我沒怎麼聽明白，\n　　是很遙遠的未來的事麼……\n@c0@"
261:
  en: "@a%0%a002030@bLuca spoke of a young king who rules over the land of Somnia...\n@c0@"
  ja: "@a@b%a002030「レイドック城を　おさめる\n\t若く　たくましい王……うーん\n\t誰なのでしょうね。\n@c0@"
  ko: "@a@b%a002030: 레이독 성을 다스리는\n젊고 늠름한 왕......\n으음, 누굴 말하는 걸까요?\n@c0@"
  sl: "@a@b%a002030：统治雷多克城的\n　　年轻国王……\n　　到底是谁呢？\n@c0@"
  tl: "@a@b%a002030：統治雷多克城的\n　　年輕國王……\n　　到底是誰呢？\n@c0@"
262:
  en: "@a%0%a002030@bCould this refer to %a000090? Or the other prince? Or...\n@c0@"
  ja: "@a@b%a002030「%a000090さん？\n\tもうひとりの王子？\n\tそれとも……。\n@c0@"
  ko: "@a@b%a002030: %a000090 님?\n또 한 사람의 왕자?\n아니면......\n@c0@"
  sl: "@a@b%a002030：是%a000090？\n　　另外一个王子？\n　　还是……\n@c0@"
  tl: "@a@b%a002030：是%a000090？\n　　另外一個王子？\n　　還是……\n@c0@"
263:
  en: "@a%0%a002050@bMadame Luca's a fine hostess. I hope I can return the favour some day!\n@c0@"
  ja: "@a@b%a002050「グランマーズさん\n\tどうも　おじゃましました。\n\tまた　よろしくおねがいします！\n@c0@"
  ko: "@a@b%a002050: 그랜마즈 님,\n신세 많이 지고 갑니다.\n다음에도 잘 부탁합니다!\n@c0@"
  sl: "@a@b%a002050：玛兹婆婆，\n　　打扰您了。\n　　以后也要麻烦您了！\n@c0@"
  tl: "@a@b%a002050：瑪茲婆婆，\n　　打擾您了。\n　　以後也要麻煩您了！\n@c0@"
264:
  en: "@a%0%a002000@bNo sense sittin' around here until our muscles get puny.\n@c0@"
  ja: "@a@b%a002000「さて\n\tこれから　どうする？\n@c0@"
  ko: "@a@b%a002000: 자,\n이제 어떻게 할까?\n@c0@"
  sl: "@a@b%a002000：好了，接下来咋办？\n@c0@"
  tl: "@a@b%a002000：好了，接下來咋辦？\n@c0@"
265:
  en: "@a%0%a002000@bD'you think we should follow Luca's advice and head to this Clearvale place?\n@c0@"
  ja: "@a@b%a002000「ばあさんの　占いでは\n\tクリアベールを　めざせって\n\tいう話だったけどな。\n@c0@"
  ko: "@a@b%a002000: 할머니의 점괘에서는\n클리어베일로 가라고\n했는데 말이야.\n@c0@"
  sl: "@a@b%a002000：根据婆婆的占卜，\n　　咱应该去克里亚贝尔是吧。\n@c0@"
