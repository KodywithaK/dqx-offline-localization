  tl: "@a@b%a002050：那個……\n　　昨天我是不是\n　　被什麼東西詛咒了？\n@c0@"
311:
  en: "@a%0%a002050@bI had the strangest dream about tusslin' with this giant scaly fish...\n@c0@"
