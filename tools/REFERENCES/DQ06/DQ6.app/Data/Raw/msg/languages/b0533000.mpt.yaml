26:
  en: "@a%0%a002050@bRight, that's just what old %a002050 would say! If I were a cat, I mean...\n@c0@"
  ja: "@a@b%a002050「私も　ネコだったら\n\tおなじこと　言いますねー。\n@c0@"
  ko: "@a@b%a002050: 저도 고양이였다면\n같은 말을 했을 겁니다.\n@c0@"
  sl: "@a@b%a002050：要是我是猫的话，\n　　也会这么叫吧……\n@c0@"
  tl: "@a@b%a002050：要是我是貓的話，\n　　也會這麼叫吧……\n@c0@"
27:
  en: "@a%0%a002000@bAye, let folks think it was the King's power if they like. We know the real story!\n@c0@"
  ja: "@a@b%a002000「まあ　王さまの　顔を立てて\n\tここは　そういうことに　しておくか！\n@c0@"
  ko: "@a@b%a002000: 뭐, 폐하의 체면도 있으니\n여기선 그렇다고 해 두지!\n@c0@"
  sl: "@a@b%a002000：哎，看在国王陛下的面子上，\n　　就当它是这样好了！\n@c0@"
  tl: "@a@b%a002000：哎，看在國王陛下的面子上，\n　　就當它是這樣好了！\n@c0@"
28:
  en: "@a%0%a002010@bOh dear... That soldier really has got the wrong end of the stick. Well, no harm done!\n@c0@"
  ja: "@a@b%a002010「さかさまのような\n\t気もするけど……\n\tまあ　しかたないわね。\n@c0@"
  ko: "@a@b%a002010: 그 반대인 것\n같기도 한데......\n뭐, 어쩔 수 없겠지만.\n@c0@"
