  tl: "@a@b%a002000：那人就是那個\n　　莫名其妙忽然抱怨起咱的漁夫吧。\n@c0@"
303:
  en: "@a%0%a002000@bAnyway, let's go and find out. It'd be good to know, ya know?\n@c0@"
