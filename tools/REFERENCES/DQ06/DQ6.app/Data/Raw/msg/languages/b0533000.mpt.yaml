  sl: "@a@b%a002020：要我们帮的，\n　　就是那个叫做洛布的\n　　脚受伤了的人吧。\n@c0@"
  tl: "@a@b%a002020：要我們幫的，\n　　就是那個叫做洛布的\n　　腳受傷了的人吧。\n@c0@"
307:
