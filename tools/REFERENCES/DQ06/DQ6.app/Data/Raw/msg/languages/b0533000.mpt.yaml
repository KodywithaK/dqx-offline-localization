66:
  en: "@a%0%a002010@bThe Prince... Where could he be? I do hope we find a clue soon.\n@c0@"
  ja: "@a@b%a002010「王子の　消息……\n\t早く　手がかりが　ほしいわね。\n@c0@"
  ko: "@a@b%a002010: 왕자의 소식......\n어서 단서를 찾았으면 좋겠어.\n@c0@"
  sl: "@a@b%a002010：真想快点找到\n　　跟王子有关的线索啊……\n@c0@"
  tl: "@a@b%a002010：真想快點找到\n　　跟王子有關的線索啊……\n@c0@"
67:
  en: "@a%0%a002020@bWe'll find him. Count on it!\n@c0@"
  ja: "@a@b%a002020「あたしたちが\n\tきっと　見つけちゃうんだから！\n@c0@"
  ko: "@a@b%a002020: 우리가 꼭\n찾아내고 말 거야!\n@c0@"
  sl: "@a@b%a002020：我们一定会找到他的！\n@c0@"
  tl: "@a@b%a002020：我們一定會找到他的！\n@c0@"
68:
  en: "@a%0%a002030@bIt is extraordinary to think that there is another %a000090 out there somewhere.\n@c0@"
  ja: "@a@b%a002030「きえた\n\tもうひとりの　%a000090さん……。\n\t大きな　ナゾですね。\n@c0@"
  ko: "@a@b%a002030: 사라진\n또 하나의 %a000090 님......\n커다란 수수께끼네요.\n@c0@"
  sl: "@a@b%a002030：消失了的\n　　另一个%a000090……\n　　真是谜团重重啊。\n@c0@"
  tl: "@a@b%a002030：消失了的\n　　另一個%a000090……\n　　真是謎團重重啊。\n@c0@"
69:
  en: "@a%0%a002050@bInstead of us findin' him, it would save a lot of bother if he found us instead!\n@c0@"
  ja: "@a@b%a002050「むこうから\n\tあいに　きてくれれば\n\t楽なんですけどねえ。\n@c0@"
  ko: "@a@b%a002050: 그쪽이 먼저\n만나러 와 주면\n편할 텐데 말이죠.\n@c0@"
  sl: "@a@b%a002050：要是他来找我们的话，\n　　我们就轻松多了呢。\n@c0@"
  tl: "@a@b%a002050：要是他來找我們的話，\n　　我們就輕鬆多了呢。\n@c0@"
70:
  en: "@a%0%a002000@bI just hope she learnt somethin' from it!\n@c0@"
  ja: "@a@b%a002000「いまごろ\n\t反省してるのかよ……。\n@c0@"
  ko: "@a@b%a002000: 이제 와서\n반성하기냐......\n@c0@"
  sl: "@a@b%a002000：现在你倒是\n　　知道反省了啊……\n@c0@"
  tl: "@a@b%a002000：現在你倒是\n　　知道反省了啊……\n@c0@"
71:
  en: "@a%0%a002010@bIvy just needs to find her own true love. I'm sure she can do it.\n@c0@"
  ja: "@a@b%a002010「アマンダさんも\n\tいつか　本当の愛を\n\tみつけましょうね。\n@c0@"
  ko: "@a@b%a002010: 아만다 씨도\n언젠가 진짜 사랑을\n찾자고요.\n@c0@"
  sl: "@a@b%a002010：要是哪天\n　　阿曼达也能找到\n　　属于自己的爱情就好了。\n@c0@"
  tl: "@a@b%a002010：要是哪天\n　　阿曼達也能找到\n　　屬於自己的愛情就好了。\n@c0@"
72:
  en: "@a%0%a002020@bWell, that's what she gets for trying to swipe someone else's man.\n@c0@"
  ja: "@a@b%a002020「よこどりは\n\tいけないわよね。\n@c0@"
  ko: "@a@b%a002020: 남의 것 뺏으면\n안 돼.\n@c0@"
  sl: "@a@b%a002020：抢别人男人是不对的哦。\n@c0@"
  tl: "@a@b%a002020：搶別人男人是不對的哦。\n@c0@"
73:
  en: "@a%0%a002030@bManipulating people's hearts is a difficult task, even for the Goddess.\n@c0@"
  ja: "@a@b%a002030「人の心を\n\tあやつるのは　神さまですら\n\tむずかしいことです。\n@c0@"
  ko: "@a@b%a002030: 사람의 마음을\n움직이는 것은 신에게조차\n어려운 일입니다.\n@c0@"
  sl: "@a@b%a002030：操控人心这种事情，\n　　连神明都很难做到，何况人类。\n@c0@"
  tl: "@a@b%a002030：操控人心這種事情，\n　　連神明都很難做到，何況人類。\n@c0@"
74:
  en: "@a%0%a002050@bWhat's all this about pinin', whinin' and plottin'? Seems old %a002050 has some catchin' up to do once again.\n@c0@"
  ja: "@a@b%a002050「よく　わかりませんが\n\tこの方が　だれかに　ムダなことを\n\tしたんですか？\n@c0@"
  ko: "@a@b%a002050: 잘 몰라서 그러는데\n이분이 누군가에게 쓸데없는\n일을 하셨나요?\n@c0@"
  sl: "@a@b%a002050：我不太了解情况。\n　　这位女士是不是对谁\n　　做了什么无果的事情？\n@c0@"
  tl: "@a@b%a002050：我不太瞭解情況。\n　　這位女士是不是對誰\n　　做了什麼無果的事情？\n@c0@"
75:
  en: "@a%0%a002000@bHey, I ain't blind! I can see just fine that Johan chose the right girl!\n@c0@"
  ja: "@a@b%a002000「こいつを　えらばなかった\n\tジョセフに　拍手だぜ……。\n@c0@"
  ko: "@a@b%a002000: 이 녀석을 고르지 않은\n조셉에게 박수를 보내고 싶군......\n@c0@"
  sl: "@a@b%a002000：给没有选择这个家伙的\n　　约瑟夫打个满分……\n@c0@"
  tl: "@a@b%a002000：給沒有選擇這個傢伙的\n　　約瑟夫打個滿分……\n@c0@"
76:
  en: "@a%0%a002010@bAt least she's acknowledging their happiness. It's a start.\n@c0@"
  ja: "@a@b%a002010「とりあえず　彼女も\n\tふたりの幸せを　みとめては\n\tいるみたいだわね。\n@c0@"
  ko: "@a@b%a002010: 어쨌든 아만다 씨도\n두 사람의 행복을 인정하고는\n있는 모양이네.\n@c0@"
  sl: "@a@b%a002010：总之，\n　　她看起来倒也已经\n　　承认了那两人了吧。\n@c0@"
  tl: "@a@b%a002010：總之，\n　　她看起來倒也已經\n　　承認了那兩人了吧。\n@c0@"
77:
  en: "@a%0%a002020@bPeople like this... They rub me the wrong way.\n@c0@"
  ja: "@a@b%a002020「あたし　こういうひと\n\tちょっと　苦手かも……。\n@c0@"
  ko: "@a@b%a002020: 나, 이런 사람\n좀 싫어......\n@c0@"
  sl: "@a@b%a002020：我不太擅长\n　　应付这种人……\n@c0@"
  tl: "@a@b%a002020：我不太擅長\n　　應付這種人……\n@c0@"
78:
  en: "@a%0%a002030@bThe Goddess alone may judge you, but it is sad to see someone fall so far from the path of righteousness.\n@c0@"
  ja: "@a@b%a002030「いやはや　きつい\n\tおっしゃりかたですね。\n@c0@"
  ko: "@a@b%a002030: 이런, 말투가\n제법 거칠군요.\n@c0@"
  sl: "@a@b%a002030：哎呀，\n　　这话听起来真刺耳呢。\n@c0@"
  tl: "@a@b%a002030：哎呀，\n　　這話聽起來真刺耳呢。\n@c0@"
79:
  en: "@a%0%a002050@bIt seems this lass is really well-balanced — she's got a chip on both her shoulders! Ha ha!\n@c0@"
  ja: "@a@b%a002050「%a000090さん\n\tふし穴とか　言われてますよ！\n@c0@"
  ko: "@a@b%a002050: %a000090 님,\n폼으로 달고 다니냐는데요?\n@c0@"
  sl: "@a@b%a002050：%a000090！\n　　她说你有眼无珠啊！\n@c0@"
  tl: "@a@b%a002050：%a000090！\n　　她說你有眼無珠啊！\n@c0@"
80:
  en: "@a%0%a002000@b...And they all lived happily ever after! My cockles are pretty toasty too. Wait, what are cockles again?\n@c0@"
  ja: "@a@b%a002000「めでたし　めでたし　だな！\n@c0@"
  ko: "@a@b%a002000: 맞아, 다 잘됐지!\n@c0@"
  sl: "@a@b%a002000：可喜可贺，可喜可贺啊！\n@c0@"
  tl: "@a@b%a002000：可喜可賀，可喜可賀啊！\n@c0@"
81:
  en: "@a%0%a002010@bHe deserves his happiness. No one was more concerned for Ella's well-being.\n@c0@"
  ja: "@a@b%a002010「おじいさんには\n\tメラニィさんのことが\n\tいちばんの　心配でしたものね。\n@c0@"
  ko: "@a@b%a002010: 할아버지는\n멜라니 씨를 그 누구보다\n걱정하셨으니까요.\n@c0@"
  sl: "@a@b%a002010：最关心美拉妮的\n　　就是这个老爷爷了吧。\n@c0@"
  tl: "@a@b%a002010：最關心美拉妮的\n　　就是這個老爺爺了吧。\n@c0@"
82:
  en: "@a%0%a002020@bOh, I want a grandpa like that!\n@c0@"
  ja: "@a@b%a002020「この　おじいさん\n\tやさしそう。\n@c0@"
  ko: "@a@b%a002020: 이 할아버지,\n좋은 사람인가 봐.\n@c0@"
  sl: "@a@b%a002020：这个老爷爷，\n　　看上去是个和蔼可亲的人。\n@c0@"
  tl: "@a@b%a002020：這個老爺爺，\n　　看上去是個和藹可親的人。\n@c0@"
83:
  en: "@a%0%a002030@bIt is a fine thing to be able to take pleasure in another's good fortune!\n@c0@"
  ja: "@a@b%a002030「本当に　よかったですねえ。\n@c0@"
  ko: "@a@b%a002030: 정말 잘됐습니다.\n@c0@"
  sl: "@a@b%a002030：真的是太好了呢。\n@c0@"
  tl: "@a@b%a002030：真的是太好了呢。\n@c0@"
84:
  en: "@a%0%a002050@bI'm not at all sure what's occurrin', but old %a002050 isn't one to spoil the general air of cheerfulness!\n@c0@"
  ja: "@a@b%a002050「よく　わかりませんが\n\tおめでとうございます。\n@c0@"
  ko: "@a@b%a002050: 저는 잘 모르겠지만\n아무튼 축하드립니다.\n@c0@"
  sl: "@a@b%a002050：虽然我还不怎么了解情况，\n　　不过还是恭喜了。\n@c0@"
  tl: "@a@b%a002050：雖然我還不怎麼瞭解情況，\n　　不過還是恭喜了。\n@c0@"
85:
  en: "@a%0%a002000@bIf folks in Port Haven had always been this happy, I might never have left!\n@c0@"
  ja: "@a@b%a002000「町全体が　なんだか\n\t明るく　なったよな！\n@c0@"
  ko: "@a@b%a002000: 마을 전체가 왠지\n밝아진 것 같군!\n@c0@"
  sl: "@a@b%a002000：这镇子的气氛\n　　简直焕然一新了！\n@c0@"
  tl: "@a@b%a002000：這鎮子的氣氛\n　　簡直煥然一新了！\n@c0@"
86:
  en: "@a%0%a002010@bHe's right, you know — things are looking up!\n@c0@"
  ja: "@a@b%a002010「ほんとうに　そうねえ。\n@c0@"
  ko: "@a@b%a002010: 정말 그렇네.\n@c0@"
  sl: "@a@b%a002010：真的呢。\n@c0@"
  tl: "@a@b%a002010：真的呢。\n@c0@"
87:
  en: "@a%0%a002020@bThat's great and all, but I feel like our work is just beginning...\n@c0@"
  ja: "@a@b%a002020「いいわねえ。\n\tあたしたちなんか　まだまだ\n\tとかねばならない　ナゾだらけ……。\n@c0@"
  ko: "@a@b%a002020: 좋겠네.\n우리는 아직 풀어야 할\n수수께끼가 산더미 같은데......\n@c0@"
  sl: "@a@b%a002020：真好啊。\n　　不过我们面前还有好多\n　　没解开的谜团……\n@c0@"
  tl: "@a@b%a002020：真好啊。\n　　不過我們面前還有好多\n　　沒解開的謎團……\n@c0@"
88:
  en: "@a%0%a002030@bSadly, the world is far from a state of total peace. But if you have peace in your heart, that is a beginning, at least.\n@c0@"
  ja: "@a@b%a002030「まだまだ　本当の\n\t平和とは　言えませんが　ひとびとの\n\t心の平和が　いちばんですね。\n@c0@"
  ko: "@a@b%a002030: 아직 진짜 평화가\n찾아왔다고는 할 수 없지만, 사람들의\n마음의 평화가 제일이죠.\n@c0@"
  sl: "@a@b%a002030：虽然不能说\n　　世界已经真正迎来了和平，\n　　但是人心的平和安宁才是第一位啊。\n@c0@"
  tl: "@a@b%a002030：雖然不能說\n　　世界已經真正迎來了和平，\n　　但是人心的平和安寧才是第一位啊。\n@c0@"
89:
  en: "@a%0%a002050@b‘Mustn't grumble!’ That's what my old mother always used to say...\n@c0@"
  ja: "@a@b%a002050「人それぞれに\n\t波乱は　あるでしょうが\n\t前向きに　いきたいですね。\n@c0@"
  ko: "@a@b%a002050: 모두 각자\n인생에 기복은 있겠지만\n긍정적으로 살아갔으면 좋겠군요.\n@c0@"
  sl: "@a@b%a002050：即使身处乱世浪潮，\n　　也要乘风破浪向前才行。\n@c0@"
  tl: "@a@b%a002050：即使身處亂世浪潮，\n　　也要乘風破浪向前才行。\n@c0@"
90:
  en: "@a%0%a002050@bIf there's one thing any self-respectin' adventurer needs, it's a stiff upper lip!\n@c0@"
  ja: "@a@b%a002050「あ　すみません\n\tなんだか　私らしくないことを\n\tいいましたね……。\n@c0@"
  ko: "@a@b%a002050: 아, 죄송합니다.\n저답지 않은 말을\n했군요......\n@c0@"
  sl: "@a@b%a002050：啊，真抱歉。\n　　这话说得都不像我了。\n@c0@"
  tl: "@a@b%a002050：啊，真抱歉。\n　　這話說得都不像我了。\n@c0@"
91:
  en: "@a%0%a002000@bImagine a world without swords to swing and monsters to bash! I'd waste away to nothin'!\n@c0@"
  ja: "@a@b%a002000「まあ　本当に\n\tそんな　世の中がきたら\n\t武器は　いらないかもな。\n@c0@"
  ko: "@a@b%a002000: 뭐, 정말\n그런 세상이 온다면\n무기는 필요 없겠지.\n@c0@"
  sl: "@a@b%a002000：哎，\n　　那样的世界要是真的到来了的话，\n　　武器可能真的没人再要了吧。\n@c0@"
  tl: "@a@b%a002000：哎，\n　　那樣的世界要是真的到來了的話，\n　　武器可能真的沒人再要了吧。\n@c0@"
92:
  en: "@a%0%a002010@bJust as she says, peace is what matters most. Isn't that right, %a000090?\n@c0@"
  ja: "@a@b%a002010「おばさんの　いうとおり\n\t武器のいらない　本当に平和な\n\t世の中が　来ることが　理想よね。\n@c0@"
  ko: "@a@b%a002010: 아주머니 말대로\n무기가 필요 없는 진짜 평화로운\n세상이 오는 게 제일 좋지.\n@c0@"
  sl: "@a@b%a002010：大婶说得没错。\n　　大家都梦想着世界能够迎来\n　　不再需要武器的那种真正的和平。\n@c0@"
  tl: "@a@b%a002010：大嬸說得沒錯。\n　　大家都夢想著世界能夠迎來\n　　不再需要武器的那種真正的和平。\n@c0@"
93:
  en: "@a%0%a002020@bGuess peace can be a double-edged sword when your job is selling weapons. Tee hee!\n@c0@"
  ja: "@a@b%a002020「そっかあ。\n\t武器を　売る　仕事って\n\tそういう意味では　ふくざつだね。\n@c0@"
  ko: "@a@b%a002020: 그렇구나.\n무기를 파는 사람들은\n그런 면에서는 기분이 복잡하겠네.\n@c0@"
  sl: "@a@b%a002020：这样啊。\n　　看来做武器生意\n　　这一行好像也挺复杂呢。\n@c0@"
  tl: "@a@b%a002020：這樣啊。\n　　看來做武器生意\n　　這一行好像也挺複雜呢。\n@c0@"
94:
  en: "@a%0%a002030@bI fear that the weapon trade will be booming for some time yet.\n@c0@"
  ja: "@a@b%a002030「残念ながら\n\tまものが　完全に　たえることは\n\tいましばらくは　ないでしょう。\n@c0@"
  ko: "@a@b%a002030: 아쉽게도\n마물이 완전히 사라지는 일은\n당분간은 없을 겁니다.\n@c0@"
  sl: "@a@b%a002030：很遗憾，\n　　短时间内魔物是不可能\n　　完全被消灭的吧。\n@c0@"
  tl: "@a@b%a002030：很遺憾，\n　　短時間內魔物是不可能\n　　完全被消滅的吧。\n@c0@"
95:
  en: "@a%0%a002050@bShe's not wrong — peace is the most important thing!\n@c0@"
  ja: "@a@b%a002050「はい！\n\t平和が　１番ですとも！\n@c0@"
  ko: "@a@b%a002050: 그럼요!\n평화가 제일이죠!\n@c0@"
  sl: "@a@b%a002050：没错！\n　　和平高于一切！\n@c0@"
  tl: "@a@b%a002050：沒錯！\n　　和平高於一切！\n@c0@"
96:
  en: "@a%0%a002050@bAlong with eatin' your veggies and sayin' your prayers!\n@c0@"
  ja: "@a@b%a002050「あ…　１番は\n\t健康だったかな？\n@c0@"
  ko: "@a@b%a002050: 아...\n건강이 제일인가?\n@c0@"
  sl: "@a@b%a002050：啊……\n　　是健康高于一切才对吧？\n@c0@"
  tl: "@a@b%a002050：啊……\n　　是健康高於一切才對吧？\n@c0@"
97:
  en: "@a%0%a002000@bLooks like we've got another fine Port Haven hero in the makin'!\n@c0@"
  ja: "@a@b%a002000「そうか。\n\tがんばれよ！\n@c0@"
  ko: "@a@b%a002000: 그래.\n열심히 하거라!\n@c0@"
  sl: "@a@b%a002000：是嘛。\n　　你加油啊！\n@c0@"
  tl: "@a@b%a002000：是嘛。\n　　你加油啊！\n@c0@"
98:
  en: "@a%0%a002010@bWe'll just have to try and hold the fort until this little fellow is tough enough to take over! Hee hee!\n@c0@"
  ja: "@a@b%a002010「うふふ　じゃあ\n\tボウヤが　大きく強くなるまでは\n\tおねえさんたちが　がんばるわね。\n@c0@"
  ko: "@a@b%a002010: 우후훗. 그럼\n네가 커서 강해지기 전까지는\n누나들이 열심히 할게.\n@c0@"
  sl: "@a@b%a002010：呵呵。\n　　在小朋友变得强大之前，\n　　姐姐也会好好努力的。\n@c0@"
