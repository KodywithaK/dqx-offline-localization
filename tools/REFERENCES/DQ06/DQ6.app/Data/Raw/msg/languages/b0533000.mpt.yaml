24:
  en: "@a%0%a002020@bAww, cute!\n@c0@"
  ja: "@a@b%a002020「かわいい！\n@c0@"
  ko: "@a@b%a002020: 귀엽다!\n@c0@"
  sl: "@a@b%a002020：好萌！\n@c0@"
  tl: "@a@b%a002020：好萌！\n@c0@"
25:
  en: "@a%0%a002030@bAll of the Goddess's creatures seem able to sense the darkness that has been banished from the world.\n@c0@"
  ja: "@a@b%a002030「ネコを　見ていると\n\tなぜか　心が　なごみますね。\n@c0@"
  ko: "@a@b%a002030: 고양이를 보고 있으면\n왠지 마음이 따뜻해지네요.\n@c0@"
