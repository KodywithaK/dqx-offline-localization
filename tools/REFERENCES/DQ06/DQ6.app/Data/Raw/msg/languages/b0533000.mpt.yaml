  tl: "@a@b%a002010：雖然總覺得這話本末倒置了……\n　　唉，沒辦法。\n@c0@"
29:
  en: "@a%0%a002020@bWow. His facts couldn't be more fouled up. But I don't want to kill his buzz...\n@c0@"
  ja: "@a@b%a002020「う～ん。\n\tすっごい　カンちがいだけど\n\t世の中　こんなもんなのね。\n@c0@"
  ko: "@a@b%a002020: 으음~\n엄청난 착각이긴 한데\n세상 돌아가는 게 다 그렇지, 뭐.\n@c0@"
  sl: "@a@b%a002020：唔～\n　　虽然他的解释完全不对，\n　　但这也是世间百态之一啊。\n@c0@"
