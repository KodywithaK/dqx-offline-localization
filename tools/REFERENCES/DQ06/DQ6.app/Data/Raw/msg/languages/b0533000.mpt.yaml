30:
  en: "@a%0%a002030@bIt is a fine thing to see how much respect the King commands here.\n@c0@"
  ja: "@a@b%a002030「王さまが\n\t尊敬されてるのは\n\tいいことですね。\n@c0@"
  ko: "@a@b%a002030: 왕이\n존경받는다는 건\n좋은 일이죠.\n@c0@"
