  tl: "@a@b%a002000：他們不是生病啊，\n　　唉，算了！\n@c0@"
18:
  en: "@a%0%a002010@bI suppose it's no surprise that news from Somnia reaches this town so quickly.\n@c0@"
  ja: "@a@b%a002010「さすがに　この町は\n\tレイドック城の　できごとが\n\t伝わってくるのが　早いわね。\n@c0@"
  ko: "@a@b%a002010: 역시 이 마을에는\n레이독 성에서 일어난 일이\n빨리 전해지는구나.\n@c0@"
  sl: "@a@b%a002010：雷多克城的事情，\n　　果然这么快就传到了\n　　这个镇子里来。\n@c0@"
  tl: "@a@b%a002010：雷多克城的事情，\n　　果然這麼快就傳到了\n　　這個鎮子裡來。\n@c0@"
19:
  en: "@a%0%a002020@bBoy, he's certainly taking this well.\n@c0@"
  ja: "@a@b%a002020「おじいさん\n\tうれしそう。\n@c0@"
  ko: "@a@b%a002020: 할아버지\n기분 좋아 보이네.\n@c0@"
  sl: "@a@b%a002020：老爷爷看起来真开心。\n@c0@"
  tl: "@a@b%a002020：老爺爺看起來真開心。\n@c0@"
20:
  en: "@a%0%a002030@bPerhaps once I would have made this man aware of our role, but now I am content merely to share in his joy.\n@c0@"
  ja: "@a@b%a002030「みなさん　こういうときは\n\t何も　知らなかったふりをして\n\tいっしょによろこんで　あげましょう。\n@c0@"
  ko: "@a@b%a002030: 여러분, 이럴 땐\n아무것도 몰랐던 척하고\n함께 기뻐해 줍시다.\n@c0@"
  sl: "@a@b%a002030：各位，这种时候\n　　我们也装作被蒙在鼓里，\n　　跟着一起庆祝就好了。\n@c0@"
