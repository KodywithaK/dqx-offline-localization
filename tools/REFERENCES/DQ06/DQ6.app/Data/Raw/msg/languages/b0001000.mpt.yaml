102:
  en: "@a@b‘CAUTION!\nThe well inside this hut is hazardous.\nDo not approach!’\n@c0@"
  ja: "@a@b『キケン！！\n　小屋の中の　井戸に\n　ちかよるべからず！！』\n@c0@"
  ko: "@a@b*: 베스야! 왜 그래?\n@c0@"
  sl: "@a@b“危险！！\n　严禁靠近小屋中的井口！！”\n@c0@"
  tl: "@a@b“危險！！\n　嚴禁靠近小屋中的井口！！”\n@c0@"
103:
