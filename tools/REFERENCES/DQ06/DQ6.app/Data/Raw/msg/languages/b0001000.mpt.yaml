  ja: "@a@b＊「ぷふぁー。　今日は　やけに\n\tけむりが　目にしみるわい。\n@c0@"
  ko: "@a@b*: 아~아, 피곤해.\n나도 우물가에서\n놀고 싶어라.\n@c0@"
  sl: "@a@b＊：噗呼。\n　　今天的烟特别熏眼睛。\n@c0@"
  tl: "@a@b＊：噗呼。\n　　今天的煙特別熏眼睛。\n@c0@"
95:
  en: "@a@b*: Then again, the chap from the weapon shop mentioned somefin' interesting about a mirror that shows only truth.\n@c0@"
  ja: "@a@b＊「そういえば　ぶき屋のヤツ\n\tおかしなことを　言っておったな。\n\t真実をうつす鏡が　どうとか。\n@c0@"
  ko: "@a@b*: 우리 남편은 매일 저렇게\n멍하니 있으면서 \n무슨 생각을 하고 있는 걸까......\n@c0@"
  sl: "@a@b＊：武器店的那家伙，\n　　尽说些奇怪的话。\n　　照出真实的镜子啥的。\n@c0@"
  tl: "@a@b＊：武器店的那傢伙，\n　　盡說些奇怪的話。\n　　照出真實的鏡子啥的。\n@c0@"
96:
  en: "@a@b*: If only I had that kind of mirror... I'd plonk the missus down in front of it just to see what kind of reflection she'd make...\n@c0@"
  ja: "@a@b＊「そういう物が　本当にあるなら\n\tひとつ　うちの女房でも\n\tうつしてみたいものじゃわい。\n@c0@"
  ko: "@a@b*: 푸하~ 오늘은 왜 이렇게\n연기에 눈이 따갑지?\n@c0@"
  sl: "@a@b＊：要真有这种东西，\n　　我也拿来用用，\n　　让我老婆照一回。\n@c0@"
  tl: "@a@b＊：要真有這種東西，\n　　我也拿來用用，\n　　讓我老婆照一回。\n@c0@"
97:
  en: "@a@b*: Yip! Woof woof!\n@c0@"
  ja: "@a@b＊「うー！　わん　わん！\n@c0@"
  ko: "@a@b*: 그러고 보니, 무기 상점 녀석이\n이상한 소리를 하더군.\n진실을 비추는 거울이 어쩌고저쩌고.\n@c0@"
  sl: "@a@b＊：呜……汪汪！\n@c0@"
  tl: "@a@b＊：嗚……汪汪！\n@c0@"
98:
  en: "@a@b*: Lily! The way you was barkin', I thought we had visitors! But there ain't no one here!\n@c0@"
  ja: "@a@b＊「まあ　ベスったら\n\tだれか　来たのかと思ったら\n\tだあれも　いないじゃないの。\n@c0@"
  ko: "@a@b*: 그런 물건이 정말 있다면\n우리 마누라라도\n한번 비춰보고 싶구먼.\n@c0@"
  sl: "@a@b＊：贝斯你干什么呀，\n　　被你这么一叫，\n　　我还以为有人来了呢。\n@c0@"
  tl: "@a@b＊：貝斯你幹什麼呀，\n　　被你這麼一叫，\n　　我還以為有人來了呢。\n@c0@"
99:
  en: "@a@b*: What a silly mutt... Come here now, get away from that door.\n@c0@"
  ja: "@a@b＊「へんな子ねえ……。\n\tさあ　いらっしゃい。\n@c0@"
  ko: "@a@b*: 으르렁! 멍멍!\n@c0@"
  sl: "@a@b＊：真是奇怪……\n　　来，到这里来。\n@c0@"
  tl: "@a@b＊：真是奇怪……\n　　來，到這裡來。\n@c0@"
