  ja: "@a@b＊「さてと　もうすこし休んでから\n\t村に　もどるとしようかな。\n@c0@"
  ko: "@a@b''위험!!\n오두막 안의 우물에\n다가가지 말 것!!''\n@c0@"
  sl: "@a@b＊：嗯，再休息一下，\n　　然后回村子吧。\n@c0@"
  tl: "@a@b＊：嗯，再休息一下，\n　　然後回村子吧。\n@c0@"
105:
