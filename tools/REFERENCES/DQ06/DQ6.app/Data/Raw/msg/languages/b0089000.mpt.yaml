  ko: "@a@b곤: 사양하면 내가\n다 먹어 버릴 테다!\n하하핫!!\n@c0@"
  sl: "@a@b格恩：你要是不好意思放开了吃的话，\n　　那我可就全部吃掉了啊！\n@c0@"
  tl: "@a@b格恩：你要是不好意思放開了吃的話，\n　　那我可就全部吃掉了啊！\n@c0@"
162:
  en: "@a@b*: Captain Blade? He rushed down to the cells, I think.\n@c0@"
  ja: "@a@b＊「ソルディどのは　あわてて\n\t地下牢の方へ　いきましたよ。\n@c0@"
