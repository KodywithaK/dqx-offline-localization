  ja: "@a@b＊「反乱のとき　何も　お手伝い\n\tできなかったのに　今さら\n\t皆と　お酒なんて飲めませんよ……。\n@c0@"
  ko: "@a@b*: 반란 때 아무것도\n못 도왔는데 이제 와서\n여러분과 함께 술을 마실 순 없지요......\n@c0@"
