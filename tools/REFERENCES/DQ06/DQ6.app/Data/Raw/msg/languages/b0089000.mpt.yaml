  sl: "@a@b索迪：话说回来……\n　　原本我就不认为你们是普通人的，\n　　现在看来果然如此……\n@c0@"
  tl: "@a@b索迪：話說回來……\n　　原本我就不認為你們是普通人的，\n　　現在看來果然如此……\n@c0@"
206:
  en: "@aCaptain Blade@bI remember the first time we met, when you came to the castle to join the military.\n@c0@"
  ja: "@a@bソルディ「思えば　%a000090らと\n\tはじめて会ったのは　城の志願兵に\n\tおうぼ　してきたときだったな。\n@c0@"
  ko: "@a@b솔디: 생각해 보면\n%a000090 일행과 처음 \n만난 건 성의 병사가 되려고\n지원했을 때였지.\n@c0@"
  sl: "@a@b索迪：回想起来，\n　　和%a000090你们初次见面\n　　还是在招募城堡志愿兵的时候啊。\n@c0@"
