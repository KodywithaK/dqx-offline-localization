  tl: "@a@b索迪：什、什麼……\n@c0@"
192:
  en: "@aBenjamin@bIsaac is imprisoned close to the Archfiend's castle.\n@c0@"
  ja: "@a@bクリムト「大賢者マサールは\n\t大魔王の城の　近くに\n\tとらえられておる。\n@c0@"
  ko: "@a@b클림트: 대현자 마살은\n대마왕의 성 근처에\n갇혀 있소.\n@c0@"
  sl: "@a@b克林姆：大贤者马萨尔被关押在\n　　大魔王城堡附近的地方。\n@c0@"
  tl: "@a@b克林姆：大賢者馬薩爾被關押在\n　　大魔王城堡附近的地方。\n@c0@"
193:
