204:
  en: "@aCaptain Blade@bHe appears to have fallen asleep. Well, it is no surprise after expending that much energy...\n@c0@"
  ja: "@a@bソルディ「どうやら　ねむってしまった\n\tようだ。　無理もない。　あのような\n\tチカラを　ふりしぼられたのだから……。\n@c0@"
