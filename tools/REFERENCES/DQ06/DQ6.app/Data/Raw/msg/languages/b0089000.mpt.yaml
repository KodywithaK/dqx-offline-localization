  sl: "@a@b＊：感觉真是空虚啊。\n　　唉……\n@c0@"
  tl: "@a@b＊：感覺真是空虛啊。\n　　唉……\n@c0@"
171:
  en: "@a@b*: Once the Archfiend is defeated, I dream of returning the people who sleep here to their world.\n@c0@"
  ja: "@a@b＊「いつか　大魔王も　ほろんだら\n\tここに眠ってる　ひとたちも\n\tもとの世界に　帰してあげたい。\n@c0@"
  ko: "@a@b*: 언젠가 대마왕도 쓰러지면\n여기에 잠든 사람들도\n원래의 세계로 돌려보내 주고 싶어.\n@c0@"
