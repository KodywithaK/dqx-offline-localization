  tl: "@a@b＊：我是他唯一的弟弟，\n　　克林姆。\n@c0@"
191:
  en: "@aCaptain Blade@bWh-What!?\n@c0@"
  ja: "@a@bソルディ「な　なんと……！？\n@c0@"
