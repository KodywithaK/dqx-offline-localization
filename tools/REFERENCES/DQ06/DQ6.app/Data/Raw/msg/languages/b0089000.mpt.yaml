  tl: "@a@b＊：那種人和我\n　　完全沒有共同語言啊。\n@c0@"
168:
  en: "@a@b*: Good thing I didn't start digging yet!\n@c0@"
  ja: "@a@b＊「自殺なんか　しないで\n\t本当に　よかったわ！\n@c0@"
  ko: "@a@b*: 자살 안 하길\n정말 잘했어!\n@c0@"
  sl: "@a@b＊：没有干自杀这种傻事\n　　真是太好了！\n@c0@"
  tl: "@a@b＊：沒有幹自殺這種傻事\n　　真是太好了！\n@c0@"
169:
