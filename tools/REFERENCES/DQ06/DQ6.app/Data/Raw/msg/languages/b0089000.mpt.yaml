  sl: "@a@b%a000120收下了一颗\n闪闪发光的小小光之玉！\n@c0@"
  tl: "@a@b%a000120收下了一顆\n閃閃發光的小小光之玉！\n@c0@"
200:
  en: "@aBenjamin@bYou hold in your hands the orb of truth.\n@c0@"
  ja: "@a@bクリムト「それは　真実のオーブ。\n@c0@"
  ko: "@a@b클림트: 그것은 진실의 오브.\n@c0@"
