  sl: "@a@b＊：你们几个人，难道打算\n　　要连大魔王也打倒吗？\n　　凭你们的本事，还真不是不可能。\n@c0@"
  tl: "@a@b＊：你們幾個人，難道打算\n　　要連大魔王也打倒嗎？\n　　憑你們的本事，還真不是不可能。\n@c0@"
165:
