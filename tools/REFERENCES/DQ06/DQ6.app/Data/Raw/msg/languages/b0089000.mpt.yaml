  tl: "@a@b克林姆：那是真實之珠。\n@c0@"
201:
  en: "@aBenjamin@bStand on Death's Cape to the north-west of here and hold it aloft above the Sea of Nothingness.\n㈡\nThen you will see this world's true form.\n@c0@"
  ja: "@a@bクリムト「この町より　北西にある\n\t暗黒の岬から　無の海に　かざせば\n\tこの世界の　真の姿が見えるだろう。\n@c0@"
  ko: "@a@b클림트: 이 마을에서 북서쪽에 있는\n암흑의 곶에서 무의 바다를 향해 치켜들면\n이 세계의 진정한 모습이 보일 것이오.\n@c0@"
  sl: "@a@b克林姆：从这座小镇西北部的暗黑海角，\n　　向虚无之海举起它，就能看到\n　　这个世界真实的样子。\n@c0@"
  tl: "@a@b克林姆：從這座小鎮西北部的暗黑海角，\n　　向虛無之海舉起它，就能看到\n　　這個世界真實的樣子。\n@c0@"
202:
  en: "@aBenjamin@bY-You can...㈢㈢ Y-You must...\n@c0@"
