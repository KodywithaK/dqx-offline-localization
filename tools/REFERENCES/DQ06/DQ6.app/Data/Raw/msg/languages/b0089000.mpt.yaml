  sl: "@a@b＊：索迪阁下慌慌张张地\n　　往地牢的方向去了。\n@c0@"
  tl: "@a@b＊：索迪閣下慌慌張張地\n　　往地牢的方向去了。\n@c0@"
163:
  en: "@a@b*: Those darn soldiers secreted stacks of food around the place. Tonight we're goin' to eat our fill!\n@c0@"
  ja: "@a@b＊「兵士のヤツら　食べものを\n\tごっそり　かくしてたんだぜ。\n\t今夜は　ごちそうだ！　へへへ。\n@c0@"
