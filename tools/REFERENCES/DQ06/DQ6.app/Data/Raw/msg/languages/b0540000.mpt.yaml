  sl: "@a@b%a002030：好像那件\n　　不想让我们知道的事\n　　已经发生了呢。\n@c0@"
  tl: "@a@b%a002030：好像那件\n　　不想讓我們知道的事\n　　已經發生了呢。\n@c0@"
124:
  en: "@a%0%a002000@bAvast! Hey, %a000090! Let's take those stairs up to the roof!\n@c0@"
