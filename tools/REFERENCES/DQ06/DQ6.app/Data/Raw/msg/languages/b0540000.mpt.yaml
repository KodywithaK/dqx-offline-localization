  sl: "@a@b%a002020：地震啦！地震啦！\n　　哎呀，这么剧烈啊！\n@c0@"
  tl: "@a@b%a002020：地震啦！地震啦！\n　　哎呀，這麼劇烈啊！\n@c0@"
118:
  en: "@a%0%a002030@bWh-What is going on!? C-Can this really be an earthquake!?\n@c0@"
