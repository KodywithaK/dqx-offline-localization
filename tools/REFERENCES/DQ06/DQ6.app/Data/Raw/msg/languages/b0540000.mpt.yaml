  sl: "@a@b%a002020：表情看上去\n　　好像很难过呢。\n@c0@"
  tl: "@a@b%a002020：表情看上去\n　　好像很難過呢。\n@c0@"
97:
  en: "@a%0%a002030@bThat dog does seem somewhat down in the mouth. I wonder what the matter could be...\n@c0@"
  ja: "@a@b%a002030「ちょっと　元気のない\n\tなきごえですが　とくに病気と\n\t言うわけでは　なさそうです。\n@c0@"
