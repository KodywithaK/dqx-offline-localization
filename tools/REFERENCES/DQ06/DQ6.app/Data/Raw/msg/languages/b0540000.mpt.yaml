  tl: "@a@b%a002040：這大叔這麼害怕，\n　　即使從這裡\n　　也回不去吧？\n@c0@"
251:
  en: "@a%0%a002060@b(snarl) Monsters not scary... %0%a002060's friends stronger... (slobber) \n@c0@"
  ja: "@a@b%a002060「カイブツ…こわくない……。\n\t仲間のみんな…もっと強い……。\n@c0@"
  ko: "@a@b%a002060: 괴물...안 무섭다......\n우리 동료...더 강하다......\n@c0@"
  sl: "@a@b%a002060：怪物……不可怕……\n　　大伙……更强……\n@c0@"
  tl: "@a@b%a002060：怪物……不可怕……\n　　大夥……更強……\n@c0@"
252:
  en: "@a%0%a002070@bBoing? (slurp)\n@c0@"
  ja: "@a@b%a002070「プルルッ！\n@c0@"
  ko: "@a@b%a002070: 뽀요용!\n@c0@"
  sl: "@a@b%a002070：噗噜噜！\n@c0@"
  tl: "@a@b%a002070：噗嚕嚕！\n@c0@"
253:
  en: "@a%0%a002000@bHey, let's give it a tug. It ain't like we've got any other leads...\n@c0@"
  ja: "@a@b%a002000「引っこぬいてみたら\n\tいいんじゃないか？\n\tほかに　手がかりもないし。\n@c0@"
  ko: "@a@b%a002000: 뽑아 보면\n될 것 같은데?\n다른 단서도 없고 말이야.\n@c0@"
  sl: "@a@b%a002000：使劲拔一拔试试吧？\n　　反正也没什么\n　　别的线索。\n@c0@"
  tl: "@a@b%a002000：使勁拔一拔試試吧？\n　　反正也沒什麼\n　　別的線索。\n@c0@"
254:
  en: "@a%0%a002010@bHow strange... It's a plant, and yet I sense it has a certain...intelligence.\n@c0@"
  ja: "@a@b%a002010「ふしぎね。\n\t草なのに　なんだか\n\tかしこそうに　見えるわ。\n@c0@"
  ko: "@a@b%a002010: 희한한걸.\n풀인데도 왠지\n똑똑해 보여.\n@c0@"
  sl: "@a@b%a002010：真不可思议。\n　　虽然是棵小草，\n　　但看上去挺聪明的呢。\n@c0@"
  tl: "@a@b%a002010：真不可思議。\n　　雖然是棵小草，\n　　但看上去挺聰明的呢。\n@c0@"
255:
  en: "@a%0%a002020@bC'mon, give the plant a pull! You know you want to!\n@c0@"
  ja: "@a@b%a002020「思い切って\n\t引っぱって　みましょうよ。\n@c0@"
  ko: "@a@b%a002020: 과감하게\n잡아당겨 보자구.\n@c0@"
  sl: "@a@b%a002020：大胆地拔吧。\n@c0@"
  tl: "@a@b%a002020：大膽地拔吧。\n@c0@"
256:
  en: "@a%0%a002030@bThis plant seems to have grown in a way that virtually cries out to be uprooted...\n@c0@"
  ja: "@a@b%a002030「いかにも　引っこぬいて\n\tみたくなるような\n\tはえかたですよねえ。\n@c0@"
  ko: "@a@b%a002030: 정말이지 뽑아보고 싶게\n돋아 있네요.\n@c0@"
  sl: "@a@b%a002030：这棵草长得\n　　一看就让人\n　　想拔一拔呢。\n@c0@"
  tl: "@a@b%a002030：這棵草長得\n　　一看就讓人\n　　想拔一拔呢。\n@c0@"
257:
  en: "@a%0%a002040@bWe didn't come all this way just to look at a plant.\n@c0@"
  ja: "@a@b%a002040「ここまできて\n\t抜かないで　帰るのか？\n@c0@"
  ko: "@a@b%a002040: 여기까지 와서\n안 뽑고 돌아가는 거냐?\n@c0@"
  sl: "@a@b%a002040：都已经到这里了，\n　　不拔了它就空手而归吗？\n@c0@"
  tl: "@a@b%a002040：都已經到這裡了，\n　　不拔了它就空手而歸嗎？\n@c0@"
258:
  en: "@a%0%a002060@b(spit) %0%a002060 like meat... Not so much grass... (slobber)\n@c0@"
  ja: "@a@b%a002060「私…草…食べない……。\n@c0@"
  ko: "@a@b%a002060: 나...풀...안 먹는다......\n@c0@"
  sl: "@a@b%a002060：我……不吃……草……\n@c0@"
  tl: "@a@b%a002060：我……不吃……草……\n@c0@"
259:
  en: "@a%0%a002070@bBoing...? Boing!\n@c0@"
  ja: "@a@b%a002070「プルププーッ！\n@c0@"
  ko: "@a@b%a002070: 뽀르르~뽀!\n@c0@"
  sl: "@a@b%a002070：噗噜噗噗！\n@c0@"
  tl: "@a@b%a002070：噗嚕噗噗！\n@c0@"
260:
  en: "@a%0%a002000@bBlimey! Lectured by a plant? That's a first!\n@c0@"
  ja: "@a@b%a002000「生まれて　このかた\n\t草に　おこられるとは\n\t思ってもみなかったぜ！\n@c0@"
  ko: "@a@b%a002000: 태어나서 지금껏\n풀한테 혼나리라고는\n생각도 못 했군!\n@c0@"
  sl: "@a@b%a002000：俺从没想到\n　　这辈子居然\n　　会被一棵草骂！\n@c0@"
  tl: "@a@b%a002000：俺從沒想到\n　　這輩子居然\n　　會被一棵草罵！\n@c0@"
261:
  en: "@a%0%a002010@bIt's right, you know. We are looking for seeds. Pulling up a plant makes no sense...\n@c0@"
  ja: "@a@b%a002010「たしかに　言われてみれば\n\t私たちが　探していたのは\n\tタネだったわね……。\n@c0@"
  ko: "@a@b%a002010: 그래, 말을 듣고 보니\n우리가 찾는 건\n씨앗이었어......\n@c0@"
  sl: "@a@b%a002010：这么说来\n　　的确也是，\n　　我们找的是种子呢……\n@c0@"
  tl: "@a@b%a002010：這麼說來\n　　的確也是，\n　　我們找的是種子呢……\n@c0@"
262:
  en: "@a%0%a002020@bWow, a talking plant!? Now I've seen everything!\n@c0@"
  ja: "@a@b%a002020「それにしても\n\t草が　クチを　きくなんて\n\tビックリだねー！\n@c0@"
  ko: "@a@b%a002020: 그나저나\n풀이 말을 하다니\n깜짝 놀랐어~!\n@c0@"
  sl: "@a@b%a002020：不过，\n　　草居然会说话，\n　　真是吓到我了呢！\n@c0@"
