  sl: "@a@b%a002020：%a002050都\n　　推荐那里了啊。\n　　我们就去投宿吧好不好！\n@c0@"
  tl: "@a@b%a002020：%a002050都\n　　推薦那裡了啊。\n　　我們就去投宿吧好不好！\n@c0@"
112:
  en: "@a%0%a002030@bStandard practice in the innkeeping world is to welcome guests who want to stay the night...\n@c0@"
  ja: "@a@b%a002030「ふつうの　宿屋なら\n\tお客がくれば　よろこんで\n\t泊めてくれるはず……。\n@c0@"
  ko: "@a@b%a002030: 보통 여관이라면\n손님이 왔을 때 기꺼이\n방을 내줄 텐데......\n@c0@"
  sl: "@a@b%a002030：普通的旅店\n　　要是来了客人，\n　　老板应该会很高兴才对……\n@c0@"
  tl: "@a@b%a002030：普通的旅店\n　　要是來了客人，\n　　老闆應該會很高興才對……\n@c0@"
113:
  en: "@a%0%a002030@bThere is something odd afoot. I suggest we give this fellow one more try.\n@c0@"
  ja: "@a@b%a002030「何か　おかしいですね。\n\tもういちど　ねばってみたら\n\tどうでしょうか。\n@c0@"
