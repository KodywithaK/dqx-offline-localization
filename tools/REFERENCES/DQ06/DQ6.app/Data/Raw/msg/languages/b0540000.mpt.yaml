  sl: "@a@b%a002020：真了不起啊！\n　　它一直在这里\n　　保护着%a002050呢！\n@c0@"
  tl: "@a@b%a002020：真了不起啊！\n　　它一直在這裡\n　　保護著%a002050呢！\n@c0@"
101:
  en: "@a%0%a002030@bI'm sure he'll come bouncing back as soon as %a002050 has recovered.\n@c0@"
  ja: "@a@b%a002030「%a002050さんが　なおれば\n\tこのコも　元気に　なりますね！\n@c0@"
  ko: "@a@b%a002030: %a002050 님이 나으면\n이 개도 기운을 되찾겠군요!\n@c0@"
  sl: "@a@b%a002030：%a002050病好的话，\n　　小狗也会精神起来吧！\n@c0@"
  tl: "@a@b%a002030：%a002050病好的話，\n　　小狗也會精神起來吧！\n@c0@"
102:
  en: "@a%0%a002000@bSo that's %a002050, aye?\n@c0@"
  ja: "@a@b%a002000「この人が\n\t%a002050さん　だったんだな。\n@c0@"
  ko: "@a@b%a002000: 이 사람이\n%a002050 씨였군.\n@c0@"
  sl: "@a@b%a002000：这个人就是\n　　%a002050啊。\n@c0@"
  tl: "@a@b%a002000：這個人就是\n　　%a002050啊。\n@c0@"
103:
  en: "@a%0%a002000@bI thought he'd be more mean 'n' muscular, but he seems like a nice enough fella.\n@c0@"
  ja: "@a@b%a002000「もっと　ごつい男を\n\tそうぞうしてたけど\n\tやさしそうな　人じゃないか。\n@c0@"
