  sl: "@a@b%a002000：俺还以为\n　　是个糙汉子呢。\n　　没想到还挺温柔的嘛。\n@c0@"
  tl: "@a@b%a002000：俺還以為\n　　是個糙漢子呢。\n　　沒想到還挺溫柔的嘛。\n@c0@"
104:
  en: "@a%0%a002010@b%0%a002050 isn't just a hero — he's a gentleman too.\n@c0@"
  ja: "@a@b%a002010「%a002050さんって……\n\t本当に　いい人なのね。\n@c0@"
  ko: "@a@b%a002010: %a002050 씨는......\n정말 좋은 사람이구나.\n@c0@"
  sl: "@a@b%a002010：%a002050……\n　　真是个好人呢。\n@c0@"
  tl: "@a@b%a002010：%a002050……\n　　真是個好人呢。\n@c0@"
105:
  en: "@a%0%a002020@bOh... So %a002050 got bit on his butt, huh?\n@c0@"
  ja: "@a@b%a002020「%a002050さん\n\tオシリ　かまれたんだ……。\n@c0@"
  ko: "@a@b%a002020: %a002050 씨,\n엉덩이를 물렸구나......\n@c0@"
  sl: "@a@b%a002020：%a002050\n　　屁股被咬了啊……\n@c0@"
  tl: "@a@b%a002020：%a002050\n　　屁股被咬了啊……\n@c0@"
106:
  en: "@a%0%a002030@bMight I suggest that we take our leave?\n@c0@"
  ja: "@a@b%a002030「それでは　そろそろ\n\t失礼しましょうか。\n@c0@"
  ko: "@a@b%a002030: 그럼 슬슬\n가 보죠.\n@c0@"
  sl: "@a@b%a002030：我们差不多\n　　该走了吧。\n@c0@"
  tl: "@a@b%a002030：我們差不多\n　　該走了吧。\n@c0@"
107:
  en: "@a%0%a002030@bPerhaps we should take %a002050's advice and find a bed for the evening here in town.\n@c0@"
  ja: "@a@b%a002030「%a002050さんの\n\tおすすめどおり　今日は　この町で\n\t宿をとることに　しませんか？\n@c0@"
