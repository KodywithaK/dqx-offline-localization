  sl: "@a@b%a002010：你们不觉得\n　　这个老板是在\n　　隐瞒什么事么？\n@c0@"
  tl: "@a@b%a002010：你們不覺得\n　　這個老闆是在\n　　隱瞞什麼事麼？\n@c0@"
110:
  en: "@a%0%a002020@bWait, what? We're not staying here?\n@c0@"
  ja: "@a@b%a002020「えー？\n\t泊まって　行かないのー？\n@c0@"
  ko: "@a@b%a002020: 뭐~?\n안 자고 간다고~?\n@c0@"
  sl: "@a@b%a002020：诶？\n　　不去投宿吗？\n@c0@"
  tl: "@a@b%a002020：誒？\n　　不去投宿嗎？\n@c0@"
111:
  en: "@a%0%a002020@bOh, come on! %0%a002050 recommended it to us and everything!\n@c0@"
  ja: "@a@b%a002020「%a002050さんからも\n\tすすめられたんだから\n\t泊まって　行こうよー！\n@c0@"
