  tl: "@a@b%a002030：神父大人的話裡\n　　好像有什麼更深層的含義。\n@c0@"
29:
  en: "@a%0%a002000@b‘That terrible day’? Did he stub his toe or something?\n@c0@"
  ja: "@a@b%a002000「あの日……？\n\tなにか　悪い物でも\n\t食べたのか？\n@c0@"
  ko: "@a@b%a002000: 그날......?\n뭐 안 좋은 음식이라도\n먹은 건가?\n@c0@"
  sl: "@a@b%a002000：那天？\n　　是吃什么东西\n　　吃坏了吗？\n@c0@"
  tl: "@a@b%a002000：那天？\n　　是吃什麼東西\n　　吃壞了嗎？\n@c0@"
30:
  en: "@a%0%a002010@bI'm curious about this %a002050 fellow.\n@c0@"
  ja: "@a@b%a002010「その　%a002050さんの\n\tこと……もう少し　くわしく\n\t知りたいわね。\n@c0@"
  ko: "@a@b%a002010: 그 %a002050 씨라는\n사람...... 좀 더 자세히\n알아봤으면 해.\n@c0@"
  sl: "@a@b%a002010：那个叫%a002050的人……\n　　好想多了解一点\n　　他的事情啊。\n@c0@"
  tl: "@a@b%a002010：那個叫%a002050的人……\n　　好想多瞭解一點\n　　他的事情啊。\n@c0@"
31:
  en: "@a%0%a002010@bCome on, %a000090, let's ask around town to see if we can learn some more about him.\n@c0@"
