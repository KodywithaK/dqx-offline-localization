  tl: "@a@b%a002030：真奇怪。\n　　再纏纏他看看。\n@c0@"
114:
  en: "@a%0%a002000@bAvast! You hear that!?\n@c0@"
  ja: "@a@b%a002000「うひゃあ！\n\tものすごい　音だぜ！！\n@c0@"
  ko: "@a@b%a002000: 으아앗!\n이 엄청난 소린 뭐지!!\n@c0@"
  sl: "@a@b%a002000：哎呀！\n　　这么大响声！！\n@c0@"
  tl: "@a@b%a002000：哎呀！\n　　這麼大響聲！！\n@c0@"
115:
  en: "@a%0%a002000@bLet's go outside 'n' see what's doin', %a000090!\n@c0@"
  ja: "@a@b%a002000「とにかく　外に出て\n\tしらべてみようぜ　%a000090！\n@c0@"
  ko: "@a@b%a002000: 어쨌든 밖으로 \n나가 알아보자, %a000090!\n@c0@"
  sl: "@a@b%a002000：总之先出去\n　　看看情况吧，%a000090！\n@c0@"
  tl: "@a@b%a002000：總之先出去\n　　看看情況吧，%a000090！\n@c0@"
116:
  en: "@a%0%a002010@bThis is no ordinary earthquake!\n@c0@"
  ja: "@a@b%a002010「これは　ふつうの\n\tじしんじゃ　なさそうだわ！\n@c0@"
  ko: "@a@b%a002010: 이건 보통\n지진은 아닌 것 같아!\n@c0@"
  sl: "@a@b%a002010：这好像不是\n　　普通的地震啊。\n@c0@"
  tl: "@a@b%a002010：這好像不是\n　　普通的地震啊。\n@c0@"
117:
  en: "@a%0%a002020@bAck! Earthquake! Ohhh, it's a big one too!\n@c0@"
