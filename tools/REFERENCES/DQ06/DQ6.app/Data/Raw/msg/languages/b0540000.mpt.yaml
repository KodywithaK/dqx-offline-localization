  tl: "@a@b%a002010：小鎮被綠樹環繞著，\n　　真是太美了。\n@c0@"
12:
  en: "@a%0%a002020@bHey, are we ready to sleep yet?\n@c0@"
  ja: "@a@b%a002020「ねえねえ\n\t早く　宿屋で　休もうよー。\n@c0@"
  ko: "@a@b%a002020: 저기, 있잖아.\n빨리 여관에 가서 쉬자~\n@c0@"
  sl: "@a@b%a002020：喂喂，\n　　赶紧去旅店休息吧。\n@c0@"
  tl: "@a@b%a002020：喂喂，\n　　趕緊去旅店休息吧。\n@c0@"
