  sl: "@a@b%a002010：好像不愿意\n　　放我们过去呢。\n　　从别的地方绕过去吧。\n@c0@"
  tl: "@a@b%a002010：好像不願意\n　　放我們過去呢。\n　　從別的地方繞過去吧。\n@c0@"
121:
  en: "@a%0%a002020@bHey! Why isn't he letting us out, huh!?\n@c0@"
