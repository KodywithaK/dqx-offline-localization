  ko: "@a@b%a002000: 이봐, %a000090!\n저 계단을 통해\n옥상으로 올라가 보자고!\n@c0@"
  sl: "@a@b%a002000：喂，%a000090！\n　　从那边那个楼梯\n　　爬到屋顶上去吧！\n@c0@"
  tl: "@a@b%a002000：喂，%a000090！\n　　從那邊那個樓梯\n　　爬到屋頂上去吧！\n@c0@"
125:
  en: "@a%0%a002010@bThis has been happening in this town every night!?\n@c0@"
