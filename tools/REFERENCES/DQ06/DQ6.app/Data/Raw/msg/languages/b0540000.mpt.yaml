194:
  en: "@a%0%a002020@bSeeds...of reason?\n@c0@"
  ja: "@a@b%a002020「理性の……タネ！？\n@c0@"
  ko: "@a@b%a002020: 이성의......씨앗!?\n@c0@"
  sl: "@a@b%a002020：理性……种子？！\n@c0@"
  tl: "@a@b%a002020：理性……種子？！\n@c0@"
195:
  en: "@a%0%a002030@bSeeds of reason? Perhaps they still grow somewhere nearby...\n@c0@"
  ja: "@a@b%a002030「理性のタネ……\n\tいまでも　どこかで\n\t手に入るのでしょうかね。\n@c0@"
  ko: "@a@b%a002030: 이성의 씨앗이라......\n지금도 어딘가에서\n얻을 수 있는 걸까요?\n@c0@"
  sl: "@a@b%a002030：理性种子……\n　　我们去哪里找一找吧。\n@c0@"
  tl: "@a@b%a002030：理性種子……\n　　我們去哪裡找一找吧。\n@c0@"
196:
  en: "@a%0%a002000@bThe seeds're on a mountain to the north, right? That's what that old lady told us!\n@c0@"
  ja: "@a@b%a002000「理性のタネは　北の山だろ？\n\tばあさんに　聞いてきたぜ！\n@c0@"
  ko: "@a@b%a002000: 이성의 씨앗은 북쪽 산에 있다며?\n할머니한테 듣고 왔지!\n@c0@"
  sl: "@a@b%a002000：老婆婆不是说了吗？\n　　理性种子在北边的山上！\n@c0@"
  tl: "@a@b%a002000：老婆婆不是說了嗎？\n　　理性種子在北邊的山上！\n@c0@"
197:
  en: "@a%0%a002010@b%0%a002050's problem is like sleepwalking, isn't it? Maybe the seeds of reason can help!\n@c0@"
  ja: "@a@b%a002010「%a002050さんも\n\t夢遊病　みたいなものなら\n\t理性のタネが　きくはずよね！\n@c0@"
  ko: "@a@b%a002010: %a002050 씨도\n몽유병 같은 거라면\n이성의 씨앗이 효과가 있을 거야!\n@c0@"
  sl: "@a@b%a002010：%a002050的病症\n　　也像是梦游症，\n　　理性种子应该能起效！\n@c0@"
  tl: "@a@b%a002010：%a002050的病症\n　　也像是夢遊症，\n　　理性種子應該能起效！\n@c0@"
198:
  en: "@a%0%a002020@bHe's not sleepwalking now, right? No. Er, didn't think so...\n@c0@"
  ja: "@a@b%a002020「この　おじいさん\n\tいまは　さんぽ中　だよね？\n\t夢遊病じゃ　ないよね？\n@c0@"
  ko: "@a@b%a002020: 이 할아버지\n지금은 산책 중인 거지?\n몽유병 아니지?\n@c0@"
  sl: "@a@b%a002020：这个老爷爷\n　　现在是在散步吧？\n　　不是在梦游吧？\n@c0@"
  tl: "@a@b%a002020：這個老爺爺\n　　現在是在散步吧？\n　　不是在夢遊吧？\n@c0@"
199:
  en: "@a%0%a002030@bWe cannot rest until we obtain these seeds of reason!\n@c0@"
  ja: "@a@b%a002030「理性のタネ。\n\t私たちも　きっと\n\t手に入れてみせますよ！\n@c0@"
  ko: "@a@b%a002030: 이성의 씨앗.\n우리도 꼭\n손에 넣을 겁니다!\n@c0@"
  sl: "@a@b%a002030：理性种子。\n　　我们一定会取来的！\n@c0@"
  tl: "@a@b%a002030：理性種子。\n　　我們一定會取來的！\n@c0@"
200:
  en: "@a%0%a002000@b...There really ain't no need for this, aye?\n@c0@"
  ja: "@a@b%a002000「うーん。\n\t今さら　かくさなくったって\n\tいいのにな。\n@c0@"
  ko: "@a@b%a002000: 으음.\n이제 와서 숨기지 않아도\n되는데 말이지.\n@c0@"
  sl: "@a@b%a002000：唔。\n　　事到如今\n　　没必要隐藏了吧。\n@c0@"
  tl: "@a@b%a002000：唔。\n　　事到如今\n　　沒必要隱藏了吧。\n@c0@"
201:
  en: "@a%0%a002010@bIf everyone kept everything to themselves, no problems would ever get solved.\n@c0@"
  ja: "@a@b%a002010「見なかったことにすれば\n\t何かが　かいけつするわけでも\n\tないわよね。\n@c0@"
  ko: "@a@b%a002010: 못 본 척한다고\n뭐가 해결되는 것도\n아니잖아.\n@c0@"
  sl: "@a@b%a002010：要是当做\n　　没看见的话，\n　　什么问题都解决不了呢。\n@c0@"
  tl: "@a@b%a002010：要是當做\n　　沒看見的話，\n　　什麼問題都解決不了呢。\n@c0@"
202:
  en: "@a%0%a002010@bIt's important for people to face up to their problems together, don't you think, %a000090?\n@c0@"
  ja: "@a@b%a002010「みんなで　ちゃんと\n\tもんだいに　向き合うことも\n\tだいじなのじゃ　ないかしら。\n@c0@"
  ko: "@a@b%a002010: 모두 함께\n문제를 제대로 직시하는 것도\n중요하지 않을까?\n@c0@"
  sl: "@a@b%a002010：大家齐心协力\n　　直面问题，\n　　这也很重要呢。\n@c0@"
  tl: "@a@b%a002010：大家齊心協力\n　　直面問題，\n　　這也很重要呢。\n@c0@"
203:
  en: "@a%0%a002020@bWell, we can't really un-see what we saw, so...\n@c0@"
  ja: "@a@b%a002020「見ちゃったものは\n\t見ちゃったもんねー。\n@c0@"
  ko: "@a@b%a002020: 벌써 본 건\n본 거라구~\n@c0@"
  sl: "@a@b%a002020：看到了就是看到了嘛。\n@c0@"
  tl: "@a@b%a002020：看到了就是看到了嘛。\n@c0@"
204:
  en: "@a%0%a002030@bA truth once learnt cannot be forgotten...\n@c0@"
  ja: "@a@b%a002030「できるものなら\n\t忘れてしまいたい　という気持ちが\n\tみなさんにも　あるのでしょう。\n@c0@"
  ko: "@a@b%a002030: 될 수 있다면\n잊어버리고 싶다는 마음이\n모두에게도 있는 거겠지요.\n@c0@"
  sl: "@a@b%a002030：要是可以的话，\n　　大家其实是很想\n　　忘记这件事的吧。\n@c0@"
  tl: "@a@b%a002030：要是可以的話，\n　　大家其實是很想\n　　忘記這件事的吧。\n@c0@"
205:
  en: "@a%0%a002000@bA few monsters are keepin' them from helpin' %a002050? Pfft. C'mon, %a000090, to the north!\n@c0@"
  ja: "@a@b%a002000「まものが　こわくて\n\t%a002050が　なおせるかってんだ！\n\t%a000090　行こうぜ　北の山へ！\n@c0@"
  ko: "@a@b%a002000: 마물을 무서워하면서\n어떻게 %a002050%F2050%X를%Y을%Z 고치려고!\n%a000090, 가자! 북쪽 산으로!\n@c0@"
  sl: "@a@b%a002000：要是害怕魔物，\n　　一辈子都治不好%a002050！\n　　%a000090，去北边的山上吧！\n@c0@"
  tl: "@a@b%a002000：要是害怕魔物，\n　　一輩子都治不好%a002050！\n　　%a000090，去北邊的山上吧！\n@c0@"
206:
  en: "@a%0%a002010@bI'm sure those seeds of reason will cure %a002050!\n@c0@"
  ja: "@a@b%a002010「その　理性のタネで\n\t%a002050さんが　なおせるかも\n\tしれないのね！\n@c0@"
  ko: "@a@b%a002010: 그 이성의 씨앗으로\n%a002050 씨가 나을 수\n있을지도 모른다니!\n@c0@"
  sl: "@a@b%a002010：那个理性种子，\n　　说不定能治好%a002050呢！\n@c0@"
  tl: "@a@b%a002010：那個理性種子，\n　　說不定能治好%a002050呢！\n@c0@"
207:
  en: "@a%0%a002010@bCome, %a000090 — northward to the mountain!\n@c0@"
  ja: "@a@b%a002010「ぜひ\n\t北の山へ　行ってみましょう！\n@c0@"
  ko: "@a@b%a002010: 꼭\n북쪽 산으로 가 보자!\n@c0@"
  sl: "@a@b%a002010：一定要去\n　　北边的山上看一看！\n@c0@"
  tl: "@a@b%a002010：一定要去\n　　北邊的山上看一看！\n@c0@"
208:
  en: "@a%0%a002020@bThat's got to be it! She said the seeds are somewhere on the mountain to the north of here, right?\n@c0@"
  ja: "@a@b%a002020「これよ　これ！！\n\t理性のタネは　北の山なのね！\n@c0@"
  ko: "@a@b%a002020: 이거야, 이거!!\n이성의 씨앗은 북쪽 산에 있구나!\n@c0@"
  sl: "@a@b%a002020：知道了，知道了！\n　　理性种子在北边的山上！\n@c0@"
  tl: "@a@b%a002020：知道了，知道了！\n　　理性種子在北邊的山上！\n@c0@"
209:
  en: "@a%0%a002030@bIf it stands even the slightest chance of helping, we have to try! Come — northward to the mountain!\n@c0@"
  ja: "@a@b%a002030「どんな　小さな\n\t可能性にも　かけてみましょう。\n\t北の山ですね！\n@c0@"
  ko: "@a@b%a002030: 아무리 작은\n가능성이라도 믿어 봅시다.\n북쪽 산이군요!\n@c0@"
  sl: "@a@b%a002030：只要有一丝希望，\n　　我们就不能放弃。\n　　去北边的山上看看吧！\n@c0@"
  tl: "@a@b%a002030：只要有一絲希望，\n　　我們就不能放棄。\n　　去北邊的山上看看吧！\n@c0@"
210:
  en: "@a%0%a002000@bWell, that's that.\n@c0@"
  ja: "@a@b%a002000「つ　ついに\n\t言っちまったか……。\n@c0@"
  ko: "@a@b%a002000: 겨, 결국\n말해 버렸군......\n@c0@"
  sl: "@a@b%a002000：终、终于\n　　说出来了啊……\n@c0@"
  tl: "@a@b%a002000：終、終於\n　　說出來了啊……\n@c0@"
211:
  en: "@a%0%a002000@b%0%a002050 took it a lot better than I would've.\n@c0@"
  ja: "@a@b%a002000「でも　まあ　本人が\n\tまに　受けなかったようだから\n\tホっとしたけどな。\n@c0@"
  ko: "@a@b%a002000: 하지만 뭐, 본인이\n심각하게 받아들이지 않는 것 같으니\n안심했지만 말이야.\n@c0@"
  sl: "@a@b%a002000：不过，他本人好像\n　　完全不相信这事，\n　　真是松了口气啊。\n@c0@"
  tl: "@a@b%a002000：不過，他本人好像\n　　完全不相信這事，\n　　真是鬆了口氣啊。\n@c0@"
212:
  en: "@a%0%a002010@bWhat did you think of %a002050's reaction, %a000090?\n@c0@"
  ja: "@a@b%a002010「%a002050さんの\n\tいまの　返事を　どう思う？\n\t%a000090。\n@c0@"
  ko: "@a@b%a002010: %a002050 씨의\n방금 그 대답 어떻게 생각해?\n%a000090.\n@c0@"
  sl: "@a@b%a002010：%a002050\n　　刚才的回答，\n　　你怎么看，%a000090？\n@c0@"
  tl: "@a@b%a002010：%a002050\n　　剛才的回答，\n　　你怎麼看，%a000090？\n@c0@"
213:
  en: "@a%0%a002010@bDo you think he really believes he turns into a monster? I wonder...\n@c0@"
  ja: "@a@b%a002010「自分が　怪物になる\n\tという話を　じつは　信じたのか\n\t本当に　信じなかったのか……。\n@c0@"
  ko: "@a@b%a002010: 자기가 괴물이 된다는\n이야기를 실제로는 믿은 건지\n정말로 믿지 않는 건지......\n@c0@"
  sl: "@a@b%a002010：自己会变成怪物这件事，\n　　他究竟是信了，\n　　还是没信呢？\n@c0@"
  tl: "@a@b%a002010：自己會變成怪物這件事，\n　　他究竟是信了，\n　　還是沒信呢？\n@c0@"
214:
  en: "@a%0%a002020@bHe just laughed it off...\n@c0@"
  ja: "@a@b%a002020「%a002050さん\n\t笑ってたね……。\n@c0@"
  ko: "@a@b%a002020: %a002050 씨\n웃고 있었지......\n@c0@"
  sl: "@a@b%a002020：%a002050\n　　在笑呢……\n@c0@"
  tl: "@a@b%a002020：%a002050\n　　在笑呢……\n@c0@"
215:
  en: "@a%0%a002020@bDo you think he's alright? I hope he doesn't leave town or anything.\n@c0@"
  ja: "@a@b%a002020「大丈夫だよね？\n\t町を　出て行ったり　しないよね？\n@c0@"
  ko: "@a@b%a002020: 괜찮겠지?\n마을을 나가 버리는 거 아니겠지?\n@c0@"
  sl: "@a@b%a002020：没事吧？\n　　他不会离开镇子的吧？\n@c0@"
  tl: "@a@b%a002020：沒事吧？\n　　他不會離開鎮子的吧？\n@c0@"
216:
  en: "@a%0%a002030@bSo you told %a002050 the truth.\n@c0@"
  ja: "@a@b%a002030「うーん　ついに\n\t話してしまいましたね……。\n@c0@"
  ko: "@a@b%a002030: 으음, 기어코\n이야기를 해 버렸군요......\n@c0@"
  sl: "@a@b%a002030：唔，终于\n　　说出来了呢……\n@c0@"
  tl: "@a@b%a002030：唔，終於\n　　說出來了呢……\n@c0@"
217:
  en: "@a%0%a002030@bI pray that this has a positive outcome...\n@c0@"
  ja: "@a@b%a002030「これが　いい結果に\n\tむすびつけば　いいのですが。\n@c0@"
  ko: "@a@b%a002030: 이것이 좋은 결과로\n이어지면 좋을 텐데.\n@c0@"
  sl: "@a@b%a002030：要是结局皆大欢喜\n　　就好了。\n@c0@"
  tl: "@a@b%a002030：要是結局皆大歡喜\n　　就好了。\n@c0@"
218:
  en: "@a%0%a002000@bWhew... Ain't as easy as ya think, aye?\n@c0@"
  ja: "@a@b%a002000「ふう……。\n\tやっぱ　本人には　いえないよな。\n@c0@"
  ko: "@a@b%a002000: 후우......\n역시 본인에겐 말 못 하겠군.\n@c0@"
  sl: "@a@b%a002000：唔……\n　　对他本人果然没法开口啊。\n@c0@"
  tl: "@a@b%a002000：唔……\n　　對他本人果然沒法開口啊。\n@c0@"
219:
  en: "@a%0%a002010@bI don't think I could look at that face and tell him the truth either, %a000090...\n@c0@"
  ja: "@a@b%a002010「%a002050さんの\n\t顔を見てたら　本当のことなんか\n\t話せないわよね……。\n@c0@"
  ko: "@a@b%a002010: %a002050 씨의\n얼굴을 보고 있으니 진실을\n말할 수가 없어......\n@c0@"
  sl: "@a@b%a002010：看到%a002050的脸，\n　　无论如何都\n　　说不出真相呢……\n@c0@"
  tl: "@a@b%a002010：看到%a002050的臉，\n　　無論如何都\n　　說不出真相呢……\n@c0@"
220:
  en: "@a%0%a002020@bIt's not easy actually telling someone something like that, is it?\n@c0@"
  ja: "@a@b%a002020「本人を　目の前にして\n\tいちばん　だいじなことを\n\tいえないって　つらいわね……。\n@c0@"
  ko: "@a@b%a002020: 본인을 앞에 두고\n가장 중요한 사실을\n말할 수 없으니 힘드네......\n@c0@"
  sl: "@a@b%a002020：面对着本人，\n　　却说不出最关键的事情，\n　　真是太难受了……\n@c0@"
  tl: "@a@b%a002020：面對著本人，\n　　卻說不出最關鍵的事情，\n　　真是太難受了……\n@c0@"
221:
  en: "@a%0%a002030@bI dare say that withholding the truth from him was the wisest choice.\n@c0@"
  ja: "@a@b%a002030「まあ　今は\n\tいわなくて　正解なのでは\n\tないでしょうか。\n@c0@"
  ko: "@a@b%a002030: 뭐, 오늘은\n말 안 하길 잘한 것\n아닐까요?\n@c0@"
  sl: "@a@b%a002030：唉，\n　　现在别告诉他实情\n　　才是明智的选择吧。\n@c0@"
  tl: "@a@b%a002030：唉，\n　　現在別告訴他實情\n　　才是明智的選擇吧。\n@c0@"
222:
  en: "@a%0%a002000@bHe can count on us to stay mum, aye %a000090?\n@c0@"
  ja: "@a@b%a002000「もちろん　だれにも\n\t言わないよな　%a000090！\n@c0@"
  ko: "@a@b%a002000: 물론 아무한테도\n말 안 하겠지, %a000090!\n@c0@"
  sl: "@a@b%a002000：咱当然不会告诉别人的，\n　　是吧，%a000090！\n@c0@"
  tl: "@a@b%a002000：咱當然不會告訴別人的，\n　　是吧，%a000090！\n@c0@"
223:
  en: "@a%0%a002000@bAhoy! The seeds of reason are here somewhere! Let's find 'em!\n@c0@"
  ja: "@a@b%a002000「よし！\n\tこの山の　どこかに\n\t理性のタネが　あるんだな！\n@c0@"
  ko: "@a@b%a002000: 좋아!\n이 산 어딘가에\n이성의 씨앗이 있겠군!\n@c0@"
  sl: "@a@b%a002000：好！\n　　这座山某个地方\n　　有理性种子吧！\n@c0@"
  tl: "@a@b%a002000：好！\n　　這座山某個地方\n　　有理性種子吧！\n@c0@"
224:
  en: "@a%0%a002010@bThis may seem like a tranquil place, but I sense we need to beware of monsters...\n@c0@"
  ja: "@a@b%a002010「パッと見は\n\t静かそうな　ところだけど\n\tまものには　気をつけましょうね。\n@c0@"
  ko: "@a@b%a002010: 언뜻 보기에는\n조용해 보이는 곳이지만\n마물을 조심하자구.\n@c0@"
  sl: "@a@b%a002010：看上去倒是个\n　　安静的地方。\n　　不过要小心魔物啊。\n@c0@"
  tl: "@a@b%a002010：看上去倒是個\n　　安靜的地方。\n　　不過要小心魔物啊。\n@c0@"
225:
  en: "@a%0%a002020@bHuh? Hey, I think there's someone up there.\n@c0@"
  ja: "@a@b%a002020「あれ？\n\tすぐ　上のほうに\n\tだれか　いるみたいだよ。\n@c0@"
  ko: "@a@b%a002020: 어라?\n바로 위에\n누가 있는 것 같아.\n@c0@"
  sl: "@a@b%a002020：诶？\n　　正上方好像\n　　有人在那里。\n@c0@"
  tl: "@a@b%a002020：誒？\n　　正上方好像\n　　有人在那裡。\n@c0@"
226:
  en: "@a%0%a002030@bLet's just hope these seeds of reason aren't too well hidden.\n@c0@"
  ja: "@a@b%a002030「理性のタネが\n\tすぐに　見つかると\n\tいいのですが。\n@c0@"
  ko: "@a@b%a002030: 이성의 씨앗을\n금방 찾으면\n좋겠군요.\n@c0@"
  sl: "@a@b%a002030：要是很快就能\n　　找到理性种子\n　　就好了。\n@c0@"
  tl: "@a@b%a002030：要是很快就能\n　　找到理性種子\n　　就好了。\n@c0@"
227:
  en: "@a%0%a002040@bLet's get this over with.\n@c0@"
  ja: "@a@b%a002040「さっさと　かたづけようぜ。\n@c0@"
  ko: "@a@b%a002040: 빨리 해치우자.\n@c0@"
  sl: "@a@b%a002040：赶紧搞定吧。\n@c0@"
  tl: "@a@b%a002040：趕緊搞定吧。\n@c0@"
228:
  en: "@a%0%a002060@b(snarl) Grrr... Mountain steep... Air thin... (spit)\n@c0@"
  ja: "@a@b%a002060「ギルルル……。\n\t山…　高い……。\n\t空気…　うすくなる……。\n@c0@"
  ko: "@a@b%a002060: 캬르르르......\n산...높다......\n공기...없어진다......\n@c0@"
  sl: "@a@b%a002060：咕噜噜……\n　　山……高……\n　　气……薄……\n@c0@"
  tl: "@a@b%a002060：咕嚕嚕……\n　　山……高……\n　　氣……薄……\n@c0@"
229:
  en: "@a%0%a002070@bBoing! (jiggle)\n@c0@"
  ja: "@a@b%a002070「プルプルーッ！\n@c0@"
  ko: "@a@b%a002070: 뽀용뽀요용~!\n@c0@"
  sl: "@a@b%a002070：噗噜噗噜！\n@c0@"
  tl: "@a@b%a002070：噗嚕噗嚕！\n@c0@"
230:
  en: "@a%0%a002000@bThese caverns are startin' to make my head hurt...\n@c0@"
  ja: "@a@b%a002000「この山は　思ったより\n\t入りくんでいる　ようだな。\n@c0@"
  ko: "@a@b%a002000: 이 산은 생각보다\n복잡한 구조인 것 같군.\n@c0@"
  sl: "@a@b%a002000：这山路\n　　比想象的复杂呢。\n@c0@"
  tl: "@a@b%a002000：這山路\n　　比想像的複雜呢。\n@c0@"
231:
  en: "@a%0%a002010@bApart from the monsters, it's quite beautiful here.\n@c0@"
  ja: "@a@b%a002010「まものは　ともかく\n\tけしきは　いいところね。\n@c0@"
  ko: "@a@b%a002010: 마물은 그렇다 쳐도\n경치는 참 좋은 곳이네.\n@c0@"
  sl: "@a@b%a002010：抛开魔物不谈，\n　　这里的景色还真不错呢。\n@c0@"
  tl: "@a@b%a002010：拋開魔物不談，\n　　這裡的景色還真不錯呢。\n@c0@"
232:
  en: "@a%0%a002020@bBetter watch that we don't get lost in here.\n@c0@"
  ja: "@a@b%a002020「まいごに　ならないよう\n\t気をつけようね。\n@c0@"
  ko: "@a@b%a002020: 길을 잃지 않도록\n조심하자구.\n@c0@"
  sl: "@a@b%a002020：要小心\n　　别迷路了哦。\n@c0@"
  tl: "@a@b%a002020：要小心\n　　別迷路了哦。\n@c0@"
233:
  en: "@a%0%a002030@bEven if it's safe outside, there may well be hidden perils deep in the caves.\n@c0@"
  ja: "@a@b%a002030「外は　いいとして\n\t洞くつ内は　注意が\n\t必要ですね。\n@c0@"
  ko: "@a@b%a002030: 밖은 몰라도\n동굴 안은 주의가\n필요합니다.\n@c0@"
  sl: "@a@b%a002030：外面的话还好，\n　　但是在洞窟里面时\n　　一定要小心谨慎。\n@c0@"
  tl: "@a@b%a002030：外面的話還好，\n　　但是在洞窟裡面時\n　　一定要小心謹慎。\n@c0@"
234:
  en: "@a%0%a002050@bSo this here's the northern mountain, eh?\n@c0@"
  ja: "@a@b%a002050「へえ～。　北の山って\n\tこんな　ところだったのですね。\n@c0@"
  ko: "@a@b%a002050: 호오~ 북쪽 산은\n이런 곳이었군요.\n@c0@"
  sl: "@a@b%a002050：嘿～\n　　北边的山应该就是这里了吧。\n@c0@"
  tl: "@a@b%a002050：嘿～\n　　北邊的山應該就是這裡了吧。\n@c0@"
235:
  en: "@a%0%a002040@bThe monsters round here are a bunch of weeds. We're not even gonna break a sweat.\n@c0@"
  ja: "@a@b%a002040「このあたりの\n\tまものたちは　弱すぎて\n\tてんで　相手にならないな。\n@c0@"
  ko: "@a@b%a002040: 이 부근의\n마물들은 약해 빠져서\n애초에 상대가 안 되는군.\n@c0@"
  sl: "@a@b%a002040：这一带的魔物\n　　实在太弱，\n　　打败它们简直不费吹灰之力。\n@c0@"
  tl: "@a@b%a002040：這一帶的魔物\n　　實在太弱，\n　　打敗它們簡直不費吹灰之力。\n@c0@"
236:
  en: "@a%0%a002060@b(slobber) Up... Up we go... Grrr... (snarl)\n@c0@"
  ja: "@a@b%a002060「歩け……歩け……\n\tギルルル……。\n@c0@"
  ko: "@a@b%a002060: 걷자......걷자......\n캬르르르......\n@c0@"
  sl: "@a@b%a002060：前进……前进……\n　　咕噜噜噜……\n@c0@"
  tl: "@a@b%a002060：前進……前進……\n　　咕嚕嚕嚕……\n@c0@"
237:
  en: "@a%0%a002070@bBoing! Boi-oing!\n@c0@"
  ja: "@a@b%a002070「プル　プルルーッ！\n@c0@"
  ko: "@a@b%a002070: 뽀용 뽀요용!\n@c0@"
  sl: "@a@b%a002070：噗噜～噗噜噜！\n@c0@"
  tl: "@a@b%a002070：噗嚕～噗嚕嚕！\n@c0@"
238:
  en: "@a%0%a002000@bI reckon he gave up right on this spot, aye?\n@c0@"
  ja: "@a@b%a002000「この　おっさん\n\tもう　ここで\n\tあきらめたのかな。\n@c0@"
  ko: "@a@b%a002000: 이 아저씨는\n여기서 벌써\n포기한 건가?\n@c0@"
  sl: "@a@b%a002000：这个大叔\n　　到这里就放弃了啊。\n@c0@"
  tl: "@a@b%a002000：這個大叔\n　　到這裡就放棄了啊。\n@c0@"
239:
  en: "@a%0%a002010@bI don't know where he came from, but he did well to make it this far...\n@c0@"
  ja: "@a@b%a002010「どこから　来たのか\n\tわからないけど　この商人さん\n\tよく　ここまで　来られたわね。\n@c0@"
  ko: "@a@b%a002010: 어디서 온 건진\n모르겠지만 이 상인도\n용케 여기까지 왔구나.\n@c0@"
  sl: "@a@b%a002010：虽然不知道\n　　这个商人是从哪来的，\n　　不过居然也能来到这里呢。\n@c0@"
  tl: "@a@b%a002010：雖然不知道\n　　這個商人是從哪來的，\n　　不過居然也能來到這裡呢。\n@c0@"
240:
  en: "@a%0%a002020@bSheesh. I hope the monsters aren't too strong...\n@c0@"
  ja: "@a@b%a002020「えー？　そんなに\n\t強い　まものばっかりだったら\n\tいやだなー。\n@c0@"
  ko: "@a@b%a002020: 응? 그렇게\n강한 마물이 득실댄다면\n싫은걸~\n@c0@"
  sl: "@a@b%a002020：诶？\n　　尽是这种强大的魔物的话，\n　　真烦啊。\n@c0@"
  tl: "@a@b%a002020：誒？\n　　盡是這種強大的魔物的話，\n　　真煩啊。\n@c0@"
241:
  en: "@a%0%a002030@bSeems we have company in our search for the seeds.\n@c0@"
  ja: "@a@b%a002030「理性のタネを　さがす\n\tお仲間が　いましたね。\n@c0@"
  ko: "@a@b%a002030: 이성의 씨앗을 찾는\n동지가 있었군요.\n@c0@"
  sl: "@a@b%a002030：有了一同寻找\n　　理性种子的伙伴了呢。\n@c0@"
  tl: "@a@b%a002030：有了一同尋找\n　　理性種子的夥伴了呢。\n@c0@"
242:
  en: "@a%0%a002030@bI sincerely doubt that he will beat us, but let us make haste nonetheless!\n@c0@"
  ja: "@a@b%a002030「先を　こされることは\n\tなさそうですが　急ぎましょう。\n@c0@"
  ko: "@a@b%a002030: 우리보다 먼저 찾을 것\n같지는 않지만 그래도 서두릅시다.\n@c0@"
  sl: "@a@b%a002030：虽然我们应该不会被\n　　抢先一步，不过还是赶紧走吧。\n@c0@"
  tl: "@a@b%a002030：雖然我們應該不會被\n　　搶先一步，不過還是趕緊走吧。\n@c0@"
243:
  en: "@a%0%a002040@bStrong monsters? I'll be the judge of that.\n@c0@"
  ja: "@a@b%a002040「怪物？\n\tどうってこと　ないだろう。\n@c0@"
  ko: "@a@b%a002040: 괴물?\n그게 뭐 어쨌다고?\n@c0@"
  sl: "@a@b%a002040：怪物？\n　　小菜一碟啊。\n@c0@"
  tl: "@a@b%a002040：怪物？\n　　小菜一碟啊。\n@c0@"
244:
  en: "@a%0%a002060@b(snarl) %0%a002060... Very strong monster... (spit)\n@c0@"
  ja: "@a@b%a002060「ギルル……\n\t私…　カイブツ……？\n@c0@"
  ko: "@a@b%a002060: 캬르르......\n나...괴물......?\n@c0@"
  sl: "@a@b%a002060：咕噜噜……\n　　我……怪物？\n@c0@"
  tl: "@a@b%a002060：咕嚕嚕……\n　　我……怪物？\n@c0@"
245:
  en: "@a%0%a002070@bBoing! (jiggle)\n@c0@"
  ja: "@a@b%a002070「プッププルーッ！\n@c0@"
  ko: "@a@b%a002070: 뽀~뽀르르르!\n@c0@"
  sl: "@a@b%a002070：噗噜噗噜！\n@c0@"
  tl: "@a@b%a002070：噗嚕噗嚕！\n@c0@"
246:
  en: "@a%0%a002000@bCrikey. He's still here?\n@c0@"
  ja: "@a@b%a002000「この　おっさん\n\tまだ　ここに　いたのか……。\n@c0@"
  ko: "@a@b%a002000: 이 아저씨\n아직 여기 있었냐......\n@c0@"
  sl: "@a@b%a002000：这个大叔\n　　还在这里啊……\n@c0@"
  tl: "@a@b%a002000：這個大叔\n　　還在這裡啊……\n@c0@"
247:
  en: "@a%0%a002010@bIt seems he hasn't given up on his search just yet.\n@c0@"
  ja: "@a@b%a002010「まだ　理性のタネを\n\tあきらめて　いないのかしら？\n@c0@"
  ko: "@a@b%a002010: 아직 이성의 씨앗을\n포기하지 않은 걸까?\n@c0@"
  sl: "@a@b%a002010：还没有\n　　放弃理性种子吧？\n@c0@"
  tl: "@a@b%a002010：還沒有\n　　放棄理性種子吧？\n@c0@"
248:
  en: "@a%0%a002020@bBoy, he wasn't kidding! This place was packed with some seriously heinous beasties!\n@c0@"
  ja: "@a@b%a002020「ほんと！\n\tけっこう　強い　まものが\n\tたくさんいたよね。\n@c0@"
  ko: "@a@b%a002020: 맞아!\n꽤 강한 마물들이\n많이 있었어.\n@c0@"
  sl: "@a@b%a002020：真的呢！\n　　真的有很多\n　　强大的魔物啊！\n@c0@"
  tl: "@a@b%a002020：真的呢！\n　　真的有很多\n　　強大的魔物啊！\n@c0@"
249:
  en: "@a%0%a002030@bNo need to tell the man that we acquired the seeds first. It would not do to crow...\n@c0@"
  ja: "@a@b%a002030「先に　私たちが\n\t理性のタネを　手に入れたことは\n\tいわないほうが　いいですね……。\n@c0@"
  ko: "@a@b%a002030: 우리가 먼저\n이성의 씨앗을 손에 넣었다는 건\n말하지 않는 게 좋겠군요......\n@c0@"
  sl: "@a@b%a002030：我们还是别告诉他，\n　　我们已经先他一步\n　　拿到理性种子了这件事吧……\n@c0@"
  tl: "@a@b%a002030：我們還是別告訴他，\n　　我們已經先他一步\n　　拿到理性種子了這件事吧……\n@c0@"
250:
  en: "@a%0%a002040@bIs he ever gonna work up the nerve to get himself down off this mountain?\n@c0@"
  ja: "@a@b%a002040「この　おっさん\n\tこわくて　ここからも\n\t帰れないんじゃないか？\n@c0@"
  ko: "@a@b%a002040: 이 아저씨,\n무서워서 여기서도\n못 돌아가는 거 아냐?\n@c0@"
