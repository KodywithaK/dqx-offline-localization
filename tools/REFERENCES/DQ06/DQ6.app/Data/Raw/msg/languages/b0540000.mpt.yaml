305:
  en: "@a%0%a002020@bI heard it's good for plants if you talk to them, but what if they talk to you...?\n@c0@"
  ja: "@a@b%a002020「ちっちゃい　草なのに\n\tあいかわらず　たいどは\n\t大きいわね……。\n@c0@"
  ko: "@a@b%a002020: 작은 풀인데\n여전히 태도 하나는\n기고만장하네......\n@c0@"
  sl: "@a@b%a002020：小草虽小，\n　　脾气倒一点没变，\n　　还是那么盛气凌人呢。\n@c0@"
  tl: "@a@b%a002020：小草雖小，\n　　脾氣倒一點沒變，\n　　還是那麼盛氣淩人呢。\n@c0@"
306:
  en: "@a%0%a002030@bIt is very kind of this little plant to offer to help us.\n@c0@"
  ja: "@a@b%a002030「理性の草さんの\n\tいつでも　相談にのってくれるという\n\t気持ちは　うれしいですね。\n@c0@"
  ko: "@a@b%a002030: 언제든 고민 상담을\n해 주겠다는 이성의 풀의\n마음만큼은 참 고맙군요.\n@c0@"
  sl: "@a@b%a002030：理性之草\n　　愿意帮我们分担烦恼，\n　　这份心意我们还是很感激的。\n@c0@"
  tl: "@a@b%a002030：理性之草\n　　願意幫我們分擔煩惱，\n　　這份心意我們還是很感激的。\n@c0@"
307:
