0:
  en: "@a%0%a002000@bSo this is Scrimsley, aye? Nice place!\n@c0@"
  ja: "@a@b%a002000「よーし\n\tついた　ついた！\n\tここが　モンストルだな。\n@c0@"
  ko: "@a@b%a002000: 좋아,\n도착했다!\n여기가 몬스톨이로군.\n@c0@"
  sl: "@a@b%a002000：到了到了！\n　　这里就是蒙斯托尔啊！\n@c0@"
  tl: "@a@b%a002000：到了到了！\n　　這裡就是蒙斯托爾啊！\n@c0@"
1:
  en: "@a%0%a002010@bThis town has a lovely aura. And yet...\n@c0@"
  ja: "@a@b%a002010「町の　雰囲気は\n\t明るいわね。\n\tでも……\n@c0@"
  ko: "@a@b%a002010: 마을 분위기는\n밝은 것 같네.\n하지만......\n@c0@"
  sl: "@a@b%a002010：这个镇子的气氛\n　　真是欢乐祥和呢。\n　　不过……\n@c0@"
  tl: "@a@b%a002010：這個鎮子的氣氛\n　　真是歡樂祥和呢。\n　　不過……\n@c0@"
2:
  en: "@a%0%a002010@bSomething about it is not quite right...\n@c0@"
  ja: "@a@b%a002010「どこか　気になるのは\n\tなぜかしら……。\n@c0@"
  ko: "@a@b%a002010: 찜찜한 기분이 드는 건\n왜일까......\n@c0@"
  sl: "@a@b%a002010：为什么我总觉得\n　　有什么地方不对劲……\n@c0@"
  tl: "@a@b%a002010：為什麼我總覺得\n　　有什麼地方不對勁……\n@c0@"
3:
  en: "@a%0%a002020@bWhew, what a slog... I'm exhausted!\n@c0@"
  ja: "@a@b%a002020「はあーっ\n\t長旅　つづきで　ちょっと\n\tつかれちゃったなー。\n@c0@"
  ko: "@a@b%a002020: 휴우~\n오랫동안 여행하니까 좀\n피곤하네~\n@c0@"
  sl: "@a@b%a002020：呼……\n　　连日的奔波下来，\n　　还真是有点累了呢。\n@c0@"
  tl: "@a@b%a002020：呼……\n　　連日的奔波下來，\n　　還真是有點累了呢。\n@c0@"
4:
  en: "@a%0%a002030@bThis town seems spacious and pleasant. I like it.\n@c0@"
  ja: "@a@b%a002030「広びろとしていて\n\tとても　すみごこちが\n\tよさそうな　町ですね。\n@c0@"
  ko: "@a@b%a002030: 탁 트여 있어서\n아주 살기 좋을 것 같은\n마을이군요.\n@c0@"
  sl: "@a@b%a002030：这小镇\n　　视野开阔，\n　　住着也很舒适吧。\n@c0@"
  tl: "@a@b%a002030：這小鎮\n　　視野開闊，\n　　住著也很舒適吧。\n@c0@"
5:
  en: "@a%0%a002000@bThis is the part of travellin' I like — meetin' new folks, listenin' to their stories...\n@c0@"
  ja: "@a@b%a002000「こうやって　いろいろな\n\t人と　会話できるのが\n\t旅の　いいところだよな！\n@c0@"
  ko: "@a@b%a002000: 다양한 사람들과\n이렇게 이야기를 할 수 있는 게\n여행의 장점이지!\n@c0@"
  sl: "@a@b%a002000：能跟各种各样的人说话，\n　　这也是旅行的乐趣啊！\n@c0@"
  tl: "@a@b%a002000：能跟各種各樣的人說話，\n　　這也是旅行的樂趣啊！\n@c0@"
6:
  en: "@a%0%a002010@bA forest glade is a delightful spot for a town.\n@c0@"
  ja: "@a@b%a002010「森に　かこまれた\n\tすてきな　町ね。\n@c0@"
  ko: "@a@b%a002010: 숲으로 둘러싸인\n멋진 마을이야.\n@c0@"
  sl: "@a@b%a002010：小镇被绿树环绕着，\n　　真是太美了。\n@c0@"
  tl: "@a@b%a002010：小鎮被綠樹環繞著，\n　　真是太美了。\n@c0@"
7:
  en: "@a%0%a002010@bSo why do I feel uneasy?\n@c0@"
  ja: "@a@b%a002010「でも……\n\tどこか　気になるのは\n\tなぜかしら……。\n@c0@"
  ko: "@a@b%a002010: 하지만......\n찜찜한 기분이 드는 건\n왜일까......\n@c0@"
  sl: "@a@b%a002010：但是……\n　　为什么我总觉得\n　　有什么地方不对劲……\n@c0@"
  tl: "@a@b%a002010：但是……\n　　為什麼我總覺得\n　　有什麼地方不對勁……\n@c0@"
8:
  en: "@a%0%a002020@bHey, let's go hit the hay at the inn, okay?\n@c0@"
  ja: "@a@b%a002020「ねえねえ\n\t宿屋が　あったら\n\tひと休み　していこうよー。\n@c0@"
  ko: "@a@b%a002020: 저기, 있잖아.\n여관 있으면\n좀 쉬었다 가자~\n@c0@"
  sl: "@a@b%a002020：喂喂，\n　　要是找到旅店的话，\n　　先休息一下吧。\n@c0@"
  tl: "@a@b%a002020：喂喂，\n　　要是找到旅店的話，\n　　先休息一下吧。\n@c0@"
9:
  en: "@a%0%a002030@bHopefully we can pick up some helpful information here.\n@c0@"
  ja: "@a@b%a002030「私たちの　旅に\n\t役立つ　情報が\n\tなにか　あるといいですね。\n@c0@"
  ko: "@a@b%a002030: 우리의 여행에\n도움이 될 만한 정보가\n있었으면 좋겠군요.\n@c0@"
  sl: "@a@b%a002030：要是能收集到\n　　对我们的旅行有用的消息\n　　就好了呢。\n@c0@"
  tl: "@a@b%a002030：要是能收集到\n　　對我們的旅行有用的消息\n　　就好了呢。\n@c0@"
10:
  en: "@a%0%a002000@bHey, talkin' to folks is just fine %a000090, but let's get to an inn soon, aye?\n@c0@"
  ja: "@a@b%a002000「おいおい　%a000090。\n\t話しこむのも　いいけど\n\tそろそろ　宿に　向かおうぜ！\n@c0@"
  ko: "@a@b%a002000: 어이, %a000090.\n대화도 좋지만\n슬슬 여관으로 가자고!\n@c0@"
  sl: "@a@b%a002000：喂，%a000090。\n　　没说不让你跟人谈话，\n　　不过差不多该去旅店了吧！\n@c0@"
  tl: "@a@b%a002000：喂，%a000090。\n　　沒說不讓你跟人談話，\n　　不過差不多該去旅店了吧！\n@c0@"
11:
  en: "@a%0%a002010@bA forest glade is a delightful spot for a town.\n@c0@"
  ja: "@a@b%a002010「森に　かこまれた\n\tすてきな　町よね。\n@c0@"
  ko: "@a@b%a002010: 숲으로 둘러싸인\n멋진 마을이네.\n@c0@"
