  en: "@a%0%a002030@bHopefully we can pick up some helpful information here.\n@c0@"
  ja: "@a@b%a002030「私たちの　旅に\n\t役立つ　情報が\n\tなにか　あるといいですね。\n@c0@"
  ko: "@a@b%a002030: 우리의 여행에\n도움이 될 만한 정보가\n있었으면 좋겠군요.\n@c0@"
  sl: "@a@b%a002030：要是能收集到\n　　对我们的旅行有用的消息\n　　就好了呢。\n@c0@"
  tl: "@a@b%a002030：要是能收集到\n　　對我們的旅行有用的消息\n　　就好了呢。\n@c0@"
14:
  en: "@a%0%a002000@bNothin' wrong with a little tourism. The death of Murdaw is startin' to have positive effects all over.\n@c0@"
  ja: "@a@b%a002000「やっぱり　ムドーが\n\tいなくなった　いい　えいきょうが\n\tあちこちに　出ているんだな。\n@c0@"
  ko: "@a@b%a002000: 역시 무도가 없어지면서\n여기저기에 좋은 영향이\n미친 모양이군.\n@c0@"
  sl: "@a@b%a002000：看起来，\n　　姆多被打倒之后，\n　　到处都出现了正面效果。\n@c0@"
  tl: "@a@b%a002000：看起來，\n　　姆多被打倒之後，\n　　到處都出現了正面效果。\n@c0@"
15:
  en: "@a%0%a002010@bHe didn't seem very welcoming, did he, %a000090?\n@c0@"
  ja: "@a@b%a002010「ねえ　%a000090。\n\tいまの人　なんとなく\n\tよそよそしい　感じがしなかった？\n@c0@"
  ko: "@a@b%a002010: 저기, %a000090.\n방금 그 사람 왠지\n쌀쌀맞은 느낌이 들지 않았어?\n@c0@"
  sl: "@a@b%a002010：喂，%a000090。\n　　刚才那人，\n　　是不是有点冷淡啊？\n@c0@"
  tl: "@a@b%a002010：喂，%a000090。\n　　剛才那人，\n　　是不是有點冷淡啊？\n@c0@"
16:
  en: "@a%0%a002010@bIt sounds to me like he'd rather not have any visitors at all!\n@c0@"
  ja: "@a@b%a002010「私には\n\t旅人が　ふえて　めいわくだ\n\tみたいに　聞こえたんだけど……。\n@c0@"
  ko: "@a@b%a002010: 나한테는\n여행자가 늘어서 곤란하다는\n소리로 들렸는데......\n@c0@"
  sl: "@a@b%a002010：他是不是觉得\n　　旅客增多\n　　会给自己添麻烦呢……\n@c0@"
  tl: "@a@b%a002010：他是不是覺得\n　　旅客增多\n　　會給自己添麻煩呢……\n@c0@"
17:
  en: "@a%0%a002020@bI bet the inn and shops here would love more business, though...\n@c0@"
  ja: "@a@b%a002020「旅人が　ふえれば\n\tきっと　お店屋さんや\n\t宿屋さんは　大はんじょうね。\n@c0@"
  ko: "@a@b%a002020: 여행자가 늘면\n분명 상점이나 여관은\n장사가 아주 잘 되겠지?\n@c0@"
  sl: "@a@b%a002020：旅客增多的话，\n　　商贩啊旅店啊\n　　一定会生意兴隆吧。\n@c0@"
  tl: "@a@b%a002020：旅客增多的話，\n　　商販啊旅店啊\n　　一定會生意興隆吧。\n@c0@"
18:
  en: "@a%0%a002030@bWell, I would hardly describe us as ‘big city sorts’...\n@c0@"
  ja: "@a@b%a002030「ん？　もしかしたら\n\tこの方は　旅人が　来るのを\n\tかんげいしていない？\n@c0@"
  ko: "@a@b%a002030: 음? 혹시\n이분은 여행자가 오는 것을\n환영하지 않는 걸까요?\n@c0@"
  sl: "@a@b%a002030：嗯？\n　　难道这个人\n　　不欢迎旅客吗？\n@c0@"
  tl: "@a@b%a002030：嗯？\n　　難道這個人\n　　不歡迎旅客嗎？\n@c0@"
19:
  en: "@a%0%a002030@bStill, the man's distinct lack of enthusiasm for tourists is clear.\n@c0@"
  ja: "@a@b%a002030「いえ\n\t私の　考えすぎかも\n\tしれませんが……。\n@c0@"
  ko: "@a@b%a002030: 아니,\n제가 너무 앞서간 걸지도\n모르겠습니다만......\n@c0@"
  sl: "@a@b%a002030：不，\n　　可能是我想多了……\n@c0@"
  tl: "@a@b%a002030：不，\n　　可能是我想多了……\n@c0@"
20:
  en: "@a%0%a002000@b‘Hero of the hour’, aye? That's not a very long time to be a hero.\n@c0@"
  ja: "@a@b%a002000「勇者かあ。\n\t一度でいいから　そんなふうに\n\t呼ばれてみたいぜ。\n@c0@"
  ko: "@a@b%a002000: 용사라.\n단 한 번만이라도 그렇게\n불려 보고 싶군.\n@c0@"
  sl: "@a@b%a002000：勇者啊。\n　　真想被别人这么叫呢。\n　　就叫一次也好啊。\n@c0@"
  tl: "@a@b%a002000：勇者啊。\n　　真想被別人這麼叫呢。\n　　就叫一次也好啊。\n@c0@"
21:
  en: "@a%0%a002010@bIt sounds like this %a002050 person is the protector of the peace here.\n@c0@"
  ja: "@a@b%a002010「%a002050さんは\n\tこの町を　守っている\n\t勇者さんなのね。\n@c0@"
  ko: "@a@b%a002010: %a002050 씨는\n이 마을을 지키는\n용사인가 보구나.\n@c0@"
  sl: "@a@b%a002010：%a002050就是\n　　保护这个镇子的勇者吧。\n@c0@"
  tl: "@a@b%a002010：%a002050就是\n　　保護這個鎮子的勇者吧。\n@c0@"
22:
  en: "@a%0%a002020@bWow! That %a002050 guy must be a real musclehead!\n@c0@"
  ja: "@a@b%a002020「すごいね。\n\tきっと　%a002050って言う人\n\tメチャメチャ　強いんだろうね。\n@c0@"
  ko: "@a@b%a002020: 멋져.\n%a002050%F2050%X라%Y이라%Z는 사람은 틀림없이\n엄청나게 강할 거야.\n@c0@"
  sl: "@a@b%a002020：真厉害啊。\n　　那个叫%a002050的人，\n　　一定超级强吧。\n@c0@"
  tl: "@a@b%a002020：真厲害啊。\n　　那個叫%a002050的人，\n　　一定超級強吧。\n@c0@"
23:
  en: "@a%0%a002030@bSo this %a002050 is viewed as a hero in this town...\n@c0@"
  ja: "@a@b%a002030「%a002050さんと　言う方は\n\t勇敢な　方なんですね。\n@c0@"
  ko: "@a@b%a002030: %a002050 님이라는 분은\n용감한 분인가 보군요.\n@c0@"
  sl: "@a@b%a002030：那个叫做%a002050的先生，\n　　是一个勇敢的人呢。\n@c0@"
  tl: "@a@b%a002030：那個叫做%a002050的先生，\n　　是一個勇敢的人呢。\n@c0@"
24:
  en: "@a%0%a002000@bPfft! Why would the Goddess care if we were here or not?\n@c0@"
  ja: "@a@b%a002000「何が　天の声だよ。\n\tせっかく　来たのに\n\t冷たいじゃないか　なあ！\n@c0@"
  ko: "@a@b%a002000: 하늘의 목소리 좋아하시네.\n여기까지 온 여행자한테\n너무 쌀쌀맞은 거 아니냐고!\n@c0@"
  sl: "@a@b%a002000：啥叫上天的旨意啊。\n　　好不容易来这里，\n　　这也太冷淡了吧！\n@c0@"
  tl: "@a@b%a002000：啥叫上天的旨意啊。\n　　好不容易來這裡，\n　　這也太冷淡了吧！\n@c0@"
25:
  en: "@a%0%a002010@bAre we causing someone trouble by being here...?\n@c0@"
  ja: "@a@b%a002010「私たちが　いては\n\tなにか　困ることでも\n\tあるのかしらね……。\n@c0@"
  ko: "@a@b%a002010: 우리가 여기 있으면\n곤란한 일이라도\n생기는 걸까......\n@c0@"
  sl: "@a@b%a002010：是不是\n　　我们在这里的话，\n　　他会觉得困扰呢……\n@c0@"
  tl: "@a@b%a002010：是不是\n　　我們在這裡的話，\n　　他會覺得困擾呢……\n@c0@"
26:
  en: "@a%0%a002020@bWait, what? I thought priests were supposed to be warm and welcoming!\n@c0@"
  ja: "@a@b%a002020「え～　なに？\n\t立ちされ　ですって？\n\t失礼しちゃうじゃない！\n@c0@"
  ko: "@a@b%a002020: 응? 뭐라고?\n떠나라고?\n어쩜 그렇게 무례한 말을!\n@c0@"
  sl: "@a@b%a002020：诶～什么？\n　　让我们走？\n　　太失礼了吧！\n@c0@"
  tl: "@a@b%a002020：誒～什麼？\n　　讓我們走？\n　　太失禮了吧！\n@c0@"
