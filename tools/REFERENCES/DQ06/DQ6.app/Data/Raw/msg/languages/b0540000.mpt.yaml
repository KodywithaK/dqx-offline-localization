  sl: "@a@b%a002010：这个镇子\n　　每晚都会发生\n　　今天这样的事么？！\n@c0@"
  tl: "@a@b%a002010：這個鎮子\n　　每晚都會發生\n　　今天這樣的事麼？！\n@c0@"
126:
  en: "@a%0%a002020@bNow I know why this guy couldn't catch forty winks here.\n@c0@"
  ja: "@a@b%a002020「たしかに　これじゃ\n\tねむれるはず　ないけど……\n@c0@"
  ko: "@a@b%a002020: 확실히 이 정도면\n잠이 푹 들 리가 없지만......\n@c0@"
  sl: "@a@b%a002020：这样确实\n　　没办法睡着啊……\n@c0@"
  tl: "@a@b%a002020：這樣確實\n　　沒辦法睡著啊……\n@c0@"
127:
  en: "@a%0%a002020@bIt's a miracle he slept at all with all this shaking!\n@c0@"
