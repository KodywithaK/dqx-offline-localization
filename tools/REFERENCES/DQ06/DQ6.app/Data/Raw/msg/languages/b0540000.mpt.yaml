  tl: "@a@b%a002030：就照%a002050建議的，\n　　今天就在這個鎮上的旅店裡\n　　投宿吧。\n@c0@"
108:
  en: "@a%0%a002000@bWhat kinda inn turns down customers like that? This is gettin' awfully suspicious.\n@c0@"
  ja: "@a@b%a002000「お客を　泊めたがらない\n\t宿屋なんて　どうかしてるぜ。\n\tなんだか　あやしくないか？\n@c0@"
  ko: "@a@b%a002000: 손님을 받기 싫어하는\n여관이 있을 줄이야.\n왠지 수상하지 않아?\n@c0@"
  sl: "@a@b%a002000：不想接待客人，\n　　这旅店老板有病吧。\n　　这太可疑了。\n@c0@"
  tl: "@a@b%a002000：不想接待客人，\n　　這旅店老闆有病吧。\n　　這太可疑了。\n@c0@"
109:
  en: "@a%0%a002010@bThis innkeeper seems to be hiding something...\n@c0@"
  ja: "@a@b%a002010「この　ご主人……\n\t何か　かくしていることが\n\tあるような　気がしない？\n@c0@"
