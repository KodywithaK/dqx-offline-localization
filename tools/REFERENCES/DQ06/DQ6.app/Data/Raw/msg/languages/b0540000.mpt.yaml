  en: "@a%0%a002030@bThis priest has appealed to the Goddess in his plea for us to leave this town.\n@c0@"
  ja: "@a@b%a002030「どうも　私たちは\n\tあまり　かんげいされて\n\tいないようですね。\n@c0@"
