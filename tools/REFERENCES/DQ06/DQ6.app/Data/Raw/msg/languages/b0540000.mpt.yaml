  tl: "@a@b%a002020：晃成這樣\n　　都醒不過來的話，\n　　絕對是人有問題！！\n@c0@"
128:
  en: "@a%0%a002030@bIt is time to see the town's secret with our own eyes! To the roof!\n@c0@"
