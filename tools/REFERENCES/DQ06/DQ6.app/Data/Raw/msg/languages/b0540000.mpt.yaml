  tl: "@a@b%a002000：這傢伙在說啥啊！\n　　都到這地步了\n　　怎麼可能不擔心啊！\n@c0@"
120:
  en: "@a%0%a002010@bI don't think he's going to let us through. Let's find another way!\n@c0@"
