  ko: "@a@b%a002020: 이게 아무것도\n아니라니 말이 돼!?\n@c0@"
  sl: "@a@b%a002020：这哪里是\n　　什么都没发生啊！\n@c0@"
  tl: "@a@b%a002020：這哪裡是\n　　什麼都沒發生啊！\n@c0@"
122:
  en: "@a%0%a002020@bI don't know what an ‘owt’ is, but I'm itching to find out!\n@c0@"
