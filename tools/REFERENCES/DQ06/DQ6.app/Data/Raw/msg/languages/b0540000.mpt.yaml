  sl: "@a@b%a002000：这家伙\n　　在担心自己的主人呢。\n　　真是条了不起的狗！\n@c0@"
  tl: "@a@b%a002000：這傢伙\n　　在擔心自己的主人呢。\n　　真是條了不起的狗！\n@c0@"
99:
  en: "@a%0%a002010@bI'm sure the pup will cheer up as soon as %a002050 gets better!\n@c0@"
  ja: "@a@b%a002010「大丈夫よ　ワンちゃん！\n\t%a002050さんは　きっと\n\t元気に　なるからね！\n@c0@"
  ko: "@a@b%a002010: 괜찮아, 멍멍아!\n%a002050 씨는 틀림없이\n건강해질 거야!\n@c0@"
  sl: "@a@b%a002010：小狗狗，没事的。\n　　%a002050一定会康复的！\n@c0@"
  tl: "@a@b%a002010：小狗狗，沒事的。\n　　%a002050一定會康復的！\n@c0@"
100:
  en: "@a%0%a002020@bAww, what a good dog, keeping guard for %a002050 all this time!\n@c0@"
  ja: "@a@b%a002020「えらいねー。\n\tここで　ずっと　%a002050さんのこと\n\tまもってたんだね！\n@c0@"
