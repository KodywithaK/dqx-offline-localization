  tl: "@a@b%a002010：他真的打算\n　　一個人解決戰鬥麼？！\n@c0@"
134:
  en: "@a%0%a002020@bWhat's he talking about!? We're trying to help him here!\n@c0@"
  ja: "@a@b%a002020「なにが　引っこんでろよ！\n\t協力して　あげようと思ったのに！\n@c0@"
  ko: "@a@b%a002020: 물러나 있으라니!\n도와주려고 했는데!\n@c0@"
  sl: "@a@b%a002020：什么叫滚一边去啊！\n　　我们好心好意来帮你的！\n@c0@"
  tl: "@a@b%a002020：什麼叫滾一邊去啊！\n　　我們好心好意來幫你的！\n@c0@"
135:
  en: "@a%0%a002030@bThis %a002040 brims with self-assurance...\n@c0@"
  ja: "@a@b%a002030「すごい　自信ですね……。\n@c0@"
