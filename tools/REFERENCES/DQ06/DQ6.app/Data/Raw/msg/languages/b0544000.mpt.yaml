0:
  en: "@a%0%a002000@bAye. Onward!\n@c0@"
  ja: "@a@b%a002000「さて　どんどん\n\t進むと　しようぜ。\n@c0@"
  ko: "@a@b%a002000: 어서 안쪽으로\n쭉 들어가자구.\n@c0@"
  sl: "@a@b%a002000：一鼓作气前进吧。\n@c0@"
  tl: "@a@b%a002000：一鼓作氣前進吧。\n@c0@"
1:
  en: "@a%0%a002010@bLet's go down those stairs.\n@c0@"
  ja: "@a@b%a002010「あの　階段を　おりましょ。\n@c0@"
  ko: "@a@b%a002010: 저 계단을 내려가자.\n@c0@"
  sl: "@a@b%a002010：从那个楼梯下去吧。\n@c0@"
  tl: "@a@b%a002010：從那個樓梯下去吧。\n@c0@"
2:
  en: "@a%0%a002020@b(shiver) Chilly in here, huh?\n@c0@"
  ja: "@a@b%a002020「この中は\n\tひんやり　してるね。\n@c0@"
  ko: "@a@b%a002020: 동굴 안은\n서늘하구나.\n@c0@"
  sl: "@a@b%a002020：这里面真冷啊。\n@c0@"
  tl: "@a@b%a002020：這裡面真冷啊。\n@c0@"
3:
  en: "@a%0%a002030@bHmm...\n@c0@"
  ja: "@a@b%a002030「ふーむ……。\n@c0@"
  ko: "@a@b%a002030: 흐음......\n@c0@"
  sl: "@a@b%a002030：唔……\n@c0@"
  tl: "@a@b%a002030：唔……\n@c0@"
4:
  en: "@a%0%a002050@bIt's bloomin' damp in here!\n@c0@"
  ja: "@a@b%a002050「いやー\n\tじめじめ　してますねー。\n@c0@"
  ko: "@a@b%a002050: 이야~\n축축하군요.\n@c0@"
  sl: "@a@b%a002050：哎呀，\n　　湿气真重啊。\n@c0@"
  tl: "@a@b%a002050：哎呀，\n　　濕氣真重啊。\n@c0@"
5:
  en: "@a%0%a002000@bWhat, no monsters?\n@c0@"
  ja: "@a@b%a002000「この　フロアには\n\tとくに　まものの　気配は\n\tないみたいだな。\n@c0@"
  ko: "@a@b%a002000: 이 층에는\n마물의 기운이 특별히\n느껴지지 않는군.\n@c0@"
  sl: "@a@b%a002000：这一层倒是\n　　没有什么魔物的气息啊。\n@c0@"
  tl: "@a@b%a002000：這一層倒是\n　　沒有什麼魔物的氣息啊。\n@c0@"
6:
  en: "@a%0%a002010@bThis cave is so large, it's easy to forget that you're underground.\n@c0@"
  ja: "@a@b%a002010「このくらい　広ければ\n\t洞くつの中でも\n\tきゅうくつな　感じはしないわね。\n@c0@"
  ko: "@a@b%a002010: 이 정도로 넓으면\n동굴 안에 있어도\n갑갑하다는 느낌이 안 드는구나.\n@c0@"
  sl: "@a@b%a002010：这里这么宽敞，\n　　即使是在洞中\n　　也不觉得狭窄呢。\n@c0@"
  tl: "@a@b%a002010：這裡這麼寬敞，\n　　即使是在洞中\n　　也不覺得狹窄呢。\n@c0@"
7:
  en: "@a%0%a002020@bSure is dim in here. Thank the Goddess for those torches.\n@c0@"
  ja: "@a@b%a002020「うすぐらいけど\n\t壁に　灯りがともっていて\n\tまあまあ　歩きやすいわね。\n@c0@"
  ko: "@a@b%a002020: 어둡긴 하지만\n벽에 등불이 켜져 있어서\n걸을 만은 하네.\n@c0@"
  sl: "@a@b%a002020：虽然光线很暗，\n　　不过有灯总比黑着强多了，\n　　至少能正常行走。\n@c0@"
  tl: "@a@b%a002020：雖然光線很暗，\n　　不過有燈總比黑著強多了，\n　　至少能正常行走。\n@c0@"
8:
  en: "@a%0%a002030@bThis seems like a good place for rest and respite.\n@c0@"
  ja: "@a@b%a002030「なんとなく\n\t休けい所　みたいな\n\tふんいきの　ところですね。\n@c0@"
  ko: "@a@b%a002030: 왠지\n휴게소 같은\n분위기로군요.\n@c0@"
  sl: "@a@b%a002030：看起来是个\n　　可以小憩一下的地方呢。\n@c0@"
  tl: "@a@b%a002030：看起來是個\n　　可以小憩一下的地方呢。\n@c0@"
9:
  en: "@a%0%a002050@bWhoops! I almost slipped and landed on my behind! It's still a little tender from that monster bite...\n@c0@"
  ja: "@a@b%a002050「床が　すべりそうですから\n\tみなさん　足もとに　\n\t気をつけてくださいね。\n@c0@"
  ko: "@a@b%a002050: 바닥이 미끄러우니\n여러분 발밑을\n조심하세요.\n@c0@"
  sl: "@a@b%a002050：地板看上去很滑，\n　　大家要小心脚下。\n@c0@"
  tl: "@a@b%a002050：地板看上去很滑，\n　　大家要小心腳下。\n@c0@"
10:
  en: "@a%0%a002000@bThis must be the main trade route for merchants from the north and south, aye?\n@c0@"
  ja: "@a@b%a002000「この　洞くつを　使って\n\t商人たちも　北と　南を\n\t行き来しているんだな。\n@c0@"
  ko: "@a@b%a002000: 이 동굴을 통해\n상인들이 남북을\n오가고 있나 보군.\n@c0@"
  sl: "@a@b%a002000：商人们就是\n　　利用这个洞窟\n　　走南闯北的吧。\n@c0@"
  tl: "@a@b%a002000：商人們就是\n　　利用這個洞窟\n　　走南闖北的吧。\n@c0@"
11:
  en: "@a%0%a002010@bA lot of people must have been inconvenienced by the pass being blocked...\n@c0@"
  ja: "@a@b%a002010「通れなくなって\n\tみんなが　こまっているのね。\n@c0@"
  ko: "@a@b%a002010: 지나갈 수 없게 되어서\n다들 불편하겠는걸.\n@c0@"
  sl: "@a@b%a002010：这条路走不通的话，\n　　大家都很伤脑筋吧。\n@c0@"
  tl: "@a@b%a002010：這條路走不通的話，\n　　大家都很傷腦筋吧。\n@c0@"
12:
  en: "@a%0%a002020@bOh, right! Didn't someone in the castle say something about an earthquake that happened here?\n@c0@"
  ja: "@a@b%a002020「そういえば　お城で\n\t洞くつで　じしんが　あったとか\n\tだれか　言ってなかったっけ。\n@c0@"
  ko: "@a@b%a002020: 그러고 보니 성에서\n동굴에 지진이 났었다는 말을\n누가 하지 않았던가?\n@c0@"
  sl: "@a@b%a002020：话说回来，\n　　城里好像有人说过\n　　洞窟里发生了地震吧。\n@c0@"
  tl: "@a@b%a002020：話說回來，\n　　城裡好像有人說過\n　　洞窟裡發生了地震吧。\n@c0@"
13:
  en: "@a%0%a002030@bLet's get this problem sorted out on the double.\n@c0@"
  ja: "@a@b%a002030「早く　問題を\n\tかいけつしなければ\n\tなりませんね。\n@c0@"
  ko: "@a@b%a002030: 어서 문제를\n해결해야\n하겠군요.\n@c0@"
  sl: "@a@b%a002030：必须尽早解决问题。\n@c0@"
  tl: "@a@b%a002030：必須儘早解決問題。\n@c0@"
14:
  en: "@a%0%a002050@bHe's got a face like a rainy day in Scrimsley.\n@c0@"
  ja: "@a@b%a002050「この人　本当に\n\tこまった顔を　してますね。\n@c0@"
  ko: "@a@b%a002050: 이 사람, 진짜\n곤란한 표정을 짓고 있네요.\n@c0@"
  sl: "@a@b%a002050：这个人看起来\n　　的确很困扰呢。\n@c0@"
  tl: "@a@b%a002050：這個人看起來\n　　的確很困擾呢。\n@c0@"
15:
  en: "@a%0%a002000@bLeave? Hardy har! Monsters're why we're here!\n@c0@"
  ja: "@a@b%a002000「オレたちは\n\tその　まものどもを　倒しに\n\t来たってワケさ！\n@c0@"
  ko: "@a@b%a002000: 우리는\n그 마물을 쓰러뜨리러\n왔다고!\n@c0@"
  sl: "@a@b%a002000：咱就是来\n　　打倒那个魔物的！\n@c0@"
  tl: "@a@b%a002000：咱就是來\n　　打倒那個魔物的！\n@c0@"
16:
  en: "@a%0%a002010@bUnfortunately, we've got a date with those monsters...\n@c0@"
  ja: "@a@b%a002010「奥の　まものさんに\n\tようじが　あるのよね。\n@c0@"
  ko: "@a@b%a002010: 안에 있는 마물에게\n용무가 있어서 온 거야.\n@c0@"
  sl: "@a@b%a002010：我们是来找\n　　里面那个魔物的。\n@c0@"
  tl: "@a@b%a002010：我們是來找\n　　裡面那個魔物的。\n@c0@"
17:
  en: "@a%0%a002020@bMonsters? Good! Let's go get 'em!\n@c0@"
  ja: "@a@b%a002020「あたしたち\n\tまものなんか　へっちゃらよ！\n@c0@"
  ko: "@a@b%a002020: 우린\n마물 따위 하나도 안 무서워!\n@c0@"
  sl: "@a@b%a002020：魔物对于\n　　我们来说小菜一碟嘛。\n@c0@"
  tl: "@a@b%a002020：魔物對於\n　　我們來說小菜一碟嘛。\n@c0@"
18:
  en: "@a%0%a002030@bWe've got a job to do — clearing this cave of monsters!\n@c0@"
  ja: "@a@b%a002030「北に向かうのではなく\n\tまもの退治が　目的ですからね！\n@c0@"
  ko: "@a@b%a002030: 우리의 목적은 북쪽으로\n가는 게 아니라 마물 퇴치랍니다!\n@c0@"
  sl: "@a@b%a002030：我们不是要去北方，\n　　而是来打倒魔物的！\n@c0@"
  tl: "@a@b%a002030：我們不是要去北方，\n　　而是來打倒魔物的！\n@c0@"
19:
  en: "@a%0%a002050@bLet's get every one of those miserable monsters!\n@c0@"
  ja: "@a@b%a002050「きれいさっぱり\n\t退治しちゃいましょう！\n@c0@"
  ko: "@a@b%a002050: 깔끔하게\n퇴치해 버리자구요!\n@c0@"
  sl: "@a@b%a002050：三下五除二干掉它吧！\n@c0@"
  tl: "@a@b%a002050：三下五除二幹掉它吧！\n@c0@"
20:
  en: "@a%0%a002000@bSo the King sent us here to help these guys get to work, aye?\n@c0@"
  ja: "@a@b%a002000「その　王さまから\n\tオレたちも　たのまれて来た\n\tってワケだよな。\n@c0@"
  ko: "@a@b%a002000: 우리 역시\n그 왕에게 부탁을 받아서\n왔지.\n@c0@"
  sl: "@a@b%a002000：那个国王陛下\n　　还拜托了咱来\n　　讨伐魔物呢。\n@c0@"
  tl: "@a@b%a002000：那個國王陛下\n　　還拜託了咱來\n　　討伐魔物呢。\n@c0@"
21:
  en: "@a%0%a002010@bIt's been a while since the work halted, hasn't it?\n@c0@"
  ja: "@a@b%a002010「工事が　中断して\n\tもう　だいぶ　たつんじゃない？\n@c0@"
  ko: "@a@b%a002010: 공사가 중단된 지\n꽤 오래된 거 아닌가?\n@c0@"
  sl: "@a@b%a002010：施工已经\n　　停止很长一段时间了吧？\n@c0@"
  tl: "@a@b%a002010：施工已經\n　　停止很長一段時間了吧？\n@c0@"
22:
  en: "@a%0%a002020@bYou know, that guy looks plenty beefy to me...\n@c0@"
  ja: "@a@b%a002020「見たところ　けっこう\n\t強そうな　おじさんだけど……\n@c0@"
  ko: "@a@b%a002020: 보아하니 꽤\n강해 보이는 아저씨지만......\n@c0@"
  sl: "@a@b%a002020：这大叔看上去\n　　明明挺厉害的……\n@c0@"
  tl: "@a@b%a002020：這大叔看上去\n　　明明挺厲害的……\n@c0@"
23:
  en: "@a%0%a002020@bBut I guess construction work is a far cry from fighting monsters.\n@c0@"
  ja: "@a@b%a002020「ふつうの人たちに\n\t手におえるような　レベルの\n\tまものじゃないしね。\n@c0@"
  ko: "@a@b%a002020: 보통 사람이\n감당할 수 있는 수준의\n마물이 아니지.\n@c0@"
  sl: "@a@b%a002020：看来那魔物\n　　不是一般人\n　　能够对付得了的呢。\n@c0@"
  tl: "@a@b%a002020：看來那魔物\n　　不是一般人\n　　能夠對付得了的呢。\n@c0@"
24:
  en: "@a%0%a002030@bIt won't be long now. We will take care of those monsters.\n@c0@"
  ja: "@a@b%a002030「私たちが　倒すまで\n\tもう　少しだけ\n\t待ってもらいましょう。\n@c0@"
  ko: "@a@b%a002030: 저희가 쓰러뜨릴 때까지\n조금만 더\n기다려 주셔야겠군요.\n@c0@"
  sl: "@a@b%a002030：请再等等，\n　　让我们去打倒魔物。\n@c0@"
  tl: "@a@b%a002030：請再等等，\n　　讓我們去打倒魔物。\n@c0@"
25:
  en: "@a%0%a002050@bWell, monsters do have a habit of bein' scary.\n@c0@"
  ja: "@a@b%a002050「そりゃあ　まものは\n\tおっかないですよね！\n@c0@"
  ko: "@a@b%a002050: 그럼요. 마물은\n무섭고말고요!\n@c0@"
  sl: "@a@b%a002050：当然了，\n　　魔物很可怕呢！\n@c0@"
  tl: "@a@b%a002050：當然了，\n　　魔物很可怕呢！\n@c0@"
26:
  en: "@a%0%a002000@bWe're riskin' our lives, and all he cares about is hittin' the sauce. That's gratitude, aye?\n@c0@"
  ja: "@a@b%a002000「待ってな　おっさん。\n\tすぐに　おいしい酒を\n\t飲ましてやるからな！\n@c0@"
  ko: "@a@b%a002000: 기다리고 있어 봐, 아저씨.\n맛있는 술을 금방\n맛보게 해 줄 테니까!\n@c0@"
  sl: "@a@b%a002000：等着吧大叔。\n　　马上就让你喝上\n　　最棒的酒！\n@c0@"
  tl: "@a@b%a002000：等著吧大叔。\n　　馬上就讓你喝上\n　　最棒的酒！\n@c0@"
27:
  en: "@a%0%a002010@bThey'll be back to work before they know it!\n@c0@"
  ja: "@a@b%a002010「もうすぐ　仕事が\n\tできるように　なるわよね。\n@c0@"
  ko: "@a@b%a002010: 금방 일을 다시\n할 수 있게 될 거야.\n@c0@"
  sl: "@a@b%a002010：马上就能\n　　开展工作了吧。\n@c0@"
  tl: "@a@b%a002010：馬上就能\n　　開展工作了吧。\n@c0@"
28:
  en: "@a%0%a002020@bIf drinking were a vocation, that guy would be the best in the business.\n@c0@"
  ja: "@a@b%a002020「仕事したいのか\n\t飲みたいのが　先なのか\n\tわからないよね……。\n@c0@"
  ko: "@a@b%a002020: 일을 하고 싶은 건지\n술을 마시고 싶은 게 우선인지\n잘 모르겠네......\n@c0@"
  sl: "@a@b%a002020：到底是想工作，\n　　还是想先喝酒，\n　　我已经弄不明白了……\n@c0@"
  tl: "@a@b%a002020：到底是想工作，\n　　還是想先喝酒，\n　　我已經弄不明白了……\n@c0@"
29:
  en: "@a%0%a002030@bI wonder when they last did an honest day's work.\n@c0@"
  ja: "@a@b%a002030「だいぶ　長いこと\n\tここで　待っている　ようですね。\n@c0@"
  ko: "@a@b%a002030: 제법 오랫동안\n여기서 대기한 모양인데요.\n@c0@"
  sl: "@a@b%a002030：好像在这里\n　　等了很久了呢。\n@c0@"
  tl: "@a@b%a002030：好像在這裡\n　　等了很久了呢。\n@c0@"
30:
  en: "@a%0%a002050@bDoin' absolutely nothin' is thirsty work!\n@c0@"
  ja: "@a@b%a002050「何も　しなくても\n\tのどは　かわきますからね。\n@c0@"
  ko: "@a@b%a002050: 아무것도 하지 않아도\n목은 마른 법이죠.\n@c0@"
  sl: "@a@b%a002050：即使什么都不做，\n　　嗓子也是会渴的。\n@c0@"
  tl: "@a@b%a002050：即使什麼都不做，\n　　嗓子也是會渴的。\n@c0@"
31:
  en: "@a%0%a002000@bAye — that's the hole we're huntin' for.\n@c0@"
  ja: "@a@b%a002000「目的の　まものは\n\tその奥に　いるんだな。\n@c0@"
  ko: "@a@b%a002000: 우리의 목표인 마물은\n그 안쪽에 있는 모양이군.\n@c0@"
  sl: "@a@b%a002000：咱要打的那个魔物，\n　　就在这深处吧。\n@c0@"
  tl: "@a@b%a002000：咱要打的那個魔物，\n　　就在這深處吧。\n@c0@"
32:
  en: "@a%0%a002010@bThat's our destination. Shall we get moving?\n@c0@"
  ja: "@a@b%a002010「そこが　目的地ね。\n\tさあ　いよいよだわ！\n@c0@"
  ko: "@a@b%a002010: 거기가 목적지구나.\n이제 얼마 안 남았어!\n@c0@"
  sl: "@a@b%a002010：那里就是目的地吧。\n　　终于要到了！\n@c0@"
  tl: "@a@b%a002010：那裡就是目的地吧。\n　　終於要到了！\n@c0@"
33:
  en: "@a%0%a002020@bC'mon! Let's go check out this hole!\n@c0@"
  ja: "@a@b%a002020「早く　見てみようよ\n\tその　大きな穴！\n@c0@"
  ko: "@a@b%a002020: 어서 가 보자,\n그 커다란 구멍으로!\n@c0@"
  sl: "@a@b%a002020：快点去看看吧，\n　　那个大洞！\n@c0@"
  tl: "@a@b%a002020：快點去看看吧，\n　　那個大洞！\n@c0@"
34:
  en: "@a%0%a002030@bLet us proceed...with caution.\n@c0@"
  ja: "@a@b%a002030「さて……\n\t気を引きしめて　行きますか。\n@c0@"
  ko: "@a@b%a002030: 그럼......\n마음 단단히 먹고 가 볼까요?\n@c0@"
  sl: "@a@b%a002030：那么……\n　　大家谨慎行事。\n@c0@"
  tl: "@a@b%a002030：那麼……\n　　大家謹慎行事。\n@c0@"
35:
  en: "@a%0%a002050@bLet's go in and see exactly what's goin' on!\n@c0@"
  ja: "@a@b%a002050「さっそく　奥に　行って\n\tたしかめて　みましょう！\n@c0@"
  ko: "@a@b%a002050: 어서 안으로 들어가서\n확인해 보자구요!\n@c0@"
