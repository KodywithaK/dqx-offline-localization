  tl: "@a@b%a002050：穿過這裡的話，\n　　就能到達北邊吧。\n@c0@"
170:
  en: "@a%0%a002050@bOnce it reopens, let's give it a try, %a000090!\n@c0@"
  ja: "@a@b%a002050「開通したら\n\t行ってみましょうか。\n\tね　%a000090さん。\n@c0@"
  ko: "@a@b%a002050: 개통되면\n가 볼까요?\n%a000090 님.\n@c0@"
  sl: "@a@b%a002050：等开通之后，\n　　我们从这里走吧。\n　　%a000090。\n@c0@"
  tl: "@a@b%a002050：等開通之後，\n　　我們從這裡走吧。\n　　%a000090。\n@c0@"
171:
  en: "@a%0%a002000@bAvast! Hope he ain't lifting with his back!\n@c0@"
  ja: "@a@b%a002000「せいぜい\n\tがんばって　くれよな！\n@c0@"
  ko: "@a@b%a002000: 최선을\n다해 달라고!\n@c0@"
  sl: "@a@b%a002000：好好加油吧！\n@c0@"
  tl: "@a@b%a002000：好好加油吧！\n@c0@"
172:
  en: "@a%0%a002010@bSo... Shall we head back?\n@c0@"
  ja: "@a@b%a002010「さて……\n\tお城に　もどりましょうか。\n@c0@"
  ko: "@a@b%a002010: 그럼......\n성으로 돌아갈까?\n@c0@"
  sl: "@a@b%a002010：那么……\n　　回城里去吧。\n@c0@"
  tl: "@a@b%a002010：那麼……\n　　回城裡去吧。\n@c0@"
173:
  en: "@a%0%a002020@bThat's a dirty job, moving rocks all day...\n@c0@"
  ja: "@a@b%a002020「この　岩を\n\tどけるの　大変そうね。\n@c0@"
  ko: "@a@b%a002020: 이 바위\n치우는 거 힘들겠어.\n@c0@"
  sl: "@a@b%a002020：搬这块石头\n　　很辛苦吧。\n@c0@"
  tl: "@a@b%a002020：搬這塊石頭\n　　很辛苦吧。\n@c0@"
174:
  en: "@a%0%a002030@bWe won't be passing through here any time soon.\n@c0@"
  ja: "@a@b%a002030「すぐには\n\t開通しそうに　ないですね。\n@c0@"
  ko: "@a@b%a002030: 금방\n개통될 것 같지는 않군요.\n@c0@"
  sl: "@a@b%a002030：好像短时间内\n　　无法开通呢。\n@c0@"
  tl: "@a@b%a002030：好像短時間內\n　　無法開通呢。\n@c0@"
175:
  en: "@a%0%a002050@bThat lad needs to watch himself! He should be bendin' at the knees!\n@c0@"
  ja: "@a@b%a002050「ヘタに　重いものを\n\t動かそうとすると\n\tギックリごしに　なりますよ！\n@c0@"
  ko: "@a@b%a002050: 무거운 걸 어설프게\n들려고 하다가는\n허리 나갑니다!\n@c0@"
  sl: "@a@b%a002050：要是\n　　搬重物的方式不对的话，\n　　会伤到腰的！\n@c0@"
  tl: "@a@b%a002050：要是\n　　搬重物的方式不對的話，\n　　會傷到腰的！\n@c0@"
176:
  en: "@a%0%a002000@bHe musta picked the rock-liftin' vocation. Does that even exist?\n@c0@"
  ja: "@a@b%a002000「ホントかよ！\n\t岩を　どかす仕事　せんもん？\n\tそんな仕事も　あるんだな。\n@c0@"
  ko: "@a@b%a002000: 진짠가!?\n바위 치우는 게 전문인\n직업도 있나 보군.\n@c0@"
  sl: "@a@b%a002000：真的假的！\n　　专门搬石头？\n　　还有这种工作啊。\n@c0@"
  tl: "@a@b%a002000：真的假的！\n　　專門搬石頭？\n　　還有這種工作啊。\n@c0@"
177:
  en: "@a%0%a002010@bI thought he'd be a bit more enthusiastic to get started again...\n@c0@"
  ja: "@a@b%a002010「仕事が　おくれて\n\tジリジリ　していたぶん\n\t気合が　入るんじゃない？\n@c0@"
  ko: "@a@b%a002010: 일이 늦어져서\n초조해했던 만큼\n더 힘을 쏟을 수 있지 않을까?\n@c0@"
  sl: "@a@b%a002010：因为工作延后了，\n　　一直有劲没处使，\n　　所以干劲十足吧？\n@c0@"
  tl: "@a@b%a002010：因為工作延後了，\n　　一直有勁沒處使，\n　　所以幹勁十足吧？\n@c0@"
178:
  en: "@a%0%a002020@bHe's been at this for thirty years?\n@c0@"
  ja: "@a@b%a002020「３０年も\n\tこの仕事　やってるの？\n@c0@"
  ko: "@a@b%a002020: 이 일을\n30년이나 했단 말야?\n@c0@"
  sl: "@a@b%a002020：这工作\n　　干了３０年？\n@c0@"
  tl: "@a@b%a002020：這工作\n　　幹了３０年？\n@c0@"
179:
  en: "@a%0%a002030@bWell, at least they can get back to work now.\n@c0@"
  ja: "@a@b%a002030「まあ　とにかく\n\t工事が　再開できて\n\tよかったですね。\n@c0@"
  ko: "@a@b%a002030: 어쨌든\n공사를 다시 시작하게 되어서\n다행이군요.\n@c0@"
  sl: "@a@b%a002030：哎，总之\n　　施工能继续进行，\n　　真是太好了。\n@c0@"
  tl: "@a@b%a002030：哎，總之\n　　施工能繼續進行，\n　　真是太好了。\n@c0@"
180:
  en: "@a%0%a002050@bThese lads don't seem as laid-back now they have an honest day's work to do.\n@c0@"
  ja: "@a@b%a002050「この人たち\n\t向こうで　ゴロゴロしていたときと\n\tふんいき　ちがいますねえ。\n@c0@"
  ko: "@a@b%a002050: 이 사람들\n저쪽에서 빈둥거리고 있을 때와는\n분위기가 다르군요.\n@c0@"
  sl: "@a@b%a002050：这些人完全\n　　不像是之前在一旁\n　　无所事事的样子了嘛。\n@c0@"
  tl: "@a@b%a002050：這些人完全\n　　不像是之前在一旁\n　　無所事事的樣子了嘛。\n@c0@"
181:
  en: "@a%0%a002000@bHis sales'll stink until that construction wraps up.\n@c0@"
  ja: "@a@b%a002000「まだ　工事に　しばらく\n\tかかりそうだけどな。\n@c0@"
  ko: "@a@b%a002000: 공사를 마치려면\n아직 좀 더 있어야 할 텐데.\n@c0@"
  sl: "@a@b%a002000：看来施工还得\n　　费点时间呢。\n@c0@"
  tl: "@a@b%a002000：看來施工還得\n　　費點時間呢。\n@c0@"
182:
  en: "@a%0%a002010@bI'm sure he'll be happy to finally hit the road again.\n@c0@"
  ja: "@a@b%a002010「旅の商人さんは\n\tこれで　やっと　商売に\n\t行けるわけだわね。\n@c0@"
  ko: "@a@b%a002010: 떠돌이 상인은\n이제 장사를 하러\n떠날 수 있게 되었네.\n@c0@"
  sl: "@a@b%a002010：旅行商人\n　　这下子终于能\n　　去做生意了呢。\n@c0@"
  tl: "@a@b%a002010：旅行商人\n　　這下子終於能\n　　去做生意了呢。\n@c0@"
183:
  en: "@a%0%a002020@bHold on, so that merchant just sat here the whole time...?\n@c0@"
  ja: "@a@b%a002020「この人　結局\n\tずっと　ここで\n\t待っていたのね……。\n@c0@"
  ko: "@a@b%a002020: 이 사람, 결국\n여기서 쭉\n기다리고 있었구나......\n@c0@"
  sl: "@a@b%a002020：这个人结果\n　　一直在这里\n　　等着呢……\n@c0@"
  tl: "@a@b%a002020：這個人結果\n　　一直在這裡\n　　等著呢……\n@c0@"
184:
  en: "@a%0%a002030@bOnce the pass reopens, many people will be travelling this way.\n@c0@"
  ja: "@a@b%a002030「もう少し　たてば\n\tたくさんの人が　ここを通るように\n\tなるのでしょうね。\n@c0@"
  ko: "@a@b%a002030: 조금만 있으면\n많은 사람들이 이곳을\n지나가게 되겠군요.\n@c0@"
  sl: "@a@b%a002030：再过不久，\n　　就会有很多人\n　　从这里通过吧。\n@c0@"
  tl: "@a@b%a002030：再過不久，\n　　就會有很多人\n　　從這裡通過吧。\n@c0@"
185:
  en: "@a%0%a002050@bOld %a002050 is lookin' forward to givin' this pass a go once it's ready!\n@c0@"
  ja: "@a@b%a002050「工事が　完成したら\n\t私も　向こうがわに\n\t行ってみたいです。\n@c0@"
  ko: "@a@b%a002050: 공사가 끝나면\n저도 저쪽으로\n가 보고 싶습니다.\n@c0@"
  sl: "@a@b%a002050：等施工完成后，\n　　我也想去对面\n　　看一看呢。\n@c0@"
  tl: "@a@b%a002050：等施工完成後，\n　　我也想去對面\n　　看一看呢。\n@c0@"
186:
  en: "@a%0%a002000@bAt least some good came from this, aye?\n@c0@"
  ja: "@a@b%a002000「オレたちは　がっかりだが\n\tこの人たちは　大よろこびだよな。\n@c0@"
  ko: "@a@b%a002000: 우리는 실망했지만\n이 사람들은 크게 기뻐하는군.\n@c0@"
  sl: "@a@b%a002000：虽然咱觉得失望，\n　　这些人倒是开心得很呢。\n@c0@"
  tl: "@a@b%a002000：雖然咱覺得失望，\n　　這些人倒是開心得很呢。\n@c0@"
187:
  en: "@a%0%a002010@bAt the end of the day, that's what matters most.\n@c0@"
  ja: "@a@b%a002010「１番　大事なのは\n\tここが　とおれるようになる\n\tということよね。\n@c0@"
  ko: "@a@b%a002010: 가장 중요한 건\n여길 지나갈 수 있게\n되었다는 거야.\n@c0@"
  sl: "@a@b%a002010：这里能够通行，\n　　才是最重要的事情吧。\n@c0@"
  tl: "@a@b%a002010：這裡能夠通行，\n　　才是最重要的事情吧。\n@c0@"
188:
  en: "@a%0%a002020@bOoh, I can't wait for them to wrap up.\n@c0@"
  ja: "@a@b%a002020「工事が　おわったら\n\tここを　通って……\n@c0@"
  ko: "@a@b%a002020: 공사가 끝나면\n여길 지나서......\n@c0@"
  sl: "@a@b%a002020：等施工结束后，\n　　穿过这里……\n@c0@"
  tl: "@a@b%a002020：等施工結束後，\n　　穿過這裡……\n@c0@"
189:
  en: "@a%0%a002020@bThat'll put our journey back on track!\n@c0@"
  ja: "@a@b%a002020「あたしたちの　旅を\n\t続けましょ！\n@c0@"
  ko: "@a@b%a002020: 우리도 여행을\n계속하자!\n@c0@"
  sl: "@a@b%a002020：继续我们的旅行吧！\n@c0@"
  tl: "@a@b%a002020：繼續我們的旅行吧！\n@c0@"
190:
  en: "@a%0%a002030@bThis is a day that many travellers have been awaiting.\n@c0@"
  ja: "@a@b%a002030「旅人に　とっては\n\t待ちに　待った　ときですね。\n@c0@"
  ko: "@a@b%a002030: 여행자 입장에서는\n애타게 기다렸겠군요.\n@c0@"
  sl: "@a@b%a002030：对于旅行者来说，\n　　这真是千呼万唤始出来啊。\n@c0@"
  tl: "@a@b%a002030：對於旅行者來說，\n　　這真是千呼萬喚始出來啊。\n@c0@"
191:
  en: "@a%0%a002050@bI wish we could say that we'd helped open up the pass, but...\n@c0@"
  ja: "@a@b%a002050「通れるように　なったのが\n\t私たちの　チカラだったら\n\t最高だったんですが……。\n@c0@"
  ko: "@a@b%a002050: 지나갈 수 있게 된 게\n저희 덕분이라면\n최고였을 텐데......\n@c0@"
  sl: "@a@b%a002050：要是能开通\n　　是因为我们的功劳的话，\n　　那才是喜上加喜啊……\n@c0@"
  tl: "@a@b%a002050：要是能開通\n　　是因為我們的功勞的話，\n　　那才是喜上加喜啊……\n@c0@"
192:
  en: "@a%0%a002000@bHardy har! They're finally back on the job, aye?\n@c0@"
  ja: "@a@b%a002000「ようやく\n\tこの人たちの　出番だな。\n@c0@"
  ko: "@a@b%a002000: 드디어\n이 사람들이 나설 때군.\n@c0@"
  sl: "@a@b%a002000：终于轮到这些人\n　　大显身手了啊。\n@c0@"
  tl: "@a@b%a002000：終於輪到這些人\n　　大顯身手了啊。\n@c0@"
193:
  en: "@a%0%a002010@bDid his partner actually fall asleep...?\n@c0@"
  ja: "@a@b%a002010「あら　おとなりの人\n\tやけに　静かね。\n\t待ちきれずに　ねてしまったのかしら？\n@c0@"
  ko: "@a@b%a002010: 어머, 옆에 있는 사람\n이상하게 조용하네.\n기다리다 못해 잠이 든 걸까?\n@c0@"
  sl: "@a@b%a002010：哎呀，\n　　旁边那人真是安静呢。\n　　等了太久，都睡着了吧？\n@c0@"
  tl: "@a@b%a002010：哎呀，\n　　旁邊那人真是安靜呢。\n　　等了太久，都睡著了吧？\n@c0@"
194:
  en: "@a%0%a002020@bWe did our part... Now it's their turn!\n@c0@"
  ja: "@a@b%a002020「ここからは\n\tこの人たちに　がんばって\n\tもらわなくっちゃね！\n@c0@"
  ko: "@a@b%a002020: 이제부터는\n이 사람들이\n열심히 해 줘야겠네!\n@c0@"
  sl: "@a@b%a002020：今后就要靠\n　　这些人努力了！\n@c0@"
  tl: "@a@b%a002020：今後就要靠\n　　這些人努力了！\n@c0@"
195:
  en: "@a%0%a002030@bI would love to be able to say it was us who resolved the situation...\n@c0@"
  ja: "@a@b%a002030「お待たせ　しました\n\t……と　いっても　私たちの\n\t手がらでは　ないですが。\n@c0@"
  ko: "@a@b%a002030: 많이 기다리셨죠?\n......이런 말을 하기에는\n저희 덕이 아니긴 하지만.\n@c0@"
  sl: "@a@b%a002030：让你们久等了……\n　　说是这么说，\n　　这其实不是我们的功劳呢。\n@c0@"
  tl: "@a@b%a002030：讓你們久等了……\n　　說是這麼說，\n　　這其實不是我們的功勞呢。\n@c0@"
196:
  en: "@a%0%a002050@bIt's not goin' to be a picnic for the two of them to clear all these rocks. Rather them than me!\n@c0@"
  ja: "@a@b%a002050「たった　ふたりで\n\tあの岩を　ぜんぶ　どけるのは\n\t大変でしょうねえ。\n@c0@"
  ko: "@a@b%a002050: 겨우 둘이서\n저 바위를 모두 치우는 건\n힘들겠군요.\n@c0@"
  sl: "@a@b%a002050：仅凭两人之力\n　　搬那块石头，\n　　一定很辛苦吧。\n@c0@"
  tl: "@a@b%a002050：僅憑兩人之力\n　　搬那塊石頭，\n　　一定很辛苦吧。\n@c0@"
197:
  en: "@a%0%a002000@bThings're about to get lively around here!\n@c0@"
  ja: "@a@b%a002000「いよいよ\n\t工事　再開だな！\n@c0@"
  ko: "@a@b%a002000: 드디어\n공사가 다시 시작되는군!\n@c0@"
  sl: "@a@b%a002000：施工终于\n　　重新开始了啊！\n@c0@"
  tl: "@a@b%a002000：施工終於\n　　重新開始了啊！\n@c0@"
198:
  en: "@a%0%a002010@bHe's surprisingly nimble considering he's just got up.\n@c0@"
  ja: "@a@b%a002010「今まで　ねていたのに\n\t足どりは　軽かったわね。\n@c0@"
  ko: "@a@b%a002010: 여태껏 자고 있었던 것치고는 \n발걸음이 가볍네.\n@c0@"
  sl: "@a@b%a002010：明明之前一直在睡觉，\n　　身手还挺敏捷的啊。\n@c0@"
  tl: "@a@b%a002010：明明之前一直在睡覺，\n　　身手還挺敏捷的啊。\n@c0@"
199:
  en: "@a%0%a002020@bWork like that is dangerous if you're drowsy.\n@c0@"
  ja: "@a@b%a002020「ねおきで　ムリすると\n\tケガを　するよー！\n@c0@"
  ko: "@a@b%a002020: 자다 일어나서 바로 무리하면\n다친다구~!\n@c0@"
  sl: "@a@b%a002020：刚睡醒就这么使劲\n　　容易受伤的哦！\n@c0@"
  tl: "@a@b%a002020：剛睡醒就這麼使勁\n　　容易受傷的哦！\n@c0@"
200:
  en: "@a%0%a002030@bShall we observe the repair work while we're here?\n@c0@"
  ja: "@a@b%a002030「せっかくですから\n\tちょっと　工事のようすを\n\t見て　いきませんか？\n@c0@"
  ko: "@a@b%a002030: 이왕이면\n공사하는 모습을\n좀 보고 갈까요?\n@c0@"
  sl: "@a@b%a002030：机会难得，\n　　要不要去看看\n　　施工情况？\n@c0@"
  tl: "@a@b%a002030：機會難得，\n　　要不要去看看\n　　施工情況？\n@c0@"
201:
  en: "@a%0%a002050@bOld %a002050 can't wait till they open this pass up again!\n@c0@"
  ja: "@a@b%a002050「開通したら　ぜひ\n\t向こうがわへ　行ってみましょう。\n@c0@"
  ko: "@a@b%a002050: 개통되면 꼭\n반대편으로 가 보자구요.\n@c0@"
  sl: "@a@b%a002050：等开通之后，\n　　一定要去对面看看。\n@c0@"
  tl: "@a@b%a002050：等開通之後，\n　　一定要去對面看看。\n@c0@"
