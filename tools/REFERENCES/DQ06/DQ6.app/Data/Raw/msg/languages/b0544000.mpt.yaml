  sl: "@a@b%a002010：这里空气混浊，\n　　感觉很不舒服呢……\n@c0@"
  tl: "@a@b%a002010：這裡空氣混濁，\n　　感覺很不舒服呢……\n@c0@"
113:
  en: "@a%0%a002020@bWow, this place is crawling with monsters!\n@c0@"
  ja: "@a@b%a002020「まものの　気配が\n\tプンプンする感じ……。\n@c0@"
  ko: "@a@b%a002020: 마물의 기운이\n마구 느껴지는걸......\n@c0@"
  sl: "@a@b%a002020：这里感觉\n　　到处都是魔物呢……\n@c0@"
  tl: "@a@b%a002020：這裡感覺\n　　到處都是魔物呢……\n@c0@"
114:
  en: "@a%0%a002030@bWarm, pungent air is wafting from somewhere close...\n@c0@"
  ja: "@a@b%a002030「どこからか\n\t生あたたかくて　生ぐさい空気が\n\t流れてくるのを　感じます。\n@c0@"
  ko: "@a@b%a002030: 어디선가\n미지근하고 비릿한 공기가\n흘러드는 것이 느껴집니다.\n@c0@"
  sl: "@a@b%a002030：空气里好像\n　　混杂着某种生物\n　　热乎乎的恶心味道呢。\n@c0@"
  tl: "@a@b%a002030：空氣裡好像\n　　混雜著某種生物\n　　熱乎乎的噁心味道呢。\n@c0@"
115:
  en: "@a%0%a002050@bDoesn't this cave ever end?\n@c0@"
  ja: "@a@b%a002050「この　洞くつ\n\tいったい　どこまで\n\t続くのでしょうね……。\n@c0@"
  ko: "@a@b%a002050: 이 동굴은\n대체 어디까지\n이어져 있을까요......\n@c0@"
  sl: "@a@b%a002050：这个洞窟\n　　到底有多深啊……\n@c0@"
  tl: "@a@b%a002050：這個洞窟\n　　到底有多深啊……\n@c0@"
116:
  en: "@a%0%a002000@bHardy har! The beasts here have a little fight in 'em, aye?\n@c0@"
  ja: "@a@b%a002000「へへ。\n\tこのあたりの　ヤツらは\n\t少しは　歯ごたえがあるな。\n@c0@"
  ko: "@a@b%a002000: 헤헷.\n이 근방에 있는 녀석들은\n꽤 싸울 맛이 나는군.\n@c0@"
  sl: "@a@b%a002000：嘿嘿。\n　　这一带的家伙\n　　打着还挺带劲。\n@c0@"
  tl: "@a@b%a002000：嘿嘿。\n　　這一帶的傢伙\n　　打著還挺帶勁。\n@c0@"
117:
  en: "@a%0%a002010@bWe've entered the monster's nest... I can feel it...\n@c0@"
  ja: "@a@b%a002010「まものの　巣穴……\n\tまさに　そんな感じね。\n@c0@"
  ko: "@a@b%a002010: 마물의 소굴......\n딱 그런 느낌이야.\n@c0@"
  sl: "@a@b%a002010：魔物的巢穴……\n　　的确是名副其实呢。\n@c0@"
  tl: "@a@b%a002010：魔物的巢穴……\n　　的確是名副其實呢。\n@c0@"
118:
  en: "@a%0%a002020@bWait, monsters hatch from eggs? You learn something new every day!\n@c0@"
  ja: "@a@b%a002020「まものって　みんな\n\tタマゴから　うまれるのかな！？\n\tあたし　知らなかったー！\n@c0@"
