  ko: "@a@b%a002010: 어때?\n큰 구멍이 보여?\n@c0@"
  sl: "@a@b%a002010：怎么样？\n　　能看见大洞吗？\n@c0@"
  tl: "@a@b%a002010：怎麼樣？\n　　能看見大洞嗎？\n@c0@"
