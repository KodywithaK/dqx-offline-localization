  tl: "@a@b%a002020：哇，那兩隻魔物\n　　從旁邊看上去好可怕！\n@c0@"
68:
  en: "@a%0%a002030@bWe're going to have to deal with those two first.\n@c0@"
  ja: "@a@b%a002030「まず　そこのまものを\n\tかたづけないと\n\t洞くつには　入れませんね。\n@c0@"
  ko: "@a@b%a002030: 우선 저기 있는 마물을\n정리하지 않으면\n동굴로 들어갈 수 없겠군요.\n@c0@"
  sl: "@a@b%a002030：不先解决掉\n　　那边的魔物的话，\n　　是进不了洞的。\n@c0@"
  tl: "@a@b%a002030：不先解決掉\n　　那邊的魔物的話，\n　　是進不了洞的。\n@c0@"
69:
  en: "@a%0%a002050@bLet's be careful! We don't want any of the party gettin' their own coffin!\n@c0@"
  ja: "@a@b%a002050「自分たちが　カンオケに\n\t入るハメに　ならないよう\n\t気をひきしめて　行きましょう！\n@c0@"
  ko: "@a@b%a002050: 우리가 관으로\n들어가는 일이 벌어지지 않도록\n정신 바짝 차리고 가자구요!\n@c0@"
  sl: "@a@b%a002050：要谨慎行事，\n　　别到最后进棺材的\n　　变成了我们！\n@c0@"
  tl: "@a@b%a002050：要謹慎行事，\n　　別到最後進棺材的\n　　變成了我們！\n@c0@"
70:
  en: "@a%0%a002000@bWhew... That was a good warmup, aye?\n@c0@"
  ja: "@a@b%a002000「ふう……。\n\tまずは　こてしらべ\n\tって　とこだったな！\n@c0@"
  ko: "@a@b%a002000: 후우......\n몸풀기 한번\n잘 했군!\n@c0@"
  sl: "@a@b%a002000：呼……\n　　先小试牛刀了一把呢！\n@c0@"
  tl: "@a@b%a002000：呼……\n　　先小試牛刀了一把呢！\n@c0@"
71:
  en: "@a%0%a002010@bI sense that the battles ahead will be fierce. Keep your guard up.\n@c0@"
  ja: "@a@b%a002010「あまり　かんたんには\n\tいかないかも　しれないわね。\n\t気をつけて　行きましょう。\n@c0@"
  ko: "@a@b%a002010: 그렇게 호락호락하지\n않을지도 몰라.\n조심해서 가 보자.\n@c0@"
  sl: "@a@b%a002010：要顺利完成任务\n　　可没有那么简单。\n　　要小心行事。\n@c0@"
  tl: "@a@b%a002010：要順利完成任務\n　　可沒有那麼簡單。\n　　要小心行事。\n@c0@"
72:
  en: "@a%0%a002020@bGreat! Now for the real fight!\n@c0@"
  ja: "@a@b%a002020「ここから先が　本番ね！\n@c0@"
  ko: "@a@b%a002020: 이제부터가 진짜야!\n@c0@"
  sl: "@a@b%a002020：接下来才是真正的战斗！\n@c0@"
  tl: "@a@b%a002020：接下來才是真正的戰鬥！\n@c0@"
73:
  en: "@a%0%a002030@bWe did it! Now let's head inside!\n@c0@"
  ja: "@a@b%a002030「やりましたね！\n\tさあ　洞くつの中へ！\n@c0@"
  ko: "@a@b%a002030: 해냈군요!\n자, 동굴 속으로 가 보죠!\n@c0@"
  sl: "@a@b%a002030：干掉了！\n　　快进洞吧！\n@c0@"
  tl: "@a@b%a002030：幹掉了！\n　　快進洞吧！\n@c0@"
74:
  en: "@a%0%a002050@bThose were our first opponents!? Could be an uphill struggle...\n@c0@"
  ja: "@a@b%a002050「最初の　相手にしては\n\t手ごわかったですね……。\n@c0@"
  ko: "@a@b%a002050: 첫 상대 치고는\n만만치 않았네요......\n@c0@"
  sl: "@a@b%a002050：作为第一个对手，\n　　还真是难缠啊……\n@c0@"
  tl: "@a@b%a002050：作為第一個對手，\n　　還真是難纏啊……\n@c0@"
75:
  en: "@a%0%a002000@bWhoa! Look at the size of this place!\n@c0@"
  ja: "@a@b%a002000「うわあ……。\n\tバカに　広いじゃないか。\n@c0@"
  ko: "@a@b%a002000: 우와아......\n뭐가 이렇게 넓어?\n@c0@"
  sl: "@a@b%a002000：哇啊……\n　　这里还真是大得可以啊。\n@c0@"
  tl: "@a@b%a002000：哇啊……\n　　這裡還真是大得可以啊。\n@c0@"
76:
  en: "@a%0%a002010@bWho would've guessed a cave of this size would be hidden behind that wall?\n@c0@"
  ja: "@a@b%a002010「こんな　巨大な\n\t洞くつが　カベの　うらに\n\tかくれて　いたのね。\n@c0@"
  ko: "@a@b%a002010: 이렇게 거대한\n동굴이 벽 너머에\n숨어 있었구나.\n@c0@"
  sl: "@a@b%a002010：没想到墙的后面\n　　竟然是这么大一个洞窟呢。\n@c0@"
  tl: "@a@b%a002010：沒想到墻的後面\n　　竟然是這麼大一個洞窟呢。\n@c0@"
77:
  en: "@a%0%a002020@bThis place is huge! Hope we don't get lost.\n@c0@"
  ja: "@a@b%a002020「ずいぶん　広いわねー。\n\tまいごに　なっちゃいそう。\n@c0@"
  ko: "@a@b%a002020: 상당히 넓은걸~\n헤맬 것 같아.\n@c0@"
  sl: "@a@b%a002020：这里真宽敞啊，\n　　我都要迷路了。\n@c0@"
  tl: "@a@b%a002020：這裡真寬敞啊，\n　　我都要迷路了。\n@c0@"
78:
  en: "@a%0%a002030@bThe winding paths make this area quite tricky to navigate...\n@c0@"
  ja: "@a@b%a002030「池が多くて\n\t道すじが　わかりにくいですね……。\n@c0@"
  ko: "@a@b%a002030: 연못이 많아서\n길이 어디로 이어져 있는지 알기 힘드네요......\n@c0@"
  sl: "@a@b%a002030：这里面有很多积水的地方，\n　　道路真是错综复杂啊……\n@c0@"
  tl: "@a@b%a002030：這裡面有很多積水的地方，\n　　道路真是錯綜複雜啊……\n@c0@"
79:
  en: "@a%0%a002050@bTake care not to fall into any of this water!\n@c0@"
  ja: "@a@b%a002050「おっとっと！\n\t水に　落ちないように\n\t行きましょうね！\n@c0@"
  ko: "@a@b%a002050: 아차차!\n물에 떨어지지 않도록\n조심하면서 가자구요!\n@c0@"
  sl: "@a@b%a002050：哎呀呀！\n　　要小心不要掉到水里！\n@c0@"
  tl: "@a@b%a002050：哎呀呀！\n　　要小心不要掉到水裡！\n@c0@"
80:
  en: "@a%0%a002000@bWhere do ya think that %a002040 guy is by now?\n@c0@"
  ja: "@a@b%a002000「あの　%a002040ってやつ……\n\tどのへんに　いるのかな。\n@c0@"
  ko: "@a@b%a002000: 그 %a002040%F2040%X라%Y이라%Z는 녀석......\n어디쯤에 있지?\n@c0@"
  sl: "@a@b%a002000：那个叫%a002040的家伙……\n　　现在在哪啊。\n@c0@"
  tl: "@a@b%a002000：那個叫%a002040的傢伙……\n　　現在在哪啊。\n@c0@"
81:
  en: "@a%0%a002010@bThere's no telling how deep this cave is...\n@c0@"
  ja: "@a@b%a002010「この洞くつが\n\tどのくらい　続くのか\n\tそうぞうも　つかないわね。\n@c0@"
  ko: "@a@b%a002010: 이 동굴이\n어디까지 이어져 있을지\n상상도 가지 않아.\n@c0@"
  sl: "@a@b%a002010：完全\n　　无法想象这个洞\n　　到底有多深。\n@c0@"
  tl: "@a@b%a002010：完全\n　　無法想像這個洞\n　　到底有多深。\n@c0@"
82:
  en: "@a%0%a002020@bNothing's gonna leap from the water and, like, suck my face off, right?\n@c0@"
  ja: "@a@b%a002020「水の中から\n\tなにか　出てきたり\n\tしないでしょうね……。\n@c0@"
  ko: "@a@b%a002020: 물속에서\n뭔가가 튀어나오는 거\n아니겠지......\n@c0@"
  sl: "@a@b%a002020：水里不会\n　　突然冒出个什么东西吧……\n@c0@"
  tl: "@a@b%a002020：水裡不會\n　　突然冒出個什麼東西吧……\n@c0@"
83:
  en: "@a%0%a002030@bI sense a great number of monsters. We must proceed with caution.\n@c0@"
  ja: "@a@b%a002030「ふーむ。\n\tまものの　気配が　強いですね。\n\t気をつけて　進みましょう。\n@c0@"
  ko: "@a@b%a002030: 흐음.\n마물의 기운이 강하게 느껴집니다.\n주의하면서 가죠.\n@c0@"
  sl: "@a@b%a002030：唔。\n　　我能感到很强的魔物气息。\n　　要小心行事。\n@c0@"
  tl: "@a@b%a002030：唔。\n　　我能感到很強的魔物氣息。\n　　要小心行事。\n@c0@"
84:
  en: "@a%0%a002050@bAh-Ah-CHOO!!!\n@c0@"
  ja: "@a@b%a002050「ハーックション！！\n@c0@"
  ko: "@a@b%a002050: 에~에엣취!!\n@c0@"
  sl: "@a@b%a002050：阿嚏！！\n@c0@"
  tl: "@a@b%a002050：阿嚏！！\n@c0@"
85:
  en: "@a%0%a002000@b‘Swordsman’? Him, I bet.\n@c0@"
  ja: "@a@b%a002000「あの男……？\n\tアイツのことか。\n@c0@"
  ko: "@a@b%a002000: 그 남자......?\n설마 녀석인가?\n@c0@"
  sl: "@a@b%a002000：那个男人？\n　　说的就是那家伙吧。\n@c0@"
  tl: "@a@b%a002000：那個男人？\n　　說的就是那傢伙吧。\n@c0@"
86:
  en: "@a%0%a002010@bLooks like someone felt the sharp end of %a002040's sword...\n@c0@"
  ja: "@a@b%a002010「おそらく\n\t%a002040に　倒されたのね。\n@c0@"
  ko: "@a@b%a002010: 아마도\n%a002040에게 당한 것 같아.\n@c0@"
  sl: "@a@b%a002010：估计是被\n　　%a002040打倒的吧。\n@c0@"
  tl: "@a@b%a002010：估計是被\n　　%a002040打倒的吧。\n@c0@"
87:
  en: "@a%0%a002020@bEven the monsters are talking about him? He must be the real deal!\n@c0@"
  ja: "@a@b%a002020「まものに　強いと\n\t言われるんだから\n\tそうとうの　うで前なのね……。\n@c0@"
  ko: "@a@b%a002020: 마물이 강하다고\n할 정도면\n실력이 엄청난가 보네......\n@c0@"
  sl: "@a@b%a002020：连魔物都说他很厉害，\n　　那他一定真的\n　　很有本事吧……\n@c0@"
  tl: "@a@b%a002020：連魔物都說他很厲害，\n　　那他一定真的\n　　很有本事吧……\n@c0@"
88:
  en: "@a%0%a002030@bIt looks like he was felled with a single blow. This is no mean swordsman...\n@c0@"
  ja: "@a@b%a002030「キズぐちを　見ると\n\tいちげきで　倒されてますね。\n\t確かに　強い……。\n@c0@"
  ko: "@a@b%a002030: 상처를 보니\n일격에 쓰러진 모양입니다.\n확실히 강하군요......\n@c0@"
  sl: "@a@b%a002030：从伤口来看，\n　　他是一击制胜呢。\n　　果然很厉害……\n@c0@"
  tl: "@a@b%a002030：從傷口來看，\n　　他是一擊制勝呢。\n　　果然很厲害……\n@c0@"
89:
  en: "@a%0%a002050@bThat monster still had some life in it when we arrived...\n@c0@"
  ja: "@a@b%a002050「この　まものに\n\tまだ　息が　あると\n\tいうことは……\n@c0@"
  ko: "@a@b%a002050: 이 마물에게는\n아직 숨이 붙어 있네요.\n그렇다면......\n@c0@"
  sl: "@a@b%a002050：这个魔物还有一口气，\n　　也就是说……\n@c0@"
  tl: "@a@b%a002050：這個魔物還有一口氣，\n　　也就是說……\n@c0@"
90:
  en: "@a%0%a002050@bThat must mean this %a002040 lad isn't too far ahead.\n@c0@"
  ja: "@a@b%a002050「%a002040も　まだ\n\tそんなに　遠くない　ところに\n\tいるんでしょうか。\n@c0@"
  ko: "@a@b%a002050: %a002040도 아직\n그렇게 멀리 가지는 않았다는\n뜻 아닐까요?\n@c0@"
  sl: "@a@b%a002050：%a002040应该\n　　还没有走太远吧。\n@c0@"
  tl: "@a@b%a002050：%a002040應該\n　　還沒有走太遠吧。\n@c0@"
91:
  en: "@a%0%a002000@bGeh. And I thought they smelt bad when they were alive!\n@c0@"
  ja: "@a@b%a002000「死んでしまった\n\tようだな。\n@c0@"
  ko: "@a@b%a002000: 목숨이 끊어진\n모양이군.\n@c0@"
  sl: "@a@b%a002000：好像已经断气了。\n@c0@"
  tl: "@a@b%a002000：好像已經斷氣了。\n@c0@"
92:
  en: "@a%0%a002010@b%0%a002040...\n@c0@"
  ja: "@a@b%a002010「%a002040……。\n@c0@"
  ko: "@a@b%a002010: %a002040......\n@c0@"
  sl: "@a@b%a002010：%a002040……\n@c0@"
  tl: "@a@b%a002010：%a002040……\n@c0@"
93:
  en: "@a%0%a002020@bNo time to waste! C'mon, c'mon!\n@c0@"
  ja: "@a@b%a002020「さあ　ここで\n\tゆっくりしている　ヒマは\n\tないよね。　行こう！\n@c0@"
  ko: "@a@b%a002020: 자, 여기서\n여유 부릴 때가\n아니잖아. 가자!\n@c0@"
  sl: "@a@b%a002020：没时间\n　　在这里磨蹭了，\n　　走吧！\n@c0@"
  tl: "@a@b%a002020：沒時間\n　　在這裡磨蹭了，\n　　走吧！\n@c0@"
94:
  en: "@a%0%a002030@bLet us hurry!\n@c0@"
  ja: "@a@b%a002030「さあ……\n\t先を　急ぎましょうか。\n@c0@"
  ko: "@a@b%a002030: 그럼......\n가던 길을 갈까요?\n@c0@"
  sl: "@a@b%a002030：赶紧往前走吧……\n@c0@"
  tl: "@a@b%a002030：趕緊往前走吧……\n@c0@"
95:
  en: "@a%0%a002050@bThe final battle is waitin' for us up ahead.\n@c0@"
  ja: "@a@b%a002050「さっきのが\n\t最後の　ひとこと\n\tだったのですね。\n@c0@"
  ko: "@a@b%a002050: 마지막 말을\n남기고\n죽어 버렸군요.\n@c0@"
  sl: "@a@b%a002050：刚才那是\n　　它的遗言吧。\n@c0@"
  tl: "@a@b%a002050：剛才那是\n　　它的遺言吧。\n@c0@"
96:
  en: "@a%0%a002000@bThis cave ain't big enough for a mountain of a man like me.\n@c0@"
  ja: "@a@b%a002000「上の　階より\n\tせまくるしい　ふんいきだな。\n@c0@"
  ko: "@a@b%a002000: 위층보다\n갑갑하게 느껴지는군.\n@c0@"
  sl: "@a@b%a002000：这里比上面那层狭窄，\n　　真是闷得慌。\n@c0@"
  tl: "@a@b%a002000：這裡比上面那層狹窄，\n　　真是悶得慌。\n@c0@"
97:
  en: "@a%0%a002010@bThe aura here seems different...\n@c0@"
  ja: "@a@b%a002010「がらっと　ふんいきが\n\tかわったわね。\n@c0@"
  ko: "@a@b%a002010: 분위기가 갑자기\n바뀌었네.\n@c0@"
  sl: "@a@b%a002010：气氛一下子就变了呢。\n@c0@"
  tl: "@a@b%a002010：氣氛一下子就變了呢。\n@c0@"
98:
  en: "@a%0%a002020@bIt doesn't seem like anyone is here.\n@c0@"
  ja: "@a@b%a002020「あたりに\n\t人が　いそうな　気配は\n\tないわね。\n@c0@"
  ko: "@a@b%a002020: 주변에서\n인기척은\n느껴지지 않아.\n@c0@"
  sl: "@a@b%a002020：这附近好像没人呢。\n@c0@"
  tl: "@a@b%a002020：這附近好像沒人呢。\n@c0@"
99:
  en: "@a%0%a002030@bI wonder if %a002040 is on this level?\n@c0@"
  ja: "@a@b%a002030「%a002040さんは\n\tこの階に　いますかね。\n@c0@"
  ko: "@a@b%a002030: %a002040 씨는\n이 층에 있을까요?\n@c0@"
  sl: "@a@b%a002030：%a002040\n　　就在这一层吧。\n@c0@"
  tl: "@a@b%a002030：%a002040\n　　就在這一層吧。\n@c0@"
100:
  en: "@a%0%a002050@bI can barely see beyond my nose down here.\n@c0@"
  ja: "@a@b%a002050「下りてきたとたん\n\tいきなり　見通しが\n\t悪く　なりましたね。\n@c0@"
  ko: "@a@b%a002050: 아래로 내려온 순간\n갑자기 시야가\n좁아졌군요.\n@c0@"
  sl: "@a@b%a002050：一下到这一层，\n　　视野就变差了呢。\n@c0@"
  tl: "@a@b%a002050：一下到這一層，\n　　視野就變差了呢。\n@c0@"
101:
  en: "@a%0%a002000@bCrikey. I'm gettin' all twisted around.\n@c0@"
  ja: "@a@b%a002000「けっこう\n\tいりくんで　いるよな。\n@c0@"
  ko: "@a@b%a002000: 제법\n복잡하군.\n@c0@"
  sl: "@a@b%a002000：这路真绕啊。\n@c0@"
  tl: "@a@b%a002000：這路真繞啊。\n@c0@"
102:
  en: "@a%0%a002010@bLet's take care not to waste too much energy wandering around.\n@c0@"
  ja: "@a@b%a002010「むだに　体力を\n\tへらさないよう　みんな\n\t気をつけましょうね。\n@c0@"
  ko: "@a@b%a002010: 쓸데없이 체력을\n소모하지 않도록 모두\n조심하자구.\n@c0@"
  sl: "@a@b%a002010：大家要小心，\n　　不要浪费体力。\n@c0@"
  tl: "@a@b%a002010：大家要小心，\n　　不要浪費體力。\n@c0@"
103:
  en: "@a%0%a002020@bWe just keep walking and walking...\n@c0@"
  ja: "@a@b%a002020「歩けども\n\t歩けども……。\n@c0@"
  ko: "@a@b%a002020: 걸어도\n걸어도......\n@c0@"
  sl: "@a@b%a002020：往前走往前走……\n@c0@"
  tl: "@a@b%a002020：往前走往前走……\n@c0@"
104:
  en: "@a%0%a002030@bThis place is a labyrinth...\n@c0@"
  ja: "@a@b%a002030「まさしく\n\t迷路ですねえ。\n@c0@"
  ko: "@a@b%a002030: 마치\n미로 같군요.\n@c0@"
  sl: "@a@b%a002030：这路真是\n　　错综复杂啊。\n@c0@"
  tl: "@a@b%a002030：這路真是\n　　錯綜複雜啊。\n@c0@"
105:
  en: "@a%0%a002050@bOld %a002050 is gettin' nervous every time we turn a corner...\n@c0@"
  ja: "@a@b%a002050「角を　まがるたびに\n\tなにか　出てきそうで\n\tドキドキ　しますね。\n@c0@"
  ko: "@a@b%a002050: 모퉁이를 돌 때마다\n뭔가가 나올 것 같아서\n떨리는군요.\n@c0@"
  sl: "@a@b%a002050：一到拐角的时候，\n　　总觉得会有什么东西窜出来，\n　　好紧张啊。\n@c0@"
  tl: "@a@b%a002050：一到拐角的時候，\n　　總覺得會有什麼東西竄出來，\n　　好緊張啊。\n@c0@"
106:
  en: "@a%0%a002000@bThose are human bones, alright. They look too mouldy to be his, though.\n@c0@"
  ja: "@a@b%a002000「人の　ホネか……。\n\tけっこう　古そうだから\n\tアイツじゃ　ないな。\n@c0@"
  ko: "@a@b%a002000: 사람 뼈 같은데......\n꽤 오래된 것 같으니\n녀석의 것은 아니겠군.\n@c0@"
  sl: "@a@b%a002000：死人骨头啊……\n　　看上去有点年头了，\n　　应该不是那家伙的吧。\n@c0@"
  tl: "@a@b%a002000：死人骨頭啊……\n　　看上去有點年頭了，\n　　應該不是那傢伙的吧。\n@c0@"
107:
  en: "@a%0%a002010@bOh my...\n@c0@"
  ja: "@a@b%a002010「お気の毒に……。\n@c0@"
  ko: "@a@b%a002010: 가엾어라......\n@c0@"
  sl: "@a@b%a002010：真可怜……\n@c0@"
  tl: "@a@b%a002010：真可憐……\n@c0@"
108:
  en: "@a%0%a002020@bThat must've been a soldier from Arkbolt, sent to slay the monster.\n@c0@"
  ja: "@a@b%a002020「まものを　倒しに来た\n\tアークボルトの　兵隊さんかな。\n@c0@"
  ko: "@a@b%a002020: 마물을 쓰러뜨리러 온\n아크볼트의 병사일까?\n@c0@"
  sl: "@a@b%a002020：是来讨伐魔物的\n　　阿克博尔特士兵吧。\n@c0@"
  tl: "@a@b%a002020：是來討伐魔物的\n　　阿克博爾特士兵吧。\n@c0@"
109:
  en: "@a%0%a002030@bHe is with the Goddess now...\n@c0@"
  ja: "@a@b%a002030「どうぞ　やすらかに……。\n@c0@"
  ko: "@a@b%a002030: 편히 잠드소서......\n@c0@"
  sl: "@a@b%a002030：安息吧……\n@c0@"
  tl: "@a@b%a002030：安息吧……\n@c0@"
110:
  en: "@a%0%a002050@bOld %a002050 doesn't want to end up like that poor fellow!\n@c0@"
  ja: "@a@b%a002050「しょうじきな話\n\tこんなふうには\n\tなりたく　ないです……。\n@c0@"
  ko: "@a@b%a002050: 솔직히 말해서\n이렇게 되고 싶지는\n않습니다......\n@c0@"
  sl: "@a@b%a002050：老实说，\n　　我可不想死得这么惨……\n@c0@"
  tl: "@a@b%a002050：老實說，\n　　我可不想死得這麼慘……\n@c0@"
111:
  en: "@a%0%a002000@bAvast! Even I'm startin' to get creeped out by this place.\n@c0@"
  ja: "@a@b%a002000「うおっ\n\tなんか　いやーな　ふんいきが\n\tただよってきたぞ！\n@c0@"
  ko: "@a@b%a002000: 이런,\n왠지 불길한 분위기가\n감돌기 시작했군!\n@c0@"
  sl: "@a@b%a002000：啊，\n　　这里的气氛真恶心！\n@c0@"
  tl: "@a@b%a002000：啊，\n　　這裡的氣氛真噁心！\n@c0@"
112:
  en: "@a%0%a002010@bThe air down here is horribly stagnant... (cough)\n@c0@"
  ja: "@a@b%a002010「空気が　よどんでて\n\tいごこち悪い　ところね……。\n@c0@"
