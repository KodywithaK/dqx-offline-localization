  sl: "@a@b%a002020：虽然不知道是谁，\n　　不过在洞里的时候，\n　　我们可摸清他是个怎样的人了呢。\n@c0@"
  tl: "@a@b%a002020：雖然不知道是誰，\n　　不過在洞裡的時候，\n　　我們可摸清他是個怎樣的人了呢。\n@c0@"
160:
  en: "@a%0%a002030@bWhoever he is, he is no doubt beating a path to Arkbolt Castle as we speak.\n@c0@"
  ja: "@a@b%a002030「今ごろは　もう\n\tいきようようと　お城に\n\t向かって　いるんでしょう。\n@c0@"
  ko: "@a@b%a002030: 지금쯤 벌써\n의기양양하게 성으로\n향하고 있겠지요.\n@c0@"
  sl: "@a@b%a002030：现在他估计\n　　已经意气风发地\n　　回城里去了吧。\n@c0@"
  tl: "@a@b%a002030：現在他估計\n　　已經意氣風發地\n　　回城裡去了吧。\n@c0@"
161:
  en: "@a%0%a002050@bHe had a bit of a baby-face, but when it came to doin' battle, that lad was all grown up!\n@c0@"
  ja: "@a@b%a002050「まだ　子供っぽい\n\t顔だちなのに　なかなかの\n\tすごうで　でしたね。\n@c0@"
  ko: "@a@b%a002050: 아직 앳된\n얼굴이었는데 상당한\n실력가더군요.\n@c0@"
  sl: "@a@b%a002050：虽然脸上\n　　稚气未脱，\n　　但身手真是不俗啊。\n@c0@"
  tl: "@a@b%a002050：雖然臉上\n　　稚氣未脫，\n　　但身手真是不俗啊。\n@c0@"
162:
  en: "@a%0%a002000@bAye, I'd like to see what's doin' back at the castle, anyway.\n@c0@"
  ja: "@a@b%a002000「そうだな……\n\t城のようすも　いちおう\n\t見ておきたいしな。\n@c0@"
  ko: "@a@b%a002000: 그래......\n일단 성 분위기도\n살펴봐야겠지.\n@c0@"
  sl: "@a@b%a002000：对啊……\n　　俺也想看看\n　　城里变成啥样了呢。\n@c0@"
  tl: "@a@b%a002000：對啊……\n　　俺也想看看\n　　城裡變成啥樣了呢。\n@c0@"
163:
  en: "@a%0%a002010@bPerhaps we'll find %a002040 waiting for us back at the castle.\n@c0@"
  ja: "@a@b%a002010「いま　城に　もどれば\n\tあの　%a002040という　剣士も\n\tいるかも　しれないわね。\n@c0@"
