  sl: "@a@b%a002010：现在回城里去的话，\n　　那个叫做%a002040的剑士\n　　应该也会在吧。\n@c0@"
  tl: "@a@b%a002010：現在回城裡去的話，\n　　那個叫做%a002040的劍士\n　　應該也會在吧。\n@c0@"
164:
  en: "@a%0%a002020@bA while? But I want to see what's on the other side right now!\n@c0@"
  ja: "@a@b%a002020「あーあ　このまま　この\n\tトンネルを　通って　ほかの土地へ\n\t行っちゃいたい気分……。\n@c0@"
  ko: "@a@b%a002020: 아~ 이대로\n이 터널을 지나서 다른 곳으로\n가 버리고 싶은 기분이야......\n@c0@"
  sl: "@a@b%a002020：啊，\n　　真想赶快穿过这个山洞\n　　到别的地方去啊……\n@c0@"
  tl: "@a@b%a002020：啊，\n　　真想趕快穿過這個山洞\n　　到別的地方去啊……\n@c0@"
165:
  en: "@a%0%a002020@bOh well... Not much we can do but wait.\n@c0@"
  ja: "@a@b%a002020「でも　まだ\n\t開通していないんじゃ\n\tしょうがないわね。\n@c0@"
  ko: "@a@b%a002020: 하지만 아직\n개통되지 않았으니\n어쩔 수 없네.\n@c0@"
  sl: "@a@b%a002020：不过，\n　　还没有开通的话，\n　　那就没办法了。\n@c0@"
  tl: "@a@b%a002020：不過，\n　　還沒有開通的話，\n　　那就沒辦法了。\n@c0@"
166:
  en: "@a%0%a002030@bWe had better return to Arkbolt Castle.\n@c0@"
  ja: "@a@b%a002030「そうですね\n\tいったん　城へ　もどりましょう。\n@c0@"
  ko: "@a@b%a002030: 그래요.\n일단 성으로 돌아갑시다.\n@c0@"
  sl: "@a@b%a002030：是啊。\n　　先回城里去吧。\n@c0@"
  tl: "@a@b%a002030：是啊。\n　　先回城裡去吧。\n@c0@"
167:
  en: "@a%0%a002030@bWe owe the King and Commander Brutus a full report.\n@c0@"
  ja: "@a@b%a002030「けっきょく\n\t私たちは　なにも\n\tできませんでしたが……。\n@c0@"
