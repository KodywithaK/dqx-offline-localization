  sl: "@a@b%a002030：真是自信满满呢……\n@c0@"
  tl: "@a@b%a002030：真是自信滿滿呢……\n@c0@"
136:
  en: "@a%0%a002050@bThis lad shouldn't overdo it, or that beast will have him for breakfast!\n@c0@"
  ja: "@a@b%a002050「%a002040さん！\n\tムチャすると　あなたが\n\tエモノに　されちゃいますよ！\n@c0@"
  ko: "@a@b%a002050: %a002040 씨!\n억지를 부렸다간 당신이\n사냥감이 되고 말 겁니다!\n@c0@"
  sl: "@a@b%a002050：%a002040！\n　　乱来的话，\n　　你会被你的猎物干掉的！\n@c0@"
  tl: "@a@b%a002050：%a002040！\n　　亂來的話，\n　　你會被你的獵物幹掉的！\n@c0@"
137:
  en: "@a%0%a002000@bHe's gone...\n@c0@"
  ja: "@a@b%a002000「いっちまった……。\n@c0@"
  ko: "@a@b%a002000: 가 버렸군......\n@c0@"
  sl: "@a@b%a002000：他走了……\n@c0@"
  tl: "@a@b%a002000：他走了……\n@c0@"
138:
  en: "@a%0%a002010@b%0%a002040... He certainly is strong...\n@c0@"
  ja: "@a@b%a002010「%a002040……\n\t本当に　強いのね……。\n@c0@"
  ko: "@a@b%a002010: %a002040......\n정말 강하구나......\n@c0@"
  sl: "@a@b%a002010：%a002040……\n　　真的很厉害啊……\n@c0@"
  tl: "@a@b%a002010：%a002040……\n　　真的很厲害啊……\n@c0@"
139:
  en: "@a%0%a002020@bI guess we can kiss that sunderbolt blade goodbye...\n@c0@"
  ja: "@a@b%a002020「あーあ……。\n\tこれで　雷鳴の剣は\n\t%a002040の　ものかあ……。\n@c0@"
  ko: "@a@b%a002020: 아아......\n이제 우렛소리 검은\n%a002040 차지가 되어 버렸구나......\n@c0@"
  sl: "@a@b%a002020：啊……\n　　这下雷鸣之剑\n　　会被%a002040拿走吧……\n@c0@"
  tl: "@a@b%a002020：啊……\n　　這下雷鳴之劍\n　　會被%a002040拿走吧……\n@c0@"
140:
  en: "@a%0%a002030@bThat was an extraordinary display of swordsmanship.\n@c0@"
  ja: "@a@b%a002030「おみごとでした……と\n\t言うほか　ありませんね。\n@c0@"
  ko: "@a@b%a002030: 훌륭한 전투였습니다......\n이 말밖엔 할 말이 없군요.\n@c0@"
  sl: "@a@b%a002030：我们只能说……\n　　干得漂亮。\n@c0@"
  tl: "@a@b%a002030：我們只能說……\n　　幹得漂亮。\n@c0@"
141:
  en: "@a%0%a002050@bOld %a002050 is agog! That lad didn't put a foot wrong!\n@c0@"
  ja: "@a@b%a002050「まったく　ムダのない\n\t戦い方でしたね。\n\tただただ　ビックリしました。\n@c0@"
  ko: "@a@b%a002050: 군더더기가 전혀 없는\n전투로군요.\n그저 놀랄 수밖에.\n@c0@"
  sl: "@a@b%a002050：打得真是\n　　干净利落啊。\n　　我都惊呆了。\n@c0@"
  tl: "@a@b%a002050：打得真是\n　　乾淨俐落啊。\n　　我都驚呆了。\n@c0@"
142:
  en: "@a%0%a002000@bIt's really quiet, aye...?\n@c0@"
  ja: "@a@b%a002000「静かだな……。\n@c0@"
  ko: "@a@b%a002000: 조용하군......\n@c0@"
  sl: "@a@b%a002000：真安静啊……\n@c0@"
  tl: "@a@b%a002000：真安靜啊……\n@c0@"
143:
  en: "@a%0%a002010@bIt's eerily silent in here now that the monster's been defeated.\n@c0@"
  ja: "@a@b%a002010「あの　巨大な\n\tまものが　いなくなったら\n\tウソのように　静まったわね。\n@c0@"
  ko: "@a@b%a002010: 그 거대한\n마물이 없어지고 나니\n거짓말처럼 조용해졌어.\n@c0@"
  sl: "@a@b%a002010：那个巨大的魔物被消灭后，\n　　这里就安静得难以置信呢。\n@c0@"
  tl: "@a@b%a002010：那個巨大的魔物被消滅後，\n　　這裡就安靜得難以置信呢。\n@c0@"
144:
  en: "@a%0%a002020@bBoy, all this walking is murder on my feet... \n@c0@"
  ja: "@a@b%a002020「行きも　帰りも　歩きで\n\t疲れて来ちゃったよ……。\n@c0@"
  ko: "@a@b%a002020: 올 때도 걸었는데\n돌아갈 때도 걸으니까 지친다구......\n@c0@"
  sl: "@a@b%a002020：走着来走着回去，\n　　好累啊……\n@c0@"
  tl: "@a@b%a002020：走著來走著回去，\n　　好累啊……\n@c0@"
145:
  en: "@a%0%a002030@bThere is not the slightest hint of monsters in the vicinity any more...\n@c0@"
  ja: "@a@b%a002030「もう　まものの　気配は\n\tまったく　ありませんね。\n@c0@"
  ko: "@a@b%a002030: 이제 마물의 기운은\n전혀 느껴지지 않습니다.\n@c0@"
  sl: "@a@b%a002030：已经完全察觉不到\n　　魔物的气息了呢。\n@c0@"
  tl: "@a@b%a002030：已經完全察覺不到\n　　魔物的氣息了呢。\n@c0@"
146:
  en: "@a%0%a002050@bAh-Ah-CHOO!!!\n@c0@"
  ja: "@a@b%a002050「ハーックション！！\n@c0@"
  ko: "@a@b%a002050: 에~에엣취!!\n@c0@"
  sl: "@a@b%a002050：阿嚏！！\n@c0@"
  tl: "@a@b%a002050：阿嚏！！\n@c0@"
147:
  en: "@a%0%a002000@bWhew... Finally free of that coffin!\n@c0@"
  ja: "@a@b%a002000「ふう。\n\tやっと　カンオケから\n\t解放……か。\n@c0@"
  ko: "@a@b%a002000: 후우.\n드디어 관으로부터\n해방되었군......\n@c0@"
  sl: "@a@b%a002000：呼。\n　　咱终于摆脱那口棺材了……\n@c0@"
  tl: "@a@b%a002000：呼。\n　　咱終於擺脫那口棺材了……\n@c0@"
148:
  en: "@a%0%a002010@bWe could've taken the coffin back ourselves...\n@c0@"
  ja: "@a@b%a002010「私たちが　返しても\n\tよかったのにね。\n@c0@"
  ko: "@a@b%a002010: 우리가 가져가도\n됐는데.\n@c0@"
  sl: "@a@b%a002010：我们其实\n　　可以自己还回去的。\n@c0@"
  tl: "@a@b%a002010：我們其實\n　　可以自己還回去的。\n@c0@"
149:
  en: "@a%0%a002020@bYippee! That coffin was giving me the heebie-jeebies.\n@c0@"
  ja: "@a@b%a002020「やった！\n\tカッコ悪いの　おしまいー！\n@c0@"
  ko: "@a@b%a002020: 이야!\n보기 좋게 다 끝나 버렸네~!\n@c0@"
  sl: "@a@b%a002020：太好了！\n　　看上去终于不再那么难看了！\n@c0@"
  tl: "@a@b%a002020：太好了！\n　　看上去終於不再那麼難看了！\n@c0@"
150:
  en: "@a%0%a002030@bThat soldier hauled the coffin away without breaking a sweat!\n@c0@"
  ja: "@a@b%a002030「あの　兵隊さん\n\tひとりで　元気に\n\t引っぱって　行きましたね。\n@c0@"
  ko: "@a@b%a002030: 그 병사님,\n혼자서 씩씩하게\n관을 끌고 갔군요.\n@c0@"
  sl: "@a@b%a002030：那个士兵\n　　一个人精神饱满地\n　　把棺材拖走了啊。\n@c0@"
  tl: "@a@b%a002030：那個士兵\n　　一個人精神飽滿地\n　　把棺材拖走了啊。\n@c0@"
151:
  en: "@a%0%a002050@bIt's good to get rid of that coffin, I tell you!\n@c0@"
  ja: "@a@b%a002050「はあー。\n\tカンオケが　なくなって\n\tせいせい　しました。\n@c0@"
  ko: "@a@b%a002050: 어휴~\n관이 없어지니\n이제 좀 살 것 같은데요.\n@c0@"
  sl: "@a@b%a002050：哈。\n　　没了棺材，\n　　真是轻松多了。\n@c0@"
  tl: "@a@b%a002050：哈。\n　　沒了棺材，\n　　真是輕鬆多了。\n@c0@"
152:
  en: "@a%0%a002000@b...I reckon %a002040 lived up to the hype, aye?\n@c0@"
  ja: "@a@b%a002000「%a002040……\n\tなるほど　うでは　たしかな\n\tやつだったな。\n@c0@"
  ko: "@a@b%a002000: %a002040......\n실력 하나는 확실한\n녀석이었지.\n@c0@"
  sl: "@a@b%a002000：%a002040……\n　　原来如此，\n　　的确是个厉害的家伙啊。\n@c0@"
  tl: "@a@b%a002000：%a002040……\n　　原來如此，\n　　的確是個厲害的傢伙啊。\n@c0@"
153:
  en: "@a%0%a002010@bShall we head back to the castle for now?\n@c0@"
  ja: "@a@b%a002010「とりあえず　私たちも\n\tお城に　もどりましょうか。\n@c0@"
  ko: "@a@b%a002010: 일단 우리도\n성으로 돌아갈까?\n@c0@"
  sl: "@a@b%a002010：总之，\n　　我们也回城去吧。\n@c0@"
  tl: "@a@b%a002010：總之，\n　　我們也回城去吧。\n@c0@"
154:
  en: "@a%0%a002020@bHopefully it's safe enough for them to start working again.\n@c0@"
  ja: "@a@b%a002020「これで　ここも\n\t安心して　工事が　できるね。\n@c0@"
  ko: "@a@b%a002020: 이제 여기도\n안심하고 공사를 할 수 있겠네.\n@c0@"
  sl: "@a@b%a002020：这下子这里\n　　也能放心施工了吧。\n@c0@"
  tl: "@a@b%a002020：這下子這裡\n　　也能放心施工了吧。\n@c0@"
155:
  en: "@a%0%a002030@bThe air is getting fresher by the minute!\n@c0@"
  ja: "@a@b%a002030「ああ　さすがに\n\tここまで　来たら\n\t空気が　おいしくなりましたね。\n@c0@"
  ko: "@a@b%a002030: 아아, 역시\n여기까지 나오니\n공기가 상쾌해졌군요.\n@c0@"
  sl: "@a@b%a002030：啊，\n　　到了这里之后，\n　　空气果然就清新多了呢。\n@c0@"
  tl: "@a@b%a002030：啊，\n　　到了這裡之後，\n　　空氣果然就清新多了呢。\n@c0@"
156:
  en: "@a%0%a002050@bI can't get the image of those monstrous eggs out of my mind...\n@c0@"
  ja: "@a@b%a002050「あの　タマゴから\n\tまものが　かえる姿が　まぶたに\n\tやきついて　はなれません……。\n@c0@"
  ko: "@a@b%a002050: 그 알에서\n마물이 부화하는 장면이\n너무 생생해서 잊혀지질 않네요......\n@c0@"
  sl: "@a@b%a002050：魔物从蛋里出来的\n　　那一幕，现在还在\n　　我脑海中挥之不去……\n@c0@"
  tl: "@a@b%a002050：魔物從蛋里出來的\n　　那一幕，現在還在\n　　我腦海中揮之不去……\n@c0@"
157:
  en: "@a%0%a002000@bThat's what we wanna know.\n@c0@"
  ja: "@a@b%a002000「何者かって……\n\tオレたちだって　知らないよな。\n@c0@"
  ko: "@a@b%a002000: 정체가 뭐냐니......\n거야 우리도 모르지.\n@c0@"
  sl: "@a@b%a002000：他问那是何方神圣……\n　　可咱也不知道啊。\n@c0@"
  tl: "@a@b%a002000：他問那是何方神聖……\n　　可咱也不知道啊。\n@c0@"
158:
  en: "@a%0%a002010@bThat lad is long gone, it would seem.\n@c0@"
  ja: "@a@b%a002010「本人は　もう\n\tこのへんには　いないようね。\n@c0@"
  ko: "@a@b%a002010: 본인은 이미\n이 주변에는 없는 것 같네.\n@c0@"
  sl: "@a@b%a002010：他本人好像\n　　已经不在这里了呢。\n@c0@"
  tl: "@a@b%a002010：他本人好像\n　　已經不在這裡了呢。\n@c0@"
159:
  en: "@a%0%a002020@bI don't know who that blue guy is, but I do know he's got some attitude.\n@c0@"
  ja: "@a@b%a002020「何者かは　知らないけど\n\tどういう性格かは\n\t洞くつの中で　知りつくしたかも。\n@c0@"
