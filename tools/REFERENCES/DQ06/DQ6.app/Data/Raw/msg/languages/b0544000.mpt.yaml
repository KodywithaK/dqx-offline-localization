  sl: "@a@b%a002030：虽然我们\n　　什么都没能做到……\n@c0@"
  tl: "@a@b%a002030：雖然我們\n　　什麼都沒能做到……\n@c0@"
168:
  en: "@a%0%a002030@bIt just saddens me that we do not have a great deal of success to boast of...\n@c0@"
  ja: "@a@b%a002030「王さまや　兵団長に\n\tほうこくを　しないわけには\n\tいきませんから。\n@c0@"
  ko: "@a@b%a002030: 폐하와\n병사단장님께\n보고는 해야겠지요.\n@c0@"
  sl: "@a@b%a002030：还必须\n　　去向国王陛下\n　　和兵团长报告呢。\n@c0@"
  tl: "@a@b%a002030：還必須\n　　去向國王陛下\n　　和兵團長報告呢。\n@c0@"
169:
  en: "@a%0%a002050@bIf we head through here, we can travel up north, right?\n@c0@"
  ja: "@a@b%a002050「ここを　通れば\n\t北がわの　地方に\n\tぬけられるんでしたね。\n@c0@"
  ko: "@a@b%a002050: 여길 지나가면\n북쪽 지방으로\n갈 수 있군요.\n@c0@"
