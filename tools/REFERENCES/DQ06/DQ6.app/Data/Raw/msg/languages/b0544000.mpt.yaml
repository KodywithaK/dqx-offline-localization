  sl: "@a@b%a002020：魔物都是\n　　从蛋里孵出来的吗？！\n　　我还真不知道呢！\n@c0@"
  tl: "@a@b%a002020：魔物都是\n　　從蛋裡孵出來的嗎？！\n　　我還真不知道呢！\n@c0@"
119:
  en: "@a%0%a002030@bHmm... I wonder where that blue-clad swordsman has got to...\n@c0@"
  ja: "@a@b%a002030「それにしても\n\tあの　青い剣士さんは\n\tどこまで　行ったのでしょうね。\n@c0@"
  ko: "@a@b%a002030: 그나저나\n그 파란 옷 검사는\n어디까지 간 걸까요?\n@c0@"
  sl: "@a@b%a002030：不过\n　　那个蓝衣服剑士\n　　到底去哪里了啊。\n@c0@"
  tl: "@a@b%a002030：不過\n　　那個藍衣服劍士\n　　到底去哪裡了啊。\n@c0@"
120:
  en: "@a%0%a002050@bOld %a002050 is feelin' a tad peckish, but he wouldn't much fancy an egg like that...\n@c0@"
  ja: "@a@b%a002050「おなかが　すいても\n\tここの　タマゴだけは\n\t食べたくないですね……。\n@c0@"
  ko: "@a@b%a002050: 배가 고파도\n여기 있는 알만큼은\n먹고 싶지 않군요......\n@c0@"
  sl: "@a@b%a002050：就算再饿，\n　　我也不想吃这里的蛋……\n@c0@"
  tl: "@a@b%a002050：就算再餓，\n　　我也不想吃這裡的蛋……\n@c0@"
121:
  en: "@a%0%a002000@bWhew... We better find the big one or we'll never get out of here.\n@c0@"
  ja: "@a@b%a002000「ふう……。\n\tこりゃ　タマゴを　うんでるやつを\n\t見つけないと　キリがないかもな。\n@c0@"
  ko: "@a@b%a002000: 후우......\n알을 낳고 있는 녀석을\n찾지 못하면 이거 끝이 없겠는걸.\n@c0@"
  sl: "@a@b%a002000：唔……\n　　不找到生这蛋的家伙的话，\n　　没完没了啊。\n@c0@"
  tl: "@a@b%a002000：唔……\n　　不找到生這蛋的傢伙的話，\n　　沒完沒了啊。\n@c0@"
122:
  en: "@a%0%a002010@bWhat kind of monster lays eggs that big...?\n@c0@"
  ja: "@a@b%a002010「こんな　大きな\n\tタマゴを　産む　まものって……。\n@c0@"
  ko: "@a@b%a002010: 이렇게 커다란\n알을 낳는 마물이라니......\n@c0@"
  sl: "@a@b%a002010：生这么大一个蛋的魔物……\n@c0@"
  tl: "@a@b%a002010：生這麼大一個蛋的魔物……\n@c0@"
123:
  en: "@a%0%a002020@bDo you think these eggs hatch all by themselves?\n@c0@"
  ja: "@a@b%a002020「この　タマゴは\n\tほうっておいても　まものに\n\tなっちゃうのかな。\n@c0@"
  ko: "@a@b%a002020: 이 알은\n내버려두면 마물이\n되는 걸까?\n@c0@"
  sl: "@a@b%a002020：要是不管这蛋的话，\n　　它就会变成魔物吧。\n@c0@"
  tl: "@a@b%a002020：要是不管這蛋的話，\n　　它就會變成魔物吧。\n@c0@"
124:
  en: "@a%0%a002030@bFor freshly hatched monsters, they put up quite a fight.\n@c0@"
  ja: "@a@b%a002030「やれやれ……。\n\t生まれたてでも\n\tけっこう　手ごわいですね。\n@c0@"
  ko: "@a@b%a002030: 휴우......\n태어난 직후의 마물도\n상당히 강하군요.\n@c0@"
  sl: "@a@b%a002030：哎呀哎呀……\n　　虽然是刚刚出生的魔物，\n　　也真是难对付啊。\n@c0@"
  tl: "@a@b%a002030：哎呀哎呀……\n　　雖然是剛剛出生的魔物，\n　　也真是難對付啊。\n@c0@"
125:
  en: "@a%0%a002050@bI'm startin' to wonder if I'll ever eat eggs again...\n@c0@"
  ja: "@a@b%a002050「私　タマゴが\n\tキライに　なりそうです……。\n@c0@"
  ko: "@a@b%a002050: 저는 알이\n싫어질 것만 같습니다......\n@c0@"
  sl: "@a@b%a002050：我以后可能会\n　　讨厌蛋这种东西……\n@c0@"
  tl: "@a@b%a002050：我以後可能會\n　　討厭蛋這種東西……\n@c0@"
126:
  en: "@a%0%a002000@bThere he is! You wanna help him out, %a000090? He could use a hand!\n@c0@"
  ja: "@a@b%a002000「アイツだ！\n\tほうって　おけないよな。\n\tいっしょに　戦うか　%a000090！\n@c0@"
  ko: "@a@b%a002000: 녀석이다!\n내버려둘 수 없지.\n같이 싸울까, %a000090!\n@c0@"
  sl: "@a@b%a002000：是那家伙！\n　　不能放他不管啊。\n　　跟他一起打吧，%a000090！\n@c0@"
  tl: "@a@b%a002000：是那傢伙！\n　　不能放他不管啊。\n　　跟他一起打吧，%a000090！\n@c0@"
127:
  en: "@a%0%a002010@bIt's the swordsman in blue!\n@c0@"
  ja: "@a@b%a002010「青い剣士が\n\tもう　まものの前に！\n@c0@"
  ko: "@a@b%a002010: 파란 옷 검사가\n벌써 마물 앞에!\n@c0@"
  sl: "@a@b%a002010：蓝衣服剑士已经\n　　站到魔物跟前了！\n@c0@"
  tl: "@a@b%a002010：藍衣服劍士已經\n　　站到魔物跟前了！\n@c0@"
128:
  en: "@a%0%a002020@bSo %a002040 broke all those eggs? He making an omelette or something? \n@c0@"
  ja: "@a@b%a002020「まわりの　タマゴ\n\tぜんぶ　こわれてる……。\n\t%a002040が　やったのね！\n@c0@"
  ko: "@a@b%a002020: 주변의 알이\n전부 깨져 있어......\n%a002040%F2040%X가%Y이%Z 한 거구나!\n@c0@"
  sl: "@a@b%a002020：周围的蛋都碎了……\n　　是%a002040干的吧！\n@c0@"
  tl: "@a@b%a002020：周圍的蛋都碎了……\n　　是%a002040幹的吧！\n@c0@"
129:
  en: "@a%0%a002030@b%0%a002040 is face-to-face with that enormous monster!\n@c0@"
  ja: "@a@b%a002030「%a002040さんが\n\t巨大な　まものと……！\n@c0@"
  ko: "@a@b%a002030: %a002040 씨가\n거대한 마물과......!\n@c0@"
  sl: "@a@b%a002030：%a002040在跟\n　　巨大的魔物……\n@c0@"
  tl: "@a@b%a002030：%a002040在跟\n　　巨大的魔物……\n@c0@"
130:
  en: "@a%0%a002030@bCome! We must hurry to his aid!\n@c0@"
  ja: "@a@b%a002030「私たちも　行きましょう！\n@c0@"
  ko: "@a@b%a002030: 우리도 갑시다!\n@c0@"
  sl: "@a@b%a002030：我们也去吧！\n@c0@"
  tl: "@a@b%a002030：我們也去吧！\n@c0@"
131:
  en: "@a%0%a002050@bLet's look lively! We don't want to turn up to the party late!\n@c0@"
  ja: "@a@b%a002050「うわあ！\n\t間に合った　というか\n\t間に合わなかった　というか……。\n@c0@"
  ko: "@a@b%a002050: 우와앗!\n늦었다고 해야 할지\n늦지 않았다고 해야 할지......\n@c0@"
  sl: "@a@b%a002050：哇啊！\n　　这是算赶上了，\n　　还是算没赶上啊……\n@c0@"
  tl: "@a@b%a002050：哇啊！\n　　這是算趕上了，\n　　還是算沒趕上啊……\n@c0@"
132:
  en: "@a%0%a002000@bHe likes bein' a solo act, aye?\n@c0@"
  ja: "@a@b%a002000「こいつは　ひとりで\n\tやる気のようだな。\n@c0@"
  ko: "@a@b%a002000: 이 녀석은\n혼자서 싸울 작정인가 보군.\n@c0@"
  sl: "@a@b%a002000：这家伙好像\n　　打算单干啊。\n@c0@"
  tl: "@a@b%a002000：這傢伙好像\n　　打算單幹啊。\n@c0@"
133:
  en: "@a%0%a002010@bDoes he really think he's going to defeat it alone!?\n@c0@"
