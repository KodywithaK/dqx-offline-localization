10:
  en: "@a@b%3O pure-hearted guardians of the gates who masquerade as vassals of the Archfiend!%4\n@c0@"
  ja: "@a@b%3……大魔王の　部下に　身をやつしながら\n聖なる心を　もつ　門番よ……%4\n@c0@"
  ko: "@a@b%3대마왕의 부하 때문에\n몸이 야위어 가면서도\n성스러운 마음을 가진 문지기여......%4\n@c0@"
  sl: "@a@b%3……乔装成大魔王的部下，\n拥有圣洁之心的守门人啊……%4\n@c0@"
