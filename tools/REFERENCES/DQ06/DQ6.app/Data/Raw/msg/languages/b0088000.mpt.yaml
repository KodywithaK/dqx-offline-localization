0:
  en: "@a@b*: You there! How did you get here?\n@c0@"
  ja: "@a@b＊「んー？　なんだ　おぬしらは？\n\tいったい　どうやって　ここへ……\n@c0@"
  ko: "@a@b*: 응? 자네들은 뭔가?\n도대체 어떻게 여기에......\n@c0@"
  sl: "@a@b＊：嗯？你们是什么人？\n　　究竟是怎么来到这里的……\n@c0@"
  tl: "@a@b＊：嗯？你們是什麼人？\n　　究竟是怎麼來到這裡的……\n@c0@"
1:
  en: "@a@b*: ...No, save the explanations. If you're here, you must be angling after a spell in prison.\n@c0@"
  ja: "@a@b＊「フッ……　まあ　よい。　どちらにせよ\n\tよほど　この牢ごくに　入りたくて\n\t来たのであろう。\n@c0@"
  ko: "@a@b*: 흥...... 뭐 좋다. 어느 쪽이든\n이 감옥에 들어가고 싶어\n안달이 나서 왔을 테니까.\n@c0@"
  sl: "@a@b＊：哼……怎么来的都无所谓，\n　　总之，你们是相当地\n　　想进这座牢狱才专门找上门来的吧？\n@c0@"
  tl: "@a@b＊：哼……怎麼來的都無所謂，\n　　總之，你們是相當地\n　　想進這座牢獄才專門找上門來的吧？\n@c0@"
2:
  en: "@a@b*: Well, I could send you to the cells. But I have a far, far better idea...\n@c0@"
  ja: "@a@b＊「おのぞみと　あらば\n\t入れてやっても　よいぞ。\n\tただし……\n@c0@"
  ko: "@a@b*: 원한다면야\n처넣어 줄 수도 있어.\n단......\n@c0@"
  sl: "@a@b＊：要是你们想真想进去的话，\n　　送你们进去也无所谓，\n　　只不过……\n@c0@"
  tl: "@a@b＊：要是你們想真想進去的話，\n　　送你們進去也無所謂，\n　　只不過……\n@c0@"
3:
  en: "@a@b*: ...I'll send you to hell!\n@c0@"
  ja: "@a@b＊「地獄という名の　牢ごくへな！\n@c0@"
  ko: "@a@b*: 지옥이라는 이름의 감옥에 말이지!\n@c0@"
  sl: "@a@b＊：是去那座被称作地狱的牢狱！\n@c0@"
  tl: "@a@b＊：是去那座被稱作地獄的牢獄！\n@c0@"
4:
  en: "@a@b*: Urgh... I am no match for you...\n@c0@"
  ja: "@a@b＊「この私が　かなわぬとは……。\n@c0@"
  ko: "@a@b*: 내가 지다니......\n@c0@"
  sl: "@a@b＊：我竟然会败下阵来……\n@c0@"
  tl: "@a@b＊：我竟然會敗下陣來……\n@c0@"
5:
  en: "@a@b*: Could you be the %H0860%Xwarrior%Ywarriors%Z my brother has awaited? In any case, you may pass.\n@c0@"
  ja: "@a@b＊「もしや　おぬしたちが　私の弟の\n\t待ちのぞんでいた者かも　しれん。\n\tさあ　通るがよい。\n@c0@"
  ko: "@a@b*: 어쩌면 자네들은 내 동생이\n기다리고 있던 자들일지도 모르겠군.\n지나가거라.\n@c0@"
  sl: "@a@b＊：说不定你们正是\n　　我弟弟在等着的人。\n　　好，你们过去吧。\n@c0@"
  tl: "@a@b＊：說不定你們正是\n　　我弟弟在等著的人。\n　　好，你們過去吧。\n@c0@"
6:
  en: "@a@b*: Unbelievable... For a century, my elder brother has stood guard here. And yet you managed to brush him aside...\n@c0@"
  ja: "@a@b＊「ま　まさか……\n\t１００年も　門番を　つとめてきた\n\t私の兄を　たおすとは……。\n@c0@"
  ko: "@a@b*: 서, 설마......\n100년이나 문지기를 했던\n우리 형을 쓰러뜨리다니......\n@c0@"
  sl: "@a@b＊：没、没想到……\n　　我哥哥已经担任了一百年的守门人，\n　　竟然被你们打败……\n@c0@"
  tl: "@a@b＊：沒、沒想到……\n　　我哥哥已經擔任了一百年的守門人，\n　　竟然被你們打敗……\n@c0@"
7:
  en: "@a@b*: Just who are %H0860%Xyou%Yyou people%Z?\n@c0@"
  ja: "@a@b＊「おぬしら　いったい\n\t何者なのだ？\n@c0@"
  ko: "@a@b*: 자네들은 도대체\n정체가 뭐지?\n@c0@"
  sl: "@a@b＊：你们究竟是什么人？\n@c0@"
