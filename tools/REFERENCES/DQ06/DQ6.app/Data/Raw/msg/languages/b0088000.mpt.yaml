11:
  en: "@a@b%3You have long awaited %H0860%X%A0120%Xhe who stands before you. He has%Z%B0120%Xshe who stands before you. She has%Z%Ythose who stand before you. They have%Z come to face the Archfiend.%4\n@c0@"
  ja: "@a@b%3そこにいる者たちこそ　長い間\nそなたの　待ちのぞんでいた\n大魔王の存在を　ゆるがす者……%4\n@c0@"
  ko: "@a@b%3거기 있는 자들이야말로 오랫동안\n그대들이 기다려왔던\n대마왕의 존재를 뒤흔들 자......%4\n@c0@"
  sl: "@a@b%3站在那里的人们，\n正是你在漫长岁月中所等待的\n能够威胁到大魔王存在的人……%4\n@c0@"
  tl: "@a@b%3站在那里的人们，\n正是你在漫长岁月中所等待的\n能够威胁到大魔王存在的人……%4\n@c0@"
12:
  en: "@a@b%3%H0860%X%A0120%XHe who stands before you blazes%Z%B0120%XShe who stands before you blazes%Z%YThose who stand before you blaze%Z with the light that our world craves. Let the gates be opened!%4\n@c0@"
  ja: "@a@b%3さあ　門を開きなさい。\nこの者たちは　必ずや　ひとびとの\n光と　なるでしょう……。%4\n@c0@"
