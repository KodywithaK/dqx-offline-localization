  ja: "@a@b＊「やはり　大賢者の　予言どおり\n\t大魔王さまの存在を　ゆるがす者が\n\t現れたというのか？\n@c0@"
  ko: "@a@b*: 역시 대현자의 예언대로\n대마왕님의 존재를 뒤흔들 자가\n나타났단 말인가?\n@c0@"
  sl: "@a@b＊：难道果真如大贤者所预言的那样，\n　　能够威胁大魔王存在的人\n　　终于出现了吗？\n@c0@"
  tl: "@a@b＊：難道果真如大賢者所預言的那樣，\n　　能夠威脅大魔王存在的人\n　　終於出現了嗎？\n@c0@"
9:
