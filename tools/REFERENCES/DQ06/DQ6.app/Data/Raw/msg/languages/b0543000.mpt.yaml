  ko: "@a@b%a002010: 여러분의 기대에\n부응할 수 있었으면 좋겠네.\n@c0@"
  sl: "@a@b%a002010：不要辜负了\n　　大家的期待啊。\n@c0@"
  tl: "@a@b%a002010：不要辜負了\n　　大家的期待啊。\n@c0@"
223:
  en: "@a%0%a002020@bThat poor monster's in trouble with us on the case.\n@c0@"
  ja: "@a@b%a002020「あたしたち\n\tきっと　倒してくるからね！\n@c0@"
  ko: "@a@b%a002020: 우리\n꼭 쓰러뜨리고 올게!\n@c0@"
  sl: "@a@b%a002020：我们一定\n　　会消灭魔物的！\n@c0@"
  tl: "@a@b%a002020：我們一定\n　　會消滅魔物的！\n@c0@"
224:
  en: "@a%0%a002030@bEveryone is anxiously awaiting news of this monster's defeat.\n@c0@"
  ja: "@a@b%a002030「やはり　みなさん\n\tまものが　退治されるのを\n\t待っているんですね。\n@c0@"
  ko: "@a@b%a002030: 역시 다들\n마물이 퇴치되기만을\n손꼽아 기다리고 있군요.\n@c0@"
  sl: "@a@b%a002030：大家一定\n　　都期待着魔物被消灭\n　　那一天的到来吧。\n@c0@"
  tl: "@a@b%a002030：大家一定\n　　都期待著魔物被消滅\n　　那一天的到來吧。\n@c0@"
225:
  en: "@a%0%a002030@bWhether it is to defeat monsters or to guard the castle, we all have our role to play.\n@c0@"
  ja: "@a@b%a002030「城内の　みまわりも\n\tまもの退治も　どちらも\n\tだいじな仕事ですよね！\n@c0@"
  ko: "@a@b%a002030: 성내 순찰도\n마물 퇴치도 모두\n중요한 임무지요!\n@c0@"
  sl: "@a@b%a002030：城里的巡逻，\n　　还有讨伐魔物，\n　　都是重要的工作呢！\n@c0@"
  tl: "@a@b%a002030：城裡的巡邏，\n　　還有討伐魔物，\n　　都是重要的工作呢！\n@c0@"
226:
  en: "@a%0%a002050@bOld %a002050 has no intention of holdin' back. Let's give this monster what for!\n@c0@"
  ja: "@a@b%a002050「退治されないように\n\tがんばってきます！\n@c0@"
  ko: "@a@b%a002050: 퇴치당하지 않도록\n잘하고 오겠습니다!\n@c0@"
  sl: "@a@b%a002050：我们会努力\n　　不被魔物干掉的！\n@c0@"
  tl: "@a@b%a002050：我們會努力\n　　不被魔物幹掉的！\n@c0@"
227:
  en: "@a%0%a002000@bWas he insultin' us? That went a little over my head...\n@c0@"
  ja: "@a@b%a002000「なにかと\n\tひかん的な　ヤツだな。\n@c0@"
  ko: "@a@b%a002000: 괜히\n비관적인 녀석이구만.\n@c0@"
  sl: "@a@b%a002000：真是个悲观的家伙啊。\n@c0@"
  tl: "@a@b%a002000：真是個悲觀的傢伙啊。\n@c0@"
228:
  en: "@a%0%a002010@bI suppose he has a point...\n@c0@"
  ja: "@a@b%a002010「確かに　兵団長より\n\t強ければ　勝てる　なんていう\n\tかくしょうは　ないわ。\n@c0@"
  ko: "@a@b%a002010: 맞아. 병사단장보다\n강하다고 이길 수 있다는\n보장은 없지.\n@c0@"
  sl: "@a@b%a002010：即使比兵团长厉害，\n　　也不保证一定能\n　　战胜魔物啊。\n@c0@"
  tl: "@a@b%a002010：即使比兵團長厲害，\n　　也不保證一定能\n　　戰勝魔物啊。\n@c0@"
229:
  en: "@a%0%a002010@bWell, let's just make sure that we stay focused.\n@c0@"
  ja: "@a@b%a002010「気を　ひきしめて\n\tいきましょうね。\n@c0@"
  ko: "@a@b%a002010: 긴장의 끈을\n늦추지 말자.\n@c0@"
  sl: "@a@b%a002010：大家要谨慎行事。\n@c0@"
  tl: "@a@b%a002010：大家要謹慎行事。\n@c0@"
230:
  en: "@a%0%a002020@bWhat's wrong with a little optimism?\n@c0@"
  ja: "@a@b%a002020「さめた　ことをいう\n\t人だわね……。\n@c0@"
  ko: "@a@b%a002020: 분위기 깨는\n소릴 하네......\n@c0@"
  sl: "@a@b%a002020：这人说话\n　　真会泼冷水呢……\n@c0@"
  tl: "@a@b%a002020：這人說話\n　　真會潑冷水呢……\n@c0@"
231:
  en: "@a%0%a002030@bWell, that can be said to be true.\n@c0@"
  ja: "@a@b%a002030「まあ　ある意味\n\tしんじつですね。\n@c0@"
  ko: "@a@b%a002030: 뭐, 어느 정도\n맞는 말이기도 하지요.\n@c0@"
  sl: "@a@b%a002030：唉，某种意义上\n　　说的也是事实呢。\n@c0@"
  tl: "@a@b%a002030：唉，某種意義上\n　　說的也是事實呢。\n@c0@"
232:
  en: "@a%0%a002050@bWell, we've got more chance than some wimp who couldn't even beat Commander Brutus!\n@c0@"
  ja: "@a@b%a002050「少なくとも　兵団長より\n\t弱い人が　勝てる　可能性よりは\n\tずっと　マシですよね！\n@c0@"
  ko: "@a@b%a002050: 적어도 병사단장님보다\n약한 사람이 이길 가능성보단\n훨씬 높겠죠!\n@c0@"
  sl: "@a@b%a002050：至少比起那些\n　　不如兵团长厉害的人，\n　　打赢的可能性要高得多吧！\n@c0@"
  tl: "@a@b%a002050：至少比起那些\n　　不如兵團長厲害的人，\n　　打贏的可能性要高得多吧！\n@c0@"
233:
  en: "@a%0%a002000@bUh...aye.\n@c0@"
  ja: "@a@b%a002000「うーん……。\n@c0@"
  ko: "@a@b%a002000: 으음......\n@c0@"
  sl: "@a@b%a002000：唔……\n@c0@"
  tl: "@a@b%a002000：唔……\n@c0@"
234:
  en: "@a%0%a002010@bAww. His father put up a good fight!\n@c0@"
  ja: "@a@b%a002010「そうね。\n\tブラストさんは　本当に\n\t強かったものね。\n@c0@"
  ko: "@a@b%a002010: 그래.\n블래스트 씨는 아주\n강했지.\n@c0@"
  sl: "@a@b%a002010：是啊。\n　　布拉斯特真的很厉害呢。\n@c0@"
  tl: "@a@b%a002010：是啊。\n　　布拉斯特真的很厲害呢。\n@c0@"
235:
  en: "@a%0%a002020@bI feel bad for the kid, but it's not like we were cheating or anything!\n@c0@"
  ja: "@a@b%a002020「あたしたち\n\tべつに　ずるしたわけじゃ\n\tないんだけどねー。\n@c0@"
  ko: "@a@b%a002020: 우리가\n딱히 속임수를 쓴 것도\n아니라구~\n@c0@"
  sl: "@a@b%a002020：我们可\n　　没有作弊啊。\n@c0@"
  tl: "@a@b%a002020：我們可\n　　沒有作弊啊。\n@c0@"
236:
  en: "@a%0%a002030@bPerhaps he is correct, perhaps he is not...\n@c0@"
  ja: "@a@b%a002030「そうかも　しれませんし\n\tそうでないかも　しれませんね。\n@c0@"
  ko: "@a@b%a002030: 그럴 수도 있고\n아닐 수도 있지요.\n@c0@"
  sl: "@a@b%a002030：说不定是这样，\n　　也说不定不是这样。\n@c0@"
  tl: "@a@b%a002030：說不定是這樣，\n　　也說不定不是這樣。\n@c0@"
237:
  en: "@a%0%a002050@bTo be honest, I doubt I'd be able to beat Brutus if I was all on my lonesome.\n@c0@"
  ja: "@a@b%a002050「しょうじき　いって\n\tきっと　私　ひとりだったら\n\t勝てませんでしたね。\n@c0@"
  ko: "@a@b%a002050: 솔직히 말해서\n저 혼자였다면 분명히\n못 이겼을 겁니다.\n@c0@"
  sl: "@a@b%a002050：老实说，\n　　要是只有我一人的话，\n　　一定打不过的。\n@c0@"
  tl: "@a@b%a002050：老實說，\n　　要是只有我一人的話，\n　　一定打不過的。\n@c0@"
238:
  en: "@a%0%a002000@bHardy har! That kid is the king of excuses, aye?\n@c0@"
  ja: "@a@b%a002000「うーん\n\tああいえば　こういう……。\n\tま　子供らしくて　いいけどな。\n@c0@"
  ko: "@a@b%a002000: 으음,\n말을 금방 바꾸다니......\n뭐, 어린애다워서 좋긴 하지만.\n@c0@"
  sl: "@a@b%a002000：嗯。\n　　要这么说的话这种事情……\n　　唉，童言无忌啊。\n@c0@"
  tl: "@a@b%a002000：嗯。\n　　要這麼說的話這種事情……\n　　唉，童言無忌啊。\n@c0@"
239:
  en: "@a%0%a002010@bI'm rather touched by the pride he has in his father...\n@c0@"
  ja: "@a@b%a002010「お父さんのことが\n\t大好きで　ほこりに　思っていて……\n\tすてきな　親子かんけいね。\n@c0@"
  ko: "@a@b%a002010: 아빠를 정말 좋아하고\n자랑스럽게 생각하는 아들......\n멋진 아빠와 아들인걸.\n@c0@"
  sl: "@a@b%a002010：他这么喜欢自己的父亲，\n　　为父亲感到骄傲呢……\n　　父子关系真好啊。\n@c0@"
  tl: "@a@b%a002010：他這麼喜歡自己的父親，\n　　為父親感到驕傲呢……\n　　父子關係真好啊。\n@c0@"
240:
  en: "@a%0%a002020@bI, uh, don't think he had a runny nose, no...\n@c0@"
  ja: "@a@b%a002020「鼻水は\n\t出てなかったと　思うけど……。\n@c0@"
  ko: "@a@b%a002020: 콧물은\n안 났는데......\n@c0@"
  sl: "@a@b%a002020：鼻涕什么的\n　　才没有流呢……\n@c0@"
  tl: "@a@b%a002020：鼻涕什麼的\n　　才沒有流呢……\n@c0@"
241:
  en: "@a%0%a002030@bThe poor child cannot yet accept his father's defeat...\n@c0@"
  ja: "@a@b%a002030「まあ　みとめたくは\n\tないでしょうね。\n@c0@"
  ko: "@a@b%a002030: 뭐, 인정하고 싶지\n않겠지요.\n@c0@"
  sl: "@a@b%a002030：唉，\n　　他不想承认现实啊。\n@c0@"
  tl: "@a@b%a002030：唉，\n　　他不想承認現實啊。\n@c0@"
242:
  en: "@a%0%a002050@bThe lad's father was gracious in defeat. He could learn a lot from his old man's example.\n@c0@"
  ja: "@a@b%a002050「お父さんのように\n\tたとえ　負けても　どうどうと\n\tしている人に　なってほしいです！\n@c0@"
  ko: "@a@b%a002050: 아버지처럼 설령 패배해도\n당당한 태도를 유지할 수 있는\n사람이 되어 줬으면 좋겠군요!\n@c0@"
  sl: "@a@b%a002050：真希望他能\n　　像他父亲一样，\n　　输了也能痛痛快快地承认啊。\n@c0@"
  tl: "@a@b%a002050：真希望他能\n　　像他父親一樣，\n　　輸了也能痛痛快快地承認啊。\n@c0@"
243:
  en: "@a%0%a002000@bWhoa — these guys're still out o' commission?\n@c0@"
  ja: "@a@b%a002000「この人たちの　ケガは\n\tまだ　なおらないようだな。\n@c0@"
  ko: "@a@b%a002000: 이 사람의 상처는\n아직 낫지 않은 모양이군.\n@c0@"
  sl: "@a@b%a002000：这些人的伤\n　　还没有好呢。\n@c0@"
  tl: "@a@b%a002000：這些人的傷\n　　還沒有好呢。\n@c0@"
244:
  en: "@a%0%a002010@bOh dear, I hope they'll be back in action before long.\n@c0@"
  ja: "@a@b%a002010「はやく　仕事に\n\tもどれるように　なると\n\tいいわね。\n@c0@"
  ko: "@a@b%a002010: 어서 업무에\n복귀할 수 있게\n되었으면 좋겠네.\n@c0@"
  sl: "@a@b%a002010：要是能快点养好伤，\n　　回到工作岗位上\n　　就好了。\n@c0@"
  tl: "@a@b%a002010：要是能快點養好傷，\n　　回到工作崗位上\n　　就好了。\n@c0@"
245:
  en: "@a%0%a002020@bWow! That %a002040 guy must have done a real number on these two!\n@c0@"
  ja: "@a@b%a002020「そういえば　この人たち\n\tあの　%a002040とかいう　若い剣士に\n\tやられたのよね。　すごいわねー。\n@c0@"
  ko: "@a@b%a002020: 그러고 보니 이 사람들\n그 %a002040인가 하는 젊은 검사에게\n당했었지. 대단하네~\n@c0@"
  sl: "@a@b%a002020：话说回来，这些人都被\n　　那个叫%a002040的年轻剑士\n　　打败了呢。真厉害。\n@c0@"
  tl: "@a@b%a002020：話說回來，這些人都被\n　　那個叫%a002040的年輕劍士\n　　打敗了呢。真厲害。\n@c0@"
246:
  en: "@a%0%a002030@bSo these are the soldiers left licking their wounds after the last gladiatorial contest...\n@c0@"
  ja: "@a@b%a002030「試合で　ケガをした\n\t兵士の　みなさんですね。\n@c0@"
  ko: "@a@b%a002030: 시합에서 부상당한\n병사 여러분이군요.\n@c0@"
  sl: "@a@b%a002030：这些士兵是在\n　　比试的时候受伤的吧。\n@c0@"
  tl: "@a@b%a002030：這些士兵是在\n　　比試的時候受傷的吧。\n@c0@"
247:
  en: "@a%0%a002050@bI take my helmet off to these lads.\n@c0@"
  ja: "@a@b%a002050「ほんとに\n\t兵士の　仕事は\n\t命がけ　ですねえ。\n@c0@"
  ko: "@a@b%a002050: 정말\n병사는 목숨을 걸고\n일해야 하는군요.\n@c0@"
  sl: "@a@b%a002050：士兵的差事\n　　真的是命悬一线呢。\n@c0@"
  tl: "@a@b%a002050：士兵的差事\n　　真的是命懸一線呢。\n@c0@"
248:
  en: "@a%0%a002000@bAnyone who beat Brutus should have no trouble with run-o'-the-mill monsters.\n@c0@"
  ja: "@a@b%a002000「兵団長に　勝てれば\n\tまものにも　勝てるぞ。\n\tがんばれよ！\n@c0@"
  ko: "@a@b%a002000: 병사단장을 이기면\n마물에게도 이길 수 있지.\n열심히 해라!\n@c0@"
  sl: "@a@b%a002000：要是战胜了兵团长的话，\n　　魔物也不在话下了。\n　　加油吧！\n@c0@"
  tl: "@a@b%a002000：要是戰勝了兵團長的話，\n　　魔物也不在話下了。\n　　加油吧！\n@c0@"
249:
  en: "@a%0%a002010@bHe certainly has enough spirit to become Commander.\n@c0@"
  ja: "@a@b%a002010「そうとう　気合が\n\t入ってるみたいね。\n@c0@"
  ko: "@a@b%a002010: 의욕이\n대단한걸.\n@c0@"
  sl: "@a@b%a002010：士气高涨了呢。\n@c0@"
  tl: "@a@b%a002010：士氣高漲了呢。\n@c0@"
250:
  en: "@a%0%a002020@bWatching us fight must've lit a fire in him, huh?\n@c0@"
  ja: "@a@b%a002020「あたしたちの\n\t戦いぶりに　だいぶ\n\tシゲキされたんじゃない？\n@c0@"
  ko: "@a@b%a002020: 우리가\n싸우는 거 보고 엄청\n자극 받은 거 아냐?\n@c0@"
  sl: "@a@b%a002020：看到我们\n　　战斗的样子，\n　　被深深刺激到了吧？\n@c0@"
  tl: "@a@b%a002020：看到我們\n　　戰鬥的樣子，\n　　被深深刺激到了吧？\n@c0@"
251:
  en: "@a%0%a002030@bThat soldier burns with an admirable ambition.\n@c0@"
  ja: "@a@b%a002030「自分には　ムリ……と\n\t決めつけずに　がんばるのは\n\tよいことですね。\n@c0@"
  ko: "@a@b%a002030: 자기는 못한다고\n단정 짓지 않고 열심히 하는 건\n좋은 일이지요.\n@c0@"
  sl: "@a@b%a002030：这种不轻易认定\n　　自己的极限，为了变强而不断努力的\n　　心态真是值得赞许。\n@c0@"
  tl: "@a@b%a002030：這種不輕易認定\n　　自己的極限，為了變強而不斷努力的\n　　心態真是值得贊許。\n@c0@"
252:
  en: "@a%0%a002050@bI wish that fellow luck!\n@c0@"
  ja: "@a@b%a002050「いやー\n\tすごい　野望ですねー。\n@c0@"
  ko: "@a@b%a002050: 이야~\n대단한 야망이군요~\n@c0@"
  sl: "@a@b%a002050：哎呀，\n　　野心真大呢。\n@c0@"
  tl: "@a@b%a002050：哎呀，\n　　野心真大呢。\n@c0@"
253:
  en: "@a%0%a002000@bAt least he's honest.\n@c0@"
  ja: "@a@b%a002000「さばさばしてて\n\t男らしい人だな。\n@c0@"
  ko: "@a@b%a002000: 시원시원하고\n남자다운 사람이군.\n@c0@"
  sl: "@a@b%a002000：这人真爽快！\n　　够爷们！\n@c0@"
  tl: "@a@b%a002000：這人真爽快！\n　　夠爺們！\n@c0@"
254:
  en: "@a%0%a002010@bHe's gracious even in defeat — the mark of a true commander.\n@c0@"
  ja: "@a@b%a002010「負けても　いさぎよい。\n\tさすが　上に立つ人は\n\tちがうのね。\n@c0@"
  ko: "@a@b%a002010: 패배를 깨끗이 인정했어.\n역시 저 정도 위치에 있는 사람은\n뭔가 다르구나.\n@c0@"
  sl: "@a@b%a002010：即使输了\n　　也这么爽快。\n　　真不愧是统帅千军的人啊。\n@c0@"
  tl: "@a@b%a002010：即使輸了\n　　也這麼爽快。\n　　真不愧是統帥千軍的人啊。\n@c0@"
255:
  en: "@a%0%a002020@bTee hee! He seems to be taking it well.\n@c0@"
  ja: "@a@b%a002020「さすが！　負けても\n\t根に　もたない　人なのね。\n@c0@"
  ko: "@a@b%a002020: 대단한걸! 졌다고\n원망하지 않는 사람인가 봐.\n@c0@"
  sl: "@a@b%a002020：真不愧是兵团长！\n　　即使输了也这么痛快！\n@c0@"
  tl: "@a@b%a002020：真不愧是兵團長！\n　　即使輸了也這麼痛快！\n@c0@"
256:
  en: "@a%0%a002030@bIt's good to see that only the Commander's pride has been wounded.\n@c0@"
  ja: "@a@b%a002030「負けても　むしろ\n\tよろこんで　いらっしゃる……\n\tどりょうの　広い方ですねえ。\n@c0@"
  ko: "@a@b%a002030: 졌는데도 오히려\n기뻐하고 있다니......\n도량이 넓은 분이군요.\n@c0@"
  sl: "@a@b%a002030：输了反而\n　　这么高兴……\n　　真是个心胸宽广的人啊。\n@c0@"
  tl: "@a@b%a002030：輸了反而\n　　這麼高興……\n　　真是個心胸寬廣的人啊。\n@c0@"
257:
  en: "@a%0%a002050@bWith a fine, upstanding fellow like Brutus in charge, it's no wonder the troops' morale is sky high.\n@c0@"
  ja: "@a@b%a002050「こういう　人になら\n\t兵士たちも　よろこんで\n\tついて　いくでしょうねえ。\n@c0@"
  ko: "@a@b%a002050: 이런 사람 밑이라면\n병사들도 기꺼이\n따라가겠군요.\n@c0@"
  sl: "@a@b%a002050：士兵们\n　　都乐意追随这样的人吧。\n@c0@"
  tl: "@a@b%a002050：士兵們\n　　都樂意追隨這樣的人吧。\n@c0@"
258:
  en: "@a%0%a002000@bAye. The King first, then.\n@c0@"
  ja: "@a@b%a002000「まずは　王さまらしいぞ。\n@c0@"
  ko: "@a@b%a002000: 우선 왕을 만나라는군.\n@c0@"
  sl: "@a@b%a002000：首先好像要去见国王陛下。\n@c0@"
  tl: "@a@b%a002000：首先好像要去見國王陛下。\n@c0@"
259:
  en: "@a%0%a002010@bI sense that the Chancellor would like to speak to us later as well.\n@c0@"
  ja: "@a@b%a002010「あとで　大臣からも\n\tなにか　お話が　ありそうね。\n@c0@"
  ko: "@a@b%a002010: 나중에 대신님에게서도\n뭔가 이야기가 있을 것 같아.\n@c0@"
  sl: "@a@b%a002010：在那之后\n　　大臣好像也有话要说。\n@c0@"
  tl: "@a@b%a002010：在那之後\n　　大臣好像也有話要說。\n@c0@"
260:
  en: "@a%0%a002020@bHey, um, any idea why that guy has a coffin with him?\n@c0@"
  ja: "@a@b%a002020「ねえねえ……\n\tなんで　この人　カンオケなんか\n\t持っているのかしらね。\n@c0@"
  ko: "@a@b%a002020: 저기......\n왜 이 사람이 관을\n들고 있는 걸까?\n@c0@"
  sl: "@a@b%a002020：喂喂……\n　　为什么这个人\n　　会有棺材啊？\n@c0@"
  tl: "@a@b%a002020：喂喂……\n　　為什麼這個人\n　　會有棺材啊？\n@c0@"
261:
  en: "@a%0%a002030@bLet us do as the Chancellor suggests.\n@c0@"
  ja: "@a@b%a002030「大臣の　おおせの\n\tままに　いたしましょう……。\n@c0@"
  ko: "@a@b%a002030: 대신님 말씀을\n따르도록 하지요......\n@c0@"
  sl: "@a@b%a002030：就按大臣说的做吧……\n@c0@"
  tl: "@a@b%a002030：就按大臣說的做吧……\n@c0@"
262:
  en: "@a%0%a002050@bTime to see the King? Old %a002050 is all at sixes and sevens...\n@c0@"
  ja: "@a@b%a002050「ドキドキ……。\n\tそれでは　王さまの　前に\n\tいって　みましょう！\n@c0@"
  ko: "@a@b%a002050: 두근두근......\n그럼 폐하 앞으로\n가 보죠!\n@c0@"
  sl: "@a@b%a002050：好紧张……\n　　去面见国王陛下吧！\n@c0@"
  tl: "@a@b%a002050：好緊張……\n　　去面見國王陛下吧！\n@c0@"
263:
  en: "@a%0%a002000@bHardy har! An order from the Queen, aye?\n@c0@"
  ja: "@a@b%a002000「てへ……。\n\tおねがい　されちまったよ。\n@c0@"
  ko: "@a@b%a002000: 헤헷......\n부탁하시는걸.\n@c0@"
  sl: "@a@b%a002000：诶……\n　　国王陛下拜托咱帮忙啊。\n@c0@"
  tl: "@a@b%a002000：誒……\n　　國王陛下拜託咱幫忙啊。\n@c0@"
264:
  en: "@a%0%a002010@bI'm always impressed by the Queen's elegance.\n@c0@"
  ja: "@a@b%a002010「いつ　見ても\n\t気品があって　落ちついていて\n\tすてきな　王妃さまね。\n@c0@"
  ko: "@a@b%a002010: 언제 봐도\n차분하고 기품이 넘치는\n훌륭한 왕비님이네.\n@c0@"
  sl: "@a@b%a002010：王妃殿下\n　　一直都这般高贵典雅，\n　　沉着冷静呢。\n@c0@"
  tl: "@a@b%a002010：王妃殿下\n　　一直都這般高貴典雅，\n　　沉著冷靜呢。\n@c0@"
265:
  en: "@a%0%a002020@bIf it's monsters that need slaying, then %a002020's your gal!\n@c0@"
  ja: "@a@b%a002020「まもの退治のことなら\n\tおまかせだわよね！\n@c0@"
  ko: "@a@b%a002020: 마물 퇴치라면\n우리 전문이잖아!\n@c0@"
  sl: "@a@b%a002020：消灭魔物这种事情，\n　　就交给我们吧！\n@c0@"
  tl: "@a@b%a002020：消滅魔物這種事情，\n　　就交給我們吧！\n@c0@"
266:
  en: "@a%0%a002030@bThe Queen has a deeply admirable dignity.\n@c0@"
  ja: "@a@b%a002030「王さま思いの\n\tすてきな　王妃さまですね。\n@c0@"
  ko: "@a@b%a002030: 폐하를 생각하는\n멋진 왕비님이군요.\n@c0@"
  sl: "@a@b%a002030：王妃殿下在为国王陛下\n　　着想呢，真了不起。\n@c0@"
  tl: "@a@b%a002030：王妃殿下在為國王陛下\n　　著想呢，真了不起。\n@c0@"
267:
  en: "@a%0%a002050@bI'll bet that once upon a time, the Queen was really...\n@c0@"
  ja: "@a@b%a002050「いやー　王妃さま\n\t昔は　さぞかし……\n@c0@"
  ko: "@a@b%a002050: 이야~ 왕비님,\n왕년에는 정말......\n@c0@"
  sl: "@a@b%a002050：哎呀，王妃殿下\n　　过去想必是……\n@c0@"
  tl: "@a@b%a002050：哎呀，王妃殿下\n　　過去想必是……\n@c0@"
268:
  en: "@a%0%a002050@b...Er, really young!\n@c0@"
  ja: "@a@b%a002050「あ　いえ…\n\t昔は　さぞかし……\n\tお若かったでしょうね！\n@c0@"
  ko: "@a@b%a002050: 아, 그러니까...\n왕년에는 정말......\n젊으셨겠네요!\n@c0@"
  sl: "@a@b%a002050：啊，不……\n　　过去想必是……\n　　非常年轻吧！\n@c0@"
  tl: "@a@b%a002050：啊，不……\n　　過去想必是……\n　　非常年輕吧！\n@c0@"
269:
  en: "@a%0%a002000@bA sunderbolt blade, aye? That ain't no useless knick-knack! I'm really rarin' to go now!\n@c0@"
  ja: "@a@b%a002000「ほうびは　王家の家宝！？\n\tがぜん　やる気が　出てきたぜ！\n@c0@"
  ko: "@a@b%a002000: 포상으로 왕가의 보물을!?\n갑자기 의욕이 샘솟는군!\n@c0@"
  sl: "@a@b%a002000：奖赏是王家的宝物？！\n　　俺忽然来干劲了！\n@c0@"
  tl: "@a@b%a002000：獎賞是王家的寶物？！\n　　俺忽然來幹勁了！\n@c0@"
270:
  en: "@a%0%a002010@bI can sense the King's sincerity. We won't let him down, will we, %a000090?\n@c0@"
  ja: "@a@b%a002010「ここまで　するのは\n\t王さまも　かなりの　本気なのね。\n\tがんばって　まものをたおしましょう！\n@c0@"
  ko: "@a@b%a002010: 이렇게까지 할 정도면\n폐하도 정말 급하신 거야.\n최선을 다해 마물을 쓰러뜨리자!\n@c0@"
  sl: "@a@b%a002010：能够做到这一步，\n　　国王陛下一定是相当认真的吧。\n　　加油消灭魔物吧！\n@c0@"
  tl: "@a@b%a002010：能夠做到這一步，\n　　國王陛下一定是相當認真的吧。\n　　加油消滅魔物吧！\n@c0@"
271:
  en: "@a%0%a002020@bThe sunderbolt blade, huh? Even the name is deadly!\n@c0@"
  ja: "@a@b%a002020「雷鳴の剣かあ。\n\t早く　見てみたいな！\n@c0@"
  ko: "@a@b%a002020: 우렛소리 검이라~\n빨리 보고 싶네!\n@c0@"
  sl: "@a@b%a002020：雷鸣之剑啊。\n　　真想快点见识一下呢！\n@c0@"
  tl: "@a@b%a002020：雷鳴之劍啊。\n　　真想快點見識一下呢！\n@c0@"
272:
  en: "@a%0%a002030@bThe sunderbolt blade sounds like no ordinary sword.\n@c0@"
  ja: "@a@b%a002030「王家に　代々伝わる\n\t雷鳴の剣ですか……。\n\tまた　すごい　ごほうびですね。\n@c0@"
  ko: "@a@b%a002030: 왕가에 대대로 전해지는\n우렛소리 검 말입니까......\n이건 엄청난 포상이군요.\n@c0@"
  sl: "@a@b%a002030：王家代代相传的\n　　雷鸣之剑……\n　　真是不得了的奖赏呢。\n@c0@"
  tl: "@a@b%a002030：王家代代相傳的\n　　雷鳴之劍……\n　　真是不得了的獎賞呢。\n@c0@"
273:
  en: "@a%0%a002050@bI never thought we'd have to drag round a monster's corpse. It fair gives me the willies!\n@c0@"
  ja: "@a@b%a002050「まものの　死がいを\n\t運ぶのは　あまり　気持ちの\n\tいいもんじゃないですね……。\n@c0@"
  ko: "@a@b%a002050: 마물의 시체를\n옮기는 건 별로\n기분 좋은 일이 아니네요......\n@c0@"
  sl: "@a@b%a002050：搬运魔物尸体，\n　　好恶心……\n@c0@"
  tl: "@a@b%a002050：搬運魔物屍體，\n　　好噁心……\n@c0@"
274:
  en: "@a%0%a002000@bThat coffin looks pretty heavy, aye?\n@c0@"
  ja: "@a@b%a002000「重そうな\n\tカンオケだなあ……。\n@c0@"
  ko: "@a@b%a002000: 무거워 보이는\n관이로군......\n@c0@"
  sl: "@a@b%a002000：这棺材\n　　看起来不轻啊……\n@c0@"
  tl: "@a@b%a002000：這棺材\n　　看起來不輕啊……\n@c0@"
275:
  en: "@a%0%a002000@bAnyway, let's shove off.\n@c0@"
  ja: "@a@b%a002000「まあ　とにかく\n\tとっとと　出発しようぜ！\n@c0@"
  ko: "@a@b%a002000: 뭐, 어쨌든\n어서 출발하자고!\n@c0@"
  sl: "@a@b%a002000：哎，总之\n　　咱赶紧出发吧！\n@c0@"
  tl: "@a@b%a002000：哎，總之\n　　咱趕緊出發吧！\n@c0@"
276:
  en: "@a%0%a002010@bWe're all set. Let's hurry to Wayfarer's Pass!\n@c0@"
  ja: "@a@b%a002010「さあ　じゅんびは\n\tととのったわ。\n\t旅人の洞くつへ　急ぎましょう！\n@c0@"
  ko: "@a@b%a002010: 이제 준비는\n다 됐어.\n여행자의 동굴로 어서 가자!\n@c0@"
  sl: "@a@b%a002010：做好准备了呢。\n　　赶紧去旅行者洞窟吧！\n@c0@"
  tl: "@a@b%a002010：做好準備了呢。\n　　趕緊去旅行者洞窟吧！\n@c0@"
277:
  en: "@a%0%a002020@bI'm glad they're entrusting us with this mission and all...\n@c0@"
  ja: "@a@b%a002020「まもの退治は\n\tいいけれど……\n@c0@"
  ko: "@a@b%a002020: 마물 퇴치를\n하는 건 좋은데......\n@c0@"
  sl: "@a@b%a002020：讨伐魔物倒是没问题……\n@c0@"
  tl: "@a@b%a002020：討伐魔物倒是沒問題……\n@c0@"
278:
  en: "@a%0%a002020@bBut I'm not too crazy about hauling this coffin around, you know?\n@c0@"
  ja: "@a@b%a002020「カンオケを　引いた\n\tこの　すがた……\n\tあまり　オシャレじゃないかもー！\n@c0@"
  ko: "@a@b%a002020: 관을 끌고 가는\n이 모습......\n별로 멋있지 않다구~!\n@c0@"
  sl: "@a@b%a002020：要我们拖个棺材……\n　　这副样子太难看了！\n@c0@"
  tl: "@a@b%a002020：要我們拖個棺材……\n　　這副樣子太難看了！\n@c0@"
279:
  en: "@a%0%a002030@bI was expecting something special, but this looks like any other coffin to me...\n@c0@"
  ja: "@a@b%a002030「これが\n\t特製カンオケですか……。\n\t見た目は　どれも　同じですね。\n@c0@"
  ko: "@a@b%a002030: 이게\n특제 관입니까......\n겉보기엔 다를 게 없네요.\n@c0@"
  sl: "@a@b%a002030：这就是\n　　特制棺材啊……\n　　外表看上去每个都一样呢。\n@c0@"
  tl: "@a@b%a002030：這就是\n　　特製棺材啊……\n　　外表看上去每個都一樣呢。\n@c0@"
280:
  en: "@a%0%a002050@bWe can't let that lad in blue snatch the prize from under our noses!\n@c0@"
  ja: "@a@b%a002050「早く　行かないと\n\t青い剣士に　ごほうびを\n\t取られてしまいますよ！\n@c0@"
