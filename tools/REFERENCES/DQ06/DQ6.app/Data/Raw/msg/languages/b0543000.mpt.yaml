  sl: "@a@b%a002030：好像在这里\n　　等了很久了呢。\n@c0@"
  tl: "@a@b%a002030：好像在這裡\n　　等了很久了呢。\n@c0@"
90:
  en: "@a%0%a002050@bThat fellow looks knackered and he hasn't even lifted a finger!\n@c0@"
  ja: "@a@b%a002050「この人　すでに\n\tなんだか　つかれた顔を\n\tしてますね……。\n@c0@"
  ko: "@a@b%a002050: 이 사람, 벌써\n지친 듯한 표정을\n짓고 있네요......\n@c0@"
  sl: "@a@b%a002050：这个人看上去\n　　已经一脸疲倦了呢……\n@c0@"
  tl: "@a@b%a002050：這個人看上去\n　　已經一臉疲倦了呢……\n@c0@"
91:
  en: "@a%0%a002000@bA big hole, aye? Wanna give it a look, %a000090?\n@c0@"
  ja: "@a@b%a002000「大きな穴ねえ。\n\t%a000090　見てみるか。\n@c0@"
  ko: "@a@b%a002000: 큰 구멍이라.\n%a000090, 보고 올까?\n@c0@"
  sl: "@a@b%a002000：大洞啊。\n　　去看看吧，%a000090。\n@c0@"
  tl: "@a@b%a002000：大洞啊。\n　　去看看吧，%a000090。\n@c0@"
92:
  en: "@a%0%a002010@bMonsters appearing from a hole... Let's go and have a look, %a000090. I'm getting curious.\n@c0@"
  ja: "@a@b%a002010「まものが　出てくる　穴……\n\t%a000090　行ってみましょう。\n\t私も　見てみたいわ。\n@c0@"
  ko: "@a@b%a002010: 마물이 나오는 구멍......\n%a000090, 가 보자.\n나도 보고 싶어.\n@c0@"
  sl: "@a@b%a002010：有魔物出没的洞穴……\n　　%a000090，去看看吧，\n　　我也想去见识一下呢。\n@c0@"
  tl: "@a@b%a002010：有魔物出沒的洞穴……\n　　%a000090，去看看吧，\n　　我也想去見識一下呢。\n@c0@"
93:
  en: "@a%0%a002020@bHow big a hole are we talking about here?\n@c0@"
  ja: "@a@b%a002020「どのぐらいの\n\t大きさの　穴なのかしら。\n@c0@"
  ko: "@a@b%a002020: 어느 정도로\n큰 구멍일까?\n@c0@"
  sl: "@a@b%a002020：到底那洞\n　　有多大呢？\n@c0@"
  tl: "@a@b%a002020：到底那洞\n　　有多大呢？\n@c0@"
94:
  en: "@a%0%a002030@bWe must not rely on eyewitness accounts. We need to see this for ourselves.\n@c0@"
  ja: "@a@b%a002030「話だけだと\n\tいまひとつ　現場の　ようすが\n\tわからないですね。\n@c0@"
  ko: "@a@b%a002030: 말만 들어서는\n현장의 분위기를\n전혀 모르겠네요.\n@c0@"
  sl: "@a@b%a002030：仅凭这些话，\n　　目前还无法判断\n　　那里状况到底是怎样呢。\n@c0@"
