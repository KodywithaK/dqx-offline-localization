  tl: "@a@b%a002020：話說回來，\n　　城裡好像有人說過\n　　洞窟裡發生了地震吧。\n@c0@"
74:
  en: "@a%0%a002030@bNow I see. This must be Wayfarer's Pass.\n@c0@"
