  sl: "@a@b%a002050：再不快点走的话，\n　　奖赏会被那个蓝衣服的剑士\n　　抢先拿走哦！\n@c0@"
  tl: "@a@b%a002050：再不快點走的話，\n　　獎賞會被那個藍衣服的劍士\n　　搶先拿走哦！\n@c0@"
281:
  en: "@a%0%a002000@bI'd be up for teamin' up if he was. Either way, let's shove off!\n@c0@"
  ja: "@a@b%a002000「協力するかどうかは\n\t相手しだいだよな。\n\tま　とにかく　行こうぜ！\n@c0@"
  ko: "@a@b%a002000: 힘을 합칠 수 있을지는\n상대가 어떻게 나오느냐에 따라 다르겠지.\n아무튼 가 보자고!\n@c0@"
  sl: "@a@b%a002000：咱要不要帮忙，\n　　还得看对方的意见呢。\n　　哎，总之先走吧！\n@c0@"
  tl: "@a@b%a002000：咱要不要幫忙，\n　　還得看對方的意見呢。\n　　哎，總之先走吧！\n@c0@"
282:
  en: "@a%0%a002010@bWe don't have a moment to spare. Let's head off, %a000090.\n@c0@"
  ja: "@a@b%a002010「一刻も　早く\n\t出発したほうが　よさそうね。\n@c0@"
  ko: "@a@b%a002010: 한시라도 빨리\n출발하는 게 좋겠어.\n@c0@"
  sl: "@a@b%a002010：别耽误时间，\n　　赶紧出发吧。\n@c0@"
  tl: "@a@b%a002010：別耽誤時間，\n　　趕緊出發吧。\n@c0@"
283:
  en: "@a%0%a002020@bThe swordsman in blue? He doesn't seem like much of a team player to me.\n@c0@"
  ja: "@a@b%a002020「あの　青い剣士\n\tあいそが　なかったからなあ……。\n@c0@"
  ko: "@a@b%a002020: 그 파란 옷 검사\n무뚝뚝하던데......\n@c0@"
  sl: "@a@b%a002020：那个蓝衣服的剑士，\n　　好冷淡的样子……\n@c0@"
  tl: "@a@b%a002020：那個藍衣服的劍士，\n　　好冷淡的樣子……\n@c0@"
284:
  en: "@a%0%a002030@bWe must not disappoint the King.\n@c0@"
  ja: "@a@b%a002030「王さまの　期待に\n\tこたえてきましょう！\n@c0@"
  ko: "@a@b%a002030: 폐하의 기대에\n꼭 부응합시다!\n@c0@"
  sl: "@a@b%a002030：不要辜负\n　　国王陛下的期待！\n@c0@"
  tl: "@a@b%a002030：不要辜負\n　　國王陛下的期待！\n@c0@"
285:
  en: "@a%0%a002050@bSo if we team up with that lad, will we have to split the sunderbolt blade in half...?\n@c0@"
  ja: "@a@b%a002050「協力して　倒したら\n\t雷鳴の剣は　半分ずつに\n\t分けるのでしょうか……。\n@c0@"
  ko: "@a@b%a002050: 힘을 합쳐 쓰러뜨리면\n우렛소리 검은 반으로\n나눠서 주시는 걸까요......\n@c0@"
  sl: "@a@b%a002050：要是我们\n　　合力打倒了魔物的话，\n　　雷鸣之剑会不会一边分一半呢……\n@c0@"
  tl: "@a@b%a002050：要是我們\n　　合力打倒了魔物的話，\n　　雷鳴之劍會不會一邊分一半呢……\n@c0@"
