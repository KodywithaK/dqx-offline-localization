95:
  en: "@a%0%a002050@bNow we've heard all this talk of giant holes and maraudin' monsters, we need to go and see for ourselves!\n@c0@"
  ja: "@a@b%a002050「ここまで　聞いたら\n\t奥まで　行って　たしかめないと\n\t気が　おさまりませんよね！\n@c0@"
  ko: "@a@b%a002050: 이야기를 들은 이상\n안으로 가서 확인하지 않으면\n직성이 안 풀리겠는걸요!\n@c0@"
  sl: "@a@b%a002050：话都说到这份上了，\n　　不去里面看看的话，\n　　心真是痒得难受呢！\n@c0@"
  tl: "@a@b%a002050：話都說到這份上了，\n　　不去裡面看看的話，\n　　心真是癢得難受呢！\n@c0@"
96:
  en: "@a%0%a002000@bA big hole is no big deal, but a bunch of monsters — that's a problem.\n@c0@"
  ja: "@a@b%a002000「穴だけなら　まだしも\n\tまものは　よけいだったよな。\n@c0@"
  ko: "@a@b%a002000: 구멍뿐이면 또 몰라도\n괜히 마물까지 나왔네.\n@c0@"
  sl: "@a@b%a002000：只是个洞的话倒还好，\n　　有魔物出没真是烦啊。\n@c0@"
  tl: "@a@b%a002000：只是個洞的話倒還好，\n　　有魔物出沒真是煩啊。\n@c0@"
97:
  en: "@a%0%a002010@bIt really was a huge hole.\n@c0@"
  ja: "@a@b%a002010「たしかに　大きな\n\t穴だったわね。\n@c0@"
  ko: "@a@b%a002010: 맞아,\n큰 구멍이었어.\n@c0@"
  sl: "@a@b%a002010：的确是\n　　挺大一洞呢。\n@c0@"
  tl: "@a@b%a002010：的確是\n　　挺大一洞呢。\n@c0@"
98:
  en: "@a%0%a002020@bI'd love to clear out the monsters for these people, but right now we aren't even allowed inside.\n@c0@"
  ja: "@a@b%a002020「退治して　あげたいけど\n\tいまは　だれも　中に入れては\n\tくれないみたいだったしね。\n@c0@"
  ko: "@a@b%a002020: 퇴치해 주고 싶지만\n지금은 아무도 안으로 들여보내지\n않는 모양이었어.\n@c0@"
  sl: "@a@b%a002020：人家倒是挺想\n　　帮他们把魔物给收拾掉的，\n　　但目前好像不会放人进去呢。\n@c0@"
  tl: "@a@b%a002020：人家倒是挺想\n　　幫他們把魔物給收拾掉的，\n　　但目前好像不會放人進去呢。\n@c0@"
99:
  en: "@a%0%a002030@bAt present, I cannot see how we can offer any useful assistance here.\n@c0@"
  ja: "@a@b%a002030「困りましたね。\n\t今　私たちが　手伝えることは\n\t特に　ないようでしたね。\n@c0@"
  ko: "@a@b%a002030: 어쩔 수 없군요.\n지금 우리가 도울 수 있는 일은\n특별히 없는 것 같았습니다.\n@c0@"
  sl: "@a@b%a002030：真伤脑筋啊。\n　　目前没有什么\n　　我们能帮忙的地方呢。\n@c0@"
  tl: "@a@b%a002030：真傷腦筋啊。\n　　目前沒有什麼\n　　我們能幫忙的地方呢。\n@c0@"
100:
  en: "@a%0%a002050@b...Does anyone else fancy poppin' back outside?\n@c0@"
  ja: "@a@b%a002050「……そろそろ　外に\n\t出ましょうか。\n@c0@"
  ko: "@a@b%a002050: ......이제 밖으로\n나갈까요?\n@c0@"
  sl: "@a@b%a002050：……差不多\n　　该出去了吧。\n@c0@"
  tl: "@a@b%a002050：……差不多\n　　該出去了吧。\n@c0@"
101:
  en: "@a%0%a002000@bCrikey! Look at that view!\n@c0@"
  ja: "@a@b%a002000「おわっ\n\tすごい　けしきだな！\n@c0@"
  ko: "@a@b%a002000: 우와,\n엄청난 광경이군!\n@c0@"
  sl: "@a@b%a002000：哦！\n　　风景真棒！\n@c0@"
  tl: "@a@b%a002000：哦！\n　　風景真棒！\n@c0@"
102:
  en: "@a%0%a002010@bCan you see the hole?\n@c0@"
  ja: "@a@b%a002010「どう？\n\t大穴は　見える？\n@c0@"
  ko: "@a@b%a002010: 어때?\n큰 구멍이 보여?\n@c0@"
  sl: "@a@b%a002010：怎么样？\n　　能看见大洞吗？\n@c0@"
  tl: "@a@b%a002010：怎麼樣？\n　　能看見大洞嗎？\n@c0@"
103:
  en: "@a%0%a002020@bWow! What a cliff this is!\n@c0@"
  ja: "@a@b%a002020「うわー　ビックリ！\n\tすごい　ガケだねー！\n@c0@"
  ko: "@a@b%a002020: 우와~ 깜짝이야!\n이 낭떠러지 뭐야~!\n@c0@"
  sl: "@a@b%a002020：哇，吓死了！\n　　这悬崖真陡啊！\n@c0@"
  tl: "@a@b%a002020：哇，嚇死了！\n　　這懸崖真陡啊！\n@c0@"
104:
  en: "@a%0%a002030@bIt appears that there are soldiers stationed here.\n@c0@"
  ja: "@a@b%a002030「兵隊さんが\n\tいるようですね。\n@c0@"
  ko: "@a@b%a002030: 병사가\n지키고 있군요.\n@c0@"
  sl: "@a@b%a002030：好像有士兵呢。\n@c0@"
  tl: "@a@b%a002030：好像有士兵呢。\n@c0@"
105:
  en: "@a%0%a002050@bOld %a002050 has no head for heights, I tell you!\n@c0@"
  ja: "@a@b%a002050「ああ…　ガケの下を\n\t見ては　ダメですよ。\n\tあたま　クラクラ　しますからね！\n@c0@"
  ko: "@a@b%a002050: 아아... 낭떠러지 아래를\n쳐다봐선 안 됩니다.\n머리가 핑핑 돌거든요!\n@c0@"
  sl: "@a@b%a002050：啊……\n　　不要往悬崖下面看。\n　　头会晕的！\n@c0@"
  tl: "@a@b%a002050：啊……\n　　不要往懸崖下面看。\n　　頭會暈的！\n@c0@"
106:
  en: "@a%0%a002000@bCeiling's pretty high, ain't it?\n@c0@"
  ja: "@a@b%a002000「天井が　高いなあ。\n@c0@"
  ko: "@a@b%a002000: 천장이 높군.\n@c0@"
  sl: "@a@b%a002000：天花板真高。\n@c0@"
  tl: "@a@b%a002000：天花板真高。\n@c0@"
107:
  en: "@a%0%a002010@bThis cave is so spacious, it doesn't even feel like we're underground.\n@c0@"
  ja: "@a@b%a002010「地下なのに\n\tずいぶん　広々とした\n\t空間が　あるのね。\n@c0@"
  ko: "@a@b%a002010: 지하인데도\n꽤 넓은 공간이\n있구나.\n@c0@"
  sl: "@a@b%a002010：虽说是地下，\n　　但是这里还真是宽敞啊。\n@c0@"
  tl: "@a@b%a002010：雖說是地下，\n　　但是這裡還真是寬敞啊。\n@c0@"
108:
  en: "@a%0%a002020@bBoy, we're up so high! I can't even see the bottom.\n@c0@"
  ja: "@a@b%a002020「ここの　ガケは\n\t下が　見えないくらい\n\t高いんだね。\n@c0@"
  ko: "@a@b%a002020: 이곳의 낭떠러지는\n아래쪽이 보이지 않을 정도로\n높아.\n@c0@"
  sl: "@a@b%a002020：这里真高啊，\n　　都看不见悬崖下面了呢。\n@c0@"
  tl: "@a@b%a002020：這裡真高啊，\n　　都看不見懸崖下面了呢。\n@c0@"
109:
  en: "@a%0%a002030@bI would surmise that this tunnel has long been used by travellers.\n@c0@"
  ja: "@a@b%a002030「ここは　昔から　旅人に\n\t使われていた　トンネルの\n\tようですね。\n@c0@"
  ko: "@a@b%a002030: 이곳은 전부터 여행자들이\n사용하던 터널인 것\n같습니다.\n@c0@"
  sl: "@a@b%a002030：这里自古就是\n　　旅行者们来往的通道呢。\n@c0@"
  tl: "@a@b%a002030：這裡自古就是\n　　旅行者們來往的通道呢。\n@c0@"
110:
  en: "@a%0%a002050@bThis would be quite scenic if it weren't for all the beasties roamin' around.\n@c0@"
  ja: "@a@b%a002050「まものさえ　出なければ\n\t観光名所に　なりそうな\n\tところですねえ。\n@c0@"
  ko: "@a@b%a002050: 마물만 나오지 않는다면\n관광 명소가 될 것 같은\n곳이군요.\n@c0@"
  sl: "@a@b%a002050：要是没有魔物的话，\n　　这里倒是可以\n　　成为旅游名胜呢。\n@c0@"
  tl: "@a@b%a002050：要是沒有魔物的話，\n　　這裡倒是可以\n　　成為旅遊名勝呢。\n@c0@"
111:
  en: "@a%0%a002000@bSo nothin's gonna get solved until someone beats the big one, is that it?\n@c0@"
  ja: "@a@b%a002000「この穴の　奥にいる\n\tまものを　なんとか　たおさなきゃ\n\t解決しないってわけか。\n@c0@"
  ko: "@a@b%a002000: 이 구멍 안쪽에 있는\n마물을 어떻게든 쓰러뜨리지 않으면\n해결되지 않는단 말이지?\n@c0@"
  sl: "@a@b%a002000：要是不把\n　　洞里的魔物干掉的话，\n　　这问题解决不了啊。\n@c0@"
  tl: "@a@b%a002000：要是不把\n　　洞裡的魔物幹掉的話，\n　　這問題解決不了啊。\n@c0@"
112:
  en: "@a%0%a002010@bThis sounds like quite a dangerous predicament...\n@c0@"
  ja: "@a@b%a002010「あの穴の　ところまで\n\tまものが　出てきているのは\n\tとても　あぶない感じだわね。\n@c0@"
  ko: "@a@b%a002010: 저 구멍까지\n마물이 나와 있으니\n정말 위험해 보여.\n@c0@"
  sl: "@a@b%a002010：连那个洞穴里\n　　都出现了魔物，\n　　真是危险呢。\n@c0@"
  tl: "@a@b%a002010：連那個洞穴裡\n　　都出現了魔物，\n　　真是危險呢。\n@c0@"
113:
  en: "@a%0%a002020@bTrouncing those two troublemakers over there won't help, huh?\n@c0@"
  ja: "@a@b%a002020「あそこに　見えてる\n\t２匹だけ　たおしても\n\t意味がないって　こと？\n@c0@"
  ko: "@a@b%a002020: 저기 보이는\n2마리를 쓰러뜨려도\n소용없는 건가?\n@c0@"
  sl: "@a@b%a002020：也就是说\n　　只打倒那边的那两只的话，\n　　没什么意义吧。\n@c0@"
  tl: "@a@b%a002020：也就是說\n　　只打倒那邊的那兩隻的話，\n　　沒什麼意義吧。\n@c0@"
114:
  en: "@a%0%a002030@bAn enormous monster dwelling deep within the cave...\n@c0@"
  ja: "@a@b%a002030「あの穴の　奥には\n\tそんな　ものすごい　まものが\n\tひそんで　いるのですか……。\n@c0@"
  ko: "@a@b%a002030: 저 구멍 안쪽에는\n그런 엄청난 마물이\n숨어 있는 건가요......\n@c0@"
  sl: "@a@b%a002030：那个洞穴深处\n　　居然藏着\n　　那么强大的魔物啊……\n@c0@"
  tl: "@a@b%a002030：那個洞穴深處\n　　居然藏著\n　　那麼強大的魔物啊……\n@c0@"
115:
  en: "@a%0%a002030@bIf it were to emerge, then we would have a true emergency on our hands.\n@c0@"
  ja: "@a@b%a002030「そいつが　いつか\n\t穴の外まで　出てきたら……\n\tこれは　本当に　大ごとですね。\n@c0@"
  ko: "@a@b%a002030: 그 녀석이 언젠가\n구멍 밖으로 나온다면......\n이건 정말 예삿일이 아니겠군요.\n@c0@"
  sl: "@a@b%a002030：要是那家伙\n　　跑到洞外面来的话……\n　　那就糟糕了啊。\n@c0@"
  tl: "@a@b%a002030：要是那傢伙\n　　跑到洞外面來的話……\n　　那就糟糕了啊。\n@c0@"
116:
  en: "@a%0%a002050@bSo no matter how many beasties they bash, more keep comin' to replace 'em...\n@c0@"
  ja: "@a@b%a002050「倒しても　倒しても\n\tまものが　うじゃうじゃと\n\tわいてくる……\n@c0@"
  ko: "@a@b%a002050: 아무리 쓰러뜨려도\n마물이 우글우글\n몰려온다니......\n@c0@"
  sl: "@a@b%a002050：不管怎么打，\n　　魔物都会咕噜咕噜\n　　不停冒出来呢……\n@c0@"
  tl: "@a@b%a002050：不管怎麼打，\n　　魔物都會咕嚕咕嚕\n　　不停冒出來呢……\n@c0@"
117:
  en: "@a%0%a002050@bJust the thought of it gives old %a002050 goosebumps!\n@c0@"
  ja: "@a@b%a002050「うわあ……。\n\tそうぞうしただけで　トリハダが\n\t立ってしまいました！\n@c0@"
  ko: "@a@b%a002050: 우와앗......\n상상만으로 소름이\n쫙 돋는걸요!\n@c0@"
  sl: "@a@b%a002050：哇啊……\n　　光是想象一下，\n　　都起一身鸡皮疙瘩呢！\n@c0@"
  tl: "@a@b%a002050：哇啊……\n　　光是想像一下，\n　　都起一身雞皮疙瘩呢！\n@c0@"
118:
  en: "@a%0%a002000@bThose monsters prowlin' around the entrance don't seem too tough.\n@c0@"
  ja: "@a@b%a002000「あそこに　いる\n\tまものたちだったら　オレたちで\n\t何とか　倒せそうだよな。\n@c0@"
  ko: "@a@b%a002000: 저기 있는\n마물만이라면 우리끼리도\n쓰러뜨릴 수 있을 것 같군.\n@c0@"
  sl: "@a@b%a002000：那边的魔物的话，\n　　咱倒是应该能搞得定呢。\n@c0@"
  tl: "@a@b%a002000：那邊的魔物的話，\n　　咱倒是應該能搞得定呢。\n@c0@"
119:
  en: "@a%0%a002000@bThere ain't no point in beatin' them if it won't solve anything, but...\n@c0@"
  ja: "@a@b%a002000「まあ　あいつらだけ\n\t倒しても　意味が　ないなら\n\tしかたがないけど……。\n@c0@"
  ko: "@a@b%a002000: 뭐, 저놈들만\n쓰러뜨려 봤자 소용없다면\n별 수 없지만......\n@c0@"
  sl: "@a@b%a002000：不过要是\n　　只把它们干掉没什么意义的话，\n　　那就没办法了……\n@c0@"
  tl: "@a@b%a002000：不過要是\n　　只把它們幹掉沒什麼意義的話，\n　　那就沒辦法了……\n@c0@"
120:
  en: "@a%0%a002010@bIt must be quite an inconvenience for these people not to be able to travel up north.\n@c0@"
  ja: "@a@b%a002010「たしかに　これでは\n\t北の土地へは　行けないわ。\n\t困っている人も　多いでしょうね。\n@c0@"
  ko: "@a@b%a002010: 이 상태로는\n북쪽 땅으로 갈 수 없어.\n불편을 느끼는 사람도 많겠지.\n@c0@"
  sl: "@a@b%a002010：这样子的确\n　　没办法去北方呢。\n　　有很多人对此会感到困扰吧。\n@c0@"
  tl: "@a@b%a002010：這樣子的確\n　　沒辦法去北方呢。\n　　有很多人對此會感到困擾吧。\n@c0@"
121:
  en: "@a%0%a002020@bThose monsters over there seem to be guarding the entrance.\n@c0@"
  ja: "@a@b%a002020「あの　穴のところの\n\tまものたち……\n\tまるで　門番みたいね。\n@c0@"
  ko: "@a@b%a002020: 저기 구멍 근처에 있는\n마물들......\n마치 문지기 같네.\n@c0@"
  sl: "@a@b%a002020：洞那边的魔物……\n　　简直就像看门的一样呢。\n@c0@"
  tl: "@a@b%a002020：洞那邊的魔物……\n　　簡直就像看門的一樣呢。\n@c0@"
122:
  en: "@a%0%a002030@bAt least now it is clear what happened here.\n@c0@"
  ja: "@a@b%a002030「なるほど……\n\tこんなことに\n\tなっていたんですね。\n@c0@"
  ko: "@a@b%a002030: 호오......\n이렇게\n되어 있었군요.\n@c0@"
  sl: "@a@b%a002030：原来如此……\n　　情况就是这么个情况啊。\n@c0@"
  tl: "@a@b%a002030：原來如此……\n　　情況就是這麼個情況啊。\n@c0@"
123:
  en: "@a%0%a002050@bWell, we're not goin' to get any further. Shall we head back the way we came?\n@c0@"
  ja: "@a@b%a002050「たしかに　これ以上は\n\t進めないですね。\n\tもどりましょうか……。\n@c0@"
  ko: "@a@b%a002050: 더 이상은\n못 가나 봅니다.\n돌아갈까요......\n@c0@"
  sl: "@a@b%a002050：的确无法\n　　再往前走了呢。\n　　回去吧…\n@c0@"
  tl: "@a@b%a002050：的確無法\n　　再往前走了呢。\n　　回去吧…\n@c0@"
124:
  en: "@a%0%a002000@bWhat, we can't go in?\n@c0@"
  ja: "@a@b%a002000「中には　入れて\n\tくれないのかあ。\n@c0@"
  ko: "@a@b%a002000: 안으로는\n들여보내 주지 않는 건가.\n@c0@"
  sl: "@a@b%a002000：不放咱进去啊。\n@c0@"
  tl: "@a@b%a002000：不放咱進去啊。\n@c0@"
125:
  en: "@a%0%a002010@bWe can't get through. Shall we head back above ground?\n@c0@"
  ja: "@a@b%a002010「いま　ここは\n\t通れないのが　わかったから\n\t上へ　もどりましょうか。\n@c0@"
  ko: "@a@b%a002010: 지금 여긴\n지나갈 수 없다는 걸 알았으니\n위로 돌아갈까?\n@c0@"
  sl: "@a@b%a002010：看来这里\n　　我们走不过去呢，\n　　回上面去吧。\n@c0@"
  tl: "@a@b%a002010：看來這裡\n　　我們走不過去呢，\n　　回上面去吧。\n@c0@"
126:
  en: "@a%0%a002020@bWell, I guess this path won't be clear any time soon...\n@c0@"
  ja: "@a@b%a002020「これじゃ　まだ\n\tしばらくは　開通の　見通しは\n\tたちそうも　ないわね……。\n@c0@"
  ko: "@a@b%a002020: 이 상태라면\n당분간은 개통될\n예정이 없겠네......\n@c0@"
  sl: "@a@b%a002020：这样看起来，\n　　这里短时间内\n　　不太可能开得通呢……\n@c0@"
  tl: "@a@b%a002020：這樣看起來，\n　　這裡短時間內\n　　不太可能開得通呢……\n@c0@"
127:
  en: "@a%0%a002030@bI pray that the monsters over there do not make any sudden attacks...\n@c0@"
  ja: "@a@b%a002030「あそこの　まものたち\n\tいきなり　おそってきたり\n\tしないのでしょうか……。\n@c0@"
  ko: "@a@b%a002030: 저기 있는 마물들\n갑자기 공격해 오는 건\n아닐까요......\n@c0@"
  sl: "@a@b%a002030：那边的魔物\n　　应该不会突然\n　　就朝我们扑过来吧……\n@c0@"
  tl: "@a@b%a002030：那邊的魔物\n　　應該不會突然\n　　就朝我們撲過來吧……\n@c0@"
128:
  en: "@a%0%a002050@bI bet if you delve deeper into that there hole, you'll find hordes of huge monsters... (shudder)\n@c0@"
  ja: "@a@b%a002050「あの　穴の　さらに奥は\n\t強い　まものだらけなんでしょうか。\n\tいやー　おそろしいなあ……。\n@c0@"
