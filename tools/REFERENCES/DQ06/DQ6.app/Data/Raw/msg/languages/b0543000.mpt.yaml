  sl: "@a@b%a002050：伤口已经\n　　不疼了吧。\n　　睡得这么沉呢。\n@c0@"
  tl: "@a@b%a002050：傷口已經\n　　不疼了吧。\n　　睡得這麼沉呢。\n@c0@"
196:
  en: "@a%0%a002000@bHardy har! You'd better believe we're bound for Wayfarer's Pass!\n@c0@"
