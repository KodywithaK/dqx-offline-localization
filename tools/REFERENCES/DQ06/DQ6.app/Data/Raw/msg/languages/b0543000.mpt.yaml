  ja: "@a@b%a002050「やっぱり　出ますか……\n\tいやー　まいったな。\n\tどこ行っても　まものだらけですね。\n@c0@"
  ko: "@a@b%a002050: 역시 마물이 나오는구나......\n이야~ 큰일이군요.\n어딜 가도 마물투성이라니.\n@c0@"
  sl: "@a@b%a002050：果然有魔物出没啊……\n　　哎呀，真倒霉，\n　　不管在哪都是魔物魔物魔物。\n@c0@"
  tl: "@a@b%a002050：果然有魔物出沒啊……\n　　哎呀，真倒楣，\n　　不管在哪都是魔物魔物魔物。\n@c0@"
81:
  en: "@a%0%a002000@bI bet that puts the King in a bind too.\n@c0@"
  ja: "@a@b%a002000「それじゃ　王さまだって\n\tこまってるんだろうな。\n@c0@"
  ko: "@a@b%a002000: 그럼 왕도\n곤란하겠군.\n@c0@"
  sl: "@a@b%a002000：这种情况，\n　　连国王陛下都很头疼吧。\n@c0@"
  tl: "@a@b%a002000：這種情況，\n　　連國王陛下都很頭疼吧。\n@c0@"
82:
  en: "@a%0%a002010@bIt seems that repair work has been put on hold.\n@c0@"
  ja: "@a@b%a002010「工事が　中断\n\tしてしまっているのね。\n@c0@"
  ko: "@a@b%a002010: 공사가 중단되고\n말았구나.\n@c0@"
  sl: "@a@b%a002010：施工中断了呢。\n@c0@"
  tl: "@a@b%a002010：施工中斷了呢。\n@c0@"
83:
  en: "@a%0%a002020@bSounds like these guys are taking five until someone clears out the monsters.\n@c0@"
  ja: "@a@b%a002020「まものが　いるから\n\t工事が　できないのね。\n@c0@"
  ko: "@a@b%a002020: 마물이 있으니\n공사를 할 수가 없구나.\n@c0@"
  sl: "@a@b%a002020：因为有魔物，\n　　施工进行不下去了呢。\n@c0@"
  tl: "@a@b%a002020：因為有魔物，\n　　施工進行不下去了呢。\n@c0@"
84:
  en: "@a%0%a002030@bNo repairs will be taking place until the monsters have been dealt with.\n@c0@"
  ja: "@a@b%a002030「まものが　いなくならないと\n\t工事は　できないでしょう。\n@c0@"
  ko: "@a@b%a002030: 마물이 없어지지 않는 한\n공사는 불가능할 겁니다.\n@c0@"
  sl: "@a@b%a002030：要是魔物不消灭的话，\n　　施工就进行不下去吧。\n@c0@"
  tl: "@a@b%a002030：要是魔物不消滅的話，\n　　施工就進行不下去吧。\n@c0@"
85:
  en: "@a%0%a002050@bWell, monsters do have a habit of bein' scary.\n@c0@"
  ja: "@a@b%a002050「そりゃあ　まものは\n\tおっかないですよね！\n@c0@"
  ko: "@a@b%a002050: 그럼요. 마물은\n무섭고말고요!\n@c0@"
  sl: "@a@b%a002050：当然了，\n　　魔物很可怕呢！\n@c0@"
  tl: "@a@b%a002050：當然了，\n　　魔物很可怕呢！\n@c0@"
86:
  en: "@a%0%a002000@bHardy har! That fella's got the right idea.\n@c0@"
  ja: "@a@b%a002000「仕事する　前から\n\tおわったときのことを\n\t考えてるのかよ……。\n@c0@"
  ko: "@a@b%a002000: 일도 시작하기 전에\n일 끝났을 때를\n생각하는 거냐......\n@c0@"
  sl: "@a@b%a002000：工作还没有结束，\n　　就开始在考虑\n　　结束之后的事情了啊……\n@c0@"
  tl: "@a@b%a002000：工作還沒有結束，\n　　就開始在考慮\n　　結束之後的事情了啊……\n@c0@"
87:
  en: "@a%0%a002010@bI can sense the workers' frustration.\n@c0@"
  ja: "@a@b%a002010「仕事が　できないんじゃ\n\tホント　困るでしょうね。\n@c0@"
  ko: "@a@b%a002010: 일을 할 수 없으니\n정말 곤란하겠어.\n@c0@"
  sl: "@a@b%a002010：工作无法进行的话，\n　　的确很伤脑筋呢。\n@c0@"
  tl: "@a@b%a002010：工作無法進行的話，\n　　的確很傷腦筋呢。\n@c0@"
88:
  en: "@a%0%a002020@bBoy, if this guy had to choose between working and drinking, I think I know which one he'd pick...\n@c0@"
  ja: "@a@b%a002020「仕事より　酒が好き\n\tっていう　タイプね　きっと。\n@c0@"
  ko: "@a@b%a002020: 분명 일보다 술을 좋아하는\n타입일 거야.\n@c0@"
  sl: "@a@b%a002020：这人比起工作来，\n　　更喜欢喝酒呢。\n@c0@"
  tl: "@a@b%a002020：這人比起工作來，\n　　更喜歡喝酒呢。\n@c0@"
89:
  en: "@a%0%a002030@bI wonder when they last did an honest day's work...\n@c0@"
  ja: "@a@b%a002030「だいぶ　長いこと\n\tここで　待っている　ようですね。\n@c0@"
