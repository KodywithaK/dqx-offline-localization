190:
  en: "@a%0%a002000@bHe's asleep, alright.\n@c0@"
  ja: "@a@b%a002000「よく　ねてるな。\n@c0@"
  ko: "@a@b%a002000: 잘 자는군.\n@c0@"
  sl: "@a@b%a002000：睡得真沉啊。\n@c0@"
  tl: "@a@b%a002000：睡得真沉啊。\n@c0@"
191:
  en: "@a%0%a002010@bHe seems exhausted. I think we should let him sleep in peace.\n@c0@"
  ja: "@a@b%a002010「疲れて　ねむったのね。\n\tいまは　起こさないで　おきましょ。\n@c0@"
  ko: "@a@b%a002010: 지쳐서 잠이 들었나 봐.\n지금은 깨우지 말자.\n@c0@"
  sl: "@a@b%a002010：累得睡着了呢。\n　　现在先别吵醒他吧。\n@c0@"
  tl: "@a@b%a002010：累得睡著了呢。\n　　現在先別吵醒他吧。\n@c0@"
192:
  en: "@a%0%a002020@bHe probably turned in after getting his butt kicked by all the soldiers. Never go to bed angry, I say.\n@c0@"
  ja: "@a@b%a002020「この　お城の\n\t兵士に　負けちゃったから\n\tふてね　かな。\n@c0@"
