  sl: "@a@b%a002030：原来如此，\n　　这里就是被称为\n　　旅行者洞窟的地方吧。\n@c0@"
  tl: "@a@b%a002030：原來如此，\n　　這裡就是被稱為\n　　旅行者洞窟的地方吧。\n@c0@"
75:
  en: "@a%0%a002050@bHe's got a face like a rainy day in Scrimsley...\n@c0@"
  ja: "@a@b%a002050「この人　本当に\n\tこまった顔を　してますね。\n@c0@"
  ko: "@a@b%a002050: 이 사람, 진짜\n곤란한 표정을 짓고 있네요.\n@c0@"
  sl: "@a@b%a002050：这个人看起来\n　　的确很困扰呢。\n@c0@"
  tl: "@a@b%a002050：這個人看起來\n　　的確很困擾呢。\n@c0@"
76:
  en: "@a%0%a002000@bMonsters? We laugh in the face of monsters! Hardy Har! See?\n@c0@"
  ja: "@a@b%a002000「まものが出る？\n\tそう　聞いたぐらいで\n\t逃げる　オレたちじゃ　ないよな。\n@c0@"
  ko: "@a@b%a002000: 마물이 나온다고?\n겨우 그것만 듣고 도망칠\n우리가 아니지.\n@c0@"
  sl: "@a@b%a002000：有魔物出没？\n　　听到这话，\n　　咱更得一显身手了不是？\n@c0@"
  tl: "@a@b%a002000：有魔物出沒？\n　　聽到這話，\n　　咱更得一顯身手了不是？\n@c0@"
77:
  en: "@a%0%a002010@bMonsters? I can see that being a problem for people...\n@c0@"
  ja: "@a@b%a002010「この　奥には　まものが？\n\tそれは　みなさん　おこまりよね。\n@c0@"
  ko: "@a@b%a002010: 이 안에 마물이?\n사람들이 곤란해할 만도 한걸.\n@c0@"
  sl: "@a@b%a002010：这里面有魔物？\n　　怪不得大家这么伤脑筋呢。\n@c0@"
  tl: "@a@b%a002010：這裡面有魔物？\n　　怪不得大家這麼傷腦筋呢。\n@c0@"
78:
  en: "@a%0%a002020@bLet's keep on keeping on. A few monsters aren't about to stop me!\n@c0@"
  ja: "@a@b%a002020「あたしたち　まものなんか\n\tへっちゃらよね。\n\tもっと奥を　探検しましょ！\n@c0@"
  ko: "@a@b%a002020: 우리는 마물 따위\n하나도 안 무서워.\n더 안쪽을 탐색해 보자!\n@c0@"
  sl: "@a@b%a002020：魔物对于\n　　我们来说小菜一碟嘛。\n　　往里走走，探险去吧！\n@c0@"
  tl: "@a@b%a002020：魔物對於\n　　我們來說小菜一碟嘛。\n　　往裡走走，探險去吧！\n@c0@"
79:
  en: "@a%0%a002030@bHmm. We should venture further into the cave.\n@c0@"
  ja: "@a@b%a002030「ふーむ。\n\tちょっと　奥のようすを\n\t見てみましょうか。\n@c0@"
  ko: "@a@b%a002030: 흐음.\n안쪽이 어떻게 되어 있는지\n좀 보고 올까요?\n@c0@"
  sl: "@a@b%a002030：唔。\n　　再往里走走\n　　看一看吧。\n@c0@"
  tl: "@a@b%a002030：唔。\n　　再往裡走走\n　　看一看吧。\n@c0@"
80:
