  tl: "@a@b%a002010：您也差不多\n　　該回裡面去了吧，\n　　要是受了風寒可就麻煩了。\n@c0@"
159:
  en: "@a%0%a002020@bI'd soak up the sun and enjoy the wind in my hair all day if I could.\n@c0@"
  ja: "@a@b%a002020「のんびり　ひなたぼっこや\n\t風に吹かれるのも　いいよねー。\n@c0@"
  ko: "@a@b%a002020: 느긋하게 햇볕을 쬐고\n바람을 쐬는 것도 좋은 일이지~\n@c0@"
  sl: "@a@b%a002020：悠闲地晒晒太阳啊，\n　　吹吹风什么的，真不错呢。\n@c0@"
  tl: "@a@b%a002020：悠閒地曬曬太陽啊，\n　　吹吹風什麼的，真不錯呢。\n@c0@"
160:
  en: "@a%0%a002030@bI would like to breathe in some more of this air before we go.\n@c0@"
  ja: "@a@b%a002030「また　しばし\n\t立ちどまって　しんこきゅうでも\n\tしましょうか。\n@c0@"
  ko: "@a@b%a002030: 또 잠시\n멈춰 서서 심호흡이라도\n해 볼까요?\n@c0@"
  sl: "@a@b%a002030：再在这里站一会，\n　　做做深呼吸吧。\n@c0@"
  tl: "@a@b%a002030：再在這裡站一會，\n　　做做深呼吸吧。\n@c0@"
161:
  en: "@a%0%a002050@bGood to see the old boy hasn't dried out.\n@c0@"
  ja: "@a@b%a002050「おかげさまで\n\tまだ　くさっては　いないようです！\n@c0@"
  ko: "@a@b%a002050: 덕분에\n아직 썩지는 않은 것 같습니다!\n@c0@"
  sl: "@a@b%a002050：托您的福，\n　　我们还没有发霉呢！\n@c0@"
  tl: "@a@b%a002050：托您的福，\n　　我們還沒有發霉呢！\n@c0@"
162:
  en: "@a%0%a002000@bPerfect! Time for our walkin' papers.\n@c0@"
  ja: "@a@b%a002000「いよいよ　王さまから\n\t指示が　もらえるな！\n@c0@"
  ko: "@a@b%a002000: 드디어 왕으로부터\n지시가 내려지겠군!\n@c0@"
  sl: "@a@b%a002000：终于能得到\n　　国王陛下的谕旨了！\n@c0@"
  tl: "@a@b%a002000：終於能得到\n　　國王陛下的諭旨了！\n@c0@"
163:
  en: "@a%0%a002010@bThe King is waiting for us. Let's go!\n@c0@"
  ja: "@a@b%a002010「王さまは　ここで\n\t待っていらっしゃるのね。\n\tさあ　行きましょうか。\n@c0@"
  ko: "@a@b%a002010: 폐하는 여기서\n기다리고 계신가 봐.\n자, 가 보자.\n@c0@"
  sl: "@a@b%a002010：国王陛下好像\n　　在这里等我们呢。\n　　走吧。\n@c0@"
  tl: "@a@b%a002010：國王陛下好像\n　　在這裡等我們呢。\n　　走吧。\n@c0@"
164:
  en: "@a%0%a002020@bLet's go find out about this monster we'll be facing, okay?\n@c0@"
  ja: "@a@b%a002020「まもの退治の\n\tくわしい話を　聞かなくっちゃね！\n@c0@"
  ko: "@a@b%a002020: 마물 퇴치에 대한\n자세한 이야기를 들어야지!\n@c0@"
  sl: "@a@b%a002020：得去详细了解一下\n　　魔物讨伐的具体内容呢！\n@c0@"
  tl: "@a@b%a002020：得去詳細瞭解一下\n　　魔物討伐的具體內容呢！\n@c0@"
165:
  en: "@a%0%a002030@bI recall when we first came here, these two guards were far from friendly.\n@c0@"
  ja: "@a@b%a002030「最初に　ここに\n\t来たときは　おふたりとも\n\tこわい顔でしたが……。\n@c0@"
  ko: "@a@b%a002030: 처음 여기\n왔을 때는 두 사람 다\n무서운 얼굴이었는데......\n@c0@"
  sl: "@a@b%a002030：最开始来这里的时候，\n　　这两个人没给我们\n　　好脸色看呢……\n@c0@"
  tl: "@a@b%a002030：最開始來這裡的時候，\n　　這兩個人沒給我們\n　　好臉色看呢……\n@c0@"
166:
  en: "@a%0%a002030@bThey seem to be much more amenable now.\n@c0@"
  ja: "@a@b%a002030「今は\n\tそうでも　ないですね。\n@c0@"
  ko: "@a@b%a002030: 지금은\n그렇지도 않군요.\n@c0@"
  sl: "@a@b%a002030：现在已经\n　　不再那样了呢。\n@c0@"
  tl: "@a@b%a002030：現在已經\n　　不再那樣了呢。\n@c0@"
167:
  en: "@a%0%a002050@bNow we can come and go as we please. Happy days!\n@c0@"
  ja: "@a@b%a002050「もう　ここは\n\t自由に　出入りして\n\tよいのですよね。\n@c0@"
  ko: "@a@b%a002050: 이제 여긴\n자유로이 드나들어도\n괜찮은 거죠?\n@c0@"
  sl: "@a@b%a002050：这里已经可以\n　　自由进出了吧。\n@c0@"
  tl: "@a@b%a002050：這裡已經可以\n　　自由進出了吧。\n@c0@"
168:
  en: "@a%0%a002000@bWell, we got the coffin, %a000090. Let's shove off for the cave.\n@c0@"
  ja: "@a@b%a002000「さあ　%a000090。\n\tカンオケも　もらったことだし\n\t洞くつに　急ごうぜ。\n@c0@"
  ko: "@a@b%a002000: 자, %a000090.\n관도 받았으니\n서둘러 동굴로 가자.\n@c0@"
  sl: "@a@b%a002000：%a000090，\n　　咱拿到棺材了，\n　　赶紧去洞窟吧。\n@c0@"
  tl: "@a@b%a002000：%a000090，\n　　咱拿到棺材了，\n　　趕緊去洞窟吧。\n@c0@"
169:
  en: "@a%0%a002010@bLet's try our best to help the King, %a000090.\n@c0@"
  ja: "@a@b%a002010「王さまの　期待に\n\tがんばって　こたえましょうね。\n@c0@"
  ko: "@a@b%a002010: 열심히 해서\n폐하의 기대에 부응하자구.\n@c0@"
  sl: "@a@b%a002010：不要辜负\n　　国王陛下的期待啊。\n@c0@"
  tl: "@a@b%a002010：不要辜負\n　　國王陛下的期待啊。\n@c0@"
170:
  en: "@a%0%a002020@bThat monster's as good as gone with us on the job! Yahoo!\n@c0@"
  ja: "@a@b%a002020「まもの退治\n\tがんばるぞ！　おー！\n@c0@"
  ko: "@a@b%a002020: 마물 퇴치\n꼭 해내고 말 거야! 아자!\n@c0@"
  sl: "@a@b%a002020：努力讨伐魔物吧！哦！\n@c0@"
  tl: "@a@b%a002020：努力討伐魔物吧！哦！\n@c0@"
