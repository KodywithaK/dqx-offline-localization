174:
  en: "@a%0%a002000@b‘Spectacular’, aye? I like the sound of that!\n@c0@"
  ja: "@a@b%a002000「すごい　ほうびか。\n\tいったい　何だろうな？\n\tワクワクするぜ！\n@c0@"
  ko: "@a@b%a002000: 엄청난 포상이라.\n대체 뭘까?\n궁금한걸!\n@c0@"
  sl: "@a@b%a002000：厚赏啊。\n　　到底是啥呢？\n　　真期待啊！\n@c0@"
  tl: "@a@b%a002000：厚賞啊。\n　　到底是啥呢？\n　　真期待啊！\n@c0@"
175:
  en: "@a%0%a002010@bYou know, the King hasn't given us any details yet.\n@c0@"
  ja: "@a@b%a002010「そういえば　まだ\n\t王さまから　くわしい話を\n\tうかがって　いなかったわね。\n@c0@"
  ko: "@a@b%a002010: 그러고 보니 아직\n폐하로부터 구체적인 이야기를\n듣지 않았어.\n@c0@"
  sl: "@a@b%a002010：话说回来，\n　　还没有跟国王陛下\n　　打听详细的情况呢。\n@c0@"
  tl: "@a@b%a002010：話說回來，\n　　還沒有跟國王陛下\n　　打聽詳細的情況呢。\n@c0@"
176:
  en: "@a%0%a002010@bLet's go and have another talk with His Majesty.\n@c0@"
  ja: "@a@b%a002010「王さまの　お部屋に\n\tもう１度　おじゃまして\n\tみましょうか。\n@c0@"
  ko: "@a@b%a002010: 폐하의 방에\n다시 한 번 가 보는 게\n어떨까?\n@c0@"
  sl: "@a@b%a002010：再去\n　　国王陛下的房间\n　　觐见一次吧。\n@c0@"
  tl: "@a@b%a002010：再去\n　　國王陛下的房間\n　　覲見一次吧。\n@c0@"
177:
  en: "@a%0%a002020@bTee hee! Commander Brutus couldn't take us down, either!\n@c0@"
  ja: "@a@b%a002020「ブラスト兵団長には\n\tあたしたちも\n\t勝っちゃったんだからねー！\n@c0@"
  ko: "@a@b%a002020: 블래스트 병사단장한테는\n우리도 이겼거든~!\n@c0@"
  sl: "@a@b%a002020：因为\n　　我们也战胜了\n　　布拉斯特兵团长呢！\n@c0@"
  tl: "@a@b%a002020：因為\n　　我們也戰勝了\n　　布拉斯特兵團長呢！\n@c0@"
178:
  en: "@a%0%a002020@bLet's go get that monster and get our reward, %a000090!\n@c0@"
  ja: "@a@b%a002020「がんばって\n\tまものを　倒して帰って\n\tごほうび　もらおうね　%a000090！\n@c0@"
  ko: "@a@b%a002020: 최선을 다해\n마물을 쓰러뜨리고 돌아와서\n포상을 받자, %a000090!\n@c0@"
  sl: "@a@b%a002020：加油打倒魔物，\n　　然后回来拿奖赏吧，\n　　%a000090！\n@c0@"
  tl: "@a@b%a002020：加油打倒魔物，\n　　然後回來拿獎賞吧，\n　　%a000090！\n@c0@"
179:
  en: "@a%0%a002030@bThe reward is much less important than dealing with that monster once and for all.\n@c0@"
  ja: "@a@b%a002030「ごほうびは　ともかく……\n\t洞くつの　まものは\n\tほうっては　おけないですね。\n@c0@"
  ko: "@a@b%a002030: 포상도 포상이지만......\n동굴 속의 마물을\n그냥 내버려둘 수는 없습니다.\n@c0@"
  sl: "@a@b%a002030：先别管奖赏……\n　　洞窟里有魔物这件事情，\n　　不能放任不管。\n@c0@"
  tl: "@a@b%a002030：先別管獎賞……\n　　洞窟裡有魔物這件事情，\n　　不能放任不管。\n@c0@"
180:
  en: "@a%0%a002030@bIn any case, let's hear what the King has to say.\n@c0@"
  ja: "@a@b%a002030「とにかく　王さまに\n\tくわしい　お話を\n\tうかがいに　いきましょう。\n@c0@"
  ko: "@a@b%a002030: 우선 폐하께\n자세한 얘기를\n들으러 가 봅시다.\n@c0@"
  sl: "@a@b%a002030：总之先去\n　　向国王陛下打听一下\n　　具体情况吧。\n@c0@"
  tl: "@a@b%a002030：總之先去\n　　向國王陛下打聽一下\n　　具體情況吧。\n@c0@"
181:
  en: "@a%0%a002050@bOld %a002050 is a big fan of rewards!\n@c0@"
  ja: "@a@b%a002050「まものを　たおすと\n\tごほうびですか！\n@c0@"
  ko: "@a@b%a002050: 마물을 쓰러뜨리면\n포상이 나오는 겁니까!?\n@c0@"
  sl: "@a@b%a002050：打倒魔物\n　　就有奖赏啊！\n@c0@"
  tl: "@a@b%a002050：打倒魔物\n　　就有獎賞啊！\n@c0@"
182:
  en: "@a%0%a002050@bLet's get a move on before someone else beats us to the prize!\n@c0@"
  ja: "@a@b%a002050「ほかの人に\n\t先を　こされないよう\n\tがんばりましょう！\n@c0@"
  ko: "@a@b%a002050: 다른 사람에게\n따라잡히지 않도록\n최선을 다해 보자구요!\n@c0@"
  sl: "@a@b%a002050：加油吧，\n　　不要让他人抢先了！\n@c0@"
  tl: "@a@b%a002050：加油吧，\n　　不要讓他人搶先了！\n@c0@"
183:
  en: "@a%0%a002000@bThe King promised us the sunderbolt blade, aye?\n@c0@"
  ja: "@a@b%a002000「王さまは　雷鳴の剣を\n\tほうびに　くれるって\n\t言ってたな。\n@c0@"
  ko: "@a@b%a002000: 왕은 우렛소리 검을\n포상으로 주겠다고\n했지.\n@c0@"
  sl: "@a@b%a002000：国王陛下是说\n　　要将雷鸣之剑\n　　奖给咱吧。\n@c0@"
  tl: "@a@b%a002000：國王陛下是說\n　　要將雷鳴之劍\n　　獎給咱吧。\n@c0@"
184:
  en: "@a%0%a002010@bWe can worry about the reward later.\n@c0@"
  ja: "@a@b%a002010「ごほうびは\n\tぶじ　まものを　倒したあとのこと。\n@c0@"
  ko: "@a@b%a002010: 포상은 마물을\n무사히 쓰러뜨린 후에 받을 수 있어.\n@c0@"
  sl: "@a@b%a002010：先要顺利打倒魔物，\n　　奖赏是那之后的事情。\n@c0@"
  tl: "@a@b%a002010：先要順利打倒魔物，\n　　獎賞是那之後的事情。\n@c0@"
185:
  en: "@a%0%a002010@bFor now, we need to focus on defeating that monster!\n@c0@"
  ja: "@a@b%a002010「今は　まもの退治に\n\t全力を　そそぎましょうね。\n@c0@"
  ko: "@a@b%a002010: 지금은 마물 퇴치에\n전력을 다하자.\n@c0@"
  sl: "@a@b%a002010：眼下先\n　　全力以赴讨伐魔物吧。\n@c0@"
  tl: "@a@b%a002010：眼下先\n　　全力以赴討伐魔物吧。\n@c0@"
