  tl: "@a@b%a002000：不過，\n　　拖著不解決的話，\n　　咱們的身體也沒法復原。\n@c0@"
62:
  en: "@a%0%a002000@bGuess we have no choice but to track down that ‘dream dew’ stuff...\n@c0@"
