  sl: "@a@b%a002010：怎么办，%a000090？\n　　坐船回圣马力诺吗？\n　　用鲁拉也不错哦。\n@c0@"
  tl: "@a@b%a002010：怎麼辦，%a000090？\n　　坐船回聖馬力諾嗎？\n　　用魯拉也不錯哦。\n@c0@"
101:
  en: "@a%0%a002020@bUm, hellooo. Don't you have a king waiting for you to bring him that mirror?\n@c0@"
  ja: "@a@b%a002020「ラーの鏡を　待ってる\n\t王さまが　いるんだっけね。\n@c0@"
