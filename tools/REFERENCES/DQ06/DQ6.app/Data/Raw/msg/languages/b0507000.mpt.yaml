91:
  en: "@a%0%a002000@bMaybe there's a mirror in there that makes you look as round as the moon. Wouldn't that be funny, aye? \n@c0@"
  ja: "@a@b%a002000「あっ　答えなくていいぞ。\n\tどうせ　塔の中に　月の形をした\n\t鏡があるとか　いうんだろ。\n@c0@"
  ko: "@a@b%a002000: 앗, 대답할 필요 없어.\n어차피 탑 안에 달 모양의 거울이\n있다고 말할 거잖아?\n@c0@"
  sl: "@a@b%a002000：啊，不用回答了。\n　　俺猜，\n　　是因为塔里有块月亮形的镜子。\n@c0@"
  tl: "@a@b%a002000：啊，不用回答了。\n　　俺猜，\n　　是因為塔里有塊月亮形的鏡子。\n@c0@"
92:
  en: "@a%0%a002010@bI thought we were just dreaming, but this key seems real enough.\n@c0@"
  ja: "@a@b%a002010「なんだか　夢を\n\t見ていたみたいだけれど\n\t鏡のカギは　ちゃんとあるわね。\n@c0@"
  ko: "@a@b%a002010: 어쩐지 꿈을\n꿨던 것 같은데\n진짜 거울의 열쇠가 있구나.\n@c0@"
  sl: "@a@b%a002010：我好像在梦里见过，\n　　想不到真的有镜之钥。\n@c0@"
  tl: "@a@b%a002010：我好像在夢裡見過，\n　　想不到真的有鏡之鑰。\n@c0@"
93:
  en: "@a%0%a002010@bCome on, let's get to Moonmirror Tower. Ra's mirror awaits!\n@c0@"
  ja: "@a@b%a002010「早く　月鏡の塔に　行って\n\tラーの鏡を　手にいれましょ！\n@c0@"
  ko: "@a@b%a002010: 빨리 달거울 탑에 가서\n라의 거울을 손에 넣자!\n@c0@"
  sl: "@a@b%a002010：走吧，去月镜之塔，\n　　快点拿到太阳神镜！\n@c0@"
  tl: "@a@b%a002010：走吧，去月鏡之塔，\n　　快點拿到太陽神鏡！\n@c0@"
94:
  en: "@a%0%a002000@bThat tower makes my head hurt. We need to find a way to the top, and fast.\n@c0@"
  ja: "@a@b%a002000「月鏡の塔……\n\tなんとか　あの塔の　ナゾを\n\tとかないとな。\n@c0@"
  ko: "@a@b%a002000: 달거울 탑......\n어떻게든 그 탑의 수수께끼를\n풀어야 해.\n@c0@"
  sl: "@a@b%a002000：月镜之塔……\n　　看起来，\n　　咱们必须解开它的谜团。\n@c0@"
  tl: "@a@b%a002000：月鏡之塔……\n　　看起來，\n　　咱們必須解開它的謎團。\n@c0@"
95:
  en: "@a%0%a002010@bI think that girl %a002020 is still inside the tower...\n@c0@"
  ja: "@a@b%a002010「あの　%a002020っていう\n\t女の子　まだ　あの　塔の中に\n\tいるのかしら……。\n@c0@"
