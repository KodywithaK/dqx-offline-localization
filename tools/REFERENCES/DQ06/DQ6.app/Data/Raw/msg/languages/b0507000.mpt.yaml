0:
  en: "@a%0%a002000@bWell, what have we here? Looks like that dwarf was good for somethin'.\n@c0@"
  ja: "@a@b%a002000「へえっ。\n\tあの　オヤジの　言ってたことは\n\tほんとう　だったのか！\n@c0@"
  ko: "@a@b%a002000: 호오.\n그 영감이 한 말이\n사실이었다니!\n@c0@"
  sl: "@a@b%a002000：嘿。\n　　想不到那老头说的是真的！\n@c0@"
  tl: "@a@b%a002000：嘿。\n　　想不到那老頭說的是真的！\n@c0@"
1:
  en: "@a%0%a002000@bIf the rest of his tale's true, there's a big ol' abbey waitin' for us east of here!\n@c0@"
  ja: "@a@b%a002000「ってことは……　\n\tこの　洞くつを抜けて　東にいくと\n\t大きな　神殿が　あるってわけだ！\n@c0@"
  ko: "@a@b%a002000: 그렇다면......\n이 동굴을 빠져나가 동쪽으로 가면\n큰 신전이 나온다는 얘기군!\n@c0@"
  sl: "@a@b%a002000：就是说……　\n　　穿过这隧道向东，\n　　真的会有个神殿！\n@c0@"
  tl: "@a@b%a002000：就是說……　\n　　穿過這隧道向東，\n　　真的會有個神殿！\n@c0@"
2:
  en: "@a%0%a002000@bSo maybe that dwarf wasn't fibbin' about the river path...\n@c0@"
  ja: "@a@b%a002000「たしかに　ぬけ道の\n\t話は　本当だったけど……。\n@c0@"
  ko: "@a@b%a002000: 확실히 비밀 통로\n얘기는 사실이었지만......\n@c0@"
  sl: "@a@b%a002000：的确是有个隧道……\n@c0@"
  tl: "@a@b%a002000：的確是有個隧道……\n@c0@"
3:
  en: "@a%0%a002000@bBut do you really think there's an abbey on the other side? I suppose we should see...\n@c0@"
  ja: "@a@b%a002000「それに　したって\n\tこの先に　大きな神殿が\n\tあるとは　信じらんねーな。\n@c0@"
  ko: "@a@b%a002000: 그렇다고\n이 너머에 큰 신전이\n있다고는 믿기 어려워.\n@c0@"
  sl: "@a@b%a002000：不过嘛，\n　　还是不敢相信前面有个大神殿。\n@c0@"
  tl: "@a@b%a002000：不過嘛，\n　　還是不敢相信前面有個大神殿。\n@c0@"
4:
  en: "@a%0%a002000@bI think you and me'll get along just fine, %a000090. A real dream team!\n@c0@"
  ja: "@a@b%a002000「なあ　%a000090。\n\tどうやら　オレたち\n\tウマが　合いそうだな。\n@c0@"
  ko: "@a@b%a002000: 이봐, %a000090.\n아무래도 우리는\n마음이 잘 통하는 것 같군.\n@c0@"
  sl: "@a@b%a002000：诶，%a000090。\n　　俺觉得哈，咱们\n　　好像特别投缘。\n@c0@"
  tl: "@a@b%a002000：誒，%a000090。\n　　俺覺得哈，咱們\n　　好像特別投緣。\n@c0@"
5:
  en: "@a%0%a002000@bI feel like we were fated to meet, ya know? Like it was destiny 'n' everything like that.\n@c0@"
  ja: "@a@b%a002000「けどよ…　こうなることが\n\t前から　決まっていたような\n\t気がして　ならないんだが……。\n@c0@"
  ko: "@a@b%a002000: 그런데... 이게 미리 정해진\n운명이 아닐까 하는\n생각이 자꾸만 드는군......\n@c0@"
  sl: "@a@b%a002000：不过……\n　　这好像是早就决定好的，\n　　真是奇怪……\n@c0@"
  tl: "@a@b%a002000：不過……\n　　這好像是早就決定好的，\n　　真是奇怪……\n@c0@"
6:
  en: "@a%0%a002000@bAh, sorry to get all emotional on ya. Let's go wrangle us a mustang!\n@c0@"
  ja: "@a@b%a002000「いや　まあ　そんなことは\n\tどうでもいいか！\n\tさあ　あばれ馬を　つかまえに行くぜ！\n@c0@"
  ko: "@a@b%a002000: 뭐, 그런 건\n아무래도 좋아!\n자, 날뛰는 말을 잡으러 가자고!\n@c0@"
  sl: "@a@b%a002000：算了，不想那么多，\n　　这样也挺好的！\n　　走吧，咱们去抓狂暴马！\n@c0@"
  tl: "@a@b%a002000：算了，不想那麼多，\n　　這樣也挺好的！\n　　走吧，咱們去抓狂暴馬！\n@c0@"
7:
  en: "@a%0%a002000@bLooks like we're partners in crime startin' today.\n@c0@"
  ja: "@a@b%a002000「今日から　オレたちは\n\t兄弟分だぜ　%a000090！\n@c0@"
  ko: "@a@b%a002000: 오늘부터 우리는\n의형제다, %a000090!\n@c0@"
  sl: "@a@b%a002000：从今天起，\n　　咱们就是兄弟啦，%a000090！\n@c0@"
  tl: "@a@b%a002000：從今天起，\n　　咱們就是兄弟啦，%a000090！\n@c0@"
8:
  en: "@a%0%a002000@bWord back in town was that the mustang was prancin' around the forest to the west.\n@c0@"
  ja: "@a@b%a002000「町のウワサによると\n\tあばれ馬は　西の森のあたりに\n\tいるらしいな。\n@c0@"
  ko: "@a@b%a002000: 마을에 도는 소문에 따르면\n날뛰는 말은 서쪽 숲 근처에 \n있는 모양이야.\n@c0@"
  sl: "@a@b%a002000：俺听过街上的传闻，\n　　说那狂暴马就在\n　　西边的森林里。\n@c0@"
  tl: "@a@b%a002000：俺聽過街上的傳聞，\n　　說那狂暴馬就在\n　　西邊的森林裡。\n@c0@"
9:
  en: "@a%0%a002000@bLet's charge over there and bag that beast, aye?\n@c0@"
  ja: "@a@b%a002000「さっさと　行って\n\tとっつかまえるぞ！\n@c0@"
  ko: "@a@b%a002000: 얼른 가서\n붙잡자고!\n@c0@"
  sl: "@a@b%a002000：快点走啊，\n　　咱去抓住它！\n@c0@"
  tl: "@a@b%a002000：快點走啊，\n　　咱去抓住它！\n@c0@"
10:
  en: "@a%0%a002000@bKinda nice sharin' the road with someone for a change. I feel like I've already known ya for a while.\n@c0@"
  ja: "@a@b%a002000「なんか　こうして\n\tふたりで　歩くのも　悪くないな。\n\t仲間って　気がするぜ。\n@c0@"
  ko: "@a@b%a002000: 이렇게 둘이서\n걷는 것도 나쁘지 않군.\n동료라는 기분도 들고.\n@c0@"
  sl: "@a@b%a002000：俺觉得哈，\n　　咱俩这个走法，\n　　很有团队的感觉。\n@c0@"
  tl: "@a@b%a002000：俺覺得哈，\n　　咱倆這個走法，\n　　很有團隊的感覺。\n@c0@"
11:
  en: "@a%0%a002000@bThink that mustang'll be a real handful, aye? Don't be scared...\n@c0@"
  ja: "@a@b%a002000「あばれ馬って\n\tどんくらい　凶暴なんだろうな。\n@c0@"
  ko: "@a@b%a002000: 도대체 얼마나 사납기에\n날뛰는 말이라 부르는 거지?\n@c0@"
  sl: "@a@b%a002000：不知那狂暴马\n　　到底有多狂暴。\n@c0@"
  tl: "@a@b%a002000：不知那狂暴馬\n　　到底有多狂暴。\n@c0@"
12:
  en: "@a%0%a002000@bHaunches of steel and a fiery temper. ...I'm talkin' about me, not the horse. I'll tame the beast!\n@c0@"
  ja: "@a@b%a002000「きっと　見た目も\n\tスゲーこわい顔してそうだぜ。\n@c0@"
  ko: "@a@b%a002000: 분명 생김새도\n아주 무서울 테지.\n@c0@"
  sl: "@a@b%a002000：长得肯定很吓人。\n@c0@"
  tl: "@a@b%a002000：長得肯定很嚇人。\n@c0@"
13:
  en: "@a%0%a002000@bHavin' me around sure makes fightin' easier, aye?\n@c0@"
  ja: "@a@b%a002000「オレがいると\n\tたたかいも　楽だろう！\n@c0@"
  ko: "@a@b%a002000: 내가 있으니까\n싸움도 한결 편할 거다!\n@c0@"
  sl: "@a@b%a002000：只要有俺在，\n　　战斗变轻松！\n@c0@"
  tl: "@a@b%a002000：只要有俺在，\n　　戰鬥變輕鬆！\n@c0@"
14:
  en: "@a%0%a002000@bI bet the monsters were eatin' you for breakfast 'fore I came along. My left bicep weighs more than you!\n@c0@"
  ja: "@a@b%a002000「おまえ　ひとりじゃ\n\tまものに　やられそうだからな。\n@c0@"
  ko: "@a@b%a002000: 너 혼자라면\n마물에게 꼼짝 없이 당했을 테니까.\n@c0@"
  sl: "@a@b%a002000：要是只有你一个人，\n　　怕是打不过魔物吧。\n@c0@"
  tl: "@a@b%a002000：要是只有你一個人，\n　　怕是打不過魔物吧。\n@c0@"
15:
  en: "@a%0%a002000@bWell, here we are. Time for some serious horseplay!\n@c0@"
  ja: "@a@b%a002000「ここだ　ここだ！\n\tもうすぐ　あばれ馬ちゃんに\n\t会えるってことだな！\n@c0@"
  ko: "@a@b%a002000: 여기야, 여기!\n이제 곧 날뛰는 말을\n보게 되겠군!\n@c0@"
  sl: "@a@b%a002000：就是这里啦！\n　　咱们马上就能\n　　看见那狂暴小马喽！\n@c0@"
  tl: "@a@b%a002000：就是這裡啦！\n　　咱們馬上就能\n　　看見那狂暴小馬嘍！\n@c0@"
16:
  en: "@a%0%a002000@bHey! This horse is makin' monkeys out of us!\n@c0@"
  ja: "@a@b%a002000「くっそー！\n\tあばれ馬のヤツめ\n\tクルクル　逃げやがって！\n@c0@"
  ko: "@a@b%a002000: 젠장!\n날뛰는 말이라더니\n빙빙 도망치기나 하고!\n@c0@"
  sl: "@a@b%a002000：可恶！\n　　狡猾的狂暴马，\n　　还会转圈逃跑！\n@c0@"
  tl: "@a@b%a002000：可惡！\n　　狡猾的狂暴馬，\n　　還會轉圈逃跑！\n@c0@"
17:
  en: "@a%0%a002000@bI'll show that beast who's boss. Next time we give chase, I ain't stoppin'! Ya hear me, horse!?\n@c0@"
  ja: "@a@b%a002000「次に　行ったときは\n\tあきらめずに　捕まえるまで\n\t追いかけようぜ！\n@c0@"
  ko: "@a@b%a002000: 다음에 가면\n포기하지 말고 잡을 때까지\n쫓아야겠어!\n@c0@"
  sl: "@a@b%a002000：下次咱不停下，\n　　一口气追到底！\n@c0@"
  tl: "@a@b%a002000：下次咱不停下，\n　　一口氣追到底！\n@c0@"
18:
  en: "@a%0%a002000@bHey, I think this horse is too smart for us. We need a stratergy... Uh, a strategery... Er, a plan!\n@c0@"
  ja: "@a@b%a002000「そうか！　あばれ馬を\n\tただ　追いかけるだけじゃなく\n\tなにか　作戦が　必要かもな。\n@c0@"
  ko: "@a@b%a002000: 그렇지! 날뛰는 말을\n무턱대고 쫓아갈 게 아니라\n뭔가 작전이 필요하겠어.\n@c0@"
  sl: "@a@b%a002000：对了！\n　　咱们不能一个劲地追，\n　　得想个作战计划。\n@c0@"
  tl: "@a@b%a002000：對了！\n　　咱們不能一個勁地追，\n　　得想個作戰計畫。\n@c0@"
19:
  en: "@a%0%a002000@bAhh, I feel like a new man! Fine weather we're havin', aye?\n@c0@"
  ja: "@a@b%a002000「いやあ　気分そうかいだな！\n\t天気もいいし　サイコーだぜ！\n@c0@"
  ko: "@a@b%a002000: 우와, 기분 상쾌하다!\n날씨도 좋고 최고야!\n@c0@"
  sl: "@a@b%a002000：哎呀，心情真舒畅！\n　　天气也好，这就是人生啊！\n@c0@"
  tl: "@a@b%a002000：哎呀，心情真舒暢！\n　　天氣也好，這就是人生啊！\n@c0@"
20:
  en: "@a%0%a002000@bYa gotta take a load off sometimes, %a000090. Be good to your body and it'll be good to you.\n@c0@"
  ja: "@a@b%a002000「たまには　のんびりしないと\n\t先が続かないぜ　%a000090。\n@c0@"
  ko: "@a@b%a002000: 가끔은 휴식을 취해야\n일이 술술 풀리는 법이지, %a000090.\n@c0@"
  sl: "@a@b%a002000：为了走得更远，\n　　偶尔也要休息一下，%a000090。\n@c0@"
  tl: "@a@b%a002000：為了走得更遠，\n　　偶爾也要休息一下，%a000090。\n@c0@"
21:
  en: "@a%0%a002000@bC'mon! Let's go see that old fella in the castle!\n@c0@"
  ja: "@a@b%a002000「早く　城にもどって\n\tじいさんの　ところに　行こうぜ！\n@c0@"
  ko: "@a@b%a002000: 빨리 성으로 돌아가\n영감님한테 가자고!\n@c0@"
  sl: "@a@b%a002000：咱快点回城，\n　　去找老爷子吧！\n@c0@"
  tl: "@a@b%a002000：咱快點回城，\n　　去找老爺子吧！\n@c0@"
22:
  en: "@a%0%a002000@bPeggy Sue's really tame for a wild horse...\n@c0@"
  ja: "@a@b%a002000「しかし　ファルシオンは\n\tおとなしい　馬だよな。\n@c0@"
  ko: "@a@b%a002000: 그런데 팔시온은\n얌전한 말이로군.\n@c0@"
  sl: "@a@b%a002000：法尔西昂真是一匹老实的马。\n@c0@"
  tl: "@a@b%a002000：法爾西昂真是一匹老實的馬。\n@c0@"
23:
  en: "@a%0%a002000@bAnd to think folks called her a ‘monster mustang’. Weird, aye?\n@c0@"
  ja: "@a@b%a002000「どこが　あばれ馬なんだか\n\tまったく　わからないぜ。\n@c0@"
  ko: "@a@b%a002000: 왜 날뛰는 말이라 하는지\n전혀 모르겠어.\n@c0@"
  sl: "@a@b%a002000：说它是狂暴马，\n　　不明白哪里狂了。\n@c0@"
  tl: "@a@b%a002000：說它是狂暴馬，\n　　不明白哪裡狂了。\n@c0@"
24:
  en: "@a%0%a002000@bNice! A mission straight from the big man himself! We're movin' up in the world, %a000090!\n@c0@"
  ja: "@a@b%a002000「王さまから　じきじきに\n\t仕事を　いただけるなんて\n\tオレたち　しあわせもんだな！\n@c0@"
  ko: "@a@b%a002000: 왕으로부터 직접\n일을 받았으니\n우리는 행운아야!\n@c0@"
  sl: "@a@b%a002000：国王陛下亲自下令，\n　　咱这工作太有面子了！\n@c0@"
  tl: "@a@b%a002000：國王陛下親自下令，\n　　咱這工作太有面子了！\n@c0@"
25:
  en: "@a%0%a002000@bHe picked the right guys, aye? Ra's mirror is as good as ours!\n@c0@"
  ja: "@a@b%a002000「ラーの鏡とやらを\n\tぜったいに　見つけてこようぜ！\n@c0@"
  ko: "@a@b%a002000: 라의 거울인지 뭔지\n꼭 찾아내서 갖고 오자고!\n@c0@"
  sl: "@a@b%a002000：咱们一定要找到太阳神镜！\n@c0@"
  tl: "@a@b%a002000：咱們一定要找到太陽神鏡！\n@c0@"
26:
  en: "@a%0%a002000@bIf I was a legendary mirror, where would I be? Hmm...\n@c0@"
  ja: "@a@b%a002000「しかし　ラーの鏡って\n\tいったい　どこに行けば\n\t見つかるんだろうな……。\n@c0@"
  ko: "@a@b%a002000: 그나저나 라의 거울은\n대체 어딜 가야\n찾을 수 있을까......\n@c0@"
  sl: "@a@b%a002000：但是，\n　　应该去哪里找太阳神镜……\n@c0@"
  tl: "@a@b%a002000：但是，\n　　應該去哪裡找太陽神鏡……\n@c0@"
27:
  en: "@a%0%a002000@bThat's a lonely job, guardin' that checkpoint. I'd go mad — I'm a people person, ya see.\n@c0@"
  ja: "@a@b%a002000「あんな　へんぴな\n\tところに　毎日いたら\n\tおかしくなっちまうよな。\n@c0@"
  ko: "@a@b%a002000: 저런 외진 곳에\n매일 있으면\n머리가 이상해지겠어.\n@c0@"
  sl: "@a@b%a002000：每天都待在\n　　偏僻又奇怪的地方，\n　　人也会变得奇怪。\n@c0@"
  tl: "@a@b%a002000：每天都待在\n　　偏僻又奇怪的地方，\n　　人也會變得奇怪。\n@c0@"
28:
  en: "@a%0%a002000@bLooks like we're venturin' into foreign territory. Who knows what we'll run into…\n@c0@"
  ja: "@a@b%a002000「こっから先は　他国だから\n\tどうなってるか　よくわからないって\n\t言ってたよな。\n@c0@"
  ko: "@a@b%a002000: 여기부터는 타국이어서\n어떤 상황인지 잘 모른다고\n했었지 아마.\n@c0@"
  sl: "@a@b%a002000：前面是外国领土，\n　　不知会发生什么事情，\n　　他是这么说的吧。\n@c0@"
  tl: "@a@b%a002000：前面是外國領土，\n　　不知會發生什麼事情，\n　　他是這麼說的吧。\n@c0@"
29:
  en: "@a%0%a002000@bHe said somethin' about a place to rest up north-east, aye? And then a house down south and to the west. Let's scout it out!\n@c0@"
  ja: "@a@b%a002000「どっかの岬の　小屋とか\n\t西の民家とか……。\n\tまあ　適当に　行こうぜ！\n@c0@"
  ko: "@a@b%a002000: 어느 곶의 오두막이라든가\n서쪽의 민가라든가......\n뭐, 적당히 가보자고!\n@c0@"
  sl: "@a@b%a002000：什么海角，小屋，\n　　西边的民宅……\n　　总之，一路走过去吧！\n@c0@"
  tl: "@a@b%a002000：什麼海角，小屋，\n　　西邊的民宅……\n　　總之，一路走過去吧！\n@c0@"
30:
  en: "@a%0%a002000@bThat nun in there was easy on the eyes, aye?\n@c0@"
  ja: "@a@b%a002000「いやあ　きれいな\n\tシスターさんだったよな！\n@c0@"
  ko: "@a@b%a002000: 이야, 그 수녀님\n진짜 예쁘더군!\n@c0@"
  sl: "@a@b%a002000：哇，\n　　这位修女真美！\n@c0@"
