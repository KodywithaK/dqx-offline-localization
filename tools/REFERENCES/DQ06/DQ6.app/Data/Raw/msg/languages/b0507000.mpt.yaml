  tl: "@a@b%a002020：上面的世界，\n　　雷多克城的國王\n　　好像在尋找太陽神鏡！\n@c0@"
106:
  en: "@a%0%a002000@bIt's nice to be on familiar ground again, aye?\n@c0@"
