  sl: "@a@b%a002020：听说有个国王\n　　等着用太阳神镜呢。\n@c0@"
  tl: "@a@b%a002020：聽說有個國王\n　　等著用太陽神鏡呢。\n@c0@"
102:
  en: "@a%0%a002020@bI hope you can use it to beat Murdaw!\n@c0@"
