  tl: "@a@b%a002000：走吧，\n　　到達瑪神殿遺跡的井，\n　　回上面的世界嘍！\n@c0@"
104:
  en: "@a%0%a002010@bCome, we need to get to Somnia Castle in the other world.\n@c0@"
