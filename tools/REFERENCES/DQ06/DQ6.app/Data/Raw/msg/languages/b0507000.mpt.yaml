  sl: "@a@b%a002010：那个叫%a002020的女孩\n　　还在塔里吧……\n@c0@"
  tl: "@a@b%a002010：那個叫%a002020的女孩\n　　還在塔里吧……\n@c0@"
96:
  en: "@a%0%a002000@bHuzzah! We got the mirror, %a000090!\n@c0@"
  ja: "@a@b%a002000「やったぜーーーっ！！\n\tラーの鏡を　手に入れたぜー！\n@c0@"
  ko: "@a@b%a002000: 해냈어!!\n드디어 라의 거울을 손에 넣었다!\n@c0@"
  sl: "@a@b%a002000：太棒啦！！\n　　咱们拿到太阳神镜啦！\n@c0@"
  tl: "@a@b%a002000：太棒啦！！\n　　咱們拿到太陽神鏡啦！\n@c0@"
97:
  en: "@a%0%a002000@bWe need to get back up to the Somnia Castle in our world!\n@c0@"
  ja: "@a@b%a002000「さあ　上の世界の\n\tレイドック城に　もどるぞ！\n@c0@"
  ko: "@a@b%a002000: 자, 위쪽 세계의\n레이독 성으로 돌아가자고!\n@c0@"
  sl: "@a@b%a002000：走吧，\n　　回上面世界的雷多克城！\n@c0@"
  tl: "@a@b%a002000：走吧，\n　　回上面世界的雷多克城！\n@c0@"
98:
  en: "@a%0%a002000@bWe need to get to the ruins of Alltrades east of Port Haven. That's our ticket back to our world.\n@c0@"
  ja: "@a@b%a002000「サンマリーノの東の\n\tダーマ神殿あとまで　もどらないと\n\t上の世界に　かえれないな。\n@c0@"
  ko: "@a@b%a002000: 산마리노 동쪽에 있는\n다마 신전 터까지 가야만\n위쪽 세계로 돌아갈 수 있어.\n@c0@"
