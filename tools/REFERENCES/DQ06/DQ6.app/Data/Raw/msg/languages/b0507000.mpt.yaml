  sl: "@a@b%a002010：走吧，\n　　回雷多克城！\n　　当然是上面的那个！\n@c0@"
  tl: "@a@b%a002010：走吧，\n　　回雷多克城！\n　　當然是上面的那個！\n@c0@"
100:
  en: "@a%0%a002010@bWhat's it going to be, %a000090? The ferry from Port Haven? Zoom will do the trick just as well, you know.\n@c0@"
  ja: "@a@b%a002010「どうする　%a000090？\n\tサンマリーノまで　船でもどる？\n\tルーラでも　いいわね。\n@c0@"
