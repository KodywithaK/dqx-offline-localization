  ja: "@a@b%a002000「じいさん　安心しな。\n\t今度こそ　レイドック王は\n\tムドーを　倒すぜ！\n@c0@"
  ko: "@a@b%a002000: 영감님, 걱정 마.\n이번에야말로 레이독 왕은\n무도를 쓰러뜨릴 테니!\n@c0@"
  sl: "@a@b%a002000：放心吧老爷爷。\n　　这一次，\n　　雷多克王一定能打倒姆多！\n@c0@"
  tl: "@a@b%a002000：放心吧老爺爺。\n　　這一次，\n　　雷多克王一定能打倒姆多！\n@c0@"
36:
  en: "@a%0%a002010@bI sense that this gentleman's wish is soon to be fulfilled.\n@c0@"
  ja: "@a@b%a002010「おじいさんの　願いが\n\tやっと　かないそうね。\n@c0@"
