  tl: "@a@b%a002020：我回來了！\n　　……不對，應該是初次見面！\n@c0@"
80:
  en: "@a%0%a002000@bThat wagon's been a real Goddessend.\n@c0@"
  ja: "@a@b%a002000「いや　じいさん。\n\t馬車は　じゅうぶんに\n\t役に　立ってるぜ！\n@c0@"
