  tl: "@a@b%a002010：走吧，%a000090。\n　　大家一定在等我們。\n@c0@"
67:
  en: "@a%0%a002020@bThis is so exciting!\n@c0@"
  ja: "@a@b%a002020「わく　わく！\n@c0@"
