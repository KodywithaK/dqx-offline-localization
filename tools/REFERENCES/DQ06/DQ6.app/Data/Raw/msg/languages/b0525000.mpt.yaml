  ko: "@a@b%a002000: 다행이야......\n우릴 잊지 않았어.\n젠장! 기쁘군!\n@c0@"
  sl: "@a@b%a002000：太好了……\n　　还有人记得咱们。\n　　哇哈！激动死了！\n@c0@"
  tl: "@a@b%a002000：太好了……\n　　還有人記得咱們。\n　　哇哈！激動死了！\n@c0@"
87:
  en: "@a%0%a002010@bSee? They haven't forgotten about you after all, %a000090!\n@c0@"
