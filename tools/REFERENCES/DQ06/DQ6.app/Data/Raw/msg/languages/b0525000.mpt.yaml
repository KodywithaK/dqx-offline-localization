  tl: "@a@b%a002010：別想太多。\n　　高興了就慶祝，\n　　不是挺好的嗎？\n@c0@"
49:
  en: "@a%0%a002020@bMaybe that's that déjà vu thing, huh?\n@c0@"
  ja: "@a@b%a002020「それって\n\tデジャブ　ってやつかな。\n@c0@"
