  ja: "@a@b%a002020「ふーん。　こっちの\n\tレイドック王は　ねむらないんだ。\n\t下の世界と　反対だね。\n@c0@"
  ko: "@a@b%a002020: 으흠. 이곳의\n레이독 왕은 못 자는구나.\n아래쪽 세계와 반대네.\n@c0@"
  sl: "@a@b%a002020：哦哦……\n　　这里的雷多克王不睡觉啊。\n　　和下面的世界正好相反呢。\n@c0@"
  tl: "@a@b%a002020：哦哦……\n　　這裡的雷多克王不睡覺啊。\n　　和下面的世界正好相反呢。\n@c0@"
52:
  en: "@a%0%a002020@bBoy, she doesn't look too comfy!\n@c0@"
  ja: "@a@b%a002020「ねぞう　悪いー！\n@c0@"
  ko: "@a@b%a002020: 잠버릇 참 고약하네!\n@c0@"
  sl: "@a@b%a002020：睡相真差劲！\n@c0@"
