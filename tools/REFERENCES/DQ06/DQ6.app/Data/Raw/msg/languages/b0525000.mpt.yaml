  tl: "@a@b%a002010：你的這份心意，\n　　國王一定會明白的。\n@c0@"
200:
  en: "@a%0%a002020@bMurdaw's going down for good this time.\n@c0@"
  ja: "@a@b%a002020「こんどこそ\n\tムドーの最期だもんね！\n@c0@"
  ko: "@a@b%a002020: 이번에야말로\n무도의 최후야!\n@c0@"
  sl: "@a@b%a002020：今天就是姆多的末日！\n@c0@"
  tl: "@a@b%a002020：今天就是姆多的末日！\n@c0@"
201:
  en: "@a%0%a002000@bJust think — next time we come here, Murdaw will be dead, and the world'll be at peace.\n@c0@"
