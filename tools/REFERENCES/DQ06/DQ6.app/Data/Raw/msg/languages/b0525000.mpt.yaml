  tl: "@a@b%a002020：你們旅行了\n　　那麼久了？\n@c0@"
74:
  en: "@a%0%a002000@bIf AWOL means ‘awesome without limits’, then guilty as charged!\n@c0@"
  ja: "@a@b%a002000「くっ……。\n\tなんか　さびしいぜ。\n@c0@"
  ko: "@a@b%a002000: 크윽......\n왠지 씁쓸하군.\n@c0@"
  sl: "@a@b%a002000：呜……\n　　人走茶凉啊。\n@c0@"
  tl: "@a@b%a002000：嗚……\n　　人走茶涼啊。\n@c0@"
75:
  en: "@a%0%a002010@bYou can't blame him — you really were away for rather a long time. But you did what had to be done.\n@c0@"
  ja: "@a@b%a002010「本当に　長い時間\n\t旅を　してきたんだもの。\n\tしかたないわ。\n@c0@"
  ko: "@a@b%a002010: 정말 오랜 시간\n여행을 했으니.\n어쩔 수 없어.\n@c0@"
  sl: "@a@b%a002010：我们的确旅行了很久啊。\n　　被忘掉也没办法。\n@c0@"
  tl: "@a@b%a002010：我們的確旅行了很久啊。\n　　被忘掉也沒辦法。\n@c0@"
76:
  en: "@a%0%a002020@bNo one could forget me — 'cause I wasn't around to be remembered. I'm new! \n@c0@"
  ja: "@a@b%a002020「あたしのことは\n\t知らなくて　とうぜんだね。\n@c0@"
