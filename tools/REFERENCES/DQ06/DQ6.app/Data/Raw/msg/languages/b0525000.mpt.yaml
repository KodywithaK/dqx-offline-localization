205:
  en: "@a%0%a002010@bThe method is not important — Murdaw will be defeated, by whatever means!\n@c0@"
  ja: "@a@b%a002010「大丈夫。\n\tきっと　魔王を\n\tたおしてきますから！\n@c0@"
