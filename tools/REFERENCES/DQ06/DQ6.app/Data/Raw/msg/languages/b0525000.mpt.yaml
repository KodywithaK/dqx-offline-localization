  sl: "@a@b%a002000：喂喂……\n　　只会让人记性差的魔王\n　　有什么好怕的！\n@c0@"
  tl: "@a@b%a002000：喂喂……\n　　只會讓人記性差的魔王\n　　有什麼好怕的！\n@c0@"
