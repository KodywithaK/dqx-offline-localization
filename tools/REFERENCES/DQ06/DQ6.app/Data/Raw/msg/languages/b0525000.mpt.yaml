  sl: "@a@b%a002020：不认识我很正常吧。\n@c0@"
  tl: "@a@b%a002020：不認識我很正常吧。\n@c0@"
77:
  en: "@a%0%a002000@bHow could everyone have forgotten me? Er, I mean us.\n@c0@"
