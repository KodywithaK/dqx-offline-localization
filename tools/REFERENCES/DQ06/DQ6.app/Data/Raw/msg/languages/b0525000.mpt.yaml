  tl: "@a@b%a002020：我也坐過馬車了！\n@c0@"
83:
  en: "@a%0%a002000@bHe's got a right to remain silent. We're gonna storm Murdaw's joint before Murdaw can storm us.\n@c0@"
  ja: "@a@b%a002000「安心しな。\n\t魔王が　やって来るまえに\n\tこっちから　乗りこんでやるさ！\n@c0@"
  ko: "@a@b%a002000: 안심해.\n마왕이 오기 전에 우리가\n먼저 쳐들어가 주지!\n@c0@"
  sl: "@a@b%a002000：放心吧。\n　　不用等到魔王来，\n　　俺们就先去找他了！\n@c0@"
  tl: "@a@b%a002000：放心吧。\n　　不用等到魔王來，\n　　俺們就先去找他了！\n@c0@"
