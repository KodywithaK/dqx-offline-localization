71:
  en: "@a%0%a002000@bI guess you could call it that, aye, %a000090?\n@c0@"
  ja: "@a@b%a002000「いやー　ホント\n\t長かったぜ！\n@c0@"
  ko: "@a@b%a002000: 이야, 정말\n오래 걸렸군!\n@c0@"
  sl: "@a@b%a002000：是啊，\n　　真的很久！\n@c0@"
  tl: "@a@b%a002000：是啊，\n　　真的很久！\n@c0@"
72:
  en: "@a%0%a002010@bIt was indeed quite the journey. And not without its difficulties...\n@c0@"
  ja: "@a@b%a002010「旅が　長かった分\n\tたくさん苦労も　したものね。\n@c0@"
  ko: "@a@b%a002010: 여행이 길었던 만큼\n고생도 많이 했어.\n@c0@"
  sl: "@a@b%a002010：旅行了很久，\n　　也吃了很多苦呢。\n@c0@"
  tl: "@a@b%a002010：旅行了很久，\n　　也吃了很多苦呢。\n@c0@"
73:
  en: "@a%0%a002020@bYou've all been gone for that long?\n@c0@"
  ja: "@a@b%a002020「そんな前に\n\t出発したの？\n@c0@"
  ko: "@a@b%a002020: 그렇게 오래 전에\n출발했었어?\n@c0@"
