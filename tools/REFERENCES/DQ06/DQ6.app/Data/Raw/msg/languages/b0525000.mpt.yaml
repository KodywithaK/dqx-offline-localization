  sl: "@a@b%a002020：这位老爷爷真了不起。\n　　他在为雷多克王祈祷呢。\n@c0@"
  tl: "@a@b%a002020：這位老爺爺真了不起。\n　　他在為雷多克王祈禱呢。\n@c0@"
38:
  en: "@a%0%a002000@bOut like a rock. Me, I sleep like a boulder.\n@c0@"
  ja: "@a@b%a002000「ぐっすり　ねてるな。\n@c0@"
  ko: "@a@b%a002000: 깊이 잠들었군.\n@c0@"
  sl: "@a@b%a002000：睡得真香啊。\n@c0@"
  tl: "@a@b%a002000：睡得真香啊。\n@c0@"
39:
  en: "@a%0%a002010@bIf we're looking to shop, let's visit the shops in town.\n@c0@"
  ja: "@a@b%a002010「お買い物だったら\n\t町の　お店に　行きましょ。\n@c0@"
