  sl: "@a@b%a002020：这个人很激动啊！\n@c0@"
  tl: "@a@b%a002020：這個人很激動啊！\n@c0@"
210:
  en: "@a%0%a002000@bKeating...\n@c0@"
  ja: "@a@b%a002000「ゲバン……。\n@c0@"
  ko: "@a@b%a002000: 게반......\n@c0@"
  sl: "@a@b%a002000：盖班……\n@c0@"
  tl: "@a@b%a002000：蓋班……\n@c0@"
211:
  en: "@a%0%a002010@bKeating...\n@c0@"
  ja: "@a@b%a002010「ゲバン……。\n@c0@"
  ko: "@a@b%a002010: 게반......\n@c0@"
  sl: "@a@b%a002010：盖班……\n@c0@"
  tl: "@a@b%a002010：蓋班……\n@c0@"
212:
  en: "@a%0%a002020@bOoh, is he rich!? I'll bet he worked really hard for his money!\n@c0@"
  ja: "@a@b%a002020「世界一の大金持ち！？\n\tワクワク！　ドキドキ！\n@c0@"
