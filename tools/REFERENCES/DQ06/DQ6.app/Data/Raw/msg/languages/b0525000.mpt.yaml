  en: "@a%0%a002010@bThat wasn't a very threatening monster. But still, its presence in town would have only caused unrest.\n@c0@"
  ja: "@a@b%a002010「それほど　強い\n\tまものじゃ　なかったけど\n\t町の中でも　安心できないのね。\n@c0@"
