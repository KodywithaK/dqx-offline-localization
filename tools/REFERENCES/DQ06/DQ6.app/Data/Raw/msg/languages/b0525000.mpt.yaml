  ko: "@a@b%a002000: 오우!\n@c0@"
  sl: "@a@b%a002000：哦哦！\n@c0@"
  tl: "@a@b%a002000：哦哦！\n@c0@"
187:
  en: "@a%0%a002010@bWe'll be on our way, then.\n@c0@"
