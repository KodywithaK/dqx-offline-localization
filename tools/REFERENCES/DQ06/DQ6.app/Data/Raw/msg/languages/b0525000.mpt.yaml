  ko: "@a@b%a002000: 굉장하군!\n감탄할 정도야.\n@c0@"
  sl: "@a@b%a002000：真行啊！\n　　俺真佩服他。\n@c0@"
  tl: "@a@b%a002000：真行啊！\n　　俺真佩服他。\n@c0@"
42:
  en: "@a%0%a002010@bI wish him a speedy recovery!\n@c0@"
