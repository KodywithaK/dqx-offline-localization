  sl: "@a@b%a002010：满脑子都是马车的\n　　就是这位老爷子吧。\n@c0@"
  tl: "@a@b%a002010：滿腦子都是馬車的\n　　就是這位老爺子吧。\n@c0@"
82:
  en: "@a%0%a002020@bI've never ridden in such style!\n@c0@"
  ja: "@a@b%a002020「あたしも\n\t乗せてもらってるよ！\n@c0@"
  ko: "@a@b%a002020: 나도\n타고 다니고 있어!\n@c0@"
