  sl: "@a@b%a002020：走吧走吧！\n@c0@"
  tl: "@a@b%a002020：走吧走吧！\n@c0@"
93:
  en: "@a%0%a002000@bThat's a lot of pressure, havin' the fate of folks' dreams in our hands.\n@c0@"
  ja: "@a@b%a002000「おうよ。\n\tオレたちも　いるから\n\tまちがいないぜ！\n@c0@"
