  tl: "@a@b%a002020：世界第一大富豪？！\n　　好激動哦！好興奮哦！\n@c0@"
213:
  en: "@a%0%a002000@bA good-for-nothin' in any dimension...\n@c0@"
  ja: "@a@b%a002000「会いたくないヤツに\n\t会っちまった　って感じだな……。\n@c0@"
