  en: "@a%0%a002010@bThe King truly is cunning... He didn't want Murdaw to notice his approach, so even his own subjects were kept in the dark.\n@c0@"
  ja: "@a@b%a002010「ムドーに　気づかれぬため\n\tみなさんにも　わからないほど\n\tそうっと　出かけたのでしょう。\n@c0@"
