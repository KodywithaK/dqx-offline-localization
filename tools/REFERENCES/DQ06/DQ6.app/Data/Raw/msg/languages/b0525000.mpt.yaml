  tl: "@a@b%a002020：人家覺得，\n　　即使和她在一起，\n　　也不會有人注意到吧。\n@c0@"
219:
  en: "@a%0%a002000@bThis cave leads to Murdaw's castle, aye? Feels like the whole place wants us dead.\n@c0@"
  ja: "@a@b%a002000「ここが\n\t魔王の城への　洞くつか？\n\tすごい殺気を　感じるぜ。\n@c0@"
