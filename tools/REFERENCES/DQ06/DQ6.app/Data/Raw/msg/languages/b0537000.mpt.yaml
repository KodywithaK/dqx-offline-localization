0:
  en: "@a%0%a002000@bHe has a point. You'd think the monsters would be scarce, what with Murdaw gone 'n' everything like that.\n@c0@"
  ja: "@a@b%a002000「たしかに\n\tムドーは　いなくなったのに\n\tそこが　ナゾなんだよな。\n@c0@"
  ko: "@a@b%a002000: 그래, 무도가\n쓰러진 건 맞는데\n그게 수수께끼라니까.\n@c0@"
  sl: "@a@b%a002000：没错。\n　　虽然打倒了姆多，\n　　但这点还是个谜啊。\n@c0@"
  tl: "@a@b%a002000：沒錯。\n　　雖然打倒了姆多，\n　　但這點還是個謎啊。\n@c0@"
1:
  en: "@a%0%a002010@bMonsters that should have disappeared with Murdaw's defeat are still at large...\n@c0@"
  ja: "@a@b%a002010「魔王ムドーと　ともに\n\t消え去るはずの　まものたちが\n\tまだ　あちこちに……。\n@c0@"
  ko: "@a@b%a002010: 마왕 무도와 함께\n사라졌어야 했을 마물들이\n아직도 여기저기에......\n@c0@"
  sl: "@a@b%a002010：魔王消失，\n　　魔物也应该一同消失才对，\n　　但是仍然到处都是……\n@c0@"
  tl: "@a@b%a002010：魔王消失，\n　　魔物也應該一同消失才對，\n　　但是仍然到處都是……\n@c0@"
2:
  en: "@a%0%a002010@bPerhaps their presence is not tied to his after all...\n@c0@"
  ja: "@a@b%a002010「やはり　ムドーとは\n\t何か　別の　原因が\n\tからんでいるのかしら……？\n@c0@"
  ko: "@a@b%a002010: 역시 무도와는\n별개로 뭔가 다른 원인이\n얽혀 있는 걸까......?\n@c0@"
  sl: "@a@b%a002010：果然根源不在姆多，\n　　应该还有什么\n　　别的原因吧……\n@c0@"
  tl: "@a@b%a002010：果然根源不在姆多，\n　　應該還有什麼\n　　別的原因吧……\n@c0@"
3:
  en: "@a%0%a002020@bGetting all these people down the mountain would be tough even without the monsters.\n@c0@"
  ja: "@a@b%a002020「たくさんの人を\n\t引きつれて　ここを　抜けるのは\n\t大変そうね。\n@c0@"
  ko: "@a@b%a002020: 많은 사람을\n데리고 여길 빠져나가는 건\n힘들겠어.\n@c0@"
  sl: "@a@b%a002020：带领一大群人\n　　从这里通过，\n　　好像很困难呢。\n@c0@"
  tl: "@a@b%a002020：帶領一大群人\n　　從這裡通過，\n　　好像很困難呢。\n@c0@"
4:
  en: "@a%0%a002030@bSo the number of monsters in this area has not decreased one bit...\n@c0@"
  ja: "@a@b%a002030「このあたりの\n\tまものの　かずも　へっては\n\tいないのでしょうかね。\n@c0@"
  ko: "@a@b%a002030: 이 주변의\n마물 숫자도 줄지\n않은 걸까요?\n@c0@"
  sl: "@a@b%a002030：这一带的魔物数量\n　　没有减少吧。\n@c0@"
  tl: "@a@b%a002030：這一帶的魔物數量\n　　沒有減少吧。\n@c0@"
5:
  en: "@a%0%a002050@bThis place would be perfect if it wasn't for those flippin' monsters!\n@c0@"
  ja: "@a@b%a002050「こんなに　のどかで\n\t平和そうな　ところにも\n\tまものがいるのは　残念ですね。\n@c0@"
  ko: "@a@b%a002050: 이렇게 한적하고\n평화로워 보이는 곳에도\n마물이 있다니 아쉽군요.\n@c0@"
  sl: "@a@b%a002050：这么和平安宁的地方，\n　　居然也有魔物出没，\n　　真是太遗憾了。\n@c0@"
  tl: "@a@b%a002050：這麼和平安寧的地方，\n　　居然也有魔物出沒，\n　　真是太遺憾了。\n@c0@"
6:
  en: "@a%0%a002000@bGood thing ya got out of that village, %a000090, or your legs would be puny too.\n@c0@"
  ja: "@a@b%a002000「ずっと　村から\n\t出ていなかったなら\n\t運動ぶそくに　なるかもな。\n@c0@"
  ko: "@a@b%a002000: 계속 마을 밖으로\n나가질 않았다면\n운동 부족일 수도 있겠지.\n@c0@"
  sl: "@a@b%a002000：一直在村里待着，\n　　缺乏运动了吧。\n@c0@"
  tl: "@a@b%a002000：一直在村裡待著，\n　　缺乏運動了吧。\n@c0@"
7:
  en: "@a%0%a002010@bWhat a lovely area. The air is so fresh!\n@c0@"
  ja: "@a@b%a002010「ほんとに　このあたりは\n\t空気がおいしくて　いいところよね。\n@c0@"
  ko: "@a@b%a002010: 정말 이 주변은\n공기가 신선해서 좋네.\n@c0@"
  sl: "@a@b%a002010：这一带空气真好，\n　　真是个好地方啊。\n@c0@"
  tl: "@a@b%a002010：這一帶空氣真好，\n　　真是個好地方啊。\n@c0@"
8:
  en: "@a%0%a002020@bWow, she's already tired? We're, like, a stone's throw from the village!\n@c0@"
  ja: "@a@b%a002020「村から\n\tそんなに　はなれてないのに\n\tもう　つかれちゃったのー？\n@c0@"
  ko: "@a@b%a002020: 마을에서\n얼마 안 나왔는데\n벌써 지친 거야~?\n@c0@"
  sl: "@a@b%a002020：从村子出来还没多远，\n　　这就觉得累了吗？\n@c0@"
  tl: "@a@b%a002020：從村子出來還沒多遠，\n　　這就覺得累了嗎？\n@c0@"
9:
  en: "@a%0%a002030@bI'm sure it's hard to take breaks with so many monsters at large.\n@c0@"
  ja: "@a@b%a002030「まものが\n\tうろついていては　おちおち\n\tきゅうけいも　しにくいですね。\n@c0@"
  ko: "@a@b%a002030: 마물들이\n출몰한다면 마음 놓고\n쉬기도 힘들겠군요.\n@c0@"
  sl: "@a@b%a002030：周围有魔物出没的话，\n　　实在是无法\n　　安心休息呢。\n@c0@"
  tl: "@a@b%a002030：周圍有魔物出沒的話，\n　　實在是無法\n　　安心休息呢。\n@c0@"
10:
  en: "@a%0%a002050@bWhenever I've walked too far, a good foot massage fixes me right up!\n@c0@"
  ja: "@a@b%a002050「足が　つかれたときには\n\tよーく　もむのが\n\tいちばんですね！\n@c0@"
  ko: "@a@b%a002050: 다리가 아플 때는\n잘 주물러 주는 게\n최고입니다!\n@c0@"
  sl: "@a@b%a002050：脚走疼了的话，\n　　好好揉一揉，\n　　效果最好！\n@c0@"
  tl: "@a@b%a002050：腳走疼了的話，\n　　好好揉一揉，\n　　效果最好！\n@c0@"
11:
  en: "@a%0%a002000@bCan't argue with that, aye, %a000090?\n@c0@"
  ja: "@a@b%a002000「山火事　おこさないよう\n\t気をつけて　くれよな！\n@c0@"
  ko: "@a@b%a002000: 산불 나지 않도록\n조심하라고!\n@c0@"
  sl: "@a@b%a002000：小心一点，\n　　可别引发森林大火啊！\n@c0@"
  tl: "@a@b%a002000：小心一點，\n　　可別引發森林大火啊！\n@c0@"
12:
  en: "@a%0%a002010@bIt'd be nicer if there weren't any monsters roaming around...\n@c0@"
  ja: "@a@b%a002010「せっかくの　空気が\n\tよごれそうだけど……。\n@c0@"
  ko: "@a@b%a002010: 모처럼 마시는 깨끗한 공기가\n더럽혀질 것 같은데......\n@c0@"
  sl: "@a@b%a002010：难得的好空气\n　　都要被污染了呢……\n@c0@"
  tl: "@a@b%a002010：難得的好空氣\n　　都要被污染了呢……\n@c0@"
13:
  en: "@a%0%a002020@bHe shouldn't stand so close to the cliff edge. It's windy out here!\n@c0@"
  ja: "@a@b%a002020「ごほ　ごほっ！\n\tケムリが　こっちに来たよー！\n@c0@"
  ko: "@a@b%a002020: 콜록콜록!\n연기가 이쪽으로 왔어~!\n@c0@"
  sl: "@a@b%a002020：咳咳、咳咳！\n　　烟飘到这边来了啊！\n@c0@"
  tl: "@a@b%a002020：咳咳、咳咳！\n　　煙飄到這邊來了啊！\n@c0@"
14:
  en: "@a%0%a002030@bI prefer to snuggle up indoors with a nice book, myself...\n@c0@"
  ja: "@a@b%a002030「空気が　おいしければ\n\tタバコも　おいしいんでしょうね。\n@c0@"
  ko: "@a@b%a002030: 공기가 신선하면\n담배도 맛있나 봅니다.\n@c0@"
  sl: "@a@b%a002030：空气好的话，\n　　抽烟也是别有一番风味呢。\n@c0@"
  tl: "@a@b%a002030：空氣好的話，\n　　抽煙也是別有一番風味呢。\n@c0@"
15:
  en: "@a%0%a002050@bWhat a view! Old %a002050 could get used to this!\n@c0@"
  ja: "@a@b%a002050「すいがらは　ちゃんと\n\t村まで　持ちかえって\n\tほしいですね！\n@c0@"
  ko: "@a@b%a002050: 담배꽁초는 확실하게\n마을까지 가지고 돌아가 줬으면\n좋겠군요!\n@c0@"
  sl: "@a@b%a002050：真希望\n　　能把烟蒂带回村里，\n　　不要乱扔才好！\n@c0@"
  tl: "@a@b%a002050：真希望\n　　能把煙蒂帶回村裡，\n　　不要亂扔才好！\n@c0@"
16:
  en: "@a%0%a002000@bThat's the question of the moment right there.\n@c0@"
  ja: "@a@b%a002000「うーん……。\n\tなぜ　まものが　へらないのかは\n\t悩みどころ　なんだよなあ。\n@c0@"
  ko: "@a@b%a002000: 으음......\n왜 마물이 줄지 않는지\n고민 중인데 말이야.\n@c0@"
  sl: "@a@b%a002000：唔……\n　　为什么魔物没有减少，\n　　这问题真伤脑筋啊。\n@c0@"
  tl: "@a@b%a002000：唔……\n　　為什麼魔物沒有減少，\n　　這問題真傷腦筋啊。\n@c0@"
17:
  en: "@a%0%a002010@bPerhaps it would be best for the villagers to return to Weaver's Peak.\n@c0@"
  ja: "@a@b%a002010「村の　みなさんは\n\t村に　もどったほうが\n\tいいかも　しれないわね。\n@c0@"
  ko: "@a@b%a002010: 마을 분들은\n마을로 돌아가시는 게\n좋을 것 같아.\n@c0@"
  sl: "@a@b%a002010：村里的人们\n　　还是回到村子里\n　　比较好吧。\n@c0@"
  tl: "@a@b%a002010：村裡的人們\n　　還是回到村子裡\n　　比較好吧。\n@c0@"
18:
  en: "@a%0%a002020@bIf a couple of monsters are enough to freak him out like that, he should've never left home in the first place.\n@c0@"
  ja: "@a@b%a002020「まものが　いたくらいで\n\tこわがっているなら\n\t早く　帰ったほうがいいよね。\n@c0@"
  ko: "@a@b%a002020: 마물이 있다고\n무서워 할 거면\n어서 돌아가는 게 좋겠네.\n@c0@"
  sl: "@a@b%a002020：仅仅看到个魔物\n　　就大惊小怪，\n　　还是赶紧回去待着吧。\n@c0@"
  tl: "@a@b%a002020：僅僅看到個魔物\n　　就大驚小怪，\n　　還是趕緊回去待著吧。\n@c0@"
19:
  en: "@a%0%a002030@bThe world is still a long way from being safe enough for everyone to walk around as they please.\n@c0@"
  ja: "@a@b%a002030「まだ　ふつうの人が\n\t安心して　歩き回れる\n\tじょうきょうでは　なさそうですね。\n@c0@"
  ko: "@a@b%a002030: 아직 보통 사람들이\n안심하고 돌아다닐 수 있는\n상황은 아닌 것 같습니다.\n@c0@"
  sl: "@a@b%a002030：现在这种状况，\n　　普通人还不能\n　　放心地出门呢。\n@c0@"
  tl: "@a@b%a002030：現在這種狀況，\n　　普通人還不能\n　　放心地出門呢。\n@c0@"
20:
  en: "@a%0%a002050@bIf he doesn't mind out, a monster will scare him right off the cliff!\n@c0@"
  ja: "@a@b%a002050「まものに　おどろいて\n\tガケから　落ちたりしたら\n\tあぶないですよ！\n@c0@"
  ko: "@a@b%a002050: 마물을 보고 놀라서\n벼랑에서 떨어지면\n위험하다구요!\n@c0@"
  sl: "@a@b%a002050：要是被魔物吓到，\n　　跌下悬崖的话，\n　　那可就危险了！\n@c0@"
  tl: "@a@b%a002050：要是被魔物嚇到，\n　　跌下懸崖的話，\n　　那可就危險了！\n@c0@"
21:
  en: "@a%0%a002000@bAye, I reckon the monsters made payin' proper respects pretty tough around here.\n@c0@"
  ja: "@a@b%a002000「そうか……そうだよな。\n\tまもののおかげで　みんな　ろくに\n\t墓まいりも　できなかったんだな。\n@c0@"
  ko: "@a@b%a002000: 그랬군...... 하긴.\n마물 때문에 모두들 제대로\n무덤을 찾아오지도 못했겠군.\n@c0@"
  sl: "@a@b%a002000：是吗……这样啊。\n　　因为有魔物，\n　　大家都不能好好扫墓啊。\n@c0@"
  tl: "@a@b%a002000：是嗎……這樣啊。\n　　因為有魔物，\n　　大家都不能好好掃墓啊。\n@c0@"
22:
  en: "@a%0%a002010@bSo this is where the village's dearly departed are laid to rest...\n@c0@"
  ja: "@a@b%a002010「村で　亡くなったかたは\n\tこの　ながめのいい場所で\n\tねむっているのね……。\n@c0@"
  ko: "@a@b%a002010: 마을에서 돌아가신 분들은\n이렇게 전망이 좋은 곳에서\n잠들어 있는 거구나......\n@c0@"
  sl: "@a@b%a002010：村里去世的人们，\n　　是在这么一个风景优美的地方\n　　长眠着呢……\n@c0@"
  tl: "@a@b%a002010：村裡去世的人們，\n　　是在這麼一個風景優美的地方\n　　長眠著呢……\n@c0@"
23:
  en: "@a%0%a002020@bAww. I think I'm going to cry...\n@c0@"
  ja: "@a@b%a002020「おじいさん\n\tお墓参りできて　よかったね！\n@c0@"
  ko: "@a@b%a002020: 할아버지,\n성묘할 수 있어서 다행이네!\n@c0@"
  sl: "@a@b%a002020：老爷爷，\n　　能来扫墓真是太好了呢！\n@c0@"
  tl: "@a@b%a002020：老爺爺，\n　　能來掃墓真是太好了呢！\n@c0@"
24:
  en: "@a%0%a002030@bI pray that this man's wife may rest here in peace.\n@c0@"
  ja: "@a@b%a002030「おばあさまが\n\tやすらかに　ねむり続けることを\n\tお祈りいたしましょう。\n@c0@"
  ko: "@a@b%a002030: 할머님께서\n편안히 잠드시기를\n기도하겠습니다.\n@c0@"
  sl: "@a@b%a002030：我会祈祷\n　　老奶奶能安息的。\n@c0@"
  tl: "@a@b%a002030：我會祈禱\n　　老奶奶能安息的。\n@c0@"
25:
  en: "@a%0%a002050@bA man shouldn't have to risk his life to take a trip to his wife's grave. It's just not right!\n@c0@"
  ja: "@a@b%a002050「お墓まいりも\n\t命がけ……なんてことでは\n\tシャレに　なりませんよね。\n@c0@"
  ko: "@a@b%a002050: 성묘도\n목숨 걸고 해야 하다니......\n장난 아니네요.\n@c0@"
  sl: "@a@b%a002050：连来扫墓都要\n　　豁出命去……\n　　这真是太可怕了。\n@c0@"
  tl: "@a@b%a002050：連來掃墓都要\n　　豁出命去……\n　　這真是太可怕了。\n@c0@"
26:
  en: "@a%0%a002000@b‘Culture shock’!? That sounds rough! He should see the priest, and fast!\n@c0@"
  ja: "@a@b%a002000「えー！？\n\t一歩も　村から　出たこと\n\tなかったのかよ！\n@c0@"
  ko: "@a@b%a002000: 뭐!?\n마을에서 한 발짝도 나와 본 적이\n없는 거냐?\n@c0@"
  sl: "@a@b%a002000：诶？！\n　　一步都没出过村子？\n@c0@"
  tl: "@a@b%a002000：誒？！\n　　一步都沒出過村子？\n@c0@"
27:
  en: "@a%0%a002010@bI'm sure he'll remember this day for the rest of his life!\n@c0@"
  ja: "@a@b%a002010「初めての外出？\n\tじゃあ　今日のけいけんは\n\t一生の　思い出ね。\n@c0@"
  ko: "@a@b%a002010: 첫 외출?\n그럼 오늘의 경험은\n평생의 추억이 되겠네.\n@c0@"
  sl: "@a@b%a002010：第一次出村？\n　　那么今天的际遇\n　　将成为一生的回忆呢。\n@c0@"
  tl: "@a@b%a002010：第一次出村？\n　　那麼今天的際遇\n　　將成為一生的回憶呢。\n@c0@"
28:
  en: "@a%0%a002020@bI can't imagine never leaving your hometown...but maybe that's because I can't remember mine...\n@c0@"
  ja: "@a@b%a002020「ほとんど　村から\n\t一歩もでない　人生……\n\tそういう人も　いるのねえ。\n@c0@"
  ko: "@a@b%a002020: 마을에서 거의\n한 발짝도 나오지 않는 인생......\n그런 사람도 있구나.\n@c0@"
  sl: "@a@b%a002020：这辈子一步都没有\n　　踏出过村子……\n　　天下之大无奇不有啊。\n@c0@"
  tl: "@a@b%a002020：這輩子一步都沒有\n　　踏出過村子……\n　　天下之大無奇不有啊。\n@c0@"
29:
  en: "@a%0%a002030@bPerhaps he will get bitten by the travel bug and one day venture further afield.\n@c0@"
  ja: "@a@b%a002030「見るもの　聞くもの\n\tめずらしいことだらけ\n\tでしょうねえ。\n@c0@"
  ko: "@a@b%a002030: 보는 것이나 듣는 것\n모두 신기함으로\n가득하겠군요.\n@c0@"
  sl: "@a@b%a002030：所见所闻\n　　一定都觉得非常新鲜吧。\n@c0@"
  tl: "@a@b%a002030：所見所聞\n　　一定都覺得非常新鮮吧。\n@c0@"
30:
  en: "@a%0%a002050@bThere's a whole wide world out there for him to explore!\n@c0@"
  ja: "@a@b%a002050「これからは　ちょくちょく\n\tあちこちに　出かけられるように\n\tなるといいですね！\n@c0@"
  ko: "@a@b%a002050: 앞으로는 이따금\n여기저기로 외출할 수 있게\n되면 좋겠군요!\n@c0@"
  sl: "@a@b%a002050：要是今后能够\n　　去更多的地方\n　　就好了呢。\n@c0@"
  tl: "@a@b%a002050：要是今後能夠\n　　去更多的地方\n　　就好了呢。\n@c0@"
31:
  en: "@a%0%a002000@bIt takes a pretty silly innkeeper to set up shop here, aye?\n@c0@"
  ja: "@a@b%a002000「それにしても\n\tよく　こんなところで　宿屋を\n\tやろうなんて　考えたよな。\n@c0@"
  ko: "@a@b%a002000: 그나저나\n용케도 이런 곳에 여관을\n낼 생각을 했군.\n@c0@"
  sl: "@a@b%a002000：不过，\n　　他居然想着\n　　在这里开旅店呢。\n@c0@"
  tl: "@a@b%a002000：不過，\n　　他居然想著\n　　在這裡開旅店呢。\n@c0@"
32:
  en: "@a%0%a002010@bI hope monsters do not venture inside this inn...\n@c0@"
  ja: "@a@b%a002010「まものが\n\t泊まりに　きたり\n\tしないのかしら……。\n@c0@"
  ko: "@a@b%a002010: 마물이\n묵으러 오는 건\n아닐까......\n@c0@"
  sl: "@a@b%a002010：不会有魔物\n　　跑来投宿的吧……\n@c0@"
  tl: "@a@b%a002010：不會有魔物\n　　跑來投宿的吧……\n@c0@"
33:
  en: "@a%0%a002020@bHow does this inn stay in business? I thought location was everything!\n@c0@"
  ja: "@a@b%a002020「この　宿屋さん\n\tこんなに　めだたないところで\n\t商売　なりたってるのかな。\n@c0@"
  ko: "@a@b%a002020: 이 여관 주인 아저씨는\n이렇게 눈에 띄지 않는 곳에서\n장사가 되나?\n@c0@"
  sl: "@a@b%a002020：这个旅店老板\n　　居然在这么个不起眼的地方\n　　做生意么？\n@c0@"
  tl: "@a@b%a002020：這個旅店老闆\n　　居然在這麼個不起眼的地方\n　　做生意麼？\n@c0@"
34:
  en: "@a%0%a002030@bIt is always such fun to stumble upon secluded places such as this.\n@c0@"
  ja: "@a@b%a002030「ま　こういう　山奥の\n\tかくれが的な　宿を\n\t見つけるのも　旅の楽しみですね。\n@c0@"
  ko: "@a@b%a002030: 뭐, 이런 깊은 산속의\n숨은 여관 같은 곳을\n찾는 것도 여행의 묘미겠군요.\n@c0@"
  sl: "@a@b%a002030：哎，能在这样的深山老林里\n　　找到个避人耳目的旅店，\n　　也算是旅途中的乐趣吧。\n@c0@"
  tl: "@a@b%a002030：哎，能在這樣的深山老林裡\n　　找到個避人耳目的旅店，\n　　也算是旅途中的樂趣吧。\n@c0@"
35:
  en: "@a%0%a002050@bYou don't get a lot of sunlight in this inn!\n@c0@"
  ja: "@a@b%a002050「いっちゃ　悪いですけど\n\t日あたりの悪い　宿ですね……。\n@c0@"
  ko: "@a@b%a002050: 이런 말 미안하지만\n햇볕이 안 드는 여관이네요......\n@c0@"
  sl: "@a@b%a002050：虽然这么说有点冒犯，\n　　但是这旅店采光真差……\n@c0@"
  tl: "@a@b%a002050：雖然這麼說有點冒犯，\n　　但是這旅店採光真差……\n@c0@"
36:
  en: "@a%0%a002000@bWhoa! This place is hoppin'!\n@c0@"
  ja: "@a@b%a002000「こりゃまた\n\tずいぶんと　にぎわってるな。\n@c0@"
  ko: "@a@b%a002000: 오호라, 엄청\n북적대는구먼.\n@c0@"
  sl: "@a@b%a002000：没想到这里\n　　又这么热闹了啊。\n@c0@"
  tl: "@a@b%a002000：沒想到這裡\n　　又這麼熱鬧了啊。\n@c0@"
37:
  en: "@a%0%a002010@bBazaars are always so exciting!\n@c0@"
  ja: "@a@b%a002010「バザーって\n\tなんだか　わくわくするわね。\n@c0@"
  ko: "@a@b%a002010: 장터는 왠지\n마음을 설레게 해.\n@c0@"
  sl: "@a@b%a002010：集市啊，\n　　好像有点期待呢。\n@c0@"
  tl: "@a@b%a002010：集市啊，\n　　好像有點期待呢。\n@c0@"
38:
  en: "@a%0%a002020@bOoh, a bazaar! That means shopping! Yippee!\n@c0@"
  ja: "@a@b%a002020「わーい！\n\tバザーだよ！\n@c0@"
  ko: "@a@b%a002020: 와~!\n장이 열렸다!\n@c0@"
  sl: "@a@b%a002020：哇！赶集咯！\n@c0@"
  tl: "@a@b%a002020：哇！趕集咯！\n@c0@"
39:
  en: "@a%0%a002030@bI dare say we may be able to stumble across some real bargains in this town.\n@c0@"
  ja: "@a@b%a002030「この町で\n\tなにか　掘りだしものが\n\t見つかれば　楽しいですね。\n@c0@"
  ko: "@a@b%a002030: 이 마을에서\n좋은 물건을 싸게 얻게 되면\n재밌겠는걸요.\n@c0@"
  sl: "@a@b%a002030：要是能在这个镇上\n　　发现什么价廉物美的东西\n　　就再好不过了。\n@c0@"
  tl: "@a@b%a002030：要是能在這個鎮上\n　　發現什麼價廉物美的東西\n　　就再好不過了。\n@c0@"
40:
  en: "@a%0%a002050@bA bazaar! You don't get many of these where I come from!\n@c0@"
  ja: "@a@b%a002050「いやー　バザーですか！\n\t楽しそうですねー！\n@c0@"
  ko: "@a@b%a002050: 이야~ 장이 섰군요!\n재밌겠네요~\n@c0@"
  sl: "@a@b%a002050：哎呀，集市啊！\n　　看起来真有趣呢！\n@c0@"
  tl: "@a@b%a002050：哎呀，集市啊！\n　　看起來真有趣呢！\n@c0@"
41:
  en: "@a%0%a002000@bTime to put our scoutin' skills to the test!\n@c0@"
  ja: "@a@b%a002000「オレたち\n\tあちこち　歩き回るのは\n\tとくいだよな！\n@c0@"
  ko: "@a@b%a002000: 여기저기\n돌아다니는 건\n우리 전문이지!\n@c0@"
  sl: "@a@b%a002000：四处转悠这种事，\n　　可是咱的强项啊！\n@c0@"
  tl: "@a@b%a002000：四處轉悠這種事，\n　　可是咱的強項啊！\n@c0@"
42:
  en: "@a%0%a002010@bWith all these shops, the competition for business is red-hot!\n@c0@"
  ja: "@a@b%a002010「お店が　たくさんあるから\n\tきょうそうが　はげしいのね。\n@c0@"
  ko: "@a@b%a002010: 가게가 많아서\n경쟁이 심한가 봐.\n@c0@"
  sl: "@a@b%a002010：店铺这么多，\n　　竞争一定很激烈吧。\n@c0@"
  tl: "@a@b%a002010：店鋪這麼多，\n　　競爭一定很激烈吧。\n@c0@"
43:
  en: "@a%0%a002020@bI guess the point is...it pays to shop around!\n@c0@"
  ja: "@a@b%a002020「同じものを　売っている\n\tお店を　いくつか\n\tまわってみれば　いいのね？\n@c0@"
  ko: "@a@b%a002020: 같은 물건을 파는\n가게를 몇 곳\n돌아다녀 보면 되는 거지?\n@c0@"
  sl: "@a@b%a002020：货比三家\n　　比较好吧？\n@c0@"
  tl: "@a@b%a002020：貨比三家\n　　比較好吧？\n@c0@"
44:
  en: "@a%0%a002030@bThis gentleman's advice is most sound.\n@c0@"
  ja: "@a@b%a002030「なかなか　しんせつな\n\tかたですね。\n@c0@"
  ko: "@a@b%a002030: 정말 친절한\n분이군요.\n@c0@"
  sl: "@a@b%a002030：真是个热心人呢。\n@c0@"
  tl: "@a@b%a002030：真是個熱心人呢。\n@c0@"
45:
  en: "@a%0%a002050@bSo let me get this straight — you'll find the same item at different prices depending on the shop?\n@c0@"
  ja: "@a@b%a002050「この町では　お店によって\n\t同じ品物でも　ねだんが\n\tちがう……ってことでしょうか？\n@c0@"
  ko: "@a@b%a002050: 이 마을에서는 같은 물건이라도\n가게에 따라 가격이\n다르다......는 얘긴가요?\n@c0@"
  sl: "@a@b%a002050：也就是说这个镇上，\n　　即使卖的东西一样，\n　　不同的店价钱也不同吧……\n@c0@"
  tl: "@a@b%a002050：也就是說這個鎮上，\n　　即使賣的東西一樣，\n　　不同的店價錢也不同吧……\n@c0@"
46:
  en: "@a%0%a002000@bHe wasn't sellin' anything we haven't seen before, aye?\n@c0@"
  ja: "@a@b%a002000「そんなに　めずらしいものは\n\t売ってなかったな。\n@c0@"
  ko: "@a@b%a002000: 그렇게 진귀한 물건은\n없었군.\n@c0@"
  sl: "@a@b%a002000：没什么稀奇宝贝在卖啊。\n@c0@"
  tl: "@a@b%a002000：沒什麼稀奇寶貝在賣啊。\n@c0@"
47:
  en: "@a%0%a002010@bHe always seems to be a step behind...\n@c0@"
  ja: "@a@b%a002010「いつも　ワンテンポ\n\t人より　おくれるタイプの人\n\tみたいね。\n@c0@"
  ko: "@a@b%a002010: 항상 남들보다\n한 템포씩 늦는\n타입인가 봐.\n@c0@"
  sl: "@a@b%a002010：好像是个\n　　慢悠悠的人呢，\n　　总是比别人慢半拍。\n@c0@"
  tl: "@a@b%a002010：好像是個\n　　慢悠悠的人呢，\n　　總是比別人慢半拍。\n@c0@"
48:
  en: "@a%0%a002020@bThis poor guy's either the worst businessman ever, or the unluckiest — or both!\n@c0@"
  ja: "@a@b%a002020「いつもこんな　すみっこで\n\tお店を　開いてるの？\n\tなんだか　かわいそう……。\n@c0@"
  ko: "@a@b%a002020: 항상 이렇게 구석에서\n가게를 여는 거야?\n왠지 불쌍하네......\n@c0@"
  sl: "@a@b%a002020：一直都是在\n　　这种角落里开店么？\n　　好可怜……\n@c0@"
  tl: "@a@b%a002020：一直都是在\n　　這種角落裡開店麼？\n　　好可憐……\n@c0@"
49:
  en: "@a%0%a002030@bThat does seem a rather strange place for a shop. But it's intriguing nonetheless.\n@c0@"
  ja: "@a@b%a002030「へんな　場所だから\n\tぎゃくに目立つ　という\n\tところは　あるかもしれませんね。\n@c0@"
  ko: "@a@b%a002030: 희한한 곳이니\n반대로 눈에 띄는 면도\n없잖아 있겠네요.\n@c0@"
  sl: "@a@b%a002030：这地方这么奇怪，\n　　说不定反而\n　　更引人注目呢。\n@c0@"
  tl: "@a@b%a002030：這地方這麼奇怪，\n　　說不定反而\n　　更引人注目呢。\n@c0@"
50:
  en: "@a%0%a002050@bIf he'd only munched on a few seeds of agility, he might've fared better.\n@c0@"
  ja: "@a@b%a002050「こういう人は\n\tすばやさのタネを\n\tたくさん　食べないと！\n@c0@"
  ko: "@a@b%a002050: 이런 사람은\n민첩의 씨앗을\n잔뜩 먹어야겠군요!\n@c0@"
  sl: "@a@b%a002050：这种人就应该\n　　多吃敏捷种子！\n@c0@"
  tl: "@a@b%a002050：這種人就應該\n　　多吃敏捷種子！\n@c0@"
51:
  en: "@a%0%a002000@bFolks pay more attention when you're tough, aye, %a000090? Welcome to my world.\n@c0@"
  ja: "@a@b%a002000「%a000090は　もう\n\tここでは　顔なじみなんだな。\n@c0@"
  ko: "@a@b%a002000: %a000090%F0090%X는%Y은%Z 여기 사람들과\n안면을 트고 있나 보군.\n@c0@"
  sl: "@a@b%a002000：%a000090\n　　已经是这里的常客了吧。\n@c0@"
  tl: "@a@b%a002000：%a000090\n　　已經是這裡的常客了吧。\n@c0@"
52:
  en: "@a%0%a002010@bLots of people here seem to know you, %a000090.\n@c0@"
  ja: "@a@b%a002010「この町は\n\t%a000090の　知りあいが\n\tたくさん　いそうね。\n@c0@"
  ko: "@a@b%a002010: 이 마을에는\n%a000090의 지인이\n많이 있을 것 같네.\n@c0@"
  sl: "@a@b%a002010：这个镇上好像有不少\n　　%a000090的熟人呢。\n@c0@"
  tl: "@a@b%a002010：這個鎮上好像有不少\n　　%a000090的熟人呢。\n@c0@"
53:
  en: "@a%0%a002020@bIs she saying you used to be a weakling, %a000090?\n@c0@"
  ja: "@a@b%a002020「ふうん……\n\tということは　%a000090って\n\t前は　たよりなかったの？\n@c0@"
  ko: "@a@b%a002020: 흐음......\n그럼 %a000090%F0090%X는%Y은%Z\n옛날엔 비실비실했단 말이야?\n@c0@"
  sl: "@a@b%a002020：唔……也就是说\n　　之前的%a000090，\n　　不怎么可靠吧？\n@c0@"
  tl: "@a@b%a002020：唔……也就是說\n　　之前的%a000090，\n　　不怎麼可靠吧？\n@c0@"
54:
  en: "@a%0%a002030@bShe is clearly a born saleswoman — she remembers all of her customers.\n@c0@"
  ja: "@a@b%a002030「商売とはいえ\n\tちゃんと　お客さんのことを\n\t見ているんですね。\n@c0@"
  ko: "@a@b%a002030: 장사를 위해서긴 하겠지만\n그래도 손님을 제대로 보고\n기억하고 있군요.\n@c0@"
  sl: "@a@b%a002030：虽然只是一个商贩，\n　　对客人的事情\n　　倒很留心呢。\n@c0@"
  tl: "@a@b%a002030：雖然只是一個商販，\n　　對客人的事情\n　　倒很留心呢。\n@c0@"
55:
  en: "@a%0%a002050@bThis stunner is an acquaintance of yours, %a000090? I'm impressed!\n@c0@"
  ja: "@a@b%a002050「こんな　キレイな方が\n\t%a000090さんの　お知り合い！？\n\tうらやましいです！\n@c0@"
  ko: "@a@b%a002050: 이렇게 아름다운 분이\n%a000090 님과 아는 사이!?\n부럽습니다!\n@c0@"
  sl: "@a@b%a002050：这么漂亮的人居然是\n　　%a000090的熟人？！\n　　羡慕嫉妒恨啊！\n@c0@"
  tl: "@a@b%a002050：這麼漂亮的人居然是\n　　%a000090的熟人？！\n　　羡慕嫉妒恨啊！\n@c0@"
56:
  en: "@a%0%a002000@bHmm. Do folks really care that much about crowns?\n@c0@"
  ja: "@a@b%a002000「ふうん\n\t精霊のかんむり　か……。\n@c0@"
  ko: "@a@b%a002000: 흐음,\n정령의 화관이라......\n@c0@"
  sl: "@a@b%a002000：唔，\n　　精灵之冠啊……\n@c0@"
  tl: "@a@b%a002000：唔，\n　　精靈之冠啊……\n@c0@"
57:
  en: "@a%0%a002010@bCliff's crown-making skills are held in high esteem.\n@c0@"
  ja: "@a@b%a002010「ビルテさんは\n\tだれもが　認めるほどの\n\tうでききなのね。\n@c0@"
  ko: "@a@b%a002010: 빌테 씨는\n누구나 인정할 정도의\n실력자구나.\n@c0@"
  sl: "@a@b%a002010：比尔特先生的手艺，\n　　大家一致赞赏呢。\n@c0@"
  tl: "@a@b%a002010：比爾特先生的手藝，\n　　大家一致讚賞呢。\n@c0@"
58:
  en: "@a%0%a002020@bI wish I could try on one of those crowns for myself!\n@c0@"
  ja: "@a@b%a002020「精霊のかんむり……\n\tあたしも　かぶってみたい！\n@c0@"
  ko: "@a@b%a002020: 정령의 화관......\n나도 써 보고 싶어!\n@c0@"
  sl: "@a@b%a002020：精灵之冠……\n　　我也想戴戴看啊！\n@c0@"
  tl: "@a@b%a002020：精靈之冠……\n　　我也想戴戴看啊！\n@c0@"
59:
  en: "@a%0%a002030@bThis fellow seems to know which way the world is going.\n@c0@"
  ja: "@a@b%a002030「なかなか　世の中を\n\t読んでいる　かたですね……。\n@c0@"
  ko: "@a@b%a002030: 세상 돌아가는 걸\n잘 읽고 있는 분이군요......\n@c0@"
  sl: "@a@b%a002030：好像是一位\n　　通晓世事的人呢……\n@c0@"
  tl: "@a@b%a002030：好像是一位\n　　通曉世事的人呢……\n@c0@"
60:
  en: "@a%0%a002050@bI wouldn't mind tryin' a spirit crown on for size!\n@c0@"
  ja: "@a@b%a002050「精霊のかんむり……\n\t私も　かぶってみたいです！\n@c0@"
  ko: "@a@b%a002050: 정령의 화관......\n저도 써 보고 싶습니다!\n@c0@"
  sl: "@a@b%a002050：精灵之冠……\n　　我也想戴一戴啊！\n@c0@"
  tl: "@a@b%a002050：精靈之冠……\n　　我也想戴一戴啊！\n@c0@"
61:
  en: "@a%0%a002000@bIt's good to see that guy outlived Murdaw, aye?\n@c0@"
  ja: "@a@b%a002000「じいさん\n\tムドーが　たおれるまで\n\t長生きしてきて　よかったな！\n@c0@"
  ko: "@a@b%a002000: 영감님,\n무도가 쓰러질 때까지\n장수한 보람이 있군!\n@c0@"
  sl: "@a@b%a002000：老人家能看到\n　　姆多被打倒这一天的到来，\n　　真是太好了啊！\n@c0@"
  tl: "@a@b%a002000：老人家能看到\n　　姆多被打倒這一天的到來，\n　　真是太好了啊！\n@c0@"
62:
  en: "@a%0%a002010@bHis aura is shimmering with joy.\n@c0@"
  ja: "@a@b%a002010「おじいさん\n\tほんとうに　うれしそうね。\n@c0@"
  ko: "@a@b%a002010: 할아버지\n정말 기뻐하고 계셔.\n@c0@"
  sl: "@a@b%a002010：老爷爷看起来\n　　真的很开心呢。\n@c0@"
  tl: "@a@b%a002010：老爺爺看起來\n　　真的很開心呢。\n@c0@"
63:
  en: "@a%0%a002020@bYou can tell he really loves life. And turnips.\n@c0@"
