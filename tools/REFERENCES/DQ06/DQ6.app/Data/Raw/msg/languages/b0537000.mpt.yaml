71:
  en: "@a%0%a002000@bGivin' thanks to Murdaw's a good way to get roughed up, if ya ask me.\n@c0@"
  ja: "@a@b%a002000「うはは。\n\tいくらなんでも　魔王に\n\tかんしゃするなよ。\n@c0@"
  ko: "@a@b%a002000: 우하하.\n아무리 그래도 마왕한테\n고마워하지는 말라고.\n@c0@"
