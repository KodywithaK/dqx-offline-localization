129:
  en: "@a%0%a002010@bThe people of this town must have a sixth sense for rumours!\n@c0@"
  ja: "@a@b%a002010「みんな　うわさ話には\n\tびんかんなのね。\n@c0@"
  ko: "@a@b%a002010: 모두들 소문에는\n민감하구나.\n@c0@"
  sl: "@a@b%a002010：大家对市井传言\n　　挺敏感的呢。\n@c0@"
  tl: "@a@b%a002010：大家對市井傳言\n　　挺敏感的呢。\n@c0@"
130:
  en: "@a%0%a002020@bIt can't be a good feeling to have your king go missing.\n@c0@"
  ja: "@a@b%a002020「そりゃあ\n\t王さまが　いなくなったら\n\tだれでも　心配するわよね。\n@c0@"
  ko: "@a@b%a002020: 거야\n왕이 없어지면\n누구나 걱정하지 않겠어?\n@c0@"
  sl: "@a@b%a002020：那是肯定的啊。\n　　国王陛下要是不在了的话，\n　　没人不担心吧。\n@c0@"
  tl: "@a@b%a002020：那是肯定的啊。\n　　國王陛下要是不在了的話，\n　　沒人不擔心吧。\n@c0@"
131:
  en: "@a%0%a002030@bI pray for the day when rumours are replaced by solid, verifiable facts...\n@c0@"
  ja: "@a@b%a002030「いつの日か\n\tうわさではなく　真実が\n\t人びとに　伝わることでしょう。\n@c0@"
  ko: "@a@b%a002030: 언젠가\n소문이 아닌 진실이\n사람들에게 전해질 겁니다.\n@c0@"
  sl: "@a@b%a002030：总有一天，\n　　人们一定能知道真相，\n　　而不是传言吧。\n@c0@"
  tl: "@a@b%a002030：總有一天，\n　　人們一定能知道真相，\n　　而不是傳言吧。\n@c0@"
132:
  en: "@a%0%a002050@bSeems the rumour mill is workin' overtime these days!\n@c0@"
  ja: "@a@b%a002050「いろんな　うわさが\n\t流れているもんですねえ。\n@c0@"
  ko: "@a@b%a002050: 다양한 소문이\n떠돌고 있군요.\n@c0@"
  sl: "@a@b%a002050：传言真不少呢。\n@c0@"
  tl: "@a@b%a002050：傳言真不少呢。\n@c0@"
133:
  en: "@a%0%a002000@bAye, but my old man can make stuff better than his. \n@c0@"
  ja: "@a@b%a002000「うまいって　いっても\n\tいろいろ　あるからな……。\n@c0@"
  ko: "@a@b%a002000: 잘한다는 말에도\n여러 가지 뜻이 있으니......\n@c0@"
  sl: "@a@b%a002000：所谓的做生意拿手，\n　　意思也是多种多样啊……\n@c0@"
  tl: "@a@b%a002000：所謂的做生意拿手，\n　　意思也是多種多樣啊……\n@c0@"
134:
  en: "@a%0%a002010@bI wonder which one is his father...\n@c0@"
  ja: "@a@b%a002010「お父さんって\n\tどのひとかしら……。\n@c0@"
  ko: "@a@b%a002010: 이 아이의 아빠는\n과연 누굴까......\n@c0@"
  sl: "@a@b%a002010：他的爸爸是谁呢……\n@c0@"
  tl: "@a@b%a002010：他的爸爸是誰呢……\n@c0@"
135:
  en: "@a%0%a002020@bMaybe he's right, maybe not. I don't know my dad, so...\n@c0@"
  ja: "@a@b%a002020「ふうん……。\n\t商売が　うまいって\n\tどういうことかなあ。\n@c0@"
  ko: "@a@b%a002020: 흐음......\n장사를 잘한다니\n무슨 의미일까.\n@c0@"
  sl: "@a@b%a002020：唔……\n　　做生意很拿手\n　　是怎么回事呢？\n@c0@"
  tl: "@a@b%a002020：唔……\n　　做生意很拿手\n　　是怎麼回事呢？\n@c0@"
136:
  en: "@a%0%a002030@bHis father may be nothing but a swindler. We must be on our guard.\n@c0@"
  ja: "@a@b%a002030「口のうまい　店主には\n\t気をつけたほうが　いいかも\n\tしれませんね。\n@c0@"
  ko: "@a@b%a002030: 말주변이 좋은 상인은\n조심하는 게 좋을지도\n모르겠군요.\n@c0@"
  sl: "@a@b%a002030：对于油嘴滑舌的店主，\n　　还是小心为上。\n@c0@"
  tl: "@a@b%a002030：對於油嘴滑舌的店主，\n　　還是小心為上。\n@c0@"
137:
  en: "@a%0%a002050@bThis lad seems to have the gift of the gab. I'm sure he'll grow up to be a fine salesman too!\n@c0@"
  ja: "@a@b%a002050「この　お子さんにも\n\tお父さんの　すばらしい素質が\n\t受けつがれるのでしょうね！\n@c0@"
  ko: "@a@b%a002050: 이 아이도\n아버지의 훌륭한 능력을\n이어받았겠군요!\n@c0@"
  sl: "@a@b%a002050：这个孩子\n　　继承了他父亲\n　　优秀的素质吧！\n@c0@"
  tl: "@a@b%a002050：這個孩子\n　　繼承了他父親\n　　優秀的素質吧！\n@c0@"
138:
  en: "@a%0%a002000@bHardy har! It's good to see the quiet brother gettin' excited for a change.\n@c0@"
  ja: "@a@b%a002000「兄弟対決は\n\tまだ　続いているんだな。\n@c0@"
  ko: "@a@b%a002000: 형제간의 대결은\n아직 계속되고 있나 보군.\n@c0@"
  sl: "@a@b%a002000：兄弟对决\n　　还在继续啊。\n@c0@"
  tl: "@a@b%a002000：兄弟對決\n　　還在繼續啊。\n@c0@"
139:
  en: "@a%0%a002010@bHe's quite excited, isn't he!\n@c0@"
  ja: "@a@b%a002010「すごい\n\t意気込み　だわね。\n@c0@"
  ko: "@a@b%a002010: 의욕이\n대단한걸.\n@c0@"
  sl: "@a@b%a002010：这是要血战到底呢。\n@c0@"
  tl: "@a@b%a002010：這是要血戰到底呢。\n@c0@"
140:
  en: "@a%0%a002020@bHe must be doing pretty well!\n@c0@"
  ja: "@a@b%a002020「そんなに\n\tもうけたのかしら……。\n@c0@"
  ko: "@a@b%a002020: 그렇게 많이\n벌었나......\n@c0@"
  sl: "@a@b%a002020：真的赚了\n　　那么多钱吗……\n@c0@"
  tl: "@a@b%a002020：真的賺了\n　　那麼多錢嗎……\n@c0@"
141:
  en: "@a%0%a002030@bWhen your rival is your own flesh and blood, it adds an extra element to the competition.\n@c0@"
  ja: "@a@b%a002030「ライバルが\n\t兄さんで　あるから　なおさら\n\t燃えるのでしょうね。\n@c0@"
  ko: "@a@b%a002030: 라이벌이\n형이라면 더더욱\n의지가 불타오르겠군요.\n@c0@"
  sl: "@a@b%a002030：对手是\n　　自己的哥哥，\n　　斗志肯定更旺盛吧。\n@c0@"
  tl: "@a@b%a002030：對手是\n　　自己的哥哥，\n　　鬥志肯定更旺盛吧。\n@c0@"
142:
  en: "@a%0%a002050@bWhat I wouldn't give to know how much profit this fellow's made today!\n@c0@"
  ja: "@a@b%a002050「こしが　ぬけてもいいですから\n\tどのくらい　もうかったのか\n\t聞いてみたいです！\n@c0@"
  ko: "@a@b%a002050: 놀라 나자빠져도 상관없으니\n얼마나 벌었는지\n들어 보고 싶군요!\n@c0@"
  sl: "@a@b%a002050：好想去问一问\n　　他赚了多少啊。\n　　我已经做好吃惊的准备了。\n@c0@"
  tl: "@a@b%a002050：好想去問一問\n　　他賺了多少啊。\n　　我已經做好吃驚的準備了。\n@c0@"
143:
  en: "@a%0%a002000@bWho needs help puttin' on a kilt?\n@c0@"
  ja: "@a@b%a002000「そりゃあ　まあ\n\t人に　まいてもらうような\n\tものじゃないけどな……。\n@c0@"
  ko: "@a@b%a002000: 거야 뭐,\n이걸 남한테 감아 달라고\n하기도 그렇고......\n@c0@"
  sl: "@a@b%a002000：这东西，\n　　看起来不是给人穿的呢……\n@c0@"
  tl: "@a@b%a002000：這東西，\n　　看起來不是給人穿的呢……\n@c0@"
144:
  en: "@a%0%a002010@bNormally five hundred gold coins, eh? I wonder...\n@c0@"
  ja: "@a@b%a002010「それって　ふつうは\n\t５００ゴールドなんて\n\tしないんじゃないかしら？\n@c0@"
  ko: "@a@b%a002010: 그거 보통\n500골드도\n안 하는 물건 아닐까?\n@c0@"
  sl: "@a@b%a002010：这东西\n　　平常也卖不了\n　　５００金币吧？\n@c0@"
  tl: "@a@b%a002010：這東西\n　　平常也賣不了\n　　５００金幣吧？\n@c0@"
145:
  en: "@a%0%a002020@bYou say kilt, I say skirt. I'd never wear that anyway!\n@c0@"
  ja: "@a@b%a002020「かわのこしまき？\n\tあたしは　着ないわよ！\n@c0@"
  ko: "@a@b%a002020: 가죽 허리 덧옷?\n난 안 입을 거야!\n@c0@"
  sl: "@a@b%a002020：皮腰带？\n　　人家才不要穿！\n@c0@"
  tl: "@a@b%a002020：皮腰帶？\n　　人家才不要穿！\n@c0@"
146:
  en: "@a%0%a002030@bI have little time for sartorial matters but is a leather kilt really a practical item of clothing?\n@c0@"
  ja: "@a@b%a002030「ふうむ……\n\tあまり　じつようせいは\n\tなさそうな気が　しますが。\n@c0@"
  ko: "@a@b%a002030: 흐음......\n별로 실용성은\n없을 것 같습니다만.\n@c0@"
  sl: "@a@b%a002030：唔……\n　　看上去\n　　实用性不大呢。\n@c0@"
  tl: "@a@b%a002030：唔……\n　　看上去\n　　實用性不大呢。\n@c0@"
147:
  en: "@a%0%a002050@bA leather kilt!? It's not really my style, but I'll wear it if it makes you happy, %a000090.\n@c0@"
  ja: "@a@b%a002050「かわのこしまき　ですか！？\n\tま　%a000090さんが　使えと\n\tおっしゃるなら　使いますが……。\n@c0@"
  ko: "@a@b%a002050: 가죽 허리 덧옷이요!?\n뭐, %a000090 님이 쓰라고\n하시면 쓰겠지만......\n@c0@"
  sl: "@a@b%a002050：皮腰带？！\n　　唉，要是%a000090硬要我穿的话，\n　　我也不是不能穿……\n@c0@"
  tl: "@a@b%a002050：皮腰帶？！\n　　唉，要是%a000090硬要我穿的話，\n　　我也不是不能穿……\n@c0@"
148:
  en: "@a%0%a002000@bNever mind. It's not like we're in a big rush to buy the thing.\n@c0@"
  ja: "@a@b%a002000「まあ　べつに\n\tいま急いで　買わなければ\n\tいけないわけじゃないさ。\n@c0@"
  ko: "@a@b%a002000: 뭐, 딱히\n지금 서둘러 사야 하는\n물건도 아니잖아.\n@c0@"
  sl: "@a@b%a002000：唉，\n　　又不是现在\n　　非买不可啊。\n@c0@"
  tl: "@a@b%a002000：唉，\n　　又不是現在\n　　非買不可啊。\n@c0@"
149:
  en: "@a%0%a002010@bBazaars aren't much fun with empty pockets. Let's go, %a000090.\n@c0@"
  ja: "@a@b%a002010「お金も　ないことだし\n\tもう　いきましょうね。\n@c0@"
  ko: "@a@b%a002010: 돈도 없으니\n그만 가자.\n@c0@"
  sl: "@a@b%a002010：我们已经没钱了。\n　　还是赶紧走吧。\n@c0@"
  tl: "@a@b%a002010：我們已經沒錢了。\n　　還是趕緊走吧。\n@c0@"
150:
  en: "@a%0%a002020@bI can't say I'm happy about not being able to afford it, but I guess it's just a skirt when you think about it...\n@c0@"
  ja: "@a@b%a002020「お金がないのは\n\tちょっと　さびしいけど\n\tあたしは　こしまき　いらないな。\n@c0@"
  ko: "@a@b%a002020: 돈이 없는 건\n좀 서글프지만\n난 허리 덧옷 필요 없어.\n@c0@"
  sl: "@a@b%a002020：虽然没钱\n　　让人觉得好凄凉，\n　　但是腰带什么的我才不要呢。\n@c0@"
  tl: "@a@b%a002020：雖然沒錢\n　　讓人覺得好淒涼，\n　　但是腰帶什麼的我才不要呢。\n@c0@"
151:
  en: "@a%0%a002030@bLet us accept that it was not meant to be.\n@c0@"
  ja: "@a@b%a002030「お金が　ないときには\n\tむりして　買わなくっても\n\tいいですよ。\n@c0@"
  ko: "@a@b%a002030: 돈이 없을 때는\n무리해서 사지 않아도\n괜찮습니다.\n@c0@"
  sl: "@a@b%a002030：没钱的话\n　　不用勉强自己买哦。\n@c0@"
  tl: "@a@b%a002030：沒錢的話\n　　不用勉強自己買哦。\n@c0@"
152:
  en: "@a%0%a002050@bI'm a tad worried about not even havin' two hundred gold coins to rub together...\n@c0@"
  ja: "@a@b%a002050「２００ゴールドも\n\t持っていないとは　ちょっと\n\t先行き　不安ですね……。\n@c0@"
  ko: "@a@b%a002050: 200골드도\n안 갖고 있다니\n앞길이 좀 불안하군요......\n@c0@"
  sl: "@a@b%a002050：２００金币都没有，\n　　今后的旅程\n　　真是堪忧啊……\n@c0@"
  tl: "@a@b%a002050：２００金幣都沒有，\n　　今後的旅程\n　　真是堪憂啊……\n@c0@"
153:
  en: "@a%0%a002000@bWe ain't buyin', aye? Let's shove off then, shall we?\n@c0@"
  ja: "@a@b%a002000「どうせ　買わないんだろ？\n\tいこうぜ　%a000090。\n@c0@"
  ko: "@a@b%a002000: 어차피 안 살 거잖아?\n가자, %a000090.\n@c0@"
  sl: "@a@b%a002000：反正不会买的吧。\n　　走吧，%a000090。\n@c0@"
  tl: "@a@b%a002000：反正不會買的吧。\n　　走吧，%a000090。\n@c0@"
154:
  en: "@a%0%a002010@bThe only customers that matter are the paying ones, apparently...\n@c0@"
  ja: "@a@b%a002010「買わないなら\n\tお客さんじゃ　ないってことなのね。\n@c0@"
  ko: "@a@b%a002010: 사지 않는 사람은\n손님이 아니란 말인가 보네.\n@c0@"
  sl: "@a@b%a002010：我们不买的话，\n　　就不能算客人了吧。\n@c0@"
  tl: "@a@b%a002010：我們不買的話，\n　　就不能算客人了吧。\n@c0@"
155:
  en: "@a%0%a002020@bHow rude! Let's take our business elsewhere.\n@c0@"
  ja: "@a@b%a002020「ジャマとは　何よ\n\tジャマとは！\n\t失礼しちゃうわね！\n@c0@"
  ko: "@a@b%a002020: 방해하지 말라니\n무슨 그런 말이 다 있어!\n무례하네!\n@c0@"
  sl: "@a@b%a002020：谁耽误你做生意了！\n　　你说清楚！\n　　真是没礼貌啊！\n@c0@"
  tl: "@a@b%a002020：誰耽誤你做生意了！\n　　你說清楚！\n　　真是沒禮貌啊！\n@c0@"
156:
  en: "@a%0%a002030@bRarely have I been treated in such an off-hand manner!\n@c0@"
  ja: "@a@b%a002030「いやはや\n\t手のひらを　かえしたような\n\tつめたい　あつかいですね。\n@c0@"
  ko: "@a@b%a002030: 이런,\n손바닥 뒤집듯이\n차갑게 돌변했군요.\n@c0@"
  sl: "@a@b%a002030：哎呀，\n　　这个态度\n　　真是翻脸不认人呢。\n@c0@"
  tl: "@a@b%a002030：哎呀，\n　　這個態度\n　　真是翻臉不認人呢。\n@c0@"
157:
  en: "@a%0%a002050@bI'm glad we bought nothin'! Handin' over money to him would have stuck in my craw.\n@c0@"
  ja: "@a@b%a002050「あ……\n\t買わなかったんですね。\n\tちょっと　ほっとしたかも。\n@c0@"
  ko: "@a@b%a002050: 아......\n안 샀군요.\n다행입니다.\n@c0@"
  sl: "@a@b%a002050：啊……\n　　不买啊。\n　　真是松了口气呢。\n@c0@"
  tl: "@a@b%a002050：啊……\n　　不買啊。\n　　真是鬆了口氣呢。\n@c0@"
158:
  en: "@a%0%a002000@bCrikey, %a000090. Don't you wanna know what you're buyin'?\n@c0@"
  ja: "@a@b%a002000「おいおい　%a000090。\n\t売り物を　見もせずに\n\t買っちゃったのかよ。\n@c0@"
  ko: "@a@b%a002000: 어이, %a000090.\n물건을 보지도 않고\n사는 사람이 어딨냐?\n@c0@"
  sl: "@a@b%a002000：喂，%a000090。\n　　你看都不看一眼\n　　就买了啊。\n@c0@"
  tl: "@a@b%a002000：喂，%a000090。\n　　你看都不看一眼\n　　就買了啊。\n@c0@"
159:
  en: "@a%0%a002010@bErm... What did you just buy, %a000090?\n@c0@"
  ja: "@a@b%a002010「けっきょく\n\t何を　買ったの　%a000090？\n@c0@"
  ko: "@a@b%a002010: 결국\n뭘 산 거야, %a000090?\n@c0@"
  sl: "@a@b%a002010：到底买了什么呢，\n　　%a000090？\n@c0@"
  tl: "@a@b%a002010：到底買了什麼呢，\n　　%a000090？\n@c0@"
160:
  en: "@a%0%a002020@bYou bought it! So, uh...what is it?\n@c0@"
  ja: "@a@b%a002020「あーっ　買っちゃった！\n\t大丈夫なのー！？\n@c0@"
  ko: "@a@b%a002020: 앗, 사 버렸잖아!\n괜찮은 거야~!?\n@c0@"
  sl: "@a@b%a002020：啊，你买了！\n　　没事吧？！\n@c0@"
  tl: "@a@b%a002020：啊，你買了！\n　　沒事吧？！\n@c0@"
161:
  en: "@a%0%a002030@bPerhaps there was a reason that this was the last item on the shelf...\n@c0@"
  ja: "@a@b%a002030「のこり物には\n\t福があると　いいますけど……。\n@c0@"
  ko: "@a@b%a002030: 남은 물건에는\n복이 깃들어 있다고들 합니다만......\n@c0@"
  sl: "@a@b%a002030：虽说别人\n　　挑剩下的不一定不好……\n@c0@"
  tl: "@a@b%a002030：雖說別人\n　　挑剩下的不一定不好……\n@c0@"
162:
  en: "@a%0%a002050@bIs it me, or did we not meet a nipper who acted a lot like this fellow?\n@c0@"
  ja: "@a@b%a002050「そういえば　どこかに\n\tこの人に　よく似た\n\tお子さんが　いたような……。\n@c0@"
