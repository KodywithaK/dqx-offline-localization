  tl: "@a@b%a002000：索迪士兵長……\n　　在這個鎮上好像也挺有名啊。\n@c0@"
67:
  en: "@a%0%a002010@bThe story of King Somnus and Murdaw is indeed bizarre — not to mention complicated.\n@c0@"
