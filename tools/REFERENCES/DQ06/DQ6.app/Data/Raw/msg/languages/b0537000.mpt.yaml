  sl: "@a@b%a002030：这次的事情\n　　不太容易解释清楚呢。\n　　大家可能都无法理解吧。\n@c0@"
  tl: "@a@b%a002030：這次的事情\n　　不太容易解釋清楚呢。\n　　大家可能都無法理解吧。\n@c0@"
70:
