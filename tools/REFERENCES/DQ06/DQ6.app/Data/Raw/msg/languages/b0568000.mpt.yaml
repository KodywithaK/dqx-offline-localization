0:
  en: "@a%0%a002000@b‘A cave somewhere’... That vague enough for ya?\n@c0@"
  ja: "@a@b%a002000「どこかの　洞くつか……。\n\tいったい　どこなんだろうな。\n@c0@"
  ko: "@a@b%a002000: 어느 동굴이라......\n대체 어디일까?\n@c0@"
  sl: "@a@b%a002000：某个地方的洞窟啊……\n　　到底是哪里呢？\n@c0@"
  tl: "@a@b%a002000：某個地方的洞窟啊……\n　　到底是哪裡呢？\n@c0@"
1:
  en: "@a%0%a002010@bAny idea what cave he's talking about, %a000090?\n@c0@"
  ja: "@a@b%a002010「ねえ　%a000090\n\tどこの　洞くつか　わかる？\n@c0@"
  ko: "@a@b%a002010: 저기, %a000090.\n어느 동굴인지 알겠어?\n@c0@"
  sl: "@a@b%a002010：%a000090，\n　　你知道是哪里的洞窟吗？\n@c0@"
  tl: "@a@b%a002010：%a000090，\n　　你知道是哪裡的洞窟嗎？\n@c0@"
2:
  en: "@a%0%a002020@bIt figures there'd be other relic hunters. We better hustle!\n@c0@"
  ja: "@a@b%a002020「あたしたちも　負けずに\n\tさがさなきゃ！\n@c0@"
  ko: "@a@b%a002020: 우리도 지고 있을 수\n없다구. 어서 찾자!\n@c0@"
  sl: "@a@b%a002020：我们也去找吧，\n　　不要输给他！\n@c0@"
  tl: "@a@b%a002020：我們也去找吧，\n　　不要輸給他！\n@c0@"
3:
  en: "@a%0%a002030@bWith the guidance of the Goddess, I have faith we will locate them.\n@c0@"
  ja: "@a@b%a002030「神のおみちびきがあれば\n\tいつかは　かならず　そろいます。\n@c0@"
  ko: "@a@b%a002030: 신의 인도가 있다면\n언젠가 반드시 모두 찾을 수 있을 겁니다.\n@c0@"
  sl: "@a@b%a002030：要是有神的指引，\n　　总有一天会集齐的。\n@c0@"
  tl: "@a@b%a002030：要是有神的指引，\n　　總有一天會集齊的。\n@c0@"
4:
  en: "@a%0%a002050@bBut there are mountains of caves in this world...\n@c0@"
  ja: "@a@b%a002050「洞くつと　いっても\n\tこの世界に　洞くつは\n\t山ほど　ありますからねえ。\n@c0@"
  ko: "@a@b%a002050: 동굴이라고 해도\n이 세계에 동굴은\n산더미처럼 많은걸요.\n@c0@"
  sl: "@a@b%a002050：虽说是洞窟，\n　　但是这世上的洞窟\n　　跟星星一样多啊。\n@c0@"
  tl: "@a@b%a002050：雖說是洞窟，\n　　但是這世上的洞窟\n　　跟星星一樣多啊。\n@c0@"
5:
  en: "@a%0%a002050@bHmm... ‘mountains of caves’ sounds a tad odd, but you know what old %a002050 means! ...I mean there's lots!\n@c0@"
  ja: "@a@b%a002050「あ…\n\t洞くつだから　山ほど　とは\n\tいわないですかね。\n@c0@"
  ko: "@a@b%a002050: 아...\n동굴이니까 산더미라는 말은\n안 쓰려나?\n@c0@"
  sl: "@a@b%a002050：啊……\n　　既然是洞窟的话，\n　　就不能说洞窟像星星了呢。\n@c0@"
  tl: "@a@b%a002050：啊……\n　　既然是洞窟的話，\n　　就不能說洞窟像星星了呢。\n@c0@"
6:
  en: "@a%0%a002000@bHardy har! We collected the set while he was blunderin' around in this cave!\n@c0@"
  ja: "@a@b%a002000「こいつが　ここに\n\tいるあいだに　オレたちが　全部\n\tそろえちまった　ってことだな。\n@c0@"
  ko: "@a@b%a002000: 이 녀석이 여기\n있는 동안 우리가 모두\n모아 버렸군.\n@c0@"
  sl: "@a@b%a002000：咱全部集齐了，\n　　这家伙还停在这里呢。\n@c0@"
  tl: "@a@b%a002000：咱全部集齊了，\n　　這傢伙還停在這裡呢。\n@c0@"
7:
  en: "@a%0%a002000@bWell, perhaps there's other legendary equipment left to find somewhere else. I hope so, for his sake.\n@c0@"
  ja: "@a@b%a002000「まあ　どこかに　べつの\n\t伝説の武具が　あるかもしれないから\n\tがんばってもらおうぜ！\n@c0@"
  ko: "@a@b%a002000: 뭐, 어딘가에 다른\n전설의 장비가 있을지도 모르니까\n열심히 찾아보라고!\n@c0@"
  sl: "@a@b%a002000：在某个地方说不定\n　　还有其它的传说中的武具。\n　　加油找吧！\n@c0@"
  tl: "@a@b%a002000：在某個地方說不定\n　　還有其它的傳說中的武具。\n　　加油找吧！\n@c0@"
8:
  en: "@a%0%a002010@bI can't help but feel sorry for him.\n@c0@"
  ja: "@a@b%a002010「なんだか　ちょっと\n\tかわいそうね。\n@c0@"
  ko: "@a@b%a002010: 왠지 조금\n불쌍한걸.\n@c0@"
  sl: "@a@b%a002010：好像有点可怜呢。\n@c0@"
  tl: "@a@b%a002010：好像有點可憐呢。\n@c0@"
9:
  en: "@a%0%a002020@bWanna tell him the bad news, %a000090?\n@c0@"
  ja: "@a@b%a002020「ねえ　%a000090\n\tもう　伝説の武具は　ないって\n\t教えてあげたほうが　いいかな……。\n@c0@"
  ko: "@a@b%a002020: 저기, %a000090.\n이제 전설의 장비는 없을 거라고\n알려 주는 게 좋을까......?\n@c0@"
  sl: "@a@b%a002020：%a000090，\n　　还是告诉他已经没有\n　　传说中的武具了比较好吧……\n@c0@"
  tl: "@a@b%a002020：%a000090，\n　　還是告訴他已經沒有\n　　傳說中的武具了比較好吧……\n@c0@"
10:
  en: "@a%0%a002030@bWell, we all need to have goals in life.\n@c0@"
  ja: "@a@b%a002030「人間　夢見ることも\n\t必要です。\n@c0@"
  ko: "@a@b%a002030: 사람은 꿈을 꿀 때도\n있어야지요.\n@c0@"
  sl: "@a@b%a002030：人是需要\n　　做做梦的啊。\n@c0@"
  tl: "@a@b%a002030：人是需要\n　　做做夢的啊。\n@c0@"
11:
  en: "@a%0%a002050@bHe's talking about the cave where we found the Shield of Valora. That place was a bloomin' labyrinth...\n@c0@"
  ja: "@a@b%a002050「洞くつに　あったのは\n\tスフィーダの盾　でしたねー。\n\tいやー　あそこは　すごかった。\n@c0@"
  ko: "@a@b%a002050: 동굴에 있었던 건\n스피더의 방패였죠.\n거긴 정말 대단했는데.\n@c0@"
  sl: "@a@b%a002050：洞窟里有\n　　斯费达之盾呢。\n　　那地方真厉害啊。\n@c0@"
  tl: "@a@b%a002050：洞窟裡有\n　　斯費達之盾呢。\n　　那地方真厲害啊。\n@c0@"
12:
  en: "@a%0%a002050@bThe lad seems to be strugglin' already — he wouldn't last two seconds in there.\n@c0@"
  ja: "@a@b%a002050「ここで　迷ってる人には\n\tあの　迷路のような　洞くつは\n\tぜったいに　ムリですよね！\n@c0@"
  ko: "@a@b%a002050: 여기서 헤맬 정도면\n그 미로 같은 동굴은\n확실히 무리겠네요!\n@c0@"
  sl: "@a@b%a002050：在这种地方都会迷路，\n　　进到那个迷宫一样的洞窟里\n　　绝对有去无回！\n@c0@"
  tl: "@a@b%a002050：在這種地方都會迷路，\n　　進到那個迷宮一樣的洞窟裡\n　　絕對有去無回！\n@c0@"
13:
  en: "@a%0%a002040@bAt least he's trying his best, I suppose.\n@c0@"
  ja: "@a@b%a002040「ごくろうな　ことだな。\n@c0@"
  ko: "@a@b%a002040: 고생이 많군.\n@c0@"
  sl: "@a@b%a002040：真是辛苦这人了。\n@c0@"
  tl: "@a@b%a002040：真是辛苦這人了。\n@c0@"
14:
  en: "@a%0%a002060@b(snarl) No...more...legendary...relics... (splutter)\n@c0@"
  ja: "@a@b%a002060「伝説の…武具……。\n\tもう…ない……。\n@c0@"
  ko: "@a@b%a002060: 전설의...장비......\n이제...없다......\n@c0@"
  sl: "@a@b%a002060：传说中的……武具……\n　　已经……没了……\n@c0@"
  tl: "@a@b%a002060：傳說中的……武具……\n　　已經……沒了……\n@c0@"
15:
  en: "@a%0%a002070@b(slurrrp)\n@c0@"
  ja: "@a@b%a002070「プルプルン！\n@c0@"
  ko: "@a@b%a002070: 뽀용뽀요용!\n@c0@"
  sl: "@a@b%a002070：噗噜噗噜！\n@c0@"
  tl: "@a@b%a002070：噗嚕噗嚕！\n@c0@"
