0:
  en: "@a@b*: This is Despairia.\n@c0@"
  ja: "@a@b＊「ここは　絶望の町。\n@c0@"
  ko: "@a@b*: 여기는 절망의 마을.\n@c0@"
  sl: "@a@b＊：这里是绝望之镇。\n@c0@"
  tl: "@a@b＊：這裡是絕望之鎮。\n@c0@"
1:
  en: "@a@b*: It's not much, but it's the only home we've had since we all got sucked here out of the blue.\n@c0@"
  ja: "@a@b＊「ここには　私たちのように　とつぜん\n\tこの世界に　引き込まれた者が\n\tなすすべもなく　暮らしています。\n@c0@"
  ko: "@a@b*: 여기에는 우리처럼 갑자기\n이 세계에 끌려온 자가\n어쩔 도리 없이 살고 있습니다.\n@c0@"
  sl: "@a@b＊：我们这些生活在这里的人\n　　全都是突然被卷到这个世界，\n　　每天都过着彷徨失措的日子。\n@c0@"
  tl: "@a@b＊：我們這些生活在這裡的人\n　　全都是突然被捲到這個世界，\n　　每天都過著彷徨失措的日子。\n@c0@"
2:
  en: "@a@b*: Won't be long before you lose all hope, just like everyone else here in Despairia.\n@c0@"
  ja: "@a@b＊「あなたがたも　きっと　すべての\n\t希望を失うことに　なるでしょう。\n\tこの　絶望の町で……。\n@c0@"
  ko: "@a@b*: 당신들도 틀림없이 모든\n희망을 잃게 될 겁니다.\n이 절망의 마을에서......\n@c0@"
  sl: "@a@b＊：恐怕你也会在\n　　这个绝望之镇\n　　失去自己全部的希望吧……\n@c0@"
  tl: "@a@b＊：恐怕你也會在\n　　這個絕望之鎮\n　　失去自己全部的希望吧……\n@c0@"
3:
  en: "@a@b*: ...Customers? Are you for real?\n@c0@"
  ja: "@a@b＊「……おや　お客さんですか。\n\tまだ　何かを　買おうなんて\n\t思うひとが　いたんですねえ。\n@c0@"
  ko: "@a@b*: ......흐음, 손님인가요?\n아직 뭔가 사려는\n사람들이 있다니.\n@c0@"
  sl: "@a@b＊：哎呀，有客人……\n　　现在居然还有人\n　　想要买东西啊。\n@c0@"
  tl: "@a@b＊：哎呀，有客人……\n　　現在居然還有人\n　　想要買東西啊。\n@c0@"
4:
  en: "@a@b*: Why bother shopping when you've got that lovely lagoon to the west? It's just so...so...soothing.\n@c0@"
  ja: "@a@b＊「そんなことより　西の温泉にでも\n\tつかって来たらどうです？　じつに\n\tやすらかな気もちに　なれますよ。\n@c0@"
  ko: "@a@b*: 그러지 말고 서쪽 온천에라도\n다녀오는 게 어떻습니까?\n정말 마음이 편해질 겁니다.\n@c0@"
  sl: "@a@b＊：话说回来，西边的温泉\n　　不知道您去没去过？\n　　泡一下的话能让人心情舒畅呢。\n@c0@"
  tl: "@a@b＊：話說回來，西邊的溫泉\n　　不知道您去沒去過？\n　　泡一下的話能讓人心情舒暢呢。\n@c0@"
5:
  en: "@a@b*: Ah-phew... Ah-phew... Ah...monster? Taste my sword, foul beast! Zzzz...\n@c0@"
  ja: "@a@b＊「こっくり　こっくり……\n\tくっ　この　まものめっ！\n\tオレさまの　剣を　うけてみろっ！\n@c0@"
  ko: "@a@b*: 꾸벅꾸벅......\n크윽, 이 마물 자식!\n나의 검을 받아랏!\n@c0@"
  sl: "@a@b＊：呼……呼……\n　　可恶的魔物！\n　　吃本大爷一剑！\n@c0@"
  tl: "@a@b＊：呼……呼……\n　　可惡的魔物！\n　　吃本大爺一劍！\n@c0@"
6:
  en: "@a@b*: Gaah! Wha...? Urgh. Not another dream about my monster-slaying days...\n@c0@"
  ja: "@a@b＊「……はっ！　なんと　いまだに\n\tまものと　戦っていたときの\n\t夢を　見るとは……。\n@c0@"
  ko: "@a@b*: ......헛! 아직도\n마물과 싸우던 때의\n꿈을 꾸다니......\n@c0@"
  sl: "@a@b＊：啊！为什么现在\n　　还会梦到以前\n　　和魔物战斗时的事情……\n@c0@"
  tl: "@a@b＊：啊！為什麼現在\n　　還會夢到以前\n　　和魔物戰鬥時的事情……\n@c0@"
7:
  en: "@a@b*: Try not to end up like me, you hear? This place'll sap all your strength if you stay too long.\n@c0@"
  ja: "@a@b＊「ふっ……。　あんたらも気をつけな。\n\tここに　きたら　どんどんと\n\tチカラを　うしなってゆくぞ。\n@c0@"
  ko: "@a@b*: 훗...... 너희도 조심하는 게 좋아.\n여기에 오면 힘이 점점\n빠져나가게 될 테니까.\n@c0@"
  sl: "@a@b＊：唉……你们也小心点吧。\n　　来到这里以后，\n　　力量会一点点消失的。\n@c0@"
  tl: "@a@b＊：唉……你們也小心點吧。\n　　來到這裡以後，\n　　力量會一點點消失的。\n@c0@"
8:
