  sl: "@a@b＊：老、老子曾经\n　　徒手打倒过\n　　恶魔铠甲！咕嘟……\n@c0@"
  tl: "@a@b＊：老、老子曾經\n　　徒手打倒過\n　　惡魔鎧甲！咕嘟……\n@c0@"
13:
  en: "@a@b*: But in this world, just liftin' my glass tuckers me out. If I get too weak to drink, my life'll be over...\n@c0@"
  ja: "@a@b＊「それが……　この世界では\n\tなんのチカラも　出せやしねえ。\n\tこれが　飲まずに　いられるかって！\n@c0@"
  ko: "@a@b*: 그런데...... 이 세계에서는\n아무 힘도 나질 않아.\n이러니 어떻게 안 마실 수가 있겠어!\n@c0@"
  sl: "@a@b＊：可是……到了这鬼地方\n　　却一点力气都使不出来，\n　　再不喝两口还让不让人活了？！\n@c0@"
