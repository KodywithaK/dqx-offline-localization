17:
  en: "@a@b*: This is just a bad dream, that's all. I'll just close my eyes, and when I open them, I'll be back in the real world.\n@c0@"
  ja: "@a@b＊「これは　夢よ。　きっと　悪い夢……。\n\tこのまま眠って　目をさませば\n\tもとの世界に　もどっているはず。\n@c0@"
  ko: "@a@b*: 이건 꿈이야. 틀림없이 나쁜 꿈......\n이대로 다시 자고 일어나면\n원래 세계로 돌아갈 수 있을 거야.\n@c0@"
