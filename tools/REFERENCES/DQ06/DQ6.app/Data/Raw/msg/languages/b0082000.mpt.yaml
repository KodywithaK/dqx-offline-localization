  ko: "@a@b*: 그리고 우리가 희망을 잃으면\n잃을수록 대마왕의 힘이\n강해진다고 들었습니다.\n@c0@"
  sl: "@a@b＊：听说，人们越是感到绝望，\n　　大魔王的力量便越强大。\n@c0@"
  tl: "@a@b＊：聽說，人們越是感到絕望，\n　　大魔王的力量便越強大。\n@c0@"
61:
  en: "@a@b*: Word got around that the lagoon had a secret path leadin' outta this world.\n@c0@"
  ja: "@a@b＊「この世界から　ぬけだせる\n\tぬけ道が　温泉のどこかにある　なんて\n\tデマが　流れたことも　あったさ。\n@c0@"
  ko: "@a@b*: 이 세계에서 빠져나갈 수 있는\n길이 온천 어딘가에 있다는\n헛소문이 돈 적도 있었어.\n@c0@"
  sl: "@a@b＊：曾经有一条流言，\n　　说温泉的某个地方有条通道，\n　　可以让人们离开这个世界。\n@c0@"
  tl: "@a@b＊：曾經有一條流言，\n　　說溫泉的某個地方有條通道，\n　　可以讓人們離開這個世界。\n@c0@"
62:
  en: "@a@b*: I couldn't even count how many folks swarmed the place. They didn't find nothin', of course.\n@c0@"
  ja: "@a@b＊「そんときは　おおぜいが　温泉に\n\t向かったもんだが……　けど\n\tなにも　見つけられなかったのさ。\n@c0@"
  ko: "@a@b*: 그때는 많은 사람이 온천에\n몰려갔었는데...... 결국\n아무것도 찾지 못했었지.\n@c0@"
  sl: "@a@b＊：当时，很多人蜂拥到温泉\n　　去寻找那条通道，\n　　结果却什么都没有找到。\n@c0@"
  tl: "@a@b＊：當時，很多人蜂擁到溫泉\n　　去尋找那條通道，\n　　結果卻什麼都沒有找到。\n@c0@"
63:
  en: "@a@b*: Why? It's the nature of the lagoon. Once you dive in, you lose the will to move and just...go with the flow.\n@c0@"
  ja: "@a@b＊「なにしろ　温泉につかると　なにもかも\n\tどうでもいい気もちになって　ただ\n\t流されてしまうんだ。\n@c0@"
  ko: "@a@b*: 아무튼 온천욕을 하면 모든 것에서\n해방된 것처럼\n모든 게 다 흘러가 버리지.\n@c0@"
  sl: "@a@b＊：总之，泡过温泉之后，\n　　大家对什么都提不起兴趣，\n　　于是事情就这样不了了之。\n@c0@"
  tl: "@a@b＊：總之，泡過溫泉之後，\n　　大家對什麼都提不起興趣，\n　　於是事情就這樣不了了之。\n@c0@"
64:
  en: "@a@b*: You shouldn't fight it, either. Makes for an easier life that way.\n@c0@"
  ja: "@a@b＊「だから　あんたも　あきらめて\n\t流された方がいいってもんよ。\n\tそのほうが　楽に生きてゆけるから。\n@c0@"
  ko: "@a@b*: 그러니 당신도 포기하고\n물 흐르는 대로 사는 게 좋을 거야.\n그게 편하게 사는 방법이니까.\n@c0@"
  sl: "@a@b＊：所以，你们也放弃吧，\n　　就这么得过且过算了。\n　　还是这么活着更舒服啊。\n@c0@"
  tl: "@a@b＊：所以，你們也放棄吧，\n　　就這麼得過且過算了。\n　　還是這麼活著更舒服啊。\n@c0@"
65:
  en: "@a@b*: Grrrargh! What're you doin' here!?\n@c0@"
  ja: "@a@b＊「グルルルッ！\n\tんー　なんだ　きさまは！！\n@c0@"
  ko: "@a@b*: 크르르릉!\n으음, 뭐냐? 네놈은!!\n@c0@"
  sl: "@a@b＊：啊啊啊啊！\n　　你这家伙干什么！！\n@c0@"
  tl: "@a@b＊：啊啊啊啊！\n　　你這傢伙幹什麼！！\n@c0@"
66:
  en: "@a@b*: Lord Mortamor himself told me ta keep watch over dis town! You got a problem wit dat?\n@c0@"
  ja: "@a@b＊「ムーアさまの　ご命令により\n\tこの町の　見張りをしている\n\tオレに　たてつくのか？\n@c0@"
  ko: "@a@b*: 무아 님의 명령으로\n이 마을을 지키는\n나를 거역할 셈이냐?\n@c0@"
  sl: "@a@b＊：我奉穆亚大人之命\n　　看守这个小镇，\n　　你要反抗我吗？\n@c0@"
  tl: "@a@b＊：我奉穆亞大人之命\n　　看守這個小鎮，\n　　你要反抗我嗎？\n@c0@"
67:
  en: "@a@b*: Gwah hah har! You gotta be kiddin' me! Here, lemme remind you just how weak you really are!\n@c0@"
  ja: "@a@b＊「グワッハッハッ！　笑わせるな。\n\tそれならば　きさまにも\n\tおのれの　無力さを　教えてやろう！\n@c0@"
  ko: "@a@b*: 크하하하하! 웃기지 마라.\n그렇다면 네놈에게도\n자신의 무력함을 알게 해 주마!\n@c0@"
  sl: "@a@b＊：啊哈哈哈！别逗我了！\n　　既然如此，\n　　让你也尝尝绝望的滋味！\n@c0@"
  tl: "@a@b＊：啊哈哈哈！別逗我了！\n　　既然如此，\n　　讓你也嘗嘗絕望的滋味！\n@c0@"
68:
  en: "@a@b*: Gwah hah har! 'Course not! No one disrespects Lord Mortamor in his own realm!\n@c0@"
  ja: "@a@b＊「そうだろうとも。　この世界で\n\t大魔王さまに　さからえる者など\n\tおらんのだ。　グワッハハハ！\n@c0@"
  ko: "@a@b*: 그렇고 말고. 이 세계에\n대마왕님을 거스를 자는\n없다. 크하하하하!\n@c0@"
  sl: "@a@b＊：算你聪明。\n　　这个世界上还没有能够\n　　反抗大魔王的人呢。啊哈哈哈！\n@c0@"
  tl: "@a@b＊：算你聰明。\n　　這個世界上還沒有能夠\n　　反抗大魔王的人呢。啊哈哈哈！\n@c0@"
69:
  en: "@a@b*: (sigh) How many times do I have to say it? My days of forging armour are over. Done. Kaput.\n@c0@"
  ja: "@a@b＊「なんじゃ　お前さんは\n\tわしゃ　もう　２度と\n\t防具なんぞ　つくらんぞ。\n@c0@"
  ko: "@a@b*: 뭐냐, 네놈들은!\n나는 두 번 다시\n방어구 따윈 만들지 않아.\n@c0@"
  sl: "@a@b＊：你们来干什么？\n　　我不是说了嘛，\n　　我再也不做防具了。\n@c0@"
  tl: "@a@b＊：你們來幹什麼？\n　　我不是說了嘛，\n　　我再也不做防具了。\n@c0@"
70:
  en: "@a@b*: I mean, what's the point? It's not like working the forge will get me back to my family...\n@c0@"
  ja: "@a@b＊「ここで　何をしたって\n\tもう　家族のもとには\n\tもどれんのじゃ……。\n@c0@"
  ko: "@a@b*: 여기서 뭘 해도\n이제 가족의 품엔\n못 돌아갈 게야......\n@c0@"
  sl: "@a@b＊：我已经想尽了办法，\n　　还是没法回到家人身边……\n@c0@"
  tl: "@a@b＊：我已經想盡了辦法，\n　　還是沒法回到家人身邊……\n@c0@"
71:
  en: "@a@b*: ...Mm?㈢ What was that?㈢ ...You've travelled to this world to defeat Mortamor for us?\n@c0@"
  ja: "@a@b＊「……ん？㈢　なんじゃと？㈢\n\t大魔王を　たおすために　この世界に\n\tやって来たじゃと？\n@c0@"
  ko: "@a@b*: ......응?㈢ 뭐라고?㈢\n대마왕을 쓰러뜨리기 위해 이 세계에\n왔다고 했나?\n@c0@"
  sl: "@a@b＊：嗯？㈢你说什么？㈢\n　　你是为了打倒大魔王\n　　才来到这个世界的？\n@c0@"
  tl: "@a@b＊：嗯？㈢你說什麼？㈢\n　　你是為了打倒大魔王\n　　才來到這個世界的？\n@c0@"
72:
  en: "@a@b*: You mean to say you came here on purpose? By your own power!?\n@c0@"
  ja: "@a@b＊「それじゃ　お前さん\n\t自分のチカラで　この世界に\n\tやって来たというのか……！\n@c0@"
  ko: "@a@b*: 그렇다면 자네는\n자기 힘으로 이 세계에\n왔다는 말이냐......!\n@c0@"
  sl: "@a@b＊：也就是说，\n　　你是凭借自己的力量\n　　来到这个世界的？\n@c0@"
  tl: "@a@b＊：也就是說，\n　　你是憑藉自己的力量\n　　來到這個世界的？\n@c0@"
73:
  en: "@a@b*: ...No! I won't fall for such rubbish! Just another of Mortamor's ruses, no doubt!\n@c0@"
  ja: "@a@b＊「いや！　信じられん。　そんな話は\n\t信じられんぞい！　これも　きっと\n\t大魔王の　ワナじゃ！\n@c0@"
  ko: "@a@b*: 이런! 믿을 수 없군. 그런 이야기는\n믿을 수 없어! 이것도 분명\n대마왕의 함정이다!\n@c0@"
  sl: "@a@b＊：不！我不信。\n　　你说的根本就不可能！\n　　这一定又是大魔王的圈套！\n@c0@"
  tl: "@a@b＊：不！我不信。\n　　你說的根本就不可能！\n　　這一定又是大魔王的圈套！\n@c0@"
74:
  en: "@a@b*: You'll have to try harder than that to fool me. Now, if you had some sort of proof...\n@c0@"
  ja: "@a@b＊「もし　そうでないと　いうなら……\n\tもし　お前さんの話が　本当なら\n\tその　あかしを　見せてくれ。\n@c0@"
  ko: "@a@b*: 만약 그게 아니라면......\n만일 자네의 말이 사실이라면\n그 증거를 보여주게나.\n@c0@"
  sl: "@a@b＊：如果这是真的……\n　　想让我相信你的话，\n　　就要拿出证据来。\n@c0@"
  tl: "@a@b＊：如果這是真的……\n　　想讓我相信你的話，\n　　就要拿出證據來。\n@c0@"
75:
  en: "@a@b*: Hmm...㈢㈢ I've got an idea.\n@c0@"
  ja: "@a@b＊「そうじゃな……㈢㈢\n\tこういうのは　どうじゃ？\n@c0@"
  ko: "@a@b*: 어디 보자......㈢㈢\n이런 건 어떻겠나?\n@c0@"
  sl: "@a@b＊：要不……㈢㈢\n　　这么办吧！\n@c0@"
  tl: "@a@b＊：要不……㈢㈢\n　　這麼辦吧！\n@c0@"
76:
  en: "@a@b*: The village of Dullerton...\n@c0@"
  ja: "@a@b＊「ザクソンの村……。\n@c0@"
  ko: "@a@b*: 잭슨 마을......\n@c0@"
  sl: "@a@b＊：赞克索村……\n@c0@"
  tl: "@a@b＊：贊克索村……\n@c0@"
77:
  en: "@a@b*: That's where my house is. It's a tiny little place nestled in the mountains north-west of Scrimsley.\n@c0@"
  ja: "@a@b＊「モンストルの北西の　まわりを\n\t高い山に　かこまれた　小さな村に\n\tわしの家が　ある。\n@c0@"
  ko: "@a@b*: 몬스톨의 북서쪽, 높은 산에\n빙 둘러싸인 작은 마을에\n우리 집이 있다네.\n@c0@"
  sl: "@a@b＊：那是一个地处蒙斯托尔镇西北，\n　　四周被高山环抱的小村。\n　　我的家就在那里。\n@c0@"
  tl: "@a@b＊：那是一個地處蒙斯托爾鎮西北，\n　　四周被高山環抱的小村。\n　　我的家就在那裡。\n@c0@"
78:
  en: "@a@b*: The family I left behind should still be there — my wife and my dog, Silver.\n@c0@"
  ja: "@a@b＊「そこには　残された　わしの家族が\n\tおるはずじゃ。　わしの妻と\n\t犬の　シルバー……。\n@c0@"
  ko: "@a@b*: 그곳에는 나의 가족이\n남아 있을 게야. 나의 아내와\n애견 실버......\n@c0@"
  sl: "@a@b＊：我的妻子，\n　　还有我的爱犬席尔瓦，\n　　应该还住在那里。\n@c0@"
  tl: "@a@b＊：我的妻子，\n　　還有我的愛犬席爾瓦，\n　　應該還住在那裡。\n@c0@"
79:
  en: "@a@b*: They're both beside themselves with worry, no doubt...\n@c0@"
  ja: "@a@b＊「きっと　わしのことを\n\t心配しておるじゃろう……。\n@c0@"
  ko: "@a@b*: 분명 나를\n걱정하고 있을 게야......\n@c0@"
  sl: "@a@b＊：她们一定还在\n　　为我担心呢……\n@c0@"
  tl: "@a@b＊：她們一定還在\n　　為我擔心呢……\n@c0@"
80:
  en: "@a@b*: If you can travel there, I want you to give this to my wife. It's my old pipe.\n@c0@"
  ja: "@a@b＊「その　ザクソンの村の\n\tわしの妻に　これを\n\tわたしてほしいのじゃ。\n@c0@"
  ko: "@a@b*: 잭슨 마을에 있는\n내 아내에게 이걸\n전해주게.\n@c0@"
  sl: "@a@b＊：请你去赞克索村，\n　　替我把这个\n　　交给我的妻子。\n@c0@"
  tl: "@a@b＊：請你去贊克索村，\n　　替我把這個\n　　交給我的妻子。\n@c0@"
81:
  en: "@a@b%0%a000120 receives an old pipe.\n@c0@"
  ja: "@a@b%a000120は　ふるびたパイプを\nうけとった！\n@c0@"
  ko: "@a@b%a000120%F0120%X는%Y은%Z 낡은 담뱃대를\n받았다!\n@c0@"
  sl: "@a@b%a000120收下了古旧烟斗！\n@c0@"
  tl: "@a@b%a000120收下了古舊煙斗！\n@c0@"
82:
  en: "@a@b*: She gave that to me when we were young.\n@c0@"
  ja: "@a@b＊「それは　若い頃　妻から\n\tもらった物でな。\n@c0@"
  ko: "@a@b*: 그건 젊었을 때 아내한테\n받은 것이라네.\n@c0@"
  sl: "@a@b＊：这是年轻的时候\n　　妻子送给我的礼物。\n@c0@"
  tl: "@a@b＊：這是年輕的時候\n　　妻子送給我的禮物。\n@c0@"
83:
  en: "@a@b*: She'll recognise it. I'm sure of that.\n@c0@"
  ja: "@a@b＊「これを見れば　妻は　すぐに\n\tわしの物だと　わかるじゃろう。\n@c0@"
  ko: "@a@b*: 이걸 보면 아내는 바로\n나의 물건이라는 걸 알아볼 테지.\n@c0@"
  sl: "@a@b＊：她看到这个烟斗，\n　　就会相信是我派你去的。\n@c0@"
  tl: "@a@b＊：她看到這個煙斗，\n　　就會相信是我派你去的。\n@c0@"
84:
  en: "@a@b*: Once you've done that, ask her to fetch my set of tools. They should still be in my room.\n@c0@"
  ja: "@a@b＊「そうしたら　わしの　しごと道具を\n\t妻に　出してもらって来てくれ。\n\tわしの部屋に　おいてあるはずじゃ。\n@c0@"
  ko: "@a@b*: 그런 다음, 내 작업에 필요한 도구를\n아내에게 받아서 가져와 주게.\n내 방에 있을 걸세.\n@c0@"
  sl: "@a@b＊：然后，让她把我的工具拿给你，\n　　应该都放在我的屋子里。\n　　拿到工具后再来找我。\n@c0@"
  tl: "@a@b＊：然後，讓她把我的工具拿給你，\n　　應該都放在我的屋子裡。\n　　拿到工具後再來找我。\n@c0@"
85:
  en: "@a@b*: Ah, I suppose I should tell you my name! I'm Wynne. Max Wynne.\n@c0@"
  ja: "@a@b＊「いい忘れておったが　わしの名は\n\tクラーク・エンデ。\n@c0@"
  ko: "@a@b*: 깜빡 잊을 뻔했군. 내 이름은\n클라크 엔데.\n@c0@"
  sl: "@a@b＊：看我差点忘了，\n　　我叫克拉克・恩迪。\n@c0@"
  tl: "@a@b＊：看我差點忘了，\n　　我叫克拉克・恩迪。\n@c0@"
86:
  en: "@aMax Wynne@bBring me my tools, and I'll consider believing this tale of yours.\n@c0@"
  ja: "@a@bエンデ「わしの　しごと道具を\n\tもって来てくれたら　お前さんの\n\t話を　信じよう。\n@c0@"
  ko: "@a@b엔데: 내 작업에 필요한 도구를\n가져와 주면 자네의\n이야기를 믿도록 하지.\n@c0@"
  sl: "@a@b恩迪：等你把我的工具拿来，\n　　我就相信你说的话。\n@c0@"
  tl: "@a@b恩迪：等你把我的工具拿來，\n　　我就相信你說的話。\n@c0@"
