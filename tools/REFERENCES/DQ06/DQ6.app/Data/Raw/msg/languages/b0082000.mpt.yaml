90:
  en: "@aMax Wynne@bBring me my tools, and I'll consider believing this tale of yours.\n@c0@"
  ja: "@a@bエンデ「わしの　しごと道具を\n\tもって来てくれたら　お前さんの\n\t話を　信じよう。\n@c0@"
  ko: "@a@b엔데: 내 작업에 필요한 도구를\n가져와 주면 자네의\n이야기를 믿도록 하지.\n@c0@"
  sl: "@a@b恩迪：等你把我的工具拿来，\n　　我就相信你说的话。\n@c0@"
  tl: "@a@b恩迪：等你把我的工具拿來，\n　　我就相信你說的話。\n@c0@"
91:
  en: "@a@b*: My old man was such a fool. He had dreams of strikin' gold in the mine. Well, that cave-in crushed more than just his dreams...\n@c0@"
  ja: "@a@b＊「オレの　親父は　バカなやつだよ。\n\t金鉱なんかに　目がくらんで\n\tくずれた岩の　下じきに……。\n@c0@"
  ko: "@a@b*: 우리 아버지는 멍청하기 짝이 없어.\n금광 따위에 눈이 멀어서\n무너진 바위에 깔리다니......\n@c0@"
  sl: "@a@b＊：我老爸就是个笨蛋。\n　　脑子里光想着金矿，\n　　结果被掉落的岩石压在了下面。\n@c0@"
  tl: "@a@b＊：我老爸就是個笨蛋。\n　　腦子裡光想著金礦，\n　　結果被掉落的岩石壓在了下面。\n@c0@"
92:
  en: "@a@b*: This mine is a foul, dark place... So many lives, lost in a vain search for gold and treasure...\n@c0@"
  ja: "@a@b＊「これは　ひどい……。　ずいぶん\n\t多くのひとが　金や　宝さがしのため\n\t命を　落としたようですね。\n@c0@"
  ko: "@a@b*: 이거 끔찍하군......\n꽤 많은 사람이 금이나 보석을 찾으려다\n목숨을 잃은 모양이군요.\n@c0@"
  sl: "@a@b＊：真是可怜……\n　　世上已经有太多的人为了\n　　寻找金银财宝白白断送了性命。\n@c0@"
  tl: "@a@b＊：真是可憐……\n　　世上已經有太多的人為了\n　　尋找金銀財寶白白斷送了性命。\n@c0@"
93:
  en: "@a@b*: But what can we do, now that our Supreme Sage is imprisoned in Gallows Moor?\n@c0@"
  ja: "@a@b＊「わが　大賢者さまも　牢ごくの町に\n\t封印された今　われわれに\n\tできることは　ないのでしょうか。\n@c0@"
  ko: "@a@b*: 우리 대현자님도 감옥 마을에\n봉인된 지금 우리가\n할 수 있는 일은 없는 걸까요?\n@c0@"
  sl: "@a@b＊：可惜大贤者大人被关在了\n　　牢狱之镇，凭我们的力量，\n　　恐怕做不了什么。\n@c0@"
  tl: "@a@b＊：可惜大賢者大人被關在了\n　　牢獄之鎮，憑我們的力量，\n　　恐怕做不了什麼。\n@c0@"
94:
  en: "@a@b%0%a000120 opens the treasure chest.\n@c0@"
  ja: "@a@b%a000120は　宝箱を　開けた！\n@c0@"
  ko: "@a@b%a000120%F0120%X는%Y은%Z 보물 상자를 열었다!\n@c0@"
  sl: "@a@b%a000120打开了宝箱！\n@c0@"
  tl: "@a@b%a000120打開了寶箱！\n@c0@"
95:
  en: "@a@bThe chest is empty...save for a piece of paper.\n@c0@"
  ja: "@a@b宝箱は　からっぽだった……。\nしかし　何か　紙きれのような物が\nおいてある。\n@c0@"
  ko: "@a@b보물 상자는 텅 비어 있었다......\n하지만 종잇조각 같은 것이\n들어 있다.\n@c0@"
  sl: "@a@b宝箱是空的……\n里面留着\n一张纸条。\n@c0@"
  tl: "@a@b寶箱是空的……\n裡面留著\n一張紙條。\n@c0@"
96:
  en: "@a@b%0%a000120 reads the message written on the paper.\n@c0@"
  ja: "@a@b%a000120は　紙きれに　書いてある\n文字を　読んだ。\n@c0@"
  ko: "@a@b%a000120%F0120%X는%Y은%Z 종잇조각에 쓰여 있는\n글자를 읽었다.\n@c0@"
  sl: "@a@b%a000120读了\n纸条上的文字。\n@c0@"
  tl: "@a@b%a000120讀了\n紙條上的文字。\n@c0@"
97:
  en: "@a@b‘I have a lead on the Supreme Sage's treasure. See me for details.\n                   —Morgan Gainmore’\n@c0@"
  ja: "@a@b”大賢者の　宝の　情報あり。\n　くわしく知りたい者は\n　私のところまで。　　――モルガン”\n@c0@"
  ko: "@a@b''대현자의 보물 정보 있음.\n자세한 내용을 알고 싶은 자는\n나에게 오라. --모건''\n@c0@"
  sl: "@a@b想知道大贤者的宝物\n在哪里吗？\n来找我吧。——摩根\n@c0@"
  tl: "@a@b想知道大賢者的寶物\n在哪裡嗎？\n來找我吧。——摩根\n@c0@"
98:
  en: "@a@bBut the chest is empty.\n@c0@"
  ja: "@a@bしかし　宝箱は　からっぽだった……。\n@c0@"
  ko: "@a@b그러나 보물 상자는 텅 비어 있었다......\n@c0@"
  sl: "@a@b但是宝箱是空的……\n@c0@"
  tl: "@a@b但是寶箱是空的……\n@c0@"
