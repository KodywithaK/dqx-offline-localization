  ja: "@a@b＊「ふっ……。　わしは　こう見えても\n\t大きな町の　町長まで\n\tつとめたことのある者だ。\n@c0@"
  ko: "@a@b*: 훗...... 나는 이래 봬도\n큰 마을의 촌장까지\n지냈던 사람이야.\n@c0@"
  sl: "@a@b＊：别小看我，\n　　我以前可是\n　　一个大城镇的镇长呢！\n@c0@"
  tl: "@a@b＊：別小看我，\n　　我以前可是\n　　一個大城鎮的鎮長呢！\n@c0@"
9:
  en: "@a@b*: Now look at me, trapped in this insipid wasteland...\n@c0@"
  ja: "@a@b＊「そのわしが　どうして\n\tこんな所に　まよいこんで\n\tしまったのか……。\n@c0@"
  ko: "@a@b*: 내가 어쩌다가\n이런 곳에 와서\n이러고 있는 건지......\n@c0@"
  sl: "@a@b＊：我到底\n　　为什么会来到\n　　这种地方啊……\n@c0@"
  tl: "@a@b＊：我到底\n　　為什麼會來到\n　　這種地方啊……\n@c0@"
10:
  en: "@a@b*: How could a pillar of society like me end up in a place like this? Tell me!\n@c0@"
  ja: "@a@b＊「まったく　わけが\n\tわからないわい！\n@c0@"
  ko: "@a@b*: 도무지 영문을\n모르겠군.\n@c0@"
  sl: "@a@b＊：简直是\n　　莫名其妙！\n@c0@"
  tl: "@a@b＊：簡直是\n　　莫名其妙！\n@c0@"
11:
  en: "@a@b*: 'Nother round! Make it a double! Hic!\n@c0@"
  ja: "@a@b＊「酒だっ！　酒を　くれっ！\n\tヒック……。\n@c0@"
  ko: "@a@b*: 술이다! 술을 내놔!\n딸꾹......\n@c0@"
  sl: "@a@b＊：酒！给我酒！\n　　嗝……\n@c0@"
  tl: "@a@b＊：酒！給我酒！\n　　嗝……\n@c0@"
12:
  en: "@a@b*: Y'know what? I whupped a harmour once with my bare hands! Hic!\n@c0@"
  ja: "@a@b＊「オレはなぁ……　オレは　素手で\n\tデビルアーマーを　たおしたことも\n\tあるんだ……　ヒック！\n@c0@"
