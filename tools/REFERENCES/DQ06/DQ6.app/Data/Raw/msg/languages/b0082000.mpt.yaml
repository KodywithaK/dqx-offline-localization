21:
  en: "@a@b*: I heard there was an amazing armourer here, so I came to get some merchandise.\n@c0@"
  ja: "@a@b＊「この町に　すごい　防具職人が\n\tいると聞いて　高く売れる防具を\n\tつくらせようと　やってきましたが……\n@c0@"
  ko: "@a@b*: 이 마을에 굉장한 방어구 장인이\n있다고 해서 비싸게 팔릴 방어구를\n만들어 달라고 하려고 왔습니다만......\n@c0@"
  sl: "@a@b＊：听说这个镇上住着一位\n　　相当厉害的防具工匠，\n　　我是来请他打造高价防具的。\n@c0@"
  tl: "@a@b＊：聽說這個鎮上住著一位\n　　相當厲害的防具工匠，\n　　我是來請他打造高價防具的。\n@c0@"
22:
