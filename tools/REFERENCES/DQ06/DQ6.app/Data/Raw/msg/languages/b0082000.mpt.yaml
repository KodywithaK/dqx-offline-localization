  ko: "@a@b*: 어머~ 당신도 술을\n마시고 싶어? 이곳의 술은\n최고야......\n@c0@"
  sl: "@a@b＊：啊！你也要来一杯吗？\n　　这里的酒是最好的哟。\n@c0@"
  tl: "@a@b＊：啊！你也要來一杯嗎？\n　　這裡的酒是最好的喲。\n@c0@"
15:
  en: "@a@b*: Hey, wh-where am I? Where's Mum? A-And Dad? ...Where are all my friends!?\n@c0@"
  ja: "@a@b＊「ねえ　ここは　どこ？\n\tボクの　ママや　パパや\n\tおともだちは　どこへ　いったの？\n@c0@"
  ko: "@a@b*: 여기는 어디야?\n우리 엄마랑 아빠랑\n친구들은 어딜 간 거야?\n@c0@"
  sl: "@a@b＊：这里是什么地方？\n　　我的爸爸、妈妈还有朋友们，\n　　他们都去哪里了？\n@c0@"
  tl: "@a@b＊：這裡是什麼地方？\n　　我的爸爸、媽媽還有朋友們，\n　　他們都去哪裡了？\n@c0@"
16:
