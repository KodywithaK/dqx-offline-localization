0:
  de: "@aBianca@bSo ein Glück, dass meine Vorstellung uns eine kostenlose Übernachtung eingebracht hat, was?\n@c0@"
  en: "@aBianca@bPretty lucky that that performance of mine got us a free night's lodgin', eh?\n@c0@"
  es: "@aBianca@b¡Qué suerte!, con mi pequeño espectáculo hemos conseguido una noche gratis, ¿eh?\n@c0@"
  fr: "@aBianca@bC'est une chance que ma petite comédie nous ait au moins valu l'hébergement gratuit pour la nuit, nonⓡ \n@c0@"
  it: "@aBianca@bNon tutto il male viene per nuocere, eh?\nIl mio mancamento di ieri ci ha fatto ottenere un pernottamento gratuito! Dovrei svenire più spesso...\n@c0@"
  ja: "@a@bビアンカ「私の　見事な芝居で\n\tタダで一泊できて　うれしいでしょ？\n@c0@"
1:
  de: "@aBianca@bHa ha! War doch nur 'n Witz! Ich bin so weit. Wir müssen uns nur noch beim Herbergsbesitzer bedanken.\n@c0@"
  en: "@aBianca@bHa ha! Only jokin'. I'm ready to go now, so we'd better say thanks to the innkeeper.\n@c0@"
  es: "@aBianca@b¡Ja, ja! ¡Era una broma! Estoy lista para irnosⓓ vamos a despedirnos del posadero.\n@c0@"
  fr: "@aBianca@bHa haⓠ Je plaisante. Je suis prête à partir,\nà présent. Il ne nous reste qu'à remercier l'aubergiste.\n@c0@"
  it: "@aBianca@bSto scherzando, sciocchino!\nDai, andiamo a ringraziare i gestori della locanda...\n@c0@"
  ja: "@a@bビアンカ「なーんてね。\n\tもう　大丈夫だから　宿屋の人に\n\tお礼を　言いにいきましょう。\n@c0@"
2:
  de: "@aNera@bWahrscheinlich war ich gestern nur wegen der dünnen Luft hier so matt.\n@c0@"
  en: "@aNera@bIt's probably the thin air up here that made me feel faint yesterday.\n@c0@"
  es: "@aNera@bDebió de ser el aire de aquí arriba lo que hizo que me desmayase ayer.\n@c0@"
  fr: "@aNera@bC'est probablement la rareté de l'air qui a provoqué mon évanouissement d'hier.\n@c0@"
  it: "@aNera@bCredo che sia stata l'aria rarefatta che c'è qui in montagna a provocare il mio svenimento di ieri...\n@c0@"
  ja: "@a@bフローラ「苦しくなって　たおれたのは\n\tこのあたりの　空気が\n\tうすいからかも知れませんね。\n@c0@"
3:
  de: "@aNera@bImmerhin gab es dort eine Trage, also war ich wohl nicht die erste Besucherin, der das Klima zu schaffen macht.\n@c0@"
  en: "@aNera@bThey had a stretcher here, after all, so\r\nI'm probably not the first visitor to fall\r\nfoul of the climate.\n@c0@"
  es: "@aNera@bSi tenían una camilla, sicuro que no soy el primer visitante al que le sienta mal el clima.\n@c0@"
  fr: "@aNera@bMais ils avaient un brancard sur place, ce qui me\r\nfait dire que je ne suis sans doute pas la première personne à mal supporter le climat.\n@c0@"
  it: "@aNera@bDa queste parti devono essere abituati a soccorrere persone che hanno problemi del genere, visto che sono accorsi subito con una barella!\n@c0@"
  ja: "@a@bフローラ「この村には　タンカも\n\tあったし　私のように　たおれる旅人が\n\t多いのかも知れませんわ……。\n@c0@"
4:
  de: "@aBianca@bSie haben mich doch auf einer Trage hierher gebracht, oder? Hm. Ich wär ja viel lieber von dir getragen worden, %a000090!\n@c0@"
  en: "@aBianca@bThey carried me here on a stretcher, right?\nHuh. I'd have much rathered you carried me, %a000090!\n@c0@"
  es: "@aBianca@bMe trajeron aquí en camilla, ¿verdad?\nMmm. ¡Hubiese preferido que me trajeses tú, %a000090!\n@c0@"
  fr: "@aBianca@bIls m'ont transportée sur un brancard, c'est çaⓡ Hum. J'aurais nettement préféré que ce soit toi qui me porte, %a000090ⓠ\n@c0@"
  it: "@aBianca@bSono stata soccorsa con una barella, non è vero?\nCome mai non mi hai preso in braccio tu, %a000090? Avevi mal di schiena? Eh eh eh!\n@c0@"
  ja: "@a@bビアンカ「私　タンカで運ばれたのよね？\n\tどうせなら　%a000090に\n\t抱かれていきたかったな。　なんてね。\n@c0@"
5:
  de: "@aNera@bDer Mann dort hat geholfen, mich hineinzutragen, nicht wahr?\n@c0@"
  en: "@aNera@bThat man helped carry me inside, didn't he?\n@c0@"
  es: "@aNera@bEse hombre ayudó a llevarme dentro, ¿vero?\n@c0@"
  fr: "@aNera@bCet homme a aidé à me transporter à l'intérieur,\nn'est-ce pasⓡ\n@c0@"
  it: "@aNera@bÈ stato quell'uomo ad aiutarmi, non è vero?\n@c0@"
  ja: "@a@bフローラ「この方も　私を\n\t運んでくださったんですよね。\n@c0@"
6:
  de: "@aNera@bDas ist mir so peinlich! Schon allein der Gedanke, wildfremden Menschen solche Umstände zu machen!\n@c0@"
  en: "@aNera@bI feel so embarrassed. The thought of imposing on total strangers like that!\n@c0@"
  es: "@aNera@b¡Qué vergüenza! Non mi piace niente molestar a los extraños.\n@c0@"
  fr: "@aNera@bJe me sens si embarrassée à l'idée d'avoir été\nune gêne pour de parfaits inconnusⓠ\n@c0@"
  it: "@aNera@bMi sento così imbarazzata...\nNon mi piace stare al centro dell'attenzione!\n@c0@"
  ja: "@a@bフローラ「知らない人にまで\n\tめいわくを　かけてしまって\n\tはずかしいですわ……。\n@c0@"
7:
  de: "@aBianca@bBei der Ankunft hier bin ich zwar zusammen-\ngebrochen, aber jetzt könnte ich wieder Bäume\nausreißen! Das passiert mir nicht noch einmal!\n@c0@"
  en: "@aBianca@bI may have collapsed when we got here, but I feel better than ever now. I won't be doin' that again!\n@c0@"
  es: "@aBianca@bAunque me desmayase al llegar aquí, ahora estoy mejor que nunca. ¡No me volverá a suceder!\n@c0@"
  fr: "@aBianca@bJe me suis évanouie quand nous sommes arrivés, c'est vrai, mais je me sens mieux que jamais, maintenant. Ça ne se reproduira pasⓠ\n@c0@"
  it: "@aBianca@bOra mi sento benissimo.\nTi prometto che non sverrò più!\nCioè, ti prometto che cercherò di non svenire...\n@c0@"
  ja: "@a@bビアンカ「来るときは　たおれちゃったけど\n\t私は　ふだんから　きたえてるもの。\n\tもう　たおれたりしないわ！\n@c0@"
8:
  de: "@aNera@bOb die Frau wohl von der Stadt unten hier heraufgezogen ist? Das würde wieder einmal beweisen, dass die Liebe alle Grenzen überwindet.\n@c0@"
  en: "@aNera@bI wonder if that woman moved here from the town below. That would just go to prove that love conquers all.\n@c0@"
  es: "@aNera@bMe pregunto si esa mujer vino desde la ciudad del valle. Eso querría decir que l'amore puede con todas las dificultades.\n@c0@"
  fr: "@aNera@bJe me demande si cette femme vivait dans la ville qui se trouve plus bas, avant d'emménager ici. Ce serait la preuve que l'amour est plus fort que tout.\n@c0@"
  it: "@aNera@bAnche quella donna ha affrontato un viaggio lungo e faticoso per seguire suo marito...\nAh, la forza dell'amore!\n@c0@"
  ja: "@a@bフローラ「あの女性は　下の町から\n\tここへ　お嫁に来たのかしら？\n\tきっと　苦労より愛が　まさったのね。\n@c0@"
9:
  de: "@aBianca@bDieses Dorf schwebt wirklich über dem Abhang, was? Als könnte es jeden Moment den Berg runterkullern!\n@c0@"
  en: "@aBianca@bThis village is certainly in a precarious old place, eh? It feels like it's about to go rollin' off down the mountain any minute!\n@c0@"
  es: "@aBianca@bEste pueblo está en un sitio bastante precario, ¿eh? ¡Da la sensación de que en cualquier momento se va caer montaña abajo!\n@c0@"
  fr: "@aBianca@bCe village est vraiment installé dans un drôle d'endroit, nonⓡ On dirait qu'il menace de dévaler\nla montagne à n'importe quel momentⓠ\n@c0@"
  it: "@aBianca@bQuesto posto mi dà la sensazione di essere alquanto instabile... Pare quasi che debba precipitare da un momento all'altro!\n@c0@"
  ja: "@a@bビアンカ「あらためて見ると　この村って\n\tずいぶん　こわいところに　あるのね。\n\tガケっぷちの村　って感じかしら。\n@c0@"
10:
  de: "@aBianca@bDie Bewohner halten sich wohlweislich von den Rändern fern, was? Wir sollten uns wohl auch besser an die inneren Wege halten.\n@c0@"
  en: "@aBianca@bThe villagers seem to steer well clear of\r\nthe edges, eh? We should stick to the inner\r\npaths too.\n@c0@"
  es: "@aBianca@bParece que los lugareños no se acercan a los precipicios. Será mejor que utilicemos solo los caminos interiores, ¿sabes?\n@c0@"
  fr: "@aBianca@bLes villageois semblent éviter de marcher trop près du bord. Nous devrions les imiter et rester sur les chemins intérieurs.\n@c0@"
  it: "@aBianca@bGli abitanti del luogo hanno la sana abitudine di camminare lontani dal bordo dei precipizi.\nCredo che dovremmo seguire il loro esempio, sai?\n@c0@"
  ja: "@a@bビアンカ「村の人たちは　ガケのふちに\n\t行ったりしないのね。　あぶないから\n\t私たちも　内側を　歩きましょう。\n@c0@"
11:
  de: "@aNera@bDie Luft hier oben ist so frisch und der Blick ist so fantastisch. Ich wünschte nur, ich hätte den Mut, ihn auch zu genießen!\n@c0@"
  en: "@aNera@bThe air up here is so fresh, and the view is incredible. I just wish I had the courage to\r\nlook at it!\n@c0@"
  es: "@aNera@bEste aire es tan fresco... y la vista es meravigliosa. ¡Lástima que no tenga valor para ponerme a mirarla!\n@c0@"
  fr: "@aNera@bÀ une telle hauteur, l'air est incroyablement pur et\nla vue fantastique. Si seulement j'avais le courage de l'admirerⓠ\n@c0@"
  it: "@aNera@bChe aria fresca! E che panorama meraviglioso! Cioè, IMMAGINO che il panorama sia meraviglioso, perché soffro di vertigini, e non ho il coraggio di guardare!\n@c0@"
  ja: "@a@bフローラ「ここは　空気もおいしくて\n\t見晴らしが　とても　いいですわね。\n\tこわくて　下は　見られませんけど。\n@c0@"
12:
  de: "@aNera@bEs macht mir Angst, dass hier nirgendwo Zäune stehen. Ob von den Bewohnern wohl schon mal einer runtergefallen ist?\n@c0@"
  en: "@aNera@bIt's scary that there are no fences anywhere.\r\nI wonder if any of the villagers ever fall over the edge...\n@c0@"
  es: "@aNera@bQué miedo que no haya ni una sola valla aquí.\r\nVeramente, me pregunto si algún aldeano se habrá caído por el precipicio...\n@c0@"
  fr: "@aNera@bC'est effrayant de voir qu'aucune barrière n'a été installée. Je me demande s'il arrive que des villageois tombent dans le vide...\n@c0@"
  it: "@aNera@bPerché non costruiscono dei muretti protettivi?\nGli abitanti del luogo non hanno paura di precipitare di sotto?!\n@c0@"
  ja: "@a@bフローラ「この村の人たちは\n\tサクがなくても　ガケ下に\n\t落ちたりしないのかしら？\n@c0@"
13:
  de: "@aBianca@bSo weit ich zurückdenken kann, hat es immer Monster gegeben. Ich kann mir kaum vorstellen, wie die Welt ohne sie aussähe.\n@c0@"
  en: "@aBianca@bThere've bin monsters about for as long as I can remember. It's hard to imagine a time when there weren't any.\n@c0@"
  es: "@aBianca@bQue yo recuerde, siempre ha habido monstruos. Es difícil imaginar un tiempo en que no los hubiese, ¿sabes?\n@c0@"
  fr: "@aBianca@bD'aussi loin que je me souvienne, il y a toujours eu des monstres en liberté. Difficile d'imaginer une époque où cela n'était pas le cas.\n@c0@"
  it: "@aBianca@bMa davvero?\nEro convinta che quest'area fosse sempre stata abitata da mostri, ma evidentemente mi sbagliavo...\n@c0@"
  ja: "@a@bビアンカ「私が　生まれたころには\n\tもう　怪物たちが　いたけど\n\tいない時代も　あったのね。\n@c0@"
14:
  de: "@aNera@bSelbst ohne herumstreifende Monster muss man schon fest entschlossen sein, um es ganz bis nach oben zu schaffen.\n@c0@"
  en: "@aNera@bEven if there weren't any monsters around, it would take a certain determined type of person to make his way all the way up here.\n@c0@"
  es: "@aNera@bAunque no hubiese habido mostri, hay que tener una cierta determinazione para llegar hasta aquí arriba.\n@c0@"
  fr: "@aNera@bMême sans monstres alentour, il faut tout de\r\nmême être particulièrement déterminé pour\r\ngrimper jusqu'ici.\n@c0@"
  it: "@aNera@bAnche se non ci fosse nemmeno l'ombra di un mostro, arrivare quassù sarebbe sempre una fatica sovrumana!\n@c0@"
  ja: "@a@bフローラ「たとえ　魔物が　でなくても\n\tここまで来るには　少し\n\t気合いが　必要だと思いますわ。\n@c0@"
15:
  de: "@aBianca@bDas also ist Humburg. Von hier oben kann man gar nicht sagen, ob es nun nah oder fern ist.\n@c0@"
  en: "@aBianca@bSo that's Gotha. It's hard to tell from up here whether it's far away or not.\n@c0@"
  es: "@aBianca@bAsí que eso es Pankraz. Desde aquí arriba no es fácil apreciar si está muy lejos, ¿sabes?\n@c0@"
  fr: "@aBianca@bAlors, voici Gotha. D'ici, il est difficile de dire si c'est loin ou non.\n@c0@"
  it: "@aBianca@bQuello laggiù è il Castello di Denim?\nDa qui è difficile dire quanto sia distante...\n@c0@"
  ja: "@a@bビアンカ「あれが　グランバニアなのね。\n\tここから見ると　近いのか　遠いのか\n\tよく　分からないわ。\n@c0@"
16:
  de: "@aNera@bHinter diesen Mauern steckt also die Burg Humburg.\n@c0@"
  en: "@aNera@bSo the castle inside those walls is Gotha Castle.\n@c0@"
  es: "@aNera@bAsí que aquel castello que se ve dentro de los muros es el castello di Pankraz.\n@c0@"
  fr: "@aNera@bAlors comme ça, le château à l'intérieur des murailles est celui de Gotha.\n@c0@"
  it: "@aNera@bUhm, l'edificio protetto dalle mura dev'essere il Castello di Denim...\n@c0@"
  ja: "@a@bフローラ「あの　城壁に囲まれたお城が\n\tグランバニアなのね……。\n@c0@"
17:
  de: "@aBianca@bHa ha! Der muss ja eine ganz schön resolute Oma haben, um so außer Fassung zu geraten!\n@c0@"
  en: "@aBianca@bHa ha! He must have a scary old grandma to be gettin' that wound up!\n@c0@"
  es: "@aBianca@b¡Ja, ja! ¡Sí que está apurado! ¡Su abuela debe de ser de armas tomar!\n@c0@"
  fr: "@aBianca@bHa haⓠ Il doit vraiment avoir la frousse de sa grand-mère pour être aussi inquietⓠ\n@c0@"
  it: "@aBianca@bBeh, una ramanzina è il minimo che possa aspettarsi per aver rotto un oggetto tanto utile!\n@c0@"
  ja: "@a@bビアンカ「うふふ。\n\tあんなに　オロオロしちゃって\n\tよほど　こわいおばあちゃんなのね。\n@c0@"
18:
  de: "@aNera@bHm? Hast du etwas gesagt?\n@c0@"
  en: "@aNera@bHm? Did you say something?\n@c0@"
  es: "@aNera@b¿Mmm? ¿Has dicho algo?\n@c0@"
  fr: "@aNera@bMmmⓡ Tu m'as parléⓡ\n@c0@"
  it: "@aNera@bSilenzio!\nNon parlare!\nNon farmi perdere la concentrazione!\n@c0@"
  ja: "@a@bフローラ「…え？\n\tなにか　おっしゃいました？\n@c0@"
19:
  de: "@aNera@bTut mir leid. Ich hatte mich darauf konzentriert, über die Brücke zu kommen, ohne wegen der Höhe in Panik zu geraten.\n@c0@"
  en: "@aNera@bSorry. I was concentrating on trying to\r\nget across that bridge without panicking\r\nabout the height.\n@c0@"
  es: "@aNera@bScusi. Estaba concentrada en intentar cruzar ese puente sin quedarme helada de miedo per la altura.\n@c0@"
  fr: "@aNera@bPardon. Je me concentrais pour tenter de franchir ce pont sans paniquer, à cause du vertige.\n@c0@"
  it: "@aNera@bSto cercando di attraversare questo ponte senza pensare che di sotto c'è uno strapiombo!\nE io soffro di vertigini!\n@c0@"
  ja: "@a@bフローラ「私　あのつり橋を渡るのが\n\t精いっぱいで　ぼ～っとして\n\tいましたわ。\n@c0@"
20:
  de: "@aBianca@bIch liebe Katzen. Der da könnte ich den ganzen Tag lang zuschauen!\n@c0@"
  en: "@aBianca@bI love cats. I could stand here watchin' that one all day!\n@c0@"
  es: "@aBianca@bMe encantan los gatos. ¡Me podría pasar todo el día mirándolos!\n@c0@"
  fr: "@aBianca@bJ'adore les chats. Je pourrais rester ici à observer celui-là toute la journéeⓠ\n@c0@"
  it: "@aBianca@bHo un debole per i gatti...\nE quel micino lì è troppo carino!\n@c0@"
  ja: "@a@bビアンカ「ネコのしぐさって\n\t見ていて　あきないわよね。\n@c0@"
21:
  de: "@aNera@bIch verstehe nicht, weshalb so viele darauf bestehen, entweder ein Katzenfreund oder ein Hundefreund zu sein. Ich finde beide wunderbar.\n@c0@"
  en: "@aNera@bI don't understand why so many people choose between being a ⓗcat personⓘ and a ⓗdog personⓘ.\nI adore them both.\n@c0@"
  es: "@aNera@bNo entiendo per qué hay tanta gente que elige entre ser persona ⓕdi gattoⓖ o ⓕdi caneⓖ.\nYo los adoro a ambos.\n@c0@"
  fr: "@aNera@bJe ne comprends pas pourquoi tant de gens se demandent s'ils préfèreraient être un chat ou un chien. Moi, j'adore les deux.\n@c0@"
  it: "@aNera@bChe bel gattino! Sono sicura che piacerebbe anche al mio Bingo! Gli piacerebbe così tanto che se lo mangerebbe in un sol boccone! Ih ih ih!\n@c0@"
  ja: "@a@bフローラ「私は　ネコもイヌも\n\tどちらも　好きですの。\n@c0@"
22:
  de: "@aBianca@bWenn man ein Gericht auf andere Weise zubereitet, essen die Leute oft Dinge, von denen sie geschworen hätten, dass sie sie nicht mögen.\n@c0@"
  en: "@aBianca@bIf you change how you prepare somethin', folk'll often eat things they swear they dun't like.\n@c0@"
  es: "@aBianca@bSi cambias la forma de prepararlas, la gente acaba comiendo cosas que dicen que no les gustan.\n@c0@"
  fr: "@aBianca@bIl suffit parfois de changer le mode de préparation pour que les gens mangent des choses qu'ils jureraient détester.\n@c0@"
  it: "@aBianca@bOdio quando gli adulti costringono i bambini a mangiare! Se uno non ha fame cosa deve fare?! Riempirsi lo stomaco per far contenti gli altri?! Bah!\n@c0@"
  ja: "@a@bビアンカ「料理の方法を　変えれば\n\tキライなものでも　食べられるかもね。\n@c0@"
23:
  de: "@aNera@bOffenbar versucht sie, so gut sie kann, ihren Sohn dazu zu bringen, sich vernünftig zu ernähren. Das kann man nur bewundern.\n@c0@"
  en: "@aNera@bShe's obviously trying her hardest to get her son to eat well. You have to admire her for that.\n@c0@"
  es: "@aNera@bLo que ella realmente quiere es que su hijo coma bene. No puedes más que admirarla por ello.\n@c0@"
  fr: "@aNera@bElle essaie de toute évidence de faire en sorte que son fils mange bien. Cela mérite notre admiration.\n@c0@"
  it: "@aNera@bSecondo me quella donna sta insistendo troppo.\nSi sa come sono fatti i bambini, no? Più si chiede loro di mangiare, più tengono la bocca chiusa!\n@c0@"
  ja: "@a@bフローラ「子どもの　好き嫌いをなくそうと\n\tいろいろ考えていらっしゃるのね。\n\tすばらしいですわ。\n@c0@"
24:
  de: "@aBianca@bEs gibt jede Menge Essen, das du nicht magst, stimmt's nicht, %a000090?\n@c0@"
  en: "@aBianca@bThere's lots of foods you dun't like, en't there, %a000090?\n@c0@"
  es: "@aBianca@bHay un montón de cosas de comer que no te gustan, ¿eh, %a000090?\n@c0@"
  fr: "@aBianca@bIl y a plein de choses que tu n'aimes pas,\nn'est-ce pas, %a000090ⓡ\n@c0@"
  it: "@aBianca@bNemmeno a te piacciono le carote, %a000090...\nDico bene?\n@c0@"
  ja: "@a@bビアンカ「%a000090も\n\t好き嫌い　多かったよね？\n@c0@"
25:
  de: "@aBianca@bHa ha! Du hast dich seit damals kein bisschen verändert!\n@c0@"
  en: "@aBianca@bHa ha! You en't changed a bit since you were a little lad!\n@c0@"
  es: "@aBianca@b¡Ja, ja! ¡No has cambiado nada desde que eras un mocoso!\n@c0@"
  fr: "@aBianca@bHa haⓠ Pour ça, tu n'as pas changé du toutⓠ\n@c0@"
  it: "@aBianca@bEh eh eh!\nLe hai sempre odiate, fin da quand'eri bambino.\n@c0@"
  ja: "@a@bビアンカ「うふふ。\n\t小さい頃から　変わってないのね。\n@c0@"
26:
  de: "@aBianca@bDann hast du dich aber verändert! Ich weiß noch, dass du bei deinem Besuch damals alles Mögliche auf dem Teller liegengelassen hast.\n@c0@"
  en: "@aBianca@bYou've changed then! I remember you leavin' lots of food when you came to stay at our house all them years ago.\n@c0@"
  es: "@aBianca@b¡Pues has cambiado! Me acuerdo que, cuando viniste a casa hace ya muchos años, apartabas cantidad de cosas, ¿sabes?\n@c0@"
  fr: "@aBianca@bTu as changé, alorsⓠ Je me rappelle que tu laissais plein de choses de côté quand tu venais chez nous,\nil y a toutes ces années.\n@c0@"
  it: "@aBianca@bAh, hai imparato a mangiarle?\nRicordo che quand'eri piccolo le lanciavi fuori dalla finestra, quando te le ritrovavi nel piatto...\n@c0@"
  ja: "@a@bビアンカ「食べられるようになったの？\n\t昔　うちに泊まりにきては\n\tたくさん　のこしてたのにね。\n@c0@"
27:
  de: "@aNera@bEs muss schrecklich anstrengend sein, Lebensmittel hier hinauf zu transportieren. Kein Wunder, dass sie böse ist, wenn er nicht alles aufisst.\n@c0@"
  en: "@aNera@bIt must be a terrible bind bringing food all the way up here. No wonder she's angry about him leaving things.\n@c0@"
  es: "@aNera@bDebe de ser una lata traer cosas para mangiare hasta aquí arriba. No me extraña que se enfade si no quiere comérselas.\n@c0@"
  fr: "@aNera@bÇa doit être une corvée terrible de monter de la nourriture jusqu'ici. Pas étonnant qu'elle soit en colère s'il ne mange pas tout.\n@c0@"
  it: "@aNera@bA me le carote piacciono condite con sale, olio e succo di limone.\n@c0@"
  ja: "@a@bフローラ「この村まで　食料を運ぶのは\n\t大変な苦労ですものね。\n\tのこしては　もったいないですわ。\n@c0@"
28:
  de: "@aBianca@bEs macht mich immer ganz verlegen, wenn die Leute so etwas sagen!\n@c0@"
  en: "@aBianca@bI feel all embarrassed when people say things like that!\n@c0@"
  es: "@aBianca@b¡Me da mucho corte cuando la gente dice cosas así!\n@c0@"
  fr: "@aBianca@bJe suis toute gênée quand les gens disent des choses comme çaⓠ\n@c0@"
  it: "@aBianca@bSante parole!\n@c0@"
  ja: "@a@bビアンカ「あんなこと　言われると\n\tてれちゃうな……。　うふふ。\n@c0@"
29:
  de: "@aNera@bWarum siehst du denn so bekümmert aus, Liebling?\n@c0@"
  en: "@aNera@bWhy do you look so troubled, darling?\n@c0@"
  es: "@aNera@bSe te ve apurado, caro mio.\n@c0@"
  fr: "@aNera@bPourquoi as-tu l'air si préoccupé, mon chériⓡ\n@c0@"
  it: "@aNera@bQuella donna sembra aver letto nel mio cuore...\n@c0@"
  ja: "@a@bフローラ「どうしたの　あなた\n\tそんな顔をして……。\n@c0@"
30:
  de: "@aNera@bIch bin wirklich froh, dass ich dich geheiratet habe, und bedaure es kein bisschen. Du und ich, wir werden immer glücklich miteinander sein.\n@c0@"
  en: "@aNera@bI'm really glad I married you and I don't\r\nregret it one bit. We'll always be happy\r\ntogether, you and I.\n@c0@"
  es: "@aNera@bMe alegro molto de haberme casado con te y nunca me arrepentiré. Siempre seremos felices juntos.\n@c0@"
  fr: "@aNera@bJe suis vraiment contente que nous nous soyons mariés, et je ne le regrette pas un seul instant.\r\nToi et moi, nous serons toujours heureux ensemble.\n@c0@"
  it: "@aNera@bAmami e rispettami ogni giorno della mia vita, e ti prometto che ti renderò sempre felice.\n@c0@"
  ja: "@a@bフローラ「私は　あなたと結婚して\n\t本当に　よかったと思っていますわ。\n\tこれからも　いっしょよ。　あなた。\n@c0@"
31:
  de: "@aBianca@bEs tut mir leid, dass du ausgeschimpft wurdest! Bestimmt hat sie es nur gut gemeint.\n@c0@"
  en: "@aBianca@bSorry you got told off! I'm sure she meant well.\n@c0@"
  es: "@aBianca@b¡Siento que te haya regañado! Seguro que lo hizo con buena intención, ¿sabes?\n@c0@"
  fr: "@aBianca@bDésolée que tu te sois fait disputerⓠ Je suis sûre que ça partait d'un bon sentiment.\n@c0@"
  it: "@aBianca@bLa cara signora te ne ha dette quattro, eh?\nAh ah ah! Non preoccuparti, ⓕintelligentoneⓖ...\nSo bene quanto ci tieni a me!\n@c0@"
  ja: "@a@bビアンカ「しかられちゃって　ごめんね。\n\tでも　あのおばあさん　けっこう\n\tやさしい人だよね。\n@c0@"
32:
  de: "@aNera@bEs tut mir so leid, Liebling. Es ist meine Schuld, dass ich in Ohnmacht gefallen bin. Sie hätte dich nicht so schelten dürfen.\n@c0@"
  en: "@aNera@bI'm so sorry, darling. It's my fault that I fainted, so she shouldn't have scolded you like that.\n@c0@"
  es: "@aNera@bLo siento, caro mio. El desmayo fue culpa mía, no debería haberte regañado así.\n@c0@"
  fr: "@aNera@bJe suis désolée, mon chéri. Ce n'est pas de ta faute si je me suis évanouie. Elle n'aurait pas dû s'en prendre à toi comme ça.\n@c0@"
  it: "@aNera@bMi spiace amore mio! Per colpa del mio svenimento ti sei preso una bella partaccia da quella signora!\nIh ih ih! Non te la sarai mica presa, vero?\n@c0@"
  ja: "@a@bフローラ「ごめんなさい　あなた。\n\t私が　倒れたせいで　あなたが\n\tあんな言い方　されてしまって……。\n@c0@"
33:
  de: "@aNera@bIch bin sicher, sie hat es nicht böse gemeint. Vielleicht war sie ein wenig grob, aber sie hat das Herz am rechten Fleck.\n@c0@"
  en: "@aNera@bShe didn't mean anything by it, I'm sure. She may have been a bit blunt, but her heart was in the right place.\n@c0@"
  es: "@aNera@bSeguro que no quiso ofenderte. Quizá ha sido un poco brusca, pero la sua intenzione era buena.\n@c0@"
  fr: "@aNera@bElle ne pensait sans doute pas ce qu'elle disait.\r\nElle a peut-être été un peu directe, mais ses intentions étaient bonnes.\n@c0@"
  it: "@aNera@bSu, non fare quella faccia!\nForse è stata un po' brusca, ma non voleva certo offenderti!\n@c0@"
  ja: "@a@bフローラ「でも…　ぶっきらぼうだけど\n\t思いやりに　あふれた\n\tおばあさまでしたわ……。\n@c0@"
34:
  de: "@aBianca@bWenn er wüsste, dass Ludwig nie mehr wiederkommen wird!\n@c0@"
  en: "@aBianca@bLittle does he know that Pankraz will never be returnin' home now...\n@c0@"
  es: "@aBianca@bNo se imagina que Teudis ya nunca volverá a casa...\n@c0@"
  fr: "@aBianca@bIl ne se doute pas que Petros ne rentrera plus jamais chez lui, désormais.\n@c0@"
  it: "@aBianca@bSì, non dev'essere stato facile superare l'improvvisa scomparsa del Re e della Regina...\n@c0@"
  ja: "@a@bビアンカ「その国王が　パパスさんだったら\n\t帰れるわけがないわね……。\n@c0@"
35:
  de: "@aNera@bWenn sowohl der König als auch die Königin vermisst werden, wer regiert dann hier?\n@c0@"
  en: "@aNera@bIf both the King and Queen of Gotha are missing, I wonder who's ruling the kingdom.\n@c0@"
  es: "@aNera@bSi faltan il rey y la regina de Pankraz, ¿quién gobierna ahora el reino?\n@c0@"
  fr: "@aNera@bSi le roi et la reine de Gotha ont tous les deux disparu, je me demande qui dirige le royaume.\n@c0@"
  it: "@aNera@bMa se sia il Re sia la Regina sono scomparsi, chi è che governa a Denim?\n@c0@"
  ja: "@a@bフローラ「グランバニアは　王も王妃も\n\t不在ということに　なりますわね。\n\t今は誰が　国を治めているのでしょう？\n@c0@"
36:
  de: "@aBianca@bEin Jahr?! Dann will ich nur hoffen, dass sich die Warterei auf den Bussolinger Kompass lohnt!\n@c0@"
  en: "@aBianca@bOne year!? That Batten binnacle had best be worth waitin' for then!\n@c0@"
  es: "@aBianca@b¡¿Un año?! ¡Será mejor que esa bitácora de Habs valga la pena!\n@c0@"
  fr: "@aBianca@bUn an de délaiⓡⓐ Cette boussole de Técarlo a intérêt à valoir une attente pareilleⓠ\n@c0@"
  it: "@aBianca@bUn anno?! La bussola delle nevi dev'essere un oggetto davvero ricercato, se la gente è disposta ad attendere tanto a lungo per averne una!\n@c0@"
  ja: "@a@bビアンカ「１年待ち！？\n\tチゾットのコンパスって\n\tそんなに　いいものなのかな？\n@c0@"
37:
  de: "@aNera@bPapa hat auf seinen Reisen alles Mögliche gesammelt, aber ich glaube, so ein Kompass war nicht dabei.\n@c0@"
  en: "@aNera@bPapa collected all sorts of things on his\r\ntravels, but I don't remember him ever\r\nhaving one of those compasses.\n@c0@"
  es: "@aNera@bIl mio papino coleccionaba todo tipo de objetos de sus viajes, pero no recuerdo que haya tenido nunca una de esas brújulas.\n@c0@"
  fr: "@aNera@bPapa a collectionné toutes sortes de choses au cours de ses voyages, mais dans mon souvenir,\r\nil n'a jamais possédé l'une de ces boussoles.\n@c0@"
  it: "@aNera@bMio padre ha una splendida collezione di oggetti pregiati provenienti da tutto il mondo, ma non credo che possegga una bussola delle nevi...\n@c0@"
  ja: "@a@bフローラ「父は　いろいろな物を\n\t集めていましたが　そのコンパスは\n\t持っていなかったと思いますわ。\n@c0@"
38:
  de: "@aBianca@bDas dürfte doch kein Jahr dauern, nicht mal bei handgefertigten Stücken! Ich wette, ihr Schöpfer gönnt sich ein paar Pausen zu viel!\n@c0@"
  en: "@aBianca@bIt shouldn't take one year even if they are handmade. I reckon whoever's makin' them must be takin' a few too many breaks!\n@c0@"
  es: "@aBianca@bPor mucho que sea hecha a mano, no debería de tardarse un año. ¡Para mí que el artesano que las hace se toma demasiados descansos!\n@c0@"
  fr: "@aBianca@bMême si elles sont faites à la main, ça ne devrait pas prendre un an. À mon avis, la personne qui les fabrique doit prendre des pauses confortablesⓠ\n@c0@"
  it: "@aBianca@bSarà anche la bussola più bella e precisa del mondo, ma ci mettono troppo tempo a costruirla! Nemmeno per fare un figlio ci s'impiega tanto! Eh eh eh!\n@c0@"
  ja: "@a@bビアンカ「１年待ちなのって\n\t手作りのせいだけじゃなく　作り手が\n\tうたたねしてるからじゃ　ないのかな？\n@c0@"
39:
  de: "@aNera@bHat der ein Glück, so ein begehrtes Stück für umsonst zu bekommen! Das war wirklich großzügig von der alten Dame.\n@c0@"
  en: "@aNera@bWe're so lucky, receiving such a sought\r\nafter item for nothing. That old lady\r\nreally was generous.\n@c0@"
  es: "@aNera@b¡Qué suerte!, nos han dado este objeto tan preciado a cambio de niente. Qué generosidad la de esa anciana.\n@c0@"
  fr: "@aNera@bNous avons de la chance d'avoir reçu gratuitement un objet aussi recherché. Cette vieille femme a été d'une grande générosité.\n@c0@"
  it: "@aNera@bSiamo stati proprio fortunati a ricevere in dono un oggetto tanto prezioso e ricercato.\nQuella signora è stata davvero gentile.\n@c0@"
  ja: "@a@bフローラ「私たち　本当に\n\t貴重な物を　いただいたのね。\n\tあの　おばあさんに　感謝しなくては。\n@c0@"
40:
  de: "@aBianca@bDer vollständige Name deiner Mutter lautete Magdalena, oder, %a000090? Ich kann mir nicht vorstellen, dass das bloß ein Zufall ist.\n@c0@"
  en: "@aBianca@bYour mother's full name was Madalena, wasn't it, %a000090? I dun't reckon that's just a coincidence neither.\n@c0@"
  es: "@aBianca@bEl nombre de tu madre era Perséfone, ¿verdad, %a000090? No creo que se trate de una coincidencia.\n@c0@"
  fr: "@aBianca@bLe prénom exact de ta mère était Magdalena,\nn'est-ce pas, %a000090ⓡ Ça m'étonnerait\nqu'il ne s'agisse que d'une coïncidence.\n@c0@"
  it: "@aBianca@bSbaglio o tua madre si chiama Maddalena, %a000090?\nÈ un nome stranamente simile a ⓕMadaⓖ, non trovi?\n@c0@"
  ja: "@a@bビアンカ「%a000090の　お母さんの名前も\n\tマーサ　だったよね。　ここまで\n\t同じだと　ぐうぜんとは　思えないわ。\n@c0@"
41:
  de: "@aBianca@bIch fühle mich immer ganz ruhig und in Frieden mit mir selbst, wenn du mich anschaust, %a000090.\n@c0@"
  en: "@aBianca@bI always feel calm and at peace when you look at me, %a000090.\n@c0@"
  es: "@aBianca@bSiempre que me miras me haces sentir relajada y en paz, %a000090.\n@c0@"
  fr: "@aBianca@bJe me sens toujours paisible et détendue quand tu me regardes, %a000090.\n@c0@"
  it: "@aBianca@bAnch'io provo una sensazione indescrivibile quando mi guardi, %a000090...\n@c0@"
  ja: "@a@bビアンカ「私が　いつも　おだやかな\n\t気持ちでいられるのは　%a000090に\n\t見つめられているからかも……。\n@c0@"
42:
  de: "@aNera@bIch fühle mich in deiner Gegenwart immer entspannt, %a000090. Jetzt wird mir klar, dass es daran liegt, wie du mich anschaust.\n@c0@"
  en: "@aNera@bI've always felt relaxed around you, %a000090. I realise now that it's because of the way you look at me.\n@c0@"
  es: "@aNera@bSiempre me siento relajada cuando estoy con te, %a000090. Ahora me doy cuenta de que es por la forma en que me miras.\n@c0@"
  fr: "@aNera@bJe me suis toujours sentie détendue près de toi, %a000090. Je réalise seulement maintenant que c'est dû à la façon dont tu me regardes.\n@c0@"
  it: "@aNera@bAdesso capisco per quale motivo mi sento sempre serena quando sono con te, %a000090.\nÈ il tuo sguardo che mi scalda il cuore...\n@c0@"
  ja: "@a@bフローラ「私　あなたといると\n\tふしぎと　心が安らぐのですけど\n\tそれは　あなたの目のせいだったのね。\n@c0@"
43:
  de: "@aNera@bHätte ich diese Fähigkeit doch auch! Dann könnte ich dich anschauen und du wärest gleich ruhig und entspannt.\n@c0@"
  en: "@aNera@bIf only I had that skill myself. Then I could look at you and make you feel nice and calm too.\n@c0@"
  es: "@aNera@bMe gustaría tener esa cappacità. Así también podría mirarte y hacer que te sintieses tranquilo y en calma.\n@c0@"
  fr: "@aNera@bSi seulement j'avais ce don, moi aussi. Je pourrais alors t'apaiser et te calmer d'un seul regard.\n@c0@"
  it: "@aNera@bVorrei che anche tu provassi qualcosa di speciale quando ti guardo...\n@c0@"
  ja: "@a@bフローラ「私にも\n\tそんな目があれば　あなたを\n\tなごませてあげられるのに……。\n@c0@"
44:
  de: "@aGriselda@bAuf einer Trage haben sie mich reingebracht? Och, und ich weiß gar nichts mehr davon! Dabei war es doch mein erstes Mal!\n@c0@"
  en: "@aDebora@bSo I was carried here on a stretcher?\r\nWhat a shame I don't remember!\r\nIt was my first time.\n@c0@"
  es: "@aStefania@b¿Así que me han traído en camilla?\r\n¡Lástima, no recuerdo niente!\r\nEra mi prima volta.\n@c0@"
  fr: "@aPandora@bAlors j'ai été emmenée ici sur un brancardⓡ Quel dommage que je ne m'en souvienne pasⓠ C'était la première fois que ça m'arrivait.\n@c0@"
  it: "@aViola@bSono stata portata qui in barella?!\nMa davvero?!\nNon me lo ricordo...\n@c0@"
  ja: "@a@bデボラ「私　タンカで　はこばれたのよね？\n\t残念なことに　覚えてないのよ。\n\t初めての　タンカだったのに……。\n@c0@"
45:
  de: "@aGriselda@bDu würdest... Du würdest mich wohl nicht den Rest der Reise auf einer Trage transportieren wollen, oder?\n@c0@"
  en: "@aDebora@bI don't suppose...\nYou wouldn't carry me around on a stretcher for the rest of our trip, would you?\n@c0@"
  es: "@aStefania@bNon credo que...\r\nOye, ¿tú me llevarías en camilla durante el resto del viaje?\n@c0@"
  fr: "@aPandora@bJe me demande si... \nTu ne voudrais pas me transporter sur un brancard pour le reste de notre voyage, heinⓡ\n@c0@"
  it: "@aViola@bComunque dev'essere un bel modo di viaggiare...\nNon ci si stanca, si può ammirare il panorama...\n㈡\nChe ne diresti di trasportarmi in barella fino alla fine del viaggio?\n@c0@"
  ja: "@a@bデボラ「どうせなら　あんた……\n\tこれからの旅も　タンカで\n\tはこんでくれない？\n@c0@"
46:
  de: "@aGriselda@bEr hat geholfen, mich reinzutragen, oder? Du solltest den Leuten auf jeden Fall in meinem Namen danken, %a000090.\n@c0@"
  en: "@aDebora@bHe helped carry me inside, didn't he? You'd better make sure you thank all these people on my behalf, %a000090.\n@c0@"
  es: "@aStefania@bEse hombre ayudó a llevarme dentro, ¿vero? Da las gracias a todas estas personas de mi parte, %a000090, ¿capisci?\n@c0@"
  fr: "@aPandora@bIl a aidé à me transporter à l'intérieur, c'est çaⓡ\nTu as intérêt à remercier tous ces gens de ma part, surtout, %a000090.\n@c0@"
  it: "@aViola@bÈ stato lui a portarmi dentro, vero? Però, che persona servizievole... Sai, %a000090?\nDovresti prendere esempio da lui!\n@c0@"
  ja: "@a@bデボラ「この人に　助けられたのね。\n\t……助けてくれた人たちに\n\tあんたからも　お礼を言っておいて。\n@c0@"
47:
  de: "@aGriselda@bDa hab ich ja für Aufregung gesorgt, als ich zusammengeklappt bin! Eigentlich hättest du dich um mich kümmern sollen und nicht gleich das halbe Dorf!\n@c0@"
  en: "@aDebora@bI caused a bit of a fuss collapsing like that.\r\nI'd planned that you'd be attending to me, not half the village!\n@c0@"
  es: "@aStefania@bMi desmayo ha causado un poco de conmoción.\r\n¡Yo tenía pensado que tú te ocupases de mí, no tutto el pueblo!\n@c0@"
  fr: "@aPandora@bJ'ai causé un peu d'agitation en m'écroulant comme ça. Je pensais que c'était toi qui t'occuperais de moi, pas la moitié du villageⓠ\n@c0@"
  it: "@aViola@bPerdendo i sensi in quel modo ho messo in subbuglio l'intero villaggio.\n㈡\nDimmi, caro, ti sei ingelosito nel vedere tanta gente pronta a venire in mio soccorso?\n@c0@"
  ja: "@a@bデボラ「倒れて　めいわく　かけたわね。\n\t私が主人として　しもべの　あんたを\n\tしたがえてくる　予定だったのに。\n@c0@"
48:
  de: "@aGriselda@bGanzjährig Schnee? Das ist ganz schlecht. Da hätte ich ja nie Gelegenheit, einen Rock und hohe Absätze zu tragen!\n@c0@"
  en: "@aDebora@bSnow all year round? That's no good. I'd never have the chance to wear a skirt and high heels.\n@c0@"
  es: "@aStefania@b¿Nieve tutto el año? Eso non mi piace. Nunca tendría ocasión de llevar minifalda y tacones.\n@c0@"
  fr: "@aPandora@bDe la neige toute l'annéeⓡ Pas terrible. Je n'aurais jamais l'occasion de porter une jupe et des hauts talons.\n@c0@"
  it: "@aViola@bA Neviternia c'è neve tutto l'anno? Allora non potrei mai vivere qui! Non abiterei mai in un posto dove non è possibile indossare vestitini estivi!\n@c0@"
  ja: "@a@bデボラ「こまるわね。\n\t一年中　雪がなくならないなら\n\tハイヒールと　スカートで　すごせないわ。\n@c0@"
49:
  de: "@aGriselda@bWenn man hier herumläuft, wenn man einen im Tee hat, könnte das leicht böse enden.\n@c0@"
  en: "@aDebora@bIt could be dangerous if you ended up getting a bit tipsy here.\n@c0@"
  es: "@aStefania@bEs pericoloso achisparse un poco aquí.\n@c0@"
  fr: "@aPandora@bÇa doit être dangereux d'avoir la tête qui tourne, ici.\n@c0@"
  it: "@aViola@bNeviternia non è il posto più adatto per avere ai piedi scarpe con i tacchi alti.\n@c0@"
  ja: "@a@bデボラ「この村で　お酒　飲んで\n\tさわぐのは　キケンね。\n@c0@"
50:
  de: "@aGriselda@bEinmal nicht aufgepasst, und schwupps, landet man im Abgrund.\n@c0@"
  en: "@aDebora@bIt'd be far too easy to go tumbling off the edge if you didn't have your wits about you.\n@c0@"
  es: "@aStefania@bSería molto facile caerse por el precipicio si no te andas con mucho ojo, ya sabes, un accidente... ¿capisci?\n@c0@"
  fr: "@aPandora@bIl serait très facile de passer par-dessus le bord\r\nde la falaise en étant inconscient.\n@c0@"
  it: "@aViola@bVisti i precipizi che ci sono da queste parti, è meglio indossare calzature che garantiscano il miglior equilibrio possibile, se non si vuole finire di sotto!\n@c0@"
  ja: "@a@bデボラ「よっぱらって　ガケから\n\t落ちちゃいそうだし。\n@c0@"
51:
  de: "@aGriselda@bDer Alte hat doch keine Ahnung!\n@c0@"
  en: "@aDebora@bThat old man has no idea!\n@c0@"
  es: "@aStefania@b¡Ese vecchio no sabe de qué habla!\n@c0@"
  fr: "@aPandora@bCe vieil homme ne sait pas ce qu'il ditⓠ\n@c0@"
  it: "@aViola@bQuell'uomo ha voglia di prenderci in giro, eh?!\n@c0@"
  ja: "@a@bデボラ「この　おじいさん\n\tツッコミを　待っているのかしら？\n@c0@"
52:
  de: "@aGriselda@bSelbst ohne Monster wär das hier nicht unbedingt der zugänglichste Ort auf Erden.\n@c0@"
  en: "@aDebora@bEven if there weren't any monsters, this isn't exactly the easiest place in the world to reach.\n@c0@"
  es: "@aStefania@bAunque no hubiese monstruos, llegar a este sitio non é tarea facile.\n@c0@"
  fr: "@aPandora@bMême s'il n'y avait pas de monstres, ce n'est pas franchement l'endroit le plus accessible de la terre.\n@c0@"
  it: "@aViola@bMostri o non mostri, arrivare fin qui è un'impresa titanica!\n@c0@"
