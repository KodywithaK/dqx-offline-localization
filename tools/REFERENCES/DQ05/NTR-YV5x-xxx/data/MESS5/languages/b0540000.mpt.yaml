151:
  de: "@aGriselda@bDu hast wirklich eine Vorliebe für Höhlen, nicht wahr, %a000090? Ich kann nicht glauben, dass du als kleiner Junge hierher gekommen bist.\n@c0@"
  en: "@aDebora@bYou certainly love your caves, don't you, %a000090? I can't believe you used to come in here when you were little.\n@c0@"
  es: "@aStefania@bTe encantan las cuevas, ¿no, %a000090? Es incredibile que vinieses aquí de bambino.\n@c0@"
  fr: "@aPandora@bTu adores les grottes, hein, %a000090ⓡ\nJe n'arrive pas à croire que tu venais souvent ici quand tu étais petit.\n@c0@"
  it: "@aViola@bHai una vera passione per le caverne, non è vero?\nNon riesco a credere che tu sia venuto qui quand'eri ancora un poppante, %a000090.\n@c0@"
  ja: "@a@bデボラ「%a000090って　本当に　洞くつ好きね。\n\t子供の頃から　こんな場所に\n\t出入りしてた　っていうのが　すごいわ。\n@c0@"
152:
  de: "@aGriselda@bWir sind ja schon lange verheiratet, aber ich glaube, deine Liebe für Höhlen werde ich nie teilen können.\n@c0@"
  en: "@aDebora@bWe've been married a long time now, but I still don't think I'll ever be able to share your love of caves.\n@c0@"
  es: "@aStefania@bLlevamos un tiempo casados, pero no creo que nunca pueda compartir la tua passione por las cuevas.\n@c0@"
  fr: "@aPandora@bCela fait un bon moment que nous sommes mariés, désormais, mais je crois que je ne pourrai jamais partager ta passion pour ces endroits.\n@c0@"
  it: "@aViola@bTemo che non condividerò mai la tua passione per le grotte, sai? A meno che tu non me ne mostri una soleggiata, fresca, profumata e piena di negozi...\n@c0@"
  ja: "@a@bデボラ「あんたと　結婚してから\n\tずいぶんたつけど　やっぱり　私には\n\t洞くつを好きになるなんて　ムリね。\n@c0@"
153:
  de: "@aGriselda@bHöhlen sind feucht und modrig und dunkel und beklemmend, und es gibt kein Tageslicht.\n@c0@"
  en: "@aDebora@bCaves are damp and smelly and dark and claustrophobic, and there's never any sunshine...\n@c0@"
  es: "@aStefania@bLas cuevas son húmedas, apestosas, me agobian y el sole nunca brilla en su interior...\n@c0@"
  fr: "@aPandora@bLes grottes c'est humide, malodorant, sombre, ça rend claustrophobe et on n'y voit jamais la lumière du soleil...\n@c0@"
  it: "@aViola@bLe caverne sono buie, umide e fredde.\nIn altre parole, sono luoghi odiosi.\n@c0@"
  ja: "@a@bデボラ「洞くつって　じめじめしてるし\n\tカビくさいし　暗いし　せまいし\n\t太陽だって　見えないし……。\n@c0@"
154:
  de: "@aGriselda@bEs hilft auch nicht, dass ich mit einem Höhlenliebhaber verheiratet bin. Ich werde mich nie in einer Höhle wohlfühlen können.\n@c0@"
  en: "@aDebora@bIt doesn't matter that I'm clearly married to a cave fanatic. I still don't see myself ever liking them.\n@c0@"
  es: "@aStefania@bAunque me haya casado, al parecer, con un fanático de las cuevas. Non credo que me gusten jamás.\n@c0@"
  fr: "@aPandora@bPeu importe que je sois mariée à un fanatique de ce genre de lieux. Je ne me vois pas les aimer un jour.\n@c0@"
  it: "@aViola@bCaro maritino, tu le adorerai pure, ma a me continuano a stare assolutamente antipatiche!\n@c0@"
  ja: "@a@bデボラ「あんたが　いくら　洞くつマニアでも\n\t私は　好きになれないわね。\n@c0@"
155:
  de: "@aGriselda@bHier hat dein Vater also seine Nachforschungen über den legendären Helden angestellt.\n@c0@"
  en: "@aDebora@bSo this is where your father carried out his research on the legendary hero.\n@c0@"
  es: "@aStefania@bAsí que aquí era donde il tuo padre investigaba sobre el héroe legendario.\n@c0@"
  fr: "@aPandora@bAlors c'est ici que ton père menait ses recherches\r\nsur le héros légendaire.\n@c0@"
  it: "@aViola@bAllora è qui che tuo padre conduceva le sue ricerche sull'Eroe Leggendario?\n@c0@"
  ja: "@a@bデボラ「ここで　あんたのパパが\n\t伝説の勇者について　研究をしていたのね。\n@c0@"
156:
  de: "@aGriselda@bVielleicht ist es Schicksal, dass du nun mit deinem eigenen Sohn hier stehst.\n@c0@"
  en: "@aDebora@bI wonder if it's fate that you're here now with your own son.\n@c0@"
  es: "@aStefania@bQuizá sea cosa del destino que tú estés aquí ahora con il tuo propio bambino.\n@c0@"
  fr: "@aPandora@bJe me demande si c'est le destin qui a voulu que tu t'y trouves aujourd'hui avec ton propre fils.\n@c0@"
  it: "@aViola@bNon trovi che sia una strana coincidenza che, adesso, tu sia qui con tuo figlio...?\n@c0@"
  ja: "@a@bデボラ「%a001240といっしょに\n\tこうして　この場所へ　来たのも\n\t何かのめぐりあわせ　なのかしら……。\n@c0@"
