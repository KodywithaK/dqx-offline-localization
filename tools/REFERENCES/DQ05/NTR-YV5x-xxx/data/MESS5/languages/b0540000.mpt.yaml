143:
  de: "@aGriselda@bEs ist schon so lange her, und trotzdem sind immer noch nicht genügend Leute hier, um die Stadt wieder aufzubauen.\n@c0@"
  en: "@aDebora@bIt's been so long, and yet there still aren't enough people here to rebuild the town.\n@c0@"
  es: "@aStefania@bAunque han pasado tanti anni, aún no hay suficiente gente para poder reconstruir la città.\n@c0@"
  fr: "@aPandora@bCela fait si longtemps et pourtant il n'y a toujours pas assez de monde ici pour reconstruire la ville.\n@c0@"
  it: "@aViola@bSono passati anni dall'attacco dei soldati, ma il villaggio non è stato ancora ricostruito...\n@c0@"
  ja: "@a@bデボラ「あれから　もう　ずいぶんたつのに\n\tまだ　元通りにできるほどの　人手が\n\t集まらないのね。　無理もないけど……。\n@c0@"
144:
  de: "@aGriselda@bAber mach dir keine Sorgen, %a000090.\n㈡\nWenn wieder Frieden in der Welt herrscht, werden die Leute in Scharen hierher kommen, nicht zuletzt meinetwegen.\n@c0@"
  en: "@aDebora@bNever mind, %a000090. When the world's at peace again, people will flock here because of its connection to me, and then it will all be okay.\n@c0@"
  es: "@aStefania@bNon ti preoccupare, %a000090. Cuando la paz vuelva al mundo, todos querrán venir a este sitio por su relación con me y las cosas mejorarán.\n@c0@"
  fr: "@aPandora@bPeu importe, %a000090. Quand le monde sera de nouveau en paix, les gens afflueront dans ce lieu parce qu'il est lié à moi, et tout ira pour le mieux.\n@c0@"
  it: "@aViola@bNon temere, %a000090.\nQuando sarà tornata la pace, la gente tornerà qui e questo posto tornerà a vivere.\n@c0@"
  ja: "@a@bデボラ「大丈夫よ　%a000090。\n\t世界が　平和になったら\n\t私のゆかりの地として　人が集まるから。\n@c0@"
145:
  de: "@aGriselda@bIch war ja so wütend, als ich in Stein verwandelt wurde. Es hätte wenigstens eine Goldstatue sein können.\n@c0@"
  en: "@aDebora@bI was so angry when I was turned into a statue. They could at least have made it a gold one.\n@c0@"
  es: "@aStefania@bCuando me convirtieron en estatua me puse molto arrabiatta. Al menos podrían haberme hecho de oro.\n@c0@"
  fr: "@aPandora@bJ'étais tellement en colère quand j'ai été transformée en statue. Ils auraient au moins pu la faire en or.\n@c0@"
  it: "@aViola@bRicordo che quando ero una statua covavo dentro di me una rabbia incredibile...\n@c0@"
  ja: "@a@bデボラ「石にされたときは\n\tどうせなら　黄金像にしてよって\n\t怒りくるったわ。\n@c0@"
146:
  de: "@aGriselda@bAber es war diese Wut, die mich am Leben gehalten hat. Wut und die Entschlossenheit, mich zu rächen.\n@c0@"
  en: "@aDebora@bIt was that anger that kept me going, though.\r\nAnger and the determination to have my revenge.\n@c0@"
  es: "@aStefania@bPero era esa rabia la que me daba forza.\nLa rabia y las ganas de vendetta.\n@c0@"
  fr: "@aPandora@bC'est cette colère qui m'a aidée à tenir le coup.\r\nEt la volonté farouche de prendre ma revanche.\n@c0@"
  it: "@aViola@bÈ stata proprio quella rabbia che mi ha impedito di impazzire per il dolore di essere stata separata dalla mia famiglia.\n㈡\nLa rabbia e la voglia di vendicarmi di chi mi aveva privato di tanti anni di vita con mio marito e i miei figli...\n@c0@"
  ja: "@a@bデボラ「いつか　あいつらに\n\t私の怒りを　ぶつけてやるっていう\n\t気持ちだけを　支えに　たえていたのよ。\n@c0@"
147:
  de: "@aGriselda@bWenn du hierbleiben möchtest, habe ich kein Problem damit. Tu, was du nicht lassen kannst.\n@c0@"
  en: "@aDebora@bIf you want to stay here, I don't have a problem with that. Stay whenever you like.\n@c0@"
  es: "@aStefania@bSi quieres quedarte aquí, me parece bene. Pero pídeme permiso, ¿capisci?\n@c0@"
  fr: "@aPandora@bSi tu as envie de rester ici, ça ne me pose pas de problème. Reviens aussi souvent que tu veux.\n@c0@"
  it: "@aViola@bSe vuoi fermarti qui, per me va bene.\n㈡\nCioè, no! Ho sbagliato!\nVolevo dire che ti do il permesso di restare in questa locanda!\n@c0@"
  ja: "@a@bデボラ「あんたが　泊まりたいっていうなら\n\t私は別に　かまわないわよ。\n\t好きなだけ　泊まりなさい。\n@c0@"
148:
  de: "@aGriselda@bWie seltsam, dass an solch einem dunklen Ort Blumen wachsen. Wer sie wohl gepflanzt hat...\n@c0@"
  en: "@aDebora@bIt's strange to see flowers blossoming in such a dark place. I wonder who planted them here.\n@c0@"
  es: "@aStefania@bQué extraño, fiori en un lugar tan oscuro. Me pregunto quién las habrá plantado.\n@c0@"
  fr: "@aPandora@bC'est étrange de voir des fleurs éclore dans un lieu aussi sombre. Je me demande qui les a plantées ici.\n@c0@"
  it: "@aViola@bChe strano vedere dei fiori sbocciare in un luogo privo di luce...\nChissà chi li avrà piantati...\n@c0@"
  ja: "@a@bデボラ「こんなに　暗い場所で\n\t花が咲いていた　なんて　不思議だわ。\n\t誰かが　持ち込んだのかしら？\n@c0@"
