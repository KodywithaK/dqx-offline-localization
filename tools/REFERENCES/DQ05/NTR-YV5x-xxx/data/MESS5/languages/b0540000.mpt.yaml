0:
  de: "@aBianca@bHaben wir wirklich genug Zeit, noch hier zu bleiben, %a000090? Sollten wir nicht besser weiterziehen?\n@c0@"
  en: "@aBianca@bUm, are you sure we've got time to hang about in a place like this, %a000090? Hadn't we better hurry?\n@c0@"
  es: "@aBianca@b¿Seguro que tenemos tiempo para entretenernos en un sitio así, %a000090? ¿No sería mejor que nos diésemos prisa?\n@c0@"
  fr: "@aBianca@bMmm, tu es sûr qu'on a vraiment le temps de traîner ici, %a000090ⓡ On ne ferait pas mieux de se dépêcherⓡ\n@c0@"
  it: "@aBianca@b%0%a000090, sei sicuro che abbiamo tempo per fare un giro da queste parti?\nAbbiamo una certa fretta, sai?\n@c0@"
  ja: "@a@bビアンカ「ねえ　%a000090。\n\tこんな場所に　用があるの？\n\t急がなくて　いいのかしら？\n@c0@"
1:
  de: "@aBianca@bWenn ich das Rauschen des Flusses höre, kommt es mir immer vor, als wäre ich wieder ein kleines Mädchen. Warum nur?\n@c0@"
  en: "@aBianca@bLooking at the river rush by takes me back to bein' a little girl. I wonder why.\n@c0@"
  es: "@aBianca@bLa corriente del río me trae recuerdos de cuando era niña. ¿Por qué será?\n@c0@"
  fr: "@aBianca@bRegarder la rivière couler me rappelle quand j'étais petite. Je ne sais pas pourquoi.\n@c0@"
  it: "@aBianca@bGuardare il fiume che scorre mi fa tornare in mente i giorni della mia infanzia...\n@c0@"
  ja: "@a@bビアンカ「川の流れを　見ていると\n\t子供の頃を　思い出すのよね。\n\tなんでかしら……。\n@c0@"
2:
  de: "@aNera@bDu hast viele Erinnerungen an diesen Ort, nicht? Allerdings sollten wir nicht allzu lange hier verweilen.\n@c0@"
  en: "@aNera@bYou must have a lot of memories here. But we should really try not to dawdle too much.\n@c0@"
  es: "@aNera@bEste sitio debe de traerte molti ricordi, pero será mejor que no nos entretengamos troppo aquí.\n@c0@"
  fr: "@aNera@bJe me doute que tu dois avoir beaucoup de souvenirs ici, mais nous ne devrions vraiment essayer de ne pas trop traîner.\n@c0@"
  it: "@aNera@bCapisco che questo posto ti faccia tornare alla mente tanti ricordi, ma non possiamo permetterci di perdere tempo...\n@c0@"
  ja: "@a@bフローラ「ここは　あなたにとって\n\t思い出ぶかい場所なのかしら？\n\tでも今は　先を急がないと……。\n@c0@"
3:
  de: "@aNera@bDieser Ort wird sich wohl nie ändern. Das Wasser riecht noch genauso wie früher, und das Gras auch.\n@c0@"
  en: "@aNera@bThis place never changes. The water smells just like it always has. And so does the grass.\n@c0@"
  es: "@aNera@bEste lugar no cambia. El olor del acqua es el mismo di sempre. Como el de la hierba.\n@c0@"
  fr: "@aNera@bCet endroit ne change pas. L'eau et l'herbe ont toujours la même odeur.\n@c0@"
  it: "@aNera@bI profumi di questi luoghi sono inconfondibili...\nLi riconoscerei tra mille!\n@c0@"
  ja: "@a@bフローラ「ここは　変わらないわね。\n\t水のにおいも　草のにおいも\n\t昔のままですわ。\n@c0@"
4:
  de: "@a%0%a001240@bWow, was für ein Fluss! Der fließt ins Meer, nicht wahr? Wirklich großartig!\n@c0@"
  en: "@a%0%a001240@bWow! What a cool river! It runs into the sea, right? How amazing!\n@c0@"
  es: "@a%0%a001240@b¡Vaya! ¡Qué río más genial! Y llega hasta el mar, ¿no? ¡Bestial!\n@c0@"
  fr: "@a%0%a001240@bWaouhⓠ Elle est sympa cette rivièreⓠ Elle se jette dans la mer, c'est çaⓡ Impressionnantⓠ\n@c0@"
  it: "@a%0%a001240@bI fiumi sono fatti d'acqua dolce e finiscono in mare, non è così? Allora perché il mare è salato, se dentro ci va l'acqua dei fiumi?!\n@c0@"
  ja: "@a@b%a001240「うわぁ　すごい川……。\n\tこれって　海に続いてるんでしょ？\n\tすっごいなあ……。\n@c0@"
5:
  de: "@a%0%a001250@bDas Wasser ist so klar. Wie gerne würde ich da mal schwimmen gehen.\n@c0@"
  en: "@a%0%a001250@bThe water's so clear. It'd be lovely to swim in.\n@c0@"
  es: "@a%0%a001250@bQué agua tan clara. Me encantaría nadar en ella.\n@c0@"
  fr: "@a%0%a001250@bL'eau est si claire. Ça doit être agréable de nager dedans.\n@c0@"
  it: "@a%0%a001250@bL'acqua è così limpida...\nAvrei proprio voglia di farmi una bella nuotata!\n@c0@"
  ja: "@a@b%a001250「すごく　きれいなお水。\n\t水遊びしたら　気持ちよさそう……。\n@c0@"
6:
  de: "@aSancho@bWenn iss an diese Tag nur mit ihm nach Tifortu gegangen wäre...\n@c0@"
  en: "@aSancho@bEef I just esay I go together weeth heem to Coburg that day...\n@c0@"
  es: "@aSancho@bSi aquel día le hubiese dicho que lo acompañaba a Trastámara...\n@c0@"
  fr: "@aSancho@bS-Si seulement j'avais décidé de l'accompagner\r\nà C-C-Cobourg, ce jour-là...\n@c0@"
  it: "@aSancho@bSi fossi andato con lui a Coburg quel día, forse...\n@c0@"
  ja: "@a@bサンチョ「あの時　私もいっしょに\n\tラインハットへ行っていれば……。\n@c0@"
7:
  de: "@aSancho@bNo. Es ist zu spät jetzt.\n@c0@"
  en: "@aSancho@bNo. Ees too late now.\n@c0@"
  es: "@aSancho@bPero ahora ya es tarde.\n@c0@"
  fr: "@aSancho@bMais c'est t-trop tard, maintenant.\n@c0@"
  it: "@aSancho@bNo. Piensare al passato no serve a nada.\n¡Y esta vez no soy commossos!\n@c0@"
  ja: "@a@bサンチョ「……今さらですよね。\n\tははは……。\n@c0@"
8:
  de: "@a%0%a001240@bIch hätte auch gerne Freunde. Dann könnte ich die ganze Zeit mit ihnen spielen und Spaß haben.\n@c0@"
  en: "@a%0%a001240@bI wish I had friends. Then I could spend all the time playing about and having fun.\n@c0@"
  es: "@a%0%a001240@bMe gustaría tener amigos. Así podría jugar con ellos y pasármelo bien.\n@c0@"
  fr: "@a%0%a001240@bJ'aimerais bien avoir des amis. Je pourrais jouer et m'amuser avec eux.\n@c0@"
  it: "@a%0%a001240@bAnch'io vorrei avere degli amici.\nMi piacerebbe giocare con qualcuno ogni tanto...\n@c0@"
  ja: "@a@b%a001240「ボクも　友だちが\n\tほしいなあ……。\n\tそしたら　いっぱい遊ぶのに。\n@c0@"
9:
  de: "@a%0%a001250@bKomisch, dass du überhaupt nicht gealtert bist, als du eine Statue warst, Papa. Ich wünschte, ich wäre bald erwachsen.\n@c0@"
  en: "@a%0%a001250@bIt's a shame you didn't age at all when you were a statue, Dad. I wish I could be a grown-up soon.\n@c0@"
  es: "@a%0%a001250@bQué lástima que no te hayas hecho mayor mientras estabas convertido en estatua, papá. Yo quiero ser mayor: cuanto antes mejor.\n@c0@"
  fr: "@a%0%a001250@bC'est dommage que tu n'aies pas vieilli quand tu étais une statue, papa. J'aimerais tellement être une grande.\n@c0@"
  it: "@a%0%a001250@bPapà, ma il tuo aspetto non è cambiato perché alle statue non vengono le rughe?\n@c0@"
  ja: "@a@b%a001250「お父さん　石のあいだ\n\tトシとらなかったなんて　かわいそう。\n\tわたしは　はやく　大人になりたいよ。\n@c0@"
10:
  de: "@aSancho@bIss will ja nicht alle Leute von Tifortu verantwortliss machen, aber manchmal denke iss...\n@c0@"
  en: "@aSancho@bI no esay I blame everyone een Coburg, but esometimes I theenk like thees...\n@c0@"
  es: "@aSancho@bNo culpo a nadie en Trastámara, pero a veces pienso...\n@c0@"
  fr: "@aSancho@bJ-Je ne dis pas que c'est la faute de tout le monde à C-Cobourg, mais parfois, c'est ce que je p-pense...\n@c0@"
  it: "@aSancho@b¡Yo no dico que la gente de Coburg es colpevole della muerte del señor Russel, ce mancherebbe altros!\n@c0@"
  ja: "@a@bサンチョ「ラインハットのみなさんを\n\tうらむわけでは　ないですが\n\tときどき　思うんですよ。\n@c0@"
11:
  de: "@aSancho@bWenn du und deine Padre an diese Tag nisst nach Tifortu gerufen worden wärt, dann Señor Ludwig, er würde noch...\n@c0@"
  en: "@aSancho@bEef you and your father, you were no esummoned to Coburg on thees day,\r\nmaybe señor Pankraz, he, he...\n@c0@"
  es: "@aSancho@bSi nomás no os hubiesen llamado a ti y a tu padre a Trastámara aquel día, quizá el señor Teudis no... no...\n@c0@"
  fr: "@aSancho@bSi toi et ton padre, vous n'aviez pas été convoqués\r\nà C-C-Cobourg ce jour-là, peut-être que le señor Petros, il, il...\n@c0@"
  it: "@aSancho@bPerò, si lui no fosse estato convocato da rey Michel, forse tuo padre sarebbe ancora...\r\nYo... Yo me commuovos... ¡Sob!\n@c0@"
  ja: "@a@bサンチョ「あの日　お城へ呼ばれて\n\tおふたりが　出かけなければ\n\tもしかしたら……って。\n@c0@"
12:
  de: "@aBianca@bWir sollten das Ganze auch mal positiv sehen. Immerhin sind wir in der ganzen Zeit nicht gealtert, oder?\n@c0@"
  en: "@aBianca@bI s'pose we should look on the bright side. At least we didn't age in all those years we were statues, eh?\n@c0@"
  es: "@aBianca@bSupongo que hay que mirar el lado bueno. Al menos no hemos envejecido durante los años que hemos sido estatuas, ¿eh?\n@c0@"
  fr: "@aBianca@bIl faut voir les choses du bon côtéⓢ au moins, nous n'avons pas vieilli pendant que nous étions pétrifiés.\n@c0@"
  it: "@aBianca@bAltro che cremine e trattamenti di bellezza vari!\nIl miglior modo per mantenersi sempre giovani è farsi trasformare in statue! Ah ah ah!\n@c0@"
  ja: "@a@bビアンカ「まあね。　石にされてる間\n\tトシを取らなかったってことだけは\n\tラッキーだったわよ。\n@c0@"
13:
  de: "@aNera@bWahrscheinlich sehen wir wirklich so aus wie vor all diesen Jahren... Bevor wir zu Stein verwandelt wurden...\n@c0@"
  en: "@aNera@bYes, we must look just like we did all those years ago before we were turned into stone.\n@c0@"
  es: "@aNera@bSí, debemos de tener veramente el mismo aspecto que teníamos hace años, cuando nos convirtieron en piedra.\n@c0@"
  fr: "@aNera@bOui, nous avons encore le même visage que celui\r\nque nous avions avant d'être transformés en statues, il y a tant d'années.\n@c0@"
  it: "@aNera@bÈ vero, sai? Non siamo cambiati affatto rispetto al giorno in cui fummo trasformati in statue.\r\nPer noi il tempo si è fermato...\n@c0@"
  ja: "@a@bフローラ「私たち　本当に\n\t石にされる前のままの姿\n\tですものねえ……。\n@c0@"
14:
  de: "@aOtto@bIch frag' mich, warum dieser Soldat hier draußen postiert war. Wird er denn net im Schloss gebraucht?\n@c0@"
  en: "@aTuppence@bI wonder why that soldier was posted all the way out here. Don't they need his sort over at the castle?\n@c0@"
  es: "@aAlazar@bMe pregunto por qué había un soldado de guardia aquí, tan lejos. ¡¿Es que no los necesitan en el castillo?!\n@c0@"
  fr: "@aInnocent@bJe me demande pourquoi ce soldat est en faction dans un endroit aussi reculé. Ils n'ont pas besoin\nde lui au châteauⓡ\n@c0@"
  it: "@aSimon@bChissà com'è il rancio dei soldati di Coburg... A Denim si mangia bene, ma servono porzioni poco abbondanti per evitare che le guardie si appisolino dopo i pasti.\n@c0@"
  ja: "@a@bピピン「あの兵士……\n\tこんな所に　配属されるなんて\n\tお城では　役に立てなかったのかなあ。\n@c0@"
15:
  de: "@a%0%a001240@bHast du nicht so einen Steinach-Blaustein, Papa?\n@c0@"
  en: "@a%0%a001240@bDon't you have a Whealbrook bluestone, Dad?\n@c0@"
  es: "@a%0%a001240@b¿No tienes una aguamarina de Arroyofrío, papá?\n@c0@"
  fr: "@a%0%a001240@bTu n'as pas une gemme bleue de Ruycelieu, toi, papaⓡ\n@c0@"
  it: "@a%0%a001240@bPapà, se non sbaglio tu non hai una pietra nobile di Valcava...\n@c0@"
  ja: "@a@b%a001240「お父さん\n\t聖なる原石　持ってないの？\n@c0@"
16:
  de: "@a%0%a001240@bIn Steinach hast du doch auch mal gelebt, als du klein warst, oder? Vielleicht sollten wir dorthin gehen und so einen Stein suchen!\n@c0@"
  en: "@a%0%a001240@bWhealbrook's the place you spent a bit of time when you were little, isn't it? Maybe we should go there and see if we can find some bluestones ourselves!\n@c0@"
  es: "@a%0%a001240@bEn Arroyofrío pasaste un tiempo cuando eras niño, ¿no? ¡Podríamos ir allí a ver si nosotros encontramos la piedra!\n@c0@"
  fr: "@a%0%a001240@bC'est bien à Ruycelieu que tu as un peu habité quand tu étais petitⓡ Peut-être qu'on devrait retourner là-bas pour en chercher uneⓠ\n@c0@"
  it: "@a%0%a001240@bValcava non è il villaggio dove hai vissuto per un po' quand'eri piccolo? Perché non ci andiamo?\nMagari potremmo trovare qualche pietra nobile!\n@c0@"
  ja: "@a@b%a001240「サンタローズって　お父さんが\n\t小さい頃　しばらく　いた村でしょ？\n\tボク　行って石をさがしてみたいなあ。\n@c0@"
17:
  de: "@a%0%a001250@bÜber Steinach-Blausteine habe ich mal was in einem Buch gelesen. Früher konnte man sie in Höhlen finden...\n@c0@"
  en: "@a%0%a001250@bI read about Whealbrook bluestone in a book once. There used to be lots of it about in caves long ago.\n@c0@"
  es: "@a%0%a001250@bUna vez leí algo sobre las aguamarinas de Arroyofrío en un libro. Dicen que había muchas ocultas en una cueva.\n@c0@"
  fr: "@a%0%a001250@bJe me souviens d'avoir lu quelque chose sur les gemmes bleues de Ruycelieu. On en trouvait beaucoup dans les grottes, dans le temps.\n@c0@"
  it: "@a%0%a001250@bHo letto un libro sulle pietre nobili di Valcava.\nDiceva che, tanti anni fa, alcune caverne erano ricche di quei pregiati sassolini...\n@c0@"
  ja: "@a@b%a001250「聖なる原石の話は\n\tわたしも　本で読んだことがあるの。\n\t昔は　洞くつに　いっぱいあったって。\n@c0@"
18:
  de: "@a%0%a001240@bDie ältere Schwester von der Frau muss ja noch viel älter sein, als sie es schon ist!\n@c0@"
  en: "@a%0%a001240@bThat old woman's elder sister must be even more of an old woman than she is!\n@c0@"
  es: "@a%0%a001240@b¡La hermana mayor de esa abuelita debe de ser aún más vieja que ella!\n@c0@"
  fr: "@a%0%a001240@bLa sœur aînée de cette dame doit être encore plus vieille qu'elleⓠ\n@c0@"
  it: "@a%0%a001240@bQuella donna anziana ha una sorella ancora più vecchia di lei?! Accidenti! Deve avere la stessa età dello zio Sancho! Eh eh eh!\n@c0@"
  ja: "@a@b%a001240「あの　おばあさんのお姉さんって\n\tもっと　おばあさんってことだよね。\n@c0@"
19:
  de: "@a%0%a001250@bIch liebe Tombolas! Hast du nicht ein paar Tombola-Tickets, Papa? Können wir nicht mal da hingehen? Och, bitte!\n@c0@"
  en: "@a%0%a001250@bI love tombolas! Have you got any tombola tickets, Dad? Can we go sometime? Pretty please!\n@c0@"
  es: "@a%0%a001250@b¡Me encantan las tómbolas! ¿Tienes boletos de tómbola, papá? ¿Me llevarás un día? ¡Va, por favor!\n@c0@"
  fr: "@a%0%a001250@bJ'adore les tombolasⓠ Tu as des tickets de tombola, papaⓡ On pourra y allerⓡ S'il te plaîtⓠ\n@c0@"
  it: "@a%0%a001250@bAdoro la tombola!\nPapà, hai dei biglietti per la tombola?\nMi porteresti a giocare qualche volta?\n@c0@"
  ja: "@a@b%a001250「わたし　福引き　好き！\n\tお父さん　福引き券　持ってる？\n\tあとで　つれていってね。\n@c0@"
20:
  de: "@a%0%a001250@bIch kann das Wasser rauschen hören. Das ist sehr beruhigend.\n@c0@"
  en: "@a%0%a001250@bYou can hear the water running by. It makes me feel all calm and relaxed.\n@c0@"
  es: "@a%0%a001250@bSe puede oír el murmullo del agua. Ese sonido me tranquiliza.\n@c0@"
  fr: "@a%0%a001250@bOn peut entendre l'eau couler. Je me sens calme et détendue.\n@c0@"
  it: "@a%0%a001250@bSenti il suono dell'acqua che scorre?\nLo trovo così rilassante...\n@c0@"
  ja: "@a@b%a001250「水の音が　聞こえる。\n\t聞いてると　なんだか落ちつくね。\n@c0@"
21:
  de: "@a%0%a001240@bWir sind jetzt direkt unter dem Fluss, oder? Ich frage mich, wie sie diesen Tunnel gebaut haben. Du glaubst doch nicht, dass er einstürzt, oder?\n@c0@"
  en: "@a%0%a001240@bWe're under the river now, aren't we? I wonder how they made this tunnel. You don't think it'll collapse or anything, do you?\n@c0@"
  es: "@a%0%a001240@bAhora estamos debajo del río, ¿verdad? Me pregunto cómo han hecho este túnel. No se derrumbará o algo así, ¿verdad?\n@c0@"
  fr: "@a%0%a001240@bOn est sous la rivière, c'est çaⓡ Je me demande comment ils ont pu creuser ce tunnel. Dis, il ne\npeut pas s'écrouler, heinⓡ\n@c0@"
  it: "@a%0%a001240@bOra siamo sotto il fiume, non è vero?\nNon è che ora la galleria crolla e facciamo la fine dei topi?\n@c0@"
  ja: "@a@b%a001240「ここって　川の下なんだよね。\n\tこの道　どうやって　つくったんだろ。\n\tこわれたりしないのかな？\n@c0@"
22:
  de: "@aSancho@bVor viele, viele Jahre gab es eine alte Señor auf der Tifortu-Seite des Flusses, der den ganzen Tag aufs Wasser geschaut hat.\n@c0@"
  en: "@aSancho@bI remember now. Many years ago, there was an old señor on the Coburg eside of the river who espent hees time just looking eento the water.\n@c0@"
  es: "@aSancho@b¡Ay, caramba!, ya recuerdo. Hace muchos años, había un señor a la orilla del río de Trastámara que se la pasaba mirando al agua.\n@c0@"
  fr: "@aSancho@bJe me souviens, il y a t-très longtemps, il y avait un vieux señor sur la rive, côté C-Cobourg. Il passait son temps à r-regarder l'eau.\n@c0@"
  it: "@aSancho@bMuchos años fa, ce estava un señor que passava todo los días a guardare el río que escorre nel Regno de Coburg...\n@c0@"
  ja: "@a@bサンチョ「そういえば　昔\n\tラインハット側の岸で川面を\n\tながめ続ける老人が　おられましたな。\n@c0@"
23:
  de: "@aSancho@bIss frage miss, was aus ihm geworden ist...\n@c0@"
  en: "@aSancho@bI wonder how he ees now.\n@c0@"
  es: "@aSancho@bMe pregunto qué habrá sido de él.\n@c0@"
  fr: "@aSancho@bJ-Je me demande ce qu'il est devenu.\n@c0@"
  it: "@aSancho@bForse gli era caduto qualcosas nell'agua...\n@c0@"
  ja: "@a@bサンチョ「今は　どうして\n\tおられるのやら……。\n@c0@"
24:
  de: "@aBianca@bDieser Ort erinnert mich an die Zeit, als ich vor all den Jahren aus Wittenhausen weggegangen bin. Wie die Zeit doch vergeht, nicht wahr?\n@c0@"
  en: "@aBianca@bComin' here reminds me of the time I moved from Roundbeck all them years ago. Time flies, eh?\n@c0@"
  es: "@aBianca@bAl venir aquí me he acordado de cuando me trasladé a Golfo Blanco, ya hace muchos años. El tiempo vuela, ¿sabes?\n@c0@"
  fr: "@aBianca@bCet endroit me rappelle l'époque où nous avons déménagé de Blanchecombe. Le temps passe si vite.\n@c0@"
  it: "@aBianca@bRicordo quando lasciai Blankenburg per trasferirmi ad Aprianuam. Mi sembra ieri, eppure sono trascorsi tanti anni da allora...\n@c0@"
  ja: "@a@bビアンカ「ここに来ると　アルカパから\n\t引っ越したときのことを　思い出すの。\n\tもう　ずいぶん　昔のことなのにね。\n@c0@"
25:
  de: "@aNera@bHier haben wir uns zum ersten Mal getroffen, weißt du noch? Wie schnell die Zeit doch vergangen ist!\n@c0@"
  en: "@aNera@bThis is where we first met, isn't it? How the years have flown by since then!\n@c0@"
  es: "@aNera@bAquí es donde nos conocimos, ¿vero, caro mio? ¡Cómo han pasado los años desde aquel día!\n@c0@"
  fr: "@aNera@bC'est ici que nous nous sommes rencontrés pour la première fois. Comme le temps a passé vite, depuisⓠ\n@c0@"
  it: "@aNera@bRicordi?\nFu qui che ci vedemmo per la prima volta.\nCome passa il tempo...\n@c0@"
  ja: "@a@bフローラ「ここは　私たちが　初めて\n\t出会った思い出の場所ですもの。\n\tつい　来てしまいますわよね。\n@c0@"
26:
  de: "@a%0%a001240@bGibt es hier auch Boote? Warst du schon mal auf einem Boot, Papa? Das stelle ich mir aufregend vor! Ich will auch mal auf ein Boot! Bitte, bitte!\n@c0@"
  en: "@a%0%a001240@bDo boats come here? Have you been on one, Dad? That's so cool! I want to go on a boat!\nTake me on a boat!\n@c0@"
  es: "@a%0%a001240@b¿Llegan barcos aquí? ¿Has estado en uno, papi? ¡Genial! ¡Yo quiero ir en barco!\n¡Llévame en barco!\n@c0@"
  fr: "@a%0%a001240@bIl y a des bateaux qui viennent iciⓡ Tu es déjà monté sur un bateau, papaⓡ C'est génialⓠ Je veux monter sur un bateau, moi aussiⓠ Allezⓠ\n@c0@"
  it: "@a%0%a001240@bPapà, quante navi attraccano a questo porto ogni giorno?\nTu lo sai?\n@c0@"
  ja: "@a@b%a001240「ここ　船が来るの？\n\tお父さん　乗ったことあるの？\n\tいいなあ！　ボクも　ボクも！\n@c0@"
27:
  de: "@a%0%a001250@bDas Meer hat eine wunderbare Farbe. Und sieh nur, wie die Wellen ans Ufer schlagen...\n@c0@"
  en: "@a%0%a001250@bThe sea is such a pretty colour. And look at how the waves rock up and down.\n@c0@"
  es: "@a%0%a001250@bEl color del mar es precioso. Y mira cómo se mecen las olas.\n@c0@"
  fr: "@a%0%a001250@bLa mer a une si jolie couleur. Et regarde le mouvement des vagues.\n@c0@"
  it: "@a%0%a001250@bMi piace guardare il mare...\nIl profumo della salsedine, il rumore delle onde...\nAh, che meraviglia!\n@c0@"
  ja: "@a@b%a001250「海の色　きれい……。\n\t波が　ゆらゆらしてるね。\n@c0@"
28:
  de: "@aSancho@bHier wir sind nisst weit von Steinach. An diese Ort habe iss keine gute Erinnerungen.\n@c0@"
  en: "@aSancho@bEes eso near to Whealbrook here. Ees a place weeth very painful memories for me.\n@c0@"
  es: "@aSancho@bHíjole, estamos muy cerca de Arroyofrío. Eso me trae recuerdos reteamargosos.\n@c0@"
  fr: "@aSancho@bO-On n'est vraiment pas loin de Ruycelieu ici.\r\nC-Cet endroit me r-rappelle des s-souvenirs douloureux.\n@c0@"
  it: "@aSancho@bEsto posto no es lontano da Valcava...\n¡Ay, quantos recuerdos!\n@c0@"
  ja: "@a@bサンチョ「このあたりは\n\tサンタローズに近くて　イヤでも\n\tいろんなことを　考えてしまいますね。\n@c0@"
29:
  de: "@aOtto@bWir hätten wirklich einen Künstler mitnehmen sollen, %a000090.\n@c0@"
  en: "@aTuppence@bWhat an oversight! We should've brought an artist along with us, %a000090.\n@c0@"
  es: "@aAlazar@b¡Qué despiste! Deberíamos haber traído a un artista, %a000090.\n@c0@"
  fr: "@aInnocent@bC'est vraiment bêteⓠ Nous aurions dû emmener un peintre avec nous, %a000090.\n@c0@"
  it: "@aSimon@bChe panorama meraviglioso!\nSe qui ci fosse un pittore, gli chiederei di mettere su tela questo splendore...\n@c0@"
  ja: "@a@bピピン「ぬかりました　%a000090さま！\n\t画家を連れてくるべきでした！\n@c0@"
30:
  de: "@aOtto@bDann hätte er Porträts von mir anfertigen können, um meine heroischen Taten für die Nachwelt festzuhalten.\n@c0@"
  en: "@aTuppence@bThen I could have had lots of lovely heroic portraits done of me on my travels to keep for posterity!\n@c0@"
  es: "@aAlazar@b¡Así podría haberme pintado un montón de retratos heroicos de mis viajes para la posteridad!\n@c0@"
  fr: "@aInnocent@bIl aurait pu réaliser de magnifiques portraits héroïques de moi pendant notre périple pour\nla postéritéⓠ\n@c0@"
  it: "@aSimon@bOvviamente, nel dipinto dovrei esserci anch'io, così il paesaggio sarebbe ancora più bello!\n@c0@"
  ja: "@a@bピピン「そうすれば\n\t旅先での　ボクの勇姿の数々を\n\t歴史に　残しておけたのに！\n@c0@"
31:
  de: "@aBianca@bWar ihr Mann nicht der Kerl, der immerzu geschlafen hat? Wie konnte ihm so was nur passieren?\n@c0@"
  en: "@aBianca@bIsn't her poor husband that bloke who was always sleepin'? How did he end up comin' a cropper?\n@c0@"
  es: "@aBianca@bSu pobre marido ¿no es ese tipo que estaba siempre durmiendo? ¿Cómo ha acabado así?\n@c0@"
  fr: "@aBianca@bSon mari n'était pas celui qui dormait sans arrêtⓡ Comment ça a bien pu lui arriverⓡ\n@c0@"
  it: "@aBianca@bLa signora dev'essere la moglie di quel tipo che dormiva sempre.\nSuo marito deve aver fatto una fine orribile...!\n㈡\nBeh, almeno ora riposerà in eterno!\nSanta dea, perdonami!\nNon volevo mancare di rispetto a quel poveretto!\n@c0@"
  ja: "@a@bビアンカ「うちの人って\n\t居眠りばかりしてた　あのおじさん？\n\tいったい　どうしてそんなことに……。\n@c0@"
32:
  de: "@aNera@bDie arme Frau, auf solch schreckliche Weise ihren Mann zu verlieren. Alleine der Gedanke daran lässt mich erschaudern.\n@c0@"
  en: "@aNera@bThe poor woman, losing a loved one like that. Just the thought of it makes me feel utterly wretched.\n@c0@"
  es: "@aNera@bPoverina, perder così a un ser querido. Mi sento fatal solo de pensarlo.\n@c0@"
  fr: "@aNera@bPauvre femmeⓠ Perdre la personne qu'elle aime comme ça. Rien que l'idée me déprime.\n@c0@"
  it: "@aNera@bComprendo il dolore di quella donna...\nPerdere una persona cara è una sofferenza incredibile.\n@c0@"
  ja: "@a@bフローラ「まあ……。\n\t愛する人を　失うなんて……\n\t私　考えてみただけで　つらいです。\n@c0@"
33:
  de: "@a%0%a001240@bOnkel Bastl hat immer gesagt, dass es wichtig ist, Menschen in Not zu helfen.\n@c0@"
  en: "@a%0%a001240@bPrince Albert always said it's important to help a person who's in distress.\n@c0@"
  es: "@a%0%a001240@bEl príncipe Agila siempre decía que es importante ayudar a las personas que lo necesitan.\n@c0@"
  fr: "@a%0%a001240@bLe prince Albert a toujours dit qu'il fallait aider les personnes en détresse.\n@c0@"
  it: "@a%0%a001240@bLo zio Alberto ci dice sempre che bisogna aiutare chi è in difficoltà.\n@c0@"
  ja: "@a@b%a001240「困っている人がいたら\n\t助けてあげなさいって　いつも\n\tオジロンおじさんが言うんだ。\n@c0@"
34:
  de: "@a%0%a001240@bVielleicht hilft es der Frau ja, wenn wir Nimzo besiegen. Wir müssen es wenigstens versuchen, Papa!\n@c0@"
  en: "@a%0%a001240@bMaybe it'll be a help to that woman if we defeat Nimzo. We have to at least try, Dad!\n@c0@"
  es: "@a%0%a001240@bA lo mejor podemos ayudar a esa pobre mujer derrotando a Nimzo. ¡Tenemos que intentarlo, papi!\n@c0@"
  fr: "@a%0%a001240@bPeut-être que nous aiderons cette dame si nous battons Nimzo. Il faut au moins essayer, papaⓠ\n@c0@"
  it: "@a%0%a001240@bSono certo che quella signora si sentirà meglio, se sconfiggeremo il Gran Maestro Nimzo!\nDai, papà, facciamo a fettine quel cattivone!\n@c0@"
  ja: "@a@b%a001240「おばさんを　助けてあげるには\n\t魔王のヤツを　たおせばいいのかな？\n\tお父さん！　がんばろうね！\n@c0@"
35:
  de: "@a%0%a001250@bNicht alle Monster sind schlecht. Aber die Leute verstehen das nicht. Trotzdem tut mir diese Frau leid.\n@c0@"
  en: "@a%0%a001250@bNot all monsters are bad. People don't realise that. But it is a shame for that woman.\n@c0@"
  es: "@a%0%a001250@bNo todos los monstruos son malos. La gente no se da cuenta. Pero esa mujer me da mucha lástima.\n@c0@"
  fr: "@a%0%a001250@bTous les monstres ne sont pas méchants. Les gens ne s'en rendent pas compte. Mais c'est quand même triste pour cette dame.\n@c0@"
  it: "@a%0%a001250@bMi dispiace moltissimo per il marito di quella povera donna...\nSì, dobbiamo eliminare i mostri. Ma solo quelli cattivi!\n@c0@"
  ja: "@a@b%a001250「悪い魔物さんばかりじゃ\n\tないんだけど……。\n\tでも　あの人　かわいそう。\n@c0@"
36:
  de: "@aSancho@bPuh, das ist ja so traurig! Du musst etwas unternehmen, Chico. Die Welt muss endliss wieder in Frieden leben!\n@c0@"
  en: "@aSancho@bUf! Ees eso esad!\r\nYou must do esometheeng, My Majesty.\r\nYou must return the world to peace.\n@c0@"
  es: "@aSancho@b¡Ay, caramba! ¡Qué tristeza!\nTiene que hacer algo, Majestad.\nTiene que devolver la paz al mundo, nomás.\n@c0@"
  fr: "@aSancho@bPfffⓠ C'est si t-triste. Tu dois faire quelque chose, M-Ma Majesté. Tu dois ramener la p-paix dans ce monde.\n@c0@"
  it: "@aSancho@b¡Ay, que cosa triste!\n¡Chico, dobbiamo fare todo el posible por reportare la paz nel mundo!\n@c0@"
  ja: "@a@bサンチョ「なんと　いたましい……。\n\t%a000090王　早く　どうにかして\n\tこの世の中を　平和にしないと。\n@c0@"
37:
  de: "@aBianca@bDieser Ort erinnert mich an die Zeit, als ich vor all den Jahren aus Wittenhausen weggegangen bin. Wie die Zeit doch vergeht, nicht wahr?\n@c0@"
  en: "@aBianca@bComin' here reminds me of the time I moved from Roundbeck all them years ago. Time flies, eh?\n@c0@"
  es: "@aBianca@bAl venir aquí me he acordado de cuando me trasladé a Golfo Blanco, ya hace muchos años. El tiempo vuela, ¿sabes?\n@c0@"
  fr: "@aBianca@bCet endroit me rappelle l'époque où nous avons déménagé de Blanchecombe. Le temps passe si vite.\n@c0@"
  it: "@aBianca@bRicordo quando lasciai Blankenburg per trasferirmi ad Aprianuam. Mi sembra ieri, eppure sono trascorsi tanti anni da allora...\n@c0@"
  ja: "@a@bビアンカ「ここに来ると　アルカパから\n\t引っ越したときのことを　思い出すの。\n\tもう　ずいぶん　昔のことなのにね。\n@c0@"
38:
  de: "@aNera@bHier haben wir uns zum ersten Mal getroffen, weißt du noch? Wie schnell die Zeit doch vergangen ist!\n@c0@"
  en: "@aNera@bThis is where we first met, isn't it? How the years have flown by since then!\n@c0@"
  es: "@aNera@bAquí es donde nos conocimos, ¿vero, caro mio? ¡Cómo han pasado los años desde aquel día!\n@c0@"
  fr: "@aNera@bC'est ici que nous nous sommes rencontrés pour la première fois. Comme le temps a passé vite, depuisⓠ\n@c0@"
  it: "@aNera@bRicordi?\nFu qui che ci vedemmo per la prima volta.\nCome passa il tempo...\n@c0@"
  ja: "@a@bフローラ「ここは　私たちが　初めて\n\t出会った思い出の場所ですもの。\n\tつい　来てしまいますわよね。\n@c0@"
39:
  de: "@a%0%a001240@bEs ist so dunkel, dass man gar nicht mehr sieht, wo der Weg aufhört und das Meer anfängt.\n㈡\nWir müssen sehr vorsichtig sein, sonst landen wir noch im Wasser!\n@c0@"
  en: "@a%0%a001240@bIt's too dark to see where the path ends and the sea starts. We'd better watch that we don't fall in!\n@c0@"
  es: "@a%0%a001240@bEstá demasiado oscuro, no se ve dónde acaba el camino y empieza el mar. ¡Vayamos con cuidado de no caernos!\n@c0@"
  fr: "@a%0%a001240@bIl fait trop nuit pour qu'on voit où s'arrête le chemin et où commence la mer. Il vaut mieux faire attention, sinon on risque de tomberⓠ\n@c0@"
  it: "@a%0%a001240@bCon questo buio non si vede dove finisce il sentiero e dove inizia il mare... Se non stiamo attenti, faremo un bel bagno fuori programma!\n@c0@"
  ja: "@a@b%a001240「暗いから　海なのか\n\t地面なのか　よくわかんないや。\n\t落ちないように　気をつけないと。\n@c0@"
40:
  de: "@a%0%a001250@bIch bin müde.\n@c0@"
  en: "@a%0%a001250@bI'm sleepy.\n@c0@"
  es: "@a%0%a001250@bTengo sueño.\n@c0@"
  fr: "@a%0%a001250@bJ'ai sommeil.\n@c0@"
  it: "@a%0%a001250@bHo sonno...\n@c0@"
  ja: "@a@b%a001250「眠いよ～……。\n@c0@"
41:
  de: "@aSancho@bEs ist nisst sehr höfliss, den Leuten nachts eine Besuch abzustatten.\n@c0@"
  en: "@aSancho@bEes no polite to visit people at night.\n@c0@"
  es: "@aSancho@bVisitar a la gente de noche es de maleducados.\n@c0@"
  fr: "@aSancho@bC-Ce n'est pas poli de rendre visite aux gens la nuit.\n@c0@"
  it: "@aSancho@bNo es bueno andare en casa altrui de noche...\n@c0@"
  ja: "@a@bサンチョ「あんまり夜ふけに\n\t人さまを　たずねるもんじゃ\n\tありませんよ。\n@c0@"
42:
  de: "@aSancho@bWir lassen es einfach und kommen morgen wieder, si, Chico?\n@c0@"
  en: "@aSancho@bWe leave and come again tomorrow, okay?\n@c0@"
  es: "@aSancho@bVámonos y ya volvemos mañana.\n@c0@"
  fr: "@aSancho@bIl vaut mieux s'en aller et r-revenir mañana, noⓡ\n@c0@"
  it: "@aSancho@bAndiamo via, chico.\nTorneremo mañana.\n@c0@"
  ja: "@a@bサンチョ「さあさ　今日は　出直して\n\tまた明日　来ましょうね。\n@c0@"
43:
  de: "@a%0%a001250@bOh nein. Sie scheint einen bösen Traum zu haben.\n@c0@"
  en: "@a%0%a001250@bOh dear. It looks like she's having an upsetting dream.\n@c0@"
  es: "@a%0%a001250@bOh, cielos. Parece que está soñando algo terrible.\n@c0@"
  fr: "@a%0%a001250@bLa pauvre. On dirait qu'elle fait un sacré cauchemar.\n@c0@"
  it: "@a%0%a001250@bCredo che stia sognando qualcosa di poco piacevole...\n@c0@"
  ja: "@a@b%a001250「……あの人\n\tこわくて悲しい夢　見てるのね。\n\tかわいそう……。\n@c0@"
44:
  de: "@aNera@bIch hoffe, dass es ihr bald wieder besser geht.\n@c0@"
  en: "@aNera@bI wonder how long she'll go on feeling so terrible.\n@c0@"
  es: "@aNera@bMe pregunto cuánto le durará esa sensazione tan orribile.\n@c0@"
  fr: "@aNera@bJe me demande combien de temps durera son chagrin.\n@c0@"
  it: "@aNera@bForse sta sognando suo marito...\nPovera donna...\n@c0@"
  ja: "@a@bフローラ「あの方の　悲しみが\n\tいつか　いやされますように……。\n@c0@"
45:
  de: "@aSancho@bEs ist immer das Schlimme, was du in deine Träume siehst. Si, si, iss weiß...\n@c0@"
  en: "@aSancho@bEes always the esad theengs you esee een your dreams. Sí, sí. I understand.\n@c0@"
  es: "@aSancho@bEn sueños siempre se ven las cosas más tristes. Sí, lo sé.\n@c0@"
  fr: "@aSancho@bC'est toujours les m-mauvaises choses qu'on voit dans ses rêves. Si, si, je c-compatis.\n@c0@"
  it: "@aSancho@bPovera señora...\nNo riesce a trovare paz nemmenos cuando dorme...\n@c0@"
  ja: "@a@bサンチョ「忘れたい思い出ばかり\n\t夢に見るものです。\n\tあの人も　きっと……。\n@c0@"
46:
  de: "@aBianca@bEs macht mich immer traurig, hier zu sein.\nAllerdings nicht so traurig wie damals, als wir in Statuen verwandelt wurden und all die Jahre getrennt waren.\n@c0@"
  en: "@aBianca@bIt always makes me feel sad comin' here.\n@c0@"
  es: "@aBianca@bVenir aquí siempre me hace sentir triste, ¿sabes?\nAunque no tanto como cuando nos convirtieron en estatuas y tuvimos que pasarnos años separados, claro.\n@c0@"
  fr: "@aBianca@bJe suis toujours triste quand je viens ici.\n@c0@"
  it: "@aBianca@bOgni volta che torno qui mi prende una tristezza incredibile...\n@c0@"
  ja: "@a@bビアンカ「ここには　いつ来ても\n\t悲しくなっちゃうわね。\n@c0@"
47:
  de: "@aNera@bSo viele Jahre sind schon vergangen, und trotzdem hat sich hier kaum etwas verändert.\n@c0@"
  en: "@aNera@bAll those years have passed, and yet this place has hardly changed at all.\n@c0@"
  es: "@aNera@bDopo di tanti anni, este sitio apenas ha cambiado.\n@c0@"
  fr: "@aNera@bToutes ces années ont passé et cet endroit n'a pas presque pas changé.\n@c0@"
  it: "@aNera@bSono trascorsi tanti anni, ma questo posto non è cambiato quasi per niente...\n@c0@"
  ja: "@a@bフローラ「もう　ずいぶん\n\tたったというのに　ここは　まだ\n\t前のままの　すがたなのね……。\n@c0@"
48:
  de: "@a%0%a001240@bWir haben mit Sancho ja überall nach dir gesucht, aber hier sind wir nie gewesen.\n@c0@"
  en: "@a%0%a001240@bWe looked all over for you with Sancho, but we never came here.\n@c0@"
  es: "@a%0%a001240@bTe buscamos por todos lados con Sancho, pero nunca vinimos aquí.\n@c0@"
  fr: "@a%0%a001240@bOn vous a cherchés partout avec Sancho, mais on n'est jamais venus ici.\n@c0@"
  it: "@a%0%a001240@bQuando ti cercavamo con lo zio Sancho, girammo mezzo mondo, ma non venimmo mai a Valcava.\n@c0@"
  ja: "@a@b%a001240「……ずっと　サンチョと\n\tお父さんを　さがしてたけど\n\tこの村は　来たことないんだ。\n@c0@"
49:
  de: "@a%0%a001240@bEr sagte, dass er nicht herkommen wolle.\n@c0@"
  en: "@a%0%a001240@bHe said this is the one place he wanted to avoid.\n@c0@"
  es: "@a%0%a001240@bDecía que este era el único sitio al que no quería venir.\n@c0@"
  fr: "@a%0%a001240@bIl disait que c'était un endroit qu'il voulait éviter.\n@c0@"
  it: "@a%0%a001240@bLo zio Sancho non volle portarci qui.\nDisse che sarebbe stato inutile, e che questo posto gli faceva venire in mente troppi brutti ricordi...\n@c0@"
  ja: "@a@b%a001240「ここは　ダメだって\n\tサンチョが言ってたから。\n@c0@"
50:
  de: "@a%0%a001240@bDieser Ort muss voller Erinnerungen für dich und Sancho sein. Du warst auch mal mit Großvater hier, nicht? Das ist bestimmt sehr traurig für dich.\n@c0@"
  en: "@a%0%a001240@bThis place must be full of memories for you and Sancho. You spent time with Grandpa here too.\nI do know, you know.\n@c0@"
  es: "@a%0%a001240@bEsto os debe de traer muchos recuerdos a ti y a Sancho. Y también viniste aquí con el abuelo.\nSí, lo sé.\n@c0@"
  fr: "@a%0%a001240@bCet endroit doit vous rappeler plein de souvenirs,\nà Sancho et à toi. Vous y avez passé pas mal de temps avec grand-père. Je suis au courant, tu sais.\n@c0@"
  it: "@a%0%a001240@bTu e lo zio Sancho avete vissuto a Valcava con nonno Russel, non è vero?\nPovero nonno... Avrei tanto voluto conoscerlo...\n@c0@"
  ja: "@a@b%a001240「ここは　お父さんや　サンチョや\n\tおじいちゃんの　大事な思い出の\n\t場所だったんだよね。　わかるよ……。\n@c0@"
51:
  de: "@a%0%a001250@bWenn du traurig bist, kannst du ruhig weinen. Und wenn es dir hilft, weine ich auch mit dir.\n@c0@"
  en: "@a%0%a001250@bIf you're feeling sad, it's okay to cry. I'll cry with you if it makes you feel better.\n@c0@"
  es: "@a%0%a001250@bSi estás triste, puedes llorar, no pasa nada. Si te hace sentir mejor, lloraré contigo.\n@c0@"
  fr: "@a%0%a001250@bSi tu es triste, tu peux pleurer, tu sais.\nJe pleurerai même avec toi, si ça peut t'aider.\n@c0@"
  it: "@a%0%a001250@bQuando sono triste piango, così poi mi sento meglio.\nLe lacrime portano via i brutti pensieri...\n@c0@"
  ja: "@a@b%a001250「お父さん　悲しかったね。\n\t泣いてもいいよ。　わたしも\n\tいっしょに　泣いてあげるから。\n@c0@"
52:
  de: "@a%0%a001250@b... Es fällt mir schwer, zu atmen. Aus irgendeinem Grund kann ich hier nicht gut atmen.\n@c0@"
  en: "@a%0%a001250@b...I can't breathe very well. Being here... It's very hard for some reason.\n@c0@"
  es: "@a%0%a001250@b... No puedo respirar. No sé por qué... me cuesta estar aquí.\n@c0@"
  fr: "@a%0%a001250@b... J'ai du mal à respirer. Être ici... ça m'oppresse.\nJe ne sais pas pourquoi.\n@c0@"
  it: "@a%0%a001250@bNon riesco a respirare normalmente...\nForse non sopporto l'atmosfera pesante che si respira qui...\n@c0@"
  ja: "@a@b%a001250「……うまく　息ができないの。\n\tここにいると…　なんだか苦しいの。\n@c0@"
53:
  de: "@aSancho@bWeißt du, iss wollte nie an diese Ort zurückkehren.\n@c0@"
  en: "@aSancho@bYou know, I tell myself I never come here again.\n@c0@"
  es: "@aSancho@bSiempre he dicho que nunca volvería a este lugar.\n@c0@"
  fr: "@aSancho@bT-Tu sais. Je m'étais d-dit que je ne reviendrais jamais ici.\n@c0@"
  it: "@aSancho@bMe ero promessos que no sarei mai tornato a Valcava...\nEro seguro que avrei sofferto troppos...\n@c0@"
  ja: "@a@bサンチョ「……ここには　もう\n\t来るまいと　思っていたんですけどね。\n@c0@"
54:
  de: "@aSancho@bAber es ist in Ordnung. Jetzt, iss bin mit dir und bin viel glücklisser.\n@c0@"
  en: "@aSancho@bBut ees okay. Now I have you weeth me.\r\nEes much happier thees time.\n@c0@"
  es: "@aSancho@bPero nomás no pasa nada, porque estás conmigo.\nEsta vez no es tan triste.\n@c0@"
  fr: "@aSancho@bMais ça va. Cette f-fois, je suis avec toi.\r\nC'est p-plus gai.\n@c0@"
  it: "@aSancho@bInveces no es tanto mal, chico.\nSoy feliz de estar aquí contigo.\n@c0@"
  ja: "@a@bサンチョ「ええ…　大丈夫ですよ。\n\t今は　こうして　みんなでいられます。\n\tあの時にくらべたら　ずっと幸せです。\n@c0@"
55:
  de: "@aSancho@bWeißt du, Chico, iss bin dir und deine Padre nachgegangen, als ihr an diese Tag Steinach verlassen habt. Iss hatte eine schlechte Gefühl.\n@c0@"
  en: "@aSancho@bYou know, friend, I came after you and your father when you left Whealbrook for Coburg that day. I had a bad feeling een my heart.\n@c0@"
  es: "@aSancho@b¿Sabes, chamaco? Cuando tú y tu padre salisteis de Arroyofrío hacia Trastámara, yo salí tras vosotros. Tuve un mal presentimiento.\n@c0@"
  fr: "@aSancho@bT-Tu sais, chico, je vous ai suivis, ton padre et toi, quand vous êtes partis de R-Ruycelieu pour aller à Cobourg, ce jour-là.\n㈡\nJ'avais un m-mauvais pressentiment.\n@c0@"
  it: "@aSancho@b¿Sabe, chico?\nEl día que tu y tuo padre foste convocatos a Coburg, yo cercai de raggiungerve...\n@c0@"
  ja: "@a@bサンチョ「じつは　あの時　妙な\n\t胸さわぎがして　坊っちゃんたちの\n\tあとを　追いかけたんですよ。\n@c0@"
56:
  de: "@aSancho@bAber als iss in Tifortu ankam, war Señor Ludwig schon nisst mehr da. Iss habe versucht, ihn zu finden, aber ohne Erfolg.\n@c0@"
  en: "@aSancho@bBut when I arrived een Coburg, already señor Pankraz, he was no there. I tried to find heem, but ees no good.\n@c0@"
  es: "@aSancho@bPero cuando llegué a Trastámara, el señor Teudis pues ya no estaba. Intenté encontrarlo, pero ni modo.\n@c0@"
  fr: "@aSancho@bMais quand je suis arrivé à C-C-Cobourg, le señor Petros n'était déjà plus là. J-Je l'ai cherché, mais je ne l'ai pas t-trouvé.\n@c0@"
  it: "@aSancho@bMa cuando arrivai a Coburg, no riuscii a trovare el señor Russel.\nEro arrivato tardi.\n@c0@"
  ja: "@a@bサンチョ「でも　ラインハットには　すでに\n\tパパスさまの姿はなく　いく日も\n\tあたりを　さがしまわりました……。\n@c0@"
57:
  de: "@aSancho@bAls iss zurückkam und die Nachrisst hörte, iss... (Schluchz)\n@c0@"
  en: "@aSancho@bWhen I came back and heard the news, I, I... (sob)\n@c0@"
  es: "@aSancho@bCuando volví y me enteré de que... (snif)\n@c0@"
  fr: "@aSancho@bQuand j-je suis revenu et que j'ai entendu la nouvelle, je, je... (sanglot)\n@c0@"
  it: "@aSancho@bEra già partito por cercare Robert, y inveces trovò la muerte...\nYo... Yo me commuovos... ¡Sob!\n@c0@"
  ja: "@a@bサンチョ「とほうにくれて　村へもどれば\n\tこんなことに　なっていて…\n\tうっうっうっ……。\n@c0@"
58:
  de: "@aOtto@bWelch eine Schande! Hier einfach so alles zu verwüsten! Ich bin mir sicher, dass dies mal ein hübsches kleines Dorf gewesen ist.\n@c0@"
  en: "@aTuppence@bWhat a travesty! There was no need for such rampant vandalism. I'm sure it used to be a lovely little village.\n@c0@"
  es: "@aAlazar@b¡Qué barbaridad! Todo este vandalismo gratuito... Seguro que era un pueblito encantador.\n@c0@"
  fr: "@aInnocent@bQuelle honteⓠ Pourquoi avoir tout saccagéⓡ\nCe devrait être un si beau village dans le temps.\n@c0@"
  it: "@aSimon@bLe persone che hanno devastato il villaggio erano criminali, non soldati. Un vero soldato non si macchierebbe mai di un gesto così vile e crudele!\n@c0@"
  ja: "@a@bピピン「ひどいなあ……。\n\tいくらなんでも　やりすぎだ。\n\tきれいな村だったろうに。\n@c0@"
59:
  de: "@aOtto@bDieser Ort wird eines Tages wieder in altem Glanz erstrahlen, %a000090. Wo Leute sind, da ist auch Leben.\n@c0@"
  en: "@aTuppence@bI'm sure this place will be back to its old self one day, %a000090. Where there are people, there's life.\n@c0@"
  es: "@aAlazar@bAlgún día este lugar volverá a ser lo que era, estoy seguro, %a000090. Mientras hay vida, hay esperanza.\n@c0@"
  fr: "@aInnocent@bJe suis persuadé que tout sera bientôt comme avant, %a000090. Là où il y a de la vie, il y a de l'espoir.\n@c0@"
  it: "@aSimon@bMaestà, un giorno questo villaggio tornerà quello di un tempo.\nAbbia fede, re %a000090.\n@c0@"
  ja: "@a@bピピン「%a000090さま　いつか\n\tこの村も　もとどおりになりますよ。\n\tだって　ほら　人が……。\n@c0@"
60:
  de: "@a%0%a001240@bKennst du den Mann, Papa? Er ist ganz schön alt!\n@c0@"
  en: "@a%0%a001240@bDo you know that man, Dad? He's really old!\n@c0@"
  es: "@a%0%a001240@b¿Conoces a ese hombre, papi? ¡Pero qué viejo es!\n@c0@"
  fr: "@a%0%a001240@bTu connais cet homme, papaⓡ Il est vraiment vieuxⓠ\n@c0@"
  it: "@a%0%a001240@bPapà, conosci quell'uomo?\nSembra molto anziano...\nQuasi quanto lo zio Sancho!\n@c0@"
  ja: "@a@b%a001240「お父さん　知ってる人？\n\tずいぶん　おじいさんだね。\n@c0@"
61:
  de: "@a%0%a001250@bIst es nicht traurig, wenn jemand so alt und tattrig wird?\n@c0@"
  en: "@a%0%a001250@bIt's sad seeing someone so old and doddery.\n@c0@"
  es: "@a%0%a001250@bQué triste ver a una persona tan anciana y temblorosa.\n@c0@"
  fr: "@a%0%a001250@bJe trouve ça triste de voir quelqu'un de si vieux et si décrépit.\n@c0@"
  it: "@a%0%a001250@bHai visto quant'è vecchio quel signore?\n@c0@"
  ja: "@a@b%a001250「ねたきりの人を　見てると\n\t悲しくなっちゃう……。\n@c0@"
62:
  de: "@a%0%a001240@bWelch eine hübsche Kirche. Vielleicht haben sie sie ja verschont, weil es ein heiliger Ort ist oder so...\n@c0@"
  en: "@a%0%a001240@bThis is a pretty little church. Maybe they decided to spare it because it's a sacred place.\n@c0@"
  es: "@a%0%a001240@bQué bonita capilla. A lo mejor decidieron dejarla en paz porque es un lugar sagrado.\n@c0@"
  fr: "@a%0%a001240@bC'est une jolie petite église. Ils ont peut-être décidé de l'épargner parce que c'est un lieu sacré.\n@c0@"
  it: "@a%0%a001240@bForse chi ha distrutto il villaggio ha deciso di risparmiare la chiesa perché è un luogo sacro...\n@c0@"
  ja: "@a@b%a001240「この教会は　きれいだね。\n\t神さまの場所だから\n\tこわされなかったのかな……。\n@c0@"
63:
  de: "@a%0%a001250@bIch werde von nun an ganz viel beten. Vielleicht hilft das ja den Leuten, die gestorben sind, ihren Weg zur Göttin zu finden.\n@c0@"
  en: "@a%0%a001250@bI need to say lots of prayers. That way all the people who died here will find their way safely\nto the Goddess.\n@c0@"
  es: "@a%0%a001250@bTengo que rezar muchas oraciones. Así, las personas que murieron aquí podrán encontrar el camino hacia la Diosa.\n@c0@"
  fr: "@a%0%a001250@bIl faut que je dise plein de prières. Comme ça, les gens qui sont morts ici trouveront plus facilement\nle repos auprès de la Déesse.\n@c0@"
  it: "@a%0%a001250@bSono certa che la dea ha accolto in cielo le anime di coloro che hanno trovato la morte nella distruzione di Valcava...\n@c0@"
  ja: "@a@b%a001250「わたし　いっぱいお祈りしたい。\n\tこの村で　死んじゃった人たちが\n\t神さまのところへ　行けるように。\n@c0@"
64:
  de: "@aOtto@bWelch zauberhaftes Wesen! Ist es net aufregend, mitten im Nirgendwo solch ein wunderbares G'schöpf zu treffen?\n@c0@"
  en: "@aTuppence@bWhat a lovely young filly! It's like seeing a beautiful rose in the middle of a wilderness.\n@c0@"
  es: "@aAlazar@b¡Menudo bomboncito! Es como una preciosa florecilla en mitad de la maleza.\n@c0@"
  fr: "@aInnocent@bQuelle jolie jeune filleⓠ On dirait une rose qui fleurit au beau milieu de la jungle.\n@c0@"
  it: "@aSimon@bChe fanciulla graziosa!\nÈ un fiore nel deserto, un'oasi di bellezza in questo scenario desolato...\n@c0@"
  ja: "@a@bピピン「あの人　きれいですねえ。\n\tいいなあ…　荒れ野の花だ。\n@c0@"
65:
  de: "@a%0%a001240@bHm. Dieser Schleim ist gut informiert, wenn man bedenkt, dass er in einem Brunnen lebt...\n@c0@"
  en: "@a%0%a001240@bWell, well! That slime seems to be fairly clued up, considering he lives in a well!\n@c0@"
  es: "@a%0%a001240@b¡Vaya, vaya! ¡Parece que ese limo está muy bien informado, teniendo en cuenta que vive en un pozo!\n@c0@"
  fr: "@a%0%a001240@bDis doncⓠ Ce gluant a l'air bien au courant pour quelqu'un qui vit dans un puitsⓠ\n@c0@"
  it: "@a%0%a001240@bDirei che è molto ben informato, per essere uno Slime che vive in fondo a un pozzo!\n@c0@"
  ja: "@a@b%a001240「こんな所にいるのに\n\tずいぶん　もの知りなスライムだね。\n@c0@"
66:
  de: "@a%0%a001250@bDer Schleim ist ja so süß!\n@c0@"
  en: "@a%0%a001250@bThat slime is really cute!\n@c0@"
  es: "@a%0%a001250@b¡Ese limo es monísimo!\n@c0@"
  fr: "@a%0%a001250@bCe gluant est vraiment mignonⓠ\n@c0@"
  it: "@a%0%a001250@bChe carino quello Slime!\n@c0@"
  ja: "@a@b%a001250「あの　スライムさん\n\tかわいい……。\n@c0@"
67:
  de: "@a%0%a001240@bBleiben wir heute Nacht hier? Oh, bitte!\n@c0@"
  en: "@a%0%a001240@bAre we staying here tonight? Go on, let's!\n@c0@"
  es: "@a%0%a001240@b¿Nos quedaremos aquí esta noche? ¡Venga, vamos a quedarnos!\n@c0@"
  fr: "@a%0%a001240@bOn ne peut pas rester ici ce soirⓡ Allezⓠ\n@c0@"
  it: "@a%0%a001240@bChe dici?\nTrascorriamo la notte qui?\n@c0@"
  ja: "@a@b%a001240「今日　ここに泊まる？\n\tねえ　そうしようよ。\n@c0@"
68:
  de: "@aSancho@bSi, das ist... Puh, das ist schon eine lange Zeit her...\n@c0@"
  en: "@aSancho@bSí, thees ees...\r\nUf, ees been esuch a long time.\n@c0@"
  es: "@aSancho@bSí, esto es...\nUf, pues pasó mucho tiempo.\n@c0@"
  fr: "@aSancho@bSi, c'est...\r\nAh là là, ça fait si l-longtemps.\n@c0@"
  it: "@aSancho@b¡Ay, que estanchezza!\n@c0@"
  ja: "@a@bサンチョ「おや　ここは　たしか……。\n\tまあ　ずいぶん年月が\n\tたっちまいましたからね。\n@c0@"
69:
  de: "@aBianca@bWie recht sie hat. Wir haben %a001240 und %a001250, die uns stolz machen. Wir haben allen Grund, glücklich zu sein.\n@c0@"
  en: "@aBianca@bQuite right. We have %a001240 and %a001250 to make us proud. We should be happy!\n@c0@"
  es: "@aBianca@bEso es verdad. Tenemos a %a001240 y a %a001250 y estamos orgullosos de ellos. ¡Deberíamos estar contentos!\n@c0@"
  fr: "@aBianca@bElle a raison. %0%a001240 et %a001250 font notre fierté. Nous devrions être heureuxⓠ\n@c0@"
  it: "@aBianca@bAnche i nostri %a001240 e %a001250 crescono sani e forti!\nQuella donna ha ragione: la vita è bella!\n@c0@"
  ja: "@a@bビアンカ「そうよねえ……。　私たちにも\n\t%a001240や%a001250が　いるんだもの。\n\t落ちこんでなんていられないわよね！\n@c0@"
70:
  de: "@aNera@bAuch wir mussten allerhand durchmachen, als wir in Stein verwandelt wurden, aber wenigstens waren unsere Kinder in Sicherheit. Wir sollten dankbar sein.\n@c0@"
  en: "@aNera@bWe had a terrible time of it too when we were turned into stone, but at least we can be grateful that our children were well looked-after.\n@c0@"
  es: "@aNera@bLo pasamos veramente mal cuando nos convirtieron en piedra, ma podemos dar gracias de que cuidasen bien a nuestros bambini.\n@c0@"
  fr: "@aNera@bNous avons passé un sale moment aussi lorsque nous avons été pétrifiés. Au moins, on a eu de la chance parce que nos enfants étaient en de bonnes mains.\n@c0@"
  it: "@aNera@bLo sguardo di quella signora è sereno e pieno di speranza nel domani.\nMi ha fatto piacere incontrarla...\n@c0@"
  ja: "@a@bフローラ「私も　石にされたときは\n\t絶望したけど　%a001240や%a001250が\n\t元気に育ってくれていて　良かった。\n@c0@"
71:
  de: "@a%0%a001240@bUns geht es gut. Um uns brauchst du dir keine Sorgen zu machen!\n@c0@"
  en: "@a%0%a001240@bWe're both fine. You don't need to worry about us, so cheer up!\n@c0@"
  es: "@a%0%a001240@bLos dos estamos bien. No os preocupéis por nosotrosⓓ ¡arriba ese ánimo!\n@c0@"
  fr: "@a%0%a001240@bNous sommes tous les deux en bonne santé. Tu n'as pas besoin de t'inquiéter pour nous. Alors tu vois, ça va bienⓠ\n@c0@"
  it: "@a%0%a001240@bAnche noi siamo sani e forti. E io sono anche bello!\nDirei che non hai proprio motivo di lamentarti di tuo figlio...\n@c0@"
  ja: "@a@b%a001240「ボクたち　元気だから！\n\tお父さんも　元気出してね。\n@c0@"
72:
  de: "@a%0%a001250@bDen Flammen zum Opfer gefallen? Ihre Betten, Kleider, ihr Geld, einfach alles? Oh, wie schrecklich!\n@c0@"
  en: "@a%0%a001250@bTheir place was set on fire? Their beds and clothes and money and everything? How terrible!\n@c0@"
  es: "@a%0%a001250@b¿Quemaron su casa? ¿Con las camas y la ropa y el dinero y todo? ¡Es horrible!\n@c0@"
  fr: "@a%0%a001250@bLe village a été incendiéⓡ Les lits, les vêtements, l'argent, toutⓡ Mais c'est horribleⓠ\n@c0@"
  it: "@a%0%a001250@bPerché la casa di quella signora venne incendiata?\nLei non aveva fatto niente di male!\nChe crudeltà!\n@c0@"
  ja: "@a@b%a001250「燃やされちゃったの？\n\tベッドも　お洋服も　お金も全部？\n\t……こわい。\n@c0@"
73:
  de: "@aSancho@bDas ist nisst mögliss! Die Señora aus der Herberge! Sie, sie lebt! Oh, das ist... (Schluchz)\n@c0@"
  en: "@aSancho@bI no believe eet!\nEes the señora from the inn!\nEshe, eshe ees alive! Oh, ees, ees... (blub)\n@c0@"
  es: "@aSancho@b¡Ay, caramba, no puedo creerlo!\n¡Es la señora de la posada!\n¡Está viva! Es... es... (snif)\n@c0@"
  fr: "@aSancho@bJe n'y c-crois pasⓠ C'est la señora de l'aubergeⓠ\nElle... Elle est v-vivanteⓠ C'est, c'est... (sanglot)\n@c0@"
  it: "@aSancho@b¡No ce posso crederes!\r\n¡La señora della locanda es viva!\r\nYo... Yo me commuovos... ¡Sob!\n@c0@"
  ja: "@a@bサンチョ「おお！　なつかしい！\n\tあの人は　宿屋のおかみ。\n\tよくぞ生きのこって…　うっうっ……。\n@c0@"
74:
  de: "@a%0%a001240@bEine Höhle! Hast du sie erforscht, als du klein warst, Papa? He he! Dann warst du also auch ein Abenteurer, genau wie ich!\n@c0@"
  en: "@a%0%a001240@bA cave! Did you go exploring in there when you were little, Dad? Heh heh! So you liked adventures just like I do, then!\n@c0@"
  es: "@a%0%a001240@b¡Una cueva! ¿Fuiste a explorarla cuando eras pequeño, papá? ¡Je, je! ¡Así que te gustaban las aventuras, como a mí!\n@c0@"
  fr: "@a%0%a001240@bUne grotteⓠ Tu l'as explorée quand tu étais petit, papaⓡ Hé héⓠ Tu aimais les aventures, toi aussiⓠ\n@c0@"
  it: "@a%0%a001240@bUna grotta! Papà, scommetto che da piccolo andavi a esplorarla di nascosto da nonno Russel!\nDimmi, il nonno ti ha mai scoperto? Eh eh eh!\n@c0@"
  ja: "@a@b%a001240「洞くつって…　お父さんも\n\t小さい頃　冒険したの？\n\tへへっ　冒険好きは　ボクと同じだね！\n@c0@"
75:
  de: "@a%0%a001250@bHast du jemals einen Steinach-Blaustein gesehen, Papa? Nein? Wie schade.\n@c0@"
  en: "@a%0%a001250@bHave you ever seen a Whealbrook bluestone, Dad?\nNo? That's a pity.\n@c0@"
  es: "@a%0%a001250@b¿Has visto alguna vez una aguamarina de Arroyofrío, papi?\n¿No? Qué lástima.\n@c0@"
  fr: "@a%0%a001250@bTu as déjà vu une gemme bleue de Ruycelieu, papaⓡ Nonⓡ C'est dommage.\n@c0@"
  it: "@a%0%a001250@bPapà, hai mai visto una pietra nobile di Valcava?\nNo? Che peccato...\nAvrei voluto che me la descrivessi...\n@c0@"
  ja: "@a@b%a001250「お父さん\n\t聖なる原石って　見たことある？\n\tふ～ん…　ないんだあ……。\n@c0@"
76:
  de: "@aSancho@bAus einem Steinach-Blaustein kann man eine schöne Edelstein fertigen, weißt du, Chico.\n@c0@"
  en: "@aSancho@bEes possible to make a fine gemstone from thees Whealbrook bluestone, you know.\n@c0@"
  es: "@aSancho@bCon una aguamarina de Arroyofrío pues se puede hacer una joya bien chida, ¿sabes?\n@c0@"
  fr: "@aSancho@bOn peut f-fabriquer oune jolie p-pierre à partir d'oune gemme bleue de R-R-Ruycelieu, tu sais.\n@c0@"
  it: "@aSancho@bLas pietras nobiles de Valcava pueden essere trasformatas en gioiellos preziosos...\n@c0@"
  ja: "@a@bサンチョ「なんでも　聖なる原石からは\n\tきれいな宝石が出るとか……。\n@c0@"
77:
  de: "@aSancho@bAls noch nisst so viele Monster in diese Höhle waren, kamen viele Leute hierher, um nach die Blaustein zu suchen.\n@c0@"
  en: "@aSancho@bWhen there were no eso many monsters een\r\nthees cave, many, many people, they came\r\nhere to find eet.\n@c0@"
  es: "@aSancho@bCuando no había tantos monstruos, muchas personas venían aquí a buscarlas.\n@c0@"
  fr: "@aSancho@bQuand il n'y avait p-pas autant de monstres d-dans cette grotte, les gens venaient en m-masse pour en trouver.\n@c0@"
  it: "@aSancho@bPer esto motivo, aquí veniva mucha gente a cercarlas.\n@c0@"
  ja: "@a@bサンチョ「洞くつに　あまり魔物が\n\t出なかった頃は　おおぜいの人たちが\n\t原石をさがしに来たようですよ。\n@c0@"
78:
  de: "@aBianca@bKunden scheinen Mangelware hier zu sein. Ich hoffe nur, dass die Besitzer nicht den Mut verlieren.\n@c0@"
  en: "@aBianca@bLooks like customers are pretty thin on the ground\r\n'round here! I hope the people runnin' this place\r\ndon't lose heart.\n@c0@"
  es: "@aBianca@b¡Parece que la clientela es más bien escasa por aquí! Espero que eso no desanime a los comerciantes, ¿sabes?\n@c0@"
  fr: "@aBianca@bOn dirait que les clients ne se bousculent pas au portillon, par iciⓠ J'espère que les propriétaires ne baissent pas les bras.\n@c0@"
  it: "@aBianca@bA giudicare dall'accoglienza, gli affari non le vanno molto bene...\nLe auguro che le cose migliorino in fretta!\n@c0@"
  ja: "@a@bビアンカ「お客さんが　めずらしいのね。\n\tこの宿屋さんには\n\tがんばってもらいたいな。\n@c0@"
79:
  de: "@aNera@bWir sollten diesen Ort unterstützen und so oft hier übernachten, wie es nur geht.\n@c0@"
  en: "@aNera@bIf you don't mind, I think we should try to support this place and stay here as often as we can.\n@c0@"
  es: "@aNera@bSi no te importa, credo que deberíamos ayudar a estas personas y alojarnos aquí siempre que podamos.\n@c0@"
  fr: "@aNera@bSi ça ne te dérange pas, je crois que nous devrions essayer de les aider un peu et de séjourner ici aussi souvent que possible.\n@c0@"
  it: "@aNera@bPerché non pernottiamo qui tutte le volte che capitiamo a Valcava? Così daremo il nostro contributo alla rinascita del villaggio!\n@c0@"
  ja: "@a@bフローラ「あなたさえ　よければ\n\t私　この宿屋さんに　いっぱい\n\t泊まってゆきたいですわ。\n@c0@"
80:
  de: "@a%0%a001240@bIst sie das einzige Kind hier im Dorf? Vielleicht sollte ich ihr anbieten, ihr Spielkamerad zu sein, solange wir hier sind...\n@c0@"
  en: "@a%0%a001240@bIs she the only child here in the village? Maybe I should offer to be her playmate for a while.\n@c0@"
  es: "@a%0%a001240@b¿Esa es la única niña del pueblo? Quizá le diga si quiere jugar conmigo un rato.\n@c0@"
  fr: "@a%0%a001240@bC'est la seule enfant du villageⓡ Je devrais peut-être lui proposer d'être son copain.\n@c0@"
  it: "@a%0%a001240@bNon sarà mica l'unica ragazzina del villaggio, vero?!\nSpero che non si senta troppo sola!\n@c0@"
  ja: "@a@b%a001240「この村に　子供って\n\tあの子だけなの？\n\t遊び相手に　なってあげていい？\n@c0@"
81:
  de: "@a%0%a001240@bDas ist also der Keller deines alten Hauses. Was?! Von hier bist du ins Reich der Feen gereist?! Klasse!\n@c0@"
  en: "@a%0%a001240@bSo this is the cellar of your old house. No way! You went from here to the Realm of the Faeries!? Wow!\n@c0@"
  es: "@a%0%a001240@bAsí que esta es la bodega de tu antigua casa. ¡No puede ser! ¡¿Desde aquí viajaste al Reino de las Hadas?! ¡Vaya!\n@c0@"
  fr: "@a%0%a001240@bAlors c'est la cave de ta vieille maison. Quoiⓡ C'est de là que tu es allé au royaume des Féesⓡ Waouhⓠ\n@c0@"
  it: "@a%0%a001240@bQuesta è la cantina della casa in cui vivevi?\nÈ da qui che passavi per raggiungere il Regno delle Fate?\n@c0@"
  ja: "@a@b%a001240「ここが　お父さんの家の地下？\n\tえっ？　ここから妖精の国へも\n\t行ったの？　うっそだ～！\n@c0@"
82:
  de: "@aSancho@bGenau wie früher. Das hier ist der einzige Ort, der nisst zerstört wurde. Das ist so... (Schluchz)\n@c0@"
  en: "@aSancho@bEes no eso different from before.\nThees ees the only place that was no destroyed. Ees, ees... (sob)\n@c0@"
  es: "@aSancho@bNo cambió nada.\nEs la única parte que no quedó destruida. Es... es... (snif)\n@c0@"
  fr: "@aSancho@bC'-C'est comme avant. C'est le seul endroit qui n'a\r\np-pas été détruit. C-C'est... (sanglot)\n@c0@"
  it: "@aSancho@bQue estrano...\nEsto es l'unico posto que es estato resparmiato dalla furia de los soldados...\n@c0@"
  ja: "@a@bサンチョ「ここは　ほとんど\n\t前のままですね。\n\tここだけ残ってても…　うっうっ……。\n@c0@"
83:
  de: "@a%0%a001230@bWer hätte gedacht, dass an solch einem dunklen Ort so hübsche Blumen wachsen?\n@c0@"
  en: "@a%0%a001230@bWho would've thought pretty flowers like this would blossom in a place so dark?\n@c0@"
  es: "@a%0%a001230@b¿Quién iba a pensar que estas flores iban a florecer en un sitio tan oscuro?\n@c0@"
  fr: "@a%0%a001230@bQui aurait pu penser que de si jolies fleurs pouvaient pousser dans un endroit si sombreⓡ\n@c0@"
  it: "@a%0%a001230@bChi avrebbe mai pensato che in quest'ambiente buio potessero sbocciare fiori tanto belli, eh?\n@c0@"
  ja: "@a@b%a001230「まあ！\n\tこんな暗い場所で　きれいに\n\t花が咲いてるなんて……。\n@c0@"
84:
  de: "@aSancho@bNo! Das ist nisst mögliss... Sind diese Blüten etwa die gleichen wie damals...?\n@c0@"
  en: "@aSancho@bNo! Ees no possible... Thees blossom, ees the esame one from eso many years ago?\n@c0@"
  es: "@aSancho@b¡No! ¡Caramba, no puede ser! ¿Son las mismas flores de hace tantos años?\n@c0@"
  fr: "@aSancho@bNonⓠ C-Ce n'est pas possible... Ces fleurs...\nCe sont les mêmes qu'il y a t-tant d'annéesⓡ\n@c0@"
  it: "@aSancho@b¡No es posible!\n¡Esto no puede essere lo mismo ramo de alloras...!\n¡Es un miracolo!\n@c0@"
  ja: "@a@bサンチョ「そ　そのサクラのえだは\n\tあのときの……！？\n\tうっ　うっ　うっ……。\n@c0@"
85:
  de: "@aBianca@bEs macht mich immer traurig, hier zu sein.\n@c0@"
  en: "@aBianca@bIt always makes me feel sad comin' here.\n@c0@"
  es: "@aBianca@bVenir aquí siempre me hace sentir triste, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe suis toujours triste quand je viens ici.\n@c0@"
  it: "@aBianca@bOgni volta che torno qui mi prende una tristezza incredibile...\n@c0@"
  ja: "@a@bビアンカ「ここには　いつ来ても\n\t悲しくなっちゃうわね。\n@c0@"
86:
  de: "@aNera@bSo viele Jahre sind schon vergangen, und trotzdem hat sich hier kaum etwas verändert.\n@c0@"
  en: "@aNera@bAll those years have passed, and yet this place has hardly changed at all.\n@c0@"
  es: "@aNera@bDopo di tanti anni, este sitio apenas ha cambiado.\n@c0@"
  fr: "@aNera@bToutes ces années ont passé et cet endroit n'a pas presque pas changé.\n@c0@"
  it: "@aNera@bSono trascorsi tanti anni, ma questo posto non è cambiato quasi per niente...\n@c0@"
  ja: "@a@bフローラ「もう　ずいぶん\n\tたったというのに　ここは　まだ\n\t前のままの　すがたなのね……。\n@c0@"
87:
  de: "@a%0%a001240@bWir haben mit Sancho ja überall nach dir gesucht, aber hier sind wir nie gewesen.\n@c0@"
  en: "@a%0%a001240@bWe looked all over for you with Sancho, but we never came here.\n@c0@"
  es: "@a%0%a001240@bTe buscamos por todos lados con Sancho, pero nunca vinimos aquí.\n@c0@"
  fr: "@a%0%a001240@bOn vous a cherchés partout avec Sancho, mais on n'est jamais venus ici.\n@c0@"
  it: "@a%0%a001240@bQuando ti cercavamo con lo zio Sancho, girammo mezzo mondo, ma non venimmo mai a Valcava.\n@c0@"
  ja: "@a@b%a001240「……ずっと　サンチョと\n\tお父さんを　さがしてたけど\n\tこの村は　来たことないんだ。\n@c0@"
88:
  de: "@a%0%a001240@bEr sagte, dass er nicht herkommen wolle.\n@c0@"
  en: "@a%0%a001240@bHe said this is the one place he wanted to avoid.\n@c0@"
  es: "@a%0%a001240@bDecía que este era el único sitio al que no quería venir.\n@c0@"
  fr: "@a%0%a001240@bIl disait que c'était un endroit qu'il voulait éviter.\n@c0@"
  it: "@a%0%a001240@bLo zio Sancho non volle portarci qui.\nDisse che sarebbe stato inutile, e che questo posto gli faceva venire in mente troppi brutti ricordi...\n@c0@"
  ja: "@a@b%a001240「ここは　ダメだって\n\tサンチョが言ってたから。\n@c0@"
89:
  de: "@a%0%a001240@bDieser Ort muss voller Erinnerungen für dich und Sancho sein. Du warst auch mal mit Großvater hier, nicht? Das ist bestimmt sehr traurig für dich.\n@c0@"
  en: "@a%0%a001240@bThis place must be full of memories for you and Sancho. You spent time with Grandpa here too.\nI do know, you know.\n@c0@"
  es: "@a%0%a001240@bEsto os debe de traer muchos recuerdos a ti y a Sancho. Y también viniste aquí con el abuelo.\nSí, lo sé.\n@c0@"
  fr: "@a%0%a001240@bCet endroit doit vous rappeler plein de souvenirs,\nà Sancho et à toi. Vous y avez passé pas mal de temps avec grand-père. Je suis au courant, tu sais.\n@c0@"
  it: "@a%0%a001240@bTu e lo zio Sancho avete vissuto a Valcava con nonno Russel, non è vero?\nPovero nonno... Avrei tanto voluto conoscerlo...\n@c0@"
  ja: "@a@b%a001240「ここは　お父さんや　サンチョや\n\tおじいちゃんの　大事な思い出の\n\t場所だったんだよね。　わかるよ……。\n@c0@"
90:
  de: "@a%0%a001250@bWenn du traurig bist, kannst du ruhig weinen. Und wenn es dir hilft, weine ich auch mit dir.\n@c0@"
  en: "@a%0%a001250@bIf you're feeling sad, it's okay to cry. I'll cry with you if it makes you feel better.\n@c0@"
  es: "@a%0%a001250@bSi estás triste, puedes llorar, no pasa nada. Si te hace sentir mejor, lloraré contigo.\n@c0@"
  fr: "@a%0%a001250@bSi tu es triste, tu peux pleurer, tu sais.\nJe pleurerai même avec toi, si ça peut t'aider.\n@c0@"
  it: "@a%0%a001250@bQuando sono triste piango, così poi mi sento meglio.\nLe lacrime portano via i brutti pensieri...\n@c0@"
  ja: "@a@b%a001250「お父さん　悲しかったね。\n\t泣いてもいいよ。　わたしも\n\tいっしょに　泣いてあげるから。\n@c0@"
91:
  de: "@a%0%a001250@b... Es fällt mir schwer, zu atmen. Aus irgendeinem Grund kann ich hier nicht gut atmen.\n@c0@"
  en: "@a%0%a001250@b...I can't breathe very well. Being here... It's very hard for some reason.\n@c0@"
  es: "@a%0%a001250@b... No puedo respirar. No sé por qué... me cuesta estar aquí.\n@c0@"
  fr: "@a%0%a001250@b... J'ai du mal à respirer. Être ici... ça m'oppresse.\nJe ne sais pas pourquoi.\n@c0@"
  it: "@a%0%a001250@bNon riesco a respirare normalmente...\nForse non sopporto l'atmosfera pesante che si respira qui...\n@c0@"
  ja: "@a@b%a001250「……うまく　息ができないの。\n\tここにいると…　なんだか苦しいの。\n@c0@"
92:
  de: "@aSancho@bWeißt du, iss wollte nie an diese Ort zurückkehren.\n@c0@"
  en: "@aSancho@bYou know, I tell myself I never come here again.\n@c0@"
  es: "@aSancho@bSiempre he dicho que nunca volvería a este lugar.\n@c0@"
  fr: "@aSancho@bT-Tu sais. Je m'étais d-dit que je ne reviendrais jamais ici.\n@c0@"
  it: "@aSancho@bMe ero promessos que no sarei mai tornato a Valcava...\nEro seguro que avrei sofferto troppos...\n@c0@"
  ja: "@a@bサンチョ「……ここには　もう\n\t来るまいと　思っていたんですけどね。\n@c0@"
93:
  de: "@aSancho@bAber es ist in Ordnung. Jetzt, iss bin mit dir und bin viel glücklisser.\n@c0@"
  en: "@aSancho@bBut ees okay. Now I have you weeth me.\r\nEes much happier thees time.\n@c0@"
  es: "@aSancho@bPero nomás no pasa nada, porque estás conmigo.\nEsta vez no es tan triste.\n@c0@"
  fr: "@aSancho@bMais ça va. Cette f-fois, je suis avec toi.\nC'est p-plus gai.\n@c0@"
  it: "@aSancho@bInveces no es tanto mal, chico.\nSoy feliz de estar aquí contigo.\n@c0@"
  ja: "@a@bサンチョ「ええ…　大丈夫ですよ。\n\t今は　こうして　みんなでいられます。\n\tあの時にくらべたら　ずっと幸せです。\n@c0@"
94:
  de: "@aSancho@bWeißt du, Chico, iss bin dir und deine Padre nachgegangen, als ihr an diese Tag Steinach verlassen habt. Iss hatte eine schlechte Gefühl.\n@c0@"
  en: "@aSancho@bYou know, friend, I came after you and your father when you left Whealbrook for Coburg that day. I had a bad feeling een my heart.\n@c0@"
  es: "@aSancho@b¿Sabes, chamaco? Cuando tú y tu padre salisteis de Arroyofrío hacia Trastámara, yo salí tras vosotros. Tuve un mal presentimiento.\n@c0@"
  fr: "@aSancho@bT-Tu sais, chico, je vous ai suivis, ton padre et toi, quand vous êtes partis de R-Ruycelieu pour aller à Cobourg, ce jour-là.\n㈡\nJ'avais un m-mauvais pressentiment.\n@c0@"
  it: "@aSancho@b¿Sabe, chico?\nEl día que tu y tuo padre foste convocatos a Coburg, yo cercai de raggiungerve...\n@c0@"
  ja: "@a@bサンチョ「じつは　あの時　妙な\n\t胸さわぎがして　坊っちゃんたちの\n\tあとを　追いかけたんですよ。\n@c0@"
95:
  de: "@aSancho@bAber als iss in Tifortu ankam, war Señor Ludwig schon nisst mehr da. Iss habe versucht, ihn zu finden, aber ohne Erfolg.\n@c0@"
  en: "@aSancho@bBut when I arrived een Coburg, already señor Pankraz, he was no there. I tried to find heem, but ees no good.\n@c0@"
  es: "@aSancho@bPero cuando llegué a Trastámara, el señor Teudis pues ya no estaba. Intenté encontrarlo, pero ni modo.\n@c0@"
  fr: "@aSancho@bMais quand je suis arrivé à C-C-Cobourg, le señor Petros n'était déjà plus là. J-Je l'ai cherché, mais je ne l'ai pas t-trouvé.\n@c0@"
  it: "@aSancho@bMa cuando arrivai a Coburg, no riuscii a trovare el señor Russel.\nEro arrivato tardi.\n@c0@"
  ja: "@a@bサンチョ「でも　ラインハットには　すでに\n\tパパスさまの姿はなく　いく日も\n\tあたりを　さがしまわりました……。\n@c0@"
96:
  de: "@aSancho@bAls iss zurückkam und die Nachrisst hörte, iss... (Schluchz)\n@c0@"
  en: "@aSancho@bWhen I came back and heard the news, I, I... (sob)\n@c0@"
  es: "@aSancho@bCuando volví y me enteré de que... (snif)\n@c0@"
  fr: "@aSancho@bQuand j-je suis revenu et que j'ai entendu la nouvelle, je, je... (sanglot)\n@c0@"
  it: "@aSancho@bEra già partito por cercare Robert, y inveces trovò la muerte...\nYo... Yo me commuovos... ¡Sob!\n@c0@"
  ja: "@a@bサンチョ「とほうにくれて　村へもどれば\n\tこんなことに　なっていて…\n\tうっうっうっ……。\n@c0@"
97:
  de: "@aOtto@bWelch eine Schande! Hier einfach so alles zu verwüsten! Ich bin mir sicher, dass dies mal ein hübsches kleines Dorf gewesen ist.\n@c0@"
  en: "@aTuppence@bWhat a travesty! There was no need for such rampant vandalism. I'm sure it used to be a lovely little village.\n@c0@"
  es: "@aAlazar@b¡Qué barbaridad! Todo este vandalismo gratuito... Seguro que era un pueblito encantador.\n@c0@"
  fr: "@aInnocent@bQuelle honteⓠ Pourquoi avoir tout saccagéⓡ\nCe devrait être un si beau village dans le temps.\n@c0@"
  it: "@aSimon@bLe persone che hanno devastato il villaggio erano criminali, non soldati. Un vero soldato non si macchierebbe mai di un gesto così vile e crudele!\n@c0@"
  ja: "@a@bピピン「ひどいなあ……。\n\tいくらなんでも　やりすぎだ。\n\tきれいな村だったろうに。\n@c0@"
98:
  de: "@aOtto@bWenn wieder Frieden herrscht, sollte jeder einzelne in Humburg mit anfassen und helfen, diesen Ort wieder aufzubauen!\n@c0@"
  en: "@aTuppence@bWhen things are peaceful again, everyone in\r\nGotha should band together to get this place\r\nback on its feet!\n@c0@"
  es: "@aAlazar@b¡Cuando la paz haya vuelto al mundo, todos los habitantes de Pankraz deberían unirse para reconstruir este lugar!\n@c0@"
  fr: "@aInnocent@bLorsque la paix sera revenue, ce serait bien que tous les gens de Gotha s'unissent pour remettre\r\ncet endroit sur pied.\n@c0@"
  it: "@aSimon@bQuando avremo portato a termine il nostro compito, chiederò agli abitanti di Denim di contribuire in tutti i modi possibili per la rinascita di Valcava.\n@c0@"
  ja: "@a@bピピン「平和になったら\n\tグランバニアのみんなで\n\tこの村を　立て直しましょう！\n@c0@"
99:
  de: "@aOtto@bGenau! Und die Menschen aus Tifortu werden wir auch fragen. Je mehr, desto besser!\n@c0@"
  en: "@aTuppence@bI know! We could get the folk from Coburg on board too. The more, the merrier!\n@c0@"
  es: "@aAlazar@b¡Ya sé! Podríamos decírselo también a los de Trastámara. ¡Cuantos más mejor!\n@c0@"
  fr: "@aInnocent@bJe saisⓠ On pourrait aussi demander aux gens de Cobourg. Plus on est de fous, plus on ritⓠ\n@c0@"
  it: "@aSimon@bE farò la stessa cosa con la gente di Coburg!\r\nGlielo prometto, Maestà!\r\nValcava tornerà a essere quella di tanti anni fa!\n@c0@"
  ja: "@a@bピピン「そうだ！\n\tラインハットのヤツらにも\n\t手伝わせなくっちゃ！\n@c0@"
100:
  de: "@a%0%a001240@bKennst du den Mann, Papa? Er ist ganz schön alt!\n@c0@"
  en: "@a%0%a001240@bDo you know that man, Dad? He's really old!\n@c0@"
  es: "@a%0%a001240@b¿Conoces a ese hombre, papi? ¡Pero qué viejo es!\n@c0@"
  fr: "@a%0%a001240@bTu connais cet homme, papaⓡ Il est vraiment vieuxⓠ\n@c0@"
  it: "@a%0%a001240@bPapà, conosci quell'uomo?\nSembra molto anziano...\nQuasi quanto lo zio Sancho!\n@c0@"
  ja: "@a@b%a001240「お父さん　知ってる人？\n\tずいぶん　おじいさんだね。\n@c0@"
101:
  de: "@a%0%a001250@bMuss der alte Mann die ganze Zeit im Bett bleiben? Glaubst du, es geht ihm gut?\n@c0@"
  en: "@a%0%a001250@bDoes that old man have to stay in bed all the time?\nDo you think he's alright?\n@c0@"
  es: "@a%0%a001250@bEse anciano, ¿tiene que estar siempre metido en la cama?\n¿Crees que se encuentra bien?\n@c0@"
  fr: "@a%0%a001250@bCe vieil homme doit rester au lit tout le tempsⓡ\nTu crois qu'il va bienⓡ\n@c0@"
  it: "@a%0%a001250@bPerché quel signore sta sempre a letto?\nNon si sente bene?\n@c0@"
  ja: "@a@b%a001250「おじいさん　寝たきりなの？\n\t大丈夫なの？\n@c0@"
102:
  de: "@a%0%a001240@bHey! Das ist ein bisschen wie bei Sancho, %a001250 und mir, nicht wahr?\n@c0@"
  en: "@a%0%a001240@bHey! That's a bit like how Sancho brought us up,\nisn't it?\n@c0@"
  es: "@a%0%a001240@bAsí fue como nos crió Sancho, más o menos, ¿no?\n@c0@"
  fr: "@a%0%a001240@bHéⓠ C'est un peu comme Sancho et nous, pas vraiⓡ\n@c0@"
  it: "@a%0%a001240@bProprio come lo zio Sancho!\nQuando tu e la mamma non c'eravate, lui si è preso cura di noi!\n@c0@"
  ja: "@a@b%a001240「えーと　えーと…\n\tボクたちが　サンチョに\n\t育ててもらったのと　いっしょ？\n@c0@"
103:
  de: "@a%0%a001240@bDie beiden sind eine richtige Familie.\n@c0@"
  en: "@a%0%a001240@bThen that means these two are family.\n@c0@"
  es: "@a%0%a001240@bEso quiere decir que estos dos son familia.\n@c0@"
  fr: "@a%0%a001240@bAlors ça veut dire qu'ils forment une famille.\n@c0@"
  it: "@a%0%a001240@bStavamo bene con lo zio Sancho, però mangiavamo paella tutti i giorni! A me la paella piace, ma ogni tanto avrei voluto qualcosa di diverso…\n@c0@"
  ja: "@a@b%a001240「じゃあ　この人たち\n\t家族なんだね。\n@c0@"
104:
  de: "@a%0%a001250@bÄhm, kann ich heute Nacht bei dir schlafen, Papa?\n@c0@"
  en: "@a%0%a001250@bUm, can I sleep in with you tonight, please, Dad?\n@c0@"
  es: "@a%0%a001250@b¿Puedo dormir contigo esta noche, papi?\n@c0@"
  fr: "@a%0%a001250@bDis, papa, je peux dormir avec vous ce soirⓡ\n@c0@"
  it: "@a%0%a001250@bPapà, non mi sento tranquilla...\nPosso dormire con te stanotte?\n@c0@"
  ja: "@a@b%a001250「……あの　えっと\n\t今日は　寝るとき　いっしょに\n\tお父さんのベッドで　寝てもいい？\n@c0@"
105:
  de: "@a%0%a001240@bBleiben wir heute Nacht hier? Oh, bitte!\n@c0@"
  en: "@a%0%a001240@bAre we staying here tonight? Go on, let's!\n@c0@"
  es: "@a%0%a001240@b¿Nos quedaremos aquí esta noche? ¡Venga, vamos a quedarnos!\n@c0@"
  fr: "@a%0%a001240@bOn ne peut pas rester ici ce soirⓡ Allezⓠ\n@c0@"
  it: "@a%0%a001240@bChe dici?\nTrascorriamo la notte qui?\n@c0@"
  ja: "@a@b%a001240「今日　ここに泊まる？\n\tねえ　そうしようよ。\n@c0@"
106:
  de: "@aSancho@bSi, das ist... Puh, das ist schon eine lange Zeit her...\n@c0@"
  en: "@aSancho@bSí, thees ees...\r\nUf, ees been esuch a long time.\n@c0@"
  es: "@aSancho@bSí, esto es...\nUf, pues pasó mucho tiempo.\n@c0@"
  fr: "@aSancho@bSi, c'est...\nAh là là, ça fait si l-longtemps.\n@c0@"
  it: "@aSancho@b¡Ay, que estanchezza!\n@c0@"
  ja: "@a@bサンチョ「おや　ここは　たしか……。\n\tまあ　ずいぶん年月が\n\tたっちまいましたからね。\n@c0@"
107:
  de: "@a%0%a001240@b(Gähn) Wenn ich mir das Bett so ansehe, werd' ich auf einmal ganz müde...\n@c0@"
  en: "@a%0%a001240@b(yawn) Looking at the bed has made me sleepy all of a sudden.\n@c0@"
  es: "@a%0%a001240@b¡Aaaah! Al ver la cama me ha entrado sueño de golpe.\n@c0@"
  fr: "@a%0%a001240@b(bâillement) En regardant le lit, je me sens fatigué tout à coup.\n@c0@"
  it: "@a%0%a001240@bYaaawn...\nLa vista di un letto mi fa sempre venire sonno...\n@c0@"
  ja: "@a@b%a001240「ふわ～……。\n\tベッドを見たら　ボク\n\t急に　眠くなってきちゃったよ。\n@c0@"
108:
  de: "@aOtto@bFür einen Ort wie diesen sieht das Bett sehr, sehr g'mütlich aus.\n@c0@"
  en: "@aTuppence@bThat's a very comfortable-looking bed for a place like this.\n@c0@"
  es: "@aAlazar@bPara un sitio así, esa cama parece de lo más cómoda.\n@c0@"
  fr: "@aInnocent@bCe lit semble très confortable. C'est surprenant dans un endroit pareil.\n@c0@"
  it: "@aSimon@bQuel letto sembra molto comodo.\n㈡\nNon mi dispiacerebbe cadere tra le braccia di Morfeo per qualche ora, anche se preferirei le braccia di una bella ⓕMorfeaⓖ! Ah ah ah! Ehm...\n@c0@"
  ja: "@a@bピピン「こんな所ですが\n\tずいぶん　寝心地のよさそうな\n\tベッドですねえ。\n@c0@"
109:
  de: "@a%0%a001250@bIch bin müde, Papa. Ich möchte schlafen gehen.\n@c0@"
  en: "@a%0%a001250@bI'm sleepy, Dad. I want to go to bed.\n@c0@"
  es: "@a%0%a001250@bTengo sueño, papá. Quiero irme a la cama.\n@c0@"
  fr: "@a%0%a001250@bJe suis fatiguée, papa. Je veux aller me coucher.\n@c0@"
  it: "@a%0%a001250@bPapà, ho sonno...\nVoglio andare a dormire...\n@c0@"
  ja: "@a@b%a001250「お父さん　眠いよう。\n\tわたしも　ベッドに入りたい～。\n@c0@"
110:
  de: "@aBianca@bHier hast du mal einem Mann geholfen, der auf der Suche nach Heilkräutern festsaß, stimmt's nicht, %a000090?\n@c0@"
  en: "@aBianca@bYou helped a bloke who got stuck here lookin' for medicinal herbs once, right, %a000090?\n@c0@"
  es: "@aBianca@bUna vez ayudaste a un tipo que se quedó aquí atrapado mientras buscaba plantas medicinales, ¿verdad, %a000090?\n@c0@"
  fr: "@aBianca@bUn jour, tu as aidé un type qui était resté coincé ici en venant chercher des herbes médicinales,\nn'est-ce pas, %a000090ⓡ\n@c0@"
  it: "@aBianca@bTanto tempo fa aiutasti un uomo che si era trovato in difficoltà mentre stava cercando delle erbe medicinali... Non è così, %a000090?\n@c0@"
  ja: "@a@bビアンカ「昔　この洞くつで\n\tくすり師のおじさんを　助けたのって\n\t%a000090でしょ？　私　知ってたよ。\n@c0@"
111:
  de: "@aBianca@bDarüber weiß ich nämlich bestens Bescheid. Er war schwer beeindruckt, dass ein kleiner Junge sich in eine Höhle mit so vielen Ungeheuern gewagt hat.\n@c0@"
  en: "@aBianca@bI know all about it, see. He was well impressed\r\nwith you, a brave little kid goin' into a cave with\r\nso many monsters.\n@c0@"
  es: "@aBianca@bConozco esa historia. Se quedó impresionado al ver a un valiente chavalín entrar en una cueva llena de monstruos, ¿sabes?\n@c0@"
  fr: "@aBianca@bTu vois, je sais tout.\n㈡\nUn courageux petit garçon comme toi, capable de s'aventurer dans une caverne pleine de monstres,\nça l'avait beaucoup impressionné.\n@c0@"
  it: "@aBianca@bConosco la storia, perché quel tipo raccontò di essere stato salvato da un bambino coraggioso che era entrato da solo in una caverna piena di mostri...\n@c0@"
  ja: "@a@bビアンカ「おじさんが　教えてくれたの。\n\tあの洞くつは　魔物が出るのに\n\tすごい子だなって　思ったんだ。\n@c0@"
112:
  de: "@aBianca@bZum ersten Mal war ich hier, unmittelbar nachdem die Soldaten aus Tifortu Steinach niedergebrannt hatten.\n@c0@"
  en: "@aBianca@bThe first time I came in here was just after\r\nthem soldiers from Coburg burnt Whealbrook\r\nto the ground.\n@c0@"
  es: "@aBianca@bLa primera vez que vine aquí fue después de que los soldados de Trastámara destruyeran Arroyofrío.\n@c0@"
  fr: "@aBianca@bLa première fois que je suis entrée ici,\r\nc'était juste après que les soldats de\r\nCobourg eurent incendié Ruycelieu.\n@c0@"
  it: "@aBianca@bLa prima volta che venni qui fu subito dopo che i soldati di Coburg avevano raso al suolo Valcava.\n@c0@"
  ja: "@a@bビアンカ「私が　初めて　ここに入ったのは\n\tラインハットの兵が　サンタローズを\n\t焼きはらったあとのことよ。\n@c0@"
113:
  de: "@aBianca@bIch dachte, vielleicht finde ich dich hier irgendwo in einem Versteck, weißt du.\n@c0@"
  en: "@aBianca@bI thought maybe I'd find you in here hidin', you see.\n@c0@"
  es: "@aBianca@bPensaba que te encontraría aquí escondido...\n@c0@"
  fr: "@aBianca@bJe m'étais dit que je te trouverais peut-être\r\ncaché ici.\n@c0@"
  it: "@aBianca@bPensai che ti fossi nascosto in questo posto...\n@c0@"
  ja: "@a@bビアンカ「もしかしたら\n\tひなんした%a000090が　ここに\n\tかくれていないかと　思って……。\n@c0@"
114:
  de: "@aNera@bDu musst ein geborener Abenteurer sein, wenn du als kleiner Junge schon in dieser Höhle spielen wolltest!\n@c0@"
  en: "@aNera@bYou must've been a born adventurer to come playing in this cave when you were such a small boy!\n@c0@"
  es: "@aNera@b¡Debías de ser un aventurero nato! ¡Venir a jugar a esta cueva cuando no eras más que un bambino!\n@c0@"
  fr: "@aNera@bTu devais être un aventurier-né pour venir jouer dans cette caverne alors que tu n'étais qu'un tout petit garçonⓠ\n@c0@"
  it: "@aNera@bDevi essere nato con la passione per l'avventura nel sangue, per aver esplorato questa caverna quand'eri ancora un bambino!\n@c0@"
  ja: "@a@bフローラ「子供の頃から　こんな洞くつを\n\t遊び場にしていたなんて　あなたって\n\t根っからの　冒険家でしたのね。\n@c0@"
115:
  de: "@aNera@bHier hast du also immer gespielt, als du klein warst. Ich bin immer auf den Wachturm La Guardia gegangen.\n@c0@"
  en: "@aNera@bSo this is where you used to play when you were small. I used to always play at the La Guardia lookout tower.\n@c0@"
  es: "@aNera@bAsí que solías jugar aquí cuando eras un bambino. Yo solía ir a jugar a la atalaya de La Guardia.\n@c0@"
  fr: "@aNera@bC'est donc ici que tu jouais lorsque tu étais petit.\r\nMoi, j'allais toujours m'amuser dans la tour de guet\r\nde La Guardia.\n@c0@"
  it: "@aNera@bDa piccolo giocavi qui, non è vero?\nIo, invece, mi divertivo a gironzolare dalle parti della torre di La Guardia.\n@c0@"
  ja: "@a@bフローラ「あなたが　ここを遊び場に\n\tなさっていたように　私は　\n\t見はらしの塔を　遊び場にしていたのよ。\n@c0@"
116:
  de: "@aNera@bPapa hat immer schrecklich mit mir geschimpft, wenn er mich dort entdeckte.\n@c0@"
  en: "@aNera@bI used to be scolded terribly by Papa if he ever caught me there.\n@c0@"
  es: "@aNera@bIl mio papino se enfadaba molto y me reñía si me pillaba allí.\n@c0@"
  fr: "@aNera@bJe me faisais gronder très fort par papa\r\nquand il m'attrapait là-bas.\n@c0@"
  it: "@aNera@bRicordo che mio padre si arrabbiava moltissimo quando mi scopriva lì!\nMi faceva delle lavate di capo tremende!\n@c0@"
  ja: "@a@bフローラ「見つかったときは　父に\n\tたくさん　怒られてしまいましたけど。\n\tうふふ。\n@c0@"
117:
  de: "@a%0%a001240@bHast du diese Höhle ganz alleine erkundet, Papa?\n@c0@"
  en: "@a%0%a001240@bDid you come exploring in this cave all by\nyourself, Dad?\n@c0@"
  es: "@a%0%a001240@b¿Viniste tú solo a explorar esta cueva, papá?\n@c0@"
  fr: "@a%0%a001240@bTu as exploré cette grotte tout seul, papaⓡ\n@c0@"
  it: "@a%0%a001240@bPapà, la prima volta che esplorasti questa caverna eri da solo, non è vero?\n@c0@"
  ja: "@a@b%a001240「お父さんは　ひとりで\n\tこの洞くつに　来たんでしょ？\n@c0@"
118:
  de: "@a%0%a001240@bDamals warst du noch jünger, als ich es jetzt bin, nicht wahr? Mann, musst du mutig gewesen sein!\n@c0@"
  en: "@a%0%a001240@bYou were a lot younger than me then, weren't you? You must've been really brave!\n@c0@"
  es: "@a%0%a001240@bEras mucho más pequeño que yo, ¿verdad? ¡Qué valiente eras!\n@c0@"
  fr: "@a%0%a001240@bTu étais beaucoup plus jeune que moi à cette époque, heinⓡ Tu devais être vraiment courageuxⓠ\n@c0@"
  it: "@a%0%a001240@bEd eri persino più piccolo di me quando lo facesti!\nAccidenti! Eri proprio un bambino coraggioso!\nAnzi, forse eri anche un po' incosciente! Eh eh eh!\n@c0@"
  ja: "@a@b%a001240「それも　ボクより\n\tずっと　ちいさい時に。\n\tすごいなあ　お父さんって！\n@c0@"
119:
  de: "@a%0%a001240@bDiese Höhle ist fantastisch.\n@c0@"
  en: "@a%0%a001240@bThis cave is amazing.\n@c0@"
  es: "@a%0%a001240@bEsta cueva es fantástica.\n@c0@"
  fr: "@a%0%a001240@bCette grotte est impressionnante.\n@c0@"
  it: "@a%0%a001240@bQuesta caverna è incredibile!\n@c0@"
  ja: "@a@b%a001240「それにしても\n\tすごい　洞くつだね。\n@c0@"
120:
  de: "@a%0%a001240@bOb sie wohl von all den Leuten gegraben wurde, die nach Steinach-Blausteinen gesucht haben?\n@c0@"
  en: "@a%0%a001240@bI wonder if it was dug out by all of the people who came here looking for Whealbrook bluestones.\n@c0@"
  es: "@a%0%a001240@bMe pregunto si la excavó la gente que vino aquí en busca de aguamarinas de Arroyofrío.\n@c0@"
  fr: "@a%0%a001240@bJe me demande si elle a été creusée par tous les gens qui sont venus ici chercher une gemme bleue de Ruycelieu.\n@c0@"
  it: "@a%0%a001240@bChissà quante persone sono venute qui per cercare le pietre nobili di Valcava...\n@c0@"
  ja: "@a@b%a001240「聖なる原石　とかいうのが\n\tほしくて　みんなで　ほったのかな？\n@c0@"
121:
  de: "@a%0%a001250@bÄhm, du wirst die Monster hier doch nicht allzu sehr verärgern, oder, Papa?\n@c0@"
  en: "@a%0%a001250@bUm, you won't go annoying the monsters in here too much, will you, Dad?\n@c0@"
  es: "@a%0%a001250@bNo vas a hacer enfadar demasiado a los monstruos de ahí dentro, ¿verdad, papi?\n@c0@"
  fr: "@a%0%a001250@bMmm, tu ne vas pas trop embêter les monstres qui vivent là, hein, papaⓡ\n@c0@"
  it: "@a%0%a001250@bPapà, promettimi che cercherai di non dare troppo fastidio ai mostri che vivono nella caverna...\n@c0@"
  ja: "@a@b%a001250「あのね　お父さん。\n\tこの洞くつの魔物さんたちは\n\tあんまり　いじめないでね。\n@c0@"
122:
  de: "@a%0%a001250@bDas Wasser hier ist wirklich schön. Ich frage mich, wo es herkommt...\n@c0@"
  en: "@a%0%a001250@bThe water in here is really pretty. I wonder where it comes from.\n@c0@"
  es: "@a%0%a001250@bEl agua es preciosa aquí. ¿De dónde vendrá?\n@c0@"
  fr: "@a%0%a001250@bCette eau est vraiment limpide. Je me demande d'où elle vient.\n@c0@"
  it: "@a%0%a001250@bHai visto com'è limpida l'acqua qui dentro?\nChissà da dove arriva...\n@c0@"
  ja: "@a@b%a001250「ここの洞くつのお水　きれい。\n\tどこから　流れてきてるの？\n@c0@"
123:
  de: "@aSancho@bSeñor Ludwig, er ist oft hierher gekommen. Iss habe ihm immer Essen mitgegeben... Si, si... Es ist fast so, als wäre es gestern gewesen.\n@c0@"
  en: "@aSancho@bSeñor Pankraz, he came here all the time.\nI used to make for heem the packed lunch.\nSí, sí... I remember eet like yesterday.\n@c0@"
  es: "@aSancho@bEl señor Teudis venía siempre aquí.\nYo le preparaba unos emparedados.\n¡Órale! Lo recuerdo como si fuese ayer.\n@c0@"
  fr: "@aSancho@bLe señor P-Petros, il venait tout le temps ici. Je lui préparais son r-repas. Si, si... Je m'en s-souviens comme si c'était hier.\n@c0@"
  it: "@aSancho@bCuando el señor Russel veniva aquí, gli preparavo el pranzo al saccos. Me chiedeva siempre de fargli tortillas con paella. ¡Le adorava!\n@c0@"
  ja: "@a@bサンチョ「私のおべんとうを持って\n\tパパスさまは　よく　この洞くつへ。\n\t今でも　そのお姿が　目に浮かびます。\n@c0@"
124:
  de: "@aSancho@bDie Leute aus dem Pueblo, sie sind nie in die Nähe der Höhle gekommen, weil sie Angst vor die Monster hatten.\n@c0@"
  en: "@aSancho@bThe people from the village, they no come near the cave because they were afraid of monsters.\n@c0@"
  es: "@aSancho@bLos habitantes del pueblo ni se acercaban a la cueva porque tenían miedo de los monstruos.\n@c0@"
  fr: "@aSancho@bLes g-gens du village, ils ne s'approchaient p-pas de la grotte parce qu'ils avaient peur des m-monstres.\n@c0@"
  it: "@aSancho@bLos abitantes del villaggio no osavano avvicinarse alla grotta, por qué avevano paura de los mostros...\n@c0@"
  ja: "@a@bサンチョ「村の者は　魔物をおそれて\n\t洞くつには　近寄りませんでした。\n@c0@"
125:
  de: "@aSancho@bDarum konnte Señor Ludwig auch seine Forschungen machen, ohne dass jemand etwas gemerkt hat.\n@c0@"
  en: "@aSancho@bThees ees why señor Pankraz, he can continue hees research and no one knows notheeng.\n@c0@"
  es: "@aSancho@bPor eso el señor Teudis pudo seguir investigando sin que nadie supiese nada.\n@c0@"
  fr: "@aSancho@bC'est pour ça que le señor P-Petros, il p-pouvait poursuivre ses recherches sans que p-personne\r\nne le s-sache.\n@c0@"
  it: "@aSancho@bPor esto motivo el señor Russel podeva lavorare tranquillamentes nella caverna, senza que nessunos lo disturbasse...\n@c0@"
  ja: "@a@bサンチョ「ですから　パパスさまは\n\t誰にも　その内容を知られることなく\n\t研究を続けられたのだと思います。\n@c0@"
126:
  de: "@aSancho@bDie Flammen sind nisst bis hier gekommen, no? Es sieht genauso aus wie früher.\n@c0@"
  en: "@aSancho@bThe flames, they no can come een here, eh?\nEes just like eet was before.\n@c0@"
  es: "@aSancho@bLas llamas no pueden entrar aquí, ¿eh?\nHíjole, está igual que era.\n@c0@"
  fr: "@aSancho@bLes f-flammes, elles ne sont pas arrivées jusqu'ici, heinⓡ C'est c-comme avant.\n@c0@"
  it: "@aSancho@bChico, yo so que tu conosci bien esta caverna, ma recuerda de procedere siempre con cautela...\n@c0@"
  ja: "@a@bサンチョ「……さすがに　ここまでは\n\t火の手も　まわらなかったんですね。\n\t昔のままだ……。\n@c0@"
127:
  de: "@aOtto@bEuren Erzählungen nach hätte ich eine etwas größere Höhle erwartet...\n@c0@"
  en: "@aTuppence@bI was expecting a rather bigger cave, given the way you spoke about it.\n@c0@"
  es: "@aAlazar@bEsperaba una cueva bastante grande, tal y como hablabais de ella.\n@c0@"
  fr: "@aInnocent@bDe la manière dont vous en parliez, je m'attendais à une grotte beaucoup plus grande.\n@c0@"
  it: "@aSimon@bDa come me l'aveva descritta, credevo che la caverna fosse molto più grande.\n@c0@"
  ja: "@a@bピピン「%a000090さまのお話だと\n\tもっと　広い洞くつかと\n\t思ってました。\n@c0@"
128:
  de: "@aOtto@bAber als Kind empfindet man die Dinge ja immer ein wenig größer...\n@c0@"
  en: "@aTuppence@bI suppose things always seem bigger to you\r\nas a child.\n@c0@"
  es: "@aAlazar@bSupongo que las cosas siempre parecen mayores cuando uno es un niño.\n@c0@"
  fr: "@aInnocent@bJe suppose que tout semble toujours plus grand quand on est enfant.\n@c0@"
  it: "@aSimon@bEmbè, Maestà?!\r\nVoleva forse impressionarmi con i racconti delle sue imprese giovanili?! Ah ah ah! Ehm, mi scusi, Sire...\n@c0@"
  ja: "@a@bピピン「子供の頃に　見るものって\n\tやけに　大きく見えますもんね。\n@c0@"
129:
  de: "@aOtto@bEs ist ziemlich feucht hier drin. Wahrscheinlich wegen des Flusses, nicht wahr?\n@c0@"
  en: "@aTuppence@bIt feels very damp in here. I wonder if it's because of the river.\n@c0@"
  es: "@aAlazar@bHay mucha humedad aquí. Será por el río, quizá.\n@c0@"
  fr: "@aInnocent@bC'est vraiment humide, ici. Je me demande si c'est\r\nà cause de la rivière.\n@c0@"
  it: "@aSimon@bC'è molta umidità qui dentro.\nCredo che sia per effetto della vicinanza del fiume...\n@c0@"
  ja: "@a@bピピン「しかし　じめじめと\n\t空気が重たいなあ。\n\t川が　あるせいでしょうか。\n@c0@"
130:
  de: "@aBianca@bHier muss Ludwig all seine Nachforschungen über den legendären Helden angestellt haben.\n@c0@"
  en: "@aBianca@bThis must be where Pankraz did all his research about the legendary hero.\n@c0@"
  es: "@aBianca@bAquí debió de ser donde Teudis investigó sobre el héroe legendario, ¿sabes?\n@c0@"
  fr: "@aBianca@bCe doit être ici que Petros a fait toutes ses recherches sur le héros légendaire.\n@c0@"
  it: "@aBianca@bQuesto dev'essere il luogo dove Russel svolgeva le sue ricerche sull'Eroe Leggendario.\n@c0@"
  ja: "@a@bビアンカ「ここで　パパスさんは\n\t伝説の勇者について\n\t研究していたんでしょうね……。\n@c0@"
131:
  de: "@aNera@bIrgendwie hat dieser Ort eine ganz besondere, warme Atmosphäre...\n@c0@"
  en: "@aNera@bThis place seems to have a kind of warm atmosphere to it somehow.\n@c0@"
  es: "@aNera@bDe alguna manera, este lugar da sensazione de calidez.\n@c0@"
  fr: "@aNera@bBizarrement, il règne une atmosphère assez douce dans cet endroit.\n@c0@"
  it: "@aNera@bQuesto posto è piuttosto accogliente...\nC'è un'atmosfera gradevole, non trovi?\n@c0@"
  ja: "@a@bフローラ「この場所は　なんだか\n\tあたたかい空気に　つつまれている\n\t感じがしますわね。\n@c0@"
132:
  de: "@a%0%a001240@bIst das Großvaters geheimer Raum? Klasse! Vielleicht sollte ich mir auch ein Geheimzimmer zulegen...\n@c0@"
  en: "@a%0%a001240@bIs this Grandpa's secret room? It's really cool! Maybe I should have a secret room too!\n@c0@"
  es: "@a%0%a001240@b¿Este es el cuarto secreto del abuelo? ¡Es genial de verdad! ¡Yo también quiero un cuarto secreto!\n@c0@"
  fr: "@a%0%a001240@bC'est la pièce secrète de grand-pèreⓡ C'est génialⓠ Peut-être que je pourrais me faire une pièce secrète, moi aussiⓠ\n@c0@"
  it: "@a%0%a001240@bQuesto è il rifugio segreto di nonno Russel?\nTroppo forte!\nAnch'io voglio il mio rifugio segreto!\n@c0@"
  ja: "@a@b%a001240「ここが　パパスおじいちゃんの\n\tヒミツの部屋？　いいなあ～\n\tボクも　ヒミツの部屋　ほしいよう！\n@c0@"
133:
  de: "@a%0%a001250@bGroßvater Ludwig...\n@c0@"
  en: "@a%0%a001250@bGrandpa Pankraz...\n@c0@"
  es: "@a%0%a001250@bAbuelo Teudis...\n@c0@"
  fr: "@a%0%a001250@bGrand-père Petros...\n@c0@"
  it: "@a%0%a001250@bNonno Russel...\nChissà com'era la sua voce...\n@c0@"
  ja: "@a@b%a001250「パパスおじいちゃん……。\n@c0@"
134:
  de: "@aSancho@bEs ist das erste Mal, dass iss diese Raum sehe. Señor Ludwig, er, er...\n@c0@"
  en: "@aSancho@bEes the first time I esee thees room.\nSeñor Pankraz, he, he...\n@c0@"
  es: "@aSancho@b¡Ay, caramba!, es la primera vez que veo este cuarto.\nEl señor Teudis, él...\n@c0@"
  fr: "@aSancho@bC-C'est la première fois que je vois cette p-pièce.\r\nLe s-señor Petros, il, il...\n@c0@"
  it: "@aSancho@bEs la primera vez que entro en esta estanza..\r\nL'estanza del señor Russel...\r\nYo... Yo me commuovos... ¡Sob!\n@c0@"
  ja: "@a@bサンチョ「ここまで来たのは\n\t初めてですよ。\n\tああ…　パパスさまは　ここで……。\n@c0@"
135:
  de: "@aOtto@bDas ist also das Studierzimmer des mächtigen Königs Ludwig! Oh, welch eine Ehre, hier zu stehen!\n@c0@"
  en: "@aTuppence@bSo this is the research chamber of the mighty King Pankraz! Ooh, I feel quite overwhelmed!\n@c0@"
  es: "@aAlazar@b¡Así que esta es la sala donde investigaba el poderoso rey Teudis! ¡Me siento abrumado!\n@c0@"
  fr: "@aInnocent@bVoici donc la salle d'étude du grand roi Petrosⓠ\nOoh, je dois dire que je suis assez émuⓠ\n@c0@"
  it: "@aSimon@bQuesta è la stanza dove il compianto re Russel conduceva le sue ricerche?! Dovrebbe essere proclamata luogo sacro per gli abitanti di Denim...\n@c0@"
  ja: "@a@bピピン「こ　ここが　偉大なる\n\tパパス王さまの研究室……！\n\tううっ　カンゲキですっ！\n@c0@"
136:
  de: "@aGriselda@bWie lange willst du eigentlich noch in alten Erinnerungen schwelgen, %a000090?\n@c0@"
  en: "@aDebora@bHow long are you planning on carrying on with this trip down memory lane, %a000090?\n@c0@"
  es: "@aStefania@b¿Tienes pensado pasarte molto tempo recordando batallitas, %a000090?\n@c0@"
  fr: "@aPandora@bCombien de temps encore as-tu l'intention de continuer ce petit voyage dans le passé, %a000090ⓡ\n@c0@"
  it: "@aViola@bVogliamo smetterla di perdere tempo, %a000090?\n@c0@"
  ja: "@a@bデボラ「%a000090。　いつまで\n\t思い出に　ひたっているつもりなの？\n@c0@"
137:
  de: "@aGriselda@bWir haben eine wichtige Aufgabe zu erfüllen, vergiss das nicht. Wir sollten weiter.\n@c0@"
  en: "@aDebora@bYou have an important task to take care of, remember. It's time to move on.\n@c0@"
  es: "@aStefania@bTienes que ocuparte de una tarea importante, ¿capisci? Ponte en marcha.\n@c0@"
  fr: "@aPandora@bJe te rappelle que tu as une tâche importante à accomplir. Il faut qu'on y aille.\n@c0@"
  it: "@aViola@bNel caso ti fosse uscito di mente, ti rammento che hai un'importantissima missione da svolgere.\nAndiamo via, su.\n@c0@"
  ja: "@a@bデボラ「あんたには\n\tやることがあるでしょう？\n\tさあ　行くわよ。\n@c0@"
138:
  de: "@aGriselda@bTja, wir saßen all die Jahre als Statuen fest... Hmpf. Mir gefällt es gar nicht, ständig daran erinnert zu werden!\n@c0@"
  en: "@aDebora@bWell, we were stuck as statues for all those years. Huh! Being reminded of that really irritates me.\n@c0@"
  es: "@aStefania@bBueno, nos hemos pasado unos cuantos años come estatuas.\nSolo de recordarlo me pongo molto tensa.\n@c0@"
  fr: "@aPandora@bEh bien, on a été coincés, transformés en statues pendant tout ce temps. Tsss, ça m'énerve vraiment qu'on me rappelle ça.\n@c0@"
  it: "@aViola@bLe statue non invecchiano, ecco perché sembriamo tanto giovani...\n㈡\nNon so se rallegrarmi perché ho ancora l'aspetto di una ragazzina o mettermi a piangere per gli anni che ho trascorso lontana da te e dai nostri figli...\n@c0@"
  ja: "@a@bデボラ「私たち　ずっと石になっていたしね。\n\tあ…　なんだか　思い出したら\n\tまた　イライラしてきたわ。\n@c0@"
139:
  de: "@aGriselda@bDa kommen alte Erinnerungen hoch, was? Aber wir sollten die Vergangenheit jetzt hinter uns lassen und in die Zukunft blicken.\n@c0@"
  en: "@aDebora@bBeing here certainly takes me back. It's time we stopped looking to the past now, though.\n@c0@"
  es: "@aStefania@bEste sitio me trae muchos recuerdos. Ma ya basta de mirar hacia el pasado.\n@c0@"
  fr: "@aPandora@bÇa me rappelle des souvenirs, d'être ici. Mais nous devons arrêter de regarder en arrière, maintenant.\n@c0@"
  it: "@aViola@bQuesti luoghi mi fanno pensare al passato...\nAh, sto diventando troppo sentimentale!\nBisogna guardare avanti!\n@c0@"
  ja: "@a@bデボラ「ずいぶん　なつかしい場所だわ。\n\tでも　昔をふりかえるのは\n\tそろそろ　終わりにしなさいよ。\n@c0@"
140:
  de: "@aGriselda@bUntersteh dich, mich jemals in solch eine Situation zu bringen, %a000090. Das würde ich dir nie verzeihen.\n@c0@"
  en: "@aDebora@bYou'd better not ever put me in that position, %a000090. I'd never forgive you if you did.\n@c0@"
  es: "@aStefania@bSerá meglio que no me pongas nunca en una situación así, %a000090. No te lo perdonaría nunca, ¿capisci?\n@c0@"
  fr: "@aPandora@bTu n'as pas intérêt à me mettre un jour dans cette situation, %a000090. Je ne te le pardonnerais jamais.\n@c0@"
  it: "@aViola@bNon azzardarti a farti inghiottire da qualche mostro, %a000090. Non ho nessuna intezione di perdere il mio fedele maritino! Mi sono spiegata?!\n@c0@"
  ja: "@a@bデボラ「%a000090。　私を　ここのダンナと\n\t同じ目にあわせたりしたら……\n\t絶対に　許さないわよ。\n@c0@"
141:
  de: "@aGriselda@bAm Wasser ist es nachts immer so kalt. Aber ich habe nichts davon gesagt, dass du mich wärmen sollst, %a000090!\n@c0@"
  en: "@aDebora@bIt's chilly by the water at night. And no, I wasn't saying that so you'd come and warm me up, %a000090.\n@c0@"
  es: "@aStefania@bDe notte hace frío junto al acqua. No, no lo digo para que vengas a darme calor, %a000090.\n@c0@"
  fr: "@aPandora@bIl fait frisquet près de l'eau, la nuit.\nEt non, je ne disais pas ça pour que tu viennes\nme réchauffer, %a000090.\n@c0@"
  it: "@aViola@bFa freschino, %a000090...\nNo, non te l'ho detto perché tu ti avvicini e mi riscaldi!\n㈡\nCerte cose dovresti farle senza che te le suggerisca, non credi?!\n@c0@"
  ja: "@a@bデボラ「夜の港って　肌ざむいわね。\n\tだからって　寄ってこないで　%a000090。\n@c0@"
