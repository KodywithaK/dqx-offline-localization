  fr: "@aNera@bÇa a toujours été mon rêve. Pouvoir parcourir le monde en toute liberté avec quelqu'un qui m'est cher.\n@c0@"
  it: "@aNera@bHo sempre desiderato fare un viaggio insieme alla persona che amo.\nAdesso, grazie a te, il mio sogno s'è realizzato...\n@c0@"
  ja: "@a@bフローラ「私　夢でしたの。\n\tこうして　大切な人と\n\t自由に　世界を　旅するのが……。\n@c0@"
53:
  de: "@aNera@bWir können uns wohl nicht einfach treiben lassen, auch wenn mir das Spaß machen würde.\n@c0@"
  en: "@aNera@bI suppose we can't afford to just let the moment take us, fun though it is.\n@c0@"
  es: "@aNera@bPero supongo que no podemos disfrutar del momento, por muy agradabile que sea.\n@c0@"
  fr: "@aNera@bMême si c'est plaisant, je suppose que nous ne pouvons pas tout oublier pour savourer l'instant.\n@c0@"
  it: "@aNera@bScusami, tesoro...\nEro soprappensiero...\n@c0@"
  ja: "@a@bフローラ「でも　うかれてばかりも\n\tいられませんわね。\n@c0@"
54:
  de: "@aNera@bNein, wir sollten uns darauf konzentrieren, den legendären Helden zu finden und deine Mutter zu befreien.\n@c0@"
  en: "@aNera@bNo, we need to focus on finding the legendary hero and rescuing your mother.\n@c0@"
  es: "@aNera@bTenemos que concentrarnos en encontrar al héroe legendario y rescatar a la tua mamma.\n@c0@"
  fr: "@aNera@bNous devons nous concentrer sur la recherche\r\ndu héros légendaire et tenter de sauver ta mère.\n@c0@"
  it: "@aNera@bStavo riflettendo sul fatto che dobbiamo trovare l'Eroe Leggendario il prima possibile, se vogliamo salvare tua madre.\n@c0@"
  ja: "@a@bフローラ「あなたには　勇者さまをさがし\n\tお母さまを　救い出すという\n\t目的があるんですもの……。\n@c0@"
55:
  de: "@aNera@bAber hin und wieder sollten wir eine kleine Pause für ein Gespräch einlegen, ja? Es wäre schön, wenn wir uns ein bisschen näher kennenlernen könnten.\n@c0@"
  en: "@aNera@bDo stop and chat with me every now and then, won't you? I'd like it if we could get to know each other a bit better.\n@c0@"
  es: "@aNera@bMa me gustaría que charlásemos de vez en cuando, caro mio. Quiero que nos conozcamos mejor.\n@c0@"
  fr: "@aNera@bN'hésite pas à prendre le temps de t'arrêter pour bavarder un peu avec moi, d'accordⓡ J'aimerais que nous apprenions à nous connaître un peu mieux.\n@c0@"
  it: "@aNera@bMi farebbe piacere parlare con te un po' più spesso, sai?\nSarebbe un ottimo modo per conoscerci meglio.\n@c0@"
  ja: "@a@bフローラ「ときどきで　いいから\n\t話しかけてくださいね。\n\t私のこと　よく知っていただきたいの。\n@c0@"
56:
  de: "@aBianca@bIch möchte nach Humburg reisen. Das könnten wir doch machen, %a000090, oder?\n@c0@"
  en: "@aBianca@bI want to go to Gotha.\nWe can go, right, %a000090?\n@c0@"
  es: "@aBianca@bQuiero ir a Pankraz.\n¿Verdad que podemos ir, %a000090?\n@c0@"
  fr: "@aBianca@bJ'aimerais aller à Gotha.\nC'est possible, hein, %a000090ⓡ\n@c0@"
  it: "@aBianca@b%0%a000090, che ne diresti di andare a Denim?\n@c0@"
  ja: "@a@bビアンカ「私　グランバニアに\n\t行ってみたい。\n\tねえ　%a000090　行きましょうよ。\n@c0@"
57:
  de: "@aBianca@bWeißt du, ich hab das Gefühl, dort erfahre ich vielleicht etwas mehr über dich.\n@c0@"
  en: "@aBianca@bI feel like I might find somethin' new out about you if we go there, see.\n@c0@"
  es: "@aBianca@bCreo que averiguaré algo sobre ti si vamos allá.\n@c0@"
  fr: "@aBianca@bJ'ai le sentiment que nous pourrions découvrir des choses sur toi en allant là-bas, vois-tu.\n@c0@"
  it: "@aBianca@bHo la sensazione che la nostra sarebbe una visita proficua.\nPotremmo scoprire qualcosa di interessante...\n@c0@"
  ja: "@a@bビアンカ「そこへ行くと\n\t%a000090の　なにかが\n\tわかるような気がするの。\n@c0@"
58:
  de: "@aBianca@bDiese Sache mit der Ehe fängt an, mir zu gefallen. Ich hoffe, wir können noch lange so miteinander durch die Welt reisen.\n@c0@"
  en: "@aBianca@bI'm startin' to get used to this man and wife lark. I hope we can keep on travellin' together like this for\r\na long while.\n@c0@"
  es: "@aBianca@bYa me empiezo a acostumbrar a la cosa esta de marido y mujer. Espero que podamos viajar juntos así durante mucho tiempo, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe commence à m'habituer à ce statut de mari et femme. J'espère que nous pourrons continuer longtemps à voyager ensemble comme ça.\n@c0@"
  it: "@aBianca@bMi sto abituando all'idea di essere tua moglie, sai? Ora non mi viene più da ridere, se penso di viaggiare con il ⓕmio amato consorteⓖ! Wah ah ah ah ah!\n㈡\nScusa, non sono riuscita a trattenermi...\n@c0@"
  ja: "@a@bビアンカ「こうして　夫婦で旅するのも\n\tずいぶん　なれてきたわね。\n\tずっと　こうしていられたらいいのに。\n@c0@"
59:
  de: "@aBianca@bWeißt du, ich unterhalte mich wirklich gern mit dir, %a000090.\n@c0@"
  en: "@aBianca@bYou know, I really like chattin' with you, %a000090.\n@c0@"
  es: "@aBianca@bMe gusta mucho charlar contigo, %a000090.\n@c0@"
  fr: "@aBianca@bTu sais, j'aime vraiment bien bavarder avec toi, %a000090.\n@c0@"
  it: "@aBianca@bMi piace molto parlare con te del più e del meno, %a000090.\n@c0@"
  ja: "@a@bビアンカ「私　%a000090と\n\tしゃべるの　好きだな……。\n@c0@"
60:
  de: "@aBianca@bBevor wir beide zusammenkamen, hatte ich ja keine Ahnung, wie redselig ich sein kann!\n@c0@"
  en: "@aBianca@bI had no idea how talkative I could be until you and I got together!\n@c0@"
  es: "@aBianca@b¡Hasta que no estuvimos juntos no sabía que fuese tan parlanchina!\n@c0@"
  fr: "@aBianca@bAvant que nous soyons ensemble, je n'imaginais pas\nà quel point je pouvais être bavardeⓠ\n@c0@"
  it: "@aBianca@bSpero solo che i miei discorsi non ti annoino!\n@c0@"
  ja: "@a@bビアンカ「%a000090と　こうなるまで\n\t私が　おしゃべり好きだったなんて\n\t自分でも　知らなかった。\n@c0@"
61:
  de: "@aNera@bIrgendetwas an dem Namen Humburg erweckt mein Interesse.\n@c0@"
  en: "@aNera@bSomething about the name Gotha really gets my interest piqued for some reason.\n@c0@"
  es: "@aNera@bPor algún motivo, el nombre Pankraz hace que me pique la curiosidad.\n@c0@"
  fr: "@aNera@bPour une raison que j'ignore, il y a quelque chose dans le nom de Gotha qui pique ma curiosité.\n@c0@"
  it: "@aNera@bNon so per quale motivo, ma mi sento attratta da Denim.\n@c0@"
  ja: "@a@bフローラ「ふしぎですが　私も\n\tグランバニアという名前に\n\tひかれるものが　あります。\n@c0@"
62:
  de: "@aNera@bIch würde wirklich gern dorthin reisen, wenn du auch Lust dazu hättest.\n@c0@"
  en: "@aNera@bI'd very much like to visit there if you'd like to\r\ngo too.\n@c0@"
  es: "@aNera@bSi te parece, sería molto felice si pudiéramos ir allí.\n@c0@"
  fr: "@aNera@bSi tu es d'accord, j'aimerais vraiment beaucoup me rendre dans cet endroit.\n@c0@"
  it: "@aNera@bMi piacerebbe molto andarci con te...\n@c0@"
  ja: "@a@bフローラ「私も　その国へ\n\t行ってみたいですわ。\n@c0@"
63:
  de: "@aNera@bÄhm, Liebling...\nAch was. Schon gut.\n@c0@"
  en: "@aNera@bUm, darling...\nIt's okay. Never mind.\n@c0@"
  es: "@aNera@bMmm, caro mio...\r\nVa bene, no importa.\n@c0@"
  fr: "@aNera@bHum, mon chéri...\nEuh, non, rien. Tout va bien.\n@c0@"
  it: "@aNera@bCaro?\nPosso dirti una cosa?\n@c0@"
  ja: "@a@bフローラ「ねえ　あなた……。\n\tううん…　なんでもないの。\n@c0@"
64:
  de: "@aNera@bJetzt reisen wir schon eine ganze Weile miteinander herum, und doch macht mich deine Gegenwart manchmal noch ganz schüchtern und verlegen.\n@c0@"
  en: "@aNera@bWe've been travelling together for a while now,\r\nand yet I still sometimes feel all nervous and shy with you.\n@c0@"
  es: "@aNera@bAunque llevamos un tiempo viajando in sieme, aún hay momentos en que me siento tímida con te.\n@c0@"
  fr: "@aNera@bCela fait un bon moment que nous voyageons ensemble, tous les deux, et pourtant il m'arrive encore de me sentir nerveuse et timide avec toi.\n@c0@"
  it: "@aNera@bOrmai è da un po' che viaggiamo insieme, eppure a volte mi sento un po' nervosa. Forse non mi sono ancora abituata all'idea di essere tua moglie...\n@c0@"
  ja: "@a@bフローラ「もう　旅して長いはずなのに\n\t私ったら　いつまでも　あなたに\n\tドキドキして…　ぽっ……。\n@c0@"
65:
  de: "@aGriselda@bAlso sollen wir zu dem Schrein nordwestlich von Mostroferrato gehen und... was sollten wir dort noch gleich nachsehen?\n@c0@"
  en: "@aDebora@bSo we have to go to the shrine to the north-west of Mostroferrato and... What was it we had to check?\n@c0@"
  es: "@aStefania@bAsí que tenemos que ir al altar al oeste de Mostroferrato y... ¿Ma quale cosa teníamos que comprobar?\n@c0@"
  fr: "@aPandora@bBon alors, on doit aller au sanctuaire situé au\nnord-ouest de Mostroferrato et...\nQu'est-ce qu'on doit vérifier, déjàⓡ\n@c0@"
  it: "@aViola@bQuindi dobbiamo andare al tempio che si trova sull'isola a nord-ovest di Mostroferrato e... poi? Cosa dobbiamo fare?\n@c0@"
  ja: "@a@bデボラ「サラボナ北西の　ほこらの中の……\n\t何を　見てくるんだったかしら？\n@c0@"
66:
  de: "@aGriselda@bHa ha! Ich weiß doch. Die Farbe des Tiegels natürlich! Ich wollte nur mal sehen, ob du aufpasst.\n@c0@"
  en: "@aDebora@bHa ha! I know, I know. The colour of the jar, of course. I was just testing you.\n@c0@"
  es: "@aStefania@b¡Ja, ja! Ya sé, ya sé. El color de la tinaja, ¿certo? Te estaba poniendo a prueba, nada más.\n@c0@"
  fr: "@aPandora@bHa haⓠ Oui, je sais, je sais. La couleur de l'amphore, bien sûr. Je te testais, c'est tout.\n@c0@"
  it: "@aViola@bBravo. Vedo che sei attento.\nDobbiamo controllare il colore dell'anfora.\n@c0@"
  ja: "@a@bデボラ「……なんてね。　わかってるわよ。\n\t見てくるのは　ツボの色でしょう？\n\tあんたを　試してみただけよ。\n@c0@"
67:
  de: "@aGriselda@bWir brauchen also nur nachzusehen, welche Farbe der Tiegel hat. Kaum zu fassen, dass Papa meint, so eine simple Aufgabe wäre zu hoch für mich!\n@c0@"
  en: "@aDebora@bSo all we need to do is see what colour the jar is.\r\nI can't believe Papa thinks I might not even manage a simple task like that.\n@c0@"
  es: "@aStefania@b¿Así que lo único que tenemos que hacer es averiguar de qué color es la tinaja?\n㈡\nNon posso credere que il mio papino crea que no soy capaz de hacer algo tan simple.\n@c0@"
  fr: "@aPandora@bAlors tout ce qu'on a à faire, c'est aller voir de quelle couleur est l'amphore.\n㈡\nJe n'en reviens pas que papa croie que je ne réussirais même pas une tâche aussi simple que ça.\n@c0@"
  it: "@aViola@bDobbiamo solo controllare di che colore è l'anfora, non è così?\n㈡\nNon riesco a credere che il mio paparino dubiti che io possa portare a termine un compito tanto semplice!\n@c0@"
  ja: "@a@bデボラ「ツボの色を　見てくるだけよね？\n\t私　パパから　この程度のことも\n\tできないって　思われているのかしら。\n@c0@"
68:
  de: "@aGriselda@bIch habe zwar oft Diener Dinge für mich erledigen lassen, aber doch nur, weil ich dazu keine Lust hatte, nicht, weil ich das nicht selbst gekonnt hätte!\n@c0@"
  en: "@aDebora@bIt's true that I often had servants do things for me. That was only because I didn't want to do them myself, though, not because I couldn't.\n@c0@"
  es: "@aStefania@bÈ vero que suelo hacer que los criados se encarguen de tutto. Ma es solo porque no quiero hacer las cosas, no porque no sea capaz.\n@c0@"
  fr: "@aPandora@bC'est vrai, je faisais souvent faire les choses aux domestiques.\n㈡\nMais c'était seulement parce que je n'avais pas\nenvie de les faire moi-même, pas parce que j'en\nétais incapable.\n@c0@"
  it: "@aViola@bForse pensa che io sia un'incapace, perché chiedo sempre agli altri di fare ciò che toccherebbe a me, ma si sbaglia di grosso!\n㈡\nNon sono un'incapace, io!\nÈ che mi piace comandare...\n@c0@"
  ja: "@a@bデボラ「自分のしたいこと以外は\n\t全部しもべに　やらせていただけなのに。\n\tできないんじゃなくて　したくないだけよ。\n@c0@"
69:
  de: "@aGriselda@bDas ging ja schnell. Tja, ich trödele eben nicht gern herum, weißt du.\n@c0@"
  en: "@aDebora@bWe made quick work of that.\nI don't like to mess around, you see.\n@c0@"
  es: "@aStefania@bHa sido cosa de visto y no visto.\r\nNon mi piace perder el tempo, ¿capisci?\n@c0@"
  fr: "@aPandora@bÇa a été vite réglé.\r\nJe n'aime pas traînasser, tu vois.\n@c0@"
  it: "@aViola@bAbbiamo finito.\nÈ andato tutto liscio come l'olio, no?\n@c0@"
  ja: "@a@bデボラ「ずいぶんあっさりと　終わったわね。\n\t私がいたんだから　当然だけど。\n@c0@"
70:
  de: "@aGriselda@bIch würde ja gern wissen, was Papa so an diesem Tiegel interessiert. Das ist mir immer noch ein Rätsel.\n@c0@"
  en: "@aDebora@bI wonder why Papa's so interested in that jar.\nI still have no idea.\n@c0@"
  es: "@aStefania@bMe pregunto por qué il mio papino tiene tanto interés en esa tinaja.\r\nNo tengo ni la menor idea.\n@c0@"
  fr: "@aPandora@bJe me demande pourquoi cette amphore intéresse tant papa. Je n'en ai toujours pas la moindre idée.\n@c0@"
  it: "@aViola@bPerò mi chiedo come mai al mio paparino interessi tanto il colore di quell'anfora...\n@c0@"
  ja: "@a@bデボラ「それにしても……\n\tパパったら　どうして　あんなツボなんかを\n\t気にしているのかしら？\n@c0@"
71:
  de: "@aGriselda@bJetzt brauchen wir das also bloß noch Papa zu erzählen, und dann können wir miteinander auf Reisen gehen.\n@c0@"
  en: "@aDebora@bNow all we have to do is report back to Papa, and then we can go off travelling together.\n@c0@"
  es: "@aStefania@bYa solo nos queda informar al mio papino y podremos irnos de viaje juntos.\n@c0@"
  fr: "@aPandora@bIl ne nous reste plus qu'à faire un compte rendu à papa et nous pourrons partir en voyage ensemble.\n@c0@"
  it: "@aViola@bOra non ci resta che tornare a casa e riferire ciò che abbiamo visto, dopodiché sarò libera di seguirti nei tuoi viaggi.\n@c0@"
  ja: "@a@bデボラ「あとは　サラボナにもどって\n\tパパに　ツボの色を　教えてあげれば\n\tいよいよ２人だけで　旅に出られるのね。\n@c0@"
72:
  de: "@aGriselda@bDas wird lustig! Ich bin noch nie mit nur einem einzigen Diener unterwegs gewesen!\n@c0@"
  en: "@aDebora@bThis is going to be so much fun! I've never travelled with just one servant before!\n@c0@"
  es: "@aStefania@b¡Será molto divertente! ¡No he viajado nunca con un solo sirviente!\n@c0@"
  fr: "@aPandora@bÇa va être tellement amusantⓠ Je n'ai encore jamais voyagé accompagnée d'un seul domestique, jusqu'à maintenant.\n@c0@"
  it: "@aViola@bVedrai, ci divertiremo tantissimo!\nAnzi, mi correggo: io mi divertirò, e tu eseguirai fedelmente ogni mio ordine.\n@c0@"
  ja: "@a@bデボラ「本当に楽しみだわ。\n\t私に忠実なしもべと　２人だけの旅なんて\n\tこれまで　したことがないから。\n@c0@"
73:
  de: "@aGriselda@bDies sind ja sozusagen unsere Flitterwochen, %a000090, darum lasse ich ausnahmsweise mal dich entscheiden, wo wir zuerst hingehen.\n@c0@"
  en: "@aDebora@bAs it's a bit like a honeymoon, %a000090, I've decided I'm going to let you choose where we go first.\n@c0@"
  es: "@aStefania@bComo es algo así come una luna de miel, %a000090, he decidido permitir que elijas dove vamos primero.\n@c0@"
  fr: "@aPandora@bComme c'est un peu notre lune de miel, %a000090, j'ai décidé de te laisser choisir l'endroit où nous irions en premier.\n@c0@"
  it: "@aViola@b%0%a000090, ho deciso di farti un regalo di nozze: lascerò che sia tu a decidere la nostra destinazione per il nostro primo viaggio insieme.\n@c0@"
  ja: "@a@bデボラ「ねえ　%a000090。\n\tいちおう　新婚旅行ってことになるわけだし\n\t今回は　あんたが行き先を決めていいわよ。\n@c0@"
74:
  de: "@aGriselda@bSiehst du! Ich kann eben auch nett und großzügig sein, wenn mir danach ist!\n@c0@"
  en: "@aDebora@bSee! I can be kind and generous when the mood\r\ntakes me.\n@c0@"
  es: "@aStefania@b¿Ves? Yo también puedo ser amabile y generosa, si estoy de humor.\n@c0@"
  fr: "@aPandora@bTu voisⓠ Je peux être douce et généreuse quand l'envie m'en prend.\n@c0@"
  it: "@aViola@bVedi?\nQuando voglio, so essere una persona molto generosa!\n㈡\nPerò cerca di non farci l'abitudine, perché non capiterà spesso che tu possa prendere qualche decisione...\n@c0@"
  ja: "@a@bデボラ「私は　思いやりのある女だから。\n\t気が向いた時だけね。\n@c0@"
75:
  de: "@aGriselda@bHm? Wo ich gern hingehen würde?\n@c0@"
  en: "@aDebora@bHm? Where would I like to go?\r\n@c0@"
  es: "@aStefania@b¿Mmm? ¿Que adónde me gustaría ir?\n@c0@"
  fr: "@aPandora@bMmmⓡ Où j'aimerais allerⓡ\n@c0@"
  it: "@aViola@bCome hai detto?\nVuoi sapere dove mi piacerebbe andare?\n@c0@"
  ja: "@a@bデボラ「え？　私の行きたいところは\n\tどこなのか…　ですって？\n@c0@"
76:
  de: "@aGriselda@bSehr gut, %a000090. Es lohnt sich immer, zuerst mich nach meinen Wünschen zu fragen.\n@c0@"
  en: "@aDebora@bVery good, %a000090. It always pays to ask what I want first.\n@c0@"
  es: "@aStefania@bMuy bien, %a000090. Siempre compensa preguntarme antes lo que mi piace.\n@c0@"
  fr: "@aPandora@bJe te félicite, %a000090. C'est toujours payant de me demander en premier ce que je veux.\n@c0@"
  it: "@aViola@bMolto bene, %a000090!\nVedo che hai imparato che puoi fare ciò che vuoi, a patto che sia io a decidere!\n@c0@"
  ja: "@a@bデボラ「その調子よ　%a000090。\n\tあんたは　そうやって\n\t私のごきげんを　とっていればいいの。\n@c0@"
77:
  de: "@aGriselda@bEs kann nicht schaden, auch mal zu Fuß unterwegs zu sein. Die Bewegung tut mir gut und erhält mir meine Schönheit.\n@c0@"
  en: "@aDebora@bIt's good to travel on foot sometimes.\r\nExercise keeps me looking beautiful for one thing.\n@c0@"
  es: "@aStefania@bA veces está bene viajar a pie.\r\nCon el ejercicio me mantengo così bella.\n@c0@"
  fr: "@aPandora@bC'est bon de voyager à pied, parfois.\r\nFaire un peu d'exercice me permet de rester belle.\n@c0@"
  it: "@aViola@bCamminare fa bene.\nStimola la circolazione sanguigna e tonifica i muscoli.\nIn altre parole, mi rende ancora più bella.\n@c0@"
  ja: "@a@bデボラ「こうして　歩く旅も　悪くないわね。\n\tつねに　美しくあるためにも\n\t運動するのは　とても大切なことだから。\n@c0@"
78:
  de: "@aGriselda@bDas war schon immer mein Traum: Die Welt frei und unbehindert bereisen zu können, ohne dass Papa mir dauernd über die Schulter guckt.\n@c0@"
  en: "@aDebora@bThis has always been my dream. To be able to\r\ntravel the world freely without Papa breathing down my neck.\n@c0@"
  es: "@aStefania@bEste ha sido siempre il mio sogno: poder viajar libre por el mundo sin tener al mio papino encima.\n@c0@"
  fr: "@aPandora@bPouvoir voyager librement de par le monde sans avoir tout le temps papa sur le dos a toujours été mon rêve.\n@c0@"
  it: "@aViola@bHo sempre sognato di viaggiare liberamente senza l'assillante controllo del mio caro paparino...\n@c0@"
  ja: "@a@bデボラ「昔からの　夢だったのよ。\n\tパパの見はり無しで\n\t自由気ままに　旅をするのが。\n@c0@"
79:
  de: "@aGriselda@bUnd dass ich auch noch meinen eigenen Leibdiener dabeihabe, ist da nur noch das Tüpfelchen auf dem i.\n@c0@"
  en: "@aDebora@bTo have my own personal slave along with me is just the icing on the cake.\n@c0@"
  es: "@aStefania@bPoder llevar al mio esclavo personal es la guinda del pastel.\n@c0@"
