0:
  de: "@aBianca@bAlso lebt deine Mutter noch, und du brauchst die Zenithia-Ausrüstung, um sie zu retten...\n@c0@"
  en: "@aBianca@bSo your mum's alive, and you need to find the Zenithian Equipment to rescue her...\n@c0@"
  es: "@aBianca@bAsí que tu madre está viva y tienes que encontrar el Equipo de Zenithia para rescatarla...\n@c0@"
  fr: "@aBianca@bAlors comme ça, ta mère est vivante et tu dois trouver l'Équipement zénithien pour la sauver...\n@c0@"
  it: "@aBianca@bTua madre è ancora viva, ma devi trovare l'Equipaggiamento Zenithiano, se vuoi salvarla...\n@c0@"
  ja: "@a@bビアンカ「%a000090のお母さんが\n\t生きていて　そして助けるために\n\t天空の防具が　必要だなんて……\n@c0@"
1:
  de: "@aBianca@bDa hast du ja einiges vor! Aber ich helfe dir, wo ich kann, damit du bald wieder mit ihr vereint bist.\n@c0@"
  en: "@aBianca@bWhat a task! I'll do whatever I can to help you be reunited with her soon, though.\n@c0@"
  es: "@aBianca@b¡Menuda misión! Pero haré todo lo que pueda para ayudarte a reunirte con ella lo antes posible, ¿sabes?\n@c0@"
  fr: "@aBianca@bQuelle missionⓠ Mais je ferai tout mon possible pour que vous soyez tous les deux réunis au plus vite.\n@c0@"
  it: "@aBianca@bDetta così, non sembra affatto facile...\nCercherò di aiutarti in tutti i modi possibili, %a000090. Conta su di me.\n@c0@"
  ja: "@a@bビアンカ「なんだか　大変な話だけど\n\t早く　お母さんに会えるように\n\t私も　協力してあげるねっ。\n@c0@"
2:
  de: "@aBianca@bDu musst so froh gewesen sein, als du hörtest, dass deine Mutter noch lebt! Bei seiner Mutter fühlt man sich so geliebt und geborgen...\n@c0@"
  en: "@aBianca@bYou must be so happy to find out your mum's still alive, after all. Mums are so warm and gentle...\n@c0@"
  es: "@aBianca@bDebes de estar muy contento de saber que tu madre está viva, después de todo. Las mamás son siempre tan dulces y cariñosas...\n@c0@"
  fr: "@aBianca@bTu dois être si heureux d'apprendre que ta mère\r\nest toujours en vie. Les mamans sont si douces et\r\nsi gentilles...\n@c0@"
  it: "@aBianca@bLa notizia che tua madre è ancora viva deve averti riempito il cuore di gioia. Vorrei che anche la mia mamma fosse ancora fra noi...\n@c0@"
  ja: "@a@bビアンカ「でも　お母さんが\n\t生きてて　良かったね。　お母さんは\n\tやさしくて　あったかくて……\n@c0@"
3:
  de: "@aBianca@bTut mir leid. Ich hab mich einen Moment lang von meinen Gefühlen hinreißen lassen.\n@c0@"
  en: "@aBianca@bSorry. I was gettin' carried away with my memories for a minute there.\n@c0@"
  es: "@aBianca@bLo siento. Me he dejado llevar por los recuerdos, ¿sabes?\n@c0@"
  fr: "@aBianca@bPardon. Pendant une seconde, je me suis laissée emporter par mes souvenirs.\n@c0@"
  it: "@aBianca@bSperiamo che la dea misericordiosa l'abbia accolta accanto a sé...\n@c0@"
  ja: "@a@bビアンカ「えへっ……　ごめんね。\n\tちょっと　思い出しちゃった。\n@c0@"
4:
  de: "@aBianca@bIch... äh... bin sogar mal allein in Steinach gewesen, kurz nach dem Angriff auf das Dorf.\n@c0@"
  en: "@aBianca@bI, er... I actually went to Whealbrook on my own once, just after the place was attacked.\n@c0@"
  es: "@aBianca@bYo, eh... De hecho estuve en Arroyofrío una vez, justo después de que lo atacasen.\n@c0@"
  fr: "@aBianca@bJe, euh... En fait, un jour, je suis allée seule\r\nà Ruycelieu, juste après l'attaque du village.\n@c0@"
  it: "@aBianca@bUna volta andai a Valcava da sola, subito dopo che il villaggio fu attaccato.\n@c0@"
  ja: "@a@bビアンカ「じつは　私…　サンタローズが\n\tおそわれたって　聞いたあと\n\tひとりで　サンタローズへ行ったのよ。\n@c0@"
5:
  de: "@aBianca@bEuer Haus war bis auf die Grundmauern nieder-\ngebrannt, aber von dir keine Spur, also wusste ich,\ndass du irgendwo noch am Leben sein musstest.\n@c0@"
  en: "@aBianca@bI saw your place burnt to the ground, but I knew you must still be alive somewhere because there\r\nwas no sign of you there.\n@c0@"
  es: "@aBianca@bVi tu casa quemada hasta los cimientos, pero sabía que debías de estar vivo en algún lado porque no había ni rastro de ti, ¿sabes?\n@c0@"
  fr: "@aBianca@bJ'ai vu ta maison réduite en cendres, mais j'ai su\r\nque tu devais toujours être en vie quelque part,\r\ncar il n'y avait aucune trace de toi sur place.\n@c0@"
  it: "@aBianca@bLa scena che si presentò ai miei occhi era orribile... L'intero paese era stato raso al suolo...\r\nMa, dentro di me, sentivo che eri vivo. Ne ero certa. \n@c0@"
  ja: "@a@bビアンカ「家が焼けて　ぼろぼろだったけど\n\tその中に　%a000090はいなかったから\n\tきっと生きてるって　思ってたの。\n@c0@"
6:
  de: "@aBianca@bAb hier kenne ich mich nicht mehr aus.\n@c0@"
  en: "@aBianca@bI dun't know much about the lay of the land beyond this point.\n@c0@"
  es: "@aBianca@bNo sé qué nos espera a partir de este punto.\n@c0@"
  fr: "@aBianca@bJe ne sais pas bien à quoi ressemble le paysage\r\nà partir d'ici.\n@c0@"
  it: "@aBianca@bNon conosco bene l'area che si estende davanti a noi...\n@c0@"
  ja: "@a@bビアンカ「ここから先は　私も\n\tどうなっているか　わからないわ。\n@c0@"
7:
  de: "@aBianca@bHier treiben sich wahrscheinlich jede Menge starker Ungeheuer herum. Wir sollten die Augen offenhalten.\n@c0@"
  en: "@aBianca@bThere's prob'ly lots of strong monsters about,\r\nso we should watch our backs.\n@c0@"
  es: "@aBianca@bProbablemente esté todo plagado de monstruos horriblesⓓ así que mejor que tengamos cuidado, ¿sabes?\n@c0@"
  fr: "@aBianca@bIl y a sans doute beaucoup de monstres qui rôdent, nous ferions bien de surveiller nos arrières.\n@c0@"
  it: "@aBianca@bPerò immagino che sia popolata da mostri forti e aggressivi.\nSarà meglio procedere con cautela...\n@c0@"
  ja: "@a@bビアンカ「強い魔物も　いるでしょうから\n\t気をつけて　行きましょうね。\n@c0@"
8:
  de: "@aBianca@bTut mir leid, wenn ich vorhin ein bisschen schweigsam war.\n@c0@"
  en: "@aBianca@bSorry if I was a bit quiet for a while back there.\n@c0@"
  es: "@aBianca@bSiento haberme quedado tan callada antes.\n@c0@"
  fr: "@aBianca@bPardon d'être restée silencieuse pendant un bon moment, quand nous étions là-bas.\n@c0@"
  it: "@aBianca@bC'è una cosa che vorrei dirti...\n@c0@"
  ja: "@a@bビアンカ「洞くつの帰り道では\n\tだまっちゃって　ごめんね。\n@c0@"
9:
  de: "@aBianca@bIch musste einfach ein bisschen schlucken bei dem Gedanken, dass du nun geradewegs auf deine Hochzeit lossteuerst.\n@c0@"
  en: "@aBianca@bI was feelin' a bit overwhelmed at the idea of you goin' off and gettin' married.\n@c0@"
  es: "@aBianca@bMe sentía un poco abrumada con la idea de que te casases.\n@c0@"
  fr: "@aBianca@bJe me suis sentie un peu dépassée à l'idée que tu allais partir pour te marier.\n@c0@"
  it: "@aBianca@bVedi, quando mi hai detto che stai per sposarti, ci sono rimasta male. Insomma, il pensiero che tu stia per prendere moglie non mi riempie certo di gioia!\n@c0@"
  ja: "@a@bビアンカ「これで　%a000090が\n\t結婚すると思ったら\n\tむねが　いっぱいになっちゃって。\n@c0@"
10:
  de: "@aBianca@bAber die Hauptsache ist, dass du dabei glücklich wirst. Schließlich warst du für mich immer so was wie ein... Bruder.\n@c0@"
  en: "@aBianca@bBut, at the end of the day, I just want you to be happy. I mean, you're like a...brother to me, after all.\n@c0@"
  es: "@aBianca@bPero, al fin y al cabo, lo único que me importa es que seas feliz. Después de todo eres como un... hermano para mí, ¿sabes?\n@c0@"
  fr: "@aBianca@bMais, au final, je souhaite juste que tu sois\r\nheureux. C'est vrai, après tout, tu es comme\r\nun... frère pour moi.\n@c0@"
  it: "@aBianca@bPoi ci ho riflettuto, e ho capito che voglio solo che tu sia felice. Tanto continueremo a essere amici, non è vero? Spero solo che tua moglie non sia gelosa di me!\n@c0@"
  ja: "@a@bビアンカ「%a000090には　幸せに\n\tなってほしいと　思ってたから。\n\tだって　弟…　みたいなものだし……。\n@c0@"
11:
  de: "@aBianca@bBisher hat du dich ja ganz wacker geschlagen beim Zähmen der Monster, die du im Schlepptau hast, was?\n@c0@"
  en: "@aBianca@bYou've done a good job tamin' those monsters who are taggin' along with you, eh?\n@c0@"
  es: "@aBianca@bHas sido muy hábil domando a esos monstruos que te siguen, ¿eh?\n@c0@"
  fr: "@aBianca@bTu as fait du très bon travail en apprivoisant les monstres qui t'accompagnent, heinⓡ\n@c0@"
  it: "@aBianca@bCerto che sei proprio bravo a domare mostri!\n@c0@"
  ja: "@a@bビアンカ「それにしても\n\t%a000090が連れてる　魔物って\n\tよく　なついているわね。\n@c0@"
12:
  de: "@aBianca@bDu warst immer schon von einer Art seltsamer Aura umgeben. Vielleicht liegt es daran, dass sie so zu dir aufschauen.\n@c0@"
  en: "@aBianca@bYou've always had a bit of a strange air about you. Maybe there's somethin' in that that makes 'em look up to you.\n@c0@"
  es: "@aBianca@bSiempre has sido un poco extraño. Quizá eso es lo que hace que te respeten, ¿sabes?\n@c0@"
  fr: "@aBianca@bTu as toujours dégagé quelque chose de spécial. Peut-être que c'est ça qui fait qu'ils te respectent.\n@c0@"
  it: "@aBianca@bNon sei mai stato una persona comune.\n㈡\nTu hai delle doti speciali, e probabilmente anche quelle creature se ne rendono conto. Dev'essere per questo motivo che ti seguono volentieri.\n@c0@"
  ja: "@a@bビアンカ「%a000090って　昔から\n\tふしぎな感じがしたけど　それを\n\t魔物たちも　感じているのかしら。\n@c0@"
13:
  de: "@aBianca@bDen Ring des Wassers aufzutreiben, das klingt viel einfacher als unsere Gespensterjagd damals, was?\n@c0@"
  en: "@aBianca@bHuntin' out that Circle of Water sounds a lot more simple than our ghost-bustin' adventure all them years ago, eh?\n@c0@"
  es: "@aBianca@bLo de buscar el Anillo de Agua parece mucho más fácil que aquella aventura nuestra de cazafantasmas de hace años, ¿eh?\n@c0@"
  fr: "@aBianca@bCette quête de l'Anneau de l'Eau semble plus facile que la chasse aux fantômes dans laquelle nous nous étions lancés il y a bien longtemps, heinⓡ\n@c0@"
  it: "@aBianca@bTrovare l'Anello d'Acqua dovrebbe essere un'impresa meno difficile che affrontare fantasmi, non credi? Eh eh eh! Che esperienza indimenticabile!\n@c0@"
  ja: "@a@bビアンカ「水のリングを　さがすだけなら\n\tレヌール城のお化け退治より\n\tずっと　簡単よね。\n@c0@"
14:
  de: "@aBianca@bMal ehrlich, ich war damals so bange, dass ich den Tränen nahe war. Ich habe eine Riesenangst vor Gespenstern und vor der Dunkelheit.\n@c0@"
  en: "@aBianca@bTo tell the truth, I was so scared that time that I thought I'd burst into tears any minute. I'm petrified of ghosts and the dark.\n@c0@"
  es: "@aBianca@bLa verdad es que tenía tanto miedo aquella vez que pensaba que me iba echar a llorar en cualquier momento.\n㈡\nLos fantasmas y la oscuridad me aterrorizan, ¿sabes?\n@c0@"
  fr: "@aBianca@bÀ dire vrai, j'étais si terrifiée à l'époque que je me sentais sur le point de fondre en larmes à tout moment. J'ai une peur bleue du noir et des fantômes.\n@c0@"
  it: "@aBianca@bAll'epoca ero troppo orgogliosa per ammetterlo, ma avevo una fifa blu! E l'atmosfera al Palazzo delle Ombre era così sinistra...!\n@c0@"
  ja: "@a@bビアンカ「……じつは　あの時\n\tこわくて　泣きそうだったのよ。\n\t私　暗いところもお化けも苦手なの。\n@c0@"
15:
  de: "@aBianca@bDu bist jetzt viel kräftiger als damals, als wir uns zum letzten Mal gesehen haben. Jetzt hab ich dir nichts mehr voraus.\n@c0@"
  en: "@aBianca@bYou're a lot stronger now than the last time we met. I en't a patch on you no more.\n@c0@"
  es: "@aBianca@bEres mucho más fuerte que la última vez que nos vimos.\r\nYa no me puedo comparar contigo.\n@c0@"
  fr: "@aBianca@bTu es bien plus fort aujourd'hui que lors de notre dernière rencontre. Je ne t'arrive plus à la cheville, désormais.\n@c0@"
  it: "@aBianca@bSai una cosa?\nCon gli anni non sei cambiato affatto.\n@c0@"
  ja: "@a@bビアンカ「%a000090ったら　ずいぶん\n\tチカラをつけたのね。\n\tもう　私なんて　かなわないわ。\n@c0@"
16:
  de: "@aBianca@bDu hast dir jedenfalls ein paar ganz nette Muckis zugelegt. Die Ähnlichkeit zwischen dir und Ludwig ist nicht mehr zu übersehen.\n@c0@"
  en: "@aBianca@bYou've really filled out in the muscles department, that's for sure. You look quite a lot like Pankraz nowadays.\n@c0@"
  es: "@aBianca@bDesde luego, hay que ver la de músculos que tienes ahora. Te pareces mucho a Teudis, ¿sabes?\n@c0@"
  fr: "@aBianca@bTu as vraiment pris du muscle, il n'y a rien à dire.\r\nTu ressembles beaucoup à Petros maintenant.\n@c0@"
  it: "@aBianca@bCioè, sei cresciuto fisicamente, sei diventato grande e forte... Però il coraggio e il senso di giustizia che avevi quand'eri bambino sono rimasti inalterati.\n@c0@"
  ja: "@a@bビアンカ「身体も　がっしりしてきて\n\tなんだか　パパスさんに\n\t似てきたみたい。\n@c0@"
17:
  de: "@aBianca@bWie schade, dass du und %a001210 getrennt wurdet. Wie es ihm wohl ergangen ist?\n@c0@"
  en: "@aBianca@bIt's a shame you ended up gettin' separated from %a001210. I wonder how he's gettin' on.\n@c0@"
  es: "@aBianca@bQué lástima que tuvieras que separarte de %a001210. Me pregunto cómo le irá, ¿sabes?\n@c0@"
  fr: "@aBianca@bC'est vraiment dommage que vous ayez fini par être séparés, %a001210 et toi. Je me demande ce qu'il devient.\n@c0@"
  it: "@aBianca@bChissà come sta %a001210...\nÈ un vero peccato che voi due vi siate persi di vista... Ma non è certo successo per colpa tua, eh!\n@c0@"
  ja: "@a@bビアンカ「そういえば　%a001210ちゃんは\n\t生き別れに　なったんだっけ……。\n\t今ごろ　どうしているんだろうね。\n@c0@"
18:
  de: "@aBianca@bOffenbar haben wir unsere Aufgabe, den Ring des Wassers zu finden, erledigt, was? Das ging ja flott!\n@c0@"
  en: "@aBianca@bLooks like we're done with our adventures to\r\nfind the Circle of Water, eh? That seemed to go\r\nby in a flash.\n@c0@"
  es: "@aBianca@bParece que nuestras aventuras en busca del Anillo de Agua han llegado a su fin, ¿eh? Ha pasado todo en un suspiro.\n@c0@"
  fr: "@aBianca@bNous en avons fini avec notre quête de l'Anneau\r\nde l'Eau, on dirait. Tout s'est déroulé si vite...\n@c0@"
  it: "@aBianca@bE così la nostra ricerca dell'Anello d'Acqua si è conclusa con un successo.\nE non ci abbiamo nemmeno messo molto a trovarlo!\n@c0@"
  ja: "@a@bビアンカ「水のリングさがしの　旅も\n\t終わってみれば\n\tあっという間だったわね。\n@c0@"
19:
  de: "@aBianca@bJetzt sollten wir mit dem Ring möglichst schnell zu deiner Braut sausen, was?\n@c0@"
  en: "@aBianca@bI s'pose we'd better get that ring to its intended, eh?\n@c0@"
  es: "@aBianca@bSerá mejor que le hagamos llegar el anillo a la persona apropiada, ¿eh?\n@c0@"
  fr: "@aBianca@bOn ferait bien d'aller remettre cet anneau à son destinataire, nonⓡ\n@c0@"
  it: "@aBianca@bCredo che dovresti portare l'anello alla persona a cui vorrai metterlo al dito... Credo di essere stata sufficientemente chiara, no? Eh eh eh!\n@c0@"
  ja: "@a@bビアンカ「さあ　早く　その指輪を\n\t届けにいきましょうよ。\n@c0@"
20:
  de: "@aBianca@bWenn Nera beschließt, dass sie dich lieber doch nicht haben will, dann nehm' ich dich.\n@c0@"
  en: "@aBianca@bIf Nera decides she dun't want you, then I'll put my hand up and claim you instead.\n@c0@"
  es: "@aBianca@bSi Nera decide que no te quiere, entonces yo me quedaré contigo.\n@c0@"
  fr: "@aBianca@bSi Nera décide finalement qu'elle ne veut pas de toi, je postulerai à sa place.\n@c0@"
  it: "@aBianca@bSe Nera non volesse sposarti, chiederei ufficialmente la tua mano.\n@c0@"
  ja: "@a@bビアンカ「もし　フローラさんのほうで\n\t%a000090のことを　断ってきたら\n\t私が%a000090のこと　もらってあげる。\n@c0@"
21:
  de: "@aBianca@bHa ha! War doch bloß 'n Witz! Du hättest mal dein Gesicht sehen sollen!\n@c0@"
  en: "@aBianca@bHa ha ha! I was only jokin'!\r\nYou should see your face!\n@c0@"
  es: "@aBianca@b¡Ja, ja, ja! ¡Era broma!\r\n¡Deberías haber visto tu cara!\n@c0@"
  fr: "@aBianca@bHa ha haⓠ C'était une blague, détends-toiⓠ\nSi tu voyais ta têteⓠ\n@c0@"
  it: "@aBianca@bTontolone! Stavo scherzando! Ah ah ah!\r\nAvresti dovuto vedere che faccia hai fatto quando ho detto che ti avrei sposato io!\n@c0@"
  ja: "@a@bビアンカ「なんて　じょうだんよ！\n\tうふふ。\n@c0@"
22:
  de: "@aBianca@bDiese Monster, die du da im Schlepptau hast, sind ziemlich stark, was? Da hättest du mich wahrscheinlich gar nicht gebraucht.\n@c0@"
  en: "@aBianca@bThem monsters you got trailin' about after you\r\nare pretty strong, eh? You probably didn't really need me.\n@c0@"
  es: "@aBianca@bEsos monstruos que te siguen a todos lados son bastante fuertes, ¿eh? En realidad, no creo que me necesites.\n@c0@"
  fr: "@aBianca@bLes monstres que tu trimballes avec toi sont assez costauds, nonⓡ Tu n'avais sans doute pas besoin\nde moi.\n@c0@"
  it: "@aBianca@bI mostri che viaggiano con te sono forti e bene addestrati. Credo che avresti potuto fare a meno del mio aiuto...\n@c0@"
  ja: "@a@bビアンカ「それにしても　%a000090の\n\t連れてる　魔物たちって強いのね。\n\t私　あまり　役に立てなかったかも。\n@c0@"
23:
  de: "@aBianca@bWenn du erst verheiratet bist, wird es mit unseren gemeinsamen Reisen wohl vorbei sein. Das würde deiner Frau wohl kaum gefallen.\n@c0@"
  en: "@aBianca@bI suppose we won't be able to travel together like this once you're married. I doubt your wife'd be too happy if we did.\n@c0@"
  es: "@aBianca@bSupongo que después de que te hayas casado ya no podremos volver a viajar juntos. No creo que a tu mujer le hiciese mucha gracia, ¿me entiendes?\n@c0@"
  fr: "@aBianca@bJ'imagine que nous ne pourrons plus voyager ensemble comme ça, une fois que tu seras marié.\r\nÇa m'étonnerait que ta femme apprécie.\n@c0@"
  it: "@aBianca@bNon credo che potremo più viaggiare insieme come stiamo facendo in questo periodo, una volta che sarai sposato. Tua moglie potrebbe ingelosirsi...\n@c0@"
  ja: "@a@bビアンカ「%a000090が　結婚しちゃったら\n\tもう　いっしょに旅はできないでしょ？\n\t奥さんに　悪いし……。\n@c0@"
24:
  de: "@aBianca@bDarum wollte ich ja unbedingt mit dir mitkommen, weißt du. Ich hoffe, ich hab mich nicht allzu penetrant aufgedrängt.\n@c0@"
  en: "@aBianca@bThat's why I insisted on comin' with you, see.\r\nSorry if I was a bit pushy.\n@c0@"
  es: "@aBianca@bPor eso he insistido tanto en acompañarte.\r\nPerdona por haberte presionado tanto.\n@c0@"
  fr: "@aBianca@bC'est pour ça que j'ai insisté pour t'accompagner,\r\nen fait. Désolée si je t'ai un peu forcé la main.\n@c0@"
  it: "@aBianca@bEcco perché questa volta ho insistito tanto per venire con te. Con ogni probabilità, questa sarà la nostra ultima avventura insieme...\n@c0@"
  ja: "@a@bビアンカ「だから　ごういんに\n\tついてきちゃったの。　ごめんね。\n@c0@"
25:
  de: "@aBianca@bWenn wir so wie jetzt einträchtig durch die Nacht wandern, muss ich immer an unsere Gespensterjagd damals denken.\n@c0@"
  en: "@aBianca@bWalkin' about together of a night like this reminds me of our ghost-bustin' adventure.\n@c0@"
  es: "@aBianca@bCaminar juntos en una noche así me recuerda a nuestra aventura de cazafantasmas.\n@c0@"
  fr: "@aBianca@bMarcher ensemble de nuit, comme ça, me rappelle notre chasse aux fantômes.\n@c0@"
  it: "@aBianca@bNon è la prima volta che ce ne andiamo in giro di notte, eh? Ricordi? Lo facemmo anche quando andammo a caccia di fantasmi...\n@c0@"
  ja: "@a@bビアンカ「こうして　夜　いっしょに\n\t歩いていると　お化け退治のことを\n\t思い出しちゃうね。\n@c0@"
26:
