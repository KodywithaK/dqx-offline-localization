0:
  de: "@aGriselda@bIch könnte an so einem Ort niemals schlafen. Aber das weißt du sicher schon.\n@c0@"
  en: "@aDebora@bI'd never be able to sleep in a place like this.\nYou probably knew that already, though.\n@c0@"
  es: "@aStefania@bNunca podría dormir en un lugar cosí. Aunque probabilemente ya lo supieras.\n@c0@"
  fr: "@aPandora@bJe n'arriverais jamais à dormir dans un endroit pareil. Mais ça, tu le savais déjà.\n@c0@"
  it: "@aViola@bChe rumore insopportabile...!\nNon riuscirei mai a dormire in un posto del genere!\n@c0@"
  ja: "@a@bデボラ「私だったら　こんな所で寝るのは\n\t絶対に　イヤよ。　言わなくても\n\tわかっているでしょうけど。\n@c0@"
1:
  de: "@aGriselda@bAh! Dieser Lärm geht mir wirklich auf die Nerven. Wir gehen, %a000090. Sofort!\n@c0@"
  en: "@aDebora@bArgh! That noise really gets on my nerves.\nWe're leaving, %a000090. Now!\n@c0@"
  es: "@aStefania@b¡Argh! Ese ruido me pone de los nervios.\n¡Nos vamos, %a000090, andiamo!\n@c0@"
  fr: "@aPandora@bGrrrⓠ Ce bruit me tape sur les nerfs. On s'en va, %a000090. Tout de suiteⓠ \n@c0@"
  it: "@aViola@b%0%a000090, ti giuro che se ti azzarderai a russare in quel modo anche una sola volta ti farò ingoiare il cuscino. Non sto scherzando.\n@c0@"
  ja: "@a@bデボラ「うっ…　イヤな音……\n\t私　こういう音って　ダメなのよ。\n\t急いでここを出るわよ　%a000090。\n@c0@"
2:
  de: "@aGriselda@bPrinz Harry ist ein guter Freund meines Leibdieners. Ha! Wie schön, etwas zu haben, woran man sich so diebisch freuen kann!\n@c0@"
  en: "@aDebora@bPrince Harry is a good friend of my servant's. Ha! It's nice to have something to gloat over like that.\n@c0@"
  es: "@aStefania@b¡El príncipe Froilán es amico de il mio servitore! ¡Ja! Está bien poder presumir de algo così.\n@c0@"
  fr: "@aPandora@bLe prince Harry est un bon ami de mon domestique. Haⓠ C'est agréable de pouvoir jubiler avec quelque chose comme ça.\n@c0@"
  it: "@aViola@bIl principe Robert è un mio caro amico..\nBeh, in realtà è amico tuo, ma non mi pare il caso di sottilizzare, no?\n@c0@"
  ja: "@a@bデボラ「その　ヘンリー王子が\n\t私のしもべの　友達なのよね。\n\t我ながら　鼻が高いわ。\n@c0@"
3:
  de: "@aGriselda@bIch trinke immer viel Wasser, wenn ich ein Bad genommen habe. Man sagt ja, das bewahrt die Schönheit.\n@c0@"
  en: "@aDebora@bI always drink plenty of water after I've had a bath. They say it's good for keeping you\r\nlooking beautiful.\n@c0@"
  es: "@aStefania@bSiempre bebo mucha acqua tras un bagno. Dicen que te mantiene bella.\n@c0@"
  fr: "@aPandora@bAprès avoir pris mon bain, je bois toujours\r\nbeaucoup d'eau. Il paraît que c'est bon pour\r\nrester belle.\n@c0@"
  it: "@aViola@bDopo il bagno bevo sempre due o tre bicchieri di latte per reidratare la pelle.\nLatte di mucca, però, non d'orco!\n@c0@"
  ja: "@a@bデボラ「私は　おフロあがりに\n\t飲むのは　水って　決めているのよ。\n\t美しさをたもつのに　いいって話だから。\n@c0@"
4:
  de: "@aGriselda@bEr will aus diesem Getränk wirklich ein Geheimnis machen, was? Dann sollte man aber doch meinen, dass er mittlerweile etwas besser im Lügen wäre.\n@c0@"
  en: "@aDebora@bHe really wants to keep that drink a secret, doesn't he? You'd think he'd have honed his lying technique a bit more, though.\n@c0@"
  es: "@aStefania@bVeramente, quiere mantener esa bebida en secreto, ¿eh? Aunque debería haber aprendido a mentire mejor.\n@c0@"
  fr: "@aPandora@bIl veut vraiment garder le secret de cette boisson, heinⓡ Mais il devrait peut-être travailler un peu sa technique de mensonge.\n@c0@"
  it: "@aViola@bNon ci siamo.\nDeve impegnarsi un po' di più, se vuole far credere che la Delizia di Milleventi è una bevanda disgustosa.\n@c0@"
  ja: "@a@bデボラ「こんなに　バレバレなウソを\n\tついてまで　お酒を守りたいのね……。\n\tもう少し　うまくやればいいのに。\n@c0@"
5:
  de: "@aGriselda@bHier war der Ring des Feuers verborgen, oder? In Anbetracht des Namens ein recht passender Ort.\n@c0@"
  en: "@aDebora@bThis is where the Circle of Fire was hidden, isn't it? It's a pretty apt location for it, given its name.\n@c0@"
  es: "@aStefania@bAquí es donde estaba oculto el Anillo de Fuego, ¿no? Veramente, es un buen lugar, dado su nombre.\n@c0@"
  fr: "@aPandora@bC'est ici qu'était caché l'Anneau de Feu, n'est-ce pasⓡ Une cachette bien adaptée, vu le nom de l'objet.\n@c0@"
  it: "@aViola@bL'Anello di Fuoco era nascosto qui, non è vero?\nDirei che non poteva trovarsi in un luogo più adatto, dato il suo nome...\n@c0@"
  ja: "@a@bデボラ「ここに　あの　炎のリングが\n\t眠っていたのね。\n\t名前に　ふさわしい場所ではあるわね。\n@c0@"
6:
  de: "@aGriselda@bIst das heiß hier drin! Aber was will man von einem Vulkan auch anderes erwarten.\n@c0@"
  en: "@aDebora@bIt's so hot in here! I suppose that's to be expected of a volcano.\n@c0@"
  es: "@aStefania@b¡Qué calor! Aunque supongo que era de esperar en un volcano.\n@c0@"
  fr: "@aPandora@bIl fait tellement chaud, iciⓠ Quoique, dans un volcan, difficile de s'attendre à autre chose.\n@c0@"
  it: "@aViola@bChe caldo che fa!\nMa perché mi stupisco?!\nDopotutto questo è un vulcano, mica un ghiacciaio!\n@c0@"
  ja: "@a@bデボラ「それにしても　熱いわね。\n\t火山なんだから　当たり前だけど。\n@c0@"
7:
  de: "@aGriselda@bLange halte ich's hier drin nicht mehr aus. Es ist zwar gut, ein wenig zu schwitzen, weil es die Poren reinigt, aber es gibt Grenzen.\n@c0@"
  en: "@aDebora@bI'll have to get out of here soon. It's good to sweat a little to clean out your pores, but there are limits.\n@c0@"
  es: "@aStefania@bTendré que salir pronto de aquí. Está bien sudare para limpiar los poros, ma...\n@c0@"
  fr: "@aPandora@bIl va bientôt falloir que je sorte d'ici. C'est bien de transpirer un peu pour nettoyer les pores de la peau, mais il y a des limites.\n@c0@"
  it: "@aViola@bVoglio andarmene da qui! Fa troppo caldo!\nSudare un po' fa bene perché i pori della pelle si ripuliscono dalle impurità, ma qui si esagera!\n@c0@"
  ja: "@a@bデボラ「そろそろ出るわよ　%a000090。\n\t汗をかくのは　身体にいいけど\n\tやりすぎるのも　よくないのよ。\n@c0@"
8:
  de: "@aGriselda@bWer hätte gedacht, dass hinter dem Wasserfall eine Höhle verborgen sein würde? Und... für eine Höhle ist es eigentlich ganz hübsch hier.\n@c0@"
  en: "@aDebora@bWho'd have thought there'd be a cave like this hidden behind the waterfall? And...I suppose it's quite pretty as caves go.\n@c0@"
  es: "@aStefania@b¿Quién hubiera dicho que había una grotta occulta tras la catarata? Y... es bastante bella, para ser una grotta.\n@c0@"
  fr: "@aPandora@bQui aurait cru qu'une caverne pareille se cachait derrière la chute d'eauⓡ Et... elle est plutôt jolie, pour une caverne.\n@c0@"
  it: "@aViola@bChi avrebbe mai detto che c'era una caverna dietro la cascata?\nEd è anche una gran bella grotta!\n@c0@"
  ja: "@a@bデボラ「面白いわね　滝の裏がわに\n\tこんな洞くつがあるなんて。\n\tそれに…　とてもキレイだわ。\n@c0@"
9:
  de: "@aGriselda@bHier war der Ring des Wassers, nicht? Es ist hübsch hier, aber etwas kühl. Vielleicht wegen des Wassers.\n@c0@"
  en: "@aDebora@bThis is where the Circle of Water was, isn't it?\r\nIt's quite a pretty place, but it's a bit on the chilly side. Maybe because of the water.\n@c0@"
  es: "@aStefania@bAquí estaba el Anillo de Agua, ¿no?\nEs un lugar molto bello, ma algo fríoⓓ quizá sea por el acqua.\n@c0@"
  fr: "@aPandora@bC'est ici que se trouvait l'Anneau de l'Eau, n'est-ce pasⓡ C'est plutôt joli, comme endroit, mais il y fait\nun peu frisquet. Peut-être à cause de l'eau.\n@c0@"
  it: "@aViola@bÈ qui che era custodito l'Anello d'Acqua, vero?\r\nNon c'è male come posto. Peccato sia un po' troppo freddo e umido per i miei gusti.\n@c0@"
  ja: "@a@bデボラ「ここに　水のリングが　あったのね。\n\t……キレイな場所だけれど\n\t水が多いせいか　少し寒いわね。\n@c0@"
10:
  de: "@aGriselda@bKommst du mal eine Minute hierher, %a000090?\n@c0@"
  en: "@aDebora@bWill you come here a minute, %a000090?\n@c0@"
  es: "@aStefania@b¿Vienes un momento, %a000090?\n@c0@"
  fr: "@aPandora@bTu peux t'approcher une minute, %a000090ⓡ\n@c0@"
  it: "@aViola@bPuoi venire un attimo qui, %a000090?\n@c0@"
  ja: "@a@bデボラ「ねえ　%a000090。\n\tちょっと　こっちへ　いらっしゃいよ。\n@c0@"
11:
  de: "@aGriselda@bAh, viel besser! Jetzt ist mir gar nicht mehr kalt. Es kann nicht schaden, einen Moment lang etwas menschliche Wärme zu teilen...\n@c0@"
  en: "@aDebora@bAh, much better! Now I'm not cold at all.\nIt can't hurt to share a bit of body heat for a while...\n@c0@"
  es: "@aStefania@b¡Ah, va bene! Ya no tengo frío.\nNo está mal compartire algo de calor corporal...\n@c0@"
  fr: "@aPandora@bAh, c'est beaucoup mieuxⓠ J'ai moins froid, maintenant. Ça ne fait pas de mal de partager un\npeu de chaleur corporelle pendant un petit moment...\n@c0@"
  it: "@aViola@bAh, che bel tepore! Ora non ho più freddo.\nAvevo bisogno del tuo calore corporeo per scaldarmi un po'!\n@c0@"
  ja: "@a@bデボラ「ふふっ　これなら　寒くないわね。\n\tせっかくだし　もう少しだけ……\n\tこうしていましょうか　%a000090。\n@c0@"
12:
  de: "@aGriselda@bDu bist doch wohl nicht schüchtern?\nSchon gut. Ich komme zu dir.\n@c0@"
  en: "@aDebora@bSurely you're not shy!?\nNever mind. I'll go to you.\n@c0@"
  es: "@aStefania@bNo serás tímido, ¿no?\nDa igual, ya voy yo.\n@c0@"
  fr: "@aPandora@bTu ne fais pas ton timide, quand mêmeⓡⓐ Peu importe. C'est moi qui vais m'approcher.\n@c0@"
  it: "@aViola@bNo?! E perché mai?!\nGuarda che non ti mangio mica!\nD'accordo, timidone. Verrò io da te...\n@c0@"
  ja: "@a@bデボラ「もう　何を照れているのよ。\n\tいいわよ　私がそっちへ行くから。\n@c0@"
13:
  de: "@aGriselda@bNa? Ist doch viel wärmer so, findest du nicht? Es kann nicht schaden, einen Moment lang etwas menschliche Wärme zu teilen...\n@c0@"
  en: "@aDebora@bWell? Much warmer, don't you think?\nIt can't hurt to share a bit of body heat for a while...\n@c0@"
  es: "@aStefania@b¿Va bene? Mucho más calentito, ¿eh? No está mal compartire algo de calor corporal...\n@c0@"
  fr: "@aPandora@bAlorsⓡ Il fait meilleur, tu ne trouves pasⓡ Ça ne fait pas de mal de partager un peu de chaleur corporelle pendant un petit moment...\n@c0@"
  it: "@aViola@bNon ti senti meglio adesso?\nVedi? Non fa più freddo.\nI nostri corpi si stanno scaldando a vicenda!\n@c0@"
  ja: "@a@bデボラ「どう？　あたたかいでしょ？\n\tせっかくだし　もう少しだけ……\n\tこうしていましょう　%a000090。\n@c0@"
14:
  de: "@aGriselda@bDann glauben sie, nur eine Dienerin der Göttin kann diese Türen öffnen?\n@c0@"
  en: "@aDebora@bSo they reckon the only one who can open these doors is a maiden with the blessing of the Goddess?\n@c0@"
  es: "@aStefania@bSembra que estas puertas solo puede abrirlas una doncella bendecida por la Diosa...\n@c0@"
  fr: "@aPandora@bAlors, d'après ce qu'on raconte, la seule personne capable d'ouvrir ces portes est une jeune fille bénie par la Déesseⓡ\n@c0@"
  it: "@aViola@bÈ vero che solo una tenera fanciulla il cui cuore è colmo d'amore per la dea può aprire la porta della torre...?\n@c0@"
  ja: "@a@bデボラ「この塔の入り口は\n\t神につかえる　乙女にしか\n\t開けられない……　ですって？\n@c0@"
15:
  de: "@aGriselda@bDann musst du wohl beim letzten Mal, als du hier warst, irgendein Mädel dafür gefunden haben. Das musst du mir irgendwann mal in Ruhe erzählen.\n@c0@"
  en: "@aDebora@bThat means you must've found yourself a maiden if you've been in there before. You'll have to tell me about that one day.\n@c0@"
  es: "@aStefania@bEntonces, si ya has estado es que has conocido a una. Un giorno tienes que hablarme de eso.\n@c0@"
  fr: "@aPandora@bÇa veut dire que tu as dû trouver une jeune fille pour t'accompagner, si tu es déjà entré ici.\r\nIl faudra que tu me racontes ça, à l'occasion.\n@c0@"
  it: "@aViola@bAllora, se già sei stato in questo posto, vuol dire che in passato hai conosciuto una tenera fanciulla il cui cuore era gonfio d'amore!\n㈡\nCom'è che non so niente di questa storia, eh?!\nE chi era questa tenera fanciulla?!\nAvanti, %a000090... Sputa il rospo! \n@c0@"
  ja: "@a@bデボラ「その塔に入ったということは\n\t乙女に　開けてもらったってこと……？\n\tあとで　その話　聞かせてもらうわよ。\n@c0@"
16:
  de: "@aGriselda@bDas ist ein geheimnisvoller Ort. Nera wäre ganz verrückt danach. Ich? Och, ich lass' mich von so was nicht so leicht beeindrucken.\n@c0@"
  en: "@aDebora@bThis is a mysterious place. Nera would be thrilled to see something like this. Me? I'm not that bothered.\n@c0@"
  es: "@aStefania@bEs un lugar veramente misterioso. A Nera le encantaría ver algo así.\n¿A mí? A mí me da igual.\n@c0@"
  fr: "@aPandora@bC'est un endroit mystérieux. Nera serait ravie de voir un endroit pareil. Moiⓡ Non, ça ne me fait pas plus d'effet que ça.\n@c0@"
  it: "@aViola@bChe luogo misterioso...\nNera adora i posti come questo, sai?\n㈡\nA me, invece, non piacciono affatto.\nPreferisco le grandi città piene di bei negozi.\n@c0@"
  ja: "@a@bデボラ「なんだか　神秘的な場所ね。\n\tフローラがいたら　喜んだでしょうね。\n\t私？　まあ　イヤってほどではないわ。\n@c0@"
17:
  de: "@aGriselda@bWarum man es wohl nachts nicht benutzen darf? Glaubst du, auf der anderen Seite ist es zu gefährlich oder so?\n@c0@"
  en: "@aDebora@bI wonder why you can't pass through at night.\r\nDo you think the place on the other side is too dangerous or something?\n@c0@"
  es: "@aStefania@b¿Por qué no se puede pasar de notte?\r\n¿Crees que lo que hay al otro lado es troppo pericoloso?\n@c0@"
  fr: "@aPandora@bJe me demande pourquoi on n'a pas le droit de passer de nuit. Tu crois que l'endroit qui se trouve de l'autre côté est trop dangereuxⓡ\n@c0@"
  it: "@aViola@bChissà come mai non si può passare di notte...\nForse è troppo pericoloso affrontare il viaggio quand'è buio?\n@c0@"
  ja: "@a@bデボラ「どうして　この旅の扉は\n\t夜に通っては　いけないのかしら？\n\t問題のある場所に　つながっているとか？\n@c0@"
18:
  de: "@aGriselda@bIch glaube, ich habe schon von diesem Ort gehört. Irgendwo soll es ein Schloss geben, das ziemlich verfallen sein soll? Ob es das wohl ist?\n@c0@"
  en: "@aDebora@bI think I've heard about this place. About there being a castle somewhere in the world that's almost falling to pieces. I wonder if it's here.\n@c0@"
  es: "@aStefania@bCredo que he oído hablar de este lugar, dicen que hay un castello que se está cayendo a trozos. ¿Estará aquí?\n@c0@"
  fr: "@aPandora@bJe crois avoir déjà entendu parler de cet endroit. Un château, quelque part dans le monde, qui tomberait presque en ruines. Je me demande si c'est ici.\n@c0@"
  it: "@aViola@bUna volta un amico mi ha parlato di un castello disabitato che stava andando in rovina...\nSecondo me si riferiva proprio a questo posto...\n@c0@"
  ja: "@a@bデボラ「前に　聞いたことがあるわ。\n\t世界のどこかに　ほろぼされた城が\n\tあるって。　それが　ここなのかしら。\n@c0@"
19:
  de: "@aGriselda@bEin Schloss ohne Menschen hat eine komische Atmosphäre. Nicht, dass ich etwa Angst hätte oder so!\n@c0@"
  en: "@aDebora@bA castle with no people in it feels really strange.\r\nI don't mean I'm scared or anything.\n@c0@"
  es: "@aStefania@bUn castello vacío parece veramente raro.\r\nLo que no significa que tenga miedo, ¿eh?\n@c0@"
  fr: "@aPandora@bUn château sans aucun habitant, ça donne vraiment une impression étrange. Mais ça ne veut pas dire que j'ai peur, hein.\n@c0@"
  it: "@aViola@bI castelli disabitati mi mettono a disagio.\nNon che abbia paura, intendiamoci!\nComunque... Ehm...\n㈡\nEcco, %a000090...\nTi dispiacerebbe andare avanti tu?\nIo, ehm... Io ti coprirò le spalle...\n@c0@"
  ja: "@a@bデボラ「人のいない　お城って\n\tなんだか　不気味ね。\n\t別に　怖いわけじゃないわよ。\n@c0@"
20:
  de: "@aGriselda@bBah! Ist das staubig hier drin! Und etwas kühl ist es auch, oder bilde ich mir das ein?\n@c0@"
  en: "@aDebora@bUrgh! It's so dusty in here. There's a bit of a chill in the air too, unless I'm imagining it.\n@c0@"
  es: "@aStefania@b¡Urgh! Ma cuánto polvo. Y también hace frío, salvo que sean imaginaciones mías.\n@c0@"
  fr: "@aPandora@bBeurkⓠ C'est vraiment poussiéreux, là-dedans.\nEt puis l'air y est un peu glacial, sauf si je me fais des idées.\n@c0@"
  it: "@aViola@bCoff! Caspita, quanta polvere! Coff!\nMa da quanto tempo non fanno pulizia qui dentro? Coff! Coff!\n@c0@"
  ja: "@a@bデボラ「うっ…　ずいぶん　ホコリっぽいわ。\n\tおまけに　ちょっと　寒気がするけど\n\tそれは　気のせいよね。\n@c0@"
21:
  de: "@aGriselda@bAlso bist du, als du klein warst, schon einmal hier gewesen?\n@c0@"
  en: "@aDebora@bSo you came here when you were little?\n@c0@"
  es: "@aStefania@bEntonces, ¿viniste qui siendo un bambino?\n@c0@"
  fr: "@aPandora@bAlors tu es venu ici quand tu étais petitⓡ\n@c0@"
  it: "@aViola@bE così esplorasti questo posto quand'eri solo un bambino, %a000090...\n@c0@"
  ja: "@a@bデボラ「ふうん　子供の頃に\n\tこのお城に　来たことがあるのね。\n@c0@"
22:
  de: "@aGriselda@bHa ha! Du warst hier auf Gespensterjagd? Das ist ja lustig!\n@c0@"
  en: "@aDebora@bHa ha! You came ⓗghost bustingⓘ?\nVery funny!\n@c0@"
  es: "@aStefania@b¡Ja ja! ¡A cazar fantasmas! ¡Qué divertente!\n@c0@"
  fr: "@aPandora@bHa haⓠ Tu es venu à la ⓥchasse aux fantômesⓦⓡ C'est très drôleⓠ\n@c0@"
  it: "@aViola@bChe cosa? Venisti qui a caccia di fantasmi?!\nAh ah ah! Hai sempre avuto una fantasia molto fervida, maritino mio!\n@c0@"
  ja: "@a@bデボラ「えっ　お化け退治　ですって？\n\tあんたって　あいかわらず\n\t面白いじょうだんを　言うのね。\n@c0@"
23:
  de: "@aGriselda@bDu warst entweder sehr tapfer oder sehr leichtsinnig, dass du so ein gruseliges Schloss erkunden wolltest. Und dann auch noch nachts!\n@c0@"
  en: "@aDebora@bYou must've been either brave or stupid, coming to explore such a creepy castle. Especially at night!\n@c0@"
  es: "@aStefania@bDebías de ser molto valeinte o molto inconsciente para venir a explorar un castello así. ¡Y de notte!\n@c0@"
  fr: "@aPandora@bIl fallait vraiment que tu sois courageux ou stupide pour venir explorer un château qui donne la chair\nde poule comme ça. Surtout de nuitⓠ\n@c0@"
  it: "@aViola@bCerto che fosti molto coraggioso a venire qui da bambino, %a000090. Di notte, per di più!\nO forse fosti semplicemente un piccolo incosciente...\n@c0@"
  ja: "@a@bデボラ「こんな　不気味なお城に\n\tしかも　夜に　遊びに来ていただなんて\n\tあんたって　本当に　怖いもの知らずね。\n@c0@"
24:
  de: "@aGriselda@bWas? Wo die Betten stehen, waren damals Särge? Und Skelette...?\n@c0@"
  en: "@aDebora@bWhat? There used to be coffins where those beds are? And skeletons...?\n@c0@"
  es: "@aStefania@b¿Qué? ¿Que había ataúdes donde están esas camas? ¿Y esqueletos?\n@c0@"
  fr: "@aPandora@bQuoiⓡⓐ Il y avait des cercueils à la place de ces litsⓡ Et des squelettesⓡ...\n@c0@"
  it: "@aViola@bChe hai detto? Quando venisti qui tanti anni fa c'erano delle bare dove ora ci sono i letti?\nE c'erano anche degli scheletri?!\n@c0@"
  ja: "@a@bデボラ「えっ？　昔は\n\tその　ベッドのところに　カンオケが？\n\tおまけに　ガイコツが　ゾロゾロと……？\n@c0@"
25:
