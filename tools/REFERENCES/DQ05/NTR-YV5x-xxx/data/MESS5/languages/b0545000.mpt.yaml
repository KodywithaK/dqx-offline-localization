0:
  de: "@a%0%a001240@bSchon komisch, mitten im tiefsten Wald auf ein Haus zu stoßen.\n@c0@"
  en: "@a%0%a001240@bIt's funny to find a house hidden in the woods\nlike this.\n@c0@"
  es: "@a%0%a001240@bQué curioso encontrar una casa oculta así en el bosque.\n@c0@"
  fr: "@a%0%a001240@bC'est drôle de trouver une maison dans les bois.\n@c0@"
  it: "@a%0%a001240@bNon mi aspettavo di trovare una casa nascosta proprio qui nella foresta...\n@c0@"
  ja: "@a@b%a001240「こんな森の中に\n\t家があるなんて　びっくりするよね。\n@c0@"
1:
  de: "@a%0%a001240@bWow! Hast du das gehört, Papa? Man kann von hier aus ins Reich der Feen gelangen!\n@c0@"
  en: "@a%0%a001240@bWow! Did you hear that, Dad?\nYou can get to the Realm of the Faeries from here!\n@c0@"
  es: "@a%0%a001240@b¡Vaya! ¿Has oído eso, papi?\n¡Desde aquí se puede llegar al Reino de las Hadas!\n@c0@"
  fr: "@a%0%a001240@bWaouhⓠ T'as entendu, papaⓡ D'ici, on peut accéder au royaume des Féesⓠ\n@c0@"
  it: "@a%0%a001240@bPapà, hai sentito?\nDa qui si può entrare nel Regno delle Fate...\n@c0@"
  ja: "@a@b%a001240「お父さん　聞いた！？\n\tここから妖精の村に　行けるんだって！\n@c0@"
2:
  de: "@a%0%a001240@bDu warst doch mal eine Zeit lang mit einer Fee unterwegs, oder, Papa? Also kannst du sie sehen!\n@c0@"
  en: "@a%0%a001240@bYou spent some time with a faerie once, didn't you, Dad? That means you must be able to see them!\n@c0@"
  es: "@a%0%a001240@bTú estuviste con un hada hace tiempo, ¿verdad, papá? ¡Eso quiere decir que podías verlas!\n@c0@"
  fr: "@a%0%a001240@bToi, tu as déjà rencontré une fée, pas vrai, papaⓡ Ça veut dire que tu peux les voirⓠ\n@c0@"
  it: "@a%0%a001240@bTu ci sei già stato qualche anno fa, non è vero?\nAllora puoi vedere le fate? \n@c0@"
  ja: "@a@b%a001240「お父さんは　妖精と\n\t冒険したこと　あるんだよね？\n\t姿だって　見えるよね！\n@c0@"
3:
  de: "@aSancho@bUff! Eine Wald, in der wir uns verlaufen, si? Unsere Mission ist wahrliss nisst leicht, eh?\n@c0@"
  en: "@aSancho@bUf! Now ees a forest we get lost een?\r\nThees quest, ees no easy, eh?\n@c0@"
  es: "@aSancho@b¡Ay, caramba! ¿Y ahora nos perdemos en un bosque?\nEsta misión no es cosa sencilla ni fácil.\n@c0@"
  fr: "@aSancho@bQuéⓡ M-Maintenant, on est dans une f-forêt où on peut se p-p-perdreⓡ Cette quête, elle n'est pas facile, heinⓡ\n@c0@"
  it: "@aSancho@b¡Esta foresta es muy entricata!\n¿Por qué el nuestro viaggio deve siempre essere tanto difícil?\n@c0@"
  ja: "@a@bサンチョ「いやはや　今度は\n\t迷いの森ですか。\n\t本当に　大変な旅ですねえ。\n@c0@"
4:
  de: "@aOtto@bWenn es mir also gelingt, den Weg durch diesen Wald zu finden, bin ich etwas Besonderes, nicht? Na, dann mal los!\n@c0@"
  en: "@aTuppence@bSo if I can find my way through this forest, that'll prove that I'm someone special. Right then!\n@c0@"
  es: "@aAlazar@bAsí que, si soy capaz de orientarme en este bosque, demostraré que soy especial. ¡Perfecto!\n@c0@"
  fr: "@aInnocent@bDonc si j'arrive à trouver mon chemin dans cette forêt, ça voudra dire que je suis quelqu'un de spécial. Alors d'accordⓠ\n@c0@"
  it: "@aSimon@bNon tema, Maestà!\nIl prode e valoroso Simon riuscirà ad attraversare questa fitta foresta senza perdersi!\n㈡\nEhm, qualcuno ha una mappa di questo posto...?\n@c0@"
  ja: "@a@bピピン「この森を　ぬけることができれば\n\tボクが　特別な人間だって\n\t証明できるわけですよ！\n@c0@"
5:
  de: "@a%0%a001240@bHa ha! Wir waren doch schon längst im Reich der Feen!\n@c0@"
  en: "@a%0%a001240@bHa ha! We've already been to the\nRealm of the Faeries!\n@c0@"
  es: "@a%0%a001240@b¡Ja, ja! ¡Ya hemos estado en el Reino de las Hadas!\n@c0@"
  fr: "@a%0%a001240@bHa ha haⓠ On est déjà allés au royaume des Féesⓠ\n@c0@"
  it: "@a%0%a001240@bAh ah ah!\nNoi siamo già stati nel Regno delle Fate!\n@c0@"
  ja: "@a@b%a001240「えへへ…　ボクたち\n\tもう　妖精の村へ　行ったもんね！\n@c0@"
6:
  de: "@aSancho@bIss hoffe, diese Mal ist es nisst zu schwer, hier durchzugehen.\n@c0@"
  en: "@aSancho@bI hope ees no eso hard to go there thees time.\n@c0@"
  es: "@aSancho@bEspero que esta vez no nos sea costoso llegar allá.\n@c0@"
  fr: "@aSancho@bJ'espère que ça ne sera pas trop d-dur d'aller\r\nlà-bas, cette f-fois.\n@c0@"
  it: "@aSancho@bEspero que esta vez riusciremo a no perderce...\n@c0@"
  ja: "@a@bサンチョ「はあ…　今度は\n\tすんなりと　行けるといいですよね。\n@c0@"
7:
  de: "@a%0%a001250@bIch habe eben so einen Schatten gesehen. Du glaubst doch nicht...?\n@c0@"
  en: "@a%0%a001250@bI saw a funny shadow just then.\nYou don't think...?\n@c0@"
  es: "@a%0%a001250@bPues yo he visto una sombra curiosa.\n¿Crees que...?\n@c0@"
  fr: "@a%0%a001250@bJe viens de voir une ombre bizarre.\nCe ne serait pas...ⓡ\n@c0@"
  it: "@a%0%a001250@bCos'era quell'ombra strana?\nNon è che per caso...?\n@c0@"
  ja: "@a@b%a001250「わたし　さっき\n\t人かげ見たよ。\n\tあれ　もしかしたら……。\n@c0@"
8:
  de: "@aOtto@bIst ja lustig, dass sie sich an die Zeit erinnert, als sie ein kleines Mädel war.\n㈡\nIch kann mich gar net an meine Kindheit erinnern. Ich nehm' an, dass ich in Humburg war...\n@c0@"
  en: "@aTuppence@bIt's funny how she remembers being a little girl.\r\nI don't remember being a little boy. I suppose I must've been in Gotha.\n@c0@"
  es: "@aAlazar@bTiene gracia que se acuerde de cuando era niña.\nYo no recuerdo qué hacía de niño. Supongo que estaba en Pankraz.\n@c0@"
  fr: "@aInnocent@bC'est drôle qu'elle se souvienne de quand elle était petite. Moi, je n'ai aucun souvenir de quand j'étais petit garçon. Je devais sans doute habiter à Gotha.\n@c0@"
  it: "@aSimon@bDa bambino non ho mai visto le fate, però una volta vidi le stelle di giorno! Successe quando mi cadde un'incudine sul ditone del piede...\n@c0@"
  ja: "@a@bピピン「子供の時……？\n\tう～ん　おぼえてないなあ。\n\tグランバニアには　いなかったのかな？\n@c0@"
9:
  de: "@a%0%a001250@bHeißt das etwa, man kann keine Feen mehr sehen, wenn man groß ist? Wenn ja, möchte ich nie erwachsen werden!\n@c0@"
  en: "@a%0%a001250@bDoes that mean you can't see faeries any more\nwhen you grow up? If that's true, I never want to grow up!\n@c0@"
  es: "@a%0%a001250@b¿Eso quiere decir que cuando te haces mayor ya no puedes ver a las hadas? ¡Entonces yo no quiero hacerme mayor nunca!\n@c0@"
  fr: "@a%0%a001250@bÇa veut dire qu'on ne peut plus voir les fées quand on granditⓡ Si c'est vrai, je ne veux pas grandirⓠ\n@c0@"
  it: "@a%0%a001250@bNon sarà mica che gli adulti non possono vedere le fate? Se è così, voglio restare una ragazzina per tutta la vita!\n@c0@"
  ja: "@a@b%a001250「おとなになると\n\t妖精さんが　見えなくなっちゃうの？\n\tやだ。　おとなに　なりたくない……。\n@c0@"
10:
  de: "@a%0%a001240@bDieser Wald ist einfach unendlich! Es muss ganz schön anstrengend sein, sich um all diese Bäume zu kümmern.\n@c0@"
  en: "@a%0%a001240@bThis forest goes on forever! It'd be a never-ending job looking after all these trees.\n@c0@"
  es: "@a%0%a001240@b¡Este bosque no se acaba nunca! Regar todos estos árboles sería un trabajo eterno.\n@c0@"
  fr: "@a%0%a001240@bCette forêt n'en finit pasⓠ On ne s'en sortira jamais si on doit regarder tous ces arbres.\n@c0@"
  it: "@a%0%a001240@bQuesta foresta sembra non finire mai!\nMai vista una roba del genere...\n@c0@"
  ja: "@a@b%a001240「ずーっと　森が続いてるね！\n\tこんなに　たくさん木があったら\n\t庭師は　大変だよ。\n@c0@"
11:
  de: "@a%0%a001240@bMoment mal... Aus welcher Richtung sind wir eigentlich gekommen? Kannst du dich erinnern, Papa?\n@c0@"
  en: "@a%0%a001240@bHang on! Which way did we come from again?\nCan you remember, Dad?\n@c0@"
  es: "@a%0%a001240@b¡Un momento! ¿Por dónde hemos venido?\n¿Lo recuerdas, papi?\n@c0@"
  fr: "@a%0%a001240@bAttendsⓠ Par où on est arrivés, déjàⓡ\nTu t'en souviens, papaⓡ\n@c0@"
  it: "@a%0%a001240@bAspetta, papà...\nDa che parte siamo venuti?\nLo ricordi?\n@c0@"
  ja: "@a@b%a001240「あれ？\n\tどっちから　来たっけ……\n\tお父さん　おぼえてる？\n@c0@"
12:
  de: "@a%0%a001240@bDu hast doch schon mal eine Fee gesehen, oder, Papa? Wie war sie denn? Größer als ich?\n@c0@"
  en: "@a%0%a001240@bYou've met a faerie before, right, Dad? What was she like? Was she taller than me?\n@c0@"
  es: "@a%0%a001240@bTú conociste a un hada, ¿verdad, papá? ¿Cómo era? ¿Era más alta que yo?\n@c0@"
  fr: "@a%0%a001240@bToi, tu as déjà vu une fée avant, hein, papaⓡ Comment elle étaitⓡ Elle était plus grande que moiⓡ\n@c0@"
  it: "@a%0%a001240@bPapà, ti ricordi com'era la fata che vedesti da piccolo?\nEra più alta di me?\n@c0@"
  ja: "@a@b%a001240「ねえねえ　お父さん\n\t妖精に会ったことあるんだよね？\n\tどんな子？　ボクより背が高い？\n@c0@"
13:
  de: "@a%0%a001240@bUnd konnte sie fliegen? Hatte sie Flügel? Glaubst du, ich könnte mich mit ihr anfreunden? Du musst mir alles erzählen!\n@c0@"
  en: "@a%0%a001240@bAnd could she fly? Did she have wings? Do you think she'd be my friend? Tell me everything!\n@c0@"
  es: "@a%0%a001240@b¿Podía volar? ¿Tenía alas? ¿Crees que podría ser amiga mía? ¡Cuéntame todo lo que sepas!\n@c0@"
  fr: "@a%0%a001240@bEt elle pouvait volerⓡ Elle avait des ailesⓡ Tu crois qu'on pourrait être copainsⓡ Dis-moi toutⓠ\n@c0@"
  it: "@a%0%a001240@bAveva le ali? Sapeva lanciare incantesimi divertenti? Com'era la sua voce? E i suoi capelli?\nSono troppo curioso!\n@c0@"
  ja: "@a@b%a001240「空って　飛べるの？\n\t羽は　はえてる？\n\tボク　仲良くなれるかな？\n@c0@"
14:
  de: "@a%0%a001250@bDie Bäume des Waldes sagen, dass sie keine schlechten Menschen hindurch lassen, aber wir sind ja gute Menschen, oder?\n@c0@"
  en: "@a%0%a001250@bThe trees here in the forest are saying that they never let bad people through, but we're good, right?\n@c0@"
  es: "@a%0%a001250@bLos árboles del bosque dicen que no dejan pasar a las personas malasⓓ pero nosotros somos buenos, ¿verdad?\n@c0@"
  fr: "@a%0%a001250@bLes arbres de la forêt disent qu'ils ne laissent jamais passer les méchants, mais nous, on est gentils, nonⓡ\n@c0@"
  it: "@a%0%a001250@bGli alberi della foresta mi hanno detto che non lasciano passare le persone cattive.\nMa noi non siamo cattivi...\n@c0@"
  ja: "@a@b%a001250「この森の木さん　悪いヤツは\n\tとおさないって言ってるよ。\n\tわたしたち　いい子よね？\n@c0@"
15:
  de: "@a%0%a001250@bIch hab schon wieder mein Haarband verloren. Ständig verfängt es sich in den Ästen der Bäume.\n@c0@"
  en: "@a%0%a001250@bMy hair ribbon's come undone again. It keeps getting caught on the branches of the trees.\n@c0@"
  es: "@a%0%a001250@bOtra vez se me han desatado los lazos del pelo. Siempre se me enredan en las ramas de los árboles.\n@c0@"
  fr: "@a%0%a001250@bLe ruban de mes cheveux s'est encore défait.\nIl n'arrête pas de se prendre dans les branches.\n@c0@"
  it: "@a%0%a001250@bContinuo a restare impigliata tra i rami degli alberi.\nSembra quasi che vogliano abbracciarmi...\n@c0@"
  ja: "@a@b%a001250「また　ほどけちゃった。\n\tあたまのリボンが　枝に\n\tひっかかっちゃうの……。\n@c0@"
16:
  de: "@a%0%a001250@bSieh nur, da! ... Oh. War wohl doch nichts.\n@c0@"
  en: "@a%0%a001250@bLook! Over there!\n...Oh. It's disappeared.\n@c0@"
  es: "@a%0%a001250@b¡Mira! ¡Ahí!\n... Oh. Ha desaparecido.\n@c0@"
  fr: "@a%0%a001250@bRegardezⓠ Par iciⓠ\n... Oh, il n'y a plus rien.\n@c0@"
  it: "@a%0%a001250@bGuarda là!\nOh, non c'è più...\n@c0@"
  ja: "@a@b%a001250「あっ　あそこ！\n\t……あれ？　いなくなっちゃった。\n@c0@"
17:
  de: "@aSancho@bVielleisst wir brauchen eine lange Zeit, bis wir wieder aus diese Wald sind, no? Iss hätte doch die kalte Paella einpacken sollen...\n@c0@"
  en: "@aSancho@bMaybe ees gonna take a long time to get\r\nout of thees forest, no? Now I weesh I pack\r\nthe cold paella.\n@c0@"
  es: "@aSancho@b¡Híjole! A lo mejor tardamos mucho en salir de este bosque. Debí haber empacado unos burritos fríos.\n@c0@"
  fr: "@aSancho@bPeut-être que ça va p-prendre longtemps pour sortir de cette f-forêt, noⓡ On aurait d-dû emporter de la paella d'hier.\n@c0@"
  it: "@aSancho@bPienso que ce vorrà un bel poco de tiempo por attraversare esta foresta. Forse avrei dovuto preparare paella al sacco por todos...\n@c0@"
  ja: "@a@bサンチョ「こりゃ　森を　ぬけるのに\n\tえらく時間がかかりそうですね。\n\tお弁当を多めに持ってくるべきでした。\n@c0@"
18:
  de: "@aSancho@bWeißt du, einmal Señor Ludwig hat mir gezeigt, wie man aus eine Labyrinth herauskommt. Aber hier das wird leider nisst funktionieren...\n@c0@"
  en: "@aSancho@bYou know, once señor Pankraz, he eshow me the way to get out of the maze. But ees no gonna work here, I theenk.\n@c0@"
  es: "@aSancho@bUna vez el señor Teudis me enseñó la forma de salir de un laberinto. Pero creo que aquí no funcionaría.\n@c0@"
  fr: "@aSancho@bT-Tu sais, le señor P-Petros, il m'avait m-montré comment sortir d'oun labyrinthe. Mais je ne crois\r\npas que ça m-marchera ici.\n@c0@"
  it: "@aSancho@b¡Ay, caramba!\n¡Esta foresta es un labirinton muy grande!\n@c0@"
  ja: "@a@bサンチョ「昔　パパスさまに　教えて\n\tいただいた　迷路抜けの方法も\n\tここでは　役に立ちそうにないですね。\n@c0@"
19:
  de: "@aSancho@bEs ist viel zu gefährliss, wenn man einfach nur so herumläuft. Man muss eine Ziel haben und es langsam angehen lassen...\n@c0@"
  en: "@aSancho@bEes muchos dangerous eef you run\r\naround weeth no purpose. You must take\r\neet eslow now.\n@c0@"
  es: "@aSancho@bCorrer de un lado para otro sin saber adónde ir es bien peligroso. Hay que tomarlo con calma.\n@c0@"
  fr: "@aSancho@bC-C'est très d-dangereux de c-courir sans savoir où on va. Il faut aller d-doucement.\n@c0@"
  it: "@aSancho@bChico, pienso que ce convenga proseguire lentamentes y con calma.\nNo dobbiamo farce prendere dalla furia.\n@c0@"
  ja: "@a@bサンチョ「あせって　やみくもに進んでは\n\tキケンですよ。　こういうときこそ\n\tじっくり　ゆっくり　進まないと。\n@c0@"
20:
  de: "@aOtto@bBald wird es so weit sein! Mir stehen glorreiche Zeiten bevor! Ihr müsst uns sicher durch diesen Wald führen, %a000090!\n@c0@"
  en: "@aTuppence@bMy life of brilliance is about to start right here! You have to guide us through this forest, %a000090!\n@c0@"
  es: "@aAlazar@b¡Mi vida de esplendor está a punto de empezar aquí mismo! ¡Debéis guiarnos para salir del bosque, %a000090!\n@c0@"
  fr: "@aInnocent@bLa plus glorieuse partie de ma vie est sur le point de commencerⓠ Vous devez absolument nous faire sortir de cette forêt, %a000090ⓠ\n@c0@"
  it: "@aSimon@bMi guidi attraverso la foresta, re %a000090!\nIo la seguirò!\n@c0@"
  ja: "@a@bピピン「ボクの　かがやける人生は\n\tこれからなんです！　%a000090さま\n\t必ず　この森を　ぬけてください！\n@c0@"
21:
  de: "@aOtto@bSeltsam. Dieser Pfad kommt mir verdächtig bekannt vor. Ich hoffe doch sehr, dass Ihr Euch auch konzentriert, %a000090!\n@c0@"
  en: "@aTuppence@bThat's odd. This path looks rather familiar.\nI do hope you're concentrating, %a000090!\n@c0@"
  es: "@aAlazar@b¡Qué raro! Este camino me suena.\n¡Espero que os estéis fijando, %a000090!\n@c0@"
  fr: "@aInnocent@bC'est étrange. J'ai l'impression d'être déjà passé par-là. J'espère que vous êtes bien concentré, %a000090ⓠ\n@c0@"
  it: "@aSimon@bMaestà, è sicuro che non siamo già passati di qua?\nForse mi sbaglio, ma mi pare di riconoscere questo sentiero...\n@c0@"
  ja: "@a@bピピン「あれ？　この道\n\tなんだか　見おぼえがあるような……。\n\t%a000090さま　たのみますよ！\n@c0@"
22:
  de: "@a%0%a001240@bSancho hat mir vom Reich der Feen erzählt. Weißt du viel über dieses Land, Papa?\n@c0@"
  en: "@a%0%a001240@bI've heard about the Realm of the Faeries from Sancho. Do you know much about it, Dad?\n@c0@"
  es: "@a%0%a001240@bSancho nos ha hablado del Reino de las Hadas. ¿Qué sabes tú de él, papá?\n@c0@"
  fr: "@a%0%a001240@bSancho m'a parlé du royaume des Fées. Et toi, tu sais beaucoup de choses là-dessus, papaⓡ\n@c0@"
  it: "@a%0%a001240@bUna volta lo zio Sancho ci ha parlato del Regno delle Fate, ma scommetto che tu ne sai molto più di lui!\n@c0@"
  ja: "@a@b%a001240「妖精の国なんて\n\tサンチョからも　聞いたことないや。\n\tお父さんも　知らなかった？\n@c0@"
23:
  de: "@a%0%a001240@bIch weiß zwar nicht, wie Mama aussieht, aber sie ist bestimmt noch viel hübscher als die Feenherrin!\n@c0@"
  en: "@a%0%a001240@bI don't know what Mum looks like, but I'll bet she's even more beautiful than the Faerie Queen!\n@c0@"
  es: "@a%0%a001240@bNo sé qué aspecto tiene mamá, ¡pero seguro que es aún más guapa que la Reina de las Hadas!\n@c0@"
  fr: "@a%0%a001240@bJe ne sais pas à quoi ressemble maman, mais\nje suis sûr qu'elle est encore plus belle que\nla reine des féesⓠ\n@c0@"
  it: "@a%0%a001240@bNon so che aspetto abbia mia madre, ma sono certo che è più bella della Regina delle Fate.\n@c0@"
  ja: "@a@b%a001240「お母さんの顔　知らないけど\n\tでも　ぜったい　妖精の女王さまより\n\tお母さんのほうが　きれいだよね！\n@c0@"
24:
  de: "@a%0%a001250@bEs wäre doch schön, im Reich der Feen leben zu können, nicht?\n@c0@"
  en: "@a%0%a001250@bI'd really love to live in the Realm of the Faeries.\n@c0@"
  es: "@a%0%a001250@bMe encantaría vivir en el Reino de las Hadas.\n@c0@"
  fr: "@a%0%a001250@bJ'adorerais vivre dans le royaume des Fées.\n@c0@"
  it: "@a%0%a001250@bIl Regno delle Fate è tranquillo e divertente...\nNon mi dispiacerebbe viverci, sai?\n@c0@"
  ja: "@a@b%a001250「わたしも　妖精の村で\n\t暮らしたいな……。\n@c0@"
25:
  de: "@a%0%a001250@bGibt es ein Land für Feen und eins für Monster? Und in welchem befinden wir uns gerade...?\n@c0@"
  en: "@a%0%a001250@bIs there a land for faeries and a land for monsters?\nUm, which one do you think this is?\n@c0@"
  es: "@a%0%a001250@b¿Hay un país de las hadas y un país de los monstruos?\nMmm... ¿Y cuál crees que es este?\n@c0@"
  fr: "@a%0%a001250@bEst-ce qu'il y a un pays pour les fées et un pays pour les monstresⓡ À ton avis, c'est lequel celui-làⓡ\n@c0@"
  it: "@a%0%a001250@bAnche i mostri avranno un regno, come le fate?\nSe ce l'hanno, perché ci sono mostri anche nel mondo degli uomini?\n@c0@"
  ja: "@a@b%a001250「魔物さんの国と\n\t妖精さんの国があるの？\n\tえっと　ここは…　どっち？\n@c0@"
26:
