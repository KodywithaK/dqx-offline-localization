0:
  de: "@a%0%a001240@bIch frage mich, was wir mit der Kugel tun müssen. Wir haben sie hier nach Zenithia gebracht, aber was jetzt?\n@c0@"
  en: "@a%0%a001240@bI wonder what we're supposed to do with this orb. We've brought it here to Zenithia, but now what?\n@c0@"
  es: "@a%0%a001240@bMe pregunto qué se supone que debemos hacer con este orbe. Lo hemos traído a Zenithia, pero ¿ahora qué?\n@c0@"
  fr: "@a%0%a001240@bJe me demande ce qu'on est censés faire de cet orbe. On l'a ramené à Zénithia, et aprèsⓡ\n@c0@"
  it: "@a%0%a001240@bCosa dobbiamo fare di questo globo?\nL'abbiamo portato qui a Zenithia, e adesso?\n@c0@"
  ja: "@a@b%a001240「このオーブって　どうしたら\n\tいいんだろう？　とりあえず\n\t天空城へ　持って来ちゃったけど。\n@c0@"
1:
  de: "@a%0%a001250@bIch bin froh, dass wir's zurück nach Zenithia geschafft haben.\n@c0@"
  en: "@a%0%a001250@bIt's a relief to have made it here to Zenithia.\n@c0@"
  es: "@a%0%a001250@bEs un alivio haber llegado hasta Zenithia.\n@c0@"
  fr: "@a%0%a001250@bJe suis contente qu'on soit arrivés à Zénithia.\n@c0@"
  it: "@a%0%a001250@bFinalmente siamo a Zenithia...\n@c0@"
  ja: "@a@b%a001250「天空城に　ついたら\n\tちょっと　ホッとしました。\n@c0@"
2:
  de: "@aSancho@bFragst du diss nisst, wo Señor Ache ist?\n@c0@"
  en: "@aSancho@bYou no wonder where ees señor Agon?\n@c0@"
  es: "@aSancho@b¿Pues no te preguntas dónde está el señor Agón?\n@c0@"
  fr: "@aSancho@bT-Tu ne te demandes p-pas où est le señor Agonⓡ\n@c0@"
  it: "@aSancho@b¿Donde está el señor Dottor Agon?\n@c0@"
  ja: "@a@bサンチョ「そういえば　プサンさんは\n\tどうしましたかねえ。\n@c0@"
3:
  de: "@a%0%a001240@bEs macht mir ein bisschen Angst, das Schloss so hin und her zu bewegen. Wir könnten doch niemals für den Schaden aufkommen, falls etwas passiert...\n@c0@"
  en: "@a%0%a001240@bIt's a bit nerve-racking moving the castle about\nthe place. We'd never be able to afford to pay\nfor any damage.\n@c0@"
  es: "@a%0%a001240@bEsto de mover el castillo de un lado para otro te deja los nervios destrozados. Si le pasa algo, no podremos pagar los daños ni en un siglo.\n@c0@"
  fr: "@a%0%a001240@bC'est un peu stressant de diriger le château. Comment on fera pour rembourser si on l'abîmeⓡ\n@c0@"
  it: "@a%0%a001240@bPapà, fai attenzione!\nSe danneggiamo il castello, dovremo lavorare per una dozzina di secoli per pagare le riparazioni!\n@c0@"
  ja: "@a@b%a001240「天空城を　動かすなんて\n\tきんちょうするよね。　だって\n\tこわしたら　べんしょうできないもん。\n@c0@"
4:
  de: "@a%0%a001250@bEs kommt mir nicht richtig vor, dass das Schloss wieder unten ist. Schließlich soll Zenithia doch über den Wolken schweben, oder?\n@c0@"
  en: "@a%0%a001250@bI can't help feeling a bit bad about landing the castle on the ground. I mean, Zenithia's supposed to float up above the clouds, after all.\n@c0@"
  es: "@a%0%a001250@bEsto de aterrizar con el castillo me hace sentir un poco mal. Después de todo, se supone que Zenithia debería flotar por encima de las nubes.\n@c0@"
  fr: "@a%0%a001250@bJe me sens un peu mal à l'aise à l'idée de faire atterrir le château. C'est vrai, Zénithia est censé flotter au-dessus des nuages, après tout.\n@c0@"
  it: "@a%0%a001250@bPerché dovremmo portare il castello a terra?\nCredevo che il posto di Zenithia fosse tra le nuvole...\n@c0@"
  ja: "@a@b%a001250「天空城なのに　地面に\n\tおろしておくのは　ちょっと\n\t悪いような気がするの……。\n@c0@"
5:
  de: "@a%0%a001240@bUnd das soll wirklich vom Yggdrasil-Baum sein? So ein kleiner Schössling?\n@c0@"
  en: "@a%0%a001240@bThis is from the Yggdrasil tree?\nA tiny little sapling like this?\n@c0@"
  es: "@a%0%a001240@b¿Es del árbol Yggdrasil?\n¿Un retoño medio enano como este?\n@c0@"
  fr: "@a%0%a001240@bÇa vient de l'Yggdrasilⓡ Une pousse aussi minusculeⓡ\n@c0@"
  it: "@a%0%a001240@bQuesto piccolo virgulto viene da Ygdrasil, il Grande Albero del Mondo?\nChe meraviglia!\n@c0@"
  ja: "@a@b%a001240「世界樹！？\n\tこんな　ちっちゃな苗が？？\n@c0@"
6:
  de: "@a%0%a001250@bWie klein und zerbrechlich! Soll ich ihn vielleicht gießen, Papa?\n@c0@"
  en: "@a%0%a001250@bIt's so tiny and delicate!\nCan I give it some water, Dad?\n@c0@"
  es: "@a%0%a001250@b¡Es tan minúsculo y delicado!\n¿Puedo ponerlo en agua, papi?\n@c0@"
  fr: "@a%0%a001250@bElle est si petite et délicateⓠ\nJe peux l'arroser, papaⓡ\n@c0@"
  it: "@a%0%a001250@bQuesto virgulto è così tenero e delicato...\nPapà, che ne diresti di dargli un po' d'acqua?\n@c0@"
  ja: "@a@b%a001250「ちいさくて　かわいいね。\n\tお父さん　わたしが\n\t水やりしてもいい？\n@c0@"
7:
  de: "@a%0%a001250@bDer kleine Schössling hat sich tapfer geschlagen in all dem Wasser. Er ist sehr hartnäckig.\n@c0@"
  en: "@a%0%a001250@bThis tiny sapling's done so well in all that water.\nIt's a determined little thing.\n@c0@"
  es: "@a%0%a001250@bAl retoño le ha sentado muy bien toda ese agua.\nTiene un aspecto fuerte y decidido.\n@c0@"
  fr: "@a%0%a001250@bCette petite pousse a bien résisté dans toute cette eau. Quelle détermination pour une si petite choseⓠ\n@c0@"
  it: "@a%0%a001250@bÈ incredibile che questo virgulto sia riuscito a sopravvivere alla catastrofe che aveva colpito Zenithia...\n㈡\nDev'essere molto più forte e resistente di quanto non appaia.\n@c0@"
  ja: "@a@b%a001250「この苗木さん\n\tお水の中でも　しっかり生きてたのね。\n\tおりこうさんだね。\n@c0@"
8:
  de: "@aSancho@bEs heißt, dass man mit eine Yggdrasil-Blatt einen Verstorbenen wieder zum Leben erwecken kann.\n@c0@"
  en: "@aSancho@bThey esay you can breeng esomeone who has passed away back from the dead weeth the leaf of Yggdrasil.\n@c0@"
  es: "@aSancho@bDicen que con la hoja de Yggdrasil puedes traer de vuelta a una persona que murió.\n@c0@"
  fr: "@aSancho@bIl p-paraît qu'avec une feuille d'Yggdrasil, on peut ressusciter quelqu'un qui est m-mort.\n@c0@"
  it: "@aSancho@bPare que las foglias de Ygdrasil abbiano la capacidad de reportare en vida los muertos...\n@c0@"
  ja: "@a@bサンチョ「世界樹の葉は　死んだ者をも\n\t生きかえらせると言いますが……\n@c0@"
9:
  de: "@aSancho@bAber das ist ja nur eine Schössling. Er hat noch nisst so viel Kraft, glaube iss.\n@c0@"
  en: "@aSancho@bBut thees ees just a sapling. Eet no has esuch estrong power yet, I believe.\n@c0@"
  es: "@aSancho@bPero esto no es más que un retoñitito. Creo que no tiene aún tanto poder.\n@c0@"
  fr: "@aSancho@bM-Mais ça, c'est juste une p-pousse. Elle ne doit pas encore avoir de p-pouvoir aussi grand.\n@c0@"
  it: "@aSancho@bPerò esto es solamentes un piccolo virgulto, y pienso que no ha ancoras esto potere incredibile...\n@c0@"
  ja: "@a@bサンチョ「まだ苗木の　この状態では\n\tそのチカラはないでしょうね。\n@c0@"
10:
  de: "@aOtto@bWenn wir diesen Schössling gut pflegen, hätten wir alle Yggdrasil-Blätter, die wir brauchen!\n㈡\nDann könnten wir jedem Kampf ohne Furcht entgegenblicken!\n@c0@"
  en: "@aTuppence@bIf we can keep this sapling going, we'll have all the Yggdrasil leaves we could possibly need! Now we can fight to the death without having to worry!\n@c0@"
  es: "@aAlazar@b¡Si podemos mantener vivo este retoño, tendremos tantas hojas de Yggdrasil como necesitemos!\n㈡\n¡Podremos luchar hasta la muerte sin tener que preocuparnos!\n@c0@"
  fr: "@aInnocent@bSi nous réussissons à la faire pousser, nous aurons toutes les feuilles d'Yggdrasil qu'il nous fautⓠ Nous pourrons affronter la mort sans nous inquiéterⓠ\n@c0@"
  it: "@aSimon@bSe riuscissimo a far crescere questo virgulto di Ygdrasil, avremmo tutte le foglie che vorremmo!\nDiventeremmo imbattibili!\n@c0@"
  ja: "@a@bピピン「この苗木を　育てれば\n\t世界樹の葉が　取り放題ですね！\n\tこれで　死ぬ気で　たたかえますよ！\n@c0@"
11:
  de: "@a%0%a001240@bⓞDie Dunkelheit breitet sich stetig aus...ⓟ Das heißt wohl, dass wir uns beeilen müssen...\n@c0@"
  en: "@a%0%a001240@bⓗThe darkness spreadethⓘ... I think that means\nwe'd better hurry, Dad.\n@c0@"
  es: "@a%0%a001240@bⓕLa oscuridad se propagaⓖ... Creo que eso quiere decir que nos demos prisa, papi.\n@c0@"
  fr: "@a%0%a001240@bⓥL'obscurité s'étendⓦ... Je crois que ça veut dire qu'il faut se dépêcher, papa.\n@c0@"
  it: "@a%0%a001240@bLa potenza di Nimzo sta crescendo e l'oscurità minaccia il mondo intero...\nPapà, credo che non ci resti molto tempo...\n@c0@"
  ja: "@a@b%a001240「大地も　闇に……。\n\tねえ　お父さん　ボクたち\n\t急がなくちゃいけないんだね。\n@c0@"
12:
  de: "@a%0%a001250@bDer arme Schössling, wird einfach so in einen Topf gesteckt!\n@c0@"
  en: "@a%0%a001250@bThat poor sapling, confined to such a tiny pot!\n@c0@"
  es: "@a%0%a001250@b¡Pobre retoño, metido en esa maceta tan pequeña!\n@c0@"
  fr: "@a%0%a001250@bPauvre pousseⓠ Elle est dans un si petit potⓠ\n@c0@"
  it: "@a%0%a001250@bPovero virgulto, costretto a stare in un vaso così piccolo...\n@c0@"
  ja: "@a@b%a001250「あの世界樹の苗木さん\n\tちいさい鉢の中で　かわいそう……。\n@c0@"
13:
  de: "@a%0%a001250@bSobald wir Nimzo besiegt haben, müssen wir einen richtig schönen Ort für ihn finden, wo immer die Sonne scheint!\n@c0@"
  en: "@a%0%a001250@bOnce we've defeated Nimzo, we'll have to make\nsure it's moved to a nice big place with lots and\nlots of sunshine!\n@c0@"
  es: "@a%0%a001250@b¡Cuando hayamos derrotado a Nimzo lo trasplantaremos a un sitio bien grande y bonito y con mucho sol!\n@c0@"
  fr: "@a%0%a001250@bUne fois que nous aurons vaincu Nimzo, il faudra\nla replanter dans un bel endroit avec beaucoup, beaucoup de soleilⓠ\n@c0@"
  it: "@a%0%a001250@bDopo che avremo sconfitto Nimzo, lo metteremo in un posto pieno di sole, così crescerà robusto e rigoglioso!\n@c0@"
  ja: "@a@b%a001250「ミルドラースを　やっつけたら\n\t広くて　お日さまが　いっぱい\n\t当たる場所に　植え直してあげようね！\n@c0@"
14:
  de: "@aSancho@bSi, das ist eine Schössling von die große Weltenbaum. Wenn du nisst gut auf ihn aufpasst, wird die Göttin sisser böse!\n@c0@"
  en: "@aSancho@bSí, ees just the esapling, but ees from the Great World Tree. Eef you no look after eet well, the Goddess, eshe gonna make you pay!\n@c0@"
  es: "@aSancho@bSí, solo es un retoño, pero es del Gran Árbol del Mundo, híjole. ¡Si no lo cuidas bien, la Diosa te lo hará pagar!\n@c0@"
  fr: "@aSancho@bSi, c'est j-juste oune pousse, mais elle v-vient du Grand arbre du M-Monde. Si t-tu ne t'en occupes pas bien, la Déesse, elle te le fera p-payerⓠ\n@c0@"
  it: "@aSancho@b¡Esto virgulto viene dal Grande Albero del Mundo!\n¡Es un dono della dea!\nChico, me raccomando: abbine cura.\n@c0@"
  ja: "@a@bサンチョ「苗木でも　世界樹は\n\t世界樹ですから……。\n\t大事にしないと　バチが当たりますよ！\n@c0@"
15:
  de: "@a%0%a001240@bEin Geschenk? Eigentlich sollen wir keine Geschenke von Fremden annehmen. Aber wenn du dabei bist, geht das wohl in Ordnung...\n@c0@"
  en: "@a%0%a001240@bA present? We're not supposed to take presents from strangers. But I suppose it's okay if you're here, Dad.\n@c0@"
  es: "@a%0%a001240@b¿Un regalo? No podemos aceptar regalos de extraños. Pero supongo que no pasa nada si estás tú delante, papá.\n@c0@"
  fr: "@a%0%a001240@bUn cadeauⓡ Normalement, on n'a pas le droit d'accepter de cadeaux de la part des étrangers, mais je suppose que ça va puisque tu es là, papa.\n@c0@"
  it: "@a%0%a001240@bChe bello! Un regalo tutto per me!\nCioè, tutto per noi...\n\n@c0@"
  ja: "@a@b%a001240「なにか　くれるの？\n\t知らない人だけど　お父さんと\n\tいっしょだから　もらってもいいよね？\n@c0@"
16:
  de: "@a%0%a001240@bIch wusste gar nicht, dass es hier auch Feen gibt. Glaubst du, dass die Zenithianer und Feen befreundet sind?\n@c0@"
  en: "@a%0%a001240@bI didn't know there were faeries here too. Do you think Zenithians and faeries are all good friends?\n@c0@"
  es: "@a%0%a001240@bNo sabía que aquí también hubiera hadas. ¿Crees que los zenithios y las hadas se llevan bien?\n@c0@"
  fr: "@a%0%a001240@bJe ne savais pas qu'il y avait des fées ici aussi.\nTu crois que les Zénithiens et les fées s'entendent bienⓡ\n@c0@"
  it: "@a%0%a001240@bNon sapevo che anche qui ci fossero delle fate.\nEvidentemente, le fate e gli Zenithiani sono amici...\n@c0@"
  ja: "@a@b%a001240「天空城には　妖精もいたんだね。\n\t天空の人と　妖精は　仲よしなのかな？\n@c0@"
17:
  de: "@a%0%a001250@bIst das etwa Yggdrasil...? Oh...\n@c0@"
  en: "@a%0%a001250@bIs that grass Yggdrasil? Ooh...\n@c0@"
  es: "@a%0%a001250@b¿Así que esa hierba es Yggdrasil? Ooh...\n@c0@"
  fr: "@a%0%a001250@bCette rosée provient de l'Yggdrasilⓡ Ooh...\n@c0@"
  it: "@a%0%a001250@bAnche questa proviene dall'albero di Ygdrasil?\n@c0@"
  ja: "@a@b%a001250「あの草って　世界樹なの？\n\tう～ん……。\n@c0@"
18:
  de: "@aSancho@bUi! Der Tau von Yggdrasil ist sehr, sehr wertvoll, Chico.\n@c0@"
  en: "@aSancho@bUf! The dew of Yggdrasil, ees a very\r\nvaluable theeng.\n@c0@"
  es: "@aSancho@b¡Ay, caramba! El rocío de Yggdrasil es muy muy valioso.\n@c0@"
  fr: "@aSancho@bEh b-bahⓠ De la r-rosée d'Yggdrasilⓠ\nC'est très p-précieux.\n@c0@"
  it: "@aSancho@bLa rugiada de Ygdrasil es una bevanda muy preciosa, chico...\n@c0@"
  ja: "@a@bサンチョ「世界樹のしずくとは　また\n\tすごそうなものですねえ。\n@c0@"
19:
  de: "@a%0%a001240@bWarum kann man denn nicht mehr haben? Es wäre doch viel praktischer, wenn man mehr als einen Tropfen nehmen könnte!\n@c0@"
  en: "@a%0%a001240@bThat's not fair! Why can we only have one lot at\na time? It'd be much better if we could take loads of it!\n@c0@"
  es: "@a%0%a001240@b¡No es justo! ¿Por qué solo podemos llevar un poquito cada vez? ¡Sería mejor si pudiéramos llevar un montón de golpe!\n@c0@"
  fr: "@a%0%a001240@bC'est pas justeⓠ Pourquoi on ne peut en avoir qu'une à la foisⓡ Ce serait mieux si on pouvait en avoir plein d'un coupⓠ\n@c0@"
  it: "@a%0%a001240@bPerché non si può avere più di una goccia di rugiada per volta?!\nNon è giusto!\n@c0@"
  ja: "@a@b%a001240「え～っ！\n\tひとつずつしか　持てないの？\n\tいっぱい持てると　便利なのにね！\n@c0@"
20:
  de: "@a%0%a001250@bWir müssen gut aufpassen, dass wir das bisschen Yggdrasil-Tau, das wir haben, nicht verschwenden.\n@c0@"
  en: "@a%0%a001250@bWe'll have to make sure we use the bit of Yggdrasil dew we have carefully then, Dad.\n@c0@"
  es: "@a%0%a001250@bTendremos que usar este poquito de rocío de Yggdrasil con prudencia, papi.\n@c0@"
  fr: "@a%0%a001250@bOn a intérêt à faire attention à la manière dont on va utiliser cette rosée d'Yggdrasil, papa.\n@c0@"
  it: "@a%0%a001250@bPapà, cerchiamo di usare nel migliore dei modi la poca rugiada di Ygdrasil che abbiamo...\nNon possiamo permetterci di sprecarla.\n@c0@"
  ja: "@a@b%a001250「世界樹のしずく\n\t大事に使おうね　お父さん。\n@c0@"
21:
  de: "@aSancho@bSi, das stimmt. Wenn man zu viel von solch eine wertvolle Sache hat, vergisst man seine wahre Wert...\n@c0@"
  en: "@aSancho@bSí. Ees true. Eef you have too much of esometheeng like thees, you forget the true value of life.\n@c0@"
  es: "@aSancho@bEs la puritita verdad. Si tomas demasiada cantidad de una cosa, se olvida el verdadero valor de la vida.\n@c0@"
  fr: "@aSancho@bSi, c'est v-vrai. Si t-tu as quelque chose d'aussi\r\np-précieux en grande quantité, tu oublies la\r\nvraie v-valeur de la vie.\n@c0@"
  it: "@aSancho@bLa rugiada de Ygdrasil es un dono muy precioso.\r\nSi se ne potesse avere en gran quantità, dimenticheremmo quanto es importante la vida...\n@c0@"
  ja: "@a@bサンチョ「たしかに　そんなすごいものを\n\tいくつも持てたら　命のありがたみが\n\tなくなってしまいますね。\n@c0@"
22:
  de: "@aOtto@bSie könnte uns doch einfach ein paar Tropfen extra spendieren, oder? Schließlich kämpfen wir für den Weltfrieden...\n@c0@"
  en: "@aTuppence@bYou'd think she could just slip us a few extra lots out of goodwill, wouldn't you? We are fighting for world peace, after all.\n@c0@"
  es: "@aAlazar@bNo estaría mal que nos pasase unas cuantas raciones más por buena voluntad, ¿no? Al fin y al cabo, estamos luchando por la paz en el mundo.\n@c0@"
  fr: "@aInnocent@bElle aurait pu en mettre quelques-unes de plus par simple bienveillance, nonⓡ Nous nous battons pour restaurer la paix dans le monde, quand même.\n@c0@"
  it: "@aSimon@bNon potremmo averne qualche goccia in più?\r\nCi farebbe comodo, visto che la missione che stiamo svolgendo è tutt'altro che agevole...\n@c0@"
  ja: "@a@bピピン「えんりょしないで　サービス\n\tしてほしいなあ。　ボクたちは　世界の\n\t平和のために　たたかってるんだし。\n@c0@"
23:
  de: "@a%0%a001240@bOhne den Greifhaken wären wir nie in den Turm gekommen.\n@c0@"
  en: "@a%0%a001240@bWe would never have made it inside the tower without that grappling hook.\n@c0@"
  es: "@a%0%a001240@bNunca hubiéramos conseguido llegar al interior de la torre sin el gancho de escalada.\n@c0@"
  fr: "@a%0%a001240@bOn n'aurait jamais réussi à entrer dans la tour sans le grappin.\n@c0@"
  it: "@a%0%a001240@bSe non avessimo avuto il rampino, non saremmo mai riusciti a penetrare nella torre.\n@c0@"
  ja: "@a@b%a001240「あのロープが　なかったら\n\t塔に　入れなかったもんね。\n@c0@"
24:
  de: "@a%0%a001240@bWie gut, dass wir ihn und nicht einen Haufen alter Unterhosen in der Kommode gefunden haben!\n@c0@"
  en: "@a%0%a001240@bIt's a good job we found that in his cupboard, rather than just a load of old man's pants!\n@c0@"
  es: "@a%0%a001240@b¡Fue una suerte que lo encontráramos en un armario, en vez de un montón de ropa de vieja!\n@c0@"
  fr: "@a%0%a001240@bOn a eu de la chance de trouver ce grappin plutôt que des caleçons dans sa commode.\n@c0@"
  it: "@a%0%a001240@bSiamo stati proprio fortunati a trovarlo!\n@c0@"
  ja: "@a@b%a001240「それより　タンスの中身が\n\tおじいさんのパンツじゃなくて\n\t本当に　よかったよ！\n@c0@"
25:
  de: "@a%0%a001250@bIch frage mich, warum der alte Mann überhaupt einen Greifhaken hatte...\n@c0@"
  en: "@a%0%a001250@bI wonder why the old man had that grappling hook in the first place.\n@c0@"
  es: "@a%0%a001250@bMe pregunto para qué querría ese hombre un gancho de escalada.\n@c0@"
  fr: "@a%0%a001250@bJe me demande pourquoi ce vieux monsieur avait ce grappin.\n@c0@"
  it: "@a%0%a001250@bCome mai quel signore aveva in casa un rampino?\n@c0@"
  ja: "@a@b%a001250「おじいさん　どうして\n\tあんなロープ　持ってたのかな？\n@c0@"
26:
  de: "@a%0%a001250@bDu glaubst doch nicht, dass er früher mal ein Einbrecher war, oder?\n@c0@"
  en: "@a%0%a001250@bYou don't think he used to be a burglar, do you?\n@c0@"
  es: "@a%0%a001250@bNo creerás que lo utilizaría para robar, ¿verdad?\n@c0@"
  fr: "@a%0%a001250@bTu crois que c'était un cambrioleur, dans le tempsⓡ\n@c0@"
  it: "@a%0%a001250@bForse era uno scalatore professionista?\nUna guida alpina, forse?\nO magari un ladro?!\n@c0@"
  ja: "@a@b%a001250「まさか　どろぼうさん！？\n@c0@"
27:
  de: "@a%0%a001240@bJahrhunderte? Wow! Ich hätte nicht gedacht, dass das alles hier so alt ist.\n@c0@"
  en: "@a%0%a001240@bCenturies? Wow! I didn't realise this place\nwas so old.\n@c0@"
  es: "@a%0%a001240@b¿Siglos? ¡Arrea! No pensaba que este sitio fuese tan viejo.\n@c0@"
  fr: "@a%0%a001240@bQuelques sièclesⓡ Waouhⓠ Je n'avais pas réalisé que cet endroit était si vieux.\n@c0@"
  it: "@a%0%a001240@bSecoli dopo?!\nAccipicchia!\nNon pensavo che questo posto fosse tanto vecchio!\n@c0@"
  ja: "@a@b%a001240「数百年かあ……。\n\tこのお城は　そんな昔から\n\tあったんだね。\n@c0@"
28:
  de: "@a%0%a001250@bHast du den Zenithdrachen je getroffen, Papa? Ich hab nur Bilder von ihm gesehen...\n@c0@"
  en: "@a%0%a001250@bHave you ever met the Zenith Dragon, Dad?\nI've only ever seen pictures of him in books.\n@c0@"
  es: "@a%0%a001250@b¿Has visto alguna vez al Dragón de Zenithia, papi?\nYo solo lo he visto en las ilustraciones de los libros.\n@c0@"
  fr: "@a%0%a001250@bTu as déjà rencontré le Dragon du Zénith, papaⓡ Moi, j'ai juste vu des illustrations dans des livres.\n@c0@"
  it: "@a%0%a001250@bPapà, hai mai incontrato il Drago di Zenithia?\nUna volta ho letto un libro dove c'erano delle immagini che lo raffiguravano...\n@c0@"
  ja: "@a@b%a001250「お父さんは\n\tマスタードラゴンに　会ったことある？\n\tわたしは　ご本でしか見たことないの。\n@c0@"
29:
  de: "@aSancho@bDann wir müssen diese Zenithdrache finden, si?\n@c0@"
  en: "@aSancho@bThen we must find thees Zenith Dragon, sí?\n@c0@"
  es: "@aSancho@bAsí que tenemos que encontrar ese Dragón de Zenithia, nomás, ¿no?\n@c0@"
  fr: "@aSancho@bAlors il faut trouver ce D-Dragon du Zénith, siⓡ\n@c0@"
  it: "@aSancho@b¿Quindi ahora dobbiamo trovare el Drago de Zenithia, eh?\n@c0@"
  ja: "@a@bサンチョ「そういうことなら\n\t平和のために　マスタードラゴンを\n\t探さねば　なりませんね。\n@c0@"
30:
  de: "@aOtto@bOb die Menschen wirklich so nobel sind? Ich würde sagen, dass die Götter ihnen da einiges voraushaben.\n@c0@"
  en: "@aTuppence@bAre humans really all that noble? I'd say gods have the edge there, myself.\n@c0@"
  es: "@aAlazar@b¿De verdad que los humanos son así de nobles? Yo creo que ahí los dioses nos sacan ventaja.\n@c0@"
  fr: "@aInnocent@bLes humains sont-ils si nobles que çaⓡ Je dirais qu'en la matière, les dieux doivent quand même\navoir le dessus.\n@c0@"
  it: "@aSimon@bⓕGli umani sono nobili e coraggiosiⓖ?!\nMa davvero?! Mi sa che questo Drago di Zenithia ha troppa fiducia negli uomini...\n@c0@"
  ja: "@a@bピピン「人間って　いいですかね？\n\tボクなら　絶対　神さまのほうが\n\tいいと思いますけど。\n@c0@"
31:
  de: "@a%0%a001240@bEs ist gar nicht so einfach, sich in Zenithia zurechtzufinden...\n@c0@"
  en: "@a%0%a001240@bZenithia is certainly a fairly tricky place to find your way around!\n@c0@"
  es: "@a%0%a001240@b¡Moverse por Zenithia es realmente lioso!\n@c0@"
  fr: "@a%0%a001240@bC'est quand même pas facile de trouver son chemin dans Zénithiaⓠ\n@c0@"
  it: "@a%0%a001240@bNon è affatto facile orientarsi a Zenithia...\n@c0@"
  ja: "@a@b%a001240「天空城って　けっこう\n\tふくざつな造りに　なってるんだね。\n@c0@"
32:
  de: "@a%0%a001240@bSchwebt das Schloss immer nur über dem Boden? Ich möchte mal sehen, wie es sich hoch in den Himmel erhebt!\n@c0@"
  en: "@a%0%a001240@bCan the castle still only fly low to the ground?\nI want to see it float right up to the heavens!\n@c0@"
  es: "@a%0%a001240@b¿El castillo solo puede volar bajo?\n¡Me gustaría verlo surcar en lo más alto!\n@c0@"
  fr: "@a%0%a001240@bLe château ne peut toujours voler qu'en\nrase-mottesⓡ Je voudrais bien le voir\nflotter très haut dans le cielⓠ\n@c0@"
  it: "@a%0%a001240@bMa il castello vola solo a bassa quota?!\nIo voglio salire tra le nuvole!\n@c0@"
  ja: "@a@b%a001240「天空城は　まだ\n\t低くしか　飛ばないのかな？\n\t天の上まで飛ぶ姿　見てみたいよね！\n@c0@"
33:
  de: "@a%0%a001250@bAlles scheint getrocknet zu sein. Und es herrscht auch eine viel bessere Stimmung im Schloss.\n@c0@"
  en: "@a%0%a001250@bIt looks like things have dried out nicely. The castle has a much happier feel to it now.\n@c0@"
  es: "@a%0%a001250@bParece que las cosas se han secado. Ahora el castillo está más alegre.\n@c0@"
  fr: "@a%0%a001250@bOn dirait que tout est bien sec, maintenant.\nLe château a l'air beaucoup plus gai.\n@c0@"
  it: "@a%0%a001250@bOra che il castello è quasi del tutto asciutto, si respira un'aria decisamente più allegra!\n@c0@"
  ja: "@a@b%a001250「お城の中も\n\tだいぶ　かわいたみたいね。\n\tお城さんも　うれしそう。\n@c0@"
34:
  de: "@a%0%a001250@bFrüher lag Zenithia noch viel, viel höher, nicht wahr? Da haben wir ja Glück, dass wir nicht noch höher klettern mussten...\n@c0@"
  en: "@a%0%a001250@bZenithia used to be much, much higher all those\nyears ago, didn't it? We're lucky we didn't have to climb so high.\n@c0@"
  es: "@a%0%a001250@bZenithia solía estar muchísimo más alta antes, ¿verdad? Qué suerte que nosotros no hayamos tenido que subir tanto.\n@c0@"
  fr: "@a%0%a001250@bZénithia était bien plus haut autrefois, heinⓡ\nOn a de la chance de ne pas avoir eu à grimper\nsi haut.\n@c0@"
  it: "@a%0%a001250@bZenithia era più in alto tanti anni fa, non è vero?\nPer me quest'altitudine è più che sufficiente per farmi venire le vertigini!\n@c0@"
  ja: "@a@b%a001250「このお城　昔は　もっともっと\n\t高いところにあったのよね？\n\tよかった　高くあがらなくて。\n@c0@"
35:
  de: "@aSancho@bSo es sieht also im Innern von Zenithia aus... Sehr interessant, no? Wenn wir mehr Zeit hätten, würde iss alles erkunden...\n@c0@"
  en: "@aSancho@bEso, thees ees how the eenside of Zenithia looks?\r\nEes very interesting, no? Eef we had more time, I like to look around...\n@c0@"
  es: "@aSancho@bÓrale, ¿este es el aspecto del interior de Zenithia?\nEs reteinteresante, ¿no? Si hubiera tiempo, estaría bien poder echar un vistazo, chamaco...\n@c0@"
  fr: "@aSancho@bAlors, voilà l'intérieur de Zénithia... C-C'est intéressant, noⓡ Si on avait eu plus de temps, j'aurais bien fait oune petite v-visite...\n@c0@"
  it: "@aSancho@bEsto es l'interno del Castillo de Zenithia..\n¿Es interessante, no?\n㈡\nSi avessimo más tiempo a disposiziones, me gustaria visitarlo da cimas a fundo...\n@c0@"
  ja: "@a@bサンチョ「天空城の中が　こういうふうに\n\tなっていたとは……。　時間があれば\n\tゆっくり見学したいですね。\n@c0@"
36:
  de: "@aOtto@bIch werd' ganz schön was zu erzählen haben, wenn ich zurück nach Humburg komme!\n㈡\nEs können schließlich net viele Leute von sich behaupten, in Zenithia g'wesen zu sein!\n@c0@"
  en: "@aTuppence@bI'll be able to hold my head up high when we get back to Gotha, so I will! There's not many folk who can say they've been to Zenithia.\n@c0@"
  es: "@aAlazar@b¡Cuando vuelva a Pankraz voy a llevar la cabeza bien alta, eso desde luego! No hay mucha gente que pueda decir que ha estado en Zenithia.\n@c0@"
  fr: "@aInnocent@bJe pourrai marcher la tête haute quand nous retournerons à Gotha. Rares sont les gens qui peuvent dire qu'ils sont allés à Zénithia.\n@c0@"
  it: "@aSimon@bSono uno dei pochi esseri al mondo che ha avuto il privilegio di visitare il Castello di Zenithia!\n㈡\nQuando tornerò a Denim scriverò una guida turistica: ⓕDove andare e cosa fare a Zenithiaⓖ!\nSarà un successone!\n@c0@"
  ja: "@a@bピピン「ボク　グランバニアに帰ったら\n\tじまんしちゃいますよ！\n\tだって　あの天空城にいるんですよ！\n@c0@"
37:
  de: "@a%0%a001240@bDas ist aber eine lange Leiter! Und es ist so dunkel hier...\n@c0@"
  en: "@a%0%a001240@bWhat a long ladder!\nAnd it's really dark too...\n@c0@"
  es: "@a%0%a001240@b¡Qué escalera más larga!\nY oscura también...\n@c0@"
  fr: "@a%0%a001240@bQu'est-ce qu'elle est longue cette échelleⓠ\nEn plus, il fait vraiment noir...\n@c0@"
  it: "@a%0%a001240@bMa quant'è lunga questa scalal?!\nQui è tutto buio, non si vede niente...\n@c0@"
  ja: "@a@b%a001240「長いハシゴだよね。\n\tまっくらだし……。\n@c0@"
38:
  de: "@a%0%a001250@bAlles in Ordnung. Solange ich nicht nach unten sehe, geht's mir gut.\n@c0@"
  en: "@a%0%a001250@bI'm okay. As long as I don't look down, I'm okay.\n@c0@"
  es: "@a%0%a001250@bEstoy bien. Mientras no mire hacia abajo, estoy bien.\n@c0@"
  fr: "@a%0%a001250@bÇa va. Tant que je ne regarde pas en bas, ça va.\n@c0@"
  it: "@a%0%a001250@bNon devo guardare in basso...\nNon devo guardare in basso...\nNon devo guardare in basso...\n@c0@"
  ja: "@a@b%a001250「大丈夫。\n\t下　見ないから　大丈夫……。\n@c0@"
39:
  de: "@a%0%a001240@bDas ist alles sehr seltsam. Was geht nur hier vor?\n@c0@"
  en: "@a%0%a001240@bThat all sounds a bit odd.\nWhat do you suppose has been going on?\n@c0@"
  es: "@a%0%a001240@bEso suena bastante raro.\n¿Qué estará pasando?\n@c0@"
  fr: "@a%0%a001240@bC'est vraiment bizarre. Qu'est-ce qui se passe,\nà ton avisⓡ\n@c0@"
  it: "@a%0%a001240@bMa che sta succedendo qui?!\nNon ci capisco più nulla!\n@c0@"
  ja: "@a@b%a001240「どうしたんだろう？\n\tなんだか　モメてるみたいだけど。\n@c0@"
40:
  de: "@aSancho@bDas ist alles sehr komisch, no?\n@c0@"
  en: "@aSancho@bEes very estrange, sí?\n@c0@"
  es: "@aSancho@bQué mafufo, chamaco.\n@c0@"
  fr: "@aSancho@bC-C'est vraiment étrange, noⓡ\n@c0@"
  it: "@aSancho@b¡Ay, que cosa estrana!\n@c0@"
  ja: "@a@bサンチョ「ふむ…　どうやら\n\tただごとでは　ないようですね。\n@c0@"
41:
  de: "@a%0%a001240@bAber, Papa! Dr. Ache ist doch kein Betrüger! Wir müssen ihm irgendwie helfen!\n@c0@"
  en: "@a%0%a001240@bBut Dad! Dr Agon's not evil!\nWe have to do something to help him.\n@c0@"
  es: "@a%0%a001240@b¡Pero papá! ¡El Dr. Agón no es malo!\nTenemos que hacer algo para ayudarle.\n@c0@"
  fr: "@a%0%a001240@bMais papa, le Dr Agon n'est pas méchantⓠ\nIl faut faire quelque chose pour l'aider.\n@c0@"
  it: "@a%0%a001240@bPapà, sono certo che il Dottor Agon non è una cattiva persona!\nDobbiamo fare qualcosa!\n@c0@"
  ja: "@a@b%a001240「お父さん！\n\tプサンさんは　悪い人じゃないよ！\n\tなんとか　してあげないと！\n@c0@"
42:
  de: "@aSancho@bDas dürfen wir nisst einfach zulassen, eh? Du musst etwas unternehmen, Chico.\n@c0@"
  en: "@aSancho@bWe can no just ignore thees, eh?\nYou must do esometheeng, My Majesty.\n@c0@"
  es: "@aSancho@bPues ni modo podemos ignorarlo.\nAhorita mismo tiene que hacer algo, Majestad.\n@c0@"
  fr: "@aSancho@bOn ne p-peut pas rester les bras c-croisés, heinⓡ T-Tu dois faire quelque chose, Ma Majesté.\n@c0@"
  it: "@aSancho@bChico, no podemos far fintas de nada...\nDobbiamo aiutare el señor Dottor Agon.\n@c0@"
  ja: "@a@bサンチョ「このまま　見過ごすわけには\n\tいきませんね。　%a000090王\n\tどうにか　なりませんか？\n@c0@"
43:
  de: "@a%0%a001250@bAaah. Es ist unheimlich, wenn ein Zenithianer so böse wird!\n@c0@"
  en: "@a%0%a001250@bYikes. It's scary seeing a Zenithian get angry\nlike that!\n@c0@"
  es: "@a%0%a001250@bVaya. ¡Da miedo ver cómo se enfadan los de Zenithia!\n@c0@"
  fr: "@a%0%a001250@bHiii. Ça fait peur de voir un Zénithien se mettre en colère comme çaⓠ\n@c0@"
  it: "@a%0%a001250@bAccipicchia!\nQuando si arrabbiano, gli Zenithiani diventano aggressivi e minacciosi!\n@c0@"
  ja: "@a@b%a001250「……ふぇ～ん。\n\t天空の人が怒ってて　こわいよお。\n@c0@"
44:
  de: "@aOtto@bHmpf! So, so, so... Welch eine interessante Wendung...\n@c0@"
  en: "@aTuppence@bHmph! Well, well, well...\nWhat a turn-up for the books!\n@c0@"
  es: "@aAlazar@b¡Umf! Vaya, vaya, vaya...\n¡Pero quién me lo iba a decir!\n@c0@"
  fr: "@aInnocent@bMmpfⓠ Tiens, tiens, tiens...\nQuel rebondissementⓠ\n@c0@"
  it: "@aSimon@bAh-ah!\nLo sapevo io che quel tipo puzzava di losco!\n@c0@"
  ja: "@a@bピピン「むっ！？　むむむっ！？\n\tこ…これは　どういうことか！？\n@c0@"
45:
  de: "@aOtto@bFalls dieser Dr. Ache tatsächlich net das ist, wofür er sich ausgibt, könnt Ihr Euch meiner Hilfe gewiss sein, %a000090.\n@c0@"
  en: "@aTuppence@bWell, %a000090, you know you can count on me to help you put this Dr Agon in his place if he isn't what he seems.\n@c0@"
  es: "@aAlazar@bBien, %a000090, podéis contar conmigo para poner a ese tal Dr. Agón en su sitio si no es quién parece ser.\n@c0@"
  fr: "@aInnocent@b%0%a000090, vous savez que vous pouvez compter sur moi pour régler son compte au Dr Agon s'il n'est pas celui qu'il prétend être.\n@c0@"
  it: "@aSimon@bRe %a000090, se le serve aiuto per smascherare quell'impostore del Dottor Agon, conti pure su di me!\n@c0@"
  ja: "@a@bピピン「%a000090さま！\n\tもし　あやしいヤツなら　いっしょに\n\tプサンを　とっちめてやりましょう！\n@c0@"
46:
  de: "@a%0%a001240@bDr. Ache ist kein böser Mann, Papa! Da bin ich mir ganz sicher!\n@c0@"
  en: "@a%0%a001240@bDr Agon isn't a bad man, Dad!\nI just know he isn't.\n@c0@"
  es: "@a%0%a001240@b¡El Dr. Agón no es un mal hombre, papá!\nYo sé que no lo es.\n@c0@"
  fr: "@a%0%a001240@bLe Dr Agon n'est pas méchant, papaⓠ J'en suis sûr.\n@c0@"
  it: "@a%0%a001240@bPapà, possiamo fidarci del Dottor Agon!\nNon è un uomo cattivo!\nNe sono sicurissimo!\n@c0@"
  ja: "@a@b%a001240「お父さんっ！\n\tプサンさんは　悪い人じゃないよ！\n\tボクには　わかるもん！\n@c0@"
47:
  de: "@a%0%a001250@bIch bin richtig nervös! Was wohl passieren würde, wenn wir ihm die Kugel einfach geben?\n@c0@"
  en: "@a%0%a001250@bI feel so nervous! I wonder what would happen if we gave him the orb.\n@c0@"
  es: "@a%0%a001250@b¡Estoy tan nerviosa! Me pregunto qué pasaría si le diéramos el orbe.\n@c0@"
  fr: "@a%0%a001250@bJ'ai peurⓠ Je me demande ce qui se serait passé si on lui avait donné l'orbe.\n@c0@"
  it: "@a%0%a001250@bAccidentaccio, che situazione difficile!\nCosa succederebbe se gli dessimo il globo...?\n@c0@"
  ja: "@a@b%a001250「むねが　ドキドキする……。\n\tそのオーブ　わたしたら\n\tどうなっちゃうの？\n@c0@"
48:
  de: "@aSancho@bMan kann nie wissen, was passiert, eh? Das alles gefällt mir gar nisst...\n@c0@"
  en: "@aSancho@bYou never know what ees gonna happen, eh?\r\nI no like thees...\n@c0@"
  es: "@aSancho@bPues nunca se sabe lo que va a pasar, ¿eh?\nNo tiene buena pinta...\n@c0@"
  fr: "@aSancho@bOn ne sait jamais ce qui p-peut arriver, heinⓡ\nJ-Je n'aime pas ça...\n@c0@"
  it: "@aSancho@b¡Ay, que situación!\n¿Y ahora que facciamo?\n@c0@"
  ja: "@a@bサンチョ「何が　起こるか\n\tわかりませんからね……。\n\tうむむ…　どうしたものか。\n@c0@"
49:
  de: "@a%0%a001240@bWow!\n@c0@"
  en: "@a%0%a001240@bWow!\n@c0@"
  es: "@a%0%a001240@b¡Vaya!\n@c0@"
  fr: "@a%0%a001240@bWaouhⓠ\n@c0@"
  it: "@a%0%a001240@bNon ci posso credere...\n@c0@"
  ja: "@a@b%a001240「あ…お…お父さん！\n@c0@"
50:
  de: "@a%0%a001240@bNa, wenn das keine Überraschung ist! Hättest du damit gerechnet, Papa?\n@c0@"
  en: "@a%0%a001240@bTh-That was a surprise!\nI didn't see that coming, did you, Dad?\n@c0@"
  es: "@a%0%a001240@b¡Menuda sorpresa!\nNo me lo esperaba, ¿y tú papá?\n@c0@"
  fr: "@a%0%a001240@bJ-J'en reviens pasⓠ Je ne m'attendais vraiment pas à ça. Et toi, papaⓡ\n@c0@"
  it: "@a%0%a001240@bQuesta sì che è una sorpresa!\nPapà, ti saresti mai aspettato una cosa del genere?\n@c0@"
  ja: "@a@b%a001240「び…びっくりした！\n\t本当に　びっくりした！\n@c0@"
51:
  de: "@a%0%a001250@bDer Zenithdrache... Also war Dr. Ache die ganze Zeit der Zenithdrache!\n@c0@"
  en: "@a%0%a001250@bThe Zenith Dragon... So Dr Agon was the\nZenith Dragon all along!\n@c0@"
  es: "@a%0%a001250@bEl Dragón de Zenithia... ¡Así que Dr. Agón era el Dragón de Zenithia!\n@c0@"
  fr: "@a%0%a001250@bLe Dragon du Zénith... Le Dr Agon était en fait le Dragon du Zénithⓠ\n@c0@"
  it: "@a%0%a001250@bIl Drago di Zenithia...\nIl Dottor Agon è il Drago di Zenithia!\nIncredibile...!\n@c0@"
  ja: "@a@b%a001250「マスタードラゴン……\n\tあの…プサンさんが　本当は\n\tマスタードラゴンだったの？\n@c0@"
52:
  de: "@aSancho@bWenn man viel reist, erwarten einen viele Überraschungen. Aber das...? No, damit hatte iss nisst gerechnet.\n@c0@"
  en: "@aSancho@bWhen you travel, many, many theengs, they surprise you. But thees...?\r\nNo, I no believe thees.\n@c0@"
  es: "@aSancho@bPues cuando se viaja se ven cosas bien sorprendentes. P-Pero esto...\nNo me lo puedo creer.\n@c0@"
  fr: "@aSancho@bQuand t-tu voyages, il y a beacoup de choses\r\ns-surprenantes, mais là... J-Je n'arrive pas à y\r\nc-croire.\n@c0@"
  it: "@aSancho@b¡Nel nuestro viaggio abbiamo visto muchas cosas incredibiles, ma esta las batte todas!\n@c0@"
  ja: "@a@bサンチョ「旅に　不思議は\n\tつきものですが　いやはや\n\tこればかりは　信じられません。\n@c0@"
53:
  de: "@aSancho@bEs, es... trifft miss wie eine Armada!\n@c0@"
  en: "@aSancho@bEes, ees... Eet hits you like the armada!\n@c0@"
  es: "@aSancho@bEs, es... ¡Es cual golpiza inesperada!\n@c0@"
  fr: "@aSancho@bÇa... Ça te tombe dessus et tu ne t'en remets p-pasⓠ\n@c0@"
  it: "@aSancho@bSoy senza palabras...\n@c0@"
  ja: "@a@bサンチョ「しかし　う～む……\n\tなんたることでしょうか！？\n@c0@"
54:
  de: "@aOtto@bUnd Dr. Ache war tatsächlich der Zenithdrache...\n@c0@"
  en: "@aTuppence@bTo think that Dr Agon was actually the\r\nZenith Dragon...\n@c0@"
  es: "@aAlazar@bY pensar que el Dr. Agón era en realidad el Dragón de Zenithia...\n@c0@"
  fr: "@aInnocent@bDire que le Dr Agon était en fait le Dragon du Zénith...\n@c0@"
  it: "@aSimon@bGulp!\n...\nIl Dottor Agon è il Drago di Zenithia...\n@c0@"
  ja: "@a@bピピン「プサン…　いえ　プサンさまが\n\tマスタードラゴンだったなんて……。\n@c0@"
55:
  de: "@aOtto@bVergebt mir meine Ignoranz, liebster Drache, ich hatte ja keine Ahnung!\n@c0@"
  en: "@aTuppence@bForgive me, o Great One, for my ignorance!\n@c0@"
  es: "@aAlazar@b¡Perdona mi ignorancia, oh Magnífico!\n@c0@"
  fr: "@aInnocent@bExcusez mon ignorance, ô Uniqueⓠ\n@c0@"
  it: "@aSimon@bMi prostro ai tuoi piedi...\nEhm, mi prostro alle tue zampe e chiedo umilmente perdono, o potente Drago!\n@c0@"
  ja: "@a@bピピン「うわ～　ごめんなさい。\n\tボクに　バチ　当てないでください～！\n@c0@"
56:
  de: "@a%0%a001240@bIch habe seine menschliche Form sehr gemocht.\n@c0@"
  en: "@a%0%a001240@bI quite liked his human form, actually.\n@c0@"
  es: "@a%0%a001240@bEn realidad me gustaba su forma humana.\n@c0@"
  fr: "@a%0%a001240@bJ'aimais bien sa forme humaine, en fait.\n@c0@"
  it: "@a%0%a001240@bIl Dottor Agon era un simpaticone...\n@c0@"
  ja: "@a@b%a001240「ボクは\n\tあの　人間だったプサンさんも\n\t好きだけどなあ。\n@c0@"
57:
  de: "@a%0%a001240@bAber es ist schön zu sehen, dass er wieder ganz er selbst ist. Ich meine, er ist echt toll!\n@c0@"
  en: "@a%0%a001240@bBut it is good to see him back to his true self.\nI mean, he's pretty cool!\n@c0@"
  es: "@a%0%a001240@bPero me alegra ver su verdadero yo.\nQuiero decir, ¡que está muy bien!\n@c0@"
  fr: "@a%0%a001240@bMais c'est sympa de le voir tel qu'il est.\nC'est quand même balèzeⓠ\n@c0@"
  it: "@a%0%a001240@bMa il Drago di Zenithia è troppo forte!\n@c0@"
  ja: "@a@b%a001240「でも　やっぱり\n\t本当の姿の方がいいね。\n\tだって　かっこいいもん！\n@c0@"
58:
  de: "@a%0%a001250@bUnd er ist wirklich der Zenithdrache? Das ist alles wie ein schöner Traum...\n@c0@"
  en: "@a%0%a001250@bIs that really the Zenith Dragon in the flesh?\nThis is like living a dream.\n@c0@"
  es: "@a%0%a001250@b¿Es realmente el Dragón de Zenithia en carne y hueso?\nEs como un sueño hecho realidad.\n@c0@"
  fr: "@a%0%a001250@bC'est vraiment le Dragon du Zénith en chair et\nen osⓡ J'ai l'impression d'être dans un rêve.\n@c0@"
  it: "@a%0%a001250@bQuello è il Drago di Zenithia...\nÈ qui, davanti ai miei occhi.\nMi sembra di sognare...\n@c0@"
  ja: "@a@b%a001250「本当に　本物の\n\tマスタードラゴンさん？\n\t……夢を　見てるみたい。\n@c0@"
59:
  de: "@aSancho@bDass der Zenithdrache dir seine Dank aussprisst, das... das ist...\n@c0@"
  en: "@aSancho@bTo have the Zenith Dragon esay gracias to you, ees, ees...\n@c0@"
  es: "@aSancho@bPues tener al Dragón de Zenithia gracias a tus acciones, es...\n@c0@"
  fr: "@aSancho@bQue le D-Dragon du Zénith te dise gracias, c'est...\n@c0@"
  it: "@aSancho@bEl Drago de Zenithia ce ringrazia por averlo salvato...\nNo ce posso credere...\n@c0@"
  ja: "@a@bサンチョ「伝説のマスタードラゴンから\n\t礼を　言われるとは……。\n@c0@"
60:
  de: "@aOtto@bTja, nun. Da war er wohl ziemlich machtlos.\n@c0@"
  en: "@aTuppence@bYes, well. He was rather powerless.\n@c0@"
  es: "@aAlazar@bSí, bueno. No parecía demasiado poderoso.\n@c0@"
  fr: "@aInnocent@bEh oui. Il ne pouvait pas faire grand-chose.\n@c0@"
  it: "@aSimon@bBeh, in effetti, senza il mio aiuto il Drago di Zenithia si sarebbe trovato a mal partito...\n@c0@"
  ja: "@a@bピピン「ぷっ…！\n\t本当に　非力でしたもんね。\n@c0@"
61:
  de: "@aOtto@bUps! Das sollte natürlich keine Beleidigung sein!\n@c0@"
  en: "@aTuppence@bOops! Not that I mean any offence, of course!\n@c0@"
  es: "@aAlazar@b¡Huy! Sin ánimo de ofender, ¡claro está!\n@c0@"
  fr: "@aInnocent@bOupsⓠ N'y voyez rien d'insultant, heinⓠ\n@c0@"
  it: "@aSimon@bIl SUO aiuto, Maestà!\nVolevo dire il SUO aiuto!\nDea santissima, fammi perdere la voce...\n@c0@"
  ja: "@a@bピピン「あっ！　ボクってば\n\tまた　失礼なことを！！\n@c0@"
62:
  de: "@aBianca@bUnd der Zenithdrache hat sich tatsächlich als schusseliger Mann ausgegeben?\n@c0@"
  en: "@aBianca@bSo the Zenith Dragon was masqueradin' as a bumblin' middle-aged man?\n@c0@"
  es: "@aBianca@bEntonces, ¿el Dragón de Zenithia se ocultaba bajo un pobre hombre de mediana edad?\n@c0@"
  fr: "@aBianca@bAlors comme ça, le Dragon du Zénith avait pris la forme d'un petit bonhomme maladroitⓡ\n@c0@"
  it: "@aBianca@bIl Drago di Zenithia aveva finto di essere un essere umano qualsiasi?\n@c0@"
  ja: "@a@bビアンカ「マスタードラゴンって\n\tゆかいな　おじさんに　なってたの？\n@c0@"
63:
  de: "@aBianca@bWie gern hätte ich das gesehen!\n@c0@"
  en: "@aBianca@bWhat I'd give to have bin able to see that!\n@c0@"
  es: "@aBianca@b¡Me hubiera encantado verlo!\n@c0@"
  fr: "@aBianca@bJ'aurais vraiment aimé voir çaⓠ\n@c0@"
  it: "@aBianca@bMi sa che mi sono persa una scena unica e irripetibile...\n@c0@"
  ja: "@a@bビアンカ「ふ～ん…\n\t私も　一度　見てみたかったな。\n@c0@"
64:
  de: "@aNera@bDer große Zenithdrache... Ich bin überwältigt.\n@c0@"
  en: "@aNera@bThe great Zenith Dragon...\nI'm quite overwhelmed.\n@c0@"
  es: "@aNera@bEl gran Dragón de Zenithia...\nSono veramente abrumada.\n@c0@"
  fr: "@aNera@bLe grand Dragon du Zénith...\r\nJe n'en reviens pas.\n@c0@"
  it: "@aNera@bIl potente Drago di Zenithia...\nSono senza parole...\n@c0@"
  ja: "@a@bフローラ「マスタードラゴンさま……\n\tぽっ……。\n@c0@"
65:
  de: "@a%0%a001240@bSei's drum. Schließlich kannte keiner von uns seine wahre Identität.\n@c0@"
  en: "@a%0%a001240@bWell, it can't be helped. There's no way any of us could've known his true identity.\n@c0@"
  es: "@a%0%a001240@bEra imposible. Nunca hubiéramos podido adivinar su verdadera identidad.\n@c0@"
  fr: "@a%0%a001240@bOn n'y peut rien. Personne n'aurait pu deviner qui il était en vrai.\n@c0@"
  it: "@a%0%a001240@bBeh, nessuno di noi avrebbe mai potuto sospettare che sotto le spoglie del Dottor Agon si celasse il Drago di Zenithia...\n@c0@"
  ja: "@a@b%a001240「しょうがないよね。\n\t誰だって　ぜったい\n\tわからなかったと思うよ！\n@c0@"
66:
  de: "@aSancho@bAber er wollte ja nur Zenithia schützen, no? Darum er hat angezweifelt Señor Ache. Das ist keine Schmach...\n@c0@"
  en: "@aSancho@bBut ees because he was trying to protect Zenithia, sí? Thees ees why he doubted señor Agon. Ees notheeng to be ashamed.\n@c0@"
  es: "@aSancho@bPero nomás intentaba proteger Zenithia, ¿no? Por eso dudaba del señor Agón. ¡No hay nada de lo que avergonzarse!\n@c0@"
  fr: "@aSancho@bMais il a f-fait ça pour protéger Zénithia, noⓡ\nC'est pour ça qu'il a d-douté du señor Agon.\nIl ne doit p-pas avoir honte.\n@c0@"
  it: "@aSancho@bQuello Zenithiano ha dubitato del Drago de Zenithia por qué piensava que era un impostor, y voleva defendere la sua patria. No ha fatto nada de mal.\n@c0@"
  ja: "@a@bサンチョ「天空城を　守るために\n\tしたことと思えば　なにも\n\tはずかしいことはないですよ。\n@c0@"
67:
  de: "@aOtto@bMeine Treulosigkeit empfinde ich auch als große Schmach...\n@c0@"
  en: "@aTuppence@bI also feel great shame for my faithlessness.\n@c0@"
  es: "@aAlazar@bYo también me avergüenzo de mi falta de fe.\n@c0@"
  fr: "@aInnocent@bMoi aussi, j'ai honte de ne pas lui avoir fait confiance.\n@c0@"
  it: "@aSimon@bChiedo perdono per la mia ignoranza!\nChiedo perdono per la mia insolenza!\nChiedo perdono per tutto!\n@c0@"
  ja: "@a@bピピン「ボクも　はずかしい……。\n@c0@"
68:
  de: "@a%0%a001240@bIch bin froh, dass der Zenithdrache wieder voll da ist. Da bin ich gleich viel zuversichtlicher.\n@c0@"
  en: "@a%0%a001240@bIt's a relief to know that the Zenith Dragon is back on form again. I feel much more confident about everything now.\n@c0@"
  es: "@a%0%a001240@bEs un alivio saber que el Dragón de Zenithia ha vuelto a recuperar su forma. Ahora me siento más seguro.\n@c0@"
  fr: "@a%0%a001240@bJe suis soulagé que le Dragon du Zénith\nait repris sa forme. Je me sens beaucoup\nplus confiant, maintenant.\n@c0@"
  it: "@a%0%a001240@bSono proprio contento che il Drago di Zenithia sia tornato alla sua forma originaria.\nAdesso mi sento molto più tranquillo...\n@c0@"
  ja: "@a@b%a001240「マスタードラゴンが\n\t復活したなら　心強いよね！\n\tボクも　ちょっと　気が楽になったよ。\n@c0@"
69:
  de: "@aSancho@bDann brauchen wir uns um Zenithia keine Sorgen mehr zu machen, eh?\n@c0@"
  en: "@aSancho@bWe no need to worry about Zenithia no more, eh?\n@c0@"
  es: "@aSancho@bPues ya no tenemos que preocuparnos por Zenithia, ¿eh?\n@c0@"
  fr: "@aSancho@bOn n'a plus b-besoin de s'inquiéter pour Zénithia, maintenant, heinⓡ\n@c0@"
  it: "@aSancho@bAhora no dobbiamo más preoccuparce della sorte de Zenithia, chico...\n@c0@"
  ja: "@a@bサンチョ「これで　天空城は\n\t心配いらないですね。\n@c0@"
70:
  de: "@a%0%a001240@bEr hat recht. Wir haben immer noch eine Schlacht auszufechten. Am besten machen wir uns sofort auf den Weg!\n@c0@"
  en: "@a%0%a001240@bI suppose he's right. We still have a battle to win. We'd better get to it, then!\n@c0@"
  es: "@a%0%a001240@bSupongo que es verdad. Nos queda una batalla por ganar. ¡Será mejor que nos pongamos manos a la obra!\n@c0@"
  fr: "@a%0%a001240@bIl a sûrement raison. On a un combat à mener.\nOn ferait mieux de s'y mettre, alorsⓠ\n@c0@"
  it: "@a%0%a001240@bHa ragione.\nAbbiamo ancora molte battaglie da combattere.\nLa nostra avventura non è finita.\n@c0@"
  ja: "@a@b%a001240「そっか　まだ　たたかいは\n\tこれからなんだね。\n\tよ～し！　がんばるぞ！！\n@c0@"
71:
  de: "@a%0%a001250@bDer alte Mann sitzt die ganze Zeit in diesem Loch, da kann er ja nicht viel von der Außenwelt mitbekommen...\n@c0@"
  en: "@a%0%a001250@bThat old man can't know much about what's going on in the outside world, being holed up here all the time.\n@c0@"
  es: "@a%0%a001250@bEse pobre hombre no debe saber mucho del mundo exterior si ha estado encerrado tanto tiempo aquí.\n@c0@"
  fr: "@a%0%a001250@bCe vieux monsieur ne sait sûrement pas ce qui se passe dans le monde extérieur, vu qu'il a passé tout son temps ici.\n@c0@"
  it: "@a%0%a001250@bAnche quell'uomo deve combattere?!\n@c0@"
  ja: "@a@b%a001250「あのおじいさん\n\tこんなところにいるから\n\t外のようすが　わからないんだね。\n@c0@"
72:
  de: "@a%0%a001250@bEs ist gut, dass wir ihm die Neuigkeiten vom Zenithdrachen überbracht haben.\n@c0@"
  en: "@a%0%a001250@bIt's good that we passed on the news about the Zenith Dragon.\n@c0@"
  es: "@a%0%a001250@bEs una suerte que hayamos propagado la noticia sobre el Dragón de Zenithia.\n@c0@"
  fr: "@a%0%a001250@bC'est bien qu'on leur ait dit que le Dragon du Zénith était revenu.\n@c0@"
  it: "@a%0%a001250@bAlla sua età?!\n...\nMa a quanti anni si va in pensione a Zenithia?!\n@c0@"
  ja: "@a@b%a001250「マスタードラゴンのこと\n\t教えてあげて　よかったね。\n@c0@"
73:
  de: "@a%0%a001240@bAber so viel hat Dr. Ache doch gar nicht getan, oder?\n@c0@"
  en: "@a%0%a001240@bDr Agon didn't exactly have to do all that much, though, did he?\n@c0@"
  es: "@a%0%a001240@bEl Dr. Agón tampoco tuvo tanto que ver, ¿verdad?\n@c0@"
  fr: "@a%0%a001240@bEn fait, le Dr Agon n'a pas eu grand-chose\nà faire, heinⓡ\n@c0@"
  it: "@a%0%a001240@bBeh, non è che il Dottor Agon abbia fatto poi tanto...\n@c0@"
  ja: "@a@b%a001240「プサンさんは　たぶん\n\tそんなに苦労してないと\n\t思うけど……。\n@c0@"
74:
  de: "@a%0%a001240@bNa ja, wir haben jetzt keine Zeit, das zu diskutieren...\n@c0@"
  en: "@a%0%a001240@bOh well. It's hardly worth going into that now.\n@c0@"
  es: "@a%0%a001240@bEn fin. No vale la pena entrar en detalles.\n@c0@"
  fr: "@a%0%a001240@bMais peu importe. Ce n'est pas la peine de rentrer dans ce genre de détails maintenant.\n@c0@"
  it: "@a%0%a001240@bMa forse è meglio non parlarne in giro, eh?\n@c0@"
  ja: "@a@b%a001240「でも　まあいっか！\n\t説明するの　めんどくさいもんね！\n@c0@"
75:
  de: "@a%0%a001240@bDer Zenithdrache ist wirklich erstaunlich. Glaubst du, er kann noch höher fliegen als das Schloss?\n@c0@"
  en: "@a%0%a001240@bThe Zenith Dragon's really amazing. Do you think he can fly even higher than the castle?\n@c0@"
  es: "@a%0%a001240@bEl Dragón de Zenithia es verdaderamente sorprendente. ¿Podrá volar más alto que el castillo?\n@c0@"
  fr: "@a%0%a001240@bLe Dragon du Zénith est vraiment incroyable.\nTu crois qu'il peut voler encore plus haut que\nle châteauⓡ\n@c0@"
  it: "@a%0%a001240@bChissà se il Drago di Zenithia può volare persino più in alto del castello... Non mi stupirei se ne fosse capace, sai? È una creatura eccezionale!\n@c0@"
  ja: "@a@b%a001240「マスタードラゴンって\n\tすごいんだね！　今の天空城より\n\t高く　飛べるんじゃないかな？\n@c0@"
76:
  de: "@aBianca@bIch hätte mir nie träumen lassen, eines Tages Zenithia zu Gesicht zu bekommen.\n@c0@"
  en: "@aBianca@bI never imagined for one minute that I'd ever have the chance to visit Zenithia.\n@c0@"
  es: "@aBianca@b¡No me lo puedo creer! ¡Yo visitando Zenithia!\n@c0@"
  fr: "@aBianca@bJe n'aurais jamais imaginé que j'aurais l'occasion de visiter Zénithia un jour.\n@c0@"
  it: "@aBianca@bMai e poi mai avrei pensato di vedere Zenithia con i miei occhi...\n@c0@"
  ja: "@a@bビアンカ「まさか\n\t天空城に　来られるなんて\n\t思ってもみなかったわ。\n@c0@"
77:
  de: "@aBianca@bIch bin ziemlich aus dem Häuschen... Wer weißt, vielleicht liegt das an meinem zenithianischen Blut?\n@c0@"
  en: "@aBianca@bI can't help feelin' a bit out of sorts. Maybe it's my Zenithian blood at work.\n@c0@"
  es: "@aBianca@bAunque estoy un poco nerviosa, tú. Va a ser la sangre de Zenithia que corre por mis venas.\n@c0@"
  fr: "@aBianca@bJe ne me sens pas tout à fait dans mon assiette. C'est peut-être mon sang zénithien qui se manifeste.\n@c0@"
  it: "@aBianca@bPercepisco qualcosa di strano in me...\nDev'essere il mio sangue zenithiano che sente aria di casa...\n@c0@"
  ja: "@a@bビアンカ「なんだか　ふしぎな感情が\n\tこみ上げてくる……。\n\t私の　天空の血のせいかしら。\n@c0@"
78:
  de: "@aNera@bDas ist also die Heimat meiner Vorfahren... Aber nun gehöre ich zu dir und zu Humburg, %a000090.\n@c0@"
  en: "@aNera@bSo this is the home of my ancestors...\nBut I belong with you now, in Gotha.\n@c0@"
  es: "@aNera@bAsí que esta es la terra de mis antepasados...\nMa ahora me debo a Pankraz, junto a ti.\n@c0@"
  fr: "@aNera@bAinsi, c'est de là que viennent mes ancêtres...\r\nMais maintenant, c'est à Gotha que j'appartiens.\n@c0@"
  it: "@aNera@bQuesta è la terra dei miei antenati.\nMa la mia casa è a Denim, accanto a te.\n@c0@"
  ja: "@a@bフローラ「ここが　私のご先祖さまの……。\n\tでも　私の帰る場所は　あなたのいる\n\tグランバニアだけですわ。\n@c0@"
79:
  de: "@aNera@bMeine Gefühle stehen Kopf: Ich bin ruhig und aufgedreht zugleich!\n@c0@"
  en: "@aNera@bBeing here makes me feel relaxed and on edge all at the same time!\n@c0@"
  es: "@aNera@b¡Cuando estoy aquí me siento relajada y nerviosa insieme!\n@c0@"
  fr: "@aNera@bIci, je me sens à la fois détendue et à fleur de peauⓠ\n@c0@"
  it: "@aNera@bDovrei essere tranquilla, e invece mi sento molto nervosa...\n@c0@"
  ja: "@a@bフローラ「ここにいると　落ちつくような\n\t落ちつかないような……。\n@c0@"
80:
  de: "@aNera@bErklären kann ich das nicht, aber irgendetwas in meinem Herzen will einfach nicht zur Ruhe kommen.\n@c0@"
  en: "@aNera@bI can't really explain it, but something in my heart just won't settle.\n@c0@"
  es: "@aNera@bNo sé cómo explicarlo, ma algo vibra en il mio cuore.\n@c0@"
  fr: "@aNera@bJe ne saurais pas vraiment expliquer ce que c'est, mais je ressens quelque chose dans mon cœur.\n@c0@"
  it: "@aNera@bIo...\nNon so cosa mi stia succedendo, ma il cuore mi batte all'impazzata...\n@c0@"
  ja: "@a@bフローラ「うまく　言えませんけど\n\tなんだか　心が　ざわめきますの。\n@c0@"
81:
  de: "@a%0%a001240@bEs ist gar nicht so einfach, sich in Zenithia zurechtzufinden...\n@c0@"
  en: "@a%0%a001240@bZenithia is certainly a fairly tricky place to find your way around!\n@c0@"
  es: "@a%0%a001240@b¡Moverse por Zenithia es realmente lioso!\n@c0@"
  fr: "@a%0%a001240@bC'est quand même pas facile de trouver son chemin dans Zénithiaⓠ\n@c0@"
  it: "@a%0%a001240@bNon è affatto facile orientarsi a Zenithia...\n@c0@"
  ja: "@a@b%a001240「天空城って　けっこう\n\tふくざつな造りに　なってるんだね。\n@c0@"
82:
  de: "@a%0%a001240@bSchwebt das Schloss immer nur über dem Boden? Ich möchte mal sehen, wie es sich hoch in den Himmel erhebt!\n@c0@"
  en: "@a%0%a001240@bCan the castle still only fly low to the ground?\nI want to see it float right up to the heavens!\n@c0@"
  es: "@a%0%a001240@b¿El castillo solo puede volar bajo?\n¡Me gustaría verlo surcar en lo más alto!\n@c0@"
  fr: "@a%0%a001240@bLe château ne peut toujours voler qu'en\nrase-mottesⓡ Je voudrais bien le voir\nflotter très haut dans le cielⓠ\n@c0@"
  it: "@a%0%a001240@bMa il castello vola solo a bassa quota?!\nIo voglio salire tra le nuvole!\n@c0@"
  ja: "@a@b%a001240「天空城は　まだ\n\t低くしか　飛ばないのかな？\n\t天の上まで飛ぶ姿　見てみたいよね！\n@c0@"
83:
  de: "@a%0%a001250@bAlles scheint getrocknet zu sein. Und es herrscht auch eine viel bessere Stimmung im Schloss.\n@c0@"
  en: "@a%0%a001250@bIt looks like things have dried out nicely. The castle has a much happier feel to it now.\n@c0@"
  es: "@a%0%a001250@bParece que las cosas se han secado. Ahora el castillo está más alegre.\n@c0@"
  fr: "@a%0%a001250@bOn dirait que tout est bien sec, maintenant.\nLe château a l'air beaucoup plus gai.\n@c0@"
  it: "@a%0%a001250@bOra che il castello è quasi del tutto asciutto, si respira un'aria decisamente più allegra!\n@c0@"
  ja: "@a@b%a001250「お城の中も\n\tだいぶ　かわいたみたいね。\n\tお城さんも　うれしそう。\n@c0@"
84:
  de: "@a%0%a001250@bFrüher lag Zenithia noch viel, viel höher, nicht wahr? Da haben wir ja Glück, dass wir nicht noch höher klettern mussten...\n@c0@"
  en: "@a%0%a001250@bZenithia used to be much, much higher all those\nyears ago, didn't it? We're lucky we didn't have to climb so high.\n@c0@"
  es: "@a%0%a001250@bZenithia solía estar muchísimo más alta antes, ¿verdad? Qué suerte que nosotros no hayamos tenido que subir tanto.\n@c0@"
  fr: "@a%0%a001250@bZénithia était bien plus haut autrefois, heinⓡ\nOn a de la chance de ne pas avoir eu à grimper\nsi haut.\n@c0@"
