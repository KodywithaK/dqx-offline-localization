  es: "@aAlazar@b¡Con tanta bailarina por todas partes, no sé dónde mirar!\n@c0@"
  fr: "@aInnocent@bJe ne sais plus où donner de la tête avec toutes ces superbes danseuses partoutⓠ\n@c0@"
  it: "@aSimon@bDiamine!\nQui cambiano stella dello spettacolo più spesso di quanto io cambi le mu...\n㈡\nEhm, più spesso di quanto io cambi le museruole ai cani di corte.\nGià. Le museruole...\n@c0@"
  ja: "@a@bピピン「ステキな踊り娘さんが　いっぱいで\n\t目移りしてしまいます。\n@c0@"
236:
  de: "@aBianca@bHe! Was hast du denn vor? Du willst doch wohl nicht einfach so da reinplatzen?\n@c0@"
  en: "@aBianca@bHey! What d'you think you're doin'? You think it's alright to go bargin' in on people like that, do you?\n@c0@"
  es: "@aBianca@b¡Eh! ¿Qué haces? No debes entrar en los sitios como un elefante en una cacharrería, ¿sabes?\n@c0@"
  fr: "@aBianca@bHéⓠ Tu lui as fait une peur bleueⓠ Tu crois vraiment que c'est une bonne idée de surprendre les gens comme çaⓡ\n@c0@"
  it: "@aBianca@bChe fai, %a000090?\nTi interessi alle altre ragazze?!\nMa ti ricordi che sei un uomo sposato?!\n@c0@"
  ja: "@a@bビアンカ「なによ。\n\tもしかして　もっと　お風呂を\n\tのぞいていたかったの？\n@c0@"
237:
  de: "@aBianca@bBah! Wenn Ludwig im Himmel dich jetzt sehen könnte, würde er bittere Tränen der Enttäuschung über dich weinen!\n@c0@"
  en: "@aBianca@bPah! Pankraz must be cryin' tears of disappointment if he's lookin' down on you\r\nnow from heaven!\n@c0@"
  es: "@aBianca@bBueno, piensa en los demás de vez en cuando, ¿me entiendes?\n@c0@"
  fr: "@aBianca@bTrès drôle. On verra si tu trouveras ça toujours aussi amusant quand je te ferai la même chose.\n@c0@"
  it: "@aBianca@bSì?\nAllora dimostralo smettendo di guardare tutte le donne che incontri!\n@c0@"
  ja: "@a@bビアンカ「もう！\n\t今の%a000090を　見たら\n\t天国のパパスさんが　泣くわよ。\n@c0@"
238:
  de: "@aBianca@bDiese Antwort wollte ich hören. Gehen wir also.\n@c0@"
  en: "@aBianca@bRight answer.\nSo let's go.\n@c0@"
  es: "@aBianca@bPues a ver si aprendes, no se puede pegar esos sustos a la gente, ¿me entiendes?\n@c0@"
  fr: "@aBianca@bBonne réponse.\nAllons-nous-en.\n@c0@"
  it: "@aBianca@bAh, no?!\nAllora sarò costretta a rinfrescarti la memoria a suon di ceffoni!\n@c0@"
  ja: "@a@bビアンカ「そうよね。\n\tじゃあ　行きましょう。\n@c0@"
239:
  de: "@aNera@bNa schön, du hast es so gewollt!\n@c0@"
  en: "@aNera@bI've made up my mind!\n@c0@"
  es: "@aNera@b¡Ma, caro %a000090!\n@c0@"
  fr: "@aNera@bC'est décidéⓠ\n@c0@"
  it: "@aNera@bHo deciso...\n@c0@"
  ja: "@a@bフローラ「私　決めました！\n@c0@"
240:
  de: "@aNera@bIch werde dich demnächst auch mal erschrecken ⓚⓛ dann sehen wir ja, wie dir das gefällt!\n@c0@"
  en: "@aNera@bI'm going to give you a nasty surprise one of these days and see how you like it!\n@c0@"
  es: "@aNera@b¿Es que nadie te ha explicado que hay que llamar a la porta antes de entrar?\n@c0@"
  fr: "@aNera@bUn jour, au moment où tu t'y attendras le moins, moi aussi je ferai irruption comme ça... et on verra ce que ça te faitⓠ\n@c0@"
  it: "@aNera@bD'ora in avanti anch'io guarderò altri uomini.\nPoi mi farai sapere se la cosa ti infastidisce oppure no...\n@c0@"
  ja: "@a@bフローラ「私も　あなたと同じように\n\t今度　男の方のお風呂を\n\tのぞいてきますわっ！\n@c0@"
241:
  de: "@a%0%a001240@bEin Bad wäre schön. Ich würde auch gern eins nehmen!\n@c0@"
  en: "@a%0%a001240@bA bath would be nice. I wouldn't mind one too.\n@c0@"
  es: "@a%0%a001240@bUn baño estaría bien. ¡No me importaría darme uno!\n@c0@"
  fr: "@a%0%a001240@bÇa serait bien, un bain. Moi aussi j'aimerais bien\nen prendre unⓠ\n@c0@"
  it: "@a%0%a001240@bPapà, devo andare in bagno...\n@c0@"
  ja: "@a@b%a001240「お風呂　気持ちよさそう。\n\tボクも　いっしょに\n\t入っちゃおっかな！\n@c0@"
242:
  de: "@aOtto@bDa habts Euch aber jetzt net unbedingt sehr beliebt g'macht, %a000090.\n@c0@"
  en: "@aTuppence@bI don't think you made yourself very popular there, %a000090!\n@c0@"
  es: "@aAlazar@b¡Muy bonito, %a000090!\n@c0@"
  fr: "@aInnocent@bOn ne peut pas dire que vous vous soyez fait une amie sur ce coup-là, %a000090ⓠ\n@c0@"
  it: "@aSimon@bMaestà, ha visto qualcosa di interessante?\nRacconti, racconti pure...\n@c0@"
  ja: "@a@bピピン「%a000090さま　ナイスですっ！\n@c0@"
243:
  de: "@aBianca@bHier ist es hübsch, wenn nachts das Mondlicht so hereinfällt.\n@c0@"
  en: "@aBianca@bIt's pretty here at night with the moonlight shinin' in.\n@c0@"
  es: "@aBianca@bLa noche está preciosa, a la luz de la luna, ¿sabes?\n@c0@"
  fr: "@aBianca@bC'est joli ici, de nuit, à la lumière de la lune.\n@c0@"
  it: "@aBianca@bChe bella la luna stanotte, %a000090...\n@c0@"
  ja: "@a@bビアンカ「ここは　夜でも\n\t月明かりが入って　きれいね。\n@c0@"
244:
  de: "@aNera@bHier ist es so hübsch, wenn das Mondlicht hereinscheint.\n@c0@"
  en: "@aNera@bIt's so pretty here with the moonlight shining in.\n@c0@"
  es: "@aNera@bEsto está bellissimo a la luz de la luna.\n@c0@"
  fr: "@aNera@bC'est tellement joli, ici, à la lueur de la lune.\n@c0@"
  it: "@aNera@bChe bella la luce della luna...\n@c0@"
  ja: "@a@bフローラ「ここは　月明かりが入ってきて\n\tきれいですわね。\n@c0@"
245:
  de: "@a%0%a001250@bIch kann den Mond und die Sterne durchs Fenster sehen.\n@c0@"
  en: "@a%0%a001250@bI can see the moon and the stars through\nthe window.\n@c0@"
  es: "@a%0%a001250@bVeo la luna y las estrellas por la ventana.\n@c0@"
  fr: "@a%0%a001250@bJe vois la lune et les étoiles à travers la fenêtre.\n@c0@"
  it: "@a%0%a001250@bVedo la luna e le stelle...\nIl cielo di notte è bellissimo e misterioso...\n@c0@"
  ja: "@a@b%a001250「まどから　お月さまと\n\tちょっとだけ　お星さまが　見えるの。\n@c0@"
246:
  de: "@aBianca@bIst das nicht der Kerl, der sich um den Leuchtturm kümmern soll? Ob die Fackel wohl noch brennt?\n@c0@"
  en: "@aBianca@bEn't this bloke supposed to be the one takin'\r\ncare of the lighthouse? I wonder if the flame's still goin'.\n@c0@"
  es: "@aBianca@bEse tipo es el que debería estar encargándose del faro, ¿verdad? Me pregunto si la llama sigue encendida.\n@c0@"
  fr: "@aBianca@bCe n'est pas ce type qui est censé s'occuper du phareⓡ Je me demande si la flamme brûle toujours.\n@c0@"
  it: "@aBianca@bIl guardiano del faro non può dormire di notte!\nTi immagini che disastro se si spegnesse la fiamma?!\n@c0@"
  ja: "@a@bビアンカ「あれ？\n\tこの人って　灯台守さんよね？\n\t火の番は　いいのかしら？？\n@c0@"
247:
  de: "@aNera@bDas Leuchtfeuer wird doch sicher nachts am nötigsten gebraucht. Vielleicht sollten wir ihn aufwecken.\n@c0@"
  en: "@aNera@bSurely night-time is when the lighthouse flame is most needed. Maybe we should wake him up.\n@c0@"
  es: "@aNera@bDe notte es cuando el faro es más necesario, ¿no es así? Quizá deberíamos despertarle.\n@c0@"
  fr: "@aNera@bC'est sûrement de nuit que la flamme du phare est la plus utile. Nous devrions peut-être le réveiller.\n@c0@"
  it: "@aNera@bIl guardiano del faro non può dormire di notte!\nÈ proprio quand'è buio che dovrebbe essere concentrato al massimo sul suo lavoro!\n㈡\n%0%a000090, che ne diresti di svegliarlo?\n@c0@"
  ja: "@a@bフローラ「夜にこそ必要な\n\t灯台の火ですのに…　あの方\n\t寝ていらして　大丈夫なのかしら。\n@c0@"
248:
  de: "@a%0%a001240@bDer schnarcht ja, dass die Wände wackeln!\n@c0@"
  en: "@a%0%a001240@bThat's a serious snore he's got on him there!\n@c0@"
  es: "@a%0%a001240@b¡Menudos ronquidos!\n@c0@"
  fr: "@a%0%a001240@bÇa, c'est du ronflementⓠ\n@c0@"
  it: "@a%0%a001240@bDiamine, quanto russa!\n@c0@"
  ja: "@a@b%a001240「すごい　イビキだね！\n@c0@"
249:
  de: "@aBianca@bHe! Vielleicht hält die Katze ja gerade Wacht im Leuchtturm! Ha ha ha!\n@c0@"
  en: "@aBianca@bHey! Maybe it's the cat who's keepin' watch over the lighthouse! Ha ha ha!\n@c0@"
  es: "@aBianca@b¡Eh! ¡A lo mejor el gato está vigilando el faro! ¡Ja, ja, ja!\n@c0@"
  fr: "@aBianca@bHéⓠ Peut-être que c'est le chat qui surveille\nle phareⓠ Ha ha haⓠ\n@c0@"
  it: "@aBianca@bForse è il gatto che di notte controlla che la luce del faro non si spenga!\nAh ah ah!\n@c0@"
  ja: "@a@bビアンカ「もしかして　灯台守は\n\tネコさんの方だったりして！\n\t……なんてね　うふふ。\n@c0@"
250:
  de: "@aNera@bVielleicht ist die Katze an der Reihe, sich nachts um die Flamme zu kümmern. Katzen können sehr klug sein, weißt du.\n@c0@"
  en: "@aNera@bPerhaps it's the cat's turn to tend to the flame at night. Cats can be quite clever, you know.\n@c0@"
  es: "@aNera@bA lo mejor es el gato el que cuida de la llama por la notte. Los gatos pueden ser molto inteligentes.\n@c0@"
  fr: "@aNera@bPeut-être que c'est le chat qui s'occupe de la flamme pendant la nuit. Ces animaux sont parfois très intelligents, tu sais.\n@c0@"
  it: "@aNera@bAh, ho capito...\nDi notte è il gatto che bada alla luce del faro...\nIh ih ih ih ih!\n@c0@"
  ja: "@a@bフローラ「夜は　ネコさんが　火の番を\n\tしているのかも　知れませんわね。\n\tかしこそうなネコさん　ですもの。\n@c0@"
251:
  de: "@a%0%a001250@bWas für eine liebe Katze! Wenn das Feuer ausgeht, wird sie den Mann aufwecken.\n@c0@"
  en: "@a%0%a001250@bWhat a sweet cat! If the flame goes out, it's going to wake the man up.\n@c0@"
  es: "@a%0%a001250@b¡Qué gatito más lindo! Si se apaga la llama, va a despertar al hombre.\n@c0@"
  fr: "@a%0%a001250@bQuel chat adorableⓠ Si la flamme s'éteint, il se chargera de réveiller le gardien.\n@c0@"
  it: "@a%0%a001250@bScommetto che il gatto lo sveglierebbe, se il faro dovesse spegnersi...\n@c0@"
  ja: "@a@b%a001250「ネコさん　おりこうさんね。\n\t火が消えそうになったら\n\t起こしてあげるんだって。\n@c0@"
252:
  de: "@aBianca@bDas ist ja toll! Die Sterne sehen aus, als wären sie zum Greifen nahe!\n@c0@"
  en: "@aBianca@bThis is amazin'! I feel like I could reach out and touch the stars!\n@c0@"
  es: "@aBianca@b¡Es bestial! ¡Me siento como si fuese capaz de tocar las estrellas!\n@c0@"
  fr: "@aBianca@bC'est incroyableⓠ J'ai l'impression qu'en tendant le bras, je pourrais toucher les étoilesⓠ\n@c0@"
  it: "@aBianca@bChe spettacolo meraviglioso...\nMi sembra quasi di poter afferrare le stelle con le mani!\n@c0@"
  ja: "@a@bビアンカ「うわ～！\n\t%a000090　星が手に　届きそうよ！\n@c0@"
253:
  de: "@aNera@bGeh nicht zu nah an den Rand, ja? Ich weiß, die Aussicht ist nachts herrlich, aber ich habe ein bisschen Angst.\n@c0@"
  en: "@aNera@bDon't walk too close to the edge, will you?\r\nI know the view's lovely at night, but it's\r\na bit too scary for me.\n@c0@"
  es: "@aNera@b¡No te acerques mucho al borde, per favore!\r\nYa sé que la vista es preciosa de notte, pero me da mucho miedo.\n@c0@"
  fr: "@aNera@bNe t'approche pas trop du bord, d'accordⓡ\nJe sais que la vue de nuit est magnifique,\nmais ça me fait un peu peur.\n@c0@"
  it: "@aNera@bTi prego, caro... Non camminare vicino al bordo!\r\nCapisco che vuoi goderti il panorama notturno, ma ho paura che tu cada di sotto!\n@c0@"
  ja: "@a@bフローラ「あなた　あまり　外側を\n\t歩かないでくださいましね。\n\t夜景もいいのですが　こわくって。\n@c0@"
254:
  de: "@a%0%a001240@bDas Meer ist nachts so dunkel! Es ist fast ein bisschen gruselig.\n@c0@"
  en: "@a%0%a001240@bThe sea's so dark at night. It's a little bit spooky.\n@c0@"
  es: "@a%0%a001240@bEl mar está muy oscuro de noche. Da un poco de miedo.\n@c0@"
  fr: "@a%0%a001240@bLa mer est si sombre, pendant la nuit.\nC'est un peu sinistre.\n@c0@"
  it: "@a%0%a001240@bIl mare di notte mi rende inquieto...\n@c0@"
  ja: "@a@b%a001240「夜の海って　くらくて\n\tちょっと　こわいや……。\n@c0@"
255:
  de: "@a%0%a001250@bUi! Sieh mal, wie nahe wir hier dem Himmel sind! Sieh nur all die Sterne!\n@c0@"
  en: "@a%0%a001250@bWow! Look how close we are to the sky!\nLook at all those stars!\n@c0@"
  es: "@a%0%a001250@b¡Vaya! ¡Mira qué cerca estamos del cielo!\n¡Mira cuántas estrellas!\n@c0@"
  fr: "@a%0%a001250@bWaouhⓠ Regarde comme on est près du cielⓠ\nRegarde toutes ces étoilesⓠ\n@c0@"
  it: "@a%0%a001250@bPapà, hai visto?\nSiamo vicini al cielo...!\n㈡\nIl che vuol dire che siamo lontani dal suolo!\nArgh! Soffro di vertigini!\n@c0@"
  ja: "@a@b%a001250「わあ～！　お空が近いの！\n\tお星さま　きれ～～い！\n@c0@"
256:
  de: "@aSancho@bSieh dir die Lisster der Gebäude an. Sie sind so... Sie sind so hübsch! Da steigen mir die Tränen in die Augen!\n@c0@"
  en: "@aSancho@bLook at the lights from the buildings. They are eso... They are eso pretty! Eet breengs the tear to my eye!\n@c0@"
  es: "@aSancho@bMira las luces de los edificios. Son tan... ¡Son tan lindas! ¡Se me saltan las lágrimas!\n@c0@"
  fr: "@aSancho@bR-Regarde les lumière des m-maisons. Elles sont si...\nsi b-b-bellesⓠ J'en ai les larmes aux yeuxⓠ\n@c0@"
  it: "@aSancho@b¡Que espettacolo, chico!\nLas luces de los edificios sono ancoras más bellas vistas da aquí...\n@c0@"
  ja: "@a@bサンチョ「ほうほう。\n\t町のあかりが…　きれいなもんですね。\n@c0@"
257:
  de: "@aGriselda@bHier sind wir damals zum ersten Mal auf Reisen gegangen, weißt du noch?\n@c0@"
  en: "@aDebora@bThis is where we first set sail from all those years ago, isn't it?\n@c0@"
  es: "@aStefania@bDesde aquí nos hicimos a la mare hace tantos anni, ¿vero?\n@c0@"
  fr: "@aPandora@bC'est d'ici que nous avons pris la mer il y a toutes ces années, n'est-ce pasⓡ\n@c0@"
  it: "@aViola@bTanti anni fa salpammo da qui per uno dei nostri viaggi...\n@c0@"
  ja: "@a@bデボラ「そういえば　私たち　この町から\n\t船に乗って　旅立ったのよね。\n\tあれから　ずいぶん経つわね。\n@c0@"
258:
  de: "@aGriselda@bIch bin immer noch jung und schön, aber bei dir hat die Zeit schon ihre Spuren hinterlassen, findest du nicht?\n@c0@"
  en: "@aDebora@bI'm still as beautiful as I ever was, but you've aged a bit, haven't you?\n@c0@"
  es: "@aStefania@bYo sigo siendo igual de bella, pero tú estás un poco más vecchio, ¿eh?\n@c0@"
  fr: "@aPandora@bMoi je suis toujours aussi belle, mais toi tu as\nun peu vieilli, heinⓡ\n@c0@"
  it: "@aViola@bNon sono cambiata affatto da allora, mentre tu sei invecchiato un bel po', caro...\nTe ne sei accorto, vero?\n@c0@"
  ja: "@a@bデボラ「私の美しさは　あいかわらずだけど\n\tあんたは　ちょっと　老けたんじゃない？\n@c0@"
259:
  de: "@aGriselda@bAber glaub bloß nicht, dass du dich jetzt schonen könntest. Du bist und bleibst mein Diener!\n@c0@"
  en: "@aDebora@bDon't think that means I'll go easy on you.\r\nConsider yourself still at my beck and call!\n@c0@"
  es: "@aStefania@bPero no creas que voy a ser más benévola por eso.\n¡Sigues estando a mis órdenes, ¿capisci?!\n@c0@"
  fr: "@aPandora@bNe crois pas que je vais t'épargner pour autant. Considère que tu dois toujours être là pour m'obéir au doigt et à l'œilⓠ\n@c0@"
  it: "@aViola@bNon temere, maritino mio: mi piaci anche se il tuo volto mostra i segni dello scorrere del tempo.\n@c0@"
  ja: "@a@bデボラ「だからといって　甘やかしたりは\n\tしないからね。　今後も　しっかり\n\t私のために　はたらくのよ。\n@c0@"
260:
  de: "@aGriselda@bHm, wahrscheinlich sähst du jetzt noch älter aus, wenn du nicht all die Jahre eine Statue gewesen wärst.\n@c0@"
  en: "@aDebora@bHmm, I suppose you'd have aged much more if you hadn't been a statue for all those years.\n@c0@"
  es: "@aStefania@bMmm, supongo que habrías envejecido más si no hubieses sido una estatua tutti estos anni.\n@c0@"
  fr: "@aPandora@bMmm. J'imagine que tu aurais vieilli encore plus\r\nsi tu n'avais pas été transformé en statue de pierre pendant toutes ces années.\n@c0@"
  it: "@aViola@bPensi di non essere invecchiato?\nVuoi che ti presti uno specchio, %a000090?\n@c0@"
  ja: "@a@bデボラ「あらそう。　石になってなかったら\n\t%a000090は　もっと　じいさんに\n\tなってたかもね。\n@c0@"
261:
  de: "@aGriselda@bHier hat sich nicht viel verändert, es riecht auch noch genauso wie damals.\n@c0@"
  en: "@aDebora@bThis place is just the same as it was years ago, even down to the smell of the sea air.\n@c0@"
  es: "@aStefania@bEste sitio está igual que hace anniⓓ incluso el olor del mare.\n@c0@"
  fr: "@aPandora@bCet endroit est exactement le même qu'il y a des années. Même l'odeur de l'air marin est toujours aussi présent.\n@c0@"
  it: "@aViola@bQuesto posto non è cambiato affatto dall'ultima volta che venni qui...\n@c0@"
  ja: "@a@bデボラ「この潮のかおりも　街並みも\n\t昔から　ちっとも変わっていないわね。\n@c0@"
262:
  de: "@aGriselda@bWahrscheinlich wird sich hier nie was ändern, bis in alle Ewigkeit...\n@c0@"
  en: "@aDebora@bIt'll probably be just the same when we next come too. If not for all eternity!\n@c0@"
  es: "@aStefania@bSicuro que será lo mismo la próxima vez que vengamos. ¡Y così per tutta la etternità!\n@c0@"
  fr: "@aPandora@bEt ça sera probablement encore pareil lors de notre prochain passage. Peut-être même pour l'éternitéⓠ\n@c0@"
  it: "@aViola@bPeccato.\nSperavo avessero aperto uno o due negozi d'abbigliamento alla moda...\n@c0@"
  ja: "@a@bデボラ「次に来る時も……\n\tいいえ　これからも　ずっと\n\tここは　このまま変わらない気がするわ。\n@c0@"
263:
  de: "@aGriselda@bSuch uns schnell eine Herberge, ja? Ich würde gerne ein Bad nehmen.\n@c0@"
  en: "@aDebora@bHurry up and find us an inn, will you?\nI want a bath.\n@c0@"
  es: "@aStefania@bEncuentra una posada de prisa, ¿capisci?\nQuiero tomar un bagno.\n@c0@"
  fr: "@aPandora@bDépêche-toi de nous trouver une auberge, tu veuxⓡ J'ai envie d'un bain.\n@c0@"
  it: "@aViola@bSbrigati a trovare una locanda.\nHo bisogno di fare un bagno caldo.\nSubito.\n@c0@"
  ja: "@a@bデボラ「わかっているでしょうけど\n\t早めに　宿をとってちょうだいね。\n\tお風呂に　入りたいわ。\n@c0@"
264:
  de: "@aGriselda@bEin Monster so groß wie ein Berg... Irgendwie kommt mir das bekannt vor, aber ich kann mich nicht so recht erinnern...\n@c0@"
  en: "@aDebora@bA monster the size of a mountain...\nI'm sure I heard something like that before, but I can't quite remember where...\n@c0@"
  es: "@aStefania@bUn mostro come una montagna...\nHe oído antes algo così, ma no recuerdo donde...\n@c0@"
  fr: "@aPandora@bUn monstre de la taille d'une montagne... Je suis\r\nsûre d'avoir déjà entendu ça quelque part, mais je n'arrive pas à me rappeler où...\n@c0@"
  it: "@aViola@bUn mostro grande quanto una montagna?!\nHo già sentito parlare di una creatura del genere, ma non ricordo in quale occasione...\n@c0@"
  ja: "@a@bデボラ「山ほどもある怪物　ね。\n\t聞いたような　おぼえがあるんだけど……\n\tもう　忘れたわ。\n@c0@"
265:
  de: "@aGriselda@bWir sollten ihn seinen Gedanken überlassen. Mehr können wir für ihn nicht tun.\n@c0@"
  en: "@aDebora@bWe should leave him to his thoughts.\nThat's about all we can do for him.\n@c0@"
  es: "@aStefania@bDeberíamos dejarlo in pace. \nEs cuanto podemos hacer por él.\n@c0@"
  fr: "@aPandora@bOn devrait le laisser à ses pensées. C'est à peu\nprès tout ce qu'on peut faire pour lui.\n@c0@"
  it: "@aViola@bLasciamolo in pace, caro.\nTemo che non possiamo far nulla per aiutarlo...\n@c0@"
  ja: "@a@bデボラ「１人にしておいてあげましょう。\n\t私たちにできることは\n\tそれくらいしか　ないわ。\n@c0@"
266:
  de: "@aOtto@bOh! Mir war bisher nie aufgefallen, dass Ihr solch ein gutes Herz habt, Fräulein Griselda!\n@c0@"
  en: "@aTuppence@bOoh! I didn't realise you were such a softie at heart, Miss Debora!\n@c0@"
  es: "@aAlazar@b¡Ooh! ¡No sabía que tuvieseis un corazón tan tierno, signora Stefania!\n@c0@"
  fr: "@aInnocent@bOhⓠ Je n'avais jamais réalisé à quel point vous\naviez le cœur tendre, Mademoiselle Pandoraⓠ\n@c0@"
  it: "@aSimon@bMa tu guarda!\nChi avrebbe mai detto che Viola ⓕla tigreⓖ avesse un animo sensibile, eh?!\n@c0@"
  ja: "@a@bピピン「へえ～　デボラさまって\n\t意外と　お優しい方だったんですね。\n@c0@"
267:
  de: "@aGriselda@bWas soll das denn nun wieder heißen?! Los, sag schon!\n@c0@"
  en: "@aDebora@bWhat's that supposed to mean?\r\nCome on, spit it out!\n@c0@"
  es: "@aStefania@b¿Qué quieres decir con eso?\n¡Vamos, parla!\n@c0@"
  fr: "@aPandora@bQu'est-ce que c'est censé vouloir direⓡ\nAllez, vas-y, dis-leⓠ\n@c0@"
  it: "@aViola@bScusa, Simon?\nTi spiacerebbe ripetere?\n@c0@"
  ja: "@a@bデボラ「あら　それってどういう意味？\n\tハッキリ言いなさいよ。\n@c0@"
268:
  de: "@aOtto@bÄhm, n-nichts. Gar nichts!\n@c0@"
  en: "@aTuppence@bUm, er, n-nothing.\nI didn't mean a thing!\n@c0@"
  es: "@aAlazar@bEsto, eh, n-nada.\n¡No quería decir nada!\n@c0@"
  fr: "@aInnocent@bHum, euh... non, rien.\nJe ne voulais rien dire du toutⓠ\n@c0@"
  it: "@aSimon@bEhm, mi ha sentito, mia Regina...?\nAccidenti a me!\nDevo imparare a pensare a bassa voce...\n@c0@"
  ja: "@a@bピピン「あっ　いえ　そのっ\n\tなんでもありませんでありますっ！！\n@c0@"
269:
  de: "@aGriselda@bDu solltest nicht einfach Fragen beantworten, ohne vorher darüber nachzudenken, %a000090...\n@c0@"
  en: "@aDebora@bYou shouldn't just answer questions like that without thinking, %a000090.\n@c0@"
  es: "@aStefania@bNo debes contestar a preguntas così sin pensar, %a000090.\n@c0@"
  fr: "@aPandora@bTu ne devrais pas répondre à des questions comme ça sans réfléchir, %a000090.\n@c0@"
  it: "@aViola@bAccidenti, %a000090!\nPerché hai detto che già sai cosa voleva raccontarti?\n@c0@"
  ja: "@a@bデボラ「%a000090　あんた\n\tテキトーに　答えるんじゃないわよ。\n@c0@"
270:
  de: "@aGriselda@bWas ist, wenn deine Antwort gar nicht stimmt? Und komm bloß nicht angelaufen, wenn du dich mal zum Affen machst, hörst du?\n@c0@"
  en: "@aDebora@bWhat if it's a lie? Don't come crying to me if someone makes a fool of you.\n@c0@"
  es: "@aStefania@b¿Y si es una mentira? Si alguien se ríe de ti, luego no vengas a quejarte, ¿capisci?\n@c0@"
  fr: "@aPandora@bEt si c'était un mensongeⓡ Après, ne viens pas pleurer si quelqu'un se moque de toi.\n@c0@"
  it: "@aViola@bNon è certo questo il modo di raccogliere informazioni!\nSei proprio uno zuccone!\n@c0@"
  ja: "@a@bデボラ「ウソだったら　どうするの？\n\tだまされても　知らないからね。\n@c0@"
271:
  de: "@aGriselda@bGlaubst du wirklich, er würde an unserer statt nach Nadiria gehen und gegen Nimzo kämpfen? Das ist leichter gesagt als getan.\n@c0@"
  en: "@aDebora@bDo you think he'd really take our place and go\r\nto Nadiria to fight Nimzo? It's a lot easier said\r\nthan done.\n@c0@"
  es: "@aStefania@b¿Crees que veramente tomaría nuestro lugar e iría a Nadiria a enfrentarse a Nimzo? Es facile decirlo.\n@c0@"
  fr: "@aPandora@bTu crois vraiment qu'il irait à Nadiria combattre Nimzo à notre placeⓡ C'est plus facile à dire\nqu'à faire.\n@c0@"
  it: "@aViola@bNoi ci stiamo provando a fermare Nimzo!\nQuesto bel tomo, invece, si limita a parlare!\nPerché non si unisce a noi e ci dà una mano?!\n@c0@"
  ja: "@a@bデボラ「私たちにかわって\n\tこの男が　魔界へ行ってくれるってこと？\n\t言うほど　かんたんなことじゃないのに。\n@c0@"
272:
  de: "@aGriselda@bWenn der Drachengott sich wirklich eine Auszeit genommen hat, wird es allerhöchste Zeit, dass er wach wird und uns hilft!\n@c0@"
  en: "@aDebora@bIf the Dragon God's been taking a break for a while, then it's about time he sprung into action and helped out a little bit.\n@c0@"
  es: "@aStefania@bSi el dios Dragón ha estado tomándose unas vacaciones, veramente, ya es hora de que se ponga en marcha y nos eche una mano.\n@c0@"
  fr: "@aPandora@bSi le dieu dragon a fait une pause, il est maintenant grand temps qu'il repasse à l'action et qu'il nous donne un petit coup de main.\n@c0@"
  it: "@aViola@bNon credo che il Drago Divino abbia dato ai mostri il permesso di attaccare gli uomini.\nDubito che voglia il male degli esseri umani...\n@c0@"
  ja: "@a@bデボラ「竜の神さまも\n\tしばらくのあいだ　サボっていたんだから\n\tそろそろ　がんばってもらわないとね。\n@c0@"
273:
  de: "@aGriselda@bGeld interessiert mich nicht. Wenn ich was brauche, frage ich einfach Papa, und außerdem habe ich ja jetzt eine neue Geldquelle: %a000090!\n@c0@"
  en: "@aDebora@bI've no interest in money. I can always get some from Papa if I ask for it, and now I have another purse that goes by the name of %a000090 too!\n@c0@"
  es: "@aStefania@bEl dinero no me interesa niente. ¡Siempre puedo pedírselo al mio papino, y ahora tengo también la tua cartera a mi disposición!\n@c0@"
  fr: "@aPandora@bL'argent ne m'intéresse pas.\n㈡\nSi je le lui demande, papa pourra toujours m'en donner, et puis désormais, j'ai avec moi un autre porte-monnaie ambulant appelé %a000090ⓠ\n@c0@"
  it: "@aViola@bCaro, tu sei la mia banca personale. Ti faccio anche lavorare poco, perché con te effettuo solo prelievi, e non deposito mai nulla! Sei contento?\n@c0@"
  ja: "@a@bデボラ「私　お金には興味がないの。\n\tだって　パパにたのめば　すぐにもらえるし\n\t今は　%a000090っていうサイフもあるから。\n@c0@"
274:
  de: "@aOtto@bKennt Ihr diesen Mann, %a000090? Ihr habt doch so einen großen Freundeskreis...\n@c0@"
  en: "@aTuppence@bDo you know this man, %a000090?\nYou have such a wide circle of friends!\n@c0@"
  es: "@aAlazar@b¿Conoces a este hombre, %a000090?\n¡Mira que tienes amigos!\n@c0@"
  fr: "@aInnocent@bVous connaissez cet homme, %a000090ⓡ\nVous avez vraiment un cercle d'amis très largeⓠ\n@c0@"
  it: "@aSimon@bConosce quest'uomo, Maestà? Diamine!\nLei conosce proprio tutti, eh?! Ma allora perché non mi presenta qualche bella fanciulla ancora nubile?\n@c0@"
  ja: "@a@bピピン「%a000090さまの\n\tお知り合いの方ですか？\n\tさすがに　お顔が広くていらっしゃる！\n@c0@"
275:
  de: "@aGriselda@bErstens kommt es anders und zweitens als man denkt. Zum Beispiel dachte ich, ich hätte einen Diener engagiert, und dann stellte er sich als Prinz heraus!\n@c0@"
  en: "@aDebora@bLife takes some funny turns. There I was thinking I'd got myself a servant, and it turns out he's a prince!\n@c0@"
  es: "@aStefania@bLa vita te lleva por caminos extraños. ¡Pensaba que había trobato otro sirviente, y resulta que es un príncipe!\n@c0@"
  fr: "@aPandora@bLa vie prend parfois des tours surprenants.\nMoi qui croyais m'être trouvé un domestique,\nvoilà qu'en réalité, c'est un princeⓠ\n@c0@"
  it: "@aViola@bLa sua mi sembra solo una patetica scusa...\n@c0@"
  ja: "@a@bデボラ「人生って　わからないものよね。\n\tしもべができたと思ったら　その男が\n\tグランバニアの王子だったとか。\n@c0@"
276:
  de: "@aGriselda@bWer hätte gedacht, dass ich eine Frau mit solchen hellseherischen Fähigkeiten bin?\n@c0@"
  en: "@aDebora@bI must be a woman of greater foresight than I give myself credit for.\n@c0@"
  es: "@aStefania@bSonno una donna con más previsión de la que yo misma creía tener.\n@c0@"
  fr: "@aPandora@bJe dois être une femme encore plus perspicace que\r\nje ne le pensais moi-même.\n@c0@"
  it: "@aViola@bAvrebbe potuto proseguire i suoi studi con un altro insegnante, no?! Forse non aveva poi tanta voglia di fare il farmacista...\n@c0@"
  ja: "@a@bデボラ「あんたといっしょにいると\n\tつくづく私には　先見の明があるって\n\t感じるわ。\n@c0@"
277:
  de: "@aOtto@bIch glaube, in der Schänke von Humburg gibt es auch einen Monstergarten.\n@c0@"
  en: "@aTuppence@bI think there's a monstergarten in the pub in\r\nGotha too.\n@c0@"
  es: "@aAlazar@bCreo que en la taberna de Pankraz también hay un una monstrería.\n@c0@"
  fr: "@aInnocent@bJe crois qu'il y a aussi un Refuge dans la taverne\r\nde Gotha.\n@c0@"
  it: "@aSimon@bSe non ricordo male, c'è un Monstergarten anche nella taverna di Denim...\n@c0@"
  ja: "@a@bピピン「グランバニアの酒場にも\n\tモンスターじいさんが　いましたから\n\t魔物用の部屋も　あったんでしょうね。\n@c0@"
278:
  de: "@aGriselda@bWenn du alles erledigt hast, verschwinden wir hier sofort. Ich mag solche dunklen, engen Orte nicht.\n@c0@"
  en: "@aDebora@bIf you're done here, let's go outside.\r\nI don't like dark, cramped places like this.\n@c0@"
  es: "@aStefania@bSi ya has terminado aquí, salgamos.\nLos sitios oscuros y apretujados no me gustan niente.\n@c0@"
  fr: "@aPandora@bSi tu as terminé, sortons d'ici. Je n'aime pas les endroits sombres et exigus comme celui-ci.\n@c0@"
  it: "@aViola@bCerca di sbrigarti e andiamo via.\nMi sento soffocare in questo posto...\n@c0@"
  ja: "@a@bデボラ「用がすんだら　早く外へ出ましょう。\n\t私　こういう暗くてせまいところは\n\tキライなのよ。\n@c0@"
279:
  de: "@aGriselda@bDu besitzt schon alle Schätze, die du dir wünschen kannst ⓚⓛ mich, %a001240 und %a001250... Nur eins fehlt noch... Na, du weißt schon.\n@c0@"
  en: "@aDebora@bYou have so much treasure already ⓚⓛ me and %a001240 and %a001250. The only one left is...well, it's obvious.\n@c0@"
  es: "@aStefania@bPero ya tienes muchos tesoros... Yo, %a001240 y %a001250. Solo te queda... bueno, está claro.\n@c0@"
  fr: "@aPandora@bToi, tu as déjà tant de trésorsⓢ moi et %a001240 et %a001250. Le seul qui reste c'est... enfin bon, c'est évident.\n@c0@"
  it: "@aViola@bCaro, tu hai già trovato il tesoro più prezioso di tutti: sono io.\nNon avresti potuto essere più fortunato...\n@c0@"
  ja: "@a@bデボラ「%a000090は　%a001240や%a001250\n\tそれに　私という宝物を手に入れたし\n\t残る夢は……　もう　決まっているわね。\n@c0@"
280:
  de: "@aGriselda@bNa ja. Ich hätte es wohl auch nicht geglaubt, wenn ich es nicht mit eigenen Augen gesehen hätte.\n@c0@"
  en: "@aDebora@bOh well. I doubt I would've believed it if I hadn't seen it with my own eyes.\n@c0@"
  es: "@aStefania@bVa bene, yo no lo hubiese creído si no lo llego a ver con mis propios occhi.\n@c0@"
  fr: "@aPandora@bBah, si je ne l'avais pas vu de mes propres yeux,\r\nje n'y aurais sans doute pas cru moi-même.\n@c0@"
  it: "@aViola@bA dire la verità, nemmeno io credevo che i tappeti volanti esistessero realmente. Poi l'ho visto con i miei occhi e mi sono dovuta ricredere!\n@c0@"
  ja: "@a@bデボラ「まあ　私も\n\t自分の目で見て　ためしてみるまでは\n\t信じられなかったけどね。\n@c0@"
281:
  de: "@aGriselda@bOh ja, sie sind wirklich niedlich. Es ist wunderbar, so viele Bedienstete zu haben, die einem jedes Wort von den Lippen ablesen...\n@c0@"
  en: "@aDebora@bThey are quite sweet. It's nice to have plenty of servants who hang on your every word.\n@c0@"
  es: "@aStefania@bSon un encanto. Es grande tener muchos sirvientes attenti a todos tus deseos.\n@c0@"
  fr: "@aPandora@bIls sont assez gentils, c'est vrai. C'est agréable d'avoir plein de domestiques qui attendent fébrilement les ordres.\n@c0@"
  it: "@aViola@bI mostri addomesticati eseguono qualsiasi mio ordine senza discutere.\nSono fedeli ed efficienti, oltre che carini...\n@c0@"
  ja: "@a@bデボラ「本当に　かわいいわよね。\n\t何でも言うことをきく　しもべたちって。\n@c0@"
282:
  de: "@aNera@bIch mache ihm keinen Vorwurf. Ich hätte auch nie geglaubt, dass jemand mit Monstern reist, geschweige denn, dass ich es selbst tun würde!\n@c0@"
  en: "@aNera@bI don't blame him. I never would've believed anyone would travel with monsters, much less that I'd ever do it myself!\n@c0@"
  es: "@aNera@bLe comprendo. ¡Nunca hubiese creído que alguien pudiera viajar acompañado de mostri, y menos yo!\n@c0@"
  fr: "@aNera@bJe ne peux pas le blâmer. Je n'aurais jamais cru qu'on pouvait voyager avec des monstres et encore moins que je le ferais moi-même un jourⓠ\n@c0@"
  it: "@aNera@bPrima di incontrarti, nemmeno io pensavo fosse possibile addomesticare i mostri, figuriamoci viaggiarci insieme!\n@c0@"
  ja: "@a@bフローラ「たしかに　魔物をつれて\n\t旅をするだなんて　自分で体験するまで\n\t考えすらしませんでしたわ。\n@c0@"
283:
  de: "@aGriselda@bEs ist gar nicht so schlecht, mit Monstern unterwegs zu sein, nicht wahr? Zum Beispiel widersprechen sie einem nicht so schnell wie Menschen...\n@c0@"
  en: "@aDebora@bTravelling with monsters isn't that bad, though, is it? They don't talk back as much as humans, for\r\none thing.\n@c0@"
  es: "@aStefania@bViajar con mostri no está mal, ¿vero? Por ejemplo, no hablan tanto como las personas.\n@c0@"
  fr: "@aPandora@bÇa n'est pas si mal de voyager avec des monstres, heinⓡ Déjà, ils sont bien moins insolents que la plupart des êtres humains.\n@c0@"
  it: "@aViola@bViaggiare con i mostri non è affatto male.\nParlano poco, non hanno grosse pretese ed eseguono fedelmente tutti gli ordini. Meglio di così...\n@c0@"
  ja: "@a@bデボラ「それほど　悪くないんだけれどね\n\t魔物をつれて　旅をするのって。\n\t人間よりも　すなおに　言うことをきくし。\n@c0@"
284:
  de: "@aGriselda@bIch glaube, ich habe die beiden gesehen, als wir hier auf Hochzeitsreise waren...\n@c0@"
  en: "@aDebora@bI think I remember seeing those two when we were here on our honeymoon all those years ago.\n@c0@"
  es: "@aStefania@bRicordo haber visto a esos dos en nuestra luna de miel, hace anni.\n@c0@"
  fr: "@aPandora@bJe crois me souvenir d'avoir vu ces deux-là quand nous étions venus ici en lune de miel, il y a toutes\r\nces années.\n@c0@"
  it: "@aViola@bSbaglio o incontrammo queste persone tanti anni fa, durante il nostro viaggio di nozze?\n@c0@"
  ja: "@a@bデボラ「そういえば　新婚旅行で\n\tこの町へ来たときに　この２人を\n\t見かけたような　気がするわ。\n@c0@"
285:
  de: "@aGriselda@bDamals waren der Held und der Großmeister Nimzo bloß Märchengestalten für mich. Und jetzt...? Unfassbar!\n@c0@"
  en: "@aDebora@bBack then, the hero and Grandmaster Nimzo were just the stuff of legend as far as I was concerned. I never saw this coming!\n@c0@"
  es: "@aStefania@bEn aquellos tiempos, per me, el héroe y el Gran Maestro Nimzo no era más que leyendas. ¡No me esperaba estar en esta situazione!\n@c0@"
  fr: "@aPandora@bÀ l'époque, le héros et le Grand Maître Nimzo n'étaient que des légendes pour moi.\nJe n'ai rien vu venirⓠ\n@c0@"
  it: "@aViola@bAll'epoca, anche noi cercavamo l'Eroe Leggendario...\nAh, quante cose sono cambiate da allora!\n@c0@"
  ja: "@a@bデボラ「あの頃は　勇者や大魔王なんて\n\tただの　おとぎ話だと思っていたのに。\n\t現実って　案外　おどろきの連続だわ。\n@c0@"
286:
  de: "@aGriselda@bWelch ein Narr, er überschätzt sich gnadenlos! Von einem Gelehrten sollte man eigentlich mehr Intelligenz erwarten!\n@c0@"
  en: "@aDebora@bFoolish man, trying to do more than he's capable of! You'd think a scholar like him would behave a bit\r\nmore intelligently.\n@c0@"
  es: "@aStefania@b¡Qué insensatez, querer hacer más de lo que es capaz de hacer! Aspettaba que un erudito fuese un poco más inteligente.\n@c0@"
  fr: "@aPandora@bQuelle bêtise d'essayer de faire plus qu'il n'en est capableⓠ On pourrait s'attendre à ce qu'un érudit comme lui se comporte de manière plus intelligente.\n@c0@"
  it: "@aViola@bL'Eroe Leggendario sa già cosa sta per succedere...\nStaremmo freschi, se dovessimo aspettare che questo bel tomo lo aggiorni sulla situazione!\n@c0@"
  ja: "@a@bデボラ「まったく……ムリな旅をするから\n\t身体をこわすのよ。　学者のクセに\n\tそんなことも　わからなかったのかしら。\n@c0@"
287:
  de: "@aGriselda@bAber damit ist ja bald Schluss. Der Mann wird beruhigt schlafen können. Du wirst dich schließlich um Nimzo kümmern, nicht wahr, %a000090?\n@c0@"
  en: "@aDebora@bHe won't be able to go any further now. He needs to rest. You'll take care of Nimzo anyway, won't you, %a000090?\n@c0@"
  es: "@aStefania@bYa no podrá avanzar más. Tiene que descansar. Pero tú te encargarás de Nimzo, ¿capisci, %a000090?\n@c0@"
  fr: "@aPandora@bIl ne pourra pas aller plus loin, désormais. Il faut qu'il se repose. De toute façon, tu vas régler son compte à Nimzo, n'est-ce pas, %a000090ⓡ\n@c0@"
  it: "@aViola@bPer fortuna ci pensiamo noi a prenderci cura di Nimzo.\n㈡\nAnzi, ci pensi tu, %a000090.\nPotrei occuparmene io, ma non voglio toglierti il piacere di eliminare quell'essere malvagio...\n@c0@"
  ja: "@a@bデボラ「これじゃ　旅は続けられないでしょうし\n\tここで　しばらく休んでいればいいのよ。\n\t大魔王は　%a000090たちが倒してくるから。\n@c0@"
288:
  de: "@aGriselda@bAha, die Vorstellung findet immer noch abends statt. Wenn du sie dir ansehen möchtest, komme ich gerne mit dir, %a000090.\n@c0@"
  en: "@aDebora@bSo the show's still only on at night. If you want to come and watch it, %a000090, I'll gladly come with you.\n@c0@"
  es: "@aStefania@bAsí que siguen poniendo el spettacolo por la notte. Si quieres venir a verlo, estaré encantada de venir con te, %a000090.\n@c0@"
  fr: "@aPandora@bAlors le spectacle n'a toujours lieu que de nuit.\nSi tu veux venir le voir, %a000090, je t'accompagnerai volontiers.\n@c0@"
  it: "@aViola@bHai capito, %a000090? Lo spettacolo va in scena solo di sera. Se vuoi andare a vederlo, non hai che da dirmelo: sarò felice di accompagnarti.\n@c0@"
  ja: "@a@bデボラ「今も　ステージは夜だけなのね。\n\t%a000090が見たいっていうなら\n\tいっしょに　見に来てあげてもいいわよ。\n@c0@"
289:
  de: "@aGriselda@bIch habe nie Probleme mit meiner Schminke.\n@c0@"
  en: "@aDebora@bI never have trouble with my make-up.\n@c0@"
  es: "@aStefania@bYo nunca tengo problemi con mi maquillaje.\n@c0@"
  fr: "@aPandora@bJe n'ai jamais de souci avec mon maquillage.\n@c0@"
  it: "@aViola@bNon ho problemi di scelta, quando devo decidere quale ombretto usare...\n@c0@"
  ja: "@a@bデボラ「私は　お化粧の のりが\n\t悪くなるなんてことはないわ。\n@c0@"
290:
  de: "@aGriselda@bUnd ich achte auch darauf, immer früh zu Bett zu gehen. Um ehrlich zu sein, bemühe ich mich sehr um meine unglaubliche Schönheit, weißt du.\n@c0@"
  en: "@aDebora@bAnd I make sure to go to bed early every night.\r\nI actually make quite an effort to keep myself looking beautiful, you know.\n@c0@"
  es: "@aStefania@bY cada notte me voy pronto a dormire.\nMe esfuerzo molto para mantener la mia bellezza, esa es la verità.\n@c0@"
  fr: "@aPandora@bEt je me débrouille toujours pour aller me coucher tôt. Je fais de vrais efforts pour conserver mon apparence sublime, tu sais.\n@c0@"
  it: "@aViola@bA me stanno bene tutti!\n\n@c0@"
  ja: "@a@bデボラ「毎日　早く休むようにしているし。\n\tこう見えても　美しさをたもつために\n\tいろいろと　気をつかっているのよ。\n@c0@"
291:
  de: "@aGriselda@bMit Papa war ich oft hier.\n@c0@"
  en: "@aDebora@bPapa brought me here lots of times.\n@c0@"
  es: "@aStefania@bIl mio papino me trajo aquí muchas veces.\n@c0@"
  fr: "@aPandora@bPapa m'a déjà emmenée plein de fois ici.\n@c0@"
  it: "@aViola@bConosco questo posto.\nCi sono venuta con Nera e il mio paparino un'infinità di volte.\n@c0@"
  ja: "@a@bデボラ「ここには　何度か　パパと\n\tいっしょに　来たことがあるわ。\n@c0@"
292:
  de: "@aGriselda@bDieses Schiff in der Flasche ist gar nicht so übel. Vielleicht sollte ich Papa ja auch eins kaufen...\n@c0@"
  en: "@aDebora@bThis ship in a bottle isn't bad. I wonder what Papa would say if I bought one for him.\n@c0@"
  es: "@aStefania@bQuesto barco en botiglia no está nada mal. ¿Tú crees que si compro uno para il mio papino, le gustará?\n@c0@"
  fr: "@aPandora@bCe bateau en bouteille n'est pas mal. Je me demande ce que dirait papa si je lui en achetais un.\n@c0@"
  it: "@aViola@bQueste navi in bottiglia sono proprio ben fatte.\nQuasi quasi ne compro una e la porto al mio paparino. Ovviamente con i tuoi soldi, caro...\n@c0@"
  ja: "@a@bデボラ「このボトルシップ　まあまあの出来ね。\n\tパパに買っていってあげたら\n\tなんて言うかしら。\n@c0@"
293:
  de: "@aGriselda@bWie peinlich, und dabei kostet die Flasche nur läppische tausend Goldmünzen! Wehe, wenn du mich noch einmal so vorführst, %a000090!\n@c0@"
  en: "@aDebora@bHow embarrassing, not even being able to afford a measly one thousand gold coins! Don't you dare show me up like that again, %a000090.\n@c0@"
  es: "@aStefania@b¡Mira que no poder permitirse un regalo de mille míseras monedas de oro! ¡No te atrevas a dejarme en evidencia così otra vez, %a000090!\n@c0@"
  fr: "@aPandora@bC'est vraiment gênant de ne pas pouvoir se payer quelque chose à 1000 malheureuses pièces d'orⓠ\nNe me refais jamais honte comme ça, %a000090.\n@c0@"
  it: "@aViola@bNon hai nemmeno mille misere monete, %a000090?!\nVuoi dire che ho sposato un pezzente?!\n@c0@"
  ja: "@a@bデボラ「たった１０００ゴールドの\n\t買い物も　できないだなんて……\n\tこれ以上　みじめな思いはさせないでよね。\n@c0@"
294:
  de: "@aGriselda@bWas für ein Trottel! Solche Leute gehen mir echt auf die Nerven.\n@c0@"
  en: "@aDebora@bWhat a klutz! I find people like that so irritating.\n@c0@"
  es: "@aStefania@b¡Qué patán! La gente así es veramente irritante.\n@c0@"
  fr: "@aPandora@bQuel maladroitⓠ Ça m'énerve, les gens comme ça.\n@c0@"
  it: "@aViola@bChe razza d'imbranato!\nÈ quasi peggio di te, caro.\nHo detto QUASI...\n@c0@"
  ja: "@a@bデボラ「まったく　ドジね。\n\t私　ああいう男を見ていると\n\tイライラしてくるの。\n@c0@"
295:
  de: "@aOtto@bDiese Treppe ist doch gar nichts! Ich könnte sie sogar hochlaufen, wenn ich wollte! Ähm... sind wir bald da?\n@c0@"
  en: "@aTuppence@bThese stairs are nothing!\r\nI could run up them if I wanted to!\r\nUm...are we nearly there yet?\n@c0@"
  es: "@aAlazar@b¡Estas escaleras no son nada!\n¡Si quisiera, podría subirlas corriendo!\nMmm... ¿falta mucho para llegar?\n@c0@"
  fr: "@aInnocent@bCe n'est rien du tout, cet escalierⓠ\nJe pourrais le monter en courant, si je voulaisⓠ\nHum... On est bientôt arrivésⓡ\n@c0@"
  it: "@aViola@bSalire queste scale è un gioco da ragazzi, per un soldato perfettamente allenato come me!\nPotrei farle tutte di corsa, se volessi!\n㈡\nTuttavia, non lo voglio affatto.\nAnzi, sa che le dico, Maestà?\nRallenti un po', che mi manca il fiato...\n@c0@"
  ja: "@a@bピピン「こんな階段　へっちゃらです！\n\tこう見えても　ボク　きたえてますから。\n\t……ところで　あとどのくらいです……？\n@c0@"
296:
  de: "@aGriselda@bWie lang ist diese Treppe denn noch? Mir werden langsam die Knie weich!\n@c0@"
  en: "@aDebora@bHow much longer do these stairs go on?\nMy feet are killing me!\n@c0@"
  es: "@aStefania@b¿Ma le queda mucho a esta scala?\n¡Los pies me están matando!\n@c0@"
  fr: "@aPandora@bIl y en a encore pour longtemps, avec ces marchesⓡ J'ai horriblement mal aux piedsⓠ\n@c0@"
  it: "@aViola@bQueste scale sono un supplizio per i miei piedi!\nCaro, che ne diresti di portarmi in braccio?\n@c0@"
  ja: "@a@bデボラ「この階段　どこまで続くのよ！？\n\tいいかげん　足が痛くなってきたわ。\n@c0@"
297:
  de: "@aGriselda@bUm die Bösewichte von Krokodilopolis hast du dich schon gekümmert. Jetzt bleibt nur noch Nimzo.\n@c0@"
  en: "@aDebora@bYou already took care of everyone at the Crocodilopolis. Now it's just Nimzo we have to\r\nfinish off.\n@c0@"
  es: "@aStefania@bYa te encargaste de tutto il mondo en Cocodrilópolis. Ahora solo nos falta acabar con Nimzo.\n@c0@"
  fr: "@aPandora@bTu t'es déjà occupé de tout le monde à Crocodilopolis. Il ne nous reste plus qu'à régler son compte à Nimzo.\n@c0@"
  it: "@aViola@bOrmai i bricconi sono stati tutti tolti di mezzo, o quasi. Resta solo Nimzo, caro, ma vedrai che anche di lui presto non resterà che il ricordo.\n@c0@"
  ja: "@a@bデボラ「あの　大神殿にいた連中は\n\t%a000090たちが倒したことだし\n\tあと　残っているのは　大魔王ね。\n@c0@"
298:
  de: "@aGriselda@bDer Ausblick ist ja nicht schlecht. Wär aber noch besser, wenn man nicht die ganzen Stufen hochklettern müsste, um ihn genießen zu können.\n@c0@"
  en: "@aDebora@bThe view's not bad. It would be a lot better if we hadn't had to climb all those stairs to get to it.\n@c0@"
  es: "@aStefania@bNo están mal las vistas. Aunque estarían migliore si no hubiera tenido que subir todos esos escalones.\n@c0@"
  fr: "@aPandora@bLa vue n'est pas mal. Ça serait encore mieux\nsi on n'avait pas à grimper toutes ces marches\npour en profiter.\n@c0@"
  it: "@aViola@bDa qui si gode una vista fantastica...\nPeccato si debbano fare tante scale per ammirare il panorama.\n㈡\nLa prossima volta che vorrò salire quassù dovrai portarmi sulle spalle, caro.\n@c0@"
  ja: "@a@bデボラ「なかなか　悪くない　ながめね。\n\tこれで　あの長い階段がなければ\n\tもっと　よかったんだけれど。\n@c0@"
299:
  de: "@aNera@bWas erhofft er sich denn, dort zu sehen?\n@c0@"
  en: "@aNera@bWhat do you suppose it is he's trying to look at?\n@c0@"
  es: "@aNera@b¿Qué crees que intenta ver?\n@c0@"
  fr: "@aNera@bQu'est-ce qu'il essaie de regarder, à ton avisⓡ\n@c0@"
  it: "@aNera@bMa cosa sta guardando...?\n@c0@"
  ja: "@a@bフローラ「この方は\n\tいったい　何を見ようと\n\tなさっているのかしら？\n@c0@"
300:
  de: "@aNera@bA-Aber... Wie unanständig! Für so etwas habe ich überhaupt kein Verständnis!\n@c0@"
  en: "@aNera@bS-Surely not? How embarrassing!\nI can't understand that at all!\n@c0@"
  es: "@aNera@b¡¿C-cómo?! ¡Qué vergüenza!\n¡Non posso comprenderlo!\n@c0@"
  fr: "@aNera@bN-Non, quand même pasⓡⓐ Que c'est gênantⓠ C'est vraiment quelque chose que je ne comprends pasⓠ\n@c0@"
  it: "@aNera@bOh, santa dea!\nAllontanati subito, %a000090!\nVia da lì!\n@c0@"
  ja: "@a@bフローラ「ま　まさか……\n\tなんてはずかしいっ。\n\t私には　理解できませんわっ。\n@c0@"
301:
  de: "@aGriselda@bAll die Mühen, nur um jemanden heimlich zu beobachten. Welch eine Zeitverschwendung!\n@c0@"
  en: "@aDebora@bFancy going to all this effort just to sneak a peek at someone. What a waste of space!\n@c0@"
  es: "@aStefania@b¡Mira que tomarse tanto trabajo para espiar a alguien! ¡Qué perdida di tempo!\n@c0@"
  fr: "@aPandora@bTu te rends compteⓡ Faire un effort pareil juste pour reluquer quelqu'unⓠ Il y a vraiment des bons\nà rien, sur terreⓠ\n@c0@"
  it: "@aViola@bHa fatto tutta questa fatica solo per spiare una donna da lontano?!\nCerto che gli uomini sono strani...\n@c0@"
  ja: "@a@bデボラ「この男　わざわざこんな所まで来て\n\tのぞき見しようだなんて\n\t本当に　どうしようもないわね。\n@c0@"
302:
  de: "@aGriselda@bWir gehen, %a000090. Komm schon, %a001240. Und du auch, %a001250. Sonst werfen uns die Leute noch in einen Topf mit diesem Spanner.\n@c0@"
  en: "@aDebora@bWe're leaving, %a000090. Come on, %a001240. You too, %a001250. We don't want to be tarred with the same brush as this oaf.\n@c0@"
  es: "@aStefania@bAndiamo, %a000090. Vamos, %a001240. Y tú también, %a001250. No queremos que piensen que tenemos algo que ver con este zoticone.\n@c0@"
  fr: "@aPandora@bOn s'en va, %a000090. Viens, %a001240.\nEt toi aussi, %a001250. Pas question qu'on nous mette dans le même panier que ce crétin.\n@c0@"
  it: "@aViola@bAndiamo via, %a000090.\n%0%a001240, %a001250! Forza, si va via! Non voglio che ci confondiamo con certa gentaglia!\n@c0@"
  ja: "@a@bデボラ「行くわよ　%a000090。\n\tほら　%a001240と　%a001250もよ。\n\tそばにいたら　バカがうつるわ。\n@c0@"
303:
  de: "@a%0%a001240 und %0%a001250@bIch komme, Mama!\nIst gut, Mama!\n@c0@"
  en: "@a%0%a001240 & %0%a001250@bComing, Mum!\nOkay, Mum!\n@c0@"
  es: "@a%0%a001240 y %a001250@b¡Voy, mami!\n¡Muy bien, mamá!\n@c0@"
  fr: "@a%0%a001240 et %0%a001250@bJ'arrive, mamanⓠ\nD'accord, mamanⓠ\n@c0@"
  it: "@a%0%a001240 e %a001250@bVa bene!\nD'accordo, mamma!\n@c0@"
  ja: "@a@b%a001240「は～い　お母さん。\n%a001250「は～い　お母さん。\n@c0@"
304:
  de: "@aGriselda@bEs ist schon spät, du solltest uns besser ein Zimmer für die Nacht suchen. Es schadet meinem Teint, wenn ich zu lange aufbleibe...\n@c0@"
  en: "@aDebora@bTime's getting on, so you'd better hurry up and find us a room. Staying up late is bad for the complexion.\n@c0@"
  es: "@aStefania@bSe está haciendo tardeⓓ date prisa en encontrar una posada, ¿capisci? Trasnochar no es bueno para el cutis.\n@c0@"
  fr: "@aPandora@bLe temps passe. Tu ferais bien de te dépêcher de nous trouver une chambre. Veiller tard est mauvais pour le teint.\n@c0@"
  it: "@aViola@bCaro, trova una stanza.\nStare sveglia fino a tardi non fa bene alla mia pelle...\n\n@c0@"
  ja: "@a@bデボラ「もう　こんな時間だし\n\tいそいで　今日の宿を探してくれる？\n\t夜ふかしは　おハダに悪いのよ。\n@c0@"
305:
  de: "@aGriselda@bPuh, wie der Kerl stinkt! Wenn dir dein Leben lieb ist, %a000090, solltest du dich besser nie so volllaufen lassen wie er, verstanden?\n@c0@"
  en: "@aDebora@bYuck! He reeks of drink. You'll never get yourself into a state like that if you value your life, %a000090!\n@c0@"
  es: "@aStefania@b¡Puaj! Apesta a alcohol. ¡Si sabes lo que te conviene, nunca llegues a ese estado, %a000090! ¿Capisci?\n@c0@"
  fr: "@aPandora@bBeurkⓠ Il sent la boisson. Si tu tiens à la vie, %a000090, ne te mets jamais dans un état pareilⓠ\n@c0@"
  it: "@aViola@bAllora, %a000090, quand'è che mi comprerai quegli abitini che ti ho chiesto?\n@c0@"
  ja: "@a@bデボラ「んもう　お酒くさいわね……！\n\t%a000090は　こんなになるまで\n\t飲んだりするんじゃないわよ。\n@c0@"
306:
  de: "@aGriselda@bJa, du solltest auch etwas für deine Muskelkraft tun, %a000090. Schließlich willst du mir und den Kindern imponieren können, oder?\n@c0@"
  en: "@aDebora@bYes, you should make yourself stronger, %a000090. We don't want you dragging me and the kids down.\n@c0@"
  es: "@aStefania@bSí, tienes que hacerte più forte, %a000090. No querrás retrasarnos a mí y a los bambini.\n@c0@"
  fr: "@aPandora@bOui, tu devrais t'endurcir un peu, %a000090.\nJe ne voudrais pas que tu nous retardes, moi et\nles enfants.\n@c0@"
  it: "@aViola@bHai capito, %a000090? Cerca di diventare più forte, così potrai difendermi agevolmente da qualsiasi mostro troveremo sul nostro cammino.\n@c0@"
  ja: "@a@bデボラ「%a000090も　もっと強くなって\n\t私や　子供たちの足を\n\t引っぱらないように　してちょうだいね。\n@c0@"
307:
  de: "@aGriselda@bKann der seine Heulerei nicht daheim erledigen? Außerdem ist er alt, und wenn er hier draußen bleibt, holt er sich noch den Tod.\n@c0@"
  en: "@aDebora@bCan't he do his crying in private? Besides anything else, he's old and he could catch his death out here.\n@c0@"
  es: "@aStefania@b¿No puede llorar en privado? Encima, es vecchio y podría quedarse en el sitio.\n@c0@"
  fr: "@aPandora@bIl ne pourrait pas se lamenter en priverⓡ\nEn plus du reste, il est vieux et pourrait bien attraper la mort, là-dehors.\n@c0@"
  it: "@aViola@bNo, %a000090.\nStavolta non dirò nulla.\nIl dolore di quest'uomo va rispettato in silenzio...\n@c0@"
  ja: "@a@bデボラ「泣くのは　家でもできるでしょうに。\n\tただでさえ　年をとっているんだから\n\tこんな所で寝たら　身体をこわすわよ。\n@c0@"
308:
  de: "@aGriselda@bWir müssen uns beeilen und endlich für Frieden auf der Welt sorgen. Diese ganze Reiserei geht mir allmählich auf die Nerven...\n@c0@"
  en: "@aDebora@bWe need to hurry up and bring peace to the world. I'm starting to get tired of all this travelling.\n@c0@"
  es: "@aStefania@bTenemos que darnos prisa en traer la pace al mondo. Ya me estoy cansando de tanto viajar.\n@c0@"
  fr: "@aPandora@bIl faut qu'on se dépêche de ramener la paix dans le monde. Je commence à être fatiguée de tous ces voyages.\n@c0@"
  it: "@aViola@bCosì non si può andare avanti, %a000090.\nI mostri sono diventati troppo aggressivi...\nDobbiamo fare qualcosa!\n@c0@"
  ja: "@a@bデボラ「早く　平和な世界を\n\t取り戻さないといけないわね。\n\tさすがに　旅にもつかれてきたし。\n@c0@"
309:
  de: "@aGriselda@bIch bin nur selten müde, wenn du in der Nähe bist.\n@c0@"
  en: "@aDebora@bI don't tend to feel tired when you're\r\naround, actually.\n@c0@"
  es: "@aStefania@bCuando estoy con te no me canso.\n@c0@"
  fr: "@aPandora@bQuand tu es avec moi, je ne me sens pas tellement fatiguée.\n@c0@"
  it: "@aViola@bA me basta vedere il tuo volto ubbidiente per sentirmi sempre fresca e in forma.\n@c0@"
  ja: "@a@bデボラ「少なくとも　私は\n\t%a000090がそばにいれば\n\tつかれなんて　感じないわよ。\n@c0@"
310:
  de: "@aGriselda@bWahrscheinlich, weil ich dich die ganze schwere Arbeit erledigen lasse...\n@c0@"
  en: "@aDebora@bThat's probably because I make you take care of all the hard work, though!\n@c0@"
  es: "@aStefania@b¡Será porque te obligo a fare tutto il trabajo duro!\n@c0@"
  fr: "@aPandora@bC'est sûrement parce que je t'oblige à faire toutes les tâches difficiles.\n@c0@"
  it: "@aViola@bProprio così, caro. Io eseguo e tu ubbidisci.\nÈ questo il segreto della mia felicità.\nE se io sono felice, lo sei anche tu, dico bene?\n@c0@"
  ja: "@a@bデボラ「だって　大変そうなことは全部\n\t%a000090にやってもらえば\n\tいいだけだから。\n@c0@"
311:
  de: "@aGriselda@bIch war immer der Meinung, dass Eltern es ein wenig übertreiben.\n@c0@"
  en: "@aDebora@bI've always thought parents tend to go on a bit.\n@c0@"
  es: "@aStefania@bSempre he creído que los padres tienden a ofuscarse demasiado.\n@c0@"
  fr: "@aPandora@bJ'ai toujours pensé que les parents s'inquiétaient trop.\n@c0@"
  it: "@aViola@bNon rischierei mai la vita per un tesoro...\n@c0@"
  ja: "@a@bデボラ「親なんて　口うるさいだけの\n\tものだって　思っていたけど……\n@c0@"
312:
  de: "@aGriselda@bSo denke ich immer noch, auch wenn ich jetzt selbst Mutter bin. Mama und Papa machen sich viel zu viele Sorgen.\n@c0@"
  en: "@aDebora@bI still think it now, even though I'm a mum.\r\nMama and Papa definitely worry too much.\n@c0@"
  es: "@aStefania@bY aún lo pienso, aunque yo misma soy madre.\nLa mia mamma e il mio papino, desde luego, se preocupan mucho.\n@c0@"
  fr: "@aPandora@bEt je continue de le penser, même en étant moi-même devenue mère. Mamma et papa se font beaucoup trop de souci, c'est certain.\n@c0@"
  it: "@aViola@bA meno che il tesoro non fosse davvero prezioso!\n@c0@"
  ja: "@a@bデボラ「いざ　自分が　母親になって\n\t思ったけど　私の両親は\n\t心配性すぎるんだと　気づいたわ。\n@c0@"
313:
  de: "@aGriselda@bDarum hat Papa auch so wenig Haare, weißt du. Dir darf das nicht passieren, verstanden?\n㈡\nUnseren Kindern geht's gut, also brauchst du dir keine Sorgen zu machen.\n@c0@"
  en: "@aDebora@bThat's why Papa's so bald, you know. You'll have to watch out for that. Our kids are fine, so don't worry about them.\n@c0@"
  es: "@aStefania@bPor eso il mio papino está calvo. Deberás tener cuidado con eso. Los bambini están bien, non ti preoccupare.\n@c0@"
  fr: "@aPandora@bC'est pour ça que papa est aussi chauve, tu sais.\r\nIl va falloir que tu fasses attention. Nos enfants vont bien, alors inutile de t'en faire pour eux.\n@c0@"
  it: "@aViola@bIn quel caso, ti chiederei gentilmente di andarlo a prendere e portarmelo, in barba a qualsiasi rischio tu dovessi affrontare per esaudire il mio desiderio!\n㈡\nFarei qualsiasi cosa pur di darti l'opportunità di non sentirti inutile, caro…\n@c0@"
  ja: "@a@bデボラ「だから　パパは　ハゲるのよ。\n\tあんたも　気をつけなさいね。\n\t私たちの子どもは　大丈夫だから。\n@c0@"
314:
  de: "@aGriselda@bDas erinnert mich daran, wie Nera immer ihre Sachen vergraben und Schatzkarten gezeichnet hat, als sie noch klein war.\n@c0@"
  en: "@aDebora@bThat reminds me of how Nera used to bury her things and draw treasure maps when she was little.\n@c0@"
  es: "@aStefania@bEso me recuerda que, de bambina, Nera enterraba sus cosas y dibujaba mapas del tesoro.\n@c0@"
  fr: "@aPandora@bÇa me rappelle l'époque où Nera enterrait ses affaires et dessinait des cartes au trésor, quand elle était petite.\n@c0@"
  it: "@aViola@bUna mappa del tesoro? Ricordo che da piccola Nera nascondeva una delle sue bambole da qualche parte, e poi disegnava una mappa per ritrovarla...\n@c0@"
  ja: "@a@bデボラ「そういえば　小さい頃のフローラも\n\t宝の地図をかいたり　自分の宝物を\n\tうめたりするのが　好きだったわね。\n@c0@"
315:
  de: "@aGriselda@bOb ich das auch getan habe? Nein, aber mir hat es immer einen Riesenspaß gemacht, ihre Schätze wieder auszugraben! Ha!\n@c0@"
  en: "@aDebora@bDid I do the same? No, but I had a whale of a time digging up her stash! Ha!\n@c0@"
  es: "@aStefania@b¿Que si yo lo hacía? ¡No, ma era genial desenterrar sus cosas! ¡Ja!\n@c0@"
  fr: "@aPandora@bSi j'ai fait la même choseⓡ Non, mais je m'amusais comme une folle à déterrer ce qu'elle avait caché pour le remettre dans son placardⓠ Ha haⓠ\n@c0@"
  it: "@aViola@bA volte spostavo la bambola in un altro punto della casa o del giardino, e lei non riusciva a spiegarsi perché non fosse più dove l'aveva messa!\n㈡\nEra un vero spasso!\n@c0@"
  ja: "@a@bデボラ「え　私？\n\t私は　それをほりかえすのを\n\t楽しんでいたわ。\n@c0@"
316:
  de: "@aGriselda@bNatürlich hat Lothar die Sachen immer für mich ausgegraben. Sonst hätte ich mir ja noch einen Nagel abgebrochen oder so...\n@c0@"
  en: "@aDebora@bNaturally, Crispin was always the one who dug it up. I wouldn't want to break a nail or anything.\n@c0@"
  es: "@aStefania@bAunque era Crispín quien las desenterraba. ¡No iba a hacerlo yo y romperme una uña!\n@c0@"
  fr: "@aPandora@bÉvidemment, c'était toujours Gaëtan qui se chargeait de creuser pour moi. Je ne voulais pas risquer de me casser un ongle.\n@c0@"
  it: "@aViola@bPer essere precisa, era Candido che spostava la bambola su mio ordine. Per me sarebbe stato troppo faticoso farlo di persona...\n@c0@"
  ja: "@a@bデボラ「もちろん　ほるのはアンディで\n\t私は　宝物を　受けとるだけよ。\n\tだって　ネイルが　よごれちゃうでしょ？\n@c0@"
317:
  de: "@aNera@bWas, seit fünfzehn Jahren arbeitet er hier? Was für ein fleißiger Mann!\n@c0@"
  en: "@aNera@bHe's been coming here every day for fifteen years? What a dedicated man!\n@c0@"
  es: "@aNera@b¿Lleva quince anni viniendo aquí cada giorno? ¡Qué hombre más entregado!\n@c0@"
  fr: "@aNera@bIl vient ici chaque jour depuis quinze ansⓡ\nQuel homme dévouéⓠ\n@c0@"
  it: "@aNera@bQuindici anni?!\nMica male!\n@c0@"
  ja: "@a@bフローラ「１５年間　毎日\n\tこのお店に　通い続けていらしたのかしら？\n\tずいぶんと　マメな方ですのね。\n@c0@"
318:
  de: "@aGriselda@bSeit fünfzehn Jahren kommt er jeden Tag hierher? Er muss eine Menge Zeit haben, welch ein Glückspilz.\n@c0@"
  en: "@aDebora@bHe's been coming here every day for fifteen years? He must have plenty of time on his hands, the lucky thing.\n@c0@"
  es: "@aStefania@b¿Lleva quince anni viniendo aquí cada giorno? Debe de tener mucho tiempo libreⓓ qué buona fortuna.\n@c0@"
  fr: "@aPandora@bIl vient ici chaque jour depuis quinze ansⓡ\nIl doit avoir plein de temps à perdre, le veinard.\n@c0@"
  it: "@aViola@bFa lo stesso lavoro da quindici anni?\nBazzecole! Tu dovrai servirmi e riverirmi per tutta la vita, altro che quindici anni!\n@c0@"
  ja: "@a@bデボラ「１５年間　毎日\n\tこの店に　通い続けていたのかしら。\n\t本当にヒマなのね。　うらやましいこと。\n@c0@"
319:
  de: "@aGriselda@bJa, sie ist ganz hübsch. Aber natürlich kann sie sich nicht mit meiner Schönheit messen...\n@c0@"
  en: "@aDebora@bI suppose she's quite pretty.\nStill not a patch on me, though.\n@c0@"
  es: "@aStefania@bSupongo que es bastante bella, sí.\nPero niente que hacer a mi lado, claro.\n@c0@"
  fr: "@aPandora@bElle est plutôt jolie, c'est vrai. Loin derrière moi quand même, évidemment.\n@c0@"
  it: "@aViola@bCarina, quella Lina Gerie.\nCerto, paragonata a me sembra un rospaccio, ma non è mica colpa sua se sono tanto bella...\n@c0@"
  ja: "@a@bデボラ「フン　まあまあキレイな娘ね。\n\t私にくらべたら　まだまだだけど。\n@c0@"
320:
  de: "@aGriselda@bIch glaube, die in der Mitte ist die Hübscheste. Allerdings kein Vergleich mit mir.\n@c0@"
  en: "@aDebora@bI suppose the one in the middle is the prettiest.\r\nShe's still not a patch on me, though.\n@c0@"
  es: "@aStefania@bSupongo que la del centro es la más bellina.\nAunque no me llega a la altura de los zapatos. Ni descalza.\n@c0@"
  fr: "@aPandora@bC'est vrai que c'est celle du milieu la plus jolie. Mais elle ne fait quand même pas le poids à côté de moi.\n@c0@"
  it: "@aViola@bSì, la ragazza al centro è carina.\nPerò ce ne vorrebbero trenta come lei, per fare una donna splendida come la sottoscritta...\n@c0@"
  ja: "@a@bデボラ「たしかに　真ん中の娘が\n\tいちばん　キレイではあるわね。\n\tそれでも　私のほうが　美しいけど。\n@c0@"
321:
  de: "@aGriselda@bDamals hatte der alte Kerl seine grauen Zellen bestimmt noch beisammen...\n@c0@"
  en: "@aDebora@bI'm sure this old man was much more together when we saw him all those years ago.\n@c0@"
  es: "@aStefania@bSonno sicura que este vecchio tenía la cabeza más clara cuando lo vimos hace años.\n@c0@"
  fr: "@aPandora@bJe suis sûre que ce vieil homme était plus vif quand nous l'avons croisé il y a toutes ces années.\n@c0@"
  it: "@aViola@bAccidenti, quant'è invecchiato quel tipo!\n@c0@"
  ja: "@a@bデボラ「昔　このおじいさんに会ったときには\n\tもっと　しっかりしていたような\n\t気がするんだけど……\n@c0@"
322:
  de: "@aGriselda@bEs ist schrecklich, wie die Zeit einen zugrunde richtet.\n@c0@"
  en: "@aDebora@bThe passing of time can be very cruel.\n@c0@"
  es: "@aStefania@bEl tiempo es muy cruel.\n@c0@"
  fr: "@aPandora@bLe temps qui passe peut être très cruel.\n@c0@"
  it: "@aViola@bPer fortuna io sono sempre giovane e bella.\nNon è vero, caro?\n@c0@"
  ja: "@a@bデボラ「時の流れって　ざんこくだわ。\n@c0@"
323:
  de: "@aOtto@bEs heißt, dass man einen Mann an seinen Taten messen kann... Wie wahr, wie wahr. Ich muss mich unbedingt noch mehr anstrengen!\n@c0@"
  en: "@aTuppence@bThey say a man is the sum of his achievements, and they're right. I must try harder!\n@c0@"
  es: "@aAlazar@bDicen que por sus obras los conocerás, y tienen razón. ¡Tengo que esforzarme más!\n@c0@"
  fr: "@aInnocent@bOn dit que ce qui fait un homme, ce sont toutes\nses réussites, et c'est vrai. Il faut que je poursuive mes effortsⓠ\n@c0@"
  it: "@aSimon@bCon queste manone grosse che mi ritrovo, non riuscirei mai a costruire una nave in bottiglia...\nAl limite, potrei provare a farne una in una botte!\n@c0@"
  ja: "@a@bピピン「芸は身を助ける　って\n\tよく言いますけど　本当ですね。\n\tボクも　がんばらなくっちゃ！\n@c0@"
324:
  de: "@aGriselda@bAlso ist er den Fängen des Ordens vom Zugzwang nur entkommen, weil ihn diese Buddelschiffe reich gemacht haben...\n@c0@"
  en: "@aDebora@bSo he escaped being roped in with the Order of Zugzwang because these ships in bottles made\r\nhim rich.\n@c0@"
  es: "@aStefania@bAsí que logró escapar de la Orden de Zugzwang porque se hizo rico con estos barcos en bottiglia.\n@c0@"
  fr: "@aPandora@bAlors comme ça, il a échappé à l'embrigadement\r\ndans l'Ordre du Zugzwang parce que ses bateaux en bouteille l'ont rendu riche.\n@c0@"
  it: "@aViola@bE così, grazie alle sue navi in bottiglia, non solo è riuscito a evitare l'errore di unirsi alla Setta di Zugzwang, ma è anche diventato ricco!\n@c0@"
  ja: "@a@bデボラ「このおじさん　ボトルシップの\n\tおかげで　お金持ちになれたばかりか\n\t光の国へも　行かずにすんだのね。\n@c0@"
325:
  de: "@aGriselda@bDa sieht man mal wieder, wie wichtig es doch ist, ein Talent zu besitzen. Für mich aber nicht, schließlich habe ich ja dich...\n@c0@"
  en: "@aDebora@bIt just goes to show how having a skill can get you somewhere in life. I have you, though, so I don't need to bother with anything like that.\n@c0@"
  es: "@aStefania@bEs la muestra de que, para arribare a algún lado, es necesario tener alguna habilidad. Como yo te tengo a ti, no me hace falta preocuparme con esas tonterías.\n@c0@"
  fr: "@aPandora@bÇa prouve bien qu'avoir un talent, ça peut mener loin, dans la vie. Mais bon, moi je t'ai toi, alors je n'ai pas besoin de me casser la tête avec ça.\n@c0@"
  it: "@aViola@bChe fortuna, eh?\nBuon per lui!\n@c0@"
  ja: "@a@bデボラ「技術があるのは　いいことよ。\n\t私には　%a000090がいるから\n\tそんなものは　必要ないけど。\n@c0@"
326:
  de: "@aGriselda@bDu findest das wohl besonders lustig, was, %a000090?\n@c0@"
  en: "@aDebora@bI suppose you think that's funny, do you, %a000090?\n@c0@"
  es: "@aStefania@bAllora, voy a hacerle a este tipo una oferta por su sitio que no podrá rechazar...\n@c0@"
  fr: "@aPandora@bJ'ose espérer que tu ne vas pas perdre ton temps\nà chercher une bonne place, %a000090ⓡ\n@c0@"
  it: "@aViola@bCosa c'è, %a000090?!\nHai voglia di restar qui a guardare le ballerine?!\n@c0@"
  ja: "@a@bデボラ「ふうん　面白いじょうだんを\n\t言うようになったじゃない　%a000090？\n@c0@"
327:
  de: "@a@bGriselda sieht ganz schön wütend aus.\n@c0@"
  en: "@a@bDebora seems rather angry.\n@c0@"
  es: "@a@bStefania se frota las manos.\n@c0@"
  fr: "@a@bPandora affiche un air dédaigneux.\n@c0@"
  it: "@a@b%3Viola è decisamente contrariata!%4\n@c0@"
  ja: "@a@bデボラは　怒りを　ためている！\n@c0@"
328:
  de: "@aGriselda@bSolche Männer sind doch wirklich reine Platzverschwendung.\n@c0@"
  en: "@aDebora@bMen like him really are a waste of space.\n@c0@"
  es: "@aStefania@bLos hombres como él son veramente un estorbo. Me dispiace, ¿capisci?\n@c0@"
  fr: "@aPandora@bLes hommes tels que lui sont vraiment des bons à rien.\n@c0@"
  it: "@aViola@bLina Gerie e Nefertitty?!\nPfui! Io sono dieci volte più bella di tutte e due messe insieme!\n@c0@"
  ja: "@a@bデボラ「こういうときの　男って\n\t本当に　どうしようもないわね。\n@c0@"
329:
  de: "@aGriselda@bIch frage mich, wie es Nofretutti in ihrer Heimat wohl ergeht...\n@c0@"
  en: "@aDebora@bI wonder how Cleo is getting along back in\r\nher hometown.\n@c0@"
  es: "@aStefania@bMe pregunto cómo le irá a Nefertita en su città natale.\n@c0@"
  fr: "@aPandora@bJe me demande comment va Néferlili, maintenant qu'elle est rentrée chez elle.\n@c0@"
  it: "@aViola@bImmagino che Nefertitty sia tornata a casa...\nMi chiedo se senta nostalgia del mondo dello spettacolo...\n@c0@"
  ja: "@a@bデボラ「そういえば　あのクラリスって娘\n\t今は　どうしているのかしらね。\n\t故郷で　うまくやっているのかしら。\n@c0@"
330:
  de: "@aGriselda@bWas denkst du dir eigentlich dabei, einfach so bei fremden Leuten reinzuplatzen, als ob du dort zu Hause wärst?!\n@c0@"
  en: "@aDebora@bWhat are you thinking of, charging into private rooms as if you owned the place?\n@c0@"
  es: "@aStefania@b¡¿En qué estabas pensando?! No se puede entrar così a los sitios, sin llamar ni nada.\n@c0@"
  fr: "@aPandora@bMais ça ne va pas la tête de rentrer comme ça, sans prévenir, comme si tu étais chez toiⓡ\n@c0@"
  it: "@aViola@bNon ho parole...\n@c0@"
  ja: "@a@bデボラ「踊り娘のお風呂をのぞくだなんて\n\tあんた　何を考えてるの！？\n@c0@"
331:
  de: "@aGriselda@bEs sollte mich nicht wundern, dass du so gedankenlos bist. Du denkst an niemanden außer an dich selbst!\n@c0@"
  en: "@aDebora@bWell, I shouldn't be surprised to see you being so thoughtless. You never think of anyone but yourself!\n@c0@"
  es: "@aStefania@bEres veramente egoísta, %a000090. Deberías aprender de mí.\n@c0@"
  fr: "@aPandora@bRemarque, je ne devrais même pas être surprise.\nTu ne penses tout le temps qu'à toiⓠ\n@c0@"
  it: "@aViola@bTutto mi sarei aspettato, %a000090, ma non che ti comportassi in maniera tanto maleducata.\nChe delusione...\n@c0@"
  ja: "@a@bデボラ「だいたいね　のぞきとか\n\tとても　ひきょうなことよ。\n\t恥ずかしいとは　思わないの？\n@c0@"
332:
  de: "@aGriselda@bWas für ein schöner voller Mond! Da hast du aber Glück, %a000090, jetzt kannst du meine Schönheit sogar im Mondschein betrachten!\n@c0@"
  en: "@aDebora@bWhat a lovely bright moon! All the better for you to enjoy my beauty by the light of, %a000090!\n@c0@"
  es: "@aStefania@b¡Qué luna más bella! ¡Puedes utilizar la sua luce para admirar mi bellezza, %a000090!\n@c0@"
  fr: "@aPandora@bQuelle belle lune brillanteⓠ C'est encore mieux pour toi de pouvoir admirer ma beauté à la lumière de la lune, hein, %a000090ⓡ\n@c0@"
  it: "@aViola@bLa mia bellezza risplende ancora di più, quand'è illuminata dalla pallida luce della luna...\nDico bene, %a000090?\n@c0@"
  ja: "@a@bデボラ「すてきな月明かりね。\n\tこれなら　夜でも　私の美しい姿を\n\t%a000090に見せてあげられるわ。\n@c0@"
333:
  de: "@a%0%a001250@bIch werde auch langsam... müde...\n@c0@"
  en: "@a%0%a001250@bI'm feeling...a bit...sleepy too...\n@c0@"
  es: "@a%0%a001250@bTambién tengo... un poco... de sueño...\n@c0@"
  fr: "@a%0%a001250@bJ'ai un peu... sommeil... moi aussi...\n@c0@"
  it: "@a%0%a001250@bYaaawn...\nAnch'io ho un po' di sonno...\n@c0@"
  ja: "@a@b%a001250「わたしも…　ちょっと\n\tねむくなってきたです……　くー。\n@c0@"
334:
  de: "@aGriselda@bHm... Wenn er nachts schläft, kann er als Leuchtturmwärter ja nicht viel taugen, oder? Welch ein Nichtsnutz!\n@c0@"
  en: "@aDebora@bUm... If he sleeps at night, then he's not much of a lighthouse keeper, is he? What a useless creature!\n@c0@"
  es: "@aStefania@bMmm... Si duerme de notte, no será muy buen farero. ¡Qué tipo más inútil!\n@c0@"
  fr: "@aPandora@bHum... S'il s'endort pendant la nuit, il ne fait pas un très bon gardien de phare, nonⓡ Encore un être inutileⓠ\n@c0@"
  it: "@aViola@bIl guardiano del faro dorme di notte?!\nMa è roba da licenziamento in tronco!\n@c0@"
  ja: "@a@bデボラ「ちょっと……　夜に寝ていたら\n\t灯台守になっていないじゃないの。\n\tダメなおじさんね　もう！\n@c0@"
335:
  de: "@aGriselda@bPasst die Katze vielleicht auf den Leuchtturm auf...? Wohl kaum!\n@c0@"
  en: "@aDebora@bIs the cat acting as lighthouse keeper?\n...Surely not!\n@c0@"
  es: "@aStefania@b¿¿Il gatto está haciendo de farero?!\n¡No puede ser!\n@c0@"
  fr: "@aPandora@bEst-ce que c'est le chat qui joue les gardiensⓡ\n... Non, quand même pasⓠ\n@c0@"
  it: "@aViola@bNon dirmi che è il gatto a badare al faro, perché non ci crederei mai!\n@c0@"
  ja: "@a@bデボラ「ネコが灯台守　か……\n\tそんなことは　ありえないわよね。\n@c0@"
336:
  de: "@aGriselda@bDie Sterne sind wunderschön, nicht? Schönes zieht mich magisch an. Das meinen die Leute wohl mit dem Spruch ⓞGleich und gleich gesellt sich gernⓟ.\n@c0@"
  en: "@aDebora@bThe stars are lovely, aren't they? I'm very drawn to pretty things. I suppose like attracts like.\n@c0@"
  es: "@aStefania@bLas estrellas son veramente preciosas. Me gustan las cosas più bellas. Los iguales se atraen, supongo.\n@c0@"
  fr: "@aPandora@bLes étoiles sont très belles, tu ne trouves pasⓡ\nJe suis très attirée par les belles choses.\nQui se ressemble s'assemble, j'imagine.\n@c0@"
  it: "@aViola@bChe belle, le stelle...\nLa loro luce rallegra il cielo notturno proprio come la mia bellezza illumina gli occhi di chi mi guarda...\n@c0@"
  ja: "@a@bデボラ「ステキな星空ね。\n\t私　キレイなものが大好きなの。\n\t私自身が　美しいからだと思うわ。\n@c0@"
337:
  de: "@aNera@bIch habe früher Schatzkarten gezeichnet. Das ging so weit, dass ich meine Schätze sogar selbst vergraben habe! He he!\n@c0@"
  en: "@aNera@bI used to draw treasure maps when I was his age. I'd even go so far as to bury the treasure myself. He he!\n@c0@"
  es: "@aNera@bCuando yo tenía su edad solía dibujar mapas de tesoros. A veces incluso yo misma enterraba veramente un tesoro. ¡Ji, ji!\n@c0@"
  fr: "@aNera@bQuand j'avais son âge, je dessinais des cartes au trésor. J'étais même allée jusqu'à enterrer moi-même le trésor à trouver. Hi hiⓠ\n@c0@"
  it: "@aNera@bNon ho bisogno di una mappa per trovare il mio tesoro... Ce l'ho qui, al mio fianco.\n%0%a000090, sei tu il mio tesoro.\n\n@c0@"
  ja: "@a@bフローラ「私も　小さい頃　自分で\n\t宝の地図を　かいたりしましたのよ。\n\t自分で　宝物をうめて…　うふふ。\n@c0@"
338:
  de: "@aNera@bAber es war wirklich merkwürdig. Irgendwie ist der Schatz immer wieder in meinem Schrank gelandet.\n@c0@"
  en: "@aNera@bBut it was really very strange. I'd always end up finding the treasure mysteriously back inside my cupboard.\n@c0@"
  es: "@aNera@bMa era rarísimo. Siempre terminaba encontrando el tesoro otra vez en mi armario. Muy misterioso.\n@c0@"
  fr: "@aNera@bMais c'était vraiment très bizarre. Je finissais toujours par retrouver le trésor mystérieusement rangé à sa place dans mon placard.\n@c0@"
  it: "@aNera@bDa piccola, però, anch'io andavo a caccia di tesori, sai?\n㈡\nIl gioco era questo: mettevo una delle mie bambole da qualche parte, e poi disegnavo una mappa per ritrovarla...\n@c0@"
  ja: "@a@bフローラ「でも　どういうわけか　いつも\n\tうめたはずの場所から　宝物がなくなって\n\t私のタンスに　もどっているんですの。\n@c0@"
339:
  de: "@aNera@bGriselda meinte, dass die Feen mir einen Streich spielen würden, aber wenn ich jetzt so darüber nachdenke, war sie es vermutlich!\n@c0@"
  en: "@aNera@bDebora always said it was the faeries up to their tricks, but now I come to think of it, it was\r\nprobably her!\n@c0@"
  es: "@aNera@bStefania decía siempre que eran las hadas y sus bromas, ¡pero, ahora que lo pienso, sicuro que era ella!\n@c0@"
  fr: "@aNera@bPandora me disait toujours que c'étaient les fées\nqui me jouaient des tours, mais maintenant que\nj'y pense, je crois plutôt que c'était elleⓠ\n@c0@"
  it: "@aNera@bA volte, però, la bambola spariva!\n㈡\nViola mi diceva che le fate l'avevano spostata per farmi uno scherzo, ma secondo me era lei che la nascondeva altrove!\n@c0@"
  ja: "@a@bフローラ「姉さんは妖精のしわざでしょ　って\n\t言っていましたけど　今考えると　あれは\n\t姉さんが　やっていたんでしょうね。\n@c0@"
340:
  de: "@a%0%a001240@bWas könnt Ihr denn da sehen? Ich will auch mal gucken!\n@c0@"
  en: "@a%0%a001240@bWhat is it that you can see? I want to have a look!\n@c0@"
  es: "@a%0%a001240@b¿Qué es lo que ves? ¡Quiero mirar!\n@c0@"
  fr: "@a%0%a001240@bQu'est-ce qu'il y a à voirⓡ Je veux regarder aussiⓠ\n@c0@"
  it: "@a%0%a001240@bPosso guardare anch'io?\nDev'essere uno spettacolo interessante, no?\n@c0@"
  ja: "@a@b%a001240「なに？　なに？\n\tなにが　見えるの？\n\tボクも　見てみたいよっ！\n@c0@"
341:
  de: "@aGriselda@bⓞIch willⓟ gibt es nicht. Wir gehen, verstanden?\n@c0@"
  en: "@aDebora@bⓗI wantⓘ doesn't get. We're leaving.\nUnderstood?\n@c0@"
  es: "@aStefania@bNo me importa lo que quieras. Andiamo.\n¿Capisci?\n@c0@"
  fr: "@aPandora@bOn ne dit pas ⓥje veuxⓦ.\nOn s'en va, comprisⓡ\n@c0@"
  it: "@aViola@bScordatelo, %a001240.\nAbbiamo cose ben più importanti di cui occuparci.\nVieni via, e non fare storie.\n@c0@"
  ja: "@a@bデボラ「%a001240は　見る必要のないものよ。\n\tさ　もう行くわよ。　……返事は？\n@c0@"
342:
  de: "@a%0%a001240@b... Ja, Mama.\n@c0@"
  en: "@a%0%a001240@b...Yes, Mum.\n@c0@"
  es: "@a%0%a001240@b... Sí, mamá.\n@c0@"
  fr: "@a%0%a001240@b... Oui, maman.\n@c0@"
  it: "@a%0%a001240@bMa perché?!\nSono l'Eroe Leggendario, no?!\nHo il diritto di sapere cosa succede intorno a me!\n@c0@"
  ja: "@a@b%a001240「は～い　お母さん。\n@c0@"
343:
  de: "@a%0%a001240@bWas könnt Ihr denn da sehen? Ich will auch mal gucken!\n@c0@"
  en: "@a%0%a001240@bWhat is it that you can see? I want to have a look!\n@c0@"
  es: "@a%0%a001240@b¿Qué es lo que ves? ¡Quiero mirar!\n@c0@"
