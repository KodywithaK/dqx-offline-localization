  fr: "@aSancho@bLe señor Petros l'a sauvé des m-m-monstres. C'était oun capitán si courageux et si m-m-merveilleuxⓠ\n@c0@"
  it: "@aSancho@bEl señor Russel lo salvò da los mostros, muchos años fa...\n@c0@"
  ja: "@a@bサンチョ「旅の途中\n\t魔物に　おそわれていた　あの老人を\n\tパパスさまが　救ったのです。\n@c0@"
210:
