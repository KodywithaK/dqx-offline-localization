0:
  de: "@aBianca@bMeine Güte, da kommen aber Erinnerungen hoch, was? Hier hat der alte Rodrigo uns doch sein Schiff gegeben.\n@c0@"
  en: "@aBianca@bBlimey, this place brings back a few memories, eh? This is where old Briscoletti give us the boat.\n@c0@"
  es: "@aBianca@bDemonios, qué recuerdos me trae este sitio. Aquí es donde el viejo Rimaldi nos dio el barco.\n@c0@"
  fr: "@aBianca@bSaperlipopette, cet endroit rappelle quelques souvenirs, heinⓡ C'est ici qu'Oscuroni nous a\noffert le bateau.\n@c0@"
  it: "@aBianca@bGrandport mi fa tornare alla mente mille ricordi...\nÈ qui che mister Fosconi ci diede la sua nave.\n@c0@"
  ja: "@a@bビアンカ「うわあ　本当に\n\tなつかしいわ。　ルドマンさんから\n\tここで　船をもらったのよね。\n@c0@"
1:
  de: "@aBianca@bAls wir das erste Mal herkamen, waren wir gerade frisch verheiratet, was? Und jetzt sieh uns an!\n@c0@"
  en: "@aBianca@bThe first time we come here was just after we got married, eh? And now here we are again today.\n@c0@"
  es: "@aBianca@bLa primera vez que vinimos fue justo después de casarnos, ¿no? Y aquí estamos otra vez.\n@c0@"
  fr: "@aBianca@bLa première fois que nous sommes venus ici, c'était juste après notre mariage, n'est-ce pasⓡ Et nous y voilà de nouveau aujourd'hui.\n@c0@"
  it: "@aBianca@bVenimmo qui per la prima volta subito dopo il nostro matrimonio.\nE adesso rieccoci, un po' più vecchi e preoccupati...\n@c0@"
  ja: "@a@bビアンカ「最初に　ここに来たのが\n\t結婚してすぐでしょ？\n\tそれで　今日　ここに来て……。\n@c0@"
2:
  de: "@aBianca@bWie es bei uns wohl beim nächsten Besuch ergeht?\n@c0@"
  en: "@aBianca@bI wonder what kind of situation we'll be in next time we're here.\n@c0@"
  es: "@aBianca@bA saber en qué situación nos veremos la próxima vez que vengamos.\n@c0@"
  fr: "@aBianca@bJe me demande dans quelle situation nous serons\r\nlors de notre prochain passage.\n@c0@"
  it: "@aBianca@bChissà come saremo la prossima volta che torneremo in questo posto...\n@c0@"
  ja: "@a@bビアンカ「次に来るときは\n\t私たち　どんな気分で\n\tいるのかしらね？\n@c0@"
3:
  de: "@aNera@bOh, ist das nicht komisch, wieder hier zu sein? Weißt du noch ⓚⓛ das letzte Mal waren wir hier, als wir frisch verheiratet waren!\n@c0@"
  en: "@aNera@bOh, how funny it is to be here again! We were here just after we were married, remember?\n@c0@"
  es: "@aNera@b¡Oh, veramente es divertido estar aquí otra vez! Aquí estuvimos justo después de casarnos, ¿recuerdas?\n@c0@"
  fr: "@aNera@bOh, comme c'est drôle d'être de nouveau iciⓠ\nNous y sommes venus juste après notre mariage,\ntu te souviensⓡ\n@c0@"
  it: "@aNera@bMi fa sempre piacere tornare a Grandport...\nQuesto è uno dei primi posti che visitammo dopo il nostro matrimonio, ricordi?\n@c0@"
  ja: "@a@bフローラ「まあ　なつかしい。\n\t思えば　ここは　私たちの旅の\n\t始まりの場所……。\n@c0@"
4:
  de: "@aNera@bVon hier aus sind wir aufs große weite Meer hinaus gesegelt.\n@c0@"
  en: "@aNera@bIt's from here that we set sail out into\r\nthe big, wide ocean.\n@c0@"
  es: "@aNera@bDesde aquí partimos al vasto océano.\n@c0@"
  fr: "@aNera@bC'est là que nous avons embarqué pour voguer sur le vaste océan.\n@c0@"
  it: "@aNera@bSalpammo da qui per iniziare il nostro lungo viaggio...\n@c0@"
  ja: "@a@bフローラ「ここから\n\t海へ　出たんでしたわね。\n@c0@"
5:
  de: "@a%0%a001240@bHe! Hier kann man ja wirklich schon das Meer riechen!\n@c0@"
  en: "@a%0%a001240@bHey! You can really smell the sea from here!\n@c0@"
  es: "@a%0%a001240@b¡Eh! ¡Desde aquí se huele el mar!\n@c0@"
  fr: "@a%0%a001240@bHéⓠ On sent vraiment la mer, d'iciⓠ\n@c0@"
  it: "@a%0%a001240@bSniff!\nSniff! Sniff!\n@c0@"
  ja: "@a@b%a001240「すごーい！\n\t海のにおいがするよ！　お父さん！\n@c0@"
6:
  de: "@a%0%a001240@bHumburg liegt auch nicht weit vom Meer, aber hier ist das Meer ja praktisch direkt nebenan!\n@c0@"
  en: "@a%0%a001240@bGotha isn't all that far from the ocean, but this place is practically right on top of it!\n@c0@"
  es: "@a%0%a001240@bNo es que Pankraz quede tan lejos del mar, ¡pero este sitio está prácticamente a pie de playa!\n@c0@"
  fr: "@a%0%a001240@bGotha n'est pas très loin de l'océan, mais cet endroit a vraiment les pieds dans l'eauⓠ\n@c0@"
  it: "@a%0%a001240@bSenti che odore di salsedine!\n@c0@"
  ja: "@a@b%a001240「グランバニアも\n\t海から近いけど　この町は\n\t海の上にあるみたいだね！\n@c0@"
7:
  de: "@a%0%a001240@b(Gähn) Das Rauschen des Meeres macht mich ganz schläfrig.\n@c0@"
  en: "@a%0%a001240@b(yawn) The noise of the waves is starting to make me feel sleepy.\n@c0@"
  es: "@a%0%a001240@b(aaah) El sonido de las olas me está dando sueño.\n@c0@"
  fr: "@a%0%a001240@b(bâillement) Le bruit des vagues commence à me bercer. Je m'endors...\n@c0@"
  it: "@a%0%a001240@bIl rumore delle onde è così rilassante...\nYaaawn...\nAnche troppo rilassante! Mi sta venendo sonno...\n@c0@"
  ja: "@a@b%a001240「ふわあ……。\n\t波の音　聞いてたら\n\t眠くなってきちゃったよ……。\n@c0@"
8:
  de: "@a%0%a001250@bHier weht so eine erfrischende Brise. Man hört sie schon über die Wellen heransausen.\n@c0@"
  en: "@a%0%a001250@bThe breeze here feels so refreshing. You can hear it come swooshing in over the waves.\n@c0@"
  es: "@a%0%a001250@bAquí la brisa es muy fresca. Se oye cómo viene sobre el rumor de las olas.\n@c0@"
  fr: "@a%0%a001250@bLa brise est tellement rafraîchissante, ici.\nOn l'entend souffler par-dessus les vagues.\n@c0@"
  it: "@a%0%a001250@bIl vento porta il profumo del mare...\nChe bell'atmosfera che c'è qui...!\n@c0@"
  ja: "@a@b%a001250「風が気持ちいいの。\n\tザブーンって　波にのって\n\t風が来るの……。\n@c0@"
9:
  de: "@a%0%a001250@bHeute ist wieder so ein schöner Tag. Ich finde es toll, wenn die Sonne scheint!!\n@c0@"
  en: "@a%0%a001250@bIt's such a nice day again today. I love sunshine.\n@c0@"
  es: "@a%0%a001250@bHoy volvemos a tener un día precioso. Me encanta el sol.\n@c0@"
  fr: "@a%0%a001250@bC'est encore une si belle journée, aujourd'hui.\nJ'adore le soleil.\n@c0@"
  it: "@a%0%a001250@bOggi è una bellissima giornata, papà.\nChe bel sole che c'è!\n@c0@"
  ja: "@a@b%a001250「今日も　いい　お天気ね。\n\tわたし　お日さま　好きです……。\n@c0@"
10:
  de: "@aSancho@bEh! Hier bin iss schon sehr lange nisst gewesen.\n@c0@"
  en: "@aSancho@bEh! Ees a long time esince I am een thees town.\n@c0@"
  es: "@aSancho@b¡Híjole! Hace mucho tiempo que no venía a esta ciudad.\n@c0@"
  fr: "@aSancho@bAndaⓠ Ça faisait longtemps que je n'étais p-pas venu dans cette v-ville.\n@c0@"
  it: "@aSancho@bChico, era mucho tiempo que no venivo en esto luego...\n@c0@"
  ja: "@a@bサンチョ「おお　この町に来るのは\n\tひさしぶりですな。\n@c0@"
11:
  de: "@aSancho@bWir waren hier, als wir diss gesucht haben, Meine Majestät. Aber wir mussten mit leeren Händen wieder abreisen. Das war so traurig damals!\n@c0@"
  en: "@aSancho@bWe came here when we were travelling to find you, My Majesty. But we left empty-handed. Eet was eso esad a time.\n@c0@"
  es: "@aSancho@bVinimos aquí cuando viajábamos en su búsqueda, Majestad. Pero salimos de acá con las manos vacías. Fue un momento bien triste.\n@c0@"
  fr: "@aSancho@bNous sommes v-venus ici lorsque nous étions à\r\nta r-recherche, Ma Majesté. Mais on est repartis\r\nb-bredouilles. C'était oune époque très triste.\n@c0@"
  it: "@aSancho@bMe recuerdo que venimmo aquí por cercarte, ma no fummo fortunatos y ce ne andammo vias a manos vuotas. ¡Ay, que tristezzas!\n@c0@"
  ja: "@a@bサンチョ「%a000090王をさがす旅の途中\n\t二度ほど　この町に来ましたね。\n\t得られるものは　なかったですが……。\n@c0@"
12:
  de: "@aOtto@bOh! Dann wart Ihr hier also auf Eurer Hochzeitsreise, %a000090?\n@c0@"
  en: "@aTuppence@bOoh! So you came here on your honeymoon,\ndid you, %a000090?\n@c0@"
  es: "@aAlazar@b¡Oooh! ¿Así que vinisteis aquí en vuestra luna de miel, %a000090?\n@c0@"
  fr: "@aInnocent@bOohⓠ Alors vous êtes venu ici en lune de miel,\nc'est bien ça, %a000090ⓡ\n@c0@"
  it: "@aSimon@bMaestà, se non sbaglio lei e la sua consorte trascorreste qui la luna di miele...\n@c0@"
  ja: "@a@bピピン「なんと　%a000090さまは\n\t新婚旅行で　この町を\n\t通られたのですか！\n@c0@"
13:
  de: "@aOtto@bWie herrlich! Etwas Schöneres als Flitterwochen am Meer kann's doch gar net geben. Vielleicht begegne ich hier der Richtigen!\n@c0@"
  en: "@aTuppence@bHow lovely! You can't beat a honeymoon by the sea. Maybe I'll meet my special someone here!\n@c0@"
  es: "@aAlazar@b¡Qué romántico! ¡No hay nada como una luna de miel junto al mar! ¡Tal vez encuentre aquí a alguien especial!\n@c0@"
  fr: "@aInnocent@bComme c'est romantiqueⓠ Rien ne vaut une lune de miel au bord de la mer. Peut-être que je renconterai l'âme sœur ici, moi aussiⓠ\n@c0@"
  it: "@aSimon@bAh, che cosa romantica...!\nIl sole, il mare, la brezza, la frittura di pesce...!\nBuona la frittura di pesce, eh?\n@c0@"
  ja: "@a@bピピン「い…いいなあ～。\n\tやはり新婚といえば　港ですよ！\n\tボクも　出会いの予感がします！\n@c0@"
14:
  de: "@aBianca@bHier kommt es einem wirklich so vor, als wäre man mitten auf dem Meer.\n@c0@"
  en: "@aBianca@bThis place really feels like it's part of the ocean.\n@c0@"
  es: "@aBianca@bEste lugar parece formar parte del océano, ¿sabes?\n@c0@"
  fr: "@aBianca@bOn a vraiment l'impression que cet endroit\r\nfait partie de l'océan.\n@c0@"
  it: "@aBianca@bMi piacerebbe vivere in un villaggio di mare...\n@c0@"
  ja: "@a@bビアンカ「ここって　町と海が\n\t一体化してるわよね。\n@c0@"
15:
  de: "@aBianca@bDenk dir nur ⓚⓛ angeln zu können, mitten in der Stadt!\n@c0@"
  en: "@aBianca@bFancy bein' able to fish when you're in town!\n@c0@"
  es: "@aBianca@bFigúrate, ¡puedes pescar sin salir de la ciudad!\n@c0@"
  fr: "@aBianca@bTu imagines un peuⓢ pouvoir pêcher en pleine villeⓠ\n@c0@"
  it: "@aBianca@bDev'essere bello svegliarsi ogni mattina destati dal placido frangersi delle onde sulla riva...\n@c0@"
  ja: "@a@bビアンカ「町の中で\n\t魚が釣れるっていうのは\n\tちょっと　いいかも！\n@c0@"
16:
  de: "@aNera@bDer Geruch des Meeres ist wirklich stark. Genau wie früher.\n@c0@"
  en: "@aNera@bThe smell of the sea water is really strong.\r\nJust like before.\n@c0@"
  es: "@aNera@bEl aroma del mar es molto potente.\nIgual que antes.\n@c0@"
  fr: "@aNera@bL'odeur de la mer est vraiment très forte.\r\nComme autrefois.\n@c0@"
  it: "@aNera@bAdoro il vento che spira dal mare.\nSembra che porti con sé il profumo di terre lontane...\n@c0@"
  ja: "@a@bフローラ「潮のかおりが　強いですわ。\n\tあのときと　同じですわね。\n@c0@"
17:
  de: "@aOtto@bEine Hafenstadt... Hier gibt's bestimmt jede Menge nette junge Maderl.\n@c0@"
  en: "@aTuppence@bA port town... I imagine there are lots of pretty young fillies here!\n@c0@"
  es: "@aAlazar@bUna ciudad portuaria... ¡Me imagino que habrá cantidad de bonitas potrillas!\n@c0@"
  fr: "@aInnocent@bUne ville portuaire... J'imagine qu'il y a plein de jeunes et jolies filles, iciⓠ\n@c0@"
  it: "@aSimon@bMaestà, se è vero che i marinai hanno una donna in ogni porto, chiedo ufficialmente di essere trasferito alla Regia Marina di Denim!\n@c0@"
  ja: "@a@bピピン「港町かあ…\n\t美人が　多そうですよね。\n@c0@"
18:
  de: "@aBianca@bHmm... Ein Monster, groß wie ein Berg? Das ist doch bestimmt eine Übertreibung!\n@c0@"
  en: "@aBianca@bHmm... A monster the size of a mountain?\r\nSounds like a bit of a tall tale to me.\n@c0@"
  es: "@aBianca@bMmm... ¿Un monstruo del tamaño de una montaña?\nEso me suena un poco a cuento, ¿sabes?\n@c0@"
  fr: "@aBianca@bMmm... Un monstre gros comme un montagneⓡ\nÇa me semble un peu tiré par les cheveux, cette histoire.\n@c0@"
  it: "@aBianca@bUn mostro grande come una montagna?!\nAh, che sciocchezza! È senz'altro una bugia...\ngrossa come una montagna! Ah ah ah!\n@c0@"
  ja: "@a@bビアンカ「ふ～ん…\n\t山ほどもある　怪物ねえ……。\n\tうたがわしい話だわ。\n@c0@"
19:
  de: "@aNera@bEin Monster, so groß wie ein Berg... Wo habe ich das nur schon mal gehört?\n@c0@"
  en: "@aNera@bA monster the size of a mountain... Where have I heard something like that before?\n@c0@"
  es: "@aNera@bUn monstruo del tamaño de una montaña... Ma, ¿dónde he oído eso antes?\n@c0@"
  fr: "@aNera@bUn monstre gros comme une montagne...\nOù est-ce que j'ai déjà entendu çaⓡ\n@c0@"
  it: "@aNera@bUn mostro alto come una montagna...\nUhm...\nDov'è che ho già sentito questa storia...?\n@c0@"
  ja: "@a@bフローラ「山ほどもある怪物…\n\tどこかで　聞いたような\n\t聞かないような……。\n@c0@"
20:
  de: "@a%0%a001250@bWenn wir so einen Schlüssel hätten, könnten wir bestimmt fast überallhin reisen, wohin wir wollen!\n@c0@"
  en: "@a%0%a001250@bIf we had a key like that, we could probably travel almost anywhere we wanted!\n@c0@"
  es: "@a%0%a001250@b¡Si tuviéramos una llave así, seguro que podríamos viajar donde quisiéramos!\n@c0@"
  fr: "@a%0%a001250@bSi on avait une clef comme ça, on pourrait voyager presque partout où on veutⓠ\n@c0@"
  it: "@a%0%a001250@bLa chiave del potere?\nSembra un oggetto interessante... Scommetto che, se lo avessimo, potremmo andare ovunque!\n@c0@"
  ja: "@a@b%a001250「そんなカギがあったら\n\t行けるとこ　ふえるかも知れないね。\n@c0@"
21:
  de: "@a%0%a001250@bOb er wohl immer noch im Bauch des Monsters ist?\n@c0@"
  en: "@a%0%a001250@bI wonder if it's still inside that monster's belly.\n@c0@"
  es: "@a%0%a001250@bMe pregunto si seguirá en la panza de ese monstruo.\n@c0@"
  fr: "@a%0%a001250@bJe me demande si elle est toujours dans le ventre\nde ce monstre.\n@c0@"
  it: "@a%0%a001250@bPerò chissà che fine avrà fatto... Uhm, se Arsenio Rubìo è stato divorato da un mostro, la chiave potrebbe essere ancora nella pancia della belva...\n@c0@"
  ja: "@a@b%a001250「そのカギって　まだ\n\t怪物さんの　おなかの中なのかな？\n@c0@"
22:
  de: "@aSancho@bIss mösste ja mal wissen, was passiert, wenn so ein Schlüssel in die falschen Hände fiele? Das ist ein ziemliss großes Problem, findest du nisst?\n@c0@"
  en: "@aSancho@bFor me, I worry about what would happen eef esuch a key would fall eento the wrong hands. Ees gonna be a beeg problem, eh?\n@c0@"
  es: "@aSancho@bA mí nomás me preocupa lo que sucedería si esa llave cayera en malas manos. Eso sería un feo problema, ¿verdad?\n@c0@"
  fr: "@aSancho@bMoi, je me d-demande ce qui se passerait si oune telle clef tombait enter de m-mauvaises mains. Ça serait oun sérieux problème, noⓡ\n@c0@"
  it: "@aSancho@bChico, piensa quantos dannos potrebbe crear un malintenzionatos si entrasse en possesso de quella chiave...\n@c0@"
  ja: "@a@bサンチョ「そんなカギを\n\t悪いヤツに持たせては　大変ですよ。\n\tねえ　坊っちゃん？\n@c0@"
23:
  de: "@aOtto@bMit so einem Schlüssel könnt' ich vielleicht die Herzen aller Frauen auf der ganzen Welt öffnen!\n@c0@"
  en: "@aTuppence@bWith a key like that, maybe I could unlock the hearts of women the world over!\n@c0@"
  es: "@aAlazar@b¡Con una llave así tal vez podría abrir el corazón de todas las mujeres del mundo!\n@c0@"
  fr: "@aInnocent@bAvec une clef pareille, je pourrais peut-être ouvrir le cœur des femmes partout dans le mondeⓠ\n@c0@"
  it: "@aSimon@bSe avessi quella chiave, aprirei i cuori di tutte le ragazze del mondo, Maestà!\n@c0@"
  ja: "@a@bピピン「そんなカギがあったら\n\t世界中の女の子の\n\t心のカギを　あけたいです！\n@c0@"
24:
  de: "@aOtto@b... Äh, so war das net gemeint. Das wär dann doch ein wenig zu gierig.\n@c0@"
  en: "@aTuppence@b...Er, maybe that was rather crude of me. It doesn't do to be greedy, after all.\n@c0@"
  es: "@aAlazar@bEh... Puede que haya sido un poco bruto. Al fin y al cabo, la avaricia rompe el saco.\n@c0@"
  fr: "@aInnocent@b... Euh, c'était peut-être un peu grossier de ma part. Ça ne sert à rien d'être trop gourmand, au fond.\n@c0@"
  it: "@aSimon@bMa no, scherzo!\nAprirei solo quelli delle belle fanciulle!\nQuelle meno avvenenti le lascio volentieri agli altri...\n@c0@"
  ja: "@a@bピピン「……なんて　今のは\n\tちょっと　よくばりでしたね。\n\t反省……。\n@c0@"
25:
  de: "@aBianca@bDer arme alte Mann. Ich hoffe, das heißt nicht, dass er jetzt ganz allein dasteht.\n@c0@"
  en: "@aBianca@bThat poor old man. I hope that dun't mean he's all on his own now.\n@c0@"
  es: "@aBianca@bPobre viejo. Espero que ahora no se haya quedado solo en el mundo, ¿sabes?\n@c0@"
  fr: "@aBianca@bPauvre homme. J'espère que ça ne veut pas dire qu'il est seul, maintenant.\n@c0@"
  it: "@aBianca@bPovero vecchio... Spero che non resti da solo con il suo dolore. Mi piacerebbe poter fare qualcosa per lui, ma non so proprio come aiutarlo...\n@c0@"
  ja: "@a@bビアンカ「おじいさん　かわいそうね。\n\tもしかして　ひとりぼっちに\n\tなっちゃったのかしら……。\n@c0@"
26:
  de: "@aNera@bMan sagt ja, für Eltern gebe es nichts Schlimmeres, als ein Kind zu verlieren.\n@c0@"
  en: "@aNera@bPeople say there's nothing worse for a parent than outliving a child.\n@c0@"
  es: "@aNera@bDicen que lo peor que le puede pasar a un padre es sobrevivir a uno de sus bambini.\n@c0@"
  fr: "@aNera@bLes gens disent qu'il n'y a rien de pire quand on est parent que de survivre à son enfant.\n@c0@"
  it: "@aNera@bPer un genitore, non esiste dolore più grande che perdere un figlio...\n@c0@"
  ja: "@a@bフローラ「親として　子供に\n\t先立たれることほど\n\tつらいことはないと　聞きます。\n@c0@"
27:
  de: "@aNera@bEs ist schwer, die richtigen Worte zu finden, um diesen armen alten Mann zu trösten.\n@c0@"
  en: "@aNera@bIt's hard to find the right words to console\r\nthat poor old man.\n@c0@"
  es: "@aNera@bNo es fácil hallar las parole adecuadas para consolar a ese pobre anciano.\n@c0@"
  fr: "@aNera@bDifficile de trouver les mots pour consoler ce pauvre vieil homme.\n@c0@"
  it: "@aNera@bNon trovo nemmeno le parole adatte per consolare quell'uomo...\n@c0@"
  ja: "@a@bフローラ「あの　おじいさまには\n\tかけてさしあげる言葉も\n\tみつかりませんわ……。\n@c0@"
28:
  de: "@a%0%a001240@bDer alte Mann tut mir leid!\n@c0@"
  en: "@a%0%a001240@bWhat a shame for the old man!\n@c0@"
  es: "@a%0%a001240@b¡Lo siento por el pobre abuelete!\n@c0@"
  fr: "@a%0%a001240@bQue c'est triste pour ce vieil hommeⓠ\n@c0@"
  it: "@a%0%a001240@bQuel signore sta soffrendo tantissimo...\n@c0@"
  ja: "@a@b%a001240「なんて　さみしいこと言う\n\tおじいさんなんだろう……。\n@c0@"
29:
  de: "@a%0%a001250@bDer arme alte Mann!\n@c0@"
  en: "@a%0%a001250@bThat poor old man!\n@c0@"
  es: "@a%0%a001250@b¡Pobre vejete!\n@c0@"
  fr: "@a%0%a001250@bPauvre vieil hommeⓠ\n@c0@"
  it: "@a%0%a001250@bChe tragedia...\nNon so che darei per poter aiutare quell'uomo...\n@c0@"
  ja: "@a@b%a001250「おじいさん……。\n@c0@"
30:
  de: "@aSancho@bIss hoffe, er fasst bald wieder neuen Lebensmut. Das ist wirkliss eine traurige Sache.\n@c0@"
  en: "@aSancho@bI hope thees old man, he gonna find een esometheeng another reason to leeve. Ees eso esad for heem.\n@c0@"
  es: "@aSancho@bEspero que ese viejito encuentre otra razón para vivir. Qué triste para él.\n@c0@"
  fr: "@aSancho@bJ'espère que ce vieil homme, il t-trouvera oune nouvelle raison de vivre dans autre chose.\r\nC'est si t-triste pour lui.\n@c0@"
  it: "@aSancho@bEspero que quell'hombre trovi prestos un'altra ragione por vivere...\n@c0@"
  ja: "@a@bサンチョ「あのご老人にも\n\tなにか　別の生きがいが\n\t見つかれば　いいのですが……。\n@c0@"
31:
  de: "@aSancho@bMir hat es neuen Lebensmut gebracht, dass iss miss um %a001240 und %a001250 kümmern musste.\n@c0@"
  en: "@aSancho@bFor me, my esoul was esaved because I can raise %a001240 and %a001250.\n@c0@"
  es: "@aSancho@bPara mí, criar a %a001240 y %a001250 fue la salvación.\n@c0@"
  fr: "@aSancho@bMoi, c'est d'avoir p-pu élever %a001240 et %a001250 qui a s-sauvé mon âme.\n@c0@"
  it: "@aSancho@bMe recuerdo que, después la muerte del señor Russel, estavo malissimo. Fu solo gracias a %a001240 y a %a001250 que riuscii a reprenderme...\n@c0@"
  ja: "@a@bサンチョ「私も　%a001240さまと\n\t%a001250さまを　育てさせていただき\n\tずいぶん　救われましたよ。\n@c0@"
32:
  de: "@aOtto@bFür den alten Mann scheint die Zeit stillzustehen, seit er seinen Sohn verloren hat.\n@c0@"
  en: "@aTuppence@bIt's like time has stood still for that old man ever since his son died.\n@c0@"
  es: "@aAlazar@bEs como si el tiempo se hubiera parado para ese anciano desde que murió su hijo.\n@c0@"
  fr: "@aInnocent@bC'est comme si le temps s'était arrêté pour lui depuis la mort de son fils.\n@c0@"
  it: "@aSimon@bNo, Maestà.\nQuesta volta non la diletterò con i miei soliti discorsi sulle belle fanciulle...\n@c0@"
  ja: "@a@bピピン「息子さんが　死んだときから\n\tあのおじいさんの　時は\n\t止まっちゃったんでしょうね。\n@c0@"
33:
  de: "@aOtto@bEr bläst nur noch Trübsal. Sein Sohn wär bestimmt todunglücklich, wenn er ihn so sehen würd'.\n@c0@"
  en: "@aTuppence@bEvery day he's just there moping around and\r\ndoing nothing. His son would be really upset\r\nif he could see him now.\n@c0@"
  es: "@aAlazar@bSe pasa los días ahí sin hacer nada, como un alma en pena. Su hijo se entristecería mucho si lo viera ahora.\n@c0@"
  fr: "@aInnocent@bChaque jour, il reste là, abattu, à ne rien faire.\r\nSon fils serait sans doute fâché de le voir dans\r\ncet état.\n@c0@"
  it: "@aSimon@bIl dolore di quell'uomo merita tutto il nostro rispetto.\n@c0@"
  ja: "@a@bピピン「毎日　何をするでもなく\n\tああしているだけ……。\n\tあれじゃあ　息子さんも泣いてますよ。\n@c0@"
34:
  de: "@aBianca@bHast du eine Ahnung, was der wollte? Ich hab nämlich keinen blassen Schimmer!\n@c0@"
  en: "@aBianca@bAny idea what that bloke was on about?\r\nIt all went right over my head!\n@c0@"
  es: "@aBianca@b¿Tienes idea de qué estaba hablando ese tipo?\n¡Yo no me he enterado de nada!\n@c0@"
  fr: "@aBianca@bTu as compris de quoi parlait ce typeⓡ\nÇa m'est passé totalement au-dessus la têteⓠ\n@c0@"
  it: "@aBianca@bScusa, di che parlava quel tizio...?\nEro soprappensiero, e non ho sentito cosa ha detto...\n@c0@"
  ja: "@a@bビアンカ「いまの会話じゃ　ぜんぜん\n\tなんの話か　わからないわね。\n@c0@"
35:
  de: "@aNera@bWeißt du, worum es da ging? Ich habe leider gar nichts verstanden!\n@c0@"
  en: "@aNera@bDid you understand what that man was talking about? I'm afraid I had no idea!\n@c0@"
  es: "@aNera@bNon capisco de qué habla ese hombre. ¿E tú?\n@c0@"
  fr: "@aNera@bTu as compris de quoi parlait cet hommeⓡ\nMoi, je n'en ai pas la moindre idéeⓠ\n@c0@"
  it: "@aNera@bScusami, cos'ha detto quel tipo?\nStavo pensando a cosa preparare per cena domani e non ho prestato ascolto alle sue parole...\n\n@c0@"
  ja: "@a@bフローラ「あなたったら　あの会話で\n\tわかりますの？？\n\t私には　さっぱりでしたわ。\n@c0@"
36:
  de: "@a%0%a001250@bEr hat ja nicht mal gesagt, was er eigentlich meinte, und nun bildet er sich ein, es sei wahr ⓚⓛ was immer es auch sein mag.\n@c0@"
  en: "@a%0%a001250@bHe didn't even tell us what he was on about,\nand now he thinks whatever it is is true! \n@c0@"
  es: "@a%0%a001250@b¡Ni siquiera nos dijo sobre qué hablaba, y ahora piensa que lo que sea es verdad!\n@c0@"
  fr: "@a%0%a001250@bIl ne nous a même pas dit de quoi il voulait parler\net maintenant, peu importe de quoi il s'agit, il est convaincu que c'est vraiⓠ\n@c0@"
  it: "@a%0%a001250@bPapà, ha ragione!\nPotevi almeno sentire cosa aveva da dirti.\n@c0@"
  ja: "@a@b%a001250「まだ　なんにも\n\t言ってないのに……。\n\tかんたんに　信じちゃいけないのよ。\n@c0@"
37:
  de: "@aSancho@bMan muss auf das hören, was die Leute sagen, mein Freund. Das ist sehr wisstig.\n@c0@"
  en: "@aSancho@bYou must listen to what people esay, my friend.\r\nEes very important.\n@c0@"
  es: "@aSancho@bDebes escuchar lo que dice la gente, mi cuate.\nEs reteimportante.\n@c0@"
  fr: "@aSancho@bTu d-dois écouter ce que d-disent les gens, chico. C'est muy important.\n@c0@"
  it: "@aSancho@bChico, devi siempre ascoltare quello que te dicono las personas que encontri. Potresti ottenere qualche información interessantes...\n@c0@"
  ja: "@a@bサンチョ「坊っちゃん\n\t人の話は　ちゃんと聞かないと\n\tダメですよ。\n@c0@"
38:
  de: "@aOtto@bHabt Ihr verstanden, wovon er da gefaselt hat, %a000090? Meine Güte! Dann seid Ihr wirklich viel schlauer als ich.\n@c0@"
  en: "@aTuppence@bDid you understand what that was all about, %a000090? Goodness! You're much brighter than I am, then.\n@c0@"
  es: "@aAlazar@b¿Habéis entendido de qué iba todo eso, %a000090? ¡Por la Diosa! Entonces sois mucho más brillante que yo.\n@c0@"
  fr: "@aInnocent@bVous avez compris de quoi il parlait, %a000090ⓡ Par la Déesseⓠ Vous êtes bien plus intelligent que moi, alors.\n@c0@"
  it: "@aSimon@bMaestà, quel tipo l'ha importunata?\nVuole che gli dia una botta in testa?\nChieda pure, non faccia complimenti!\n@c0@"
  ja: "@a@bピピン「わかったんですか\n\t%a000090王　今ので！？\n\t……さすがです。\n@c0@"
39:
  de: "@a%0%a001240@bDer Azimuthberg ist der höchste Berg der Welt! Hast du das gewusst, Papa?\n@c0@"
  en: "@a%0%a001240@bMt Azimuth is the highest mountain in the world.\nDid you know that, Dad?\n@c0@"
  es: "@a%0%a001240@bEl monte Acimut es la montaña más alta del mundo.\n¿Lo sabías, papá?\n@c0@"
  fr: "@a%0%a001240@bLe mont Azimut est la montagne la plus haute du monde. Tu savais ça, papaⓡ\n@c0@"
  it: "@a%0%a001240@bIl Monte Azimuth è la vetta più alta del mondo.\nMe l'ha detto %a001250. Lei sa tante cose perché legge un mucchio di libri...\n@c0@"
  ja: "@a@b%a001240「セントベレス山はね\n\t世界で　いちばん高い山なんだよ。\n\tお父さん　知ってた？\n@c0@"
40:
  de: "@aSancho@bDer Azimuthberg, er ist ein sehr hoher Berg, no? Wie können sie darauf dann einen solssen Tempel bauen?\n@c0@"
  en: "@aSancho@bThees Mt Azimuth, ees a very high mountain.\r\nHow ees possible they are building there esuch\r\na temple?\n@c0@"
  es: "@aSancho@bEse Monte Acimut es una montaña bien alta.\n¿Cómo es posible que estén construyendo semejante templo allá?\n@c0@"
  fr: "@aSancho@bCe mont Azimut est oune montagne très haute. Comment c'est p-possible de construire oun\ntemple p-pareil tout là-hautⓡ\n@c0@"
  it: "@aSancho@bEl Monte Azimuth es muy altos.\n¿A chi sarà venuto en mente de costruire un tempio lassù?\n㈡\n¡Seguramentes a qualcunos que no soffre de vertigines!\n@c0@"
  ja: "@a@bサンチョ「セントベレスといえば\n\tけわしく　高い山ですが……\n\tそんなところに　どうやって　神殿を？\n@c0@"
41:
  de: "@aBianca@bRecht so! Mit einem so zupackenden Menschen zu reden muntert einen doch gleich auf!\n@c0@"
  en: "@aBianca@bHe's a brave one! Talkin' to people like that really gets you all buoyed up!\n@c0@"
  es: "@aBianca@b¡Es un valiente! ¡Hablar con gente así te sube el ánimo!\n@c0@"
  fr: "@aBianca@bVoilà quelqu'un de courageuxⓠ Ce genre de discours est vraiment motivantⓠ\n@c0@"
  it: "@aBianca@bQuello sì che è un uomo coraggioso!\nFa piacere vedere che al mondo ci sono ancora persone che si preoccupano per le sorti dell'umanità.\n@c0@"
  ja: "@a@bビアンカ「勇ましいわね。\n\tああいう人と話すと　こっちまで\n\t元気が　わいてくるわ。\n@c0@"
42:
  de: "@aNera@bVielleicht sollten wir uns mit ihm zusammentun und mit ihm an unserer Seite kämpfen. Aber es ist nicht ganz leicht zu erklären, was wir vorhaben.\n@c0@"
  en: "@aNera@bMaybe we should join forces with him and fight together. It's a bit tricky trying to explain what we're up to, though.\n@c0@"
  es: "@aNera@bDeberíamos unir nuestras fuerzas y luchar juntos. Ma es complicado explicar lo que estamos haciendo.\n@c0@"
  fr: "@aNera@bPeut-être que nous devrions unir nos forces et nous battre ensemble. Mais il serait un peu compliqué de\r\nlui expliquer ce que nous avons l'intention de faire.\n@c0@"
  it: "@aNera@bChe tipo risoluto!\nBravo!\nIl mondo ha bisogno di gente come lui!\n@c0@"
  ja: "@a@bフローラ「方法がわかったら\n\tあの方　手伝ってくださるのかしら？\n\t……むずかしいところですわね。\n@c0@"
43:
  de: "@a%0%a001240@bWir sollten uns besser beeilen, Papa! Sonst trifft er noch vor uns auf Großmeister Nimzo und besiegt ihn, bevor wir die Gelegenheit dazu bekommen!\n@c0@"
  en: "@a%0%a001240@bWe'd better hurry, Dad! Otherwise he'll get to Grandmaster Nimzo first and defeat him before\nwe have the chance!\n@c0@"
  es: "@a%0%a001240@b¡Será mejor que nos demos prisa, papá! ¡Si no, él alcanzará primero al Gran Maestro Nimzo y lo derrotará antes de que podamos hacer nada!\n@c0@"
  fr: "@a%0%a001240@bOn ferait bien de se dépêcher, papaⓠ Sinon il va retrouver le Grand Maître Nimzo avant nous et le battre avant qu'on en ait eu l'occasionⓠ\n@c0@"
  it: "@a%0%a001240@bPapà, dobbiamo sbrigarci!\nSe non facciamo presto, quel tipo troverà Nimzo e lo farà fuori prima di noi!\n@c0@"
  ja: "@a@b%a001240「お父さん！　急がなきゃ！\n\t早くしないと　あの人が\n\t闇の大魔王を　たおしちゃうかも！？\n@c0@"
44:
  de: "@a%0%a001250@bWas wäre, wenn es ihm tatsächlich gelänge, die Welt zu zerstören? Bei der Vorstellung läuft's mir kalt den Rücken runter!\n@c0@"
  en: "@a%0%a001250@bWhat would happen if he succeeded and really did destroy the world? How scary!\n@c0@"
  es: "@a%0%a001250@b¿Qué ocurriría si triunfara y dominara el mundo? ¡Qué miedo!\n@c0@"
  fr: "@a%0%a001250@bQu'est-ce qui arriverait s'il réussissait vraiment\nà détruire le mondeⓡ C'est terrifiantⓠ\n@c0@"
  it: "@a%0%a001250@bPapà, credi davvero che il Gran Maestro di Nadiria possa distruggere il mondo?\nPerché vuole fare una cosa del genere?!\n@c0@"
  ja: "@a@b%a001250「この世界が　ほろびたら\n\tどうなっちゃうの？　ふえ～ん……。\n@c0@"
45:
  de: "@aOtto@bSo was kann jeder sagen!\n@c0@"
  en: "@aTuppence@bAnyone can say things like that!\n@c0@"
  es: "@aAlazar@b¡Es fácil hablar así!\n@c0@"
  fr: "@aInnocent@bN'importe qui peut dire ce genre de chosesⓠ\n@c0@"
  it: "@aSimon@bAh, a parole sono tutti bravi!\n@c0@"
  ja: "@a@bピピン「言うだけなら\n\t誰にでも　できますって！\n@c0@"
46:
  de: "@aOtto@bAber worauf's ankommt, sind Leute, die auch handeln ⓚⓛ also die echten Helden! Solche wie ich!\n@c0@"
  en: "@aTuppence@bIt's the folk who actually put their money where their mouth is and act on it who are the real heroes. Like me, for instance!\n@c0@"
  es: "@aAlazar@bPero los verdaderos héroes son los que pasan del dicho al hecho. ¡Como yo, por ejemplo!\n@c0@"
  fr: "@aInnocent@bLes vrais héros, ce sont ceux qui accordent leurs actes à leurs paroles. Comme moi, par exempleⓠ\n@c0@"
  it: "@aSimon@bVorrei proprio vederlo all'opera, quel bel tipo!\nSecondo me non sa nemmeno come si tiene in mano una spada...\n@c0@"
  ja: "@a@bピピン「じっさいに　やる者が\n\tすごいんですよ。\n\tこの　ボクのように！\n@c0@"
47:
  de: "@aBianca@bWenn ich mir die Ungeheuer ansehe, mit denen du dich angefreundet hast, %a000090, dann kann ich mir nur schwer vorstellen, dass sie alle böse sein sollen.\n@c0@"
  en: "@aBianca@bWhen I look at the monsters you've managed to befriend, %a000090, I find it hard to believe that all of them can be bad.\n@c0@"
  es: "@aBianca@bCuando miro a los monstruos de los que te has hecho amigo, %a000090, me cuesta creer que todos ellos sean malos, ¿sabes?\n@c0@"
  fr: "@aBianca@bQuand je regarde les monstres que tu as réussi à apprivoiser, %a000090, j'ai du mal à croire que tous puissent être méchants.\n@c0@"
  it: "@aBianca@bQuando guardo le creature con cui hai fatto amicizia, mi rendo conto che non tutti i mostri sono cattivi.\n@c0@"
  ja: "@a@bビアンカ「私　%a000090に　なつく\n\t魔物を見ていると　どうしても\n\t魔物全部が悪いとは　思えないな。\n@c0@"
48:
  de: "@aNera@bDa kann man wohl nichts machen. Der Drachengott braucht wahrscheinlich genauso wie wir mal eine Pause.\n@c0@"
  en: "@aNera@bI suppose it can't be helped. The Dragon God probably needs his rest just like we do.\n@c0@"
  es: "@aNera@bSupongo que no hay más remedio. El Dios Dragón también necesitará descansar como tutti quanti.\n@c0@"
  fr: "@aNera@bOn n'y peut pas grand-chose, j'imagine.\r\nLe dieu dragon a sans doute besoin de repos,\r\nde temps en temps, tout comme nous.\n@c0@"
  it: "@aNera@bNo, quell'uomo non ha capito niente.\nIl Drago Divino non ha dato ai mostri il permesso di attaccare gli uomini...\n@c0@"
  ja: "@a@bフローラ「しかたないですわよね。\n\t神さま　お休み中だったんですもの。\n@c0@"
49:
  de: "@aSancho@bDas ist risstig. Wir haben alle Hände voll zu tun, um die Welt zu beschützen. Der Drachengott, er sollte uns helfen.\n@c0@"
  en: "@aSancho@bEes true. We all estruggling here to protect the world. Thees Dragon God, he eshould be helping us.\n@c0@"
  es: "@aSancho@bEs la mera verdad. Todos nos estamos esforzando por proteger el mundo. Ese Dios Dragón debería estar ayudándonos.\n@c0@"
  fr: "@aSancho@bC'est v-vrai. Nous sommes t-tous en train de lutter pour p-protéger le monde. Le dieu dragon devrait nous aider, noⓡ\n@c0@"
  it: "@aSancho@b¿El Drago Divino avrebbe dato a los mostros el permesso de attaccare los humanos?\n¡Ay, quell'hombre no ha capito nada de nada!\n@c0@"
  ja: "@a@bサンチョ「そうですねえ。　私たちも\n\tがんばりますが　神さまにも　ぜひ\n\tがんばってもらいたいものです。\n@c0@"
50:
  de: "@aBianca@bHier ist der Klingelbeutel sicher immer gut gefüllt, was?\n@c0@"
  en: "@aBianca@bIt looks like they get their fair share of church donations here, eh?\n@c0@"
  es: "@aBianca@bParece que aquí no les va nada mal con las donaciones, ¿eh?\n@c0@"
  fr: "@aBianca@bOn dirait que les dons à l'église ne manquent pas ici, heinⓡ\n@c0@"
  it: "@aBianca@bUna banca sotto la chiesa?!\nQuesta proprio non me l'aspettavo!\n@c0@"
  ja: "@a@bビアンカ「ここって\n\t教会に寄付された　お金が\n\tいっぱい　預けてありそうね。\n@c0@"
51:
  de: "@aNera@bEs würde mich nicht wundern, wenn es vielen Leuten nicht einmal auffiele, dass es hier eine Bank gibt.\n@c0@"
  en: "@aNera@bI wouldn't be surprised if lots of people don't even realise there's a bank here.\n@c0@"
  es: "@aNera@bVeramente, no me extrañaría que muchas personas no se diesen siquiera cuenta de que aquí hay un banco.\n@c0@"
  fr: "@aNera@bÇa ne m'étonnerait pas que la plupart de gens ne réalisent même pas qu'il y a une banque, ici.\n@c0@"
  it: "@aNera@bSecondo me un mucchio di gente ignora l'esistenza di questa banca...\n@c0@"
  ja: "@a@bフローラ「こんなところに\n\t銀行があるなんて　気づかない方も\n\t多いんじゃないかしら。\n@c0@"
52:
  de: "@a%0%a001240@bUi! Toll, dass du selbst hier einen Bankautomaten auftreiben konntest!\n@c0@"
  en: "@a%0%a001240@bWow! It's amazing that you managed to find a bank in a place like this!\n@c0@"
  es: "@a%0%a001240@b¡Vaya! ¡Es sorprendente que consiguieras encontrar un banco en un sitio como este!\n@c0@"
  fr: "@a%0%a001240@bWaouhⓠ C'est incroyable d'avoir réussi à trouver une banque dans un endroit pareilⓠ\n@c0@"
  it: "@a%0%a001240@bPapà, ma come hai fatto a capire che qui c'era una banca?!\n@c0@"
  ja: "@a@b%a001240「すごいなあ　お父さん。\n\tここの銀行を　見つけるなんて！\n@c0@"
53:
  de: "@a%0%a001240@bSogar Sancho hatte keinen Schimmer, dass es hier einen gibt.\n@c0@"
  en: "@a%0%a001240@bSancho had no idea it was here, you know.\n@c0@"
  es: "@a%0%a001240@bSancho no tenía ni idea de que estuviera aquí.\n@c0@"
  fr: "@a%0%a001240@bTu sais, Sancho ignorait qu'elle se trouvait là.\n@c0@"
  it: "@a%0%a001240@bIo non ci sarei mai arrivato...\n@c0@"
  ja: "@a@b%a001240「サンチョは　ぜんぜん\n\t気づかなかったんだよ。\n@c0@"
54:
  de: "@aBianca@bDen kenne ich! Der hat bei dem Mann gelernt, der die Medizin für meinen Vater zubereitet hat, als ich noch klein war!\n@c0@"
  en: "@aBianca@bI know him! He used to study under the man who made us some medicine for my father back when I was little!\n@c0@"
  es: "@aBianca@b¡Lo conozco! ¡Estudiaba con ese hombre que preparó medicina para mi padre cuando yo era pequeña!\n@c0@"
  fr: "@aBianca@bJe le connais. Il étudiait auprès de l'homme qui\na un jour préparé un remède pour mon père,\nquand j'étais petiteⓠ\n@c0@"
  it: "@aBianca@bConosco quell'uomo!\nEra un allievo del farmacista che portò il medicinale a mio padre tanti anni fa!\n@c0@"
  ja: "@a@bビアンカ「あの人　おぼえてるわ。\n\t昔　父さんの薬を作ってくれた人の\n\tお弟子さんだったわよね！\n@c0@"
55:
  de: "@aNera@bStell dir vor, ein Mann, der mal Apotheker werden wollte, ist am Ende Seemann geworden! Man kann eben nie wissen, wo das Leben einen hintreibt.\n@c0@"
  en: "@aNera@bTo think that man once dreamt of being a pharmacist and yet he's ended up a sailor! You never can tell where life will take you.\n@c0@"
  es: "@aNera@b¡Y pensar que ese uomo soñaba con ser farmacéutico y ha acabado siendo marinero! La vita nos lleva a veces por senderos imprevisibili.\n@c0@"
  fr: "@aNera@bDire que cet homme rêvait autrefois d'être herboriste et qu'il a fini marinⓠ On ne sait\njamais où la vie peut nous mener.\n@c0@"
  it: "@aNera@bQuel tipo sognava di diventare farmacista e invece ha finito per fare il marinaio!\nLa vita riserva sempre tante sorprese...\n@c0@"
  ja: "@a@bフローラ「くすり師を　目指された方が\n\t今はこうして　船乗りなんて……\n\t人生って　分からないものですわね。\n@c0@"
56:
  de: "@aSancho@bMir ist, als würde iss diesen Señor von irgendwoher kennen... Wer ist das?\n@c0@"
