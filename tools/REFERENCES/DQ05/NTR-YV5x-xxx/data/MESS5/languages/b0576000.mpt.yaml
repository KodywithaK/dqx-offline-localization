  es: "@aSancho@bDespués de aquello, el viejito dice que el señor Teudis es el héroe legendario, ¿no? Así nomás es como él lo recuerda.\n@c0@"
  fr: "@aSancho@bAlors après ça, le v-vieux bonhomme, il a dit que\r\nle señor Petros, c'était le héros l-légendaire.\r\nC'est pour ça qu'il se r-r-rappelle de lui.\n@c0@"
