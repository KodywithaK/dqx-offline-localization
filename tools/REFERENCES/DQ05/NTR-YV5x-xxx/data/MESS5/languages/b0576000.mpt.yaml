85:
  de: "@aBianca@bVor zehn Jahren ⓚⓛ das war ungefähr zu der Zeit, als auch wir zum letzten Mal hier waren, was?\n@c0@"
  en: "@aBianca@bTen years ago would've bin around the time we were here together last, eh?\n@c0@"
