208:
  de: "@aSancho@bUf! Dieser alte Mann, seine Erinnerung ist ausgeleiert wie eine alte Unterhose. Aber iss weiß es noch, als wäre es gestern gewesen.\n@c0@"
  en: "@aSancho@bUf! Thees old man, hees memory ees mushy like the avocado. But me, I remember like eet was yesterday!\n@c0@"
  es: "@aSancho@b¡Ay, caramba! Ese viejito tiene la memoria hecha guacamole. ¡Pero yo lo recuerdo como si fuera ayer!\n@c0@"
  fr: "@aSancho@bPfffⓠ Ce vieux señor a la m-mémoire comme de\nla pourée d'avocat. Moi, je m'en s-s-souviens\ncomme si c'était hierⓠ\n@c0@"
  it: "@aSancho@b¡Ay, que mala memoria!\n¿Como ha potuto esto hombre dimenticarse el nome de tuo padre, eh?\n@c0@"
  ja: "@a@bサンチョ「今の老人は\n\tおぼえてないようですが\n\t私は　おぼえていますよ。\n@c0@"
209:
  de: "@aSancho@bSeñor Ludwig, er hat diesen alten Mann vor den Ungeheuern gerettet. Er war so tapfer und kühn!\n@c0@"
  en: "@aSancho@bSeñor Pankraz, he esaved thees old man from the monsters. He was eso brave and wonderful capitán!\n@c0@"
