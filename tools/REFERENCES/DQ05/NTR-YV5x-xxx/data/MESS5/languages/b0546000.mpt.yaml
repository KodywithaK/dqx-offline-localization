0:
  de: "@a%0%a001240@bIst es noch so, wie du es in Erinnerung hattest, oder hat sich viel verändert?\n@c0@"
  en: "@a%0%a001240@bSo is it different to the time you came before,\nor hasn't it changed much?\n@c0@"
  es: "@a%0%a001240@b¿Está distinto de la otra vez que viniste, o no ha cambiado demasiado?\n@c0@"
  fr: "@a%0%a001240@bC'est différent de quand tu étais venu autrefois ou c'est resté pareilⓡ\n@c0@"
  it: "@a%0%a001240@bTrovi che questo posto sia cambiato molto rispetto alla prima volta che lo visitasti?\n@c0@"
  ja: "@a@b%a001240「どう？\n\tお父さんが　昔　来たときと\n\t村の中　変わってる？　それとも同じ？\n@c0@"
1:
  de: "@a%0%a001240@bOh. Es gab also mehr Feen, ja? Ich frage mich, wo sie alle hin sind...\n@c0@"
  en: "@a%0%a001240@bOh. There used to be more faeries about?\nI wonder where they've all gone, then.\n@c0@"
  es: "@a%0%a001240@b¡Oh! ¿Dices que había más hadas?\n¿Dónde habrán ido?\n@c0@"
  fr: "@a%0%a001240@bAh ouiⓡ Il y avait plus de féesⓡ Je me demande où elles sont passées.\n@c0@"
  it: "@a%0%a001240@bCome dici? Prima c'erano molte più fate?\nE dove credi che siano adesso?\nForse sono andate in vacanza?\n@c0@"
  ja: "@a@b%a001240「えっ？　昔は　もっと\n\t妖精さんが　多かったの？\n\tみんな　どこに行ったのかな。\n@c0@"
2:
  de: "@a%0%a001240@bIrgendwie scheint es nur Mädchen-Feen zu geben. Ich komme mir vor wie ein Eindringling.\n@c0@"
  en: "@a%0%a001240@bThere only seem to be girl faeries.\nI feel like a bit of an intruder.\n@c0@"
  es: "@a%0%a001240@bParece que todas las hadas son chicas.\nMe siento un poco como un intruso.\n@c0@"
  fr: "@a%0%a001240@bApparemment, les fées sont toujours des filles.\nJ'ai un peu l'impression d'être un intrus.\n@c0@"
  it: "@a%0%a001240@bLe fate sono tutte donne.\nMi sento un pesce fuor d'acqua...\n@c0@"
  ja: "@a@b%a001240「妖精って\n\t女の子ばっかりなんだね。\n\tちょっと　いごこち悪いや。\n@c0@"
3:
  de: "@a%0%a001250@bDie Feen und Monster kommen hier gut miteinander aus. So sollte es überall sein...\n@c0@"
  en: "@a%0%a001250@bThe faeries and the monsters all get along fine together here. That's the way it should be.\n@c0@"
  es: "@a%0%a001250@bAquí, las hadas y los monstruos se llevan bien. Así es como debería ser siempre.\n@c0@"
  fr: "@a%0%a001250@bLes fées et les monstres s'entendent bien ici.\nÇa devrait être tout le temps comme ça.\n@c0@"
  it: "@a%0%a001250@bQui le fate e i mostri vanno d'accordo.\nPerché nel mondo degli uomini creature diverse non riescono a vivere in armonia?\n@c0@"
  ja: "@a@b%a001250「この村　魔物さんも\n\t妖精さんも　なかよしね。\n\tいいなあ……。\n@c0@"
4:
  de: "@a%0%a001250@bIst hier eigentlich immer Frühling? Ich glaube aber nicht, dass das der einzige Grund dafür ist, dass dieser Ort eine solche Wärme ausstrahlt...\n@c0@"
  en: "@a%0%a001250@bIs it always spring here? I'm sure that's not the\nonly reason for the place having such a warm\nfeel to it, though.\n@c0@"
  es: "@a%0%a001250@b¿Es que siempre es primavera aquí? Pero no debe de ser solo por eso que este sitio produce esa sensación de calidez.\n@c0@"
  fr: "@a%0%a001250@bC'est toujours le printemps iciⓡ En même temps,\nje suis sûre que ce n'est pas que pour ça que cet endroit est si agréable.\n@c0@"
  it: "@a%0%a001250@bL'aria è tiepida e l'atmosfera tranquilla e rilassata...\nSembra di vivere in un'eterna primavera!\n@c0@"
  ja: "@a@b%a001250「この村　ずっと　春なの？\n\tでも　ここが　あたたかいのは\n\tきっと　それだけじゃないよね。\n@c0@"
5:
  de: "@aSancho@bUff! Iss habe ja immer gewusst, dass unsere Mission anstrengend ist, aber iss hätte nisst gedacht, dass wir reisen müssen bis in die Reich der Feen!\n@c0@"
  en: "@aSancho@bUf! I always know thees quest of yours, eet ees hard, but I no theenk ees eso hard you must\r\ntravel to the Realm of the Faeries.\n@c0@"
  es: "@aSancho@b¡Ay, caramba! Pues yo creía que esta misión tuya era dura y difícil, pero venir al Reino de las Hadas ya no me parece tan duro.\n@c0@"
  fr: "@aSancho@bPfffⓠ J-Je sais bien que ta quête n'est pas f-facile, mais je ne p-pensais pas qu'il faudrait m-même aller dans le royaume des Fées.\n@c0@"
  it: "@aSancho@bEl nuestro viaggio es muy duro y difícil, ma esto Regno de las Fatas es un luego bueno.\n@c0@"
  ja: "@a@bサンチョ「いやはや　%a000090王の旅は\n\t大変だとは　思っていましたが　まさか\n\t妖精の村にまで　来ることになるとは。\n@c0@"
6:
  de: "@aSancho@bAber weißt du was? Es ist gar nisst schlecht hier, no, es ist eine wundervolle Ort.\n@c0@"
  en: "@aSancho@bBut you know, ees no eso bad here, eh?\nEes a very beautiful place.\n@c0@"
  es: "@aSancho@b¡No se está mal aquí, híjole!\n¡Es un sitio bien bello!\n@c0@"
  fr: "@aSancho@bM-Mais tu sais, c'est pas mal du tout ici, heinⓡ\nJe trouve que c'est oun endroit mucho joli.\n@c0@"
  it: "@aSancho@bChico, esto posto me gusta mucho.\nEs tranquillo, caldo. ¿Por qué no ce fermiamo aquí por un poco de tiempo?\n@c0@"
  ja: "@a@bサンチョ「それにしても　ここは\n\t絵に描いたように　きれいですね。\n\t絵本の中のようです。\n@c0@"
7:
  de: "@aBianca@bEs war tiefster Winter, als du als Junge hier warst, nicht wahr, %a000090? Das kann man sich heute kaum noch vorstellen...\n@c0@"
  en: "@aBianca@bIt was the depths of winter when you came here as a boy, eh, %a000090? It's hard to imagine it now.\n@c0@"
  es: "@aBianca@bCuando viniste aquí de niño era puro invierno, ¿verdad, %a000090? Es difícil de imaginar ahora.\n@c0@"
  fr: "@aBianca@bAlors comme ça, quand tu es venu la première fois, %a000090, le royaume était plongé dans un hiver éternelⓡ C'est difficile à imaginer.\n@c0@"
  it: "@aBianca@b%0%a000090, quando venisti qui da bambino il Regno delle Fate era ricoperto dai ghiacci, non è vero? A vederlo ora, è difficile crederlo!\n@c0@"
  ja: "@a@bビアンカ「%a000090が　小さい頃来たとき\n\tここは　寒い冬だったのよね。\n\t今の景色からは　想像つかないけど。\n@c0@"
8:
  de: "@aBianca@bDanke, dass du mich hierher gebracht hast. Das Reich der Feen wollte ich immer schon mal sehen.\n@c0@"
  en: "@aBianca@bThanks for bringin' me here.\r\nI always wanted to see the Realm of the Faeries.\n@c0@"
  es: "@aBianca@bGracias por traerme aquí.\nSiempre había querido conocer el Reino de las Hadas, ¿sabes?\n@c0@"
  fr: "@aBianca@bMerci de m'avoir emmenée ici. J'ai toujours voulu voir le royaume des Fées.\n@c0@"
  it: "@aBianca@bTi ringrazio di avermi portata qui.\nAvevo sempre sognato di visitare il Regno delle Fate...\n@c0@"
  ja: "@a@bビアンカ「つれてきてくれて　ありがとう。\n\t私　妖精の村　見てみたかったのよ。\n@c0@"
9:
  de: "@aNera@bDieser Ort sieht genauso aus wie auf dem Bild in dem Buch, das ich als Kind immer gelesen habe.\n@c0@"
  en: "@aNera@bThis place looks exactly like a picture I saw in a book once when I was a child.\n@c0@"
  es: "@aNera@bEste sitio es como un dibujo que vi una vez en un libro cuando era una bambina.\n@c0@"
  fr: "@aNera@bCet endroit ressemble exactement à l'illustration que j'avais vue dans un livre quand j'étais petite.\n@c0@"
  it: "@aNera@bQuesto posto somiglia in maniera impressionante a un'immagine che vidi su un libro di fiabe quand'ero piccola!\n@c0@"
  ja: "@a@bフローラ「昔　私が読んだ　絵本のさし絵に\n\tそっくりの場所ですわ。\n@c0@"
10:
  de: "@aNera@b%0%a001250 scheint Bücher auch sehr zu mögen. Ich muss es ihr unbedingt mal geben, wenn ich es wiederfinde.\n@c0@"
  en: "@aNera@b%0%a001250 seems to really like books. I'll have to find it and read it to her one day.\n@c0@"
  es: "@aNera@bSembra que a %a001250 le gustan mucho los libros. Un día lo buscaré y se lo leeré.\n@c0@"
  fr: "@aNera@b%0%a001250 a l'air de beaucoup aimer les livres.\nIl va falloir que je le retrouve pour le lui lire.\n@c0@"
  it: "@aNera@bChissà se l'autore dell'illustrazione era stato qui personalmente o se aveva solo immaginato che era fatto così...\n㈡\nCerto, nel secondo caso si tratterebbe di una coincidenza sconcertante!\n@c0@"
  ja: "@a@bフローラ「%a001250は\n\t本が好きみたいだから\n\tいつか　読ませてあげたいわね。\n@c0@"
11:
  de: "@aNera@bDanke, Liebling. Ich wollte immer schon mal ins Reich der Feen.\n@c0@"
  en: "@aNera@bThank you, darling. I was just thinking how I'd love to visit the Realm of the Faeries.\n@c0@"
  es: "@aNera@bGracias, caro mio. Precisamente estaba pensando que me encantaría visitar el Reino de las Hadas.\n@c0@"
  fr: "@aNera@bMerci, chéri. Je me disais justement que j'adorerais visiter le royaume des Fées.\n@c0@"
  it: "@aNera@bGrazie di avermi portata nel Regno delle Fate, tesoro mio. Non credevo che avrei mai visto un posto tanto bello!\n@c0@"
  ja: "@a@bフローラ「あなた　ありがとう。\n\t私　妖精さんの村を\n\t見たいと思っていたところだったのよ。\n@c0@"
12:
  de: "@aBianca@bZwerge vollbringen die erstaunlichsten Dinge, nicht? Sie sind außergewöhnliche Geschöpfe...\n@c0@"
  en: "@aBianca@bDwarfs make all kinds of things, eh? They're pretty impressive creatures by all accounts.\n@c0@"
  es: "@aBianca@bLos enanos son capaces de hacer cualquier cosa, ¿eh? Son criaturas admirables, se mire por donde se mire.\n@c0@"
  fr: "@aBianca@bLes nains fabriquent vraiment un tas de choses.\r\nCe sont des créatures assez impressionnantes.\n@c0@"
  it: "@aBianca@bSai perché i nani sono tutti dei gran lavoratori?.\nPerché non amano stare con le mani in... nano!\r\nAh ah ah!\n@c0@"
  ja: "@a@bビアンカ「ドワーフって　なんでも\n\t作っちゃうのね。　感心しちゃうわ。\n@c0@"
13:
  de: "@a%0%a001250@bDieser Schleim war total süß, findest du nicht auch?\n@c0@"
  en: "@a%0%a001250@bThat slime looked really cute, don't you think?\n@c0@"
  es: "@a%0%a001250@bEse limo era muy mono, ¿a que sí?\n@c0@"
  fr: "@a%0%a001250@bCe gluant avait l'air mignon, tu ne trouves pasⓡ\n@c0@"
  it: "@a%0%a001250@bPapà, hai visto quant'è carino quello Slime?\n@c0@"
  ja: "@a@b%a001250「あの子　すごく\n\tかわいい顔してたね。\n@c0@"
14:
  de: "@a%0%a001250@bIch wusste, dass du meiner Meinung bist. Wir sind immer der gleichen Meinung!\n@c0@"
  en: "@a%0%a001250@bI knew you'd agree, Dad!\nYou see things like that.\n@c0@"
  es: "@a%0%a001250@bSabía que tú también pensarías eso, papi.\nTú te das cuenta de esas cosas.\n@c0@"
  fr: "@a%0%a001250@bJe savais que tu serais d'accord, papaⓠ\nToi, tu arrives à voir ce genre de choses.\n@c0@"
  it: "@a%0%a001250@bSapevo che la pensavi come me!\nDopotutto sono tua figlia, no?\n@c0@"
  ja: "@a@b%a001250「さすが　お父さん！\n\tちがいが　わかってる～。\n@c0@"
15:
  de: "@a%0%a001250@bOh. Du findest, dass alle Schleime gleich aussehen? Hm, komisch...\n@c0@"
  en: "@a%0%a001250@bOh. You think all slimes look the same?\nThat's weird.\n@c0@"
  es: "@a%0%a001250@b¡Oh! ¿Crees que todos los limos son iguales?\n¡Qué raro!\n@c0@"
  fr: "@a%0%a001250@bOh, tu trouves que tous les gluants se ressemblentⓡ\nC'est bizarre.\n@c0@"
  it: "@a%0%a001250@bAh, no? Dici che è grasso e flaccido?!\nGuarda che glielo dico e ti faccio slurpare tutto!\nEh eh eh!\n@c0@"
  ja: "@a@b%a001250「えっ？　お父さんには\n\tみんな　同じ顔に見えちゃうの？\n\tおかしいな……。\n@c0@"
16:
  de: "@aBianca@bSchon seltsam, dass du vor all den Jahren schon einmal hier warst. Ich wünschte, ich wäre dabei gewesen.\n@c0@"
  en: "@aBianca@bIt's funny to think that you came to a place like this all them years ago. I wish I could've come with you.\n@c0@"
  es: "@aBianca@bEs curioso pensar que estuviste en un sitio como este hace tantos años. Cómo me habría gustado haber estado contigo, ¿sabes?\n@c0@"
  fr: "@aBianca@bC'est drôle de se dire que tu es déjà venu ici\r\nil y a si longtemps. J'aurais bien aimé venir\r\navec toi, à l'époque.\n@c0@"
  it: "@aBianca@bVent'anni... Vent'anni sono tanti, sai?\r\nAll'epoca non ero nemmeno nata!\r\nEhm...\n@c0@"
  ja: "@a@bビアンカ「%a000090ったら　あの頃\n\tこんな所まで　遊びに来てたのね。\n\t私も　いっしょに来たかったな……。\n@c0@"
17:
  de: "@a%0%a001240@bAlso warst du wirklich mal ein kleiner Junge. Sancho etwa auch, was meinst du?\n@c0@"
  en: "@a%0%a001240@bSo you really did used to be a little boy.\nDoes that mean Sancho was small once too?\n@c0@"
  es: "@a%0%a001240@bAsí que tú también fuiste niño...\n¿Eso quiere decir que Sancho también?\n@c0@"
  fr: "@a%0%a001240@bDonc c'est vrai que tu as été petit. Alors, ça veut dire que Sancho a été petit aussi dans le tempsⓡ\n@c0@"
  it: "@a%0%a001240@bChissà se vent'anni fa lo zio Sancho era già grasso come adesso...\n@c0@"
  ja: "@a@b%a001240「お父さんって　やっぱり\n\t昔は　子供だったんだ。\n\tじゃあ　サンチョも子供だったの？\n@c0@"
18:
  de: "@aSancho@bEh, Chico! Habe iss dir damals nisst gesagt, dass du nisst aus die Stadt gehen sollst? Und was du hast getan?\n㈡\nDu bist bis zu diese weit entfernte Ort gegangen!\n@c0@"
  en: "@aSancho@bEh, friend! I no tell you then that you must\r\nestay eenside the town? But you come eso\r\nfar away to thees place.\n@c0@"
  es: "@aSancho@b¡Eh, chamaco! ¿No te dije que te quedaras dentro de la ciudad? Pero no, tú viniste hasta acá tan lejos.\n@c0@"
  fr: "@aSancho@bHé, chicoⓠ J-Je ne t'avais pas dit de ne pas sortir de la v-ville, à l'époqueⓡ Et toi, tu es allé très loin jusqu'ici.\n@c0@"
  it: "@aSancho@bChico, yo me recuerdo que te dissi de no allontanarte dal villaggio... ¡Eppure tu venisti fin aquí! ¡Ay, que discolo que fosti!\n@c0@"
  ja: "@a@bサンチョ「坊っちゃん！　あの頃\n\tあれほど　村から出てはいけないと\n\t言いましたのに　こんな所まで！\n@c0@"
19:
  de: "@aSancho@bQué? Du bist von unserem Haus hierher gelangt?!\n@c0@"
  en: "@aSancho@bQué? You come here from eenside our house!?\n@c0@"
  es: "@aSancho@b¿Qué? ¡¿Que llegaste acá desde dentro de nuestra casa?!\n@c0@"
  fr: "@aSancho@bQuéⓡ T-Tu es arrivé ici depuis notre m-maisonⓠⓑ\n@c0@"
  it: "@aSancho@b¿Que cosa? ¿Venisti nel Regno de las Fatas senza uscire de casa? ¿Ay, ma por qué te diverti a prendere siempre en giro el tuo povero zio Sancho?\n@c0@"
  ja: "@a@bサンチョ「えっ？\n\t村どころか　家からも出てない？\n\tは？？\n@c0@"
20:
  de: "@a%0%a001240@bIst Marmela eine Freundin von dir, Papa? Dann würde ich sie gern mal kennenlernen.\n@c0@"
  en: "@a%0%a001240@bIs Treacle a friend of yours, Dad?\nI'd like to meet her if she is.\n@c0@"
  es: "@a%0%a001240@b¿Miel es amiga tuya, papi?\n¡Sí, sí!, me gustaría conocerla.\n@c0@"
  fr: "@a%0%a001240@bPapa, Mélissa est l'une de tes amiesⓡ\nSi c'est le cas, j'aimerais bien la rencontrer.\n@c0@"
  it: "@a%0%a001240@bPapà, ma Adusya è una tua amica?\nMe la presenti?\n@c0@"
  ja: "@a@b%a001240「ポワンさま　っていう人が\n\tお父さんの友だち？\n\tボク　お父さんの友だちに会いたいよ。\n@c0@"
21:
  de: "@aOtto@bAah. Diese Feen sind wirklich süß, findet Ihr net auch?\n@c0@"
  en: "@aTuppence@bAah. Faeries really are rather sweet, aren't they?\n@c0@"
  es: "@aAlazar@bMmm, las hadas son muy dulces, ¿verdad?\n@c0@"
  fr: "@aInnocent@bAh, les fées sont vraiment jolies, n'est-ce pasⓡ\n@c0@"
  it: "@aSimon@bLe fate sono troppo carine. Ora capisco perché non vogliono farsi vedere dagli uomini: se si mostrassero, c'innamoreremmo perdutamente di loro!\n@c0@"
  ja: "@a@bピピン「妖精って　かわいいですねえ。\n\tぽっ……。\n@c0@"
22:
  de: "@aOtto@bAah. All diese Feen sind ja so was von hinreizend!\n@c0@"
  en: "@aTuppence@bAah. All of these faeries are just so\r\nincredibly sweet!\n@c0@"
  es: "@aAlazar@b¡Aaah! ¡Qué dulces son todas estas hadas!\n@c0@"
  fr: "@aInnocent@bAh, toutes ces fées sont à croquerⓠ\n@c0@"
  it: "@aSimon@bNon ho ancora visto una fata racchia. Secondo me non esistono fate racchie. Se una fata nasce racchia, la spediscono nel mondo degli umani.\n@c0@"
  ja: "@a@bピピン「妖精って\n\tかわいい子ばっかりですねえ。\n\tぽっ……。\n@c0@"
23:
  de: "@a%0%a001240@bSie war also gar nicht die Königin?\n@c0@"
  en: "@a%0%a001240@bSo she wasn't the queen, then?\n@c0@"
  es: "@a%0%a001240@b¿Así que no era la Reina?\n@c0@"
  fr: "@a%0%a001240@bAlors ce n'est pas elle la reineⓡ\n@c0@"
  it: "@a%0%a001240@bAllora non era lei la Regina delle Fate?\n@c0@"
  ja: "@a@b%a001240「あの人が　女王さまじゃ\n\tなかったんだね。\n@c0@"
24:
  de: "@a%0%a001240@bWir müssen also nur in dieses Horn blasen, um die Königin zu rufen? Darf ich blasen? Bitte, Papa!\n@c0@"
  en: "@a%0%a001240@bSo when we blow this horn, we get to meet the Queen? Will you let me blow it, Dad? Pleeease!\n@c0@"
  es: "@a%0%a001240@bEntonces, si hacemos sonar este cuerno, ¿veremos a la Reina? ¡Déjame hacerlo a mí, papá! ¡Por faaa!\n@c0@"
  fr: "@a%0%a001240@bAlors quand on souffle dans cette corne,\non rencontre la reineⓡ Papa, tu me laisseras soufflerⓡ S'il te plaîtⓠ\n@c0@"
  it: "@a%0%a001240@bQuindi ci basterà suonare il corno per incontrare la Regina delle Fate...?\nPapà, posso provare?\n@c0@"
  ja: "@a@b%a001240「このホルンを吹くと\n\t女王さまに　会えるの？\n\tその時が来たら　ボクに吹かせてね！\n@c0@"
25:
  de: "@a%0%a001250@bHier gibt es so viele Feen! Glaubst du, dass ich mich mit ein paar von ihnen anfreunden könnte?\n@c0@"
  en: "@a%0%a001250@bThere are so many faeries here! Do you think I might be able to make friends with some of them?\n@c0@"
  es: "@a%0%a001250@b¡Cuántas hadas hay aquí! ¿Crees que podremos hacernos amigos de alguna?\n@c0@"
  fr: "@a%0%a001250@bIl y a tellement de fées iciⓠ Tu crois que je pourrai me faire des copinesⓡ\n@c0@"
  it: "@a%0%a001250@bMi piacerebbe molto fare amicizia con le fate...\nCredi che mi accetteranno come amica?\n@c0@"
  ja: "@a@b%a001250「妖精の国って　妖精さん\n\tいっぱい　いるよね。\n\tわたし　お友だちに　なれるかな？\n@c0@"
26:
  de: "@a%0%a001250@bOh, welch ein hübsches Horn! Ist das eine Art Instrument? Damit kann man bestimmt schöne Musik machen...\n@c0@"
  en: "@a%0%a001250@bOoh, what a pretty horn! Is it some kind of musical instrument? I wonder what kind of music it plays.\n@c0@"
  es: "@a%0%a001250@b¡Oooh, qué precioso cuerno! ¿Es una especie de instrumento musical? Me pregunto qué clase de música se puede tocar con él.\n@c0@"
  fr: "@a%0%a001250@bQu'elle est jolie cette corneⓠ C'est une sorte d'instrument de musiqueⓡ Je me demande\nquel son elle fait.\n@c0@"
  it: "@a%0%a001250@bChe bello quel corno!\nNon avevo mai visto uno strumento musicale tanto particolare!\n@c0@"
  ja: "@a@b%a001250「わ～　きれいなホルン。\n\tこれって　楽器？\n\tどんな音楽を　奏でるのかな？\n@c0@"
27:
  de: "@aSancho@bEs hängt alles zusammen, si? Du hast jemandem in die Vergangenheit geholfen, und jetzt sie helfen dir!\n@c0@"
  en: "@aSancho@bEes all connected, sí? You help esomeone een the past, and now they help you.\n@c0@"
  es: "@aSancho@bCada uno da lo que recibe y luego recibe lo que da. Ayudaste a alguien hace tiempo y ahora te ayudan a ti, nomás.\n@c0@"
  fr: "@aSancho@bT-Tout est lié, heinⓡ T-Tu les a aidées dans le temps et, m-maintenant, elles t'aident.\n@c0@"
  it: "@aSancho@b¿Una mano lava l'altra, eh?\nTu hai aiutato las fatas en passato, y ahora loros aiutano nosotros. ¡Que bueno!\n@c0@"
  ja: "@a@bサンチョ「%a000090王の　冒険は\n\tずっと　つながっていたんですね。\n\tほら　こうして今　助けてもらえます。\n@c0@"
28:
  de: "@a%0%a001240@bHast du das gehört?! Also gibt es dieses Zenithiaschloss wirklich! Wir müssen es finden, Papa!\n@c0@"
  en: "@a%0%a001240@bDid you hear that!? So there really is a Zenithian castle out there somewhere! We have to find it, Dad!\n@c0@"
  es: "@a%0%a001240@b¡¿Has oído eso?! ¡Entonces, es verdad que existe un castillo de Zenithia en alguna parte! ¡Tenemos que encontrarlo, papi!\n@c0@"
  fr: "@a%0%a001240@bT'as entenduⓠⓑ Ça veut dire qu'il y a vraiment un château zénithien quelque partⓠ Il faut qu'on le trouve, papaⓠ\n@c0@"
  it: "@a%0%a001240@bMa allora il Castello di Zenithia esiste davvero?!\nPapà, dobbiamo trovarlo!\n@c0@"
  ja: "@a@b%a001240「聞いた！？　やっぱり\n\t天空のお城って　どこかにあるんだよ。\n\tねえ　さがしてみよう。　お父さん！\n@c0@"
29:
  de: "@a%0%a001250@bIch habe ein wenig Höhenangst. Im Schloss selbst wird es keine Probleme geben, aber diese Treppe bereitet mir schon ein paar Sorgen...\n@c0@"
  en: "@a%0%a001250@bI'm not very good when it comes to heights. I should be okay in the castle, but I'm not too sure about the stairway...\n@c0@"
  es: "@a%0%a001250@bLas alturas no son mi fuerte. Lo del castillo vale, pero lo de las escaleras, no sé...\n@c0@"
  fr: "@a%0%a001250@bJ'ai un peu le vertige. Le château ne devrait pas poser de problème, mais les Marches... je ne suis\npas sûre...\n@c0@"
  it: "@a%0%a001250@bSe questa Scalinata di Zenithia è molto alta, io resto qui!\nLo sai che soffro di vertigini...\n@c0@"
  ja: "@a@b%a001250「わたし　高いところ苦手なの。\n\tお城なら　大丈夫だと思うけど\n\t塔は…　こわい……。\n@c0@"
30:
  de: "@aSancho@bDiese Señorita ist noch so jung, aber sie führt diese Ort wirkliss sehr gut.\n@c0@"
  en: "@aSancho@bThees señorita ees eso young, but eshe rules thees place eso well.\n@c0@"
  es: "@aSancho@bEsta señorita es bien joven, pero gobierna padrísimo este país.\n@c0@"
  fr: "@aSancho@bCette señorita est j-jeune, mais elle d-dirige ce royaume comme oun chef.\n@c0@"
  it: "@aSancho@bEsta señorita es giovane, ma ha già un ruolo de grande responsabilidad.\n¡Y lo svolge anche muy bien!\n@c0@"
  ja: "@a@bサンチョ「まだ　お若いようですのに\n\tおひとりで　この村を治めているとは\n\tいやはや　ご立派ですなあ。\n@c0@"
31:
  de: "@aOtto@bMmm... Marmela. Welch süßer Name... und welch süße Fee!\n@c0@"
  en: "@aTuppence@bMmm... Treacle. She really is terribly sweet.\n@c0@"
  es: "@aAlazar@bMmm... Miel. Pero mira que es dulce.\n@c0@"
  fr: "@aInnocent@bMmm... Mélissa... Elle est vraiment craquante.\n@c0@"
  it: "@aSimon@bAdusya è una fata molto graziosa...\n@c0@"
  ja: "@a@bピピン「ポワンさま…　ステキだ。\n\tぽっ……。\n@c0@"
32:
  de: "@a%0%a001240@bMarmela ist wirklich hübsch und auch noch so freundlich. Ob Mama ein wenig wie sie ist?\n@c0@"
  en: "@a%0%a001240@bTreacle's got such a lovely smile, and she's so friendly. I wonder if Mum's like her.\n@c0@"
  es: "@a%0%a001240@bLa sonrisa de Miel es preciosa, y ella es tan amable... Me pregunto si mamá también es así.\n@c0@"
  fr: "@a%0%a001240@bMélissa a un joli sourire et elle est gentille.\nJe me demande si maman est comme elle.\n@c0@"
  it: "@a%0%a001240@bChe bel sorriso che ha Adusya!\nEd è anche simpaticissima!\nAnche la mia mamma è così?\n@c0@"
  ja: "@a@b%a001240「ポワンさまって　笑顔がきれいで\n\tやさしそうな人だよね。\n\tお母さんも　あんな感じなのかな。\n@c0@"
33:
  de: "@a%0%a001240@bWenn wir mal Zeit haben, musst du mir unbedingt alles erzählen, was du damals hier erlebt hast, in Ordnung?\n@c0@"
  en: "@a%0%a001240@bWhen you get the chance, will you tell me all\nabout what happened here in the past? I really\nwant to know!\n@c0@"
  es: "@a%0%a001240@bCuando tengas un ratito, ¿me contarás lo que pasó aquí hace tiempo? ¡Me gustaría saberlo!\n@c0@"
  fr: "@a%0%a001240@bQuand on aura le temps, tu me raconteras tout ce qui s'est passé ici dans le tempsⓡ J'ai vraiment envie de savoirⓠ\n@c0@"
  it: "@a%0%a001240@bPapà, quando avrai un po' di tempo, dovrai raccontarmi tutto quello che facesti quando venisti qui la prima volta! Sono troppo curioso di saperlo!\n@c0@"
  ja: "@a@b%a001240「ねえ　お父さん。　今度\n\tポワンさまの言ってた　あの時のこと\n\tっていうの　ゆっくり聞かせてね！\n@c0@"
34:
  de: "@a%0%a001250@bMarmelas Kleider sind wunderschön. So was würde ich auch gern mal tragen...\n@c0@"
  en: "@a%0%a001250@bTreacle's clothes are so beautiful. If only I could try on some clothes like that.\n@c0@"
  es: "@a%0%a001250@bLa ropa que lleva Miel es preciosa. Me gustaría podérmela probar.\n@c0@"
  fr: "@a%0%a001250@bLes habits de Mélissa sont magnifiques. Si seulement je pouvais essayer ce genre de tenue, moi aussi...\n@c0@"
  it: "@a%0%a001250@bHai visto come sono belli i vestiti che indossa Adusya?\nLe posso chiedere dove li ha comprati?\n@c0@"
  ja: "@a@b%a001250「ポワンさまの服　きれいね。\n\tわたしも　あんなお洋服\n\t着てみたい……。\n@c0@"
