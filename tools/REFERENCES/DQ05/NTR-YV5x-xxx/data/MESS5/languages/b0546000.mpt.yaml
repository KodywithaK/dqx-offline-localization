36:
  de: "@aSancho@bChico, unsere Aufgaben hier sind erfüllt, no? Sollten wir nisst langsam aufbrechen?\n@c0@"
  en: "@aSancho@bMy Majesty, we no have anytheeng more to do here, no? Ees time to leave?\n@c0@"
  es: "@aSancho@bMajestad, ya no tenemos naditita que hacer aquí, ¿no? ¿Nos vamos ya pues?\n@c0@"
  fr: "@aSancho@bMa M-Majesté, on n'a p-plus rien à faire ici, noⓡ\nIl ne serait pas temps de p-partirⓡ\n@c0@"
  it: "@aSancho@b¿Chico, dobbiamo fare qualche altras cosas aquí?\n¿No piensi que sarebbe el caso de andare?\n@c0@"
  ja: "@a@bサンチョ「ところで　%a000090王。\n\tここまで来た　ご用事は\n\tもう　おしまいですか？\n@c0@"
37:
  de: "@aOtto@bMmm... Marmela. Welch süßer Name... und welch süße Fee!\n@c0@"
