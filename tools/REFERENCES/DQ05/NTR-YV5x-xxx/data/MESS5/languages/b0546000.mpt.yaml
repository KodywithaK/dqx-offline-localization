38:
  de: "@aBianca@bSoll man es den Leuten denn wirklich zumuten, zum Himmel hoch zu steigen, um nach Zenithia zu gelangen?\n@c0@"
  en: "@aBianca@bD'you think you're really supposed to climb up into the heavens to get to Zenithia?\n@c0@"
  es: "@aBianca@b¿De verdad crees que el lugar de Zenithia estará en el cielo?\n@c0@"
  fr: "@aBianca@bTu crois qu'il faut vraiment monter vers les cieux pour arriver à Zénithiaⓡ\n@c0@"
  it: "@aBianca@bE così per arrivare a Zenithia bisogna volare su in cielo...\n@c0@"
  ja: "@a@bビアンカ「天空城って　本当に\n\t天の上まで　のぼるのかしら？\n@c0@"
39:
  de: "@aBianca@bMir gefällt es eigentlich ganz gut dort, wo es jetzt ist. In der Mitte!\n@c0@"
  en: "@aBianca@bI think it looks quite good floatin' about in the middle of the sky like it is at the minute, personally.\n@c0@"
  es: "@aBianca@bA mí me gusta tal y como está, ¿sabes?\n@c0@"
  fr: "@aBianca@bPersonnellement, je trouve que le château a fière allure tel qu'il est, flottant comme ça au milieu du ciel.\n@c0@"
  it: "@aBianca@bPiù penso all'idea di un castello che fluttua tra le nuvole, più la cosa mi pare inverosimile!\n@c0@"
  ja: "@a@bビアンカ「はんぱな高さで\n\tプカプカ浮いてる　今の姿も\n\tなかなか　にあってると思うけど。\n@c0@"
40:
  de: "@aNera@bDann scheint es wohl nicht damit getan zu sein, dass der Zenithdrache aufersteht... Erst muss Zenithia wieder in den Himmel steigen.\n@c0@"
  en: "@aNera@bIt looks like we were wrong about peace being restored to the world just by the Zenith Dragon being resurrected.\n@c0@"
  es: "@aNera@bParece que nos equivocamosⓓ no bastaba con la resurrección del Dragón de Zenithia para que la pace volviera al mondo.\n@c0@"
  fr: "@aNera@bJ'ai l'impression qu'on s'est trompés en se disant\r\nqu'il suffirait de ressusciter le Dragon du Zénith pour ramener la paix dans le monde.\n@c0@"
  it: "@aNera@bQuindi riportare in vita il Drago di Zenithia non è sufficiente per sconfiggere l'oscurità che minaccia il mondo...\n@c0@"
  ja: "@a@bフローラ「空の神さまさえ\n\t復活なさったら　世界も平和になると\n\t思ってましたのにね……。\n@c0@"
41:
  de: "@a%0%a001240@bDie ganze Welt wünscht sich Frieden, nicht wahr? Ich werde mein Bestes geben, aber du musst an meiner Seite bleiben, Papa.\n@c0@"
  en: "@a%0%a001240@bEverybody wants peace, don't they? I'll do my best, as long as you stick by me, Dad.\n@c0@"
  es: "@a%0%a001240@bTodos quieren la paz, ¿no? Si tú estás conmigo, papá, yo haré todo lo que pueda.\n@c0@"
  fr: "@a%0%a001240@bTout le monde veut la paix, pas vraiⓡ Je ferai de mon mieux, du moment que tu restes avec moi, papa.\n@c0@"
  it: "@a%0%a001240@bLa pace tornerà a regnare! Ce la faremo, papà, non è vero? Noi ce la stiamo mettendo tutta per salvare il mondo... Speriamo che basti!\n@c0@"
  ja: "@a@b%a001240「みんな　平和がいいんだよね。\n\tボク　がんばるから\n\tお父さんも　いっしょに来てね。\n@c0@"
42:
  de: "@a%0%a001250@bFrieden muss ja nicht unbedingt eine Welt ohne Monster bedeuten, nicht? Hauptsache, alle Geschöpfe leben glücklich und harmonisch zusammen.\n@c0@"
  en: "@a%0%a001250@bPeace doesn't mean a world without monsters, right? Peace will be when we can all live together\nin harmony.\n@c0@"
  es: "@a%0%a001250@bLa paz no quiere decir un mundo sin monstruos, ¿no? En realidad quiere decir que todos podamos vivir juntos en armonía.\n@c0@"
  fr: "@a%0%a001250@bLa paix, ça ne veut pas dire que tous les monstres doivent disparaître, heinⓡ La paix, c'est pouvoir vivre tous ensemble, en harmonie.\n@c0@"
  it: "@a%0%a001250@bQuando il mondo sarà in pace, gli uomini impareranno che non devono avere paura dei mostri.\n@c0@"
  ja: "@a@b%a001250「魔物さんのいない世界を\n\t平和って言うんじゃないよね？\n\tみんなで暮らせるのが　平和よね。\n@c0@"
43:
  de: "@aSancho@bTs! Alle reden immer nur von Frieden! Aber es ist gar nisst so einfach, diese Frieden zu finden, no?\n@c0@"
  en: "@aSancho@bAnda! Everyone, they esay notheeng but peace, peace, peace. But ees no easy to find the peace, you know? \n@c0@"
  es: "@aSancho@b¡Chale! Todo el mundo dice nomás que paz, paz, paz. Pero, pues no es fácil encontrar la paz.\n@c0@"
  fr: "@aSancho@bAndaⓠ La p-paix... Tout le mundo n'a que ce mot\nà la b-bouche. Mais ce n'est pas si facile de rétablir la p-paixⓠ\n@c0@"
  it: "@aSancho@b¡Hombres y fatas vogliono la paz!\nEsta es una cosa muy buena.\nPurtroppos, no es facil ottenerla...\n@c0@"
  ja: "@a@bサンチョ「みなさん　平和に　平和に\n\tって言いますけどね。　そうするのは\n\tどんなに大変なことか……。\n@c0@"
44:
  de: "@aOtto@bDie niedliche Marmela betet also für mich! Da fühle ich mich doch gleich viel besser! Los, lasst uns aufbrechen!\n@c0@"
  en: "@aTuppence@bSo the lovely Treacle is praying too! Ooh, I feel better already! I'm raring to go now!\n@c0@"
  es: "@aAlazar@b¡Así que la preciosa Miel también está rezando! ¡Ya me siento mucho mejor! ¡Estoy deseando ponerme manos a la obra!\n@c0@"
  fr: "@aInnocent@bAlors comme ça, la jolie Mélissa prie aussiⓠ Je me sens déjà mieuxⓠ J'ai hâte d'y aller, maintenantⓠ\n@c0@"
  it: "@aSimon@bFarò del mio meglio per non deludere la meravigliosa Adus... Ehm, volevo dire che farò del mio meglio per riportare la pace nel mondo...\n@c0@"
  ja: "@a@bピピン「ポワンさまも祈ってくださってる！\n\tか～～っ！　元気がわいてきましたよ。\n\tさあ　どんどん行きましょう！\n@c0@"
45:
  de: "@a%0%a001250@bIch werde auch ein paar Freunde unter den Feen finden, genau wie du, Papa. Und eines Tages können wir dann alle zusammen auf Abenteuerfahrt gehen!\n@c0@"
  en: "@a%0%a001250@bI'm going to make friends with some faeries\njust like you have, Dad. And one day, we'll all\ngo off adventuring together.\n@c0@"
  es: "@a%0%a001250@bVoy a hacerme amiga de algunas de las hadas, igual que tú, papá. Y algún día iremos juntas de aventuras.\n@c0@"
  fr: "@a%0%a001250@bJe vais faire comme toi, papa. Je vais devenir copine avec des fées et un jour, on partira à l'aventure ensemble.\n@c0@"
  it: "@a%0%a001250@bPapà, ho deciso: diventerò amica di qualche fata, e poi ce ne andremo in giro per il mondo insieme!\nChe te ne pare della mia idea? Ti piace?\n@c0@"
  ja: "@a@b%a001250「わたしも　お父さんみたいに\n\t妖精さんの　お友だち　つくりたいな。\n\tそして　いっしょに　冒険するの。\n@c0@"
46:
  de: "@aSancho@bUnglaubliss... Du bist also wirkliss hierher gekommen, als du eine Niño warst, Chico?\n@c0@"
  en: "@aSancho@bEes amazing... You really came here when you were eso young, eh, friend?\n@c0@"
  es: "@aSancho@b¡Es padrísimo! ¿Es de verdad que viniste acá cuando eras un chamaquito?\n@c0@"
  fr: "@aSancho@bC-C'est incroyable... T-Tu es vraiment venu ici quand tu étais pequeño, chicoⓡ\n@c0@"
  it: "@aSancho@b¡Chico, alloras eri estato veramentes aquí da piccolo! Yo credevo que tu avessi detto una bugia allo zio Sancho...\n@c0@"
  ja: "@a@bサンチョ「はあ～……。　本当に\n\tあの頃　坊っちゃんは　ここまで\n\t冒険に来ていたんですね。\n@c0@"
47:
  de: "@aSancho@bDeine Padre, Señor Ludwig, er ist auch immer weggelaufen als kleine Muchacho, aber im Vergleiss zu dir war das gar nissts!\n@c0@"
  en: "@aSancho@bYour father, señor Pankraz, he was also the escape artist when he was young, but ees\r\nnotheeng compared to you!\n@c0@"
  es: "@aSancho@b¡Tu padre, el señor Teudis, era un artista de la fuga cuando era un chavo, pero a tu lado pues no era nada!\n@c0@"
  fr: "@aSancho@bTon padre, le señor P-Petros, c'était aussi un roi de l'évasion quand il était p-petit, mais ce n'était rien\r\nc-comparé à toi.\n@c0@"
  it: "@aSancho@bEl señor Russel aveva visitato todos los países del mundo, ma nemmenos lui era mai estato nel Regno de las Fatas...\n@c0@"
  ja: "@a@bサンチョ「パパスさまも　お小さい頃\n\tお城を抜け出すのが　得意でしたが\n\tいやはや　坊っちゃんまでとは……。\n@c0@"
48:
  de: "@aOtto@bEure Majestät! Ihr müsst mich unbedingt diesem bezaubernden G'schöpf vorstellen!\n@c0@"
  en: "@aTuppence@bYour Majesty! You absolutely must introduce me to that delightful creature!\n@c0@"
  es: "@aAlazar@b¡Majestad! ¡Es necesario que me presentéis a esa criatura deliciosa!\n@c0@"
  fr: "@aInnocent@bVotre Majestéⓠ Vous devez absolument me présenter à cette ravissante créatureⓠ\n@c0@"
  it: "@aSimon@bMaestà, la imploro!\nMi presenti a quella meravigliosa creatura!\n@c0@"
  ja: "@a@bピピン「%a000090王！\n\tぜひ　あの子を　ボクに\n\t紹介してください！！\n@c0@"
49:
  de: "@a%0%a001240@bZuckerchen war bestimmt gesprächiger, als du das letzte Mal hier warst, nicht, Papa?\n@c0@"
  en: "@a%0%a001240@bWas Honey a bit more chatty the last time you met her, Dad?\n@c0@"
  es: "@a%0%a001240@bCuando tú conociste a Dulce, papá, ¿hablaba más que ahora?\n@c0@"
  fr: "@a%0%a001240@bCandy parlait plus la dernière fois que tu l'as vue, papaⓡ\n@c0@"
  it: "@a%0%a001240@bAmandina è molto simpatica...\n@c0@"
  ja: "@a@b%a001240「ベラさんって\n\tお父さんと　冒険した頃は\n\tもっと　おしゃべりだったの？\n@c0@"
50:
  de: "@a%0%a001240@bWahrscheinlich ist sie nur deshalb so ruhig, um Marmela ihren Respekt zu zollen...\n@c0@"
  en: "@a%0%a001240@bI'll bet she's being quiet now to show respect\nto Treacle.\n@c0@"
  es: "@a%0%a001240@bSeguro que ahora se calla por respeto a Miel.\n@c0@"
  fr: "@a%0%a001240@bJe parie que là, elle ne dit rien par respect pour Mélissa. \n@c0@"
  it: "@a%0%a001240@bPerò me l'aspettavo più espansiva...\nForse è rimasta sulle sue per dimostrare rispetto ad Adusya...\n@c0@"
  ja: "@a@b%a001240「ポワンさまの前だから\n\tおすまし　してるのかな？\n@c0@"
51:
  de: "@a%0%a001250@bMarmela... Zuckerchen... Vanilla... Diese Feennamen sind alle richtig süß, findest du nicht auch?\n@c0@"
  en: "@a%0%a001250@bTreacle... Honey... Sherbet...\nFaeries' names are all so sweet, don't you think?\n@c0@"
  es: "@a%0%a001250@bMiel... Dulce... Melaza...\nQué dulces son los nombres de las hadas, ¿no crees?\n@c0@"
  fr: "@a%0%a001250@bMélissa... Candy... Ambroisie... Les noms des fées sont vraiment doux comme du miel, tu ne trouves pasⓡ\n@c0@"
  it: "@a%0%a001250@bAdusya... Amandina... Lybrina...\nLe fate hanno tutte dei nomi dolcissimi.\n@c0@"
  ja: "@a@b%a001250「ポワン…　ベラ…　ルナ……。\n\t妖精さんの名前って　きれいね。\n\tお父さんも　そう思わない？\n@c0@"
52:
  de: "@aBianca@bEs gibt schon viele seltsame Orte auf der Welt, nicht wahr?\n@c0@"
  en: "@aBianca@bThere are all sorts of odd places dotted about the world, eh?\n@c0@"
  es: "@aBianca@bEn el mundo hay montones de lugares bien raros, ¿eh?\n@c0@"
  fr: "@aBianca@bIl y a vraiment toutes sortes d'endroits étranges dans le monde, heinⓡ\n@c0@"
  it: "@aBianca@bSe una fata dice che un posto è magico, mi aspetto che sia un luogo veramente speciale.\nMa veramente tanto speciale!\n@c0@"
  ja: "@a@bビアンカ「世界には　ふしぎな場所が\n\tあるものよねえ。\n@c0@"
53:
  de: "@aNera@bDu siehst ein wenig enttäuscht aus, Liebling. War dein letztes Abenteuer mit Zuckerchen wirklich so aufregend?\n@c0@"
  en: "@aNera@bYou look a bit disappointed, darling. Was your last adventure with Honey really that much fun?\n@c0@"
  es: "@aNera@bPareces un poco decepcionado, caro mio. ¿Tanto te divertiste en tu última aventura con Dulce?\n@c0@"
  fr: "@aNera@bTu as l'air un peu déçu, mon chéri. Ta précédente aventure avec Candy était si amusante que çaⓡ\n@c0@"
  it: "@aNera@bLa Radura del Novunque... La Reggia Fatata...\nSono nomi da fiaba, eppure questi posti esistono davvero!\n@c0@"
  ja: "@a@bフローラ「あなた　ざんねんそうですわね。\n\tそんなに　ベラさんとの冒険が\n\t楽しかったのかしら？\n@c0@"
54:
  de: "@a%0%a001240@bGlaubst du, alle Feen halten sich an das, was die Königin sagt?\n㈡\nIch wäre schon längst mal ins Feenschloss geschlichen, wenn keiner hingeschaut hätte...\n@c0@"
  en: "@a%0%a001240@bDo you think all of the faeries obey what the Queen says? If it were me, I'd probably sneak off there when no one was looking.\n@c0@"
  es: "@a%0%a001240@b¿Crees que todas las hadas hacen caso de lo que dice la Reina? Yo me escaparía cuando no mirase nadie.\n@c0@"
  fr: "@a%0%a001240@bTu crois que toutes les fées font ce que la reine ditⓡ Si j'étais à leur place, j'essaierais de m'éclipser quand personne ne regarde.\n@c0@"
  it: "@a%0%a001240@bSe fossi una fata e non avessi il permesso di entrare nella Reggia, proverei a intrufolarmi di nascosto, senza farmi vedere da nessuno.\n@c0@"
  ja: "@a@b%a001240「妖精は　みんな\n\t女王さまの言いつけを　守ってるの？\n\tボクなら　こっそりぬけ出しちゃうな。\n@c0@"
55:
  de: "@a%0%a001250@bEs ist doch schön, dass sich auch Zuckerchen gerne an euer Abenteuer damals erinnert, nicht wahr?\n@c0@"
  en: "@a%0%a001250@bThat's good, Dad. It's nice that Honey has good memories of your adventure together too.\n@c0@"
  es: "@a%0%a001250@bEs bonito que los recuerdos de Dulce sobre vuestra aventura también sean agradables, papá.\n@c0@"
  fr: "@a%0%a001250@bJe trouve ça chouette que Candy se souvienne\nsi bien de vos aventures, elle aussi.\n@c0@"
  it: "@a%0%a001250@bPapà, si vede che stai simpatico ad Amandina...\nPenso che lei ti sia molto grata per quello che hai fatto per il Regno delle Fate quand'eri piccolo.\n@c0@"
  ja: "@a@b%a001250「お父さん　良かったね。\n\tベラさんも　お父さんとの冒険のこと\n\t大切な思い出に　してくれてるのね。\n@c0@"
56:
  de: "@a%0%a001240@bAllein der Gedanke, eine Nacht im Reich der Feen zu verbringen, ist aufregend!\n@c0@"
  en: "@a%0%a001240@bJust the idea of staying the night in the Realm of the Faeries is really exciting!\n@c0@"
  es: "@a%0%a001240@b¡Esto de quedarse a dormir en el Reino de las Hadas es muy emocionante!\n@c0@"
  fr: "@a%0%a001240@bCe serait vraiment super de passer la nuit dans le royaume des Féesⓠ\n@c0@"
  it: "@a%0%a001240@bPapà, stanotte possiamo dormire nel Regno delle Fate?\nSarebbe troppo forte!\n@c0@"
  ja: "@a@b%a001240「妖精の村の　宿屋\n\tっていうだけで　なんだか\n\tワクワクするね。\n@c0@"
57:
  de: "@a%0%a001250@bWahrscheinlich werden wir alle süße Träume haben, wenn wir die Nacht hier verbringen, meinst du nicht auch, Papa?\n@c0@"
  en: "@a%0%a001250@bWe'd probably all have lovely dreams if we stayed the night here, don't you think, Dad?\n@c0@"
  es: "@a%0%a001250@bSi nos quedamos a dormir aquí seguro que tenemos dulces sueños, ¿no crees, papi?\n@c0@"
  fr: "@a%0%a001250@bNous ferions sûrement tous de beaux rêves si nous passions la nuit ici. Tu ne crois pas, papaⓡ\n@c0@"
  it: "@a%0%a001250@bMi piacerebbe tanto trascorrere la notte nel Regno delle Fate...\nSono sicura che farei sogni meravigliosi!\n@c0@"
  ja: "@a@b%a001250「ここに泊まると\n\t楽しい夢が見られそうな　気がするね\n\tお父さん。\n@c0@"
58:
  de: "@a%0%a001250@bIch wünschte, ich hätte auch so ein Zimmer...\n@c0@"
  en: "@a%0%a001250@bI wish I could live in a room like this.\n@c0@"
  es: "@a%0%a001250@bMe gustaría que mi habitación fuese como esta.\n@c0@"
  fr: "@a%0%a001250@bJ'aimerais bien habiter dans une pièce comme ça.\n@c0@"
  it: "@a%0%a001250@bSarebbe bellissimo se potessi vivere in una stanza come questa...\n@c0@"
  ja: "@a@b%a001250「わたしも　こんなお部屋に\n\t住みたいな。\n@c0@"
59:
  de: "@aBianca@bWas ist nur mit dieser Wand los? Je länger ich sie ansehe, desto seltsamer kommt sie mir vor.\n@c0@"
  en: "@aBianca@bWhat's goin' on with that wall? The more times I look at it, the more odd it seems.\n@c0@"
  es: "@aBianca@b¿Se puede saber qué le pasa a esa pared? Cuanto más la miro, más extraña me parece.\n@c0@"
  fr: "@aBianca@bIl est bizarre ce mur. Plus je le regarde, plus je me dis qu'il a quelque chose d'étrange.\n@c0@"
  it: "@aBianca@bMa cos'ha quel muro?!\nPiù lo guardo, più mi sembra strano...\n@c0@"
  ja: "@a@bビアンカ「あのカベ\n\tどうなっているのかしら？\n\t何度見ても　ふしぎだわ。\n@c0@"
60:
  de: "@aNera@bWir sind zwar im Innern eines Baumes, aber trotzdem hat man das Gefühl, als wäre man im Wasser.\n㈡\nGenau, was man von einem Feenhaus erwartet, nicht? Eine Welt voller Illusionen!\n@c0@"
  en: "@aNera@bWe're inside a tree, and yet it's like being in the water. Just what you'd expect from a faerie's home, I suppose! Full of illusions.\n@c0@"
  es: "@aNera@bEstamos dentro de un árbol, ma parece como si estuviésemos dentro del acqua.\n㈡\n¡Supongo que es lo normal en las casas de las hadas: ilusiones por todas partes!\n@c0@"
  fr: "@aNera@bOn est à l'intérieur d'un arbre et pourtant, on a l'impression d'être dans l'eau. C'est ainsi que doivent être toutes les maisons des fées... pleines d'illusionsⓠ\n@c0@"
  it: "@aNera@bSiamo all'interno di un albero, eppure mi sembra di essere immersa nell'acqua! Beh, dopotutto questa è una casa fatata, no? È piena di illusioni!\n@c0@"
  ja: "@a@bフローラ「木の中なのに　水の中みたいで…\n\tさすが　妖精さんのお住まいですわね。\n\t幻想的ですわ。\n@c0@"
61:
  de: "@a%0%a001250@bDie Wände und Treppen sind alle ganz wässrig! Diese Feen sind schon erstaunliche Geschöpfe!\n@c0@"
  en: "@a%0%a001250@bThe walls and the stairs are all watery!\nFaeries are so amazing!\n@c0@"
  es: "@a%0%a001250@b¡Las paredes y las escaleras parecen de agua!\n¡Las hadas son fantásticas!\n@c0@"
  fr: "@a%0%a001250@bLes murs et les escaliers sont faits d'eauⓠ\nLes fées sont vraiment extraordinairesⓠ\n@c0@"
  it: "@a%0%a001250@bLe pareti e le scale sembrano fatte d'acqua!\nSono senza parole...\n@c0@"
  ja: "@a@b%a001250「カベも階段も　お水なのね。\n\t妖精さんって　すごい　すごい！\n@c0@"
62:
  de: "@a%0%a001240@bDieses Feenschloss ist ganz schön tief im Wald versteckt, was?\n@c0@"
  en: "@a%0%a001240@bThe Faerie Palace is pretty deep into the woods,\nisn't it?\n@c0@"
  es: "@a%0%a001240@bEl Palacio de las Hadas está en lo más profundo del bosque, ¿verdad?\n@c0@"
  fr: "@a%0%a001240@bAlors le palais des Fées est au fin fond des bois, c'est çaⓡ\n@c0@"
  it: "@a%0%a001240@bLa fata Lybrina ha detto che dobbiamo cercare un lago posto al centro di una foresta tra le montagne, non è vero?\n@c0@"
  ja: "@a@b%a001240「妖精の城って　ずいぶん\n\t森の奥深いところにあるんだね。\n@c0@"
63:
  de: "@a%0%a001250@bIch liebe es, in der Natur inmitten von Bäumen und Wasser zu sein. Das macht mich glücklich.\n@c0@"
  en: "@a%0%a001250@bI really like being out in nature, with trees and water all around. It just makes me feel good.\n@c0@"
  es: "@a%0%a001250@bMe gusta la naturaleza, con árboles y agua por todos lados. Me hace sentir bien.\n@c0@"
  fr: "@a%0%a001250@bJ'adore être dans la nature, entourée d'arbres et d'eau. Je m'y sens tellement bien.\n@c0@"
  it: "@a%0%a001250@bGuarda gli alberi, l'acqua...\nSto provando una sensazione bellissima! Mi sembra di essere una cosa sola con la natura intorno a me!\n@c0@"
  ja: "@a@b%a001250「わたしも　水とか木とか\n\t自然のある場所が　好き。\n\t元気を　もらえるの。\n@c0@"
64:
  de: "@aSancho@bDu bist wie deine Padre, no? Du hast keine Gefühl für Rhythmus und kannst auch nisst singen, si?\n@c0@"
  en: "@aSancho@bYou are like your father, sí? You no have the esense of rheethm and you no can esing, sí?\n@c0@"
  es: "@aSancho@bEres igual que tu padre, chamaco. No tienes sentido del ritmo y pues tampoco sabes cantar.\n@c0@"
  fr: "@aSancho@bT-Tu dois être comme ton père... Tu n'a pas le s-sens du rythme et t-tu ne sais pas chanter, noⓡ\n@c0@"
  it: "@aSancho@bChico, yo no ho mai estudiato musica en toda la mia vida...\n@c0@"
  ja: "@a@bサンチョ「パパスさまも　そうでしたが\n\t%a000090王も　歌やおどりの才能は\n\tさっぱり　でしょう？\n@c0@"
65:
  de: "@aSancho@bAber diese Horn wurde gemacht von die Feen. Das ist in Ordnung. Jeder kann es blasen.\n@c0@"
  en: "@aSancho@bBut thees horn, ees made by the faeries.\r\nEes okay. Anyone, they can make eet work.\n@c0@"
  es: "@aSancho@bPero este cuerno está hecho por las hadas.\nCualquiera puede hacerlo sonar.\n@c0@"
  fr: "@aSancho@bMais cette c-corne a été fabriquée par les f-fées, alors ça devrait aller. T-Tout le monde peut s'en\r\ns-servir.\n@c0@"
  it: "@aSancho@bNo ho idea de como se suona el corno fatato.\n¿Y tu?\n@c0@"
  ja: "@a@bサンチョ「でも　妖精のホルンは　さすが\n\t妖精がつくっただけあって　誰でも\n\t吹けるそうです。　良かったですね。\n@c0@"
66:
  de: "@a%0%a001240@bDie ganze Welt wünscht sich Frieden, nicht wahr? Ich werde mein Bestes geben, aber du musst an meiner Seite bleiben, Papa.\n@c0@"
  en: "@a%0%a001240@bEverybody wants peace, don't they? I'll do my best, as long as you stick by me, Dad.\n@c0@"
  es: "@a%0%a001240@bTodos quieren la paz, ¿no? Si tú estás conmigo, papá, yo haré todo lo que pueda.\n@c0@"
  fr: "@a%0%a001240@bTout le monde veut la paix, pas vraiⓡ Je ferai de mon mieux, du moment que tu restes avec moi, papa.\n@c0@"
  it: "@a%0%a001240@bLa pace tornerà a regnare! Ce la faremo, papà, non è vero? Noi ce la stiamo mettendo tutta per salvare il mondo... Speriamo che basti!\n@c0@"
  ja: "@a@b%a001240「みんな　平和がいいんだよね。\n\tボク　がんばるから\n\tお父さんも　いっしょに来てね。\n@c0@"
67:
  de: "@a%0%a001250@bFrieden muss ja nicht unbedingt eine Welt ohne Monster bedeuten, nicht? Hauptsache, alle Geschöpfe leben glücklich und harmonisch zusammen.\n@c0@"
  en: "@a%0%a001250@bPeace doesn't mean a world without monsters, right? Peace will be when we can all live together\nin harmony.\n@c0@"
  es: "@a%0%a001250@bLa paz no quiere decir un mundo sin monstruos, ¿no? En realidad quiere decir que todos podamos vivir juntos en armonía.\n@c0@"
  fr: "@a%0%a001250@bLa paix, ça ne veut pas dire que tous les monstres doivent disparaître, heinⓡ La paix, c'est pouvoir vivre tous ensemble, en harmonie.\n@c0@"
  it: "@a%0%a001250@bQuando il mondo sarà in pace, gli uomini impareranno che non devono avere paura dei mostri.\n@c0@"
  ja: "@a@b%a001250「魔物さんのいない世界を\n\t平和って言うんじゃないよね？\n\tみんなで暮らせるのが　平和よね。\n@c0@"
68:
  de: "@aSancho@bTs! Alle reden immer nur von Frieden! Aber es ist gar nisst so einfach, diese Frieden zu finden, no?\n@c0@"
  en: "@aSancho@bAnda! Everyone, they esay notheeng but peace, peace, peace. But ees no easy to find the peace, you know? \n@c0@"
  es: "@aSancho@b¡Chale! Todo el mundo dice nomás que paz, paz, paz. Pero, pues no es fácil encontrar la paz.\n@c0@"
  fr: "@aSancho@bAndaⓠ La p-paix... Tout le mundo n'a que ce mot\nà la b-bouche. Mais ce n'est pas si facile de rétablir la p-paixⓠ\n@c0@"
  it: "@aSancho@b¡Hombres y fatas vogliono la paz!\nEsta es una cosa muy buena.\nPurtroppos, no es facil ottenerla...\n@c0@"
  ja: "@a@bサンチョ「みなさん　平和に　平和に\n\tって言いますけどね。　そうするのは\n\tどんなに大変なことか……。\n@c0@"
69:
  de: "@aBianca@bWo diese Feder wohl herkommen mag... Ich hätte nicht gedacht, dass Feen Flügel haben.\n@c0@"
  en: "@aBianca@bWhere d'you think the feather came from?\r\nI didn't think faeries had wings.\n@c0@"
  es: "@aBianca@b¿De dónde crees que ha salido esa pluma?\nCreí que las hadas no tenían alas.\n@c0@"
  fr: "@aBianca@bD'où crois-tu qu'elle vienne cette plumeⓡ\nJe ne savais pas que les fées avaient des ailes.\n@c0@"
  it: "@aBianca@bDa dov'è sbucata quella penna?!\n@c0@"
  ja: "@a@bビアンカ「この羽　誰のかな？\n\t見たところ　妖精さんには\n\t羽が　はえてないみたいだし……。\n@c0@"
70:
  de: "@aNera@bAlso gibt es tatsächlich Feenfedern! Und ich dachte, die gäbe es nur im Märchen.\n@c0@"
  en: "@aNera@bSo faerie quills really do exist! I always thought they were just made up in books.\n@c0@"
  es: "@aNera@b¡Así que las plumas de hada existen de verdad! Sempre pensé que eran una fantasía de los libros.\n@c0@"
  fr: "@aNera@bDonc les plumes féeriques existent vraimentⓠ\nJ'ai toujours cru qu'elles n'existaient que dans\nles livres.\n@c0@"
  it: "@aNera@bAllora le penne fatate esistono davvero!\nHai visto quant'è bella?\n@c0@"
  ja: "@a@bフローラ「まあ　妖精の羽ペンって\n\t本当に　あるのね。　おとぎ話の\n\t中のものだと　思っていましたのに。\n@c0@"
71:
  de: "@a%0%a001240@bDiese Feder ist echt schön. Ich glaube, wenn ich so eine Feder hätte, würde mir sogar das Lernen Spaß machen!\n@c0@"
  en: "@a%0%a001240@bHey, that's pretty cool. I reckon I might even be able to knuckle down and study if I had something like this to write with!\n@c0@"
  es: "@a%0%a001240@b¡Eh!, eso está genial. ¡Creo que hasta yo me podría poner a estudiar si tuviese una cosa así para escribir!\n@c0@"
  fr: "@a%0%a001240@bHé, c'est plutôt chouette, ça. Je crois que je pourrais même me mettre à étudier si j'avais\nune plume comme ça pour écrireⓠ\n@c0@"
  it: "@a%0%a001240@bPapà, se mi regali quella penna fatata, mi metterò a studiare come un matto!\nDiventerò il primo della classe! Parola mia!\n@c0@"
  ja: "@a@b%a001240「うわ～　きれいだね。\n\tボク　こんなペンがあったら\n\tいくらでも　勉強できるんだけどな。\n@c0@"
72:
  de: "@a%0%a001250@bIch kann schon ein paar ganz schön schwierige Wörter buchstabieren, weißt du. Dann könnte ich ja auch mal diese Feder benutzen, oder?\n@c0@"
  en: "@a%0%a001250@bI can spell some really difficult words, you know,\nso you could let me use that quill sometime if\nyou wanted.\n@c0@"
  es: "@a%0%a001250@bSé escribir algunas palabras muy difíciles, ¿sabes? ¿Me dejarás usar esa pluma alguna vez?\n@c0@"
  fr: "@a%0%a001250@bJe sais écrire des mots vraiment durs, tu sais.\nAlors tu pourrais me la prêter de temps en\ntemps, si tu es d'accord.\n@c0@"
  it: "@a%0%a001250@bPapà, mi faresti usare la penna fatata ogni tanto?\nTi prometto che non la rovinerò!\n@c0@"
  ja: "@a@b%a001250「わたし　むずかしい文字も\n\tちゃんと　書けるの。\n\tだから　今度　使わせてね。\n@c0@"
73:
  de: "@aOtto@bWahrscheinlich hat man einer armen Kreatur einfach eine Feder herausgezogen... Wie grausig!\n@c0@"
  en: "@aTuppence@bThis must've been made by pulling a feather out of some poor creature's back. Dear me!\n@c0@"
  es: "@aAlazar@bParece que le han arrancando una pluma del lomo a alguna pobre criatura. ¡Qué horror!\n@c0@"
  fr: "@aInnocent@bIl a sûrement fallu prendre cette plume sur le dos d'une créature. Pauvre bêteⓠ\n@c0@"
  it: "@aSimon@bDa quale magico volatile proverrà la penna fatata?\nE soprattutto, gli avranno fatto male quando gliel'hanno strappata?\n@c0@"
  ja: "@a@bピピン「こ　これは　誰かの背中から\n\t羽を引っこ抜いて　つくったんですよ。\n\tそうに決まってます！　ぶるぶる……。\n@c0@"
74:
  de: "@aBianca@bVerstehe. Man braucht also die richtige Tinte, um mit dieser Feder zu schreiben.\n@c0@"
  en: "@aBianca@bI get it. You have to use the quill with the right kind of ink, then.\n@c0@"
  es: "@aBianca@bYa lo entiendo. Tienes que utilizar la pluma con la tinta correcta, ¿no?\n@c0@"
  fr: "@aBianca@bJ'ai compris. Il faut utiliser cette plume avec l'encre spéciale qui va avec.\n@c0@"
  it: "@aBianca@bHo capito.\r\nPer sfruttare al meglio le proprietà della penna fatata bisogna utilizzare un inchiostro particolare...\n@c0@"
  ja: "@a@bビアンカ「ふ～ん　なるほどね。\n\t羽ペンとインクを　あわせて使うのね。\n@c0@"
75:
  de: "@a%0%a001240@bOh! Ich kann's kaum abwarten, die Feder mal zu benutzen!\n@c0@"
  en: "@a%0%a001240@bOh! I can't wait to have a go at using this quill!\n@c0@"
  es: "@a%0%a001240@b¡Oh! ¡Qué ganas tengo de probar esa pluma!\n@c0@"
  fr: "@a%0%a001240@bOh, j'ai hâte d'essayer cette plumeⓠ\n@c0@"
  it: "@a%0%a001240@bNon vedo l'ora di provare quella penna!\n@c0@"
  ja: "@a@b%a001240「ボク　早く\n\tこの羽ペン　使ってみたいな！\n\tうずうず……。\n@c0@"
76:
  de: "@a%0%a001250@bÄhm, Papa, es ist vielleicht besser, wenn du %a001240 nicht mit der Feder schreiben lässt.\n@c0@"
  en: "@a%0%a001250@bUm, Dad, it might be better not to let %a001240 use the quill, you know.\n@c0@"
  es: "@a%0%a001250@bMmm, papá... Será mejor que no dejes a %a001240 usar la pluma.\n@c0@"
  fr: "@a%0%a001250@bHum, papa, je ne suis pas sûre que ce soit une bonne idée de prêter la plume à %a001240.\n@c0@"
  it: "@a%0%a001250@bPapà, al tuo posto non permetterei a %a001240 di usare la penna fatata...\n@c0@"
  ja: "@a@b%a001250「あのね　お父さん。\n\t%a001240には　羽ペンを\n\tかしてあげないほうが　いいと思うの。\n@c0@"
77:
  de: "@a%0%a001250@bEs ist ja nur, weil er normale Stifte immer kaputt macht. Keine Ahnung, wie er das schafft, aber die Feder würde das bestimmt nicht aushalten...\n@c0@"
  en: "@a%0%a001250@bIt's just, he's always breaking normal pens, and they're much stronger. I don't know how he does it!\n@c0@"
  es: "@a%0%a001250@bEs que siempre rompe las plumas normales, y eso que son mucho más fuertes. ¡No sé cómo se las arregla!\n@c0@"
  fr: "@a%0%a001250@bC'est juste qu'il casse toujours les plumes normales et elles sont plus résistantes que celle-là. Je sais pas comment il faitⓢ\n@c0@"
  it: "@a%0%a001250@bLui le penne le perde sempre!\nSarebbe un bel guaio se la smarrisse, non trovi?\n@c0@"
  ja: "@a@b%a001250「だって　ふつうに字を書くだけで\n\tもう　何本もペンを折ってるの。\n\t信じられないよね！\n@c0@"
78:
  de: "@aBianca@bDie Wände und Treppen sehen alle so wässrig aus, und trotzdem wird man nicht nass, wenn man sie berührt. Sehr seltsam...\n@c0@"
  en: "@aBianca@bThe walls and the stairs feel all watery, and\r\nyet you dun't get wet when you touch 'em.\r\nIt's all very weird.\n@c0@"
  es: "@aBianca@bLas paredes y las escaleras parecen de agua, pero si las tocas no te mojas.\nTodo esto es muy raro, ¿me entiendes?\n@c0@"
  fr: "@aBianca@bLes murs et les escaliers ont l'air d'être faits d'eau, mais on ne se mouille pas quand on les touche.\r\nC'est vraiment bizarre.\n@c0@"
  it: "@aBianca@bLe pareti e le scale sembrano fatte d'acqua, ma se le tocchi non ti bagni...\n@c0@"
  ja: "@a@bビアンカ「カベも階段も　さわると\n\t水の感触があるのに　ぬれないのよね。\n\tふしぎだわ。\n@c0@"
79:
  de: "@a%0%a001250@bÜberall ist Wasser, aber es ist überhaupt nicht kalt. Das ist doch komisch, oder? Na, vielleicht weil hier immer Frühling ist...\n@c0@"
  en: "@a%0%a001250@bThere's water everywhere, but it doesn't feel cold.\nI suppose that's because it's spring water. I mean, water in the spring!\n@c0@"
  es: "@a%0%a001250@bHay agua por todos lados, pero el tacto no es frío.\nSerá porque es agua manantial. Quiero decir, agua de manantial, claro.\n@c0@"
  fr: "@a%0%a001250@bIl y a de l'eau partout, mais il ne fait pas froid.\nC'est sûrement grâce au printemps magique des fées.\n@c0@"
  it: "@a%0%a001250@bQui è pieno d'acqua, eppure non c'è nemmeno un po' d'umidità!\n@c0@"
  ja: "@a@b%a001250「お水が　いっぱいなのに\n\t寒くないね。　そっか　春のお水だから\n\tつめたくないのね！\n@c0@"
80:
  de: "@aSancho@bAn diese schwebenden Stufen werde iss miss nie gewöhnen. Eine Treppe muss stabil sein, weißt du. Si. Stabil und solide!\n@c0@"
  en: "@aSancho@bI never get used to these floating estairs.\r\nThe estairs, they must be firm, you know.\r\nSí. Very, very firm.\n@c0@"
  es: "@aSancho@bNo me acostumbraré a estas escaleras flotantes.\nLas escaleras tienen que ser sólidas, nomás: retesólidas.\n@c0@"
  fr: "@aSancho@bJ-Je n'arrive pas à m'habituer à ces escaliers aquatiques. Oun escalier, ça doit être s-solide\r\nsous les p-pieds.\n@c0@"
  it: "@aSancho@bNo me fido de estas escalas fluttuantes...\r\n¡No me sembrano seguras!\n¿Y si no reggessero el nuestro peso, eh?\n@c0@"
  ja: "@a@bサンチョ「どうも　この　ふわふわと動く\n\t階段には　なれませんね。\n\tやはり　階段はしっかりしていないと！\n@c0@"
81:
  de: "@aGriselda@bDas ist also das Reich der Feen. Ein wenig abgelegen, aber es wäre der perfekte Ort für eine märchenhafte Schönheit wie mich.\n@c0@"
  en: "@aDebora@bSo this is the Realm of the Faeries. It's a bit remote, but it could be the perfect place for a faerie-like beauty such as myself.\n@c0@"
  es: "@aStefania@bAsí que esto es el Reino de las Hadas. Está un po' lontano, ma sería el lugar ideal para una bellezza fantástica como la mía.\n@c0@"
  fr: "@aPandora@bAlors c'est ici le royaume des Fées. C'est un peu perdu, mais ce serait l'endroit idéal pour une beauté féerique telle que moi.\n@c0@"
  it: "@aViola@bE così questo è il Regno delle Fate..\nÈ decisamente fuori mano, ma lo trovo terribilmente affascinante...\n@c0@"
  ja: "@a@bデボラ「ここが　妖精の村か……。\n\tずいぶん田舎だけど　妖精のような私には\n\tピッタリの場所かもね。\n@c0@"
82:
  de: "@aGriselda@bIch weiß noch, dass Nera sich früher nichts sehnlicher gewünscht hat, als einmal das Reich der Feen zu sehen.\n@c0@"
  en: "@aDebora@bI remember Nera used to say how much she'd like to visit the Realm of the Faeries.\n@c0@"
  es: "@aStefania@bRicordo que Nera solía decir que le gustaría visitar el Reino de las Hadas.\n@c0@"
  fr: "@aPandora@bJe me souviens que Nera disait toujours combien elle aimerait pouvoir visiter le royaume des Fées.\n@c0@"
  it: "@aViola@bNera ha sempre desiderato visitare il mondo delle fate, sai?\n@c0@"
  ja: "@a@bデボラ「そういえば　フローラが\n\t昔　妖精の世界に\n\t行ってみたいって　言ってたわね。\n@c0@"
83:
  de: "@aGriselda@bVielleicht sollten wir sie mal mitnehmen.\n@c0@"
  en: "@aDebora@bMaybe we should bring her one day.\n@c0@"
  es: "@aStefania@bPodríamos traerla algún giorno.\n@c0@"
  fr: "@aPandora@bPeut-être qu'on devrait l'amener ici, un jour.\n@c0@"
  it: "@aViola@bMi farebbe piacere portarla qui, un giorno...\n@c0@"
  ja: "@a@bデボラ「そのうち　連れてきてあげようかしら。\n@c0@"
84:
  de: "@aGriselda@bOb Zenithia wohl noch höher in die Lüfte steigen wird?\n@c0@"
  en: "@aDebora@bI wonder if Zenithia will float up any higher into\r\nthe sky.\n@c0@"
  es: "@aStefania@bMe pregunto si Zenithia subirá più alto en el cielo.\n@c0@"
  fr: "@aPandora@bJe me demande si Zénithia flottera un jour plus\r\nhaut dans le ciel.\n@c0@"
  it: "@aViola@bChissà se un giorno Zenithia tornerà a volare in alto come un tempo...\n@c0@"
  ja: "@a@bデボラ「天空城が　あれ以上\n\t天に　のぼるのかしら。\n@c0@"
85:
  de: "@aGriselda@bEs ist in solch schlechtem Zustand, dass ich Angst habe, es könnte zurück auf die Erde fallen.\n@c0@"
  en: "@aDebora@bIt's in such a state that I'm a bit worried it might come plummeting back down again.\n@c0@"
  es: "@aStefania@bEn el estado en el que está, me da miedo de que se vuelva a desplomar una altra volta.\n@c0@"
  fr: "@aPandora@bLe château est dans un tel état que je m'inquiète même qu'il puisse dégringoler une nouvelle fois.\n@c0@"
  it: "@aViola@bCosì com'è ora, ho paura che possa precipitare di nuovo al suolo da un momento all'altro...\n@c0@"
  ja: "@a@bデボラ「あんだけ　ボロボロだと\n\tまた　落ちるんじゃないかと\n\tそっちの方が　心配よ。\n@c0@"
86:
  de: "@aGriselda@bMit Papa hatte ich's nicht immer leicht. Und wie ich das so sehe, könnten diese Feen auch ganz schön schwierig sein.\n@c0@"
  en: "@aDebora@bPapa was often quite hard work, and I'd say these faeries could be the same way from what I've seen.\n@c0@"
  es: "@aStefania@bIl mio papino solía ser una persona difficile y, por lo que ha visto de las hadas, parece que ellas también.\n@c0@"
  fr: "@aPandora@bPapa était souvent dur à la tâche et d'après ce que j'ai vu, ces fées sont un peu pareilles.\n@c0@"
  it: "@aViola@bNemmeno le fate hanno libero accesso alla Reggia Fatata?! Certo che la regina Caramel deve tenerci parecchio alla sua privacy, eh?!\n@c0@"
  ja: "@a@bデボラ「パパも　なにかと\n\tうるさかったけど　妖精も\n\tいろいろと　めんどうそうね。\n@c0@"
87:
  de: "@aGriselda@bDas Schloss steht inmitten eines Sees.\n@c0@"
  en: "@aDebora@bThe palace itself is in the middle of a lake.\n@c0@"
  es: "@aStefania@bEl palacio está en mezzo de un lago.\n@c0@"
  fr: "@aPandora@bLe palais lui-même se trouve au milieu d'un lac.\n@c0@"
  it: "@aViola@bLa Reggia Fatata è in mezzo a un lago...\n@c0@"
  ja: "@a@bデボラ「妖精の城も　湖の上に\n\tあったのよね。\n@c0@"
88:
  de: "@aGriselda@bWasser scheint für diese Feen sehr wichtig zu sein.\n@c0@"
  en: "@aDebora@bThese faeries certainly seem keen on water.\n@c0@"
  es: "@aStefania@bParece que a esas hadas les gusta de verdad el acqua.\n@c0@"
  fr: "@aPandora@bCes fées aiment vraiment l'eau, on dirait.\n@c0@"
  it: "@aViola@bLe fate sembrano avere una vera passione per l'acqua.\n@c0@"
  ja: "@a@bデボラ「妖精って　水が好きなのかしら？\n@c0@"
89:
  de: "@aGriselda@bWelch eine hübsche Feder. Vielleicht könnte ich mir daraus ja einen Fächer machen lassen...\n@c0@"
  en: "@aDebora@bWhat a pretty feather. I wouldn't mind having a fan made out of it.\n@c0@"
  es: "@aStefania@bQué bella piuma. Me gustaría tener un abanico hecho con algunas de ellas.\n@c0@"
  fr: "@aPandora@bQuelle jolie plume. J'aimerais assez posséder un éventail qui soit fait de ça.\n@c0@"
  it: "@aViola@bMa che bella penna!\nCaro, vedi di procurarmene un'altra ventina, così potrai farmici un meraviglioso ventaglio fatato...\n@c0@"
  ja: "@a@bデボラ「ずいぶん　キレイな羽ね。\n\tこの羽で　扇を　作らせたいわね。\n@c0@"
90:
  de: "@aGriselda@bIm Sommer ist es bestimmt sehr angenehm hier mit all dem Wasser.\n@c0@"
  en: "@aDebora@bIt's probably nice and cool here in summer with all this water around.\n@c0@"
  es: "@aStefania@bCon tanta acqua, seguro que en verano se está fresco aquí.\n@c0@"
  fr: "@aPandora@bIl doit probablement faire agréablement frais ici, avec toute l'eau qu'il y a autour.\n@c0@"
  it: "@aViola@bAccidenti, quanta acqua!\nDi certo non si corre il rischio di morire di sete in questo posto!\n@c0@"
  ja: "@a@bデボラ「こうして　水に囲まれてると\n\t夏は　涼しそうね。\n@c0@"
