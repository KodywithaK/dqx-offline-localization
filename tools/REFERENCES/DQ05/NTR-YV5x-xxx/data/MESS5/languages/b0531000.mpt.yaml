0:
  de: "@aBianca@bKurz nach unserer Hochzeit waren wir schon einmal hier. Erinnerst du dich, %a000090?\n@c0@"
  en: "@aBianca@bWe come here not long after we was married, eh, %a000090? You remember, right?\n@c0@"
  es: "@aBianca@bAquí vinimos no mucho después de casarnos, ¿sabes, %a000090? Te acuerdas, ¿verdad?\n@c0@"
  fr: "@aBianca@bOn est venus ici peu de temps après notre mariage, hein, %a000090ⓡ Tu t'en souviensⓡ\n@c0@"
  it: "@aBianca@b%0%a000090, ricordi?\nSiamo venuti qui poco dopo esserci sposati...\n@c0@"
  ja: "@a@bビアンカ「%a000090とは　結婚して\n\tすぐの頃に　ここに来たわよね？\n\tえ？　おぼえてないの？\n@c0@"
1:
  de: "@aNera@bDamals fand ich die Hitze unerträglich, aber jetzt macht es mir nicht mehr so viel aus.\n@c0@"
  en: "@aNera@bI found the heat here almost intolerable before, but it's not too bad this time.\n@c0@"
  es: "@aNera@bAntes me parecía que el calor aquí era insopportabile, ma esta vez no está tan mal.\n@c0@"
  fr: "@aNera@bLa dernière fois, j'avais trouvé la chaleur presque insupportable mais cette fois, ça va mieux.\n@c0@"
  it: "@aNera@bLa prima volta che venimmo qui il caldo mi sembrava insopportabile, ma ora non mi sembra tanto male.\n@c0@"
  ja: "@a@bフローラ「昔はこの暑さが　つらかったけど\n\t今は　それほど　つらく感じませんわ。\n@c0@"
2:
  de: "@aNera@bIch bin wohl viel zu glücklich, wieder mit euch allen vereint zu sein, als dass die Sonne mir etwas anhaben könnte.\n@c0@"
  en: "@aNera@bMy happiness at being with you all again is obviously taking my mind off it.\n@c0@"
  es: "@aNera@bSembra que la mia felicità por estar contigo otra vez me hace ignorarlo.\n@c0@"
  fr: "@aNera@bJe suppose que je suis si heureuse d'être de nouveau avec vous tous que je n'y pense même pas.\n@c0@"
  it: "@aNera@bSi vede che a furia di viaggiare con te sono diventata più resistente a tutto, anche alle alte temperature! Ih ih ih!\n@c0@"
  ja: "@a@bフローラ「きっと　あなたたちと\n\tいっしょにいられる喜びのほうが\n\t大きいからですわね。\n@c0@"
3:
  de: "@a%0%a001240@bEs ist ganz schön anstrengend, im Sand zu laufen. Meine Füße tun weh.\n@c0@"
  en: "@a%0%a001240@bIt's hard work walking on the sand.\nMy feet are killing me.\n@c0@"
  es: "@a%0%a001240@bCuesta mucho andar por la arena.\nLos pies me están matando.\n@c0@"
  fr: "@a%0%a001240@bC'est dur de marcher dans le sable.\nJ'ai les pieds en compote.\n@c0@"
  it: "@a%0%a001240@bCamminare sulla sabbia ardente è faticoso!\nI piedi mi fanno un male cane!\n@c0@"
  ja: "@a@b%a001240「砂の上って　歩くのが\n\t大変なんだね。\n\tもう　足が　クタクタだよ。\n@c0@"
4:
  de: "@a%0%a001240@bWas ist denn das? Ein riesiges Schloss mitten in der Wüste? Weißt du etwas darüber, Papa?\n@c0@"
  en: "@a%0%a001240@bWhat's such a huge castle doing stuck out here in the middle of the desert? Do you know, Dad?\n@c0@"
  es: "@a%0%a001240@b¿Qué hace un castillo tan enorme ahí en medio del desierto? ¿Lo sabes, papá?\n@c0@"
  fr: "@a%0%a001240@bQu'est-ce qu'un château aussi immense fait en plein milieu du désertⓡ Tu le sais, toi, papaⓡ\n@c0@"
  it: "@a%0%a001240@bPapà, cosa ci fa quell'enorme castello in mezzo al deserto?\n@c0@"
  ja: "@a@b%a001240「なんで　砂漠の真ん中に\n\tこんな大きな　お城があるんだろ？\n\tお父さん　知ってたの？\n@c0@"
5:
  de: "@a%0%a001250@bWenn ich nicht bald in den Schatten komme, werde ich noch verschrumpeln und zugrunde gehen.\n@c0@"
  en: "@a%0%a001250@bI'm worried I might shrivel up and die if I don't find some shade soon.\n@c0@"
  es: "@a%0%a001250@bCreo que me desecaré y moriré si no encuentro pronto una sombra.\n@c0@"
  fr: "@a%0%a001250@bSi on ne trouve pas vite de l'ombre, j'ai peur de me ratatiner complètement et de finir par mourir.\n@c0@"
  it: "@a%0%a001250@bAccidenti che caldo!\nNon so che darei per riposare un po' all'ombra!\n@c0@"
  ja: "@a@b%a001250「日かげに　入らないと\n\tひからびて　死んじゃいそう……。\n@c0@"
6:
  de: "@a%0%a001250@bMir würde es viel besser gehen, wenn ich im Wagen warten könnte. Darf ich, Papa? Bitte!\n@c0@"
  en: "@a%0%a001250@bI'd be much happier if I could wait in the wagon.\nCan I, Dad? Please!\n@c0@"
  es: "@a%0%a001250@bSería mucho más feliz si pudiera esperar en el carromato. ¿Me dejas, papi? ¡Por favor!\n@c0@"
  fr: "@a%0%a001250@bJe serais bien mieux à attendre dans le chariot.\nJe peux y aller, papaⓡ S'il te plaîtⓠ\n@c0@"
  it: "@a%0%a001250@bPapà, posso aspettare nel carro?\n@c0@"
  ja: "@a@b%a001250「わたし\n\t馬車の中で　待っていたいな。\n\tダメ？　お父さん。\n@c0@"
7:
  de: "@aSancho@bWir sollten langsam in die Schatten gehen, no? Deine Onkel Sancho verträgt solss eine Hitze einfach nisst mehr.\n@c0@"
  en: "@aSancho@bYou no theenk we eshould find esome eshade?\r\nYour Uncle Sancho, he, he can no estand thees heat much longer.\n@c0@"
  es: "@aSancho@b¿No crees que deberíamos encontrar una sombra?\r\nNi modo que tu tito Sancho soporte más el calor.\n@c0@"
  fr: "@aSancho@bTu ne crois p-p-pas qu'on devrait chercher oun peu d'ombreⓡ Tonton Sancho ne va pas p-p-pouvoir supporter longtemps cette chaleur.\n@c0@"
  it: "@aSancho@b¡Ay, que calor!\n¿Chico, no piensi que dovremmo trovare un pocos de ombras?\n@c0@"
  ja: "@a@bサンチョ「と　とにかく　どこか\n\t日カゲに入りましょう。\n\tでないと　たおれちまいます！\n@c0@"
8:
  de: "@aSancho@bWas gäbe iss für ein bisschen kaltes Wasser? Iss würde sofort ins kalte Meer springen. Und zu eine kleine Siesta würde iss bestimmt auch nisst No sagen!\n@c0@"
  en: "@aSancho@bI would die for esome cold water now.\r\nI would dive eento the cold esea now.\r\nI would definitely esay sí to the siesta now!\n@c0@"
  es: "@aSancho@bMataría por un trago de agua fría.\r\nAhorita sería capaz de meterme en el mar helado.\r\n¡Y me apuntaría a una siesta ya mismito!\n@c0@"
  fr: "@aSancho@bJe serais p-prêt à mourir pour oun verre d'eau fraîche. Je voudrais p-p-piquer oune tête dans la mer. Et je f-f-ferais bien la siesta tout de suiteⓠ\n@c0@"
  it: "@aSancho@b¡Que calor infernal!\n¿Chico, que ne diresti de reposarce un poco all'ombras?\n@c0@"
  ja: "@a@bサンチョ「ああ　冷たい水が飲みたい。\n\t頭から　海に飛び込みたい。\n\t木かげで　昼寝がしたい……。\n@c0@"
9:
  de: "@aSancho@bAls iss mit Señor Ludwig unterwegs war, hat er miss nisst zu solchen Orten geschleppt. Das ist zu viel für miss!\n@c0@"
  en: "@aSancho@bWhen I travel weeth señor Pankraz, he no breeng me to esuch a place like thees. Ees too much!\n@c0@"
  es: "@aSancho@bEn mis viajes con el señor Teudis, nunca me llevó a un lugar así. ¡Esto es demasiado!\n@c0@"
  fr: "@aSancho@bQuand je voyageais avec le señor Petros, il ne m'emmenait p-p-pas dans des endroits p-pareils. C'est trop dur, làⓠ\n@c0@"
  it: "@aSancho@b¡Cuando ho viaggiato con el señor Russel non ero mai estato en un luego tanto caliente!\n@c0@"
  ja: "@a@bサンチョ「パパスさまとの旅では\n\tこんなところは　通りませんでしたぞ。\n\tいやはや　本当にきびしい場所ですな。\n@c0@"
10:
  de: "@aOtto@bEs ist wirklich ausg'sprochen heiß hier. Was würd' ich drum geben, jetzt im Schnee auf dem Ötzberg zu stehen!\n@c0@"
  en: "@aTuppence@bIt really is unbearably hot here. What I'd give to be standing in the snow on Mt Batten!\n@c0@"
  es: "@aAlazar@bAquí hace un calor insoportable. ¡Lo que daría ahora por estar en medio de la nieve del Monte Habs!\n@c0@"
  fr: "@aInnocent@bLa chaleur est vraiment insupportable, ici.\r\nJe donnerais n'importe quoi pour me retrouver\r\ndans la neige sur le mont Técarlo.\n@c0@"
  it: "@aSimon@bQuesto caldo mi sta facendo impazzire!\nNon so che darei per fare una bella doccia fresca...\n@c0@"
  ja: "@a@bピピン「うう　暑い……。\n\tここに来ると　チゾットの雪が\n\t恋しくなりますね。\n@c0@"
11:
  de: "@aOtto@bAua! Ich hab Sand in die Augen bekommen! Tut mir leid, aber wir müssen uns später unterhalten.\n@c0@"
  en: "@aTuppence@bOuch! I have sand in my eyes!\r\nI'm afraid we'll have to chat later.\n@c0@"
  es: "@aAlazar@b¡Aaay! ¡Se me ha metido arena en los ojos!\r\nMe temo que la charla tendrá que esperar.\n@c0@"
  fr: "@aInnocent@bOuilleⓠ J'ai du sable dans les yeuxⓠ\nDésolé, mais on parlera plus tard.\n@c0@"
  it: "@aSimon@bSolo la sabbia negli occhi ci mancava!\nMaestà, le dispiace se parliamo più tardi, eh?\n@c0@"
  ja: "@a@bピピン「うわっ　いたた！\n\t砂が　目に入って……\n\tすみません　お話はあとで。\n@c0@"
12:
  de: "@a%0%a001240@bIch frage mich, wo das ganze Wasser herkommt, wir sind doch mitten in der Wüste. Aber es ist trotzdem ein willkommener Anblick.\n@c0@"
  en: "@a%0%a001240@bI wonder where the water can be coming from,\nall the way out here in the desert. It's a welcome sight, though.\n@c0@"
  es: "@a%0%a001240@bMe pregunto de dónde saldrá el agua que hay en el desierto. Da igual, es bienvenida.\n@c0@"
  fr: "@a%0%a001240@bJe me demande d'où vient cette eau pour parvenir jusqu'au beau milieu de ce désert. Quoi qu'il en soit, elle est la bienvenue.\n@c0@"
  it: "@a%0%a001240@bAcqua nel deserto?!\nQuesta sì che è una bella sorpresa!\nFinalmente un po' di refrigerio...\n@c0@"
  ja: "@a@b%a001240「砂漠なのに　どこから\n\t水が　わきでてるんだろう。\n\tでも　きれいだね！　お水！\n@c0@"
13:
  de: "@a%0%a001250@bIch hab schon mal was über Oasen gelesen, und das hier sieht ganz wie eine aus.\n㈡\nEine Oase ist nämlich ein fruchtbarer, grüner Fleck mitten in der Wüste, weißt du.\n@c0@"
  en: "@a%0%a001250@bI've read about oases, and that definitely looks like one. An oasis is an area of greenery in the middle of a desert, you see.\n@c0@"
  es: "@a%0%a001250@bHe leído cosas sobre los oasis y este tiene toda la pinta de ser uno. Un oasis es un área de verdor en pleno desierto, ya sabes.\n@c0@"
  fr: "@a%0%a001250@bJ'ai lu des livres à propos des oasis, et ça, ça y ressemble très fort. En fait, une oasis est un îlot\nde verdure au beau milieu du désert.\n@c0@"
  it: "@a%0%a001250@bChe bellezza! Un'oasi!\nLe oasi sono aree fertili che si trovano ogni tanto nei deserti: l'ho imparato a scuola!\n@c0@"
  ja: "@a@b%a001250「あれ　オアシスでしょ？\n\t勉強したことがあるの。\n\t砂漠にある緑が　オアシスだって。\n@c0@"
14:
  de: "@a%0%a001240@bPuh! Welch eine Erleichterung, nicht mehr in der Sonne zu sein!\n@c0@"
  en: "@a%0%a001240@bAaah! What a relief to be out of the sun.\n@c0@"
  es: "@a%0%a001240@b¡Aaah! ¡Qué alivio estar protegido del sol!\n@c0@"
  fr: "@a%0%a001240@bAaahⓠ Comme c'est bon de ne plus être au soleil.\n@c0@"
  it: "@a%0%a001240@bOh, che sollievo!\nFinalmente un po' di fresco!\n@c0@"
  ja: "@a@b%a001240「わ～い！\n\t日カゲって　すずしいね！\n@c0@"
15:
  de: "@a%0%a001250@bIch wünschte, wir müssten nie mehr wieder nach draußen gehen.\n@c0@"
  en: "@a%0%a001250@bI wish we didn't have to go outside again.\n@c0@"
  es: "@a%0%a001250@bOjalá no tuviéramos que volver a salir.\n@c0@"
  fr: "@a%0%a001250@bSi seulement on pouvait ne pas avoir à ressortir.\n@c0@"
  it: "@a%0%a001250@bVorrei tanto non dover tornare sotto il sole cocente...\n@c0@"
  ja: "@a@b%a001250「もう　お外に\n\t出たくないな……。\n@c0@"
16:
  de: "@aOtto@bEs gibt eine Menge Sand hier drinnen, net wahr? Aber an solch einem Ort bleibt das wohl net aus...\n@c0@"
  en: "@aTuppence@bThere's a fair amount of sand in here, isn't there?\r\nI suppose it can't be helped in a place like this.\n@c0@"
  es: "@aAlazar@bAquí dentro hay una buena cantidad de arena, ¿verdad? Supongo que es inevitable en un lugar así.\n@c0@"
  fr: "@aInnocent@bIl y a pas mal de sable, ici, nonⓡ Je suppose que c'est inévitable dans un endroit pareil.\n@c0@"
  it: "@aSimon@bCredo di aver mangiato mezza tonnellata di sabbia, da quando sono entrato in questo dannatissimo deserto!\n@c0@"
  ja: "@a@bピピン「やっぱり　こういう場所だと\n\tお店の中にも　けっこう\n\t砂が　入っちゃうみたいですね。\n@c0@"
17:
  de: "@a%0%a001240@bIch war genauso glücklich wie er, als du wieder da warst, Papa.\n@c0@"
  en: "@a%0%a001240@bI was happy just like him when you came home\nagain, Dad.\n@c0@"
  es: "@a%0%a001240@bYo estaba tan feliz como él cuando regresaste\na casa, papá.\n@c0@"
  fr: "@a%0%a001240@bJ'étais aussi heureux que lui quand tu es revenu\nà la maison, papa.\n@c0@"
  it: "@a%0%a001240@bSai, papà?\nAnch'io sono stato tanto felice quando ti abbiamo ritrovato!\n@c0@"
  ja: "@a@b%a001240「ボクもね\n\tお父さんが　帰ってきたとき\n\tすっごく　うれしかったよ！\n@c0@"
18:
  de: "@a%0%a001250@bDu wirst uns nie wieder alleine lassen, nicht wahr, Papa?\n@c0@"
  en: "@a%0%a001250@bYou won't go missing again, will you, Dad?\n@c0@"
  es: "@a%0%a001250@bYa no volverás a marcharte, ¿verdad, papi?\n@c0@"
  fr: "@a%0%a001250@bTu ne vas pas disparaître à nouveau, hein, papaⓡ\n@c0@"
  it: "@a%0%a001250@bPapà, promettimi che non ti trasformerai più in statua!\n@c0@"
  ja: "@a@b%a001250「お父さん…\n\tもう　いなくなっちゃイヤよ。\n@c0@"
19:
  de: "@aSancho@bSi, si. Es ist das Beste, wenn die ganze Familia zusammen bleibt. Si, si... si... (Schluchz)\n@c0@"
  en: "@aSancho@bSí, sí. Ees the best when the whole family, they are together. Sí, sí...sí... (sob)\n@c0@"
  es: "@aSancho@bSí, sí. Es padrísimo que toda la familia esté unida. Sí, sí... sí... (snif)\n@c0@"
  fr: "@aSancho@bSi, si. C'est mieux quand t-t-toute la famille est réounie. Si, si... si... (snif)\n@c0@"
  it: "@aSancho@b¡Es bueno cuando la familia es riunita!\nYo... Yo me commuovos...\n¡Sob!\n@c0@"
  ja: "@a@bサンチョ「ええ　ええ。\n\t家族そろって暮らすのが\n\tいちばんですとも。　うっうっ……。\n@c0@"
20:
  de: "@aOtto@bEin Badeort? Wie nett. Vielleicht bringe ich meine alte Mutter einmal hierher.\n@c0@"
  en: "@aTuppence@bA spa town? How nice. I should take my old mother to a spa one of these days.\n@c0@"
  es: "@aAlazar@b¿Una ciudad balneario? Qué bonito. Un día de estos tengo que llevar a mi madre a un balneario.\n@c0@"
  fr: "@aInnocent@bUne ville thermaleⓡ C'est chouette. Je devrais y emmener ma vieille mère, un de ces jours.\n@c0@"
  it: "@aSimon@bUna cittadina termale? Uhm, potrei trascorrerci una vacanza, quando quest'avventura sarà finita.\r\nLì ci saranno di certo tante belle turiste...\n@c0@"
  ja: "@a@bピピン「温泉かあ……。\n\tボクもいつか　母さんを連れて\n\t行きたいなあ。\n@c0@"
21:
  de: "@a%0%a001240@bIhre Jugend ist verblasst... Heißt das, dass sie im selben Alter ist wie Sancho?\n@c0@"
  en: "@a%0%a001240@bHer youth's fading away... Does that make her about the same age as Sancho, then?\n@c0@"
  es: "@a%0%a001240@bSu juventud es un recuerdo lejano... ¿Quiere eso decir que tiene la misma edad que Sancho?\n@c0@"
  fr: "@a%0%a001240@bSa jeunesse est un lointain souvenir...\nEst-ce que ça veut dire qu'elle a presque\nle même âge que Sancho, alorsⓡ\n@c0@"
  it: "@a%0%a001240@bForse non è più tanto giovane, ma lo zio Sancho è molto più vecchio di lei!\n@c0@"
  ja: "@a@b%a001240「えっと　あの人\n\t若くないってことは……\n\tサンチョと同じぐらいの年なの？\n@c0@"
22:
  de: "@aOtto@bAch, wenn ich dieser bezaubernden Dame nur begegnet wäre, bevor das Alter seine Spuren hinterlassen hat...\n@c0@"
  en: "@aTuppence@bIf only I'd been able to meet that lovely lady before the years had taken their toll.\n@c0@"
  es: "@aAlazar@bOjalá hubiera podido conocer a esa encantadora dama antes de que los años la echaran a perder.\n@c0@"
  fr: "@aInnocent@bSi seulement j'avais pu faire la connaissance de cette charmante dame avant que le temps n'ait\r\nfait son œuvre.\n@c0@"
  it: "@aSimon@bChissà quanto dev'essere stata bella in gioventù questa signora...\r\nBeh, però è ancora una donna attraente, no?\n@c0@"
  ja: "@a@bピピン「あの人とは　もう少し\n\t早く　会いたかったなあ……。\n@c0@"
23:
  de: "@aOtto@bIch finde es immer wieder faszinierend, eine Frau mit Vergangenheit kennenzulernen.\n@c0@"
  en: "@aTuppence@bIt's always rather fascinating to meet a woman with a past.\n@c0@"
  es: "@aAlazar@bSiempre es fascinante conocer a una mujer con pasado.\n@c0@"
  fr: "@aInnocent@bC'est toujours assez fascinant de rencontrer une femme qui a vécu plein de choses.\n@c0@"
  it: "@aSimon@bNon sarà più una giovincella, ma questa donna ha ancora il suo fascino.\nÈ proprio vero che la bellezza non ha età!\n@c0@"
  ja: "@a@bピピン「過去のある女性って\n\tなんだか　ひかれちゃいますよね。\n@c0@"
24:
  de: "@a%0%a001250@bIch liebe es, wie der Himmel sich verfärbt, wenn die Sonne auf- oder untergeht. Das ist so schön!\n@c0@"
  en: "@a%0%a001250@bI love seeing the colours of the sky change at sunset and sunrise. It's so pretty!\n@c0@"
  es: "@a%0%a001250@bMe encanta ver cómo cambia el color del cielo al amanecer y al anochecer. ¡Es precioso!\n@c0@"
  fr: "@a%0%a001250@bJ'adore voir les couleurs du ciel changer, au lever et au coucher du soleil. C'est tellement joliⓠ\n@c0@"
  it: "@a%0%a001250@bAdoro guardare il cielo che cambia colore all'alba e al tramonto...\nÈ uno spettacolo stupendo!\n@c0@"
  ja: "@a@b%a001250「わたし　夜明けとか\n\t夕暮れの　お空の色って大好き。\n\tいろんな色がまざって　きれいなの！\n@c0@"
25:
  de: "@a%0%a001240@bNur weil ich das Zenithiaschwert ausrüsten kann, soll ich der legendäre Held sein? Irgendwie verstehe ich das alles nicht ganz...\n@c0@"
  en: "@a%0%a001240@bI managed to equip the Zenithian Sword, so does\nthat make me the hero? I'm a bit confused. I don't really get it.\n@c0@"
  es: "@a%0%a001240@bHe conseguido equiparme con la Espada de Zenithia, ¿significa eso que soy el héroe? Estoy un poco confuso. No lo entiendo muy bien.\n@c0@"
  fr: "@a%0%a001240@bJ'ai réussi à m'équiper de l'Épée zénithienne,\nest-ce que ça veut dire que je suis le hérosⓡ\nJe ne suis pas sûr de bien tout comprendre.\n@c0@"
  it: "@a%0%a001240@bSono riuscito ad aggiungere al mio equipaggiamento la Spada Zenithiana... Allora io sono l'Eroe Leggendario? Non l'ho ancora capito...\n@c0@"
  ja: "@a@b%a001240「天空のつるぎを\n\tそうびできたんだから　ボクが勇者？\n\tどうなんだろ？　よくわかんないよね。\n@c0@"
26:
  de: "@aBianca@bSchon komisch, dass die Leute plötzlich wieder die alten Legenden rauskramen.\n@c0@"
  en: "@aBianca@bMakes you wonder why people are sayin' that all of a sudden, eh? Rumours are funny old things.\n@c0@"
  es: "@aBianca@bSe pregunta uno por qué la gente dirá eso de repente, ¿sabes? Los rumores son algo curioso.\n@c0@"
  fr: "@aBianca@bOn se demande pourquoi les gens sortent ce genre\nde choses comme ça, d'un seul coup. C'est bizarre, les rumeurs, nonⓡ\n@c0@"
  it: "@aBianca@bL'Eroe Leggendario tornerà qui a Faraonia?\nUhm, chissà, potrebbe avere ragione...\n@c0@"
  ja: "@a@bビアンカ「いったい　どこから\n\tそんなウワサが流れるのかしら。\n\t人のウワサって　こわいわね。\n@c0@"
27:
  de: "@a%0%a001250@bDer Mann hatte eine sehr schöne Stimme! Deine ist auch gut, Papa, aber das hier war schon etwas Besonderes.\n@c0@"
  en: "@a%0%a001250@bThat man had such a nice voice! Yours is nice too, Dad, but his is something really special.\n@c0@"
  es: "@a%0%a001250@b¡Ese hombre tenía una voz muy bonita!\nLa tuya también es bonita, papi, pero la suya tiene algo especial.\n@c0@"
  fr: "@a%0%a001250@bCe monsieur avait une si jolie voixⓠ Toi aussi,\ntu as une belle voix, papa, mais la sienne est vraiment spéciale.\n@c0@"
  it: "@a%0%a001250@bQuell'uomo ha una voce bellissima!\nÈ bella quasi quanto la tua, papà!\n@c0@"
  ja: "@a@b%a001250「詩人さんって　いい声ね。\n\tお父さんの声も　いいけど\n\tあの人には　ちょっと負けるかな。\n@c0@"
28:
  de: "@aOtto@bMag sein, dass die Zeit des legendären Helden angebrochen ist, aber wird auch jemals die Zeit von Otto dem Großen kommen?\n@c0@"
  en: "@aTuppence@bThe time of the legendary hero may be upon us now, but I wonder if the time of Tuppence will ever come to pass.\n@c0@"
  es: "@aAlazar@bPuede que ya haya llegado la hora del héroe legendario, pero me pregunto si llegará alguna vez la hora de Alazar.\n@c0@"
  fr: "@aInnocent@bPeut-être que le temps du héros légendaire est enfin venu, mais je me demande si celui d'Innocent arrivera un jour.\n@c0@"
  it: "@aSimon@bTutti parlano dell'Eroe Leggendario.\nÈ giusto, lui è una persona importante.\n@c0@"
  ja: "@a@bピピン「今は　勇者さまの時代だけど\n\tそのうち　ボクの時代が\n\tくるかも知れませんよ？\n@c0@"
29:
  de: "@aOtto@bImmerhin bin ich der auserwählte Soldat, der den Helden auf seiner Mission begleitet. Da ist ein bisschen Anerkennung doch wohl nicht zu viel verlangt!\n@c0@"
  en: "@aTuppence@bI mean, I am the chosen soldier accompanying the hero on his quest, after all. Surely that deserves some recognition.\n@c0@"
  es: "@aAlazar@bDespués de todo, soy el soldado elegido para acompañar al héroe en su misión. Digo yo que eso merece algún reconocimiento.\n@c0@"
  fr: "@aInnocent@bC'est vrai, je suis le soldat élu pour accompagner le héros dans sa quête, après tout. Ça mérite quand même un peu de reconnaissance.\n@c0@"
  it: "@aSimon@bPerò vorrei che qualcuno cantasse anche le gesta di Simon, il prode soldato che accompagna re %a000090 nella sua incredibile avventura!\n@c0@"
  ja: "@a@bピピン「なにしろ　勇者さまの\n\tお供に　えらばれた兵士なんて\n\tボクぐらいですもん！\n@c0@"
30:
  de: "@a%0%a001240@bAlso hatte er seinen Hut auch bei eurer letzten Begegnung vergessen?\n㈡\n Oh Mann, man sollte meinen, dass er es nach all den Jahren besser wissen müsste!\n@c0@"
  en: "@a%0%a001240@bSo he'd forgotten his hat the last time you saw\nhim too? You'd think he'd know better after all\nthese years!\n@c0@"
  es: "@a%0%a001240@b¿También se olvidó el sombrero la última vez que le viste? ¡Pues ya podría haber aprendido la lección después de todos estos años!\n@c0@"
  fr: "@a%0%a001240@bAlors il avait déjà oublié son chapeau la dernière fois que tu l'as vuⓡ Depuis le temps, il devrait y penserⓠ\n@c0@"
  it: "@a%0%a001240@bA giudicare da come l'ha detto, questa non è la prima volta che dimentica il cappello.\nCerta gente è proprio distratta!\n@c0@"
  ja: "@a@b%a001240「えっ？　あのおじさん\n\t前に会ったときも　ぼうし忘れてたの？\n\tすごいな　なん年　忘れてるんだろ。\n@c0@"
31:
  de: "@aOtto@bPuh, es gibt ganz schön viele schusselige Leute, net wahr? Ich bin überhaupt net... ähm... schusselig...\n@c0@"
  en: "@aTuppence@bThere are some scatterbrained folk about, aren't there? I'm not at all...um...scatterbrained, of course.\n@c0@"
  es: "@aAlazar@bPor aquí hay gente muy alocada, ¿no? Naturalmente, yo no soy nada... esto... alocado.\n@c0@"
  fr: "@aInnocent@bIl y a vraiment des gens distraits, nonⓡ\nMoi, bien sûr, je ne suis pas... hum, distrait du tout.\n@c0@"
  it: "@aSimon@bCerto che ce n'è di gente distratta in giro, eh?\r\nE pensare che...\nUhm, dove ho messo le chiavi di casa...?\n@c0@"
  ja: "@a@bピピン「ドジな人って　どこにでも\n\tいるもんですよね。\n\tボ　ボクは　あまり　ドジしませんよ！\n@c0@"
32:
  de: "@a%0%a001250@bIn meinen Büchern habe ich Bilder von Wüstenrosen gesehen. Sie sind sehr hübsch.\n@c0@"
  en: "@a%0%a001250@bI've seen pictures of desert roses in books before. They're really pretty.\n@c0@"
  es: "@a%0%a001250@bHabía visto imágenes de rosas del desierto\nen los libros. Son preciosas.\n@c0@"
  fr: "@a%0%a001250@bJ'ai déjà vu des images de roses des sables\ndans les livres. Elles sont vraiment jolies.\n@c0@"
  it: "@a%0%a001250@bHo visto alcune immagini delle rose del deserto in un libro, e sono rimasta a bocca aperta per quanto sono belle...\n@c0@"
  ja: "@a@b%a001250「さばくのバラは\n\tご本でも　見たことがあるわ。\n\tとっても　キレイなのよ。\n@c0@"
33:
  de: "@a%0%a001240@bÄhm... Soll das etwa heißen, dass Mama eine Zenithianerin ist?\n@c0@"
  en: "@a%0%a001240@bUm... So does that mean Mum's a Zenithian?\n@c0@"
  es: "@a%0%a001240@bEsto... ¿Significa eso que mamá es de Zenithia?\n@c0@"
  fr: "@a%0%a001240@bHum... Alors, est-ce que ça veut dire que maman\nest une Zénithienneⓡ\n@c0@"
  it: "@a%0%a001240@bMa allora questo vuol dire che la mia mamma è una Zenithiana?\n@c0@"
  ja: "@a@b%a001240「えっと…　ということは\n\tお母さんって　天空人だったのかな？\n@c0@"
34:
  de: "@aBianca@bIch bin mir sicher, dass Vater und Mutter ganz normale Leute waren. Vielleicht taucht der Held einfach aus dem Nichts auf.\n@c0@"
  en: "@aBianca@bI'm sure my mum and dad were just regular folk, though. Maybe the hero just comes out of nowhere.\n@c0@"
  es: "@aBianca@bPero estoy segura de que mi madre y mi padre eran gente normal. Puede que el héroe haya salido de la nada, ¿sabes?\n@c0@"
  fr: "@aBianca@bPourtant, je suis persuadée que maman et papa étaient des gens tout à fait normaux. Peut-être\r\nque le héros sort de nulle part, en fait.\n@c0@"
  it: "@aBianca@bSono sicurissima che mia madre e mio padre sono ⓕnormalissimiⓖ esseri umani.\nForse la storia contiene qualche imprecisione...\n@c0@"
  ja: "@a@bビアンカ「私のお父さんもお母さんも\n\tふつうの人だったと思うけど……。\n\t突然変異でも　勇者は生まれるの？\n@c0@"
35:
  de: "@aNera@bDas bedeutet, dass entweder mein richtiger Vater oder meine richtige Mutter aus Zenithia stammen muss.\n@c0@"
  en: "@aNera@bThat means that one of my real parents must have had the blood of a Zenithian.\n@c0@"
  es: "@aNera@bO sea, que uno de mis progenitores debe tener sanguine de Zenithia.\n@c0@"
  fr: "@aNera@bCela veut dire que l'un de mes vrais parents devait avoir du sang zénithien.\n@c0@"
  it: "@aNera@bAllora scorre sangue zenithiano nelle vene di uno dei miei veri genitori?\n@c0@"
  ja: "@a@bフローラ「じゃあ　私の本当の両親の\n\tどちらかが　天空の血を\n\tひいていたのかも　知れませんわね。\n@c0@"
36:
  de: "@aNera@bVielleicht besaß unsere Familie deshalb den Zenithiaschild.\n@c0@"
  en: "@aNera@bMaybe that's why our family had the Zenithian Shield.\n@c0@"
  es: "@aNera@bTal vez por eso la mia famiglia tenía\r\nel Escudo de Zenithia.\n@c0@"
  fr: "@aNera@bC'est peut-être pour cette raison que notre famille possédait le Bouclier zénithien.\n@c0@"
  it: "@aNera@bQuesto spiegherebbe come mai la mia famiglia è in possesso dello Scudo Zenithiano...\n@c0@"
  ja: "@a@bフローラ「天空のたてが　私とともに\n\tあったのも　それでなのかしら……。\n@c0@"
37:
  de: "@aOtto@bWenn ich diese Zenithianerin in Humburg heiraten würd', könnt' ich also der Vater des legendären Helden werden!\n@c0@"
  en: "@aTuppence@bSo, if I marry that Zenithian woman in Gotha, maybe I'll become the father of the legendary hero!\n@c0@"
  es: "@aAlazar@b¡Entonces, si me caso con esa mujer de Zenithia en Pankraz, podría ser el padre del héroe legendario!\n@c0@"
  fr: "@aInnocent@bDonc, si j'épousais cette Zénithienne, à Gotha, je deviendrais peut-être le père du héros légendaireⓠ\n@c0@"
  it: "@aSimon@bUhm, se sposassi la donna zenithiana che vive a Denim potrei diventare il padre dell'Eroe Leggendario...\n@c0@"
  ja: "@a@bピピン「じゃあ　グランバニアの\n\t天空人の女性と　結婚すれば\n\tボクも　勇者のお父さんに？\n@c0@"
38:
  de: "@aOtto@bHmpf. Aber bestimmt wäre mein Blut immer noch nicht gut genug, selbst wenn meine Frau eine Zenithianerin wäre...\n@c0@"
  en: "@aTuppence@bHmph. No doubt my bloodline still wouldn't be good enough, though, even if my wife was a Zenithian.\n@c0@"
  es: "@aAlazar@bMmmf. Seguro que mi sangre no sería lo bastante buena, aunque mi mujer fuese de Zenithia.\n@c0@"
  fr: "@aInnocent@bMmpf. Enfin, ça m'étonnerait que mon sang ait la qualité nécessaire pour ça, même si mon épouse\r\nétait zénithienne.\n@c0@"
  it: "@aSimon@bⓕSimon, prode guardia di palazzo e padre dell'Eroe Leggendarioⓖ... Suona bene, eh? Bah, sarà meglio che la smetta di sognare a occhi aperti...\n@c0@"
  ja: "@a@bピピン「な～んて。　奥さんが\n\t天空人でも　ボクの血すじじゃ\n\tだめでしょうね……。\n@c0@"
39:
  de: "@a%0%a001240@bÄhm, Papa... Ich stinke doch nicht, oder?\n@c0@"
  en: "@a%0%a001240@bUm, Dad... I don't smell, do I?\n@c0@"
  es: "@a%0%a001240@bMmm, papá... No huelo mal, ¿verdad?\n@c0@"
  fr: "@a%0%a001240@bHum, papa... Je ne sens pas mauvais, disⓡ\n@c0@"
  it: "@a%0%a001240@bPapà, puzzo di sudore? Voglio essere in condizioni presentabili quando arrivo in un posto nuovo, altrimenti penseranno che sono un bambino sporco!\n@c0@"
  ja: "@a@b%a001240「ねえ　お父さん。\n\tボク　汗くさくない？\n\tだいじょうぶかなあ。\n@c0@"
40:
  de: "@a%0%a001250@bEs ist so schön und kühl hier drin! Selbst die Wände sind ganz kalt.\n@c0@"
  en: "@a%0%a001250@bIt's so nice and cool in here! Even the walls are cold to the touch.\n@c0@"
  es: "@a%0%a001250@b¡Aquí todo es fresco y agradable! Hasta las paredes resultan frescas al tacto.\n@c0@"
  fr: "@a%0%a001250@bIl fait si frais, iciⓠ Même les murs sont froids\nau toucher.\n@c0@"
  it: "@a%0%a001250@bChe fresco che c'è qui dentro!\nAnche le pareti hanno una temperatura gradevolissima!\n@c0@"
  ja: "@a@b%a001250「お城の中　すずしい～！\n\tカベとかも　つめたくて\n\tさわると　気持ちよさそう！\n@c0@"
41:
  de: "@aOtto@bKleohutra, Königin der Wüste... Das muss ich mir unbedingt merken!\n@c0@"
  en: "@aTuppence@bCleohatra, Queen of the Desert...\nI'll have to jot that down so I don't forget!\n@c0@"
  es: "@aAlazar@bLeopatra, Reina del Desierto...\r\n¡Tendré que apuntarlo para que no se me olvide!\n@c0@"
  fr: "@aInnocent@bToutankhanon, reine du désert... il va falloir que je le note pour ne pas l'oublierⓠ\n@c0@"
  it: "@aSimon@bCleo, la Regina del Deserto, eh? Se la sposassi diventerei ⓕSimon, il Re del Desertoⓖ! No, niente da fare: qui fa troppo caldo per i miei gusti...\n@c0@"
  ja: "@a@bピピン「アイシスさまか……。\n\tよし！　メモしとかなきゃ！\n@c0@"
42:
  de: "@a%0%a001250@bFrauen können also auch über ein Land herrschen, ja? Das ist bestimmt viel Arbeit...\n@c0@"
  en: "@a%0%a001250@bSo women can rule over places too? It's probably quite hard work, though.\n@c0@"
  es: "@a%0%a001250@bEntonces, ¿las mujeres también pueden gobernar? Aunque seguramente es muy difícil.\n@c0@"
  fr: "@a%0%a001250@bAlors les femmes aussi peuvent régnerⓡ\nÇa doit quand même être un travail assez dur.\n@c0@"
  it: "@a%0%a001250@bAnche le donne possono governare un paese, e scommetto che sono persino più brave degli uomini!\n@c0@"
  ja: "@a@b%a001250「女の人でも\n\t王さまに　なれるのね。\n\tでも　ちょっと　大変そう……。\n@c0@"
43:
  de: "@aBianca@bPuh, das ist gut. Wir könnten wirklich eine Pause brauchen, was?\n@c0@"
  en: "@aBianca@bWell, that's a relief. We could do with a break from the heat, eh?\n@c0@"
  es: "@aBianca@bVaya, es un alivio. Nos viene bien descansar un poco del calor, ¿sabes?\n@c0@"
  fr: "@aBianca@bOuf, quel soulagement. Nous avions bien besoin d'échapper à la chaleur un moment, heinⓡ\n@c0@"
  it: "@aBianca@bUn po' di fresco è proprio quello che ci voleva, eh?\n@c0@"
  ja: "@a@bビアンカ「この暑さだもん。\n\tかんげいしてもらえて\n\t本当に　助かるわね。\n@c0@"
44:
  de: "@a%0%a001240@bDer legendäre Held kann nicht allein aus dem Blut Zenithias geboren werden. Es ist noch ein anderes Blut notwendig...\n@c0@"
  en: "@a%0%a001240@bThe legendary hero can't be born of the blood of a Zenithian alone. He needs the blood of another...\n@c0@"
  es: "@a%0%a001240@bEl héroe legendario no puede llevar únicamente sangre de Zenithia. Hace falta también otra sangre distinta...\n@c0@"
  fr: "@a%0%a001240@bLe héros légendaire ne peut pas être issu du seul sang d'un Zénithien. Il doit posséder le sang d'une autre pers...\n@c0@"
  it: "@a%0%a001240@bL'Eroe Leggendario...\nLa discendenza di Zenithia...\n@c0@"
  ja: "@a@b%a001240「天空の血だけじゃ\n\t勇者は　生まれないんだよ。\n\tもうひとつ　……の血が　入らないと。\n@c0@"
45:
  de: "@a%0%a001240@bHey! Woher wusste ich das?!\n@c0@"
  en: "@a%0%a001240@bHey! How did I know that!?\n@c0@"
  es: "@a%0%a001240@b¡Eh! ¡¿Y cómo sé yo eso?!\n@c0@"
  fr: "@a%0%a001240@bHéⓠ Mais comment je peux savoir ça, moiⓡⓐ\n@c0@"
  it: "@a%0%a001240@bUhm, sono ancora un po' confuso...\nPapà, tu ci hai capito qualcosa?\n@c0@"
  ja: "@a@b%a001240「あれっ？　ボク\n\tなんで　そんなこと知ってるんだろう。\n@c0@"
46:
  de: "@a%0%a001250@bOhhh! Dieser Ort ist fantastisch. Sieh dir nur all die Bücher an!\n@c0@"
  en: "@a%0%a001250@bOoh! This place is brilliant. Look at all the books!\n@c0@"
  es: "@a%0%a001250@b¡Oooh! Este lugar es impresionante. ¡Mira cuántos libros!\n@c0@"
  fr: "@a%0%a001250@bOohⓠ Cet endroit est magnifique.\nRegarde tous ces livresⓠ\n@c0@"
  it: "@a%0%a001250@bQuesto posto è meraviglioso!\nGuarda quanti libri!\n@c0@"
  ja: "@a@b%a001250「いいなあ。\n\tここは　たくさん　ご本があって。\n@c0@"
47:
  de: "@aSancho@bAlle nur sprechen von dem legendären Helden. Das ist eine seltsame Ort hier, findest du nisst, Chico?\n@c0@"
  en: "@aSancho@bEveryone ees talking about the legendary hero.\r\nEes a leettle estrange, thees place, eh?\n@c0@"
  es: "@aSancho@bTodo el mundo habla del héroe legendario, nomás.\r\nEste lugar es un poco extraño, ¿sí?\n@c0@"
  fr: "@aSancho@bTout le monde parle du héros légendaire.\nC'est oun endroit b-b-bizarre, ici, noⓡ\n@c0@"
  it: "@aSancho@b¿Por qué aquí todos parlano dell'Eroe Leggendario?\n¡Ay, que cosa estrana!\n@c0@"
  ja: "@a@bサンチョ「誰に　聞いても\n\t伝説の勇者の話ばっかりですな。\n\t変わった国も　あったもんです。\n@c0@"
48:
  de: "@aOtto@bHört sich genau nach mir an. Vielleicht werd' ich mich auch irgendwo niederlassen und mein eigenes Reich gründen!\n@c0@"
  en: "@aTuppence@bThat sounds just like my situation! Maybe I'll settle somewhere and build my own kingdom too!\n@c0@"
  es: "@aAlazar@b¡Eso es lo que yo quiero! ¡Podría instalarme en algún sitio y fundar mi propio reino, yo también!\n@c0@"
  fr: "@aInnocent@bOn dirait ma propre histoireⓠ Peut-être que\nmoi aussi je m'installerai quelque part pour\nfonder mon propre royaumeⓠ\n@c0@"
  it: "@aSimon@bAnch'io fonderò un regno dopo aver portato a termine questa missione! Lo chiamerò ⓕSimonlandiaⓖ!\nChe ne dice, Maestà? Le piace?\n@c0@"
  ja: "@a@bピピン「それって　ボクのことみたいじゃ\n\tないですか！　よ～し！\n\tボクも　いつか　国をつくるぞ～！\n@c0@"
49:
  de: "@a%0%a001240@bWann genau war vor langer Zeit, Papa? Als du ein Junge warst? Oder vor urewigen Zeiten, als Sancho noch klein war?\n@c0@"
  en: "@a%0%a001240@bHow long ago do you think she means? When you were a boy, Dad? Or ages and ages ago, when Sancho was?\n@c0@"
  es: "@a%0%a001240@b¿De cuánto tiempo crees que habla? ¿De cuando tú eras pequeño, papá? ¿O de hace siglos, cuando lo era Sancho?\n@c0@"
  fr: "@a%0%a001240@bÇa remonte à quand, à ton avisⓡ Quand tu étais petit, papaⓡ Ou il y a bien plus longtemps, quand Sancho était petitⓡ\n@c0@"
  it: "@a%0%a001240@bTantissimi anni fa? Vuol dire quando tu eri un bambino, papà? Oppure tanti secoli fa, quando lo zio Sancho era un bambino? Eh eh eh!\n@c0@"
  ja: "@a@b%a001240「大昔って　どれくらい前？\n\tお父さんが　子供の頃くらい？\n\tそれとも　サンチョが子供の時かな？\n@c0@"
50:
  de: "@a%0%a001250@bIch kann nicht verstehen, warum er sich ausgerechnet hier niederlassen wollte. Das ist doch viel zu heiß!\n@c0@"
  en: "@a%0%a001250@bI can't understand why he would've wanted to settle here, of all places. It's just so hot!\n@c0@"
  es: "@a%0%a001250@bNo entiendo por qué elegiría establecerse aquí precisamente. ¡Con el calor que hace!\n@c0@"
  fr: "@a%0%a001250@bJe ne comprends pas pourquoi il a voulu\ns'installer ici. Il fait tellement chaudⓠ\n@c0@"
  it: "@a%0%a001250@bCome mai si stabilì proprio qui, dove fa un caldo terribile? Forse quell'uomo soffriva di reumatismi e voleva vivere in un posto caldo?\n@c0@"
  ja: "@a@b%a001250「でも　いくらなんでも\n\tこんな暑いところに\n\tつくらなくても　よかったのに……。\n@c0@"
51:
  de: "@a%0%a001240@bWie kommt es, dass Königin Kleohutra in die Zukunft schauen kann? Sie ist ein wenig seltsam, findest du nicht?\n@c0@"
  en: "@a%0%a001240@bHow come Queen Cleohatra can see into the future? She's a bit strange, isn't she?\n@c0@"
  es: "@a%0%a001240@b¿Cómo es que la reina Leopatra puede ver el futuro? Es un poco rarita, ¿verdad?\n@c0@"
  fr: "@a%0%a001240@bComment ça se fait que la reine Toutankhanon puisse lire l'avenirⓡ Elle est un peu bizarre, nonⓡ\n@c0@"
  it: "@a%0%a001240@bMa la regina Cleo ha il potere di leggere nel futuro?\nOppure ha tirato a indovinare?!\n@c0@"
  ja: "@a@b%a001240「アイシスって人　どうして\n\t未来のことが　わかるんだろう。\n\t不思議な　女王さまだね……。\n@c0@"
52:
  de: "@a%0%a001250@bEs ist genau so, wie Königin Kleohutra gesagt hat. Woher sie das alles bloß weiß?\n@c0@"
  en: "@a%0%a001250@bIt's just like Queen Cleohatra said. It's amazing how she knows these things.\n@c0@"
  es: "@a%0%a001250@bEs exactamente lo que decía la reina Leopatra. Resulta sorprendente que sepa esas cosas.\n@c0@"
  fr: "@a%0%a001250@bTout se passe comme l'a dit la reine Toutankhanon. C'est incroyable qu'elle sache tout ça.\n@c0@"
  it: "@a%0%a001250@bCredo che la regina Cleo abbia davvero il potere di prevedere il futuro, non come quei magonzoli da quattro soldi che si vedono nelle fiere di paese!\n@c0@"
