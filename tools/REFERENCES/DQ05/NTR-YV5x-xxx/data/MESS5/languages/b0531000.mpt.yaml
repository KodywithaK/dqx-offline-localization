  it: "@aViola@bL'arrivo dell'Eroe Leggendario non significa che il mondo verrà salvato come per magia!\n㈡\nMa queste persone non si rendono conto degli sforzi che stiamo facendo per cercare di scongiurare la minaccia che potrebbe spazzare via l'umanità?!\n@c0@"
  ja: "@a@bデボラ「世界を救えとか　気軽に言うけど\n\t実際にやるのは　%a001240や　私たちよ？\n\tなんだか　アタマにくるわね。\n@c0@"
295:
