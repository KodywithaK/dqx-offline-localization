  fr: "@aInnocent@bSi seulement je pouvais faire cet effet aux fillesⓠ\nDe temps en temps, j'aimerais bien que ce soit\npour moi qu'on hurle.\n@c0@"
  it: "@aSimon@bAh, quanto vorrei che le ragazze mi lanciassero grida d'ammirazione! Mi accontenterei anche di qualche decibel in meno...\n@c0@"
  ja: "@a@bピピン「ああ　ボクも　女の子に\n\tさわがれたいっ！\n\t黄色い歓声を　全身にあびたいっ！\n@c0@"
213:
  de: "@a%0%a001250@bHast du Mama geheiratet, weil sie schön ist, Papa?\n@c0@"
  en: "@a%0%a001250@bDid you marry Mum because she's pretty, Dad?\n@c0@"
  es: "@a%0%a001250@b¿Te casaste con mamá por su belleza, papi?\n@c0@"
  fr: "@a%0%a001250@bDis, papa, c'est parce qu'elle est jolie que tu as épousé mamanⓡ\n@c0@"
  it: "@a%0%a001250@bPapà, ma tu hai sposato la mamma perché è bella?\n@c0@"
  ja: "@a@b%a001250「ねえ　お父さんは\n\tお母さんが　キレイだから結婚したの？\n@c0@"
214:
  de: "@a%0%a001250@bHmm. Hab ich mir gedacht.\n@c0@"
  en: "@a%0%a001250@bHmm. I thought so.\n@c0@"
  es: "@a%0%a001250@bMmm. Lo sabía.\n@c0@"
  fr: "@a%0%a001250@bMmm. C'est ce que je pensais.\n@c0@"
  it: "@a%0%a001250@bEh eh eh!\nL'avevo immaginato!\n@c0@"
  ja: "@a@b%a001250「ふ～ん…\n\tそういうものなんだ……。\n@c0@"
215:
  de: "@a%0%a001250@bDir hat ihre Persönlichkeit gefallen? Wie romantisch!\n@c0@"
  en: "@a%0%a001250@bYou chose her because of her personality?\nHow romantic!\n@c0@"
  es: "@a%0%a001250@b¿La elegiste por su personalidad?\n¡Qué romántico!\n@c0@"
  fr: "@a%0%a001250@bTu l'as choisie pour sa personnalitéⓡ\nComme c'est romantiqueⓠ\n@c0@"
  it: "@a%0%a001250@bNo?!\nL'hai sposata perché il suo animo è puro?!\nOh, che cosa romantica!\n@c0@"
  ja: "@a@b%a001250「中身で　えらぶなんて\n\tお父さん　やるわね！\n@c0@"
216:
  de: "@a%0%a001250@bHm? Warum sollte %a001240 sie heiraten wollen? Er hat doch mich, da braucht er keine andere.\n@c0@"
  en: "@a%0%a001250@bHuh! Why would %a001240 want to marry her? He'll always have me around, so he doesn't need anyone else.\n@c0@"
  es: "@a%0%a001250@b¡Umm! ¿Por qué iba %a001240 a querer casarse con ella? Me tiene siempre cerca, no necesita a nadie más.\n@c0@"
  fr: "@a%0%a001250@bPfffⓠ Pourquoi %a001240 voudrait l'épouser, d'abordⓡ Je suis toujours avec lui, alors il n'a besoin de personne d'autre.\n@c0@"
  it: "@a%0%a001250@bPerché mai %a001240 dovrebbe sposare proprio lei, eh?! Io sono sua sorella, e toccherà a me decidere quale sarà la ragazza giusta per lui!\n@c0@"
  ja: "@a@b%a001250「ダメっ！\n\tわたしが　%a001240の\n\tお嫁さんになるんだもんっ。\n@c0@"
217:
  de: "@aBianca@bDie Leute von Helmunaptra sind wirklich sehr patriotisch. Sie ziehen alle an einem Strang.\n@c0@"
  en: "@aBianca@bThe folk of Helmunaptra all seem so patriotic.\r\nI reckon they'd pull through anythin'.\n@c0@"
  es: "@aBianca@bLa gente de Ayelmandría parece toda muy patriótica. Seguro que pueden con cualquier cosa.\n@c0@"
  fr: "@aBianca@bLes habitants d'Helmunaptra ont l'air si patriotes.\r\nJe suis convaincue qu'ils pourraient affronter n'importe quoi.\n@c0@"
  it: "@aBianca@bQuesta gente farebbe di tutto per il proprio paese...\nMi piace lo spirito patriottico che si respira a Faraonia.\n@c0@"
  ja: "@a@bビアンカ「テルパドールは\n\t国を愛する人たちが多いから\n\tなにがあっても　安心ね。\n@c0@"
218:
  de: "@aBianca@bWahrscheinlich ist das Königin Kleohutras Verdienst. Sie ist sehr beliebt beim Volk. Von ihr kann man viel lernen.\n@c0@"
  en: "@aBianca@bAnd it's all because Queen Cleohatra has\r\nsuch a good way with 'em. There's a lesson\r\nto be learnt there.\n@c0@"
  es: "@aBianca@bY todo, porque la reina Leopatra los trata estupendamente. De esto se puede aprender mucho, ¿me entiendes?\n@c0@"
  fr: "@aBianca@bMais tout ça, c'est parce que la reine Toutankhanon les a toujours bien gouvernés. Il y a des leçons à tirer de cet exemple.\n@c0@"
  it: "@aBianca@bScommetto che è stata la regina Cleo a instillarlo nei suoi sudditi.\r\nQuella donna è davvero in gamba!\n@c0@"
  ja: "@a@bビアンカ「これって　やっぱり\n\tアイシス女王さまが　人々の心を\n\tちゃんと　つかんでるからよね？\n@c0@"
219:
  de: "@a%0%a001240@bDas hört sich so an, als sei das Volk von Helmunaptra weniger wichtig als der Helm. Welch ein Unsinn!\n@c0@"
  en: "@a%0%a001240@bThat's like saying the people of Helmunaptra are less important than the helmet. That's weird!\n@c0@"
  es: "@a%0%a001240@bEso es como decir que el pueblo de Ayelmandría es menos importante que el yelmo. ¡Qué raro!\n@c0@"
  fr: "@a%0%a001240@bÇa revient un peu à dire que les habitants d'Helmunaptra sont moins importants que\nle casque. C'est bizarreⓠ\n@c0@"
  it: "@a%0%a001240@bNon avrà mica voluto dire che l'Elmo Zenithiano è più importante del popolo di Faraonia?!\n@c0@"
  ja: "@a@b%a001240「国のみんなは\n\tカブトの次に　大事なの……？\n\tそんなの　おかしいよ。\n@c0@"
220:
  de: "@a%0%a001240@bIch meine, ich weiß, dass der Zenithiahelm sehr wertvoll ist, aber er bedeutet mir noch lange nicht so viel wie %a001250 oder Sancho zum Beispiel.\n@c0@"
  en: "@a%0%a001240@bI mean, I know the Zenithian Helm is precious and all that, but it doesn't mean as much to me as %a001250 and Sancho and everyone.\n@c0@"
  es: "@a%0%a001240@bEn fin, ya sé que el Yelmo de Zenithia es muy valioso y todo eso, pero para mí no vale más que %a001250 y Sancho y todos los demás.\n@c0@"
  fr: "@a%0%a001240@bC'est vrai, quoi. Je sais que le Casque zénithien est précieux et tout, mais pour moi, %a001250, Sancho et tout le monde comptent bien plus.\n@c0@"
  it: "@a%0%a001240@bSarebbe una cosa assurda!\nLe persone vengono sempre prima degli oggetti, no?\nDico bene?\n@c0@"
  ja: "@a@b%a001240「天空のかぶとは　大事だけど\n\tボク　%a001250とか　サンチョとか\n\tみんなのほうが　もっと大事だよ。\n@c0@"
221:
  de: "@aSancho@bChico! Das ist gefährliss!\nGeh nisst zu nah ran!\n@c0@"
  en: "@aSancho@bFriend! Ees dangerous!\nYou no go eso close!\n@c0@"
  es: "@aSancho@b¡Chamaquito! Es peligroso.\r\n¡No te acerques tanto!\n@c0@"
  fr: "@aSancho@bCh-Chicoⓠ C'est d-dangereuxⓠ\nNe t'approche p-p-pas tropⓠ\n@c0@"
  it: "@aSancho@b¡Estai attento, chico!\nNo avvicinarte troppos, es pericoloso...\n@c0@"
  ja: "@a@bサンチョ「坊っちゃん！\n\t危ないですから　もっと下がって！\n@c0@"
222:
  de: "@aBianca@bEr ist sehr emsig, so viel steht fest. Aber ich glaube nicht, dass ihm dieses Training in einem richtigen Kampf viel nutzen wird.\n@c0@"
  en: "@aBianca@bHe's enthusiastic, I'll give him that. But fightin' against a mannequin en't goin' to be of any\r\nuse to him in a real battle.\n@c0@"
  es: "@aBianca@bLe pone entusiasmo, lo reconozco. Pero luchar contra un maniquí no le va a servir de mucho en la batalla, ¿sabes?\n@c0@"
  fr: "@aBianca@bQuel enthousiasmeⓠ Mais frapper un mannequin\nne lui servira à rien quand il s'agira de mener un vrai combat.\n@c0@"
  it: "@aBianca@bUhm, non credo che prendere a botte un manichino sia il modo migliore per allenarsi al combattimento...\n@c0@"
  ja: "@a@bビアンカ「気合いは　充分ね。\n\tでも　人形相手じゃ　実戦で\n\t役に立たないわ。\n@c0@"
223:
  de: "@a%0%a001250@bDie arme Puppe! Sie hat doch gar nichts getan und wird trotzdem verdroschen!\n@c0@"
  en: "@a%0%a001250@bThat poor doll! It's taking such a beating, even though it hasn't done a thing to deserve it.\n@c0@"
  es: "@a%0%a001250@b¡Pobre muñeco! Se está llevando una paliza sin haber hecho nada para merecerla.\n@c0@"
  fr: "@a%0%a001250@bPauvre mannequinⓠ Il se prend une sacrée raclée alors qu'il n'a rien fait pour ça.\n@c0@"
  it: "@a%0%a001250@bPovero manichino!\nNon ha fatto niente di male, eppure gli stanno dando un sacco di botte...\n@c0@"
  ja: "@a@b%a001250「お人形さん　なにも\n\t悪いことしてないのに　かわいそう。\n@c0@"
224:
  de: "@a%0%a001240@bVielleicht sollte ich auch ein wenig üben. Als der legendäre Held trage ich eine große Verantwortung.\n@c0@"
  en: "@a%0%a001240@bMaybe I'd better start putting in some practice too. It's a big responsibility being the legendary hero.\n@c0@"
  es: "@a%0%a001240@bSerá mejor que yo también empiece a practicar un poco. Ser el héroe legendario es una gran responsabilidad.\n@c0@"
  fr: "@a%0%a001240@bPeut-être que je devrais me mettre à m'entraîner, moi aussi. Être le héros légendaire, c'est une grande responsabilité.\n@c0@"
  it: "@a%0%a001240@bDevo allenarmi di più. L'Eroe Leggendario non può certo deludere le sue ammiratrici...! Ehm, intendevo dire che voglio essere all'altezza del mio compito!\n@c0@"
  ja: "@a@b%a001240「ボクも　あれぐらい\n\t訓練しないと　ダメなのかな。\n\t勇者って　責任重大だあ……。\n@c0@"
225:
  de: "@aOtto@bDiese Dienerinnen der Königin sind wirklich etwas ganz Besonderes, findet Ihr net auch, %a000090?\n@c0@"
  en: "@aTuppence@bHer Majesty's assistants are certainly something special, aren't they, %a000090?\n@c0@"
  es: "@aAlazar@bLas camareras de Su Majestad tienen algo realmente especial, ¿verdad, %a000090?\n@c0@"
  fr: "@aInnocent@bLes assistantes de Sa Majesté sont indubitablement... remarquables, n'est-ce pas, %a000090ⓡ\n@c0@"
  it: "@aSimon@bMaestà, ha notato quanto sono graziose le assistenti della regina Cleo? Forse potrei portarne via due o tre come souven... Ehm, come non detto.\n@c0@"
  ja: "@a@bピピン「やはり　女王さまの側近は\n\tレベルが高い！\n\t%a000090さまも　そう思いませんか？\n@c0@"
226:
  de: "@a%0%a001240@bEs ist mir irgendwie peinlich, die ganze Zeit als Held bezeichnet zu werden...\n@c0@"
  en: "@a%0%a001240@bIt's a bit embarrassing being called a hero all the time.\n@c0@"
  es: "@a%0%a001240@bEs un poco embarazoso que te llamen héroe cada dos por tres.\n@c0@"
  fr: "@a%0%a001240@bC'est un peu gênant d'être appelé ⓥhérosⓦ\ntout le temps.\n@c0@"
  it: "@a%0%a001240@bGrande Eroe di qui, Eroe Leggendario di là...\nNon potrebbero chiamarmi semplicemente %a001240?!\n@c0@"
  ja: "@a@b%a001240「なんだか　あらたまって\n\t勇者って　呼ばれると\n\tはずかしいよ……。\n@c0@"
227:
  de: "@aOtto@bDiese Dienerinnen der Königin sind wirklich etwas ganz Besonderes, findet Ihr net auch, %a000090?\n@c0@"
  en: "@aTuppence@bHer Majesty's assistants are certainly something special, aren't they, %a000090?\n@c0@"
  es: "@aAlazar@bLas camareras de Su Majestad tienen algo realmente especial, ¿verdad, %a000090?\n@c0@"
  fr: "@aInnocent@bLes assistantes de Sa Majesté sont indubitablement... remarquables, n'est-ce pas, %a000090ⓡ\n@c0@"
  it: "@aSimon@bMaestà, ha notato quanto sono graziose le assistenti della regina Cleo? Forse potrei portarne via due o tre come souven... Ehm, come non detto.\n@c0@"
  ja: "@a@bピピン「やはり　女王さまの側近は\n\tレベルが高い！\n\t%a000090さまも　そう思いませんか？\n@c0@"
228:
  de: "@a%0%a001250@bDie Leute erwarten ganz schön viel von %a001240. Ich hoffe, dass er all dem gewachsen ist.\n@c0@"
  en: "@a%0%a001250@bPeople are expecting an awful lot of %a001240. I hope it won't be too much of a trial for him.\n@c0@"
  es: "@a%0%a001250@bLa gente espera demasiadas cosas de %a001240. Espero que no le suponga una prueba muy dura.\n@c0@"
  fr: "@a%0%a001250@bJ'espère que ça ne sera pas trop dur pour %a001240. Les gens attendent vraiment beaucoup de lui.\n@c0@"
  it: "@a%0%a001250@bTutti si aspettano che %a001240 sconfigga il pericolo che minaccia il mondo. Spero che mio fratello sappia sopportare il peso della responsabilità…\n@c0@"
  ja: "@a@b%a001250「お兄ちゃん　責任重大だね。\n\t大丈夫かな……。\n@c0@"
229:
  de: "@aSancho@bEs ist eine große Last für eine kleine Niño, die ganze Welt zu retten.\n@c0@"
  en: "@aSancho@bEes eso hard work for thees one young boy to esave the whole world.\n@c0@"
  es: "@aSancho@bPara un chamaquito tan joven es una tarea difícil salvar el mundo.\n@c0@"
  fr: "@aSancho@bC'est oune tâche si d-difficile pour oun jeune garçon de sauver le monde entier.\n@c0@"
  it: "@aSancho@bSalvare el mundo no sarà una empresa semplice por un niño como %a001240...\nDobbiamo dargli todo l'aiuto posible.\n@c0@"
  ja: "@a@bサンチョ「まだ　小さいのに\n\t世界を救えだの　何だのと。\n\tあれじゃ　かわいそうですよ。\n@c0@"
230:
  de: "@aOtto@bDiese Dame ist ein ganz außergewöhnlich hübsches Exemplar...\n@c0@"
  en: "@aTuppence@bShe's another fine specimen, I must say.\n@c0@"
  es: "@aAlazar@bElla es otro buen ejemplar, debo decir.\n@c0@"
  fr: "@aInnocent@bJe dois dire qu'elle aussi est ravissante.\n@c0@"
  it: "@aSimon@bAnche questa fanciulla è decisamente sopra la media mondiale della bellezza... Che sia l'aria del posto a farle crescere così floride e rigogliose?\n@c0@"
  ja: "@a@bピピン「こっちの子も　キレイだなあ。\n\tえへへっ。\n@c0@"
231:
  de: "@aBianca@bEs ist gut zu wissen, dass sie eine Art Vorahnung hatte, nicht?\n@c0@"
  en: "@aBianca@bIt's reassurin' to know that she had that sort of premonition, eh?\n@c0@"
  es: "@aBianca@bEs tranquilizador saber que ella tuvo esa especie de premonición, ¿me entiendes?\n@c0@"
  fr: "@aBianca@bC'est rassurant de savoir qu'elle a eu cette sorte de prémonition, heinⓡ\n@c0@"
  it: "@aBianca@bQuesta sì che sarebbe una bella notizia...\r\nSperiamo che la predizione della Regina si avveri.\n@c0@"
  ja: "@a@bビアンカ「アイシス女王さまが\n\tそう予言なさったなんて　心強いわね。\n@c0@"
232:
  de: "@aNera@b%a001240 darf diese ganze Verantwortung nicht alleine tragen. Wir müssen alle zusammenarbeiten, als Familie, wenn wir die Welt retten wollen.\n@c0@"
  en: "@aNera@bWe can't let such a big responsibility fall to %a001240 alone. We'll all have to pull together as a family if the world's to be saved.\n@c0@"
  es: "@aNera@bNo podemos dejarle una responsabilità tan grande a %a001240 exclusivamente. Si hay que salvar il mondo, debemos lavorare unidos como una famiglia.\n@c0@"
  fr: "@aNera@bNous ne pouvons pas imposer à %a001240 de supporter seul une telle responsabilité.\n㈡\nNous allons devoir nous y mettre tous ensemble,\nen famille, pour sauver le monde.\n@c0@"
  it: "@aNera@bUna responsabilità tanto grande non può gravare solo su %a001240. Dobbiamo aiutarlo in ogni modo possibile, se vogliamo che nel mondo torni la pace.\n@c0@"
  ja: "@a@bフローラ「%a001240だけに　たよるわけに\n\tいきませんわ。　私たち家族みんなで\n\t世界を　救いましょう。\n@c0@"
233:
  de: "@a%0%a001240@bDas steht in den Sternen geschrieben? Mann, sie muss ja wirklich gute Augen haben!\n@c0@"
  en: "@a%0%a001240@bWritten in the stars? She must have good eyesight!\n@c0@"
  es: "@a%0%a001240@b¿Escrito en las estrellas?\n¡Qué buena vista debe tener!\n@c0@"
  fr: "@a%0%a001240@bC'est écrit dans les astresⓡ\nElle doit avoir une sacrée vueⓠ\n@c0@"
  it: "@a%0%a001240@bL'ha letto nelle stelle?!\nComplimenti per la vista!\n@c0@"
  ja: "@a@b%a001240「使命って……えっと\n\tやらなくちゃ　いけない事だよね？\n\t世界を救う使命……。\n@c0@"
234:
  de: "@a%0%a001240@bOh, jetzt hab ich's verstanden. Sie meint, dass sei mein Schicksal und so. Na ja, ich werde mein Bestes geben. Aber du hilfst mir, ja, Papa?\n@c0@"
  en: "@a%0%a001240@bOh, I get it. She means it's a sort of destiny. Well, I'll do my best. You'll help out, right, Dad?\n@c0@"
  es: "@a%0%a001240@b¡Ah!, ya entiendo. Quiere decir que es como el destino. Bueno, haré todo lo que pueda. Tú me ayudarás, ¿verdad, papá?\n@c0@"
  fr: "@a%0%a001240@bOh, non, je comprends. Elle veut dire que c'est comme une sorte de destinée. Eh bien, je ferai de mon mieux.\nTu m'aideras, hein, papaⓡ\n@c0@"
  it: "@a%0%a001240@bLo so, lo so che vuol dire che questo è il mio destino... Stavo solo facendo un po' d'ironia.\nComunque ce la metterò tutta per salvare il mondo.\n@c0@"
  ja: "@a@b%a001240「……だいじょうぶ。\n\tボク　がんばるよ！\n\tだから　お父さんも見ててね。\n@c0@"
235:
  de: "@a%0%a001250@bAls Königin Kleohutra für uns gebetet hat, wurde mir richtig warm ums Herz...\n@c0@"
  en: "@a%0%a001250@bWhen Queen Cleohatra prayed for us just then,\nI got a really warm feeling inside.\n@c0@"
  es: "@a%0%a001250@bCuando la reina Leopatra rezó por nosotros\nsentí algo muy cálido por dentro.\n@c0@"
  fr: "@a%0%a001250@bAu moment où la reine Toutankhanon a prié pour nous, ça m'a vraiment fait tout chaud à l'intérieur.\n@c0@"
  it: "@a%0%a001250@bQuando la regina Cleo ha pregato per noi, ho sentito una sensazione di calore dentro di me...\n@c0@"
  ja: "@a@b%a001250「あの女王さまに\n\tお祈りしてもらったら　胸の中が\n\tすごく　やさしい気持ちになったよ。\n@c0@"
236:
  de: "@aSancho@bWenn die Welt nisst so loco wäre, könnte der arme %a001240 eine ganz normale Leben als Muchacho führen.\n@c0@"
  en: "@aSancho@bEef the world, ees no eso loco like thees, poor %a001240, he could leeve like the normal boy.\n@c0@"
  es: "@aSancho@bSi el mundo no estuviera tan desquiciado, el pobre %a001240 podría vivir como cualquier otro chavo.\n@c0@"
  fr: "@aSancho@bSi le mundo n'était pas aussi f-f-fou, le pauvre %a001240 pourrait vivre comme oun petit garçon n-normal.\n@c0@"
  it: "@aSancho@bSi el mundo no fosse en pericolo, %a001240 potrebbe vivere un'esistenza normal, como todos los niños della sua età.\n@c0@"
  ja: "@a@bサンチョ「こんな世の中でなきゃ\n\t%a001240さまも　のびのびと\n\t暮らせたでしょうにねえ……。\n@c0@"
237:
  de: "@aOtto@bWelch eine Farce! Ihre Majestät scheint förmlich durch mich hindurch zu sehen!\n@c0@"
  en: "@aTuppence@bWhat a travesty! Her Majesty seems to just look right through me.\n@c0@"
  es: "@aAlazar@b¡Qué barbaridad! Es como si para Su Majestad no existiera.\n@c0@"
  fr: "@aInnocent@bC'est vraiment malheureuxⓠ J'ai l'impression d'être transparent aux yeux de Sa Majesté.\n@c0@"
  it: "@aSimon@bLa regina Cleo non mi degna nemmeno di uno sguardo. Per lei è come se non esistessi...\nCome posso fare per attirare la sua attenzione, eh?\n@c0@"
  ja: "@a@bピピン「ひどいや！\n\t女王さまの視線は　カンペキに\n\tボクを　スルーしてますよっ。\n@c0@"
238:
  de: "@aBianca@bWie seltsam. Seit die Königin dieses kleine Gebet für uns gesprochen hat, fühle ich mich schon viel besser.\n@c0@"
  en: "@aBianca@bThat's odd. I suddenly feel a lot stronger since the Queen said that little prayer for us.\n@c0@"
  es: "@aBianca@b¡Qué raro! Me siento mucho más fuerte, desde que la Reina elevó esa plegaria por nosotros, ¿sabes?\n@c0@"
  fr: "@aBianca@bC'est étrange. Je me sens beaucoup plus forte\r\ndepuis que la reine a dit cette prière pour nous.\n@c0@"
  it: "@aBianca@bChe strana sensazione...\nÈ come se la preghiera della regina Cleo mi avesse resa più forte...\n@c0@"
  ja: "@a@bビアンカ「ふしぎね……\n\tアイシスさまに　祈っていただいたら\n\tチカラが　あふれてきたみたい。\n@c0@"
239:
  de: "@aNera@bEs ist so eine große Last für %a001240. Er ist doch noch so jung.\n@c0@"
  en: "@aNera@bIt's such a terrible burden for %a001240.\nHe's still so young.\n@c0@"
  es: "@aNera@bQué carga tan terribile para %a001240.\nAún es troppo joven.\n@c0@"
  fr: "@aNera@bQuel terrible fardeau pour %a001240.\nIl est encore si jeune.\n@c0@"
  it: "@aNera@bSpero che il nostro piccolo %a001240 saprà affrontare l'arduo compito che lo aspetta...\n@c0@"
  ja: "@a@bフローラ「%a001240には\n\t苦労を　かけるわね。\n\tまだ　小さいのに……。\n@c0@"
240:
  de: "@aSancho@bSeñor Ludwig ist jetzt im Himmel mit der Göttin. Sie schauen auf diss herab und beten für deine Schutz und Glück, Chico.\n@c0@"
  en: "@aSancho@bSeñor Pankraz, now he ees een the esky weeth the Goddess. They are looking down on you and praying for your esafety and happiness, friend.\n@c0@"
  es: "@aSancho@bAhorita el señor Teudis está en el cielo con la Diosa. Desde allí te miran y rezan por tu seguridad y tu felicidad, chamaquito.\n@c0@"
  fr: "@aSancho@bMaintenant que le señor Petros est au c-c-ciel avec la Déesse, ils veillent tous les deux sur toi et prient pour ton bonheur et ta sécurité, chico.\n@c0@"
  it: "@aSancho@bEl señor Russel es en cielo, insieme alla dea.\nLoro guardano versos de noi, chico, y seguramentes no ce faranno mancare la loro protezione...\n@c0@"
  ja: "@a@bサンチョ「天空の神さまも　そして\n\tパパスさまも…　みんな　坊っちゃんの\n\t無事と幸せを　祈ってますよ。\n@c0@"
241:
  de: "@aOtto@bWelch eine Farce! Ihre Majestät scheint förmlich durch mich hindurch zu sehen!\n@c0@"
  en: "@aTuppence@bWhat a travesty! Her Majesty seems to just look right through me.\n@c0@"
  es: "@aAlazar@b¡Qué barbaridad! Es como si para Su Majestad no existiera.\n@c0@"
  fr: "@aInnocent@bC'est vraiment malheureuxⓠ J'ai l'impression d'être transparent aux yeux de Sa Majesté.\n@c0@"
  it: "@aSimon@bLa regina Cleo non mi degna nemmeno di uno sguardo. Per lei è come se non esistessi...\nCome posso fare per attirare la sua attenzione, eh?\n@c0@"
  ja: "@a@bピピン「ひどいや！\n\t女王さまの視線は　カンペキに\n\tボクを　スルーしてますよっ。\n@c0@"
242:
  de: "@aBianca@bWie seltsam. Seit die Königin dieses kleine Gebet für uns gesprochen hat, fühle ich mich schon viel besser.\n@c0@"
  en: "@aBianca@bThat's odd. I suddenly feel a lot stronger since the Queen said that little prayer for us.\n@c0@"
  es: "@aBianca@b¡Qué raro! Me siento mucho más fuerte, desde que la Reina elevó esa plegaria por nosotros, ¿sabes?\n@c0@"
  fr: "@aBianca@bC'est étrange. Je me sens beaucoup plus forte\r\ndepuis que la reine a dit cette prière pour nous.\n@c0@"
  it: "@aBianca@bChe strana sensazione...\nÈ come se la preghiera della regina Cleo mi avesse resa più forte...\n@c0@"
  ja: "@a@bビアンカ「ふしぎね……\n\tアイシスさまに　祈っていただいたら\n\tチカラが　あふれてきたみたい。\n@c0@"
243:
  de: "@aNera@bEs ist so eine große Last für %a001240. Er ist doch noch so jung.\n@c0@"
  en: "@aNera@bIt's such a terrible burden for %a001240.\nHe's still so young.\n@c0@"
  es: "@aNera@bQué carga tan terribile para %a001240.\nAún es troppo joven.\n@c0@"
  fr: "@aNera@bQuel terrible fardeau pour %a001240.\nIl est encore si jeune.\n@c0@"
  it: "@aNera@bSpero che il nostro piccolo %a001240 saprà affrontare l'arduo compito che lo aspetta...\n@c0@"
  ja: "@a@bフローラ「%a001240には\n\t苦労を　かけるわね。\n\tまだ　小さいのに……。\n@c0@"
244:
  de: "@aBianca@bDas Gras und das Wasser duften herrlich. Dieser Platz ist wirklich atemberaubend, nicht?\n@c0@"
  en: "@aBianca@bThe smell of the grass and the water is so strong! This place is always really relaxin', eh?\n@c0@"
  es: "@aBianca@b¡Qué intenso es el olor de la hierba y el agua! Este sitio es siempre muy relajante, ¿sabes?\n@c0@"
  fr: "@aBianca@bL'odeur de l'herbe et de la fraîcheur est si forteⓠ Cet endroit est vraiment toujours aussi apaisant.\n@c0@"
  it: "@aBianca@bSenti come profuma l'erba!\nQuesto posto è un paradiso!\n@c0@"
  ja: "@a@bビアンカ「水と草のニオイがする。\n\tいつ来ても　ここは落ちつくわね……。\n@c0@"
245:
  de: "@a%0%a001240@bDas ist ein ganz normaler Garten, nur dass er drinnen ist. Aber er ist wunderschön und vor allem kühl!\n@c0@"
  en: "@a%0%a001240@bIt's just like a normal garden, apart from the fact that it's inside. It's so lovely and cool!\n@c0@"
  es: "@a%0%a001240@bEs como cualquier otro jardín, solo que está en el interior. ¡Qué fresco y agradable!\n@c0@"
  fr: "@a%0%a001240@bOn dirait un jardin normal, sauf qu'il est à l'intérieur. Il est beau et il y fait tellement fraisⓠ\n@c0@"
  it: "@a%0%a001240@bBeh, è un giardino normalissimo, no?\nPerò si trova all'interno di un edificio!\nÈ troppo forte!\n@c0@"
  ja: "@a@b%a001240「空がないだけで\n\tどこかの　お庭みたいだねっ。\n\tすずしくて　気持ちいいや！\n@c0@"
246:
  de: "@a%0%a001250@bEs ist wie ein Traum, so viele Blumen mitten in einem Schloss zu sehen!\n@c0@"
  en: "@a%0%a001250@bIt's like a dream seeing so many lovely flowers inside a castle like this!\n@c0@"
  es: "@a%0%a001250@b¡Ver flores tan bonitas dentro de un castillo es como un sueño!\n@c0@"
  fr: "@a%0%a001250@bC'est un vrai rêve de voir autant de jolies fleurs à l'intérieur d'un château, comme çaⓠ\n@c0@"
  it: "@a%0%a001250@bNon avevo mai visto tanti fiori in un castello...\nMi sembra quasi di essere in un sogno!\n@c0@"
  ja: "@a@b%a001250「お城の地下で　こんなに\n\tたくさんのお花を咲かせられるなんて…\n\t夢を　見てるみたい。\n@c0@"
247:
  de: "@aNera@bHm, duftet es hier gut. Es ist wirklich etwas Besonderes, mitten in der Wüste solch einen bezaubernden Ort zu finden.\n@c0@"
  en: "@aNera@bWhat a yummy smell. It really is something special, finding a place like this in the middle of the desert.\n@c0@"
  es: "@aNera@b¡Qué aroma tan buono! Es algo molto speciale encontrar un lugar así en medio del desierto.\n@c0@"
  fr: "@aNera@bQuel délicieux parfum. C'est vraiment incroyable de trouver un lieu pareil au beau milieu du désert.\n@c0@"
  it: "@aNera@bChe profumo di primavera!\nCome avranno fatto a creare un paradiso come questo proprio nel cuore del deserto?\n@c0@"
  ja: "@a@bフローラ「いいかおり…\n\t外では見なれているものでも\n\t砂漠の中にあると　特別に感じますわ。\n@c0@"
248:
  de: "@aSancho@bErst in der Wüste wird einem bewusst, wie schön grüne Pflanzen und Wasser sind, no, Chico?\n@c0@"
  en: "@aSancho@bYou know, being een the desert, eet makes you eso happy there are the green plants and water een the world, eh?\n@c0@"
  es: "@aSancho@bYa sabes, viviendo en el desierto uno se siente feliz nomás de ver jardines y plantas en el mundo, ¿verdad?\n@c0@"
  fr: "@aSancho@bTu sais, quand on est dans le d-d-désert, ça rend vraiment heureux de voir qu'il existe des\np-p-plantes vertes et de l'eau, noⓡ\n@c0@"
  it: "@aSancho@b¡El desierto es muy bello, ma preferisco los luegos donde ce sono agua, plantas y ombras!\n@c0@"
  ja: "@a@bサンチョ「砂漠に来ると　つくづく\n\t水と　緑のありがたみを\n\t思い知らされますねえ。\n@c0@"
249:
  de: "@aOtto@bEs heißt, dass das Haus eines Menschen viel über ihn aussagt. Ich glaube, dieser Spruch war noch nie so wahr wie hier.\n@c0@"
  en: "@aTuppence@bPeople say that you can tell a lot about someone from how their house looks. I don't think that's ever been more true than here.\n@c0@"
  es: "@aAlazar@bDicen que se puede saber mucho de una persona por el aspecto de su casa. Creo que nunca ha sido tan cierto como aquí.\n@c0@"
  fr: "@aInnocent@bLes gens disent qu'on peut en apprendre beaucoup sur une personne en regardant de sa maison.\r\nC'est particulièrement vrai ici.\n@c0@"
  it: "@aSimon@bQuesto posto è pieno di attrattive, e non mi riferisco solo alle bellezze architettoniche o a quelle paesaggistiche... Ih ih ih! Ehm...\n@c0@"
  ja: "@a@bピピン「家は　住む人の心を\n\tうつし出すと言いますが\n\tここに来て　実感しました！\n@c0@"
250:
  de: "@a%0%a001240@bKäferblut? Ich wusste gar nicht, dass das wertvoll ist.\n@c0@"
  en: "@a%0%a001240@bBeetle's blood? I never knew that was precious.\n@c0@"
  es: "@a%0%a001240@b¿Los cabellos de una dromedaria? Nunca pensé que eso fuera tan precioso.\n@c0@"
  fr: "@a%0%a001240@bDu sang de scarabéeⓡ Je ne savais pas que c'était précieux.\n@c0@"
  it: "@a%0%a001240@bQuesto giardino è più prezioso di un tesoro.\n@c0@"
  ja: "@a@b%a001240「まばゆいって\n\tまぶしい　っていうことでしょ？\n@c0@"
251:
  de: "@a%0%a001240@bIch würde sagen, dass dieser Garten tausend Mal wertvoller ist als Käferblut!\n@c0@"
  en: "@a%0%a001240@bI'd say this garden must be a million times more precious than that!\n@c0@"
  es: "@a%0%a001240@b¡Yo diría que este jardín debe ser un millón de veces más precioso que eso!\n@c0@"
  fr: "@a%0%a001240@bPour moi, ce jardin doit être au moins un million de fois plus précieuxⓠ\n@c0@"
  it: "@a%0%a001240@bÈ uno spettacolo che rallegra il cuore e rilassa la mente...\n@c0@"
  ja: "@a@b%a001240「でも　あの女王さまの顔\n\tそんなに　まぶしくないけどなあ……。\n@c0@"
252:
  de: "@aSancho@bAber sie ist wohl kaum so schön wie Señora %a001230, oder, Chico?\n@c0@"
  en: "@aSancho@bBut eshe can no be eso beautiful like señora %a001230, eh, friend?\n@c0@"
  es: "@aSancho@bPero ella no es tan hermosa como la señora %a001230, ¿eh, chamaco?\n@c0@"
  fr: "@aSancho@bMais elle ne p-peut pas être aussi belle que la señora %a001230, hein, chicoⓡ\n@c0@"
  it: "@aSancho@bSì, la reina Cleo es muy bella, però non tantos quantos la señora %a001230.\n¿Dico bien, chico?\n@c0@"
  ja: "@a@bサンチョ「でも　やはり　美しさでは\n\t坊っちゃんの　%a001230さまのほうが\n\t上に　決まってますよ。\n@c0@"
253:
  de: "@aSancho@bUnd iss glaube auch nisst, dass es eine Señora gibt, die schöner ist als Señora Magda.\n@c0@"
  en: "@aSancho@bAnd I no believe any señora, eshe could ever be more beautiful than señora Mada.\n@c0@"
  es: "@aSancho@bY no creo que pudiera existir señora más hermosa que la señora Perséfone.\n@c0@"
  fr: "@aSancho@bEt je crois qu'aucune señora ne peut être p-p-plus belle que la señora Magdalena.\n@c0@"
  it: "@aSancho@bY nemmenos como la maravillosa señora Mada...\n@c0@"
  ja: "@a@bサンチョ「もちろん　マーサさまには\n\t誰も　かないませんが。\n@c0@"
254:
  de: "@aOtto@bOh! Seht nur das Bett dort drüben. Vielleicht ist es das Bett der Königin... Ahhh.\n@c0@"
  en: "@aTuppence@bOoh! Look at that bed over there. Perhaps it belongs to Queen Cleohatra...aaah.\n@c0@"
  es: "@aAlazar@b¡Oooh! Mira esa cama de ahí. Tal vez pertenezca a la reina Leopatra... aaah.\n@c0@"
  fr: "@aInnocent@bOohⓠ Regardez ce lit, là-bas. Il appartient peut-être à la reine Toutankhanon... Aaaah.\n@c0@"
  it: "@aSimon@bChe bello quel letto, eh?\nForse è lì che riposa le sue splendide membra la regina Cleo?\n@c0@"
  ja: "@a@bピピン「見てくださいよ！\n\tあんなところに　ベッドが……\n\tもしかしてアイシスさまの？　くうっ！\n@c0@"
255:
  de: "@aBianca@bEs ist nicht leicht, drinnen solch eine Blumenpracht zu erhalten.\n@c0@"
  en: "@aBianca@bIt's pretty hard work keepin' plants goin' indoors like this, you know.\n@c0@"
  es: "@aBianca@bCultivar plantas de interior como estas es un trabajo duro, ¿sabes?\n@c0@"
  fr: "@aBianca@bC'est un sacré travail d'entretenir des plantes d'intérieur comme celles-ci, tu sais.\n@c0@"
  it: "@aBianca@bCurare un giardino come questo dev'essere un lavoro molto duro...\n@c0@"
  ja: "@a@bビアンカ「知ってる？\n\t屋内で　草木を育てるのは\n\tけっこう　手間がかかるのよ。\n@c0@"
256:
  de: "@aBianca@bUnd doch erscheint mir dieser Ort hier immer wie das Paradies.\n@c0@"
  en: "@aBianca@bAnd yet they always seem to manage to have the place lookin' so nice.\n@c0@"
  es: "@aBianca@bY sin embargo, siempre se apañan para mantener este lugar tan bonito.\n@c0@"
  fr: "@aBianca@bEt pourtant, ils arrivent à garder cet endroit toujours aussi joli.\n@c0@"
  it: "@aBianca@bEppure, riescono a tenerlo in perfetto ordine: credo di non aver mai visto nulla di simile in tutta la mia vita!\n@c0@"
  ja: "@a@bビアンカ「なのに　いつ来ても\n\tこんなに　きれいにしてあって\n\t本当に　感心するわ。\n@c0@"
257:
  de: "@aNera@bOh, nein! Die Monster sollten wir auf keinen Fall vergessen! Am besten siehst du dir diese Blumen nicht zu lange an, Liebling.\n@c0@"
  en: "@aNera@bOh no! We don't want to forget about our\r\nmonsters! You'd better not look at the\r\nflowers too much, darling.\n@c0@"
  es: "@aNera@b¡Oh, no! ¡No nos olvidemos de nuestros monstruos! Es mejor que no mires tanto las fiori, caro.\n@c0@"
  fr: "@aNera@bOh nonⓠ On ne veut pas oublier nos monstresⓠ\nTu ferais mieux de ne pas trop regarder ces fleurs, mon chéri.\n@c0@"
  it: "@aNera@bOh, no! Non possiamo certo dimenticarci dei mostri né della nostra missione, caro! Sarà meglio non lasciarci distrarre dalla bellezza di questi fiori...\n@c0@"
  ja: "@a@bフローラ「まあ！　魔物さんのことを\n\t忘れては　大変ですわ。\n\tあなたは　お花を見ないでくださいね。\n@c0@"
258:
  de: "@a%0%a001240@bAlso ich fänd's besser, wenn sie uns was Leckeres zu essen kochen würde, statt sich um die Pflanzen zu kümmern!\n@c0@"
  en: "@a%0%a001240@bIf it came to it, I'd still rather she spent her time making us some tasty dinner rather than looking after the plants!\n@c0@"
  es: "@a%0%a001240@bYa que estamos, preferiría que dedicara el tiempo a hacernos una comida sabrosa antes que a cuidar de las plantas.\n@c0@"
  fr: "@a%0%a001240@bÀ vrai dire, j'aimerais mieux qu'elle nous prépare\nun bon dîner plutôt que de passer son temps à s'occuper des plantesⓠ\n@c0@"
  it: "@a%0%a001240@bQuella donna avrebbe potuto prepararci qualcosa di buono da mangiare, invece di parlarci dei suoi amatissimi fiori...\n@c0@"
  ja: "@a@b%a001240「どっちかっていうと\n\tおやつを作ってくれたほうが\n\tうれしいんだけどな。\n@c0@"
259:
  de: "@aSancho@bSi. Das ist eine wunderschöne Garten. Die Blumen, sie sind so wundervoll, dass iss... No! Iss werde nisst weinen!\n@c0@"
  en: "@aSancho@bSí. Ees a very well-kept garden. The flowers, they are eso beautiful. I, I...\r\nNo! I no gonna cry!\n@c0@"
  es: "@aSancho@bSí. Un jardín bien cuidado. Las flores son tan hermosas... Yo, yo... ¡No! ¡No voy a llorar!\n@c0@"
  fr: "@aSancho@bSi. C'est oun jardin très bien entretenu.\nLes f-f-fleurs sont si belles. Je, je...\nNo, je ne vais pas p-pleurer pour ça, quand mêmeⓠ\n@c0@"
  it: "@aSancho@b¡Esto giardino es una cosa maravillosa!\r\nLos flores sono uno espettacolo incredibile y yo...\r\nUhm, no. No soy commossos.\n@c0@"
  ja: "@a@bサンチョ「しかし　よく手入れが\n\t行き届いた　庭園ですねえ。\n\t感心しますよ。\n@c0@"
260:
  de: "@a%0%a001250@bIch kann mir gar nicht vorstellen, dass das Schloss mal im Grünen stand. Bei all dem Sand...\n@c0@"
  en: "@a%0%a001250@bIt's hard to imagine a time when the castle would've been surrounded by greenery instead of sand.\n@c0@"
  es: "@a%0%a001250@bSe hace difícil imaginar una época en la que el castillo estaba rodeado de vegetación en lugar de arena.\n@c0@"
  fr: "@a%0%a001250@bÇa n'est pas facile d'imaginer une époque où le château pouvait être entouré de verdure plutôt\nque de sable.\n@c0@"
  it: "@a%0%a001250@bMi riesce difficile immaginare che Faraonia sia stata una terra fertile.\nEvidentemente quella donna parla di molto tempo fa...\n@c0@"
  ja: "@a@b%a001250「お城のまわりが\n\t砂じゃなかったときも　あったの？\n\tそんなの　信じられない……。\n@c0@"
261:
  de: "@aSancho@bWill sie damit sagen, dass die Orte, die heute grün sind, eines Tages eine Wüste sein könnten?\n@c0@"
  en: "@aSancho@bYou theenk thees means that the places where ees green now, they can one day become like the desert?\n@c0@"
  es: "@aSancho@b¿Significará eso que los lugares que hoy son verdes podrían convertirse en un desierto?\n@c0@"
  fr: "@aSancho@bTu crois que ça veut d-dire que les endroits verdoyants d'aujourd'hui pourraient oun jour devenir d-désertiquesⓡ\n@c0@"
  it: "@aSancho@bSenza el duro lavoro de los abitantes de Faraonia, las areas donde ahora crescono flores y plantas sarebbero como muertas...\n@c0@"
  ja: "@a@bサンチョ「……ということは　今は\n\t緑につつまれた地も　いつか砂漠に\n\t変わることもある　ということですか。\n@c0@"
262:
  de: "@aSancho@bWie lange hat deine Padre nach dem legendären Helden gesucht. Und jetzt finden wir heraus, dass es sein eigener Enkel ist!\n@c0@"
  en: "@aSancho@bFor eso long, your father, he esearched for the\r\nlegendary hero. And now we find out ees\r\nhees own grandson!\n@c0@"
  es: "@aSancho@bTu apá buscó durante mucho tiempo al héroe legendario. ¡Y ahorita resulta que es su propio nieto!\n@c0@"
  fr: "@aSancho@bTon padre a cherché le héros légendaire\np-p-pendant si longtemps. Et là, on découvre\nque c'est son p-p-propre petit-filsⓠ\n@c0@"
  it: "@aSancho@b¡Es una cosa incredibiles!\nEl tuo povero padre ha trascorso toda la sua vida alla ricercas dell'Eroe Leggendario...\n@c0@"
  ja: "@a@bサンチョ「パパスさまが　あれほど\n\t探しておられた　勇者が　まさか\n\t自分のマゴになるとは……\n@c0@"
263:
  de: "@aSancho@bIss glaube, Señor Ludwig wird sehr überrascht sein, selbst wenn er oben in die Himmel ist.\n@c0@"
  en: "@aSancho@bI am esure señor Pankraz, he ees very surprised, even though he ees up een heaven.\n@c0@"
  es: "@aSancho@bSeguro que el señor Teudis está bien sorprendido aunque esté en el cielo.\n@c0@"
  fr: "@aSancho@bJe suis sûr que le señor Petros est très surpris, même s'il est au c-c-ciel.\n@c0@"
  it: "@aSancho@b¡Y ahora abbiamo escoperto que l'Eroe Leggendario es tuo figlios, el nipote del señor Russel!\r\n¡Ay, que sorpreson!\n@c0@"
  ja: "@a@bサンチョ「パパスさまも　天国で　さぞ\n\tビックリなさっているでしょうな。\n@c0@"
264:
  de: "@a%0%a001240@bSchon die ganze Zeit kam es mir so vor, als würde mich irgendetwas rufen. Jetzt weiß ich, dass es der Zenithiahelm war.\n@c0@"
  en: "@a%0%a001240@bI've been feeling like something's calling out to\nme ever since we arrived here. Looks like it was\nthe Zenithian Helm.\n@c0@"
  es: "@a%0%a001240@bDesde que llegamos aquí, he sentido como si algo me llamara. Parece que era el Yelmo de Zenithia.\n@c0@"
  fr: "@a%0%a001240@bDepuis qu'on est arrivés ici, j'avais l'impression que quelque chose m'appelait. Apparemment, c'était le Casque zénithien.\n@c0@"
  it: "@a%0%a001240@bFin da quando siamo arrivati qui, mi è sembrato che qualcuno, o qualcosa, mi stesse chiamando. Ora capisco che era l'Elmo Zenithiano che mi cercava...\n@c0@"
  ja: "@a@b%a001240「この国に　来たときから\n\tなにかに　呼ばれてる気がしたんだけど\n\t天空のかぶとが　呼んでたんだね。\n@c0@"
265:
  de: "@a%0%a001250@bIch bin zwar nicht der legendäre Held und so, aber du liebst mich doch trotzdem, oder, Papa?\n@c0@"
  en: "@a%0%a001250@bI'm not the legendary hero or anything, but you do still love me, right, Dad?\n@c0@"
  es: "@a%0%a001250@bYo no soy un héroe legendario ni nada, pero tú me sigues queriendo, ¿no, papi?\n@c0@"
  fr: "@a%0%a001250@bJe ne suis pas le héros légendaire ni rien, mais tu m'aimes quand même encore, hein, papaⓡ\n@c0@"
  it: "@a%0%a001250@bPapà, ma tu mi vuoi bene anche se io non sono un'eroina leggendaria?\n@c0@"
  ja: "@a@b%a001250「わたしは　勇者じゃないけど\n\tわたしのことも　好きでいてよね。\n\tお父さん……。\n@c0@"
266:
  de: "@aOtto@bÄhm... Gehen wir nach oben oder nach unten?\n@c0@"
  en: "@aTuppence@bUm... Are we going up or down?\n@c0@"
  es: "@aAlazar@bEsto... ¿Subimos o bajamos?\n@c0@"
  fr: "@aInnocent@bHum... On monte ou on descendⓡ\n@c0@"
  it: "@aSimon@bChe si fa?\nSi sale o si scende?\n@c0@"
  ja: "@a@bピピン「ええと……\n\t今って　上ってるんでしたっけ？\n\t下りてるんでしたっけ？\n@c0@"
267:
  de: "@aOtto@bDiese ganzen Treppen sind wirklich verwirrend!\n@c0@"
  en: "@aTuppence@bAll these stairs have gone and got me quite confused!\n@c0@"
  es: "@aAlazar@b¡Todas esas escaleras me han despistado bastante!\n@c0@"
  fr: "@aInnocent@bAvec toutes ces marches, je ne sais plus où\nj'en suisⓠ\n@c0@"
  it: "@aSimon@bTutte queste scale mi confondono...\n@c0@"
  ja: "@a@bピピン「階段　階段で\n\tもう　わけが　わかりませんよ！\n@c0@"
268:
  de: "@aOtto@bWenn ich als Euer Sohn geboren wäre... wäre ich dann...? Ha ha ha!\n@c0@"
  en: "@aTuppence@bIf I'd been born as your son...\nDoes that mean I would've been...? Ha ha!\n@c0@"
  es: "@aAlazar@bSi yo hubiera sido hijo vuestro...\r\n¿Habría sido entonces...? ¡Ja, ja!\n@c0@"
  fr: "@aInnocent@bSi j'avais été votre fils...\nÇa veut dire que j'aurais été...ⓡ Ha haⓠ\n@c0@"
  it: "@aSimon@bNon so che darei per essere l'Eroe Leggendario!\nLe ammiratrici urlanti, i poeti che narrano le mie gesta... Sì, potrei abituarmi a una vita del genere...\n@c0@"
  ja: "@a@bピピン「ボクが　%a000090さまの\n\t子供として　生まれていたら…\n\tそしたら　このボクが……！？\n@c0@"
269:
  de: "@aGriselda@bHmpf. Dieser Sand ⓚⓛ er klebt schon überall an mir! Ich will ein Bad!\n@c0@"
  en: "@aDebora@bHmph. There's sand all over the place and all over me. I want a bath.\n@c0@"
  es: "@aStefania@bMmmf. Hay arena por todas partes, yo incluida.\r\nNecesito un bagno.\n@c0@"
  fr: "@aPandora@bMmpf. Il y a du sable partout, y compris sur moi.\r\nJe veux un bain.\n@c0@"
  it: "@aViola@bPuah!\nHo la bocca impastata di sabbia!\n@c0@"
  ja: "@a@bデボラ「もうっ　ひどい砂ぼこりね。\n\tおかげで　全身が　砂まみれよ。\n\t早く　お風呂に入りたいわ。\n@c0@"
270:
  de: "@aGriselda@bWir sollten so schnell wie möglich nach innen gehen. Es ist schlecht für die Haut, zu lange in der Sonne zu bleiben.\n@c0@"
  en: "@aDebora@bWe should go indoors as soon as we can. It's not good to be out in strong sunshine for too long.\n@c0@"
  es: "@aStefania@bDeberíamos entrar en alguna parte enseguida. No es buono quedarse bajo el sole tanto tiempo.\n@c0@"
  fr: "@aPandora@bNous devrions aller à l'intérieur dès que possible.\r\nÇa n'est pas bon de rester trop longtemps au\r\nrond du soleil.\n@c0@"
  it: "@aViola@bStare troppo tempo esposti al sole non fa bene alla pelle. Vedi di trovare un luogo al coperto, caro.\nE in fretta!\n@c0@"
  ja: "@a@bデボラ「早く　どこか\n\t建物の中に　入りましょう。\n\t強い日差しは　おハダに良くないのよ。\n@c0@"
271:
  de: "@aGriselda@bIch bin eine Nachfahrin des legendären Helden, also trage ich auch das Blut Zenithias in mir.\n@c0@"
  en: "@aDebora@bIf I'm a descendant of the legendary hero, that means I must have some Zenithian blood in me.\n@c0@"
  es: "@aStefania@bMa... si desciendo del héroe legendario, eso quiere decir que mi sangre es en parte de Zenithia.\n@c0@"
  fr: "@aPandora@bSi je suis une descendante du héros légendaire, cela signifie que je dois posséder du sang zénithien.\n@c0@"
  it: "@aViola@bQuesto vuol dire che, se fossi una discendente dell'Eroe Leggendario, avrei in me sangue zenithiano...\n@c0@"
  ja: "@a@bデボラ「私が　勇者の子孫だった\n\tということは……　天空人の血を\n\tひいているってことになるわ。\n@c0@"
272:
  de: "@aGriselda@bVielleicht erklärt das ja meine überirdische Schönheit...\n@c0@"
  en: "@aDebora@bPerhaps that explains my other-worldly beauty.\n@c0@"
  es: "@aStefania@bEso explica la mia bellezza de ensueño.\n@c0@"
  fr: "@aPandora@bVoilà qui explique peut-être ma beauté quasi divine.\n@c0@"
  it: "@aViola@bCiò spiegherebbe la mia bellezza ultraterrena...\n@c0@"
  ja: "@a@bデボラ「私の　人間ばなれした美しさは\n\tそのせいだったのね。\n@c0@"
273:
  de: "@aGriselda@bIch habe genug von der Hitze hier. Es wird höchste Zeit, dass wir irgendwohin gehen, wo es kühler ist.\n@c0@"
  en: "@aDebora@bI've had just about enough of the heat here.\r\nIt's high time we went somewhere cooler.\n@c0@"
  es: "@aStefania@bYa estoy más que harta de este calore.\r\nEs hora de que vayamos a alguna parte più fresca.\n@c0@"
  fr: "@aPandora@bJ'en ai assez de la chaleur qui règne ici. Il est grand temps pour nous d'aller dans un endroit plus frais.\n@c0@"
  it: "@aViola@bCaro, non ne posso più di questo caldo...\nSe non mi porti subito in un posto fresco, mi scioglierò come un ghiacciolo al sole!\n@c0@"
  ja: "@a@bデボラ「たしかに　こんな暑い所には\n\tいたくないしね。　私なら　もっと\n\tすずしい場所で　すごすわ。\n@c0@"
274:
  de: "@aGriselda@b%0%a000090, wenn das alles hier vorbei ist, werden wir bei uns auch einen Garten anlegen, aber einen, der viel schöner ist als dieser. Verstanden?\n@c0@"
  en: "@aDebora@b%0%a000090, when this is all over, we'll make a garden in our castle to rival this one. Got it?\n@c0@"
  es: "@aStefania@b%0%a000090, cuando acabemos con tutto questo, haremos construir un jardín así en el castello. ¿Capisci?\n@c0@"
  fr: "@aPandora@b%0%a000090, quand tout cela sera fini, nous créerons dans notre château un jardin rivalisant avec celui-ci, comprisⓡ\n@c0@"
  it: "@aViola@b%0%a000090, mi prometti che quando torneremo a casa realizzerai un giardino tutto per me?\n@c0@"
  ja: "@a@bデボラ「%a000090。　全てが終わったら\n\tうちの城にも　ここに負けない\n\t庭園をつくるわよ。　いいわね？\n@c0@"
275:
  de: "@aGriselda@bOh, das wird wunderbar! Wir legen den schönsten Garten aller Zeiten an und benennen ihn nach mir!\n@c0@"
  en: "@aDebora@bOh, it's going to be wonderful! We'll make the loveliest garden ever and then dedicate it to me!\n@c0@"
  es: "@aStefania@b¡Oh, será meraviglioso! ¡Será el jardín más bello del mundo, y estará dedicado a mí!\n@c0@"
  fr: "@aPandora@bOh, ce sera merveilleuxⓠ Nous en ferons le plus joli jardin qui existe et il me sera ensuite dédiéⓠ\n@c0@"
  it: "@aViola@bVedrai, sarà favoloso!\nIo sceglierò quali fiori metterci, e tu li pianterai, li innaffierai, li poterai e li raccoglierai per me!\n@c0@"
  ja: "@a@bデボラ「ふふっ　楽しみだわ。\n\tステキな庭園を完成させて\n\t私の記念庭園にするのよ。\n@c0@"
276:
  de: "@aGriselda@bDort kann ich dann all die verlorene Zeit mit meinem Volk nachholen. Hach, ich bin eine hervorragende Königin!\n@c0@"
  en: "@aDebora@bI'll be able to spend time there catching up on lost time with my people. Ah, I'm such an excellent queen!\n@c0@"
  es: "@aStefania@bPasaré horas allí, recuperando el tiempo con la mia famiglia y súdbitos. ¡Soy la mejor de las reinas, eso sicuro!\n@c0@"
  fr: "@aPandora@bJe pourrai y passer des heures à rattraper le\ntemps perdu avec les gens qui m'entourent.\nAh, je suis une reine si remarquableⓠ\n@c0@"
  it: "@aViola@bPoi riceverò lì i nostri ospiti, intrattenendoli in amabili conversazioni. Ah, l'idea di avere un giardino tutto mio mi manda in brodo di giuggiole!\n@c0@"
  ja: "@a@bデボラ「そして　私と　国民との\n\t失われた時間を　取り戻すのよ。\n\t私って……　よい王妃だわ。\n@c0@"
277:
  de: "@aGriselda@bEgal. Deine Meinung zählt sowieso nicht. Wenn ich entscheide, dass wir einen Garten anlegen, bekommen wir auch einen!\n@c0@"
  en: "@aDebora@bNever mind. Your opinion doesn't count for anything. If I've decided on a garden, I'm having a garden.\n@c0@"
  es: "@aStefania@bNo importa. Tu opinión no cuenta. Quiero tener un giardino y tendré un giardino... Si sabes lo que te conviene.\n@c0@"
  fr: "@aPandora@bPeu importe. Ton opinion ne compte pas, de toute façon. Si je veux un jardin, j'aurai un jardin.\n@c0@"
  it: "@aViola@bCome sarebbe a dire ⓕnoⓖ?!\nDesidero un giardino tutto mio, e tu lo farai!\nChe tu lo voglia o meno!\n@c0@"
  ja: "@a@bデボラ「あんたの意見なんて　聞いてないわ。\n\t私がつくると言ったら　つくるのよ。\n@c0@"
278:
  de: "@aGriselda@bWelch ein herrlicher Duft! Na, nach diesem Sandsturm kommt uns wohl alles herrlich vor...\n@c0@"
  en: "@aDebora@bWhat a lovely smell! I suppose it's all the more welcome because we've been traipsing about in\r\na sandstorm. \n@c0@"
  es: "@aStefania@b¡Qué bien huele! Y más aún después de habernos paseado por una tempesta di arena. \n@c0@"
  fr: "@aPandora@bQuel délicieux parfumⓠ Et après avoir marché dans une tempête de sable, il est d'autant plus agréable.\n@c0@"
  it: "@aViola@bChe profumo meraviglioso!\nAaah! Mi sembra di rinascere!\n@c0@"
  ja: "@a@bデボラ「ああ　いいかおりだわ。\n\t砂嵐の中を　歩いてきたせいで\n\tよけいに　そう感じるのかしら。\n@c0@"
279:
  de: "@aGriselda@bLauf los und hole %a001240, %a000090. Na los, beeil dich!\n@c0@"
  en: "@aDebora@bGo and get %a001240, %a000090.\nGo on! Hurry!\n@c0@"
  es: "@aStefania@bVe a buscar a %a001240, %a000090.\n¡Vamos! ¡Presto!\n@c0@"
  fr: "@aPandora@bVa chercher %a001240, %a000090.\nAllezⓠ Dépêche-toiⓠ\n@c0@"
  it: "@aViola@bForza, %a000090!\nVai a prendere %a001240!\nDai, non perdere tempo!\n@c0@"
  ja: "@a@bデボラ「%a000090。\n\t%a001240をここへ連れてきなさい。\n\tほら　急いで行くのよ！\n@c0@"
280:
  de: "@aGriselda@bDieser Helm...\n@c0@"
  en: "@aDebora@bThat helmet...\n@c0@"
  es: "@aStefania@bEse yelmo...\n@c0@"
  fr: "@aPandora@bCe casque...\n@c0@"
  it: "@aViola@bL'elmo..\n@c0@"
  ja: "@a@bデボラ「あの　カブトって……。\n@c0@"
281:
  de: "@aGriselda@bEs versteht sich ja von selbst, dass er etwas Besonderes ist ⓚⓛ immerhin ist er mein Sohn. \n㈡\nAber selbst ich hätte nicht gedacht, dass er der legendäre Held ist!\n@c0@"
  en: "@aDebora@bIt stands to reason that he's special ⓚⓛ he's my son ⓚⓛ but even I didn't expect him to be the legendary hero!\n@c0@"
  es: "@aStefania@bClaro que es speziale, es mi hijo. ¡Ma ni siquiera yo pensaba que fuese el héroe legendario!\n@c0@"
  fr: "@aPandora@bIl va de soi qu'il est unique, puisque c'est mon fils, mais même moi je ne m'attendais pas à ce qu'il\nsoit le héros légendaireⓠ\n@c0@"
  it: "@aViola@bSapevo che %a001240 è un bambino speciale, ma non avrei mai immaginato che fosse lui l'Eroe Leggendario!\n@c0@"
  ja: "@a@bデボラ「私の子なんだから　良い子なのは\n\t当然だけど　伝説の勇者だったなんて\n\tさすがに　おどろいたわ。　上出来すぎ！\n@c0@"
282:
  de: "@aGriselda@bIn der Wüste wird es nachts ziemlich kalt. Wenn wir uns keine Erkältung einfangen wollen, sollten wir uns so schnell wie möglich eine Bleibe suchen.\n@c0@"
  en: "@aDebora@bThe desert gets very cold at night. It'd be stupid of us if we ended up catching a chill, so we'd better hurry up and find a place to stay.\n@c0@"
  es: "@aStefania@bEn el desierto fa mucho fredo de notte. Será mejor que encontremos un lugar para quedarnos antes de que nos acatarremos, ¿capisci?\n@c0@"
  fr: "@aPandora@bIl fait très froid dans le désert, la nuit. Ce serait stupide de notre part d'attraper froid.\n㈡\nNous devrions nous dépêcher de trouver un endroit où passer la nuit.\n@c0@"
  it: "@aViola@b%0%a000090, dobbiamo trovare un luogo per riposare. Di notte il deserto è freddo, e non possiamo restare all'aperto...\n@c0@"
  ja: "@a@bデボラ「砂漠の夜って　寒いわね。\n\t風邪をひくのも　バカらしいし\n\t早く　宿へ行きましょう。\n@c0@"
283:
  de: "@aGriselda@bDas kann doch nicht der kleine Junge sein, den wir damals hier gesehen haben, oder? Wie die Zeit vergeht...\n@c0@"
  en: "@aDebora@bSurely this can't be the little boy we met the last time we were here? So much time has passed!\n@c0@"
  es: "@aStefania@b¡No puede ser que este sea el ragazzo que conocimos cuando estuvimos aquí! ¡Ha pasado mucho tiempo!\n@c0@"
  fr: "@aPandora@bÇa ne peut quand même pas être le petit garçon que nous avons rencontré lors de notre denière visiteⓡ Il s'est passé tellement de tempsⓠ\n@c0@"
  it: "@aViola@bSbaglio o questo è il ragazzino che incontrammo l'altra volta che venimmo qui?! Possibile che sia passato tanto tempo da allora...?\n@c0@"
  ja: "@a@bデボラ「まさか　この男って\n\t以前ここへ来た時に会った　あの子なの？\n\tもう　そんなに時間が　たっていたなんて。\n@c0@"
284:
  de: "@aGriselda@bSturer alter Mann! Die arme Nofretutti hatte es bestimmt nicht leicht mit ihm. Ich kenne das.\n@c0@"
  en: "@aDebora@bStubborn old man! Poor Cleo sounds like she's had quite a time of it with him. I know the feeling.\n@c0@"
  es: "@aStefania@b¡Vecchio testarudo! Parece que la pobre Nefertita está más que harta de él. Conozco esa sensación.\n@c0@"
  fr: "@aPandora@bQuel vieux têtuⓠ La pauvre Néferlili a l'air d'en\navoir bavé, avec lui. Je sais ce que c'est.\n@c0@"
  it: "@aViola@bMa l'hai sentito?!\nCome può un padre dire che la figlia non è la benvenuta?!\n@c0@"
  ja: "@a@bデボラ「ガンコなおじさんね。\n\tあのクラリスって娘も　苦労しそうだわ。\n\t私みたいに。\n@c0@"
285:
  de: "@aGriselda@bWenn die ganzen Sandstürme und die unerträgliche Hitze nicht wären, könnte das hier ein ganz hübscher Ort sein.\n@c0@"
  en: "@aDebora@bIf it wasn't for the sandstorms and the sun being unbearably strong, this wouldn't be such a bad place to live.\n@c0@"
  es: "@aStefania@bSi no fuese por las tormentas de arena y el calor intolerable, este sitio no estaría mal per vivere.\n@c0@"
  fr: "@aPandora@bHormis les tempêtes de sable et le soleil qui tape horriblement fort, cet endroit ne serait pas désagréable à vivre.\n@c0@"
  it: "@aViola@bSe non fosse per il caldo insopportabile, le tempeste di sabbia e la mancanza di negozi d'abbigliamento alla moda, il deserto non sarebbe poi tanto male...\n@c0@"
  ja: "@a@bデボラ「砂ぼこりがなくて\n\tもう少し　日差しが弱ければ\n\tここも　それほど　悪くはないんだけど。\n@c0@"
286:
  de: "@aGriselda@bIch wusste gar nicht, dass du ein Ohr für Musik hast, %a000090. Hach, so eine Ehe steckt voller Überraschungen, nicht?\n@c0@"
  en: "@aDebora@bI didn't know you had an ear for music, %a000090. Marriage is full of surprises, isn't it?\n@c0@"
  es: "@aStefania@bVeramente, no sabía que tuvieses oído para la música, %a000090. Qué sorpresas te da el matrimonio, ¿eh?\n@c0@"
  fr: "@aPandora@bJe ne te savais pas l'oreille musicale, %a000090. Le mariage réserve bien des surprises,\nn'est-ce pasⓡ\n@c0@"
  it: "@aViola@b%0%a000090, perché non scrivi un inno alla bellezza? Per farti venire l'ispirazione non dovresti fare altro che guardare me...\n@c0@"
  ja: "@a@bデボラ「あんたに　歌の良し悪しが\n\tわかるなんて　意外だったわ。\n\tやっぱり　結婚って　おどろきの連続ね。\n@c0@"
287:
  de: "@aGriselda@bDir hat das Lied doch nicht etwa gefallen, oder? Es war absolut grauenhaft! Und erst der Text...!\n@c0@"
  en: "@aDebora@bYou didn't really like that song, did you?\r\nIt was rubbish! And as for the lyrics...!\n@c0@"
  es: "@aStefania@bSupongo que veramente no te gustaría esa canzone, ¿eh?\r\n¡Era un espanto! Y la letra... ¡puf!\n@c0@"
  fr: "@aPandora@bTu n'as pas réellement aimé cette chanson,\nquand mêmeⓡ C'était nulⓠ\nEt quant aux paroles, franchement...ⓐ\n@c0@"
  it: "@aViola@bBah, ho sentito canzoni migliori...\nLa melodia è banale, e le parole appena accettabili.\n@c0@"
  ja: "@a@bデボラ「あんた　歌に　感動してるの？\n\tひどい歌　なのに。\n\tある意味　すごいわね。\n@c0@"
288:
  de: "@aGriselda@bIch bin eine Nachfahrin des legendären Helden, also trage ich auch das Blut Zenithias in mir.\n@c0@"
  en: "@aDebora@bIf I'm a descendant of the legendary hero, that means I must have some Zenithian blood in me.\n@c0@"
  es: "@aStefania@bMa... si desciendo del héroe legendario, eso quiere decir que mi sangre es en parte de Zenithia.\n@c0@"
  fr: "@aPandora@bSi je suis une descendante du héros légendaire, cela signifie que je dois posséder du sang zénithien.\n@c0@"
  it: "@aViola@bQuesto vuol dire che, se fossi una discendente dell'Eroe Leggendario, avrei in me sangue zenithiano...\n@c0@"
  ja: "@a@bデボラ「私が　勇者の子孫だった\n\tということは……　天空人の血を\n\tひいているってことになるわ。\n@c0@"
289:
  de: "@aGriselda@bVielleicht erklärt das ja meine überirdische Schönheit... Und ich bin mir sicher, dass %a001250 auch zu einer hübschen jungen Dame heranwächst.\n@c0@"
  en: "@aDebora@bPerhaps that explains my other-worldly beauty.\nI'm sure %a001250's going to be lovely too.\n@c0@"
  es: "@aStefania@bEso explica mi bellezza de ensueño.\nSeguro que %a001250 será igual de bella que io.\n@c0@"
  fr: "@aPandora@bVoilà qui explique peut-être ma beauté quasi divine.\n%0%a001250 sera ravissante, elle aussi,\nj'en suis sûre.\n@c0@"
  it: "@aViola@bCiò spiegherebbe la mia bellezza ultraterrena...\nTanto meglio per %a001250: vuol dire che anche lei diventerà una donna di sfolgorante bellezza!\n@c0@"
  ja: "@a@bデボラ「私が　人間ばなれした美しさなのは\n\tそのせいだったのね。\n\t%a001250もきっと　キレイになるわよ。\n@c0@"
290:
  de: "@aGriselda@bWer hätte gedacht, dass wir mal die Helden eines Märchens werden.\n@c0@"
  en: "@aDebora@bI never imagined we'd turn out to be the heroes of a faerie tale.\n@c0@"
  es: "@aStefania@bNunca pensé que nos convertiríamos en héroes di fabola.\n@c0@"
  fr: "@aPandora@bJe n'aurais jamais imaginé que nous finirions\r\npar être les héros d'un conte de fées.\n@c0@"
  it: "@aViola@bStiamo vivendo un'avventura fantastica...\n@c0@"
  ja: "@a@bデボラ「まさか　私たちが\n\tおとぎ話の　主人公になるなんて\n\t思ってもいなかったわ。\n@c0@"
291:
  de: "@aGriselda@bEs ist eine große Last, aber wir werden natürlich unser Bestes geben ⓚⓛ ich mag keine halben Sachen!\n@c0@"
  en: "@aDebora@bIt's a bit of a chore, but I can't stand it when people do a half-baked job of things, so we'd better give it all we've got.\n@c0@"
  es: "@aStefania@bNos va a costar mucho, pero no soporto a la gente que hace las cosas a medias, así que vamos a hacerlo lo mejor que podamos, ¿capisci?\n@c0@"
  fr: "@aPandora@bC'est un peu une corvée, mais je déteste quand les gens font les choses à moitié, alors nous devons faire tout ce qui est en notre pouvoir.\n@c0@"
  it: "@aViola@bCerto, non è affatto facile, ma ormai siamo in ballo e dobbiamo ballare! Se daremo il massimo, riusciremo a salvare il mondo!\n@c0@"
  ja: "@a@bデボラ「めんどうなことは　キライだけど\n\tハンパなことは　もっとイヤなの。\n\tやるからには　思いっきりやるわよ！\n@c0@"
292:
  de: "@aGriselda@bSie entführen die Kinder, weil sie Angst vor dem legendären Helden haben, und was ist geschehen?\n㈡\nDer legendäre Held wurde geboren! Sehr ironisch das Ganze...\n@c0@"
  en: "@aDebora@bHow ironic that their kidnapping children because they were afraid they'd turn out to be the legendary hero actually led to the hero being born.\n@c0@"
  es: "@aStefania@b¡Ma, qué ironía! Secuestran a niños por miedo a que sean el héroe legendario, y eso es lo que hace que el héroe legendario nazca. \n@c0@"
  fr: "@aPandora@bQuelle ironieⓢ c'est justement le fait d'enlever des enfants en craignant qu'ils ne deviennent le héros légendaire qui a conduit à sa naissance.\n@c0@"
  it: "@aViola@bI rapitori di bambini non sono comunque riusciti a impedire la nascita dell'Eroe Leggendario...\n@c0@"
