  it: "@a%0%a001240@bPapà, spero che il fatto che io sono l'Eroe Leggnedario non cambi niente...\nResto sempre tuo figlio, non è vero?\n@c0@"
  ja: "@a@b%a001240「お父さん。\n\tボク　勇者になっても\n\tお父さんの子どもだよね？　ね？\n@c0@"
188:
  de: "@a%0%a001250@bDas ist alles ein wenig traurig. %a001240 und ich stehen uns irgendwie nicht mehr so nah wie früher.\n@c0@"
  en: "@a%0%a001250@bIt's a bit sad, really. I feel like there's a sort of distance between us and %a001240 now.\n@c0@"
  es: "@a%0%a001250@bEs un poco triste en realidad. Siento que ahora hay una distancia entre %a001240 y yo.\n@c0@"
  fr: "@a%0%a001250@bC'est un peu triste. J'ai l'impression qu'il y a une sorte de distance entre %a001240 et nous, maintenant.\n@c0@"
  it: "@a%0%a001250@bNon vorrei che questa storia dell'Eroe Leggendario allontanasse %a001240 da noi...\nNon è che ora mio fratello si monterà la testa?!\n@c0@"
  ja: "@a@b%a001250「%a001240が　ちょっと\n\t遠い人に　なっちゃったみたいで\n\tさみしいな……。\n@c0@"
189:
  de: "@aOtto@bKönigin Kleohutra...\nWas für ein wunderschöner Name!\n@c0@"
  en: "@aTuppence@bQueen Cleohatra...\nWhat a beautiful name!\n@c0@"
  es: "@aAlazar@bReina Leopatra...\r\n¡Qué hermoso nombre!\n@c0@"
  fr: "@aInnocent@bReine Toutankhanon...\nQuel nom magnifiqueⓠ\n@c0@"
  it: "@aSimon@bCleo, la Regina del Deserto...\nAh, che splendido nome!\n@c0@"
  ja: "@a@bピピン「アイシス女王……\n\t美しい　ひびきだ。　ふっ……。\n@c0@"
190:
  de: "@a%0%a001250@bWas, glaubst du, muss man tun, um Königin zu werden? Man muss bestimmt eine Menge lernen, oder?\n@c0@"
  en: "@a%0%a001250@bWhat do you suppose you have to do to\nbecome queen? Do you think you just have\nto study really hard?\n@c0@"
  es: "@a%0%a001250@b¿Qué piensas que hay que hacer para ser reina? ¿Crees que me bastaría con estudiar mucho?\n@c0@"
  fr: "@a%0%a001250@bTu crois qu'il faut faire quoi, pour devenir reineⓡ Tu penses qu'il suffit d'étudier vraiment beaucoupⓡ\n@c0@"
  it: "@a%0%a001250@bCome si fa a diventare regina di un posto?\nBisogna frequentare qualche scuola particolare?\n@c0@"
  ja: "@a@b%a001250「女王さまって\n\tどうやったら　なれるのかな？\n\tいっぱい　お勉強したら　なれる？\n@c0@"
191:
  de: "@a%0%a001240@bDie Welt retten? Hm, ich werde natürlich mein Bestes geben. Du kommst doch mit und hilfst mir, nicht wahr, Papa?\n@c0@"
  en: "@a%0%a001240@bThe world is saved? Yes, well, I'll do my best. You're going to come with me and help out, right, Dad?\n@c0@"
  es: "@a%0%a001240@b¿Seré su salvación? Sí, bueno, haré todo lo que pueda. Tú vendrás conmigo para ayudarme, ¿verdad, papá?\n@c0@"
  fr: "@a%0%a001240@bLe monde est sauvéⓡ Oui, enfin... je vais faire de mon mieux. Tu vas venir avec moi et m'aider,\nhein, papaⓡ\n@c0@"
  it: "@a%0%a001240@bQuel signore vuol dire che devo salvare il mondo?!\nMa è una cosa troppo difficile! Papà, io ce la metterò tutta, ma mi prometti che mi aiuterai?\n@c0@"
  ja: "@a@b%a001240「世界を救うって…　うん。\n\tボク　がんばるけど…　お父さんも\n\tいっしょに来てくれるよね？　ね？\n@c0@"
192:
  de: "@aBianca@bJawohl. Wir werden alle unser Bestes geben, nicht, %a000090? Es wäre doch schön, wenn die Leute wieder glücklich sein könnten.\n@c0@"
  en: "@aBianca@bYep. We'd better give it our all, eh, %a000090? It'll be nice to put smiles back on folks' faces.\n@c0@"
  es: "@aBianca@bSí. Tendremos que echar el resto, ¿eh, %a000090?\n㈡\nSería bonito devolver la sonrisa a las caras de la gente.\n@c0@"
  fr: "@aBianca@bOui. Nous avons intérêt à faire tout ce que nous pouvons, hein, %a000090ⓡ Ce sera bien de rendre le sourire à tous ces gens.\n@c0@"
  it: "@aBianca@bVedrai che ce la faremo, %a000090.\nRiporteremo la pace nel mondo e il sorriso sul volto degli uomini...\n@c0@"
  ja: "@a@bビアンカ「うん。　%a000090\n\tみんなの　よろこぶ顔を見るまで\n\tがんばろうね！\n@c0@"
193:
  de: "@aNera@bDie Welt ist nicht automatisch gerettet, nur weil es den Helden gibt. Das wird eine ganze Menge Arbeit.\n@c0@"
  en: "@aNera@bThe world isn't saved automatically just because the hero exists. It's going to take a lot of effort.\n@c0@"
  es: "@aNera@bMa no están a salvo solo porque exista el héroe. Costará molto sforzo.\n@c0@"
  fr: "@aNera@bLe monde n'est pas instantanément sauvé parce que le héros existe. Cela va demander beaucoup d'efforts.\n@c0@"
  it: "@aNera@bLa sola presenza dell'Eroe Leggendario non basterà per salvare il mondo. Per riportare la pace, dovremo impegnarci al meglio delle nostre possibilità.\n@c0@"
  ja: "@a@bフローラ「いくら　勇者でも\n\t努力なしに　世界は\n\t救えないと　思いますわ。\n@c0@"
194:
  de: "@aNera@bWir müssen unser Bestes geben, um %a001240 zu unterstützen, damit er seine Bestimmung auch erfüllen kann.\n@c0@"
  en: "@aNera@bWe'll have to do our very best to support %a001240 so that he can manage to fulfil his destiny.\n@c0@"
  es: "@aNera@bTendremos que poner mucho de nostra parte para ayudar a %a001240 a cumplir con su destino.\n@c0@"
  fr: "@aNera@bNous allons devoir faire de notre mieux pour soutenir %a001240, afin qu'il réussisse à accomplir sa destinée.\n@c0@"
  it: "@aNera@bDobbiamo aiutare nostro figlio %a001240 in tutti i modi possibili.\nSolo così il suo destino potrà compiersi...\n@c0@"
  ja: "@a@bフローラ「チカラを　あわせて\n\t%a001240たちを　りっぱに\n\t育て上げましょうね。　あなた。\n@c0@"
195:
  de: "@aSancho@bSeñor Ludwig... du, Chico... und %a001240...\n@c0@"
  en: "@aSancho@bSeñor Pankraz...you, friend...and %a001240...\n@c0@"
  es: "@aSancho@bEl señor Teudis... tú, chamaquito... y %a001240...\n@c0@"
  fr: "@aSancho@bLe señor Petros... toi, chico... et %a001240...\n@c0@"
  it: "@aSancho@bEl señor Russel... %a000090... y %a001240...\n@c0@"
  ja: "@a@bサンチョ「パパスさま…　坊っちゃん…\n\tそして　%a001240さま……\n@c0@"
196:
  de: "@aSancho@bSi. %a001240 kann seinem Schicksal nisst entkommen. Deine Onkel Sancho macht siss große Sorgen, Chico.\n@c0@"
  en: "@aSancho@bSí. The fate, ees no gonna be like normal for %a001240. Your Uncle Sancho, he ees very worried, you know.\n@c0@"
  es: "@aSancho@bSí. El destino de %a001240 no va a ser corriente. Tu tito Sancho está muy preocupado, ya sabes.\n@c0@"
  fr: "@aSancho@bSi. %0%a001240 n'aura pas oun destin ordinaire. Tonton Sancho se fait déjà b-b-beaucoup de souci, tu sais.\n@c0@"
  it: "@aSancho@bUn destino pericoloso y glorioso attende %a001240.\nLo zio Sancho es un poco preoccupatos, ma farà todo quello que puede por aiutarlo.\n@c0@"
  ja: "@a@bサンチョ「やはり　%a001240さまも\n\tふつうの子供とは　ちがう運命を\n\tたどるんでしょうか。　心配ですよ。\n@c0@"
197:
  de: "@a%0%a001240@bSo jung bin ich doch gar nicht! Ich stehe nachts schon ganz alleine auf, um Pipi zu machen! Und ich esse immer mein Essen auf!\n@c0@"
  en: "@a%0%a001240@bI'm not all that young! I get up in the night to go to\nthe bathroom all by myself! And I always eat up all my dinner!\n@c0@"
  es: "@a%0%a001240@b¡Ya no soy tan joven! ¡Me levanto por la noche y voy al baño solo! ¡Y siempre me acabo la cena!\n@c0@"
  fr: "@a%0%a001240@bJe ne suis pas si jeune que çaⓠ Je me lève tout seul la nuit pour aller à la salle de bainⓠ Et je finis toujours mon assietteⓠ\n@c0@"
  it: "@a%0%a001240@bNon sono più un bambino!\nDormo da solo, mangio da solo e vado anche a fare la pipì da solo!\n@c0@"
  ja: "@a@b%a001240「ボク　大きいもん！\n\t夜　ひとりでトイレに行けるし\n\t好き嫌いも　ないよ！\n@c0@"
198:
  de: "@a%0%a001250@bSie hat recht. %0%a001240 ist noch sehr klein. Er ist noch nicht mal größer als ich.\n@c0@"
  en: "@a%0%a001250@bShe's right. %0%a001240 is still pretty small.\nHe's no taller than me, even.\n@c0@"
  es: "@a%0%a001250@bTiene razón. %0%a001240 aún es pequeño.\nNi siquiera es más alto que yo.\n@c0@"
  fr: "@a%0%a001250@bElle a raison. %0%a001240 n'est pas très grand.\nIl ne me dépasse même pas.\n@c0@"
  it: "@a%0%a001250@bQuella signora ha ragione. %0%a001240 sarà anche l'Eroe Leggendario, ma è pur sempre un ragazzino che ha bisogno dell'aiuto di tutti noi...\n@c0@"
  ja: "@a@b%a001250「お兄ちゃんって\n\tまだ　小さいよね。\n\t背だって　わたしと同じくらいだし。\n@c0@"
199:
  de: "@aSancho@bSi, das stimmt. %0%a001240 ist zwar der legendäre Held, aber er ist auch eine kleine Niño.\n@c0@"
  en: "@aSancho@bSí, thees ees right. %0%a001240, he ees the legendary hero, but he ees just a leettle boy.\n@c0@"
  es: "@aSancho@bSí, eso es la mera verdad. %0%a001240 es el héroe legendario, pero no es más que un chamaquito.\n@c0@"
  fr: "@aSancho@bSi, c'est vrai. %0%a001240 est le héros légendaire, mais ce n'est qu'oun p-p-petit garçon.\n@c0@"
  it: "@aSancho@bEh, la señora ha ragiones...\n%0%a001240 es l'Eroe Leggendario, ma resta pur siempre un niño...\n@c0@"
  ja: "@a@bサンチョ「そうですとも。\n\t勇者といえども　子供には\n\tかわりありません。\n@c0@"
200:
  de: "@aSancho@bDu musst gut auf ihn aufpassen, si, Chico?\n@c0@"
  en: "@aSancho@bYou must protect heem well, friend.\n@c0@"
  es: "@aSancho@bDebes protegerlo bien, chamaco.\n@c0@"
  fr: "@aSancho@bTu dois bien le p-p-protéger, chico.\n@c0@"
  it: "@aSancho@bDevi fare de todo por proteggerlo, chico.\n@c0@"
  ja: "@a@bサンチョ「坊っちゃんが　ちゃんと\n\t守ってあげてくださいね！\n@c0@"
201:
  de: "@a%0%a001250@bJa, und manchmal macht er auch noch ins Bett!\n... Ähm, aber sag ihm nicht, dass ich das gesagt hab...\n@c0@"
  en: "@a%0%a001250@bYeah, he even still wets the bed sometimes!\n...Er, but don't tell him I told you that.\n@c0@"
  es: "@a%0%a001250@b¡Sí, y todavía hay veces que moja la cama!\nEstooo... pero no le digas que te lo he dicho.\n@c0@"
  fr: "@a%0%a001250@bOuais. Même qu'il fait encore pipi au lit, des foisⓠ\nEuh... Ne lui dis surtout pas que j'ai cafté, heinⓠ\n@c0@"
  it: "@a%0%a001250@bProprio così: l'Eroe Leggendario è solo un bambino, e a volte la fa persino a letto!\nIo non ho detto niente, eh?!\n@c0@"
  ja: "@a@b%a001250「お兄ちゃん　たまに\n\tオネショするのよ。\n\t……わたしが言ったの　ナイショね。\n@c0@"
202:
  de: "@aBianca@bAlso haben sie immer noch kleine Kinder entführt, während wir Statuen waren? Diese Monster!\n@c0@"
  en: "@aBianca@bSo they've still bin snatchin' young kids durin' that time we was statues? Of all the evil things!\n@c0@"
  es: "@aBianca@b¿Que han seguido secuestrando niños mientras éramos estatuas? ¡Hay que ver cuánta maldad!\n@c0@"
  fr: "@aBianca@bAlors ils ont continué à enlever des enfants\npendant qu'on était transformés en statuesⓡ\nQuelle méchancetéⓠ\n@c0@"
  it: "@aBianca@bNon ci posso credere!\nHanno continuato a rapire bambini durante il periodo in cui eravamo pietrificati! È una cosa orribile!\n@c0@"
  ja: "@a@bビアンカ「私たちが　石になっている間も\n\t子供たちが　さらわれ続けてたのかな？\n\t……そんなの　ゆるせない！\n@c0@"
203:
  de: "@aNera@bWie bitte, Kinder werden entführt? Wie schrecklich! Wir müssen uns beeilen und all diesem Unheil ein Ende setzen!\n@c0@"
  en: "@aNera@bChildren are being kidnapped? That's just terrible! We must hurry up and put a stop to all this evil.\n@c0@"
  es: "@aNera@b¿Están secuestrando bambini? ¡Eso es terribile! Debemos darnos prisa y detener esta maldad.\n@c0@"
  fr: "@aNera@bDes enfants sont enlevésⓡ Mais c'est terribleⓠ\nIl faut absolument qu'on arrête ces horreurs\nau plus vite.\n@c0@"
  it: "@aNera@bIl pensiero che rapiscano dei bambini mi fa ribollire il sangue!\nDobbiamo porre fine a questa tragedia!\n@c0@"
  ja: "@a@bフローラ「子供を　さらうなんて……\n\tそんなこと　あってはなりませんわ。\n\tねえ　あなた　先を急ぎましょう。\n@c0@"
204:
  de: "@a%0%a001250@b%0%a001240 und hübsch?! Ha! Die Leute sagen zwar manchmal, dass ich süß wäre, aber dass er hübsch sein soll, kann ich gar nicht finden!\n@c0@"
  en: "@a%0%a001250@b%0%a001240's handsome!? Hah! People often say I look sweet, but I've never heard anyone say he looks handsome before!\n@c0@"
  es: "@a%0%a001250@b¡Que %a001240 es guapo! ¡Ja! La gente suele decir que es entrañable, ¡pero nunca había oído que le llamaran guapo!\n@c0@"
  fr: "@a%0%a001250@b%0%a001240, joliⓡⓐ Pfffⓠ Les gens disent souvent que je suis mignonne, mais je n'avais encore jamais entendu personne dire que lui était joliⓠ\n@c0@"
  it: "@a%0%a001250@b%0%a001240... un bellissimo bambino?! A me sembra normalissimo.\n㈡\nSecondo me quella ragazza si è lasciata influenzare dalla storia dell'Eroe Leggendario...\n@c0@"
  ja: "@a@b%a001250「お兄ちゃんって　かわいい？\n\tわたしのほうが　かわいいって\n\tよく　言われるよ！\n@c0@"
205:
  de: "@aSancho@bSi. Er ist hübsch. Und lieb und klug und... ein Macho!\n@c0@"
  en: "@aSancho@bSí. He ees handsome. And kind, and wise,\r\nand macho!\n@c0@"
  es: "@aSancho@bSí. Es guapo. ¡Y educado, y sabio, y retevaliente!\n@c0@"
  fr: "@aSancho@bSi. Il est joli. Et g-g-gentil, et sage, et c-courageuxⓠ\n@c0@"
  it: "@aSancho@bSì, %a001240 es realmentes un bellissimo niño.\nY es anche fuerte, coraggioso y saggio!\n@c0@"
  ja: "@a@bサンチョ「かわいいだけじゃなく\n\t利発で　やさしくて\n\tしかも　たくましい　お子さんです。\n@c0@"
206:
  de: "@aSancho@bUnd %a001250 ist genauso. Nisst wahr, Chico?\n@c0@"
  en: "@aSancho@bAnd %a001250, eshe ees the esame.\nEes true, no, friend?\n@c0@"
  es: "@aSancho@bY %a001250 es igual.\n¿No es verdad, chamaco?\n@c0@"
  fr: "@aSancho@bEt c'est p-p-pareil pour %a001250.\nC'est vrai, no, chicoⓡ\n@c0@"
  it: "@aSancho@b¡Però %a001250 no es certo da menos!\n¡Anche lei es una niña maravillosa!\n@c0@"
  ja: "@a@bサンチョ「もちろん　%a001250さまも。\n\tねっ　坊っちゃん。\n@c0@"
207:
  de: "@aOtto@bLeider scheint es ganz so, als würde mich hier niemand mehr auch nur eines Blickes würdigen.\n@c0@"
  en: "@aTuppence@bI'm afraid it doesn't look like anyone here is going to have eyes for me now.\n@c0@"
  es: "@aAlazar@bMucho me temo que ahora nadie va a tener ojos para mí.\n@c0@"
  fr: "@aInnocent@bÀ mon grand regret, on dirait qu'il n'y a plus\r\naucune chance pour que quelqu'un s'intéresse\r\nà moi, maintenant.\n@c0@"
  it: "@aSimon@bSigh! La gente ha occhi solo per l'Eroe Leggendario...\nAlmeno per il momento, dovrò dire addio agli sguardi sognanti delle mie numerose ammiratrici...\n@c0@"
  ja: "@a@bピピン「このお城では　もう　誰も\n\tボクに　注目してくれそうにないなあ。\n@c0@"
208:
  de: "@a%0%a001250@bMädchen können manchmal richtig dumm sein. Wieso macht sie so viel Theater wegen %a001240?\n@c0@"
  en: "@a%0%a001250@bGirls like that are so silly. Why would she swoon over someone like %a001240?\n@c0@"
  es: "@a%0%a001250@bLas chicas así son tontas. ¿Por qué iba a ponerse alguien a gritar por alguien como %a001240?\n@c0@"
  fr: "@a%0%a001250@bQu'est-ce que c'est bête, les filles comme ça. Pourquoi elle deviendrait hystérique à cause de quelqu'un comme %a001240ⓡ\n@c0@"
  it: "@a%0%a001250@bQuella ragazza deve avere seri problemi di vista...\nCosa ci troverà di tanto bello in %a001240, eh?!\n@c0@"
  ja: "@a@b%a001250「わたし　知ってるよ。\n\tああいう　お姉さんを\n\tミーハー　って言うのよね。\n@c0@"
209:
  de: "@a%0%a001240@bMann, hat die eine Stimme. Meine Ohren tun jetzt noch weh von all dem Geschrei...\n@c0@"
  en: "@a%0%a001240@bShe's got quite a voice on her! My ears are ringing from all that squealing she just did.\n@c0@"
  es: "@a%0%a001240@b¡Menuda voz tiene! Aún me zumban los oídos\npor el chillido que dio.\n@c0@"
