  es: "@aBianca@bParece un sueño poder visitar estos sitios de nuevo contigo, ¿sabes?\n@c0@"
  fr: "@aBianca@bPouvoir visiter à nouveau des endroits comme ça avec toi me donne l'impression de vivre un rêve.\n@c0@"
  it: "@aBianca@bSono felice di avere avuto la possibilità di rivedere questi posti...\nViaggiare con te è bellissimo, amore mio...\n@c0@"
  ja: "@a@bビアンカ「こうして　また　ここに\n\t%a000090たちと　いっしょに\n\t来られるなんて　夢みたい……。\n@c0@"
108:
  de: "@aNera@bDiese Kälte ist nichts im Vergleich zu dem Schmerz, der mir all die Jahre, in denen ich von dir und den Kindern getrennt war, in der Seele brannte.\n@c0@"
  en: "@aNera@bSuffering this cold is nothing compared to the agony I was in during all those years I was away from you and the children.\n@c0@"
  es: "@aNera@bSofrire este freddo no es nada comparado con la agonía que pasé todos estos años lontano da te y de los niños.\n@c0@"
  fr: "@aNera@bSupporter ce froid n'est rien comparé à la souffrance que j'ai endurée toutes ces années, séparée de toi et des enfants.\n@c0@"
  it: "@aNera@bQuesto freddo non è nulla a paragone della sofferenza che ho provato durante gli anni trascorsi lontano da te e dai nostri figli...\n@c0@"
  ja: "@a@bフローラ「この寒さも　あなたや\n\t子供たちのいない日々にくらべたら…\n\tどうってこと　ありませんわ。\n@c0@"
109:
  de: "@a%0%a001240@bJetzt können wir wohl eh nichts mehr ausrichten. Und ich bin auch ganz schön müde...\n@c0@"
  en: "@a%0%a001240@bLooks like we can't do anything of a night.\nI'm pretty tired now, anyhow.\n@c0@"
  es: "@a%0%a001240@bParece que no podemos hacer nada de noche.\nEstoy un poco cansado, de todas formas.\n@c0@"
  fr: "@a%0%a001240@bApparemment, il n'y a rien à faire pendant la nuit.\nEt puis de toute façon, je suis très fatigué.\n@c0@"
  it: "@a%0%a001240@bDi notte non possiamo fare niente, vero?\nAllora perché non ci riposiamo un po'?\nSono stanchissimo...\n@c0@"
  ja: "@a@b%a001240「夜は　ダメなんだ。\n\tうん…　ボク　もう　眠くて……。\n\tふわぁ～っ。\n@c0@"
110:
  de: "@a%0%a001250@b(Gähn) Mir geht's gut. Ich bin überhaupt nicht... müde.\n@c0@"
  en: "@a%0%a001250@b(yawn) I'm fine. I'm not...sleepy...at all yet. \n@c0@"
  es: "@a%0%a001250@b(aaah) Estoy bien. No tengo... sueño... todavía.\n@c0@"
  fr: "@a%0%a001250@b(bâillement) Je vais bien. Je n'ai pas... du tout... sommeil, pour l'instant.\n@c0@"
  it: "@a%0%a001250@bYawn...\nChe sonno...\nYaaawn...\n@c0@"
  ja: "@a@b%a001250「わたしは　大丈夫。\n\t眠くなんか　ない…　もん。\n\tうと　うと……。\n@c0@"
111:
  de: "@aSancho@bWeißt du nisst mehr, was deine Onkel Sancho dir immer gesagt hat, no? Du sollst die Leute nur tagsüber besuchen, nisst in der Notte, Chico.\n@c0@"
  en: "@aSancho@bYou no remember what your Uncle Sancho always tell you, friend? You always visit people een the daylight hours.\n@c0@"
  es: "@aSancho@b¿No recuerdas lo que siempre te dice tu tito Sancho, chamaco? Cuando de día, hay que visitar a la gente.\n@c0@"
  fr: "@aSancho@bTu as oublié ce que tonton Sancho t'a appris,\nchicoⓡ On ne r-r-rend visite aux gens que\np-pendant la journée.\n@c0@"
  it: "@aSancho@bRecuerda el consiglio dello zio Sancho, chico...\nSi vuoi fare una visita a qualcunos, vacce durantes el día.\n@c0@"
  ja: "@a@bサンチョ「よそさまを　訪ねる時は\n\t明るいうちに　なさいまし。\n\tねっ　坊っちゃん！\n@c0@"
112:
  de: "@aBianca@bEs ist nicht nur kalt, sondern absolut eisig! Wir sollten irgendwo übernachten, bevor wir uns hier draußen sonst noch was holen.\n@c0@"
  en: "@aBianca@bIt's not just cold, it's blimmin' freezin'! We should rest for the night before we freeze our whatsits off.\n@c0@"
  es: "@aBianca@b¡No es que haga frío, es que está helando! Deberíamos descansar lo que queda de noche antes de que nos congelemos o lo que sea, ¿sabes?\n@c0@"
  fr: "@aBianca@bIl ne fait pas seulement froid, on gèle, ouiⓠ\nOn devrait aller dormir avant de mourir congelés.\n@c0@"
  it: "@aBianca@bMa qui fa un freddo cane!\r\nPerché non troviamo un posto caldo e tranquillo dove riposare un po'?\n@c0@"
  ja: "@a@bビアンカ「本当に　さむいわね。\n\tこごえないうちに　今日はもう\n\t休みましょう。\n@c0@"
113:
  de: "@aNera@bGute Güte. Ich hoffe, der Nonne geht es gut...\n@c0@"
  en: "@aNera@bDear me. I hope that nun's feeling alright.\n@c0@"
  es: "@aNera@bMamma mia. Espero que esa monja se encuentre bien.\n@c0@"
  fr: "@aNera@bOh là là, j'espère que cette religieuse n'est pas malade.\n@c0@"
  it: "@aNera@bOh, santa dea!\nSperiamo che quella brava suora non si buschi una broncopolmonite acuta!\n@c0@"
  ja: "@a@bフローラ「あら　あら……\n\tあのシスター　大丈夫かしら。\n@c0@"
114:
  de: "@a%0%a001240@bSie hat recht! Sieh nur, Papa! Der Mond spiegelt sich im Wasser. Das ist wunderschön.\n@c0@"
  en: "@a%0%a001240@bShe's right! Look, Dad! The moon's reflected in the water. It looks amazing.\n@c0@"
  es: "@a%0%a001240@b¡Es verdad! ¡Mira, papá! La luna se refleja en el agua. Es genial.\n@c0@"
  fr: "@a%0%a001240@bElle a raisonⓠ Regarde, papaⓠ La lune se reflète dans l'eau. C'est magnifique.\n@c0@"
  it: "@a%0%a001240@bScommetto che quell'acqua di notte è più fredda del ghiaccio...\n@c0@"
  ja: "@a@b%a001240「ホントだ！　見て　お父さん。\n\t池に　月が　うつってるよ。\n\tきれいだね……。\n@c0@"
115:
  de: "@a%0%a001250@bTagsüber ist das Wasser ja eine willkommene Abwechslung, aber nachts ist es bestimmt bitterkalt.\n@c0@"
  en: "@a%0%a001250@bIt's a welcome sight during the day, but I bet the water in there is as cold as ice at night.\n@c0@"
  es: "@a%0%a001250@bDe día se agradece verla, pero seguro que de noche el agua está fría como el hielo.\n@c0@"
  fr: "@a%0%a001250@bMême si cette eau est la bienvenue en journée,\nje parie que la nuit, elle est glacée.\n@c0@"
  it: "@a%0%a001250@bGuarda, papà! La luna si riflette nell'acqua!\nNon pensi anche tu che sia uno spettacolo meraviglioso?\n@c0@"
  ja: "@a@b%a001250「昼間は　うれしいオアシスだけど\n\t夜は　きっと　お池のお水\n\t氷みたいに　つめたいよね……。\n@c0@"
116:
  de: "@aOtto@bWie schade, dass ich sie nicht schon früher kennengelernt habe...\n@c0@"
  en: "@aTuppence@bWhat a pity I didn't have the opportunity to meet her during her dancing days.\n@c0@"
  es: "@aAlazar@bQué pena no haber podido conocerla en sus días de bailarina.\n@c0@"
  fr: "@aInnocent@bQuel dommage que je n'aie pas eu l'occasion de faire sa connaissance quand elle était danseuse.\n@c0@"
  it: "@aSimon@bMi dispiace non aver avuto la possibilità di incontrare quella signora quando era una ballerina.\nAvrei tanto voluto fare quattro salti con lei...\n@c0@"
  ja: "@a@bピピン「どうせなら　踊り娘時代に\n\t会いたかったなあ……。\n@c0@"
117:
  de: "@aNera@bIch erinnere mich an ihn... Aber er war noch ein kleiner Junge, als ich ihn das letzte Mal gesehen habe. Wie die Zeit vergeht...\n@c0@"
  en: "@aNera@bI remember him... But he was only a young boy the last time we saw him. It just goes to show how time's moved on.\n@c0@"
  es: "@aNera@bMe acuerdo de él... Pero solo era un ragazzo la última volta que lo vimos. Eso demuestra cuánto tiempo ha pasado.\n@c0@"
  fr: "@aNera@bJe me souviens de lui... Mais la dernière fois que je l'ai vu, il n'était encore qu'un petit garçon. Voilà une preuve que le temps passe bien vite.\n@c0@"
  it: "@aNera@bMi ricordo di lui.\r\nL'ultima volta che lo vedemmo era solo un bambino...\nAh, come passa il tempo...\n@c0@"
  ja: "@a@bフローラ「あの方…　以前お会いしたときは\n\t小さな男の子だったはずなのに……\n\tやっぱり　時は　流れてしまったのね。\n@c0@"
118:
  de: "@aBianca@bEr war noch ein Junge, als wir das letzte Mal hier waren!\n㈡\nSchon seltsam, dass die Zeit ganz normal weitergegangen ist, als wir beide Statuen waren... Nur nicht für dich und mich.\n@c0@"
  en: "@aBianca@bHe was just a lad the last time we was here! It's funny to think how time only stood still for you and me durin' them years we spent as statues.\n@c0@"
  es: "@aBianca@b¡No era más que un chaval la última vez que vinimos!\n㈡\nMe asombra pensar en cómo se paró el tiempo para nosotros durante los años que fuimos estatuas, ¿sabes?\n@c0@"
  fr: "@aBianca@bCe n'était qu'un petit garçon la dernière fois\nqu'on est venusⓠ\n㈡\nC'est drôle de se dire que pour nous, le temps\ns'est arrêté pendant les années où nous avons\nété pétrifiés.\n@c0@"
  it: "@aBianca@bQuando lo vedemmo la prima volta che venimmo qui, quel tipo era poco più di un bimbetto.\n㈡\nNoi, invece, non siamo cambiati molto durante il periodo in cui siamo stati trasformati in statue...\nÈ come se per noi il tempo si fosse fermato.\n@c0@"
  ja: "@a@bビアンカ「前は　小さな男の子だったのに…\n\t石になったとき　私と%a000090だけ\n\t時間が　止まってしまったみたい……。\n@c0@"
119:
  de: "@aNera@bEr scheint ganz schön wütend zu sein, aber ich glaube, das ist alles nur leeres Gerede. Sie werden sich schon wieder vertragen.\n@c0@"
  en: "@aNera@bHe may sound angry, but I'm sure it's all just talk. It's good that they're on the road to making up.\n@c0@"
  es: "@aNera@bPuede que parezca enfadado, ma sonno sicura de que solo son parole. Me alegra que estén empezando a hacer las paces.\n@c0@"
  fr: "@aNera@bIl a peut-être l'air en colère, mais ce ne sont que des mots. C'est bien de voir qu'ils sont sur la voie de la réconciliation.\n@c0@"
  it: "@aNera@bA sentirlo parlare, sembra ancora arrabbiato con la figlia, ma scommetto che impazzirebbe di gioia se lei gli si presentasse davanti...\n@c0@"
  ja: "@a@bフローラ「なには　ともあれ\n\t仲なおりなさったみたいで\n\tよかったですわ。\n@c0@"
120:
  de: "@aSancho@bSi, si. Es ist das Beste, wenn die ganze Familia zusammen bleibt. Si, si... si... (Schluchz)\n@c0@"
  en: "@aSancho@bSí, sí. Ees the best when the whole family, they are together. Sí, sí...sí... (sob)\n@c0@"
  es: "@aSancho@bSí, sí. Es padrísimo que toda la familia esté unida. Sí, sí... sí... (snif)\n@c0@"
  fr: "@aSancho@bSi, si. C'est mieux quand t-t-toute la famille est réounie. Si, si... si... (snif)\n@c0@"
  it: "@aSancho@b¿Por qué quell'hombre no vuole que sua figlia torni a casa?\n¡Es bueno cuando la familia es riunita!\n@c0@"
  ja: "@a@bサンチョ「ええ　ええ。\n\t家族そろって暮らすのが\n\tいちばんですとも。　うっうっ……。\n@c0@"
121:
  de: "@a%0%a001240@bJa, die Wüste ist schon ganz schön rau, aber ich mag sie trotzdem. Sie ist so anders...\n@c0@"
  en: "@a%0%a001240@bYeah, the desert's a pretty tough place, but I like it. It's a bit different to everywhere else.\n@c0@"
  es: "@a%0%a001240@bSí, el desierto es un lugar muy duro, pero me gusta. Es un poco distinto de todo lo demás.\n@c0@"
  fr: "@a%0%a001240@bOuais, c'est vrai que c'est rude, le désert, mais ça me plaît. Ça ne ressemble à nulle part ailleurs.\n@c0@"
  it: "@a%0%a001240@bIl deserto è molto diverso da tutti gli altri luoghi che ho visitato.\nÈ pericoloso e affascinante al tempo stesso...\n@c0@"
  ja: "@a@b%a001240「ほんと　さばくって\n\tたいへんな所だね！\n\tでも　面白くて好きだな。\n@c0@"
122:
  de: "@a%0%a001250@bJedem das Seine, nicht wahr? Sie werden diesen Ort schon mögen, sonst würden sie ja nicht hier bleiben.\n@c0@"
  en: "@a%0%a001250@bEach to their own, I s'pose. They must like the place, otherwise they wouldn't stay.\n@c0@"
  es: "@a%0%a001250@bA cada cual, lo suyo, supongo. Les debe de gustar el sitioⓓ si no, no se quedarían.\n@c0@"
  fr: "@a%0%a001250@bChacun son truc. Je suppose que cet endroit leur plaît, sinon ils n'y resteraient pas.\n@c0@"
  it: "@a%0%a001250@bEvidentemente ci sono persone a cui piace vivere tra le dune, al caldo...\nI gusti sono gusti!\n@c0@"
  ja: "@a@b%a001250「あんなこと　言うのは\n\tさばくの人に　失礼よね。\n\t大人なのに　わからないのかしら。\n@c0@"
123:
  de: "@aOtto@bIch muss zugeben, dass die Wüste net grad mein Lieblingsort ist. Aber ich würd' Euch natürlich überallhin folgen, Eure Majestät.\n@c0@"
  en: "@aTuppence@bI must admit that I'm not overly partial to the desert myself. Naturally, though, I'd venture anywhere you wished me to, Your Majesty.\n@c0@"
  es: "@aAlazar@bDebo admitir que no soy demasiado partidario del desierto. Pero, naturalmente, me lanzaré a cualquier lugar que me ordenéis, Majestad.\n@c0@"
  fr: "@aInnocent@bPersonnellement, je ne suis pas un inconditionnel du désert. Mais bien sûr, je m'aventurerai partout où vous le souhaiterez, Votre Majesté.\n@c0@"
  it: "@aSimon@bNon amo il deserto, ma ci verrei ogni giorno, pur di rivedere la regina Cle... Ehm, ci verrei ogni giorno, se lei mi chiedesse di accompagnarla, re %a000090!\n@c0@"
  ja: "@a@bピピン「正直　言うと　ボクも\n\t砂漠は　苦手ですね。\n\tでも　王のためなら　どこへだって！\n@c0@"
124:
  de: "@aSancho@bNo, Chico. Schlafende Leute soll man nisst wecken. Die Siesta ist sehr wisstig, weißt du...\n@c0@"
  en: "@aSancho@bNo, friend. Ees no good to wake up people when they are esleeping. The esleep, ees very important, you know.\n@c0@"
  es: "@aSancho@bNo, chamaco. No hay que despertar a la gente cuando duerme. El sueño es bien importante.\n@c0@"
  fr: "@aSancho@bNon, chico. Ce n'est pas b-b-bien de réveiller\r\nles gens qui dorment. C'est très important,\r\nle s-s-sommeil, tu sais.\n@c0@"
  it: "@aSancho@bNo, chico.\nNo es bueno de esvegliare las personas que dormono... Lasciale reposare en paz.\n@c0@"
  ja: "@a@bサンチョ「坊っちゃん　ダメですよ。\n\t寝てる人を　起こしたら\n\tかわいそうじゃないですかっ。\n@c0@"
125:
  de: "@a%0%a001240@bDer Mann ist ja lustig! Was der alles so sagt im Schlaf...\n@c0@"
  en: "@a%0%a001240@bThat man's funny! He says funny things in his sleep.\n@c0@"
  es: "@a%0%a001240@b¡Qué hombre más peculiar! Dice cosas raras en sueños.\n@c0@"
  fr: "@a%0%a001240@bIl est rigolo, luiⓠ Il dit des trucs marrants dans\nson sommeil.\n@c0@"
  it: "@a%0%a001240@bMi piacerebbe sapere cosa sta sognando quell'uomo...\n@c0@"
  ja: "@a@b%a001240「さっきの人　おもしろかったね！\n\t寝言も　歌うみたいに　言ってたよ。\n@c0@"
126:
  de: "@a%0%a001240@bEr war also schon so, als du ihn das letzte Mal gesehen hast? Hm, dann ist er wohl schon eine ganze Weile so zerstreut.\n@c0@"
  en: "@a%0%a001240@bSo he was like that the last time you met him?\nSounds like he's been in a tizz for quite a few\nyears now, then.\n@c0@"
  es: "@a%0%a001240@b¿Ya era así la última vez que lo viste?\nPues entonces se ha pasado unos cuantos años histérico, ¿no?\n@c0@"
  fr: "@a%0%a001240@bAlors il était déjà comme ça la dernière fois que tu l'as vuⓡ Ça fait quelques années qu'il est un peu zinzin, alors, nonⓡ\n@c0@"
  it: "@a%0%a001240@bSe è tanto distratto, perché non fa una lista delle cose che dovrebbe portare con sé?!\n@c0@"
  ja: "@a@b%a001240「えっ？　あのおじさん\n\t前に会ったときも　ああだったの？\n\tすごいな　なん年　ダメなんだろ。\n@c0@"
127:
  de: "@a%0%a001250@bIn meinen Büchern habe ich Bilder von Wüstenrosen gesehen. Sie sind sehr hübsch.\n@c0@"
  en: "@a%0%a001250@bI've seen pictures of desert roses in books before. They're really pretty.\n@c0@"
  es: "@a%0%a001250@bHabía visto imágenes de rosas del desierto en los libros. Son preciosas.\n@c0@"
  fr: "@a%0%a001250@bJ'ai déjà vu des images de roses des sables\ndans les livres. Elles sont vraiment jolies.\n@c0@"
  it: "@a%0%a001250@bHo visto alcune immagini delle rose del deserto in un libro, e sono rimasta a bocca aperta per quanto sono belle...\n@c0@"
  ja: "@a@b%a001250「さばくのバラは\n\tご本でも　見たことがあるわ。\n\tとっても　キレイなのよ。\n@c0@"
128:
  de: "@aBianca@bJetzt, wo wir den Zenithiahelm haben, sollten wir weiterziehen.\n@c0@"
  en: "@aBianca@bWell, we've got the Zenithian Helm now.\r\nIt's time we moved on.\n@c0@"
  es: "@aBianca@bBueno, ya tenemos el Yelmo de Zenithia.\r\nEs hora de ponerse en marcha.\n@c0@"
  fr: "@aBianca@bBon, nous avons le Casque zénithien, à présent.\r\nIl est temps de partir.\n@c0@"
  it: "@aBianca@bBene, abbiamo ottenuto l'Elmo Zenithiano.\nDirei che possiamo proseguire il nostro viaggio...\n@c0@"
  ja: "@a@bビアンカ「天空のかぶとは　もう持ったし\n\t次の場所へ　向かいましょうよ。\n@c0@"
129:
  de: "@aNera@bDamals fand ich die Hitze unerträglich, aber jetzt macht es mir nicht mehr so viel aus.\n@c0@"
  en: "@aNera@bI found the heat here almost intolerable before,\r\nbut it's not too bad this time.\n@c0@"
  es: "@aNera@bAntes me parecía que el calor aquí era insopportabile, pero esta vez no está tan mal.\n@c0@"
  fr: "@aNera@bLa dernière fois, j'avais trouvé la chaleur presque insupportable mais cette fois, ça va mieux.\n@c0@"
  it: "@aNera@bLa prima volta che venimmo qui il caldo mi sembrava insopportabile, ma ora non mi sembra tanto male.\n@c0@"
  ja: "@a@bフローラ「昔はこの暑さが　つらかったけど\n\t今は　つらく感じませんわ。\n@c0@"
130:
  de: "@aNera@bIch bin wohl viel zu glücklich, wieder mit euch allen vereint zu sein, als dass die Sonne mir etwas anhaben könnte.\n@c0@"
  en: "@aNera@bMy happiness at being with you all again is obviously taking my mind off it.\n@c0@"
  es: "@aNera@bSembra que la mia felicità por estar contigo otra vez me hace ignorarlo.\n@c0@"
  fr: "@aNera@bJe suppose que je suis si heureuse d'être de nouveau avec vous tous que je n'y pense même pas.\n@c0@"
  it: "@aNera@bSi vede che a furia di viaggiare con te sono diventata più resistente a tutto, anche alle alte temperature! Ih ih ih!\n@c0@"
  ja: "@a@bフローラ「きっと　あなたたちと\n\tいっしょにいられる喜びのほうが\n\t大きいからですわね。\n@c0@"
131:
  de: "@a%0%a001240@bAlso haben die Leute aus Helmunaptra alle nur auf mich gewartet? Das macht mich jetzt ganz verlegen...\n@c0@"
  en: "@a%0%a001240@bSo the people of Helmunaptra have all been waiting for me to turn up? I feel all embarrassed now!\n@c0@"
  es: "@a%0%a001240@b¿La gente de Ayelmandría estaba esperando que yo apareciera? ¡Es un poco embarazoso!\n@c0@"
  fr: "@a%0%a001240@bAlors tous les habitants d'Helmunaptra attendaient que je me montreⓡ Je suis tout gêné, maintenantⓠ\n@c0@"
  it: "@a%0%a001240@bAllora gli abitanti del Regno di Faraonia aspettavano il mio arrivo?\nSpero proprio di non averli delusi...\n@c0@"
  ja: "@a@b%a001240「テルパドールの人たち\n\tボクのこと　ずっと待ってたのかな？\n\t……なんだか　てれくさいや。\n@c0@"
132:
  de: "@a%0%a001240@bEs ist seltsam, aber als ich den Zenithiahelm sah, habe ich mich sofort zu ihm hingezogen gefühlt.\n@c0@"
  en: "@a%0%a001240@bIt's strange, but I felt a sort of connection with the Zenithian Helm when I saw it.\n@c0@"
  es: "@a%0%a001240@bEs extraño, pero sentí una especie de conexión con el Yelmo de Zenithia cuando lo vi.\n@c0@"
  fr: "@a%0%a001240@bC'est bizarre, mais j'ai senti une sorte de connexion avec le Casque zénithien quand je l'ai vu.\n@c0@"
  it: "@a%0%a001240@bQuando ho visto l'Elmo Zenithiano, ho avuto una sensazione stranissima...\n@c0@"
  ja: "@a@b%a001240「不思議なんだ。\n\t天空のかぶとを　見たとき\n\tなつかしい気がして……\n@c0@"
133:
  de: "@a%0%a001240@bEs war, als hätte ich ihn schon einmal gesehen, aber ich bin sicher, dass es das erste Mal war.\n@c0@"
  en: "@a%0%a001240@bIt was like I'd seen it somewhere before, and yet I knew it was only the first time.\n@c0@"
  es: "@a%0%a001240@bComo si lo hubiera visto antes, aunque sabía que era la primera vez.\n@c0@"
  fr: "@a%0%a001240@bC'est comme si je l'avais déjà vu quelque part et pourtant je savais que c'était la première fois.\n@c0@"
  it: "@a%0%a001240@bEra come se quell'oggetto mi fosse familiare, nonostante non lo avessi mai visto prima.\n@c0@"
  ja: "@a@b%a001240「初めて見たはず\n\tなのに　変だよね。\n@c0@"
134:
  de: "@a%0%a001250@bAlle reden nur noch von %a001240. Das wird langsam ein wenig langweilig...\n@c0@"
  en: "@a%0%a001250@bEveryone here goes on about %a001240 all the time. I'm starting to find it a bit boring.\n@c0@"
  es: "@a%0%a001250@bTodo el mundo habla de %a001240 constantemente. Me empieza a resultar aburrido.\n@c0@"
  fr: "@a%0%a001250@bIci, tout ne monde n'en a que pour %a001240.\nJe commence à trouver ça ennuyeux.\n@c0@"
  it: "@a%0%a001250@bQui tutti parlano di %a001240...\nPossibile che non abbiano altri argomenti di conversazione?!\n@c0@"
  ja: "@a@b%a001250「この国の人たち　みんな\n\tお兄ちゃんの話ばっかりする。\n\tわたし　ちょっと　つまんない……。\n@c0@"
135:
  de: "@a%0%a001250@bEs ist so heiß hier! Mir ist schon ganz schwindelig.\n@c0@"
  en: "@a%0%a001250@bIt's just so hot here!\nIt's starting to make me feel dizzy.\n@c0@"
  es: "@a%0%a001250@b¡Qué calor hace aquí!\nEmpieza a marearme un poco.\n@c0@"
  fr: "@a%0%a001250@bIl fait tellement chaud, iciⓠ\nJe commence à avoir la tête qui tourne.\n@c0@"
  it: "@a%0%a001250@bIl caldo è insopportabile...\nNon resisto più...\nMi sento male...\n@c0@"
  ja: "@a@b%a001250「それにしても　暑いよ～。\n\tクラクラ　してきちゃった……。\n@c0@"
136:
  de: "@aSancho@bAlso war das Schwert, das Señor Ludwig gefunden hat, tatsächlich das echte, si? Das Zenithiaschwert.\n@c0@"
  en: "@aSancho@bNow we can be esure thees esword that señor Pankraz, he found, ees the real theeng, sí? The Zenithian Sword.\n@c0@"
  es: "@aSancho@bAhorita pues ya estamos seguros de que la espada que encontró el señor Teudis es la auténtica. La Espada de Zenithia.\n@c0@"
  fr: "@aSancho@bCette fois, on p-p-peut être sûrs que l'épée\ntrouvée par le señor Petros est la vraie, siⓡ \nLa véritable Épée zénithienne.\n@c0@"
  it: "@aSancho@bAhora siamo seguros que quella trovata dal señor Russel es veramentes la Spada Zenithiana...\n@c0@"
  ja: "@a@bサンチョ「とにかく　これで　パパスさまが\n\tみつけてくださった　天空のつるぎも\n\t本物だと証明されたわけです。\n@c0@"
137:
  de: "@aSancho@bSi. Das ist gut zu wissen.\n@c0@"
  en: "@aSancho@bSí, sí. Ees good to know.\n@c0@"
  es: "@aSancho@bSí, sí. Está bueno saberlo.\n@c0@"
  fr: "@aSancho@bSi, si. C'est bueno à savoir.\n@c0@"
  it: "@aSancho@bSì, esta es una noticia muy buena.\n@c0@"
  ja: "@a@bサンチョ「よかった　よかった！\n@c0@"
138:
  de: "@aSancho@bIss muss hier einfach nur in Hitze herumstehen, das reisst schon, um zu schaffen Platz für muchos Paella!\n@c0@"
  en: "@aSancho@bJust estanding up een thees place, ees enough to make room for mucha paella!\n@c0@"
  es: "@aSancho@b¡Nomás de estar aquí arriba se me hace espacio para muchos burritos!\n@c0@"
  fr: "@aSancho@bDans oune pièce aussi grande, il y a de la p-p-place pour faire des paellas gigantesquesⓠ\n@c0@"
  it: "@aSancho@bChico, avrei proprio voglia de una buena paella...\n@c0@"
  ja: "@a@bサンチョ「いや～　本当に\n\tこの場所にいると　立っているだけで\n\t細くなりそうですな。\n@c0@"
139:
  de: "@aOtto@bEs ist wirklich ausg'sprochen heiß hier. Was würd' ich drum geben, jetzt im Schnee auf dem Ötzberg zu stehen!\n@c0@"
  en: "@aTuppence@bIt really is unbearably hot here. What I'd give to be standing in the snow on Mt Batten!\n@c0@"
  es: "@aAlazar@bAquí hace un calor insoportable. ¡Lo que daría ahora por estar en medio de la nieve del Monte Habs!\n@c0@"
  fr: "@aInnocent@bLa chaleur est vraiment insupportable, ici.\r\nJe donnerais n'importe quoi pour me retrouver\r\ndans la neige sur le mont Técarlo.\n@c0@"
  it: "@aSimon@bQuesto caldo mi sta facendo impazzire!\nNon so che darei per fare una bella doccia fresca...\n@c0@"
  ja: "@a@bピピン「うう　暑い……。\n\tここに来ると　チゾットの雪が\n\t恋しくなりますね。\n@c0@"
140:
  de: "@aOtto@bAlso ist %a001240 tatsächlich der Auserwählte. Und ich bin der Begleiter des legendären Helden! Ha!\n@c0@"
  en: "@aTuppence@bSo %a001240 really is the one. Which makes me the companion of the legendary hero!\n@c0@"
  es: "@aAlazar@bAsí que %a001240 es el héroe. ¡Lo cual me convierte en el compañero del héroe legendario!\n@c0@"
  fr: "@aInnocent@bAlors %a001240 est vraiment l'élu. Ce qui fait de moi le compagnon du héros légendaireⓠ\n@c0@"
  it: "@aSimon@bAllora %a001240 è davvero l'Eroe Leggendario!\nE io sono il suo compagno d'avventura!\nBel colpo, Simon, davvero un bel colpo...\n@c0@"
  ja: "@a@bピピン「%a001240さまが　勇者さま……。\n\tこれで　ボクは　正真正銘\n\t勇者さまの　お供ってわけですね。\n@c0@"
141:
  de: "@a%0%a001240@bIch frage mich, wo das ganze Wasser herkommt, wir sind doch mitten in der Wüste. Aber es ist trotzdem ein willkommener Anblick.\n@c0@"
  en: "@a%0%a001240@bI wonder where the water can be coming from,\nall the way out here in the desert. It's a welcome sight, though.\n@c0@"
  es: "@a%0%a001240@bMe pregunto de dónde saldrá el agua que hay en el desierto. Da igual, es bienvenida.\n@c0@"
  fr: "@a%0%a001240@bJe me demande d'où vient cette eau pour parvenir jusqu'au beau milieu de ce désert. Quoi qu'il en soit, elle est la bienvenue.\n@c0@"
  it: "@a%0%a001240@bAcqua nel deserto?!\nQuesta sì che è una bella sorpresa!\nFinalmente un po' di refrigerio...\n@c0@"
  ja: "@a@b%a001240「砂漠なのに　どこから\n\t水が　わきでてるんだろう。\n\tでも　きれいだね！　お水！\n@c0@"
142:
  de: "@a%0%a001250@bIch hab schon mal was über Oasen gelesen, und das hier sieht ganz wie eine aus.\n㈡\nEine Oase ist nämlich ein fruchtbarer, grüner Fleck mitten in der Wüste, weißt du.\n@c0@"
  en: "@a%0%a001250@bI've read about oases, and that definitely looks like one. An oasis is an area of greenery in the middle of a desert, you see.\n@c0@"
  es: "@a%0%a001250@bHe leído cosas sobre los oasis y este tiene toda la pinta de ser uno. Un oasis es un área de verdor en pleno desierto, ya sabes.\n@c0@"
  fr: "@a%0%a001250@bJ'ai lu des livres à propos des oasis, et ça, ça y ressemble très fort. En fait, une oasis est un îlot\nde verdure au beau milieu du désert.\n@c0@"
  it: "@a%0%a001250@bChe bellezza! Un'oasi!\nLe oasi sono aree fertili che si trovano ogni tanto nei deserti: l'ho imparato a scuola!\n@c0@"
  ja: "@a@b%a001250「あれ　オアシスでしょ？\n\t勉強したことがあるの。\n\t砂漠にある緑が　オアシスだって。\n@c0@"
143:
  de: "@a%0%a001240@bPuh! Welch eine Erleichterung, nicht mehr in der Sonne zu sein!\n@c0@"
  en: "@a%0%a001240@bAaah! What a relief to be out of the sun.\n@c0@"
  es: "@a%0%a001240@b¡Aaah! ¡Qué alivio estar protegido del sol!\n@c0@"
  fr: "@a%0%a001240@bAaahⓠ Comme c'est bon de ne plus être au soleil.\n@c0@"
  it: "@a%0%a001240@bOh, che sollievo!\nFinalmente un po' di fresco!\n@c0@"
  ja: "@a@b%a001240「わ～い！\n\t日カゲって　すずしいね！\n@c0@"
144:
  de: "@a%0%a001250@bIch wünschte, wir müssten nie mehr wieder nach draußen gehen.\n@c0@"
  en: "@a%0%a001250@bI wish we didn't have to go outside again.\n@c0@"
  es: "@a%0%a001250@bOjalá no tuviéramos que volver a salir.\n@c0@"
  fr: "@a%0%a001250@bSi seulement on pouvait ne pas avoir à ressortir.\n@c0@"
  it: "@a%0%a001250@bVorrei tanto non dover tornare sotto il sole cocente...\n@c0@"
  ja: "@a@b%a001250「もう　お外に\n\t出たくないな……。\n@c0@"
145:
  de: "@aOtto@bEs gibt eine Menge Sand hier drinnen, net wahr? Aber an solch einem Ort bleibt das wohl net aus...\n@c0@"
  en: "@aTuppence@bThere's a fair amount of sand in here, isn't there?\r\nI suppose it can't be helped in a place like this.\n@c0@"
  es: "@aAlazar@bAquí dentro hay una buena cantidad de arena, ¿verdad? Supongo que es inevitable en un lugar así.\n@c0@"
  fr: "@aInnocent@bIl y a pas mal de sable, ici, nonⓡ Je suppose que c'est inévitable dans un endroit pareil.\n@c0@"
  it: "@aSimon@bCredo di aver mangiato mezza tonnellata di sabbia, da quando sono entrato in questo dannatissimo deserto!\n@c0@"
  ja: "@a@bピピン「やっぱり　こういう場所だと\n\tお店の中にも　けっこう\n\t砂が　入っちゃうみたいですね。\n@c0@"
146:
  de: "@a%0%a001240@bIch war genauso glücklich wie er, als du wieder da warst, Papa.\n@c0@"
  en: "@a%0%a001240@bI was happy just like him when you came home\nagain, Dad.\n@c0@"
  es: "@a%0%a001240@bYo estaba tan feliz como él cuando regresaste a casa, papá.\n@c0@"
  fr: "@a%0%a001240@bJ'étais aussi heureux que lui quand tu es revenu\nà la maison, papa.\n@c0@"
  it: "@a%0%a001240@bSai, papà?\nAnch'io sono stato tanto felice quando ti abbiamo ritrovato!\n@c0@"
  ja: "@a@b%a001240「ボクもね\n\tお父さんが　帰ってきたとき\n\tすっごく　うれしかったよ！\n@c0@"
147:
  de: "@a%0%a001250@bDu wirst uns nie wieder alleine lassen, nicht wahr, Papa?\n@c0@"
  en: "@a%0%a001250@bYou won't go missing again, will you, Dad?\n@c0@"
  es: "@a%0%a001250@bYa no volverás a marcharte, ¿verdad, papi?\n@c0@"
  fr: "@a%0%a001250@bTu ne vas pas disparaître à nouveau, hein, papaⓡ\n@c0@"
  it: "@a%0%a001250@bPapà, promettimi che non ti trasformerai più in statua!\n@c0@"
  ja: "@a@b%a001250「お父さん…\n\tもう　いなくなっちゃイヤよ。\n@c0@"
148:
  de: "@aSancho@bSi, si. Es ist das Beste, wenn die ganze Familia zusammen bleibt. Si, si... si... (Schluchz)\n@c0@"
  en: "@aSancho@bSí, sí. Ees the best when the whole family, they are together. Sí, sí...sí... (sob)\n@c0@"
  es: "@aSancho@bSí, sí. Es padrísimo que toda la familia esté unida. Sí, sí... sí... (snif)\n@c0@"
  fr: "@aSancho@bSi, si. C'est mieux quand t-t-toute la famille est réounie. Si, si... si... (snif)\n@c0@"
  it: "@aSancho@b¡Es bueno cuando la familia es riunita!\nYo... Yo me commuovos...\n¡Sob!\n@c0@"
  ja: "@a@bサンチョ「ええ　ええ。\n\t家族そろって暮らすのが\n\tいちばんですとも。　うっうっ……。\n@c0@"
149:
  de: "@aOtto@bEin Badeort? Wie nett. Vielleicht bringe ich meine alte Mutter einmal hierher.\n@c0@"
  en: "@aTuppence@bA spa town? How nice. I should take my old mother to a spa one of these days.\n@c0@"
  es: "@aAlazar@b¿Una ciudad balneario? Qué bonito. Un día de estos tengo que llevar a mi madre a un balneario.\n@c0@"
  fr: "@aInnocent@bUne ville thermaleⓡ C'est chouette. Je devrais y emmener ma vieille mère, un de ces jours.\n@c0@"
  it: "@aSimon@bUna cittadina termale? Uhm, potrei trascorrerci una vacanza, quando quest'avventura sarà finita.\r\nLì ci saranno di certo tante belle turiste...\n@c0@"
  ja: "@a@bピピン「温泉かあ……。\n\tボクもいつか　母さんを連れて\n\t行きたいなあ。\n@c0@"
150:
  de: "@a%0%a001240@bIhre Jugend ist verblasst... Heißt das, dass sie im selben Alter ist wie Sancho?\n@c0@"
  en: "@a%0%a001240@bHer youth's fading away... Does that make her about the same age as Sancho, then?\n@c0@"
  es: "@a%0%a001240@bSu juventud es un recuerdo lejano... ¿Quiere eso decir que tiene la misma edad que Sancho?\n@c0@"
  fr: "@a%0%a001240@bSa jeunesse est un lointain souvenir...\nEst-ce que ça veut dire qu'elle a presque\nle même âge que Sancho, alorsⓡ\n@c0@"
  it: "@a%0%a001240@bForse non è più tanto giovane, ma lo zio Sancho è molto più vecchio di lei!\n@c0@"
  ja: "@a@b%a001240「えっと　あの人\n\t若くないってことは……\n\tサンチョと同じぐらいの年なの？\n@c0@"
151:
  de: "@aOtto@bAch, wenn ich dieser bezaubernden Dame nur begegnet wäre, bevor das Alter seine Spuren hinterlassen hat...\n@c0@"
  en: "@aTuppence@bIf only I'd been able to meet that lovely lady before the years had taken their toll.\n@c0@"
  es: "@aAlazar@bOjalá hubiera podido conocer a esa encantadora dama antes de que los años la echaran a perder.\n@c0@"
  fr: "@aInnocent@bSi seulement j'avais pu faire la connaissance de cette charmante dame avant que le temps n'ait\r\nfait son œuvre.\n@c0@"
  it: "@aSimon@bChissà quanto dev'essere stata bella in gioventù questa signora...\r\nBeh, però è ancora una donna attraente, no?\n@c0@"
  ja: "@a@bピピン「あの人とは　もう少し\n\t早く　会いたかったなあ……。\n@c0@"
152:
  de: "@aOtto@bIch finde es immer wieder faszinierend, eine Frau mit Vergangenheit kennenzulernen.\n@c0@"
  en: "@aTuppence@bIt's always rather fascinating to meet a woman with a past.\n@c0@"
  es: "@aAlazar@bSiempre es fascinante conocer a una mujer con pasado.\n@c0@"
  fr: "@aInnocent@bC'est toujours assez fascinant de rencontrer une femme qui a vécu plein de choses.\n@c0@"
  it: "@aSimon@bNon sarà più una giovincella, ma questa donna ha ancora il suo fascino.\nÈ proprio vero che la bellezza non ha età!\n@c0@"
  ja: "@a@bピピン「過去のある女性って\n\tなんだか　ひかれちゃいますよね。\n@c0@"
153:
  de: "@a%0%a001250@bIch liebe es, wie der Himmel sich verfärbt, wenn die Sonne auf- oder untergeht. Das ist so schön!\n@c0@"
  en: "@a%0%a001250@bI love seeing the colours of the sky change at sunset and sunrise. It's so pretty!\n@c0@"
  es: "@a%0%a001250@bMe encanta ver cómo cambia el color del cielo al amanecer y al anochecer. ¡Es precioso!\n@c0@"
  fr: "@a%0%a001250@bJ'adore voir les couleurs du ciel changer, au lever et au coucher du soleil. C'est tellement joliⓠ\n@c0@"
  it: "@a%0%a001250@bAdoro guardare il cielo che cambia colore all'alba e al tramonto...\nÈ uno spettacolo stupendo!\n@c0@"
  ja: "@a@b%a001250「わたし　夜明けとか\n\t夕暮れの　お空の色って大好き。\n\tいろんな色がまざって　きれいなの！\n@c0@"
154:
  de: "@a%0%a001250@b%0%a001240 scheint hier wirklich sehr beliebt zu sein... Aber gerecht ist das nicht, immerhin sind wir Zwillinge. Was hat er denn, was ich nicht habe?\n@c0@"
  en: "@a%0%a001250@b%0%a001240's really popular around here, isn't he? It doesn't seem fair in a way. I mean, we're twins, so what makes him so much better than me?\n@c0@"
  es: "@a%0%a001250@b%0%a001240 es muy famoso por aquí, ¿no?\nNo me parece muy justo. Si somos gemelos, ¿qué le hace mejor que yo?\n@c0@"
  fr: "@a%0%a001250@b%0%a001240 est vraiment populaire, par ici, heinⓡ C'est pas très juste, quand même. Après tout, on est jumeaux, alors pourquoi il serait supérieur à moiⓡ\n@c0@"
  it: "@a%0%a001250@bPerché %a001240 è così popolare e io no?!\nNon è giusto!\n㈡\nIo sono sua sorella gemella!\nSiamo uguali!\nPerché pensano che lui sia meglio di me?!\n@c0@"
  ja: "@a@b%a001250「お兄ちゃん　人気者ね。\n\tおんなじ　ふたごなのに\n\tなんか　ずるいよ……。\n@c0@"
155:
  de: "@aOtto@bIch hoffe sehr, dass auch ich irgendwann zu einer Legende werde.\n@c0@"
  en: "@aTuppence@bI do hope I become a man of legend one of\r\nthese days.\n@c0@"
  es: "@aAlazar@bEspero convertirme en leyenda un día de estos.\n@c0@"
  fr: "@aInnocent@bJ'espère moi aussi devenir une figure légendaire,\r\nun jour.\n@c0@"
  it: "@aSimon@bSpero che un giorno anch'io diventerò un personaggio leggendario...\n@c0@"
  ja: "@a@bピピン「ボクだって　いつか\n\tきっと　伝説を残す男に……！\n@c0@"
156:
  de: "@a%0%a001240@bⓆ O mächtiger Held! Ⓡ Le-gend-ä-rer Held! Ⓠ\nⓆ Angst... Ähm...\n@c0@"
  en: "@a%0%a001240@bⓆ My mighty hero! Ⓡ Le-gend-a-ry hero! Ⓠ\nⓆ You know... Um...\n@c0@"
  es: "@a%0%a001240@bⓆ ¡Poderoso héroe! Ⓡ ¡Héroe le-gen-da-rio! Ⓠ\nⓆ No sientes... Esto...\n@c0@"
  fr: "@a%0%a001240@b*ⓢ Ⓠ Mon puissant hérosⓠ Ⓡ Légendaire hérosⓠ Ⓠ\nⓆ Tu ignores... euh...\n@c0@"
  it: "@a%0%a001240@bⓆ Mio Eroe Leggendario! Ⓠ\nⓆ Tu sei forte e temerario! Ⓡ\nⓆ Ma sai cavalcare un dromedario? Ⓡ Ⓡ\n@c0@"
  ja: "@a@b%a001240「おおー　でんせつのー\n\tゆーしゃー♪\n\tぜったいー……\n@c0@"
157:
  de: "@a%0%a001240@bDen Rest weiß ich nicht mehr...\n@c0@"
  en: "@a%0%a001240@bI can't remember the rest of the words.\n@c0@"
  es: "@a%0%a001240@bNo recuerdo el resto de la letra.\n@c0@"
  fr: "@a%0%a001240@bJ'arrive pas à me rappeler le reste des paroles.\n@c0@"
  it: "@a%0%a001240@bChe splendida canzone!\nL'autore è un vero genio della musica!\n@c0@"
  ja: "@a@b%a001240「えーっと　次なんだっけ？\n@c0@"
158:
  de: "@a%0%a001250@bHmpf. Jetzt hat %a001240 auch noch sein eigenes Lied! Ich will auch ein Lied haben!\n@c0@"
  en: "@a%0%a001250@bHmph. It's all about %a001240.\nI want my own song too!\n@c0@"
  es: "@a%0%a001250@bMmmf. Y dale con %a001240.\n¡Yo también quiero mi propia canción!\n@c0@"
  fr: "@a%0%a001250@bPfff. %0%a001240 par-ci, %a001240 par-là... Moi aussi, je veux une chanson pour moiⓠ\n@c0@"
  it: "@a%0%a001250@bAnch'io voglio la mia canzone!\nPerché solo %a001240 deve averne una, eh?!\n@c0@"
  ja: "@a@b%a001250「お兄ちゃん　ばっかり……\n\tわたしも　お歌ほしいな。\n@c0@"
159:
  de: "@aSancho@bNo. Tut mir leid, Chico, aber hier haben wir wohl unterschiedlisse Geschmäcker...\n@c0@"
  en: "@aSancho@bNo. I esorry, friend, but I can no understand\r\nyour tastes.\n@c0@"
  es: "@aSancho@bNo. Lo siento, chamaco, pero no entiendo tus gustos.\n@c0@"
  fr: "@aSancho@bNo. Désolé, chico, je ne comprends pas tes goûts.\n@c0@"
  it: "@aSancho@bEhm...\nForse abbiamo gustos differentes, chico...\n@c0@"
  ja: "@a@bサンチョ「……うーん。\n\t坊っちゃんのシュミは　私には\n\tよく　わかりませんよ。\n@c0@"
160:
  de: "@aBianca@bOh! Fandest du es denn gar nicht gut, %a000090?\n@c0@"
  en: "@aBianca@bOh! Did you not think that was any good, %a000090?\n@c0@"
  es: "@aBianca@b¡Ah! ¿Y te parece buena, %a000090?\n@c0@"
  fr: "@aBianca@bOhⓠ Tu n'as pas trouvé ça bien, %a000090ⓡ\n@c0@"
  it: "@aBianca@bNon ti è piaciuta, %a000090?\n@c0@"
  ja: "@a@bビアンカ「あら　%a000090には\n\t今の歌の良さが　わからなかった？\n@c0@"
161:
  de: "@a%0%a001240@bIch finde das Lied schön. Hat es dir denn nicht gefallen, Papa? Wie lustig!\n@c0@"
  en: "@a%0%a001240@bI think it's a good song. Didn't you like it, Dad?\nHow funny!\n@c0@"
