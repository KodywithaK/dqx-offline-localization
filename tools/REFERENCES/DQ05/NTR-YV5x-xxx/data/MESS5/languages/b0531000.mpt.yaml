  ja: "@a@b%a001240「あのお姉さん\n\tすごい声だったよ。\n\tまだ　耳が　キーンとしてる……。\n@c0@"
210:
  de: "@aBianca@bHa ha ha! Sieht ganz so aus, als hätte %a001240 seine ersten Bewunderer gefunden!\n@c0@"
  en: "@aBianca@bHa ha ha! Looks like %a001240 has himself a few fans around here, eh?\n@c0@"
  es: "@aBianca@b¡Ja, ja, ja! Parece que %a001240 tiene seguidoras por aquí, ¿eh?\n@c0@"
  fr: "@aBianca@bHa ha haⓠ Apparemment, %a001240 a quelques admiratrices, dans le coin, heinⓡ\n@c0@"
  it: "@aBianca@bAh ah ah!\nIl nostro %a001240 comincia ad avere un discreto stuolo di ammiratrici, eh?\n@c0@"
  ja: "@a@bビアンカ「あははは……\n\t%a001240って　ここじゃ\n\tちょっとした　アイドルね。\n@c0@"
211:
  de: "@aNera@bEs ist schon seltsam, dass jemand so viel Aufhebens um meinen kleinen Jungen macht.\n@c0@"
  en: "@aNera@bIt feels rather odd seeing someone behave like that around my little boy.\n@c0@"
  es: "@aNera@bResulta un poco raro ver a alguien comportarse così con il mio figlio.\n@c0@"
  fr: "@aNera@bÇa me fait bizarre de voir quelqu'un se comporter comme ça avec mon petit garçon.\n@c0@"
  it: "@aNera@bMi sento un po' a disagio nel vedere l'entusiasmo che nostro figlio suscita negli altri. Evidentemente tutti si aspettano grandi cose dall'Eroe Leggendario…\n@c0@"
  ja: "@a@bフローラ「なんだか　自分の子供が\n\tああいう　さわがれかたをすると\n\tちょっと　ふくざつな気持ちですわ。\n@c0@"
212:
  de: "@aOtto@bWenn ich doch nur solch eine Wirkung auf die Damenwelt hätte! Mir wäre es egal, wenn eine Lady bei meinem Anblick vor Entzücken aufschreit...\n@c0@"
  en: "@aTuppence@bIf only I could have that kind of effect on a girl!\r\nI wouldn't mind a bit of squealing in my direction\r\nfor once.\n@c0@"
