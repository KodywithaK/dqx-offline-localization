0:
  de: "@aBianca@bEs ist zwar etwas klein, aber es sieht doch sehr nach einem Schloss aus.\n@c0@"
  en: "@aBianca@bIt's a bit on the small side, but it\r\nlooks a lot like a castle to me.\n@c0@"
  es: "@aBianca@bPor ser, es más bien pequeño, pero a mí me parece un castillo.\n@c0@"
  fr: "@aBianca@bLe terrain est assez limité, mais ça m'a\r\ntout l'air d'être un château.\n@c0@"
  it: "@aBianca@bQuesto ha tutta l'aria di essere un castello, anche se in scala ridotta...\n@c0@"
  ja: "@a@bビアンカ「こぢんまりと　してるけど\n\tあれは　お城なのかしら？\n@c0@"
1:
  de: "@aBianca@bHe! Bilde ich mir das ein oder ist das tatsächlich ein Schleim da drüben?\n@c0@"
  en: "@aBianca@bHey! Am I seein' things or is that a slime over there?\n@c0@"
  es: "@aBianca@b¡Eh! ¿Veo visiones, o eso es un limo?\n@c0@"
  fr: "@aBianca@bHéⓠ J'ai des visions ou c'est bien un gluant\nque je vois là-basⓡ\n@c0@"
  it: "@aBianca@bMa che sta facendo quello Slime?!\n@c0@"
  ja: "@a@bビアンカ「ん？\n\t向こうに　なにか見えるけど\n\tアレって　スライム？\n@c0@"
2:
  de: "@aNera@bEin winziges Schloss auf einer südlichen Insel...\n@c0@"
  en: "@aNera@bA tiny little castle tucked away\r\non a southern island...\n@c0@"
  es: "@aNera@bUn piccolo castello escondido en una isla del sur...\n@c0@"
  fr: "@aNera@bUn tout petit château caché sur une île du sud...\n@c0@"
  it: "@aNera@bChe carino!\nUn piccolo castello su un'isoletta dei mari del sud...\n@c0@"
  ja: "@a@bフローラ「南の島の　小さなお城\n\tという感じですわね。\n@c0@"
3:
  de: "@aNera@bSiehst du diesen Schleim da drüben? Was macht er denn da nur?\n@c0@"
  en: "@aNera@bDo you see that slime over there?\r\nWhatever is it doing?\n@c0@"
  es: "@aNera@b¿Ves ese limo de ahí?\r\n¿Qué estará facendo?\n@c0@"
  fr: "@aNera@bTu vois ce gluant, là-basⓡ\nQu'est-ce qu'il fabriqueⓡ\n@c0@"
  it: "@aNera@bLo vedi quello Slime laggiù?\nChe starà facendo?\n@c0@"
  ja: "@a@bフローラ「向こうに　スライムさんが\n\t見えますけど　なにをして\n\tいらっしゃるのかしら？？\n@c0@"
4:
  de: "@aBianca@bSein Eifer ist bewundernswert, aber können sich Schleime durch Übung denn überhaupt größer machen?\n@c0@"
  en: "@aBianca@bYou can't knock him for bein' ambitious, but can slimes even make themselves bigger through trainin'?\n@c0@"
  es: "@aBianca@bAmbición no le falta, pero ¿los limos pueden crecer a base de entrenarse?\n@c0@"
  fr: "@aBianca@bOn ne peut pas lui en vouloir d'être ambitieux, mais les gluants peuvent-ils vraiment devenir plus costauds en s'entraînantⓡ\n@c0@"
  it: "@aBianca@bCredi che gli Slime possano diventare più grandi con l'allenamento?\n@c0@"
  ja: "@a@bビアンカ「こころざしの高さは\n\tみとめるけど　スライムって\n\tきたえると　大きくなるのかな？\n@c0@"
5:
  de: "@aNera@bWie lustig, einen Schleim im Training zu sehen! Aber wenn er dem auf dem Dach nacheifern will, dann würde ich sagen, Essen macht den Meister.\n@c0@"
  en: "@aNera@bHow funny to see a slime in training! But if it wants to be like the one on the roof, I'd say eating a lot would be the answer.\n@c0@"
  es: "@aNera@b¡Qué curioso ver a un limo entrenarse! Pero, si quiere ser como el del tejado, credo que la solución es mangiare mucho.\n@c0@"
  fr: "@aNera@bC'est marrant de voir un gluant s'entraînerⓠ Mais\ns'il veut ressembler à celui qui est sur le toit, il\nferait sans doute mieux de beaucoup manger.\n@c0@"
  it: "@aNera@bNon sono sicura che questo Slime abbia tutte le rotelle a posto...\n@c0@"
  ja: "@a@bフローラ「身体を　きたえていたのね。\n\t屋根のようになるなら　たくさん\n\t食べるのが　近道だと思うんですけど。\n@c0@"
6:
  de: "@aBianca@bIst ein Prügelpyjama nicht so etwas wie ein Kriegerpyjama? Nicht, dass es besonders furchterregend klingt.\n@c0@"
  en: "@aBianca@bEn't powjamas supposed to be some kind of warrior pyjamas? They dun't sound like they can be all that strong to me, mind.\n@c0@"
  es: "@aBianca@b¿Los pijamas acolchados no son una especie de pijama para guerreros? Pues a mí no me parece que sean muy resistentes, ¿sabes?\n@c0@"
  fr: "@aBianca@bJ'ai du mal à croire qu'un pyjama puisse être\r\nd'une quelconque utilité au combat.\n@c0@"
  it: "@aBianca@bUn pigiama da guerra?\nNon credevo che i pigiami potessero essere usati come indumenti da battaglia...\n@c0@"
  ja: "@a@bビアンカ「戦士のパジャマって\n\tパジャマでしょ？\n\tあんまり　強そうじゃないね……。\n@c0@"
7:
  de: "@aBianca@bDiese Schokomünzen klingen gut. Vielleicht sollten wir die einmal probieren.\n@c0@"
  en: "@aBianca@bThose chocolate medalliyums sound nice.\r\nI quite fancy givin' them a go.\n@c0@"
  es: "@aBianca@bEsos medallones de chocolate tienen buena pinta.\r\nCreo que les voy a pegar un bocado, ¿sabes?\n@c0@"
  fr: "@aBianca@bCes médailles en chocolat ont l'air bonnes.\r\nJe goûterais bien.\n@c0@"
  it: "@aBianca@bMedaglie di cioccolato?!\nDal nome sembrano appetitose!\nNon vedo l'ora di assaggiarle...\n@c0@"
  ja: "@a@bビアンカ「それにしても\n\tメダル型チョコって　おいしそう！\n\t私も　食べたいな。\n@c0@"
8:
  de: "@aNera@bIch glaube, man muss schon ziemlich tapfer sein, um die ganze Zeit im Pyjama herumzulaufen.\n@c0@"
  en: "@aNera@bI think you'd need to be quite brave to wander about in your pyjamas all the time.\n@c0@"
  es: "@aNera@bCredo que hay que tener molto coraggio para andar todo el tiempo en pijama por ahí.\n@c0@"
  fr: "@aNera@bJe trouve qu'il faut être assez courageux pour\r\nse balader en pyjama tout le temps.\n@c0@"
  it: "@aNera@bCerto che bisogna avere un bel coraggio ad andarsene in giro in pigiama, non credi?\n@c0@"
  ja: "@a@bフローラ「ず～っと　パジャマのままで\n\t外を　歩くのって　少し\n\t勇気がいりますわよね。\n@c0@"
9:
  de: "@aNera@bPapa liebt Schokomünzen. Ich bin ziemlich sicher, dass er sie hier in der Schänke gekauft hat.\n@c0@"
  en: "@aNera@bPapa absolutely adores chocolate medalliyums.\r\nI'm fairly sure he bought them at the inn here.\n@c0@"
  es: "@aNera@bIl mio papino es un adicto a los medallones de chocolate.\r\nEstoy casi sicura de que los compra en esta posada.\n@c0@"
  fr: "@aNera@bPapa adore les médailles en chocolat.\r\nJe suis persuadée qu'il les achète\r\ndans cette auberge.\n@c0@"
  it: "@aNera@bMio padre adora le medaglie di cioccolato.\nCredo che ne abbia comprate un bel po' alla locanda...\n@c0@"
  ja: "@a@bフローラ「メダル型チョコは　父の\n\t大好物なんですの。　たしか\n\tここの宿屋で　買えたはずですわ。\n@c0@"
10:
  de: "@aBianca@bÄhm, glaubst du, wir können der Bank hier trauen? Auf mich wirkt das ein wenig zwielichtig.\n@c0@"
  en: "@aBianca@bUm, d'you reckon the bank here's above board, %a000090? It smells a bit fishy to me.\n@c0@"
  es: "@aBianca@bMmm, ¿tú crees que este banco es del todo limpio, %a000090? A mí me huele un poco a chamusquina, ¿sabes?\n@c0@"
  fr: "@aBianca@bMmm. Tu crois que cette banque est réglo, %a000090ⓡ Moi, elle me semble un peu louche.\n@c0@"
  it: "@aBianca@b%0%a000090, credi ci si possa fidare di questa ⓕbancaⓖ?\nSiamo sicuri che sia una cosa legale?\n@c0@"
  ja: "@a@bビアンカ「ちょっと　%a000090。\n\tここの銀行って　大丈夫なのかな？\n\tなんだか　不安になる銀行よね。\n@c0@"
11:
  de: "@aNera@bEr scheint ein vertrauenswürdiger Mann zu sein. Es ist gut zu wissen, dass er so gut auf das Geld seiner Kunden achtet.\n@c0@"
  en: "@aNera@bHe seems like a trustworthy fellow. It's nice to know he takes such good care of his customers' money.\n@c0@"
  es: "@aNera@bParece un sujeto digno de confianza. Veramente, tranquiliza saber que cuida tan bien del dinero de sus clientes.\n@c0@"
  fr: "@aNera@bIl m'a l'air d'être digne de confiance.\r\nC'est rassurant de voir qu'il prend autant\r\nsoin de l'argent de ses clients.\n@c0@"
  it: "@aNera@bIl mio istinto mi dice che possiamo fidarci di questo tizio.\nMi pare una persona onesta.\n@c0@"
  ja: "@a@bフローラ「あの方が　大切に\n\tしまってくださるそうですから\n\t安心ですわね。\n@c0@"
12:
  de: "@aBianca@bMeine Güte! Wie köstlich diese Schokolade riecht! Dieser Duft allein kann einen ja schon ganz schwach machen!\n@c0@"
  en: "@aBianca@bBlimey! What a delicious-smellin' chocolate! That smell alone is enough to send you wobbly!\n@c0@"
  es: "@aBianca@b¡Cuernos! ¡Qué bien huele este chocolate! ¡Solo con el olor ya se me hace la boca agua!\n@c0@"
  fr: "@aBianca@bNom d'un p'tit sucreⓠ Quelle délicieuse odeurⓠ\nElle suffit à me faire fondreⓠ\n@c0@"
  it: "@aBianca@bSenti che profumino delizioso!\nQuesta medaglia di cioccolato dev'essere una prelibatezza senza pari!\n@c0@"
  ja: "@a@bビアンカ「うわ～　おいしそうな\n\tチョコレート！　この甘いにおいを\n\tかいでいるだけで　幸せって感じ！\n@c0@"
13:
  de: "@aNera@bDiese Schokomünze erinnert mich an Papa.\n@c0@"
  en: "@aNera@bSeeing this chocolate medalliyum reminds me of Papa.\n@c0@"
  es: "@aNera@bEstos medallones de chocolate me recuerdan al mio papino.\n@c0@"
  fr: "@aNera@bCette médaille en chocolat me fait penser à papa.\n@c0@"
  it: "@aNera@bLe medaglie di cioccolato mi fanno venire in mente mio padre, sai?\n@c0@"
  ja: "@a@bフローラ「このメダル型チョコを\n\t見ていると　父を　思い出しますわ。\n@c0@"
14:
  de: "@aNera@bAnscheinend war er ein richtiger Schlaks, als er noch jünger war. Aber dann hat er die hier entdeckt, und von da an war er ihnen verfallen.\n@c0@"
  en: "@aNera@bHe used to be really skinny when he was younger, apparently. But then he developed a taste for these and there was no looking back.\n@c0@"
  es: "@aNera@bAl parecer, de joven era molto magro. Pero luego empezaron a gustarle estos dulces y ya no hubo remedio.\n@c0@"
  fr: "@aNera@bÀ ce qu'il paraît, il était beaucoup plus mince quand\r\nil était jeune. Puis il est devenu complètement fou\r\nde ces friandises et il n'a jamais retrouvé la ligne.\n@c0@"
  it: "@aNera@bDa giovane era magro come un chiodo, ma il suo peso forma andò a farsi benedire dopo che scoprì questi dolci deliziosi...\n@c0@"
  ja: "@a@bフローラ「昔　父は　すごくやせていた\n\tらしいんですけど　このチョコの味を\n\t知ってから　太り始めたそうですわ。\n@c0@"
15:
  de: "@aBianca@bIch könnte diese Schokomünzen futtern, bis ich kugelrund werde, aber vielleicht sollten wir uns nicht allzu sehr gehen lassen, was?\n@c0@"
  en: "@aBianca@bI could eat these chocolate medalliyums until the cows come home, but I suppose we shouldn't be too frivolous, eh?\n@c0@"
  es: "@aBianca@bPodría estar comiendo estos medallones de chocolate hasta que las vacas volasen, pero no hay que atiborrarse, ¿verdad?\n@c0@"
  fr: "@aBianca@bJe pourrais manger ces médailles en chocolat par kilos, mais je crois que nous ne pouvons pas nous permettre d'être trop dépensiers, n'est-ce pasⓡ\n@c0@"
  it: "@aBianca@bPotrei mangiare una tonnellata e mezzo di medaglie di cioccolato! Spero che, prima o poi, deciderai di comprarne qualcuna...\n@c0@"
  ja: "@a@bビアンカ「メダル型チョコなら　私\n\tいっぱいあっても　いいんだけど\n\tムダづかいは　いけないもんね。\n@c0@"
16:
  de: "@aNera@bWir dürfen nicht zu viele von diesen Schokomünzen essen, sonst werden wir dick. Kaufen wir lieber nicht zu viele davon.\n@c0@"
  en: "@aNera@bWe mustn't overindulge in these chocolate medalliyums, otherwise we'll get fat. Let's not buy too many.\n@c0@"
  es: "@aNera@bSerá mejor no excederse con estos medaglioni de chocolate si no queremos engordar. No compremos demasiados.\n@c0@"
  fr: "@aNera@bIl ne faut pas abuser de ces médailles en chocolat, sinon nous allons grossir. N'en achetons pas trop.\n@c0@"
  it: "@aNera@bLe medaglie di cioccolato sono squisite, ma se ne mangiamo troppe diventeremo grassi come porcelli!\n@c0@"
  ja: "@a@bフローラ「チョコを　食べすぎると\n\t太ってしまいますわ。\n\tあまり　買わないようにしましょう。\n@c0@"
17:
  de: "@aBianca@bOh je. Offenbar haben wir unsere Finanzen nicht allzu gut im Griff, wenn wir uns nicht mal Schokolade leisten können.\n@c0@"
  en: "@aBianca@bUh-oh. Looks like we en't bin managin' our finances all that well if we can't even afford to buy chocolate.\n@c0@"
  es: "@aBianca@b¡Oh-oh! Creo que no hemos debido de prestar la suficiente atención a nuestro bolsillo, si ni siquiera podemos permitirnos comprar chocolate, ¿sabes?\n@c0@"
  fr: "@aBianca@bOh oh. Nous n'avons pas dû bien gérer notre argent, si nous ne pouvons même pas nous offrir du chocolat.\n@c0@"
  it: "@aBianca@bChe cosa?! Non abbiamo nemmeno il denaro necessario per comprare un po' di cioccolato?!\nDiamine! Non pensavo che fossimo messi tanto male...\n@c0@"
  ja: "@a@bビアンカ「ううっ……　もう\n\tチョコを　買うお金もないなんて\n\tムダづかい　しすぎたかしら……。\n@c0@"
18:
  de: "@aNera@bWir können nächstes Mal, wenn wir hier sind, Schokolade kaufen.\n@c0@"
  en: "@aNera@bWe can buy some chocolate the next time we're here.\n@c0@"
  es: "@aNera@bPodemos comprar un poco de cioccolato la próxima vez que pasemos por aquí.\n@c0@"
  fr: "@aNera@bNous achèterons du chocolat la prochaine fois\r\nque nous viendrons.\n@c0@"
  it: "@aNera@bAh, non c'è problema.\nCompreremo il cioccolato la prossima volta che verremo qui.\n@c0@"
  ja: "@a@bフローラ「チョコは\n\tまた今度に　しましょうね。\n@c0@"
19:
  de: "@aBianca@bDie Laternen sind so hübsch, findest du nicht? Richtig elegant.\n@c0@"
  en: "@aBianca@bThe lanterns look so pretty, dun't you think?\r\nAll elegant, like.\n@c0@"
  es: "@aBianca@bQué bonitos son los faroles, ¿no crees?\r\nElegantes y todo eso.\n@c0@"
  fr: "@aBianca@bCes lanternes sont jolies, tu ne trouves pasⓡ\nC'est très élégant.\n@c0@"
  it: "@aBianca@bHai visto come sono belle quelle lanterne?\nDonano un tocco d'eleganza a tutto l'ambiente...\n@c0@"
  ja: "@a@bビアンカ「幻想的で　きれい……\n\tとうろう流しなんて　風流ね。\n@c0@"
20:
  de: "@aNera@bDiese Laternen dienen vermutlich dem Gedenken an dahingeschiedene Schleime, meinst du nicht?\n@c0@"
  en: "@aNera@bThose lanterns were probably made to commemorate departed slimes, don't you think?\n@c0@"
  es: "@aNera@bProbablemente son faroles in ricordo de los limos fallecidos, ¿no crees?\n@c0@"
  fr: "@aNera@bCes lanternes ont probablement été fabriquées en hommage aux gluants disparus, tu ne crois pasⓡ\n@c0@"
  it: "@aNera@bSecondo me quelle lanterne sono state realizzate per commemorare gli Slime defunti...\n@c0@"
  ja: "@a@bフローラ「あの　とうろうは　きっと\n\tスライムを　とむらっているのですね。\n@c0@"
21:
  de: "@aBianca@bSieht mir nicht allzu anstrengend aus.\n@c0@"
  en: "@aBianca@bIt dun't look like hard work to me.\n@c0@"
  es: "@aBianca@bA mí no me parece que sea un trabajo muy cansado, ¿sabes?\n@c0@"
  fr: "@aBianca@bÇa ne m'a pas l'air très fatigant comme travail.\n@c0@"
  it: "@aBianca@bSe lo dice lui...\nA me sembra un'occupazione di tutto riposo...\n@c0@"
  ja: "@a@bビアンカ「そんなに　きつい仕事には\n\t見えないんだけど……。\n@c0@"
22:
  de: "@aNera@bDieser arme alte Mann, dass er sich dafür zu dieser Nachtzeit nach draußen begeben muss.\n@c0@"
  en: "@aNera@bThat poor old man, having to come out\r\nat this time of night to do that.\n@c0@"
  es: "@aNera@bPobre hombre, tener que salir a estas horas de la notte para hacer eso.\n@c0@"
  fr: "@aNera@bPauvre homme... Devoir sortir à une heure aussi tardive pour faire ça...\n@c0@"
  it: "@aNera@bLo capisco, sai?\nNon dev'essere facile per un uomo della sua età uscire ogni notte per occuparsi delle lanterne...\n@c0@"
  ja: "@a@bフローラ「あのように　お年をめした方が\n\t夜どおし　とうろう流しなんて\n\tたいへんですわ。\n@c0@"
23:
  de: "@aBianca@bGlaubst du, hier ist wirklich ein großer Schatz verborgen?\n@c0@"
  en: "@aBianca@bD'you reckon there really is some\r\ngreat treasure hidden here?\n@c0@"
  es: "@aBianca@b¿Tú crees que de verdad habrá un gran tesoro oculto aquí?\n@c0@"
  fr: "@aBianca@bTu crois vraiment qu'il y a un grand trésor\ncaché iciⓡ\n@c0@"
  it: "@aBianca@bCredi davvero che qui sia nascosto un grande tesoro?\n@c0@"
  ja: "@a@bビアンカ「本当に　ここに\n\tそんなに　すごい　名産品が\n\tかくされているのかしら？\n@c0@"
24:
  de: "@aBianca@bWir könnten ein bisschen herumfragen und sehen, ob wir was herausfinden können.\n@c0@"
  en: "@aBianca@bWe could try askin' around and\r\nseein' if we get any clues.\n@c0@"
  es: "@aBianca@bPodríamos preguntar por ahí a ver si nos dan alguna pista, ¿sabes?\n@c0@"
  fr: "@aBianca@bOn pourrait poser des questions aux gens d'ici pour essayer de trouver des indices.\n@c0@"
  it: "@aBianca@bProviamo a fare qualche domanda in giro, amore.\nChissà che non scopriamo qualche indizio utile...\n@c0@"
  ja: "@a@bビアンカ「とりあえず　いろいろな人に\n\t話を　きいてみましょう。\n@c0@"
25:
  de: "@aNera@bIch glaube nicht, dass dieser große Schatz so leicht zu finden sein wird.\n@c0@"
  en: "@aNera@bI don't imagine we'll be able to acquire this\nⓗgreat treasureⓘ all that easily.\n@c0@"
  es: "@aNera@bNo me parece que hacerse con ese ⓕgran tesoroⓖ vaya a ser facile.\n@c0@"
  fr: "@aNera@bJe ne suis pas sûre qu'on réussira à mettre la main sur ce ⓥgrand trésorⓦ aussi facilement.\n@c0@"
  it: "@aNera@bNon credo che riusciremo a mettere facilmente le mani su questo fantomatico ⓕgrande tesoroⓖ...\n@c0@"
  ja: "@a@bフローラ「幻の名産品なんて\n\tそんな　すごそうなもの\n\tかんたんには　いただけませんわよね。\n@c0@"
26:
  de: "@aNera@bEs wäre schön, wenn wir etwas zur Sammlung des Museums beisteuern könnten. Sehen wir uns doch danach um, vielleicht werden wir ja fündig.\n@c0@"
  en: "@aNera@bIt would be a lovely thing to add to the museum's collection. Let's see if we can find it.\n@c0@"
  es: "@aNera@bSería un objeto precioso para agregar a la collezione del museo. Vamos a intentar dar con ello.\n@c0@"
  fr: "@aNera@bCe serait une jolie pièce à ajouter à la collection du musée. Voyons si nous pouvons la trouver.\n@c0@"
  it: "@aNera@bSarebbe bello aggiungerlo alla collezione di oggetti del Museo, non credi?\nSecondo me vale la pena cercarlo...\n@c0@"
  ja: "@a@bフローラ「博物館館長の　あなたも\n\tステキだと思いますわ。\n\tがんばって　見つけましょう。\n@c0@"
27:
  de: "@aBianca@bMir scheint fast, als käme der Mann nicht aus dieser Gegend. Nun, wenn er nichts weiß, dann weiß er eben nichts.\n@c0@"
  en: "@aBianca@bIt's almost like that bloke's not from 'round here.\r\nI s'pose it's fair enough that he dun't know, though.\n@c0@"
  es: "@aBianca@bCasi parece que ese tipo no sea de por aquí, ¿sabes?\r\nSupongo que tiene derecho a no saberlo.\n@c0@"
  fr: "@aBianca@bOn dirait presque que ce type n'est pas d'ici.\r\nMais bon, il est tout à fait envisageable qu'il ne\r\nsoit pas au courant.\n@c0@"
  it: "@aBianca@bSecondo me anche quel tipo sta cercando il tesoro. Dev'essere per questo motivo che non ha voluto dirci niente di utile: teme che lo troviamo prima di lui!\n@c0@"
  ja: "@a@bビアンカ「まあ　あの人は\n\t旅人って感じだもんね。\n\t知らなくても　ムリはないか……。\n@c0@"
28:
  de: "@aNera@bAnscheinend wissen nicht alle über diesen Schatz Bescheid, nach dem wir suchen.\n@c0@"
  en: "@aNera@bIt looks like this treasure we're looking for isn't something that everyone knows about.\n@c0@"
  es: "@aNera@bParece que no tutto il mondo ha oído hablar de ese tesoro que andamos buscando.\n@c0@"
  fr: "@aNera@bIl semblerait que le trésor que nous cherchons ne\r\nsoit pas forcément connu de tout le monde.\n@c0@"
  it: "@aNera@bNon è facile ottenere informazioni sul tesoro che stiamo cercando, eh?\nSecondo me ci conviene insistere...\n@c0@"
  ja: "@a@bフローラ「幻の名産とは　誰もが知っている\n\t…という品では　ないのですね。\n@c0@"
29:
  de: "@aBianca@bRätselhaftes Ding? Was kann das nur sein?\n@c0@"
  en: "@aBianca@bPuzzling little thing? I wonder what it is!\n@c0@"
  es: "@aBianca@b¿Minicosa rara? ¡Me pregunto qué será!\n@c0@"
  fr: "@aBianca@bCe truc qui est apparu comme par enchantementⓡ\nJe me demande ce que c'estⓠ\n@c0@"
  it: "@aBianca@bUno strano oggetto?\nDi cosa si tratterà?\n@c0@"
  ja: "@a@bビアンカ「アレ？\n\tアレって　なにかしら？？\n@c0@"
30:
  de: "@aNera@bEr hat es der Frau in der Herberge gegeben? Es kann wohl kaum ein sehr kostbarer Schatz sein, wenn er ihn einfach so weggegeben hat!\n@c0@"
  en: "@aNera@bHe gave it to the woman at the inn? It can't be that great a treasure if he just gave it away!\n@c0@"
  es: "@aNera@b¿Que se la dio a la donna de la posada? ¡Si se la dio tan alegremente, no debe de ser un tesoro muy grande!\n@c0@"
  fr: "@aNera@bIl l'a donné à la dame de l'aubergeⓡ Ça ne doit\npas être un si grand trésor que ça, s'il n'hésite pas\nà le donner.\n@c0@"
  it: "@aNera@bSe lo ha dato alla donna che gestisce la locanda, non può certo trattarsi di un tesoro prezioso! A meno che re Minikin non sia incredibilmente generoso...\n@c0@"
  ja: "@a@bフローラ「おかみさんに　あげた？\n\t幻の名産品って　そんなに　気軽に\n\tあげられるような　物なのかしら？\n@c0@"
31:
  de: "@aBianca@bSie redet sicher von dem Schatz, von dem wir gehört haben, nicht, %a000090?\n@c0@"
  en: "@aBianca@bShe must be talkin' about the treasure we heard about, eh, %a000090?\n@c0@"
  es: "@aBianca@bDebe de referirse a ese tesoro del que hemos oído hablar, ¿no, %a000090?\n@c0@"
  fr: "@aBianca@bElle doit faire référence au trésor dont nous avons entendu parler, hein, %a000090ⓡ\n@c0@"
  it: "@aBianca@bUn fermacarte?! Un tagliere?!\nMa siamo sicuri che quest'oggetto sia un tesoro, %a000090?\n@c0@"
  ja: "@a@bビアンカ「ねえ　%a000090。\n\tアレって　幻の名産品じゃないのかな？\n@c0@"
32:
  de: "@aBianca@bWenn wir schon so weit gekommen sind, dann sollten wir jetzt auch versuchen, das Ding zu finden!\n@c0@"
  en: "@aBianca@bWe should try and find the thing now we've trailed after it this far!\n@c0@"
  es: "@aBianca@b¡Ya que llevamos tanto tiempo detrás de él, deberíamos intentar encontrarlo!\n@c0@"
  fr: "@aBianca@bIl faudrait essayer de trouver cet objet,\nmaintenant que nous avons fait tout ce cheminⓠ\n@c0@"
  it: "@aBianca@bOra sì che sono curiosa!\nForza, troviamo quest'affare e vediamo di che si tratta!\n@c0@"
  ja: "@a@bビアンカ「でも　とりあえず　最後まで\n\tゆくえを　追ってみましょうか。\n@c0@"
33:
  de: "@aNera@bEs klingt, als würde dieser Schatz wirklich die Runde machen. Ich bin so gespannt darauf, was es sein könnte!\n@c0@"
  en: "@aNera@bIt sounds like this treasure is really doing the rounds. I'm so curious about what it is!\n@c0@"
  es: "@aNera@bParece que el tesoro podría estar veramente por los alrededores. ¡Tengo mucha curiosità per saber qué es!\n@c0@"
  fr: "@aNera@bCe trésor n'arrête pas de passer de main en main.\nJe suis vraiment curieuse de voir de quoi il s'agitⓠ\n@c0@"
  it: "@aNera@bSembra che nessuno voglia tenersi questo ⓕgrande tesoroⓖ, eh?\nChissà che oggetto sarà...\n@c0@"
  ja: "@a@bフローラ「みなさんに　たらい回しに\n\tされてしまう　アレって……。\n\tああっ　気になりますわ！\n@c0@"
34:
  de: "@aBianca@bEr hat es rausgeworfen?! Glaubst du, dass es wirklich derart wertlos war?\n@c0@"
  en: "@aBianca@bHe dumped it!? D'you think it's really that worthless?\n@c0@"
  es: "@aBianca@b¡¿Que lo tiró?! ¿Tú crees que tendrá algún valor?\n@c0@"
  fr: "@aBianca@bIl l'a jetéⓠⓑ Tu crois que ça a si peu de valeurⓡ\n@c0@"
  it: "@aBianca@bL'ha gettato via?! Ma non era un tesoro?!\nHo paura che stiamo solo perdendo tempo, amore mio...\n@c0@"
  ja: "@a@bビアンカ「す　す　すてた？？\n\tそんなに　いらないものなの？？\n@c0@"
35:
  de: "@aNera@bHm. Ich weiß nicht, ob ich so unbedingt etwas haben will, das jemand anders rausgeworfen hat, aber wir sollten wenigstens herausfinden, was es ist.\n@c0@"
  en: "@aNera@bHm. I'm not sure about going after something that's been thrown out, but I suppose we should go and find it after all this.\n@c0@"
  es: "@aNera@bMmm. No sé si vale la pena andare a buscar algo que han tirado, pero supongo que, después de tanto trabajo, deberíamos recuperarlo.\n@c0@"
  fr: "@aNera@bMmm. Je ne suis pas sûre que ça vaille la peine de chercher quelque chose qu'on jette si facilement.\r\nCela dit, maintenant qu'on est là, autant essayer.\n@c0@"
  it: "@aNera@bMa vogliamo davvero perdere tempo a cercare qualcosa che nessuno vuole?! Però confesso che sono curiosa di scoprire di che oggetto si tratti...\n@c0@"
  ja: "@a@bフローラ「すてられた物を　ひろうのは\n\t気が　ひけますけど…　とりあえず\n\tさがしに行った方が　いいですわよね。\n@c0@"
36:
  de: "@aBianca@bMeine Güte! Kommt mir das nur so vor oder kann diese Medaille tatsächlich sprechen?!\n@c0@"
  en: "@aBianca@bCrikey! Is it me or is that medal talkin'!?\n@c0@"
  es: "@aBianca@b¡Rayos! ¡¿Oigo cosas raras o la medalla está hablando?!\n@c0@"
  fr: "@aBianca@bBon sangⓠ C'est moi ou cette médaille parleⓠⓑ\n@c0@"
  it: "@aBianca@bDiamine!\nUna medaglia parlante!\n@c0@"
  ja: "@a@bビアンカ「な　な　なんなの？\n\tあの　巨大なメダルは？？\n@c0@"
37:
  de: "@aNera@bEs hört sich so an, als sei jemand darunter eingequetscht. Wir müssen ihm helfen!\n@c0@"
  en: "@aNera@bIt sounds like someone's squashed underneath.\r\nWe must help them!\n@c0@"
  es: "@aNera@bParece que hay alguien là sotto.\r\n¡Tenemos que ayudarle!\n@c0@"
  fr: "@aNera@bOn dirait que quelqu'un est coincé en dessous.\nIl faut l'aiderⓠ\n@c0@"
  it: "@aNera@bC'è qualcuno sotto quella medaglia!\nPresto! Dobbiamo aiutarlo!\n@c0@"
  ja: "@a@bフローラ「なにかが　下じきに\n\tなっているようですわ。\n\t早く　たすけてあげましょう。\n@c0@"
38:
  de: "@aBianca@bArmer kleiner Schleim! So eingequetscht zu sein!\n@c0@"
  en: "@aBianca@bFancy that poor slime bein' squashed like that!\n@c0@"
  es: "@aBianca@b¡Pobre limo, ahí chafado!\n@c0@"
  fr: "@aBianca@bPauvre gluant... Se faire écrabouiller comme çaⓠ\n@c0@"
  it: "@aBianca@bQuello Slime ha avuto fortuna.\nAncora qualche istante, e ci sarebbe rimasto secco...\nAnzi, ci sarebbe rimasto piatto!\n@c0@"
  ja: "@a@bビアンカ「スライムにまで\n\t押しつけられちゃったね……。\n@c0@"
39:
  de: "@aBianca@bDas muss dieser geheimnisvolle Schatz sein, von dem wir so viel gehört haben.\n@c0@"
  en: "@aBianca@bThis must be this so-called ⓗgreat treasureⓘ we've bin hearin' so much about.\n@c0@"
  es: "@aBianca@bEste debe de ser ese ⓕgran tesoroⓖ del que tanto hemos oído hablar.\n@c0@"
  fr: "@aBianca@bCe doit être le soi-disant ⓥgrand trésorⓦ dont on a tellement entendu parler.\n@c0@"
  it: "@aBianca@bAllora sarebbe questo il ⓕgrande tesoroⓖ di cui avevamo sentito parlare?\n@c0@"
  ja: "@a@bビアンカ「これが　幻の名産品\n\tなんだろうけど……\n@c0@"
40:
  de: "@aBianca@bAlso, er macht ja nicht gerade viel her.\n@c0@"
  en: "@aBianca@bI've gotta say, it's a bit of a let-down.\n@c0@"
  es: "@aBianca@bPues para mí ha sido más bien un chasco...\n@c0@"
  fr: "@aBianca@bJe dois dire que je suis un peu déçue.\n@c0@"
  it: "@aBianca@bChe delusione...\nMi aspettavo qualcosa di molto più prezioso...\n@c0@"
  ja: "@a@bビアンカ「やった～！\n\tついに　手に入れたわよ！　…っていう\n\tよろこびは　感じられなかったね。\n@c0@"
41:
  de: "@aNera@bNun, es scheint, als hätten wir den geheimnisvollen Schatz gefunden.\n@c0@"
  en: "@aNera@bWell. I, er, suppose we've found the\nⓗgreat treasureⓘ then.\n@c0@"
  es: "@aNera@bVaya. Pues sembra que ya hemos encontrado el, ejem, ⓕgran tesoroⓖ.\n@c0@"
  fr: "@aNera@bEh bien... euh... j'imagine que nous avons trouvé\nle ⓥgrand trésorⓦ.\n@c0@"
  it: "@aNera@bUhm...\nA occhio e croce, direi che abbiamo trovato il ⓕgrande tesoroⓖ.\n@c0@"
  ja: "@a@bフローラ「と　とりあえず\n\t幻の名産品が　手に入って\n\tよかったですわね。\n@c0@"
42:
  de: "@aNera@bWenigstens den alten Mann wird es freuen. Wir sollten das Ding schnell zu ihm bringen.\n@c0@"
  en: "@aNera@bThat old man will probably be pleased with it,\r\nat any rate. We should hurry up and take it to him.\n@c0@"
  es: "@aNera@bEn todo caso, probablemente el abuelo estará contento. Vamos a llevárseloⓓ presto.\n@c0@"
  fr: "@aNera@bDe toute façon, le vieil homme sera sans doute ravi de l'avoir. Nous devrions vite le lui rapporter.\n@c0@"
  it: "@aNera@bSperiamo che il nostro anziano amico lo apprezzi...\nChe ne diresti di portarglielo subito, eh?\n@c0@"
  ja: "@a@bフローラ「あの　おじいさんなら\n\tよろこんでくれるでしょうから。\n\t早く　とどけてあげましょう。\n@c0@"
43:
  de: "@aBianca@bSie ist ja ziemlich undurchdringlich. Vielleicht lässt sie sich ja doch als Schild verwenden! Ich frage mich...\n@c0@"
  en: "@aBianca@bIt is pretty solid, I suppose. Maybe it could be used as a shield, after all! I wonder...!\n@c0@"
  es: "@aBianca@bParece que es bastante robusta. ¡A lo mejor se podría utilizar como escudo! Quién sabe si...\n@c0@"
  fr: "@aBianca@bRemarque, elle est plutôt solide. On pourrait\npeut-être l'utiliser comme bouclier, après toutⓠ\nFaut voir...\n@c0@"
  it: "@aBianca@bSì, è vero: le minimedaglie sono molto più carine.\nPerò... Uhm, non è che quest'affare si potrebbe usare come scudo...?\n@c0@"
  ja: "@a@bビアンカ「でも　でも！\n\t大きなメダルは　いちおう　盾だし！\n\t誰か　装備できるかもよ？\n@c0@"
44:
  de: "@aNera@bIch finde ja Maximedaillen auch ganz hübsch. Papa würde sie bestimmt gern mal sehen.\n@c0@"
  en: "@aNera@bI think maxi medals are quite pretty too, personally. Papa would love to see it.\n@c0@"
  es: "@aNera@bPersonalmente, creo que las maximedallas son bastante bonitas. Al mio papino le encantaría verla.\n@c0@"
  fr: "@aNera@bPersonnellement, je trouve que les maxi médailles\r\nont aussi leur charme. Je suis sûre que papa adorerait la voir.\n@c0@"
  it: "@aNera@bA me questa maximedaglia non dispiace affatto, e sono certa che anche mio padre l'apprezzerebbe molto!\n@c0@"
  ja: "@a@bフローラ「あら　私は　大きなメダルも\n\tきれいだと　思いますわよ。\n\t父も　よろこびそうですわ。\n@c0@"
45:
  de: "@aBianca@bDann war sie also im Brunnen. Kein Wunder, dass der alte Firle Franz sie nicht finden konnte.\n@c0@"
  en: "@aBianca@bSo it was in the fountain. No wonder\r\nOld Man Nick Knack couldn't find it.\n@c0@"
  es: "@aBianca@bAsí que estaba en la fuente. No me extraña que el abuelo Nino no pudiese encontrarla, ¿sabes?\n@c0@"
  fr: "@aBianca@bAlors elle était dans la fontaine. Pas étonnant que\r\nle vieux Bricabrac ne l'ait pas trouvée.\n@c0@"
  it: "@aBianca@bE così era nella fontana, eh?\nEcco perché il vecchio Geremia non era riuscito a trovarla!\n@c0@"
  ja: "@a@bビアンカ「ふん水に　沈んでたんだ……。\n\tそりゃ　あの　博物館のおじいさんに\n\t見つからないはずよねえ。\n@c0@"
46:
  de: "@aNera@bAh, darum riecht sie also so seltsam! Weil sie die ganze Zeit im Wasser gelegen hat!\n@c0@"
  en: "@aNera@bAh, that must be why it has that funny smell to it, because of being in the water all that time.\n@c0@"
  es: "@aNera@b¡Ah!, debe de ser por eso que tiene ese olor tan curioso, por haber estado en el acqua tanto tiempo.\n@c0@"
  fr: "@aNera@bAh, c'est sans doute pour ça qu'elle sent bizarre.\r\nAprès être restée dans l'eau si longtemps, ce n'est pas étonnant.\n@c0@"
  it: "@aNera@bChissà di quale materiale è fatta questa maximedaglia...\n@c0@"
  ja: "@a@bフローラ「じゃあ　この大きなメダルが\n\tほんのり　におうのは\n\t水ゴケや　ドロのせいだったのね……。\n@c0@"
47:
  de: "@aBianca@bMeine Güte! Ich hoffe, niemand wurde ernsthaft verletzt! So viel dazu, dass Schätze immer etwas Gutes sind!\n@c0@"
  en: "@aBianca@bBlimey! I hope no one was too badly hurt. So much for treasure bein' good!\n@c0@"
  es: "@aBianca@b¡Cuernos! Espero que nadie se hiciera demasiado daño. ¡Y dicen que los tesoros son algo bueno!\n@c0@"
  fr: "@aBianca@bOh là làⓠ J'espère que personne n'a été gravement blessé. Les trésors ne font pas que des heureuxⓠ\n@c0@"
  it: "@aBianca@bAlla faccia del gesto generoso!\nSperiamo solo che nessuno ci abbia lasciato le penne...\n@c0@"
  ja: "@a@bビアンカ「し　死人は出なかったのかしら。\n\t悪夢のような　宝さがしね……。\n@c0@"
48:
  de: "@aNera@bHuch! Das muss ja eine gewaltige Schatzsuche gewesen sein. Das hätte Papa bestimmt gefallen.\n@c0@"
  en: "@aNera@bGoodness! What a huge-scale treasure hunt that would have been. Papa would've loved it.\n@c0@"
  es: "@aNera@b¡Per la Diosa! Eso sí que hubiese sido una caza del tesoro a gran escala. Al mio papino le hubiese encantado.\n@c0@"
  fr: "@aNera@bPar la Déesseⓠ Quelle gigantesque chasse au trésor ça a dû êtreⓠ Papa aurait adoréⓠ\n@c0@"
  it: "@aNera@bBisogna essere totalmente folli per lanciare in aria oggetti del genere! Più che un atto di generosità, lo definirei un bombardamento!\n@c0@"
  ja: "@a@bフローラ「まあ！　きぼの大きい\n\t宝さがしですこと！\n\t父も　びっくりですわ。\n@c0@"
49:
  de: "@aGriselda@bDas ist aber ein hübsches Schloss. Nicht der schlechteste Ort, an dem man wohnen kann.\n@c0@"
  en: "@aDebora@bThat castle is quite sweet-looking.\nI can think of worse places to live.\n@c0@"
  es: "@aStefania@bEse castello tiene muy buona pinta. Se me ocurren sitios peores donde vivir.\n@c0@"
  fr: "@aPandora@bCe château est plutôt mignon. Il y a pire, comme endroit où vivre.\n@c0@"
  it: "@aViola@bQuesto castello è proprio carino.\nSì, non mi dispiacerebbe affatto vivere qui...\n@c0@"
  ja: "@a@bデボラ「ふ～ん　かわいらしい　お城ね。\n\tこういう　お城を　別荘にするのも\n\t悪くないかもね。\n@c0@"
50:
  de: "@aGriselda@bDa drüben hüpft irgendwas. Ist das ein Schleim?\n@c0@"
  en: "@aDebora@bThere's a little thing bouncing about over there. Is it a slime?\n@c0@"
  es: "@aStefania@bAhí hay una cosa rebotando. ¿Es un limo?\n@c0@"
  fr: "@aPandora@bIl y a une petite chose qui bondit, par là-bas.\nC'est un gluantⓡ\n@c0@"
  it: "@aViola@bCos'è quell'affare che rimbalza laggiù?\nUno Slime, forse?\n@c0@"
  ja: "@a@bデボラ「なにか　ぴょん　ぴょん\n\tはねてる子が　いるわね……。\n\tアレって　スライムかしら？\n@c0@"
51:
  de: "@aGriselda@bAnscheinend gibt's sogar in der Monsterwelt Wesen, die hart an sich arbeiten.\n@c0@"
  en: "@aDebora@bLooks like there are hard-working sorts even in the monster world.\n@c0@"
  es: "@aStefania@bSembra que hasta entre los monstruos los hay molto trabajadores, no como tú.\n@c0@"
  fr: "@aPandora@bApparemment, il y a des bourreaux de travail même chez les monstres.\n@c0@"
  it: "@aViola@bNon sapevo che anche i mostri lavorassero per potenziare le loro capacità...\n@c0@"
  ja: "@a@bデボラ「魔物の世界にも\n\t努力家が　いるのね。\n@c0@"
52:
  de: "@aGriselda@bAber ich bin ja praktisch schon von Geburt an perfekt, also musste ich in der Richtung nie irgendwelche Anstrengungen unternehmen.\n@c0@"
  en: "@aDebora@bI've been basically perfect since the day I was born, though, so there's no need for me to make an effort.\n@c0@"
  es: "@aStefania@bYo soy básicamente perfetta desde que nací, así que no es necesario que haga esfuerzo alguno.\n@c0@"
  fr: "@aPandora@bMais en ce qui me concerne, j'ai été quasiment parfaite depuis le jour de ma naissance, alors je\r\nn'ai pas besoin de faire d'efforts.\n@c0@"
  it: "@aViola@bIo sono fortunata: sono nata perfetta, quindi non ho mai avuto bisogno di allenarmi per migliorarmi.\n@c0@"
  ja: "@a@bデボラ「私は　生まれながらに\n\t出来のいい人間だから\n\t努力は　したことないけどね。\n@c0@"
53:
  de: "@aGriselda@bPrügelpyjama? Igitt! Die müffeln bestimmt nach Schweiß!\n@c0@"
  en: "@aDebora@bPowjamas? Yuck!\r\nI bet they smell of sweat.\n@c0@"
  es: "@aStefania@b¿Pijamas acolchados? ¡Puaj!\r\nOlerán a sudore.\n@c0@"
  fr: "@aPandora@bUn pyjama de combatⓡ Beurkⓠ\nJe parie que ça sent la sueur.\n@c0@"
  it: "@aViola@bUn pigiama da guerra?!\nMa come si fa a combattere indossando un indumento del genere?!\n@c0@"
  ja: "@a@bデボラ「戦士のパジャマ？\n\tそんな　汗くさそうなのは\n\tいらないから。\n@c0@"
54:
  de: "@aGriselda@bAlso verkaufen sie hier Schokomünzen. Ach, lecker! Du solltest mir am besten ein paar besorgen.\n@c0@"
  en: "@aDebora@bSo they sell chocolate medalliyums here. I love them! You'd better buy me some.\n@c0@"
  es: "@aStefania@bAsí que aquí venden medallones de cioccolato. ¡Me encantan! Ya me estás comprando uno, ¿capisci?\n@c0@"
  fr: "@aPandora@bAlors ils font des médailles en chocolat, iciⓡ\nJ'adore çaⓠ Tu as intérêt à m'en acheter.\n@c0@"
  it: "@aViola@bAdoro le medaglie di cioccolato!\nCaro, devi assolutamente comprarmene qualcuna.\nPoi le mangerò e ti racconterò che gusto hanno...\n@c0@"
  ja: "@a@bデボラ「メダル型チョコ　って\n\tここで　売ってたのね。\n\tおいしいから　買いなさいよね。\n@c0@"
55:
  de: "@aGriselda@bAch ja, die Schokomünze. Die hat Papa immer gern gegessen.\n@c0@"
  en: "@aDebora@bAh yes, the chocolate medalliyum.\nPapa's always loved these.\n@c0@"
  es: "@aStefania@b¡Ah!, sí, medallones de cioccolato. Al mio papino le encantan.\n@c0@"
  fr: "@aPandora@bAh oui, les médailles en chocolat.\r\nPapa a toujours adoré ça.\n@c0@"
  it: "@aViola@bIl mio paparino adora le medaglie di cioccolato!\n@c0@"
  ja: "@a@bデボラ「そうそう　このチョコね。\n\t昔から　パパの好物なの。\n@c0@"
56:
  de: "@aGriselda@bEr hat selbst irgendwie was von Schokolade an sich. Wenn ich's darauf anlege, schmilzt er nur so dahin und ich kann ihn um den Finger wickeln!\n@c0@"
  en: "@aDebora@bHe's just like chocolate himself. If I turn on the charm, I can make him melt and do whatever I want!\n@c0@"
  es: "@aStefania@bÉl mismo parece de cioccolato. ¡Cuando me lo propongo se derrite y consigo lo que quiero! Como contigo.\n@c0@"
  fr: "@aPandora@bD'ailleurs, il est lui-même comme du chocolat.\nIl me suffit de jouer la carte du charme pour le faire fondre et obtenir tout ce que je veuxⓠ\n@c0@"
  it: "@aViola@bÈ per questo che mi vuole tanto bene: dice che gliele ricordo. Ha ragione: anch'io sono molto saporita, e lascio un retrogusto amaro a chi mi assaggia!\n@c0@"
  ja: "@a@bデボラ「私が甘えると　パパは　性格まで\n\tチョコレートみたいになっちゃって\n\tデレデレに　とけるのよ。\n@c0@"
57:
  de: "@aGriselda@bWas? Du willst mir keine Schokomünzen kaufen? Na, du wirst ja ganz schön mutig ⓚⓛ mir offen zu widersprechen!\n@c0@"
  en: "@aDebora@bWhat? You're not buying any chocolate medalliyums? You've got some nerve, disobeying a direct order!\n@c0@"
  es: "@aStefania@b¿Qué? ¿No vas a comprar medallones de cioccolato? Ma, ¿cómo te atreves a desobedecerme?\n@c0@"
  fr: "@aPandora@bQuoiⓡ Tu n'achètes aucune médaille en chocolatⓡ\nTu ne manques pas d'audace pour oser désobéir\nà un ordre directⓠ\n@c0@"
  it: "@aViola@bChe cosa?! Non hai intenzione di acquistare medaglie di cioccolato?! Ti ordino di farlo! Mi hai capito, %a000090?! Esigo che tu ne compri qualcuna!\n@c0@"
  ja: "@a@bデボラ「あら？　チョコ買わないの？\n\t私の命令でも　買わないわけ？\n\t……いい度胸じゃない。\n@c0@"
58:
  de: "@aGriselda@bDu kannst dir nicht mal eine popelige kleine Schokomünze leisten? Dann verkauf was, damit Geld reinkommt! Was von deinen Sachen, natürlich.\n@c0@"
  en: "@aDebora@bYou can't afford one measly chocolate medalliyum? Then you'd better sell something and get some cash. Something of yours, naturally.\n@c0@"
  es: "@aStefania@b¿No puedes permitirte un triste medallón de cioccolatto? Pues ya estás vendiendo algo para conseguir dinero. Algo tuyo, claro.\n@c0@"
  fr: "@aPandora@bTu n'as même pas de quoi payer une malheureuse médaille en chocolatⓡ\n㈡\nTu ferais bien de vendre quelque chose pour récupérer un peu d'or, dans ce cas.\nQuelque chose qui t'appartient, évidemment.\n@c0@"
  it: "@aViola@bNon puoi nemmeno permetterti di comprare una misera medaglia di cioccolato?! Andiamo bene!\nMa chi me l'ha fatto fare di sposarti?!\n㈡\nAlmeno, quando vivevo con mamma e papà, non morivo di fame!\n@c0@"
  ja: "@a@bデボラ「チョコひとつ買う　お金がない？\n\tなんか　売って　お金つくりなさいよ。\n\tもちろん　%a000090のやつをね。\n@c0@"
59:
  de: "@aGriselda@bOh! Diese Laternen müssen für die Schleime sein, die dahingeschieden sind. Sieht das nicht wunderhübsch aus?\n@c0@"
  en: "@aDebora@bOh! Those lanterns must be for slimes who've passed away. What a lovely sight!\n@c0@"
  es: "@aStefania@b¡Oh!, esos farolillos serán por limos que han muerto. ¡Qué vista tan bella!\n@c0@"
  fr: "@aPandora@bOhⓠ Ces lanternes doivent être dédiées aux gluants disparus. Quelle charmante attentionⓠ\n@c0@"
  it: "@aViola@bQuelle lanterne sono davvero splendide!\n@c0@"
  ja: "@a@bデボラ「あら……？\n\tあれは　とうろう流し？\n\tきれいね……。\n@c0@"
60:
  de: "@aGriselda@b... Das wär dein Stichwort gewesen, %a000090! Muss ich dir denn alles vorbeten? Jetzt musst du sagen, ich wäre viel hübscher!\n@c0@"
  en: "@aDebora@b...Can't you take a hint, %a000090? This is where you're supposed to say that I'm far lovelier.\n@c0@"
  es: "@aStefania@bNo las pillas, ¿eh, %a000090? Ahora tú tienes que decir que yo soy aún más bella.\n@c0@"
  fr: "@aPandora@b... Tu n'as pas compris l'allusion, %a000090ⓡ C'est maintenant que tu es censé me dire que je suis bien plus charmante que ces objets.\n@c0@"
  it: "@aViola@bE non azzardarti a dire che sono più carina di loro!\nCi mancherebbe solo che tu mi paragonassi a degli oggetti...\n@c0@"
  ja: "@a@bデボラ「……ちょっと　%a000090。\n\tあんた　気のきいたこと　言えないの？\n\t私の方が　きれい　とかさ。\n@c0@"
61:
  de: "@aGriselda@bIch weiß, du willst immer wissen, was die Leute im Schilde führen, aber wenn du hier noch lange rumstehst, bist du bald selbst ein alter Mann.\n@c0@"
  en: "@aDebora@bI know you're interested in what people are up to, but you'll be an old man yourself if you stand here much longer.\n@c0@"
  es: "@aStefania@bSé que te interesa lo que hace la gente, ma si te quedas mucho más aquí acabarás hecho un vecchio también.\n@c0@"
  fr: "@aPandora@bJe sais que ce que font les gens t'intéresse,\r\nmais tu finiras vite vieux, toi aussi, si tu restes planté là encore longtemps.\n@c0@"
  it: "@aViola@bCaro, hai intenzione di star qui a far nulla ancora a lungo? Perché non ci dedichiamo a qualcosa di più costruttivo? Ma devo proprio dirti tutto io, eh?!\n@c0@"
  ja: "@a@bデボラ「人ごと　みたいに見てるけど\n\tボーッとしてるうちに　あんたも\n\tいずれ　じいさんになるのよ。\n@c0@"
62:
  de: "@aGriselda@bEin großer Schatz... Hmm. Solange er nicht nur in seiner Vorstellung existiert, ist das prima.\n@c0@"
  en: "@aDebora@bA great treasure... Hmm. As long as it's not just his imagination that's great.\n@c0@"
  es: "@aStefania@bUn gran tesoro... Mmm. Mientras no sean imaginaciones suyas, va bene.\n@c0@"
  fr: "@aPandora@bUn grand trésor... Mmm. Si ce n'est pas juste\nle fruit de son imagination, c'est intéressant.\n@c0@"
  it: "@aViola@bUn oggetto prezioso nascosto da queste parti?\nUhm...\nSarà, ma a me la cosa puzza tanto di fandonia...\n@c0@"
  ja: "@a@bデボラ「幻の名産品……。\n\t本当に幻でした　というオチだったら\n\tゆるせないわね。\n@c0@"
63:
  de: "@aGriselda@bDu musst ihn finden, %a000090. Ich bin nicht sehr gut, wenn es darum geht, Dinge zu finden.\n@c0@"
  en: "@aDebora@bYou're going to have to find it, %a000090. I'm not very good when it comes to looking for things.\n@c0@"
  es: "@aStefania@bTe toca encontrarlo, %a000090. A mí no se me da bene eso de buscar.\n@c0@"
  fr: "@aPandora@bTu vas devoir le chercher, %a000090.\nJe ne suis pas très douée quand il s'agit\nde trouver des choses.\n@c0@"
  it: "@aViola@b%0%a000090, ti affido il compito di trovare il tesoro.\n㈡\nIo ti aiuterò restando comodamente sdraiata da qualche parte, così da non intralciarti nelle tue ricerche...\n@c0@"
  ja: "@a@bデボラ「%a000090。\n\t名産品をさがすのは　まかせたからね。\n\t私　物をさがすの　苦手なんだから。\n@c0@"
64:
  de: "@aGriselda@bWorauf wartest du denn noch? Du solltest zum König gehen und mit ihm sprechen. Irgendwas weiß er sicher.\n@c0@"
  en: "@aDebora@bWhat are you waiting for? You should go and speak to the King. He's bound to know something.\n@c0@"
  es: "@aStefania@b¿A qué esperas? Deberías ir a hablar con el rey. Sicuro que sabe algo.\n@c0@"
  fr: "@aPandora@bQu'est-ce que tu attendsⓡ Tu devrais aller parler au roi. Il sait forcément quelque chose.\n@c0@"
  it: "@aViola@bMuoviti, pigrone della malora!\nCorri a parlare con re Minikin!\nChissà che non scopriamo qualcosa di interessante...\n@c0@"
  ja: "@a@bデボラ「ほら　はやく　王さまに\n\t聞きに　行きなさい。\n\tきっと　何か　知ってるはずよ。\n@c0@"
65:
  de: "@aGriselda@bRätselhaftes Ding? Worum es dabei wohl geht?\n@c0@"
  en: "@aDebora@bPuzzling little thing?\r\nWhat's that all about, I wonder.\n@c0@"
  es: "@aStefania@b¿Minicosa rara?\r\nA saber qué es.\n@c0@"
  fr: "@aPandora@bUn truc apparu comme par enchantementⓡ\nJe me demande bien de quoi il s'agit.\n@c0@"
  it: "@aViola@bNon so che darei per scoprire di che cosa si tratta...\n@c0@"
  ja: "@a@bデボラ「なあ～んだ。　アレのことね。\n\t……で　アレって　なあに？\n@c0@"
66:
  de: "@aGriselda@bAber was ist es denn?! Hmpf. Jetzt lässt mir die Neugier keine Ruhe mehr. Du musst es für mich suchen.\n@c0@"
  en: "@aDebora@bBut what is it!? Hmph. My curiosity has the better of me now. You're going to have to find it.\n@c0@"
  es: "@aStefania@b¿Ma che cosa es? Ya me ha vencido la curiosità: tendrás que encontrarlo.\n@c0@"
  fr: "@aPandora@bMais qu'est-ce que c'estⓡⓐ Mmpf. Ma curiosité a pris le dessus, maintenant. Tu vas devoir le trouver.\n@c0@"
  it: "@aViola@bOh, che cosa sarà mai?!\nSono troppo curiosa!\nDevi assolutamente scoprirlo, %a000090!\n@c0@"
  ja: "@a@bデボラ「だから　アレって　なんなのよ！\n\tもう　こうなったら　意地でも\n\tアレのこと　さがしなさい！\n@c0@"
67:
  de: "@aGriselda@bWas dem einen sein Müll, ist dem anderen sein Schatz. So, wie es da draußen auch Frauen gibt, die jene Männer nehmen, denen ich das Herz gebrochen habe.\n@c0@"
  en: "@aDebora@bOne man's rubbish is another man's treasure.\r\nJust like there are bound to be women out there who'll take on the men whose hearts I've broken.\n@c0@"
  es: "@aStefania@bLo que para uno es immondizie para otro es un tesoro.\n㈡\nIgual que habrá mujeres por ahí para aquellos a los que he roto il cuore.\n@c0@"
  fr: "@aPandora@bLes déchets de certains sont des trésors pour d'autres. Tout comme il existe forcément des femmes qui récupèrent des hommes dont j'ai brisé le cœur.\n@c0@"
  it: "@aViola@bCome si fa a gettar via un oggetto prezioso?!\nNon vorrei che questo ⓕtesoroⓖ si rivelasse una bufala colossale...\n@c0@"
  ja: "@a@bデボラ「すてる神あれば　ひろう神ありよ。\n\t私がすてた　男たちも\n\tひろってくれる人はいたから　大丈夫よ。\n@c0@"
68:
  de: "@aGriselda@bDu willst doch wohl nicht einfach wegschauen, oder, %a000090? Zeig doch mal ein bisschen Mitgefühl!\n@c0@"
  en: "@aDebora@bYou're not just going to turn a blind eye are you, %a000090? Have some compassion!\n@c0@"
  es: "@aStefania@bNo irás a hacer oídos sordos, ¿no, %a000090? ¡Ten algo de pietà!\n@c0@"
  fr: "@aPandora@bTu ne vas quand même pas fermer les yeux, %a000090ⓡⓐ Aie un peu de compassionⓠ\n@c0@"
  it: "@aViola@bEhi, %a000090! Non mi dirai che vuoi tirar dritto e far finta di non aver visto niente, vero?!\nTi ordino di dare una mano a quel poveretto!\n@c0@"
  ja: "@a@bデボラ「%a000090！\n\tあんた　見て見ぬフリ？\n\t人として　どうなのよ？\n@c0@"
69:
  de: "@aGriselda@bMeinst du, das ist er? Der geheimnisvolle große Schatz? Ja, das lässt sich natürlich ganz schwer im Auge behalten. Im Unterschied zu dir.\n@c0@"
  en: "@aDebora@bDo you think this is it? The elusive ⓗgreat treasureⓘ? You can see how it might be hard to keep tabs on. Unlike you.\n@c0@"
  es: "@aStefania@b¿Crees que es esto?, ¿el famoso ⓕgran tesoroⓖ? No me extraña que fuera tan escurridizo. Sobre todo para un stulto como tú.\n@c0@"
  fr: "@aPandora@bTu crois que c'est çaⓡ Le mystérieux ⓥgrand trésorⓦⓡ On comprend mieux pourquoi il peut être difficile retrouver sa trace. Contrairement à toi.\n@c0@"
  it: "@aViola@bCredi che sia questo il misterioso tesoro?\nMi aspettavo qualcosa di diverso...\n@c0@"
  ja: "@a@bデボラ「コレが　アレ？\n\tたしかに　シリに　しくことは\n\tできなさそうね。　あんたとちがって。\n@c0@"
70:
  de: "@aGriselda@bDann gehen wir jetzt besser wieder zu dem Alten und bringen ihm, worauf er so lange gewartet hat, %a000090.\n@c0@"
  en: "@aDebora@bWe'd better get back to the old man and give him what he's been waiting for then, %a000090.\n@c0@"
  es: "@aStefania@bMejor será volver con el vecchio y darle lo que ha estado esperando, %a000090.\n@c0@"
  fr: "@aPandora@bOn ferait bien de retourner voir le vieil homme pour lui donner ce qu'il attend, %a000090.\n@c0@"
  it: "@aViola@bAndiamo da Geremia e portiamogli questo bel regalino, %a000090.\nSono certa che lo apprezzerà.\n@c0@"
  ja: "@a@bデボラ「さあ　%a000090。\n\tあの　じいさんに\n\tとどけに　行きましょう。\n@c0@"
71:
  de: "@aGriselda@bMan könnte sie vielleicht als Schild nehmen, wenn man nichts anderes zur Hand hat. Aber ich hab ja dich für den Notfall, ich brauch sie nicht.\n@c0@"
  en: "@aDebora@bI suppose it could come in handy as a shield if you were desperate. But I have you if needs be, so I'm fine.\n@c0@"
  es: "@aStefania@bSupongo que se podría usar de escudo si estás desesperado. Ma come te tengo a ti de escudo humano, no me hace falta.\n@c0@"
  fr: "@aPandora@bJ'imagine que ça pourrait toujours servir de bouclier, en cas d'extrême nécessité. En ce qui me concerne, je t'ai toi, alors je n'ai pas ce problème.\n@c0@"
  it: "@aViola@bImmagino che, in casi disperati, la si potrebbe anche usare come scudo. A me, però, non serve: se proprio mi servisse un riparo, mi nasconderei dietro di te!\n@c0@"
  ja: "@a@bデボラ「いざという時に\n\t盾としての　価値はあると思うわ。\n\tあんたが　私の　盾であるようにね。\n@c0@"
72:
  de: "@aGriselda@bSie riecht etwas muffig. Aber wir sollten vielleicht einfach froh sein, dass sie nicht mehr am Grunde des Brunnens liegt.\n@c0@"
  en: "@aDebora@bIt does smell a bit nasty. But I suppose we should just be grateful it's not still lying at the bottom of the fountain.\n@c0@"
  es: "@aStefania@bHuele fatal, ma supongo que hay que dar gracias por que no siga en el fondo de la fontana.\n@c0@"
  fr: "@aPandora@bElle ne sent pas très bon. Mais réjouissons-nous plutôt qu'elle ne gise plus au fond de la fontaine.\n@c0@"
  it: "@aViola@bSarà anche bella, ma questa maximedaglia puzza di muffa!\n@c0@"
  ja: "@a@bデボラ「たしかに　あんまりよね。\n\tでも　ふん水に　沈んだままでなくて\n\tよしとしましょう。\n@c0@"
73:
  de: "@aGriselda@bFliegende Maximedaillen? Das klingt ziemlich gefährlich!\n@c0@"
  en: "@aDebora@bFlying maxi medals?\r\nThat sounds a bit lethal!\n@c0@"
  es: "@aStefania@b¿Maximedallas voladoras?\r\n¡Suena mortale!\n@c0@"
  fr: "@aPandora@bDes maxi médailles volantesⓡ\nÇa a l'air mortelⓠ\n@c0@"
  it: "@aViola@bMa come si fa a lanciare oggetti tanto grossi e pesanti?!\nSe qualcuno l'avesse presa sulla zucca, ci sarebbe rimasto secco!\n@c0@"
  ja: "@a@bデボラ「空とぶ　つけもの石……。\n\t……ちょっとした　恐怖ね。\n@c0@"
74:
  de: "@aGriselda@bNera würde ihr Geld sicher ohne zu zögern hier deponieren. Was ist mit dir?\n@c0@"
  en: "@aDebora@bI'm sure Nera would deposit her money here without a second thought. How about you?\n@c0@"
  es: "@aStefania@bSeguro que Nera depositaría aquí su dinero sin pensárselo due veces. ¿Y tú?\n@c0@"
  fr: "@aPandora@bJe parie que Nera déposerait son argent ici sans\ny réfléchir à deux fois. Toi aussi, tu le feraisⓡ\n@c0@"
  it: "@aViola@bSono certa che quell'ingenua di Nera depositerebbe qui tutti i suoi soldi senza pensarci un attimo. Anche tu lo faresti, caro?\n@c0@"
  ja: "@a@bデボラ「フローラなら\n\tここの銀行にも　お金　預けそうね。\n\tあんたも　お金　預けるつもり？\n@c0@"
75:
  de: "@aGriselda@bHa ha! Du gehst ganz gern mal ein Risiko ein, was?\n@c0@"
  en: "@aDebora@bHa ha! You don't mind taking the odd risk every now and then, do you?\n@c0@"
  es: "@aStefania@b¡Ja ja! Veramente, no te importa arriesgarte de vez en cuando, ¿eh?\n@c0@"
  fr: "@aPandora@bHa haⓠ Tu n'as pas peur de vivre dangereusement de temps en temps, heinⓡ \n@c0@"
  it: "@aViola@bLo sapevo!\nSei proprio un credulone, marito mio!\nNon sai cheⓕfidarsi è bene, ma non fidarsi è meglioⓖ?\n@c0@"
  ja: "@a@bデボラ「あらあら……。\n\tやっぱり　あんたは　楽しめそうな人ね。\n\tいろいろと。\n@c0@"
76:
  de: "@aGriselda@bHmpf. Ich hätte nicht gedacht, dass du so auf Nummer sicher gehen würdest. Was für eine Krämerseele.\n@c0@"
  en: "@aDebora@bHmph. I didn't expect you to be so cautious.\r\nHow dull.\n@c0@"
  es: "@aStefania@bMmm. Veramente, no esperaba que fueras tan precavido.\r\nQué muermo.\n@c0@"
  fr: "@aPandora@bMmpf. Je ne m'attendais pas à te voir si prudent. C'est d'un triste...\n@c0@"
  it: "@aViola@bNo?!\nNon dirmi che hai intenzione di andartene in giro con tutti i tuoi soldi nella borsa! È pericolosissimo!\n㈡\nChe faremmo se li perdessi?\nCome potresti comprarmi cosmetici e vestitini vari?!\n@c0@"
  ja: "@a@bデボラ「あら　意外と　しっかりしてるのね。\n\t……つまんないわ～。\n@c0@"
