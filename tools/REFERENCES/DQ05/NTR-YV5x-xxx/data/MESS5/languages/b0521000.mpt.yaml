0:
  de: "@aBianca@bDann führt unser Weg also über diesen Berg... Das wird nicht leicht, aber das kriegen wir schon hin.\n@c0@"
  en: "@aBianca@bSo we've gotta get over this mountain... Looks like it'll be hard work, but I'm sure we'll manage.\n@c0@"
  es: "@aBianca@bAsí que tenemos que atravesar esta montaña... Parece que va ser duro, pero yo creo que nos las arreglaremos, ¿sabes?\n@c0@"
  fr: "@aBianca@bIl faut donc que nous franchissions cette montagne. Ça ne sera pas facile, mais je suis certaine que\r\nnous y arriverons.\n@c0@"
  it: "@aBianca@bDobbiamo superare questa montagna, eh?\nNon sarà facile, ma sono sicura che ce la faremo.\n@c0@"
  ja: "@a@bビアンカ「この山を　こえるのね……。\n\t道のりは　けわしそうだけど\n\t私　がんばるわ。\n@c0@"
1:
  de: "@aNera@bIch glaube, ich habe noch nie einen so hohen Gebirgszug gesehen. Hoffentlich schaffen wir es, ihn zu überqueren.\n@c0@"
  en: "@aNera@bI don't think I've ever seen such a tall mountain range. I hope we'll manage to cross it.\n@c0@"
  es: "@aNera@bCreo que nunca he visto una cordillera così de alta. Espero que seamos capaces de cruzarla.\n@c0@"
  fr: "@aNera@bJe ne crois pas avoir jamais vu une chaîne de montagnes aussi élevée. J'espère que nous arriverons à la franchir.\n@c0@"
  it: "@aNera@bNon avevo mai visto montagne tanto alte!\nSpero che riusciremo a superarle...\n@c0@"
  ja: "@a@bフローラ「山の頂上が\n\tかすんで　見えませんわ。\n\tここを　こえてゆくのね……。\n@c0@"
2:
  de: "@aBianca@bFindest du meine Vermutung, dass Humburg deine eigentliche Heimat ist, vielleicht etwas vorschnell?\n@c0@"
  en: "@aBianca@bDo you think I'm jumpin' the gun a bit, sayin' Gotha must be your homeland?\n@c0@"
  es: "@aBianca@b¿Crees que me he precipitado un poco al decir que Pankraz es tu tierra natal?\n@c0@"
  fr: "@aBianca@bTu crois que je brûle un peu les étapes en disant que Gotha est sûrement l'endroit où tu es né, en faitⓡ\n@c0@"
  it: "@aBianca@bSì, penso che tu sia nato nel Regno di Denim. Ne sono quasi certa. Credi che io sia giunta a una conclusione affrettata?\n@c0@"
  ja: "@a@bビアンカ「グランバニアを　%a000090の\n\tふるさとって　決めつけてるなんて\n\t気が早いと　思ってる？\n@c0@"
3:
  de: "@aBianca@bAuch gut. Aber ich weiß nicht... ich hab einfach so ein Gefühl, dass du von dort stammst!\n@c0@"
  en: "@aBianca@bFair enough. I just have this feelin', though. I'm sure that's where you're from!\n@c0@"
  es: "@aBianca@bVale, de acuerdo. ¡Pero es que tengo la sensación de que eres de allí!\n@c0@"
  fr: "@aBianca@bJe comprends. C'est juste un pressentiment.\nJe suis certaine que c'est de là que tu viensⓠ\n@c0@"
  it: "@aBianca@bForse hai ragione, ma resto della mia idea.\nSecondo me quella è la tua città natale.\n@c0@"
  ja: "@a@bビアンカ「そうよね。　でも　なぜか　私\n\tグランバニアが　%a000090の国だって\n\t気がして　しかたがないの。\n@c0@"
4:
  de: "@aBianca@bDann geht's dir also genauso? Ich glaube ganz fest, dass du in Humburg geboren wurdest!\n@c0@"
  en: "@aBianca@bSo you have the same feelin' too, then? I'm so sure Gotha must be where you were born!\n@c0@"
  es: "@aBianca@b¿Dices que tú tienes la misma sensación? ¡Entonces estoy segura de que naciste en Pankraz!\n@c0@"
  fr: "@aBianca@bAlors toi aussi, tu as cette impression, heinⓡ\nJe suis sûre que tu es originaire de Gothaⓠ\n@c0@"
  it: "@aBianca@bNo, eh?\nScommetto che anche tu pensi che quella sia la tua città natale...\n@c0@"
  ja: "@a@bビアンカ「%a000090も　同じように\n\t感じてるのね。　グランバニアは\n\t絶対　%a000090のふるさとよ。\n@c0@"
5:
  de: "@aNera@bFindest du meine Vermutung vermessen, dass Humburg dein Geburtsort sein muss?\n@c0@"
  en: "@aNera@bDo you think I'm being a bit presumptuous, assuming that Gotha must be your birthplace?\n@c0@"
  es: "@aNera@b¿No crees que estoy siendo un po' presuntuosa al suponer que Pankraz es tu tierra natal?\n@c0@"
  fr: "@aNera@bTu crois que je suis un peu présomptueuse en affirmant que Gotha doit être ton véritable lieu\nde naissanceⓡ\n@c0@"
  it: "@aNera@bQualcosa mi dice che tu sei nato a Denim...\nSecondo te mi sbaglio?\n@c0@"
  ja: "@a@bフローラ「グランバニアを　あなたの\n\tふるさとって　決めつけるなんて\n\t気が早いと　思っているでしょう？\n@c0@"
6:
  de: "@aNera@bTut mir leid. Es ist nur so, dass ich in meinem tiefsten Inneren überzeugt bin, dass du von dort stammst.\n@c0@"
  en: "@aNera@bSorry. It's just that I have this feeling\r\ndeep inside. I'm convinced that that's where you're from.\n@c0@"
  es: "@aNera@bLo siento. Es que tengo esa profunda sensazione de que es el lugar de donde procedes.\n@c0@"
  fr: "@aNera@bPardon. C'est seulement que j'en suis intimement persuadée. Je suis convaincue que c'est de là\r\nque tu viens.\n@c0@"
  it: "@aNera@bCapisco... Eppure ne sono convinta!\nSo di non avere elementi certi per affermarlo, ma sento che quella è la tua città natale!\n@c0@"
  ja: "@a@bフローラ「でも　ふしぎなの。\n\t私の中では　グランバニアは\n\tあなたの国だって　確信しているのよ。\n@c0@"
7:
  de: "@aNera@bTja, das ist lange her. Bist du bereit, nach Hause zu gehen?\n@c0@"
  en: "@aNera@bWell, it's been a long time.\r\nAre you ready to go home?\n@c0@"
  es: "@aNera@bHa pasado mucho tiempo.\r\n¿Estás listo para volver a la tua casa?\n@c0@"
  fr: "@aNera@bCela fait bien longtemps que tu en es parti.\nEs-tu prêt à rentrer chez toiⓡ\n@c0@"
  it: "@aNera@bBene!\nAllora, sei pronto per tornare a casa?\n@c0@"
  ja: "@a@bフローラ「本当に　長かったわよね。\n\tさあ　あなた。\n\tふるさとへ　帰りましょう。\n@c0@"
8:
  de: "@aBianca@bHier pustet's einen ja fast von den Socken, was?\n@c0@"
  en: "@aBianca@bThis really is a tricky path. It's almost impossible to keep goin' in a straight line!\n@c0@"
  es: "@aBianca@bEste camino es complicado de verdad. ¡No hay manera de avanzar en línea recta!\n@c0@"
  fr: "@aBianca@bCe sentier est vraiment pénible. Il est presque impossible de marcher droitⓠ\n@c0@"
  it: "@aBianca@bMa non c'è un'altra strada?!\nQui non si riesce ad andare dritti!\n@c0@"
  ja: "@a@bビアンカ「本当に　けわしい道ね。\n\tまっすぐに　歩くことすら\n\tむずかしいわ。\n@c0@"
9:
  de: "@aNera@bIch komme mir schon ganz schiefgeweht vor! Auf Berge zu klettern ist ziemlich anstrengend.\n@c0@"
  en: "@aNera@bI feel like I've been all lop-sided for most\r\nof this journey! It certainly is hard work climbing mountains.\n@c0@"
  es: "@aNera@b¡Tengo la sensación de que he caminado haciendo eses casi todo il viaggio! Qué complicado es escalar montañas.\n@c0@"
  fr: "@aNera@bJ'ai l'impression de m'être tenue de travers presque toute la journéeⓠ Escalader les montagnes n'est pas une partie de plaisir.\n@c0@"
  it: "@aNera@bNon credevo che scalare una montagna fosse tanto dura... Perché la nostra amata dea non ci ha dotati di un bel paio d'ali?\n@c0@"
  ja: "@a@bフローラ「私　さっきから　ずっと\n\tナナメになっている気がしますわ。\n\t山道って　大変ですのね。\n@c0@"
10:
  de: "@aBianca@bHahh... Hahh...\nMir geht's gut, wirklich. Nur keine Sorge.\n@c0@"
  en: "@aBianca@bHaah... Haah...\nI'm fine, really. Dun't worry about me.\n@c0@"
  es: "@aBianca@bAhhh... Ahhh...\r\nEstoy muy bien, de verdad. No te preocupes por mí.\n@c0@"
  fr: "@aBianca@bHaan... Haan...\nJe vais bien, vraiment. Ne t'inquiète pas pour moi.\n@c0@"
  it: "@aBianca@bHaaahhh... Haaahhh...\nSto bene... Pant... Sto bene...\nNon preoccuparti per me...\n@c0@"
  ja: "@a@bビアンカ「はあ…　はあ…\n\t私なら　大丈夫よ　心配しないで。\n@c0@"
11:
  de: "@aNera@bM-Mir geht's gut, ehrlich. Ich komme schon mit. Du brauchst dir keine Sorgen zu machen.\n@c0@"
  en: "@aNera@bI-I'm fine, honestly. I can keep up with you.\nYou don't need to be concerned.\n@c0@"
  es: "@aNera@bE-estoy perfectamente. Te puedo seguir sin problemas.\r\nNon ti preoccupare per me.\n@c0@"
  fr: "@aNera@bJ-Je vais bien, je t'assure. Je te suis sans difficulté. Tu n'as pas à t'inquiéter.\n@c0@"
  it: "@aNera@bHaaahhh... Haaahhh... È tutto a posto...\r\nPant! Pant!\nCe la faccio a tenere il tuo passo, ce la faccio...\n@c0@"
  ja: "@a@bフローラ「だ…　大丈夫ですわ。\n\tちゃんと　ついてゆけます。\n\t心配なさらないで　あなた……。\n@c0@"
12:
  de: "@aNera@bIch kann nicht glauben, dass Papa mir wirklich einen Boten bis hierher nachgeschickt hat!\n@c0@"
  en: "@aNera@bI can't believe Papa sent a messenger all the way out here!\n@c0@"
  es: "@aNera@b¡Non posso credere que il mio papino haya enviado un mensajero hasta aquí!\n@c0@"
  fr: "@aNera@bJe n'arrive pas à croire que papa nous ait envoyé un messager jusqu'iciⓠ\n@c0@"
  it: "@aNera@bNon riesco a credere che mio padre abbia mandato un fattorino fin qui!\n@c0@"
  ja: "@a@bフローラ「お父さまったら\n\tこんな所にまで\n\t使者を　よこすなんて……。\n@c0@"
13:
  de: "@aNera@bWas für ein wundervolles Geschenk! Wie großzügig von Papa!\n@c0@"
  en: "@aNera@bWhat a wonderful thing to send to us.\r\nHow generous of Papa!\n@c0@"
  es: "@aNera@b¡Qué gesto tan generoso! Il mio papino es así.\n@c0@"
  fr: "@aNera@bQuel merveilleux cadeau. C'est vraiment généreux\nde la part de papaⓠ \n@c0@"
  it: "@aNera@bChe pensiero carino ha avuto il mio papà!\nÈ sempre stato una persona generosa...\n@c0@"
  ja: "@a@bフローラ「こんな　高価なものを\n\t私たちのために……\n\tありがとう　お父さま……。\n@c0@"
14:
  de: "@aBianca@bAlso, hier ist's mir wirklich nicht ganz geheuer. Was meinst du, wie dieses Skelett wohl hierher gekommen ist?\n@c0@"
  en: "@aBianca@bThis place is givin' me the willies. How d'you suppose that skeleton ended up over there?\n@c0@"
  es: "@aBianca@bEste sitio me pone la carne de gallina. ¿Cómo crees que ha llegado ese esqueleto hasta ahí?\n@c0@"
  fr: "@aBianca@bCet endroit me donne la chair de poule.\nComment crois-tu que ce squelette a atterri iciⓡ\n@c0@"
  it: "@aBianca@bQuesto posto mi fa venire i brividi!\nCome avrà fatto quello scheletro a finire lì?!\n@c0@"
  ja: "@a@bビアンカ「ここって　なんだか\n\tこわいわよね。　あっちに落ちている\n\tガイコツは　どうしたのかしら……。\n@c0@"
15:
  de: "@aNera@bHier fühlt es sich schrecklich kalt an. Vielleicht bilde ich es mir auch nur ein, aber mir ist, als spürte ich hier etwas Böses.\n@c0@"
  en: "@aNera@bThere's a horrible cold feeling to this place.\r\nI'm probably just imagining things, but it feels sort of sinister.\n@c0@"
  es: "@aNera@bEste lugar me produce una sensación horribilemente fría.\n㈡\nQuizá es solo mi imaginación, pero me parece bastante siniestro.\n@c0@"
  fr: "@aNera@bIl se dégage de ce lieu une impression glaciale.\r\nJ'ai peut-être un peu trop d'imagination, mais\r\nça a un côté sinistre.\n@c0@"
  it: "@aNera@bQuesto posto ha un'aria così fredda, così sinistra...\n@c0@"
  ja: "@a@bフローラ「この部屋　寒気がしますわ。\n\tうすぐらいし　なんだか\n\t気味が悪いです……。\n@c0@"
16:
  de: "@aBianca@bMir gefällt das Lachen der alten Frau gar nicht. Sie klingt wie eine Hexe oder so.\n@c0@"
  en: "@aBianca@bI dun't much like the sound of that old woman's laugh. She sounds like a witch or somethin'.\n@c0@"
  es: "@aBianca@bNo me gusta demasiado el sonido de la risa de esa vieja. Parecía una bruja o algo así, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe n'aime pas beaucoup le rire de cette vieille femme. On dirait une sorcière, ou un truc du genre.\n@c0@"
  it: "@aBianca@bSanto cielo! Hai sentito quant'è sinistra la risata di quella vecchia?!\nSembra una strega malvagia!\n@c0@"
  ja: "@a@bビアンカ「なんか　笑い方が不気味な\n\tおばあさんよね……。\n@c0@"
17:
  de: "@aNera@bIch sollte das vermutlich nicht sagen, aber mir ist diese alte Frau nicht sehr sympathisch. Ich fühle mich bei ihr ein wenig unbehaglich.\n@c0@"
  en: "@aNera@bI probably shouldn't really say so, but I'm not all that taken with the old woman. She makes me feel a bit uneasy.\n@c0@"
  es: "@aNera@bQuizá no debería decir esto, pero esa anciana, veramente, no me resulta muy agradable. Me hace sentir un poco incómoda.\n@c0@"
  fr: "@aNera@bJe ne devrais pas dire ça, mais je n'apprécie pas vraiment cette vieille femme. Elle me met mal à l'aise.\n@c0@"
  it: "@aNera@bQuell'anziana signora mi mette a disagio.\nQualcosa mi dice che è meglio non fidarsi di lei...\n@c0@"
  ja: "@a@bフローラ「こんなことを　言っては\n\tいけないんですけど……\n\t私　あのおばあさん　苦手ですわ。\n@c0@"
18:
  de: "@aBianca@bSie war doch gar nicht so übel. Jetzt tut's mir leid, dass ich sie verdächtigt habe.\n@c0@"
  en: "@aBianca@bShe wasn't a bad old stick, after all. I feel bad for doubtin' her now.\n@c0@"
  es: "@aBianca@bAl final ha resultado ser una vieja bastante maja. Siento haber dudado de ella.\n@c0@"
  fr: "@aBianca@bFinalement, elle n'était pas méchante. J'ai un peu honte d'avoir douté d'elle, maintenant.\n@c0@"
  it: "@aBianca@bQuella vecchina è davvero una persona adorabile!\nMi sento in colpa per aver dubitato di lei.\n@c0@"
  ja: "@a@bビアンカ「悪いおばあさんじゃ\n\tなかったのね。\n\tうたがったりして　悪かったな……。\n@c0@"
19:
  de: "@aNera@bIch habe ein ganz schlechtes Gewissen, dass ich so eine nette alte Dame verdächtigt habe. Bevor ich über andere urteile, muss ich wohl noch viel lernen.\n@c0@"
  en: "@aNera@bI feel so guilty for doubting such a kind old lady. It looks like I still have a lot to learn when it comes to judging others.\n@c0@"
  es: "@aNera@bMe siento culpabile por haber dudado de esa amable anciana. Aún tengo mucho que aprender sobre los prejuicios.\n@c0@"
  fr: "@aNera@bJe me sens terriblement coupable d'avoir douté\r\nd'une si gentille vieille dame. J'ai encore beaucoup\r\nà apprendre en matière de jugement.\n@c0@"
  it: "@aNera@bChe signora gentile, eh?\nE io che l'avevo giudicata male...!\n@c0@"
  ja: "@a@bフローラ「あんなに　親切な方を\n\tこわがるなんて…　私も\n\t人としての修業が　足りませんわね。\n@c0@"
20:
  de: "@aBianca@bDieses eigentümliche Lachen würde wohl jedem einen Schauer über den Rücken jagen!\n@c0@"
  en: "@aBianca@bThat strange laugh is enough to give anyone\r\na fright!\n@c0@"
  es: "@aBianca@b¡Esa risa rara puede asustar a cualquiera!\n@c0@"
  fr: "@aBianca@bCe rire bizarre ficherait la frousse à n'importe quiⓠ\n@c0@"
  it: "@aBianca@bMa no, la risata di quella vecchina non è inquietante...\nÈ terrificante!\n@c0@"
  ja: "@a@bビアンカ「あの笑い方は\n\tあらぬ誤解を　まねきそうよね。\n@c0@"
21:
  de: "@aNera@bAaaah! Jetzt habe ich Angst! Das Lachen dieser alten Frau ist wirklich schauerlich!\n@c0@"
  en: "@aNera@bWaaah! I'm frightened! That old woman's laugh really is scary!\n@c0@"
  es: "@aNera@b¡Aaah! ¡Tengo miedo! ¡La risa de questa anciana es terrorífica!\n@c0@"
  fr: "@aNera@bOuaaaahⓠ J'ai peurⓠ Le rire de cette vieille femme est vraiment effrayantⓠ\n@c0@"
  it: "@aNera@bE come si fa a non badare a una risata tanto spaventosa?!\nOgni volta che la sento tremo di paura!\n@c0@"
  ja: "@a@bフローラ「ヒーーーーッ！\n\tやっぱり　こわいですわ。\n\tあの方は　笑顔が　こわいです～～！\n@c0@"
22:
  de: "@aBianca@bErst ein Gebirgspass und nun eine Höhle. Hoch und runter, hoch und runter. Ich komme mir schon langsam vor wie ein Jo-Jo!\n@c0@"
  en: "@aBianca@bFirst a mountain path and then a cave.\r\nUp and down, up and down. I'm startin'\r\nto feel like a yo-yo!\n@c0@"
  es: "@aBianca@bPrimero un camino de montaña, ahora una cueva.\nArriba y abajo sin parar. ¡Ya me siento como un yoⓚyo!\n@c0@"
  fr: "@aBianca@bD'abord un sentier de montagne, puis une grotte.\nOn monte, on descend, on monte, on descend.\nJ'ai l'impression d'être un yo-yoⓠ\n@c0@"
  it: "@aBianca@bPrima un sentiero di montagna, poi una caverna!\r\nCerto che a viaggiare con te non ci si annoia!\n@c0@"
  ja: "@a@bビアンカ「山道の次は　洞くつなのね。\n\tのぼって　おりるだけって　わけには\n\tいかなかったね。\n@c0@"
23:
  de: "@aNera@bDu weißt ja, ich bin nicht ganz schwindelfrei, aber hier in der Höhle lässt meine Anspannung schon ein wenig nach.\n@c0@"
  en: "@aNera@bI'm not very good with heights, so I feel a bit less anxious now we're here inside this cave.\n@c0@"
  es: "@aNera@bNon mi piacen las alturas, así que me siento mucho más segura dentro de esta cueva.\n@c0@"
  fr: "@aNera@bJ'ai un peu le vertige, quand je suis en hauteur, alors je me sens légèrement mieux maintenant\r\nque nous sommes dans cette grotte.\n@c0@"
  it: "@aNera@bQuesta caverna non mi ispira grande fiducia, ma almeno qui non soffrirò di vertigini...!\n@c0@"
  ja: "@a@bフローラ「私　高いところが\n\t苦手だから　洞くつに入って\n\t少し　ほっとしましたわ。\n@c0@"
24:
  de: "@aBianca@bEs muss an der Höhe liegen. Irgendwie werd' ich viel schneller müde als sonst.\n@c0@"
  en: "@aBianca@bIt must be because we're high up. I seem to be gettin' tired more quickly than normal.\n@c0@"
  es: "@aBianca@bDebe de ser por la altura, pero parece que me canso antes de lo normal, ¿sabes?\n@c0@"
  fr: "@aBianca@bÇa doit être à cause de l'altitude. J'ai l'impression de me fatiguer beaucoup plus vite qu'à l'accoutumée.\n@c0@"
  it: "@aBianca@bIn montagna mi sembra di stancarmi più in fretta che in pianura. Credo che sia per effetto dell'altitudine: l'aria rarefatta fa avvertire di più la fatica...\n@c0@"
  ja: "@a@bビアンカ「高いところに　いるからかな。\n\t私　ちょっと　つかれやすく\n\tなってるみたい……。\n@c0@"
25:
  de: "@aBianca@bIch kann Licht sehen! Dann ist der Ausgang sicher nicht mehr weit.\n@c0@"
  en: "@aBianca@bI can see light. That means the exit can't be\r\nfar away.\n@c0@"
  es: "@aBianca@bVeo luz. Eso quiere decir que la salida está cerca.\n@c0@"
  fr: "@aBianca@bJe vois de la lumière. La sortie ne doit plus être\r\ntrès loin.\n@c0@"
  it: "@aBianca@bVedo una luce...\nProbabilmente siamo vicini all'uscita.\n@c0@"
  ja: "@a@bビアンカ「外の明かりが　見えるわ。\n\t出口は　もう　すぐそこね。\n@c0@"
26:
  de: "@aNera@b...\n@c0@"
  en: "@aNera@b........................\n@c0@"
  es: "@aNera@b...\n@c0@"
  fr: "@aNera@b........................\n@c0@"
  it: "@aNera@b...\n@c0@"
  ja: "@a@bフローラ「……………………。\n@c0@"
27:
  de: "@aNera@bEs g-geht mir gut, wirklich. Ich finde es nur manchmal ein wenig anstrengend, mit dir mitzuhalten, weil du so schnell gehst.\n@c0@"
  en: "@aNera@bI-I'm fine, really. I'm just finding it a bit of a struggle to keep up with you sometimes because you're so fast.\n@c0@"
  es: "@aNera@bE-estoy bien, de verdad. Solo que a veces me cuesta seguirte porque vas muy veloce.\n@c0@"
  fr: "@aNera@bJe... Ça va, je t'assure. J'ai juste un peu de mal\r\nà te suivre parfois. Tu es très rapide.\n@c0@"
  it: "@aNera@bVa tutto bene, non temere...\nÈ solo che faccio un po' fatica a tenere il tuo passo, perché cammini molto in fretta.\n@c0@"
  ja: "@a@bフローラ「だ…　大丈夫ですわ。\n\t私　あなたの足手まといにだけは\n\tなりませんわ。\n@c0@"
28:
  de: "@aNera@bIch glaube, ich bin jetzt stärker als zu Beginn unserer gemeinsamen Reise, findest du nicht auch?\n@c0@"
  en: "@aNera@bI'm probably stronger than when we first set out on our travels together, don't you think?\n@c0@"
  es: "@aNera@bCredo que ahora soy più forte que cuando empezamos a viajar juntos, ¿verdad?\n@c0@"
  fr: "@aNera@bJe suis sans doute plus résistante que lorsque nous avons voyagé ensemble pour la première fois,\nqu'en penses-tuⓡ\n@c0@"
  it: "@aNera@bSento che la mia forza e la mia resistenza aumentano, man mano che viaggiamo insieme.\r\nÈ una bella cosa, vero?\n@c0@"
  ja: "@a@bフローラ「これでも　私\n\t旅をはじめた頃よりは\n\tだいぶ　マシになったでしょう？\n@c0@"
29:
  de: "@aNera@bDa bin ich aber erleichtert. Ich möchte ja nicht, dass du mich zu Hause lässt, weil ich nicht mit dir mithalten kann.\n@c0@"
  en: "@aNera@bThat's a relief. I wouldn't want you to feel\r\nlike you have to leave me behind because I can't keep up.\n@c0@"
  es: "@aNera@b¡Qué alivio! No quisiera que te vieras obligado a dejarme atrás porque no puedo seguirte.\n@c0@"
  fr: "@aNera@bOuf. Je ne voudrais pas que tu regrettes de m'avoir emmenée avec toi parce que je n'arrive pas à suivre.\n@c0@"
  it: "@aNera@bGià.\nMi fa piacere sapere di non essere un peso né un intralcio per te...\n@c0@"
  ja: "@a@bフローラ「よかった。\n\t私　あなたに　置いていかれないよう\n\tがんばりましたのよ。\n@c0@"
30:
  de: "@aNera@bAch je. Das tut mir leid. Ich werde mich mehr anstrengen, das verspreche ich dir. Du sollst stolz auf mich sein.\n@c0@"
  en: "@aNera@bOh dear. I'm sorry. I'll try harder from now on, I promise. I'll make you proud.\n@c0@"
  es: "@aNera@b¡Oh, cielos! Lo siento. A partir de ahora me esforzaré più, lo prometo. Estarás orgulloso di me.\n@c0@"
  fr: "@aNera@bOh non. Je suis vraiment désolée. Je te promets\r\nde faire plus d'efforts, à partir de maintenant.\r\nTu seras fier de moi.\n@c0@"
  it: "@aNera@bCome sarebbe a dire ⓕnoⓖ?!\nPreferiresti portarmi in spalla come un sacco di patate perché non riesco a starti dietro?!\n@c0@"
  ja: "@a@bフローラ「そうですか……。\n\tあなたに　ほめてもらえるよう\n\tもっと　がんばりますわ……。\n@c0@"
31:
  de: "@aBianca@bIch bin froh, dass ich mit dir und deinen lustigen Freunden herumziehen kann, %a000090. Da hab ich immer Gesellschaft!\n@c0@"
  en: "@aBianca@bI'm glad I've got you and all your funny friends to travel with, %a000090. Life's never lonely for me.\n@c0@"
  es: "@aBianca@bMe alegro de poder viajar contigo y con tus simpáticos amigos, %a000090. No tengo ocasión de sentirme sola, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe suis contente de pouvoir voyager avec toi et tes drôles d'amis, %a000090. Je ne me sens jamais seule.\n@c0@"
  it: "@aBianca@bAdoro viaggiare insieme a te, %a000090.\nOgni giorno viviamo un'esperienza diversa!\n@c0@"
  ja: "@a@bビアンカ「私には　%a000090や\n\tあなたの　ゆかいな仲間たちがいるから\n\tさびしいと感じたことなんて　ないわ。\n@c0@"
32:
  de: "@aNera@bIch glaube nicht, dass ich allein auf Reisen gegangen wäre. Du hast mir eine ganz neue Welt voller ungeahnter Möglichkeiten gezeigt.\n@c0@"
  en: "@aNera@bI don't think I would've set off on my travels alone. You've opened up a whole world of possibilities to me.\n@c0@"
  es: "@aNera@bNon credo que hubiese podido viajar sola. Me has abierto un mondo de posibilidades.\n@c0@"
  fr: "@aNera@bJe ne crois pas que je me serais mise à voyager toute seule. Tu m'as vraiment fait découvrir tout un monde de possibilités.\n@c0@"
  it: "@aNera@bSe non ti avessi conosciuto, non avrei mai avuto la possibilità di girare il mondo come sto facendo ora.\nViaggiare con te è un'avventura meravigliosa!\n@c0@"
  ja: "@a@bフローラ「私も　ひとりだったら\n\t旅なんて　しなかったわ。\n\tあなたと　いっしょだから　私は……。\n@c0@"
33:
  de: "@aGriselda@bIch bin total fertig. Mir reicht's. Von jetzt an wirst du all die Arbeit tun müssen, %a000090.\n@c0@"
  en: "@aDebora@bI'm so tired. I've just about had enough.\nYou'll have to do all the work now, %a000090.\n@c0@"
  es: "@aStefania@bSonno stanca. Ya estoy más que harta.\nAhora tendrás que hacer tú todo el trabajo, %a000090.\n@c0@"
  fr: "@aPandora@bJe suis tellement fatiguée. J'en ai assez. C'est toi qui va devoir tout faire, maintenant, %a000090.\n@c0@"
  it: "@aViola@bArrivare fin qui è stata una faticaccia incredibile, %a000090. Sono esausta.\nChe ne diresti di portarmi in braccio?\n@c0@"
  ja: "@a@bデボラ「あ～　つかれた。\n\tもう　ダメっ！\n\tあとは　あんたに　まかせたわ。\n@c0@"
34:
  de: "@aGriselda@bFindest du es voreilig von mir, Humburg für deine Heimatstadt zu halten?\n@c0@"
  en: "@aDebora@bYou probably think I'm getting ahead of myself, just assuming that Gotha's your hometown, right?\n@c0@"
  es: "@aStefania@bDebes de creer que me adelanto un poco al suponer que Pankraz es tu città natale, ¿no?\n@c0@"
  fr: "@aPandora@bTu vas penser que je m'emporte un peu en supposant que Gotha est la ville où tu es né, heinⓡ\n@c0@"
  it: "@aViola@bPenso che tu sia nato a Denim.\nNe sono praticamente convinta.\nCredi che mi sbagli?\n@c0@"
  ja: "@a@bデボラ「グランバニアを　あんたの\n\tふるさとって　決めつけるなんて\n\t気が早いと　思っているかしら？\n@c0@"
35:
  de: "@aGriselda@bUnd doch lässt du mich hier herumkraxeln? Nein, das würde ich doch nie mit mir machen lassen! Humburg muss dein Zuhause sein, das geht gar nicht anders.\n@c0@"
  en: "@aDebora@bAnd yet you'd still have me climbing mountains to get there! I wouldn't stand for that! No, Gotha has to be your hometown. I'm sure of it.\n@c0@"
  es: "@aStefania@b¡Pero aquí me tienes, escalando montañas para llegar allí! ¡A mí! No, Pankraz tiene que ser tu città natale. ¡Sicuro!\n@c0@"
  fr: "@aPandora@bEt tu m'obliges quand même à grimper des montagnes pour y allerⓡⓐ Je ne le supporterais pasⓠ Non, Gotha est forcément ta ville natale. J'en suis certaine.\n@c0@"
  it: "@aViola@bAh, ma davvero?!\nE allora perché mi hai costretta ad affrontare questo viaggio attraverso le montagne, eh?!\n㈡\nSarà meglio che tu sia nato a Denim, altrimenti saranno guai! \n@c0@"
  ja: "@a@bデボラ「そんな気持ちで　山ごえさせる気？\n\tダメ。　そんなの　ゆるせないっ。\n\tグランバニアは　あんたの国で　決まりよ。\n@c0@"
36:
  de: "@aGriselda@bGut. Du wirst mir ja schließlich nicht widersprechen wollen.\n@c0@"
  en: "@aDebora@bGood. You know better than to say something like that to me.\n@c0@"
  es: "@aStefania@bBene. Ya sabes que no te conviene llevarme la contraria, ¿capisci?\n@c0@"
  fr: "@aPandora@bBien. Tu sais que tu n'aurais pas intérêt à me dire le contraire, de toute façon.\n@c0@"
  it: "@aViola@bBravo, risposta esatta.\nDel resto, non poteva essere diversamente: io non sbaglio mai...\n@c0@"
  ja: "@a@bデボラ「そうよね。\n\t気が早いなんて言ってたら\n\tひっぱたいてた　かもしれないわ。\n@c0@"
37:
  de: "@aGriselda@bAutsch, autsch, autsch! Wo guckst du denn hin? Ich hab keine Blase, wenn es das ist, was du denkst!\n@c0@"
  en: "@aDebora@bOuch, ouch, ouch! What are you looking at?\r\nI haven't got a blister, if that's what you're thinking.\n@c0@"
  es: "@aStefania@b¡Ay, ay, ay! Ma, ¿qué miras?\r\nSi piensas que tengo una ampolla, estás equivocado.\n@c0@"
  fr: "@aPandora@bAïe, aïe, aïeⓠ Qu'est-ce que tu regardesⓡ Je n'ai pas d'ampoule, si c'est ce que tu crois.\n@c0@"
  it: "@aViola@bAhia, che male! La prossima volta che vorrai farmi fare un viaggio così stancante, dimmelo prima, così me ne resterò a casa!\n@c0@"
  ja: "@a@bデボラ「いたたた……。\n\tな　なに　見てんのよ！\n\tくつずれなんて　してないからね。\n@c0@"
38:
  de: "@aGriselda@bHahh... Hahh... Wieso macht dir das Ganze eigentlich überhaupt nichts aus? Du könntest zumindest anbieten, mich zu tragen!\n@c0@"
  en: "@aDebora@bHaah... Haah...\nHow are you managing this so easily?\nYou could at least offer to carry me!\n@c0@"
  es: "@aStefania@bAhhh... Ahhh...\r\n¿Cómo lo haces para que te resulte tan facile?\r\n¡Podrías ofrecerte a llevarme!\n@c0@"
  fr: "@aPandora@bHaan... Haan...\nComment tu y arrives aussi facilementⓡ Tu pourrais au moins me proposer de me porterⓠ\n@c0@"
  it: "@aViola@bHaaahhh... Haaahhh... Caro il mio pappamoll...\nEhm, maritino mio bello, che ne diresti di portarmi in braccio, eh? Haaahhh... Haaahhh...\n@c0@"
  ja: "@a@bデボラ「はぁ…　はぁ…\n\tなにさ　あんた　すずしい顔してさ。\n\t私のこと　おぶりなさいよ。\n@c0@"
39:
  de: "@aGriselda@bVon einem Krieger wie ihm könntest du noch was lernen. Du könntest dich als Diener immer noch verbessern.\n@c0@"
  en: "@aDebora@bYou could learn a lot from a warrior like him.\r\nMake yourself a better servant still.\n@c0@"
  es: "@aStefania@bPodrías aprender mucho de este uomo.\r\nSerías un mejor sirviente.\n@c0@"
  fr: "@aPandora@bTu pourrais apprendre beaucoup de choses d'un guerrier tel que lui. Ça ferait de toi un meilleur domestique.\n@c0@"
  it: "@aViola@bQuello sì che è un servitore fedele e devoto!\nQuando torneremo a casa gli chiederò di darti qualche lezione di disciplina...\n@c0@"
  ja: "@a@bデボラ「あんたも　しもべとして\n\tあの戦士を　見習いなさいね。\n@c0@"
40:
  de: "@aGriselda@bDas nehm' ich. Das macht dir doch nichts, oder? Es ist schließlich ein Geschenk von Papa.\n@c0@"
  en: "@aDebora@bI'll take that. You don't mind, do you?\nIt's a gift from Papa, after all.\n@c0@"
  es: "@aStefania@bMe lo quedo yo, ¿capisci?\r\nAl fin y al cabo, es un regalo de il mio papino.\n@c0@"
  fr: "@aPandora@bJe le prend. Ça ne te dérange pas, n'est-ce pasⓡ Après tout, c'est un cadeau de papa.\n@c0@"
  it: "@aViola@bQueste le prendo io.\nDopotutto, sono un regalo del mio paparino.\nPerò te le lascerò portare. Sei contento, caro?\n@c0@"
  ja: "@a@bデボラ「これは　私のものね。\n\t文句ないでしょ？\n\tパパからの　プレゼントだし。\n@c0@"
41:
  de: "@aGriselda@bAn diesem schrecklichen Ort ist für uns nichts zu holen. Los, reiß dich zusammen, wir gehen weiter!\n@c0@"
  en: "@aDebora@bThere's nothing for us in this nasty place.\nHurry up and get moving!\n@c0@"
  es: "@aStefania@bEn este sitio horribile no hay nada para noi.\r\n¡Vamos, en marcha ya!\n@c0@"
  fr: "@aPandora@bOn n'a rien à faire dans cet horrible endroit. Dépêchons-nous d'avancer.\n@c0@"
  it: "@aViola@bPrima ce ne andiamo da questo postaccio e meglio è.\nProseguiamo, su.\n@c0@"
  ja: "@a@bデボラ「こんな　うす気味悪いとこ\n\t用はないでしょ？\n\tほらっ　さっさと　外へ出る！\n@c0@"
42:
  de: "@aGriselda@bWir sind doch nicht den weiten Weg gekommen, bloß um mit der Alten zu reden. Los, mach, dass du wieder rauskommst. Ein bisschen plötzlich!\n@c0@"
  en: "@aDebora@bWe didn't come all this way to talk to that old woman. Hurry up and get back outside. That's an order!\n@c0@"
  es: "@aStefania@bNo hemos venido hasta aquí para parlare con esa vecchia signora. Deprisa, salgamos de aquí. ¡Es una orden!\n@c0@"
  fr: "@aPandora@bOn n'a pas fait tout ce chemin pour parler à cette vieille femme. Dépêche-toi de ressortir. C'est un ordreⓠ\n@c0@"
  it: "@aViola@bGuarda che non abbiamo fatto tanta strada per metterci a chiacchierare con quella donna!\nNon perdiamo altro tempo e andiamocene.\n@c0@"
  ja: "@a@bデボラ「おばあさんと話すのが\n\t旅の　目的じゃないでしょ。\n\t早く外に出なさい！　めいれいよ。\n@c0@"
43:
  de: "@aGriselda@bMir reicht's. Ich hab die Nase voll.\nWir gehen. Sofort.\n@c0@"
  en: "@aDebora@bI've had enough, I really have.\nWe're leaving. Now.\n@c0@"
  es: "@aStefania@bVeramente estoy más que harta, ¿capisci?\r\nNos vamos. Ahora.\n@c0@"
  fr: "@aPandora@bJ'en ai assez, vraiment. On s'en va. Tout de suite.\n@c0@"
  it: "@aViola@bNe ho abbastanza di questo posto.\nAndiamocene subito.\nSono stata sufficientemente chiara?\n@c0@"
  ja: "@a@bデボラ「もう　イヤ。\n\tもう　たくさん。\n\tさっさと　行くわよ。\n@c0@"
44:
  de: "@aGriselda@bSo schaurig könnte ich nicht mal lachen, wenn ich es wollte.\n@c0@"
  en: "@aDebora@bI couldn't laugh in such a creepy way if I tried.\n@c0@"
  es: "@aStefania@bVeramente, soy incapaz de reír de esa forma tan terrorífica.\n@c0@"
  fr: "@aPandora@bMême si je le voulais, je n'arriverais pas à avoir un rire aussi effrayant.\n@c0@"
  it: "@aViola@bCon una risata come la sua, c'è da augurarsi che quella donna sia sempre triste!\n@c0@"
  ja: "@a@bデボラ「私には　あんな　はしたない\n\t笑い方は　できないわ。\n@c0@"
45:
  de: "@aGriselda@bJetzt willst du mich also auch noch durch eine Höhle schleppen? Allmählich glaube ich, ich hätte etwas Zünftigeres anziehen sollen.\n@c0@"
  en: "@aDebora@bSo now we have to traipse through a cave?\r\nI'm starting to think I should've worn some more sensible clothes.\n@c0@"
  es: "@aStefania@b¿Y ahora tenemos que recorrer una cueva de arriba abajo?\n㈡\nCredo que debería haber traído vestidos más adecuados.\n@c0@"
  fr: "@aPandora@bAlors maintenant, il faut qu'on se traîne dans une grotteⓡ Je commence à me dire que j'aurais dû choisir des vêtements plus pratiques.\n@c0@"
  it: "@aViola@bGli abiti che indosso non sono adatti al percorso che stiamo facendo. Sono eleganti e delicati, mentre sarebbe stato meglio mettere qualcosa di più pratico.\n@c0@"
  ja: "@a@bデボラ「今度は　洞くつ？\n\tもっと　冒険向きな服を　着てくれば\n\t良かったかしら。\n@c0@"
46:
  de: "@aGriselda@bLeider ist zünftige Kleidung irgendwie nie besonders hübsch.\n@c0@"
  en: "@aDebora@bThe problem is that sensible clothes never seem to be very pretty.\n@c0@"
  es: "@aStefania@bMa, el problema es que los vestidos adecuados no suelen ser muy bonitos.\n@c0@"
  fr: "@aPandora@bLe problème avec les vêtements pratiques,\r\nc'est qu'ils ne sont jamais très jolis.\n@c0@"
  it: "@aViola@bSapevo fin dall'inizio che il mio abbigliamento era inadeguato, ma non ho voluto rinunciare a vestirmi con capi che valorizzano la mia naturale bellezza!\n@c0@"
  ja: "@a@bデボラ「でも　冒険向きな服　って\n\tオシャレじゃないのよね。\n@c0@"
47:
  de: "@aGriselda@bIch werde etwas müde. Eigentlich finde ich, du als mein Leibsklave könntest mich ruhig ein bisschen Huckepack tragen.\n@c0@"
  en: "@aDebora@bI'm getting a bit tired. Given that you're my personal slave, I really think you should give me a piggyback.\n@c0@"
  es: "@aStefania@bMe estoy empezando a cansar. Como eres il mio esclavo personal, creo que deberías llevarme a caballito, ¿capisci?\n@c0@"
  fr: "@aPandora@bJe commence à être un peu fatiguée. Vu que tu es mon esclave personnel, je pense vraiment que tu devrais me porter sur ton dos.\n@c0@"
  it: "@aViola@bSono stanca.\nPortami in braccio, caro.\nNon te lo sto chiedendo come favore: è un ordine!\n@c0@"
  ja: "@a@bデボラ「少し　つかれてきたわ。\n\tあんた　しもべなんだから\n\t私のこと　おぶってよ。\n@c0@"
48:
  de: "@aGriselda@bIch möchte wissen, ob wir in der Nähe des Ausgangs sind. Ich hätte nichts dagegen, demnächst mal eine Pause einzulegen.\n@c0@"
  en: "@aDebora@bI wonder if we're near the exit. I wouldn't mind having a rest before long.\n@c0@"
  es: "@aStefania@bNo sé si estaremos cerca de la salida, ma no me importaría descansar un poco.\n@c0@"
  fr: "@aPandora@bJe me demande si la sortie est loin. Je crois que j'aimerais pouvoir me reposer rapidement.\n@c0@"
  it: "@aViola@bCredo che ormai l'uscita sia vicina...\n@c0@"
  ja: "@a@bデボラ「そろそろ　出口かしら。\n\t近くに　休めるところが\n\tあればいいけど……。\n@c0@"
49:
  de: "@aGriselda@bAllein zu reisen kann vermutlich auch Spaß machen, aber es ist so viel angenehmer, wenn man einen Diener für die mühsamen Arbeiten dabei hat!\n@c0@"
  en: "@aDebora@bTravelling alone could probably be quite good fun, but it's so much easier with a servant around to do all the hard work.\n@c0@"
  es: "@aStefania@bViajar sola puede ser divertente, pero es más fácil si tienes un sirviente que haga tutto el trabajo difficile.\n@c0@"
  fr: "@aPandora@bÇa doit être assez amusant de voyager seul, mais c'est tellement plus simple d'avoir un domestique avec soi pour se charger de tous les travaux pénibles.\n@c0@"
  it: "@aViola@bNon mi piacerebbe viaggiare da sola.\r\nSenza un compagno fedele e devoto, chi esaudirebbe i miei desideri? A chi impartirei ordini?\n@c0@"
  ja: "@a@bデボラ「ひとり旅も　あこがれるけど\n\tしもべが　いたほうが\n\t快てきな旅が　できるわよね。\n@c0@"
