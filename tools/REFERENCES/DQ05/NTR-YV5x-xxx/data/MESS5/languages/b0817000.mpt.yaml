0:
  de: "@a@b*: Willkommen in der Goldbank ⓞHinterm Regenbogenⓟ, wo wir Euer hart erarbeitetes Gold vor Monstern und Verbrechern schützen.\n@c0@"
  en: "@a@b*: Welcome to Rainbow's End Gold Bank, protectin' yer hard-earned gold from the likes of monsters and criminals.\n@c0@"
  es: "@a@b*: %H0860%X%A0110%XBienvienido%Z%B0110%XBienvienida%Z%Y%R0000%XBienvenidas%YBienvenidos%Z%Z al banco Las Mil y Una Noches.\n@c0@"
  fr: "@a@b*ⓢ Bienvenue à la Banque du Trésor de l'Arc-en-ciel, qui protège vos économies durement gagnées contre les monstres et les bandits de grand chemin.\n@c0@"
  it: "@a@b*: Salve! Questa è la Banca dell'Arcobaleno!\nProteggiamo i sudati risparmi dei nostri amati clienti da mostri, ladri e affini!\n@c0@"
  ja: "@a@b＊「愛と信頼のゴールド銀行へ　ようこそ。\n\tみなさまの　大切な　お金を\n\t魔物などから　お守りします。\n@c0@"
1:
  de: "@a@b*: Hier akzeptieren wir nur Transaktionen in Tausender-Einheiten, das gilt sowohl für Einzahlungen als auch für Auszahlungen.\n@c0@"
  en: "@a@b*: Here at Rainbow's End we only deal in units of a thousand gold coins. That goes for deposits an' withdrawals alike.\n@c0@"
  es: "@a@b*: En Las Mil y Una Noches triatamos solo con unidades de mil moniedas de oro. Tanto para ingriesos como para reintiegros.\n@c0@"
  fr: "@a@b*ⓢ Ici, à la Banque de l'Arc-en-ciel, nous ne comptons qu'en milliers de pièces d'or, et ce aussi bien pour les dépôts que pour les retraits.\n@c0@"
  it: "@a@b*: Alla Banca dell'Arcobaleno lavoriamo con tagli minimi da mille monete d'oro, e questo vale sia per i depositi sia per i prelievi.\n@c0@"
  ja: "@a@b＊「お預かりも　お引き出しも\n\t１０００ゴールド単位で\n\tうけたまわります。\n@c0@"
2:
  de: "@a@b*: Und wir verlangen noch nicht mal Gebühren!\n@c0@"
  en: "@a@b*: And we don't even charge ye any fees!\n@c0@"
  es: "@a@b*: ¡Y no cobriamos comisiones!\n@c0@"
  fr: "@a@b*ⓢ Et notre banque ne prend aucun fraisⓠ\n@c0@"
  it: "@a@b*: E non ci sono commissioni da pagare!\nBello, eh?\n@c0@"
  ja: "@a@b＊「もちろん　手数料などは\n\tいっさい　いただきません！\n@c0@"
3:
  de: "@a@b*: Also, %a000120...\nWas können wir für Euch tun?\n@c0@"
  en: "@a@b*: So, %a000120...\nWhat can we be doin' fer ye?\n@c0@"
  es: "@a@b*: Entionces, %a000120... ¿Qué si le ofriece?\n@c0@"
  fr: "@a@b*ⓢ Alors, %a000120... Que puis-je faire pour vousⓡ\n@c0@"
  it: "@a@b*: Allora, %a000120...\nCome posso aiutarti?\n@c0@"
  ja: "@a@b＊「%a000120さまは\n\tどんな　ご用でしょう？\n@c0@"
4:
  de: "@a@b*: Es tut mir wirklich leid, %A0110%Xder Herr%Z%B0110%Xdie Dame%Z, aber der Tresor ist voll. Wir können keine Einzahlungen mehr annehmen.\n@c0@"
  en: "@a@b*: I'm terribly sorry, %A0110%Xsir%Z%B0110%Xma'am%Z, but it seems the vault's full already. We can't be acceptin' any more deposits, like.\n@c0@"
  es: "@a@b*: Lo siento mucho, %A0110%Xcaballiero%Z%B0110%Xsieñora%Z, pero pariece que la caja fuerte ya está llena. No podemos acieptar más diepósitos, sí.\n@c0@"
  fr: "@a@b*ⓢ Je suis vraiment désolée, %A0110%Xm'sieur%Z%B0110%Xm'dame%Z, mais notre chambre forte est pleine. Nous ne pouvons plus accepter de dépôt.\n@c0@"
  it: "@a@b*: Mi spiace, ma la cassaforte della banca è piena.\nNon possiamo accettare altri depositi.\n@c0@"
  ja: "@a@b＊「お客さま　申しわけありませんが\n\tわたくしどもの金庫が　いっぱいで\n\tこれ以上　お預かりできません。\n@c0@"
5:
  de: "@a@b*: Wir nehmen Euer Gold gerne. Aber wir akzeptieren nur Einzahlungen in Tausender-Einheiten.\nAlso... Wie viel wollt Ihr heute einzahlen?\n@c0@"
  en: "@a@b*: Sure an' we'd be happy to accept yer gold, but we only deal in units of a thousand coins. So... How much would ye be leavin' with us today?\n@c0@"
  es: "@a@b*: Estariemos encantados de acieptar su oro. Pero solo tratamos con unidades de mil moniedas. Entonces... ¿qué cantidad diesea diepositar hoy?\n@c0@"
  fr: "@a@b*ⓢ Pas de problème, nous sommes ravis que vous ayez décidé de nous confier votre or, mais nous ne prenons les dépôts que par tranches de mille.\n㈡\n*ⓢ Alors... combien vous voulez déposer aujourd'huiⓡ\n@c0@"
  it: "@a@b*: Certo che accettiamo il tuo oro, ma lavoriamo solo in tagli da mille monete.\nAllora, quanto vuoi depositare?\n@c0@"
  ja: "@a@b＊「ご入金は　１０００ゴールド単位で\n\tうけたまわります。\n\tいくら　お預かりしましょうか？\n@c0@"
6:
  de: "@a@b*: Ich will ja nicht unhöflich sein oder so, aber so viel habt Ihr gar nicht dabei.\n@c0@"
  en: "@a@b*: I don't mean to be rude or nuttin', but ye don't have that much on ye, so ye don't.\n@c0@"
  es: "@a@b*: Sin ánimo de ofiender, no lleva esa cantidad encima.\n@c0@"
  fr: "@a@b*ⓢ Je ne voudrais pas paraître désagréable, mais vous n'avez pas cette somme sur vous.\n@c0@"
  it: "@a@b*: Non vorrei essere scortese, ma mi pare che tu non disponga di tanto denaro...\n@c0@"
  ja: "@a@b＊「失礼ですが\n\tお客さまは　今　それほど\n\tお持ちではないようです。\n@c0@"
7:
  de: "@a@b*: Tut mir leid, aber im Tresor ist zurzeit kaum noch Platz frei. Wir können höchstens noch %a000520 Goldmünzen verkraften.\n@c0@"
  en: "@a@b*: I'm sorry, but there's barely any space left in the vault at the moment. The most we can accept is %a000520 gold coins.\n@c0@"
  es: "@a@b*: Lo siento, pero apienas queda espacio en la caja fuerte en estos momientos. Podiemos acieptar como máximo %a000520 moniedas de oro.\n@c0@"
  fr: "@a@b*ⓢ Hélas, nous n'avons plus beaucoup de place dans notre chambre forte. Nous ne pouvons accepter que %a000520 pièces d'or maximum.\n@c0@"
  it: "@a@b*: Mi spiace, ma in questo momento non abbiamo molto spazio nella cassaforte, e non possiamo accettare più di %a000520 monete d'oro.\n@c0@"
  ja: "@a@b＊「申しわけありませんが　金庫の空きが\n\t少なくて　%a000520ゴールドしか\n\tお預かりできません。\n@c0@"
8:
  de: "@a@b*: Wollt Ihr also diese Summe einzahlen? \n%a000520 Goldmünzen, meine ich.\n@c0@"
  en: "@a@b*: Would ye be happy to deposit that amount, would ye? %a000520 gold coins, that is.\n@c0@"
  es: "@a@b*: Entionces, quiere diepositar esa cantidad, ¿vierdad? Sierán %a000520 moniedas de oro, sí.\n@c0@"
  fr: "@a@b*ⓢ Alors voulez-vous déposer de l'argentⓡ\n%a000520 pièces d'or maximum, donc.\n@c0@"
  it: "@a@b*: Allora, vuoi depositare %a000520 monete?\n@c0@"
  ja: "@a@b＊「お預りするのは\n\t%a000520ゴールドで\n\tよろしいでしょうか？\n@c0@"
9:
  de: "@a@b*: Ganz großartig! Noch %a000520 Goldmünzen, die sich's in unserem Tresor gemütlich machen. Darin werden sie schön sicher sein.\n@c0@"
  en: "@a@b*: Well that's grand! Another %a000520 gold coins fer the vault, so it is. 'Twill be nice an' safe in there.\n@c0@"
  es: "@a@b*: ¡Estupiendo! Otras %a000520 moniedas de oro para la caja fuerte, sí. Estarián segurísimas aquí.\n@c0@"
  fr: "@a@b*ⓢ C'est superⓠ %a000520 pièces d'or de plus dans la chambre forte, alors. Elles y seront bien en sécurité.\n@c0@"
  it: "@a@b*: Molto bene!\nAllora mettiamo %a000520 monete al sicuro in cassaforte.\n@c0@"
  ja: "@a@b＊「では　%a000520ゴールド\n\t確かに　お預かりいたします。\n@c0@"
10:
  de: "@a@b*: %a000490 Goldmünzen, wie?\nGut, wird gleich im Tresor eingeschlossen. Kein Grund zur Sorge!\n@c0@"
  en: "@a@b*: %a000490 gold coins, is it?\nRight, we'll lock it up in the vault straight away. Ye've no need to worry.\n@c0@"
  es: "@a@b*: %a000490 monedas de oro, ¿vierdad?\nMuy bien, lo guardaremos en la caja fuerte de inmiediato. No si priocupe.\n@c0@"
  fr: "@a@b*ⓢ Vous déposez %a000490 pièces d'or, c'est çaⓡ\nNous allons mettre tout ça dans notre chambre forte.\nPas d'inquiétudeⓠ\n@c0@"
  it: "@a@b*: Uhm, %a000490 monete d'oro...?\nBene. Le metto subito in cassaforte. Puoi dormire sonni tranquilli: ora il tuo denaro è al sicuro!\n@c0@"
  ja: "@a@b＊「%a000490ゴールドですね。\n\tでは　責任をもって\n\tお預かりいたします。\n@c0@"
11:
  de: "@a@b*: E-Es tut mir leid, %A0110%Xder Herr%Z%B0110%Xdie Dame%Z, aber wie's aussieht, habt Ihr zurzeit keine einzige Goldmünze bei uns deponiert.\n@c0@"
  en: "@a@b*: I-I'm sorry, %A0110%Xsir%Z%B0110%Xma'am%Z, but ye don't appear to have even one gold coin deposited with us at the moment.\n@c0@"
  es: "@a@b*: Lo siento, %A0110%Xcaballiero%Z%B0110%Xsieñora%Z, pero al pariecer no tiene depositada cantidad alguna en nuestro banco en este momiento.\n@c0@"
  fr: "@a@b*ⓢ V-Veuillez m'excuser, %A0110%Xm'sieur%Z%B0110%Xm'dame%Z, mais vous n'avez pas l'ombre d'une pièce d'or chez nous.\n@c0@"
  it: "@a@b*: Mi spiace, ma dai registri risulta che non hai nemmeno mezza moneta depositata nella nostra banca.\n@c0@"
  ja: "@a@b＊「えっ？\n\tお客さまのお金は　１ゴールドも\n\tお預かりしていませんが……。\n@c0@"
12:
  de: "@a@b*: Zurzeit sind %a000480 Goldmünzen auf Eurem Konto.\nAlso, wie viel wollt Ihr heute abheben, %A0110%Xder Herr%Z%B0110%Xdie Dame%Z?\n@c0@"
  en: "@a@b*: Yer current balance is %a000480 gold coins.\nSo how much will ye be lookin' to withdraw today, %A0110%Xsir%Z%B0110%Xma'am%Z?\n@c0@"
  es: "@a@b*: Su saldo actual es de %a000480 moniedas de oro.\n¿Qué cantidad le intieresaría retirar hoy, %A0110%Xcaballiero%Z%B0110%Xsieñora%Z?\n@c0@"
  fr: "@a@b*ⓢ Votre solde est de %a000480 pièce%I0480%X%Ys%Z d'or.\nCombien vous voulez retirer aujourd'hui, %A0110%Xm'sieur%Z%B0110%Xm'dame%Zⓡ\n@c0@"
  it: "@a@b*: Il tuo saldo attuale è di %a000480 monete d'oro.\nQuanto vuoi prelevare?\n@c0@"
  ja: "@a@b＊「現在　%a000480ゴールド\n\tお預かりしています。\n\tいくら　お引き出しいたしますか？\n@c0@"
13:
  de: "@a@b*: Sicher, das wär 'ne stolze Summe! Aber Ihr habt gar nicht so viel auf der Bank, Ihr Dummⓚⓛ äh, ich meine, %A0110%Xder Herr%Z%B0110%Xdie Dame%Z...\n@c0@"
  en: "@a@b*: Sure an' that'd be a fine sum, so it would!\nBut ye don't have that much in the bank, y'eejⓚⓛ\nAhem! I mean, %A0110%Xsir%Z%B0110%Xma'am%Z...\n@c0@"
  es: "@a@b*: ¡Una suma espliéndida, sí!\nPero no dispone de esa cantidad en nuestro banco, piedazo de... ¡Ejem! Quiero diecir, %A0110%Xcaballiero%Z%B0110%Xsieñora%Z...\n@c0@"
  fr: "@a@b*ⓢ Eh bien, c'est une sacrée sommeⓠ Le problème, c'est que j'ai pas assez en banque, m%A0110%Xon g%Z%B0110%Xa fi%Z... euh, %A0110%Xm'sieur%Z%B0110%Xm'dame%Z...\n@c0@"
  it: "@a@b*: Certo, è una bella cifra!\n㈡\nPurtroppo non hai tanti quattrini depositati da noi, %A0110%Xcaro il mio furbetto... Cioè, volevo dire, egregio signore%Z%B0110%Xcara la mia furbetta... Cioè, volevo dire, egregia signora%Z...\n@c0@"
  ja: "@a@b＊「そんなに　たくさん\n\tお預かりしておりませんが……。\n@c0@"
14:
  de: "@a@b*: Es tut mir leid. Das ist mehr Gold, als %A0110%Xein Mannsbild%Z%B0110%Xein Weibsbild%Z tragen kann.\n@c0@"
  en: "@a@b*: I'm sorry. That's more gold than a %A0110%Xfeen%Z%B0110%Xwan%Z can be carryin'.\n@c0@"
  es: "@a@b*: Lo siento mucho, sí. Pero eso es más oro de lo que %A0110%Xun caballiero%Z%B0110%Xuna sieñora%Z puede llievar.\n@c0@"
  fr: "@a@b*ⓢ Je regrette. Cette somme est plus importante que ce qu'%A0110%Xun gars%Z%B0110%Xune donzelle%Z peut transporter.\n@c0@"
  it: "@a@b*: Mi spiace, ma questa cifra è più alta di quanto puoi portare con te...\n@c0@"
  ja: "@a@b＊「失礼ですが　お客さま。　そんなには\n\tお持ちになれないようです。\n@c0@"
15:
  de: "@a@b*: Also %a000550, wie?\nNa gut. Hier, bitte sehr...\n@c0@"
  en: "@a@b*: So it'll be %a000550, will it?\nAye, well. Here y'are...\n@c0@"
  es: "@a@b*: Así que sierán %a000550, ¿no?\nBueno, de acuerdo, sí. Aquí están...\n@c0@"
  fr: "@a@b*ⓢ Alors vous voulez %a000550 pièces d'or, c'est çaⓡ\nEntendu. Les voilà...\n@c0@"
  it: "@a@b*: Allora hai detto %a000550 monete, vero?\nBene. Ecco qua.\n@c0@"
  ja: "@a@b＊「%a000550ゴールドですね。\n\tはい　どうぞ。\n@c0@"
16:
  de: "@a@b*: Ihr habt's Euch anders überlegt, wie?\nKeine Bange. Die Goldbank ⓞHinterm Regenbogenⓟ ist immer für Euch da.\n@c0@"
  en: "@a@b*: Ye've changed yer mind, have ye?\nNot to worry. Rainbow's End Gold Bank'll be here fer ye when ye need it.\n@c0@"
  es: "@a@b*: Ha cambiado de idea, ¿no?\r\nNo si priocupe. El banco Las Mil y Una Noches sieguirá aquí para cuando lo niecesite.\n@c0@"
  fr: "@a@b*ⓢ Vous avez changé d'avis, c'est çaⓡ\nPas de problème. La Banque du Trésor de l'Arc-en-ciel est à votre service.\n@c0@"
  it: "@a@b*: Hai cambiato idea?\nNon c'è problema, tanto la Banca dell'Arcobaleno non si muove da qui. Torna pure quando ti pare.\n@c0@"
  ja: "@a@b＊「おやめに　なるのですね。\n@c0@"
17:
  de: "@a@b*: Zurzeit sind %a000480 Goldmünzen sicher in unserem Tresor deponiert. Vielen Dank.\n@c0@"
  en: "@a@b*: At the moment, ye've %a000480 gold coins safely tucked away in our vault. Thank you very much.\n@c0@"
  es: "@a@b*: En este momiento dispone de %a000480 moniedas de oro guardadas en nuestra caja con total sieguridad. Muchas gracias.\n@c0@"
  fr: "@a@b*ⓢ En ce moment, vous avez %a000480 pièces d'or qui attendent sagement dans notre chambre forte.\nMerci beaucoup.\n@c0@"
  it: "@a@b*: In questo momento hai %a000480 monete d'oro depositate nella cassaforte della banca.\n@c0@"
  ja: "@a@b＊「現在　%a000480ゴールド\n\tお預かりしています。\n\tありがとうございました。\n@c0@"
18:
  de: "@a@b*: Wir haben zurzeit kein Gold von Euch, %a000110. Aber wir stehen Euch jederzeit zu Diensten.\n@c0@"
  en: "@a@b*: We're not keepin' any gold fer yerself at the moment, %a000110, but we look forward to servin' ye again in the future.\n@c0@"
  es: "@a@b*: No tienemos oro de su priopiedad en este momiento, %a000110. Pero espieramos poder sierle de utilidad en el futuro.\n@c0@"
  fr: "@a@b*ⓢ Vous n'avez aucune pièce d'or déposée chez nous en ce moment, %a000110.\nMais n'hésitez pas à revenir nous voir.\n@c0@"
  it: "@a@b*: In questo momento non hai nemmeno una moneta falsa depositata qui da noi, %a000110.\nMa torna a trovarci presto!\n@c0@"
  ja: "@a@b＊「現在は　%a000120さまからの\n\tお預かり金は　ございません。\n\tまたのご利用を　お待ちしております。\n@c0@"
