20:
  de: "@a@b*: Auf Eurem Konto hier sind zurzeit %a000480 Goldmünzen, %a000120. Wie können wir Euch heut behilflich sein?\n@c0@"
  en: "@a@b*: Yer current balance with us is %a000480 gold coins, %a000120. And how can we be helpin' ye today, then?\n@c0@"
  es: "@a@b*: Su saldo actual con nosotros es de %a000480 moniedas de oro, %a000120. ¿En qué piodemos siervirle hoy?\n@c0@"
  fr: "@a@b*ⓢ Votre solde est de %a000480 pièce%I0480%X%Ys%Z d'or, %a000120.\nQue puis-je faire pour vous, aujourd'huiⓡ\n@c0@"
  it: "@a@b*: Il tuo saldo attuale è di %a000480 monete d'oro, %a000120.\nCosa posso fare per te?\n@c0@"
  ja: "@a@b＊「%a000120さまからは　現在\n\t%a000480ゴールド　お預かり\n\tしています。　ご用は　なんでしょう？\n@c0@"
21:
  de: "@a@b*: In unserem Tresor lagert zurzeit kein Gold von Euch, %a000110. Aber vielleicht können wir Euch sonst irgendwie behilflich sein?\n@c0@"
  en: "@a@b*: We don't have any gold of yerself's in the vault at the moment, %a000110, but can we be helpin' ye still an' all, perhaps?\n@c0@"
  es: "@a@b*: No guardamos oro de su priopiedad en nuestra caja en este momiento, %a000110. ¿Podiemos serle útil de algún otro modo?\n@c0@"
  fr: "@a@b*ⓢ Nous n'avons pas d'or à vous en ce moment, %a000110. Je peux peut-être quand même faire quelque chose pour vousⓡ\n@c0@"
  it: "@a@b*: In questo momento non hai nemmeno il becco d'un quattrino depositato qui da noi, %a000110.\nPosso fare altro per te?\n@c0@"
  ja: "@a@b＊「現在は　%a000120さまからの\n\tお預かり金は　ございません。\n\tご用は　なんでしょう？\n@c0@"
