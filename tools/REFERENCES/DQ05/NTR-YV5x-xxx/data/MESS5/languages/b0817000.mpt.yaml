  de: "@a@b*: Willkommen in der Goldbank ⓞHinterm Regenbogenⓟ.\n@c0@"
  en: "@a@b*: Welcome to Rainbow's End Gold Bank.\n@c0@"
  es: "@a@b*: %H0860%X%A0110%XBienvienido%Z%B0110%XBienvienida%Z%Y%R0000%XBienvenidas%YBienvienidos%Z%Z al banco Las Mil y Una Noches.\n@c0@"
  fr: "@a@b*ⓢ Bienvenue à la Banque du Trésor de l'Arc-en-ciel.\n@c0@"
