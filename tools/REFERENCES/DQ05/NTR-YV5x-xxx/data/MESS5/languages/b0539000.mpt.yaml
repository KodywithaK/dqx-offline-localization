  ja: "@a@bサンチョ「学者だの　占い師だの\n\tどうも私　そういう方々は\n\t話が長くて　苦手で……。\n@c0@"
59:
  de: "@a%0%a001240@bIch werde ihn finden! Ja genau, ich werde diesen Umhang finden und ihn dir dann schenken!\n@c0@"
  en: "@a%0%a001240@bI'm going to find it! Yep, I'll find that cape and then give it to you as a present!\n@c0@"
  es: "@a%0%a001240@b¡Voy a encontrarla! ¡Lo he decidido, encontraré la capa y te la regalaré!\n@c0@"
