  it: "@aSancho@bSì, ahora sei perfectamentes pettinato. Avevi una ciocca de capellos fuori puesto, y no volevo que te presentassi al Rey de Coburg en disordines...\n@c0@"
  ja: "@a@bサンチョ「髪の毛も　みだれてませんし\n\t服にも　シワはありません。\n\tささ　王に　ごあいさつを！\n@c0@"
79:
  de: "@a%0%a001240@bIst das König Wilbur? Er ist viel jünger, als ich gedacht hatte.\n@c0@"
  en: "@a%0%a001240@bIs that King Wilbur? He's a lot younger than I expected.\n@c0@"
  es: "@a%0%a001240@b¿Ese es el rey Leonoro? Es mucho más joven de lo que me esperaba.\n@c0@"
  fr: "@a%0%a001240@bC'est lui, le roi Willⓡ\nJe l'imaginais beaucoup plus vieux.\n@c0@"
  it: "@a%0%a001240@bQuello è re Fabian?\nÈ molto più giovane di quanto credessi...\n@c0@"
  ja: "@a@b%a001240「あの人が　デール王さま？\n\tずいぶん若い　王さまだね。\n@c0@"
80:
  de: "@aSancho@bSi! Ich hatte vergessen! Señor Wilbur hat eine Brief nach Humburg geschickt, um zu zeigen seine Freude über deine Rückkehr.\n@c0@"
  en: "@aSancho@bSí! I forget! Señor Wilbur, he esend hees congratulations for your return to Gotha.\n@c0@"
