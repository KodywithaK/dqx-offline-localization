  it: "@aNera@bSono certa che Emilian diventerà forte, bello e coraggioso come suo padre, ma per il momento è solo un ragazzino molto vispo e un po' sgarbato!\n@c0@"
  ja: "@a@bフローラ「どこから　どう見ても\n\tコリンズ王子は　ヘンリーさんに\n\tそっくりですけど……。\n@c0@"
216:
  de: "@a%0%a001240@bOh! Ist Kendrick wirklich wie Harry, als er klein war?\n@c0@"
  en: "@a%0%a001240@bOh! Is Kendrick really just like Harry was when he was young?\n@c0@"
  es: "@a%0%a001240@b¡Oh! ¿Así que Santos es como su padre de niño?\n@c0@"
  fr: "@a%0%a001240@bOhⓠ Rodéric ressemble vraiment à Harry quand il était petitⓡ\n@c0@"
  it: "@a%0%a001240@bDavvero Robert era una peste come Emilian quando aveva la sua età?\n@c0@"
  ja: "@a@b%a001240「えっ？　\n\tコリンズくんって　ヘンリーさんの\n\t小さい頃に　そっくりなの？\n@c0@"
217:
  de: "@a%0%a001240@bDann musst du mir ein paar Tipps geben, wie ich besser mit ihm klarkomme!\n@c0@"
  en: "@a%0%a001240@bThen you'll have to give me some tips on how to get on with him better!\n@c0@"
  es: "@a%0%a001240@b¡Entonces tendrás que darme unos consejos para llevarme mejor con él!\n@c0@"
  fr: "@a%0%a001240@bIl va falloir que tu m'expliques comment tu faisais pour t'entendre avec lui, alorsⓠ\n@c0@"
  it: "@a%0%a001240@bCome facevi a sopportarlo?\nNon è che potresti darmi qualche consiglio?\n@c0@"
  ja: "@a@b%a001240「じゃあ　あとで\n\tああいう子と　仲よくなる方法\n\t教えてね！\n@c0@"
218:
  de: "@a%0%a001250@bSchon wieder hier. Dabei wäre ich viel lieber zu Hause in Humburg geblieben.\n@c0@"
  en: "@a%0%a001250@bHere we are again. I would've much preferred to stay at home in Gotha.\n@c0@"
  es: "@a%0%a001250@bAquí estamos otra vez. Hubiese preferido mil veces quedarme en casa, en Pankraz.\n@c0@"
  fr: "@a%0%a001250@bEt c'est reparti. J'aurais largement préféré rester à la maison à Gotha.\n@c0@"
  it: "@a%0%a001250@bUffà!\nMa quand'è che torniamo a Denim, eh?!\n@c0@"
  ja: "@a@b%a001250「……また来ましたね。\n\tわたし　グランバニアで\n\tおるすばんしてたかったです。\n@c0@"
219:
  de: "@aSancho@bIss glaube, es ist nisst einfach für Señor Harry.\n@c0@"
  en: "@aSancho@bEes no easy for señor Harry, I theenk.\n@c0@"
  es: "@aSancho@bNo es fácil para el señor Froilán.\n@c0@"
  fr: "@aSancho@bC-Ce n'est pas facile pour le señor Harry.\n@c0@"
  it: "@aSancho@bPrimero el señor Robert, y ahora el principino Emilian. ¡Ormai la gente de Coburg sarà abituata ad avere a que fare con eredes al trono muy pestiferos!\n@c0@"
  ja: "@a@bサンチョ「まあ　ヘンリーさまも\n\tご苦労　なさいましたよね……。\n@c0@"
220:
  de: "@a%0%a001240@bIch weiß alles über Tifortu! Tifortu und Humburg waren immer gut befreundet, stimmt's?\n@c0@"
  en: "@a%0%a001240@bI know about Coburg! Coburg and Gotha have always been good friends, haven't they?\n@c0@"
  es: "@a%0%a001240@b¡Yo sé cosas de Trastámara! Trastámara y Pankraz siempre han tenido una buena relación, ¿a que sí?\n@c0@"
  fr: "@a%0%a001240@bTu m'as déjà parlé de Cobourgⓠ Cobourg et Gotha ont toujours été bons amis, pas vraiⓡ\n@c0@"
  it: "@a%0%a001240@bHo già sentito parlare di Coburg!\nSe non sbaglio, il Regno di Denim e quello di Coburg sono alleati, esatto?\n@c0@"
  ja: "@a@b%a001240「ボク　知ってるよ！\n\tラインハットと　グランバニアは\n\t仲よしの国なんだよね。\n@c0@"
221:
  de: "@a%0%a001240@bAaah...\nIch bin ganz schön müde plötzlich...\n@c0@"
  en: "@a%0%a001240@bAaaah...\nI'm a bit sleepy all of a sudden.\n@c0@"
  es: "@a%0%a001240@bAaaah...\nDe pronto me ha entrado sueño.\n@c0@"
  fr: "@a%0%a001240@bAaaah... Je suis un peu fatigué, tout à coup.\n@c0@"
  it: "@a%0%a001240@bYawn...\nM'è venuto sonno...\n@c0@"
  ja: "@a@b%a001240「ふわぁ～……\n\tちょっと　眠くなってきちゃった。\n@c0@"
222:
  de: "@a%0%a001250@bSancho hatte nie Lust, nach Tifortu zu reisen.\n@c0@"
  en: "@a%0%a001250@bUm, Sancho always says he doesn't much fancy the idea of visiting Coburg.\n@c0@"
  es: "@a%0%a001250@bSancho siempre dice que no le atrae la idea de visitar Trastámara.\n@c0@"
  fr: "@a%0%a001250@bMmm, Sancho dit toujours qu'il n'aime pas trop l'idée d'aller à Cobourg.\n@c0@"
  it: "@a%0%a001250@bLo zio Sancho diceva sempre che l'idea di andare a Coburg non lo allettava.\n@c0@"
  ja: "@a@b%a001250「あのね　サンチョね…\n\tラインハットに来るの\n\tあんまり　好きじゃないって……。\n@c0@"
223:
  de: "@a%0%a001250@bEs ist das einzige Schloss, das wir nicht gesehen haben, als wir mit ihm unterwegs waren.\n@c0@"
  en: "@a%0%a001250@bThis is the one castle we didn't visit when we were travelling around with him.\n@c0@"
  es: "@a%0%a001250@bEs el único castillo que no visitamos cuando viajábamos con él.\n@c0@"
  fr: "@a%0%a001250@bC'est le seul château qu'on n'ait pas visité pendant notre périple avec lui.\n@c0@"
  it: "@a%0%a001250@bCredo che Coburg non gli piaccia affatto...\n@c0@"
  ja: "@a@b%a001250「みんなで　旅してたときも\n\tわたしたち　このお城だけ\n\t来たこと　なかったの。\n@c0@"
224:
  de: "@a%0%a001250@bOh! Wie hübsch! Sieh dir nur all die Sterne an!\n@c0@"
  en: "@a%0%a001250@bOoh! How pretty! Look at all the stars!\n@c0@"
  es: "@a%0%a001250@b¡Oooh! ¡Qué bonito! ¡Mira cuántas estrellas!\n@c0@"
  fr: "@a%0%a001250@bOhⓠ Comme c'est joliⓠ Regarde les étoilesⓠ\n@c0@"
  it: "@a%0%a001250@bGuarda quante stelle!\nChe belle che sono...\n@c0@"
  ja: "@a@b%a001250「わ～　キレイ！\n\tお星さまが　いっぱい見えるよ！\n@c0@"
225:
  de: "@aSancho@bMeine Majestät. Du freust diss, nach Tifortu zurückzukehren, si?\n@c0@"
  en: "@aSancho@bMy Majesty. You feel only the nostalgia now you return to Coburg, sí?\n@c0@"
  es: "@aSancho@bMajestad. Siente nostalgia cuando vuelve a Trastámara, ¿verdad?\n@c0@"
  fr: "@aSancho@bM-Ma Majesté. Tu dois sans doute ressentir de la\nn-n-nostalgie en revenant à C-Cobourg, noⓡ\n@c0@"
  it: "@aSancho@bChico, escommetto que sei feliz de rivedere Coburg...\n@c0@"
  ja: "@a@bサンチョ「%a000090王は　もう\n\tこの　ラインハットの国に　対しては\n\tなつかしい想いだけでしょうか……？\n@c0@"
226:
  de: "@aSancho@bAber deine Onkel Sancho... no...\n@c0@"
  en: "@aSancho@bBut for your Uncle Sancho ees, ees...\n@c0@"
  es: "@aSancho@bPero para tu tito Sancho es... es...\n@c0@"
  fr: "@aSancho@bMais p-pour tonton Sancho, c'est...\n@c0@"
  it: "@aSancho@bLo zio Sancho, inveces, qui ha muchos recuerdos bruttos...\nYo... Yo me commuovos... ¡Sob!\n@c0@"
  ja: "@a@bサンチョ「でも　私は…　私は………。\n@c0@"
227:
  de: "@aSancho@bIss weiß, es ist loco, aber es ist sehr schwer für miss, in Tifortu zu sein. Meine Herz brisst dann, verstehst du?\n@c0@"
  en: "@aSancho@bI know ees loco, but for me, being een Coburg ees eso hard. My heart, ees breaking, you know?\n@c0@"
  es: "@aSancho@bYa sé que nomás es una tontería, pero para mí es muy triste venir a Trastámara. Mi corazón se me rompe.\n@c0@"
  fr: "@aSancho@bJ-Je sais que c'est loco, mais pour moi, c'est dur d'être à Cobourg. J'ai le c-cœur brisé.\n@c0@"
  it: "@aSancho@bNo me gusta Coburg.\nCoburg me fa tornare en mente muchas cosas negativas...\n@c0@"
  ja: "@a@bサンチョ「頭では　わかっているのですが\n\t正直　ラインハットにいると\n\t胸が　はりさけそうになります……。\n@c0@"
228:
  de: "@aOtto@bIch habe mir sagen lassen, dass Ihr ein Freund der hiesigen Königsfamilie seid, %a000090.\n@c0@"
  en: "@aTuppence@bI understand that you're rather pally with the royal family here, %a000090.\n@c0@"
  es: "@aAlazar@bTengo entendido que sois bastante amigo de esta familia real, %a000090.\n@c0@"
  fr: "@aInnocent@bSi j'ai bien compris, vous êtes très copain avec la famille royale d'ici, %a000090.\n@c0@"
  it: "@aSimon@bMaestà, so che lei ha ottimi rapporti con la famiglia reale di Coburg, e in particolare con il principe Robert. È da molto che lo conosce, non è vero?\n@c0@"
  ja: "@a@bピピン「%a000090さまって\n\tラインハットの王族方とも\n\tご交友が　あるんですよね。\n@c0@"
229:
  de: "@aOtto@bEin Graben und eine Zugbrücke... Somit ist das Schloss geradezu uneinnehmbar. Welch eine hervorragende Idee!\n@c0@"
  en: "@aTuppence@bA moat and drawbridge... That makes the castle fairly impenetrable. What a good idea!\n@c0@"
  es: "@aAlazar@bUn foso y un puente levadizo... Así, el castillo es bastante impenetrable. ¡Qué gran idea!\n@c0@"
  fr: "@aInnocent@bDes douves et un pont-levis... Avec ça, un château est presque imprenable. C'est une bonne idéeⓠ\n@c0@"
  it: "@aSimon@bI fossati e i ponti levatoi sono ottimi mezzi di difesa, ma solo una guarnigione di soldati ben addestrati può rendere un castello davvero inespugnabile!\n@c0@"
  ja: "@a@bピピン「堀に　はね橋かあ……。\n\tああしておけば　城の守りは\n\tカンペキですね。　勉強になるなあ。\n@c0@"
230:
  de: "@aBianca@bSieht aus, als sei es in Tifortu recht friedlich zugegangen seit dem Zwischenfall vor ein paar Jahren. Ist das nicht schön, %a000090?\n@c0@"
  en: "@aBianca@bLooks like Coburg's bin pretty peaceful ever since that kerfuffle all them years ago. That must be a relief to you, eh?\n@c0@"
  es: "@aBianca@bParece que la paz ha reinado en Trastámara desde aquel follón de hace tantos años. Qué alivio para ti, ¿eh?\n@c0@"
  fr: "@aBianca@bOn dirait que Cobourg est plutôt calme depuis tout ce bazar, il y a quelques années. Ça doit être un soulagement pour toi, nonⓡ\n@c0@"
  it: "@aBianca@bPer fortuna Coburg è tornata florida, pacifica e tranquilla, dopo l'orribile periodo vissuto anni fa.\r\nBuon per Robert e per tutti gli abitanti del Regno!\n@c0@"
  ja: "@a@bビアンカ「ラインハットは　あれから\n\tずっと　平和だったみたいね。\n\t%a000090も　安心したでしょ？\n@c0@"
231:
  de: "@aNera@bPrinz Harry und König Wilbur scheinen hier ausgezeichnete Arbeit zu leisten. In Tifortu herrscht jetzt eine sehr warme, freundliche Stimmung.\n@c0@"
  en: "@aNera@bPrince Harry and King Wilbur seem to be doing an excellent job here. The place has a very warm feel to it now.\n@c0@"
  es: "@aNera@bParece que el príncipe Froilán y el rey Leonoro están haciendo un buen trabajo aquí. Este lugar tiene una atmósfera veramente cálida.\n@c0@"
  fr: "@aNera@bLe prince Harry et le roi Will semblent faire un très bon travail ici. Cet endroit est vraiment chaleureux, maintenant.\n@c0@"
  it: "@aNera@bSi respira un'atmosfera serena e tranquilla...\r\nRe Fabian e il principe Robert hanno saputo riportare pace e prosperità nel Regno di Coburg.\n@c0@"
  ja: "@a@bフローラ「ヘンリーさんと　デール王が\n\tうまく　やってらっしゃるのね。\n\t国の　ふんい気が　あたたかいわ。\n@c0@"
232:
  de: "@a%0%a001240@bEr wird sich noch erkälten, wenn er hier schläft!\n@c0@"
  en: "@a%0%a001240@bHe'll get a cold, sleeping there like that!\n@c0@"
  es: "@a%0%a001240@b¡Si duerme así va a pillar un buen catarro!\n@c0@"
  fr: "@a%0%a001240@bIl va attraper froid à dormir là comme çaⓠ\n@c0@"
  it: "@a%0%a001240@bMa come parla quel tipo?\nChe ha detto?\n@c0@"
  ja: "@a@b%a001240「あんな所で　寝てたら\n\tカゼひいちゃうよ！\n@c0@"
233:
  de: "@a%0%a001250@bPuh! Der Mann riecht nach Schänke!\n@c0@"
  en: "@a%0%a001250@bYuck! That man smells of drink!\n@c0@"
  es: "@a%0%a001250@b¡Puaj! ¡Ese hombre apesta a alcohol!\n@c0@"
  fr: "@a%0%a001250@bBeurkⓠ Cet homme a bu, il empesteⓠ\n@c0@"
  it: "@a%0%a001250@bSe non ho capito male, anche a quel signore piace guardare le stelle...\n@c0@"
  ja: "@a@b%a001250「いや～ん！\n\tあの人　お酒くさかったの。\n@c0@"
234:
  de: "@aOtto@bWenn man so laut schnarcht wie dieser Kerl hier, ist es doch nur natürlich, dass man aus seinem eigenen Haus geworfen wird, nicht?\n@c0@"
  en: "@aTuppence@bI'd say it's fairly likely that character's been\r\nthrown out of his house for snoring too loudly, wouldn't you?\n@c0@"
  es: "@aAlazar@bYo creo que a este hombre lo han echado de casa por roncar demasiado fuerte, ¿no crees?\n@c0@"
  fr: "@aInnocent@bÀ mon avis, ce brave homme s'est fait jeter hors\nde chez lui parce qu'il ronflait trop fort, vous ne croyez pasⓡ\n@c0@"
  it: "@aSimon@bⓕSbrilluccicano ch'è 'na meravijiaⓖ?!\nAh, però! Una frase del genere farebbe morire qualsiasi ragazza... ma dal ridere!\n@c0@"
  ja: "@a@bピピン「きっと　あの人\n\tイビキがひどくて\n\t家を　追いだされたんだな？\n@c0@"
235:
  de: "@a%0%a001250@bEs ist bestimmt nicht schön, etwas zu verlieren, das einem so viel bedeutet. Der arme Mann!\n@c0@"
  en: "@a%0%a001250@bIt must be horrible to lose something important to you like that. The poor man!\n@c0@"
  es: "@a%0%a001250@bDebe de ser horrible perder así algo tan importante. ¡Pobre hombre!\n@c0@"
  fr: "@a%0%a001250@bCe doit être horrible de perdre quelque chose d'aussi important. Pauvre hommeⓠ\n@c0@"
  it: "@a%0%a001250@bNon gliel'avrà mica rubata qualcuno?!\nO forse non ricorda dove l'ha messa?\n@c0@"
  ja: "@a@b%a001250「大事なもの　なくなると\n\tさみしいの…　かわいそうなの。\n@c0@"
236:
  de: "@aSancho@bSiehst du? Es ist nisst sisser hier. Das war bestimmt eine Dieb.\n@c0@"
  en: "@aSancho@bYou esee? Ees no esafe here.\nEes the work of the thieves.\n@c0@"
  es: "@aSancho@b¿Lo ves? Este sitio no es seguro.\nEsto es obra de ladrones.\n@c0@"
  fr: "@aSancho@bT-Tu voisⓠ C'est d-dangereux par ici.\nIl y a des v-v-voleurs.\n@c0@"
  it: "@aSancho@bSegundo me qualche mariuolos ha visto l'armatura y se la es portata via approfittando de un momento de distracción de quell'hombre...\n@c0@"
  ja: "@a@bサンチョ「このへんも　ブッソウですね。\n\tありゃ　たぶん　盗ぞくの\n\tしわざですよ。\n@c0@"
237:
  de: "@aGriselda@bHast du nicht irgendwelche Freunde, die in Tifortu leben?\n@c0@"
  en: "@aDebora@bDon't you have some friends who live in Coburg?\n@c0@"
  es: "@aStefania@b¿No tienes amici que viven en Trastámara?\n@c0@"
  fr: "@aPandora@bTu n'as pas des amis qui vivent à Cobourgⓡ\n@c0@"
  it: "@aViola@bSe non sbaglio hai degli amici a Coburg...\n@c0@"
  ja: "@a@bデボラ「そういえば　ここには\n\tあんたの　友だちが\n\tいたんだっけ？\n@c0@"
238:
  de: "@aGriselda@bBesuch sie doch, wo wir schon mal hier sind.\n@c0@"
  en: "@aDebora@bYou should go and see them while we're here.\n@c0@"
  es: "@aStefania@bMientras estamos aquí deberías andare a visitarlos.\n@c0@"
  fr: "@aPandora@bTu devrais aller les voir pendant que nous sommes là.\n@c0@"
  it: "@aViola@bSe vuoi, puoi andare a salutarli.\nHai la mia autorizzazione.\n@c0@"
  ja: "@a@bデボラ「せっかくだから　顔を\n\t出していきましょうよ。\n@c0@"
239:
  de: "@aGriselda@bPrinz Kendrick? Wenn er ein Prinz ist, wird er vermutlich der Sohn deines Freundes Harry sein, oder?\n@c0@"
  en: "@aDebora@bPrince Kendrick? If he's a prince, then surely that means he must be your friend Harry's son?\n@c0@"
  es: "@aStefania@b¿El príncipe Santos? Si es príncipe, seguro que es il figlio de tu amigo Froilán, ¿vero?\n@c0@"
  fr: "@aPandora@bLe prince Rodéricⓡ Si c'est un prince, ça doit sûrement vouloir dire qu'il est le fils de ton ami Harry, nonⓡ\n@c0@"
  it: "@aViola@bIl principino Emilian?\nScommetto che è il figlio del tuo amico Robert.\n@c0@"
  ja: "@a@bデボラ「コリンズ王子？　王子ってことは\n\tそれって　あんたの友だちの\n\t息子なんじゃないの？\n@c0@"
240:
  de: "@aGriselda@bHuch! Er mag ja schnell sein, aber das ist auch schon das Einzige, was für ihn spricht!\n@c0@"
  en: "@aDebora@bHuh! He may be quick on his feet, but that's about the only thing he's got going for him.\n@c0@"
  es: "@aStefania@b¡Bah! Quizá sea rápido, ma eso es lo único que sabe hacer.\n@c0@"
  fr: "@aPandora@bTssⓠ Il est peut-être rapide, mais c'est à peu près tout ce qu'il a pour lui.\n@c0@"
  it: "@aViola@bMa l'hai sentito?!\nDopo la scarica di botte che ha preso ha anche il coraggio di minacciarci! Roba da matti...\n@c0@"
  ja: "@a@bデボラ「逃げ足は　速いけど\n\tたいしたこと　ないヤツだったわね。\n@c0@"
241:
  de: "@aGriselda@bKein gutes Zeichen, wenn die Schwester so was sagt. Wir müssen uns beeilen.\n@c0@"
  en: "@aDebora@bIt's bad news if she can sense it even here.\nWe need to hurry.\n@c0@"
  es: "@aStefania@bNo es bueno si puede detectarlo incluso aquí.\nHay que ponerse manos a la obra presto.\n@c0@"
  fr: "@aPandora@bC'est une mauvaise nouvelle si elle parvient à sentir ça jusqu'ici. On doit faire vite.\n@c0@"
  it: "@aViola@bSe anche quella suora riesce ad avvertire la forza malvagia che minaccia il mondo, vuol dire che la situazione è drammatica. Non c'è tempo da perdere.\n@c0@"
  ja: "@a@bデボラ「こんな場所の　シスターまで\n\t感じることができるなんて……\n\tこれは　急いだほうがいいわね。\n@c0@"
242:
  de: "@aGriselda@bWas bin ich froh, dass unsere Kinder so wohlerzogen sind. Genau wie ich.\n@c0@"
  en: "@aDebora@bIt's good that our children are quiet and well-behaved like me.\n@c0@"
  es: "@aStefania@bQué buona fortuna que nuestros niños sean tranquilos y formales come io.\n@c0@"
  fr: "@aPandora@bC'est une bonne chose que nos enfants soient calmes et bien élevés, comme moi.\n@c0@"
  it: "@aViola@bI nostri figli sono cortesi, ben educati e molto rispettosi.\nSi vede che hanno preso dalla madre...\n@c0@"
  ja: "@a@bデボラ「うちの子たちは\n\t私に似て　おとなしい　いい子よねー。\n@c0@"
243:
  de: "@aGriselda@bWie erbärmlich! Ein Mann wie er sollte wirklich keine Angst vor Mäusen haben...\n@c0@"
  en: "@aDebora@bHow pathetic! A man like him shouldn't have a phobia about mice!\n@c0@"
  es: "@aStefania@b¡Qué lastimoso! ¡Un uomo come él no debería tener fobia a los ratones!\n@c0@"
  fr: "@aPandora@bC'est pitoyableⓠ Un homme comme lui ne devrait pas avoir une telle phobie des sourisⓠ\n@c0@"
  it: "@aViola@bUn uomo come lui ha paura dei topi?! Bah! Che razza di codardo!\nCaro, ovviamente tu non hai paura dei topi, vero?\n㈡\nPerché se ce ne fosse qualcuno nel raggio di un miglio, io comincerei a strillare come un'indemoniata, e toccherebbe a te eliminare quelle belve!\n@c0@"
  ja: "@a@bデボラ「ネズミがきらいなんて\n\t男のくせに　なさけないわね！\n@c0@"
244:
  de: "@aGriselda@bGlaubst du, dass es jemals zu einem Machtkampf zwischen unseren Kindern kommen könnte?\n@c0@"
  en: "@aDebora@bYou don't think that there'll ever be a power struggle between our two children, do you?\n@c0@"
  es: "@aStefania@b¿Tú crees que algún día nuestros bambini se enfrentarán por el poder?\n@c0@"
  fr: "@aPandora@bTu ne crois pas que nos deux enfants rsiqueraient un jour de se déchirer pour le pouvoir, dis-moiⓡ\n@c0@"
  it: "@aViola@bSpero che a Denim non scoppino mai guerre di successione. Sarebbe orribile vedere %a001250 e %a001240 litigare tra loro per il trono del Regno...\n@c0@"
  ja: "@a@bデボラ「うちも子どもが　ふたりいるけど\n\tあらそいには　ならないわよね？\n@c0@"
245:
  de: "@aGriselda@b%0%a001240 und %a001250 haben nicht viele Freunde in ihrem Alter...\n@c0@"
  en: "@aDebora@b%0%a001240 and %a001250 don't have many friends their own age, do they?\n@c0@"
  es: "@aStefania@b%0%a001240 y %a001250 no tienen muchos amici de su edad, ¿vero?\n@c0@"
  fr: "@aPandora@b%0%a001240 et %a001250 n'ont pas beaucoup d'amis de leur âge, tu ne trouves pasⓡ\n@c0@"
  it: "@aViola@b%0%a001240 e %a001250 non hanno molti amichetti della loro età...\n@c0@"
  ja: "@a@bデボラ「うちの子たちって\n\t同年代の　知り合いが\n\t少ないわよね？\n@c0@"
246:
