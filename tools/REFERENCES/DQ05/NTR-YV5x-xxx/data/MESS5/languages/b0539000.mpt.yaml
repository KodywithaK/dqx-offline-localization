0:
  de: "@a%0%a001240@bIch weiß alles über Tifortu! Tifortu und Humburg waren immer gut befreundet, stimmt's?\n@c0@"
  en: "@a%0%a001240@bI know about Coburg! Coburg and Gotha have always been good friends, haven't they?\n@c0@"
  es: "@a%0%a001240@b¡Yo sé cosas de Trastámara! Trastámara y Pankraz siempre han tenido una buena relación, ¿a que sí?\n@c0@"
  fr: "@a%0%a001240@bTu m'as déjà parlé de Cobourgⓠ Cobourg et Gotha ont toujours été bons amis, pas vraiⓡ\n@c0@"
  it: "@a%0%a001240@bHo già sentito parlare di Coburg!\nSe non sbaglio, il Regno di Denim e quello di Coburg sono alleati, esatto?\n@c0@"
  ja: "@a@b%a001240「ボク　知ってるよ！\n\tラインハットと　グランバニアは\n\t仲よしの国なんだよね。\n@c0@"
1:
  de: "@a%0%a001240@bDu und Prinz Harry wart auch mal zusammen auf Reisen, oder? Ich wünschte, ich wär dabei gewesen.\n@c0@"
  en: "@a%0%a001240@bYou and Prince Harry used to travel about together, didn't you? I wish I could've come\nalong with you.\n@c0@"
  es: "@a%0%a001240@bTú y el príncipe Froilán viajasteis mucho juntos, ¿verdad? Cómo me habría gustado ir con vosotros.\n@c0@"
  fr: "@a%0%a001240@bLe prince Harry et toi, vous avez voyagé ensembleⓡ J'aurais bien aimé être avec vous.\n@c0@"
  it: "@a%0%a001240@bIn passato hai viaggiato insieme al principe Robert, non è vero?\nMi avrebbe fatto piacere venire con voi!\n@c0@"
  ja: "@a@b%a001240「お父さんと　ヘンリーさんは\n\t昔　いっしょに冒険したんでしょ？\n\tボクも　まぜてほしかったな。\n@c0@"
2:
  de: "@a%0%a001250@bSancho hatte nie Lust, nach Tifortu zu reisen.\n@c0@"
  en: "@a%0%a001250@bUm, Sancho always says he doesn't much fancy the idea of visiting Coburg.\n@c0@"
  es: "@a%0%a001250@bSancho siempre dice que no le atrae la idea de visitar Trastámara.\n@c0@"
  fr: "@a%0%a001250@bMmm, Sancho dit toujours qu'il n'aime pas trop l'idée d'aller à Cobourg.\n@c0@"
  it: "@a%0%a001250@bLo zio Sancho diceva sempre che l'idea di andare a Coburg non lo allettava.\n@c0@"
  ja: "@a@b%a001250「あのね　サンチョね…\n\tラインハットに来るの\n\tあんまり　好きじゃないって……。\n@c0@"
3:
  de: "@a%0%a001250@bEs ist das einzige Schloss, das wir nicht gesehen haben, als wir mit ihm unterwegs waren.\n@c0@"
  en: "@a%0%a001250@bThis is the one castle we didn't visit when we were travelling around with him.\n@c0@"
  es: "@a%0%a001250@bEs el único castillo que no visitamos cuando viajábamos con él.\n@c0@"
  fr: "@a%0%a001250@bC'est le seul château qu'on n'ait pas visité pendant notre périple avec lui.\n@c0@"
  it: "@a%0%a001250@bCredo che Coburg non gli piaccia affatto...\n@c0@"
  ja: "@a@b%a001250「みんなで　旅してたときも\n\tわたしたち　このお城だけ\n\t来たこと　なかったの。\n@c0@"
4:
  de: "@a%0%a001250@bWas für ein großartiges Schloss! Aber die Leute leben ja außerhalb der Schlossmauern. Das ist aber nicht sehr sicher...\n@c0@"
  en: "@a%0%a001250@bWhat a grand-looking castle! But the people live outside the castle walls. Do you think that's safe?\n@c0@"
  es: "@a%0%a001250@b¡Qué castillo tan magnífico! Pero la gente vive fuera de los muros del castillo. ¿Tú crees que eso será seguro?\n@c0@"
  fr: "@a%0%a001250@bQuel château magnifiqueⓠ Mais les gens habitent en dehors des remparts. Tu ne crois pas que c'est dangereuxⓡ\n@c0@"
  it: "@a%0%a001250@bChe bel castello!\nMa come mai ci sono persone che vivono fuori dalle mura? Non è pericoloso?\n@c0@"
  ja: "@a@b%a001250「すごく　きれいなお城！\n\tだけど　町の人たち\n\tお城の外にいて…　大丈夫なの？\n@c0@"
5:
  de: "@aSancho@bMeine Majestät. Du freust diss, nach Tifortu zurückzukehren, si?\n@c0@"
  en: "@aSancho@bMy Majesty. You feel only the nostalgia now you return to Coburg, sí?\n@c0@"
  es: "@aSancho@bMajestad. Siente nostalgia cuando vuelve a Trastámara, ¿verdad?\n@c0@"
  fr: "@aSancho@bM-Ma Majesté. Tu dois sans doute ressentir de la\nn-n-nostalgie en revenant à C-Cobourg, noⓡ\n@c0@"
  it: "@aSancho@bChico, escommetto que sei feliz de rivedere Coburg...\n@c0@"
  ja: "@a@bサンチョ「%a000090王は　もう\n\tこの　ラインハットの国に　対しては\n\tなつかしい想いだけでしょうか……？\n@c0@"
6:
  de: "@aSancho@bAber deine Onkel Sancho... no...\n@c0@"
  en: "@aSancho@bBut for your Uncle Sancho ees, ees...\n@c0@"
  es: "@aSancho@bPero para tu tito Sancho es... es...\n@c0@"
  fr: "@aSancho@bMais p-pour tonton Sancho, c'est...\n@c0@"
  it: "@aSancho@bLo zio Sancho, inveces, aquí ha muchos recuerdos bruttos...\nYo... Yo me commuovos... ¡Sob!\n@c0@"
  ja: "@a@bサンチョ「でも　私は…　私は………。\n@c0@"
7:
  de: "@aSancho@bIss weiß, es ist loco, aber es ist sehr schwer für miss, in Tifortu zu sein. Meine Herz brisst dann, verstehst du?\n@c0@"
  en: "@aSancho@bI know ees loco, but for me, being een Coburg ees eso hard. My heart, ees breaking, you know?\n@c0@"
  es: "@aSancho@bYa sé que nomás es una tontería, pero para mí es muy triste venir a Trastámara. Mi corazón se me rompe.\n@c0@"
  fr: "@aSancho@bJ-Je sais que c'est loco, mais pour moi, c'est dur d'être à Cobourg. J'ai le c-cœur brisé.\n@c0@"
  it: "@aSancho@bNo me gusta Coburg.\nCoburg me fa tornare en mente muchas cosas negativas...\n@c0@"
  ja: "@a@bサンチョ「頭では　わかっているのですが\n\t正直　ラインハットにいると\n\t胸が　はりさけそうになります……。\n@c0@"
8:
  de: "@aOtto@bIch habe mir sagen lassen, dass Ihr ein Freund der hiesigen Königsfamilie seid, %a000090.\n@c0@"
  en: "@aTuppence@bI understand that you're rather pally with the royal family here, %a000090.\n@c0@"
  es: "@aAlazar@bTengo entendido que sois bastante amigo de esta familia real, %a000090.\n@c0@"
  fr: "@aInnocent@bSi j'ai bien compris, vous êtes très copain avec la famille royale d'ici, %a000090.\n@c0@"
  it: "@aSimon@bMaestà, so che lei ha ottimi rapporti con la famiglia reale di Coburg, e in particolare con il principe Robert. È da molto che lo conosce, non è vero?\n@c0@"
  ja: "@a@bピピン「%a000090さまって\n\tラインハットの王族方とも\n\tご交友が　あるんですよね。\n@c0@"
9:
  de: "@aOtto@bIch bin hier als Soldat des Königreichs von Humburg. \n㈡\nIch werde mein Bestes tun, um meine Landsleute würdig zu vertreten und Euch keine Schande zu bereiten, Eure Majestät!\n@c0@"
  en: "@aTuppence@bI'm here as a soldier representing the Kingdom of Gotha. I'll do my best not to put you to shame, sir!\n@c0@"
  es: "@aAlazar@bYo he venido como soldado en representación del Reino de Pankraz. ¡Haré cuanto esté en mi mano para no avergonzaros, señor!\n@c0@"
  fr: "@aInnocent@bIci, je suis un soldat représentant le royaume de Gotha. Je vais faire de mon mieux pour ne pas vous faire honte, Sireⓠ\n@c0@"
  it: "@aSimon@bMaestà, sono spettinato?\r\nNon vorrei che la gente di Coburg pensasse che i prodi soldati di Denim sono persone trasandate...\n@c0@"
  ja: "@a@bピピン「ボクは　グランバニアの\n\t兵士代表ですね。　%a000090さまに\n\t恥をかかせないよう　がんばらなきゃ！\n@c0@"
10:
  de: "@aBianca@bSieht aus, als sei es in Tifortu recht friedlich zugegangen seit dem Zwischenfall vor ein paar Jahren. Ist das nicht schön, %a000090?\n@c0@"
  en: "@aBianca@bLooks like Coburg's bin pretty peaceful ever since that kerfuffle all them years ago. That must be a relief to you, eh?\n@c0@"
  es: "@aBianca@bParece que la paz ha reinado en Trastámara desde aquel follón de hace tantos años. Qué alivio para ti, ¿eh?\n@c0@"
  fr: "@aBianca@bOn dirait que Cobourg est plutôt calme depuis tout ce bazar, il y a quelques années. Ça doit être un soulagement pour toi, nonⓡ\n@c0@"
  it: "@aBianca@bPer fortuna Coburg è tornata florida, pacifica e tranquilla, dopo l'orribile periodo vissuto anni fa.\r\nBuon per Robert e per tutti gli abitanti del Regno!\n@c0@"
  ja: "@a@bビアンカ「ラインハットは　あれから\n\tずっと　平和だったみたいね。\n\t%a000090も　安心したでしょ？\n@c0@"
11:
  de: "@aNera@bPrinz Harry und König Wilbur scheinen hier ausgezeichnete Arbeit zu leisten. In Tifortu herrscht jetzt eine sehr warme, freundliche Stimmung.\n@c0@"
  en: "@aNera@bPrince Harry and King Wilbur seem to be doing an excellent job here. The place has a very warm feel to it now.\n@c0@"
  es: "@aNera@bParece que el príncipe Froilán y el rey Leonoro están haciendo un buen trabajo aquí. Este lugar tiene una atmósfera veramente cálida.\n@c0@"
  fr: "@aNera@bLe prince Harry et le roi Will semblent faire un très bon travail ici. Cet endroit est vraiment chaleureux, maintenant.\n@c0@"
  it: "@aNera@bSi respira un'atmosfera serena e tranquilla...\r\nRe Fabian e il principe Robert hanno saputo riportare pace e prosperità a Coburg.\n@c0@"
  ja: "@a@bフローラ「ヘンリーさんと　デール王が\n\tうまく　やってらっしゃるのね。\n\t国の　雰囲気が　あたたかいわ。\n@c0@"
12:
  de: "@a%0%a001240@bSie macht das ganz gut, die Leute in der Stadt so willkommen zu heißen.\n@c0@"
  en: "@a%0%a001240@bShe's pretty clever for a little girl, being able to introduce the place like that.\n@c0@"
  es: "@a%0%a001240@bQué niña más lista, nos ha dado la bienvenida muy bien.\n@c0@"
  fr: "@a%0%a001240@bElle est maligne, cette petite, pour être capable de nous accueillir comme ça.\n@c0@"
  it: "@a%0%a001240@bChe carina, quella bambina!\nEd è stata anche molto gentile a darci il benvenuto, no?\n@c0@"
  ja: "@a@b%a001240「あの子　ちいさいのに\n\t国の名前　ちゃんと言えるんだ。\n\tえらいね。\n@c0@"
13:
  de: "@a%0%a001240@bWir haben doch keine Betrüger unter uns... Du bist doch echt, oder, Papa?\n@c0@"
  en: "@a%0%a001240@bYou don't think we've got any impostors with us, do you? You're the real thing, aren't you, Dad?\n@c0@"
  es: "@a%0%a001240@bNo habrá impostores entre nosotros, ¿verdad? Tú eres de verdad, ¿no, papá?\n@c0@"
  fr: "@a%0%a001240@bIl n'y a pas d'imposteurs parmi nous, heinⓡ\nC'est bien toi, papaⓡ\n@c0@"
  it: "@a%0%a001240@bPapà, non ho capito bene...\nTu sei davvero il Re di Denim, oppure gli somigli solo?\n@c0@"
  ja: "@a@b%a001240「ねえねえ　ニセモノって\n\tボクたちにも　いるの？\n\t……お父さんは　本物だよね？\n@c0@"
14:
  de: "@aSancho@bAls du verschwunden bist, Chico, hat Señor Harry siss große Sorgen gemacht.\n@c0@"
  en: "@aSancho@bWhen you go missing, friend, I heard señor Harry, he was eso worried.\n@c0@"
  es: "@aSancho@bCuando te perdiste, chamaco, el señor Froilán se quedó retepreocupado.\n@c0@"
  fr: "@aSancho@bQuand t-tu as disparu, chico, il paraît que le\r\ns-s-señor Harry, il était v-vraiment inquiet.\n@c0@"
  it: "@aSancho@bChico, el señor principe Robert se preoccupò mucho por ti cuando esvanisti nel nullas...\n@c0@"
  ja: "@a@bサンチョ「%a000090王が　行方不明に\n\tなった時　ヘンリーさまは　たいそう\n\tご心配なさったと　聞いております。\n@c0@"
15:
  de: "@aSancho@bDu solltest ihm wirkliss buenos Días sagen gehen, Chico.\n@c0@"
  en: "@aSancho@bYou eshould go to esay buenos días to the señor, My Majesty.\n@c0@"
  es: "@aSancho@bDebería ir a saludar al señor, Majestad.\n@c0@"
  fr: "@aSancho@bT-Tu devrais aller dire buenos días au señor,\r\nMa M-Majesté.\n@c0@"
  it: "@aSancho@b¿Por qué no vai a salutarlo?\nSoy seguro que gli farebbe piacere rivederte...\n@c0@"
  ja: "@a@bサンチョ「坊っちゃん……　いえ\n\t%a000090王！　一度　きちんとお礼を\n\t申し上げては　いかがですか？\n@c0@"
16:
  de: "@aNera@bDie Soldaten von Humburg scheinen wirklich die halbe Welt nach uns abgesucht zu haben.\n@c0@"
  en: "@aNera@bThe soldiers of Gotha really did scour the world looking for us, didn't they?\n@c0@"
  es: "@aNera@bLos soldati di Pankraz no dejaron ni un rincón sin mirar cuando nos buscaban, ¿eh?\n@c0@"
  fr: "@aNera@bLes soldats de Gotha ont vraiment remué ciel et terre pour nous retrouver, n'est-ce pasⓡ\n@c0@"
  it: "@aNera@bI soldati di Denim girarono tutto il mondo per trovarci, non è vero?\n@c0@"
  ja: "@a@bフローラ「グランバニアの兵士さんたち\n\t私たちのことを　本当に　世界中\n\t探しまわってくださったのね……。\n@c0@"
17:
  de: "@aBianca@bPrinz Kendrick? Ob das wohl ein Sohn von Harry ist?\n@c0@"
  en: "@aBianca@bPrince Kendrick? You dun't think that could be Harry's son, do you?\n@c0@"
  es: "@aBianca@b¿El príncipe Santos? ¿Crees que será el hijo de Froilán?\n@c0@"
  fr: "@aBianca@bLe prince Rodéricⓡ Tu crois qu'il s'agit du fils de Harryⓡ\n@c0@"
  it: "@aBianca@bIl principino Emilian?!\nNon sarà mica il figlio di Robert...?\n@c0@"
  ja: "@a@bビアンカ「コリンズ王子って？\n\tそれって　もしかして\n\tヘンリーさんの　子供かしら。\n@c0@"
18:
  de: "@aNera@bVielleicht ist der Prinz, von dem er da geredet hat, ja Harrys Sohn. Das müssen wir unbedingt herausfinden!\n@c0@"
  en: "@aNera@bI wonder if the prince he was talking about could be Harry's son. We'll have to go and find out!\n@c0@"
  es: "@aNera@bMe pregunto si el príncipe del que hablaba podría ser il figlio de Froilán. ¡Tendremos que descubrirlo!\n@c0@"
  fr: "@aNera@bJe me demande si le prince dont il parlait ne serait pas le fils de Harry. Il faut en avoir le cœur netⓠ\n@c0@"
  it: "@aNera@bChissà se questo Emilian è il figlio di Robert...\nSono proprio curiosa di scoprirlo!\n@c0@"
  ja: "@a@bフローラ「王子って　もしかして\n\tヘンリーさんの子供かしら？\n\tともかく　お会いするのが楽しみね。\n@c0@"
19:
  de: "@a%0%a001240@bIch bin immer brav. Bei mir braucht sich niemand Sorgen zu machen, wenn ich mal König bin!\n@c0@"
  en: "@a%0%a001240@bI'm always good, so no one would have to worry if I became king!\n@c0@"
  es: "@a%0%a001240@b¡Yo siempre soy bueno, así que no hay por qué preocuparse si me convierto en rey!\n@c0@"
  fr: "@a%0%a001240@bMoi, je suis toujours gentil, alors personne n'aurait de souci à se faire si je devais devenir roiⓠ\n@c0@"
  it: "@a%0%a001240@bPapà, posso fare anch'io qualche marachella ogni tanto?\n\n@c0@"
  ja: "@a@b%a001240「ボクは　いい子だから\n\tいつでも　王さまになれるよね！\n@c0@"
20:
  de: "@a%0%a001250@bIch mag keine unartigen Jungen. Sie sammeln Insekten und so was und bewerfen einen damit. Das ist ekelhaft!\n@c0@"
  en: "@a%0%a001250@bI don't like rough boys. They pick up insects and things and throw them at you. It's disgusting!\n@c0@"
  es: "@a%0%a001250@bNo me gustan los niños traviesos. Siempre te tiran insectos y cosas que encuentran por ahí. ¡Qué asco!\n@c0@"
  fr: "@a%0%a001250@bJe n'aime pas les méchants garçons. Ils ramassent des insectes et d'autres trucs pour les lancer sur les autres. C'est dégoûtantⓠ\n@c0@"
  it: "@a%0%a001250@bNon mi piacciono i bambini che fanno i dispetti!\nSoprattutto quelli che li fanno a ME!\n@c0@"
  ja: "@a@b%a001250「らんぼうな男の子は　キライ。\n\tへいきで　虫とかつまんで\n\t投げてくるのよ。　信じられないっ！\n@c0@"
21:
  de: "@aSancho@bWeißt du, iss habe gehört, dass diese Kendrick der selbe kleine Diablo ist wie seine Padre, Señor Harry, in dem Alter.\n@c0@"
  en: "@aSancho@bYou know, I heard the rumours that thees Kendrick, he ees the leettle diablo, just like hees father, señor Harry, was when he was young.\n@c0@"
  es: "@aSancho@bSabes, chamaco, oí rumores de que ese Santos es un puro diabloⓓ igualito que su padre, el señor Froilán, cuando era niño.\n@c0@"
  fr: "@aSancho@bIl p-paraît que ce Rodéric est oun pequeño diablo, un peu comme son padre, le señor Harry, quand il avait son âge.\n@c0@"
  it: "@aSancho@b¡Ho saputo que el principino Emilian es soprannominatos ⓕel diablitoⓖ! Pare que sia más dispettosos de suo padre Robert...\n@c0@"
  ja: "@a@bサンチョ「うわさでは　コリンズ王子は\n\tヘンリーさまの　子供の頃に\n\tそっくり　だそうですが……。\n@c0@"
22:
  de: "@aBianca@bHuch. Solchen Typen scheinen wir aber auch überall zu begegnen, was?\n@c0@"
  en: "@aBianca@bHuh. We seem to come across types like that all over the place, eh?\n@c0@"
  es: "@aBianca@bMmm. Parece que hay gente así por todas partes, ¿eh?\n@c0@"
  fr: "@aBianca@bPfff, j'ai l'impression qu'on rencontre ce genre de types où qu'on aille.\n@c0@"
  it: "@aBianca@bCerto che ce n'è di gentaglia in giro, eh?\nPer fortuna sappiamo come trattare certi tipi!\n@c0@"
  ja: "@a@bビアンカ「……ふう。\n\tあんなヤツって　どこにでも\n\tいるものね。\n@c0@"
23:
  de: "@aNera@bEs schickt sich nicht, anderer Leute Dinge zu stehlen, egal unter welchen Umständen.\n@c0@"
  en: "@aNera@bIt's wrong to steal things from people, no matter what the circumstances.\n@c0@"
  es: "@aNera@bNo está bien robar a nessuno, en cualquier circunstancia.\n@c0@"
  fr: "@aNera@bCe n'est pas bien de voler... quelles que soient les circonstances.\n@c0@"
  it: "@aNera@bRubare è peccato!\n@c0@"
  ja: "@a@bフローラ「人の物を　盗むなんて……。\n\tたとえ　どんな事情があっても\n\tしてはいけないことですわ。\n@c0@"
24:
  de: "@aNera@bStell dir doch nur mal vor, uns würde etwas Wertvolles abhanden kommen!\n@c0@"
  en: "@aNera@bImagine how upsetting it must be to find something you hold dear has gone missing.\n@c0@"
  es: "@aNera@bImagínate el disgusto cuando descubres que ya no tienes un oggetto querido.\n@c0@"
  fr: "@aNera@bImagine ce que ça doit être désagréable de t'apercevoir que quelque chose auquel tu tiens\r\na disparu.\n@c0@"
  it: "@aNera@bChi prende ciò che non gli appartiene è un ladro e dovrebbe finire in galera!\n@c0@"
  ja: "@a@bフローラ「盗まれた方が　どんなに\n\t心を　傷められるか……。\n@c0@"
25:
  de: "@aNera@bOje, da fällt mir ein, dass wir ja auch immer in fremden Schränken wühlen und uns nichts dabei denken! So hatte ich das noch gar nicht gesehen!\n@c0@"
  en: "@aNera@bOh dear! I've just remembered that we're always rummaging through people's cupboards! I hadn't thought about it like that before.\n@c0@"
  es: "@aNera@b¡Diosa mía! ¡Acabo de recordar que nosotros siempre estamos registrando los armarios de la gente!\nNunca lo había pensado.\n@c0@"
  fr: "@aNera@bPar la Déesseⓠ Je viens de me rendre compte que nous-mêmes, nous n'arrêtons pas de fouiller dans les affaires des gens.\n㈡\nJe n'avais jamais vu ça sous cet angle, auparavant.\n@c0@"
  it: "@aNera@bMi viene in mente una ⓕcertaⓖ persona che fruga sempre nelle case altrui per trovare qualcosa di utile... Ehm, ti fischiano le orecchie, tesoro?\n@c0@"
  ja: "@a@bフローラ「あっ！　そういえば\n\t私たち　勝手にタンスを開けたり\n\tしてましたわね。　どうしましょうっ！\n@c0@"
26:
  de: "@a%0%a001240@bHey! Er ist weg! Aber ich bezweifle, dass er noch mal etwas anstellt. Nicht nach der Lektion, die wir ihm erteilt haben.\n@c0@"
  en: "@a%0%a001240@bHey! He disappeared! I doubt he'll get up to no good again, though. Not after we taught him a lesson.\n@c0@"
  es: "@a%0%a001240@b¡Eh! ¡Ha desaparecido! Pero no creo que vuelva a las andadas después de la lección que le hemos dado.\n@c0@"
  fr: "@a%0%a001240@bHéⓠ Il a disparuⓠ Remarque, ça m'étonnerait qu'il recommence, après la leçon qu'on vient de lui donner.\n@c0@"
