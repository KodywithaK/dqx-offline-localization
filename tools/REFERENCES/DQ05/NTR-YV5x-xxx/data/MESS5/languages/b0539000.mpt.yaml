  it: "@aSancho@bEl complotto della falsa Reina Madre deve avere lasciato un segno indelebiles nell'animo de rey Fabian...\n@c0@"
  ja: "@a@bサンチョ「デール王は\n\tよほど　ニセ太后さまの事件を\n\t気になさっている　ようですね。\n@c0@"
70:
  de: "@aSancho@bEr ist jung, aber eine sehr vorsisstige Hombre.\n@c0@"
  en: "@aSancho@bHe ees young, but he ees a very careful man.\n@c0@"
  es: "@aSancho@bEs un hombre joven, pero va con mucho cuidado.\n@c0@"
  fr: "@aSancho@bIl est j-jeune, mais c'est oun hombre très prudent.\n@c0@"
  it: "@aSancho@bEntiendo por qué abbia voluto prendere una decisión tanto dolorosa.\nRey Fabian es un hombre muy saggio.\n@c0@"
  ja: "@a@bサンチョ「お若いのに　ずいぶん\n\t細やかな　心配りをされる。\n@c0@"
71:
  de: "@aBianca@bHm, wenn der Thron so hoch ist, sieht er ganz schön wichtig aus, was?\n@c0@"
