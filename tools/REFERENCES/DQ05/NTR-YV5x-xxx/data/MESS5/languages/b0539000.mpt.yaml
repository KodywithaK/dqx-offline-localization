  ja: "@a@bサンチョ「てっきり　私は\n\tヘンリーさまが　王になるものと\n\t思っておりました。\n@c0@"
75:
  de: "@aSancho@bAber er ist nisst gierig, no? In diese Hinsisst er ist ein wenig wie du, Chico.\n@c0@"
  en: "@aSancho@bBut he ees no greedy, eh?\nHe ees like you een thees way, sí, friend?\n@c0@"
