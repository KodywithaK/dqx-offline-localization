  es: "@aSancho@b¡Ay chihuahua!, el señor Froilán se ha convertido en un hombretón bien fuertote.\n@c0@"
  fr: "@aSancho@bSi, le s-señor Harry, il est devenu oun hombre fort.\n@c0@"
