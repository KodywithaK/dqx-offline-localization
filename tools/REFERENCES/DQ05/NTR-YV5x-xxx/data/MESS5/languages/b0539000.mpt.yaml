  ja: "@a@bフローラ「%a001240たちを　ずっと\n\t私たちが　育ててたら　%a001240も\n\tそんなこと　したのかしら……。\n@c0@"
55:
  de: "@a%0%a001240@bMäuse? Vielleicht sollte ich das auch mal versuchen...\nHm? Ach nichts, gar nichts.\n@c0@"
