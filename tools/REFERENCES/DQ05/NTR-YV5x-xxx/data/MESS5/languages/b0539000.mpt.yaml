  it: "@aSancho@b¡Pssst! ¡Chico!\n¡Ehi, chico!\n¡Girate versos de mi!\n@c0@"
  ja: "@a@bサンチョ「%a000090王　ちょっと\n\tこっちを向いてください。\n\t……うん　よし！\n@c0@"
78:
