  fr: "@aNera@bC'est une intention très noble, mais c'est plutôt triste. Tu ne trouves pasⓡ\n@c0@"
  it: "@aNera@bCapisco che abbia deciso così per il bene del Regno di Coburg, ma non condivido la sua scelta.\n㈡\nSposarsi e avere figli è una gioia immensa, alla quale re Fabian non avrebbe dovuto rinunciare.\n@c0@"
  ja: "@a@bフローラ「りっぱな　考えですけど\n\tさみしいですわね。\n@c0@"
66:
  de: "@aNera@bIm Grunde genommen verzichtet er damit auf sein persönliches Glück ⓚⓛ und das alles zum Wohl des Königreichs.\n@c0@"
  en: "@aNera@bHe's basically saying that he'll give up the idea of sharing his life with a woman he loves for the sake of his kingdom.\n@c0@"
