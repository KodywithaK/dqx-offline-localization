  en: "@aSancho@bNow you have no hair een the wrong place, and your clothes, I check they are ironed okay.\r\nEes okay for you to esay hola to the King now.\n@c0@"
  es: "@aSancho@bYa pues vas bien peinado, y tu ropa está en su sitio.\nYa puedes saludar al Rey.\n@c0@"
