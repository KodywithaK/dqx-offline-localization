  ja: "@a@bサンチョ「こりゃ　ひどい！\n\tコリンズ王子の　１メートル以内に\n\t近づいちゃ　いけませんよ！\n@c0@"
62:
  de: "@a%0%a001250@bPuh! Solch eine Beule hab ich ja noch nie gesehen!\n@c0@"
