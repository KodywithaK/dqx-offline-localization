  fr: "@aSancho@bS-Si le fils d'un ami du señor Petros, il disparaît, le señor P-Petros, il fait tout pour le r-retrouver.\n@c0@"
  it: "@aSancho@bEl señor Russel se sentì onorato cuando rey Michel gli chiese de badare al piccolo Robert...\n@c0@"
  ja: "@a@bサンチョ「その方の　息子さんが\n\t行方不明になれば　どんな遠くからでも\n\tパパスさまは　かけつけたでしょう。\n@c0@"
204:
  de: "@aSancho@bUnd... Und wenn Señor Ludwig damals nisst nach Tifortu gerufen worden wäre, dann er wäre nisst... er... (Schluchz)\n@c0@"
  en: "@aSancho@bEso you esee... Eef only señor Pankraz, he was no esummoned to Coburg that time, he would\r\nno be... He would no be... (sob)\n@c0@"
  es: "@aSancho@bAsí que, si no hubiesen llamado al señor Teudis aquella vez, el no estaría... No estaría... (snif)\n@c0@"
  fr: "@aSancho@bEt t-tu vois... si le señor Petros, il n'avait pas été convoqué à C-Cobourg à l'époque, il ne serait pas...\r\nil ne serait p-pas... (sanglot)\n@c0@"
  it: "@aSancho@bPerò, si el señor Russel no avesse ricevuto quell'incarico, forse oggi...\r\nYo... Yo me commuovos... ¡Sob!\n@c0@"
  ja: "@a@bサンチョ「ですから　あの時\n\tラインハットへ呼ばれていなくても\n\tきっと　パパスさまは…　うっうっ……。\n@c0@"
205:
  de: "@a%0%a001240@bWas war denn das Souvenir von deiner Hochzeit, Papa?\n@c0@"
  en: "@a%0%a001240@bWhat was the souvenir from your wedding, Dad?\n@c0@"
  es: "@a%0%a001240@b¿Qué recuerdo diste el día de tu boda, papá?\n@c0@"
  fr: "@a%0%a001240@bC'était quoi le souvenir de votre mariage, papaⓡ\n@c0@"
  it: "@a%0%a001240@bPapà, che bomboniera sceglieste per il vostro matrimonio tu e la mamma?\n@c0@"
  ja: "@a@b%a001240「ねえ　お父さんたちの\n\t結婚式の記念品って　なんだったの？\n@c0@"
206:
  de: "@a%0%a001240@bBrötchen?! Wie, Brötchen?! Das ist ja langweilig!\n@c0@"
