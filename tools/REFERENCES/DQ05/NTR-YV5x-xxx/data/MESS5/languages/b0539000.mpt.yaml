  ja: "@a@b%a001250「ネズミさん　かわいいのに…\n\tきらい　なんて言ったら　かわいそう。\n@c0@"
57:
  de: "@a%0%a001240@bWas für ein lustiger Name. Hört sich auf jeden Fall sehr schlau an.\n@c0@"
  en: "@a%0%a001240@bWhat a funny name he has. He sounds very clever.\n@c0@"
