77:
  de: "@aSancho@bKomm, Chico. Sieh miss mal an.\nSi... si...\n@c0@"
  en: "@aSancho@bCome, friend. Look at me.\r\nSí...sí...\r\nOkay!\n@c0@"
  es: "@aSancho@bVen, chamaco. Mírame. Sí... sí...\n¡Órale!\n@c0@"
