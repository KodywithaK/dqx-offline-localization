  ja: "@a@b%a001240「玉座って　フカフカで\n\tとっても　きもちいいんだ。\n@c0@"
73:
  de: "@a%0%a001240@bOnkel Bastl hat uns manchmal auf dem Thron in Humburg sitzen lassen.\n@c0@"
  en: "@a%0%a001240@bBertie used to let us sit on his every now and then.\n@c0@"
