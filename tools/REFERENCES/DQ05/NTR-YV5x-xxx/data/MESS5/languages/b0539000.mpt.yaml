  ja: "@a@b%a001240「オジロンおじさんが\n\tときどき　ボクたちを\n\t座らせてくれるんだよ。\n@c0@"
74:
  de: "@aSancho@bWeißt du, iss glaube fest daran, dass Señor Harry eines Tages König wird.\n@c0@"
