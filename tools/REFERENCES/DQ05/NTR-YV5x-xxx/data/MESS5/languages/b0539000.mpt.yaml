  ja: "@a@bビアンカ「……うんうん。\n\t玉座は　ちょっと高いところにあると\n\tずいぶん　りっぱに見えるわね。\n@c0@"
72:
  de: "@a%0%a001240@bThrone sind sehr weich und bequem.\n@c0@"
