  ja: "@a@bフローラ「国のために\n\t一生　愛する女性をつくらずに\n\t生きるということですものね……。\n@c0@"
67:
  de: "@a%0%a001240@bWarum sollte eine Heirat zu einem Malheur führen? Ist eine Hochzeit denn etwas Schlimmes?\n@c0@"
