  ja: "@a@b%a001240「おもしろい名前だね。\n\t魔物みたい。　そう思わない？\n@c0@"
58:
  de: "@aSancho@bDiese Wissenschaftler und Wahrsager sind doch alle gleiss. Sie reden und reden und reden, no? Madre mía!\n@c0@"
