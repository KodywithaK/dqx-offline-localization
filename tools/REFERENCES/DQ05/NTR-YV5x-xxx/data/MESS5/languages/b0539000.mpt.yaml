  it: "@aBianca@bIl principino Emilian mette topi in testa alla gente?!\r\nSe ci prova con me, glieli faccio mangiare tutti interi, coda e baffi compresi!\n@c0@"
  ja: "@a@bビアンカ「頭にネズミとは\n\tなかなか　ようしゃのない\n\tお子さんね。　ほほほ。\n@c0@"
54:
  de: "@aNera@bIch frage mich, ob %a001240 und %a001250 auch solchen Schabernack treiben würden, wenn wir beide immer da gewesen wären.\n@c0@"
  en: "@aNera@bI wonder if %a001240 and %a001250 would've done things like that if we'd brought them up all their lives.\n@c0@"
  es: "@aNera@bMe pregunto si %a001240 y %a001250 harían cosas così si los hubiésemos criado nosotros tutta la sua vita.\n@c0@"
