  en: "@a%0%a001240@bMaybe Kendrick doesn't have many friends. I haven't seen any other boys inside the castle.\n@c0@"
  es: "@a%0%a001240@bA lo mejor Santos no tiene muchos amigos. No he visto a ningún otro niño en el castillo.\n@c0@"
  fr: "@a%0%a001240@bPeut-être que Rodéric n'a pas beaucoup de copains. Je n'ai pas vu d'autres garçons dans le château.\n@c0@"
  it: "@a%0%a001240@bCredo che Emilian si comporti così perché non ha nessuno con cui giocare...\nSe non sbaglio, è l'unico bambino in tutto il castello.\n@c0@"
  ja: "@a@b%a001240「コリンズくんって\n\tあんまり　友だちがいないのかな？\n\tお城にも　男の子はいないし……。\n@c0@"
137:
  de: "@a%0%a001240@bVielleicht sollte ich mich mit ihm anfreunden. Obwohl ich ihn nicht besonders mag...\n@c0@"
  en: "@a%0%a001240@bMaybe I should be Kendrick's friend. I don't like him all that much, though.\n@c0@"
  es: "@a%0%a001240@bA lo mejor debería hacerme amigo de Santos. Aunque no me cae muy bien, la verdad.\n@c0@"
  fr: "@a%0%a001240@bJe devrais peut-être devenir copain avec Rodéric. En même temps, je ne l'aime pas trop.\n@c0@"
  it: "@a%0%a001240@bForse potrei provare a diventare amico di Emilian...\nPerò non mi sta molto simpatico.\nIl suo modo di comportarsi non mi piace per niente!\n@c0@"
  ja: "@a@b%a001240「ボク　コリンズくんの\n\t友だちになって　あげようかなあ。\n\tホントは　ちょっと　苦手なんだけど。\n@c0@"
138:
  de: "@a%0%a001250@bUnsere Burg in Humburg ist viel schöner als dieses Schloss...\n@c0@"
  en: "@a%0%a001250@bI much prefer our castle in Gotha to this one.\n@c0@"
  es: "@a%0%a001250@bPrefiero mil veces nuestro castillo de Pankraz a este.\n@c0@"
  fr: "@a%0%a001250@bJe préfère de loin notre château à Gotha.\n@c0@"
  it: "@a%0%a001250@bIl Castello di Denim è molto più bello di questo qui!\n@c0@"
  ja: "@a@b%a001250「わたしは　やっぱり\n\tグランバニアのお城のほうが\n\tずっと　好き。\n@c0@"
139:
  de: "@aSancho@bHah... Iss fühle miss immer so müde, wenn iss in diese Castillo bin.\n@c0@"
  en: "@aSancho@bHahh... Just being here een thees castle, eet makes me eso tired.\n@c0@"
  es: "@aSancho@b¡Híjole! Con solo estar en este castillo me siento cansado.\n@c0@"
  fr: "@aSancho@bAaah... Le simple f-fait d'être ici dans ce c-c-castel me fatigue.\n@c0@"
  it: "@aSancho@bEsto castillo me mette addossos un'ansia incredibile...\n@c0@"
  ja: "@a@bサンチョ「なんだか　このお城にいるって\n\tいうだけで　つかれますね。\n\tはぁ………。\n@c0@"
140:
  de: "@aOtto@bDas Volk von Tifortu beobachtet mich. Ich muss mein Bestes geben, schließlich geht es um die Ehre der Soldaten von Humburg!\n@c0@"
  en: "@aTuppence@bThe people of Coburg are observing me. I must perform well, for the honour of the soldiers of Gotha is in my hands!\n@c0@"
  es: "@aAlazar@bEl pueblo de Trastámara me observa. ¡Debo hacerlo bien! ¡El honor de los soldados de Pankraz está en mis manos!\n@c0@"
  fr: "@aInnocent@bLes habitants de Cobourg m'observent. Je dois faire attention. L'honneur des soldats de Gotha est entre mes mains.\n@c0@"
  it: "@aSimon@bLa gente di Coburg mi osserva con curiosità e interesse. Scommetto che da queste parti non si era mai visto un soldato più forte, bello, coraggioso...\n㈡\nE modesto.\n@c0@"
  ja: "@a@bピピン「この国の人たちが\n\tボクを見ている…　グランバニア兵士\n\t代表として　しゃんとしなくちゃ！\n@c0@"
141:
  de: "@a%0%a001240@bIch weiß alles über Tifortu! Tifortu und Humburg waren immer gut befreundet, stimmt's?\n@c0@"
  en: "@a%0%a001240@bI know about Coburg! Coburg and Gotha have always been good friends, haven't they?\n@c0@"
  es: "@a%0%a001240@b¡Yo sé cosas de Trastámara! Trastámara y Pankraz siempre han tenido una buena relación, ¿a que sí?\n@c0@"
  fr: "@a%0%a001240@bTu m'as déjà parlé de Cobourgⓠ Cobourg et Gotha ont toujours été bons amis, pas vraiⓡ\n@c0@"
  it: "@a%0%a001240@bHo già sentito parlare di Coburg!\nSe non sbaglio, il Regno di Denim e quello di Coburg sono alleati, esatto?\n@c0@"
  ja: "@a@b%a001240「ボク　知ってるよ！\n\tラインハットと　グランバニアは\n\t仲よしの国なんだよね。\n@c0@"
142:
  de: "@a%0%a001240@bIch mag Tifortu. Dir gefällt es doch auch hier, oder, Papa?\n@c0@"
  en: "@a%0%a001240@bI like this place. You like it too, right, Dad?\n@c0@"
  es: "@a%0%a001240@bMe gusta este sitio. A ti también, ¿verdad, papá?\n@c0@"
  fr: "@a%0%a001240@bJ'aime bien cet endroit. Toi aussi, papaⓡ\n@c0@"
  it: "@a%0%a001240@bPapà, ti piace questo posto?\nSecondo me è fantastico!\n@c0@"
  ja: "@a@b%a001240「ボク　この国のこと　好きだよ。\n\tお父さんも　そうでしょ？\n@c0@"
143:
  de: "@a%0%a001250@bSancho hatte nie Lust, nach Tifortu zu reisen.\n@c0@"
  en: "@a%0%a001250@bUm, Sancho always says he doesn't much fancy the idea of visiting Coburg.\n@c0@"
  es: "@a%0%a001250@bSancho siempre dice que no le atrae la idea de visitar Trastámara.\n@c0@"
  fr: "@a%0%a001250@bMmm, Sancho dit toujours qu'il n'aime pas trop l'idée d'aller à Cobourg.\n@c0@"
  it: "@a%0%a001250@bLo zio Sancho diceva sempre che l'idea di andare a Coburg non lo allettava.\n@c0@"
  ja: "@a@b%a001250「あのね　サンチョね…\n\tラインハットに来るの\n\tあんまり　好きじゃないって……。\n@c0@"
144:
  de: "@a%0%a001250@bEs ist das einzige Schloss, das wir nicht gesehen haben, als wir mit ihm unterwegs waren.\n@c0@"
  en: "@a%0%a001250@bThis is the one castle we didn't visit when we were travelling around with him.\n@c0@"
  es: "@a%0%a001250@bEs el único castillo que no visitamos cuando viajábamos con él.\n@c0@"
  fr: "@a%0%a001250@bC'est le seul château qu'on n'ait pas visité pendant notre périple avec lui.\n@c0@"
  it: "@a%0%a001250@bCredo che Coburg non gli piaccia affatto...\n@c0@"
  ja: "@a@b%a001250「みんなで　旅してたときも\n\tわたしたち　このお城だけ\n\t来たこと　なかったの。\n@c0@"
145:
  de: "@a%0%a001250@bDas ist ein wirklich großes Schloss, nicht? Komisch, dass die Leute aus der Stadt nicht auch im Schloss wohnen wie bei uns in Humburg...\n@c0@"
  en: "@a%0%a001250@bIt's a really big castle, isn't it? You'd think they'd let the townspeople live inside like we do in Gotha.\n@c0@"
  es: "@a%0%a001250@bQué castillo más grande, ¿verdad? Es raro que no dejen a la gente vivir en él, como en Pankraz.\n@c0@"
  fr: "@a%0%a001250@bC'est vraiment un grand château. On pourrait s'attendre à ce que les habitants vivent à l'intérieur, comme à Gotha.\n@c0@"
  it: "@a%0%a001250@bIl castello è grande, però pensavo che dentro ci vivesse tanta gente, come da noi a Denim...\n@c0@"
  ja: "@a@b%a001250「大きなお城ね。\n\t町の人たちも　グランバニアみたいに\n\t中に入れてあげればいいのに。\n@c0@"
146:
  de: "@aSancho@bDu bist froh, wieder in Tifortu zu sein, si, Chico?\n@c0@"
  en: "@aSancho@bYou feel only the nostalgia for Coburg,\r\nsí, friend?\n@c0@"
  es: "@aSancho@bEchas de menos Trastámara, ¿verdad, chamaco?\n@c0@"
  fr: "@aSancho@bTu dois sans doute ressentir de la\nn-n-nostalgie à C-Cobourg, no, chicoⓡ\n@c0@"
  it: "@aSancho@bChico, pienso que a ti no te dispiaccia tornare a Coburg...\n@c0@"
  ja: "@a@bサンチョ「坊っちゃんは　もう\n\tこの　ラインハットの国に　対しては\n\tなつかしさしか感じないでしょう……？\n@c0@"
147:
  de: "@aSancho@bAber deine Onkel Sancho... no...\n@c0@"
  en: "@aSancho@bBut for your Uncle Sancho ees, ees...\n@c0@"
  es: "@aSancho@bPero para tu tito Sancho es... es...\n@c0@"
  fr: "@aSancho@bMais p-pour tonton Sancho, c'est...\n@c0@"
  it: "@aSancho@bLo zio Sancho, inveces, qui ha muchos recuerdos bruttos...\nYo... Yo me commuovos... ¡Sob!\n@c0@"
  ja: "@a@bサンチョ「でも　私は…　私は………。\n@c0@"
148:
  de: "@aSancho@bIss weiß, es ist loco, aber es ist sehr schwer für miss, in Tifortu zu sein. Meine Herz brisst dann, verstehst du?\n@c0@"
  en: "@aSancho@bI know ees loco, but for me, being een Coburg ees eso hard. My heart, ees breaking, you know?\n@c0@"
  es: "@aSancho@bYa sé que nomás es una tontería, pero para mí es muy triste venir a Trastámara. Mi corazón se me rompe.\n@c0@"
  fr: "@aSancho@bJ-Je sais que c'est loco, mais pour moi, c'est dur d'être à Cobourg. J'ai le c-cœur brisé.\n@c0@"
  it: "@aSancho@bNo me gusta Coburg.\nCoburg me fa tornare en mente muchas cosas negativas...\n@c0@"
  ja: "@a@bサンチョ「頭では　わかっているのですが\n\t正直　ラインハットにいると\n\t胸が　はりさけそうになります……。\n@c0@"
149:
  de: "@aOtto@bIch habe mir sagen lassen, dass Ihr ein Freund der hiesigen Königsfamilie seid, %a000090.\n@c0@"
  en: "@aTuppence@bI understand that you're rather pally with the royal family here, %a000090.\n@c0@"
  es: "@aAlazar@bTengo entendido que sois bastante amigo de esta familia real, %a000090.\n@c0@"
  fr: "@aInnocent@bSi j'ai bien compris, vous êtes très copain avec la famille royale d'ici, %a000090.\n@c0@"
  it: "@aSimon@bMaestà, so che lei ha ottimi rapporti con la famiglia reale di Coburg, e in particolare con il principe Robert. È da molto che lo conosce, non è vero?\n@c0@"
  ja: "@a@bピピン「%a000090さまって\n\tラインハットの王族方とも\n\tご交友が　あるんですよね。\n@c0@"
150:
  de: "@aOtto@bIch bin hier als Soldat des Königreichs von Humburg. \n㈡\nIch werde mein Bestes tun, um meine Landsleute würdig zu vertreten und Euch keine Schande zu bereiten, Eure Majestät!\n@c0@"
  en: "@aTuppence@bI'm here as a soldier representing the Kingdom of Gotha. I'll do my best not to put you to shame, sir!\n@c0@"
  es: "@aAlazar@bYo he venido como soldado en representación del Reino de Pankraz. ¡Haré cuanto esté en mi mano para no avergonzaros, señor!\n@c0@"
  fr: "@aInnocent@bIci, je suis un soldat représentant le royaume de Gotha. Je vais faire de mon mieux pour ne pas vous faire honte, Sireⓠ\n@c0@"
  it: "@aSimon@bMaestà, sono spettinato?\r\nNon vorrei che la gente di Coburg pensasse che i prodi soldati di Denim sono persone trasandate...\n@c0@"
  ja: "@a@bピピン「ボクは　グランバニアの\n\t兵士代表ですね。　%a000090さまに\n\t恥をかかせないよう　がんばらなきゃ！\n@c0@"
151:
  de: "@aBianca@bIch denke, er wird noch in die Rolle reinwachsen. Harry ist ja auch ganz anders als früher, nicht wahr?\n@c0@"
  en: "@aBianca@bI'm sure it'll all be okay. Harry's a lot different to how he used to be, after all, eh?\n@c0@"
  es: "@aBianca@bSeguro que todo irá bien. Froilán ha cambiado mucho, ya no es como era antes, ¿eh?\n@c0@"
  fr: "@aBianca@bJe suis sûre que tout ira bien. Harry a bien changé, après tout, pas vraiⓡ\n@c0@"
  it: "@aBianca@bNon credo che dovrebbe preoccuparsi tanto, sai?\nÈ normale che i bambini siano vivaci e facciano qualche birichinata...\n㈡\nMi hai detto che anche Robert era un ragazzino vispo, poi è cresciuto e ha messo giudizio.\n@c0@"
  ja: "@a@bビアンカ「でも　ヘンリー王子も\n\t昔とは　ずいぶん変わったそうだし\n\t大丈夫なんじゃないかしら？\n@c0@"
152:
  de: "@aNera@bHm. Ich denke, dass Harry sich nur deshalb so gut entwickelt hat, weil er einiges durchmachen musste.\n@c0@"
  en: "@aNera@bYes. I suppose Harry only changed for the better because of everything he went through.\n@c0@"
  es: "@aNera@bSí. Supongo que tutto lo que ha tenido que sufrir Froilán lo ha hecho mejor persona, veramente.\n@c0@"
  fr: "@aNera@bJe suppose que si Harry a changé, c'est à cause de toutes les épreuves qu'il a traversées.\n@c0@"
  it: "@aNera@bPenso che Robert sia maturato parecchio anche in seguito alle esperienze negative che ha vissuto.\n@c0@"
  ja: "@a@bフローラ「そうよね……\n\tヘンリーさんが　変わったのは\n\tものすごい　苦労なさったからだし……\n@c0@"
153:
  de: "@aNera@bVielleicht käme Kendrick ja auch zur Besinnung, wenn er eine ähnliche Erfahrung machen würde.\n㈡\nAber so etwas wünscht man nicht mal seinem ärgsten Feind, geschweige denn einem kleinen Jungen.\n@c0@"
  en: "@aNera@bMaybe Kendrick would turn over a new leaf if he had the same kind of experience, but that seems a terrible thing to wish on the boy.\n@c0@"
  es: "@aNera@bQuizá Santos también dejaría de ser como es si viviese las mismas experiencias, pero es cruel desearle una cosa così a un bambino.\n@c0@"
  fr: "@aNera@bPeut-être que Rodéric changerait aussi s'il devait vivre la même chose que son père, mais on ne peut décemment pas le lui souhaiter.\n@c0@"
  it: "@aNera@bPrima o poi anche Emilian saprà mettere a freno la sua estrema vivacità, ma gli auguro di riuscirci senza dover soffrire ciò che ha patito suo padre...\n@c0@"
  ja: "@a@bフローラ「コリンズ王子も　ヘンリーさんと\n\t同じ苦労をすれば　変わると思うけど\n\tそれは　かわいそうですわよね。\n@c0@"
154:
  de: "@a%0%a001240@bWird er wirklich einmal König? Das kann ich mir gar nicht vorstellen.\n@c0@"
  en: "@a%0%a001240@bIs he really going to be king? He doesn't seem like he's cut out for it.\n@c0@"
  es: "@a%0%a001240@b¿De verdad va a ser rey? No parece que tenga mucha madera para ello.\n@c0@"
  fr: "@a%0%a001240@bIl va vraiment être roiⓡ Je n'ai pas l'impression qu'il soit fait pour ça.\n@c0@"
  it: "@a%0%a001240@bDavvero Emilian diventerà Re di Coburg?!\nPoveri i suoi sudditi... Non li invidio proprio.\n@c0@"
  ja: "@a@b%a001240「あの子　王さまになるの？\n\t向いてないんじゃないかなあ。\n@c0@"
155:
  de: "@a%0%a001250@bUrgh! Dieser ungezogene Kerl soll mal ein Königreich regieren?! Wahrscheinlich wird er versuchen, jeden einzelnen zu seinem ⓞLakaienⓟ zu machen!\n@c0@"
  en: "@a%0%a001250@bUrgh! Can you imagine that little brat ruling a kingdom!? He'd probably try to turn everyone\ninto his ⓗlackeysⓘ!\n@c0@"
  es: "@a%0%a001250@b¡Agh! ¡¿Te imaginas a ese mocoso dirigiendo un reino?! ¡Seguro que intentaría convertir a todos en sus ⓕlacayosⓖ!\n@c0@"
  fr: "@a%0%a001250@bArghⓠ Tu imagines ce petit morveux diriger un royaumeⓠⓑ Je suis sûre qu'il essaierait de forcer tout le monde à devenir ses ⓥlaquaisⓦⓠ\n@c0@"
  it: "@a%0%a001250@bⓕRe Emilian, sovrano di Coburgⓖ...\n㈡\nScommetto che quando quel discolo maleducato salirà al trono gli abitanti del posto emigreranno altrove pur di non sopportare i suoi capricci!\n@c0@"
  ja: "@a@b%a001250「あの子が　王さまの国なんて\n\tイヤ……。　国のみんなを\n\t子分にしちゃうんじゃないの？\n@c0@"
156:
  de: "@aSancho@bEs geht miss ja nissts an, aber iss persönliss mache mir Sorgen um die Zukunft von Tifortu. Si, si, das tue iss...\n@c0@"
  en: "@aSancho@bEes no my problem, but for me, I worry about the future of Coburg. Uf, sí... Ees a worry. Heh heh heh.\n@c0@"
  es: "@aSancho@bPues no es mi problema, pero me preocupa el futuro de Trastámara. ¡Híjole! Tremendo problema.\n@c0@"
  fr: "@aSancho@bCe n'est p-pas mon problème, mais je m'inquiète pour l'avenir de C-Cobourg. Si... ça m'inquiète. Hé hé hé.\n@c0@"
  it: "@aSancho@bA mi la cosa no me fa né caldos né freddos, ma el pensiero de avere quella peste sul trono farà certamentes rabbrividire los abitantes de Coburg!\n@c0@"
  ja: "@a@bサンチョ「ラインハットの　行く末が\n\tひとごとながら　心配ですよ。\n\tとほほ……。\n@c0@"
157:
  de: "@aBianca@bMaria scheint sehr glücklich zu sein.\n@c0@"
  en: "@aBianca@bMaria seems really happy.\n@c0@"
  es: "@aBianca@bMaría parece muy feliz.\n@c0@"
  fr: "@aBianca@bMaria semble vraiment heureuse.\n@c0@"
  it: "@aBianca@bMaria sembra davvero felice...\n@c0@"
  ja: "@a@bビアンカ「マリアさん　幸せそうね。\n@c0@"
158:
  de: "@aNera@bMaria ist immer noch eine wunderschöne Frau, obwohl sie ein wenig älter geworden ist. Vermutlich liegt es daran, dass Harry sie so sehr liebt!\n@c0@"
  en: "@aNera@bMaria is still as beautiful as ever, even though she has aged a bit. It's probably because Harry loves her so much.\n@c0@"
  es: "@aNera@bMaría sigue tan guapa como sempre, aunque se haya hecho un poco mayor. Yo creo que es porque Froilán la ama veramente.\n@c0@"
  fr: "@aNera@bMaria est toujours aussi jolie, même si elle a un peu vieilli. C'est sûrement grâce à tout l'amour que lui porte Harry.\n@c0@"
  it: "@aNera@bMaria è sempre una bellissima donna, anche se il tempo comincia a lasciare qualche segno sul suo volto. Robert è un uomo fortunato...\n㈡\nMa tu lo sei ancora di più, tesoro mio!\nIh ih ih!\n@c0@"
  ja: "@a@bフローラ「マリアさん　トシを取られても\n\tおきれいですわ。　ヘンリーさんに\n\tいっぱい　愛されているからですわね。\n@c0@"
159:
  de: "@a%0%a001240@bDu brauchst dir keine Sorgen zu machen, Papa! Wir werden immer für dich da sein und dir helfen.\n@c0@"
  en: "@a%0%a001240@bYou don't need to worry about a thing, Dad!\nWe'll always be along to help you out.\n@c0@"
  es: "@a%0%a001240@b¡Por eso no te preocupes, papá!\nSiempre estaremos aquí para ayudarte.\n@c0@"
  fr: "@a%0%a001240@bIl ne faut pas que tu t'inquiètes, papaⓠ\nOn sera toujours là pour t'aider.\n@c0@"
  it: "@a%0%a001240@bPapà, puoi stare tranquillo.\nVedrai che riusciremo a salvare il mondo.\nNe sono sicuro!\n@c0@"
  ja: "@a@b%a001240「うん！　お父さんには\n\tボクたちが　ついてるからね。\n\t心配いらないよ！\n@c0@"
160:
  de: "@a%0%a001250@bIst es wirklich solch eine schwierige Reise, Papa? Ich find's nicht schwierig. Solange du bei mir bist, ist alles in Ordnung.\n@c0@"
  en: "@a%0%a001250@bIs it really such a difficult journey, Dad? It's not difficult for me. As long as you're with me, everything's fine.\n@c0@"
  es: "@a%0%a001250@b¿De veras es un viaje tan difícil, papi? Para mí no lo es. Si estás conmigo, todo marcha divinamente.\n@c0@"
  fr: "@a%0%a001250@bCe voyage est si difficile que ça, papaⓡ Moi, je ne trouve pas. Tant que tu es avec moi, tout va bien.\n@c0@"
  it: "@a%0%a001250@bÈ vero che i nostri viaggi sono faticosi e pericolosi, ma a me non importa!\nPer me conta solo che tu mi sia sempre vicino, papà!\n@c0@"
  ja: "@a@b%a001250「お父さん　旅　大変？\n\tわたしは　大変じゃないよ。\n\tお父さんたちと　いっしょだから。\n@c0@"
161:
  de: "@aOtto@bMeinetwegen könnten wir ruhig noch ein wenig bleiben und mit ihr plaudern...\n@c0@"
  en: "@aTuppence@bIf only we could stay and chat with her a\r\nlittle longer.\n@c0@"
  es: "@aAlazar@bCómo me gustaría poder quedarme a charlar con ella un rato más.\n@c0@"
  fr: "@aInnocent@bSi seulement on pouvait rester un peu plus longtemps pour continuer à lui parler...\n@c0@"
  it: "@aSimon@bSe restassimo qui ancora un po', potrei trovare l'occasione per parlare con Maria, magari a quattr'occhi...\n㈡\nUhm, meglio di no.\nSe lo facessi, sicuramente suo marito me li farebbe neri, gli occhi! \n@c0@"
  ja: "@a@bピピン「もうちょっと　あの方と\n\tお話ししたいなあ……。\n@c0@"
162:
  de: "@aBianca@bDas finde ich auch. Na ja, allerdings bin ich ja auch nicht gerade ein leuchtendes Vorbild in dieser Hinsicht...\n@c0@"
  en: "@aBianca@bI'll second that. No more disappearin', d'you hear?\n...I s'pose I'm hardly one to talk!\n@c0@"
  es: "@aBianca@b¡Eso digo yo! Nada de volver a desaparecer, ¿de acuerdo?\n㈡\nAunque no soy quién para decir nada...\n@c0@"
  fr: "@aBianca@bJe suis bien d'accord. Ne disparais plus, comprisⓡ\nEnfin... je ne suis pas la mieux placée pour dire çaⓠ\n@c0@"
