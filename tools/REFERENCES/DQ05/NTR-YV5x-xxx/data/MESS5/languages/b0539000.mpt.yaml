  fr: "@a%0%a001240@bDes gâteauxⓠⓑ C'est vraiⓡ C'est pas terribleⓠ\n@c0@"
  it: "@a%0%a001240@bPanini dolci?\nPanini dolci?!\nSanta dea, che spilorci!\n@c0@"
  ja: "@a@b%a001240「…えっ　まんじゅう？\n\tそれは　つまんないね……。\n@c0@"
207:
  de: "@a%0%a001240@bSieh nur! Die Mulde im Deckel hat genau die gleiche Größe wie der Saphir, oder?\n@c0@"
  en: "@a%0%a001240@bHey! The hollow in the lid looks just the same size as that sapphire, don't you think?\n@c0@"
