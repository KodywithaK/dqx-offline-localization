  it: "@aSancho@bEl señor rey Fabian te enviò una lettera de felicitaziones por el tuo retorno a Denim...\n@c0@"
  ja: "@a@bサンチョ「そういえば　%a000090王が\n\tお城にもどられたお祝いを\n\tいただいていたんでした！\n@c0@"
81:
  de: "@aSancho@bIss muss ihm sofort eine Dankesbrief schicken, wenn wir wieder zu Hause sind!\n@c0@"
  en: "@aSancho@bI must esend the letter to thank heem when we are next home.\n@c0@"
