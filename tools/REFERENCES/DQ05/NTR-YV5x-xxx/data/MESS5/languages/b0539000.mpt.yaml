  fr: "@a%0%a001240@bHéⓠ Le creux dans le couvercle est de la même taille que ce saphir, tu ne trouves pasⓡ\n@c0@"
  it: "@a%0%a001240@bHai notato che l'incavo sul coperchio ha la stessa forma dello zaffiro?\n@c0@"
  ja: "@a@b%a001240「あれ？\n\tこのフタのところの　くぼみって…\n\tあの宝石に　ぴったりなんじゃない？\n@c0@"
208:
  de: "@a%0%a001250@bWas für eine hübsche Spieldose! Sie sieht aus wie eine Schmuckschatulle, nicht?\n@c0@"
  en: "@a%0%a001250@bWhat a pretty music box! It looks just like a jewellery box, doesn't it?\n@c0@"
  es: "@a%0%a001250@b¡Qué bonita caja de música! Parece un joyero, ¿verdad?\n@c0@"
  fr: "@a%0%a001250@bQuelle jolie boîte à musiqueⓠ On dirait presque une boîte à bijoux, heinⓡ\n@c0@"
  it: "@a%0%a001250@bNon avevo mai visto un carillon così bello, sai?\nSembra un gioiello!\n@c0@"
  ja: "@a@b%a001250「うわ～　すごい\n\tきれいなオルゴールなの。\n\t宝石箱みたい……。\n@c0@"
209:
  de: "@aBianca@bMaria scheint sehr glücklich zu sein.\n@c0@"
  en: "@aBianca@bMaria seems really happy.\n@c0@"
  es: "@aBianca@bMaría parece muy feliz.\n@c0@"
  fr: "@aBianca@bMaria semble vraiment heureuse.\n@c0@"
  it: "@aBianca@bMaria sembra davvero felice...\n@c0@"
  ja: "@a@bビアンカ「マリアさん　幸せそうね。\n@c0@"
210:
  de: "@aNera@bMaria ist immer noch eine wunderschöne Frau, obwohl sie ein wenig älter geworden ist. Vermutlich liegt es daran, dass Harry sie so sehr liebt!\n@c0@"
  en: "@aNera@bMaria is still as beautiful as ever, even though she has aged a bit. It's probably because Harry loves her so much.\n@c0@"
  es: "@aNera@bMaría sigue tan guapa como sempre, aunque se haya hecho un poco mayor. Yo creo que es porque Froilán la ama veramente.\n@c0@"
  fr: "@aNera@bMaria est toujours aussi jolie, même si elle a un peu vieilli. C'est sûrement grâce à tout l'amour que lui porte Harry.\n@c0@"
  it: "@aNera@bMaria è sempre una bellissima donna, anche se il tempo comincia a lasciare qualche segno sul suo volto. Robert è un uomo fortunato...\n㈡\nMa tu lo sei ancora di più, tesoro mio!\nIh ih ih!\n@c0@"
  ja: "@a@bフローラ「マリアさん　トシを取られても\n\tおきれいですわ。　ヘンリーさんに\n\tいっぱい　愛されているからですわね。\n@c0@"
211:
  de: "@a%0%a001240@bDu brauchst dir keine Sorgen zu machen, Papa! Wir werden immer für dich da sein und dir helfen.\n@c0@"
  en: "@a%0%a001240@bYou don't need to worry about a thing, Dad!\nWe'll always be along to help you out.\n@c0@"
  es: "@a%0%a001240@b¡Por eso no te preocupes, papá!\nSiempre estaremos aquí para ayudarte.\n@c0@"
  fr: "@a%0%a001240@bIl ne faut pas que tu t'inquiètes, papaⓠ\nOn sera toujours là pour t'aider.\n@c0@"
  it: "@a%0%a001240@bPapà, puoi stare tranquillo.\nVedrai che riusciremo a salvare il mondo.\nNe sono sicuro!\n@c0@"
  ja: "@a@b%a001240「うん！　お父さんには\n\tボクたちが　ついてるからね。\n\t心配いらないよ！\n@c0@"
212:
  de: "@a%0%a001250@bIst es wirklich solch eine schwierige Reise, Papa? Ich find's nicht schwierig. Solange du bei mir bist, ist alles in Ordnung.\n@c0@"
  en: "@a%0%a001250@bIs it really such a difficult journey, Dad? It's not difficult for me. As long as you're with me, everything's fine.\n@c0@"
  es: "@a%0%a001250@b¿De veras es un viaje tan difícil, papi? Para mí no lo es. Si estás conmigo, todo marcha divinamente.\n@c0@"
  fr: "@a%0%a001250@bCe voyage est si difficile que ça, papaⓡ Moi, je ne trouve pas. Tant que tu es avec moi, tout va bien.\n@c0@"
  it: "@a%0%a001250@bÈ vero che i nostri viaggi sono faticosi e pericolosi, ma a me non importa!\nPer me conta solo che tu mi sia sempre vicino, papà!\n@c0@"
  ja: "@a@b%a001250「お父さん　旅　大変？\n\tわたしは　大変じゃないよ。\n\tお父さんたちと　いっしょだから。\n@c0@"
213:
  de: "@aOtto@bMeinetwegen könnten wir ruhig noch ein wenig bleiben und mit ihr plaudern...\n@c0@"
  en: "@aTuppence@bIf only we could stay and chat with her a\r\nlittle longer.\n@c0@"
  es: "@aAlazar@bCómo me gustaría poder quedarme a charlar con ella un rato más.\n@c0@"
  fr: "@aInnocent@bSi seulement on pouvait rester un peu plus longtemps pour continuer à lui parler...\n@c0@"
  it: "@aSimon@bSe restassimo qui ancora un po', potrei trovare l'occasione per parlare con Maria, magari a quattr'occhi...\n㈡\nUhm, meglio di no.\nSe lo facessi, sicuramente suo marito me li farebbe neri, gli occhi! \n@c0@"
  ja: "@a@bピピン「もうちょっと　あの方と\n\tお話ししたいなあ……。\n@c0@"
214:
  de: "@aBianca@bHarry war auch nicht viel besser, als er klein war, oder? Dann liegt es wohl in der Familie...\n@c0@"
  en: "@aBianca@bHarry was a bit of a pain when he was younger, wasn't he? I guess it's in the blood, then!\n@c0@"
  es: "@aBianca@bFroilán era un poco travieso cuando era niño, ¿verdad? ¡Debe de ser cosa de familia!\n@c0@"
  fr: "@aBianca@bHarry était un peu pénible quand il était plus jeune. Ça doit être de familleⓠ\n@c0@"
  it: "@aBianca@bSì, mi hai detto che, da bambino, Robert era molto turbolento. Pare proprio che Emilian stia seguendo le orme del padre... Eh eh eh!\n@c0@"
  ja: "@a@bビアンカ「ヘンリーさんも　ずいぶん\n\t困った子供だったんでしょ？\n\t血は　あらそえないわね。\n@c0@"
215:
  de: "@aNera@bIrgendwie habe ich den Eindruck, dass Kendrick genau wie sein Vater ist...\n@c0@"
  en: "@aNera@bI can't help thinking that Kendrick is just like\r\nhis father.\n@c0@"
  es: "@aNera@bNo puedo evitar pensare que Santos es como il suo padre.\n@c0@"
