  fr: "@aInnocent@bIl n'y a pas beaucoup de soldats par ici.\r\nPeut-être qu'ils n'en ont pas besoin,\r\nvu l'épaisseur des remparts du château.\n@c0@"
  it: "@aSimon@bNon ci sono molti soldati in giro.\nForse re Fabian pensa che le mura del castello offrano una difesa più che sufficiente...\n㈡\nSi sbaglia!\nNulla può sostituire l'occhio vigile e la capacità di reazione di una guardia ben addestrata!\n@c0@"
