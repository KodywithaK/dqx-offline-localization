  ja: "@a@b%a001240「ボク　見つけてあげる！\n\tそのマントを見つけて\n\tお父さんに　プレゼントするね。\n@c0@"
60:
  de: "@a%0%a001240@bDieser Umhang ist genau das Richtige für dich, Papa. Es ist gut, dass wir ihn gefunden haben.\n@c0@"
  en: "@a%0%a001240@bThat cape's just right for you, Dad. It's good that we found it.\n@c0@"
  es: "@a%0%a001240@bEsa capa es perfecta para ti, papi. Me alegro de que la hayamos encontrado.\n@c0@"
  fr: "@a%0%a001240@bCe manteau est fait pour toi, papa.\nOn a de la chance de l'avoir trouvé.\n@c0@"
  it: "@a%0%a001240@bPapà, quel mantello sembra fatto apposta per te!\nTi calza a pennello!\n@c0@"
  ja: "@a@b%a001240「本当に　そのマント\n\tお父さんにピッタリだね。\n\t見つけて　よかった！\n@c0@"
61:
