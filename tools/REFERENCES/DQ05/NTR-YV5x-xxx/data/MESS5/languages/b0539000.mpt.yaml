  it: "@a%0%a001240@bNo, forse non è questo ciò che intendeva quel signore...\n@c0@"
  ja: "@a@b%a001240「うーん…　大人の話って\n\tよく　わからないよ。\n@c0@"
69:
  de: "@aSancho@bDas was mit diese falsche Witwe passiert ist, hat Señor Wilbur sehr mitgenommen.\n@c0@"
