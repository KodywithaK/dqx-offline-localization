  ja: "@a@bサンチョ「……ヘンリーさまも\n\tりっぱな大人に　なられましたね。\n@c0@"
193:
  de: "@aSancho@bAber so muss es sein. Sonst wäre Señor Ludwig ja... (Schluchz)\n@c0@"
  en: "@aSancho@bBut eet must be like thees.\nOtherwise, señor Pankraz, he, he... (blub)\n@c0@"
  es: "@aSancho@bY así es como tenía que ser.\nSi no, el señor Teudis... él... él... (snif)\n@c0@"
  fr: "@aSancho@bMais il le fallait. Sinon, le señor P-Petros, il, il... (sanglot)\n@c0@"
  it: "@aSancho@bSi fosse estato così anche cuando era giovanes, forse el señor Russel...\nYo... Yo me commuovos... ¡Sob!\n@c0@"
  ja: "@a@bサンチョ「もちろん　そうでなければ\n\tいけませんよ。　なにせ\n\tパパスさまが……　うっうっ……。\n@c0@"
194:
  de: "@a%0%a001250@bWarst du wirklich mal ein Sklave? Oh, Papa! Der Göttin sei Dank, dass du noch lebst!\n@c0@"
  en: "@a%0%a001250@bWere you really once a slave? Oh, Dad!\nThank the Goddess that you're still alive!\n@c0@"
  es: "@a%0%a001250@b¿De verdad que fuiste esclavo? ¡Oh, papi!\n¡Gracias a la Diosa que aún estás vivo!\n@c0@"
  fr: "@a%0%a001250@bC'est vrai que tu as été esclaveⓡ Oh papaⓠ\nJe remercie la Déesse que tu sois encore en vieⓠ\n@c0@"
  it: "@a%0%a001250@bPapà, lo zio Sancho mi aveva detto che eri stato uno schiavo, ma non mi aveva raccontato che avevi sofferto tanto...\n㈡\nForse lo ha fatto per non farmi dispiacere...\n@c0@"
  ja: "@a@b%a001250「お父さん　ドレイさんだったの？\n\tお父さん…　お父さん……\n\t生きててくれて　ありがとう。\n@c0@"
195:
  de: "@a%0%a001240@bIch wusste, dass du viel durchmachen musstest, Papa, aber dass es so schlimm war, hätte ich nicht gedacht.\n@c0@"
  en: "@a%0%a001240@bI knew you'd had a hard time of it, Dad, but I didn't realise it was that bad.\n@c0@"
  es: "@a%0%a001240@bSabía que lo habías pasado mal, papá, pero nunca pensé que fuese tan mal.\n@c0@"
  fr: "@a%0%a001240@bJe savais que tu en avais bavé, papa, mais je ne pensais pas que c'était à ce point.\n@c0@"
  it: "@a%0%a001240@bPapà, sapevo che tu e Robert eravate stati schiavi, ma non immaginavo quali pene aveste sofferto...\n@c0@"
  ja: "@a@b%a001240「お父さんは　苦労してるって\n\t聞いてたけど…　知らなかったよ。\n@c0@"
196:
  de: "@a%0%a001240@bIch werde mich bemühen, so groß und stark wie du zu werden, dann kann uns nichts geschehen!\n@c0@"
  en: "@a%0%a001240@bI'm going to grow up strong and brave like you, and I won't let anything get the better of me, either!\n@c0@"
  es: "@a%0%a001240@b¡Voy a hacerme fuerte y valiente como tú, y no dejaré que nada me hunda!\n@c0@"
  fr: "@a%0%a001240@bJe vais devenir fort et courageux comme toi, et moi non plus, je ne laisserai personne me battreⓠ\n@c0@"
  it: "@a%0%a001240@bDev'essere stata un'esperienza bruttissima...\n@c0@"
  ja: "@a@b%a001240「ボク　お父さんみたいに\n\tどんなことにも　負けない\n\t強い人になるね！\n@c0@"
197:
  de: "@aOtto@bIch glaube nicht, dass es besonders viele ⓞköniglicheⓟ Sklaven in der Geschichte gegeben hat.\n㈡\nWahrscheinlich wart Ihr und Prinz Harry sogar die einzigen!\n@c0@"
  en: "@aTuppence@bI'll bet there aren't too many other royals who've had experience as slaves in their lives! In fact, I'd wager it's just you and Prince Harry.\n@c0@"
  es: "@aAlazar@b¡Seguro que no hay muchos nobles que hayan pasado por la experiencia de ser esclavos! De hecho, apostaría a que solo estáis tú y el príncipe Froilán.\n@c0@"
  fr: "@aInnocent@bIl ne doit pas y avoir beaucoup de têtes couronnées qui ont été esclaves dans leur vie. Je parie que le prince Harry et vous êtes les seuls.\n@c0@"
  it: "@aSimon@bMaestà, se mi permette di dirlo, sono felice che lei abbia vissuto il dramma della schiavitù sulla sua pelle...\n㈡\nQuell'esperienza l'ha resa il miglior regnante del mondo, perché le pene patite le hanno insegnato a trattare i suoi sudditi con la massima umanità.\n@c0@"
  ja: "@a@bピピン「世界中をさがしても　ドレイ経験の\n\tある王族は　きっと　%a000090さまと\n\tヘンリーさまくらいですよね。\n@c0@"
198:
  de: "@aBianca@bVielleicht ist es, weil ich seine Nachricht gelesen habe, aber inzwischen ist Harry mir richtig ans Herz gewachsen.\n@c0@"
  en: "@aBianca@bI dunno if it's because I read that message of his, but Harry seems really special now.\n@c0@"
  es: "@aBianca@bQuizá sea por ese mensaje suyo que leí, pero Froilán me parece una persona muy especial, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe ne sais pas si c'est parce que j'ai lu son message, mais Harry me donne l'impression d'être vraiment quelqu'un de spécial, maintenant.\n@c0@"
  it: "@aBianca@bOra che ho letto il messaggio che ti ha scritto Robert, mi rendo conto che è una persona persino migliore di quanto credessi...\n@c0@"
  ja: "@a@bビアンカ「あのメッセージを\n\t見たからかしら…　ヘンリーさんが\n\tちょっと　かっこよく見えちゃうね。\n@c0@"
199:
  de: "@aBianca@bWas für ein wunderbares Andenken. Im Vergleich dazu sieht unser Andenken eigentlich nach nichts aus, findest du nicht?\n@c0@"
  en: "@aBianca@bWhat a great souvenir. Our weddin' souvenir dun't look like much in comparison, eh?\n@c0@"
  es: "@aBianca@b¡Qué bonito recuerdo! A su lado, el recuerdo de nuestra boda no es gran cosa, ¿eh?\n@c0@"
  fr: "@aBianca@bQuel magnifique présent. À côté, notre cadeau en souvenir de notre mariage semble bien petit, nonⓡ\n@c0@"
  it: "@aBianca@bChe splendido souvenir!\r\nArgh! Mi pesa dirlo, ma devo ammettere che è più bello delle bomboniere del nostro matrimonio... Ih ih ih!\n@c0@"
  ja: "@a@bビアンカ「ステキな　記念品ね。\n\tそれにくらべて　私たちの\n\t結婚記念品って　いったい……。\n@c0@"
200:
  de: "@aNera@bIch glaube, ich habe noch nie eine so erlesene Spieldose gesehen.\n@c0@"
  en: "@aNera@bI don't think I've ever seen such an exquisite\r\nmusic box.\n@c0@"
  es: "@aNera@bCredo que jamás he visto una caja de música tan delicada.\n@c0@"
  fr: "@aNera@bC'est la plus ravissante boîte à musique que j'aie jamais vue.\n@c0@"
  it: "@aNera@bNon avevo mai visto un carillon come questo...!\nÈ una vera meraviglia...\n@c0@"
  ja: "@a@bフローラ「こんなに　きれいな細工の\n\tオルゴールなんて\n\t見たことが　ありませんわ。\n@c0@"
201:
  de: "@aNera@bUnd sie ist mir umso lieber, weil sie als Dankeschön für die Gäste angefertigt wurde, die zur Feier gekommen sind.\n@c0@"
  en: "@aNera@bAnd it's all the better because it was made to thank people who'd come to share in their celebrations.\n@c0@"
  es: "@aNera@bY además la construyeron para dar las grazie a las personas que vinieron a compartir la ceremonia con ellos.\n@c0@"
  fr: "@aNera@bEt elle est d'autant plus belle qu'elle a été faite pour remercier les gens venus partager leur bonheur.\n@c0@"
  it: "@aNera@bMaria e Robert non avrebbero potuto scegliere una bomboniera più bella per il loro matrimonio!\n@c0@"
  ja: "@a@bフローラ「お祝いに　来てくださる\n\t方のために　心をこめて\n\t作らせてくださったのね。\n@c0@"
202:
  de: "@aSancho@bDer vorherige König von Tifortu war eine gute Amigo von Señor Ludwig.\n@c0@"
  en: "@aSancho@bThe señor who ees king of Coburg before, thees ees a good amigo of señor Pankraz.\n@c0@"
  es: "@aSancho@bEl señor que era antes el rey de Trastámara era buen amigo del señor Teudis.\n@c0@"
  fr: "@aSancho@bLe señor qui était roi de C-C-Cobourg avant, c'était oun b-bon amigo du señor Petros.\n@c0@"
  it: "@aSancho@bRey Michel, el precedentes sovrano de Coburg, y el señor Russel se estimavano mucho.\n@c0@"
  ja: "@a@bサンチョ「ラインハットの　前国王は\n\tパパスさまの　ご親友でした。\n@c0@"
203:
  de: "@aSancho@bUnd als der Sohn von die Amigo von Señor Ludwig verschwunden war, hat Señor Ludwig alles getan, um ihn zu finden.\n@c0@"
  en: "@aSancho@bEef the eson of a friend of señor Pankraz, he go missing, señor Pankraz, he would do anytheeng to find heem.\n@c0@"
