  en: "@aNera@bHe he. We have ourselves a palace, but I don't see us organising a ball any time soon, do you?\n@c0@"
  es: "@aNera@bJi, ji. Nosotros tenemos nuestro palazzo, pero pasará mucho tiempo hasta que organicemos un baile en él, ¿no crees?\n@c0@"
  fr: "@aNera@bNous avons un château à nous, mais je ne pense pas qu'on y organisera un bal de sitôt, heinⓡ\n@c0@"
  it: "@aNera@bMi piacerebbe organizzare un ballo nel nostro castello, ma in questo periodo abbiamo ben altro a cui pensare...\n@c0@"
  ja: "@a@bフローラ「うふふ。　私たち\n\tお城の人間ですけど　ダンスからは\n\tほど遠い生活を　していますわよね。\n@c0@"
244:
  de: "@a%0%a001240@bOh nein! Müssen alle Prinzen auf Bälle gehen? Ich hasse Tanzen!\n@c0@"
  en: "@a%0%a001240@bOh no! Do all princes have to go to balls?\nI hate dancing!\n@c0@"
  es: "@a%0%a001240@b¡Oh, no! ¿Todos los príncipes tienen que ir a bailes?\n¡Odio bailar!\n@c0@"
  fr: "@a%0%a001240@bOh nonⓠ Est-ce que tous les princes doivent aller aux balsⓡ Je déteste danserⓠ\n@c0@"
  it: "@a%0%a001240@bNon mi piace ballare.\nPreferisco combattere contro i mostri cattivi!\nYaaaaahhh!\n@c0@"
  ja: "@a@b%a001240「王子って\n\tダンスパーティとか　するの？\n\tボク　そんなの　やだよう。\n@c0@"
245:
  de: "@aBianca@bWenn man etwas nicht öffnen soll, will man es umso mehr, oder? Wir könnten vielleicht einen klitzekleinen Blick hineinwerfen, wenn sie nicht hinguckt...\n@c0@"
  en: "@aBianca@bBein' told not to open it makes you want to open it\r\nall the more, eh? We could try and have a peek while she en't lookin'...\n@c0@"
  es: "@aBianca@bCuando te dicen que no abras algo aún te apetece más abrirlo, ¿verdad? Podríamos intentar echar un vistacillo mientras ella no mira...\n@c0@"
  fr: "@aBianca@bS'entendre dire qu'il ne faut pas regarder donne\nencore plus envie de le faire, nonⓡ\n㈡\nOn pourrait essayer de jeter un œil pendant\nqu'elle a le dos tourné...\n@c0@"
  it: "@aBianca@bOra sì che sono curiosa!\nChe ne diresti di dare un'occhiata in giro mentre lei non guarda, eh?\n@c0@"
  ja: "@a@bビアンカ「開けるなと言われると\n\t開けたくなっちゃうのよね……。\n\t%a000090　こっそり　開けちゃおうか。\n@c0@"
246:
  de: "@aNera@bEs ist fast, als wollte sie uns damit aufstacheln, ihn aufzumachen! Vielleicht ist es eine Falle.\n@c0@"
  en: "@aNera@bIt's almost like she's saying that to try and get us to open it! Maybe it's some kind of trap.\n@c0@"
  es: "@aNera@b¡Veramente, basta que lo diga para hacer que los abramos! Quizá sea un truco.\n@c0@"
  fr: "@aNera@bÇa revient presque à nous dire d'y jeter un œil. C'est peut-être un piège...\n@c0@"
  it: "@aNera@bDire a qualcuno di non ficcanasare in un posto equivale a suggerirgli di farlo! Quella ragazza non capisce niente di psicologia inversa!\n@c0@"
  ja: "@a@bフローラ「まるで　タンスを開けろと\n\t言わんばかりの　クチぶりですわ。\n\tもしかしたら　なにかのワナかしら。\n@c0@"
247:
  de: "@aOtto@bHmm. In den Kleiderschrank einer Tänzerin würde ich schon einmal gerne hineinsehen.\n@c0@"
  en: "@aTuppence@bHmm. The inside of a dancing girl's wardrobe could be quite a sight to behold.\n@c0@"
  es: "@aAlazar@bMmm. El guardarropa de una bailarina debe de ser algo digno de verse.\n@c0@"
  fr: "@aInnocent@bMmm. Le vestiaire d'une danseuse... ça doit sûrement valoir le coup d'œil.\n@c0@"
  it: "@aSimon@bIh ih ih!\nQuando mi dicono di non ficcanasare da qualche parte, cresce in me la voglia di farlo!\n@c0@"
  ja: "@a@bピピン「おどり娘さんのタンスって\n\tロマンがいっぱい　つまっているような\n\t気がしますよねえ。\n@c0@"
248:
  de: "@aBianca@bIch kann mir nicht vorstellen, dass sie nach Lage der Dinge jetzt viel herumreisen können. Wahrscheinlich sitzen sie hier eine Weile fest.\n@c0@"
  en: "@aBianca@bI doubt they can do much travellin' with how things are at the moment. I s'pose that means they're probably stuck here a while.\n@c0@"
  es: "@aBianca@bNo creo que puedan viajar demasiado, tal y como anda la cosa. Supongo que eso significa que tendrán que quedarse aquí una temporadita, ¿sabes?\n@c0@"
  fr: "@aBianca@bÇa m'étonnerait qu'ils puissent beaucoup se déplacer avec ce qui se passe en ce moment. Ça veut sûrement dire qu'ils sont coincés là pour un bon bout de temps.\n@c0@"
  it: "@aBianca@bSuggerirei alla compagnia di diventare ⓕstabileⓖ almeno per un po', visto quant'è pericoloso viaggiare in questo periodo...\n@c0@"
  ja: "@a@bビアンカ「旅まわりと　言っても\n\t今じゃそんなに　まわれないだろうし…\n\tしばらく　この町にいるんじゃない？\n@c0@"
249:
  de: "@aNera@bJa, das letzte Mal wurde ein anderes Stück aufgeführt. Aber das ist ja auch schon eine Weile her.\n@c0@"
  en: "@aNera@bYes, the play was different to last time.\r\nStill, I suppose that was a while ago now.\n@c0@"
  es: "@aNera@bSí, la última vez la obra era distinta.\nClaro que ha pasado mucho tiempo, veramente...\n@c0@"
  fr: "@aNera@bC'est vrai que ce n'est pas la même pièce que l'autre fois, mais il faut dire que c'était il y a longtemps.\n@c0@"
  it: "@aNera@bLo spettacolo mi è piaciuto. La storia era un po' triste, ma le attrici sono state proprio brave!\r\nE i costumi! Oh, che meraviglia quei costumi...\n@c0@"
  ja: "@a@bフローラ「お芝居の内容　昔と\n\t変わっていましたわね。\n\tあれから　もう　何年たったかしら。\n@c0@"
250:
  de: "@aOtto@bIch frage mich, wer hier das Sagen hat.\n@c0@"
  en: "@aTuppence@bI wonder who's in charge here.\n@c0@"
  es: "@aAlazar@bMe pregunto quién es el que manda aquí.\n@c0@"
  fr: "@aInnocent@bJe me demande qui est le patron, ici.\n@c0@"
  it: "@aSimon@bDove andiamo ora, Maestà?\n@c0@"
  ja: "@a@bピピン「ここのオーナーって\n\t誰でしたっけ？\n@c0@"
251:
  de: "@aBianca@bPah! Sie ist doch schon angezogen! Ihr fehlt bloß noch die Schminke!\n@c0@"
  en: "@aBianca@bHuh! It's not like she's still changing. She's only got her make-up left to do.\n@c0@"
  es: "@aBianca@b¡Mmm! En realidad no se está cambiando. Solo le falta ponerse el maquillaje, ¿sabes?\n@c0@"
  fr: "@aBianca@bPeuhⓠ Elle exagère, elle a fini de se changer.\nIl ne lui reste plus que son maquillage à faire.\n@c0@"
  it: "@aBianca@bMa non si stava cambiando d'abito!\nSi stava solo rifacendo il trucco!\n@c0@"
  ja: "@a@bビアンカ「着替え中　と言っても\n\tあとは　お化粧だけじゃないの。\n@c0@"
252:
  de: "@aBianca@bSie will uns wahrscheinlich nur loswerden. Na, tun wir ihr den Gefallen und gehen.\n@c0@"
  en: "@aBianca@bI reckon she's just tryin' to get rid of us. Well, you don't need to tell me twice. Let's get goin'.\n@c0@"
  es: "@aBianca@bCreo que en realidad quiere librarse de nosotros. Bueno, no tiene que decírnoslo dos veces... ¡Vámonos!\n@c0@"
  fr: "@aBianca@bJe crois qu'elle essaie juste de se débarrasser de nous. Eh bien, ce sera avec plaisir. Viens, on s'en va.\n@c0@"
  it: "@aBianca@bHai visto come ci va giù pesante?!\nIo impiegherei tre anni per consumare i cosmetici che lei usa in un giorno!\n@c0@"
  ja: "@a@bビアンカ「%a000090ったら　どうしたの？\n\tもしかして　なにか　期待してた？\n@c0@"
253:
  de: "@aNera@bWir sollten sie in Frieden lassen. Wir wollen doch nicht aufdringlich erscheinen!\n@c0@"
  en: "@aNera@bWe should leave her in peace. We wouldn't want her to think we're peeping toms.\n@c0@"
  es: "@aNera@bDeberíamos dejarla en pace. Veramente, no quiero que piense que somos una especie de plastas.\n@c0@"
  fr: "@aNera@bNous devrions la laisser tranquille.\r\nElle a besoin de se concentrer.\n@c0@"
  it: "@aNera@bHai sentito, %a000090?\nDai, andiamocene.\nNon possiamo restare qui...\n@c0@"
  ja: "@a@bフローラ「さあ　向こうへ行きましょう。\n\tここにいると　エッチな人だと\n\t思われてしまいますわよ。\n@c0@"
254:
  de: "@a%0%a001250@bSie hat dich ausgeschimpft, Papa!\n@c0@"
  en: "@a%0%a001250@bShe told you off, Dad!\n@c0@"
  es: "@a%0%a001250@b¡Vaya bronca, papi!\n@c0@"
  fr: "@a%0%a001250@bTu t'es fait disputer, papaⓠ\n@c0@"
  it: "@a%0%a001250@bPerché quella signorina strillava tanto?\n@c0@"
  ja: "@a@b%a001250「お父さん　ダメだって。\n@c0@"
255:
  de: "@aOtto@bAber sie war doch schon angezogen! Hm, da waren wir zur falschen Zeit am falschen Ort...\n@c0@"
  en: "@aTuppence@bBut she's already dressed. Oh, to have a better sense of timing!\n@c0@"
  es: "@aAlazar@b¡Menudo carácter! ¡Me he enamorado!\n@c0@"
  fr: "@aInnocent@bMais elle est s'est déjà changée. Elle doit vraiment avoir le trac pour être aussi agressive.\n@c0@"
  it: "@aSimon@bD'accordo, d'accordo.\nVorrà dire che entrerò PRIMA che si cambino d'abito, e uscirò DOPO che l'avranno fatto! Eh eh eh!\n@c0@"
  ja: "@a@bピピン「でも　もう　しっかり\n\t衣装　着てるじゃないですか。\n\tがっかり……。\n@c0@"
256:
  de: "@aBianca@bDie Schleime hier sind so bunt und niedlich!\n@c0@"
  en: "@aBianca@bThe slimes here are so colourful and cute!\n@c0@"
  es: "@aBianca@b¡Aquí los limos tienen muchos colores! ¡Qué monos!\n@c0@"
  fr: "@aBianca@bLes gluants sont si mignons et si colorés, iciⓠ\n@c0@"
  it: "@aBianca@bQuesti Slime colorati sono troppo simpatici!\n@c0@"
  ja: "@a@bビアンカ「ここの　スライムって\n\t色とりどりで　かわいいわね。\n@c0@"
257:
  de: "@aNera@bIch frage mich, wie die Schleime es geschafft haben, so bunte Farben anzunehmen!\n@c0@"
  en: "@aNera@bI wonder how those slimes managed to turn themselves into such funny colours!\n@c0@"
  es: "@aNera@b¡Ma qué habrá sucedido para que los limos tengan esos colores tan graciosos!\n@c0@"
  fr: "@aNera@bJe me demande comment ces gluants ont réussi à prendre des couleurs aussi drôlesⓠ\n@c0@"
  it: "@aNera@bCome avranno fatto questi Slime ad assumere colori tanto vivaci?\n@c0@"
  ja: "@a@bフローラ「スライムさんたちは\n\tどうすると　あんなに変わった色に\n\tなるのかしら？\n@c0@"
258:
  de: "@a%0%a001240@bJuchhu! Ein Schlürfodrom! Ich kann bestimmt den Gewinner erraten. Mal sehen...\n@c0@"
  en: "@a%0%a001240@bYay! It's a slurpodrome! I bet I can pick a winner. Now, let's see...\n@c0@"
  es: "@a%0%a001240@b¡Bien! ¡Un limódromo! ¡Seguro que elijo al ganador! Vamos a ver...\n@c0@"
  fr: "@a%0%a001240@bOuaisⓠ C'est un gluodromeⓠ Je suis sûr que je peux parier sur le bon gluant. Voyons voir...\n@c0@"
  it: "@a%0%a001240@bEcco lo slimodromo!\nVediamo un po' se indovino chi vincerà la prossima corsa...\n@c0@"
  ja: "@a@b%a001240「わ～い！　スライムレースだ！\n\tボクが　予想してあげるね。\n\tえ～と　え～と………。\n@c0@"
259:
  de: "@a%0%a001250@bHe he! Sieh dir doch nur all die bunten Schleime an!\n@c0@"
  en: "@a%0%a001250@bHe he! Look at all those funny-coloured slimes!\n@c0@"
  es: "@a%0%a001250@b¡Ji, ji! ¡Mira esos limos, qué colores tan divertidos tienen!\n@c0@"
  fr: "@a%0%a001250@bHé héⓠ Regarde ces gluants de toutes les couleursⓠ\n@c0@"
  it: "@a%0%a001250@bGli Slime colorati sono adorabili!\nChe belli!\n@c0@"
  ja: "@a@b%a001250「わ～　へんな色の\n\tスライムさんが　いっぱいなの。\n@c0@"
260:
  de: "@aSancho@bDiese Schleime, sie sind so lustig, no? Das ist, weil sie so schön rund sind. Irgendwie sie sind für miss keine Monster...\n@c0@"
  en: "@aSancho@bThe eslimes, they are eso cute, no? Ees because they have the healthy paunch, you know. I no theenk of them as monsters.\n@c0@"
  es: "@aSancho@bLos limos son muy graciosos, ¿eh, chamaco?\nEs por la panza de salud que tienen, nomás. Para mí no son monstruos.\n@c0@"
  fr: "@aSancho@bIls sont mignons ces g-gluants, noⓡ C'est à cause de leur v-ventre rebondi. Je ne les vois pas comme des m-monstres.\n@c0@"
  it: "@aSancho@bLos Slime sono los mios mostros preferitos.\nDespués %a001210, ovviamentes...\n@c0@"
  ja: "@a@bサンチョ「スライムは\n\tぽや～っとしてて　かわいいですね。\n\t魔物ってことを　忘れてしまいますよ。\n@c0@"
261:
  de: "@aOtto@bSchleimrennen sind mir nicht aufregend genug. Irgendwie will da bei mir nicht die rechte Wettstimmung aufkommen.\n@c0@"
  en: "@aTuppence@bSlime races just don't seem exciting enough.\r\nI can't quite get into the gambling frame of mind\r\nwith them somehow.\n@c0@"
  es: "@aAlazar@bLas carreras de limos no me emocionan demasiado.\nPor algún motivo, no me dan ganas de ponerme a apostar en ellas.\n@c0@"
  fr: "@aInnocent@bJe n'accroche pas trop aux courses de gluants.\r\nJe ne sais pas pourquoi, mais j'ai du mal à les associer au jeu.\n@c0@"
  it: "@aSimon@bNon capisco perché la gente si entusiasmi tanto per le corse degli Slime...\r\nIo le trovo terribilmente noiose!\n@c0@"
  ja: "@a@bピピン「スライムレースは\n\tきんちょう感がなくて　どうも\n\tギャンブルしてる気になれませんよ。\n@c0@"
262:
  de: "@aBianca@bHa ha ha! Der Alte scheint sich ja prima zu unterhalten!\n@c0@"
  en: "@aBianca@bHa ha ha! Looks like the old bloke's havin' fun!\n@c0@"
  es: "@aBianca@b¡Ja, ja, ja! ¡Parece que ese vejete se lo está pasando de miedo!\n@c0@"
  fr: "@aBianca@bHa ha haⓠ Pépé s'amuse, on diraitⓠ\n@c0@"
  it: "@aBianca@bGli Slime sono mostri, quindi restano sempre creature dal comportamento imprevedibile! Eccezion fatta per quelli addomesticati, ovviamente...\n@c0@"
  ja: "@a@bビアンカ「うふふ。\n\tあのおじいさん　めいっぱい\n\t楽しんでる感じね。\n@c0@"
263:
  de: "@aNera@bEr betrachtet die Schleime mit solcher Zuneigung. Fast so, als wären es seine Enkel!\n@c0@"
  en: "@aNera@bHe's looking at those slimes with so much\r\naffection. It's almost as if he thinks of them\r\nas his grandchildren!\n@c0@"
  es: "@aNera@bEstá mirando a esos limos con molto cariño. ¡Es como si fueran sus nietos!\n@c0@"
  fr: "@aNera@bIl regarde ces gluants avec tant d'affection.\nC'est presque comme s'il les considérait\ncomme ses petits-enfantsⓠ\n@c0@"
  it: "@aNera@bQuel tipo ha una vera passione per gli Slime...\n@c0@"
  ja: "@a@bフローラ「気のせいか　あのおじいさんの目\n\tまるで　まごを見るかのように\n\t愛情に　あふれていましたわね。\n@c0@"
264:
  de: "@a%0%a001240@bEs ist so lustig, wenn die Schleime auf ihre Gesichter fallen!\n@c0@"
  en: "@a%0%a001240@bIt's funny when the slimes fall splat on their faces!\n@c0@"
  es: "@a%0%a001240@b¡Qué gracia ver a los limos caer y chafarse la cara!\n@c0@"
  fr: "@a%0%a001240@bC'est marrant quand les gluants s'étalentⓠ\n@c0@"
  it: "@a%0%a001240@bÈ troppo divertente quando gli Slime cadono con il muso per terra!\nTanto sono blobbolosi e non si fanno male!\n@c0@"
  ja: "@a@b%a001240「ボクね\n\tスライムが　ぴょ～んとして\n\tベチャってなるのが　好きなんだ。\n@c0@"
265:
  de: "@a%0%a001250@bIch verstehe sie auch nicht. Diese Schleime sind ganz schön unberechenbar.\n@c0@"
  en: "@a%0%a001250@bI can't figure it out either. These slimes are all quite unpredictable.\n@c0@"
  es: "@a%0%a001250@bYo tampoco los entiendo. Los limos son seres muy imprevisibles.\n@c0@"
  fr: "@a%0%a001250@bJe veux bien le croire. Ces gluants sont vraiment imprévisibles.\n@c0@"
  it: "@a%0%a001250@bNemmeno io riesco a prevedere il comportamento degli Slime! Sembra che facciano sempre il contrario di ciò che ci si aspetta da loro...\n@c0@"
  ja: "@a@b%a001250「わたしも　わからないです。\n\tここのスライムさんたち　みんな\n\t気分屋さんなの。\n@c0@"
266:
  de: "@aBianca@bSchleime sind so unverwüstlich und niedlich.\n@c0@"
  en: "@aBianca@bSlimes are so bouncy and cute-looking.\n@c0@"
  es: "@aBianca@bLos limos son tan alegres y monos...\n@c0@"
  fr: "@aBianca@bCes gluants sont tellement mignons et énergiques.\n@c0@"
  it: "@aBianca@bGli Slime sono soffici e teneri.\nSembrano dei giganteschi bignè.\n@c0@"
  ja: "@a@bビアンカ「スライムって　つっつくと\n\tぷにぷにして　かわいいけど……\n@c0@"
267:
  de: "@aBianca@bAber wenn man sie anfasst, sind sie so... schleimig! Igitt!\n@c0@"
  en: "@aBianca@bBut when you touch them, they're so...slimy! Yuck!\n@c0@"
  es: "@aBianca@bPero si los tocas son tan... ¡limosos! ¡Puaj!\n@c0@"
  fr: "@aBianca@bMais quand on les touche, ils sont tellement...\n... gluantsⓠ Beurkⓠ\n@c0@"
  it: "@aBianca@bPerò, se li tocchi, ti accorgi che hanno la pelle viscida e scivolosa.\n@c0@"
  ja: "@a@bビアンカ「抱きつくと　べとべと…　って\n\tちょっと　気持ち悪いのよね……。\n@c0@"
268:
  de: "@aNera@bDiese Schleime haben so muntere, funkelnde Augen.\n@c0@"
  en: "@aNera@bThe slimes here have such bright, shining eyes.\n@c0@"
  es: "@aNera@bLos occhi de los limos de aquí son muy brillantes.\n@c0@"
  fr: "@aNera@bCes gluants ont vraiment les yeux brillants et lumineux.\n@c0@"
  it: "@aNera@bQuesti Slime hanno gli occhi vispi e allegri.\nSembrano il ritratto della felicità.\n@c0@"
  ja: "@a@bフローラ「ここのスライムさんたちも\n\tすんだ目を　しているのね。\n@c0@"
269:
  de: "@a%0%a001250@bDieser Schleim riecht nach Erdbeeren!\n@c0@"
  en: "@a%0%a001250@bThat slime smells of strawberries!\n@c0@"
  es: "@a%0%a001250@b¡Ese limo huele a fresas!\n@c0@"
  fr: "@a%0%a001250@bCe gluant sent la fraiseⓠ\n@c0@"
  it: "@a%0%a001250@bQuello Slime profuma d'uva!\nNon è che per caso dorme su un cuscino Buonriposo?!\n@c0@"
  ja: "@a@b%a001250「あのスライムさん\n\tイチゴの　においがします。\n@c0@"
270:
  de: "@aOtto@bAll diese Schleime einfach so in der Gegend herumspringen lassen... Ob das so sicher ist?\n@c0@"
  en: "@aTuppence@bI say! These slimes are roaming free.\r\nDo you suppose that's safe?\n@c0@"
  es: "@aAlazar@b¡Pero bueno! Los limos campan a sus anchas aquí.\n¿Tú crees que eso es seguro?\n@c0@"
  fr: "@aInnocent@bC'est fouⓠ Ces gluants se promènent en libertéⓠ\nVous croyez qu'il n'y a pas de risquesⓡ\n@c0@"
  it: "@aSimon@bTutti questi Slime mi rendono inquieto.\nCerchiamo di non farli innervosire, va'...\n@c0@"
  ja: "@a@bピピン「スライムが\n\t放し飼いじゃないですか。\n\tいいんですか？　こんなことで。\n@c0@"
271:
  de: "@aBianca@bTja, man weiß trotzdem nie, was einen im Schlürfodrom erwartet.\n@c0@"
  en: "@aBianca@bYeah, but still, you never can tell what'll happen at the slurpodrome.\n@c0@"
  es: "@aBianca@bYa, pero en realidad no hay forma de saber lo que pasará en el limódromo, ¿sabes?\n@c0@"
  fr: "@aBianca@bSoit, mais on ne sait jamais ce qui peut arriver dans un gluodrome.\n@c0@"
  it: "@aBianca@bSenti che modesto, quello Slime!\n@c0@"
  ja: "@a@bビアンカ「ああは　言ってても\n\tわからないのが\n\tスライムレースなのよね。\n@c0@"
272:
  de: "@a%0%a001240@bDieser Schleim hält die Nase ganz schön hoch, was? Wenn man sich vorstellt, dass er eine Nase hätte, meine ich...\n@c0@"
  en: "@a%0%a001240@bThat one certainly seems to look down its nose at\nthe others, doesn't it? Assuming slimes have noses, that is.\n@c0@"
  es: "@a%0%a001240@bParece que ese limo mira a los demás por encima del hombro, ¿eh? Bueno, si es que los limos tienen hombros, claro.\n@c0@"
  fr: "@a%0%a001240@bOn ne peut pas dire que ce soit le gluant le plus modeste que je connaisse.\n@c0@"
  it: "@a%0%a001240@bⓕInslurperabileⓖ?!\nAh, ho capito! Vuole dire ⓕinsuperabileⓖ! Ho ancora qualche problema a decifrare la lingua degli Slime...\n@c0@"
  ja: "@a@b%a001240「うわ～　すごい鼻息。\n\tスライムって　あったんだね　鼻。\n@c0@"
273:
  de: "@a%0%a001250@bUnd der Schleim riecht nach frischen Blättern.\n@c0@"
  en: "@a%0%a001250@bThat slime smells of fresh leaves.\n@c0@"
  es: "@a%0%a001250@bEse limo huele a hojas frescas.\n@c0@"
  fr: "@a%0%a001250@bCe gluant sent l'herbe fraîchement coupée.\n@c0@"
  it: "@a%0%a001250@bQuello Slime profuma di... paella?!\nNon sarà mica un amico dello zio Sancho?!\n@c0@"
  ja: "@a@b%a001250「あのスライムさん\n\t葉っぱの　においがします。\n@c0@"
274:
  de: "@aSancho@bMöchtest du auf den grünen Schleim setzen, Chico? Hmm...\n@c0@"
  en: "@aSancho@bYou wanna bet on the green eslime, My Majesty? Hmm...\n@c0@"
  es: "@aSancho@b¿Quiere apostar por el limo verde, Majestad?\nMmm...\n@c0@"
