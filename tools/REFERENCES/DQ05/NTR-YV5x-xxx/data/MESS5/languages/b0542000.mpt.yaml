  it: "@aNera@bC'è troppa confusione...\nNon riesco a capire bene cosa dicono...\n@c0@"
  ja: "@a@bフローラ「まわりが　うるさくて\n\t近づかないと　役者さんのセリフが\n\t聞こえないというのは　問題ですわ。\n@c0@"
231:
  de: "@a%0%a001250@bWelch ein hübsches Kleid! So was möchte ich auch eines Tages tragen.\n@c0@"
  en: "@a%0%a001250@bWhat a pretty dress! I hope I get to wear a dress like that one day.\n@c0@"
  es: "@a%0%a001250@b¡Qué precioso vestido! Espero poder llevar uno así algún día.\n@c0@"
  fr: "@a%0%a001250@bQu'elle est jolie sa robeⓠ J'espère que j'en porterai une comme ça un jour.\n@c0@"
  it: "@a%0%a001250@bChe bel vestito ha quella ragazza!\nMi piacerebbe averne uno uguale...\nPapà, me lo compri?\n@c0@"
  ja: "@a@b%a001250「きれいなお洋服……。\n\tいつか　わたしも　着てみたいな。\n@c0@"
232:
  de: "@aSancho@bWenn iss so darüber nachdenke, hat %a001250 ja nisst oft die Gelegenheit, solch ein schönes Kleid zu tragen, no?\n@c0@"
  en: "@aSancho@bYou know, when I theenk about eet now, ees no eso often that %a001250, eshe has a chance to wear a pretty dress, no?\n@c0@"
  es: "@aSancho@bAhorita que pienso, la verdad es que %a001250 apenas tiene la ocasión de llevar un vestido bonito, ¿no, chamaco?\n@c0@"
  fr: "@aSancho@bT-Tu sais, maintenant que j'y pense, je me dis que la p-petite %a001250 n'a pas s-souvent l'occasion de porter une jolie robe.\n@c0@"
  it: "@aSancho@b¡%0%a001250 es más bella de quella señorita, anche si no indossa un vestito tanto maravilloso!\n@c0@"
  ja: "@a@bサンチョ「思えば　%a001250さまは\n\t小さい頃から　旅をなさっているから\n\tドレスを着る機会が少なかったですね。\n@c0@"
233:
  de: "@aOtto@bBei der Göttin! Habt Ihr all die Schminke auf ihrem Gesicht gesehen? Wo bleibt denn da die natürliche Schönheit?\n@c0@"
  en: "@aTuppence@bGood heavens! Did you see all the make-up on her? How's her natural beauty supposed to shine through with all that in the way?\n@c0@"
  es: "@aAlazar@b¡Cielo santo! ¿Has visto todo el maquillaje que llevaba? ¡Así no hay forma de poder disfrutar de su belleza natural!\n@c0@"
  fr: "@aInnocent@bPar la Déesseⓠ Vous avez vu la couche de maquillage qu'elle porteⓡ Comment peut-elle\nrévéler sa vraie beauté avec tout çaⓡ\n@c0@"
  it: "@aSimon@bSanto cielo!\r\nQuella ragazza avrà quattro strati di trucco sul volto! Come minimo!\n@c0@"
  ja: "@a@bピピン「うわ～！　すごい化粧！\n\tあれじゃあ　素顔が　わかりませんよ。\n@c0@"
234:
  de: "@aBianca@bMeinst du, man klettert einfach auf die Bühne und legt los?\n@c0@"
  en: "@aBianca@bD'you think you're s'posed to just get up on stage like that and start warblin' away?\n@c0@"
