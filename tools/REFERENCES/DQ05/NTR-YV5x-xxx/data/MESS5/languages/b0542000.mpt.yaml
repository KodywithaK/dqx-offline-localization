  it: "@aSimon@bIo cerco sempre di divertirmi!\nE a volte ci riesco anche...\n@c0@"
  ja: "@a@bピピン「ボクは　ボクなりに\n\t充分　人生を　楽しんでますよ！\n@c0@"
223:
  de: "@aBianca@bTypisch alter Mann, was? Glaubt, er weiß alles übers Leben, bloß weil seins schon so lange dauert!\n@c0@"
