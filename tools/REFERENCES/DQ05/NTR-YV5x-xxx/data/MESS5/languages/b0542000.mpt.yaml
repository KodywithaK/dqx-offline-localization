331:
  de: "@a%0%a001240@bWas soll das heißen, ich bin kein Mann, der ihr gefällt?! Oh! ... Na ja, eigentlich ist das ganz gut so.\n@c0@"
  en: "@a%0%a001240@bDoes that mean I'm not the man of her liking? Oh! ...Actually, I'm sort of relieved.\n@c0@"
  es: "@a%0%a001240@b¿Eso quiere decir que yo no soy un payo bien guapo? ¡Oh! ... Bueno, en realidad es un alivio.\n@c0@"
  fr: "@a%0%a001240@bOhⓠ Ça veut dire que je ne suis pas à son goûtⓡ\nRemarque, quelque part, ça me rassure.\n@c0@"
  it: "@a%0%a001240@bPer MIA fortuna, non sono ancora abbastanza succulento per i suoi gusti...\n@c0@"
  ja: "@a@b%a001240「ボク　好みの男じゃない？\n\tが～～ん……。\n\tでも　ちょっと　安心……。\n@c0@"
332:
  de: "@a%0%a001250@bIch möchte sowieso nichts über meine Zukunft wissen.\n@c0@"
  en: "@a%0%a001250@bI don't particularly want to hear my\nfortune anyway.\n@c0@"
  es: "@a%0%a001250@bLa verdad es que me da igual que me digan la buenaventura.\n@c0@"
  fr: "@a%0%a001250@bJe n'ai pas vraiment envie de connaître mon avenir, de toute façon.\n@c0@"
  it: "@a%0%a001250@bNon voglio che qualcuno mi predica il futuro!\nE poi, che ne sa lei del mio futuro, eh?\n@c0@"
  ja: "@a@b%a001250「わたしは　べつに\n\t占ってほしくないです……。\n@c0@"
333:
  de: "@aSancho@bManchmal man muss siss in seiner Verzweiflung auch an Strohhalme klammern. Vielleisst es ist gar keine so schlechte Idee, zur Wahrsagerin zu gehen.\n@c0@"
  en: "@aSancho@bEsometimes the drowning man, he clutches at the straws. Maybe ees no esuch a bad idea to listen to the fortune-teller esometimes too.\n@c0@"
  es: "@aSancho@bA veces, el desesperado se agarra a un clavo ardiendo. A lo mejor es una buena idea escuchar qué dice la pitonisa.\n@c0@"
  fr: "@aSancho@bL'homme qui se n-noie cherche à s'aggriper même\nà un brin de p-paille. Alors c'est peut-être oune bonne idée d'écouter les v-v-voyants, parfois.\n@c0@"
  it: "@aSancho@bPotrebbe essere una buena idea consultar esta chiaroveggente, l'importante es que no prendiamo por oro colato todo quel que dice...\n@c0@"
  ja: "@a@bサンチョ「おぼれる者は　わらをも　つかむ\n\tと言います。　たまには　占いに\n\tたよるのも　いいかも知れませんね。\n@c0@"
334:
  de: "@a%0%a001240@bAaah! Ihr Gesicht wird ganz unheimlich, wenn sie in die Zukunft guckt!\n@c0@"
  en: "@a%0%a001240@bYikes! Her face goes all scary when she tells\nyour fortune!\n@c0@"
  es: "@a%0%a001240@b¡Arrea! ¡Cuando te lee el futuro, su cara da miedo!\n@c0@"
  fr: "@a%0%a001240@bAahⓠ Son visage se tord quand elle lit ton avenirⓠ\n@c0@"
  it: "@a%0%a001240@bMamma mia, che risata orribile!\nSe me la sogno di notte, me la faccio sotto!\n@c0@"
  ja: "@a@b%a001240「うわ～　びっくりした。\n\t占うときのおばあさん　すごい顔だね。\n@c0@"
335:
  de: "@a%0%a001250@bVielleicht sollte ich ja auch Wahrsagerin werden, wenn ich groß bin.\n@c0@"
  en: "@a%0%a001250@bMaybe I should become a fortune-teller when I\ngrow up.\n@c0@"
  es: "@a%0%a001250@bA lo mejor podría hacerme adivina de mayor.\n@c0@"
  fr: "@a%0%a001250@bPeut-être que je devrais devenir voyante quand je serai grande.\n@c0@"
  it: "@a%0%a001250@bQuesta donna è inquietante...\n@c0@"
  ja: "@a@b%a001250「わたし……\n\t大きくなったら　占い師さんに\n\tなろうかな……。\n@c0@"
336:
  de: "@aOtto@bDa haben wir aber Glück gehabt, dass sie uns die Zukunft umsonst voraussagt, net wahr, %a000090?\n㈡\nTja, in Fortuna muss man auch mal Glück haben!\n@c0@"
  en: "@aTuppence@bIt's rather fortunate that she'd give us a reading for free, isn't it, %a000090?\n...Ha ha! Fortunate! I'm an accidental comedian!\n@c0@"
  es: "@aAlazar@bQué buena suerte que te haya dicho la buenaventura gratis, ¿eh, %a000090?\n㈡\nBuena suerte... buena ventura... ¡Ja! ¡Soy cómico hasta sin quererlo!\n@c0@"
  fr: "@aInnocent@bVous aviez prédit qu'elle ne vous ferait pas payer, %a000090ⓡ ... Ha haⓠ Je suis vraiment un boute-en-trainⓠ\n@c0@"
  it: "@aSimon@bE se le chiedessi quando e dove incontrerò la mia futura moglie? E cosa dovrò fare per conquistarla? Ciò faciliterebbe la mia ricerca...\n@c0@"
  ja: "@a@bピピン「ただで　みてもらえるなんて\n\tラッキーですね　%a000090さま。\n@c0@"
337:
  de: "@a%0%a001240@bWillst du nicht, dass sie uns die Zukunft voraussagt? Schade, ich hatte mich so darauf gefreut...\n@c0@"
  en: "@a%0%a001240@bDon't you want her to tell our fortune?\nI was looking forward to that.\n@c0@"
  es: "@a%0%a001240@b¿No quieres que nos lea el futuro?\nVaya, con lo que me apetecía.\n@c0@"
  fr: "@a%0%a001240@bTu ne veux pas qu'elle nous dise notre avenirⓡ\nMoi, j'aurais bien aimé.\n@c0@"
  it: "@a%0%a001240@bMa io ero curioso di sapere cosa mi riserva il futuro!\nVoglio scoprire quanto diventerò alto!\n@c0@"
  ja: "@a@b%a001240「占ってもらわないの？\n\tせっかく来たのに～。\n@c0@"
338:
  de: "@aOtto@bJa, die Wahrsagerei ist eine heikle Angelegenheit. Vielleicht ist es besser, kein Geld dafür auszugeben.\n@c0@"
  en: "@aTuppence@bYes, fortune-telling can be a bit hit-and-miss. Maybe it's not worth paying any attention to it all.\n@c0@"
  es: "@aAlazar@bYo creo que lo de adivinar el futuro es un poco ensayo y error. No creo que valga la pena hacerle ni caso.\n@c0@"
  fr: "@aInnocent@bOui, la voyance me paraît plutôt aléatoire. Ça ne vaut peut-être pas le coup de s'attarder là-dessus.\n@c0@"
  it: "@aSimon@bMaestà, rispetto la sua scelta e anzi la condivido!\r\nTuttavia, non potremmo chiedere a questa simpatica donna qualcosa sul mio futuro in amore, eh?\n@c0@"
  ja: "@a@bピピン「まあ　当たったり\n\t当たらなかったりするのが\n\t占いですからねえ。\n@c0@"
339:
  de: "@aBianca@bDich kann so was nicht abhalten, was? Du musst deine Nase ja in alles reinstecken...\n@c0@"
  en: "@aBianca@bI'm sure that won't stop you, eh? You just have to poke your nose in everywhere, dun't you?\n@c0@"
  es: "@aBianca@bPero eso no te va a detener, ¿eh? ¡Siempre tienes que meter la nariz en todos lados!\n@c0@"
  fr: "@aBianca@bJe suis sûre que çe n'est pas ça qui va t'arrêter.\nC'est plus fort que toi, il faut toujours que tu fourres ton nez partout, heinⓡ\n@c0@"
  it: "@aBianca@bCerto che no!\nNon voglio mica entrare in un bagno già occupato, io!\n@c0@"
  ja: "@a@bビアンカ「でも　%a000090なら　きっと\n\tのぞいちゃうわよね。\n\t何にでも　きょうみ　あるんだもん。\n@c0@"
340:
  de: "@aNera@bNa, dann lassen wir den Guten am besten in Ruhe sein Bad genießen, nicht wahr, %a000090?\n@c0@"
  en: "@aNera@bWell it's probably best not to go barging in there then, okay, %a000090?\n@c0@"
  es: "@aNera@b¡Umf! ¡¿Ma tú crees que tengo cara de ser de las que espían a las personas mientras se bañan?!\n@c0@"
  fr: "@aNera@bMmpfⓠ Ai-je vraiment l'air de quelqu'un qui n'a pas la patience d'attendre son tourⓡ\n@c0@"
  it: "@aNera@bTi conosco troppo bene e so che il suo avvertimento t'è entrato da un orecchio e t'è uscito dall'altro.\nScommetto che muori dalla voglia di entrare!\n@c0@"
  ja: "@a@bフローラ「ムッ……。\n\t私は　とのがたのお風呂を\n\tのぞいたりしませんわっ！\n@c0@"
341:
  de: "@a%0%a001250@bIch würde jetzt auch gern ein Bad nehmen.\n@c0@"
  en: "@a%0%a001250@bI quite fancy having a bath now.\n@c0@"
  es: "@a%0%a001250@bAhora me apetece tomar un baño.\n@c0@"
  fr: "@a%0%a001250@bEn fait, ça me dirait bien de prendre un bain.\n@c0@"
  it: "@a%0%a001250@bSperiamo che non ci metta molto...\nAvrei una certa urgenza, ehm...\n@c0@"
  ja: "@a@b%a001250「わたしも　お風呂\n\t入りたくなっちゃいました……。\n@c0@"
342:
  de: "@aOtto@bAls ob ich da einfach so reinplatzen würd'! Ich weiß doch schließlich, was sich g'hört!\n@c0@"
  en: "@aTuppence@bHow rude! As if I'd barge in on someone while they were busy!\n@c0@"
  es: "@aAlazar@b¡Qué grosería! ¡Cómo voy a interrumpir a un hombre mientras se baña!\n@c0@"
  fr: "@aInnocent@bQuelle grossièretéⓠ Comme si c'était mon genre d'aller déranger les gens pendant qu'ils se détendentⓠ\n@c0@"
  it: "@aSimon@bNon entrerei mai in un bagno occupato da un uomo!\n...\n...\n㈡\nD'accordo, d'accordo...\nNon entrerei mai nemmeno in un bagno occupato da una donna. Così va bene, Maestà?\n@c0@"
  ja: "@a@bピピン「し　失礼な！\n\t誰が　男の風呂なんて……！\n@c0@"
343:
  de: "@aBianca@bFrechheit! Woher sollten wir denn wissen, dass er da drin ist?\n@c0@"
  en: "@aBianca@bWhat a cheek! How were we s'posed to know he was in 'ere?\n@c0@"
  es: "@aBianca@b¡Vaya carácter! ¿Cómo íbamos a saber que estaba ahí dentro?\n@c0@"
  fr: "@aBianca@bQuelle amabilitéⓠ Et comment on était censés savoir qu'il était làⓡ\n@c0@"
  it: "@aBianca@bE a noi cosa interessa che sua moglie ha già fatto il bagno?!\nNon volevamo mica vedere come si lava!\n@c0@"
  ja: "@a@bビアンカ「失礼ねっ！\n\t私たちが　のぞきをするとでも\n\t思っているのかしら。\n@c0@"
344:
  de: "@aNera@bDas war aber nicht sehr nett. Ist es denn unsere Schuld, dass sein Badezimmer keine Tür hat?\n@c0@"
  en: "@aNera@bWell, that's not very nice. It's not our fault there's no door on the bathroom.\n@c0@"
  es: "@aNera@b¡Si es culpa de alguien, es suya, por no tener porta en el bagno!\n@c0@"
  fr: "@aNera@bIl n'est pas très aimable. Ce n'est pas de notre faute si la salle de bain n'est pas fermée.\n@c0@"
  it: "@aNera@bMa perché non mette una porta al bagno?!\nSe lo facesse, sua moglie non correrebbe il rischio di essere disturbata!\n@c0@"
  ja: "@a@bフローラ「もとは　といえば　お風呂に\n\tドアがないから　いけないんですわ。\n\tぽっ……。\n@c0@"
345:
  de: "@aSancho@bDiese Señor, wir sollten ihn besser lassen in Ruhe, eh? Si, hier gibt es nissts für uns zu sehen. Gehen wir.\n@c0@"
  en: "@aSancho@bThees señor, we should leave heem een peace, no? Sí, there ees notheeng to esee here. Ees time for us to leave.\n@c0@"
  es: "@aSancho@bEste señor y esta señora solo piensan en ellos, nomás. No hay nada que ver aquí. Será mejor irse, chamaco.\n@c0@"
  fr: "@aSancho@bCe señor, on ferait peut-être m-mieux de le laisser t-tranquille, noⓡ Il n'y a r-rien d'intéressant ici. Autant p-partir.\n@c0@"
  it: "@aSancho@bVamos, chico.\nNo ce está nada da vedere aquí.\n@c0@"
  ja: "@a@bサンチョ「たがいを思いやる　仲のいい\n\t夫婦ということでいいでしょう。\n\tさあ　もう　行きますよ。\n@c0@"
346:
  de: "@aOtto@bDas nächste Mal sollten wir unseren Besuch wohl vorher ankündigen, %a000090.\n@c0@"
  en: "@aTuppence@bWe'll have to time things more appropriately next time, %a000090.\n@c0@"
  es: "@aAlazar@bEste no sabe con quién está hablando, %a000090.\n@c0@"
  fr: "@aInnocent@bQuel sauvage, ce typeⓠ Ce n'est quand même pas la fin du monde...\n@c0@"
  it: "@aSimon@bPeccato, Maestà... Siamo arrivati tardi.\nEhm, volevo dire che è tardi, e non abbiamo tempo da perdere qui... Già, proprio così... Ehm...\n@c0@"
  ja: "@a@bピピン「%a000090さま　次からは\n\tもっと早く来ましょう。\n@c0@"
347:
  de: "@aBianca@bWahrscheinlich würden wir unter normalen Umständen auch so denken, aber da eines unserer Kinder der legendäre Held ist...\n@c0@"
  en: "@aBianca@bWe would've probably felt the same under normal circumstances, but it's a bit different when one of your kids is the legendary hero, eh?\n@c0@"
  es: "@aBianca@bEn circunstancias normales nosotros también pensaríamos así, pero si uno de tus hijos es el héroe legendario es distinto, ¿eh?\n@c0@"
  fr: "@aBianca@bEn temps normal, nous aurions sûrement dit la même chose, mais c'est un peu différent quand l'un de vos enfants est le héros légendaire, heinⓡ\n@c0@"
  it: "@aBianca@bAnche se nostro figlio è l'Eroe Leggendario, sarei comunque preoccupata se andasse a giocare fuori dal villaggio! Questi sono tempi pericolosi!\n@c0@"
  ja: "@a@bビアンカ「私たちも　同じ心配を\n\tするはずだったんだけど…\n\t子供が　勇者だったんじゃ　ねえ？\n@c0@"
348:
  de: "@aNera@bJeder will eine Welt ohne Ungeheuer, aber es wäre doch schade, wenn dann all die netten Ungeheuer ebenfalls verschwinden würden.\n@c0@"
  en: "@aNera@bEveryone wants a world without horrible monsters, but it would be a shame if all the nice monsters had to disappear too.\n@c0@"
  es: "@aNera@bTodo el mundo quiere un mundo sin mostri horribile, pero sería una lástima que despareciesen también los simpáticos.\n@c0@"
  fr: "@aNera@bTout le monde rêve d'un monde sans monstres,\r\nmais ce serait tout de même dommage si tous\r\nles gentils monstres disparaissaient, eux aussi.\n@c0@"
  it: "@aNera@bSì, i mostri sono creature pericolose.\nPerò non è che gli esseri umani siano tutti bravi e belli...\n@c0@"
  ja: "@a@bフローラ「魔物の出ない世の中には\n\tあこがれますけど　いい魔物さんまで\n\tいなくなってしまうのは　イヤですわ。\n@c0@"
349:
  de: "@a%0%a001240@bIch dachte immer, dass ich nicht viel zum Spielen komme, aber bei anderen Kindern scheint es ja auch nicht anders zu sein.\n@c0@"
  en: "@a%0%a001240@bI used to think I didn't get much chance to play, but it doesn't look like most other kids do either.\n@c0@"
  es: "@a%0%a001240@bMuchas veces pensaba que apenas tenía oportunidad de jugar, pero parece que a los otros niños les pasa igual.\n@c0@"
  fr: "@a%0%a001240@bJe me disais que je ne jouais pas beaucoup, mais apparemment, c'est la même chose pour les autres enfants.\n@c0@"
  it: "@a%0%a001240@bPapà, quando il nostro viaggio sarà finito, mi lascerai uscire dal castello per andare a giocare?\n@c0@"
  ja: "@a@b%a001240「ボク　あんまり遊べないって\n\t思ってたけど　本当は　ほかの子たちも\n\tそんなに　遊べてなかったんだね。\n@c0@"
350:
  de: "@a%0%a001250@bEs macht Spaß, auf Reisen zu sein, aber manchmal denke ich, wie schön es doch wäre, zu Hause ein ganz normales Leben zu führen.\n@c0@"
  en: "@a%0%a001250@bIt's fun travelling about together, but I sometimes think how nice it would be if we could all just live normal, quiet lives at home.\n@c0@"
  es: "@a%0%a001250@bEs divertido viajar juntos, pero a veces pienso cómo sería tener una vida tranquila y normal en casa.\n@c0@"
  fr: "@a%0%a001250@bJ'aime bien voyager, mais parfois, je me dis que ce serait bien aussi d'être à la maison et d'avoir une vie normale.\n@c0@"
  it: "@a%0%a001250@bPapà, la signora ha ragione.\nIn questo periodo non è prudente che i bambini vadano a giocare fuori dai centri abitati...\n@c0@"
  ja: "@a@b%a001250「旅も　楽しいけど\n\t家族みんなで　おうちで\n\tゴロゴロするのって　いいよね。\n@c0@"
351:
  de: "@aBianca@bIch hab's gar nicht gern, wenn ich andere Frauen so mit dir reden höre. Aber das ist wohl typisch Ehefrau, was?\n@c0@"
  en: "@aBianca@bI dun't much like hearin' other women chattin' you up. I s'pose that's a wife's prerogative, eh?\n@c0@"
  es: "@aBianca@bNo me gusta que otras mujeres intenten ligar contigo. Eso es cosa de tu señora, ¿me entiendes?\n@c0@"
  fr: "@aBianca@bJe n'aime pas trop que les autres femmes t'abordent pour te faire du gringue. C'est une prérogative d'épouse ça, nonⓡ\n@c0@"
  it: "@aBianca@bSe quella smorfiosa non la smette di farti gli occhi dolci le spacc...\nOh, santa dea! Non credevo di essere così gelosa!\n@c0@"
  ja: "@a@bビアンカ「妻として　夫をほめられるのは\n\t悪い気が　しないわね。\n@c0@"
352:
  de: "@aNera@bAnscheinend bin ich nicht die Einzige, die dich attraktiv findet, %a000090!\n@c0@"
  en: "@aNera@bIt seems I'm not the only one who finds you so attractive, %a000090!\n@c0@"
  es: "@aNera@b¡Parece que no soy la única que te encuentra seducente, %a000090!\n@c0@"
  fr: "@aNera@bJ'ai l'impression que je ne suis pas la seule à te trouver attirant, %a000090ⓠ\n@c0@"
  it: "@aNera@bSembra proprio che io non sia l'unica donna a trovarti attraente, %a000090...\n@c0@"
  ja: "@a@bフローラ「やっぱり　あなたは\n\t誰から見ても　ハンサムなんですね。\n\tぽっ……。\n@c0@"
353:
  de: "@a%0%a001250@bEs ist lustig, dass sie so mit dir spricht.\n@c0@"
  en: "@a%0%a001250@bIt's funny hearing her talk to you like that.\n@c0@"
  es: "@a%0%a001250@b¡Qué gracioso es oírla hablarte así!\n@c0@"
  fr: "@a%0%a001250@bC'est drôle d'entendre une dame te parler comme ça.\n@c0@"
  it: "@a%0%a001250@bEh eh eh!\nPapà, hai fatto colpo!\nEh eh eh eh eh!\n@c0@"
  ja: "@a@b%a001250「お父さんは\n\tお兄さんじゃないの……。\n@c0@"
354:
  de: "@aOtto@bJa, manche Leute können es auf einen Blick erkennen... Meinen natürlichen Charme, meine ich natürlich.\n@c0@"
  en: "@aTuppence@bSome people just have an eye for it, you see.\r\nI'm referring to my sex appeal, of course.\n@c0@"
  es: "@aAlazar@bHay personas con un ojo clínico natural, claro.\nPara mi sex appeal, me refiero.\n@c0@"
  fr: "@aInnocent@bVous voyez, certaines personnes ont vraiment l'œil.\r\nElles succombent tout de suite à mon charme irrésistible.\n@c0@"
  it: "@aSimon@bIl bel Simon ha colpito ancora!\r\nEhm, la ragazza ce l'aveva con me, vero...?\n@c0@"
  ja: "@a@bピピン「やっぱり　わかる人には\n\tわかってしまうのか。\n\tこの　ボクの美しさが…　ふっ……。\n@c0@"
355:
  de: "@aBianca@bUnd trotzdem trinkt er weiter. So schlimm kann es also nicht sein!\n@c0@"
  en: "@aBianca@bAnd yet he takes another sip, so it can't be all\r\nthat bad!\n@c0@"
  es: "@aBianca@b¡Y aún así bebe más! ¡Será que no son tan malas, entonces!\n@c0@"
  fr: "@aBianca@bÇa ne doit pas être si mauvais que ça pour qu'il en reprenne une gorgéeⓠ\n@c0@"
  it: "@aBianca@bLe bevande saranno anche annacquate, ma la cosa non deve importargli molto, a giudicare da quanto sta bevendo!\n@c0@"
  ja: "@a@bビアンカ「そんなこと考えながら\n\t飲んでるから　まずく\n\t感じるんじゃないかしら？\n@c0@"
356:
  de: "@a%0%a001240@bOoh! Vielleicht hat der Wirt die Getränke ja mit Wasser verdünnt!\n@c0@"
  en: "@a%0%a001240@bOoh! I wonder if the landlord watered them down!\n@c0@"
  es: "@a%0%a001240@b¡Oooh! ¡A lo mejor el dueño les añade agua!\n@c0@"
  fr: "@a%0%a001240@bOhⓠ Je me demande si le tavernier ne coupe pas ses boissons avec de l'eauⓠ\n@c0@"
  it: "@a%0%a001240@bMonete ⓕannacquateⓖ!\nIh ih ih!\nCarina, questa!\n@c0@"
  ja: "@a@b%a001240「ふ～ん…\n\tバーテンさん　ケチったのかなあ。\n@c0@"
357:
  de: "@aSancho@bEs hängt von deine Laune ab, wie Alkohol schmeckt, weißt du.\n@c0@"
  en: "@aSancho@bThe taste of the alcohol, eet depends on your own mood, you know.\n@c0@"
  es: "@aSancho@bEl sabor del alcohol cambia según uno se siente.\n@c0@"
  fr: "@aSancho@bLe g-goût d'une b-boisson, ça dépend aussi de t-ton humeur.\n@c0@"
  it: "@aSancho@b¿ⓕMonedas annacquatasⓖ?\n¿Forse intendeva dire ⓕdinero liquidoⓖ?\n@c0@"
  ja: "@a@bサンチョ「酒は　飲むときの気分によっても\n\tずいぶん味が　変わるもんです。\n@c0@"
358:
  de: "@aSancho@bWenn du glückliss bist, es schmeckt wie flüssige Paella. Aber wenn du traurig bist, dann... (Schnief)\n@c0@"
  en: "@aSancho@bWhen you are happy, eet tastes like the liquid paella. But when you are esad, ees, ees... (sniff)\n@c0@"
  es: "@aSancho@bSi eres feliz, es como una enchilada líquida. Si estás triste es, es... (snif)\n@c0@"
  fr: "@aSancho@bQuand t-tu es content, c'est comme une paella liquide. Mais quand t-tu es triste, c'est... (sanglot)\n@c0@"
  it: "@aSancho@b¡No! ¡Ahora entiendo!\r\n¡Quell'hombre vuole pagare con monedas falsas!\r\n¡Ay, que mascalzon!\n@c0@"
  ja: "@a@bサンチョ「楽しいときのお酒は\n\tおいしいですが…\n\t悲しいときのお酒は……。\n@c0@"
359:
  de: "@aBianca@bDank meinen Eltern hatte ich eine wunderbare Kindheit. Sie haben immer gut auf mich aufgepasst.\n@c0@"
  en: "@aBianca@bMum and Dad gave me a brilliant childhood.\r\nThey always took good care of me.\n@c0@"
  es: "@aBianca@bMi madre y mi padre me dieron una infancia fenomenal.\r\nSiempre me cuidaron bien, ¿sabes?\n@c0@"
  fr: "@aBianca@bGrâce à maman et papa, j'ai eu une enfance géniale. Ils ont toujours pris bien soin de moi.\n@c0@"
  it: "@aBianca@bMio padre e mia madre sono stati ottimi genitori. Non mi hanno mai fatto mancare nulla, e mi hanno sempre dato tutto l'affetto di cui un figlio ha bisogno.\n@c0@"
  ja: "@a@bビアンカ「私は　お父さんとお母さんに\n\t大事に　育ててもらって\n\tすごく幸せだったな……。\n@c0@"
360:
  de: "@aBianca@bAls meine Mutter tot war, war die Familie eine Weile etwas geschrumpft. Aber jetzt bist du ja dazugekommen, also sind wir wieder zu dritt.\n@c0@"
  en: "@aBianca@bWith Mum gone, the family got a bit smaller for\r\na while. But now you've joined, so we're back up\r\nto three.\n@c0@"
  es: "@aBianca@bSin mi madre, la familia se redujo un poco durante un tiempo. Pero ahora que estás tú, volvemos a ser tres.\n@c0@"
  fr: "@aBianca@bÀ la mort de maman, la famille s'est un peu réduite, mais maintenant que tu en fais partie, nous sommes\r\nà nouveau trois.\n@c0@"
  it: "@aBianca@bQuando mia madre è morta, ho avvertito una sensazione di vuoto nel cuore.\nPoi sei arrivato tu, e l'hai riempito d'amore...\n@c0@"
  ja: "@a@bビアンカ「お母さんは　死んじゃって\n\t家族がへっちゃったけど\n\t%a000090っていう　家族がふえたし。\n@c0@"
361:
  de: "@aBianca@bUnd jetzt haben wir %a001240 und %a001250. Es gibt so viel, wofür wir dankbar sein müssen, selbst wenn die Zeiten schwer sind.\n@c0@"
  en: "@aBianca@bAnd now we have %a001240 and %a001250. We've got so much to be thankful for, even though times are tough.\n@c0@"
  es: "@aBianca@bY ahora tenemos a %a001240 y %a001250. Aunque es una mala época, podemos dar gracias por todo lo que tenemos, ¿sabes?\n@c0@"
  fr: "@aBianca@bEt maintenant, nous avons aussi %a001240 et %a001250. Même si les temps sont durs, nous pouvons nous estimer heureux.\n@c0@"
  it: "@aBianca@b%0%a000090, dobbiamo essere degli ottimi genitori per %a001250 e %a001240.\n㈡\nDobbiamo allevarli nel miglior modo possibile, dimostrando loro tutto l'amore e la comprensione di cui siamo capaci.\n@c0@"
  ja: "@a@bビアンカ「%a001240も%a001250も　いるし\n\tきつい旅だけど　幸せよ。\n@c0@"
362:
  de: "@aNera@bWir waren lange Zeit getrennt, aber jetzt bin ich sehr froh, dass wir wieder zusammen sind.\n@c0@"
  en: "@aNera@bWe were separated for a long time, but I'm truly happy now that we've been reunited.\n@c0@"
  es: "@aNera@bEstuvimos molto tempo separados, pero sono felice de que estemos juntos de nuevo.\n@c0@"
  fr: "@aNera@bNous avons été séparés pendant longtemps, mais je suis heureuse que nous soyons à nouveau ensemble.\n@c0@"
  it: "@aNera@bSiamo stati separati per tanto tempo, ma ora ci siamo finalmente ritrovati...\n@c0@"
  ja: "@a@bフローラ「長い間　いっしょに\n\tいられなかったけど　私　こうして\n\tもどることができて　本当に幸せよ。\n@c0@"
363:
  de: "@aNera@bEs ist wirklich das Schönste im Leben, eine Familie zu haben.\n@c0@"
  en: "@aNera@bIt really is the best thing in the world to have\r\na family.\n@c0@"
  es: "@aNera@bLa familia es lo mejor del mondo.\n@c0@"
  fr: "@aNera@bAvoir une famille est vraiment la chose la plus belle au monde.\n@c0@"
  it: "@aNera@bNon esiste cosa più bella al mondo che stare insieme alla propria famiglia!\n@c0@"
  ja: "@a@bフローラ「家族がいるって\n\t本当に　いいわね。\n@c0@"
364:
  de: "@a%0%a001240@bEs gibt eine Menge Häuser in dieser Stadt. Ich werde mich bestimmt verlaufen.\n@c0@"
  en: "@a%0%a001240@bThere's lots of houses here in this town, isn't there? I'm bound to get lost.\n@c0@"
  es: "@a%0%a001240@bEn esta ciudad hay montones de casas, ¿verdad? Seguro que me pierdo.\n@c0@"
  fr: "@a%0%a001240@bIl y a beaucoup de maisons dans cette ville, heinⓡ\nJe suis sûr que je vais me perdre.\n@c0@"
  it: "@a%0%a001240@bQuesto posto è pieno di case.\nSe fossi da solo, mi perderei di sicuro...\n@c0@"
  ja: "@a@b%a001240「この町って　おうちが多いよね。\n\t迷子になりそうだよ。\n@c0@"
365:
  de: "@a%0%a001250@bIch kann alles schaffen, solange ihr nur alle bei mir seid.\n@c0@"
  en: "@a%0%a001250@bI can do anything as long as you're all with me.\n@c0@"
  es: "@a%0%a001250@bPuedo hacer lo que sea, siempre que estéis todos conmigo.\n@c0@"
  fr: "@a%0%a001250@bJe me sens capable de tout tant que tu es avec moi.\n@c0@"
  it: "@a%0%a001250@bPapà, per me ritrovarti è stata una gioia immensa!\nE anche per %a001240!\n@c0@"
  ja: "@a@b%a001250「わたし　お父さんたちが\n\tいてくれるから　がんばれるの。\n@c0@"
366:
  de: "@aSancho@bDeine Onkel Sancho, er hat keine Familia. Für miss, Señor Ludwig war meine Familia. Aber da er jetzt nisst mehr da ist... (Schluchz)\n@c0@"
  en: "@aSancho@bYour Uncle Sancho, he no have a family now.\r\nFor me, señor Pankraz, he was my family.\r\nBut now he ees no lon... No longer... (sob)\n@c0@"
  es: "@aSancho@bAhorita, tito Sancho no tiene familia.\nPara mí, la familia era el señor Teudis.\nPero ahora él ya no... Ya no... (snif)\n@c0@"
  fr: "@aSancho@bT-Ton oncle Sancho, il a n'a plus de f-famille, maintenant. Le señor P-Petros était ma seule famille. Mais aujourd'hui, il n'est plus... plus... (sanglot)\n@c0@"
  it: "@aSancho@bPor mi, el señor Russel era como un hermano, era toda la mia familia... Poi es muerto y...\nYo... Yo me commuovos... ¡Sob!\n㈡\nNo, no esto piangendo por el dispiacere...\nEsto piangendo de gioia, por qué contigo ho trovato una nueva familia, chico...\n@c0@"
  ja: "@a@bサンチョ「私には　家族は　いませんが\n\tパパスさまには　家族のように\n\t接していただきました　うっうっ……。\n@c0@"
367:
  de: "@aOtto@bWie es Mutter wohl ergeht?\n@c0@"
  en: "@aTuppence@bI wonder how Mother is getting along.\n@c0@"
  es: "@aAlazar@bMe pregunto cómo le irá a mamá.\n@c0@"
  fr: "@aInnocent@bJe me demande comment va maman.\n@c0@"
  it: "@aSimon@bChissà come sta mia madre...\nSob!\nNo, non sto piangendo! Sob!\n㈡\nM'è solo entrato un moscerino in un occhio...\n@c0@"
  ja: "@a@bピピン「母さん　どうしているかなあ……。\n@c0@"
368:
  de: "@aBianca@bDer muss es ja faustdick hinter den Ohren haben, wenn er jeden Abend in der Schänke sitzt.\n@c0@"
  en: "@aBianca@bHe must be a feisty old man to spend every night down the pub like that.\n@c0@"
  es: "@aBianca@b¡Vaya viejo más chungo, noche sí noche también en la taberna!\n@c0@"
  fr: "@aBianca@bÇa doit être un fêtard, le papi, pour passer toutes ses nuits à la taverne, comme ça.\n@c0@"
  it: "@aBianca@bIl nonno se n'è andato di nuovo alla taverna?\nPerò! Arzillo il vecchietto, eh?\n@c0@"
  ja: "@a@bビアンカ「毎晩　酒場に　いりびたりなんて\n\t元気なおじいさんね。\n@c0@"
369:
  de: "@aNera@bIch hoffe, der alte Mann übertreibt es nicht mit seinen Besuchen in der Schänke.\n@c0@"
  en: "@aNera@bI hope that old fellow isn't drinking to excess with all those pub visits.\n@c0@"
  es: "@aNera@bVeramente, espero que ese anciano no enferme con tantas visitas a la taberna.\n@c0@"
  fr: "@aNera@bJ'espère que ce vieil homme ne boit pas trop\r\nquand il se rend à la taverne comme ça.\n@c0@"
  it: "@aNera@bSuvvia, un po' di comprensione!\nQualche visitina alla taverna non ha mai ucciso nessuno, no?\n@c0@"
  ja: "@a@bフローラ「その　おじいさま\n\t飲みすぎてないと　いいですわね。\n@c0@"
370:
  de: "@a%0%a001240@bWarum verbringen Erwachsene so viel Zeit in der Schänke? Ich verstehe das nicht.\n@c0@"
  en: "@a%0%a001240@bWhy do grown-ups all spend so much time at the pub? I don't get it.\n@c0@"
  es: "@a%0%a001240@b¿Por qué las personas mayores pasan tanto tiempo en la taberna? No lo entiendo.\n@c0@"
  fr: "@a%0%a001240@bPourquoi est-ce que les adultes passent autant de temps dans les tavernesⓡ Je ne comprends pas.\n@c0@"
  it: "@a%0%a001240@bCosa ci troveranno di tanto interessante nelle taverne gli adulti? Io mi diverto di più all'aperto, a giocare a nascondino o a correre nei prati!\n@c0@"
  ja: "@a@b%a001240「どうして　おとなの人は\n\tみんな　酒場へ　行っちゃうのかな？\n\tボクには　わからないな。\n@c0@"
371:
  de: "@aSancho@bDie Alkohol ist nisst gut, weißt du. Ob du jung bist oder alt ⓚⓛ zu viel trinken ist niemals gut, Chico.\n@c0@"
  en: "@aSancho@bThe alcohol, ees all poison, you know. When you are young, and when you are old. Ees no good to dreenk too much.\n@c0@"
  es: "@aSancho@bEl alcohol es veneno nomás, chamaco. Si eres joven, y si eres viejo también. Tomar demasiado es malo.\n@c0@"
  fr: "@aSancho@bL'alcool, c'est du p-poison, tu sais. Qu'on soit\r\nj-jeune ou vieux, ce n'est pas b-bon de boire trop.\n@c0@"
  it: "@aSancho@bA mi me gusta mucho andare nellas tavernas, ma solo si nel menu ce está anche la paella.\n@c0@"
  ja: "@a@bサンチョ「若いうちのお酒も毒ですが\n\t年を取ってからのお酒も毒ですよ。\n\t飲みすぎてないと　いいですね。\n@c0@"
372:
  de: "@aBianca@bEs wirkt ziemlich normal für das Haus einer Wahrsagerin.\n@c0@"
  en: "@aBianca@bIt's a pretty normal-lookin' place for a\r\nfortune-teller's house.\n@c0@"
  es: "@aBianca@bPara ser la casa de una adivina, parece un sitio de lo más normal.\n@c0@"
  fr: "@aBianca@bÇa a l'air plutôt normal ici. On ne dirait pas qu'il s'agit de la maison d'une diseuse de bonne aventure.\n@c0@"
  it: "@aBianca@bQuesto è lo studio di una chiaroveggente?\nA me sembra una casa come tante altre...\n@c0@"
  ja: "@a@bビアンカ「占い師の家といっても\n\tけっこう　ふつうなのね。\n@c0@"
373:
  de: "@aNera@bIch habe von der Wahrsagerin hier schon gehört, als ich im Stift war. Es heißt, sie liegt manchmal ganz schön daneben.\n@c0@"
  en: "@aNera@bI heard talk of the fortune-teller here when I was at the abbey. Apparently, her readings can be a bit hit and miss.\n@c0@"
  es: "@aNera@bCuando estuve en la abadía oí hablar de questa adivina. Sembra que le sue divinazione son un poco por ensayo y error.\n@c0@"
  fr: "@aNera@bQuand j'étais à l'abbaye, j'ai entendu parler de cette diseuse de bonne aventure. Apparemment,\r\nses prédictions sont un peu inégales.\n@c0@"
  it: "@aNera@bHo sentito parlare di questa chiaroveggente quando ero all'abbazia. Pare che sappia il fatto suo, anche se ha un modo un po' particolare di presentarsi...\n@c0@"
  ja: "@a@bフローラ「修道院にいた頃　聞いた話では\n\tここの占い師さんの話は　当たるときと\n\t当たらないときが　あるそうです。\n@c0@"
374:
  de: "@a%0%a001250@bGlaubst du, dass er so lange wartet, bis sie nach Hause kommt? Das ist nett von ihm.\n@c0@"
  en: "@a%0%a001250@bDo you think he's waiting up for her to come home? That's nice of him.\n@c0@"
  es: "@a%0%a001250@b¿Crees que está esperando que vuelva a casa? Qué bonito.\n@c0@"
  fr: "@a%0%a001250@bTu crois qu'il attend qu'elle revienneⓡ\nC'est gentil de sa part.\n@c0@"
  it: "@a%0%a001250@bNon mi sembra che quel signore abbia molta fiducia nelle capacità di sua nonna...\n@c0@"
  ja: "@a@b%a001250「あのおじさん\n\tおばあさんの帰りを　待ってるのかな？\n\tおりこうさんね。\n@c0@"
375:
  de: "@aBianca@bWie oft soll ich dir noch sagen, dass es sinnlos ist, mit Leuten zu reden, wenn sie gerade schlafen?!\n@c0@"
  en: "@aBianca@bHow many times do I have to tell you that you shouldn't go tryin' to start conversations with folk while they're sleepin'?\n@c0@"
  es: "@aBianca@b¿Cuántas veces te lo tengo que decir? ¡No te pongas a hablar con la gente mientras está durmiendo!\n@c0@"
  fr: "@aBianca@bCombien de fois il va falloir que je te répète que ça ne sert pas à grand-chose d'essayer de parler aux gens pendant leur sommeilⓡ\n@c0@"
  it: "@aBianca@bMa insomma!\nQuand'è che ti toglierai il vizio di parlare alla gente che dorme, eh?!\n@c0@"
  ja: "@a@bビアンカ「また　%a000090ったら\n\t寝てる人にまで　話しかけて……。\n@c0@"
376:
  de: "@aNera@bDu solltest wirklich keine Frauen im Schlaf stören, %a000090.\n@c0@"
  en: "@aNera@bYou really shouldn't intrude on a woman while she's sleeping, %a000090.\n@c0@"
  es: "@aNera@bNo es bonito que interrumpas a una donna mientras está en la cama durmiendo, %a000090.\n@c0@"
  fr: "@aNera@bTu ne devrais pas déranger une femme pendant qu'elle dort, %a000090.\n@c0@"
  it: "@aNera@b%0%a000090, non vedi che sta dormendo?\nLe parlerai più tardi, quando sarà sveglia...\n@c0@"
  ja: "@a@bフローラ「あなた　女性の寝顔を\n\tのぞくものじゃありませんわ。\n@c0@"
377:
  de: "@a%0%a001240@bWas ist mir ihren Ohren los?!\n@c0@"
  en: "@a%0%a001240@bWhat's going on with her ears!?\n@c0@"
  es: "@a%0%a001240@b¡Qué le pasa, ¿es que no te oye?!\n@c0@"
  fr: "@a%0%a001240@bElle a des oreilles bizarres, nonⓡ\n@c0@"
  it: "@a%0%a001240@bChissà cosa sta sognando...\n@c0@"
  ja: "@a@b%a001240「あの耳　どうなってるんだろ？\n\tおもしろ～い。\n@c0@"
378:
  de: "@aOtto@bHäschenmädels sind ja so entzückend, wenn sie schlafen!\n@c0@"
  en: "@aTuppence@bBunny girls are cute even when they're sleeping!\n@c0@"
  es: "@aAlazar@b¡Las conejitas están guapas hasta cuando duermen!\n@c0@"
  fr: "@aInnocent@bLes serveuses sont jolies même quand elles dormentⓠ\n@c0@"
  it: "@aSimon@bChe carina questa ragazza!\r\nAh, quanto mi piacerebbe essere... l'uomo dei suoi sogni! Ah ah ah! Ehm...\n@c0@"
  ja: "@a@bピピン「寝ている間も　バニー姿だなんて…\n\tステキだ！\n@c0@"
379:
  de: "@aBianca@bStell dir nur vor, ein unterirdisches Gefängnis in der Stadt! Na ja, ich vermute, bei so vielen Leuten an einem Ort muss man wohl mit Kriminalität rechnen.\n@c0@"
  en: "@aBianca@bFancy havin' an underground jail in town! I s'pose there's bound to be crime when you collect so many folk together in one spot, though.\n@c0@"
  es: "@aBianca@b¡Qué curioso, una cárcel subterránea en la ciudad! Supongo que es normal que haya mangantes cuando juntas a mucha gente en un mismo sitio, ¿sabes?\n@c0@"
  fr: "@aBianca@bUne prison souterraine en ville, tu te rends compteⓡ Enfin, je suppose que la délinquance est inévitable quand on rassemble tant de gens en un seul endroit.\n@c0@"
  it: "@aBianca@bNon c'è da stupirsi che a Fortuna ci sia anche una prigione: la città è talmente ricca che non può non attirare i delinquenti!\n@c0@"
  ja: "@a@bビアンカ「町に　地下牢があるなんて…\n\tこれだけ　大きな町だと\n\t犯罪も　多いのかも知れないわね。\n@c0@"
380:
  de: "@aNera@bIn Gefängnissen fühlt es sich immer so kalt an.\n@c0@"
  en: "@aNera@bJails always seem to feel so cold.\n@c0@"
  es: "@aNera@bLas cárceles sempre parecen sitios muy fríos.\n@c0@"
  fr: "@aNera@bLes prisons semblent toujours glaciales.\n@c0@"
  it: "@aNera@bSe finissi in galera, non credo sopravviverei... Morirei dalla vergogna! E se così non fosse, ci penserebbe mio padre ad ammazzarmi!\n@c0@"
  ja: "@a@bフローラ「牢屋って　なんだか\n\t寒気がしてきますわ。\n@c0@"
381:
  de: "@a%0%a001240@bDieser Ort ist wirklich unheimlich. Ich komm hier lieber nicht runter, wenn's nicht unbedingt sein muss.\n@c0@"
  en: "@a%0%a001240@bThis place is really creepy. I'd rather not come down here if we don't have to.\n@c0@"
  es: "@a%0%a001240@bEste sitio es bastante espeluznante. Prefiero no bajar aquí si no es del todo necesario.\n@c0@"
  fr: "@a%0%a001240@bCet endroit donne la chair de poule. Je préférerais autant ne pas y venir si on y est pas obligés.\n@c0@"
  it: "@a%0%a001240@bQuesto posto mi fa venire i brividi...\nNon ci voglio più tornare!\n@c0@"
  ja: "@a@b%a001240「ここって　イヤな感じだね。\n\tボク　こんな所には　入りたくないよ。\n@c0@"
382:
  de: "@a%0%a001250@bHier ist es dunkel und kalt und riecht ganz komisch. Bah!\n@c0@"
  en: "@a%0%a001250@bIt's dark and cold and smelly down here.\nI don't like it!\n@c0@"
  es: "@a%0%a001250@bEsto está oscuro, y hace frío, y huele raro.\n¡No me gusta!\n@c0@"
  fr: "@a%0%a001250@bC'est tout sombre et ça sent mauvais ici.\nJe n'aime pas cet endroitⓠ\n@c0@"
  it: "@a%0%a001250@bC'è puzza di chiuso, è freddo ed è buio!\nVoglio andarmene da qui!\n@c0@"
  ja: "@a@b%a001250「くらいし　さむいし　くさいし\n\tわたし　ここには　いたくないです。\n@c0@"
383:
  de: "@aOtto@bNa, so was! Dieser Soldat schläft ja? Meint Ihr, wir sollten ihn wecken?\n@c0@"
  en: "@aTuppence@bI say! That soldier's asleep! Do you suppose we should wake him?\n@c0@"
  es: "@aAlazar@b¡Pero bueno! ¡Ese soldado está durmiendo! ¿Creéis que deberíamos despertarlo?\n@c0@"
  fr: "@aInnocent@bIncroyableⓠ Ce soldat s'est endormiⓠ\nVous croyez qu'on devrait le réveillerⓡ\n@c0@"
  it: "@aSimon@bQuel soldato sta dormendo! Forse dovrei svegliarlo, prima che il suo comandante se ne accorga e lo metta di ramazza per qualche mese...\n@c0@"
  ja: "@a@bピピン「あの兵士　寝てますよ！\n\t大丈夫なんですか？\n@c0@"
384:
  de: "@aBianca@bÄhm... Bist du sicher, dass es richtig war, ihn freizulassen, %a000090?\n@c0@"
  en: "@aBianca@bUm... You sure we should've let him go, %a000090?\n@c0@"
  es: "@aBianca@bMmm... ¿Seguro que debemos dejarlo ir, %a000090?\n@c0@"
  fr: "@aBianca@bMmm... Tu es sûr qu'on a bien fait de le laisser partir, %a000090ⓡ\n@c0@"
  it: "@aBianca@bCredi che abbiamo fatto bene a lasciarlo andar via, %a000090?\n@c0@"
  ja: "@a@bビアンカ「あいつは……\n\tねえ　%a000090　本当に\n\t逃がして良かったの？\n@c0@"
385:
  de: "@aNera@bOje. Jetzt ist er weg!\n@c0@"
  en: "@aNera@bOh dear! He's gone!\n@c0@"
  es: "@aNera@b¡Oh, vaya! ¡Se ha ido!\n@c0@"
  fr: "@aNera@bPar la Déesseⓠ Il est partiⓠ\n@c0@"
  it: "@aNera@bOrmai è fatta...\nSe n'è andato.\n@c0@"
  ja: "@a@bフローラ「あらあら…\n\t行ってしまわれましたわ。\n@c0@"
386:
  de: "@a%0%a001240@bEr sagte doch was von dem Stuhl... Was da wohl auf uns wartet?\n@c0@"
  en: "@a%0%a001240@bHe said something about the stool.\nI wonder what's there.\n@c0@"
  es: "@a%0%a001240@bHa dicho algo del taburete.\nMe pregunto qué habrá ahí.\n@c0@"
