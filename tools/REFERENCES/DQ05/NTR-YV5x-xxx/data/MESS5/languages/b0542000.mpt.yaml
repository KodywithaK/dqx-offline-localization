  ja: "@a@bビアンカ「いつ死ぬか　わからないから\n\t私は　投げやりな生き方を\n\tしたくないのよね。\n@c0@"
218:
  de: "@aNera@bIn letzter Zeit reden alle davon, wie die Dunkelheit sich in der Welt breitmacht. Vielleicht ist es jetzt doch so weit.\n@c0@"
  en: "@aNera@bEveryone seems to be talking about how the world's being overtaken with darkness of late. Maybe the time's finally upon us.\n@c0@"
  es: "@aNera@bParece que tutti hablan de que el mundo está siendo invadido por la oscuridad últimamente. Quizá haya llegado nuestra hora.\n@c0@"
  fr: "@aNera@bTous les gens disent que le monde va finir englouti par les ténèbres, en ce moment. Peut-être que notre heure est effectivement venue.\n@c0@"
  it: "@aNera@bQuell'uomo è troppo pessimista...\nLa dea non permetterà mai che il mondo da lei creato venga avvolto dalle tenebre! \n@c0@"
  ja: "@a@bフローラ「最近　世界を闇が……\n\tという話を　よく耳にしますわ。\n\tいよいよなのかも知れませんわね。\n@c0@"
219:
  de: "@a%0%a001240@bWenn ich schon sterben muss, dann kann ich mich jetzt auch amüsieren, nicht wahr, Papa?\n@c0@"
  en: "@a%0%a001240@bIf I'm going to die, then I may as well get in whatever enjoyment I can now, right, Dad?\n@c0@"
  es: "@a%0%a001240@bSi voy a morir, será mejor que ahora me divierta todo lo que pueda, ¿no, papá?\n@c0@"
  fr: "@a%0%a001240@bSi on doit mourir un jour, autant s'amuser le plus possible avant, hein, papaⓡ\n@c0@"
  it: "@a%0%a001240@bPapà, io non voglio passare a miglior vita!\nA me piace questa qui!\n@c0@"
  ja: "@a@b%a001240「ボクは　どうせ死ぬんなら\n\tやれるだけのこと　やりたいな。\n\tお父さんも　そう思うでしょ？\n@c0@"
220:
  de: "@a%0%a001250@bMüssen wir wirklich alle sterben? Du, Mama, ich, wir alle? Warum denn bloß?!\n@c0@"
  en: "@a%0%a001250@bAre we all really going to die? You and Mum and me and all of us? I don't like it!\n@c0@"
  es: "@a%0%a001250@b¿De verdad vamos a morir todos algún día? ¿Tú y mami y yo y todos? ¡No quiero!\n@c0@"
  fr: "@a%0%a001250@bOn va vraiment tous mourirⓡ Maman, toi, moi et tout le mondeⓡ Cette idée ne me plaît pas du toutⓠ\n@c0@"
  it: "@a%0%a001250@bSpero di divertirmi il più a lungo possibile...\n@c0@"
  ja: "@a@b%a001250「お父さんも　お母さんも\n\tわたしも　みんな死んじゃうの？\n\t……そんなの　やだ。\n@c0@"
221:
  de: "@aSancho@bDarum musst du dir keine Sorgen machen, Chico. Solch ein Gerede hören wir doch die ganze Zeit.\n@c0@"
  en: "@aSancho@bEes no worrying for you? These bad gossips, we\r\nhear them everywhere.\n@c0@"
  es: "@aSancho@b¿No estás preocupado, chamaco? Corren rumores desagradables por toditos los lados.\n@c0@"
  fr: "@aSancho@bNe t'inquiète pas. Ce genre de b-bêtises, on les entend p-p-partout.\n@c0@"
  it: "@aSancho@b¡Ay, caramba!\n¿Por qué quell'hombre ha parlato della minaccia dell'oscurità?\n㈡\n¡Ero venuto aquí al casinò proprio por dimenticarmene, almeno por qualche minutos!\n@c0@"
  ja: "@a@bサンチョ「悪いウワサが\n\t世界中に　広まっているようです。\n\tゆゆしき問題ですね。\n@c0@"
222:
  de: "@aOtto@bKeine Sorge, ich werde mein Leben schon in vollen Zügen genießen, so wahr ich Otto heiße!\n@c0@"
  en: "@aTuppence@bDon't you worry. I'm going to live my life to the full, in true Tuppence style!\n@c0@"
  es: "@aAlazar@bNo os preocupéis. ¡Voy a disfrutar de la vida al máximo, al estilo Alazar!\n@c0@"
