0:
  de: "@aBianca@bIn einer Abtei fühle ich mich in etwa genauso wohl wie ein Schleim in einem Steinbruch.\n@c0@"
  en: "@aBianca@bI'm as out of place at an abbey as a slime would be in a quarry.\n@c0@"
  es: "@aBianca@bMe encuentro más perdida en una iglesia que un limo en una mina de sal.\n@c0@"
  fr: "@aBianca@bJe suis autant à ma place dans une abbaye qu'un gluant dans une carrière.\n@c0@"
  it: "@aBianca@bNon so perché, ma abbazie, monasteri e luoghi del genere mi mettono un po' in soggezione...\n@c0@"
  ja: "@a@bビアンカ「私は　修道院なんて\n\tガラじゃないなあ。\n@c0@"
1:
  de: "@aBianca@bHast du vielleicht eine kleine Schwäche für die würdevollen Geschöpfe, die an solchen Orten immer herumhängen, %a000090?\n@c0@"
  en: "@aBianca@bHave you got a bit of a thing for the graceful sorts that hang about these kind of places, though, %a000090?\n@c0@"
  es: "@aBianca@bPero a ti te hacen tilín los bomboncitos que suele haber por aquí, ¿verdad, %a000090?\n@c0@"
  fr: "@aBianca@bDis-moi, %a000090, est-ce que tu as un petit faible pour les jeunes femmes qui vivent dans ce genre d'endroitⓡ\n@c0@"
  it: "@aBianca@bInvece a te piacciono parecchio...\nDico bene, %a000090?\n@c0@"
  ja: "@a@bビアンカ「それとも　%a000090は\n\tやっぱり　こういう所にいる\n\tおしとやかな女の人が　好きなの？\n@c0@"
2:
  de: "@aNera@bIch habe eine lange Zeit hier im Stift gelebt. Es ist so etwas wie mein zweites Zuhause.\n@c0@"
  en: "@aNera@bI spent quite a long period living here at the abbey.\r\nI think of it as my second home.\n@c0@"
  es: "@aNera@bYo pasé mucho tiempo viviendo en la abadía.\nPara mí es veramente una segunda casa.\n@c0@"
  fr: "@aNera@bJ'ai vécu très longtemps dans cette abbaye.\r\nC'est un peu mon deuxième chez-moi.\n@c0@"
  it: "@aNera@bHo trascorso molti anni della mia vita qui all'Abbazia di Su'ncyel.\nLa considero la mia seconda casa.\n@c0@"
  ja: "@a@bフローラ「私　ここでの　生活が\n\t長かったですから…\n\t第二のふるさとという感じがしますわ。\n@c0@"
3:
  de: "@a%0%a001240@bUnd es leben nur Frauen hier?! Das ist ja komisch!\n@c0@"
  en: "@a%0%a001240@bAre there only women living in this place?\nThat's weird!\n@c0@"
  es: "@a%0%a001240@b¿Solo viven mujeres aquí?\n¡Qué raro!\n@c0@"
  fr: "@a%0%a001240@bIl n'y a que des femmes iciⓡ\nC'est bizarreⓠ\n@c0@"
  it: "@a%0%a001240@bCome mai qui dentro vivono solo donne?\n@c0@"
  ja: "@a@b%a001240「ここって\n\t女の人しか住んでないの？\n\tへんなの。\n@c0@"
4:
  de: "@a%0%a001240@b(Gähn) Irgendwie werde ich ganz müde hier...\n@c0@"
  en: "@a%0%a001240@b(yawn)\nBeing here makes me feel all sleepy for some reason.\n@c0@"
  es: "@a%0%a001240@b(aaah)\nEste sitio hace que me entre sueño, no sé por qué.\n@c0@"
  fr: "@a%0%a001240@b(bâillement)\nJe ne sais pas pourquoi, mais j'ai tendance à piquer du nez quand je suis ici.\n@c0@"
  it: "@a%0%a001240@bYaaawn...\nTutt'a un tratto mi sento stanco...\n@c0@"
  ja: "@a@b%a001240「ふわぁ……。\n\tなんだか　ここにいると\n\t眠くなってきちゃうよ……。\n@c0@"
5:
  de: "@a%0%a001250@bSieh dir nur all die Blumen an! Und erst der Himmel und das Meer! Echt hübsch!\n@c0@"
  en: "@a%0%a001250@bLook at all those flowers! The sky and the sea are really pretty here too.\n@c0@"
  es: "@a%0%a001250@b¡Mira cuántas flores! Y el cielo y el mar también son preciosos.\n@c0@"
  fr: "@a%0%a001250@bRegarde toutes ces fleursⓠ Et le ciel et la mer sont vraiment magnifiques aussi.\n@c0@"
  it: "@a%0%a001250@bChe bei fiori!\nAnche il cielo e il mare sono meravigliosi qui...\n@c0@"
  ja: "@a@b%a001250「お花が　いっぱい。\n\tここは　お空も海の色も\n\tすごくきれいね……。\n@c0@"
6:
  de: "@a%0%a001250@bDieser Ort ist eine Abtei, oder? Davon habe ich gehört!\n@c0@"
  en: "@a%0%a001250@bThis place is an abbey, isn't it?\nI know these things!\n@c0@"
  es: "@a%0%a001250@bEsto es una abadía, ¿verdad?\n¡Yo sé mucho de esas cosas!\n@c0@"
  fr: "@a%0%a001250@bC'est une abbaye, ici.\nJ'en sais des choses, heinⓡ\n@c0@"
  it: "@a%0%a001250@bQuesta è l'Abbazia di Su'ncyel, non è vero?\n@c0@"
  ja: "@a@b%a001250「ここ　修道院っていうんでしょ？\n\tわたし　知ってるよ。\n@c0@"
7:
  de: "@a%0%a001250@bWirklich? Mama hat hier der Göttin gedient? Das will ich auch tun, wenn ich groß bin!\n@c0@"
  en: "@a%0%a001250@bReally? Mum did domestic goddess training here? Then I'm going to do it too when I grow up!\n@c0@"
  es: "@a%0%a001250@b¿De verdad? ¿Mamá estuvo aquí aprendiendo economía doméstica de la Diosa? ¡Pues yo también quiero venir cuando sea mayor!\n@c0@"
  fr: "@a%0%a001250@bC'est vraiⓡ Maman a fait son éducation domestique et religieuse iciⓡ Alors je ferai pareil quand je serai plus grande.\n@c0@"
  it: "@a%0%a001250@bLa mamma ha frequentato il corso di preparazione al matrimonio qui, e anch'io verrò a studiarci quando sarò più grande!\n@c0@"
  ja: "@a@b%a001250「えっ？　お母さん\n\tここで花嫁修業したの！？　じゃあ\n\tわたしも　大きくなったらします。\n@c0@"
8:
  de: "@aSancho@bIst das die Abtei, in der man siss damals so gut um diss gekümmert hat, Chico?\n@c0@"
  en: "@aSancho@bEes thees the abbey where you arrived and the esisters, they look after you eso well, friend?\n@c0@"
  es: "@aSancho@bEn esta abadía es donde las hermanas cuidaron tan bien de ti, ¿no es eso, chamaco?\n@c0@"
  fr: "@aSancho@bC-C'est l'abbaye où tu es arrivé et où les s-sœurs t'ont si bien soigné, chicoⓡ\n@c0@"
  it: "@aSancho@b¿Chico, esta es l'abbazia donde tu ricevesti aiuto muchos años fa?\n@c0@"
  ja: "@a@bサンチョ「おや　ここは　昔\n\t%a000090王が　お世話になったという\n\t修道院じゃありませんか！\n@c0@"
9:
  de: "@aSancho@bUi! Deine Onkel Sancho war gar nisst vorbereitet. Jetzt iss habe kein Geschenk mitgebracht.\n@c0@"
  en: "@aSancho@bUf! Your Uncle Sancho, he ees no prepared for thees. I no breeng a present for them.\n@c0@"
  es: "@aSancho@b¡Ay, caramba! Tu tito Sancho no estaba preparado para esto. No les traje ningún regalo.\n@c0@"
  fr: "@aSancho@bZ-Zutⓠ Ton oncle Sancho n'avait pas p-prévu ça.\nS-Si j'avais su, je leur aurai apporté un c-cadeau.\n@c0@"
  it: "@aSancho@b¿Por qué no me hai detto che venivamo aquí?\n㈡\nSi lo avessi saputo, avrei preparato un pentolon de paella por ringraziare las suoras della loro gentilezza.\n@c0@"
  ja: "@a@bサンチョ「こいつは　いけない！\n\t今日は　手みやげも　何にも\n\t用意してありませんよ！\n@c0@"
10:
  de: "@aOtto@bWenn Ihr mich fragt, ist es viel zu gefährlich für all diese jungen Frauen, ganz alleine hier zu leben. Einige von ihnen sind sogar besonders jung...\n@c0@"
  en: "@aTuppence@bIt's not safe for all these young women to be living out here on their own, you know. Some of them are younger than others, mind you.\n@c0@"
  es: "@aAlazar@bNo es seguro que todas estas jovencitas vivan aquí solas, tan lejos. Bueno, unas son más jóvenes que otras.\n@c0@"
  fr: "@aInnocent@bCe n'est pas prudent pour toutes ces jeunes femmes d'habiter seules ici, vous savez. Ceci dit, certaines sont plus jeunes que d'autres.\n@c0@"
  it: "@aSimon@bDi questi tempi, non è prudente che le donne vivano da sole.\n㈡\nCon tutti i pericoli che ci sono in giro, farebbero meglio a contare sull'aiuto di qualche guardia esperta e nerboruta, oltre che su quello della dea!\n@c0@"
  ja: "@a@bピピン「うら若き女性ばかりで\n\t暮らしてるなんて　不用心ですよ。\n\t一部　そうでない方もいますけど。\n@c0@"
11:
  de: "@a%0%a001250@bWas für eine süße Katze! Darf ich sie streicheln?\n@c0@"
  en: "@a%0%a001250@bWhat a cute cat! Can I stroke it?\n@c0@"
  es: "@a%0%a001250@b¡Qué gato tan mono! ¿Lo puedo acariciar?\n@c0@"
  fr: "@a%0%a001250@bQu'il est mignon, ce chatⓠ Je peux le caresserⓡ\n@c0@"
  it: "@a%0%a001250@bChe bel micino!\nPosso accarezzarlo?\n@c0@"
  ja: "@a@b%a001250「ネコさん　かわいい！\n\tなでなでして　いい？\n@c0@"
12:
  de: "@a%0%a001240@bGlaubst du, dass Mama nach Hause kommt, wenn wir für sie beten?\n@c0@"
  en: "@a%0%a001240@bDo you think Mum would come home if we said a prayer for her?\n@c0@"
  es: "@a%0%a001240@b¿Crees que mamá volvería a casa si rezásemos una oración por ella?\n@c0@"
  fr: "@a%0%a001240@bTu crois que maman reviendrait si on disait une prière pour elleⓡ\n@c0@"
  it: "@a%0%a001240@bCredi che mamma tornerà a casa se diremo una preghiera alla dea?\n@c0@"
  ja: "@a@b%a001240「お祈りしたら　お母さん\n\tお城に　帰ってきてくれるかな？\n@c0@"
13:
  de: "@a%0%a001240@bIch hasse Beten, aber ich will es gerne versuchen, wenn sie dann zurückkommt.\n@c0@"
  en: "@a%0%a001240@bI hate praying, but I'd give it a go if it would bring her back.\n@c0@"
  es: "@a%0%a001240@bOdio rezar, pero si hay alguna posibilidad no me importa probar.\n@c0@"
  fr: "@a%0%a001240@bJ'aime pas prier, mais je le ferais si j'étais sûr que ça la ferait revenir.\n@c0@"
  it: "@a%0%a001240@bNon sono molto bravo a pregare ma, se servirà a far tornare la mamma da noi, ci proverò con tutte le mie forze...\n@c0@"
  ja: "@a@b%a001240「ボク　お祈りキライだけど\n\tそれなら　がんばるよ。\n@c0@"
14:
  de: "@a%0%a001250@bIch hoffe, dass wir Mama bald finden.\n@c0@"
  en: "@a%0%a001250@bI hope I get to see Mum soon.\n@c0@"
  es: "@a%0%a001250@bEspero poder ver pronto a mamá.\n@c0@"
  fr: "@a%0%a001250@bJ'espère qu'on reverra maman bientôt.\n@c0@"
  it: "@a%0%a001250@bSpero che la mamma torni presto...\n@c0@"
  ja: "@a@b%a001250「お母さんに\n\t早く　会いたいな……。\n@c0@"
15:
  de: "@aSancho@bEs tut mir ja so leid, Chico. Du musstest schon so viel Leid ertragen in deine Leben.\n@c0@"
  en: "@aSancho@bI eso esorry, friend. Ever esince you were born, you have eso much esuffering.\n@c0@"
  es: "@aSancho@bAy, chamaco. Desde que naciste, no dejaste de sufrir ni tantito.\n@c0@"
  fr: "@aSancho@bJ-Je suis désolé pour toi, chico. Depuis ta naissance, tu as tellement s-s-souffert.\n@c0@"
  it: "@aSancho@bPovero chico...\nDa cuando sei nato, hai dovuto affrontare muchissimas dificultades...\n@c0@"
  ja: "@a@bサンチョ「本当に　%a000090王は\n\t生まれたときから\n\t苦労ばっかりで…　うっうっ……。\n@c0@"
16:
  de: "@aNera@bBei der Göttin! Wie diese Frau sich verändert hat! Vielleicht altert man schneller, wenn man viel Leid zu ertragen hat...\n@c0@"
  en: "@aNera@bGoodness! I can't believe how much that woman's changed. Maybe you age faster if you have to endure suffering.\n@c0@"
  es: "@aNera@b¡Por la Diosa! No puedo creer lo mucho que ha cambiado esa donna. A lo mejor el sufrimiento hace que te hagas vecchia antes.\n@c0@"
  fr: "@aNera@bC'est stupéfiantⓠ Je n'arrive pas à croire que cette femme ait tant changé. Peut-être qu'on vieillit plus vite quand on souffre...\n@c0@"
  it: "@aNera@bSanto cielo!\nHai visto quant'è invecchiata quella donna?! I segni del tempo sono più evidenti sul volto di chi soffre...\n@c0@"
  ja: "@a@bフローラ「あら　あの方は……。\n\t苦労なさると　早く　年を取って\n\tしまうのかしら…　あんなに変わって。\n@c0@"
17:
  de: "@aBianca@bAch ja. Die Leute hier im Stift haben dir damals geholfen, richtig?\n@c0@"
  en: "@aBianca@bOh yeah. The folk here at the abbey helped you out that time, eh?\n@c0@"
  es: "@aBianca@b¡Ah!, es verdad. Estas mujeres de la abadía te echaron una mano, ¿no?\n@c0@"
  fr: "@aBianca@bAh oui. Les sœurs de l'abbaye t'avaient aidé,\nà l'époque, heinⓡ\n@c0@"
  it: "@aBianca@bLe persone che vivono qui all'abbazia sono davvero cortesi.\n@c0@"
  ja: "@a@bビアンカ「そうだったわね。\n\t%a000090は　昔　この修道院の人たちに\n\t助けてもらったんだっけ……。\n@c0@"
18:
  de: "@a%0%a001240@bIch werde dir auch helfen, deine Mutter wiederzufinden, Papa!\n@c0@"
  en: "@a%0%a001240@bI'm going to try really hard to help you find your mum too, Dad!\n@c0@"
  es: "@a%0%a001240@b¡Voy a ayudarte todo lo que pueda para encontrar a mamá, papi!\n@c0@"
  fr: "@a%0%a001240@bMoi aussi, je vais faire de mon mieux pour t'aider\nà retrouver ta maman, papa.\n@c0@"
  it: "@a%0%a001240@bPapà, ti aiuterò a trovare la tua mamma!\nVedrai che insieme ce la faremo!\n@c0@"
  ja: "@a@b%a001240「ボク　がんばって\n\tお父さんのお母さんも\n\t見つけてあげるからね！\n@c0@"
19:
  de: "@a%0%a001250@bSobald wir Mama gefunden haben, möchte ich Großmutter finden. Ist das egoistisch von mir?\n@c0@"
  en: "@a%0%a001250@bAs soon as I've found Mum, I want to find Grandma. Does that make me selfish?\n@c0@"
  es: "@a%0%a001250@bCuando hayamos encontrado a mamá, me pondré a buscar a la abuela. Eso no es ser egoísta, ¿verdad?\n@c0@"
  fr: "@a%0%a001250@bDès que j'aurai retrouvé maman, je chercherai grand-mère. Tu crois que c'est égoïste de ma partⓡ\n@c0@"
  it: "@a%0%a001250@bDopo la mamma troveremo anche nonna!\nSono sicura che ci riusciremo!\n@c0@"
  ja: "@a@b%a001250「わたし　お母さんに会えたら\n\tおばあちゃんにも　会いたくなって……\n\tわがままかな？\n@c0@"
20:
  de: "@aBianca@bMädchen träumen immer davon, dass ein hübscher Prinz vorbeikommt und sie mitnimmt... Ich eingeschlossen.\n@c0@"
  en: "@aBianca@bGirls are always dreamin' about a handsome\r\nprince comin' and sweepin' them off their feet, eh?\r\nMe included.\n@c0@"
  es: "@aBianca@bLas chicas siempre sueñan con un príncipe azul que se las lleve a lomos de su caballo...\nHasta yo.\n@c0@"
  fr: "@aBianca@bLes jeunes filles rêvent toutes qu'un jour, un beau prince tombera fou amoureux d'elles. Moi y compris.\n@c0@"
  it: "@aBianca@bOgni ragazza desidera trovare il principe azzurro che la porti via con sé.\nAnch'io lo sognavo...\n@c0@"
  ja: "@a@bビアンカ「いつか　王子さまと…\n\tっていうのは　女の子の夢だもんね。\n\t私も　あこがれたことがあったわ。\n@c0@"
21:
  de: "@aBianca@bIch war ganz schön überrascht, als ich nach all den Jahren erfuhr, dass du auch einer bist!\n@c0@"
  en: "@aBianca@bI was pretty surprised when I found out after all them years that you were one!\n@c0@"
  es: "@aBianca@b¡Fue una sorpresa de primera cuando descubrí que tú lo eras, después de tantos años!\n@c0@"
  fr: "@aBianca@bAlors j'ai été vraiment surprise quand j'ai découvert que tu en étais unⓠ\n@c0@"
  it: "@aBianca@bE il mio sogno s'è realizzato.\nSei tu il mio principe azzurro, %a000090.\n@c0@"
  ja: "@a@bビアンカ「だから　%a000090が\n\t王子だと知ったときは\n\t本当に　おどろいちゃったわよ。\n@c0@"
22:
  de: "@aNera@bAnscheinend macht sich die Mutter des Mädchens Sorgen um sie. Vielleicht möchte sie einfach nicht, dass sie so endet wie sie selbst.\n@c0@"
  en: "@aNera@bIt sounds like her mother's worried about her. She probably just doesn't want her to end up as she has.\n@c0@"
  es: "@aNera@bParece que la sua mamma está preocupada por ella. Supongo que no quiere que acabe como ella ha acabado, veramente.\n@c0@"
  fr: "@aNera@bOn dirait que sa mère s'inquiète pour elle. Elle veut sans doute éviter à tout prix que sa fille finisse comme elle.\n@c0@"
  it: "@aNera@bNo, il principe azzurro non smarrisce mai l'indirizzo della donna della sua vita.\nForse con un po' di ritardo, ma arriva sempre...\n@c0@"
  ja: "@a@bフローラ「お母さまは　心配なのね。\n\tきっと　娘さんを　ご自分のような目に\n\tあわせたくないんですわ。\n@c0@"
23:
  de: "@a%0%a001240@bMir sind schwarze Pferde lieber. Aber Mary Lou ist natürlich klasse. Sie ist uns eine große Hilfe.\n@c0@"
  en: "@a%0%a001240@bI prefer black horses myself. I like Dusty, though, obviously. She's been a big help.\n@c0@"
  es: "@a%0%a001240@bYo prefiero los caballos negros... Pero Babieco me cae bien, claro. Nos ha ayudado mucho.\n@c0@"
  fr: "@a%0%a001240@bPersonnellement, je préfère les chevaux noirs.\nMais je n'ai rien contre Axelle, hein.\nElle nous aide bien.\n@c0@"
  it: "@a%0%a001240@bI cavalli bianchi sono belli, ma io preferisco quelli neri come Marilù, la nostra amica a quattro zampe.\n@c0@"
  ja: "@a@b%a001240「ボクは　黒馬のほうが好きだな。\n\tでも　パトリシアは好きだよ。\n\tたよりになるもん！\n@c0@"
24:
  de: "@a%0%a001250@bWarum soll ihre Mutter böse sein? Glaubst du, meine Mutter wird auf mich böse sein?\n@c0@"
  en: "@a%0%a001250@bWhy will her mum get angry? Do you think my mum will get angry with me?\n@c0@"
  es: "@a%0%a001250@b¿Por qué crees que la iba a reñir su madre? ¿Crees que mamá me reñirá?\n@c0@"
  fr: "@a%0%a001250@bPourquoi sa mère se mettrait en colèreⓡ Tu crois que maman sera en colère contre moi aussiⓡ\n@c0@"
  it: "@a%0%a001250@bPerché sua madre si arrabbierà con lei?\nMica stanno aspettando lo stesso principe azzurro, eh!\n@c0@"
  ja: "@a@b%a001250「なんで　お母さんに\n\tおこられちゃうの？ わたしも\n\tお母さんに　おこられちゃうかな？\n@c0@"
25:
  de: "@aOtto@bÄhm... Wie wäre es denn mit meiner Wenigkeit? Würde ich genügen?\n@c0@"
  en: "@aTuppence@bEr... H-How about my good self? Would I suffice?\n@c0@"
  es: "@aAlazar@bEjem... Y yo, ¿qué te parezco? ¿Te bastaría conmigo?\n@c0@"
  fr: "@aInnocent@bEuh... Et moi, je ne ferais pas l'affaireⓡ\n@c0@"
  it: "@aSimon@bCome starei vestito d'azzurro, in groppa a un candido destriero?\n@c0@"
  ja: "@a@bピピン「ぼ　ボクで良かったら……！\n@c0@"
26:
  de: "@aOtto@bHallo! Hört Ihr mich?\n@c0@"
  en: "@aTuppence@bI say! Can you hear me over there?\n@c0@"
  es: "@aAlazar@b¡Pero bueno! ¿Me oyes, o qué?\n@c0@"
  fr: "@aInnocent@bHéⓠ Vous m'entendez, là-basⓡ\n@c0@"
  it: "@aSimon@bSono il principe Simon, madamigella, e sono qui per sedurla e portarla nel mio regn...\n㈡\nEhm, Maestà, non avrebbe mica un regno da prestarmi?\nNon glielo rovinerò, non abbia paura.\n@c0@"
  ja: "@a@bピピン「……って　聞いてますか～！？\n\tそこの人～～！！\n@c0@"
27:
  de: "@a%0%a001240@bDas Reich der Feen? Hört sich viel spannender an als dieser Ort...\n@c0@"
  en: "@a%0%a001240@bThe Realm of the Faeries? That sounds much more interesting than this place.\n@c0@"
  es: "@a%0%a001240@b¿El Reino de las Hadas? Eso suena mucho más interesante que este sitio.\n@c0@"
  fr: "@a%0%a001240@bLe royaume des Féesⓡ Ça a l'air beaucoup plus intéressant que cet endroit.\n@c0@"
  it: "@a%0%a001240@bIl Regno delle Fate?\nCerto che esiste!\nCi sono tantissime favole che ne parlano!\n@c0@"
  ja: "@a@b%a001240「妖精の村かあ。\n\tこの修道院より　ずーっと\n\tおもしろそうだと思わない？\n@c0@"
28:
  de: "@aBianca@bMostroferrato... Ist schon eine ganze Weile her, dass wir dort geheiratet haben, was?\n@c0@"
  en: "@aBianca@bMostroferrato... It feels like a long while now since our weddin' day, eh?\n@c0@"
  es: "@aBianca@bMostroferrato... Parece que haya pasado mucho tiempo desde nuestra boda, ¿eh?\n@c0@"
  fr: "@aBianca@bMostroferrato... J'ai l'impression que notre mariage\r\na eu lieu il y a des siècles.\n@c0@"
  it: "@aBianca@bMostroferrato...\nNe è passato di tempo dal nostro matrimonio, eh?\n@c0@"
  ja: "@a@bビアンカ「サラボナかあ。\n\t結婚式をあげた日のことが\n\tなんだか　なつかしいね。\n@c0@"
29:
  de: "@aNera@bWie komisch, hier von Mostroferrato zu hören. Wenn ich doch nur schnell dort vorbeigehen und nachsehen könnte, ob es allen gut geht.\n@c0@"
  en: "@aNera@bI'm surprised to hear talk of Mostroferrato out here. Now I feel like I want to drop in there and see how everyone is.\n@c0@"
  es: "@aNera@bMe extraña oír hablar aquí de Mostroferrato. Hace que tenga ganas de dejarme caer por allí a ver cómo están tutti.\n@c0@"
  fr: "@aNera@bJe ne m'attendais pas à entendre parler de Mostroferrato ici. Maintenant, j'ai envie d'y refaire un saut pour voir si tout le monde va bien.\n@c0@"
  it: "@aNera@bOh... A sentir parlare di Mostroferrato m'è venuta nostalgia di casa.\r\nChissà come stanno mamma e papà...\n@c0@"
  ja: "@a@bフローラ「ここで　サラボナの話を\n\t聞くなんて……。\n\tちょっと　帰ってみたくなりましたわ。\n@c0@"
30:
  de: "@a%0%a001240@bAll diese Frauen machen mich ein wenig nervös. Ich will hier nicht übernachten. Was ist, wenn ich ins Bett mache?\n@c0@"
  en: "@a%0%a001240@bI'd be a bit nervous staying the night here among all these women. What if I wet the bed?\n@c0@"
  es: "@a%0%a001240@bMe pondría un poco nervioso pasar la noche entre tantas mujeres. ¿Y si mojo la cama?\n@c0@"
  fr: "@a%0%a001240@bÇa me rend un peu nerveux de dormir ici, au milieu de toutes ces femmes. Imagine si je faisais pipi au lit...\n@c0@"
  it: "@a%0%a001240@bChe facciamo adesso?\nDove andiamo?\n@c0@"
  ja: "@a@b%a001240「こんな女の人ばかりの所で\n\t泊まるのって　きんちょうしちゃうよ。\n\tおねしょしちゃったら　どうしよう。\n@c0@"
31:
  de: "@aOtto@bNonnen sind ja solch wunderbare Geschöpfe. So rein und so liebreizend!\n@c0@"
  en: "@aTuppence@bNuns are such splendid creatures.\r\nSo pure, so gentle.\n@c0@"
  es: "@aAlazar@bLas monjas son seres maravillosos.\nPuras, amables...\n@c0@"
  fr: "@aInnocent@bLes sœurs sont des êtres magnifiques. Elles sont si pures et si douces.\n@c0@"
  it: "@aSimon@bLe suore sono davvero gentili...\n@c0@"
  ja: "@a@bピピン「あの　やさしさと　きよらかさ。\n\tシスターって　いいなあ……。\n@c0@"
32:
  de: "@a%0%a001240@bGuten Morgen, Papa! Ein neuer Tag, an dem wir unserem Ziel wieder ein Stückchen näher rücken!\n@c0@"
  en: "@a%0%a001240@bMorning, Dad! Another day, another step closer\nto our goal!\n@c0@"
  es: "@a%0%a001240@b¡Buenos días, papi! ¡Con cada nuevo día nos acercamos más a nuestra meta!\n@c0@"
  fr: "@a%0%a001240@bBonjour, papaⓠ À chaque nouvelle journée, on se rapproche de notre objectifⓠ\n@c0@"
  it: "@a%0%a001240@bBuongiorno, papino!\nSono convinto che oggi faremo un altro passo in avanti verso la nostra meta!\n@c0@"
  ja: "@a@b%a001240「おはよう　お父さん！\n\t今日も一日　がんばろうねっ。\n@c0@"
33:
  de: "@a%0%a001250@bDie Betten hier sind wirklich gemütlich. Können wir hier nicht noch mal übernachten?\n@c0@"
  en: "@a%0%a001250@bThe bed here was really comfortable.\nCan we stay here again?\n@c0@"
  es: "@a%0%a001250@bLa cama era cómoda de verdad.\nVolveremos, ¿verdad?\n@c0@"
  fr: "@a%0%a001250@bLe lit était vraiment confortable.\nOn pourra revenir iciⓡ\n@c0@"
  it: "@a%0%a001250@bIl letto era comodissimo!\nPossiamo tornare a dormire qui qualche volta?\n@c0@"
  ja: "@a@b%a001250「ここのベッド　気持ちよかった。\n\tまた　泊まらせてもらおうね？\n@c0@"
34:
  de: "@aSancho@bDiese Nonnen sind so nett, Chico. Selbst Reisenden wie uns gestatten sie es, bei ihnen zu übernachten.\n@c0@"
  en: "@aSancho@bThese esisters, they are eso kind. They allow even travellers like us to estay here weeth them.\n@c0@"
  es: "@aSancho@b¡Ay, caramba! Estas hermanitas son bien amables al permitir que viajeros como nosotros se alojen aquí.\n@c0@"
  fr: "@aSancho@bC-Ces sœurs sont si g-gentilles de laisser les\r\nv-voyageurs comme nous d-dormir chez elles.\n@c0@"
  it: "@aSancho@bLas suoras sono estatas davveros muy gentiles a permetterce de trascorrere la noche aquí.\n@c0@"
  ja: "@a@bサンチョ「私たちのような　旅人を\n\t休ませてくれるとは…\n\t本当に　助かりますよ。\n@c0@"
35:
  de: "@aOtto@bDas werde ich nie vergessen: die Nacht, in der ich im selben Bett schlief wie Seine Majestät höchstpersönlich!\n@c0@"
  en: "@aTuppence@bI'll never forget this: the night I spent in the same bed as His Majesty himself!\n@c0@"
  es: "@aAlazar@b¡Nunca olvidaré la noche que pasé en la misma cama que Su Majestad en persona!\n@c0@"
  fr: "@aInnocent@bJe n'oublierai jamais cette nuitⓢ j'ai partagé le lit de Sa Majesté en personneⓠ\n@c0@"
  it: "@aSimon@bHo fatto la guardia al mio Re anche di notte!\nLavoro ventiquattr'ore al mese, sette giorni su cinq...\n㈡\nNo, sto facendo confusione. Com'è che si dice, eh?\n@c0@"
  ja: "@a@bピピン「ボク　忘れません……。\n\t国王陛下と　同じベッドで\n\t一夜を　ともにしたこと……。\n@c0@"
36:
  de: "@aBianca@bDas Plätschern der Wellen ist wirklich beruhigend. Ich habe so gut geschlafen wie schon seit langem nicht mehr.\n@c0@"
  en: "@aBianca@bThe sound of the waves here is really relaxin'.\r\nI slept better than I have in ages.\n@c0@"
  es: "@aBianca@bEl sonido de las olas es muy relajante.\nHe dormido como hacía siglos que no dormía, ¿sabes?\n@c0@"
  fr: "@aBianca@bLe bruit des vagues est vraiment relaxant.\r\nÇa faisait longtemps que je n'avais pas aussi\r\nbien dormi.\n@c0@"
  it: "@aBianca@bIl rumore delle onde durante la notte è davvero rilassante...\nHo dormito come un sasso!\n@c0@"
  ja: "@a@bビアンカ「ここは　波の音が心地よくて…\n\tひさしぶりに　ゆっくり　寝られたわ。\n@c0@"
37:
  de: "@aNera@bEs ist einfach traumhaft hier, so ruhig und entspannend wie immer. Ich habe wunderbar geschlafen.\n@c0@"
  en: "@aNera@bThis place is as relaxing as ever.\r\nI had a wonderful sleep.\n@c0@"
  es: "@aNera@bEste lugar es tan tranquilo como lo recuerdo.\n¡Qué bien he dormido, veramente!\n@c0@"
  fr: "@aNera@bCet endroit est toujours aussi calme.\r\nJ'ai merveilleusement bien dormi.\n@c0@"
  it: "@aNera@bL'abbazia è sempre tranquilla, ma di notte regna la quiete più assoluta.\nErano anni che non dormivo così bene...\n@c0@"
  ja: "@a@bフローラ「やっぱり　ここは\n\t落ちつきますわね。\n\tとても　ゆっくり　眠れたわ。\n@c0@"
38:
  de: "@a%0%a001240@bWelch ein hübsches Bild der Göttin. Sieht fast so aus wie Mama.\n@c0@"
  en: "@a%0%a001240@bWhat a pretty image of the Goddess.\nIt looks just like Mum.\n@c0@"
  es: "@a%0%a001240@bQué bonita imagen de la Diosa.\nEs igual que mamá.\n@c0@"
  fr: "@a%0%a001240@bQuelle jolie statuette de la Déesse.\nElle ressemble à maman.\n@c0@"
  it: "@a%0%a001240@bChe bella questa statuetta della dea!\nMi sembra che assomigli a mamma, sai?\n@c0@"
  ja: "@a@b%a001240「きれいな女神さまだね。\n\tお母さんみたいだ……。\n@c0@"
39:
  de: "@aSancho@bDiese Nonnen sind risstige Künstlerinnen, no? Das ist wirkliss gut...\n@c0@"
  en: "@aSancho@bThe esisters, they are fine artisans too, no?\nEes eso well-made.\n@c0@"
  es: "@aSancho@bLas hermanas son también buenas artesanas, ¿eh?\nQué bien hecha.\n@c0@"
  fr: "@aSancho@bC-Ces sœurs, elles s-sont aussi douées de leurs mains. La statuette est v-vraiment jolie.\n@c0@"
  it: "@aSancho@bLas suoras sono donnas de fede, y anche ottimas artigianas.\n¡Esta estatuetta es bellissima!\n@c0@"
  ja: "@a@bサンチョ「シスターたちは\n\tきよう　ですねえ。\n\tこりゃ本当に　よくできていますよ。\n@c0@"
40:
  de: "@a%0%a001240@bIch kann kochen! Na ja, Eier kochen, aber immerhin!\n@c0@"
  en: "@a%0%a001240@bI can cook! Well, I can boil an egg, anyway.\n@c0@"
  es: "@a%0%a001240@b¡Yo sé cocinar! Bueno, solo huevos fritos.\n@c0@"
  fr: "@a%0%a001240@bMoi, je sais cuisinerⓠ Enfin, je sais faire cuire un œuf, c'est déjà ça.\n@c0@"
  it: "@a%0%a001240@bA proposito di cibo...\nIo non so cucinare, però sono bravissimo a mangiare!\n@c0@"
  ja: "@a@b%a001240「ボクも　ゴハン作れるよ！\n\tゆでタマゴ…　とか。\n@c0@"
41:
  de: "@aOtto@bSo, all diese Kleider haben die Nonnen also selbst hergestellt? Welch eine Überraschung.\n@c0@"
  en: "@aTuppence@bSo all those habits were made by the nuns themselves? Well, there's a surprise.\n@c0@"
  es: "@aAlazar@b¿Y todos estos hábitos los han hecho las propias monjas? Eso sí que es una sorpresa.\n@c0@"
  fr: "@aInnocent@bAlors comme ça, ce sont les sœurs elles-mêmes qui ont fabriqués tous leurs habitsⓡ Je suis vraiment impressionné.\n@c0@"
  it: "@aSimon@bLe suore hanno cucito anche le loro tonache?\nCerto che sono proprio brave!\n@c0@"
  ja: "@a@bピピン「…ということは\n\tあの修道服は　シスターたちが？\n\tそれは　知りませんでした。\n@c0@"
42:
  de: "@aBianca@bHat Nera nicht auch eine Zeit lang hier gelebt? Ich frage mich, was sie damals alles gelernt hat...\n@c0@"
  en: "@aBianca@bDidn't Nera spend a bit of time here once?\r\nI wonder what kind of things she studied.\n@c0@"
  es: "@aBianca@bNera estuvo un tiempo viviendo aquí, ¿verdad?\nMe pregunto qué clase de cosas estudió.\n@c0@"
  fr: "@aBianca@bNera a été élève ici, si je ne m'abuseⓡ\nJe me demande ce qu'elle étudiait.\n@c0@"
  it: "@aBianca@bSe non sbaglio anche Nera è stata qui per un po' di tempo.\nChissà quali materie le avranno fatto studiare...\n@c0@"
  ja: "@a@bビアンカ「この修道院って\n\tフローラさんも　いたんだっけ？\n\tどんな勉強をするのかしらね。\n@c0@"
43:
  de: "@aNera@bAh, das war eine schöne Zeit damals. Ich kann mich noch sehr gut erinnern, wie ich jeden Morgen in diesem Raum aufgewacht bin.\n@c0@"
  en: "@aNera@bAh, this really takes me back. It feels like only yesterday that I was waking up every morning\r\nhere in this room.\n@c0@"
  es: "@aNera@b¡Ah!, qué recuerdos me trae... Sembra que fue ayer cuando me despertaba cada mattina en esta habitación.\n@c0@"
  fr: "@aNera@bAh, que de souvenirs... Tous les matins, je me réveillais ici. J'ai l'impression que c'était hier.\n@c0@"
  it: "@aNera@bMi sembra ieri che vivevo qui all'abbazia, e invece sono passati tanti anni da allora.\nAh, quanti ricordi...\n@c0@"
  ja: "@a@bフローラ「ああ…　なつかしい。\n\tこの部屋で　寝起きしていた事が\n\t昨日のことのように　思い出せますわ。\n@c0@"
44:
  de: "@a%0%a001240@bDu wirst %a001250 doch nicht auch hierhin schicken, oder, Papa? Es wäre sehr einsam ohne sie.\n@c0@"
  en: "@a%0%a001240@bYou won't make %a001250 come and stay here, will you, Dad? It'd be lonely if she went away.\n@c0@"
  es: "@a%0%a001240@b¿Verdad que no mandarás a %a001250 aquí, papá? Me sentiría muy solo si se fuera.\n@c0@"
  fr: "@a%0%a001240@bTu n'obligeras pas %a001250 à venir étudier ici, hein, papaⓡ Je m'ennuierais si elle partait.\n@c0@"
  it: "@a%0%a001240@bPapà, non vorrai far studiare %a001250 qui all'Abbazia?!\nSe lei se ne va, io resto solo!\n@c0@"
  ja: "@a@b%a001240「お父さん\n\t%a001250は　あずけないでね。\n\tずっと　いっしょで　いいでしょ？\n@c0@"
45:
  de: "@aBianca@bNachts herrscht hier Grabesstille. Es ist fast so, als wäre überhaupt niemand hier.\n@c0@"
  en: "@aBianca@bIt's quiet as the grave here of a night. It's almost like there's no one here at all.\n@c0@"
  es: "@aBianca@bDe noche esto es tan silencioso como un cementerio. Parece como si no hubiese nadie aquí, ¿sabes?\n@c0@"
  fr: "@aBianca@bTout est si silencieux, pendant la nuit. On dirait presque qu'il n'y a personne ici.\n@c0@"
  it: "@aBianca@bDi notte qui c'è una pace assoluta.\nSembra che non ci sia anima viva nel raggio di miglia e miglia...\n\n@c0@"
  ja: "@a@bビアンカ「修道院って　夜は\n\tこんなに　ひっそりと静かなのね。\n\t誰も　いないかのようだわ。\n@c0@"
46:
  de: "@aNera@bMir ist die Zeit, die ich hier verbracht habe, wirklich sehr teuer.\n@c0@"
  en: "@aNera@bI really treasure the time I spent here.\n@c0@"
  es: "@aNera@bEl tempo que pasé aquí significó mucho per me.\n@c0@"
  fr: "@aNera@bLes moments que j'ai passés ici sont réellement précieux.\n@c0@"
  it: "@aNera@bHo splendidi ricordi del tempo che ho trascorso all'Abbazia.\n@c0@"
  ja: "@a@bフローラ「ここで過ごした年月は\n\t私にとって　大切な宝物ですわ。\n@c0@"
47:
  de: "@aNera@bAls ich nach Hause reiste, hätte ich nie gedacht, dass ich hier noch einmal herkommen würde.\n@c0@"
  en: "@aNera@bWhen I left for home, I never imagined I'd have the chance to visit the place again.\n@c0@"
  es: "@aNera@bCuando regresé a la mia casa, nunca pensé que tendría la opportunità de volver.\n@c0@"
  fr: "@aNera@bLorsque je suis partie de cet endroit pour rentrer à la maison, je n'imaginais pas que j'aurais l'occasion d'y revenir un jour.\n@c0@"
  it: "@aNera@bChissà che persona sarei oggi, se non fossi stata educata qui...\nAh, non lo saprò mai.\n@c0@"
  ja: "@a@bフローラ「家にもどったら　もう二度と\n\t修道院を　おとずれることは\n\tかなわないと　思っていましたが……。\n@c0@"
48:
  de: "@a%0%a001240@bIch bin noch gar nicht müde. Ich könnte die ganze Nacht aufbleiben, wenn es sein müsste!\n@c0@"
  en: "@a%0%a001240@bI'm not sleepy yet, don't worry.\nI could stay up all night if I had to!\n@c0@"
  es: "@a%0%a001240@bAún no tengo sueño, no te preocupes.\n¡Si hace falta, me puedo quedar despierto toda la noche!\n@c0@"
  fr: "@a%0%a001240@bT'inquiète pas, je ne suis pas encore fatigué.\nJe pourrais rester debout toute la nuit si je voulaisⓠ\n@c0@"
  it: "@a%0%a001240@bNon ho sonno, sai?\nPotrei restare sveglio tutta la notte!\nYaaawn...\n@c0@"
  ja: "@a@b%a001240「うん…　まだ平気。\n\tボク　夜だって　ずーっと\n\t起きてられるもん。\n@c0@"
49:
  de: "@a%0%a001250@bZzz... Hm... Ja! Ich bin wach. Ehrlich...\n@c0@"
  en: "@a%0%a001250@bZzzz... Er, yep! I'm awake.\nHonest...\n@c0@"
  es: "@a%0%a001250@bZzz... Emmm, ¡sí! Estoy despierta.\nDe verdad...\n@c0@"
  fr: "@a%0%a001250@bZzz... Euh, ouiⓠ Je suis réveillée.\nSi, je t'assure...\n@c0@"
  it: "@a%0%a001250@bZzz...\nEh? Che cosa?\nNo, non stavo dormendo... Yawn...\n@c0@"
  ja: "@a@b%a001250「……むにゃ　…はい。\n\tおきてます…　はい。\n@c0@"
50:
  de: "@aSancho@bEs ist vollkommen dunkel. Sollen wir nisst endliss schlafen gehen, no? Wir können morgen weiterziehen.\n@c0@"
  en: "@aSancho@bEes completely dark now.\nEes time for bed, no?\nWe can continue our journey tomorrow.\n@c0@"
  es: "@aSancho@bEstá reteoscuro ya.\nEs hora de irse a dormir, ¿verdad?\nMañana podemos seguir viaje.\n@c0@"
  fr: "@aSancho@bIl fait c-complètement nuit, maintenant. C'est l'heure d'aller s-se coucher, noⓡ On p-peut se remettre en route d-demain.\n@c0@"
  it: "@aSancho@bSe es fatta noche.\n¿Por qué no vamos a dormire?\nProseguiremo el viaggio mañana.\n@c0@"
  ja: "@a@bサンチョ「もう　すっかり暗いですね。\n\tそろそろ　寝る時間ですよ。\n\tまた明日も　あるんですからね！\n@c0@"
51:
  de: "@aOtto@bEinen Moment bitte. Ich möchte die Aura der Abtei noch ein paar Augenblicke genießen.\n@c0@"
  en: "@aTuppence@bWait a moment. I'd like to savour the air of the abbey for just a few minutes more.\n@c0@"
  es: "@aAlazar@bUn momento. Me gustaría disfrutar del aire de la abadía un poco más.\n@c0@"
  fr: "@aInnocent@bAttendez un peu. J'aimerais profiter de l'air de l'abbaye encore quelques instants.\n@c0@"
  it: "@aSimon@bAncora un attimo, per favore...\nVoglio respirare l'aria dell'abbazia ancora per qualche istante.\n㈡\nSniff! Sniff!\nEcco fatto. Sono pronto, Sire.\n@c0@"
  ja: "@a@bピピン「あっ　待ってください。\n\tボク　もう少し　修道院の空気を\n\tたんのうしたいです。\n@c0@"
52:
  de: "@a%0%a001240@bOh. Kann man nachts gar nicht hier rein? Wie schade!\n@c0@"
  en: "@a%0%a001240@bOh. Can't you get in here at night?\nHuh! How annoying!\n@c0@"
  es: "@a%0%a001240@bVaya, ¿de noche no se puede entrar aquí?\n¡Qué fastidio!\n@c0@"
  fr: "@a%0%a001240@bOh. On ne peut pas rentrer ici la nuitⓡ\nAïeⓠ C'est embêtantⓠ\n@c0@"
  it: "@a%0%a001240@bPerché non fanno entrare nessuno di notte?\nHanno paura dei ladri?\nMa noi siamo brave persone!\n@c0@"
  ja: "@a@b%a001240「えっ　ここって\n\t夜　入れないの？\n\tちぇっ　つまんないの……。\n@c0@"
53:
  de: "@aSancho@bEs ist zu spät für eine Besuch, Chico. Wir kommen einfach morgen wieder.\n@c0@"
  en: "@aSancho@bEes too late for visiting now, you know.\nWe come back tomorrow.\n@c0@"
  es: "@aSancho@bYa es muy tarde para visitas, chamaco.\nMejor volvemos mañana, ¿ok?\n@c0@"
  fr: "@aSancho@bIl est trop t-tard. On reviendra mañana.\n@c0@"
  it: "@aSancho@bSì, es muy tarde ahora.\nTorneremo mañana.\n@c0@"
  ja: "@a@bサンチョ「よそのお宅を　訪ねるには\n\tずいぶん　遅い時間です。\n\tまた明日　出直しましょう。\n@c0@"
54:
  de: "@aOtto@bTja, ich nehme an, dass sie vorsichtig sein müssen, schließlich sind es ja alles bloß Frauen. Schade eigentlich...\n@c0@"
  en: "@aTuppence@bI suppose they have to be cautious, given that they're all women living out here alone. Pity, though.\n@c0@"
  es: "@aAlazar@bSupongo que, con todas esas mujeres viviendo aquí solas, hay que ser precavido. Pero en fin, qué pena.\n@c0@"
  fr: "@aInnocent@bJe suppose qu'elles doivent être prudentes, étant donné qu'elles vivent ici toutes seules. Mais c'est quand même dommageⓠ\n@c0@"
  it: "@aSimon@bMi sembra una regola giusta: queste donne devono pensare alla loro sicurezza.\nPerò adesso noi dove dormiamo, eh?!\n@c0@"
  ja: "@a@bピピン「さすがに　女の人だけだと\n\t用心ぶかいものですね。\n\tう～ん…　ざんねん！\n@c0@"
55:
  de: "@aBianca@bFrüher stand hier keine Brücke, darum konnte man von Wittenhausen und Steinach nicht hierher gelangen.\n@c0@"
  en: "@aBianca@bThere didn't used to be a bridge in the past, so you couldn't get here from Roundbeck and Whealbrook.\n@c0@"
  es: "@aBianca@bAntes no había puente, así que no había forma de llegar a aquí desde Golfo Blanco o Arroyofrío, ¿sabes?\n@c0@"
  fr: "@aBianca@bAutrefois, il n'existait pas de pont et il n'était pas possible d'accéder à cet endroit depuis Ruycelieu\r\net Blanchecombe.\n@c0@"
