  en: "@aDebora@bI should probably say a few words of gratitude, then. You know, ⓗthanks for rescuing my servantⓘ, that sort of thing.\n@c0@"
  es: "@aStefania@bDebería decirle unas palabras de agradecimiento. Algo como ⓕgrazie per rescatar al mio sirvienteⓖ o algo por el estilo.\n@c0@"
  fr: "@aPandora@bJe devrais peut-être leur dire un mot pour les remercier. Tu sais, ⓥmerci d'avoir sauvé mon domestiqueⓦ, ou quelque chose comme ça.\n@c0@"
  it: "@aViola@bCredo che dovrei ringraziare quelle sante donne per aver dato una mano al mio caro maritino.\n@c0@"
  ja: "@a@bデボラ「だったら　私も　お礼くらいは\n\t言っておかないと　いけないわね。\n\tしもべを助けてくれて　ありがとう　って。\n@c0@"
499:
  de: "@aGriselda@bIch brauche keinen Prinz mit Schimmel. Ich habe einen Diener, der nebenbei auch noch König ist!\n@c0@"
  en: "@aDebora@bI can do better than a prince on a white horse.\r\nI have a servant who also happens to be a king!\n@c0@"
  es: "@aStefania@bLo del príncipe azul a caballo no es nada per me.\n¡Tengo un sirviente que resulta que, además, es rey!\n@c0@"
  fr: "@aPandora@bJ'ai bien mieux qu'un prince sur un cheval blanc.\nJ'ai un domestique qui s'avère être aussi roiⓠ\n@c0@"
  it: "@aViola@bUn principe su un cavallo bianco?\nA me è andata meglio! Ho un servitore fedele e devoto che si è trasformato in un re!\n@c0@"
  ja: "@a@bデボラ「あんたは　白馬の王子様ならぬ\n\tしもべの　国王様だったわね。\n@c0@"
500:
  de: "@aGriselda@bDa fällt mir ein, dass ich Mama und Papa schon lange nicht mehr gesehen habe.\n@c0@"
  en: "@aDebora@bThat reminds me, I haven't seen Mama and Papa in quite a while now.\n@c0@"
  es: "@aStefania@bEso me recuerda que hace tiempo que no veo al mio papino ni a la mia mamma.\n@c0@"
  fr: "@aPandora@bÇa me rappelle que je n'ai pas vu mamma et papa depuis un certain temps.\n@c0@"
  it: "@aViola@bÈ da un po' di tempo che non vedo la mammina e il paparino...\n@c0@"
  ja: "@a@bデボラ「そういえば\n\tしばらく　パパやママの顔を\n\t見ていなかった気がするわね。\n@c0@"
501:
  de: "@aGriselda@bWir gehen nach Mostroferrato, %a000090. Wenn wir ihnen nicht ab und zu ihre Enkelkinder präsentieren, fangen sie noch an, sich zu beklagen.\n@c0@"
  en: "@aDebora@bWe're going to Mostroferrato, %a000090.\nIf we don't go and show them the grandchildren from time to time, they'll never stop moaning.\n@c0@"
  es: "@aStefania@bAndiamo a Mostroferrato, %a000090.\nSi no les llevamos a sus nietos de vez en cuando, no dejarán de quejarse.\n@c0@"
  fr: "@aPandora@bNous partons pour Mostroferrato, %a000090. Si on ne leur emmène pas leurs petits-enfants de temps en temps, ils vont passer leur temps à se plaindre.\n@c0@"
  it: "@aViola@bAndiamo a Mostroferrato, %a000090.\nDopotutto i miei genitori hanno diritto di vedere la loro adorata figlia di quando in quando, no?\n@c0@"
  ja: "@a@bデボラ「サラボナへ行くわよ　%a000090。\n\tたまには　孫を見せにいかないと\n\t２人とも　スネちゃうから。\n@c0@"
502:
  de: "@aGriselda@bIch kann hier einfach nicht schlafen. Das nächste Mal übernachten wir wieder in einer Herberge in der Stadt, ja?\n@c0@"
  en: "@aDebora@bI just can't seem to sleep well here.\nFind us an inn in a town next time, okay?\n@c0@"
  es: "@aStefania@bNon posso dormire bien aquí.\r\nLa próxima volta busca una posada en una ciudad, ¿capisci?\n@c0@"
  fr: "@aPandora@bJe n'arrive pas à bien dormir, ici. Trouve-nous une auberge pour la prochaine fois, entenduⓡ\n@c0@"
  it: "@aViola@bHo dormito malissimo, sai? Non riesco proprio a rilassarmi qui all'abbazia... C'è troppo silenzio! La prossima volta pernotteremo in una locanda in città.\n@c0@"
  ja: "@a@bデボラ「やっぱり　ここにいると\n\t落ち着いて　眠れないわ。\n\t次は　町で宿をとってちょうだいね。\n@c0@"
503:
  de: "@aGriselda@bNera hat hier eine Unterweisung in den häuslichen Tugenden erhalten.\n@c0@"
  en: "@aDebora@bNera did her domestic goddess training here.\n@c0@"
  es: "@aStefania@bNera vino aquí para il suo curso de economía doméstica de la Diosa.\n@c0@"
  fr: "@aPandora@bC'est ici que Nera a fait son éducation domestique\r\net religieuse.\n@c0@"
  it: "@aViola@bQui è dove Nera frequentò un corso di preparazione al matrimonio.\n@c0@"
  ja: "@a@bデボラ「そういえば　フローラは\n\tこの修道院で　花嫁修業をしたのよね。\n@c0@"
504:
  de: "@aGriselda@bPapa wollte mich natürlich auch hierhin schleppen, aber das hat sich für mich nach viel zu viel Arbeit angehört...\n@c0@"
  en: "@aDebora@bPapa tried to get me to come along, but it sounded far too much like hard work to me.\n@c0@"
  es: "@aStefania@bIl mio papino quería que yo viniese también, ma me pareció un trabajo troppo duro.\n@c0@"
  fr: "@aPandora@bPapa a essayé de me pousser à venir aussi, mais ça semblait demander beaucoup trop de travail à mon goût.\n@c0@"
  it: "@aViola@bIl mio paparino avrebbe voluto che anch'io lo seguissi, ma gli feci capire chiaro e tondo che non avevo nessuna voglia di chiudermi in un monastero...\n@c0@"
  ja: "@a@bデボラ「私も　ここで修行しなさいって\n\tパパに言われたけれど\n\tめんどうなことはキライだから　断ったの。\n@c0@"
505:
  de: "@aGriselda@bIch weiß wirklich nicht, wie Nera es an solch einem einsamen Ort so lange ausgehalten hat.\n@c0@"
  en: "@aDebora@bI can't believe Nera managed to put up with being in such a lonely place for so long.\n@c0@"
  es: "@aStefania@bNon posso credere que Nera soportase estar tanto tiempo en un lugar tan solitario.\n@c0@"
  fr: "@aPandora@bJe n'en reviens pas que Nera ait réussi à rester dans un endroit pareil pendant si longtemps.\n@c0@"
  it: "@aViola@bCome avrà fatto Nera a restare tanto tempo in questo mortorio?!\n@c0@"
  ja: "@a@bデボラ「こんなに　静かな場所で\n\t寂しがりやのフローラが\n\tよく　ガマンできたものだわ。\n@c0@"
506:
  de: "@aGriselda@bDas wäre nichts für mich gewesen, nicht nur wegen der Einsamkeit...\n@c0@"
  en: "@aDebora@bI couldn't have stood it myself, and not just because it's so lonely.\n@c0@"
  es: "@aStefania@bYo no hubiese podido, y non solo por lo solitario.\n@c0@"
  fr: "@aPandora@bMoi, je ne l'aurais pas supporté, et pas seulement parce que c'est très isolé.\n@c0@"
  it: "@aViola@bIl solo pensiero di trascorrere qui più di qualche minuto mi manda in depressione...\n@c0@"
  ja: "@a@bデボラ「私にとっては　ちがう意味で\n\t耐えられそうにもない　場所だけど。\n@c0@"
507:
  de: "@aGriselda@bEs ist schon eine Weile her, seit wir das letzte Mal hier waren, aber es ist immer noch genauso laut und geschäftig wie eh und je.\n@c0@"
  en: "@aDebora@bIt's been a while since we were last here. It's as bustling as ever. And a bit on the noisy side, just like it always was.\n@c0@"
  es: "@aStefania@bYa hacía tempo que no pasábamos por aquí. Está tan animato como sempre. Y es más bien ruidoso, como solía ser.\n@c0@"
  fr: "@aPandora@bÇa faisait un moment qu'on n'était pas venus ici.\r\nC'est toujours aussi animé. Et un peu trop bruyant, pour ne pas changer.\n@c0@"
  it: "@aViola@bQuesto posto non cambia mai: è affollato, rumoroso, quasi caotico...\nLo adoro!\n@c0@"
  ja: "@a@bデボラ「この町に来るのも　ひさしぶりね。\n\tあいかわらず　華やかだわ。\n\tうるさすぎるところも　変わってないけど。\n@c0@"
508:
  de: "@aGriselda@bJetzt herrscht hier jede Menge Leben, aber früher war es anscheinend fast so etwas wie eine Geisterstadt.\n@c0@"
  en: "@aDebora@bThe place is bustling now, but apparently it used to be a bit of a ghost town.\n@c0@"
  es: "@aStefania@bAhora esto está lleno, pero al parecer era una città fantasma.\n@c0@"
  fr: "@aPandora@bCet endroit est très animé, aujourd'hui, mais apparemment, c'était un peu une ville fantôme avant.\n@c0@"
  it: "@aViola@bOggi questo è un posto vivace, movimentato...\nUn tempo, però, era un villaggio fin troppo noioso.\n@c0@"
  ja: "@a@bデボラ「今でこそ　にぎやかだけど\n\tここの町って　ずっと昔は\n\tさびれた　村だったって話よ。\n@c0@"
509:
  de: "@aGriselda@bWenn sich ein kleines Dorf in eine geschäftige Stadt verwandeln kann, besteht ja auch noch für dich Hoffnung, %a000090.\n@c0@"
  en: "@aDebora@bIf a small village can turn into a bustling town, there's hope for you to make something of yourself yet, %a000090.\n@c0@"
  es: "@aStefania@bSi un pueblo piccolo se puede convertir en una ciudad bulliciosa, aún hay esperanzas per te, %a000090.\n@c0@"
  fr: "@aPandora@bSi un petit village peut se transformer en une ville pleine d'animation, ça nous laisse encore une petite chance de faire quelque chose de toi, %a000090.\n@c0@"
  it: "@aViola@bSe un paesino più tranquillo di un camposanto può trasformarsi in una città animata e allegra, allora anche un pappamolle può diventare un vero duro!\n㈡\nSì, %a000090: sto parlando proprio di te!\n@c0@"
  ja: "@a@bデボラ「小さな村も　華やかな町に\n\t変われるんだから　%a000090でも\n\tいつかは　カンロクがつくかもね。\n@c0@"
510:
  de: "@aGriselda@bUnglaublich ⓚⓛ Ich kämpfe für den Frieden in der Welt, und was machen die Leute? Sie treiben sich den lieben langen Tag im Kasino rum.\n@c0@"
  en: "@aDebora@bHere I am, doing my best, and yet folk here are hanging about in the casino at all hours.\n@c0@"
  es: "@aStefania@bAquí me tienes, dándolo tutto, y la gente sigue pasándose todo el día en el casino.\n@c0@"
  fr: "@aPandora@bAlors voilàⓢ moi je suis là, à faire de mon mieux, et tous les gens du coin passent leur temps à traîner au casino.\n@c0@"
  it: "@aViola@bNon è giusto!\nNoi ci stiamo dannando per salvare il mondo, mentre tutti gli altri non pensano ad altro che a divertirsi!\n@c0@"
  ja: "@a@bデボラ「私が　こんなに苦労しているのに\n\tこんな時間から　カジノだなんて。\n@c0@"
511:
  de: "@aGriselda@bDas macht mich so wütend! Aber Lust auf ein kleines Spielchen hätte ich schon. Es muss ja auch nicht lange dauern...\n@c0@"
  en: "@aDebora@bIt makes me so angry! I think we should have a bit of fun while we're here too. Just a bit, mind you.\n@c0@"
  es: "@aStefania@b¡Sonno arrabbiata! Credo que también deberíamos divertirnos un poco mientras estamos aquí.\n@c0@"
  fr: "@aPandora@bÇa m'éneeeeerveⓠ Je crois qu'on devrait se divertir un peu nous aussi, pendant qu'on est là. Juste un peu, hein.\n@c0@"
  it: "@aViola@bSai che ti dico? Rilassiamoci anche noi!\nDimentichiamo i nostri guai e spassiamocela un po', anche se solo per qualche ora!\n@c0@"
  ja: "@a@bデボラ「なんだか　アタマにきたから\n\t私たちも　少し　遊んでいくわよ。\n\tでも　あくまで　ちょっとだけ　ね。\n@c0@"
512:
  de: "@aGriselda@bIch würde dich nicht schelten, wenn du nachts ausgehst. Es sei denn, mir wäre gerade danach...\n@c0@"
  en: "@aDebora@bI wouldn't give you any grief for going out at night. Unless I felt like it at the time, that is.\n@c0@"
  es: "@aStefania@bSi salieses por la notte, no te echaría una bronca ni nada. Bueno, hay cosas peores que una bronca, ¿capisci?\n@c0@"
  fr: "@aPandora@bCe n'est pas moi qui te reprocherais de sortir le soir. Sauf si l'envie m'en prenait sur le moment, en fait.\n@c0@"
  it: "@aViola@bSe la moglie non vuole, il marito non può.\nÈ così che funzionano i matrimoni, caro.\nNon lo sapevi?\n@c0@"
  ja: "@a@bデボラ「私は別に　あんたが夜に出歩いても\n\tうるさく言ったりは　しないわよ。\n\tそのときの　気分にもよるけどね。\n@c0@"
513:
  de: "@aGriselda@bWenn diese Waffen das Kämpfen so sehr erleichtern, haben sie bestimmt auch ihren Preis.\n@c0@"
  en: "@aDebora@bIf it makes battles that much easier, I imagine it would fetch quite a price.\n@c0@"
  es: "@aStefania@bSi hacen que luchar sea tan facile, supongo que se podrían vender por molto oro.\n@c0@"
  fr: "@aPandora@bSi ça simplifie autant les combats, j'imagine que ça doit valoir son pesant d'or.\n@c0@"
  it: "@aViola@bImmagino che armi del genere valgano una fortuna!\n@c0@"
  ja: "@a@bデボラ「戦いが楽になる　装備品なら\n\t手に入れる価値が　ありそうね。\n@c0@"
514:
  de: "@aGriselda@bAber die Suche nach ihnen scheint ziemlich mühselig zu sein... Das überlasse ich dann dir, %a000090. Mich nervt so was.\n@c0@"
  en: "@aDebora@bSearching for it seems like a bit of a pain, though.\nI'll leave that to you, %a000090. Things like that irritate me too much.\n@c0@"
  es: "@aStefania@bMa buscarlas es un fastidio.\nTe dejo a ti la tarea, %a000090. Esas cosas me irritan tanto...\n@c0@"
  fr: "@aPandora@bMais ça a l'air pénible à chercher. Je te laisse t'en charger, %a000090. Les trucs comme ça, ça m'énerve trop.\n@c0@"
  it: "@aViola@bPerché non provi a cercarle, %a000090?\nSe vuoi farlo, hai il mio permesso.\n㈡\nTi aiuterei volentieri, ma sai che non sono mai stata brava nelle cacce al tesoro...\n@c0@"
  ja: "@a@bデボラ「でも　さがすのは　大変そうね。\n\tそれは　%a000090にまかせたわよ。\n\t私は　めんどうなことは　したくないし。\n@c0@"
515:
  de: "@aGriselda@bNa, mit der Geschäftstüchtigkeit kann man's auch übertreiben. Wenn er so weitermacht, vergrault er noch die Leute.\n@c0@"
  en: "@aDebora@bIt's all well and good being enthusiastic about your business, but he's going to scare people off if he's not careful.\n@c0@"
  es: "@aStefania@bNo pasa niente por ser un poco entusiasta con tu trabajo, ma si no es un po' prudente la gente se asustará.\n@c0@"
  fr: "@aPandora@bC'est bien joli d'être aussi enthousiaste sur ses affaires, mais s'il ne fait pas attention, il risque de faire peur aux gens.\n@c0@"
  it: "@aViola@bSalve!\nMi piace essere accolta con tanto entusiasmo...\n@c0@"
  ja: "@a@bフローラ「商売熱心なのは　けっこうですけど\n\tこのようなやりかたでは　かえって\n\tお客さまを　逃がしてしまいますわ。\n@c0@"
516:
  de: "@aGriselda@bDer hat vielleicht Nerven, mir einfach so etwas aufschwatzen zu wollen!\n@c0@"
  en: "@aDebora@bHe's got some nerve, trying to force a sale on me!\n@c0@"
  es: "@aStefania@b¡Será caradura! ¡Ha intentado que le compre a la forza!\n@c0@"
  fr: "@aPandora@bIl ne manque pas d'air pour essayer comme il le fait de me forcer à acheter quelque choseⓠ\n@c0@"
  it: "@aViola@bPuò sorridere quanto gli pare, ma non riuscirà mai a vendermi qualcosa che non desidero acquistare!\n@c0@"
  ja: "@a@bデボラ「やるわね　この店員……。\n\tこの私を　ムリヤリ客にしようだなんて。\n\tなかなか　いい根性を　しているわ。\n@c0@"
517:
  de: "@aGriselda@bWenn %a001240 ein normaler Junge wäre, könnte er auch so durch den Schlossgarten rennen.\n@c0@"
  en: "@aDebora@bIf %a001240 was just a normal boy, he'd be running around the castle gardens just like that.\n@c0@"
  es: "@aStefania@bSi %a001240 fuese un bambino normal, correría così por los jardines del castello.\n@c0@"
  fr: "@aPandora@bSi %a001240 était un petit garçon comme les autres, il serait sans doute en train de courir comme ça dans les jardins du château.\n@c0@"
  it: "@aViola@bSe %a001240 e %a001250 fossero bambini come gli altri, potrebbero giocare tranquillamente come fanno i loro coetanei...\n@c0@"
  ja: "@a@bデボラ「%a001240が　ふつうの子供だったら\n\t今頃　あんなふうに　お城の庭を\n\tかけまわっていたんでしょうね。\n@c0@"
518:
  de: "@aGriselda@bPapa wollte auch mal so eine haben. Scheinbar ist er nicht der Einzige, der eine Leidenschaft für komischen Krempel hat.\n@c0@"
  en: "@aDebora@bI remember Papa wanting one of those a long time ago. Looks like he's not the only one who goes in\r\nfor curiosities.\n@c0@"
  es: "@aStefania@bRicordo que il mio papino también quería uno de esos hace tiempo. Sembra que no es el único aficionado a las curiosidades.\n@c0@"
  fr: "@aPandora@bJe me souviens que papa en voulait une, il y a longtemps. Apparemment, il n'est pas le seul à\r\navoir un faible pour les objets bizarres.\n@c0@"
  it: "@aViola@bTempo fa anche il mio paparino voleva una cintura degli Slime, poi gli passò la voglia. Disse che non gli andava di aspettare tanto tempo per averla...\n@c0@"
  ja: "@a@bデボラ「そういえば　昔　パパも\n\tあの　のれんを　ほしがっていたわ。\n\t……パパ以外にも　物好きがいるのね。\n@c0@"
