  es: "@aNera@bTú serías un dragón feroce y magnífico... ¡Ah!\n@c0@"
  fr: "@aNera@bTu serais si beau et si puissant en dragon... Ahⓠ\n@c0@"
  it: "@aNera@bAmore mio, saresti un drago terribilmente affascinante...\n@c0@"
  ja: "@a@bフローラ「竜になった　あなたも\n\tワイルドで　ステキだと思いますわ。\n\tぽっ……。\n@c0@"
109:
  de: "@a%0%a001240@bStell dir doch nur vor, du könntest dich in einen riesigen Drachen verwandeln!\n@c0@"
  en: "@a%0%a001240@bImagine how cool it'd be to turn into a great\nbig dragon!\n@c0@"
  es: "@a%0%a001240@b¡Imagínate, convertirse en un dragón enorme y grandote!\n@c0@"
  fr: "@a%0%a001240@bTu imagines comme ça serait génial de devenir un énorme dragonⓠ\n@c0@"
  it: "@a%0%a001240@bSarebbe troppo bello se potessi trasformarmi in un drago! Mi divertirei tantissimo a bruciare la paella dello zio Sancho...\n@c0@"
  ja: "@a@b%a001240「大きな竜になんて\n\t気分よさそ～！\n@c0@"
110:
  de: "@aSancho@bIn diese Stab muss sehr viel dunkle Magie stecken. Darüber möchte iss gar nisst nachdenken.\n@c0@"
  en: "@aSancho@bWhat kind of dark magic must be eenside thees estaff? I no like to theenk about eet.\n@c0@"
  es: "@aSancho@b¡Híjole! ¿Qué clase de magia negra hay dentro de ese báculo? No quiero pensar en eso ni tantito.\n@c0@"
  fr: "@aSancho@bJ-Je me demande q-quelle magie noire il y a d-dans ce bâton... Je p-préfère ne pas y penser.\n@c0@"
  it: "@aSancho@b¿Una mazza que permette de trasformarse en un drago?\n¡Ay, que arma portentosa!\n@c0@"
  ja: "@a@bサンチョ「そんな　つえには\n\tどんな魔力が　秘められているのか…\n\t考えただけでも　おそろしいですね。\n@c0@"
111:
  de: "@aBianca@bHat man so was schon gesehen! Lässt einfach seine Arbeit im Stich, um im Kasino abzuhängen.\n@c0@"
  en: "@aBianca@bFancy ditchin' your work just so you can go and doss about in the casino!\n@c0@"
  es: "@aBianca@b¡Hay que ver, dejar el trabajo para poder hacer el lerdo en el casino!\n@c0@"
  fr: "@aBianca@bC'est quand même fou de laisser son travail en plan uniquement pour aller prendre du bon temps au casino.\n@c0@"
  it: "@aBianca@bMa senti che tipo! Mollare il lavoro per andare a scialacquare quattrini al casinò!\nSe fossi sua moglie, gliene direi quattro!\n㈡\nMia buona dea, ti ringrazio di non avermi fatto sposare un tipo del genere!\n@c0@"
  ja: "@a@bビアンカ「なんて人なの！\n\t仕事をほうりだして　カジノへ\n\t遊びに行くなんて……。\n@c0@"
112:
  de: "@aNera@bOh je! Stell dir vor, seinen Laden einfach so zu verlassen! Ich hoffe nur, darin gibt es nichts allzu Wertvolles.\n@c0@"
  en: "@aNera@bOh dear! Fancy leaving his shop like that.\r\nI hope there's nothing too valuable here.\n@c0@"
  es: "@aNera@b¡Mamma mia! Se ha ido de la sua tienda así, sin más.\r\nEspero que no haya niente valioso aquí.\n@c0@"
  fr: "@aNera@bÇa alorsⓠ Tu te rends compte, il abandonne sa boutique comme çaⓡ J'espère qu'il n'y a rien\nde trop précieux, ici.\n@c0@"
  it: "@aNera@bMa che fa?! Lascia il negozio incustodito?!\nE se arrivasse un ladro?\n@c0@"
  ja: "@a@bフローラ「あらまあ　お店をほうって…\n\t大事なものは　おいてないのかしら？\n@c0@"
113:
  de: "@a%0%a001240@bHm? Er ist einfach gegangen! Das Kasino muss ihm großen Spaß machen...\n@c0@"
  en: "@a%0%a001240@bYikes! He just left! He must've really wanted to go and gamble, mustn't he?\n@c0@"
  es: "@a%0%a001240@b¡Arrea! ¡Se ha largado! Debía de estar muerto de ganas de jugar, ¿eh?\n@c0@"
  fr: "@a%0%a001240@bQuoiⓡⓐ Il est parti comme çaⓡⓐ Il devait vraiment avoir envie de jouerⓠ\n@c0@"
  it: "@a%0%a001240@bNon credo sia un'ottima idea abbandonare il negozio in questo modo...\n@c0@"
  ja: "@a@b%a001240「うわ…　行っちゃったね。\n\tよっぽど　行きたかったんだろうなあ。\n@c0@"
114:
  de: "@a%0%a001250@bHm... Das heißt, dass wir leider nichts einkaufen können.\n@c0@"
  en: "@a%0%a001250@bUm... That means we can't do any shopping now.\n@c0@"
  es: "@a%0%a001250@bMmm... Pero eso quiere decir que no podemos comprar nada.\n@c0@"
  fr: "@a%0%a001250@bMmm... Autrement dit, on ne peut plus rien acheter.\n@c0@"
  it: "@a%0%a001250@bAllora non possiamo fare acquisti?\n@c0@"
  ja: "@a@b%a001250「あの…　これじゃ\n\tお買い物できないの……。\n@c0@"
115:
  de: "@aBianca@bHmm. Man muss aufpassen, wen man heiratet, was? Früh gefreit, schnell bereut, wie es so schön heißt.\n@c0@"
  en: "@aBianca@bHmm. You have to be careful who you marry, eh? Marry in haste and repent at leisure, as they say.\n@c0@"
  es: "@aBianca@bMmm. Hay que tener cuidado con quién se casa uno, ¿eh? No hay nada que pese más que un mal matrimonio, ¿sabes?\n@c0@"
  fr: "@aBianca@bMmm. Il faut faire attention quand on se marie, heinⓡ Deux secondes pour se marier, toute une vie pour regretter, comme on dit.\n@c0@"
  it: "@aBianca@bHa sposato un fannullone che passa la vita al tavolo verde? Se fossi al posto di quella donna, gli farei passare la passione per il gioco a suon di sberle!\n@c0@"
  ja: "@a@bビアンカ「う～ん…　結婚相手は\n\tしんちょうに　えらばないと\n\t苦労するわねえ……。\n@c0@"
116:
  de: "@aNera@bSie sollte ihm sagen, dass sein Verhalten einfach nicht akzeptabel ist. Nur so kann mit einer solchen Situation umgehen.\n@c0@"
  en: "@aNera@bShe should just tell him his behaviour's unacceptable. That's the only way to tackle a situation like that.\n@c0@"
  es: "@aNera@bElla debería decirle que la sua conducta es inaceptable. Es la única forma de enfrentarse a estas situazioni.\n@c0@"
  fr: "@aNera@bElle devrait tout simplement lui dire que son comportement est inacceptable. C'est le seul moyen\r\nde couper court à une situation comme celle-là.\n@c0@"
  it: "@aNera@bQuella signora dovrebbe dire chiaro e tondo al marito che così non possono andare avanti.\nCerte situazioni vanno prese di petto!\n@c0@"
  ja: "@a@bフローラ「ああいうときは　本人に\n\tガツンと　言うのがいいのですわ。\n\t悪いことは　悪いことですもの。\n@c0@"
117:
  de: "@a%0%a001240@bGlaubst du, dass ich eines Tages auch so ende? Hoffentlich nicht!\n@c0@"
  en: "@a%0%a001240@bDo you think I'll end up like that one day? Uh-oh!\n@c0@"
  es: "@a%0%a001240@b¿Tú crees que yo acabaré siendo así? ¡Oh, oh!\n@c0@"
  fr: "@a%0%a001240@bTu crois que je serai comme ça un jourⓡ\nJ'espère pasⓠ\n@c0@"
  it: "@a%0%a001240@bPovera signora, com'è arrabbiata!\nSe un giorno mi sposerò, cercherò di non far innervosire mai mia moglie!\n@c0@"
  ja: "@a@b%a001240「ボクも　いつか\n\tそんなふうに　なっちゃうの？\n\tど　どうしよう……。\n@c0@"
118:
  de: "@aOtto@bKasinos sind etwas ganz Besonderes für Männer. Das versteht eine Frau nicht.\n@c0@"
  en: "@aTuppence@bCasinos are like special havens for some men.\r\nWomen can't possibly understand it.\n@c0@"
  es: "@aAlazar@bPara algunos hombres, el casino es como su refugio particular.\nLas mujeres no pueden comprenderlo.\n@c0@"
  fr: "@aInnocent@bLes casinos sont comme des refuges pour certains hommes. Les femmes ne peuvent pas comprendre.\n@c0@"
  it: "@aSimon@bAlcune persone sono inesplicabilmente attratte dai casinò.\nPer mia fortuna, io non sono tra loro...\n@c0@"
  ja: "@a@bピピン「なにしろ　カジノは\n\t男のロマンですからね。　女子供にゃ\n\tわかるめえ　ってやつですよ。\n@c0@"
119:
  de: "@aBianca@bJa, er sieht nicht gerade so aus, als wäre er in Höchstform...\n@c0@"
  en: "@aBianca@bYeah, he does look in a bit of a state, eh?\n@c0@"
  es: "@aBianca@bParece un poco nerviosillo, ¿eh?\n@c0@"
  fr: "@aBianca@bC'est vrai qu'il n'a pas l'air en forme.\n@c0@"
  it: "@aBianca@bUhm, secondo me si sta già sentendo male...\n@c0@"
  ja: "@a@bビアンカ「ほんと…\n\t見てて　痛々しいわね……。\n@c0@"
120:
  de: "@aNera@bHeiserkeit ist eine Sache, aber er wird noch seinem ganzen Körper schaden, wenn er so weitermacht.\n@c0@"
  en: "@aNera@bIt's not just his throat I'm worried about. He'll damage his whole body if he's not careful.\n@c0@"
  es: "@aNera@bNo es su garganta lo que me preocupa. Si no va con cuidado, acabará veramente enfermo de verdad.\n@c0@"
  fr: "@aNera@bÀ sa place, je n'aurais pas seulement peur pour ma voix. C'est à son corps tout entier qu'il va finir par faire mal.\n@c0@"
  it: "@aNera@bBisogna stare attenti all'alimentazione: come dice il proverbio, ⓕsi è ciò che si mangiaⓖ...\n㈡\nSanta dea!\nNon oso nemmeno immaginare cosa possa essere quell'uomo...\n@c0@"
  ja: "@a@bフローラ「ノドだけでなく\n\t身体にも　悪いですわ。\n\t心配ですわね。\n@c0@"
121:
  de: "@a%0%a001240@bWenn er heiser ist, kann er gar keine Gedichte mehr vortragen oder Lieder singen. Vielleicht muss er sich sogar eine andere Arbeit suchen...\n@c0@"
  en: "@a%0%a001240@bIf his throat gets sore, then he won't be able to read poems or sing songs any more. Maybe he'll have to change jobs.\n@c0@"
  es: "@a%0%a001240@bSi se queda ronco, no podrá leer poemas ni cantar canciones ni nada. A lo mejor, tiene que cambiar de trabajo.\n@c0@"
  fr: "@a%0%a001240@bSi sa voix devient trop rauque, il ne pourra plus lire de poèmes ou chanter de chansons. Peut-être qu'il sera même obligé de changer de travail.\n@c0@"
  it: "@a%0%a001240@bSe mangia in continuazione, dove lo trova il tempo per scrivere canzoni e poemi?\nForse li copia da qualcun altro?\n@c0@"
  ja: "@a@b%a001240「ノド　いためたら\n\tきれいな歌が　うたえないよ。\n\t詩人さん　やめちゃうのかなあ。\n@c0@"
122:
  de: "@aSancho@bNa, so was! Diese Señor, er trinkt am hellissten Tag?! Er sollte besser bis zum Abend warten und eine Paella essen!\n@c0@"
  en: "@aSancho@bAnda! Thees señor, he ees dreenking from eso early een the day? Ees better you wait for the evening and the paella to wash eet down.\n@c0@"
  es: "@aSancho@b¡Ándale! ¿Ese señor empieza a tomar ya a esta hora del día? Es mejor esperar a la noche y tomar para hacer pasar la enchilada.\n@c0@"
  fr: "@aSancho@bAndaⓠ Ce señor, il b-boit si tôt le matinⓡ C'est quand même mieux d'attendre le soir, après oune bonne paella pour boire oun p-petit coup.\n@c0@"
  it: "@aSancho@b¿Quantos chilos de paella dovrei preparare por saziare la fame de esto señor?\n¿Cinque? ¿Dieci? ¿Sessanta?\n@c0@"
  ja: "@a@bサンチョ「こんな時間から\n\tあんなに飲んで…\n\t見ていられないですねえ。\n@c0@"
123:
  de: "@aNera@bOje. Der arme Mann. Dabei wäre seine Liebste bestimmt traurig, wenn sie ihn so sehen könnte.\n@c0@"
  en: "@aNera@bOh dear. The poor man. But I'm sure his\r\nbeloved would be terribly upset to see him\r\nin this kind of state.\n@c0@"
  es: "@aNera@b¡Oh!, cielos. Poverino. Pero seguro que su amada se quedaría molto alterada si lo viese en este estado.\n@c0@"
  fr: "@aNera@bOh, pauvre hommeⓠ Je suis sûre que sa bien-aimée serait vraiment triste de le voir dans cet état.\n@c0@"
  it: "@aNera@bNon so cosa sia successo alla sua donna, ma quel poverino mi fa una gran pena...\n@c0@"
  ja: "@a@bフローラ「まあ　お気のどくに……。\n\tでも　あんな姿を見たら\n\tその女性も　悲しむでしょうね。\n@c0@"
124:
  de: "@a%0%a001250@bSo weint doch nicht! Eure Traumfrau würde sich bestimmt Sorgen um Euch machen!\n@c0@"
  en: "@a%0%a001250@bDon't cry, Mr Poet! Your dream lady will be worried about you if you do!\n@c0@"
  es: "@a%0%a001250@b¡No llore, señor poeta! ¡O la mujer de sus sueños se inquietará!\n@c0@"
  fr: "@a%0%a001250@bNe pleurez pas, Monsieur le poèteⓠ La dame de vos rêves sera inquiète si vous pleurezⓠ\n@c0@"
  it: "@a%0%a001250@bNon piangere, signor poeta!\nLa tua fidanzata s'intristirebbe, se ti vedesse in questo stato...\n@c0@"
  ja: "@a@b%a001250「詩人さん　泣かないで……。\n\tきれいな女の人が　心配してるよ。\n@c0@"
125:
  de: "@aOtto@bWelch eine Tragödie! Ich sollte mich sputen und meine Traumfrau schnell finden. Es wäre doch schrecklich, wenn sie stirbt, bevor ich sie gefunden habe!\n@c0@"
  en: "@aTuppence@bWhat a calamity! I'd better hurry up and find my dream lady, then. It would be terribly inconvenient\r\nif she died before I found her.\n@c0@"
  es: "@aAlazar@bQué contrariedad. Tendré que darme prisa en encontrar a la mujer de mis sueños, pues. Sería un problema si ella muriese antes de encontrarla.\n@c0@"
  fr: "@aInnocent@bQuelle catastropheⓠ J'ai intérêt à me dépêcher de trouver la femme de mes rêves. Ce ne serait pas pratique si elle mourait avant que je ne la trouve.\n@c0@"
  it: "@aSimon@bDiamine! Mi spiace moltissimo per lui!\nDev'essere orribile perdere la donna amata...\n@c0@"
  ja: "@a@bピピン「そりゃ　大変だ！\n\tボクも早く運命の人を　さがさないと。\n\t出会う前に　死ぬのはカンベンですよ。\n@c0@"
126:
  de: "@aBianca@bVerstehst du, %a000090? Das traute Heim muss nicht unbedingt ein konkreter Ort sein.\n@c0@"
  en: "@aBianca@bDo you get it, %a000090? Somewhere you can call home dun't necessarily have to be a physical place.\n@c0@"
  es: "@aBianca@b¿Lo entiendes, %a000090? No se trata de tener una casa en un lugar concreto, si no de hacer de donde estés tu casa.\n@c0@"
  fr: "@aBianca@bTu as compris, %a000090ⓡ Parfois, ton chez toi-n'est pas forcément un endroit précis.\n@c0@"
  it: "@aBianca@bNo, non ho nostalgia di casa.\nLa mia casa è accanto a te.\nSe sei al mio fianco, io sto bene.\n@c0@"
  ja: "@a@bビアンカ「ねえ　%a000090　わかる？\n\t今の人が言ってた　帰る所って\n\t場所のことじゃないのよ。\n@c0@"
127:
  de: "@aBianca@b... Oje, was rede ich denn so geschwollen daher?\n@c0@"
  en: "@aBianca@b...Or am I gettin' a bit too airy-fairy?\n@c0@"
  es: "@aBianca@b... No me habré puesto demasiado trascendental, ¿verdad?\n@c0@"
  fr: "@aBianca@b... Ou est-ce que je vais peut-être chercher\nun peu loinⓡ\n@c0@"
  it: "@aBianca@bAccidenti!\nNon pensavo di essere tanto sdolcinata...\n@c0@"
  ja: "@a@bビアンカ「……って　%a000090には\n\tちょっと　むずかしかったかな？\n@c0@"
128:
  de: "@aNera@bDein Heim ist hier bei mir. Und meins bei dir. Ah, ist es nicht schön, füreinander da zu sein?\n@c0@"
  en: "@aNera@bYour home is right beside me. And mine is right beside you. Ah, it's so nice to be there for each other.\n@c0@"
  es: "@aNera@bIl tuo sitio está aquí, a mi lado. Y el mío, al tuyo. Qué bonito es tenerse el uno al otro, ¿verdad, caro mio?\n@c0@"
  fr: "@aNera@bTon chez-toi, c'est à mes côtés. Et le mien à tes côtés. Ah, c'est si bon d'être là l'un pour l'autre.\n@c0@"
  it: "@aNera@bLa casa non è tanto un luogo fisico, ma soprattutto serenità, pace, calore, armonia.\r\nLa mia casa sei tu, tesoro...\n@c0@"
  ja: "@a@bフローラ「あなたの帰る所は\n\t私のいる場所で…　私の帰る所は\n\tあなたのいる所ですわ。　ぽっ……。\n@c0@"
129:
  de: "@a%0%a001240@bEssen...? Ja, so langsam kriege ich auch Hunger.\n@c0@"
  en: "@a%0%a001240@bDinner...? I'm starting to feel a bit peckish myself.\n@c0@"
  es: "@a%0%a001240@b¿Cena? La verdad es que se me ha abierto el apetito.\n@c0@"
  fr: "@a%0%a001240@bLe dîner... C'est vrai que je commence à avoir un petit creux, moi aussi.\n@c0@"
  it: "@a%0%a001240@bChissà cosa preparerà per cena quella donna...\n@c0@"
  ja: "@a@b%a001240「夕ごはんかあ……。\n\tなんか　ボクも　おなかが\n\tすいてきちゃったよ。\n@c0@"
130:
  de: "@a%0%a001250@bWenn du weggehen würdest, würde ich Essen machen und zu Hause auf dich warten, Papa. Aber ich bin froh, dass wir zusammen auf Reisen sind.\n@c0@"
  en: "@a%0%a001250@bI'd make dinner and wait home for you if you went away, Dad. But I'm glad we're travelling about together at the moment.\n@c0@"
  es: "@a%0%a001250@bSi tú te fueses, papi, yo te haría la cena y te esperaría en casa. Pero ahora mismo estoy muy contenta de viajar contigo.\n@c0@"
  fr: "@a%0%a001250@bJe t'attendrais à la maison et je te ferais à manger si tu devais aller ailleurs, papa. Mais je suis contente qu'on voyage ensemble, en ce moment.\n@c0@"
  it: "@a%0%a001250@bPapà, lo sai che so cucinare un sacco di cose buone? Beh, proprio un sacco no, ma qualche cosa la so preparare!\n@c0@"
  ja: "@a@b%a001250「わたしも　お父さんが出かけたら\n\tごはん作って　待ってます。\n\tでも　今は　いっしょがいいの……。\n@c0@"
131:
  de: "@aOtto@bAus irgendeinem Grund muss ich gerade an meine Mutter denken. Ich hoffe, es geht ihr gut.\n@c0@"
  en: "@aTuppence@bI'm suddenly reminded of Mother for some reason.\r\nI do hope the old stick's getting on alright.\n@c0@"
  es: "@aAlazar@bDe pronto me he acordado de mi madre, no sé por qué.\nEspero que la pobre señora se encuentre bien.\n@c0@"
  fr: "@aInnocent@bÇa me fait penser à ma mère, tout à coup.\r\nJ'espère qu'elle va bien.\n@c0@"
  it: "@aSimon@bQuella signora mi ricorda un po' mia madre...\nAaah... La mia mamma...!\nLo ammetto: un po' di nostalgia di casa ce l'ho... Sigh!\n@c0@"
  ja: "@a@bピピン「なんだか　急に\n\t母さんのことを　思い出しました。\n\t母さん　元気かなあ……。\n@c0@"
132:
  de: "@aBianca@bWenn er tagsüber schläft, ist er nachts wahrscheinlich hellwach.\n@c0@"
  en: "@aBianca@bIf he's asleep durin' the day, that probably means he works of a night.\n@c0@"
  es: "@aBianca@bSi está durmiendo durante el día, será porque trabaja de noche.\n@c0@"
  fr: "@aBianca@bS'il dort en pleine journée, c'est qu'il doit travailler la nuit.\n@c0@"
  it: "@aBianca@bBeh, certo: se il negozio è aperto solo di notte, quel tipo deve per forza dormire di giorno!\n@c0@"
  ja: "@a@bビアンカ「昼間っから　ねてるなんて\n\t夜の仕事の人かしら。\n@c0@"
133:
  de: "@aNera@bWir sollten den Mann nicht stören, wenn sein Laden geschlossen ist. Komm, lass uns gehen.\n@c0@"
  en: "@aNera@bWe shouldn't disturb the man when his shop's closed. Come on, let's go.\n@c0@"
  es: "@aNera@bNo debemos molestarle mientras la tienda está cerrada, caro mio. Vámonos.\n@c0@"
  fr: "@aNera@bOn ne devrait pas déranger cet homme quand sa boutique est fermée. Il vaut mieux partir.\n@c0@"
  it: "@aNera@bNon mi sembra il caso di disturbare quell'uomo durante l'orario di chiusura del negozio.\nDai, andiamocene...\n@c0@"
  ja: "@a@bフローラ「お休み中ですのに　悪いですわ。\n\tもう　行きましょう。\n@c0@"
134:
  de: "@a%0%a001240@bHat der Mann das alles im Schlaf gesagt?!\n@c0@"
  en: "@a%0%a001240@bWas that man saying all that in his sleep!?\n@c0@"
  es: "@a%0%a001240@b¡Todo eso que decía ese hombre, ¿era en sueños?!\n@c0@"
  fr: "@a%0%a001240@bCe type a dit tout ça en dormantⓡⓐ\n@c0@"
  it: "@a%0%a001240@bMa quell'uomo ha parlato nel sonno?\nOppure si è svegliato quando ci siamo avvicinati a lui?\n@c0@"
  ja: "@a@b%a001240「今の人　ねてた？　おきてた？\n\tねごと　だったのかなあ……。\n@c0@"
135:
  de: "@a%0%a001250@bDer schnarcht aber lustig!\n@c0@"
  en: "@a%0%a001250@bWhat a funny way of snoring he had!\n@c0@"
  es: "@a%0%a001250@b¡Qué forma de roncar más graciosa!\n@c0@"
  fr: "@a%0%a001250@bIl ronflait vraiment bizarrementⓠ\n@c0@"
  it: "@a%0%a001250@bMamma mia, come russava quel signore!\n@c0@"
  ja: "@a@b%a001250「かいじゅうさん　みたいな\n\tイビキです……。\n@c0@"
136:
  de: "@aBianca@bWas für Abenteuer der alte Mann wohl erlebt hat? Wir sollten ihn fragen, wenn sich je die Gelegenheit bietet.\n@c0@"
  en: "@aBianca@bI wonder what kind of adventures that old man had. We should ask him if we ever get the chance.\n@c0@"
  es: "@aBianca@bMe pregunto qué clase de aventuras vivió ese abuelo. Deberíamos preguntárselo si tenemos oportunidad, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe me demande quel genre d'aventures a bien pu vivre ce vieil homme. Nous devrions lui poser la question, à l'occasion.\n@c0@"
  it: "@aBianca@bChissà che avventure ha vissuto quell'uomo...\nSarei proprio curiosa di saperlo!\n@c0@"
  ja: "@a@bビアンカ「あのおじいさんは\n\tどんな冒険をしたのかしら。\n\t機会があったら　聞いてみたいわね。\n@c0@"
137:
  de: "@aNera@bPapa war auch ein Abenteurer, als er noch jünger war. Heute sieht man ihm das nicht mehr an.\n@c0@"
  en: "@aNera@bPapa used to be an adventurer when he was younger too. Not that you'd know it to look\r\nat him now.\n@c0@"
  es: "@aNera@bIl mio papino también era un aventurero de joven. Es difícil imaginarlo si lo ves ahora.\n@c0@"
  fr: "@aNera@bPapa aussi était un aventurier, dans sa jeunesse. Même si on ne le dirait pas en le voyant aujourd'hui.\n@c0@"
  it: "@aNera@bAnche mio padre ha vissuto molte avventure quand'era giovane. È stato molto tempo fa, prima che diventasse un armatore di successo.\n@c0@"
  ja: "@a@bフローラ「私の父も　若い頃は\n\t冒険家だったらしいですわ。\n\t今は　そう見えないでしょうけど……。\n@c0@"
138:
  de: "@a%0%a001240@bEin Reisender. Wie aufregend!\n@c0@"
  en: "@a%0%a001240@bA traveller. How exciting!\n@c0@"
  es: "@a%0%a001240@b¡Un viajero! ¡Qué emocionante!\n@c0@"
  fr: "@a%0%a001240@bUn voyageur. C'est génialⓠ\n@c0@"
  it: "@a%0%a001240@bQuell'uomo dice di aver girato il mondo intero, eh?\n@c0@"
  ja: "@a@b%a001240「世界を　またに\n\tかけてたんだって！　かっこいー！\n@c0@"
139:
  de: "@a%0%a001240@bAber eigentlich sind wir ja auch Reisende, oder? Ha ha!\n@c0@"
  en: "@a%0%a001240@bI suppose we're travellers too, aren't we?\nHa ha!\n@c0@"
  es: "@a%0%a001240@bSupongo que nosotros también somos viajeros, ¿no?\n¡Ja, ja!\n@c0@"
  fr: "@a%0%a001240@bJe suppose qu'on est des voyageurs, nous aussi.\nHa ha haⓠ\n@c0@"
  it: "@a%0%a001240@bHah!\nScommetto che io ho visitato molti più posti di lui!\n@c0@"
  ja: "@a@b%a001240「でも　ボクたちだって\n\t世界中　旅してるもんね！\n\t負けてないよ！\n@c0@"
140:
  de: "@a%0%a001250@bDer Mann hat so komisch geblinzelt. Glaubst du, er hat versucht, in die Ferne zu schauen?\n@c0@"
  en: "@a%0%a001250@bThat man was squinting just then. Do you think he was trying to look off into the distance?\n@c0@"
  es: "@a%0%a001250@bEse hombre miraba entrecerrando los ojos. ¿Qué hacía? Miraba a lo lejos, ¿no?\n@c0@"
  fr: "@a%0%a001250@bCet homme n'arrêtait pas de plisser les yeux.\nTu crois qu'il essayait de voir au loinⓡ\n@c0@"
  it: "@a%0%a001250@bLe persone anziane rimpiangono la gioventù, e i giovani vorrebbero diventare grandi in fretta!\nPerché nessuno si gode l'età che ha?!\n@c0@"
  ja: "@a@b%a001250「今の　おじいちゃん\n\t目を　細くしてた……。\n\t遠くを見てたの……？\n@c0@"
141:
  de: "@a%0%a001240@bHeißt das etwa, dass ich nicht gut aussehend bin? Pah!\n@c0@"
  en: "@a%0%a001240@bDoes that mean I'm not handsome? Huh!\n@c0@"
  es: "@a%0%a001240@b¿Eso qué quiere decir? ¿Que yo no soy guapetón? ¡Bah!\n@c0@"
  fr: "@a%0%a001240@bÇa veut dire que je ne suis pas mignonⓡ Peuhⓠ\n@c0@"
  it: "@a%0%a001240@bUhm, questa tipa non m'è mica tanto simpatica...\n@c0@"
  ja: "@a@b%a001240「ボク　男前じゃない？\n\tが～～ん……。\n@c0@"
142:
  de: "@a%0%a001250@bWarum versuchen wir es nicht heute Abend noch mal, Papa?\n@c0@"
  en: "@a%0%a001250@bWhy don't we try again in the evening, Dad?\n@c0@"
  es: "@a%0%a001250@b¿Por qué no probamos otra vez por la noche, papi?\n@c0@"
  fr: "@a%0%a001250@bPourquoi on ne réessaie pas ce soir, papaⓡ\n@c0@"
  it: "@a%0%a001250@bAllora dobbiamo tornare qui di sera?\n@c0@"
  ja: "@a@b%a001250「お父さん　夜に　また\n\t見てもらう？\n@c0@"
143:
  de: "@aSancho@bManchmal man muss siss in seiner Verzweiflung auch an Strohhalme klammern. Vielleisst es ist gar keine so schlechte Idee, zur Wahrsagerin zu gehen.\n@c0@"
  en: "@aSancho@bEsometimes the drowning man, he clutches at the\r\nstraws. Maybe ees no esuch a bad idea to listen to\r\nthe fortune-teller esometimes too.\n@c0@"
  es: "@aSancho@bA veces, el desesperado se agarra a un clavo ardiendo. A lo mejor es una buena idea escuchar qué dice la pitonisa.\n@c0@"
  fr: "@aSancho@bL'homme qui se n-noie cherche à s'aggriper même\r\nà un brin de p-paille. Alors c'est peut-être oune bonne idée d'écouter les v-v-voyants, parfois.\n@c0@"
  it: "@aSancho@bPotrebbe essere una buena idea consultar esta chiaroveggente, l'importante es que no prendiamo por oro colato todo quel que dice...\n@c0@"
  ja: "@a@bサンチョ「おぼれる者は　わらをも　つかむ\n\tと言います。　たまには　占いに\n\tたよるのも　いいかも知れませんね。\n@c0@"
144:
  de: "@a%0%a001240@bAaah! Ihr Gesicht wird ganz unheimlich, wenn sie in die Zukunft guckt!\n@c0@"
  en: "@a%0%a001240@bYikes! Her face goes all scary when she tells\nyour fortune!\n@c0@"
  es: "@a%0%a001240@b¡Arrea! ¡Cuando te lee el futuro, su cara da miedo!\n@c0@"
  fr: "@a%0%a001240@bAahⓠ Son visage se tord quand elle lit ton avenirⓠ\n@c0@"
  it: "@a%0%a001240@bMamma mia, che risata orribile!\nSe me la sogno di notte, me la faccio sotto!\n@c0@"
  ja: "@a@b%a001240「うわ～　びっくりした。\n\t占うときのおばあさん　すごい顔だね。\n@c0@"
145:
  de: "@aOtto@bWahrsager neigen immer dazu, um den heißen Brei herumzureden. Ich muss sagen, dass ich diese Eigenschaft sehr befremdlich finde.\n@c0@"
  en: "@aTuppence@bFortune-tellers always seem to beat about the bush so much. I must admit that I find it rather irritating.\n@c0@"
  es: "@aAlazar@bLos adivinos no hacen más que dar rodeos. Reconozco que eso me saca de quicio.\n@c0@"
  fr: "@aInnocent@bJ'ai toujours l'impression que les voyants ne parlent que par métaphores. Je dois dire que je trouve ça vraiment agaçant.\n@c0@"
  it: "@aSimon@bNon ho mai avuto simpatia per maghi, chiaroveggenti e affini, e questa degna rappresentante della categoria non mi ha certo fatto cambiare idea!\n@c0@"
  ja: "@a@bピピン「占いは　どうも\n\t言い方が　まわりくどくて\n\tイヤになっちゃいますよ！\n@c0@"
146:
  de: "@aBianca@bAll die Ungeheuer dort hinten im Käfig scheinen ja gut erzogen zu sein, was?\n@c0@"
  en: "@aBianca@bAll of the monsters back there in the cage seem to be pretty well-behaved, eh?\n@c0@"
  es: "@aBianca@bTodos esos monstruos de la jaula parecían muy bien educados, ¿verdad?\n@c0@"
  fr: "@aBianca@bTous les monstres enfermés dans la cage là-bas derrière ont l'air bien dressés, nonⓡ\n@c0@"
  it: "@aBianca@bChe carini quei mostri in gabbia...\nSembrano così docili e ubbidienti!\n@c0@"
  ja: "@a@bビアンカ「あの　オリの向こうの\n\t魔物さんたち　みんな\n\tいい子に　してるみたいね。\n@c0@"
147:
  de: "@aNera@bDie Ungeheuer scheinen auf den Alten zu hören.\n@c0@"
  en: "@aNera@bThe monsters here seem to behave just as the old man wants.\n@c0@"
  es: "@aNera@bLos mostri de este lugar se comportan exactamente como quiere el anciano.\n@c0@"
  fr: "@aNera@bIci, les monstres ont l'air de se comporter\r\nexactement comme le vieil homme le veut.\n@c0@"
  it: "@aNera@bI mostri che sono qui dentro sembrano docili e ben educati...\n@c0@"
  ja: "@a@bフローラ「ここにいる　魔物さんたち\n\tみんな　おじいさんの言うことを\n\tよく　聞いているのね。\n@c0@"
148:
  de: "@a%0%a001240@bSieht aus, als hätte Monty, der Monsterhüter, hier auch einen Platz.\n@c0@"
  en: "@a%0%a001240@bIt looks like Monty the monster monitor has a place here too.\n@c0@"
  es: "@a%0%a001240@bParece que Moncho, el cuidador de monstruos, también tiene sucursal aquí.\n@c0@"
  fr: "@a%0%a001240@bOn dirait que Ciobair le berger opère aussi ici.\n@c0@"
  it: "@a%0%a001240@bMa Mister Muster ha un ufficio anche qui?\n@c0@"
  ja: "@a@b%a001240「ここにも　モンスターじいさんの\n\tおうちが　あるんだね。\n@c0@"
149:
  de: "@a%0%a001250@bOh! Sieh dir nur all die Monster in den Käfigen an! Glaubst du, dass der alte Mann hier auch seine Monster hält?\n@c0@"
  en: "@a%0%a001250@bOoh! Look at all the monsters in those cages! Do you think the old man keeps his monsters here too?\n@c0@"
  es: "@a%0%a001250@b¡Oooh! ¡Mira esos monstruos en las jaulas! ¿Crees que el viejo también tiene a sus monstruos aquí?\n@c0@"
  fr: "@a%0%a001250@bOhⓠ Regarde tous ces monstres dans leurs cagesⓠ Tu crois que monsieur Ciobair garde aussi ses monstres iciⓡ\n@c0@"
  it: "@a%0%a001250@bChe carini quei mostri nelle gabbie!\nChissà se ogni tanto escono per fare una passeggiata...\n@c0@"
  ja: "@a@b%a001250「わ～　オリの中\n\tいっぱい魔物さんがいる。\n\tおじいさんの　魔物さんもいるのかな？\n@c0@"
150:
  de: "@aOtto@bLeute, die tapfer genug sind, es mit Monstern aufzunehmen, kann man nur bewundern. Ich frage mich, ob er jemals gebissen wird...\n@c0@"
  en: "@aTuppence@bYou have to admire anyone brave enough to take on monsters like this. I wonder if he ever gets bitten.\n@c0@"
  es: "@aAlazar@bDesde luego, alguien con el valor para cuidar de esos monstruos es digno de admiración. Me pregunto si alguna vez le muerden.\n@c0@"
  fr: "@aInnocent@bQuelqu'un d'assez courageux pour s'occuper\r\nde monstres comme ça force l'admiration.\r\nJe me demande s'il se fait mordre parfois.\n@c0@"
  it: "@aSimon@bCerto che ce ne vuole di coraggio a tenersi in casa dei mostri, eh?! No no, preferisco di gran lunga un tranquillo pesciolino rosso!\n@c0@"
  ja: "@a@bピピン「魔物を　なつかせるなんて\n\tそんけい　しますよ。\n\tかまれたり　しないのかなあ。\n@c0@"
151:
  de: "@aBianca@bSie sieht hier unten etwas fehl am Platz aus. Vielleicht hat der alte Mann sie gern hier, damit sie etwas Leben in die Bude bringt.\n@c0@"
  en: "@aBianca@bShe looks a bit out of place down here. Maybe the old man likes havin' her here to keep him lively.\n@c0@"
  es: "@aBianca@bParece un poco fuera de lugar aquí abajo. Quizá al abuelete le gusta tenerla aquí para animarse, ¿sabes?\n@c0@"
  fr: "@aBianca@bElle n'a pas l'air vraiment à sa place, ici. Peut-être que le vieil homme aime bien l'avoir à ses côtés pour mettre un peu de vie.\n@c0@"
  it: "@aBianca@bSbaglierò, ma la fanciulla ha un debole per il suo anziano principale.\nChissà se riuscirà ad ⓕaddomesticarloⓖ... Ah ah ah!\n@c0@"
  ja: "@a@bビアンカ「なんだか　こんなところには\n\t不似合いな　かっこうね。\n\tおじいさんのシュミかしら？\n@c0@"
152:
  de: "@aNera@bEin Häschenmädel an einem solchen Ort hat so was herrlich Extravagantes!\n@c0@"
  en: "@aNera@bHaving a bunny girl down here gives the place a nice, flamboyant air.\n@c0@"
  es: "@aNera@bUna conejita, veramente le da un aire vistoso y extravagante a este lugar.\n@c0@"
  fr: "@aNera@bAvoir une assistante déguisée en serveuse ici\r\ndonne à cet endroit un côté très... flamboyant.\n@c0@"
  it: "@aNera@bUna bella ragazza come lei è proprio quello che ci vuole per rendere l'ambiente più vivace e allegro, non credi?\n@c0@"
  ja: "@a@bフローラ「こんなところに　バニーさんとは\n\tはなやかで　いいですわね。\n@c0@"
153:
  de: "@a%0%a001240@bDie Assistentin hat echt ein paar gute Ratschläge auf Lager!\n@c0@"
  en: "@a%0%a001240@bThe assistant certainly has some good tips!\n@c0@"
  es: "@a%0%a001240@bEso que dice la ayudante tiene gracia, ¿eh?\n@c0@"
  fr: "@a%0%a001240@bSon assistante donne vraiment de bons tuyauxⓠ\n@c0@"
  it: "@a%0%a001240@bChe bella voce che ha quella ragazza, eh?\n@c0@"
  ja: "@a@b%a001240「さすが　助手のお姉さんは\n\tもの知りだね！\n@c0@"
154:
  de: "@a%0%a001250@bJetzt möchte ich wirklich ins Reich der Feen reisen!\n@c0@"
  en: "@a%0%a001250@bNow I really want to visit the Realm of the Faeries!\n@c0@"
  es: "@a%0%a001250@b¡Ahora sí que quiero ir a visitar el Reino de las Hadas!\n@c0@"
  fr: "@a%0%a001250@bJ'en suis sûre maintenantⓢ je veux aller au royaume des Féesⓠ\n@c0@"
  it: "@a%0%a001250@bVoglio andare nel Regno delle Fate!\n@c0@"
  ja: "@a@b%a001250「妖精さんのところ\n\t行きたくなっちゃった……。\n@c0@"
155:
  de: "@aSancho@bSeltsame Monster? Du kannst es bestimmt kaum abwarten, sie zu sehen, eh, Chico?\n@c0@"
  en: "@aSancho@bWeird monsters?\nYou can't wait to go and esee, eh, friend?\nYou are buzzing like a mosquito!\n@c0@"
  es: "@aSancho@b¿Monstruos raros?\nSeguro que te mueres de ganas de ir, ¿eh, chamaco?\n¡Ya te veo inquieto como guajolote en Navidad!\n@c0@"
  fr: "@aSancho@bDes m-monstre bizarresⓡ\nJe suis sûr que tu as envie d'aller voir, hein, chicoⓡ\nTu ne tiens v-v-vraiment pas en placeⓠ\n@c0@"
  it: "@aSancho@b¿Mostros estranissimos?\nEscommetto que stai pensando de andare a controllare de persona, chico...\n@c0@"
  ja: "@a@bサンチョ「ふむ…\n\tかわったモンスターですか。\n\tおや　坊っちゃん　ウズウズしてますね。\n@c0@"
156:
  de: "@aBianca@bAber du bist doch total gut! Ich wette, dass du dich mit einer Menge Monstern anfreunden könntest.\n@c0@"
  en: "@aBianca@bBut you are totally awesome! I reckon you'll be able to get loads of monsters on board.\n@c0@"
  es: "@aBianca@b¡Pero si tú eres estupendísimo de la muerte! Seguro que te las arreglas para reclutar a un montón de monstruos, ¿sabes?\n@c0@"
  fr: "@aBianca@bMais tu es super bonⓠ Je suis sûre que tu vas sympathiser avec des tas de monstres.\n@c0@"
  it: "@aBianca@b%0%a000090, se eserciterai sui mostri lo stesso fascino che hai su di me, ti farai amiche tantissime bestioline! Eh eh eh!\n@c0@"
  ja: "@a@bビアンカ「%a000090は　達人だもの！\n\tきっと　たくさん　仲間にできるわね。\n@c0@"
157:
  de: "@a%0%a001250@bIch möchte mit ganz vielen Monstern Freundschaft schließen, Papa. Bitte streng dich an, ja?\n@c0@"
  en: "@a%0%a001250@bI want to make friends with lots and lots of monsters. You'll have to try really hard, Dad!\n@c0@"
  es: "@a%0%a001250@bYo quiero ser amiga de muchos monstruos, cuantos más mejor. ¡Tienes que hacerlo muy bien, papi!\n@c0@"
  fr: "@a%0%a001250@bJe veux devenir amie avec plein de monstres.\nIl va falloir que tu y mettes tout ton cœur, papa.\n@c0@"
  it: "@a%0%a001250@bL'ho sempre detto, no?\nI mostri sono creature buone e gentili, ed è possibile fare amicizia con loro!\n\n@c0@"
  ja: "@a@b%a001250「わたし　いろんな\n\tモンスターさんと　仲良くなりたいの。\n\tお父さん　がんばってね。\n@c0@"
158:
  de: "@aSancho@bAn T&T-Brettern? Aber wie viele Tickets bräuchte man dafür, eh?\n@c0@"
  en: "@aSancho@bAt the T 'n' T boards?\r\nHow many tickets you would need for thees, eh?\n@c0@"
  es: "@aSancho@b¿En los tableros de T y T?\n¿Y cuántos boletos se necesitan para eso?\n@c0@"
  fr: "@aSancho@bSur les jeux de TNTⓡ\nEt c-combien de tickets il faut p-pour çaⓡ\n@c0@"
  it: "@aSancho@b¿Vicinos a las Tavolas della Sorte?\nAlloras ce serviranno muchos bigliettos, chico...\n@c0@"
  ja: "@a@bサンチョ「すごろく場ですか…\n\tそんなことしたら　いったい\n\t何枚　すごろく券が必要になるか……。\n@c0@"
159:
  de: "@aSancho@bAber, si! Iss hatte vergessen. Wir haben ja die Freikarte, keine Problema!\n@c0@"
  en: "@aSancho@bBut, sí! I forget!\nNow we have the free pass.\nEes no problem!\n@c0@"
  es: "@aSancho@b¡Ah, lo había olvidado!\nAhora tenemos un abono.\n¡No hay problema, híjole!\n@c0@"
  fr: "@aSancho@bAh, siⓠ J'avais oubliéⓠ On a le laissez-passer.\nAlors pas de p-problèmeⓠ\n@c0@"
  it: "@aSancho@b¡Ay, que sbadato que soy!\n¡Ahora abbiamo el Passepartout della Sorte, y no dobbiamo más preoccuparce de los bigliettos!\n@c0@"
  ja: "@a@bサンチョ「そうでした。　私たちは\n\tパスを　持っていたんでしたね。\n\tいや～　よかった　よかった。\n@c0@"
160:
  de: "@aBianca@bDu bist also schon der Beste. So ein Zufall aber auch, was?\n@c0@"
  en: "@aBianca@bSo you're already the best there is, then. That sort of happened by accident, eh?\n@c0@"
  es: "@aBianca@bAsí que eres el mejor de todos. Eso debe de haber sido pura chiripa, ¿no?\n@c0@"
  fr: "@aBianca@bAlors tu es déjà le meilleur dresseurⓡ\nC'est juste un coup de chance, nonⓡ\n@c0@"
  it: "@aBianca@bCerto che sappiamo un mucchio di cose sui mostri!\nForse persino più di quante non ne sappia il ⓕfantaaasticoⓖ Mister Muster!\n@c0@"
  ja: "@a@bビアンカ「えっ？\n\t%a000090って　もう　一流なの？\n\tひたすら　旅をしてきただけなのにね。\n@c0@"
161:
  de: "@aNera@bNa ja, du hast schließlich auch hart genug gearbeitet. Es wird auch Zeit, dass das mal jemand anerkennt.\n@c0@"
  en: "@aNera@bWell, you have worked really hard for a long time now. It's only right that you receive some\r\nrecognition for it.\n@c0@"
  es: "@aNera@bHas trabajado muy duro durante mucho tiempo. Es lógico que ahora te reconozcan el mérito, caro mio.\n@c0@"
  fr: "@aNera@bEh oui, tu t'es donné tellement de mal pendant tout ce temps... Je trouve que c'est normal qu'on reconnaisse tes talents.\n@c0@"
  it: "@aNera@bNon sarebbe male se all'Abbazia di Su'ncyel tenessero un corso su come addomesticare i mostri...\n㈡\nSarebbe sicuramente un modo efficace per insegnare alle ragazze come comportarsi con gli uomini! Ih ih ih!\n@c0@"
  ja: "@a@bフローラ「あなた　ずっと　がんばって\n\tいらっしゃいましたものね。\n\t一流ですって…　おめでとう　あなた。\n@c0@"
162:
  de: "@a%0%a001240@bJa, du hast sogar Starki und Bjørnson dazu gebracht, sich uns anzuschließen. Das ist echt voll gut!\n@c0@"
  en: "@a%0%a001240@bYeah, you even got Starkers and Rebjørn to join us. That's pretty awesome by anyone's standards!\n@c0@"
  es: "@a%0%a001240@bSi hasta has logrado que Estarkez y Patxín se unan a nosotros. ¡Eso es estupendísimo se mire por donde se mire!\n@c0@"
  fr: "@a%0%a001240@bOuais, même Starky et Renhé sont avec nous. N'importe qui reconnaîtrait qu'il faut être super\nbon pour arriver à un résultat comme çaⓠ\n@c0@"
  it: "@a%0%a001240@bSappiamo tantissime cose sui mostri!\nAbbiamo fatto amicizia persino con Starkiell e Wasinen!\n㈡\nScommetto che nemmeno Mister Muster ci sarebbe riuscito!\n@c0@"
  ja: "@a@b%a001240「だって　お父さんったら\n\tプチタークも　プオーンも　仲間に\n\tしちゃうんだもん。　すごすぎるよ！\n@c0@"
163:
