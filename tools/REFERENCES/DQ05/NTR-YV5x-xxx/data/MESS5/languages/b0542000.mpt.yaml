  it: "@aBianca@bViste e considerate le difficoltà che abbiamo dovuto affrontare in passato, mi auguro davvero che il futuro sia migliore!\n@c0@"
  ja: "@a@bビアンカ「さすが　おじいさんね。\n\t長生きしてるだけあって\n\tまさに　人生の達人って感じだわ。\n@c0@"
224:
  de: "@aNera@bEs gibt ja auch alle möglichen Formen der Unterhaltung in einem Kasino.\n@c0@"
  en: "@aNera@bI suppose there are all sorts of ways to find entertainment in a casino.\n@c0@"
  es: "@aNera@bSupongo que uno se puede divertir de muchas maneras en un casino, veramente.\n@c0@"
  fr: "@aNera@bIl y a aussi différents moyens de s'amuser dans un casino...\n@c0@"
  it: "@aNera@bSarà anche un posto divertente, ma comincio ad averne abbastanza del casinò...\n@c0@"
  ja: "@a@bフローラ「カジノの楽しみ方も\n\tいろいろですわね。\n@c0@"
225:
  de: "@a%0%a001240@bWieso sollen hier alle möglichen Typen rumlaufen? Sind doch ganz normale Leute hier...\n@c0@"
