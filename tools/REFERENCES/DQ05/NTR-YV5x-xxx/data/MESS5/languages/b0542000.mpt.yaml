  fr: "@aNera@bNous ne laisserons pas le monde se faire engloutir par des ténèbres maléfiques... Mais je crois qu'il faut donner à cet homme la possibilité d'expier ses péchés.\n@c0@"
  it: "@aNera@bNon permetteremo che il mondo venga distrutto, non è vero, tesoro?\n㈡\nE comunque abbiamo fatto bene a liberare il prigioniero: la dea lo guiderà sulla retta via, e lui imparerà a guadagnarsi da vivere onestamente!\n@c0@"
  ja: "@a@bフローラ「この世を　闇に　おおわせたりは\n\tしませんけど…　でも\n\tつぐないの機会は　必要ですわよね。\n@c0@"
