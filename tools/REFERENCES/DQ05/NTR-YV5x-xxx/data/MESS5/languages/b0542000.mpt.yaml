  it: "@aBianca@bSecondo me, la slot machine da cento gettoni è una tentazione da cui è meglio stare alla larga...\n㈡\nPuoi vincere una fortuna, ma se ti va male perdi un mucchio di soldi in un colpo solo!\n@c0@"
