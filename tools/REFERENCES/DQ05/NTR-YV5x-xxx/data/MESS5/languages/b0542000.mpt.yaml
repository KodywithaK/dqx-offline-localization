  es: "@aBianca@bEse vestido es impresionante de verdad. Se ve que no han reparado en gastos para el vestuario de este espectáculo, ¿eh?\n@c0@"
  fr: "@aBianca@bC'est vrai que sa robe est magnifique. Apparemment, ils ont investi un paquet d'argent dans les costumes de ce spectacle, heinⓡ\n@c0@"
  it: "@aBianca@bIndossa un vestito bellissimo!\nDevono aver speso un occhio della testa per i costumi...\n@c0@"
  ja: "@a@bビアンカ「ホント　すてきなドレス！\n\tこの劇団　衣装に　ずいぶん\n\tお金　かけてるのね。\n@c0@"
230:
  de: "@aNera@bBei dem Lärm kann man ja kein Wort verstehen.\n@c0@"
  en: "@aNera@bIt's impossible to hear what's being said with all that noise going on.\n@c0@"
  es: "@aNera@bEs impossibile oír niente de lo que se dice con tanto ruido.\n@c0@"
