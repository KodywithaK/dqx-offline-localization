  es: "@aNera@b¡Ah!, interpreta el papel de la madrastra malvagia.\n@c0@"
  fr: "@aNera@bAh, elle joue le rôle de la méchante belle-mère.\n@c0@"
  it: "@aNera@bAnche se è solo una rappresentazione teatrale, sentire certe cose mi fa star male...\n@c0@"
  ja: "@a@bフローラ「あの方は　イジワルな\n\tまま母という役なんですね。\n@c0@"
236:
  de: "@a%0%a001240@bOh Mann! Hat die aber eine laute Stimme!\n@c0@"
  en: "@a%0%a001240@bYikes! She's got a bit of a loud voice on her!\n@c0@"
  es: "@a%0%a001240@b¡Arrea! ¡Vaya vozarrón que tiene!\n@c0@"
  fr: "@a%0%a001240@bWaouhⓠ Elle a une sacrée voix, cette dameⓠ\n@c0@"
  it: "@a%0%a001240@bSecondo me quella signora non è una brava mamma...\n@c0@"
  ja: "@a@b%a001240「うわ～　大きい声！\n\tボク　ビックリしちゃったよ。\n@c0@"
237:
  de: "@aOtto@bIch schaue mir das Ganze lieber aus sicherer Entfernung an.\n@c0@"
  en: "@aTuppence@bI think it might be wise to watch this one from afar.\n@c0@"
  es: "@aAlazar@bCreo que está mejor verla desde lejos.\n@c0@"
  fr: "@aInnocent@bJe crois que je ne vais pas trop m'approcher d'elle.\n@c0@"
  it: "@aSimon@bQuell'attrice è proprio brava a interpretare la parte della matrigna cattiva. Scommetto che nella vita di tutti i giorni è una donna buona e gentile...\n@c0@"
  ja: "@a@bピピン「とりあえず　この舞台は\n\tはなれて見たほうが\n\tいいような気がします。\n@c0@"
238:
  de: "@aBianca@bSie ist wahrscheinlich die Heldin des Stücks.\n@c0@"
  en: "@aBianca@bLooks like she's the heroine of the piece.\n@c0@"
  es: "@aBianca@bParece que es la heroína de la obra, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe crois que c'est elle le personnage principal\r\nde la pièce.\n@c0@"
  it: "@aBianca@bQuella dev'essere la protagonista dello spettacolo...\n@c0@"
  ja: "@a@bビアンカ「あの女の子が　ヒロインなのね。\n@c0@"
239:
  de: "@a%0%a001240@bDas Mädchen wird nicht gut behandelt, oder? Ich weiß, es ist nur eine Geschichte, aber sie tut mir trotzdem leid.\n@c0@"
  en: "@a%0%a001240@bIs that girl being bullied? I know it's just a story, but I still feel sorry for her.\n@c0@"
  es: "@a%0%a001240@b¿Se están metiendo con esa chica? Ya sé que es solo un cuento, pero de todos modos me da lástima.\n@c0@"
  fr: "@a%0%a001240@bEst-ce qu'on maltraite cette filleⓡ Je sais que c'est juste une histoire, mais j'ai quand même de la peine pour elle.\n@c0@"
  it: "@a%0%a001240@bPerché sono tutti cattivi con quella povera ragazza? Capisco che è solo una finzione, ma mi dispiace lo stesso per lei...\n@c0@"
  ja: "@a@b%a001240「あの人　いじめられてるの？\n\tお芝居でも　かわいそうだ……。\n@c0@"
240:
  de: "@a%0%a001250@bIch kenne diese Geschichte! Hast du sie auch schon mal gehört, Papa?\n@c0@"
  en: "@a%0%a001250@bI know this story! Have you heard it before\ntoo, Dad?\n@c0@"
  es: "@a%0%a001250@b¡Conozco esta historia! ¿Tú también la has oído antes, papá?\n@c0@"
  fr: "@a%0%a001250@bJe connais cette histoireⓠ Tu l'as déjà entendue, toi aussi, papaⓡ\n@c0@"
  it: "@a%0%a001250@bPapà, promettimi che non mi farai mai indossare delle scarpe di cartone...\n@c0@"
  ja: "@a@b%a001250「わたし　あのお話　知ってます。\n\tお父さんも　知ってるの？\n@c0@"
241:
  de: "@aOtto@bHm, es lässt sich gar nicht so leicht sagen, ob sie nun wirklich hübsch ist oder nicht, mit all der Schminke im Gesicht.\n@c0@"
  en: "@aTuppence@bHmm. It's rather tricky to tell if she's pretty or not with all that make-up in the way.\n@c0@"
  es: "@aAlazar@bMmm. Con todo ese maquillaje, es difícil decidir si es o no es guapa.\n@c0@"
  fr: "@aInnocent@bMmm. Avec tout ce maquillage, c'est difficile de voir si elle est mignonne ou pas.\n@c0@"
  it: "@aSimon@bAh, questa ragazza è truccata davvero bene!\nIl mascara e l'ombretto valorizzano perfettamente i suoi occhi.\n@c0@"
  ja: "@a@bピピン「う～ん…　化粧のせいで\n\tかわいいのか　かわいくないのか\n\tよく分かりませんね。\n@c0@"
242:
  de: "@aBianca@bEin Palastball! Wie schön! Merkst du was? Wir haben unsere eigene Burg, aber noch nie einen Ball abgehalten...\n@c0@"
  en: "@aBianca@bA palace ball! How nice! Come to think of it, we've\r\ngot our own castle and yet we never put on a dance, eh?\n@c0@"
  es: "@aBianca@b¡Un baile en palacio! ¡Qué bonito! Ahora que lo pienso, nosotros tenemos castillo propio y nunca hemos celebrado un baile...\n@c0@"
  fr: "@aBianca@bUn grand balⓠ Superⓠ Maintenant que j'y pense,\non a notre propre château, mais on n'y a jamais organisé de bal.\n@c0@"
  it: "@aBianca@bUna serata danzante? Ottima idea!\nDovremmo proprio organizzarne una al castello, quando la nostra avventura sarà terminata...\n@c0@"
  ja: "@a@bビアンカ「いいなあ…　ダンスパーティか。\n\tそういえば　私たち　お城の人間なのに\n\tダンスとかって　したことないわよね。\n@c0@"
243:
