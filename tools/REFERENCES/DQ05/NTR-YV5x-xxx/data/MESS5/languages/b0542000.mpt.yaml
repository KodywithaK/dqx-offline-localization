  es: "@a%0%a001240@b¿Por qué dice que hay gente de todo tipo aquí? ¡Yo no veo nada especial! No lo entiendo.\n@c0@"
  fr: "@a%0%a001240@bDes bons, des brutes et des truands...\nJe comprends pas. Tu veux bien m'expliquerⓡ\n@c0@"
  it: "@a%0%a001240@bNon voglio stare in una città dove ci sono anche i cattivi!\nPerché non ce ne andiamo da un'altra parte?!\n@c0@"
  ja: "@a@b%a001240「どうして　カジノで\n\tいろんな人の人生が見えるの？\n\tボクには見えないよ。　おかしいなあ。\n@c0@"
226:
  de: "@a%0%a001250@bIch mag Kasinos nicht. Da ist es immer so laut.\n@c0@"
  en: "@a%0%a001250@bI don't really like casinos. They're so noisy.\n@c0@"
  es: "@a%0%a001250@bNo me gustan nada los casinos. Hay demasiado ruido.\n@c0@"
  fr: "@a%0%a001250@bJe n'aime pas trop les casinos. Il y a tellement\nde bruit...\n@c0@"
  it: "@a%0%a001250@bHo capito che i casinò non fanno per me: sono troppo rumorosi!\n@c0@"
  ja: "@a@b%a001250「わたし　カジノ\n\tあんまり　好きじゃないの。\n\tだって　うるさいんだもん……。\n@c0@"
227:
  de: "@aBianca@bIch finde ja nicht, dass er auf so was wetten sollte, aber recht hat er, nicht wahr?\n@c0@"
  en: "@aBianca@bI en't sure it's the kind of thing he should be bettin' on, but it looks like he's got a winner there, eh?\n@c0@"
