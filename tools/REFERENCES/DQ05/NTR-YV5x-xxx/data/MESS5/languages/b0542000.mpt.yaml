  it: "@aBianca@bSecondo me vincerà la scommessa...\nTu che ne dici, caro?\nEh eh eh!\n@c0@"
  ja: "@a@bビアンカ「ちょっと　気に入らないけど\n\tかけは　あのバーテンさんの\n\t勝ちになるわね。\n@c0@"
228:
  de: "@aSancho@bEs ist eine Spiel für diese Señor, si? Weil er nissts weiß, gar nissts. Der Glücklisse...\n@c0@"
  en: "@aSancho@bEes like a game for thees señor, eh?\nBecause he doesn't know anytheeng.\nMaybe he's lucky...\n@c0@"
  es: "@aSancho@bPara este señor es como un mero juego, ¿eh?\nPorque él no sabe nada.\nQuizás tiene suerte...\n@c0@"
  fr: "@aSancho@bC-C'est comme un jeu pour ce s-señor, heinⓡ\nC'est parce qu'il ne sait r-rien. Et c'est peut-être mieux p-pour lui...\n@c0@"
  it: "@aSancho@b¡No se dovrebbe escommettere su una cosa tanto seria como l'Eroe Leggendario!\n@c0@"
  ja: "@a@bサンチョ「なにも知らない人は\n\t気楽でいいですね。　やれやれ……。\n@c0@"
229:
  de: "@aBianca@bDas ist wirklich ein schönes Kleid. Diese Kostüme müssen ganz schön was gekostet haben...\n@c0@"
