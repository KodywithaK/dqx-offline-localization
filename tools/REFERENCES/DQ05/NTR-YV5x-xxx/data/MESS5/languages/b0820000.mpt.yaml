0:
  de: "@aKönig Dominicus@bIch sammle die Minimedaillen, die auf der ganzen Welt verstreut sein sollen.\n@c0@"
  en: "@aKing Dominicus@bI'm a collector of mini medals, which are said to be scattered all over the world.\n@c0@"
  es: "@aRey Dominico@bSoy un coleccionista de minimedallas que, se dice, están desperdigadas por todo el mundo.\n@c0@"
  fr: "@aRoi Dominicus@bJe collectionne les mini médailles, qui seraient disséminées dans le monde entier, à ce que l'on dit.\n@c0@"
  it: "@aRe Minikin@b%H0860%X%A0110%XBenvenuto%Z%B0110%XBenvenuta%Z%Y%R0000%XBenvenute%YBenvenuti%Z%Z nel mio regno!\nSono un collezionista di minimedaglie, graziosi oggettini che si trovano sparsi in tutto il mondo.\n@c0@"
  ja: "@a@bメダル王「わしは　世界中の\n\t小さなメダルを　集めておる。\n@c0@"
1:
  de: "@a@bGroßartig! Wie ich sehe, habt Ihr ein paar Minimedaillen für mich. Lasst sie mich sehen, %H0860%X%A0110%Xmein Freund%Z%B0110%Xwertes Fräulein%Z%Ymeine Freunde%Z.\n@c0@"
  en: "@aKing Dominicus@bSplendid! I see you have some mini medals with you. Let me be examining them, %H0860%Xmy friend%Ymy friends%Z.\n@c0@"
  es: "@aRey Dominico@b¡Estupendo! Parece que %H0860%Xllevas%Ylleváis%Z algunas encima. %H0860%XDeja%YDejad%Z que las examine, %H0860%X%A0110%Xamiguito mío%Z%B0110%Xamiguita mía%Z%Y%R0000%Xamiguitas mías%Yamiguitos míos%Z%Z.\n@c0@"
  fr: "@a@bMagnifiqueⓠ Je vois que vous avez des mini médailles. Laissez-moi les examiner, %H0860%Xmon ami%A0110%X%Z%B0110%Xe%Z%Ymes ami%R0000%Xes%Ys%Z%Z.\n@c0@"
  it: "@aRe Minikin@bCosa vedono i miei regali occhietti?\nMi sembra che %H0860%Xtu abbia qualche minimedaglia con te%Yabbiate qualche minimedaglia con voi%Z...\n%H0860%XLasciami%YLasciatemi%Z dare un'occhiata, per favore.\n@c0@"
  ja: "@a@bメダル王「ほほう　メダルを持って来たな。\n\tよし！　わしが預かろう！\n@c0@"
2:
  de: "@aKönig Dominicus@bOh je-mini! Ihr habt noch mehr Minimedaillen mitgebracht! Entschuldigt meine säuerliche Miene, aber selbst ich habe meine Grenzen!\n@c0@"
  en: "@aKing Dominicus@bBy Jimini! I see you've brought yet more mini medals! Sorry to be a moaning minnie, but I'm afraid even I need to draw the line somewhere.\n@c0@"
  es: "@aRey Dominico@b¡Mininfiernos! ¡Veo que me %H0860%Xhas%Yhabéis%Z traído más minimedallas! No %H0860%Xte lo tomes%Yos lo toméis%Z a mal, pero creo que incluso yo tengo que saber cuándo decir basta.\n@c0@"
  fr: "@aRoi Dominicus@bQuel embrouillaminiⓠ Vous avez encore apporté d'autres mini médaillesⓠ Sans vouloir vous offenser, il va falloir que je fixe des limites.\n@c0@"
  it: "@aRe Minikin@bSanti mininumi! %H0860%XHai%YAvete%Z portato altre minimedaglie! Oh, gaudio! Mi scuso per il mio entusiasmo, ma in momenti come questo non riesco minimamente a contenermi!\n@c0@"
  ja: "@a@bメダル王「ほほう　メダルを持って来たな。\n\tしかし　これ以上は　さすがのわしも\n\t預かることはできんのじゃよ。\n@c0@"
3:
  de: "@aKönig Dominicus@bIhr habt %a000570 Minimedaille%H0570%X%Yn%Z bei Euch. Seid Ihr an einer bestimmten Belohnung interessiert, %a000120?\n@c0@"
  en: "@aKing Dominicus@bYou're currently carrying %a000570 mini medal%H0570%X%Ys%Z. Would you like to exchange any of your medals for prizes, %a000120?\n@c0@"
  es: "@aRey Dominico@bActualmente tienes %a000570 minimedalla%H0570%X%Ys%Z. ¿Hay alguna minirrecompensa que prefieras, %a000120?\n@c0@"
  fr: "@aRoi Dominicus@bVous avez actuellement %a000570 mini médaille%I0570%X%Ys%Z.\nY a-t-il quelque chose qui vous ferait plaisir\nen particulier, %a000120ⓡ\n@c0@"
  it: "@aRe Minikin@bAllora, %H0860%Xhai%Yavete%Z trovato %H0570%Xuna minimedaglia. Desideri scambiarla%Y%a000570 minimedaglie. Desideri scambiarle%Z con un oggetto, %a000120?\n@c0@"
  ja: "@a@bメダル王「%a000120からは　現在\n\t%a000570枚のメダルを　預かっておるが\n\tのぞみの　ほうびは　あるかね？\n@c0@"
4:
  de: "@aKönig Dominicus@bWas wollt Ihr denn als Geschenk nominieren?\n@c0@"
  en: "@aKing Dominicus@bWhat may I administer to you?\n@c0@"
  es: "@aRey Dominico@b¿Cuál es %H0860%Xtu%Yvuestro%Z minideseo?\n@c0@"
