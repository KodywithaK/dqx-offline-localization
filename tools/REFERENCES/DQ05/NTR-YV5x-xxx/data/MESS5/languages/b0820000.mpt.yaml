  en: "@aKing Dominicus@bYou'd like %a020100?\nVery well, my little minikin.\n@c0@"
  es: "@aRey Dominico@b¿Que %H0860%Xte%Yos%Z gustaría %a020100? Muy bien, mi%H0860%X %A0110%Xminiamigo%Z%B0110%Xminiamiga%Z%Ys %R0000%Xminiamigas%Yminiamigos%Z%Z.\n@c0@"
  fr: "@aRoi Dominicus@bVous voulez %a020100ⓡ\nTrès bien, mon %A0110%Xamini%Z%B0110%Xaminie%Z.\n@c0@"
  it: "@aRe Minikin@bDesideri avere %a020100?\nMolto bene, %A0110%Xmio piccolo amico%Z%B0110%Xmia piccola amica%Z.\n@c0@"
  ja: "@a@bメダル王「よしっ。\n\t%a000100じゃな。\n@c0@"
7:
  de: "@aKönig Dominicus@bUnd wen möchtet Ihr als %M0100%Xihren%Y%A0100%Xseinen%Z%B0100%Xihren%Z%C0100%Xseinen%Z%Z Empfänger nominieren?\n@c0@"
  en: "@aKing Dominicus@bAnd to whom should I administer %M0100%Xthem%Yit%Z?\n@c0@"
