8:
  de: "@aKönig Dominicus@bAber %a000180 hat die Hände schon voll! Vielleicht solltet Ihr Eure Gegenstände aufräumen und den Platz, den sie einnehmen, minimieren?\n@c0@"
  en: "@aKing Dominicus@bIt seems that %a000180's hands are full enough as it is! Perhaps you should rearrange your items and minify the space they take up.\n@c0@"
  es: "@aRey Dominico@b¡Pero me parece que %a000180 ya lleva demasiadas cosas!\n㈡\nSería una buena minidea ordenar los objetos para minimizar el espacio que ocupan.\n@c0@"
  fr: "@aRoi Dominicus@bMais on dirait que %a000180 ne peut rien porter de plusⓠ Vous devriez peut-être trier vos affaires pour faire un peu de placeⓡ\n@c0@"
  it: "@aRe Minikin@bCredo che %a000180 abbia già fin troppe cose con sé.\n㈡\nNon credi che sarebbe meglio mettere ordine tra i tuoi oggetti, così da fare un minimo di spazio?\n@c0@"
  ja: "@a@bメダル王「しかし　%a000180は　持ち物が\n\tいっぱいではないか！\n\t持ち物の　整理をするかね？\n@c0@"
9:
  de: "@aKönig Dominicus@bDoch da wäre die andere Seite der Medaille... Alle Gegenstände, die %a000180 dabei hat, nehmen wohl eine recht prominente Stellung ein.\n@c0@"
  en: "@aKing Dominicus@bOr perhaps not... I don't mean to meddle, but all of %a000180's items seem to be rather too prominent. \n@c0@"
  es: "@aRey Dominico@bO quizá no... No me llames entrometido, pero yo creo que los objetos de %a000180 ya están minimizados. \n@c0@"
  fr: "@aRoi Dominicus@bOu peut-être que non... Je ne veux pas me mêler de vos affaires, mais tous les objets que portent %a000180 semblent assez importants.\n@c0@"
  it: "@aRe Minikin@bUhm, forse è meglio di no.\nSe i miei regali occhietti non m'ingannano, %a000180 ha con sé molti oggetti importanti.\n@c0@"
  ja: "@a@bメダル王「…と　思ったが\n\t%a000180の持ち物は\n\t大切な物　ばかりじゃな。\n@c0@"
10:
