5:
  de: "@aKönig Dominicus@bHmmm... Es tut mir ja sehr leid, aber Ihr müsst Eure Anstrengungen maximieren und mehr Minimedaillen sammeln, ehe ich mich von so etwas Edlem trenne.\n@c0@"
  en: "@aKing Dominicus@bHmm... I'm afraid you'll need to maximise your efforts and collect more mini medals before I can part with something of such eminence.\n@c0@"
  es: "@aRey Dominico@bMmm... Creo que %H0860%Xtendrás%Ytendréis%Z que maximizar %H0860%Xtu%Yvuestro%Z esfuerzo y recoger más minimedallas antes de que pueda separarme de algo tan minimalista.\n@c0@"
  fr: "@aRoi Dominicus@bMmm... Je suis désolé, mais il va falloir faire mieux et récupérer d'autres mini médailles si vous voulez quelque chose de cette importance.\n@c0@"
  it: "@aRe Minikin@bTemo che tu debba portarmi altre minimedaglie, prima che io possa darti quanto chiedi.\nOrsù, %a000120! Ancora un minimo sforzo!\n@c0@"
  ja: "@a@bメダル王「うーむ……。　もっと\n\tメダルを　集めなくては\n\tそれは　やれんのう。\n@c0@"
6:
