  it: "@aRe Minikin@bSono sempre felice di ricevere minimedaglie!\n㈡\n%H0860%X%A0110%XContinua a portarmene, e ti garantisco che non sarai minimamente deluso dalle ricompense che ti%Z%B0110%XContinua a portarmene, e ti garantisco che non sarai minimamente delusa dalle ricompense che ti%Z%Y%R0000%XContinuate a portarmene, e vi garantisco che non sarete minimamente deluse dalle ricompense che vi%YContinuate a portarmene, e vi garantisco che non sarete minimamente delusi dalle ricompense che vi%Z%Z darò in cambio!\n@c0@"
  ja: "@a@bメダル王「メダルを　見つけて来た者には\n\tほうびを　とらせようぞ！\n@c0@"
