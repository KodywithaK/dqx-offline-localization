  ja: "@a@bネコは　楽しそうに\nあたりを　かぎまわっている。\n@c0@"
241:
  de: "@a@b*: Willkommen im Stift Obendroben, einem heiligen Ort des Gebets für die Dienerinnen der Göttin.\n@c0@"
  en: "@a@b*: Welcome to Heaven's Above Abbey, a holy place of worship for women of the Goddess.\n@c0@"
  es: "@a@b*: Bienvenid%H0860%X%A0110%Xo%Z%B0110%Xa%Z%Y%R0000%Xas%Yos%Z%Z a la Abadía Subcelestis, un lugar sagrado para mujeres fieles a la Diosa.\n@c0@"
  fr: "@a@b*ⓢ Bienvenue à l'abbaye du Firmament. Un lieu de culte sacré destiné aux servantes de la Déesse.\n@c0@"
  it: "@a@b*: %H0860%X%A0110%XBenvenuto%Z%B0110%XBenvenuta%Z%Y%R0000%XBenvenute%YBenvenuti%Z%Z all'Abbazia di Su'ncyel, luogo santo consacrato alla nostra dea misericordiosa.\n@c0@"
  ja: "@a@b＊「ここは　海辺の修道院。\n\t女だけの　祈りの館じゃ。\n@c0@"
242:
  de: "@a@b*: Willkommen im Stift Obendroben, einem heiligen Ort des Gebets für die Dienerinnen der Göttin.\n@c0@"
  en: "@a@b*: Welcome to Heaven's Above Abbey, a holy place of worship for women of the Goddess.\n@c0@"
  es: "@a@b*: Bienvenid%H0860%X%A0110%Xo%Z%B0110%Xa%Z%Y%R0000%Xas%Yos%Z%Z a la Abadía Subcelestis, un lugar sagrado para mujeres fieles a la Diosa.\n@c0@"
  fr: "@a@b*ⓢ Bienvenue à l'abbaye du Firmament. Un lieu de culte sacré destiné aux servantes de la Déesse.\n@c0@"
  it: "@a@b*: %H0860%X%A0110%XBenvenuto%Z%B0110%XBenvenuta%Z%Y%R0000%XBenvenute%YBenvenuti%Z%Z all'Abbazia di Su'ncyel, luogo santo consacrato alla nostra dea misericordiosa.\n@c0@"
  ja: "@a@b＊「ここは　海辺の修道院。\n\t女だけの　祈りの館じゃ。\n@c0@"
243:
  de: "@a@b*: Bei der Göttin! Ihr seid... Ja, Ihr seid es. Eure sanften Augen werde ich nie vergessen.\n@c0@"
  en: "@a@b*: Heavens above! You're... Yes, I couldn't forget those kind eyes you have. So unlike my late\r\nhusband, Goddess rest his soul.\n@c0@"
  es: "@a@b*: ¡Subcelestis! ¿Eres...? Sí, no es posible olvidar esos ojos bondadosos. Nada que ver con los de mi difunto esposo, que la Diosa tenga en su seno.\n@c0@"
  fr: "@a@b*ⓢ Par le Firmamentⓠ Vous êtes... Mais oui, je n'ai jamais oublié la gentillesse de ce regard. Tout le contraire de mon défunt mari, la Déesse ait son âme.\n@c0@"
  it: "@a@b*: Oh, santi numi! Sì, ricordo i tuoi occhi così gentili e profondi, tanto diversi da quelli del mio povero marito, che la dea lo faccia riposare in pace.\n@c0@"
  ja: "@a@b＊「おや？　お前さまは　たしか……。\n\tあたしの　昔の　亭主とちがって\n\tその　やさしそうな瞳……。\n@c0@"
244:
  de: "@a@b*: Wenn ich mich recht entsinne, seid Ihr auf der Suche nach Eurer verschollenen Mutter, nicht wahr?\n@c0@"
  en: "@a@b*: If I remember rightly, you were travelling in search of your long-lost mother, weren't you?\n@c0@"
  es: "@a@b*: Si no recuerdo mal, viajabas en busca de tu madre perdida, ¿no es así?\n@c0@"
  fr: "@a@b*ⓢ Si je me souviens bien, vous voyagiez pour retrouver votre mère disparue, c'est çaⓡ\n@c0@"
  it: "@a@b*: Eri alla ricerca di tua madre scomparsa da molto tempo, se la memoria non m'inganna...\nSai, sono passati tanti anni...\n@c0@"
  ja: "@a@b＊「ええ　ええ　おぼえているとも。\n\tたしか　母上を　さがして\n\t旅を　しているとか……。\n@c0@"
245:
  de: "@a@b*: Was?! Nun habt Ihr auch noch Eure Frau verloren? Verstehe... Sie wurde versteinert, sagt Ihr? Welch grausames Schicksal.\n@c0@"
  en: "@a@b*: What? Now you've lost your wife as well!?\r\nI see... She's been turned to stone. How terrible\r\nfor you.\n@c0@"
  es: "@a@b*: ¿Cómo? ¿También has perdido a tu mujer?\r\nComprendo... Petrificada. Qué cosa más terrible.\n@c0@"
  fr: "@a@b*ⓢ Commentⓡ Maintenant vous avez aussi perdu votre épouseⓡⓐ\n㈡\n*ⓢ Changée en pierre, vous dites... Je vois.\nÇa doit être terrible pour vous.\n@c0@"
  it: "@a@b*: Che cosa?! Ora anche tua moglie è sparita?!\nÈ stata trasformata in pietra?!\nMa è una cosa terribile!\n@c0@"
  ja: "@a@b＊「え？　今は　石にされた奥さまを\n\t助けるために？　なんと　まあ！\n@c0@"
246:
  de: "@a@b*: Nun, wir werden für Euch beten. Möget Ihr beide Frauen wohlbehalten wiederfinden.\n@c0@"
  en: "@a@b*: Well, we shall all pray for you, that you find them both unscathed.\n@c0@"
  es: "@a@b*: Bueno, rezaremos por que encuentres a las dos ilesas.\n@c0@"
  fr: "@a@b*ⓢ Bien, nous allons vous adresser toutes nos prières, afin que vous les retrouviez saines et sauves toutes les deux.\n@c0@"
  it: "@a@b*: Pregherò per te, affinché tu ritrovi entrambe e possa ricondurle a casa sane e salve.\n@c0@"
  ja: "@a@b＊「早く　会えるよう\n\tあたしも　祈っていますよ。\n@c0@"
247:
  de: "@a@b*: Maria hat Glück gehabt. Ein gut aussehender, junger Prinz kam auf seinem strahlenden Schimmel angeritten und heiratete sie.\n@c0@"
  en: "@a@b*: It happened for Maria. A dashing young prince on a dazzling white horse came to marry her and whisk her off into the sunset.\n@c0@"
  es: "@a@b*: A María le sucedió. Apareció un valiente príncipe en un caballo blanco para casarse con ella y llevársela a tierras lejanas.\n@c0@"
  fr: "@a@b*ⓢ C'est arrivé à Maria. Un jeune prince fougueux a surgi sur un magnifique cheval blanc et l'a emmenée vers le soleil couchant pour l'épouser.\n@c0@"
  it: "@a@b*: A Maria è accaduto proprio così! Un meraviglioso principe è giunto in groppa al suo cavallo bianco, le ha chiesto di sposarla e l'ha portata con sé.\n@c0@"
  ja: "@a@b＊「昔　マリアおねえちゃんが\n\t白馬にのった王子さまに　迎えられて\n\tお嫁さんになったみたいに……\n@c0@"
248:
  de: "@a@b*: Du gute Göttin, ich frage dich: Wann wird mein Prinz vorbeikommen?\n@c0@"
  en: "@a@b*: Dear Goddess, when will my prince come?\n@c0@"
  es: "@a@b*: Santa Diosa, ¿cuándo llegará el mío?\n@c0@"
  fr: "@a@b*ⓢ Chère Déesse, quand viendra donc mon princeⓡ\n@c0@"
  it: "@a@b*: Mia cara dea, tu che sai e tutto vedi, dimmi...\nDov'è il mio principe? Che fine ha fatto?\nForse ha smarrito il mio indirizzo?!\n@c0@"
  ja: "@a@b＊「わたしにも　ステキな男性が\n\t現われないかしら……？\n@c0@"
249:
  de: "@a@b*: Ups! Da habe ich wohl geträumt. Mutter wird böse sein, wenn sie mich wieder beim Tagträumen erwischt... Immer schön weiterputzen!\n@c0@"
  en: "@a@b*: Oops! I drifted off again. Mum will be so angry if she catches me daydreaming again.\nOn with the cleaning! On with the cleaning!\n@c0@"
  es: "@a@b*: ¡Huy! Se me va otra vez la cabeza. Como mamá se entere me cae una buena.\r\n¡A limpiar! ¡A limpiar!\n@c0@"
  fr: "@a@b*ⓢ Oupsⓠ Je me suis encore laissée emporter. Maman sera furieuse si elle m'attrape en train de rêvasser. Au ménageⓠ Au ménageⓠ\n@c0@"
  it: "@a@b*: Ops! Devo smetterla di sognare a occhi aperti!\nLa mamma mi sgriderà se mi becca a battere la fiacca! Meglio che mi rimetta a pulire, va'!\n@c0@"
  ja: "@a@b＊「あっ　こんなこと言ったら　また\n\tお母さんに　おこられちゃう！\n\tさあ　おそうじ　おそうじっと……。\n@c0@"
250:
  de: "@aNonne von Obendroben@bWie ich hörte soll es in einem Wald östlich der Stadt Mostroferrato ein Tor zum Feenreich geben.\n@c0@"
  en: "@aNun of the Above@bA rumour has reached me that there is a gateway to the Realm of the Faeries in a forest east of a town called Mostroferrato.\n@c0@"
  es: "@aHermana subcelestial@bSe rumorea que en un bosque al este de una ciudad llamada Mostroferrato hay un portal que conduce al Reino de las Hadas.\n@c0@"
  fr: "@aSœur du Firmament@bUne rumeur m'est parvenue disant qu'il existerait un passage vers le royaume des Fées dans une forêt, à l'est d'une ville appelée Mostroferrato.\n@c0@"
  it: "@aSuora di Su'ncyel@bAlcuni buontemponi sostengono che, nella foresta a est del villaggio di Mostroferrato, c'è un passaggio che conduce nel Regno delle Fate.\n@c0@"
  ja: "@a@b＊「ウワサでは　サラボナという町の\n\t東には　妖精の村に通じる森が\n\tあるそうです。\n@c0@"
251:
  de: "@aNonne von Obendroben@bFalls solch eine zauberhafte Welt tatsächlich existiert, würde ich sie zu gerne mit eigenen Augen sehen.\n@c0@"
  en: "@aNun of the Above@bIf such a fantastic world really existed, I should certainly like to see it for myself.\n@c0@"
  es: "@aHermana subcelestial@bSi ese mundo fantástico existe en realidad, me encantaría verlo.\n@c0@"
  fr: "@aSœur du Firmament@bSi un monde fantastique tel que celui-ci existait, j'aimerais vraiment le voir de mes propres yeux.\n@c0@"
  it: "@aSuora di Su'ncyel@bQuesta è una fandonia bella e buona! Le fate nemmeno esistono, figuriamoci se hanno un regno tutto loro! Certo che la gente ne ha di fantasia, eh?\n@c0@"
  ja: "@a@b＊「もし　それが本当なら\n\t私も　ぜひ　いってみたい\n\tものですわ……。\n@c0@"
252:
  de: "@aNonne von Obendroben@bDies ist die Besucherunterkunft. Es ist etwas beengt, aber möchtet Ihr eine Weile rasten?\n@c0@"
  en: "@aNun of the Above@bThis is the visitors' lodgings. It's rather cramped, but would you like to rest for a while?\n@c0@"
  es: "@aHermana subcelestial@bEstos son los aposentos de los visitantes. Son un poco pequeños, pero si %H0860%Xquieres%Yqueréis%Z descansar un poco...\n@c0@"
  fr: "@aSœur du Firmament@bIl s'agit de la chambre réservée aux visiteurs.\nCe n'est pas très grand, mais voulez-vous tout de même vous y reposer un momentⓡ\n@c0@"
  it: "@aSuora di Su'ncyel@bOffriamo ai nostri visitatori la possibilità di riposare in questi locali. Non è una sistemazione lussuosa, ma %H0860%Xti%Yvi%Z andrebbe di fermarvi per un po'?\n@c0@"
  ja: "@a@b＊「ここは　お客さまの寝室ですわ。\n\tせまい所ですが\n\tお休みになりますか？\n@c0@"
253:
  de: "@aNonne von Obendroben@bSehr gut. Ich wünsche Euch angenehme Träume.\n@c0@"
  en: "@aNun of the Above@bVery well. I wish you pleasant dreams.\n@c0@"
  es: "@aHermana subcelestial@bMuy bien. Dulces sueños.\n@c0@"
  fr: "@aSœur du Firmament@bParfait. Faites de beaux rêves.\n@c0@"
  it: "@aSuora di Su'ncyel@bMolto bene!\n%H0860%XTi%YVi%Z auguro un sonno sereno!\n@c0@"
  ja: "@a@b＊「では　ごゆっくりどうぞ。\n\t良い夢が見られますよう……。\n@c0@"
254:
  de: "@aNonne von Obendroben@bGuten Morgen! Heute ist wieder ein herrlicher Tag.\n@c0@"
  en: "@aNun of the Above@bGood morning! It's another beautiful day outside.\n@c0@"
  es: "@aHermana subcelestial@b¡Buenos días! Hermosa mañana la de hoy.\n@c0@"
  fr: "@aSœur du Firmament@bBonjourⓠ La journée s'annonce magnifique.\n@c0@"
  it: "@aSuora di Su'ncyel@bBuongiorno! Oggi è una splendida giornata.\n@c0@"
  ja: "@a@b＊「おはようございます。\n\t今日も　いい天気ですよ。\n@c0@"
255:
  de: "@aNonne von Obendroben@bJeder unserer Gäste hier in der Abtei liegt uns sehr am Herzen. Ich hoffe doch, dass wir Euch wiedersehen werden.\n@c0@"
  en: "@aNun of the Above@bWe value every guest we have here at the abbey extremely highly. I do hope we'll make your acquaintance again.\n@c0@"
  es: "@aHermana subcelestial@bValoramos muchísimo a todos aquellos que visitan nuestra abadía. Espero que volvamos a vernos.\n@c0@"
  fr: "@aSœur du Firmament@bNous réservons toujours les meilleurs égards aux invités de l'abbaye. J'espère que vous reviendrez nous voir.\n@c0@"
  it: "@aSuora di Su'ncyel@bQui all'Abbazia di Su'ncyel siamo sempre felici di ospitare i pellegrini bisognosi di riposo e di ristoro.\n㈡\n%H0860%XSappi che qui troverai%YSappiate che qui troverete%Z sempre un pasto caldo e un letto pulito.\n@c0@"
  ja: "@a@b＊「この修道院を　おとずれる方は\n\tみな　大切なお客さまですわ。\n\tどうぞ　また　お声をかけてください。\n@c0@"
256:
  de: "@aNonne von Obendroben@bIch möchte Euch diese Figur der Göttin als Talisman für eine sichere Reise schenken.\n@c0@"
  en: "@aNun of the Above@bI'd like you to have this statue of the Goddess as a good luck charm for your safe onward journey.\n@c0@"
  es: "@aHermana subcelestial@bMe gustaría que llevaras esta estatua de la Diosa como amuleto de buena suerte en tu viaje.\n@c0@"
  fr: "@aSœur du Firmament@bJ'aimerais vous donner cette statuette de la Déesse. Elle vous protégera au cours du voyage qui vous attend.\n@c0@"
  it: "@aSuora di Su'ncyel@bVoglio donarti una statuetta della dea.\nQuest'oggetto sacro ti proteggerà ovunque andrai.\n@c0@"
  ja: "@a@b＊「あなた方の　旅の無事をお祈りして\n\tこの　女神像を　さしあげましょう。\n@c0@"
257:
  de: "@a@b%0%a000120 erhält eine Schlichte Statuette.\n@c0@"
  en: "@a@b%0%a000090 receives a crude image.\n@c0@"
  es: "@a@b%0%a000090 recibe una imagen tosca.\n@c0@"
  fr: "@a@b%0%a000090 reçoit une statuette grossière.\n@c0@"
  it: "@a@b%0%a000090 ha ricevuto una statuetta grezza.\n@c0@"
  ja: "@a@b%a000090は　木ぼりの女神像を\nうけとった！\n@c0@"
258:
  de: "@a@b%0%a000180 steckt die Schlichte Statuette ein.\n@c0@"
  en: "@a@b%0%a000180 acquires a crude image.\n@c0@"
  es: "@a@b%0%a000180 obtiene una imagen tosca.\n@c0@"
  fr: "@a@b%0%a000180 récupère la statuette grossière.\n@c0@"
  it: "@a@b%0%a000180 prende la statuetta grezza.\n@c0@"
  ja: "@a@b%a000180は　木ぼりの女神像を\n手に入れた！\n@c0@"
259:
  de: "@aNonne von Obendroben@bDie Statuette haben wir Nonnen des Stifts Obendroben mit Liebe und Gebeten erschaffen.\n@c0@"
  en: "@aNun of the Above@bThat statue was carved with love and prayers by we nuns of Heaven's Above Abbey.\n@c0@"
  es: "@aHermana subcelestial@bEsta estatua fue tallada con amor y plegarias por las monjas de la Abadía Subcelestis.\n@c0@"
  fr: "@aSœur du Firmament@bMes sœurs de l'abbaye du Firmament et moi-même avons mis beaucoup d'amour et de prières dans la réalisation de cette statuette.\n@c0@"
  it: "@aSuora di Su'ncyel@bQuesta statuetta è stata realizzata da noi suore dell'Abbazia.\nIn essa c'è tutto l'amore che proviamo per la dea.\n@c0@"
  ja: "@a@b＊「それは　私たち　修道院に暮らす者が\n\t祈りをこめて　彫ったものです。\n@c0@"
260:
  de: "@aNonne von Obendroben@bSie hat keine besonderen Kräfte oder dergleichen, aber sie wird Euch hoffentlich an Eure Zeit hier erinnern.\n@c0@"
  en: "@aNun of the Above@bIt doesn't have any special powers or anything like that, but I hope it will at least make a nice keepsake of your time here.\n@c0@"
  es: "@aHermana subcelestial@bNo tiene poderes especiales ni nada parecido, pero espero que te sirva como un bonito recuerdo de tu estancia aquí.\n@c0@"
  fr: "@aSœur du Firmament@bElle n'a aucun pouvoir particulier, mais j'espère qu'au moins, elle vous rappellera agréablement votre séjour parmi nous.\n@c0@"
  it: "@aSuora di Su'ncyel@bNon ha alcun potere magico, ma spero che per %H0860%Xte%Yvoi%Z sia un bel ricordo del tempo che %H0860%Xhai%Yavete%Z trascorso qui.\n@c0@"
  ja: "@a@b＊「とくべつなチカラが　宿るものでは\n\tありませんが　この修道院へいらした\n\t記念に　どうぞ　お持ちください。\n@c0@"
261:
  de: "@aNonne von Obendroben@bSeht Ihr, wir hier im Stift nähen unsere eigene Kleidung und versorgen uns selbst mit Nahrung.\n@c0@"
  en: "@aNun of the Above@bWe make all of our own clothes and grow our own food here at the abbey, you see.\n@c0@"
  es: "@aHermana subcelestial@bComo ves, en la abadía confeccionamos nuestra ropa y cultivamos nuestra comida.\n@c0@"
  fr: "@aSœur du Firmament@bNous tissons nos propres vêtements et nous cultivons tout ce que nous mangeons.\n@c0@"
  it: "@aSuora di Su'ncyel@bQui all'Abbazia di Su'ncyel cuciamo gli abiti che indossiamo, e coltiviamo i campi per produrre il cibo che serve per il nostro sostentamento.\n@c0@"
  ja: "@a@b＊「修道院では　衣服も食事も\n\tすべて　自分たちが作ったもので\n\tまかなっています。\n@c0@"
262:
  de: "@aNonne von Obendroben@bDarum sind wir es gewohnt, Dinge selbst zu machen.\n@c0@"
  en: "@aNun of the Above@bSo we're used to making things for ourselves.\n@c0@"
  es: "@aHermana subcelestial@bEstamos acostumbradas a cuidar de nosotras mismas.\n@c0@"
  fr: "@aSœur du Firmament@bNous sommes habituées à tout fabriquer\r\nnous-mêmes.\n@c0@"
  it: "@aSuora di Su'ncyel@bFacciamo del nostro meglio per essere autosufficienti.\n@c0@"
  ja: "@a@b＊「ですから　自然と　何かを作ることに\n\tなれて行くのですわ。\n@c0@"
263:
  de: "@aNonne von Obendroben@bDiesen Raum nutzen wir, um besonders wichtige weibliche Gäste unterzubringen.\n@c0@"
  en: "@aNun of the Above@bThis room is set aside for when we receive important lady guests.\n@c0@"
  es: "@aHermana subcelestial@bEsta habitación está reservada para invitadas especiales.\n@c0@"
  fr: "@aSœur du Firmament@bCette pièce est réservée à nos invitées de marque.\n@c0@"
  it: "@aSuora di Su'ncyel@bQuesta è una stanza riservata per le ospiti ⓕspecialiⓖ che vengono alla nostra abbazia.\n@c0@"
  ja: "@a@b＊「ここは　特別な　おじょうさまを\n\tおあずかりする時のための\n\tお部屋です。\n@c0@"
264:
  de: "@aNonne von Obendroben@bHier haben schon junge Damen aus den reichsten Familien des Landes genächtigt, wisst Ihr.\n@c0@"
  en: "@aNun of the Above@bWe've had young ladies from some of the richest families in the world staying with us here, you know.\n@c0@"
  es: "@aHermana subcelestial@bAquí hemos tenido jovencitas de las familias más pudientes del mundo.\n@c0@"
  fr: "@aSœur du Firmament@bNous avons accueilli certaines jeunes demoiselles issues des plus riches familles du monde, vous savez.\n@c0@"
  it: "@aSuora di Su'ncyel@bAlcune fanciulle provenienti dalle famiglie più benestanti del mondo hanno soggiornato presso di noi.\n@c0@"
  ja: "@a@b＊「かつては　いろいろなお宅から\n\tおじょうさまを　おあずかり\n\tしたものですが……。\n@c0@"
265:
  de: "@aNonne von Obendroben@bDu liebe Güte! Ein Monster in unserem friedlichen Heiligtum!\n@c0@"
  en: "@aNun of the Above@bGood heavens! A monster in our peaceful sanctuary!\n@c0@"
  es: "@aHermana subcelestial@b¡Por la Diosa! ¡Un monstruo en nuestro pacífico santuario!\n@c0@"
  fr: "@aSœur du Firmament@bPar la Déesseⓠ Un monstre dans notre paisible sanctuaireⓠ\n@c0@"
  it: "@aSuora di Su'ncyel@bOh, mia buona dea!\nMa qui c'è un mostro!\n@c0@"
  ja: "@a@b＊「あらあら　モンスターが\n\tここに　入ってくるなんて！\n@c0@"
266:
  de: "@aNonne von Obendroben@bAch, ich verstehe. Du begleitest %a000090, nicht wahr? Ich bin froh, dass du für eine gute Sache arbeitest.\n@c0@"
  en: "@aNun of the Above@bOh, I see. You're with %a000090, are you? Well, I'm glad to hear you're working for a worthy cause.\n@c0@"
  es: "@aHermana subcelestial@b¡Oh!, entiendo. Estás con %a000090, ¿no? Me alegro de oír que trabajas por una causa digna.\n@c0@"
  fr: "@aSœur du Firmament@bOh, je vois. Vous êtes avec %a000090, c'est bien çaⓡ Je suis heureuse que vous souteniez une cause juste.\n@c0@"
  it: "@aSuora di Su'ncyel@bAh, ho capito. Sei con %a000090, non è così?\nBene, sono felice di sapere che anche tu contribuisci a una nobile causa.\n@c0@"
  ja: "@a@b＊「まあ　%a000090さんに\n\t飼われているのね。\n\tいい方に　助けていただいたわね。\n@c0@"
267:
  de: "@aNonne von Obendroben@bEs ist spät. Wir können nicht rund um die Uhr Besucher empfangen, hier leben ja ausschließlich Nonnen. Bitte kommt morgen früh wieder.\n@c0@"
  en: "@aNun of the Above@bIt's late. We're all just nuns here, you know.\r\nWe can't accept visitors at any hour. Please\r\ncome back in the morning.\n@c0@"
