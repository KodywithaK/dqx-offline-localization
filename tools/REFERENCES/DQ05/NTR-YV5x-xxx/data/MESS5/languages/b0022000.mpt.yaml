  ja: "@a@b＊「まあ　人生も　なかなか\n\tすてたもんじゃないね。\n@c0@"
130:
  de: "@a@b*: Hier gibt es nichts mehr von Wert, aber früher sind die Leute auf der Suche nach den berühmten Steinach-Blausteinen von weit her gekommen.\n@c0@"
  en: "@a@b*: There's nothin' of any value here any more, but we used to have people comin' in search of the famous Whealbrook bluestones.\n@c0@"
  es: "@a@b*: Ya no queda nada de valor aquí, pero antes venía gente en busca de las famosas aguamarinas de Arroyofrío.\n@c0@"
  fr: "@a@b*ⓢ Il n'y a plus rien de valeur ici, mais autrefois,\ndes gens venaient souvent pour essayer de trouver l'une des célèbres gemmes bleues de Ruycelieu.\n@c0@"
  it: "@a@b*: Qui non c'è più nulla di valore.\nUn tempo, però, molte persone venivano in questa zona per cercare le famose pietre nobili di Valcava.\n@c0@"
  ja: "@a@b＊「このサンタローズは　今じゃ\n\t何もないけど　昔は　聖なる原石を\n\t掘りに　学者まで来たらしくてね。\n@c0@"
131:
  de: "@a@b*: Vielleicht ist einer von diesen Edelsteinen immer noch irgendwo hier, versteckt in einem großen Felsen in der Höhle oder so.\n@c0@"
  en: "@a@b*: Maybe they're still here somewhere, hidden in big rocks in the cave or somethin'.\n@c0@"
  es: "@a@b*: Quizá sigan por aquí, ocultas en una gran roca de la cueva o algo así.\n@c0@"
  fr: "@a@b*ⓢ Il y en a peut-être encore une ici, cachée dans un gros rocher, dans la grotte.\n@c0@"
  it: "@a@b*: Forse ce ne sono ancora nella caverna, nascoste da qualche parte.\nMagari dentro una grossa roccia, chi lo sa...\n@c0@"
  ja: "@a@b＊「もしかしたら　今でも　洞くつに\n\t落ちてる大きな岩なんかに\n\t埋もれているかもしれないよ。\n@c0@"
132:
  de: "@a@b*: Man kann ja nie wissen. Da drin gibt's nämlich Felsen, die so groß sind, dass sie Leute unter sich begraben können.\n㈡\n*: So was Großes könnte leicht einen kleinen Edelstein verbergen.\n@c0@"
  en: "@a@b*: Anythin's possible. There are rocks in there big enough to trap people underneath them, y'know.\n㈡\n*: Somethin' that big could easily be hidin' a gem.\n@c0@"
  es: "@a@b*: Todo es posible. Ahí dentro hay rocas lo bastante grandes para atrapar a alguien debajo, ¿sabes?\n㈡\n*: Algo así bien podría ocultar una gema.\n@c0@"
  fr: "@a@b*ⓢ Tout est possible. Certains rochers sont plus grands que toi, tu sais.\n㈡\n*ⓢ Une gemme pourrait facilement passer inaperçue avec des rochers de cette taille.\n@c0@"
  it: "@a@b*: Ci sono massi talmente grandi da schiacciare una persona, se dovessero caderle addosso.\n㈡\n*: Le pietre nobili potrebbero trovarsi all'interno di qualche macigno del genere...\n@c0@"
  ja: "@a@b＊「そうだねえ……　人が下じきに\n\tなるくらいの大きな岩なら　その中に\n\t聖なる原石が残ってるんじゃないかい。\n@c0@"
133:
  de: "@a@b*: Huch! Ein Kunde! Ein Kunde!\n@c0@"
  en: "@a@b*: Yay! A customer! A customer!\n@c0@"
  es: "@a@b*: ¡Bien! ¡Clientela! ¡Clientela!\n@c0@"
  fr: "@a@b*ⓢ Ouaisⓠ Un clientⓠ Un clientⓠ\n@c0@"
  it: "@a@b*: Eh?!\n%H0860%X%A0110%XUn cliente! Evviva! C'è un cliente%Z%B0110%XUna cliente! Evviva! C'è una cliente%Z%Y%R0000%XDelle clienti! Evviva! Ci sono delle clienti%YDei clienti! Evviva! Ci sono dei clienti%Z%Z!\n@c0@"
  ja: "@a@b＊「わーい！\n\tお客さんだ　お客さんだ！\n@c0@"
134:
  de: "@a@b*: Hallo. Kennen wir uns?\n@c0@"
  en: "@a@b*: Hello there. Do I know you?\n@c0@"
  es: "@a@b*: Hola. ¿%H0860%XTe%YOs%Z conozco de algo?\n@c0@"
  fr: "@a@b*ⓢ Bonjour. On se connaîtⓡ\n@c0@"
  it: "@a@b*: Ehilà! Salve!\nCi conosciamo?\n@c0@"
  ja: "@a@b＊「はて？　どちらさま\n\tだったかのう……？\n@c0@"
135:
  de: "@a@b*: Als ich beide Eltern verlor und niemanden mehr auf der Welt hatte, hat der alte Mann dort mich aufgenommen.\n@c0@"
  en: "@a@b*: That old man there took me in when I lost both my parents and had no one.\n@c0@"
  es: "@a@b*: Ese anciano me acogió cuando perdí a mis padres y no tenía a nadie.\n@c0@"
  fr: "@a@b*ⓢ Ce vieil homme m'a accueilli chez lui après que j'ai perdu mes deux parents, me retrouvant sans personne.\n@c0@"
  it: "@a@b*: Anni fa persi entrambi i miei genitori, e quell'uomo mi accolse in casa sua.\nDi questo gli sarò sempre grato.\n@c0@"
  ja: "@a@b＊「この　おじいさんは\n\t両親を亡くしたボクを　ひろって\n\t育ててくれたんです。\n@c0@"
136:
  de: "@a@b*: Mit seiner Hilfe konnte ich auch einen eigenen Laden aufmachen. Ich verkaufe die Waffen, die er in seiner Jugend im Steinach-Stollen gesammelt hat.\n@c0@"
  en: "@a@b*: It's thanks to him I was able to start up my shop too. I started off with the weapons he collected in Whealbrook Adit in his younger years.\n@c0@"
  es: "@a@b*: Y gracias a él pude establecer mi tienda: empecé con las armas que reunió en la Boca de Arroyofrío en sus años mozos.\n@c0@"
  fr: "@a@b*ⓢ C'est aussi grâce à lui que j'ai pu\nmonter ma boutique.\n㈡\n*ⓢ J'ai débuté avec les armes qu'il avait trouvées dans la caverne de Ruycelieu dans sa jeunesse.\n@c0@"
  it: "@a@b*: E devo dirgli grazie anche per avermi dato la possibilità di aprire un negozio tutto mio!\n㈡\n*: Ricordo che cominciai la mia attività vendendo le armi che lui aveva trovato nella Grotta di Valcava quand'era giovane.\n@c0@"
  ja: "@a@b＊「ボクが　武器屋を始めたのも\n\tおじいさんが　若い頃　洞くつで\n\t集めた武器が　あるからなんですよ。\n@c0@"
137:
  de: "@a@b*: Ich mache gerade die Betten. Einen erholsamen Schlaf wünsch' ich Euch!\n@c0@"
  en: "@a@b*: I'm just makin' the beds at the moment.\r\nYou have a good rest, won't you?\n@c0@"
  es: "@a@b*: Solo estoy haciendo las camas.\n%H0860%XDescansa%YDescansad%Z bien, ¿de acuerdo?\n@c0@"
  fr: "@a@b*ⓢ Je viens de faire les lits. J'espère qu'ils seront assez confortables.\n@c0@"
  it: "@a@b*: Sto preparando il letto.\nVoglio che tutto sia perfetto per i nostri clienti...\n@c0@"
  ja: "@a@b＊「今　ベッドのしたくを\n\tしてるからね。\n\tゆっくり　休んでおくれ。\n@c0@"
138:
  de: "@a@b*: Zzzz...\n@c0@"
  en: "@a@b*: Zzzz...\n@c0@"
  es: "@a@b*: Zzzz...\n@c0@"
  fr: "@a@b*ⓢ Zzz...\n@c0@"
  it: "@a@b*: Zzz...\n@c0@"
  ja: "@a@b＊「すうすう……。\n@c0@"
139:
  de: "@a@b%0%a000120 untersucht den Boden.\n@c0@"
  en: "@a@b%0%a000120 examines the floor.\n@c0@"
  es: "@a@b%0%a000120 examina el suelo.\n@c0@"
  fr: "@a@b%0%a000120 regarde attentivement le sol.\n@c0@"
  it: "@a@b%0%a000120 esamina il suolo.\n@c0@"
  ja: "@a@b%a000120は　足もとを　調べた！\n@c0@"
140:
  de: "@a@bDort ist ein Blütenzweig!\n@c0@"
  en: "@a@bThere's a blooming branch there!\n@c0@"
  es: "@a@b¡Hay una rama en flor!\n@c0@"
  fr: "@a@bIl remarque une branche en fleurⓠ\n@c0@"
  it: "@a@bC'è un ramo in fiore!\n@c0@"
  ja: "@a@bなんと\n桜のひと枝を　見つけた！\n@c0@"
141:
  de: "@a@b%0%a000180 erhält einen Blütenzweig.\n@c0@"
  en: "@a@b%0%a000180 acquires a blooming branch.\n@c0@"
  es: "@a@b%0%a000180 obtiene la rama en flor.\n@c0@"
  fr: "@a@b%0%a000180 récupère la branche en fleurⓠ\n@c0@"
  it: "@a@b%0%a000180 ha trovato un ramo in fiore.\n@c0@"
  ja: "@a@b%a000180は　桜のひと枝を\n手に入れた！\n@c0@"
142:
  de: "@a@b*: Willkommen in Wittenhausen!\n@c0@"
  en: "@a@b*: Welcome to Roundbeck!\n@c0@"
  es: "@a@b*: ¡Bienvenid%H0860%X%A0110%Xo%Z%B0110%Xa%Z%Y%R0000%Xas%Yos%Z%Z a Golfo Blanco!\n@c0@"
  fr: "@a@b*ⓢ Bienvenue à Blanchecombeⓠ\n@c0@"
  it: "@a@b*: Salve!\n%H0860%XTi%YVi%Z do il benvenuto a Blankenburg!\n@c0@"
  ja: "@a@b＊「ようこそ　アルカパの町に。\n@c0@"
143:
  de: "@a@b*: Ihr reist also durch die Lande? Ich bin früher selbst herumgereist, rüber nach Tifortu, und hab Waffen verkauft.\n@c0@"
  en: "@a@b*: A traveller, are you? I used to do a bit of travellin' myself in the past, goin' over Coburg way an' sellin' weapons.\n@c0@"
  es: "@a@b*: Eres %A0110%Xun viajero%Z%B0110%Xuna viajera%Z, ¿no? Yo antes también iba por ahí, iba por Trastámara a colocarles armas.\n@c0@"
  fr: "@a@b*ⓢ Vous êtes %A0110%Xun voyageur%Z%B0110%Xune voyageuse%Zⓡ\nAutrefois, moi aussi, je voyageais.\nJ'allais à Cobourg pour y vendre mes armes.\n@c0@"
  it: "@a@b*: Sei %A0110%Xun viaggiatore%Z%B0110%Xuna viaggiatrice%Z, non è vero?\nAnni fa anch'io giravo parecchio.\nMi recavo spesso a Coburg per vendere armi.\n@c0@"
  ja: "@a@b＊「あんた　旅の人だね。\n\tオレも昔は　ラインハット城まで\n\tよく武器を売りに行ったものさ。\n@c0@"
144:
  de: "@a@b*: Das Waffengeschäft läuft gut heutzutage. Aber das zeigt nur mal wieder, wie schlecht die Welt geworden ist...\n@c0@"
  en: "@a@b*: You can do a pretty good business in weapons here nowadays, mind. Just goes to show the sorry state the world's in, eh?\n@c0@"
  es: "@a@b*: Ahora mismo, aquí se puede hacer negocio con las armas. Supongo que eso indica que la cosa anda chunga.\n@c0@"
  fr: "@a@b*ⓢ Aujourd'hui, on peut faire de bonnes affaires dans les armes. Ça reflète bien le triste état dans lequel est le monde, heinⓡ\n@c0@"
  it: "@a@b*: I commercianti d'armi fanno affari d'oro in questo periodo! È un brutto segno, questo: vuol dire che il mondo intero è in subbuglio...\n@c0@"
  ja: "@a@b＊「でも　最近は　ここでも\n\t武器がよく売れてね。　これも\n\t世の中が　暗いせいだろうな。\n@c0@"
145:
  de: "@a@b*: Die Leute sagen, dass ein allmächtiger ⓞMeister der Unterweltⓟ die ganze Welt zerstören will.\n@c0@"
  en: "@a@b*: People are sayin' that some almighty ⓗmaster of the underworldⓘ is tryin' to destroy us.\n@c0@"
  es: "@a@b*: La gente dice que un ⓕamo del inframundoⓖ todopoderoso quiere darnos para el pelo.\n@c0@"
  fr: "@a@b*ⓢ Les gens disent qu'une sorte de ⓥmaître des Enfersⓦ tout-puissant essaie de nous détruire.\n@c0@"
  it: "@a@b*: Ho sentito dire che una specie di ⓕmaestro infernaleⓖ vuole ammazzarci tutti...\n@c0@"
  ja: "@a@b＊「ウワサによると\n\tとてつもない魔王が　世界を\n\tねらっているらしい。\n@c0@"
146:
  de: "@a@b*: Und dass der Orden vom Zugzwang all jene retten wird, die sich ihm anschließen.\n@c0@"
  en: "@a@b*: But that the Order of Zugzwang will come to the rescue of anyone who chooses to follow them.\n@c0@"
  es: "@a@b*: Pero que la Orden de Zugzwang rescatará a aquellos que la sigan.\n@c0@"
  fr: "@a@b*ⓢ Mais que l'Ordre du Zugzwang sauvera tous ceux qui choisiront de suivre ses préceptes.\n@c0@"
  it: "@a@b*: Gli adepti della Setta di Zugzwang, però, saranno salvati.\n@c0@"
  ja: "@a@b＊「しかし　光の教団に頼めば\n\t助けてくれるそうだ。\n@c0@"
147:
  de: "@a@b*: Ich weiß nicht. Ich verlass mich nicht gern auf andere und pass lieber auf mich selbst auf.\n@c0@"
  en: "@a@b*: I dunno, though. I think I'd rather look after myself and not go relyin' on others like that.\n@c0@"
  es: "@a@b*: No sé, ¿no? Yo casi que me cuido solo en vez de depender de otros.\n@c0@"
  fr: "@a@b*ⓢ Je suis dubitatif. Je préfère m'occuper de mon sort tout seul plutôt que de le confier à n'importe qui, comme ça.\n@c0@"
  it: "@a@b*: Messa così, sembrerebbe che valga la pena entrare a far parte di quel culto.\n㈡\n*: Io, però, preferisco contare sulle mie forze per salvarmi, e non sulle promesse di un gruppo di fanatici!\n@c0@"
  ja: "@a@b＊「まあ　オレなら　自分の身は\n\t自分で守るがね。\n@c0@"
148:
  de: "@a@b*: Der Kerl da ist zwar sehr von sich überzeugt, aber früher war er nichts weiter als ein Feigling.\n@c0@"
  en: "@a@b*: This one here may be full of it now, but he was a right coward once upon a time.\n@c0@"
  es: "@a@b*: Este de aquí irá de lo que quiera, pero en sus tiempos era un gallina de la peor especie.\n@c0@"
  fr: "@a@b*ⓢ Ce type, là, il roule des mécaniques aujourd'hui, mais il fut un temps où c'était un vrai froussard.\n@c0@"
  it: "@a@b*: Quel tipo si dà arie da duro, ma anni fa si dimostrò un vero codardo!\n@c0@"
  ja: "@a@b＊「こいつ　エラそうなことを\n\t言ってるけど\n\t昔は　弱虫だったんだぜ。\n@c0@"
149:
  de: "@a@b*: Er ist aus Tifortu weggelaufen, als es brenzlig wurde, wisst Ihr!\n@c0@"
  en: "@a@b*: He ran away from Coburg when things got a bit hairy, you know!\n@c0@"
  es: "@a@b*: ¡Escapó de Trastámara en cuanto la cosa se torció un poco!\n@c0@"
  fr: "@a@b*ⓢ Il s'est même enfui de Cobourg quand les choses ont commencé à se corser, vous savezⓠ\n@c0@"
  it: "@a@b*: Era un soldato di Coburg e, quando la situazione nel suo paese si fece difficile, non esitò a disertare.\nAh, sì! Dimostrò di avere proprio un bel fegato! Pfui!\n@c0@"
  ja: "@a@b＊「なんたって　ラインハットが\n\tあぶなくなった時　お城から\n\tにげて来ちゃったんだから。\n@c0@"
150:
  de: "@a@b*: Der Kerl in der Schänke meinte, dass es einen Enkel des legendären Helden gäbe...\n@c0@"
  en: "@a@b*: The fella in the pub said somethin' about how there's a grandchild of the legendary hero out there somewhere.\n@c0@"
  es: "@a@b*: El tipo de la taberna dijo no sé qué de que hay un nieto del héroe legendario por ahí dando vueltas.\n@c0@"
  fr: "@a@b*ⓢ Le type dans la taverne raconte que le petit-fils du héros légendaire serait là, quelque part.\n@c0@"
  it: "@a@b*: C'è un tizio nel locale che giura che un discendente dell'Eroe Leggendario è in giro per il mondo proprio in questo periodo.\n@c0@"
  ja: "@a@b＊「酒場のオヤジに聞いたのだが\n\t世界のどこかに　伝説の勇者の\n\t子孫がいるらしい。\n@c0@"
151:
  de: "@a@b*: Falls das wahr ist, würde ich den gern mal kennenlernen.\n@c0@"
  en: "@a@b*: If that's really true, it'd be great to meet them.\n@c0@"
  es: "@a@b*: Si eso es cierto, estaría genial conocerlo.\n@c0@"
  fr: "@a@b*ⓢ Si c'est vrai, ça serait génial de pouvoir\nle rencontrer.\n@c0@"
  it: "@a@b*: Se la notizia fosse vera, darei il mio braccio destro per incontrarlo!\n@c0@"
  ja: "@a@b＊「それが　本当なら\n\tぜひ　会ってみたいものだな。\n@c0@"
152:
  de: "@a@b*: Wusstet Ihr, dass der Orden vom Zugzwang auf dem Azimuthberg liegt? Sie haben dort einen großen Tempel erbaut.\n@c0@"
  en: "@a@b*: Did you know that the Order of Zugzwang are based at Mt Azimuth? They have a big temple there.\n@c0@"
  es: "@a@b*: ¿%H0860%XSabías%YSabíais%Z que la Orden de Zugzwang tiene su base en el monte Azimut? Allí hay un templo de tomo y lomo.\n@c0@"
  fr: "@a@b*ⓢ Vous saviez que l'Ordre du Zugzwang se trouvait sur le mont Azimutⓡ Ils ont un grand temple, là-bas.\n@c0@"
  it: "@a@b*: %H0860%XSapevi%YSapevate%Z che gli adepti della Setta di Zugzwang hanno la propria base sul Monte Azimuth? Pare che abbiano costruito un enorme tempio proprio lassù.\n@c0@"
  ja: "@a@b＊「あんた　知ってるかね？\n\t光の教団の神殿は\n\tセントベレス山に　あるそうだ。\n@c0@"
153:
  de: "@a@b*: Allerdings frage ich mich, wie normale Leute wie wir diesen riesigen Berg erklimmen sollen!\n@c0@"
  en: "@a@b*: What I don't get is how normal folk like us\r\nare supposed to climb up a huge mountain\r\nlike that, though!\n@c0@"
  es: "@a@b*: ¡Lo que no entiendo es cómo se las apañará la gente normal para escalar una montaña como esa!\n@c0@"
  fr: "@a@b*ⓢ Ce que je ne comprends pas, en revanche, c'est comment des gens normaux, comme nous, sont censés escalader une montagne pareilleⓠ\n@c0@"
  it: "@a@b*: Però non capisco come mai i capi dell'ordine abbiano optato per quel luogo...\n㈡\n*: Se vogliono fare proseliti, perché hanno scelto una sede tanto scomoda?!\nCome fa la gente ad arrivare fin lassù?\n@c0@"
  ja: "@a@b＊「でも　ふつうの人間に\n\tあんな山に　どうやって\n\tのぼれって　いうんだろうねえ。\n@c0@"
154:
  de: "@a@b*: Ich habe gehört, dass es eine Gruppe gibt, die das Tor zur Unterwelt bewacht.\n@c0@"
  en: "@a@b*: I've heard talk that somewhere in our world is a clan of people who guard the seal to the underworld.\n@c0@"
  es: "@a@b*: He oído que en nuestro mundo se oculta un clan que guarda el sello del inframundo.\n@c0@"
  fr: "@a@b*ⓢ Il paraît que quelque part dans le monde, il existe un clan chargé de garder la porte scellée menant aux Enfers.\n@c0@"
  it: "@a@b*: Secondo un'antica leggenda, da qualche parte nel mondo c'è un gruppo di persone che sorvegliano il varco per il Regno degli Inferi.\n@c0@"
  ja: "@a@b＊「私は聞いたことが　あります。\n\tどこかに　魔界の封印を\n\t守っている一族がいると。\n@c0@"
155:
  de: "@a@b*: Es heißt, diese Leute besäßen eine besondere Macht und könnten mit den Monstern sprechen.\n@c0@"
  en: "@a@b*: People say that those folk have some special power to communicate with the monsters.\n@c0@"
  es: "@a@b*: Se dice que esa gente tiene un poder especial para comunicarse con los monstruos.\n@c0@"
  fr: "@a@b*ⓢ Il paraît que ces gens ont des pouvoirs spéciaux leur permettant de communiquer avec les monstres.\n@c0@"
  it: "@a@b*: E pare anche che questi individui abbiano la capacità di comunicare con i mostri...\n@c0@"
  ja: "@a@b＊「その人たちは　魔物たちとも\n\t心を通じることができた　と\n\tいわれています。\n@c0@"
156:
  de: "@a@b*: Ständig hört man, dass wir in Gefahr sind und die Welt bedroht wird.\n@c0@"
  en: "@a@b*: There are lots of scary rumours flyin' about at the moment about how the world's in peril.\n@c0@"
  es: "@a@b*: Todo el mundo dice cosas muy feas sobre que el mundo está en peligro.\n@c0@"
  fr: "@a@b*ⓢ Il y a beaucoup de rumeurs inquiétantes qui circulent en ce moment. Elles racontent que le monde serait en danger.\n@c0@"
  it: "@a@b*: C'è un'atmosfera di grande incertezza per il destino dell'umanità...\nSiamo tutti in pericolo!\n@c0@"
  ja: "@a@b＊「世界が　あぶないとか\n\tいやなウワサもあるけど……。\n@c0@"
157:
  de: "@a@b*: Aber was kann ich schon dagegen tun? Ich koche einfach weiter für meinen Sohn und hoffe das Beste.\n@c0@"
  en: "@a@b*: But there's not a fat lot I can do about it. So I just keep my head down, cook nice meals for\r\nmy son, and hope for the best.\n@c0@"
  es: "@a@b*: Pero a ver, ¿qué puedo hacer yo? Agacho la cabeza, le cocino cosas ricas a mi peque y espero que todo salga bien.\n@c0@"
  fr: "@a@b*ⓢ Hélas, je ne peux pas y faire grand-chose.\nAlors je baisse la tête, je cuisine de bons repas pour mon fils, et j'espère que tout ira bien.\n@c0@"
  it: "@a@b*: Oh, spero che la dea onnipotente ci venga in aiuto!\n㈡\n*: Io so cucinare, tenere in ordine la casa e rammendare abiti, ma non saprei proprio da dove iniziare, se dovessi salvare il mondo!\n@c0@"
  ja: "@a@b＊「あたしに　できるのは\n\t息子に　おいしいゴハンを\n\t作ってやることだけさね。\n@c0@"
158:
  de: "@a@b*: Mein Mann und ich haben dieses Haus vor vielen Jahren von einem Mann namens Weißner gekauft und unsere eigene Herberge eröffnet.\n@c0@"
  en: "@a@b*: My old man and I bought this place years ago off a man called Whitaker, and we started runnin' our own inn.\n@c0@"
  es: "@a@b*: Mi viejo y yo compramos esto hace años a un tipo llamado Doptada y montamos nuestra propia posada.\n@c0@"
  fr: "@a@b*ⓢ Mon mari et moi avons acheté cet endroit il y a des années à un homme appelé Alba. Nous avons ensuite ouvert notre propre auberge.\n@c0@"
  it: "@a@b*: Io e mio marito comprammo questo posto da un tizio di nome Whitblanche, diversi anni fa.\nDa allora siamo noi a gestire la locanda.\n@c0@"
  ja: "@a@b＊「あたしら夫婦は　もう何年も前に\n\tダンカンっていう人から　ここを\n\t買いとって　宿を始めたのさ。\n@c0@"
159:
  de: "@a@b*: Bleibt doch über Nacht und nutzt unser Sonderangebot! Wer zwei oder mehr Nächte bleibt, bekommt ein Andenken.\n@c0@"
  en: "@a@b*: Why dun't you stay the night? We've got a special offer on at the moment where you get a souvenir if you stay two nights or more!\n@c0@"
  es: "@a@b*: ¿Por qué no %H0860%Xte quedas%Yos quedáis%Z a dormir aquí? Tenemos una oferta brutal: ¡si te quedas dos noches o más te llevas un recuerdo!\n@c0@"
  fr: "@a@b*ⓢ Pourquoi vous ne passez pas la nuit iciⓡ\nNous avons une offre spéciale en ce moment.\nÀ partir de 2 nuits, on vous offre un souvenir.\n@c0@"
  it: "@a@b*: %H0860%XTi%YVi%Z va di prendere una stanza?\nIn questo periodo abbiamo una promozione: offriamo un omaggio a chi passa due o più notti qui!\n@c0@"
  ja: "@a@b＊「それより　泊まっておゆきよ。\n\t今なら　２泊以上　ご利用の\n\tお客さまに　記念品をプレゼント！\n@c0@"
160:
  de: "@a@b*: Sucht mich auf jeden Fall auf, wenn Ihr zweimal hier übernachtet habt, ja?\n@c0@"
  en: "@a@b*: Make sure you come and see me after two nights stayin' here, won't you?\n@c0@"
  es: "@a@b*: %H0860%XVen%YVenid%Z a verme si %H0860%Xte quedas%Yos quedáis%Z más de una noche.\n@c0@"
  fr: "@a@b*ⓢ Revenez me voir lorsque vous aurez séjourné\n2 nuits ici. N'oubliez pasⓠ\n@c0@"
  it: "@a@b*: %H0860%XTorna%YTornate%Z a parlare con me dopo che %H0860%Xavrai%Yavrete%Z trascorso due notti da noi, d'accordo?\n@c0@"
  ja: "@a@b＊「ぜひ　２回以上お泊りになって\n\t私に声を　かけてちょうだいね。\n@c0@"
161:
  de: "@a@b*: Hm? Ihr habt bereits zweimal übernachtet? Da seid Ihr ja ein richtig guter Kunde!\n@c0@"
  en: "@a@b*: Hm? You've stayed two nights already?\nWhat a good customer you are!\n@c0@"
  es: "@a@b*: ¿Mmm? ¿%H0860%XTe has%YOs habéis%Z quedado ya dos noches?\n¡Así me gusta la clientela!\n@c0@"
  fr: "@a@b*ⓢ Mmmⓡ Vous avez déjà passé 2 nuits iciⓡ\nQuel%A0110%X bon client%Z%B0110%Xle bonne cliente%Z vous faitesⓠ\n@c0@"
  it: "@a@b*: Allora, vediamo un po'... Sì, %H0860%Xhai%Yavete%Z già passato due notti presso la nostra locanda.\nAverne, di clienti come %H0860%Xte%Yvoi%Z!\n@c0@"
  ja: "@a@b＊「え？　もう　２回以上　ご利用？\n\tまいど　ごひいきに！\n@c0@"
162:
  de: "@a@b*: Dann muss ich Euch eines unserer berühmten nach Trauben duftenden Wittenhausener Schlummerkissen schenken!\n@c0@"
  en: "@a@b*: Then I must give you one of our famous grape-scented Roundbeck Zizzwizz Pillows!\n@c0@"
