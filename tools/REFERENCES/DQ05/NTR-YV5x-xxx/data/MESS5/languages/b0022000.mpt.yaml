  fr: "@a@b*ⓢ Vous gagnez l'un des célèbres oreillers de Morphée de Blanchecombe parfumés au raisinⓠ \n@c0@"
  it: "@a@b*: %H0860%XHai%YAvete%Z diritto a un regalo!\nUn meraviglioso cuscino Buonriposo di Blankenburg, aromatizzato all'uva!\n@c0@"
  ja: "@a@b＊「それじゃ　アルカパじまんの　ぶどうの\n\t香りつき　安眠まくらを\n\tさしあげちゃうよ！\n@c0@"
163:
  de: "@a@b%0%a000120 erhält ein Schlummerkissen!\n@c0@"
  en: "@a@b%0%a000120 receives a Zizzwizz Pillow!\n@c0@"
  es: "@a@b¡%0%a000120 recibe una almohada afelpada!\n@c0@"
  fr: "@a@b%0%a000120 reçoit un oreiller de Morphéeⓠ\n@c0@"
  it: "@a@b%0%a000120 ha ricevuto un cuscino Buonriposo!\n@c0@"
  ja: "@a@b%a000120は　安眠まくらを\n受けとった！\n@c0@"
164:
  de: "@a@b%0%a000180 steckt das Schlummerkissen ein!\n@c0@"
  en: "@a@b%0%a000180 acquires a Zizzwizz Pillow!\n@c0@"
  es: "@a@b¡%0%a000180 recibe una almohada afelpada!\n@c0@"
  fr: "@a@b%0%a000180 récupère l'oreiller de Morphéeⓠ\n@c0@"
  it: "@a@b%0%a000180 prende il cuscino Buonriposo!\n@c0@"
  ja: "@a@b%a000180は　安眠まくらを\n手に入れた！\n@c0@"
165:
  de: "@a@b*: Oje, das Geschäft läuft gar nicht gut, und ich weiß nicht, wie wir unsere Gaben für den Orden vom Zugzwang bezahlen sollen.\n@c0@"
  en: "@a@b*: Oh dear. With business this bad, I dun't know how we're goin' to afford to pay our remittances to the Order of Zugzwang.\n@c0@"
  es: "@a@b*: ¡Oh, vaya! Con el negocio tan parado no sé cómo vamos a pagar los donativos a la Orden de Zugzwang.\n@c0@"
  fr: "@a@b*ⓢ Oh là là. Avec une affaire qui tourne aussi mal,\nje ne sais pas comment nous allons pouvoir faire\nnos versements à l'Ordre du Zugzwang.\n@c0@"
  it: "@a@b*: Gli affari non stanno andando bene, e non possiamo permetterci di fare donazioni alla Setta di Zugzwang. Spero che la cosa non ci creerà problemi.\n@c0@"
  ja: "@a@b＊「まったく　こんな収入じゃ\n\t光の教団への　送金なんて\n\tできやしないわ。　ブツブツ……。\n@c0@"
166:
  de: "@a@b*: Ooh! Hallo, junger Mann!\nEtwas zu trinken gefällig?\n@c0@"
  en: "@a@b*: Ooh! Hello there, young man!\nWould you like a drink?\n@c0@"
  es: "@a@b*: ¡Oh! ¡Hola, tío!\n¿Quieres un trago?\n@c0@"
  fr: "@a@b*ⓢ Houhouⓠ Bien le bonjour, jeune hommeⓠ\nVous prenez un verreⓡ\n@c0@"
  it: "@a@b*: Salve, %H0860%X%A0110%Xamico%Z%B0110%Xamica mia%Z%Ygente%Z!\n%H0860%XTi%YVi%Z andrebbe di ordinare qualcosa?\n@c0@"
  ja: "@a@b＊「あら　ステキな　お客さん！\n\tなにか飲む？\n@c0@"
167:
  de: "@a@b*: Bitte sehr. Guten Durst!\n@c0@"
  en: "@a@b*: Here you are. Enjoy!\n@c0@"
  es: "@a@b*: Aquí va.\n¡Salud!\n@c0@"
  fr: "@a@b*ⓢ Et voilàⓠ\nÀ la vôtreⓠ\n@c0@"
  it: "@a@b*: Ecco qua!\nSpero che %H0860%Xti%Yvi%Z piaccia.\n@c0@"
  ja: "@a@b＊「はい　どうぞ。\n\tゆっくりして行ってね。\n@c0@"
168:
  de: "@a@b*: Kann ich sonst etwas für Euch tun?\nAh, der legendäre Held? Momentchen!\n@c0@"
  en: "@a@b*: Then what can I do for you?\nThe legendary hero, eh? Just a sec!\n@c0@"
  es: "@a@b*: ¿Entonces qué puedo hacer por ti?\nEl héroe legendario, ¿eh? ¡Un momento!\n@c0@"
  fr: "@a@b*ⓢ Qu'est-ce que je peux faire pour vous, alorsⓡ\nLe héros légendaireⓡ Ah, je vois.\n@c0@"
  it: "@a@b*: Allora cosa posso fare per %H0860%Xte%Yvoi%Z?\nChe cosa? L'Eroe Leggendario...?\nUhm...\n@c0@"
  ja: "@a@b＊「じゃあ　どんなご用かしら？\n\tふ～ん　伝説の勇者の話……。\n\tちょっと待ってね。\n@c0@"
169:
  de: "@a@b*: Darüber weiß mein Vater bestens Bescheid. Am besten fragt Ihr ihn selbst.\n@c0@"
  en: "@a@b*: It's my dad who knows all about that.\nWhy don't you go on in and pick his brains?\n@c0@"
  es: "@a@b*: De eso sabe mogollón mi viejo.\n¿Por qué no vas a darle la brasa a él?\n@c0@"
  fr: "@a@b*ⓢ C'est à mon père qu'il faut demander.\nEssayez donc de lui tirer les vers du nez.\n@c0@"
  it: "@a@b*: Io non ne so nulla, ma magari mio padre potrebbe %H0860%Xaiutarti. Dovresti%Yaiutarvi. Dovreste%Z andare a parlare con lui...\n@c0@"
  ja: "@a@b＊「勇者の話なら　お父さんが\n\tくわしいと思うわ。\n\t奥にいるから聞いてみたら？\n@c0@"
170:
  de: "@a@b*: Mein Vater weiß Bescheid über den legendären Helden. Fragt ihn ruhig nach Herzenslust aus.\n@c0@"
  en: "@a@b*: My dad knows a thing or two about the legendary hero. Ask him as much as you like.\n@c0@"
  es: "@a@b*: Mi viejo sabe un par de cosillas sobre el héroe legendario, ¿que no? Fríelo a preguntas cuanto quieras.\n@c0@"
  fr: "@a@b*ⓢ Mon père sait quelques petites choses sur le héros légendaire. N'hésitez pas à lui poser toutes vos questions.\n@c0@"
  it: "@a@b*: Può darsi che mio padre sappia qualcosa di quest'Eroe Leggendario.\n%H0860%XTi%YVi%Z consiglio di chiedere a lui.\n@c0@"
  ja: "@a@b＊「勇者の話なら　お父さんが\n\tくわしいと思うわ。\n\tどうぞ　ゆっくりしていってね。\n@c0@"
171:
  de: "@a@b*: Ihr wollt also etwas über den legendären Helden wissen? Dann seid Ihr bei mir genau richtig!\n@c0@"
  en: "@a@b*: You want to know about the legendary hero, do you? Then you've come to the right place!\n@c0@"
  es: "@a@b*: %H0860%XQuieres%YQueréis%Z saber del héroe legendario, ¿eh? ¡Pues este sitio es que ni pintado!\n@c0@"
  fr: "@a@b*ⓢ Vous voulez en savoir plus sur le héros légendaire, c'est çaⓡ Alors, vous avez frappé à la bonne porteⓠ\n@c0@"
  it: "@a@b*: %H0860%XVuoi%YVolete%Z avere informazioni sull'Eroe Leggendario, non è così? %H0860%XHai%YAvete%Z chiesto alla persona giusta!\n@c0@"
  ja: "@a@b＊「なに？　伝説の勇者について\n\t話を聞きたいだと！？\n\tよし！　話してやろう。\n@c0@"
172:
  de: "@a@b*: Vor langer Zeit erstand der Fürst der Unterwelt, Es... Dingsbums, wieder auf und machte sich daran, die Welt zu vernichten.\n@c0@"
  en: "@a@b*: Long, long ago, the Lord of the Underworld, Es...something or other, was resurrected, and set about destroying the world.\n@c0@"
  es: "@a@b*: Hace la tira, el Señor del Inframundo, Es..., como se llamara, va y resucita, y se pone a cargárselo todo.\n@c0@"
  fr: "@a@b*ⓢ Il y a très très longtemps, le Seigneur des Enfers, Es... euh... Es-quelque-chose, fut ressuscité et entreprit de détruire notre monde.\n@c0@"
  it: "@a@b*: Tanto tempo fa, il perfido Signore degli Inferi progettò di distruggere il mondo. Si chiamava Es...\nUhm... No, il nome preciso non lo ricordo.\n@c0@"
  ja: "@a@b＊「だいぶ昔の話だが……　闇の帝王\n\tエスなんたらが復活し　世界を\n\tほろぼそうとしたことがあったんだ。\n@c0@"
173:
  de: "@a@b*: Aber dann hat der legendäre Held ihn mithilfe der Zenithia-Ausrüstung besiegt und uns alle gerettet.\n@c0@"
  en: "@a@b*: But then the legendary hero, with the Zenithian Equipment on his side, defeated him and saved us all.\n@c0@"
  es: "@a@b*: Pero entonces llega el héroe legendario con el Equipo de Zenithia, se lo carga y nos salva a todos.\n@c0@"
  fr: "@a@b*ⓢ Mais le héros légendaire, doté de l'Équipement zénithien, le vainquit et nous sauva tous.\n@c0@"
  it: "@a@b*: Il piano, però, fu sventato dall'Eroe Leggendario che, indossato l'Equipaggiamento Zenithiano, sconfisse il Signore degli Inferi e salvò l'umanità.\n@c0@"
  ja: "@a@b＊「しかし　天空の武器防具を身につけた\n\t勇者がな　そのエスなんたらをたおし\n\t世界を救ったっちゅうことだ。\n@c0@"
174:
  de: "@a@b*: Er hatte vier Ausrüstungsstücke: das Zenithiaschwert, die Zenithiarüstung, den Zenithiaschild und den Zenithiahelm.\n@c0@"
  en: "@a@b*: He had four items altogether: the Zenithian Sword, the Zenithian Armour, the Zenithian Shield and the Zenithian Helm.\n@c0@"
  es: "@a@b*: Tenía cuatro chismes: la Espada, la Armadura, el Escudo y el Yelmo de Zenithia.\n@c0@"
  fr: "@a@b*ⓢ Il avait 4 objets avec luiⓢ l'Épée zénithienne, l'Armure zénithienne, le Bouclier zénithien et le Casque zénithien.\n@c0@"
  it: "@a@b*: L'Eroe Leggendario era equipaggiato con la Spada Zenithiana, l'Armatura Zenithiana, lo Scudo Zenithiano e l'Elmo Zenithiano.\n@c0@"
  ja: "@a@b＊「ちなみに　勇者の武器防具とは\n\t天空の剣　天空のよろい　天空の盾\n\t天空のかぶと　の４つだったそうだ。\n@c0@"
175:
  de: "@a@b*: Wie? Was danach aus ihm wurde?\n@c0@"
  en: "@a@b*: Hm? What happened to him after that?\n@c0@"
  es: "@a@b*: ¿Mmm? ¿Que qué le pasó después?\n@c0@"
  fr: "@a@b*ⓢ Mmmⓡ Ce qu'il est devenu ensuiteⓡ\n@c0@"
  it: "@a@b*: Come %H0860%Xdici? Mi chiedi%Ydite? Mi chiedete%Z dove sia finito l'Eroe Leggendario dopo aver compiuto quell'impresa?\n@c0@"
  ja: "@a@b＊「え？　そのあとの勇者かい？\n@c0@"
176:
  de: "@a@b*: Manche sagen, er sei nach Zenithia oben im Himmel zurückgekehrt, aber ich weiß nicht, ob das stimmt.\n@c0@"
  en: "@a@b*: Some say he returned to Zenithia up in the sky, but I don't know if that's what really happened or not.\n@c0@"
  es: "@a@b*: Unos dicen que volvió a Zenithia, en el cielo, pero yo qué sé. A saber.\n@c0@"
  fr: "@a@b*ⓢ Certains disent qu'il est reparti à Zénithia, dans les cieux, mais je ne sais pas si c'est effectivement ce qui s'est passé.\n@c0@"
  it: "@a@b*: Qualcuno sostiene che sia tornato su in cielo, a Zenithia.\nIo, però, non ne sarei tanto convinto...\n@c0@"
  ja: "@a@b＊「う～ん　一説には\n\t天空にもどったとも　言われてるけど\n\tそこまでは知らんなあ。\n@c0@"
177:
  de: "@a@b*: Das war alles vor langer Zeit, darum glaube ich nicht, dass er noch lebt.\n@c0@"
  en: "@a@b*: It was all a long time ago, anyway, so I very much doubt he'd still be alive now.\n@c0@"
  es: "@a@b*: Fue hace mogollón de años, así que lo más seguro es que haya palmado.\n@c0@"
  fr: "@a@b*ⓢ Mais ça remonte à très longtemps, maintenant.\nÇa m'étonnerait qu'il soit encore en vie.\n@c0@"
  it: "@a@b*: A essere sincero, potrebbe anche essere morto!\nDopotutto, gli avvenimenti di cui %H0860%Xti%Yvi%Z ho parlato risalgono a moltissimi anni fa.\n@c0@"
  ja: "@a@b＊「まあ　大昔のことだし\n\tどっちにしても　もう生きては\n\tいないと思うぞ。\n@c0@"
178:
  de: "@a@b*: Einen seiner Nachkommen werdet Ihr aber wohl noch irgendwo auftreiben können, wenn Ihr Glück habt.\n@c0@"
  en: "@a@b*: I s'pose you might be able to find one of his descendants somewhere if you were lucky.\n@c0@"
  es: "@a@b*: Si %H0860%Xtienes%Ytenéis%Z suerte, igual %H0860%Xencuentras%Yencontráis%Z a alguno de sus descendientes.\n@c0@"
  fr: "@a@b*ⓢ Si vous avez de la chance, vous pourrez\npeut-être tomber sur l'un de ses descendants.\n@c0@"
  it: "@a@b*: Non escludo, però, che abbia lasciato dei discendenti, da qualche parte.\n㈡\n%H0860%XPotresti%YPotreste%Z provare a cercarli.\nSe esistessero davvero, sarebbero certamente in grado di %H0860%Xdarti%Ydarvi%Z qualche informazione in più...\n@c0@"
  ja: "@a@b＊「勇者の子孫くらいなら\n\tどこかにいるかも知れんがな。\n@c0@"
179:
  de: "@a@b*: Ein Reisender seid Ihr also? In meiner Jugend bin ich selbst viel gereist, wisst Ihr. Vor allem nach Tifortu, um dort Waffen zu verkaufen.\n@c0@"
  en: "@a@b*: A traveller, are you? I used to do a bit of travellin' myself in the past, over to Coburg\r\nsellin' weapons.\n@c0@"
  es: "@a@b*: Eres %A0110%Xun viajero%Z%B0110%Xuna viajera%Z, ¿no? Yo antes también viajaba, iba hasta Trastámara a vender armas.\n@c0@"
  fr: "@a@b*ⓢ Vous êtes %A0110%Xun voyageur%Z%B0110%Xune voyageuse%Z, vous ditesⓡ Moi aussi, j'ai voyagé un peu autrefois. Jusqu'à Cobourg, pour vendre des armes.\n@c0@"
  it: "@a@b*: Sei %A0110%Xun viandante%Z%B0110%Xuna viandante%Z, vero? In passato anch'io ho girato il mondo per vendere e comprare armi, e Coburg era una delle mie mete preferite.\n@c0@"
  ja: "@a@b＊「あんた　旅の人だね。\n\tオレも昔は　ラインハットまで\n\tよく武器を売りに行ったものさ。\n@c0@"
180:
  de: "@a@b*: Das Waffengeschäft läuft gut heutzutage. Aber das zeigt nur mal wieder, wie schlecht die Welt geworden ist...\n@c0@"
  en: "@a@b*: You can do a pretty good business in weapons here nowadays, mind. Just goes to show the sorry state the world's in, eh?\n@c0@"
  es: "@a@b*: Ahora mismo, aquí se puede hacer negocio con las armas. Supongo que eso indica que la cosa anda chunga.\n@c0@"
  fr: "@a@b*ⓢ Aujourd'hui, on peut faire de bonnes affaires dans les armes. Ça reflète bien le triste état dans lequel est le monde, heinⓡ\n@c0@"
  it: "@a@b*: I commercianti d'armi fanno affari d'oro in questo periodo! È un brutto segno, questo: vuol dire che il mondo intero è in subbuglio...\n@c0@"
  ja: "@a@b＊「でも　最近は　ここでも\n\t武器がよく売れてね。　これも\n\t世の中が　暗いせいだろうな。\n@c0@"
181:
  de: "@a@b*: Ich hatte ihn immer noch als meinen kleinen Jungen vor Augen, aber er ist auf einmal so groß geworden!\n@c0@"
  en: "@a@b*: I was still thinkin' of him as my little boy, but he's suddenly got so big!\n@c0@"
  es: "@a@b*: Y pensar que era un renacuajo, ¡y mira qué cacho carne!\n@c0@"
  fr: "@a@b*ⓢ Je le voyais toujours comme mon petit garçon et, tout à coup, il était plus grand que moiⓠ\n@c0@"
  it: "@a@b*: L'ho sempre considerato il mio bambino, e quasi non mi sono accorta di quanto sia cresciuto.\nOrmai è un adulto...\n@c0@"
  ja: "@a@b＊「つい　この間まで　子供だと\n\t思っていたのに　いつの間にか\n\tこんなに大きくなって……。\n@c0@"
182:
  de: "@a@b*: Aber für mich wird er immer mein kleiner Junge bleiben!\n@c0@"
  en: "@a@b*: Still, he'll always be my baby!\n@c0@"
  es: "@a@b*: ¡Pero siempre será mi bebín!\n@c0@"
  fr: "@a@b*ⓢ Enfin, ce sera toujours mon bébéⓠ\n@c0@"
  it: "@a@b*: Ma per me lui sarà sempre il mio bambino!\n@c0@"
  ja: "@a@b＊「でも　あたしにとっちゃ\n\t子供は　いつまでたっても\n\t子供だねえ。\n@c0@"
183:
  de: "@a@b*: Chrrr! Chrrr!\n@c0@"
  en: "@a@b*: Goo! Goo!\n@c0@"
  es: "@a@b*: ¡Glub! ¡Glub!\n@c0@"
  fr: "@a@b*ⓢ Ron-pfff...\n@c0@"
  it: "@a@b*: Ronf...\nZzz...\n@c0@"
  ja: "@a@b＊「ぐがーぐがー。\n@c0@"
184:
  de: "@a@b*: Ha-püh... Ha-püh...\n@c0@"
  en: "@a@b*: Ah-phew, ah-phew...\n@c0@"
  es: "@a@b*: Ah, fiuuu, ah, fiuuu...\n@c0@"
  fr: "@a@b*ⓢ Ron-pfff... Ron-pfff...\n@c0@"
  it: "@a@b*: Ronf! Ronf! Argh! Anf...\n@c0@"
  ja: "@a@b＊「ぐうぐう……。\n@c0@"
185:
  de: "@a@b*: Ha-püh...\n@c0@"
  en: "@a@b*: Ah-phew...\n@c0@"
  es: "@a@b*: Ah-fiuu...\n@c0@"
  fr: "@a@b*ⓢ Ron-pfff...\n@c0@"
  it: "@a@b*: Rooonf...\n@c0@"
  ja: "@a@b＊「すやすや……。\n@c0@"
186:
  de: "@a@b*: Wusstet Ihr, dass der Orden vom Zugzwang auf dem Azimuthberg liegt? Sie haben dort einen großen Tempel erbaut.\n@c0@"
  en: "@a@b*: Did you know that the Order of Zugzwang are based at Mt Azimuth? They have a big temple there.\n@c0@"
  es: "@a@b*: ¿%H0860%XSabías%YSabíais%Z que la Orden de Zugzwang tiene su base en el monte Azimut? Allí hay un templo de tomo y lomo.\n@c0@"
  fr: "@a@b*ⓢ Vous saviez que l'Ordre du Zugzwang se trouvait sur le mont Azimutⓡ Ils ont un grand temple, là-bas.\n@c0@"
  it: "@a@b*: %H0860%XSapevi%YSapevate%Z che gli adepti della Setta di Zugzwang hanno la propria base sul Monte Azimuth? Pare che abbiano costruito un enorme tempio proprio lassù.\n@c0@"
  ja: "@a@b＊「あんた　知ってるかね？\n\t光の教団の神殿は\n\tセントベレス山に　あるそうだ。\n@c0@"
187:
  de: "@a@b*: Allerdings frage ich mich, wie normale Leute wie wir diesen riesigen Berg erklimmen sollen!\n@c0@"
  en: "@a@b*: What I don't get is how normal folk like us\r\nare supposed to climb up a huge mountain\r\nlike that, though!\n@c0@"
  es: "@a@b*: ¡Lo que no entiendo es cómo se las apañará la gente normal para escalar una montaña como esa!\n@c0@"
  fr: "@a@b*ⓢ Ce que je ne comprends pas, en revanche, c'est comment des gens normaux, comme nous, sont censés escalader une montagne pareilleⓠ\n@c0@"
  it: "@a@b*: Però non capisco come mai i capi dell'ordine abbiano optato per quel luogo...\n㈡\n*: Se vogliono fare proseliti, perché hanno scelto una sede tanto scomoda?!\nCome fa la gente ad arrivare fin lassù?\n@c0@"
  ja: "@a@b＊「でも　ふつうの人間に\n\tあんな山に　どうやって\n\tのぼれって　いうんだろうねえ。\n@c0@"
188:
  de: "@aBianca@bOh! Tut mir leid, %a000090! Habe ich dich geweckt?\n@c0@"
  en: "@aBianca@bOh! Sorry, %a000090. Did I wake you?\n@c0@"
  es: "@aBianca@b¡Ah!, lo siento, %a000090. ¿Te he despertado?\n@c0@"
  fr: "@aBianca@bOhⓠ Désolée, %a000090. Je t'ai réveilléⓡ\n@c0@"
  it: "@aBianca@bScusami, %a000090. Ti ho svegliato?\n@c0@"
  ja: "@a@bビアンカ「あら　%a000090。\n\tごめんね　起こしちゃった？\n@c0@"
189:
  de: "@aBianca@bEs ist nur ⓚⓛ ich habe in letzter Zeit viel über die Vergangenheit nachgedacht.\n@c0@"
  en: "@aBianca@bIt's just, I've bin thinkin' a lot\r\nabout things in the past.\n@c0@"
  es: "@aBianca@bEs que estaba pensando en el pasado, ¿sabes?\n@c0@"
  fr: "@aBianca@bC'est juste que j'ai beaucoup réfléchi sur tout ce qui s'est passé autrefois.\n@c0@"
  it: "@aBianca@bStavo pensando al passato...\n@c0@"
  ja: "@a@bビアンカ「ちょっとね\n\tいろいろ　昔のことを\n\t思い出しちゃって……。\n@c0@"
190:
  de: "@aBianca@bNicht, dass ich traurig wäre oder so. Das ist jetzt alles vorbei und vorüber, das weiß ich.\n@c0@"
  en: "@aBianca@bIt's not that I'm feelin' sad or nothin'. That's all done and dusted now, I know that.\n@c0@"
  es: "@aBianca@bNo, triste no estoy ni nada. Ya sé que son cosas que pasan.\n@c0@"
  fr: "@aBianca@bJe ne suis pas triste ni mélancolique.\r\nC'est du passé, je le sais.\n@c0@"
  it: "@aBianca@bNon che io mi senta triste o che abbia dei rimpianti, anzi... Insomma, il passato è passato.\n@c0@"
  ja: "@a@bビアンカ「ううん　別に\n\t悲しいわけじゃないのよ。\n\t昔は昔　今は今だもの。\n@c0@"
191:
  de: "@aBianca@bÄhm, kann ich zu dir rüberkommen, %a000090?\n@c0@"
  en: "@aBianca@bUm, can I come over to you, %a000090?\n@c0@"
  es: "@aBianca@bEsto, ¿puedo acercarme a ti, %a000090?\n@c0@"
  fr: "@aBianca@bMmm, est-ce que je peux venir auprès de toi, %a000090ⓡ\n@c0@"
  it: "@aBianca@b%0%a000090, posso avvicinarmi?\n@c0@"
  ja: "@a@bビアンカ「ねえ　%a000090……。\n\tそっちに　行ってもいい？\n@c0@"
192:
  de: "@aBianca@bIch möchte, dass du eins weißt... ich liebe dich.\n@c0@"
  en: "@aBianca@bI want you to know...\nI love you.\n@c0@"
  es: "@aBianca@bQuiero que sepas que...\r\nTe quiero.\n@c0@"
  fr: "@aBianca@bJe voulais simplement te dire que... je t'aime.\n@c0@"
  it: "@aBianca@bIo voglio che tu sappia che... Ti amo, %a000090.\n@c0@"
  ja: "@a@bビアンカ「愛してるわ　%a000090。\n@c0@"
193:
  de: "@aBianca@bSei doch nicht so! Ich komme trotzdem rüber.\n@c0@"
  en: "@aBianca@bDon't be mean! I'm comin' anyway.\n@c0@"
  es: "@aBianca@b¡No seas malo! Voy a ir de todas formas.\n@c0@"
  fr: "@aBianca@bPas la peine d'être méchantⓠ Je viens de toute façon.\n@c0@"
  it: "@aBianca@bOh, ma quanto sei antipatico! Beh, io mi avvicino lo stesso!\n@c0@"
  ja: "@a@bビアンカ「いじわる。\n\tでも　行っちゃおうっと。\n@c0@"
194:
  de: "@a@b*: Ooh! Hallo, junger Mann!\nEtwas zu trinken gefällig?\n@c0@"
  en: "@a@b*: Ooh! Hello there, young man!\nWould you like a drink?\n@c0@"
  es: "@a@b*: ¡Oh! ¡Hola, tío!\n¿Quieres un trago?\n@c0@"
  fr: "@a@b*ⓢ Houhouⓠ Bien le bonjour, jeune hommeⓠ\nVous prenez un verreⓡ\n@c0@"
  it: "@a@b*: Salve, %H0860%X%A0110%Xamico%Z%B0110%Xamica mia%Z%Ygente%Z!\n%H0860%XTi%YVi%Z andrebbe di ordinare qualcosa?\n@c0@"
  ja: "@a@b＊「あら　ステキな　お客さん！\n\tなにか飲む？\n@c0@"
195:
  de: "@a@b*: Bitte sehr. Guten Durst!\n@c0@"
  en: "@a@b*: Here you are. Enjoy!\n@c0@"
  es: "@a@b*: Aquí va.\n¡Salud!\n@c0@"
  fr: "@a@b*ⓢ Et voilàⓠ\nÀ la vôtreⓠ\n@c0@"
  it: "@a@b*: Ecco qua!\nSpero che %H0860%Xti%Yvi%Z piaccia.\n@c0@"
  ja: "@a@b＊「はい　どうぞ。\n\tゆっくりして行ってね。\n@c0@"
196:
  de: "@a@b*: Kann ich sonst etwas für Euch tun?\nAh, der legendäre Held? Momentchen!\n@c0@"
  en: "@a@b*: Then what can I do for you?\nThe legendary hero, eh? Just a sec!\n@c0@"
  es: "@a@b*: ¿Entonces qué puedo hacer por ti?\nEl héroe legendario, ¿eh? ¡Un momento!\n@c0@"
  fr: "@a@b*ⓢ Qu'est-ce que je peux faire pour vous, alorsⓡ\nLe héros légendaireⓡ Ah, je vois.\n@c0@"
  it: "@a@b*: Allora cosa posso fare per %H0860%Xte%Yvoi%Z?\nChe cosa? L'Eroe Leggendario...?\nUhm...\n@c0@"
  ja: "@a@b＊「じゃあ　どんなご用かしら？\n\tふ～ん　伝説の勇者の話……。\n\tちょっと待ってね。\n@c0@"
197:
  de: "@a@b*: Darüber weiß mein Vater bestens Bescheid. Am besten fragt Ihr ihn selbst.\n@c0@"
  en: "@a@b*: It's my dad who knows all about that.\nWhy don't you go on in and pick his brains?\n@c0@"
  es: "@a@b*: De eso sabe mogollón mi viejo.\n¿Por qué no vas a darle la brasa a él?\n@c0@"
  fr: "@a@b*ⓢ C'est à mon père qu'il faut demander.\nEssayez donc de lui tirer les vers du nez.\n@c0@"
  it: "@a@b*: Io non ne so nulla, ma magari mio padre potrebbe %H0860%Xaiutarti. Dovresti%Yaiutarvi. Dovreste%Z andare a parlare con lui...\n@c0@"
  ja: "@a@b＊「勇者の話なら　お父さんが\n\tくわしいと思うわ。\n\t奥にいるから聞いてみたら？\n@c0@"
198:
  de: "@a@b*: Mein Vater weiß Bescheid über den legendären Helden. Fragt ihn ruhig nach Herzenslust aus.\n@c0@"
  en: "@a@b*: My dad knows a thing or two about the legendary hero. Ask him as much as you like.\n@c0@"
  es: "@a@b*: Mi viejo sabe un par de cosillas sobre el héroe legendario, ¿que no? Fríelo a preguntas cuanto quieras.\n@c0@"
  fr: "@a@b*ⓢ Mon père sait quelques petites choses sur le héros légendaire. N'hésitez pas à lui poser toutes vos questions.\n@c0@"
  it: "@a@b*: Può darsi che mio padre sappia qualcosa di quest'Eroe Leggendario.\n%H0860%XTi%YVi%Z consiglio di chiedere a lui.\n@c0@"
  ja: "@a@b＊「勇者の話なら　お父さんが\n\tくわしいと思うわ。\n\tどうぞ　ゆっくりしていってね。\n@c0@"
199:
  de: "@a@b*: Ihr wollt also etwas über den legendären Helden wissen? Dann seid Ihr bei mir genau richtig!\n@c0@"
  en: "@a@b*: You want to know about the legendary hero, do you? Then you've come to the right place!\n@c0@"
  es: "@a@b*: %H0860%XQuieres%YQueréis%Z saber del héroe legendario, ¿eh? ¡Pues este sitio es que ni pintado!\n@c0@"
  fr: "@a@b*ⓢ Vous voulez en savoir plus sur le héros légendaire, c'est çaⓡ Alors, vous avez frappé à la bonne porteⓠ\n@c0@"
  it: "@a@b*: %H0860%XVuoi%YVolete%Z avere informazioni sull'Eroe Leggendario, non è così? %H0860%XHai%YAvete%Z chiesto alla persona giusta!\n@c0@"
  ja: "@a@b＊「なに？　伝説の勇者について\n\t話を聞きたいだと！？\n\tよし！　話してやろう。\n@c0@"
200:
  de: "@a@b*: Vor langer Zeit erstand der Fürst der Unterwelt, Es... Dingsbums, wieder auf und machte sich daran, die Welt zu vernichten.\n@c0@"
  en: "@a@b*: Long, long ago, the Lord of the Underworld, Es...something or other, was resurrected, and set about destroying the world.\n@c0@"
  es: "@a@b*: Hace la tira, el Señor del Inframundo, Es..., como se llamara, va y resucita, y se pone a cargárselo todo.\n@c0@"
  fr: "@a@b*ⓢ Il y a très très longtemps, le Seigneur des Enfers, Es... euh... Es-quelque-chose, fut ressuscité et entreprit de détruire notre monde.\n@c0@"
  it: "@a@b*: Tanto tempo fa, il perfido Signore degli Inferi progettò di distruggere il mondo. Si chiamava Es...\nUhm... No, il nome preciso non lo ricordo.\n@c0@"
  ja: "@a@b＊「だいぶ昔の話だが……　闇の帝王\n\tエスなんたらが復活し　世界を\n\tほろぼそうとしたことがあったんだ。\n@c0@"
201:
  de: "@a@b*: Aber dann hat der legendäre Held ihn mithilfe der Zenithia-Ausrüstung besiegt und uns alle gerettet.\n@c0@"
  en: "@a@b*: But then the legendary hero, with the Zenithian Equipment on his side, defeated him and saved us all.\n@c0@"
  es: "@a@b*: Pero entonces llega el héroe legendario con el Equipo de Zenithia, se lo carga y nos salva a todos.\n@c0@"
  fr: "@a@b*ⓢ Mais le héros légendaire, doté de l'Équipement zénithien, le vainquit et nous sauva tous.\n@c0@"
  it: "@a@b*: Il piano, però, fu sventato dall'Eroe Leggendario che, indossato l'Equipaggiamento Zenithiano, sconfisse il Signore degli Inferi e salvò l'umanità.\n@c0@"
  ja: "@a@b＊「しかし　天空の武器防具を　身につけた\n\t勇者がな　そのエスなんたらをたおし\n\t世界を救ったちゅうことだ。\n@c0@"
202:
  de: "@a@b*: Wie? Was danach aus ihm wurde?\n@c0@"
  en: "@a@b*: Hm? What happened to him after that?\n@c0@"
  es: "@a@b*: ¿Mmm? ¿Que qué le pasó después?\n@c0@"
  fr: "@a@b*ⓢ Mmmⓡ Ce qu'il est devenu ensuiteⓡ\n@c0@"
  it: "@a@b*: Come %H0860%Xdici? Mi chiedi%Ydite? Mi chiedete%Z dove sia finito l'Eroe Leggendario dopo aver compiuto quell'impresa?\n@c0@"
  ja: "@a@b＊「え？　そのあとの勇者かい？\n@c0@"
203:
  de: "@a@b*: Manche sagen, er sei nach Zenithia oben im Himmel zurückgekehrt, aber ich weiß nicht, ob das stimmt.\n@c0@"
  en: "@a@b*: Some say he returned to Zenithia up in the sky, but I don't know if that's what really happened or not.\n@c0@"
  es: "@a@b*: Unos dicen que volvió a Zenithia, en el cielo, pero yo qué sé. A saber.\n@c0@"
  fr: "@a@b*ⓢ Certains disent qu'il est reparti à Zénithia, dans les cieux, mais je ne sais pas si c'est effectivement ce qui s'est passé.\n@c0@"
  it: "@a@b*: Qualcuno sostiene che sia tornato su in cielo, a Zenithia.\nIo, però, non ne sarei tanto convinto...\n@c0@"
  ja: "@a@b＊「う～ん　一説には\n\t天空にもどったとも　言われてるけど\n\tそこまでは知らんなあ。\n@c0@"
204:
  de: "@a@b*: Das war alles vor langer Zeit, darum glaube ich nicht, dass er noch lebt.\n@c0@"
  en: "@a@b*: It was all a long time ago, anyway, so I very much doubt he'd still be alive now.\n@c0@"
  es: "@a@b*: Fue hace mogollón de años, así que lo más seguro es que haya palmado.\n@c0@"
  fr: "@a@b*ⓢ Mais ça remonte à très longtemps, maintenant.\nÇa m'étonnerait qu'il soit encore en vie.\n@c0@"
  it: "@a@b*: A essere sincero, potrebbe anche essere morto!\nDopotutto, gli avvenimenti di cui %H0860%Xti%Yvi%Z ho parlato risalgono a moltissimi anni fa.\n@c0@"
  ja: "@a@b＊「まあ　大昔のことだし\n\tどっちにしても　もう生きては\n\tいないと思うぞ。\n@c0@"
205:
  de: "@a@b*: Einen seiner Nachkommen werdet Ihr aber wohl noch irgendwo auftreiben können, wenn Ihr Glück habt.\n@c0@"
  en: "@a@b*: I s'pose you might be able to find one of his descendants somewhere if you were lucky.\n@c0@"
  es: "@a@b*: Si %H0860%Xtienes%Ytenéis%Z suerte, igual %H0860%Xencuentras%Yencontráis%Z a alguno de sus descendientes.\n@c0@"
  fr: "@a@b*ⓢ Si vous avez de la chance, vous pourrez\npeut-être tomber sur l'un de ses descendants.\n@c0@"
  it: "@a@b*: Non escludo, però, che abbia lasciato dei discendenti, da qualche parte.\n㈡\n%H0860%XPotresti%YPotreste%Z provare a cercarli.\nSe esistessero davvero, sarebbero certamente in grado di %H0860%Xdarti%Ydarvi%Z qualche informazione in più...\n@c0@"
  ja: "@a@b＊「勇者の子孫くらいなら\n\tどこかにいるかも知れんがな。\n@c0@"
206:
  de: "@a@b*: Aaah! Es geht doch nichts über ein Gläschen!\nNa ja, ein Gläschen in der einen Hand und 'nen Beutel voller Gold in der anderen wär noch besser...\n@c0@"
  en: "@a@b*: Aaah! You can't beat a good drink! Well, a good drink in one hand and a big bag of gold in the other would be ideal, but...\n@c0@"
  es: "@a@b*: ¡Aaah! ¡No hay nada como un buen trago! Vale, un buen trago en una mano y una maciza a mi lado sería ideal, pero...\n@c0@"
  fr: "@a@b*ⓢ Aaahⓠ Rien de tel qu'un bon verreⓠ Enfin, un bon verre dans une main et un gros sac d'or dans l'autre, ça serait idéal, mais bon...\n@c0@"
  it: "@a@b*: Aaah! Non c'è niente di meglio di una buona bevanda fresca...\n㈡\n*: Anzi, mi correggo: non c'è niente di meglio di una buona bevanda fresca servita da una graziosa cameriera! Eh eh eh!\n@c0@"
  ja: "@a@b＊「ふー　酒がうまい！\n\t若い女の子がいれば\n\tもっと　うまいのだが……。\n@c0@"
207:
  de: "@aGräfin Krypto@bUuuuuuhhh! Es ist schon viele Jahre her, seit wir Besuuucher hatten.\n@c0@"
  en: "@aMiss Count @bOoooooh! It has been many years now since ve are havink ze visitors.\n@c0@"
  es: "@aCondesa@b¡Ooooh! Pasado muuucho tiempo ha desde que visitantes vinieran.\n@c0@"
  fr: "@aComtesse Karpatt@bOooooohⓠ Cela faisait bien looongtemps que nooous n'avions pas eu de visite.\n@c0@"
  it: "@aContessa De' Functis@bOooooh!\nEvano anni che non vicevevamo visite!\n@c0@"
  ja: "@a@bソフィア「まあ　お客さまなんて\n\t何年ぶりかしら……。\n@c0@"
208:
  de: "@aGräfin Krypto@bMein Mann und ich wohnen ganz alleine in diesem friedvollen Schloss. Seht Euch in aller Ruuuhe um.\n@c0@"
  en: "@aMiss Count @bMy husband and I are livink alone here in zis peaceful castle. Feel free to looooook around.\n@c0@"
  es: "@aCondesa@bMi marido y yo solos en este pacífico castillo vivimos. Libre%H0860%X eres%Ys sois%Z de un vistazo echar.\n@c0@"
  fr: "@aComtesse Karpatt@bMon mari et moi vivons seuls dans ce paisible château. Je vooous laisse visiter, si vooous voooulez.\n@c0@"
  it: "@aContessa De' Functis@bIo e il mio adovato consovte viviamo da soli nel nostvo mevaviglioso manievo. %H0860%XSe vuoi dave un'occhiata in givo, accomodati puve%YSe volete dave un'occhiata in givo, accomodatevi puve%Z.\n@c0@"
  ja: "@a@bソフィア「ここは　夫と　私だけの\n\t静かな城……。\n\tゆっくりして行ってくださいな。\n@c0@"
209:
  de: "@aGraf Krypto@bIhr braucht gar nichts zuuu sagen, ich weiß, wer Ihr seid.\n@c0@"
  en: "@aCount Uptaten@bYooo dooo not have tooo say anythink.\r\nAlready I am knowink.\n@c0@"
  es: "@aConde Alverres@bNada por qué decir %H0860%Xtienes%Ytenéis%Z.\nLo sé ya.\n@c0@"
  fr: "@aComte Karpatt@bVooous n'avez pas besoin de parler.\nJe sais déjà tooout.\n@c0@"
  it: "@aConte De' Functis@b%H0860%XNon diiire nieeenteee%YNon diiite nieeenteee%Z...\nIo sooo già tuuuttooo...\n@c0@"
  ja: "@a@bエリック「そなたが　何も　言わずとも\n\tわしは　分かっておるぞ。\n@c0@"
210:
  de: "@aGraf Krypto@bIch werde nie vergessen, wie der muuutige %a000090 mein Schloss gerettet hat. Nie, für alle Ewigkeiten.\n@c0@"
  en: "@aCount Uptaten@bNever vill I forget how my castle vas saved by ze brave %a000090. Never, for all ze eternity.\n@c0@"
  es: "@aConde Alverres@bCómo mi castillo salvado por %a000090 fue yo nuuunca olvidaré. Nuuunca en la eternidad toda.\n@c0@"
  fr: "@aComte Karpatt@bJe n'oooublierai jamais que mon château fut sauvé par le brave %a000090. Je m'en sooouviendrai éternellement.\n@c0@"
  it: "@aConte De' Functis@bNon dimeeentico che il mio casteeello venne salvaaato dal coraggiooosooo %a000090...\nNooon lo scorderò maaai...\n@c0@"
  ja: "@a@bエリック「%a000090に　この城を\n\tすくってもらったことは\n\t永遠に　忘れぬであろう。\n@c0@"
211:
  de: "@aGraf Krypto@bSeit jenem Tage leben wir glücklich und zuuufrieden.\n@c0@"
  en: "@aCount Uptaten@bFrom zat day, ve are able tooo live here\r\nin ze peaces.\n@c0@"
  es: "@aConde Alverres@bDesde ese día en paz nosotros vivir podemos.\n@c0@"
  fr: "@aComte Karpatt@bÀ partir de ce jooour, nooous avons pu enfin vivre ici en paix.\n@c0@"
  it: "@aConte De' Functis@bDaaa quel giooornooo, io e mia moooglieee abbiaaamo potuuuto riposaaare in paaace...\n@c0@"
  ja: "@a@bエリック「あれ以来　わしらは\n\tずっと　ここで　静かに\n\t暮らしておる。\n@c0@"
212:
  de: "@aGraf Krypto@bVor einigen Jahren wohnte das juuunge Paar hier eine Zeit lang.\n@c0@"
  en: "@aCount Uptaten@bSome years ago, ze young couple once lived here for a time.\n@c0@"
  es: "@aConde Alverres@bHace alguuunos años, un tiempo una joven pareja aquí vivió.\n@c0@"
  fr: "@aComte Karpatt@bIl y a quelques années, un jeune cooouple a vécu ici quelque temps.\n@c0@"
  it: "@aConte De' Functis@bAlcuuuni anni fa, una giooovane coooppia venne a viiivere qui per un po'...\n@c0@"
  ja: "@a@bエリック「数年前には　旅の若い夫婦が\n\tこの城に　身をよせてきた\n\tこともあったが……。\n@c0@"
213:
  de: "@aGraf Krypto@bDoch das ist schon lange her. Sie gingen fort, zu einem Ort namens Orden vom Zuuugzwang.\n@c0@"
  en: "@aCount Uptaten@bBut zey vere gone long ago now. Said zey are goink tooo somethink called Order of Zugzwang.\n@c0@"
  es: "@aConde Alverres@bPero se fueron tiempo hace. Dijeron que con algo llamado Orden de Zuuugzwang se marchaban.\n@c0@"
  fr: "@aComte Karpatt@bMais cela fait longtemps qu'ils sont partis. Ils ont dit qu'ils allaient rejoindre l'Ordre du Zugzwang.\n@c0@"
  it: "@aConte De' Functis@bPoi deciiisero di andaaare viiiaaa...\nSe non sbaaaglio, aveeevano intenziooone di unirsi a un gruuuppo chiamato ⓕSetta di Zuuugzwaaangⓖ...\n@c0@"
  ja: "@a@bエリック「やがては　彼らも\n\tこの城を去って行ったのじゃ。\n\tなんでも　光の国へ　行くとか……。\n@c0@"
214:
