321:
  de: "@aMystische Mridula@bDer erste ist der Ring des Feuers. Der zweite der Ring des Wasser. Der dritte und letzte im Bunde ist der Ri-ng des Le-e-bens! Ⓠ Ⓡ\n@c0@"
  en: "@aMystic Mridula@bThe first is the Circle of Fire. The second is the Circle of Water. And the third is that toe-tapping number, the Cir-cle of Li-i-ife! Ⓠ Ⓡ\n@c0@"
  es: "@aBruja Lola@bEl primero es el Anillo de Fuego. El segundo es el Anillo de Agua, jamematen. ¡Y el otro, pay%A0110%Xo%Z%B0110%Xa%Z, es el Anillolailolai de Vida! Ⓠ Ⓡ\n@c0@"
  fr: "@aIrma Cristal@bLe premier est l'Anneau du Feu. Le deuxième est l'Anneau de l'Eau. Et le troisième, chiffre magique,\nest l'Anneau... de... la... Viiiiieⓠ Ⓠ Ⓡ\n@c0@"
  it: "@aMaga Circiona@bIl primo è l'Anello di Fuoco...\nIl secondo è l'Anello d'Acqua...\nIl terzo... Uhm...\n㈡\nAh, sì. Aaah, sì. Aaaaah, sì.\nOra lo chiaroveggio bene: il terzo è l'Anello della Vita!\n@c0@"
  ja: "@a@b占いババ「なんと！　３つのリングが\n\tそなたを　みちびく　というのが\n\t出ておる！\n@c0@"
322:
  de: "@aMystische Mridula@bSchafft Ihr es, all diese Ringe zusammenzutragen, tut sich Euch ein Weg auf. Ein Weg, der nie zuvor beschritten wurde...\n@c0@"
  en: "@aMystic Mridula@bBringing all of these three circle rings together\r\nwill open up the way for you. A brand-spanking\r\nnew way.\n@c0@"
  es: "@aBruja Lola@bUne los tres con ese arte que tú tienes y se te abrirá el camino, pay%A0110%Xo%Z%B0110%Xa%Z. Un camino bonito bonito, ¡ay qué bonito!\n@c0@"
  fr: "@aIrma Cristal@bEn rassemblant ces trois anneaux, le chemin s'ouvrira devant vous. Un chemin tout beau,\r\ntout neuf.\n@c0@"
  it: "@aMaga Circiona@bRiunisci questi tre anelli, e innanzi a te si aprirà una nuova via.\nDove ti condurrà? Mah. Chissà.\n@c0@"
  ja: "@a@b占いババ「１つめは　炎のリング\n\t２つめは　水のリング\n\t３つめは　命のリング。\n@c0@"
323:
  de: "@aMystische Mridula@bUnd ich sehe noch etwas... Der Ring des Lebens, ja, er befindet sich an einem sehr hoch gelegenen Ort. Hoch, sage ich Euch! Hoooch! Kah ha ha hah!\n@c0@"
  en: "@aMystic Mridula@bAnd I am seeing one more thing...\nThis the Circle of Life, it is in a very high up place.\nHigh, I tell you! High! Kah ha ha hah!\n@c0@"
  es: "@aBruja Lola@bY quita que veo otra cosa...\nEl Anillo de Vida está en un sitio muuuuⓘ alto.\n¡Alto, quicir! ¡Muⓘ alto! ¡Lolailololailolá!\n@c0@"
  fr: "@aIrma Cristal@bEt je vois autre chose...\nL'Anneau de la Vie, il est dans un lieu très élevé. Hautⓠ Très hautⓠ Oh ouiⓠ Cra ha ha haⓠ\n@c0@"
  it: "@aMaga Circiona@bAspetta! C'è un'altra cosa che posso dirti.\nL'Anello della Vita si trova in alto... sempre più in alto!\nAllegriaaa! Kah ah ah ah ah!\n@c0@"
  ja: "@a@b占いババ「この３つの　リングが合わさる時\n\tそなたに　また別の道が\n\tしめされるはずじゃ。\n@c0@"
324:
  de: "@aMystische Mridula@bKah ha ha hah! Tja, tja, so, so! Ich bin die Mystische Mridula, wenn's beliebt. Wahrsagerin weiser Wahrheiten! Ka ha ha hah!\n@c0@"
  en: "@aMystic Mridula@bKah ha ha hah! Well-well, well-well!\r\nI am Mystic Mridula, please. The Fortuna\r\nfortune-teller of fortunes! Kah ha ha ha hah!\n@c0@"
  es: "@aBruja Lola@b¡Lolailololailolá! ¡Ay! ¡Válgame!\nSoy la bruja Lola, %A0110%Xpayo%Z%B0110%Xpaya%Z, ¡y leo la fortuna en Fortuna! ¡Lailololailolá!\n@c0@"
  fr: "@aIrma Cristal@bCra ha ha haⓠ Bien, bien, bienⓠ\nJe suis Irma Cristal, la diseuse de bonne aventure de Bonaventureⓠ Cra ha ha haⓠ\n@c0@"
  it: "@aMaga Circiona@bKah ah ah! Io sono la Maga Circiona, l'abbondante chiaroveggente di Fortuna! Tutto so e tutto vedo!\nA proposito, %H0860%Xtu chi sei%Yvoi chi siete%Z?\n@c0@"
  ja: "@a@b占いババ「ちなみに　命のリングは\n\tとても高い所で　見つけると\n\t出ておるぞ。\n@c0@"
325:
  de: "@aMystische Mridula@bEigentlich weissage ich nur nachts. Aber für einen schönen jungen Mann wie Euch mache ich es jederzeit! Kah ha ha hah!\n@c0@"
  en: "@aMystic Mridula@bUsually, I am only telling fortunes at night. But for a handsome young lovely like you, I will be doing it any time of day! Kah ha ha hah!\n@c0@"
  es: "@aBruja Lola@bNormalmente, solo digo la buenaventura de noche.\n㈡\n¡Pero a un payo guapetón como usted le leo todo lo que haga falta cuando quiera! ¡Válgame, qué guapo es el payo! ¡Lolailololailolá!\n@c0@"
  fr: "@aIrma Cristal@bD'ordinaire, je ne reçois que la nuit, mais comme vous êtes un mignon petit jeune homme, je vais faire une exceptionⓠ Cra ha ha haⓠ\n@c0@"
  it: "@aMaga Circiona@bDi solito chiaroveggio solo di notte, ma per un fustaccione appetitoso come te sono sempre disponibile! Anzi, pure trisponibile! Kah ah ah!\n@c0@"
  ja: "@a@b占いババ「わしは　この町では　ちょっと\n\t名の知れた　占いババじゃ。\n@c0@"
326:
  de: "@aMystische Mridula@bIch seeeheee... Kah ha ha ha hah! Die Person, nach der Ihr sucht, weilt nicht in diesem Lande!\n@c0@"
  en: "@aMystic Mridula@bYesss... Yesss... Kah ha ha ha hah! The person who you are looking for is not in this land!\n@c0@"
  es: "@aBruja Lola@bSssí... Sssí... ¡Lailololailolá! La pelsona que buscas no está por aquí, mi arma.\n@c0@"
  fr: "@aIrma Cristal@bVoyoooons... Voyoooons... Cra ha ha haⓠ\nLa personne que vous recherchez ne se trouve\npas dans ce paysⓠ\n@c0@"
  it: "@aMaga Circiona@bAh, sì. Aaah, sì. Aaaaah, sì.\r\nKah ah ah! La persona che stai cercando non si trova in questa terra.\n@c0@"
  ja: "@a@b占いババ「本当は　夜しか　占わぬが\n\tおぬしは　なかなかの男前で　わしの\n\t好みだから　いいことを教えるぞえ。\n@c0@"
327:
  de: "@aMystische Mridula@bVor vielen, vielen Monden hörte ich von einem Volk, das das Tor zur anderen Welt bewacht.\nDort werdet Ihr Eure Antworten finden.\n@c0@"
  en: "@aMystic Mridula@bMany moons ago, I am hearing of these people who are guarding the gate to another world.\r\nYour answers are lying there.\n@c0@"
  es: "@aBruja Lola@bHace muchas lunas que oigo de esos lolailolailos que guardan la puerta a otro mundo, ¡ay, qué canguele!\r\nAllí están tus respuestas.\n@c0@"
  fr: "@aIrma Cristal@bIl y a bien des lunes, j'ai entendu parler du peuple qui garde la porte menant à un autre monde.\r\nC'est là que vous trouverez les réponses.\n@c0@"
  it: "@aMaga Circiona@bTempo fa sentii dire che in un certo luogo vivono i guardiani di un varco che conduce in un altro mondo. Essi hanno le risposte alle tue domande.\n@c0@"
  ja: "@a@b占いババ「う～む……。\n\tお前さんが　もとめる者は\n\tこの世界には　おらんようじゃ。\n@c0@"
