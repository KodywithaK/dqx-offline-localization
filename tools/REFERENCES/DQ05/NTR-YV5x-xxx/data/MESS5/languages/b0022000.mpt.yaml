  ja: "@a@bエリック「なんと　死んでいるせいか\n\t味が　しないのだよ。\n\tいやはや　残念じゃのう……。\n@c0@"
240:
  de: "@a@bDer Katze macht es Spaß herumzustreifen.\n@c0@"
