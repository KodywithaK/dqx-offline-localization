0:
  de: "@a%0%a001240@bMann, ist das riesig hier. Da passt ein ganzes Schiff rein! Das muss man sich mal vorstellen!\n@c0@"
  en: "@a%0%a001240@bThis place is huge. Fancy being able to\nfit a whole ship inside!\n@c0@"
  es: "@a%0%a001240@bEste lugar es enorme. ¡Seguro que cabría un barco entero!\n@c0@"
  fr: "@a%0%a001240@bCet endroit est immense. C'est dingue de pouvoir\ny faire entrer un bateauⓠ\n@c0@"
  it: "@a%0%a001240@bQuesto posto è immenso!\n@c0@"
  ja: "@a@b%a001240「広いなあ……。\n\t船が　まるごと入っても\n\tへっちゃらだよ。\n@c0@"
1:
  de: "@a%0%a001240@bIch kann Salz in der Luft riechen. Na ja, so nah am Meer ist das kein Wunder.\n@c0@"
  en: "@a%0%a001240@bThe breeze tastes all salty. I suppose it's always like this by the sea.\n@c0@"
  es: "@a%0%a001240@bLa brisa tiene un sabor salado. Supongo que siempre es así junto al mar.\n@c0@"
  fr: "@a%0%a001240@bLe vent est salé. J'imagine que c'est toujours comme ça près de la mer.\n@c0@"
  it: "@a%0%a001240@bIl vento ha l'odore della salsedine.\nEvidentemente non siamo lontani dal mare...\n@c0@"
  ja: "@a@b%a001240「風が　しょっぱいや。\n\t海の上だもんね。\n@c0@"
2:
  de: "@a%0%a001240@bGlaubst du, dass das jemand erbaut hat? Oder meinst du, das ist natürlich entstanden? Findest du's nicht auch toll, Papa?\n@c0@"
  en: "@a%0%a001240@bDo you think someone made this? Or do you think it's natural? It's amazing, don't you think, Dad?\n@c0@"
  es: "@a%0%a001240@b¿Crees que esto lo ha hecho alguien? ¿O piensas que es natural? Es sorprendente, ¿verdad, papá?\n@c0@"
  fr: "@a%0%a001240@bTu crois que c'est quelqu'un qui a fait ça ou est-ce que c'est naturelⓡ C'est impressionnant, tu ne trouves pas, papaⓡ\n@c0@"
  it: "@a%0%a001240@bPapà, questo posto è troppo forte!\nCredi che sia di origine naturale?\nO forse l'avrà costruito qualcuno?\n@c0@"
  ja: "@a@b%a001240「誰かが　つくったの？\n\tそれとも　自然にできたの？\n\tすごいね…　お父さん　すごいね。\n@c0@"
3:
  de: "@a%0%a001250@bEs ist stockdüster, aber man kann immer noch das Glitzern der Wellen sehen. Wie schön!\n@c0@"
  en: "@a%0%a001250@bIt's pitch black, but you can still see the waves glistening. How pretty!\n@c0@"
  es: "@a%0%a001250@bAunque está oscuro como boca de lobo, se puede ver el relucir de las olas. ¡Qué bonito!\n@c0@"
  fr: "@a%0%a001250@bIl fait tout noir, mais on voit quand même l'eau miroiter. C'est joliⓠ\n@c0@"
  it: "@a%0%a001250@bÈ buio pesto, ma si vede chiaramente il luccicare delle onde...\nChe spettacolo meraviglioso!\n@c0@"
  ja: "@a@b%a001250「まっくらなのに　ほら\n\t波が　キラキラしてるの……。\n\tきれい……。\n@c0@"
4:
  de: "@a%0%a001250@bJemand ruft uns... Momentan sind wir unerwünscht. Wir sollen später wiederkommen.\n@c0@"
  en: "@a%0%a001250@bSomeone's calling us... They don't want us now.\nThey say to come later.\n@c0@"
  es: "@a%0%a001250@bAlguien nos llama... No quieren que vayamos aún.\nDicen que volvamos más tarde.\n@c0@"
  fr: "@a%0%a001250@bQuelqu'un nous parle... Ils ne veulent pas de nous maintenant. Ils nous disent de revenir plus tard.\n@c0@"
  it: "@a%0%a001250@bQualcuno ci sta chiamando...\nCi dice di non venire adesso, ma di tornare più tardi.\n@c0@"
  ja: "@a@b%a001250「……誰か　よんでる。\n\tううん…　今じゃないの。\n\tもっと後で　おいでって。\n@c0@"
5:
  de: "@a%0%a001250@bIch kann hören, wie sich die Wellen am Ufer brechen. Was für ein Getöse!\n@c0@"
  en: "@a%0%a001250@bI can hear the waves coming crashing in.\nWhat a sound!\n@c0@"
  es: "@a%0%a001250@bSe oyen las olas rompiendo. ¡Qué sonido!\n@c0@"
  fr: "@a%0%a001250@bJ'entends les vagues déferler.\nQuel bruit magnifiqueⓠ\n@c0@"
  it: "@a%0%a001250@bChe bello il rumore delle onde...\n@c0@"
  ja: "@a@b%a001250「ざーん　ざーんって\n\t波の音…　聞こえるね。\n\tすごく　ひびいてる……。\n@c0@"
6:
  de: "@aSancho@bIss mache mir keine Sorgen. Wenn wir uns verlaufen, gibt es genügend Meeresfrüchte in der Nähe. Wir können Paella machen! Si, das ist eine gute Idee, no?\n@c0@"
  en: "@aSancho@bEes no need to worry een here. Eef we are lost, we have the eseafood all around. We can make the paella! Sí, ees a good idea, no?\n@c0@"
  es: "@aSancho@bAcá no hay de qué preocuparse. Si nos perdemos, tenemos marisco por toditos los lados.\n㈡\n¡Podemos hacernos unos tacos marineros! Sí, una idea retepadre, ¿verdad?\n@c0@"
  fr: "@aSancho@bInutile de s'inquiéter. Si on se p-perd, on aura tous les f-fruits de mer qu'on veut pour p-préparer la paella. C'est oune buena idée, noⓡ\n@c0@"
  it: "@aSancho@b¡Esto luego me gusta mucho!\r\n¡Con todos los pesces que ce sono aquí, potremmo preparare una paella maravillosa! ¡Ay, que delicia!\n@c0@"
  ja: "@a@bサンチョ「ここなら　迷っても\n\t魚を釣って　食べられます。\n\tゆっくり行きましょう。\n@c0@"
7:
  de: "@aSancho@bVielleisst wir finden eine neue Welt, wenn wir an das Ende dieses Tunnels gelangen, no?\n@c0@"
  en: "@aSancho@bMaybe, when we finally reach the end of thees tunnel, we come to a new world, no?\n@c0@"
  es: "@aSancho@bQuizás cuando salgamos de este túnel lleguemos a un mundo nuevo.\n@c0@"
  fr: "@aSancho@bQuand on arrivera au b-bout du tunnel, peut-être qu'on sera dans un n-nouveau mundoⓡ\n@c0@"
  it: "@aSancho@bForse alla fin de esta galleria ce aspetta un mundo nuevo, chico...\n@c0@"
  ja: "@a@bサンチョ「暗いトンネルを\n\tこうやって　ゆられていくと\n\tどこか　別の世界に着くような……\n@c0@"
8:
  de: "@aSancho@bGlaubst du nisst auch, Chico? Eine Welt voller Paella!\n@c0@"
  en: "@aSancho@bDon't you theenk eso too, friend?\r\nMaybe the world full of paella!\n@c0@"
  es: "@aSancho@b¿No crees, chamaco?\n¡Quizás un mundo lleno de tacos!\n@c0@"
  fr: "@aSancho@bT-Tu ne crois pas, chicoⓡ\nCe sera peut-être un mundo p-plein de paellaⓠ\n@c0@"
  it: "@aSancho@bUn mundo de paz, amor y armonia.\r\nQue bello sarebbe...\r\n¡Lo zio Sancho es un inguaribile romanticon!\n@c0@"
  ja: "@a@bサンチョ「そんな気がしませんか？\n\t坊っちゃん。\n@c0@"
9:
  de: "@aSancho@bManchmal sieht man im Dunkeln Hände. Aber wem gehören diese Hände, frage iss miss?\n@c0@"
  en: "@aSancho@bEsometimes een the dark, you can esee the hands.\nBut who ees the owner of these hands, eh?\n@c0@"
  es: "@aSancho@b¡Ahí nomás, en la oscuridad, recién te ves las manos!\nPero, ¿de quién son esas manos?, ¿eh?\n@c0@"
  fr: "@aSancho@bP-Parfois, dans le noir, on peut voir des mains.\nMais à qui elles s-sont, heinⓡ\n@c0@"
  it: "@aSancho@bOgni tantos nel buio se vedono dellas manos...\n¿Ma a chi appartengono estas manos?\n@c0@"
  ja: "@a@bサンチョ「ところどころに　人の手が\n\t入っているのが　わかりますね。\n\tしかし　いったい誰が？\n@c0@"
10:
  de: "@aSancho@bDas ist keine normale Höhle. Man fühlt siss wie in eine Kathedrale... Kein Ort für eine Fiesta, eh, Chico?\n@c0@"
  en: "@aSancho@bEes no like the normal cave. Thees place, eet has the feeling of the cathedral or the waiting room of the medic. Ees no place for a fiesta, eh?\n@c0@"
  es: "@aSancho@bNo es como una cueva normal. Este sitio tiene ambiente de catedral o de sala de espera del doctor. No es sitio para pachanga, ¿eh?\n@c0@"
  fr: "@aSancho@bCe n'est p-pas oune grotte normale. Cet endroit,\non d-dirait oune cathédrale ou oune salle d'attente. Pas oun endroit p-pour la fiesta, heinⓡ\n@c0@"
  it: "@aSancho@bEsta no es una caverna como todas las altras.\nSembra quasi una chiesa, o la sala de attesa de un medico. Es un luego que ispira silencio y rispetto...\n@c0@"
  ja: "@a@bサンチョ「洞くつ……というより\n\tどことなく　おごそかな雰囲気が\n\tしますねえ。\n@c0@"
11:
  de: "@aOtto@b...\n@c0@"
  en: "@aTuppence@b............\n@c0@"
  es: "@aAlazar@b...\n@c0@"
  fr: "@aInnocent@b............\n@c0@"
  it: "@aSimon@b...\n@c0@"
  ja: "@a@bピピン「…………。\n@c0@"
12:
  de: "@aOtto@bOh! Tut mir leid, ich war grad so von der Szenerie g'fesselt, dass ich Euch gar net bemerkt hab!\n@c0@"
  en: "@aTuppence@bOh! Sorry! I was totally taken up with\r\nlooking at the scenery.\n@c0@"
  es: "@aAlazar@b¡Oh! ¡Lo siento! Estaba totalmente absorto contemplando el lugar.\n@c0@"
  fr: "@aInnocent@bOhⓠ Désoléⓠ J'étais complètement absorbé par le paysage.\n@c0@"
  it: "@aSimon@bMaestà, questo panorama mi lascia senza parole.\nMa se sono senza parole, com'è che riesco a parlarle?! Uhm, questo sì che è un mistero...\n@c0@"
  ja: "@a@bピピン「あっ　すみません！\n\tつい景色に　見とれてしまって。\n@c0@"
13:
  de: "@aOtto@bMan kann einen schwachen blauen Schein in der Dunkelheit ausmachen. Was für eine seltsame Höhle!\n@c0@"
  en: "@aTuppence@bYou can see a faint blue light in the darkness.\r\nWhat an odd cave this is!\n@c0@"
  es: "@aAlazar@bSe ve una tenue luz azul en la oscuridad.\n¡Esta cueva es muy extraña!\n@c0@"
  fr: "@aInnocent@bOn peut voir une petite lueur bleue dans les ténèbres.\nC'est vraiment une grotte bizarreⓠ\n@c0@"
  it: "@aSimon@bMaestà, ha notato la delicata luce blu che attenua l'oscurità intorno a noi?\nQuesta caverna è davvero spettacolare...\n@c0@"
  ja: "@a@bピピン「暗闇が　ぼんやり\n\t青く　かすんで見えます。\n\t……ふしぎな洞くつですね。\n@c0@"
14:
  de: "@aBianca@bDas nenne ich mal riesig. Es gibt nicht viele Höhlen, in die ein Schiff reinpassen würde.\n@c0@"
  en: "@aBianca@bThis place is certainly big enough. There's not many a cave you can sail a ship through.\n@c0@"
  es: "@aBianca@bEste sitio es bastante grande. No hay muchas cuevas que se puedan atravesar en barco, ¿sabes?\n@c0@"
  fr: "@aBianca@bCet endroit est vraiment grand. Il n'y a pas beaucoup de grottes dans lesquelles on peut\r\nfaire entrer un navire.\n@c0@"
  it: "@aBianca@bNon credo che al mondo esistano molte grotte nelle quali si possa entrare a bordo di una nave...\n@c0@"
  ja: "@a@bビアンカ「この大きな船が\n\tらくらく　通れるくらいだから\n\tここは　そうとうな広さね。\n@c0@"
15:
  de: "@aBianca@bSieh nur, wie hoch die Decke ist! Solch eine Höhle habe ich noch nie gesehen.\n@c0@"
  en: "@aBianca@bLook how high the ceilin' is as well! This place dun't feel anythin' like any other caves I've bin in.\n@c0@"
  es: "@aBianca@b¡Mira qué altura tiene el techo! Esta no es como las otras cuevas a las que he ido, ¿me entiendes?\n@c0@"
  fr: "@aBianca@bRegarde comme le plafond est hautⓠ Cette grotte n'a rien à voir avec celles que je connais déjà.\n@c0@"
  it: "@aBianca@bLa volta della caverna è altissima!\r\nQuesto posto è una meraviglia della natura!\n@c0@"
  ja: "@a@bビアンカ「天井も　すごく高くて\n\t洞くつ　って感じがしないわね。\n@c0@"
16:
  de: "@aNera@bEs ist seltsam, dass der Wind hier weht, obwohl wir uns ja in einer Höhle befinden. Aber er tut gut.\n@c0@"
  en: "@aNera@bIt's funny feeling a breeze from outside even though we're in a cave. It's a nice feeling.\n@c0@"
  es: "@aNera@bEs curioso que se sienta la brisa del exterior aun estando en una cueva. Es una sensación agradabile.\n@c0@"
  fr: "@aNera@bC'est drôle de sentir du vent venir de l'extérieur alors qu'on est à l'intérieur d'une grotte.\r\nC'est agréable.\n@c0@"
  it: "@aNera@bIl vento proveniente dall'esterno si sente fin qui.\r\nÈ una bella sensazione, non trovi? A momenti non mi sembra nemmeno di trovarmi in una caverna...\n@c0@"
  ja: "@a@bフローラ「洞くつの中ですけど\n\t外から　風が入ってきて\n\t気持ちいいですわ。\n@c0@"
17:
  de: "@aNera@bIch kann es nicht erklären, aber diese Höhle kommt mir nicht so vor, als wolle sie die Leute aussperren...\n@c0@"
  en: "@aNera@bI can't explain it, but it feels like this cave doesn't try to shut people out.\n@c0@"
  es: "@aNera@bNo sé cómo explicarlo, ma sento que esta cueva no trata de echar fuera a nadie.\n@c0@"
  fr: "@aNera@bJe ne sais pas comment l'expliquer, mais on dirait que cette grotte n'essaie pas de chasser les gens.\n@c0@"
  it: "@aNera@bQuesta grotta ha un'atmosfera accogliente.\nÈ come se ci invogliasse a proseguire la sua esplorazione...\n@c0@"
  ja: "@a@bフローラ「この洞くつって　何者も\n\tよせつけないような雰囲気が\n\tありますわね。\n@c0@"
18:
  de: "@aBianca@bIch frage mich, was das für ein Ort ist. Kommt mir fast wie ein Tempel oder so was vor...\n@c0@"
  en: "@aBianca@bI wonder what this place is. It feels almost like a temple or somethin'.\n@c0@"
  es: "@aBianca@b¿Qué lugar será este? Parece como un templo o algo así.\n@c0@"
  fr: "@aBianca@bJe me demande ce que c'est que cet endroit. On dirait presque un temple ou un lieu de ce genre.\n@c0@"
  it: "@aBianca@bChe cosa sarà mai questo posto?\nMi sembra quasi un tempio...\n@c0@"
  ja: "@a@bビアンカ「ここって　何なのかしら？\n\t神殿のような感じがするけど……。\n@c0@"
19:
  de: "@aNera@bWas, glaubst du, ist das für ein Ort? Er erscheint mir fast wie ein Tempel oder ein Schrein.\n@c0@"
  en: "@aNera@bWhat do you suppose this place is? It looks almost like a temple or a shrine.\n@c0@"
  es: "@aNera@b¿Qué crees que será este sitio? Veramente, es como un templo o un santuario.\n@c0@"
  fr: "@aNera@bDe quel genre d'endroit s'agit-il, à ton avisⓡ\nOn dirait presque un temple ou un mausolée.\n@c0@"
  it: "@aNera@bSecondo te cos'è questo luogo?\nMi dà l'idea di essere un tempio, o qualcosa di simile...\n@c0@"
  ja: "@a@bフローラ「ここって　何なのかしら？\n\t神殿のような感じがしますわね……。\n@c0@"
20:
  de: "@a%0%a001240@bSieht aus wie der Eingang zu einem Schrein oder so was. Was man wohl für einen Schlüssel braucht, um da hineinzukommen...\n@c0@"
  en: "@a%0%a001240@bThis looks like the entrance to a shrine or something.\nI wonder what kind of key you need to get inside.\n@c0@"
  es: "@a%0%a001240@bParece la entrada a un templo o algo así.\n¿Qué clase de llave hará falta para entrar?\n@c0@"
  fr: "@a%0%a001240@bOn dirait l'entrée d'un temple ou quelque chose comme ça. Je me demande quel genre de clef il faut utiliser pour y entrer.\n@c0@"
  it: "@a%0%a001240@bChe cos'è questo? L'ingresso di un tempio?\nÈ chiuso, però. Chissà che chiave serve per entrare... Mi piacerebbe dare un'occhiata all'interno.\n@c0@"
  ja: "@a@b%a001240「ここって\n\t神殿の入り口みたいだね。\n\tどんな　カギなら　あけられるんだろ？\n@c0@"
21:
  de: "@a%0%a001250@bDa drinnen ist etwas Mysteriöses verborgen, ich spüre das. Was, glaubst du, könnte es sein?\n@c0@"
  en: "@a%0%a001250@bI'm sensing that there's something mysterious inside. What do you think it could be?\n@c0@"
  es: "@a%0%a001250@bTengo la sensación de que dentro hay algo misterioso. ¿Qué crees que puede ser?\n@c0@"
  fr: "@a%0%a001250@bJ'ai le sentiment qu'il y a quelque chose de mystérieux à l'intérieur. Qu'est-ce que ça\npourrait être, d'après toiⓡ\n@c0@"
  it: "@a%0%a001250@bPercepisco qualcosa di misterioso all'interno, però non riesco a capire di cosa si tratti...\n@c0@"
  ja: "@a@b%a001250「この奥　ふしぎな感じがするの。\n\tなにが　あるのかな？\n@c0@"
22:
  de: "@aSancho@bDie Tür lässt siss nisst öffnen, eh? Erst musst du Informationen sammeln, Chico. Vielleisst findest du dann ja heraus, wie man sie aufsperrt.\n@c0@"
  en: "@aSancho@bEes no gonna open, eh? First you must ask around for information. Maybe you weell find esometheeng about unlocking eet.\n@c0@"
  es: "@aSancho@bNo se va a abrir, ¿no? Antes tendrás que preguntar por ahí. Quizás te relaten cómo abrirla.\n@c0@"
  fr: "@aSancho@bÇa ne v-va pas s'ouvrir, heinⓡ D'abord, tu d-dois te renseigner. Peut-être que t-tu apprendras comment l'ouvrir.\n@c0@"
  it: "@aSancho@b¿No se apre?\nForse dovremmo chiedere informaciónes a qualcuno su como se puede entrare lì dentros...\n@c0@"
  ja: "@a@bサンチョ「開きませんね。\n\tとりあえず　情報集めをしましょう。\n\tそのうち　なにか　わかるでしょう。\n@c0@"
23:
  de: "@aBianca@bDas muss der Tümpeltempel sein. Also sind wir endlich am Tor nach Nadiria angelangt... und nicht mehr weit von deiner Mutter.\n@c0@"
  en: "@aBianca@bThis must be Estuary Sanctuary. That means we're finally at the place where you can open the doors to Nadiria...and your mother.\n@c0@"
  es: "@aBianca@bEsto debe de ser el Santuario Estuario. Es decir, que hemos llegado por fin al sitio en el que se abren las puertas a Nadiria... y a tu madre, ¿sabes?\n@c0@"
  fr: "@aBianca@bCe doit être le Sanctuaire de l'estuaire. Nous sommes donc arrivés à l'endroit où s'ouvrent les portes qui nous mèneront à Nadiria... et à ta mère.\n@c0@"
  it: "@aBianca@bQuesto dev'essere il Tempio dell'Estuario.\nQui troveremo il modo di aprire il varco per Nadiria, e potremo finalmente raggiungere tua madre!\n@c0@"
  ja: "@a@bビアンカ「きっと　ここが海の神殿ね。\n\tここから　お母さまのいる\n\t魔界へのトビラが開くはずだわ。\n@c0@"
24:
  de: "@aNera@bDas muss der Tümpeltempel sein. Wir sind da, Liebling.\n@c0@"
  en: "@aNera@bThis has to be Estuary Sanctuary. It's time, darling.\n@c0@"
  es: "@aNera@bEsto tiene que ser el Santuario Estuario. Llegó el momento, caro mio.\n@c0@"
  fr: "@aNera@bCe doit être le Sanctuaire de l'estuaire.\r\nC'est maintenant ou jamais, mon chéri.\n@c0@"
  it: "@aNera@bQuesto ha tutta l'aria di essere il Tempio dell'Estuario, tesoro.\nFinalmente siamo arrivati...\n@c0@"
  ja: "@a@bフローラ「きっと　ここが\n\t海の神殿ですわね。\n\tさあ　あなた　行きましょう。\n@c0@"
25:
  de: "@a%0%a001240@bWas, glaubst du, ist das für eine Statue, Papa? Sie sieht ein wenig seltsam aus, findest du nicht?\n@c0@"
  en: "@a%0%a001240@bWhat do you think that statue's all about, Dad?\nIt's a bit odd, don't you think?\n@c0@"
  es: "@a%0%a001240@b¿Qué crees que es esta estatua, papá?\nEs un poco rara, ¿no?\n@c0@"
  fr: "@a%0%a001240@bD'après toi, à quoi sert cette statue, papaⓡ\nElle est plutôt bizarre, tu ne trouves pasⓡ\n@c0@"
  it: "@a%0%a001240@bChe belle queste statue...\nMa come mai sono tutte con le braccia allargate?\n@c0@"
  ja: "@a@b%a001240「ねえ　お父さん。\n\tあの像　なんだろう？\n\tなんか　気になるよね？\n@c0@"
26:
  de: "@a%0%a001240@bGroßmutter hat gesagt, dass wir nicht kommen sollen. Ich hoffe nicht, dass sie uns ausschimpft, wenn wir es doch tun...\n@c0@"
  en: "@a%0%a001240@bGrandma said we mustn't come, but that doesn't mean we'll get told off if we do, does it?\n@c0@"
  es: "@a%0%a001240@bLa abuela dice que no debemos venir, pero eso no significa que nos vayan a echar si lo hacemos, ¿verdad?\n@c0@"
  fr: "@a%0%a001240@bGrand-mère a dit qu'on ne devait pas venir, mais elle ne nous dira pas de repartir si on vient quand même, heinⓡ\n@c0@"
  it: "@a%0%a001240@bNonna ci ha detto di non andare da lei...\nCredi che si arrabbierà quando ci vedrà arrivare?\n@c0@"
  ja: "@a@b%a001240「おばあちゃんは\n\t来ちゃダメって言ったけど　行っても\n\tしかったりしないよね？\n@c0@"
27:
