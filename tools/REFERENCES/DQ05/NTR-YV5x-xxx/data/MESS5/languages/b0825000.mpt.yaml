  en: "@a@bYou already have the maximum possible number of casino tokens. Play anyway?\n@c0@"
  es: "@a@bYa tienes el máximo de fichas de casino posibles. ¿Jugar de todos modos?\n@c0@"
  fr: "@a@bVous avez déjà le maximum de jetons possible en votre possession. Jouer quand mêmeⓡ\n@c0@"
  it: "@a@bHai già il numero massimo di gettoni che puoi portare con te.\nVuoi giocare ugualmente?\n@c0@"
  ja: "@a@bコインが　いっぱいです！\nスロットを　つづけますか？\n@c0@"
5:
