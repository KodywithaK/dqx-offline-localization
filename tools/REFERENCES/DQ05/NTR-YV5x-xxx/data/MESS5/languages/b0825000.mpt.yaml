0:
  de: "@a@bDas ist ein Spielautomat. Eine Runde kostet %a001070 Jeton%H1070%X%Ys%Z. Einen Versuch wagen?\n@c0@"
  en: "@a@bThere's a slot machine that costs %a001070 %H1070%Xtoken%Ytokens%Z per go.\nGive it a whirl?\n@c0@"
  es: "@a@bHay una máquina tragaperras que cuesta %a001070 ficha%H1070%X%Ys%Z la jugada.\n¿Probar suerte?\n@c0@"
  fr: "@a@bCette machine à sous coûte %a001070 jeton%I1070%X%Ys%Z par tour.\nEssayerⓡ\n@c0@"
  it: "@a@bPer giocare con questa slot machine bisogna inserirvi %H1070%Xun gettone%Y%a001070 gettoni%Z.\nVuoi provarla?\n@c0@"
  ja: "@a@b%a001070コインスロットが　ある。\n遊んでみますか？\n@c0@"
1:
  de: "@a@bIhr habt offenbar gar keine Kasino-Jetons bei Euch. Kommt wieder, wenn Ihr welche gekauft habt!\n@c0@"
  en: "@a@bIt looks like you don't have any casino tokens. Come back again when you've bought some!\n@c0@"
  es: "@a@bParece que no tienes fichas de casino. ¡Compra unas cuantas y vuelve de nuevo!\n@c0@"
  fr: "@a@bSi je ne me trompe pas, vous n'avez pas de jeton de casino. Revenez quand vous en aurez achetéⓠ\n@c0@"
  it: "@a@bSpiacente, ma non hai gettoni!\nTorna quando te ne sarai procurato qualcuno.\n@c0@"
  ja: "@a@bコインが　ありませんので　コインを\nおかいもとめのうえ　またおこしください！\n@c0@"
2:
  de: "@a@bAuf dem Steuerkreuz oben drücken, um Jetons einzuwerfen, dann den A-Knopf, damit die Räder sich drehen. Den B-Knopf drücken, um aufzuhören.\n@c0@"
  en: "@a@bPress up on the +Control Pad to put in your tokens, and then press the A Button to start the wheels spinning. Press the B Button to stop playing.\n@c0@"
  es: "@a@bPulsa arriba en el + Panel de Control para meter fichas y el Botón A para jugar. Pulsa el Botón B para salir.\n@c0@"
  fr: "@a@bAppuyez sur le haut de la manette + pour insérer vos jetons, puis sur le bouton A pour faire tourner les symboles.\n㈡\nAppuyez sur le bouton B pour arrêter de jouer.\n@c0@"
  it: "@a@bUsa la pulsantiera + per inserire i gettoni.\nPremi il pulsante A per avviare la slot machine.\nPremi il pulsante B per smettere di giocare.\n@c0@"
  ja: "@a@b十字ボタン　うえで　コインをいれ\nＡボタンで　スタートです。\nＢボタンで　スロットをやめます。\n@c0@"
3:
  de: "@a@bGut gemacht!\nDu hast soeben %a000720 Jetons gewonnen.\n@c0@"
  en: "@a@bWell done!\nYou've just won yourself %a000720 tokens.\n@c0@"
  es: "@a@b¡Muy bien!\nAcabas de ganar %a000720 fichas.\n@c0@"
  fr: "@a@bBien jouéⓠ\nVous venez de gagner %a000720 jetons.\n@c0@"
  it: "@a@bOttimo!\nHai vinto %a000720 gettoni.\n@c0@"
  ja: "@a@bおめでとうございます！\n%a000720まいの\nコインが　あたりました！\n@c0@"
4:
