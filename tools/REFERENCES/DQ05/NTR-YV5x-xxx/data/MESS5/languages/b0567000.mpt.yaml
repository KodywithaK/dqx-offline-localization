0:
  de: "@aBianca@bKomischer Ort, oder? Diese ganzen Flecken an den Wänden machen mich irgendwie nervös...\n@c0@"
  en: "@aBianca@bThis is a weird place, eh? It's really creepy seein' all them spots and speckles on the walls like that.\n@c0@"
  es: "@aBianca@bEste es un sitio raro, ¿eh? Con todas esas manchas y salpicaduras en las paredes, resulta espeluznante.\n@c0@"
  fr: "@aBianca@bC'est un endroit vraiment bizarre, heinⓡ Ça fait froid dans le dos toutes ces taches sur les murs.\n@c0@"
  it: "@aBianca@bChe posto da brividi...\nNon oso nemmeno chiedermi cosa siano quelle macchie sui muri...\n@c0@"
  ja: "@a@bビアンカ「なんだか　ぶきみな塔ね。\n\tあの　まだらに　汚れたカベ…\n\t気持ち悪いわ……。\n@c0@"
1:
  de: "@aNera@bSelbst wenn man nicht wüsste, dass das die Unterwelt ist, würde man es auf den ersten Blick erkennen. Welch eine ungemütliche Atmosphäre...\n@c0@"
  en: "@aNera@bYou'd know this place was the underworld even without being told. There's such a nasty feeling\r\nin the air.\n@c0@"
  es: "@aNera@bSe sabría que este sitio es el inframundo sin que nessuno lo dijera. Hay algo desagradable en el aire.\n@c0@"
  fr: "@aNera@bMême si tu ne me l'avais pas dit, j'aurais su qu'on était dans le monde souterrain. L'atmosphère y est\r\nsi viciée.\n@c0@"
  it: "@aNera@bAnche se non lo sapessi, ci metterei un istante a capire che ci troviamo nel Regno degli Inferi. Non ero mai stata in un luogo dall'atmosfera tanto sinistra...\n@c0@"
  ja: "@a@bフローラ「いかにも　魔界という感じの\n\tぶきみさが　ありますわね。\n\tやだ…　寒気が　してきました……。\n@c0@"
2:
  de: "@a%0%a001240@bSieh nur, Papa! Was für ein komischer Baum!\n@c0@"
  en: "@a%0%a001240@bLook, Dad! Look at that weird tree!\n@c0@"
  es: "@a%0%a001240@b¡Mira, papá! ¡Mira qué árbol tan raro!\n@c0@"
  fr: "@a%0%a001240@bRegarde, papaⓠ Regarde cet arbre bizarreⓠ\n@c0@"
  it: "@a%0%a001240@bPapà, guarda!\nHai visto quant'è strano quell'albero?!\n@c0@"
  ja: "@a@b%a001240「ねえ　お父さん　見て！\n\tへんな木が　はえているよ。\n@c0@"
3:
  de: "@a%0%a001250@bIch frage mich, für wen dieser große Kerker erbaut wurde. Menschen? Monster? Oder vielleicht sogar beides?\n@c0@"
  en: "@a%0%a001250@bI wonder who was allowed in the great dungeon. Humans? Monsters? Maybe even both?\n@c0@"
  es: "@a%0%a001250@b¿A quién permitirían entrar en la gran mazmorra? ¿Humanos? ¿Monstruos? ¿Tal vez a ambos?\n@c0@"
  fr: "@a%0%a001250@bJe me demande qui pouvait entrer dans ce grand donjonⓡ Les humainsⓡ Les monstresⓡ Peut-être même les deuxⓡ\n@c0@"
  it: "@a%0%a001250@bMi chiedo a chi fosse concesso penetrare nelle grandi segrete di Nadiria...\nAgli esseri umani? Ai mostri? O forse a entrambi?\n@c0@"
  ja: "@a@b%a001250「ろうごく　って　どんな人が\n\t入れられてたのかな？\n\t人間？　魔物さん？　それとも両方？？\n@c0@"
4:
  de: "@aSancho@bSi, iss kann mir gut vorstellen, dass das mal eine Kerker war. Es gefällt mir gar nisst hier...\n@c0@"
  en: "@aSancho@bAnda! Sí, I believe thees ees once the dungeon.\r\nEes no a nice feeling een here.\n@c0@"
  es: "@aSancho@b¡Ándale! Sí, yo diría que esta fue la mera mazmorra.\nLa sensación aquí no es agradable.\n@c0@"
  fr: "@aSancho@bAndaⓠ Si, je veux b-bien croire que c'était un donjon. On ne s'y sent pas b-bien du tout.\n@c0@"
  it: "@aSancho@b¡Ay, que brutta sensación!\nEstas segretas sono un luego muy malo...\n@c0@"
  ja: "@a@bサンチョ「かつて　ろうごく\n\tだったと　いうだけあって\n\t気味の悪い建物ですね。\n@c0@"
5:
  de: "@aSancho@bMir wäre lieber, wenn wir nisst mehr herkommen.\n@c0@"
  en: "@aSancho@bI prefer we no come here.\n@c0@"
  es: "@aSancho@bYo prefiero que no entremos.\n@c0@"
  fr: "@aSancho@bJe p-préfère qu'on n'y r-rentre pas.\n@c0@"
  it: "@aSancho@bDarei un pentolon de paella por essere altroves...\n@c0@"
  ja: "@a@bサンチョ「本当なら　近づきたくは\n\tないのですが……。\n@c0@"
6:
  de: "@aOtto@bMan könnte meinen, dass der bloße Aufenthalt hier drin schon reicht, um sich einen Fluch einzufangen! Aber diese Befürchtung ist sicher unbegründet.\n@c0@"
  en: "@aTuppence@bIt feels like you'd end up cursed just from being inside the place! I'm sure that's not the case, though.\n@c0@"
  es: "@aAlazar@b¡Da la sensación de que quedarás maldito solo por estar dentro! Pero seguro que no es así.\n@c0@"
  fr: "@aInnocent@bCe donjon donne l'impression qu'il suffit d'y entrer pour être mauditⓠ Je suis sûr que ce n'est pas le cas, mais bon.\n@c0@"
  it: "@aSimon@bC'è un'atmosfera talmente sinistra che ho paura di buscarmi una maledizione solo a respirare l'aria che c'è qui dentro!\n@c0@"
  ja: "@a@bピピン「なんだか　入っただけで\n\t呪われそうな建物ですよ。\n\tまあ　そんなことはないと思いますが。\n@c0@"
7:
  de: "@aBianca@bGanz schön groß, oder?\n@c0@"
  en: "@aBianca@bIt's pretty big inside, eh?\n@c0@"
  es: "@aBianca@bSí que es grande por dentro, ¿eh?\n@c0@"
  fr: "@aBianca@bC'est vraiment grand à l'intérieur, heinⓡ\n@c0@"
  it: "@aBianca@bL'interno è più grande di quanto credessi...\n@c0@"
  ja: "@a@bビアンカ「ふ～ん…\n\t中は　けっこう　広いのね。\n@c0@"
8:
  de: "@aNera@bWir müssen sehr vorsichtig sein. Immerhin sind wir nun in der Unterwelt, da muss man auf alles gefasst sein.\n@c0@"
  en: "@aNera@bWe mustn't let our guard down. We're in part of the underworld now, so we can't be sure what might happen.\n@c0@"
  es: "@aNera@bNo debemos bajar la guardia. Adesso estamos dentro del inframundo, y non sappiamo qué pasará.\n@c0@"
  fr: "@aNera@bNous ne devons pas baisser notre garde.\r\nNous sommes dans le monde souterrain,\r\nmaintenant. Qui sait ce qui peut arriver.\n@c0@"
  it: "@aNera@bCaro, cerchiamo di restare concentrati.\nNel Regno degli Inferi le brutte sorprese sono sempre dietro l'angolo...\n@c0@"
  ja: "@a@bフローラ「魔界の建物なんですから\n\t安心は　できませんわ。\n\tあなたも　いちおう　気をつけて……。\n@c0@"
9:
  de: "@a%0%a001240@bIgitt, was für ein dreckiger und schrecklicher Ort! Und stinken tut es auch. Machen die Monster denn niemals sauber?\n@c0@"
  en: "@a%0%a001240@bYuck! What a dirty, horrible place! And it smells.\nDon't monsters ever do any dusting?\n@c0@"
  es: "@a%0%a001240@b¡Puaj! ¡Qué sitio más asqueroso! Y apesta.\n¿Es que los monstruos no limpian?\n@c0@"
  fr: "@a%0%a001240@bBeurkⓠ Quel endroit dégoûtantⓠ En plus, ça sent mauvais. Les monstres ne font jamais le ménageⓡ\n@c0@"
  it: "@a%0%a001240@bQuesto posto è orribile...!\nE senti che puzza!\nMa i mostri non fanno mai le pulizie?!\n@c0@"
  ja: "@a@b%a001240「うわ～　きったない所だね。\n\tそれに　くさいし……。\n\t魔物って　そうじ　しないのかな？\n@c0@"
10:
  de: "@a%0%a001250@bAah, ich bin in ein Spinnennetz gelaufen!\n@c0@"
  en: "@a%0%a001250@bUrgh! I just got a cobweb caught in my hair!\n@c0@"
  es: "@a%0%a001250@b¡Agh! ¡Se me ha enredado una telaraña en el pelo!\n@c0@"
  fr: "@a%0%a001250@bBeurkⓠ J'ai une toile d'araignée dans les cheveuxⓠ\n@c0@"
  it: "@a%0%a001250@bArgh!\nMi si è appiccicata una ragnatela ai capelli!\n@c0@"
  ja: "@a@b%a001250「やだ！　かみの毛に\n\tクモの巣が　くっついちゃった！\n@c0@"
11:
  de: "@aSancho@bWir müssen vorsisstig sein, hörst du? Man weiß nie, was an solch eine Ort passieren kann.\n@c0@"
  en: "@aSancho@bWe must be careful, okay? You no know\r\nwhat might happen een a place like thees.\n@c0@"
  es: "@aSancho@bPues debemos tener cuidado, ¿ok? No se sabe que puede pasar en un lugar como este.\n@c0@"
  fr: "@aSancho@bIl faut f-faire attention. On ne sait p-pas ce qui peut arriver dans un endroit p-pareil.\n@c0@"
  it: "@aSancho@bChico, facciamo attenziones.\nEsto es un luego muy pericoloso...\n@c0@"
  ja: "@a@bサンチョ「とにかく　気をつけましょう。\n\tここでは　なにが起こっても\n\tふしぎではありませんよ！\n@c0@"
12:
  de: "@aOtto@bBrrr... Dafür, dass wir eigentlich drinnen sind, ist es hier ziemlich kalt.\n@c0@"
  en: "@aTuppence@bBrrr... It's rather cold, considering that\r\nwe're indoors.\r\n@c0@"
  es: "@aAlazar@bBrrr... Hace bastante frío para estar en un sitio cerrado.\n@c0@"
  fr: "@aInnocent@bBrrr... Il fait plutôt froid et, pourtant, on est\r\nà l'intérieur.\n@c0@"
  it: "@aSimon@bBrrrrr!\nQui dentro fa un freddo cane!\n@c0@"
  ja: "@a@bピピン「建物の中だというのに\n\tなんだか　寒いですね。\n\tううっ…　ぶるぶる……。\n@c0@"
13:
  de: "@aBianca@bWer hätte gedacht, dass man uns auch in Nadiria von den hiesigen Souvenirs erzählen würde.\n@c0@"
  en: "@aBianca@bI certainly never expected to hear talk of local souvenirs here in Nadiria too!\n@c0@"
  es: "@aBianca@b¡Bueno, tampoco esperaba oír hablar a los productos típicos de aquí de Nadiria!\n@c0@"
  fr: "@aBianca@bJe n'aurais jamais pensé qu'il y aurait des choses\nà rapporter de Nadiriaⓠ\n@c0@"
  it: "@aBianca@bNon starà parlando mica di un souvenir?\nD'altra parte, anche se è un posto orrendo, anche Nadiria avrà i suoi prodotti tipici...\n@c0@"
  ja: "@a@bビアンカ「魔界に来てまで\n\t名産品の話を　聞くとは\n\t思わなかったわ。\n@c0@"
14:
  de: "@aNera@bNa, so was! Selbst in Nadiria werden einem die hiesigen Souvenirs angepriesen!\n@c0@"
  en: "@aNera@bWell! I didn't expect to hear talk of local souvenirs here in Nadiria.\n@c0@"
  es: "@aNera@b¡Ma bene! ¡No esperaba oír parlare de los productos típicos de Nadiria!\n@c0@"
  fr: "@aNera@bEh bienⓠ Je n'aurais jamais pensé qu'il y aurait des objets intéressants à Nadiria.\n@c0@"
  it: "@aNera@bMa tu guarda! E così anche Nadiria ha i suoi souvenir, eh? Però non credo che arrivino molti turisti a comprarli...\n@c0@"
  ja: "@a@bフローラ「魔界に来てまで\n\t名産品の話を　聞くとは\n\t思いませんでしたわね。\n@c0@"
15:
  de: "@a%0%a001240@bImmer wenn wir mit einer ruhelosen Rüstung sprechen, frage ich mich, was wohl unter dem Visier verborgen ist...\n@c0@"
  en: "@a%0%a001240@bIt always makes me wonder when we speak to a restless armour... What do you think their real faces look like?\n@c0@"
  es: "@a%0%a001240@bEsto de hablar con armaduras inquietas siempre me deja pensativo... ¿Cómo será su cara?\n@c0@"
  fr: "@a%0%a001240@bQuand on parle à une armure errante, je me pose toujours la même question... À quoi ressemble la créature dans l'armure, selon toiⓡ\n@c0@"
  it: "@a%0%a001240@bMi sono sempre chiesto che volto abbiano le Armature assassine...\nSempre ammesso che ce l'abbiano, un volto!\n@c0@"
  ja: "@a@b%a001240「ボク　いつも思うんだけど……\n\tさまようよろいの素顔って\n\tどんななのかな？\n@c0@"
16:
  de: "@aBianca@bPah! Wahrscheinlich musste ER deshalb sterben. Und jetzt erzählt er es uns...\n@c0@"
  en: "@aBianca@bPah! Well, he's just told us, so I suppose that makes him a dead man.\n@c0@"
  es: "@aBianca@b¡Buah! Bueno, nos lo acaba de decir, así que se puede dar por muerto, ¿no?\n@c0@"
  fr: "@aBianca@bAhⓠ Lui, il vient de nous le dire, alors j'imagine qu'il est déjà mort.\n@c0@"
  it: "@aBianca@bPerò!\nNon parlava mica male, per essere uno Zombie...\n@c0@"
  ja: "@a@bビアンカ「ぷっ！\n\tそれで　クチにしたから　あの人は\n\t死体になっちゃったんだ。\n@c0@"
17:
  de: "@aNera@bNimzo ein großer Gott? Glaubst du, dass das wahr ist?\n@c0@"
  en: "@aNera@bNimzo is a great god?\r\nDo you think that's really true?\n@c0@"
  es: "@aNera@b¿Nimzo, un gran dios?\n¿Crees que eso es la verità?\n@c0@"
  fr: "@aNera@bNimzo est un dieu puissantⓡ\nTu crois que c'est vraiⓡ\n@c0@"
  it: "@aNera@bNimzo è un dio?!\nAddirittura?!\nQuesta proprio non la sapevo!\n@c0@"
  ja: "@a@bフローラ「ミルドラースが　万能の神…\n\t本当に　そうなのかしら……。\n@c0@"
18:
  de: "@a%0%a001240@bNimzo war ein Mensch?! Oh nein, ich hab's gesagt!\n... Oh. Ich bin immer noch am Leben...\n@c0@"
  en: "@a%0%a001240@bNimzo was a human!? Uh-oh! I've said it!\n...Oh, but I don't seem to have died or anything.\n@c0@"
  es: "@a%0%a001240@b¡¿Que Nimzo era humano?! ¡Oh, oh! ¡Ya lo he dicho!\n... Vaya, pero no parece que me haya muerto ni nada.\n@c0@"
  fr: "@a%0%a001240@bNimzo était un humainⓠⓑ Oh ohⓠ Je l'ai ditⓠ\n... Mais je ne suis pas mort pour autant, on dirait.\n@c0@"
  it: "@a%0%a001240@bIo non sono una tomba, quindi lo dico:\nⓆ Nimzo era un essere umano... Ⓡ\nⓆ Trallalluno trallallano! Ⓡ\n@c0@"
  ja: "@a@b%a001240「ミルドラースが　人間！？\n\tあっ！　言っちゃった。\n\t……でも　ボク　平気みたいだね。\n@c0@"
19:
  de: "@aOtto@bN-Nimzo ein M-Men... Oh! Das darf ich ja gar nicht sagen! Wer weiß, was sonst mit mir geschieht!\n@c0@"
  en: "@aTuppence@bN-Nimzo is h-hu... Oh! I can't say it! I'm too scared of what might happen!\n@c0@"
  es: "@aAlazar@bN-Nimzo era hu-hu... ¡Oh! ¡No puedo decirlo! ¡Me da miedo lo que pueda pasar!\n@c0@"
  fr: "@aInnocent@bN-Nimzo était h-hu... Ohⓠ Je n'arrive pas à le direⓠ J'ai trop peur de ce qui pourrait m'arriverⓠ\n@c0@"
  it: "@aSimon@bNimzo era un essere um...\nUhm...\nInutile ripeterlo, no? Tanto lo sappiamo tutti.\n㈡\nE poi non vorrei che il Gran Maestro si arrabbiasse e mi desse una manica di botte!\n@c0@"
  ja: "@a@bピピン「み　ミルドラースが\n\tに…　にん……。　ダメだ！\n\tボクには　こわくて　言えません！\n@c0@"
20:
  de: "@a%0%a001240@bWas wohl in seinem Kopf vorgeht... Spielen Monster eigentlich auch T&T?\n@c0@"
  en: "@a%0%a001240@bWhat do you suppose he's thinking about?\nDo monsters play T 'n' T as well?\n@c0@"
  es: "@a%0%a001240@b¿Qué crees que está pensando?\n¿Los monstruos juegan también a T y T?\n@c0@"
  fr: "@a%0%a001240@bÀ quoi il pense, d'après toiⓡ\nLes monstres aussi jouent au TNTⓡ\n@c0@"
  it: "@a%0%a001240@bMa che sta facendo, eh?!\nNon voglio credere che anche i mostri giochino alla Tavola della Sorte!\n@c0@"
  ja: "@a@b%a001240「なんだろ？\n\t魔物も　すごろくするのかな？\n@c0@"
21:
  de: "@a%0%a001250@bDie Felsenbombe sah so aus, als würde sie sich ganz fest konzentrieren. Glaubst du, sie denkt sich eine Route für das T&T-Brett aus?\n@c0@"
  en: "@a%0%a001250@bThat rockbomb looked like he was really concentrating on something. Do you think he was planning a route around the T 'n' T board?\n@c0@"
  es: "@a%0%a001250@bEsa rocobomba se diría que se estaba concentrando mucho en algo. ¿Crees que piensa darse una vuelta por el tablero de T y T?\n@c0@"
  fr: "@a%0%a001250@bCe rochexplosif avait l'air d'être vraiment concentré. Tu crois qu'il réfléchissait à son parcours sur le jeu de TNTⓡ\n@c0@"
  it: "@a%0%a001250@bMa hai visto?! Sembra che quell'Esplo-sasso stia pensando a qualcosa! Non starà mica riflettendo sul percorso da prendere sulla Tavola della Sorte?!\n@c0@"
  ja: "@a@b%a001250「さっきの　ばくだん岩さん\n\tすごい　しかめっ面してたね。\n\tすごろくのまわり方　考えてたのかな？\n@c0@"
22:
  de: "@aBianca@bDas hört sich aber gar nicht gut an! Ein mächtiges Monster, das selbst Nimzo nicht besiegen könnte...\n@c0@"
  en: "@aBianca@bThat dun't sound good! A mighty monster that even Nimzo couldn't defeat...\n@c0@"
  es: "@aBianca@b¡Eso no suena nada bien! Un monstruo tan poderoso que ni Nimzo puede con él...\n@c0@"
  fr: "@aBianca@bÇa ne sent pas bon du toutⓠ Un monstre puissant que même Nimzo ne pourrait pas vaincre...\n@c0@"
  it: "@aBianca@bUn mostro tanto potente da non poter essere sconfitto nemmeno da Nimzo?!\nSanta dea! Che razza di belva sarà mai?!\n@c0@"
  ja: "@a@bビアンカ「そんな…　ミルドラースですら\n\t手こずりそうなのに\n\tまだ　大物がいるっていうの？\n@c0@"
23:
  de: "@aNera@bWas, das Monster meditiert? Wahrscheinlich spart es seine Energie auf und bereitet sich auf zukünftige Kämpfe vor...\n@c0@"
  en: "@aNera@bSo this monster's meditating? That probably\r\nmeans it's conserving its energy and preparing\r\nto take action.\n@c0@"
  es: "@aNera@bAllora, ¿questo monstruo está meditando? Eso puede significar que está guardando energía para entrare en acción.\n@c0@"
  fr: "@aNera@bAinsi, ce monstre méditeⓡ Ça veut sûrement dire\nqu'il garde son énergie et qu'il se prépare à passer\nà l'action.\n@c0@"
  it: "@aNera@bUn mostro bloccato da secoli nelle profondità del sottosuolo?! Starà sicuramente accumulando energia per seminare disastri in tutto il mondo!\n㈡\nO magari ha i crampi e non riesce a muoversi...\n@c0@"
  ja: "@a@bフローラ「めいそう　ですか……。\n\tということは　動き出すための\n\t準備をしているということですわね。\n@c0@"
24:
  de: "@a%0%a001240@bNa, erst mal müssen wir uns um Nimzo kümmern. Alles der Reihe nach. Das andere Monster kann warten.\n@c0@"
  en: "@a%0%a001240@bWell, we'd better see to Nimzo first. We'll deal with this other monster when the time comes.\n@c0@"
  es: "@a%0%a001240@bBueno, será mejor que nos ocupemos antes de Nimzo. Ya nos encargaremos del otro monstruo en su momento.\n@c0@"
  fr: "@a%0%a001240@bEh bien, on ferait mieux d'en finir avec Nimzo d'abord. On s'occupera de cet autre monstre\nen temps voulu.\n@c0@"
  it: "@a%0%a001240@bCredo sia meglio occuparsi prima di Nimzo.\nPoi daremo una bella ripassata anche a quest'altro mostriciattolo...\n@c0@"
  ja: "@a@b%a001240「とりあえずは\n\tミルドラースだよね。\n\tあとのことは　その時考えればいいや。\n@c0@"
25:
  de: "@a%0%a001250@bVielleicht ist es ja dieses Monster, das die seltsame Aura ausstrahlt, die ich schon von Anfang an in Nadiria gespürt habe...\n@c0@"
  en: "@a%0%a001250@bI wonder if the strange aura I've been feeling in the air since we came to Nadiria has been coming from that monster.\n@c0@"
  es: "@a%0%a001250@bMe pregunto si el aura extraña que he notado en el aire desde que llegamos a Nadiria procedía de ese monstruo.\n@c0@"
  fr: "@a%0%a001250@bJe me demande si l'aura étrange que je sens dans l'air depuis qu'on est arrivés à Nadiria vient de ce monstre.\n@c0@"
  it: "@a%0%a001250@bForse l'atmosfera di malvagità che si respira a Nadiria proviene dalla tana di questa belva potentissima e misteriosa...?\n@c0@"
  ja: "@a@b%a001250「魔界に入ったときから\n\t感じていた気配って　その\n\t大物さんのだったのかも……。\n@c0@"
26:
  de: "@aSancho@bDeine Onkel Sancho hat so etwas geahnt, weißt du.\n@c0@"
  en: "@aSancho@bYour Uncle Sancho, he ees expecting thees,\r\nyou know.\n@c0@"
  es: "@aSancho@bTu tito Sancho se lo esperaba.\n@c0@"
  fr: "@aSancho@bTon tonton S-Sancho, il s'attendait à ça, tu sais.\n@c0@"
  it: "@aSancho@bLo zio Sancho se aspettava una cosa del genere, chico...\n@c0@"
  ja: "@a@bサンチョ「やはり\n\tそういう者が　いましたか……。\n@c0@"
27:
