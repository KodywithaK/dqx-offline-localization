0:
  de: "@aBianca@bSein Gemüse ist großartig. Er liefert frisch ins Haus, und alles schmeckt immer ganz köstlich!\n@c0@"
  en: "@aBianca@bThat bloke's veggies taste amazin'. We have him deliver 'em to our place, and they're great!\n@c0@"
  es: "@aBianca@bLas verduras de ese tipo son estupendas. ¡Nos las trae a casa y están buenísimas!\n@c0@"
  fr: "@aBianca@bLes légumes de ce type ont un goût incroyable.\nNous les lui faisons livrer à la maison, et ils sont\ntout simplement délicieuxⓠ\n@c0@"
  it: "@aBianca@bQuel contadino coltiva delle verdure favolose!\nDovresti assaggiarle, sai? Sono una vera delizia.\n@c0@"
  ja: "@a@bビアンカ「さっきの人が　作った\n\t野菜は　とってもおいしいの。\n\tうちにも　届けてもらってるのよ。\n@c0@"
1:
  de: "@aNera@bIch liebe heiße Quellen. Vielleicht können wir nachher zusammen baden gehen?\n@c0@"
  en: "@aNera@bI love outdoor baths like this. Maybe we could have a soak together a little bit later?\n@c0@"
  es: "@aNera@bMe encantan los baños de exterior come este. ¿Te gustaría que nos diésemos un chapuzón insieme después?\n@c0@"
  fr: "@aNera@bJ'adore les bains extérieurs comme celui-ci.\nNous pourrions peut-être venir en profiter\ntous les deux un peu plus tardⓡ\n@c0@"
  it: "@aNera@bAdoro fare il bagno all'aperto!\nNon è che più tardi potremmo ritagliarci qualche minuto per rilassarci un po' in acqua?\n@c0@"
  ja: "@a@bフローラ「私　温泉が　大好きなの。\n\tあとで　いっしょに　入りましょう？\n@c0@"
2:
  de: "@aNera@bAch, darauf freue ich mich schon! Mit etwas Glück haben wir das Bad womöglich für uns allein.\n@c0@"
  en: "@aNera@bOoh, that'll be nice. With any luck, we might even have the place to ourselves.\n@c0@"
  es: "@aNera@bSerá veramente agradable. Si tenemos suerte, a lo mejor estamos solos.\n@c0@"
  fr: "@aNera@bOh, ça sera bien. Avec un peu de chance, nous aurons peut-être l'endroit pour nous tous seuls.\n@c0@"
  it: "@aNera@bChe bello!\nSe saremo fortunati, non ci sarà gente in giro, e avremo questo posto tutto per noi!\n@c0@"
  ja: "@a@bフローラ「楽しみですわ。\n\tふたりっきりで　入れると\n\tいいですわね。　うふふ。\n@c0@"
3:
  de: "@aNera@bOch! Bei mir brauchst du doch nicht schüchtern zu sein!\n@c0@"
  en: "@aNera@bOh! There's no need to be shy around me, you know.\n@c0@"
  es: "@aNera@bVa bene, aquí no hay de qué avergonzarse.\n@c0@"
  fr: "@aNera@bOhⓠ Pas la peine de faire ton timide avec moi...\n@c0@"
  it: "@aNera@bE perché mai?\nNon mi dirai mica che ti vergogni?\n@c0@"
  ja: "@a@bフローラ「まあ！　あなたが\n\tはずかしがると　私も　はずかしく\n\tなってしまいますわ。　ぽっ……。\n@c0@"
4:
  de: "@aBianca@bAuch wenn er sich noch so sehr beklagt ⓚⓛ was sein Sohn tut, ist wahrscheinlich eine große Hilfe.\n@c0@"
  en: "@aBianca@bThat bloke may moan, but what his son's doin' is probably a big help.\n@c0@"
  es: "@aBianca@bEl tipo se queja, pero lo que hace su hijo es de gran ayuda, ¿sabes?\n@c0@"
  fr: "@aBianca@bCe type a beau râler, ce que fait son fils est sûrement très utile.\n@c0@"
  it: "@aBianca@bNon capisco perché quell'uomo si lamenti tanto!\nSuo figlio ha deciso di intraprendere la via della fede, mica quella del crimine!\n@c0@"
  ja: "@a@bビアンカ「おじさんは\n\tああ言ってるけど　息子さんの\n\tおかげで　助かってるのよね。\n@c0@"
5:
  de: "@aNera@bOh! Ein Priester! Wenn ich nicht Rodrigo Onassetti zum Vater hätte, wäre ich womöglich auch Nonne geworden.\n@c0@"
  en: "@aNera@bOoh! A priest. I probably would've become a\r\nnun myself if I hadn't had Rodrigo Briscoletti\r\nfor a father.\n@c0@"
  es: "@aNera@b¡Oooh! Un sacerdote. Probablemente yo hubiese sido monja si Santino Rimaldi no hubiese sido il mio papino.\n@c0@"
  fr: "@aNera@bOohⓠ Un prêtre. Je serais moi-même sûrement devenue religieuse si je n'avais pas eu Rodrigo Oscuroni pour père.\n@c0@"
  it: "@aNera@bUn sacerdote?! Ah! Anche a me sarebbe piaciuto diventare suora, ma mio padre non avrebbe mai approvato la mia scelta...\n@c0@"
  ja: "@a@bフローラ「まあ！　神父さんに……。\n\t私も　ルドマンの娘でなかったら\n\tシスターになっていたかも知れないわ。\n@c0@"
6:
  de: "@aBianca@bHa ha ha! Es war mir gar nicht aufgefallen, dass du mit einem so breiten Grinsen im Gesicht herumläufst!\n@c0@"
  en: "@aBianca@bHa ha ha! I hadn't realised you was walkin'\naround with such a beamin' smile on your\nface, %a000090!\n@c0@"
  es: "@aBianca@b¡Ja, ja, ja! ¡No me había dado cuenta de esa cara de felicidad que tienes, %a000090!\n@c0@"
  fr: "@aBianca@bHa ha haⓠ Je n'avais pas réalisé que tu affichais\nun sourire aussi rayonnant, %a000090ⓠ\n@c0@"
  it: "@aBianca@bAh ah ah!\nNon mi ero accorta della tua espressione beata, %a000090!\n@c0@"
  ja: "@a@bビアンカ「%a000090ったら\n\tそんなに　ニヤニヤした顔で\n\t歩いてるの？　うふふ。\n@c0@"
7:
  de: "@aNera@bEs macht mich sehr glücklich zu sehen, dass du dich so auf unsere Hochzeit freust, Liebling.\n@c0@"
  en: "@aNera@bIt makes me really happy to see you so pleased that we're married, darling.\n@c0@"
  es: "@aNera@bMe siento molto felice de ver que estás contento de estar casado conmigo, caro mio.\n@c0@"
  fr: "@aNera@bJe suis vraiment contente de te voir si heureux\r\nde notre mariage, mon chéri.\n@c0@"
  it: "@aNera@bSono proprio felice di vedere che sei contento di avermi sposata, tesoro!\n@c0@"
  ja: "@a@bフローラ「%a000090さんが　私との結婚を\n\tそんなに　よろこんでくださって…\n\t私　しあわせですわ……。\n@c0@"
8:
  de: "@aBianca@bDiese Katze ist nicht direkt unser Haustier, aber es gefällt ihr anscheinend, sich bei uns herumzutreiben.\n@c0@"
  en: "@aBianca@bThat cat's not exactly a pet of ours, but it seems to like hangin' around our place all the time.\n@c0@"
  es: "@aBianca@bNo es que el gato sea nuestra mascota, pero se pasa el día por nuestra casa.\n@c0@"
  fr: "@aBianca@bCe chat n'est pas vraiment à nous, mais il a l'air d'aimer traîner autour de la maison.\n@c0@"
  it: "@aBianca@bQuel gatto non è mio, ma ama gironzolare intorno a casa nostra.\n@c0@"
  ja: "@a@bビアンカ「あのネコは　うちで\n\t飼ってるわけじゃないんだけど\n\tすっかり　居ついちゃってるの。\n@c0@"
9:
  de: "@aBianca@bDa fällt mir ein ⓚⓛ wie es wohl %a001210 ergangen ist?\n@c0@"
  en: "@aBianca@bCome to think of it, I wonder how %a001210's gettin' along.\n@c0@"
  es: "@aBianca@bAhora que lo pienso, me pregunto cómo le irá a %a001210, ¿sabes?\n@c0@"
  fr: "@aBianca@bMaintenant que j'y pense, je me demande comment va %a001210.\n@c0@"
  it: "@aBianca@bA proposito di felini!\nChissà come sta %a001210...\n@c0@"
  ja: "@a@bビアンカ「そういえば　%a001210ちゃんは\n\tどうしているかしら……。\n@c0@"
10:
  de: "@aNera@bOb das wohl Biancas Katze ist? Sie ist wirklich niedlich.\n@c0@"
  en: "@aNera@bI wonder if this cat belongs to Bianca.\r\nIt really is very sweet.\n@c0@"
  es: "@aNera@bMe pregunto si este gato es de Bianca.\r\nEs veramente carino.\n@c0@"
  fr: "@aNera@bJe me demande si ce chat appartient à Bianca.\r\nIl est vraiment mignon.\n@c0@"
  it: "@aNera@bQuel gatto è di Bianca?\nÈ un micino davvero adorabile!\n@c0@"
  ja: "@a@bフローラ「この子は　ビアンカさんの家の\n\tネコさんかしら？　あいきょうがあって\n\tかわいい　ネコさんですね。\n@c0@"
11:
  de: "@aBianca@bSo eine Frechheit! Also, ein bisschen höflicher könnten die Leute schon sein! Ich hab gute Lust, der Dame den Kopf zu waschen!\n@c0@"
  en: "@aBianca@bJust because it's a mixed bath, it dun't mean people shouldn't observe some kind of limits!\n@c0@"
  es: "@aBianca@b¡Que sea un baño mixto no significa que la gente no tenga que comportarse, digo yo!\n@c0@"
  fr: "@aBianca@bQuelle amabilitéⓠ\nMais bon, c'est vrai que ce n'est pas très agréable d'être dérangée quand on se relaxe.\n@c0@"
  it: "@aBianca@bA queste terme possono accedere sia donne sia uomini, quindi si dovrebbe tenere un comportamento rispettoso e corretto. Purtroppo, non tutti lo fanno...\n@c0@"
  ja: "@a@bビアンカ「い　いくら　混浴だからって\n\tわざわざ近づいて　話しかけないの！\n@c0@"
12:
  de: "@aNera@bJetzt hat es mir auch den Spaß verdorben. Komm, wir beeilen uns und gehen.\n@c0@"
  en: "@aNera@bNow I feel all embarrassed too. Let's hurry up and get away from here.\n@c0@"
  es: "@aNera@bAhora yo también me siento avergonzada. Presto, vámonos de aquí.\n@c0@"
  fr: "@aNera@bPourquoi vas-tu déranger cette jeune filleⓡ\nViens, allons plus loin.\n@c0@"
  it: "@aNera@bLasciala in pace, tesoro.\nForza, andiamo via...\n@c0@"
  ja: "@a@bフローラ「わ　私まで\n\tはずかしくなってきましたわ。\n\t早く出ましょう　あなた。\n@c0@"
13:
  de: "@aBianca@bAch, du hättest Lust auf ein Bad? Dafür haben wir leider keine Zeit. Die Pflicht ruft!\n@c0@"
  en: "@aBianca@bOh, I see. So that's the way it is then, eh?\n@c0@"
  es: "@aBianca@b¡Oh!, entiendo. Con que esas tenemos, ¿no?\n@c0@"
  fr: "@aBianca@bOh oui, quelle bonne idéeⓠ\n@c0@"
  it: "@aBianca@bSì, qui si sta troppo bene...\n@c0@"
  ja: "@a@bビアンカ「ふ～ん……\n\t%a000090は　そういう気持ちで\n\t入ってるんだ……。\n@c0@"
14:
  de: "@aNera@bAch! So ein schönes heißes Bad wäre jetzt wirklich nett. Wie dumm, dass wir für solche Dinge keine Zeit haben.\n@c0@"
  en: "@aNera@bOh! You do like your jokes, don't you, %a000090? He he he!\n@c0@"
  es: "@aNera@b¡Ah!, ¡Ma qué bromista eres, %a000090! ¡Ji, ji, ji!\n@c0@"
  fr: "@aNera@bOhⓠ Si tu penses qu'on a le temps, ce sera\navec plaisirⓠ\n@c0@"
  it: "@aNera@bÈ vero: questo posto è fantastico!\nMi fermerei volentieri per qualche settimana, ma ora non abbiamo tempo per prenderci una vacanza...\n@c0@"
  ja: "@a@bフローラ「まあ！　あなたったら\n\tじょうだんが　お上手ね。　うふふふ！\n@c0@"
15:
  de: "@aBianca@bWir sind hierher nach Utensiel gezogen, weil wir dachten, die Bäder würden meinem Vater guttun.\n@c0@"
  en: "@aBianca@bWe moved here to Stockenbarrel because we thought the bath water might do Dad some good.\n@c0@"
  es: "@aBianca@bVinimos a Clavis porque pensamos que los baños le vendrían bien a papá.\n@c0@"
  fr: "@aBianca@bNous avons déménagé ici, à Saint Éloi, car nous pensions que l'eau thermale ferait du bien à papa.\n@c0@"
  it: "@aBianca@bDecidemmo di trasferirci ad Aprianuam perché speravamo che le acque termali potessero giovare alla salute di mio padre...\n@c0@"
  ja: "@a@bビアンカ「ここの温泉が\n\tお父さんの身体に　いいと聞いて\n\tこの村に　引っ越してきたのよ。\n@c0@"
16:
  de: "@aBianca@bUnd so war es auch. Es geht ihm schon viel besser.\n@c0@"
  en: "@aBianca@bIt seems to have worked too. He's much better now than he was.\n@c0@"
  es: "@aBianca@bParece que ha dado resultado. Está mucho mejor que antes, ¿sabes?\n@c0@"
  fr: "@aBianca@bÇa semble avoir marché. Il va beaucoup mieux qu'avant, maintenant.\n@c0@"
  it: "@aBianca@bIn effetti, le cose sono andate proprio così.\nAdesso il mio caro papà sta molto meglio!\n@c0@"
  ja: "@a@bビアンカ「おかげで　お父さんの身体は\n\tだいぶ　良くなってきたみたい。\n@c0@"
17:
  de: "@aNera@bEs geht doch nichts über eine heiße Quelle. Und dass du auch noch dabei bist, macht das Ganze perfekt.\n@c0@"
  en: "@aNera@bYou can't beat the feeling of a nice outdoor bath. Being here with you only makes it all the better.\n@c0@"
  es: "@aNera@bLa sensazione de un baño al aire libre es lo mejor d'il mondo. Y estar aquí con te hace que sea aún mejor.\n@c0@"
  fr: "@aNera@bRien de tel que la douce sensation d'un bon bain en extérieur. Et que nous soyons seuls tous les deux rend la chose encore meilleure.\n@c0@"
  it: "@aNera@bAdoro fare il bagno alle terme!\nE stare in acqua insieme a te è ancora più bello!\n@c0@"
  ja: "@a@bフローラ「温泉って　本当に\n\t気持ちがいいわね。　あなたと\n\tいっしょだから　なおさらなのかしら。\n@c0@"
18:
  de: "@aBianca@bWie es wohl meinem Vater geht? Vielleicht sollten wir mal bei ihm vorbeischauen? Ich sollte mich wirklich etwas öfter bei ihm blicken lassen.\n@c0@"
  en: "@aBianca@bI wonder how Dad's doin'. Maybe we could drop in on him after, eh? I should try and show me face a bit more often really.\n@c0@"
  es: "@aBianca@bMe pregunto cómo le irá a mi padre. Podríamos pasarnos a verle luego, ¿eh? Debería intentar visitarlo un poco más a menudo, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe me demande comment va papa. On pourrait\npeut-être aller lui rendre une petite visite après, nonⓡ Je devrais vraiment aller le voir plus souvent.\n@c0@"
  it: "@aBianca@bChissà come sta mio padre...\nChe ne diresti di andare a fargli una visita più tardi? È da un po' che non lo vedo...\n@c0@"
  ja: "@a@bビアンカ「父さん　元気にしてるかしら。\n\tあとで　私の家に　寄ってくれる？\n\tときどきは　顔　見せないとね。\n@c0@"
19:
  de: "@aBianca@bWenn wir uns nach unseren Reisen einmal zur Ruhe setzen, wäre es doch hier nicht schlecht, oder? Natürlich nur, falls es dir hier auch gefällt.\n@c0@"
  en: "@aBianca@bOnce we're done with all our travellin', it might be quite nice to settle down here, eh? If you like the idea too, of course.\n@c0@"
  es: "@aBianca@bCuando acabemos de viajar, no estaría mal venirse a vivir aquí, ¿eh? Bueno, si a ti te parece bien, claro.\n@c0@"
  fr: "@aBianca@bUne fois qu'on aura fini de voyager, ça pourrait être bien de s'installer ici, nonⓡ Enfin, si cette idée\nte plaît aussi, évidemment.\n@c0@"
  it: "@aBianca@bQuando avremo finito di viaggiare, mi piacerebbe venire a vivere da queste parti...\nSempre che tu non abbia altri progetti, è ovvio.\n@c0@"
  ja: "@a@bビアンカ「旅が終わったら　ここで\n\t暮らすのも　いいんじゃないかな。\n\tもちろん　%a000090さえ　よければ。\n@c0@"
20:
  de: "@aNera@bMach dir keine Gedanken. Es macht mir nichts aus, wenn du nachschauen willst, wie es Bianca geht.\n@c0@"
  en: "@aNera@bDon't worry about me. I don't mind at all if you'd like to go and see how Bianca is doing.\n@c0@"
  es: "@aNera@bNon ti preoccupare per me. No me importa que vayas a ver cómo le va a Bianca.\n@c0@"
  fr: "@aNera@bNe t'inquiète pas. Ça ne m'ennuie pas du tout que tu aies envie d'aller voir comment va Bianca.\n@c0@"
  it: "@aNera@bNon mi arrabbio di certo, se vuoi andare a trovare Bianca.\n@c0@"
  ja: "@a@bフローラ「私のことは　お気になさらず\n\tビアンカさんの　様子を\n\t見てきてあげてくださいな。\n@c0@"
21:
  de: "@aNera@bSchließlich wart ihr doch Sandkastenfreunde, darum weiß ich, dass sie dir viel bedeutet.\n@c0@"
  en: "@aNera@bYou were childhood friends after all, so I know she means a lot to you.\n@c0@"
  es: "@aNera@bErais amigos de la infanciaⓓ sé que es importante per te.\n@c0@"
  fr: "@aNera@bAprès tout, vous êtes des amis d'enfance.\r\nJe sais qu'elle compte beaucoup pour toi.\n@c0@"
  it: "@aNera@bDopotutto siete amici da quando eravate piccoli, ed è normale che tu voglia passare a salutarla...\n@c0@"
  ja: "@a@bフローラ「幼なじみとは　ある意味\n\t特別な存在ですもの。\n\t気になさるお気持ちも　わかりますわ。\n@c0@"
22:
  de: "@aNera@bDieses Dorf ist so herrlich ruhig. Ich fühle mich einfach wohl hier!\n@c0@"
  en: "@aNera@bThis village is so lovely and quiet. Blissful!\n@c0@"
  es: "@aNera@bEste pueblo es tan bello y tranquilo... ¡Qué felicità!\n@c0@"
  fr: "@aNera@bCe village est si beau et si paisible.\nC'est un enchantementⓠ\n@c0@"
  it: "@aNera@bQuesto villaggio è così calmo e tranquillo...\nChe meraviglia!\n@c0@"
  ja: "@a@bフローラ「それにしても　ここは\n\t静かで　いいところですわね。\n@c0@"
23:
  de: "@aBianca@bDas ist doch der Mann, der den Brautschleier angefertigt hat, oder?\n@c0@"
  en: "@aBianca@bThe bloke here's the one who made the veil for the weddin', eh?\n@c0@"
  es: "@aBianca@bEste tipo de aquí es el que hizo el velo para la boda, ¿verdad?\n@c0@"
  fr: "@aBianca@bC'est ce type qui a fabriqué le voile pour\nle mariage, nonⓡ\n@c0@"
  it: "@aBianca@bDa queste parti c'è l'artigiano che ha realizzato il velo nuziale, non è così?\n@c0@"
  ja: "@a@bビアンカ「そういえば　結婚式の時の\n\tヴェールは　ここのおじさんが\n\t作ってくれたのよね。\n@c0@"
24:
  de: "@aBianca@bWar der nicht hübsch? Ich hatte ja keine Ahnung, dass er so schöne Sachen machen kann.\n@c0@"
  en: "@aBianca@bIt wasn't half pretty. I had no idea he could make somethin' so lovely.\n@c0@"
  es: "@aBianca@bEra realmente bonito. No tenía ni idea de que fuese capaz de hacer algo tan hermoso, ¿sabes?\n@c0@"
  fr: "@aBianca@bIl était vraiment superbe. Je n'imaginais pas\r\nune seconde qu'il pouvait créer quelque\r\nchose d'aussi beau.\n@c0@"
  it: "@aBianca@bQuell'uomo è un artista!\nNon pensavo che fosse possibile creare un velo così semplice e bello al tempo stesso!\n@c0@"
  ja: "@a@bビアンカ「きれいなヴェールだったわよね。\n\tおじさんが　あんなの　作れるなんて\n\tぜんぜん　知らなかったな。\n@c0@"
25:
  de: "@aNera@bDieser zauberhafte Schleier, den ich bei unserer Hochzeit getragen habe, stammt doch von hier, nicht?\n@c0@"
  en: "@aNera@bThat wonderful veil I wore at our wedding was made here, wasn't it?\n@c0@"
  es: "@aNera@bAquel maravilloso velo que llevé en la nostra boda se fabricó aquí, ¿verdad?\n@c0@"
  fr: "@aNera@bLe merveilleux voile que j'ai porté le jour de notre mariage a été fabriqué ici, n'est-ce pasⓡ\n@c0@"
  it: "@aNera@bIl meraviglioso velo nuziale che ho indossato il giorno del nostro matrimonio è stato fatto qui, non è vero?\n@c0@"
  ja: "@a@bフローラ「結婚式の時に　つけた\n\tあの　すばらしいヴェールは\n\tこちらで作っていただいたんでしょう？\n@c0@"
26:
  de: "@aNera@bDas ist lustig. Er macht gar nicht den Eindruck, als würde er so etwas übernehmen, und dabei hat er seine Arbeit so gut gemacht.\n@c0@"
  en: "@aNera@bIt's funny. He doesn't seem like the kind of fellow to take on work like that, and yet he made such a lovely job of it.\n@c0@"
  es: "@aNera@bEs curioso. No parece el tipo de persona capaz de hacer un trabajo como ese, ma le salió una pieza primorosa.\n@c0@"
  fr: "@aNera@bC'est drôle. Cet homme ne semble pas du tout\ndu genre à se charger de ce type de travail et pourtant, il a réalisé quelque chose de magnifique.\n@c0@"
  it: "@aNera@bPosso dire una cattiveria? La persona che l'ha creato non ha affatto l'aspetto di chi è in grado di realizzare un oggetto tanto bello...\n@c0@"
  ja: "@a@bフローラ「ふだんは　そういう仕事を\n\t受けないそうなのに　お父さまったら\n\t本当に　強引で……。\n@c0@"
27:
  de: "@aBianca@bAch ja. Ein paar Leute aus dem Dorf hatten sich vor einer Weile auch dieser Religion angeschlossen. Was wohl aus ihnen geworden ist?\n@c0@"
  en: "@aBianca@bOh yeah. I remember one of the villagers headin' off to join up with that religion a while back.\r\nI wonder how they're gettin' on.\n@c0@"
  es: "@aBianca@b¡Ah!, sí. Recuerdo que hace poco uno se largó a unirse a la religión esa.\r\nNo sé cómo le irá.\n@c0@"
  fr: "@aBianca@bOh oui. Je me souviens qu'un des villageois est parti rejoindre les adeptes de cette religion il y a un bon moment déjà. Je me demande où il en est.\n@c0@"
  it: "@aBianca@bSì, ne ho sentito parlare. Credo che anche un abitante del villaggio sia partito per unirsi a quella setta. Chissà come se la passa adesso...\n@c0@"
  ja: "@a@bビアンカ「そういえば　この村からも\n\t教団に入るって　旅立った人がいたわ。\n\t今ごろ　どうしてるかな？\n@c0@"
28:
  de: "@aNera@bAch du liebe Güte! Dieses Paradies des Weißen Königs hört sich viel zu großartig an, als dass es von bloßen Menschen errichtet werden könnte.\n@c0@"
  en: "@aNera@bDear me, this White King's Paradise sounds a bit grand for mere humans to be building.\n@c0@"
  es: "@aNera@bVeramente, ese Paraíso del Rey Blanco parece demasiado magnífico para ser obra de simples humanos.\n@c0@"
  fr: "@aNera@bPar la Déesse, ce Paradis du Roi blanc me semble bien grandiose pour être bâti par de simples humains.\n@c0@"
  it: "@aNera@bⓕIl Paradiso del Re Biancoⓖ?! Beh, buona fortuna a loro! Nessun uomo potrà mai costruire un paradiso in terra... Questo è un compito che spetta alla dea!\n@c0@"
  ja: "@a@bフローラ「そんな…　光の国とは\n\t人の手で　つくられるような\n\tものなのかしら……。\n@c0@"
29:
  de: "@aBianca@bEs ist ein bisschen lästig, an der Schänke vorbeilaufen zu müssen, wenn man ins Bad will.\n@c0@"
  en: "@aBianca@bIt's a bit of a pain havin' to traipse past the inn to get to the baths.\n@c0@"
  es: "@aBianca@bEs un peñazo tener que pasar por la posada para ir a los baños, ¿sabes?\n@c0@"
  fr: "@aBianca@bC'est un peu ennuyeux d'avoir à passer par l'auberge pour rejoindre les bains.\n@c0@"
  it: "@aBianca@bPer accedere ai bagni termali si deve necessariamente passare dalla locanda.\n@c0@"
  ja: "@a@bビアンカ「温泉に入るのに　いちいち\n\t宿屋を通らないと　いけないのが\n\tちょっと　めんどうだけど……\n@c0@"
30:
  de: "@aBianca@bAber die Inhaber der Schänke kümmern sich um die Bäder, also kann man eigentlich nicht meckern.\n@c0@"
  en: "@aBianca@bBut they're the ones takin' care of them, so I s'pose it's fair enough.\n@c0@"
  es: "@aBianca@bPero ellos son los que lo gestionan, así que qué se le va a hacer.\n@c0@"
  fr: "@aBianca@bMais comme ce sont eux qui les entretiennent,\r\nc'est un peu normal.\n@c0@"
  it: "@aBianca@bSecondo me, dovrebbero creare un ingresso indipendente...\n@c0@"
  ja: "@a@bビアンカ「温泉の管理をしてるのが\n\t宿屋さんだから　しかたないよね。\n@c0@"
31:
  de: "@aNera@bWas für eine wunderhübsche Schänke, mit den heißen Quellen direkt nebenan! Hier kann man wirklich herrlich entspannen.\n@c0@"
  en: "@aNera@bWhat a lovely inn this is, with the baths nearby and everything. It's certainly nice and relaxing.\n@c0@"
  es: "@aNera@bQué posada más linda, junto a los baños. Es veramente agradable y relajante.\n@c0@"
  fr: "@aNera@bCette auberge est vraiment adorable, avec ses\r\nbains tout proches. C'est vraiment un endroit\r\ncalme et apaisant.\n@c0@"
  it: "@aNera@bQuesta locanda è proprio carina...\nE le terme sono appena a un passo!\nMi piacerebbe trascorrerci una bella vacanza...\n@c0@"
  ja: "@a@bフローラ「温泉もあるし　いい宿ですわね。\n\tなんだか　落ちつきますわ。\n@c0@"
32:
  de: "@aBianca@bTagsüber in die Schänke zu gehen ist irgendwie was Besonderes. Da scheint es immer ruhiger zu sein als überall sonst, findest du nicht?\n@c0@"
  en: "@aBianca@bThere's somethin' about goin' into a pub durin' the day. It always seems quieter than everywhere else, dun't you think?\n@c0@"
  es: "@aBianca@bEs raro entrar de día en una taberna. Hay un silencio como muy especial, ¿no crees?\n@c0@"
  fr: "@aBianca@bC'est toujours un peu particulier d'aller dans une taverne en journée.\n㈡\nÇa semble beaucoup plus tranquille que n'importe\nquel autre endroit, tu ne trouves pasⓡ\n@c0@"
  it: "@aBianca@bBeh, certo... Di giorno la gente lavora o fa il bagno alle terme. Anche se la taverna fosse aperta, dubito che avrebbe molti clienti...\n@c0@"
  ja: "@a@bビアンカ「昼間の　酒場って\n\t他の場所より　ずっと静かに\n\t感じない？　ふしぎよね。\n@c0@"
33:
  de: "@aNera@bIch bin überrascht, in einem so kleinen Dorf eine Schänke zu finden. Sicher ist sie ideal, um nach der Arbeit hier auszuspannen.\n@c0@"
  en: "@aNera@bI'm surprised to find a pub in a small village like\r\nthis. I suppose it's a good place for people to relax after work.\n@c0@"
  es: "@aNera@bMe sorprende que haya una taberna en una aldea tan piccola como esta. Debe de ser un sitio ideal para que la gente descanse después del lavoro.\n@c0@"
  fr: "@aNera@bJe suis surprise de trouver une taverne dans un petit village comme ça. J'imagine que c'est un endroit idéal pour venir se détendre après le travail.\n@c0@"
  it: "@aNera@bC'è anche una taverna!\nAh, a questo villaggio non manca proprio nulla!\nBeh, più o meno...\n@c0@"
  ja: "@a@bフローラ「こんな小さな村にも\n\t酒場が　あるのね。\n\t仕事のつかれを　いやすためかしら。\n@c0@"
34:
  de: "@aBianca@bDas Paradies des Weißen Königs? Das hört sich merkwürdig an. Bei solchem Gerede läuft es mir immer kalt den Rücken runter.\n@c0@"
  en: "@aBianca@bThe White King's Paradise? That sounds a bit serious. This kind of talk really gives me the willies for some reason.\n@c0@"
  es: "@aBianca@b¿El Paraíso del Rey Blanco? Suena grave. No sé por qué, pero estas cosas me dan susto, ¿sabes?\n@c0@"
  fr: "@aBianca@bLe Paradis du Roi blancⓡ Ça a l'air sérieux.\nCe genre de discours me donne toujours la\nchair de poule sans que je sache pourquoi.\n@c0@"
  it: "@aBianca@bⓕIl Paradiso del Re Biancoⓖ?!\nMa senti che razza di nome! Non so perché, ma solo a pronunciarlo mi vengono i brividi...\n@c0@"
  ja: "@a@bビアンカ「光の国なんて……。\n\tこういう話を聞くと　なんだか\n\tこわくなるの。　どうしてかしら…？\n@c0@"
35:
  de: "@aNera@bDieses Paradies des Weißen Königs muss ja etwas ganz Besonderes sein, wenn die Leute dafür ihre Familien und Freunde verlassen.\n@c0@"
  en: "@aNera@bThis White King's Paradise must be rather special\r\nfor people to abandon their family and friends to\r\ngo there.\n@c0@"
  es: "@aNera@bEse Paraíso del Rey Blanco debe de ser veramente speciale si para conocerlo las personas dejan a su famiglia y amigos.\n@c0@"
  fr: "@aNera@bLe Paradis du Roi blanc doit être vraiment spécial pour que des gens abandonnent leur famille et\r\nleurs amis afin de s'y rendre.\n@c0@"
  it: "@aNera@bCerto che questo Paradiso del Re Bianco dev'essere un posto davvero speciale, se tanta gente ha deciso di mollare amici e parenti per trasferirsi lì...\n@c0@"
  ja: "@a@bフローラ「光の国とは　友だちや\n\t家族をすててまで　行く価値の\n\tある場所なのでしょうか……。\n@c0@"
36:
  de: "@aBianca@bIch weiß, wir müssen uns bald wieder auf den Weg machen, aber ruh dich hier erst ein wenig aus, ja?\n@c0@"
  en: "@aBianca@bI know it'll be time for the off again soon, but have a rest here first, eh?\n@c0@"
  es: "@aBianca@bYa sé que pronto tendremos que seguir camino, pero vamos a descansar un poco aquí, ¿eh?\n@c0@"
  fr: "@aBianca@bJe sais que ce sera bientôt le moment de repartir, mais reposons-nous d'abord un peu ici, d'accordⓡ\n@c0@"
  it: "@aBianca@bChe ne diresti di riposare un po' qui, visto che presto dovremo rimetterci in viaggio?\n@c0@"
  ja: "@a@bビアンカ「すぐまた　旅立つでしょうけど\n\t%a000090の家でもあるんだから\n\tまあ　ゆっくりしていってよ。\n@c0@"
37:
  de: "@aNera@bIch fühle mich hier ein bisschen fehl am Platz, wenn Bianca nicht da ist.\n@c0@"
  en: "@aNera@bI feel a bit awkward getting in the way here when Bianca's not around.\n@c0@"
  es: "@aNera@bVeramente, me siento algo incómoda por aquí mientras Bianca no está.\n@c0@"
  fr: "@aNera@bÇa me fait un peu drôle d'entrer ici quand Bianca\r\nn'y est pas.\n@c0@"
  it: "@aNera@bDevo confessarti una cosa...\nNon mi sento del tutto a mio agio qui quando non c'è Bianca. Mi sembra di arrecare disturbo...\n@c0@"
  ja: "@a@bフローラ「ビアンカさんの　お留守に\n\tおじゃまするなんて　なんだか\n\t悪い気がしますわ。\n@c0@"
38:
  de: "@aBianca@bWenn wir heute Nacht hier bleiben, lass uns doch in der Herberge übernachten, ja?\n@c0@"
  en: "@aBianca@bIf we're stayin' here tonight, let's get a room at the inn, eh?\n@c0@"
  es: "@aBianca@bSi nos vamos a quedar esta noche, vamos a la posada, ¿eh?\n@c0@"
  fr: "@aBianca@bSi nous restons ici pour la nuit, prenons une chambre à l'auberge, d'accordⓡ\n@c0@"
  it: "@aBianca@bSe vogliamo trascorrere la notte insieme qui al villaggio, preferirei prendere una stanza alla locanda.\n@c0@"
  ja: "@a@bビアンカ「今夜　ここで泊まるなら\n\t宿に部屋をとりましょうよ。\n@c0@"
39:
  de: "@aBianca@bEs käme mir komisch vor, im Haus meines Vaters ein Zimmer mit dir zu teilen.\n@c0@"
  en: "@aBianca@bI'd feel all funny sharin' a room with you at\r\nDad's place.\n@c0@"
  es: "@aBianca@bMe encontraría incómoda compartiendo habitación contigo en casa de mi padre, ¿me entiendes?\n@c0@"
  fr: "@aBianca@bÇa me ferait bizarre de partager une chambre avec toi chez mon père.\n@c0@"
  it: "@aBianca@bSai, non mi sentirei a mio agio a dormire con te a casa di mio padre...\n@c0@"
  ja: "@a@bビアンカ「だって　お父さんのそばで\n\t%a000090と　ねるのは\n\tちょっと　テレくさいんだもん。\n@c0@"
40:
  de: "@aNera@bBleiben wir heute Abend im Dorf?\n@c0@"
  en: "@aNera@bAre we staying here in the village tonight?\n@c0@"
  es: "@aNera@b¿Vamos a quedarnos questa notte en el pueblo?\n@c0@"
  fr: "@aNera@bAllons-nous rester ici au village, cette nuitⓡ\n@c0@"
  it: "@aNera@bHai intenzione di trascorrere la notte al villaggio?\n@c0@"
  ja: "@a@bフローラ「今夜は　この村で\n\t泊まるのですか？\n@c0@"
41:
  de: "@aNera@bIch glaube, es käme mir etwas komisch vor, das Zimmer mit dir zu teilen, wenn Bianca direkt nebenan schläft.\n@c0@"
  en: "@aNera@bI think I'd feel a bit strange sleeping by your side with Bianca so nearby.\n@c0@"
  es: "@aNera@bVeramente, me sentiría extraña durmiendo a tu lado con Bianca cerca.\n@c0@"
  fr: "@aNera@bJe crois que ça me ferait drôle de dormir près de\r\ntoi alors que Bianca est juste à côté.\n@c0@"
  it: "@aNera@bEcco, mi sentirei un po' a disagio a dormire accanto a te sapendo che Bianca è così vicina...\n@c0@"
  ja: "@a@bフローラ「ビアンカさんの　近くで\n\tあなたと　眠るなんて　なんだか\n\tふしぎな感じが　しますわね。\n@c0@"
42:
  de: "@aBianca@bHa ha ha! Es war mir gar nicht aufgefallen, dass du mit einem so breiten Grinsen im Gesicht herumläufst!\n@c0@"
  en: "@aBianca@bHa ha ha! I hadn't realised you was walkin'\naround with such a beamin' smile on your\nface, %a000090!\n@c0@"
  es: "@aBianca@b¡Ja, ja, ja! ¡No me había dado cuenta de esa cara de felicidad que tienes, %a000090!\n@c0@"
  fr: "@aBianca@bHa ha haⓠ Je n'avais pas réalisé que tu affichais\nun sourire aussi rayonnant, %a000090ⓠ\n@c0@"
  it: "@aBianca@bAh ah ah!\nNon mi ero accorta della tua espressione beata, %a000090!\n@c0@"
  ja: "@a@bビアンカ「%a000090ったら\n\tそんなに　ニヤニヤした顔で\n\t歩いてるの？　うふふ。\n@c0@"
43:
  de: "@aNera@bEs macht mich sehr glücklich zu sehen, dass du dich so auf unsere Hochzeit freust, Liebling.\n@c0@"
  en: "@aNera@bIt makes me really happy to see you so pleased that we're married, darling.\n@c0@"
  es: "@aNera@bMe siento molto felice de ver que estás contento de estar casado conmigo, caro mio.\n@c0@"
  fr: "@aNera@bJe suis vraiment contente de te voir si heureux\r\nde notre mariage, mon chéri.\n@c0@"
  it: "@aNera@bSono proprio felice di vedere che sei contento di avermi sposata, tesoro!\n@c0@"
  ja: "@a@bフローラ「%a000090さんが　私との結婚を\n\tそんなに　よろこんでくださって…\n\t私　しあわせですわ……。\n@c0@"
44:
  de: "@aBianca@bWenn er nicht hier wäre, wären wir jetzt ganz unter uns, nicht?\n@c0@"
  en: "@aBianca@bIf only he wasn't around, we'd have the place to ourselves, eh?\n@c0@"
  es: "@aBianca@bSi él no estuviese, tendríamos los baños para nosotros, ¿eh?\n@c0@"
  fr: "@aBianca@bSi seulement il n'était pas là... nous aurions les bains pour nous tous seuls.\n@c0@"
  it: "@aBianca@bUffà!\nSe non ci fosse quel tizio, potremmo goderci un bel bagno da soli, tu e io...\n@c0@"
  ja: "@a@bビアンカ「あの人が　いなかったら\n\tふたりっきりで　入れたのに……\n\tざんねんだわ。\n@c0@"
45:
  de: "@aNera@bAlso eigentlich ist er hier ja nicht allein. Und doch findet er nichts dabei, sich so den Rücken zu waschen.\n@c0@"
  en: "@aNera@bThere are actually quite a few people about, and yet he doesn't seem to feel at all self-conscious about washing his back like that.\n@c0@"
  es: "@aNera@bAunque hay bastante gente por aquí, no parece que le importe lavarse la espalda così.\n@c0@"
  fr: "@aNera@bIl y a quand même quelques personnes dans le coin, mais ça n'a pas l'air de le déranger de se frotter le dos comme ça en public.\n@c0@"
  it: "@aNera@bSi sta proprio divertendo, eh?\n@c0@"
  ja: "@a@bフローラ「まわりが　さわがしいですけど\n\t気にせずに　お背中　流しますわね。\n@c0@"
46:
  de: "@aNera@bWenn wir allein wären, könnte ich dir auch den Rücken waschen. Du hast so einen schönen muskulären Rücken!\n@c0@"
  en: "@aNera@bI could wash your back if only we had the place to ourselves. It's so nice and muscular!\n@c0@"
  es: "@aNera@bSi estuviésemos solos aquí yo también te podría lavar la tua espalda. ¡Me gusta tanto, con esos músculos!\n@c0@"
  fr: "@aNera@bMoi aussi je pourrais te frotter le dos si nous étions seuls ici. Il est tellement muscléⓠ Hi hi hiⓠ\n@c0@"
  it: "@aNera@bAh, quanto vorrei fare un bel bagno insieme a te, tesoro mio...\nTu e io, da soli...\n@c0@"
  ja: "@a@bフローラ「あなたの背中って　ひろいわ。\n\tぽっ……。\n@c0@"
47:
  de: "@aBianca@bMeine Güte! Für Königshäuser hat er Schleier angefertigt? Und ausgerechnet für deinen Vater!\n@c0@"
  en: "@aBianca@bBlimey! He's even made veils for royalty, then?\r\nAnd for your dad, of all people!\n@c0@"
  es: "@aBianca@b¡Cuernos! ¡Si hasta ha cosido velos para la realeza!\r\n¡Y para tu padre, qué casualidad!\n@c0@"
  fr: "@aBianca@bÇa alorsⓠ Il a même fait des voiles pour une famille royale, alorsⓡ Et c'était pour ton père, en plusⓠ \n@c0@"
  it: "@aBianca@bHai sentito?!\nHa creato anche il velo nuziale usato per le nozze dei tuoi genitori!\n@c0@"
  ja: "@a@bビアンカ「国王さまに　たのまれて\n\t作ったことも　あったなんて……。\n\tそれにしても　パパス王子って！？\n@c0@"
48:
  de: "@aNera@bDer Schleier war wirklich sehr kunstvoll gefertigt. Manchmal krame ich ihn auch jetzt noch hervor und freue mich daran.\n@c0@"
  en: "@aNera@bIt really was an exquisite veil. I sometimes fetch it out and gaze at it in wonder even now.\n@c0@"
  es: "@aNera@bEra un velo molto delicato. Aún ahora lo saco a veces para contemplarlo extasiada.\n@c0@"
  fr: "@aNera@bCe voile était vraiment ravissant. Même maintenant,\r\nil m'arrive encore d'aller le chercher pour l'admirer.\n@c0@"
  it: "@aNera@bIl velo creato da quest'artigiano è davvero un capolavoro. Ancora oggi lo prendo, lo guardo e mi stupisco di quanto sia splendido...\n@c0@"
  ja: "@a@bフローラ「本当に　すばらしい\n\tヴェールでしたわ。　私　今でも\n\tたまに取り出して　見ているのよ。\n@c0@"
49:
  de: "@aBianca@bHa ha! Jetzt willst du schon wieder mit den Leuten reden, während sie schlafen! Du bist manchmal wirklich lustig, %a000090.\n@c0@"
  en: "@aBianca@bHa ha! There you go again, tryin' to speak to folk when they're sleepin'! You're a funny one sometimes, %a000090.\n@c0@"
  es: "@aBianca@b¡Ja, ja! ¡Que no puedes hablar con la gente cuando está durmiendo! A veces eres muy gracioso, %a000090.\n@c0@"
  fr: "@aBianca@bHa haⓠ Et c'est reparti. Tu essaies encore de parler aux gens pendant qu'ils dormentⓠ Tu es un drôle de larron, parfois, %a000090.\n@c0@"
  it: "@aBianca@bDimmi una cosa, %a000090...\nPerché ce l'hai con le persone che dormono?\nPerché non le lasci riposare in pace, eh?\n@c0@"
  ja: "@a@bビアンカ「うふふ。　あいかわらず\n\t寝てる人にも　話しかけるんだもん。\n\t%a000090ったら　変わってないね。\n@c0@"
50:
  de: "@aNera@bEr schläft tief und fest. Es muss eine schwere Arbeit sein, tagein, tagaus dafür zu sorgen, dass die Dinge wachsen.\n@c0@"
  en: "@aNera@bHe really is fast asleep. It must be tiring work trying to grow things day in day out.\n@c0@"
  es: "@aNera@bEstá en un sonno profondo. Debe de cansar trabajar cultivando cosas día sí y día también.\n@c0@"
  fr: "@aNera@bIl dort à poings fermés. Ça doit vraiment\r\nêtre un métier fatigant d'essayer de faire\r\npousser des choses en permanence.\n@c0@"
  it: "@aNera@bSta dormendo della grossa.\nCredo che abbia avuto una giornata molto faticosa...\n@c0@"
  ja: "@a@bフローラ「あの方　ぐっすり　ですわ。\n\t作物を育てるって\n\tたいへん　なんでしょうね。\n@c0@"
51:
  de: "@aBianca@bDiese Frau bleibt bis tief in die Nacht auf, bis ihr Mann nach Hause kommt.\n@c0@"
  en: "@aBianca@bThat woman always stays up into the night until her old man comes home.\n@c0@"
  es: "@aBianca@bEsa mujer siempre se queda despierta hasta que su marido vuelve a casa.\n@c0@"
  fr: "@aBianca@bLa nuit, cette femme ne va jamais se coucher avant que son mari soit revenu.\n@c0@"
  it: "@aBianca@bQuella donna resta sempre sveglia fino a tardi, in attesa che suo marito rientri a casa.\n@c0@"
  ja: "@a@bビアンカ「あのおばさん\n\tダンナさんが　帰ってくるまで\n\tいつも　起きて待ってるのよ。\n@c0@"
52:
  de: "@aBianca@bSie macht einen richtigen Aufstand und nörgelt, wenn er spät kommt, aber ich glaube, sie macht sich einfach nur Sorgen, wenn er nicht da ist.\n@c0@"
  en: "@aBianca@bShe makes all this fuss and moans about him\r\nbein' late, but I think she's just anxious\r\nwhen he's not around.\n@c0@"
  es: "@aBianca@bNo deja de protestar por la hora a la que llega, pero creo que se inquieta cuando él no está, ¿sabes?\n@c0@"
  fr: "@aBianca@bElle fait toujours des histoires et se plaint qu'il rentre tard, mais je crois qu'elle est seulement inquiète quand il n'est pas là.\n@c0@"
  it: "@aBianca@bNon fa altro che lamentarsi perché il suo uomo trascorre tutte le serate fuori. Secondo me, ha ragione: al posto suo, gli avrei già dato il benservito!\n@c0@"
  ja: "@a@bビアンカ「なんだかんだ　言っても\n\tダンナさんが　心配なのね。\n@c0@"
53:
  de: "@aNera@bIch finde es schön, dass sie immer aufbleibt, um auf ihren Mann zu warten.\n@c0@"
  en: "@aNera@bI think it's nice that she stays awake and waits for her husband to come home like that.\n@c0@"
  es: "@aNera@bCreo que es bonito que se quede despierta a esperar a que il suo sposo llegue a casa.\n@c0@"
  fr: "@aNera@bJe trouve que c'est gentil de sa part de rester éveillée et d'attendre comme ça que son mari\r\nrentre à la maison.\n@c0@"
  it: "@aNera@bChe romantica, quella signora! Non riesce ad addormentarsi senza suo marito accanto!\nLa capisco, sai? Credo che nemmeno io ce la farei...\n@c0@"
  ja: "@a@bフローラ「私も　あの方のように\n\t夫より　あとに眠る\n\t妻でありたいですわ。\n@c0@"
54:
  de: "@aBianca@bDiese Mädchen haben ihre Pause offenbar bitter nötig.\n@c0@"
  en: "@aBianca@bThose girls certainly seem to be gettin' in a\r\ndecent rest.\n@c0@"
  es: "@aBianca@bParece que esas chicas están descansando de lo lindo, ¿sabes?\n@c0@"
  fr: "@aBianca@bCette fille a l'air de profiter d'un sommeil vraiment réparateur.\n@c0@"
  it: "@aBianca@bLe ragazze stanno riposando...\n@c0@"
  ja: "@a@bビアンカ「あの女の子たち\n\tずいぶん　ゆっくり\n\t宿泊していってくれているのね。\n@c0@"
55:
  de: "@aNera@bDu solltest die Leute nicht beim Schlafen stören, weißt du, %a000090. Lassen wir sie friedlich schlummern.\n@c0@"
  en: "@aNera@bYou shouldn't really be bothering people when they're asleep, you know, %a000090. I think we should leave them alone.\n@c0@"
  es: "@aNera@bMe parece que no deberías estar mirando cómo duerme la gente, %a000090. ¿No crees que es raro?\n@c0@"
  fr: "@aNera@bTu sais, tu ne devrais pas déranger les gens pendant leur sommeil, %a000090.\nAllez, il vaut mieux la laisser tranquille.\n@c0@"
  it: "@aNera@bMa insomma, %a000090!\nQuando imparerai che le persone che dormono non vanno disturbate, eh?!\n@c0@"
  ja: "@a@bフローラ「もう　%a000090さんったら\n\tねている女の子を　のぞくなんて…\n\tあまりシュミが　良くないですわ。\n@c0@"
56:
  de: "@aBianca@bFrüher suchten immer nur ältere Leute die heißen Quellen auf, aber in letzter Zeit scheinen sie bei den jungen Mädchen immer beliebter zu werden.\n@c0@"
  en: "@aBianca@bThere only ever used to be old folk comin' to the baths here, but it seems like they're popular with all the young girls just lately.\n@c0@"
  es: "@aBianca@bAntes solo venían viejos a estos baños, pero parece que últimamente se ha puesto de moda entre las chicas, ¿sabes?\n@c0@"
  fr: "@aBianca@bAvant, il n'y avait que des gens âgés qui venaient aux bains, mais on dirait que les jeunes filles les apprécient tout autant, désormais.\n@c0@"
  it: "@aBianca@bUn tempo le terme erano frequentate principalmente da persone che avevano superato gli ⓕantaⓖ, ma adesso ci vengono anche molte ragazze.\n@c0@"
  ja: "@a@bビアンカ「前は　温泉というと\n\tお年寄りばかりだったのに…\n\t近頃は　女の子に　大人気らしいわ。\n@c0@"
57:
  de: "@aNera@bWir dürfen ihren Schönheitsschlaf nicht stören, Liebling.\n@c0@"
  en: "@aNera@bWe mustn't disturb their beauty sleep, darling.\n@c0@"
  es: "@aNera@bNo debemos perturbar il suo sogno de belleza, caro mio.\n@c0@"
  fr: "@aNera@bNous devons les laisser se reposer, mon chéri.\n@c0@"
  it: "@aNera@bCaro, è meglio che non disturbiamo il loro ⓕsonno di bellezzaⓖ...\n@c0@"
  ja: "@a@bフローラ「ねえ　しずかに\n\tねかせてあげましょうよ。\n@c0@"
58:
  de: "@aBianca@bEr hat wohl wirklich eine Schwäche für mich. Es tut mir fast ein bisschen leid, dass ich seine Gefühle nicht erwidern konnte.\n@c0@"
  en: "@aBianca@bHe really seems to have a thing for me, that one. Shame I couldn't ever repay the favour.\n@c0@"
  es: "@aBianca@bParece que a ese le hago un poco de tilín. Qué pena no haberle podido devolver el favor, ¿sabes?\n@c0@"
  fr: "@aBianca@bCelui-là, on dirait qu'il en pince vraiment pour moi. C'est malheureux, mais je ne pourrai jamais lui rendre la pareille.\n@c0@"
  it: "@aBianca@bEh eh eh! Quel tipo ha sempre avuto un debole per me! A me, però, lui non è mai interessato, se non come amico...\n@c0@"
  ja: "@a@bビアンカ「本当は　あの人の気持ちに\n\t気づいてたの。　でも\n\tどうしても　こたえられなかった……。\n@c0@"
59:
  de: "@aBianca@bDenn siehst du, ich hab noch nie einen anderen angesehen als dich, %a000090. Du warst für mich immer der Einzige und wirst es auch bleiben.\n@c0@"
  en: "@aBianca@bYou're the only one for me, see, %a000090. Always have bin, always will be.\n@c0@"
  es: "@aBianca@bTú eres el único para mí, %a000090. Ahora y siempre, ¿me entiendes?\n@c0@"
  fr: "@aBianca@bPour moi, tu es le seul qui compte, %a000090.\nÇa a toujours été et ça sera toujours comme ça.\n@c0@"
  it: "@aBianca@bIo ho sempre avuto te nel mio cuore, %a000090.\nVoglio solo te, amore mio...\n@c0@"
  ja: "@a@bビアンカ「だって　私は……\n\tずっと　%a000090が　好きだったから。\n@c0@"
60:
  de: "@aNera@bIch hoffe sehr, dass auch Bianca glücklich wird.\n@c0@"
  en: "@aNera@bI do hope Bianca will live happily ever after too.\n@c0@"
  es: "@aNera@bEspero que Bianca también sea felice per sempre.\n@c0@"
  fr: "@aNera@bJ'espère que Bianca aura une vie heureuse,\r\nelle aussi.\n@c0@"
  it: "@aNera@bMa sta sognando Bianca...?\nEh eh eh!\n@c0@"
  ja: "@a@bフローラ「私　ビアンカさんには\n\t幸せになって　ほしいですわ……。\n@c0@"
61:
  de: "@aBianca@bAch ja. Vor einer Weile haben sich ein paar Leute aus dem Dorf dieser Glaubensgemeinschaft angeschlossen. Was wohl aus ihnen geworden ist?\n@c0@"
  en: "@aBianca@bOh yeah. I remember one of the villagers headin' off to join up with that religion a while back. I hope they're okay.\n@c0@"
  es: "@aBianca@b¡Ah!, sí. Recuerdo que hace poco uno se largó a unirse a la religión esa. Espero que le vaya bien, ¿sabes?\n@c0@"
  fr: "@aBianca@bOh oui. Je me souviens qu'un des villageois est parti rejoindre les adeptes de cette religion il y a un bon moment déjà. J'espère qu'il va bien.\n@c0@"
  it: "@aBianca@bSì, ne ho sentito parlare. Credo che anche un abitante del villaggio sia partito per unirsi a quella setta. Chissà come se la passa adesso...\n@c0@"
  ja: "@a@bビアンカ「この村からも　教団に入るって\n\t旅立った人がいるのに……。\n\tその人　大丈夫かしら？\n@c0@"
62:
  de: "@aNera@bWer wohl ein solches Gerücht in die Welt gesetzt hat? Und warum eigentlich?\n@c0@"
  en: "@aNera@bI wonder who started a rumour like that.\r\nAnd, more importantly, why.\n@c0@"
  es: "@aNera@bMe pregunto quién iniciaría un rumor così.\r\nY, aún más importante: ¿per qué?\n@c0@"
  fr: "@aNera@bJe me demande qui a fait courir une rumeur pareille. Et surtout, pourquoiⓡ\n@c0@"
  it: "@aNera@bMa chi è che avrà messo in giro una voce del genere?\nE per quale motivo?\n@c0@"
  ja: "@a@bフローラ「じゃあ　いったい　誰が\n\tなんのために　そんな話を\n\t流しているのかしら……。\n@c0@"
63:
  de: "@aBianca@bDu hast doch unser Haus gesehen, nicht? Dieser Kerl hatte es im Handumdrehen fertig!\n@c0@"
  en: "@aBianca@bYou've seen my house, right? That bloke had it up in no time!\n@c0@"
  es: "@aBianca@bHas visto mi casa, ¿no? ¡Ese tipo la tuvo lista en un pispás!\n@c0@"
  fr: "@aBianca@bTu as vu ma maison, n'est-ce pasⓡ Ce type l'a construite en un rien de tempsⓠ\n@c0@"
  it: "@aBianca@bHai visto quant'è carina la mia casa?\nBeh, quel tipo e un suo amico l'hanno tirata su in brevissimo tempo!\n@c0@"
  ja: "@a@bビアンカ「私の家　知ってるでしょ？\n\tあの人　あんなに　りっぱな家を\n\tあっという間に　建ててくれたのよ！\n@c0@"
64:
  de: "@aBianca@bDas Handwerkern ist schöner, wenn es jemand anders für einen macht!\n@c0@"
  en: "@aBianca@bSuddenly carpenterin' is more fun than\r\nit sounds!\n@c0@"
  es: "@aBianca@b¡Al final la carpintería va a ser más divertida de lo que parece!\n@c0@"
  fr: "@aBianca@bIl m'a épatéeⓠ\n@c0@"
  it: "@aBianca@bPare che abbiano usato delle tecniche innovative...\nBoh, io non ci capisco nulla. So solo che la casa è solida e bella!\n@c0@"
  ja: "@a@bビアンカ「きっと　急に\n\t大工仕事が　おもしろくなったのね！\n@c0@"
65:
  de: "@aNera@bOh! Das muss dann wohl ein weiterer Verehrer Biancas sein.\n@c0@"
  en: "@aNera@bOh! Another admirer of Bianca's, by the sounds of it.\n@c0@"
  es: "@aNera@b¡Ah! Parece que se trata de otro ammiratore de Bianca.\n@c0@"
  fr: "@aNera@bOhⓠ Un autre admirateur de Bianca, on dirait.\n@c0@"
  it: "@aNera@bSbaglio o anche quel tipo è un ammiratore di Bianca?\nQuella ragazza è una vera rubacuori, eh?\n@c0@"
  ja: "@a@bフローラ「まあ！\n\tじゃあ　あの方　ビアンカさんを……。\n@c0@"
66:
  de: "@aBianca@bMan kann es seiner Frau wohl kaum übelnehmen, wenn sie böse wird. Nach zehn Gläsern ist mit dem sicher nicht mehr viel anzufangen!\n@c0@"
  en: "@aBianca@bYou can hardly blame his missus for bein' angry. He'll be no good to anyone after ten glasses!\n@c0@"
  es: "@aBianca@bNo es de extrañar que su señora esté enfadadísima. ¡Después de diez vasos está para el arrastre!\n@c0@"
  fr: "@aBianca@bDifficile d'en vouloir à sa femme d'être en colère.\nIl ne sera plus bon à rien après dix verresⓠ\n@c0@"
  it: "@aBianca@bIo, invece, non vorrei stare nei panni di sua moglie!\nVoglio dire, dev'essere davvero orribile essere sposata a un uomo che rincasa tanto tardi di sera!\n@c0@"
  ja: "@a@bビアンカ「奥さんが　怒るのも当然よ。\n\t１０ぱいも飲んだら\n\t身体　こわしちゃうわ。\n@c0@"
67:
  de: "@aNera@bHoffentlich kommt es nie dazu, dass ich dir so eine Gardinenpredigt halte, wie sie ihr Mann zu erwarten hat, wenn er nach Hause kommt.\n@c0@"
  en: "@aNera@bI do hope I never have to shout at you like she's going to shout at her hubbie when he gets home.\n@c0@"
  es: "@aNera@bEspero no tener que regañarte nunca come lo va a hacer ella cuando il suo maridito arrivi a casa.\n@c0@"
  fr: "@aNera@bJ'espère ne jamais avoir à te crier dessus comme\r\nelle va crier après son mari quand il rentrera.\n@c0@"
  it: "@aNera@bSpero proprio che non mi lascerai mai da sola a casa ad aspettare che tu rientri da qualche locale...\n@c0@"
  ja: "@a@bフローラ「私は　あなたを\n\tしかるなんてこと　したくないですわ。\n@c0@"
68:
  de: "@aNera@bDas heißt also, du solltest nie etwas tun, weswegen ich schimpfen müsste. He he he!\n@c0@"
  en: "@aNera@bI suppose that means you'll just have to make sure you never do anything that warrants any shouting. He he he!\n@c0@"
  es: "@aNera@bY claro, eso significa que tendrás que procurar no hacer nunca niente para merecerlo. ¡Ji, ji, ji!\n@c0@"
  fr: "@aNera@bRemarque, il suffira juste que tu évites de faire quoi que ce soit qui mérite de tels cris. Hi hi hiⓠ\n@c0@"
  it: "@aNera@bSe proprio vorrai fare le ore piccole, dovrai portarmi con te!\nEh eh eh!\n@c0@"
  ja: "@a@bフローラ「ですから\n\tしかられるようなことは\n\tなさらないでくださいね。　うふふ。\n@c0@"
69:
  de: "@aBianca@bDie schläft nachts immer hier. Was ihr am Haus wohl so gut gefällt, dass sie so gern hier ist?\n@c0@"
  en: "@aBianca@bThat little one's always asleep here of a night. I wonder what it is about our house that it likes so much.\n@c0@"
  es: "@aBianca@bEse pequeñajo siempre duerme aquí. No sé por qué le gustará tanto nuestra casa, ¿sabes?\n@c0@"
  fr: "@aBianca@bCe petit chat vient toujours dormir ici la nuit. Je me demande ce qui lui plaît tant dans notre maison.\n@c0@"
  it: "@aBianca@bQuel gattino dorme sempre vicino casa mia...\nÈ proprio carino, non è vero?\n@c0@"
  ja: "@a@bビアンカ「あの子　夜は\n\tいつも　ここで寝てるの。\n\tそんなに　私の家が好きなのかしら。\n@c0@"
70:
  de: "@aBianca@bDas Blitzende Badesalz, das er meinte, sind die Kristallablagerungen im Badewasser. Es ist alles ganz natürlich, und es gibt nicht allzu viel davon.\n@c0@"
  en: "@aBianca@bThat scintillating sinter he was on about is the crystal deposits left behind in the bath water. It's all natural stuff, and there's not a lot of it.\n@c0@"
  es: "@aBianca@bEsas sales destellantes de las que hablaba son los depósitos de cristales que quedan en los baños. Es un recurso natural, y no hay muchas.\n@c0@"
  fr: "@aBianca@bLes sels scintillants dont il parlait sont les dépôts cristallisés qui restent dans l'eau des bains. Ce sont des sels naturels et il n'y en a pas beaucoup.\n@c0@"
  it: "@aBianca@bI sali da bagno scintillanti di cui parla sono i depositi naturali lasciati dalle acque termali.\nSono molto pregiati, e non è facile procurarsene.\n@c0@"
  ja: "@a@bビアンカ「秘湯の花っていうのは\n\t温泉の結晶なの。　天然のものだから\n\tすこししか　とれないんだけど……。\n@c0@"
71:
  de: "@aBianca@bDafür ist Utensiel weithin bekannt.\n@c0@"
  en: "@aBianca@bIt's the most famous thing about Stockenbarrel by far.\n@c0@"
  es: "@aBianca@bEs de lejos lo que da más fama a Clavis, ¿sabes?\n@c0@"
  fr: "@aBianca@bC'est de loin la spécialité la plus connue de Saint Éloi.\n@c0@"
  it: "@aBianca@bSono senz'altro il prodotto tipico più famoso di Aprianuam.\n@c0@"
  ja: "@a@bビアンカ「この村で　ゆいいつ　名産と\n\tよべるものかも知れないわね。\n@c0@"
72:
  de: "@aNera@bOh ja. Utensiel ist berühmt für sein Blitzendes Badesalz.\n@c0@"
  en: "@aNera@bOh yes. Stockenbarrel is famous for its\r\nscintillating sinter.\n@c0@"
  es: "@aNera@b¡Ah, sí! Clavis es famoso per le sue sales destellantes.\n@c0@"
  fr: "@aNera@bOui. Saint Éloi est connu pour ses sels scintillants.\n@c0@"
  it: "@aNera@bAh, certo!\nI sali da bagno scintillanti di Aprianuam sono rinomati in tutto il mondo!\n@c0@"
  ja: "@a@bフローラ「秘湯の花って　たしか\n\tこの村の　名産でしたわよね。\n@c0@"
73:
  de: "@aNera@bIch glaube, es ist sogar recht wertvoll. Ich frage mich, ob der Mann hier aus der Gegend stammt. Er hört sich nicht danach an.\n@c0@"
  en: "@aNera@bI think it's quite a valuable thing, in fact. I wonder if that man's from around these parts. It doesn't seem like he is.\n@c0@"
  es: "@aNera@bCredo que son muy valiosas. Me pregunto si este uomo es de por aquí. No parece que lo sea.\n@c0@"
  fr: "@aNera@bJe crois que c'est quelque chose d'assez précieux. Je me demande si cet homme est de la région.\r\nOn ne dirait pas.\n@c0@"
  it: "@aNera@bE sono anche molto cari!\nForse quel tipo è venuto ad Aprianuam proprio per procurarsene un po'.\n@c0@"
  ja: "@a@bフローラ「わりと　貴重な物だったと\n\t思いますけど　あの方…\n\tこの村の方なのかしら？\n@c0@"
74:
  de: "@aBianca@bHm. Kein Wunder, dass es in letzter Zeit so schwierig geworden ist, Blitzendes Badesalz zu bekommen. Der hat sich einfach alles geschnappt!\n@c0@"
  en: "@aBianca@bHuh! No wonder it's bin so tricky findin' any scintillatin' sinter lately. That bloke's got it all!\n@c0@"
  es: "@aBianca@b¡Mmm! No me extraña que últimamente no hubiese manera de encontrar ni un grano de sales destellantes. ¡Ese tipo tiene todas las existencias!\n@c0@"
  fr: "@aBianca@bPfffⓠ Pas étonnant que ce soit si dur de trouver des sels scintillants, dernièrement.\nC'est ce type qui a tout prisⓠ\n@c0@"
  it: "@aBianca@bQuel tipo aveva una gran quantità di sali da bagno scintillanti... Come avrà fatto a procurarsene tanti?\nQuei sali sono molto rari!\n@c0@"
  ja: "@a@bビアンカ「秘湯の花が　こんなに……！\n\t最近　とれないと思ったら\n\tあの人が　取っていたのね。\n@c0@"
75:
  de: "@aNera@bBlitzendes Badesalz duftet so gut.\n@c0@"
  en: "@aNera@bScintillating sinter has a lovely, distinct smell to it.\n@c0@"
  es: "@aNera@bLas sales destellantes tienen il suo aroma característico.\n@c0@"
  fr: "@aNera@bLes sels scintillants possèdent une délicieuse odeur, très caractéristique.\n@c0@"
  it: "@aNera@bAdoro i sali da bagno scintillanti!\nHanno un profumo delizioso!\n@c0@"
  ja: "@a@bフローラ「秘湯の花って\n\tふわっと　いい香りがしますのね。\n@c0@"
76:
  de: "@aBianca@bWenn ihm die Welt da draußen so am Herzen liegt, wieso steigt er dann nicht aus seinem Brunnen raus?\n@c0@"
  en: "@aBianca@bIf he's that fussed about the outside world,\r\nthen why dun't he get out of this well?\n@c0@"
  es: "@aBianca@bSi tanto habla del mundo, ¿por qué no sale de ese agujero?\n@c0@"
  fr: "@aBianca@bS'il fait aussi grand cas du monde extérieur et\ndes voyages, pourquoi est-ce qu'il ne sort pas\nde ce trouⓡ\n@c0@"
  it: "@aBianca@bSe ha tanta voglia di visitare un paese lontano, perché non fa la valigia e parte?\n@c0@"
  ja: "@a@bビアンカ「さっさと　ここから\n\t出ればいいのに！\n@c0@"
77:
  de: "@aBianca@bVielleicht war er darum so hinter dem Blitzenden Badesalz her.\n@c0@"
  en: "@aBianca@bMaybe that's why he was after the scintillatin' sinter all the while.\n@c0@"
  es: "@aBianca@bA lo mejor es por eso que andaba detrás de las sales destellantes, ¿sabes?\n@c0@"
  fr: "@aBianca@bEn fait, c'est peut-être pour ça qu'il tenait tant\r\nà obtenir des sels scintillants.\n@c0@"
  it: "@aBianca@bComunque, adesso ho capito a cosa gli servivano tutti quei sali da bagno scintillanti: voleva barattarli con una rosa del deserto!\n@c0@"
  ja: "@a@bビアンカ「そんな思いまでして\n\t秘湯の花を　取りたいのかしら。\n@c0@"
78:
  de: "@aNera@bVielleicht bin ich da auf dem Holzweg, aber meinst du, der Mann sitzt hier unten fest?\n@c0@"
  en: "@aNera@bI could be wrong, but is that fellow stuck down here, do you think?\n@c0@"
  es: "@aNera@bA lo mejor me equivoco, ma ¿no crees que el tipo ese está atrapado ahí abajo?\n@c0@"
  fr: "@aNera@bJe me trompe peut-être, mais... crois-tu que\ncet homme est coincé iciⓡ\n@c0@"
  it: "@aNera@bNon capisco cosa ci faccia qui sotto quel tipo...\nPossibile che non riesca a uscire?!\n@c0@"
  ja: "@a@bフローラ「よく　わかりませんけど\n\tあの方　ここから\n\t出られないのでしょうか？\n@c0@"
79:
  de: "@aBianca@bHach, ist der Alte nicht sympathisch? Er hat wirklich ein Herz aus Gold.\n@c0@"
  en: "@aBianca@bHe comes across as a bit of a dirty old man,\r\nthat one. But I'm sure he means well deep down.\n@c0@"
  es: "@aBianca@bTiene unas ideas de lo más curiosas este vejete, ¿eh?\n@c0@"
  fr: "@aBianca@bCe vieux monsieur est adorable avec moi.\r\nIl nous a pris sous son aile dès notre arrivée.\n@c0@"
  it: "@aBianca@bA sentirlo parlare sembra un villanzone, ma in realtà è una brava persona...\n@c0@"
  ja: "@a@bビアンカ「あの　おじいさん\n\tふだんは　エッチなこと言ってるけど\n\t根は　純情なのよね。\n@c0@"
80:
  de: "@aBianca@bSeit mein Vater und ich in Utensiel sind, ist die Frau für uns praktisch ein Teil der Familie.\n@c0@"
  en: "@aBianca@bThat woman's bin like one of the family to Dad and me ever since we arrived here in Stockenbarrel.\n@c0@"
  es: "@aBianca@bEsa mujer ha sido como de la familia para mi padre y para mí desde que llegamos aquí a Clavis, ¿sabes?\n@c0@"
  fr: "@aBianca@bDepuis notre arrivée à Saint Éloi, cette femme a toujours été un peu comme un membre de la famille pour papa et moi.\n@c0@"
  it: "@aBianca@bChe cara, quella signora!\nHa avuto simpatia per me e per mio padre dal primo momento che abbiamo messo piede ad Aprianuam...\n@c0@"
  ja: "@a@bビアンカ「あのおばさんとは\n\tこの村に来たときから　家族ぐるみで\n\tおつき合いをしてるの。\n@c0@"
81:
  de: "@aBianca@bNachdem meine Mutter gestorben war, war es einfach schön, von ihr wie ihre eigene Tochter behandelt zu werden.\n@c0@"
  en: "@aBianca@bWith Mum gone, it was nice to have her\r\nabout, treatin' me like I was her real daughter\r\nand everythin'.\n@c0@"
  es: "@aBianca@bMe gustaba que estuviese por aquí y me tratase como si fuese su hija y tal.\n@c0@"
  fr: "@aBianca@bAprès la mort de maman, c'était agréable\r\nde l'avoir auprès de nous. Elle me traitait\r\ncomme si j'étais sa fille.\n@c0@"
  it: "@aBianca@bMi vuole bene come se fossi sua figlia e mi ha aiutato a sopportare il dolore che ho provato per la perdita di mia madre.\n@c0@"
  ja: "@a@bビアンカ「母さんが　死んでからは\n\t実の娘のように　かわいがって\n\tもらっているのよ。\n@c0@"
82:
  de: "@aBianca@bWas ist denn, %a000090? Du siehst etwas verdrossen aus. Du bist doch wohl nicht eifersüchtig?\n@c0@"
  en: "@aBianca@bWhat's wrong, %a000090? You look a bit fed up. Not jealous, are you?\n@c0@"
  es: "@aBianca@b¿Qué te pasa, %a000090? Pareces un poco enfadado. ¿Te has puesto celosón?\n@c0@"
  fr: "@aBianca@bQu'est-ce qui ne va pas, %a000090ⓡ\nTu as l'air un peu énervé. Tu es jaloux, c'est çaⓡ\n@c0@"
  it: "@aBianca@bChe ti prende, %a000090?\nHai un'espressione strana...\nNon sarai mica geloso di quel mio amico...?\n@c0@"
  ja: "@a@bビアンカ「どうしたの？\n\t%a000090ったら　そんな顔して……。\n\tもしかして　ヤキモチやいてる？\n@c0@"
83:
  de: "@aBianca@bHa ha ha! Du brauchst dir keine Sorgen zu machen. Es ist nichts zwischen ihm und mir. Gar nichts!\n@c0@"
  en: "@aBianca@bHa ha ha! You dun't have to worry. It en't like that with me and him. Not at all.\n@c0@"
  es: "@aBianca@b¡Ja, ja, ja! No te preocupes, no hay nada entre él y yo. Nada de nada.\n@c0@"
  fr: "@aBianca@bHa ha haⓠ Tu n'as pas à t'inquiéter. Entre lui et moi, ça n'est pas le genre de relation que tu imagines.\nPas du tout.\n@c0@"
  it: "@aBianca@bAh ah ah! Sei proprio uno sciocchino!\nQuel tipo non mi è mai piaciuto, e comunque io ho occhi solo per te!\n@c0@"
  ja: "@a@bビアンカ「うふふ　うれしいな。\n\t心配しなくて大丈夫よ。\n\tあの人とは　そんなんじゃないから。\n@c0@"
84:
  de: "@aBianca@bHmmm. Bist du dir da so sicher?\n@c0@"
  en: "@aBianca@bHmmm. You sure about that?\n@c0@"
  es: "@aBianca@bMmm. ¿Estás seguro?\n@c0@"
  fr: "@aBianca@bMmm. Tu en es bien sûrⓡ\n@c0@"
  it: "@aBianca@bUhm...\nSarà, ma il tuo sguardo mi dice che stai mentendo...\n@c0@"
  ja: "@a@bビアンカ「ふ～～～～ん…　そう？\n@c0@"
85:
  de: "@aBianca@bHach, ist das peinlich!\n@c0@"
  en: "@aBianca@bHow embarrassin'!\n@c0@"
  es: "@aBianca@b¡Qué vergüenza!\n@c0@"
  fr: "@aBianca@bComme c'est gênantⓠ\n@c0@"
  it: "@aBianca@bMi sento sollevata, sai?\n@c0@"
  ja: "@a@bビアンカ「もう！　父さんったら\n\tゲンキンなんだから。\n@c0@"
86:
  de: "@aBianca@bAber immerhin ist es gut zu sehen, dass es ihm wieder besser geht. Eine Sorge weniger!\n@c0@"
