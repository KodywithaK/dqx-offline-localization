  es: "@aBianca@bDe todos modos, está bien saber que se encuentra mejor.\r\nUna cosa menos de la que preocuparse.\n@c0@"
  fr: "@aBianca@bEnfin, c'est quand même bon de savoir qu'il va mieux. Voilà une chose de moins pour laquelle s'inquiéter.\n@c0@"
  it: "@aBianca@bMi ha fatto piacere vedere che mio padre sta bene.\nSono proprio contenta!\n@c0@"
  ja: "@a@bビアンカ「でも　これで　私たちも\n\t安心して　旅していられるね。\n@c0@"
87:
  de: "@aBianca@bEr trifft nicht immer den richtigen Ton, aber früher hielt ich ihn im Grunde für einen anständigen Kerl. Vielleicht habe ich mich da getäuscht...\n@c0@"
  en: "@aBianca@bHe dun't always say the right thing, but I used to think he's not all that bad deep down. Maybe I was wrong, though...\n@c0@"
  es: "@aBianca@bAunque lo que dice no es siempre muy oportuno, solía creer que, en el fondo, no era tan malo. Pero puede que me equivocase...\n@c0@"
  fr: "@aBianca@bIl n'est pas toujours très délicat, mais je sais\r\nqu'il n'est pas méchant et qu'il m'aime bien.\n@c0@"
  it: "@aBianca@bQuel tipo ha un modo di esprimersi un po' troppo diretto per i miei gusti, ma in fondo è un brav'uomo...\n@c0@"
  ja: "@a@bビアンカ「あんな　エッチなこと言っても\n\t根は　純情な人だと思ってたんだけど…\n\tちがったかしら？\n@c0@"
88:
  de: "@aBianca@bMein Vater scheint zu schlafen. Ich hoffe, es geht ihm bald wieder gut.\n@c0@"
  en: "@aBianca@bLooks like Dad's asleep. I hope he's back in good health again soon.\n@c0@"
  es: "@aBianca@bParece que mi padre está durmiendo. Espero que se recupere pronto, ¿sabes?\n@c0@"
  fr: "@aBianca@bOn dirait que papa est endormi. J'espère qu'il retrouvera bientôt la santé.\n@c0@"
  it: "@aBianca@bMio padre sta dormendo.\nBeh, speriamo che la sua salute continui a migliorare...\n@c0@"
  ja: "@a@bビアンカ「お父さん　ねてるね。\n\t早く　身体が　良くなってくれると\n\tいいな……。\n@c0@"
89:
  de: "@aNera@bWarum bist du denn plötzlich so still?\n... Aber das bist du doch nicht, oder?!\n@c0@"
  en: "@aNera@bWhy are you being so quiet all of a sudden?\n...Surely not!?\n@c0@"
  es: "@aNera@b¿Per qué te has callado de pronto?\r\n¡¿No será que...?!\n@c0@"
  fr: "@aNera@bPourquoi tu ne dis plus rien, tout d'un coupⓡ\n... Bien sûr que non, n'est-ce pasⓡⓐ\n@c0@"
  it: "@aNera@bPerché sei diventato silenzioso così all'improvviso, eh?! Uhm, non farmi scherzi, amore mio, altrimenti ti cavo quei tuoi bellissimi occhi! Eh eh eh! Scherzo...\n@c0@"
  ja: "@a@bフローラ「あなたったら　どうして\n\tだまっていらっしゃるの？\n\tまさか……。\n@c0@"
90:
  de: "@aNera@bAch, wie schade. Oh! Sie wird doch wohl nicht ganz allein das Dorf verlassen haben, oder?\n@c0@"
  en: "@aNera@bThat's a shame. Oh! You don't think that means she's gone out of the village alone, do you?\n@c0@"
  es: "@aNera@b¡Qué lástima! ¡Oh! Ma no se habrá ido del pueblo sola, ¿verdad?\n@c0@"
  fr: "@aNera@bC'est dommage...\nOhⓠ Tu ne penses pas que ça veut dire qu'elle s'est éloignée seule du village, quand mêmeⓡ\n@c0@"
  it: "@aNera@bUhm... Non sarà mica uscita dal villaggio da sola?\nDi questi tempi è pericoloso allontanarsi dai centri abitati...\n@c0@"
  ja: "@a@bフローラ「ざんねんですわね。\n\tでも　…ということは　ひとりで\n\t村の外へ！？\n@c0@"
91:
  de: "@aNera@bDann werden wir sie wohl erst heute Abend zu Gesicht bekommen. Wohin sie wohl gegangen ist?\n@c0@"
  en: "@aNera@bLooks like we won't be able to see her until tonight.\r\nI wonder where she's gone off to.\n@c0@"
  es: "@aNera@bSembra que no podremos verla hasta esta notte.\r\nMe pregunto adónde habrá ido.\n@c0@"
  fr: "@aNera@bNous ne pourrons pas la voir avant ce soir, apparemment. Je me demande ce qu'elle\r\nest partie faire.\n@c0@"
  it: "@aNera@bPare che non riusciremo a vederla prima di sera.\nChissà dove sarà andata...\n@c0@"
  ja: "@a@bフローラ「夜にならないと\n\tお会いできないのね……。\n\tでも　どちらへ　お出かけなのかしら？\n@c0@"
92:
  de: "@aNera@bBiancas Vater hat anscheinend große Stücke auf Ludwig gehalten. Es scheint ihm gar nicht gut zu gehen, was?\n@c0@"
  en: "@aNera@bIt sounds like Bianca's father really thought highly of Pankraz. He seems to be in rather a bad way, doesn't he?\n@c0@"
  es: "@aNera@bParece que el padre de Bianca tenía en alta considerazione a Teudis. No tiene buen aspecto en absoluto, ¿verdad?\n@c0@"
  fr: "@aNera@bApparemment, le père de Bianca tenait Petros en haute estime. Mais il n'a pas l'air très en forme,\ntu ne trouves pasⓡ\n@c0@"
  it: "@aNera@bIl papà di Bianca ha una vera ammirazione per tuo padre, tesoro mio.\nMi spiace che il signor Whitblanche non stia bene...\n@c0@"
  ja: "@a@bフローラ「ダンカンさんは　あなたの\n\tお父さまが　お好きだったのね。\n\tそれにしても　具合が悪そうですわ。\n@c0@"
93:
  de: "@aNera@bEs wird ihm doch wohl nicht schlechter gehen, weil es ihn so aufgewühlt hat, dass du Bianca nicht geheiratet hast? Das will ich doch nicht hoffen!\n@c0@"
  en: "@aNera@bYou don't think he's feeling so ill because of\r\nthe stress of you not marrying Bianca, do you?\r\nI hope not!\n@c0@"
  es: "@aNera@bNo estará enfermo per la tensione de que no te hayas casado con Bianca, ¿verdad?\r\n¡Espero que no!\n@c0@"
  fr: "@aNera@bTu ne crois pas qu'il se sent si mal parce que ça\nl'a angoissé que tu n'épouses pas Bianca, tout de mêmeⓡ J'espère que ce n'est pas çaⓠ\n@c0@"
  it: "@aNera@bSenti, non è che soffre perché hai deciso di sposare me invece di sua figlia?\nSe fosse così mi dispiacerebbe moltissimo...\n@c0@"
  ja: "@a@bフローラ「まさか　あなたが\n\tビアンカさんと　結婚しなかったから\n\tよけいに　……とか？\n@c0@"
94:
  de: "@aNera@bAlle Männer, jung wie alt, scheinen Bianca gern zu haben. Und es ist ja auch leicht zu verstehen, wieso.\n@c0@"
  en: "@aNera@bAll men seem to love Bianca, young and old.\r\nIt's not hard to see why.\n@c0@"
  es: "@aNera@bSembra que tutti los hombres, viejos o jóvenes, quieren a Bianca.\r\nY es evidente la razón.\n@c0@"
  fr: "@aNera@bJeunes ou vieux, tous les hommes ont l'air d'apprécier Bianca. Ce n'est pas difficile de comprendre pourquoi.\n@c0@"
  it: "@aNera@bTutti gli uomini, giovani o vecchi che siano, sono innamorati di Bianca. Beh, non c'è da stupirsi, visto che è una ragazza davvero incantevole!\n@c0@"
  ja: "@a@bフローラ「ビアンカさんって\n\t老若男女を問わず　人気があるのね。\n\tなんだか　わかりますわ。\n@c0@"
95:
  de: "@aNera@bBianca scheint es gut zu gehen.\n@c0@"
  en: "@aNera@bBianca seems well.\n@c0@"
  es: "@aNera@bBianca parece buona persona.\n@c0@"
  fr: "@aNera@bBianca a l'air d'aller bien.\n@c0@"
  it: "@aNera@bOltre che bella, Bianca è anche dolce e gentile.\n@c0@"
  ja: "@a@bフローラ「ビアンカさん\n\tお元気そうに　見えますね……。\n@c0@"
96:
  de: "@aNera@bIch werde dich so glücklich machen, wie ich kann, %a000090. So glücklich, wie sie dich machen würde!\n@c0@"
  en: "@aNera@bI'll be sure to make you happy, %a000090.\nJust as happy as she would!\n@c0@"
  es: "@aNera@bTe voy a hacer molto felice, %a000090.\n¡Tanto como ella lo haría!\n@c0@"
  fr: "@aNera@bJe ferai tout pour te rendre heureux, %a000090. Tout comme Bianca l'aurait faitⓠ\n@c0@"
  it: "@aNera@b%0%a000090, amore mio, giuro che ti renderò felice! Non potrei mai sopportare che tu rimpiangessi anche per un solo istante di non aver sposato lei!\n@c0@"
  ja: "@a@bフローラ「私　ビアンカさんの分まで\n\tぜったいに　あなたを\n\t幸せにしてみせますわ！\n@c0@"
97:
  de: "@aBianca@bHier wohnt doch dein Freund, nicht? Harry, meine ich.\n@c0@"
  en: "@aBianca@bThis is where that mate of yours lives, en't it? Harry, I mean.\n@c0@"
  es: "@aBianca@bAquí es donde vive ese amigo tuyo, ¿no? Froilán, digo.\n@c0@"
  fr: "@aBianca@bC'est ici que vit ton copain Harry, c'est çaⓡ\n@c0@"
  it: "@aBianca@bÈ qui che vive il tuo amico Robert, non è vero?\n@c0@"
  ja: "@a@bビアンカ「ここに　%a000090の友だちの\n\tヘンリーさんが　住んでいるのね。\n@c0@"
98:
  de: "@aBianca@bAber jetzt ist keine Zeit für einen Besuch bei ihm. Zunächst mal müssen wir den Ring des Wassers finden.\n@c0@"
  en: "@aBianca@bWe en't got time for visitin' now, though. We need to find that Circle of Water.\n@c0@"
  es: "@aBianca@bPero no tenemos tiempo de pasar a verle. Tenemos que encontrar ese Anillo de Agua, ¿me entiendes?\n@c0@"
  fr: "@aBianca@bOn n'a malheureusement pas le temps de lui rendre visite pour l'instant. On doit d'abord trouver cet Anneau de l'Eau.\n@c0@"
  it: "@aBianca@bPurtroppo ora non abbiamo tempo per fargli visita: dobbiamo trovare l'Anello d'Acqua.\n@c0@"
  ja: "@a@bビアンカ「でも今は　水のリングを\n\t探さないと　いけないんだから\n\tあまり　ゆっくりできないわよ。\n@c0@"
99:
  de: "@aBianca@bDer Besuch bei deinen Freunden muss warten, %a000090. Zuerst haben wir noch etwas zu erledigen.\n@c0@"
  en: "@aBianca@bSocialisin' with your mates will have to wait, %a000090. We've got stuff to be doin'.\n@c0@"
  es: "@aBianca@bHabrá que dejar la reunión con tus amigos para luego, %a000090. Tenemos cosas que hacer, ¿me entiendes?\n@c0@"
  fr: "@aBianca@bLes retrouvailles avec tes vieux copains devront attendre, %a000090. On a des choses à faire.\n@c0@"
  it: "@aBianca@bPiù tardi passeremo a trovare i tuoi amici, %a000090...\nOra abbiamo altro da fare.\n@c0@"
  ja: "@a@bビアンカ「今は　大事な用があるんでしょ？\n\t友だちへの　あいさつは\n\tまた　今度にしましょうよ。\n@c0@"
100:
  de: "@aBianca@bEs ist irgendwie seltsam, hier zu sein.\n@c0@"
  en: "@aBianca@bIt feels funny bein' here.\n@c0@"
  es: "@aBianca@bQué sensación más extraña, estar aquí.\n@c0@"
  fr: "@aBianca@bÇa fait drôle d'être ici.\n@c0@"
  it: "@aBianca@bQuesto posto mi dà i brividi...\n@c0@"
  ja: "@a@bビアンカ「ここに　こうしているなんて\n\tなんだか　ふしぎな感じがするわ。\n@c0@"
101:
  de: "@aBianca@bDer Gedanke, dass dieses Land damals all das Leid über Steinach gebracht hat, ist etwas bedrückend.\n@c0@"
  en: "@aBianca@bIt's a bit scary to think that this is the place responsible for all that damage done to Whealbrook all them years ago.\n@c0@"
  es: "@aBianca@bDa un poco de miedo pensar que este lugar fue responsable de toda las desgracias de Arroyofrío hace tantos años, ¿sabes?\n@c0@"
  fr: "@aBianca@bC'est un peu effrayant de se dire que c'est à cause de ce royaume que tant de dégâts ont été infligés à Ruycelieu il y a toutes ces années.\n@c0@"
  it: "@aBianca@bSe ci pensi, è qui che fu deciso il tragico destino di Valcava...\n@c0@"
  ja: "@a@bビアンカ「昔は　あのサンタローズを\n\tメチャクチャにした　この国が\n\tにくくて…　こわくて……。\n@c0@"
102:
  de: "@aBianca@bHarry und Maria waren doch auf unserer Hochzeit, oder? Wir sollten kurz bei ihnen vorbeischauen.\n@c0@"
  en: "@aBianca@bHarry and Maria were there at our wedding, weren't they? We should go and drop in on them.\n@c0@"
  es: "@aBianca@bFroilán y María estuvieron en nuestra boda, ¿verdad? Deberíamos ir a hacerles una visita.\n@c0@"
  fr: "@aBianca@bHarry et Maria étaient présents à notre mariage, n'est-ce pasⓡ Nous devrions aller leur rendre une petite visite.\n@c0@"
  it: "@aBianca@bRobert e Maria furono proprio gentili a venire al nostro matrimonio.\nMi piacerebbe passare a salutarli...\n@c0@"
  ja: "@a@bビアンカ「ヘンリーさんと　マリアさんて\n\t結婚式に　来てくれたわよね。\n\t顔ぐらい　見せにいきましょうか。\n@c0@"
103:
  de: "@aBianca@bIch weiß, dass sich die Ereignisse hier damals überstürzt haben, aber jetzt wirkt alles wieder ruhig und friedlich.\n@c0@"
  en: "@aBianca@bI know things have bin a bit rocky here in the past, but it all seems nice and peaceful now.\n@c0@"
  es: "@aBianca@bYa sé que antes esto era un polvorín, pero ahora parece que todo está muy tranquilo, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe sais que les choses ont été un peu difficiles ici dans le passé, mais tout semble paisible et agréable, désormais.\n@c0@"
  it: "@aBianca@bQui, fino a non molto tempo fa, la popolazione ha sofferto tantissimo.\nPer fortuna adesso le cose sembrano andar meglio...\n@c0@"
  ja: "@a@bビアンカ「この国も　いろいろあったけど\n\t今や　平和そのものって感じね。\n@c0@"
104:
  de: "@aNera@bDas ist doch das Land, in dem Harrys Bruder regiert, oder?\n@c0@"
  en: "@aNera@bThis is the place where Harry's brother is on the throne, isn't it?\n@c0@"
  es: "@aNera@bAquí es donde il fratello de Froilán ocupa el trono, ¿vero?\n@c0@"
  fr: "@aNera@bC'est ici que règne le frère de Harry, n'est-ce pasⓡ\n@c0@"
  it: "@aNera@bSu questo territorio regna il fratello di Robert, non è così?\n@c0@"
  ja: "@a@bフローラ「ここが　ヘンリーさんではなく\n\tその　弟さんが　国王を\n\tなさっている国ですわね。\n@c0@"
105:
  de: "@aNera@bIch habe im Stift alle möglichen bösen Gerüchte über dieses Land gehört. Schön, dass jetzt wieder alles ruhig und friedlich zu sein scheint.\n@c0@"
  en: "@aNera@bI heard all sorts of nasty rumours about this place when I was at the abbey. It's good to see it nice and peaceful now.\n@c0@"
  es: "@aNera@bCuando estaba en la abadía oí rumores dispiacèvoli de todo tipo sobre este lugar. Es agradable ver que ahora reina la pace.\n@c0@"
  fr: "@aNera@bJ'ai entendu toutes sortes de vilaines rumeurs\nà propos de cet endroit quand j'étais à l'abbaye.\n㈡\nC'est rassurant de voir que tout y est désormais calme et agréable.\n@c0@"
  it: "@aNera@bQuando vivevo all'abbazia, avevo saputo che qui la situazione era catastrofica.\nSono felice di vedere che ora le cose sono migliorate...\n@c0@"
  ja: "@a@bフローラ「私が　修道院にいた頃\n\tいろいろなウワサを　聞きましたが…\n\t今は　もう平和なのね。　良かったわ。\n@c0@"
106:
  de: "@aBianca@bDie Leute hier wirken so zufrieden.\n@c0@"
  en: "@aBianca@bEveryone seems so happy.\n@c0@"
  es: "@aBianca@bTodo el mundo parece ser muy feliz.\n@c0@"
  fr: "@aBianca@bTout le monde semble si heureux.\n@c0@"
  it: "@aBianca@bChe sollievo vedere che la situazione sta tornando alla normalità! Si percepisce un'atmosfera di serenità e di speranza per il futuro...\n@c0@"
  ja: "@a@bビアンカ「みんな　本当に\n\t幸せそう……。\n@c0@"
107:
  de: "@aBianca@bOffenbar waren wir beide nicht die Einzigen, die harte Zeiten durchlebt haben, was? Die Leute hier hatten es auch nicht leicht.\n@c0@"
  en: "@aBianca@bLooks like you and I en't the only ones who've\r\nhad a hard time of it, eh? It en't bin easy on these folk neither.\n@c0@"
  es: "@aBianca@bParece que tú y yo no somos los únicos que lo han pasado mal, ¿eh? Para esta gente no ha sido tampoco un camino de rosas.\n@c0@"
  fr: "@aBianca@bOn dirait que nous ne sommes pas les seuls\nà en avoir bavé, heinⓡ Pour ces gens-là non plus, tout n'a pas été facile.\n@c0@"
  it: "@aBianca@bTu e io abbiamo vissuto momenti molto duri in passato, ma nemmeno questa povera gente ha avuto una vita facile...\n@c0@"
  ja: "@a@bビアンカ「私や%a000090も\n\tつらかったけど　この国の人も\n\tつらかったのね……。\n@c0@"
108:
  de: "@aNera@bEs tut richtig gut, so zufriedene Leute zu sehen.\n@c0@"
  en: "@aNera@bIt makes me feel all warm inside when I see people looking happy like that.\n@c0@"
  es: "@aNera@bCuando veo a las personas così de felices noto una sensazione molto agradable.\n@c0@"
  fr: "@aNera@bÇa me réchauffe le cœur de voir des gens heureux comme ça.\n@c0@"
  it: "@aNera@bQuando vedo altre persone felici, sento che il cuore mi scoppia di gioia!\n@c0@"
  ja: "@a@bフローラ「幸せそうな方々を　見ると\n\tあたたかい気持ちに　なりますわね。\n@c0@"
109:
  de: "@aBianca@bHa ha! Na, der hat ja keine Hemmungen, etwas über sich zu erzählen, wie?\n@c0@"
  en: "@aBianca@bHa ha! He certainly dun't mind what he tells folk, eh?\n@c0@"
  es: "@aBianca@b¡Ja, ja! No parece que le preocupe el qué dirán, ¿eh?\n@c0@"
  fr: "@aBianca@bHa haⓠ Il ne se gêne pas pour dire\nce qu'il pense, heinⓡ\n@c0@"
  it: "@aBianca@bAh ah ah!\nViva la sincerità!\n@c0@"
  ja: "@a@bビアンカ「うふふ。\n\tなかなか　おもしろいことを言う\n\tおじいさんよね。\n@c0@"
110:
  de: "@aNera@bMeinst du, dass es für ihn schon zu spät ist?\n@c0@"
  en: "@aNera@bIt's not really too late for him, is it?\n@c0@"
  es: "@aNera@b¿Crees que será tropo tarde per lui?\n@c0@"
  fr: "@aNera@bIl n'est pas vraiment trop tard pour lui.\nJe suis sûre que tu es d'accord avec moi, heinⓡ\n@c0@"
  it: "@aNera@bMa se voleva una ragazza come quella, perché ha sposato un'altra donna?\nAvrebbe dovuto pensarci prima, dico bene?\n@c0@"
  ja: "@a@bフローラ「そんな…\n\tおそくなんて　ないですよね？\n@c0@"
111:
  de: "@aNera@bHm, vielleicht hast du recht.\n@c0@"
  en: "@aNera@bHm, I suppose maybe it is.\n@c0@"
  es: "@aNera@bSí, supongo que sí.\n@c0@"
  fr: "@aNera@bMais oui. Il faut toujours garder espoir.\n@c0@"
  it: "@aNera@bPer fortuna la pensi come me.\nIl matrimonio è una cosa seria, non lo si può mica prendere alla leggera!\n@c0@"
  ja: "@a@bフローラ「希望は\n\t持ちつづけていて　いいんですよね。\n@c0@"
112:
  de: "@aNera@bGenau. Man soll nie die Hoffnung aufgeben.\n@c0@"
  en: "@aNera@bI agree. It's much better for people to keep on hoping.\n@c0@"
  es: "@aNera@bSono d'accordo. Es molto meglio que la gente no pierda la esperanza.\n@c0@"
  fr: "@aNera@bMmm... Tu as peut-être raison.\n@c0@"
  it: "@aNera@bEh?! Ma che stai dicendo?! Guarda che il matrimonio è una cosa seria! Una volta che hai pronunciato il fatidico ⓕsìⓖ non c'è più tempo per i ripensamenti!\n@c0@"
  ja: "@a@bフローラ「やっぱり　おそいですか。\n@c0@"
113:
  de: "@aBianca@bIrgendwie kann man sich einen solchen Mann nicht in einem Schloss vorstellen. Nicht, dass es uns etwas anginge.\n@c0@"
  en: "@aBianca@bYou wouldn't expect to find someone like that in\r\na castle, somehow. Not that it's of any interest to\r\nus, mind.\n@c0@"
  es: "@aBianca@bEs extraño encontrarse a alguien así en un castillo. Auque a nosotros nos da más bien igual, ¿sabes?\n@c0@"
  fr: "@aBianca@bTout de même, on ne s'attend pas à trouver quelqu'un comme ça dans un château. Même\r\nsi cela ne nous concerne pas, finalement.\n@c0@"
  it: "@aBianca@bNon sapevo che al Castello di Denim avesse vissuto un genio dell'oreficeria...\n@c0@"
  ja: "@a@bビアンカ「お城には　すごい人も\n\tいたりするのね。　まあ\n\t私たちには　縁のない話でしょうけど。\n@c0@"
114:
  de: "@aBianca@bWenn wir noch lange so durch die Weltgeschichte reisen, finden wir uns irgendwann wahrscheinlich in Humburg wieder, was?\n@c0@"
  en: "@aBianca@bIf we keep travellin' like this, we'll probably find ourselves in Gotha sometime, eh?\n@c0@"
  es: "@aBianca@bSi seguimos viajando, probablemente llegaremos a Pankraz en algún momento, ¿no?\n@c0@"
  fr: "@aBianca@bEn continuant à voyager comme ça, on finira par se retrouver à Gotha un jour ou l'autre, nonⓡ\n@c0@"
  it: "@aBianca@bSe continuiamo a viaggiare, prima o poi ci ritroveremo a Denim senza nemmeno accorgercene!\n@c0@"
  ja: "@a@bビアンカ「このまま　旅を続けていけば\n\tグランバニアにも　いつか\n\t行くことになるわよね。\n@c0@"
115:
  de: "@aNera@bEr muss wirklich ein sehr guter Kunsthandwerker gewesen sein, wenn die Leute weit und breit von ihm reden.\n@c0@"
  en: "@aNera@bHe must've been a very good craftsman indeed for talk of him to have spread this far.\n@c0@"
  es: "@aNera@bDebe de haber sido un artesano molto diestro para que se hable de él hasta en este lugar.\n@c0@"
  fr: "@aNera@bCet artisan devait réellement être très doué pour que sa réputation se soit étendue jusqu'ici.\n@c0@"
  it: "@aNera@bQuell'artigiano dev'essere stato un vero artista, per essersi guadagnato un soprannome del genere!\n@c0@"
  ja: "@a@bフローラ「とおい　この国まで\n\tそんな話が　伝わってくるということは\n\tよほど　すごい方なのね。\n@c0@"
116:
  de: "@aBianca@bVielleicht ist es wegen all der Jahre in den Bergen, aber in so einer großen Stadt fühle ich mich einfach nicht wohl.\n@c0@"
  en: "@aBianca@bMaybe it's because of all them years in the mountains, but I can't seem to relax in a big\r\ncastle town like this.\n@c0@"
  es: "@aBianca@bA lo mejor es por estar un poco asilvestrada, pero me cuesta mucho descansar en un gran castillo como este, ¿sabes?\n@c0@"
  fr: "@aBianca@bC'est peut-être à cause de toutes ces années passées dans les montagnes, mais j'ai du mal à me sentir à l'aise dans un grand royaume comme ça.\n@c0@"
  it: "@aBianca@bNon so, forse è perché ormai sono anni che vivo in un paesino tra i monti, ma non mi sento a mio agio in questo posto...\n@c0@"
  ja: "@a@bビアンカ「私　山奥のくらしが長かったから\n\tお城って　落ちつかないな。\n\t場ちがいな　気がしちゃって……。\n@c0@"
117:
  de: "@aNera@bIch werde mein Möglichstes tun, dich vor Seiner Majestät nicht in Verlegenheit zu bringen.\n@c0@"
  en: "@aNera@bI'll do my best not to embarrass you in front of\r\nHis Majesty.\n@c0@"
  es: "@aNera@bProcuraré no avergonzarte delante de la Sua Maestà.\n@c0@"
  fr: "@aNera@bJe ferai de mon mieux pour ne pas commettre d'impair devant Sa Majesté.\n@c0@"
  it: "@aNera@bFarò del mio meglio per non metterti in imbarazzo di fronte a Sua Maestà, puoi stare tranquillo.\n@c0@"
  ja: "@a@bフローラ「私　王さまの前で\n\tあなたに恥をかかせないよう\n\tがんばりますわね。\n@c0@"
118:
  de: "@aBianca@bWenn es vom Himmel gefallen ist, meinst du, dass dort jetzt jeder einfach rein- und rausspazieren kann?\n@c0@"
  en: "@aBianca@bIf it fell from the sky, do you reckon that means anyone can get in and out of it now?\n@c0@"
  es: "@aBianca@bSi cayó del cielo, ¿significará que ahora cualquiera puede entrar y salir de él?\n@c0@"
  fr: "@aBianca@bS'il est tombé du ciel, tu penses que n'importe qui\npeut y entrer et en sortir, maintenantⓡ\n@c0@"
  it: "@aBianca@bUn castello caduto dal cielo? Possibile che nessuno l'abbia ancora trovato? Voglio dire, stiamo parlando di un castello, mica di uno spillo!\n@c0@"
  ja: "@a@bビアンカ「地上に　天空城があれば\n\tいつでも　誰でも\n\tお城に　出入りできるかしら。\n@c0@"
119:
  de: "@aNera@bDie Leute reden die ganze Zeit von einem Schloss, das vom Himmel fiel, aber niemand erzählt einem, wo.\n@c0@"
  en: "@aNera@bPeople keep talking about a castle fallen from\r\nthe sky, but no one ever seems to say where it actually fell.\n@c0@"
  es: "@aNera@bTutti il mondo habla sobre un castello que cayó del cielo, pero nadie parece decir niente sobre dove cayó.\n@c0@"
  fr: "@aNera@bLes gens n'arrêtent pas de parler d'un château tombé du ciel, mais personne ne dit jamais\r\noù il serait tombé.\n@c0@"
  it: "@aNera@bSì, anch'io avevo sentito dire di un castello precipitato dal cielo, ma nessuno sa dove sia caduto. Certo che la cosa pare un po' inverosimile...\n@c0@"
  ja: "@a@bフローラ「地上に落ちたと言う人がいても\n\tその落ちた場所が　誰にも\n\t知られていないのは　なぜかしら？\n@c0@"
120:
  de: "@aBianca@bEs sieht so aus, als hättest du auch hier alle Hände voll zu tun gehabt, was? Schade, dass ich damals nicht dabei war.\n@c0@"
  en: "@aBianca@bLooks like you've bin a bit busy here too, eh?\r\nShame I wasn't taggin' along at the time.\n@c0@"
  es: "@aBianca@bParece que tú también estuviste ocupado por aquí, ¿eh?\r\nQué lástima no haberte podido acompañar.\n@c0@"
  fr: "@aBianca@bApparemment, tu as été bien occupé, ici aussi, heinⓡ Dommage que je n'aie pas été avec toi à l'époque.\n@c0@"
  it: "@aBianca@bVedo che ti sei dato da fare anche qui, eh?\nPrima o poi dovrai raccontarmi per filo e per segno come andarono le cose, d'accordo?\n@c0@"
  ja: "@a@bビアンカ「%a000090は　ここでも\n\t大かつやく　だったようね。\n\t私も　一緒に冒険したかったな。\n@c0@"
121:
  de: "@aNera@bIch höre den Leuten so gern zu, wenn sie von deinen Heldentaten erzählen. Ich erfahre dadurch so vieles, was ich noch gar nicht gewusst habe.\n@c0@"
  en: "@aNera@bIt's fun listening to people talking about what you\r\ndid here. I'm getting to know so many things I didn't know before.\n@c0@"
  es: "@aNera@bEs curioso oír parlare a la gente sobre lo que hiciste aquí. Estoy aprendiendo muchas cosas sobre ti que no sabía.\n@c0@"
  fr: "@aNera@bC'est drôle d'entendre les gens parler de ce que tu as fait ici. J'apprends plein de choses que j'ignorais jusqu'à présent.\n@c0@"
  it: "@aNera@bNon sapevo che ti fossi reso utile anche da queste parti! Ogni giorno che passa scopro qualcosa di nuovo di te, tesoro mio...\n@c0@"
  ja: "@a@bフローラ「お城の方たちの話を聞いていると\n\t私の知らない　%a000090さんを\n\t知ることができて　楽しいわ。\n@c0@"
122:
  de: "@aBianca@bEs muss eine große Umstellung für seine Frau gewesen sein, als sie ihn Hals über Kopf heiratete und dann plötzlich Prinzessin war.\n@c0@"
  en: "@aBianca@bIt must be pretty amazin' for his wife to get married and become a princess all of a sudden.\n@c0@"
  es: "@aBianca@bDebe de ser fantástico para su mujer haberse casado y convertirse en princesa así de pronto, ¿sabes?\n@c0@"
  fr: "@aBianca@bÇa doit être assez incroyable pour son épouse\r\nde s'être mariée et d'être devenue princesse\r\nd'un seul coup.\n@c0@"
  it: "@aBianca@bE così Maria ha sposato Robert ed è diventata Principessa di Coburg!\nProprio come nelle favole, eh?\n@c0@"
  ja: "@a@bビアンカ「奥さまは　結婚して\n\tお姫さまなんて　ステキよね。\n@c0@"
123:
  de: "@aBianca@bHmpf. Wir sollten vielleicht versuchen, glücklicher auszusehen. Ich lass' mich nicht gern ausstechen!\n@c0@"
  en: "@aBianca@bHmph! We should try and look happier together.\r\nI dun't like bein' beaten!\n@c0@"
  es: "@aBianca@b¡Umf! Deberíamos procurar tener aspecto de felices cuando estamos juntos.\r\n¡No me gusta que me ganen!\n@c0@"
  fr: "@aBianca@bMmpfⓠ On devrait essayer d'avoir l'air encore plus heureux ensemble. Je déteste être surpassée.\n@c0@"
  it: "@aBianca@bAh, sì?! Loro sono una coppia felice?!\nNoi siamo più felici di loro, e di parecchio anche!\nSiamo la coppia più bella del mondo, noi! Eh eh eh!\n@c0@"
  ja: "@a@bビアンカ「む……。\n\t私たちも　もっと　仲よくしましょ。\n@c0@"
124:
  de: "@aNera@bWir sind genauso glücklich wie sie, stimmt's nicht, Liebling?\n@c0@"
  en: "@aNera@bWe're just as happy as they are, aren't we, darling?\n@c0@"
  es: "@aNera@bSomos tan felices come ellos, ¿verdad, caro mio?\n@c0@"
  fr: "@aNera@bNous sommes aussi heureux qu'eux, n'est-ce pas, mon chériⓡ\n@c0@"
  it: "@aNera@bAnche noi siamo felici.\nNon è vero, tesoro mio?\n@c0@"
  ja: "@a@bフローラ「うふふ。\n\t私たちも　負けていませんわよね。\n\tあなた。\n@c0@"
125:
  de: "@aBianca@bDer alte Mann ist so glücklich. Das hast du gut gemacht, %a000090.\n@c0@"
  en: "@aBianca@bThat old man is so happy. You really did a good thing here, %a000090.\n@c0@"
  es: "@aBianca@bQué feliz está ese viejo. Hiciste una buena obra, %a000090.\n@c0@"
  fr: "@aBianca@bCe vieil homme a l'air si heureux. Tu as vraiment fait quelque chose de bien ici, %a000090.\n@c0@"
  it: "@aBianca@bHai reso felice quel povero vecchio, %a000090.\nSono fiera di te, amore mio!\n@c0@"
  ja: "@a@bビアンカ「あのおじいさん\n\tあんなに　よろこんで……。\n\t%a000090　本当に　いいことしたね。\n@c0@"
126:
  de: "@aNera@bDas greift mir... direkt ans Herz... Hach! Da kommen mir glatt die Tränen!\n@c0@"
  en: "@aNera@bThat's just...so...wonderful.\nOh dear! Now I'm crying!\n@c0@"
  es: "@aNera@bEso... es... maravilloso.\r\n¡Oh, mamma mia! ¡Si estoy llorando!\n@c0@"
  fr: "@aNera@bC'est vraiment... si... merveilleux.\nOh nonⓠ Voilà que j'en pleureⓠ\n@c0@"
  it: "@aNera@bChe storia commovente!\nPer fortuna ora quel pover'uomo sta bene...\nSono felicissima per lui!\n@c0@"
  ja: "@a@bフローラ「よかったですわ…　本当に。\n\tいやだ　私まで　なみだが……。\n@c0@"
127:
  de: "@aBianca@bDas klingt alles ganz schön kompliziert, wie?\n@c0@"
  en: "@aBianca@bThat all sounds a bit complicated, eh?\n@c0@"
  es: "@aBianca@bTodo eso suena bastante complicado, ¿no?\n@c0@"
  fr: "@aBianca@bTout ça semble un peu compliqué, nonⓡ\n@c0@"
  it: "@aBianca@bMa chi è quel tizio? E perché parla in maniera tanto complicata? Non sono sicura di aver capito bene cos'ha detto...\n@c0@"
  ja: "@a@bビアンカ「う～ん…　私には\n\tよく　わからない　むずかしい話ね。\n@c0@"
128:
  de: "@aNera@bIch habe gehört, der legendäre Held hätte das Ungeheuer besiegt, das durch das Geheimnis der Evolution entstanden ist.\n@c0@"
  en: "@aNera@bI heard it was the legendary hero who defeated the monster that evolved using the Secret of Evolution.\n@c0@"
  es: "@aNera@bLo que yo había oído es que el héroe legendario derrotó al mostro que evolucionó con el Secreto de la Evolución.\n@c0@"
  fr: "@aNera@bD'après la rumeur, c'est le héros légendaire qui\r\naurait vaincu le monstre qui s'était transformé grâce au Secret de l'Évolution.\n@c0@"
  it: "@aNera@bSe ricordo bene, fu l'Eroe Leggendario a sconfiggere il mostro che si era trasformato usando il Segreto dell'Evoluzione...\n@c0@"
  ja: "@a@bフローラ「秘法の力で進化した生物を\n\t打ちたおしたのが　伝説の勇者さま\n\tと聞いていますわ。\n@c0@"
129:
  de: "@aBianca@bDu stiefelst einfach unbefangen überall rein, wo deine Nase hinzeigt, was, %a000090? Wäre ich allein, würde ich mich das nicht trauen.\n@c0@"
  en: "@aBianca@bYou just bowl on in anywhere you like, eh, %a000090? I'd be too nervous if it was just me.\n@c0@"
  es: "@aBianca@bTú de cabeza adonde sea, ¿eh, %a000090? Si estuviese yo sola tendría demasiado miedo.\n@c0@"
  fr: "@aBianca@bTu entres vraiment comme tu veux partout, hein, %a000090ⓡ Je serais bien trop nerveuse si j'étais seule.\n@c0@"
  it: "@aBianca@bTi piace ficcare il naso ovunque, eh, %a000090?\nIo non ci riuscirei mai!\nNon ho la tua faccia tosta...\n@c0@"
  ja: "@a@bビアンカ「%a000090ったら　どこでも\n\t平気で　入っちゃうんだもの。\n\t私は　ドキドキなのに……。\n@c0@"
130:
  de: "@aNera@bIch glaube, bei dem Gedanken, die Königinwitwe kennenzulernen, ist mir noch banger als bei dem Gedanken, den König selbst zu treffen!\n@c0@"
  en: "@aNera@bI think I'm more uneasy about meeting the Queen Dowager than I am about meeting the King himself!\n@c0@"
  es: "@aNera@b¡Credo que me pone più nerviosa conocer a la Reina Madre que al propio Rey!\n@c0@"
  fr: "@aNera@bJe crois que je suis plus mal à l'aise de rencontrer\nla reine douairière que le roi lui-mêmeⓠ\n@c0@"
  it: "@aNera@bMi sento più nervosa al pensiero di incontrare la Regina Madre che non il Re!\n@c0@"
  ja: "@a@bフローラ「太后さまに　お会いするのは\n\t国王さまに　お会いするよりも\n\tきんちょうしますわ。\n@c0@"
131:
  de: "@aBianca@bDie Königinwitwe wurde doch von einer Schwindlerin in ihr eigenes Gefängnis geworfen, oder?\n@c0@"
  en: "@aBianca@bThe Queen Dowager was slung into her own jail by an impostor, wasn't she?\n@c0@"
  es: "@aBianca@bUna impostora metió a la Reina Madre en su propia cárcel, ¿verdad?\n@c0@"
  fr: "@aBianca@bLa reine douairière a été jetée dans sa propre prison par un imposteur, c'est bien çaⓡ\n@c0@"
  it: "@aBianca@bLa Regina Madre venne imprigionata in seguito a un complotto, non è vero?\n@c0@"
  ja: "@a@bビアンカ「太后さまって　ニセモノに\n\t牢に　入れられていたのよね。\n@c0@"
132:
  de: "@aBianca@bOb sie wohl schon dort war, als der König starb?\n@c0@"
  en: "@aBianca@bI wonder if she was there already when the late king died.\n@c0@"
  es: "@aBianca@bMe pregunto si ya estaba allí cuando el difunto rey murió, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe me demande si elle y était déjà lorsque feu le roi est décédé.\n@c0@"
  it: "@aBianca@bChissà se era già in carcere quando il Re suo consorte passò a miglior vita...\n@c0@"
  ja: "@a@bビアンカ「先代の王が　亡くなったときも\n\t牢の中だったのかしら……。\n@c0@"
133:
  de: "@aNera@bDu hilfst nicht bloß einzelnen Menschen, sondern gleich ganzen Königreichen aus der Klemme. Du bist wirklich ein erstaunlicher Mann, %a000090.\n@c0@"
  en: "@aNera@bYour good deeds are helping out entire kingdoms, not just individual people. You really are amazing, %a000090.\n@c0@"
  es: "@aNera@bLas tue buoni acciones ayudan a reinos enteros, no solo a personas. Veramente, eres asombroso, %a000090.\n@c0@"
  fr: "@aNera@bTes bonnes actions servent des royaumes tout entiers, pas uniquement des individus.\nTu es vraiment incroyable, %a000090.\n@c0@"
  it: "@aNera@bHai aiutato singoli individui e intere nazioni, senza alcuna distinzione.\nSei veramente una persona speciale, %a000090.\n@c0@"
  ja: "@a@bフローラ「%a000090さんは　人どころか\n\t国まで　助けているんですね。\n\tあなたって　本当に　すごいわ。\n@c0@"
134:
  de: "@aBianca@bDieses Schloss ist ja ein richtiges Labyrinth, was? Dauernd verlaufe ich mich!\n@c0@"
  en: "@aBianca@bThis castle is a bit of a maze, eh?\r\nI'm permanently lost!\n@c0@"
  es: "@aBianca@bEste castillo es como un laberinto, ¿eh?\r\n¡Es que siempre me pierdo!\n@c0@"
  fr: "@aBianca@bCe château est un vrai labyrinthe, nonⓡ\nMoi, je suis toujours perdueⓠ\n@c0@"
  it: "@aBianca@bQuesto castello è peggio di un labirinto!\nNon ho la più pallida idea di quale direzione prendere!\n@c0@"
  ja: "@a@bビアンカ「お城の中って　ふくざつなのね。\n\t私　迷子になりそうだわ。\n@c0@"
135:
  de: "@aNera@bWas für ein großes Schloss das ist. Ich glaube, in so einem Prachtbau war ich noch nie.\n@c0@"
  en: "@aNera@bWhat a big castle this is. I don't think I've ever seen a place so grand.\n@c0@"
  es: "@aNera@bQué castello tan grande. Credo que nunca he visto un lugar tan magnífico.\n@c0@"
  fr: "@aNera@bQuel château immense. Je ne crois pas avoir jamais vu un endroit aussi vaste.\n@c0@"
  it: "@aNera@bQuesto castello è immenso!\nNon ne avevo mai visti di tanto grandi...\n@c0@"
  ja: "@a@bフローラ「大きな　お城ですわね。\n\t私　こんなに　立派なお城は\n\t初めてかも知れませんわ。\n@c0@"
136:
  de: "@aBianca@bVielleicht ist der Schild, von dem er sprach, der, nach dem du suchst, was meinst du?\n@c0@"
  en: "@aBianca@bMaybe the shield he was on about is the shield you're lookin' for, eh?\n@c0@"
  es: "@aBianca@bA lo mejor ese escudo del que hablaba es el escudo que tú estás buscando, ¿no?\n@c0@"
  fr: "@aBianca@bPeut-être que le bouclier dont il parle est celui que tu cherchesⓡ\n@c0@"
  it: "@aBianca@bForse lo scudo di cui ha parlato è lo stesso che stai cercando tu!\n@c0@"
  ja: "@a@bビアンカ「王さまが　おっしゃっていた\n\tあの盾が　%a000090のさがしている\n\t盾かも　知れないのね……。\n@c0@"
137:
  de: "@aBianca@bDann sollten wir wohl lieber aufbrechen. Du willst diesen Schild doch haben, oder, %a000090?\n@c0@"
  en: "@aBianca@bWe'd better get a move on, then. You want that shield, right, %a000090?\n@c0@"
  es: "@aBianca@bSerá mejor ponerse en marcha, pues. Porque quieres ese escudo, ¿no, %a000090?\n@c0@"
  fr: "@aBianca@bDans ce cas, on ferait bien d'y aller. Tu veux récupérer ce bouclier, nonⓡ\n@c0@"
  it: "@aBianca@bAvanti, %a000090!\nAndiamo a controllare!\n@c0@"
  ja: "@a@bビアンカ「さあ　もう　行きましょう。\n\t%a000090は　盾が　必要なんでしょう？\n@c0@"
138:
  de: "@aBianca@bWenn ich dich so mit dem König plaudern sehe, habe ich fast das Gefühl, dass du mir eine Nummer zu groß bist.\n@c0@"
  en: "@aBianca@bWhen I see you chatterin' away to the King like that, I feel like you're far too grand for the likes of me.\n@c0@"
  es: "@aBianca@bCuando te veo charlar con el Rey così, me siento como si estuvieses muy por encima de la gente come yo.\n@c0@"
  fr: "@aBianca@bQuand je te vois discuter tranquillement avec le roi, comme ça, je me dis que tu es bien trop noble pour quelqu'un comme moi.\n@c0@"
  it: "@aBianca@bQuando ti vedo discutere da pari a pari con tutti i re e le regine del mondo, mi chiedo come mai hai scelto di stare con una ragazza semplice come me...\n@c0@"
  ja: "@a@bビアンカ「王族と　自然に話す姿を\n\t見ていると　%a000090が　手の届かない\n\t人になったみたいに　思えてきちゃう。\n@c0@"
139:
  de: "@aNera@bWir müssen den legendären Helden finden, so schnell wir können, damit wir deine arme Mutter retten können.\n@c0@"
  en: "@aNera@bWe must find the legendary hero as soon as we can, so that we can rescue your poor mother.\n@c0@"
  es: "@aNera@bDebemos trovare al héroe legendario lo antes posible para rescatar a la tua pobre mamma.\n@c0@"
  fr: "@aNera@bNous devons retrouver le héros légendaire le plus tôt possible, afin de sauver ta pauvre mère.\n@c0@"
  it: "@aNera@bDobbiamo trovare l'Eroe Leggendario il prima possibile, così potremo salvare tua madre!\n@c0@"
  ja: "@a@bフローラ「お母さまを　救うためにも\n\t早く　伝説の勇者を見つけないと\n\tいけませんわね。\n@c0@"
140:
  de: "@aBianca@bDas also ist der berühmte Harry? Er sieht aus wie jeder andere Prinz auch, aber er hat auch einiges auszustehen gehabt, nicht?\n@c0@"
  en: "@aBianca@bSo that's the famous Harry? He looks just like\r\nany other prince, but he's had his fair share of hardship, eh?\n@c0@"
  es: "@aBianca@b¿Así que este es el famoso Froilán? Parece un príncipe cualquiera, pero lo ha pasado bastante mal, ¿verdad?\n@c0@"
  fr: "@aBianca@bAlors c'est lui, le fameux Harryⓡ Il ressemble à n'importe quel prince, mais il a connu son lot d'épreuves, n'est-ce pasⓡ\n@c0@"
  it: "@aBianca@bE così quello è il principe Robert...\nSo che ha trascorso degli anni difficili, ma mi sembra che stia bene adesso, no?\n@c0@"
  ja: "@a@bビアンカ「あの方が　ヘンリーさん……。\n\tどこから見ても　王子さまという\n\t感じなのに　苦労なさったのね。\n@c0@"
141:
  de: "@aBianca@bEr hat mich nicht mal angesehen, weißt du.\n@c0@"
  en: "@aBianca@bHe didn't even notice me, you know.\n@c0@"
  es: "@aBianca@bNi siquiera se ha dado cuenta de que estaba aquí, ¿sabes?\n@c0@"
  fr: "@aBianca@bTu sais, il ne m'a même pas remarquée.\n@c0@"
  it: "@aBianca@bHai notato che non mi ha nemmeno rivolto la parola?\nSecondo me manco mi ha vista!\n@c0@"
  ja: "@a@bビアンカ「それにしても　私には\n\tぜんぜん　気づいてないみたいね。\n@c0@"
142:
  de: "@aBianca@bAnscheinend hat er nur Augen für seine schöne Frau.\n@c0@"
  en: "@aBianca@bSeems like he's only got eyes for that\r\npretty wife of his.\n@c0@"
  es: "@aBianca@bParece que solo tiene ojos para esa esposa tan guapa que tiene.\n@c0@"
  fr: "@aBianca@bOn dirait qu'il n'a d'yeux que pour sa jolie épouse.\n@c0@"
  it: "@aBianca@bIl caro Principe ha occhi solo per la sua bella mogliettina, eh?\nEh eh eh! Sono proprio una bella coppia, quei due!\n@c0@"
  ja: "@a@bビアンカ「今は　かわいい奥さんしか\n\t目に入らない　ってことかしら？\n@c0@"
143:
  de: "@aBianca@bEr hat sicher recht. Bestimmt ist es deiner Mutter nur wichtig, dass du glücklich bist.\n@c0@"
  en: "@aBianca@bI'm sure he's right that your mum would want you to be happy.\n@c0@"
  es: "@aBianca@bCreo que tiene razón, tu madre querría que fueses feliz.\n@c0@"
  fr: "@aBianca@bJe suis certaine qu'il a raison et que ta mère voudrait que tu sois heureux.\n@c0@"
  it: "@aBianca@bCredo che abbia ragione, sai?\nAnch'io sono convinta che tua madre gioirebbe nel saperti felice...\n@c0@"
  ja: "@a@bビアンカ「たしかに　お母さんは\n\t%a000090の幸せを　いちばんに\n\tねがってると思うけど……。\n@c0@"
144:
  de: "@aBianca@bAber das kannst wohl nur du entscheiden, was dich glücklich macht.\n@c0@"
  en: "@aBianca@bBut I reckon it's up to you to decide what it is that'll make you that way.\n@c0@"
  es: "@aBianca@bPero supongo que es cosa tuya decidir cómo vas a serlo, ¿me entiendes?\n@c0@"
  fr: "@aBianca@bMais c'est aussi à toi de décider ce qui pourrait t'apporter ce bonheur.\n@c0@"
  it: "@aBianca@bMa la vita è tua, e sta a te decidere del tuo futuro.\n@c0@"
  ja: "@a@bビアンカ「幸せの順番は\n\t%a000090が　決めちゃって\n\tいいんじゃないかな？\n@c0@"
145:
  de: "@aBianca@bHarry sieht aus wie alle anderen Prinzen, aber er hat auch schon einiges durchgemacht, nicht?\n@c0@"
  en: "@aBianca@bHarry looks just like any other prince, but he's had his fair share of hardship, eh?\n@c0@"
  es: "@aBianca@bFroilán parece un príncipe cualquiera, pero lo ha pasado bastante mal, ¿verdad?\n@c0@"
  fr: "@aBianca@bHarry ressemble à n'importe quel prince, mais il a connu son lot d'épreuves, n'est-ce pasⓡ\n@c0@"
  it: "@aBianca@bSo che Robert ha trascorso degli anni difficili, ma mi sembra che sia riuscito a gettarsi il passato alle spalle...\n@c0@"
  ja: "@a@bビアンカ「ヘンリーさんって　今は\n\tどこから見ても　王子さまという\n\t感じなのに　苦労なさったのね。\n@c0@"
146:
  de: "@aBianca@bWeißt du, ich glaube, er hat mich gar nicht bemerkt. Er hat wohl nur Augen für seine schöne Frau.\n@c0@"
  en: "@aBianca@bHe didn't seem to notice me, you know. I reckon he's only got eyes for that pretty wife of his.\n@c0@"
  es: "@aBianca@bNi siquiera se ha dado cuenta de que estaba aquí, ¿sabes? Supongo que solo tiene ojos para esa esposa tan guapa que tiene.\n@c0@"
  fr: "@aBianca@bJe crois qu'il ne m'a même pas remarquée, tu sais. Je crois qu'il n'a d'yeux que pour sa jolie épouse.\n@c0@"
  it: "@aBianca@bHai visto? Non mi nemmeno rivolto la parola!\nIl tuo amico Principe ha occhi solo per sua moglie!\n@c0@"
  ja: "@a@bビアンカ「それにしても　私には\n\t気づいてないのかしら？　きっと\n\t自分の奥さんしか　目に入らないのね。\n@c0@"
147:
  de: "@aNera@bHarry scheint ein netter Kerl zu sein. Aber das wusste ich ja schon vorher, nach allem, was ihr beide zusammen durchgemacht habt.\n@c0@"
  en: "@aNera@bHarry seems like a nice chap. I knew he would be, though, because of all you and he went through together.\n@c0@"
  es: "@aNera@bFroilán parece un uomo molto agradable. Sabía que sería así, después de tutto lo que habéis pasado juntos.\n@c0@"
  fr: "@aNera@bHarry a l'air d'être un type sympa. Mais je me doutais que ça serait le cas, à cause de tout\r\nce que vous avez traversé ensemble.\n@c0@"
  it: "@aNera@bRobert mi sembra una persona saggia ed equilibrata.\nDel resto, nella sua vita ha già affrontato e superato prove molto dure...\n@c0@"
  ja: "@a@bフローラ「ヘンリーさんって\n\tあなたと　苦労をなさっただけあって\n\tすてきな方ですわね。\n@c0@"
148:
  de: "@aNera@bTifortu kann von Glück sagen, dass es ihn hat. Solange er da ist, haben sie nichts zu befürchten.\n@c0@"
  en: "@aNera@bCoburg's lucky to have him. With him around,\r\nthey have nothing to fear.\n@c0@"
  es: "@aNera@bTrastámara tiene suerte de que esté aquí. Con él, no tienen niente que temer.\n@c0@"
  fr: "@aNera@bCobourg a de la chance de l'avoir. Tant qu'il sera là, ses habitants n'auront rien à craindre.\n@c0@"
  it: "@aNera@bIl Regno di Coburg si gioverà senz'altro delle qualità del principe Robert!\n@c0@"
  ja: "@a@bフローラ「あの方が　いらっしゃる限り\n\tこの国は　もう大丈夫でしょう。\n@c0@"
149:
  de: "@aBianca@bDu sprichst wohl nicht gern darüber.\n@c0@"
  en: "@aBianca@bYou never seem to want to talk much about it.\n@c0@"
  es: "@aBianca@bParece que no te gusta mucho hablar sobre el tema.\n@c0@"
  fr: "@aBianca@bTu ne sembles jamais avoir envie d'en parler.\n@c0@"
  it: "@aBianca@bNon mi hai mai raccontato cosa ti sia successo durante il periodo in cui sei stato costretto a lavorare come schiavo...\n@c0@"
  ja: "@a@bビアンカ「%a000090は　あまり\n\t話してくれなかったけど……\n@c0@"
150:
  de: "@aBianca@bAber ich kann sehen, dass du in der Zeit, als wir getrennt waren, sehr viel erlebt hast.\n@c0@"
  en: "@aBianca@bBut I can see that an awful lot happened to you in the time we were apart.\n@c0@"
  es: "@aBianca@bPero estoy segura de que te pasaron muchas cosas mientras no estábamos juntos, ¿sabes?\n@c0@"
  fr: "@aBianca@bMais je vois bien qu'il t'est arrivé beaucoup de choses pendant le temps où nous étions séparés.\n@c0@"
  it: "@aBianca@bPerò ho capito che hai dovuto affrontare dei momenti terribili.\n@c0@"
  ja: "@a@bビアンカ「私の　知らない間に\n\t本当に　いろいろなことがあったのね。\n@c0@"
151:
  de: "@aBianca@bIch kann dir gar nicht sagen, wie froh ich bin, dass du das alles lebend überstanden hast, %a000090.\n@c0@"
  en: "@aBianca@bI can't tell you how glad I am that you made it through everythin' alive, %a000090.\n@c0@"
  es: "@aBianca@bMe alegra mucho que salieses vivo de todo eso, %a000090.\n@c0@"
  fr: "@aBianca@bTu n'imagines pas à quel point je suis contente\nque tu sois sorti de tout ça vivant, %a000090.\n@c0@"
  it: "@aBianca@bPer fortuna, il peggio è passato.\nL'importante è che ora stai bene, %a000090...\n@c0@"
  ja: "@a@bビアンカ「%a000090が…　生きていてくれて\n\t本当に　よかった……。\n@c0@"
152:
  de: "@aNera@bWenn ich nur daran denke, dass Harry all diese Gefühle für sich behalten hat!\n@c0@"
  en: "@aNera@bTo think Harry kept all of those feelings to himself!\n@c0@"
  es: "@aNera@b¡Y pensare que Froilán se guardó tutti esos sentimientos per se!\n@c0@"
  fr: "@aNera@bDire que Harry avait gardé pour lui tous\nces sentimentsⓠ\n@c0@"
  it: "@aNera@bNon dev'essere stato facile per Robert tenersi dentro un peso simile per tanto tempo...\n@c0@"
  ja: "@a@bフローラ「あの　ヘンリーさんが\n\t胸のうちに　こんな思いを\n\t秘めていらっしゃったなんて……。\n@c0@"
153:
  de: "@aBianca@bVielleicht ist es, weil ich seine Nachricht gelesen habe, aber inzwischen ist Harry mir richtig ans Herz gewachsen.\n@c0@"
  en: "@aBianca@bI dunno if it's because I read that message of his, but Harry seems really special now.\n@c0@"
  es: "@aBianca@bQuizá sea por ese mensaje suyo que leí, pero Froilán me parece una persona muy especial, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe ne sais pas si c'est parce que j'ai lu son message, mais Harry me donne l'impression d'être vraiment quelqu'un de spécial, maintenant.\n@c0@"
  it: "@aBianca@bOra che ho letto il messaggio che ti ha scritto Robert, mi rendo conto che è una persona persino migliore di quanto credessi...\n@c0@"
  ja: "@a@bビアンカ「あのメッセージを\n\t見たからかしら…　ヘンリーさんが\n\tちょっと　かっこよく見えちゃうね。\n@c0@"
154:
  de: "@aBianca@bWas für ein wunderbares Andenken. Im Vergleich dazu sieht unser Andenken eigentlich nach nichts aus, findest du nicht?\n@c0@"
  en: "@aBianca@bWhat a great souvenir. Our weddin' souvenir dun't look like much in comparison, eh?\n@c0@"
  es: "@aBianca@b¡Qué bonito recuerdo! A su lado, el recuerdo de nuestra boda no es gran cosa, ¿eh?\n@c0@"
  fr: "@aBianca@bQuel magnifique présent. À côté, notre cadeau en souvenir de notre mariage semble bien petit, nonⓡ\n@c0@"
  it: "@aBianca@bChe splendido souvenir!\r\nArgh! Mi pesa dirlo, ma devo ammettere che è più bello delle bomboniere del nostro matrimonio... Ih ih ih!\n@c0@"
  ja: "@a@bビアンカ「ステキな　記念品ね。\n\tそれにくらべて　私たちの\n\t結婚記念品って　いったい……。\n@c0@"
155:
  de: "@aNera@bIch glaube, ich habe noch nie eine so erlesene Spieldose gesehen.\n@c0@"
  en: "@aNera@bI don't think I've ever seen such an exquisite\r\nmusic box.\n@c0@"
  es: "@aNera@bCredo que jamás he visto una caja de música tan delicada.\n@c0@"
  fr: "@aNera@bC'est la plus ravissante boîte à musique que j'aie jamais vue.\n@c0@"
  it: "@aNera@bNon avevo mai visto un carillon come questo...!\nÈ una vera meraviglia...\n@c0@"
  ja: "@a@bフローラ「こんなに　きれいな細工の\n\tオルゴールなんて\n\t見たことが　ありませんわ。\n@c0@"
156:
  de: "@aNera@bUnd sie ist mir umso lieber, weil sie als Dankeschön für die Gäste angefertigt wurde, die zur Feier gekommen sind.\n@c0@"
  en: "@aNera@bAnd it's all the better because it was made to thank people who'd come to share in their celebrations.\n@c0@"
  es: "@aNera@bY además la construyeron para dar las grazie a las personas que vinieron a compartir la ceremonia con ellos.\n@c0@"
  fr: "@aNera@bEt elle est d'autant plus belle qu'elle a été faite pour remercier les gens venus partager leur bonheur.\n@c0@"
  it: "@aNera@bMaria e Robert non avrebbero potuto scegliere una bomboniera più bella per il loro matrimonio!\n@c0@"
  ja: "@a@bフローラ「お祝いに　来てくださる\n\t方のために　心をこめて\n\t作らせてくださったのね。\n@c0@"
157:
  de: "@aBianca@bMaria ist so eine liebe und ordentliche Frau. Mit mir gar nicht zu vergleichen, was?\n@c0@"
  en: "@aBianca@bMaria is so sweet and so tidy. Not like me, eh?\n@c0@"
  es: "@aBianca@bMaría es muy dulce y compuesta. No es como yo, ¿eh?\n@c0@"
  fr: "@aBianca@bMaria est si douce et si ordonnée.\nTout le contraire de moi, heinⓡ\n@c0@"
  it: "@aBianca@bMaria è una donna bella, dolce ed elegante.\nÈ perfetta per il ruolo di Principessa di Coburg.\n@c0@"
  ja: "@a@bビアンカ「マリアさんって\n\tせいそで　かわいらしい人ね。\n\t私とは　大ちがい。\n@c0@"
158:
  de: "@aBianca@bTja, ich bin eben nicht der Stoff, aus dem Prinzessinnen sind!\n@c0@"
  en: "@aBianca@bLooks like I en't really princess material. Ha ha!\n@c0@"
  es: "@aBianca@bCreo que no tengo madera de princesa. ¡Ja, ja!\n@c0@"
  fr: "@aBianca@bOn dirait que je n'ai pas l'étoffe d'une princesse.\nHa ha haⓠ\n@c0@"
  it: "@aBianca@bIo, invece, della principessa non ho nulla.\nSono solo una ragazza di campagna...\n@c0@"
  ja: "@a@bビアンカ「やっぱり　私は　お姫さまには\n\tなれそうもないね。　うふふ。\n\tそれに　似合わないし！\n@c0@"
159:
  de: "@aBianca@bWenn du mich fragst, hätte Harry gar nichts dagegen, mal wieder auf Reisen zu gehen.\n@c0@"
  en: "@aBianca@bSounds to me like Harry might quite like to go off on his travels again.\n@c0@"
  es: "@aBianca@bA mí me parece que Froilán tiene ganas de volver a irse de viaje por ahí.\n@c0@"
  fr: "@aBianca@bOn dirait que Harry aimerait assez repartir\r\nen voyage.\n@c0@"
  it: "@aBianca@bMi è parso di capire che a Robert piacerebbe molto riprendere a viaggiare con te...\n@c0@"
  ja: "@a@bビアンカ「ヘンリーさんも　本当は\n\tまた　旅をしたいのかな？\n@c0@"
160:
  de: "@aBianca@bIch weiß, jetzt ist nicht ganz der richtige Zeitpunkt, aber es wäre doch schön, wenn ihr beiden mal wieder zusammen losziehen könntet, nicht?\n@c0@"
  en: "@aBianca@bI know the timin' en't any good at the minute, but it'd be good if you two could go off on an adventure again sometime in the future, eh?\n@c0@"
  es: "@aBianca@bYa sé que ahora no es el mejor momento, pero estaría bien que en el futuro él y tú os fuerais de aventuras otra vez, ¿no te parece?\n@c0@"
  fr: "@aBianca@bJe sais que ce n'est pas du tout le bon moment,\nmais peut-être que vous pourriez repartir tous les deux à l'aventure, un jourⓡ\n@c0@"
  it: "@aBianca@bCerto, in questo periodo non gli è possibile farlo, ma chissà che prima o poi voi due non viviate un'altra bella avventura insieme!\n@c0@"
  ja: "@a@bビアンカ「今すぐは　ムリだろうけど\n\tまたいつか　いっしょに\n\t旅が　できるといいね。\n@c0@"
161:
  de: "@aNera@bDann hat Maria das gleiche Stift besucht wie ich?\n@c0@"
  en: "@aNera@bSo Maria was once at the same abbey I went to?\n@c0@"
  es: "@aNera@b¿María estuvo en la stessa abadía en la que estuve yo?\n@c0@"
  fr: "@aNera@bAlors comme ça, Maria a été à la même abbaye\nque moiⓡ\n@c0@"
  it: "@aNera@bMaria ha vissuto per qualche tempo nella stessa abbazia dove ho studiato io, non è vero?\n@c0@"
  ja: "@a@bフローラ「マリアさんって　私がいた\n\t修道院に　いらしたことが\n\tあるんでしょう？\n@c0@"
162:
  de: "@aNera@bWas für ein Zufall, dass wir uns jetzt hier treffen!\n@c0@"
  en: "@aNera@bWhat a coincidence that we'd meet here again now!\n@c0@"
  es: "@aNera@b¡Qué coincidenza encontrase aquí!\n@c0@"
  fr: "@aNera@bQuelle drôle de coïncidence de se retrouver iciⓠ\n@c0@"
  it: "@aNera@bChe coincidenza ritrovarci qui adesso!\nEh, sì... Il mondo è piccolo!\n@c0@"
  ja: "@a@bフローラ「それが　今こうして\n\tお会いすることになるなんて\n\t本当に　ふしぎな　ご縁ですわね。\n@c0@"
163:
  de: "@aBianca@bOffenbar kommen wir nachts nicht ins Schloss hinein. Im Moment haben wir ohnehin Besseres zu tun.\n@c0@"
  en: "@aBianca@bLooks like we can't get inside the castle of\r\na night. We've got better things to be doin'\r\nat the moment, anyway.\n@c0@"
  es: "@aBianca@bParece que no vamos a poder entrar en el castillo de noche. Bueno, de todos modos tenemos cosas mejores que hacer, ¿sabes?\n@c0@"
  fr: "@aBianca@bOn dirait qu'il n'est pas possible d'entrer dans le château de nuit. De toute façon, nous avons mieux\r\nà faire, pour l'instant.\n@c0@"
  it: "@aBianca@bNon possiamo entrare nel castello di notte.\nBeh, tutto sommato non importa: abbiamo altro da fare...\n@c0@"
  ja: "@a@bビアンカ「夜は　お城に　はいれないのね。\n\t今は　大事な用があるんだし\n\tまた　今度　来ることにしましょうよ。\n@c0@"
164:
  de: "@aBianca@bEs sieht so aus, als kämen wir nicht ins Schloss hinein, was? Dann machen wir am besten für heute Feierabend.\n@c0@"
  en: "@aBianca@bLooks like we can't get inside the castle, eh?\r\nBest call it a night, then.\n@c0@"
  es: "@aBianca@bParece que no vamos a poder entrar en el castillo de noche, ¿eh?\r\nSerá mejor irse a dormir, entonces.\n@c0@"
  fr: "@aBianca@bOn dirait que nous ne pouvons pas pénétrer dans le château pour l'instant, heinⓡ Allons nous coucher, dans ce cas.\n@c0@"
  it: "@aBianca@bUhm, non si può entrare nel castello...\nDirei che è meglio lasciar perdere, almeno per stasera.\n@c0@"
  ja: "@a@bビアンカ「お城には　はいれないみたいね。\n\t私たちも　今日は　休みましょうか？\n@c0@"
165:
  de: "@aNera@bWollen wir die Nacht hier in Tifortu verbringen?\n@c0@"
  en: "@aNera@bShall we stay the night here in Coburg?\n@c0@"
  es: "@aNera@b¿Nos quedamos esta notte aquí en Trastámara?\n@c0@"
  fr: "@aNera@bEt si nous passions la nuit ici, à Cobourgⓡ\n@c0@"
  it: "@aNera@bVogliamo trascorrere la notte a Coburg?\n@c0@"
  ja: "@a@bフローラ「今夜は　ここで\n\t宿泊しますの？　ぽっ……。\n@c0@"
166:
  de: "@aBianca@bHarry und Maria scheinen ganz gut miteinander auszukommen.\n@c0@"
  en: "@aBianca@bSounds like Harry and Maria get on pretty well.\n@c0@"
  es: "@aBianca@bParece que Froilán y María se llevan bastante bien.\n@c0@"
  fr: "@aBianca@bHarry et Maria ont l'air de bien s'entendre.\n@c0@"
  it: "@aBianca@bRobert e Maria vivono felici l'uno accanto all'altra...\n@c0@"
  ja: "@a@bビアンカ「ヘンリーさんと　マリアさんは\n\tずいぶん　仲がいいみたいね。\n@c0@"
167:
  de: "@aBianca@bDie haben's gut. Vielleicht sollte ich mir auch einen Mann suchen...\nHa ha! War doch bloß 'n Witz!\n@c0@"
  en: "@aBianca@bLucky things. Maybe I should get married...\nHa ha! Only jokin'!\n@c0@"
  es: "@aBianca@b¡Qué suertudos! A lo mejor yo debería casarme...\r\n¡Ja, ja! ¡Era una broma!\n@c0@"
  fr: "@aBianca@bLes veinards. Peut-être que je devrais me marier, moi aussi... Ha haⓠ Je plaisanteⓠ\n@c0@"
  it: "@aBianca@bBuon per loro!\nUhm, e se mi sposassi anch'io?\nAh ah ah! Stavo solo scherzando!\n@c0@"
  ja: "@a@bビアンカ「いいなあ……。\n\t私も　誰かと　結婚しちゃおうかな。\n\t……うふふ　じょうだんよ！\n@c0@"
168:
  de: "@aNera@bMan fühlt sich hier gleich so wohl. Wie schön, lauter zufriedene Gesichter zu sehen!\n@c0@"
  en: "@aNera@bThe atmosphere here seems so relaxed.\r\nIt's nice to see people looking happy.\n@c0@"
  es: "@aNera@bEl ambiente es muy tranquilo aquí.\r\nLa gente tiene aspecto de ser molto felice.\n@c0@"
  fr: "@aNera@bL'ambiance semble tellement détendue ici.\r\nC'est bon de voir des gens qui ont l'air si heureux.\n@c0@"
  it: "@aNera@bL'atmosfera qui è serena e rilassata.\nÈ una bella sensazione...\n@c0@"
  ja: "@a@bフローラ「国の雰囲気が\n\tやさしくなりましたね。\n\tみなさん幸せそうで　なによりですわ。\n@c0@"
169:
  de: "@aBianca@bGuck mal! Eine Sternschnuppe! Vielleicht sollte ich mir wünschen, dass du zufrieden und glücklich wirst!\n@c0@"
  en: "@aBianca@bHey! A shootin' star! I could make a wish on it that you'll be nice and happy.\n@c0@"
  es: "@aBianca@b¡Eh! ¡Una estrella fugaz! Podría desear que tengas una vida feliz, ¿por qué no?\n@c0@"
  fr: "@aBianca@bOhⓠ Une étoile filanteⓠ Je pourrais en profiter pour faire le vœu que tu sois toujours heureux.\n@c0@"
  it: "@aBianca@bGuarda! Una stella cadente!\nDesidero... Desidero...\nDesidero che tu sia sempre felice...\n@c0@"
  ja: "@a@bビアンカ「あっ　流れ星！\n\t%a000090が　幸せになるように\n\tお祈りしてあげるね。\n@c0@"
170:
  de: "@aNera@bIch finde den Nachthimmel immer so wunderschön, wenn du bei mir bist.\n@c0@"
  en: "@aNera@bThe night sky always looks so beautiful when I'm with you.\n@c0@"
  es: "@aNera@bCuando estoy con te, el cielo nocturno es siempre muy bonito.\n@c0@"
  fr: "@aNera@bLe ciel nocturne paraît toujours si beau quand\r\nje suis avec toi.\n@c0@"
  it: "@aNera@bIl cielo di notte è uno spettacolo meraviglioso e, quando sono con te, mi sembra ancora più bello...\n@c0@"
  ja: "@a@bフローラ「あなたと　こうして見る夜空は\n\tいつにもまして　美しいですわ。\n@c0@"
171:
  de: "@aBianca@bIn letzter Zeit höre ich oft solch deprimierendes Geschwätz.\n@c0@"
  en: "@aBianca@bA lot of folk seem to be comin' out with depressin' things like that just lately.\n@c0@"
  es: "@aBianca@bÚltimamente hay mucha gente que cuenta cosas deprimentes como esa, ¿sabes?\n@c0@"
  fr: "@aBianca@bC'est fou le nombre de gens qui parlent de ce genre de choses déprimantes, en ce moment.\n@c0@"
  it: "@aBianca@bUltimamente, diverse persone sono preoccupate per il loro futuro del mondo.\nSpero che non stia per accadere nulla di male...\n@c0@"
  ja: "@a@bビアンカ「最近　ああいう\n\tくらい話が　多いわね……。\n@c0@"
172:
  de: "@aNera@bDas darf doch nicht wahr sein! Kaum sind wir verheiratet, schon reden die Leute vom Weltuntergang!\n@c0@"
  en: "@aNera@bOf all the luck! We're only just married, and yet people are saying the world's about to end already.\n@c0@"
  es: "@aNera@b¡Hay que tener mala suerte! Acabamos de casarnos y dicen que il mondo se va a acabar.\n@c0@"
  fr: "@aNera@bMince alorsⓠ On vient à peine de se marier et voilà que les gens racontent que c'est bientôt la fin du monde.\n@c0@"
  it: "@aNera@bCerto che sarebbe una bella sfortuna se arrivasse la fine del mondo proprio adesso che ci siamo sposati!\n@c0@"
  ja: "@a@bフローラ「せっかく　あなたと\n\t結婚できたのに　世界が長くないなんて\n\tあんまりですわ。\n@c0@"
173:
  de: "@aBianca@bDu fackelst nicht lange und gehst einfach gleich den Bund der Ehe ein, %a000090, ob du die Frau nun kennst oder nicht, was?\n@c0@"
  en: "@aBianca@bYou just leap straight into marriage whether you know the person or not, eh, %a000090?\n@c0@"
  es: "@aBianca@bAunque no conozcas a la persona, tú directo al matrimonio, ¿eh, %a000090?\n@c0@"
  fr: "@aBianca@bOn se précipite dans le mariage parfois sans même connaître la personne, hein, %a000090ⓡ \n@c0@"
  it: "@aBianca@bNon credo che potrei mai sposare una persona che non conosco a fondo.\nSono certa che mi capisci, %a000090...\n@c0@"
  ja: "@a@bビアンカ「%a000090は　つき合いも\n\t恋人もなしで　いきなり\n\t結婚しちゃうのよね……。\n@c0@"
174:
  de: "@aBianca@bMeinst du, das Häschenmädel hat überhaupt gemerkt, dass deine Frau direkt neben dir stand?\n@c0@"
  en: "@aBianca@bDo you think that bunny girl didn't even notice you had your wife standin' right next to you!?\n@c0@"
  es: "@aBianca@b¡¿Crees que esa conejita se ha dado cuenta de que tu mujer estaba de pie a tu lado?!\n@c0@"
  fr: "@aBianca@bTu crois que cette serveuse n'a même pas remarqué que tu avais ta femme juste à côté, franchementⓠⓑ\n@c0@"
  it: "@aBianca@bScommetto che quella ragazza non si è resa conto che c'era tua moglie accanto a te, caro.\nQuasi quasi vado a spiegarglielo a suon di pugni...\n@c0@"
  ja: "@a@bビアンカ「あの　バニーさんったら。\n\t私という　妻　の存在が\n\t目に　入らないのかしら？\n@c0@"
175:
  de: "@aNera@bWar ich deine erste Liebe, Schatz?\n@c0@"
  en: "@aNera@bWas I your first love, darling?\n@c0@"
  es: "@aNera@b¿Fui il tuo primo amore, caro mio?\n@c0@"
  fr: "@aNera@bMon chéri, est-ce que j'ai été ton premier amourⓡ\n@c0@"
  it: "@aNera@bCaro, io sono stata il tuo primo amore?\n@c0@"
  ja: "@a@bフローラ「あなたには\n\tお付き合いなさった方が\n\tいませんでしたの？\n@c0@"
176:
  de: "@aNera@bUnd du meine. Haben wir ein Glück, nicht?\n@c0@"
  en: "@aNera@bYou were mine too. Isn't that nice?\n@c0@"
  es: "@aNera@bTú también fuiste el mío. Qué bonito, ¿verdad?\n@c0@"
  fr: "@aNera@bToi aussi, tu as été le mien.\nC'est beau, tu ne trouves pasⓡ\n@c0@"
  it: "@aNera@bAnche tu lo sei stato per me...\n@c0@"
  ja: "@a@bフローラ「私もです。\n\t%a000090さんが　初めてですわ。\n\tぽっ……。\n@c0@"
177:
  de: "@aNera@bOh. Aha.\n@c0@"
  en: "@aNera@bOh. I see.\n@c0@"
  es: "@aNera@b¡Oh! Entiendo.\n@c0@"
  fr: "@aNera@bOh. Je vois...\n@c0@"
  it: "@aNera@bOh, capisco...\nBeh, non importa. Il passato è passato.\nQuello che conta è che adesso stiamo insieme.\n@c0@"
  ja: "@a@bフローラ「そ　そうですか……。\n@c0@"
178:
  de: "@aBianca@bDu gehst? Na schön. Da kann ich dich wohl nicht aufhalten.\n@c0@"
  en: "@aBianca@bYou're goin'!? Fine! I s'pose I can't stop you.\n@c0@"
  es: "@aBianca@b¡¿Que te vas?! ¡Bueno, vale! Supongo que no puedo impedírtelo.\n@c0@"
  fr: "@aBianca@bTu y vasⓡⓐ Parfaitⓠ J'imagine que je ne peux pas t'en empêcher.\n@c0@"
  it: "@aBianca@bNon vorrai mica andare a quell'appuntamento, eh?!\nAh, sì?!\nFa' come ti pare! Non sarò certo io a fermarti...\n@c0@"
  ja: "@a@bビアンカ「行くの？\n\tまあ　私には　とめる権利はないから\n\tどうぞ　ご自由に！\n@c0@"
179:
  de: "@aBianca@bWenn du willst, dass man dir die Zukunft voraussagt, wieso fragst du dann nicht mich?\n@c0@"
  en: "@aBianca@bIf you want your fortune tellin', why don't you just ask me?\n@c0@"
  es: "@aBianca@bYo te puedo leer la ⓕbuena aventuraⓖ esa también, ¿sabes?\n@c0@"
  fr: "@aBianca@bSi tu as envie qu'on te prédise l'avenir, pourquoi tu ne me le demandes pas à moiⓡ\n@c0@"
  it: "@aBianca@bMa come ti salta in mente di farti leggere il futuro da una sconosciuta incontrata per strada?!\n@c0@"
  ja: "@a@bビアンカ「ぱふぱふ　なら\n\t私がいくらでも　してあげるのに！\n@c0@"
180:
  de: "@aNera@bOh. Du wirst dich also mit ihr treffen?\n@c0@"
  en: "@aNera@bOh, you're going to go and have your fortune told, are you?\n@c0@"
  es: "@aNera@b¡Oh! ¿Ma vas a seguir adelante con eso de la buenaventura?\n@c0@"
  fr: "@aNera@bOh, alors tu vas aller à cette séance de voyanceⓡ\n@c0@"
  it: "@aNera@bHai intenzione di incontrare quella ragazza, non è così?\n@c0@"
  ja: "@a@bフローラ「あら　あなた\n\t待ち合わせを　なさるのね。\n@c0@"
181:
  de: "@aNera@bAber mich nimmst du doch mit, oder? He he.\n@c0@"
  en: "@aNera@bYou will take me with you, won't you? He he.\n@c0@"
  es: "@aNera@bPero me llevarás con te, ¿verdad? Ji, ji.\n@c0@"
  fr: "@aNera@bTu vas m'emmener avec toi, n'est-ce pasⓡ Hi hi.\n@c0@"
  it: "@aNera@bD'accordo.\nAllora verrò con te.\nEh eh eh!\n@c0@"
  ja: "@a@bフローラ「私も　いっしょに\n\t連れて行ってくださる？\n\tうふふ。\n@c0@"
182:
  de: "@aBianca@bWas hast du denn gedacht, was passieren würde, wenn sie dir die Zukunft voraussagt?\n@c0@"
  en: "@aBianca@bWell, what were you expectin' to happen when you got your fortune told, eh?\n@c0@"
  es: "@aBianca@b¡Con esa cara que pones, me pregunto qué esperabas que te dijese!\n@c0@"
  fr: "@aBianca@bTu devais sans doute attendre quelque chose de particulier en te faisant prédire l'avenir, nonⓡ\n@c0@"
  it: "@aBianca@bUhm, hai un'espressione strana...\nDi' un po'...\nNon ti piacerà mica quella smorfiosetta, eh?!\n@c0@"
  ja: "@a@bビアンカ「%a000090ったら　そんな顔して\n\tいったい　どんな　ぱふぱふを\n\t想像していたの？\n@c0@"
183:
  de: "@aNera@bEs ist schön zu sehen, wie jemand so völlig in seiner Arbeit aufgeht.\n@c0@"
  en: "@aNera@bIt's nice to see someone so devoted to their work.\n@c0@"
  es: "@aNera@bQué bonito es ver a alguien tan dedicado al suo lavoro.\n@c0@"
  fr: "@aNera@bC'est bien de voir des personnes aussi investies dans leur travail.\n@c0@"
  it: "@aNera@bQuella ragazza sembra avere le idee chiare sul suo futuro, non trovi?\n@c0@"
  ja: "@a@bフローラ「仕事に熱心な女性って\n\tみりょくてき　ですわね。\n@c0@"
184:
  de: "@aBianca@bMeine Güte! Da werden Erinnerungen wach! Ich muss etwa sieben gewesen sein, als ich das letzte Mal hier war. Schön, dass alles immer noch so ist wie früher.\n@c0@"
  en: "@aBianca@bBlimey! This takes me back! It must be seven\r\nyears since I was last here. It's good to see it\r\nen't changed much.\n@c0@"
  es: "@aBianca@b¡Cuernos! ¡Qué recuerdos! Debe de hacer siete años desde la última vez que estuve aquí. Pero no ha cambiado mucho, ¿sabes?\n@c0@"
  fr: "@aBianca@bBon sangⓠ Ça faisait un bailⓠ Ça doit bien faire\nsept ans que je n'étais pas revenue ici. Ça n'a pas beaucoup changé, en fait.\n@c0@"
  it: "@aBianca@bErano almeno sette anni che non venivo in questo posto!\nUhm, non mi pare che sia cambiato molto...\n@c0@"
  ja: "@a@bビアンカ「うわ～　なつかしい！\n\t７年ぶりくらいかしら？\n\tあまり　変わってなくて　うれしいな。\n@c0@"
185:
  de: "@aBianca@bDanke, dass du mich hierher zurückgebracht hast, %a000090. Es ist schön, das alles noch einmal wiederzusehen.\n@c0@"
  en: "@aBianca@bThanks for bringin' me back here, %a000090.\nIt's nice to see the old place again.\n@c0@"
  es: "@aBianca@bGracias por traerme aquí de nuevo, %a000090.\nEs agradable volver a este sitio.\n@c0@"
  fr: "@aBianca@bMerci de m'avoir ramenée ici, %a000090.\nÇa me fait plaisir de revoir cet endroit.\n@c0@"
  it: "@aBianca@bTi ringrazio per avermi portata qui, %a000090.\nSono contenta di rivedere questi luoghi...\n@c0@"
  ja: "@a@bビアンカ「ありがとう。\n\tこの町を見られて　良かったわ。\n@c0@"
186:
  de: "@aBianca@bAber du hast gerade Wichtigeres zu tun. Wir sollten zusehen, dass wir weiterkommen.\n@c0@"
  en: "@aBianca@bBut you've got more important things to be doin'.\r\nWe should get a move on.\n@c0@"
  es: "@aBianca@bPero tienes cosas más importantes que hacer.\r\nSerá mejor ponerse en marcha, ¿sabes?\n@c0@"
  fr: "@aBianca@bMais tu as des choses plus importantes à faire.\r\nNous devrions nous mettre en route.\n@c0@"
  it: "@aBianca@bOra, però, non possiamo permetterci di fare i turisti: abbiamo cose ben più importanti a cui pensare!\n@c0@"
  ja: "@a@bビアンカ「でも　%a000090には\n\t大事な用があるんだから\n\tもう　もどりましょう。\n@c0@"
187:
  de: "@aBianca@bMeine Familie lebt hier zwar nicht mehr, aber es ist trotzdem schön, wieder hier zu sein.\n@c0@"
  en: "@aBianca@bMy family en't around here any more, but it's still nice to be back for a while.\n@c0@"
  es: "@aBianca@bMi familia ya no está por aquí, pero me ha gustado volver.\n@c0@"
  fr: "@aBianca@bMa famille ne vit plus ici, mais c'est agréable\r\nd'y passer un moment.\n@c0@"
  it: "@aBianca@bLa mia famiglia non vive più qui da tempo, ma questo luogo avrà sempre un posto speciale nel mio cuore...\n@c0@"
  ja: "@a@bビアンカ「私の家は　もう　ないけど\n\tせっかく寄ったんだから\n\tゆっくりしていきましょうよ。\n@c0@"
188:
  de: "@aBianca@bAch, da kommen Erinnerungen hoch. Weißt du noch, wie wir %a001210, die kleine Säbelzahnkatze, am Teich vor ihren Quälgeistern gerettet haben?\n@c0@"
  en: "@aBianca@bI've got a lot of memories of this place. Remember when we rescued little %a001210 from them kids bullyin' him by the pond?\n@c0@"
  es: "@aBianca@bEste sitio me trae muchos recuerdos. ¿Te acuerdas cuando rescatamos a %a001210 de los niños que le estaban martirizando junto al estanque?\n@c0@"
  fr: "@aBianca@bJ'ai plein de souvenirs de cet endroit. Tu te souviens de la fois où nous avons sauvé le petit %a001210 de ces gamins qui l'embêtaient, à côté de la mareⓡ\n@c0@"
  it: "@aBianca@bQui ho tanti ricordi...\nCome quella volta che salvammo %a001210 da quei ragazzacci! Sono certa che non l'hai dimenticato.\n@c0@"
  ja: "@a@bビアンカ「なつかしいな。　池の所で\n\t子ネコみたいだった　%a001210ちゃんが\n\tいじめられていたのよね。\n@c0@"
189:
  de: "@aNera@bWittenhausen ist wirklich hübsch. So beschaulich.\n@c0@"
  en: "@aNera@bRoundbeck's a lovely little town. It's just so relaxed.\n@c0@"
  es: "@aNera@bGolfo Blanco es un villaggio encantador. Es tan tranquilo...\n@c0@"
  fr: "@aNera@bBlanchecombe est une très jolie petite ville.\r\nTout est si calme.\n@c0@"
  it: "@aNera@bBlankenburg è un villaggio piccolo e tranquillo.\nSi respira un'atmosfera rilassata, non trovi?\n@c0@"
  ja: "@a@bフローラ「小さいけれど\n\t落ちついていて　いい町ですわね。\n@c0@"
190:
  de: "@aBianca@bDein Teleportationszauber ist wirklich praktisch, nicht? Er transportiert einen im Nu von einem Ort zum andern.\n@c0@"
  en: "@aBianca@bThat Zoom spell of yours is a bit of a bonus, eh? You can get from one place to another in no time at all.\n@c0@"
  es: "@aBianca@bEse conjuro tuyo, Telerregreso, es de lo más práctico, ¿eh? Puedes moverte de un lado a otro en un pispás.\n@c0@"
  fr: "@aBianca@bLe sort Téléportation que tu utilises est vraiment pratique, heinⓡ Tu peux aller d'un lieu à un autre\nen un rien de temps.\n@c0@"
  it: "@aBianca@bCerto che l'incantesimo Teletrasporto è una manna dal cielo, eh? Ti permette di andare ovunque in una frazione di secondo!\n@c0@"
  ja: "@a@bビアンカ「それにしても　%a000090の\n\t呪文って　便利ね。　あっという間に\n\tいろいろな場所へ　行けて。\n@c0@"
191:
  de: "@aNera@bHier also ist Bianca aufgewachsen?\n@c0@"
  en: "@aNera@bSo this is the place Bianca grew up in, is it?\n@c0@"
  es: "@aNera@bAsí que Bianca se crió en este lugar, ¿vero?\n@c0@"
  fr: "@aNera@bAlors c'est ici que Bianca a grandiⓡ\n@c0@"
  it: "@aNera@bQuesto è il villaggio dove è cresciuta Bianca, dico bene?\n@c0@"
  ja: "@a@bフローラ「ここが　ビアンカさんが\n\t生まれ育った町なのね。\n@c0@"
192:
  de: "@aBianca@bEs war sehr tapfer von ihm, in einer solchen Zeit aus Tifortu davonzulaufen.\n@c0@"
  en: "@aBianca@bHe must've bin pretty brave to run away from Coburg back in the day.\n@c0@"
  es: "@aBianca@bTuvo que ser muy vailente para salir huyendo de Trastámara en aquellos tiempos.\n@c0@"
  fr: "@aBianca@bIl devait être plutôt courageux pour avoir fui Cobourg à ce moment-là.\n@c0@"
  it: "@aBianca@bCerto che ha avuto coraggio a disertare!\nProbabilmente non voleva eseguire gli orribili ordini che gli avevano impartito...\n@c0@"
  ja: "@a@bビアンカ「あの頃の　ラインハットから\n\t逃げ出してくるんなんて\n\tなかなか　勇気が　あるじゃない。\n@c0@"
193:
  de: "@aBianca@bEr ist ziemlich gewachsen seit damals, als er dauernd %a001210 geärgert hat.\n@c0@"
  en: "@aBianca@bHe's obviously grown up a lot since them days as a kid when he was pickin' on %a001210 all the while.\n@c0@"
  es: "@aBianca@bHa crecido mucho desde que fastidiaba a %a001210 todo el rato, cuando era un crío, ¿sabes?\n@c0@"
  fr: "@aBianca@bIl a beaucoup grandi depuis l'époque où il embêtait tout le temps %a001210. Ce n'est plus le gamin d'autrefois.\n@c0@"
  it: "@aBianca@bÈ molto maturato rispetto a quando torturava quell'adorabile bestiolina di %a001210... \n@c0@"
  ja: "@a@bビアンカ「%a001210ちゃんを\n\tいじめていた頃から　くらべると\n\tこの人も　だいぶ進歩したようね。\n@c0@"
194:
  de: "@aNera@bSoldaten, die zu jener Zeit aus Tifortu desertierten, wurden hingerichtet, wenn sie gefasst wurden. Er hat Glück, dass er noch am Leben ist.\n@c0@"
  en: "@aNera@bSoldiers who escaped from Coburg in those days were executed if they were caught. He's lucky to be alive.\n@c0@"
  es: "@aNera@bLos soldados que huían de Trastámara en aquella época eran ejecutados si los atrapaban. Veramente, tiene suerte de estar vivo.\n@c0@"
  fr: "@aNera@bÀ l'époque, les soldats qui désertaient Cobourg et\r\nse faisaient reprendre étaient exécutés. Il a de la chance d'être encore en vie.\n@c0@"
  it: "@aNera@bQuel tipo ha avuto molto coraggio, e anche una buona dose di fortuna! Di solito i disertori vengono messi a morte, se vengono catturati!\n@c0@"
  ja: "@a@bフローラ「昔の　ラインハットでは\n\t脱走した兵士は　処刑されたそうです。\n\tこの人は　運が良かったんですわ。\n@c0@"
195:
  de: "@aBianca@bAn den kann ich mich erinnern! Das war einer von denen, die damals %a001210 gequält haben!\n@c0@"
  en: "@aBianca@bI remember him! He's one of the ones who used to pick on %a001210 all them years ago!\n@c0@"
  es: "@aBianca@b¡Me acuerdo de él! ¡Es uno de los que se metía con %a001210 hace tantos años!\n@c0@"
  fr: "@aBianca@bJe me souviens de luiⓠ C'est l'un des gamins qui embêtaient %a001210, il y a des annéesⓠ \n@c0@"
  it: "@aBianca@bMi ricordo di lui!\nÈ uno di quei teppistelli che tormentava %a001210 tanti anni fa!\n@c0@"
  ja: "@a@bビアンカ「あの人　おぼえてるわ。\n\t昔　%a001210ちゃんを　いっぱい\n\tいじめていたほうの　人だよね。\n@c0@"
196:
  de: "@aNera@bBis hier hat es sich offenbar noch nicht herumgesprochen, dass du bei der Sache die Finger im Spiel hattest, was? He he!\n@c0@"
  en: "@aNera@bThe people here don't seem to have heard of the hand you had in things, do they? He he!\n@c0@"
  es: "@aNera@bSemrba que estas personas no saben niente del tuo papel en lo que sucedía, ¿verdad? ¡Ji, ji!\n@c0@"
  fr: "@aNera@bLes gens d'ici ne semblent pas avoir entendu parler de ta participation aux événements, n'est-ce pasⓡ Hi hiⓠ\n@c0@"
  it: "@aNera@bGià...\nChissà chi devono ringraziare, eh?\nAh ah ah!\n@c0@"
  ja: "@a@bフローラ「この町の人は\n\tあなたのかつやくを　知らないのね。\n\tうふふ。\n@c0@"
197:
  de: "@aBianca@bIch kann mich gar nicht daran erinnern, dass sich hier jemand mit Legenden ausgekannt hätte. Hmm...\n@c0@"
  en: "@aBianca@bI dun't remember anyone here knowin'\r\nabout legends. Hmm...\n@c0@"
  es: "@aBianca@bNo recuerdo que nadie supiese nada de ninguna leyenda por aquí. Mmm...\n@c0@"
  fr: "@aBianca@bJe ne me souviens pas que quiconque ici connaisse des légendes. Mmm...\n@c0@"
  it: "@aBianca@bUhm, non ricordavo che da queste parti vivesse un esperto di miti e leggende...\n@c0@"
  ja: "@a@bビアンカ「伝説に　くわしい人なんて\n\tこの町に　いたかしら？\n\tう～ん……。\n@c0@"
198:
  de: "@aNera@bErstaunlich, wie weit sich die Gerüchte über die legendären Waffen und die Rüstung verbreitet haben.\n@c0@"
  en: "@aNera@bIt's surprising to see how far and wide rumours of the legendary weapons and armour have spread.\n@c0@"
  es: "@aNera@bEs sorprendente ver hasta qué punto se han extendido i rumori sobre las armas y la armadura legendarias.\n@c0@"
  fr: "@aNera@bC'est surprenant de voir à quelle vitesse et jusqu'où les rumeurs sur les armes et armures légendaires se sont répandues.\n@c0@"
  it: "@aNera@bAh, le armi leggendarie...\nStorie del genere si raccontano in tutti i paesi del mondo, ma non so quanto siano veritiere...\n@c0@"
  ja: "@a@bフローラ「伝説の武器の　うわさって\n\t思った以上に　世界各地に\n\t広まっているんですのね。\n@c0@"
199:
  de: "@aBianca@bIch hätte nicht gedacht, dass sich hier noch jemand an mich erinnert. Wie nett, den Alten wiederzusehen!\n@c0@"
  en: "@aBianca@bI didn't think there'd be anyone here who'd remember me any more. It's nice to see the old stick.\n@c0@"
  es: "@aBianca@bCreía que ya nadie se acordaría de mí aquí. Es agradable ver a la gente de entonces, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe ne pensais pas que quelqu'un ici se souviendrait encore de moi. C'est chouette d'avoir revu ce vieux bonhomme.\n@c0@"
  it: "@aBianca@bNon credevo che i miei vecchi compaesani mi avrebbero riconosciuta...\nÈ bello vedere che si ricordano ancora di me! \n@c0@"
  ja: "@a@bビアンカ「私を　知ってる人なんて\n\tもう　いないと　思ってたけど\n\tおじいさんに会えて　うれしかったわ。\n@c0@"
200:
  de: "@aNera@bDas also ist das Haus, in dem Bianca aufgewachsen ist.\n@c0@"
  en: "@aNera@bSo this is the house Bianca grew up in.\n@c0@"
  es: "@aNera@bAsí que Bianca creció en questa casa.\n@c0@"
  fr: "@aNera@bAlors c'est dans cette maison que Bianca a grandi.\n@c0@"
  it: "@aNera@bQuesta è la casa dove viveva la famiglia di Bianca?\n@c0@"
  ja: "@a@bフローラ「ここが　ビアンカさんの\n\t生まれ育った家でしたのね。\n@c0@"
201:
  de: "@aBianca@bEs ist schön, wieder hier zu sein, aber wir haben nicht die Zeit, uns hier lange aufzuhalten. Wir sollten besser aufbrechen.\n@c0@"
  en: "@aBianca@bIt's nice to be back again, but we dun't have time to hang about. We'd better get goin'.\n@c0@"
  es: "@aBianca@bEs agradable estar aquí de nuevo, pero no tenemos tiempo que perder. Será mejor que nos pongamos en marcha, ¿sabes?\n@c0@"
  fr: "@aBianca@bC'est agréable d'être revenue, mais nous n'avons pas le temps de traîner. Nous ferions mieux de partir.\n@c0@"
  it: "@aBianca@bMi piacerebbe restar qui ancora qualche giorno, ma non possiamo perdere tempo.\nForza, andiamo.\n@c0@"
  ja: "@a@bビアンカ「なつかしいけど\n\t今は　ゆっくりできないわ。\n\tもう　行きましょう。\n@c0@"
202:
  de: "@aBianca@bHier zu sein erinnert mich an meine Mutter, darum fühle ich mich gerade ein wenig verletzlich. Und dann willst du auch noch heiraten...\n@c0@"
  en: "@aBianca@bBein' here reminds me of Mum, so I feel a bit\r\nfragile. And on top of that, you're goin' off and gettin' married...\n@c0@"
  es: "@aBianca@bEste lugar me recuerda a mi madre, y eso me pone un poco triste. Y encima, tú vas a casarte...\n@c0@"
  fr: "@aBianca@bCet endroit me rappelle maman, alors je me sens un peu vulnérable. Et par-dessus le marché, tu t'en vas pour te marier...\n@c0@"
  it: "@aBianca@bSto pensando alla mia povera mamma e sento un vuoto insopportabile dentro di me.\nCome se non bastasse, tu stai per sposarti...\n@c0@"
  ja: "@a@bビアンカ「ここにいると　お母さんを\n\t思い出すし…　%a000090は\n\tもうすぐ　結婚しちゃうし………\n@c0@"
203:
  de: "@aBianca@bMeine Güte! Was rede ich denn da? Daran bist nur du schuld, weil du mich hierher gebracht und ganz sentimental gemacht hast!\n@c0@"
  en: "@aBianca@bBlimey! What am I on about!? I blame you for bringin' me here and gettin' me all emotional!\n@c0@"
  es: "@aBianca@b¡Cuernos! ¿De qué estoy hablando? ¡Es culpa tuya por haberme traído aquí y haberme puesto los sentimientos a flor de pie!\n@c0@"
  fr: "@aBianca@bBon sangⓠ Mais qu'est-ce que je raconteⓠⓑ\nTu n'aurais jamais dû m'emmener ici, je suis\ntout émue, maintenantⓠ\n@c0@"
  it: "@aBianca@bScusami, ho avuto un attimo di sconforto...\n@c0@"
  ja: "@a@bビアンカ「あはは　なに言ってるんだろ。\n\tもう！　%a000090が　寄り道して\n\t感傷に　ひたらせたりするからよ。\n@c0@"
204:
  de: "@aBianca@bSchön zu sehen, dass alles so gut in Schuss gehalten wird. Die Leute tun wirklich, was sie können, nicht?\n@c0@"
  en: "@aBianca@bIt's great to see the place lookin' so good. They're really workin' hard to keep it nice, eh?\n@c0@"
  es: "@aBianca@bEs genial ver que todo tiene tan buen aspecto. Se lo toman muy en serio, ¿eh?\n@c0@"
  fr: "@aBianca@bC'est super de voir que tout va bien ici.\nIls travaillent vraiment dur pour entretenir\ncet endroit, heinⓡ\n@c0@"
  it: "@aBianca@bQuesto posto è quasi più bello di come lo ricordavo...!\n@c0@"
  ja: "@a@bビアンカ「うれしいな…\n\tどこも　ピカピカ。\n\tきれいに　してくれているのね……。\n@c0@"
205:
  de: "@aBianca@bAlles hier erinnert mich sehr an meine Mutter.\n@c0@"
  en: "@aBianca@bBein' here really reminds me of Mum.\n@c0@"
  es: "@aBianca@bEste sitio me recuerda mucho a mi madre.\n@c0@"
  fr: "@aBianca@bÇa me rappelle maman, quand je suis ici.\n@c0@"
  it: "@aBianca@bSto pensando a mia madre...\n@c0@"
  ja: "@a@bビアンカ「ここにいると　お母さんを\n\t思い出しちゃうな……。\n@c0@"
206:
  de: "@aBianca@bSie war immer so stark. Es war ein solcher Schock, als diese Krankheit sie plötzlich dahinraffte.\n@c0@"
  en: "@aBianca@bShe was always such a strong woman. It was a\r\nreal shock when that illness wiped her out all\r\nof a sudden.\n@c0@"
  es: "@aBianca@bSiempre fue una mujer muy fuerte. Me causó mucha impresión cuando esa enfermedad se la llevó por delante así de pronto, ¿sabes?\n@c0@"
  fr: "@aBianca@bElle a toujours été si forte. Ça a vraiment été un choc quand la maladie l'a emportée si soudainement.\n@c0@"
  it: "@aBianca@bEra una donna molto forte.\nNessuno di noi si aspettava che una malattia potesse strapparcela così, all'improvviso...\n@c0@"
  ja: "@a@bビアンカ「あんなに　元気だったのに\n\tちょっと　カゼを　こじらせたくらいで\n\t死んでしまうなんて……。\n@c0@"
207:
  de: "@aNera@bWas für eine hübsche kleine Herberge. Man sieht es ihr richtig an, dass sie der ganze Stolz ihrer Bewohner ist.\n@c0@"
  en: "@aNera@bWhat a delightful little inn. You can really see how it's a labour of love for the owners.\n@c0@"
  es: "@aNera@bQué posada más affascinante. Se nota que los propietarios la cuidan con tutto il suo amore.\n@c0@"
  fr: "@aNera@bQuelle adorable petite auberge. On voit vraiment que les propriétaires aiment ce qu'ils font.\n@c0@"
  it: "@aNera@bChe carina questa locanda!\nI proprietari devono curarla fin nei minimi dettagli, a giudicare da quant'è pulita e ordinata...\n@c0@"
  ja: "@a@bフローラ「きれいな宿ですわね。\n\t宿主の手入れが\n\t行きとどいていますわ。\n@c0@"
208:
  de: "@aBianca@bHach... riecht das gut! Lustig, dass die Trauben meiner Mutter zu Wittenhausens großer regionaler Spezialität geworden sind!\n@c0@"
  en: "@aBianca@bWhat a great smell! How funny that Mum's grapes ended up bein' Roundbeck's big local speciality!\n@c0@"
  es: "@aBianca@b¡Qué bien huele! ¡Es curioso que las uvas de mi madre se convirtiesen en la especialidad local de Golfo Blanco!\n@c0@"
  fr: "@aBianca@bQuelle bonne odeurⓠ C'est drôle que les raisins de maman aient fini par devenir la grande spécialité de Blanchecombeⓠ\n@c0@"
  it: "@aBianca@bChe buon profumo! Aspetta un attimo...\nRiconosco quest'odore! Ma certo! È l'uva che coltivava mia madre! Questa sì che è una sorpresa!\n@c0@"
  ja: "@a@bビアンカ「いいにおい……。\n\tお母さんの育てたぶどうが\n\tこの町の　名物になっていたのね……。\n@c0@"
209:
  de: "@aNera@bDer Duft wirkt so entspannend! Ich könnte auf der Stelle einschlafen.\n@c0@"
  en: "@aNera@bThat smell relaxes you in an instant. I think it could send me to sleep right in the middle of the day!\n@c0@"
  es: "@aNera@bEse odore te relaja en un momento. ¡Credo que podría hacerme dormir en mitad del día!\n@c0@"
  fr: "@aNera@bCette odeur vous détend en une seconde. Je crois qu'elle pourrait me faire dormir même au beau milieu de la journéeⓠ\n@c0@"
  it: "@aNera@bChe profumo rilassante!\nSolo a sentirlo mi viene voglia di schiacciare un pisolino...\n@c0@"
  ja: "@a@bフローラ「ほっとする　においですね。\n\tこれがあったら　私\n\t昼間でも　ねられそうですわ。\n@c0@"
210:
  de: "@aBianca@bOffenbar erinnert sie sich nicht an mich. Ich habe mich wohl sehr verändert, schließlich war ich damals noch ein Kind.\n@c0@"
  en: "@aBianca@bLooks like she dun't remember me. I s'pose I've changed quite a lot since then because I was just\r\na kid.\n@c0@"
  es: "@aBianca@bParece que no se acuerda de mí. Supongo que he cambiado mucho desde entoncesⓓ al fin y al cabo, solo era una cría, ¿sabes?\n@c0@"
  fr: "@aBianca@bElle ne se souvient pas de moi, apparemment.\r\nJ'imagine que j'ai beaucoup changé, je n'étais\r\nqu'une enfant, à l'époque.\n@c0@"
  it: "@aBianca@bPare proprio che quella donna non si ricordi di me. Del resto, ci sarebbe da stupirsi del contrario: l'ultima volta che mi ha vista ero solo una bambina...\n@c0@"
  ja: "@a@bビアンカ「おかみさんは　私を\n\tおぼえてないみたいね。\n\tあの頃は小さかったし　しかたないか。\n@c0@"
211:
  de: "@aBianca@bHier steckt auch alles voller Erinnerungen. Weißt du noch, wie wir hier früher immer Verstecken gespielt haben?\n@c0@"
  en: "@aBianca@bThis place is full of memories too. Remember all the times we played hide and seek here?\n@c0@"
  es: "@aBianca@bEste sitio también está lleno de recuerdos. ¿Te acuerdas de cuando jugábamos al escondite aquí?\n@c0@"
  fr: "@aBianca@bCet endroit aussi me rappelle un tas de souvenirs.\nTu te souviens de toutes les fois où on a joué à\ncache-cache iciⓡ\n@c0@"
  it: "@aBianca@bQuesto posto mi riporta alla mente dolci immagini del passato...\nRicordi quando giocavamo a nascondino?\n@c0@"
  ja: "@a@bビアンカ「ここも　なつかしいな……。\n\tよくここで　かくれんぼしたよね？\n@c0@"
212:
  de: "@aBianca@bFrüher hast du dich immer im Bad versteckt. Es war ganz leicht, dich zu finden!\n@c0@"
  en: "@aBianca@bYou always used to go and hide in the bath. It was dead easy to find you!\n@c0@"
  es: "@aBianca@bTú siempre solías esconderte en el baño. ¡Estaba chupado encontrarte!\n@c0@"
  fr: "@aBianca@bTu allais toujours te cacher dans la baignoire. C'était plus que facile de te retrouverⓠ\n@c0@"
  it: "@aBianca@bTi nascondevi sempre in bagno, e io ti trovavo subito!\nEh eh eh!\n@c0@"
  ja: "@a@bビアンカ「%a000090ったら　いつも\n\tお風呂に　かくれるんだもん。\n\tすごく　見つけやすかったわ。\n@c0@"
213:
  de: "@aBianca@bNa ja. Du warst damals ja wirklich noch sehr klein.\n@c0@"
  en: "@aBianca@bOh well. I s'pose you were only really young\r\nback then.\n@c0@"
  es: "@aBianca@bEn fin, no eras más que un niño entonces, ¿sabes?\n@c0@"
  fr: "@aBianca@bOui, c'est vrai que tu étais vraiment très jeune\r\nà l'époque.\n@c0@"
  it: "@aBianca@bAh, non te ne ricordi?! Secondo me stai solo fingendo per non ammettere che vincevo sempre io!\nEri una vera schiappa! Ih ih ih!\n@c0@"
  ja: "@a@bビアンカ「そうよね。　\n\tあの頃は　すごく小さかったもんね。\n\tおぼえてないわよね……。\n@c0@"
214:
  de: "@aBianca@bWie schade, dass du nie die Trauben meiner Mutter probiert hast.\n@c0@"
  en: "@aBianca@bIt's a shame you never got to try any of\r\nMum's grapes.\n@c0@"
  es: "@aBianca@bQué pena que nunca llegaras a probar las uvas de mi madre, ¿sabes?\n@c0@"
  fr: "@aBianca@bC'est dommage que tu n'aies jamais goûté\r\naux raisins de maman.\n@c0@"
  it: "@aBianca@bÈ un vero peccato che tu non abbia mai assaggiato l'uva di mia madre...\n@c0@"
  ja: "@a@bビアンカ「そういえば\n\t%a000090には　ぶどうを　食べさせて\n\tあげられなかったね。　ざんねんだわ。\n@c0@"
215:
  de: "@aNera@bSicher verbinden sich bei dir viele Erinnerungen mit diesem Ort, %a000090. Da fühle ich mich fast ein bisschen ausgeschlossen.\n@c0@"
  en: "@aNera@bYou must have a lot of memories of this place, %a000090. I can't help feeling a little bit jealous.\n@c0@"
  es: "@aNera@bEste lugar te debe de traer molti ricordi, %a000090. Veramente, no puedo evitar sentirme un poco celosa.\n@c0@"
  fr: "@aNera@bTu dois avoir plein de souvenirs de cet endroit, %a000090. Je ne peux pas m'empêcher d'être un peu jalouse.\n@c0@"
  it: "@aNera@bQuesti luoghi susciteranno in te molti ricordi, %a000090.\nSai una cosa? Sono un po' gelosa...\n@c0@"
  ja: "@a@bフローラ「この宿には　%a000090さんの\n\t思い出が　あふれているんでしょうね。\n\t私　少し　ヤキモチをやきそうですわ。\n@c0@"
216:
  de: "@aBianca@bDann gibt's hier also jemanden, der sich auskennt? Vielleicht sollten wir den mal ausfragen.\n@c0@"
  en: "@aBianca@bSo there's someone here who's in the know, eh? We should go and pick his brains.\n@c0@"
  es: "@aBianca@bAsí que aquí hay alguien que sabe algo, ¿eh? Tendríamos que intentar sonsacarle todo.\n@c0@"
  fr: "@aBianca@bAlors il y a quelqu'un ici qui sait des choses, heinⓡ\nOn devrait aller lui demander conseil.\n@c0@"
  it: "@aBianca@bUhm, pare che qualcuno possa aiutarci...\nDovremmo andare a parlare con questa persona.\n@c0@"
  ja: "@a@bビアンカ「こんな所に　くわしい人が\n\tいたなんてね。\n\tまあ　とりあえず聞いてみましょうか。\n@c0@"
217:
  de: "@aNera@bSchänken eignen sich großartig, um Informationen zu beschaffen. Wir sollten hingehen und uns anhören, was er zu erzählen hat.\n@c0@"
  en: "@aNera@bPubs always seem to be great places for picking\r\nup information. We should go and see what he\r\nhas to say.\n@c0@"
  es: "@aNera@bParece que las tabernas suelen ser sitios ideales para obtener informazione. Deberíamos ir a ver qué es lo que sabe.\n@c0@"
  fr: "@aNera@bLes tavernes ont l'air d'être d'excellents endroits pour obtenir des informations. Nous devrions aller voir ce qu'il a à dire.\n@c0@"
  it: "@aNera@bLa quantità di informazioni che si possono raccogliere nelle taverne è incredibile! Forza, andiamo a parlare con il padre di quella ragazza.\n@c0@"
  ja: "@a@bフローラ「酒場は　いろいろな\n\t話が　集まるところですから。\n\t話を聞いてみましょうよ。\n@c0@"
218:
  de: "@aBianca@bSo weit ich mich erinnere, hat der schon immer gern einen gehoben.\n@c0@"
  en: "@aBianca@bAs far as I remember, that bloke always used to be boozin' away.\n@c0@"
  es: "@aBianca@bPor lo que yo recuerdo, ese tipo solía pasarse el día empinando el codo.\n@c0@"
  fr: "@aBianca@bPour autant que je me souvienne, ce type buvait tout le temps.\n@c0@"
  it: "@aBianca@bNon so cosa pensare...\n@c0@"
  ja: "@a@bビアンカ「う～ん…　あのおじさんって\n\t大酒のみで　いつも\n\t酔っぱらってたのよね。\n@c0@"
219:
  de: "@aBianca@bIch bin überrascht, dass er überhaupt irgendetwas über den legendären Helden weiß. Meinst du, wir können ihm glauben?\n@c0@"
  en: "@aBianca@bI'm surprised he knows anythin' about the legendary hero. Do you reckon we can trust what he says?\n@c0@"
  es: "@aBianca@bMe sorprende que sepa algo del héroe legendario. ¿Crees que podemos fiarnos de lo que dice?\n@c0@"
  fr: "@aBianca@bÇa m'étonne qu'il sache quoi que ce soit sur le héros légendaire. Tu penses qu'on peut croire ce qu'il nous raconteⓡ\n@c0@"
  it: "@aBianca@bA dire il vero, sono sorpresa che questo tizio sappia tante cose sull'Eroe Leggendario. Credi che possiamo fidarci di lui? Non è che si sarà inventato tutto?\n@c0@"
  ja: "@a@bビアンカ「そんな人が　勇者の話に\n\tくわしいなんて……\n\t今の話　信じていいのかしら？\n@c0@"
220:
  de: "@aNera@bIch kann mir auch vorstellen, dass es irgendwo noch Nachkommen des legendären Helden gibt. Hoffentlich finden wir bald einen davon.\n@c0@"
  en: "@aNera@bI think there are probably descendants of the legendary hero out there somewhere too. Hopefully we'll find one of them before long.\n@c0@"
  es: "@aNera@bProbablemente también haya algún discendente del héroe legendario por aquí. Espero que podamos encontrar a uno presto.\n@c0@"
  fr: "@aNera@bMoi aussi, je crois qu'il existe probablement des descendants du héros légendaire quelque part.\n㈡\nEspérons que nous réussirons à trouver l'un d'eux assez vite.\n@c0@"
  it: "@aNera@bQuell'uomo ha ragione! Con ogni probabilità, l'Eroe Leggendario ha lasciato dei discendenti.\nSono certa che prima o poi ne incontreremo uno!\n@c0@"
  ja: "@a@bフローラ「私も　勇者の子孫は\n\tどこかに　実在していると思いますわ。\n\tいつか　見つけだしましょうね。\n@c0@"
221:
  de: "@aBianca@bIch freue mich, dass du mich hierher zurückgebracht hast, %a000090, aber wir haben wirklich keine Zeit für einen Umweg.\n@c0@"
  en: "@aBianca@bI appreciate you bringin' me back here, %a000090, but we en't really got time for a detour.\n@c0@"
  es: "@aBianca@bTe agradezco que me hayas traído aquí, %a000090, pero no tenemos tiempo para desviarnos de nuestro camino, ¿sabes?\n@c0@"
  fr: "@aBianca@bJ'apprécie que tu m'aies ramenée ici, %a000090, mais nous n'avons pas vraiment le temps de faire des détours.\n@c0@"
  it: "@aBianca@bSono contenta di essere qui, %a000090, ma temo che questo non sia il momento più adatto per concederci una pausa... turistica.\n@c0@"
  ja: "@a@bビアンカ「ありがとう。\n\t私にまた　この町を　見せてくれて。\n\tでも　今は　ゆっくりできないわね。\n@c0@"
222:
  de: "@aBianca@bKönnen wir heute hier übernachten, %a000090?\n@c0@"
  en: "@aBianca@bCan we stay here tonight, %a000090?\n@c0@"
  es: "@aBianca@b¿Nos quedamos aquí esta noche, %a000090?\n@c0@"
  fr: "@aBianca@bEst-ce qu'on peut rester ici pour la nuit, %a000090ⓡ\n@c0@"
  it: "@aBianca@b%0%a000090, che ne diresti di trascorrere la notte qui?\n@c0@"
  ja: "@a@bビアンカ「ねえ　%a000090。\n\t今夜は　ここで泊まる？\n@c0@"
223:
  de: "@aBianca@bSchön! Dann können wir uns gemütlich zusammenkuscheln.\n@c0@"
  en: "@aBianca@bGreat. We can cuddle up all snug.\n@c0@"
  es: "@aBianca@bGenial. Nos acurrucaremos bien calentitos, ¿sabes?\n@c0@"
  fr: "@aBianca@bSuper. On va pouvoir se pelotonner bien confortablement.\n@c0@"
  it: "@aBianca@bChe bello!\nGrazie, amore mio!\n@c0@"
  ja: "@a@bビアンカ「うふふ。\n\t仲よくしようね　%a000090。\n@c0@"
224:
  de: "@aBianca@bOhhh!\n@c0@"
  en: "@aBianca@bOhhhh!\n@c0@"
  es: "@aBianca@b¡Ohhhh!\n@c0@"
  fr: "@aBianca@bOhhhhhⓠ\n@c0@"
  it: "@aBianca@bE perché?\nUffà, sei un cattivone!\n@c0@"
  ja: "@a@bビアンカ「ふ～～～～～～ん……。\n@c0@"
225:
  de: "@aBianca@bHier herumzulaufen, das erinnert mich an damals, als wir auf Gespensterjagd gegangen sind. Das war ein bisschen unheimlich, was?\n@c0@"
  en: "@aBianca@bWalkin' around here like this reminds me of the time we went on our ghost-bustin' trip. That was a bit scary, eh?\n@c0@"
  es: "@aBianca@bEste paseo por aquí me ha recordado a nuestra aventura como cazafantasmas. Qué miedo, ¿verdad?\n@c0@"
  fr: "@aBianca@bMe promener par ici me rappelle l'époque où nous étions partis pour notre chasse aux fantômes. C'était un peu effrayant, heinⓡ\n@c0@"
  it: "@aBianca@bCamminare così con te mi fa tornare in mente quella volta che andammo a caccia di fantasmi...\nA ripensarci oggi, fummo un po' incoscienti!\n@c0@"
  ja: "@a@bビアンカ「こうして　歩いていると\n\tお化け退治のことを　思い出すわね。\n\tあの時は　ドキドキしてたっけ。\n@c0@"
226:
  de: "@aNera@bDu musst auch müde sein. Wollen wir nicht hier übernachten?\n@c0@"
  en: "@aNera@bYou must be tired now too. Why don't we stay here for the night?\n@c0@"
  es: "@aNera@bDebes de estar cansado. ¿Por qué no nos quedamos esta notte aquí?\n@c0@"
  fr: "@aNera@bTu dois être fatigué, toi aussi. Et si nous restions ici pour la nuitⓡ\n@c0@"
  it: "@aNera@bDevi essere esausto, e anch'io avverto un po' di stanchezza...\nPerché non passiamo la notte qui?\n@c0@"
  ja: "@a@bフローラ「あなたも　おつかれでしょう？\n\t今日は　もう　休みましょうか。\n@c0@"
227:
  de: "@aBianca@bJa. Ich wäre wohl auch nicht sehr glücklich, wenn ich die Reise allein machen müsste.\n@c0@"
  en: "@aBianca@bYeah. I dun't know that I'd be too happy about makin' that journey on my own neither.\n@c0@"
  es: "@aBianca@bNo creo que me gustase demasiado hacer sola ese viaje tampoco, ¿sabes?\n@c0@"
  fr: "@aBianca@bC'est vrai. Je crois que moi non plus, ça ne me réjouirait pas de voyager seule jusque là-bas.\n@c0@"
  it: "@aBianca@bHa ragione.\nCredo che nemmeno io avrei il coraggio di fare il viaggio da sola, visti i tempi che corrono...\n@c0@"
  ja: "@a@bビアンカ「そうよね。\n\t私も　ひとりでだったら\n\tちょっと　むずかしいかも……。\n@c0@"
228:
  de: "@aNera@bJa, in der Stadt mag es jetzt sicher sein, aber in der Umgebung noch lange nicht. Ich frage mich, wann wir endlich wahren Frieden finden werden.\n@c0@"
  en: "@aNera@bYes, the town may be safe now, but the surroundings certainly aren't. I wonder\r\nwhen we'll finally be granted true peace.\n@c0@"
  es: "@aNera@bPuede que la città sea sicura, pero desde luego los alrededores no lo son. Me pregunto cuándo llegará la paz.\n@c0@"
  fr: "@aNera@bOui, la ville est sûre, désormais, mais ce n'est pas le cas des alentours. Je me demande quand nous pourrons enfin être réellement en paix.\n@c0@"
  it: "@aNera@bNei villaggi si sta abbastanza tranquilli, ma basta fare qualche passo fuori dai centri abitati per rendersi conto dei pericoli che ci sono in giro.\n@c0@"
  ja: "@a@bフローラ「お城は　平和になっても\n\tお城の外は　平和じゃないのね。\n\t本当の平和って　いつ来るのかしら？\n@c0@"
229:
  de: "@aBianca@bMit den Monstern kommunizieren? Das klingt ganz nach dir, %a000090!\n@c0@"
  en: "@aBianca@bCommunicatin' with monsters? That sounds just like you, %a000090!\n@c0@"
  es: "@aBianca@b¿Comunicarse con monstruos? ¡Eso es muy de tu estilo, %a000090!\n@c0@"
  fr: "@aBianca@bCommuniquer avec les monstresⓡ Voilà qui te ressemble assez, %a000090ⓠ\n@c0@"
  it: "@aBianca@bComunicare con i mostri?\nQuesta cosa mi fa venire in mente te, %a000090! Eh eh eh!\n@c0@"
  ja: "@a@bビアンカ「魔物と心を　通わせるなんて\n\tまるで　%a000090みたいじゃない。\n@c0@"
230:
  de: "@aNera@bVielleicht entstammst du dieser Sippe, %a000090? Du scheinst auch über die Macht zu verfügen, mit Monstern zu reden.\n@c0@"
  en: "@aNera@bMaybe you're a descendant of this clan, %a000090? You seem to have some kind of power to talk to monsters.\n@c0@"
  es: "@aNera@bQuizá seas un discendente de ese clan, %a000090. Pareces disfrutar de un cierto poder para hablar con los mostri.\n@c0@"
  fr: "@aNera@bTu es peut-être un descendant de ce clan, %a000090ⓡ Tu sembles avoir une forme\nde don pour parler aux monstres.\n@c0@"
  it: "@aNera@b%0%a000090, non è che per caso discendi da quella stirpe? Dopotutto, tu hai la capacità di parlare con i mostri...\n@c0@"
  ja: "@a@bフローラ「もしかして　%a000090さんは\n\t魔界の封印を守る　一族の血を\n\t受けついでいる　とか……？\n@c0@"
231:
  de: "@aBianca@bWir sollten uns auch etwas ausruhen. Morgen ist auch noch ein Tag.\n@c0@"
  en: "@aBianca@bWe should get some rest now too.\r\nTomorrow's comin', after all.\n@c0@"
  es: "@aBianca@bNosotros también deberíamos descansar un poco.\r\nPronto ya será mañana, ¿sabes?\n@c0@"
  fr: "@aBianca@bNous devrions nous reposer, nous aussi.\r\nDemain est un autre jour.\n@c0@"
  it: "@aBianca@bIn effetti, s'è fatto tardi...\nChe ne diresti di andare a nanna?\n@c0@"
  ja: "@a@bビアンカ「私たちも　今夜は　ねましょう。\n\t明日もあるんだし…　ねっ。\n@c0@"
232:
  de: "@aNera@bDas Leben könnte gar nicht schöner sein, finde ich. Nicht jetzt, da wir beide zusammen sind.\n@c0@"
  en: "@aNera@bLife couldn't be more joyous, as far as I'm concerned. Not now I'm with you.\n@c0@"
  es: "@aNera@bPer la mia parte, ahora que estoy con te, mi vida no puede ser más dichosa.\n@c0@"
  fr: "@aNera@bEn ce qui me concerne, ma vie ne pourrait être plus heureuse. Pas depuis que je suis avec toi.\n@c0@"
  it: "@aNera@bSono pronta ad accogliere qualsiasi sorpresa il destino abbia in serbo per me, l'importante è che tu sia sempre al mio fianco.\n@c0@"
  ja: "@a@bフローラ「私にとって　あなたと\n\tいっしょに　いられることが\n\tいいことですわ。　ぽっ……。\n@c0@"
233:
  de: "@aBianca@bIch hätte nicht gedacht, dass sich hier noch jemand an mich erinnert. Wie nett, den Alten wiederzusehen!\n@c0@"
  en: "@aBianca@bI didn't think there'd be anyone here who'd remember me any more. It's nice to see the old stick.\n@c0@"
  es: "@aBianca@bCreía que ya nadie se acordaría de mí aquí. Es agradable ver a la gente de entonces, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe ne pensais pas que quelqu'un ici se souviendrait encore de moi. C'est chouette d'avoir revu ce vieux bonhomme.\n@c0@"
  it: "@aBianca@bNon credevo che i miei vecchi compaesani mi avrebbero riconosciuta...\nÈ bello vedere che si ricordano ancora di me! \n@c0@"
  ja: "@a@bビアンカ「私を　知ってる人なんて\n\tもう　いないと　思ってたけど\n\tおじいさんに会えて　うれしかったわ。\n@c0@"
234:
  de: "@aNera@bBianca ist zu einer richtigen Schönheit geworden. Stell dir vor, wie überrascht er wäre, wenn er sie jetzt sehen könnte!\n@c0@"
  en: "@aNera@bBianca's grown up to be such a beauty.\r\nImagine his surprise if he saw her now!\n@c0@"
  es: "@aNera@bBianca se ha convertido en una ragazza molto bella.\r\n¡Imagínate qué sorpresa para él si la viera ahora!\n@c0@"
  fr: "@aNera@bBianca a grandi et elle est devenue très belle. Imagine un peu son étonnement s'il la voyait aujourd'huiⓠ\n@c0@"
  it: "@aNera@bBianca è diventata una donna bellissima.\nCredo che quell'uomo stenterebbe a riconoscerla, se la rivedesse...\n@c0@"
  ja: "@a@bフローラ「ビアンカさんは　とても\n\tおきれいだから…　お会いになったら\n\tきっと　びっくりなさるわね。\n@c0@"
235:
  de: "@aBianca@bIch habe mich furchtbar gefühlt, als ich hörte, dass die Soldaten aus Tifortu den Ort niedergebrannt haben.\n@c0@"
  en: "@aBianca@bI felt terrible when I heard about the soldiers from Coburg burnin' this place to the ground.\n@c0@"
  es: "@aBianca@bCuando oí que los soldados de Trastámara habían quemado este sitio me puse muy triste.\n@c0@"
  fr: "@aBianca@bJe me suis sentie vraiment très mal quand j'ai appris que les soldats de Cobourg avaient entièrement\r\nbrûlé cet endroit.\n@c0@"
  it: "@aBianca@bQuando seppi che i soldati di Coburg avevano messo Valcava a ferro e fuoco, rimasi sconvolta...\n@c0@"
  ja: "@a@bビアンカ「ラインハットの兵が\n\tこの村を　焼きはらったと聞いたときは\n\tむねが　つぶれる思いがしたわ。\n@c0@"
236:
  de: "@aBianca@bFür dich muss es ja noch ein größerer Schock gewesen sein, %a000090. Endlich nach Hause zu kommen und dann das...\n@c0@"
  en: "@aBianca@bIt must've bin even more of a shock for you, %a000090. Finally comin' home and findin'\nit like this...\n@c0@"
  es: "@aBianca@bPara ti aún debió de ser peor, %a000090. Llegar a casa por fin y encontrarla así...\n@c0@"
  fr: "@aBianca@bLe choc a dû être encore plus grand pour toi, %a000090. Revenir enfin chez toi pour trouver les lieux dans cet état...\n@c0@"
  it: "@aBianca@bImmagino che per te lo choc sia stato ben più grande, %a000090... Dev'essere orribile tornare a casa e scoprire che il tuo passato non esiste più.\n@c0@"
  ja: "@a@bビアンカ「でも　%a000090のほうが\n\tショックだったよね。　やっと\n\t帰ってきたら　こんな状態で……。\n@c0@"
237:
  de: "@aBianca@bKomm, gehen wir. Du musst das nur in den Beutel stecken und schon lebst du glücklich bis an dein Lebensende.\n@c0@"
  en: "@aBianca@bCome on, let's get goin'. You just need to get this in the bag and then the happy ever after's all yours.\n@c0@"
  es: "@aBianca@bVamos, en marcha. Basta con que metas esto en la bolsa y serás feliz y comerás perdiz, ¿sabes?\n@c0@"
  fr: "@aBianca@bViens, continuons. Il faut que tu oublies ça et\r\ntu pourras être heureux.\n@c0@"
  it: "@aBianca@bSu, andiamo. Per quanto siano orribili, è necessario dimenticare le esperienze del passato, altrimenti non riusciremo mai a vivere il futuro con serenità.\n@c0@"
  ja: "@a@bビアンカ「さあ　もどりましょう。\n\t%a000090は　用を　すませたら\n\t幸せに　なれるんだから。\n@c0@"
238:
  de: "@aBianca@bDas Dorf so zu sehen ist einfach traurig. Es ist, als hätten die Soldaten aus Tifortu gleichzeitig alle schönen Erinnerungen an den Ort ausgelöscht.\n@c0@"
  en: "@aBianca@bSeein' the town like this is so sad. It's like those soldiers from Coburg wiped out all the nice memories here when they did what they did.\n@c0@"
  es: "@aBianca@bEs muy triste ver así el pueblo. Es como si, al quemarlo, los soldados de Trastámara hubiesen acabado con todos los buenos recuerdos, ¿sabes?\n@c0@"
  fr: "@aBianca@bC'et triste de voir le village dans cet état. C'est comme si les soldats de Cobourg avaient effacé\r\ntous les bons souvenirs quand ils ont fait ça.\n@c0@"
  it: "@aBianca@bChe tristezza vedere il villaggio in questo stato...\nI soldati di Coburg hanno fatto un vero macello.\nDella Valcava che fu non resta che il ricordo...\n@c0@"
  ja: "@a@bビアンカ「今の町の景色を　見てると\n\t大切な思い出まで　ラインハットの兵に\n\tこわされた気がして　悲しくなるわ。\n@c0@"
239:
  de: "@aBianca@bAm meisten hasse ich die, die dein altes Heim in Schutt und Asche gelegt haben.\n@c0@"
  en: "@aBianca@bThe ones who set fire to your old place are the ones I despise the most.\n@c0@"
  es: "@aBianca@bA los que más odio es a los que quemaron tu antigua casa.\n@c0@"
  fr: "@aBianca@bCe sont ceux qui ont incendié ton ancienne maison que je méprise le plus.\n@c0@"
  it: "@aBianca@bBisogna essere delle creature senza cuore per dar fuoco a un villaggio abitato da gente pacifica...\n@c0@"
  ja: "@a@bビアンカ「%a000090の家の　こわされ方が\n\tいちばん　ひどいよね。\n@c0@"
240:
  de: "@aBianca@bDabei ist bestimmt auch das Buch verbrannt, aus dem ich dir vor all den Jahren vorlesen wollte.\n@c0@"
  en: "@aBianca@bThey would've destroyed that book I tried to read to you all them years ago.\n@c0@"
  es: "@aBianca@bDestruyeron ese libro que intenté leerte hace tantos años, ¿sabes?\n@c0@"
  fr: "@aBianca@bIls ont sans doute détruit le livre que j'avais essayé de te lire, il y a bien longtemps.\n@c0@"
  it: "@aBianca@bLe fiamme avranno distrutto anche il libro che cercavo di leggerti quando eravamo piccoli...\n@c0@"
  ja: "@a@bビアンカ「昔　私が　%a000090に\n\t読んであげようとした本も\n\tもう　燃えちゃった……。\n@c0@"
241:
  de: "@aNera@bIch hatte schon von Steinach gehört. Wenn ich daran denke, dass du hier früher gewohnt hast!\n@c0@"
  en: "@aNera@bI'd heard talk of Whealbrook before. To think that this is where you used to live!\n@c0@"
  es: "@aNera@bYa había oído hablar de Arroyofrío. ¡Y pensare que tú viviste aquí!\n@c0@"
  fr: "@aNera@bJ'avais déjà entendu parler de Ruycelieu.\nDire que c'est ici que tu vivais autrefoisⓠ\n@c0@"
  it: "@aNera@bAvevo sentito parlare di Valcava, ma non sapevo che tu ci avessi vissuto.\n@c0@"
  ja: "@a@bフローラ「サンタローズのウワサは\n\t聞いていましたけど…　まさか\n\tここが　あなたの村だったなんて。\n@c0@"
242:
  de: "@aNera@bDie meisten sind von hier fortgezogen, also besteht wenig Aussicht, dass der Ort wieder aufgebaut wird.\n@c0@"
  en: "@aNera@bMost of the people have left, so there's not much hope for the place being rebuilt.\n@c0@"
  es: "@aNera@bCasi tutti il mondo se ha ido, así que no hay muchas esperanzas de que reconstruyan este lugar.\n@c0@"
  fr: "@aNera@bLa plupart des habitants ont fui. On peut difficilement espérer que cet endroit sera reconstruit.\n@c0@"
  it: "@aNera@bMolti dei vecchi abitanti sono andati a vivere altrove. Dubito che questo posto tornerà mai a essere quello di un tempo...\n@c0@"
  ja: "@a@bフローラ「人も　ほとんど\n\tいなくなってしまって　村を\n\tたてなおすことも　できないのね……。\n@c0@"
243:
  de: "@aBianca@bIch kann mir nur schwer vorstellen, dass Ludwig je mit seiner Weisheit am Ende gewesen sein könnte.\n@c0@"
  en: "@aBianca@bIt's hard to imagine Pankraz bein' stumped\r\nby anythin'.\n@c0@"
  es: "@aBianca@bEs difícil imaginarse a Teudis preocupado en cualquier situación, ¿sabes?\n@c0@"
  fr: "@aBianca@bC'est difficile d'imaginer que quelque chose ait pu poser une colle à Petros.\n@c0@"
  it: "@aBianca@bMi sembra quasi di vederlo, il povero Russel, chiedersi come mai non riesca a usare una spada...\n@c0@"
  ja: "@a@bビアンカ「あの　パパスさんが\n\tそんな姿を　見せるなんて……。\n@c0@"
244:
  de: "@aNera@bDein armer Vater! Er muss verzweifelt versucht haben, deine Mutter zu retten.\n@c0@"
  en: "@aNera@bYour father must have been absolutely desperate to rescue your mother, the poor man.\n@c0@"
  es: "@aNera@bIl tuo padre debía de estar desesperado por rescatar a la tua mamma, pobre hombre.\n@c0@"
  fr: "@aNera@bTon père devait désespérément essayer de sauver ta mère, le pauvre.\n@c0@"
  it: "@aNera@bTuo padre deve averle tentate tutte pur di salvare sua moglie...\n@c0@"
  ja: "@a@bフローラ「あなたのお父さまは\n\tどんなに　ご自分の手で　奥さまを\n\t救い出したかったでしょうか……。\n@c0@"
245:
  de: "@aBianca@bWir werden deine Mutter finden, %a000090. Und wenn es das Letzte ist, was wir tun!\n@c0@"
  en: "@aBianca@bWe'll find your mum, %a000090. If it's the last thing we do!\n@c0@"
  es: "@aBianca@bEncontraremos a tu madre, %a000090. ¡Aunque sea lo último que hagamos!\n@c0@"
  fr: "@aBianca@bNous trouverons ta mère, %a000090. Même si c'est la dernière chose que nous devons faireⓠ\n@c0@"
  it: "@aBianca@bTroveremo tua madre, %a000090.\nFosse l'ultima cosa che faremo in vita nostra, ti prometto che ci riusciremo!\n@c0@"
  ja: "@a@bビアンカ「%a000090　絶対\n\tお母さんを　見つけようね。\n@c0@"
246:
  de: "@aNera@bIch würde deine Mutter so gern kennenlernen. Sie ist bestimmt ein wunderbarer Mensch, so wie du.\n@c0@"
  en: "@aNera@bI'd so love to meet your mother. I'm sure she's a wonderful person, just like you.\n@c0@"
  es: "@aNera@bMe encantaría conocer a la tua mamma. Estoy sicura de que es una persona maravillosa, come tú.\n@c0@"
  fr: "@aNera@bJ'aimerais tellement rencontrer ta mère. Je suis\r\nsûre que c'est quelqu'un de merveilleux, comme toi.\n@c0@"
  it: "@aNera@bMi piacerebbe conoscere tua madre.\nSono certa che è una bellissima persona, proprio come te.\n@c0@"
  ja: "@a@bフローラ「私も　あなたのお母さまに\n\tお会いしてみたいです。　きっと\n\tあなたのように　すてきな方ですわ。\n@c0@"
247:
  de: "@a%0%a001230@bBlüten an einem solchen Ort! Was für eine Überraschung!\n@c0@"
  en: "@a%0%a001230@bBlossom in a place like this! What a surprise!\n@c0@"
  es: "@a%0%a001230@b¡Flores en un sitio como éste! ¡Sorprendente!\n@c0@"
  fr: "@a%0%a001230@bUne branche en fleur dans un endroit pareilⓠ\nC'est surprenantⓠ\n@c0@"
  it: "@a%0%a001230@bUn ramo in fiore in questo posto?!\nForse è un segno di speranza mandato dalla dea...\n\n@c0@"
  ja: "@a@b%a001230「まあ！\n\tこんな暗い場所で　きれいに\n\t花が咲いているなんて……。\n@c0@"
248:
  de: "@aBianca@bHier sieht es nachts ja noch trostloser aus.\n@c0@"
  en: "@aBianca@bThis place looks all the more sorry for itself\r\nof a night.\n@c0@"
  es: "@aBianca@bDe noche, este sitio tiene un aspecto aún más triste, ¿sabes?\n@c0@"
  fr: "@aBianca@bDe nuit, cet endroit semble encore plus désolé.\n@c0@"
  it: "@aBianca@bDi notte questo posto mette ancora più tristezza...\n@c0@"
  ja: "@a@bビアンカ「夜は　いっそう\n\t村が　さみしく見えるわね。\n@c0@"
249:
  de: "@aNera@bKaum zu glauben, dass du mal hier gewohnt hast.\n@c0@"
  en: "@aNera@bI can't believe this is where you used to live.\r\nWhat a terrible state it's in.\n@c0@"
  es: "@aNera@bNo puedo creer que este sea el lugar donde vivías.\r\nEstá en un estado lamentabile.\n@c0@"
  fr: "@aNera@bJe n'arrive pas à croire que c'est ici que tu vivais. Tout est dans un état pitoyable.\n@c0@"
  it: "@aNera@bIl villaggio dove sei cresciuto è stato praticamente cancellato dalla faccia della terra. Posso solo immaginare la rabbia che hai dentro di te adesso...\n@c0@"
  ja: "@a@bフローラ「このサンタローズが\n\tあなたの村だったなんて……。\n@c0@"
250:
  de: "@aBianca@bWas? Zuckerchen ist der Name einer Fee?\n@c0@"
  en: "@aBianca@bEh? Honey's the name of a faerie?\n@c0@"
  es: "@aBianca@b¿Cómo? ¿Dulce es el nombre de un hada?\n@c0@"
  fr: "@aBianca@bHeinⓡ Candy est le nom d'une féeⓡ\n@c0@"
  it: "@aBianca@bChe cosa?!\nAmandina è il nome di una fata?!\n@c0@"
  ja: "@a@bビアンカ「えっ？\n\tベラって　妖精の名前なの？\n@c0@"
251:
  de: "@aBianca@bHast du ein Glück, mit einer Fee auf Abenteuer ausgezogen zu sein! Ich wünschte, ich wäre dabei gewesen.\n@c0@"
  en: "@aBianca@bYou're so lucky, goin' off on an adventure with a faerie like that! I wish I could've gone.\n@c0@"
  es: "@aBianca@b¡Qué suerte, ir de aventuras con un hada así! Me gustaría haber podido estar ahí, ¿sabes?\n@c0@"
  fr: "@aBianca@bTu as de la chance d'être parti à l'aventure\ncomme ça, avec une féeⓠ J'aurais adoré.\n@c0@"
  it: "@aBianca@bMa davvero hai incontrato una fata e hai visitato il suo regno?!\nPerché non mi hai portata con te?!\n@c0@"
  ja: "@a@bビアンカ「いいな…　%a000090は\n\t妖精とも　冒険したのね。\n\t私も　いっしょに行きたかったな。\n@c0@"
252:
  de: "@aNera@bBedeutet dir der Name Zuckerchen etwas? Oh! Sie ist eine Fee, nicht wahr?\n@c0@"
  en: "@aNera@bDoes the name Honey mean something to you? Ooh! She's a faerie, is she?\n@c0@"
  es: "@aNera@b¿Significa algo per te el nombre Dulce? ¡Oooh! Es un hada, ¿vero?\n@c0@"
  fr: "@aNera@bEst-ce que le nom de Candy te dit quelque choseⓡ Oh, mais c'est une fée, c'est çaⓡ\n@c0@"
  it: "@aNera@bAmandina è un nome non comune...\nCome dici?\nÈ il nome di una fata?\n@c0@"
  ja: "@a@bフローラ「あなた　ベラという名前に\n\t心当たりが　あるの？\n\t……まあ！　妖精さんなのね。\n@c0@"
253:
  de: "@aNera@bIch habe andauernd mit Feen gespielt, als ich noch klein war. Jetzt klinge ich wohl wie eine richtige Einzelgängerin, was?\n@c0@"
  en: "@aNera@bI used to play with faeries all the time when I was little. I suppose that makes me sound a bit of a loner.\n@c0@"
  es: "@aNera@bCuando era piccola yo solía jugar mucho con hadas. Supongo que eso me hace sonar como una bambina solitaria.\n@c0@"
  fr: "@aNera@bJe jouais tout le temps avec les fées, quand j'étais petite. J'imagine que ça donne l'image d'une enfant solitaire.\n@c0@"
  it: "@aNera@bSai una cosa? Da piccola giocavo sempre con le fate. Erano le mie amichette invisibili.\nEhm, sì: ero una bambina molto sola...\n@c0@"
  ja: "@a@bフローラ「私も　小さい頃　妖精さんに\n\t何度か　遊んでいただいたのよ。\n\tよほど　私がさみしそうに見えたのね。\n@c0@"
254:
  de: "@aBianca@bDu warst ungefähr in diesem Alter, oder, %a000090? Ich meine, als Ludwig gestorben ist.\n@c0@"
  en: "@aBianca@bYou were about that age, eh, %a000090?\nWhen Pankraz died, I mean.\n@c0@"
  es: "@aBianca@bEsa era más o menos tu edad, ¿verdad, %a000090?\nCuando Teudis murió, digo.\n@c0@"
  fr: "@aBianca@bTu avais à peu près le même âge, hein, %a000090ⓡ Je veux dire, quand Petros est mort.\n@c0@"
  it: "@aBianca@b%0%a000090, è davvero triste che tu abbia perso tuo padre quando eri ancora un bambino...\n@c0@"
  ja: "@a@bビアンカ「そうだね。　%a000090が\n\tこれくらいの時だったね…\n\tパパスさんが　亡くなったのは……。\n@c0@"
255:
  de: "@aNera@bHeutzutage sieht man überall Waisen. Wo soll das noch hinführen?\n@c0@"
  en: "@aNera@bThere seem to be so many orphans around nowadays. What is the world coming to?\n@c0@"
  es: "@aNera@bSembra que cada día hay más y más orfani. ¿Adónde vamos a ir a parar?\n@c0@"
  fr: "@aNera@bIl semble y avoir tant d'orphelins, de nos jours.\nOù va le mondeⓡ\n@c0@"
  it: "@aNera@bRiesco a malapena a immaginare il dolore che può provare un figlio per la morte di un genitore... Dev'essere come se ti strappassero il cuore...\n@c0@"
  ja: "@a@bフローラ「親のいない子供が\n\tふえてきているような気がします。\n\tいやな　世の中ですわ……。\n@c0@"
256:
  de: "@aBianca@bWir könnten doch auch hier bleiben, oder? Schön, dass es nach allem, was passiert ist, immer noch Leute gibt, auf die man sich verlassen kann.\n@c0@"
  en: "@aBianca@bWe could stay here too, eh? It's nice to see there are still people you can count on, even after all that's happened.\n@c0@"
  es: "@aBianca@bTambién podríamos quedarnos aquí, ¿eh?\n㈡\nEs agradable saber que aún puedes contar con algunas personas, sobre todo después de todo lo que ha pasado.\n@c0@"
  fr: "@aBianca@bNous pourrions rester ici, nous aussi. C'est bon de voir qu'il existe toujours des gens sur qui on peut compter, même après tout ce qui s'est passé.\n@c0@"
  it: "@aBianca@bChe ne diresti di restare qui? È bello vedere che c'è ancora gente che si dà da fare per andare avanti, nonostante tutto quello che è successo.\n@c0@"
  ja: "@a@bビアンカ「ここでも　泊まれるのね。\n\tあんなことがあっても　村に\n\tとどまる人がいるって　うれしいな。\n@c0@"
257:
  de: "@aNera@bWollen wir hier übernachten? Die Leute, die die Herberge führen, scheinen sehr nett zu sein.\n@c0@"
  en: "@aNera@bShall we stay here for the night? The people running the inn seem like decent folk.\n@c0@"
  es: "@aNera@b¿Nos quedamos questa notte aquí? Los encargados de la posada parecen buenas personas.\n@c0@"
  fr: "@aNera@bEt si nous restions ici pour la nuitⓡ Les gens qui tiennent cette auberge ont l'air très bien.\n@c0@"
  it: "@aNera@bTi va di trascorrere la notte qui?\nQuesta locanda non mi sembra affatto male, e i gestori sono persone simpatiche...\n@c0@"
  ja: "@a@bフローラ「今夜は　こちらで\n\t休みましょうか？\n\t宿屋の方　いい方たちみたいだし。\n@c0@"
258:
  de: "@aBianca@bHier hast du mal einem Mann geholfen, der auf der Suche nach Heilkräutern festsaß, stimmt's nicht, %a000090?\n@c0@"
  en: "@aBianca@bYou helped a bloke who got stuck here lookin' for medicinal herbs once, right, %a000090?\n@c0@"
  es: "@aBianca@bUna vez ayudaste a un tipo que se quedó aquí atrapado mientras buscaba plantas medicinales, ¿verdad, %a000090?\n@c0@"
  fr: "@aBianca@bUn jour, tu as aidé un type qui était resté coincé ici en venant chercher des herbes médicinales,\nn'est-ce pas, %a000090ⓡ\n@c0@"
  it: "@aBianca@bTanto tempo fa aiutasti un uomo che si era trovato in difficoltà mentre stava cercando delle erbe medicinali... Non è così, %a000090?\n@c0@"
  ja: "@a@bビアンカ「昔　この洞くつで\n\tくすり師のおじさんを　助けたのって\n\t%a000090でしょ？　私　知ってたよ。\n@c0@"
259:
  de: "@aBianca@bDarüber weiß ich nämlich bestens Bescheid. Er war schwer beeindruckt, dass ein kleiner Junge sich in eine Höhle mit so vielen Ungeheuern gewagt hat.\n@c0@"
  en: "@aBianca@bI know all about it, see. He was well impressed\r\nwith you, a brave little kid goin' into a cave with\r\nso many monsters.\n@c0@"
  es: "@aBianca@bConozco esa historia. Se quedó impresionado al ver a un valiente chavalín entrar en una cueva llena de monstruos, ¿sabes?\n@c0@"
  fr: "@aBianca@bTu vois, je sais tout.\n㈡\nUn courageux petit garçon comme toi, capable de s'aventurer dans une caverne pleine de monstres,\nça l'avait beaucoup impressionné.\n@c0@"
  it: "@aBianca@bConosco la storia, perché quel tipo raccontò di essere stato salvato da un bambino coraggioso che era entrato da solo in una caverna piena di mostri...\n@c0@"
  ja: "@a@bビアンカ「おじさんが　教えてくれたの。\n\tあの洞くつは　魔物が出るのに\n\tすごい子だなって　思ったんだ。\n@c0@"
260:
  de: "@aBianca@bZum ersten Mal war ich hier, unmittelbar nachdem die Soldaten aus Tifortu Steinach niedergebrannt hatten.\n@c0@"
  en: "@aBianca@bThe first time I came in here was just after\r\nthem soldiers from Coburg burnt Whealbrook\r\nto the ground.\n@c0@"
  es: "@aBianca@bLa primera vez que vine aquí fue después de que los soldados de Trastámara destruyeran Arroyofrío.\n@c0@"
  fr: "@aBianca@bLa première fois que je suis entrée ici,\r\nc'était juste après que les soldats de\r\nCobourg eurent incendié Ruycelieu.\n@c0@"
  it: "@aBianca@bLa prima volta che venni qui fu subito dopo che i soldati di Coburg avevano raso al suolo Valcava.\n@c0@"
  ja: "@a@bビアンカ「私が　初めて　ここに入ったのは\n\tラインハットの兵が　サンタローズを\n\t焼きはらったあとのことよ。\n@c0@"
261:
  de: "@aBianca@bIch dachte, vielleicht finde ich dich hier irgendwo in einem Versteck, weißt du.\n@c0@"
  en: "@aBianca@bI thought maybe I'd find you in here hidin', you see.\n@c0@"
  es: "@aBianca@bPensaba que te encontraría aquí escondido...\n@c0@"
  fr: "@aBianca@bJe m'étais dit que je te trouverais peut-être\r\ncaché ici.\n@c0@"
  it: "@aBianca@bPensai che ti fossi nascosto in questo posto...\n@c0@"
  ja: "@a@bビアンカ「もしかしたら\n\tひなんした%a000090が　ここに\n\tかくれていないかと　思って……。\n@c0@"
262:
  de: "@aNera@bDu musst ein geborener Abenteurer sein, wenn du als kleiner Junge schon in dieser Höhle spielen wolltest!\n@c0@"
  en: "@aNera@bYou must've been a born adventurer to come playing in this cave when you were such a small boy!\n@c0@"
  es: "@aNera@b¡Debías de ser un aventurero nato! ¡Venir a jugar a esta cueva cuando no eras más que un bambino!\n@c0@"
  fr: "@aNera@bTu devais être un aventurier-né pour venir jouer dans cette caverne alors que tu n'étais qu'un tout petit garçonⓠ\n@c0@"
  it: "@aNera@bDevi essere nato con la passione per l'avventura nel sangue, per aver esplorato questa caverna quand'eri ancora un bambino!\n@c0@"
  ja: "@a@bフローラ「子供の頃から　こんな洞くつを\n\t遊び場にしていたなんて　あなたって\n\t根っからの　冒険家でしたのね。\n@c0@"
263:
  de: "@aNera@bHier hast du immer gespielt, als du noch klein warst, so wie ich immer im Wachtturm gespielt habe.\n@c0@"
  en: "@aNera@bYou used to play here when you were little, just like I used to play at the lookout tower.\n@c0@"
  es: "@aNera@bTú jugabas aquí cuando eras piccolo, igual que yo jugaba en la atalaya.\n@c0@"
  fr: "@aNera@bTu venais jouer ici quand tu étais petit, tout comme moi j'allais jouer dans la tour de guet.\n@c0@"
  it: "@aNera@bDa piccolo giocavi qui, non è vero?\nIo, invece, mi divertivo a gironzolare dalle parti della torre di sorveglianza.\n@c0@"
  ja: "@a@bフローラ「あなたが　ここを遊び場に\n\tなさっていたように　私は\n\t見はらしの塔を　遊び場にしていたの。\n@c0@"
264:
  de: "@aNera@bPapa hat immer schrecklich mit mir geschimpft, wenn er mich dort entdeckte.\n@c0@"
  en: "@aNera@bI used to be scolded terribly by Papa if he ever caught me there.\n@c0@"
  es: "@aNera@bIl mio papino se enfadaba molto y me reñía si me pillaba allí.\n@c0@"
  fr: "@aNera@bJe me faisais gronder très fort par papa\r\nquand il m'attrapait là-bas.\n@c0@"
  it: "@aNera@bRicordo che mio padre si arrabbiava moltissimo quando mi scopriva lì!\nMi faceva delle lavate di capo tremende!\n@c0@"
  ja: "@a@bフローラ「見つかったときは　父に\n\tたくさん　怒られてしまいましたけど。\n\tうふふ。\n@c0@"
265:
  de: "@aBianca@bMeine Güte! Du wirst hier ohne eine Frage durchgelassen! Du musst wichtiger sein, als du aussiehst!\n@c0@"
  en: "@aBianca@bBlimey! You get let on through without one word of questionin'! You must be more important than you look!\n@c0@"
  es: "@aBianca@b¡Cuernos! ¡Te dejan pasar sin hacerte ni una pregunta! ¡Debes de ser más importante de lo que pareces!\n@c0@"
  fr: "@aBianca@bBen ça alorsⓠ On te laisse passer sans te poser\nde questionsⓠ Tu dois être plus important que\ntu n'en as l'airⓠ\n@c0@"
  it: "@aBianca@bAccidenti! Ti ha fatto passare subito!\nNon sapevo che tu fossi una persona tanto importante!\n@c0@"
  ja: "@a@bビアンカ「すごいわ　顔パスじゃない。\n\t%a000090も　えらくなったものね。\n@c0@"
266:
  de: "@aNera@bEs muss schrecklich langweilig für diesen Soldaten sein, die ganze Zeit hier Wache zu stehen.\n@c0@"
  en: "@aNera@bIt must be terribly boring for that soldier having to stand guard here all the time.\n@c0@"
  es: "@aNera@bDebe de ser molto aburrido para ese soldado tener que hacer guardia ahí de pie tanto tempo.\n@c0@"
  fr: "@aNera@bÇa doit être terriblement ennuyeux pour un soldat de monter la garde ici en permanence.\n@c0@"
  it: "@aNera@bMontare di guardia dev'essere una noia mostruosa.\nNon penso che riuscirei mai a svolgere un compito tanto monotono...\n@c0@"
  ja: "@a@bフローラ「あの兵士さん\n\tこんなところで　立ちっぱなしの\n\tお仕事とは　大変でしょうね。\n@c0@"
267:
  de: "@aBianca@bWir sind jetzt unter dem Fluss, oder? Und was, wenn der Tunnel zusammenbricht...?\n@c0@"
  en: "@aBianca@bWe're underneath the river now, eh? What would happen if the tunnel collapsed...?\n@c0@"
  es: "@aBianca@bAhora estamos debajo del río, ¿eh? Me pregunto qué pasaría si se hundiese el túnel...\n@c0@"
  fr: "@aBianca@bNous sommes sous la rivière maintenant, c'est çaⓡ Qu'est-ce qui se passerait si le tunnel s'effondraitⓡ...\n@c0@"
  it: "@aBianca@bOra ci troviamo sotto il fiume, non è vero?\nBrrr! Non voglio nemmeno pensare cosa accadrebbe se la volta cedesse!\n@c0@"
  ja: "@a@bビアンカ「ここって　川の下なのよね。\n\tもし　くずれたら　どうしよう……。\n@c0@"
268:
  de: "@aNera@bWenn du genau hinhörst, kannst du über uns den Fluss rauschen hören. Das ist so ein beruhigendes Geräusch, findest du nicht?\n@c0@"
  en: "@aNera@bIf you listen hard, you can hear the river running up above. It's very relaxing.\n@c0@"
  es: "@aNera@bSi escuchas con attenzione podrás oír la corriente del río sobre nosotros. Es molto relajante.\n@c0@"
  fr: "@aNera@bEn écoutant bien, on peut entendre la rivière couler au-dessus de nous. C'est très apaisant.\n@c0@"
  it: "@aNera@bSi sente il rumore del fiume che scorre sopra di noi...\nNon lo trovi romantico?\n@c0@"
  ja: "@a@bフローラ「耳をすますと　上の川を\n\tサラサラと流れる水の音が\n\t聞こえてきて　心地いいですわ。\n@c0@"
269:
  de: "@aBianca@bWas für ein lustiger alter Mann! Ist ihm denn nicht klar, dass sie es nur euch zu verdanken haben, dass alles wieder friedlich ist?\n@c0@"
  en: "@aBianca@bWhat a funny old man! Dun't he realise it was you and Harry who made everythin' peaceful again?\n@c0@"
  es: "@aBianca@b¡Qué abuelete más curioso! ¿No se da cuenta de que fuisteis tú y Froilán los que trajisteis la paz de nuevo?\n@c0@"
  fr: "@aBianca@bQuel drôle de vieux bonhommeⓠ Il ne comprend donc pas que c'est Harry et toi qui avez rétabli la paixⓡ\n@c0@"
  it: "@aBianca@bPovero illuso! Fosse stato per lui, Coburg sarebbe ancora un inferno. Forse dovremmo dirgli che siete stati tu e Robert a mettere a posto le cose...\n@c0@"
  ja: "@a@bビアンカ「のんきな　おじいさんね。\n\t平和になったのは　ヘンリーさんと\n\t%a000090が　がんばったからなのに。\n@c0@"
270:
  de: "@aNera@bVielleicht sollte ich auf den Fluss schauen, wie er so vorbeirauscht, und mir etwas wünschen.\n@c0@"
  en: "@aNera@bMaybe I should look at the river flowing by and make some kind of wish too.\n@c0@"
  es: "@aNera@bQuizá yo también debería mirar la corriente del fiume y pedir un deseo.\n@c0@"
  fr: "@aNera@bPeut-être que je devrais regarder la rivière et faire un vœu, moi aussi.\n@c0@"
  it: "@aNera@bDubito che basti osservare un fiume per risolvere i problemi...\n@c0@"
  ja: "@a@bフローラ「私も　川の流れを見ながら\n\tなにか　お願いしてみようかしら。\n@c0@"
271:
  de: "@aBianca@bHier also wurde dein Vater getötet...\n@c0@"
  en: "@aBianca@bSo this is where your father was killed...\n@c0@"
  es: "@aBianca@bAsí que aquí es donde mataron a tu padre...\n@c0@"
  fr: "@aBianca@bAlors c'est ici que ton père a été tué...\n@c0@"
  it: "@aBianca@bAllora è qui che tuo padre trovò la morte...\n@c0@"
  ja: "@a@bビアンカ「ここで　%a000090のお父さんが\n\t亡くなったのね……。\n@c0@"
272:
  de: "@aBianca@bDas ist wirklich böse, einem so reinherzigen und guten Menschen das Leben zu nehmen! Das werde ich ihnen nie verzeihen.\n@c0@"
  en: "@aBianca@bHow evil, takin' the life of someone so pure and good! I'll never forgive 'em.\n@c0@"
  es: "@aBianca@b¡Hay que ser perverso para quitarle la vida a una persona tan buena! Nunca se lo perdonaré, ¿me entiendes?\n@c0@"
  fr: "@aBianca@bIl faut être diabolique pour prendre la vie de quelqu'un d'aussi bon et purⓠ\nJe ne leur pardonnerai jamais.\n@c0@"
  it: "@aBianca@bQuale essere ignobile ha potuto uccidere una persona tanto giusta e pura?!\nGliela faremo pagare! Oh, se gliela faremo pagare!\n@c0@"
  ja: "@a@bビアンカ「あのパパスさんを\n\tきたない手で　殺すなんて\n\t絶対に　許せない！\n@c0@"
273:
  de: "@aBianca@bLudwig... Jetzt sind wir beide verheiratet. Bitte behüte und beschütze uns.\n@c0@"
  en: "@aBianca@bPankraz... The two of us are married now.\r\nPlease watch over us and keep us safe.\n@c0@"
  es: "@aBianca@bTeudis... Ahora estamos casados.\r\nVela por nosotros y tal.\n@c0@"
  fr: "@aBianca@bPetros... Nous sommes mariés, à présent.\r\nJe vous en prie, veillez sur nous et protégez-nous.\n@c0@"
  it: "@aBianca@bRussel, ora io e %a000090 siamo moglie e marito.\nTi prego, proteggi sempre me e tuo figlio!\n@c0@"
  ja: "@a@bビアンカ「……パパスさん\n\t私たち　結婚しました。　どうか\n\t私たちを　見守っていてください……。\n@c0@"
274:
  de: "@aNera@bDas also ist der Ort, an dem Ludwig für dich sein Leben hingegeben hat... Vielleicht sollte ich ein Gebet sprechen.\n@c0@"
  en: "@aNera@bSo this is the place where Pankraz gave his life for you... Maybe I should say a prayer.\n@c0@"
  es: "@aNera@bAsí que este es el lugar en donde Teudis dio la sua vita per te... Quizá debería decir una oración.\n@c0@"
  fr: "@aNera@bAlors c'est ici que Petros a sacrifié sa vie pour toi... Je devrais peut-être dire une prière.\n@c0@"
  it: "@aNera@bQuesto è il luogo dove tuo padre è stato vilmente assassinato.\nVorrei recitare una preghiera...\n@c0@"
  ja: "@a@bフローラ「そうでしたか　ここで\n\tお父さまが　あなたをかばって……。\n\tでは　私も　お祈りいたしますわ。\n@c0@"
275:
  de: "@aNera@bLieber Ludwig. Ich bin Nera, und %a000090 und ich werden gemeinsam deine geliebte Frau retten.\n@c0@"
  en: "@aNera@bDear Pankraz. I am Nera and, together with %a000090, I will be sure to save your beloved wife.\n@c0@"
  es: "@aNera@bEstimado Teudis. Soy Nera, y junto a %a000090 estoy segura de que salvaremos a la tua cara esposa.\n@c0@"
  fr: "@aNera@bCher Petros. Je suis Nera, l'épouse de votre fils %a000090. Ensemble, nous réussirons à sauver votre femme bien-aimée.\n@c0@"
  it: "@aNera@bCaro Russel, sono Nera, la moglie di tuo figlio %a000090. Stiamo facendo del nostro meglio per salvare la tua amata sposa.\n@c0@"
  ja: "@a@bフローラ「私　フローラは　%a000090さんと\n\t一緒に　必ずや　力を合わせ\n\tお母さまを　救い出します。\n@c0@"
276:
  de: "@aNera@bDarum hoffe ich, dass du nun in den Armen der Göttin deinen Frieden findest.\n@c0@"
  en: "@aNera@bSo please lay down your head and rest easy now in the arms of the Goddess. Amen.\n@c0@"
  es: "@aNera@bYa puedes descansar en pace en los brazos de la Diosa. Amén.\n@c0@"
  fr: "@aNera@bAlors je vous en prie, laissez-vous aller et reposez en paix dans les bras de notre Déesse. Amen.\n@c0@"
  it: "@aNera@bPuoi riposare in pace, nella certezza che non lasceremo nulla di intentato per riportarla a casa.\nAmen.\n@c0@"
  ja: "@a@bフローラ「ですから　お父さま…\n\tどうぞ　神の　みもとで\n\t安らかに　お眠りください……。\n@c0@"
277:
  de: "@aNera@bWenn diese Reise vorbei ist, müssen wir für deinen Vater ein Denkmal bauen.\n@c0@"
  en: "@aNera@bWhen this journey is finally over, we must be sure to build a memorial to your father.\n@c0@"
  es: "@aNera@bCuando acabemos este viaggio, debemos construir un monumento en memoria del tuo padre.\n@c0@"
  fr: "@aNera@bLorsque notre quête sera enfin terminée, nous devrons sans faute édifier un monument à la\r\nmémoire de ton père.\n@c0@"
  it: "@aNera@bQuando il nostro viaggio sarà terminato, mi piacerebbe erigere una stele funeraria in memoria di tuo padre.\n@c0@"
  ja: "@a@bフローラ「この旅が　いつか終わったら\n\tお父さまのお墓を\n\tたててさしあげましょうね。\n@c0@"
278:
  de: "@aBianca@bVielleicht wäre Ludwig noch am Leben, wenn Harry nicht entführt worden wäre.\n@c0@"
  en: "@aBianca@bMaybe Pankraz would still be alive if only Harry hadn't bin kidnapped.\n@c0@"
  es: "@aBianca@bSi no hubiesen secuestrado a Froilán puede que Teudis siguiese vivo.\n@c0@"
  fr: "@aBianca@bPeut-être que Petros serait toujours vivant si Harry n'avait pas été enlevé.\n@c0@"
  it: "@aBianca@bForse Russel sarebbe ancora vivo, se Robert non fosse stato rapito...\n@c0@"
  ja: "@a@bビアンカ「ヘンリーさんが\n\tさらわれなかったら　パパスさんは\n\t死なずにすんだかも　知れない……。\n@c0@"
279:
  de: "@aBianca@bAber solche Überlegungen helfen jetzt auch nicht mehr weiter. Harry war noch so klein. Es war nicht seine Schuld.\n@c0@"
  en: "@aBianca@bI s'pose no good can come of thinkin' like that, though. Harry was only young, after all. It wasn't his fault.\n@c0@"
  es: "@aBianca@bAunque ya no importa. Al fin y al cabo, Froilán solo era un chavalín. No fue culpa suya, ¿sabes?\n@c0@"
  fr: "@aBianca@bMais ça ne sert à rien de raisonner en ces termes. Harry était tout jeune. Ce n'était pas sa faute.\n@c0@"
  it: "@aBianca@bBah, è inutile pensarci...\nRobert non ha nessuna colpa.\n@c0@"
  ja: "@a@bビアンカ「…なんて　考えちゃダメよね。\n\t幼かった　ヘンリーさんには\n\tどうする事も　できなかっただろうし。\n@c0@"
280:
  de: "@aBianca@bDas ist also der letzte Ort, an den dein Vater und du gemeinsam gereist seid. Das Ende eurer Abenteuer.\n@c0@"
  en: "@aBianca@bSo this is the last place you and your father travelled to together. The end of your adventures...\n@c0@"
  es: "@aBianca@bAsí que este es el último lugar donde estuviste con tu padre. El punto final de vuestras aventuras...\n@c0@"
  fr: "@aBianca@bVoici donc le dernier endroit où vos voyages vous ont menés, ton père et toi. Celui qui a marqué la fin\r\nde vos aventures...\n@c0@"
  it: "@aBianca@bQuesto è l'ultimo luogo che hai visitato con tuo padre, la tappa finale delle vostre avventure insieme...\n@c0@"
  ja: "@a@bビアンカ「ここは　%a000090にとって\n\tお父さんと冒険した\n\t最後の場所　になるのね。\n@c0@"
281:
  de: "@aNera@bDu scheinst sehr niedergeschlagen zu sein, seit wir hier angekommen sind. Komm, gehen wir lieber weiter.\n@c0@"
  en: "@aNera@bYou seem to be really down in the dumps ever since we arrived here. Why don't we move on?\n@c0@"
  es: "@aNera@bDesde que llegamos aquí te veo veramente desanimado. ¿Por qué no continuamos?\n@c0@"
  fr: "@aNera@bTu sembles vraiment très déprimé depuis que nous sommes arrivés ici. Pourquoi ne pas partirⓡ\n@c0@"
  it: "@aNera@bSei diventato triste nel momento stesso in cui siamo arrivati qui. Credo che questo luogo ti riporti alla memoria eventi spiacevoli. Su, andiamocene.\n@c0@"
  ja: "@a@bフローラ「この遺跡に　来てから\n\t元気がないですわね　あなた。\n\tもう　出ましょうか？\n@c0@"
282:
  de: "@aBianca@bWir sind damals hier an Bord eines Schiffes gegangen, als wir nach Utensiel umgezogen sind. Damals war ich wirklich traurig, dass wir wegzogen.\n@c0@"
  en: "@aBianca@bWe got a boat from here when we moved to Stockenbarrel. I was really sad to leave at the time.\n@c0@"
  es: "@aBianca@bCuando nos mudamos a Clavis fuimos en barco desde aquí. La marcha fue muy triste para mí, ¿sabes?\n@c0@"
  fr: "@aBianca@bNous avons pris le bateau ici quand nous avons déménagé à Saint Éloi. J'étais vraiment triste de partir, à ce moment-là.\n@c0@"
  it: "@aBianca@bQuando lasciammo Blankenburg, salpammo da qui per raggiungere Aprianuam. Ricordo che piansi molto quando giunse il momento di partitre...\n@c0@"
  ja: "@a@bビアンカ「山奥の村へ行くとき\n\tここから　船に　乗ったわ。\n\tあの時は　さびしかった…　とても。\n@c0@"
283:
  de: "@aBianca@bDu bist einmal am Ende einer langen Reise mit Ludwig in diesem Hafen gelandet.\n@c0@"
  en: "@aBianca@bYou sailed back into this harbour once, at the end of one of your long trips with Pankraz.\n@c0@"
  es: "@aBianca@bAl final de uno de tus viajes con Teudis, volviste a este puerto.\n@c0@"
  fr: "@aBianca@bTu es revenu une fois dans ce port, à la fin de l'un de tes longs voyages avec Petros.\n@c0@"
  it: "@aBianca@bSe non sbaglio, un giorno tu e tuo padre sbarcaste in questo porto, al termine di uno dei vostri viaggi.\n@c0@"
  ja: "@a@bビアンカ「昔　%a000090がパパスさんと\n\t長い旅から帰ってきたときも\n\tこの港へ　来たんだよね？\n@c0@"
284:
  de: "@aBianca@bWenn ich damals gewusst hätte, dass du zurückkehren würdest, wäre ich gekommen und hätte dich begrüßt.\n@c0@"
  en: "@aBianca@bIf I'd known you were due back, I would've come and met you.\n@c0@"
  es: "@aBianca@bSi hubiese sabido que ibas a regresar, habría ido a esperarte, ¿sabes?\n@c0@"
  fr: "@aBianca@bSi j'avais su que tu devais y revenir, je serais venue te voir.\n@c0@"
  it: "@aBianca@bSe avessi saputo del tuo ritorno, ti avrei accolto con una ghirlanda di fiori e un vassoio di ciambelle appena sfornate! Eh eh eh!\n@c0@"
  ja: "@a@bビアンカ「帰ってくるって　わかっていれば\n\t絶対に　むかえに行ったのにな。\n@c0@"
285:
  de: "@aNera@bDieser Hafen... Weißt du noch?\n@c0@"
  en: "@aNera@bThis harbour... Do you remember too?\n@c0@"
  es: "@aNera@bEste porto... ¿También lo recuerdas?\n@c0@"
  fr: "@aNera@bCe port... Tu t'en souviens, toi aussiⓡ\n@c0@"
  it: "@aNera@bQuesto porto...\nRicordi, vero?\n@c0@"
  ja: "@a@bフローラ「この港…　あなたも\n\tおぼえて　いらっしゃいますわよね？\n@c0@"
286:
  de: "@aNera@bJa, hier haben wir uns zum allerersten Mal getroffen.\n@c0@"
  en: "@aNera@bYes, it's the place we met for the very first time.\n@c0@"
  es: "@aNera@bSí, aquí nos vimos la prima volta.\n@c0@"
  fr: "@aNera@bOui, c'est là que nous nous sommes rencontrés pour la toute première fois.\n@c0@"
  it: "@aNera@bSì.\nÈ qui che ci siamo incontrati per la prima volta.\n@c0@"
  ja: "@a@bフローラ「私たちが　初めて\n\t出会った場所ですわ。\n@c0@"
287:
  de: "@aNera@bEs war nur eine ganz kurze Begegnung, und jetzt stehen wir hier als Ehepaar. Ist das nicht seltsam?\n@c0@"
  en: "@aNera@bIt was just a fleeting encounter, and yet here we are now, man and wife. Isn't that odd?\n@c0@"
  es: "@aNera@bVeramente no fue más que un encuentro breve, y míranos ahora, marido y mujer. Qué extraño, ¿verdad?\n@c0@"
  fr: "@aNera@bCe n'était qu'une rencontre fugitive et pourtant, nous voici maintenant mari et femme.\nC'est étrange, nonⓡ\n@c0@"
  it: "@aNera@bCi vedemmo solo per qualche istante e ora siamo marito e moglie. Certo che il destino sa essere davvero imprevedibile...\n@c0@"
  ja: "@a@bフローラ「一瞬の出会いでしたのに\n\t今　こうして夫婦としているなんて\n\tふしぎなものですわね。\n@c0@"
288:
  de: "@aNera@bEs war damals, als Papa für mich noch nicht Papa war, sondern Herr Onassetti. Damals sind wir uns zum ersten Mal begegnet.\n@c0@"
  en: "@aNera@bIt was back in the days when I didn't think of Papa as Papa. He was just Mr Briscoletti to me then. That's when you and I first met.\n@c0@"
  es: "@aNera@bEn aquel tiempo, il mio papino no era il mio papino para mí. Solo era don Rimaldi.\r\nFue cuando tú y yo nos conocimos.\n@c0@"
  fr: "@aNera@bC'était à l'époque où papa n'était pas encore ⓥpapaⓦ pour moi, mais simplement monsieur Oscuroni. C'est là que nous nous sommes vus pour la première fois.\n@c0@"
  it: "@aNera@bNon ricordi? Ero in compagnia di mio padre, e tu eri insieme al tuo. È stato qui che tu e io ci siamo visti per la prima volta...\n@c0@"
  ja: "@a@bフローラ「私が　ルドマンを\n\tお父さまと呼びなれない頃だったわ。\n\tその時　あなたに会っているのよ。\n@c0@"
289:
  de: "@aNera@bHier gibt es immer so viele Möwen. Das weiß ich noch vom letzten Mal.\n@c0@"
  en: "@aNera@bThere are always so many seagulls here.\r\nI remember that from last time.\n@c0@"
  es: "@aNera@bSempre hay muchas gaviotas aquí.\r\nLo recuerdo de la última volta.\n@c0@"
  fr: "@aNera@bIl y a toujours autant de mouettes, ici.\r\nC'est un détail qui m'a marquée, à l'époque.\n@c0@"
  it: "@aNera@bHai visto quanti gabbiani?\nGuardare il loro volo leggero e spensierato mi dà una sensazione di libertà...\n@c0@"
  ja: "@a@bフローラ「今も昔も　ここは\n\tたくさんカモメが　飛んでいるのね。\n@c0@"
290:
  de: "@aBianca@bFriedliche Zeiten? Würdest du das friedliche Zeiten nennen? Da bin ich aber nicht so sicher.\n@c0@"
  en: "@aBianca@bPeaceful times? Would you call these peaceful times? I'm not too sure.\n@c0@"
  es: "@aBianca@b¿Tiempos de paz? ¿Tú dirías que estos son tiempos de paz? No estoy tan segura.\n@c0@"
  fr: "@aBianca@bLa paixⓡ Tu dirais que la paix règne, toi, en ce momentⓡ Je n'en suis pas bien sûre.\n@c0@"
  it: "@aBianca@bPoveretta...\nSe avessi un marito del genere, mi piacerebbe averlo tra i piedi... per dargli un bel calcio dove dico io!\n@c0@"
  ja: "@a@bビアンカ「平和？\n\t今って　平和なのかな。\n\tよく　わからないね。\n@c0@"
291:
  de: "@aNera@bIch hoffe nur, der Frieden ist von Dauer, das ist alles.\n@c0@"
  en: "@aNera@bI just hope the peace lasts, that's all.\n@c0@"
  es: "@aNera@bEspero que la pace sea duradera, nada más.\n@c0@"
  fr: "@aNera@bJ'espère que cette ⓥpaixⓦ va durer, c'est tout.\n@c0@"
  it: "@aNera@bNon mi piacerebbe essere moglie di un uomo che dorme sempre. Preferisco avere accanto una persona dinamica e piena di vitalità.\n@c0@"
  ja: "@a@bフローラ「少しでも長く\n\t平和が　続くといいんですけど……。\n@c0@"
292:
  de: "@aBianca@bDas Stift ist wirklich so etwas wie ein geheiligter Zufluchtsort für Frauen. Selbst ich als Frau fühle mich hier ein bisschen wie ein Eindringling!\n@c0@"
  en: "@aBianca@bThis abbey really feels like a sacred domain for women. I'm a woman meself, and yet I feel a bit\r\nlike I'm intrudin'!\n@c0@"
  es: "@aBianca@bEsta abadía da la sensación de ser un lugar sagrado para mujeres. ¡Fíjate que, aunque soy una mujer, me siento como una intrusa!\n@c0@"
  fr: "@aBianca@bCette abbaye est vraiment un refuge sacré pour les femmes. J'ai beau être une femme moi-même, je m'y sens un peu comme une intruseⓠ\n@c0@"
  it: "@aBianca@bQuest'abbazia è bellissima.\nSembra più un luogo celeste che non una costruzione edificata dagli uomini...\n@c0@"
  ja: "@a@bビアンカ「修道院って　女の園って感じで\n\tちょっと　きんちょうしちゃうね。\n\t女の私でも　ドキドキしてきたわ。\n@c0@"
293:
  de: "@aNera@bIch habe auch eine Weile hier gelebt und der Göttin gedient. Hast du das gewusst?\n@c0@"
  en: "@aNera@bI stayed here for a while and dedicated my daily life to the Goddess. Did you know that?\n@c0@"
  es: "@aNera@bPasé una temporada aquí dedicando la mia vita quotidiana a la Diosa. ¿Lo sabías?\n@c0@"
  fr: "@aNera@bJ'ai passé un certain temps ici, à consacrer ma vie quotidienne à la Déesse. Tu le savaisⓡ\n@c0@"
  it: "@aNera@bHo trascorso parte della mia vita in quest'abbazia.\nÈ qui che sono stata educata ad amare la dea e tutto ciò che ha creato.\n@c0@"
  ja: "@a@bフローラ「私　ここで神さまに\n\tおつかえしていたことが　ありますの。\n\tあなた　ご存じだったかしら？\n@c0@"
294:
  de: "@aBianca@bDu scheinst diese Nonne ja gut zu kennen, was, %a000090? \n@c0@"
  en: "@aBianca@bYou know that nun, eh, %a000090?\n@c0@"
  es: "@aBianca@bConoces a esa monja, ¿eh, %a000090?\n@c0@"
  fr: "@aBianca@bTu connais cette religieuse, hein, %a000090ⓡ\n@c0@"
  it: "@aBianca@bNon immaginavo che queste suore sapessero che stai cercando tua madre, %a000090...\n@c0@"
  ja: "@a@bビアンカ「%a000090って　シスターさんと\n\t知り合いなんだね。\n@c0@"
295:
  de: "@aNera@bZum Stift kommen viele Leute, wenn sie traurig und bedürftig sind. Aber ich war nur zum Lernen hier.\n@c0@"
  en: "@aNera@bLots of people come to the abbey in times of sadness and need. I just came here to study.\n@c0@"
  es: "@aNera@bMuchas personas vienen a la abadía en tiempos de pesar y necesidad. Yo solo vine a studiare.\n@c0@"
  fr: "@aNera@bDe nombreuses personnes viennent à l'abbaye dans des moments de tristesse et de détresse. Moi je suis seulement venue ici pour étudier.\n@c0@"
  it: "@aNera@bMolta gente viene all'abbazia quando è disperata o ha perso fiducia nella vita. Io, invece, fui mandata qui per ricevere un'educazione rigorosa.\n@c0@"
  ja: "@a@bフローラ「修道院の門をたたく人の中には\n\t不幸な身の上の方もいらっしゃいます。\n\t私は勉強のために　入りましたが……。\n@c0@"
296:
  de: "@aBianca@bDann muss der Prinz auf dem weißen Pferd wohl Harry sein! Ha ha!! Was für ein Märchen!\n@c0@"
  en: "@aBianca@bI s'pose that makes the prince on a white horse Harry! Ha ha! What a story!\n@c0@"
  es: "@aBianca@b¡Supongo que entonces Froilán viene a ser el príncipe del caballo blanco! ¡Ja, ja! ¡Qué historia!\n@c0@"
  fr: "@aBianca@bJe suppose que ça fait de Harry un prince sur un cheval blancⓠ Ha haⓠ Quelle histoireⓠ\n@c0@"
  it: "@aBianca@bImmagino che ⓕil principeⓖ sia Robert, non è così?\nBeh, ce lo vedo, galoppare con i capelli al vento in groppa a un cavallo bianco! Eh eh eh!\n@c0@"
  ja: "@a@bビアンカ「あれって\n\tヘンリーさんの話よね？\n\tなかなか　やるじゃないの！\n@c0@"
297:
  de: "@aNera@bFür mich bist du mein Prinz auf einem weißen Pferd, %a000090. Hach...\n@c0@"
  en: "@aNera@bYou're my prince on a white horse, %a000090. Aaah...\n@c0@"
  es: "@aNera@bIl mio príncipe eres tú, %a000090. Aaah...\n@c0@"
  fr: "@aNera@bMon prince sur un cheval blanc, c'est toi %a000090. Aaaah...\n@c0@"
  it: "@aNera@bTu sei il mio principe, %a000090.\nNon importa se non hai un cavallo bianco: tu sarai sempre il principe del mio cuore.\n@c0@"
  ja: "@a@bフローラ「私にとっての\n\t白馬の王子さまは　あなたですわ。\n\tぽっ……。\n@c0@"
298:
  de: "@aBianca@bJa, ich kann's förmlich vor mir sehen. Harry benimmt sich nicht gerade wie ein Prinz.\n@c0@"
  en: "@aBianca@bYeah, I can see that. Harry dun't act much like\r\na prince.\n@c0@"
  es: "@aBianca@bSí, ya lo he notado. Froilán no tiene maneras principescas de esas.\n@c0@"
  fr: "@aBianca@bOui, j'imagine bien la scène. Harry ne se conduit pas vraiment comme un prince.\n@c0@"
  it: "@aBianca@bLa dea tutto vede e tutto sa.\n@c0@"
  ja: "@a@bビアンカ「そりゃ　おどろくわよね。\n\tヘンリーさんって　あんまり\n\t王族って感じが　しないし……。\n@c0@"
299:
  de: "@aNera@bJa, Harry benimmt sich überhaupt nicht prinzlich. Er steht mit beiden Füßen fest auf dem Boden. Ach was? So war er nicht immer?\n@c0@"
  en: "@aNera@bYes, Harry doesn't act like royalty at all. He's very down-to-earth. Oh? He wasn't always that way?\n@c0@"
  es: "@aNera@bYa, Froilán no actúa como si fuese noble. Es una persona veramente práctica. ¿Cómo? ¿Que no siempre ha sido così, dices?\n@c0@"
  fr: "@aNera@bOui, Harry ne respecte pas vraiment les codes de la royauté. Il est très pragmatique. Ohⓡ Il n'a pas toujours été comme ça, tu disⓡ\n@c0@"
  it: "@aNera@bNulla di ciò che accade sulla terra o che è nei cuori degli uomini è ignoto alla dea...\n@c0@"
  ja: "@a@bフローラ「ヘンリーさんて　とても王族とは\n\t思えない　気さくな方ですものね。\n\tえっ　昔は　ちがったんですか？\n@c0@"
300:
  de: "@aBianca@bApropos Heirat, jetzt dauert es bei dir ja auch nicht mehr lange, %a000090. Nera wartet schon auf dich...\n@c0@"
  en: "@aBianca@bTalkin' of marriage, it won't be long for you now, %a000090. Nera's waitin'...\n@c0@"
  es: "@aBianca@bHablando de casados, ya no te falta mucho, %a000090. Nera te está esperando...\n@c0@"
  fr: "@aBianca@bEn parlant de mariage, ça ne devrait plus tarder pour toi, %a000090. Nera attend...\n@c0@"
  it: "@aBianca@bA proposito di matrimonio...\nTra un po' toccherà a te, %a000090.\nLa bella Nera presto diventerà tua moglie, eh?\n@c0@"
  ja: "@a@bビアンカ「結婚なら　%a000090も\n\tもうすぐよね。　だって\n\tフローラさんと……。\n@c0@"
301:
  de: "@aBianca@bIst sie etwa blind oder was? Ich bin schließlich deine Frau und ich stand direkt neben dir!\n@c0@"
  en: "@aBianca@bIs she blind or what!? I'm your wife and I'm stood right next to you!\n@c0@"
  es: "@aBianca@b¡¿Está ciega o qué le pasa?! ¡Soy tu mujer y estoy de pie a tu lado!\n@c0@"
  fr: "@aBianca@bElle est bigleuse ou quoiⓡⓐ Elle ne voit pas que je suis ta femme et que je suis juste à côté de toiⓡ\n@c0@"
  it: "@aBianca@bMa che fa?! Ci prende in giro?!\nNon ha capito che sei già sposato e che tua moglie è proprio accanto a te, eh?!\n@c0@"
  ja: "@a@bビアンカ「むっ……。\n\tこんなに　%a000090の近くにいるのに\n\t妻に見えない私って　いったい……。\n@c0@"
302:
  de: "@aNera@bIch bin wohl gerade ziemlich unauffällig mit dem Hintergrund verschmolzen.\n@c0@"
  en: "@aNera@bI seemed to rather fade into the background then.\n@c0@"
  es: "@aNera@bVeramente, parecía que fuese transparente.\n@c0@"
  fr: "@aNera@bApparemment, je me fonds dans le décor...\n@c0@"
  it: "@aNera@bTemo che la suora non si sia resa conto che io sono tua moglie...\n@c0@"
  ja: "@a@bフローラ「まあ　私ったら　すこし\n\tえんりょが　あったみたいですわね。\n@c0@"
303:
  de: "@aNera@bIch muss versuchen, es in Zukunft etwas deutlicher durchblicken zu lassen, dass du mein Mann bist.\n@c0@"
  en: "@aNera@bI'll have to try to make it look more obvious that we're man and wife in the future.\n@c0@"
  es: "@aNera@bEn el futuro tendré que hacer que se note più que somos marido y mujer.\n@c0@"
  fr: "@aNera@bÀ l'avenir, je vais faire en sorte qu'il soit plus évident que nous sommes mariés.\n@c0@"
  it: "@aNera@bDovrò fare in modo che si capisca subito che sei mio marito. Non so, magari metterti al collo un cartello con su scritto ⓕSono sposato con Neraⓖ...\n@c0@"
  ja: "@a@bフローラ「これからは　誰の目にも\n\t夫婦に見られるよう　もっと\n\tせっきょく的に　まいりますわ。\n@c0@"
304:
  de: "@aBianca@bIch bin sicher, du wirst ein guter Ehemann, %a000090.\n@c0@"
  en: "@aBianca@bI'm sure you'll turn out to be a good husband, %a000090.\n@c0@"
  es: "@aBianca@bSeguro que vas a ser un marido estupendo, %a000090.\n@c0@"
  fr: "@aBianca@bJe suis certaine que tu feras un bon mari, %a000090.\n@c0@"
  it: "@aBianca@bAnch'io sono convinta che sarai un ottimo marito, %a000090.\n@c0@"
  ja: "@a@bビアンカ「%a000090なら\n\tやさしい　ダンナさんに\n\tなりそうだよね。\n@c0@"
305:
  de: "@aBianca@bWir haben gerade erst geheiratet, also kann man noch nicht wissen, was für ein Ehemann du mal wirst. Aber es wird Spaß machen, das herauszufinden.\n@c0@"
  en: "@aBianca@bWe've only just got married, so it's hard to tell what kind of a husband you're goin' to be. It'll be fun findin' out, though!\n@c0@"
  es: "@aBianca@bNos acabamos de casar, así que es difícil saber qué clase de marido vas a ser. ¡Pero será divertido descubrirlo!\n@c0@"
  fr: "@aBianca@bOn vient tout juste de se marier, alors c'est encore difficile de dire quel genre d'époux tu feras. Mais\nça va être drôle de le découvrir au jour le jourⓠ\n@c0@"
  it: "@aBianca@bCi siamo appena sposati, quindi non ho ancora capito bene che marito sei... Però ti avverto: se non righerai dritto, t'inseguirò col forcone! Ih ih ih!\n@c0@"
  ja: "@a@bビアンカ「まだ　結婚したばかりだけど\n\t%a000090って　どんな　ダンナさんに\n\tなっていくのかな？　楽しみだね。\n@c0@"
306:
  de: "@aNera@bDie Frau hat es wirklich nicht leicht gehabt. Davon habe ich damals schon gehört, als ich im Stift war.\n@c0@"
  en: "@aNera@bShe's had a really hard time of it, that woman.\r\nI heard all about it when I was here at the\r\nabbey before.\n@c0@"
  es: "@aNera@bEsa mujer lo ha pasado veramente mal.\r\nMe lo contaron cuando estuve en la abadía.\n@c0@"
  fr: "@aNera@bElle a vraiment beaucoup souffert, la pauvre.\r\nJ'ai entendu toute son histoire quand j'étais\r\nencore à l'abbaye.\n@c0@"
  it: "@aNera@bQuella povera donna non ha avuto un matrimonio felice. Venne a chiedere aiuto all'abbazia proprio nel periodo in cui vivevo lì...\n@c0@"
  ja: "@a@bフローラ「この方の　苦労話には\n\tまだまだ　続きがありますのよ。\n\tここにいたころ　全部　聞いたんです。\n@c0@"
307:
  de: "@aNera@bDie Arme... Wenn ich nur daran denke, was sie durchgemacht hat, schnürt es mir schon die Kehle zu.\n@c0@"
  en: "@aNera@bThe poor thing. Just thinking of what she's been through makes me feel all choked up.\n@c0@"
  es: "@aNera@bPoverina. Solo de pensar lo mal que lo ha pasado se me hace un nudo en la garganta.\n@c0@"
  fr: "@aNera@bPauvre femme. Je suffoque rien qu'à l'idée de ce qu'elle a dû endurer.\n@c0@"
  it: "@aNera@bÈ un peccato che alcune persone non sappiano tener fede alla promessa di amore e rispetto reciproco che hanno fatto alla dea quando si sono sposate...\n@c0@"
  ja: "@a@bフローラ「あっ　どうしましょう。\n\tちょっと　思い出しただけで　涙が\n\tこみ上げてきましたわ　ううっ……。\n@c0@"
308:
  de: "@aBianca@bDas also ist das Stift, in dem Nera mal gewohnt hat. Was man ihr hier wohl beigebracht hat?\n@c0@"
  en: "@aBianca@bSo this is the abbey Nera stayed at once. I wonder what it was she was studying here exactly.\n@c0@"
  es: "@aBianca@bAsí que esta es la abadía en la que estuvo Nera. Me pregunto qué estudiaba aquí exactamente, ¿sabes?\n@c0@"
  fr: "@aBianca@bAlors c'est dans cette abbaye que Nera a passé du temps autrefois. Je me demande ce qu'elle y étudiait exactement.\n@c0@"
  it: "@aBianca@bAllora è questa l'abbazia dove Nera ha trascorso un periodo della sua vita?\nChissà se si è trovata bene qui...\n@c0@"
  ja: "@a@bビアンカ「やっぱり　ここが\n\tフローラさんのいた修道院だったのね。\n\tここで　どんな勉強をしたのかしら。\n@c0@"
309:
  de: "@aNera@bOh nein! Sie ist immer noch nicht wieder zurück. Ich hoffe nur, es ist alles in Ordnung mit ihr.\n@c0@"
  en: "@aNera@bOh no! She's not back yet. I do hope she's alright.\n@c0@"
  es: "@aNera@b¡Oh, no! Aún no ha regresado. Espero que se encuentre bene.\n@c0@"
  fr: "@aNera@bOh nonⓠ Elle n'est pas encore revenue.\nJ'espère qu'elle va bien.\n@c0@"
  it: "@aNera@bChe cosa?! Non è ancora tornata?!\nOh, santa dea! Speriamo che non le sia successo nulla!\n@c0@"
  ja: "@a@bフローラ「えっ　まだ　帰っていない？\n\tあの方が　無事でいらっしゃると\n\tいいんですけど……。\n@c0@"
310:
  de: "@aBianca@bNachts herrscht hier Grabesstille. Es ist fast so, als wäre überhaupt niemand hier.\n@c0@"
  en: "@aBianca@bIt's quiet as the grave here of a night. It's almost like there's no one here at all.\n@c0@"
  es: "@aBianca@bDe noche esto es tan silencioso como un cementerio. Parece como si no hubiese nadie aquí, ¿sabes?\n@c0@"
  fr: "@aBianca@bTout est si silencieux, pendant la nuit. On dirait presque qu'il n'y a personne ici.\n@c0@"
  it: "@aBianca@bDi notte qui c'è una pace assoluta.\nSembra che non ci sia anima viva nel raggio di miglia e miglia...\n\n@c0@"
  ja: "@a@bビアンカ「修道院って　夜は\n\tこんなに　ひっそりと静かなのね。\n\t誰も　いないかのようだわ。\n@c0@"
311:
  de: "@aNera@bMir ist die Zeit, die ich hier verbracht habe, wirklich sehr teuer.\n@c0@"
  en: "@aNera@bI really treasure the time I spent here.\n@c0@"
  es: "@aNera@bEl tempo que pasé aquí significó mucho per me.\n@c0@"
  fr: "@aNera@bLes moments que j'ai passés ici sont réellement précieux.\n@c0@"
  it: "@aNera@bHo splendidi ricordi del tempo che ho trascorso all'Abbazia di Su'ncyel.\n@c0@"
  ja: "@a@bフローラ「ここで過ごした年月は\n\t私にとって　大切な宝物ですわ。\n@c0@"
312:
  de: "@aNera@bAls ich nach Hause reiste, hätte ich nie gedacht, dass ich hier noch einmal herkommen würde.\n@c0@"
  en: "@aNera@bWhen I left for home, I never imagined I'd have the chance to visit the place again.\n@c0@"
  es: "@aNera@bCuando regresé a la mia casa, nunca pensé que tendría la opportunità de volver.\n@c0@"
  fr: "@aNera@bLorsque je suis partie de cet endroit pour rentrer à la maison, je n'imaginais pas que j'aurais l'occasion d'y revenir un jour.\n@c0@"
  it: "@aNera@bChissà che persona sarei oggi, se non fossi stata educata qui...\nAh, non lo saprò mai.\n@c0@"
  ja: "@a@bフローラ「家にもどったら　もう二度と\n\t修道院を　おとずれることは\n\tかなわないと　思っていましたが……。\n@c0@"
313:
  de: "@aBianca@bJa, ich kann's förmlich vor mir sehen. Harry benimmt sich nicht gerade wie ein Prinz.\n@c0@"
  en: "@aBianca@bYeah, I can see that. Harry dun't act much like\r\na prince.\n@c0@"
  es: "@aBianca@bSí, ya lo he notado. Froilán no tiene maneras principescas de esas.\n@c0@"
  fr: "@aBianca@bOui, j'imagine bien la scène. Harry ne se conduit pas vraiment comme un prince.\n@c0@"
  it: "@aBianca@bLa dea tutto vede e tutto sa.\n@c0@"
  ja: "@a@bビアンカ「そりゃ　おどろくわよね。\n\tヘンリーさんって　あんまり\n\t王族って感じが　しないし……。\n@c0@"
314:
  de: "@aNera@bJa, Harry benimmt sich überhaupt nicht prinzlich. Er steht mit beiden Füßen fest auf dem Boden. Ach was? So war er nicht immer?\n@c0@"
  en: "@aNera@bYes, Harry doesn't act like royalty at all. He's very down-to-earth. Oh? He wasn't always that way?\n@c0@"
  es: "@aNera@bYa, Froilán no actúa como si fuese noble. Es una persona veramente práctica. ¿Cómo? ¿Que no siempre ha sido così, dices?\n@c0@"
  fr: "@aNera@bOui, Harry ne respecte pas vraiment les codes de la royauté. Il est très pragmatique. Ohⓡ Il n'a pas toujours été comme ça, tu disⓡ\n@c0@"
  it: "@aNera@bNulla di ciò che accade sulla terra o che è nei cuori degli uomini è ignoto alla dea...\n@c0@"
  ja: "@a@bフローラ「ヘンリーさんて　とても王族とは\n\t思えない　気さくな方ですものね。\n\tえっ　昔は　ちがったんですか？\n@c0@"
315:
  de: "@aBianca@bApropos Heirat, jetzt dauert es bei dir ja auch nicht mehr lange, %a000090. Nera wartet schon auf dich...\n@c0@"
  en: "@aBianca@bTalkin' of marriage, it won't be long for you now, %a000090. Nera's waitin'...\n@c0@"
  es: "@aBianca@bHablando de casados, ya no te falta mucho, %a000090. Nera te está esperando...\n@c0@"
  fr: "@aBianca@bEn parlant de mariage, ça ne devrait plus tarder pour toi, %a000090. Nera attend...\n@c0@"
  it: "@aBianca@bA proposito di matrimonio...\nTra un po' toccherà a te, %a000090.\nLa bella Nera presto diventerà tua moglie, eh?\n@c0@"
  ja: "@a@bビアンカ「結婚なら　%a000090も\n\tもうすぐよね。　だって\n\tフローラさんと……。\n@c0@"
316:
  de: "@aBianca@bIst sie etwa blind oder was? Ich bin schließlich deine Frau und ich stand direkt neben dir!\n@c0@"
  en: "@aBianca@bIs she blind or what!? I'm your wife and I'm stood right next to you!\n@c0@"
  es: "@aBianca@b¡¿Está ciega o qué le pasa?! ¡Soy tu mujer y estoy de pie a tu lado!\n@c0@"
  fr: "@aBianca@bElle est bigleuse ou quoiⓡⓐ Elle ne voit pas que je suis ta femme et que je suis juste à côté de toiⓡ\n@c0@"
  it: "@aBianca@bMa che fa?! Mi prende in giro?!\nNon ha capito che sei già sposato, e che tua moglie è proprio accanto a te, eh?!\n@c0@"
  ja: "@a@bビアンカ「むっ……。\n\tこんなに　%a000090の近くにいるのに\n\t妻に見えない私って　いったい……。\n@c0@"
317:
  de: "@aNera@bIch bin wohl gerade ziemlich unauffällig mit dem Hintergrund verschmolzen.\n@c0@"
  en: "@aNera@bI seemed to rather fade into the background then.\n@c0@"
  es: "@aNera@bVeramente, parecía que fuese transparente.\n@c0@"
  fr: "@aNera@bApparemment, je me fonds dans le décor...\n@c0@"
  it: "@aNera@bTemo che la suora non si sia resa conto che io sono tua moglie...\n@c0@"
  ja: "@a@bフローラ「まあ　私ったら　すこし\n\tえんりょが　あったみたいですわね。\n@c0@"
318:
  de: "@aNera@bIch muss versuchen, es in Zukunft etwas deutlicher durchblicken zu lassen, dass du mein Mann bist.\n@c0@"
  en: "@aNera@bI'll have to try to make it look more obvious that we're man and wife in the future.\n@c0@"
  es: "@aNera@bEn el futuro tendré que hacer que se note più que somos marido y mujer.\n@c0@"
  fr: "@aNera@bÀ l'avenir, je vais faire en sorte qu'il soit plus évident que nous sommes mariés.\n@c0@"
  it: "@aNera@bDovrò fare in modo che si capisca subito che sei mio marito. Non so, magari potrei tatuarti sulla fronte un messaggio che dice ⓕSono sposato con Neraⓖ...\n@c0@"
  ja: "@a@bフローラ「これからは　誰の目にも\n\t夫婦に見られるよう　もっと\n\tせっきょく的に　まいりますわ。\n@c0@"
319:
  de: "@aBianca@bLustig, die Leute im Schlaf reden zu hören. Ich hoffe, der Nonne, von der sie geredet hat, geht es gut.\n@c0@"
  en: "@aBianca@bIt's funny hearin' someone talk in their sleep.\r\nI wonder if that nun she was on about is okay.\n@c0@"
  es: "@aBianca@bEs divertido oír a alguien hablar en sueños.\r\nMe pregunto si esa monja de la que hablaba se encuentra bien, ¿sabes?\n@c0@"
  fr: "@aBianca@bC'est amusant d'entendre les gens parler pendant leur sommeil. Je me demande si la religieuse dont\r\nelle parle va bien.\n@c0@"
  it: "@aBianca@bSapevo che c'è gente che parla nel sonno, ma questa suora esagera! Eh eh eh! Ehm... Beh, speriamo che la consorella di cui parlava stia bene...\n@c0@"
  ja: "@a@bビアンカ「眠ったまま\n\tあんなに話して……。\n\tあの人のほうこそ　大丈夫かしら？\n@c0@"
320:
  de: "@aNera@bOh nein! Sie ist immer noch nicht wieder zurück. Ich hoffe nur, es ist alles in Ordnung mit ihr.\n@c0@"
  en: "@aNera@bOh no! She's not back yet. I do hope she's alright.\n@c0@"
  es: "@aNera@b¡Oh, no! Aún no ha regresado. Espero que se encuentre bene.\n@c0@"
  fr: "@aNera@bOh nonⓠ Elle n'est pas encore revenue.\nJ'espère qu'elle va bien.\n@c0@"
  it: "@aNera@bChe cosa?! Non è ancora tornata?!\nOh, santa dea! Speriamo che non le sia successo nulla!\n@c0@"
  ja: "@a@bフローラ「えっ　まだ　帰っていない？\n\tあの方が　無事でいらっしゃると\n\tいいんですけど……。\n@c0@"
321:
  de: "@aBianca@bFür die arme Frau muss es schwer sein, das zu hören.\n@c0@"
  en: "@aBianca@bIt must be hard on the poor woman hearin' that.\n@c0@"
  es: "@aBianca@bDebe de ser duro para esa pobre mujer oír eso.\n@c0@"
  fr: "@aBianca@bÇa doit être dur pour la pauvre femme\r\nd'entendre ça.\n@c0@"
  it: "@aBianca@bChe dolce, questa bambina...\n@c0@"
  ja: "@a@bビアンカ「あんなこと言われると\n\tおばさんは　つらいわよね……。\n@c0@"
322:
  de: "@aNera@bIch habe gehört, dass der Vater des Mädchens sie gelegentlich geschlagen hat. Und trotzdem hängt sie an ihm!\n@c0@"
  en: "@aNera@bI heard that the girl's father would raise his hand to her on occasion. And yet she still loves him!\n@c0@"
  es: "@aNera@bDicen que, a veces, el padre de la bambina Ie pegaba. Ma de todos modos le quiere.\n@c0@"
  fr: "@aNera@bJ'ai entendu dire que le père de cette fillette levait parfois la main sur elle. Et pourtant, elle l'aime toujoursⓠ\n@c0@"
  it: "@aNera@bAvevo sentito dire che, a volte, suo padre le dava qualche ceffone...\nNon si dovrebbero mai alzare le mani sui bambini!\n@c0@"
  ja: "@a@bフローラ「父親は　この子にも\n\t手をあげたと　聞いていますけど……\n\tそんな親でも　恋しいなんてね。\n@c0@"
323:
  de: "@aBianca@bDer Ort ist berühmt für sein Kasino, oder? So viel weiß sogar ich.\n@c0@"
  en: "@aBianca@bThis place is famous for its casino, en't it?\r\nEven I know that much.\n@c0@"
  es: "@aBianca@bEste sitio es famoso por su casino, ¿verdad?\r\nLo sé hasta yo.\n@c0@"
  fr: "@aBianca@bCet endroit est réputé pour son casino, c'est bien çaⓡ Même moi, je suis au courant.\n@c0@"
  it: "@aBianca@bQuesto posto è famoso in tutto il mondo per il suo casinò. Lo conosco persino io, che non ho mai giocato d'azzardo in tutta la mia vita!\n@c0@"
  ja: "@a@bビアンカ「ここって　カジノがあることで\n\t有名な町でしょ？　私だって\n\tそれくらい　知ってるんですからね。\n@c0@"
324:
  de: "@aBianca@bDu hast doch wohl keinen Abstecher hierher gemacht, um dein Glück im Kasino zu versuchen?\n@c0@"
  en: "@aBianca@bSurely you en't decided to take a detour here so you can have a flutter in the casino!?\n@c0@"
  es: "@aBianca@b¡¿Estás pensando en desviarte a echar unas partiditas en el casino?!\n@c0@"
  fr: "@aBianca@bDites-moi que je rêveⓠ Tu as fait le détour jusqu'ici juste pour pouvoir faire un petit pari au casinoⓡ\n@c0@"
  it: "@aBianca@bDimmi una cosa, non è che per caso hai deciso di venire qui perché ti andava di fare una puntatina al casinò?\n@c0@"
  ja: "@a@bビアンカ「まさか　%a000090。\n\t大事な目的があるのに\n\tカジノへ遊びにきた…　とか？\n@c0@"
325:
  de: "@aBianca@bDu bist mir vielleicht ein Bruder Leichtfuß! Du hast doch gerade wirklich Wichtigeres zu tun! Wir sollten sehen, dass wir weiterkommen.\n@c0@"
  en: "@aBianca@bYou wally! You've got important things to be doin'.\r\nWe should get movin'.\n@c0@"
  es: "@aBianca@b¡Serás tarugo! Tienes cosas más importantes que hacer.\r\nTenemos que ponernos en marcha, ¿me entiendes?\n@c0@"
  fr: "@aBianca@bMais quelle andouilleⓠ Tu as des choses importantes\nà faire. Nous devrions repartir.\n@c0@"
  it: "@aBianca@bMa cos'hai in testa, eh?!\nCon tutto quello che abbiamo da fare tu pensi al gioco?!\n@c0@"
  ja: "@a@bビアンカ「もうっ！\n\tバカなこと　言ってないで\n\tさっさと用をすませて　もどるわよっ。\n@c0@"
326:
  de: "@aBianca@bWir sollten zusehen, dass wir hier schnell fertig werden und weiterkommen.\n@c0@"
  en: "@aBianca@bWe should finish up here fast and get on our way.\n@c0@"
  es: "@aBianca@bDeberíamos terminar rápido aquí y seguir nuestro camino.\n@c0@"
  fr: "@aBianca@bBon. Alors il ne faudrait pas traîner ici et reprendre la route le plus vite possible.\n@c0@"
  it: "@aBianca@bBeh, meglio così...\nPer un attimo avevo pensato che ti avesse dato di volta il cervello!\n@c0@"
  ja: "@a@bビアンカ「じゃあ　さっさと用をすませて\n\tもどりましょう。\n@c0@"
327:
  de: "@aBianca@bFrüher stand hier keine Brücke, darum konnte man von Wittenhausen und Steinach nicht hierher gelangen.\n@c0@"
  en: "@aBianca@bThere didn't used to be a bridge in the past, so you couldn't get here from Roundbeck and Whealbrook.\n@c0@"
  es: "@aBianca@bAntes no había puente, así que no había forma de llegar a aquí desde Golfo Blanco o Arroyofrío, ¿sabes?\n@c0@"
  fr: "@aBianca@bAutrefois, il n'existait pas de pont et il n'était pas possible d'accéder à cet endroit depuis Ruycelieu\r\net Blanchecombe.\n@c0@"
  it: "@aBianca@bNon so quando abbiano costruito il ponte...\nFino a qualche tempo fa non c'era, e non era possibile venire qui da Valcava o da Blankenburg.\n@c0@"
  ja: "@a@bビアンカ「昔は　橋が　なかったから\n\tアルカパや　サンタローズからは\n\tここには　来られなかったよね。\n@c0@"
328:
  de: "@aNera@bIch war früher oft zum Einkaufen hier. Als ich im Stift war, meine ich.\n@c0@"
  en: "@aNera@bI came here lots of times for shopping in the past. When I was staying at the abbey, I mean.\n@c0@"
  es: "@aNera@bAntes solía venir mucho por aquí de compras. Ma eso era cuando estaba en la abadía.\n@c0@"
  fr: "@aNera@bJe suis souvent venue ici, autrefois, pour faire des courses. Quand j'étais à l'abbaye, je veux dire.\n@c0@"
  it: "@aNera@bNel periodo in cui studiavo all'Abbazia di Su'ncyel, venivo spesso qui per fare acquisti.\n@c0@"
  ja: "@a@bフローラ「ここには　何度も\n\t買い出しに　訪れたことがあります。\n\tあっ　修道院にいた頃の話ですわ。\n@c0@"
329:
  de: "@aNera@bNatürlich bin ich während meiner Zeit im Stift nicht im Kasino gewesen. Aber vorher hat Papa mich oft hierher mitgenommen.\n@c0@"
  en: "@aNera@bNaturally, I didn't go to the casino during my\r\ndays at the abbey. But Papa took me there lots\r\nof times before.\n@c0@"
  es: "@aNera@bPor supuesto, mientras estaba en la abadía no iba al casino. Pero il mio papino me había llevado muchas veces antes.\n@c0@"
  fr: "@aNera@bBien évidemment, je n'allais pas au casino pendant mon séjour à l'abbaye. Mais avant ça, papa m'avait souvent emmenée ici.\n@c0@"
  it: "@aNera@bOvviamente non sono mai andata al casinò quando studiavo all'abbazia, ma mio padre mi ci aveva portato diverse volte in precedenza...\n@c0@"
  ja: "@a@bフローラ「修道院にいた頃は　とうぜん\n\tカジノは　しませんでしたが……\n\t昔　父に何度かつれられて来ましたの。\n@c0@"
330:
  de: "@aBianca@bIch würde ja zu gern ein paar Gewinne einsacken, wenn ich schon mal hier bin!\n@c0@"
  en: "@aBianca@bI'd love to win a few readies while we're here!\n@c0@"
  es: "@aBianca@b¡Ya que estamos aquí, no me importaría ganar un poco de pasta!\n@c0@"
  fr: "@aBianca@bJ'adorerais gagner un peu d'argent pendant que nous sommes iciⓠ\n@c0@"
  it: "@aBianca@bNon ho mai amato il gioco d'azzardo, ma non mi spiacerebbe affatto vincere qualche gettone.\n@c0@"
  ja: "@a@bビアンカ「私も　楽して\n\tかせぎた～い！\n@c0@"
331:
  de: "@aBianca@bIch meine, das wäre nur vernünftig. Unsere Gruppe wird immer größer und will schließlich versorgt werden.\n@c0@"
  en: "@aBianca@bI mean, it's the responsible thing to do. It's expensive providin' for our ever-expandin' party.\n@c0@"
  es: "@aBianca@bVamos, es cuestión de responsabilidad. Conseguir suministros para nuestro grupo es cada vez más caro, ¿sabes?\n@c0@"
  fr: "@aBianca@bCe serait plutôt bienvenu, nonⓡ Ça coûte cher d'entretenir une équipe qui ne cesse de s'agrandir.\n@c0@"
  it: "@aBianca@bPotrei scambiarlo con qualche oggetto utile per il gruppo!\nEquipaggiare la nostra compagnia costa caro...\n@c0@"
  ja: "@a@bビアンカ「いや　だって……\n\t仲間がふえると　装備とかに　いろいろ\n\tお金が　かかっちゃうじゃない。\n@c0@"
332:
  de: "@aNera@bDas Kasino ist nur zum Vergnügen gedacht. Man darf die Jetons nicht in Goldmünzen zurücktauschen, damit man sich nicht zu sehr im Spiel verliert.\n@c0@"
  en: "@aNera@bThe casino's just a place to have fun. They make sure you don't get too carried away by stopping you from changing tokens back into gold coins.\n@c0@"
  es: "@aNera@bEl casino es solo un sitio per la diversione. Se aseguran de que no te pases impidiéndote que cambies las fichas de nuevo per monedas de oro.\n@c0@"
  fr: "@aNera@bLe casino est juste un endroit où s'amuser.\r\nIls s'assurent qu'on ne se laisse pas emporter en\r\nne permettant pas de reconvertir les jetons en or.\n@c0@"
  it: "@aNera@bIl casinò dovrebbe essere un luogo per divertirsi, non per coltivare sogni di ricchezza.\n㈡\nCredo che la scelta di non permettere di convertire i gettoni in monete derivi proprio dalla volontà di non far sorgere effimere illusioni nei giocatori.\n@c0@"
  ja: "@a@bフローラ「カジノは　あくまで遊びですわ。\n\t熱中しすぎないように　コインを\n\tお金にかえられなく　してあるのです。\n@c0@"
333:
  de: "@aBianca@bTifortu, das ist doch das Land, dem du aus der Klemme geholfen hast, oder? Ich wünschte, ich wäre dabei gewesen!\n@c0@"
  en: "@aBianca@bCoburg's the place where you went to the rescue, eh? I wish I could've bin there to help out.\n@c0@"
  es: "@aBianca@b¿No fue a Trastámara donde acudiste al rescate? Me gustaría haber estado allí para ayudarte.\n@c0@"
  fr: "@aBianca@bCobourg est bien l'endroit que tu as aidé à sauver, nonⓡ Si seulement j'avais pu être là pour t'aider.\n@c0@"
  it: "@aBianca@bSei stato tu a riportare alla normalità le cose nel Regno di Coburg, non è così? Se avessi saputo che eri lì, sarei venuta a darti una mano! Eh eh eh!\n@c0@"
  ja: "@a@bビアンカ「ラインハットって\n\t%a000090たちが　平和にしたのよね。\n\tいいな　私も　その場にいたかったな。\n@c0@"
334:
  de: "@aNera@bNiemand scheint zu wissen, wer wirklich für Frieden in Tifortu gesorgt hat. Der wusste anscheinend nicht mal, dass der fragliche Mann direkt neben ihm stand!\n@c0@"
  en: "@aNera@bNo one seems to know who actually brought peace back to Coburg. He didn't even realise the man in question was standing right beside him!\n@c0@"
  es: "@aNera@bSembra que nadie sabe quién trajo de nuevo la pace a Trastámara. ¡Ni siquiera se dio cuenta de que el responsabile estaba de pie a su lado!\n@c0@"
  fr: "@aNera@bPersonne ne semble savoir qui a vraiment ramené la paix à Cobourg. Il n'a même pas réalisé que cette personne était juste à côté de luiⓠ\n@c0@"
  it: "@aNera@bPare che nessuno sappia che sei tu la persona che ha riportato la pace a Coburg! Quell'uomo non si è reso conto che stava parlando di te!\n@c0@"
  ja: "@a@bフローラ「でも　ラインハットを平和にした\n\t人のウワサは　流れないんですのね。\n\tその人が　ここにいるというのに。\n@c0@"
335:
  de: "@aBianca@bDamals, in der guten alten Zeit, wollte ich immer eine richtig gute Herbergswirtin werden. Genau wie meine Mutter.\n@c0@"
  en: "@aBianca@bBack in the old days, I used to want to be a really good innkeeper. Just like Mum was.\n@c0@"
  es: "@aBianca@bEn los viejos tiempos, de mayor yo quería ser una posadera de las buenas. Igual que mi madre, ¿sabes?\n@c0@"
  fr: "@aBianca@bQuand j'étais gosse, je voulais devenir une excellente tenancière d'auberge, comme ma mère.\n@c0@"
  it: "@aBianca@bIo, invece, da piccola sognavo di gestire una locanda, proprio come facevano i miei genitori.\n@c0@"
  ja: "@a@bビアンカ「昔は　私　母さんみたいな\n\t立派な　宿屋のおかみさんになるのが\n\t夢だったな……。\n@c0@"
336:
  de: "@aNera@bIch habe schon als kleines Mädchen davon geträumt, einmal eine Braut zu sein. Und endlich ist mein Traum in Erfüllung gegangen!\n@c0@"
  en: "@aNera@bMy dream when I was young was to grow up\r\nand become someone's bride. So my dream's\r\ncome true already!\n@c0@"
  es: "@aNera@bIl mio sogno cuando era piccola era crecer y convertirme la esposa de alguien. ¡Así que il mio sogno se ha hecho realidad!\n@c0@"
  fr: "@aNera@bQuand j'étais petite, mon rêve était de grandir pour pouvoir me marier avec quelqu'un. Mon rêve est\ndonc déjà devenu réalitéⓠ\n@c0@"
  it: "@aNera@bDa piccola sognavo di sposare un uomo buono e coraggioso. Sono stata davvero fortunata, perché il mio sogno si è avverato!\n@c0@"
  ja: "@a@bフローラ「私の　子供の頃の夢は\n\tお嫁さんになることでした。\n\tもう　かないましたわね…　うふふ。\n@c0@"
337:
  de: "@aBianca@bDie Frau dieses Soldaten muss ihn sehr lieben, wenn sie sich solche Sorgen um ihn macht. Der Glückliche!\n@c0@"
  en: "@aBianca@bThat soldier's wife must really love him to worry about him like that. Lucky thing!\n@c0@"
  es: "@aBianca@bLa esposa de ese soldado debe de quererlo mucho para preocuparse tanto por él. ¡Qué suertudo!\n@c0@"
  fr: "@aBianca@bLa femme de ce soldat doit vraiment l'aimer pour s'inquiéter comme ça. Il a de la chanceⓠ\n@c0@"
  it: "@aBianca@bChissà se la moglie di quel tipo è preoccupata che lui possa incontrare qualche mostro oppure se teme che l'amato consorte si imbatta in una bella fanciulla...\n@c0@"
  ja: "@a@bビアンカ「あの戦士さん　奥さんに\n\t心配してもらえるなんて\n\tラブラブじゃないの。\n@c0@"
338:
  de: "@aNera@bIch würde bestimmt dasselbe sagen, wenn ich zu Hause bleiben und mir so viele Sorgen um dich machen müsste.\n@c0@"
  en: "@aNera@bI'm sure I'd be saying just the same thing if I had to stay at home all the time worrying about you.\n@c0@"
  es: "@aNera@bSicuro que yo diría lo mismo si tuviese que quedarme en casa preocupada per te.\n@c0@"
  fr: "@aNera@bJe suis sûre que je ferais la même chose si je devais rester à la maison en permanence à me faire du souci pour toi.\n@c0@"
  it: "@aNera@bSua moglie ha tutta la mia comprensione.\nNon dev'essere bello stare a casa da sola, di notte, ad attendere il ritorno del proprio marito...\n@c0@"
  ja: "@a@bフローラ「私も　家で待つ身だったら\n\tあなたを心配して　あの方の奥さまと\n\t同じように　言ったと思いますわ。\n@c0@"
339:
  de: "@aBianca@bHa ha ha! Der kleine Junge hat dich ⓞmein Herrⓟ genannt! Jetzt wirst du allmählich alt!\n@c0@"
  en: "@aBianca@bHa ha ha! That little boy called you ⓗmisterⓘ.\nYou must be gettin' old!\n@c0@"
  es: "@aBianca@b¡Ja, ja, ja! Ese chavalín te ha tratado de usted.\r\n¡Debes de estar haciéndote viejo!\n@c0@"
  fr: "@aBianca@bHa ha haⓠ Ce petit garçon t'a appelé ⓥmonsieurⓦ.\nTu dois te faire vieuxⓠ\n@c0@"
  it: "@aBianca@bWah ah ah!\nQuel ragazzino ti ha chiamato ⓕsignoreⓖ!\nStai diventando vecchio, caro mio!\n@c0@"
  ja: "@a@bビアンカ「あはは　%a000090も\n\t子供から見れば　おじさんなのね。\n@c0@"
340:
  de: "@aNera@bMach dir nichts draus, Liebling. Wenn du ⓞmein Herrⓟ bist, dann bin ich wohl ⓞmeine Dameⓟ!\n@c0@"
  en: "@aNera@bDon't worry, darling. If you're ⓗmisterⓘ, then I suppose I must be ⓗmissusⓘ!\n@c0@"
  es: "@aNera@bNon ti preoccupare, caro. ¡Solo está siendo veramente cortés, per eso te trata de usted!\n@c0@"
  fr: "@aNera@bNe t'inquiète pas, mon chéri. Si tu es un ⓥmonsieurⓦ, alors ça fait de moi une ⓥmadameⓦⓠ\n@c0@"
  it: "@aNera@bSono anni che non gioco a nascondino...\nE tu da quant'è che non lo fai... ⓕsignoreⓖ?\nIh ih ih!\n@c0@"
  ja: "@a@bフローラ「だ　大丈夫ですわ。\n\tあなたが　おじさんなら\n\t私も　おばさんですから。\n@c0@"
341:
  de: "@aBianca@bⓞMein Herrⓟ? Ich sehe hier keinen Herrn? Oder meint er etwa dich? Oh nein! Bin ich dann etwa ⓞmeine Dameⓟ?!\n@c0@"
  en: "@aBianca@bI dun't see any ⓗmisterⓘ anywhere. Unless he means you. Yikes! Does that make me ⓗmissusⓘ!?\n@c0@"
  es: "@aBianca@bAaaay, que te ha tratado de usted. Te estás haciendo mayor... ¡Eh! ¡Pero si yo soy mayor que tú...!\n@c0@"
  fr: "@aBianca@bJe ne vois pas de ⓥmonsieurⓦ, dans le coin. Sauf s'il parlait de toi. Flûteⓠ Ça veut dire que je suis une ⓥmadameⓦ, alorsⓡⓐ\n@c0@"
  it: "@aBianca@bSe tu sei un ⓕsignoreⓖ, allora io sono una ⓕsignoraⓖ, no? Santo cielo!\nVuol dire che sto invecchiando?!\n@c0@"
  ja: "@a@bビアンカ「でも　おじさんは　ないわよね。\n\tそんなこと言ったら　私は　おばさん？\n\t……じょうだんでしょ。\n@c0@"
342:
  de: "@aNera@bFrüher habe ich oft mit den Kindern hier gespielt, als ich zum Einkaufen herkam.\n@c0@"
  en: "@aNera@bI used to play with those children a lot when I came here for my shopping.\n@c0@"
  es: "@aNera@bCuando venía aquí de compras solía jugar con esos bambini.\n@c0@"
  fr: "@aNera@bJe jouais souvent avec ces enfants quand je venais ici faire des courses.\n@c0@"
  it: "@aNera@bQuando venivo qui a far compere giocavo sempre con i bambini del posto.\n@c0@"
  ja: "@a@bフローラ「ここへ買い出しに　来たときは　\n\tよく　あの子たちと遊んだものですわ。\n@c0@"
343:
  de: "@aNera@bDamals war ich für sie ihre große Schwester. Ich bin wohl alt geworden.\n@c0@"
  en: "@aNera@bThey used to call me ⓗbig sisⓘ back then. It looks like I must've aged.\n@c0@"
  es: "@aNera@bEn aquellos tiempos me llamaban sorella mayor y me trataban de tú. Supongo que estoy più vecchia.\n@c0@"
  fr: "@aNera@bIls avaient pris l'habitude de m'appeler ⓥgrande sœurⓦ, à l'époque. Il faut croire que j'ai vieilli.\n@c0@"
  it: "@aNera@bRicordo che mi chiamavano ⓕsorellonaⓖ, ma credo di essere invecchiata da allora...\nIh ih ih!\n@c0@"
  ja: "@a@bフローラ「その時は　あの子たち\n\t私を　お姉ちゃんと\n\t呼んでくれていましたけど……。\n@c0@"
344:
  de: "@aBianca@bEine Schleimschleife... Das klingt ja ziemlich merkwürdig.\n@c0@"
  en: "@aBianca@bA slime curio... Sounds pretty curious to me.\n@c0@"
  es: "@aBianca@bUn souvenir limoso... Me parece bastante curioso, ¿sabes?\n@c0@"
  fr: "@aBianca@bUne breloque de gluants... Ça m'a l'air curieux,\r\ncomme objet.\n@c0@"
  it: "@aBianca@bUna cintura degli Slime di Fortuna?\nDi che oggetto si tratterà...?\n@c0@"
  ja: "@a@bビアンカ「のれんか……。\n\tそんなに　めずらしいものなんだ。\n@c0@"
345:
  de: "@aNera@bPapa wollte immer so eine haben. Aber er ging aus Fortuna weg, bevor er als Stammkunde galt.\n@c0@"
  en: "@aNera@bPapa wanted one of those. But he left Fortuna before he could be considered a regular customer.\n@c0@"
  es: "@aNera@bIl mio papino quería uno. Ma se fue de Fortuna antes de que le considerasen un cliente habitual.\n@c0@"
  fr: "@aNera@bPapa en voulait une. Mais il a quitté Bonaventure avant d'être considéré comme un client fidèle.\n@c0@"
  it: "@aNera@bPapà ha sempre desiderato possedere una cintura degli Slime, ma lasciò Fortuna prima che il gestore della bottega riuscisse a procurargliela.\n@c0@"
  ja: "@a@bフローラ「父も欲しがっていたのですが\n\t常連になる前に　この町を\n\tはなれてしまったみたいですわね。\n@c0@"
346:
  de: "@aBianca@bWenn die Leute hier den Laden schon eigenartig finden, dann muss er wohl wirklich seltsam sein.\n@c0@"
  en: "@aBianca@bIf the local folk are callin' the place strange, then it must be pretty odd.\n@c0@"
  es: "@aBianca@bSi las personas del lugar dicen que es extraño, será extraño pero de verdad, ¿sabes?\n@c0@"
  fr: "@aBianca@bSi même les gens du coin trouvent l'endroit étrange, c'est que ça doit être sacrément bizarre.\n@c0@"
  it: "@aBianca@bChissà cos'avrà di tanto particolare questo negozio per essere definito ⓕcuriosoⓖ...\n@c0@"
  ja: "@a@bビアンカ「町の人にまで　変な店って\n\t言われるくらいだから\n\tよほど　変わってるのかもね。\n@c0@"
347:
  de: "@aNera@bIch finde den Laden gar nicht eigenartig. Ich habe den Besitzer immer für sehr nett gehalten.\n@c0@"
  en: "@aNera@bI don't think the place is strange. I always thought the owner was rather sweet.\n@c0@"
  es: "@aNera@bNon credo que el sitio sea extraño. Siempre he opinado que el propietario era molto gentile.\n@c0@"
  fr: "@aNera@bJe ne trouve pas l'endroit étrange. J'ai toujours pensé que le propriétaire était plutôt gentil.\n@c0@"
  it: "@aNera@bConosco quel negozio, e non mi è sembrato affatto curioso.\nIl proprietario, poi, era un vero simpaticone!\n@c0@"
  ja: "@a@bフローラ「そうかしら？　私は\n\tオラクル屋のおじさま　好きですわ。\n\tやさしくって。　ぽっ……。\n@c0@"
348:
  de: "@aBianca@bDa hofft man, nicht übers Ohr gehauen zu werden, und bekommt es mit einem Kerl zu tun, der sich mit dem Zenithia-Kram eine goldene Nase verdienen will.\n@c0@"
  en: "@aBianca@bHuh. Here's hopin' we're not goin' to get stung and forced to pay a fortune for this Zenithian stuff by some bloke out to make a killin'.\n@c0@"
  es: "@aBianca@bMmm. Espero que no nos timen y acabemos pagando una fortuna por estos trastos de Zenithia a cualquiera con ganas de conseguir dinero fácil.\n@c0@"
  fr: "@aBianca@bTsss. J'espère que nous n'allons pas être coincés et obligés de débourser une fortune pour ce truc zénithien à cause d'un type en mal d'aventure.\n@c0@"
  it: "@aBianca@bUhm, pare proprio che i pezzi dell'Equipaggiamento Zenithiano siano molto ambiti...\n@c0@"
  ja: "@a@bビアンカ「うっ…　この先　高い値段で\n\t泣く泣く　商人から　天空の防具を\n\t買うなんてことが　ありませんように。\n@c0@"
349:
  de: "@aNera@bIch hatte ja keine Ahnung, dass der Zenithiaschild so wertvoll ist.\n@c0@"
  en: "@aNera@bI had no idea the Zenithian Shield was so valuable.\n@c0@"
  es: "@aNera@bVeramente, nunca pensé que el Escudo de Zenithia fuese tan valioso.\n@c0@"
  fr: "@aNera@bJe ne pensais pas que le Bouclier zénithien était aussi précieux.\n@c0@"
  it: "@aNera@bNon avevo idea che lo Scudo Zenithiano fosse un oggetto tanto ricercato...\n@c0@"
  ja: "@a@bフローラ「天空の盾が　そんな\n\t高価なものだったなんて……。\n@c0@"
350:
  de: "@aNera@bAber ich kann mir gar nicht vorstellen, dass jemand ein Vermögen für etwas ausgeben würde, mit dem er sich nicht mal ausrüsten kann.\n@c0@"
  en: "@aNera@bI can't imagine anyone would want to spend a fortune on an item they can't even equip, though.\n@c0@"
  es: "@aNera@bPero no me puedo imaginar a alguien gastando una fortuna en un oggetto que ni siquiera puede equipar.\n@c0@"
  fr: "@aNera@bQuand même... j'imagine mal quelqu'un se lancer\r\nà l'aventure pour un objet dont il ne pourrait\r\npas s'équiper.\n@c0@"
  it: "@aNera@bPerò c'è una cosa che non capisco...\nPerché la gente è disposta a pagare un occhio della testa per un oggetto che non potrà mai usare?!\n@c0@"
  ja: "@a@bフローラ「でも　装備できないものを\n\t高いお金で買う人なんて\n\tいませんわ…　きっと。\n@c0@"
351:
  de: "@aBianca@bWas für ein Idiot! Seine Arbeit stehen und liegen zu lassen, bloß um ins Kasino zu gehen!\n@c0@"
  en: "@aBianca@bWhat an idiot! Fancy jackin' in his work like that just so he can go to the casino!\n@c0@"
  es: "@aBianca@b¡Qué estúpido! ¡Mira que dejar su trabajo así sin más para irse al casino!\n@c0@"
  fr: "@aBianca@bQuel imbécileⓠ Tu te rends compteⓡ Plaquer son boulot comme ça juste pour pouvoir aller au casinoⓠ\n@c0@"
  it: "@aBianca@bMa tu guarda che tipo!\nDev'essere proprio un idiota per mollare il lavoro in questo modo e andare a giocare al casinò!\n@c0@"
  ja: "@a@bビアンカ「やだっ　あの人！\n\t仕事をほうりだして　カジノへ\n\t遊びにいっちゃったわよ。\n@c0@"
352:
  de: "@aNera@bOh je! Stell dir vor, seinen Laden einfach so zu verlassen! Ich hoffe nur, darin gibt es nichts allzu Wertvolles.\n@c0@"
  en: "@aNera@bOh dear! Fancy leaving his shop like that.\r\nI hope there's nothing too valuable here.\n@c0@"
  es: "@aNera@b¡Mamma mia! Se ha ido de la sua tienda así, sin más.\r\nEspero que no haya niente valioso aquí.\n@c0@"
  fr: "@aNera@bÇa alorsⓠ Tu te rends compte, il abandonne sa boutique comme çaⓡ J'espère qu'il n'y a rien\nde trop précieux, ici.\n@c0@"
  it: "@aNera@bMa che fa?! Lascia il negozio incustodito?!\nE se arrivasse un ladro?\n@c0@"
  ja: "@a@bフローラ「あらまあ　お店をほうって…\n\t大事なものは　おいてないのかしら？\n@c0@"
353:
  de: "@aBianca@bHmm. Man muss aufpassen, wen man heiratet, was? Früh gefreit, schnell gereut, wie es so schön heißt.\n@c0@"
  en: "@aBianca@bHmm. You have to be careful who you marry, eh? Marry in haste and repent at leisure, as they say.\n@c0@"
  es: "@aBianca@bMmm. Hay que tener cuidado con quién se casa uno, ¿eh? No hay nada que pese más que un mal matrimonio, ¿sabes?\n@c0@"
  fr: "@aBianca@bMmm. Il faut faire attention quand on se marie, heinⓡ Deux secondes pour se marier, toute une vie pour regretter, comme on dit.\n@c0@"
  it: "@aBianca@bHa sposato un fannullone che passa la vita al tavolo verde? Se fossi al posto di quella donna, gli farei passare la passione per il gioco a suon di sberle!\n@c0@"
  ja: "@a@bビアンカ「う～ん…　結婚相手は\n\tしんちょうに　えらばないと\n\t苦労するわねえ……。\n@c0@"
354:
  de: "@aNera@bSie sollte ihm sagen, dass sein Verhalten einfach nicht akzeptabel ist. Nur so kann mit einer solchen Situation umgehen.\n@c0@"
  en: "@aNera@bShe should just tell him his behaviour's unacceptable. That's the only way to tackle a situation like that.\n@c0@"
  es: "@aNera@bElla debería decirle que la sua conducta es inaceptable. Es la única forma de enfrentarse a estas situazioni.\n@c0@"
  fr: "@aNera@bElle devrait tout simplement lui dire que son comportement est inacceptable. C'est le seul moyen\r\nde couper court à une situation comme celle-là.\n@c0@"
  it: "@aNera@bQuella signora dovrebbe dire chiaro e tondo al marito che così non possono andare avanti.\nCerte situazioni vanno prese di petto!\n@c0@"
  ja: "@a@bフローラ「ああいうときは　本人に\n\tガツンと　言うのがいいのですわ。\n\t悪いことは　悪いことですもの。\n@c0@"
355:
  de: "@aBianca@bIch nehme an, das kommt daher, dass alle tagsüber zu arbeiten haben. Außer natürlich, sie sind alle im Kasino!\n@c0@"
  en: "@aBianca@bI s'pose that's because everyone's got work to\r\ndo durin' the day. Unless they're all at the casino,\r\nof course!\n@c0@"
  es: "@aBianca@bSupongo que todo el mundo tiene cosas que hacer durante el día. ¡Aunque a lo mejor están en el casino!\n@c0@"
  fr: "@aBianca@bJe suppose que c'est parce que tout le monde a du travail, pendant la journée. Sauf s'ils sont tous au casino, évidemmentⓠ\n@c0@"
  it: "@aBianca@bE ci credo!\nDi giorno la gente lavora, no?!\nOppure va a giocare al casinò...\n@c0@"
  ja: "@a@bビアンカ「そりゃ　みんな　昼間は\n\tはたらいているはずだもんね……。\n\tみんなでカジノだったら　こわいけど。\n@c0@"
356:
  de: "@aNera@bSicher sind tagsüber alle bei der Arbeit und freuen sich auf den Abend, wenn sie hierherkommen und abschalten können.\n@c0@"
  en: "@aNera@bNo doubt everyone's busy at work during the day, looking forward to the evening when they can come and relax here.\n@c0@"
  es: "@aNera@bSin duda tutti están ocupados trabajando durante el día, esperando que llegue la notte para poder venir aquí a relajarse.\n@c0@"
  fr: "@aNera@bEn journée, tout le monde est sûrement occupé à travailler, en attendant impatiemment le soir pour pouvoir venir se détendre ici.\n@c0@"
  it: "@aNera@bBeh, di solito di giorno si lavora... La sera ci si rilassa in qualche locale, anche se, personalmente, preferirei restare a casa con il mio uomo.\n@c0@"
  ja: "@a@bフローラ「昼間は　はたらいて\n\t夜は　ここで　ゆっくりするのが\n\t町のみなさんの楽しみなんでしょうね。\n@c0@"
357:
  de: "@aBianca@bJa, ich glaube, so ganz habe ich es noch nicht verinnerlicht.\n@c0@"
  en: "@aBianca@bYeah, I s'pose it en't really sunk in for me yet.\n@c0@"
  es: "@aBianca@bSí, supongo que aún no lo he asumido del todo.\n@c0@"
  fr: "@aBianca@bOui, j'imagine que je n'ai pas encore ce besoin.\n@c0@"
  it: "@aBianca@bNo, non ho nostalgia di casa.\n@c0@"
  ja: "@a@bビアンカ「そうねえ…　私には\n\tまだあまり　実感がないかな？\n@c0@"
358:
  de: "@aBianca@bAber eins weiß ich: Da, wo du bist, da bin ich zu Hause.\n@c0@"
  en: "@aBianca@bBut I know this much. Wherever you are, that's where my home is.\n@c0@"
  es: "@aBianca@bPero sé una cosa. Mi hogar está donde tú estés, ¿sabes?\n@c0@"
  fr: "@aBianca@bMais je sais une chose, en revanche, c'est que\r\nma maison, c'est là où tu es.\n@c0@"
  it: "@aBianca@bMi sento sempre a casa, se sono accanto a te...\n@c0@"
  ja: "@a@bビアンカ「でも　%a000090のいるところが\n\t私の帰るところだってコトは\n\tわかってるわよ。\n@c0@"
359:
  de: "@aNera@bDas verstehst du sicherlich, Liebling.\n@c0@"
  en: "@aNera@bI'm sure that you understand, darling.\n@c0@"
  es: "@aNera@bSicuro que lo comprendes, caro mio.\n@c0@"
  fr: "@aNera@bJe suis sûre que tu comprends ça, mon chéri.\n@c0@"
  it: "@aNera@bNostalgia di casa? No, non credo di soffrirne. Sono abituata a stare lontana dalla mia famiglia, visto che ho vissuto a lungo all'Abbazia di Su'ncyel.\n@c0@"
  ja: "@a@bフローラ「あなたには\n\tわかりますわよね……。\n@c0@"
360:
  de: "@aBianca@bEr arbeitet bestimmt nachts, wenn er tagsüber so fest schlafen kann.\n@c0@"
  en: "@aBianca@bHe must work nights to be sleepin' so soundly durin' the day like that.\n@c0@"
  es: "@aBianca@bDebe de trabajar por las nochesⓓ si no, no estaría tan dormido por el día, ¿sabes?\n@c0@"
  fr: "@aBianca@bIl doit travailler de nuit pour dormir aussi profondément en journée.\n@c0@"
  it: "@aBianca@bForse quel tipo lavora di notte, visto che di giorno dorme...\n@c0@"
  ja: "@a@bビアンカ「昼間っから\n\tあんなに　ねてるってことは\n\t夜の仕事の人かしら。\n@c0@"
361:
  de: "@aNera@bWir sollten ihn nicht wecken. Lass ihn lieber in Ruhe.\n@c0@"
  en: "@aNera@bWe mustn't wake him up. Let's leave him be.\n@c0@"
  es: "@aNera@bVeramente, no debemos despertarle. Vamos a dejarle en pace.\n@c0@"
  fr: "@aNera@bNous ne devons pas le réveiller.\r\nLaissons-le tranquille.\n@c0@"
  it: "@aNera@bSenti come russa!\nMi pare impossibile che non si svegli da solo, con tutto il rumore che fa!\n@c0@"
  ja: "@a@bフローラ「おこすと　悪いですわ。\n\tもう　行きましょう。\n@c0@"
362:
  de: "@aBianca@bWas für Abenteuer der alte Mann wohl erlebt hat? Wir sollten ihn fragen, wenn sich je die Gelegenheit bietet.\n@c0@"
  en: "@aBianca@bI wonder what kind of adventures that old man had. We should ask him if we ever get the chance.\n@c0@"
  es: "@aBianca@bMe pregunto qué clase de aventuras vivió ese abuelo. Deberíamos preguntárselo si tenemos oportunidad, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe me demande quel genre d'aventures a bien pu vivre ce vieil homme. Nous devrions lui poser la question, à l'occasion.\n@c0@"
  it: "@aBianca@bChissà che avventure ha vissuto quell'uomo...\nSarei proprio curiosa di saperlo!\n@c0@"
  ja: "@a@bビアンカ「あのおじいさんは\n\tどんな冒険をしたのかしら。\n\t機会があったら　聞いてみたいわね。\n@c0@"
363:
  de: "@aNera@bPapa war auch ein Abenteurer, als er noch jünger war. Heute sieht man ihm das nicht mehr an.\n@c0@"
  en: "@aNera@bPapa used to be an adventurer when he was younger too. Not that you'd know it to look\r\nat him now.\n@c0@"
  es: "@aNera@bIl mio papino también era un aventurero de joven. Es difícil imaginarlo si lo ves ahora.\n@c0@"
  fr: "@aNera@bPapa aussi était un aventurier, dans sa jeunesse. Même si on ne le dirait pas en le voyant aujourd'hui.\n@c0@"
  it: "@aNera@bAnche mio padre ha vissuto molte avventure quand'era giovane. È stato molto tempo fa, prima che diventasse un armatore di successo.\n@c0@"
  ja: "@a@bフローラ「私の父も　若い頃は\n\t冒険家だったらしいですわ。\n\t今は　そう見えないでしょうけど……。\n@c0@"
364:
  de: "@aBianca@bIch wette, sie hat von deiner Mutter gesprochen, %a000090! Das würde ja heißen, dass sie noch lebt!\n@c0@"
  en: "@aBianca@bI'll bet she was talkin' about your mum, %a000090! That means she must still be alive!\n@c0@"
  es: "@aBianca@b¡Estoy segura de que estaba hablando de tu madre, %a000090! ¡Eso quiere decir que sigue viva!\n@c0@"
  fr: "@aBianca@bJe parie qu'elle parlait de ta mère, %a000090ⓠ Ça veut dire qu'elle est sûrement encore en vieⓠ\n@c0@"
  it: "@aBianca@b%0%a000090! Forse sta parlando di tua madre! Ha detto che è viva e sta bene! Oh, santa dea! Speriamo che questa tipa non ci stia prendendo in giro...\n@c0@"
  ja: "@a@bビアンカ「親しい女って　きっと\n\t%a000090のお母さんのことよね。\n\t生きてるって！　良かったね。\n@c0@"
365:
  de: "@aBianca@bAll die Ungeheuer dort hinten im Käfig scheinen ja gut erzogen zu sein, was?\n@c0@"
  en: "@aBianca@bAll of the monsters back there in the cage seem to be pretty well-behaved, eh?\n@c0@"
  es: "@aBianca@bTodos esos monstruos de la jaula parecían muy bien educados, ¿verdad?\n@c0@"
  fr: "@aBianca@bTous les monstres enfermés dans la cage là-bas derrière ont l'air bien dressés, nonⓡ\n@c0@"
  it: "@aBianca@bChe carini quei mostri in gabbia...\nSembrano così docili e ubbidienti!\n@c0@"
  ja: "@a@bビアンカ「あの　オリの向こうの\n\t魔物さんたち　みんな\n\tいい子に　してるみたいね。\n@c0@"
366:
  de: "@aNera@bDie Ungeheuer scheinen auf den Alten zu hören.\n@c0@"
  en: "@aNera@bThe monsters here seem to behave just as the old man wants.\n@c0@"
  es: "@aNera@bLos mostri de este lugar se comportan exactamente como quiere el anciano.\n@c0@"
  fr: "@aNera@bIci, les monstres ont l'air de se comporter\r\nexactement comme le vieil homme le veut.\n@c0@"
  it: "@aNera@bI mostri che sono qui dentro sembrano docili e ben educati...\n@c0@"
  ja: "@a@bフローラ「ここにいる　魔物さんたち\n\tみんな　おじいさんの言うことを\n\tよく　聞いているのね。\n@c0@"
367:
  de: "@aBianca@bSie sieht hier unten etwas fehl am Platz aus. Vielleicht hat der alte Mann sie gern hier, damit sie etwas Leben in die Bude bringt.\n@c0@"
  en: "@aBianca@bShe looks a bit out of place down here. Maybe the old man likes havin' her here to keep him lively.\n@c0@"
  es: "@aBianca@bParece un poco fuera de lugar aquí abajo. Quizá al abuelete le gusta tenerla aquí para animarse, ¿sabes?\n@c0@"
  fr: "@aBianca@bElle n'a pas l'air vraiment à sa place, ici. Peut-être que le vieil homme aime bien l'avoir à ses côtés pour mettre un peu de vie.\n@c0@"
  it: "@aBianca@bSbaglierò, ma la fanciulla ha un debole per il suo anziano principale.\nChissà se riuscirà ad ⓕaddomesticarloⓖ... Ah ah ah!\n@c0@"
  ja: "@a@bビアンカ「なんだか　こんなところには\n\t不似合いな　かっこうね。\n\tおじいさんのシュミかしら？\n@c0@"
368:
  de: "@aNera@bEin Häschenmädel an einem solchen Ort hat so was herrlich Extravagantes!\n@c0@"
  en: "@aNera@bHaving a bunny girl down here gives the place a nice, flamboyant air.\n@c0@"
  es: "@aNera@bUna conejita, veramente le da un aire vistoso y extravagante a este lugar.\n@c0@"
  fr: "@aNera@bAvoir une assistante déguisée en serveuse ici\r\ndonne à cet endroit un côté très... flamboyant.\n@c0@"
  it: "@aNera@bUna bella ragazza come lei è proprio quello che ci vuole per rendere l'ambiente più vivace e allegro, non credi?\n@c0@"
  ja: "@a@bフローラ「こんなところに　バニーさんとは\n\tはなやかで　いいですわね。\n@c0@"
369:
  de: "@aBianca@bStell dir nur vor, ein unterirdisches Gefängnis in der Stadt! Na ja, ich vermute, bei so vielen Leuten an einem Ort muss man wohl mit Kriminalität rechnen.\n@c0@"
  en: "@aBianca@bFancy havin' an underground jail in town! I s'pose there's bound to be crime when you collect so many folk together in one spot, though.\n@c0@"
  es: "@aBianca@b¡Qué curioso, una cárcel subterránea en la ciudad! Supongo que es normal que haya mangantes cuando juntas a mucha gente en un mismo sitio, ¿sabes?\n@c0@"
  fr: "@aBianca@bUne prison souterraine en ville, tu te rends compteⓡ Enfin, je suppose que la délinquance est inévitable quand on rassemble tant de gens en un seul endroit.\n@c0@"
  it: "@aBianca@bNon c'è da stupirsi che a Fortuna ci sia anche una prigione: la città è talmente ricca che non può non attirare i delinquenti!\n@c0@"
  ja: "@a@bビアンカ「町に　地下牢があるなんて…\n\tこれだけ　大きな町だと\n\t犯罪も　多いのかも知れないわね。\n@c0@"
370:
  de: "@aNera@bIn Gefängnissen fühlt es sich immer so kalt an.\n@c0@"
  en: "@aNera@bJails always seem to feel so cold.\n@c0@"
  es: "@aNera@bLas cárceles sempre parecen sitios muy fríos.\n@c0@"
  fr: "@aNera@bLes prisons semblent toujours glaciales.\n@c0@"
  it: "@aNera@bSe finissi in galera, non credo sopravviverei... Morirei dalla vergogna! E se così non fosse, ci penserebbe mio padre ad ammazzarmi!\n@c0@"
  ja: "@a@bフローラ「牢屋って　なんだか\n\t寒気がしてきますわ。\n@c0@"
371:
  de: "@aBianca@bHe! Vielleicht ist das ja der, der Harry entführt hat!\n@c0@"
  en: "@aBianca@bHey! Maybe he's the one who kidnapped Harry!\n@c0@"
  es: "@aBianca@b¡Eh! ¡A lo mejor es el tipo que secuestró a Froilán!\n@c0@"
  fr: "@aBianca@bHéⓠ Peut-être que c'est lui qui a enlevé Harryⓠ\n@c0@"
  it: "@aBianca@bE se fosse stato lui a rapire Robert, tanti anni fa?\n@c0@"
  ja: "@a@bビアンカ「じゃあ　もしかして\n\tヘンリー王子を　さらったのは\n\tあいつ！？\n@c0@"
372:
  de: "@aBianca@bHätte er das bloß nicht getan, dann wäre Ludwig womöglich heute noch am Leben.\n@c0@"
  en: "@aBianca@bIf only he hadn't done it, then maybe Pankraz would still be alive today.\n@c0@"
  es: "@aBianca@bSi no lo hubiese hecho, puede que Teudis siguiese vivo, ¿sabes?\n@c0@"
  fr: "@aBianca@bEt s'il ne l'avait pas fait, Petros serait sans doute encore en vie aujourd'hui.\n@c0@"
  it: "@aBianca@bGrrr! Il pensiero che potrebbe essere uno dei responsabili per la morte di tuo padre mi fa ribollire il sangue nelle vene!\n@c0@"
  ja: "@a@bビアンカ「あいつらが　あんな仕事を\n\t引きうけなければ　パパスさんは\n\t死なずにすんだかも知れないのに……。\n@c0@"
373:
  de: "@aNera@bWas für ein schrecklicher Mann, jemanden aus reiner Gier zu entführen! Er sollte für das büßen, was er getan hat!\n@c0@"
  en: "@aNera@bWhat a terrible man, kidnapping someone out of greed like that! He should pay for what he did!\n@c0@"
  es: "@aNera@b¡Qué uomo más malvado, secuestrar a alguien por pura codicia! ¡Debe pagar por lo que hizo!\n@c0@"
  fr: "@aNera@bQuel horrible personnage. Enlever quelqu'un comme ça, par simple cupiditéⓠ Il devrait être puni pour ce qu'il a faitⓠ\n@c0@"
  it: "@aNera@bChe cosa?! Quell'uomo era un rapitore di bambini?!\nQualcuno dovrebbe fargliela pagare per i suoi orrendi crimini!\n@c0@"
  ja: "@a@bフローラ「人をさらって　売りとばすとは\n\tなんという人でしょう！\n\t今に　もっとひどい罰がくだりますわ！\n@c0@"
374:
  de: "@aBianca@bDu bist ja anscheinend ganz wild auf ein kleines Spielchen im Kasino, was? Na warte, wenn ich das Nera erzähle!\n@c0@"
  en: "@aBianca@bLooks like you're intent on a bit of a flutter at the casino, eh? I'll tell Nera about you!\n@c0@"
  es: "@aBianca@bAsí que tienes ganas de darte una vuelta por el casino, ¿eh? ¡Me pienso chivar a Nera!\n@c0@"
  fr: "@aBianca@bOn dirait que tu as l'intention d'aller parier un peu\nau casino, heinⓡ Je dirai tout à Neraⓠ\n@c0@"
  it: "@aBianca@bTe la stai spassando al casinò, eh?!\nChissà cosa direbbe Nera se venisse a saperlo...\n@c0@"
  ja: "@a@bビアンカ「%a000090ったら\n\t本気で　カジノで遊ぶつもりなのね。\n\tフローラさんに　言いつけちゃうわよ。\n@c0@"
375:
  de: "@aBianca@bMan weiß kaum, womit man anfangen soll, bei einer solchen Auswahl an Spielen, was?\n@c0@"
  en: "@aBianca@bIt's hard to know where to start when there's so many different games to choose from, eh?\n@c0@"
  es: "@aBianca@bEs difícil decidir por dónde empezar con tantos juegos entre los que elegir, ¿verdad?\n@c0@"
  fr: "@aBianca@bDifficile de savoir par quoi commencer quand il y a autant de jeux différents, nonⓡ\n@c0@"
  it: "@aBianca@bAccidenti, quanti giochi!\nC'è solo l'imbarazzo della scelta!\n@c0@"
  ja: "@a@bビアンカ「これだけ　たくさんあると\n\tなにから遊べばいいか　迷うわね。\n@c0@"
376:
  de: "@aNera@bVergiss nicht, dass ein Kasino nur dazu da ist, ein bisschen Dampf abzulassen. Du darfst dich nicht zu sehr hinreißen lassen.\n@c0@"
  en: "@aNera@bDon't forget that a casino is just a place to let off a little steam. You mustn't get too carried away.\n@c0@"
  es: "@aNera@bNo te olvides de que un casino es solo un sitio para relajarse un po'. No debes dejarte llevar.\n@c0@"
  fr: "@aNera@bN'oublie pas qu'un casino est seulement un endroit\r\noù évacuer un peu la pression. Tu ne dois pas te laisser emporter.\n@c0@"
  it: "@aNera@bNon dimenticare che il casinò è solo un posto per rilassarsi e divertirsi! Cerca di non farti prendere la mano dal gioco, tesoro...\n@c0@"
  ja: "@a@bフローラ「あなた　カジノは\n\tあくまでも　息ぬきですからね。\n\tあまり　熱中しすぎないでくださいね。\n@c0@"
377:
  de: "@aBianca@bEs ist schade, dass man nicht reich wird, wenn man im Kasino gewinnt, aber so ist es eben.\n@c0@"
  en: "@aBianca@bIt's a shame you dun't get rich when you win at the casino, but I s'pose that's just the way of it.\n@c0@"
  es: "@aBianca@bEs una lástima que cuando ganes en el casino no te hagas rico, pero, en fin, así son las cosas, ¿sabes?\n@c0@"
  fr: "@aBianca@bDommage qu'on ne puisse pas devenir riche en gagnant au casino, mais j'imagine que c'est la règle du jeu.\n@c0@"
  it: "@aBianca@bPeccato che non sia permesso cambiare i gettoni in monete... Beh, almeno così non si ha la tentazione di sfidare la sorte al gioco per diventare ricchi.\n@c0@"
  ja: "@a@bビアンカ「カジノで勝っても\n\tお金が増えるってわけじゃないのね。\n\tざんねんだわ。\n@c0@"
378:
  de: "@aNera@bManche Leute werden trotzdem süchtig danach. Stell dir nur vor, wie es erst wäre, wenn man hier tatsächlich Geld gewinnen könnte!\n@c0@"
  en: "@aNera@bSome people get hooked despite that. Imagine what it would be like if you could actually win money here!\n@c0@"
  es: "@aNera@bHay personas que se enganchan igualmente. ¡Imagínate cómo sería si además pudieses ganare dinero aquí!\n@c0@"
  fr: "@aNera@bMalgré ces règles, certaines personnes ne savent plus s'arrêter. Tu imagines un peu si c'était effectivement possible de gagner de l'argent iciⓠ\n@c0@"
  it: "@aNera@bL'impossibilità di cambiare i gettoni in denaro non impedisce a molte persone di contrarre il vizio del gioco... Mi spiace moltissimo per loro...\n@c0@"
  ja: "@a@bフローラ「今でさえ　熱中しすぎる人が\n\tいるのに…　お金にかえられたら\n\tもう　大変なことになりそうですわ。\n@c0@"
379:
  de: "@aNera@bDer Mann hatte ganz blutunterlaufene Augen. Die waren richtig zum Fürchten!\n@c0@"
  en: "@aNera@bThat man's eyes were all bloodshot and creepy.\n@c0@"
  es: "@aNera@bLos ojos de ese uomo eran repulsivos, estaban inyectados en sangre.\n@c0@"
  fr: "@aNera@bLes yeux de cet homme étaient injectés de sang, c'était effrayant...\n@c0@"
  it: "@aNera@bMa hai visto lo sguardo di quell'uomo?!\nSembrava in trance!\n@c0@"
  ja: "@a@bフローラ「さっきの方…\n\t目が血走っていて　こわかったですわ。\n@c0@"
380:
  de: "@aBianca@bStell dir vor, deine ganzen Einkünfte hier zu verspielen, was?\n@c0@"
  en: "@aBianca@bFancy blowin' all your takin's here, eh?\n@c0@"
  es: "@aBianca@b¡Imagínate, dejarse aquí todas las ganancias!\n@c0@"
  fr: "@aBianca@bTu imagines un peu, flamber tout ce que l'on a dans cet endroitⓡ\n@c0@"
  it: "@aBianca@bPoverino! Ha perso l'incasso della settimana!\nBen gli sta!\nUn'altra volta impara a giocare d'azzardo...\n@c0@"
  ja: "@a@bビアンカ「１日のかせぎを\n\tこんなところで　だいなしにするなんて\n\tあきれて　ものも言えないわ。\n@c0@"
381:
  de: "@aNera@bOh je. Er sollte sich beim Spielen etwas mehr zurückhalten.\n@c0@"
  en: "@aNera@bOh dear. He should really be a little more restrained in how he plays.\n@c0@"
  es: "@aNera@b¡Oh, cielos! Debería contenerse un poco al giocare.\n@c0@"
  fr: "@aNera@bOh là là, il devrait faire preuve d'un peu plus de prudence dans sa façon de jouer.\n@c0@"
  it: "@aNera@bPer certa gente il gioco non è un divertimento, ma un vizio dal quale è difficilissimo liberarsi.\n@c0@"
  ja: "@a@bフローラ「あの方　これに　こりて\n\tもう少し　遊び方を考えてくださると\n\tいいのですけど……。\n@c0@"
382:
  de: "@aBianca@bJa, nicht schlecht. Ich hätte nichts dagegen, mal ein solches Kostüm zu tragen und mich auch mal auf der Bühne zu versuchen.\n@c0@"
  en: "@aBianca@bYeah, it's not a bad show. I wouldn't mind wearin'\r\na dress like that and tryin' my hand at a bit of the old theatricals.\n@c0@"
  es: "@aBianca@bSí, el espectáculo no está mal. A mí no me importaría llevar un vestido así y probar a ver qué tal se me daba lo del artisteo, ¿sabes?\n@c0@"
  fr: "@aBianca@bOui, le spectacle n'est pas mauvais. Je crois que ça me plairait assez de porter une robe comme ça et de m'essayer un peu au théâtre.\n@c0@"
  it: "@aBianca@bSì, lo spettacolo è davvero bello.\nE anche quei costumi lo sono! Mi piacerebbe provarmene uno... Chissà se hanno la mia taglia...\n@c0@"
  ja: "@a@bビアンカ「そうね。　本当にステキだわ。\n\t私も　あんなドレスを着て\n\tお芝居とか　してみようかしら。\n@c0@"
383:
  de: "@aNera@bJa, das ist wirklich eine großartige Vorstellung. Ich weiß gar nicht, warum sie nicht mehr Publikum haben.\n@c0@"
  en: "@aNera@bYes, it really is a beautiful performance.\r\nI can't understand why there aren't more\r\npeople in the audience.\n@c0@"
  es: "@aNera@bSi, es un espectáculo molto bello.\r\nNon capisco per qué no hay más público.\n@c0@"
  fr: "@aNera@bOui, c'est vraiment une belle représentation.\r\nJe ne comprends pas pourquoi il n'y a pas\r\nplus de spectateurs.\n@c0@"
  it: "@aNera@bNiente da dire, lo spettacolo è molto divertente.\nNon capisco come mai il pubblico non sia più numeroso...\n@c0@"
  ja: "@a@bフローラ「まあ　本当にステキなお芝居！\n\tなのに　どうして　見ている人が\n\t少ないのかしら？\n@c0@"
384:
  de: "@aBianca@bTja, wenn man eine Glückssträhne hat, muss man dranbleiben, wie?\n@c0@"
  en: "@aBianca@bI guess you have to roll with it when your luck's good, eh?\n@c0@"
  es: "@aBianca@bSupongo que tienes que aprovechar las rachas de buena suerte, ¿eh?\n@c0@"
  fr: "@aBianca@bJ'imagine que quand on a la chance de son côté,\nil faut en profiter, nonⓡ\n@c0@"
  it: "@aBianca@bPotrebbe avere ragione, no?\nVale la pena insistere, quando le cose vanno bene!\n@c0@"
  ja: "@a@bビアンカ「ツキが　こっちに　あるときは\n\tやっぱり　ガンガンいかないとね。\n@c0@"
385:
  de: "@aNera@bAber man muss aufpassen. Wenn man sich zu sehr mitreißen lässt, kann das Glück schnell zu Ende sein.\n@c0@"
  en: "@aNera@bYou have to be careful, though. If you get too carried away, you could easily fall on bad luck.\n@c0@"
  es: "@aNera@bPero debes tener molto cuidado. Si te dejas llevar, es muy fácil que caigas en una mala racha.\n@c0@"
  fr: "@aNera@bIl faut quand même faire attention. Si on se laisse trop emporter, la chance peut facilement tourner.\n@c0@"
  it: "@aNera@bÈ vero: bisogna battere il ferro finché è caldo.\nIl problema è che può raffreddarsi all'improvviso, e quando te ne accorgi hai già perso tutto!\n@c0@"
  ja: "@a@bフローラ「でも　強気で調子にのると\n\t痛い目を　見たりしますわ。\n\tムリなさらないでくださいね。\n@c0@"
386:
  de: "@aBianca@bWenn die Dinge für mich nicht gut laufen, höre ich lieber damit auf. Nicht nur im Kasino.\n@c0@"
  en: "@aBianca@bWhen things en't goin' well for me, I tend to give up on them. Not just in the casino neither.\n@c0@"
  es: "@aBianca@bCuando las cosas me van mal, suelo dejarlo correr. Y no solo en el casino, ¿sabes?\n@c0@"
  fr: "@aBianca@bQuand les choses ne vont pas bien pour moi, j'ai tendance à laisser tomber. Et ce n'est pas le cas seulement pour le casino.\n@c0@"
  it: "@aBianca@bQuando le cose non girano per il verso giusto, lascio perdere e mi dedico ad altro. È inutile insistere quando la malasorte ti ha preso di mira...\n@c0@"
  ja: "@a@bビアンカ「私だったら　ツイてないな\n\tと思ったときは　やめちゃうな。\n\tカジノだけでなく　すべてにおいてね。\n@c0@"
387:
  de: "@aNera@bIch bin nicht sicher, ob das eine gute Idee ist. Wenn man es immer weiter versucht, selbst wenn man am Verlieren ist, kann das nur böse enden.\n@c0@"
  en: "@aNera@bI'm not sure that's a good idea. If you just keep on trying even when you're losing, you could end up in\r\na very sorry state.\n@c0@"
  es: "@aNera@bNon credo que sea una buona idea. Si te empeñas en seguir cuando pierdes, puedes acabar muy mal.\n@c0@"
  fr: "@aNera@bJe ne suis pas sûre que ce soit une bonne idée.\r\nSi on s'acharne même quand on est en train de perdre, on risque de finir dans de sales draps.\n@c0@"
  it: "@aNera@bCerto, la fortuna prima o poi sorride a tutti.\nIl problema è che potrebbe farlo quando ormai in tasca non hai più nemmeno il becco d'un quattrino!\n@c0@"
  ja: "@a@bフローラ「ツキが　めぐってくるまで\n\tガマンしてガマンしてガマンしまくって\n\t大負けすることもありますわ……。\n@c0@"
388:
  de: "@aBianca@bMan kann nie wissen, wann einem das letzte Stündlein schlägt. Ich lasse lieber nichts in meinem Leben unerledigt.\n@c0@"
  en: "@aBianca@bYou never know when your time might be up, so I dun't want to leave anythin' in my life undone.\n@c0@"
  es: "@aBianca@bNunca se sabe cuándo te puede llegar la hora, así que no quiero arrepentirme de no haber hecho algo en la vida, ¿sabes?\n@c0@"
  fr: "@aBianca@bOn ne sait jamais quand son heure viendra, alors j'aime autant ne rien laisser d'inachevé dans ma vie.\n@c0@"
  it: "@aBianca@bSai una cosa? Quel tipo non ha tutti i torti!\nLa vita è fatta anche per divertirsi: non si sa mai quando la nostra amata dea ci chiamerà a sé...\n@c0@"
  ja: "@a@bビアンカ「いつ死ぬか　わからないから\n\t私は　投げやりな生き方を\n\tしたくないのよね。\n@c0@"
389:
  de: "@aNera@bIn letzter Zeit reden alle davon, wie die Dunkelheit sich in der Welt breitmacht. Vielleicht ist es jetzt doch so weit.\n@c0@"
  en: "@aNera@bEveryone seems to be talking about how the world's being overtaken with darkness of late. Maybe the time's finally upon us.\n@c0@"
  es: "@aNera@bParece que tutti hablan de que el mundo está siendo invadido por la oscuridad últimamente. Quizá haya llegado nuestra hora.\n@c0@"
  fr: "@aNera@bTous les gens disent que le monde va finir englouti par les ténèbres, en ce moment. Peut-être que notre heure est effectivement venue.\n@c0@"
  it: "@aNera@bQuell'uomo è troppo pessimista...\nLa dea non permetterà mai che il mondo da lei creato venga avvolto dalle tenebre! \n@c0@"
  ja: "@a@bフローラ「最近　世界を闇が……\n\tという話を　よく耳にしますわ。\n\tいよいよなのかも知れませんわね。\n@c0@"
390:
  de: "@aBianca@bTypisch alter Mann, was? Glaubt, er weiß alles übers Leben, bloß weil seins schon so lange dauert!\n@c0@"
  en: "@aBianca@bTypical old bloke, eh? Thinks he knows all there is to know about life just because his has bin a long one!\n@c0@"
  es: "@aBianca@b¡Bah, es uno de esos viejales! ¡Cree que lo sabe todo de la vida solo porque ha estado mucho tiempo vivo!\n@c0@"
  fr: "@aBianca@bC'est typique ça, nonⓡ Il croit tout savoir de la vie juste parce que la sienne a été longueⓠ\n@c0@"
  it: "@aBianca@bMa senti tu che razza di ragionamento!\n@c0@"
  ja: "@a@bビアンカ「さすが　おじいさんね。\n\t長生きしてるだけあって\n\tまさに　人生の達人って感じだわ。\n@c0@"
391:
  de: "@aNera@bWie schade, wenn das das Einzige ist, was ihm Freude bereitet. Mir macht alles Spaß, wenn ich bei dir bin, %a000090.\n@c0@"
  en: "@aNera@bWhat a shame if that's the only way he can\nfind enjoyment. I enjoy everything when I'm\nwith you, %a000090.\n@c0@"
  es: "@aNera@bQué lástima, disfrutar de la vita sólo de esa forma. Yo disfruto de tutto cuando estoy contigo, %a000090.\n@c0@"
  fr: "@aNera@bC'est bien dommage qu'il n'ait trouvé que ça pour se divertir. Moi, je profite de tout quand je suis avec toi, %a000090.\n@c0@"
  it: "@aNera@bNon penso che la cosa più importante sia essere vivi, ma trascorrere la propria vita accanto alla persona amata. Spero che la pensi come me, %a000090.\n@c0@"
  ja: "@a@bフローラ「それだけが　楽しみなんて…\n\t私は　%a000090さんと旅してから\n\t楽しいことだらけですわ。\n@c0@"
392:
  de: "@aBianca@bWenn sich der legendäre Held nicht bald mal zeigt, sitzen wir in der Klemme. Davon hängt schließlich nicht zuletzt das Leben deiner Mutter ab.\n@c0@"
  en: "@aBianca@bIf the legendary hero dun't show up sometime, we'll all be in trouble. Your mum's life depends on it, for one thing.\n@c0@"
  es: "@aBianca@bSi el héroe legendario no aparece prontito, va a ser un problema. Por ejemplo, la vida de tu madre depende de ello, ¿sabes?\n@c0@"
  fr: "@aBianca@bSi le héros légendaire ne se montre pas à un moment ou à un autre, nous aurons tous des ennuis. Et la vie de ta mère en dépend, qui plus est.\n@c0@"
  it: "@aBianca@bSpero che l'Eroe Leggendario arrivi presto tra noi.\nLe sorti del mondo e la vita di tua madre dipendono anche da lui...\n@c0@"
  ja: "@a@bビアンカ「伝説の勇者には　何としても\n\t出現してもらわないと　困るわね。\n\tお母さんの命が　かかってるわけだし。\n@c0@"
393:
  de: "@aNera@bGlaubst du, der legendäre Held wird auf einmal aus dem Nichts auftauchen?\n@c0@"
  en: "@aNera@bDo you think the legendary hero will just suddenly pop up out of nowhere?\n@c0@"
  es: "@aNera@b¿Crees que el héroe legendario aparecerá así all'improvviso?\n@c0@"
  fr: "@aNera@bTu crois que le héros légendaire va juste apparaître comme ça, d'un seul coupⓡ\n@c0@"
  it: "@aNera@bCredi che l'Eroe Leggendario spunterà fuori da un momento all'altro, come un fungo dopo un temporale?\n@c0@"
  ja: "@a@bフローラ「勇者さまって\n\t何もないところから　とつぜん\n\t現われるような　存在なのかしら？\n@c0@"
394:
  de: "@aNera@bOder glaubst du, er wird in eine ganz normale Familie hineingeboren und eines Tages wird ihm sein Schicksal plötzlich bewusst?\n@c0@"
  en: "@aNera@bOr do you think he'll be born as someone's child and then realise his destiny one day?\n@c0@"
  es: "@aNera@b¿O crees que será el hijo de alguien y nacerá y un día se dará cuenta de cuál es il suo destino?\n@c0@"
  fr: "@aNera@bOu bien est-ce qu'il est l'enfant de quelqu'un et\nqu'il va un jour réaliser quelle est sa destinéeⓡ\n@c0@"
  it: "@aNera@bO forse è già tra noi e aspetta solo il momento più opportuno per entrare in scena?\n@c0@"
  ja: "@a@bフローラ「そうでないとしたら\n\t人間の子として　ふつうに生まれ\n\tある日　目覚めるとか…　う～ん……。\n@c0@"
395:
  de: "@aBianca@bMeinst du, man klettert einfach auf die Bühne und legt los?\n@c0@"
  en: "@aBianca@bD'you think you're s'posed to just get up on stage like that and start warblin' away?\n@c0@"
  es: "@aBianca@b¿Tú crees que basta con subirse al escenario y ponerse a largar como si nada?\n@c0@"
  fr: "@aBianca@bTu crois qu'il est censé grimper sur scène et commencer à débiter son texte comme çaⓡ\n@c0@"
  it: "@aBianca@bHo letto il libro a cui è ispirato questo spettacolo, e mi sembra che i dialoghi fossero molto più drammatici nel testo originale!\n@c0@"
  ja: "@a@bビアンカ「勝手に　舞台に\n\tあがっちゃって　いいのかしら……。\n@c0@"
396:
  de: "@aNera@bBei dem Lärm kann man ja kein Wort verstehen.\n@c0@"
  en: "@aNera@bIt's impossible to hear what's being said with all that noise going on.\n@c0@"
  es: "@aNera@bEs impossibile oír niente de lo que se dice con tanto ruido.\n@c0@"
  fr: "@aNera@bImpossible de comprendre quoi que ce soit au texte, avec tout le bruit qu'il y a autour.\n@c0@"
  it: "@aNera@bⓕL'omicidio passionale non è stato ancora depenalizzatoⓖ?!\nMa chi ha scritto questo testo?!\n@c0@"
  ja: "@a@bフローラ「まわりが　うるさくて\n\t近づかないと　役者さんのセリフが\n\t聞こえないというのは　問題ですわ。\n@c0@"
397:
  de: "@aBianca@bSie sieht so hübsch aus. Vielleicht sollte ich auch mal versuchen, so ein Kleid zu tragen.\n@c0@"
  en: "@aBianca@bShe looks so pretty. Maybe I should try wearin' a dress like that sometime.\n@c0@"
  es: "@aBianca@b¡Qué guapa está! A lo mejor me pongo yo un vestido como ese algún día, ¿me entiendes?\n@c0@"
  fr: "@aBianca@bElle est si mignonne. Je devrais peut-être essayer\r\nde porter une robe comme ça, un jour.\n@c0@"
  it: "@aBianca@bNo, no. Ne sono assolutamente certa.\nI dialoghi originali erano molto più drammatici!\n@c0@"
  ja: "@a@bビアンカ「ステキ…　私も　たまには\n\tあんなドレス　着てみようかしら。\n@c0@"
398:
  de: "@aNera@bFrauen können immer eine Vorstellung hinlegen, die ihr Publikum in den Bann zieht.\n@c0@"
  en: "@aNera@bWomen can always put on a performance that will captivate their audience.\n@c0@"
  es: "@aNera@bUna donna siempre puede cautivar al público con la sua actuación.\n@c0@"
  fr: "@aNera@bLes femmes sont toujours en mesure de faire un spectacle capable de captiver leur public.\n@c0@"
  it: "@aNera@bⓕSotto il letto, e persino nel cassettoⓖ?! Le nuove generazioni di attori hanno una maniera fin troppo personale di interpretare i grandi classici, eh?!\n@c0@"
  ja: "@a@bフローラ「女の子なら　誰もが\n\tあこがれるような　内容の\n\tお芝居なのですわね。\n@c0@"
399:
  de: "@aBianca@bGenau! Es gibt kein größeres Glück, als wenn zwei Leute, die einander lieben, zusammenkommen, wie?\n@c0@"
  en: "@aBianca@bExactly! There's no better happiness than two people who love each other comin' together, eh?\n@c0@"
  es: "@aBianca@b¡Exacto! La felicidad plena es el encuentro de dos personas que se quieren, ¿a que sí?\n@c0@"
  fr: "@aBianca@bC'est exactement çaⓠ Il n'y a pas de plus grand bonheur que de voir ensemble deux personnes\nqui s'aiment, n'est-ce pasⓡ\n@c0@"
  it: "@aBianca@bPane e cipolla in una baracca, eh?\nQuale donna potrebbe mai resistere a una proposta tanto allettante?!\n@c0@"
  ja: "@a@bビアンカ「そうよ！　愛し合うふたりが\n\tいっしょになるのが　いちばんの\n\t幸せなのよ。　ねっ　%a000090。\n@c0@"
400:
  de: "@aNera@bDas hätte fast ein Lied über uns sein können!\nFindest du nicht?\n@c0@"
  en: "@aNera@bThat could almost have been a song about us!\r\n...Don't you think?\n@c0@"
  es: "@aNera@b¡Esa canzonetta podría estar hablando de nosotros! ¿No te parece?\n@c0@"
  fr: "@aNera@bÇa pourrait presque être une chanson sur nousⓠ\n... Tu ne crois pasⓡ\n@c0@"
  it: "@aNera@bAh, sono assolutamente d'accordo!\nDue cuori che si amano possono essere felici anche in una capanna!\n@c0@"
  ja: "@a@bフローラ「まるで　私と%a000090さんの\n\tことのようでしたわね。\n\t……えっ？　ちがいました？？\n@c0@"
401:
  de: "@aBianca@bWenn man etwas nicht öffnen soll, will man es umso mehr, oder? Wir könnten vielleicht einen klitzekleinen Blick hineinwerfen, wenn sie nicht hinguckt...\n@c0@"
  en: "@aBianca@bBein' told not to open it makes you want to open it\r\nall the more, eh? We could try and have a peek while she en't lookin'...\n@c0@"
  es: "@aBianca@bCuando te dicen que no abras algo aún te apetece más abrirlo, ¿verdad? Podríamos intentar echar un vistacillo mientras ella no mira...\n@c0@"
  fr: "@aBianca@bS'entendre dire qu'il ne faut pas regarder donne\nencore plus envie de le faire, nonⓡ\n㈡\nOn pourrait essayer de jeter un œil pendant\nqu'elle a le dos tourné...\n@c0@"
  it: "@aBianca@bOra sì che sono curiosa!\nChe ne diresti di dare un'occhiata in giro mentre lei non guarda, eh?\n@c0@"
  ja: "@a@bビアンカ「開けるなと言われると\n\t開けたくなっちゃうのよね……。\n\t%a000090　こっそり　開けちゃおうか。\n@c0@"
402:
  de: "@aNera@bEs ist fast, als wollte sie uns damit aufstacheln, ihn aufzumachen! Vielleicht ist es eine Falle.\n@c0@"
  en: "@aNera@bIt's almost like she's saying that to try and get us to open it! Maybe it's some kind of trap.\n@c0@"
  es: "@aNera@b¡Veramente, basta que lo diga para hacer que los abramos! Quizá sea un truco.\n@c0@"
  fr: "@aNera@bÇa revient presque à nous dire d'y jeter un œil. C'est peut-être un piège...\n@c0@"
  it: "@aNera@bDire a qualcuno di non ficcanasare in un posto equivale a suggerirgli di farlo! Quella ragazza non capisce niente di psicologia inversa!\n@c0@"
  ja: "@a@bフローラ「まるで　タンスを開けろと\n\t言わんばかりの　クチぶりですわ。\n\tもしかしたら　なにかのワナかしら。\n@c0@"
403:
  de: "@aBianca@bIch kann mir nicht vorstellen, dass sie nach Lage der Dinge jetzt viel herumreisen können. Wahrscheinlich sitzen sie hier eine Weile fest.\n@c0@"
  en: "@aBianca@bI doubt they can do much travellin' with how things are at the moment. I s'pose that means they're probably stuck here a while.\n@c0@"
  es: "@aBianca@bNo creo que puedan viajar demasiado, tal y como anda la cosa. Supongo que eso significa que tendrán que quedarse aquí una temporadita, ¿sabes?\n@c0@"
  fr: "@aBianca@bÇa m'étonnerait qu'ils puissent beaucoup se déplacer avec ce qui se passe en ce moment. Ça veut sûrement dire qu'ils sont coincés là pour un bon bout de temps.\n@c0@"
  it: "@aBianca@bSuggerirei alla compagnia di diventare ⓕstabileⓖ almeno per un po', visto quant'è pericoloso viaggiare in questo periodo...\n@c0@"
  ja: "@a@bビアンカ「旅まわりと　言っても\n\t今じゃそんなに　まわれないだろうし…\n\tしばらく　この町にいるんじゃない？\n@c0@"
404:
  de: "@aNera@bOh ja, ich kann mich nicht daran erinnern, sie hier gesehen zu haben, als ich damals mit Papa und Griselda hier war.\n@c0@"
  en: "@aNera@bOh yes. I don't remember seeing them here when I visited with Papa and Debora years ago.\n@c0@"
  es: "@aNera@b¡Ah!, sí. No recuerdo haberlo visto por aquí cuando vine con il mio papino y Stefania hace años.\n@c0@"
  fr: "@aNera@bC'est vrai. Je ne me souviens pas les avoir vus quand je suis venue ici avec papa et Pandora\r\nil y a quelques années.\n@c0@"
  it: "@aNera@bChissà quali spettacoli hanno nel loro repertorio quegli attori... Mi piacerebbe vederli recitare un bel drammone romantico, di quelli strappalacrime...\n@c0@"
  ja: "@a@bフローラ「そういえば　ずっと前に\n\t父や姉さんと　ここへ　来たときには\n\tあの劇団は　いませんでしたわ。\n@c0@"
405:
  de: "@aBianca@bPah! Sie ist doch schon angezogen! Ihr fehlt bloß noch die Schminke!\n@c0@"
  en: "@aBianca@bHuh! It's not like she's still changing. She's only got her make-up left to do.\n@c0@"
  es: "@aBianca@b¡Mmm! En realidad no se está cambiando. Solo le falta ponerse el maquillaje, ¿sabes?\n@c0@"
  fr: "@aBianca@bPeuhⓠ Elle exagère, elle a fini de se changer.\nIl ne lui reste plus que son maquillage à faire.\n@c0@"
  it: "@aBianca@bMa non si stava cambiando d'abito!\nSi stava solo rifacendo il trucco!\n@c0@"
  ja: "@a@bビアンカ「着替え中　と言っても\n\tあとは　お化粧だけじゃないの。\n@c0@"
406:
  de: "@aBianca@bSie will uns wahrscheinlich nur loswerden. Na, tun wir ihr den Gefallen und gehen.\n@c0@"
  en: "@aBianca@bI reckon she's just tryin' to get rid of us. Well, you don't need to tell me twice. Let's get goin'.\n@c0@"
  es: "@aBianca@bCreo que en realidad quiere librarse de nosotros. Bueno, no tiene que decírnoslo dos veces... ¡Vámonos!\n@c0@"
  fr: "@aBianca@bJe crois qu'elle essaie juste de se débarrasser de nous. Eh bien, ce sera avec plaisir. Viens, on s'en va.\n@c0@"
  it: "@aBianca@bHai visto come ci va giù pesante?!\nIo impiegherei tre anni per consumare i cosmetici che lei usa in un giorno!\n@c0@"
  ja: "@a@bビアンカ「%a000090ったら　どうしたの？\n\tもしかして　なにか　期待してた？\n@c0@"
407:
  de: "@aNera@bWir sollten sie in Frieden lassen. Wir wollen doch nicht aufdringlich erscheinen!\n@c0@"
  en: "@aNera@bWe should leave her in peace. We wouldn't want her to think we're peeping toms.\n@c0@"
  es: "@aNera@bDeberíamos dejarla en pace. Veramente, no quiero que piense que somos una especie de plastas.\n@c0@"
  fr: "@aNera@bNous devrions la laisser tranquille.\r\nElle a besoin de se concentrer.\n@c0@"
  it: "@aNera@bHai sentito, %a000090?\nDai, andiamocene.\nNon possiamo restare qui...\n@c0@"
  ja: "@a@bフローラ「さあ　向こうへ行きましょう。\n\tここにいると　エッチな人だと\n\t思われてしまいますわよ。\n@c0@"
408:
  de: "@aBianca@bDie Schleime hier sind so bunt und niedlich!\n@c0@"
  en: "@aBianca@bThe slimes here are so colourful and cute!\n@c0@"
  es: "@aBianca@b¡Aquí los limos tienen muchos colores! ¡Qué monos!\n@c0@"
  fr: "@aBianca@bLes gluants sont si mignons et si colorés, iciⓠ\n@c0@"
  it: "@aBianca@bQuesti Slime colorati sono troppo simpatici!\n@c0@"
  ja: "@a@bビアンカ「ここの　スライムって\n\t色とりどりで　かわいいわね。\n@c0@"
409:
  de: "@aNera@bIch frage mich, wie die Schleime es geschafft haben, so bunte Farben anzunehmen!\n@c0@"
  en: "@aNera@bI wonder how those slimes managed to turn themselves into such funny colours!\n@c0@"
  es: "@aNera@b¡Ma qué habrá sucedido para que los limos tengan esos colores tan graciosos!\n@c0@"
  fr: "@aNera@bJe me demande comment ces gluants ont réussi à prendre des couleurs aussi drôlesⓠ\n@c0@"
  it: "@aNera@bCome avranno fatto questi Slime ad assumere colori tanto vivaci?\n@c0@"
  ja: "@a@bフローラ「スライムさんたちは\n\tどうすると　あんなに変わった色に\n\tなるのかしら？\n@c0@"
410:
  de: "@aBianca@bHa ha ha! Der Alte scheint sich ja prima zu unterhalten!\n@c0@"
  en: "@aBianca@bHa ha ha! Looks like the old bloke's havin' fun!\n@c0@"
  es: "@aBianca@b¡Ja, ja, ja! ¡Parece que ese vejete se lo está pasando de miedo!\n@c0@"
  fr: "@aBianca@bHa ha haⓠ Pépé s'amuse, on diraitⓠ\n@c0@"
  it: "@aBianca@bGli Slime sono mostri, quindi restano sempre creature dal comportamento imprevedibile! Eccezion fatta per quelli addomesticati, s'intende...\n@c0@"
  ja: "@a@bビアンカ「うふふ。\n\tあのおじいさん　めいっぱい\n\t楽しんでる感じね。\n@c0@"
411:
  de: "@aNera@bEr betrachtet die Schleime mit solcher Zuneigung. Fast so, als wären es seine Enkel!\n@c0@"
  en: "@aNera@bHe's looking at those slimes with so much\r\naffection. It's almost as if he thinks of them\r\nas his grandchildren!\n@c0@"
  es: "@aNera@bEstá mirando a esos limos con molto cariño. ¡Es como si fueran sus nietos!\n@c0@"
  fr: "@aNera@bIl regarde ces gluants avec tant d'affection.\nC'est presque comme s'il les considérait\ncomme ses petits-enfantsⓠ\n@c0@"
  it: "@aNera@bQuel tipo ha una vera passione per gli Slime...\n@c0@"
  ja: "@a@bフローラ「気のせいか　あのおじいさんの目\n\tまるで　まごを見るかのように\n\t愛情に　あふれていましたわね。\n@c0@"
412:
  de: "@aBianca@bSchleime sind so unverwüstlich und niedlich.\n@c0@"
  en: "@aBianca@bSlimes are so bouncy and cute-looking.\n@c0@"
  es: "@aBianca@bLos limos son tan alegres y monos...\n@c0@"
  fr: "@aBianca@bCes gluants sont tellement mignons et énergiques.\n@c0@"
  it: "@aBianca@bGli Slime sono soffici e teneri.\nSembrano dei giganteschi bignè.\n@c0@"
  ja: "@a@bビアンカ「スライムって　つっつくと\n\tぷにぷにして　かわいいけど……\n@c0@"
413:
  de: "@aBianca@bAber wenn man sie anfasst, sind sie so... schleimig! Igitt!\n@c0@"
  en: "@aBianca@bBut when you touch them, they're so...slimy! Yuck!\n@c0@"
  es: "@aBianca@bPero si los tocas son tan... ¡limosos! ¡Puaj!\n@c0@"
  fr: "@aBianca@bMais quand on les touche, ils sont tellement...\n... gluantsⓠ Beurkⓠ\n@c0@"
  it: "@aBianca@bPerò, se li tocchi, ti accorgi che hanno la pelle viscida e scivolosa.\n@c0@"
  ja: "@a@bビアンカ「抱きつくと　べとべと…　って\n\tちょっと　気持ち悪いのよね……。\n@c0@"
414:
  de: "@aNera@bDiese Schleime haben so muntere, funkelnde Augen.\n@c0@"
  en: "@aNera@bThe slimes here have such bright, shining eyes.\n@c0@"
  es: "@aNera@bLos occhi de los limos de aquí son muy brillantes.\n@c0@"
  fr: "@aNera@bCes gluants ont vraiment les yeux brillants et lumineux.\n@c0@"
  it: "@aNera@bQuesti Slime hanno gli occhi vispi e allegri.\nSembrano il ritratto della felicità.\n@c0@"
  ja: "@a@bフローラ「ここのスライムさんたちも\n\tすんだ目を　しているのね。\n@c0@"
415:
  de: "@aBianca@bEs wäre doch schön, einen sprechenden Schleim in unserer Gruppe zu haben, oder? Wenn er nicht gerade schwatzhaft ist.\n@c0@"
  en: "@aBianca@bIt'd be fun if we could get a talkin' slime in\r\nour party, eh? Unless they'd be too much of\r\na chatterbox.\n@c0@"
  es: "@aBianca@bSería gracioso tener un limo parlante en nuestro grupo, ¿a que sí? A no ser que resultara ser un charlatán.\n@c0@"
  fr: "@aBianca@bÇa serait marrant d'avoir un gluant qui parle dans l'équipe, nonⓡ Enfin, sauf s'il est vraiment trop bavard.\n@c0@"
  it: "@aBianca@bNon sarebbe una cattiva idea aggiungere uno Slime parlante al nostro gruppo...\n@c0@"
  ja: "@a@bビアンカ「私たちも　話せるスライムを\n\t仲間にできると　楽しそうよね。\n\tそれとも　うるさいかな？？\n@c0@"
416:
  de: "@aNera@bSchleime sind so kindisch und albern. Äh... ich meine, kindlich und unschuldig.\n@c0@"
  en: "@aNera@bSlimes are so childish and silly. Er... I mean childlike and innocent.\n@c0@"
  es: "@aNera@bLos limos veramente son pueriles y bobos. Esto... Quería decir ingenuos e inocentes.\n@c0@"
  fr: "@aNera@bLes gluants sont tellement puérils et bêbêtes...\r\nEuh, je veux dire, enfantins et innocents.\n@c0@"
  it: "@aNera@bNon credevo che gli Slime si intendessero di previsioni meteorologiche...\n@c0@"
  ja: "@a@bフローラ「スライムさんの　しゃべり方って\n\tアホっぽくて　…いえ　むじゃきで\n\tかわいいですわ。\n@c0@"
417:
  de: "@aBianca@bAls Kinder haben wir immer Truhen & Tücken gespielt. Aber du hast immer gewonnen.\n@c0@"
  en: "@aBianca@bWe used to play T 'n' T together when we were kids. You always won, mind.\n@c0@"
  es: "@aBianca@bCuando éramos niños solíamos jugar a T y T juntos. Siempre ganabas, por cierto.\n@c0@"
  fr: "@aBianca@bOn jouait au TNT ensemble quand on était petits.\r\nMais c'était toujours toi qui gagnais.\n@c0@"
  it: "@aBianca@bRicordo che da bambina giocavo spesso con una Tavola della Sorte in miniatura...\nEra divertente!\n@c0@"
  ja: "@a@bビアンカ「小さい頃　%a000090とも\n\tすごろくゲームで　遊んだわよね。\n\tいつも　%a000090が勝ってたっけ……。\n@c0@"
418:
  de: "@aNera@bIch frage mich immer, wer wohl auf die Idee gekommen ist, so große T&T-Bretter zu entwerfen.\n@c0@"
  en: "@aNera@bI always marvel at who thought up the idea of such gigantic T 'n' T boards.\n@c0@"
  es: "@aNera@bVeramente, admiro a la persona que pensó en estos tableros de T y T gigantes.\n@c0@"
  fr: "@aNera@bJe suis toujours épatée que quelqu'un ait pu avoir l'idée de créer des plateaux de TNT aussi gigantesques.\n@c0@"
  it: "@aNera@bA chi sarà venuto in mente di creare le Tavole della Sorte?\nÈ un gioco fantastico!\n@c0@"
  ja: "@a@bフローラ「いつも　思うのですけど……\n\tこんな巨大な　人間すごろくを\n\t考えた人は　いったい誰なんでしょう？\n@c0@"
419:
  de: "@aBianca@bWenn man nur immer das würfeln könnte, was man will, was? Aber das wäre wohl ein bisschen langweilig.\n@c0@"
  en: "@aBianca@bIf only you could always roll what you wanted, eh? I s'pose that'd get a bit borin', though.\n@c0@"
  es: "@aBianca@bSería ideal que los dados siempre rodasen al gusto de uno, ¿eh? Claro que acabaría por ser aburrido.\n@c0@"
  fr: "@aBianca@bSi seulement on réussissait toujours à faire le chiffre qu'on veut avec le dé, heinⓡ Remarque,\nça finirait par devenir ennuyeux.\n@c0@"
  it: "@aBianca@bNon è facile fare la scelta giusta quando si hanno più alternative a disposizione...\nNon è vero, %a000090? Eh eh eh!\n@c0@"
  ja: "@a@bビアンカ「サイコロの目が　思うように\n\t出せたらいいのにね。　でも\n\tそれだと　おもしろくないか……。\n@c0@"
420:
  de: "@aNera@bOh je. Er nimmt das alles ja ganz schön ernst. Ihr Männer seid manchmal wirklich lustig!\n@c0@"
  en: "@aNera@bOh dear. He's taking it all rather seriously.\r\nYou men can be so funny at times.\n@c0@"
  es: "@aNera@b¡Oh, cielos! Se lo toma veramente en serio.\r\nA veces los hombres sois molto curiosos.\n@c0@"
  fr: "@aNera@bEh bien, on peut dire qu'il prend ça très au sérieux. C'est drôle, les hommes, parfois.\n@c0@"
  it: "@aNera@bDovrebbe seguire il suo istinto.\nCosì non avrà rimpianti, se dovesse fare la scelta sbagliata...\n@c0@"
  ja: "@a@bフローラ「あの方ったら　あんなに真剣に\n\t考えこんで…　うふふ。\n\t男の方って　おもしろいですわね。\n@c0@"
421:
  de: "@aBianca@bHm! Komm, wir versuchen es noch mal, %a000090.\n@c0@"
  en: "@aBianca@bHuh! Let's give it another go, %a000090!\n@c0@"
  es: "@aBianca@b¡Mmm! ¡Vamos a probar otra vez, %a000090!\n@c0@"
  fr: "@aBianca@bPfffⓠ Allez, %a000090, on réessaieⓠ\n@c0@"
  it: "@aBianca@bOh, accidenti!\nNon fa niente, %a000090!\nDai, riprova!\n@c0@"
  ja: "@a@bビアンカ「く　く　くやしい～！\n\t%a000090　もう１回　ちょうせんよ！\n@c0@"
422:
  de: "@aNera@bIch hätte nicht gedacht, dass hier unten noch jemand ist! Ich hoffe, er konnte mir nicht unter den Rock sehen...\n@c0@"
  en: "@aNera@bI didn't expect anyone to be down there! I hope he couldn't see up my skirt...\n@c0@"
  es: "@aNera@b¡Ma no creía que hubiese nadie ahí abajo! Espero que no haya podido mirar debajo de la mia falda...\n@c0@"
  fr: "@aNera@bJe ne m'attendais pas à ce qu'il y ait quelqu'un iciⓠ J'espère qu'il n'a pas pu regarder sous ma jupe...\n@c0@"
  it: "@aNera@bNon credevo che là sotto ci fosse qualcuno...\n@c0@"
  ja: "@a@bフローラ「あんな所に　人がいたなんて…\n\t私のスカートの中が　見えなかったか\n\t心配ですわ。　ぽっ……。\n@c0@"
423:
  de: "@aBianca@bWas für ein fieser kleiner Mann! Dann passen wir eben auf, dass wir nicht runterfallen, was?\n@c0@"
  en: "@aBianca@bWhat a mean little man! We'll just have to make sure we dun't fall down, eh?\n@c0@"
  es: "@aBianca@b¡Qué tipo más desagradable! Habrá que ir con cuidado de no caerse, ¿eh?\n@c0@"
  fr: "@aBianca@bQuel méchant bonhommeⓠ On a intérêt à faire en sorte de ne pas tomber, heinⓡ\n@c0@"
  it: "@aBianca@bMa davvero?!\nAllora staremo attenti a non cadere, così non si divertirà alle nostre spalle!\n@c0@"
  ja: "@a@bビアンカ「いやな　おじさんね。\n\tすごろくをするときは\n\t落ちないように　気をつけましょ。\n@c0@"
424:
  de: "@aNera@bDer arme Mann. Es muss einen ja verdrießen, es nie geschafft zu haben.\n@c0@"
  en: "@aNera@bThe poor man. It must be frustrating not to have ever succeeded.\n@c0@"
  es: "@aNera@bPoverino. Debe de ser frustrante no haber ganado nunca.\n@c0@"
  fr: "@aNera@bPauvre homme. Ça doit être frustrant de n'avoir jamais réussi.\n@c0@"
  it: "@aNera@bPoveraccio, comprendo la sua frustrazione.\nChissà quanto gli brucia non essere mai arrivato fino alla fine... Ih ih ih!\n@c0@"
  ja: "@a@bフローラ「まあ　一度もゴールしたことが\n\tないなんて　お気の毒ですわ。\n@c0@"
425:
  de: "@aBianca@bHier ist abends ganz schön was los, wie?\n@c0@"
  en: "@aBianca@bThis place is pretty lively of a night too, eh?\n@c0@"
  es: "@aBianca@bEste sitio está muy animado de noche, ¿verdad?\n@c0@"
  fr: "@aBianca@bCet endroit est très animé en soirée aussi, on dirait.\n@c0@"
  it: "@aBianca@bC'è una bella vita notturna da queste parti, eh?\n@c0@"
  ja: "@a@bビアンカ「ここって　夜でも\n\tずいぶん　にぎやかなのね。\n@c0@"
426:
  de: "@aBianca@bHier gibt es doch ein Kasino, oder? Aber ich nehme an, für so etwas fehlt uns die Zeit.\n@c0@"
  en: "@aBianca@bThere's a casino here, en't there? But we've got more important things to be doin', I s'pose.\n@c0@"
  es: "@aBianca@bHay un casino aquí, ¿no? Pero supongo que tenemos cosas más importantes que hacer y tal.\n@c0@"
  fr: "@aBianca@bIl y a un casino ici, nonⓡ Mais je crois que nous avons des choses plus importantes à faire.\n@c0@"
  it: "@aBianca@bSe non sbaglio qui intorno dovrebbe esserci anche un casinò, ma siamo troppo occupati per farci una capatina...\n@c0@"
  ja: "@a@bビアンカ「ここって　カジノがあるのよね？\n\tでも　大事な用があるんだから\n\tカジノなんかで　遊んじゃダメよっ。\n@c0@"
427:
  de: "@aNera@bWährend meiner Zeit im Stift bin ich nie hier gewesen. So hätte ich es mir nie vorgestellt!\n@c0@"
  en: "@aNera@bI never visited here at night during my time at the abbey. It's quite a revelation.\n@c0@"
  es: "@aNera@bNunca vine aquí de notte mientras estaba en la abadía. Es todo un descubrimiento, la verdad.\n@c0@"
  fr: "@aNera@bJe ne suis jamais venue ici de nuit pendant mon séjour à l'abbaye. C'est une découverte pour moi.\n@c0@"
  it: "@aNera@bQuando vivevo all'Abbaziadi Su'ncyel, ho visitato Fortuna diverse volte, ma mai di sera.\nNon immaginavo che ci fosse tanto movimento!\n@c0@"
  ja: "@a@bフローラ「修道院にいた頃は　夜に\n\tこの町を　訪れることはなかったから…\n\tなんだか　しんせんですわ。\n@c0@"
428:
  de: "@aBianca@bHier ist aber auch immer was los, oder?\n@c0@"
  en: "@aBianca@bThis place never sleeps, eh?\n@c0@"
  es: "@aBianca@bEste sitio no duerme nunca, ¿eh?\n@c0@"
  fr: "@aBianca@bCet endroit ne dort jamais, apparemmentⓠ\n@c0@"
  it: "@aBianca@bIo voglio divertirmi!\nMa senza esagerare, eh?\nCos'avevi capito?!\n@c0@"
  ja: "@a@bビアンカ「本当に　ひと晩中でも\n\t遊べそうな町ね。\n@c0@"
429:
  de: "@aNera@bWenn sich doch nur tatsächlich jeder amüsieren würde! Aber ich habe den Verdacht, dass es selbst hier ein paar verzweifelte Seelen gibt.\n@c0@"
  en: "@aNera@bIf only everyone here was having fun. I'm afraid they have their fair share of desolate souls here too, though.\n@c0@"
  es: "@aNera@bSi veramente todas estas personas se estuviesen divirtiendo... Ma me temo que hay una buena parte que son almas desgraciadas.\n@c0@"
  fr: "@aNera@bSi seulement tout le monde pouvait s'amuser, ici.\r\nMais je crains que l'on y trouve aussi de pauvres âmes tristes, malheureusement.\n@c0@"
  it: "@aNera@bTutti possono divertirsi, ha detto?\nSecondo me sono pochi quelli che ci riescono davvero...\n@c0@"
  ja: "@a@bフローラ「楽しめる人ばかりだと\n\tいいのですが…　この町は\n\tすさむ人も　多いのですわ。\n@c0@"
430:
  de: "@aBianca@bVielleicht sollten wir es auch mal versuchen?\n@c0@"
  en: "@aBianca@bMaybe we should have a bit of a flutter, eh?\n@c0@"
  es: "@aBianca@bPodríamos probar, ¿te parece?\n@c0@"
  fr: "@aBianca@bOn devrait peut-être jouer un peu nous aussi, nonⓡ\n@c0@"
  it: "@aBianca@bUhm, mi sta facendo venire voglia di tentare la sorte...\n@c0@"
  ja: "@a@bビアンカ「私たちも　ちょっとだけ\n\t遊んでいきましょうか？\n@c0@"
431:
  de: "@aNera@bAls ich ihn zum letzten Mal traf, hatte er gerade jede Menge Jetons verloren. Es ist schön zu sehen, dass er diesmal mehr Glück hat.\n@c0@"
  en: "@aNera@bThe last time I met him, he'd just lost a lot of tokens. It's good to see he's having better luck this time.\n@c0@"
  es: "@aNera@bMa la última vez que le vi acababa de perder un montón de fichas. Me alegro de ver que ahora tiene mejor sorte.\n@c0@"
  fr: "@aNera@bLa dernière fois que je l'ai croisé, il venait de\r\nperdre un paquet de jetons. C'est bien de voir\r\nqu'il semble avoir plus de chance, cette fois.\n@c0@"
  it: "@aNera@bL'ultima volta che avevo visto quel tipo aveva perso un mucchio di denaro alle slot machine. Mi fa piacere che stavolta la fortuna gli sia stata amica.\n@c0@"
  ja: "@a@bフローラ「あの方　前にお会いしたときは\n\t大負けしたと　おっしゃっていましたが\n\t……勝てて　よかったですわ。\n@c0@"
432:
  de: "@aBianca@bIch wette, sie hat von deiner Mutter gesprochen, %a000090! Das würde ja heißen, dass sie noch lebt!\n@c0@"
  en: "@aBianca@bI'll bet she was talkin' about your mum, %a000090! That means she must still be alive!\n@c0@"
  es: "@aBianca@b¡Estoy segura de que estaba hablando de tu madre, %a000090! ¡Eso quiere decir que sigue viva!\n@c0@"
  fr: "@aBianca@bJe parie qu'elle parlait de ta mère, %a000090ⓠ Ça veut dire qu'elle est sûrement encore en vieⓠ\n@c0@"
  it: "@aBianca@b%0%a000090! Forse sta parlando di tua madre! Ha detto che è viva e sta bene! Oh, santa dea! Speriamo che questa tipa non ci stia prendendo in giro...\n@c0@"
  ja: "@a@bビアンカ「親しい女って　きっと\n\t%a000090のお母さんのことよね。\n\t生きてるって！　良かったね。\n@c0@"
433:
  de: "@aBianca@bEine Insel im Süden? Klingt gar nicht schlecht, um sich dort zur Ruhe zu setzen.\n@c0@"
  en: "@aBianca@bAn island down south? Dun't sound like a bad place to settle down if you can.\n@c0@"
  es: "@aBianca@b¿Una isla al sur? No parece un mal sitio para establecerse si te lo puedes permitir.\n@c0@"
  fr: "@aBianca@bUne île au sudⓡ Ça n'a pas l'air mal comme endroit pour s'installer, si on le peut.\n@c0@"
  it: "@aBianca@bⓕUn'isoletta a sud, molto a sud. Un posto tutto sole e mareⓖ... Ah, che meraviglia! Mi piacerebbe vivere in un paradiso del genere...\n@c0@"
  ja: "@a@bビアンカ「南の島か……\n\t目的を達成したあとは　そういう所で\n\t暮らすのもいいかもね。\n@c0@"
434:
  de: "@aNera@bMir ist es egal, wo wir einmal leben werden, solange wir nur zusammen sind, Liebling.\n@c0@"
  en: "@aNera@bI don't care where we end up living as long as I'm with you, darling.\n@c0@"
  es: "@aNera@bNo me importa dónde viva sempre que sea con te, caro mio.\n@c0@"
  fr: "@aNera@bPeu m'importe où nous finirons par vivre, du moment que je suis avec toi, mon chéri.\n@c0@"
  it: "@aNera@bNon m'importa del sole e del mare: potrei vivere anche Ⓠ sul cucuzzolo di una montagna, con la neve alta così ⓆⓆ, se tu fossi accanto a me, amore mio!\n@c0@"
  ja: "@a@bフローラ「私は　%a000090さんとなら\n\tどこでだって　人生を楽しめますわ。\n\tぽっ……。\n@c0@"
435:
  de: "@aBianca@bDa ist was dran, %a000090! Die Gute hat ein Bad verdient, nach all der Schufterei. Lassen wir sie in Ruhe.\n@c0@"
  en: "@aBianca@bHe en't jokin', %a000090. A lady deserves a bath after a hard day's work.\n@c0@"
  es: "@aBianca@bVa en serio, %a000090. Espero que no fueras tú.\n@c0@"
  fr: "@aBianca@bIl n'a pas tort, %a000090. Une femme mérite bien un bain après une journée fatigante.\n@c0@"
  it: "@aBianca@bNon credo che stia scherzando...\nPenso sia meglio se guardiamo da un'altra parte!\n@c0@"
  ja: "@a@bビアンカ「あの目は　本気よ。\n\t%a000090　のぞきなんて\n\tしないでよね。\n@c0@"
436:
  de: "@aNera@bMeinst du, er steht immer Wache, wenn seine Frau ein Bad nimmt? Er muss sie wirklich sehr lieben.\n@c0@"
  en: "@aNera@bDo you think he always stands guard when his wife's having a bath? He must be really devoted to her.\n@c0@"
  es: "@aNera@b¡Ma qué cosas hace la gente en los baños públicos!\n@c0@"
  fr: "@aNera@bTu crois qu'il monte toujours la garde pendant que son épouse prend un bainⓡ Il doit vraiment tenir à ce que rien ne vienne la déranger.\n@c0@"
  it: "@aNera@bMa quel tipo si mette di guardia ogni volta che la moglie fa il bagno?!\nDeve soffrire di una gelosia ai limiti dell'inverosimile!\n@c0@"
  ja: "@a@bフローラ「奥さまが　お風呂に入っている間\n\tいつも　番をなさっているのかしら？\n\t奥さま　愛されてますわね。\n@c0@"
437:
  de: "@aBianca@bSie hat dir mit ihrem Gekreische doch wohl keine Angst eingejagt, %a000090, oder?\n@c0@"
  en: "@aBianca@bShe didn't scare you when she screamed, did she, %a000090?\n@c0@"
  es: "@aBianca@b¿Te da miedo la señora, %a000090?\n@c0@"
  fr: "@aBianca@bAvoue que c'est elle qui t'a fait peur en criant\ncomme ça, hein, %a000090ⓡ\n@c0@"
  it: "@aBianca@bMa non avevamo intenzione di spaventarla!\nDico bene, %a000090?\n@c0@"
  ja: "@a@bビアンカ「なによ　%a000090。\n\t残念なの？\n@c0@"
438:
  de: "@aBianca@bHa! Wusst' ich's doch! Du warst schon immer ein richtiger Angsthase!\n@c0@"
  en: "@aBianca@bHa! I knew it! You always were a big old scaredy cat!\n@c0@"
  es: "@aBianca@b¡Ja! Lo sabía, eres un cagueta.\n@c0@"
  fr: "@aBianca@bAhⓠ Je le savais ⓠ Tu as toujours peur quand on te surprendⓠ\n@c0@"
  it: "@aBianca@bSiamo persone per bene, noi!\n@c0@"
  ja: "@a@bビアンカ「……%a000090\n\t今夜は　床で　ねてよねっ！\n@c0@"
439:
  de: "@aBianca@bDu kannst mich nicht anlügen, %a000090! Dafür kenn ich dich viel zu gut.\n@c0@"
  en: "@aBianca@bPah! There's no need to lie to me, %a000090. I know you far too well for that.\n@c0@"
  es: "@aBianca@bMmm... A saber...\n@c0@"
  fr: "@aBianca@bOh, allez, pas la peine de mentir, %a000090.\nJe te connais trop bien.\n@c0@"
  it: "@aBianca@bAh, %a000090...\nHai sempre voglia di scherzare!\n@c0@"
  ja: "@a@bビアンカ「ふ～～～～～ん……。\n@c0@"
440:
  de: "@aNera@bWir haben uns doch gar nicht angeschlichen! Sie hat nur nicht richtig aufgepasst. Na ja, es ist ja nichts passiert, also sei's drum.\n@c0@"
  en: "@aNera@bI don't think we really sneaked up on her. She just wasn't paying attention. Well, she didn't seem to mind too much, so never mind.\n@c0@"
  es: "@aNera@bMa, si tampoco damos tanto susto, ¿vero? Bueno, al menos no se lo ha tomado mal del tutto.\n@c0@"
  fr: "@aNera@bNous n'avons pas été si discrets que ça. Elle devait surtout être perdue dans ses pensées. Mais bon,\r\nça va, elle n'a pas l'air de nous en vouloir.\n@c0@"
  it: "@aNera@bⓕCoccoⓖ a chi?!\nTu non sei il ⓕcoccoⓖ di nessuna, %a000090!\nSei il mio tesoro, e basta!\n\n@c0@"
  ja: "@a@bフローラ「残念だなんて…\n\tあなたには　のぞくつもりなんて\n\tなかったですわよ……　ね？\n@c0@"
441:
  de: "@aBianca@bWir haben als Kinder auch schon Abenteuer vor der Stadt gesucht, also sollten wir uns hier vielleicht lieber raushalten, was?\n@c0@"
  en: "@aBianca@bWe used to go off adventurin' outside of town when we were kids, so we can't say much really.\n@c0@"
  es: "@aBianca@bSolíamos salir juntos de aventuras cuando éramos niños, así que no podemos decir ni mu.\n@c0@"
  fr: "@aBianca@bOn n'a pas grand-chose à dire, vu qu'on sortait nous-mêmes de la ville pour partir à l'aventure\r\nquand on était gosses.\n@c0@"
  it: "@aBianca@bBeh, anche noi da piccoli ogni tanto andavamo a giocare fuori dal villaggio, quindi non me la sento di condannare suo figlio...\n@c0@"
  ja: "@a@bビアンカ「私たちも　子供の頃\n\t町の外まで　冒険に行っちゃったから\n\tあまり　言えないんだけど……\n@c0@"
442:
  de: "@aBianca@bAber wenn's meine eigenen Kinder wären, hätte ich es auch nicht gern, wenn sie so losziehen würden.\n@c0@"
  en: "@aBianca@bI wouldn't want my own kids goin' off like that, mind.\n@c0@"
  es: "@aBianca@bPero no querría que mis propios hijos lo hiciesen, la verdad, ¿sabes?\n@c0@"
  fr: "@aBianca@bMais il n'empêche que je n'aimerais pas que mes enfants s'en aillent comme ça.\n@c0@"
  it: "@aBianca@bAi nostri bambini, però, metterò un guinzaglio lungo non più di due metri, così saprò sempre dove saranno!\n@c0@"
  ja: "@a@bビアンカ「でも　自分の子供には\n\tやっぱり　外で遊ばないように\n\t言っちゃうんじゃないかな……。\n@c0@"
443:
  de: "@aNera@bJeder will eine Welt ohne Ungeheuer, aber es wäre doch schade, wenn dann all die netten Ungeheuer ebenfalls verschwinden würden.\n@c0@"
  en: "@aNera@bEveryone wants a world without horrible monsters, but it would be a shame if all the nice monsters had to disappear too.\n@c0@"
  es: "@aNera@bTodo el mundo quiere un mundo sin mostri horribile, pero sería una lástima que despareciesen también los simpáticos.\n@c0@"
  fr: "@aNera@bTout le monde rêve d'un monde sans monstres,\r\nmais ce serait tout de même dommage si tous\r\nles gentils monstres disparaissaient, eux aussi.\n@c0@"
  it: "@aNera@bSì, i mostri sono creature pericolose.\nPerò non è che gli esseri umani siano tutti bravi e belli...\n@c0@"
  ja: "@a@bフローラ「魔物の出ない世の中には\n\tあこがれますけど　いい魔物さんまで\n\tいなくなってしまうのは　イヤですわ。\n@c0@"
444:
  de: "@aBianca@bIch hab's gar nicht gern, wenn ich andere Frauen so mit dir reden höre. Aber das ist wohl typisch Ehefrau, was?\n@c0@"
  en: "@aBianca@bI dun't much like hearin' other women chattin' you up. I s'pose that's a wife's prerogative, eh?\n@c0@"
  es: "@aBianca@bNo me gusta que otras mujeres intenten ligar contigo. Eso es cosa de tu señora, ¿me entiendes?\n@c0@"
  fr: "@aBianca@bJe n'aime pas trop que les autres femmes t'abordent pour te faire du gringue. C'est une prérogative d'épouse ça, nonⓡ\n@c0@"
  it: "@aBianca@bSe quella smorfiosa non la smette di farti gli occhi dolci le spacc...\nOh, santa dea! Non credevo di essere così gelosa!\n@c0@"
  ja: "@a@bビアンカ「妻として　夫をほめられるのは\n\t悪い気が　しないわね。\n@c0@"
445:
  de: "@aNera@bIch bin offenbar nicht die Einzige, die dich so anziehend findet, %a000090.\n@c0@"
  en: "@aNera@bIt seems I'm not the only one who finds you so attractive, %a000090!\n@c0@"
  es: "@aNera@b¡Sembra que no soy la única que te encuentra atractivo, %a000090!\n@c0@"
  fr: "@aNera@bOn dirait que je ne suis pas la seule à te trouver très séduisant, %a000090ⓠ\n@c0@"
  it: "@aNera@bPare che io non sia l'unica donna a essere attratta da te, %a000090! L'importante è che tu non faccia il cascamorto con le altre. Ci siamo capiti?!\n@c0@"
  ja: "@a@bフローラ「やっぱり　%a000090さんは\n\t誰から見ても　ハンサムなんですね。\n\tぽっ……。\n@c0@"
446:
  de: "@aBianca@bTja, zu meinen Stärken gehört Kochen auch nicht.\n@c0@"
  en: "@aBianca@bI en't too hot when it comes to the old cookin' neither.\n@c0@"
  es: "@aBianca@bA mí tampoco me hace mucha gracia lo de la cocina, ¿sabes?\n@c0@"
  fr: "@aBianca@bOui, et puis les plats ne sont pas très chauds.\n@c0@"
  it: "@aBianca@bIn cucina sono un disastro... Una volta cucinai per i clienti della locanda, e mio padre dovette supplicarli in ginocchio di non denunciarmi per tentato omicidio...\n@c0@"
  ja: "@a@bビアンカ「私も　お料理は\n\tあんまり　得意じゃないのよね……。\n@c0@"
447:
  de: "@aNera@bIch fand es gar nicht so schlecht. Ich meine, wenn sich jemand schon hinstellt, um etwas für dich zu kochen, dann ist das doch auch schon was wert.\n@c0@"
  en: "@aNera@bI thought it was quite nice. I mean, if someone goes to the effort of making something for you, that's all that really counts.\n@c0@"
  es: "@aNera@bCredo que fue muy amable. Lo que realmente cuenta es que alguien se ha tomado el trabajo de preparar algo per te.\n@c0@"
  fr: "@aNera@bJe n'ai pas trouvé ça mauvais. C'est vrai, ce qui compte en réalité, c'est que quelqu'un ait fait\r\nl'effort de cuisiner pour nous.\n@c0@"
  it: "@aNera@bIn cucina me la cavo decisamente bene.\nLe suore dell'Abbazia di Su'ncyel mi hanno insegnato a preparare dei piatti deliziosi!\n@c0@"
  ja: "@a@bフローラ「私は　おいしいと\n\t思いましたわ。　だって　料理に\n\t愛情がこもっていましたもの。\n@c0@"
448:
  de: "@aBianca@bWas für eine merkwürdige Art, Geschäfte zu machen!\n@c0@"
  en: "@aBianca@bWhat a weird way of doin' business!\n@c0@"
  es: "@aBianca@b¡Qué forma más rara de hacer negocios!\n@c0@"
  fr: "@aBianca@bQuelle drôle de façon de faire des affairesⓠ\n@c0@"
  it: "@aBianca@bUn negoziante che si rifiuta di vendere la sua merce a un cliente?!\nQuesta sì che è bella!\n@c0@"
  ja: "@a@bビアンカ「ふ～ん…\n\tこだわりの　お店なのね。\n@c0@"
449:
  de: "@aNera@bWie merkwürdig, einem Kunden, der etwas haben will, den Kauf zu verweigern!\n@c0@"
  en: "@aNera@bHow odd, refusing to sell something to a customer who wants it!\n@c0@"
  es: "@aNera@b¡Qué extraño, negarse a vendere algo a un cliente que quiere comprarlo!\n@c0@"
  fr: "@aNera@bC'est vraiment bizarre de refuser de vendre\nun objet à un client qui le veutⓠ\n@c0@"
  it: "@aNera@bMa tu guarda che modo di gestire un'attività commerciale...\nMio padre non approverebbe mai!\n@c0@"
  ja: "@a@bフローラ「お目当ての品を\n\t売ってもらえなかったからといって\n\tあんな言い方は　ないですわよね。\n@c0@"
450:
  de: "@aBianca@bDank meinen Eltern hatte ich eine wunderbare Kindheit. Sie haben immer gut auf mich aufgepasst.\n@c0@"
  en: "@aBianca@bMum and Dad gave me a brilliant childhood.\r\nThey always took good care of me.\n@c0@"
  es: "@aBianca@bMi madre y mi padre me dieron una infancia fenomenal.\r\nSiempre me cuidaron bien, ¿sabes?\n@c0@"
  fr: "@aBianca@bGrâce à maman et papa, j'ai eu une enfance géniale. Ils ont toujours pris bien soin de moi.\n@c0@"
  it: "@aBianca@bMio padre e mia madre sono stati ottimi genitori. Non mi hanno mai fatto mancare nulla e mi hanno sempre dato tutto l'affetto di cui un figlio ha bisogno.\n@c0@"
  ja: "@a@bビアンカ「私は　お父さんとお母さんに\n\t大事に　育ててもらって\n\tすごく幸せだったな……。\n@c0@"
451:
  de: "@aBianca@bAls meine Mutter tot war, war die Familie eine Weile etwas geschrumpft. Aber jetzt bist du ja dazugekommen, also sind wir wieder zu dritt.\n@c0@"
  en: "@aBianca@bWith Mum gone, the family got a bit smaller for\r\na while. But now you've joined, so we're back up\r\nto three.\n@c0@"
  es: "@aBianca@bSin mi madre, la familia se redujo un poco durante un tiempo. Pero ahora que estás tú, volvemos a ser tres.\n@c0@"
  fr: "@aBianca@bÀ la mort de maman, la famille s'est un peu réduite, mais maintenant que tu en fais partie, nous sommes\r\nà nouveau trois.\n@c0@"
  it: "@aBianca@bQuando mia madre è morta, ho avvertito una sensazione di vuoto nel cuore.\nPoi sei arrivato tu, e l'hai riempito d'amore...\n@c0@"
  ja: "@a@bビアンカ「お母さんは　死んじゃって\n\t家族がへっちゃったけど\n\t%a000090っていう　家族がふえたし。\n@c0@"
452:
  de: "@aBianca@bUnd wenn wir eines Tages Kinder haben, will ich sie so lieb haben, wie meine Eltern mich geliebt haben.\n@c0@"
  en: "@aBianca@bAnd when we have kids one day, I'll make sure I show them the kind of love my folks showed me.\n@c0@"
  es: "@aBianca@bY, cuando tengamos niños, los querré tanto como mis padres me quisieron a mí.\n@c0@"
  fr: "@aBianca@bEt quand nous aurons des enfants, un jour,\r\nje leur donnerai autant d'amour que mes\r\nparents m'en ont apporté.\n@c0@"
  it: "@aBianca@bSe un giorno avremo dei figli, restituirò loro tutto il calore che i miei genitori mi hanno dato. Voglio che i nostri bambini si sentano amati, %a000090.\n@c0@"
  ja: "@a@bビアンカ「いつか　子供が生まれたら\n\t私が　両親から受けたように\n\tいっぱい愛情を　そそいであげたいな。\n@c0@"
453:
  de: "@aNera@bIch habe es dir wahrscheinlich schon mal erzählt, aber ich habe noch nie mit Mama oder Papa gestritten.\n@c0@"
  en: "@aNera@bI've probably told you this before, but I've never once had a fight with Mama or Papa.\n@c0@"
  es: "@aNera@bCredo que ya te lo había dicho, pero no me he peleado con il mio papino ni con la mia mamma ni una sola vez.\n@c0@"
  fr: "@aNera@bJe te l'ai sans doute déjà dit, mais je ne me suis jamais disputée une seule fois avec mamma ou papa.\n@c0@"
  it: "@aNera@bNon ho mai litigato con i miei genitori.\nTra noi c'è sempre stata la massima comprensione.\n@c0@"
  ja: "@a@bフローラ「前にも　言ったかも知れませんが\n\t私は　父や母とは　ケンカを\n\tしたことがありませんの。\n@c0@"
454:
  de: "@aNera@bSie haben mir so viel Liebe und Zuneigung erwiesen, dass ich einfach nichts Respektloses ihnen gegenüber tun könnte.\n@c0@"
  en: "@aNera@bThey showed me so much love and affection that I couldn't possibly do anything to disrespect that.\n@c0@"
  es: "@aNera@bMe han dado tanto cariño que sería incapaz de faltarles al rispetto en nada.\n@c0@"
  fr: "@aNera@bIls m'ont donné tellement d'amour et de tendresse\r\nque je n'aurais jamais pu leur manquer de respect.\n@c0@"
  it: "@aNera@bMio padre e mia madre sono i genitori più amorevoli e premurosi che un figlio possa sognare di avere...\n@c0@"
  ja: "@a@bフローラ「両親は　おしみなく　愛情を\n\tそそいでくれていましたし　私も\n\tそれに　応えたかったからでしょうね。\n@c0@"
455:
  de: "@aNera@bAber ich hoffe, wir werden eine Familie haben, in der jeder sagen darf, was er denkt.\n@c0@"
  en: "@aNera@bI hope we can build a family together where people can speak their minds, though.\n@c0@"
  es: "@aNera@bMa espero que en la nostra famiglia tutto il mondo pueda decir lo que piensa.\n@c0@"
  fr: "@aNera@bJ'espère quand même que nous construirons une famille où chacun pourra dire ce qu'il pense.\n@c0@"
  it: "@aNera@bSpero che anche noi andremo sempre d'amore e d'accordo, %a000090.\n@c0@"
  ja: "@a@bフローラ「でも　あなたとは　なんでも\n\t言い合える家庭をつくりたいわ。\n@c0@"
456:
  de: "@aNera@bEs macht gar nichts, wenn man sich hin und wieder ein wenig streitet, solange man sich nur bemüht, einander auch zu verstehen.\n@c0@"
  en: "@aNera@bIt's okay to argue a little, as long as we make up and make the effort to understand one another.\n@c0@"
  es: "@aNera@bNo está mal discutir un po' sempre que se haga el esfuerzo de entenderse.\n@c0@"
  fr: "@aNera@bÇa n'est pas grave de se disputer un peu, du moment qu'on se réconcilie et que chacun fait l'effort de comprendre les autres.\n@c0@"
  it: "@aNera@bCerto, capita a tutti di avere qualche discussione, ma l'importante è chiarirsi subito, dialogando e mostrando rispetto l'uno per l'altra.\n@c0@"
  ja: "@a@bフローラ「多少ケンカしても　必ず\n\t仲直りして　おたがいを\n\t理解しあって　ゆきましょうね。\n@c0@"
457:
  de: "@aBianca@bDer muss es ja faustdick hinter den Ohren haben, wenn er jeden Abend in der Schänke sitzt.\n@c0@"
  en: "@aBianca@bHe must be a feisty old man to spend every night down the pub like that.\n@c0@"
  es: "@aBianca@b¡Vaya viejo más chungo, noche sí noche también en la taberna!\n@c0@"
  fr: "@aBianca@bÇa doit être un fêtard, le papi, pour passer toutes ses nuits à la taverne, comme ça.\n@c0@"
  it: "@aBianca@bIl nonno se n'è andato di nuovo alla taverna?\nPerò! Arzillo il vecchietto, eh?\n@c0@"
  ja: "@a@bビアンカ「毎晩　酒場に　いりびたりなんて\n\t元気なおじいさんね。\n@c0@"
458:
  de: "@aNera@bIch hoffe, der alte Mann übertreibt es nicht mit seinen Besuchen in der Schänke.\n@c0@"
  en: "@aNera@bI hope that old fellow isn't drinking to excess with all those pub visits.\n@c0@"
  es: "@aNera@bVeramente, espero que ese anciano no enferme con tantas visitas a la taberna.\n@c0@"
  fr: "@aNera@bJ'espère que ce vieil homme ne boit pas trop\r\nquand il se rend à la taverne comme ça.\n@c0@"
  it: "@aNera@bSuvvia, un po' di comprensione!\nQualche visitina alla taverna non ha mai ucciso nessuno, no?\n@c0@"
  ja: "@a@bフローラ「その　おじいさま\n\t飲みすぎてないと　いいですわね。\n@c0@"
459:
  de: "@aBianca@bEs wirkt ziemlich normal für das Haus einer Wahrsagerin.\n@c0@"
  en: "@aBianca@bIt's a pretty normal-lookin' place for a\r\nfortune-teller's house.\n@c0@"
  es: "@aBianca@bPara ser la casa de una adivina, parece un sitio de lo más normal.\n@c0@"
  fr: "@aBianca@bÇa a l'air plutôt normal ici. On ne dirait pas qu'il s'agit de la maison d'une diseuse de bonne aventure.\n@c0@"
  it: "@aBianca@bQuesto è lo studio di una chiaroveggente?\nA me sembra una casa come tante altre...\n@c0@"
  ja: "@a@bビアンカ「占い師の家といっても\n\tけっこう　ふつうなのね。\n@c0@"
460:
  de: "@aNera@bIch habe von der Wahrsagerin hier schon gehört, als ich im Stift war. Es heißt, sie liegt manchmal ganz schön daneben.\n@c0@"
  en: "@aNera@bI heard talk of the fortune-teller here when I was at the abbey. Apparently, her readings can be a bit hit and miss.\n@c0@"
  es: "@aNera@bCuando estuve en la abadía oí hablar de questa adivina. Sembra que le sue divinazione son un poco por ensayo y error.\n@c0@"
  fr: "@aNera@bQuand j'étais à l'abbaye, j'ai entendu parler de cette diseuse de bonne aventure. Apparemment,\r\nses prédictions sont un peu inégales.\n@c0@"
  it: "@aNera@bHo sentito parlare di questa chiaroveggente quando ero all'abbazia. Pare che sappia il fatto suo, anche se ha un modo un po' particolare di presentarsi...\n@c0@"
  ja: "@a@bフローラ「修道院にいた頃　聞いた話では\n\tここの占い師さんの話は　当たるときと\n\t当たらないときが　あるそうです。\n@c0@"
461:
  de: "@aBianca@bDieses Mädchen... Sie hat geschlafen, oder?\n@c0@"
  en: "@aBianca@bThat girl... She was asleep, right?\n@c0@"
  es: "@aBianca@bEsa chica... Estaba dormida, ¿no?\n@c0@"
  fr: "@aBianca@bCette fille, là... elle dormait, heinⓡ\n@c0@"
  it: "@aBianca@bMa sta dormendo?\n@c0@"
  ja: "@a@bビアンカ「あの　おねえさん\n\tねてる……　よね？\n@c0@"
462:
  de: "@aNera@bWie nett von ihr, uns all das zu erzählen, und das, obwohl sie fest geschlafen hat!\n@c0@"
  en: "@aNera@bHow nice of her to take the trouble to tell us all that even though she was asleep!\n@c0@"
  es: "@aNera@b¡Qué amable, tomarse la molestia de contarnos tutto eso aun estando dormida!\n@c0@"
  fr: "@aNera@bC'est vraiment gentil de sa part de prendre la peine de nous dire tout ça même en dormant... Hi hi hiⓠ\n@c0@"
  it: "@aNera@bQuella ragazza dev'essere davvero innamorata del suo lavoro... Ha spiegato come comportarsi con i mostri nonostante stia dormendo!\n@c0@"
  ja: "@a@bフローラ「まあ！　おやすみのところ\n\tわざわざ　ごていねいに\n\tありがとうございました。\n@c0@"
463:
  de: "@aBianca@bDas klang nach einem Alptraum. Den hat er sich vermutlich redlich verdient, wenn seine Missetaten ihn jetzt im Schlaf heimsuchen.\n@c0@"
  en: "@aBianca@bSounds a bit traumatic. I s'pose that's what he deserves if he's done lots of bad stuff that's comin' back to haunt him.\n@c0@"
  es: "@aBianca@bParece más bien traumático. Aunque supongo que se lo merece: todo el mal que ha hecho se vuelve ahora contra él, ¿sabes?\n@c0@"
  fr: "@aBianca@bIl a l'air un peu traumatisé. Enfin, il a sans doute ce qu'il mérite si toutes les mauvaises actions qu'il a faites reviennent le hanter.\n@c0@"
  it: "@aBianca@bCredo che stia sognando qualcuna delle malefatte che ha compiuto durante la sua vita di criminale!\n@c0@"
  ja: "@a@bビアンカ「うなされてるわね……。\n\tとうぜんか…　悪いことばかり\n\tしてきたような顔してるもの。\n@c0@"
464:
  de: "@aNera@bIch weiß ja nicht genau, was er getan hat, aber es wäre wahrscheinlich nicht verkehrt, wenn er versuchen würde, das wiedergutzumachen.\n@c0@"
  en: "@aNera@bI don't know what he did wrong exactly, but it would be good if he could try to make amends.\n@c0@"
  es: "@aNera@bNo sé exactamente qué hizo de malo, ma no estaría mal que tratase de enmendarlo.\n@c0@"
  fr: "@aNera@bJe ne sais pas exactement ce qu'il a fait de mal,\r\nmais ça serait bien qu'il essaie de faire amende honorable.\n@c0@"
  it: "@aNera@bNon so di quali peccati si sia macchiato quell'uomo, ma la dea misericordiosa è sempre disposta a perdonare chi vuole tornare sulla retta via...\n@c0@"
  ja: "@a@bフローラ「何をしたのかは　知りませんが\n\t自分の罪を　ちゃんと\n\tつぐなえると　いいですわね。\n@c0@"
465:
  de: "@aBianca@bSchön! Komm, das probieren wir gleich mal aus.\n@c0@"
  en: "@aBianca@bNice! Let's go and check it out.\n@c0@"
  es: "@aBianca@b¡Genial! Vamos a probarla.\n@c0@"
  fr: "@aBianca@bSuperⓠ Allons voir à quoi ça ressemble.\n@c0@"
  it: "@aBianca@bChe bello! Oh, che emozione! Sono troppo felice!\nMa, ehm...\nCos'è esattamente il ⓕLibro delle Bestieⓖ, eh?\n@c0@"
  ja: "@a@bビアンカ「やったねっ！\n\tさっそく　見てみましょうよ。\n@c0@"
466:
  de: "@aNera@bWas es mit diesem Buch der Bestien wohl auf sich hat? Wie aufregend!\n@c0@"
  en: "@aNera@bI wonder what this Big Book of Beasts is all about. How exciting!\n@c0@"
  es: "@aNera@bMe pregunto para qué servirá ese Bestiario. ¡Qué emozionante!\n@c0@"
  fr: "@aNera@bJe me demande ce que c'est exactement que ce\nLivre des créatures. Comme c'est excitantⓠ\n@c0@"
  it: "@aNera@bNon vedo l'ora di poter sfogliare il ⓕLibro delle Bestieⓖ!\nDev'essere un testo interessantissimo!\n@c0@"
  ja: "@a@bフローラ「モンスターずかんって\n\tどんなことが　書かれているのかしら？\n\tわくわくしますわね。\n@c0@"
467:
  de: "@aBianca@bIch finde fünftausend Goldmünzen ganz schön teuer für einen komischen alten Vorhang.\n@c0@"
  en: "@aBianca@bYeah, five thousand gold coins seems like a bit of a fortune to spend on a funny old curtain.\n@c0@"
  es: "@aBianca@bCinco mil monedas de oro parece un fortunón por una cortina vieja, ¿sabes?\n@c0@"
  fr: "@aBianca@bMouais, 5000 pièces d'or, c'est un peu une fortune pour une espèce de bibelot bizarre.\n@c0@"
  it: "@aBianca@bSecondo me solo un pazzo potrebbe spendere cinquemila monete d'oro per una vecchia cintura!\n@c0@"
  ja: "@a@bビアンカ「そうよね。　あんな\n\tヘンなのれんに　５０００ゴールドは\n\t出したくないわよね。\n@c0@"
468:
  de: "@aNera@bOh! Willst du sie denn nicht kaufen? Aber sie ist so niedlich!\n@c0@"
  en: "@aNera@bOh! Aren't you going to buy it? But it's so sweet!\n@c0@"
  es: "@aNera@b¡Oh! ¿No lo vas a comprar? ¡Ma si es precioso!\n@c0@"
  fr: "@aNera@bOhⓠ Tu ne l'achètes pasⓡ Mais c'est tellement joliⓠ\n@c0@"
  it: "@aNera@bAllora non la compriamo?\nOh, mi dispiace...\nEra una cosina tanto carina!\n@c0@"
  ja: "@a@bフローラ「か　買わないんですか？\n\tあんなに　かわいい　のれんなのに……\n@c0@"
469:
  de: "@aNera@bOh, tut mir leid! Wenn du dich schon entschieden hast, dann will ich dich nicht von deinem Entschluss abbringen.\n@c0@"
  en: "@aNera@bSorry. If you've made up your mind, then I won't try to change it.\n@c0@"
  es: "@aNera@bScusi. Si ya has tomado la tua dezisione, no voy a intentar cambiarla.\n@c0@"
  fr: "@aNera@bPardon. Si tu as déjà fait ton choix, je ne veux pas te faire changer d'avis.\n@c0@"
  it: "@aNera@bScusami, non volevo farti cambiare idea.\nÈ solo che trovo quell'oggetto davvero delizioso...\n@c0@"
  ja: "@a@bフローラ「でも　あなたが\n\tそう言うなら　私　ガマンしますわ。\n@c0@"
470:
  de: "@aBianca@bWolltest du diesen komischen alten Vorhang wirklich haben, %a000090? Sieht mir nicht ganz nach deinem Geschmack aus.\n@c0@"
  en: "@aBianca@bDid you really want this funny old curtain, %a000090? It dun't much look like your kind\nof thing.\n@c0@"
  es: "@aBianca@b¿De verdad querías esa cortina vieja, %a000090? No es muy de tu estilo, ¿sabes?\n@c0@"
  fr: "@aBianca@bTu voulais vraiment acheter ce drôle de rideau, %a000090ⓡ Ça n'a pourtant pas l'air d'être trop ton genre d'objet.\n@c0@"
  it: "@aBianca@bMa davvero ti piace quest'affare, %a000090?\nNon credevo che t'interessassero oggetti del genere!\n@c0@"
  ja: "@a@bビアンカ「%a000090ったら……\n\tこんな　ヘンなのれん\n\t本当に　欲しかったの？\n@c0@"
471:
  de: "@aNera@bJuchhu! Jetzt bin ich aber froh! So was wollte ich schon immer mal haben! Es ist so hübsch!\n@c0@"
  en: "@aNera@bYippee! I'm so happy! This is just what I wanted!\r\nIt's so pretty!\n@c0@"
  es: "@aNera@b¡Yupiii! ¡Qué felice soy! ¡Es justo lo que quería!\r\n¡Es precioso!\n@c0@"
  fr: "@aNera@bYoupiⓠ Je suis si contenteⓠ C'est exactement ce que je voulaisⓠ C'est tellement mignonⓠ\n@c0@"
  it: "@aNera@bEvviva!\nQuesta cintura degli Slime è favolosa! Me ne sono innamorata non appena l'ho vista!\n\n@c0@"
  ja: "@a@bフローラ「きゃ～！　うれしいですわ！\n\tとうとう！　とうとうっ！\n\tこののれんが私の手に！　きゃ～っ！！\n@c0@"
472:
  de: "@aBianca@bHm. Als frisch verheiratetes Paar ist man anscheinend ständig knapp bei Kasse.\n@c0@"
  en: "@aBianca@bHuh. There just dun't seem to be enough money for all the stuff you need when you first get married.\n@c0@"
  es: "@aBianca@bVaya. Parece que nunca hay dinero suficiente para todo lo que se necesita cuando se casa uno, ¿sabes?\n@c0@"
  fr: "@aBianca@bHum. On dirait qu'il n'y a jamais assez d'argent pour acheter tout ce qu'on veut, quand on vient de se marier.\n@c0@"
  it: "@aBianca@bUna coppia appena sposata deve prima comprare le cose davvero necessarie, e poi può pensare di concedersi qualche sfizio. Io, almeno, la penso così.\n@c0@"
  ja: "@a@bビアンカ「ううっ……　新婚って\n\t物いりだから　お金がないのよね。\n@c0@"
473:
  de: "@aNera@bDa kann man nichts machen. Dann kommen wir eben wieder, wenn wir etwas gespart haben.\n@c0@"
  en: "@aNera@bOh well. I suppose we'll just have to come back again when we've saved up.\n@c0@"
  es: "@aNera@b¡Oh!, vaya. Supongo que tendremos que volver cuando hayamos ahorrado un po'.\n@c0@"
  fr: "@aNera@bTant pis. Nous n'aurons qu'à revenir une fois que nous aurons suffisamment économisé.\n@c0@"
  it: "@aNera@bNon importa.\nCompreremo quell'oggetto quando avremo messo da parte un po' di soldi.\n@c0@"
  ja: "@a@bフローラ「しかたありませんわ……。\n\tお金をつくったら　また来ましょう。\n@c0@"
474:
  de: "@aBianca@bEr hat wirklich ein paar ganz schön komische Sachen auf Lager, was? Sein Geschäft scheint aber recht ordentlich zu laufen.\n@c0@"
  en: "@aBianca@bHe certainly stocks some pretty curious items,\r\neh? Seems to be doin' a fairly decent business\r\nout of it, mind.\n@c0@"
  es: "@aBianca@bDesde luego, algunos de los objetos que tiene son de lo más curioso, ¿eh? Y parece que el negocio va viento en popa.\n@c0@"
  fr: "@aBianca@bÇa, on peut dire qu'il a quelques objets plutôt curieux en réserve, heinⓡ Mais il a quand même\nl'air de bien s'en sortir.\n@c0@"
  it: "@aBianca@bA occhio e croce direi che gli affari gli vanno bene... Non credevo ci fossero tante persone interessate a oggetti così bizzarri e costosi.\n@c0@"
  ja: "@a@bビアンカ「ふ～ん…　本当に\n\tめずらしいものしか　扱わないのね。\n\tそれで　商売になるのかしら？\n@c0@"
475:
  de: "@aNera@bIch kann's kaum erwarten zu sehen, was er sonst noch an herrlich merkwürdigen Sachen auftreibt!\n@c0@"
  en: "@aNera@bI can't wait to see what the next weird and wonderful item he has in stock will be!\n@c0@"
  es: "@aNera@b¡Me muero de ganas de ver qué otros oggetti extraños y maravillosos tiene guardados!\n@c0@"
  fr: "@aNera@bJ'ai hâte de voir quel sera le prochain objet bizarre et merveilleux qu'il aura en réserveⓠ\n@c0@"
  it: "@aNera@bNon vedo l'ora di scoprire quali saranno i prossimi oggetti che gli arriveranno in negozio!\n@c0@"
  ja: "@a@bフローラ「次は　どんなめずらしい物が\n\t見られるか　楽しみですわね。\n@c0@"
476:
  de: "@aBianca@bDu bist ja anscheinend ganz wild auf ein kleines Spielchen im Kasino, was? Na warte, wenn ich das Nera erzähle!\n@c0@"
  en: "@aBianca@bLooks like you're intent on a bit of a flutter at the casino, eh? I'll tell Nera about you!\n@c0@"
  es: "@aBianca@bAsí que tienes ganas de darte una vuelta por el casino, ¿eh? ¡Me pienso chivar a Nera!\n@c0@"
  fr: "@aBianca@bOn dirait que tu as l'intention d'aller parier un peu\nau casino, heinⓡ Je dirai tout à Neraⓠ\n@c0@"
  it: "@aBianca@bTe la stai spassando al casinò, eh?!\nChissà cosa direbbe Nera se venisse a saperlo...\n@c0@"
  ja: "@a@bビアンカ「%a000090ったら\n\t本気で　カジノで遊ぶつもりなのね。\n\tフローラさんに　言いつけちゃうわよ。\n@c0@"
477:
  de: "@aBianca@bMan weiß kaum, womit man anfangen soll, bei einer solchen Auswahl an Spielen, was?\n@c0@"
  en: "@aBianca@bIt's hard to know where to start when there's so many different games to choose from, eh?\n@c0@"
  es: "@aBianca@bEs difícil decidir por dónde empezar con tantos juegos entre los que elegir, ¿verdad?\n@c0@"
  fr: "@aBianca@bDifficile de savoir par quoi commencer quand il y a autant de jeux différents, nonⓡ\n@c0@"
  it: "@aBianca@bAccidenti, quanti giochi!\nC'è solo l'imbarazzo della scelta!\n@c0@"
  ja: "@a@bビアンカ「これだけ　たくさんあると\n\tなにから遊べばいいか　迷うわね。\n@c0@"
478:
  de: "@aNera@bVergiss nicht, dass ein Kasino nur dazu da ist, ein bisschen Dampf abzulassen. Du darfst dich nicht zu sehr hinreißen lassen.\n@c0@"
  en: "@aNera@bDon't forget that a casino is just a place to let off a little steam. You mustn't get too carried away.\n@c0@"
  es: "@aNera@bNo te olvides de que un casino es solo un sitio para relajarse un po'. No debes dejarte llevar.\n@c0@"
  fr: "@aNera@bN'oublie pas qu'un casino est seulement un endroit\r\noù évacuer un peu la pression. Tu ne dois pas te laisser emporter.\n@c0@"
  it: "@aNera@bNon dimenticare che il casinò è solo un posto per rilassarsi e divertirsi! Cerca di non farti prendere la mano dal gioco, tesoro...\n@c0@"
  ja: "@a@bフローラ「あなた　カジノは\n\tあくまでも　息ぬきですからね。\n\tあまり　熱中しすぎないでくださいね。\n@c0@"
479:
  de: "@aBianca@bEs ist schade, dass man nicht reich wird, wenn man im Kasino gewinnt, aber so ist es eben.\n@c0@"
  en: "@aBianca@bIt's a shame you dun't get rich when you win at the casino, but I s'pose that's just the way of it.\n@c0@"
  es: "@aBianca@bEs una lástima que cuando ganes en el casino no te hagas rico, pero, en fin, así son las cosas, ¿sabes?\n@c0@"
  fr: "@aBianca@bDommage qu'on ne puisse pas devenir riche en gagnant au casino, mais j'imagine que c'est la règle du jeu.\n@c0@"
  it: "@aBianca@bPeccato che non sia permesso cambiare i gettoni in monete... Beh, almeno così non si ha la tentazione di sfidare la sorte al gioco per diventare ricchi.\n@c0@"
  ja: "@a@bビアンカ「カジノで勝っても\n\tお金が増えるってわけじゃないのね。\n\tざんねんだわ。\n@c0@"
480:
  de: "@aNera@bManche Leute werden trotzdem süchtig danach. Stell dir nur vor, wie es erst wäre, wenn man hier tatsächlich Geld gewinnen könnte!\n@c0@"
  en: "@aNera@bSome people get hooked despite that. Imagine what it would be like if you could actually win money here!\n@c0@"
  es: "@aNera@bHay personas que se enganchan igualmente. ¡Imagínate cómo sería si además pudieses ganare dinero aquí!\n@c0@"
  fr: "@aNera@bMalgré ces règles, certaines personnes ne savent plus s'arrêter. Tu imagines un peu si c'était effectivement possible de gagner de l'argent iciⓠ\n@c0@"
  it: "@aNera@bL'impossibilità di cambiare i gettoni in denaro non impedisce a molte persone di contrarre il vizio del gioco... Mi spiace moltissimo per loro...\n@c0@"
  ja: "@a@bフローラ「今でさえ　熱中しすぎる人が\n\tいるのに…　お金にかえられたら\n\tもう　大変なことになりそうですわ。\n@c0@"
481:
  de: "@aBianca@bWir führen uns beim Spielen wahrscheinlich ganz genauso auf. Wie peinlich!\n@c0@"
  en: "@aBianca@bWe probably act like that when we get caught up in gamblin'. How embarrassin'!\n@c0@"
  es: "@aBianca@bCuando nos viciamos jugando seguro que hacemos lo mismo. ¡Qué vergüenza!\n@c0@"
  fr: "@aBianca@bOn doit sûrement être comme lui quand on est surpris en train de jouer. C'est plutôt gênantⓠ\n@c0@"
  it: "@aBianca@bDiamine, che entusiasmo!\n@c0@"
  ja: "@a@bビアンカ「私たちも　ギャンブルしてるとき\n\tはたから見ると　あんな感じなのかな。\n\t……ちょっと　はずかしいね。\n@c0@"
482:
  de: "@aNera@bEr kommt mir übermäßig aufgedreht vor. Vielleicht hat er noch nie vorher gewonnen.\n@c0@"
  en: "@aNera@bHe seems to be a bit over-excited. Maybe he's never had a win before.\n@c0@"
  es: "@aNera@bSembra que la sua reazione es un poco excesiva. A lo mejor no había ganado nunca.\n@c0@"
  fr: "@aNera@bIl a l'air un peu surexcité. C'est peut-être la première fois qu'il gagne, remarque.\n@c0@"
  it: "@aNera@bSenti come strilla!\nSecondo lo sentiranno fino a Mostroferrato...\n@c0@"
  ja: "@a@bフローラ「あの方　あんなに\n\tこうふんなさって……\n\t今まで　勝ったことないのかしら？\n@c0@"
483:
  de: "@aBianca@bAn den Hundert-Jeton-Automaten kann man schnell sehr viel Geld verlieren, darum muss man da wirklich aufpassen.\n@c0@"
  en: "@aBianca@bYou can lose a lot of money fast in the hundred-token slots, so you really have to go careful.\n@c0@"
  es: "@aBianca@bEn las tragaperras de cien fichas se puede perder mucho dinero en muy poco tiempo, hay que andarse con ojo, ¿sabes?\n@c0@"
  fr: "@aBianca@bOn peut vite perdre beaucoup d'argent dans les machines à cent jetons, alors il faut faire attention.\n@c0@"
  it: "@aBianca@bSembrerebbe che le slot machine da cento gettoni siano un modo veloce e sicuro per perdere...\r\nIh ih ih!\n@c0@"
  ja: "@a@bビアンカ「１００コイン　スロットは\n\tコインがなくなるのも　早いから\n\tしんちょうに　いかないとね。\n@c0@"
484:
  de: "@aNera@bPapa hat immer nur an den Hundert-Jeton-Automaten gespielt. Wenn ich jetzt so darüber nachdenke, kommt mir das sehr leichtsinnig vor.\n@c0@"
  en: "@aNera@bPapa only ever played on the hundred-token slot machines. It seems rather frivolous when I think of it now.\n@c0@"
  es: "@aNera@bIl mio papino solo jugaba en las máquinas de cien fichas. Ahora que lo pienso, era bastante frívolo per la sua parte.\n@c0@"
  fr: "@aNera@bPapa ne jouait que sur les machines à cent jetons. Quand j'y repense aujourd'hui, ça me paraît un peu superficiel.\n@c0@"
  it: "@aNera@bMio padre sostiene che solo la slot machine da cento gettoni dà il brivido dell'azzardo ai veri giocatori.\nDice che con le altre non ci si diverte abbastanza...\n@c0@"
  ja: "@a@bフローラ「父といるときは　１００コインの\n\tスロットばかりでしたが…　今思うと\n\tもったいないこと　してましたわね。\n@c0@"
485:
  de: "@aBianca@bMeine Mutter hat immer gesagt, dass jeder Beruf auch seine Arbeitsbienen braucht. Ohne sie fällt das Ganze auseinander.\n@c0@"
  en: "@aBianca@bMum always said that every profession needs its underlings. Without them, the whole thing falls apart.\n@c0@"
  es: "@aBianca@bMi madre siempre decía que en todas las profesiones tiene que haber subordinados. Sin ellos, la cosa se viene abajo, ¿sabes?\n@c0@"
  fr: "@aBianca@bMaman disait toujours que chaque métier\r\navait besoin de petites mains. Sans elles,\r\ntout s'écroulerait.\n@c0@"
  it: "@aBianca@bMi sembra un'aspirazione più che legittima...\n@c0@"
  ja: "@a@bビアンカ「どんな仕事も\n\t下づみが　大事だって\n\t母さんが　よく言ってたっけ……。\n@c0@"
486:
  de: "@aNera@bIch hoffe, sein Traum wird eines Tages Wirklichkeit.\n@c0@"
  en: "@aNera@bI hope he has his dream come true some day.\n@c0@"
  es: "@aNera@bEspero que pueda hacer realità il suo sogno algún día.\n@c0@"
  fr: "@aNera@bJ'espère que son rêve se réalisera un jour.\n@c0@"
  it: "@aNera@bIn effetti, sarebbe alquanto disdicevole se si cambiasse d'abito davanti al pubblico...\n@c0@"
  ja: "@a@bフローラ「いつか　夢がかなうと\n\tいいですわね。\n@c0@"
487:
  de: "@aBianca@bTypisch alter Mann, was? Glaubt, er weiß alles übers Leben, bloß weil seins schon so lange dauert!\n@c0@"
  en: "@aBianca@bTypical old bloke, eh? Thinks he knows all there is to know about life just because his has bin a long one!\n@c0@"
  es: "@aBianca@b¡Bah, es uno de esos viejales! ¡Cree que lo sabe todo de la vida solo porque ha estado mucho tiempo vivo!\n@c0@"
  fr: "@aBianca@bC'est typique ça, nonⓡ Il croit tout savoir de la vie juste parce que la sienne a été longueⓠ\n@c0@"
  it: "@aBianca@bMa senti tu che razza di ragionamento!\n@c0@"
  ja: "@a@bビアンカ「さすが　おじいさんね。\n\t長生きしてるだけあって\n\tまさに　人生の達人って感じだわ。\n@c0@"
488:
  de: "@aNera@bWie schade, wenn das das Einzige ist, was ihm Freude bereitet. Mir macht alles Spaß, wenn ich bei dir bin, %a000090.\n@c0@"
  en: "@aNera@bWhat a shame if that's the only way he can\nfind enjoyment. I enjoy everything when I'm\nwith you, %a000090.\n@c0@"
  es: "@aNera@bQué lástima, disfrutar de la vita sólo de esa forma. Yo disfruto de tutto cuando estoy contigo, %a000090.\n@c0@"
  fr: "@aNera@bC'est bien dommage qu'il n'ait trouvé que ça pour se divertir. Moi, je profite de tout quand je suis avec toi, %a000090.\n@c0@"
  it: "@aNera@bNon penso che la cosa più importante sia essere vivi, ma trascorrere la propria vita accanto alla persona amata. Spero che la pensi come me, %a000090.\n@c0@"
  ja: "@a@bフローラ「それだけが　楽しみなんて…\n\t私は　%a000090さんと旅してから\n\t楽しいことだらけですわ。\n@c0@"
489:
  de: "@aBianca@bWenn sich der legendäre Held nicht bald mal zeigt, sitzen wir in der Klemme. Davon hängt schließlich nicht zuletzt das Leben deiner Mutter ab.\n@c0@"
  en: "@aBianca@bIf the legendary hero dun't show up sometime, we'll all be in trouble. Your mum's life depends on it, for one thing.\n@c0@"
  es: "@aBianca@bSi el héroe legendario no aparece, vamos a tener problemas. Por ejemplo, la vida de tu madre depende de ello, ¿sabes?\n@c0@"
  fr: "@aBianca@bSi le héros légendaire ne se montre pas à un moment ou à un autre, nous aurons tous des ennuis. Et la vie de ta mère en dépend, qui plus est.\n@c0@"
  it: "@aBianca@bSpero che l'Eroe Leggendario arrivi presto tra noi.\nLe sorti del mondo e la vita di tua madre dipendono anche da lui...\n@c0@"
  ja: "@a@bビアンカ「伝説の勇者には　何としても\n\t出現してもらわないと　困るわね。\n\tお母様の命が　かかってるわけだし。\n@c0@"
490:
  de: "@aNera@bGlaubst du, der legendäre Held wird auf einmal aus dem Nichts auftauchen?\n@c0@"
  en: "@aNera@bDo you think the legendary hero will just suddenly pop up out of nowhere?\n@c0@"
  es: "@aNera@b¿Crees que el héroe legendario aparecerá así all'improvviso?\n@c0@"
  fr: "@aNera@bTu crois que le héros légendaire va juste apparaître comme ça, d'un seul coupⓡ\n@c0@"
  it: "@aNera@bCredi che l'Eroe Leggendario spunterà fuori da un momento all'altro, come un fungo dopo un temporale?\n@c0@"
  ja: "@a@bフローラ「勇者さまって\n\t何もないところから　とつぜん\n\t現われるような　存在なのかしら？\n@c0@"
491:
  de: "@aNera@bOder glaubst du, er wird in eine ganz normale Familie hineingeboren und eines Tages wird ihm sein Schicksal plötzlich bewusst?\n@c0@"
  en: "@aNera@bOr do you think he'll be born as someone's child and then realise his destiny one day?\n@c0@"
  es: "@aNera@b¿O crees que será el hijo de alguien y nacerá y un día se dará cuenta de cuál es il suo destino?\n@c0@"
  fr: "@aNera@bOu bien est-ce qu'il est l'enfant de quelqu'un et\nqu'il va un jour réaliser quelle est sa destinéeⓡ\n@c0@"
  it: "@aNera@bO forse è già tra noi e aspetta solo il momento più opportuno per entrare in scena?\n@c0@"
  ja: "@a@bフローラ「そうでないとしたら\n\t人間の子として　ふつうに生まれ\n\tある日　目覚めるとか…　う～ん……。\n@c0@"
492:
  de: "@aBianca@bSie sind alle so gute Tänzer. Es macht richtig Spaß, dabei zuzusehen!\n@c0@"
  en: "@aBianca@bThey all dance so well. It's quite a show!\n@c0@"
  es: "@aBianca@b¡Qué bien bailan todas! ¡Qué espléndido espectáculo!\n@c0@"
  fr: "@aBianca@bElles dansent toutes tellement bien.\nC'est un sacré spectacleⓠ\n@c0@"
  it: "@aBianca@bCerto che si muovono proprio bene, non è vero?\n@c0@"
  ja: "@a@bビアンカ「本当……\n\tみんな　かろやかに舞って　ステキね。\n@c0@"
493:
  de: "@aNera@bIch wundere mich ja, dass ihre Kostüme ihnen nicht vom Leibe fallen, wenn sie so wild tanzen!\n@c0@"
  en: "@aNera@bI'm surprised their costumes don't fall down with all that dancing about!\n@c0@"
  es: "@aNera@b¡Me extraña que sus vestidos no se caigan con tanto danzare!\n@c0@"
  fr: "@aNera@bJe suis surprise qu'elles ne perdent pas leur costume en dansant comme çaⓠ\n@c0@"
  it: "@aNera@bChe begli abiti di scena! Sono davvero carini.\nMi piacerebbe farmi cucire qualcosa dal loro costumista...\n@c0@"
  ja: "@a@bフローラ「あんなに　はげしく踊って…\n\t衣装は　ずれないのかしら？\n@c0@"
494:
  de: "@aBianca@bIch glaube nicht, dass ich das Lied kenne, aber irgendwie kommt es mir bekannt vor.\n@c0@"
  en: "@aBianca@bI dun't think I know this song specifically, but it somehow sounds familiar.\n@c0@"
  es: "@aBianca@bNo creo que conozca esta canción, pero hay algo en ella que me resulta familiar, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe ne crois pas connaître cette chanson,\r\npourtant elle me semble familière.\n@c0@"
  it: "@aBianca@bUhm, la melodia non è male, ma il testo non mi pare molto originale.\n@c0@"
  ja: "@a@bビアンカ「知らない歌だけど\n\tどこか　なつかしい感じのする歌よね。\n@c0@"
495:
  de: "@aNera@bLa la la Ⓠ\n%0%a000090, ich brauch' dich,\nich lieb' dich doch sooo!\n@c0@"
  en: "@aNera@bLa la la Ⓠ\nPlease, %a000090, ooh,\nI need you!\n@c0@"
  es: "@aNera@bLa, la, la Ⓠ\n¡Por favor, %a000090, oooh,\nte necesito!\n@c0@"
  fr: "@aNera@b*ⓢ La la la, %a000090 Ⓠ,\nS'il te plaaaaît, \nMon bébaaaai.\n@c0@"
  it: "@aNera@b*: La la la... %0%a000090 Ⓠ,\nVoglio baci e carezzeeeh...\nVoglio il tuo sorrisoooh... Ⓡ Eh eh eh!\n@c0@"
  ja: "@a@bフローラ「ララララ～♪\n\tプリーズ　プリーズ　アイ　ニード\n\t%a000090さん　ですわ♪　ぽっ……。\n@c0@"
496:
  de: "@aBianca@bDu findest den Auftritt ziemlich klasse, was, %a000090? Du hast ja schon ganz glasige Augen!\n@c0@"
  en: "@aBianca@bLooks like you think it's pretty classy, eh, %a000090? I can tell by that glazed look in your eyes!\n@c0@"
  es: "@aBianca@bTe parece bastante picante, ¿eh, %a000090? ¡Se te nota por esa mirada perdida!\n@c0@"
  fr: "@aBianca@bTu as effectivement l'air de trouver qu'elle danse bien, hein, %a000090ⓡ Ça se voit, tu as les yeux qui brillentⓠ\n@c0@"
  it: "@aBianca@bA giudicare dal tuo sguardo ebete, direi che trovi il suo modo di ballare fin troppo sensuale, %a000090!\n@c0@"
  ja: "@a@bビアンカ「%a000090も\n\t色っぽいと　思ってるみたいね。\n\t顔を見れば　わかるわよ。\n@c0@"
497:
  de: "@aNera@bLiebling, würde es dir was ausmachen, wenn wir anderswohin gehen würden? Ich halte mich nicht so gern hier auf der Bühne auf.\n@c0@"
  en: "@aNera@bDarling, do you mind if we go elsewhere? I'm not too keen on being here on the stage.\n@c0@"
  es: "@aNera@bCaro mio, ¿te importa que vayamos a otro sitio? No me piace demasiado estar aquí en el escenario.\n@c0@"
  fr: "@aNera@bMon chéri, ça t'ennuierait qu'on aille ailleursⓡ\nJe n'aime pas trop être ici, sur la scène.\n@c0@"
  it: "@aNera@b%0%a000090, ti spiacerebbe distogliere lo sguardo dalle procaci rotondità di questa gentile signorina?\nGrazie, tesoro.\n@c0@"
  ja: "@a@bフローラ「ねえ　あなた。\n\tはやく　あっちへ行きましょう。\n\tステージの上には　いたくないわ。\n@c0@"
498:
  de: "@aBianca@bVon der lass' ich mich bestimmt nicht ausstechen!\nDa-da-daa, Da-da-da-daaa... Ⓠ\n@c0@"
  en: "@aBianca@bI en't lettin' her get the better of me!\nDa-da-daa, Da-da-da-daaa... Ⓠ\n@c0@"
  es: "@aBianca@b¡Se va a enterar esa de quién soy yo!\nDa-da-daa, da-da-da-daaa... Ⓠ\n@c0@"
  fr: "@aBianca@bPas question qu'elle prenne le dessusⓠ\nLa-la-laa, la-la-la-laaa... Ⓠ\n@c0@"
  it: "@aBianca@bAh, quella tipa non balla certo meglio di me!\nDa-da-daa, Da-da-da-daaa Ⓠ\nAllora? Che ne dici?\n@c0@"
  ja: "@a@bビアンカ「私だって　負けないわよ。\n\tシャン　シャン　シャン♪\n@c0@"
499:
  de: "@aNera@bHör doch auf, %a000090! Mir wird ganz anders, wenn ich mitansehen muss, wie du auf ihren wackelnden Bauchnabel starrst!\n@c0@"
  en: "@aNera@bStop it, %a000090! It's making me feel funny seeing you watch her tummy button wiggling around like that!\n@c0@"
  es: "@aNera@b¡Basta, %a000090! ¡No me gusta ver cómo la miras contonear la tripita così!\n@c0@"
  fr: "@aNera@bMais arrête, %a000090ⓠ Ça me fait tout drôle de te voir fixer son nombril qui bouge dans tous les sens comme çaⓠ\n@c0@"
  it: "@aNera@bAdesso basta, %a000090!\nSe la guardi ancora un po', la consumerai, quella povera ragazza!\n@c0@"
  ja: "@a@bフローラ「やめて　%a000090さん。\n\tだらしない顔で　踊り娘さんの\n\tおヘソのあたりを　見つめないで！\n@c0@"
500:
  de: "@aBianca@bTja, es kann ja nicht schaden, sich gelegentlich mal ein bisschen zu amüsieren, oder?\n@c0@"
  en: "@aBianca@bYeah, well, it can't hurt to let go and have a bit of fun every once in a while, eh?\n@c0@"
  es: "@aBianca@bBueno, no pasa nada por soltarse el pelo y divertirse un poco de vez en cuando, ¿no?\n@c0@"
  fr: "@aBianca@bBon, c'est vrai, ça ne fait pas de mal de se laisser aller et de s'amuser un peu de temps en temps, nonⓡ\n@c0@"
  it: "@aBianca@bMa sì! Scateniamoci!\nUn po' di sano divertimento è proprio quello che ci vuole per ricaricare le batterie!\n@c0@"
  ja: "@a@bビアンカ「まっ　たまには\n\tなにも考えないで　楽しくやるのも\n\tいいわよね。\n@c0@"
501:
  de: "@aNera@bHe he he! Du bist richtig gut!\n@c0@"
  en: "@aNera@bHe he he! You are rather good.\n@c0@"
  es: "@aNera@b¡Ji, ji, ji! Lo haces bastante bene.\n@c0@"
  fr: "@aNera@bHi hi hiⓠ Tu es plutôt doué.\n@c0@"
  it: "@aNera@bÈ vero!\nSei proprio bravo, sai?\n@c0@"
  ja: "@a@bフローラ「うふふ。\n\tあなた　お上手ですわ。\n@c0@"
502:
  de: "@aBianca@bNördlich von hier? Ob er wohl die Geisterzinnen meint? Das lag ja sehr abgelegen.\n@c0@"
  en: "@aBianca@bUp north? I wonder if he's talkin' about Uptaten Towers. That was a lonely old place.\n@c0@"
  es: "@aBianca@b¿Hacia el norte? Me pregunto si se referirá a las Torres Alverres. Qué sitio mas triste y solitario, ¿sabes?\n@c0@"
  fr: "@aBianca@bAu nordⓡ Je me demande s'il parle des tours Karpatt. C'était un endroit vraiment désolé.\n@c0@"
  it: "@aBianca@bIl castello a nord?\nForse si riferisce al Palazzo delle Ombre...\n@c0@"
  ja: "@a@bビアンカ「北っていうと\n\tレヌール城のことかしら？\n\tかわいそうな　お城だったわよね。\n@c0@"
503:
  de: "@aNera@bDu bist bestimmt viel weiter herumgekommen als er.\n@c0@"
  en: "@aNera@bYou've probably travelled around an awful lot more than he has.\n@c0@"
  es: "@aNera@bSicuro que tú has viajado muchísimo más que él.\n@c0@"
  fr: "@aNera@bTu as sans doute voyagé bien plus que lui.\n@c0@"
  it: "@aNera@bⓕSono tempi pericolosi, questiⓖ...\nAh ah ah! Questa ci giunge nuova, eh? Sappiamo fin troppo bene in che situazione ci troviamo...\n\n@c0@"
  ja: "@a@bフローラ「でも　あの方より\n\tあなたのほうが　ずっと\n\t旅なれているんじゃないかしら。\n@c0@"
504:
  de: "@aNera@bIch will damit nicht sagen, dass wir nicht vorsichtig sein sollen. Ich finde nur, wir sollten uns nicht gleich ins Bockshorn jagen lassen.\n@c0@"
  en: "@aNera@bI'm not saying that means we don't need to be careful. I just don't think we should worry too\r\nmuch, that's all.\n@c0@"
  es: "@aNera@bNo quiero decire que no debamos tener cuidado. Ma non credo que debamos preocuparnos demasiado.\n@c0@"
  fr: "@aNera@bÇa ne veut pas dire qu'il ne faut pas être prudents. C'est juste qu'il ne faut pas s'inquiéter inutilement, voilà tout.\n@c0@"
  it: "@aNera@bComunque, è stato gentile a metterci in guardia, non trovi?\n@c0@"
  ja: "@a@bフローラ「だからといって　ゆだんは\n\tしませんけど　不安はありませんの。\n@c0@"
505:
  de: "@aBianca@bWieso sind wir hier, %a000090? Haben wir nicht noch anderswo zu tun?\n@c0@"
  en: "@aBianca@bWhat have we come here for, %a000090? En't we got things to be doin' elsewhere?\n@c0@"
  es: "@aBianca@b¿Para qué hemos venido aquí, %a000090? Tenemos cosas que hacer en otra parte, ¿no?\n@c0@"
  fr: "@aBianca@bQue sommes-nous venus faire ici exactement, %a000090ⓡ Nous n'avons pas d'autres chats à fouetter ailleursⓡ\n@c0@"
  it: "@aBianca@bPerché siamo venuti qui, %a000090?\nCredevo che avessimo da fare altrove...\n@c0@"
  ja: "@a@bビアンカ「%a000090ったら\n\tこんなところに　どんな用があるのよ。\n\tもっと大切な用が　あるんじゃないの？\n@c0@"
506:
  de: "@aBianca@bHier ist ja wirklich gar nichts los! Da lobe ich mir doch das gute alte Utensiel!\n@c0@"
  en: "@aBianca@bThis place is dull as ditchwater!\r\nNot like good old Stockenbarrel.\n@c0@"
  es: "@aBianca@b¡Esto es una balsa de aceite!\r\nNo es como Clavis.\n@c0@"
  fr: "@aBianca@bCet endroit est déprimantⓠ Rien à voir avec ce bon vieux village de Saint Éloi.\n@c0@"
  it: "@aBianca@bChe barba, questo posto!\nAd Aprianuam c'è molta più vita!\n@c0@"
  ja: "@a@bビアンカ「それにしても\n\tずいぶん　活気のない村ね。\n\t山奥の村とは　大ちがいだわ。\n@c0@"
507:
  de: "@aNera@bOh je. Die Felder sind ja in einem furchtbaren Zustand. Was kann da nur passiert sein?\n@c0@"
  en: "@aNera@bOh dear. What a terrible state the fields are in here. I wonder what happened.\n@c0@"
  es: "@aNera@b¡Oh, cielos! Los campos están en un estado lamentabile aquí. Me pregunto qué habrá sucedido.\n@c0@"
  fr: "@aNera@bOh, par la Déesse. Les champs sont dans un état lamentable. Je me demande ce qui s'est passé.\n@c0@"
  it: "@aNera@bSanta dea!\nGuarda in che condizioni sono i campi!\nCosa sarà successo?\n@c0@"
  ja: "@a@bフローラ「%a000090さん　見てください。\n\t畑が　あんなに　あらされて……。\n\tなにか　あったのかしら？\n@c0@"
508:
  de: "@aBianca@bIch kann es nicht leiden, wenn die Leute so unfreundlich zu Fremden sind.\n@c0@"
  en: "@aBianca@bI hate it when people are unfriendly to outsiders\r\nlike that.\n@c0@"
  es: "@aBianca@bOdio a la gente que trata mal a los forasteros, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe déteste quand les gens sont désagréables\r\ncomme ça avec les étrangers.\n@c0@"
  it: "@aBianca@bNon capisco che motivo ci sia di essere tanto sgarbati!\n@c0@"
  ja: "@a@bビアンカ「よそ者って…\n\tなんだか　イヤな言い方ね。\n@c0@"
509:
  de: "@aNera@bEs muss eine wichtige Konferenz für sie sein, wenn sie dafür eine Wache abstellen.\n@c0@"
  en: "@aNera@bIt must be an important conference for them to have someone standing on guard like that.\n@c0@"
  es: "@aNera@bDebe de ser una conferenza importante para tener un guardia así.\n@c0@"
  fr: "@aNera@bÇa doit être une réunion très importante pour eux s'ils ont placé quelqu'un pour monter la garde.\n@c0@"
  it: "@aNera@bDevono essere faccende davvero molto importanti, se hanno messo addirittura una persona di guardia...\n@c0@"
  ja: "@a@bフローラ「見張りまで　立てるなんて\n\tよほど　大事な会議なのですわね。\n@c0@"
510:
  de: "@aBianca@bVor Hunger nicht mehr kreuchen, äh, kriechen? Um das Dorf steht's offenbar noch schlimmer, als man auf den ersten Blick erkennen kann.\n@c0@"
  en: "@aBianca@bDie of starvation!?\r\nThings are worse here than they look.\n@c0@"
  es: "@aBianca@b¡¿Morirse de hambre?¡\r\nLas cosas están peor de lo que parece, ¿sabes?\n@c0@"
  fr: "@aBianca@bMourir à cause de la famineⓡⓐ\nLes choses sont encore pires qu'elles n'en ont l'air.\n@c0@"
  it: "@aBianca@bMorire di fame?\nAccidenti! Non credevo che fossero ridotti tanto male...\n@c0@"
  ja: "@a@bビアンカ「うえ死にだなんて……！\n\tずいぶん　せっぱつまっているみたい。\n@c0@"
511:
  de: "@aNera@bEs ist hart genug, die Felder zu bestellen, ohne dass sie auch noch geplündert werden.\n@c0@"
  en: "@aNera@bIt's hard enough work as it is trying to grow crops, without having to put up with them being ransacked like that.\n@c0@"
  es: "@aNera@bSacar adelante una cosecha ya es un lavoro molto duro para además tener que soportar que la saqueen.\n@c0@"
  fr: "@aNera@bEssayer de faire pousser des cultures est déjà assez difficile comme ça. S'il faut en plus\r\nles voir ravagées...\n@c0@"
  it: "@aNera@bHo il massimo rispetto per i contadini.\nIl loro è un lavoro molto duro.\n@c0@"
  ja: "@a@bフローラ「作物を　育てるとは\n\t大変な作業ですのに　それを\n\tあんなに　あらされるなんて……。\n@c0@"
512:
  de: "@aNera@bIch habe früher im Stift Gemüse angebaut, darum verstehe ich sehr gut, wie zermürbend das sein muss.\n@c0@"
  en: "@aNera@bI used to grow vegetables when I was staying at the abbey, so I can understand just how soul-destroying it must be.\n@c0@"
  es: "@aNera@bCuando estaba en la abadía solía lavorare en el huerto, así que entiendo el dolor que se siente.\n@c0@"
  fr: "@aNera@bJe cultivais des légumes, quand j'étais à l'abbaye, alors je comprends à quel point ça peut être terrible.\n@c0@"
  it: "@aNera@bAll'abbazia curavo un piccolo orto, quindi so bene quanto impegno e quanta dedizione servono per ottenere un buon raccolto...\n@c0@"
  ja: "@a@bフローラ「私　修道院にいた頃は\n\t畑仕事もしていましたから…\n\tお気持ちは　よくわかりますわ。\n@c0@"
513:
  de: "@aBianca@bIn die Hügel? Ich glaube kaum, dass man dort viel zum Essen findet.\n@c0@"
  en: "@aBianca@bThe hills? I doubt he'd be able to find any food\r\nup there.\n@c0@"
  es: "@aBianca@b¿Las montañas? No creo que encuentre nada de comer allí arriba.\n@c0@"
  fr: "@aBianca@bDéguerpirⓡ Mais si elle part, où va-t-elle\ntrouver à se nourrirⓡ\n@c0@"
  it: "@aBianca@bSarebbe orribile se questa povera gente dovesse emigrare per sopravvivere... So bene quanto sia duro abbandonare i luoghi dove si è nati e cresciuti.\n@c0@"
  ja: "@a@bビアンカ「お山？\n\t山まで行って　食べられるものを\n\tさがそうと言うのかしら？\n@c0@"
514:
  de: "@aNera@bEs klingt, als wolle er aufgeben. Er will offenbar weggehen, damit die anderen Dorfbewohner sein Essen haben können.\n@c0@"
  en: "@aNera@bIt sounds like he's on the brink of giving up. He's probably thinking of leaving so that the other villagers can have his food.\n@c0@"
  es: "@aNera@bSembra que está a punto de rendirse. Debe de estar pensando en marcharse para que otros puedan quedarse con la sua comida.\n@c0@"
  fr: "@aNera@bElle semble sur le point de tout laisser tomber.\r\nElle doit sûrement envisager de partir afin que\r\nles autres villageois se partagent sa nourriture.\n@c0@"
  it: "@aNera@bEmigrare? E dove?\nQuesta è un'area molto fertile, e sarebbe un vero peccato se fossero costretti ad abbandonarla...\n@c0@"
  ja: "@a@bフローラ「まあ　あの方……。　自ら\n\t死をえらぼうとなさっているのですわ。\n\t自分の食べ物を　ほかへ回すために。\n@c0@"
515:
  de: "@aBianca@bAnscheinend verzichtet die alte Frau auf ihr Essen, um es ihrem Enkel geben zu können.\n@c0@"
  en: "@aBianca@bSounds like the old woman's passin' up on her food to feed the little one.\n@c0@"
  es: "@aBianca@bParece que la anciana está dejando de comer para alimentar al pequeño, ¿sabes?\n@c0@"
  fr: "@aBianca@bOn dirait que cette vieille femme se prive de nourriture pour l'offrir à son petit-fils.\n@c0@"
  it: "@aBianca@bLa nonna di quel bambino rinuncia al cibo pur di non farlo mancare a lui...\n@c0@"
  ja: "@a@bビアンカ「あの子のために\n\tおばあちゃんは　自分のごはんを\n\tわけてあげているのね……。\n@c0@"
516:
  de: "@aNera@bPapa würde bestimmt ein paar Lebensmittelpakete schicken, wenn ich ihn darum bitten würde. Aber das ist ja keine Dauerlösung.\n@c0@"
  en: "@aNera@bI'm sure Papa would send some food parcels if I asked him nicely. But I suppose that's not a\r\nlong-term solution.\n@c0@"
  es: "@aNera@bSicuro que, si se lo pido con amabilità, il mio papino enviará unos cuantos paquetes de comida. Aunque eso no es una solución a largo plazo, claro.\n@c0@"
  fr: "@aNera@bJe suis sûre que papa nous enverrait des colis alimentaires, si on le lui demandait gentiment.\r\nMais ce n'est pas une solution à long terme.\n@c0@"
  it: "@aNera@bPotrei chiedere a mio padre di inviare del cibo a questi poveretti, ma sarebbe solo una soluzione temporanea. Il problema va risolto alla radice.\n@c0@"
  ja: "@a@bフローラ「父に　たのめば　食料を\n\t送ってくれるとは　思いますけど…\n\tそれでは　解決になりませんものね。\n@c0@"
517:
  de: "@aNera@bNein. Ihr Problem lässt sich nur lösen, indem dem Ungeheuer ein für alle Mal der Garaus gemacht wird.\n@c0@"
  en: "@aNera@bNo. The only way to solve their problems here is to see off that monster once and for all.\n@c0@"
  es: "@aNera@bLa única forma de solucionar sus problemas es acabar con ese monstruo de una vez per tutti.\n@c0@"
  fr: "@aNera@bNon. Le seul moyen de résoudre leurs problèmes serait de chasser ce monstre une bonne fois pour toutes.\n@c0@"
  it: "@aNera@bL'unico modo che abbiamo per aiutarli davvero è affrontare e sconfiggere il mostro che li sta riducendo alla fame.\n@c0@"
  ja: "@a@bフローラ「ここは　やはり\n\t化け物さんを　退治するしか\n\tないのではないかしら？\n@c0@"
518:
  de: "@aBianca@bHier ist es ganz schön trostlos. Die haben bestimmt nicht viele Übernachtungsgäste.\n@c0@"
  en: "@aBianca@bThis is a sorry old place. I doubt there'd be many other folk who'd stay here.\n@c0@"
  es: "@aBianca@b¡Qué sitio más triste! No creo que haya mucha gente viviendo por aquí, ¿sabes?\n@c0@"
  fr: "@aBianca@bCet endroit est vraiment triste. Ça m'étonnerait que beaucoup de gens passent la nuit ici.\n@c0@"
  it: "@aBianca@bChe desolazione...\n@c0@"
  ja: "@a@bビアンカ「さびれた宿ね。\n\tこんなところに　泊まるのは\n\t私たちくらいかも……。\n@c0@"
519:
  de: "@aNera@bHier werden wir wohl kaum etwas zu essen bekommen.\n@c0@"
  en: "@aNera@bI suppose we can't possibly expect a meal here.\n@c0@"
  es: "@aNera@bNon credo que podamos conseguir algo de comer aquí.\n@c0@"
  fr: "@aNera@bJe suppose que nous ne pouvons pas espérer prendre un repas, ici.\n@c0@"
  it: "@aNera@bNon credo che qui troveremo del cibo...\n@c0@"
  ja: "@a@bフローラ「この宿屋さんでは\n\tお食事は　期待できませんわね……。\n@c0@"
520:
  de: "@aBianca@bWie dünn und blass die Frau ist! Ich hatte ja keine Ahnung, dass die Leute hier es so schwer haben!\n@c0@"
  en: "@aBianca@bThat woman's so thin and pale. I had no idea there were folk about havin' such a hard time of it.\n@c0@"
  es: "@aBianca@b¡Qué pálida y flaca está esa mujer! No tenía ni idea de que hubiese gente que lo estuviese pasando tan mal, ¿sabes?\n@c0@"
  fr: "@aBianca@bCette femme est si mince et si pâle. Je n'imaginais\r\npas que la vie puisse être si difficile pour certaines personnes.\n@c0@"
  it: "@aBianca@bQuella ragazza è più magra di uno scheletro...\nTemo che gli abitanti del luogo siano in grandissima difficoltà...\n@c0@"
  ja: "@a@bビアンカ「あの女の子　やせてたし\n\t顔色も　良くなかったわ。\n\tこんな村があるなんて　知らなかった。\n@c0@"
521:
  de: "@aNera@bSelbst die jungen Frauen hier sprechen einen ganz unglaublichen Dialekt.\n@c0@"
  en: "@aNera@bEven the young women here have the most\r\nincredible accents.\n@c0@"
  es: "@aNera@bHasta las ragazze tienen un acento de lo más peculiare aquí.\n@c0@"
  fr: "@aNera@bMême les jeunes femmes ont un accent à couper au couteau, dans le coin.\n@c0@"
  it: "@aNera@bTesoro, ma tu lo capisci questo dialetto?!\nPer me è incomprensibile!\n@c0@"
  ja: "@a@bフローラ「この村では　娘さんも\n\tあのような言葉づかいなのね。\n@c0@"
522:
  de: "@aBianca@bOb das wohl heißt, dass das Ungeheuer noch gruseliger ist als die Vogelscheuche?\n@c0@"
  en: "@aBianca@bI wonder if that means the monster is even\r\nscarier-lookin' than the scarecrow.\n@c0@"
  es: "@aBianca@b¿Eso querrá decir que el monstruo da aún más miedo que ese espantapájaros?\n@c0@"
  fr: "@aBianca@bJe me demande si ça veut dire que le monstre est encore plus effrayant que l'épouvantail.\n@c0@"
  it: "@aBianca@bNemmeno gli spaventamostri riescono a tenere alla larga questa belva?! Deve trattarsi di una creatura ferocissima e maledettamente intelligente...\n@c0@"
  ja: "@a@bビアンカ「それって　あのかかしより\n\t化け物のほうが　こわい姿を\n\tしてるって　ことなのかしら？\n@c0@"
523:
  de: "@aNera@bStell dir vor, für derart gruselige Vogelscheuchen berühmt zu sein! Aber ich vermute, wenn es um den Schutz der Ernte geht, ist jedes Mittel recht.\n@c0@"
  en: "@aNera@bFancy being famous for such scary-looking scarecrows! Still, I suppose you have to do what you can to protect your crops.\n@c0@"
  es: "@aNera@b¡Sembra curioso conseguir la fama porque tus espantapájaros son los que más miedo dan!\n㈡\nMa hay que hacer todo lo posibile para proteger las cosechas.\n@c0@"
  fr: "@aNera@bC'est drôle d'être célèbre pour des épouvantails effrayantsⓠ Enfin, j'imagine qu'ils doivent faire ce qu'ils peuvent pour protéger leurs récoltes.\n@c0@"
  it: "@aNera@bAh, non sapevo che Punta Campestre fosse rinomata per i suoi spaventamostri!\nDevono essere i manufatti tipici della zona...\n@c0@"
  ja: "@a@bフローラ「あんな　おそろしいかかしが\n\t名産だなんて……。\n\t畑を守るって　たいへんなのね。\n@c0@"
524:
  de: "@aBianca@bFür so etwas haben wir doch bestimmt keine Zeit... oder?\n@c0@"
  en: "@aBianca@bSurely we en't got time for this...have we?\n@c0@"
  es: "@aBianca@bCreo que no tenemos tiempo para esto, ¿no?\n@c0@"
  fr: "@aBianca@bOn n'a pas vraiment le temps pour ça... heinⓡ\n@c0@"
  it: "@aBianca@bCredevo che avessimo fretta di proseguire il viaggio...\n@c0@"
  ja: "@a@bビアンカ「今は　そんなことしてる場合じゃ\n\tないんだけど……\n@c0@"
525:
  de: "@aBianca@bAber jetzt können wir wohl keinen Rückzieher mehr machen. Abgemacht ist abgemacht, stimmt's?\n@c0@"
  en: "@aBianca@bI s'pose it's a done deal now, though. If you said you'd help 'em out, then I'd better just go along\r\nwith it, eh?\n@c0@"
  es: "@aBianca@bPero ahora ya no hay remedio. Si ya les has dicho que les vas a ayudar, será mejor que te eche una mano, ¿sabes?\n@c0@"
  fr: "@aBianca@bMais bon, je crois que l'affaire est déjà réglée.\r\nSi tu leur as dit que tu les aiderais, il ne me\r\nreste qu'à t'accompagner.\n@c0@"
  it: "@aBianca@bComunque, se hai dato la tua parola, non ho la minima intenzione di chiederti di tirarti indietro.\n@c0@"
  ja: "@a@bビアンカ「しかたないわね。\n\t%a000090が　引き受けた　たのみなら\n\t私も　手伝ってあげるわよ。\n@c0@"
526:
  de: "@aBianca@bIrgendwie sind wir immer gerade auf dem Sprung, irgendwelche Ungeheuer zu erledigen, wie?\n@c0@"
  en: "@aBianca@bWe always seem to be goin' off and tacklin' some monster or other, eh?\n@c0@"
  es: "@aBianca@bSiempre acabamos por enfrentarnos a algún monstruo en todos lados, ¿eh?\n@c0@"
  fr: "@aBianca@bJ'ai l'impression qu'on est toujours là pour aller flanquer une raclée à un monstre ou à un autre...\n@c0@"
  it: "@aBianca@bOvunque andiamo, ci tocca sempre combattere contro qualche mostro.\nDev'essere il nostro destino.\n@c0@"
  ja: "@a@bビアンカ「それにしても　私たちって\n\tなにかを退治するって話に\n\t縁があると　思わない？\n@c0@"
527:
  de: "@aBianca@bVielleicht nehmen wir es eines Tages sogar mit dem Großmeister der Unterwelt auf, was? Ha ha! Nein, war doch nur ein Witz!\n@c0@"
  en: "@aBianca@bMaybe one of these days we'll even take on the Grandmaster of the Underworld himself, eh? Ha ha! Just jokin'!\n@c0@"
  es: "@aBianca@b¡A lo mejor un día de estos nos las vemos hasta con el Gran Maestro del Inframundo, ¿eh?! ¡Ja, ja! ¡Es una broma!\n@c0@"
  fr: "@aBianca@bPeut-être même qu'un de ces jours, on finira par affronter le Grand Maître des Enfers lui-même, heinⓡ Ha haⓠ Mais non, je plaisanteⓠ\n@c0@"
  it: "@aBianca@bQual è il mostro più cattivo di tutti? Il Gran Maestro degli Inferi? Beh, possiamo star certi che prima o poi affronteremo anche lui! Ah ah ah! Sto scherzando!\n@c0@"
  ja: "@a@bビアンカ「そのうち　悪の大魔王まで\n\t退治して　世界を平和にしたりして…\n\tなんて　そこまでは　いかないか。\n@c0@"
528:
  de: "@aNera@bIch glaube, ich habe westlich von hier eine Höhle gesehen.\n@c0@"
  en: "@aNera@bI seem to remember seeing a cave to the\r\nwest of here.\n@c0@"
  es: "@aNera@bRecuerdo vagamente haber visto una cueva al ovest de aquí.\n@c0@"
  fr: "@aNera@bJe crois me souvenir d'avoir vu une grotte,\r\nà l'ouest d'ici.\n@c0@"
  it: "@aNera@bA ovest di qui c'è una grotta, sai?\nEh eh eh!\nEro la prima della classe in geografia!\n@c0@"
  ja: "@a@bフローラ「ここから　西には\n\t洞くつが　あったような\n\t気がしますわ。\n@c0@"
529:
  de: "@aBianca@bEs greift keine Menschen an? Das klingt doch genau nach der Art Ungeheuer, die du immer im Schlepptau hast, findest du nicht?\n@c0@"
  en: "@aBianca@bIt en't attackin' people? Sounds just like one of them monsters you have trailin' about after you, eh?\n@c0@"
  es: "@aBianca@b¿No ataca a las personas? Parece uno de esos monstruos que te siguen, ¿eh?\n@c0@"
  fr: "@aBianca@bIl ne s'attaque pas aux gensⓡ Il me fait penser au genre de monstres qui t'accompagnent...\n@c0@"
  it: "@aBianca@bUn mostro che non attacca gli uomini? Strano...\nCome mai ha perso la sua indole aggressiva?\nChe sia vegetariano?!\n@c0@"
  ja: "@a@bビアンカ「人を　おそわないなんて\n\tまるで　%a000090が\n\tつれている　魔物みたいね。\n@c0@"
530:
  de: "@aNera@bFrüher dachte ich immer, dass Ungeheuer nur Menschen fressen, aber manche von ihnen sind Pflanzenfresser, weißt du.\n@c0@"
  en: "@aNera@bI used to think that monsters only like to eat humans, but some of them are vegetarians, you know.\n@c0@"
  es: "@aNera@bAntes creía que los mostri solo comían carne humana, pero resulta que algunos son vegetarianos, ¿sabes?\n@c0@"
  fr: "@aNera@bAutrefois, je croyais que les monstres n'aimaient manger que les humains, mais certains sont végétariens, en fait.\n@c0@"
  it: "@aNera@bNon tutti i mostri attaccano gli uomini, perché alcuni di essi non sono carnivori. L'ho studiato all'abbazia, al corso di ⓕZoologia mostruosaⓖ...\n@c0@"
  ja: "@a@bフローラ「化け物さんって　人間を\n\t食べるものとばかり　思っていましたが\n\t野菜好きの方も　いらっしゃるのね。\n@c0@"
531:
  de: "@aBianca@bHast du das gesehen, %a000090? Ich weiß nicht... es kommt mir so vor, als hätte ich dieses Tier schon mal irgendwo gesehen.\n@c0@"
  en: "@aBianca@bDid you see that, %a000090? I can't help feelin' like I've seen that beast before.\n@c0@"
  es: "@aBianca@b¿Has visto eso, %a000090? Estoy segura de que he visto a esa bestia antes.\n@c0@"
  fr: "@aBianca@bTu as vu ça, %a000090ⓡ J'ai la drôle d'impression d'avoir déjà vu cette bête quelque part.\n@c0@"
  it: "@aBianca@b%0%a000090! Hai visto anche tu?!\nHo l'impressione di aver già visto quella belva...\n@c0@"
  ja: "@a@bビアンカ「見た　%a000090？\n\tさっきの魔物　どこかで\n\t見たような気がしない？\n@c0@"
532:
  de: "@aBianca@bHier kriege ich direkt eine Gänsehaut. Es ist viel zu ruhig!\n@c0@"
  en: "@aBianca@bThis place gives me the willies, you know.\r\nIt's just a little bit too quiet.\n@c0@"
  es: "@aBianca@bEste sitio me pone la piel de gallina.\r\nEs muy tranquilo... Demasiado.\n@c0@"
  fr: "@aBianca@bCet endroit me donne la chair de poule.\r\nC'est un peu trop calme.\n@c0@"
  it: "@aBianca@bQuesto posto è troppo tranquillo.\nQui c'è qualcosa che non va...\n@c0@"
  ja: "@a@bビアンカ「それにしても　この村\n\tなんだか　静かすぎて\n\tこわいくらいだわ……。\n@c0@"
533:
  de: "@aNera@bOh! Glaubst du, das war das Ungeheuer? Es sah so aus, als würde es die Felder zerwühlen.\n@c0@"
  en: "@aNera@bOoh! Do you think that was the monster? It looked like it was tearing up the fields.\n@c0@"
  es: "@aNera@b¡Ooh! ¿Crees que eso era il mostro? Veramente, parecía que estaba destrozando los campos.\n@c0@"
  fr: "@aNera@bOohⓠ Tu crois que c'était le monstreⓡ Il semblait être en train de ravager les cultures.\n@c0@"
  it: "@aNera@bSì, credo che sia quello il mostro che sta devastando i campi.\n@c0@"
  ja: "@a@bフローラ「まあ！　さっきのカゲは\n\tケモノ　だったのかしら？\n\t畑を　あらしていたみたいでしたけど。\n@c0@"
534:
  de: "@aNera@bWenn abends im Stift die Lichter ausgingen, war es dort genauso still.\n@c0@"
  en: "@aNera@bThe abbey used to be quiet like this after lights out.\n@c0@"
  es: "@aNera@bDopo apagare las luces, la abadía era muy silenciosa.\n@c0@"
  fr: "@aNera@bUne fois les lumières éteintes, l'abbaye était aussi silencieuse que cet endroit.\n@c0@"
  it: "@aNera@bUhm, tanta calma mi insospettisce.\nTeniamo gli occhi aperti, %a000090.\nNon vorrei che si trattasse di una trappola...\n@c0@"
  ja: "@a@bフローラ「私のいた修道院でも\n\t消灯を過ぎたら　この村のように\n\t静かになったものですわ。\n@c0@"
535:
  de: "@aBianca@bSie sind ziemlich vorsichtig für Landvolk. Die Leute in Utensiel schließen nie ab.\n@c0@"
  en: "@aBianca@bThey're pretty cautious for country folk. People in Stockenbarrel never bother lockin' their doors.\n@c0@"
  es: "@aBianca@bPara ser campesinos, son gente muy precavida. En Clavis nadie se preocupaba de cerrar las puertas con llave, ¿sabes?\n@c0@"
  fr: "@aBianca@bIls sont plutôt méfiants pour des gens de la campagne. À Saint Éloi, personne ne fermait\r\njamais sa porte à clef.\n@c0@"
  it: "@aBianca@bAd Aprianuam non chiudiamo mai le porte a chiave...\n@c0@"
  ja: "@a@bビアンカ「イナカなのに　用心深いのね。\n\tちゃんと　戸じまりするなんて。\n\tわたしの村とは　大ちがいだわ。\n@c0@"
536:
  de: "@aNera@bEs ist verständlich, dass ihre Türen zu dieser Zeit verschlossen sind. Bauern müssen schließlich früh raus.\n@c0@"
  en: "@aNera@bI suppose it's fair enough that their doors are\r\nlocked at this sort of time. Farmers do get up\r\nearly, after all.\n@c0@"
  es: "@aNera@bSupongo que es normale que las puertas estén cerradas con llave a estas horas. Al fin y al cabo, los campesinos se levantan veramente temprano.\n@c0@"
  fr: "@aNera@bÇa me semble assez normal que les portes soient fermées à cette heure-ci. Les fermiers se lèvent\r\ntrès tôt, après tout.\n@c0@"
  it: "@aNera@bMi pare normale che di notte le porte siano chiuse, no?\nLa prudenza non è mai troppa...\n@c0@"
  ja: "@a@bフローラ「この時間では　カギが\n\tかかっていても　しかたありませんわ。\n\t農村の朝は　早いものですし。\n@c0@"
537:
  de: "@aBianca@bWollen wir heute Nacht hier bleiben? Bei dieser Stille können wir sicher gut schlafen.\n@c0@"
  en: "@aBianca@bShall we stay here tonight? I reckon we'd get a pretty quiet night's sleep.\n@c0@"
  es: "@aBianca@b¿Nos quedamos aquí esta noche? Creo que pasaremos una noche muy tranquila, ¿sabes?\n@c0@"
  fr: "@aBianca@bEst-ce qu'on reste ici, cette nuitⓡ\nJe parie qu'on dormira très paisiblement.\n@c0@"
  it: "@aBianca@bChe ne dici di trascorrere la notte qui?\n@c0@"
  ja: "@a@bビアンカ「今夜は　ここに泊まる？\n\tしずかに　眠れそうよ。\n@c0@"
538:
  de: "@aNera@bEs ist ein wenig einsam, aber es kann ja nicht schaden, gelegentlich an einem solchen Ort zu übernachten.\n@c0@"
  en: "@aNera@bIt feels a bit desolate, but I suppose it can't hurt to stay over in a place like this every once in a while.\n@c0@"
  es: "@aNera@bEs un po' lúgubre, ma non credo que sea malo pasar una noche en un sitio así de vez en cuando.\n@c0@"
  fr: "@aNera@bL'endroit n'est pas très réjouissant, mais ça n'est pas grave de dormir de temps à autre dans des lieux comme ici.\n@c0@"
  it: "@aNera@bNon sarà una sistemazione principesca, ma sarà sempre meglio che trascorrere la notte all'aperto.\nQui potremo riposare tranquilli...\n@c0@"
  ja: "@a@bフローラ「さびしい感じが　しますけど\n\tたまには　こういうところに泊まるのも\n\t悪くないですわ。\n@c0@"
539:
  de: "@aBianca@bEs kommt mir vor, als würden alle uns anstarren. Weißt du, ich glaube, sie haben ein bisschen Angst vor uns.\n@c0@"
  en: "@aBianca@bI feel like everyone's lookin' at us. I think they're a bit scared of us, you know.\n@c0@"
  es: "@aBianca@bMe da la sensación de que todos nos miran. Creo que nos tienen miedo, ¿sabes?\n@c0@"
  fr: "@aBianca@bJ'ai l'impression que tout le monde nous regarde.\r\nOn doit les effrayer un peu, à mon avis.\n@c0@"
  it: "@aBianca@bMi sento addosso gli sguardi di tutti gli abitanti del posto!\nCredo che abbiano paura di noi...\n@c0@"
  ja: "@a@bビアンカ「なんか　視線を感じるわ。\n\tみんな　私たちを\n\t恐れてるみたいよ……。\n@c0@"
540:
  de: "@aBianca@bIch glaube, sie haben Angst, weil wir %a001210 bei uns haben. Schließlich war es %a001210, der ihre Felder zerwühlt hat.\n@c0@"
  en: "@aBianca@bI think they're all scared because we have %a001210 with us and he's the one who tore up their fields.\n@c0@"
  es: "@aBianca@bCreo que les asusta que %a001210 esté con nosotros después de haber destrozado sus campos.\n@c0@"
  fr: "@aBianca@bJe crois qu'ils ont tous peur car %a001210 nous accompagne et c'est lui qui a ravagé leurs champs.\n@c0@"
  it: "@aBianca@bProbabilmente sono spaventati perché %a001210 è con noi. Li capisco... Dopotutto, stiamo passeggiando con il ⓕmostroⓖ che ha saccheggiato il loro raccolto!\n@c0@"
  ja: "@a@bビアンカ「みんなが　恐がってるのは\n\t畑あらしをした　%a001210が\n\tいっしょに　いるからかしら……。\n@c0@"
541:
  de: "@aBianca@bAber er hat es doch nicht böse gemeint! Vielleicht nehmen sie es ihm nicht mehr übel, wenn sie das wissen.\n@c0@"
  en: "@aBianca@bBut he didn't mean to cause any harm, eh? Hopefully they'll come 'round and forgive him.\n@c0@"
  es: "@aBianca@bPero no tenía mala intención, ¿verdad? Espero que acaben por perdonarle.\n@c0@"
  fr: "@aBianca@bMais il n'avait pas l'intention de faire de mal à quiconque, n'est-ce pasⓡ J'espère qu'ils réussiront à lui pardonner.\n@c0@"
  it: "@aBianca@bSperiamo di riuscire a spiegare come stanno le cose!\nDel resto, %a001210 non ha ucciso né ferito nessuno...\n@c0@"
  ja: "@a@bビアンカ「でも　%a001210だって\n\t悪気があって　したわけじゃないのよ。\n\tどうにか　許してもらえないかしら。\n@c0@"
542:
  de: "@aNera@bIch habe das Gefühl, die Dorfbewohner weichen uns aus.\n@c0@"
  en: "@aNera@bI feel like the villagers are avoiding us.\n@c0@"
  es: "@aNera@bSembra que los aldeanos nos están evitando.\n@c0@"
  fr: "@aNera@bJ'ai le sentiment que les villageois nous évitent.\n@c0@"
  it: "@aNera@bHo la nettissima sensazione che gli abitanti del villaggio non nutrano molta simpatia per noi.\n@c0@"
  ja: "@a@bフローラ「村の方たちに\n\tさけられているような　気が\n\tしますわ。\n@c0@"
543:
  de: "@aNera@bSicher nehmen sie es %a001210 übel, dass er ihre Ernte zerstört hat.\n@c0@"
  en: "@aNera@bI suppose they're feeling a bit bitter because of %a001210 destroying their crops.\n@c0@"
  es: "@aNera@bSupongo que están un poco resentidos porque %a001210 destrozó la sua cosecha.\n@c0@"
  fr: "@aNera@bIls doivent être un peu amers. Après tout,\nc'est %a001210 qui a détruit leurs récoltes.\n@c0@"
  it: "@aNera@bImmagino che ce l'abbiano a morte con %a001210, ⓕlu mostro piecuroⓖ che ha devastato i loro campi.\nSentito? Sto imparando a parlare il loro dialetto!\n@c0@"
  ja: "@a@bフローラ「やはり　畑を荒らした\n\t%a001210さんを\n\tうらんでいるのでしょうか……。\n@c0@"
544:
  de: "@aNera@bDer arme %a001210. Als er dich verloren hatte, war er zu zahm für die Wildnis geworden. Er konnte keine Menschen mehr angreifen.\n@c0@"
  en: "@aNera@bPoor %a001210. When he lost you, he couldn't go back to the wild because he was too tame. He couldn't attack people.\n@c0@"
  es: "@aNera@bPoverino %a001210. Cuando se perdió, no pudo volver a la natura porque estaba demasiado domesticado. No podía atacar a las personas.\n@c0@"
  fr: "@aNera@bPauvre %a001210. Quand il t'a perdu, il n'a pas pu retourner à la vie sauvage, il était trop apprivoisé.\nIl lui était impossible d'attaquer des gens.\n@c0@"
  it: "@aNera@bCredo di aver capito cosa sia successo a %a001210. Dopo la tua scomparsa, non sapeva cosa fare: era troppo docile per stare con gli altri mostri...\n@c0@"
  ja: "@a@bフローラ「%a000090さんと　出会って\n\t邪悪な心のぬけた%a001210は\n\t群れにも帰れず　人もおそえず……\n@c0@"
