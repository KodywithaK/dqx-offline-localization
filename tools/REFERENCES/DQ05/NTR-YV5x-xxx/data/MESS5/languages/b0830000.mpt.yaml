17:
  de: "@aHilda@bAch Göttinchen! Ganz schön fies, dass Ihr jemanden einfach so hier abladen wollt, der in einer derart schlechten Verfassung ist.\n@c0@"
  en: "@aPatty@bYikes! That's a bit mean, trying to ditch someone when they're in such a sorry state.\n@c0@"
  es: "@aCone-Cone@b¡Vaya! Eso de intentar librarse de alguien cuando está en ese lamentable estado es bastante perverso...\n@c0@"
  fr: "@aTulipe@bFranchementⓠ Ça n'est pas très sympa d'essayer de se débarrasser de quelqu'un qui se trouve dans un état pareil.\n@c0@"
  it: "@aGreta@bInsomma, un po' di rispetto!\nNon si scarica qualcuno in quelle condizioni!\n@c0@"
  ja: "@a@bルイーダ「あら　そんなじょうたいの人を\n\tそのまま　はずすなんて\n\tあんまりだわよ。\n@c0@"
