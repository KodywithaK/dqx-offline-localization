0:
  de: "@aHilda@bWillkommen in Hildas Heldenhort!\n@c0@"
  en: "@aPatty@bWelcome to Patty's Party Planning Place!\n\n@c0@"
  es: "@aCone-Cone@b¡Bienvenid%H0860%X%A0110%Xo%Z%B0110%Xa%Z%Y%R0000%Xas%Yos%Z%Z al Centro de Organización de Grupos de Cone-Cone!\n@c0@"
  fr: "@aTulipe@bBienvenue au Carré de Tulipe, la chef d'équipeⓠ\n@c0@"
  it: "@aGreta@bSalve!\nQuesto è l'Ufficio di Greta l'Organizzagruppo!\n@c0@"
  ja: "@a@bルイーダ「ここは　ルイーダの店。\n@c0@"
1:
  de: "@aHilda@bWenn Ihr neue Mitglieder für Eure Gruppe braucht, dann seid Ihr hier genau richtig! Und nicht nur das, hier könnt Ihr auch Gruppenmitglieder loswerden!\n@c0@"
  en: "@aPatty@bIf you want to pick up new members for your party, this is the place to be! Same goes if you want to ditch a party member, for that matter.\n@c0@"
  es: "@aCone-Cone@b¡Si %H0860%Xquieres%Yqueréis%Z elegir nuevos miembros para el grupo, este es el lugar adecuado! Y también sirve para librarse de alguno de ellos, por cierto.\n@c0@"
  fr: "@aTulipe@bSi vous voulez intégrer de nouveaux membres à votre équipe, vous êtes au bon endroitⓠ Même chose si vous voulez dire adieu à l'un de ces membres.\n@c0@"
  it: "@aGreta@bQui %H0860%Xpotrai decidere quali membri aggiungere al tuo%Ypotrete decidere quali membri aggiungere al vostro%Z gruppo e quali escludere.\n@c0@"
  ja: "@a@bルイーダ「旅人たちが\n\t仲間を求めて　集まる\n\t出会いと　別れの　酒場よ。\n@c0@"
2:
  de: "@aHilda@bAlso, was kann ich heute für Euch tun?\n@c0@"
  en: "@aPatty@bSo, how can I help you today?\n@c0@"
  es: "@aCone-Cone@b¿Puedo ayudar%H0860%Xte%Yos%Z en algo?\n@c0@"
  fr: "@aTulipe@bAlors, en quoi puis-je vous être utile, aujourd'huiⓡ\n@c0@"
  it: "@aGreta@bAllora, cosa posso fare per %H0860%Xte%Yvoi%Z?\n@c0@"
  ja: "@a@bルイーダ「何を　お望みかしら？\n@c0@"
3:
  de: "@aHilda@bAber Ihr habt schon mehr als genug Begleiter!\n@c0@"
  en: "@aPatty@bBut you've already got plenty of company there as it is!\n@c0@"
  es: "@aCone-Cone@b¡Pero el grupo ya tiene muchos miembros!\n@c0@"
  fr: "@aTulipe@bMais vous êtes déjà bien nombreuxⓠ\n@c0@"
  it: "@aGreta@bNon %H0860%Xpuoi%Ypotete%Z aggiungere altri elementi al gruppo!\n@c0@"
  ja: "@a@bルイーダ「あら　そんなに　ぞろぞろ\n\tお仲間が　いるのに？\n@c0@"
4:
  de: "@aHilda@bIhr müsst erst jemanden zurücklassen, wenn Ihr Eurer Gruppe wirklich ein neues Mitglied hinzufügen wollt.\n@c0@"
  en: "@aPatty@bYou'll have to leave someone behind if you're determined to add a new member to your party.\n@c0@"
  es: "@aCone-Cone@bSi %H0860%Xtienes%Ytenéis%Z intención de agregar un nuevo miembro al grupo, será necesario dejar a alguien fuera.\n@c0@"
  fr: "@aTulipe@bVous allez devoir laisser quelqu'un derrière vous\r\nsi vous voulez vraiment ajouter un nouveau\r\nmembre à votre équipe.\n@c0@"
  it: "@aGreta@bSe %H0860%Xvuoi inserire dei nuovi membri, dovrai%Yvolete inserire dei nuovi membri, dovrete%Z prima escluderne qualche mostro.\n@c0@"
  ja: "@a@bルイーダ「誰かを　はずさないと\n\tこれ以上　仲間に　できなくてよ。\n@c0@"
5:
  de: "@aHilda@bAch Göttinchen, es ist niemand verfügbar, der sich Eurer Gruppe anschließen könnte. Tut mir leid!\n@c0@"
  en: "@aPatty@bYikes! I'm afraid you don't have anyone available to join your party. Sorry!\n@c0@"
  es: "@aCone-Cone@b¡Vaya por la Diosa! Me temo que no hay nadie disponible para unirse al grupo. ¡Lo siento!\n@c0@"
  fr: "@aTulipe@bOupsⓠ Désolée, mais vous n'avez personne susceptible de rejoindre votre équipe. Je regrette.\n@c0@"
  it: "@aGreta@bMi spiace, ma non ci sono elementi che possono essere aggiunti al gruppo.\n@c0@"
  ja: "@a@bルイーダ「でも　あなたには\n\t仲間に　できる人が\n\tひとりも　いなくてよ。\n@c0@"
6:
  de: "@aHilda@bNa, wen wollt Ihr denn mitnehmen?\n@c0@"
  en: "@aPatty@bSo, who do you want to take along with you?\n@c0@"
  es: "@aCone-Cone@bBueno, ¿y a quién %H0860%Xquieres llevar contigo%Yqueréis llevar con %R0000%Xvosotras%Yvosotros%Z%Z?\n@c0@"
  fr: "@aTulipe@bAlors, qui voulez-vous emmener avec vousⓡ\n@c0@"
  it: "@aGreta@bChi %H0860%Xvuoi portare con te%Yvolete portare con voi%Z?\n@c0@"
  ja: "@a@bルイーダ「誰を　仲間に加えるの？\n@c0@"
7:
  de: "@aHilda@bIhr wollt also, dass %a000180 sich Euch anschließt? Kein Problem!\n@c0@"
  en: "@aPatty@bYou want %a000180 to join you? No problemo!\n@c0@"
