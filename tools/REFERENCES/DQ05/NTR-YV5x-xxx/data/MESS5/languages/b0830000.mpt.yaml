  en: "@aPatty@bYou'd be better off going to an expert who knows how to handle them properly.\n@c0@"
  es: "@aCone-Cone@bSerá mejor que %H0860%Xacudas%Yacudáis%Z a un experto que sepa cómo manejarlos.\n@c0@"
  fr: "@aTulipe@bVous feriez mieux d'aller voir un expert, quelqu'un qui sait comment en prendre soin comme il faut.\n@c0@"
  it: "@aGreta@bCredo che %H0860%Xfaresti%Yfareste%Z meglio a trovare qualcuno che sappia come si trattano quelle bestioline...\n@c0@"
