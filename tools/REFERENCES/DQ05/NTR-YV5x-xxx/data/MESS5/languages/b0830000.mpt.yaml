  fr: "@aTulipe@bDésolée, mais nous n'avons pas l'équipement nécessaire pour nous occuper correctement\r\ndes monstres, ici.\n@c0@"
  it: "@aGreta@bMi dispiace, ma non mi occupo di mostri.\n@c0@"
