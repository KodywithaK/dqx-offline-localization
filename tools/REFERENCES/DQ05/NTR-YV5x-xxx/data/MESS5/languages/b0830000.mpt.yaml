  en: "@aPatty@bI'll be sure to let %A0180%Xhim%Z%B0180%Xher%Z%C0180%Xit%Z know that %A0180%Xhe%Z%B0180%Xshe%Z%C0180%Xit%Z should return here.\n@c0@"
