11:
  de: "@aHilda@bKann ich sonst noch jemanden holen, wo Ihr schon mal hier seid?\n@c0@"
  en: "@aPatty@bCan I fetch anyone else for you while you're here?\n@c0@"
  es: "@aCone-Cone@bYa que %H0860%Xestás%Yestáis%Z aquí, ¿%H0860%Xquieres%Yqueréis%Z que traiga a alguien más?\n@c0@"
