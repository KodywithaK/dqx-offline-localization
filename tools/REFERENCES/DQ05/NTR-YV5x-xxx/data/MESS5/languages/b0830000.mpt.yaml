  it: "@aGreta@b%H0860%XVuoi%YVolete%Z che %a000180 entri a far parte del gruppo?\nDetto... fatto!\n@c0@"
  ja: "@a@bルイーダ「%a000180さんを\n\t仲間に　くわえるのね。　わかったわ。\n@c0@"
8:
  de: "@aHilda@b%0%a000180! %0%a000090 möchte Euch sehen.\n@c0@"
