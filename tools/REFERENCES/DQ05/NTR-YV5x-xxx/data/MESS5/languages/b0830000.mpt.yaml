  it: "@aGreta@bNon %H0860%Xcredi%Ycredete%Z che %a000090 abbia ancora qualcosa d'importante da fare?\nIo penso proprio di sì...\n@c0@"
  ja: "@a@bルイーダ「%a000090さんは　まだ\n\tやらなくては　いけないことが\n\tあるんじゃないかしら。\n@c0@"
15:
