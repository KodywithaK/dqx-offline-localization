12:
  de: "@aHilda@bIhr wollt jemanden dalassen? Äh, ich weiß nicht, wie ich Euch das sagen soll, aber Ihr seid momentan mutterseelenallein, %a000090.\n@c0@"
  en: "@aPatty@bYou want to drop someone off?\nErm, sorry to break it to you, but you're all alone right now, %a000090.\n@c0@"
  es: "@aCone-Cone@b¿Quieres dejar a alguien? ¡Ejem!, lamento informarte de que ahora mismo estás solo, %a000090.\n@c0@"
  fr: "@aTulipe@bVous voulez donner congé à quelqu'unⓡ Euh... Je regrette de vous l'annoncer si brutalement, mais vous êtes %A0110%Xtout seul%Z%B0110%Xtoute seule%Z pour l'instant, %a000090.\n@c0@"
