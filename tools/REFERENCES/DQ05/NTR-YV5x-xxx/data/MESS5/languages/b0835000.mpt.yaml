  en: "@a@bA slobbery lick to make the enemy cower.\n@c0@"
  es: "@a@bUn baboso lengüetazo que hace encogerse al enemigo.\n@c0@"
  fr: "@a@bCoup de langue baveux qui terrorise l'ennemi.\n@c0@"
  it: "@a@bUn attacco disgustoso che sconcerta il nemico\ne lo rende meno baldanzoso...\n@c0@"
  ja: "@a@bベロッとなめて　みをすくませる\n@c0@"
85:
  de: "@a@bEin donnernder Schrei, bei dem der Feind vor Furcht zurückzuckt.\n@c0@"
  en: "@a@bA booming yell to make the enemy recoil in fear.\n@c0@"
  es: "@a@bUn grito retumbante que hace que el enemigo\r\nretroceda atemorizado.\n@c0@"
  fr: "@a@bHurlement tonitruant qui oblige l'ennemi, effrayé, à reculer.\n@c0@"
  it: "@a@bUn urlo spaventoso che terrorizza il nemico.\n@c0@"
  ja: "@a@bおおごえをあげ　みをすくませる\n@c0@"
86:
  de: "@a@bHilft dem Anwender, eins zu werden mit sich selbst, um seine Stärke wiederzuerlangen.\n@c0@"
  en: "@a@bBecome at one with the self to regain strength.\n@c0@"
  es: "@a@bMedita para recuperar las fuerzas.\n@c0@"
  fr: "@a@bPermet de ne faire qu'un avec soi-même pour récupérer des forces.\n@c0@"
  it: "@a@bEntra in contatto con il tuo ⓕioⓖ interiore\ne recupera energia.\n@c0@"
  ja: "@a@bめいそうして　ＨＰをかいふく\n@c0@"
87:
  de: "@a@bHebt alle magischen Effekte auf.\n@c0@"
  en: "@a@bEliminates all magical effects.\n@c0@"
  es: "@a@bElimina todos los efectos mágicos.\n@c0@"
