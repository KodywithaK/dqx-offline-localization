0:
  de: "@aBianca@bIst das Nadiria? Wahrscheinlich schon, denn ich fühle mich gar nicht wohl in meiner Haut...\n@c0@"
  en: "@aBianca@bIs this Nadiria? I think it must be, there's a horrible feelin' in the air.\n@c0@"
  es: "@aBianca@b¿Esto es Nadiria? Debe de serlo, porque algo horrible flota en el ambiente, ¿sabes?\n@c0@"
  fr: "@aBianca@bOn est à Nadiriaⓡ Oui, je pense, parce qu'il y a quelque chose d'horrible dans l'air.\n@c0@"
  it: "@aBianca@bQuesta è Nadiria, non è vero?\nC'è un'atmosfera terribile...\n@c0@"
  ja: "@a@bビアンカ「ここが…　魔界？\n\tきっと　そうよね。\n\tイヤな空気が　立ちこめてる……。\n@c0@"
1:
  de: "@aNera@bAlso sind wir endlich da. Dass hier die Unterwelt beginnt, kann man an der unheilvollen Aura erkennen, welche die Luft erfüllt.\n@c0@"
  en: "@aNera@bSo we're finally here. You can tell this is the beginnings of the underworld from the sinister\r\nfeeling in the air.\n@c0@"
  es: "@aNera@bO sea, que ya hemos llegado. Se nota que es la entrada del inframundo per el ambiente tan veramente siniestro.\n@c0@"
  fr: "@aNera@bNous y sommes enfin. On peut le deviner\r\nà l'atmosphère sinistre qui règne ici.\n@c0@"
  it: "@aNera@bA giudicare dall'atmosfera infernale che si respira qui, direi che siamo arrivati nel Regno degli Inferi...\n@c0@"
  ja: "@a@bフローラ「とうとう　来ましたのね。\n\tええ　わかりますわ。\n\tイヤな空気が　立ちこめていますもの。\n@c0@"
2:
  de: "@a%0%a001240@bPapa... Dieser Ort macht mir Angst...\n@c0@"
  en: "@a%0%a001240@bDad... This place has got a really scary feel to it.\n@c0@"
  es: "@a%0%a001240@bPapá... Este sitio me pone los pelos de punta.\n@c0@"
  fr: "@a%0%a001240@bPapa... Cet endroit a quelque chose de vraiment effrayant.\n@c0@"
  it: "@a%0%a001240@bPapà, questo posto mi fa venire i brividi...\n@c0@"
  ja: "@a@b%a001240「お父さん……。\n\tこのあたり　すごく　やばい\n\t気配が　ただよってるよ……。\n@c0@"
3:
  de: "@a%0%a001250@bÄhm... Ich muss zugeben, dass ich ein wenig Angst habe...\n@c0@"
  en: "@a%0%a001250@bUm... I'm feeling a little bit s-scared here.\n@c0@"
  es: "@a%0%a001250@bEsto... Me está dando un poco de miedo.\n@c0@"
  fr: "@a%0%a001250@bMmm... J'ai un peu p-peur, ici.\n@c0@"
  it: "@a%0%a001250@bHo paura...\n@c0@"
  ja: "@a@b%a001250「ど…　どうしよう……。\n\tわたし　ちょっと　こわい……。\n@c0@"
4:
  de: "@a%0%a001240@bKeine Sorge, %a001250, ich pass auf dich auf.\n@c0@"
  en: "@a%0%a001240@bDon't worry, sis. I'll look after you.\n@c0@"
  es: "@a%0%a001240@bNo te preocupes, hermana. Yo te cuidaré.\n@c0@"
  fr: "@a%0%a001240@bT'inquiète pas, petite sœur. Je vais te protéger.\n@c0@"
  it: "@a%0%a001240@bNon preoccuparti, sorellina!\nCi penso io a proteggerti.\n@c0@"
  ja: "@a@b%a001240「がんばれ。\n\tボクが　ちゃんと守ってやるからな。\n@c0@"
5:
  de: "@a%0%a001250@bIch weiß, %a001240...\n@c0@"
  en: "@a%0%a001250@bI know, %a001240...\n@c0@"
  es: "@a%0%a001250@bLo sé, %a001240...\n@c0@"
  fr: "@a%0%a001250@bJe sais, %a001240...\n@c0@"
  it: "@a%0%a001250@bGrazie, %a001240...\n@c0@"
  ja: "@a@b%a001250「お兄ちゃん……。\n@c0@"
6:
  de: "@aSancho@bWir sind so weit gekommen, und deine Onkel Sancho ist für alles bereit! Si, iss bin bereit wie eine große Teller Paella!\n@c0@"
  en: "@aSancho@bNow we have come thees far, your Uncle Sancho, he ees ready! Sí, he ees ready like the\r\nbeeg plate of paella!\n@c0@"
  es: "@aSancho@bYa que llegamos hasta acá, tu tito Sancho está preparado. ¡Sí, preparado para una buena enchilada!\n@c0@"
  fr: "@aSancho@bMaintenant qu'on a f-fait tout ce chemin, ton tonton S-Sancho, il est p-prêtⓠ Si, il est prêt comme oun grand plat de paellaⓠ\n@c0@"
  it: "@aSancho@b¡Lo zio Sancho es pronto!\n¡Sì, es pronto como un piatto de paella calda y fumante!\n@c0@"
  ja: "@a@bサンチョ「ここまで　来たからには\n\tこのサンチョ　覚悟を決めましたぞ。\n\tさあ　まいりましょう！\n@c0@"
7:
  de: "@aOtto@bBei der Göttin! Nie hätte ich mir träumen lassen, mal an solch einem Ort zu sein.\n@c0@"
  en: "@aTuppence@bI say! I never imagined I'd f-find myself in a p-place like this.\n@c0@"
  es: "@aAlazar@b¡Vaya! Nunca pensé que me encontraría en un sitio como este.\n@c0@"
  fr: "@aInnocent@bJ-Je n'aurais jamais pensé me retrouver dans un endroit c-comme celui-ci un jour.\n@c0@"
  it: "@aSimon@bIl Regno degli Inferi...\nNon mi sembra vero di essere in questo luogo tremendo...\n@c0@"
  ja: "@a@bピピン「ぼ…　ボクごときが\n\tこのような場所に\n\t足を　ふみ入れるとは……。\n@c0@"
8:
  de: "@aOtto@bAllerdings befürchte ich, dass meine Nerven ein wenig blank liegen. Mir will noch net mal ein Witz einfallen...\n@c0@"
  en: "@aTuppence@bDear me. I'm afraid I'm rather on edge. So much so that I can't even muster a joke.\n@c0@"
  es: "@aAlazar@bAy, ay... me temo que estoy atacado. Tanto, que ni siquiera puedo hacer un chiste.\n@c0@"
  fr: "@aInnocent@bOh là là. Je crois que je suis très tendu. Je n'arrive même plus à faire des blagues.\n@c0@"
  it: "@aSimon@bSono talmente nervoso che quasi non mi riesce di pensare alle donne, Maestà!\nHo detto QUASI...\n@c0@"
  ja: "@a@bピピン「ど　どうしましょう。\n\tボク　もう　じょうだんを言う\n\tよゆうも　なくなってきました！\n@c0@"
9:
  de: "@aBianca@bDiese Stimme... War das etwa deine Mutter?\n@c0@"
  en: "@aBianca@bThat voice... Do you think it could've bin your mum's?\n@c0@"
  es: "@aBianca@bEsa voz... ¿Crees que habrá sido tu madre?\n@c0@"
  fr: "@aBianca@bCette voix... tu crois que c'était celle de ta mèreⓡ\n@c0@"
  it: "@aBianca@bCredi che quella fosse la voce di tua madre...?\n@c0@"
  ja: "@a@bビアンカ「今の声は……\n\tまさか……　お母さまの声？\n@c0@"
10:
  de: "@aBianca@bIch weiß, es ist kaum zu glauben, aber sie hat sich so gütig angehört...\n@c0@"
  en: "@aBianca@bI know it's hard to believe, but she sounded\r\nso gentle...\n@c0@"
  es: "@aBianca@bSé que es difícil de creer, pero parecía tan amable...\n@c0@"
  fr: "@aBianca@bJe sais que c'est un peu dur à croire, mais elle avait l'air si douce...\n@c0@"
  it: "@aBianca@bEra calda, gentile... Sembrava fuori posto in un luogo orribile come questo.\nSì, quella era senz'altro la voce di Mada.\n@c0@"
  ja: "@a@bビアンカ「信じられない……けど\n\tなんて　やさしい声……。\n@c0@"
11:
  de: "@aNera@bHast du das gehört, Liebling? Deine Mutter ist nicht mehr fern. Lass uns weitergehen.\n@c0@"
  en: "@aNera@bDid you hear that, darling? Your mother isn't far away now. Let's move on.\n@c0@"
  es: "@aNera@b¿Has oído eso, caro? La tua mamma ya está cerca. Adelante.\n@c0@"
  fr: "@aNera@bTu as entendu, mon chériⓡ Ta mère n'est plus très loin. Allons-y.\n@c0@"
  it: "@aNera@bHai sentito, caro?\nQuella era tua madre! Forza, muoviamoci!\nMada non può essere molto lontana!\n@c0@"
  ja: "@a@bフローラ「あなた　聞いた？\n\tお母さまは　もう　間近よ。\n\tさあ　行きましょう……。\n@c0@"
12:
  de: "@aNera@bDeine Mutter muss über unglaubliche Kräfte verfügen, wenn sie uns einfach so ein Geschenk zukommen lassen kann.\n@c0@"
  en: "@aNera@bYour mother must have some amazing powers to be able to send us a gift out of nowhere like that.\n@c0@"
  es: "@aNera@bLa tua mamma debe de tener poderes asombrosos para hablarnos così y enviarnos regalos.\n@c0@"
  fr: "@aNera@bTa mère doit avoir des pouvoirs incroyables pour nous envoyer un cadeau comme ça, sorti de\r\nnulle part.\n@c0@"
  it: "@aNera@bTi rendi conto che tua madre è riuscita a farci sentire la sua voce e a farci avere un dono pur trovandosi in un altro luogo?!\n㈡\nI suoi poteri sono realmente strabilianti!\n@c0@"
  ja: "@a@bフローラ「それにしても　どこからか\n\tおくりものを　してくださるなんて\n\tお母さまのチカラ　本当にすごいのね。\n@c0@"
13:
  de: "@a%0%a001240@bKannst du mich hören, Großmutter? Ich bin's, dein Enkel %a001240! Wir kommen dich jetzt retten!\n@c0@"
  en: "@a%0%a001240@bCan you hear me, Grandma? I'm your grandson, %a001240! We're coming to rescue you!\n@c0@"
  es: "@a%0%a001240@b¿Puedes oírme, abuela? Soy tu nieto, %a001240. ¡Venimos a rescatarte!\n@c0@"
  fr: "@a%0%a001240@bTu m'entends, grand-mèreⓡ C'est ton petit-fils %a001240ⓠ On vient pour te sauverⓠ\n@c0@"
  it: "@a%0%a001240@bNonna, mi senti?\nSono %a001240, il tuo nipotino!\nCerca di resistere! Stiamo venendo a salvarti!\n@c0@"
  ja: "@a@b%a001240「おばあちゃん　聞こえる！？\n\tマゴの　%a001240だよ！\n\tすぐに助けに行くから　待っててね！\n@c0@"
14:
  de: "@a%0%a001240@bWelch eine Erleichterung, was, Papa? Sie scheint uns gar nicht böse zu sein.\n@c0@"
  en: "@a%0%a001240@bThat's a relief, isn't it, Dad? She doesn't seem to be angry that we're here.\n@c0@"
  es: "@a%0%a001240@b¡Qué alivio!, ¿verdad, papá? Parece que no está enfadada por que hayamos venido.\n@c0@"
  fr: "@a%0%a001240@bC'est rassurant, nonⓡ Elle n'a pas l'air d'être en colère de nous voir ici.\n@c0@"
  it: "@a%0%a001240@bAh, che sollievo!\nNonna non s'è arrabbiata perché siamo venuti a prenderla!\n@c0@"
  ja: "@a@b%a001240「よかったね　お父さん。\n\t来たけど　しかられなかったね。\n@c0@"
15:
  de: "@a%0%a001240@bWahrscheinlich ist sie sogar froh, dass wir hier sind. Alle Omas lieben doch ihre Enkel!\n@c0@"
  en: "@a%0%a001240@bI'll bet she's glad to see us, really. All grannies like to see their grandchildren!\n@c0@"
  es: "@a%0%a001240@bDiría que hasta se alegra de vernos. ¡A todas las abuelas les gusta ver a sus nietos!\n@c0@"
  fr: "@a%0%a001240@bJe parie qu'elle est même contente de nous voir. Toutes les grands-mères ont envie de voir leurs petits-enfants.\n@c0@"
  it: "@a%0%a001240@bAnzi, sono convinta che sarà felice di vederci!\nTutte le nonne sono contente quando i loro nipoti vanno a trovarle, no?\n@c0@"
  ja: "@a@b%a001240「きっと　おばあちゃんも\n\tうれしかったよね。\n\tそうに　きまってるよ！\n@c0@"
16:
  de: "@a%0%a001250@bGroßmutter...\n@c0@"
  en: "@a%0%a001250@bGrandma...\n@c0@"
  es: "@a%0%a001250@bAbuela...\n@c0@"
  fr: "@a%0%a001250@bGrand-mère...\n@c0@"
  it: "@a%0%a001250@bNonna...\n@c0@"
  ja: "@a@b%a001250「おばあちゃん……。\n@c0@"
17:
  de: "@a%0%a001250@bDas ist also ein Stein des Weisen. Ich hab mal ein Bild davon in einem Buch gesehen, aber noch nie einen echten.\n@c0@"
  en: "@a%0%a001250@bSo this is a sage's stone. I saw a picture of one\nin an old book once, but I've never seen one for\nreal before.\n@c0@"
  es: "@a%0%a001250@bAsí que esto es una piedra de sabio. Una vez vi una en una ilustración de un libro antiguo, pero nunca había visto una de verdad.\n@c0@"
  fr: "@a%0%a001250@bC'est donc ça, une pierre philosophale. J'ai vu une illustration dans un vieux livre une fois, mais je n'en avais jamais vu en vrai.\n@c0@"
  it: "@a%0%a001250@bE così questa è una pietra del saggio...\nFinora avevo visto questi oggetti solo sui libri, ma mai dal vivo.\n@c0@"
  ja: "@a@b%a001250「これが　けんじゃの石……。\n\t古い本で　見たことはあるけど\n\t本物を見たのは　初めて……。\n@c0@"
18:
  de: "@aSancho@bSeñora Magda! Iss... (Schluchz) \nWie lange habe iss diese Stimme nisst mehr gehört?\n@c0@"
  en: "@aSancho@bSeñora Mada! I, I, I... (sob)\r\nI no hear thees voice for eso long!\n@c0@"
  es: "@aSancho@b¡Señora Perséfone! Yo, yo... (snif) ¡Hace tantísimo tiempo que no escuchaba su voz...!\n@c0@"
  fr: "@aSancho@bSeñora M-M-Magdalenaⓠ Je, Je, Je... (sanglot)\nÇa fait s-si longtemps que je n'avais p-pas entendu cette voixⓠ\n@c0@"
  it: "@aSancho@b¡Señora Mada!\n¡Ay, como soy commossos! ¡Sob!\nErano muchos años que no sentivo la sua voce... ¡Sob!\n@c0@"
  ja: "@a@bサンチョ「うおおお……！\n\tあの　なつかしいお声は\n\tマーサさま！！\n@c0@"
19:
  de: "@aSancho@bJetzt ist es nisst mehr weit, Chico!\nDeine Madre wartet dort auf diss!\n@c0@"
  en: "@aSancho@bEes no far now, friend!\nYour madre, eshe ees thees way.\n@c0@"
  es: "@aSancho@b¡Ya no está lejos, chamaco!\nTú madre está por acá.\n@c0@"
  fr: "@aSancho@bOn y est p-presque, chicoⓠ\nTa madre, elle est par-là.\n@c0@"
  it: "@aSancho@b¡Vamonos, chico!\n¡Tua madre no está muy lontana!\n¡Da esta parte!\n@c0@"
  ja: "@a@bサンチョ「%a000090王！\n\tやはり　マーサさまは　まちがいなく\n\tこの先に　おられますぞ！！\n@c0@"
20:
  de: "@aOtto@bGrundgütige! Was für ein außergewöhnlicher Stein! Und ich spüre, dass er eine sehr rätselhafte Macht in sich birgt.\n@c0@"
  en: "@aTuppence@bGood heavens! What an exquisite stone! I can sense a very mysterious power within it too.\n@c0@"
  es: "@aAlazar@b¡Cielo santo! ¡Qué piedra tan exquisita! Y de ella emana un poder muy misterioso.\n@c0@"
  fr: "@aInnocent@bPar la Déesseⓠ Quelle pierre magnifiqueⓠ Je sens aussi qu'elle renferme un pouvoir très mystérieux.\n@c0@"
  it: "@aSimon@bSanti numi, che pietra meravigliosa!\n...\nSento che è dotata di un potere incredibile...\n@c0@"
  ja: "@a@bピピン「おおっ！　これは　なんと\n\t美しい石でしょうか……。\n\tふしぎな強いチカラを　感じますよ。\n@c0@"
21:
  de: "@aBianca@bKomm, %a000090. Wir wollen hier nicht länger bleiben als unbedingt notwendig.\n@c0@"
  en: "@aBianca@bCome on, %a000090. We dun't want to hang around here any longer than we have to.\n@c0@"
  es: "@aBianca@bVamos, %a000090. No nos vamos a quedar por aquí más tiempo del estrictamente necesario, ¿sabes?\n@c0@"
  fr: "@aBianca@bViens, %a000090. On ne va pas traîner ici plus qu'il ne le faut.\n@c0@"
  it: "@aBianca@bForza, %a000090! Facciamo in fretta!\nNon voglio trascorre un solo secondo più del necessario in questo posto maledetto!\n@c0@"
  ja: "@a@bビアンカ「さあ　行きましょう　%a000090。\n\tこんなところで　グズグズしていると\n\t時間が　もったいないわ。\n@c0@"
22:
  de: "@aNera@bJetzt gibt es nur noch eine Sache für uns zu tun. Los, beeilen wir uns.\n@c0@"
  en: "@aNera@bNow we're here in Nadiria, there's just one thing for us to do. We should hurry.\n@c0@"
  es: "@aNera@bAhora que estamos en Nadiria, solo nos queda una cosa per hacer, y hay que hacerla presto.\n@c0@"
  fr: "@aNera@bMaintenant que nous sommes à Nadiria, il ne nous reste plus qu'une chose à faire. Dépêchons-nous.\n@c0@"
  it: "@aNera@bOra che siamo a Nadiria, ci resta un'ultima impresa da compiere...\nFacciamo presto!\n@c0@"
  ja: "@a@bフローラ「魔界へ来た以上\n\tやることは　ただ　ひとつですわ。\n\tさあ　行きましょう。\n@c0@"
23:
  de: "@a%0%a001240@bIch werde mich wirklich anstrengen, Papa. Wir werden den Großmeister der Unterwelt besiegen, da bin ich mir ganz sicher!\n@c0@"
  en: "@a%0%a001240@bI'm going to try really hard, Dad. We'll defeat the Grandmaster of the Underworld, you'll see!\n@c0@"
  es: "@a%0%a001240@bMe voy a esforzar mucho, papá. ¡Venceremos al Gran Maestro del Inframundo, ya verás!\n@c0@"
  fr: "@a%0%a001240@bJe vais faire de mon mieux, papa. Nous vaincrons le Grand Maître des Enfers, tu verrasⓠ\n@c0@"
  it: "@a%0%a001240@bPapà, abbi fiducia...\nSconfiggeremo il Gran Maestro degli Inferi!\nCe la faremo!\n@c0@"
  ja: "@a@b%a001240「お父さん　ボクがんばるよ！\n\t大魔王を　たおすまで！！\n@c0@"
24:
  de: "@a%0%a001250@bEs ist doch alles in Ordnung, Papa, oder? Wir sind alle hier, und alles wird wieder gut, nicht wahr?\n@c0@"
  en: "@a%0%a001250@bEverything's alright, isn't it, Dad? We're all here, so everything's going to be fine, right?\n@c0@"
  es: "@a%0%a001250@bTodo va bien, ¿verdad, papi? Todos estamos aquí, así que todo saldrá bien, ¿verdad?\n@c0@"
  fr: "@a%0%a001250@bTout va bien, pas vrai, papaⓡ Nous sommes tous ensemble, alors tout va bien se passer, heinⓡ\n@c0@"
  it: "@a%0%a001250@bPapà, ora mi sento più tranquilla.\nHo la sensazione che tutto si risolverà per il meglio!\n@c0@"
  ja: "@a@b%a001250「お父さん　大丈夫よね？\n\tみんな　いるから　大丈夫よね？\n@c0@"
25:
  de: "@aGriselda@bIgitt. Dieser Ort gefällt mir gar nicht. Hier ist alles so... anders.\n@c0@"
  en: "@aDebora@bUrgh. This place has a horrible feel to it.\nIt's certainly not normal.\n@c0@"
  es: "@aStefania@bMmm. Este lugar me da una sensazione extraña.\nNo es normal, eso sicuro.\n@c0@"
  fr: "@aPandora@bBeurk. Cet endroit a quelque chose de vraiment horrible. Ça n'est pas normal.\n@c0@"
  it: "@aViola@bChe luogo terrificante...\n@c0@"
  ja: "@a@bデボラ「なんなの　この　気持ち悪い気配……\n\tあきらかに　ふつうじゃないわ。\n@c0@"
26:
  de: "@aGriselda@bDiese Stimme... War das deine Mutter, %a000090? Jetzt kann es nicht mehr lange dauern...\n@c0@"
  en: "@aDebora@bThat voice... Was that your mother, %a000090?\nIt won't be long now before you meet her.\n@c0@"
  es: "@aStefania@bEsa voce... ¿Era la tua mamma, %a000090?\nPronto podré conocerla.\n@c0@"
  fr: "@aPandora@bCette voix... C'était ta mère, %a000090ⓡ\nCette fois, tu n'as plus guère à attendre avant\nde la retrouver.\n@c0@"
  it: "@aViola@bQuella voce...\nEra tua madre, %a000090, non è vero?\nSorridi, caro... Presto potrai riabbracciarla.\n@c0@"
  ja: "@a@bデボラ「今の声…　%a000090のママなの！？\n\tそう…　もうすぐ会えるのね。\n@c0@"
27:
  de: "@aGriselda@bDeine Mutter hat ein paar beeindruckende Tricks in petto.\n@c0@"
  en: "@aDebora@bYour mother certainly has some impressive powers up her sleeve.\n@c0@"
  es: "@aStefania@bLa tua mamma tenía guardados en la manga unos poderes impresionantes.\n@c0@"
  fr: "@aPandora@bTa mère a indiscutablement d'immenses pouvoirs.\n@c0@"
  it: "@aViola@bTua madre è dotata di poteri incredibili.\n@c0@"
  ja: "@a@bデボラ「それにしても……\n\t%a000090のママって\n\t本当に　すごいチカラをもっているのね。\n@c0@"
28:
  de: "@aGriselda@bWenn sie mit uns reden kann, obwohl sie von Monstern gefangen gehalten wird... Ich kann verstehen, dass Nimzo sie als Gefahr ansieht.\n@c0@"
  en: "@aDebora@bTo be able to speak with us even when she's in the clutches of the monsters... I can understand why Nimzo sees her as a threat.\n@c0@"
  es: "@aStefania@bSi hasta puede parlare con nosotros mientras está en las garras de los monstruos... Ya capisco por qué es una amenaza para Nimzo.\n@c0@"
  fr: "@aPandora@bÊtre capable de nous parler alors qu'elle se trouve entre les griffes des monstres... Je comprends pourquoi Nimzo la considère comme une menace.\n@c0@"
