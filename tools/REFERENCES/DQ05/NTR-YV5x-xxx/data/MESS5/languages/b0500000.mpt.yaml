  ja: "@a@bヘンリー「オレのことは\n\t気にしなくていいから　%a000090\n\t旅を　続けようぜ。\n@c0@"
378:
  de: "@aHarry@bWeißt du... Maria ist die erste Frau, die ich kenne, die nicht nur wunderschön ist, sondern dazu auch noch ein gutes Herz hat.\n@c0@"
