  it: "@aAmandina@bTee eh eh! Quel poveretto sta impazzendo!\nIo ho scritto il messaggio, e io l'ho cancellato!\n@c0@"
  ja: "@a@bべラ「うふふ。\n\t私が書いた　いたずら書きだからね\n\t自分で　消しておいたの。\n@c0@"
207:
  de: "@aZuckerchen@bWeißt du, ich bin wirklich eine gute kleine Fee. Deshalb hat Marmela mich ausgewählt.\n@c0@"
  en: "@aHoney@bYou see, I'm really quite a good little faerie.\nThat's why Treacle chose me.\n@c0@"
  es: "@aDulce@bSoy un hada buena, ¿sabes?\r\nPor eso me ha elegido Miel.\n@c0@"
  fr: "@aCandy@bTu vois, je suis vraiment une bonne petite fée.\r\nC'est pour ça que Mélissa m'a choisie.\n@c0@"
  it: "@aAmandina@bCome vedi, sono una fata molto abile.\nEcco perché Adusya ha scelto me per compiere questa missione.\n@c0@"
  ja: "@a@bべラ「私って　けっこう　きちんと\n\tしてるのよ。　この辺がポワンさまに\n\t信頼される　ゆえんかしら！\n@c0@"
208:
  de: "@aZuckerchen@bJemand ist hinter deinem Vater her?\nOh nein! Also sind wir Feen wohl nicht die Einzigen, die Probleme haben.\n@c0@"
  en: "@aHoney@bSomeone's after your father?\nOh no! I suppose we faeries aren't the only ones with problems.\n@c0@"
  es: "@aDulce@b¿Alguien persigue a tu padre?\r\n¡Oh, no! Supongo que no solo las hadas tenemos problemas.\n@c0@"
  fr: "@aCandy@bQuelqu'un en après ton pèreⓡ Oh nonⓠ Apparemment, les fées ne sont pas les seules à avoir des problèmes.\n@c0@"
  it: "@aAmandina@bQualcuno vuole fare del male a tuo padre?\nOh, no!\nAllora non siamo solo noi fate ad avere problemi!\n@c0@"
  ja: "@a@bべラ「あなたの　お父さん\n\tねらわれてるの？\n\t人間の世界も　大変なのね。\n@c0@"
209:
  de: "@aZuckerchen@bDu wirst deinen Vater beschützen. Das weiß ich. Und ich passe auch auf euch beide auf.\n@c0@"
  en: "@aHoney@bYou'll help protect your father. I know you will. And I'll be looking out for you both too.\n@c0@"
  es: "@aDulce@bTú protegerás a tu padre. Estoy segura. Y yo también cuidaré de los dos.\n@c0@"
  fr: "@aCandy@bTu vas protéger ton père. J'en suis sûre.\r\nEt moi aussi, je veillerai sur vous deux.\n@c0@"
  it: "@aAmandina@bRiuscirai a proteggere tuo padre.\nSo che ce la farai.\nE io ti aiuterò, te lo prometto!\n@c0@"
  ja: "@a@bベラ「あなたなら　きっと\n\tお父さんの　チカラになれるわ。\n\t私も　おうえんしているわね。\n@c0@"
210:
  de: "@aZuckerchen@bDer legendäre Held? Aber... den gibt's doch gar nicht?\nIch meine, eine Legende ist doch nur eine Legende, oder?\n@c0@"
  en: "@aHoney@bThe legendary hero? But...he's not real, is he?\r\nI mean, a legend's a legend, isn't it?\n@c0@"
  es: "@aDulce@b¿El héroe legendario? Pero... si no existe, ¿no?\r\nBueno, una leyenda es eso, una leyenda, ¿no?\n@c0@"
  fr: "@aCandy@bLe héros légendaireⓡ\nMais... il n'existe pas vraiment, siⓡ\nS'il est légendaire, c'est que c'est une légende, nonⓡ\n@c0@"
  it: "@aAmandina@bL'eroe della leggenda?! Mica esiste davvero!\nCome dice il nome, è solo una leggenda! Altrimenti si sarebbe chiamato ⓕl'eroe della realtàⓖ, non credi?\n@c0@"
  ja: "@a@bベラ「伝説の勇者か…\n\t聞いたことはあるけど　伝説は伝説。\n\t本当に存在するのか　わからないわ。\n@c0@"
211:
  de: "@aZuckerchen@bWenn dein Vater wirklich ein König war, dann wärst du ja ein Prinz!\n@c0@"
  en: "@aHoney@bIf your father really was a king, that would make you a prince!\n@c0@"
  es: "@aDulce@bSi tu padre fuese de verdad un rey, entonces ¡tú serías un príncipe!\n@c0@"
  fr: "@aCandy@bSi ton père est vraiment un roi, ça veut dire\nque tu es un princeⓠ\n@c0@"
  it: "@aAmandina@bSe tuo padre fosse un re, tu saresti un principe!\n@c0@"
  ja: "@a@bべラ「もし　あなたのお父さんが\n\t王さまだったんなら\n\tあなたは　王子さまね。\n@c0@"
212:
  de: "@aZuckerchen@bAlso, Prinz %a000090!\nDie Fee Zuckerchen bittet hiermit demütigst um Eure Unterstützung bei der Rettung ihrer Heimat. Hi hi hi!\n@c0@"
  en: "@aHoney@bSo, Prince %a000090! I, Honey the faerie, humbly request your assistance to save my homeland. ...Tee hee hee!\n@c0@"
  es: "@aDulce@b¡Bueno, príncipe %a000090! Yo, el hada Dulce, solicito humildemente vuestra ayuda para salvar mi país. ¡Ji, ji, ji!\n@c0@"
  fr: "@aCandy@bPrince %a000090ⓠ Moi, Candy la fée, j'implore humblement votre aide pour sauver mon pays natal...\nTi-hi-hiⓠ\n@c0@"
  it: "@aAmandina@bAllora, principe %a000090! Io, la fata Amandina, la supplico umilmente di salvare il mio regno.\nTee eh eh!\n@c0@"
  ja: "@a@bべラ「さあ　%a000090王子。\n\t私たち妖精のために　チカラを\n\tお貸しください…　なんてねっ！\n@c0@"
213:
  de: "@aZuckerchen@bWenn dein Vater wirklich ein König war, dann wärst du ja ein Prinz!\n@c0@"
  en: "@aHoney@bIf your father really was a king, that would make you a prince!\n@c0@"
  es: "@aDulce@bSi tu padre fuese de verdad un rey, entonces ¡tú serías un príncipe!\n@c0@"
  fr: "@aCandy@bSi ton père est vraiment un roi, ça veut dire\nque tu es un princeⓠ\n@c0@"
  it: "@aAmandina@bSe tuo padre fosse un re, tu saresti un principe!\n@c0@"
  ja: "@a@bべラ「もし　あなたのお父さんが\n\t王さまだったんなら\n\tあなたは　王子さまね。\n@c0@"
214:
  de: "@aZuckerchen@bTja, Prinz %a000090! Es war uns eine große Ehre, dass Eure Königliche Majestät uns so viel Unterstützung zuteil werden ließ! Hi hi hi!\n@c0@"
  en: "@aHoney@bWell, Prince %a000090! One is most honoured to have been assisted by Your Royal Highliness! ...Tee hee hee!\n@c0@"
  es: "@aDulce@b¡Bueno, príncipe %a000090! ¡Me siento realmente honrada de haber recibido la ayuda de Su Alteza Real! ¡Ji, ji, ji!\n@c0@"
  fr: "@aCandy@bPrince %a000090ⓠ Votre servante est vraiment très honorée d'avoir été aidée par votre Royale Altesseⓠ ... Ti-hi-hiⓠ\n@c0@"
  it: "@aAmandina@bPrincipe %a000090, sono onorata di aver ricevuto aiuto da Sua Altezza Reale!\nTee eh eh!\n@c0@"
  ja: "@a@bべラ「%a000090王子　私たち妖精のために\n\tチカラを　お貸しくださり\n\tありがとうございました　なんてね！\n@c0@"
215:
  de: "@aZuckerchen@bGenauso geht es mir auch! Wenn du mich ansiehst, dann wird mir ganz warm ums Herz! \n@c0@"
  en: "@aHoney@bThat's exactly what I think too! When you look at me, I feel all fuzzy and warm inside!\n@c0@"
  es: "@aDulce@b¡Eso mismo pienso yo! ¡Cuando me miras, siento calorcito y mariposas!\n@c0@"
  fr: "@aCandy@bC'est exactement ce que je pense, moi aussiⓠ\nQuand tu me regardes, ça me fait tout chaud\nau cœurⓠ\n@c0@"
  it: "@aAmandina@bHa ragione! È proprio così!\nQuando mi guardi, mi mandi in confusione!\n@c0@"
  ja: "@a@bべラ「じつは　私もそう思ってたの。\n\tあなたの目で　見つめられると\n\tやさしい気持ちに　なるなあって。\n@c0@"
216:
  de: "@aZuckerchen@bUnd du kannst mich sehen. Du hast auf jeden Fall bessere Augen als die anderen Menschen!\n@c0@"
  en: "@aHoney@bAnd you can see me. You've definitely got better eyes than all the other humans!\n@c0@"
  es: "@aDulce@bY tú puedes verme. ¡Tienes mejores ojos que los demás humanos, eso seguro!\n@c0@"
  fr: "@aCandy@bEt puis tu peux me voir. Tu as définitivement de meilleurs yeux que tous les autres humainsⓠ\n@c0@"
  it: "@aAmandina@bDico davvero!\nNon avevo mai visto un essere umano con occhi belli e profondi quanto i tuoi.\n@c0@"
  ja: "@a@bべラ「私の姿を見ることができるし\n\tきっと　特別な目なのね。\n@c0@"
217:
  de: "@aZuckerchen@bIn dieser kleinen Ortschaft wird einem immer gleich ganz warm ums Herz, so freundlich sind hier alle.\n@c0@"
  en: "@aHoney@bThere's a lovely warm atmosphere in this little town.\n@c0@"
  es: "@aDulce@bEste pueblito tiene un ambiente de lo más cálido y acogedor.\n@c0@"
  fr: "@aCandy@bIl y a vraiment une atmosphère chaleureuse dans cette petite ville.\n@c0@"
  it: "@aAmandina@bIn questo villaggio si respira un'atmosfera calda e accogliente...\n@c0@"
  ja: "@a@bべラ「この村は　やさしい空気が\n\t流れているのね。\n\tなんだか　ホッとするわ。\n@c0@"
218:
  de: "@aZuckerchen@bBist du jetzt bereit, ins Reich der Feen zurückzukehren? Also gut, dann bereite dich besser auf den Kampf vor!\n@c0@"
  en: "@aHoney@bYou're ready to go back to the Realm of the Faeries now? Alright then, better prepare for battle!\n@c0@"
  es: "@aDulce@b¿Estás listo para volver ya al Reino de las Hadas? ¡Muy bien, prepárate para la batalla!\n@c0@"
  fr: "@aCandy@bTu es prêt à retourner au royaume des Fées,\nà présentⓡ Bon, mieux vaut se préparer au\ncombat, dans ce casⓠ\n@c0@"
  it: "@aAmandina@bSei pronto per tornare nel Regno delle Fate?\nBene! Allora preparati a combattere!\n@c0@"
  ja: "@a@bべラ「妖精の国へ　もどるのね。\n\tさあ　気合いを入れて\n\t戦いに　行きましょう！\n@c0@"
219:
  de: "@aZuckerchen@bDann lass uns jetzt nach Feenaue zurückkehren. Marmela wird überglücklich sein!\n@c0@"
  en: "@aHoney@bLet's go back to Faerie Lea, then.\nTreacle will be over the moon!\n@c0@"
  es: "@aDulce@bVolvamos a Hadavilla.\r\n¡Miel se pondrá radiante de alegría!\n@c0@"
  fr: "@aCandy@bRetournons à Féeria, alors. Mélissa sera aux angesⓠ\n@c0@"
  it: "@aAmandina@bTorniamo nel Regno delle Fate.\nAdusya sarà contentissima!\n@c0@"
  ja: "@a@bベラ「さあ　妖精の国へ\n\tもどりましょう！　ポワンさまも\n\tきっと　ほめてくださるわ！\n@c0@"
220:
  de: "@aZuckerchen@bAch, bin ich dir hier nicht zum ersten Mal begegnet, %a000090?\n@c0@"
  en: "@aHoney@bActually, this is where I first met you, isn't it, %a000090?\n@c0@"
  es: "@aDulce@bAquí es donde nos vimos por primera vez, ¿verdad, %a000090?\n@c0@"
  fr: "@aCandy@bEn fait, c'est ici que je t'ai rencontré pour la première fois, n'est-ce pas, %a000090ⓡ\n@c0@"
  it: "@aAmandina@bÈ qui che ti ho incontrato per la prima volta, %a000090...\nTe ne ricordi, vero?\n@c0@"
  ja: "@a@bべラ「そういえば　%a000090とは\n\tここで　出会ったのよね。\n@c0@"
221:
  de: "@aZuckerchen@bIch war derart deprimiert, weil niemand mich sehen konnte, dass ich angefangen habe, lauthals zu singen.\n@c0@"
  en: "@aHoney@bI was at such a loss because no one could see me that I started to sing at the top of my voice.\n@c0@"
  es: "@aDulce@bNo sabía qué hacer, nadie podía verme, así que empecé a cantar tan alto como pude.\n@c0@"
  fr: "@aCandy@bPersonne ne me voyait, alors j'étais tellement désemparée que j'ai commencé à chanter le plus\r\nfort possible.\n@c0@"
  it: "@aAmandina@bEro disperata... Non sapevo più cosa fare!\r\nNessuno poteva vedermi, così decisi di mettermi a cantare più forte che potevo.\n@c0@"
  ja: "@a@bべラ「あの時は　誰も　\n\t私に　気づいてくれなくて　\n\tとほうにくれて　歌ってたの。\n@c0@"
222:
  de: "@aZuckerchen@bUnd dann hast du mit mir gesprochen. Ich war so glücklich, ich hätte vor Freude platzen können!\n@c0@"
  en: "@aHoney@bAnd then you spoke to me. I was so happy, I could have burst!\n@c0@"
  es: "@aDulce@b¡Y, cuando me hablaste, creí que iba a estallar de alegría!\n@c0@"
  fr: "@aCandy@bEt là, tu m'as parlé. J'étais tellement contente que j'ai cru que j'allais exploser de joieⓠ\n@c0@"
  it: "@aAmandina@bE quando ti sei rivolto a me, ero così felice che quasi sono scoppiata a piangere per la contentezza!\n@c0@"
  ja: "@a@bべラ「だから　%a000090が\n\t話しかけてくれた時は\n\t本当に　うれしかったのよ。\n@c0@"
223:
  de: "@aZuckerchen@bAlso gibt es Menschen, die in solchen kleinen Höhlen leben? Ich dachte, so was machen nur die Zwerge. Ihr seid schon komische Gesellen. \n@c0@"
  en: "@aHoney@bSo some of you humans live in little caves like this? I thought only the dwarfs did that. You're a funny lot.\n@c0@"
  es: "@aDulce@b¿Así que algunos humanos viven en pequeñas cuevas como esta? Pensaba que eso solo lo hacían los enanos. Qué extraños sois.\n@c0@"
  fr: "@aCandy@bAlors comme ça, certains humains vivent dans de petites grottes comme celle-ciⓡ\n㈡\nJe croyais qu'il n'y avait que les nains pour faire ça.\nVous êtes bizarres.\n@c0@"
  it: "@aAmandina@bAnche gli esseri umani vivono in piccole grotte come questa? Pensavo che lo facessero solo i nani... Certo che siete davvero delle creature bizzarre!\n@c0@"
  ja: "@a@bべラ「人間でも　こんな穴の中に\n\t住んでる人が　いるのね。\n\tなんだか　ドワーフみたい。\n@c0@"
224:
  de: "@aZuckerchen@bHi hi! Vielleicht haben wir's ein wenig übertrieben.\n@c0@"
  en: "@aHoney@bTee hee! Maybe we overdid it a bit.\n@c0@"
  es: "@aDulce@b¡Ji, ji! A lo mejor nos hemos pasado un pelín.\n@c0@"
  fr: "@aCandy@bTi-hiⓠ Peut-être qu'on a un peu trop forcé.\n@c0@"
  it: "@aAmandina@bUhm, forse ho esagerato un po'...\n@c0@"
  ja: "@a@bベラ「少し　私たち\n\t無理しちゃったみたいね。\n@c0@"
225:
  de: "@aZuckerchen@bDu bist ja noch so jung. Ich sollte dich wohl etwas schonen...\n@c0@"
  en: "@aHoney@bYou're only young. I shouldn't push you so hard...\n@c0@"
  es: "@aDulce@bEres muy joven. No debería forzarte demasiado...\n@c0@"
  fr: "@aCandy@bTu es encore jeune. Je n'aurais pas dû te pousser autant...\n@c0@"
  it: "@aAmandina@bSei ancora giovane e inseperto.\nNon dovrei pretendere tanto da te...\n@c0@"
  ja: "@a@bベラ「あなたは　まだ　小さいんだから\n\tあせらず　ゆっくり　行きましょう。\n@c0@"
226:
  de: "@aZuckerchen@bVöllig ausgelöscht! Man möchte kaum glauben, dass wir vor kurzem noch die Winterkönigin besiegt haben. Tja, offenbar lässt unsere Konzentration nach.\n@c0@"
  en: "@aHoney@bNo one would believe we beat the Winter Queen before, getting wiped out like that! Must've been a lapse of concentration, I suppose.\n@c0@"
  es: "@aDulce@b¡Después de la paliza que hemos recibido, nadie creería que hemos derrotado a la Reina de las Nieves! Será porque nos hemos distraído un momento.\n@c0@"
  fr: "@aCandy@bPersonne ne croirait que nous avons déjà vaincu la reine de l'Hiver à nous voir battus comme çaⓠ\n㈡\nC'est sûrement à cause d'un manque de concentration.\n@c0@"
  it: "@aAmandina@bSe qualcuno sapesse che figuraccia abbiamo fatto, non crederebbe mai che prima abbiamo sconfitto la Regina dell'Inverno! Forse ci siamo deconcentrati...\n@c0@"
  ja: "@a@bベラ「雪の女王を　やっつけたのに\n\tあんな　魔物に　やられちゃうなんて\n\tゆだんしちゃったかしら。\n@c0@"
227:
  de: "@aZuckerchen@bWie dem auch sei, Marmela wartet auf uns. Ich kann's kaum erwarten, ihr Gesicht zu sehen, wenn wir ihr den Frühlingsboten bringen!\n@c0@"
  en: "@aHoney@bAnyway, Treacle's expecting us. I can't wait to see her face when we take her the Herald of Spring!\n@c0@"
  es: "@aDulce@bEn fin, Miel nos está esperando. ¡Estoy ansiosa por ver su cara cuando le llevemos el Heraldo de la Primavera!\n@c0@"
  fr: "@aCandy@bQuoi qu'il en soit, Mélissa nous attend.\nJ'ai hâte de voir sa tête quand nous lui\nremettrons le Messager du Printempsⓠ\n@c0@"
  it: "@aAmandina@bOh, non importa. Adusya ci sta aspettando.\nNon vedo l'ora di dirle che ci siamo ripresi il Richiamo della Primavera!\n@c0@"
  ja: "@a@bベラ「さあ　ポワンさまが　お待ちだわ。\n\tフルートを　お届けしましょう！\n@c0@"
228:
  de: "@aZuckerchen@bAuf gute Zusammenarbeit, %a000090!\n@c0@"
  en: "@aHoney@bI hope we'll make a good team, %a000090!\n@c0@"
  es: "@aDulce@b¡Espero que formemos buen equipo, %a000090!\n@c0@"
  fr: "@aCandy@bJ'espère qu'on fera une bonne équipe, %a000090ⓠ\n@c0@"
  it: "@aAmandina@bSpero che saremo una bella squadra, %a000090!\n@c0@"
  ja: "@a@bベラ「いっしょに　がんばりましょう。\n\tよろしくね　%a000090！\n@c0@"
229:
  de: "@aZuckerchen@bIch wusste es. Marmela zweifelt an dir, weil du noch so jung bist.\n@c0@"
  en: "@aHoney@bI knew it. Treacle's not sure about you because you're so young.\n@c0@"
  es: "@aDulce@bLo sabía. Miel no está segura de que lo puedas hacer bien porque eres muy joven.\n@c0@"
  fr: "@aCandy@bJ'en étais sûre. Mélissa n'est pas très convaincue parce que tu es très jeune.\n@c0@"
  it: "@aAmandina@bProprio come immaginavo... Anche se non lo ha detto apertamente, Adusya ha qualche dubbio sulle tue capacità, perché sei molto giovane.\n@c0@"
  ja: "@a@bベラ「ポワンさまったら\n\t私を　おともにつけるだなんて…\n@c0@"
230:
  de: "@aZuckerchen@bDeshalb möchte sie, dass ich dich begleite. Um sicherzugehen, dass dir nichts passiert.\n@c0@"
  en: "@aHoney@bThat's why she wants me to go along with you:\r\nto make sure nothing happens to you.\n@c0@"
  es: "@aDulce@bPor eso quiere que vaya contigo y me asegure de que no te pasa nada.\n@c0@"
  fr: "@aCandy@bC'est pour ça qu'elle veut que je t'accompagne.\r\nPour être sûre qu'il ne t'arrivera rien.\n@c0@"
  it: "@aAmandina@bEcco perché mi ha chiesto di accompagnarti.\nVuole essere certa che non ti accada nulla.\n@c0@"
  ja: "@a@bベラ「やっぱり　心の中では\n\t小さな子供じゃ　不安だと\n\t思っていらっしゃるのかしら…。\n@c0@"
231:
  de: "@aZuckerchen@bEs stimmt schon, wir Feen sind nicht besonders stark. Aber wir können prima mit Magie umgehen. Du kannst alle Heilungs- und Hilfszauber ruhig mir überlassen!\n@c0@"
  en: "@aHoney@bIt's true that we faeries aren't very strong, but we're amazing at magic. You can leave all the healing and support spells to me!\n@c0@"
  es: "@aDulce@bEs cierto que las hadas no son muy fuertes, pero nuestra magia es asombrosa. ¡Déjame a mí los conjuros de curación y apoyo!\n@c0@"
  fr: "@aCandy@bC'est vrai que nous autres, les fées, nous ne sommes pas très fortes, mais nous sommes très douées pour la magie.\n㈡\nTu peux compter sur moi pour tous les sorts de soin et de soutienⓠ\n@c0@"
  it: "@aAmandina@bNoi fate non siamo forti fisicamente, ma i nostri poteri magici sono strabilianti! E io sono bravissima a lanciare incantesimi di guarigione e di supporto!\n@c0@"
  ja: "@a@bベラ「たしかに　私たち　力はないけど\n\t呪文は　それなりに使えるの。\n\tだから　補助は　まかせてね。\n@c0@"
232:
  de: "@aZuckerchen@bVielleicht friert die Welt wirklich vollständig zu, wenn wir den Frühlingsboten nicht zurückbekommen...\n@c0@"
  en: "@aHoney@bMaybe the world really will freeze over completely if we can't get the Herald of Spring back...\n@c0@"
  es: "@aDulce@bSi no conseguimos el Heraldo de la Primavera es posible que el mundo se congele por completo de verdad.\n@c0@"
  fr: "@aCandy@bPeut-être que le monde gèlera entièrement\r\nsi nous n'arrivons pas à récupérer le\r\nMessager du Printemps...\n@c0@"
  it: "@aAmandina@bIl mondo finirà congelato, se non riusciremo a recuperare il Richiamo della Primavera...\n@c0@"
  ja: "@a@bベラ「このままだと\n\t世界中が　凍ってしまう日が\n\t来るかも知れないわね。\n@c0@"
233:
  de: "@aZuckerchen@bNa ja, keine von uns Feen weiß, was in diesem Winterpalast vor sich geht.\n@c0@"
  en: "@aHoney@bNone of us faeries knows what's going on inside the Winter Palace, you see.\n@c0@"
  es: "@aDulce@bNingún hada sabe qué sucede en el interior del Palacio de las Nieves.\n@c0@"
  fr: "@aCandy@bAucune fée ne sait ce qui se passe à l'intérieur du palais de l'Hiver, tu vois.\n@c0@"
  it: "@aAmandina@bNessuna di noi fate sa cosa sta accadendo all'interno del Palazzo Algido...\n@c0@"
  ja: "@a@bベラ「だから　氷の館の中が\n\tどうなっているか　知る妖精は\n\tひとりもいないのよ。\n@c0@"
234:
  de: "@aZuckerchen@bWas haben die Leute bloß? Du wirst einen großen Krieger abgeben, die werden schon sehen. Komm!\nWir müssen uns in die Kälte hinauswagen...\n@c0@"
  en: "@aHoney@bWhat's wrong with everyone!? You'll make a great warrior, they'll see. Come on! We need to head out into the cold...\n@c0@"
  es: "@aDulce@b¿Qué le pasa a todo el mundo? Serás un gran guerrero, ya verás. ¡Vamos! Tenemos que librarnos de este frío...\n@c0@"
  fr: "@aCandy@bMais qu'est-ce qu'elles ont toutesⓡⓐ Tu feras\nun fantastique guerrier, elles verront bienⓠ\nAllez, viensⓠ Il faut qu'on parte dans le froid...\n@c0@"
  it: "@aAmandina@bAbbi fiducia, mio piccolo amico.\nSono certa che porterai a termine la missione.\nMettiamoci in marcia!\n@c0@"
  ja: "@a@bベラ「氷の館か…　ただでさえ\n\t寒いのに　もっと　寒いところへ\n\t行かなきゃいけないのね。\n@c0@"
235:
  de: "@aZuckerchen@bOh ja! Der Frühling in Feenaue ist wunderschön!\nAlles ist von Blüten bedeckt. Die ganze Umgebung bekommt einen richtig süßen rosa Stich.\n@c0@"
  en: "@aHoney@bOh, yes! The spring in Faerie Lea is wonderful!\nBlossom covers everything. Even the air takes on a sweet, pink tinge.\n@c0@"
  es: "@aDulce@b¡Oh, sí! ¡La primavera en Hadavilla es maravillosa!\r\nLas flores lo cubren todo. Hasta el aire se vuelve dulzón, delicioso.\n@c0@"
  fr: "@aCandy@bOh, ouiⓠ Le printemps à Féeria est magnifiqueⓠ\nLes fleurs recouvrent tout. Même l'air prend une teinte rose et douce.\n@c0@"
  it: "@aAmandina@bAh, sì! La primavera a Domus Fatae è splendida!\nI fiori ricoprono ogni cosa, e l'aria si tinge di rosa...\n@c0@"
  ja: "@a@bベラ「妖精の村の春は　桜が咲き乱れて\n\t風すら　桜色に　そまって見えて…\n\tそれは　もう　きれいなのよ！\n@c0@"
236:
  de: "@aZuckerchen@bIch finde, Marmela hat recht. Wieso sollten wir nicht alle zusammenleben? Diese Fee heißt Butterbonbon, aber wir nennen sie Bitterbonbon! Hi hi hi!\n@c0@"
  en: "@aHoney@bWell I think Treacle's right. Why shouldn't we all live together? That faerie's called Butterscotch, but we call her Bitterscotch! Tee hee hee!\n@c0@"
  es: "@aDulce@bYo creo que Miel tiene razón. ¿Por qué no vivir todos juntos? ¡Esa hada se llama Caramela, pero la llamamos Agriamela! ¡Ji, ji, ji!\n@c0@"
  fr: "@aCandy@bMoi, je crois que Mélissa a raison. Pourquoi ne pourrait-on pas vivre tous ensembleⓡ\n㈡\nCette fée s'appelle Bonbon, mais on la surnomme Casse-bonbonⓠ Ti-hi-hiⓠ\n@c0@"
  it: "@aAmandina@bSecondo me ha ragione Adusya. Perché creature diverse non dovrebbero vivere insieme? Quella fata è Placidina, ma sarebbe meglio chiamarla ⓕAcidinaⓖ!\n@c0@"
  ja: "@a@bベラ「私は　ポワンさまの考えに\n\t大賛成だから　ああいう言葉を\n\t聞くと　悲しくなってしまうの。\n@c0@"
237:
  de: "@aZuckerchen@bBestimmt können Feen und Menschen und Monster alle zusammenleben, wenn wir uns nur ein bisschen Mühe geben!\n@c0@"
  en: "@aHoney@bI'm sure faeries and humans and monsters can all live together if we all try really hard!\n@c0@"
  es: "@aDulce@b¡Si lo intentamos de verdad, seguro que hadas, humanos y monstruos podemos convivir en paz!\n@c0@"
  fr: "@aCandy@bJe suis convaincue que les fées, les humains et les monstres pourraient vivre tous ensemble si chacun faisait des effortsⓠ\n@c0@"
  it: "@aAmandina@bSono certa che fate, esseri umani e mostri potrebbero vivere insieme in armonia, se ciascuno di noi facesse la sua parte.\n@c0@"
  ja: "@a@bベラ「みんなで　仲良くくらせる日が\n\t来るといいのにね。\n@c0@"
238:
  de: "@aZuckerchen@bDer Schleim hat immer gesagt: ⓞIch bin kein schlechter Schleim, wisst Ihr!ⓟ Und das stimmt auch. Er hat all seine bösen Monsterinstinkte hinter sich gelassen.\n@c0@"
  en: "@aHoney@bThat slime always used to say, ⓗI'm not a bad slime, you know!ⓘ And it's true. It left all its bad monster instincts behind.\n@c0@"
  es: "@aDulce@bEse limo siempre decía: ⓕ¡no soy un limo malo!ⓖ, y es cierto. Dejó atrás todos sus instintos malignos de monstruo.\n@c0@"
  fr: "@aCandy@bAvant, ce gluant disait toujoursⓢ ⓥJe ne suis pas un mauvais gluant, vous savezⓠⓦ, et c'est vrai. Il a abandonné tous ses mauvais instincts de monstre.\n@c0@"
  it: "@aAmandina@bQuello Slime diceva sempre: ⓕIo non sono cattivo!ⓖ, e aveva ragione!\nSi è liberato per sempre dei suoi istinti aggressivi.\n@c0@"
  ja: "@a@bベラ「あのスライムくん\n\tいつだったか　急に　邪悪な心が\n\t抜けちゃったみたいで…。\n@c0@"
239:
  de: "@aZuckerchen@bEr ist ganz alleine durch die Gegend gezogen, als Marmela ihm angeboten hat, in Feenaue zu leben.\n@c0@"
  en: "@aHoney@bIt was just wandering about on its own when Treacle invited it to live in Faerie Lea.\n@c0@"
  es: "@aDulce@bIba vagando por ahí asolo cuando Miel lo invitó a vivir en Hadavilla.\n@c0@"
  fr: "@aCandy@bIl errait tout seul quand Mélissa l'a invité à venir vivre à Féeria.\n@c0@"
  it: "@aAmandina@bSe ne andava a spasso da queste parti, quando Adusya gli ha proposto di andare ad abitare a Domus Fatae. È stato un bel gesto, non è vero?\n@c0@"
  ja: "@a@bベラ「群れにも　帰れず\n\tさまよっていたところを\n\tポワンさまに　救われたのよ。\n@c0@"
240:
  de: "@aZuckerchen@bWas?! Dieses kleine Kätzchen ist eine Säbelzahnkatze?\n@c0@"
  en: "@aHoney@bWhat!? That little kitten's a great sabrecat!?\n@c0@"
  es: "@aDulce@b¿Qué? ¿Ese minino es un dientes de sable?\n@c0@"
  fr: "@aCandy@bCommentⓡⓐ Ce petit chat est un smilodonⓡⓐ\n@c0@"
  it: "@aAmandina@bCosa?!\nQuel gattino è in realtà un Koguar?!\n@c0@"
  ja: "@a@bベラ「えっ！？　その子ネコって\n\tキラーパンサーだったの？？\n@c0@"
241:
  de: "@aZuckerchen@bH-Hi hi! A-Aber natürlich! Das wusste ich doch. Deshalb wusste ich sofort, dass du was Besonderes bist, als ich dir begegnet bin.\n@c0@"
  en: "@aHoney@bHeⓚⓛ Hee hee! O-Of course it is! I knew that. That's how I knew you were special just as soon as I met you.\n@c0@"
  es: "@aDulce@bJe... ¡Ji, ji! ¡C-claro! Ya lo sabía. Del mismo modo que supe que eras especial en cuanto te conocí.\n@c0@"
  fr: "@aCandy@bOh, euh... Hi hiⓠ Bien sûr que ouiⓠ Je le savais.\nC'est comme ça que j'ai compris que tu avais\nquelque chose de spécial dès que je t'ai vu.\n@c0@"
  it: "@aAmandina@bEhm, sì... Certo, me ne sono accorta subito...\nÈ proprio da questo che ho capito immediatamente che tu sei una persona speciale!\n@c0@"
  ja: "@a@bベラ「も　もちろん知ってたわよ。\n\tだから　%a000090のこと　最初から\n\tただ者じゃないって　思ってたわ。\n@c0@"
242:
  de: "@aZuckerchen@bⓆ Ist dir kalt und schwer ums Herz, Ⓠ\nLindern Bäder deinen Schmerz. Ⓡ\nHi hi hi! Ich würd' mich gern dazugesellen!\n@c0@"
  en: "@aHoney@bⓆ When you're cold and blue, Ⓠ\nYou need a bath 'n' shampoo Ⓡ\nTee hee hee! I wish I could get in too!\n@c0@"
  es: "@aDulce@bⓆ Cuando triste estés tú, Ⓠ\ndate un buen baño con champú Ⓡ\n¡Ji ji ji! ¡Ojalá pudiera meterme!\n@c0@"
  fr: "@aCandy@bⓆ Si tu es bleu de froid, Ⓠ\nUn bon bain chaud te réchauffera Ⓡ\nTi-hi-hiⓠ J'en prendrais bien un, moi aussiⓠ\n@c0@"
  it: "@aAmandina@bQuando sei un po' giù... Ⓠ\nUn bagno caldo ti tira su... Ⓡ\nTee eh eh! Sì, vorrei proprio fare un bel bagno!\n@c0@"
  ja: "@a@bベラ「寒いときは　あったかい\n\tお風呂に　かぎるわよね。\n\tいいなあ　私も　入りた～い！\n@c0@"
243:
  de: "@aZuckerchen@bDer letzte Dorfälteste war wirklich streng. Da konnte man recht schnell Ärger kriegen. Selbst wenn man den Frieden nur ein ganz klein wenig gestört hat.\n@c0@"
  en: "@aHoney@bThe last village elder was really strict. You could get in trouble for anything. Even if you upset the peace just a teeny-weeny bit.\n@c0@"
  es: "@aDulce@bLa última anciana de la aldea era muy estricta. Te la liaba por cualquier cosa, hasta por alterar la paz solo un poquitirrín.\n@c0@"
  fr: "@aCandy@bLa dernière Ancienne du village était vraiment très stricte. On risquait des ennuis pour n'importe quoi.\r\nMême si on troublait la paix avec des peccadilles.\n@c0@"
  it: "@aAmandina@bLa fata che prima era a capo del villaggio era molto severa.\nBastava un nonnulla per farla arrabbiare.\n@c0@"
  ja: "@a@bベラ「先代の方は　とても厳しい方で\n\tほんの少しでも　平和が\n\t乱れることを　嫌われたの。\n@c0@"
244:
  de: "@aZuckerchen@bEr ist erst vor kurzem dahingeschieden. Deshalb ist Marmela noch gar nicht so lange Dorfälteste, weißt du.\n@c0@"
  en: "@aHoney@bHe only passed away recently. So Treacle's only been village elder for a little while, you see.\n@c0@"
  es: "@aDulce@bMurió hace muy poco, así que Miel es la única anciana desde hace tiempo.\n@c0@"
  fr: "@aCandy@bIl n'y a pas très longtemps qu'elle nous a quittées.\r\nCela fait donc assez peu de temps que Mélissa\r\nest devenue Ancienne du village.\n@c0@"
  it: "@aAmandina@bHa lasciato il mondo dei vivi di recente, quindi è da poco che Adusya governa la nostra comunità.\n@c0@"
  ja: "@a@bベラ「その先代さまも　先日\n\tお亡くなりになり　ポワンさまが\n\tあとを　継がれたばかりなのよ。\n@c0@"
245:
  de: "@aZuckerchen@bHier in Feenaue leben eine Menge Zwerge, weißt du. Die meisten sind Händler. Und Handwerker.\n@c0@"
  en: "@aHoney@bThere are quite a few dwarfs living here in Faerie Lea, you know. They're merchants, mostly. And artisans too.\n@c0@"
  es: "@aDulce@bEn Hadavilla viven algunos enanos. Son mercaderes, la mayoría. Y artesanos.\n@c0@"
  fr: "@aCandy@bTu sais, il y a pas mal de nains qui vivent ici, à Féeria. Ce sont des marchands, pour la plupart.\r\nEt des artisans, aussi.\n@c0@"
  it: "@aAmandina@bQui a Domus Fatae vivono alcuni nani.\nPer la maggior parte sono commercianti, ma c'è anche qualche artigiano.\n@c0@"
  ja: "@a@bベラ「ドワーフって　妖精の国では\n\t商売をしたり　ものを作ったりして\n\tくらしていることが　多いのよ。\n@c0@"
246:
  de: "@aZuckerchen@bEs ist ein tolles Gefühl, wieder zu Hause zu sein, auch wenn hier nicht alles zum Besten steht.\n@c0@"
  en: "@aHoney@bIt still feels good to come home, even though things aren't quite right here.\n@c0@"
  es: "@aDulce@bEs genial volver a casa, aunque las cosas no estén muy tranquilas.\n@c0@"
  fr: "@aCandy@bC'est toujours agréable de rentrer chez soi,\r\nmême quand les choses vont un peu de travers.\n@c0@"
  it: "@aAmandina@bÈ sempre bello tornare a casa, non trovi?\n@c0@"
  ja: "@a@bベラ「こんな　大変なときだけど\n\tそれでも　やっぱり　ここに\n\t帰ってくると　ホッとするわね。\n@c0@"
247:
  de: "@aZuckerchen@bDas ist unverzeihlich, so sauertöpfisch über Marmela herzuziehen! Winz ist gemein!\nWer ist denn dieser witzlose Winz überhaupt?\n@c0@"
  en: "@aHoney@bThat's unforgivable, thinking so sourly about Treacle! Dwight's mean!\r\n...Er, who is this Dwight dwarf anyway?\n@c0@"
  es: "@aDulce@b¡Es imperdonable estar tan amargado! ¡Dojo es malo!\r\nEsto... ¿y quién es ese Dojo?\n@c0@"
  fr: "@aCandy@bÊtre aussi amer vis-à-vis de Mélissa, c'est impardonnableⓠ Antonin est méchantⓠ\n... Euh, mais qui est cet Antonin, d'abordⓡ\n@c0@"
  it: "@aAmandina@bMa come si fa a pensare certe cose di Adusya, eh?\nRalph è proprio un cattivone!\nA proposito... Chi è Ralph?\n@c0@"
  ja: "@a@bべラ「ホントに　あきれちゃう。\n\tポワンさまを　逆うらみするなんて！\n\t……ところで　ザイルって誰よ？\n@c0@"
248:
  de: "@aZuckerchen@bUnverzeihlich, so sauertöpfisch über Marmela herzuziehen!\n@c0@"
  en: "@aHoney@bUnforgivable, thinking so sourly about Treacle!\n@c0@"
  es: "@aDulce@b¡Imperdonable, estar tan amargado!\n@c0@"
  fr: "@aCandy@bPenser du mal de Mélissa, c'est impardonnableⓠ\n@c0@"
  it: "@aAmandina@bMa come si fa a pensare certe cose di Adusya, eh?\n@c0@"
  ja: "@a@bべラ「ホントに　あきれちゃう。\n\tポワンさまを　逆うらみするなんて！\n@c0@"
249:
  de: "@aZuckerchen@bDieser alte Zwerg hat die ganze Zeit hier gelebt, weil man ihn aus Feenaue verbannt hat.\n@c0@"
  en: "@aHoney@bThat old dwarf's been living here all this time because he was thrown out of Faerie Lea.\n@c0@"
  es: "@aDulce@bEse viejo enano vive aquí desde hace tiempo porque lo expulsaron de Hadavilla.\n@c0@"
  fr: "@aCandy@bCe vieux nain a vécu tout ce temps ici parce qu'il a été expulsé de Féeria.\n@c0@"
  it: "@aAmandina@bQuell'anziano nano vive qui da quando venne scacciato da Domus Fatae.\n@c0@"
  ja: "@a@bベラ「あの　ドワーフのおじさんは\n\t村を　追い出されてから　ずっと\n\tこんなところで　くらしていたのね。\n@c0@"
250:
  de: "@aZuckerchen@bWas Winz getan hat, ist unverzeihlich, aber mir tut der alte Zwerg ein bisschen leid. Ich kann schon verstehen, wieso Winz so gehandelt hat.\n@c0@"
  en: "@aHoney@bWhat Dwight's done is unforgivable, but I do feel sorry for the old dwarf. So I suppose I can understand why Dwight did what he did.\n@c0@"
  es: "@aDulce@bLo que hizo Dojo es imperdonable, pero me da pena el anciano. Así que supongo que entiendo los motivos de Dojo.\n@c0@"
  fr: "@aCandy@bCe qu'a fait Antonin est impardonnable, mais j'ai\r\nde la peine pour le vieux nain. Alors au fond, je peux comprendre pourquoi Antonin a agi comme ça.\n@c0@"
  it: "@aAmandina@bQuello che ha fatto Ralph è imperdonabile, ma provo compassione per quel povero vecchio. Credo di capire perché Ralph si sia comportato così...\n@c0@"
  ja: "@a@bベラ「ザイルのしたことは　許せないけど\n\tおじさんには　同情しちゃう。\n\tザイルの気持ちも　少しわかるかも。\n@c0@"
251:
  de: "@aZuckerchen@bIch trau dem Schleim nicht. Er hat sich schon mit ⓞIch bin kein schlechter Schleimⓟ verteidigt, ehe wir irgendwas gesagt hatten. Und wer ist dieser Winz?\n@c0@"
  en: "@aHoney@bI don't trust that slime. It came out with ⓗI'm not a bad slimeⓘ before we'd even said anything.\nAnd who is this Dwight, anyway?\n@c0@"
  es: "@aDulce@bNo confío en ese limo. Soltó lo de ⓕno soy un limo maloⓖ antes de que le dijéramos nada.\n¿Y quién es ese Dojo?\n@c0@"
  fr: "@aCandy@bCe gluant ne m'inspire pas confiance. Il ditⓢ ⓥJe ne\nsuis pas un méchant gluantⓦ avant même qu'on ait ouvert la bouche. Et puis, qui est Antonin, d'abordⓡ\n@c0@"
  it: "@aAmandina@bNon mi fido di quello Slime.\nHa un'aria che non mi piace!\nE comunque, chi è Ralph?\n@c0@"
  ja: "@a@bベラ「いきなり　ボクじゃないとか\n\t言い出すなんて　あやしいわ。\n\t……でも　ザイルって　誰だろうね？\n@c0@"
252:
  de: "@aZuckerchen@bDieser Typ redet komisch. Ich traue ihm nicht.\nWenn du mich fragst, dann sucht der nach ⓞDes Schlossers Schläueⓟ, um damit Sachen zu klauen.\n@c0@"
  en: "@aHoney@bThat man talks funny. I don't trust him. If you ask me, I think he's looking for ⓗLots about Locksⓘ to help him steal things.\n@c0@"
  es: "@aDulce@bEse hombre habla raro. No me fío de él. En mi opinión, está buscando ⓕTrucos de cerrajeroⓖ para robar.\n@c0@"
  fr: "@aCandy@bIl parle bizarrement, cet homme. Je ne lui fais pas confiance. À mon avis, il cherche ⓥLes Clefs des serruresⓦ pour pouvoir voler des choses.\n@c0@"
  it: "@aAmandina@bNon mi piace ciò che ha detto quel tipo, e nemmeno il modo in cui parla! Secondo me sta cercando ⓕL'arte delle porte aperteⓖ per qualche scopo poco pulito...\n@c0@"
  ja: "@a@bベラ「……う～ん　どう考えても\n\tあの人　カギの技法を手に入れたら\n\tロクなことしそうにないわよね。\n@c0@"
253:
  de: "@aZuckerchen@bKomm! Wir müssen das Buch zuerst finden!\n@c0@"
  en: "@aHoney@bCome on! We've got to find it first!\n@c0@"
  es: "@aDulce@b¡Vamos! ¡Hay que encontrarlo primero!\n@c0@"
  fr: "@aCandy@bViensⓠ On doit trouver ce livre avant luiⓠ\n@c0@"
  it: "@aAmandina@bCoraggio!\nDobbiamo trovare il libro prima di lui!\n@c0@"
  ja: "@a@bベラ「負けてられないわ！\n\t早いところ　カギの技法を\n\t手に　入れなくちゃね。\n@c0@"
254:
  de: "@aZuckerchen@bFrüher gab's solche Leute wie ihn nicht in unserer Welt.\n@c0@"
  en: "@aHoney@bWe never used to have people like him in our world.\n@c0@"
  es: "@aDulce@bNunca habíamos tenido a nadie como él en nuestro mundo.\n@c0@"
  fr: "@aCandy@bOn n'avait jamais eu de gens comme lui dans notre monde, avant.\n@c0@"
  it: "@aAmandina@bFino a qualche tempo fa nel nostro mondo non c'erano persone come lui.\n@c0@"
  ja: "@a@bベラ「あんな　人間が\n\t私たちの世界に　入ってくるなんて\n\t今まで　なかったことだわ。\n@c0@"
255:
  de: "@aZuckerchen@bVielleicht ist das ein Zeichen dafür, dass uns was Schlimmes bevorsteht. Deshalb war der alte Dorfälteste wohl auch so streng.\n@c0@"
  en: "@aHoney@bMaybe it's a sign of bad things to come. I suppose that's why the old village elder was so strict.\n@c0@"
  es: "@aDulce@bQuizá sea un presagio de que se avecinan malos tiempos. Supongo que por eso la vieja anciana era tan estricta.\n@c0@"
  fr: "@aCandy@bPeut-être que c'est un mauvais présage.\r\nC'est peut-être pour ça que l'Ancienne du village\r\nétait si stricte.\n@c0@"
  it: "@aAmandina@bForse è il segno che sta per accadere qualcosa di brutto...\n㈡\nDev'essere per questo motivo che la fata che era a capo del villaggio prima di Adusya era tanto severa.\n@c0@"
  ja: "@a@bベラ「なにか　良くないことの\n\t前ぶれかしら…。　先代さまは\n\tそれで　きびしくなさっていたのかも。\n@c0@"
256:
  de: "@aZuckerchen@bHi hi hi! ⓞDes Schlossers Schläueⓟ kriegt er nie! Ⓡ\nKaum zu fassen! Du hast ihm tatsächlich gesagt, dass du's schon gefunden hast!\n@c0@"
  en: "@aHoney@bTee hee hee! ⓗLots about Locksⓘ for me! Ⓡ\nI can't believe you told him you'd already found it!\n@c0@"
  es: "@aDulce@b¡Ji, ji, ji! ¡ⓕTrucos de cerrajeroⓖ para mí! Ⓡ\n¡No puedo creer que le dijeras que ya lo habías encontrado!\n@c0@"
  fr: "@aCandy@bTi-hi-hiⓠ ⓥLes Clefs des serruresⓦ sont à moiⓠ Ⓡ\nJe n'en reviens pas que tu lui aies dit qu'on l'avait déjà trouvéⓠ\n@c0@"
  it: "@aAmandina@bTee eh eh!\nⓕL'arte delle porte aperteⓖ è nostro, e tu gliel'hai detto chiaro e tondo!\n@c0@"
  ja: "@a@bベラ「あ～　びっくりした。\n\t%a000090ったら　カギの技法を\n\t持ってるって　言っちゃうんだもの。\n@c0@"
257:
  de: "@aZuckerchen@bDer sah so furchterregend aus. Du bist wirklich tapfer, %a000090.\n@c0@"
  en: "@aHoney@bHe looked so scary. You're really brave, %a000090.\n@c0@"
  es: "@aDulce@bDaba miedo. Eres muy valiente, %a000090.\n@c0@"
  fr: "@aCandy@bIl avait l'air tellement effrayant. Tu es vraiment courageux, %a000090.\n@c0@"
  it: "@aAmandina@bSei stato davvero coraggioso, %a000090.\n@c0@"
  ja: "@a@bベラ「あのおじさん　すっごく\n\tこわい顔してたのに\n\tよく　あなた平気だったわね。\n@c0@"
258:
  de: "@aZuckerchen@bJuchhu! Jetzt können wir überall verschlossene Türen öffnen!\n@c0@"
  en: "@aHoney@bYippee! Now we can open locked doors all over the place!\n@c0@"
  es: "@aDulce@b¡Yupiii! ¡Ahora podemos abrir todas las puertas cerradas!\n@c0@"
  fr: "@aCandy@bYoupiⓠ Maintenant, on peut ouvrir toutes les portes qu'on veutⓠ\n@c0@"
  it: "@aAmandina@bEvviva!\nOra possiamo aprire tutte le porte chiuse del mondo!\n@c0@"
  ja: "@a@bベラ「やったわね！\n\tこれで　カギのかかったトビラを\n\t開けられるわ。\n@c0@"
259:
  de: "@aZuckerchen@bAber mach bloß keine Türen auf, hinter die du besser nicht gucken solltest! Hi hi! Hi hi hi!\n@c0@"
  en: "@aHoney@bBut no peeking behind doors you shouldn't be peeking behind! Tee hee! Tee hee hee!\n@c0@"
  es: "@aDulce@b¡Pero nada de mirar tras las puertas que no deberíamos mirar! ¡Ji, ji! ¡Ji, ji, ji!\n@c0@"
  fr: "@aCandy@bMais attention, on ne regarde pas par le trou de la serrureⓠ Ti-hiⓠ Ti-hi-hiⓠ\n@c0@"
  it: "@aAmandina@bMa ricorda che non si guarda dal buco della serratura, eh! Sarebbe da maleducati!\nTee eh eh!\n@c0@"
  ja: "@a@bべラ「あっ　でも　悪いことに\n\t使ったりしちゃ　ダメだからね！\n@c0@"
260:
  de: "@aZuckerchen@bSupi! Das funktioniert ja wirklich!\nDu kannst jetzt tatsächlich verschlossene Türen öffnen!\n@c0@"
  en: "@aHoney@bWowee! It really works!\nYou really can open locked doors now!\n@c0@"
  es: "@aDulce@b¡Yujuu! ¡Funciona!\r\n¡Puedes abrir las puertas cerradas!\n@c0@"
  fr: "@aCandy@bWaouhⓠ Ça marche vraimentⓠ\nTu peux ouvrir les portes verrouillées, maintenantⓠ\n@c0@"
  it: "@aAmandina@bChe meraviglia! Funziona davvero!\nPossiamo aprire qualsiasi porta!\n@c0@"
  ja: "@a@bベラ「すっご～い！\n\t本当に　カギのかかった　トビラが\n\t開けられたわ！\n@c0@"
261:
  de: "@aZuckerchen@bHi hi hi! Da fallen einem gleich eine ganze Menge fiese Streiche ein, die man damit anstellen könnte! Kein Wunder, dass der Dorfälteste besorgt war. \n@c0@"
  en: "@aHoney@bTee hee hee! It makes you think of all sorts of cheeky tricks and naughty things we could get up to! No wonder the village elder was worried.\n@c0@"
  es: "@aDulce@b¡Ji, ji! ¡Se me ocurren montones de trastadas y travesuras que hacer! No me extraña que la antigua anciana de Hadavilla estuviera preocupada.\n@c0@"
  fr: "@aCandy@bTi-hi-hiⓠ Ça donne plein d'idées de tours à jouer et de mauvais coups à mijoterⓠ Pas étonnant que l'Ancienne du village était aussi inquiète.\n@c0@"
  it: "@aAmandina@bPensa a quanti scherzetti e dispetti potremmo fare!\nNon c'è da stupirsi che la fata che prima governava il villaggio fosse tanto preoccupata... Tee eh eh!\n@c0@"
  ja: "@a@bベラ「こんな　技法があったら\n\t悪いことも　考えてしまう…。\n\t先代さまが恐れたのも　わかるわね。\n@c0@"
262:
  de: "@aZuckerchen@bIch wusste ja gar nicht, dass hier eine Höhle ist.\n@c0@"
  en: "@aHoney@bI never knew there was a cave here before.\n@c0@"
  es: "@aDulce@bNo sabía que hubiera una cueva aquí.\n@c0@"
  fr: "@aCandy@bJ'ignorais qu'il y avait une grotte ici.\n@c0@"
  it: "@aAmandina@bNon sapevo che qui ci fosse una grotta.\n@c0@"
  ja: "@a@bベラ「こんな所に　洞くつが　あるなんて\n\tぜんぜん　知らなかったわ。\n@c0@"
263:
  de: "@aZuckerchen@bIch frage mich, wie tief es da runtergeht...\n@c0@"
  en: "@aHoney@bI wonder how far it goes down...\n@c0@"
  es: "@aDulce@b¿Hasta dónde llegará?\n@c0@"
  fr: "@aCandy@bJe me demande jusqu'où elle va...\n@c0@"
  it: "@aAmandina@bChissà quanto è profonda...\n@c0@"
  ja: "@a@bベラ「いったい　この奥は\n\tどうなっているのかしら？\n@c0@"
264:
  de: "@aZuckerchen@bIch bin zum ersten Mal in einer Höhle. Eigentlich hab ich Feenaue bisher kaum jemals verlassen...\n@c0@"
  en: "@aHoney@bThis is my first time in a cave. In fact, I've hardly been outside Faerie Lea at all until now...\n@c0@"
  es: "@aDulce@bNunca había estado en una cueva. La verdad es que apenas he salido de Hadavilla...\n@c0@"
  fr: "@aCandy@bC'est la première fois que j'entre dans une grotte.\r\nEn fait, je n'étais quasiment jamais sortie de Féeria avant cette histoire...\n@c0@"
  it: "@aAmandina@bQuesta è la prima volta che entro in una grotta.\nA essere sincera, prima che mi fosse assegnata questa missione non ero mai uscita da Domus Fatae...\n@c0@"
  ja: "@a@bベラ「私　洞くつに入るのって初めて。\n\tそもそも　妖精の村からさえ\n\tあまり　出ることなかったし…。\n@c0@"
265:
  de: "@aZuckerchen@bIch weiß nicht, ob ich wieder rausgefunden hätte, wenn ich alleine hergekommen wär.\n@c0@"
  en: "@aHoney@bIf I'd come here on my own, I don't know if I'd have found my way out again.\n@c0@"
  es: "@aDulce@bSi hubiera venido aquí sola, dudo que hubiera encontrado la salida.\n@c0@"
  fr: "@aCandy@bSi j'étais venue ici toute seule, je ne sais pas si j'aurais réussi à retrouver la sortie.\n@c0@"
  it: "@aAmandina@bSe fossi venuta qui da sola, dubito che sarei riuscita a ritrovare la strada per uscire.\n@c0@"
  ja: "@a@bベラ「もし　私ひとりで　\n\tこの洞くつに　入ってたら　\n\t出られなくなってたかも…。\n@c0@"
266:
  de: "@aZuckerchen@bEs ist mir ja ein bisschen peinlich, aber... Tja... Hi hi hi! Mein Orientierungssinn lässt echt zu wünschen übrig. Zum Glück war ich mit dir hier.\n@c0@"
  en: "@aHoney@bIt's a bit embarrassing actually, but...well...\r\nHee hee hee! My sense of direction is abysmal.\r\nIt's lucky I came with you.\n@c0@"
  es: "@aDulce@bMe da un poco de vergüenza, pero... bueno...\r\n¡Ji, ji, ji! Mi sentido de la orientación es horrible.\r\nDi contigo de chiripa.\n@c0@"
  fr: "@aCandy@bC'est un peu gênant, mais... bon... ti-hi-hiⓠ\nJ'ai un sens de l'orientation déplorable.\nC'est une chance que je sois venue ici avec toi.\n@c0@"
  it: "@aAmandina@bEcco, non dovrei dirlo, ma...\r\nIl mio senso dell'orientamento è pessimo!\r\nPer fortuna ci sei tu con me.\n@c0@"
  ja: "@a@bベラ「はずかしいけど…\n\t私って　すごい　方向オンチなの。\n\tあなたがいてくれて　助かったわ。\n@c0@"
267:
  de: "@aZuckerchen@bDieser Ort ist echt ekelhaft. Er ist finster und feucht und mit Monstern verseucht. Bäh! Igitt! Brrr!\n@c0@"
  en: "@aHoney@bThis place is yucky. It's dark and wet and infested with monsters and yuck, yuck, yuck, yuck, yucky!\n@c0@"
  es: "@aDulce@bEste lugar es asqueroso. ¡Oscuro, húmedo y lleno de monstruos y de asco, asquete y asco!\n@c0@"
  fr: "@aCandy@bCet endroit est beurk. Il est sombre, humide et grouille de monstres et beurk, beurk, beurk et rebeurkⓠ\n@c0@"
  it: "@aAmandina@bQuesto posto è orribile.\r\nÈ buio, è umido ed è infestato da mostri e schifezze schifosamente schifose! Bleah!\n@c0@"
  ja: "@a@bベラ「ここって　暗いし\n\tジメジメしてるし　魔物は多いし\n\tイヤな感じっ！\n@c0@"
268:
  de: "@aZuckerchen@bUnd dieser alte Zwerg musste die ganze Zeit hier leben. Hi hi hi...\nHoppla! Ich meine natürlich, ach der Arme!\n@c0@"
  en: "@aHoney@bAnd that old dwarf's had to live in here all this time. Tee hee heⓚⓛ\nOops! I mean, poor thing!\n@c0@"
  es: "@aDulce@bY ese viejo enano ha tenido que vivir aquí tanto tiempo... Ji, ji, ji... ¡Ups, quiero decir, pobrecito!\n@c0@"
  fr: "@aCandy@bEt ce vieux nain a dû y vivre pendant tout ce\ntemps. Ti-hi-hi... oupsⓠ Le pauvre, je voulais direⓠ\n@c0@"
  it: "@aAmandina@bE quel vecchio nano è stato costretto a vivere qui tutto questo tempo. Tee eh eh...\nOps! Volevo dire, poveretto!\n@c0@"
  ja: "@a@bベラ「村を追い出された　おじさんは\n\tこんなところで　生活せざるを\n\tえなかったのよね。　かわいそう…。\n@c0@"
269:
  de: "@aZuckerchen@bIch war noch nie in einer Höhle. Ich dachte erst, das wird bestimmt ganz aufregend und spaßig. Aber ich langweile mich.\n@c0@"
  en: "@aHoney@bI'd never been in a cave until now. I thought it'd be really exciting and fun, but I'm bored.\n@c0@"
  es: "@aDulce@bNunca había estado en una cueva. Creía que sería emocionante y divertido, pero me aburro.\n@c0@"
  fr: "@aCandy@bJe n'étais jamais entrée dans une grotte, avant.\r\nJe pensais que ce serait vraiment drôle et intéressant, mais c'est extrêmement ennuyeux.\n@c0@"
  it: "@aAmandina@bNon ero mai entrata in una caverna prima d'ora.\nPensavo che sarebbe stato divertente, invece mi sto annoiando a morte...\n@c0@"
  ja: "@a@bベラ「洞くつにもぐるのは\n\t初めてだったけど\n\t私　もう　ゲンナリ……。\n@c0@"
270:
  de: "@aZuckerchen@bIch find' das sogar sterbenslangweilig! Ich weiß nicht, wie du das aushältst, %a000090.\n@c0@"
  en: "@aHoney@bI'm so bored I could die! I don't know how you put up with it, %a000090.\n@c0@"
  es: "@aDulce@b¡Me muero de aburrimiento! No sé cómo lo soportas, %a000090.\n@c0@"
  fr: "@aCandy@bJe m'ennuie à mourirⓠ Je ne sais pas comment tu arrives à supporter ça, %a000090.\n@c0@"
  it: "@aAmandina@bChe baaarbaaa!\nNon ne posso più di questo posto, %a000090!\nMi spieghi come fai a trovarlo interessante, eh?!\n@c0@"
  ja: "@a@bべラ「今だって　息がつまりそう。\n\t%a000090は　よく平気ね。\n\t感心しちゃうわ。\n@c0@"
271:
  de: "@aZuckerchen@bGlaubst du, diesem Winz tut es wirklich leid, was er getan hat? Ich bin mir da nicht so sicher...\n@c0@"
  en: "@aHoney@bDo you think that Dwight boy is really sorry for what he did? I'm not so sure...\n@c0@"
  es: "@aDulce@b¿Crees que ese Dojo se arrepiente de verdad de lo que hizo? No estoy segura.\n@c0@"
  fr: "@aCandy@bTu crois que ce garçon, Antonin, regrette vraiment ce qu'il a faitⓡ Je n'en suis pas certaine...\n@c0@"
  it: "@aAmandina@bPensi che Ralph sia davvero pentito di ciò che ha fatto?\nIo non ne sarei tanto sicura...\n@c0@"
  ja: "@a@bべラ「あの　ザイルって子\n\t本当に　反省してるのかしら？\n\t………あやしいわ。\n@c0@"
272:
  de: "@aZuckerchen@bDieser Schleim hat gesagt, dass Winz an allem schuld war, nicht?\n@c0@"
  en: "@aHoney@bThat slime said it was Dwight right from the start, didn't it?\n@c0@"
  es: "@aDulce@bEse limo dijo que fue Dojo desde el principio, ¿no?\n@c0@"
  fr: "@aCandy@bCe gluant avait dit dès le début que le responsable, c'était Antonin, n'est-ce pasⓡ\n@c0@"
  it: "@aAmandina@bQuello Slime l'aveva detto fin dall'inizio che il responsabile era Ralph, no?\n@c0@"
  ja: "@a@bベラ「あのスライムくん　たしか\n\t犯人は　ザイルだとかって\n\t言ってたんじゃなかったっけ？\n@c0@"
273:
  de: "@aZuckerchen@bIch wusste doch, dass er die Wahrheit sagt.\nHi hi hi!\n@c0@"
  en: "@aHoney@bI knew it was telling the truth all along.\nTee hee hee!\n@c0@"
  es: "@aDulce@bSiempre supe que decía la verdad.\r\n¡Ji, ji, ji!\n@c0@"
  fr: "@aCandy@bJe savais bien qu'il disait la vérité. Ti-hi-hi-hiⓠ\n@c0@"
  it: "@aAmandina@bLo sapevo che diceva la verità! Gli Slime non mentono mai! Uhm, diciamo che non mentono quasi mai...\r\nTee eh eh!\n@c0@"
  ja: "@a@bベラ「……ふ～ん　なんていうか\n\tうらやましい性格してるよね。\n@c0@"
274:
  de: "@aZuckerchen@bSiehst du?! Winz tut das Ganze überhaupt nicht leid.\n@c0@"
  en: "@aHoney@bYou see!? That Dwight boy's not sorry at all!\n@c0@"
  es: "@aDulce@b¿Lo ves? ¡Ese Dojo no se arrepiente de nada!\n@c0@"
  fr: "@aCandy@bTu voisⓡⓐ Cet Antonin ne regrette rien du toutⓠ\n@c0@"
  it: "@aAmandina@bHai visto?!\nRalph non è per niente pentito!\n@c0@"
  ja: "@a@bベラ「あの子ったら　ぜんぜん\n\t反省してないじゃないの！\n@c0@"
275:
  de: "@aZuckerchen@bWenn du mich fragst, dann ist der Kerl bloß ein Unruhestifter.\n@c0@"
  en: "@aHoney@bHe's just a troublemaker if you ask me.\n@c0@"
