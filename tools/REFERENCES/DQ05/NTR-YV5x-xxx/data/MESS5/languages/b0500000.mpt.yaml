  fr: "@aHarry@bTu sais... Maria est la première femme que je rencontre dont je puisse sincèrement dire\nqu'elle est à la fois belle et pleine de bonté.\n㈡\nToi aussi, tu la trouves uniqueⓡ\n@c0@"
  it: "@aRobert@bNon avevo mai incontrato una ragazza come Maria...\nÈ bella, è dolce, è intelligente...\n@c0@"
  ja: "@a@bヘンリー「オレ…　やさしくて\n\tきれいな女の人を　見たのって\n\tマリアさんが　初めてかも。\n@c0@"
379:
