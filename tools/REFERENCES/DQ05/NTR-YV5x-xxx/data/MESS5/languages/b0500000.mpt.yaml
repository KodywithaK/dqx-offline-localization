  it: "@aAmandina@bSecondo me potresti aiutare molto tuo padre, se solo ti pemettesse di farlo.\n@c0@"
  ja: "@a@bベラ「%a000090は　今のままでも\n\tじゅうぶん　お父さんの助けが\n\tできると思うわよ。\n@c0@"
199:
  de: "@aZuckerchen@bDieser junge Mann sah aus wie...\nNein, das kann nicht sein...\n@c0@"
  en: "@aHoney@bThat young man looked like...\nNo, it can't be...\n@c0@"
  es: "@aDulce@bEse chico joven se parecía a...\r\nNo, no puede ser...\n@c0@"
  fr: "@aCandy@bCe jeune homme ressemblait à...\nNon, c'est impossible...\n@c0@"
  it: "@aAmandina@bQuel giovanotto assomigliava a...\nNo, non può essere... \n@c0@"
  ja: "@a@bべラ「あの人　もしかして……\n\tううん　なんでもないわ。\n@c0@"
200:
  de: "@aZuckerchen@bEr hatte einen recht seltsamen Blick, nicht?\nGenau wie du...\n@c0@"
  en: "@aHoney@bHe had a strange look in his eyes, didn't he?\nJust like you...\n@c0@"
  es: "@aDulce@bTenía una mirada extraña, ¿verdad?\r\nComo tú...\n@c0@"
  fr: "@aCandy@bIl avait quelque chose de particulier dans le regard, nonⓡ Exactement comme toi...\n@c0@"
  it: "@aAmandina@bHai notato il suo sguardo?\nEra strano, molto profondo.\nProprio come il tuo...\n@c0@"
  ja: "@a@bべラ「不思議な目をした　人だったわね。\n\tそう　ちょうど　あなたみたいな…。\n@c0@"
201:
  de: "@aZuckerchen@bIch wollte dich eigentlich nicht bitten, uns zu helfen. Ich bringe dich nur ungern in Gefahr. Aber ich hatte keine Wahl.\n@c0@"
  en: "@aHoney@bI didn't want to ask you to help us. I don't like putting you in danger. But I had no choice.\n@c0@"
  es: "@aDulce@bNo quería tener que pedirte ayuda. No me gusta nada que corras riesgos. Pero no tenía elección.\n@c0@"
  fr: "@aCandy@bJe ne voulais pas te demander de nous aider.\r\nJe n'avais pas envie de te mettre en danger.\r\nMais je n'avais pas le choix.\n@c0@"
  it: "@aAmandina@bSono mortificata, mio piccolo amico...\nNon vorrei farti correre tanti rischi, ma non ho altra scelta.\n@c0@"
  ja: "@a@bべラ「わかってね。　私も　本当なら\n\tあなたみたいな　小さな子を\n\tあぶない所へ　行かせたくないのよ。\n@c0@"
202:
  de: "@aZuckerchen@bDie Gefahr ist vorüber. Komm schon, lass uns losziehen und Marmela die gute Nachricht überbringen!\n@c0@"
  en: "@aHoney@bThe danger's passed now. Come on, let's go and tell Treacle the good news!\n@c0@"
  es: "@aDulce@bEl peligro ya ha pasado. ¡Venga, vamos a darle la buena noticia a Miel!\n@c0@"
  fr: "@aCandy@bLe danger est passé, désormais. Viens, allons annoncer la bonne nouvelle à Mélissaⓠ\n@c0@"
  it: "@aAmandina@bOra il pericolo è passato.\nForza, andiamo da Adusya e diamole la buona notizia!\n@c0@"
  ja: "@a@bベラ「あぶないことは　もう　おしまい！\n\tさあ　ポワンさまのところへ\n\t行きましょうよっ！\n@c0@"
203:
  de: "@aZuckerchen@bDu bist dein ganzes Leben lang umhergezogen, nicht? Deshalb bist du das Reisen wohl gewohnt.\n@c0@"
  en: "@aHoney@bYou've been moving from place to place your whole life, haven't you? That's why you're so used to travelling.\n@c0@"
  es: "@aDulce@bHas estado toda tu vida yendo de un lado para otro, ¿verdad? Por eso estás tan acostumbrado a viajar.\n@c0@"
  fr: "@aCandy@bTu n'as pas arrêté de déménager d'un endroit à l'autre, n'est-ce pasⓡ C'est pour ça que tu as l'habitude de voyager.\n@c0@"
  it: "@aAmandina@bHai sempre accompagnato tuo padre in giro per il mondo, non è così?\nEcco perché sei abituato a viaggiare.\n@c0@"
  ja: "@a@bべラ「ふ～ん…　あなたって　ずっと\n\t小さなころから　旅をしていたのね。\n\tどうりで　旅なれてると思ったわ。\n@c0@"
204:
  de: "@aZuckerchen@bIch war's nicht! Diesmal nicht.\n@c0@"
  en: "@aHoney@bIt wasn't me! Not this time.\n@c0@"
  es: "@aDulce@b¡No he sido yo! Esta vez no.\n@c0@"
