  it: "@aAmandina@bMah, non saprei...\n@c0@"
  ja: "@a@bベラ「あの　おじいさん\n\t見る目ないわね！\n@c0@"
198:
  de: "@aZuckerchen@bDu könntest deinem Vater eine große Hilfe sein, wenn er dich nur lassen würde.\n@c0@"
