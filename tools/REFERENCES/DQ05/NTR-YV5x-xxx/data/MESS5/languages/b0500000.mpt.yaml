  it: "@aAmandina@bTee eh eh!\nQuel vecchietto è quasi più birbante di me!\n@c0@"
  ja: "@a@bべラ「う～ん　あのおじいさん\n\tなかなか　やるわね！\n@c0@"
206:
  de: "@aZuckerchen@bHi hi! Er ist ganz verdutzt!\nTja, ich hab's geschrieben, also darf ich's auch wieder löschen. Das ist doch nur gerecht, oder?\n@c0@"
  en: "@aHoney@bHee hee! He's really puzzled!\nWell I wrote it, so I get to rub it out. That's fair, isn't it?\n@c0@"
