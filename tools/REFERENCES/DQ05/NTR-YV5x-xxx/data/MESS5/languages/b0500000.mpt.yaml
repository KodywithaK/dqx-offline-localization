  it: "@aAmandina@bNon sono stata io!\nParola di fata!\nStavolta io non c'entro!\n@c0@"
  ja: "@a@bベラ「わかってると　思うけど\n\t今度のは　私じゃないわよ。\n@c0@"
205:
  de: "@aZuckerchen@bHi hi hi! Der ist ja schlimmer als ich, dieser alte Schlawiner!\n@c0@"
  en: "@aHoney@bTee hee hee! He's worse than me, that old man with his tricks!\n@c0@"
