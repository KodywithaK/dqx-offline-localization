  it: "@aRobert@bE poi è così affettuosa e amorevole.\nMi ricorda mia madre, che morì quando ero ancora piccolo.\n@c0@"
  ja: "@a@bヘンリー「あたたかくって　いいよなあ。\n\t小さい頃　死んだオレの母さんも\n\tあんなふうだったかもって思うんだ。\n@c0@"
380:
