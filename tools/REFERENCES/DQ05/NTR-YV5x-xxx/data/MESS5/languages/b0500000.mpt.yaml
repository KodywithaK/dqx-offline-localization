0:
  de: "@aBianca@bKomm, gehen wir auf Erkundungstour! Ich kann dich herumführen und dir alles zeigen, damit du dich nicht verläufst, %a000090.\n@c0@"
  en: "@aBianca@bCome on, let's go and explore! I can show you around so you don't go gettin' yourself lost, %a000090.\n@c0@"
  es: "@aBianca@b¡Venga, vamos a explorar! Yo te llevo para que no te pierdas por ahí, %a000090.\n@c0@"
  fr: "@aBianca@bAllez, viens. On va explorerⓠ\nJe peux te montrer les alentours pour que tu ne\nte perdes pas, %a000090.\n@c0@"
  it: "@aBianca@bForza, %a000090! Andiamo!\nTi farò da guida, così non ti perderai.\n@c0@"
  ja: "@a@bビアンカ「さあ　行きましょう！\n\t%a000090が　道に迷わないように\n\t案内してあげる。\n@c0@"
1:
  de: "@aBianca@bMama behandelt mich immer noch wie ein kleines Kind.\n@c0@"
  en: "@aBianca@bMum still treats me like I'm just a little baby.\n@c0@"
  es: "@aBianca@bMamá aún me trata como si fuese una niña.\n@c0@"
  fr: "@aBianca@bMaman me traite toujours comme si j'étais encore\r\nun bébé.\n@c0@"
  it: "@aBianca@bMia madre mi tratta ancora come se fossi una bambina.\n@c0@"
  ja: "@a@bビアンカ「ママったら\n\tいつまでも　わたしのこと\n\t子供だと　思っているのよ。\n@c0@"
2:
  de: "@aBianca@bIch hoffe, dass es Papa bald wieder besser geht.\n@c0@"
  en: "@aBianca@bI hope Dad gets better again soon.\n@c0@"
  es: "@aBianca@bEspero que papá se cure pronto.\n@c0@"
  fr: "@aBianca@bJ'espère que papa ira bientôt mieux.\n@c0@"
  it: "@aBianca@bSpero che papà si riprenda presto.\n@c0@"
  ja: "@a@bビアンカ「お父さん　重い病気じゃないと\n\tいいのだけど…。\n@c0@"
3:
  de: "@aBianca@bDein Vater sieht so stark und kräftig aus.\n@c0@"
  en: "@aBianca@bYour father looks so strong and powerful.\n@c0@"
  es: "@aBianca@bTu padre parece un hombre tan fuerte y poderoso, ¿sabes?\n@c0@"
  fr: "@aBianca@bTon père a l'air tellement fort et costaud.\n@c0@"
  it: "@aBianca@bTuo padre sembra così forte e coraggioso...\n@c0@"
  ja: "@a@bビアンカ「パパスおじさまって\n\tとっても　強そうで　ステキね。\n@c0@"
4:
  de: "@aBianca@bIm Vergleich zu ihm bist du ein wenig schmächtig. Aber vielleicht wirst du ihm ja ähnlicher, wenn du größer wirst, hm?\n@c0@"
  en: "@aBianca@bYou're a bit weedy compared to him. Maybe you'll get more like him as you grow up, though, eh?\n@c0@"
  es: "@aBianca@bComparado con él, eres más bien enclenque. Bueno, a lo mejor te pareces más a él cuando crezcas, ¿sabes?\n@c0@"
  fr: "@aBianca@bTu fais un peu gringalet, comparé à lui.\nMais peut-être que tu finiras par lui ressembler\nquand tu seras grand, heinⓡ\n@c0@"
  it: "@aBianca@bRispetto a lui, tu sei un po' mingherlino.\nTi auguro di crescere tanto e di diventare grande come lui!\n@c0@"
  ja: "@a@bビアンカ「それに比べると　%a000090は\n\tちょっと　たよりないかも……。\n\t大きくなったら　変わるのかな？\n@c0@"
5:
  de: "@aBianca@bHa ha! Hat diese kleine Geschichte dir etwa Angst eingejagt, %a000090?\n@c0@"
  en: "@aBianca@bHa ha! Did that little story give you a fright, %a000090?\n@c0@"
  es: "@aBianca@b¡Ja, ja! ¿Te has asustado con esa historia que te ha contado, %a000090?\n@c0@"
  fr: "@aBianca@bHa haⓠ Est-ce que cette petite histoire t'a fichu la trouille, %a000090ⓡ\n@c0@"
  it: "@aBianca@bEh eh eh!\nQuella storiella ti ha spaventato, %a000090?\n@c0@"
  ja: "@a@bビアンカ「あっ　%a000090。\n\tもしかして　今のお話で\n\t怖くなっちゃった？\n@c0@"
6:
  de: "@aBianca@bIch hab mich kein bisschen gefürchtet. Ich hab sie jetzt schon so oft gehört, dass ich sie gar nicht mehr richtig ernst nehme.\n@c0@"
  en: "@aBianca@bIt dun't scare me one bit. I've heard it so many times now that I just take it with a pinch of salt.\n@c0@"
  es: "@aBianca@bA mí no me da nada de miedo. La he oído tantas veces que ya ni fu ni fa.\n@c0@"
  fr: "@aBianca@bMoi, elle ne me fait pas peur du tout. Je l'ai entendue tellement de fois que je n'y fais plus attention.\n@c0@"
  it: "@aBianca@bA me non ha fatto alcun effetto.\nL'ho sentita talmente tante volte che ormai non mi fa né caldo né freddo!\n@c0@"
  ja: "@a@bビアンカ「わたしは　へっちゃらよ。\n\tもう何度も　聞かされてるもん\n\tなれちゃった。\n@c0@"
7:
  de: "@aBianca@bUnser Haus ist ja eine Herberge, also haben wir da ziemlich viel Geschirr und so. Ich kann mich aber nicht an irgendwelche Sachen aus Silber erinnern.\n@c0@"
  en: "@aBianca@bOur place is an inn, so we've got quite a lot of crockery and the like. I dun't remember seein' anythin' silver, though.\n@c0@"
  es: "@aBianca@bVivimos en una posada, así que tenemos un montonazo de vajilla. Pero no me acuerdo de haber visto nunca nada de plata.\n@c0@"
  fr: "@aBianca@bChez nous, c'est une auberge, alors on a beaucoup de vaisselle et tout ça. Mais je ne me souviens pas avoir vu d'argenterie.\n@c0@"
  it: "@aBianca@bNoi gestiamo una locanda, quindi abbiamo molte stoviglie in casa, però non mi pare di averne mai vista nessuna in argento.\n@c0@"
  ja: "@a@bビアンカ「うちは　宿屋だから\n\t食器にも　こだわっているのよ。\n\t…銀の食器は　なかったと思うけど。\n@c0@"
8:
  de: "@aBianca@bIn Wittenhausen gibt's 'ne ganze Menge Läden. Unsere Herberge ist aber der größte davon.\n@c0@"
  en: "@aBianca@bThere's quite a few shops here in Roundbeck, y'know. Our inn's the biggest, though.\n@c0@"
  es: "@aBianca@bAquí en Golfo Blanco hay unos cuantos comercios. Pero nuestra posada es el más grande de todos, ¿sabes?\n@c0@"
  fr: "@aBianca@bIl y a pas mal de commerces, ici, à Blanchecombe,\r\ntu sais. Mais notre auberge, c'est le plus grand.\n@c0@"
  it: "@aBianca@bA Blankenburg ci sono molti negozi.\nE poi c'è la nostra locanda, che è bellissima! Eh eh eh!\n@c0@"
  ja: "@a@bビアンカ「この町には\n\tいろんな　お店があるけど\n\tうちの宿屋が　いちばん大きいのよ。\n@c0@"
9:
  de: "@aBianca@bDer ist ja wohl oberfrech! Einfach so zu behaupten, dass wir nur drauf aus wären, Ärger zu machen!\n@c0@"
  en: "@aBianca@bHe's got a blimmin' cheek, thinkin' we're out to cause trouble!\n@c0@"
  es: "@aBianca@b¡Será fresco, pensar que hemos venido a dar problemas!\n@c0@"
  fr: "@aBianca@bIl est drôlement gonflé de croire qu'on est là\npour causer des ennuisⓠ\n@c0@"
  it: "@aBianca@bChe maleducato!\nNoi non volevamo disturbare nessuno!\n@c0@"
  ja: "@a@bビアンカ「わたしたちを\n\tイタズラっ子と　まちがえるなんて\n\t失礼しちゃうわ！\n@c0@"
10:
  de: "@aBianca@bHa! Aber mit einem hat er nicht gerechnet! Ich weiß, dass er nachts immer einschläft. Ich hab ihn gesehen!\n@c0@"
  en: "@aBianca@bHa! What he dun't realise is that I know he falls asleep of a night. I've seen him!\n@c0@"
  es: "@aBianca@b¡Ja! Lo que él no sabe es que yo sé que duerme de un tirón toda la noche. ¡Lo he visto!\n@c0@"
  fr: "@aBianca@bHaⓠ Ce dont il ne se doute pas, c'est que je sais\ntrès bien qu'il s'endort, la nuit. Je l'ai vuⓠ\n@c0@"
  it: "@aBianca@bSe quel tipo non la smette di essere tanto arrogante, dirò a tutti che una volta si è addormentato mentre era di guardia! L'ho visto con i miei occhi!\n@c0@"
  ja: "@a@bビアンカ「でも　みはりの　おじさん\n\t夜になると　いつも寝ちゃうの\n\tわたし　知ってるんだから。\n@c0@"
11:
  de: "@aBianca@bDiese Kinder hecken ständig irgendwelche Streiche aus.\n@c0@"
  en: "@aBianca@bThose kids are always up to no good.\n@c0@"
  es: "@aBianca@bEsos niños están siempre haciendo travesuras.\n@c0@"
  fr: "@aBianca@bCes vauriens sont toujours en train de faire des mauvais coups.\n@c0@"
  it: "@aBianca@bQuei ragazzi sono dei veri teppisti!\n@c0@"
  ja: "@a@bビアンカ「あの子たち　いつも\n\tいけないことばっかり　してるのよ。\n@c0@"
12:
  de: "@aBianca@bDu glaubst ja gar nicht, was die neulich mit mir gem... Aber egal. Nicht der Rede wert!\n@c0@"
  en: "@aBianca@bYou wun't believe what they did to me the othⓚⓛ Never mind. It's nothin'!\n@c0@"
  es: "@aBianca@bNo te creerías lo que me hicieron a mí el ot... No importa. ¡No es nada!\n@c0@"
  fr: "@aBianca@bD'ailleurs, tu sais ce qu'ils m'ont fait l'autre jou...\nPeu importe. C'est rienⓠ\n@c0@"
  it: "@aBianca@bNon hai idea di cosa mi hanno fatto l'altro gior...\nNiente, lasciamo perdere!\n@c0@"
  ja: "@a@bビアンカ「この前なんて\n\tわたしの……　ううん\n\tなんでもないわ！\n@c0@"
13:
  de: "@aBianca@bJetzt bleibt mir keine andere Wahl, ich muss auf die Geisterjagd gehen. Hilfst du mir, %a000090?\n@c0@"
  en: "@aBianca@bNow I dun't have any choice but to go off ghostbustin'. Will you give me a hand, %a000090?\n@c0@"
  es: "@aBianca@bAhora no tengo más remedio que salir a cazar fantasmas. ¿Me echas una manita, %a000090?\n@c0@"
  fr: "@aBianca@bCette fois, je n'ai pas le choixⓢ il faut que je parte\nà la chasse aux fantômes. Tu me donneras un\ncoup de main, %a000090ⓡ\n@c0@"
  it: "@aBianca@bChe cattivoni! Però accetto la sfida: sconfiggerò quei fantasmi!\nVuoi darmi una mano, %a000090?\n@c0@"
  ja: "@a@bビアンカ「こうなったら\n\tお化け退治を　するしかないわね。\n\t%a000090も　手伝ってくれるでしょ？\n@c0@"
14:
  de: "@aBianca@bEcht! Du bist ja mutiger, als du aussiehst!\nIch hätte nicht damit gerechnet, dass du Ja sagst.\n@c0@"
  en: "@aBianca@bReally!? You're braver than you look!\r\nI never expected you to say yes.\n@c0@"
  es: "@aBianca@b¿De verdad? ¡Eres más valiente de lo que pareces!\r\nNo pensaba que fueras a decir que sí, ¿sabes?\n@c0@"
  fr: "@aBianca@bVraimentⓡⓐ Tu es plus courageux que tu n'en as\nl'air. Je n'aurais jamais cru que tu dirais oui.\n@c0@"
  it: "@aBianca@bDici davvero?!\nNon credevo che fossi tanto coraggioso!\n@c0@"
  ja: "@a@bビアンカ「本当！？　%a000090ったら\n\tずいぶん　たくましくなったのね！\n\tびっくりしちゃったわ。\n@c0@"
15:
  de: "@aBianca@bAch, komm schon! Ich bin ja auch dabei, also wird dir schon nichts passieren. Gehen wir!\n@c0@"
  en: "@aBianca@bOh, go on! I'll be with you, so you wun't come to any harm or nothin'. Let's go!\n@c0@"
  es: "@aBianca@bAnda, venga. Estaré todo el rato contigo para que no te pase nada de nada, ¿me entiendes? ¡Vamos!\n@c0@"
  fr: "@aBianca@bOh, allezⓠ Je serai avec toi, alors il ne t'arrivera rien. Allons-yⓠ\n@c0@"
  it: "@aBianca@bSu, andiamo!\nL'unione fa la forza, e insieme batteremo quegli spettri!\n@c0@"
  ja: "@a@bビアンカ「そんなの　ダメよ！\n\tわたしが　ついてるから　大丈夫。\n\tねっ　いっしょに　いきましょう！\n@c0@"
16:
  de: "@aBianca@bIch frage mich, ob's dort wirklich Gespenster gibt.\n@c0@"
  en: "@aBianca@bI wonder if there really are ghosts there.\n@c0@"
  es: "@aBianca@bMe pregunto si habrá de verdad fantasmas allí.\n@c0@"
  fr: "@aBianca@bJe me demande s'il y a vraiment des fantômes,\r\nlà-bas.\n@c0@"
  it: "@aBianca@bChissà se il Palazzo delle Ombre è davvero infestato dai fantasmi...\n@c0@"
  ja: "@a@bビアンカ「でも　ホントに\n\tお化けなんて　いるのかしらね。\n@c0@"
17:
  de: "@aBianca@bWir dürfen nicht zulassen, dass diese fiesen Kerle das arme kleine Kätzchen weiter ärgern!\n@c0@"
  en: "@aBianca@bWe can't let those nasty brats get away with bullyin' that poor little cat!\n@c0@"
  es: "@aBianca@b¡No podemos dejar que esos mocosos se salgan con la suya después de haber martirizado a ese pobre gato!\n@c0@"
  fr: "@aBianca@bOn ne peut pas laisser ces petits morveux embêter ce pauvre petit chat sans rien direⓠ\n@c0@"
  it: "@aBianca@bNon possiamo permettere che quei cattivoni continuino a maltrattare un povero micino indifeso!\n@c0@"
  ja: "@a@bビアンカ「あんなに　小さい\n\t子ネコを　いじめるなんて\n\tゆるせないわ！\n@c0@"
18:
  de: "@aBianca@bHalt durch, Mieze. Wir werden dich schon retten, keine Bange.\n@c0@"
  en: "@aBianca@bHang in there just a bit longer, puss. We'll rescue you, dun't you worry.\n@c0@"
  es: "@aBianca@bAguanta, gatito. Te vamos a rescatar, no te preocupes.\n@c0@"
  fr: "@aBianca@bTiens bon encore un tout petit peu, minou.\r\nOn va te sauver, ne t'inquiète pas.\n@c0@"
  it: "@aBianca@bResisti ancora un po', micio bello.\nTi libereremo presto, non temere.\n@c0@"
  ja: "@a@bビアンカ「待っててね　ネコさん。\n\tきっと　助けてあげるから。\n@c0@"
19:
  de: "@aBianca@bDieses Schnurren ist schon komisch, aber echt!\n@c0@"
  en: "@aBianca@bThat's a funny old purr you've got goin' there, though!\n@c0@"
  es: "@aBianca@b¡Ese ronroneo tuyo es de lo más raro!\n@c0@"
  fr: "@aBianca@bMais c'est vrai que tu as une drôle de façon de ronronnerⓠ\n@c0@"
  it: "@aBianca@bTornerai a fare le fusa come una volta, vedrai!\n@c0@"
  ja: "@a@bビアンカ「でも　たしかに\n\t変わった鳴き声の　ネコさんね……。\n@c0@"
20:
  de: "@aBianca@bKaum vorstellbar, dass der alte Mann jemals jung war, was?\n@c0@"
  en: "@aBianca@bIt's hard to imagine that old man was ever young, eh!?\n@c0@"
  es: "@aBianca@bEs difícil imaginar a ese viejo cuando era joven, ¿a que sí?\n@c0@"
  fr: "@aBianca@bDifficile d'imaginer que ce vieux bonhomme a été jeune un jour, heinⓡⓐ\n@c0@"
  it: "@aBianca@bChissà se da giovane quel vecchio signore aveva già tutte le rughe che ha adesso...\n@c0@"
  ja: "@a@bビアンカ「あのおじいさんにも\n\t子供の時があったなんて\n\tなんだか　ふしぎだよね。\n@c0@"
21:
  de: "@aBianca@bDas ist kein Ort für Kinder, %a000090! Aber das konntest du wohl nicht wissen.\n@c0@"
  en: "@aBianca@bKids aren't supposed to come in here, %a000090! I suppose you couldn't have known that, though.\n@c0@"
  es: "@aBianca@b¡Los niños no deben venir aquí, %a000090! Pero claro, ¿cómo ibas tú a saberlo?\n@c0@"
  fr: "@aBianca@bLes enfants ne sont pas censés entrer là, %a000090ⓠ Mais tu ne pouvais pas le savoir, j'imagine.\n@c0@"
  it: "@aBianca@bI bambini non dovrebbero entrare qui, %a000090!\nNon lo sapevi?\n@c0@"
  ja: "@a@bビアンカ「%a000090は　知らないかも\n\tしれないけど　ここは　\n\t子供が入っちゃ　ダメなお店なのよ！\n@c0@"
22:
  de: "@aBianca@bMeine Mama würde bestimmt genauso reagieren, wenn ich ihr sagen würde, dass ich eine Katze möchte. So sind Mütter halt, was?\n@c0@"
  en: "@aBianca@bI bet my mum would be just the same if I said I wanted a cat. Mums, eh!?\n@c0@"
  es: "@aBianca@bSeguro que mi madre diría lo mismo si le dijese que quiero un gato. ¡Madre no hay más que una!, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe parie que ma mère dirait la même chose si je lui demandais un chat. Ah, les mamans, heinⓠ\n@c0@"
  it: "@aBianca@bScommetto che la mia mamma farebbe la stessa cosa, se le dicessi che voglio un gatto.\nLe mamme sono tutte uguali...\n@c0@"
  ja: "@a@bビアンカ「うちのママも\n\tネコを飼いたいって言うと\n\t必ず　同じこと言うのよ。\n@c0@"
23:
  de: "@aBianca@bHier ist viel mehr los als im mickrigen alten Steinach, was? Du siehst ein bisschen überrascht aus.\n@c0@"
  en: "@aBianca@bIt's a lot livelier than little old Whealbrook, eh? You look a bit surprised.\n@c0@"
  es: "@aBianca@bEsto es mucho más animado que Arroyofrío, ¿a que sí? Pareces sorprendido.\n@c0@"
  fr: "@aBianca@bC'est beaucoup plus animé qu'à Ruycelieu, heinⓡ\nTu as l'air un peu surpris.\n@c0@"
  it: "@aBianca@bQui c'è molto più movimento rispetto a Valcava, eh?\nEh eh eh! Non temere, ti ci abituerai presto.\n@c0@"
  ja: "@a@bビアンカ「サンタローズと　くらべると\n\tずっと　にぎやかでしょう。\n\tびっくりした？\n@c0@"
24:
  de: "@aBianca@bDu bist früher recht oft zum Spielen zu uns rüber gekommen, als du klein warst. Weißt du das nicht mehr?\n@c0@"
  en: "@aBianca@bYou used to come 'round my house to play quite a lot when you were little. Don't you remember?\n@c0@"
  es: "@aBianca@bSolías venir mucho por mi casa a jugar cuando eras pequeño. ¿Te acuerdas?\n@c0@"
  fr: "@aBianca@bTu venais souvent à la maison pour jouer quand tu étais petit. Tu ne t'en rappelles pasⓡ\n@c0@"
  it: "@aBianca@bDa piccolo venivi spesso a giocare a casa mia, ricordi?\n@c0@"
  ja: "@a@bビアンカ「あなたが　小さい頃\n\tよくうちに　遊びに来てたのよ。\n\tどう？　覚えてないかしら？\n@c0@"
25:
  de: "@aBianca@bDas ist das beste Zimmer im ganzen Haus.\nDie Aussicht von hier ist einfach toll.\n@c0@"
  en: "@aBianca@bThis is the best room in the house.\r\nThe view from here's amazin'.\n@c0@"
  es: "@aBianca@bEsta es la mejor habitación de la casa.\r\nLa vista desde aquí es bestial.\n@c0@"
  fr: "@aBianca@bC'est la meilleure chambre de l'auberge.\r\nD'ici, la vue est incroyable.\n@c0@"
  it: "@aBianca@bQuesta è la stanza migliore della casa.\nDa qui il panorama è magnifico...\n@c0@"
  ja: "@a@bビアンカ「ここが　うちで\n\tいちばん　いい　お部屋なの。\n\tここからの　ながめは　最高なのよ！\n@c0@"
26:
  de: "@aBianca@bMama hat letztes Jahr einen Weinstock gepflanzt.\n@c0@"
  en: "@aBianca@bMum planted a grapevine last year.\n@c0@"
  es: "@aBianca@bMamá plantó una parra el año pasado.\n@c0@"
  fr: "@aBianca@bMaman a planté de la vigne, l'année dernière.\n@c0@"
  it: "@aBianca@bL'anno scorso la mamma ha piantato una vite.\n@c0@"
  ja: "@a@bビアンカ「ママが　去年\n\tぶどう棚を　作ったのよ。\n@c0@"
27:
  de: "@aBianca@bWenn der ein paar Trauben trägt, dann lass ich dich auch probieren.\n@c0@"
  en: "@aBianca@bWhen we get some grapes off it, I'll let you have a taste.\n@c0@"
  es: "@aBianca@bCuando podamos recoger unas uvas, te las dejaré probar, ¿sabes?\n@c0@"
  fr: "@aBianca@bLorsqu'elle donnera du raisin, je te laisserai en goûter.\n@c0@"
  it: "@aBianca@bQuando raccoglieremo qualche grappolo, ti farò assaggiare la nostra uva.\n@c0@"
  ja: "@a@bビアンカ「おいしいぶどうが\n\tできたら　%a000090にも\n\t食べさせてあげるわね。\n@c0@"
28:
  de: "@aBianca@bBist du immer noch müde, %a000090?\n@c0@"
  en: "@aBianca@bYou still a bit sleepy, %a000090?\n@c0@"
  es: "@aBianca@b¿Tienes sueño, %a000090?\n@c0@"
  fr: "@aBianca@bTu es encore fatigué, %a000090ⓡ\n@c0@"
  it: "@aBianca@bHai ancora sonno, %a000090?\n@c0@"
  ja: "@a@bビアンカ「%a000090　ひょっとして\n\tまだ　寝ぼけてるの？\n@c0@"
29:
  de: "@aBianca@bDu solltest dich besser ein wenig zusammenreißen, wenn wir zu den Geisterzinnen aufbrechen, um dort Gespenster zu jagen.\n@c0@"
  en: "@aBianca@bYou'd better get with it if we're off to Uptaten Towers on our ghostbustin' mission.\n@c0@"
  es: "@aBianca@bSerá mejor que duermas un poco antes de que vayamos a las torres Alverres en misión de cazafantasmas, ¿me entiendes?\n@c0@"
  fr: "@aBianca@bTu ferais bien de te secouer un peu si tu veux aller aux tours Karpatt avec moi pour notre mission de chasse aux fantômes.\n@c0@"
  it: "@aBianca@bCerca di fartelo passare, perché dobbiamo andare a caccia di fantasmi nel Palazzo delle Ombre.\n@c0@"
  ja: "@a@bビアンカ「シャキッとしてよ。\n\tこれから　レヌール城へ行って\n\tお化け退治をするんだから！\n@c0@"
30:
  de: "@aBianca@bIch weiß nicht, ob ich das glauben soll. Oder willst du damit sagen, dass du immer so schläfrig aussiehst?\n@c0@"
  en: "@aBianca@bI'm not sure I believe you. Unless you're sayin' you always look that dopey.\n@c0@"
  es: "@aBianca@bNo sé si te creo. Igual es que siempre tienes esa cara de sueñirri.\n@c0@"
  fr: "@aBianca@bJe ne suis pas sûre de te croire. Sauf si tu me dis que tu as toujours l'air aussi benêt.\n@c0@"
  it: "@aBianca@bDavvero?!\nVorresti farmi credere che hai l'aria così intontita anche quando sei sveglio?! Eh eh eh!\n@c0@"
  ja: "@a@bビアンカ「本当かな？\n\tじゃあ　その眠そうなカオは\n\tふだんからって　ことなのね。\n@c0@"
31:
  de: "@aBianca@bDieses Mal schaffen wir das. Wir kümmern uns um die Gespenster und befreien das arme Kätzchen.\n@c0@"
  en: "@aBianca@bThis time we'll manage it. We'll sort them ghosts out and set that poor kitten free.\n@c0@"
  es: "@aBianca@bEsta vez lo conseguiremos. Nos vamos a encargar de esos fantasmas y a liberar a ese pobre gatito.\n@c0@"
  fr: "@aBianca@bCette fois, on va réussir. On va régler leur compte\r\nà ces fantômes et libérer ce pauvre petit chat.\n@c0@"
  it: "@aBianca@bQuesta volta ce la faremo!\nDaremo una lezione ai fantasmi e libereremo quel povero gattino!\n@c0@"
  ja: "@a@bビアンカ「今日こそ　お化け退治をして\n\tあの子ネコを　助けなくちゃ。\n@c0@"
32:
  de: "@aBianca@bPass auf, %a000090! Wenn du den aufweckst, kriegen wir Ärger!\n@c0@"
  en: "@aBianca@bWatch out, %a000090! We'll be in trouble if you wake him up.\n@c0@"
  es: "@aBianca@b¡Cuidado, %a000090! Si le despiertas nos meteremos en problemas.\n@c0@"
  fr: "@aBianca@bAttention, %a000090ⓠ\nSi tu le réveilles, on va avoir des ennuis.\n@c0@"
  it: "@aBianca@bFai piano, %a000090!\nSe si sveglia, siamo fritti!\n@c0@"
  ja: "@a@bビアンカ「まあ　%a000090ったら\n\t何してるの？　おじさまが\n\t起きちゃうじゃない。\n@c0@"
33:
  de: "@aBianca@bIch glaub nicht, dass ich mich vor einem Gespenst fürchten würde, das bloß doof rumsteht und heult.\n@c0@"
  en: "@aBianca@bI dun't think I'd be scared of a ghost if it was just standin' there cryin'.\n@c0@"
  es: "@aBianca@bNo creo que me diese miedo un fantasma si se quedase ahí parado llorando.\n@c0@"
  fr: "@aBianca@bJe ne crois pas que j'aurais peur d'un fantôme\r\ns'il se contentait de pleurer sans rien faire.\n@c0@"
  it: "@aBianca@bPerché mai dovrei avere paura dei fantasmi se tutto quello che fanno è urlare come disperati, eh?!\n@c0@"
  ja: "@a@bビアンカ「泣いてるお化けなら\n\t怖くないんだけどね。\n@c0@"
34:
  de: "@aBianca@bIch hoffe, dass Mama sich nicht mit Papas Erkältung ansteckt, wo sie doch im gleichen Bett schlafen und so.\n@c0@"
  en: "@aBianca@bI hope Mum dun't catch Dad's cold, sleepin' that close and all.\n@c0@"
  es: "@aBianca@bEspero que papá no le pegue el catarro a mamá, con eso de dormir juntos.\n@c0@"
  fr: "@aBianca@bJ'espère que maman n'attrapera pas le rhume de papa, à dormir si près de lui comme ça.\n@c0@"
  it: "@aBianca@bSpero che papà non attacchi il raffreddore alla mamma, visto che dormono così vicini.\n@c0@"
  ja: "@a@bビアンカ「となりで寝てて　ママに\n\tカゼが　うつったりしないのかしら。\n\tちょっと　心配よね。\n@c0@"
35:
  de: "@aBianca@bHier ist schon ewig kaltes Wetter.\nKein Wunder, dass Papa krank wurde.\n@c0@"
  en: "@aBianca@bWe've had cold weather for ages now.\r\nIt's no surprise Dad got ill with it.\n@c0@"
  es: "@aBianca@bLlevamos siglos con mal tiempo.\r\nNo me extraña que papá se haya puesto enfermo.\n@c0@"
  fr: "@aBianca@bÇa fait très longtemps qu'il fait froid, ici.\r\nPas étonnant que papa soit tombé malade.\n@c0@"
  it: "@aBianca@bQuest'anno l'inverno è stato lungo lungo lungo e freddo freddo freddo.\nPer questo il mio papà si è ammalato...\n@c0@"
  ja: "@a@bビアンカ「ずっと　寒さが続いているから\n\tカゼひいちゃったんだわ　お父さん。\n@c0@"
36:
  de: "@aBianca@bUns für Gespenster zu halten! Also echt!\n@c0@"
  en: "@aBianca@bFancy thinkin' we're ghosts! Charmin'!\n@c0@"
  es: "@aBianca@b¡Qué curioso, pensar que éramos fantasmas! ¡Qué mono!\n@c0@"
  fr: "@aBianca@bNous prendre pour des fantômes... Franchementⓠ\n@c0@"
  it: "@aBianca@bMi piacerebbe essere un fantasma, così potrei fare tanti scherzetti alla gente.\nPerò non credo che esistano le bambine-fantasma...\n@c0@"
  ja: "@a@bビアンカ「わたしたちを\n\tお化けとまちがえるなんて\n\t失礼しちゃうわ！\n@c0@"
37:
  de: "@aBianca@bIch wusste, dass er schläft. Sieht so aus, als ob wir aufbrechen könnten. Aber jetzt bin ich doch ein klein wenig nervös.\n@c0@"
  en: "@aBianca@bI knew he'd be asleep. Looks like we can leave.\r\nI'm a little bit nervous now, though.\n@c0@"
  es: "@aBianca@bSabía que estaría dormido. Parece que podemos irnos.\r\nPero estoy un poco nerviosa.\n@c0@"
  fr: "@aBianca@bJe savais qu'il serait endormi. On dirait qu'on peut partir. Je suis quand même un petit peu nerveuse.\n@c0@"
  it: "@aBianca@bSta dormendo...\nPossiamo andare.\nSono emozionata, sai? Il cuore mi batte forte forte!\n@c0@"
  ja: "@a@bビアンカ「やっぱり　寝てる……。\n\t外に出られるのは　いいけど\n\tちょっと　不安になるよね。\n@c0@"
38:
  de: "@aBianca@bKaum vorstellbar, dass der alte Mann jemals jung war, was?\n@c0@"
  en: "@aBianca@bIt's hard to imagine that old man was ever young, eh!?\n@c0@"
  es: "@aBianca@bEs difícil imaginar a ese viejo cuando era joven, ¿a que sí?\n@c0@"
  fr: "@aBianca@bDifficile d'imaginer que ce vieux bonhomme a été jeune un jour, heinⓡⓐ\n@c0@"
  it: "@aBianca@bChissà se da giovane quel vecchio signore aveva già tutte le rughe che ha adesso...\n@c0@"
  ja: "@a@bビアンカ「あのおじいさんにも\n\t子供の時があったなんて\n\tなんだか　ふしぎだよね。\n@c0@"
39:
  de: "@aBianca@bHoppla. Jetzt könnten wir Ärger kriegen. Aber wir führen ja nichts Böses im Schilde oder so.\n@c0@"
  en: "@aBianca@bOops. Looks like we're in trouble. But it's not like we were up to no good or nothin'.\n@c0@"
  es: "@aBianca@bVaya. Parece que nos hemos metido en problemas. Aunque no íbamos a hacer nada malo ni nada, ¿sabes?\n@c0@"
  fr: "@aBianca@bOups. Il y a un os, on dirait. Mais ça n'est pas comme si on faisait des bêtises, non plus.\n@c0@"
  it: "@aBianca@bOps!\nCi hanno scoperti!\nPerò non stavamo mica facendo nulla di male, vero?\n@c0@"
  ja: "@a@bビアンカ「おこられちゃったね。\n\t別に　遊んでるわけじゃ\n\tないんだけどな……。\n@c0@"
40:
  de: "@aBianca@bTja, für Kinder ist es wohl doch keine so gute Idee, nachts in die Schänke zu gehen.\n@c0@"
  en: "@aBianca@bLooks like it's not a good idea for kids to go in a pub of a night after all.\n@c0@"
  es: "@aBianca@bParece que no es una buena idea que los niños entren en una taberna de noche y eso.\n@c0@"
  fr: "@aBianca@bOn dirait que ça n'est pas une bonne idée pour des enfants d'aller dans une taverne la nuit, finalement.\n@c0@"
  it: "@aBianca@bIn questo posto non lasciano entrare i bambini nemmeno di giorno, figuriamoci di notte!\n@c0@"
  ja: "@a@bビアンカ「やっぱり　子供だけで\n\t夜の酒場に来るなんて\n\tよくないよね。\n@c0@"
41:
  de: "@aBianca@bIch hab's! Wir sollten hier wieder herkommen, wenn wir groß sind, %a000090!\n@c0@"
  en: "@aBianca@bI know! We should come back here again one day when we're all grown up, %a000090!\n@c0@"
  es: "@aBianca@b¡Ya sé! ¡Tenemos que volver otra vez cuando ya seamos mayores, %a000090!\n@c0@"
  fr: "@aBianca@bJe saisⓠ On devrait revenir ici un jour, quand on sera grands, %a000090ⓠ\n@c0@"
  it: "@aBianca@bNon preoccuparti, %a000090!\nTorneremo qui quando saremo grandi!\n@c0@"
  ja: "@a@bビアンカ「そうだっ！\n\t%a000090　大人になったら\n\t一緒に　ここに来ようよ。\n@c0@"
42:
  de: "@aBianca@bJawohl, das machen wir! Versprochen!\n@c0@"
  en: "@aBianca@bWe'll do it! And that's a promise.\n@c0@"
  es: "@aBianca@b¡Lo haremos! Lo prometo, ¿me entiendes?\n@c0@"
  fr: "@aBianca@bOn le feraⓠ C'est une promesse.\n@c0@"
  it: "@aBianca@bTe lo prometto!\nEh eh eh!\n@c0@"
  ja: "@a@bビアンカ「約束だからね！\n@c0@"
43:
  de: "@aBianca@bIch verstehe, worauf er hinauswill. Das Glas, aus dem man trinkt, kann genauso wichtig sein wie das Getränk selbst.\n@c0@"
  en: "@aBianca@bI understand what he's gettin' at. The glass you drink from can be just as important as the drink itself.\n@c0@"
  es: "@aBianca@bYa sé lo que piensa. El vaso en el que bebes puede ser tan importante como la bebida que bebes.\n@c0@"
  fr: "@aBianca@bJe comprends ce qu'il veut dire. Le verre dans\r\nlequel on boit peut être aussi important que\r\nla boisson elle-même.\n@c0@"
  it: "@aBianca@bEppure la mia mamma mi dice sempre che il succo d'uva fa bene. Ogni giorno mi dà un bicchiere di succo appena spremuto!\n@c0@"
  ja: "@a@bビアンカ「わたしは　分かるわ。\n\t器って　けっこう　重要なのよね。\n@c0@"
44:
  de: "@aBianca@bIch frage mich, wieso Erwachsene sich immer so merkwürdig benehmen, wenn sie was getrunken haben. Kapier' ich nicht.\n@c0@"
  en: "@aBianca@bI wonder why grown-ups act so funny when they've bin drinkin'. I dun't get it.\n@c0@"
  es: "@aBianca@b¿Por qué los mayores se portan de una forma tan rara cuando beben? No lo entiendo.\n@c0@"
  fr: "@aBianca@bJe me demande pourquoi les grandes personnes se conduisent si bizarrement quand elles ont bu.\r\nJe ne comprends pas.\n@c0@"
  it: "@aBianca@bMa come parla quel signore?\r\nSh-sh-sh-sh-sh... Non si capiva niente!\r\nForse ha bevuto troppo succo d'uva...\n@c0@"
  ja: "@a@bビアンカ「大人って　どうして\n\tお酒を飲むと　陽気になるのかしら？\n\t変なの～。\n@c0@"
45:
  de: "@aBianca@bAlles in Ordnung mit dir, %a000090? Vielleicht hätten wir ein bisschen vorsichtiger sein sollen, was?\n@c0@"
  en: "@aBianca@bAre you okay, %a000090? Maybe we should've bin a bit more careful, eh?\n@c0@"
  es: "@aBianca@b¿Estás bien, %a000090? Tendríamos que haber ido con más cuidado, ¿eh?\n@c0@"
  fr: "@aBianca@bÇa va, %a000090ⓡ On aurait peut-être dû\nêtre plus prudents, heinⓡ\n@c0@"
  it: "@aBianca@bStai bene, %a000090?\nForse avremmo dovuto fare un po' più di attenzione, eh?\n@c0@"
  ja: "@a@bビアンカ「%a000090　大丈夫？\n\t魔物を相手に　ちょっと\n\tはりきりすぎちゃったみたいね。\n@c0@"
46:
  de: "@aBianca@bDiesmal sollten wir versuchen, das Ganze etwas langsamer anzugehen.\n@c0@"
  en: "@aBianca@bWe'd better try and take it a bit more slowly this time.\n@c0@"
  es: "@aBianca@bEsta vez nos lo vamos a tomar con más calma.\n@c0@"
  fr: "@aBianca@bOn ferait bien de réessayer en faisant un peu plus\r\nattention, cette fois.\n@c0@"
  it: "@aBianca@bLa prossima volta dovremo agire con più prudenza...\n@c0@"
  ja: "@a@bビアンカ「今度は　無理しないで\n\tしんちょうに行きましょう。\n@c0@"
47:
  de: "@aBianca@bIch hab mich noch nie so aus dem Dorf geschlichen. Hach, ist das aufregend!\n@c0@"
  en: "@aBianca@bI've never snuck out of town like this before.\r\nIt's well excitin'!\n@c0@"
  es: "@aBianca@bNunca antes he salido de la ciudad a escondidas, ¿sabes?\r\n¡Qué emocionante!\n@c0@"
  fr: "@aBianca@bJe ne m'étais jamais enfuie en secret de la ville comme ça, avant. C'est palpitantⓠ\n@c0@"
  it: "@aBianca@bNon ero mai uscita dal villaggio di nascosto!\nChe emozione!\n@c0@"
  ja: "@a@bビアンカ「夜　こっそり\n\t外に出るなんて　初めてよ。\n\tワクワクしちゃう～。\n@c0@"
48:
  de: "@aBianca@bWir haben die Katze gerettet und den netten Leuten aus dem Schloss geholfen, also war's die Mühe auf jeden Fall wert.\n@c0@"
  en: "@aBianca@bWe saved the cat and we helped those nice people at the castle, so it was worth all the effort.\n@c0@"
  es: "@aBianca@bHemos salvado al gato y hemos ayudado a esas personas tan amables del castillo, así que ha valido la pena.\n@c0@"
  fr: "@aBianca@bOn a sauvé le chat et aidé ces gentilles personnes\r\nau château, alors ça valait bien tout ces efforts.\n@c0@"
  it: "@aBianca@bAbbiamo salvato il gatto e aiutato quelle brave persone al castello.\nÈ valsa la pena fare tanta fatica!\n@c0@"
  ja: "@a@bビアンカ「子ネコも　お城の王さまたちも\n\t助けることができたし\n\tがんばったかいが　あったわね。\n@c0@"
49:
  de: "@aBianca@bHa! Also hält er mich nicht mehr für feige.\n@c0@"
  en: "@aBianca@bHa! So he dun't think I'm a wimp any more.\n@c0@"
  es: "@aBianca@b¡Ja! Ahora ya no piensa que soy boba, no...\n@c0@"
  fr: "@aBianca@bHaⓠ Alors il ne me prend plus pour une poule mouillée, maintenant.\n@c0@"
  it: "@aBianca@bOra non pensa più che siamo dei fifoni, eh?!\n@c0@"
  ja: "@a@bビアンカ「少しは　わたしたちのこと\n\t認めてもらえたみたいね。\n@c0@"
50:
  de: "@aBianca@bIch war mir gar nicht so sicher, dass ich das hinkriegen würde! Ohne dich hätte ich's wohl nicht geschafft, %a000090.\n@c0@"
  en: "@aBianca@bI wun't too sure if I'd manage it either! I doubt I could've done it without you, %a000090.\n@c0@"
  es: "@aBianca@b¡No estoy segura de que me las hubiera podido apañar sola! No creo que hubiera podido sin ti, %a000090.\n@c0@"
  fr: "@aBianca@bJe n'étais pas très sûre non plus qu'on y arriverait. Je n'aurais sans doute jamais réussi sans toi, %a000090.\n@c0@"
  it: "@aBianca@bA dire la verità, nemmeno io credevo che ci sarei riuscita!\nSenza di te non ce l'avrei mai fatta, %a000090.\n@c0@"
  ja: "@a@bビアンカ「わたしも　本当に\n\t退治できると思わなかったわ。\n\t%a000090が　手伝ってくれたおかげね。\n@c0@"
51:
  de: "@aBianca@b%0%a001210 scheint recht glücklich zu sein. Ich hoffe, dass ihm sein neuer Name gefällt.\n@c0@"
  en: "@aBianca@b%0%a001210 seems pretty happy. I hope he likes his new name.\n@c0@"
  es: "@aBianca@b%0%a001210 parece bastante contento. Espero que le guste su nuevo nombre, ¿sabes?\n@c0@"
  fr: "@aBianca@b%0%a001210 a l'air très heureux. J'espère que son nouveau nom lui plaît.\n@c0@"
  it: "@aBianca@bGuarda quant'è felice %a001210!\nSpero che il suo nuovo nome gli piaccia...\n@c0@"
  ja: "@a@bビアンカ「%a001210ちゃんも\n\t喜んでいるみたい。\n\t気に入ってくれたのかしら。\n@c0@"
52:
  de: "@aBianca@bDiese Wache schläft nachts immer ein, also kann sie uns nicht daran hindern abzuhauen. Hast's ja selbst gesehen, nicht wahr, %a000090?\n@c0@"
  en: "@aBianca@bThat guard always falls asleep of a night, so he can't stop us goin' out. You've seen it for yourself now, eh, %a000090?\n@c0@"
  es: "@aBianca@bEse guardia siempre se queda dormido por la noche, así que no podrá evitar que salgamos, ¿sabes?\n㈡\nAhora ya lo has visto con tus propios ojos, ¿eh, %a000090?\n@c0@"
  fr: "@aBianca@bCe garde s'endort toujours, une fois qu'il fait nuit, alors il ne peut pas nous empêcher de sortir.\nTu l'as vu par toi-même, hein, %a000090ⓡ\n@c0@"
  it: "@aBianca@b%0%a000090, di notte il soldato si addormenta sempre durante il suo turno di guardia...\nE, se dorme, non potrà certo impedirci di uscire!\n@c0@"
  ja: "@a@bビアンカ「でも　見張りの　おじさん\n\t夜になると　いつも寝ちゃうの\n\t%a000090も　知ってるわよね。\n@c0@"
53:
  de: "@aBianca@bLangsam komm ich mir ein bisschen komisch vor, wenn ich so mit Lob überhäuft werde.\n@c0@"
  en: "@aBianca@bI'm startin' to feel a bit weird havin' all this praise lumped on me.\n@c0@"
  es: "@aBianca@bEstoy empezando a sentirme un poco rara, con todo el mundo haciéndome la pelota.\n@c0@"
  fr: "@aBianca@bÇa commence à me faire drôle d'entendre tous ces compliments.\n@c0@"
  it: "@aBianca@bNon mi era mai capitato di ricevere tanti complimenti, sai? Mi sento un po' in imbarazzo...\nA te non fanno nessun effetto?\n@c0@"
  ja: "@a@bビアンカ「みんなが　ほめてくれるから\n\t何だか　くすぐったいわね。\n@c0@"
54:
  de: "@aBianca@bDie muss aber verflixt gute Ohren haben, wenn sie aus dieser Entfernung noch Schreie aus dem Schloss hören kann!\n@c0@"
  en: "@aBianca@bShe must have blimmin' good ears to be able to hear cries from the castle at this distance!\n@c0@"
  es: "@aBianca@b¡Qué buen oído debe de tener para oír gritos del castillo a esta distancia!\n@c0@"
  fr: "@aBianca@bElle doit avoir l'ouïe drôlement fine pour entendre des pleurs dans le château à cette distanceⓠ\n@c0@"
  it: "@aBianca@bSentiva le urla provenienti da così lontano?\r!\nMamma mia! Deve avere un udito portentoso!\n@c0@"
  ja: "@a@bビアンカ「お城からの　泣き声が\n\tここで　聞こえてたなんて\n\tあのお姉さん　耳がいいんだね！\n@c0@"
55:
  de: "@aBianca@bIch dachte schon, dass ich jetzt dran bin, aber Mama sieht gar nicht so wütend aus.\n@c0@"
  en: "@aBianca@bI thought I'd really be for it, but Mum dun't seem all that angry.\n@c0@"
  es: "@aBianca@bCreía que me iban a echar la bronca de mi vida, pero no parece que mamá esté enfadada.\n@c0@"
  fr: "@aBianca@bJe pensais vraiment que j'allais me faire disputer, mais maman n'a pas l'air si en colère que ça.\n@c0@"
  it: "@aBianca@bTemevo che la mamma mi avrebbe punita, invece non sembrava tanto arrabbiata.\nEhm, diciamo che non era TROPPO arrabbiata...\n@c0@"
  ja: "@a@bビアンカ「もっと　しかられるかと\n\t思ってたけど　ママ\n\tそんなに　怒ってないみたい。\n@c0@"
56:
  de: "@aBianca@bDas liegt bestimmt daran, dass du mit mir dort warst, %a000090.\n@c0@"
  en: "@aBianca@bI bet it's because you were there with me, %a000090.\n@c0@"
  es: "@aBianca@bSeguro que es porque tú estabas conmigo, %a000090, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe parie que c'est parce que tu étais là-bas\navec moi, %a000090.\n@c0@"
  it: "@aBianca@bScommetto che si è trattenuta perché tu eri con me, %a000090.\n@c0@"
  ja: "@a@bビアンカ「きっと　%a000090と\n\tいっしょだった　おかげね。\n@c0@"
57:
  de: "@aBianca@bDu bist ziemlich tapfer, wenn man bedenkt, dass du zwei Jahre jünger bist als ich.\n@c0@"
  en: "@aBianca@bYou're pretty brave considerin' you're two years younger than me and all that.\n@c0@"
  es: "@aBianca@bEres bastante valiente, y eso que tienes dos años menos que yo y tal.\n@c0@"
  fr: "@aBianca@bTu es plutôt courageux pour quelqu'un qui a\r\ndeux ans de moins que moi.\n@c0@"
  it: "@aBianca@bLo sai? Sei molto coraggioso, per la tua età.\nCioè, hai due anni meno di me!\nSei ancora un poppante!\n@c0@"
  ja: "@a@bビアンカ「わたしより　２つも年下なのに\n\t%a000090って　ホントに\n\t勇気あるよね！\n@c0@"
58:
  de: "@aBianca@bIch schätze, dass du dabei warst, hat mir auch geholfen, ein bisschen tapferer zu sein.\n@c0@"
  en: "@aBianca@bI reckon havin' you along helped me to be that bit braver as well.\n@c0@"
  es: "@aBianca@bSupongo que yo también he sido un poco más valiente porque tú estabas conmigo.\n@c0@"
  fr: "@aBianca@bJe crois que le fait que tu aies été là m'a aussi aidée à être un peu plus courageuse.\n@c0@"
  it: "@aBianca@bEh eh eh! Scherzo, %a000090.\nAnzi, penso che sia stata proprio la tua presenza a darmi coraggio...\n@c0@"
  ja: "@a@bビアンカ「わたしも　そのおかげで\n\tいつもより　ずっと\n\t勇気づけられてたんだよ。\n@c0@"
59:
  de: "@aBianca@bIhr werdet dann wohl nach Steinach zurückkehren, sobald du dich hier verabschiedet hast, wie?\n@c0@"
