  fr: "@aBianca@bJ'ai eu un peu peur, pendant un moment, quand j'étais là-dedans, mais je suis sûre que c'est surtout fait pour être spectaculaire.\n@c0@"
  it: "@aBianca@bPrima mi sono spaventata, ma ti prometto che non succederà più...\n@c0@"
  ja: "@a@bビアンカ「さっきまでは　ちょっと\n\tこわかったけど　こんなの\n\tこけおどしばっかりじゃない。\n@c0@"
76:
  de: "@aBianca@bJetzt kann mich nichts mehr erschrecken!\n@c0@"
  en: "@aBianca@bNothin' can frighten me now!\n@c0@"
  es: "@aBianca@b¡Ahora ya nada puede asustarme!\n@c0@"
  fr: "@aBianca@bMaintenant, plus rien ne peut m'effrayerⓠ\n@c0@"
  it: "@aBianca@bIo non ho paura di niente!\n@c0@"
  ja: "@a@bビアンカ「もう　なにが起こったって\n\tおどろかないんだから！\n@c0@"
77:
  de: "@aBianca@bIch frage mich, ob sie früher die Schlossherrin war. Sollen wir mal versuchen, die Treppe runterzugehen?\n@c0@"
  en: "@aBianca@bI wonder if she used to be the head of the castle.\nShall we try goin' down those stairs?\n@c0@"
  es: "@aBianca@bMe pregunto si sería ella la que mandaba en el castillo.\r\n¿Qué tal si bajamos por esas escaleras?\n@c0@"
  fr: "@aBianca@bJe me demande si c'est elle qui dirigeait le château.\nSi on essayait de descendre cet escalierⓡ\n@c0@"
  it: "@aBianca@bChissà, forse era la padrona del castello...\nProviamo a scendere quei gradini?\n@c0@"
  ja: "@a@bビアンカ「さっきの人　もしかして\n\t昔　このお城に住んでた　王妃さま？\n\tあの階段をおりれば　いいのかしら？\n@c0@"
78:
  de: "@aBianca@bDie arme Frau. Muss immer noch leiden, wo sie doch schon tot ist! Stell dir das mal vor!\n@c0@"
  en: "@aBianca@bThat poor woman. Fancy still havin' to suffer even after you're dead!\n@c0@"
  es: "@aBianca@bPobre mujer. ¡Mira que tener que seguir sufriendo hasta después de muerta!\n@c0@"
  fr: "@aBianca@bPauvre femme. Tu imaginesⓢ avoir à souffrir même après sa mortⓠ\n@c0@"
  it: "@aBianca@bPovera donna...\nCerto, dev'essere orribile soffrire anche dopo morti!\n@c0@"
  ja: "@a@bビアンカ「王妃さま　かわいそう…。\n\t死んでしまったあとも\n\tひどい目に　あわされているのね。\n@c0@"
79:
  de: "@aBianca@bKomm schon, %a000090! Machen wir uns an die Arbeit. Schließlich sind wir hier, um die Gespenster zu vertreiben.\n@c0@"
  en: "@aBianca@bCome on, %a000090! Let's get to work. We came here to get rid of ghosts, after all.\n@c0@"
  es: "@aBianca@b¡Vamos, %a000090! Manos a la obra. Hemos venido aquí para acabar con los fantasmas.\n@c0@"
  fr: "@aBianca@bViens, %a000090ⓠ Mettons-nous au travail. Après tout, on est venus ici pour se débarrasser des fantômes.\n@c0@"
  it: "@aBianca@bForza, %a000090! Mettiamoci al lavoro!\nDopotutto siamo venuti qui proprio per sbarazzarci di quei fantasmi, no?\n@c0@"
  ja: "@a@bビアンカ「%a000090　がんばろう！\n\tどうせ　お化けを退治しに\n\t来たんだもの。　いいよね？\n@c0@"
80:
  de: "@aBianca@bHui! Da bin ich jetzt aber ein bisschen erschrocken! Es blitzt und donnert plötzlich so.\n@c0@"
  en: "@aBianca@bYikes! That was a bit of a shock! The lightning's so strong all of a sudden.\n@c0@"
  es: "@aBianca@b¡Ay! ¡Qué susto me he pegado! Ese relámpago ha sonado muy cerca.\n@c0@"
  fr: "@aBianca@bHouⓠ Ça m'a fait un chocⓠ La lumière est si vive,\ntout d'un coup.\n@c0@"
  it: "@aBianca@bAccidenti!\nHai visto quanti lampi?\n@c0@"
  ja: "@a@bビアンカ「あ～　びっくりした。\n\tきゅうに　カミナリが\n\tひどくなったみたい……。\n@c0@"
81:
  de: "@aBianca@bIch frage mich, ob der Kerl, der eben verschwunden ist, hier früher mal der König oder so war.\n@c0@"
  en: "@aBianca@bI wonder if that fella who just disappeared was the king or suchlike of this place.\n@c0@"
  es: "@aBianca@bMe pregunto si el tipo que acaba de desaparecer era el rey de este sitio o algo así.\n@c0@"
  fr: "@aBianca@bJe me demande si le type qui vient de disparaître n'était pas le roi de ce château, ou quelque chose\r\ncomme ça.\n@c0@"
  it: "@aBianca@bForse quel tizio che è appena andato via era il re di questo posto...\n@c0@"
  ja: "@a@bビアンカ「今　消えたのって\n\tこのお城の　王様だった人かな？\n@c0@"
82:
  de: "@aBianca@bWieso verschwinden die beiden denn ständig, anstatt uns einfach zu sagen, was sie zu sagen haben?\n@c0@"
  en: "@aBianca@bWhy do the both of them keep disappearin' rather than just comin' out with whatever it is they want to say?\n@c0@"
  es: "@aBianca@b¿Por qué aparecen y desaparecen todo el rato en vez de salir y decir lo que sea que tengan que decir de corrido?\n@c0@"
  fr: "@aBianca@bPourquoi est-ce qu'ils passent leur temps à disparaître, tous les deux, plutôt que d'exprimer simplement ce qu'ils ont à nous direⓡ\n@c0@"
  it: "@aBianca@bPerché quei due continuano a sparire, invece di dire qualcosa?\nSapranno pur parlare, no?!\n@c0@"
  ja: "@a@bビアンカ「王妃さまも　王様も\n\tなんで　言いたいことを　すぐに\n\t言わないで　消えちゃうのかしら？\n@c0@"
83:
  de: "@aBianca@bDas müssen die Leute sein, die dazu gezwungen werden, immerfort zu tanzen. Die Armen. Sie sehen ganz erschöpft aus.\n@c0@"
  en: "@aBianca@bThose must be the folk who are made to keep dancin'. The poor things. They look exhausted.\n@c0@"
  es: "@aBianca@bDebe de ser esa gente a la que están obligando a bailar sin parar. Pobrecitos. Parecen agotados.\n@c0@"
  fr: "@aBianca@bCe sont sûrement les gens qui sont obligés de danser.\r\nLes pauvres. Ils ont l'air épuisés.\n@c0@"
  it: "@aBianca@bQuelle devono essere le persone che non possono smettere di danzare.\nPoverette, sembrano esauste...\n@c0@"
  ja: "@a@bビアンカ「踊らされてる人たちって\n\tあの人たちのことだね。\n\tなんだか　苦しそう…。\n@c0@"
84:
  de: "@aBianca@bWo ist denn jetzt dieser König hin?\n@c0@"
  en: "@aBianca@bWhere's this king fella off to!?\n@c0@"
  es: "@aBianca@b¡¿Se puede saber dónde se ha metido el rey ese?!\n@c0@"
  fr: "@aBianca@bMais où est donc parti ce roiⓡⓐ\n@c0@"
  it: "@aBianca@bChe fine ha fatto quella specie di re?!\n@c0@"
  ja: "@a@bビアンカ「いったい　王さまは\n\tどこまで行くつもりなの…？\n@c0@"
85:
  de: "@aBianca@bEr ist ein klein bisschen aufdringlich, nicht? Aber trotzdem können wir ruhig tun, worum er uns bittet, deswegen sind wir ja eh hier.\n@c0@"
  en: "@aBianca@bHe's a bit of a pushy one, eh? Still, we can agree to what he wants because that's the reason we're here anyway.\n@c0@"
  es: "@aBianca@bEs un poco avasallador, ¿eh? Pero bueno, podemos aceptar hacer lo que pideⓓ al fin y al cabo, por eso estamos aquí.\n@c0@"
  fr: "@aBianca@bIl est du genre insistant, heinⓡ Enfin, on peut bien accepter ce qu'il demande, vu que c'est pour ça qu'on est là, de toute façon.\n@c0@"
  it: "@aBianca@bÈ un po' troppo insistente per i miei gusti, ma direi di fare quello che ci ha chiesto. D'altronde è proprio per questo motivo che siamo venuti qui, no?\n@c0@"
  ja: "@a@bビアンカ「ごういんな　王さまだよね。\n\tお化け退治に　来たんだから\n\t引き受けるんだけどさ……。\n@c0@"
86:
  de: "@aBianca@bDer Graf versucht wohl, uns zu helfen, so gut er kann. Das ist nett.\n@c0@"
  en: "@aBianca@bI s'pose the Count's tryin' to help us out as much as he can. That's good.\n@c0@"
  es: "@aBianca@bSupongo que el conde intenta ayudarnos todo lo que puede. Fenomenal.\n@c0@"
  fr: "@aBianca@bJ'imagine que le comte essaie de nous aider autant qu'il peut. C'est plutôt bien.\n@c0@"
  it: "@aBianca@bCredo che il Conte stia facendo il possibile per aiutarci.\nMeglio così, no?\n@c0@"
  ja: "@a@bビアンカ「王さまも　いちおう\n\t手伝ってくれるんだね。\n\tちょっと　心強いかな？\n@c0@"
87:
  de: "@aBianca@bSollen wir dann mal runter in die Küche gehen und diese Fackel holen, %a000090?\n@c0@"
  en: "@aBianca@bShall we head on down to the kitchen and get that torch then, %a000090?\n@c0@"
  es: "@aBianca@b¿Qué tal si vamos a la cocina a por esa antorcha, %a000090?\n@c0@"
  fr: "@aBianca@bEt si on descendait dans la cuisine récupérer cette torche, hein, %a000090ⓡ\n@c0@"
  it: "@aBianca@bAllora, vogliamo andare giù in cucina a prendere quella torcia, %a000090?\n@c0@"
  ja: "@a@bビアンカ「%a000090　とりあえず\n\tたいまつを取りに\n\t台所へ　行きましょうか？\n@c0@"
88:
  de: "@aBianca@bDann ist's wohl jetzt an der Zeit. Es ist ein wenig gruselig, aber wir schaffen das schon, %a000090.\n@c0@"
  en: "@aBianca@bI s'pose it's time then. It's a bit scary, but I'm sure we can do it, %a000090.\n@c0@"
  es: "@aBianca@bSupongo que ha llegado la hora, ¿sabes? Da un poco de miedo, pero seguro que podemos hacerlo, %a000090.\n@c0@"
  fr: "@aBianca@bJe crois que c'est le moment.\nC'est un peu effrayant, mais je suis sûre\nqu'on peut y arriver, %a000090.\n@c0@"
  it: "@aBianca@bCi siamo, %a000090.\nTi confesso che ho un po' di paura, ma sono certa che ce la faremo!\n@c0@"
  ja: "@a@bビアンカ「いよいよかな…？\n\tちょっと　こわいけど\n\tがんばろうね　%a000090。\n@c0@"
89:
  de: "@aBianca@bErst hatte ich ein wenig Angst, aber als ich dann den Grafen und die Gräfin gesehen hab, war mir nicht mehr so mulmig zumute.\n@c0@"
  en: "@aBianca@bI was a bit frightened at first, but when I saw the Count and Countess, it wasn't all that scary.\n@c0@"
  es: "@aBianca@bAl principio estaba un poco asustada, pero cuando vi al Conde y la Condesa me di cuenta de que no daba tanto miedo.\n@c0@"
  fr: "@aBianca@bJ'ai eu un peu peur au début, mais après avoir\r\nvu le comte et la comtesse, ce n'était plus\r\naussi terrifiant.\n@c0@"
  it: "@aBianca@bAll'inizio ero un po' impaurita, ma quando ho visto il Conte e la Contessa mi sono tranquillizzata.\n@c0@"
  ja: "@a@bビアンカ「はじめ　こわかったけど\n\t王妃さまや王さまたちを見てからは\n\tあまり　こわくなくなったよ。\n@c0@"
90:
  de: "@aBianca@bUnd hier drin befinden sich so viele Leute, dass man fast das Gefühl hat, der Raum wär voller Leben und gar nicht so unheimlich!\n@c0@"
  en: "@aBianca@bAnd this room's so full of people that it sort of feels nice and lively, not spooky at all!\n@c0@"
  es: "@aBianca@b¡Y esta habitación está muy animada con tanta gente, no asusta para nada!\n@c0@"
  fr: "@aBianca@bEt cette pièce est tellement pleine de monde\nque ça a l'air plutôt sympathique et animé,\net pas du tout sinistreⓠ\n@c0@"
  it: "@aBianca@bE questa stanza è così piena di paura...\nProvo quasi una sensazione di allegria, non di terrore.\n@c0@"
  ja: "@a@bビアンカ「この部屋だって\n\tいっぱい　人がいて\n\tにぎやかっていう感じだし。\n@c0@"
91:
  de: "@aBianca@bAber wenn man bedenkt, dass wir hier die Einzigen sind, die tatsächlich noch leben... Hm, das ist dann doch ein bisschen gruselig!\n@c0@"
  en: "@aBianca@bStill, it is a bit weird when you think we're the only ones here who are actually alive. Hm, maybe it is a bit scary, after all!\n@c0@"
  es: "@aBianca@bClaro que resulta extraño pensar que nosotros somos los únicos que estamos vivos aquí, ¿sabes? ¡Bueno, un poco de miedo sí que da!\n@c0@"
  fr: "@aBianca@bN'empêche, ça fait un peu drôle de se dire qu'on est les seuls vivants, ici. Mmm, c'est peut-être un peu effrayant, finalement.\n@c0@"
  it: "@aBianca@bEppure, a pensarci bene, dovrei essere terrorizzata.\nDopotutto siamo gli unici vivi qui dentro!\n@c0@"
  ja: "@a@bビアンカ「でも　生きている人は\n\tわたしたちしか　いないんだよね…。\n\tやっぱり　ちょっと　こわいかな。\n@c0@"
92:
  de: "@aBianca@bWas ist denn so furchterregend an diesen Geistern aus Nadiria? Ich weiß gar nicht, was er will.\n@c0@"
  en: "@aBianca@bWhat's so scary about these spirits of Nadiria?\r\nI don't really get what he's on about.\n@c0@"
  es: "@aBianca@b¿Qué tienen de terrible esos espíritus de Nadiria?\r\nNo sé de qué habla.\n@c0@"
  fr: "@aBianca@bQu'est-ce qu'il y a de si terrible à propos de ces esprits de Nadiriaⓡ Je ne comprends pas vraiment de quoi il parle.\n@c0@"
  it: "@aBianca@bCos'è questa ⓕNadiriaⓖ?\nNon capisco...\nChe ha detto quel tizio?\n@c0@"
  ja: "@a@bビアンカ「魔界のゆうれいがいるって\n\tそんなに　こわいことなの？\n\tよく　わからないね…。\n@c0@"
93:
  de: "@aBianca@bIch frage mich, wieso es hier menschliche und nichtmenschliche Gespenster gibt.\n@c0@"
  en: "@aBianca@bI wonder why there are some human ghosts and some non-human ghosts too.\n@c0@"
  es: "@aBianca@bMe pregunto por qué hay fantasmas de humanos y de no humanos.\n@c0@"
  fr: "@aBianca@bJe me demande pourquoi il y a des fantômes humains et d'autres fantômes non-humains.\n@c0@"
  it: "@aBianca@bCome mai ci sono fantasmi dalle sembianze umane e altri che di umano non hanno proprio nulla?\n@c0@"
  ja: "@a@bビアンカ「どうして　人の形のお化けと\n\t人の形じゃないお化けが\n\tいるのかな？\n@c0@"
94:
  de: "@aBianca@bVielleicht haben sie ihre Körper irgendwie verloren, sodass sie nicht zu ihrer alten Gestalt zurückkehren können.\n@c0@"
  en: "@aBianca@bMaybe they lost their bodies somehow, so they can't go back to how they used to look.\n@c0@"
  es: "@aBianca@bA lo mejor perdieron su cuerpo y no pueden recobrar su aspecto normal.\n@c0@"
  fr: "@aBianca@bPeut-être qu'ils ont perdu leur corps, alors ils ne peuvent pas reprendre leur apparence d'origine.\n@c0@"
  it: "@aBianca@bForse i loro corpi sono così malridotti da non essere in grado di mostrare il loro aspetto originario?\nUrgh! Che pensiero disgustoso!\n@c0@"
  ja: "@a@bビアンカ「身体をなくしてしまって\n\tもとのすがたが　分からないとか…？\n@c0@"
95:
  de: "@aBianca@bWas für fiese Gesellen!\n@c0@"
  en: "@aBianca@bWhat nasty creatures!\n@c0@"
  es: "@aBianca@b¡Qué seres más repugnantes!\n@c0@"
  fr: "@aBianca@bQuelles horribles créaturesⓠ\n@c0@"
  it: "@aBianca@bChe creature orribili!\n@c0@"
  ja: "@a@bビアンカ「ひどい……！\n@c0@"
96:
  de: "@aBianca@bIch hätte nie gedacht, dass Skelette auch Hunger bekommen. Ich frage mich, was aus dem Zeug wird, das sie essen.\n@c0@"
  en: "@aBianca@bI never imagined skeletons could get hungry.\nI wonder what happens to the stuff they eat.\n@c0@"
  es: "@aBianca@bNo sabía que los esqueletos pudiesen tener hambre.\r\nMe pregunto qué pasará con lo que comen.\n@c0@"
  fr: "@aBianca@bJe n'aurais jamais imaginé que des squelettes pouvaient avoir faim. Je me demande ce que\r\ndevient la nourriture qu'ils avalent.\n@c0@"
  it: "@aBianca@bNon immaginavo che gli scheletri potessero aver fame...\nMi chiedo dove finisca la roba che mangiano...\n@c0@"
  ja: "@a@bビアンカ「ガイコツになっても\n\tおなかが　すくんだね。\n\t食べたものは　どこへ行くのかな？\n@c0@"
97:
  de: "@aBianca@bWas glaubst du denn, was Skelette gerne essen? Ach nee! Ich will's gar nicht wissen.\n@c0@"
  en: "@aBianca@bWhat d'you suppose skeletons like to eat, anyway? Nah! Maybe it's best not to know.\n@c0@"
  es: "@aBianca@b¿Tú qué crees que les gusta comer a los esqueletos? ¡Bah! Casi mejor no saberlo.\n@c0@"
  fr: "@aBianca@bQu'est-ce que les squelettes aiment manger, à ton avisⓡ Euh... en fait, non. Je préfère ne pas savoir.\n@c0@"
  it: "@aBianca@bA proposito! Quale sarà il cibo preferito dagli scheletri?\nUgh! No, dimentica la mia domanda! Preferisco non saperlo...\n@c0@"
  ja: "@a@bビアンカ「ガイコツの　ごちそうって\n\tなにかしら…？\n\t……イヤな予感がするね。\n@c0@"
98:
  de: "@aBianca@bDie können uns offenbar gar nicht sehen.\nSkelette sind wohl blind.\n@c0@"
  en: "@aBianca@bThey don't seem to be able to see us.\r\nI suppose skeletons must be blind.\n@c0@"
  es: "@aBianca@bNo parece que puedan vernos.\r\nSupongo que los esqueletos serán ciegos.\n@c0@"
  fr: "@aBianca@bOn dirait qu'ils ne peuvent pas nous voir.\r\nJe suppose que les squelettes sont aveugles.\n@c0@"
  it: "@aBianca@bNon sembra che siano in grado di vederci.\nChissà, forse gli scheletri sono ciechi...\n@c0@"
  ja: "@a@bビアンカ「わたしたちのこと\n\t見えないのかな？\n\tガイコツだから　見えないのかな。\n@c0@"
99:
  de: "@aBianca@bDas arme Ding. Sie zwingen sie wahrscheinlich schon seit Jahren dazu, so zu tanzen.\n@c0@"
  en: "@aBianca@bThat poor girl. They've probably bin makin' her dance like that for years now.\n@c0@"
  es: "@aBianca@bPobre chica. Debe de llevar años bailando así.\n@c0@"
  fr: "@aBianca@bPauvre fille. Ça doit faire des années qu'ils l'obligent à danser comme ça.\n@c0@"
  it: "@aBianca@bPovera donna...\nSaranno anni che la fanno danzare in quel modo...\n@c0@"
  ja: "@a@bビアンカ「かわいそう…。\n\tもしかして　何年も　ああやって\n\tおどらされつづけているのかな…。\n@c0@"
100:
  de: "@aBianca@bHm, %a000100, ob du wohl auch zum Teeservice gehörst?\n@c0@"
  en: "@aBianca@bI wonder if this %a000100 is part of the tea set.\n@c0@"
  es: "@aBianca@bMe pregunto si esta %a000100 formará parte del juego de té.\n@c0@"
  fr: "@aBianca@bJe me demande si cet objet fait partie du service\r\nà thé.\n@c0@"
  it: "@aBianca@bOh, che meraviglia di %a000100!\nChissà se fa parte del servizio da tè...\n@c0@"
  ja: "@a@bビアンカ「もしかして\n\tこの　%a000100も\n\tティーセットの一部なのかな？\n@c0@"
101:
  de: "@aBianca@bDas ist ja richtig schmuddelig. Der Graf und die Gräfin wären sicher ganz traurig, wenn sie das Teil so sehen würden.\n@c0@"
  en: "@aBianca@bIt's as dirty as anything, though. The Count and Countess would be really sad if they saw it in this state.\n@c0@"
  es: "@aBianca@bPero está suicísima. El Conde y la Condesa se pondrían muy tristes si la viesen así.\n@c0@"
  fr: "@aBianca@bMais il est sale comme tout. Le comte et la comtesse seraient très tristes de le voir dans cet état.\n@c0@"
  it: "@aBianca@bÈ proprio %A0100%Xsporco%Z%B0100%Xsporca%Z%C0100%X%Z!\nIl Conte e la Contessa si arrabbierebbero molto se vedessero in che stato si trova.\n@c0@"
  ja: "@a@bビアンカ「でも　すっかり\n\tきたなくなってるし…　これじゃ\n\t王さまたちも　がっかりだよね。\n@c0@"
102:
  de: "@aBianca@bEs muss schrecklich sein, wenn man schlafen will, aber nicht kann.\n@c0@"
  en: "@aBianca@bIt must be horrible wantin' to sleep but not bein' able to.\n@c0@"
  es: "@aBianca@bDebe de ser horrible querer dormir y no poder hacerlo.\n@c0@"
  fr: "@aBianca@bÇa doit être horrible d'avoir envie de dormir, mais de ne pas pouvoir.\n@c0@"
  it: "@aBianca@bDev'essere terribile aver voglia di riposare e non poterlo fare...\n@c0@"
  ja: "@a@bビアンカ「眠りたいのに\n\t眠れないって　本当に\n\tつらいことだよね。\n@c0@"
103:
  de: "@aBianca@bEhrlich gesagt würde ich gerne mit diesen Gespenstern aufräumen und dann selber ins Bett gehen. Also, legen wir los!\n@c0@"
  en: "@aBianca@bI want to sort these ghosts out and then get off to bed myself, to be honest. Best get crackin'!\n@c0@"
  es: "@aBianca@bYo misma lo que quiero es encargarme de una vez de esos fantasmas e irme a la cama. ¡Manos a la obra!\n@c0@"
  fr: "@aBianca@bHonnêtement, j'ai envie d'en finir avec ces fantômes pour aller me coucher, moi aussi. On ferait bien de\nse dépêcherⓠ\n@c0@"
  it: "@aBianca@bA dire il vero, anch'io vorrei farmi un bel sonnellino.\nForza! Sbarazziamoci di questi fantasmi e andiamocene a dormire!\n@c0@"
  ja: "@a@bビアンカ「わたしも　早く　お化けを\n\t退治して　寝たいもん。\n\t…でも今は　がんばらなくちゃ！\n@c0@"
104:
  de: "@aBianca@bDie Tür ist offen! Aber dieser warme Luftzug eben hat mir gar nicht gefallen.\n@c0@"
  en: "@aBianca@bThe door's open! I didn't much like the feel of that warm breeze just then, mind.\n@c0@"
  es: "@aBianca@b¡La puerta está abierta! La verdad es que no me gustaba mucho esa brisa cálida, ¿me entiendes?\n@c0@"
  fr: "@aBianca@bLa porte est ouverteⓠ Mais je n'ai pas beaucoup\naimé la sensation de cette brise tiède, tout à l'heure.\n@c0@"
  it: "@aBianca@bLa porta è aperta!\nPerò quel vento caldo non mi è piaciuto affatto...\n@c0@"
  ja: "@a@bビアンカ「ドアが　開いたね！\n\tでも　わたし　なまあたたかい風って\n\tなんだか　苦手…。\n@c0@"
105:
  de: "@aBianca@bIrgendwie ist das schon ziemlich seltsam. Mir gefällt der Gedanke gar nicht, bei einem toten Geist zu übernachten!\n@c0@"
  en: "@aBianca@bThere's somethin' too weird about this. I dun't like the idea of stayin' the night with a dead spirit!\n@c0@"
  es: "@aBianca@bTodo esto es muy, pero que muy extraño. ¡No me apetece nada pasar la noche con el espíritu de un muerto!\n@c0@"
  fr: "@aBianca@bIl y a quelque chose de vraiment trop bizarre.\nJe n'aime pas tellement l'idée de passer la nuit\navec un espritⓠ\n@c0@"
  it: "@aBianca@bMa tu guarda che razza di situazione!\nL'idea di passare la notte in compagnia di uno spettro non mi piace affatto!\n@c0@"
  ja: "@a@bビアンカ「ぜったい　あやしいよ！\n\tひとだまに　とめてもらうなんて\n\tなにか　されそう…。\n@c0@"
106:
  de: "@aBianca@bIch hab gehört, dass es hier auch einen Schatz geben soll. Aber das war wohl bloß ein Gerücht. Na ja.\n@c0@"
  en: "@aBianca@bI heard somethin' about there bein' treasure here too. Looks like it was just a rumour. Oh well.\n@c0@"
  es: "@aBianca@bDicen que por aquí también hay tesoros. Pero parece que no es más que un rumor. Vaya.\n@c0@"
  fr: "@aBianca@bMoi aussi, j'ai entendu des rumeurs qui disaient qu'un trésor était caché ici. Apparemment,\r\nce n'étaient que des racontars. Tant pis.\n@c0@"
  it: "@aBianca@bAnch'io avevo sentito dire che qui c'era un tesoro.\nEvidentemente, era solo una voce infondata...\n@c0@"
  ja: "@a@bビアンカ「そういえば　宝があるっていう\n\tウワサを　聞いたことがあるけど…。\n\tウソだったんだね。　がっかり。\n@c0@"
107:
  de: "@aBianca@bMeine Güte! Was für ein Gestank! Komm, %a000090. Nichts wie raus hier!\n@c0@"
  en: "@aBianca@bCrikey! What a smell! Come on, %a000090. \nLet's get out of here!\n@c0@"
  es: "@aBianca@b¡Rayos! ¡Qué peste! ¡Vamos, %a000090! \n¡Salgamos de aquí!\n@c0@"
  fr: "@aBianca@bOuh là làⓠ Quelle odeurⓠ Viens %a000090.\nSortons d'iciⓠ\n@c0@"
  it: "@aBianca@bCaspita, che puzza!\nAndiamocene da qui, %a000090!\n@c0@"
  ja: "@a@bビアンカ「まあっ！\n\tホントに　すごいニオイ！\n\t%a000090　早く　はなれましょうよ。\n@c0@"
108:
  de: "@aBianca@bDie spezielle Zutat tut mir ja ein wenig leid, wenn sie in dieser stinkenden Soße landet!\n@c0@"
  en: "@aBianca@bI feel a bit sorry for the special ingredient, havin' to be smothered in that stinky sauce!\n@c0@"
  es: "@aBianca@b¡Me da un poco de pena el ingrediente especial, mira que acabar en esa salsa asquerosa!\n@c0@"
  fr: "@aBianca@bDommage que ces ingrédients spéciaux doivent être noyés dans cette sauce puanteⓠ\n@c0@"
  it: "@aBianca@bScommetto che l'ingrediente speciale non sarà affatto felice di andare a finire in quella salsa puzzolente!\n@c0@"
  ja: "@a@bビアンカ「あんなに　くさいソースを\n\tかけられるなんて　とっておきの\n\t食材も　かわいそうよね。\n@c0@"
109:
  de: "@aBianca@bJetzt können wir uns im Dunkeln zurechtfinden. Danke, Graf Krypto!\n@c0@"
  en: "@aBianca@bNow we'll be able to find our way in the dark. Thanks, Count Uptaten!\n@c0@"
  es: "@aBianca@bAhora podremos ver por dónde vamos en la oscuridad, ¿sabes? ¡Gracias, conde Alverres!\n@c0@"
  fr: "@aBianca@bÀ présent, on va pouvoir trouver notre chemin dans le noir. Merci, Comte Karpattⓠ\n@c0@"
  it: "@aBianca@bOra non avremo più problemi con il buio.\nGrazie, Conte De' Functis!\n@c0@"
  ja: "@a@bビアンカ「これで　暗い部屋も\n\t明るくなるよ。\n\tありがとう　王さまっ！\n@c0@"
110:
  de: "@aBianca@bPass auf, dass du dich nicht verbrennst, %a000090.\n@c0@"
  en: "@aBianca@bMake sure you dun't burn yourself, %a000090.\n@c0@"
  es: "@aBianca@bTen cuidado, no te quemes, %a000090.\n@c0@"
  fr: "@aBianca@bAttention à ne pas te brûler, %a000090.\n@c0@"
  it: "@aBianca@bStai attento a non bruciarti, %a000090.\n@c0@"
  ja: "@a@bビアンカ「%a000090　ヤケドしないように\n\t気をつけましょうね。\n@c0@"
111:
  de: "@aBianca@bEs ist jetzt tausendmal einfacher, hier rumzulaufen. Autsch! Das ist heiß! Pass auf, %a000090!\n@c0@"
  en: "@aBianca@bIt's a million times easier to walk about the place now. Ouch! That's hot! Have a care, %a000090!\n@c0@"
  es: "@aBianca@bAhora es muchísimo más fácil andar por este sitio. ¡Ay! ¡Quema! ¡Ten cuidado, %a000090!\n@c0@"
  fr: "@aBianca@bC'est mille fois plus facile de se déplacer dans cet endroit, maintenant. Ouilleⓠ C'est chaudⓠ\nAttention, %a000090ⓠ\n@c0@"
  it: "@aBianca@bAdesso avanzare in questo posto è molto più facile...\nAhi! Scotta!\nAttento con quella fiamma, %a000090!\n@c0@"
  ja: "@a@bビアンカ「これで　ずいぶん\n\t歩きやすくなったわ。\n\tあちちっ！　%a000090気をつけてよ！\n@c0@"
112:
  de: "@aBianca@bUff! Das war knapp. Aber jetzt riech ich nach dieser stinkenden Soße! Igitt!\n@c0@"
  en: "@aBianca@bPhew! That was a close one. That smelly sauce has made me stink, mind you!\n@c0@"
  es: "@aBianca@b¡Uff! Por qué poco. Por culpa de esa salsa, ahora apesto, ¿sabes?\n@c0@"
  fr: "@aBianca@bPfiouⓠ On a eu chaud. Mais je suis imprégnée de l'odeur de cette sauce puanteⓠ\n@c0@"
  it: "@aBianca@bFiuuu! C'è mancato poco!\nPerò quella salsa nauseabonda mi ha fatto venire il voltastomaco!\n@c0@"
  ja: "@a@bビアンカ「なんとか　やっつけたけど…\n\tわたしたちの体　味つけの\n\tソースのせいで　すごいニオイ…。\n@c0@"
113:
  de: "@aBianca@bMit dem Loch habe ich allerdings nicht gerechnet. Du?\n@c0@"
  en: "@aBianca@bI didn't expect that hole to be there, did you?\n@c0@"
  es: "@aBianca@bNo esperaba encontrarme con ese agujero ahí, ¿y tú?\n@c0@"
  fr: "@aBianca@bJe ne m'attendais pas à ce qu'il y ait un trou\nà cet endroit, et toiⓡ\n@c0@"
  it: "@aBianca@bNon mi aspettavo che ci fosse quel buco...\n@c0@"
  ja: "@a@bビアンカ「それにしても\n\tまさか　あそこで　落とし穴なんて\n\tビックリしちゃったよ。\n@c0@"
114:
  de: "@aBianca@bAnscheinend haben wir den Koch beruhigen können.\n@c0@"
  en: "@aBianca@bLooks like we put that cook's mind at ease, anyway.\n@c0@"
  es: "@aBianca@bBueno, al menos el cocinero estará tranquilo.\n@c0@"
  fr: "@aBianca@bAu moins, ce cuisinier doit avoir l'esprit tranquille, maintenant.\n@c0@"
  it: "@aBianca@bPare che il cuoco non sia più un problema...\nMeglio così.\n@c0@"
  ja: "@a@bビアンカ「あのコックさんは\n\t助けてあげられたみたいだね。\n@c0@"
115:
  de: "@aBianca@bJetzt müssen wir uns nur noch um den Boss kümmern. Na los, %a000090!\n@c0@"
  en: "@aBianca@bNow we just have to sort out the boss man.\nCome on, %a000090!\n@c0@"
  es: "@aBianca@bAhora solo nos queda encargarnos del jefe.\n¡Vamos, %a000090!\n@c0@"
  fr: "@aBianca@bIl ne nous reste plus qu'à régler son compte à leur chef. Viens, %a000090ⓠ\n@c0@"
  it: "@aBianca@bOra non ci resta che sbarazzarci del capo.\nForza, %a000090!\n@c0@"
  ja: "@a@bビアンカ「あとは　あいつを\n\tとっちめてやらなくっちゃ！\n\tさあ　行こっ　%a000090。\n@c0@"
116:
  de: "@aBianca@bDas ist wirklich eine hübsche Kugel.\nSieht aus wie ein großes Schmuckstück oder so!\n@c0@"
  en: "@aBianca@bThat really is a pretty ball.\r\nIt's like a huge jewel or somethin'!\n@c0@"
  es: "@aBianca@bEsa bola es realmente bonita.\r\n¡Parece una especie de joya inmensa!\n@c0@"
  fr: "@aBianca@bC'est vraiment une jolie boule. On dirait un bijou géant, ou quelque chose comme çaⓠ\n@c0@"
  it: "@aBianca@bOh, che bella sfera!\nHai visto quant'è grande?\nE sembra anche molto preziosa!\n@c0@"
  ja: "@a@bビアンカ「それにしても　\n\t本当に　きれいな玉だね。\n\t宝石みたい！\n@c0@"
117:
  de: "@aBianca@bIch frage mich, ob die Gespenster hergekommen sind und die Bude auf den Kopf gestellt haben, um sie zu finden.\n@c0@"
  en: "@aBianca@bI wonder if the ghosts came here and ransacked the place because they were tryin' to find it.\n@c0@"
  es: "@aBianca@bMe pregunto si los fantasmas vinieron a saquear este sitio porque la estaban buscando.\n@c0@"
  fr: "@aBianca@bJe me demande si c'est pour trouver ça que les fantômes sont venus ici et ont tout mis à sac.\n@c0@"
  it: "@aBianca@bForse i fantasmi erano venuti qui proprio per cercare quest'affare, eh?\n@c0@"
  ja: "@a@bビアンカ「お化けたちが　\n\tこのお城を　あらしてたのって\n\tこれを　探していたからなのかな？\n@c0@"
118:
  de: "@aBianca@bDas ist ja komisch! Unsere Kleider sind wieder ganz sauber!\n@c0@"
  en: "@aBianca@bThat's weird! Our clothes are all nice and clean again!\n@c0@"
  es: "@aBianca@b¡Qué raro! ¡Nuestra ropa vuelve a estar limpia!\n@c0@"
  fr: "@aBianca@bC'est bizarreⓠ Nos vêtements sont de nouveau\ntout propres et tout fraisⓠ\n@c0@"
  it: "@aBianca@bChe strano...\nI nostri vestiti sono di nuovo puliti!\n@c0@"
  ja: "@a@bビアンカ「……あれ？\n\tわたしたちの服が\n\tきれいになってるよ。\n@c0@"
119:
  de: "@aBianca@bDer Graf und die Gräfin müssen die fiesen Soßeflecken irgendwie entfernt haben. Das ist ja praktisch!\n@c0@"
  en: "@aBianca@bThe Count and Countess must've got rid of the nasty sauce stains for us somehow.\r\nThat's handy!\n@c0@"
  es: "@aBianca@bEl Conde y la Condesa deben haber eliminado las manchas de esa salsa repugnante de alguna forma, ¿sabes? ¡Qué práctico!\n@c0@"
  fr: "@aBianca@bLe comte et la comtesse ont dû enlever ces vilaines taches de sauce pour nous. C'est pratiqueⓠ\n@c0@"
  it: "@aBianca@bLe macchie di salsa sono sparite!\nForse sono stati il Conte e la Contessa?\nChissà che detersivo hanno usato... Ih Ih Ih!\n@c0@"
  ja: "@a@bビアンカ「王さまたちが　ソースの汚れを\n\t取ってくれたのかな？\n\tえへへ　助かっちゃったね。\n@c0@"
120:
  de: "@aBianca@bMir gefällt das nicht. Es ist so finster und unheimlich. Bestimmt treiben sich hier Gespenster rum.\n@c0@"
  en: "@aBianca@bI dun't like it here. It's dark and creepy. I reckon there are ghosts about.\n@c0@"
  es: "@aBianca@bEste sitio no me gusta. Es oscuro y repulsivo. Seguro que hay fantasmas.\n@c0@"
  fr: "@aBianca@bJe n'aime pas cet endroit. Il est sombre et donne\r\nla chair de poule. Je parie qu'il y a des fantômes partout.\n@c0@"
  it: "@aBianca@bQuesto posto non mi piace...\r\nÈ buio, e c'è un'atmosfera sinistra.\nHo paura che ci siano fantasmi nei paraggi...\n@c0@"
  ja: "@a@bビアンカ「なんだか　くらいし\n\t不気味な感じ…。\n\t今にも　お化けが　出てきそう…。\n@c0@"
121:
  de: "@aBianca@bAber für diese arme Katze müssen wir da durch. Komm schon, %a000090. Gehen wir weiter.\n@c0@"
  en: "@aBianca@bBut we have to stick it out for the sake of that poor cat. Come on, %a000090. Let's keep goin'.\n@c0@"
  es: "@aBianca@bPero tenemos que pasar el trago, por ese pobre gato. ¡Vamos, %a000090! Sigamos.\n@c0@"
  fr: "@aBianca@bMais on doit tenir bon pour sauver ce pauvre chat.\nViens, %a000090. On continue.\n@c0@"
  it: "@aBianca@bNon importa: dobbiamo andare avanti, se vogliamo salvare quel povero gattino.\nCoraggio, %a000090, proseguiamo...\n@c0@"
  ja: "@a@bビアンカ「でも　ネコさんのために\n\tがんばらなくっちゃ！\n\tさあ　%a000090　行こうよ。\n@c0@"
122:
  de: "@aBianca@bDie unheimliche Aura, die dieser Ort ausgestrahlt hat, ist plötzlich verschwunden, jetzt, wo die Gespenster besiegt sind.\n@c0@"
  en: "@aBianca@bThe creepy feelin' about this place has suddenly gone now the ghosts are defeated.\n@c0@"
  es: "@aBianca@bAhora que hemos derrotado a los fantasmas, ya no me dan los escalofríos que me daban en este sitio, ¿sabes?\n@c0@"
  fr: "@aBianca@bL'atmosphère sinistre de cet endroit s'est dissipée, maintenant que les fantômes ont été vaincus.\n@c0@"
  it: "@aBianca@bOra che abbiamo sconfitto i fantasmi, questo posto non mi fa più paura.\n@c0@"
  ja: "@a@bビアンカ「お化けを退治したら\n\tこのお城　すっかり　\n\tおどろおどろしさが　消えたね。\n@c0@"
123:
  de: "@aBianca@bEs ist, als hätte sich hier alles verändert, sogar die Luft!\n@c0@"
  en: "@aBianca@bIt's like everythin' about the place has changed, even the air!\n@c0@"
  es: "@aBianca@b¡Es como si todo hubiese cambiado, hasta el aire!\n@c0@"
  fr: "@aBianca@bC'est comme si tout avait changé ici, même l'airⓠ\n@c0@"
  it: "@aBianca@bÈ come se tutto fosse cambiato.\nL'atmosfera è molto meno oppressiva!\n@c0@"
  ja: "@a@bビアンカ「まるで　空気まで\n\t全部　入れかわっちゃったみたい。\n@c0@"
124:
  de: "@aBianca@bBald bricht der Morgen an, schätz' ich.\nWir sollten nach Wittenhausen zurückkehren.\n@c0@"
  en: "@aBianca@bLooks like it'll be mornin' soon.\r\nWe'd best get back to Roundbeck.\n@c0@"
  es: "@aBianca@bParece que pronto se hará de día.\r\nSerá mejor que volvamos a Golfo Blanco.\n@c0@"
  fr: "@aBianca@bOn dirait que le jour va bientôt se lever. On ferait bien de rentrer à Blanchecombe.\n@c0@"
  it: "@aBianca@bPresto farà giorno.\nChe ne diresti di tornare a Blankenburg, eh?\n@c0@"
  ja: "@a@bビアンカ「そろそろ　夜が明けるみたい。\n\t早く　アルカパに　帰りましょう。\n@c0@"
125:
  de: "@aBianca@bHier kommen wir jetzt anscheinend nicht raus. A-Aber wenn wir einfach geradeaus gehen, wird uns schon nichts passieren!\n@c0@"
  en: "@aBianca@bWe can't seem to get out of here now. B-But I'm sure we'll be okay if we keep goin' forwards!\n@c0@"
  es: "@aBianca@bParece que no podemos salir de aquí. ¡P-pero estoy segura de que todo irá bien si continuamos todo recto!\n@c0@"
  fr: "@aBianca@bOn dirait qu'on ne peut plus sortir d'ici, maintenant. Mais je suis sûre que tout ira bien si on continue\r\nà avancer.\n@c0@"
  it: "@aBianca@bAccidenti, ora non possiamo uscire di qui.\nProviamo ad andare avanti, dai...\n@c0@"
  ja: "@a@bビアンカ「ここからは\n\t出られなくなっちゃったわね……。\n\tで…でも　とにかく進めば　大丈夫よ！\n@c0@"
126:
  de: "@aBianca@bIch dachte, dass es zu finster wär, um sich zurechtzufinden, aber jetzt wird das schon klappen. Auf geht's, %a000090.\n@c0@"
  en: "@aBianca@bI thought it'd be too dark to get anywhere, but we should be fine now. On we go, %a000090.\n@c0@"
  es: "@aBianca@bPensaba que estaría demasiado oscuro para poder avanzar, pero creo que ahora todo irá bien. ¡Adelante, %a000090!\n@c0@"
  fr: "@aBianca@bJe pensais qu'il ferait trop noir pour aller où que\nce soit, mais ça devrait aller, maintenant.\nAvançons, %a000090.\n@c0@"
  it: "@aBianca@bTemevo che avremmo dovuto muoverci nella più totale oscurità, ma pare che mi sia preoccupata per nulla. Andiamo avanti, %a000090.\n@c0@"
  ja: "@a@bビアンカ「もっと　まっ暗かと思ってたけど\n\tこれなら　問題なく進めそうね。\n\tさあ　行きましょ　%a000090。\n@c0@"
127:
  de: "@aBianca@bIch frage mich, wieso diese Gespenster überhaupt gekommen sind und sich hier niedergelassen haben.\n@c0@"
  en: "@aBianca@bI wonder what made the ghosts come and live here in the first place.\n@c0@"
  es: "@aBianca@bMe pregunto por qué vendrían a vivir aquí los fantasmas.\n@c0@"
  fr: "@aBianca@bJe me demande pourquoi les fantômes sont venus s'installer ici, au départ.\n@c0@"
  it: "@aBianca@bChissà come mai i fantasmi hanno deciso di stabilirsi qui...\n@c0@"
  ja: "@a@bビアンカ「それにしても　どうして\n\tお化けは　このお城に\n\t住みついちゃったのかしら？\n@c0@"
128:
  de: "@aBianca@bWas gibt's in diesem Schloss wohl, das sie angelockt hat?\n@c0@"
  en: "@aBianca@bWhat is it about this castle that attracted them, d'you suppose?\n@c0@"
  es: "@aBianca@b¿Qué tendrá este castillo para atraerlos?\n@c0@"
  fr: "@aBianca@bD'après toi, qu'est-ce qui les a attirés dans\nce châteauⓡ\n@c0@"
  it: "@aBianca@bCosa li ha attirati in questo castello, secondo te?\n@c0@"
  ja: "@a@bビアンカ「このお城には\n\t何かあるのかな？\n@c0@"
129:
  de: "@aBianca@bJetzt können alle in Frieden schlummern. Ist schon ein prima Gefühl, so eine gute Tat.\n@c0@"
  en: "@aBianca@bNow everyone's bin able to get off to sleep nice and peacefully. It's great to have done a good deed like that.\n@c0@"
  es: "@aBianca@bAhora todo el mundo puede descansar en paz. Se siente una bien después de una buena obra como esta, ¿sabes?\n@c0@"
  fr: "@aBianca@bDu coup, tout le monde a pu s'endormir paisiblement. C'est super d'avoir accompli une bonne action comme celle-là.\n@c0@"
  it: "@aBianca@bOra tutti possono riposare in pace.\nSono proprio felice di aver compiuto una buona azione!\n@c0@"
  ja: "@a@bビアンカ「みんな　安心して\n\tねむったんだね。\n\tいいことをした後は　気持ちいいっ。\n@c0@"
130:
  de: "@aBianca@bDieser Saal ist ja riesig. Schau dir mal an, wie hoch die Decke ist!\n@c0@"
  en: "@aBianca@bThis room's enormous. Just look at the height of the ceilin'!\n@c0@"
  es: "@aBianca@bEste lugar es inmenso. ¡Mira qué alto es el techo!\n@c0@"
  fr: "@aBianca@bCette pièce est immense. Regarde un peu la hauteur du plafondⓠ\n@c0@"
  it: "@aBianca@bQuesta stanza è enorme...!\nGuarda quant'è alto il soffitto!\n@c0@"
  ja: "@a@bビアンカ「広いお部屋…\n\tてんじょうも　すごく高いわね。\n@c0@"
131:
  de: "@aBianca@bIch wette, hier gab es früher mal tolle Bälle und Feste.\n@c0@"
  en: "@aBianca@bI'll bet they had some amazin' balls and parties here in the past.\n@c0@"
  es: "@aBianca@bSeguro que antes se organizaban unos bailes geniales aquí, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe parie qu'il devait y avoir des bals et des fêtes fantastiques ici, autrefois.\n@c0@"
  it: "@aBianca@bScommetto che in passato qui dentro organizzavano delle feste bellissime!\nChissà quanta roba da mangiare c'era, eh?\n@c0@"
  ja: "@a@bビアンカ「昔なら　ここで\n\t華やかな舞踏会が\n\tひらかれたんでしょうけど……。\n@c0@"
132:
  de: "@aBianca@bDu sagst ja gar nichts, %a000090.\nWünscht du dir etwa, dass du nicht gekommen wärst?\n@c0@"
  en: "@aBianca@bYou've bin a bit quiet, %a000090.\nAre you wishin' you hadn't come?\n@c0@"
  es: "@aBianca@bEstás un poco callado, %a000090.\n¿Preferirías no haber venido?\n@c0@"
  fr: "@aBianca@bTu es bien silencieux, %a000090.\nEst-ce que tu regrettes d'être venuⓡ\n@c0@"
  it: "@aBianca@bÈ da un po' che sei silenzioso, %a000090.\nTi sei pentito di essere venuto?\n@c0@"
  ja: "@a@bビアンカ「ねえ　%a000090。\n\tさっきから　だまってるけど\n\tもしかして来るのイヤだった？\n@c0@"
133:
  de: "@aBianca@bIch weiß, wie du dich fühlst. Aber mach dir keine Sorgen. Ich lass nicht zu, dass dir was passiert. Versprochen!\n@c0@"
  en: "@aBianca@bI know how you feel. But try not to worry. I won't let anythin' bad happen, I promise.\n@c0@"
  es: "@aBianca@bSé cómo te sientes. Pero no te preocupes. No dejaré que te pase nada malo, te lo prometo.\n@c0@"
  fr: "@aBianca@bJe sais ce que tu ressens. Mais essaie de ne pas t'inquiéter. Je te promets qu'il ne se passera rien\r\nde grave.\n@c0@"
  it: "@aBianca@bAh, puoi stare tranquillo: ci penso io a proteggerti!\nTe lo prometto!\nIh ih ih!\n@c0@"
  ja: "@a@bビアンカ「そう…　でも　大丈夫よ。\n\tわたしが　ついてるんだからっ！\n@c0@"
134:
  de: "@aBianca@bDu bist wahrscheinlich ein bisschen nervös, was? Aber mach dir keine Sorgen. Uns passiert schon nichts. Na los!\n@c0@"
  en: "@aBianca@bYou're probably a bit nervous, eh? But try not to worry. We'll be fine. Come on!\n@c0@"
  es: "@aBianca@bSeguro que estás un poco nervioso, ¿eh? Pero no te preocupes. No te pasará nada, ¿sabes? ¡Vamos!\n@c0@"
  fr: "@aBianca@bTu dois être un peu nerveux, c'est çaⓡ Mais essaie de ne pas t'inquiéter. Tout se passera bien. Viensⓠ\n@c0@"
  it: "@aBianca@bSei un po' nervoso, non è vero?\nNon temere, andrà tutto bene.\nCoraggio!\n@c0@"
  ja: "@a@bビアンカ「なんだ…　%a000090ったら\n\tきんちょう　してたのね。\n\t大丈夫よ。　さあ　行きましょ！\n@c0@"
135:
  de: "@aBianca@bHier ist es so finster! Pass auf, dass du nicht gegen die Wand läufst, ja, %a000090?\n@c0@"
  en: "@aBianca@bIt's so dark in here! Make sure you dun't bang into the walls, eh, %a000090?\n@c0@"
  es: "@aBianca@b¡Qué oscuro está esto! Cuidado no te des contra las paredes, ¿vale, %a000090?\n@c0@"
  fr: "@aBianca@bIl fait si noir, là-dedansⓠ Attention de ne pas te cogner dans les murs, hein, %a000090ⓡ\n@c0@"
  it: "@aBianca@bCom'è buio qui dentro! Cerca di non sbattere contro i muri, %a000090! Non vorrai mica rovinarti quel bel faccino che hai, vero? Eh eh eh!\n@c0@"
  ja: "@a@bビアンカ「本当に　まっ暗。\n\tカベに　鼻をぶつけないように\n\t気をつけてね　%a000090。\n@c0@"
136:
  de: "@aBianca@bIch glaube, da verbirgt sich etwas, %a000090. Aber ich glaube nicht, dass es uns wehtun würde. Wir können es bestimmt einfach ignorieren, oder?\n@c0@"
  en: "@aBianca@bI think there's somethin' there, %a000090. But I doubt it'll hurt us. We can probably just ignore it, right?\n@c0@"
  es: "@aBianca@bCreo que hay algo ahí, %a000090. Pero no creo que nos haga nada. Yo creo que podemos pasar del tema y ya está, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe crois qu'il y a quelque chose par ici, %a000090. Mais ça m'étonnerait que ça nous fasse du mal.\n㈡\nOn n'a qu'à faire comme si on n'avait\nrien vu, d'accordⓡ\n@c0@"
  it: "@aBianca@bCredo che lì ci sia qualcosa, %a000090, ma non penso che ci possa fare del male.\nCerchiamo di far finta di niente, d'accordo?\n@c0@"
  ja: "@a@bビアンカ「%a000090　何かいるみたいよ。\n\tでも　何かしてくるわけじゃないし…\n\tとりあえず　ムシしていいのかな？\n@c0@"
137:
  de: "@aBianca@bJetzt ist es endlich so weit! Die Gespensterjagd kann losgehen! Na, bist du bereit?\n@c0@"
  en: "@aBianca@bIt's finally time for our ghost-bustin', eh?\nAre you ready for this?\n@c0@"
  es: "@aBianca@b¡Por fin ha llegado la hora de cazar fantasmas!\r\n¿Estás listo?\n@c0@"
  fr: "@aBianca@bL'heure de la chasse aux fantômes a enfin sonné,\non dirait. Tu es prêtⓡ\n@c0@"
  it: "@aBianca@bFinalmente è arrivato il momento di dare una lezione a qui brutti fantasmi!\nAllora, sei pronto?\n@c0@"
  ja: "@a@bビアンカ「いよいよ　\n\tお化け退治の本番って感じだね。\n\t%a000090　やり忘れたことはない？\n@c0@"
138:
  de: "@aBianca@bDann gehen wir! Wir schaffen das schon!\n@c0@"
  en: "@aBianca@bThen let's go! We can do this!\n@c0@"
  es: "@aBianca@b¡Entonces, en marcha! ¡Podemos hacerlo!\n@c0@"
  fr: "@aBianca@bAlors allons-yⓠ On peut y arriverⓠ\n@c0@"
  it: "@aBianca@bAndiamo!\nVedrai, ce la faremo!\n@c0@"
  ja: "@a@bビアンカ「それじゃ　行きましょ。\n\tたよりに　してるからねっ！\n@c0@"
139:
  de: "@aBianca@bWieso denn nicht? Musst du erst noch aufs Klo oder wie?\n@c0@"
  en: "@aBianca@bWhy en't you ready? D'you need to go to the toilet or somethin'!?\n@c0@"
  es: "@aBianca@b¿Por qué no estás listo? ¡¿Es que tienes que ir al baño o algo así?!\n@c0@"
  fr: "@aBianca@bPourquoi tu n'es pas prêtⓡ Tu as besoin d'aller aux toilettes ou quelque chose comme çaⓡ\n@c0@"
  it: "@aBianca@bPerché non sei pronto?\nNon dirmi che devi andare in bagno proprio adesso, eh?!\n@c0@"
  ja: "@a@bビアンカ「何を　忘れてるの？\n\tひょっとして　おトイレ！？\n@c0@"
140:
  de: "@aBianca@bAlso ehrlich! Geh einfach da rüber und beeil dich ein bisschen!\n@c0@"
  en: "@aBianca@bHonestly! Just go over there and hurry up\r\nwith it!\n@c0@"
  es: "@aBianca@b¡Hay que ver! ¡Venga, ve, date prisa!\n@c0@"
  fr: "@aBianca@bFranchementⓠ Vas-y et dépêche-toi, alorsⓠ\n@c0@"
  it: "@aBianca@bAh, sei proprio un bambino!\nVai, e cerca di sbrigarti...\n@c0@"
  ja: "@a@bビアンカ「もうっ！\n\tそこら辺の　ものカゲでいいから\n\t早く　すませちゃってよ。\n@c0@"
141:
  de: "@aBianca@bSchnappen wir uns den Boss! Er wird für all das büßen müssen!\n@c0@"
  en: "@aBianca@bLet's go get the boss man! He'll pay for all this!\n@c0@"
  es: "@aBianca@b¡Vamos a por el jefe! ¡Pagará por todo esto!\n@c0@"
  fr: "@aBianca@bAllons retrouver leur chefⓠ\nIl va payer pour tout çaⓠ\n@c0@"
  it: "@aBianca@bE ora tocca al capo!\nGliele daremo di santa ragione!\n@c0@"
  ja: "@a@bビアンカ「さあ　あいつをやっつけましょ！\n\tもう　ゆるさないんだから！\n@c0@"
142:
  de: "@aBianca@bDas waren seltsame Gespenster, was? Ich frage mich, ob es Geister aus Nadiria waren.\n@c0@"
  en: "@aBianca@bThose were weird ghosts, eh? I wonder if they were the spirits of Nadiria.\n@c0@"
  es: "@aBianca@bQué fantasmas tan raros, ¿eh? A lo mejor eran los espíritus de Nadiria.\n@c0@"
  fr: "@aBianca@bIls étaient bizarres, ces fantômes, nonⓡ Je me demande si c'était des esprits de Nadiria.\n@c0@"
  it: "@aBianca@bChe strani quei fantasmi, eh?\nChissà se si trattava degli spiriti di Nadiria...\n@c0@"
  ja: "@a@bビアンカ「へんなお化けが　消えたわね。\n\tあれが　魔界のゆうれい\n\tだったのかしら……。\n@c0@"
143:
  de: "@aBianca@bDieses Schloss ist ja riesig! Ich weiß echt nicht, wie sich hier irgendjemand zurechtfinden soll.\n@c0@"
  en: "@aBianca@bThis castle's enormous! I dun't know how anyone could find their way around.\n@c0@"
  es: "@aBianca@b¡Este castillo es enorme! No sé cómo hacía la gente para no perderse, ¿sabes?\n@c0@"
  fr: "@aBianca@bCe château est gigantesqueⓠ Je me demande\ncomment on fait pour s'y retrouver.\n@c0@"
  it: "@aBianca@bQuesto castello è enorme!\nSecondo me nemmeno i suoi abitanti riuscivano a girarlo tutto senza perdersi...\n@c0@"
  ja: "@a@bビアンカ「それにしても\n\tお城の中って広くて　大変！\n@c0@"
144:
  de: "@aBianca@bIch weiß nicht so recht, was der Unterschied sein soll zwischen Gespenstern und Monstern und Geistern. Ist für mich alles das Gleiche.\n@c0@"
  en: "@aBianca@bI can't really tell the difference between ghosts and monsters and spirits. They're all the same\r\nto me.\n@c0@"
  es: "@aBianca@bNo sé bien cuál es la diferencia entre fantasmas, monstruos y espíritus. Para mí son todos iguales, ¿me entiendes?\n@c0@"
  fr: "@aBianca@bJe n'arrive pas vraiment à faire la différence entre les fantômes, les monstres et les esprits. Je trouve qu'ils se ressemblent tous.\n@c0@"
  it: "@aBianca@bMa qual è la differenza tra fantasmi, mostri e spiriti, eh?\nA me sembrano tutti uguali!\n@c0@"
  ja: "@a@bビアンカ「魔物も　ゆうれいも\n\t悪いお化けも似たようなものよね。\n\tそう考えると　こわくないでしょ？\n@c0@"
145:
  de: "@aBianca@bDas muss die Küche sein. Los, suchen wir diese Fackel.\n@c0@"
  en: "@aBianca@bThis must be the kitchen. Let's find that torch.\n@c0@"
  es: "@aBianca@bEsta debe de ser la cocina. Vamos a buscar esa antorcha.\n@c0@"
  fr: "@aBianca@bÇa doit être la cuisine. Allons chercher cette torche.\n@c0@"
  it: "@aBianca@bQuesta dev'essere la cucina.\nDai, cerchiamo la torcia...\n@c0@"
  ja: "@a@bビアンカ「ここが　台所ね。\n\tさあ　たいまつを　さがしましょ。\n@c0@"
146:
  de: "@aBianca@bGehen wir. Du fragst dich wahrscheinlich, was mit dem Essen ist, aber wir müssen uns zuallererst dieses Gespenst schnappen.\n@c0@"
  en: "@aBianca@bLet's go. I know you're probably wonderin' about the food, but we need to get that ghost before we do anythin'.\n@c0@"
  es: "@aBianca@bVamos. Ya sé que debes de estar pensando en comida, pero antes que nada tenemos que ir a por ese fantasma, ¿sabes?\n@c0@"
  fr: "@aBianca@bAllons-y. Je sais que tu te poses des questions sur la nourriture, mais il faut retrouver ce fantôme avant toute autre chose.\n@c0@"
  it: "@aBianca@bAndiamo.\nDobbiamo beccare quel fantasma!\n@c0@"
  ja: "@a@bビアンカ「さあ　行きましょ。\n\tお料理が気になるかも知れないけど\n\tお化け退治をすませるのが　先よ。\n@c0@"
147:
  de: "@aBianca@bIch glaub, ich hab noch nie so viel Staub gesehen. Ich frage mich, wie lang es wohl her ist, seit hier jemand geputzt hat.\n@c0@"
  en: "@aBianca@bI dun't think I've ever seen so much dust. I wonder how long it's bin since this place had a good clean.\n@c0@"
  es: "@aBianca@bCreo que nunca he visto tanto polvo junto en mi vida. ¿Cuánto tiempo hará que no se ha hecho una buena limpieza aquí?\n@c0@"
  fr: "@aBianca@bJe crois que je n'ai jamais vu autant de poussière. Je me demande depuis combien de temps le ménage\r\nn'a pas été fait ici.\n@c0@"
  it: "@aBianca@bNon avevo mai visto tanta polvere prima d'ora!\nSaranno secoli che nessuno dà una bella pulita a questo posto...\n@c0@"
  ja: "@a@bビアンカ「それにしても　ずいぶん\n\tほこりが　つもってるわね。\n\tいつから　そうじしてないのかしら。\n@c0@"
148:
  de: "@aBianca@bWas ist los, %a000090?\nHast du etwa Angst?\n@c0@"
  en: "@aBianca@bWhat's wrong, %a000090?\nAre you scared?\n@c0@"
  es: "@aBianca@b¿Qué te pasa, %a000090?\n¿Tienes miedo?\n@c0@"
  fr: "@aBianca@bQu'est-ce qui ne va pas, %a000090ⓡ\nTu as peurⓡ\n@c0@"
  it: "@aBianca@bQualcosa non va, %a000090?\nHai paura?\n@c0@"
  ja: "@a@bビアンカ「どうしたの　%a000090。\n\tこわいの？\n@c0@"
149:
  de: "@aBianca@bDenk einfach an diese Katze.\nDu willst ihr doch helfen, oder?\n@c0@"
  en: "@aBianca@bJust keep thinkin' about that cat.\nYou want to help it, right?\n@c0@"
  es: "@aBianca@bPiensa en ese gato, ¿me entiendes?\r\nQuieres ayudarlo, ¿verdad?\n@c0@"
  fr: "@aBianca@bConcentre-toi sur ce chat. Tu veux l'aider, nonⓡ\n@c0@"
  it: "@aBianca@bPensa al nostro amico micino!\nNon vorrai mica lasciarlo tra le mani di quei cattivacci, eh?!\n@c0@"
  ja: "@a@bビアンカ「そういうときは\n\tあのネコさんのこと　考えるのよ。\n\t%a000090だって助けてあげたいでしょ？\n@c0@"
150:
  de: "@aBianca@bHa ha! Du bist tapferer, als du aussiehst, %a000090! Ich bin beeindruckt!\n@c0@"
  en: "@aBianca@bHa ha! You're braver than you look, %a000090. I'm impressed!\n@c0@"
  es: "@aBianca@b¡Ja, ja! Eres más valiente de lo que pareces, %a000090. ¡Estoy impresionada!\n@c0@"
  fr: "@aBianca@bHa haⓠ Tu es plus courageux que tu n'en as l'air, %a000090. Je suis très impressionnée.\n@c0@"
  it: "@aBianca@bAh ah ah!\nSei più coraggioso di quanto sembri, %a000090!\nBravo!\n@c0@"
  ja: "@a@bビアンカ「うふふ。\n\t%a000090ったら　たのもしいのね。\n\t見なおしちゃったわ。\n@c0@"
151:
  de: "@aBianca@bSieht ganz so aus, als wären die Monster alle abgehauen. Das sind gute Neuigkeiten.\n@c0@"
  en: "@aBianca@bLooks like the monsters have all gone now.\nThat's good news.\n@c0@"
  es: "@aBianca@bParece que todos los monstruos se han marchado.\r\nEso es estupendo.\n@c0@"
  fr: "@aBianca@bOn dirait que les monstres sont tous partis, maintenant. C'est une bonne nouvelle.\n@c0@"
  it: "@aBianca@bA quanto pare, ora non ci sono più fantasmi.\nQuesta sì che è una bella notizia!\n@c0@"
  ja: "@a@bビアンカ「もう　魔物たちも\n\tいなくなったみたいね。\n\tよかった……。\n@c0@"
152:
  de: "@aBianca@bBald bricht der Morgen an.\nWir sollten nach Wittenhausen zurückkehren.\n@c0@"
  en: "@aBianca@bIt'll be mornin' soon.\r\nWe'd better get back to Roundbeck.\n@c0@"
  es: "@aBianca@bPronto se hará de día.\r\nSerá mejor que volvamos a Golfo Blanco.\n@c0@"
  fr: "@aBianca@bLe jour va bientôt se lever. On ferait bien de retourner à Blanchecombe.\n@c0@"
  it: "@aBianca@bTra poco farà giorno...\nChe ne dici di tornare a Blankenburg?\n@c0@"
  ja: "@a@bビアンカ「そろそろ　夜が明けるわよ。\n\t早く　アルカパに　帰りましょう。\n@c0@"
153:
  de: "@aBianca@bDie Wache in Steinach macht doch nachts ein Nickerchen, nicht?\n@c0@"
  en: "@aBianca@bThe Whealbrook guard has a snooze at night-time, dun't he?\n@c0@"
  es: "@aBianca@bEl guardia de Arroyofrío suele echar una cabezadita por la noche, ¿sabes?\n@c0@"
  fr: "@aBianca@bLe garde de Ruycelieu pique aussi un petit somme pendant la nuit, heinⓡ\n@c0@"
  it: "@aBianca@bLa guardia di Valcava si addormenta spesso di notte...\n@c0@"
  ja: "@a@bビアンカ「サンタローズの\n\t見張りのおじさんも\n\t夜になると　寝ちゃうんだね…。\n@c0@"
154:
  de: "@aBianca@bTrotzdem blockiert er immer noch den Dorfeingang. Da hat er dem Kerl in Wittenhausen was voraus.\n@c0@"
  en: "@aBianca@bStill, he's there blockin' the village entrance even so. I'd say that puts him above the fella at Roundbeck.\n@c0@"
  es: "@aBianca@bPero sigue ahí, bloqueando la entrada del pueblo. Yo diría que lo hace mejor que el guardia de Golfo Blanco.\n@c0@"
  fr: "@aBianca@bMais même endormi, il bloque l'entrée du village.\r\nAlors je trouve qu'il est quand même meilleur que\r\nson collègue de Blanchecombe.\n@c0@"
  it: "@aBianca@bEppure riesce ugualmente a bloccare l'ingresso del villaggio, cosa che non fa il suo collega di Blankenburg! Ma come farà?!\n@c0@"
  ja: "@a@bビアンカ「でも　寝てても　ちゃんと\n\t村の入り口を　身体で守るなんて\n\tアルカパの人より　すごいかも。\n@c0@"
155:
  de: "@aBianca@bWollten wir nicht rüber zu den Geisterzinnen, um auf Gespensterjagd zu gehen, %a000090?\n@c0@"
  en: "@aBianca@bEn't we supposed to be gettin' over to Uptaten Towers for a spot of ghostbustin', %a000090?\n@c0@"
  es: "@aBianca@bPero ¿no íbamos a pasarnos por las Torres Alverres a cazar fantasmas, %a000090?\n@c0@"
  fr: "@aBianca@bOn n'était pas censés se rendre aux tours Karpatt pour une chasse aux fantômes, %a000090ⓡ\n@c0@"
  it: "@aBianca@bNon dovevamo andare al Palazzo delle Ombre per affrontare i fantasmi, %a000090?\n@c0@"
  ja: "@a@bビアンカ「ねえ　%a000090。\n\tわたしたち　お化け退治に\n\tレヌール城へ　行くんだったよね？\n@c0@"
156:
  de: "@aBianca@bWas machen wir dann hier in Steinach? Dein Orientierungssinn lässt auch zu wünschen übrig, was?\n@c0@"
  en: "@aBianca@bThen what are we doin' here in Whealbrook? You don't have much sense of direction, eh?\n@c0@"
  es: "@aBianca@bEntonces, ¿qué hacemos aquí en Arroyofrío? No te orientas muy bien, ¿a que no?\n@c0@"
  fr: "@aBianca@bAlors qu'est-ce qu'on fait à Ruycelieuⓡ Tu n'as pas vraiment le sens de l'orientation, heinⓡ\n@c0@"
  it: "@aBianca@bAllora che ci facciamo qui a Valcava?\nNon hai uno spiccato senso dell'orientamento, eh?\n@c0@"
  ja: "@a@bビアンカ「なのに　どうして\n\tサンタローズに来ちゃうの？\n\t%a000090の　方向オンチっ！\n@c0@"
157:
  de: "@aBianca@bDie Gespensterjagd wär vorüber, und bald bricht der Morgen an. Wir sollten uns beeilen und nach Wittenhausen zurückkehren.\n@c0@"
  en: "@aBianca@bWe're done with the ghostbustin' now, and it'll be mornin' soon. We should hurry up and get back to Roundbeck.\n@c0@"
  es: "@aBianca@bYa hemos terminado de cazar fantasmas, y dentro de poco se hará de día. Hay que darse prisa y volver a Golfo Blanco.\n@c0@"
  fr: "@aBianca@bOn a terminé la chasse aux fantômes et le jour va bientôt se lever. On devrait se dépêcher de\r\nrentrer à Blanchecombe.\n@c0@"
  it: "@aBianca@bLa caccia agli spettri è finita, e presto sarà giorno.\nSbrighiamoci a tornare a Blankenburg.\n@c0@"
  ja: "@a@bビアンカ「お化け退治は　すんだし\n\tもうすぐ　夜も明けちゃうわ。\n\t早く　アルカパへ帰りましょうよ。\n@c0@"
158:
  de: "@aBianca@bMeinst du nicht auch, wir sollten uns mit dieser Gespensterjagd ein bisschen beeilen?\n@c0@"
  en: "@aBianca@bDun't you think we'd better get a move on with our ghostbustin'?\n@c0@"
  es: "@aBianca@bSerá mejor que nos pongamos a cazar fantasmas tal que ya, ¿me entiendes?\n@c0@"
  fr: "@aBianca@bTu ne crois pas qu'on devrait se dépêcher de partir pour notre chasse aux fantômesⓡ\n@c0@"
  it: "@aBianca@bNon pensi che dovremmo sbrigarci con quei fantasmi?\n@c0@"
  ja: "@a@bビアンカ「ねえ　早く\n\tお化け退治に　行かなくちゃ！\n@c0@"
159:
  de: "@aBianca@bWir kriegen sicher Ärger, wenn die Erwachsenen aufwachen und uns hier sehen.\n@c0@"
  en: "@aBianca@bWe'll be in trouble if the grown-ups wake up and spot us here.\n@c0@"
  es: "@aBianca@bSi los mayores se despiertan y nos encuentran aquí, nos meteremos en un buen lío.\n@c0@"
  fr: "@aBianca@bOn aura des ennuis si les adultes se réveillent et nous trouvent ici.\n@c0@"
  it: "@aBianca@bSe ci facciamo trovare qui, per noi saranno guai!\n@c0@"
  ja: "@a@bビアンカ「おじさまたちが\n\t目を覚ますと　大変だわよ。\n@c0@"
160:
  de: "@aBianca@bWas machst du denn da, %a000090? Was soll es bringen, mit Leuten zu reden, die schlafen und eh nix mitkriegen?\n@c0@"
  en: "@aBianca@bWhat are you doin', %a000090!? What's the point in speakin' to folk when they're asleep, eh?\n@c0@"
  es: "@aBianca@bPero, ¿qué haces, %a000090? ¿Para qué hablas con la gente, si están dormidos?\n@c0@"
  fr: "@aBianca@bMais qu'est-ce que tu fais, %a000090ⓡⓐ\nÀ quoi ça sert de parler aux gens\nquand ils dorment, dis-moiⓡ\n@c0@"
  it: "@aBianca@bChe fai, %a000090?!\nParli con la gente che dorme?\nEh eh eh! Sei proprio un mattacchione!\n@c0@"
  ja: "@a@bビアンカ「%a000090ったら\n\t寝ている　おじさんにまで\n\t話しかけるんだもの　おっかし～い！\n@c0@"
161:
  de: "@aBianca@bDas gibt's doch nicht! Ich kann's kaum fassen, dass wir es ganz allein bis hierhin geschafft haben!\n@c0@"
  en: "@aBianca@bNo way! I can't believe we made it this far all on our own!\n@c0@"
  es: "@aBianca@b¡Imposible! ¡No puedo creer que hayamos llegado hasta aquí nosotros solos!\n@c0@"
  fr: "@aBianca@bC'est dingueⓠ Je n'arrive pas à croire qu'on a fait tout ce chemin tout seulsⓠ\n@c0@"
  it: "@aBianca@bIncredibile!\nNon riesco a credere che siamo giunti fin qui senza l'aiuto di nessuno!\n@c0@"
  ja: "@a@bビアンカ「まあ　わたしたちだけで\n\tこんなに　遠くまで　来られたわ！\n@c0@"
162:
  de: "@aBianca@bAber was red' ich denn da? Wir sollten hier nicht rumstehen und uns gegenseitig auf die Schulter klopfen. Wir müssen zu den Geisterzinnen!\n@c0@"
  en: "@aBianca@bWhat am I sayin'!? We shouldn't be standin' 'round here pattin' ourselves on the back. We need to get over to Uptaten Towers!\n@c0@"
  es: "@aBianca@b¿Pero qué estoy diciendo? ¿Qué hacemos aquí parados, dándonos palmaditas en la espalda? ¡Tenemos que llegar a las Torres Alverres!\n@c0@"
  fr: "@aBianca@bMais qu'est-ce que je raconteⓡⓐ On ne devrait pas rester plantés là à se féliciter. Il faut qu'on aille\naux tours Karpattⓠ\n@c0@"
  it: "@aBianca@bPerò dobbiamo sbrigarci ad arrivare al Palazzo delle Ombre...\nForza, andiamo.\n@c0@"
  ja: "@a@bビアンカ「…なんて　言うと思った？\n\t今は　道草してる場合じゃないよ。\n\tレヌール城へ　行かなくちゃ！\n@c0@"
163:
  de: "@aBianca@bIch fühl mich plötzlich ganz müde.\nKönnen wir nach Wittenhausen zurückkehren?\n@c0@"
  en: "@aBianca@bI've come over all sleepy all of a sudden. Can we go back to Roundbeck now?\n@c0@"
  es: "@aBianca@bDe pronto me ha entrado un ataque de sueño. ¿Y si volvemos a Golfo Blanco?\n@c0@"
  fr: "@aBianca@bJ'ai très envie de dormir, tout d'un coup.\nEst-ce qu'on pourrait rentrer à Blanchecombe, maintenantⓡ\n@c0@"
  it: "@aBianca@bMi è venuto un gran sonno...\nChe ne diresti di tornare a Blankenburg, eh?\n@c0@"
  ja: "@a@bビアンカ「なんだか\n\t眠くなってきちゃった…。\n\t早く　アルカパに戻ろうよ～。\n@c0@"
164:
  de: "@aBianca@bDieser Kerl hat das Wachestehen drauf, was? Er schläft nicht bei der Arbeit, obwohl's Nacht ist.\n@c0@"
  en: "@aBianca@bThis fella's doin' a good job of standin' guard, eh? He's not sleepin' on the job even though it's night-time.\n@c0@"
  es: "@aBianca@bEse tipo está haciendo muy bien su guardia, ¿sabes? Es de noche y no se duerme.\n@c0@"
  fr: "@aBianca@bCe type monte drôlement bien la garde, heinⓡ\nIl ne dort pas, même en pleine nuit.\n@c0@"
  it: "@aBianca@bQuella guardia fa il suo dovere fino in fondo, eh?\nÈ ben sveglia durante il turno di notte.\n@c0@"
  ja: "@a@bビアンカ「ここの　おじさんは\n\tちゃんと　寝ないで\n\t見張りを　してるのね。\n@c0@"
165:
  de: "@aBianca@bEs ist schon toll, außerhalb des Dorfs rumzuspazieren, was?\n@c0@"
  en: "@aBianca@bIt's great fun bein' able to wander about outside the village like this, eh?\n@c0@"
  es: "@aBianca@bQué divertido, pasearse fuera del pueblo, ¿eh?\n@c0@"
  fr: "@aBianca@bC'est vraiment marrant de se promener comme ça\nà l'extérieur du village, heinⓡ\n@c0@"
  it: "@aBianca@bÈ proprio divertente gironzolare fuori dal villaggio in questo modo, eh?\n@c0@"
  ja: "@a@bビアンカ「村の外を　自由に歩けて\n\tうれしいのは　わかるけど…。\n@c0@"
166:
  de: "@aBianca@bAber ich find's schon sehr beeindruckend, dass wir's bis hierhin geschafft haben. Du und ich, wir haben es weit gebracht! \n@c0@"
  en: "@aBianca@bI'm well impressed that we've made it this far, though. We've come a long way, you and me.\n@c0@"
  es: "@aBianca@bEso sí, no me puedo creer que hayamos llegado tan lejos. Tú y yo hemos vivido mucho juntos...\n@c0@"
  fr: "@aBianca@bMais je suis quand même très impressionnée qu'on\nsoit arrivés jusqu'ici. On a beaucoup marché, nonⓡ\n@c0@"
  it: "@aBianca@bSai una cosa? Non credevo che saremmo riusciti ad arrivare fin qui!\nSiamo proprio in gamba!\n@c0@"
  ja: "@a@bビアンカ「こんな所まで　来るなんて\n\tなんだか　あきれるのを通りこして\n\t感心しちゃうよ。\n@c0@"
167:
  de: "@aBianca@bBist du gar nicht müde, %a000090? Ich hätt' nix dagegen, jetzt nach Wittenhausen zurückzukehren. \n@c0@"
  en: "@aBianca@bAren't you feelin' tired, %a000090? I'm ready to go back to Roundbeck myself.\n@c0@"
  es: "@aBianca@b¿No estás cansado, %a000090? Yo me volvería a Golfo Blanco, vamos.\n@c0@"
  fr: "@aBianca@bTu n'es pas fatigué, %a000090ⓡ\nMoi, en tout cas, je suis prête à rentrer à Blanchecombe.\n@c0@"
  it: "@aBianca@bNon sei stanco, %a000090?\nIo vorrei tornare a Blankenburg...\n@c0@"
  ja: "@a@bビアンカ「%a000090ったら\n\t全然　ねむくないの？\n\tさあ　アルカパへ　帰りましょうよ。\n@c0@"
168:
  de: "@aBianca@bWas hast du denn vor, %a000090? Die Geisterhatz ist vorbei, jetzt wird's Zeit, dass wir uns auf den Weg nach Hause machen.\n@c0@"
  en: "@aBianca@bWhat are you up to, %a000090? We've done our ghostbustin', so it's time we got off home.\n@c0@"
  es: "@aBianca@b¿Qué haces, %a000090? Ya hemos acabado con los fantasmas y podemos volver a casa.\n@c0@"
  fr: "@aBianca@bQu'est-ce que tu fabriques, %a000090ⓡ\nOn a terminé notre chasse aux fantômes,\nil est temps de rentrer à la maison.\n@c0@"
  it: "@aBianca@bChe ti prende, %a000090?\nCi siamo liberati dei fantasmi, no?\nChe ne dici di tornare a casa?\n@c0@"
  ja: "@a@bビアンカ「何してるの？　%a000090。\n\tお化けを退治したんだから\n\t早く　帰りましょうよ！\n@c0@"
169:
  de: "@aBianca@bEs heißt doch, dass man auf Monster stößt, wenn man außerhalb des Dorfs rumläuft, nicht?\n@c0@"
  en: "@aBianca@bPeople say you run into monsters if you wander about outside of town, dun't they? \n@c0@"
  es: "@aBianca@bDicen que, si sales de la ciudad, acabas encontrándote con monstruos, ¿sabes?\n@c0@"
  fr: "@aBianca@bLes gens racontent qu'on croise des monstres si on s'éloigne de la ville, heinⓡ\n@c0@"
  it: "@aBianca@bLa gente dice che fuori dal villaggio ci sono i mostri cattivi...\n@c0@"
  ja: "@a@bビアンカ「そういえば　町の外には\n\t魔物が　出るんだっけ。\n@c0@"
170:
  de: "@aBianca@bTrotzdem müssen wir jetzt losziehen und uns um diese Gespenster in den Geisterzinnen kümmern. Also sollten wir uns darüber gar keine Gedanken machen.\n@c0@"
  en: "@aBianca@bStill, we got to go and sort out those ghosts at Uptaten Towers, so it's no good worryin' ourselves about that.\n@c0@"
  es: "@aBianca@bDe todas maneras tenemos que ir a encargarnos de esos fantasmas de las Torres Alverres, así que será mejor que no pensemos en eso.\n@c0@"
  fr: "@aBianca@bEt pourtant, il faut bien aller s'occuper de ces fantômes dans les tours Karpatt, alors pas la peine de s'inquiéter avec ça.\n@c0@"
  it: "@aBianca@bPerò a me non importa! Se vogliamo dare una lezione ai fantasmi al Palazzo delle Ombre, dobbiamo uscire dal paese, mostri o non mostri!\n@c0@"
  ja: "@a@bビアンカ「でも　レヌール城のお化けを\n\t退治するんだもの。　魔物なんて\n\tこわがってられないよね。\n@c0@"
171:
  de: "@aBianca@bDu und dein Vater Ludwig, ihr reist doch jetzt schon eine ganze Weile durch die Gegend, nicht, %a000090?\n@c0@"
  en: "@aBianca@bYou and your old man Pankraz have bin travellin' about together for a good long while now, haven't you, %a000090?\n@c0@"
  es: "@aBianca@bTú y tu padre, Teudis, lleváis mucho tiempo de viaje juntos, ¿verdad, %a000090?\n@c0@"
  fr: "@aBianca@bÇa fait un bon bout de temps que toi et ton père Petros voyagez ensemble, hein, %a000090ⓡ\n@c0@"
  it: "@aBianca@bMi hanno detto che tu e tuo padre Russel avete viaggiato tanto insieme...\nÈ vero, %a000090?\n@c0@"
  ja: "@a@bビアンカ「%a000090は　ずっと\n\tパパスおじさまとふたりで\n\t旅してたんでしょ？\n@c0@"
172:
  de: "@aBianca@bDu hast echt 'n Glück. Der einzige Ort, den ich kenne, ist dieses stinklangweilige Kaff Steinach.\n@c0@"
  en: "@aBianca@bYou're so lucky. The only place I've ever bin is borin' old Whealbrook.\n@c0@"
  es: "@aBianca@b¡Qué suerte tienes! Yo, el único sitio en el que he estado es Arroyofrío, ¡menudo aburrimiento!\n@c0@"
  fr: "@aBianca@bTu as tellement de chance. Le seul endroit où je suis allée, c'est Ruycelieu, et c'est vraiment pas marrant.\n@c0@"
  it: "@aBianca@bChe fortunato che sei!\nIo sono stata solo a Valcava...\n@c0@"
  ja: "@a@bビアンカ「いいな～。\n\tわたしなんて　サンタローズまでしか\n\t行ったことないんだよ。\n@c0@"
173:
  de: "@aBianca@bDiese Gespensterjagd wird die weiteste Reise sein, die ich bislang gemacht hab.\n@c0@"
  en: "@aBianca@bThis ghostbustin' trip will be the furthest I've travelled, y'know.\n@c0@"
  es: "@aBianca@bEste viaje de cazafantasmas será lo más lejos que he viajado nunca, ¿sabes?\n@c0@"
  fr: "@aBianca@bCette expédition de chasse au fantômes, c'est\r\nle plus loin où je serai jamais allée, tu sais.\n@c0@"
  it: "@aBianca@bPer me andare a caccia di fantasmi è anche un modo per visitare un posto nuovo!\n@c0@"
  ja: "@a@bビアンカ「このお化け退治が\n\t今までで　いちばんの遠出なんだ。\n@c0@"
174:
  de: "@aBianca@bLos, beeilen wir uns! Kümmern wir uns um diese Gespenster, damit wir die arme Katze retten können!\n@c0@"
  en: "@aBianca@bLet's hurry up and sort them ghosts out so we can save that poor cat!\n@c0@"
  es: "@aBianca@b¡Vamos a acabar con esos fantasmas y salvar a ese pobre gatito cuanto antes!\n@c0@"
  fr: "@aBianca@bDépêchons-nous d'aller mettre une raclée à ces fantômes pour pouvoir sauver ce pauvre minouⓠ\n@c0@"
  it: "@aBianca@bSbrighiamoci a dare una lezione agli spettri, così salveremo quel povero gattino!\n@c0@"
  ja: "@a@bビアンカ「さあ　お化け退治なんて\n\tさっさと　すませちゃって\n\tあのネコさんを　助けましょ！\n@c0@"
175:
  de: "@aBianca@bVielleicht haben wir uns da ein bisschen zu viel aufgehalst. Hoffentlich schaffen wir's, dieses arme kleine Kätzchen zu retten.\n@c0@"
  en: "@aBianca@bMaybe we've gone and agreed to somethin' a bit too tricky. I hope we'll be able to save that poor little cat.\n@c0@"
  es: "@aBianca@bA lo mejor hemos dicho que sí a una cosa demasiado complicada. Espero que podamos salvar a ese pobre gato.\n@c0@"
  fr: "@aBianca@bPeut-être qu'on s'est lancés dans quelque chose d'un peu trop dur. J'espère qu'on arrivera à sauver ce pauvre petit chaton.\n@c0@"
  it: "@aBianca@bNon so se abbiamo fatto bene ad accettare la sfida di quei ragazzacci... Spero tanto che riusciremo a salvare il micino.\n@c0@"
  ja: "@a@bビアンカ「わたしたち　もしかして\n\tとんでもない約束しちゃった？\n\tネコさんを　助けてあげられるかな。\n@c0@"
176:
  de: "@aBianca@bWir haben es geschafft! Wir sind die Größten, du und ich!\n@c0@"
  en: "@aBianca@bWe did it! We're the bee's knees, you and me!\n@c0@"
  es: "@aBianca@b¡Lo conseguimos! ¡Somos la caña, tú y yo!\n@c0@"
  fr: "@aBianca@bOn a réussiⓠ Toi et moi, on est les meilleursⓠ\n@c0@"
  it: "@aBianca@bCe l'abbiamo fatta!\nSiamo proprio in gamba, eh?\n@c0@"
  ja: "@a@bビアンカ「やったね！\n\tわたしたちって　すっごいね！\n@c0@"
177:
  de: "@aBianca@bHeute Nacht kann ich bestimmt kein Auge zutun!\n@c0@"
  en: "@aBianca@bI won't get a wink of sleep tonight now!\n@c0@"
  es: "@aBianca@b¡Esta noche no voy a poder pegar ojo de la emoción!\n@c0@"
  fr: "@aBianca@bAprès ça, je n'arriverai jamais à m'endormir,\ncette nuitⓠ\n@c0@"
  it: "@aBianca@bStanotte non chiuderò occhio dall'emozione!\n@c0@"
  ja: "@a@bビアンカ「なんだか　今日は\n\tねむれそうにないよ！\n@c0@"
178:
  de: "@aBianca@bIch kann's ja kaum erwarten, bis es Morgen wird. Es wird echt toll sein, diesen schrecklichen Jungs die arme Katze abzunehmen.\n@c0@"
  en: "@aBianca@bI can hardly wait for mornin' to roll around.\r\nIt'll be wonderful to get that poor cat away from them horrible boys.\n@c0@"
  es: "@aBianca@bNo veo la hora de que se haga de día de una vez.\r\nSerá genial llevarnos a ese gato lejos de esa gente horrible, ¿me entiendes?\n@c0@"
  fr: "@aBianca@bJ'ai hâte que le matin arrive. Ça sera fantastique\r\nde sortir ce pauvre chat des griffes de ces horribles garçons.\n@c0@"
  it: "@aBianca@bNon vedo l'ora che arrivi domattina, così potremo liberare il gattino dalle grinfie di quei cattivoni!\n@c0@"
  ja: "@a@bビアンカ「夜があけるのが\n\t待ちどおしいね。　早く\n\tネコさんを　自由にしてあげたいよ。\n@c0@"
179:
  de: "@aZuckerchen@bEs war kein Traum, weißt du. Es gibt uns Feen wirklich! Genau wie Feenaue und alles andere im Reich der Feen.\n@c0@"
  en: "@aHoney@bIt wasn't a dream, you know. Faeries are real!\nAnd so is Faerie Lea, and everything else in the Realm of the Faeries.\n@c0@"
  es: "@aDulce@bNo fue un sueño. ¡Las hadas existen de verdad!\r\nComo Hadavilla y el resto del Reino de las Hadas.\n@c0@"
  fr: "@aCandy@bÇa n'était pas un rêve, tu sais. Les fées existent vraimentⓠ Tout comme Féeria et tout ce qui se trouve dans le royaume des Fées.\n@c0@"
  it: "@aAmandina@bNon era un sogno! Le fate esistono davvero!\nCosì come esiste Domus Fatae e tutto ciò che hai visto nel Regno delle Fate.\n@c0@"
  ja: "@a@bべラ「もちろん　妖精の国のことは\n\t夢なんかじゃないわ。\n@c0@"
180:
  de: "@aZuckerchen@bSchließlich redest du ja gerade mit mir, oder? Also kann es auch kein Traum gewesen sein, nicht?\n@c0@"
  en: "@aHoney@bI mean, you're talking to me now, aren't you?\nSo it couldn't have been a dream, could it?\n@c0@"
  es: "@aDulce@bPorque estamos hablando, ¿no?\r\nY eso no puede ser un sueño, ¿verdad?\n@c0@"
  fr: "@aCandy@bC'est vrai, tu me parles, en ce moment même,\nn'est-ce pasⓡ Alors ça ne peut pas être un rêveⓠ\n@c0@"
  it: "@aAmandina@bVoglio dire, ora stai parlando con me, no?\nOra sei sveglio, no?\nNon stai mica sognando!\n@c0@"
  ja: "@a@bべラ「こうして　私と話していることが\n\tなによりの　ショウコでしょ？\n@c0@"
181:
  de: "@aZuckerchen@bDein Vater sieht aus wie ein ziemlich zäher Brocken. Ja, er ist genau die Art von Mensch, nach der ich gesucht habe, um uns zu helfen.\n@c0@"
  en: "@aHoney@bYour dad looks really tough. Yes, he's the kind of human I was hoping to find to help us.\n@c0@"
  es: "@aDulce@bTu padre parece un tipo duro de verdad. Sí, justo es el tipo de humano que buscaba para que nos ayudase.\n@c0@"
  fr: "@aCandy@bTon papa a l'air vraiment fort. Oui, c'est le genre d'humain que j'espérais trouver pour nous aider.\n@c0@"
  it: "@aAmandina@bIl tuo papà sembra molto forte.\nÈ proprio il tipo di umano che speravo potesse venire in nostro aiuto...\n@c0@"
  ja: "@a@bべラ「あなたのお父さん　強そうね。\n\t本当なら　こういう人に\n\tチカラを　借りたかったわ。\n@c0@"
182:
  de: "@aZuckerchen@bHoppla! Das soll aber nicht heißen, dass ich mit dir nicht zufrieden wäre. Bin ich! Ehrlich! Hi hi hi.\n@c0@"
  en: "@aHoney@bOops-a-daisy! I didn't mean I'm not happy with you. I am. Honest! Tee hee hee!\n@c0@"
  es: "@aDulce@b¡Recórcholis! No quería decir que tú me parecieses mal. ¡Me pareces bien, de verdad! ¡Ji, ji, ji!\n@c0@"
  fr: "@aCandy@bOupsⓠ Ça ne veut pas dire que je ne suis pas contente d'être avec toi, hein. Au contraire.\nJe t'assureⓠ Ti-hi-hiⓠ\n@c0@"
  it: "@aAmandina@bOps! Ma cosa sto dicendo, eh?\nNon volevo certo dire che tu non sei stato all'altezza! No no no! Tee eh eh!\n@c0@"
  ja: "@a@bベラ「あっ　ごめんなさい！\n\tべつに　あなたじゃ　不満だって\n\t言ってるわけじゃないのよ。\n@c0@"
183:
  de: "@aZuckerchen@bIch wette, dass du später auch mal ein großer Mann wirst, %a000090. Genau wie dein Vater.\n@c0@"
  en: "@aHoney@bI bet you'll grow up to be a great man too, %a000090. Just like your father.\n@c0@"
  es: "@aDulce@bSeguro que cuando crezcas tú también serás un gran tipo, %a000090. Igual que tu padre.\n@c0@"
  fr: "@aCandy@bJe parie que toi aussi, quand tu seras grand, tu deviendras un grand homme, %a000090.\nComme ton père.\n@c0@"
  it: "@aAmandina@bAnche tu, un giorno, diventerai un uomo grande e forte come tuo padre, %a000090.\n@c0@"
  ja: "@a@bベラ「%a000090も　お父さんみたいな\n\tりっぱな人に　なりそうね。\n@c0@"
184:
  de: "@aZuckerchen@bSchließlich hast du's ja geschafft, uns den Frühlingsboten zurückzubringen. Das ist toll!\n@c0@"
  en: "@aHoney@bI mean, you got the Herald of Spring back for us. That's amazing!\n@c0@"
  es: "@aDulce@bSi hasta recuperaste el Heraldo de la Primavera para nosotras. ¡Es asombroso!\n@c0@"
  fr: "@aCandy@bC'est vrai. Tu as récupéré le Messager du Printemps pour nous. C'est incroyableⓠ\n@c0@"
  it: "@aAmandina@bNe sono certa!\nDopotutto, sei riuscito a riportarci il Richiamo della Primavera. Hai compiuto una grande impresa!\n@c0@"
  ja: "@a@bベラ「フルートを　取りもどすなんて\n\tすごいこと　できたんだもの。\n\t自信持っていいわよ。\n@c0@"
185:
  de: "@aZuckerchen@bEs wird auch sonst niemand verstehen, selbst wenn du allen von mir und den anderen Feen erzählen würdest.\n@c0@"
  en: "@aHoney@bNo one else would understand, even if you told them all about me and the other faeries.\n@c0@"
  es: "@aDulce@bSi le contases a alguien lo que sabes de mí y de las otras hadas, no lo entenderían.\n@c0@"
  fr: "@aCandy@bPersonne ne te comprendrait, même si tu leur racontais tout sur moi et les autres fées.\n@c0@"
  it: "@aAmandina@bAnche se tu raccontassi tutto di me e delle altre fate, dubito che gli altri esseri umani ti crederebbero.\n@c0@"
  ja: "@a@bべラ「%a000090が　どんなに\n\t大変かなんて　説明しても\n\tわかってもらえないでしょうね。\n@c0@"
186:
  de: "@aZuckerchen@bDas wird unser kleines Geheimnis bleiben. Hi hi! Das ist doch spaßig, oder nicht?\n@c0@"
  en: "@aHoney@bIt'd better be our little secret. Just between you and me. Tee hee! It'll be fun, won't it?\n@c0@"
  es: "@aDulce@bSerá mejor que sea un secreto entre nosotros. Entre tú y yo, y ya está. ¡Ji, ji! Qué divertido, ¿no?\n@c0@"
  fr: "@aCandy@bIl vaut mieux que cela reste notre petit secret.\nJuste entre toi et moi. Ti-hiⓠ Ça sera drôle, nonⓡ\n@c0@"
  it: "@aAmandina@bIl nostro incontro e ciò che hai fatto per il Regno delle Fate resteranno un segreto.\nTee eh eh! Il nostro piccolo grande segreto!\n@c0@"
  ja: "@a@bべラ「妖精の国で　起こっていることは\n\tみんなには　ナイショに\n\tしておきましょう。\n@c0@"
187:
  de: "@aZuckerchen@bHier ist es ein wenig kühl, das stimmt schon. Aber im Vergleich zu meiner Heimat ist es fast wie in einer Sauna!\n@c0@"
  en: "@aHoney@bIt is a little bit chilly here, I suppose.\r\nBut compared to where I come from, it's like an oven.\n@c0@"
  es: "@aDulce@bHace un poquito de frío aquí.\r\nPero, comparado con el sitio de donde vengo, esto es como un horno.\n@c0@"
  fr: "@aCandy@bJe suppose qu'il fait un petit peu frais, ici.\r\nMais comparé à là d'où je viens, il fait chaud\r\ncomme dans un four.\n@c0@"
  it: "@aAmandina@bForse penserai che qui faccia freddo ma, paragonato al posto da cui vengo, sembra di stare in un forno.\n@c0@"
  ja: "@a@bベラ「たしかに　ここも　寒いけど\n\t妖精の国に比べたら\n\tこんなの　まだまだね。\n@c0@"
188:
  de: "@aZuckerchen@bEs tut mir leid. Ich hab dich in Gefahr gebracht, dabei bist du ja noch ein kleiner Junge.\n@c0@"
  en: "@aHoney@bI'm sorry. I've put you in danger, and you're just a boy too.\n@c0@"
  es: "@aDulce@bLo siento. Te he puesto en peligro, y solo eres un chiquillo.\n@c0@"
  fr: "@aCandy@bJe suis désolée. Je t'ai mis en danger, d'autant plus que tu n'es encore qu'un petit garçon.\n@c0@"
  it: "@aAmandina@bNon avrei dovuto farti correre tanti rischi...\nAvevo dimenticato che sei solo un bambino.\n@c0@"
  ja: "@a@bべラ「ごめんなさいね。\n\tまだ　小さなあなたに\n\tキケンなこと　たのんでしまって…。\n@c0@"
189:
  de: "@aZuckerchen@bWenn mich die erwachsenen Menschen nur auch sehen könnten. Dann hätte ich nicht dich bitten müssen, uns zu helfen.\n@c0@"
  en: "@aHoney@bIf only grown-up humans could see me as well. Then I wouldn't have had to ask you to help us.\n@c0@"
  es: "@aDulce@bSi los humanos adultos pudiesen verme también... entonces no tendría que pedirte ayuda a ti.\n@c0@"
  fr: "@aCandy@bSi seulement les humains adultes pouvaient me voir, eux aussi. Je n'aurais pas eu à te demander ton aide.\n@c0@"
  it: "@aAmandina@bSe gli umani adulti fossero in grado di vedermi, non sarei stata costretta a chiederti di aiutarci...\n@c0@"
  ja: "@a@bべラ「大人の人たちに\n\t私が　見えれば\n\tこんなことに　ならなかったのに。\n@c0@"
190:
  de: "@aZuckerchen@bFür die Erwachsenen bist du bloß ein ganz normaler Junge, nicht wahr? Tja, man soll die Dinge eben nicht nur von außen beurteilen, sagen wir Feen immer!\n@c0@"
  en: "@aHoney@bAll the grown-ups just see you as a normal little boy, don't they? Well never judge a book by its cover! That's what we faeries say.\n@c0@"
  es: "@aDulce@bLos mayores te ven como un chico normal, ¿a que sí? ¡Las apariencias engañan! Eso dicen las hadas.\n@c0@"
  fr: "@aCandy@bTous les adultes te considèrent comme un petit garçon normal, n'est-ce pasⓡ Eh bien, l'habit ne\nfait pas le moineⓠ C'est ce que disent les fées.\n@c0@"
  it: "@aAmandina@bGli adulti ti vedono come un bambino indifeso, non è così? Beh, le apparenze ingannano!\nNoi fate lo sappiamo bene!\n@c0@"
  ja: "@a@bベラ「あなたの強さを　見ぬけない大人は\n\tたくさんいそうね。　見かけだけで\n\t人を　判断しちゃいけないのにね。\n@c0@"
191:
  de: "@aZuckerchen@bWenn der Winter niemals aufhört, wird alles überfrieren und keiner wird mehr etwas zu essen haben.\n@c0@"
  en: "@aHoney@bIf winter never ends, everything'll be frozen by the ice, and no one will have anything to eat.\n@c0@"
  es: "@aDulce@bSi no termina el invierno, el hielo lo congelará todo y nadie tendrá qué comer.\n@c0@"
  fr: "@aCandy@bSi l'hiver ne s'arrête pas, tout finira par geler complètement et personne n'aura plus rien à manger.\n@c0@"
  it: "@aAmandina@bSe l'inverno non finirà presto, tutto il mondo verrà coperto da una coltre di ghiaccio, e non ci sarà più nulla da mangiare.\n@c0@"
  ja: "@a@bべラ「このまま　春が来なかったら…\n\tみんな　寒さにこごえて\n\t食べるものもなく　死んでしまうわ。\n@c0@"
192:
  de: "@aZuckerchen@bWir müssen die Flöte zurückholen! Wir brauchen den Frühlingsboten, um diesem frostigen Winter ein Ende zu bereiten.\n@c0@"
  en: "@aHoney@bWe have to get the flute back! We need the Herald of Spring to bring an end to the freezing winter.\n@c0@"
  es: "@aDulce@b¡Tenemos que recuperar la flauta! Necesitamos el Heraldo de la Primavera para acabar con este invierno gélido.\n@c0@"
  fr: "@aCandy@bNous devons retrouver cette flûteⓠ Nous avons besoin du Messager du Printemps pour mettre\nun terme à cet hiver glacial.\n@c0@"
  it: "@aAmandina@bDobbiamo riprenderci il flauto!\nSenza il Richiamo della Primavera, non potremo porre fine a quest'inverno lungo e gelido!\n@c0@"
  ja: "@a@bベラ「なにが　なんでも\n\tフルートを　取りもどさないとっ！\n@c0@"
193:
  de: "@aZuckerchen@bJetzt könnt ihr wieder Gemüse anbauen. Die süßen Kartoffeln, die ihr Menschen esst, sind echt lecker. Ich werde mir irgendwann noch ein paar stibitzen!\n@c0@"
  en: "@aHoney@bNow you can grow your vegetables again. Those sweet potatoes you humans eat are yummy. I'll sneak back and have some more sometime!\n@c0@"
  es: "@aDulce@bAhora ya podéis volver a plantar cosas. Esa caña de azúcar que coméis los humanos es deliciosa. ¡Un día volveré a por un poco a escondidas!\n@c0@"
  fr: "@aCandy@bÀ présent, vous allez à nouveau pouvoir faire pousser vos légumes. Ces patates douces que vous mangez, vous autres humains, sont délicieuses.\n㈡\nJe reviendrai discrètement en manger\nquelques-unes, à l'occasion.\n@c0@"
  it: "@aAmandina@bOra potrete tornare a coltivare frutta e verdura!\nLe patate che mangiate voi umani sono ottime, e presto verrò a prenderne qualcuna! Tee eh eh!\n@c0@"
  ja: "@a@bベラ「食べ物の心配は　なくなったよね。\n\t人間のゴハン　おいしかったからな。\n\tまた　こっそり　食べに来ようかな。\n@c0@"
194:
  de: "@aZuckerchen@b%0%a000090, in deinem Dorf schlägt einem immer so viel Wärme entgegen. Nein, ich meine nicht das Wetter, Dummerchen! Ich spreche von den netten Menschen.\n@c0@"
  en: "@aHoney@bYour village has such a warm atmosphere, %a000090. Not the temperature, silly! I mean all the nice people.\n@c0@"
  es: "@aDulce@bEl ambiente de tu pueblo es muy cálido, %a000090. ¡No, la temperatura no, bobo!\nDigo la gente, que es muy amable.\n@c0@"
  fr: "@aCandy@bL'atmosphère de ton village est si chaleureuse, %a000090. Je ne te parle pas de température, gros bêtaⓠ Je te parle de la gentillesse des gens.\n@c0@"
  it: "@aAmandina@bNel tuo villaggio c'è un'atmosfera così calda, %a000090. Ovviamente non parlo della temperatura! Mi riferisco al calore della gente.\n@c0@"
  ja: "@a@bベラ「%a000090の村って　なんだか\n\tあったかいね。　…って　もちろん\n\t気温のことじゃなくて　人のことよ！\n@c0@"
195:
  de: "@aZuckerchen@bEs ist wohl wahr. Wenn du nur ein wenig älter wärst, dann hätte ich es auch nicht so schwer.\n@c0@"
  en: "@aHoney@bIt's true. If you were a bit older, things wouldn't be so difficult for me, either.\n@c0@"
  es: "@aDulce@bEs verdad. Si fueses un poco mayor, las cosas no serían tan difíciles para mí.\n@c0@"
  fr: "@aCandy@bC'est vrai. Si tu étais un peu plus vieux, les choses ne seraient pas si difficiles pour moi non plus.\n@c0@"
  it: "@aAmandina@bForse è vero.\nSe tu fossi stato più grande e forte, neanch'io avrei fatto tanta fatica.\n@c0@"
  ja: "@a@bべラ「本当に　%a000090が\n\tもっと大きければ　私も\n\t苦労しなかったのにと思うわ。\n@c0@"
196:
  de: "@aZuckerchen@bHoppla! So hab ich das gar nicht gemeint.\nIch meine... Hi hi hi hi!\n@c0@"
  en: "@aHoney@bOops! I, I didn't mean that.\nI mean... Tee hee hee hee!\n@c0@"
  es: "@aDulce@b¡Huy! No quería decir...\r\nQuiero decir... ¡Ji, ji, ji, ji!\n@c0@"
  fr: "@aCandy@bOupsⓠ Ce n'est pas ce que je voulais dire.\nJe veux dire... Ti-hi-hi-hiⓠ\n@c0@"
  it: "@aAmandina@bOps! Ehm, scusami! Non volevo certo offenderti!\nIntendevo solo dire che sei ancora molto giovane!\nTee eh eh!\n@c0@"
  ja: "@a@bべラ「あっ　ごめんなさい。\n\t今のは　失言だったわっ。\n@c0@"
197:
  de: "@aZuckerchen@bDieser alte Mann ist ein echter Kindskopf! Was weiß der denn schon?\n@c0@"
  en: "@aHoney@bThat old man's a silly billy! What does he know?\n@c0@"
