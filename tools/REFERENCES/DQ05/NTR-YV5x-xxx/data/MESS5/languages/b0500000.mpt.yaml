  fr: "@aBianca@bOn dirait que tu vas repartir à Ruycelieu une fois que tu auras dit au revoir à tout le monde, heinⓡ\n@c0@"
  it: "@aBianca@bE così te ne torni a Valcava, eh?\n@c0@"
  ja: "@a@bビアンカ「あいさつが　終わったら\n\t%a000090は　サンタローズに\n\t帰っちゃうのね。\n@c0@"
60:
  de: "@aBianca@bHm... Egal. Du solltest besser losziehen und allen Bescheid sagen, dass du aufbrichst.\n@c0@"
  en: "@aBianca@bUm... Never mind. You'd better get around and tell everyone you're off.\n@c0@"
  es: "@aBianca@bEsto... Es igual. Vamos, ve a decir adiós a todos.\n@c0@"
  fr: "@aBianca@bHum... Bref. Tu ferais mieux d'aller voir tout le monde pour leur dire que tu t'en vas.\n@c0@"
  it: "@aBianca@bMi dispiace...\nBeh, tanto ci rivedremo presto, no?\nForza, saluta tutti e poi vai con tuo padre.\n@c0@"
  ja: "@a@bビアンカ「……ううん　何でもないわ。\n\tさあ　早く　町の人たちに\n\tあいさつに　行きましょう！\n@c0@"
61:
  de: "@aBianca@bDu solltest %a001210 mitnehmen, %a000090. Und streichle ihn für mich ab und zu ein bisschen.\n@c0@"
  en: "@aBianca@bYou should take %a001210 along with you, %a000090. Make sure you give him a stroke from me every now and then.\n@c0@"
  es: "@aBianca@bDeberías llevarte a %a001210 contigo, %a000090. Dale una caricia de mi parte de vez en cuando, ¿me entiendes?\n@c0@"
  fr: "@aBianca@bTu devrais emmener %a001210 avec toi, %a000090. Fais-lui une caresse de ma part de temps en temps.\n@c0@"
  it: "@aBianca@bPorta %a001210 con te, %a000090.\nOgni tanto fagli una carezza da parte mia, mi raccomando!\n@c0@"
  ja: "@a@bビアンカ「%a001210ちゃんは\n\t%a000090が　連れて行ってね。\n\tわたしの分まで　かわいがってよ。\n@c0@"
62:
  de: "@aBianca@bDer Alte hat doch immer den gleichen Spruch drauf. Wir müssen ihn wirklich daran erinnern, wie er früher mal war.\n@c0@"
  en: "@aBianca@bThat's all that old bloke ever says. We must really remind him of how he used to be.\n@c0@"
  es: "@aBianca@bNo dice nada más que eso, pobre viejo. Tenemos que recordarle cómo era antes.\n@c0@"
  fr: "@aBianca@bCe vieux bonhomme répète tout le temps la même chose. On doit vraiment lui rappeler comment il était à l'époque.\n@c0@"
  it: "@aBianca@bQuando vedo un signore anziano mi riesce difficile pensare che, in passato, anch'egli è stato un bambino...\n@c0@"
  ja: "@a@bビアンカ「あのおじいさん\n\tいっつも　あればっかりだね。\n\tそんなに　似てるのかしら？\n@c0@"
63:
  de: "@aBianca@bWir haben doch bloß versucht, %a001210 zu retten. Woher hätten wir denn wissen sollen, dass das gleich so einen Wirbel gibt.\n@c0@"
  en: "@aBianca@bAll we were tryin' to do was save %a001210. You wouldn't have thought it'd cause such a fuss.\n@c0@"
  es: "@aBianca@bSolo queríamos salvar a %a001210. No entiendo por qué se ha armado tanto lío.\n@c0@"
  fr: "@aBianca@bTout ce qu'on a fait, c'est essayer de sauver %a001210. Qui aurait cru que ça ferait une telle histoireⓠ\n@c0@"
  it: "@aBianca@bMa noi volevamo solo salvare %a001210!\nChi poteva immaginare che avremmo suscitato tanto trambusto, eh?\n@c0@"
  ja: "@a@bビアンカ「%a001210ちゃんを\n\t助けようとしただけなのに\n\t大さわぎに　なっちゃったわね。\n@c0@"
64:
  de: "@aBianca@bEs ist gut, dass dein Papa seine Erkältung schon wieder losgeworden ist.\n@c0@"
  en: "@aBianca@bIt's good that your dad's got over his cold already.\n@c0@"
  es: "@aBianca@bQué bien que tu papá ya se haya curado del catarro.\n@c0@"
  fr: "@aBianca@bC'est bien que ton papa se soit déjà remis de son rhume.\n@c0@"
  it: "@aBianca@bSono felice che tuo papà sia guarito dal raffreddore.\n@c0@"
  ja: "@a@bビアンカ「パパスおじさま　\n\tカゼが　治ったみたいで\n\t良かったわね。\n@c0@"
65:
  de: "@aBianca@bAber ich wünschte, das würde nicht bedeuten, dass du heute heimkehrst. Wir beide hatten doch so viel Spaß zusammen.\n@c0@"
  en: "@aBianca@bBut I wish it didn't mean you have to go home today. We've bin havin' a good laugh together, you and me.\n@c0@"
  es: "@aBianca@bPero eso quiere decir que te vuelves a casa hoy, y me da pena, ¿sabes? Nos lo hemos pasado muy bien los dos.\n@c0@"
  fr: "@aBianca@bMais c'est dommage, parce que ça veut dire qu'il faut que tu t'en ailles. On s'est bien amusés, tous les deux.\n@c0@"
  it: "@aBianca@bPerò un po' mi dispiace, perché vuol dire che oggi tornerai a casa tua.\nCi siamo proprio divertiti insieme...\n@c0@"
  ja: "@a@bビアンカ「でも　今日じゅうに\n\t帰っちゃうなんて　さびしいな。\n\tせっかく　仲良くなれたのに。\n@c0@"
66:
  de: "@aBianca@bSieht ein bisschen komisch aus, aber für ein Kätzchen ist es trotzdem richtig niedlich.\n@c0@"
  en: "@aBianca@bIt's a little bit odd-lookin', but it's still quite cute as cats go.\n@c0@"
  es: "@aBianca@bParece un poco raro, pero es un gato bastante mono.\n@c0@"
  fr: "@aBianca@bIl a l'air un peu bizarre, mais c'est quand même\r\nun mignon petit chat.\n@c0@"
  it: "@aBianca@bPiù lo guardo, più mi sembra un gatto strano...\nPerò è così carino!\n@c0@"
  ja: "@a@bビアンカ「ちょっと　変わってるけど\n\tかわいい　ネコさんね。\n@c0@"
67:
  de: "@aBianca@bIch frage mich, warum hier am Eingang zum Schloss so viele Grabsteine sind.\n@c0@"
  en: "@aBianca@bI wonder why there are so many gravestones here at the entrance to the castle.\n@c0@"
  es: "@aBianca@bMe pregunto por qué habrá tantas lápidas a la entrada del castillo.\n@c0@"
  fr: "@aBianca@bJe me demande pourquoi il y a tant de pierres tombales ici, à l'entrée du château.\n@c0@"
  it: "@aBianca@bChissà perché ci sono tante lapidi qui all'ingresso del castello...\n@c0@"
  ja: "@a@bビアンカ「それにしても\n\tどうして　お城の入り口に\n\tこんなに　いっぱい　お墓があるの？\n@c0@"
68:
  de: "@aBianca@bIrgendwie gefällt mir das gar nicht.\n@c0@"
  en: "@aBianca@bI dun't much like the look of this.\n@c0@"
  es: "@aBianca@bEsto no me gusta, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe n'aime pas trop ça.\n@c0@"
  it: "@aBianca@bHo un brutto presentimento...\n@c0@"
  ja: "@a@bビアンカ「なんだか　いやな感じ……。\n@c0@"
69:
  de: "@aBianca@bDas ist ja seltsam! Wir haben doch in der Herberge im Inneren des Schlosses übernachtet.\n@c0@"
  en: "@aBianca@bThat's weird! Last thing I knew, we were stayin' at the inn inside the castle.\n@c0@"
  es: "@aBianca@b¡Qué raro! Lo último que recuerdo es que nos alojábamos en la posada dentro del castillo.\n@c0@"
  fr: "@aBianca@bC'est bizarreⓠ La dernière chose dont je me souviens, c'est qu'on dormait à l'auberge\ndu château.\n@c0@"
  it: "@aBianca@bEh?! Ma che cos'è successo?!\nNon eravamo nella locanda all'interno del castello?!\n@c0@"
  ja: "@a@bビアンカ「あれっ！？\n\tわたしたち　お城の宿屋に\n\tとまったはずなのに…。\n@c0@"
70:
  de: "@aBianca@bWie kommen wir denn plötzlich nach draußen? Das gefällt mir ganz und gar nicht!\n@c0@"
  en: "@aBianca@bSo how did we end up outside?\nI dun't like this one bit!\n@c0@"
  es: "@aBianca@b¿Cómo hemos salido de allí?\r\n¡Esto no me gusta ni un pelo!\n@c0@"
  fr: "@aBianca@bAlors comment on s'est retrouvés dehorsⓡ\nJe n'aime pas ça du toutⓠ\n@c0@"
  it: "@aBianca@bCome abbiamo fatto a ritrovarci qui fuori?\nQui c'è qualcosa che non va...\n@c0@"
  ja: "@a@bビアンカ「いつの間に\n\t外に　出ちゃったの？\n\t……もう　わけわかんないよ！\n@c0@"
71:
  de: "@aBianca@bSieht nicht so aus, als ob wir diese Tür aufkriegen würden. Dieses Schloss fällt langsam in sich zusammen. Hier kommt wohl keiner mehr hin.\n@c0@"
  en: "@aBianca@bIt dun't look like we're goin' to get that door open. This castle's fallin' to bits.\r\nI s'pose no one comes here no more.\n@c0@"
  es: "@aBianca@bCreo que no vamos a poder abrir esa puerta, ¿sabes? Este castillo se cae a pedazos.\r\nSupongo que ya nadie viene por aquí.\n@c0@"
  fr: "@aBianca@bJe ne crois pas qu'on réussira à ouvrir cette porte. Ce château tombe en ruines. Je suppose que plus personne n'y vient jamais.\n@c0@"
  it: "@aBianca@bNon credo che riusciremo mai ad aprire quella porta.\nIl castello è tutto in rovina.\nDev'essere disabitato da un pezzo...\n@c0@"
  ja: "@a@bビアンカ「あのドアも　開かないのね。\n\tお城も　すごく　ボロボロだし\n\tこんなところ　だれも　来ないのかな。\n@c0@"
72:
  de: "@aBianca@bMir läuft es eiskalt den Rücken runter. Pass ja auf, %a000090!\n@c0@"
  en: "@aBianca@bI've got a horrible cold feelin' up and down my spine. You be careful, okay, %a000090?\n@c0@"
  es: "@aBianca@bMe ha dado un escalofrío tremendo. Ten cuidado, ¿me entiendes, %a000090?\n@c0@"
  fr: "@aBianca@bÇa me donne des frissons dans le dos.\nSois très prudent, d'accord, %a000090ⓡ\n@c0@"
  it: "@aBianca@bQuesto posto mi piace poco...\nMi raccomando, facciamo attenzione.\n@c0@"
  ja: "@a@bビアンカ「なんだか　背中が\n\tゾクゾクするの…。\n\t%a000090　気をつけてね。\n@c0@"
73:
  de: "@aBianca@bHalt die Augen offen, %a000090, ja?\nIch hab bei diesem Ort ein schlechtes Gefühl.\n@c0@"
  en: "@aBianca@bKeep your eyes peeled, okay, %a000090?\nI've got a nasty feelin' about this place.\n@c0@"
  es: "@aBianca@bMantén los ojos bien abiertos, ¿de acuerdo, %a000090?\nEste sitio me da mala espina.\n@c0@"
  fr: "@aBianca@bOuvre grand les yeux, d'accord, %a000090ⓡ Cet endroit ne me dit rien qui vaille.\n@c0@"
  it: "@aBianca@bHo una strana sensazione...\nTieni gli occhi bene aperti, %a000090...\n@c0@"
  ja: "@a@bビアンカ「%a000090　気をつけてね。\n\tなんだか　いやな　感じがするの…。\n@c0@"
74:
  de: "@aBianca@b...!\n@c0@"
  en: "@aBianca@b.........!\n@c0@"
  es: "@aBianca@b¡...!\n@c0@"
  fr: "@aBianca@b.........ⓠ\n@c0@"
  it: "@aBianca@b...!\n@c0@"
  ja: "@a@bビアンカ「………！！\n@c0@"
75:
  de: "@aBianca@bIch hab's vorhin ein bisschen mit der Angst zu tun gekriegt, aber das ist alles nur Theater, schätz' ich.\n@c0@"
  en: "@aBianca@bI was a bit scared for a while back there, but it's all just show, I reckon.\n@c0@"
