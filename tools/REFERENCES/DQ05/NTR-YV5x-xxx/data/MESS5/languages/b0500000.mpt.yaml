  fr: "@aCandy@bⓥQu'ils ne font qu'en présager d'autresⓦⓡ\nQuel culotⓠ Il ferait mieux de se réjouir,\nau lieu de geindreⓠ\n@c0@"
  it: "@aAmandina@bChe razza di uccello del malaugurio!\nCerto che i guai sono finiti!\nCos'altro potrebbe succedere, eh?\n@c0@"
  ja: "@a@bベラ「よくないことの前兆だなんて\n\tあのおじいさん　おめでたい時に\n\tいやなこと言うわね。\n@c0@"
301:
  de: "@aZuckerchen@bDu bist tapfer, das stimmt. Und stark. Und schlau. Und nett. Und, und, und... Sind alle Menschen so wie du?\n@c0@"
  en: "@aHoney@bYou are brave, it's true. And strong. And clever. And nice. And, and, and... Are all humans like you?\n@c0@"
  es: "@aDulce@bEres valiente, es cierto. Y fuerte. Y listo. Y simpático. Y, y, y... Oye, ¿todos los humanos son como tú?\n@c0@"
  fr: "@aCandy@bC'est vrai que tu es courageux. Et fort. Et malin. Et gentil. Et, et, et... Est-ce que tous les humains\nsont comme toiⓡ\n@c0@"
  it: "@aAmandina@bSei coraggioso. E forte. E intelligente. E carino.\nOh, accidenti!\nPerché gli esseri umani non sono tutti come te?!\n@c0@"
  ja: "@a@bベラ「本当に　見かけによらず\n\t%a000090って　強いのよね。\n\t人間って　みんな　こうなのかしら？\n@c0@"
302:
  de: "@aZuckerchen@bDies ist unsere Welt, in der alle Feen leben. Du kommst aus der Menschenwelt. Und dann gibt's da noch die Unterwelt, in der die Monster leben.\n@c0@"
  en: "@aHoney@bThis is our world, where all the faeries live.\r\nYou come from the human world. And then there's the underworld, where the monsters live.\n@c0@"
  es: "@aDulce@bEste es nuestro mundo, donde vivimos todas las hadas.\n㈡\nTú vienes del mundo humano. Y luego está el inframundo, donde viven los monstruos.\n@c0@"
  fr: "@aCandy@bCeci est notre monde, là où vivent toutes les fées. Toi, tu viens du monde des humains. Et il y a aussi\r\nle monde souterrain, là où vivent les monstres.\n@c0@"
  it: "@aAmandina@bQuesto è il Regno delle Fate.\r\nTu, invece, vieni dal mondo degli esseri umani.\r\nE poi c'è il mondo sotterraneo, dove vivono i mostri.\n@c0@"
  ja: "@a@bベラ「この世には　今いる　妖精の世界と\n\tあなたが住む　人間の世界。\n\tそして　魔の世界があるそうよ。\n@c0@"
303:
  de: "@aZuckerchen@bWas? Wo die Unterwelt ist?\nTja, äh... Sie ist, äh... ich...\nSie ist... unterhalb! Ja, genau da!\n@c0@"
  en: "@aHoney@bWhat? Where is the underworld?\nWell, er......it's, er......I...\nIt's...underneath us! Yes, that's where it is!\n@c0@"
  es: "@aDulce@b¿Cómo? ¿Qué dónde está el inframundo?\r\nBueno, esto... Está en... ejem...\r\n¡D-debajo de nosotros! ¡Sí, ahí!\n@c0@"
  fr: "@aCandy@bCommentⓡ Où se trouve le monde souterrainⓡ\nEh bien, euh... il est, euh... il est... sous la terreⓠ\nOui, voilà où il estⓠ\n@c0@"
  it: "@aAmandina@bCosa? Dove si trova il mondo sotterraneo?\nOh, ma che razza di domande mi fai, eh?!\nIl mondo sotterraneo si trova sottoterra, no?!\n@c0@"
  ja: "@a@bベラ「えっ？　魔の世界は\n\tどこにあるかって？\n\t……………どこだろうね。\n@c0@"
304:
  de: "@aZuckerchen@b(Schluck) Ich wusste es. Marmela hat uns die ganze Zeit über beobachtet.\n@c0@"
  en: "@aHoney@b(gulp) I knew it. Treacle's been watching us the whole time.\n@c0@"
  es: "@aDulce@b(glup) Lo sabía. Miel nos ha estado vigilando todo el rato.\n@c0@"
  fr: "@aCandy@b(gloups) J'en étais sûre. Mélissa ne nous a pas quittés des yeux.\n@c0@"
  it: "@aAmandina@bLo sapevo.\nAdusya non ha smesso di tenerci d'occhio nemmeno per un istante.\n@c0@"
  ja: "@a@bベラ「うっ…　やっぱり　ポワンさま\n\tずっと　私たちのこと\n\tごらんになっていらっしゃったのね。\n@c0@"
305:
  de: "@aZuckerchen@bIch hab doch nichts angestellt, oder?\nOder was Schlimmes gesagt?\nOh nein. Ich wette, jetzt krieg' ich Ärger.\n@c0@"
  en: "@aHoney@bI didn't do anything silly, did I?\nOr say anything bad?\nOh, no. I bet I'm in trouble...\n@c0@"
  es: "@aDulce@bNo hice tonterías, ¿no?\r\nNi dije ninguna inconveniencia...\r\n¡Oh, no! Seguro que me he metido en un lío.\n@c0@"
  fr: "@aCandy@bJe n'ai pas fait de bêtises, disⓡ Et je n'ai rien dit\nde malⓡ Oh non. Je parie que je vais avoir des ennuis...\n@c0@"
  it: "@aAmandina@bNon ho combinato pasticci, vero? E non ho nemmeno detto niente di male, esatto? Uhm, non so perché, ma ho comunque la sensazione che finirò nei guai...\n@c0@"
  ja: "@a@bベラ「私　変なことしたり\n\t言ったりしなかったかしら…\n\tう～ん…　う～ん……。\n@c0@"
306:
  de: "@aZuckerchen@bEs tut mir leid, %a000090. Manche Feen mögen die Menschen nicht sonderlich.\n@c0@"
  en: "@aHoney@bI'm sorry, %a000090. Some faeries don't like humans very much.\n@c0@"
  es: "@aDulce@bLo siento, %a000090. A algunas hadas no les gustan los humanos.\n@c0@"
  fr: "@aCandy@bJe suis désolée, %a000090. Certaines fées n'aiment pas beaucoup les humains.\n@c0@"
  it: "@aAmandina@bMi dispiace, %a000090.\nGli esseri umani non godono di buona reputazione presso noi fate...\n@c0@"
  ja: "@a@bベラ「ゴメンね　%a000090。\n\t妖精の中には　人間を　あまり\n\t好きじゃない人もいるから……。\n@c0@"
307:
  de: "@aZuckerchen@bAber die werden ihre Meinung jetzt sicher ändern, wo du uns doch gerettet hast!\n@c0@"
  en: "@aHoney@bBut I'm sure they'll all feel differently now that you've saved the day!\n@c0@"
  es: "@aDulce@b¡Pero seguro que cambian de opinión ahora que nos has salvado!\n@c0@"
  fr: "@aCandy@bMais je suis sûre qu'elles vont changer d'avis, maintenant que tu nous as sauvéesⓠ\n@c0@"
  it: "@aAmandina@bMa ora che ci hai aiutate, sono sicura che molte di noi cambieranno idea!\n@c0@"
  ja: "@a@bベラ「でも　今回のことで\n\tそういう人も　人間のことを\n\t見直したと思うのよ。\n@c0@"
308:
  de: "@aZuckerchen@bIch kann den Frühling kaum erwarten!\nIch will all den hübschen Blüten dabei zusehen, wie sie in der warmen Brise um mich herum tanzen!\n@c0@"
  en: "@aHoney@bI can't wait for spring!\nI want to watch all the pretty blossoms dancing around me in the warm breeze!\n@c0@"
  es: "@aDulce@b¡Qué ganas tengo de que llegue la primavera!\r\n¡Quiero ver las flores bailar a mi alrededor, mecidas por la cálida brisa!\n@c0@"
  fr: "@aCandy@bJ'ai hâte de voir le printempsⓠ J'ai envie d'admirer toutes les jolies fleurs et de voir voler leurs pétales autour de moi dans la brise tièdeⓠ\n@c0@"
  it: "@aAmandina@bNon vedo l'ora che arrivi la primavera!\nVoglio essere circondata da fiori colorati che ondeggiano spinti da una brezza tiepida!\n@c0@"
  ja: "@a@bベラ「春は　もうすぐね。\n\t咲きほこる花に　\n\t早く　つつまれたいわ！\n@c0@"
309:
  de: "@aZuckerchen@bNur Marmela kann den Frühling herbeirufen. Sie muss den Frühlingsboten selbst blasen.\n@c0@"
  en: "@aHoney@bOnly Treacle can summon spring. She has to blow the Herald of Spring herself.\n@c0@"
  es: "@aDulce@bSolo Miel puede invocar la primavera. Tiene que soplar el Heraldo de la Primavera.\n@c0@"
  fr: "@aCandy@bSeule Mélissa peut invoquer le printemps. Elle doit souffler elle-même dans le Messager du Printemps.\n@c0@"
  it: "@aAmandina@bSolo Adusya è in grado di evocare la primavera.\nDev'essere lei a chiedere alla stagione tiepida di venire.\n@c0@"
  ja: "@a@bベラ「春をつげるには\n\tポワンさま自らが　フルートを\n\t吹かないと　ダメなの。\n@c0@"
310:
  de: "@aZuckerchen@bUnd mit dem ersten süßen Flötenton wird der Frühling ausbrechen!\n@c0@"
  en: "@aHoney@bAt the first sweet sound of the flute, spring will burst into life!\n@c0@"
  es: "@aDulce@b¡Al primer sonido de la flauta, la primavera cobrará vida!\n@c0@"
  fr: "@aCandy@bEt à la première note de flûte, le printemps se réveilleraⓠ\n@c0@"
  it: "@aAmandina@bLa primavera sboccerà non appena le prime note usciranno dal flauto!\n@c0@"
  ja: "@a@bベラ「ポワンさまが　音色を\n\t奏でられた瞬間\n\t春は　始まるのよ！\n@c0@"
311:
  de: "@aZuckerchen@bWir können den Frühlingsboten nicht ewig behalten, Dummerchen! Wir müssen ihn Marmela geben.\n@c0@"
  en: "@aHoney@bWe can't keep the Herald of Spring forever, silly! We've got to give it to Treacle.\n@c0@"
  es: "@aDulce@b¡No podemos quedarnos el Heraldo de la Primavera, tonto! Hay que dárselo a Miel.\n@c0@"
  fr: "@aCandy@bOn ne peut pas garder le Messager du Printemps pour nous, gros bêtaⓠ Il faut le donner à Mélissa.\n@c0@"
  it: "@aAmandina@bGuarda che non possiamo tenerci il Richiamo della Primavera per noi!\nDobbiamo consegnarlo ad Adusya, sciocchino!\n@c0@"
  ja: "@a@bベラ「さあ　%a000090\n\tフルートを　ポワンさまに…。\n@c0@"
312:
  de: "@aZuckerchen@bDer Schnee hört gar nicht mehr auf, weißt du.\nAber es müsste jetzt eigentlich schon Frühling sein. All die hübschen Blumen müssten aufblühen...\n@c0@"
  en: "@aHoney@bThe snow goes on and on forever, you know.\r\nBut really, it should be spring by now. All the pretty flowers should be bursting into life...\n@c0@"
  es: "@aDulce@bLa nieve no cesa... Pero, en realidad, ya debería ser primavera. Las florecillas deberían estar llenándolo todo de colores...\n@c0@"
  fr: "@aCandy@bLa neige s'éternise, tu sais. Pourtant, le printemps devrait déjà être là. Toutes les jolies fleurs devraient être en train d'éclore...\n@c0@"
  it: "@aAmandina@bLa neve continua a cadere senza sosta, eppure la primavera dovrebbe essere già qui. Chissà quanto dovremo attendere prima di veder sbocciare i fiori!\n@c0@"
  ja: "@a@bべラ「目の前にあるのは　一面の雪景色。\n\t本当なら　もうとっくに　春が来て\n\t花が　咲き乱れているはずなのに…。\n@c0@"
313:
  de: "@aZuckerchen@bDu bist aber sehr still.\nVermisst du dein Zuhause etwa schon?\n@c0@"
  en: "@aHoney@bYou're very quiet, aren't you?\nDo you miss your home already?\n@c0@"
  es: "@aDulce@bEstás muy callado, ¿no?\r\n¿Echas de menos tu hogar?\n@c0@"
  fr: "@aCandy@bTu es bien silencieux. Ta maison te manque déjàⓡ\n@c0@"
  it: "@aAmandina@bCome mai sei così silenzioso?\nSenti già nostalgia di casa?\n@c0@"
  ja: "@a@bベラ「あなたって　無口なのね。\n\tそれとも　帰りたいとか考えてる？\n@c0@"
314:
  de: "@aZuckerchen@bIch frage mich, ob wir es wohl schaffen werden, den Frühlingsboten zurückzuholen. Du bist doch so klein! Hi hi hi!\n@c0@"
  en: "@aHoney@bI wonder if we'll manage to get the Herald of Spring back. I mean, you're only small, aren't you? Tee hee hee!\n@c0@"
  es: "@aDulce@bMe pregunto si seremos capaces de recuperar el Heraldo de la Primavera. Es que, claro, eres pequeño, ¿no? ¡Ji, ji, ji!\n@c0@"
  fr: "@aCandy@bJe me demande si nous réussirons à récupérer le Messager du Printemps. C'est vrai, tu es encore petit, nonⓡ Ti-hi-hiⓠ\n@c0@"
  it: "@aAmandina@bChissà se riusciremo a ritrovare il Richiamo della Primavera... Non voglio certo offenderti, ma tu sei solo un bambino piccolo piccolo... Tee eh eh!\n@c0@"
  ja: "@a@bべラ「フルートを　取りもどすなんて\n\t私たちだけで　できるかしら。\n\tあなたは　とっても　小さいし…。\n@c0@"
315:
  de: "@aZuckerchen@bIch frage mich, wieso Marmela mich gebeten hat, dich zu begleiten... Vielleicht soll ich dich im Auge behalten.\n@c0@"
  en: "@aHoney@bI wonder why Treacle asked me to accompany you... I suppose she wants me to keep an eye on you.\n@c0@"
  es: "@aDulce@bMe pregunto por qué Miel me habrá pedido que te acompañe... Supongo que querrá que te tenga vigilado.\n@c0@"
  fr: "@aCandy@bJe me demande pourquoi Mélissa m'a demandé de t'accompagner... Je suppose qu'elle veut que je\r\ngarde un œil sur toi.\n@c0@"
  it: "@aAmandina@bMi chiedo come mai Adusya mi abbia chiesto di accompagnarti... Uhm, probabilmente vorrà che ti dia una mano in caso di necessità...\n@c0@"
  ja: "@a@bベラ「私を　おともにつけるなんて…\n\tこれって　%a000090を\n\t育てろってこと…？\n@c0@"
316:
  de: "@aZuckerchen@bSchließlich bist du nur ein kleiner Junge. Du brauchst jemanden, der ein bisschen älter ist und aufpasst, dass du keine Dummheiten anstellst... Mich eben!\n@c0@"
  en: "@aHoney@bYou're just a boy after all. You need someone a bit older to make sure you don't get into trouble. ...That's me!\n@c0@"
  es: "@aDulce@bAl fin y al cabo, no eres más que un chiquillo. Necesitas a alguien un poco mayor que te cuide para que no acabes metido en líos... ¡O sea, a mí!\n@c0@"
  fr: "@aCandy@bTu n'es qu'un petit garçon, après tout. Tu as besoin de quelqu'un d'un peu plus âgé pour s'assurer que tu ne t'attires pas d'ennuis... Et c'est moiⓠ\n@c0@"
  it: "@aAmandina@bDopotutto, sei solo un ragazzino, e hai bisogno di qualcuno che ti tenga lontano dai guai.\nIn altre parole, dovrò farti da balia! Tee eh eh!\n@c0@"
  ja: "@a@bベラ「子供って　どうやって\n\t育てたらいいの？？\n\tう～ん…　う～ん……。\n@c0@"
317:
  de: "@aZuckerchen@bEs ist etwas Besonderes an dir. Da bin ich mir ganz sicher. Wir Feen täuschen uns über solche Sachen nie, weißt du. Niemals.\n@c0@"
  en: "@aHoney@bThere's something special about you. I'm sure of it. We faeries are never wrong about things like that, you know. Never.\n@c0@"
  es: "@aDulce@bHay algo especial en ti, estoy segura. Las hadas nunca nos equivocamos en cosas como esa. Jamás.\n@c0@"
  fr: "@aCandy@bTu as quelque chose de spécial. J'en suis sûre.\r\nNous, les fées, nous ne nous trompons jamais\r\npour ce genre de choses, tu sais. Jamais.\n@c0@"
  it: "@aAmandina@bC'è qualcosa di speciale in te, ne sono certa.\r\nNoi fate sappiamo guardare nel cuore delle persone.\n@c0@"
  ja: "@a@bベラ「あなたって　けっこう\n\tすごい子のような　気がするわ。\n\t私の目に　狂いはなかったわね。\n@c0@"
318:
  de: "@aZuckerchen@bIm Winter ist es ja immer kalt, aber so kalt war's noch nie. Irgendwas stimmt da nicht...\n@c0@"
  en: "@aHoney@bIt's always cold in winter, but never this cold. Something's not right...\n@c0@"
  es: "@aDulce@bEn invierno siempre hace frío, pero no tanto. Hay algo que no va bien...\n@c0@"
  fr: "@aCandy@bIl fait toujours froid, en hiver, mais jamais autant que ça. Il y a quelque chose qui ne tourne pas rond...\n@c0@"
  it: "@aAmandina@bSi sa che in inverno fa freddo, ma qui si gela!\nC'è qualcosa che non va...\n@c0@"
  ja: "@a@bベラ「いつもなら　冬でも\n\tここまでは　寒くならないのに…\n\tなんだか　悪意を感じる寒さよね。\n@c0@"
319:
  de: "@aZuckerchen@bDas ist das erste Mal, dass ich auf so eine Erkundungstour gehe, also bin ich ein klein wenig nervös.\n@c0@"
  en: "@aHoney@bThis is the first time I've ever been exploring like this, so I'm feeling a little bit nervous.\n@c0@"
  es: "@aDulce@bNunca había salido a explorar de esta forma y estoy un poco nerviosa.\n@c0@"
  fr: "@aCandy@bC'est la première fois que je pars en expédition comme ça, alors je me sens un petit peu nerveuse.\n@c0@"
  it: "@aAmandina@bTi confesso che non mi era mai stato affidato un compito tanto delicato... Spero di essere all'altezza della situazione.\n@c0@"
  ja: "@a@bベラ「私　こんなふうに\n\t冒険するのは　初めてだから\n\tなんだか　きんちょうしちゃうわ。\n@c0@"
320:
  de: "@aZuckerchen@bIch weiß ja, dass es immer noch bitterkalt ist, aber ich fühle mich trotzdem, als wär's schon Frühling! Juchhu!\n@c0@"
  en: "@aHoney@bI know it's still freezing cold, but inside I feel like spring already! Yippee!\n@c0@"
  es: "@aDulce@b¡Ya sé que aún hace muchísimo frío, pero por dentro ya me siento como si fuese primavera! ¡Yupiii!\n@c0@"
  fr: "@aCandy@bJe sais qu'il gèle toujours, mais en moi, c'est déjà\nle printempsⓠ Youpiⓠ\n@c0@"
  it: "@aAmandina@bSo che fa ancora freddo, ma mi sento come se fosse già arrivata la primavera!\r\nEvviva! Tee eh eh!\n@c0@"
  ja: "@a@bベラ「まだ　寒いままだけど　気分は\n\tひと足先に　春　って感じ！\n@c0@"
321:
  de: "@aZuckerchen@bDu bist wirklich toll! Ich wette, dass du innen bis obenhin vollgestopft bist mit lauter magischem Krimskrams.\n@c0@"
  en: "@aHoney@bYou really are amazing! I bet that inside you're just full to the brim of special magic bits and bobs!\n@c0@"
  es: "@aDulce@b¡Eres asombroso, de verdad! ¡Seguro que por dentro estás repleto de piezas y cositas mágicas!\n@c0@"
  fr: "@aCandy@bTu es vraiment incroyableⓠ Je parie qu'à l'intérieur, tu es rempli de petits bouts de magieⓠ\n@c0@"
  it: "@aAmandina@bSei proprio un ometto in gamba, sai?\nSento che sei dotato di un potere unico, quasi magico...\n@c0@"
  ja: "@a@bベラ「あなたって　すごいわ！\n\t本当に　不思議なチカラを\n\t持っているみたい。\n@c0@"
322:
  de: "@aZuckerchen@bMarmela wartet bestimmt schon auf uns.\nWir müssen zurück nach Feenaue.\n@c0@"
  en: "@aHoney@bTreacle will be waiting for us.\nWe must get back to Faerie Lea.\n@c0@"
  es: "@aDulce@bMiel nos estará esperando.\r\nTenemos que volver a Hadavilla.\n@c0@"
  fr: "@aCandy@bMélissa doit nous attendre.\r\nIl faut retourner à Féeria.\n@c0@"
  it: "@aAmandina@bAdusya ci starà aspettando.\nDobbiamo tornare a Domus Fatae.\nSu, andiamo...\n@c0@"
  ja: "@a@bベラ「ポワンさまが\n\tきっと　お待ちだわ。\n\tさあ　妖精の村へ　急ぎましょう！\n@c0@"
323:
  de: "@aLudwig@bEs tut mir leid, dass ich dich im Schloss zurücklassen musste. Ich habe mir wegen Prinz Harry große Sorgen gemacht.\n@c0@"
  en: "@aPankraz@bI'm sorry I left you behind at the castle before.\r\nI was just so worried about Prince Harry.\n@c0@"
  es: "@aTeudis@bSiento haberte dejado atrás en el castillo.\r\nEstaba muy preocupado por el príncipe Froilán.\n@c0@"
  fr: "@aPetros@bJe suis désolé de t'avoir laissé seul au château,\r\ntout à l'heure. J'étais tellement inquiet pour\r\nle prince Harry.\n@c0@"
  it: "@aRussel@bMi dispiace di averti lasciato indietro al castello prima, ma ero preoccupato per il principe Robert.\n@c0@"
  ja: "@a@bパパス「ラインハットの城では\n\t気が急ぐあまり　おいていって\n\tすまなかったな。\n@c0@"
324:
  de: "@aLudwig@bIch übernehme dieses Mal die Nachhut, dann musst du dich nicht abmühen, mit mir Schritt zu halten.\n@c0@"
  en: "@aPankraz@bI'll take the rear this time, so you don't need to worry about keeping up with me.\n@c0@"
  es: "@aTeudis@bAhora voy yo atrás, para que no tengas que seguirme el paso.\n@c0@"
  fr: "@aPetros@bJe fermerai la marche, cette fois. Comme ça tu n'auras pas à essayer de me rattraper.\n@c0@"
  it: "@aRussel@bQuesta volta mi metterò alle tue spalle, così non dovrai preoccuparti di tenere il mio passo.\n@c0@"
  ja: "@a@bパパス「今度は　父さんが\n\tお前の後ろを　ついていくから\n\tはぐれる心配は　ないぞ。\n@c0@"
325:
  de: "@aLudwig@bWieso haben die den Prinzen entführt? Wenn es nur ums Lösegeld geht, würde mich mir weniger Sorgen machen, aber da bin ich nicht so sicher...\n@c0@"
  en: "@aPankraz@bWhy would they kidnap the Prince? If it was just for ransom money, I'd be less concerned, but I'm not so sure...\n@c0@"
  es: "@aTeudis@b¿Por qué raptarían al Príncipe? Si fuera solo cuestión de dinero no me preocuparía mucho, pero no estoy seguro.\n@c0@"
  fr: "@aPetros@bPourquoi enlever le princeⓡ S'il ne s'agissait que d'obtenir une rançon, ça me préoccuperait moins, mais je n'en suis pas si sûr...\n@c0@"
  it: "@aRussel@bPerché hanno rapito il Principe?\nNon sono sicuro che l'abbiano fatto per chiedere un riscatto a suo padre...\n@c0@"
  ja: "@a@bパパス「王子をさらうとは…\n\tただの身代金目的なら　いいのだが…\n\tあの時のようだと　やっかいだな。\n@c0@"
326:
  de: "@aLudwig@bIch fürchte um Prinz Harrys Leben. Wir dürfen keine Zeit verschwenden!\n@c0@"
  en: "@aPankraz@bI fear for Prince Harry's life. We can't afford to waste any time!\n@c0@"
  es: "@aTeudis@bTemo por la vida del príncipe Froilán. ¡No podemos perder ni un segundo!\n@c0@"
  fr: "@aPetros@bJe crains pour la vie du prince Harry.\nIl n'y a pas de temps à perdreⓠ\n@c0@"
  it: "@aRussel@bTemo che il principe Robert sia in pericolo di vita...\nNon c'è tempo da perdere!\n@c0@"
  ja: "@a@bパパス「ヘンリー王子の身が　心配だ。\n\t一刻も早く　王子を探し出さねばっ！\n@c0@"
327:
  de: "@aLudwig@bEs tut mir leid, %a000090. Ich war so damit beschäftigt, nach Prinz Harry zu suchen, dass ich dir nicht genug Aufmerksamkeit geschenkt habe.\n@c0@"
  en: "@aPankraz@bI'm sorry, %a000090. I was so focused on finding Prince Harry, I wasn't paying enough attention to you.\n@c0@"
  es: "@aTeudis@bLo siento, %a000090. Estaba tan centrado en encontrar al príncipe Froilán que no te presté suficiente atención.\n@c0@"
  fr: "@aPetros@bJe regrette, %a000090. J'étais tellement concentré sur le prince Harry que je n'ai pas fait assez attention à toi.\n@c0@"
  it: "@aRussel@bScusami, %a000090. Ero concentrato sulla scomparsa del principe Robert, e non ho avuto molto tempo per pensare a te...\n@c0@"
  ja: "@a@bパパス「すまん　急ぐあまり\n\tお前のことまで　気が回らなかった。\n@c0@"
328:
  de: "@aLudwig@bAber in solchen Krisenzeiten erwarte ich von dir, dass du auf dich selbst aufpasst. Das kannst du doch, oder, %a000090?\n@c0@"
  en: "@aPankraz@bBut in times of crisis like this, I need you to look after yourself. You can do that for me, can't you, %a000090?\n@c0@"
  es: "@aTeudis@bPero en momentos críticos como este tienes que cuidar de ti mismo. ¿Podrías hacerlo por mí, %a000090?\n@c0@"
  fr: "@aPetros@bMais dans des périodes de crise comme celle-ci, j'ai besoin que tu prennes soin de toi tout seul. Tu peux faire ça pour moi, n'est-ce pas, %a000090ⓡ\n@c0@"
  it: "@aRussel@bPurtroppo la situazione è complicata, e devo chiederti di badare a te stesso. Credi di esserne capace, %a000090?\n@c0@"
  ja: "@a@bパパス「今は　非常事態だ。\n\t自分の身は　自分で　守ってくれ。\n\tお前なら　できるな？\n@c0@"
329:
  de: "@aLudwig@bMonstern? Hm, das gefällt mir gar nicht.\nWir müssen den Prinzen schnellstens finden.\n@c0@"
  en: "@aPankraz@bA monster too? Hm, I don't like the sound of this.\nWe must find the Prince at once.\n@c0@"
  es: "@aTeudis@b¿Un monstruo también? Mmm, no me gusta nada esto.\r\nDebemos dar ya con el Príncipe.\n@c0@"
  fr: "@aPetros@bUn monstre ⓥaussiⓦⓡ Hum, je n'aime pas ça du tout.\nNous devons retrouver le prince au plus vite.\n@c0@"
  it: "@aRussel@bUhm, sento puzza di bruciato...\nDobbiamo trovare il Principe il prima possibile.\n@c0@"
  ja: "@a@bパパス「魔族だと？\n\t……胸さわぎがする。\n\t早く　王子を　見つけださねばっ！\n@c0@"
330:
  de: "@aLudwig@bArgh! Die Unverfrorenheit dieser Gauner! Wenn wir mehr Zeit hätten, würde ich ihnen eine kleine Lektion erteilen.\n@c0@"
  en: "@aPankraz@bArgh! The barefacedness of these thugs!\nIf we had more time, I'd teach them a lesson right now.\n@c0@"
  es: "@aTeudis@b¡Argh! ¡Qué desvergüenza la de estos matones!\r\nSi tuviera tiempo les daría una lección ahora mismo.\n@c0@"
  fr: "@aPetros@bGrrrⓠ Ces brutes, quelle insolenceⓠ Si nous avions plus de temps, je leur donnerais une bonne leçon.\n@c0@"
  it: "@aRussel@bHai sentito?! Quelli sono mercanti di schiavi! Ringrazino la dea che non ho tempo da perdere con loro, altrimenti li farei pentire di essere nati!\n@c0@"
  ja: "@a@bパパス「おのれ　ゆうかい犯どもめ！\n\t本来なら　この場で\n\t斬り捨ててくれるところだが……。\n@c0@"
331:
  de: "@aLudwig@bAber zuerst müssen wir Prinz Harry finden.\nKomm schon, %a000090, du gehst voran!\n@c0@"
  en: "@aPankraz@bBut we must find Prince Harry first.\nCome on, %a000090, you lead the way!\n@c0@"
  es: "@aTeudis@bPero antes hay que encontrar al príncipe Froilán.\n¡Vamos, %a000090, tú primero!\n@c0@"
  fr: "@aPetros@bMais nous devons d'abord trouver le prince Harry. Allez, %a000090, passe devantⓠ\n@c0@"
  it: "@aRussel@bAdesso dobbiamo pensare a trovare il principe Robert.\nCoraggio, %a000090!\n@c0@"
  ja: "@a@bパパス「とにかく　今は　ヘンリー王子を\n\t救い出すことが　先決だ。\n\t先を急ぐぞ　%a000090！\n@c0@"
332:
  de: "@aLudwig@bIch wusste es doch! Die Königliche Gemahlin hat etwas damit zu tun!\n@c0@"
  en: "@aPankraz@bI knew it! The Queen Consort was involved!\n@c0@"
  es: "@aTeudis@b¡Lo sabía! ¡La Reina Consorte estaba en el ajo!\n@c0@"
  fr: "@aPetros@bJ'en étais sûrⓠ La reine consort est mêlée à tout çaⓠ \n@c0@"
  it: "@aRussel@bÈ proprio come immaginavo!\nLa Regina Consorte è coinvolta nel rapimento del principe Robert!\n@c0@"
  ja: "@a@bパパス「く！　やはり\n\t王妃が　関わっていたか…。\n@c0@"
333:
  de: "@aLudwig@bDer König hat sich zu Recht Sorgen gemacht. Aber dass sich seine Befürchtungen auf diese Weise bewahrheiten!\n@c0@"
  en: "@aPankraz@bThe King was right to be worried. But what a way for his fears to be realised!\n@c0@"
  es: "@aTeudis@bEl Rey hacía bien en preocuparse. ¡Pero vaya modo de descubrirlo!\n@c0@"
  fr: "@aPetros@bLe roi avait raison d'être inquiet. Mais ses craintes se sont concrétisées d'une façon bien surprenanteⓠ\n@c0@"
  it: "@aRussel@bIl Re aveva ragione a essere preoccupato, ma penso che nemmeno lui sospettasse di avere accanto una persona così orribile!\n@c0@"
  ja: "@a@bパパス「王の心配が　このような形で\n\t現実になってしまうとは…。\n@c0@"
334:
  de: "@aLudwig@bOh ja. Ich wollte dich schon länger nach dem jungen Mann fragen, mit dem du dich in Steinach unterhalten hast, ehe wir nach Tifortu aufbrachen.\n@c0@"
  en: "@aPankraz@bOh, yes. I've been meaning to ask you about that young man you were talking to in Whealbrook before we left for Coburg.\n@c0@"
  es: "@aTeudis@b¡Oh, sí! Quería preguntarte acerca de ese joven con el que estuviste hablando en Arroyofrío, antes de salir hacia Trastámara.\n@c0@"
  fr: "@aPetros@bOh, oui. Je voulais te poser des questions à propos de ce jeune homme à qui tu as parlé à Ruycelieu, avant notre départ pour Cobourg.\n@c0@"
  it: "@aRussel@bSenti, volevo chiederti se conosci il nome del giovanotto con cui hai parlato a Valcava, prima che partissimo per Coburg...\n@c0@"
  ja: "@a@bパパス「そういえば\n\tラインハットに旅立つ前\n\t見知らぬ青年に　声をかけられたな。\n@c0@"
335:
  de: "@aLudwig@bAls ich mit ihm sprach, fragte er mich, wie unsere Reise voranging. Ich hatte den Eindruck, dass ich ihn schon mal gesehen habe. Ich weiß nur nicht wo.\n@c0@"
  en: "@aPankraz@bWhen I spoke to him, he asked how our travels were going. I felt like I recognised him, but\r\nI just can't put a name to his face.\n@c0@"
  es: "@aTeudis@bCuando hablé con él me preguntó cómo iban nuestros viajes. Me pareció reconocerlo, pero no he logrado ponerle nombre.\n@c0@"
  fr: "@aPetros@bQuand je lui ai parlé, il m'a demandé comment se passaient nos voyages.\n㈡\nJ'ai eu l'impression de le reconnaître, mais sans réussir à mettre un nom sur son visage.\n@c0@"
  it: "@aRussel@bQuando mi sono avvicinato a lui, mi ha chiesto dei nostri viaggi. Giurerei di conoscerlo, ma non riesco a ricordare come si chiama...\n@c0@"
  ja: "@a@bパパス「何やら　今回の旅について\n\tどうとか言っていたが\n\t彼は　何者だったのだろう？\n@c0@"
336:
  de: "@aLudwig@bIch mache mir Sorgen wegen Prinz Harry. Wir haben keine Zeit für müßige Plaudereien. Schnell, geh weiter.\n@c0@"
  en: "@aPankraz@bI'm worried about Prince Harry. There's no time to talk. Just keep moving.\n@c0@"
  es: "@aTeudis@bMe preocupa el príncipe Froilán. No hay tiempo para charlas, sigamos.\n@c0@"
  fr: "@aPetros@bJe suis très inquiet pour le prince Harry.\r\nNous n'avons pas le temps de bavarder.\r\nIl faut continuer à avancer.\n@c0@"
  it: "@aRussel@bScusami, ma questo non è il momento di parlare...\r\nSono molto preoccupato per il principe Robert.\r\nDobbiamo fare presto!\n@c0@"
  ja: "@a@bパパス「ヘンリー王子の身が　心配だ。\n\t立ち止まって　しゃべってないで\n\t先を急ぐぞ。\n@c0@"
337:
  de: "@aPrinz Harry@bMir... Mir gefällt dieser Ort nicht.\n@c0@"
  en: "@aPrince Harry@bI... I don't like this place...\n@c0@"
  es: "@aPríncipe Froilán@bNo-no me gusta este sitio...\n@c0@"
  fr: "@aPrince Harry@bJe... Je n'aime pas cet endroit...\n@c0@"
  it: "@aRobert@bQuesto posto non mi piace...\n@c0@"
  ja: "@a@bヘンリー「オレ…　オレ……。\n@c0@"
338:
  de: "@aPrinz Harry@bIch... Ich hoffe bloß, dass deinem Vater nichts passieren wird...\n@c0@"
  en: "@aPrince Harry@bI wonder if... I wonder if your father will be alright?\n@c0@"
  es: "@aPríncipe Froilán@bMe pregunto si... Me pregunto si tu padre estará bien.\n@c0@"
  fr: "@aPrince Harry@bJe me demande... Je me demande si ça ira,\r\npour ton père.\n@c0@"
  it: "@aRobert@bSpero che tuo padre stia bene...\n@c0@"
  ja: "@a@bヘンリー「お前の…　父さん……\n\t大丈夫…　かな。\n@c0@"
339:
  de: "@aPrinz Harry@bDein Vater hatte recht. Ich sollte wohl mit meinem Vater sprechen, wenn ich nach Tifortu zurückkehre.\n@c0@"
  en: "@aPrince Harry@bYour father was right. I suppose I ought to speak with Father when I get back to Coburg.\n@c0@"
  es: "@aPríncipe Froilán@bTu padre tiene razón. Debería hablar con el mío cuando vuelva a Trastámara.\n@c0@"
  fr: "@aPrince Harry@bTon père avait raison. Je crois que je devrais\r\nparler à Père quand nous serons rentrés à Cobourg.\n@c0@"
  it: "@aRobert@bIl tuo papà aveva ragione.\nDovrò parlare con mio padre quando farò ritorno a Coburg...\n@c0@"
  ja: "@a@bヘンリー「オレ…　あの人の言うとおり…\n\tちゃんと　親父と…　話してみるよ。\n@c0@"
340:
  de: "@aHarry@bIch habe ganz vergessen, es dir zu sagen: Als wir noch Sklaven waren, habe ich mal dieses T&T-Ticket gefunden.\n@c0@"
  en: "@aHarry@bI forgot to tell you, but I found this T 'n' T ticket during the time I was a slave.\n@c0@"
  es: "@aFroilán@bSe me olvidó decírtelo, pero durante el tiempo que pasé como esclavo encontré este boleto de T y T.\n@c0@"
  fr: "@aHarry@bJ'avais oublié de te dire que j'avais trouvé ce ticket de TNT quand nous étions esclaves.\n@c0@"
  it: "@aRobert@bA proposito!\nQuasi dimenticavo di dirti che trovai questo biglietto della Sorte, quando lavoravo come schiavo.\n@c0@"
  ja: "@a@bヘンリー「あ　そうだ　言い忘れたけど\n\tドレイにされてたとき\n\tすごろく券を　ひろったんだよ。\n@c0@"
341:
  de: "@aHarry@bFrüher hätte ich so was ja niemals aufbewahrt!\n@c0@"
  en: "@aHarry@bI would've thrown it away in the blink of an eye back in the old days!\n@c0@"
  es: "@aFroilán@b¡Y pensar que en los viejos tiempos lo hubiera tirado sin mirarlo siquiera!\n@c0@"
  fr: "@aHarry@bAvant mon enlèvement, je l'aurais\nimmédiatement jetéⓠ\n@c0@"
  it: "@aRobert@bSe mi fosse capitato tra le mani quando ero servito e riverito nel mio castello, lo avrei buttato via senza pensarci un attimo...\n@c0@"
  ja: "@a@bヘンリー「昔の　オレなら\n\tすぐ　捨てちまったんだけど……\n@c0@"
342:
  de: "@aHarry@bAber wer gar nichts hat, der klammert sich noch an jedes kleinste Fetzchen Papier.\n@c0@"
  en: "@aHarry@bBut you hang on to any little scrap of anything you come by when you have so little.\n@c0@"
  es: "@aFroilán@bPero cuando tienes tan poco te aferras a cualquier cosa, por pequeña que sea.\n@c0@"
  fr: "@aHarry@bMais quand on n'a presque rien, on s'accroche au moindre petit bout de quelque chose.\n@c0@"
  it: "@aRobert@bQuando non hai niente, però, anche la cosa più piccola e insignificante ti sembra un tesoro.\n@c0@"
  ja: "@a@bヘンリー「ドレイにされてからは\n\tなんでも　捨てるのが\n\tもったいなくてさ。　はっはっは。\n@c0@"
343:
  de: "@aHarry@bIch bin auch direkt hinter dir, %a000090! Wir ziehen das zusammen durch!\n@c0@"
  en: "@aHarry@bI'm right behind you too, %a000090! We'll do this together!\n@c0@"
  es: "@aFroilán@b¡Yo también estoy contigo, %a000090! ¡Lo haremos juntos!\n@c0@"
  fr: "@aHarry@bMoi aussi, je suis avec toi, %a000090ⓠ\nNous y arriverons, ensembleⓠ\n@c0@"
  it: "@aRobert@bSono con te, %a000090!\nCe la faremo!\n@c0@"
  ja: "@a@bヘンリー「%a000090　オレも　ついてる。\n\tふたりで　いっちょ　やってやろうぜ！\n@c0@"
344:
  de: "@aHarry@bEs sieht aus, als wollte Maria wirklich hierbleiben.\n@c0@"
  en: "@aHarry@bIt looks like Maria really is going to stay on here.\n@c0@"
  es: "@aFroilán@bParece que María se va a quedar de verdad aquí.\n@c0@"
  fr: "@aHarry@bOn dirait que Maria a vraiment l'intention de\r\nrester ici.\n@c0@"
  it: "@aRobert@bPare proprio che Maria non ci accompagnerà...\n@c0@"
  ja: "@a@bヘンリー「マリアさん　本当に\n\tここに　のこっちゃうんだな…。\n@c0@"
345:
  de: "@aHarry@bWas?! Was guckst du denn so, %a000090? Du bist doch bestimmt auch ein wenig traurig darüber, oder etwa nicht?\n@c0@"
  en: "@aHarry@bWhat!? Why are you looking at me like that, %a000090? You must feel a little sad about it too, right?\n@c0@"
  es: "@aFroilán@b¿Qué? ¿Por qué me miras así, %a000090? A ti también te apena un poco, ¿verdad?\n@c0@"
  fr: "@aHarry@bQuoiⓡⓐ Pourquoi tu me regardes comme ça, %a000090ⓡ Toi aussi, tu dois te sentir\nun peu triste, nonⓡ\n@c0@"
  it: "@aRobert@bPerché mi guardi con quella faccia, %a000090?\nTi dispiace che Maria non venga con noi, vero?\n@c0@"
  ja: "@a@bヘンリー「…な　なんだよ　%a000090\n\tそんな目で　オレを見て！\n\tお前だって　さみしいと思うだろ？\n@c0@"
346:
  de: "@aHarry@bWir können nur hoffen, dass wir sie eines Tages wiedersehen.\n@c0@"
  en: "@aHarry@bWe'll just have to hope we'll have the chance to meet up with her again one day.\n@c0@"
  es: "@aFroilán@bEspero que algún día nos volvamos a encontrar con ella.\n@c0@"
  fr: "@aHarry@bNous n'avons plus qu'à espérer avoir la chance\r\nde la revoir un jour.\n@c0@"
  it: "@aRobert@bSpero di poterla incontrare di nuovo, un giorno.\n@c0@"
  ja: "@a@bヘンリー「また　いつか\n\t会いたいよなあ。\n@c0@"
347:
  de: "@aHarry@bWie kannst du denn nur so gleichgültig tun? Ach, mir kann das ja egal sein.\n@c0@"
  en: "@aHarry@bHow can you be so cold? Oh well, it's no skin off my nose.\n@c0@"
  es: "@aFroilán@b¿Cómo puedes ser tan frío? Bueno, da igual.\n@c0@"
  fr: "@aHarry@bComment peux-tu être si froidⓡ Oh, et puis zut. Qu'est-ce que ça peut bien me faire...\n@c0@"
  it: "@aRobert@bNon ti dispiace?!\nMa hai un ghiacciolo al posto del cuore?!\nBah, sono affari tuoi...\n@c0@"
  ja: "@a@bヘンリー「お前って　つめたいなあ。\n\tまあ　そのほうが　オレにとっては\n\tつごうが　いっか！\n@c0@"
348:
  de: "@aHarry@bFortuna? Ich glaube, von dieser Stadt habe ich noch nie gehört.\n@c0@"
  en: "@aHarry@bFortuna? I don't think I've ever heard of such a town before.\n@c0@"
  es: "@aFroilán@b¿Fortuna? Creo que no he oído hablar nunca de ese sitio.\n@c0@"
  fr: "@aHarry@bBonaventureⓡ Je ne crois pas avoir jamais entendu parler de cette ville.\n@c0@"
  it: "@aRobert@bFortuna?\nNon credo di aver mai sentito parlare di questa città.\n@c0@"
  ja: "@a@bヘンリー「オラクルベリー？\n\tう～ん…　聞いたことのない町だなあ。\n@c0@"
349:
  de: "@aHarry@bIch brauche hier nur durch das Tor zu gehen und schon fühle ich mich entspannter.\n@c0@"
  en: "@aHarry@bJust walking back through the gate of this place makes me feel more relaxed.\n@c0@"
  es: "@aFroilán@bVolver aquí me hace sentir más relajado.\n@c0@"
  fr: "@aHarry@bLe simple fait de franchir de nouveau les portes\r\nde cet endroit me détend.\n@c0@"
  it: "@aRobert@bSono contento di essere tornato qui...\n@c0@"
  ja: "@a@bヘンリー「ここに来ると\n\tなんだか　ホッと安心するなあ。\n@c0@"
350:
  de: "@aHarry@bWie es Maria wohl geht? Wollen wir nicht reingehen und nach ihr sehen?\n@c0@"
  en: "@aHarry@bI wonder how Maria's getting along.\r\nShall we pop inside and see her?\n@c0@"
  es: "@aFroilán@bMe pregunto cómo le irá a María.\r\n¿Entramos a verla?\n@c0@"
  fr: "@aHarry@bJe me demande comment va Maria. Tu crois qu'on pourrait aller lui faire un petit coucouⓡ\n@c0@"
  it: "@aRobert@bChissà come sta Maria...\nChe ne diresti di andare a salutarla?\n@c0@"
  ja: "@a@bヘンリー「そういえば\n\tマリアさんは　どうしてるかな？\n\tちょっと　様子　見ていこうぜ。\n@c0@"
351:
  de: "@aHarry@bHast du mich hierher gebracht, damit ich mich besser fühle, %a000090?\n@c0@"
  en: "@aHarry@bDid you bring me here to make me feel better, %a000090?\n@c0@"
  es: "@aFroilán@b¿Me has traído aquí para hacerme sentir mejor, %a000090?\n@c0@"
  fr: "@aHarry@bTu m'as emmené ici pour que je me sente mieux, %a000090ⓡ\n@c0@"
  it: "@aRobert@bMi hai portato qui per farmi sentire meglio, %a000090?\n@c0@"
  ja: "@a@bヘンリー「%a000090　もしかして\n\tオレを　なぐさめてくれようと\n\tわざわざ　ここへ寄ってくれたのか？\n@c0@"
352:
  de: "@aHarry@bDas wäre doch wirklich nicht nötig gewesen! Aber ich danke dir!\n@c0@"
  en: "@aHarry@bYou didn't have to, really you didn't.\nBut thank you.\n@c0@"
  es: "@aFroilán@bNo tenías por qué, de verdad. Pero gracias.\n@c0@"
  fr: "@aHarry@bÇa n'était vraiment pas la peine, tu sais.\r\nMais merci quand même.\n@c0@"
  it: "@aRobert@bNon eri tenuto a farlo. Dico davvero.\nMa ti ringrazio comunque.\n@c0@"
  ja: "@a@bヘンリー「ありがとうよ。\n\tお前って　本当に　いいヤツだな。\n@c0@"
353:
  de: "@aHarry@bDas ist eine sehr eindrucksvolle Figur!\n@c0@"
  en: "@aHarry@bThat's quite an impressive statue!\n@c0@"
  es: "@aFroilán@b¡Es una estatua impresionante!\n@c0@"
  fr: "@aHarry@bCette statuette est très impressionnanteⓠ\n@c0@"
  it: "@aRobert@bQuella statuetta è bellissima!\n@c0@"
  ja: "@a@bヘンリー「へ～　けっこう　良くできた\n\t女神像だな。\n@c0@"
354:
  de: "@aHarry@bWir sollten sie stets bei uns tragen. Wahrscheinlich hat sie himmlische Kräfte.\n@c0@"
  en: "@aHarry@bWe should keep it with us all the time.\r\nIt probably has divine powers.\n@c0@"
  es: "@aFroilán@bDeberíamos llevarla con nosotros.\r\nProbablemente tenga poderes divinos.\n@c0@"
  fr: "@aHarry@bOn devrait la garder avec nous en permanence.\r\nElle possède sûrement des pouvoirs sacrés.\n@c0@"
  it: "@aRobert@bDovremmo portarla sempre con noi.\nProbabimente possiede dei poteri divini, o qualcosa del genere.\n@c0@"
  ja: "@a@bヘンリー「身につけてようかな。\n\tなんか　ごりやく　ありそうだぜ。\n@c0@"
355:
  de: "@aHarry@bEs ist schwer, sich vorzustellen, dass einer von uns ein guter Ehemann sein könnte, wo wir beide doch bis vor kurzem noch Sklaven waren!\n@c0@"
  en: "@aHarry@bIt's hard to imagine either of us as good husbands when you think we were both slaves until just recently!\n@c0@"
  es: "@aFroilán@b¡Cuesta imaginarnos como buenos maridos, cuando hasta hace poco éramos esclavos!\n@c0@"
  fr: "@aHarry@bDifficile de nous imaginer comme de bons maris quand on pense qu'on était encore esclaves il y a peuⓠ\n@c0@"
  it: "@aRobert@bDa schiavo a uomo sposato, eh?\nBeh, non è che cambi molto!\n㈡\nDopotutto, anche il matrimonio è una prigione dalla quale è difficile scappare!\nAh ah ah!\n@c0@"
  ja: "@a@bヘンリー「いい亭主になる　だなんて\n\tこの前まで　ドレイをやってた\n\tオレたちには　ピンとこないよな。\n@c0@"
356:
  de: "@aHarry@bAber wir wissen, wie elend man sich fühlt, wenn einem jemand Gewalt antut, also wären wir wenigstens nie so wie ihr brutaler Mann.\n@c0@"
  en: "@aHarry@bBut we know what it feels like to be miserable because of someone else's violence, so at least we'll never be like her brute of a husband.\n@c0@"
  es: "@aFroilán@bPero sabemos lo que es pasarlo mal y sufrir la violencia de otros, así que al menos nunca seremos unos maridos maltratadores.\n@c0@"
  fr: "@aHarry@bMais on sait ce que ça fait d'être malheureux à cause de la violence de quelqu'un d'autre, alors au moins, on ne ressemblera jamais à sa brute de mari.\n@c0@"
  it: "@aRobert@bScherzi a parte, abbiamo provato sulla nostra pelle cosa vuol dire essere maltrattati, e sono certo che saremo dei mariti buoni e comprensivi.\n@c0@"
  ja: "@a@bヘンリー「でも　オレたちは　暴力で\n\t押さえつけられる苦しみを知ってるから\n\tそんな亭主には　きっと　ならないぜ。\n@c0@"
357:
  de: "@aHarry@bWir wissen besser als die meisten, was es heißt zu leiden. Leicht hatten wir es ja bisher wirklich nicht.\n@c0@"
  en: "@aHarry@bWe know more about suffering than most, that's for sure. It's been a rocky ride for us so far.\n@c0@"
  es: "@aFroilán@bDesde luego, sabemos más del sufrimiento que la mayoría. Nuestra vida no ha sido nada fácil.\n@c0@"
  fr: "@aHarry@bCe qui est certain, c'est que nous savons mieux que d'autres ce qu'est la souffrance. Jusqu'à présent,\r\nle chemin a plutôt été semé d'embûches.\n@c0@"
  it: "@aRobert@bSì, è vero: sappiamo bene cosa sia la sofferenza.\nGli anni che abbiamo trascorso in schiavitù sono stati orribili... \n@c0@"
  ja: "@a@bヘンリー「まあ　オレも　お前も\n\t苦労だけは　人一倍してるよな。\n\tまさに　ハランバンジョウってやつさ。\n@c0@"
358:
  de: "@aHarry@bHm... Jetzt ist uns das Herz noch schwerer.\n@c0@"
  en: "@aHarry@bHuh... Now we have even more worry and sadness to be burdened with.\n@c0@"
  es: "@aFroilán@bUf... Más preocupaciones y tristezas todavía.\n@c0@"
  fr: "@aHarry@bPfff... Comme si on n'était pas déjà suffisamment tristes et inquiets...\n@c0@"
  it: "@aRobert@bOra abbiamo ancora più problemi di cui preoccuparci...\n@c0@"
  ja: "@a@bヘンリー「まったくなあ……\n\tオレも　%a000090も\n\tあらたな悲しみを　背負っちまったし。\n@c0@"
359:
  de: "@aHarry@bIch frage mich, warum Maria so einsam aussieht. Vielleicht deshalb, weil ich nicht in ihrer Nähe bin?\n@c0@"
  en: "@aHarry@bI wonder why Maria seems so lonely.\r\nMaybe it's because I'm not around.\n@c0@"
  es: "@aFroilán@bNo sé por qué María parece tan sola.\r\nQuizá sea porque no estoy yo.\n@c0@"
  fr: "@aHarry@bJe me demande pourquoi Maria a l'air si seule.\r\nC'est peut-être parce que je ne suis pas là.\n@c0@"
  it: "@aRobert@bChissà perché Maria si sente tanto sola...\nForse è perché non le sono accanto...?\n@c0@"
  ja: "@a@bヘンリー「マリアさんが　さみしそう？\n\tそれは　もしかして\n\tオレが　旅に出たから？\n@c0@"
360:
  de: "@aHarry@bÄhm, ach was, natürlich nicht. Das ist es bestimmt nicht. Wenn's doch nur so wäre...\n@c0@"
  en: "@aHarry@bEr, no, I'm sure that's not it.\nIf only it was, though...\n@c0@"
  es: "@aFroilán@bEjem, no, seguro que no es eso.\r\nPero ojalá...\n@c0@"
  fr: "@aHarry@bEuh, non. Ce n'est sûrement pas pour ça.\r\nC'est dommage, d'ailleurs...\n@c0@"
  it: "@aRobert@bSì, magari!\nSogna, Robert, sogna...!\n@c0@"
  ja: "@a@bヘンリー「……なんてな。\n\tそんなワケないよなあ。\n\tもし　そうなら　うれしいけどさ。\n@c0@"
361:
  de: "@aHarry@bHoffentlich hat Josef keinen Ärger gekriegt, weil er uns zur Flucht verholfen hat.\n@c0@"
  en: "@aHarry@bI hope Joshua didn't get into trouble for helping us to escape.\n@c0@"
  es: "@aFroilán@bEspero que Josué no se metiera en un lío por ayudarnos a escapar.\n@c0@"
  fr: "@aHarry@bJ'espère que Joshua n'a pas eu d'ennuis pour nous avoir aidés à fuir.\n@c0@"
  it: "@aRobert@bSpero che non abbiano scoperto che è stato Bonocore a farci scappare, altrimenti finirà nei guai.\n@c0@"
  ja: "@a@bヘンリー「オレたちを逃がしたことで\n\tマリアさんの兄さんが\n\t罪に問われてないか　心配だよな。\n@c0@"
362:
  de: "@aHarry@bIch wünschte nur, wir könnten irgendetwas tun. Ach! Ich fühle mich so hilflos!\n@c0@"
  en: "@aHarry@bI just wish there was something we could do. Argh! I feel so helpless!\n@c0@"
  es: "@aFroilán@bOjalá pudiéramos hacer algo. ¡Argh! ¡Me siento impotente!\n@c0@"
  fr: "@aHarry@bSi seulement on pouvait faire quelque chose.\nGrrrⓠ Je me sens si inutileⓠ\n@c0@"
  it: "@aRobert@bVorrei tanto poter fare qualcosa per lui...\nArgh! Mi sento così impotente!\n@c0@"
  ja: "@a@bヘンリー「でも　オレたちには\n\tどうすることもできない……。\n\tくそっ！　もどかしいぜ。\n@c0@"
363:
  de: "@aHarry@bSo lange ich ein Bett zum Schlafen habe, so lange bin ich zufrieden. Wir haben wieder einen langen Tag vor uns, %a000090!\n@c0@"
  en: "@aHarry@bAs long as I have a bed to sleep in, I'm happy. We've got another long day ahead of us, %a000090!\n@c0@"
  es: "@aFroilán@bYo me conformo con tener una cama donde dormir. ¡Tenemos otro largo día por delante, %a000090!\n@c0@"
  fr: "@aHarry@bDu moment que j'ai un lit pour dormir, je suis heureux. Une autre longue journée nous attend, %a000090ⓠ\n@c0@"
  it: "@aRobert@bAncora non mi sembra vero di essere tornato a dormire su un vero letto! Forza! Ci aspetta un'altra dura giornata, %a000090!\n@c0@"
  ja: "@a@bヘンリー「ベッドで\n\t寝られるってだけで　幸せだよな。\n\t%a000090　今日も　がんばろうぜ！\n@c0@"
364:
  de: "@aHarry@bNach dieser Rast fühle ich mich viel besser. Danke, %a000090.\n@c0@"
  en: "@aHarry@bI feel much better after that rest.\nThanks, %a000090.\n@c0@"
  es: "@aFroilán@bEl descanso me ha sentado fenomenal.\nGracias, %a000090.\n@c0@"
  fr: "@aHarry@bJe me sens beaucoup mieux après ce repos.\nMerci, %a000090.\n@c0@"
  it: "@aRobert@bAvevo proprio bisogno di riposare un po'...\n@c0@"
  ja: "@a@bヘンリー「ゆっくり　休んで\n\tけっこう　元気が出たよ。\n\t%a000090　ありがとうな。\n@c0@"
365:
  de: "@aHarry@bMal ehrlich, ich habe mich noch nicht ganz daran gewöhnt, wieder in einem Bett zu schlafen. Wahrscheinlich, weil ich so lange ein Sklave war.\n@c0@"
  en: "@aHarry@bTo tell you the truth, I'm still not quite used to sleeping in a bed again. I suppose it's because I was a slave for such a long time.\n@c0@"
  es: "@aFroilán@bPara serte sincero, aún no me he acostumbrado a dormir en una cama. Será por tanto tiempo de esclavitud.\n@c0@"
  fr: "@aHarry@bPour être honnête, je ne me suis pas encore tout\r\nà fait réhabitué à dormir dans un lit. C'est sans doute parce que j'ai été esclave très longtemps.\n@c0@"
  it: "@aRobert@bNon mi sono ancora riabituato a dormire su un letto. Dev'essere a causa degli anni trascorsi in schiavitù.\nEravamo costretti a stenderci per terra, ricordi?\n@c0@"
  ja: "@a@bヘンリー「ホント言うと　ドレイ生活が\n\t長かったせいか　まだちょっと\n\tベッドには　なれないんだよな。\n@c0@"
366:
  de: "@aHarry@bUm mich brauchst du dir keine Sorgen zu machen, %a000090. Gehen wir weiter.\n@c0@"
  en: "@aHarry@bYou don't need to worry about me, %a000090. Let's move on.\n@c0@"
  es: "@aFroilán@bNo te preocupes por mí, %a000090. Adelante.\n@c0@"
  fr: "@aHarry@bNe te fais pas de souci pour moi, %a000090.\nAllons-y.\n@c0@"
  it: "@aRobert@bNon devi preoccuparti per me, %a000090.\nDai, muoviamoci.\n@c0@"
  ja: "@a@bヘンリー「オレのことは\n\t気にしなくていいから　%a000090\n\t旅を　続けようぜ。\n@c0@"
367:
  de: "@aHarry@bWirklich merkwürdig, dass der Orden vom Zugzwang Kinder aus reichen und angesehenen Familien verschleppt hat.\n@c0@"
  en: "@aHarry@bThe Order of Zugzwang was so odd, kidnapping rich and high-class children like that.\n@c0@"
  es: "@aFroilán@bQué rara es la Orden de Zugzwang, mira que secuestrar niños ricos y de clase alta...\n@c0@"
  fr: "@aHarry@bL'Ordre du Zugzwang était tellement bizarre.\r\nQuelle drôle d'idée d'enlever les enfants des\r\nclasses aisées, comme ça.\n@c0@"
  it: "@aRobert@bNon ti sembra strano che la Setta di Zugzwang rapisca bambini appartenenti a famiglie altolocate ma non chieda un riscatto per la loro restituzione?\n@c0@"
  ja: "@a@bヘンリー「あの教団は　変だったよな。\n\t金持ちや身分のある子供を　中心に\n\tさらってドレイにしてたし…。\n@c0@"
368:
  de: "@aHarry@bKinder sind schwach. Die können doch kaum arbeiten. Also wozu das Ganze? Vielleicht, weil sie leichter zu beeinflussen sind?\n@c0@"
  en: "@aHarry@bChildren are too weak to be of any use, so what's the point? Maybe it's because they're easier to influence.\n@c0@"
  es: "@aFroilán@bLos niños son demasiado débiles, ¿qué sentido tiene? Quizá lo hagan porque son fáciles de influenciar.\n@c0@"
  fr: "@aHarry@bLes enfants sont trop faibles pour être d'une quelconque utilité, alors quel intérêtⓡ C'est\npeut-être parce qu'ils sont plus influençables.\n@c0@"
  it: "@aRobert@bI bambini sono troppo deboli per lavorare come schiavi, quindi perché lo fanno? Forse perché i piccoli sono più facilmente influenzabili?\n@c0@"
  ja: "@a@bヘンリー「そんな子供じゃ　力も弱くて\n\t役に立たないのに…。　言うことを\n\tきかせやすいと思ったのかな。\n@c0@"
369:
