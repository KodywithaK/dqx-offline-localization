  es: "@aFroilán@b¡No sabía que las chicas ricas venían aquí a recibir el curso de economía doméstica de la Diosa!\r\nMenuda perspectiva...\n@c0@"
  fr: "@aHarry@bJe n'avais pas réalisé que les jeunes filles riches venaient ici pour faire leur éducation domestique\r\net religieuse. Tu parles d'une contrainte.\n@c0@"
  it: "@aRobert@bNon sapevo che le famiglie ricche mandassero qui le loro figlie per far frequentare loro un corso di preparazione al matrimonio...\n@c0@"
  ja: "@a@bヘンリー「へえ～　お金持ちの\n\tおじょうさんって　こういうところで\n\t花嫁修業するんだ。　大変だなあ。\n@c0@"
370:
  de: "@aHarry@bHast du mich hierher gebracht, damit ich mich besser fühle, %a000090?\n@c0@"
