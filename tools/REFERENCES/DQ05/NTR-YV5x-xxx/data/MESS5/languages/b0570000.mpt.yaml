  ja: "@a@bデボラ「ここの男は　すぐに\n\tメソメソ　泣いてしまうのね。\n\tまあ　そこが　かわいいけど。\n@c0@"
484:
  de: "@aGriselda@bAber wir müssen jetzt los. Folge mir. Du sollst ja nicht zu spät kommen...\n@c0@"
  en: "@aDebora@bAnyway, it's time to go. You'd better follow me.\r\nYou don't want to be late.\n@c0@"
  es: "@aStefania@bEn todo caso, es hora de partire. Sígueme.\nNo debes llegar tarde, ¿capisci?\n@c0@"
  fr: "@aPandora@bEnfin, c'est l'heure d'y aller. Tu ferais bien de\r\nme suivre. Tu ne voudrais pas être en retard,\r\nquand même.\n@c0@"
  it: "@aViola@bSancho è una persona fredda e calcolatrice, un essere crudele e spietato che non si fa scrupoli davanti a niente e a nessuno.\n㈡\nPerò cerca di accattivarsi le simpatie altrui scoppiando a piangere per le sciocchezze più insensate.\n㈡\nSecondo me ha un piccolo rubinetto nascosto tra le sopracciglia, e lo aziona ogni volta che vuol far credere di essere commosso! Sì, dev'essere così...\n@c0@"
