  ja: "@a@bビアンカ「あら　今の女の人は\n\t伝説の勇者である　%a001240を\n\tステキって言ったのよ。\n@c0@"
204:
  de: "@aBianca@bDarum weiß ich auch gar nicht, was dieses entzückte Grinsen auf deinem Gesicht soll, %a000090!\n@c0@"
