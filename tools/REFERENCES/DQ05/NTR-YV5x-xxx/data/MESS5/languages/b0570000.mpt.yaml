  it: "@a%0%a001240@bPapà, promettimi che torneremo a trovarlo presto!\n@c0@"
  ja: "@a@b%a001240「ねえ　お父さん\n\tここに　遊びに来るときは\n\tボクもつれてきてねっ！\n@c0@"
451:
