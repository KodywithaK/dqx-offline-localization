  it: "@a%0%a001250@bPer fortuna hai fatto la scelta giusta!\n@c0@"
  ja: "@a@b%a001250「そうなの？\n\tねえ　そうなの？\n\tお父さん　どういうこと？\n@c0@"
226:
  de: "@aBianca@bÄhm, %a000090... Tut es dir manchmal leid, dass du damals mich genommen hast statt Nera?\n@c0@"
