  es: "@aStefania@b¡Toda la città está de fiesta!\nAdemás arman bastante jaleo, pero supongo que por una vez se lo permitiré.\n@c0@"
  fr: "@aPandora@bToute la ville se réjouitⓠ Et ils font un sacré boucan. Mais je crois que je vais les laisser tranquille, pour cette fois.\n@c0@"
  it: "@aViola@bGuarda come festeggiano...\nFanno bene a essere così entusiasti! La salvezza del mondo è un evento che va celebrato degnamente!\n@c0@"
  ja: "@a@bデボラ「町をあげての　お祭りさわぎね。\n\tものすごく　うるさいけど\n\t今日だけは　ガマンしてあげるわ。\n@c0@"
431:
  de: "@aNera@bAufregend? Sie hat ja keine Ahnung, wie aufregend ich das alles finde!\n@c0@"
