202:
  de: "@a%0%a001240@bLa la-la-lah... La la-la-lah...\nLa-di-dah-di-dah...\n@c0@"
  en: "@a%0%a001240@bLa la-la-lah... La la-la-lah...\nLa-di-dah-di-dah...\n@c0@"
  es: "@a%0%a001240@bLa la la la... La la la la...\nTra lará lará...\n@c0@"
  fr: "@a%0%a001240@bLa la-la-la... La la-la-la...\nLa-di-da-di-da...\n@c0@"
  it: "@a%0%a001240@bLa la la lah... Ⓠ\nLa la la la lah... Ⓠ\nLa la la la la la laaaaah... Ⓡ\n@c0@"
  ja: "@a@b%a001240「ラッタラ　ラッタラ\n\tランランラン。　あ　それっ！\n@c0@"
203:
  de: "@aBianca@bDas Mädchen ist wahrscheinlich völlig aus dem Häuschen wegen %a001240, was? Nun ja, schließlich ist er der legendäre Held.\n@c0@"
