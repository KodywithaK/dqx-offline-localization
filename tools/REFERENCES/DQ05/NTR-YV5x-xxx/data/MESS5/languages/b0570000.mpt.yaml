  it: "@aViola@bCandido è mio cognato.\nNon ci posso credere...\n@c0@"
  ja: "@a@bデボラ「ねえ　%a000090？\n\tいまさら　言うのも　なんだけど。\n@c0@"
439:
  de: "@aGriselda@bWenn du Nera zur Frau genommen hättest, wäre ich jetzt nicht mit Lothar verwandt!\n@c0@"
