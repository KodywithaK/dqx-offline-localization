  en: "@aNera@bIt's almost as if she, Debora and I...\n@c0@"
  es: "@aNera@bEs casi como si ella, Stefania e io...\n@c0@"
  fr: "@aNera@bC'est comme si elle, Pandora et moi...\n@c0@"
  it: "@aNera@bTi avrei capito se avessi deciso di sposare lei...\n@c0@"
  ja: "@a@bフローラ「もしかしたら　ビアンカさんも\n\t私や　姉さんと同じ……\n@c0@"
257:
  de: "@aNera@bNein, schon gut.\n@c0@"
  en: "@aNera@bNo, forget it.\n@c0@"
  es: "@aNera@bBah, déjalo.\n@c0@"
  fr: "@aNera@bNon, oublie ça.\n@c0@"
  it: "@aNera@bPer fortuna, però, hai scelto me come moglie.\nTi amo, %a000090.\n@c0@"
  ja: "@a@bフローラ「いえ…　なんでもありませんわ。\n@c0@"
258:
  de: "@aBianca@bHier ändert sich nie etwas, oder?\n@c0@"
  en: "@aBianca@bThis place never changes, eh?\n@c0@"
  es: "@aBianca@bEste sitio nunca cambia, ¿eh?\n@c0@"
  fr: "@aBianca@bCet endroit ne change pas, heinⓡ\n@c0@"
  it: "@aBianca@bQuesto posto è sempre uguale...\n@c0@"
  ja: "@a@bビアンカ「この村は\n\tいつ来ても　ちっとも\n\t変わらないわね……。\n@c0@"
259:
  de: "@aBianca@bWenn man das weiß, ist die Abwesenheit viel leichter zu ertragen. Ich weiß, wenn ich wieder zurückkomme, ist alles genau wie immer.\n@c0@"
  en: "@aBianca@bKnowin' that makes it easier to be away. I can be sure it'll be just the same whenever I come back.\n@c0@"
  es: "@aBianca@bSaber eso hace que sea más fácil estar lejos. Tengo la tranquilidad de que estará igual cuando vuelva.\n@c0@"
  fr: "@aBianca@bRemarque, c'est moins difficile pour moi de m'absenter, comme ça. Je suis sûre que tout\r\nsera à la même place quand je reviendrai.\n@c0@"
  it: "@aBianca@bÈ rassicurante sapere che, ogni volta che parto, al mio ritorno lo ritroverò esattamente come l'ho lasciato.\n@c0@"
  ja: "@a@bビアンカ「だから　私も\n\t安心して　この村を\n\tはなれられるんだけどね。\n@c0@"
260:
  de: "@aNera@bHier ist es so ruhig wie eh und je, aber trotzdem spürt man, dass alle gut aufgelegt sind.\n@c0@"
  en: "@aNera@bIt's as quiet as ever here, but you can still tell that everyone's in a good mood.\n@c0@"
  es: "@aNera@bEsto está tan tranquilo como sempre, ma se nota que todos están contentos.\n@c0@"
  fr: "@aNera@bC'est toujours aussi calme ici, mais on peut sentir que tout le monde est heureux.\n@c0@"
  it: "@aNera@bAprianuam è calma e tranquilla come al solito...\nSembra che nulla, nel bene e nel male, possa cambiare i ritmi e l'atmosfera di questo posto!\n@c0@"
  ja: "@a@bフローラ「ここは　あいかわらず\n\t静かですけど　みなさんの\n\tよろこびは　伝わってきますわね。\n@c0@"
261:
  de: "@a%0%a001240@bHier draußen dürfen wir doch richtig laut rufen, oder? Ich meine, weil hier weit und breit nichts ist.\n@c0@"
  en: "@a%0%a001240@bIt's okay to shout really loudly here, isn't it?\nBecause we're miles away from anywhere, I mean.\n@c0@"
  es: "@a%0%a001240@bAquí se puede gritar bien alto, ¿verdad?\nPorque estamos a kilómetros de cualquier parte.\n@c0@"
  fr: "@a%0%a001240@bJe peux crier très fort, ici, nonⓡ\nIl n'y a personne à des kilomètres à la ronde.\n@c0@"
  it: "@a%0%a001240@bPapà, posso gridare?\nTanto qui non mi sente nessuno...\n@c0@"
  ja: "@a@b%a001240「こんな山の中なら\n\t大きい声　出しても\n\t誰にも　しかられないよね？\n@c0@"
262:
  de: "@a%0%a001240@bHAAALLLOOOOOO!\nHach! Das hat gutgetan!\n@c0@"
  en: "@a%0%a001240@bHELLOOOOOOOO! Ah! That felt good!\n@c0@"
  es: "@a%0%a001240@b¡HOLAAAAAAA! ¡Ah! ¡Qué bien me ha sentado!\n@c0@"
  fr: "@a%0%a001240@bHÉÉÉÉ HOOOOOⓠ Ah, ça fait du bienⓠ\n@c0@"
  it: "@a%0%a001240@bWAAAAAAAAAHHH!\n...\nAh, era un pezzo che volevo farlo!\n@c0@"
  ja: "@a@b%a001240「やっほ～～～！\n\tう～ん…　気持ちいい～～！\n@c0@"
263:
  de: "@aBianca@bAlso, ich weiß ja nicht! Wir machen uns die ganze Mühe und retten die Welt, und das ist alles, was ihm dazu einfällt? So ein undankbarer alter Bettler!\n@c0@"
  en: "@aBianca@bI dunno! We go to all the trouble of savin' the world an' that's all he can say! Ungrateful old beggar!\n@c0@"
  es: "@aBianca@b¡No lo entiendo! ¿Es esa la mayor ventaja que le ve al hecho de que el mundo esté en paz?\n@c0@"
  fr: "@aBianca@bJe rêveⓠ Après le mal qu'on s'est donné pour sauver le monde, c'est tout ce qu'il trouve à direⓡ\nQuel vieil ingratⓠ\n@c0@"
  it: "@aBianca@bAh, quel tipo non cambierà mai...\n@c0@"
  ja: "@a@bビアンカ「やーねえ！　せっかく\n\t平和になったっていうのに\n\tそれしか　言うことはないのかしら？\n@c0@"
264:
  de: "@aNera@bHa ha ha. Tja, ich würde jedenfalls gern von Zeit zu Zeit hierherkommen. Das Baden in der Quelle ist so wohltuend.\n@c0@"
  en: "@aNera@bHa ha ha. Well I know I'd like to come to the baths here from time to time. The waters are so relaxing.\n@c0@"
  es: "@aNera@bJa, ja, ja. Va bene, a mí me gustaría venir aquí a los baños de vez en cuando. El agua es molto relajante.\n@c0@"
  fr: "@aNera@bHa ha ha. C'est vrai que j'aimerais bien venir prendre un bain ici de temps en temps. Les eaux sont si relaxantes.\n@c0@"
  it: "@aNera@bCaro, dobbiamo assolutamente tornare alle terme!\n@c0@"
  ja: "@a@bフローラ「うふふ　そうですわね。\n\tここの温泉は　気持ちいいし\n\t私も　たまに入りに来たいですわ。\n@c0@"
265:
  de: "@aNera@bWir sollten alle zusammen hierherkommen. Das wäre doch ein schöner Familienausflug.\n@c0@"
  en: "@aNera@bWe should all come together. It'd be a nice\r\nfamily outing.\n@c0@"
  es: "@aNera@bDeberíamos venir todos juntos. Sería una bonita excursión familiar.\n@c0@"
  fr: "@aNera@bOn devrait y venir en famille. Ce serait une sortie agréable.\n@c0@"
  it: "@aNera@bCon tutta la tensione che ho accumulato recentemente, la mia pelle si è disidratata!\n㈡\nHo bisogno di un luuungo bagno rilassante nelle salutari acque di Aprianuam!\n@c0@"
  ja: "@a@bフローラ「もちろん　家族みんなでね。\n@c0@"
266:
  de: "@a%0%a001240@bDer steckt aber noch voller Energie, oder? Ich hoffe, dass ich auch so rüstig bin, wenn ich sein Alter erreiche!\n@c0@"
  en: "@a%0%a001240@bHe's full of life isn't he! I hope I'm still going strong when I'm his age.\n@c0@"
  es: "@a%0%a001240@bDice que le va a dar algo.\n¿Crees que se encuentra bien?\nTanta jamona le habrá subido el colesterol.\n@c0@"
  fr: "@a%0%a001240@bIl a vraiment la pêche, ce papyⓠ J'espère que\nje serai aussi vaillant quand j'aurai son âge.\n@c0@"
  it: "@a%0%a001240@bSe ha paura che il suo cuore non regga alla vista delle ragazze potrebbe voltarsi dall'altra parte, no? Così risolverebbe il problema!\n@c0@"
  ja: "@a@b%a001240「あのおじいさん\n\t本気で　まいってるみたいだよ。\n\t助けてあげなくていいの？\n@c0@"
267:
  de: "@a%0%a001250@bOh, toll! Ich finde Baden klasse!\n@c0@"
  en: "@a%0%a001250@bGreat! I love baths!\n@c0@"
  es: "@a%0%a001250@b¡Genial! ¡Me encantan los baños!\n@c0@"
  fr: "@a%0%a001250@bSuperⓠ J'adore les bainsⓠ\n@c0@"
  it: "@a%0%a001250@bAnch'io voglio fare il bagno alle terme!\n@c0@"
  ja: "@a@b%a001250「わ～い　わ～い！\n\t温泉だ～！\n@c0@"
268:
  de: "@aBianca@bDer Alte ändert sich auch nicht mehr.\n@c0@"
  en: "@aBianca@bThat old bloke's always bin the same.\n@c0@"
  es: "@aBianca@bEse abuelete no cambia.\n@c0@"
  fr: "@aBianca@bIl n'a pas changé, ce papy.\n@c0@"
  it: "@aBianca@bBeh, se ha ancora voglia di guardare le donne, vuol dire che il piede nella fossa ancora non ce l'ha!\n@c0@"
  ja: "@a@bビアンカ「あのおじいさんって\n\t昔から　ああなのよね。\n@c0@"
269:
  de: "@aBianca@bRecht hat er.\nDie Bäder hier sind bei der Jugend ziemlich in Mode gekommen.\n@c0@"
  en: "@aBianca@bIt's good that he's got a bit of life in him, but he does go a bit far sometimes.\n@c0@"
  es: "@aBianca@bMe alegro de que aún le quede vida, pero a veces se pasa un poco, ¿sabes?\n@c0@"
  fr: "@aBianca@bC'est bien qu'il soit toujours aussi vif, mais parfois,\r\nil exagère un peu.\n@c0@"
  it: "@aBianca@bAnzi, forse è proprio il suo interesse per le belle ragazze a mantenerlo giovane, almeno nello spirito...\n@c0@"
  ja: "@a@bビアンカ「まあ　元気だから\n\tいいことなんだけど……。\n@c0@"
270:
  de: "@aNera@bSicher freut es ihn, wenn in Utensiel wieder ein bisschen mehr Leben herrscht.\n@c0@"
  en: "@aNera@bWell it's nice to see people staying young at heart, even when they're a bit ancient.\n@c0@"
  es: "@aNera@bBene, es bonito ver a gente joven de cuore, aunque sea un poco vieja.\n@c0@"
  fr: "@aNera@bC'est bien de voir les gens garder un esprit jeune même quand ils commencent à vieillir.\n@c0@"
  it: "@aNera@bIl lupo perde il pelo ma non il vizio, eh?\nAh, gli uomini...\n@c0@"
  ja: "@a@bフローラ「でも　いいことですわよね。\n\tとても　人生を楽しんで\n\tいらっしゃるような感じで……。\n@c0@"
271:
  de: "@a%0%a001240@bTja, dass alle für uns gebetet haben, hat uns schon geholfen, Nimzo zu besiegen, meinst du nicht?\n@c0@"
  en: "@a%0%a001240@bEveryone's prayers helped us to defeat Nimzo,\nI suppose, didn't they?\n@c0@"
  es: "@a%0%a001240@bSupongo que la plegarias de todos nos ayudaron a derrotar a Nimzo, ¿no?\n@c0@"
  fr: "@a%0%a001240@bC'est aussi grâce aux prières de tout le monde que nous avons pu vaincre Nimzo, nonⓡ\n@c0@"
  it: "@a%0%a001240@bCon tutto il rispetto, dubito che le preghiere di suo figlio da sole sarebbero bastate a salvare il mondo...\n@c0@"
  ja: "@a@b%a001240「ボクたちが\n\tミルドラースに勝てたのは\n\tみんなの祈りが　通じたからだよね。\n@c0@"
272:
  de: "@a%0%a001240@bDas muss der Mann wohl gemeint haben, als er sagte, wir hätten es seinem Jungen zu verdanken.\n@c0@"
  en: "@a%0%a001240@bThat's what that man must've meant when he said it's thanks to his boy.\n@c0@"
  es: "@a%0%a001240@bSerá eso lo que quería decir ese hombre cuando dijo que fue gracias a su hijo.\n@c0@"
  fr: "@a%0%a001240@bÇa doit être ce que ce monsieur avait en tête quand il a dit que c'était grâce à son fils.\n@c0@"
  it: "@a%0%a001240@bMagari avranno contribuito un po' ma, se non fosse stato per noi, oggi questo posto si chiamerebbe ⓕNimzolandiaⓖ...\n@c0@"
  ja: "@a@b%a001240「…ってことは\n\tあのおじさんが言ってることは\n\tまちがいじゃないんだ！\n@c0@"
273:
  de: "@aNera@bNa so was! Ich habe gar nicht damit gerechnet, dass jemand hier ist! Ach, ich verstehe. Er arbeitet für Herrn Weißner, nicht?\n@c0@"
  en: "@aNera@bWell I didn't expect to find anyone in a place like this! Oh, I see. He works for Mr Whitaker, does he?\n@c0@"
  es: "@aNera@bVeramente, no esperaba encontrar a nadie en un lugar así.\n¡Ah!, ya veo. Trabaja para el Sr. Doptada, ¿no?\n@c0@"
  fr: "@aNera@bJe ne m'attendais pas à trouver qui que ce soit\ndans un endroit pareilⓠ Oh, je vois. Il travaille\npour monsieur Alba, c'est çaⓡ\n@c0@"
  it: "@aNera@bNon mi ero accorta di quell'uomo...\n@c0@"
  ja: "@a@bフローラ「まあ　こんなところに人が？\n\t……そう　ビアンカさんの家の\n\tお仕事をなさっているのね。\n@c0@"
274:
  de: "@aBianca@bIch bin sicher, er wird bald jemand Nettes finden.\n@c0@"
  en: "@aBianca@bI'm sure he'll find someone nice before long.\n@c0@"
  es: "@aBianca@bSeguro encontrará pronto a alguien especial, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe suis sûre qu'il trouvera vite quelqu'un.\n@c0@"
  it: "@aBianca@bCaspita, che bel complimento!\nAvrei voluto fartelo io...!\n@c0@"
  ja: "@a@bビアンカ「あの人にも　きっと\n\tすぐに　いい人が現れるわよね。\n@c0@"
275:
  de: "@a%0%a001250@bMama...\n@c0@"
  en: "@a%0%a001250@bMum...\n@c0@"
  es: "@a%0%a001250@bMami...\n@c0@"
  fr: "@a%0%a001250@bMaman...\n@c0@"
  it: "@a%0%a001250@bMamma...\n@c0@"
  ja: "@a@b%a001250「お母さん……。\n@c0@"
276:
  de: "@aBianca@bHm? Was gibt's denn, %a001250?\n@c0@"
  en: "@aBianca@bHm? What's up, %a001250?\n@c0@"
  es: "@aBianca@b¿Mmm? ¿Qué pasa, %a001250?\n@c0@"
  fr: "@aBianca@bOuiⓡ Qu'est-ce qu'il y a, %a001250ⓡ\n@c0@"
  it: "@aBianca@bCosa c'è, %a001250?\n@c0@"
  ja: "@a@bビアンカ「ん？\n\tなあに　%a001250？\n@c0@"
277:
  de: "@a%0%a001250@bAch, nichts. Ich... Ich wollte nur sagen, ich hab dich lieb.\n@c0@"
  en: "@a%0%a001250@bOh, it's nothing. I just...\nI just wanted to say you're the best.\n@c0@"
  es: "@a%0%a001250@b¡Oh!, nada. Solo...\nSolo quería decirte que eres la mejor.\n@c0@"
  fr: "@a%0%a001250@bOh, rien. Je voulais juste...\nJe voulais juste te dire que tu es la meilleure.\n@c0@"
  it: "@a%0%a001250@bVolevo dirti che sei brutta.\n...\nEh eh eh! Scherzo! Sei la mamma più bella del mondo!\n@c0@"
  ja: "@a@b%a001250「…ううん。　なんでもないの。\n\tお母さん…　大好き。\n@c0@"
278:
  de: "@aBianca@bIch werd' nie deinen Gesichtsausdruck vergessen, als du mit diesem Schleier ankamst, %a000090.\n@c0@"
  en: "@aBianca@bI'll never forget the look on your face when you brought me that veil, %a000090.\n@c0@"
  es: "@aBianca@bNunca olvidaré la cara que tenías cuando me trajiste el velo, %a000090.\n@c0@"
  fr: "@aBianca@bJe n'oublierai jamais ton visage quand tu m'as apporté ce voile, %a000090.\n@c0@"
  it: "@aBianca@b%0%a000090, non dimenticherò mai l'espressione che avevi il giorno del nostro matrimonio...\n@c0@"
  ja: "@a@bビアンカ「%a000090が\n\tヴェールを　持ってきたときの顔\n\t今でも　忘れられないわ。\n@c0@"
279:
  de: "@aBianca@bAlles, was um uns herum geschah, kam mir wie ein unwirklicher Traum vor.\n@c0@"
  en: "@aBianca@bIt was like everythin' goin' on around us was some kind of unbelievable dream.\n@c0@"
  es: "@aBianca@bEra como si todo lo que nos ocurría fuera un sueño increíble, ¿sabes?\n@c0@"
  fr: "@aBianca@bC'est comme si tout ce qui nous arrivait était un rêve incroyable.\n@c0@"
  it: "@aBianca@bI tuoi occhi splendevano come non mai.\nEd eri così emozionato...\nAaahhh, che bei ricordi...!\n@c0@"
  ja: "@a@bビアンカ「なんだか　自分のまわりで\n\t起こってることが　夢みたいで\n\t信じられなかった……。\n@c0@"
280:
  de: "@aNera@bIch träume manchmal immer noch davon, wie du mir damals den Schleier gebracht hast, weißt du.\n@c0@"
  en: "@aNera@bI still dream about you bringing me my veil sometimes, you know.\n@c0@"
  es: "@aNera@bTodavía sueño contigo trayéndome el velo, caro mio.\n@c0@"
  fr: "@aNera@bParfois, dans mes rêves, je te vois encore m'apporter mon voile, tu sais.\n@c0@"
  it: "@aNera@bSogno ancora il momento in cui mi portasti il velo, sai?\n@c0@"
  ja: "@a@bフローラ「私　あなたが　ヴェールを\n\t持って来てくださった時のこと\n\tいまだに　夢に見ますのよ。\n@c0@"
281:
  de: "@aNera@bPapa hat so sehr darauf bestanden, nicht?\n@c0@"
  en: "@aNera@bPapa was so insistent about it, wasn't he?\n@c0@"
  es: "@aNera@bIl mio papino insistía tanto, ¿vero?\n@c0@"
  fr: "@aNera@bPapa y tenait tellement, heinⓡ\n@c0@"
  it: "@aNera@bCredo che quello sia stato l'attimo preciso in cui ho capito che non avrei più potuto fare a meno di te, tesoro mio...\n@c0@"
  ja: "@a@bフローラ「だって　あまりに\n\t父が　強引で……。\n\tうふふ。\n@c0@"
282:
  de: "@a%0%a001240@bWo er recht hat... .Aber ich finde, alle reden zu viel vom legendären Helden.\n@c0@"
  en: "@a%0%a001240@bIt wasn't just me, though. It's because everyone pulled together. That's how we all saved the world.\n@c0@"
  es: "@a%0%a001240@bPero no fui yo. Todos unimos nuestras fuerzas. Así fue como todos salvamos el mundo.\n@c0@"
  fr: "@a%0%a001240@bIl n'y avait pas que moi. Tout le monde y a mis\ndu sien. C'est comme ça qu'on a sauvé le monde.\n@c0@"
  it: "@a%0%a001240@bSì, sono il bambino che ha salvato il mondo.\nSono l'Eroe Leggendario.\n@c0@"
  ja: "@a@b%a001240「ボクだけじゃなくて\n\tみんなで　チカラを合わせたから\n\t世界を　救えたんだよ！\n@c0@"
283:
  de: "@a%0%a001240@bIch war's ja nicht allein. Alle haben zusammen an einem Strang gezogen. Nur so haben wir alle gemeinsam die Welt retten können.\n@c0@"
  en: "@a%0%a001240@bIt's not right just to say it was me who did everything. I don't want people to say that.\n@c0@"
  es: "@a%0%a001240@bNo es justo decir que lo hice yo todo. No quiero que la gente diga eso.\n@c0@"
  fr: "@a%0%a001240@bC'est pas juste de dire que c'est moi qui ai tout fait. Je ne veux pas que les gens disent ça.\n@c0@"
  it: "@a%0%a001240@bMa tu puoi chiamarmi %a001240.\nSai, non tengo alle formalità...\nEh eh eh eh eh!\n@c0@"
  ja: "@a@b%a001240「なのに　勇者がひとりで\n\t世界を救ったみたいに言われるの\n\tボクは　イヤだな……。\n@c0@"
284:
  de: "@a%0%a001250@bEs ist, als hätte sich die ganze Welt heute frei genommen!\n@c0@"
  en: "@a%0%a001250@bIt seems like the whole world is on holiday today!\n@c0@"
  es: "@a%0%a001250@b¡Parece que el mundo entero está hoy de vacaciones!\n@c0@"
  fr: "@a%0%a001250@bOn dirait que tout le monde est en vacances, aujourd'huiⓠ\n@c0@"
  it: "@a%0%a001250@bOggi tutto il mondo è in festa, eh?\n@c0@"
  ja: "@a@b%a001250「今日は　商売しない人が\n\tいっぱいね。\n@c0@"
285:
  de: "@a%0%a001240@bIch weiß gar nicht mehr, wann die Schwierigkeiten überhaupt begonnen haben. Ach, ist jetzt ja auch egal.\n㈡\nDie Welt lebt wieder im Frieden und wir brauchen uns keine Sorgen mehr zu machen.\n@c0@"
  en: "@a%0%a001240@bI wonder when all the troubles first started. Oh well, it doesn't matter now. The world's at peace, so we don't have to worry.\n@c0@"
  es: "@a%0%a001240@bMe pregunto dónde empezaron todos los problemas. Bueno, ahora ya no importa. El mundo está en paz, se acabaron las preocupaciones.\n@c0@"
  fr: "@a%0%a001240@bJe me demande quand tout a commencé exactement. En même temps, ce n'est pas très important. La paix est revenue, alors on n'a plus de souci à se faire.\n@c0@"
  it: "@a%0%a001240@bUhm, troppi complimenti...\nMi riesce sempre più difficile non montarmi la testa...\n@c0@"
  ja: "@a@b%a001240「平和じゃなくなったのは\n\tいつからだったんだろう。\n\tいっか。　平和になったんだもんね！\n@c0@"
286:
  de: "@a%0%a001240@bMeine Güte, die kreischt so laut, dass es auch bestimmt jeder mitkriegen muss. Ist das peinlich!\n@c0@"
  en: "@a%0%a001240@bShe's screeching so loudly, everyone can hear.\nIt's so embarrassing!\n@c0@"
  es: "@a%0%a001240@bEstá chillando tanto que todo el mundo la oye.\n¡Es bochornoso!\n@c0@"
  fr: "@a%0%a001240@bAvec une voix comme ça, tout le monde a dû l'entendre. C'est tellement embarrassantⓠ\n@c0@"
  it: "@a%0%a001240@bSanti numi...\nSento di essere diventato più rosso di un peperone...\n@c0@"
  ja: "@a@b%a001240「あんなに　大きい声出されたら\n\tボク　はずかしいよ……。\n@c0@"
287:
  de: "@a%0%a001240@bDann gibt's also hier auch ein Festmahl?\nMir hängt der Magen schon in den Kniekehlen!\n@c0@"
  en: "@a%0%a001240@bAre they going to have a feast here as well, then? I'm starting to get really hungry now, you know.\n@c0@"
  es: "@a%0%a001240@bEntonces, ¿aquí también van a celebrar un banquete? Porque empiezo a tener mucha hambre, ¿sabes?\n@c0@"
  fr: "@a%0%a001240@bIls vont aussi faire une fête, iciⓡ\nJe commence à avoir vraiment faim, tu sais.\n@c0@"
  it: "@a%0%a001240@bPapà, cosa credi che ci prepareranno a Denim per il banchetto di ringraziamento? Perché ci sarà un banchetto di ringraziamento, non è vero?!\n@c0@"
  ja: "@a@b%a001240「ここでも　ごちそう作るんだね。\n\tいいなあ。　ボクもう\n\tおなかが　ぺこぺこだよ。\n@c0@"
288:
  de: "@aBianca@bKann das stimmen? Das wäre ein ziemlicher Schock!\n@c0@"
  en: "@aBianca@bD'you think that's really true? It'd be quite a shock if it was.\n@c0@"
  es: "@aBianca@b¿Crees que eso es verdad? Me quedaría helada si lo fuera.\n@c0@"
  fr: "@aBianca@bTu crois que c'est vraiⓡ Ce serait vraiment un choc.\n@c0@"
  it: "@aBianca@bChe cosa?!\nNo, non è possibile...\n@c0@"
  ja: "@a@bビアンカ「今の話　本当かしらね……。\n\tもし本当だったら　ちょっと\n\tショックかな……。\n@c0@"
289:
  de: "@aBianca@bAch was, kann ja gar nicht sein.\n@c0@"
  en: "@aBianca@bNah, but there's no way it can be true.\n@c0@"
  es: "@aBianca@bNo, es imposible que sea verdad.\n@c0@"
  fr: "@aBianca@bNon, je suis sûre qu'il raconte n'importe quoi.\n@c0@"
  it: "@aBianca@bNon è vero.\nNon ci posso credere...\n@c0@"
  ja: "@a@bビアンカ「でも　そんなこと\n\tあるはずないわ。\n@c0@"
290:
  de: "@aBianca@bSo was hätten meine Eltern nicht all die Jahre vor mir geheim gehalten.\n@c0@"
  en: "@aBianca@bThere's no way Mum and Dad could've kept somethin' like that from me all them years.\n@c0@"
  es: "@aBianca@bEs imposible que mamá y papá me lo hayan ocultado todos estos años, ¿sabes?\n@c0@"
  fr: "@aBianca@bMaman et papa n'auraient pas pu me cacher ça pendant toutes ces années.\n@c0@"
  it: "@aBianca@bMa anche se fosse vero, non me ne importerebbe nulla. I miei genitori mi hanno sempre dato tutto l'affetto di cui ho avuto bisogno.\n㈡\nChe siano stati loro o meno a mettermi al mondo, è una cosa che per me non ha alcuna importanza.\n@c0@"
  ja: "@a@bビアンカ「だって　あの父さんと母さんが\n\t私に　ずっとウソを　つきとおすなんて\n\tできるはずないもの……。\n@c0@"
291:
  de: "@aNera@bWas? Bianca auch?\n@c0@"
  en: "@aNera@bWhat? Bianca too?\n@c0@"
  es: "@aNera@b¿Cómo? ¿Bianca también?\n@c0@"
  fr: "@aNera@bCommentⓡ Bianca aussiⓡ\n@c0@"
  it: "@aNera@bChe cosa?!\nNemmeno Bianca è stata cresciuta dai suoi genitori naturali?!\n@c0@"
  ja: "@a@bフローラ「えっ　ビアンカさんも……？\n@c0@"
292:
  de: "@aNera@b...\n@c0@"
  en: "@aNera@b............\n@c0@"
  es: "@aNera@b...\n@c0@"
  fr: "@aNera@b............\n@c0@"
  it: "@aNera@b...\n@c0@"
  ja: "@a@bフローラ「……………。\n@c0@"
293:
  de: "@aBianca@bMeine Güte! Das nenne ich eine herzliche Begrüßung, was?\n@c0@"
  en: "@aBianca@bWow! What a welcome home, eh?\n@c0@"
  es: "@aBianca@b¡Vaya! ¡Menuda bienvenida, eh?\n@c0@"
  fr: "@aBianca@bWaouhⓠ Quel accueil, heinⓡ\n@c0@"
  it: "@aBianca@bAccidenti!\nProprio un bentornato coi fiocchi, eh?!\n@c0@"
  ja: "@a@bビアンカ「わあ　すごい！\n\tみんな　集まっているのね。\n@c0@"
294:
  de: "@aNera@bOh, schau nur, Liebling! Alle haben sich versammelt, um uns zu Hause zu begrüßen.\n@c0@"
  en: "@aNera@bOh look, darling! Everyone's gathered to welcome\r\nus home.\n@c0@"
  es: "@aNera@b¡Oh, mira, caro! Se han reunido todos para recibirnos de vuelta a casa.\n@c0@"
  fr: "@aNera@bRegarde, mon chériⓠ Ils sont tous venus nous accueillir.\n@c0@"
  it: "@aNera@bGuarda, caro!\nChe accoglienza meravigliosa!\n@c0@"
  ja: "@a@bフローラ「あなた…\n\tみなさんが　集まってくださって……。\n@c0@"
295:
  de: "@a%0%a001240@bEs war überall viel los, egal wohin wir gekommen sind, aber Humburg setzt all dem wirklich die Krone auf!\n@c0@"
  en: "@a%0%a001240@bEverywhere we've been has been bustling, but nowhere else can compare to Gotha!\n@c0@"
  es: "@a%0%a001240@b¡En todos los sitios que hemos estado había bullicio, pero nada comparable a lo de Pankraz!\n@c0@"
  fr: "@a%0%a001240@bPartout où on est allés, c'était la fête, mais ce n'était rien comparé à Gotha.\n@c0@"
  it: "@a%0%a001240@bAbbiamo assistito a scene di entusiasmo in tutti i luoghi in cui siamo stati, ma vivere quest'atmosfera di giubilo a Denim è tutta un'altra cosa...\n@c0@"
  ja: "@a@b%a001240「どこも　にぎやかだったけど\n\tやっぱり　グランバニアが\n\tいちばん　にぎやかだよ！\n@c0@"
296:
  de: "@a%0%a001250@bNichts als fröhliche Mienen ringsumher! Was für eine fantastische Atmosphäre! Allerdings... riecht es ein bisschen wie in einer Brauerei.\n@c0@"
  en: "@a%0%a001250@bThere's not a single person who isn't smiling.\nWhat a fantastic atmosphere! Although...it does\nsmell a bit like a brewery.\n@c0@"
  es: "@a%0%a001250@bNo hay ni una persona que no esté sonriendo,\n¡Qué ambiente tan fantástico! Aunque... huele un poco a destilería.\n@c0@"
  fr: "@a%0%a001250@bIl n'y en a pas un qui ne sourit pas. Quelle ambiance génialeⓠ Mais... ça sent un peu comme dans une brasserie.\n@c0@"
  it: "@a%0%a001250@bC'è un'atmosfera fantastica!\nSono tutti pazzi di gioia!\n@c0@"
  ja: "@a@b%a001250「みんな　笑ってる。\n\tすごく楽しそう！\n\t……でも　お酒くさいね。\n@c0@"
297:
  de: "@aBianca@bJa, davonlaufen gilt nicht, %a000090. Ich weiß, dir ist das Ganze ziemlich peinlich, aber die Leute wollen dich nun mal sehen.\n@c0@"
  en: "@aBianca@bYeah, you can't run away, %a000090. I know this is all a bit embarrassin', but you've got to show your face.\n@c0@"
  es: "@aBianca@bSí, no puedes esconderte, %a000090. Ya sé que es un poco embarazoso, pero tienen que verte, ¿sabes?\n@c0@"
  fr: "@aBianca@bEh oui, tu ne peux pas y échapper, %a000090.\nJe sais que c'est un peu embarrassant,\nmais il va falloir que tu te montres.\n@c0@"
  it: "@aBianca@bSei la stella della festa, caro il mio %a000090...\nSo che sei un tipo di poche parole, ma spero che tu abbia preparato un bel discorsetto per i tuoi sudditi.\n@c0@"
  ja: "@a@bビアンカ「%a000090ったら\n\tいくら　照れくさいからって\n\t逃げちゃダメじゃない。\n@c0@"
298:
  de: "@aNera@bNa, na, nicht so schüchtern! So was, sich in einem solchen Moment davonschleichen zu wollen!\n@c0@"
  en: "@aNera@bAren't you the shy one? Fancy trying to slope off at a time like this!\n@c0@"
  es: "@aNera@bPero, ¡serás tímido! ¡Intentar escabullirte en un momento così!\n@c0@"
  fr: "@aNera@bOn fait le timideⓡ Tu ne crois pas que tu vas te défiler à un moment comme celui-làⓠ\n@c0@"
  it: "@aNera@b%0%a000090, ti aspettavi tanto entusiasmo?!\nA essere sincera, non credevo che i nostri sudditi ci avrebbero accolto così calorosamente!\n@c0@"
  ja: "@a@bフローラ「あなたって　おもしろいのね。\n\tこんなときに　ウケをねらったりして。\n@c0@"
299:
  de: "@a%0%a001240@bOtto! Den kann ich doch nachher noch besuchen, oder?\n@c0@"
  en: "@a%0%a001240@bTuppence! I can go and see him again later, can't I?\n@c0@"
  es: "@a%0%a001240@b¡Alazar! Puedo ir a verle después, ¿verdad?\n@c0@"
  fr: "@a%0%a001240@bInnocentⓠ Je pourrai aller le voir tout à l'heureⓡ\n@c0@"
  it: "@a%0%a001240@bEh eh eh!\nSimon è troppo forte!\n@c0@"
  ja: "@a@b%a001240「あっ　ピピンだ！\n\tあとで　遊んでもらおうっと！\n@c0@"
300:
  de: "@a%0%a001240@bWas ist denn bloß los mit den Erwachsenen?! Immer wenn's was zu feiern gibt, fangen sie an, komisch zu reden.\n@c0@"
  en: "@a%0%a001240@bWhat's wrong with grown-ups!? Every time something happens to celebrate, they start\ntalking funny.\n@c0@"
  es: "@a%0%a001240@b¿Qué pasa con los adultos? Cada vez que hay una celebración, empiezan a decir cosas raras.\n@c0@"
  fr: "@a%0%a001240@bIl y a un truc que je ne comprends pas chez les adultes. Chaque fois qu'ils fêtent quelque chose,\nils se mettent à parler bizarrement.\n@c0@"
  it: "@a%0%a001240@bPapà, diglielo che non hai intenzione di ripartire, così si tranquillizza!\n@c0@"
  ja: "@a@b%a001240「ホントにもう！\n\tおとなって　なにか理由つけては\n\tお酒ばっかり　飲むんだから！\n@c0@"
301:
  de: "@a%0%a001250@bBäh! Hat der 'ne Fahne!\n@c0@"
  en: "@a%0%a001250@bUrgh! What a stink!\n@c0@"
  es: "@a%0%a001250@b¡Agh! ¡Qué peste!\n@c0@"
  fr: "@a%0%a001250@bBeurkⓠ Qu'est-ce qu'il sent mauvaisⓠ\n@c0@"
  it: "@a%0%a001250@bMa no che non ripartiamo!\nOrmai il mondo è salvo!\n㈡\nAl limite andremo a fare una vacanza da qualche parte, ma giusto una settimana o due per rimetterci in sesto...\n@c0@"
  ja: "@a@b%a001250「う～っ…　お酒くさいの。\n@c0@"
302:
  de: "@aBianca@bHilda war uns eine große Hilfe, was? Wir müssen uns bei ihr noch richtig bedanken.\n@c0@"
  en: "@aBianca@bPatty's bin a big help to us, eh? We'll have to make sure we thank her prop'ly sometime.\n@c0@"
  es: "@aBianca@bCone-Cone ha sido de gran ayuda, ¿sabes? Tenemos que agradecérselo como se merece algún día.\n@c0@"
  fr: "@aBianca@bTulipe nous a bien aidés, heinⓡ Il faudra qu'on trouve un moyen de la remercier comme il faut.\n@c0@"
  it: "@aBianca@bGreta è stata un'aiutante preziosa.\nAnche lei ha fatto la sua parte in questa fantastica avventura...\n@c0@"
  ja: "@a@bビアンカ「ルイーダさんには\n\tいろいろ　お世話になったもの。\n\t今度　お礼をしなくちゃね。\n@c0@"
303:
  de: "@aNera@bTja, ich vermute, nun werden wohl keine geselligen Grüppchen mehr gebildet, was? Schade eigentlich.\n@c0@"
  en: "@aNera@bI suppose there'll be no more party planning now, will there? That's a bit sad.\n@c0@"
  es: "@aNera@bSupongo que ya no habrá que organizar più grupos, ¿vero? Es un poco triste.\n@c0@"
  fr: "@aNera@bJe suppose qu'on n'aura plus besoin de ses services dorénavantⓡ Je trouve ça un peu triste.\n@c0@"
  it: "@aNera@bE ora cosa farà Greta?\nVisto che non c'è più bisogno di organizzare gruppi, temo che dovrà cercarsi un altro lavoro...\n@c0@"
  ja: "@a@bフローラ「そうね…\n\tもう旅は　終わりですもの。\n\t……ちょっと　さびしいですけど。\n@c0@"
304:
  de: "@aBianca@bMöglich wär's. Wir werden jedenfalls alles dafür tun, dass es sich in Humburg noch besser leben lässt, als es sich Ludwig je hätte träumen lassen.\n@c0@"
  en: "@aBianca@bYeah, I reckon you could be. We'll make Gotha better than Pankraz ever dreamt.\n@c0@"
  es: "@aBianca@bSí, creo que podrías. Haremos de Pankraz un lugar mejor de lo que Teudis soñó.\n@c0@"
  fr: "@aBianca@bOui, c'est peut-être possible. Gotha sera encore mieux que tout ce que Petros aurait pu imaginer.\n@c0@"
  it: "@aBianca@bNon credo sia giusto dire che tu sia un sovrano migliore di quanto sia stato tuo padre, %a000090.\n@c0@"
  ja: "@a@bビアンカ「ええ。　お父さまに\n\t負けないように　グランバニアを\n\tりっぱな国に　していきましょうね。\n@c0@"
305:
  de: "@aBianca@bTja, wer keine Arbeit hat, macht sich welche, was, %a000090?\n@c0@"
  en: "@aBianca@bNo rest for the wicked, eh, %a000090?\n@c0@"
  es: "@aBianca@bNo daremos cuartel a los malvados, ¿verdad, %a000090?\n@c0@"
  fr: "@aBianca@bPas de répit pour la vermine, hein, %a000090ⓡ\n@c0@"
  it: "@aBianca@bAvete entrambi fatto molto per il Regno di Denim e per il mondo intero, mettendo a repentaglio la vostra vita più e più volte. Sono fiera di te, amore mio!\n@c0@"
  ja: "@a@bビアンカ「休むヒマなんて　なさそうよ。\n\t%a000090。\n@c0@"
306:
  de: "@aNera@bEin Riesenkompliment, Liebling, findest du nicht? Aber wohlverdient. Du hast so hart gearbeitet, um den Frieden zu bringen.\n@c0@"
  en: "@aNera@bThat's quite a compliment, isn't it, darling?\nBut it's well deserved. You've worked so hard to bring about peace.\n@c0@"
  es: "@aNera@bEs todo un cumplido, ¿verdad, caro?\nPero te lo mereces. Te has esforzado mucho para traer la pace.\n@c0@"
  fr: "@aNera@bC'est un sacré compliment, hein, mon chériⓡ Mais\nil est bien mérité. Tu t'es donné tellement de mal\npour ramener la paix.\n@c0@"
  it: "@aNera@bCaro, quell'uomo ti ha fatto un bellissimo complimento...\n@c0@"
  ja: "@a@bフローラ「おめでとう　あなた……。\n\tあんなふうに言ってもらえるのは\n\t全て　あなたが　がんばったからだわ。\n@c0@"
307:
  de: "@a%0%a001240@bNa, da werd' ich mich ja ganz schön anstrengen müssen, um da mithalten zu können!\n@c0@"
  en: "@a%0%a001240@bI've got a lot to live up to, haven't I?\n@c0@"
  es: "@a%0%a001240@bTengo una familia realmente especial, ¿verdad?\n@c0@"
  fr: "@a%0%a001240@bJe vais avoir du boulot pour être à la hauteur, moi.\n@c0@"
  it: "@a%0%a001240@bHo paura che dovrò lavorare parecchio, se vorrò essere all'altezza tua e di nonno Russel, eh?\n@c0@"
  ja: "@a@b%a001240「お父さんが　おじいちゃんを\n\tこえたように　ボクも\n\tもっと　しっかりしなくちゃな。\n@c0@"
308:
  de: "@a%0%a001250@bBisher hat der alte Mann immer nur im Bett gelegen, wenn ich ihn gesehen habe. Ich find's toll, dass er jetzt wieder auf den Beinen ist.\n@c0@"
  en: "@a%0%a001250@bThat old man's always been in bed whenever\nI've seen him before. It's great that he's up and about now.\n@c0@"
  es: "@a%0%a001250@bEse anciano estaba en cama siempre que lo veía. Me alegro de que ya pueda levantarse.\n@c0@"
  fr: "@a%0%a001250@bAvant, j'avais toujours vu ce vieux monsieur au lit. C'est super qu'il soit debout, maintenant.\n@c0@"
  it: "@a%0%a001250@bPapà, non credo che nonno Russel sia stato un sovrano meno capace di te.\nNon ti dispiace se te lo dico, vero?\n@c0@"
  ja: "@a@b%a001250「あの　いつも寝たきりだった\n\tおじいさんが　立ってる……。\n\tえへへ。　なんだか　うれしい。\n@c0@"
309:
  de: "@a%0%a001240@b%0%a001240 war zu stark... Heh heh heh! Klasse! Wenn's wer anders sagt, klingt's aber viel besser.\n@c0@"
  en: "@a%0%a001240@bⓗ%0%a001240 was too strongⓘ...\nHeh heh heh! Cool! It sounds better when someone else says it, though.\n@c0@"
  es: "@a%0%a001240@bⓕPero %a001240 era tan fuerte...ⓖ\n¡Je, je, je! ¡Genial! Pero suena mejor dicho por otra persona.\n@c0@"
  fr: "@a%0%a001240@b%0%a001240, bien plus puissant que lui...\nHé hé héⓠ Pas malⓠ J'aime bien quand c'est quelqu'un d'autre qui le dit.\n@c0@"
  it: "@a%0%a001240@bⓕMa il grande %a001240 lo massacròⓖ.\nMi piace questa strofa! Eh eh eh!\n㈡\nPerò non so cosa voglia dire ⓕpulcherrimoⓖ!\nNon sarà mica una parolaccia, eh?!\n@c0@"
  ja: "@a@b%a001240「えらいぞ　%a001240ー。\n\tえへへ…　自分で歌うと\n\tちょっと　テレるかも。\n@c0@"
310:
  de: "@a%0%a001250@bNimzo, der wilde Wüterich, war so grässlich widerlich... Nein, das war's nicht. Hach, ist das ein schwieriges Gedicht!\n@c0@"
  en: "@a%0%a001250@bThe foe sat on a swan... No, that's not right.\nOh, it's a really hard poem to remember.\n@c0@"
  es: "@a%0%a001250@bQue el ruin frenó en el puente... No, no era así.\n¡Oh!, es un poema muy difícil de recordar.\n@c0@"
  fr: "@a%0%a001250@bEut beau fait de rosser ce terrible ennemi...\nNon, c'est pas ça. Il est dur à retenir, ce poème.\n@c0@"
  it: "@a%0%a001250@bNon credevo che al mondo esistessero ancora persone che usano le parole ⓕpulcherrimoⓖ e ⓕspemeⓖ! Quel signore è davvero molto colto!\n㈡\nOppure molto vecchio!\nIh ih ih!\n@c0@"
  ja: "@a@b%a001250「われらが　伝説のー\n\tゆーうーしゃあー。　ラララー。\n\tう～　おぼえにくい歌……。\n@c0@"
311:
  de: "@aBianca@b%0%a001210 hat uns wirklich sehr geholfen, nicht?\n@c0@"
  en: "@aBianca@b%0%a001210's bin a big help to us, an' all, eh?\n@c0@"
  es: "@aBianca@b%0%a001210 ha sido de gran ayuda, ¿sabes?\n@c0@"
  fr: "@aBianca@b%0%a001210 nous a bien aidés, heinⓡ\n@c0@"
  it: "@aBianca@bOh, %a001210!\nCome avremmo fatto senza %a001210, eh?\n@c0@"
  ja: "@a@bビアンカ「%a001210も　今まで\n\tよく　がんばってくれたわね。\n\tえらかったわ。\n@c0@"
312:
  de: "@aNera@bSieh nur! %0%a001210 wirkt jetzt so ruhig.\n@c0@"
  en: "@aNera@bLook! %0%a001210 looks so calm now.\n@c0@"
  es: "@aNera@b¡Mira! %0%a001210 sembra muy tranquilo allora.\n@c0@"
  fr: "@aNera@bRegardeⓠ %0%a001210 semble si calme, maintenant.\n@c0@"
  it: "@aNera@bPapà, hai visto?\n%0%a001210 fa le fusa come un tenero micino...\n@c0@"
  ja: "@a@bフローラ「あなた　見て。\n\t%a001210ったら　あんなに\n\t平和そうな顔をして……。\n@c0@"
313:
  de: "@aBianca@bHast du das gehört? Hast du gehört, was er gesagt hat?\n@c0@"
  en: "@aBianca@bDid you hear that? Did you hear what he said?\n@c0@"
  es: "@aBianca@b¿Has oído eso? ¿Has oído lo que ha dicho?\n@c0@"
  fr: "@aBianca@bTu as entenduⓡ T'as entendu ce qu'il a ditⓡ\n@c0@"
  it: "@aBianca@bOh-oh!\nGrazie per il complimento!\n@c0@"
  ja: "@a@bビアンカ「ねえ　聞いた！？\n\t今の人の話　ちゃんと聞いた！？\n@c0@"
314:
  de: "@aBianca@bWenn nicht, solltest du gleich noch mal zu ihm gehen und ihn danach fragen!\n@c0@"
  en: "@aBianca@bIf you didn't, then you should go and talk to\r\nhim again!\n@c0@"
  es: "@aBianca@b¡Si no, deberías ir y volver a hablar con él!\n@c0@"
  fr: "@aBianca@bSi tu n'as pas entendu, tu devrais aller lui reparlerⓠ\n@c0@"
  it: "@aBianca@bHai sentito, %a000090?\nGli anni passano, ma ho sempre i miei ammiratori!\n@c0@"
  ja: "@a@bビアンカ「ちゃんと聞いてないなら\n\tもう一度　聞いてよ！\n@c0@"
315:
  de: "@aNera@bHör ihn dir nur an! Ooh! Da werde ich ja ganz rot!\n@c0@"
  en: "@aNera@bListen to him! Oh dear. Am I blushing?\n@c0@"
  es: "@aNera@b¡Escucha lo que dice! ¡Oh, mamma mia! ¿Me estoy sonrojando?\n@c0@"
  fr: "@aNera@bÉcoutez-leⓠ Par la Déesse... Je suis toute rougeⓡ\n@c0@"
  it: "@aNera@bTesoro, spero che anche tu pensi che io sono sempre più bella...\n@c0@"
  ja: "@a@bフローラ「まあ　あの方ったら。\n\tぽっ……。\n@c0@"
316:
  de: "@a%0%a001240@bNa endlich! Diesmal können wir doch mitfeiern und auch was essen, oder, Papa? Sag ja, bitte!\n@c0@"
  en: "@a%0%a001240@bFinally! We can actually join in and eat the food this time, right, Dad? We can, can't we?\n@c0@"
  es: "@a%0%a001240@b¡Por fin! Esta vez podemos apuntarnos y comer algo, ¿verdad, papá? Podemos, ¿no?\n@c0@"
  fr: "@a%0%a001240@bEnfinⓠ On peut participer à la fête et manger,\ncette fois, heinⓡ On peut, disⓡ\n@c0@"
  it: "@a%0%a001240@bUhm, che cosa ci sarà da mangiare?\nL'Eroe Leggendario ha una fame che non ci vede!\n@c0@"
  ja: "@a@b%a001240「やったあ！\n\t今度こそ　ボクたちが\n\t食べられるごちそうだよね？　ねっ！？\n@c0@"
317:
  de: "@aBianca@bIch kann's ihm nachfühlen, aber es mussten schließlich auch Leute hier bleiben und das Reich verteidigen, nicht?\n@c0@"
  en: "@aBianca@bI can understand how he feels, but we needed folk like him to stay here and protect this place, eh?\n@c0@"
  es: "@aBianca@bEntiendo cómo se siente, pero necesitábamos a gente como él que se quedara a proteger este lugar, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe comprends ce qu'il ressent, mais il fallait que des gens restent ici pour protéger le château.\n@c0@"
  it: "@aBianca@bCapisco che avrebbe voluto unirsi al nostro gruppo, ma era necessario che qualche uomo valido restasse a Denim, per garantire la protezione del castello...\n@c0@"
  ja: "@a@bビアンカ「気持ちは　わかるけど\n\tお城のほうも　守ってほしかったしね。\n@c0@"
318:
  de: "@aNera@bEs gibt einem solchen Auftrieb, dass alle uns unterstützt haben, nicht?\n@c0@"
  en: "@aNera@bIt's so nice to know we had everyone's support,\r\nisn't it?\n@c0@"
  es: "@aNera@bEs bonito saber que teníamos el apoyo de tutti, ¿vero?\n@c0@"
  fr: "@aNera@bQu'il est bon de voir que tout le monde nous soutenait.\n@c0@"
  it: "@aNera@bQuesta vittoria non è solo nostra, %a000090.\nTutti hanno fatto la loro parte, anche coloro che sono rimasti a proteggere il Castello di Denim.\n@c0@"
  ja: "@a@bフローラ「ありがたいわね。\n\t私たち　こうして　みんなに\n\tささえられていたんですわ……。\n@c0@"
319:
  de: "@a%0%a001240@bHurra! Hipp, hipp, hurra!\nNa komm schon, %a001250, mach mit!\n@c0@"
  en: "@a%0%a001240@bHurray! Hip-hip, hurray!\nCome on, %a001250, join in!\n@c0@"
  es: "@a%0%a001240@b¡Hurra! ¡Hip hip, hurra!\n¡Vamos, %a001250 únete!\n@c0@"
  fr: "@a%0%a001240@bHourraⓠ Hip, hip, hip, hourraⓠ\nAllez, %a001250, avec moiⓠ\n@c0@"
  it: "@a%0%a001240@bTre hurrà per il mio papà!\nHurrà! Hurrà! Hurrà!!!\nForza, %a001250! Fammi sentire la tua voce!\n@c0@"
  ja: "@a@b%a001240「ばんざーい！　ばんざーい！\n\tほら　%a001250も　いっしょに！\n@c0@"
320:
  de: "@a%0%a001250@bJa klar! Hurra! Juchhu! Hipp, hipp, hurra!\n@c0@"
  en: "@a%0%a001250@bOkay! Hurray! Yay! Hip-hip, hurray!\n@c0@"
  es: "@a%0%a001250@b¡Vale! ¡Hurra! ¡Bien! ¡Hip hip, hurra!\n@c0@"
  fr: "@a%0%a001250@bD'accordⓠ Hourraⓠ Hip, hip, hip, hourraⓠ\n@c0@"
  it: "@a%0%a001250@bTre hurrà per il mio papà!\nHurrà! Hurrà! Hurrà!!!\n@c0@"
  ja: "@a@b%a001250「うんっ！　ばんざーい！\n@c0@"
321:
  de: "@aBianca@bHoffentlich können jetzt alle Monster und Menschen in Frieden miteinander leben.\n@c0@"
  en: "@aBianca@bHopefully monsters and humans should all be able to live together in peace from now on.\n@c0@"
  es: "@aBianca@bEspero que monstruos y humanos sean capaces de vivir en paz a partir de ahora.\n@c0@"
  fr: "@aBianca@bJ'espère qu'à partir de maintenant, les monstres et les humains pourront vivre ensemble en paix.\n@c0@"
  it: "@aBianca@bSarebbe bellissimo se riuscissimo a vivere in armonia con i nostri amici mostri...\n@c0@"
  ja: "@a@bビアンカ「これからは　人間と\n\tモンスターが　ともに助け合って\n\t生きていく世界になるわね。\n@c0@"
322:
  de: "@aNera@bImmerhin ist es doch ein ermutigender Gedanke, dass uns sogar ein paar Monster geholfen haben, als es darauf ankam. \n@c0@"
  en: "@aNera@bIt's heartening to know that even some monsters helped us out in our hour of need, isn't it?\n@c0@"
  es: "@aNera@bEs alentador saber que hubo incluso monstruos que nos ayudaron cuando era necesario, ¿vero?\n@c0@"
  fr: "@aNera@bÇa fait chaud au cœur de se dire que des monstres nous ont aidés quand nous en avions besoin.\n@c0@"
  it: "@aNera@bAnche i mostri ci hanno dato una zamp...\nEhm, anche i mostri ci hanno dato una mano a sconfiggere il Gran Maestro degli Inferi.\n@c0@"
  ja: "@a@bフローラ「みんな　チカラを貸してくれて\n\tうれしかったわ。\n@c0@"
323:
  de: "@aNera@bWenn sie irgendwann mal in Schwierigkeiten stecken, können wir uns bei ihnen revanchieren.\n@c0@"
  en: "@aNera@bIf they're ever in trouble, it'll be our turn to\r\nhelp them.\n@c0@"
  es: "@aNera@bSi alguna vez tienen problemas, será il nostro turno de ayudarles.\n@c0@"
  fr: "@aNera@bSi un jour, ils ont des problèmes, ce sera à notre tour de les aider.\n@c0@"
  it: "@aNera@bSe un giorno fossero loro a essere in pericolo, sarebbe nostro dovere aiutarli.\n@c0@"
  ja: "@a@bフローラ「もし　今度　魔物さんたちが\n\tこまったときは　私たちが\n\tチカラを貸してあげましょうね。\n@c0@"
324:
  de: "@a%0%a001250@bSchau nur! Der Schleim ist genauso glücklich wie alle anderen.\n@c0@"
  en: "@a%0%a001250@bLook! The slime's as happy as everyone else.\n@c0@"
  es: "@a%0%a001250@b¡Mira! El limo está tan contento como los demás.\n@c0@"
  fr: "@a%0%a001250@bRegardeⓠ Ce gluant est aussi heureux que\ntout le monde.\n@c0@"
  it: "@a%0%a001250@bTutti quegli ⓕslurpⓖ significano che anche lo Slime è felicissimo!\n@c0@"
  ja: "@a@b%a001250「スライムさんも　よろこんでる。\n\tよかったね……。\n@c0@"
325:
  de: "@a%0%a001240@bHeißt das, wir werden Zenithia nicht mehr sehen können, wenn wir in den Himmel schauen? Ach... das ist aber schade.\n@c0@"
  en: "@a%0%a001240@bDoes that mean we won't be able to see Zenithia any more when we look up in the sky? Oh...\nThat's a shame.\n@c0@"
  es: "@a%0%a001240@bO sea, ¿que no volveremos a ver Zenithia cuando miremos al cielo? Oh...\n¡Qué pena!\n@c0@"
  fr: "@a%0%a001240@bEst-ce que ça veut dire qu'on ne pourra plus voir Zénithia quand on regardera dans le cielⓡ Oh...\nC'est dommage.\n@c0@"
  it: "@a%0%a001240@bChissà se ci capiterà mai di tornare a Zenithia...\nMi piacerebbe andare a salutare il Drago Divino ogni tanto...\n@c0@"
  ja: "@a@b%a001240「じゃあ　もう　地上から\n\t空を見上げても　天空城は見えないね。\n\tさみしいなあ……。\n@c0@"
326:
  de: "@aBianca@bWar dieser lustige Kerl wirklich der Zenithdrache? Ich bin ihm noch nie zuvor begegnet.\n@c0@"
  en: "@aBianca@bWas that funny character really the Zenith Dragon? I've never met him before.\n@c0@"
  es: "@aBianca@b¿Ese personaje tan gracioso era el Dragón de Zenithia? Nunca lo había visto.\n@c0@"
  fr: "@aBianca@bCe drôle de bonhomme était vraiment le Dragon du Zénithⓡ Je ne l'avais encore jamais vu.\n@c0@"
  it: "@aBianca@bChe cosa?!\nQuel tipo strampalato è il Drago di Zenithia in incognito?!\n@c0@"
  ja: "@a@bビアンカ「わ　私は　初めて見たけど…\n\t今の人が　マスタードラゴンなの？\n@c0@"
327:
  de: "@aBianca@bJetzt verstehe ich, warum bei den Zenithianern solche Aufregung herrschte.\n@c0@"
  en: "@aBianca@bNow I can see why the Zenithians were in such\r\na flap.\n@c0@"
  es: "@aBianca@bAhora entiendo por qué los de Zenithia estaban de los nervios, ¿sabes?\n@c0@"
  fr: "@aBianca@bMaintenant, je comprends pourquoi les Zénithiens étaient aussi paniqués.\n@c0@"
  it: "@aBianca@bMa va' là!\nRaccontala a un'altra!\nIo non la bevo!\n@c0@"
  ja: "@a@bビアンカ「天空の人たちが\n\tあんなに　あわててた意味が\n\tようやく　わかったわ……。\n@c0@"
328:
  de: "@aNera@bDas ist Dr. Ache? Ha ha ha. Was für ein lustiger Mann!\n@c0@"
  en: "@aNera@bThat's Dr Agon? Ha ha hah. What a funny man!\n@c0@"
  es: "@aNera@b¿Ese es el Dr. Agón? ¡Ja, ja, ja! ¡Que uomo más divertente!\n@c0@"
  fr: "@aNera@bC'est le Dr Agonⓡ\nHa ha haⓠ Qu'est-ce qu'il est drôleⓠ\n@c0@"
  it: "@aNera@bOh, quello è il Dottor Agon?\nSembra una persona simpatica...\n@c0@"
  ja: "@a@bフローラ「あの方が　プサンさん……？\n\tうふふ。　本当に　おもしろい方ね。\n@c0@"
329:
  de: "@a%0%a001240@bOh nein! Dr. Ache hat's wiedeli-wudeli-wieder getan!\n@c0@"
  en: "@a%0%a001240@bOh, no! Dr Agon's done-diddly-un it again!\n@c0@"
  es: "@a%0%a001240@b¡Oh, no! El Dr. Agón lo ha vuelto a hacer!\n@c0@"
  fr: "@a%0%a001240@bOh, le Dr Agonⓠ Nom d'une pipeⓠ\n@c0@"
  it: "@a%0%a001240@bToh!\nRiecco il Dottor Agon!\n@c0@"
  ja: "@a@b%a001240「あーあ。　プサンさん\n\tまた　やっちゃったよ。\n@c0@"
330:
  de: "@a%0%a001240@bWie kommt er denn nun nach Zenithia zurück? Jetzt sitzt er womöglich wieder hier fest, genau wie damals in der Großen Grube!\n@c0@"
  en: "@a%0%a001240@bHow's he going to get back to Zenithia?\nHe'll be stuck here now, just like he was in the Diggery Pokery!\n@c0@"
  es: "@a%0%a001240@b¿Cómo va a volver a Zenithia?\n¡Se quedará aquí atrapado, igual que en la Cava Excava!\n@c0@"
  fr: "@a%0%a001240@bComment il va faire pour repartir à Zénithiaⓡ\nIl va se retrouver bloqué ici comme il l'était\ndans la Vieille Mineⓠ\n@c0@"
  it: "@a%0%a001240@bQuasi quasi gli chiedo se mi porta con lui a Zenithia, quando deciderà di tornarci...\n@c0@"
  ja: "@a@b%a001240「これでまた　とうぶん\n\t天空城に　帰らないんだろうな……。\n@c0@"
331:
  de: "@a%0%a001250@bIch glaube fast, Dr. Ache wünscht sich, er wäre als Mensch geboren worden!\n@c0@"
  en: "@a%0%a001250@bI think maybe Dr Agon wishes he'd been born\na human.\n@c0@"
  es: "@a%0%a001250@bCreo que tal vez el Dr. Agón desearía haber nacido humano.\n@c0@"
  fr: "@a%0%a001250@bJe pense que le Dr Agon aurait bien aimé être humain.\n@c0@"
  it: "@a%0%a001250@bMa non sarà che il Dottor Agon preferisce vivere nel mondo degli uomini piuttosto che a Zenithia?!\nForse soffre anche lui di vertigini...\n@c0@"
  ja: "@a@b%a001250「プサンさん　ホントは\n\t人間に生まれたかったのかな……？\n@c0@"
332:
  de: "@aBianca@bSieht nicht so aus, als würde er sich in nächster Zeit von hier fortrühren.\n@c0@"
  en: "@aBianca@bLooks like he en't budgin' out the way any time soon.\n@c0@"
  es: "@aBianca@bNo parece que vaya a quitarse del medio pronto.\n@c0@"
  fr: "@aBianca@bDans son état, il n'est pas près de nous laisser passer.\n@c0@"
  it: "@aBianca@bNon ho nessuna voglia di rimettermi in viaggio, %a000090.\n@c0@"
  ja: "@a@bビアンカ「あら　この先は\n\t通してもらえないみたいね。\n@c0@"
333:
  de: "@aBianca@bKehren wir einfach um. In seinem Zustand sollten wir uns nicht mit ihm anlegen.\n@c0@"
  en: "@aBianca@bWe'll just have to turn back. You don't want to mess with a bloke in his state.\n@c0@"
  es: "@aBianca@bTendremos que dar la vuelta. Mejor no tener problemas con alguien en su estado.\n@c0@"
  fr: "@aBianca@bOn va simplement faire demi-tour. Il vaut mieux le laisser tranquille.\n@c0@"
  it: "@aBianca@bTutto ciò che desidero è stare al castello con te, %a001250 e %a001240, e dedicarvi tutto il mio tempo e il mio amore...\n@c0@"
  ja: "@a@bビアンカ「しかたないわ　もどりましょ。\n\t酔っぱらってる人には\n\tさからっちゃ　いけないのよ。\n@c0@"
334:
  de: "@a%0%a001240@bNa schön, ich kapiere ja, dass er glücklich ist, aber wir würden gern vorbei.\n@c0@"
  en: "@a%0%a001240@bOkay, I get that he's happy, but we want to get past.\n@c0@"
  es: "@a%0%a001240@bVale, comprendo que está feliz, pero queremos pasar.\n@c0@"
  fr: "@a%0%a001240@bJ'ai bien compris que c'était le plus beau jour de sa vie, mais on voudrait passer.\n@c0@"
  it: "@a%0%a001240@bUhm, no.\nDirei che non abbiamo nessuna intenzione di ripartire.\n@c0@"
  ja: "@a@b%a001240「うれしいのは　わかったから\n\tここ　通してほしいなあ……。\n@c0@"
335:
  de: "@a%0%a001250@bDanke, kleine Bestie. Ohne dich hätten wir es nie geschafft. Braves Monster! Gaaanz liebes Monster!\n@c0@"
  en: "@a%0%a001250@bThank you, little beast. We couldn't have done it without you. You're a good boy, aren't you?\nYes. Good boy, good boy.\n@c0@"
  es: "@a%0%a001250@bGracias, bichi. No habríamos podido hacerlo sin ti. Eres un buen chico, ¿a que sí?\nSí. Buen chico, buen chico.\n@c0@"
  fr: "@a%0%a001250@bMerci, petit monstre. On n'y serait pas arrivés sans toi. C'est bien. Tu es un bon monstre. Tu le sais çaⓡ\n@c0@"
  it: "@a%0%a001250@bGrazie anche a te! Il tuo aiuto è stato prezioso!\nMangia tutto quello che vuoi: te lo sei proprio meritato!\n@c0@"
  ja: "@a@b%a001250「魔物さん　ありがとうね。\n\tいい子　いい子。\n@c0@"
336:
  de: "@a%0%a001240@bHa ha! Ein schüchternes Monster! Deine Monster sind alle so niedlich, Papa!\n@c0@"
  en: "@a%0%a001240@bHa ha! A shy monster! Your monsters are all so\ncute, Dad!\n@c0@"
  es: "@a%0%a001240@b¡Ja, ja! ¡Un monstruo tímido! ¡Qué tiernos son tus monstruos, papá!\n@c0@"
  fr: "@a%0%a001240@bHa haⓠ Un monstre timideⓠ Tes monstres sont vraiment trop mignons, papaⓠ\n@c0@"
  it: "@a%0%a001240@bAh ah ah!\nMi sa che è la prima volta che si trova in una situazione del genere!\n@c0@"
  ja: "@a@b%a001240「魔物も　照れるんだね。\n\tお父さんの魔物って\n\tホントに　かわいいや！\n@c0@"
337:
  de: "@aBianca@bJa, wir sollten uns besser beeilen, in den Thronsaal zu kommen.\n@c0@"
  en: "@aBianca@bYeah, we'd better hurry up and get to the\r\nthrone room.\n@c0@"
  es: "@aBianca@bSí, tenemos que darnos prisa en llegar a la sala del trono.\n@c0@"
  fr: "@aBianca@bEh bien, on a intérêt à se dépêcher d'aller à la salle du trône.\n@c0@"
  it: "@aBianca@bForza, andiamo nella sala del trono.\n@c0@"
  ja: "@a@bビアンカ「そうね。　%a000090\n\t王の間に　急ぎましょう。\n@c0@"
338:
  de: "@aBianca@bOder würdest du gern erst ein wenig mit dem Volk plaudern? Mir ist beides recht.\n@c0@"
  en: "@aBianca@bOr would you rather have a bit more of a chat with folk first? I'm easy either way.\n@c0@"
  es: "@aBianca@b¿O preferirías charlar antes un poco más con la gente? Me parece bien cualquier cosa.\n@c0@"
  fr: "@aBianca@bÀ moins que tu ne préfères parler encore un peu avec les habitants de Gothaⓡ C'est comme tu veux.\n@c0@"
  it: "@aBianca@bOppure preferisci intrattenerti a parlare con i tuoi sudditi ancora un po'?\nScegli tu, per me va bene qualsiasi cosa.\n@c0@"
  ja: "@a@bビアンカ「それとも　もうすこし\n\t下で　みんなと話していく？\n\t私は　どっちでもいいわよ。\n@c0@"
339:
  de: "@aNera@bWir können die Leute nicht noch länger warten lassen. Komm, Liebling.\n@c0@"
  en: "@aNera@bWe can't keep everyone waiting any longer than we have already. Come on, darling.\n@c0@"
  es: "@aNera@bNo podemos hacer esperar a tutti más aún. Vamos, caro.\n@c0@"
  fr: "@aNera@bOn ne doit pas faire attendre les gens plus longtemps. Il faut y aller, mon chéri.\n@c0@"
  it: "@aNera@bCaro, credo che dovremmo andare.\nC'è qualcuno che ti aspetta...\n@c0@"
  ja: "@a@bフローラ「そうね　これ以上\n\tお待たせしてはいけませんわ。\n\tさあ　あなた……。\n@c0@"
340:
  de: "@aBianca@bTja, nun, da auf der Welt wieder Frieden herrscht, wird es leicht sein, wieder zwischen hier und Zenithia zu verkehren.\n@c0@"
  en: "@aBianca@bWell, now the world's at peace again, it should be easy to come and go between here and Zenithia.\n@c0@"
  es: "@aBianca@bBueno, ahora que el mundo vuelve a estar en paz será sencillo viajar de aquí a Zenithia.\n@c0@"
  fr: "@aBianca@bMaintenant que la paix est revenue, il devrait être plus facile de voyager entre ici et Zénithia.\n@c0@"
  it: "@aBianca@bOra che nel mondo è tornata la pace, spero che potremo andare a salutare i nostri amici zenithiani ogni tanto...\n@c0@"
  ja: "@a@bビアンカ「平和になったんだもの。\n\tこれで　好きなだけ\n\t天空城と　行き来できるわね。\n@c0@"
341:
  de: "@aNera@bEndlich wird sie ungehindert zwischen hier und Zenithia verkehren können. Das muss eine große Erleichterung für sie sein.\n@c0@"
  en: "@aNera@bShe'll finally be able to go freely back and forth between here and Zenithia now. What a relief that must be for her.\n@c0@"
  es: "@aNera@bPor fin podrá viajar tranquilamente de aquí a Zenithia. Eso será una liberazione para ella.\n@c0@"
  fr: "@aNera@bElle va enfin pouvoir faire des allers-retours entre Zénithia et Gotha. Elle doit être tellement soulagée.\n@c0@"
  it: "@aNera@bAdesso che la situazione è più tranquilla, la nostra amica non avrà più problemi a viaggiare liberamente tra il mondo degli uomini e Zenithia...\n@c0@"
  ja: "@a@bフローラ「これからは　あの方も\n\tここと天空城を　自由に\n\t行き来できますわね。　良かったわ。\n@c0@"
342:
  de: "@a%0%a001240@bSie wäre bestimmt baff, wenn sie wüsste, dass der Zenithdrache hier in Humburg ist!\n@c0@"
  en: "@a%0%a001240@bI bet she'd be surprised if she knew the Zenith Dragon was right here in Gotha!\n@c0@"
  es: "@a%0%a001240@b¡Apuesto a que se sorprendería si supiera que el Dragón de Zenithia estuvo aquí en Pankraz!\n@c0@"
  fr: "@a%0%a001240@bJe suis sûr qu'elle serait étonnée d'apprendre que le Dragon du Zénith était ici, à Gothaⓠ\n@c0@"
  it: "@a%0%a001240@bChe faccia farebbe questa donna se sapesse che il Drago di Zenithia era proprio qui a Denim, eh?\n@c0@"
  ja: "@a@b%a001240「今　このお城に\n\tマスタードラゴンが来てること\n\t知ったらびっくりするよね　あの人。\n@c0@"
343:
  de: "@a%0%a001250@bWird sie jetzt aus Humburg weggehen? Ich hatte irgendwie gehofft, dass sie bleiben würde.\n@c0@"
  en: "@a%0%a001250@bIs she going to leave Gotha now?\nI was sort of hoping she might decide to stay.\n@c0@"
  es: "@a%0%a001250@b¿Se va a marchar de Pankraz?\nYo esperaba que decidiera quedarse.\n@c0@"
  fr: "@a%0%a001250@bElle va partir de Gotha, maintenantⓡ\nJ'espérais un peu qu'elle resterait.\n@c0@"
  it: "@a%0%a001250@bSpero che questa signora decida di restare a Denim.\nMi piacerebbe chiederle tante cose su Zenithia e sui suoi abitanti...\n@c0@"
  ja: "@a@b%a001250「あの人　もう　帰っちゃう？\n\tずっと　このお城に　いてほしいな。\n@c0@"
344:
  de: "@aBianca@bÄh, %a000090...\n@c0@"
  en: "@aBianca@bUm, %a000090...\n@c0@"
  es: "@aBianca@bMmm, %a000090...\n@c0@"
  fr: "@aBianca@bHum, %a000090...\n@c0@"
  it: "@aBianca@b%0%a000090...\n@c0@"
  ja: "@a@bビアンカ「ねえ　%a000090……。\n@c0@"
345:
  de: "@aBianca@bEs vergeht kein Tag, an dem ich nicht ein Dankgebet zur Göttin schicke, weil ich dir begegnet bin.\n@c0@"
  en: "@aBianca@bThere's not a day goes by when I don't send up a prayer of thanks to the Goddess for havin' met you.\n@c0@"
  es: "@aBianca@bNo pasa un día sin que rece a la Diosa para agradecerle el haberte conocido.\n@c0@"
  fr: "@aBianca@bPas un jour ne se passe sans que je prie la Déesse pour la remercier de notre rencontre.\n@c0@"
  it: "@aBianca@bNon passa giorno che io non ringrazi la dea per avermi concesso di incontrarti e di diventare tua moglie...\n@c0@"
  ja: "@a@bビアンカ「私　あなたに\n\tめぐりあえたこと　本当に心から\n\t神さまに　感謝してるわ。\n@c0@"
346:
  de: "@aBianca@bIch hoffe, wir bleiben für immer und ewig zusammen. Du darfst mich nie verlassen, hörst du, %a000090?\n@c0@"
  en: "@aBianca@bI hope we'll be together forever. Don't ever leave me, will you, %a000090?\n@c0@"
  es: "@aBianca@bEspero que estemos juntos siempre. No me dejes nunca, ¿vale, %a000090?\n@c0@"
  fr: "@aBianca@bJ'espère que nous serons toujours ensemble.\nTu ne me quitteras jamais, hein, %a000090ⓡ\n@c0@"
  it: "@aBianca@bSpero che saremo sempre felici insieme, %a000090...\n@c0@"
  ja: "@a@bビアンカ「絶対に　私の前から\n\tいなくならないでね。\n\t私のこと　絶対に　はなさないで……。\n@c0@"
347:
  de: "@aNera@bIch weiß nicht, ob es an den vielen glücklichen Gesichtern um mich herum liegt, aber mir ist, als wäre ich in eine warme Decke von Glück gehüllt.\n@c0@"
  en: "@aNera@bI don't know if it's seeing everyone's happy faces or what, but I feel like I'm wrapped up in a warm blanket of joy.\n@c0@"
  es: "@aNera@bNo sé si es por ver todas esas caras alegres, pero me siento envuelta en un cálido manto de felicidad.\n@c0@"
  fr: "@aNera@bJe ne sais pas si c'est de voir les visages heureux de tout le monde, mais j'ai l'impression d'être enveloppée dans un doux cocon de bonheur.\n@c0@"
  it: "@aNera@bNon potrò mai dimenticare questa giornata...\n@c0@"
  ja: "@a@bフローラ「たくさんの　よろこぶ方たちを\n\t見たせいか　胸の奥から　どんどん\n\tあたたかい気持ちが　あふれてくるの。\n@c0@"
348:
  de: "@aNera@bUnd denk doch nur, wenn ich dir nie begegnet wäre, hätte ich dieses wundervolle Gefühl nie verspürt!\n@c0@"
  en: "@aNera@bAnd just think, if I hadn't met you, I'd never have experienced this wonderful feeling.\n@c0@"
  es: "@aNera@bY fíjate, si no te hubiera conocido, nunca habría experimentado este sentimiento tan meraviglioso.\n@c0@"
  fr: "@aNera@bEt je me dis que si je ne t'avais pas rencontré, je n'aurais jamais connu ce sentiment merveilleux.\n@c0@"
  it: "@aNera@bCosì come non scorderò mai le emozioni che ho vissuto quando ci siamo sposati, né quelle provate alla nascita di %a001240 e %a001250...\n@c0@"
  ja: "@a@bフローラ「こんなに　しあわせな\n\t気持ちになれるのも\n\tあなたと　めぐりあえたからね。\n@c0@"
349:
  de: "@aNera@bIch liebe dich! Jetzt und immerdar, mein Liebling!\n@c0@"
  en: "@aNera@bI love you, darling. Now and for always.\n@c0@"
  es: "@aNera@bTe quiero, caro mio. Ahora y para siempre.\n@c0@"
  fr: "@aNera@bJe t'aime, mon chéri. Maintenant et à jamais.\n@c0@"
  it: "@aNera@bTi amo, tesoro mio, e ti amerò per tutta la vita.\n@c0@"
  ja: "@a@bフローラ「愛してるわ　あなた…\n\tこれからも　ずっと　いっしょよ……。\n@c0@"
350:
  de: "@a%0%a001240@bKusine Traudl wirkt aber ziemlich ernst heute, was?\n@c0@"
  en: "@a%0%a001240@bCousin Gertie seems a bit serious today, doesn't she?\n@c0@"
  es: "@a%0%a001240@bLa prima Frede está hoy un poco seria, ¿verdad?\n@c0@"
  fr: "@a%0%a001240@bCousine Gégé a l'air sérieuse, aujourd'hui, heinⓡ\n@c0@"
  it: "@a%0%a001240@bAnche la cugina Gertrude è forte, ma tu lo sei molto di più!\n@c0@"
  ja: "@a@b%a001240「ドリスお姉ちゃん\n\t今日は　ちょっと　おすましだね。\n@c0@"
351:
  de: "@a%0%a001250@bIch kann's kaum erwarten, Traudl alles zu erzählen, was passiert ist!\n@c0@"
  en: "@a%0%a001250@bI can't wait to tell Gertie all about everything that's happened!\n@c0@"
  es: "@a%0%a001250@b¡Estoy impaciente por contarle a Frede todo lo que ha pasado!\n@c0@"
  fr: "@a%0%a001250@bJ'ai vraiment hâte de raconter à Gégé tout ce qui nous est arrivé.\n@c0@"
  it: "@a%0%a001250@bNon vedo l'ora di raccontare a Gertrude tutte le nostre avventure!\n@c0@"
  ja: "@a@b%a001250「あとで　お姉ちゃんのところに\n\tお話ししに行ってこよっと。\n@c0@"
352:
  de: "@aBianca@bWir sollten uns besser auf den Weg machen, %a000090.\n@c0@"
  en: "@aBianca@bWe'd better get movin', %a000090.\n@c0@"
  es: "@aBianca@bSerá mejor que nos pongamos en marcha, %a000090.\n@c0@"
  fr: "@aBianca@bOn devrait y aller, %a000090.\n@c0@"
  it: "@aBianca@bAndiamo, %a000090.\n@c0@"
  ja: "@a@bビアンカ「さあ　行きましょ…　%a000090。\n@c0@"
353:
  de: "@aNera@bJetzt ist unsere Aufgabe wirklich und wahrhaftig beendet, nehme ich an.\n@c0@"
  en: "@aNera@bThis marks the real end of our quest, I suppose.\n@c0@"
  es: "@aNera@bEsto marca el auténtico final de la nostra misión, supongo.\n@c0@"
  fr: "@aNera@bJe pense que cela marque la fin de notre quête.\n@c0@"
  it: "@aNera@bSembra che la nostra avventura sia giunta al termine...\n@c0@"
  ja: "@a@bフローラ「これで　本当に\n\t旅が終わるのね……。\n@c0@"
354:
  de: "@a%0%a001240@bTypisch Sancho! Heult wie ein kleines Kind, wie immer!\n@c0@"
  en: "@a%0%a001240@bThere he goes again! Blubbing like a baby as usual!\n@c0@"
  es: "@a%0%a001240@b¡Ese es mi Sancho! ¡Tan buenazo como siempre!\n@c0@"
  fr: "@a%0%a001240@bÇa y estⓠ Il recommence. Il se remet à pleurer comme une Madeleineⓠ\n@c0@"
  it: "@a%0%a001240@bLo zio Sancho è sempre il solito tenerone, eh?\nÈ proprio per questo che gli vogliamo un gran bene!\n@c0@"
  ja: "@a@b%a001240「サンチョ　あいかわらず\n\t泣き虫だなあ。\n@c0@"
355:
  de: "@a%0%a001250@bJetzt wacht Großvater über uns alle. Und er wacht auch über Sancho.\n@c0@"
  en: "@a%0%a001250@bGrandpa's watching over us all now.\nHe's watching over Sancho too.\n@c0@"
  es: "@a%0%a001250@bEl abuelo nos protege ahora.\nY también protege a Sancho.\n@c0@"
  fr: "@a%0%a001250@bGrand-père veille sur nous tous, maintenant.\nEt sur Sancho aussi.\n@c0@"
  it: "@a%0%a001250@bNonno Russel e nonna Mada ci proteggeranno sempre da lassù... Veglieranno su me, su te, su mamma, su %a001240... e anche sullo zio Sancho!\n@c0@"
  ja: "@a@b%a001250「パパスおじいちゃん\n\tサンチョおじさんのことも\n\tちゃんと　見まもってるよね。\n@c0@"
356:
  de: "@aGriselda@bKomm! Die Leute auf der ganzen Welt warten auf unsere Rückkehr.\n@c0@"
  en: "@aDebora@bTime to go! People all over the world are waiting for our return.\n@c0@"
  es: "@aStefania@b¡Es hora de partire! En todo el mundo esperan nuestro ritorno.\n@c0@"
  fr: "@aPandora@bC'est l'heure d'y allerⓠ Les gens du monde entier attendent notre retour.\n@c0@"
  it: "@aViola@bForza, andiamo!\nI sudditi di Denim attendono il nostro ritorno.\nNon vorrai mica farli aspettare, eh?!\n@c0@"
  ja: "@a@bデボラ「さあ　行くわよ。\n\t世界中の人々が\n\t私たちが戻るのを　待っているわ。\n@c0@"
357:
  de: "@aGriselda@bHach, dann wird auch meine Schönheit für alle Zeiten festgehalten werden!\n@c0@"
  en: "@aDebora@bSo my beauty will be recorded for all to see until the end of time!\n@c0@"
  es: "@aStefania@b¡Así quedará constancia de la mia bellezza hasta el fin de los tiempos!\n@c0@"
  fr: "@aPandora@bAlors ma beauté sera consignée afin que chacun puisse l'admirer jusqu'à la fin des tempsⓠ\n@c0@"
  it: "@aViola@bSono certa che accanto alla trascrizione delle nostre imprese inseriranno una mia immagine, così tutti potranno ammirare la mia sfolgorante bellezza.\n㈡\nCerto, non sarà come vedermi di persona, ma è sempre meglio che niente, no?\n@c0@"
  ja: "@a@bデボラ「私の美しさは　こうして\n\t後の世にまで　伝えられていくのね。\n@c0@"
358:
  de: "@aGriselda@bIst es nicht wunderbar, vom Rücken des Zenithdrachen auf die Welt hinabschauen zu können? Aber schließlich haben wir uns das ja auch verdient!\n@c0@"
  en: "@aDebora@bWhat an opportunity, being able to look down on the world from the back of the Zenith Dragon!\r\nIt's no less than we deserve, of course.\n@c0@"
  es: "@aStefania@b¡Qué gran occasione, poder mirar il mondo de arriba abajo desde el lomo del Dragón de Zenithia!\nNo es que merezcamos nada menos, claro.\n@c0@"
  fr: "@aPandora@bC'est une chance incroyable de voir le monde\nd'en haut, depuis le dos du Dragon du Zénithⓠ\nMais c'est amplement mérité, bien sûr.\n@c0@"
  it: "@aViola@bNon è da tutti avere la possibilità di guardare il mondo dall'alto stando in groppa al Drago di Zenithia...\n㈡\nE il Drago di Zenithia sarà senz'altro onorato di avere ⓕa bordoⓖ una passeggera così avvenente come la sottoscritta.\n@c0@"
  ja: "@a@bデボラ「竜の神さまの　背に乗って\n\t天上から　世界をながめられるなんて。\n\t私たちに　ふさわしい　おくり物だわ。\n@c0@"
359:
  de: "@aGriselda@bSie hat recht. Hör nur, wie sie mir alle zujubeln.\n@c0@"
  en: "@aDebora@bShe's right. You can hear them all down there hailing my greatness.\n@c0@"
  es: "@aStefania@bTiene razón. Se les puede oír cómo alaban la mia grandezza desde allá abajo.\n@c0@"
  fr: "@aPandora@bElle a raison. On peut les entendre d'ici acclamer\r\nma grandeur.\n@c0@"
  it: "@aViola@bIn realtà la pace è tornata grazie alla mia brillante supervisione delle operazioni, ma non mi sembra il caso di sottilizzare.\n@c0@"
  ja: "@a@bデボラ「あら　本当。\n\t下界から　私の偉大さを　たたえる声が\n\tここまで　聞こえてくるわ。\n@c0@"
360:
  de: "@aGriselda@b... Was ist? Du brauchst gar nicht so zu gucken. Ich weiß, dass du auch deinen Teil beigetragen hast. Das muss ja wohl Anerkennung genug sein!\n@c0@"
  en: "@aDebora@b...What's wrong? There's no need to look so put-out.\r\nI know you played your part in it too. \r\nSurely that's recognition enough.\n@c0@"
  es: "@aStefania@b¿Qué pasa? No me mires con esa cara de ofendido.\nYo ya sé que tú también tuviste tu papel. \nNo querrás más reconocimiento que ese, ¿vero?\n@c0@"
  fr: "@aPandora@bQu'est-ce qui ne va pasⓡ Inutile de prendre cet\nair vexé. Je sais que tu as joué un rôle, toi aussi.\nÇa suffit, comme reconnaissance, nonⓡ\n@c0@"
  it: "@aViola@bPerò riconosco che hai eseguito efficacemente tutti i miei ordini, quindi è giusto che parte del merito vada anche a te.\n㈡\nUna parte piccola, però.\nQuindi non montarti la testa, caro...\n@c0@"
  ja: "@a@bデボラ「……なによ　その目は。\n\tあんたの努力は　この私が\n\t知っていれば　それでいいの。\n@c0@"
361:
  de: "@aGriselda@bHmm... Tausend Jahre?\n@c0@"
  en: "@aDebora@bHmm... Forever?\n@c0@"
  es: "@aStefania@bMmm... ¿Por los siglos de los siglos?\n@c0@"
  fr: "@aPandora@bMmm... Pour l'éternitéⓡ\n@c0@"
  it: "@aViola@bPer l'eternità...\n@c0@"
  ja: "@a@bデボラ「永遠……　ね。\n@c0@"
362:
  de: "@aGriselda@bDie Vorstellung, noch weitere tausend Jahre mit dir zusammen zu sein, gefällt mir. Dir doch auch, oder?\n@c0@"
  en: "@aDebora@bThe idea of us being together forever is quite appealing too. No doubt you're thrilled?\n@c0@"
  es: "@aStefania@bLa idea de que estemos insieme por los siglos de los siglos tiene su atractivo. Sobre todo para te.\n@c0@"
  fr: "@aPandora@bL'idée d'être ensemble pour l'éternité est assez plaisante. Tu es ravi, j'imagineⓡ\n@c0@"
  it: "@aViola@bCaro, ricordi che hai solennemente promesso di servirmi e riverirmi fino alla fine dei nostri giorni, vero?\n@c0@"
  ja: "@a@bデボラ「%a000090。　あんたとなら\n\t永遠に　いっしょにいて　よさそうね。\n\t私といられるのは　うれしいでしょう？\n@c0@"
363:
  de: "@aGriselda@bDas bedeutet, dass du mir bis zum Ende unserer Tage zu Diensten sein wirst. Und das ist ein Befehl.\n@c0@"
  en: "@aDebora@bIt means you'll have to dedicate yourself to me until the end of time, of course. And that's an order.\n@c0@"
  es: "@aStefania@bEso significa que tendrás que dedicarte a me hasta el fin de los tiempos, claro. Es una orden, ¿capisci?\n@c0@"
  fr: "@aPandora@bÇa signifie que tu vas devoir te consacrer à moi jusqu'à la fin des temps, évidemment. Et c'est un ordre.\n@c0@"
  it: "@aViola@bBeh, i termini dell'accordo sono cambiati: ho deciso che dovrai esaudire ogni mio desiderio anche non apparterremo più al mondo dei vivi.\n㈡\nSono certa che la nostra cara dea non avrà nulla da ridire a riguardo...\n@c0@"
  ja: "@a@bデボラ「だから　あんたも　永遠に\n\t私に　つくすのよ。　命令よ。\n@c0@"
364:
  de: "@aNera@bDas hätte ich nicht besser formulieren können.\n㈡\nWir mögen ja Großes geleistet haben, aber nichtsdestotrotz haben wir alles auch der Göttin zu verdanken.\n@c0@"
  en: "@aNera@bI couldn't have said it better myself. We may have done great things, but they were all thanks to the guidance of the Goddess.\n@c0@"
  es: "@aNera@bNo podría haberlo dicho mejor. Hemos realizado grandes hazañas, pero todo ha sido grazie a la guía de la Diosa.\n@c0@"
  fr: "@aNera@bJe n'aurais pas dit mieux. Nous avons peut-être fait de grandes choses, mais c'est parce que nous étions guidés par la Déesse.\n@c0@"
  it: "@aNera@bE sia lode anche alla nostra amata dea, senza la cui protezione non avremmo potuto coronare la nostra missione con il successo...\n@c0@"
  ja: "@a@bフローラ「本当に　その通りですわね。\n\t私たちは　何か大きなものに\n\tずっと　みちびかれて　いましたもの。\n@c0@"
365:
  de: "@aGriselda@bWas soll das denn heißen? Ich werde von niemandem geleitet, ich habe das alles selbst geschafft!\n@c0@"
  en: "@aDebora@bNobody guides me but myself! The things I've accomplished are all my own doing.\n@c0@"
  es: "@aStefania@b¡A mí nonme guía nadie! Tutto lo que he hecho ha sido cosa mía.\n@c0@"
  fr: "@aPandora@bPersonne ne me guideⓠ Je ne dois les choses que\nj'ai accomplies qu'à moi-même.\n@c0@"
  it: "@aViola@bRiconosco che il Drago di Zenithia ci ha aiutati...\nPerò avrei potuto fare anche da sola! E magari sarei riuscita a salvare il mondo in meno tempo!\n@c0@"
  ja: "@a@bデボラ「私は　自分のしたいように\n\tしてきただけよ。　だれかに　みちびかれて\n\tやってきたことなんかじゃ　ないわ。\n@c0@"
366:
  de: "@aGriselda@bWelch ein Ausblick. Deine Mutter und dein Vater genießen ihn jetzt bestimmt auch, von dort oben.\n@c0@"
  en: "@aDebora@bIt's an incredible view. I'm sure your mother and father are looking out on it too.\n@c0@"
  es: "@aStefania@bLa vista es incredibile. Sonno sicura de que la tua mamma e il tuo papino también la están mirando.\n@c0@"
  fr: "@aPandora@bLa vue est incroyable. Je suis sûre que ta mère et ton père l'admirent, eux aussi.\n@c0@"
  it: "@aViola@bChe panorama meraviglioso...\nSento che in questo momento anche i tuoi genitori lo stanno ammirando dall'alto dei cieli...\n@c0@"
  ja: "@a@bデボラ「本当に　すばらしい景色ね。\n\tきっと　あんたのパパと　ママも\n\tこれを　見てるはずよ。\n@c0@"
367:
  de: "@aGriselda@bDeine Mutter ist bis zum Ende stark geblieben. Ich glaube, sie ist der erste Mensch, den ich wirklich bewundere.\n@c0@"
  en: "@aDebora@bYour mother remained strong right up to the end.\r\nI think she's the first person I've ever met who I genuinely admire.\n@c0@"
  es: "@aStefania@bLa tua mamma fue fuerte hasta el final.\nCredo que es la primera persona que he conocido a la que admire veramente.\n@c0@"
  fr: "@aPandora@bTa mère est restée forte jusqu'à la fin. De toutes les personnes que j'ai rencontrées, je crois que c'est la première que j'admire sincèrement.\n@c0@"
  it: "@aViola@bNon dimenticherò mai il coraggio di tua madre, %a000090.\n㈡\nE non scorderò nemmeno la sua incredibile forza di volontà, né l'amore che ha dimostrato di avere per te e per la tua famiglia...\n@c0@"
  ja: "@a@bデボラ「%a000090のママは　最後まで\n\t本当に　強かったわね。　かなわないって\n\t思ったの　生まれて初めてよ。\n@c0@"
368:
  de: "@aGriselda@bVon nun an wird sie mein Vorbild sein, und ich werde versuchen, genauso stark zu werden. Dann kann mich keiner mehr aufhalten!\n@c0@"
  en: "@aDebora@bI'm going to use her as a role model from now on and become stronger than ever. I won't be beaten!\n@c0@"
  es: "@aStefania@bA partir de ahora la utilizaré como modelo y me haré más fuerte que nunca. ¡Nadie podrá con me!\n@c0@"
  fr: "@aPandora@bÀ partir de maintenant, elle sera mon modèle\net je vais devenir plus forte que jamais.\nPersonne ne pourra me battreⓠ\n@c0@"
  it: "@aViola@bHo deciso che d'ora in avanti m'ispirerò a lei, e cercherò di diventare una donna ancora più forte e rispettosa.\n㈡\nNon ti saresti mai sognato di sentirmi dire una cosa simile, eh? Vedi, oltre che perfetta, sono anche modesta. E non dirmi che non te n'eri accorto!\n@c0@"
  ja: "@a@bデボラ「私　あんたのママを目指して\n\tこれから　もっともっと強い女になるわ。\n\t絶対にね。\n@c0@"
369:
  de: "@aGriselda@bDeine Mutter hatte wirklich Glück, deinen Vater getroffen zu haben. Genauso wie du, als du mich kennenlerntest.\n@c0@"
  en: "@aDebora@bYour mother was really happy to have met your father, wasn't she? Just like you were happy to have met me.\n@c0@"
  es: "@aStefania@bLa tua mamma estaba molto felice por haber conocido al tuo papino, ¿no? Igual que tú de haberme conocido a me.\n@c0@"
  fr: "@aPandora@bTa mère était vraiment heureuse d'avoir rencontré ton père, n'est-ce pasⓡ Tout comme toi, tu as été heureux de me rencontrer.\n@c0@"
  it: "@aViola@bTuo padre è stato fortunato a incontrare Mada...\nQuasi quanto lo sei stato tu a diventare mio marito!\n@c0@"
  ja: "@a@bデボラ「%a000090のママは　あんたの\n\tパパに　出会えて幸せだったのね。\n\tあんたが　私に　出会えたようにね。\n@c0@"
370:
  de: "@aGriselda@bOh ja, es ist wieder Frieden in der Welt eingekehrt. Das kann man auch den Leuten ansehen.\n@c0@"
  en: "@aDebora@bYou can tell the world's at peace again.\nYou can see it in people's faces.\n@c0@"
  es: "@aStefania@bEstá claro que la pace ha vuelto al mondo.\nNo hay más que ver la cara de la gente.\n@c0@"
  fr: "@aPandora@bLe monde est vraiment en paix, désormais.\r\nÇa se lit sur le visage des gens.\n@c0@"
  it: "@aViola@bAnche se non lo sapessimo, ci accorgeremmo che il mondo è tornato in pace guardando i volti felici e sereni delle persone...\n@c0@"
  ja: "@a@bデボラ「たしかに　世界は\n\t平和になったみたいね。　この人たちの\n\t顔を見ているだけで　それがわかるわ。\n@c0@"
371:
  de: "@aGriselda@bIch finde nicht, dass man den Kampf mit Nimzo als romantisch bezeichnen kann...\n@c0@"
  en: "@aDebora@bI hardly think that the battle with Nimzo can be described as romantic!\n@c0@"
  es: "@aStefania@b¡Non credo que la lucha con Nimzo se pueda considerar romántica!\n@c0@"
  fr: "@aPandora@bJ'ai du mal à penser que notre combat avec Nimzo puisse être qualifié de romantiqueⓠ\n@c0@"
  it: "@aViola@bOh, insomma!\nPerché tutti parlano di %a000090 e nessuno si ricorda di me?!\n㈡\nMi sa che dovrò inviare un comunicato ufficiale che descriva il ruolo fondamentale che ho svolto in quest'avventura...\n@c0@"
  ja: "@a@bデボラ「ミルドラースとの戦いは\n\tあんまり　ロマンチックなものじゃ\n\tなかったけどね。\n@c0@"
372:
  de: "@aGriselda@bJa, vielleicht sollte auch ich ein paar Gebete sprechen. Ich habe keine Lust, das Ganze noch einmal durchmachen zu müssen...\n@c0@"
  en: "@aDebora@bYes, maybe I should say a few prayers too. I can't bear the idea of having to go through all that again.\n@c0@"
  es: "@aStefania@bQuizá yo también tenga que rezar un poco. No soporto la idea de tener que volver a pasar per tutto eso.\n@c0@"
  fr: "@aPandora@bOui, je devrais peut-être faire une ou deux prières, moi aussi. Je ne supporte pas l'idée d'avoir à revivre tout ça.\n@c0@"
  it: "@aViola@bSì, preghiamo per le anime di coloro che sono stati travolti dalla follia della Setta di Zugzwang...\n@c0@"
  ja: "@a@bデボラ「そうね…　私も　お祈りしておくわ。\n\t２度と　あんなことが\n\tくりかえされたら　イヤだから。\n@c0@"
373:
  de: "@aGriselda@bWo wir gerade von Zuhause sprechen... Ich frage mich schon, wo ich eigentlich herkomme. Und Nera natürlich...\n@c0@"
  en: "@aDebora@bTalking of home, I wonder where it is I'm really from. And Nera too, of course.\n@c0@"
  es: "@aStefania@bHablando de casa, me pregunto de dónde vengo veramente. Bueno, yo y Nera, claro.\n@c0@"
  fr: "@aPandora@bEn parlant de chez-soi, je me demande d'où je viens réellement. Et Nera aussi, bien sûr.\n@c0@"
  it: "@aViola@bA proposito di casa...\nChissà qual è il villaggio natale mio e di Nera...\n@c0@"
  ja: "@a@bデボラ「そういえば…\n\t私とフローラが　生まれた場所は\n\t結局　どこだったのかしら。\n@c0@"
374:
  de: "@aGriselda@bNicht, dass es einen großen Unterschied machen würde. Ihr seid jetzt meine Familie, du und die Kinder.\n@c0@"
  en: "@aDebora@bNot that it really matters any more.\nYou and the children are my family now.\n@c0@"
  es: "@aStefania@bAunque ya no quiere decir niente.\nLa mia famiglia ahora sois tú y los bambini.\n@c0@"
  fr: "@aPandora@bMême si ça n'a plus guère d'importance, désormais. Les enfants et toi, vous êtes maintenant ma famille.\n@c0@"
  it: "@aViola@bForse non lo scoprirò mai, ma non importa.\nCasa mia è accanto a te e ai nostri figli, %a000090...\n@c0@"
  ja: "@a@bデボラ「今さら　興味はないけどね。\n\t私には　子供たちや　あんたがいるし。\n@c0@"
375:
  de: "@aNera@bIch bin überzeugt, dass wir Nimzo nur deshalb besiegen konnten, weil die Leute auf der ganzen Welt an uns geglaubt und für uns gebetet haben.\n@c0@"
  en: "@aNera@bI'm convinced that our victory was only possible because people all over the world believed in us and prayed for us.\n@c0@"
  es: "@aNera@bSonno convencida de que si pudimos vencer es porque personas de todo el mundo creyeron en nostros y rezarón por nosotros.\n@c0@"
  fr: "@aNera@bJe suis convaincue que notre victoire n'a été possible que parce que les gens du monde entier ont cru en nous et nous ont portés par leurs prières.\n@c0@"
  it: "@aNera@bDobbiamo la vittoria all'Eroe Leggendario, a suo padre e agli amici che hanno combattuto al nostro fianco.\n㈡\nForse, però, non ce l'avremmo fatta senza l'affetto e le preghiere di tutti coloro che hanno avuto fiducia in noi...\n@c0@"
  ja: "@a@bフローラ「私たちが　勝てたのは\n\t世界中のみなさんが　私たちを信じて\n\t祈ってくださったからだと思うんです。\n@c0@"
376:
  de: "@aGriselda@bAnscheinend hat er's verstanden. Es war allein unsere Stärke und Entschlossenheit, die uns hat siegen lassen.\n㈡\nDas hatte nichts mit Gebeten oder Glück zu tun...\n@c0@"
  en: "@aDebora@bHe actually seems to get it. The reason we managed it is because of our own strength and that alone. Nothing to do with prayers or luck.\n@c0@"
  es: "@aStefania@bSembra que lo entiende. Si lo hemos logrado ha sido por nuestra forza y por nada más. Las oraciones o la suerte no han tenido niente que ver.\n@c0@"
  fr: "@aPandora@bIl semble avoir tout compris. Nous avons réussi\r\ngrâce à notre propre force et rien d'autre.\r\nRien à voir avec des prières ou la chance.\n@c0@"
  it: "@aViola@bⓕNimzo non avrebbe mai potuto spuntarla contro l'Eroe Leggendario e suo padreⓖ?!\n㈡\nE la madre dell'Eroe Leggendario?!\nCe la vogliamo proprio dimenticare?!\nAnch'io ho fatto la mia parte! Sob! Siete degli ingrati!\n@c0@"
  ja: "@a@bデボラ「このおじさん　わかってるじゃない？\n\t私たちが　勝てたのは\n\tそれだけの　実力があったからよ。\n@c0@"
377:
  de: "@aGriselda@bEs ist doch seltsam, wie die kleinen Dinge des Lebens sich in etwas Großes verwandeln können. Genau wie unsere Heirat.\n@c0@"
  en: "@aDebora@bIt's funny how the littlest of things can spiral into something huge. Much like how we ended up\r\nbeing married.\n@c0@"
  es: "@aStefania@bEs curioso como algo que parece carecer de importancia puede acabar siendo veramente vital per il mondo. Mira lo insignificante que parecías tú...\n@c0@"
  fr: "@aPandora@bC'est amusant de voir que la plus petite des choses peut prendre des proportions gigantesques. Un peu comme ce qui a fait que nous nous sommes mariés.\n@c0@"
  it: "@aViola@bCaro, mi piace pensare che è stato il frutto del nostro amore a salvare il mondo...\n@c0@"
  ja: "@a@bデボラ「何かがはじまる　きっかけって\n\t本当に　ささいなことからなのよね。\n\tあんたと　私が　結婚したこともふくめて。\n@c0@"
378:
  de: "@aGriselda@bStimmt. Ich bin viel zu gut für dich, nicht wahr, %a000090?\n@c0@"
  en: "@aDebora@bThat's right. I am too good for you, aren't I, %a000090?\n@c0@"
  es: "@aStefania@bExacto. Io sonno demasiado buena per te, ¿verdad, %a000090?\n@c0@"
  fr: "@aPandora@bC'est vrai, je suis trop bien pour toi, n'est-ce pas, %a000090ⓡ\n@c0@"
  it: "@aViola@b%0%a000090, pensi che io sia troppo bella, intelligente e capace per te?\n@c0@"
  ja: "@a@bデボラ「そうよ　私は\n\t%a000090には　過ぎた奥さんなんだから。\n@c0@"
379:
  de: "@aGriselda@bNICHT WAHR, %a000090? Ich weiß, dass du manchmal etwas langsam bist, aber selbst dir müsste das mittlerweile aufgegangen sein.\n@c0@"
  en: "@aDebora@bRight, %a000090? I know you're a bit slow, but even you must've figured that out.\n@c0@"
  es: "@aStefania@b¿Verdad, %a000090? Ya sé que eres un po' lento, pero sicuro que lo habías comprendido.\n@c0@"
  fr: "@aPandora@bHein, %a000090ⓡ Je sais que tu es un peu lent à la détente, mais même toi, tu as dû te rendre compte de ça.\n@c0@"
  it: "@aViola@bForse hai ragione, sai? Però non disperare: stammi vicino e vedrai che col tempo anche tu diventerai una persona straordinaria...\n@c0@"
  ja: "@a@bデボラ「ね？　%a000090。\n\tいくら　にぶい　あんたでも　さすがに\n\tわかってきたでしょ？\n@c0@"
380:
  de: "@aGriselda@bIhr beide versteht euch so gut. Es wäre wunderbar, wenn sich zwischen Humburg und Tifortu eine freundschaftliche Beziehung entwickeln könnte.\n@c0@"
  en: "@aDebora@bYou two get along so well. It should be wonderful for relations between Gotha and Coburg.\n@c0@"
  es: "@aStefania@bOs lleváis muy bien, vosotros dos. Será meraviglioso para las relaciones entre Pankraz y Trastámara.\n@c0@"
  fr: "@aPandora@bVous vous entendez tellement bien, tous les deux.\r\nLes relations entre Gotha et Cobourg ne devraient pas se dégrader de sitôt.\n@c0@"
  it: "@aViola@bOra che il mondo è salvo, dovrai iniziare a fare davvero il re, caro.\n㈡\nCome prima cosa, dovresti siglare un trattato di perenne amicizia con il Regno di Coburg.\n@c0@"
  ja: "@a@bデボラ「あんたたちの　仲の良さなら\n\tグランバニアと　ラインハットは\n\tいい関係を　保っていけそうね。\n@c0@"
381:
  de: "@aGriselda@bAuf solche Dinge musst du von nun an achten, weißt du. Aber an erster Stelle komme immer noch ich...\n@c0@"
  en: "@aDebora@bYou'll have to think about things like that from now on, you know. Naturally they'll be lower down your priorities than I am, though.\n@c0@"
  es: "@aStefania@bA partir de ahora tendrás que pensar en esas cosas. Claro que tu primera prioridad sonno io.\n@c0@"
  fr: "@aPandora@bTu sais, tu vas devoir penser à ce genre de choses, désormais. Bon, évidemment, cela viendra après moi dans l'ordre de tes priorités.\n@c0@"
  it: "@aViola@bEssere sovrano di un paese è un'attività che richiede tempo e dedizione, ma ti concedo di svolgerla.\n㈡\nL'importante è che i tuoi doveri istituzionali non ti impediscano di servirmi e riverirmi in tutti i modi possibili e immaginabili!\n@c0@"
  ja: "@a@bデボラ「これからは　そういうことを\n\t考えるのも　あんたの仕事よ。\n\tもちろん　私のことの　次にね。\n@c0@"
382:
  de: "@aGriselda@bIch bekomme auf einmal Heimweh nach Humburg...\n@c0@"
  en: "@aDebora@bI suddenly feel a bit of a pang for Gotha.\n@c0@"
  es: "@aStefania@bDe pronto echo un po' de menos Pankraz.\n@c0@"
  fr: "@aPandora@bJ'ai le cœur serré en pensant à Gotha, tout à coup.\n@c0@"
  it: "@aViola@bÈ vero, %a000090: il tuo popolo ti aspetta.\n@c0@"
  ja: "@a@bデボラ「なんだか　グランバニアが\n\tなつかしくなってきたわ。\n@c0@"
383:
  de: "@aGriselda@bSeltsam. Dabei ist es doch nur der Ort, an dem du geboren wurdest...\n@c0@"
  en: "@aDebora@bIt's strange, really. I mean, it's just the place you were born.\n@c0@"
  es: "@aStefania@bNo sé por qué, la verdad. Solo es tu tierra natale.\n@c0@"
  fr: "@aPandora@bC'est vraiment bizarre. C'est vrai, ça n'est que\r\nta ville natale, après tout.\n@c0@"
  it: "@aViola@bPerò aspetta soprattutto me, che sono la sua splendida e illuminata Regina!\nForza, maritino! Non facciamoli attendere troppo!\n@c0@"
  ja: "@a@bデボラ「%a000090が　生まれた国って\n\t思ってただけなのに　ふしぎだわ。\n@c0@"
384:
  de: "@aGriselda@bHier ist nun viel mehr los als früher. Alle sind so ausgelassen und heiter. Na ja, kein Wunder. Immerhin herrscht wieder Frieden in der Welt.\n@c0@"
  en: "@aDebora@bThere's a lot more life to the place than there used to be. I suppose it stands to reason, what with the world being at peace now.\n@c0@"
  es: "@aStefania@bEste sitio tiene mucha más vita de la que solía tener. Supongo que es lógico, ahora que el mundo está in pace y eso.\n@c0@"
  fr: "@aPandora@bCet endroit est bien plus vivant qu'autrefois.\r\nMais c'est logique, dans le fond, puisque la paix\r\nest revenue.\n@c0@"
  it: "@aViola@bIl ritorno della pace ha riportato il sorriso sui volti della gente.\nE il merito è tutto...\n㈡\nNostro!\nNon te l'aspettavi, eh?! Credevi che avrei detto che il merito è solo mio, vero? Beh, oggi mi sento generosa!\n@c0@"
  ja: "@a@bデボラ「なんだか　お城の中が\n\t前よりも　にぎやかに　なっているわね。\n\t平和になったんだから　当然だけど。\n@c0@"
385:
  de: "@aGriselda@bHmpf. Wenn er uns geholfen hätte, wäre auch auf ihn ein wenig Ruhm und Glanz gefallen. Aber vielleicht sollte ich nicht so kleinlich sein...\n@c0@"
  en: "@aDebora@bHmph. If he'd helped us, then he could've been sharing the glory too. But maybe that's a little unfair.\n@c0@"
  es: "@aStefania@bMmmf. Si nos hubiese ayudado, podría estar ahora compartiendo la gloria. Sembra que no es demasiado justo.\n@c0@"
  fr: "@aPandora@bMmpf. S'il nous avait aidés, il aurait aussi partagé les lauriers, surtout. Mais je suis peut-être un peu injuste.\n@c0@"
  it: "@aViola@bPerché la gente vuole sempre apparire migliore di quanto non è realmente, eh?\n㈡\nCosa c'è, caro? Perché mi guardi in quel modo?\nHo i capelli fuori posto?\n@c0@"
  ja: "@a@bデボラ「手伝っていれば　いまごろ\n\tみんなから　ほめられていたものね。\n\t……って　ちょっと言いすぎたかしら。\n@c0@"
386:
  de: "@aGriselda@bIch habe keine Lust, mir die Stammelei eines Schlafenden anzuhören.\n㈡\nStell dir nur mal vor, wie schockiert er sein wird, wenn er aufwacht und feststellt, dass tatsächlich Frieden herrscht!\n@c0@"
  en: "@aDebora@bI don't need to hear the ramblings of someone having a dream. Imagine his shock when he wakes up and finds the world really is at peace!\n@c0@"
  es: "@aStefania@bNon voglio escuchar las tonterías que dice una persona dormida.\n㈡\n¡Imagina qué susto si se despierta y descubre que la pace ha vuelto veramente al mondo!\n@c0@"
  fr: "@aPandora@bJe n'ai pas besoin d'écouter les élucubrations d'un type qui rêve. Imagine le choc quand il se réveillera et découvrira que le monde est vraiment en paixⓠ\n@c0@"
  it: "@aViola@bPiù che altro viene da chiedersi dove sia andato a finire il suo cervello...\n@c0@"
  ja: "@a@bデボラ「夢を見てる人に　言われたくないわ。\n\t……目が覚めたら　世界が変わっていて\n\tびっくりするでしょうね　フフッ。\n@c0@"
387:
  de: "@aGriselda@bGlücklich! Glücklich! Glücklⓚⓛ Nein, ich lass mich nicht von der Freude anstecken. Nicht im Mindesten.\n... Was kicherst du denn so doof?\n@c0@"
  en: "@aDebora@bHappy! Happy! Hapⓚⓛ\nEr, I'm not getting carried away. No, not in the slightest. ...What are you laughing at?\n@c0@"
  es: "@aStefania@b¡Felicità! ¡Felicità! ¡Feli...!\nEeh, no, no me estoy dejando llevar. No, para nada. ¿De qué te ríes?\n@c0@"
  fr: "@aPandora@bHeureuseⓠ Heureuseⓠ Heu...\nEuh, non je ne m'emporte pas. Pas le moins du monde. ... Qu'est-ce qui te fait rireⓡ\n@c0@"
  it: "@aViola@bEvviva!\nÈ tornata la pace!\n㈡\nBeh? Che hai da guardare?!\nForse non posso concedermi anch'io un attimo di legittimo entusiasmo?!\n@c0@"
  ja: "@a@bデボラ「わーい　わー…　って\n\tわ　私は　つられたりしないんだからっ。\n\t何を笑ってるのよ　%a000090っ！\n@c0@"
388:
  de: "@aGriselda@bSo hat dein altes Dorf also ausgesehen. Du musst sehr froh sein, dass alles wieder so ist wie früher, %a000090.\n@c0@"
  en: "@aDebora@bSo this is how your old village should look. You must be pleased to see it back to normal, %a000090.\n@c0@"
  es: "@aStefania@bAsí que este es el verdadero aspecto del tuo pueblo. Estarás felice de ver que ha vuelto a la normalidad, %a000090.\n@c0@"
  fr: "@aPandora@bAlors c'est à ça que ressemble en fait ton village.\nTu dois être content de le voir revenu à la normale, %a000090.\n@c0@"
  it: "@aViola@b%0%a000090, sarai felice di vedere che il villaggio è tornato a vivere...\n㈡\nSenti, ho un'idea... Che ne diresti di chiedere agli abitanti di cambiare il nome da Valcava a ⓕViolabellaⓖ, eh? È uno splendido nome, no?\n@c0@"
  ja: "@a@bデボラ「これが　あんたが住んでいた村の\n\t本当の　姿なのね。\n\tおめでとう　%a000090。\n@c0@"
389:
  de: "@aGriselda@bJa, es ist allein unser Verdienst, dass sich Steinach so gut erholt hat.\n@c0@"
  en: "@aDebora@bYes, it's thanks to our efforts for peace that Whealbrook has recovered so well.\n@c0@"
  es: "@aStefania@bGracias a nuestro trabajo per la pace, Arroyofrío se ha recuperado.\n@c0@"
  fr: "@aPandora@bOui, c'est grâce à nos efforts pour rétablir la paix que Ruycelieu s'est si bien reconstruit.\n@c0@"
  it: "@aViola@bStavo pensando di proporre agli abitanti del luogo di cambiare il nome del villaggio da Valcava a ⓕViolabellaⓖ.\n@c0@"
  ja: "@a@bデボラ「平和のために　がんばったから\n\tこの村も　元の姿に　戻ったのね。\n@c0@"
390:
  de: "@aGriselda@bAber mit solch einer wunderbaren Frau an deiner Seite konntest du ja nicht anders, als dein Bestes zu geben!\n@c0@"
  en: "@aDebora@bNo doubt having a wonderful wife like me is what motivated you to give your best.\n@c0@"
  es: "@aStefania@bEstá claro que una esposa meravigliosa come io es lo que te motivó para dar lo mejor di te.\n@c0@"
  fr: "@aPandora@bC'est certainement la présence d'une femme aussi merveilleuse que moi à tes côtés qui t'a motivé et\r\nt'a poussé à donner le meilleur de toi-même.\n@c0@"
  it: "@aViola@bHo già preparato il documento ufficiale che autorizza il cambiamento immediato del nome, %a000090.\n㈡\nCi pensi tu a farlo firmare da chi di dovere?\nGrazie.\n@c0@"
  ja: "@a@bデボラ「もちろん　私という\n\tすばらしい妻が　いるから　あんたも\n\tがんばれたんでしょうけど。\n@c0@"
391:
  de: "@a%0%a001240@bEr hat Großvater was auf die Mütze gegeben?! Dem werd' ich's zeigen!\n@c0@"
  en: "@a%0%a001240@bHe hit Grandpa on the head!? I'll show him!\n@c0@"
  es: "@a%0%a001240@b¿Que le arreó al abuelo en la cabeza? ¡Yo le enseñaré!\n@c0@"
  fr: "@a%0%a001240@bIl a tapé grand-père sur le crâneⓠⓑ Je vais lui montrer, moiⓠ\n@c0@"
  it: "@a%0%a001240@bCome sarebbe a dire che ha discusso con il nonno ⓕcon le maniⓖ?\n@c0@"
  ja: "@a@b%a001240「おじいちゃんの頭を\n\t何回も　どついたなんて\n\tボクとしては　許せないよ！\n@c0@"
392:
  de: "@a%0%a001240@bWenn er nicht hinsieht, werd' ich ihm selber eine Kopfnuss verpassen.\n@c0@"
  en: "@a%0%a001240@bWhen he's looking the other way, I'll give him a taste of his own medicine.\n@c0@"
  es: "@a%0%a001240@bCuando no esté mirando le voy a dar un poco de su propia medicina.\n@c0@"
  fr: "@a%0%a001240@bDès qu'il aura le dos tourné, je lui rendrai la pareille.\n@c0@"
  it: "@a%0%a001240@bVuol dire che aveva litigato con nonno Russel?!\nArgh! Voglio farlo a pezzi!\n@c0@"
  ja: "@a@b%a001240「おの　おじさんが\n\tうしろ向いたら　こっそり\n\tしかえし　してやるんだ！\n@c0@"
393:
  de: "@aGriselda@bGute Idee, %a001240. Ich werd' ihm auch eine verpassen!\n@c0@"
  en: "@aDebora@bGood idea, %a001240.\nI'll give him a whack as well!\n@c0@"
  es: "@aStefania@bBuona idea, %a001240.\n¡Yo también le daré un porrazo o dos!\n@c0@"
  fr: "@aPandora@bBonne idée, %a001240.\nEt moi aussi, je lui mettrai une bonne claqueⓠ\n@c0@"
  it: "@aViola@bOttima idea, %a001240!\nSuonagliele anche da parte mia!\n@c0@"
  ja: "@a@bデボラ「じゃあ　お母さんも\n\tいっしょに　しかえし　してあげる。\n@c0@"
394:
  de: "@a%0%a001240@bN-Nein! Das war nur ein Witz, Mama! Das hat sich ja fast so angehört, als würdest du es ernst meinen!\n@c0@"
  en: "@a%0%a001240@bN-No! I was only joking, Mum!\nYou almost sounded like you meant it.\n@c0@"
  es: "@a%0%a001240@b¡N-no! ¡Era una broma, mamá!\nParecía que lo dijeses en serio.\n@c0@"
  fr: "@a%0%a001240@bN-Nonⓠ Je plaisantais, maman, c'est toutⓠ\nMais toi, tu semblais le penser vraiment.\n@c0@"
  it: "@a%0%a001240@bDavvero posso?\nOh, mammina!\nSei troppo forte!\n@c0@"
  ja: "@a@b%a001240「じ　じょうだんだよ！\n\tはあ…　お母さんが言うと　本気みたいに\n\t聞こえるから　ちょっと怖いんだよなあ。\n@c0@"
395:
  de: "@aGriselda@bWarum sollte ich es denn nicht ernst meinen?\n@c0@"
  en: "@aDebora@bWhat makes you think I didn't?\n@c0@"
  es: "@aStefania@b¿Y qué te hace pensare que no era così?\n@c0@"
  fr: "@aPandora@bEt qu'est-ce qui te fait croire que ce n'était pas\nle casⓡ\n@c0@"
  it: "@aViola@bSei proprio un allocco, figlio mio! Tutto tuo padre!\nMa ti pare possibile che io ti dia il permesso di picchiare un uomo inerme?!\n㈡\nSarà anche uno screanzato, ma questo non ti autorizza a farlo a pezzi. Il tuo non sarebbe un comportamento degno dell'Eroe Leggendario!\n@c0@"
  ja: "@a@bデボラ「あら。　お母さんは\n\tじょうだんでなんか　言ってないわよ？\n@c0@"
396:
  de: "@a%0%a001240@bAhhh!\n@c0@"
  en: "@a%0%a001240@bYikes!\n@c0@"
  es: "@a%0%a001240@b¡Uuuy!\n@c0@"
  fr: "@a%0%a001240@bOh ohⓠ\n@c0@"
  it: "@a%0%a001240@bSigh!\nEra troppo bello per essere vero...\n@c0@"
  ja: "@a@b%a001240「しょえー。\n@c0@"
397:
  de: "@a%0%a001250@bOh ja, ahhh!\n@c0@"
  en: "@a%0%a001250@bYikes indeed!\n@c0@"
  es: "@a%0%a001250@b¡Eso, uuuy!\n@c0@"
  fr: "@a%0%a001250@bOh oh, comme tu disⓠ\n@c0@"
  it: "@a%0%a001250@bEhm...\nNon ho nulla da dire...\n@c0@"
  ja: "@a@b%a001250「お兄ちゃんも\n\tしょえー　って　言った……。\n@c0@"
398:
  de: "@aGriselda@bIhm scheint wohl nicht aufzugehen, dass du Ludwigs Sohn bist.\n@c0@"
  en: "@aDebora@bLooks like he doesn't recognise you as being Pankraz's son.\n@c0@"
  es: "@aStefania@bSembra que no te ha reconocido como el hijo de Teudis.\n@c0@"
  fr: "@aPandora@bApparemment, il ne t'a pas reconnu.\n@c0@"
  it: "@aViola@bNon ti ha riconosciuto!\nNon ha capito che sei il figlio di Russel!\n@c0@"
  ja: "@a@bデボラ「このおじいさん　あんたが\n\tパパス王の息子だってこと\n\t覚えていないみたいね。\n@c0@"
399:
  de: "@aGriselda@bNa, lassen wir es dabei. Noch so ein Schock wäre vermutlich zu viel für ihn.\n@c0@"
  en: "@aDebora@bWe'd better not let on.\nThe shock might finish him off.\n@c0@"
  es: "@aStefania@bSerá megliore que no se lo digamos.\nEl shock acabaría con él.\n@c0@"
  fr: "@aPandora@bMieux vaut ne pas lui dire que tu es le fils de Petros.\r\nLe choc pourrait le tuer.\n@c0@"
  it: "@aViola@bProbabilmente è rimasto abbagliato dalla mia sfolgorante bellezza, che gli ha impedito di mettere a fuoco il tuo volto...\n@c0@"
  ja: "@a@bデボラ「気づいたら　おどろきすぎて\n\t心臓が　止まっちゃうかもしれないから\n\tヒミツに　しておきましょう。\n@c0@"
400:
  de: "@aGriselda@bEs muss schön sein, einen Freund nach so langer Zeit gesund und munter wiederzusehen, %a000090.\n@c0@"
  en: "@aDebora@bIt must be good to see a friend safe and sound, %a000090.\n@c0@"
  es: "@aStefania@bDebe de estar bene ver a un amico sano y salvo, %a000090.\n@c0@"
  fr: "@aPandora@bÇa doit être bien de voir un ami sain et sauf, %a000090.\n@c0@"
  it: "@aViola@bSi direbbe che anche quest'uomo sia sopravvissuto alla distruzione del villaggio...\n@c0@"
  ja: "@a@bデボラ「良かったわね　%a000090。\n\tあんたの知り合いが　無事で。\n@c0@"
401:
  de: "@aGriselda@bVielleicht haben die Soldaten von Humburg ja alle Leute freigelassen, bevor sie den Ort in Brand gesteckt haben.\n@c0@"
  en: "@aDebora@bMaybe the soldiers from Coburg set everyone free before torching the place.\n@c0@"
  es: "@aStefania@bQuizá los soldati de Trastámara liberaron a todo el mundo antes de incendiarlo todo.\n@c0@"
  fr: "@aPandora@bPeut-être que les soldats de Cobourg ont laissé partir tout le monde avant de mettre le feu.\n@c0@"
  it: "@aViola@bSai, caro? Comincio a pensare che le truppe di Coburg rasero al suolo gli edifici e devastarono i campi, ma non infierirono sui civili.\n@c0@"
  ja: "@a@bデボラ「もしかすると　ラインハットの兵は\n\t住人を全部　逃がしてから\n\t村を　燃やしたのかもしれないわね。\n@c0@"
402:
  de: "@aGriselda@bEventuell war das Ganze also gar nicht so schlimm...\n@c0@"
  en: "@aDebora@bSo perhaps it wasn't as bad as it seemed after all.\n@c0@"
  es: "@aStefania@bAsí que quizá no ha sido para tanto come parecía.\n@c0@"
  fr: "@aPandora@bÇa n'a peut-être pas été aussi catastrophique\r\nque ça, finalement.\n@c0@"
  it: "@aViola@bProbabilmente, non ebbero il coraggio di uccidere dei poveri innocenti...\n@c0@"
  ja: "@a@bデボラ「だとしたら…\n\t少しは　救いがあると思わない？\n@c0@"
403:
  de: "@aGriselda@bWas ist los? Du siehst aus wie ein Fisch auf dem Trockenen!\n@c0@"
  en: "@aDebora@bWhat's wrong? You look like a fish out of water!\n@c0@"
  es: "@aStefania@b¿Cosa pasa? ¡Pareces un pez fuera del acqua!\n@c0@"
  fr: "@aPandora@bQu'est-ce qui ne va pasⓡ\nTu fais des yeux de merlan fritⓠ\n@c0@"
  it: "@aViola@bCome sei pallido, caro!\nC'è qualcosa che non va?\n@c0@"
  ja: "@a@bデボラ「あんた　どうしたの？\n\t陸にあげられた　魚みたいな顔をして。\n@c0@"
404:
  de: "@aGriselda@bAlles entwickelt sich prächtig hier. Jetzt gibt es sogar einen Apotheker. Obwohl ich nicht so genau weiß, was der Kerl taugt...\n@c0@"
  en: "@aDebora@bThis place is on the mend. Now they have a pharmacist and everything. I'm not sure how\r\ngood he is, mind.\n@c0@"
  es: "@aStefania@bEsto se está recuperando. Hasta tienen un farmacéutico. Aunque no sé si será molto buono.\n@c0@"
  fr: "@aPandora@bCet endroit est en train de se reconstruire. Maintenant, ils ont un herboriste et tout.\r\nJe ne sais pas s'il est bon, remarque.\n@c0@"
  it: "@aViola@bE così ora al villaggio c'è anche un farmacista!\nDi questo passo, entro pochi mesi ci saranno almeno due o tre negozi d'abbigliamento alla moda!\n@c0@"
  ja: "@a@bデボラ「この村は　もう大丈夫ね。\n\tこうして　くすり師も　来たことだし。\n\tウデのほうは　まだわからないけど。\n@c0@"
405:
  de: "@aGriselda@bHmm, gar nicht so schlecht hier. Aber vielleicht war es gut, dass alles abgebrannt ist und wieder aufgebaut wurde.\n@c0@"
  en: "@aDebora@bHmm, this isn't a bad little place. It's probably good that it was torched and rebuilt.\n@c0@"
  es: "@aStefania@bEste sitio no está mal. Probabilemente le vino bene que lo incendiasen y lo reconstruyesen.\n@c0@"
  fr: "@aPandora@bMmm, cette petite bicoque n'est pas mal. C'est sans doute une bonne chose qu'elle ait été brûlée puis reconstruite.\n@c0@"
  it: "@aViola@bChissà se Valcava è stata ricostruita esattamente com'era prima che venisse devastata...\n@c0@"
  ja: "@a@bデボラ「ふうん　なかなか良い家ね。\n\t焼けあとに　新しい家が建って\n\tよかったわね。\n@c0@"
406:
  de: "@aGriselda@bDas hilft dir vielleicht, nach vorne zu schauen, %a000090.\n@c0@"
  en: "@aDebora@bMaybe this'll help you look to the future a bit, %a000090.\n@c0@"
  es: "@aStefania@bQuizá esto te haga volver la vista al futuro, %a000090.\n@c0@"
  fr: "@aPandora@bPeut-être que ça t'aidera un peu à regarder vers l'avenir, %a000090.\n@c0@"
  it: "@aViola@bIo avrei mantenuto immutata l'atmosfera originaria del luogo, aggiungendo qualche tocco innovativo per sottolineare l'avvenuta rinascita del villaggio.\n@c0@"
  ja: "@a@bデボラ「これで　少しは　%a000090も\n\t前向きになれるわよね。\n@c0@"
407:
  de: "@a%0%a001240@bMir gefällt's hier, Papa. Warum kaufen wir das Haus nicht einfach, als Ferienwohnung?\n@c0@"
  en: "@a%0%a001240@bI like this place, Dad.\nLet's buy it as a holiday home!\n@c0@"
  es: "@a%0%a001240@bMe gusta esto, papi.\n¡Vamos a comprarlo para las vacaciones!\n@c0@"
  fr: "@a%0%a001240@bJ'aime bien cet endroit, papa.\nOn peut l'acheter comme maison de vacancesⓡ\n@c0@"
  it: "@a%0%a001240@bPapà, perché non gli chiediamo di venderci la casa?\n@c0@"
  ja: "@a@b%a001240「ねえ　お父さん。\n\tここの家　気に入ったよ。\n\t買い取って　別荘にしない？\n@c0@"
408:
  de: "@aGriselda@bSei nicht albern! Mit Geld kann man nicht alles kaufen, merk dir das. Manchmal frage ich mich schon, nach wem du schlägst...\n@c0@"
  en: "@aDebora@bDon't be so silly! Money can't buy everything, you know. I wonder who you take after sometimes!\n@c0@"
  es: "@aStefania@b¡Ma no seas bobo! No todo se compra con dinero. ¡A veces me pregunto a quién has salido!\n@c0@"
  fr: "@aPandora@bNe sois pas stupideⓠ L'argent ne peut pas tout acheter. Je me demande parfois de qui tu tiensⓠ\n@c0@"
  it: "@aViola@bPerché non lo chiedi a me, %a001240?\nLo sai che tuo padre fa solo quello che gli dico io...\n@c0@"
  ja: "@a@bデボラ「まあ　なんでも　お金で\n\t解決しようなんて　いやらしいわね。\n\tいったい　誰に似たのかしら！\n@c0@"
409:
  de: "@a%0%a001240@bTja, Mama, um ehrlich zu sein... Ach, egal.\n@c0@"
  en: "@a%0%a001240@bWell, Mum, to be honest, er...\nNever mind.\n@c0@"
  es: "@a%0%a001240@bBueno, mami, ahora que lo dices...\nNo importa.\n@c0@"
  fr: "@a%0%a001240@bEh bien, maman, pour être honnête, euh...\nNon, rien.\n@c0@"
  it: "@a%0%a001240@bUhm...\nNon sono più tanto sicuro di volermi sposare...\n@c0@"
  ja: "@a@b%a001240「そ　それは…お母さ……\n\tいえ　なんでも　ないです。\n@c0@"
410:
  de: "@aGriselda@bIch fürchte, Papa hat das alles organisiert. Typisch!\n@c0@"
  en: "@aDebora@bSounds like Papa's behind all this frivolity.\nHe's always doing things like this!\n@c0@"
  es: "@aStefania@bParece que il mio papino es el responsable de tanta frivolità.\n¡Siempre hace lo mismo!\n@c0@"
  fr: "@aPandora@bOn dirait que c'est papa qui est derrière toutes ces réjouissances. Il fait toujours des choses comme çaⓠ\n@c0@"
  it: "@aViola@bDev'essere stato il mio paparino a organizzare i festeggiamenti.\n@c0@"
  ja: "@a@bデボラ「この　おまつりさわぎのモトは\n\tパパにも　あったってわけね。\n\tまったく……　いつもこうなんだから！\n@c0@"
411:
  de: "@aGriselda@bAber dieses eine Mal werde ich wohl ein Auge zudrücken...\n@c0@"
  en: "@aDebora@bStill, I suppose I can turn a blind eye just this once.\n@c0@"
  es: "@aStefania@bMa supongo que por una volta se lo dejaré pasar.\n@c0@"
  fr: "@aPandora@bEnfin, je crois que je peux fermer les yeux pour cette fois.\n@c0@"
  it: "@aViola@bGeneroso com'è, non avrà badato a spese, pur di celebrare la nostra vittoria in maniera assolutamente indimenticabile!\n@c0@"
  ja: "@a@bデボラ「でも　まあ……\n\t今回は　目をつぶってあげるわ。\n@c0@"
412:
  de: "@aGriselda@bWelch ein braver Junge. Vielleicht sollten wir ihn als königlichen Dienstboten engagieren, wenn er erwachsen ist.\n@c0@"
  en: "@aDebora@bWhat a good boy. Maybe we'll have to hire him as one of our royal staff when he grows up.\n@c0@"
  es: "@aStefania@bBuen ragazzo. Quizá lo contrate para nuestro séquito reale cuando crezca.\n@c0@"
  fr: "@aPandora@bQuel gentil garçon. Peut-être que nous pourrions l'embaucher comme membre du personnel royal,\r\nquand il sera plus grand.\n@c0@"
  it: "@aViola@bChe bambino responsabile!\nMi piacerebbe assumerlo come apprendista inserviente...\n\n@c0@"
  ja: "@a@bデボラ「ずいぶんと　しっかりした子ね。\n\t大人になったら　グランバニア王家に\n\t仕えてくれないかしら。\n@c0@"
413:
  de: "@aGriselda@bWie peinlich! Papa ist so stolz, dass man meinen könnte, er platzt gleich.\n@c0@"
  en: "@aDebora@bHow embarrassing! Papa's heart is almost as soft as his belly!\n@c0@"
  es: "@aStefania@b¡Qué vergüenza! ¡El corazón del mio papino es tan blando como su panza!\n@c0@"
  fr: "@aPandora@bComme c'est gênantⓠ Papa a le cœur presque aussi tendre que son ventre est rondⓠ\n@c0@"
  it: "@aViola@bIl mio paparino sta impazzendo di gioia.\n@c0@"
  ja: "@a@bデボラ「んもう　パパったら…\n\t顔が　おなかに　負けないくらい\n\tゆるんじゃってるわね。\n@c0@"
414:
  de: "@aGriselda@bEs ist ja süß, dass er sich so freut, aber manchmal übertreibt er einfach.\n@c0@"
  en: "@aDebora@bIt's sweet that he feels that way, but I wish he'd keep a bit of a lid on it.\n@c0@"
  es: "@aStefania@bMe alegra que se sienta así, pero preferiría que no lo mostrase troppo.\n@c0@"
  fr: "@aPandora@bC'est adorable qu'il ressente ça, mais j'aimerais mieux qu'il n'en fasse pas autant étalage.\n@c0@"
  it: "@aViola@bCapisco che è entusiasta di come si sono messe le cose, ma potrebbe anche cercare di contenersi un po'! Così mi mette in imbarazzo!\n@c0@"
  ja: "@a@bデボラ「恥ずかしいから　あんまり　顔に\n\t出しすぎないでほしいわ。\n\t気持ちは　うれしいんだけど。\n@c0@"
415:
  de: "@aGriselda@bDas hat Mama bestimmt schon seit Jahren auf dem Magen gelegen.\n㈡\nWahrscheinlich hat sie deshalb immer ein Auge zugedrückt, wenn ich mich mal wieder danebenbenommen hatte...\n@c0@"
  en: "@aDebora@bI'm sure Mama's been worried about this for years. Maybe that's why she always let me get away with behaving however I wanted.\n@c0@"
  es: "@aStefania@bSonno sicura que la mia mamma lleva años preocupada por esto. Quizá por eso siempre me dejaba salirme con la mía.\n@c0@"
  fr: "@aPandora@bJe suis sûre que ça fait des années que ça tracasse mamma. C'est peut-être pour ça qu'elle m'a toujours laissée me conduire comme je le voulais.\n@c0@"
  it: "@aViola@bQuesto pensiero deve aver tormentato mia madre per anni. Forse è per questo che mi ha sempre permesso di fare tutto ciò che volevo...\n@c0@"
  ja: "@a@bデボラ「ママは　ずっと気にしていたのね。\n\tだから　私のワガママを　何も言わずに\n\t聞いてくれて　いたのかしら……。\n@c0@"
416:
  de: "@aGriselda@bAber ich werde versuchen, meinen Ton in Zukunft zu mäßigen. ... Was sagst du da? Man kann nicht aus seiner Haut?\n@c0@"
  en: "@aDebora@bI'll have to try and tone it down a little bit from now on. ...What do you mean, that's not like me?\n@c0@"
  es: "@aStefania@bDe ahora en adelante intentaré moderarme un poco. ... ¿Cómo que no parecería io?\n@c0@"
  fr: "@aPandora@bJe devrais peut-être être un peu moins\nⓥrentre-dedansⓦ, maintenant...\nComment ça, ça ne me ressemble pasⓡ\n@c0@"
  it: "@aViola@bD'ora in poi cercherò di comportarmi in maniera più rispettosa verso gli altri.\n@c0@"
  ja: "@a@bデボラ「これからは　私も　少しは\n\tおとなしく　しないと　いけないわね。\n\t……え？　私らしくないって言いたいの？\n@c0@"
417:
  de: "@aGriselda@bWie kannst du es wagen?! Äh, ich meine... Ja, Schatz, genau.\n@c0@"
  en: "@aDebora@bHow dare you say such a thing!\nEr, I mean... Lovely, yes.\n@c0@"
  es: "@aStefania@b¡¿Come te atreves a decir una cosa così?!\nDigooo... Sí, meraviglioso.\n@c0@"
  fr: "@aPandora@bComment oses-tu dire une chose pareilleⓠ\nEuh, je veux dire... C'est adorable, oui.\n@c0@"
  it: "@aViola@bCome sarebbe a dire che non ci riuscirò mai?!\nSei proprio uno zuccone pappamoll...\n㈡\nEhm, volevo dire che dovresti avere più fiducia nella tua amata mogliettina e nella sua volontà di migliorarsi...\n@c0@"
  ja: "@a@bデボラ「あんた　そんなこと言える立場！？\n\t……って　ええっと\n\tな　なんでもないわ……。\n@c0@"
418:
  de: "@aGriselda@bOh, Papa ist manchmal so peinlich! Wir brauchen eine Riesen-Lasagne, um ihn ruhig zu stellen...\n@c0@"
  en: "@aDebora@bPapa can be so embarrassing sometimes!\r\nWhat he needs is a giant lasagne to shut him up.\n@c0@"
  es: "@aStefania@b¡A veces il mio papino me avergüenza!\nLo que necesita es una lasaña gigante para callarse.\n@c0@"
  fr: "@aPandora@bPapa est parfois vraiment embarrassantⓠ\nCe qu'il lui faut, c'est un bon plat de lasagnes\npour lui clouer le bec.\n@c0@"
  it: "@aViola@bIl mio paparino è una persona espansiva e spontanea.\nA volte anche troppo!\n@c0@"
  ja: "@a@bデボラ「んもう　パパったら…\n\t恥ずかしいから\n\tみっともないマネは　やめてよね！\n@c0@"
419:
  de: "@a%0%a001240@bHerr Onassetti ist doch auch mein Großvater, nicht? Weil er dein Vater ist, stimmt's, Mama?\n@c0@"
  en: "@a%0%a001240@bMr Briscoletti's my grandpa too, isn't he?\nBecause he's your dad, right, Mum?\n@c0@"
  es: "@a%0%a001240@bDon Rimaldi es mi abuelo también, ¿no?\nPorque él es tu padre, ¿verdad, mamá?\n@c0@"
  fr: "@a%0%a001240@bMonsieur Oscuroni est aussi mon grand-père, alorsⓡ Parce que c'est ton papa, c'est ça, mamanⓡ\n@c0@"
  it: "@a%0%a001240@bMammina, nonno Rick vuole più bene a me che a %a001250, non è vero?\nLei non è mica una nipote ⓕleggendariaⓖ...\n@c0@"
  ja: "@a@b%a001240「ルドマンさんは　本当に\n\tボクの　おじいちゃんだもんね。\n\tお母さんの　大事な　お父さんだから。\n@c0@"
420:
  de: "@aGriselda@bStimmt genau, %a001240. Und er tut einfach alles für mich! Du könntest ihn bestimmt auch um den kleinen Finger wickeln...\n@c0@"
  en: "@aDebora@bThat's right, %a001240. And he spoils me something rotten! I'm sure you could wrap him round your little finger as well.\n@c0@"
  es: "@aStefania@bAsí es, %a001240. ¡Y me tiene muy consentida! Credo que tú también podrías hacer de él lo que quisieras.\n@c0@"
  fr: "@aPandora@bC'est exact, %a001240. Et il m'a pourrie-gâtéeⓠ Je suis sûre que tu pourrais le mener par le bout du nez, toi aussi.\n@c0@"
  it: "@aViola@bNiente affatto, %a001240.\nNonno Rick vuole bene a te e a tua sorella esattamente allo stesso modo. Capito?\n@c0@"
  ja: "@a@bデボラ「そうよ　%a001240。\n\t娘に甘い　ステキな　お父さんなの。\n\tあんたも　いっぱい甘えなさい。\n@c0@"
421:
  de: "@aBianca@bGriselda hat sich kein bisschen verändert, was? Ich freue mich trotzdem, sie zu sehen.\n@c0@"
  en: "@aBianca@bDebora en't changed a bit, eh?\nIt's good to see her well, anyhow.\n@c0@"
  es: "@aBianca@bStefania no ha cambiado nada de nada, ¿sabes?\nPero me alegro de ver que está bien.\n@c0@"
  fr: "@aBianca@bPandora n'a pas changé d'un pouce, heinⓡ\nMais c'est bien de la voir en forme.\n@c0@"
  it: "@aBianca@bSbaglio o Viola s'è un po' addolcita?\nVoglio dire, i suoi modi sono sempre un po' scorbutici, ma questa volta ti ha fatto un complimento!\n@c0@"
  ja: "@a@bビアンカ「うん……　デボラさん\n\t前と　ぜんぜん変わってないね。\n\t元気そうで　よかったわ。\n@c0@"
422:
  de: "@a%0%a001240@bⓞFür einen wie dichⓟ? Was soll das heißen, Papa?\n@c0@"
  en: "@a%0%a001240@bⓗThe likes of youⓘ?\nWhat does that mean, Dad?\n@c0@"
  es: "@a%0%a001240@b¿ⓕAlguien come túⓖ?\n¿Qué ha querido decir, papi?\n@c0@"
  fr: "@a%0%a001240@bⓥQuelqu'un comme toiⓦⓡ\nQu'est-ce qu'elle veut dire par là, papaⓡ\n@c0@"
  it: "@a%0%a001240@bCome si permette di dare del ⓕpappamolleⓖ al padre dell'Eroe Leggendario?! Non sarà per caso invidiosa di non essere lei la mia mamma, eh?\n@c0@"
  ja: "@a@b%a001240「%a000090のくせに　って\n\tどういうことかな。\n@c0@"
423:
  de: "@a%0%a001250@bDiese Frau ist immer so... furchteinflößend!\n@c0@"
  en: "@a%0%a001250@bThat lady always seems so...scary!\n@c0@"
  es: "@a%0%a001250@b¡Esa señora siempre me pone los pelos de punta!\n@c0@"
  fr: "@a%0%a001250@bCette dame a toujours l'air aussi... effrayanteⓠ\n@c0@"
  it: "@a%0%a001250@bViola è sempre un po' selvatica quando si rivolge agli altri...\n@c0@"
  ja: "@a@b%a001250「お父さん…　私　このお姉さん\n\tやっぱり　怖いです……。\n@c0@"
424:
  de: "@aNera@bIch wusste, dass Griselda so was sagen würde...\n@c0@"
  en: "@aNera@bI feared as much. Debora...\n@c0@"
  es: "@aNera@bMe lo temía. Stefania...\n@c0@"
  fr: "@aNera@bC'est bien ce que je craignais. Pandora...\n@c0@"
  it: "@aNera@bAh, Viola...\nLa mia sorellona tigre è nata e tigre è rimasta...\n@c0@"
  ja: "@a@bフローラ「やっぱり　デボラ姉さんは……。\n@c0@"
425:
  de: "@aNera@b...\n@c0@"
  en: "@aNera@b............\n@c0@"
  es: "@aNera@b...\n@c0@"
  fr: "@aNera@b............\n@c0@"
  it: "@aNera@b...\n@c0@"
  ja: "@a@bフローラ「……………。\n@c0@"
