  it: "@aViola@bCerto, Bingo! Festeggia anche tu!\n㈡\nPerò non azzardarti a leccarmi il volto con quella tua linguaccia appiccicosa!\nMi sono appena rifatta il trucco...\n@c0@"
  ja: "@a@bデボラ「この子も　なんだか　うれしそうね。\n\tみんなが　よろこんでいるのが\n\tわかるのかしら。\n@c0@"
434:
  de: "@aGriselda@bDer gute Lothar. Er war immer schon so, auch als Kind. Immer musste er es übertreiben.\n@c0@"
