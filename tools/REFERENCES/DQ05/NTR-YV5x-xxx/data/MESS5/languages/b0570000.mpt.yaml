  it: "@aBianca@bSe la dea sta celebrando, dovremmo farlo anche noi!\nTi va di ballare, %a000090?\n@c0@"
  ja: "@a@bビアンカ「みんな　楽しそう。\n\tねえ　%a000090。\n\t私たちも　おどりましょうか？\n@c0@"
207:
