  ja: "@a@bデボラ「たぶん　気のせいだとは　思うけど。\n@c0@"
454:
  de: "@aGriselda@bHier gibt es nichts weiter als Bäder, genau wie immer. Aber trotzdem herrscht eine heitere Stimmung...\n@c0@"
  en: "@aDebora@bThere's nothing here but the baths, just like always. There's a cheerful air to the place, though.\n@c0@"
  es: "@aStefania@bAquí no hay más que los bagni, como siempre. Pero el lugar está muy animado.\n@c0@"
  fr: "@aPandora@bIl n'y a rien d'autre que les bains, ici, comme toujours. Mais on dirait que l'atmosphère est\r\nplus joyeuse.\n@c0@"
  it: "@aViola@bL'atmosfera qui è tranquilla come sempre...\nFatta eccezione per le manifestazioni di gioia per il nostro successo, ovviamente.\n@c0@"
  ja: "@a@bデボラ「あいかわらず　温泉以外は\n\tなにもない村ね。\n\tいまは　よろこびに　あふれているけど。\n@c0@"
455:
  de: "@aGriselda@bSo ein seniler Dummkopf. In einem richtigen Kampf hält der doch keine fünf Minuten durch.\n@c0@"
  en: "@aDebora@bWhat a silly old man. He wouldn't last five minutes in a fight at his age.\n@c0@"
  es: "@aStefania@b¡Vaya vecchio! Sonno sicura que le queda mucho tiempo por delante, con el mundo en pace y tanta... energía.\n@c0@"
  fr: "@aPandora@bCe vieil homme n'a plus toute sa tête. Il ne tiendrait même pas cinq minutes dans une bagarre.\n@c0@"
  it: "@aViola@bSarebbe il colmo se, dopo aver evitato di essere inghiottito dall'oscurità, ci lasciasse la pelle per l'emozione di vedere qualche bella ragazza!\n@c0@"
  ja: "@a@bデボラ「本当に　エッチな　おじいさんね。\n\t世界が　平和になったことだし\n\tこれだけ元気なら　きっと　長生きするわ。\n@c0@"
456:
  de: "@aGriselda@bWenn du mal so wirst wie er, %a000090, dann geht unsere Beziehung auch baden.\n@c0@"
  en: "@aDebora@bIf you turn out like him, %a000090, I'll never forgive you.\n@c0@"
  es: "@aStefania@bSi te vuelves come él, %a000090, no te lo perdonaré jamás, ¿capisci?\n@c0@"
  fr: "@aPandora@bSache qu'il est hors de question que tu deviennes comme lui en vieillissant, %a000090.\n@c0@"
  it: "@aViola@b%0%a000090, non dovrai pensare ad altra donna che a me.\n@c0@"
  ja: "@a@bデボラ「%a000090。　あんたが\n\tあのおじいさんみたいに　なったら\n\t許さないわよ。\n@c0@"
457:
  de: "@aGriselda@bDu wirst ein netter, fügsamer, sanftmütiger alter Mann. Sonst...\n@c0@"
  en: "@aDebora@bYou'll settle down and become a nice, obedient, docile old man. Or else!\n@c0@"
  es: "@aStefania@bSolo debes tener ojos per me. Ya sé que es evidente, pero aún así...\n@c0@"
  fr: "@aPandora@bToi, tu te rangeras et tu deviendras un gentil vieillard docile et obéissant... sinon gare à toiⓠ\n@c0@"
  it: "@aViola@bNon ti sono concesse distrazioni di alcun genere.\nSpero di essere stata chiara...\n@c0@"
  ja: "@a@bデボラ「あんたは　この　私だけを\n\t見ていれば　いいのよ。\n\t言わなくても　わかっていると　思うけど。\n@c0@"
458:
  de: "@aGriselda@bHmm... Er arbeitet wohl für Bianca, was? Ha ha! Verstehe!\n@c0@"
  en: "@aDebora@bHmm... So he's doing work on Bianca's place, is he?\r\nHa ha! I see!\n@c0@"
  es: "@aStefania@bMmm... Así que está trabajando en casa de Bianca, ¿vero?\n¡Ja, ja! ¡Ya veo!\n@c0@"
  fr: "@aPandora@bMmm... Alors il travaille chez Bianca, c'est çaⓡ\nHa haⓠ Je voisⓠ\n@c0@"
  it: "@aViola@bQuello dev'essere stato uno spasimente di Bianca...\nE forse lo è ancora!\n@c0@"
  ja: "@a@bデボラ「ふうん…　この人\n\tビアンカの家の　仕事をしてるのね。\n\tフフッ　なるほどね。\n@c0@"
459:
  de: "@aGriselda@bDeinen Gesichtsausdruck werd' ich nie vergessen, als du mit diesem Schleier ankamst.\n@c0@"
  en: "@aDebora@bI still haven't forgotten the look on your face when you brought me that veil.\n@c0@"
  es: "@aStefania@bNunca olvidaré la cara que tenías cuando me trajiste el velo.\n@c0@"
  fr: "@aPandora@bJe n'ai jamais oublié l'expression sur ton visage quand tu m'as apporté ce voile, %a000090.\n@c0@"
  it: "@aViola@bNon potrò mai scordare l'espressione che avevi quando mi portasti il velo nuziale...\n@c0@"
  ja: "@a@bデボラ「あんたが\n\tヴェールを　持ってきたときの顔\n\t今でも　忘れられないわ。\n@c0@"
460:
  de: "@aGriselda@bEs war, als würde dir alles, was um dich herum geschah, wie ein Traum vorkommen.\n@c0@"
  en: "@aDebora@bIt was as if you thought everything going on around you must be some kind of dream.\n@c0@"
  es: "@aStefania@bParecía que pensases que todo lo que te sucedía era un sogno.\n@c0@"
  fr: "@aPandora@bC'était comme si tu pensais que tout ce qui se passait autour de nous n'était rien d'autre qu'un rêve.\n@c0@"
  it: "@aViola@bEra come se tu stessi vivendo un sogno...\nE, in effetti, per te era un sogno!\nStavi per sposare la bellezza fatta donna!\n@c0@"
  ja: "@a@bデボラ「なんだか　自分のまわりで\n\t起こっていることが　夢みたいだ　って\n\tいうような　顔を　していたんだもの。\n@c0@"
461:
  de: "@aGriselda@bNein, Bianca auch?!\n@c0@"
  en: "@aDebora@bNot Bianca too?\n@c0@"
  es: "@aStefania@b¿Bianca también?\n@c0@"
  fr: "@aPandora@bNon, pas Bianca aussiⓡ\n@c0@"
  it: "@aViola@bNemmeno Bianca è figlia delle persone che l'hanno cresciuta...?\n@c0@"
  ja: "@a@bデボラ「えっ　ビアンカも……？\n@c0@"
462:
  de: "@aGriselda@b...\n@c0@"
  en: "@aDebora@b...............\n@c0@"
  es: "@aStefania@b...\n@c0@"
  fr: "@aPandora@b...............\n@c0@"
  it: "@aViola@b...\n@c0@"
  ja: "@a@bデボラ「……………。\n@c0@"
463:
  de: "@aGriselda@bUnser Volk hat sich wohl sehr auf unsere Rückkehr gefreut. Sieh sie dir nur an!\n@c0@"
  en: "@aDebora@bOur people have obviously been dying to see our homecoming. Just look at them all!\n@c0@"
  es: "@aStefania@bNuestro pueblo estaba loco por vernos ritornare. ¡Míralos!\n@c0@"
  fr: "@aPandora@bApparemment, notre peuple mourait d'impatience de nous voir revenir. Regarde-les tousⓠ\n@c0@"
  it: "@aViola@bAccidenti, quanto entusiasmo! I sudditi di Denim non vedevano l'ora che io tornassi a casa! Però credo che siano anche contenti del tuo ritorno, caro...\n@c0@"
  ja: "@a@bデボラ「国民　全てが\n\t私たちの　帰りを　待ちわびていたのね。\n\tほら　こんなにたくさん　集まっているわ。\n@c0@"
464:
  de: "@aGriselda@bWo willst du um diese Zeit denn hin?! Ich gehe nirgendwo mehr hin!\n@c0@"
  en: "@aDebora@bWhere do you think you're off to at a time like this? I'm not going anywhere!\n@c0@"
  es: "@aStefania@b¿A dove crees que vas a estas horas? ¡Yo no voy a ningún sitio ahora!\n@c0@"
  fr: "@aPandora@bOù crois-tu te sauver, dans un moment pareilⓡ\nMoi, je ne vais nulle partⓠ\n@c0@"
  it: "@aViola@bRipartire?!\nNon ci penso proprio!\nHo voglia di godermi il mio bel Regno di Denim!\n㈡\nLo so che tecnicamente è il TUO Regno di Denim, ma ti pare il momento di sottilizzare?!\n@c0@"
  ja: "@a@bデボラ「こんな時に　どこへ行くつもり？\n\t私は　他のどこへも　行きたくないわよ。\n@c0@"
465:
  de: "@aGriselda@bJetzt warten gar keine Abenteuer mehr auf uns. Irgendwie ist das auch traurig...\n@c0@"
  en: "@aDebora@bWe won't be setting off on any more adventures from here again. I feel a little bit sad in a way.\n@c0@"
  es: "@aStefania@bYa no volveremos a salir de aquí para vivere aventuras. En cierto modo, me siento un poco triste.\n@c0@"
  fr: "@aPandora@bNous ne partirons plus à l'aventure depuis cet endroit, désormais. Je me sens un peu triste, d'une certaine manière.\n@c0@"
  it: "@aViola@bAh, la nostra Greta...\nChissà cosa farà ora...\n㈡\nMagari potrebbe aprire un'agenzia di viaggi!\nSono certa che se la caverebbe proprio bene, vista la sua esperienza nell'organizzare comitive.\n@c0@"
  ja: "@a@bデボラ「もう　この酒場から\n\t旅に出ることは　ないのよね。\n\t少しだけ　さみしいような　気もするわ。\n@c0@"
466:
  de: "@aGriselda@bDu bist großartig, %a000090, ich hab's ja immer gewusst. Sonst hätte ich dich auch kaum als meinen Diener eingestellt...\n@c0@"
  en: "@aDebora@bYou are great, %a000090. I've always known it.\nI wouldn't have hired you as my servant otherwise.\n@c0@"
  es: "@aStefania@bEres genial, %a000090. Siempre lo he pensado.\nSi no, no te hubiese contratado come sirviente.\n@c0@"
  fr: "@aPandora@bTu es fantastique, %a000090. Je l'ai toujours su. Je ne t'aurais jamais engagé comme domestique, sinon.\n@c0@"
  it: "@aViola@bSei sempre stato un tipo in gamba, %a000090, anche quando eri un semplice pappamolle. Stare accanto a me, poi, ti ha fatto crescere e maturare.\n@c0@"
  ja: "@a@bデボラ「%a000090は　すごい人なのよ。\n\t私には　ずっと　わかっていたわ。\n\tだって　私のしもべがつとまるくらいだし。\n@c0@"
467:
  de: "@aGriselda@bDu musst nun hart an dir arbeiten, um ein noch besserer König zu werden als dein Vater.\n㈡\nIch weiß, dass du es schaffen kannst, schließlich möchtest du mich ja glücklich machen...\n@c0@"
  en: "@aDebora@bYou'll have to work hard now to be a an even finer king than your father was. I know you'll manage it, because you want to keep me happy.\n@c0@"
  es: "@aStefania@bAhora tendrás que trabajar duro para ser aún mejor rey que il tuo papino. Sé que lo conseguirás para que mantenerme felice.\n@c0@"
  fr: "@aPandora@bTu vas maintenant devoir travailler dur pour être encore meilleur roi que ton père. Je sais que tu y arriveras, parce que tu veux que je sois heureuse.\n@c0@"
  it: "@aViola@bContinua a impegnarti e a eseguire i miei ordini, e vedrai che diventerai il miglior sovrano che sia mai esistito al mondo!\n@c0@"
  ja: "@a@bデボラ「これからは　グランバニア国王として\n\tパパス王に　負けないよう　がんばるのよ。\n\t私に　いい思いを　させるためにね。\n@c0@"
468:
  de: "@aGriselda@b%0%a001210 scheint glücklich zu sein. Auch er hat seinen Teil beigetragen.\n@c0@"
  en: "@aDebora@b%0%a001210 looks really happy.\nI suppose he played his part too.\n@c0@"
  es: "@aStefania@b%0%a001210 parece molto felice.\nTambién ha jugado su papel en tutto esto.\n@c0@"
  fr: "@aPandora@b%0%a001210 semble vraiment heureux.\nIl a joué un rôle, lui aussi.\n@c0@"
  it: "@aViola@bAnche %a001210 è felice. E bisogna riconoscere che, senza i suoi artigli e le sue zanne, avremmo fatto molta più fatica in diverse situazioni...\n@c0@"
  ja: "@a@bデボラ「%a001210ったら\n\tあんなに　幸せそうな顔をして。\n\tあの子も　がんばったものね。\n@c0@"
469:
  de: "@aGriselda@bWenn ich jedes Mal eine Goldmünze bekommen würde, wenn mich jemand schön nennt...\n@c0@"
  en: "@aDebora@bIf I had a gold coin for every time someone called\r\nme beautiful!\n@c0@"
  es: "@aStefania@b¡Ojalá tuviese una moneta de oro por cada vez que me han piropeado!\n@c0@"
  fr: "@aPandora@bSi seulement je pouvais recevoir une pièce d'or chaque fois que quelqu'un me dit que je suis belleⓠ\n@c0@"
  it: "@aViola@bSe avessi una moneta per ogni volta che qualcuno mi ha fatto i complimenti per la mia sfolgorante bellezza, sarei la donna più ricca del mondo.\n@c0@"
  ja: "@a@bデボラ「この私が　美しいだなんて\n\tそんなこと　わかりきったことだわ。\n@c0@"
470:
  de: "@aGriselda@bDas war zwar nicht die eloquenteste Art, mir ein Kompliment zu machen, aber ich freue mich trotzdem.\n@c0@"
  en: "@aDebora@bThat wasn't the most eloquent version of it I've heard, but it still counts nonetheless.\n@c0@"
  es: "@aStefania@bHe oído piropos mejores, ma este cuenta igual.\n@c0@"
  fr: "@aPandora@bCe n'était certes pas la version la plus éloquente que j'aie entendue, mais ça compte quand même.\n@c0@"
  it: "@aViola@bIn ogni caso, quell'uomo ha detto una verità sacrosanta: sono sempre più bella...\n@c0@"
  ja: "@a@bデボラ「…でも　この商人　少しは使えそうね。\n\t何か　いい仕事を\n\t用意して　あげようかしら。\n@c0@"
471:
  de: "@aGriselda@bGlaubst du, dass es vielleicht besser gewesen wäre, mit einer ganzen Armee gegen Nimzo anzutreten?\n@c0@"
  en: "@aDebora@bDo you ever think it might've been better to just take a royal army along to defeat Nimzo?\n@c0@"
  es: "@aStefania@b¿No piensas que hubiese sido megliore llevar un ejército real para derrotar a Nimzo?\n@c0@"
  fr: "@aPandora@bTu ne te dis pas parfois que ça aurait été mieux d'emmener simplement une armée royale avec\nnous pour vaincre Nimzoⓡ\n@c0@"
  it: "@aViola@bSegnati il nome di questo tipo, %a000090.\n@c0@"
  ja: "@a@bデボラ「お城の兵士を　全員つれて\n\tミルドラースに挑む　っていうのも\n\tよかったとか思ってない？\n@c0@"
472:
  de: "@aGriselda@bDu Narr! Wir hätten doch nie alle durch das Tor nach Nadiria gepasst!\n@c0@"
  en: "@aDebora@bYou fool! We'd never have all fitted through the entrance to Nadiria!\n@c0@"
  es: "@aStefania@b¡Serás bobo! ¡No hubiésemos cabido tutti por la entrada de Nadiria!\n@c0@"
  fr: "@aPandora@bMais non, andouilleⓠ Nous n'aurions jamais réussi\nà franchir les portes de Nadiria tous ensembleⓠ\n@c0@"
  it: "@aViola@bSe mai ci ricapitasse di dover affrontare un perfido mostro, sarà il primo a essere arruolato nel nostro gruppo, così sarà contento...\n@c0@"
  ja: "@a@bデボラ「あんた　バカね。\n\tそんな大人数だと\n\t魔界へのトビラが　崩れるでしょ。\n@c0@"
473:
  de: "@aGriselda@bRecht viele Monster haben uns sogar geholfen, was, %a000090? Ich habe nichts dagegen, wenn die netten hier bei uns in Humburg wohnen...\n@c0@"
  en: "@aDebora@bQuite a few monsters helped us out, didn't they?\r\nI don't mind having the nice ones live alongside us here in Gotha.\n@c0@"
  es: "@aStefania@bNos han ayudado unos cuantos mostri, ¿vero?\nNo me importaría que los más amabile vinieran a vivir con nosotros a Pankraz.\n@c0@"
  fr: "@aPandora@bIl y a pas mal de monstres qui nous ont aidés,\nn'est-ce pasⓡ Ça ne me gêne pas que les plus\ngentils vivent à nos côtés ici, à Gotha.\n@c0@"
  it: "@aViola@bSe non avessimo stretto amicizia con un po' di mostri, forse oggi non staremmo qui a festeggiare, caro...\n@c0@"
  ja: "@a@bデボラ「魔物たちって　思っていたより\n\t使えたし　これからは　お城の中で\n\tいっしょに　暮らすのも　悪くないわね。\n@c0@"
474:
  de: "@aGriselda@bSei mal einen Moment still. Ich muss nachdenken.\n@c0@"
  en: "@aDebora@bDon't talk to me at the moment.\nI need to think.\n@c0@"
  es: "@aStefania@bAhora no me hables.\nNecesito pensare.\n@c0@"
  fr: "@aPandora@bNe me parle pas. Je réfléchis.\n@c0@"
  it: "@aViola@bUhm...\n@c0@"
  ja: "@a@bデボラ「待って。　今は　話しかけないで。\n\t考え中だから。\n@c0@"
475:
  de: "@aGriselda@bDieser Mann ist Dr. Ache... Und Dr. Ache ist der Zenithdrache! Ha ha! Ich kann's einfach nicht fassen!\n@c0@"
  en: "@aDebora@bThat man's Dr Agon... And Dr Agon is the Zenith Dragon! Ha ha! I don't believe it!\n@c0@"
  es: "@aStefania@bEse hombre es el Dr. Agón... ¡Y el Dr. Agón es el dragón de Zenithia! ¡Ja, ja! ¡Non posso creerlo!\n@c0@"
  fr: "@aPandora@bCe type est le Dr Agon... Et le Dr Agon est le Dragon du Zénithⓠ Ha haⓠ Je n'y crois pasⓠ\n@c0@"
  it: "@aViola@bMa sei proprio sicuro che il Dottor Agon sia il Drago di Zenithia in incognito?!\nIo ho qualche dubbio...\n㈡\nÈ troppo credibile come essere umano goffo e sbadato per non esserlo davvero!\n@c0@"
  ja: "@a@bデボラ「この男　じつはマスタードラゴンで\n\tマスタードラゴンは　竜の神さま……\n\tふふふ　これは　使えるわね。\n@c0@"
476:
  de: "@aNera@bOje, der ist aber ganz schön betrunken. Wahrscheinlich werden wir ihn nicht dazu kriegen können, Platz für uns zu machen...\n@c0@"
  en: "@aNera@bOh dear, he seems rather drunk. I'm afraid we probably won't be able to persuade him to make\r\nway for us.\n@c0@"
  es: "@aNera@bDiosa mia, sembra bastante borracho. Me temo que no podremos convencerlo para que nos abra paso.\n@c0@"
  fr: "@aNera@bOh là là. Il semble plutôt ivre. J'ai peur que nous n'arrivions pas à le convaincre de nous laisser passer.\n@c0@"
  it: "@aNera@bA giudicare dal fiato pesante che esce dalla sua bocca, questo galantuomo ha esagerato con i festeggiamenti...\n@c0@"
  ja: "@a@bフローラ「あらあら　この方　だいぶ\n\t酔ってらっしゃるわね。　これでは\n\t通してもらえそうに　ありませんわ。\n@c0@"
477:
  de: "@aGriselda@bWarum sind Betrunkene immer so nervig? Ich weiß, dass er glücklich ist, aber kann er mir nicht einfach aus dem Weg gehen?\n@c0@"
  en: "@aDebora@bWhy are drunks always so irritating? I know he's happy, but can't he just get out of my way?\n@c0@"
  es: "@aStefania@b¿Ma por qué los borrachos son siempre tan molestos? Ya sé que está contento, pero ¿por qué no se aparta y ya está?\n@c0@"
  fr: "@aPandora@bPourquoi les gens saouls sont-ils aussi énervantsⓡ Je sais qu'il est content, mais il ne peut pas simplement dégager de mon cheminⓡ\n@c0@"
  it: "@aViola@bGuardie, a me!\nAllontanate questo disturbatore della mia quiete personale!\n@c0@"
  ja: "@a@bデボラ「んもう　これだから酔っぱらいは……。\n\tうれしいのは　よく　わかったから\n\tそこを　どきなさいよ！\n@c0@"
478:
  de: "@aGriselda@bWir waren lange fort. Wir sollten sofort zum Thronsaal gehen, %a000090.\n@c0@"
  en: "@aDebora@bWe have been a while. We'd better make our way to the throne room now, %a000090.\n@c0@"
  es: "@aStefania@bEs un poco tarde. Será meglio que vayamos enseguida al salón del trono, %a000090.\n@c0@"
  fr: "@aPandora@bOn traîne depuis un moment. On ferait bien de\nse frayer un chemin jusqu'à la salle du trône, maintenant, %a000090. \n@c0@"
  it: "@aViola@bNon sei curioso di scoprire chi ci sta aspettando?\nAndiamo nella sala del trono, %a000090!\nForza, pigrone!\n@c0@"
  ja: "@a@bデボラ「もう　じゅうぶん　じらしたものね。\n\tそろそろ　王の間へ行くわよ　%a000090。\n@c0@"
479:
  de: "@aGriselda@bJetzt, wo Zenithia in alter Pracht erstrahlt, kann sie wohl endlich wieder nach Hause. Aber den Zenithdrachen wird sie dort nicht vorfinden...\n@c0@"
  en: "@aDebora@bI suppose she can go home to Zenithia now it's been restored to its former glory. She won't find the Zenith Dragon there, though!\n@c0@"
  es: "@aStefania@bSupongo que ya puede ritornare a Zenithia, ahora que ha recuperado su antigua gloria. ¡Pero no encontrará al dragón de Zenithia allí!\n@c0@"
  fr: "@aPandora@bElle peut rentrer chez elle, à Zénithia, maintenant que le château a retrouvé toute sa splendeur. Mais elle n'y trouvera pas le Dragon du Zénithⓠ\n@c0@"
  it: "@aViola@bImmagino che ora tornerà a Zenithia...\nChissà che faccia farà quando scoprirà che il Drago Divino non è più lì...\n@c0@"
  ja: "@a@bデボラ「天空城も　元にもどったし\n\tこの人も　やっと　帰ることができるわね。\n\tマスタードラゴンは　留守だけどね。\n@c0@"
480:
  de: "@aGriselda@bDas ist perfekt, %a000090.\n@c0@"
  en: "@aDebora@bThis is perfect, %a000090.\n@c0@"
  es: "@aStefania@bEs perfetto, %a000090.\n@c0@"
  fr: "@aPandora@bTout est parfait, %a000090.\n@c0@"
  it: "@aViola@bSono felice, %a000090.\n@c0@"
  ja: "@a@bデボラ「完ペキだわ　%a000090。\n@c0@"
481:
  de: "@aGriselda@bIch könnte nicht glücklicher sein.\n@c0@"
  en: "@aDebora@bI couldn't be any happier.\n@c0@"
  es: "@aStefania@bSoy inmensamente felice.\n@c0@"
  fr: "@aPandora@bJe ne pourrais pas être plus heureuse.\n@c0@"
  it: "@aViola@bAnzi, non potrei essere più felice...\n@c0@"
  ja: "@a@bデボラ「今　私は\n\t心から　満ち足りているわ。\n@c0@"
482:
  de: "@aGriselda@bEs ist solch ein schönes Gefühl, von allen angehimmelt zu werden...\n@c0@"
  en: "@aDebora@bIt's such a wonderful feeling to be adored by everyone like this.\n@c0@"
  es: "@aStefania@bLa sensazione de que tutto il mondo te adora es genial.\n@c0@"
  fr: "@aPandora@bC'est un sentiment si merveilleux d'être adorée par tout le monde, comme ça.\n@c0@"
  it: "@aViola@bAvevo sempre desiderato essere acclamata da una folla osannante, e ora il mio sogno è diventato realtà. È una sensazione meravigliosa! Ih ih ih!\n@c0@"
  ja: "@a@bデボラ「皆が　こんなにも\n\t私を　祝福しているのが\n\tわかるから……。\n@c0@"
483:
  de: "@aGriselda@bBeim kleinsten Anlass bricht er in Tränen aus... Na ja, irgendwie ist das ja auch süß.\n@c0@"
  en: "@aDebora@bHe cries at the drop of a hat, that one!\nI suppose it's quite sweet in a way.\n@c0@"
