  ja: "@a@bフローラ「この町が　こんなに\n\tにぎやかなのを見たのは　初めて……。\n\t私も　すこし　おどろうかしら？\n@c0@"
199:
  de: "@a%0%a001240@bSieh dir das an! Hier tanzt einfach jeder! Es sieht aus wie ein Festival!\n@c0@"
