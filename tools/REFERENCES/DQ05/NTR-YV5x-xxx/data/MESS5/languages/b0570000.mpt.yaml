0:
  de: "@a%0%a001240@bUi! Ein Unterschied wie Tag und Nacht! Dr. Ache sieht als Zenithdrache ja ganz anders aus!\n@c0@"
  en: "@a%0%a001240@bWhat a transformation! Dr Agon looks totally amazing when he turns into the Zenith Dragon!\n@c0@"
  es: "@a%0%a001240@b¡Menuda transformación! El Dr. Agón tiene una pinta increíble cuando se convierte en el Dragón de Zenithia.\n@c0@"
  fr: "@a%0%a001240@bQuelle transformationⓠ Le Dr Agon est\nimpressionnant quand il prend la forme\ndu Dragon du Zénithⓠ\n@c0@"
  it: "@a%0%a001240@bChe trasformazione, eh?\nSembra incredibile che il Dottor Agon sia in realtà il Drago di Zenithia...!\n@c0@"
  ja: "@a@b%a001240「プサンさんって\n\tドラゴンの姿のときは\n\t見ちがえるほど　りっぱだよね！\n@c0@"
1:
  de: "@a%0%a001240@bWenn er in seiner menschlichen Form nicht ganz so bieder rüberkommen würde, wär's nicht gleich so 'n Schock, wenn er sich verwandelt.\n@c0@"
  en: "@a%0%a001240@bHe should try to be a bit cooler in his human form, then it wouldn't be such a shock when he changes.\n@c0@"
  es: "@a%0%a001240@bDebería intentar ser algo más normal en su forma humana, así no sería tan llamativo el cambio.\n@c0@"
  fr: "@a%0%a001240@bIl devrait essayer d'être plus normal sous sa forme humaine. Le choc ne serait pas aussi rude après la transformation.\n@c0@"
  it: "@a%0%a001240@bPersonalmente, lo preferisco quando ha l'aspetto di un drago...\nÈ troppo forte!\n@c0@"
  ja: "@a@b%a001240「人間のときも\n\tもうちょっと　しっかりしてると\n\tかっこいいのになあ。\n@c0@"
2:
  de: "@a%0%a001250@bPapa, jetzt ist unsere Aufgabe getan, oder? Ich meine, auf der Welt herrscht doch wieder Frieden, nicht?\n@c0@"
  en: "@a%0%a001250@bDad, our quest's over now, isn't it?\nI mean, the world's at peace, right?\n@c0@"
  es: "@a%0%a001250@bPapi, nuestra misión ha terminado ya, ¿verdad?\nEs decir, el mundo está en paz, ¿no?\n@c0@"
  fr: "@a%0%a001250@bPapa, notre quête est finie, alorsⓡ\nLa paix est revenue, nonⓡ\n@c0@"
  it: "@a%0%a001250@bPapà, la nostra missione è finita?\nSiamo riusciti a riportare la pace, non è vero?\n@c0@"
  ja: "@a@b%a001250「あの…　お父さん。\n\tわたしたち　勝ったのよね？\n\t世界は　平和になったのよね？\n@c0@"
3:
  de: "@aBianca@bNa, dann komm. Zeit zu gehen. Die guten Leutchen von Humburg warten schon auf die Heimkehr ihres großen Helden.\n@c0@"
  en: "@aBianca@bCome on, then. Time to go. The people of Gotha are waitin' for their great leader to come home.\n@c0@"
  es: "@aBianca@bEntonces, vamos. Es hora de marcharse. Las gentes de Pankraz esperan la vuelta de su gran gobernante.\n@c0@"
  fr: "@aBianca@bAlors allons-y. Il est temps de partir. Gotha attend\r\nle retour de son grand roi.\n@c0@"
  it: "@aBianca@bDirei che possiamo andare, amore.\nLa gente di Denim attende con ansia il ritorno del suo Re!\n@c0@"
  ja: "@a@bビアンカ「さあ　行きましょ。\n\tグランバニアのみんなが\n\tたよれる王さまを　待ってるわよ。\n@c0@"
4:
  de: "@aNera@bDu hast dich großartig gehalten, %a001240. Und du auch, %a001250. Ihr wart beide so... (Schnüff) Gleich fange ich an zu weinen.\n@c0@"
  en: "@aNera@bYou've been so good, %a001240. And you, %a001250. You've both been so wonderⓚⓛ\nOh, no. Now, now I'm going to cry.\n@c0@"
  es: "@aNera@bHas sido muy buono, %a001240. Y tú, %a001250. Habéis sido los due meravi... ¡Oh, no! Ahora voy a llorar.\n@c0@"
  fr: "@aNera@bTu as été si fort, %a001240. Toi aussi, %a001250. Vous avez été merveilleux...\nOh non, je vais me mettre à pleurer.\n@c0@"
  it: "@aNera@b%0%a001240, %a001250...\nSiete stati bravissimi...\nIo... Sob! Oh, sono commossa!\n@c0@"
  ja: "@a@bフローラ「%a001240も　%a001250も\n\t本当に　よく　がんばったわね……。\n\tやだ…　なみだが……。\n@c0@"
5:
  de: "@a%0%a001240 und %0%a001250@bNein, nicht weinen, Mama! Ach, Mama...\n@c0@"
  en: "@a%0%a001240 & %0%a001250@bDon't cry, Mum. Oh, Mum...\n@c0@"
  es: "@a%0%a001240 y %a001250@bNo llores, mami. Ay, mami...\n@c0@"
  fr: "@a%0%a001240 et %0%a001250@bPleure pas, maman. Oh, maman...\n@c0@"
  it: "@a%0%a001240 e %a001250@bOh, mamma...\nNon piangere, dai.\nLe lacrime lasciale allo zio Sancho!\n@c0@"
  ja: "@a@b%a001240「泣かないで　お母さん。\n%a001250「お母さん……。\n@c0@"
6:
  de: "@a%0%a001250@bPapa, jetzt ist unsere Aufgabe getan, oder? Ich meine, auf der Welt herrscht doch wieder Frieden, nicht?\n@c0@"
  en: "@a%0%a001250@bDad, our quest's over now, isn't it?\nI mean, the world's at peace, right?\n@c0@"
  es: "@a%0%a001250@bPapi, nuestra misión ha terminado ya, ¿verdad?\nEs decir, el mundo está en paz, ¿no?\n@c0@"
  fr: "@a%0%a001250@bPapa, notre quête est finie, alorsⓡ\nLa paix est revenue, nonⓡ\n@c0@"
  it: "@a%0%a001250@bPapà, la nostra missione è finita?\nSiamo riusciti a riportare la pace, non è vero?\n@c0@"
  ja: "@a@b%a001250「あの…　お父さん。\n\tわたしたち　勝ったのよね？\n\t世界は　平和になったのよね？\n@c0@"
7:
  de: "@a%0%a001240@bJa, bestimmt verwandelt er sich bald wieder in diesen prima Drachen zurück... stimmt doch, Papa?\n@c0@"
  en: "@a%0%a001240@bYeah, surely he'll go back to being that cool dragon again soon...won't he, Dad?\n@c0@"
  es: "@a%0%a001240@bSí, seguro que pronto volverá a ser ese dragón tan simpático, ¿no crees, papá?\n@c0@"
  fr: "@a%0%a001240@bNon, il va sûrement se retransformer en dragon bientôt... pas vrai, papaⓡ\n@c0@"
  it: "@a%0%a001240@bSecondo me il Drago di Zenithia si diverte a trasformarsi nel Dottor Agon e a vivere nel mondo degli uomini...\n@c0@"
  ja: "@a@b%a001240「ええっ　まさか……。\n\tそれはない…　よね？　お父さん。\n@c0@"
8:
  de: "@a%0%a001240@bDu, Papa. Sollten wir nicht die Feen besuchen und ihnen erzählen, was passiert ist?\n@c0@"
  en: "@a%0%a001240@bHey, Dad. We'd better go and tell all the faeries what's happened sometime, hadn't we?\n@c0@"
  es: "@a%0%a001240@b¡Eh, papá! Tendremos que ir un día a contarles a las hadas lo que ha ocurrido, ¿no?\n@c0@"
  fr: "@a%0%a001240@bPapa, on devrait aller voir les fées, un de ces jours, pour leur raconter ce qui s'est passé.\n@c0@"
  it: "@a%0%a001240@bPapà, mi prometti che un giorno torneremo nel Regno delle Fate? Voglio raccontare a quelle dolcissime creaturine tutto quello che è successo!\n@c0@"
  ja: "@a@b%a001240「妖精の村の　みんなにも\n\tいつか　報告に行かなくちゃね！\n\tお父さん！\n@c0@"
9:
  de: "@a%0%a001250@bJa! Tausend süße Küsse! Für dich, Papa, und für Mama und für %a001240! Und für alle anderen auch! Kommt, lasst uns tanzen!\n@c0@"
  en: "@a%0%a001250@bYes! Sweet joy and candy kisses!\nTo you, Dad, and to Mum and %a001240.\nAnd to everyone! Come on. Let's all dance!\n@c0@"
  es: "@a%0%a001250@b¡Sí! ¡Dulce dicha y besos de caramelo!\nPara ti, papi, y para mamá y %a001240.\n¡Y para todo el mundo! ¡Venga, vamos a bailar!\n@c0@"
  fr: "@a%0%a001250@bOuiⓠ Douce joie et baisers sucrésⓠ\nPour toi, papa, et pour maman et %a001240.\nEt pour tout le mondeⓠ Allezⓠ Dansons tousⓠ\n@c0@"
  it: "@a%0%a001250@bSì, gioia, gaudio e felicità per tutti!\nE soprattutto per il mio papà, per la mia mamma e per %a001240!\n@c0@"
  ja: "@a@b%a001250「クルリン　クルリン……。\n\tお父さんも　お母さんも　お兄ちゃんも\n\tいっしょに　おどろうよ！　ねっ！\n@c0@"
10:
  de: "@aNera@bAch ja! Tanzen ist jetzt genau das Richtige! So glücklich war ich schon seit Jahren nicht mehr!\n@c0@"
  en: "@aNera@bOh, yes! Why don't we all dance?\nI haven't felt so happy in years!\n@c0@"
  es: "@aNera@b¡Oh, sí! ¿Por qué no bailamos todos?\n¡Hace años que no era tan felice!\n@c0@"
  fr: "@aNera@bOh ouiⓠ Pourquoi ne pas danserⓡ\nCela fait des années que je n'avais\npas été si heureuseⓠ\n@c0@"
  it: "@aNera@bForza, ballliamo!\nCelebriamo il ritorno della pace!\n@c0@"
  ja: "@a@bフローラ「私も　おどろうかしら。\n\tこんな楽しい気分　ひさしぶり。\n@c0@"
11:
  de: "@a%0%a001240@bJa, aufregend und schön, nicht? So geht's mir auch!\n@c0@"
  en: "@a%0%a001240@bBusy but happy, though, right?\nI know exactly how she feels.\n@c0@"
  es: "@a%0%a001240@bOcupada, pero contenta, ¿verdad?\nSé bien cómo se siente.\n@c0@"
  fr: "@a%0%a001240@bOccupée, mais heureuse, heinⓡ\nJe comprends tout à fait ce qu'elle veut dire.\n@c0@"
  it: "@a%0%a001240@bSì, è una faticaccia, ma il suo lavoro permetterà alle future generazioni di conoscere gli eventi che hanno salvato il mondo dall'oscurità...\n@c0@"
  ja: "@a@b%a001240「いそがしいって\n\t言ってるわりには　うれしそうだね。\n\tすっごく　わかるけど。\n@c0@"
12:
  de: "@aBianca@bDiese Zenithianerin ist ja ganz aus dem Häuschen geraten, was?\n@c0@"
  en: "@aBianca@bThat Zenithian got in a flap just now, eh?\n@c0@"
  es: "@aBianca@bEl de Zenithia se ha puesto histérico, ¿eh?\n@c0@"
  fr: "@aBianca@bCe Zénithien a eu un sacré moment de panique, heinⓡ\n@c0@"
  it: "@aBianca@bGli Zenithiani sono fortunati ad avere come capo una creatura giusta e saggia...\n@c0@"
  ja: "@a@bビアンカ「そういえば　さっき\n\tマスタードラゴンの言葉に\n\tおつきの天空人が　あわててたわね。\n@c0@"
13:
  de: "@aBianca@bMeinst du, der Zenithdrache reagiert aufbrausend, wenn etwas nicht nach seinen Vorstellungen läuft?\n@c0@"
  en: "@aBianca@bD'you reckon the Zenith Dragon has a bit of a temper on him if things en't done right?\n@c0@"
  es: "@aBianca@b¿No te parece que el Dragón de Zenithia se pone un poco atacado cuando las cosas no se hacen a su gusto?\n@c0@"
  fr: "@aBianca@bTu crois que le Dragon du Zénith s'énerve facilement si tout n'est pas fait comme il fautⓡ\n@c0@"
  it: "@aBianca@bDirei che sono fortunati quasi quanto i sudditi di Denim, che hanno per sovrano una persona splendida come te, amore mio...\n@c0@"
  ja: "@a@bビアンカ「あれって　どういうこと？\n\tマスタードラゴンって\n\tちょっと　変わり者なの？\n@c0@"
14:
  de: "@aNera@bSollten wir nicht bald aufbrechen? Ich kann's kaum erwarten, das mit eigenen Augen zu sehen! Die Welt im Frieden!\n@c0@"
  en: "@aNera@bShould we get going soon? I can't wait to see it with my own eyes. The world at peace!\n@c0@"
  es: "@aNera@b¿Nos vamos ya? Estoy veramente impaciente per verlo con mis propios ojos. ¡El mundo en pace!\n@c0@"
  fr: "@aNera@bAllons-nous bientôt partirⓡ J'ai hâte de voir ça\nde mes propres yeuxⓢ le monde enfin en paixⓠ\n@c0@"
  it: "@aNera@bChe ne diresti di andar via?\nNon vedo l'ora di tornare nel nostro mondo e di riabbracciare i miei genitori!\n@c0@"
  ja: "@a@bフローラ「さあ　行きましょうか。\n\t世界が　本当に平和になったのかどうか\n\tこの目で　はやく　見てみたいわ。\n@c0@"
15:
  de: "@a%0%a001240@bWo wohl Dr. Ache ist?\n@c0@"
  en: "@a%0%a001240@bI wonder where Dr Agon is.\n@c0@"
  es: "@a%0%a001240@b¿Dónde estará el Dr. Agón?\n@c0@"
  fr: "@a%0%a001240@bJe me demande où est le Dr Agon.\n@c0@"
  it: "@a%0%a001240@bChissà dov'è andato il Dottor Agon...\n@c0@"
  ja: "@a@b%a001240「プサンさんは\n\tどこで　待ってるのかな？\n@c0@"
16:
  de: "@a%0%a001240@bZenithia sieht jetzt auch klasse aus.\n@c0@"
  en: "@a%0%a001240@bZenithia looks amazing now too.\n@c0@"
  es: "@a%0%a001240@bTambién Zenithia está increíble ahora.\n@c0@"
  fr: "@a%0%a001240@bZénithia est vraiment impressionnant, maintenant.\n@c0@"
  it: "@a%0%a001240@bIl Castello di Zenithia è tornato in perfette condizioni.\n@c0@"
  ja: "@a@b%a001240「天空城も　すっかり\n\tきれいになったね。\n@c0@"
17:
  de: "@a%0%a001240@bMan kann es sich gar nicht mehr vorstellen, dass es bis vor kurzem noch ganz unter Wasser stand.\n@c0@"
  en: "@a%0%a001240@bIt's hard to imagine it was completely flooded not that long ago.\n@c0@"
  es: "@a%0%a001240@bCuesta imaginar que no hace mucho estaba totalmente inundada.\n@c0@"
  fr: "@a%0%a001240@bC'est difficile de se dire que ce château était complètement inondé il n'y a pas si longtemps.\n@c0@"
  it: "@a%0%a001240@bRicordo ancora lo stato pietoso in cui si trovava quand'era allagato...\nEra uno spettacolo davvero avvilente...\n@c0@"
  ja: "@a@b%a001240「ちょっと前まで\n\t水の中に　沈んでたなんて\n\tウソみたいだよ。\n@c0@"
18:
  de: "@aBianca@bBei so viel Dankbarkeit weiß man gar nicht, wohin mit sich selbst, was?\n@c0@"
  en: "@aBianca@bIt's hard to know what to do with yourself when someone's showin' so much gratitude, eh?\n@c0@"
  es: "@aBianca@bNo sabes dónde meterte cuando te muestran tanto agradecimiento, ¿verdad?\n@c0@"
  fr: "@aBianca@bCe n'est pas facile de savoir comment réagir quand quelqu'un manifeste autant de gratitude, heinⓡ\n@c0@"
  it: "@aBianca@bSiamo stati bravi, eh?\nSì, siamo stati proprio bravi!\n@c0@"
  ja: "@a@bビアンカ「あんなに　よろこばれると\n\tちょっとだけ　照れるわね。\n@c0@"
19:
  de: "@aBianca@bAber diesen Dank hast du dir redlich verdient, %a000090. Du hast schließlich das Ganze ins Rollen gebracht.\n@c0@"
  en: "@aBianca@bYou deserve all the thanks you get, though, %a000090. You're the one who made all this happen.\n@c0@"
  es: "@aBianca@bPero mereces toda la gratitud que estás recibiendo, %a000090. Tú eres el que ha hecho posible todo esto, ¿sabes?\n@c0@"
  fr: "@aBianca@bMais tu mérites tous ces remerciements, %a000090. Tout ça, c'est grâce à toi.\n@c0@"
  it: "@aBianca@bMa la maggior parte del merito è tua, %a000090.\nSe non fosse stato per te, non credo che oggi saremmo qui a celebrare il ritorno della serenità...\n@c0@"
  ja: "@a@bビアンカ「でも　私も　すべて\n\t%a000090のおかげだと　思うわよ。\n@c0@"
20:
  de: "@a%0%a001240@bUi! Zenithia kann richtig hoch fliegen, was?!\n@c0@"
  en: "@a%0%a001240@bWow! Zenithia can fly really, really high, can't it!?\n@c0@"
  es: "@a%0%a001240@b¡Vaya! ¡Zenithia puede volar bien alto, ¿eh?!\n@c0@"
  fr: "@a%0%a001240@bWaouhⓠ Zénithia peut voler vraiment très\nhaut, heinⓠⓑ\n@c0@"
  it: "@a%0%a001240@bAccidenti!\nNon credevo che Zenithia potesse volare tanto in alto!\n@c0@"
  ja: "@a@b%a001240「すごーい。\n\t天空城って　こんなに高くまで\n\t上がるんだね……。\n@c0@"
21:
  de: "@a%0%a001240@bOh! B-Beim Runtergucken wird's einem ganz anders!\n@c0@"
  en: "@a%0%a001240@bWhoa... L-Looking down gives you goosebumps!\n@c0@"
  es: "@a%0%a001240@bHuy... ¡Mirar hacia abajo pone la carne de gallina!\n@c0@"
  fr: "@a%0%a001240@bOuaaah... Ça me donne la chair de poule de regarder en bas.\n@c0@"
  it: "@a%0%a001240@bSe guardo in basso, mi vengono le vertigini!\nUhm, non sarò mica stato contagiato da %a001250, eh?!\n@c0@"
  ja: "@a@b%a001240「ひゃあ……。\n\t下を見てたら　とりはだが\n\tゾワゾワ　たっちゃったよ。\n@c0@"
22:
  de: "@aBianca@bIn hundert und tausend Jahren, was?\n@c0@"
  en: "@aBianca@bForever and ever and ever, eh?\n@c0@"
  es: "@aBianca@bPor los siglos de los siglos, ¿eh?\n@c0@"
  fr: "@aBianca@bPour l'éternitéⓡ\n@c0@"
  it: "@aBianca@bLe nostre gesta verranno tramandate di generazione in generazione, per l'eternità...\n@c0@"
  ja: "@a@bビアンカ「永遠に…　か。\n@c0@"
23:
  de: "@aBianca@bManchmal denk ich, es wär gar nicht so schlecht, irgendwann wieder in eine Statue verwandelt zu werden.\n@c0@"
  en: "@aBianca@bI sometimes think it wouldn't be such a bad thing if\r\nI got turned into a statue again one day.\n@c0@"
  es: "@aBianca@bA veces pienso que no estaría tan mal volver a ser una estatua un día de estos.\n@c0@"
  fr: "@aBianca@bParfois, je me dis que ce ne serait pas forcément\r\nun mal qu'on me transforme à nouveau en statue,\r\nun jour.\n@c0@"
  it: "@aBianca@bA proposito di eternità, a volte penso che non mi dispiacerebbe essere trasformata nuovamente in statua...\n@c0@"
  ja: "@a@bビアンカ「私ね　なんだったら\n\tもう一度　石になっても\n\tいいかな…　って思うの。\n@c0@"
24:
  de: "@aBianca@bDann könnten wir bis in alle Ewigkeit zusammenbleiben ⓚⓛ du und ich, Seite an Seite.\n@c0@"
  en: "@aBianca@bThat way, we could stay together for all eternity, you and me lined up side-by-side.\n@c0@"
  es: "@aBianca@bDe esa forma podríamos estar juntos toda la eternidad, tú y yo, el uno junto al otro, ¿sabes?\n@c0@"
  fr: "@aBianca@bComme ça, on pourrait rester tous les deux ensemble jusqu'à la fin des temps.\n@c0@"
  it: "@aBianca@bIn quel modo, resterei eternamente giovane e bella!\nIh ih ih!\n@c0@"
  ja: "@a@bビアンカ「ただし　%a000090が\n\t永遠に　そばにいてくれるっていう\n\t条件つきよ。\n@c0@"
25:
  de: "@aNera@bIn hundert und... tausend Jahren?\n@c0@"
  en: "@aNera@bForever and ever...and ever?\n@c0@"
  es: "@aNera@b¿Por los siglos de los siglos... de los siglos eternos?\n@c0@"
  fr: "@aNera@bPour l'éternitéⓡ\n@c0@"
  it: "@aNera@bAbbiamo fatto un buon lavoro, %a000090...\n@c0@"
  ja: "@a@bフローラ「永遠に…　ですか。\n@c0@"
26:
  de: "@aNera@bManche sagen, wenn man stirbt, sterben auch die Gefühle.\n@c0@"
  en: "@aNera@bSome people say your feelings die with you when you pass away.\n@c0@"
  es: "@aNera@bMa hay quien dice que los sentimientos mueren cuando muere la persona.\n@c0@"
  fr: "@aNera@bCertains disent que les sentiments meurent en même temps que le corps.\n@c0@"
  it: "@aNera@bOra potrò finalmente concentrarmi su ciò a cui tengo di più al mondo...\n@c0@"
  ja: "@a@bフローラ「人の気持ちに　永遠はないって\n\tいいますけど……\n@c0@"
27:
  de: "@aNera@bAber ich weiß, ich werde dich immer lieben, hundert Jahre lang, tausend Jahre lang und noch viel länger.\n@c0@"
  en: "@aNera@bBut I know I'll always love you, forever and ever and ever.\n@c0@"
  es: "@aNera@bPero yo sé que sempre ti amaré, por los siglos de los siglos de los siglos eternos.\n@c0@"
  fr: "@aNera@bMais moi, je sais que je t'aimerai toujours... pour l'éternité...\n@c0@"
  it: "@aNera@b%0%a001250, %a001240 e te, %a000090.\nTi amo, tesoro!\n@c0@"
  ja: "@a@bフローラ「あなたを　永遠に愛することなら\n\tかんたんに　できそうですわ。\n@c0@"
28:
  de: "@a%0%a001250@bIch wollte dich schon lange mal was fragen, Papa...\n@c0@"
  en: "@a%0%a001250@bI've been meaning to ask you, Dad...\n@c0@"
  es: "@a%0%a001250@bQuería preguntarte algo, papi...\n@c0@"
  fr: "@a%0%a001250@bPapa, je voulais te demander...\n@c0@"
  it: "@a%0%a001250@bPapà, è da un po' che voglio chiederti una cosa...\n@c0@"
  ja: "@a@b%a001250「あの　おじいちゃん\n\tおはんらって言った……。\n\t……おはんら？\n@c0@"
29:
  de: "@a%0%a001250@bWarum lebt dieser alte Mann eigentlich hinter einem Kamin?\n@c0@"
  en: "@a%0%a001250@bWhy does that old man live behind a fireplace?\n@c0@"
  es: "@a%0%a001250@b¿Por qué vive ese anciano detrás de una chimenea?\n@c0@"
  fr: "@a%0%a001250@bPourquoi ce vieux monsieur, il vit derrière\nune cheminéeⓡ\n@c0@"
  it: "@a%0%a001250@bPerché quel vecchio signore vive dietro un camino?!\n@c0@"
  ja: "@a@b%a001250「ねえ　お父さん。\n\tおはんらって　どういう意味？\n@c0@"
30:
  de: "@aBianca@bDas war eine ganz schön lange und anstrengende Reise, was?\n@c0@"
  en: "@aBianca@bIt has bin a pretty tough old journey at times, eh?\n@c0@"
  es: "@aBianca@bHa sido un viajecito con momentos bastante duros, ¿sabes?\n@c0@"
  fr: "@aBianca@bÇa a été un sacré voyage, pas vraiⓡ\n@c0@"
  it: "@aBianca@bIl nostro viaggio è stato lungo e faticoso...\n@c0@"
  ja: "@a@bビアンカ「けっこう\n\tつらい旅だったんだけどな。\n@c0@"
31:
  de: "@aBianca@bGlücklicherweise stand die Göttin uns zur Seite und hat uns geleitet.\n@c0@"
  en: "@aBianca@bAt least the Goddess was there to guide us every step of the way.\n@c0@"
  es: "@aBianca@bMenos mal que la Diosa nos estuvo guiando a cada paso del camino.\n@c0@"
  fr: "@aBianca@bAu moins, la Déesse a toujours été à nos côtés pour nous montrer le chemin.\n@c0@"
  it: "@aBianca@bMa non ho mai perso la speranza di farcela...\nSapevo che potevamo contare sulla protezione della dea e sull'aiuto del Drago di Zenithia.\n@c0@"
  ja: "@a@bビアンカ「終わってみれば　すべて\n\t神の　おみちびきに　なるのよね。\n@c0@"
32:
  de: "@a%0%a001250@bDas ist ein Schleim!\n@c0@"
  en: "@a%0%a001250@bIt's a slime!\n@c0@"
  es: "@a%0%a001250@b¡Es un limo!\n@c0@"
  fr: "@a%0%a001250@bC'est un gluantⓠ\n@c0@"
  it: "@a%0%a001250@bPapà, guarda!\nUno Slime!\n@c0@"
  ja: "@a@b%a001250「あっ　スライムさん！\n@c0@"
33:
  de: "@a%0%a001250@bEin Glück! Ich hatte schon Angst, dass auch die guten Monster von der Welt verschwunden sein würden.\n@c0@"
  en: "@a%0%a001250@bWhat a relief! I was worried that the good monsters would've disappeared from the world too.\n@c0@"
  es: "@a%0%a001250@b¡Qué alivio! Temía que también hubieran desaparecido del mundo los monstruos buenos.\n@c0@"
  fr: "@a%0%a001250@bÇa me rassureⓠ À un moment, j'ai eu peur que les gentils monstres aient disparu aussi.\n@c0@"
  it: "@a%0%a001250@bAh, che sollievo...\nTemevo che la nostra vittoria avesse fatto sparire anche i mostri buoni...\n@c0@"
  ja: "@a@b%a001250「よかった。\n\tいい魔物さんは　この世界に\n\tのこれたのね。\n@c0@"
34:
  de: "@aNera@bVersucht der Schleim, uns den Weg zu versperren? Vielleicht will er nicht, dass wir schon weggehen.\n@c0@"
  en: "@aNera@bIs this slime trying to block our path?\nMaybe it doesn't want us to leave here yet.\n@c0@"
  es: "@aNera@b¿Está ese limo intentando cortarnos el paso?\nSembra que no quiere que nos marchemos aún.\n@c0@"
  fr: "@aNera@bCe gluant est-il en train d'essayer de nous barrer la routeⓡ Il ne veut peut-être pas que nous partions.\n@c0@"
  it: "@aNera@bSecondo te quello Slime sta cercando di dirci qualcosa?\nForse non vuole che ce ne andiamo...?\n@c0@"
  ja: "@a@bフローラ「あら　スライムさんが通せんぼ？\n\tここからは　外に\n\t出られないってことかしら。\n@c0@"
35:
  de: "@aBianca@bWas für ein herrlicher Himmel! Der passende Hintergrund für unseren triumphalen Sieg!\n@c0@"
  en: "@aBianca@bOoh, what a pretty sky! It's the perfect backdrop for how triumphant we're all feelin', eh?\n@c0@"
  es: "@aBianca@b¡Oooh, es un cielo precioso! El telón de fondo perfecto para nuestra sensación de triunfo, ¿sabes?\n@c0@"
  fr: "@aBianca@bOh, quel joli cielⓠ C'est le décor idéal pour accompagner notre joie d'avoir réussi. \n@c0@"
  it: "@aBianca@bIl cielo è meraviglioso oggi...\nSembra che abbia indossato i suoi colori più belli per celebrare il trionfo del bene sul male...\n@c0@"
  ja: "@a@bビアンカ「うわ～　きれいな空！\n\t今の　私たちの気分のようね！\n@c0@"
36:
  de: "@aNera@bWas für ein wunderschöner Anblick! Eigentlich ist alles einfach perfekt, seit wir wieder zusammen sind.\n@c0@"
  en: "@aNera@bWhat a beautiful view! In fact, ever since we were reunited, everything's been just perfect.\n@c0@"
  es: "@aNera@b¡Quella vista bellíssima! En realtà, desde que nos hemos reunido todo parece perfecto.\n@c0@"
  fr: "@aNera@bQuelle vue magnifiqueⓠ En fait, depuis que nous sommes à nouveau réunis, tout est simplement parfait.\n@c0@"
  it: "@aNera@bChe panorama favoloso...!\nNon credo di averne mai visti di così belli...\n@c0@"
  ja: "@a@bフローラ「きれいな景色……。\n\tあなたと　再会してからは\n\tステキなことばかりですわね。\n@c0@"
37:
  de: "@aNera@bWas? Was mit den schweren Zeiten ist? Von schweren Zeiten weiß ich nichts mehr. Wenn es welche gab, muss ich sie glatt vergessen haben.\n@c0@"
  en: "@aNera@bWhat? What about the hard times? Well, if there were any hard times, I've completely forgotten\r\nabout them now.\n@c0@"
  es: "@aNera@b¿Eh? ¿Qué pasa con los momentos difíciles? Bueno, si hubo momentos difíciles están tutti olvidados allora.\n@c0@"
  fr: "@aNera@bCommentⓡ Et les mauvais momentsⓡ\nEh bien, s'il y a eu des mauvais moments, je les ai complètement oubliés.\n@c0@"
  it: "@aNera@bSì, il peggio è passato.\nOra possiamo nuovamente guardare al futuro con fiducia.\n@c0@"
  ja: "@a@bフローラ「えっ？　つらいことですか？\n\tあったかも知れませんけど\n\tもう　忘れてしまいましたわ……。\n@c0@"
38:
  de: "@a%0%a001240@bUi! Schau nur, wie hoch wir sind! Haaalllooo! Haaalllooo!\n@c0@"
  en: "@a%0%a001240@bWahoo! Look how high we are!\nYoo-hoo! Yoo-hoo!\n@c0@"
  es: "@a%0%a001240@b¡Yujuu! ¡Qué altos estamos!\n¡Yujuuu! ¡Yujuuu!\n@c0@"
  fr: "@a%0%a001240@bWaouhⓠ Regarde comme on est hautⓠ\nYouhouⓠ\n@c0@"
  it: "@a%0%a001240@bSiamo in alto!\nSempre più in alto!\nEh eh eh eh eh!\n@c0@"
  ja: "@a@b%a001240「うわー！　高いなー！\n\tヤッホー！！\n@c0@"
39:
  de: "@a%0%a001250@bS-Sei vorsichtig, Papa. P-Pass auf, dass du nicht fällst. Das tut bestimmt weh.\n@c0@"
  en: "@a%0%a001250@bB-Be careful, Dad. M-Mind you don't fall.\nIt looks like it would hurt.\n@c0@"
  es: "@a%0%a001250@bT-ten cuidado, papá. Procura no caerte.\nCreo que dolería.\n@c0@"
  fr: "@a%0%a001250@bF-Fais attention, papa. Ne t-tombe pas.\nJe crois que ça ferait mal.\n@c0@"
  it: "@a%0%a001250@bPapà, stai attento a non cadere!\n@c0@"
  ja: "@a@b%a001250「お…お父さん。\n\t足もと　気をつけて……。\n\t落ちたら　たぶん痛いの……。\n@c0@"
40:
  de: "@a%0%a001240@bJippieh! Wir dürfen wieder auf dem Zenithdrachen reiten!\n@c0@"
  en: "@a%0%a001240@bYes! We're going to get to ride on the\nZenith Dragon again!\n@c0@"
  es: "@a%0%a001240@b¡Sí! ¡Tenemos que volver a montar en el Dragón de Zenithia!\n@c0@"
  fr: "@a%0%a001240@bOuaisⓠ On va refaire un tour sur le Dragon du Zénithⓠ\n@c0@"
  it: "@a%0%a001240@bAllora faremo un altro giro in groppa al Drago di Zenithia?!\nFantastico!\n@c0@"
  ja: "@a@b%a001240「また　マスタードラゴンの\n\t背中に乗れるね！　やった～！\n@c0@"
41:
  de: "@aBianca@bWie schade, dass wir deine Mutter nur ein einziges Mal gesehen haben.\n@c0@"
  en: "@aBianca@bIt's a shame we only got to meet your mum the once.\n@c0@"
  es: "@aBianca@bQué pena que solo hayamos visto una vez a tu madre.\n@c0@"
  fr: "@aBianca@bC'est dommage qu'on ait vu ta maman\r\nqu'une seule fois.\n@c0@"
  it: "@aBianca@bMi spiace che abbiamo potuto incontrare tua madre una sola volta...\nEra una persona davvero speciale.\n@c0@"
  ja: "@a@bビアンカ「本当に　お母さまには\n\t一度しか会えなくて\n\tざんねんだったわね。\n@c0@"
42:
  de: "@aBianca@bAber ich bin sicher, sie wird über uns wachen. Also sieh zu, dass du dich immer anständig benimmst!\n@c0@"
  en: "@aBianca@bBut I'm sure she's watchin' over you all the time. You'd better make sure you stay on your best behaviour!\n@c0@"
  es: "@aBianca@bPero estoy segura de que te protege continuamente. ¡Más vale que procures comportarte lo mejor que sepas!\n@c0@"
  fr: "@aBianca@bMais je suis sûre qu'elle veille sur toi tout le temps. Tu as intérêt à bien te tenirⓠ\n@c0@"
  it: "@aBianca@bPerò sono certa che ora ci guarda dall'alto e ci sorride.\nIl suo ricordo resterà per sempre nei nostri cuori...\n@c0@"
  ja: "@a@bビアンカ「でも　お母さま　ずっと\n\t見守ってくださってるわ。　だから\n\t悪いことはしないでね！　…なんてね♪\n@c0@"
43:
  de: "@aNera@bIch... Ich werde deine Mutter nie vergessen. Wie großmütig von ihr, Menschen und Ungeheuern zu helfen, während sie selbst gefangen saß.\n@c0@"
  en: "@aNera@bI-I'll never forget your mother.\r\nShe was such a wonderful woman, helping people and monsters even while she was held captive.\n@c0@"
  es: "@aNera@bNunca olvidaré a la tua mamma.\nEra una mujer maravillosa que ayudaba a personas y monstruos incluso estando prigioniera.\n@c0@"
  fr: "@aNera@bJ-Je n'oublierai jamais ta mère. C'était une femme si merveilleuse. Elle aidait les monstres et les gens,\r\nmême quand elle était retenue prisonnière.\n@c0@"
  it: "@aNera@bTua madre era la persona più generosa che abbia mai conosciuto, %a000090...\n㈡\nNonostante fosse prigioniera nel Regno degli Inferi, non ha mai smesso di aiutare gli altri.\n@c0@"
  ja: "@a@bフローラ「私…　とらわれながらも\n\tたくさんの人や魔物を　助けた\n\tお母さまのこと…　一生忘れませんわ。\n@c0@"
44:
  de: "@a%0%a001240@bDann hab ich also nicht nur was von dir und Mama, sondern sogar von Großmutter und Großvater, stimmt's, Papa?\n@c0@"
  en: "@a%0%a001240@bSo, as well as having some of you and Mum in me,\nI've got a little bit of Grandma and Grandpa in me too, right, Dad?\n@c0@"
  es: "@a%0%a001240@bEntonces, además de tener algo tuyo y de mamá, también tengo algo de la abuela y el abuelo, ¿verdad, papá?\n@c0@"
  fr: "@a%0%a001240@bIl y a un peu de toi et de maman en moi,\nmais il y a aussi un peu de grand-père et\nde grand-mère, nonⓡ\n@c0@"
  it: "@a%0%a001240@bPapà, visto che sono tuo figlio, posso dire che dentro di me vive una parte di nonna Mada e di nonno Russel?\n@c0@"
  ja: "@a@b%a001240「お父さんと　お母さんと\n\tおじいちゃんと　おばあちゃんの血。\n@c0@"
45:
  de: "@a%0%a001240@bHa, bin ich ein Glückspilz! Und du auch, %a001250, findest du nicht?\n@c0@"
  en: "@a%0%a001240@bThat's amazing. I, I feel really lucky.\nDon't you, %a001250?\n@c0@"
  es: "@a%0%a001240@bEs estupendo. Me siento muy, muy afortunado.\n¿Y tú, %a001250?\n@c0@"
  fr: "@a%0%a001240@bC'est génial. J'ai vraiment de la chance.\nTu n'es pas d'accord, %a001250ⓡ\n@c0@"
  it: "@a%0%a001240@bÈ una sensazione bellissima, sai?\nE sono certo che anche per te è così, %a001250!\n@c0@"
  ja: "@a@b%a001240「そのすべてが　この身体に\n\t流れてると思うと　すごく感動する。\n\t%a001250も　そうだろ？\n@c0@"
46:
  de: "@a%0%a001250@bJa! Da haben wir wirklich Schwein gehabt, %a001240.\n@c0@"
  en: "@a%0%a001250@bYes! We are lucky, %a001240.\n@c0@"
  es: "@a%0%a001250@b¡Sí! Tenemos mucha suerte, %a001240.\n@c0@"
  fr: "@a%0%a001250@bSiⓠ On a beaucoup de chance, %a001240.\n@c0@"
  it: "@a%0%a001250@bSì, %a001240.\nAbbiamo una famiglia meravigliosa...\n@c0@"
  ja: "@a@b%a001250「うんっ！　お兄ちゃんっ！\n@c0@"
47:
  de: "@a%0%a001250@bIch hätte gern noch länger mit Großmutter geredet! Aber Hauptsache, sie ist glücklich, wo sie jetzt ist.\n@c0@"
  en: "@a%0%a001250@bI, I wish I'd had the chance to talk to Grandma more, but I know she's happy now.\n@c0@"
  es: "@a%0%a001250@bOjalá hubiera podido hablar más con la abuela, pero sé que ella es feliz ahora.\n@c0@"
  fr: "@a%0%a001250@bJ'aurais aimé pouvoir parler à grand-mère plus longuement, mais je sais qu'elle est heureuse, maintenant.\n@c0@"
  it: "@a%0%a001250@bAvrei tanto voluto parlare ancora con la nonna...\nAh, non fa nulla.\nCiò che conta è che ora lei non soffre più.\n@c0@"
  ja: "@a@b%a001250「わたし　おばあちゃんと　もっと\n\tいろんなこと話したかったけど…\n\tでも　もう　いいの……。\n@c0@"
48:
  de: "@a%0%a001250@bImmer, wenn ich an sie denke, spüre ich jetzt ihren Blick voller Liebe auf uns ruhen. Auch jetzt, da sie fort ist, ist sie immer noch ein Teil von uns.\n@c0@"
  en: "@a%0%a001250@bAnd whenever I think of her, I can feel her warm, loving eyes watching over us. Even though she's gone, she's still a part of all of us.\n@c0@"
  es: "@a%0%a001250@bY siempre que pienso en ella puedo sentir su presencia cálida y amorosa que nos protege.\n㈡\nAunque se haya marchado, sigue siendo parte de todos nosotros.\n@c0@"
  fr: "@a%0%a001250@bEt quand je pense à elle, je peux sentir son regard bienveillant sur nous. Même si elle n'est plus là,\nelle est encore en nous. \n@c0@"
  it: "@a%0%a001250@bSai una cosa, papà?\nOgni volta che penso a nonna Mada, sento un grande calore dentro di me.\n㈡\nCredo che sia vero che le persone amate vivono per sempre nei nostri cuori... Nonna Mada mi sarà vicina, anche se non potrò vederla!\n@c0@"
  ja: "@a@b%a001250「おばあちゃんのこと想っただけで\n\t胸が　あったかくなるから　きっと\n\tおばあちゃん　わたしの胸の中にいるの。\n@c0@"
49:
  de: "@aBianca@bIch würd' ja zu gern mal die Version deiner Mutter hören, du nicht?\n@c0@"
  en: "@aBianca@bIt would've bin interestin' to hear your mum's version of events, eh?\n@c0@"
  es: "@aBianca@bHabría sido interesante escuchar la versión de tu madre sobre lo ocurrido, ¿no?\n@c0@"
  fr: "@aBianca@bJ'aurais bien aimé entendre ta maman nous donner sa version des choses.\n@c0@"
  it: "@aBianca@bMi avrebbe fatto piacere sapere direttamente da tua madre come andarono le cose...\n@c0@"
  ja: "@a@bビアンカ「そうだったんだ……。\n\tお母さまの　クチからも\n\tその時の話を　聞いてみたかったな。\n@c0@"
50:
  de: "@aNera@bAch, ich weiß ganz genau, wie es deiner Mutter damals ergangen sein muss!\n@c0@"
  en: "@aNera@bI know exactly how your mother must have felt then.\n@c0@"
  es: "@aNera@bSé perfectamente como debió sentirse la tua mamma.\n@c0@"
  fr: "@aNera@bJe sais exactement ce que ta mère a dû ressentir,\r\nà l'époque.\n@c0@"
  it: "@aNera@bRussel ha acceso la fiamma dell'amore nel cuore di Mada...\n@c0@"
  ja: "@a@bフローラ「その時の　お母さまの気持ち\n\tよくわかりますわ。\n@c0@"
51:
  de: "@aNera@bDenn ich hatte doch auch jemanden, der mein Herz erobert und mich zum Strahlen gebracht hat! Das warst du!\n@c0@"
  en: "@aNera@bAfter all, I've had a light lit in my heart ⓚⓛ by you!\n@c0@"
  es: "@aNera@bDespués de tutto, yo he sentido una luz en il mio cuore. ¡La tuya!\n@c0@"
  fr: "@aNera@bAprès tout, moi aussi, j'ai une lueur dans le cœur.\nEt c'est toi qui la fais brillerⓠ\n@c0@"
  it: "@aNera@bE tu l'hai accesa nel mio, %a000090.\nSono immensamente felice di averti conosciuto, tesoro...\n@c0@"
  ja: "@a@bフローラ「だって　私も　あなたに\n\t光を　ともしてもらったんですもの。\n@c0@"
52:
  de: "@a%0%a001240@bDann war Großmutter also eine Prinzessin in Gefangenschaft und Großvater der Ritter in strahlender Rüstung, der sie gerettet hat? Klasse!\n@c0@"
  en: "@a%0%a001240@bSo Grandma was a captive princess and Grandpa was the knight who came to rescue her! Cool!\n@c0@"
  es: "@a%0%a001240@b¡Así que la abuela era una princesa cautiva y el abuelo el caballero que llegó a rescatarla! ¡Genial!\n@c0@"
  fr: "@a%0%a001240@bAlors comme ça, grand-mère était une princesse captive et grand-père est le chevalier qui est venu la sauverⓠ Classeⓠ\n@c0@"
  it: "@a%0%a001240@bInsomma, nonna Mada era prigioniera e nonno Russel l'ha liberata, eh?\n㈡\nSembra proprio che i membri della nostra famiglia siano destinati a non avere una vita tranquilla!\n@c0@"
  ja: "@a@b%a001240「やっぱり　おばあちゃんって\n\tとらわれの　お姫さまだったんだね。\n\tそして　おじいちゃんに助けられたんだ！\n@c0@"
53:
  de: "@a%0%a001250@bNur gut, dass die Menschen in Steile Höh irgendwann gemerkt haben, dass Großvater doch gar nicht so übel war.\n@c0@"
  en: "@a%0%a001250@bIt's good that the people of Lofty Peak have realised Grandpa wasn't a bad person at last.\n@c0@"
  es: "@a%0%a001250@bQué bien que la gente de Cumbre Excelsa al final se haya dado cuenta de que el abuelo no era mala persona.\n@c0@"
  fr: "@a%0%a001250@bC'est bien que les gens de Haute-Cime aient réalisé que grand-père n'était pas quelqu'un de méchant.\n@c0@"
  it: "@a%0%a001250@bSono contenta che gli abitanti di Picco Maximo abbiano finalmente capito che nonno Russel non era una cattiva persona.\n@c0@"
  ja: "@a@b%a001250「今になって　だけど\n\tおじいちゃんのこと　わかってもらえて\n\tよかった……。\n@c0@"
54:
  de: "@a%0%a001240@bJetzt gibt's keinen Grund mehr, traurig zu sein, wenn ich Großmutters altes Zimmer sehe.\n@c0@"
  en: "@a%0%a001240@bI don't have to feel sad any more now when I see Grandma's old room.\n@c0@"
  es: "@a%0%a001240@bYa no volveré a ponerme triste cuando vea la habitación de la abuela.\n@c0@"
  fr: "@a%0%a001240@bMaintenant, je ne serai plus triste en voyant l'ancienne chambre de grand-mère.\n@c0@"
  it: "@a%0%a001240@bOra non sono più triste quando penso a nonna Mada, sai?\n@c0@"
  ja: "@a@b%a001240「もう\n\tおばあちゃんの部屋を見ても\n\t悲しくならないや……。\n@c0@"
55:
  de: "@a%0%a001240@bIch meine, jetzt ist sie doch glücklich, oder? Sie und Großvater sind wieder zusammen. Ich wette, irgendwo haben sie eine Menge Spaß miteinander!\n@c0@"
  en: "@a%0%a001240@bI mean, she's happy now, isn't she?\nShe and Grandpa are together again now.\nI bet they're having fun somewhere.\n@c0@"
  es: "@a%0%a001240@bPorque ahora ella es feliz, ¿verdad?\nElla y el abuelo ya vuelven a estar juntos.\nSeguro que se están divirtiendo por ahí.\n@c0@"
  fr: "@a%0%a001240@bC'est vrai. Elle est heureuse, désormais. Grand-père et elle sont à nouveau ensemble et je parie qu'ils sont en train de s'amuser quelque part là-haut.\n@c0@"
  it: "@a%0%a001240@bAnzi, sono felice!\nAdesso è insieme a nonno Russel, e niente potrà più separarli!\n@c0@"
  ja: "@a@b%a001240「だって　今ごろは　おばあちゃん\n\tおじいちゃんと　楽しく遊んでるよね？\n@c0@"
56:
  de: "@aBianca@bAlso herrscht auf der Welt jetzt wirklich Frieden. Das wird einem erst so richtig klar, wenn man wieder mit beiden Beinen fest auf dem Boden steht.\n@c0@"
  en: "@aBianca@bSo the world really is at peace. Comin' back down to earth really brings it home to you.\n@c0@"
  es: "@aBianca@bO sea, que el mundo está en paz de verdad. Al bajar de nuevo a la tierra es cuando te das cuenta, ¿sabes?\n@c0@"
  fr: "@aBianca@bLa paix est vraiment revenue. C'est en redescendant sur terre qu'on s'en aperçoit.\n@c0@"
  it: "@aBianca@bSolo ora che siamo tornati nel mondo degli uomini mi rendo davvero conto che il pericolo è passato...\n@c0@"
  ja: "@a@bビアンカ「本当に\n\t世界は平和になったのね。\n\t地上におりてきて　やっと実感したわ。\n@c0@"
57:
  de: "@aNera@bDie Welt im Frieden... Bilde ich mir das nur ein oder hat sich alles wirklich ein klein bisschen verändert? Selbst die Luft kommt mir irgendwie frischer vor.\n@c0@"
  en: "@aNera@bA peaceful world... Is it just me, or does everything feel a bit different now? Even the air seems fresher somehow.\n@c0@"
  es: "@aNera@bUn mundo pacífico... ¿Es cosa mía o tutto parece un poco distinto ahora? Hasta el aire resulta más fresco.\n@c0@"
  fr: "@aNera@bUn monde en paix... C'est moi ou tout semble différent, maintenantⓡ Même l'air paraît plus frais.\n@c0@"
  it: "@aNera@bSi sente che il mondo non è più minacciato dall'oscurità...\nSi respira un'aria serena, gioiosa, felice!\n㈡\nÈ come se tutti si fossero risvegliati da un incubo spaventoso!\n@c0@"
  ja: "@a@bフローラ「これが　平和な世界……。\n\t空気が　ちがって感じるのは\n\t気のせいじゃありませんわよね。\n@c0@"
58:
  de: "@a%0%a001240@bAlle sehen so glücklich aus. Das ist die schönste Belohnung für alles, was wir getan haben.\n@c0@"
  en: "@a%0%a001240@bEveryone looks so happy.\nThat's our reward for all the things we've done.\n@c0@"
  es: "@a%0%a001240@bTodo el mundo parece muy feliz.\nEsa es nuestra recompensa por todo lo que hemos hecho.\n@c0@"
  fr: "@a%0%a001240@bTout le monde a l'air si heureux.\nC'est notre récompense pour tout\nce que nous avons fait.\n@c0@"
  it: "@a%0%a001240@bPapà, sai una cosa? La felicità che leggo negli occhi delle persone è la ricompensa più preziosa che potessimo avere per gli sforzi che abbiamo compiuto!\n@c0@"
  ja: "@a@b%a001240「みんな\n\t幸せそうな　顔してるね！\n\tがんばってよかった！\n@c0@"
59:
  de: "@a%0%a001250@bMama, Großmutter ist jetzt glücklich, oder? Irgendwo da oben im Himmel...\n@c0@"
  en: "@a%0%a001250@bMum, Grandma's happy now, isn't she?\nSomewhere up in the sky...\n@c0@"
  es: "@a%0%a001250@bMami, la abuela ahora es feliz, ¿verdad?\nAllá arriba, en al cielo...\n@c0@"
  fr: "@a%0%a001250@bMaman, grand-mère est heureuse, maintenant, heinⓡ\nQuelque part dans le ciel...\n@c0@"
  it: "@a%0%a001250@bSecondo me adesso nonna Mada è felice e ci sorride dal cielo...\n@c0@"
  ja: "@a@b%a001250「ねえ　お父さん。\n\tおばあちゃん　お空の上で\n\t幸せにしてる…　よね？\n@c0@"
60:
  de: "@aBianca@bJa. Ich glaube nicht, dass wir Nimzo ohne die Hilfe deiner Mutter hätten besiegen können.\n@c0@"
  en: "@aBianca@bYeah. I doubt we could've defeated Nimzo if it weren't for your mum's help.\n@c0@"
  es: "@aBianca@bSí. Dudo que hubiéramos derrotado a Nimzo de no ser por la ayuda de tu madre, ¿sabes?\n@c0@"
  fr: "@aBianca@bMouais. On n'aurait sûrement pas pu vaincre Nimzo sans l'aide de ta maman.\n@c0@"
  it: "@aBianca@bSe tua madre non ci avesse aiutati, dubito che saremmo riusciti a sconfiggere Nimzo...\n@c0@"
  ja: "@a@bビアンカ「そうね。　お母さまの\n\tチカラがなければ　きっと\n\tミルドラースに　勝てなかったわ。\n@c0@"
61:
  de: "@a%0%a001240@bSie sprechen von Großmutter, stimmt's? Magdalena, so lautete doch ihr richtiger Name, nicht?\n@c0@"
  en: "@a%0%a001240@bThey mean Grandma, right?\nMadalena was Grandma's full name, wasn't it?\n@c0@"
  es: "@a%0%a001240@bSe refieren a la abuela, ¿no?\nPerséfone era el nombre de la abuela, ¿verdad?\n@c0@"
  fr: "@a%0%a001240@bIl parle de grand-mère, c'est çaⓡ\nC'était Magdalena, le nom de grand-mère, heinⓡ\n@c0@"
  it: "@a%0%a001240@bMaddalena è il nome completo di nonna Mada, non è vero?\n@c0@"
  ja: "@a@b%a001240「マーサさまって\n\tおばあちゃんのことだよね？\n@c0@"
62:
  de: "@a%0%a001240@bAlle Welt hat meine Großmutter geliebt. Weil sie nämlich die Allerbeste war!\n@c0@"
  en: "@a%0%a001240@bEveryone loved my Grandma. That's because she was the best!\n@c0@"
  es: "@a%0%a001240@bTodos querían a mi abuela. ¡Porque era la mejor!\n@c0@"
  fr: "@a%0%a001240@bTout le monde aimait grand-mère.\nC'est parce qu'elle était la meilleureⓠ\n@c0@"
  it: "@a%0%a001240@bSono proprio contento di sapere che mia nonna era amata da tutti!\n@c0@"
  ja: "@a@b%a001240「こんなに　みんなから\n\t愛されてる　おばあちゃんを持てて\n\tボク　すごく　うれしいよ！\n@c0@"
63:
  de: "@a%0%a001250@bHi hi hi! Das macht mich ganz verlegen...\n@c0@"
  en: "@a%0%a001250@bHa ha ha! This is so embarrassing!\n@c0@"
  es: "@a%0%a001250@b¡Ja, ja, ja! ¡Me da un poco de apuro!\n@c0@"
  fr: "@a%0%a001250@bHa ha haⓠ C'est vraiment embarrassantⓠ\n@c0@"
  it: "@a%0%a001250@bEh eh eh!\nMi fa piacere ricevere tanti complimenti, però la cosa mi imbarazza un po'...\n@c0@"
  ja: "@a@b%a001250「そんなふうに　言われたら\n\tくすぐったくなっちゃう。\n@c0@"
64:
  de: "@aNera@bIch weiß! Bei so viel Lob weiß man gar nicht, wo man hinschauen soll, nicht?\n@c0@"
  en: "@aNera@bI know! It's difficult taking all this praise, isn't it?\n@c0@"
  es: "@aNera@b¡Ya lo sé! Es difícil aceptar tantos elogios, ¿vero?\n@c0@"
  fr: "@aNera@bJe saisⓠ C'est difficile d'accepter les éloges,\nn'est-ce pasⓡ\n@c0@"
  it: "@aNera@bNemmeno io mi sento a mio agio quando sono al centro dell'attenzione, %a001250.\nBeh, prima o poi ci faremo l'abitudine! Ih ih ih!\n@c0@"
  ja: "@a@bフローラ「うふふ…　そうね。\n\tお母さんも　くすぐったいわ。\n@c0@"
65:
  de: "@aBianca@bAch? Dass deine Mutter und dein Vater miteinander fortgelaufen waren, ist mir ja ganz neu! Auch nicht schlecht!\n@c0@"
  en: "@aBianca@bI didn't know your mum and dad eloped! Nice one!\n@c0@"
  es: "@aBianca@b¡No sabía que tu madre y tu padre se habían fugado juntos! ¡Muy bueno!\n@c0@"
  fr: "@aBianca@bJe ne savais pas que ta maman et ton papa s'étaient enfuisⓠ Bien jouéⓠ\n@c0@"
  it: "@aBianca@bRussel e Mada sono stati uniti da un amore grandissimo, %a000090.\nProprio come noi...\n@c0@"
  ja: "@a@bビアンカ「えっ！？　お母さまたちって\n\tかけおち　だったの？\n\tう～ん　やるわねえ……。\n@c0@"
66:
  de: "@aNera@bJa, das ist es wirklich, nicht? Es war einfach Schicksal. Genau, wie es Schicksal war, dass ich dir begegnet bin.\n@c0@"
  en: "@aNera@bIt is romantic, isn't it? And all thanks to the hand of destiny. Just like me meeting you was.\n@c0@"
  es: "@aNera@bQué romántico, ¿no? Y tutto, gracias a la mano del destino. Como mi encuentro contigo.\n@c0@"
  fr: "@aNera@bOh oui, c'est très romantique, n'est-ce pasⓡ\nNous pouvons remercier le destin.\nComme pour notre rencontre.\n@c0@"
  it: "@aNera@bChe storia romantica!\nSembra quasi scritta dal destino, sai?\nProprio come la nostra, %a000090.\n@c0@"
  ja: "@a@bフローラ「ええ…　運命的ですわよね。\n\t私と　あなたが出会ったのも……。\n@c0@"
67:
  de: "@a%0%a001250@bDie Frau ist ja ganz hin und weg vor lauter Romantik!\n@c0@"
  en: "@a%0%a001250@bThat woman's completely wrapped up in the whole romantic idea of it all!\n@c0@"
  es: "@a%0%a001250@b¡Esa mujer está totalmente absorbida por el romanticismo de toda la historia!\n@c0@"
  fr: "@a%0%a001250@bCette femme fait une fixation sur le romantismeⓠ\n@c0@"
  it: "@a%0%a001250@bAnch'io un giorno mi innamorerò perdutamente di un uomo, com'è capitato a mamma e a nonna...\n㈡\nPerò farei volentieri a meno di essere rapita e tenuta prigioniera per anni!\n@c0@"
  ja: "@a@b%a001250「さっきのお姉ちゃん\n\tうっとりしてた。\n@c0@"
68:
  de: "@aBianca@bIch werde für sie beten, dass sie alle ihren Weg zur Göttin finden mögen.\n@c0@"
  en: "@aBianca@bI'll be prayin' for 'em, prayin' that they all find their way to the Goddess.\n@c0@"
  es: "@aBianca@bRezaré por ellos, rezaré para que todos encuentren el camino hacia la Diosa.\n@c0@"
  fr: "@aBianca@bJe prierai pour eux. Je prierai pour qu'ils trouvent leur chemin jusqu'à la Déesse.\n@c0@"
  it: "@aBianca@bPregherò perché le anime di quegli sfortunati possano riposare in pace...\n@c0@"
  ja: "@a@bビアンカ「私も　祈るわ。\n\tあそこで　眠る人たちが\n\t天国へ行けるように……。\n@c0@"
69:
  de: "@aNera@bSie hat recht. Wir dürfen nicht all jene vergessen, die für den Frieden ihr Leben hingegeben haben. Ich werde sie auch in meine Gebete einschließen.\n@c0@"
  en: "@aNera@bShe's absolutely right. We mustn't forget all those who died for peace. I'm going to pray for them too.\n@c0@"
  es: "@aNera@bTiene tutta la razón. No debemos olvidar a quienes murieron per la pace. Yo también voy a orare por ellos.\n@c0@"
  fr: "@aNera@bElle a tout à fait raison. Nous ne devons pas oublier tous ceux qui sont morts pour la paix. Je vais prier pour eux, moi aussi.\n@c0@"
  it: "@aNera@bHa ragione.\nNon dobbiamo dimenticare il sacrificio di coloro che sono morti per mano della Setta di Zugzwang...\n@c0@"
  ja: "@a@bフローラ「そうね。　ぎせいになった方々を\n\t忘れてはいけませんわ。\n\t私も　お祈りさせていただきます……。\n@c0@"
70:
  de: "@aNera@bIch wüsste gern, wo unser eigentliches Zuhause ist. Ich meine, wo ich und Griselda geboren wurden, bevor Mama und Papa uns adoptierten.\n@c0@"
  en: "@aNera@bI wonder where mine and Debora's hometown is.\r\nI mean the place I was born, before Mama and Papa adopted us.\n@c0@"
  es: "@aNera@b¿Dónde estará la mia tierra? Me refiero al lugar en que nací, antes de que la mia mamma e il mio papino me adoptaran.\n@c0@"
  fr: "@aNera@bJe me demande où nous sommes nées, Pandora et moi. Je veux dire, l'endroit où nous avons vraiment vu le jour, avant que mamma et papa ne nous adoptent.\n@c0@"
  it: "@aNera@bChissà in quale villaggio siamo nate io e Viola...\nCome sai, Mostroferrato è il luogo dove vivono i miei genitori adottivi, ma noi non siamo originarie di lì.\n@c0@"
  ja: "@a@bフローラ「そういえば\n\t私と姉さんのふるさとは　いったい\n\tどこだったのかしら……。\n@c0@"
71:
  de: "@aNera@bAch, das ist nicht so wichtig. Jetzt ist mein Zuhause dort, wo du bist, und das ist das Einzige, was für mich zählt.\n@c0@"
  en: "@aNera@bOh well, it's not important. My home's wherever you are now, and that's all that matters to me.\n@c0@"
  es: "@aNera@b¡Oh!, va bene, no tiene importancia. Mi hogar está donde tú estés, y eso es tutto lo que me importa.\n@c0@"
  fr: "@aNera@bMais bon, ce n'est pas si important. Mon chez-moi, c'est là où tu te trouves et c'est ça qui compte.\n@c0@"
  it: "@aNera@bAh, non m'importa saperlo.\nCiò che conta per me è sapere dov'è la mia casa: accanto a te, tesoro!\n@c0@"
  ja: "@a@bフローラ「そんなこと　どうでもいいわね。\n\tあなたがいる場所が　私の\n\tふるさとなんですもの……。\n@c0@"
72:
  de: "@a%0%a001240@bNoch ein Zuhause! Dann sollten wir hin und wieder hierher zurückkehren, Papa. Hier kann man prima spielen!\n@c0@"
  en: "@a%0%a001240@bAnother home! Let's come back here sometimes then, Dad. It's a great place to play!\n@c0@"
  es: "@a%0%a001240@b¡Otro hogar! Pues volvamos aquí de vez en cuando, papá. ¡Es un sitio genial para jugar!\n@c0@"
  fr: "@a%0%a001240@bUn autre chez-nousⓠ On reviendra, hein, papaⓡ C'est un endroit génial pour jouerⓠ\n@c0@"
  it: "@a%0%a001240@bAccidenti, papà! Ma quante case abbiamo, eh?! Denim, Zenithia, Picco Maximo...\nNe dimentico qualcuna? Eh eh eh!\n@c0@"
  ja: "@a@b%a001240「えへへ　ふるさとだって。\n\tお父さん　絶対　また\n\t遊びにこようね！\n@c0@"
73:
  de: "@a%0%a001240@bIch finde, er sollte Florist werden. Ist doch ein schöner Beruf!\n@c0@"
  en: "@a%0%a001240@bI think he should become a florist. Why not?\n@c0@"
  es: "@a%0%a001240@bCreo que debería hacerse florista. ¿Por qué no?\n@c0@"
  fr: "@a%0%a001240@bSelon moi, il devrait devenir fleuriste. Pourquoi pasⓡ\n@c0@"
  it: "@a%0%a001240@bPotrebbe vendere padelle per preparare la paella!\nLo zio Sancho gliele comprerebbe tutte!\n@c0@"
  ja: "@a@b%a001240「だったら\n\tこれからは　花屋とか始めれば\n\tいいんじゃないかな。　ねえ？\n@c0@"
74:
  de: "@a%0%a001250@bWas für ein netter Mann! Es macht ihm gar nichts aus, dass er jetzt seine Waren nicht mehr verkaufen kann.\n@c0@"
  en: "@a%0%a001250@bWhat a nice man! He's not even slightly upset, even though he won't be able to sell any of his stock now.\n@c0@"
  es: "@a%0%a001250@b¡Qué hombre más amable! Ni siquiera está un poco enfadado, y eso que ya no podrá vender su mercancía.\n@c0@"
  fr: "@a%0%a001250@bIl est gentilⓠ Il n'est même pas en colère parce qu'il ne pourra plus rien vendre.\n@c0@"
  it: "@a%0%a001250@bUna tavola calda? Ottima idea!\nCucinare e mangiare sono attività molto più gradevoli che fare la guerra!\n@c0@"
  ja: "@a@b%a001250「お店の物が\n\t売れなくなったのに　すごく\n\tうれしそうなの。　うふふ。\n@c0@"
75:
  de: "@aBianca@bHa ha. Aber das haben wir doch nicht alles allein getan, was?\n@c0@"
  en: "@aBianca@bHa ha. It's not like we managed it all by ourselves though, eh?\n@c0@"
  es: "@aBianca@b¡Ja, ja! No es que lo hayamos conseguido todo nosotros solos, ¿eh?\n@c0@"
  fr: "@aBianca@bHa haⓠ Mais ce n'est pas comme si on avait tout fait tout seuls, heinⓡ\n@c0@"
  it: "@aBianca@bSì, ce l'abbiamo fatta, ma il merito non è solo nostro...\n@c0@"
  ja: "@a@bビアンカ「うふふ。\n\t別に　私たちだけのチカラで\n\t勝てたわけじゃないわよね。\n@c0@"
76:
  de: "@aBianca@bDie Menschen auf der ganzen Welt haben ihr Vertrauen in uns gesetzt. Sonst hätten wir es nie geschafft.\n@c0@"
  en: "@aBianca@bFolk from all over the world put their faith in us. Without that, we never could've done it.\n@c0@"
  es: "@aBianca@bHabía gente de todo el mundo poniendo su fe en nosotros. Sin eso, nunca lo hubiéramos logrado.\n@c0@"
  fr: "@aBianca@bLes gens du monde entier ont cru en nous. Sans ce soutien, nous n'aurions jamais pu réussir.\n@c0@"
  it: "@aBianca@bDobbiamo ringraziare tutte le persone che, in ogni angolo del mondo, hanno dimostrato di credere in noi.\nSenza di loro, non avremmo mai sconfitto Nimzo...\n@c0@"
  ja: "@a@bビアンカ「世界中の人々が\n\t私たちを　信じてくれたから\n\tきっと　勝てたんだと思うもの。\n@c0@"
77:
  de: "@a%0%a001250@bDer Mann hat nach alten Flaschen gerochen. Der war schon in der Schänke, und es ist noch nicht mal Abend!\n@c0@"
  en: "@a%0%a001250@bThat man smelt like old bottles. He's been in the pub, and it's still the middle of the day!\n@c0@"
  es: "@a%0%a001250@bEse hombre huele a botella rancia. Viene de la taberna, ¡y aún es mediodía!\n@c0@"
  fr: "@a%0%a001250@bCe monsieur sentait le vieil alcool. On est encore au milieu de la journée et il est déjà allé à la taverneⓠ\n@c0@"
  it: "@a%0%a001250@bL'Eroe Leggendario e suo padre?!\nMa alla sorella dell'Eroe Leggendario non ci pensa proprio nessuno?!\n@c0@"
  ja: "@a@b%a001250「今の　おじいさん\n\tちょっと　お酒くさかった……。\n\tまだ　お昼なのにー。\n@c0@"
78:
  de: "@a%0%a001240@bUnd jetzt, da wieder Frieden auf der Welt herrscht, bleibt sie sicher noch lange am Leben und erlebt noch viel mehr Tage. Stimmt's nicht, Papa?\n@c0@"
  en: "@a%0%a001240@bAnd now the world's at peace, she'll probably live lots, lots longer and see lots, lots more days. Right, Dad?\n@c0@"
  es: "@a%0%a001240@bY ahora que el mundo está en paz, es probable que viva mucho, mucho más y vea muchos más días. ¿Verdad, papá?\n@c0@"
  fr: "@a%0%a001240@bEt maintenant que la paix est revenue, elle vivra encore plus vieille et verra bien d'autres jours.\nC'est pas vrai, papaⓡ\n@c0@"
  it: "@a%0%a001240@bSì, questo è un gran giorno per tutti noi...\n@c0@"
  ja: "@a@b%a001240「平和になったんだもん！\n\tきっと　もっともっと\n\t長生きできるよね！　お父さん！\n@c0@"
79:
  de: "@aBianca@bEr spricht davon, wie sich deine Mutter und dein Vater kennengelernt haben, oder?\n@c0@"
  en: "@aBianca@bHe's talkin' about when your mum and dad met,\r\nen't he?\n@c0@"
  es: "@aBianca@bEstá hablando de cuando tu madre y tu padre se conocieron, ¿verdad?\n@c0@"
  fr: "@aBianca@bIl parle de l'époque à laquelle ta maman et ton papa se sont rencontrés, nonⓡ\n@c0@"
  it: "@aBianca@bCredo che stia parlando del giorno in cui tuo padre e tua madre si conobbero...\n@c0@"
  ja: "@a@bビアンカ「今の話って\n\tお父さまと　お母さまの\n\t出会いの話よね。\n@c0@"
80:
  de: "@aBianca@bWie es wohl kam, dass sie sich ineinander verliebt haben? Schade, dass wir sie nicht fragen können.\n@c0@"
  en: "@aBianca@bI wonder how they fell in love.\r\nIt's a shame we can't ask 'em.\n@c0@"
  es: "@aBianca@bMe pregunto cómo se enamoraron.\nEs una pena que no podamos preguntárselo a ellos.\n@c0@"
  fr: "@aBianca@bJe me demande comment ils sont tombés amoureux.\r\nC'est dommage qu'on ne puisse pas leur demander.\n@c0@"
  it: "@aBianca@bIl loro è stato un amore nato per caso, che è cresciuto fino a diventare immenso, e senza il quale, forse, oggi il mondo non esisterebbe...\n@c0@"
  ja: "@a@bビアンカ「どんな　ロマンスが\n\tあったのかしら。　ふたりに\n\tゆっくり　聞いてみたかったわね。\n@c0@"
81:
  de: "@aNera@bKaum zu glauben, dass sich König Ludwig verlaufen haben soll, findest du nicht? Da hat wohl das Schicksal seine Hand mit im Spiel gehabt.\n@c0@"
  en: "@aNera@bYou wouldn't expect King Pankraz to get lost, would you? It must've been fate playing a hand.\n@c0@"
  es: "@aNera@bNo era de esperar que el rey Teudis se perdiera, ¿vero? El destino habrá tomado cartas en el asunto.\n@c0@"
  fr: "@aNera@bDifficile d'imaginer que le roi Petros ait pu se perdre. C'est sans doute le destin qui lui a donné un coup de pouce.\n@c0@"
  it: "@aNera@bPiù ci penso, più mi convinco che è stato il destino a volere che Russel e Mada si incontrassero...\n㈡\nInsomma, tuo padre non era certo tipo da smarrire la strada!\nÈ stato il fato a metterci lo zampino, ne sono certa!\n@c0@"
  ja: "@a@bフローラ「あの　お父さまが\n\t迷いこむ　だなんて……。\n\tきっと　運命はそこから始まったのね。\n@c0@"
82:
  de: "@aBianca@bHarry und Maria geben ein schönes Paar ab, nicht? Sie scheinen wirklich gut miteinander auszukommen.\n@c0@"
  en: "@aBianca@bHarry and Maria make a good couple, eh?\r\nThey seem to get on really well.\n@c0@"
  es: "@aBianca@bFroilán y María hacen buena pareja, ¿no?\nParece que se llevan muy bien.\n@c0@"
  fr: "@aBianca@bHarry et Maria forment un joli couple, heinⓡ\nIls ont l'air de bien s'entendre.\n@c0@"
  it: "@aBianca@bRobert e Maria stanno proprio bene insieme...\nSembrano fatti l'uno per l'altra.\n@c0@"
  ja: "@a@bビアンカ「ヘンリーさんと\n\tマリアさんって　仲が良くて\n\t本当に　ステキなご夫婦よね。\n@c0@"
83:
  de: "@aBianca@bAber wenn's um glückliche Ehen geht, lassen wir uns von denen noch lange nicht ausstechen! Komm, gib mir 'nen Kuss!\n@c0@"
  en: "@aBianca@bWe'd better not let 'em beat us in the happily married stakes. Come here and gimme a kiss!\n@c0@"
  es: "@aBianca@bNo dejemos que nos adelanten en las listas de matrimonios felices. ¡Ven aquí y darme un beso!\n@c0@"
  fr: "@aBianca@bIl ne faut pas qu'on croie qu'ils sont plus heureux que nous. Viens là et embrasse-moiⓠ\n@c0@"
  it: "@aBianca@bCredo che siano la coppia più bella del mondo...\nDopo di noi, s'intende!\n@c0@"
  ja: "@a@bビアンカ「私たちも負けないよう\n\tステキな夫婦になりましょ。\n\t%a000090。\n@c0@"
84:
  de: "@aNera@bTja, ein solches Bild werden wir wohl auch abgeben, nicht? Ich meine, wenn wir erst wieder daheim in Humburg sind.\n@c0@"
  en: "@aNera@bI suppose that'll be us now too, won't it?\r\nI mean, that's how we'll be, back at Gotha castle.\n@c0@"
  es: "@aNera@bSupongo que esos seremos nosotros, ¿vero?\nO sea, así seremos cuando hayamos ritornato al castillo de Pankraz.\n@c0@"
  fr: "@aNera@bJe suppose que ça va être notre tour, maintenant, n'est-ce pasⓡ Oui, qu'on va enfin pouvoir être comme eux, une fois revenus au château de Gotha.\n@c0@"
  it: "@aNera@bNon vedo l'ora di tornare a Denim...\n@c0@"
  ja: "@a@bフローラ「私たちも　お城にもどったら\n\tああいうふうに　なるのかしら……。\n@c0@"
85:
  de: "@aNera@bUm ehrlich zu sein, im Moment kann ich's mir noch schwer vorstellen.\n@c0@"
  en: "@aNera@bIt's a little bit hard to imagine at the moment,\r\nto be honest.\n@c0@"
  es: "@aNera@bDe momento me cuesta imaginarlo, veramente.\n@c0@"
  fr: "@aNera@bJe dois dire que j'ai encore un peu de mal\r\nà l'imaginer.\n@c0@"
  it: "@aNera@bE di trascorrere il resto della mia vita accanto al Re del mio cuore...\n@c0@"
  ja: "@a@bフローラ「今は　ちょっとまだ\n\t想像が　つきませんわね。\n@c0@"
86:
  de: "@a%0%a001250@bPrinz Harry sieht nett aus. Er hat so einen gütigen Blick, genau wie du, Papa.\n@c0@"
  en: "@a%0%a001250@bPrince Harry looks like a nice man.\nHe's got kind eyes just like yours, Dad.\n@c0@"
  es: "@a%0%a001250@bEl príncipe Froilán parece un hombre agradable.\nTiene unos ojos amables como los tuyos, papi.\n@c0@"
  fr: "@a%0%a001250@bLe prince Harry a l'air d'être quelqu'un de bien.\nSes yeux sourient. Un peu comme les tiens, papaⓠ\n@c0@"
  it: "@a%0%a001250@bPapà, il principe Robert ha gli occhi gentili e sorridenti...\nProprio come i tuoi...\n@c0@"
  ja: "@a@b%a001250「ヘンリーさんって　すごく\n\tやさしそう……。　だって　お父さんと\n\tそっくりの　目をしてるもの。\n@c0@"
87:
  de: "@aBianca@bEs ist schön, so einen guten Freund aus Kindertagen zu haben. Ich bin fast ein bisschen eifersüchtig.\n@c0@"
  en: "@aBianca@bIt's nice to have a good friend like that from way back. I'm a bit jealous, in fact.\n@c0@"
  es: "@aBianca@bEs bonito tener buenos y viejos amigos. De hecho, me da un poco de envidia, ¿sabes?\n@c0@"
  fr: "@aBianca@bC'est bien d'avoir un si vieil ami. Je suis un peu jalouse, en fait.\n@c0@"
  it: "@aBianca@bÈ bello avere degli amici su cui contare...\n@c0@"
  ja: "@a@bビアンカ「男同士の友情か…\n\tなんだか　うらやましいわね。\n@c0@"
88:
  de: "@aNera@bDie Schönheit von mir? Was hast du nur für charmante Freunde, %a000090! \n@c0@"
  en: "@aNera@bYoung and beautiful!? You've got such nice friends, %a000090. I think I'll just block the ⓗblockⓘ part out!\n@c0@"
  es: "@aNera@b¡¿Joven y lozana?! Tus amigos son un encanto, caro %a000090. ¡Sembra que nos llevaremos bien!\n@c0@"
  fr: "@aNera@bJeune et splendideⓠⓑ Tes amis sont vraiment gentils, %a000090. Je crois que je vais pouvoir oublier la partie ⓥtel père, tel filsⓦⓠ\n@c0@"
  it: "@aNera@b%0%a001240 ha preso da te e da me, %a000090, ma anche da suo nonno Russel e da sua nonna Mada...\n\n@c0@"
  ja: "@a@bフローラ「あなたは\n\tいいお友だちがいて　しあわせね。\n@c0@"
89:
  de: "@a%0%a001240@bKendrick wirkt wie ein nervtötender, verwöhnter, selbstsüchtiger Blödmann, aber im Grunde ist er wohl ganz in Ordnung... nehm' ich an.\n@c0@"
  en: "@a%0%a001240@bKendrick seems to be a really annoying, selfish brat, but he's alright underneath...I think.\n@c0@"
  es: "@a%0%a001240@bSantos parece un mocoso algo antipático y egoísta, pero tiene buen fondo... creo.\n@c0@"
  fr: "@a%0%a001240@bRodéric a l'air vraiment pénible et égoïste, mais il doit être sympa si on gratte un peu... enfin, je crois.\n@c0@"
  it: "@a%0%a001240@bA prima vista Emilian sembra una peste, ma in fondo è un gran bravo ragazzo...\n㈡\nIn fondo.\nMolto in fondo...\nMolto, ma molto, ma molto in fondo...\n@c0@"
  ja: "@a@b%a001240「コリンズくんって\n\tわがままっぽいけど　本当は\n\t根は　いいヤツ…　なのかな？\n@c0@"
90:
  de: "@a%0%a001250@b%0%a001240 sollte lieber Kendrick als Lakaien beschäftigen und nicht umgekehrt!\n@c0@"
  en: "@a%0%a001250@bIt's Kendrick who should become %a001240's lackey, not the other way round!\n@c0@"
  es: "@a%0%a001250@b¡Santos es quien debería convertirse en lacayo de %a001240, y no al contrario!\n@c0@"
  fr: "@a%0%a001250@bC'est %a001240 qui devrait demander à Rodéric d'être son laquais, pas l'inverseⓠ\n@c0@"
  it: "@a%0%a001250@bSecondo me è Emilian che dovrebbe fare da aiutante a %a001240, e non viceversa!\n@c0@"
  ja: "@a@b%a001250「コリンズくんこそ\n\tお兄ちゃんの子分になればいいのよ！\n\tベーっだ！\n@c0@"
91:
  de: "@aBianca@bHerrliches Wetter, nicht? Sogar der Himmel lacht heute auf uns hernieder!\n@c0@"
  en: "@aBianca@bThe weather's amazin', en't it? Even the sky's smilin' down on us today.\n@c0@"
  es: "@aBianca@bEl tiempo es genial, ¿a que sí? Hasta el cielo nos sonríe hoy.\n@c0@"
  fr: "@aBianca@bLe temps est fabuleux, pas vraiⓡ Même le ciel semble nous sourire, aujourd'hui.\n@c0@"
  it: "@aBianca@bChe splendida giornata!\nMi sento come se fossi in paradiso...\n@c0@"
  ja: "@a@bビアンカ「本当に　いい天気ね。\n\tなんだか　空まで　私たちを\n\t祝福してくれてるみたい。\n@c0@"
92:
  de: "@a%0%a001240@bZenithia liegt weit, weit oben über den Wolken, nicht?\n@c0@"
  en: "@a%0%a001240@bZenithia's way, way above the clouds, isn't it?\n@c0@"
  es: "@a%0%a001240@bZenithia está muy, muy por encima de las nubes, ¿verdad?\n@c0@"
  fr: "@a%0%a001240@bZénithia est bien plus haut que les nuages, heinⓡ\n@c0@"
  it: "@a%0%a001240@bZenithia è in alto tra le nuvole...\n@c0@"
  ja: "@a@b%a001240「天空城って\n\tこの空の　ずっとずーっと\n\t上に　あるんだよね？\n@c0@"
93:
  de: "@a%0%a001240@bMan kann's kaum glauben, wenn man hier unten auf der Erde steht.\n@c0@"
  en: "@a%0%a001240@bIt's a bit hard to believe when you're down on\nthe ground.\n@c0@"
  es: "@a%0%a001240@bResulta difícil de creer cuando estás en el suelo.\n@c0@"
  fr: "@a%0%a001240@bC'est un peu difficile à croire quand on est\nsur terre.\n@c0@"
  it: "@a%0%a001240@bUn castello che vola in cielo...\nSembra incredibile, eh?\nE invece è vero: lo abbiamo visto con i nostri occhi!\n@c0@"
  ja: "@a@b%a001240「うーん。\n\t下から見てると　なんだか\n\t信じられないや。\n@c0@"
94:
  de: "@a%0%a001250@bWeißt du, was ich wirklich toll fände?\n@c0@"
  en: "@a%0%a001250@bYou know what I'd really like?\n@c0@"
  es: "@a%0%a001250@b¿Sabes lo que me gustaría de verdad?\n@c0@"
  fr: "@a%0%a001250@bTu sais ce que je voudrais vraimentⓡ\n@c0@"
  it: "@a%0%a001250@bSai che cosa vorrei fare quando torneremo a Denim?\n@c0@"
  ja: "@a@b%a001250「えっと…　あのね……。\n@c0@"
95:
  de: "@a%0%a001250@bWenn wir wieder in Humburg sind, könnten wir uns doch etwas Essen einpacken und ein Picknick im Wald machen!\n@c0@"
  en: "@a%0%a001250@bOnce we get home to Gotha, I'd like us all to take a packed lunch and go for a picnic in the woods.\n@c0@"
  es: "@a%0%a001250@bCuando volvamos a casa, a Pankraz, me gustaría que nos fuéramos de excursión a comer en el bosque.\n@c0@"
  fr: "@a%0%a001250@bUne fois revenus à Gotha, j'aimerais qu'on aille tous ensemble faire un pique-nique en forêt.\n@c0@"
  it: "@a%0%a001250@bVorrei organizzare una bella gita in campagna!\nPotremmo chiedere allo zio Sancho di prepararci una deliziosa paella da gustare distesi su un prato!\n@c0@"
  ja: "@a@b%a001250「お城にもどったら　わたし\n\tみんなで　おべんとう持って…\n\t森へ　ピクニックに行きたいの。\n@c0@"
96:
  de: "@a%0%a001230@bGute Idee! Dann mache ich ein Picknick für uns alle zurecht.\n@c0@"
  en: "@a%0%a001230@bAlright, then. I'll make lunch for all of us.\n@c0@"
  es: "@a%0%a001230@bPues muy bien. Prepararé un picnic para todos.\n@c0@"
  fr: "@a%0%a001230@bD'accord. Dans ce cas, je nous préparerai\nun bon déjeuner.\n@c0@"
  it: "@a%0%a001230@bSì, e poi un ottimo minestrone, che contiene pochi grassi ed è tanto saporito!\n@c0@"
  ja: "@a@b%a001230「いいわね。\n\tじゃあ　お母さんが　おべんとう\n\tつくろうかな？\n@c0@"
97:
  de: "@a%0%a001250@bAch, wirklich, Mama? Das würdest du machen?\nOh, toll!\n@c0@"
  en: "@a%0%a001250@bReally? You will? Excellent!\n@c0@"
  es: "@a%0%a001250@b¿En serio? ¿Lo harás? ¡Genial!\n@c0@"
  fr: "@a%0%a001250@bC'est vraiⓡ Superⓠ\n@c0@"
  it: "@a%0%a001250@bCerto! Il minestrone va bene! Però niente sfilatini con prosciutto di Cinghialorco, mi raccomando!\nNon possiamo mangiare carne di mostro!\n@c0@"
  ja: "@a@b%a001250「ホント！？　やった～！\n@c0@"
98:
  de: "@aBianca@bIch bin schon gespannt, was die Leute für Gesichter machen, wenn wir nach Humburg zurückkehren.\n@c0@"
  en: "@aBianca@bI wonder how everyone'll react when we get back\r\nto Gotha.\n@c0@"
  es: "@aBianca@bMe pregunto como reaccionarán todos cuando volvamos a Pankraz.\n@c0@"
  fr: "@aBianca@bJe me demande comment les gens réagiront quand nous reviendrons à Gotha.\n@c0@"
  it: "@aBianca@bChissà che accoglienza ci riserveranno i nostri cari concittadini...\n@c0@"
  ja: "@a@bビアンカ「グランバニアのみんなは\n\tどんな顔で　私たちを\n\t出迎えてくれるのかしら？\n@c0@"
99:
  de: "@aBianca@bSo lange waren wir ja gar nicht weg, aber ich hab trotzdem irgendwie ein bisschen Heimweh.\nKomisch, oder?\n@c0@"
  en: "@aBianca@bWe've not bin away all that long, and yet I sort of miss the place. Funny, en't it?\n@c0@"
  es: "@aBianca@bNo llevamos fuera tanto tiempo, pero echo un poco de menos estar allí. Curioso, ¿no?\n@c0@"
  fr: "@aBianca@bNous ne sommes pas partis si longtemps et pourtant, Gotha me manque. C'est bizarre, nonⓡ\n@c0@"
  it: "@aBianca@bSai una cosa?\nHo una voglia pazza di tornare a casa e di restarci per un bel pezzo!\n@c0@"
  ja: "@a@bビアンカ「そんなに　長い間\n\tはなれていたわけでもないのに\n\tなんだか　なつかしいわ。　ふしぎね。\n@c0@"
100:
  de: "@aNera@bPlötzlich fehlt mir Humburg.\n@c0@"
  en: "@aNera@bI feel like I miss Gotha all of a sudden.\n@c0@"
  es: "@aNera@bDe repente, sento nostalgia de Pankraz.\n@c0@"
  fr: "@aNera@bGotha me manque, tout à coup.\n@c0@"
  it: "@aNera@bOra che è tutto finito muoio dalla voglia di tornare a Denim.\n@c0@"
  ja: "@a@bフローラ「なんだか　きゅうに\n\tグランバニアが\n\tなつかしくなってきましたわ。\n@c0@"
101:
  de: "@aNera@bIch weiß eigentlich gar nicht, warum. So lange war ich doch gar nicht weg.\n@c0@"
  en: "@aNera@bI don't know why, really. It's not like I've been away for all that long.\n@c0@"
  es: "@aNera@bNo sé por qué, veramente. No es que llevemos tanto tempo fuera.\n@c0@"
  fr: "@aNera@bJe ne sais pas pourquoi. Nous n'avons pas été absents si longtemps, pourtant.\n@c0@"
  it: "@aNera@bMi sembra una vita che manchiamo da casa...\n@c0@"
  ja: "@a@bフローラ「そんなに　長い間\n\tはなれていたわけでも\n\tないのですけど……。\n@c0@"
102:
  de: "@a%0%a001240@bKönig Wilbur ist ganz anders als sein Bruder Harry, nicht? Er macht einen richtig netten Eindruck.\n@c0@"
  en: "@a%0%a001240@bKing Wilbur's not like his brother Harry, is he?\nHe seems really nice.\n@c0@"
  es: "@a%0%a001240@bEl rey Leonoro no es como su hermano Froilán, ¿verdad?\nParece guay.\n@c0@"
  fr: "@a%0%a001240@bLe roi Will n'est pas comme son frère Harry, heinⓡ\nIl semble vraiment gentil.\n@c0@"
  it: "@a%0%a001240@bRe Fabian è più educato di suo fratello Robert, eh?\n@c0@"
  ja: "@a@b%a001240「デール王って　ヘンリーさんと\n\tちがって　人がよさそうだよね。\n\t兄弟なのに　ちがうんだなあ……。\n@c0@"
103:
  de: "@aBianca@bNa, na! Pass auf, was du sagst, junger Mann! Was würde wohl Harry denken, wenn er dich hören könnte!\n@c0@"
  en: "@aBianca@bHey! You mind your mouth! Imagine how Harry would feel if he heard you say that!\n@c0@"
  es: "@aBianca@b¡Eh, cuidado con lo que dices! ¡Imagina lo que sentiría Froilán si te oyera decir eso!\n@c0@"
  fr: "@aBianca@bHéⓠ Attention à ce que tu disⓠ Imagine ce que Harry ressentirait s'il t'entendaitⓠ\n@c0@"
  it: "@aBianca@bMa che dici, %a001240?!\nTi sembra questo il modo di parlare degli amici di tuo padre?!\n㈡\nIn effetti, però, Robert a volte dimostra di avere uno stile tutt'altro che principesco!\n@c0@"
  ja: "@a@bビアンカ「し～っ！　%a001240。\n\tヘンリーさんに　失礼よっ！\n@c0@"
104:
  de: "@aBianca@bWir sind ja nicht zum ersten Mal in Tifortu, aber irgendwie kommt mir diesmal alles ganz anders vor.\n@c0@"
  en: "@aBianca@bThis en't our first time in Coburg, but the place feels pretty different today somehow.\n@c0@"
  es: "@aBianca@bNo es la primera vez que estamos en Trastámara, pero hoy el lugar tiene un aire distinto.\n@c0@"
  fr: "@aBianca@bCe n'est pas notre premier passage à Cobourg, mais tout semble différent, aujourd'hui.\n@c0@"
  it: "@aBianca@bOggi si respira un'atmosfera diversa a Coburg...\n@c0@"
  ja: "@a@bビアンカ「ラインハットに来るのは\n\tはじめてじゃないけど　今日は\n\tいつもと　ちがって見えるわ。\n@c0@"
105:
  de: "@aBianca@bWahrscheinlich liegt das an den vielen lachenden Menschen. Die Atmosphäre hat sich völlig verändert.\n@c0@"
  en: "@aBianca@bIt's probably all the folk laughin' away that's doin' it. The atmosphere's totally changed.\n@c0@"
  es: "@aBianca@bSeguramente será por las risas de tanta gente. El ambiente ha cambiado por completo, ¿sabes?\n@c0@"
  fr: "@aBianca@bC'est sûrement parce que les gens rient à nouveau. L'atmosphère a complètement changé.\n@c0@"
  it: "@aBianca@bC'è un'aria tranquilla e rilassata.\nI sudditi di re Fabian si stanno godendo la serenità ritrovata.\n@c0@"
  ja: "@a@bビアンカ「人々が　楽しそうに\n\t笑っているからかしらね。\n@c0@"
106:
  de: "@aNera@bSchloss Tifortu kommt mir jetzt viel fröhlicher vor als früher. Hör dir nur das viele Lachen an.\n@c0@"
  en: "@aNera@bCoburg Castle seems like a far brighter place now than it used to be. Just listen to all that laughter.\n@c0@"
  es: "@aNera@bEl castillo de Trastámara parece allora un lugar molto más brillante que antes. No hay más que oír esas risas.\n@c0@"
  fr: "@aNera@bLe château de Cobourg semble bien plus gai qu'autrefois. Écoute tous ces gens rire.\n@c0@"
  it: "@aNera@bIl Castello di Coburg risuona di risate e grida di felicità! È bello vedere che nel mondo è tornata la gioia di vivere...\n@c0@"
  ja: "@a@bフローラ「ラインハットのお城の中が\n\t前より　いっそう明るくなりましたわ。\n\tほら　あんなに笑い声が聞こえて……。\n@c0@"
107:
  de: "@a%0%a001240@bUi! Die haben alle schon von uns gehört! Alle wissen, was wir getan haben.\n@c0@"
  en: "@a%0%a001240@bWow! Everyone's heard about us!\nEveryone knows about what we've done.\n@c0@"
  es: "@a%0%a001240@b¡Vaya! ¡Todos nos conocen!\nTodos saben lo que hemos hecho.\n@c0@"
  fr: "@a%0%a001240@bWaouhⓠ Tout le monde a entendu parler de nousⓠ\nTout le monde sait ce que nous avons fait.\n@c0@"
  it: "@a%0%a001240@bEh eh eh!\nScommetto che persino i sassi sanno che Nimzo è stato sconfitto!\n@c0@"
  ja: "@a@b%a001240「すごいや！\n\tボクたちがしたこと　みんなに\n\t知れわたってる。\n@c0@"
108:
  de: "@a%0%a001240@bDu... Du glaubst doch nicht, dass sie wissen, dass ich bei dem einen Monster damals vor Angst fast in die Ho... Ähem! Ach, schon gut! Nicht so wichtig!\n@c0@"
  en: "@a%0%a001240@bHey, you don't... You don't think they know about me wetting the bed lastⓚⓛ Oops! I mean... Nothing!\n@c0@"
  es: "@a%0%a001240@bOye, no creerás... No creerás que saben lo de que mojé la cama cuando... ¡Ay, ay! Es decir... ¡Nada!\n@c0@"
  fr: "@a%0%a001240@bHé, tu ne crois pas... tu ne crois pas qu'ils savent aussi que j'ai fait pipi au lit cette... Oupsⓠ\nEuh... non, rienⓠ\n@c0@"
  it: "@a%0%a001240@bE siamo stati noi a batterlo!\nSiamo troppo forti!\n@c0@"
  ja: "@a@b%a001240「はっ…　もしかして\n\tボクが　きのうの夜　おねしょしそうに\n\tなったことも？　……ぶるぶる。\n@c0@"
109:
  de: "@a%0%a001250@bⓞLegendäre Heldenⓟ?! Also sind wir jetzt auf einmal alle legendäre Helden?\n@c0@"
  en: "@a%0%a001250@bⓗLegendary heroesⓘ!? What, we're all legendary heroes, are we?\n@c0@"
  es: "@a%0%a001250@b¡ⓕHéroes legendariosⓖ! Anda, somos todos héroes legendarios, ¿eh?\n@c0@"
  fr: "@a%0%a001250@bⓥLes héros légendairesⓦⓠⓑ On est tous des héros légendaires, alorsⓡ\n@c0@"
  it: "@a%0%a001250@bHai sentito, papà?\nSiamo eroici, mitici e leggendari!\n@c0@"
  ja: "@a@b%a001250「あなたがた……！？\n\tわたしたち　みんなで\n\t伝説の勇者なの？\n@c0@"
110:
  de: "@a%0%a001250@bHa ha! Das gefällt mir!\n@c0@"
  en: "@a%0%a001250@bHa ha!\n@c0@"
  es: "@a%0%a001250@b¡Ja, ja!\n@c0@"
  fr: "@a%0%a001250@bHa haⓠ\n@c0@"
  it: "@a%0%a001250@bDevo stare attenta a non montarmi la testa...\n@c0@"
  ja: "@a@b%a001250「えへ。\n@c0@"
111:
  de: "@aBianca@bHm? Hat der Soldat gerade irgendwas gesagt? 'tschuldigung, ich war mit den Gedanken ganz woanders.\n@c0@"
  en: "@aBianca@bHm? Did that soldier say somethin' just then?\r\nSorry, I weren't listenin'.\n@c0@"
  es: "@aBianca@b¿Mmm? ¿El soldado dijo algo en su momento?\nLo siento, no lo oí, ¿sabes?\n@c0@"
  fr: "@aBianca@bMmmⓡ Ce soldat a dit quelque choseⓡ\nDésolée, je n'écoutais pas.\n@c0@"
  it: "@aBianca@bWah ah ah ah ah! Ma l'hai sentito?!\nScommetto che se la sarebbe fatta sotto, se avesse davvero dovuto affrontare Nimzo!\n@c0@"
  ja: "@a@bビアンカ「ん？　あの戦士さん\n\tなんか言ってた？\n\tごめん　聞いてなかった。\n@c0@"
112:
  de: "@a%0%a001240@bAber... Das ist kein Traum! In der Welt herrscht wirklich Frieden!\n@c0@"
  en: "@a%0%a001240@bBut...it's not a dream. The world really is at peace!\n@c0@"
  es: "@a%0%a001240@bPero... no es un sueño. ¡El mundo está en paz de verdad!\n@c0@"
  fr: "@a%0%a001240@bMais... c'est pas un rêve. La paix est vraiment revenueⓠ\n@c0@"
  it: "@a%0%a001240@bDormi, dormi, che è meglio...\n@c0@"
  ja: "@a@b%a001240「あ～あ……\n\tホントに　平和になってるのに。\n@c0@"
113:
  de: "@aNera@bEs kommt selbst mir immer noch vor wie ein Traum, und dabei bin ich hellwach.\n@c0@"
  en: "@aNera@bIt still seems like a dream to me, even though\r\nI'm awake.\n@c0@"
  es: "@aNera@bAunque estoy despierta, sigue siendo un sueño per me.\n@c0@"
  fr: "@aNera@bMoi aussi, parfois, j'ai l'impression que je rêve, même si je suis éveillée.\n@c0@"
  it: "@aNera@bLa pace è tornata...\n@c0@"
  ja: "@a@bフローラ「起きている　私たちですら\n\tまだ　夢を見ているみたいですもの。\n@c0@"
114:
  de: "@aNera@bKein Wunder, dass dieser verschlafene Soldat es nicht so recht glauben kann!\n@c0@"
  en: "@aNera@bNo wonder this sleepy soldier can't quite believe it!\n@c0@"
  es: "@aNera@b¡No me extraña que ese soldato adormilado no se lo crea!\n@c0@"
  fr: "@aNera@bJe comprends que ce soldat n'arrive pas à y croireⓠ\n@c0@"
  it: "@aNera@bE speriamo che non ci abbandoni mai più!\n@c0@"
  ja: "@a@bフローラ「寝ぼけている方には\n\tとうてい　信じられないでしょうね。\n@c0@"
115:
  de: "@a%0%a001240@bEs geht zwar nichts über Burg Humburg, aber dieses Schloss ist auch gar nicht so übel.\n@c0@"
  en: "@a%0%a001240@bNothing beats Gotha Castle, but this castle's really impressive too.\n@c0@"
  es: "@a%0%a001240@bNo hay nada como el castillo de Pankraz, pero este castillo también es impresionante.\n@c0@"
  fr: "@a%0%a001240@bAucun château ne vaut celui de Gotha, mais celui-ci est quand même impressionnant.\n@c0@"
  it: "@a%0%a001240@bIl Castello di Denim è il più bellissimissimo del mondo, ma devo dire che anche questo non è malaccio...\n@c0@"
  ja: "@a@b%a001240「グランバニアも\n\t大きいお城だけど　ここのお城も\n\tすごく　りっぱだね！\n@c0@"
116:
  de: "@a%0%a001250@bIst nicht Dr. Ache auch ein Gott? Er ist doch der Drachengott, oder nicht? Ist er dann nicht mit der Göttin verheiratet? Die arme Göttin!\n@c0@"
  en: "@a%0%a001250@bIsn't Dr Agon a god too? He's the Dragon God, isn't he? Does that mean he's married to the Goddess?\nPoor Goddess.\n@c0@"
  es: "@a%0%a001250@b¿No es también un dios el Dr. Agón? Es el Dios Dragón, ¿verdad?\n㈡\n¿Quiere eso decir que está casado con la Diosa?\nPobre Diosa.\n@c0@"
  fr: "@a%0%a001250@bLe Dr Agon n'est-il pas un dieu, lui aussiⓡ C'est le dieu dragon, nonⓡ Ça veut dire qu'il est marié avec la Déesseⓡ La pauvre.\n@c0@"
  it: "@a%0%a001250@bUhm, il Drago di Zenithia è anch'egli una divinità, no?\nPerché non chiede alla dea di uscire con lui?\n㈡\nSecondo me quei due hanno un sacco di cose in comune...\nFarebbero una gran bella coppia!\n@c0@"
  ja: "@a@b%a001250「神のごかご…　っていうけど\n\t神さまって　プサンさんなのよね。\n\t……それって　すごく不安。\n@c0@"
117:
  de: "@a%0%a001240@bEin Festmahl? Meinst du, wir dürfen auch daran teilnehmen, wenn wir uns noch ein Weilchen hier rumdrücken?\n@c0@"
  en: "@a%0%a001240@bA slap-up meal? Do you think we can join in if we hang around here a bit longer?\n@c0@"
  es: "@a%0%a001240@b¿Un banquete? ¿Crees que podríamos apuntarnos si nos quedamos un poco por aquí?\n@c0@"
  fr: "@a%0%a001240@bUn bon repasⓡ Tu crois qu'on peut s'inviter si on reste encore un peu dans le coinⓡ\n@c0@"
  it: "@a%0%a001240@bA proposito di cena, che si mangia stasera?\n@c0@"
  ja: "@a@b%a001240「とびきりの　ごちそう？\n\t待ってれば　ボクたちも\n\t食べられるかな？\n@c0@"
118:
  de: "@a%0%a001240@bAber wir müssen wohl zurück nach Humburg, nicht? Sicher werden dort schon alle auf die Heimkehr der großen Helden warten.\n@c0@"
  en: "@a%0%a001240@bBut I suppose we've got to get back to Gotha, haven't we? Everyone'll be waiting for the great heroes to return!\n@c0@"
  es: "@a%0%a001240@bAunque supongo que tenemos que volver a Pankraz, ¿no? ¡Todos estarán esperando el regreso de los grandes héroes!\n@c0@"
  fr: "@a%0%a001240@bMais j'imagine qu'on doit rentrer à Gotha, heinⓡ\nTout le monde doit attendre le retour des grands hérosⓠ\n@c0@"
  it: "@a%0%a001240@bHo una fame... leggendaria!\nWah ah ah ah ah!\nBuona questa!\n@c0@"
  ja: "@a@b%a001240「なんちゃって。\n\tグランバニアの人たちが\n\t待ってるもん。　急がなきゃね！\n@c0@"
119:
  de: "@a%0%a001250@bToll! Sie hat gar keine Angst im Dunkeln! Das finde ich klasse!\n@c0@"
  en: "@a%0%a001250@bWow! She's not scared of the dark! I'm impressed!\n@c0@"
  es: "@a%0%a001250@b¡Vaya! ¡No le da miedo la oscuridad! ¡Estoy impresionada!\n@c0@"
  fr: "@a%0%a001250@bWaouhⓠ Elle n'a pas peur du noirⓠ\nJe suis impressionnéeⓠ\n@c0@"
  it: "@a%0%a001250@bPapà, anch'io potrò restare a giocare fuori fino a tardi? Dai, dimmi di sì!\nTi prometto che starò attenta!\n@c0@"
  ja: "@a@b%a001250「すご～い！　あの子\n\t暗いの　こわくないのかな？\n\tそんけいしちゃう。\n@c0@"
120:
  de: "@aBianca@bDiese Nonne ist so selig, dass man gar nicht anders kann, als zurückzulächeln, wenn man sie anschaut!\n@c0@"
  en: "@aBianca@bThat nun's so ecstatic, it's impossible to keep the smile off your face when you talk to her!\n@c0@"
  es: "@aBianca@b¡Esa monja está tan exaltada que resulta imposible evitar que te dé la risa al hablar con ella!\n@c0@"
  fr: "@aBianca@bCette religieuse est tellement heureuse qu'il est presque impossible de ne pas sourire quand on\nlui parleⓠ\n@c0@"
  it: "@aBianca@bAnche se non lo sapessi, mi basterebbe guardare i volti rilassati delle persone intorno a noi per capire che il mondo non è più in pericolo...\n@c0@"
  ja: "@a@bビアンカ「シスターが　あんまり\n\tうれしそうだから\n\tこっちまで　うれしくなるわ。\n@c0@"
121:
  de: "@aBianca@bAber darum ging's ja auch. All die Mühen haben wir schließlich nur deshalb auf uns genommen, damit die Leute wieder glücklich sein können.\n@c0@"
  en: "@aBianca@bThis is what it's all about, though. That's why\r\nwe went to all that effort, so that folk could be happy again.\n@c0@"
  es: "@aBianca@bPero de eso se trataba. Por eso nos hemos esforzado tanto, para que la gente volviera a ser feliz, ¿sabes?\n@c0@"
  fr: "@aBianca@bMais c'était justement ça, le but de notre quête.\r\nC'est pour ça que nous nous sommes battus.\r\nPour que les gens puissent être heureux.\n@c0@"
  it: "@aBianca@bÈ stata dura, %a000090, ma ne è valsa la pena...\n@c0@"
  ja: "@a@bビアンカ「だって　みんなの\n\t笑顔のために　私たち\n\tがんばったものね。\n@c0@"
122:
  de: "@aNera@bIch... Ich bin sprachlos! Ich habe noch nie zuvor eine Nonne so überschäumend glücklich gesehen!\n@c0@"
  en: "@aNera@bI'm... I'm speechless! I don't think I've ever seen a nun so openly exuberant like that before!\n@c0@"
  es: "@aNera@bYo... ¡Estoy senza habla! ¡Credo que nunca había visto una monja tan eufórica como esta!\n@c0@"
  fr: "@aNera@bJe... Les bras m'en tombentⓠ Je ne crois pas avoir jamais vu une religieuse aussi exubéranteⓠ\n@c0@"
  it: "@aNera@bVedere la gente finalmente felice e serena mi riempie d'orgoglio per ciò che abbiamo fatto, %a000090.\n@c0@"
  ja: "@a@bフローラ「シスター　あんなに\n\tよろこんでくださって…　うふふ。\n\tわーい　わーい！\n@c0@"
123:
  de: "@a%0%a001240@bJippieh! Alle sind euphi... eufro... äh, überglücklich!\n@c0@"
  en: "@a%0%a001240@bYay! Everyone's H-A-P-Y!\nI mean, H-A-P-P-Y!\n@c0@"
  es: "@a%0%a001240@b¡Bien! ¡Todos son F-E-L-I-Z-E-S!\nEs decir, ¡F-E-L-I-C-E-S!\n@c0@"
  fr: "@a%0%a001240@bOuaisⓠ Tout le monde est H-E-U-R-R-E-U-Xⓠ\nEuh, pardon, H-E-U-R-E-U-Xⓠ\n@c0@"
  it: "@a%0%a001240@bPapà, ti rendi conto che abbiamo fatto felice tanta gente?\nSono troppo contento di essere l'Eroe Leggendario!\n@c0@"
  ja: "@a@b%a001240「わーい　わーい！\n\tうれしいなあっと！\n@c0@"
124:
  de: "@a%0%a001250@bIch würde am liebsten tanzen!\n@c0@"
  en: "@a%0%a001250@bI feel like dancing!\n@c0@"
  es: "@a%0%a001250@b¡Qué ganas de bailar!\n@c0@"
  fr: "@a%0%a001250@bÇa me donne envie de danserⓠ\n@c0@"
  it: "@a%0%a001250@bHo voglia di ballare, di saltare, di correre...\nUhm, no... Ora ho solo voglia di tornare a casa e di dormire. Sono stanchissima!\n@c0@"
  ja: "@a@b%a001250「わーい　わーい！\n@c0@"
125:
  de: "@aBianca@bKannst du mich mal kneifen? Ich glaub', ich träume! Das Dorf sieht ja wieder genauso aus wie früher!\n@c0@"
  en: "@aBianca@bI can't believe it. I feel like I must be dreamin' or somethin'. The village is back to normal again!\n@c0@"
  es: "@aBianca@bNo puedo creerlo. Es como un sueño. ¡La aldea vuelve a ser normal!\n@c0@"
  fr: "@aBianca@bJe n'arrive pas à y croire. Je dois rêver. Tout est redevenu normal dans le villageⓠ\n@c0@"
  it: "@aBianca@bNon ci posso credere...!\nIl villaggio è tornato quello di un tempo!\nÈ un miracolo!\n@c0@"
  ja: "@a@bビアンカ「ウソみたい……。\n\t私　夢を見てるのかしら。\n\t村が　すっかり元どおりだわ。\n@c0@"
126:
  de: "@aNera@bDas ist so ein hübsches kleines Dorf. Wie schön, dass hier wieder so viel Leben herrscht! Du musst ja heilfroh sein, Liebling!\n@c0@"
  en: "@aNera@bThis is such a quaint little village.\nIt's so nice to see it vibrant and alive again.\nYou must be really happy, darling.\n@c0@"
  es: "@aNera@bEsta es una aldea molto peculiare.\nEs bello verla otra vez vibrante y llena de vita.\nDebes sentirte muy feliz, caro.\n@c0@"
  fr: "@aNera@bC'est un si joli petit village.\r\nQuel bonheur de le revoir aussi animé.\r\nTu dois être vraiment heureux, mon chéri.\n@c0@"
  it: "@aNera@bÈ bello vedere che il villaggio è tornato a essere quello di tanti anni fa, %a000090...\n@c0@"
  ja: "@a@bフローラ「なんて　きれいな村……。\n\tすっかり　元どおりになったのね。\n\tよかったわね　あなた。\n@c0@"
127:
  de: "@a%0%a001240@bIch weiß, wo wir sind! Ich weiß es, ich weiß es!\nHier hast du gelebt, als du noch klein warst, stimmt's nicht, Papa?\n@c0@"
  en: "@a%0%a001240@bI know what this place is! I know what this place is! It's where you used to live when you were a boy, isn't it, Dad?\n@c0@"
  es: "@a%0%a001240@b¡Sé donde estamos! ¡Sé donde estamos! Es donde vivías cuando eras pequeño, ¿verdad, papá?\n@c0@"
  fr: "@a%0%a001240@bJe sais où on estⓠ Je sais où on estⓠ C'est là que tu habitais quand tu étais petit garçon, hein, papaⓡ\n@c0@"
  it: "@a%0%a001240@bPapà, questo è il villaggio dove hai vissuto quand'eri piccolo, non è vero?\n@c0@"
  ja: "@a@b%a001240「ボク　知ってるよ。\n\tここ　お父さんが子供のころ\n\t暮らしてたところなんでしょ？\n@c0@"
128:
  de: "@a%0%a001250@bHier würde ich auch gern leben. Hier fühlt man sich gleich so zu Hause.\n@c0@"
  en: "@a%0%a001250@bI think I'd like to live here too. It's got such a welcoming feel.\n@c0@"
  es: "@a%0%a001250@bCreo que me gustaría vivir aquí también. Es un lugar muy acogedor.\n@c0@"
  fr: "@a%0%a001250@bJe crois que moi aussi, j'aimerais bien vivre ici.\nOn s'y sent tellement bien.\n@c0@"
  it: "@a%0%a001250@bCredo che mi piacerebbe vivere in un posto come questo... È piccolo, accogliente, tranquillo.\nSì, qui ci starei proprio bene.\n@c0@"
  ja: "@a@b%a001250「わたしも　この村に\n\t住んでみたいな……。　だって\n\tなんだか　やさしい感じがするの。\n@c0@"
129:
  de: "@aBianca@bDa haben die Leute ja wirklich nicht lange gefackelt, was? Es herrscht doch noch gar nicht so lange wieder Frieden.\n@c0@"
  en: "@aBianca@bFolk certainly don't mess around, eh? The world's only bin at peace for a little while.\n@c0@"
  es: "@aBianca@bLa gente no pierde el tiempo, ¿eh? El mundo lleva en paz muy poco tiempo.\n@c0@"
  fr: "@aBianca@bEh bien, ils ne perdent pas de temps, heinⓡ\nÇa ne fait pas si longtemps que la paix est revenue.\n@c0@"
  it: "@aBianca@bCon il ritorno della pace e l'aiuto della dea questo villaggio diventerà più bello che mai!\n@c0@"
  ja: "@a@bビアンカ「世界が平和になったばかりなのに\n\tいつのまに　修復したのかしら？\n@c0@"
130:
  de: "@aBianca@bVielleicht steht ihnen die Göttin ein wenig zur Seite, als kleines Dankeschön an uns oder so.\n@c0@"
  en: "@aBianca@bMaybe the Goddess give them a bit of a helpin' hand, by way of thankin' us or somethin'.\n@c0@"
  es: "@aBianca@bTal vez la Diosa les eche una mano por agradecimiento a nosotros, ¿sabes?\n@c0@"
  fr: "@aBianca@bPeut-être que la Déesse leur a donné un petit coup de main, pour nous remercier ou quelque chose\r\ncomme ça.\n@c0@"
  it: "@aBianca@bSpero che torneremo presto a visitarlo, amore mio.\nIo e te abbiamo molti ricordi qui...\n@c0@"
  ja: "@a@bビアンカ「もしかしたら　私たちへの\n\tプレゼントに　神さまが\n\tチカラを　かしてくださったのかもね。\n@c0@"
131:
  de: "@aNera@bIch bin ganz überrascht, wie schnell das Dorf wieder aufgebaut werden konnte.\n@c0@"
  en: "@aNera@bI'm quite surprised the village has managed to recover so quickly.\n@c0@"
  es: "@aNera@bMe sorprende que la aldea se haya podido recuperar tan presto.\n@c0@"
  fr: "@aNera@bJe suis vraiment surprise que le village ait refait surface aussi vite.\n@c0@"
  it: "@aNera@bSono sorpresa della rapidità con cui la gente di Valcava ha ricostruito il villaggio...\n@c0@"
  ja: "@a@bフローラ「知らない間に　村が\n\tこんなに　修復されていたなんて\n\tおどろきましたわ。\n@c0@"
132:
  de: "@aNera@bDa hat sicher die Göttin ihre Hand im Spiel gehabt. Vielleicht hat sie den Leuten hier ein wenig geholfen.\n@c0@"
  en: "@aNera@bIt must be the work of the Goddess. She's lent the people here a helping hand, I expect.\n@c0@"
  es: "@aNera@bDebe de ser obra de la Diosa. Sembra que les está echando una mano.\n@c0@"
  fr: "@aNera@bCe doit être l'œuvre de la Déesse. Elle a dû donner un petit coup de main aux gens d'ici.\n@c0@"
  it: "@aNera@bProbabilmente la gioia di aver ritrovato la pace ha moltiplicato le loro energie!\n@c0@"
  ja: "@a@bフローラ「もしかしたら　神さまも\n\t村の修復に　チカラをかして\n\tくださったのかも知れませんわね。\n@c0@"
133:
  de: "@aBianca@bIch wette, hier hat sich dein Vater mehr zu Hause gefühlt als in der Burg von Humburg.\n@c0@"
  en: "@aBianca@bI'll bet your old man preferred livin' here to livin' at the castle in Gotha.\n@c0@"
  es: "@aBianca@bSeguro que tu padre prefería vivir aquí a vivir en el castillo de Pankraz.\n@c0@"
  fr: "@aBianca@bJe parie que ton père préférait habiter ici plutôt que dans le château de Gotha.\n@c0@"
  it: "@aBianca@bScommetto che tuo padre non era tipo da serbare rancore.\n@c0@"
  ja: "@a@bビアンカ「お父さま　もしかしたら\n\tお城での暮らしより　この村の方が\n\t好きだったかも知れないわね。\n@c0@"
134:
  de: "@aBianca@bMeinst du nicht auch? Hier hat ihn jeder gemocht und er hatte eine Menge guter Freunde.\n@c0@"
  en: "@aBianca@bDon't you reckon? Everyone liked him here, and he had loads of really good friends.\n@c0@"
  es: "@aBianca@b¿No crees? Aquí todos le querían y tenía montones de amigos, ¿sabes?\n@c0@"
  fr: "@aBianca@bTu ne crois pasⓡ Tout le monde l'aimait, ici, et il avait plein de très bons amis.\n@c0@"
  it: "@aBianca@bSe oggi incontrasse quest'uomo, gli stringerebbe la mano e gli offrirebbe un latte d'orco, per mettere una pietra sopra le loro... discussioni.\n@c0@"
  ja: "@a@bビアンカ「だって　そう思わない？\n\tみんなにしたわれて　友だちだって\n\tたくさん　いたんだもの。\n@c0@"
135:
  de: "@a%0%a001240@bEr hat Großvater was auf die Mütze gegeben?! Dem werd' ich's zeigen!\n@c0@"
  en: "@a%0%a001240@bHe hit Grandpa on the head!? I'll show him!\n@c0@"
  es: "@a%0%a001240@b¿Que le arreó al abuelo en la cabeza? ¡Yo le enseñaré!\n@c0@"
  fr: "@a%0%a001240@bIl a tapé grand-père sur le crâneⓠⓑ Je vais lui montrer, moiⓠ\n@c0@"
  it: "@a%0%a001240@bCome sarebbe a dire che ha discusso con il nonno ⓕcon le maniⓖ?\n@c0@"
  ja: "@a@b%a001240「おじいちゃんの頭を\n\t何回も　どついたなんて\n\tボクとしては　許せないよ！\n@c0@"
136:
  de: "@a%0%a001240@bSobald er wegguckt, kriegt er selbst eins aufs Dach!\n@c0@"
  en: "@a%0%a001240@bWhen he's looking the other way, I'll give him a taste of his own medicine.\n@c0@"
  es: "@a%0%a001240@bCuando no esté mirando le voy a dar un poco de su propia medicina.\n@c0@"
  fr: "@a%0%a001240@bQuand il aura le dos tourné, je lui rendrai la pareille.\n@c0@"
  it: "@a%0%a001240@bVuol dire che aveva litigato con nonno Russel?!\nArgh! Voglio farlo a pezzi!\n@c0@"
  ja: "@a@b%a001240「あの　おじさんが\n\tうしろ向いたら　こっそり\n\tしかえし　してやるんだ！\n@c0@"
137:
  de: "@aBianca@bDas reicht jetzt, %a001240! Erst nachdenken, dann reden!\n@c0@"
  en: "@aBianca@bWatch it, %a001240! You should think before you speak sometimes.\n@c0@"
  es: "@aBianca@b¡Cuidado, %a001240! A veces deberías pensar antes de hablar.\n@c0@"
  fr: "@aBianca@bÇa ne va pas, %a001240ⓡ Parfois, tu devrais réfléchir avant de parler.\n@c0@"
  it: "@aBianca@bFalla finita, %a001240!\nNon hai sentito che s'è pentito del suo comportamento?\n㈡\nTutti possiamo sbagliare, l'importante è riconoscere i propri errori!\n@c0@"
  ja: "@a@bビアンカ「%a001240っ！\n\tつまんないことばっかり\n\t言ってるんじゃありませんっ！！\n@c0@"
138:
  de: "@a%0%a001240@bEr hat Großvater was auf die Mütze gegeben?! Dem werd' ich's zeigen!\n@c0@"
  en: "@a%0%a001240@bHe hit Grandpa on the head!? I'll show him!\n@c0@"
  es: "@a%0%a001240@b¿Que le arreó al abuelo en la cabeza? ¡Yo le enseñaré!\n@c0@"
  fr: "@a%0%a001240@bIl a tapé grand-père sur le crâneⓠⓑ Je vais lui montrer, moiⓠ\n@c0@"
  it: "@a%0%a001240@bCome sarebbe a dire che ha discusso con il nonno ⓕcon le maniⓖ?\n@c0@"
  ja: "@a@b%a001240「おじいちゃんの頭を\n\t何回も　どついたなんて\n\tボクとしては　許せないよ！\n@c0@"
139:
  de: "@a%0%a001240@bSobald er wegguckt, kriegt er selbst eins aufs Dach!\n@c0@"
  en: "@a%0%a001240@bWhen he's looking the other way, I'll give him a taste of his own medicine.\n@c0@"
  es: "@a%0%a001240@bCuando no esté mirando le voy a dar un poco de su propia medicina.\n@c0@"
  fr: "@a%0%a001240@bQuand il aura le dos tourné, je lui rendrai la pareille.\n@c0@"
  it: "@a%0%a001240@bVuol dire che aveva litigato con nonno Russel?!\nArgh! Voglio farlo a pezzi!\n@c0@"
  ja: "@a@b%a001240「あの　おじさんが\n\tうしろ向いたら　こっそり\n\tしかえし　してやるんだ！\n@c0@"
140:
  de: "@aNera@bRecht so, %a001240! Und von mir kriegt er gleich auch noch eins übergebraten!\n@c0@"
  en: "@aNera@bGood idea, %a001240.\nI'll give him a thump as well!\n@c0@"
  es: "@aNera@bBuona idea, %a001240.\nYo también le daré un buen colpo.\n@c0@"
  fr: "@aNera@bBonne idée, %a001240.\nMoi aussi, je lui donnerai un coup.\n@c0@"
  it: "@aNera@bNemmeno per idea, %a001240. Quell'uomo ha riconosciuto di aver sbagliato a discutere con tuo nonno.\nMerita tutto il nostro rispetto.\n@c0@"
  ja: "@a@bフローラ「じゃあ　お母さんも\n\tいっしょに　しかえし　してあげる。\n@c0@"
141:
  de: "@a%0%a001240@bN-Nein! Das war doch bloß ein Witz, Mama! Den hast du gar nicht mitgekriegt, oder?\n@c0@"
  en: "@a%0%a001240@bN-No! I was only joking, Mum!\nThat went right over your head, didn't it?\n@c0@"
  es: "@a%0%a001240@b¡N-no! ¡Era broma, mamá!\nNo te diste cuenta, ¿verdad?\n@c0@"
  fr: "@a%0%a001240@bN-Nonⓠ Je rigolais, mamanⓠ\nT'avais pas compris, heinⓡ\n@c0@"
  it: "@a%0%a001240@bRispetto?! Ma quale rispetto?!\nIo voglio inseguirlo col forcone, quel brutto puzzone che non è altro...!\n@c0@"
  ja: "@a@b%a001240「じ　じょうだんだよ！\n\tはあ…　お母さんって　本当に\n\tじょうだんが　通じないんだからなあ。\n@c0@"
142:
  de: "@aNera@bOh! Ich... äh... doch, aber natürlich... äh...\n@c0@"
  en: "@aNera@bOh! I, er...\n@c0@"
  es: "@aNera@b¡Ah!, Yo, eh...\n@c0@"
  fr: "@aNera@bOhⓠ Je, euh...\n@c0@"
  it: "@aNera@bSanta dea, aiutami tu...\n@c0@"
  ja: "@a@bフローラ「うふふ。\n@c0@"
143:
  de: "@a%0%a001250@bIch wette, jetzt kommt er sich ganz schön blöd vor!\n@c0@"
  en: "@a%0%a001250@bI bet he feels really silly now!\n@c0@"
  es: "@a%0%a001250@b¡Seguro que ahora se siente un poco tonto!\n@c0@"
  fr: "@a%0%a001250@bJe parie qu'il doit se sentir bête, maintenant.\n@c0@"
  it: "@a%0%a001250@bAh, non c'è problema.\nSono sicura che nonno Russel lo ha perdonato per il suo comportamento!\n@c0@"
  ja: "@a@b%a001250「今のおじさん\n\tしょえー　って言った……。\n@c0@"
144:
  de: "@aBianca@b...\n@c0@"
  en: "@aBianca@b............\n@c0@"
  es: "@aBianca@b...\n@c0@"
  fr: "@aBianca@b............\n@c0@"
  it: "@aBianca@b...\n@c0@"
  ja: "@a@bビアンカ「……………。\n@c0@"
145:
  de: "@aBianca@bAch, da fällt mir wirklich ein Stein vom Herzen. Offenbar haben sich viele Dorfbewohner damals noch in Sicherheit bringen können.\n@c0@"
  en: "@aBianca@bI'm feelin' quite relieved. It looks like lots of folk managed to escape to safety when it all went to pot.\n@c0@"
  es: "@aBianca@bMe siento muy aliviada. Parece que hubo mucha gente que pudo escapar cuando todo se fue al traste.\n@c0@"
  fr: "@aBianca@bJe suis soulagée. On dirait que la majorité des gens\r\na réussi à se mettre à l'abri quand tout a dégénéré.\n@c0@"
  it: "@aBianca@bSe il raccolto sarà buono, diremo alla nostra cuoca di venire a comprare un po' di verdure qui. Così faremo la nostra parte per aiutare l'economia locale.\n@c0@"
  ja: "@a@bビアンカ「なんだか　うれしくて……。\n\tあのとき　逃げのびていた人\n\tじつは　たくさんいたんだなって。\n@c0@"
146:
  de: "@aBianca@bHa ha ha! Stell dir bloß vor, was er erst sagen würde, wenn er wüsste, dass jetzt du der König von Humburg bist!\n@c0@"
  en: "@aBianca@bHa ha ha! Imagine what he'd say if he found out you're the King of Gotha now!\n@c0@"
  es: "@aBianca@b¡Ja, ja, ja! ¡Imagina lo que diría si descubriera que ahora eres el rey de Pankraz!\n@c0@"
  fr: "@aBianca@bHa ha haⓠ Imagine ce qu'il dirait s'il découvrait que c'est toi le roi de Gotha, maintenantⓠ\n@c0@"
  it: "@aBianca@bAh ah ah!\nAllora sarà meglio non dirgli che ora il Re di Denim sei tu, altrimenti farà un bel capitombolo!\n@c0@"
  ja: "@a@bビアンカ「あはは。　今の　おじいさん\n\t%a000090が　今の王さまだなんて\n\t思いもしないでしょうね。\n@c0@"
147:
  de: "@aNera@bHa ha ha. Was für ein fröhlicher alter Mann!\n@c0@"
  en: "@aNera@bHa ha hah. What a jolly old man!\n@c0@"
  es: "@aNera@b¡Ja, ja, ja! ¡Qué nonno más divertido!\n@c0@"
  fr: "@aNera@bHa ha haⓠ Qu'il est drôle, ce vieux monsieurⓠ\n@c0@"
  it: "@aNera@bPensa che faccia farebbe se sapesse che tu sei il nuovo Re di Denim...\n@c0@"
  ja: "@a@bフローラ「うふふ。\n\t元気な　おじいさまですわね。\n@c0@"
148:
  de: "@a%0%a001240@bGroßvater hat alle hier an der Nase herumgeführt. Keiner hat geahnt, dass er ein mächtiger König war.\n@c0@"
  en: "@a%0%a001240@bGrandpa fooled everyone here.\nNo one had any idea he was a mighty king.\n@c0@"
  es: "@a%0%a001240@bEl abuelo los tenía a todos engañados.\nNadie tenía ni idea de que era un poderoso rey.\n@c0@"
  fr: "@a%0%a001240@bGrand-père a réussi à duper tout le monde, ici.\nPersonne ne savait que c'était un puissant roi.\n@c0@"
  it: "@a%0%a001240@bNessuno degli abitanti di Valcava sapeva che nonno Russel era un re, eh?\n@c0@"
  ja: "@a@b%a001240「おじいちゃん　この村では\n\t身分をかくして　暮らしてたんだね。\n@c0@"
149:
  de: "@a%0%a001240@bDas war doch echt klasse von ihm!\n@c0@"
  en: "@a%0%a001240@bThat's really cool!\n@c0@"
  es: "@a%0%a001240@b¡Eso es genial!\n@c0@"
  fr: "@a%0%a001240@bC'est vraiment superⓠ\n@c0@"
  it: "@a%0%a001240@bIl nonno sì che sapeva come si tiene un segreto!\n@c0@"
  ja: "@a@b%a001240「それって　すごく\n\tかっこいいかも！\n@c0@"
150:
  de: "@a%0%a001240@bAber... Aber jetzt wird keiner mehr von Monstern angegriffen, oder? Auch nicht mehr außerhalb von Städten und nicht mal mehr in Höhlen!\n@c0@"
  en: "@a%0%a001240@bI... I suppose we won't get attacked by monsters anywhere now, will we? Not outside towns, or in caves, even.\n@c0@"
  es: "@a%0%a001240@bYo... Supongo que ya no nos volverán a atacar los monstruos, ¿verdad? Ni siquiera en campo abierto o en las cuevas.\n@c0@"
  fr: "@a%0%a001240@bJe... Je suppose que les monstres ne nous attaqueront plus nulle part, heinⓡ Ni en dehors\ndes villes ni même dans les grottes.\n@c0@"
  it: "@a%0%a001240@bPenso che ormai nessuno corra più il rischio di essere attaccato dai mostri. Il mondo è tornato a essere un posto tranquillo e pacifico...\n@c0@"
  ja: "@a@b%a001240「そっか…　もう\n\t洞くつや　町の外でも\n\t魔物に　おそわれたりしないんだね。\n@c0@"
151:
  de: "@a%0%a001240@bDas kann ich mir wirklich nicht vorstellen. Wie das wohl sein wird?\n@c0@"
  en: "@a%0%a001240@bI can't really imagine it. I wonder what it's going to feel like.\n@c0@"
  es: "@a%0%a001240@bMe cuesta imaginarlo. ¿Cómo será sentirse así?\n@c0@"
  fr: "@a%0%a001240@bJ'ai du mal à l'imaginer. Je me demande comment\nça sera.\n@c0@"
  it: "@a%0%a001240@bSi prospettano tempi duri per i mercanti d'armi e d'armature!\n@c0@"
  ja: "@a@b%a001240「それって\n\tどんな感じなんだろう。\n\tまだ　想像できないよ。\n@c0@"
152:
  de: "@aBianca@bMächtig stolz! Na, das hört man doch gern, oder?\n@c0@"
  en: "@aBianca@bProud as Punch, eh? That's nice to hear, en't it?\n@c0@"
  es: "@aBianca@bOrgullosos, ¿eh? Qué majo, ¿verdad?\n@c0@"
  fr: "@aBianca@bVraiment très fiersⓡ Voilà qui est agréable\nà entendre, heinⓡ\n@c0@"
  it: "@aBianca@bDiamine! Sanno già tutto?!\nE io che volevo pavoneggiarmi un po' a raccontare le nostre imprese a destra e a manca...\n@c0@"
  ja: "@a@bビアンカ「１ばんの出世がしらだって。\n\tほめられたわね　%a000090。\n\tうれしい？\n@c0@"
153:
  de: "@a%0%a001250@bHoffentlich sind die Leute von Humburg irgendwann auch mal stolz wie Oskar.\nWer ist eigentlich dieser Oskar?\n@c0@"
  en: "@a%0%a001250@bI hope the people of Gotha will all be as proud as Punch of me one day. Although...what was Punch proud about?\n@c0@"
  es: "@a%0%a001250@bEspero que un día el pueblo de Pankraz se sienta orgulloso de mí. ¡Que celebren el Día del Orgullo %0%a001250!\n@c0@"
  fr: "@a%0%a001250@bJ'espère que les gens de Gotha seront vraiment très fiers de moi un jour.\n@c0@"
  it: "@a%0%a001250@bCome fanno a sapere già tutto?\nChi li ha informati?\n@c0@"
  ja: "@a@b%a001250「わたしも　グランバニアの\n\t１ばんの　出世がしらに\n\tなりたい……かも。\n@c0@"
154:
  de: "@aBianca@bAlso gibt's auch hier Leute, die dich kennen, %a000090.\n@c0@"
  en: "@aBianca@bSo there are folk here who know you too, %a000090.\n@c0@"
  es: "@aBianca@bAsí que aquí también hay gente que te conoce, %a000090.\n@c0@"
  fr: "@aBianca@bAlors comme ça, il y a aussi des gens qui te connaissent ici, %a000090.\n@c0@"
  it: "@aBianca@bAnche quest'uomo è scampato alla devastazione di Valcava...\nSai una cosa, %a000090?\n@c0@"
  ja: "@a@bビアンカ「ここにも　%a000090を\n\t知っている人が……。\n@c0@"
155:
  de: "@aBianca@bIst dir nicht auch schon der Gedanke gekommen, dass die Soldaten von Tifortu die Dörfler gehen ließen, bevor sie ihre Häuser in Brand steckten?\n@c0@"
  en: "@aBianca@bD'you get the feelin' that the Coburg soldiers let the villagers go before settin' fire to the place?\n@c0@"
  es: "@aBianca@b¿No te da la impresión de que los soldados de Trastámara dejaron huir a la gente antes de prender fuego al sitio?\n@c0@"
  fr: "@aBianca@bTu ne crois pas que les soldats de Cobourg ont dit aux gens de partir avant d'incendier les maisonsⓡ\n@c0@"
  it: "@aBianca@bSecondo me i soldati di Coburg fecero scappare la maggior parte della popolazione prima di distruggere il villaggio.\n㈡\nDopotutto, nemmeno a loro avrebbe fatto piacere uccidere degli innocenti...\n@c0@"
  ja: "@a@bビアンカ「もしかしたらラインハットの兵は\n\t村だけ燃やして　村の人たちは\n\t逃がしてあげてたのかしら……？\n@c0@"
156:
  de: "@aBianca@bKann ja sein, dass ich damit total daneben liege, aber ich glaub's nicht.\n@c0@"
  en: "@aBianca@bI could be wrong, but I reckon that's prob'ly\r\nwhat happened.\n@c0@"
  es: "@aBianca@bPuede que me equivoque, pero creo que eso es lo que debió pasar, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe me trompe peut-être, mais j'ai l'impression que c'est comme ça que ça s'est passé.\n@c0@"
  it: "@aBianca@bSì, mi piace pensare che le cose siano andate proprio così...\n@c0@"
  ja: "@a@bビアンカ「わかんないけど…\n\tそんな感じがすると思わない？\n@c0@"
157:
  de: "@aNera@bOffenbar sind viele Leute hierher zurückgekehrt. Ich glaube, Steinach wird schon bald wieder blühen und gedeihen.\n@c0@"
  en: "@aNera@bIt seems like plenty of people have come back here. Whealbrook's going to be fine, I should think.\n@c0@"
  es: "@aNera@bParece que ha ritornato molta gente. A Arroyofrío le va a ir bien, me parece.\n@c0@"
  fr: "@aNera@bOn dirait que plein de gens sont revenus ici.\r\nTout va bien se passer à Ruycelieu, maintenant.\n@c0@"
  it: "@aNera@bC'è parecchia gente in giro, non è vero?\nDirei che Valcava si è finalmente lasciata alle spalle il suo tragico passato...\n@c0@"
  ja: "@a@bフローラ「ずいぶん　たくさんの人が\n\tもどってきましたのね。\n\tこの村も　もう大丈夫ですわ。\n@c0@"
158:
  de: "@aBianca@bWas ist los, %a000090? Einen Moment lang sahst du ganz verloren aus.\n@c0@"
  en: "@aBianca@bWhat's up, %a000090? You looked a bit lost for a minute.\n@c0@"
  es: "@aBianca@b¿Qué pasa, %a000090? Parecías perdido por un momento.\n@c0@"
  fr: "@aBianca@bQu'est-ce qu'il y a, %a000090ⓡ Tu as eu l'air un peu absent pendant quelques instants.\n@c0@"
  it: "@aBianca@bChe ti prende, %a000090?\nNon ti senti bene?\n@c0@"
  ja: "@a@bビアンカ「どうしたの　%a000090？\n\t今　時間が止まってたような\n\t顔してたわよ。\n@c0@"
159:
  de: "@aNera@bWas ist denn, Liebling? Ich habe dich ja noch nie so erleichtert gesehen!\n@c0@"
  en: "@aNera@bWhat's the matter, darling? I've never seen such a look of relief on your face before.\n@c0@"
  es: "@aNera@b¿Qué pasa, caro? Nunca había visto esa mirada de alivio en tu cara.\n@c0@"
  fr: "@aNera@bQu'est-ce qu'il y a, mon chériⓡ Je n'avais encore jamais lu un tel soulagement sur ton visage.\n@c0@"
  it: "@aNera@bChe succede, tesoro?\nPer un attimo sei impallidito.\nA cosa stavi pensando?\n@c0@"
  ja: "@a@bフローラ「どうしたの　あなた？\n\tあなたの　そんな　ホッとしたような顔\n\t初めて見ましたわ。\n@c0@"
160:
  de: "@a%0%a001240@bKlasse! Er hat's geschafft, alles aufzuessen, bevor seine Frau was mitgekriegt hat. Den Trick muss ich mir merken!\n@c0@"
  en: "@a%0%a001240@bWow! He managed to eat all of that before his wife noticed what he was doing. That could be a really useful trick!\n@c0@"
  es: "@a%0%a001240@b¡Vaya! Fue capaz de comérselo todo antes de que su mujer se diese cuenta. ¡Ese truco podría ser útil!\n@c0@"
  fr: "@a%0%a001240@bWaouhⓠ Il a réussi à manger tout ça avant que sa femme s'aperçoive de ce qu'il faisait. Faudrait qu'il me dise comment il faitⓠ\n@c0@"
  it: "@a%0%a001240@bÈ riuscito a far sparire il contenuto della pentola senza che la moglie se ne accorgesse?!\nQuell'uomo è un mago!\n@c0@"
  ja: "@a@b%a001240「すごい！　あのおばさんに\n\t気づかれずに食べるなんて\n\tすっごい　はやわざだね！\n@c0@"
161:
  de: "@a%0%a001250@bIch kriege auch Hunger. Hoffentlich gibt's daheim in Humburg was zu essen.\n@c0@"
  en: "@a%0%a001250@bI'm a bit hungry, actually. I hope there'll be something to eat back in Gotha.\n@c0@"
  es: "@a%0%a001250@bEn realidad, estoy algo hambrienta. Espero que haya algo de comer cuando lleguemos a Pankraz.\n@c0@"
  fr: "@a%0%a001250@bEn fait, moi aussi, je commence à avoir faim.\nJ'espère qu'il y aura quelque chose à manger\nquand on arrivera à Gotha.\n@c0@"
  it: "@a%0%a001250@bHo fame... Papà, puoi mandare qualcuno a Denim per dire di farci trovare pronto da mangiare per quando arriveremo?\n@c0@"
  ja: "@a@b%a001250「わたしも　おなかすいちゃった。\n\tグランバニアに　ごはん\n\tあるかなあ……。\n@c0@"
162:
  de: "@aBianca@bHe! War der nicht bei dem Mann in die Lehre gegangen, der uns damals die Medizin für meinen Vater gegeben hat?\n@c0@"
  en: "@aBianca@bHey! That's the bloke who was studyin' under the man who give us the medicine for Dad all them\r\nyears ago.\n@c0@"
  es: "@aBianca@b¡Eh, ese es el tipo que estaba estudiando con el hombre que nos dio la medicina para papá hace años!\n@c0@"
  fr: "@aBianca@bHéⓠ C'était l'élève de l'homme qui nous avait donné le médicament pour papa, il y a si longtemps.\n@c0@"
  it: "@aBianca@bQuello è il tizio che studiava da farmacista quand'ero piccola!\n@c0@"
  ja: "@a@bビアンカ「あっ　あの人は\n\t昔　お父さんの薬を作ってくれた人の\n\tお弟子さんね。\n@c0@"
163:
  de: "@aBianca@bSchön, ihn hier heil und wohlbehalten wieder anzutreffen!\n@c0@"
  en: "@aBianca@bIt's good to see him back here safe and sound.\n@c0@"
  es: "@aBianca@bMe alegro de verlo de vuelta y a salvo, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe suis contente de voir qu'il est revenu ici et\r\nqu'il va bien.\n@c0@"
  it: "@aBianca@bMi fa piacere che anche lui abbia deciso di tornare!\nQuesto posto è proprio rinato!\n@c0@"
  ja: "@a@bビアンカ「あの人も\n\tもどってきてくれたんだ…　よかった。\n@c0@"
164:
  de: "@aNera@bEr wird es sicher schaffen.\n@c0@"
  en: "@aNera@bI'm sure he'll make it.\n@c0@"
  es: "@aNera@bSicuro que lo conseguirá.\n@c0@"
  fr: "@aNera@bJe suis sûre qu'il y arrivera.\n@c0@"
  it: "@aNera@bNon è mai troppo tardi per realizzare i propri sogni...\n@c0@"
  ja: "@a@bフローラ「あの方　きっと　りっぱな\n\tくすり師さんに　なるでしょうね。\n@c0@"
165:
  de: "@aNera@bJeder, der allen Widrigkeiten zum Trotz an seinen Träumen festhält, hat auch die Kraft, sie zu verwirklichen.\n@c0@"
  en: "@aNera@bAnyone who refuses to give up on their dreams has the power to make them come true.\n@c0@"
  es: "@aNera@bAlguien que se niega a renunciar a sus sueños tiene el poder de hacerlos realità.\n@c0@"
  fr: "@aNera@bToute personne qui refuse de renoncer à ses rêves a le pouvoir de les réaliser.\n@c0@"
  it: "@aNera@bBisogna crederci fino in fondo e impegnarsi al meglio delle proprie capacità.\nIn questo modo, ogni traguardo è raggiungibile.\n@c0@"
  ja: "@a@bフローラ「だって　夢をあきらめない人は\n\t夢をかなえるチカラも\n\t強いと　思いますもの……。\n@c0@"
166:
  de: "@aBianca@bHach, da kommen Erinnerungen hoch, was? Weißt du noch, %a000090?\n@c0@"
  en: "@aBianca@bThis place really takes me back.\nRemember, %a000090?\n@c0@"
  es: "@aBianca@b¡Ah, qué recuerdos me trae este sitio!\n¿Te acuerdas, %a000090?\n@c0@"
  fr: "@aBianca@bCet endroit me rappelle tellement de choses.\nTu te souviens, %a000090ⓡ\n@c0@"
  it: "@aBianca@bQuesto posto mi fa tornare in mente tante cose, %a000090...\n@c0@"
  ja: "@a@bビアンカ「ここ　すごく\n\tなつかしいわ……。\n\tねえ　%a000090　おぼえてる？\n@c0@"
167:
  de: "@aBianca@bWie wir damals... Ach, schon gut. Es tut nicht gut, dauernd auf der Vergangenheit herumzureiten.\n@c0@"
  en: "@aBianca@bThat time... No, it dun't matter. It's no use just harpin' on about the past all the while.\n@c0@"
  es: "@aBianca@bEntonces... No, déjalo. No sirve de nada andar siempre con el rollo del pasado.\n@c0@"
  fr: "@aBianca@bLa fois où... non, peu importe. Ça ne sert à rien de toujours ressasser le passé.\n@c0@"
  it: "@aBianca@bMa non voglio più pensare al passato.\nAdesso desidero concentrarmi sul futuro sereno e felice che vivrò con te e i nostri figli...\n@c0@"
  ja: "@a@bビアンカ「……って　ううん。\n\tなんでもないわ。　昔のことばかり\n\t思い出しても　意味ないものね。\n@c0@"
168:
  de: "@aNera@bDas ist das Haus, das an der Stelle eures alten Hauses gebaut wurde, nicht wahr?\n@c0@"
  en: "@aNera@bThis is the house that was built in place of yours, isn't it?\n@c0@"
  es: "@aNera@bEsta es la casa que ocupa el lugar dove estaba la tuya, ¿vero?\n@c0@"
  fr: "@aNera@bC'est la maison qui a été reconstruite à la place\nde la tienne, c'est çaⓡ\n@c0@"
  it: "@aNera@bQuesta è la casa in cui vivevi quand'eri piccolo, dico bene?\n@c0@"
  ja: "@a@bフローラ「あなたの家のあと地に\n\t建てられたお家ですのね。\n@c0@"
169:
  de: "@aNera@bIch hoffe, dass die Leute glücklich sind, die hier wohnen.\n@c0@"
  en: "@aNera@bI hope the people who live here now will be happy.\n@c0@"
  es: "@aNera@bAspetto que las personas que viven en ella ahora sean felices.\n@c0@"
  fr: "@aNera@bJ'espère que les gens qui y vivent désormais\r\nseront heureux.\n@c0@"
  it: "@aNera@bChissà quanti ricordi avrai...\n@c0@"
  ja: "@a@bフローラ「この家に　住むかたに\n\t幸せが　おとずれますように。\n@c0@"
170:
  de: "@a%0%a001240@bHier hast du gewohnt, als du klein warst, stimmt's, Papa? Nicht in der Burg.\n@c0@"
  en: "@a%0%a001240@bYou lived here when you were little, didn't you, Dad? Not at the castle?\n@c0@"
  es: "@a%0%a001240@bCuando eras pequeño ¿vivías en esta casa, papá? ¿No en el castillo?\n@c0@"
  fr: "@a%0%a001240@bC'est ici que tu vivais quand tu étais petit, hein, papaⓡ Pas au châteauⓡ\n@c0@"
  it: "@a%0%a001240@bPapà, da piccolo vivevi in questa casa, non è vero?\nTi dispiace che ora qui ci abitino altre persone?\n@c0@"
  ja: "@a@b%a001240「お父さんは　城ではなくて\n\tこの場所で　育ったんだよね。\n@c0@"
171:
  de: "@a%0%a001240@bFast so als wärst du ein heimlicher Prinz oder so. Mann, das klingt ja spannend!\n@c0@"
  en: "@a%0%a001240@bIt's like you were a secret prince or something. That's cool!\n@c0@"
  es: "@a%0%a001240@bEras como un príncipe secreto o algo así, entonces. ¡Genial!\n@c0@"
  fr: "@a%0%a001240@bC'est comme si tu avais été un prince caché,\nou quelque chose comme ça. C'est superⓠ\n@c0@"
  it: "@a%0%a001240@bForse dovremmo scrivere qualcosa sul muro...\nChe so io, una roba del tipo ⓕQui ha vissuto il futuro Re di Denimⓖ...\n㈡\nAnzi, no!\nPotremmo scriverci ⓕQui ha vissuto il padre dell'Eroe Leggendarioⓖ! Eh eh eh!\n@c0@"
  ja: "@a@b%a001240「下町の王子って\n\t感じなのかな。\n\tなんか　かっこいいな。\n@c0@"
172:
  de: "@a%0%a001250@bAch, ich wollte so gern ein bisschen hier bleiben. Ich dachte, hier wohnt keiner mehr.\n@c0@"
  en: "@a%0%a001250@bOh, I wanted to lounge around here for a while.\nI didn't think there'd be anyone living here now.\n@c0@"
  es: "@a%0%a001250@b¡Oh!, yo quería rezongar un poco por aquí.\nNo pensé que ahora estuviese habitado.\n@c0@"
  fr: "@a%0%a001250@bOh, je comptais flâner un peu ici. Je ne pensais pas qu'il y aurait des gens qui y habiteraient.\n@c0@"
  it: "@a%0%a001250@bVorrei chiedere agli abitanti della casa il permesso di visitarla, ma temo di disturbarli...\n@c0@"
  ja: "@a@b%a001250「あ～ん…\n\t誰もいなかったら　このおうちで\n\tゴロゴロしたかったのに……。\n@c0@"
173:
  de: "@aBianca@bIch weiß nicht, wo er herkommt, aber auf mich macht er einen guten Eindruck.\n@c0@"
  en: "@aBianca@bI don't know where he come from, but he dun't seem like a bad bloke.\n@c0@"
  es: "@aBianca@bNo sé de dónde ha salido, pero parece buen tipo.\n@c0@"
  fr: "@aBianca@bJe ne sais pas d'où il vient, mais ça n'a pas l'air d'être un mauvais bougre.\n@c0@"
  it: "@aBianca@bC'è rimasto di stucco quando ha capito chi sei, eh?\n@c0@"
  ja: "@a@bビアンカ「どこから来たのか知らないけど\n\t悪い人じゃなさそうね。\n@c0@"
174:
  de: "@aBianca@bEr wird das Haus sicher in Ordnung halten, was?\n@c0@"
  en: "@aBianca@bHopefully he'll take care of this place and keep it nice, eh?\n@c0@"
  es: "@aBianca@bEsperemos que cuide de este sitio y lo mantenga bonito, ¿sabes?\n@c0@"
  fr: "@aBianca@bJ'espère qu'il prendra soin de la maison et qu'il la gardera en bon état.\n@c0@"
  it: "@aBianca@bManca poco che ti chiede l'autografo!\nIh ih ih!\n@c0@"
  ja: "@a@bビアンカ「あの人たちなら　この家\n\t大事に　住んでくれるんじゃない？\n@c0@"
175:
  de: "@a%0%a001240@bHe, Papa, vielleicht können wir hier in den Ferien wohnen, was meinst du?\n@c0@"
  en: "@a%0%a001240@bLet's have his place as a holiday home, Dad!\n@c0@"
  es: "@a%0%a001240@bVamos a quedarnos su casa como casa de veraneo, ¿vale, papá?\n@c0@"
  fr: "@a%0%a001240@bOn peut en faire notre maison de vacances,\ndis, papaⓡ\n@c0@"
  it: "@a%0%a001240@bPapà, perché non gli chiediamo di venderci la casa?\n@c0@"
  ja: "@a@b%a001240「ねえ　お父さん。\n\tここを　別荘に　しようよ。\n@c0@"
176:
  de: "@aBianca@bSei nicht albern, %a001240! Hier wohnen doch Leute.\n@c0@"
  en: "@aBianca@bDun't be so rude, %a001240!\nThere are other folk livin' here now.\n@c0@"
  es: "@aBianca@b¡No seas bruto, %a001240!\nAhora vive otra gente aquí.\n@c0@"
  fr: "@aBianca@bNe sois pas si malpoli, %a001240ⓠ\nIl y a des gens qui y vivent, maintenant.\n@c0@"
  it: "@aBianca@bMa no, %a001240.\nAbbiamo già il nostro castello a Denim.\nChe ce ne faremmo di un'altra abitazione, eh?\n@c0@"
  ja: "@a@bビアンカ「もう　住人がいるでしょ。\n\t%a001240ったら　失礼な子ね。\n@c0@"
177:
  de: "@a%0%a001240@bUps! Das wusste ich nicht...\n@c0@"
  en: "@a%0%a001240@bOops! Sorry!\n@c0@"
  es: "@a%0%a001240@b¡Uy! ¡Perdón!\n@c0@"
  fr: "@a%0%a001240@bOh, pardon. Désoléⓠ\n@c0@"
  it: "@a%0%a001240@bPotremmo venirci per il fine settimana, no?\nCambiare aria ogni tanto fa bene alla salute...\n@c0@"
  ja: "@a@b%a001240「そっか。　ごめんね　お父さん。\n@c0@"
178:
  de: "@a%0%a001240@bHe, Papa, warum kaufen wir das Haus nicht und wohnen in den Ferien hier?\n@c0@"
  en: "@a%0%a001240@bWhy don't we buy this place as a holiday home, Dad?\n@c0@"
  es: "@a%0%a001240@b¿Por qué no compramos esta casa para pasar las vacaciones, papi?\n@c0@"
  fr: "@a%0%a001240@bEt si on achetait cette maison pour venir y passer nos vacances, papaⓡ\n@c0@"
  it: "@a%0%a001240@bPapà, perché non gli chiediamo di venderci la casa?\n@c0@"
  ja: "@a@b%a001240「ねえ　お父さん。\n\tここを　買い取って　別荘にしない？\n@c0@"
179:
  de: "@aNera@bAlso würdest du deine Burg gerne gegen ein Haus eintauschen, ja, %a001240?\n@c0@"
  en: "@aNera@bSo you'd like to swap it for your castle then, would you, %a001240?\n@c0@"
  es: "@aNera@bAllora te gustaría cambiarla por il tuo castello, ¿no, %a001240?\n@c0@"
  fr: "@aNera@bAlors tu serais prêt à l'échanger contre ton château, %a001240ⓡ\n@c0@"
  it: "@aNera@bVuoi un'altra abitazione, %a001240?\nPer me va bene, però poi tu avrai due camerette da tenere in ordine...\n@c0@"
  ja: "@a@bフローラ「そうね　%a001240のお城と\n\t交換しましょうか？\n@c0@"
180:
  de: "@a%0%a001240@bIch, ähm, nein, nicht wirklich...\n@c0@"
  en: "@a%0%a001240@bI, er, not really...!\n@c0@"
  es: "@a%0%a001240@bBueno, en realidad no...\n@c0@"
  fr: "@a%0%a001240@bJe, euh... Non, pas vraimentⓠ\n@c0@"
  it: "@a%0%a001240@bNon facciamo scherzi, eh!\nL'Eroe Leggendario ha diritto a una governante che tenga sempre in ordine i suoi alloggi! Dico bene, no?!\n@c0@"
  ja: "@a@b%a001240「うっ……。\n\tそ　それは……。\n@c0@"
181:
  de: "@a%0%a001240@bHerr Onassetti wirkt richtig glücklich. Sogar noch glücklicher als damals, als wir Bjørn besiegt haben.\n@c0@"
  en: "@a%0%a001240@bMr Briscoletti seems really happy.\nEven happier than the time we defeated Bjørn.\n@c0@"
  es: "@a%0%a001240@bDon Rimaldi parece muy feliz.\nAún más feliz que cuando derrotamos a Patxi.\n@c0@"
  fr: "@a%0%a001240@bMonsieur Oscuroni semble vraiment heureux.\nMême plus heureux que le jour où on a vaincu Nhé.\n@c0@"
  it: "@a%0%a001240@bMister Fosconi è al settimo cielo, eh?\nSembra persino più contento di quando sconfiggemmo Wasen.\n@c0@"
  ja: "@a@b%a001240「ルドマンさん　すごく\n\tうれしそうだね。　ブオーンを\n\tたおしたときより　ずっとうれしそう。\n@c0@"
182:
  de: "@a%0%a001250@bKann ich dich mal was fragen, Papa?\n@c0@"
  en: "@a%0%a001250@bCan I ask you something, Dad?\n@c0@"
  es: "@a%0%a001250@b¿Te puedo preguntar algo, papi?\n@c0@"
  fr: "@a%0%a001250@bJe peux te demander quelque chose, papaⓡ\n@c0@"
  it: "@a%0%a001250@bPapà, posso chiederti una cosa?\n@c0@"
  ja: "@a@b%a001250「あの…　ねえ　お父さん？\n\t前から　聞きたかったんだけど……。\n@c0@"
183:
  de: "@a%0%a001250@bMama war so nervös auf dem Weg hierher. Hatte sie hier vielleicht mal ein besonderes Erlebnis?\n@c0@"
  en: "@a%0%a001250@bMum seems really nervous coming here.\nDid something happen to her here in the past?\n@c0@"
  es: "@a%0%a001250@bParece que a mamá le pone nerviosa este sitio.\n¿Le pasó algo aquí?\n@c0@"
  fr: "@a%0%a001250@bMaman est toujours nerveuse quand on vient ici.\nIl s'est passé quelque chose ici, dans le tempsⓡ\n@c0@"
  it: "@a%0%a001250@bCome mai la mamma è sempre tanto nervosa quando veniamo qui?\nForse c'è qualche pensiero che la turba?\n@c0@"
  ja: "@a@b%a001250「お母さんって　この家に来ると\n\tすごく　きんちょうするみたいなの。\n\t昔　この家で　なにかあったの？\n@c0@"
184:
  de: "@aBianca@bWie es Nera und Griselda wohl geht? Wir sollten mal bei ihnen vorbeischauen, %a000090.\n@c0@"
  en: "@aBianca@bI wonder how Nera and Debora are gettin' on.\nWe should drop in on 'em, %a000090.\n@c0@"
  es: "@aBianca@bMe pregunto cómo les irá a Nera y Stefania, ¿sabes? Deberíamos hacerles una visita, %a000090.\n@c0@"
  fr: "@aBianca@bJe me demande comment vont Nera et Pandora.\nOn devrait passer les voir, %a000090.\n@c0@"
  it: "@aBianca@bChissà come se la passano Nera e Viola...\nForse dovremmo andare a trovarle, %a000090.\n@c0@"
  ja: "@a@bビアンカ「フローラさんと　デボラさんは\n\t元気にしてるかしら？\n\t%a000090　会っていきましょうね。\n@c0@"
185:
  de: "@aBianca@bEr hat uns nicht nur das Schiff gegeben. Er hat dazu auch noch unsere Hochzeit ausgerichtet und alles.\n@c0@"
  en: "@aBianca@bIt weren't just the boat he give us. He paid for our weddin' and everythin'.\n@c0@"
  es: "@aBianca@bNo solo nos dio el barco, ¿sabes? También pagó nuestra boda y todo eso.\n@c0@"
  fr: "@aBianca@bIl n'a pas fait que nous donner le bateau.\r\nIl a aussi payé pour notre mariage et tout ça.\n@c0@"
  it: "@aBianca@bIn effetti, pavoneggiarsi dicendo che una delle sue navi ha trasportato i salvatori dell'umanità è un'ottima pubblicità per mister Fosconi...\n@c0@"
  ja: "@a@bビアンカ「船だけじゃなくて　結婚式も\n\tあげてもらったんだけど……\n@c0@"
186:
  de: "@aBianca@bAber das scheint er wohl vergessen zu haben...\n@c0@"
  en: "@aBianca@bI wonder if he's forgotten that bit.\n@c0@"
  es: "@aBianca@bA lo mejor ya ni se acuerda.\n@c0@"
  fr: "@aBianca@bJe me demande s'il a oublié ce passage-là.\n@c0@"
  it: "@aBianca@bGià mi sembra di leggere i manifesti nei porti di tutto il mondo...\n㈡\nⓕCompagnia di navigazione Fosconi: per una crociera... Leggendariaⓖ.\n@c0@"
  ja: "@a@bビアンカ「ルドマンさんったら\n\tそっちのほうは\n\t忘れちゃったのかしら？\n@c0@"
187:
  de: "@a%0%a001240@bWir haben das Schiff ewig benutzt, nicht? Sogar noch, nachdem wir dich wiedergefunden hatten, Papa. Das war wirklich praktisch.\n@c0@"
  en: "@a%0%a001240@bWe've been using the ship for ages, haven't we?\nEven after we found you again, Dad.\nIt's been really useful.\n@c0@"
  es: "@a%0%a001240@bLlevamos años usando el barco, ¿verdad?\nDesde antes de volver a encontrarte, papá.\nNos ha sido muy útil.\n@c0@"
  fr: "@a%0%a001240@bOn a utilisé son bateau pendant très longtemps, heinⓡ Même après t'avoir retrouvé, papa.\nIl nous a été bien utile.\n@c0@"
  it: "@a%0%a001240@bSe non avessimo potuto usare la nave, ci avremmo messo una vita per spostarci da un posto all'altro.\n㈡\nChissà, forse non avremmo fatto in tempo a fermare Nimzo...\n@c0@"
  ja: "@a@b%a001240「船は　お父さんと再会してからも\n\tずっと　つかってたもんね。\n\tかしてもらえて　すごく助かったよね？\n@c0@"
188:
  de: "@aNera@bPapa sieht jetzt richtig glücklich aus.\n@c0@"
  en: "@aNera@bPapa really does look happy now.\n@c0@"
  es: "@aNera@bIl papino sembra muy feliz ahora.\n@c0@"
  fr: "@aNera@bPapa a l'air vraiment heureux, maintenant.\n@c0@"
  it: "@aNera@bMio padre è al colmo della felicità!\n@c0@"
  ja: "@a@bフローラ「お父さまったら　本当に\n\tうれしそうな　顔……。\n@c0@"
189:
  de: "@aNera@bUnd er ist jetzt Großvater! Das ist ein komischer Gedanke.\n@c0@"
  en: "@aNera@bAnd he's a grandpapa now! That's a funny thought.\n@c0@"
  es: "@aNera@b¡Y ya es nonno! Eso tiene gracia.\n@c0@"
  fr: "@aNera@bEt il est grand-père, en plusⓠ Ça me fait drôle.\n@c0@"
  it: "@aNera@bMi chiedo se sia più contento per la salvezza del mondo o per il fatto di essere diventato nonno...\n@c0@"
  ja: "@a@bフローラ「おじいちゃんですって…\n\tうふふふふ。\n@c0@"
190:
  de: "@aNera@bIch habe mich wohl Mama gegenüber recht reserviert verhalten. Bestimmt war sie darüber nicht sehr glücklich.\n@c0@"
  en: "@aNera@bI suppose I've been holding back slightly from Mama until now. It's probably made her feel a bit sad.\n@c0@"
  es: "@aNera@bSupongo que me había estado alejando un poco de la mia mamma. Eso le habrá puesto un po' triste.\n@c0@"
  fr: "@aNera@bJ'ai dû être un peu distante vis-à-vis d'elle, jusque-là. Ça a dû la rendre un peu triste.\n@c0@"
  it: "@aNera@bA volte penso di non aver dimostrato ai miei genitori tutto l'affetto che provo per loro...\n@c0@"
  ja: "@a@bフローラ「私も　今まで\n\tえんりょしていた部分が　あったから\n\tお母さま　さみしかったかも知れない。\n@c0@"
191:
  de: "@aNera@bDafür haben wir von jetzt an sicher eine richtige Mutter-Tochter-Beziehung, mit all den kleinen Geheimnissen und Streitereien, die dazugehören!\n@c0@"
  en: "@aNera@bBut from now on, I think we'll have a proper mother-daughter relationship, with all the girly gossiping and quarrelling you'd expect!\n@c0@"
  es: "@aNera@b¡Ma a partir de ahora, creo que tendremos una relación mamma-figlia verdadera, con todo el chismorreo y las discusiones que cabe esperar!\n@c0@"
  fr: "@aNera@bÀ partir de maintenant, nous allons avoir une vraie relation mère-fille, avec tous les commérages et les chamailleries qui vont avec.\n@c0@"
  it: "@aNera@bEppure li adoro!\nMio padre e mia madre sono due persone meravigliose!\n㈡\nSperiamo solo che non vizino troppo %a001250 e %a001240!\n@c0@"
  ja: "@a@bフローラ「でも　これからは　甘えたり\n\tわがまま言えたりするような\n\t関係に　なれるような気がします。\n@c0@"
192:
  de: "@aNera@bPapa war so gut zu uns! Er hat uns sein Schiff überlassen und uns mit Geschenken überschüttet.\n@c0@"
  en: "@aNera@bPapa's been so good to us. He let us use his ship, and gave us so many presents.\n@c0@"
  es: "@aNera@bIl mio papino ha sido muy bueno con nosotros. Nos dejó usar su barco y nos hizo muchos regalos.\n@c0@"
  fr: "@aNera@bPapa a été si gentil avec nous. Il nous a laissé utiliser son bateau et il nous a couverts de cadeaux.\n@c0@"
  it: "@aNera@bMio padre ci ha aiutati tantissimo, caro.\nNon solo ci ha prestato una delle sue navi, ma ci ha fatto anche un mucchio di regali!\n@c0@"
  ja: "@a@bフローラ「お父さまったら……。\n\tでも　船を　つかわせてくれたり\n\tおくりものを　届けてくれたり……\n@c0@"
193:
  de: "@aNera@bOhne seine Hilfe hätten wir es nie geschafft, weißt du.\n@c0@"
  en: "@aNera@bWe might not have been able to do it without his help, you know.\n@c0@"
  es: "@aNera@bTal vez no hubiéramos podido apañarnos sin su barco, tu sai.\n@c0@"
  fr: "@aNera@bNous n'y serions peut-être pas arrivés sans son aide, tu sais.\n@c0@"
  it: "@aNera@bSenza di lui, forse non saremmo riusciti nella nostra impresa...\n@c0@"
  ja: "@a@bフローラ「本当に　助かりましたわよね。\n@c0@"
194:
  de: "@a%0%a001240@bHerr Onassetti ist doch auch mein Großvater, nicht? Weil er dein Vater ist, stimmt's, Mama?\n@c0@"
  en: "@a%0%a001240@bMr Briscoletti's my grandpa too, isn't he?\nBecause he's your dad, right, Mum?\n@c0@"
  es: "@a%0%a001240@bDon Rimaldi es mi abuelo también, ¿no?\nPorque él es tu padre, ¿verdad, mamá?\n@c0@"
  fr: "@a%0%a001240@bMonsieur Oscuroni est aussi mon grand-père, alorsⓡ Parce que c'est ton papa, c'est ça, mamanⓡ\n@c0@"
  it: "@a%0%a001240@bMammina, nonno Rick vuole più bene a me che a %a001250, non è vero?\nLei non è mica una nipote ⓕleggendariaⓖ...\n@c0@"
  ja: "@a@b%a001240「ルドマンさんは　本当に\n\tボクの　おじいちゃんだもんね。\n\tお母さんの　大事な　お父さんだから。\n@c0@"
195:
  de: "@aNera@bStimmt genau, %a001240.\n@c0@"
  en: "@aNera@bThat's right, %a001240.\n@c0@"
  es: "@aNera@bEso es, %a001240.\n@c0@"
  fr: "@aNera@bC'est bien ça, %a001240.\n@c0@"
  it: "@aNera@bNon dire sciocchezze, %a001240...\n@c0@"
  ja: "@a@bフローラ「まあ　%a001240。\n\tそうね…　うふふ。\n@c0@"
196:
  de: "@aBianca@bEs kommt mir vor, als wäre es gestern gewesen, dass wir hier geheiratet haben.\n@c0@"
  en: "@aBianca@bIt feels like only yesterday that we were here\r\ngettin' wed.\n@c0@"
  es: "@aBianca@bMe siento como si hubiera sido ayer cuando nos casamos aquí.\n@c0@"
  fr: "@aBianca@bJe n'ai pas vu les années passer depuis notre mariage. C'est comme si c'était hier.\n@c0@"
  it: "@aBianca@bMi sembra ieri che eravamo qui per le nostre nozze...\n@c0@"
  ja: "@a@bビアンカ「この町で　結婚式をしたのが\n\tなんだか　つい\n\tこのあいだのことみたい……。\n@c0@"
197:
  de: "@aBianca@bVielleicht liegt das ja an all den Jahren, die wir als Statuen verbracht haben? Ach was, ich glaube, es ist mehr als das.\n@c0@"
  en: "@aBianca@bMaybe it's all them years we spent as statues\r\nthat makes it feel that way. Nah, I think it's more than that.\n@c0@"
  es: "@aBianca@bTal vez sea por todos esos años que pasamos como estatuas. No, creo que es más que eso, ¿sabes?\n@c0@"
  fr: "@aBianca@bC'est peut-être tout ce temps que nous avons passé pétrifiés qui me donne cette impression. Non, je crois que c'est autre chose encore.\n@c0@"
  it: "@aBianca@bEppure è passato tanto tempo da allora...\n@c0@"
  ja: "@a@bビアンカ「石になってた時間が\n\t長いから　そう感じるのかしら？\n\tううん　そうじゃないわよね。\n@c0@"
198:
