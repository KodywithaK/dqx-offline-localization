  fr: "@a%0%a001240@bRegarde çaⓠ Tout le monde danse. C'est comme un festivalⓠ\n@c0@"
  it: "@a%0%a001240@bPapà, hai visto come si divertono?\nVedere tutta questa gente felice mi mette allegria!\n@c0@"
  ja: "@a@b%a001240「ねえねえ！\n\tみんな　おどってるよ！\n\tすごい！　おまつりみたい！！\n@c0@"
200:
  de: "@a%0%a001250@bFreust du dich, dass du Mama geheiratet hast, Papa?\n@c0@"
