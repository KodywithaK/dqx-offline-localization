  it: "@a%0%a001240@bSì, è tornata la pace!\nTroppo forte, eh?\n@c0@"
  ja: "@a@b%a001240「あ　それっ！　あ　それっ！\n@c0@"
206:
  de: "@aBianca@bSie sehen alle so vergnügt aus. Möchtest du tanzen, %a000090?\n@c0@"
