  es: "@a%0%a001250@b¿Eh? ¿No eras gran cosa, papi? ¡No me lo creo!\n@c0@"
  fr: "@a%0%a001250@bQuoiⓡ Tu n'étais pas bon à grand-choseⓡ\nNon, je ne peux pas croire çaⓠ\n@c0@"
  it: "@a%0%a001250@bChe cosa?! Ma come si permette, eh?!\nIl mio papà non è una frana!\nNon lo è mai stato e non lo sarà mai!\n@c0@"
