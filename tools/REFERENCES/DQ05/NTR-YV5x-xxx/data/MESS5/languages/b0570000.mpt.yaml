  fr: "@aPandora@bHa haⓠ Je ne suis pas réellement en colère, ne t'inquiète pas. Et ça ne m'ennuie pas que tu reviennes ici de temps en temps pour voir si elle va bien.\n㈡\nJe t'accompagnerai, évidemment.\n@c0@"
  it: "@aViola@bAh, ho capito. Dici così per non farmi ingelosire...\nNon temere, caro, non sono gelosa di quella contadinotta... Ehm, non sono gelosa di Bianca... \n㈡\nSe vorrai, potrai passare a salutarla, ogni tanto.\nIo verrò con te, è ovvio. Puoi scordarti di venire a trovare quello schianto di donna da solo!\n@c0@"
  ja: "@a@bデボラ「…なんて　いじわるは　言わないわよ。\n\tたまに　ようすを　見に来るくらいなら\n\t許してあげる。　私も　ついてくるけどね。\n@c0@"
447:
  de: "@a%0%a001240@bOh! Bianca ist sooo hübsch! Äh... Ich meine...\n@c0@"
  en: "@a%0%a001240@bWow! Bianca's so pretty! Er...I mean...\n@c0@"
  es: "@a%0%a001240@b¡Vaya! ¡Qué guapa es Bianca! Esto... Quiero decir...\n@c0@"
  fr: "@a%0%a001240@bWaouhⓠ Bianca est super jolieⓠ Euh... enfin...\n@c0@"
  it: "@a%0%a001240@bPapà, hai visto quant'è bella Bianca?\nSenti, non è che per caso ha una sorellina piccola?\n@c0@"
  ja: "@a@b%a001240「ビアンカさんって\n\tきれいな人だよね。\n\tぽっ……。\n@c0@"
448:
  de: "@a%0%a001250@bWas? Du warst zu nichts zu gebrauchen? Das glaube ich nicht!\n@c0@"
