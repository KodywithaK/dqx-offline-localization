  ja: "@a@b%a001250「気のせいだと　思ってたけど\n\tやっぱり　この人　心の中が\n\tお母さんと　似ています……。\n@c0@"
430:
  de: "@aGriselda@bDie ganze Stadt feiert ja! Sie machen zwar eine Menge Radau, aber dieses eine Mal lass ich's ihnen durchgehen...\n@c0@"
