  ja: "@a@bビアンカ「男の人って\n\tやっぱり　守るべきものがあると\n\tすごく　強くなれるのね。\n@c0@"
224:
  de: "@a%0%a001250@bDu hast dich um Neras Hand beworben? Du meinst, du hättest auch Nera statt Mama heiraten können?\n@c0@"
