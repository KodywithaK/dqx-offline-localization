  it: "@a%0%a001240@bPerò!\nArzillo il vecchietto, eh?\nSe li porta proprio bene i suoi anni!\n@c0@"
  ja: "@a@b%a001240「これからは　きっと\n\tもっともっと　長生きできるよね！\n\tだって　平和なんだもん！\n@c0@"
211:
  de: "@aNera@bSchau mal, Bingo ist auch glücklich. Wahrscheinlich, weil er spürt, dass alle anderen glücklich sind.\n@c0@"
