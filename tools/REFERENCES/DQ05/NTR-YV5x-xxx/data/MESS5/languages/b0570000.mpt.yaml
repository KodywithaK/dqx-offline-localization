  it: "@aNera@bHai visto? Anche Bingo è felice!\nSono certa che ha capito perfettamente che cosa sta succedendo. Eh eh eh!\n@c0@"
  ja: "@a@bフローラ「リリアンも　うれしそう。\n\tみんなが　よろこんでいるのが\n\tわかるのね。\n@c0@"
212:
