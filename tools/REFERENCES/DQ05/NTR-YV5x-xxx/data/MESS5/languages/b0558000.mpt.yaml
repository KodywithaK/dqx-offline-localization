  de: "@a%0%a001240@bIch frage mich, wie die Kräfte des Zenithdrachen überhaupt weggeschlossen wurden... Weißt du das, Papa?\n@c0@"
  en: "@a%0%a001240@bI wonder how the Zenith Dragon's powers were sealed away. Do you know, Dad?\n@c0@"
  es: "@a%0%a001240@bMe pregunto cómo consiguieron sellar los poderes del Dragón de Zenithia. ¿Lo sabes, papi?\n@c0@"
  fr: "@a%0%a001240@bJe me demande comment ils ont pu enfermer les pouvoirs du Dragon du Zénith. Tu sais, toi, papaⓡ\n@c0@"
  it: "@a%0%a001240@bCome avranno fatto a rubare i poteri al Drago di Zenithia, papà?\nNe hai idea?\n@c0@"
  ja: "@a@b%a001240「マスタードラゴンの能力って\n\tどうやって　封印してあるんだろ？\n\tお父さん　わかる？\n@c0@"
60:
  de: "@a%0%a001250@bBöse Monster sind durch und durch schlecht, oder? Sie werden nicht irgendwann gut und verhalten sich ganz normal?\n@c0@"
  en: "@a%0%a001250@bBad monsters are bad through and through, right? They never just turn good and start behaving themselves?\n@c0@"
  es: "@a%0%a001250@bLos monstruos malvados son malvados siempre, ¿verdad? ¿Nunca se hacen buenos y empiezan a portarse bien?\n@c0@"
  fr: "@a%0%a001250@bLes monstres méchants restent toujours méchants, heinⓡ Jamais ils ne deviennent gentilsⓡ\n@c0@"
  it: "@a%0%a001250@bVorrei tanto che i mostri cattivi si ravvedessero e diventassero buoni, ma temo che non sia possibile...\n@c0@"
  ja: "@a@b%a001250「悪い魔物さんは\n\t悪いままなのよね？\n\tいい子になったり　しないのよね？\n@c0@"
61:
  de: "@a%0%a001250@bIrgendwas an der Drachenstatue war nicht richtig. Ich glaube, da fehlte etwas im Gesicht...\n@c0@"
  en: "@a%0%a001250@bThere's something bothering me about that dragon statue. There seemed to be something missing around its face.\n@c0@"
  es: "@a%0%a001250@bEsa estatua del dragón tiene algo raro. Parece que le falta algo en el rostro.\n@c0@"
  fr: "@a%0%a001250@bIl y a quelque chose qui me dérange dans cette statue. On dirait qu'il manque quelque chose sur\nson visage.\n@c0@"
  it: "@a%0%a001250@bIl volto del drago non mi convince...\nÈ come se gli mancasse qualcosa...\n@c0@"
  ja: "@a@b%a001250「気になってるんだけど…\n\tあの　ドラゴンさんの像の顔\n\tなにか　たりなかったような……。\n@c0@"
62:
  de: "@aSancho@bD-Das hatte iss nisst erwartet... Iss hätte nie gedacht, hier die Mörder von Señor Ludwig zu finden. Iss kann gar nisst sagen, was iss fühle...\n@c0@"
  en: "@aSancho@bI, I no expect thees... I never imagined I would find señor Pankraz's keeller here. I, I am overcome by my feelings...\n@c0@"
  es: "@aSancho@bNo esperaba esto... Pues no me imaginé que me encontraría aquí al asesino del señor Teudis. Me superan los sentimientos...\n@c0@"
  fr: "@aSancho@bJe m'attendais p-pas à ça... Je n'aurais j-jamais imaginé t-trouver le meurtrier du señor P-Petros\r\nici. J-Je suis b-bouleversé...\n@c0@"
  it: "@aSancho@bYo no piensavo que aquí avrei trovato l'assassino del señor Russel... Yo me comm...\r\n¡No! ¡No me devo commuovere! ¡Devo essere fuerte!\n@c0@"
  ja: "@a@bサンチョ「まさか　こんなところで\n\tパパスさまのカタキに会うとは……。\n\tまだ　むねが　ざわめきますよ。\n@c0@"
63:
  de: "@aSancho@bAber jetzt, er ist weggelaufen. Wir müssen beenden, was wir angefangen haben!\n@c0@"
  en: "@aSancho@bBut now he has escaped, we must finish what we came here to do.\n@c0@"
  es: "@aSancho@bPero ahorita que escapó, debemos acabar lo que vinimos a hacer.\n@c0@"
  fr: "@aSancho@bMais il s'est enfui et nous d-devons finir\r\nc-ce pourquoi nous sommes v-venus.\n@c0@"
  it: "@aSancho@bEs escappato, chico...\nDobbiamo andare fino en fundo.\n@c0@"
  ja: "@a@bサンチョ「逃がしてしまったものは\n\t仕方ありません。　さあ\n\tやることを　やってしまいましょう。\n@c0@"
64:
  de: "@aOtto@bÄhm, wie lautet noch mal unsere nächste Aufgabe?\n@c0@"
  en: "@aTuppence@bErm, so what do we do now again?\n@c0@"
  es: "@aAlazar@bEsto, ¿qué es lo que tenemos que hacer?\n@c0@"
  fr: "@aInnocent@bMmm, qu'est-ce qu'on doit faire, au justeⓡ\n@c0@"
  it: "@aSimon@bOra cosa facciamo, Maestà?\n@c0@"
  ja: "@a@bピピン「えっと　これから\n\tどうするんでしたっけ？\n@c0@"
65:
  de: "@a%0%a001240@bWer hätte gedacht, dass im Gesicht des Drachen solch ein Mechanismus steckt!\n@c0@"
  en: "@a%0%a001240@bI didn't expect the dragon's face to have a device like that hidden in it!\n@c0@"
  es: "@a%0%a001240@b¡No me esperaba que el rostro del dragón escondiese una cosa así!\n@c0@"
  fr: "@a%0%a001240@bJe ne m'attendais pas à ce qu'il y ait un mécanisme caché dans le visage du dragonⓠ\n@c0@"
  it: "@a%0%a001240@bAccidenti!\nNon avrei mai immaginato che nel volto del drago fosse nascosto un meccanismo del genere!\n@c0@"
  ja: "@a@b%a001240「竜の顔に\n\tあんなしかけが　あったなんて\n\tおどろいたね。\n@c0@"
66:
  de: "@a%0%a001240@bWer auch immer auf die Idee mit der Zunge gekommen ist, muss ganz schön exzentrisch sein. So wie Dr. Ache...\n@c0@"
  en: "@a%0%a001240@bWhoever came up with the idea of going along on its tongue must have been an eccentric one. Just like Dr Agon, in fact!\n@c0@"
  es: "@a%0%a001240@bAl que se le haya ocurrido la idea de hacer de la lengua una entrada, debe de ser muy excéntrico. ¡Como el mismísimo Dr. Agón!\n@c0@"
  fr: "@a%0%a001240@bCelui qui a eu l'idée de marcher sur sa langue doit être vraiment bizarre, exactement dans le genre du Dr Agon, en faitⓠ\n@c0@"
  it: "@a%0%a001240@bCamminare sulla lingua del drago?! Un'idea del genere può essere venuta solo a un tipo molto eccentrico, qualcuno tipo il Dottor Agon, per capirci...\n@c0@"
  ja: "@a@b%a001240「ベロの上を　通るなんて\n\tあれを造った人は　きっと\n\tプサンさんみたいに　ゆかいな人だよ！\n@c0@"
67:
  de: "@a%0%a001250@bIch find's klasse, auf einer Drachenzunge zu gehen. Und es ist noch nicht mal unheimlich, auch wenn es hier sehr hoch ist.\n@c0@"
  en: "@a%0%a001250@bIt's fun walking along a dragon's tongue. And it's not even scary, even if it is high up.\n@c0@"
  es: "@a%0%a001250@bQué divertido es andar por la lengua de un dragón. Y no da nada de miedo, aunque esté tan alto.\n@c0@"
  fr: "@a%0%a001250@bC'est drôle de marcher sur la langue d'un dragon.\nEt ça ne fait même pas peur, même si c'est haut.\n@c0@"
  it: "@a%0%a001250@bCamminare sulla lingua del drago è divertente!\nE non ho nemmeno le vertigini, nonostante ci sia il vuoto sotto di me!\n@c0@"
  ja: "@a@b%a001250「ドラゴンさんの舌の上を\n\t歩くなんて　楽しいね。\n\tあれなら　高くても　こわくなかった。\n@c0@"
68:
  de: "@aSancho@bDiese Mechanismus, er ist loco, no?\n@c0@"
  en: "@aSancho@bThees contraption, ees loco, no!?\n@c0@"
  es: "@aSancho@b¡Es un artefacto reteloco!\n@c0@"
  fr: "@aSancho@bCe t-truc, c'est complètement loco, noⓠⓑ\n@c0@"
  it: "@aSancho@b¡Esto marchingegnos es incredibile!\n@c0@"
  ja: "@a@bサンチョ「とぼけた　しかけも\n\tあったもんですねえ。\n@c0@"
69:
  de: "@aSancho@bDen Kampf von eben habe iss fast schon vergessen...\n@c0@"
  en: "@aSancho@bI have forgotten the estress of the battle we just fought already.\n@c0@"
  es: "@aSancho@bYa me olvidé del combate que tuvimos ahorita mismo.\n@c0@"
  fr: "@aSancho@bÇa m'a fait oublier le stress du c-combat qu'on\r\nv-vient de livrer.\n@c0@"
  it: "@aSancho@bMe ha fatto persino escordare la tensione della battaglia que abbiamo combattuto...\n@c0@"
  ja: "@a@bサンチョ「先ほどの　たたかいの\n\tきんちょうが　いっきに\n\tほぐれましたよ。\n@c0@"
70:
  de: "@aOtto@bWas, glaubt Ihr, wird uns dort drinnen erwarten? Hier scheint es von furchtbaren Monstern nur so zu wimmeln.\n@c0@"
  en: "@aTuppence@bWhat do you suppose is waiting for us in\r\nhere? There seem to be ferocious monsters\r\nall over the place.\n@c0@"
  es: "@aAlazar@b¿Qué creéis que nos espera ahí dentro? Parece que hay monstruos terribles por todas partes.\n@c0@"
  fr: "@aInnocent@bQue croyez-vous que nous allons trouver\nlà-dedansⓡ Il y a quand même des monstres\nféroces partout, ici.\n@c0@"
  it: "@aSimon@bMaestà, cosa crede che accadrà adesso?\nCi sono mostri ferocissimi da ogni parte!\n@c0@"
  ja: "@a@bピピン「この奥には　いったい何が？\n\tもう　おそろしい魔物は\n\tこりごりですよ。\n@c0@"
71:
  de: "@a%0%a001240@bGanz schön unheimlich, durch dieses Loch zu gucken. %a001250 würde bestimmt anfangen, zu weinen...\n@c0@"
  en: "@a%0%a001240@bLooking through that hole is really scary! I bet %a001250 would cry if she had a look!\n@c0@"
  es: "@a%0%a001240@b¡Qué miedo da mirar por el agujero! ¡Apuesto que %a001250 se pondría a llorar si mirara!\n@c0@"
  fr: "@a%0%a001240@bÇa fait un peu peur de regarder dans ce trouⓠ\nÀ mon avis, %a001250 pleurerait si elle jetait un coup d'œilⓠ\n@c0@"
  it: "@a%0%a001240@bGuardare attraverso quel foro mette davvero paura! Se %a001250 desse un'occhiata, le verrebbe un colpo!\n@c0@"
  ja: "@a@b%a001240「あの穴　のぞくと　こわいよ！\n\t%a001250なら　泣いちゃうね。\n@c0@"
72:
  de: "@a%0%a001250@bSind wir hier immer noch nicht fertig? Ohhh!\n@c0@"
  en: "@a%0%a001250@bAren't we done here yet? Ohhh!\n@c0@"
  es: "@a%0%a001250@b¿No hemos terminado ya? ¡Oooh!\n@c0@"
  fr: "@a%0%a001250@bCe n'est pas encore finiⓡ Ooohⓠ\n@c0@"
  it: "@a%0%a001250@bNon abbiamo ancora finito qui?!\nNon ne posso più!\n@c0@"
  ja: "@a@b%a001250「まだ用事　おわらないの？\n\tぐすん……。\n@c0@"
73:
  de: "@aSancho@bDie Leitern und Seile hier sind gefährliss, Chico. Du musst diss gut konzentrieren, sonst fällst du noch! Also nicht an Paella denken!\n@c0@"
  en: "@aSancho@bThe ladders and the ropes, they are dangerous, amigo. Eef your mind wanders and you are theenking about paella, you weell fall!\n@c0@"
  es: "@aSancho@bLas escaleras y las cuerdas son bien peligrosas, chamaco. Si no te concentras y piensas en otra cosa, te espera una buena caída, nomás.\n@c0@"
  fr: "@aSancho@bLes échelles et les c-cordes sont d-dangereuses, amigo. Si tu ne fais pas attention et que tu p-penses à la paella, t-tu tombesⓠ\n@c0@"
  it: "@aSancho@b¡Las escalas y las funes sono muy pericolosas, chico!\n¡Me raccomando! ¡Fai la maxima attenziones!\n@c0@"
  ja: "@a@bサンチョ「ハシゴや　ロープをおりるときは\n\t気をつけてくださいね。\n\tうっかりしてると　落ちますよ！\n@c0@"
74:
  de: "@a%0%a001240@bDas ist also eine Drachenkugel.\n@c0@"
  en: "@a%0%a001240@bSo this is a dragon orb.\n@c0@"
  es: "@a%0%a001240@bEste es el orbe del dragón.\n@c0@"
  fr: "@a%0%a001240@bAlors c'est ça, l'orbe du Dragon.\n@c0@"
  it: "@a%0%a001240@bQuesto è il Cuore del Dragone...\n@c0@"
  ja: "@a@b%a001240「ふーん　これが\n\tドラゴンオーブかあ。\n@c0@"
75:
  de: "@a%0%a001240@bIch wette, die ganzen Monster von eben wären froh, sie zu haben.\n@c0@"
  en: "@a%0%a001240@bI bet the monsters we saw before would love to get their claws on it.\n@c0@"
  es: "@a%0%a001240@bSeguro que los monstruos que vimos antes querrían apoderarse de él.\n@c0@"
  fr: "@a%0%a001240@bJe parie que les monstres qu'on a combattus avant auraient aimé le trouver.\n@c0@"
  it: "@a%0%a001240@bScommetto che i mostri che abbiamo visto prima farebbero follie per impadronirsene...\n@c0@"
  ja: "@a@b%a001240「きっと　さっきの\n\t魔物たちは　このオーブを\n\t取られたくなかったんだね。\n@c0@"
76:
  de: "@a%0%a001240@bOb die Kräfte des Zenithdrachen wirklich in dieser Kugel sind? Das ist alles ein wenig seltsam...\n@c0@"
  en: "@a%0%a001240@bI wonder if the powers of the Zenith Dragon really are inside this orb. It's all a bit weird, really.\n@c0@"
  es: "@a%0%a001240@bMe pregunto si realmente contiene los poderes del Dragón de Zenithia. Es todo muy extraño.\n@c0@"
  fr: "@a%0%a001240@bJe me demande si les pouvoirs du Dragon du Zénith sont vraiment à l'intérieur de cet orbe. Ça me semble vraiment bizarre.\n@c0@"
  it: "@a%0%a001240@bI poteri del Drago di Zenithia si trovano all'interno di un semplice globo?!\nNon l'avrei mai detto...\n@c0@"
  ja: "@a@b%a001240「このオーブの中に\n\tドラゴンの能力が　入っているのかな？\n\tう～ん…　ふしぎだね。\n@c0@"
77:
  de: "@a%0%a001250@bWelch eine hübsche Kugel. Sie glänzt sogar noch mehr als die Goldkugel.\n@c0@"
  en: "@a%0%a001250@bWhat a pretty orb. It's glowing even more brightly than the gold orb.\n@c0@"
  es: "@a%0%a001250@b¡Qué bonito orbe! Es incluso más brillante que el orbe de oro.\n@c0@"
  fr: "@a%0%a001250@bQuel joli orbeⓠ Il brille encore plus que l'orbe d'or.\n@c0@"
  it: "@a%0%a001250@bChe bella, questa sfera...\nBrilla persino più del globo d'oro!\n@c0@"
  ja: "@a@b%a001250「きれいなオーブ……。\n\tゴールドオーブよりも\n\t強く　光ってるみたい。\n@c0@"
78:
  de: "@aSancho@bEndliss haben wir diese Aufgabe abgeschlossen. Aber einfach war es nisst, eh, Chico?\n@c0@"
  en: "@aSancho@bAt last, we have completed thees task.\r\nEet was no cinch, no?\n@c0@"
  es: "@aSancho@bPues ya completamos esta misión.\nNo fue pan comido, no.\n@c0@"
  fr: "@aSancho@bAu m-moins, nous avons rempli cette m-mission.\nC'était pas de la t-tarte, heinⓡ\n@c0@"
  it: "@aSancho@bNo es estato fácil, ma abbiamo completato esto compito...\n¡Ay, que bueno!\n@c0@"
  ja: "@a@bサンチョ「これで　ひとつ用事を\n\tすませられましたね。\n\tずいぶん　苦労しましたが……。\n@c0@"
79:
  de: "@aOtto@bÄhm, so was Wichtiges möchte ich lieber net tragen, hört Ihr? Ich könnt' mir nie verzeihen, wenn ich die Kugel fallen ließe und sie zerbrechen würd'!\n@c0@"
  en: "@aTuppence@bUm, don't have me carry anything too important,\r\nwill you? I'd never forgive myself if I dropped it and it broke!\n@c0@"
  es: "@aAlazar@bMmm, no me hagáis llevar algo tan importante, por favor. Si se me cayera y se rompiera no me lo perdonaría nunca.\n@c0@"
  fr: "@aInnocent@bHum... Ne me demandez pas de porter quoi que ce soit de précieux. Je ne me le pardonnerais jamais si je le laissais tomber et qu'il se cassaitⓠ\n@c0@"
  it: "@aSimon@bMaestà, non mi affidi il compito di portare oggetti importanti. Vede, a Denim ero conosciuto con il soprannome di ⓕSimon mani di pastafrollaⓖ...\n@c0@"
  ja: "@a@bピピン「あの　ボクには　大事なもの\n\t持たせないでください。\n\t落として　わったら　大変ですから！\n@c0@"
80:
  de: "@a%0%a001240@bIch hätte nie gedacht, dass es in der Statue solch einen großen Raum gibt.\n@c0@"
  en: "@a%0%a001240@bI would never have believed there was such a big room inside a statue like this!\n@c0@"
  es: "@a%0%a001240@b¡Nunca hubiera imaginado que dentro de una estatua hubiese una sala tan grande!\n@c0@"
  fr: "@a%0%a001240@bJe n'aurais jamais cru qu'il y aurait une salle aussi grande à l'intérieur d'une statue comme celle-làⓠ\n@c0@"
  it: "@a%0%a001240@bE chi se l'immaginava che nella statua ci fosse una stanza così grande?!\n@c0@"
  ja: "@a@b%a001240「あの像の中に\n\tこんなに　広い部屋があるなんて\n\tびっくりしちゃうよ。\n@c0@"
81:
  de: "@a%0%a001250@bDieser Drache ist so groß und majestätisch.\n@c0@"
  en: "@a%0%a001250@bThis dragon is so big and majestic.\n@c0@"
  es: "@a%0%a001250@bEste dragón es enorme y majestuoso.\n@c0@"
  fr: "@a%0%a001250@bCe dragon est si grand et si majestueux.\n@c0@"
  it: "@a%0%a001250@bQuesto drago è enorme!\n@c0@"
  ja: "@a@b%a001250「大きな　ドラゴンさん\n\tきれいね……。\n@c0@"
82:
  de: "@a%0%a001240@bWow! Was für ein schöner Stab!\n@c0@"
  en: "@a%0%a001240@bWow! What an amazing-looking staff!\n@c0@"
  es: "@a%0%a001240@b¡Vaya! ¡Qué báculo tan sorprendente!\n@c0@"
  fr: "@a%0%a001240@bWaouhⓠ Il est super impressionnant, ce bâtonⓠ\n@c0@"
  it: "@a%0%a001240@bAccidenti!\nQuesta mazza è bellissima!\n@c0@"
  ja: "@a@b%a001240「うわっ！\n\tなんだか　すごそうな杖だね！\n@c0@"
83:
  de: "@aSancho@bDiese Stab, er ist perfekt für diss, Chico. Er steht dir sehr gut.\n@c0@"
  en: "@aSancho@bThees estaff, ees perfect for you, My Majesty. Eet esuits you so well.\n@c0@"
  es: "@aSancho@bEs un báculo perfecto para usted, Majestad. Le queda estupendo.\n@c0@"
  fr: "@aSancho@bCe b-bâton, il est p-parfait pour toi, Ma Majesté.\r\nÇa te va comme oun gant.\n@c0@"
  it: "@aSancho@b¡Chico, esta mazza es perfecta por ti!\n@c0@"
  ja: "@a@bサンチョ「この杖は　ふしぎと\n\t%a000090王に　似合いますね。\n\tありがたく　もらっておきましょう。\n@c0@"
84:
  de: "@a%0%a001240@bSieh doch nur, wie hoch die Decke ist! Da sind wir aber einen weiten Weg hinunter gekommen!\n@c0@"
  en: "@a%0%a001240@bLook how high up the ceiling is! We did well climbing all the way down here!\n@c0@"
  es: "@a%0%a001240@b¡Qué alto está el techo! ¡Ha sido toda una hazaña bajar hasta aquí!\n@c0@"
  fr: "@a%0%a001240@bRegarde comme le plafond est hautⓠ On a du mérite d'être descendus jusqu'iciⓠ\n@c0@"
  it: "@a%0%a001240@bGuarda quant'è alto il soffitto!\nÈ stata una bella impresa riuscire a scendere fin qui, non trovi?\n@c0@"
  ja: "@a@b%a001240「わ～　天井が　高いよ！\n\tボクたち　よく　こんなところ\n\tおりてこられたよね。\n@c0@"
85:
  de: "@a%0%a001250@bDieser Turm besteht nur aus Leitern, Seilen und Treppen. Das ist so anstrengend!\n@c0@"
  en: "@a%0%a001250@bThis tower is just full of stairs and ladders and ropes. It's totally exhausting!\n@c0@"
  es: "@a%0%a001250@bEsta torre está repleta de escaleras, cuerdas y escalas. ¡Es agotador!\n@c0@"
  fr: "@a%0%a001250@bCette tour est pleine d'escaliers, d'échelles et de cordes. C'est épuisantⓠ\n@c0@"
  it: "@a%0%a001250@bQuesta torre è piena zeppa di scale e di funi!\nNon ne posso più!\n@c0@"
  ja: "@a@b%a001250「この塔って　階段も\n\tハシゴも　ロープも　大変なの。\n\tちょっと　つかれちゃった……。\n@c0@"
86:
  de: "@aSancho@bIss kann einfach nisst aufhören, an diese Monster zu denken... Sein Gesisst wird miss auf ewig verfolgen.\n@c0@"
  en: "@aSancho@bI, I cannot estop theenking about the monster...\nEets face ees gonna haunt me forever.\n@c0@"
  es: "@aSancho@bNi modo puedo evitar pensar en el monstruo...\nSu cara me va a perseguir siempre.\n@c0@"
  fr: "@aSancho@bJ-Je n'arrête pas de penser à ce m-monstre...\r\nSon v-visage va me hanter à t-tout jamais.\n@c0@"
  it: "@aSancho@bNo riesco a esmettere de pensare a quel mostro...\nMe recorderò de lui finché campo...\n@c0@"
  ja: "@a@bサンチョ「どうも　さっきから\n\tあの魔物のことばかり\n\t考えてしまいますよ……。\n@c0@"
87:
  de: "@aOtto@bBrrr... Na, ich hoffe ja, dass wir net noch mehr Monstern begegnen werden, die so stark sind.\n@c0@"
  en: "@aTuppence@bBrrr... Here's hoping we won't be running into any more monsters that strong.\n@c0@"
  es: "@aAlazar@bBrrr... Esperemos que no nos topemos con más monstruos de esa calaña.\n@c0@"
  fr: "@aInnocent@bBrrr... J'espère que nous n'aurons plus à affronter de monstres aussi forts.\n@c0@"
  it: "@aSimon@bSpero proprio che non ci aspettino altri mostri tanto forti...\n@c0@"
  ja: "@a@bピピン「もう　あんな　強い魔物が\n\t出ませんように！　ぶるぶる……。\n@c0@"
88:
  de: "@aBianca@bAh, verstehe. Du hast das alles schon einmal erkundet, ja? Wie schön. Dann können wir ja weiter.\n@c0@"
  en: "@aBianca@bOkay, I get it. You all explored this place. Very nice. Now can we move on?\n@c0@"
  es: "@aBianca@bYa lo pillo. Que habéis explorado el lugar. Pues muy bien. ¿Nos podemos ir ya o qué?\n@c0@"
  fr: "@aBianca@bOui, j'ai compris. Tu as passé cet endroit au peigne fin. C'est très bien. On peut peut-être continuer, maintenantⓡ\n@c0@"
  it: "@aBianca@bD'accordo. Ho capito.\nHai già esplorato questo posto.\nVuoi che ti dica ⓕbravoⓖ?\n㈡\nD'accordo: BRAVO.\nOra possiamo andare, sì?\n@c0@"
  ja: "@a@bビアンカ「%a000090たちが　この塔を\n\t冒険したのは　わかったから。\n\tさあ　先を　急ぎましょうよ。\n@c0@"
89:
  de: "@aNera@bWir haben nicht viel Zeit. Vielleicht kannst du mir den Ort ja mal zeigen, wenn alles wieder seinen gewohnten Gang geht, ja?\n@c0@"
  en: "@aNera@bWe don't have much time. Maybe you could show me around this place when everything's calmed down and got back to normal?\n@c0@"
  es: "@aNera@bNo tenemos demasiado tempo. Quizá, cuando tutto se haya calmado y vuelva a la normalità me podrías enseñar este lugar.\n@c0@"
  fr: "@aNera@bNous n'avons pas beaucoup de temps. Tu pourras peut-être me faire visiter cet endroit une fois la situation revenue à la normaleⓡ\n@c0@"
  it: "@aNera@bGuarda, non abbiamo molto tempo a disposizione...\nSe proprio ci tieni, mi mostrerai il posto quando avremo meno preoccupazioni per la testa... Va bene?\n@c0@"
  ja: "@a@bフローラ「あまり　時間がないですわよ。\n\tあなた　ここは　平和になってから\n\tゆっくり　見せていただきますわ。\n@c0@"
90:
  de: "@a%0%a001240@bHier gibt es nichts mehr für uns zu tun, nicht wahr, Papa? Dann komm!\n@c0@"
  en: "@a%0%a001240@bWe don't need to do anything here any more, right, Dad? Let's go!\n@c0@"
  es: "@a%0%a001240@bAquí ya no hay nada que hacer, ¿verdad papá? ¡Vamos!\n@c0@"
  fr: "@a%0%a001240@bOn n'a plus rien à faire ici, hein, papaⓡ\nAlors en routeⓠ\n@c0@"
  it: "@a%0%a001240@bPapà, non abbiamo altro da fare altro qui...\nChe ne diresti di andare?\n@c0@"
  ja: "@a@b%a001240「もう　この塔には\n\t用はないね　お父さん。\n\tさあ　帰ろう。\n@c0@"
91:
  de: "@a%0%a001250@bIch habe genug, Papa. Wenn wir hier fertig sind, möchte ich sofort weiter. Türme liegen mir nicht besonders, weißt du.\n@c0@"
  en: "@a%0%a001250@bI've had enough, Dad. When we've finished what we're doing, I want to go straight home. I'm not very good with towers.\n@c0@"
  es: "@a%0%a001250@bYa he tenido suficiente, papi. Cuando terminemos lo que tenemos que hacer, me quiero ir directa a casa. No me gustan mucho las torres.\n@c0@"
  fr: "@a%0%a001250@bJ'en ai marre, papa. Une fois qu'on aura fini ce\nqu'on est en train de faire, je veux rentrer à la maison. Je n'aime pas trop les tours.\n@c0@"
  it: "@a%0%a001250@bNon ne posso più di questa torre...\nSe non c'è altro da fare, perché non ce ne andiamo a casa?\n@c0@"
  ja: "@a@b%a001250「お父さん　もう　限界です。\n\t用事が　おわったら　早く帰りたいの。\n\t塔は　苦手なんだもん。\n@c0@"
92:
  de: "@aSancho@bIn diesem Turm haben wir nissts mehr verloren. Wir müssen weiterziehen.\n@c0@"
  en: "@aSancho@bWe have no more to do een thees tower.\nWe must move on.\n@c0@"
  es: "@aSancho@bPues ya acabamos con esta torre hace tiempo.\nÁndale, vámonos.\n@c0@"
  fr: "@aSancho@bOn n'a plus rien à f-faire dans cette t-tour.\r\nIl faut reprendre n-notre route.\n@c0@"
  it: "@aSancho@bChico, no abbiamo altros da fare aquí...\n¿Que ne diresti de andarcene?\n@c0@"
  ja: "@a@bサンチョ「この塔で　することは\n\tもう　のこっていないようですね。\n\t先を急ぎましょう。\n@c0@"
93:
  de: "@aGriselda@bDu weißt doch, dass ich alles Anstrengende verabscheue. Ich verstehe sowieso nicht, warum wir auf diesen Turm klettern müssen!\n@c0@"
  en: "@aDebora@bI find anything that takes too much effort really rather tedious. There's no point in climbing this tower just for the fun of it.\n@c0@"
  es: "@aStefania@bSi cuesta demasiado, me aburre. ¿Qué sentido tiene subir a esta torre solo per diversione?\n@c0@"
  fr: "@aPandora@bJe trouve que tout ce qui demande un trop gros effort est assez ennuyeux. Ça n'a aucun sens de grimper en haut de cette tour juste pour le plaisir.\n@c0@"
  it: "@aViola@bNon mi piace l'idea di salire fino in cima a una torre.\nÈ troppo faticoso per i miei gusti.\nCaro, mi porteresti in braccio?\n@c0@"
  ja: "@a@bデボラ「私　めんどうなことは　キライなの。\n\tこの塔にのぼる必要は　もう　ないのよね？\n\tだったら　早く　次へ行くわよ。\n@c0@"
94:
  de: "@aGriselda@bHier gibt es nichts mehr für uns zu tun, oder? Dann lass uns so schnell wie möglich verschwinden.\n@c0@"
  en: "@aDebora@bThere's nothing left for us to do here, right?\r\nSo let's hurry up and move on.\n@c0@"
  es: "@aStefania@bYa no hay niente que hacer aquí ¿no?\nAllora, andiamo, deprisa.\n@c0@"
  fr: "@aPandora@bNous n'avons plus rien à faire ici, je me trompeⓡ Alors dépêchons-nous de partir.\n@c0@"
  it: "@aViola@bNon mi pare che qui ci sia nulla di particolarmente importante da fare... Che ne diresti di dirigerci altrove, caro il mio %a000090?\n@c0@"
  ja: "@a@bデボラ「ここで　やるべきことは\n\tもう　残っていないんでしょう？\n\tだったら　早く　外へ出るわよ。\n@c0@"
