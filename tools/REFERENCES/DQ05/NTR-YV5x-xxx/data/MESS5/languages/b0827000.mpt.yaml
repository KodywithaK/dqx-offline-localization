  de: "@a@b*: Es kann immer nur eine Person zur gleichen Zeit an diesem Spiel teilnehmen. Passt gut auf Euch auf, ja?\n@c0@"
  en: "@a@b*: Only one person can take part in the game at a time. Be careful out there, won't you?\n@c0@"
  es: "@a@b*: Solo una persona puede participar en el juego. Tenga cuidado ahí fuera, ¿eh?\n@c0@"
  fr: "@a@b*ⓢ Dans ce jeu, il ne peut y avoir qu'un seul participant à la fois. Soyez prudent%A0110%X%Z%B0110%Xe%Z, d'accordⓡ\n@c0@"
  it: "@a@b*: Ti ricordo che può giocare una sola persona per volta.\r\nE mi raccomando... Fai attenzione!\n@c0@"
  ja: "@a@b＊「すごろくに　参加できるのは\n\tおひとりさま　だけです。\n\tどうか　お気をつけて……。\n@c0@"
