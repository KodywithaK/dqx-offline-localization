22:
  de: "@a@b*: Willkommen in der total tollen T&T-Fundgrube!\n@c0@"
  en: "@a@b*: Welcome to the terrific T 'n' T treasure trove!\n@c0@"
  es: "@a@b*: ¡%H0860%XLe%YLes%Z doy la bienvenida al fantástico Tesoro Escondido de T y T!\n@c0@"
  fr: "@a@b*ⓢ Bienvenue dans la terrible crypte au trésor du TNTⓠ\n@c0@"
  it: "@a@b*: %A0110%XBenvenuto%Z%B0110%XBenvenuta%Z alla Caccia al Tesoro della Tavola della Sorte!\n@c0@"
  ja: "@a@b＊「すごろく場じまんの　宝物庫へ\n\tようこそ。\n@c0@"
23:
  de: "@a@b*: Spannende Schatzsuche in fünf verschiedenen Räumen! Wählt einen Raum und versucht dann, alle Schätze innerhalb des Zeitlimits zu finden!\n@c0@"
  en: "@a@b*: Here we have tantalising treasures hidden in five different rooms. Choose a room, and try to find all the treasure within the time limit!\n@c0@"
  es: "@a@b*: Tenemos atractivos tesoros ocultos en cinco habitaciones distintas.\n㈡\n*: ¡Se trata de elegir una habitación e intentar encontrar los tesoros dentro del límite de tiempo!\n@c0@"
  fr: "@a@b*ⓢ De splendides trésors sont cachés dans\n5 pièces différentes.\n㈡\n*ⓢ Choisissez une pièce et essayez d'y trouver\ntous les trésors cachés dans le temps impartiⓠ\n@c0@"
  it: "@a@b*: Qui ci sono cinque stanze con dei meravigliosi tesori. Scegli una sala e trova il tesoro prima che scada il tempo a tua disposizione!\n@c0@"
  ja: "@a@b＊「５つの部屋に　宝がかくされています。\n\tどこに入るか決めたら　制限時間内に\n\t宝を　さがしだしてくださいね。\n@c0@"
24:
  de: "@a@b*: Zunächst habt Ihr zwei Würfe, um das Zeitlimit auszuwürfeln. Elf ist der niedrigste Wert, aber mit etwas Glück kann man sogar bis zu 66 rausholen!\n@c0@"
  en: "@a@b*: First you get two die rolls to decide your time limit. Eleven seconds is the lowest, but you could get as many as sixty-six if you're lucky!\n@c0@"
  es: "@a@b*: Primero se tira dos veces el dado para decidir el tiempo límite.\n㈡\n ¡Once segundos es el mínimo, pero con suerte se pueden conseguir hasta sesenta y seis!\n@c0@"
  fr: "@a@b*ⓢ Vous devez d'abord lancer deux fois le dé pour déterminer le temps imparti.\n㈡\n*ⓢ Vous disposerez au minimum de 11 secondes,\nmais avec un peu de chance, vous pourrez obtenir\nle maximum de 66 secondesⓠ\n@c0@"
  it: "@a@b*: Lancia il dado due volte per determinare il tuo limite di tempo, che può andare da un minimo di 11 a un massimo di 66 secondi.\n@c0@"
  ja: "@a@b＊「それでは　サイコロを　２回ふって\n\t１１～６６秒までの\n\t制限時間を　決めましょう！\n@c0@"
25:
  de: "@a@b*: Gut! Damit hättet Ihr ein Zeitlimit von %a001130 Sekunden. Die Zeit läuft, sobald Ihr eine der Türen da oben aufmacht. Viel Glück!\n@c0@"
  en: "@a@b*: Okay! That gives you a time limit of %a001130 seconds. Your time starts when you open one of the doors above. Good luck!\n@c0@"
  es: "@a@b*: ¡Muy bien! El tiempo límite es de %a001130 segundos. El tiempo empieza a contar al abrir una de las puertas de arriba. ¡Buena suerte!\n@c0@"
  fr: "@a@b*ⓢ Bienⓠ Vous disposez donc de %a001130 secondes.\nLe décompte commencera dès que vous ouvrirez\nl'une des portes d'en haut. Bonne chanceⓠ\n@c0@"
  it: "@a@b*: Perfetto! Il tuo limite di tempo è di %a001130 secondi. Il conto alla rovescia partirà dal momento in cui aprirai una delle porte in alto. Buona fortuna!\n@c0@"
  ja: "@a@b＊「制限時間は　%a001130秒です。\n\t上のトビラを開けると　はじまります。\n\tがんばって　くださいね。\n@c0@"
26:
  de: "@a@bDie Zeit ist noch nicht abgelaufen.\nDie Schatzsuche dennoch abbrechen?\n@c0@"
  en: "@a@bThere's still some time left.\nFinish hunting for treasure anyway?\n@c0@"
  es: "@a@bAún queda un poco de tiempo. ¿Interrumpir la busca del tesoro?\n@c0@"
  fr: "@a@bIl reste encore un peu de temps.\nArrêter quand même la chasse au trésorⓡ\n@c0@"
  it: "@a@bHai ancora del tempo a tua disposizione.\nVuoi davvero abbandonare la Caccia al Tesoro?\n@c0@"
  ja: "@a@b時間は　まだ　残っています。\n宝さがしを　やめますか？\n@c0@"
27:
  de: "@a@bDie Zeit ist abgelaufen! Na, habt Ihr viele schöne Schätze gefunden? Das will ich doch hoffen! Und beehrt uns bald wieder.\n@c0@"
  en: "@a@bTime's up! Did you manage to find lots of lovely treasure? I hope so! And hopefully we'll see you back here again soon too.\n@c0@"
  es: "@a@b¡Se ha acabado el tiempo! ¿Ha podido encontrar muchos preciados tesoros? ¡Eso espero! Y también espero volver a ver%A0110%Xlo%Z%B0110%Xla%Z pronto por aquí.\n@c0@"
  fr: "@a@bTemps écouléⓠ Avez-vous réussi à trouver plein de beaux trésorsⓡ Je vous le souhaiteⓠ Et j'espère que nous aurons le plaisir de vous revoir bientôt.\n@c0@"
  it: "@a@bTempo scaduto!\r\nSpero che la Caccia al Tesoro ti sia piaciuta, e mi auguro di rivederti prestissimo!\n@c0@"
  ja: "@a@bタイムオーバー！\n宝物は　見つけられましたか？\nまたのご来場を　お待ちしてます。\n@c0@"
