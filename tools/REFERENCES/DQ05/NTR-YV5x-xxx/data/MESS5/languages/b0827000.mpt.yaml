  de: "@a@b*: Hallo! Das hier ist die Fundgrube.\n@c0@"
  en: "@a@b*: Wotcha. This 'ere is the treasure trove.\n@c0@"
  es: "@a@b*: ¡Eh! Esto es Tesoro escondido.\n@c0@"
  fr: "@a@b*ⓢ Salut. Ici, c'est la crypte au trésor.\n@c0@"
