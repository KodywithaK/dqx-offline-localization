  ja: "@a@b＊「すごろく場じまんの　宝物庫へ\n\tようこそ。\n@c0@"
29:
  de: "@a@b*: Es gibt vier Räume, mit Schätzen drin. Ihr müsst Euch einen Raum aussuchen, dann geht Ihr rein und holt den Schatz raus, bevor die Zeit um ist.\n@c0@"
  en: "@a@b*: There's four rooms, right, wiv treasure in. You've gotta pick one of 'em, then get in there an' get the treasure before yer time runs out.\n@c0@"
  es: "@a@b*: Hay cuatro habitaciones hasta arriba de tesoros.\n㈡\n*: Hay que elegir una, entrar y conseguir todo el botín que se pueda.\n@c0@"
  fr: "@a@b*ⓢ Bon, il y a quatre pièces avec des trésors dedans.\n㈡\n*ⓢ Vous d'vez choisir une des pièces, entrer\ndedans et récupérer les trésors avant la fin du temps imparti.\n@c0@"
  it: "@a@b*: Ce stanno quattro stanze che dentro ce sta er tesoro. Devi da sceglie' 'na stanza e prenne' er tesoro prima che scada er tempo a tua disposizione.\n@c0@"
  ja: "@a@b＊「４つの部屋に　宝がかくされています。\n\tどこに入るか決めたら　制限時間内に\n\t宝を　さがしだしてくださいね。\n@c0@"
30:
  de: "@a@b*: Ihr dürft zweimal würfeln, um das Zeitlimit zu bestimmen. Nur Einsen ist das niedrigste Limit, nur Sechsen das höchste, klar?\n@c0@"
  en: "@a@b*: So, ya get two rolls on the die to decide wot yer time limit's gonna be. All the ones is the lowest, all the sixes the 'ighest, right?\n@c0@"
  es: "@a@b*: Se tira dos veces el dado para decidir el límite de tiempo. Dos unitos es lo peor y dos seises lo mejor. \n@c0@"
  fr: "@a@b*ⓢ Vous avez deux lancers de dé pour déterminer la limite de temps. Que des uns, c'est le minimum, que des six, le maximum, comprisⓡ\n@c0@"
  it: "@a@b*: Devi da lancia' er dado du' vorte per stabbili' er tuo limite de tempo. Si te escono gli ⓕ1ⓖ, er limite è basso, si te escono i ⓕ6ⓖ è arto.\n@c0@"
  ja: "@a@b＊「それでは　サイコロを　２回ふって\n\t１１～６６秒までの\n\t制限時間を　決めましょう！\n@c0@"
31:
  de: "@a@b*: Also dann! Ihr habt %a001130 Sekunden. Die Uhr tickt, sobald Ihr durch eine der Türen da geht. Auf geht's!\n@c0@"
