  es: "@a@b*: T y T es solo un juego, pero eso no quiere decir que se pueda bajar la guardia.\n@c0@"
  fr: "@a@b*ⓢ Le TNT n'est certes qu'un jeu, mais il ne faut pas baisser sa garde pour autant.\n@c0@"
  it: "@a@b*: La Tavola della Sorte è solo un gioco, ma questo non vuol dire che la si possa affrontare a cuor leggero!\n@c0@"
  ja: "@a@b＊「たとえ　すごろくといえども\n\tゆだんは禁物です。\n@c0@"
