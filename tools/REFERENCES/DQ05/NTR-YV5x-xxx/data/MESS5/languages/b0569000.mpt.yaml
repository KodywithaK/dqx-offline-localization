0:
  de: "@aBianca@bWelch ein seltsamer Ort! Ist das... die Unterwelt?\n@c0@"
  en: "@aBianca@bWhat a weird place!\r\nIs this...the underworld?\n@c0@"
  es: "@aBianca@b¡Vaya sitio más raro!\n¿Esto es... el inframundo?\n@c0@"
  fr: "@aBianca@bQuel endroit bizarreⓠ\nCe sont... les Enfersⓡ\n@c0@"
  it: "@aBianca@bChe strano questo posto...\nMa siamo davvero nel Regno degli Inferi...?\n@c0@"
  ja: "@a@bビアンカ「なんてところなの？\n\tここが…　魔界………。\n@c0@"
1:
  de: "@aNera@bDas ist also Nadiria. Ich hatte keine Ahnung, dass es hier so wild aussieht.\n@c0@"
  en: "@aNera@bSo this is Nadiria. I had no idea it was such a\r\nwild-looking place.\n@c0@"
  es: "@aNera@bO sea, que, veramente, esto es Nadiria. No me imaginaba que tuviera un aspecto tan abandonado.\n@c0@"
  fr: "@aNera@bNous voilà donc à Nadiria. Je ne pensais pas que c'était aussi sauvage.\n@c0@"
  it: "@aNera@bQuesta è Nadiria, non è vero?\nÈ un luogo dall'atmosfera selvaggia, ma è molto affascinante...\n@c0@"
  ja: "@a@bフローラ「ここが　魔界なのね。\n\tこんなに　あれはてた\n\t場所だなんて……。\n@c0@"
2:
  de: "@a%0%a001240@bWelch ein einsamer Ort. Vollkommen anders als unsere Welt, nicht wahr?\n@c0@"
  en: "@a%0%a001240@bWhat a lonely looking place. It's totally different to our world, don't you think?\n@c0@"
  es: "@a%0%a001240@bQué lugar más solitario. Es completamente distinto de nuestro mundo, ¿no crees?\n@c0@"
  fr: "@a%0%a001240@bCet endroit est bien vide. C'est vraiment différent de notre monde, tu ne trouves pasⓡ\n@c0@"
  it: "@a%0%a001240@bQuesto posto è totalmente diverso dal nostro mondo!\nPapà, ti aspettavi che fosse così?\n@c0@"
  ja: "@a@b%a001240「なんだか　さびしいところだね。\n\tボクたちの世界とは　大ちがいだ……。\n@c0@"
3:
  de: "@a%0%a001250@bSieh nur, Papa. Die Karte hat sich geändert.\n@c0@"
  en: "@a%0%a001250@bLook, Dad. The map's changed.\n@c0@"
  es: "@a%0%a001250@bMira, papi. El mapa ha cambiado.\n@c0@"
  fr: "@a%0%a001250@bPapa, regardeⓠ La carte a changé.\n@c0@"
  it: "@a%0%a001250@bPapà, guarda!\nLa mappa è cambiata!\n@c0@"
  ja: "@a@b%a001250「お父さん　見て。\n\t地図の絵が　変わってるの……。\n@c0@"
4:
  de: "@aSancho@bDas ist also Nadiria. Der Ort, den Señor Ludwig immer finden wollte...\n@c0@"
  en: "@aSancho@bEso thees ees Nadiria. Thees ees the place señor\r\nPankraz ees always wanting to find.\n@c0@"
  es: "@aSancho@bEsto es Nadiria, nomás. Este es el lugar que el señor Teudis estuvo siempre buscando.\n@c0@"
  fr: "@aSancho@bAlors v-voilà Nadiria. L'endroit que le señor\r\nP-Petros voulait désespérément t-trouver.\n@c0@"
  it: "@aSancho@bEsta es Nadiria, el luego que el señor Russel ha cercato por tantos años.\n㈡\nSi pienso que soy finalmentes arrivato aquí, yo... Yo me commuovos... ¡Sob!\n@c0@"
  ja: "@a@bサンチョ「パパスさまが　ずっと\n\tめざしていらっしゃった場所…\n\tここが…　魔界ですか……。\n@c0@"
5:
  de: "@aOtto@bDies ist also N-Nadiria...! Bei der Göttin, bin ich nervös. Ich weiß net, ob ich das alles durchstehen werd'...\n@c0@"
  en: "@aTuppence@bSo this is N-N-Nadiria...! Dear me, it's set me right on edge, I can tell you. I'm not sure if I'm up to this.\n@c0@"
  es: "@aAlazar@b¡Así que esto es N-N-Nadiria...! Ay, esto es demasiado para mí. No sé si estoy preparado.\n@c0@"
  fr: "@aInnocent@bAlors nous voilà à N-N-Nadiria...ⓠ Par la Déesse, ça me rend extrêmement nerveux. Je ne suis pas sûr d'être à la hauteur...\n@c0@"
  it: "@aSimon@bSanti numi, sono a Nadiria!\nDea mia santa e benedetta, proteggimi tu!\n@c0@"
  ja: "@a@bピピン「こ…ここが　魔界かっ！\n\tくーっ　きんちょうするなあっ！\n\t大丈夫かなあ…　ボク。\n@c0@"
6:
  de: "@aBianca@bEs kann jetzt nicht mehr lange dauern, bis wir deine Mutter gefunden haben.\n@c0@"
  en: "@aBianca@bIt can't be far now before we reach your mum.\n@c0@"
  es: "@aBianca@bYa no puede faltar mucho para encontrar a tu madre, ¿sabes?\n@c0@"
  fr: "@aBianca@bTa maman ne doit plus être très loin.\n@c0@"
  it: "@aBianca@bAmore mio, tra poco potrai finalmente riabbracciare tua madre.\n@c0@"
  ja: "@a@bビアンカ「お母さまの　いる所まで\n\tきっと　あとすこしね……。\n@c0@"
7:
  de: "@aBianca@bIch hab ja immer vermutet, dass es nicht der schönste Ort auf der Welt ist, aber so schlimm hätte ich's mir nicht vorgestellt...\n@c0@"
  en: "@aBianca@bI always expected it to be a nasty kind of place, but I didn't imagine it would be this bad.\n@c0@"
  es: "@aBianca@bMe esperaba que fuera un sitio desagradable, pero no imaginaba que lo sería tanto, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe me suis toujours dit que ça devait être un endroit horrible, mais pas à ce point-là.\n@c0@"
  it: "@aBianca@bSospettavo che questo posto fosse orribile, ma è di gran lunga peggiore di come l'avevo immaginato!\n@c0@"
  ja: "@a@bビアンカ「ひどい所だろうとは\n\t思ってたけど　まさか\n\tこれほどとはね……。\n@c0@"
8:
  de: "@aBianca@bSieht nicht so aus, als würde hier jemals die Sonne scheinen.\n@c0@"
  en: "@aBianca@bIt dun't look like this place ever gets much sun.\n@c0@"
  es: "@aBianca@bNo parece que aquí dé mucho el sol.\n@c0@"
  fr: "@aBianca@bJe n'ai pas l'impression que le soleil brille souvent\r\npar ici.\n@c0@"
  it: "@aBianca@bCredo che Nadiria non sia mai illuminata dai raggi del sole...\n@c0@"
  ja: "@a@bビアンカ「ここには　お日さまも\n\tほとんど　届かないみたいね……。\n@c0@"
9:
  de: "@aBianca@bOb es wohl auch unserer Welt so ergeht, wenn wir Großmeister Nimzo nicht besiegen können?\n@c0@"
  en: "@aBianca@bI wonder if this is what would happen to our world too, if Grandmaster Nimzo took over.\n@c0@"
  es: "@aBianca@b¿Será esto lo que pase también con nuestro mundo si cae en manos del Gran Maestro Nimzo?\n@c0@"
  fr: "@aBianca@bJe me demande si notre monde subirait le même sort\r\nsi le Grand Maître Nimzo prenait le pouvoir.\n@c0@"
  it: "@aBianca@bForse nemmeno il nostro mondo vedrebbe più la luce del giorno, se il Gran Maestro Nimzo riuscisse a conquistarlo...\n@c0@"
  ja: "@a@bビアンカ「もし　大魔王が来たら\n\t私たちの世界も\n\tこうなってしまうのかしら……。\n@c0@"
10:
  de: "@aNera@bWir müssen weiter. Deine Mutter kann nicht mehr weit sein.\n@c0@"
  en: "@aNera@bWe must push on. It can't be long now until we find your mother.\n@c0@"
  es: "@aNera@bDebemos seguir. No puede quedar mucho para encontrar a la tua mamma.\n@c0@"
  fr: "@aNera@bIl faut continuer. Nous ne devons plus être très loin de ta mère.\n@c0@"
  it: "@aNera@bForza, proseguiamo!\nSono convinta che tra poco troveremo tua madre!\n@c0@"
  ja: "@a@bフローラ「がんばりましょう。\n\tきっと　お母さまの所まで\n\tあと　すこしですわ……。\n@c0@"
11:
  de: "@aNera@bEs ist kaum vorstellbar, dass deine Mutter über zwanzig Jahre an diesem trostlosen, einsamen Ort verbracht hat.\n@c0@"
  en: "@aNera@bIt's hard to imagine that your mother's spent more than twenty years in such a desolate, lonely place.\n@c0@"
  es: "@aNera@bMe cuesta imaginar que la tua mamma haya pasado más de veinte años en un lugar tan desolado y solitario.\n@c0@"
  fr: "@aNera@bJ'ai du mal à réaliser que ta mère a passé plus de vingt ans dans un endroit si triste et si désolé.\n@c0@"
  it: "@aNera@bNon so come abbia fatto Mada a resistere più di vent'anni in un luogo così desolato... Tua madre deve avere una forza di volontà incredibile.\n@c0@"
  ja: "@a@bフローラ「こんな　さみしい世界で\n\tお母さま　もう　２０年以上も……。\n@c0@"
12:
  de: "@aNera@bIch kann überhaupt nichts Lebendiges hier spüren. Von den Monstern einmal abgesehen, natürlich...\n@c0@"
  en: "@aNera@bI don't sense anything living around here.\r\nApart from monsters, that is.\n@c0@"
  es: "@aNera@bNo siento ninguna presencia de vita por aquí.\nSalvo los mostri, claro.\n@c0@"
  fr: "@aNera@bIl n'y a aucun signe de vie aux alentours.\r\nHormis les monstres, bien sûr.\n@c0@"
  it: "@aNera@bFinora non abbiamo incontrato nessuna forma di vita...\nFatta eccezione per i mostri, ovviamente.\n@c0@"
  ja: "@a@bフローラ「生きているものの気配が\n\tまったくしませんわね。\n\t……魔物の　ほかには。\n@c0@"
13:
  de: "@a%0%a001240@bWir haben schon eine Menge durchgestanden, also werden wir mit diesem Ort hier sicher auch fertig!\n@c0@"
  en: "@a%0%a001240@bWe've had our tough times up to now, so this place isn't anything we can't handle!\n@c0@"
  es: "@a%0%a001240@b¡Hemos pasado antes por momentos difíciles, así que podremos con este sitio!\n@c0@"
  fr: "@a%0%a001240@bOn en a vu des vertes et des pas mûres jusqu'à maintenant et on s'en est toujours sortis. Je ne\nvois pas pourquoi ce serait différent iciⓠ\n@c0@"
  it: "@a%0%a001240@bPapà, finora ne abbiamo passate di tutti i colori, quindi non credo che qui avremo troppi problemi!\nChe dici? Forse sono troppo ottimista...?\n@c0@"
  ja: "@a@b%a001240「今までだって\n\tたいへんな想い　してきたんだもん。\n\tこんな所　へっちゃらだよ！\n@c0@"
14:
  de: "@a%0%a001240@bHalte durch, Großmutter! Wir kommen dich retten!\n@c0@"
  en: "@a%0%a001240@bHang on in there, Grandma! We're coming to rescue you soon!\n@c0@"
  es: "@a%0%a001240@b¡Espera un poco, abuela! ¡En seguida vamos a rescatarte!\n@c0@"
  fr: "@a%0%a001240@bTiens bon, grand-mèreⓠ\nNous allons bientôt te sauverⓠ\n@c0@"
  it: "@a%0%a001240@bNonna, resisti!\nStiamo arrivando!\n@c0@"
  ja: "@a@b%a001240「おばあちゃん　待っててね！\n\tもうすぐ　ボクたちが\n\t助けに行きますっ！！\n@c0@"
15:
  de: "@a%0%a001240@bWas, glaubst du, befindet sich unter uns?\n@c0@"
  en: "@a%0%a001240@bWhat do you think it's like down below?\n@c0@"
  es: "@a%0%a001240@b¿Cómo crees que será lo de ahí abajo?\n@c0@"
  fr: "@a%0%a001240@bTu crois que c'est comment, là-dessousⓡ\n@c0@"
  it: "@a%0%a001240@bCosa credi che ci sia laggiù?\n@c0@"
  ja: "@a@b%a001240「この　下のほうは\n\tいったい　どうなってるの？\n@c0@"
16:
  de: "@a%0%a001240@bMan kann ja gar nichts sehen! Dieser unheimliche Nebel ist einfach überall.\n@c0@"
  en: "@a%0%a001240@bIt's impossible to see, what with that creepy mist all over the place.\n@c0@"
  es: "@a%0%a001240@bEs imposible ver nada, y más con esta niebla extraña por todos lados.\n@c0@"
  fr: "@a%0%a001240@bOn ne voit strictement rien avec cette brume sinistre qui recouvre tout.\n@c0@"
  it: "@a%0%a001240@bCon tutta questa maledettissima foschia, non si vede un accidenti!\n@c0@"
  ja: "@a@b%a001240「気持ち悪い　もやがかかって\n\tよく見えないや……。\n@c0@"
17:
  de: "@a%0%a001250@bOh... Mein Kopf tut weh.\nEs ist, als würde etwas ganz Böses aus den unterirdischen Tiefen heraufströmen...\n@c0@"
  en: "@a%0%a001250@bUrh... My head hurts. There's a really sinister air coming up from deep down underground.\n@c0@"
  es: "@a%0%a001250@bUf... Me duele la cabeza. Llega un aire realmente siniestro desde las profundidades subterráneas.\n@c0@"
  fr: "@a%0%a001250@bOh... J'ai mal au crâne. Il y a un air vraiment sinistre qui émane des profondeurs.\n@c0@"
  it: "@a%0%a001250@bMi è venuto un gran mal di testa...\nL'aria pesante che proviene dal basso ha reso l'atmosfera quasi irrespirabile...\n@c0@"
  ja: "@a@b%a001250「ううっ…　あたま　いたい……。\n\t地面の　ずっと下のほうから\n\tすごく　いやな感じする……。\n@c0@"
18:
  de: "@a%0%a001250@bSchon in Ordnung. Ich werde natürlich weiterkämpfen. Für Großmutter.\n@c0@"
  en: "@a%0%a001250@bIt's okay. I'll keep battling on.\nIt's for Grandma's sake, after all.\n@c0@"
  es: "@a%0%a001250@b¡Está bien! Seguiré luchando.\nEs por la abuela, al fin y al cabo.\n@c0@"
  fr: "@a%0%a001250@bÇa va. Je vais continuer à me battre.\nC'est pour sauver grand-mère après tout.\n@c0@"
  it: "@a%0%a001250@bSto bene, papà, non preoccuparti.\nPosso continuare a combattere.\nDevo farlo, se voglio salvare la nonna...\n@c0@"
  ja: "@a@b%a001250「だいじょうぶ……\n\tわたし　がんばります。\n\tおばあちゃんを　助けたいから……。\n@c0@"
19:
  de: "@aSancho@bQué? Hast du Angst, Chico?\n@c0@"
  en: "@aSancho@bQué? You no escared, are you?\n@c0@"
  es: "@aSancho@b¿Qué? ¿Tienes miedo, chamaco?\n@c0@"
  fr: "@aSancho@bQuéⓡ T-Tu as peurⓡ\n@c0@"
  it: "@aSancho@b¿Chico, no avrai mica paura, eh?\n@c0@"
  ja: "@a@bサンチョ「どうしました？\n\tまさか　ここまで来て\n\t怖じ気づきましたか？\n@c0@"
20:
  de: "@aSancho@bNo, no, no. Es gibt keine Grund, Angst zu haben. Du hast so viele Amigos in deine Gruppe.\n@c0@"
  en: "@aSancho@bNo, no, no. Ees no need to be escared.\nYou have eso many amigos een your party now.\n@c0@"
  es: "@aSancho@bNo, no, no. No hay por qué tener miedo,\nAhorita tienes muchos cuates en tu grupo.\n@c0@"
  fr: "@aSancho@bNo, no, no. Il ne f-faut pas avoir peur. T-Tu as plein d'amigos dans ton équipe, maintenant.\n@c0@"
  it: "@aSancho@bNo devi temere nada.\nSei fuerte, y no sei solo.\n¡Animo, chico! ¡Ce la faremo!\n@c0@"
  ja: "@a@bサンチョ「ははは。　心配いりませんよ。\n\t%a000090王には　たくさんの\n\tお仲間が　いるじゃないですか。\n@c0@"
21:
  de: "@aSancho@bUnd all die Amigos, die jetzt nisst bei uns sind, feuern uns aus die Wagen heraus an!\n@c0@"
  en: "@aSancho@bAnd all of the amigos who no weeth us right now, they cheer for us from the wagon.\n@c0@"
  es: "@aSancho@bY todos los cuates que no están acá con nosotros, nos animan desde el carromato.\n@c0@"
  fr: "@aSancho@bEt t-tous les amigos qui ne sont p-pas avec nous,\r\nils nous s-soutiennent depuis le chariot.\n@c0@"
  it: "@aSancho@bTodos los nuestros amigos, toda la gente buena que abbiamo encontratos nel nuestro viaggio...\nTodo el mundo fa el tifo por nosotros.\n㈡\n¿Non vorrai mica deluderlos, chico?\n@c0@"
  ja: "@a@bサンチョ「今　ここにはいない仲間たちも\n\tみんな　%a000090王のこと\n\tおうえんしてますからね。\n@c0@"
22:
  de: "@aSancho@bPerdón. Deine Onkel Sancho stellt schon dumme Fragen, eh? Du hast wirkliss vor nissts Angst, no?\n@c0@"
  en: "@aSancho@bPerdón. I esorry. Your Uncle Sancho, he ask esometheeng estupid. Ees notheeng to make you escared now, sí?\n@c0@"
  es: "@aSancho@bPerdón. Excúsame. Tu tito Sancho pregunta menzadas. No hay nada de que tener miedo, ¿verdad?\n@c0@"
  fr: "@aSancho@bPerdón. Je suis d-désolé. Ton tonton Sancho, il\np-pose des questions stupides. Il n'y a rien qui\nte fait p-peur, pas vraiⓡ\n@c0@"
  it: "@aSancho@bNo, chico. Tu no hai paura.\nTe lo leggo ne los ojos.\nScusame si te ho fatto una domanda così estupida...\n@c0@"
  ja: "@a@bサンチョ「むはっ！　これは\n\tバカなことを　ききましたね！\n\t今さら　%a000090王に　こわい物など！\n@c0@"
23:
  de: "@aSancho@bSeñora Magda, sie ist solch eine gute und warmherzige Señora.\n@c0@"
  en: "@aSancho@bSeñora Mada, eshe ees esuch a kind and\r\ngentle señora.\n@c0@"
  es: "@aSancho@bLa señora Perséfone es bien amable y gentil.\n@c0@"
  fr: "@aSancho@bLa señora Magdalena, c'est oune señora si g-gentille et si douce.\n@c0@"
  it: "@aSancho@bLa señora Mada es una donna muy gentil y generosa.\n@c0@"
  ja: "@a@bサンチョ「マーサさまは\n\tそれはそれは　おやさしい方でした。\n@c0@"
24:
  de: "@aSancho@bIss bin mir sisser, dass auch die Monster ihr gutes Herz spüren, glaubst du nisst?\n@c0@"
  en: "@aSancho@bI esure the monsters, they understand her\r\nkind and gentle heart too, no?\n@c0@"
  es: "@aSancho@bDe seguro que los monstruos pues también saben de su corazón amable y gentil.\n@c0@"
  fr: "@aSancho@bJe suis sûr que les m-m-monstres, ils p-perçoivent ça aussi, noⓡ\n@c0@"
  it: "@aSancho@bSoy seguro que anche los mostros hanno imparato a conoscere y apprezzar el suo espirito candido y puro...\n@c0@"
  ja: "@a@bサンチョ「きっと　魔物たちも\n\tマーサさまの　やさしさが\n\tわかったんでしょうねえ……。\n@c0@"
25:
  de: "@aOtto@bMutter hat immer sehr warmherzig von Königin Magdalena gesprochen.\n@c0@"
  en: "@aTuppence@bMother often spoke fondly of Queen Madalena.\n@c0@"
  es: "@aAlazar@bMadre solía hablar bien de la reina Perséfone.\n@c0@"
  fr: "@aInnocent@bMa mère a toujours beaucoup aimé la reine Magdalena.\n@c0@"
  it: "@aSimon@bMia madre mi ha sempre parlato bene della regina Mada.\n@c0@"
  ja: "@a@bピピン「太后さまのことは\n\tよく　母から聞かされてますよ。\n@c0@"
26:
  de: "@aOtto@bSie sagte, es habe nie eine schönere und gütigere Königin gegeben. Ich kann es kaum abwarten, ihre Bekanntschaft zu machen...\n@c0@"
  en: "@aTuppence@bShe said she'd never known a woman more\r\nbeautiful or kind. I'm rather looking forward to making her acquaintance.\n@c0@"
  es: "@aAlazar@bDecía que nunca había conocido a una mujer más hermosa o más afable. Estoy deseando conocerla.\n@c0@"
  fr: "@aInnocent@bElle disait qu'elle n'avait jamais rencontré de femme plus belle ni plus douce. J'ai vraiment hâte de faire sa connaissance.\n@c0@"
  it: "@aSimon@bMi ha detto di non aver mai incontrato una persona dall'animo tanto nobile.\nSarò onorato di fare la sua conoscenza.\n@c0@"
  ja: "@a@bピピン「あんなに　美しく\n\tすばらしい方はいない……と。\n\tお会いするのが　楽しみです。\n@c0@"
27:
  de: "@aOtto@bBrr... Ist das kalt. Hier ist es fast so wie im Land des Todes, von dem ich mal in einem Buch gelesen habe...\n@c0@"
  en: "@aTuppence@bBrr... It's rather chilly here. This place feels just like the Land of Death I once read about in a book.\n@c0@"
  es: "@aAlazar@bBrrr... Hace un poco de frío aquí. Este lugar es como la Tierra de los Muertos sobre la que leí en un libro.\n@c0@"
  fr: "@aInnocent@bBrrr... Il fait plutôt froid, ici. Cet endroit me fait penser au Royaume des morts dont il était question dans un livre que j'ai lu autrefois.\n@c0@"
  it: "@aSimon@bBrrrrr! Accidenti, che freddo!\nMaestà, di questo passo finirò congelato! Sempre che qualche mostro non mi faccia fuori prima...\n@c0@"
  ja: "@a@bピピン「ぶるぶる…　ううっ　寒い。\n\tここは　いつか　本で読んだ\n\t死の世界に　そっくりですよ。\n@c0@"
28:
  de: "@aBianca@bIch hoffe, deiner Mutter geht es gut. Wir haben keine Zeit zu verlieren, %a000090!\n@c0@"
  en: "@aBianca@bI hope your mum's okay. There's no time to lose, %a000090!\n@c0@"
  es: "@aBianca@bEspero que tu madre esté bien. ¡No hay tiempo que perder, %a000090!\n@c0@"
  fr: "@aBianca@bJ'espère que ta maman va bien. Il n'y a pas de temps à perdre, %a000090ⓠ\n@c0@"
  it: "@aBianca@bTua madre è in pericolo, %a000090!\nNon possiamo perderci d'animo proprio adesso! Coraggio!\n@c0@"
  ja: "@a@bビアンカ「お母さま　大丈夫かしら……。\n\tねえ　%a000090\n\tもっと　急ぎましょ！\n@c0@"
29:
  de: "@aNera@bIch mache mir Sorgen um deine Mutter. Wir müssen uns beeilen!\n@c0@"
  en: "@aNera@bI'm rather concerned about your mother's well-being. We must hurry.\n@c0@"
  es: "@aNera@bMe preocupa cómo pueda estar la tua mamma. Debemos darnos prisa.\n@c0@"
  fr: "@aNera@bJe m'inquiète pour ta mère. Il faut qu'on se dépêche.\n@c0@"
  it: "@aNera@bSono preoccupata per tua madre, %a000090...\nDobbiamo far presto!\n@c0@"
  ja: "@a@bフローラ「お母さまが　心配だわ。\n\tあなた　急がないと……。\n@c0@"
30:
  de: "@a%0%a001240@bWir müssen diesem Slon heimzahlen, was er Großvater angetan hat. Das nächste Mal hat er keine Chance!\n@c0@"
  en: "@a%0%a001240@bWe need to pay that nasty Ladja back for what he did to Grandpa too, so we can't let him win next time!\n@c0@"
  es: "@a%0%a001240@bTenemos que hacer pagar a ese odioso Ladja lo que le hizo al abuelo, así que no puede derrotarnos la próxima vez.\n@c0@"
  fr: "@a%0%a001240@bCe maudit Erebos doit payer pour ce qu'il a fait\nà grand-père. Il ne faudra pas le laisser s'en tirer, la prochaine foisⓠ\n@c0@"
  it: "@a%0%a001240@bDobbiamo battere Skriterioska!\nLa pagherà anche per la morte di nonno Russel!\n@c0@"
  ja: "@a@b%a001240「ゲマって　おじいちゃんの\n\tカタキでもあるんだよね。\n\t次は　絶対　負けない！\n@c0@"
31:
  de: "@a%0%a001250@bSlon... Erst tötet er Großvater und jetzt bedroht er Großmutter. Damit darf er nicht durchkommen!\n@c0@"
  en: "@a%0%a001250@bLadja... First he kills Grandpa and now he's threatening Grandma too. We can't let him\nget away with this!\n@c0@"
  es: "@a%0%a001250@bLadja... Primero mata al abuelo y luego amenaza también a la abuela. ¡No podemos permitir que se salga con la suya!\n@c0@"
  fr: "@a%0%a001250@bErebos... D'abord, il tue grand-père et maintenant, il menace grand-mère. Il ne faut pas le laisser s'en sortir comme çaⓠ\n@c0@"
  it: "@a%0%a001250@bSkriterioska è un essere orribile!\nPrima ha ucciso nonno Russel, e ora tiene in ostaggio nonna Mada! Non possiamo fargliela passare liscia!\n@c0@"
  ja: "@a@b%a001250「ゲマ…　おじいちゃんだけでなく\n\t今度は　おばあちゃんまで……\n\tそんなこと　絶対　させないから！\n@c0@"
32:
  de: "@aSancho@bGracias mucho, Chico, dass du deine alte Onkel Sancho mitgenommen hast.\n@c0@"
  en: "@aSancho@bMuchas gracias, My Majesty, for letting your Uncle Sancho accompany you on thees day.\n@c0@"
  es: "@aSancho@bMajestad, le estoy muy agradecido por permitir que su tito Sancho le acompañe en estos días.\n@c0@"
  fr: "@aSancho@bGracias mucho, Ma M-Majesté, de laisser tonton Sancho t'accompagner en ce grand j-jour.\n@c0@"
  it: "@aSancho@bChico, te ringrazio mucho por averme permesso de accompagnarte aquí oggi...\n@c0@"
  ja: "@a@bサンチョ「%a000090王。　今日という日に\n\tこのサンチョを　お供させて\n\tくださったこと　感謝しますぞ！\n@c0@"
33:
  de: "@aSancho@bDiese Slon wird bald seine letzte Atemzug tun. Iss werde den Tod von deine Padre rächen. Und wenn es das Letzte ist, was iss tue!\n@c0@"
  en: "@aSancho@bThees Ladja, he ees about to breathe hees last breath. I revenge your father's death.\r\nI fight for señor Pankraz!\n@c0@"
  es: "@aSancho@bEse Ladja está a punto de dar el último suspiro. Vengaré la muerte de tu apá.\n¡Yo lucho por el señor Teudis!\n@c0@"
  fr: "@aSancho@bCet Erebos, il va b-bientôt rendre son d-dernier souffle. Je vais v-venger la mort de ton padre.\nJe vais me b-b-battre pour le s-s-señor Petrosⓠ\n@c0@"
  it: "@aSancho@b¿Skriterioska, me senti?\n¡La tua ora es suonata!\n¡Yo combatto por vendicare el señor Russel!\n@c0@"
  ja: "@a@bサンチョ「パパスさまのカタキ…\n\tあのゲマという魔物の　いきの根\n\t今度こそ　とめてみせます！\n@c0@"
34:
  de: "@aOtto@bDieser Slon ist einfach nur widerlich. Ich hoffe sehr, dass wir Königin Magdalena noch rechtzeitig erreichen!\n@c0@"
  en: "@aTuppence@bThat despicable Ladja character! I do hope Queen Madalena can sit tight until we get there.\n@c0@"
  es: "@aAlazar@b¡Qué tipejo más despreciable, ese Ladja! Espero que la reina Perséfone pueda resistir hasta que lleguemos.\n@c0@"
  fr: "@aInnocent@bQuel être ignoble, cet Erebosⓠ J'espère que la reine Magdalena pourra tenir bon jusqu'à ce qu'on arrive.\n@c0@"
  it: "@aSimon@bSkriterioska, che tu sia maledetto!\nSpero che la regina Mada riesca a resistere ancora un po'...\n@c0@"
  ja: "@a@bピピン「ボクたちが　行くまで\n\tゲマのやつ…　太后さまを殺さないで\n\t待っていてくれると　いいんですが。\n@c0@"
35:
  de: "@aBianca@bVielleicht ist es ja Glück, wenn man für jemanden kämpfen kann, meinst du nicht auch?\n@c0@"
  en: "@aBianca@bMaybe happiness is bein' able to fight to help someone, dun't you think?\n@c0@"
  es: "@aBianca@bPuede que la felicidad sea luchar para ayudar a alguien, ¿no crees?\n@c0@"
  fr: "@aBianca@bPeut-être que le bonheur, c'est de se battre pour aider quelqu'un, tu ne crois pasⓡ\n@c0@"
  it: "@aBianca@bBisogna sempre combattere per ciò in cui si crede...\n@c0@"
  ja: "@a@bビアンカ「誰かのために\n\tたたかえるって　もしかしたら\n\t幸せなことなのかも……ね？\n@c0@"
36:
  de: "@aBianca@bSchließlich beweist es, dass man noch am Leben ist, oder?\n@c0@"
  en: "@aBianca@bI mean, it proves you're alive, dun't it?\n@c0@"
  es: "@aBianca@bQuiero decir, que demuestra que estás vivo, ¿no?\n@c0@"
  fr: "@aBianca@bÇa prouve qu'on est en vie, nonⓡ\n@c0@"
  it: "@aBianca@bResistere fino alla fine, fino a quando non si ha più fiato nei polmoni...\n@c0@"
  ja: "@a@bビアンカ「だって　それって\n\t生きてるショウコなんだもの……。\n@c0@"
37:
  de: "@aBianca@bIch werde deine Mutter nie vergessen, so lange ich lebe.\n@c0@"
  en: "@aBianca@bI'll never forget about your mum, not as long as\r\nI live.\n@c0@"
  es: "@aBianca@bNo olvidaré a tu madre en toda mi vida.\n@c0@"
  fr: "@aBianca@bJe n'oublierai jamais ta mère tant que je vivrai.\n@c0@"
  it: "@aBianca@bNon dimenticherò mai tua madre.\nCiò che ha fatto per noi, per proteggere il mondo...\nÈ stata una donna incredibilmente coraggiosa.\n@c0@"
  ja: "@a@bビアンカ「お母さまのこと\n\t私は　死ぬまで　わすれないわ。\n@c0@"
38:
  de: "@aBianca@bAlso müssen wir dafür sorgen, dass wir noch eine Weile auf dieser Welt bleiben. Damit ihr Andenken noch lange währt.\n@c0@"
  en: "@aBianca@bSo we'll have to make sure we live a long time.\r\nThat way, her memory will live on for longer.\n@c0@"
  es: "@aBianca@bAsí que tendremos que procurar vivir mucho.\nDe esa forma, su memoria vivirá más tiempo.\n@c0@"
  fr: "@aBianca@bAlors nous devons vivre le plus longtemps possible, pour que son souvenir perdure.\n@c0@"
  it: "@aBianca@bMada non è morta, %a000090...\nIl suo ricordo vivrà per sempre dentro di noi.\n㈡\nFaremo in modo che tutti sappiano che è stata lei a impedire che il mondo fosse avvolto dall'oscurità.\n@c0@"
  ja: "@a@bビアンカ「だから\n\t私たちは　長生きしなきゃ。\n\tお母さまの記憶を　消したくないもの。\n@c0@"
39:
  de: "@aNera@bDieser Ort ist geradezu erfüllt von einer übermächtigen, bösen Kraft, aber ich werde mich nicht einschüchtern lassen.\n@c0@"
  en: "@aNera@bThis place is filled with an overwhelmingly evil power, but I won't let it make me falter.\n@c0@"
  es: "@aNera@bEste lugar está plieno de un poder maligno abrumador, ma no dejaré que me debilite.\n@c0@"
  fr: "@aNera@bCet endroit est imprégné d'un pouvoir maléfique incroyable, mais je ne faiblirai pas.\n@c0@"
  it: "@aNera@bQuesto luogo trabocca di malvagità, ma non lascerò che il mio animo vacilli.\n@c0@"
  ja: "@a@bフローラ「ここでは　悪いチカラの\n\t大きさばかりが感じられますわね。\n\tでも　弱音は　はかないわ……。\n@c0@"
40:
  de: "@aNera@bIch bin mir sicher, dass du der Grund dafür warst, dass deine Mutter all die Jahre durchgehalten hat.\n@c0@"
  en: "@aNera@bI'm sure it's your existence that enabled your mother to carry on her fight alone all these years.\n@c0@"
  es: "@aNera@bEstoy sicura de que la tua existencia es lo que permitió a tu madre sostener sola su lucha durante tantos años.\n@c0@"
  fr: "@aNera@bJe suis sûre que c'est ton existence qui a donné à ta mère la force de continuer à se battre seule pendant toutes ces années.\n@c0@"
  it: "@aNera@b%0%a000090, sono sicura che sei stato tu a dare a tua madre la forza di resistere tanto a lungo.\n@c0@"
  ja: "@a@bフローラ「お母さまが　ひとりでも\n\tずっと　たたかってこられたのは\n\tきっと　あなたの存在があったからね。\n@c0@"
41:
  de: "@aNera@bIch fühle genauso. Ich würde alles in meiner Macht stehende tun, um meine Kinder zu schützen.\n@c0@"
  en: "@aNera@bI feel just the same way, you see. I'd do absolutely everything in my power to protect our children.\n@c0@"
  es: "@aNera@bVeramente, a mí me pasa lo mismo, ¿sabes? Haría cualquier cosa que estuviera en la mia mano por nuestros hijos.\n@c0@"
  fr: "@aNera@bJe ressens exactement la même choseⓢ je ferais tout ce qui est en mon pouvoir pour protéger nos enfants.\n@c0@"
  it: "@aNera@bLo so perché anch'io mi comporterei come Mada: darei la vita, pur di proteggere i nostri figli.\n@c0@"
  ja: "@a@bフローラ「私も　今　同じ気持ちなの。\n\t子供たちを　守るためなら　きっと\n\tどんなことだってしてみせますわ。\n@c0@"
42:
  de: "@a%0%a001240@bPapa, ich verstehe das nicht.\n@c0@"
  en: "@a%0%a001240@bDad, I don't get it.\n@c0@"
  es: "@a%0%a001240@bPapá, no lo entiendo.\n@c0@"
  fr: "@a%0%a001240@bPapa, je ne comprends pas.\n@c0@"
  it: "@a%0%a001240@bPapà...\n@c0@"
  ja: "@a@b%a001240「ねえ　お父さん。\n\tボク　わからないよ……。\n@c0@"
43:
  de: "@a%0%a001240@bWarum gibt es solch gemeine Wesen auf der Welt? Warum kann nicht jeder so nett sein wie die Monster, mit denen wir uns angefreundet haben?\n@c0@"
  en: "@a%0%a001240@bWhy are there such nasty characters in the world? Why can't they all be nice, like the monsters we've made friends with?\n@c0@"
  es: "@a%0%a001240@b¿Por qué hay gente tan malvada en el mundo? ¿Por qué no pueden ser agradables, como los monstruos que se han hecho amigos nuestros?\n@c0@"
  fr: "@a%0%a001240@bPourquoi il y a des gens aussi méchants dans le mondeⓡ Pourquoi ils ne peuvent pas être gentils comme les monstres avec qui on est amisⓡ\n@c0@"
  it: "@a%0%a001240@bPerché al mondo esistono le creature malvagie?\nPerché non tutti sono buoni come lo zio Sancho, come Simon, come i mostri con cui abbiamo fatto amicizia...?\n@c0@"
  ja: "@a@b%a001240「なんで　あんなに\n\t悪いやつが　いるんだろう……。\n\t仲間になれる魔物だっているのに。\n@c0@"
44:
  de: "@a%0%a001240@bDer Allerschlimmste ist also dieser Großmeister Nimzo, oder? Ich mach ihn fertig, das schwöre ich dir!\n@c0@"
  en: "@a%0%a001240@bSo the really bad guy is Grandmaster Nimzo, right? I'll sort him out, don't you worry!\n@c0@"
  es: "@a%0%a001240@bEntonces, el malo de verdad es el Gran Maestro Nimzo, ¿no? ¡Le daré lo suyo, no te preocupes!\n@c0@"
  fr: "@a%0%a001240@bDonc le méchant, c'est le Grand Maître Nimzoⓡ\nJe vais lui régler son compte, t'inquiète pasⓠ\n@c0@"
  it: "@a%0%a001240@bAllora il vero nemico è il Gran Maestro Nimzo, non è così?\nNon vedo l'ora di trovarmelo di fronte!\n@c0@"
  ja: "@a@b%a001240「ミルドラースって　いったよね。\n\tいちばん　悪いやつ……。\n\tボク絶対　そいつを　許さないよ！\n@c0@"
45:
  de: "@a%0%a001240@bGroßvater, Großmutter... Bitte wacht über uns.\n@c0@"
  en: "@a%0%a001240@bGrandpa, Grandma...\nWatch over us, please.\n@c0@"
  es: "@a%0%a001240@bAbuelo, abuela...\nVelad por nosotros, por favor.\n@c0@"
  fr: "@a%0%a001240@bGrand-père, grand-mère...\nProtégez-nous.\n@c0@"
  it: "@a%0%a001240@bNonno, nonna...\nProteggeteci da lassù e chiedete alla dea di mandarci la sua benedizione.\n@c0@"
  ja: "@a@b%a001240「おじいちゃん　おばあちゃん…\n\tボクたちのこと　見ててください。\n@c0@"
46:
  de: "@a%0%a001250@bIch hasse die Unterwelt. Ich wollte Großmutter den schönen Himmel zeigen und das große, weite Meer.\n@c0@"
  en: "@a%0%a001250@bI hate the underworld. I wanted to show Grandma a nice, pretty sky and a beautiful blue sea.\n@c0@"
  es: "@a%0%a001250@bOdio el inframundo. Quería enseñarle a la abuela la belleza del cielo y del mar azul.\n@c0@"
  fr: "@a%0%a001250@bJe déteste le monde souterrain. Je voulais montrer\nà grand-mère un joli ciel bleu et la mer.\n@c0@"
  it: "@a%0%a001250@bAvrei voluto passeggiare con la nonna su un prato, o in riva a un fiume...\nNon potrò mai farlo.\n@c0@"
  ja: "@a@b%a001250「わたし　魔界　きらい。\n\tおばあちゃんに　きれいな空と\n\t青い海　見せてあげたかった……。\n@c0@"
47:
  de: "@a%0%a001250@bWenn ich an Großmutter denke, würde ich am liebsten weinen, aber ich werde stark sein und es nicht tun!\n@c0@"
  en: "@a%0%a001250@bThinking about Grandma makes me want to cry,\nbut I'm going to be strong and hold back my tears.\n@c0@"
  es: "@a%0%a001250@bSi pienso en la abuela me entran ganas de llorar, pero seré fuerte y me aguantaré las lágrimas.\n@c0@"
  fr: "@a%0%a001250@bJ'ai envie de pleurer quand je pense à grand-mère, mais je vais être forte et je vais résister.\n@c0@"
  it: "@a%0%a001250@bSe penso a quello che hanno fatto alla nonna, mi vengono le lacrime agli occhi...\n㈡\nMa questo non è il momento di piangere.\nLa battaglia non è ancora finita.\n@c0@"
  ja: "@a@b%a001250「おばあちゃんのこと\n\t考えると　泣きそうだけど…\n\t泣かないで　がんばるの。\n@c0@"
48:
  de: "@a%0%a001250@bÄhm, Papa... Wenn unsere Reise zu Ende ist...\n@c0@"
  en: "@a%0%a001250@bUm, Dad... When we've finished travelling...\n@c0@"
  es: "@a%0%a001250@bMmm, papá... Cuando terminemos de viajar...\n@c0@"
  fr: "@a%0%a001250@bEuh, papa... Quand on aura fini de voyager...\n@c0@"
  it: "@a%0%a001250@bPapà, quando il nostro viaggio sarà finalmente terminato, potremmo...\n@c0@"
  ja: "@a@b%a001250「ねえ　お父さん。\n\tわたしたち　旅が終わったら…\n\tえっと……\n@c0@"
49:
  de: "@a%0%a001250@bÄhm... Ach nichts.\n@c0@"
  en: "@a%0%a001250@bUm... Nothing. Never mind.\n@c0@"
  es: "@a%0%a001250@bEsto... Nada. Da igual...\n@c0@"
  fr: "@a%0%a001250@bEuh... Rien. C'est pas grave.\n@c0@"
  it: "@a%0%a001250@bNo, lascia perdere...\nNon era una cosa importante.\n@c0@"
  ja: "@a@b%a001250「ううん…　なんでもないです。\n@c0@"
50:
  de: "@aSancho@bGlaubst du wirkliss, dass wir es schaffen können? Iss bin mir nisst mehr so sisser...\n@c0@"
  en: "@aSancho@bYou believe we really take victory?\nI no eso esure...\n@c0@"
  es: "@aSancho@b¿Crees que ganaremos?\nPues ahí yo no estoy tan seguro...\n@c0@"
  fr: "@aSancho@bT-Tu crois vraiment qu'on va gagnerⓡ\nMoi, je n'en suis p-pas sûr...\n@c0@"
  it: "@aSancho@b¿Chico, piensi davveros que abbiamo vinto?\nYo no soy totalmentes seguro...\n@c0@"
  ja: "@a@bサンチョ「私たち\n\t勝てるんでしょうかねえ……。\n@c0@"
51:
  de: "@aSancho@bNo! Perdón! Das ist diese Luft. Sie macht einen ganz schwermütig.\n@c0@"
  en: "@aSancho@bNo! Perdón! Ees thees air. Ees making me theenk eso negatively.\n@c0@"
  es: "@aSancho@b¡No! ¡Perdón! Es este aire. Me hace pensar de forma negativa, nomás.\n@c0@"
  fr: "@aSancho@bNonⓠ Perdónⓠ C'est cet air. Il m-me donne des idées n-noires.\n@c0@"
  it: "@aSancho@bForse es esta atmosfera negativa que me fa essere così pessimistas...\n@c0@"
  ja: "@a@bサンチョ「いや　すみません。\n\tここの空気のせいか　つい\n\t悪い方向に　考えてしまって……。\n@c0@"
52:
  de: "@aSancho@bWir sind schon sehr lange unterwegs, eh, Chico? Si, sehr, sehr lange.\n@c0@"
  en: "@aSancho@bWhen I look back, ees a very long way we are travelling. Sí, a long, long way.\n@c0@"
  es: "@aSancho@bCuando miro atrás, hemos hecho un viaje muy largo. Sí, tremendo viaje hemos hecho.\n@c0@"
  fr: "@aSancho@bSi on réfléchit bien, ça f-fait longtemps qu'on voyage. Si. T-Très très longtemps.\n@c0@"
  it: "@aSancho@bEl nuestro viaggio es estato muy lungo.\nSì, muy muy lungo...\n@c0@"
  ja: "@a@bサンチョ「ふり返ってみると\n\tずいぶん長く　旅しましたね。\n\t%a000090王も　私も……。\n@c0@"
53:
  de: "@aOtto@bBrrr... Mir ist kalt. Die Unterwelt ist sicher kein Platz, den man sich zum Verweilen aussuchen würde.\n@c0@"
  en: "@aTuppence@bBrr... I'm cold. The underworld certainly isn't the kind of place one would choose to hang about in.\n@c0@"
  es: "@aAlazar@bBrrr... Tengo frío. El inframundo no es un sitio como para quedarse.\n@c0@"
  fr: "@aInnocent@bBrrr... J'ai froid. Le monde souterrain n'est vraiment pas l'endroit idéal pour se balader.\n@c0@"
  it: "@aSimon@bSto gelando! Brrrrr! Questo freddo è insopportabile!\nNon vedo l'ora di lasciarmi alle spalle il Regno degli Inferi...\n@c0@"
  ja: "@a@bピピン「ううっ　寒い……。\n\t魔界って　あんまり\n\t長居したくないところですねえ。\n@c0@"
54:
  de: "@aOtto@bSeid Ihr Euch bei der Wahl Eurer Begleiter sicher, %a000090? Ich weiß net, ob ich für diese Mission wirklich geeignet bin.\n@c0@"
  en: "@aTuppence@bAre you sure about your choice of companions, %a000090? I'm not sure I'm quite cut out for this.\n@c0@"
  es: "@aAlazar@b¿Estáis seguro de que lleváis buena compañía, %a000090? Yo no estoy seguro de estar preparado.\n@c0@"
  fr: "@aInnocent@bVous êtes sûr d'avoir choisi les bons compagnons, %a000090ⓡ Je ne suis pas sûr d'être à la hauteur.\n@c0@"
  it: "@aSimon@bÈ sicuro di aver scelto bene, re %a000090?\nTemo di non essere la persona più adatta per questa missione...\n@c0@"
  ja: "@a@bピピン「%a000090さま　お供を\n\tまちがえてませんか？\n\t本当に　ボクで　いいんですか？\n@c0@"
55:
  de: "@aGriselda@bDas ist also Nadiria. Ich glaube nicht, dass die Luft hier besonders gut für meine Haut ist. Komm, lass uns schnell alles erledigen und wieder verschwinden!\n@c0@"
  en: "@aDebora@bSo this is Nadiria. The air here looks like it's bad\r\nfor the skin. Let's do what we came to do and get out of here.\n@c0@"
  es: "@aStefania@bAsí que esto es Nadiria. Este aire no parece muy bueno para la pelle. Vamos a hacer lo que tengamos que hacer y andiamo presto.\n@c0@"
  fr: "@aPandora@bAlors voici Nadiria. L'air d'ici ne semble pas très bon pour la peau. Faisons ce pour quoi nous sommes venus et sortons d'ici.\n@c0@"
  it: "@aViola@bSiamo a Nadiria...\nSanto cielo! Ma hai sentito che aria tira qui?!\nÈ una cosa orribile per la mia pelle!\n㈡\nDobbiamo sbrigarci!\nNon posso restare qui a lungo, altrimenti rischio di compromettere la mia sfolgorante bellezza!\n@c0@"
  ja: "@a@bデボラ「ここが　魔界……\n\tこの空気　おハダに悪そうだわ……。\n\tさっさと　用をすませて　帰るわよ。\n@c0@"
56:
  de: "@aGriselda@bIch glaube nicht, dass ich es durchstehen könnte, an solch einem dunklen und hoffnungslosen Ort eingesperrt zu sein.\n@c0@"
  en: "@aDebora@bI don't think I could survive being stuck in such a desolate place for years on end.\n@c0@"
  es: "@aStefania@bNo creo que pudiese sobrevivir en un sitio tan desolado durante anni.\n@c0@"
  fr: "@aPandora@bJe ne crois pas que je pourrais survivre si j'étais coincée dans un endroit aussi désolé pendant\r\nplusieurs années.\n@c0@"
  it: "@aViola@bEssere costretti a vivere per anni in questo posto malefico dev'essere un'esperienza orribile...\n@c0@"
  ja: "@a@bデボラ「こんな　荒れはてた場所に\n\t数十年も　閉じこめられるなんて\n\t私なら　耐えられない……。\n@c0@"
57:
  de: "@aGriselda@bWir müssen uns beeilen und deine Mutter retten, %a000090.\n@c0@"
  en: "@aDebora@bLet's get down to business and hurry up with rescuing your mother, %a000090.\n@c0@"
  es: "@aStefania@bManos a la obra, ¡a rescatar a la tua mamma, %a000090!\n@c0@"
  fr: "@aPandora@bDépêchons-nous de nous mettre au travail et d'aller sauver ta mère, %a000090.\n@c0@"
  it: "@aViola@bFacciamo presto, %a000090.\nDobbiamo trovare tua madre.\n@c0@"
  ja: "@a@bデボラ「さあ　グズグズしてないで\n\t一刻も早く　%a000090のママを\n\t助けるわよ。\n@c0@"
58:
  de: "@aGriselda@bMan kann hier gar nicht die Sonne sehen. Aber das wird wohl nicht der einzige Grund sein, warum es hier so kalt ist...\n@c0@"
  en: "@aDebora@bYou can't see the sun from here. Somehow I\r\ndon't think that's the only reason for the chill in\r\nthe air, though.\n@c0@"
  es: "@aStefania@bAquí no llega il sole. Ma non credo que el frío que hace sea solo por eso.\n@c0@"
