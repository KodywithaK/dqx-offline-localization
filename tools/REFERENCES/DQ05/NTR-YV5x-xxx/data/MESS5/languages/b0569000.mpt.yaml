61:
  de: "@aGriselda@bDas ganze Leid und der Schmerz, den meine Familie erfahren musste... Das alles ist Nimzos Werk.\n@c0@"
  en: "@aDebora@bAll of the pain and suffering my dear family has had to endure... All of it is Nimzo's doing.\n@c0@"
  es: "@aStefania@bTutto el dolor y el sufrimiento que ha tenido que soportar la mia famiglia... Tutto es culpa de Nimzo.\n@c0@"
  fr: "@aPandora@bToute la souffrance et toutes les douleurs que ma chère famille a dû endurer... Tout ça est l'œuvre de ce Nimzo.\n@c0@"
  it: "@aViola@bNimzo è il responsabile di tutte le sofferenze che la mia famiglia ha dovuto patire...\n@c0@"
