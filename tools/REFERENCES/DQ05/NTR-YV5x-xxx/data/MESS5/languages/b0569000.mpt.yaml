62:
  de: "@aGriselda@bEr wird den Tag noch bereuen, an dem er es wagte, meinen Zorn zu wecken. Dafür werde ich schon Sorge tragen.\n@c0@"
  en: "@aDebora@bI'll make him regret the day he dared anger me, more than he could possibly imagine.\n@c0@"
