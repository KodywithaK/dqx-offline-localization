  fr: "@aSancho@bC'est t-très étrange. Quelqu'un me joue des tours...\n@c0@"
  it: "@aSancho@bQue estrano...\nSe direbbe que qualcuno me estia facendo qualche escherzo...\n@c0@"
  ja: "@a@bサンチョ「おかしいなあ。\n\tどこへ　やったんだろ……。\n@c0@"
