  fr: "@aComte Karpatt@bEmpruntez les escaliers juste après cette porte. N'oooubliez pasⓢ je compte sur vooousⓠ\n@c0@"
  it: "@aConte De' Functis@bPer arrivaaarci, basta prendeeere le scale che si trooovano oltre queeella pooorta. Cooonto su di %H0860%Xte%Yvoi%Z...\nBisooogna regooolare i cooonti con quegli spettriii...\n@c0@"
  ja: "@a@bエリック「後ろのドアの　向こうの\n\t階段を上がれば　４階じゃからな。\n\tよろしく　たのんだぞ！\n@c0@"
60:
  de: "@aGraf Krypto@bEs tut mir leid. Ich habe dich nicht richtig verstanden. Daher muss ich dich noch einmal fragen: Duuu hilfst mir doch, ja?\n@c0@"
  en: "@aCount Uptaten@bI am sorry. I zink I am not hearing yooo correctly.\nI ask vun more time. Yooo vill help me, yes?\n@c0@"
  es: "@aConde Alverres@bLo siento. Creo que bien no %H0860%Xte%Yos%Z he oído.\nOtra vez lo preguuuntaré. Me %H0860%Xayuuudarás%Yayuuudaréis%Z, ¿verdad?\n@c0@"
  fr: "@aComte Karpatt@bPardon, mais je vooous entends mal.\nJe vais vooous poser une nouvelle fois la question. Vooous acceptez de m'aider, n'est-ce pasⓡ\n@c0@"
  it: "@aConte De' Functis@bTeeemo di non aver capiiito beeene...\nAllora ripeeeterò la dooomanda...\n%H0860%XVuoooi%YVoleeete%Z aiutaaarci?\n@c0@"
  ja: "@a@bエリック「すまん　返事が\n\t聞きとれなかった……。\n\t今いちど　たのもう。\n@c0@"
61:
