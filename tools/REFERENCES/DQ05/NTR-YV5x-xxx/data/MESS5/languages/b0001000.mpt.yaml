  it: "@aSancho@b¿Che ne dici di una buena siesta, eh?\n@c0@"
  ja: "@a@bサンチョ「どうぞ\n\tお休みなさいませ。\n@c0@"
162:
  de: "@aLudwig@bGuten Morgen, %a000090!\nIch hoffe, du hast gut geschlafen?\n@c0@"
  en: "@aPankraz@bGood morning, %a000090!\nSlept well, I trust?\n@c0@"
  es: "@aTeudis@b¡Buenos días, %a000090!\n¿Has dormido bien?\n@c0@"
  fr: "@aPetros@bBonjour, %a000090ⓠ\nBien dormi, j'espère.\n@c0@"
  it: "@aRussel@bBuongiorno, %a000090!\nHai dormito bene?\n@c0@"
  ja: "@a@bパパス「おはよう　%a000090\n\tよく　眠っていたようだな。\n@c0@"
163:
  de: "@aLudwig@bEs gibt da einige Dinge, um die ich mich kümmern muss, also werde ich heute zu Hause bleiben.\n@c0@"
  en: "@aPankraz@bI've some things I need to look into, so I'll be staying in today.\n@c0@"
