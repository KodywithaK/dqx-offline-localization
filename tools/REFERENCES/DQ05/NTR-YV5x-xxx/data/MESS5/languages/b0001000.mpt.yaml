  ja: "@a@bサンチョ「どこかに　イタズラ者が\n\tいるんですかねえ……。\n@c0@"
170:
  de: "@a@b*: Brrr. Mir ist k-k-kalt!\nDabei steht doch der Sommer vor der Tür. Ich versteh nicht, wieso es so k-k-kalt ist.\n@c0@"
  en: "@a@b*: Brrrrr. I'm f-f-f-f-freezing! It's supposed to be s-s-summer before long. I don't g-g-get why it's\r\nso c-c-cold.\n@c0@"
  es: "@a@b*: Brrrrr. ¡Est-t-t-toy helado!\r\n¿P-p-p-por qué hace t-t-t-tanto f-f-frío?\r\nSe supone que no f-f-falta mucho para la primavera.\n@c0@"
  fr: "@a@b*ⓢ Brrrrr. Je suis gla-gla-glacéⓠ\nL'été devrait b-b-bientôt arriver.\nJe ne c-c-comprends pas qu'il fasse si froid.\n@c0@"
  it: "@a@b*: Brrrrr! Sto g-gelando! Ep-p-pure d-dovremmo es-s-sere già in p-primav-v-vera! Non c-c-capisco perché fa t-t-tanto f-f-freddo!\n@c0@"
  ja: "@a@b＊「う～　さぶい　さぶい……。\n\tもうすぐ夏だっていうのに\n\tこの寒さは　なんだろうね……。\n@c0@"
171:
  de: "@a@b*: Also, hier im Dorf gehen gerade 'n paar ziemlich merkwürdige Dinge vor sich.\n@c0@"
  en: "@a@b*: There's a whole lot of funniness goin' on here in the village at the minute.\n@c0@"
  es: "@a@b*: Están pasando muchas cosas extrañas aquí en el pueblo.\n@c0@"
  fr: "@a@b*ⓢ Il se passe plein de trucs étranges au village, en ce moment.\n@c0@"
  it: "@a@b*: 'Mmazza, ahò!\nQui ar villaggio stanno succedenno delle cose davvero strane...\n@c0@"
  ja: "@a@b＊「さいきん　村に\n\tおかしなことが　おこるんだ。\n@c0@"
172:
  de: "@a@b*: Ich frag mich, ob das vielleicht was mit dem komischen Kerl zu tun hat, der neulich hier war.\n@c0@"
  en: "@a@b*: I wonder if it's got anythin' to do with that odd fella who was here the other day.\n@c0@"
  es: "@a@b*: No sé si tendrá algo que ver con ese tipo raro que estuvo por aquí hace unos días.\n@c0@"
  fr: "@a@b*ⓢ Je m'demande si ça a quelque chose à voir avec le type bizarre qui était là l'autre jour.\n@c0@"
  it: "@a@b*: Nun ce sarà mica de mezzo quer tipo ch'è venuto qui l'artro giorno?\n@c0@"
  ja: "@a@b＊「先日　村にやって来た\n\tあの　変なヤローのせいじゃ\n\tねえのかなあ……。\n@c0@"
173:
  de: "@a@b*: Außerhalb des Dorfes ist es äußerst gefährlich. Sei ein guter Junge und geh zurück nach Hause, wo du in Sicherheit bist.\n@c0@"
  en: "@a@b*: It's extremely dangerous outside of the village. You be a good boy now and go back home where you'll be nice and safe.\n@c0@"
  es: "@a@b*: Es muy peligroso salir del pueblo. Sé un buen chico y vuelve a casaⓓ allí estarás a salvo.\n@c0@"
  fr: "@a@b*ⓢ Il est très dangereux de s'aventurer hors du village. Sois un brave garçon et rentre chez toi.\nTu y seras bien en sécurité.\n@c0@"
  it: "@a@b*: Uscire dal villaggio è troppo pericoloso.\nDa bravo, torna a casa. Lì sarai al sicuro.\n@c0@"
  ja: "@a@b＊「村の外は　とてもキケンだ。\n\t坊や　いい子だから\n\tおうちに　もどりなさい。\n@c0@"
174:
  de: "@a@b*: Meine armen Pflänzchen leiden wirklich unter dieser Kälte. Ich weiß nicht mehr, was ich machen soll.\n@c0@"
  en: "@a@b*: My poor plants are really sufferin' here with this cold. I'm at my wits' end, I am.\n@c0@"
  es: "@a@b*: Mis pobres plantas están sufriendo con tanto frío. Ya no sé qué hacer.\n@c0@"
  fr: "@a@b*ⓢ Mes pauvres plantes souffrent vraiment, avec ce froid. Je ne sais plus quoi faire.\n@c0@"
  it: "@a@b*: Questo dannato freddo sta rovinando tutte le mie piante!\nNon so proprio cosa fare!\n@c0@"
  ja: "@a@b＊「こう寒くっちゃ\n\t作物が　育たないよ。\n\tこまったことだわい。\n@c0@"
