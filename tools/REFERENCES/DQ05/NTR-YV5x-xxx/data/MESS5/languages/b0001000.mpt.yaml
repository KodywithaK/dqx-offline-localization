  en: "@aSancho@bWell, friend, I expect you are tired after all thees travelling, sí?\n@c0@"
  es: "@aSancho@bBueno, chamaco, estarás retecansado después de tanto viajar, ¿verdad?\n@c0@"
  fr: "@aSancho@bEh bien, niño, tu dois être oun p-peu fatigué après oun tel voyage, noⓡ\n@c0@"
