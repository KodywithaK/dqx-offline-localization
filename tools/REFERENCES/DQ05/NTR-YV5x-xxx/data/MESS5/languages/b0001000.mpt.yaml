176:
  de: "@a@b*: Hey! Wo hast du den Stein her, Junge? Hast du ihn am Grund des Brunnens gefunden?\n@c0@"
  en: "@a@b*: Hey! Where did you get that stone, boy? Find it at the bottom of the well, did you?\n@c0@"
  es: "@a@b*: ¡Eh! ¿Dónde has encontrado esa piedra, chico?\r\nEn el fondo del pozo, ¿a que sí?\n@c0@"
  fr: "@a@b*ⓢ Héⓠ Où as-tu trouvé cette pierre, mon garçonⓡ\nAu fond du puits, peut-êtreⓡ\n@c0@"
  it: "@a@b*: Ehi, ragazzino!\nDove hai trovato quella roccia?\nNon era mica in fondo al pozzo, vero?\n@c0@"
  ja: "@a@b＊「……ありゃ？　ボウズ\n\t井戸のそこから　そんな石\n\tひろって来たんかね？\n@c0@"
177:
  de: "@a@b*: Ich hab in jungen Jahren in der Höhle rumgestöbert, auf der Suche nach einem der berühmten Steinach-Blausteine.\n@c0@"
  en: "@a@b*: I went huntin' about in the cave back in my younger days, lookin' for some of them famous Whealbrook bluestones.\n@c0@"
  es: "@a@b*: En mis tiempos fui a explorar la cueva en busca de las famosas aguamarinas de Arroyofrío.\n@c0@"
  fr: "@a@b*ⓢ Quand j'étais plus jeune, je suis allé explorer\nla caverne à la recherche d'une gemme bleue de Ruycelieu.\n@c0@"
  it: "@a@b*: Ricordo che, qualche anno fa, mi venne la voglia di trovare qualche pietra nobile di Valcava.\r\nLe cercai nella grotta, convinto che lì ce ne fossero.\n@c0@"
  ja: "@a@b＊「オラも　昔は　サンタローズ名産の\n\t聖なる原石を　もとめて\n\t洞くつ掘ったもんよ。\n@c0@"
178:
  de: "@a@b*: Ach ja. Ich erinnere mich gut daran, wie ich zwischen den großen Felsen nach Erz Ausschau hielt. Das waren noch Zeiten...\n@c0@"
  en: "@a@b*: Ah, yes. I remember pokin' about them big\r\nrocks hopin' for a sign of some ore. It doesn't\r\nhalf take me back.\n@c0@"
  es: "@a@b*: Ah, sí. Recuerdo cómo picaba las rocas esperando encontrar la señal de alguna veta.\n¡Qué recuerdos!\n@c0@"
  fr: "@a@b*ⓢ Ah, oui. Je me souviens très bien avoir fouillé partout dans ces gros rochers en espérant en trouver une. Ça ne me rajeunit pas, tout ça.\n@c0@"
  it: "@a@b*: Scavai ovunque!\nRidussi le pareti della caverna a un colabrodo, ma non trovai nemmeno l'ombra di una pietra!\n@c0@"
  ja: "@a@b＊「でっけえ　岩　掘り出しては\n\tぶちわって　原石さがしてなあ。\n\tなつかしい話だべ。\n@c0@"
179:
  de: "@a@b*: Meine armen Pflänzchen leiden wirklich unter dieser Kälte. Ich weiß nicht mehr, was ich machen soll.\n@c0@"
  en: "@a@b*: My poor plants are really sufferin' here with this cold. I'm at my wits' end, I am.\n@c0@"
