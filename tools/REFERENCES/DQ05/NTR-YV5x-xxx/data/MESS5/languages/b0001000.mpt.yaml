  it: "@aConte De' Functis@bOoottimo! Sapeeevo di poooter contare su di %H0860%Xte%Yvoi%Z! Ci contaaavo, perché io sooono... Conte!\n㈡\nWah ah ah! Esseeendo io un fantaaasma, non è certo lo spiiirito che mi maaanca...\n@c0@"
  ja: "@a@bエリック「そうか　やってくれるか！\n\tうむ。　そなたたちは　まことに\n\t勇気のある者たちじゃ。\n@c0@"
57:
  de: "@aGraf Krypto@bIhr Anführer wird im Thronsaal sein, beschützt von seinen teuflischen Dienern, den Geistern der Duuunkelwelt.\n@c0@"
