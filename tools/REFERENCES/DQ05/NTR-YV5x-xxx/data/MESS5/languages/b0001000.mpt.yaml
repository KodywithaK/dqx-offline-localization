  ja: "@a@bソフィア「今となっては　なげいても\n\tしかたのないこと。\n\tですが　せめて……\n@c0@"
47:
  de: "@aGräfin Krypto @bWeißt duuu, wir würden gerne in Frieden ruuuhen. Ich hoffe, duuu kannst uns helfen.\n@c0@"
