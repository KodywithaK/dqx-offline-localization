  fr: "@aSancho@bAh, si... Pendant votre absence, señor, cette lettre est arrivée pour vous.\n@c0@"
  it: "@aSancho@bAh, si...\nSeñor, mentre tu no eri aquí, es arrivata una lettera.\n@c0@"
