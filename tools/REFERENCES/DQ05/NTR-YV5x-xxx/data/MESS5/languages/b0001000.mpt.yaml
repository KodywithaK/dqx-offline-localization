  fr: "@aCandy@bPourquoi as-tu rejeté la demande de Mélissaⓡ\nJe pensais que tu ferais un courageux guerrier, mais je me suis trompée, on dirait.\n@c0@"
  it: "@aAmandina@bPerché hai detto di no ad Adusya, eh?!\nCredevo che tu fossi un guerriero forte e coraggioso!\n@c0@"
  ja: "@a@bポワン「そうですか……。\n\t残念ですが\n\tしかたありませんわね……。\n@c0@"
278:
  de: "@a@b*: Wir Feen sind nicht stark genug, um Schwerter zu schwingen.\n@c0@"
  en: "@a@b*: We faeries aren't strong enough to wield swords.\n@c0@"
  es: "@a@b*: Las hadas no podemos esgrimir espadas, nos falta fuerza.\n@c0@"
  fr: "@a@b*ⓢ Nous autres, les fées, ne sommes pas assez fortes pour manier l'épée.\n@c0@"
  it: "@a@b*: Noi fate non siamo in grado di impugnare le armi...\nNon siamo sufficientemente forti.\n@c0@"
  ja: "@a@bベラ「どうして　ことわったの？\n\tあなたを　見そこなったわ！\n@c0@"
279:
  de: "@a@b*: Wir benötigen deine Hilfe, %a000090. Deshalb hat Marmela sich an dich gewendet. Ich flehe dich an, tue, worum sie dich bittet.\n@c0@"
  en: "@a@b*: We need your help, %a000090. That's why Treacle asked you. Please, do what she asks of you.\n@c0@"
  es: "@a@b*: Necesitamos tu ayuda, %a000090. Por eso te la ha pedido Miel. Por favor, haz lo que te pide.\n@c0@"
  fr: "@a@b*ⓢ Nous avons besoin de ton aide, %a000090, c'est pour ça que Mélissa a fait appel à toi.\nJe t'en prie, fais ce qu'elle te demande.\n@c0@"
  it: "@a@b*: Abbiamo bisogno del tuo aiuto, %a000090.\nPer favore, non deluderci.\n@c0@"
  ja: "@a@b＊「私たち　妖精には\n\t剣をふる力は　ありません。\n@c0@"
280:
  de: "@a@b*: Die Feen sind verantwortlich für den Wechsel der Jahreszeiten.\n@c0@"
  en: "@a@b*: The faeries are responsible for the passing of the seasons.\n@c0@"
  es: "@a@b*: Las hadas son las responsables del ciclo de las estaciones.\n@c0@"
  fr: "@a@b*ⓢ Ce sont les fées qui sont responsables des changements de saisons.\n@c0@"
  it: "@a@b*: Le fate sovrintendono al susseguirsi delle stagioni.\n@c0@"
  ja: "@a@b＊「%a000090さま　どうか\n\tポワンさまの願いを\n\tかなえてあげて下さいませ。\n@c0@"
281:
  de: "@a@b*: Wenn sie den Frühling nicht herbeirufen können, wird der Winter niemals enden und die ganze Welt wird gefrieren.\n@c0@"
  en: "@a@b*: If they can't summon spring, the winter will never end and the whole world will freeze.\n@c0@"
  es: "@a@b*: Si no pueden invocar a la primavera, el invierno nunca acabará y el mundo se congelará.\n@c0@"
  fr: "@a@b*ⓢ Si elles ne peuvent pas invoquer le printemps, l'hiver ne finira jamais et le monde entier gèlera.\n@c0@"
  it: "@a@b*: Se non riusciranno a evocare la primavera, l'inverno durerà in eterno e il mondo intero diverrà un'immensa distesa di ghiaccio...\n@c0@"
  ja: "@a@b＊「ここは　季節をつかさどる\n\t妖精の国。\n@c0@"
282:
  de: "@a@b*: Wenn du von hier nach Norden reist, kommst du zur Winterwüste. Dort soll es einen Ort namens Winterpalast geben.\n@c0@"
  en: "@a@b*: If you travel north from here, you'll reach the winter wasteland. They say there's a place called the Winter Palace there.\n@c0@"
  es: "@a@b*: Si viajas al norte desde aquí, llegarás a un páramo helado. Dicen que allí se encuentra un lugar llamado Palacio de las Nieves.\n@c0@"
  fr: "@a@b*ⓢ En partant d'ici vers le nord, on finit par atteindre les steppes glacées. On raconte qu'il existe là-bas un lieu appelé le palais de Hiver.\n@c0@"
  it: "@a@b*: Andando verso nord si raggiunge la Distesa Pungente.\n@c0@"
  ja: "@a@b＊「このまま　春を告げられなければ\n\t世界は　冷えきって\n\tしまうことでしょう……。\n@c0@"
283:
  de: "@a@b*: Doch anscheinend sind dessen Türen stets verschlossen.\n@c0@"
  en: "@a@b*: But apparently its doors are always locked.\n@c0@"
  es: "@a@b*: Pero sus puertas siempre están cerradas, al parecer.\n@c0@"
  fr: "@a@b*ⓢ Apparemment, ses portes sont toujours fermées.\n@c0@"
  it: "@a@b*: Lì si erge il misterioso Palazzo Algido le cui porte, secondo un'antica leggenda, sono perennemente chiuse.\n@c0@"
  ja: "@a@b＊「ここから北に行くと　冬の国。\n\tそこには　氷の館とよばれる\n\t城が　あるそうですわ。\n@c0@"
284:
  de: "@a@b*: Hi hi hi! Du bist der Krieger, den Zuckerchen aus der Welt der Menschen hergebracht hat, um den Frühlingsboten wiederzubeschaffen?\n@c0@"
  en: "@a@b*: Tee hee hee! You're the warrior Honey brought from the human world to get the Herald of Spring back!?\n@c0@"
  es: "@a@b*: ¡Ji, ji, ji! ¡¿Tú eres el guerrero humano que Dulce ha traído para recuperar el Heraldo de la Primavera?!\n@c0@"
  fr: "@a@b*ⓢ Ti-hi-hiⓠ C'est toi le guerrier que Candy a ramené du monde des humains pour récupérer le Messager du Printempsⓡⓐ\n@c0@"
  it: "@a@b*: Tee eh eh! Tu sei il guerriero che Amandina ha condotto qui dal mondo degli umani per aiutarci a recuperare il Richiamo della Primavera?\n@c0@"
  ja: "@a@b＊「ただ　氷の館の入口は\n\tかたく　カギで\n\t閉ざされていると聞きます。\n@c0@"
285:
  de: "@a@b*: Du meine Güte! Äh... Ich hab gehört, dass der Dieb, der ihn gestohlen hat, zum Winterpalast geflohen ist. Viel Glück!\n@c0@"
  en: "@a@b*: Oh, my! Er...I heard that the thief who stole it fled to the Winter Palace. Good luck!\n@c0@"
  es: "@a@b*: ¡Vaya, vaya! Bueno... Dicen que el que lo robó huyó hacia el Palacio de las Nieves. ¡Suerte!\n@c0@"
  fr: "@a@b*ⓢ Eh bienⓠ Euh... J'ai entendu dire que le voleur s'était enfui vers le palais de l'Hiver.\nBonne chanceⓠ\n@c0@"
  it: "@a@b*: Allora ti auguro buona fortuna.\nNe avrai davvero bisogno! Sai, pare che il ladro che l'ha rubato sia fuggito verso il Palazzo Algido...\n@c0@"
  ja: "@a@b＊「まあ！　あなたが\n\tフルートを　取りかえすため\n\t呼ばれた　人間の戦士ね！？\n@c0@"
286:
  de: "@a@b*: Im Frühling hat man hier eine atemberaubende Aussicht.\n@c0@"
  en: "@a@b*: The view from here in springtime is breathtaking.\n@c0@"
  es: "@a@b*: En primavera, la vista desde aquí es increíble.\n@c0@"
  fr: "@a@b*ⓢ Au printemps, la vue que l'on a d'ici est à couper le souffle.\n@c0@"
  it: "@a@b*: In primavera, da qui si gode una vista meravigliosa...\n@c0@"
  ja: "@a@b＊「フルートをうばった盗賊は\n\tなんでも　氷の館に\n\t逃げこんだそうよ。\n@c0@"
287:
  de: "@a@b*: Marmela ist viel zu weich, wenn du mich fragst.\n@c0@"
  en: "@a@b*: Treacle's far too soft, if you ask me.\n@c0@"
  es: "@a@b*: Miel es demasiado blanda, eso es lo que pienso.\n@c0@"
  fr: "@a@b*ⓢ Si tu veux mon avis, Mélissa est bien trop gentille.\n@c0@"
  it: "@a@b*: Secondo me, Adusya si è un po' rammollita.\n@c0@"
  ja: "@a@b＊「ここから　ながめる\n\t春の景色は　とても美しいのよ。\n@c0@"
288:
  de: "@a@b*: Wie können Feen und Menschen in Frieden zusammenleben, geschweige denn Ungeheuer? \n@c0@"
  en: "@a@b*: How can faeries and humans live together in peace, let alone monsters?\n@c0@"
  es: "@a@b*: ¿Cómo van a convivir en paz hadas y humanos? ¡Y monstruos, menos!\n@c0@"
  fr: "@a@b*ⓢ Comment les fées et les humains pourraient-ils vivre ensembleⓡ Sans parler des monstres...\n@c0@"
  it: "@a@b*: Le fate non sono mai riuscite a vivere in armonia con gli umani...\nFiguriamoci con i mostri!\n@c0@"
  ja: "@a@b＊「ポワンさまも　考えが\n\t甘いのよ。\n@c0@"
289:
  de: "@a@b*: Wegen Marmela stecken wir jetzt ohne Flöte in diesem endlosen Winter fest.\n@c0@"
  en: "@a@b*: It's because of Treacle that we're stuck in this endless winter without a flute.\n@c0@"
  es: "@a@b*: Estamos en este invierno sin fin y no tenemos flauta, y la culpa es de Miel.\n@c0@"
  fr: "@a@b*ⓢ C'est à cause de Mélissa que nous sommes tous coincés, sans flûte, dans cet interminable hiver.\n@c0@"
  it: "@a@b*: È tutta colpa di Adusya se abbiamo perso il nostro magico flauto, senza il quale non possiamo scacciare l'inverno!\n@c0@"
  ja: "@a@b＊「妖精も　人間も　魔物ですら\n\tみんなで　仲良く　暮らそう\n\tだなんて……。\n@c0@"
290:
  de: "@a@b*: Ich weiß, wo er hin ist. Dieser Dieb ist mit Marmelas kostbarem Frühlingsboten nach Norden geflohen.\n@c0@"
  en: "@a@b*: I know where he went. That thief ran away north with Treacle's precious Herald of Spring.\n@c0@"
  es: "@a@b*: Sé hacia dónde fue. El ladrón huyó hacia el norte con ese valioso Heraldo de la Primavera de Miel.\n@c0@"
  fr: "@a@b*ⓢ Je sais où le voleur est allé. Il s'est enfui vers le nord avec le précieux Messager du Printemps de Mélissa.\n@c0@"
  it: "@a@b*: Io ho visto dov'è scappato il ladro!\nSi è diretto a nord dopo aver sottratto il prezioso Richiamo della Primavera ad Adusya!\n@c0@"
  ja: "@a@b＊「だから　フルートを\n\t盗まれたりするんだわ。\n@c0@"
291:
  de: "@a@b*: Marmela ist wirklich warmherzig.\n@c0@"
  en: "@a@b*: Treacle's really warm and kind.\n@c0@"
  es: "@a@b*: Miel es muy amable y dulce.\n@c0@"
  fr: "@a@b*ⓢ Mélissa est vraiment douce et chaleureuse.\n@c0@"
  it: "@a@b*: Adusya è dolce e gentile.\nÈ davvero una fata meravislurposa!\n@c0@"
  ja: "@a@b＊「わたし　知ってるよ。\n\tフルートを　盗んだ悪者は\n\t北のほうに逃げて行ったって。\n@c0@"
292:
  de: "@a@b*: Und glibberig. Von einem Schleim stammend, ist das ein Kompliment, weißt du. Sie lässt mich hier in Feenaue leben, obwohl ich ein Ungeheuer bin.\n@c0@"
  en: "@a@b*: And gooey too. That's a compliment from a slime, you know. She let me live here in Faerie Lea, even though I'm a monster.\n@c0@"
  es: "@a@b*: Y pegajosa. Para un limo, eso es un cumpliglop. Me permite vivir en Hadavilla, aunque sea un monstrglop.\n@c0@"
  fr: "@a@b*ⓢ Et collante, aussi. Venant d'un gluant, c'est un compliment, tu sais. Elle me laisse vivre ici, à Féeria, même si je suis un monstre.\n@c0@"
  it: "@a@b*: Ed è anche slurparella! Detto da uno Slime, è un gran complimento, sai? Mi ha permesso di vivere a Domus Fatae nonostante io sia un mostro!\n@c0@"
  ja: "@a@b＊「ポワンさまは　本当に\n\tやさしい方だよ。\n@c0@"
293:
  de: "@a@b*: Aaah!\nD-Das ist eine Säbelzahnkatze!\n@c0@"
  en: "@a@b*: Aaaah!\nTh-That's a great sabrecat!\n@c0@"
  es: "@a@b*: ¡Aaaah!\r\n¡E-es un dientes de sable!\n@c0@"
  fr: "@a@b*ⓢ Aaaaahⓠ\nUn... un smilodonⓠ\n@c0@"
  it: "@a@b*: Aaahhh!\nMa quello... Quello è un Koguar!\n@c0@"
  ja: "@a@b＊「ボクみたいな　スライムでも\n\tこの村に　住ませてくれるから。\n@c0@"
294:
  de: "@a@b*: Ich weiß, das ist noch ein Junges, aber dennoch... Ich habe noch nie gehört, dass sich jemand mit so einem Höllenbiest angefreundet hätte.\n@c0@"
  en: "@a@b*: I know it's only a young cub, but even so...\nI've never heard of anyone befriending a sabrecat. They come straight from hell!\n@c0@"
  es: "@a@b*: Solo es un cachorrillo, pero aun así...\r\nNunca he oído que nadie se hiciese amigo de un dientes de sable. ¡Son criaturas del infierno!\n@c0@"
  fr: "@a@b*ⓢ Je sais que ce n'est qu'un bébé pour l'instant, mais quand même...\n㈡\n*ⓢ C'est bien la première fois que je vois quelqu'un devenir ami avec un tigre à dents de sabre.\nIls viennent tout droit de l'enferⓠ\n@c0@"
  it: "@a@b*: Lo vedo che è solo un cucciolo, ma ho paura lo stesso! Non ho mai sentito di qualcuno che avesse come amico uno di quei mostri!\n@c0@"
  ja: "@a@b＊「あわわわ！\n\tおぬしが　連れているのは\n\tまさしく　キラーパンサー！\n@c0@"
295:
  de: "@a@b*: Oh, das tut gut! Geht doch nix über ein Bad. Die Hitze dringt einem bis in die Knochen!\n@c0@"
  en: "@a@b*: Oooh, that's good! Nothing like a bath.\nYou can feel the heat right down to your bones.\n@c0@"
  es: "@a@b*: Mmmm, qué bien. No hay nada como un baño.\r\nEl calor cala hasta los huesos.\n@c0@"
  fr: "@a@b*ⓢ Oooh, que ça fait du bienⓠ\nRien ne vaut un bon bain.\nÇa réchauffe jusqu'aux os.\n@c0@"
  it: "@a@b*: Oooh, che meraviglia!\nNon c'è niente di meglio di un bel bagno per idratare a fondo le ossa!\n@c0@"
  ja: "@a@b＊「まだ　小さいとはいえ\n\t地獄の殺し屋　キラーパンサーが\n\t人間になつくとは　信じられんわいっ。\n@c0@"
296:
  de: "@a@b*: Du bist neu hier, oder? Hast du von dem Zwerg gehört, der in einer Höhle im Westen wohnt?\n@c0@"
  en: "@a@b*: You're new here, are you? Have you heard about the dwarf who lives in a cave over to the west?\n@c0@"
  es: "@a@b*: Eres nuevo aquí, ¿verdad? ¿Has oído hablar del enano que vive en una cueva hacia el oeste?\n@c0@"
  fr: "@a@b*ⓢ Tu es nouveau par ici, nonⓡ As-tu entendu parler du nain qui vit dans une grotte, à l'ouest d'iciⓡ\n@c0@"
  it: "@a@b*: Sei nuovo di queste parti, vero?\nHai sentito parlare del nano che vive nella gr-ossa caverna a ovest di qui?\n@c0@"
  ja: "@a@b＊「ああ　いい湯じゃわい。\n\t骨まで　しみるのう……。\n@c0@"
297:
  de: "@a@b*: Hast du? Du bist ja gut informiert.\n@c0@"
  en: "@a@b*: You have? You're very well informed.\n@c0@"
  es: "@a@b*: ¿Sí? Estás muy bien informado.\n@c0@"
  fr: "@a@b*ⓢ Vraimentⓡ Tu es très bien renseigné.\n@c0@"
  it: "@a@b*: Te ne hanno già parlato?\nLa c-ossa non mi sorprende...\nHai l'aria di essere un tipo ben informato, tu.\n@c0@"
  ja: "@a@b＊「ところで　西の洞くつに住む\n\tドワーフの話を　知ってるか？\n@c0@"
298:
  de: "@a@b*: Er wurde offenbar aus Feenaue verbannt, als er ein Buch über Diebstähle und Schlösser schrieb. ⓞDes Schlossers Schläueⓟ hieß es.\n@c0@"
  en: "@a@b*: Apparently he was ousted from Faerie Lea when he wrote a book about thieving and locks. ⓗLots about Locksⓘ it was called.\n@c0@"
  es: "@a@b*: Al parecer, lo expulsaron de Hadavilla por escribir un libro sobre robos y cerraduras. Se llamaba ⓕTrucos de cerrajeroⓖ.\n@c0@"
  fr: "@a@b*ⓢ Apparemment, il a été chassé de Féeria après avoir écrit un livre sur les serrures et le vol.\nÇa s'appelait ⓥLes Clefs des serruresⓦ.\n@c0@"
  it: "@a@b*: Pare che sia stato cacciato da Domus Fatae perché ha scritto un libro su come scassinare le porte.\n㈡\nÈ un testo inter-ossa-nte, sai?\nS'intitola ⓕL'arte delle porte aperteⓖ.\n@c0@"
  ja: "@a@b＊「そうか。　お前は　なかなか\n\t耳がはやいな。\n@c0@"
299:
  de: "@a@b*: Hätte Marmela damals das Sagen gehabt, dann hätte man ihn sicher nicht so knochenhart bestraft. Armer Zwerg.\n@c0@"
  en: "@a@b*: If Treacle had been in charge back then, it wouldn't have been such a bone of contention. Poor dwarf.\n@c0@"
  es: "@a@b*: Si Miel hubiese estado al mando por aquel entonces, no hubiese habido para tanto. Pobre enano.\n@c0@"
  fr: "@a@b*ⓢ Si Mélissa avait été en poste à ce moment-là, ça n'aurait sans doute pas fait tant d'histoires.\n@c0@"
  it: "@a@b*: Se all'epoca a capo delle fate ci f-ossa stata Adusya, quel nano sarebbe ancora a Domus Fatae.\n㈡\nNon le sarebbe nemmeno passato per il teschio di mandarlo via...\n@c0@"
  ja: "@a@b＊「なんでも大昔\n\t盗賊のカギの技法をあみだして\n\t村を追い出されたそうだ。\n@c0@"
300:
  de: "@a@b*: Ich weiß nicht. Dieser Tage habe ich kaum noch Kunden. Also dann, wie geht das gleich wieder...?\n@c0@"
  en: "@a@b*: I don't know. I hardly get a single customer these days. So then, how does this go again...?\n@c0@"
  es: "@a@b*: No sé, no sé... Últimamente apenas tengo clientes. Bueno, ¿cómo era...?\n@c0@"
  fr: "@a@b*ⓢ Bizarre. Je n'ai quasiment plus un seul client ces derniers temps. Bon, comment ça marche, déjà...ⓡ\n@c0@"
  it: "@a@b*: Accidenti, non si vede l'ombra di un cliente...\nMa come mai, dico io, eh? Va bene che non è alta stagione, ma proprio non me lo spiego!\n@c0@"
  ja: "@a@b＊「ポワンさまの代なら\n\t追い出されなかったのに\n\tあわれなドワーフだよな。\n@c0@"
301:
  de: "@a@b*: Es war nicht meine Idee! Winz ist alleine losgezogen. Ich wusste nichts davon.\n@c0@"
  en: "@a@b*: It wasn't my idea! Dwight went off on his own. I knew nothing about it.\n@c0@"
  es: "@a@b*: ¡No fue idea mía! Dojo lo hizo por su cuenta. Yo no sabía nada.\n@c0@"
  fr: "@a@b*ⓢ Ça n'était pas mon idéeⓠ Antonin y est allé tout seul, je n'étais au courant de rien.\n@c0@"
  it: "@a@b*: Non è stata colpa mia!\nRalph ha fatto tutto da solo!\nGiuro che io non c'entro!\n@c0@"
  ja: "@a@b＊「いやはや　最近は　めっきり\n\t客も　へったのう。\n\tさて…と。\n@c0@"
302:
  de: "@a@b*: Ich weiß nicht, wieso er denkt, dass es Marmela war, die mich aus Feenaue rausgeworfen hat.\n@c0@"
  en: "@a@b*: I don't know where he got the idea that it was Treacle who chucked me out of Faerie Lea.\n@c0@"
  es: "@a@b*: No sé de dónde sacó la idea de que fue Miel la que me expulsó de Hadavilla.\n@c0@"
  fr: "@a@b*ⓢ Je ne sais pas d'où lui est venue l'idée que c'était Mélissa qui m'avait jeté hors de Féeria.\n@c0@"
  it: "@a@b*: Non so proprio come abbia potuto pensare che sia stata Adusya a cacciarmi da Domus Fatae.\nIo non gli ho mai detto nulla del genere.\n@c0@"
  ja: "@a@b■よろず屋チャートへ\n@c0@"
303:
  de: "@a@b*: D-Das Ganze tut mir leid. Du bist nicht zufällig an meinem Buch interessiert, ⓞDes Schlossers Schläueⓟ? Als Wiedergutmachung für Winzens Verhalten...\n@c0@"
  en: "@a@b*: I-I'm sorry about all this. I don't suppose you'd be interested in my book, ⓗLots about Locksⓘ, would you? To make up for Dwight's behaviour...\n@c0@"
  es: "@a@b*: S-siento mucho todo esto. Supongo que no estarás interesado en mi libro ⓕTrucos de cerrajeroⓖ, ¿verdad?\n㈡\n*: Como desagravio por el comportamiento de Dojo...\n@c0@"
  fr: "@a@b*ⓢ J-Je suis vraiment désolé pour tout ça.\nJe suppose que tu n'es pas intéressé par mon livre, ⓥLes Clefs des serruresⓦ, n'est-ce pasⓡ\n㈡\n*ⓢ Histoire de m'excuser pour le comportement d'Antonin...\n@c0@"
  it: "@a@b*: Mi spiace che Ralph si sia comportato in quel modo.\n㈡\nPer riparare almeno in parte alle sue malefatte, voglio donarti un libro: ⓕL'arte delle porte aperteⓖ. Può interessarti?\n@c0@"
  ja: "@a@b＊「まったく　ザイルには\n\tあきれてしまうわい！\n@c0@"
304:
  de: "@a@b*: Es ist in einer Schatztruhe weggeschlossen, die sich ganz unten in dieser Höhle befindet.\n@c0@"
  en: "@a@b*: It's shut away in a treasure chest right at the bottom of this cave.\n@c0@"
  es: "@a@b*: Está oculto en un cofre del tesoro en el fondo de esta cueva.\n@c0@"
  fr: "@a@b*ⓢ Le livre est enfermé dans un coffre au trésor, tout au fond de cette grotte.\n@c0@"
  it: "@a@b*: Lo custodisco in uno scrigno che si trova in fondo a questa caverna.\n@c0@"
  ja: "@a@b＊「わしが　ポワンさまに\n\t追い出されたと　カンちがいして\n\t仕返しを考えるとは……。\n@c0@"
305:
  de: "@a@b*: Und wenn du Winz begegnest, dann kläre ihn doch bitte auf, ja?\n@c0@"
  en: "@a@b*: And if you come across Dwight, set him straight for me, would you?\n@c0@"
