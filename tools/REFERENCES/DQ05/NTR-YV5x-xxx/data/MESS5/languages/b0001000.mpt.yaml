  ja: "@a@b＊「こう寒くっちゃ\n\t作物が　育たないよ。\n\tこまったことだわい。\n@c0@"
180:
  de: "@a@b*: Das hier ist Steinach. In unser Dorf kommen immer nur nette und freundliche Leute.\n@c0@"
  en: "@a@b*: This here's Whealbrook. We only ever get nice and friendly folk visitin' our village.\n@c0@"
  es: "@a@b*: Esto es Arroyofrío. A nuestro pueblo solo viene gente amable y simpática.\n@c0@"
  fr: "@a@b*ⓢ On est à Ruycelieu, ici. Il n'y a que des gens sympathiques qui viennent visiter notre village.\n@c0@"
  it: "@a@b*: Questo è il villaggio di Valcava, dove tutti i visitatori sono accolti con un sorriso!\n@c0@"
  ja: "@a@b＊「ここは　サンタローズの村。\n\tこの村を　おとずれるのは\n\t心やさしい人ばかりですわ。\n@c0@"
181:
  de: "@a@b*: Miau! Miau! Miau!\n@c0@"
  en: "@a@b*: Meow! Meow! Meow!\n@c0@"
  es: "@a@b*: ¡Miau! ¡Miau! ¡Miau!\n@c0@"
  fr: "@a@b*ⓢ Miaouⓠ Miaouⓠ Miaouⓠ\n@c0@"
  it: "@a@b*: Miao! Miao! Miaaao!\n@c0@"
  ja: "@a@b＊「にゃん　にゃん　にゃん！\n@c0@"
182:
  de: "@a@b*: Du bist doch der Sohn vom Ludwig, wenn ich mich nicht irre.\n@c0@"
  en: "@a@b*: You're Pankraz's son, if I'm not mistaken.\n@c0@"
  es: "@a@b*: Eres el hijo de Teudis, si no me equivoco.\n@c0@"
  fr: "@a@b*ⓢ Tu es le fils de Petros, si je ne me trompe pas.\n@c0@"
  it: "@a@b*: Se non sbaglio, tu sei il figlio di Russel.\n@c0@"
  ja: "@a@b＊「パパスどのの\n\tむすこさんじゃな。\n@c0@"
183:
  de: "@a@b*: Das ist vielleicht nur ein Gerücht, aber es heißt, dass er da draußen irgendwo einen mächtigen Feind habe.\n@c0@"
  en: "@a@b*: This might just be hearsay, but it sounds like he's got an almighty enemy out there somewhere.\n@c0@"
  es: "@a@b*: A lo mejor no es más que un rumor, pero parece que tiene un enemigo muy poderoso en alguna parte.\n@c0@"
  fr: "@a@b*ⓢ Ce ne sont peut-être que des racontars, mais il semblerait qu'il ait un ennemi très puissant quelque part.\n@c0@"
  it: "@a@b*: Qualcuno mi ha confidato che tuo padre ha dei nemici forti e pericolosi, sai?\nMa forse sono solo dicerie...\n@c0@"
  ja: "@a@b＊「これは　ウワサじゃが\n\tパパスどのには\n\tとんでもない敵がいるそうじゃ。\n@c0@"
184:
  de: "@a@b*: Wenn du doch nur ein wenig größer wärst, könntest du ihm helfen.\n@c0@"
  en: "@a@b*: If only you were more grown up, you'd be able to help him out.\n@c0@"
  es: "@a@b*: Si fueses mayor, quizá podrías ayudarle.\n@c0@"
  fr: "@a@b*ⓢ Si tu avais été un peu plus âgé, tu aurais sûrement pu l'aider.\n@c0@"
  it: "@a@b*: Tuttavia, se queste voci fossero fondate, sarebbe tuo dovere aiutarlo! Però dovrai crescere ancora un po', prima di potergli dare una mano...\n@c0@"
  ja: "@a@b＊「坊やが　もっと大きければ\n\tきっと　父の助けを\n\tできただろうにのう……。\n@c0@"
185:
  de: "@a@b*: Hallo. Was hast du denn da Schönes? Das sieht ja interessant aus.\n@c0@"
  en: "@a@b*: Hello. That's an interesting-looking gem you've got there.\n@c0@"
  es: "@a@b*: Hola. Esa joya que llevas ahí parece interesante.\n@c0@"
  fr: "@a@b*ⓢ Bonjour.\nC'est une pierre intéressante que tu as là.\n@c0@"
  it: "@a@b*: Salve!\nChe bella pietra che hai lì...\n@c0@"
  ja: "@a@b＊「うん？　坊やは\n\tふしぎな　宝玉を\n\t持っているな。\n@c0@"
186:
  de: "@a@b*: Es ist eine Goldkugel, sagst du?\n@c0@"
  en: "@a@b*: It's a gold orb, you say?\n@c0@"
  es: "@a@b*: ¿Dices que es un orbe de oro?\n@c0@"
  fr: "@a@b*ⓢ C'est un orbe d'or, dis-tuⓡ\n@c0@"
  it: "@a@b*: È un globo d'oro, vero?\n@c0@"
  ja: "@a@b＊「そうか　ゴールドオーブって\n\t言うんだね。\n@c0@"
187:
  de: "@a@b*: Darf ich sie mir mal näher ansehen?\n@c0@"
  en: "@a@b*: May I have a closer look?\n@c0@"
  es: "@a@b*: ¿Me dejas examinarlo más de cerca?\n@c0@"
  fr: "@a@b*ⓢ Tu veux bien que je le regarde de plus prèsⓡ\n@c0@"
  it: "@a@b*: Posso guardarlo più da vicino?\n@c0@"
  ja: "@a@b＊「その　オーブを　ちょっと\n\t見せてくれないか？\n@c0@"
188:
  de: "@a@b%0%a000090 überreicht dem Mann die Goldkugel.\n@c0@"
  en: "@a@b%0%a000090 hands over the gold orb.\n@c0@"
  es: "@a@b%0%a000090 entrega el orbe de oro.\n@c0@"
  fr: "@a@b%0%a000090 donne l'orbe d'or.\n@c0@"
  it: "@a@b%0%a000090 porge il globo d'oro.\n@c0@"
  ja: "@a@b%a000090は　ゴールドオーブを\n手わたした。\n@c0@"
189:
  de: "@a@b*: Hui. Aus der Nähe ist sie ja sogar noch hübscher.\n@c0@"
  en: "@a@b*: Wow. It's even prettier up close.\n@c0@"
  es: "@a@b*: ¡Vaya! De cerca es aún más bonito.\n@c0@"
  fr: "@a@b*ⓢ Ouah. Il est encore plus beau de près.\n@c0@"
  it: "@a@b*: Accidenti!\nVisto da vicino è ancora più bello!\n@c0@"
  ja: "@a@b＊「本当に　きれいな宝玉だね。\n\tはい　ありがとう。\n@c0@"
190:
  de: "@a@bDer Mann gibt %a000090 die Goldkugel zurück.\n@c0@"
  en: "@a@bThe man hands the gold orb back to %a000090.\n@c0@"
  es: "@a@bEl hombre devuelve el orbe de oro a %a000090.\n@c0@"
  fr: "@a@bL'homme rend l'orbe d'or à %a000090.\n@c0@"
  it: "@a@bL'uomo restituisce il globo d'oro a %a000090.\n@c0@"
  ja: "@a@b%a000090は　ゴールドオーブを\n返してもらった。\n@c0@"
191:
  de: "@a@b*: Äh, und pass ja gut auf deinen Vater auf, klar?\n@c0@"
  en: "@a@b*: Erm, make sure you take good care of your father, okay?\n@c0@"
  es: "@a@b*: Esto... cuida bien de tu padre, ¿de acuerdo?\n@c0@"
  fr: "@a@b*ⓢ Euh... Surtout, prends bien soin de ton père, d'accordⓡ \n@c0@"
  it: "@a@b*: A proposito...\nRicordati di restare sempre vicino a tuo padre.\nAbbi cura di lui.\n@c0@"
  ja: "@a@b＊「坊や　お父さんを\n\t大切にしてあげるんだよ。\n@c0@"
192:
  de: "@a@b*: Ah, komm schon. Ist ja nicht so, als hätte ich vor, sie zu klauen. Du kannst mir vertrauen. Ehrlich.\n@c0@"
  en: "@a@b*: Oh, go on. It's not like I'm planning on stealing it or anything. You can trust me, I promise.\n@c0@"
  es: "@a@b*: Venga, vamos. ¿Crees que te lo voy a robar? Puedes confiar en mí, en serio.\n@c0@"
  fr: "@a@b*ⓢ Oh, allez. Je n'ai pas l'intention de te le voler, tu sais. Tu peux me faire confiance, c'est promis.\n@c0@"
  it: "@a@b*: Oh, andiamo!\nGuarda che non ho mica intenzione di rubartelo...\nPuoi fidarti.\n@c0@"
  ja: "@a@b＊「アハハ……。\n\tべつに　盗むつもりはないよ。\n\t信用してほしいな。\n@c0@"
193:
  de: "@a@b*: Egal, wie schwierig die Situation ist, du musst immer den Kopf hochhalten und darfst niemals aufgeben. Vergiss das nicht, ja?\n@c0@"
  en: "@a@b*: No matter how hard things may get for you, keep your head held high and never give up.\r\nRemember that, okay?\n@c0@"
  es: "@a@b*: No importa lo feas que se pongan las cosas, mantén la cabeza bien alta y nunca te rindas.\nRecuérdalo, ¿vale?\n@c0@"
  fr: "@a@b*ⓢ Même si un jour, les choses devaient devenir très difficiles pour toi, surtout garde la tête haute et n'abandonne pas. N'oublie jamais ça, d'accordⓡ\n@c0@"
  it: "@a@b*: Ricorda una cosa: anche quando la situazione ti sembrerà disperata, non dovrai smettere di combattere. Non arrenderti mai!\n@c0@"
  ja: "@a@b＊「坊や。　どんなツライことが\n\tあっても　負けちゃダメだよ。\n@c0@"
194:
  de: "@a@b*: Dieser fesche Knabe steht wohl nicht mehr vor der Kirche rum, oder, Junge?\n@c0@"
  en: "@a@b*: I don't suppose that splendid-lookin' fella is still standin' outside the church, is he, boy?\n@c0@"
  es: "@a@b*: No estará aún ese tipo tan atractivo esperando fuera de la iglesia, ¿verdad, chico?\n@c0@"
  fr: "@a@b*ⓢ Je suppose que le très bel homme qui se tenait devant l'église n'y est plus, n'est-ce pas mon garçonⓡ\n@c0@"
  it: "@a@b*: Piccolo, per caso c'è ancora un bel giovanotto fuori dalla chiesa?\n@c0@"
  ja: "@a@b＊「ねえ　坊や。\n\t教会の前にいた　ステキな人は\n\tまだ　いるかしら……。\n@c0@"
195:
  de: "@a@b*: Hm... Was soll ich nur machen... Ich frage mich, ob der vielleicht gekommen ist, um mich zu sehen...\n@c0@"
  en: "@a@b*: Hm. What to do, what to do... I wonder if it's me he wants to see...\n@c0@"
  es: "@a@b*: Mmm. ¿Qué hacer, qué hacer...? Me pregunto si será a mí a quien espera...\n@c0@"
  fr: "@a@b*ⓢ Mmm... Que faire, que faire... Je me demande si c'est moi qu'il est venu voir...\n@c0@"
  it: "@a@b*: Ma cosa starà facendo?\nNon sarà mica qui per me, eh?!\nIo sono una suora!\n@c0@"
  ja: "@a@b＊「どうしましょ……。\n\tもしかして　私に　気が\n\tあったりして……。　ぽっ……。\n@c0@"
196:
  de: "@a@b*: Das ist ja seltsam. Ich hätte schwören können, dass ich meinen Nähkasten in die Kommode gelegt habe. Und jetzt ist er dort auf dem Stuhl!\n@c0@"
  en: "@a@b*: Now that is odd. I could've sworn I'd put my sewin' box in the cupboard, and yet there it is on the chair.\n@c0@"
  es: "@a@b*: Qué extraño. Juraría que había guardado mi costurero en el armario, y ahora está en la silla.\n@c0@"
  fr: "@a@b*ⓢ Ça c'est bizarre. J'aurais juré avoir rangé ma boîte à couture dans le placard et pourtant, elle est là, sur la chaise.\n@c0@"
  it: "@a@b*: Ma che strano!\nEro certa di aver messo ago e filo nella credenza...\nE invece eccoli lì sulla sedia!\n@c0@"
  ja: "@a@b＊「あらあら\n\tタンスの中に入れたと思った\n\tおさいほう箱が　イスの上に。\n@c0@"
197:
  de: "@a@b*: Da hat mir mein Gedächtnis wohl einen Streich gespielt.\n@c0@"
  en: "@a@b*: My mind must be playin' tricks on me.\n@c0@"
  es: "@a@b*: La cabeza me debe estar jugando una mala pasada.\n@c0@"
  fr: "@a@b*ⓢ Ma tête doit me jouer des tours.\n@c0@"
  it: "@a@b*: Brutta cosa, la vecchiaia!\n@c0@"
  ja: "@a@b＊「おかしなことが　あるものねえ。\n@c0@"
198:
  de: "@a@b*: Na so was! Ich dreh mich einen Augenblick weg, und als ich wieder hingucke, ist der Topf wie sauber geleckt!\n@c0@"
  en: "@a@b*: Dear me! I turn my head for a second, and come back to find the pot practically licked clean!\n@c0@"
  es: "@a@b*: ¡Oh, vaya! ¡Me despisto un segundo y me encuentro la cacerola vacía!\n@c0@"
  fr: "@a@b*ⓢ Ça alorsⓠ J'ai tourné la tête pendant une seconde et quand je suis revenue, la marmite était presque videⓠ\n@c0@"
  it: "@a@b*: Oh, ma tu guarda!\nMi sono assentata un solo istante, e quando sono tornata ho trovato la pentola completamente vuota!\n@c0@"
  ja: "@a@b＊「ありゃ？\n\tおなべの中が　いつの間にか\n\tからっぽだわ。\n@c0@"
199:
  de: "@a@b*: Der Alte könnte ja ruhig was sagen, wenn er so hungrig ist.\n@c0@"
  en: "@a@b*: The old man should just speak up if he's that hungry.\n@c0@"
  es: "@a@b*: Si ese viejo pellejo tenía tanta hambre, me lo podría haber dicho...\n@c0@"
  fr: "@a@b*ⓢ Si mon mari a si faim que ça, il n'a qu'à me le dire.\n@c0@"
  it: "@a@b*: Se mio marito aveva fame, poteva tranquillamente dirmelo!\n@c0@"
  ja: "@a@b＊「おじいちゃんも\n\tおなかが　すいたなら\n\tそう　いえばいいのに……。\n@c0@"
200:
  de: "@a@b*: Ich hab's nicht gegessen, sag ich dir!\n@c0@"
  en: "@a@b*: I didn't eat it, I tell you!\n@c0@"
  es: "@a@b*: ¡Te digo que yo no me lo he comido!\n@c0@"
  fr: "@a@b*ⓢ Ça n'est pas moi qui ai mangé ce qu'il y avait dedans, je te disⓠ\n@c0@"
  it: "@a@b*: Ti giuro che la pentola non l'ho nemmeno toccata!\n@c0@"
  ja: "@a@b＊「わしゃ　食べとらんぞ！\n@c0@"
201:
  de: "@a@b*: Also ehrlich! Dieses zickige Weibsbild behandelt mich manchmal wie ein kleines Kind!\n@c0@"
  en: "@a@b*: Honestly! That old dragon of a wife of mine treats me like a child sometimes!\n@c0@"
  es: "@a@b*: ¡En serio! ¡Ese viejo dragón que tengo por esposa me trata como a un crío!\n@c0@"
  fr: "@a@b*ⓢ Franchementⓠ Le vieux dragon qui me sert de femme me traite parfois comme un gaminⓠ\n@c0@"
  it: "@a@b*: Ma che parlo a fare, eh?!\nQuella vipera di mia moglie non mi ascolta nemmeno...\n@c0@"
  ja: "@a@b＊「わしのことを　子どもあつかいして\n\tうちのヨメも\n\tこまったヤツじゃわい。\n@c0@"
202:
  de: "@a@b*: Hey! Da hat jemand eine merkwürdige Nachricht in meinem Gästebuch hinterlassen. Das warst doch nicht du, Junge, oder?\n@c0@"
  en: "@a@b*: Hey! Someone's gone and written a weird message in my guest book. It wasn't you, was it, boy?\n@c0@"
  es: "@a@b*: ¡Eh! Alguien ha escrito un extraño mensaje en el libro de huéspedes. No habrás sido tú, ¿eh, chico?\n@c0@"
  fr: "@a@b*ⓢ Héⓠ Quelqu'un a écrit un drôle de message dans mon livre d'or. Ça ne serait pas toi par hasard, mon garçonⓡ\n@c0@"
  it: "@a@b*: Ehi! Qualcuno ha scritto uno strano messaggio sul mio quaderno!\nSei stato tu, brutto discolaccio, eh?\n@c0@"
  ja: "@a@b＊「ありゃりゃ　宿帳に　おかしな\n\tいたずら書きが　してあるぞ。\n\t坊やじゃないだろうね？\n@c0@"
203:
  de: "@a@b*: Du bist doch der Kleine, der sich gern in Höhlen rumtreibt, oder? Ich bin derjenige, der vor dem Steinach-Stollen Wache gestanden hat.\n@c0@"
  en: "@a@b*: You're that kid who likes caves, right?\r\nI'm the guard who was standin' in front of  Whealbrook Adit before.\n@c0@"
  es: "@a@b*: Eres ese niño a quien le gustan las cuevas, ¿no?\r\nYo soy el que vigilaba la Boca de Arroyofrío.\n@c0@"
  fr: "@a@b*ⓢ C'est toi le gamin qui aime les grottes, nonⓡ\nJe suis le garde qui se tenait auparavant devant la caverne de Ruycelieu.\n@c0@"
  it: "@a@b*: Tu sei il ragazzino a cui piacciono le caverne, non è così? Io sono il soldato che era di guardia alla Grotta di Valcava.\n@c0@"
  ja: "@a@b＊「キミは　洞くつ好きの坊やだね。\n\t私は　洞くつの入口にいた\n\tおじさんだよ。\n@c0@"
204:
  de: "@a@b*: Im Dorf hält sich gerade ein seltsamer Kerl auf, der ein ziemliches Aufsehen erregt.\n@c0@"
  en: "@a@b*: There's a funny fella in the village at the moment who's causin' quite a stir.\n@c0@"
  es: "@a@b*: Hay un tipo raro en el pueblo que está causando sensación.\n@c0@"
  fr: "@a@b*ⓢ Il y a un drôle de type dans le village, en ce moment, et ça crée pas mal d'agitation.\n@c0@"
  it: "@a@b*: Al villaggio è arrivato uno strano tipo dall'aria poco raccomandabile.\n@c0@"
  ja: "@a@b＊「近頃　村に　変なヤツが来て\n\tいろいろと　かぎまわってる\n\tようなのだ。\n@c0@"
205:
  de: "@a@b*: Als ich ihn zuletzt gesehen hab, stand er bei der Kirche rum. Nimm dich vor dem in Acht, Junge, klar?\n@c0@"
  en: "@a@b*: He was standin' by the church last time I looked. You be careful of him, alright, boy?\n@c0@"
  es: "@a@b*: La última vez que lo vi estaba cerca de la iglesia. Ten cuidado con él, ¿vale, chico?\n@c0@"
  fr: "@a@b*ⓢ La dernière fois que je l'ai vu, il se tenait devant l'église. Méfie-toi de lui, d'accord bonhommeⓡ\n@c0@"
  it: "@a@b*: L'ultima volta che l'ho visto era dalle parti della chiesa.\nPiccolo, ti consiglio di stargli lontano. Hai capito?\n@c0@"
  ja: "@a@b＊「たしか　教会のそばにいたが\n\t坊やも　気をつけないと\n\tいけないよ。\n@c0@"
206:
  de: "@a@b*: Das ist komisch. Ich bin mir sicher, hier hat eben noch kein Glas gestanden.\n@c0@"
  en: "@a@b*: That's funny. I'm sure there was no glass here before.\n@c0@"
  es: "@a@b*: Es curioso. Estoy seguro de que este vaso no estaba aquí antes.\n@c0@"
  fr: "@a@b*ⓢ C'est drôle. Je suis certain qu'il n'y avait pas de verre ici il y a deux secondes.\n@c0@"
  it: "@a@b*: Ma che scherzi sono?!\nQui prima non c'era nessun bicchiere!\nNe sono certissimo!\n@c0@"
  ja: "@a@b＊「おや？\n\tグラスが　ないと思ったら\n\tこんな所に　あったか。\n@c0@"
207:
  de: "@a@b*: Hier passieren in letzter Zeit die seltsamsten Dinge.\n@c0@"
  en: "@a@b*: A lot of weird things seem to be happenin' just lately.\n@c0@"
  es: "@a@b*: Últimamente están pasando muchas cosas raras.\n@c0@"
  fr: "@a@b*ⓢ On dirait qu'il se passe plein de choses bizarres, ces derniers temps.\n@c0@"
  it: "@a@b*: Ultimamente stanno succedendo delle cose veramente bizzarre...\n@c0@"
  ja: "@a@b＊「どうも　最近\n\tこういうことが多いなあ……。\n@c0@"
208:
  de: "@a@b*: Huch! Du kannst mich sehen?!\n@c0@"
  en: "@a@b*: Yikes! You can see me!?\n@c0@"
  es: "@a@b*: ¡Huy! ¡¿Me puedes ver?!\n@c0@"
  fr: "@a@b*ⓢ Bon sangⓠ Tu arrives à me voirⓡⓐ\n@c0@"
  it: "@a@b*: Gulp!\nMa tu riesci a vedermi?!\n@c0@"
  ja: "@a@b＊「まあっ！\n\tあなたには　私が見えるの！？\n@c0@"
209:
  de: "@a@b*: Juchhu! Endlich jemand, der mich sehen kann!\n@c0@"
  en: "@a@b*: Yippee! At last, someone who can see me!\n@c0@"
  es: "@a@b*: ¡Yupiii! ¡Por fin alguien que puede verme!\n@c0@"
  fr: "@a@b*ⓢ Youpiⓠ Enfin quelqu'un qui peut me voirⓠ\n@c0@"
  it: "@a@b*: Evviva!\nFinalmente ho trovato una persona a cui non sono invisibile!\n@c0@"
  ja: "@a@b＊「よかった！\n\tやっと私に　気がついてくれる\n\t人を　見つけたわ！\n@c0@"
210:
  de: "@a@b*: Wer ich bin?\nHi hi! Ich erzähl es dir vielleicht, aber nicht hier.\n@c0@"
  en: "@a@b*: Who am I?\nTee hee! I might tell you, but not here.\n@c0@"
  es: "@a@b*: ¿Que quién soy?\r\n¡Ji, ji! Quizá te lo diga, pero aquí no.\n@c0@"
  fr: "@a@b*ⓢ Qui je suisⓡ\nTi-hi-hiⓠ Je te le dirai, mais pas ici.\n@c0@"
  it: "@a@b*: Vuoi sapere chi sono?\nD'accordo, te lo dirò.\nMa non qui!\n@c0@"
  ja: "@a@b＊「私が　何者かですって？\n\t待って　ここじゃ\n\t落ちつかないわ。\n@c0@"
211:
  de: "@a@b*: Eins der Häuser hier im Dorf hat einen Kellerraum.\n@c0@"
  en: "@a@b*: One of the houses here in the village has a room in the cellar.\n@c0@"
  es: "@a@b*: Una de las casas del pueblo tiene un cuarto en la bodega.\n@c0@"
  fr: "@a@b*ⓢ Dans l'une des maisons du village, il y a une pièce au sous-sol.\n@c0@"
  it: "@a@b*: In una delle case del villaggio, c'è una cantina con una certa stanza...\n@c0@"
  ja: "@a@b＊「たしか　この村には\n\t地下室のある家が　あったわね……。\n@c0@"
212:
  de: "@a@b*: Treffen wir uns doch dort. Mal sehen, wer schneller da ist!\n@c0@"
  en: "@a@b*: Come and meet me there. Race you!\n@c0@"
  es: "@a@b*: Nos vemos allí. ¡A ver quién llega antes!\n@c0@"
  fr: "@a@b*ⓢ Retrouve-moi là-bas. Le premier arrivéⓠ\n@c0@"
  it: "@a@b*: Ci incontreremo lì.\nVediamo chi arriva prima!\n@c0@"
  ja: "@a@b＊「その家の　地下室に　行ってて！\n\t私も　すぐに　行くから……。\n@c0@"
213:
  de: "@a@b*: Du bist also Ludwigs Sohn, Junge?\n@c0@"
  en: "@a@b*: So you're Pankraz's son are you, boy?\n@c0@"
  es: "@a@b*: Así que tú eres el hijo de Teudis, ¿verdad?\n@c0@"
  fr: "@a@b*ⓢ Alors comme ça, tu es le fils de Petros, mon garçonⓡ\n@c0@"
  it: "@a@b*: Tu sei il figlio di Russel, se non sbaglio...\n@c0@"
  ja: "@a@b＊「へえ　坊やの父さんは\n\tパパスさんと　いうのか……。\n@c0@"
214:
  de: "@a@b*: Wo ich so drüber nachdenke, fällt mir ein, dass es irgendwo mal einen König Ludwig gegeben hat.\n@c0@"
  en: "@a@b*: Come to think of it, I seem to remember there bein' a King Pankraz of somewhere or other once.\n@c0@"
  es: "@a@b*: Ahora que lo pienso, me parece recordar haber oído una vez no sé qué sobre un rey que se llamaba Teudis.\n@c0@"
  fr: "@a@b*ⓢ Tiens, d'ailleurs maintenant que j'y pense... je crois me souvenir qu'il existait un roi Petros quelque part, autrefois.\n@c0@"
  it: "@a@b*: Sai che una volta c'era un sovrano di nome Russel?\n@c0@"
  ja: "@a@b＊「そういえば昔　どこかの国に\n\tパパスという国王がいたなあ。\n@c0@"
215:
  de: "@a@b*: Aber das hat natürlich nix mit deinem Vater zu tun!\n@c0@"
  en: "@a@b*: Not that that has anythin' to do with your dad, of course!\n@c0@"
  es: "@a@b*: ¡Claro que no tendrá nada que ver con tu padre!\n@c0@"
  fr: "@a@b*ⓢ Mais rien à voir avec ton père, évidemmentⓠ\n@c0@"
  it: "@a@b*: Si tratta certo di un caso di omonimia.\nNon credo proprio che tuo padre sia un re!\n@c0@"
  ja: "@a@b＊「まあ　坊やの父さんとは\n\t別人だろうけどね。\n@c0@"
216:
  de: "@a@b*: Jetzt, wo mein Vater zurück ist, konnte ich meinen Laden wieder öffnen. Vielleicht könnt ich dir ja einen Sonderpreis machen?\n@c0@"
  en: "@a@b*: Now my old man's back, I've been able to open up the shop again. Maybe I could do you a deal?\n@c0@"
  es: "@a@b*: Ahora que ha regresado mi padre he podido volver a abrir la tienda. ¿Puedo ofrecerte una ganga?\n@c0@"
  fr: "@a@b*ⓢ À présent que mon vieux père est revenu, j'ai pu rouvrir le magasin. Je peux peut-être vous proposer quelque choseⓡ\n@c0@"
  it: "@a@b*: Ora che il mio vecchio è tornato, posso riaprire bottega.\nPotremmo fare qualche affare, se ti va...\n@c0@"
  ja: "@a@b＊「やあ　坊やか。　親方がもどって来た\n\tおかげで　店を開けられるよ。\n\tサービスするからね。\n@c0@"
217:
  de: "@aHerr Unterlieger@bAh! Du bist doch der Bursche aus der Höhle, nicht wahr, Junge? Du hast mich da wirklich aus der Klemme gezogen.\n@c0@"
  en: "@aMr Rockefeller@bAh! You're the young laddie from the cave aren't you, boy? You really helped me out of a tight spot back there.\n@c0@"
  es: "@aSr. Roca@b¡Ah! Eres el muchacho de la cueva, ¿verdad? Me sacaste de un verdadero aprieto.\n@c0@"
  fr: "@aGauthier Krazé@bAh, c'est toi le jeune homme de la caverne, n'est-ce pasⓡ\nTu m'as vraiment tiré d'un mauvais pas, là-bas.\n@c0@"
  it: "@aJohn Travolto@bCiao, mio salvatore! L'altra volta, nella caverna, mi hai tirato fuori da una situazione davvero brutta.\nGrazie ancora!\n@c0@"
  ja: "@a@b■道具屋チャート\n@c0@"
218:
  de: "@aHerr Unterlieger@bTatsächlich würde ich sagen, du hast dir eine Belohnung verdient! Wirf mal einen Blick in die Schublade da drüben.\n@c0@"
  en: "@aMr Rockefeller@bIn fact, I'd say you deserve a reward!\r\nHave a look in that drawer just there.\n@c0@"
  es: "@aSr. Roca@b¡De hecho, creo que mereces una recompensa!\r\nMira en ese cajón de ahí.\n@c0@"
  fr: "@aGauthier Krazé@bJe dirais même que tu mérites une récompenseⓠ\nRegarde dans ce tiroir, juste là.\n@c0@"
  it: "@aJohn Travolto@bDirei proprio che ti meriti una bella ricompensa.\nProva a guardare in quel mobile...\n@c0@"
  ja: "@a@b＊「おお　坊やは\n\t洞くつで　会った……。\n\tあのときは　世話になったな。\n@c0@"
219:
  de: "@aHerr Unterlieger@bHat dir schon mal jemand gesagt, dass du einen wirklich gütigen Blick hast? Es ist wie Magie. Wenn du mich ansiehst, hebt sich meine Stimmung!\n@c0@"
  en: "@aMr Rockefeller@bHas anyone ever told you that you've got really kind eyes? It's like magic.\r\nOne look from you and my spirits soar!\n@c0@"
  es: "@aSr. Roca@b¿Alguna vez te han dicho que tienes ojos de persona amable? Es casi mágico.\r\n¡Con solo mirarme me levantas el ánimo!\n@c0@"
  fr: "@aGauthier Krazé@bOn ne t'a jamais dit que tu avais un regard plein de bontéⓡ C'en est magique. Un seul regard de toi et je retrouve le moralⓠ\n@c0@"
  it: "@aJohn Travolto@bTi ha mai detto nessuno che hai degli occhi particolarissimi?\nSembrano quasi... magici!\n@c0@"
  ja: "@a@b＊「お礼に　いい物をあげよう。\n\tそこのタンスを\n\tしらべてごらん。\n@c0@"
220:
  de: "@a@b*: Du bist hier! Aber ich war zuerst da!\nIch heiße Zuckerchen. Ich bin eine Fee!\n@c0@"
  en: "@a@b*: You came! But I beat you!\nMy name's Honey. I'm a faerie!\n@c0@"
  es: "@a@b*: ¡Has venido! ¡Pero te he ganado!\r\nMe llamo Dulce. ¡Soy un hada!\n@c0@"
  fr: "@a@b*ⓢ Tu es venuⓠ Mais c'était moi la premièreⓠ\nJe m'appelle Candy. Je suis une féeⓠ\n@c0@"
  it: "@a@b*: Eccoti qui! Ma io ho fatto prima di te!\nTi ho battuto! Tee eh eh!\nIl mio nome è Amandina.\n@c0@"
  ja: "@a@b＊「坊やは　やさしい目をしてるな。\n\t坊やに見つめられると\n\t心がなごむようだ……。\n@c0@"
221:
  de: "@aZuckerchen@bAber unser Land ⓚⓛ unsere magische Feenwelt ⓚⓛ ist in schrecklicher Gefahr.\n@c0@"
  en: "@aHoney@bBut our land ⓚⓛ our magical, faerie land ⓚⓛ is in terrible danger.\n@c0@"
  es: "@aDulce@bPero nuestro país, nuestro mágico país, corre un terrible peligro.\n@c0@"
  fr: "@aCandy@bNotre pays, notre pays magique et féerique, court un terrible danger.\n@c0@"
  it: "@aAmandina@bEcco, ti ho fatto venire qui per dirti una cosa...\nLa mia terra, il meraviglioso Regno delle Fate, è in pericolo.\n@c0@"
  ja: "@a@b＊「来てくれたのね！\n\t私は　エルフのベラ。\n@c0@"
222:
  de: "@aZuckerchen@bDeshalb hat man mich in die Welt der Menschen geschickt. Um Hilfe zu holen. Aber hier ignorieren mich alle.\n@c0@"
  en: "@aHoney@bThat's why I was sent to the human world: to find help. But everyone here's been ignoring me.\n@c0@"
  es: "@aDulce@bPor eso me han enviado al mundo de los humanos: para encontrar ayuda. Pero aquí nadie me hace caso.\n@c0@"
  fr: "@aCandy@bC'est pour ça que j'ai été envoyée dans le monde des humains. Pour chercher de l'aide. Mais ici, tout le monde m'a ignorée.\n@c0@"
  it: "@aAmandina@bSono stata inviata nel mondo degli esseri umani per cercare aiuto, ma non riesco a farmi vedere da nessuno!\n@c0@"
  ja: "@a@bベラ「じつは　私たちの国が\n\t大変なのっ！\n@c0@"
223:
  de: "@aZuckerchen@bHi hi hi! Ich hab den Leuten sogar ein paar Streiche gespielt, damit sie mich bemerken.\n@c0@"
  en: "@aHoney@bTee hee hee! I even played a few tricks on people so they'd have to take notice of me.\n@c0@"
  es: "@aDulce@b¡Ji, ji, ji! Hasta he gastado unas cuantas bromas a la gente para que se fijase en mí.\n@c0@"
  fr: "@aCandy@bTi-hi-hiⓠ J'ai même joué quelques tours aux gens pour les obliger à me remarquer.\n@c0@"
  it: "@aAmandina@bTee eh eh!\nHo anche fatto un bel po' di scherzetti in giro per farmi notare!\n@c0@"
  ja: "@a@bベラ「それで　人間界に　助けを求めて\n\t来たのだけど　だれも\n\t私に　気がついてくれなくて……。\n@c0@"
224:
  de: "@aZuckerchen@bUnd es hat funktioniert! Schau, du bist gek...\n@c0@"
  en: "@aHoney@bAnd it worked! See, you came aloⓚⓛ\n@c0@"
  es: "@aDulce@b¡Y ha funcionado! ¡Porque tú has pod...!\n@c0@"
  fr: "@aCandy@bEt ça a marchéⓠ D'ailleurs, tu es venu seu...\n@c0@"
  it: "@aAmandina@bE la cosa ha funzionato!\nInfatti, ora tu sei qui, e...\n@c0@"
  ja: "@a@bベラ「気がついてほしくて\n\tいろいろ　イタズラもしたわ。\n@c0@"
225:
  de: "@aZuckerchen@bPssst! Da kommt jemand!\n@c0@"
  en: "@aHoney@bSsh! Someone's coming!\n@c0@"
  es: "@aDulce@b¡Sssh! ¡Alguien viene!\n@c0@"
  fr: "@aCandy@bChutⓠ Quelqu'un vientⓠ\n@c0@"
  it: "@aAmandina@bSsst!\nNon parlare!\nSta arrivando qualcuno!\n@c0@"
  ja: "@a@bベラ「そこへ　あなたが\n\t現われたってわけ。\n@c0@"
226:
  de: "@aLudwig@bIch war mir sicher, hier unten Stimmen gehört zu haben, also dachte ich mir, dass du mit jemandem spielst. Aber du bist alleine.\n@c0@"
  en: "@aPankraz@bI was sure I heard voices down here, so I thought you must be playing with someone.\r\nBut I see you're alone.\n@c0@"
  es: "@aTeudis@bEstaba seguro de haber oído voces aquí, así que pensaba que estabas jugando con alguien.\r\nPero ya veo que estás solo.\n@c0@"
  fr: "@aPetros@bJ'étais certain d'avoir entendu des voix là en bas et j'ai cru que tu jouais avec quelqu'un.\r\nMais tu es seul, on dirait.\n@c0@"
  it: "@aRussel@bHo sentito delle voci, e pensavo che stessi giocando con qualcuno dei tuoi amichetti, ma vedo che sei da solo...\n@c0@"
  ja: "@a@bベラ「シッ！　ちょっと　待って。\n\tだれか　来たみたいだわ……。\n@c0@"
227:
  de: "@aLudwig@bBrrr. Hier unten ist es bitterkalt.\nHör auf, Selbstgespräche zu führen, und komm nach oben, ehe du dir eine Erkältung holst.\n@c0@"
  en: "@aPankraz@bBrrr. It's freezing down here. Stop talking to yourself and come upstairs before you catch a cold.\n@c0@"
  es: "@aTeudis@bBrrr... Qué frío hace aquí abajo. Deja de hablar solo y sube antes de que pilles un resfriado.\n@c0@"
  fr: "@aPetros@bBrrr. Il gèle ici. Arrête de parler tout seul et remonte avant d'attraper froid.\n@c0@"
  it: "@aRussel@bBrrrrr! Senti che freddo che c'è qui sotto!\nForza, smetti di parlare da solo e sali su, prima di prenderti un raffreddore!\n@c0@"
  ja: "@a@bパパス「話し声がしたので\n\tだれかいるのかと思ったが\n\tお前ひとりか……。\n@c0@"
228:
  de: "@aZuckerchen@bHi hi! Es stimmt. Sonst kann mich niemand sehen.\n@c0@"
  en: "@aHoney@bTee hee! It's true. No one else can see me!\n@c0@"
  es: "@aDulce@b¡Ji, ji! Es verdad. ¡Nadie más me puede ver!\n@c0@"
  fr: "@aCandy@bTi-hi-hiⓠ C'est vrai, alors. Personne d'autre ne peut me voirⓠ\n@c0@"
  it: "@aAmandina@bTee eh eh! Hai visto?\nPer gli altri sono invisibile!\n@c0@"
  ja: "@a@bパパス「ここは　とても寒い。　\n\tひとり遊びも　そこそこにして　カゼを\n\tひかぬうちに　上がって来るのだぞ。\n@c0@"
229:
  de: "@aZuckerchen@bAlso, kommst du mit mir mit? In mein Land?\n@c0@"
  en: "@aHoney@bAnyway, will you come with me? To my land?\n@c0@"
  es: "@aDulce@bBueno, ¿vendrás conmigo a mi tierra?\n@c0@"
  fr: "@aCandy@bBon, alors... Tu veux bien venir avec moiⓡ Dans mon paysⓡ\n@c0@"
  it: "@aAmandina@bAllora?\nVuoi venire con me, nel mio regno?\n@c0@"
  ja: "@a@bベラ「やっぱり　ほかの人には\n\t私は見えないみたいね……。\n@c0@"
230:
  de: "@aZuckerchen@bDann wird Marmela dir alles erzählen.\n@c0@"
  en: "@aHoney@bThen Treacle will tell you everything.\n@c0@"
  es: "@aDulce@bAllí Miel te lo explicará todo.\n@c0@"
  fr: "@aCandy@bLà-bas, Mélissa t'expliquera tout.\n@c0@"
  it: "@aAmandina@bLì la nostra Adusya ti dirà tutto.\n@c0@"
  ja: "@a@bベラ「ともかく　私たちの国に\n\t来てくださる？\n@c0@"
231:
  de: "@aLudwig@bGuten Morgen, %a000090!\nDu hast dich heut Nacht im Bett hin- und hergewälzt. Hast du etwa schlecht geträumt?\n@c0@"
  en: "@aPankraz@bGood morning, %a000090!\nYou were restless in the night.\nDid you have a bad dream?\n@c0@"
  es: "@aTeudis@b¡Buenos días, %a000090!\nEsta noche estabas inquieto.\n¿Tenías pesadillas?\n@c0@"
  fr: "@aPetros@bBonjour, %a000090ⓠ\nTu t'es beaucoup agité, cette nuit.\nTu as fait un mauvais rêveⓡ\n@c0@"
  it: "@aRussel@bBen svegliato, %a000090!\nLa notte scorsa ti sei agitato parecchio nel sonno.\nHai avuto un incubo, forse?\n@c0@"
  ja: "@a@bベラ「そして　くわしい話は\n\tポワンさまから聞いて！\n@c0@"
232:
  de: "@aLudwig@bWas? Die Feen stecken im Schlamassel? Ha ha ha! Du träumst wohl noch, mein Junge!\n@c0@"
  en: "@aPankraz@bWhat? The faeries are in trouble?\nAh ha ha! You're still half asleep, my lad!\n@c0@"
  es: "@aTeudis@b¿Qué? ¿Que las hadas tienen problemas?\r\n¡Ja, ja, ja! ¡Aún estás medio dormido, chaval!\n@c0@"
  fr: "@aPetros@bCommentⓡ Les fées ont des ennuisⓡ\nHa ha haⓠ Tu dors encore à moitié, mon bonhommeⓠ\n@c0@"
  it: "@aRussel@bChe cosa?! Il regno delle fate è in pericolo?!\nAh ah ah!\nCredo che tu stia ancora sognando!\n@c0@"
  ja: "@a@bパパス「おはよう　%a000090。\n\tずいぶん　うなされていたが\n\t悪い夢でも　見たのか？\n@c0@"
233:
  de: "@aLudwig@bEs gibt da ein paar Dinge, um die ich mich kümmern muss, also bleibe ich heute zu Hause. Geh du ruhig spielen. Aber bleib im Dorf, ja?\n@c0@"
  en: "@aPankraz@bI've some things I need to look into, so I'll be staying in today. You go off and play. But stay in town, you hear?\n@c0@"
  es: "@aTeudis@bTengo algunos asuntos que resolver aquí, así que hoy no voy a salir. Sal tú a jugar. Pero no abandones la ciudad, ¿me oyes?\n@c0@"
  fr: "@aPetros@bJ'ai une ou deux choses à faire, alors je vais rester à la maison, aujourd'hui. Tu peux aller jouer. Mais reste dans le village, d'accordⓡ\n@c0@"
  it: "@aRussel@bHo alcune cose importanti da fare oggi.\nVai pure a giocare, ma non uscire dal villaggio.\nCi siamo capiti?\n@c0@"
  ja: "@a@bパパス「なに？\n\t妖精の国が　大変だと？\n\tわっはっは　ねぼけているな。\n@c0@"
234:
  de: "@aSancho@bHe, Chico. Wieso du siehst so traurig aus, hm?\n@c0@"
  en: "@aSancho@bEh, friend. Why you looking eso esad, uh?\n@c0@"
  es: "@aSancho@b¡Eh!, chamaco. Pareces triste, nomásⓓ ¿qué te sucede?\n@c0@"
  fr: "@aSancho@bHé, niño. P-Pourquoi as-tu l'air si triste, dis-moiⓡ\n@c0@"
  it: "@aSancho@b¿Chico, por qué hai quell'expresión così tristes?\n@c0@"
  ja: "@a@bパパス「父さんは　調べることがあるので\n\t今日は家にいるが　お前も\n\t村の外に出たり　しないようにな。\n@c0@"
235:
  de: "@aSancho@bIss weiß, hier ist es langweilig, aber dein Papá muss wisstige Sachen erledigen. Stör ihn dabei nisst, ja?\n@c0@"
  en: "@aSancho@bI know ees boring here, but your papá, he has important theengs he must do.\r\nYou no get een hees way, okay?\n@c0@"
  es: "@aSancho@bYa sé que este sitio es reteaburrido, pero tu apá tiene cosas importantes que hacer. No le fastidies, ¿eh?\n@c0@"
  fr: "@aSancho@bJe sais que t-tu t'ennuies ici, mais ton papá a des choses importantes à faire. Ne le d-dérange pas,\nde acuerdoⓡ\n@c0@"
  it: "@aSancho@bYo so que te annoi aquí, ma tuo padre oggi está occupato.\nCerca de no disturbarlo.\n@c0@"
  ja: "@a@bサンチョ「おや　坊っちゃん\n\tなんだか　うかない顔を\n\tしてますね。\n@c0@"
236:
  de: "@a@b*: Das ist ja seltsam. Die komische Nachricht in meinem Gästebuch ist verschwunden.\n@c0@"
  en: "@a@b*: That's strange. The funny message in my guest book has disappeared.\n@c0@"
  es: "@a@b*: Qué extraño. Ha desaparecido ese mensaje raro de mi libro de huéspedes.\n@c0@"
  fr: "@a@b*ⓢ C'est étrange. Le drôle de message dans mon livre d'or a disparu.\n@c0@"
  it: "@a@b*: Ma non è possibile!\nIl messaggio che era comparso nel mio quaderno è sparito!\n@c0@"
  ja: "@a@bサンチョ「たいくつ　でしょうが\n\tお父上の　ジャマをしては\n\tいけませんよ。\n@c0@"
237:
  de: "@a@b*: Was um alles in der Welt ist hier los?\n@c0@"
  en: "@a@b*: What in the world is goin' on!?\n@c0@"
  es: "@a@b*: ¿Qué demonios está pasando?\n@c0@"
  fr: "@a@b*ⓢ Qu'est-ce qui se passe ici, bon sangⓡⓐ\n@c0@"
  it: "@a@b*: Che accidenti sta succedendo qui, eh?!\n@c0@"
  ja: "@a@b＊「ありゃりゃ　宿帳の\n\tいたずら書きが　いつの間にか\n\t消えてるぞ。\n@c0@"
238:
  de: "@a@b*: Im Dorf hält sich gerade ein seltsamer Kerl auf, der ein ziemliches Aufsehen erregt.\n@c0@"
  en: "@a@b*: There's a funny fella in the village at the moment who's causin' quite a stir.\n@c0@"
  es: "@a@b*: Hay un tipo raro en el pueblo que está causando sensación.\n@c0@"
  fr: "@a@b*ⓢ Il y a un drôle de type dans le village, en ce moment, et ça crée pas mal d'agitation.\n@c0@"
  it: "@a@b*: Al villaggio è arrivato uno strano tipo dall'aria poco raccomandabile.\n@c0@"
  ja: "@a@b＊「いったい　何だったんだろ？\n@c0@"
239:
  de: "@a@b*: Und es geht das Gerücht um, dass ein böses Wesen hinter Ludwig her ist.\n@c0@"
  en: "@a@b*: And there are rumours that there's someone bad out to get Pankraz.\n@c0@"
  es: "@a@b*: Y se dice por ahí que hay un sujeto realmente malvado que va a por Teudis.\n@c0@"
  fr: "@a@b*ⓢ Et des rumeurs racontent qu'une personne mal intentionnée recherche Petros.\n@c0@"
  it: "@a@b*: E corre anche voce che qualche furfante voglia fare del male a Russel.\n@c0@"
  ja: "@a@b＊「近頃　村に　変なヤツが来て\n\tいろいろと　かぎまわってる\n\tようなのだ。\n@c0@"
240:
  de: "@a@b*: Pass also gut auf dich auf, hm, Junge?\n@c0@"
  en: "@a@b*: Make sure you watch your back, eh, boy?\n@c0@"
  es: "@a@b*: Ándate con mucho ojo, ¿vale, chico?\n@c0@"
  fr: "@a@b*ⓢ Surveille bien tes arrières, surtout, petitⓠ\n@c0@"
  it: "@a@b*: Ragazzino, cerca di fare attenzione.\nMolta attenzione!\n@c0@"
  ja: "@a@b＊「パパスさんが　何者かに\n\tねらわれてるって　ウワサも\n\t聞くし……\n@c0@"
241:
  de: "@a@b*: Mein Vater hat das Glas gefunden, das ihm abhanden gekommen war. Doch das, wonach Ludwig sucht, ist wohl nicht so leicht zu finden.\n@c0@"
  en: "@a@b*: My old man found the glass he was after, but it doesn't look like the thing Pankraz is lookin' for is so easily found.\n@c0@"
  es: "@a@b*: Mi viejo encontró el cristal que buscaba, pero no parece que Teudis esté buscando algo tan fácil de encontrar.\n@c0@"
  fr: "@a@b*ⓢ Mon vieux père a trouvé le verre qu'il cherchait, mais on dirait que ce que cherche Petros est moins facile à trouver.\n@c0@"
  it: "@a@b*: Mio padre ha trovato il bicchiere che stava cercando. Volesse il cielo che anche Russel fosse tanto fortunato nella sua ricerca...\n@c0@"
  ja: "@a@b＊「坊やも　気をつけるんだよ。\n@c0@"
242:
  de: "@a@b*: Ich hab gehört, dass es etwas mit einem legendären Helden zu tun hat oder so.\n@c0@"
  en: "@a@b*: I heard it was somethin' to do with a legendary hero or the like.\n@c0@"
  es: "@a@b*: Dicen que tiene algo que ver con no sé qué héroe legendario o algo así.\n@c0@"
  fr: "@a@b*ⓢ J'ai entendu dire que ça avait à voir avec un héros légendaire, ou quelque chose comme ça.\n@c0@"
  it: "@a@b*: Se non sbaglio, sta inseguendo qualcosa che ha a che fare con un eroe della leggenda, o roba del genere.\n@c0@"
  ja: "@a@b＊「おじさんが　探してたグラスは\n\t見つかったけど　パパスさんの\n\t探しものは　大変だねえ。\n@c0@"
243:
  de: "@a@b*: Tut mir leid! Was red' ich denn, wieso langweile ich ein Kind mit so 'nem Geschwätz für Erwachsene!\n@c0@"
  en: "@a@b*: Sorry! Listen to me, borin' a kid with grown-up stuff like that!\n@c0@"
  es: "@a@b*: ¡Lo siento! ¡No sé qué hago agobiándote con cosas de mayores!\n@c0@"
  fr: "@a@b*ⓢ Excuse-moiⓠ Voilà que j'ennuie un pauvre gosse avec des histoires de grandes personnesⓠ\n@c0@"
  it: "@a@b*: Oh, scusami.\nNon volevo annoiarti con questi discorsi da adulti.\n@c0@"
  ja: "@a@b＊「なんでも\n\t伝説の勇者ってヤツを\n\t探してるとか……。\n@c0@"
244:
  de: "@a@b*: Hallo. Was hast du denn da Schönes? Das sieht ja interessant aus.\n@c0@"
  en: "@a@b*: Hello. That's an interesting-looking gem you've got there.\n@c0@"
  es: "@a@b*: Hola. Esa joya que llevas ahí parece interesante.\n@c0@"
  fr: "@a@b*ⓢ Bonjour.\nC'est une pierre intéressante que tu as là.\n@c0@"
  it: "@a@b*: Salve!\nChe bella pietra che hai lì...\n@c0@"
  ja: "@a@b＊「おっと　坊やには\n\tむずかしい話だったかな。\n@c0@"
245:
  de: "@a@b*: Es ist eine Goldkugel, sagst du?\n@c0@"
  en: "@a@b*: It's a gold orb, you say?\n@c0@"
  es: "@a@b*: ¿Dices que es un orbe de oro?\n@c0@"
  fr: "@a@b*ⓢ C'est un orbe d'or, dis-tuⓡ\n@c0@"
  it: "@a@b*: È un globo d'oro, vero?\n@c0@"
  ja: "@a@b＊「うん？　坊やは\n\tふしぎな　宝玉を\n\t持っているな。\n@c0@"
246:
  de: "@a@b*: Darf ich sie mir mal näher ansehen?\n@c0@"
  en: "@a@b*: Do you mind if I have a closer look?\n@c0@"
  es: "@a@b*: ¿Me dejas examinarlo más de cerca?\n@c0@"
  fr: "@a@b*ⓢ Tu veux bien que je le regarde de plus prèsⓡ\n@c0@"
  it: "@a@b*: Posso guardarlo più da vicino?\n@c0@"
  ja: "@a@b＊「そうか　ゴールドオーブって\n\t言うんだね。\n@c0@"
247:
  de: "@a@b%0%a000090 überreicht dem Mann die Goldkugel.\n@c0@"
  en: "@a@b%0%a000090 hands over the gold orb.\n@c0@"
  es: "@a@b%0%a000090 entrega el orbe de oro.\n@c0@"
