  ja: "@a@bサンチョ「なんと！　ただのカゼ！？\n\tそれは　ようございましたね。\n@c0@"
158:
  de: "@aSancho@bAh, si... Als Ihr weg wart, Señor, kam diese Brief hier für Euss.\n@c0@"
