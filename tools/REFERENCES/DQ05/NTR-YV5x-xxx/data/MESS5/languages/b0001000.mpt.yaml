  ja: "@a@bパパス「父さんは　調べることが\n\tあるので　今日は家にいるが……\n@c0@"
164:
  de: "@aLudwig@bBitte treibt euch nicht außerhalb des Dorfes herum. Verstanden?\n@c0@"
  en: "@aPankraz@bMake sure you don't go wandering off out of town. Understand?\n@c0@"
