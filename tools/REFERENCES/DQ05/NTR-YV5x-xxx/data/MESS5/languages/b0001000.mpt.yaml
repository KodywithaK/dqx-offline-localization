  fr: "@aComte Karpatt@bVooous avez traversé un étage très sombre, en venant ici, n'est-ce pasⓡ C'est là que se trouve la pièce où se tapit le chef des fantôôômes.\n@c0@"
  it: "@aConte De' Functis@bPer giuuungere qui %H0860%Xhai%Yavete%Z attraveeersato un'aaarea buuuia, non è veeero? Ebbeeene, quella è la stanza dooove si trooova il caaapo degli speeettri...\n@c0@"
