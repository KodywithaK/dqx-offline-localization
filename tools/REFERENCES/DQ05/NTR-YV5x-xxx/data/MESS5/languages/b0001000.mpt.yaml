  ja: "@a@bサンチョ「おはよう　坊っちゃん。\n@c0@"
166:
  de: "@aSancho@bWarst du das, Chico? Bist du derjenige, der mein Hackbrett versteckt hat?\n@c0@"
  en: "@aSancho@bWas eet you, friend? Are you the one who hide my chopping board esomewhere?\n@c0@"
  es: "@aSancho@b¿Has sido tú, chamaco? ¿Me escondiste en alguna parte mi tabla de cortar?\n@c0@"
