  ja: "@a@bサンチョ「ところで　坊っちゃんは\n\tまな板を　どこかにしまったり\n\tしませんよね。\n@c0@"
167:
  de: "@aSancho@bEs ist wirkliss seltsam. Irgendjemand spielt mir da einen Streiss...\n@c0@"
  en: "@aSancho@bEes very estrange. Esomeone ees playing games weeth me...\n@c0@"
