  de: "@aSancho@bIss habe mein Hackbrett in Kommode gefunden! Vielleisst du denkst jetzt, dass der Onkel Sancho ein wenig loco wird, was?\n@c0@"
  en: "@aSancho@bI find my chopping board een the chest of drawers! Maybe you theenk your Uncle Sancho, he ees going loco, eh?\n@c0@"
  es: "@aSancho@b¡Mi tabla de cortar estaba en la cómoda! Pues igual creías que a tu tito Sancho se le había zafado un tornillo ¿eh?\n@c0@"
  fr: "@aSancho@bJ'ai retrouvé ma plancha à découper dans oun t-tiroirⓠ Tu dois penser que tonton Sancho devient loco, heinⓡ\n@c0@"
  it: "@aSancho@bHo trovato el mio tagliere nella cassettieras...\r\n¿Que dices?\r\n¿Lo zio Sancho está diventando loco, eh?\n@c0@"
  ja: "@a@bサンチョ「なんと　まな板が\n\tタンスの中から\n\t見つかったんですよ。\n@c0@"
169:
  de: "@aSancho@bNein, nein, nein. Irgendjemand hat mir eine Streiss gespielt...\n@c0@"
  en: "@aSancho@bNo, no, no. Esomeone ees playing games weeth me...\n@c0@"
