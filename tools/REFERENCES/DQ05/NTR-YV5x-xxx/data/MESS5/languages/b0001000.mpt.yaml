  ja: "@a@bエリック「ゴーストのボスは　４階の\n\t玉座の間におり　まわりを\n\t魔界のゆうれいたちが　守っている。\n@c0@"
58:
  de: "@aGraf Krypto@bDuuu bist auf dem Weg hierher durch ein sehr duuunkles Stockwerk gekommen, ja? Dort lauert der Anführer.\n@c0@"
