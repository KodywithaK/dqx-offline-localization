  fr: "@a@b*ⓢ Nous allons bientôt arriver au port du Petit Havre. Mais il n'y a pas grand-chose d'intéressant, là-bas, tu sais.\n@c0@"
  it: "@a@b*: Tra breve attraccheremo a Cala Disorte, un villaggio piccolo e tranquillo dove non succede mai niente di speciale.\n@c0@"
  ja: "@a@b＊「もうすぐ　ビスタの港だ。\n\tといっても　何もない\n\t小さい港なんだよ。\n@c0@"
