  it: "@a@b*: Quel discolo di mio figlio mi ha portato in casa un micio.\n@c0@"
  ja: "@a@b＊「うちの子ったら\n\t子ネコなんか拾ってきて……。\n@c0@"
307:
  de: "@a@b*: Ich hab ihm hundertmal gesagt, dass wir uns hier keine Katze halten können, aber er will nicht hören. Der Junge macht mir manchmal echt zu schaffen!\n@c0@"
  en: "@a@b*: I keep tellin' him we can't possibly keep a cat here, but he won't listen. He's a worry sometimes, that boy!\n@c0@"
  es: "@a@b*: Siempre le digo que no podemos tener un gato aquí, pero no me hace ni caso. ¡Este chico es un dolor de muelas!\n@c0@"
  fr: "@a@b*ⓢ Je n'arrête pas de lui dire qu'on ne peut pas garder un chat ici, mais il n'écoute rien.\nParfois, il me donne vraiment du souci, ce gosseⓠ\n@c0@"
  it: "@a@b*: Gli ho detto che non abbiamo spazio per un gatto, ma non vuole saperne di ascoltarmi!\nForse dovrei ripeterglielo con il battipanni...\n@c0@"
  ja: "@a@b＊「捨ててきなさいって　言っても\n\tちっともきかないし……。\n\tこまったものだわ！\n@c0@"
308:
  de: "@aLudwig@bDu warst aber lange weg, %a000090. Es gibt gute Neuigkeiten: Der alte Weißi hat nur eine Erkältung.\n@c0@"
  en: "@aPankraz@bYou've been a while, %a000090. The good news is that old Whitey just has some sort of cold or other.\n@c0@"
  es: "@aTeudis@bHas tardado bastante, %a000090. Pero hay buenas noticias: parece que el viejo Doptada no tiene más que un catarro.\n@c0@"
  fr: "@aPetros@bÇa fait un moment que tu étais parti, %a000090. La bonne nouvelle, c'est que ce vieux Al n'avait qu'un rhume, ou quelque chose du genre.\n@c0@"
  it: "@aRussel@bFinalmente sei tornato, %a000090.\nHai saputo la bella notizia? Il caro Whitblanche aveva un semplice raffreddore!\n@c0@"
  ja: "@a@bパパス「待たせたな　%a000090。\n\tダンカンの病気は　どうやら\n\tただのカゼらしい。\n@c0@"
309:
  de: "@aLudwig@bWir sollten uns wohl überlegen, langsam nach Steinach zurückzukehren.\n@c0@"
  en: "@aPankraz@bI suppose we'd better start thinking about making tracks for Whealbrook.\n@c0@"
  es: "@aTeudis@bDeberíamos empezar a pensar en regresar a Arroyofrío.\n@c0@"
  fr: "@aPetros@bJe crois qu'on ferait bien de penser à rentrer à Ruycelieu, maintenant.\n@c0@"
  it: "@aRussel@bDirei che ora possiamo tornare a Valcava.\n@c0@"
  ja: "@a@bパパス「さて　そろそろ\n\tサンタローズの村に\n\t帰ることにしよう！\n@c0@"
310:
  de: "@aFrau Weißner@bDu willst doch nicht etwa schon gehen, Ludwig!\n@c0@"
