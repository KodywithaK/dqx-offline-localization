  ja: "@a@b＊「オイラも　このストレンジャー号みたいに\n\tでかい船を　持ってみたいもんだよ。\n@c0@"
59:
  de: "@a@b*: Ich weiß gar nicht, wieso ich dir das erzähle. Als ob du mir helfen könntest! Ignorier mich einfach.\n@c0@"
  en: "@a@b*: I don't know why I'm telling you that, though.\r\nLike you could be of any help! Just ignore me.\n@c0@"
  es: "@a@b*: No sé por qué te cuento esto.\r\n¡Como si pudieses ayudarme! Bah, no me hagas caso.\n@c0@"
  fr: "@a@b*ⓢ Enfin, je ne sais pas pourquoi je te raconte ça.\nComme si tu y pouvais quelque choseⓠ\nNe fais pas attention à moi.\n@c0@"
  it: "@a@b*: Ah, scusami. Stavo solo pensando ad alta voce.\nSenti, non avresti mica una nave da regalarmi, eh?\nAh ah ah!\n@c0@"
  ja: "@a@b＊「と　坊やに　こんなことを\n\tいっても　しかたがなかったな。\n\tごめん　ごめん。\n@c0@"
60:
  de: "@a@b*: Wir werden nach diesem hier einen anderen Hafen ansteuern, also müssen wir dir jetzt leider Lebewohl sagen.\n@c0@"
  en: "@a@b*: We're off to another port after this one, so this is where we'll bid you farewell.\n@c0@"
  es: "@a@b*: Después de hacer escala aquí vamos a otro puerto. Aquí nos decimos adiós.\n@c0@"
  fr: "@a@b*ⓢ Nous allons repartir vers un autre port, après celui-ci. C'est donc ici qu'on se dit au revoir.\n@c0@"
  it: "@a@b*: Presto salperemo per raggiungere la nostra prossima meta, quindi è arrivato il momento di salutarsi.\n@c0@"
  ja: "@a@b＊「オレたちは　このあと\n\t別の港に　向かうから\n\tここで　お別れだな……。\n@c0@"
61:
  de: "@a@b*: Wir sind angekommen.\nUnd auch noch pünktlich.\n@c0@"
  en: "@a@b*: We seem to have arrived.\r\nAnd on time, thankfully.\n@c0@"
  es: "@a@b*: Parece que hemos llegado.\r\nY a tiempo, menos mal.\n@c0@"
  fr: "@a@b*ⓢ On est arrivés, on dirait.\nEt à l'heure, fort heureusement.\n@c0@"
  it: "@a@b*: Siamo arrivati. Sani, salvi e in tempo.\nCosa potremmo chiedere di più?\n@c0@"
  ja: "@a@b＊「どうやら　お着きになって\n\tおられるようだな。\n\t間に合って　よかった。\n@c0@"
62:
  de: "@a@b*: Hm? Wer das da ist, der dort am Hafen steht? Oh ja! Ist vermutlich das erste Mal, dass du und Ludwig ihm begegnet.\n@c0@"
  en: "@a@b*: Hm? Who's that standing at the port? Oh yes!\r\nI suppose this is the first time you and Pankraz\r\nwill have met him.\n@c0@"
  es: "@a@b*: ¿Mmm? ¿Que quién es ese que está en el muelle? ¡Ah, sí!\n㈡\n*: Supongo que es la primera vez que tú y Teudis lo veis.\n@c0@"
  fr: "@a@b*ⓢ Heinⓡ Qui c'est sur le quaiⓡ Ah, mais ouiⓠ\nJe suppose que c'est la première fois que vous allez le rencontrer, Petros et toi.\n@c0@"
  it: "@a@b*: Toh, guarda chi c'è sul molo!\r\nNon sai di chi sto parlando, vero? Scommetto che tu e Russel non l'avete mai incontrato...\n@c0@"
  ja: "@a@b＊「うん？　港に立ってるのは　誰かだと？\n\tおお　そういえば　坊やもパパスどのも\n\tお会いするのは初めてであろう。\n@c0@"
63:
  de: "@a@b*: Das ist der Besitzer des Schiffes, Rodrigo Onassetti. Er wird nachher an Bord kommen und nach Hause segeln.\n@c0@"
  en: "@a@b*: That's the owner of the ship, Rodrigo Briscoletti. He's due to come aboard here and sail home.\n@c0@"
  es: "@a@b*: Es el propietario del barco, Santino Rimaldi. Tiene previsto subir a bordo y navegar de vuelta a su hogar.\n@c0@"
  fr: "@a@b*ⓢ C'est Rodrigo Oscuroni, le propriétaire du navire. Il doit embarquer pour qu'on le ramène chez lui.\n@c0@"
  it: "@a@b*: Quello è Rick Fosconi, il proprietario della nave.\nSi imbarcherà qui per far ritorno a casa.\n@c0@"
  ja: "@a@b＊「あれが　この船の持ち主の\n\tルドマンさまだ。　ここから船に乗って\n\tご自宅へ　お帰りになる予定なのだよ。\n@c0@"
64:
  de: "@a@b*: Es heißt, dass ihr zu zweit umherreist, du und dein Vater. Das ist schön.\n@c0@"
  en: "@a@b*: I hear that you and your father are travelling around together, just the two of you. That's nice.\n@c0@"
  es: "@a@b*: Tengo entendido que tu padre y tú viajáis juntos, los dos solos. ¡Qué bonito!\n@c0@"
  fr: "@a@b*ⓢ Il paraît que ton père et toi, vous voyagez ensemble, rien que tous les deux. C'est sympa.\n@c0@"
  it: "@a@b*: So che tu e tuo padre girate il mondo insieme.\nÈ una gran bella cosa...\n@c0@"
  ja: "@a@b＊「坊やは　お父さんと２人で\n\t旅をしているんだってね。\n@c0@"
65:
  de: "@a@b*: Der Kapitän sagt, dass der Besitzer dieses Schiffes selber schon viel reisen musste, um seine Tochter zu sehen.\n@c0@"
  en: "@a@b*: The Captain says the owner of this ship has had to do his fair share of travelling himself to go and meet his daughter.\n@c0@"
  es: "@a@b*: El capitán dice que el propietario del barco también ha tenido que viajar lo suyo para ir al encuentro de su hija.\n@c0@"
  fr: "@a@b*ⓢ D'après le capitaine, le propriétaire de ce navire a dû beaucoup voyager, lui aussi, pour retrouver sa fille.\n@c0@"
  it: "@a@b*: Il capitano mi ha raccontato che il proprietario della nave ha affrontato un lungo viaggio per andare a prendere le sue figlie.\n@c0@"
  ja: "@a@b＊「船長に聞いた話じゃ\n\tこの船の持ち主も　おじょうさんを\n\t迎えるため　旅をしていたそうだよ。\n@c0@"
66:
  de: "@a@b*: Du verlässt uns schon, Junge? Na, hoffentlich wirst du uns nicht allzu sehr vermissen, was? Immer schön fröhlich bleiben!\n@c0@"
  en: "@a@b*: You're off, are you, laddie? Don't miss us too much now, will you? Keep a smile on your face, eh!\n@c0@"
  es: "@a@b*: Te vas, ¿verdad, chico? No nos eches mucho de menos, ¿vale? ¡Y no dejes de sonreír!\n@c0@"
  fr: "@a@b*ⓢ Tu t'en vas, petitⓡ On ne te manquera pas trop, j'espère. Et surtout, garde le sourire, heinⓠ\n@c0@"
  it: "@a@b*: Arrivederci, piccolo!\nSo che la mia cucina ti mancherà.\nCiao! Fai il bravo!\n@c0@"
  ja: "@a@b＊「そうか　お別れか……。\n\tさびしくなるな……。\n\t元気でな！\n@c0@"
67:
  de: "@aLudwig@bAlso haben wir endlich angelegt!\n@c0@"
  en: "@aPankraz@bSo we've docked at last!\n@c0@"
  es: "@aTeudis@b¡Bueno, por fin hemos atracado!\n@c0@"
  fr: "@aPetros@bAh, nous avons enfin accostéⓠ\n@c0@"
  it: "@aRussel@bFinalmente!\nSiamo arrivati!\n@c0@"
  ja: "@a@bパパス「そうか　港に着いたか！\n@c0@"
68:
  de: "@aLudwig@bEs ist bestimmt schon zwei Jahre her, dass wir zuletzt daheim im Dorf waren.\n@c0@"
  en: "@aPankraz@bIt must be two years now since we were last home at the village.\n@c0@"
  es: "@aTeudis@bDebe de hacer dos años desde la última vez que estuvimos en el pueblo.\n@c0@"
  fr: "@aPetros@bÇa doit bien faire deux ans maintenant que nous n'étions pas rentrés chez nous, au village. \n@c0@"
  it: "@aRussel@bErano due anni che mancavamo dal villaggio...\n@c0@"
  ja: "@a@bパパス「村に　もどるのは\n\tほぼ　２年ぶりだ……。\n@c0@"
69:
  de: "@aLudwig@bDu warst noch so klein, als wir aufgebrochen sind, %a000090, dass du dich wohl nicht mehr daran erinnerst.\n@c0@"
  en: "@aPankraz@bYou were so small when we left, %a000090, that I doubt you remember it very well at all.\n@c0@"
  es: "@aTeudis@bEras tan pequeño cuando partimos, %a000090, que dudo que recuerdes algo.\n@c0@"
  fr: "@aPetros@bTu étais si jeune quand nous sommes partis, %a000090, que je me demande même si tu t'en souviens.\n@c0@"
  it: "@aRussel@bQuando andammo via da qui eri davvero piccolo, %a000090. Non mi stupirei se tu non ricordassi nulla di questo posto...\n@c0@"
  ja: "@a@bパパス「%a000090は\n\tまだ　小さかったから\n\t村のことを　おぼえていまい。\n@c0@"
70:
  de: "@aLudwig@bAlso gut. Sollen wir dann mal?\n@c0@"
  en: "@aPankraz@bRight then. Ready for the off?\n@c0@"
  es: "@aTeudis@bDe acuerdo entonces. ¿Estás listo para desembarcar?\n@c0@"
  fr: "@aPetros@bBon. Prêt pour le départⓡ\n@c0@"
  it: "@aRussel@bAllora, sei pronto per scendere a terra?\n@c0@"
  ja: "@a@bパパス「では　行くかっ！\n@c0@"
71:
  de: "@aLudwig@bVergewissere dich, dass du nichts vergessen hast, mein Sohn, ja?\n@c0@"
  en: "@aPankraz@bMake sure you haven't left anything behind,\r\nwon't you, son?\n@c0@"
  es: "@aTeudis@bComprueba que no te has olvidado de nada, hijo.\n@c0@"
  fr: "@aPetros@bFais attention à ne rien oublier sur le bateau, d'accord fistonⓡ\n@c0@"
  it: "@aRussel@bFigliolo, sei sicuro di aver preso tutto?\nNon è che dimentichi qualcosa?\n@c0@"
  ja: "@a@bパパス「%a000090。\n\t忘れ物を　しないよう\n\tじゅんびするんだぞ。\n@c0@"
72:
  de: "@aKäpt'n Kummerlos@bNun ist der Augenblick gekommen, da wir uns voneinander verabschieden müssen, Junge. Bitte denk ab und zu an mich, ja?\n@c0@"
  en: "@aCap'n Blithe@bIt looks like it's time for us to bid each other\r\nfarewell then, boy. Spare me a thought every\r\nonce in a while, eh?\n@c0@"
  es: "@aCapitán Pancho@bParece que ha llegado el momento de que nos despidamos, muchacho. Piensa en mí de vez en cuando, ¿eh?\n@c0@"
  fr: "@aCapitaine Stubine@bJe crois que l'heure est venue de nous dire au revoir, mon garçon. Aie une petite pensée pour moi de temps en temps, d'accordⓡ\n@c0@"
  it: "@aCapitan Melostompo@bCiao, piccoletto! Spero di rivederti un giorno.\nE non dimenticarti del tuo amico capitan Melostompo!\n@c0@"
  ja: "@a@b船長「坊や　ここで　お別れだが\n\tたまには　このオジサンのことも\n\t思い出してくれよっ。\n@c0@"
73:
  de: "@aLudwig@bWir gehen gleich von Bord, %a000090.\n@c0@"
  en: "@aPankraz@bWe'll be disembarking in a minute, %a000090.\n@c0@"
  es: "@aTeudis@bVamos a desembarcar enseguida, %a000090.\n@c0@"
  fr: "@aPetros@bNous allons descendre sur le quai d'ici une minute, %a000090.\n@c0@"
  it: "@aRussel@bTra un attimo sbarcheremo, %a000090.\n@c0@"
  ja: "@a@bパパス「さてと　そろそろ\n\t港におりるとするか　%a000090。\n@c0@"
74:
  de: "@aLudwig@bWer ist der Herr, der dort darauf wartet, das Schiff betreten zu können, Käpt'n?\n@c0@"
  en: "@aPankraz@bWho's that there waiting to get on the ship, Captain?\n@c0@"
  es: "@aTeudis@b¿Quién es ese que espera para subir al barco, capitán?\n@c0@"
  fr: "@aPetros@bCapitaine, qui est l'homme qui attend pour monter sur le bateauⓡ\n@c0@"
  it: "@aRussel@bCapitano, chi è la persona che deve salire a bordo?\n@c0@"
  ja: "@a@bパパス「おや？　船長。\n\tどなたか　船に\n\t乗り込まれるようだな。\n@c0@"
75:
  de: "@aKäpt'n Kummerlos@bAh! Herr Onassetti!\nIch hoffe, dass Ihr nicht allzu lange warten musstet.\n@c0@"
  en: "@aCap'n Blithe@bAh! Mr Briscoletti!\r\nI hope you haven't been waiting too long.\n@c0@"
  es: "@aCapitán Pancho@b¡Ah! ¡Don Rimaldi!\r\nNo le habremos hecho esperar demasiado, ¿verdad?\n@c0@"
  fr: "@aCapitaine Stubine@bAh, Monsieur Oscuroniⓠ\nJ'espère que vous n'avez pas trop attendu.\n@c0@"
  it: "@aCapitan Melostompo@bSalve, mister Fosconi.\nSpero non stia aspettando da troppo tempo.\n@c0@"
  ja: "@a@b船長「おお！　ルドマンさま。\n\tお待たせいたしました！\n@c0@"
76:
  de: "@aRodrigo Onassetti@bAh, Reisende!\nIch muss mich für das Verhalten meiner Tochter entschuldigen.\n@c0@"
  en: "@aMr Briscoletti@bAh, travellers, I see.\r\nI must apologise for my daughter's behaviour.\n@c0@"
  es: "@aDon Rimaldi@b¡Ah!, viajeros, comprendo. ¡Bene, bene!\r\nScusi per el comportamiento de la mia figlia.\n@c0@"
  fr: "@aRodrigo Oscuroni@bAh, des voyageurs, on dirait. Je vous prie de\r\nbien vouloir excuser l'attitude de ma fille.\n@c0@"
  it: "@aRick Fosconi@bAh, dei viaggiatori...\nMi scuso per comportamento di my figlia...\n@c0@"
  ja: "@a@b＊「いやいや　娘が　\n\t失礼いたしました　旅のお方。\n@c0@"
77:
  de: "@aRodrigo Onassetti@bUnd hier ist der Maestro des Schiffes!\n@c0@"
  en: "@aMr Briscoletti@bAnd here's the maestro of the vessel!\n@c0@"
  es: "@aDon Rimaldi@b¡Y aquí está el capitano del buque!\n@c0@"
  fr: "@aRodrigo Oscuroni@bEt voici le maestro du navireⓠ\n@c0@"
  it: "@aRick Fosconi@bEcco nostro bravo capitano...\n@c0@"
  ja: "@a@b＊「ごくろうだったな　船長。\n@c0@"
78:
  de: "@aKäpt'n Kummerlos@bSchön, Euch wiederzusehen, Herr Onassetti. Eurem Gesichtsausdruck nach zu schließen hattet Ihr eine vergnügliche Reise!\n@c0@"
  en: "@aCap'n Blithe@bGood to see you again, Mr Briscoletti.\r\nJudging by the look on your face,\r\nI'd say you've had an enjoyable trip!\n@c0@"
  es: "@aCapitán Pancho@bMe alegro de verle de nuevo, don Rimaldi.\r\n¡Por su aspecto, diría que ha tenido un buen viaje!\n@c0@"
  fr: "@aCapitaine Stubine@bContent de vous revoir, Monsieur Oscuroni.\nSi j'en juge par votre mine, vous avez fait bon voyage, semble-t-ilⓠ\n@c0@"
  it: "@aCapitan Melostompo@bChe piacere rivederla, mister Fosconi!\nA giudicare dal suo sorriso, direi che le cose le vanno bene.\n@c0@"
  ja: "@a@b船長「お帰りなさいませ　ルドマンさま！\n\tそのご様子では　今回の旅は\n\tすばらしいものだったようですな。\n@c0@"
79:
  de: "@aRodrigo Onassetti@bEin Lächeln ist das Zeichen eines Mannes, der gut isst! Nun erlaubt mir, Euch meine Töchter vorzustellen.\n@c0@"
  en: "@aMr Briscoletti@bA smile shows a man is eating well!\nNow, allow me to introduce my daughters...\n@c0@"
  es: "@aDon Rimaldi@b¡Un hombre con el estómago pieno siempre sonríe!\r\nAllora, permítame presentarle a mis hijas.\n@c0@"
  fr: "@aRodrigo Oscuroni@bLe sourire est la preuve qu'un homme mange\nà sa faimⓠ Permettez-moi de vous présenter\nmes filles.\n@c0@"
  it: "@aRick Fosconi@bIl sorriso di un man depende da successo in sua vita e da felicità di sua family. Good, ora ti presento my splendide figlie.\n@c0@"
  ja: "@a@bルドマン「もちろんだよ　船長。\n\tさあ　わしの娘を　紹介しよう！\n@c0@"
80:
  de: "@aRodrigo Onassetti@bNera, komm mal her zu Papa.\n@c0@"
  en: "@aMr Briscoletti@bNera, come here to papa.\n@c0@"
  es: "@aDon Rimaldi@bNera, ven con il tuo papino.\n@c0@"
  fr: "@aRodrigo Oscuroni@bNera, viens par ici, ma chérie.\n@c0@"
  it: "@aRick Fosconi@bNera, vieni qui da tuo papà.\n@c0@"
  ja: "@a@bルドマン「フローラや。\n\tこっちへ　あがっておいで。\n@c0@"
81:
  de: "@aRodrigo Onassetti@bOh, meine arme Bambina!\nIst die Stufe zu hoch für dich?\n@c0@"
  en: "@aMr Briscoletti@bOh, my poor bambina!\r\nIs the step too high for you?\n@c0@"
  es: "@aDon Rimaldi@b¡Oh, mi pobre bambina!\r\n¿El escalón es demasiado alto?\n@c0@"
  fr: "@aRodrigo Oscuroni@bOh, ma pauvre bambinaⓠ\nLa marche est trop haute pour toiⓡ\n@c0@"
  it: "@aRick Fosconi@bFiglia mia, che succede?\nQuesto gradino troppo alto per you, yes?\n@c0@"
  ja: "@a@bルドマン「おや？　フローラには\n\tこの入口は　高すぎたかな？\n@c0@"
82:
  de: "@aLudwig@bBitte gestatte mir, dir zu helfen, meine Kleine.\n@c0@"
  en: "@aPankraz@bAllow me to give you a hand, my dear.\n@c0@"
  es: "@aTeudis@bDeja que te ayude, bonita.\n@c0@"
  fr: "@aPetros@bLaisse-moi t'aider, petite demoiselle.\n@c0@"
  it: "@aRussel@bVieni qui, piccola. Ti aiuto io.\n@c0@"
  ja: "@a@bパパス「どれ　私が　手を\n\tかしましょう。\n@c0@"
83:
  de: "@aNera@bVielen Dank.\n@c0@"
  en: "@aNera@bThank you, sir.\n@c0@"
  es: "@aNera@bMuchas gracias, signore.\n@c0@"
  fr: "@aNera@bMerci Monsieur.\n@c0@"
  it: "@aNera@bGrazie, signore.\n@c0@"
  ja: "@a@bフローラ「あ　ありがとう……。\n@c0@"
84:
  de: "@aRodrigo Onassetti@bEin Reisender mit Manieren. Bene, bene!\n@c0@"
  en: "@aMr Briscoletti@bA traveller with manners. Good, good!\n@c0@"
  es: "@aDon Rimaldi@bUn viajero con buenos modales. ¡Bene, bene!\n@c0@"
  fr: "@aRodrigo Oscuroni@bUn voyageur bien élevé, de surcroît. Bene, beneⓠ\n@c0@"
  it: "@aRick Fosconi@bChe persona gentile!\nGood, good...\n@c0@"
  ja: "@a@bルドマン「これは　旅のお方\n\tありがとうございました。\n@c0@"
85:
  de: "@aRodrigo Onassetti@bAlora, meine Nera. Unsere Reise war sehr lange, länger als Linguine! Du musst erschöpft sein.\n@c0@"
  en: "@aMr Briscoletti@bNow, Nera. We've travelled further than a long piece of linguine. You must be exhausted.\n@c0@"
  es: "@aDon Rimaldi@bVamos, Nera. Hemos viajado más lejos que un lingüini extralungo. Debes de estar agotada.\n@c0@"
  fr: "@aRodrigo Oscuroni@bCara Nera. Nous avons fait un sacré bout de chemin. Tu dois être épuisée.\n@c0@"
  it: "@aRick Fosconi@bNera, figlia mia, nostro viaggio è stato very long.\nDevi essere molto stanca, yes?\n@c0@"
  ja: "@a@bルドマン「よしよし　フローラや。\n\t長旅でつかれたろう。\n@c0@"
86:
  de: "@aRodrigo Onassetti@bSei doch so gut und bring Nera in meine Suite, damit sie sich etwas ausruhen kann, ja?\n@c0@"
  en: "@aMr Briscoletti@bBe a good man and take Nera to my suite so she can get some rest, hm?\n@c0@"
  es: "@aDon Rimaldi@b¿Sería tan amabile de llevar a Nera al mio camarote para que pueda descansar un poco?\n@c0@"
  fr: "@aRodrigo Oscuroni@bAyez la gentillesse d'emmener Nera jusqu'à ma suite, pour qu'elle puisse s'y reposer, voulez-vousⓡ\n@c0@"
  it: "@aRick Fosconi@bPorta mia figlia nella cabina di lusso, così si arriposa uno poco.\nVa bene, yes?\n@c0@"
  ja: "@a@bルドマン「悪いが　フローラを\n\t奥の部屋に　連れていってやってくれ。\n@c0@"
87:
  de: "@a@b*: Wird sofort erledigt, Herr Onassetti!\n@c0@"
  en: "@a@b*: Right away, sir!\n@c0@"
  es: "@a@b*: ¡Enseguida, don Rimaldi!\n@c0@"
  fr: "@a@b*ⓢ Tout de suite, Monsieurⓠ\n@c0@"
  it: "@a@b*: Subito, signore!\n@c0@"
  ja: "@a@b＊「はい！　かしこまりました！\n@c0@"
88:
  de: "@aRodrigo Onassetti@bEs tut mir leid, wenn ich Euch aufgehalten habe, mein Herr.\nPrego, das Festland wartet auf Euch!\n@c0@"
  en: "@aMr Briscoletti@bMy apologies for holding you up, sir.\nPlease, terra firma awaits you!\n@c0@"
  es: "@aDon Rimaldi@bDisculpe que le haya retenido.\r\n¡La terra firme le aspetta!\n@c0@"
  fr: "@aRodrigo Oscuroni@bExcusez-moi de vous avoir retardé, Monsieur.\nJe vous en prie, la terra firma vous attendⓠ\n@c0@"
  it: "@aRick Fosconi@bGrazie per tua gentilezza, mister.\nPlease, passa pure.\n@c0@"
  ja: "@a@bルドマン「いや　おさわがせしました。\n\tさあ　港へどうぞ。\n@c0@"
89:
  de: "@a@b*: Meine Güte!\nIch habe ganz vergessen, alles blitzblank zu putzen!\n@c0@"
  en: "@a@b*: Dear me!\r\nI totally forgot to get everything clean and tidy!\n@c0@"
  es: "@a@b*: ¡Oh, vaya!\r\n¡Me he olvidado por completo de limpiar y ordenar!\n@c0@"
  fr: "@a@b*ⓢ Pauvre de moiⓠ\nJ'ai complètement oublié de tout nettoyerⓠ\n@c0@"
  it: "@a@b*: Ma dove ho la testa?! Ho dimenticato di fare pulizia!\n@c0@"
  ja: "@a@b＊「ひゃ～。\n\tうっかりして　お部屋のそうじを\n\tしておかなかったよ。\n@c0@"
90:
  de: "@aNera@bWer bist du?\nAch! Du reist also mit deinem Vater herum?\n@c0@"
  en: "@aNera@bWho are you?\r\nOh! You're travelling around with your father?\n@c0@"
  es: "@aNera@b¿Quién eres?\r\n¡Ah! ¿Viajas con tu papi?\n@c0@"
  fr: "@aNera@bQui es-tuⓡ\nOhⓠ Tu voyages avec ton pèreⓡ\n@c0@"
  it: "@aNera@bE tu chi sei? Come dici?\nViaggi insieme a tuo padre?\n@c0@"
  ja: "@a@bフローラ「あなた　だあれ？\n\tえ？　お父さんといっしょに\n\t旅してるの？\n@c0@"
91:
  de: "@aNera@bDas ist ja lustig. Ich bin auch mit meinem Vater hier.\nUnd mit meiner Schwester.\n@c0@"
  en: "@aNera@bThat's funny. I'm here with my father too.\r\nAnd my sister.\n@c0@"
  es: "@aNera@bEs curioso.\r\nYo también voy con mi papi.\r\nY con la mia sorella.\n@c0@"
  fr: "@aNera@bC'est amusant. Moi aussi je suis là avec mon père.\r\nEt ma sœur.\n@c0@"
  it: "@aNera@bAnch'io sto viaggiando con il mio papà!\nE c'è anche mia sorella con noi.\n@c0@"
  ja: "@a@bフローラ「わたしも　お父さまたちと\n\tいっしょに　来たのよ。\n@c0@"
92:
  de: "@aNera@bIch fürchte mich ein wenig vor dem Meer.\nEs ist so groooß!\n@c0@"
  en: "@aNera@bI'm a little bit scared of the sea.\r\nIt's just so big.\n@c0@"
  es: "@aNera@bEl mar me da mucho respeto.\r\nEs que es tan grande...\n@c0@"
  fr: "@aNera@bJ'ai quand même un petit peu peur de la mer.\nC'est tellement grand.\n@c0@"
  it: "@aNera@bPerò il mare mi fa paura...\nÈ così grande!\n@c0@"
  ja: "@a@bフローラ「海って　なんだか\n\t広くて　こわいのね。\n@c0@"
93:
  de: "@aRodrigo Onassetti@bEs tut mir leid, wenn ich dich aufgehalten habe, junger Mann.\nBitte gib gut acht auf deiner Reise.\n@c0@"
  en: "@aMr Briscoletti@bI'm sorry for delaying you, young man.\nTake care on your travels, now.\n@c0@"
  es: "@aDon Rimaldi@bDisculpa que te haya retenido, bambino.\r\nCuídate en tus viajes.\n@c0@"
  fr: "@aRodrigo Oscuroni@bPardon de t'avoir retardé, mon garçon.\nSois prudent dans tes voyages, surtout.\n@c0@"
  it: "@aRick Fosconi@bSorry che ho ti fatto aspettare, piccolo.\nFai un good viaggio, yes?\n@c0@"
  ja: "@a@bルドマン「坊や。　待たせて悪かったね。\n\t気をつけていくんだよ。\n@c0@"
94:
  de: "@aKäpt'n Kummerlos@bHa ha ha! Ich glaube, ich habe Herrn Onassetti noch nie so glücklich erlebt!\n@c0@"
  en: "@aCap'n Blithe@bHa ha ha! I don't think I've ever seen Mr Briscoletti look so happy!\n@c0@"
  es: "@aCapitán Pancho@b¡Ja, ja, ja! ¡Creo que nunca he visto a don Rimaldi tan contento!\n@c0@"
  fr: "@aCapitaine Stubine@bHa ha haⓠ J'ai rarement vu monsieur Oscuroni aussi heureuxⓠ\n@c0@"
  it: "@aCapitan Melostompo@bAh ah ah!\nNon credo di aver mai visto mister Fosconi tanto felice!\n@c0@"
  ja: "@a@b船長「はっはっは。　ルドマンさまの\n\tうれしそうな　お顔ときたら……。\n@c0@"
95:
  de: "@aKäpt'n Kummerlos@bNun ist der Augenblick gekommen, da wir uns voneinander verabschieden müssen, Junge. Bitte denk ab und zu an mich, ja?\n@c0@"
  en: "@aCap'n Blithe@bAnyway, it looks like it's time for us to bid each other farewell now, boy. Spare me a thought every once in a while, eh?\n@c0@"
  es: "@aCapitán Pancho@bBueno, en cualquier caso parece que ha llegado el momento de que nos despidamos, muchacho. Piensa en mí de vez en cuando, ¿eh?\n@c0@"
  fr: "@aCapitaine Stubine@bQuoi qu'il en soit, il est temps de nous dire au revoir, mon garçon. Aie une pensée pour moi de temps à autre, d'accordⓡ\n@c0@"
  it: "@aCapitan Melostompo@bPiccolo, è arrivato il momento di salutarsi! Spero che ogni tanto penserai al tuo amico capitan Melostompo!\r\nChe il vento soffi sempre in poppa per te!\n@c0@"
  ja: "@a@b船長「坊や。　ここで　お別れだが\n\tたまには　このオジサンのことも\n\t思い出してくれよっ。\n@c0@"
96:
  de: "@a@b*: Herr Onassetti ist zwar reich, aber das heißt nicht, dass er vergessen hat, was im Leben wirklich zählt. Er ist ein guter Mensch, weißt du.\n@c0@"
  en: "@a@b*: Mr Briscoletti may be rich, but it doesn't mean he's forgotten the important things in life.\r\nHe's a good man, you know.\n@c0@"
  es: "@a@b*: Puede que don Rimaldi sea rico, pero no se ha olvidado de lo que realmente importa en la vida.\r\nEs un buen hombre, ¿sabes?\n@c0@"
  fr: "@a@b*ⓢ Monsieur Oscuroni a beau être très riche, il n'a pas oublié ce qui est vraiment important dans la vie. C'est un brave homme, tu sais.\n@c0@"
  it: "@a@b*: Mister Fosconi è un uomo molto ricco, ma è anche una persona di sani principi. Lo ammiro molto, nonostante il suo accento... pittoresco!\n@c0@"
  ja: "@a@b＊「あれほどの　お金持ちなのに\n\tルドマンさまは　じつに\n\tよいお方だよ。\n@c0@"
97:
  de: "@a@b*: Seine Töchter werden wahrscheinlich als die glücklichsten Mädchen der Welt aufwachsen.\n@c0@"
  en: "@a@b*: His daughters will probably grow up to be the happiest girls in all the world.\n@c0@"
  es: "@a@b*: Cuando crezcan, probablemente sus hijas serán unas de las chicas más felices del mundo.\n@c0@"
  fr: "@a@b*ⓢ En grandissant, ses filles seront sans doute\nles plus heureuses du monde.\n@c0@"
  it: "@a@b*: Eh, sì...\nLe sue figlie sono ragazze molto fortunate!\n@c0@"
  ja: "@a@b＊「おじょうさまも　きっと\n\t世界一　幸せに　おなりだろう。\n@c0@"
98:
