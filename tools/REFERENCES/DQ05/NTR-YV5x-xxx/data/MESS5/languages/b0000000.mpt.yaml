  es: "@a@b%0%a000090 empuja la roca con todas sus fuerzas.\n@c0@"
  fr: "@a@b%0%a000090 pousse le rocher de toutes ses forces.\n@c0@"
  it: "@a@b%0%a000090 prova a spingere la roccia con tutte le sue forze...\n@c0@"
  ja: "@a@b%a000090は　チカラをこめて\n大きな岩を　押した！\n@c0@"
