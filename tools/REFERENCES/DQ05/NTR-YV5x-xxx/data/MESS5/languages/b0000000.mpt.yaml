  en: "@aPankraz@bAre you sure you've got everything, %a000090?\nYou've checked inside the drawers as well?\n@c0@"
  es: "@aTeudis@b¿Seguro que ya lo tienes todo, %a000090?\n¿Has mirado también en los cajones?\n@c0@"
  fr: "@aPetros@bTu es sûr d'avoir tout pris, %a000090ⓡ\nTu as bien vérifié dans les tiroirsⓡ\n@c0@"
  it: "@aRussel@bSei certo di non dimenticare niente, %a000090?\nHai controllato per bene dappertutto?\n@c0@"
  ja: "@a@bパパス「さあ　%a000090\n\t忘れ物は　ないか？\n\tタンスの中も　調べたな？\n@c0@"
99:
  de: "@aLudwig@bDann ist unsere Reise wohl zu Ende.\nBereit, von Bord zu gehen?\n@c0@"
