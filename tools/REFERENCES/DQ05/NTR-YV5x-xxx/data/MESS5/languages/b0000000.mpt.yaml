  it: "@aRussel@bAh ah ah!\nNon è tanto facile liberarsi del vecchio Russel, sai?\r\nSono una vecchia pellaccia, io!\n@c0@"
  ja: "@a@bパパス「わっはっはっ。\n\tやせても枯れても　このパパス\n\tおいそれとは　死ぬものか！\n@c0@"
104:
