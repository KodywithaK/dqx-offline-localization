  de: "@a@b*: Vergiss eins nich', ja? Jungs sollten nie schreien oder flennen, egal was passiert.\n@c0@"
  en: "@a@b*: Just remember this, eh? Boys should never be screamin' or cryin', no matter wot.\n@c0@"
