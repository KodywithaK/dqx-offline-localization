  es: "@a@b*: Pareces un chavalín muy despierto. Ni se te ocurra aventurarte fuera de la ciudad, ¿me oyes?\n@c0@"
  fr: "@a@b*ⓢ Tu m'as l'air d'avoir de la jugeote, petit. Alors ne va pas t'aventurer hors de la ville, entenduⓡ\n@c0@"
  it: "@a@b*: E %H0860%Xtu, piccolo, faresti%Yvoi, piccoli, fareste%Z meglio a non pensare nemmeno di uscire dal villaggio.\nMi sono spiegato?\n@c0@"
  ja: "@a@b＊「坊やみたいな元気な子が\n\t勝手に町の外に\n\t行ったりしないようにもな。\n@c0@"
290:
  de: "@a@b*: He! Was willst du? Siehst du nicht, dass wir gerade dabei sind, diese dumme Katze zu ärgern? Hau ab!\n@c0@"
  en: "@a@b*: Oi! What d'you want? Can't you see we're busy teasin' this stupid cat!? Get lost!\n@c0@"
  es: "@a@b*: ¡Eh! ¿Qué %H0860%Xquieres%Yqueréis%Z? ¿No %H0860%Xves%Yveis%Z que estamos ocupados chinchando a este estúpido gato? ¡Largo de aquí!\n@c0@"
  fr: "@a@b*ⓢ Quoiⓡ Qu'est-ce que tu veuxⓡ Tu ne vois pas qu'on joue avec cet idiot de chatⓠⓑ\nLaisse-nous tranquillesⓠ\n@c0@"
  it: "@a@b*: Beh? Cosa c'è da guardare?!\nCi stiamo divertendo un po' con questo gattino...\nQualcosa da ridire?!\n@c0@"
  ja: "@a@b＊「なんだよう！　今　こいつを\n\tいじめて遊んでるんだ！\n\tジャマすんなよなっ！\n@c0@"
291:
  de: "@a@b*: Ist 'ne ziemlich seltsame Katze, nich'? Ihr Schnurren ist richtig komisch!\n@c0@"
  en: "@a@b*: It's a pretty weird cat, en't it? Its purr's really funny.\n@c0@"
