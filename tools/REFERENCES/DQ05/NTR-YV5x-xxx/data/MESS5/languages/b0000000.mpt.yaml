303:
  de: "@a@b*: Hallo, Junge. Willst du hier mit deiner Freundin einen heben? Ha ha!\n@c0@"
  en: "@a@b*: Hello there, boy! Come for a booze with your girlfriend, have ya!? Ha ha ha!\n@c0@"
  es: "@a@b*: ¡Hola, chico! Vienes a tomarte un algo con tu novia, ¿no? ¡Ja, ja, ja!\n@c0@"
  fr: "@a@b*ⓢ Salut, petitⓠ Alors, on vient boire un coup avec sa copine, heinⓠⓑ Ha ha haⓠ\n@c0@"
  it: "@a@b*: Salve, piccoletto!\nSei venuto a bere una cioccolata calda con la tua fidanzatina? Ah ah ah!\n@c0@"
  ja: "@a@b＊「あら坊や！\n\t彼女を連れて　お酒を飲みに\n\t来たのかしら！？\n@c0@"
304:
  de: "@a@b*: Die ist ja echt niedlich! In ein paar Jährchen ist sie bestimmt ein richtiger Hingucker!\n@c0@"
  en: "@a@b*: She's not bad neither! She'll be a right looker in a few years' time!\n@c0@"
