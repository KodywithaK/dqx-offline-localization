  es: "@a@b*: ¡Eh! Eres Teudis, ¿verdad?\n@c0@"
  fr: "@a@b*ⓢ Hé, mais c'est Petros, on diraitⓠ\n@c0@"
  it: "@a@b*: Ehi! Ma è Russel!\n@c0@"
  ja: "@a@b＊「あっ！　あんたは\n\tパパスさんっ！？\n@c0@"
102:
