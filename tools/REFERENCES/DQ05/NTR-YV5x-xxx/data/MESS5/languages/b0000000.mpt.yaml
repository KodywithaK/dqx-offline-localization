  ja: "@a@bこのドアは　向こう側から\nカギが　かかっているようで\n開かない！\n@c0@"
306:
  de: "@a@b*: Mein kleiner Racker hat sich doch tatsächlich eine Katze besorgt.\n@c0@"
  en: "@a@b*: That young rascal of mine has gone and got himself a cat.\n@c0@"
