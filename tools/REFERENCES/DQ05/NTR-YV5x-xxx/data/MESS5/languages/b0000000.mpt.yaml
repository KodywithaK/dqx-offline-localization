  it: "@a@b*: Forza, gattaccio!\nAbbaia!\nSe non abbai ti strapperò tutti i peli uno a uno!\n@c0@"
  ja: "@a@b＊「ほら　もっと　なけ！\n@c0@"
293:
  de: "@aBianca@bLasst sie doch in Ruhe, das arme Ding!\nGebt sie mir!\n@c0@"
  en: "@aBianca@bLeave him alone, poor thing!\nGive him to me!\n@c0@"
  es: "@aBianca@b¡Déjalo en paz, pobrecito!\r\n¡Dámelo a mí! ¿Me entiendes?\n@c0@"
  fr: "@aBianca@bLaissez-le tranquille, le pauvreⓠ\nDonnez-le-moiⓠ\n@c0@"
  it: "@aBianca@bLasciatelo in pace, quel povero piccolo!\nDatelo a me!\n@c0@"
  ja: "@a@bビアンカ「やめなさいよ！\n\tかわいそうでしょう。\n\tその子を　わたしなさい！\n@c0@"
294:
  de: "@a@b*: Du willst sie, ja?\n@c0@"
  en: "@a@b*: You want him, do you?\n@c0@"
  es: "@a@b*: Lo quieres, ¿no?\n@c0@"
  fr: "@a@b*ⓢ Tu le veux vraimentⓡ\n@c0@"
  it: "@a@b*: Vuoi il gatto, eh?\n@c0@"
  ja: "@a@b＊「おい　このネコをわたせって。\n\tどうする？\n@c0@"
295:
