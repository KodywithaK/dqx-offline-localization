  fr: "@a@b*ⓢ Elle est pas malⓠ Elle sera même sacrément mignonne dans quelques annéesⓠ\n@c0@"
  it: "@a@b*: Complimenti! È proprio una bella bambina!\r\nTra qualche anno diventerà una splendida figliola...\r\nIo ho intuito per queste cose!\n@c0@"
  ja: "@a@b＊「かわいい彼女ね。\n\t大きくなったら　きっと\n\t美人になるわよ。\n@c0@"
305:
  de: "@a@bDie Tür scheint von der anderen Seite verschlossen zu sein und lässt sich nicht öffnen.\n@c0@"
  en: "@a@bThe door seems to be locked from the other side, and it won't open.\n@c0@"
  es: "@a@bParece que la puerta está cerrada desde el otro lado, no se abre.\n@c0@"
  fr: "@a@bLes portes ne s'ouvrent pas et semblent verrouillées de l'intérieur.\n@c0@"
