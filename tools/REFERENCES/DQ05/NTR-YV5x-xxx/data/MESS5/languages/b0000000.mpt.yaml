  ja: "@a@b＊「ルドマンさまが　お留守の間に\n\t勝手に　お部屋の中のものを\n\tさわったりしては　いけないぞ。\n@c0@"
32:
  de: "@a@b*: Wir werden bald in Kleinhaven anlegen. Na ja, aber allzu aufregend ist's da nicht gerade.\n@c0@"
  en: "@a@b*: We'll be docking at Littlehaven before long. Not that there's much there to get excited about, mind you.\n@c0@"
