  es: "@a@b*: ¡Pero aún así, estorbas!\n@c0@"
  fr: "@a@b*ⓢ N'empêche, tu me dérangesⓠ\nAllez, ouste. Du balaiⓠ\n@c0@"
  it: "@a@b*: Non sei %A0110%Xuno%Z%B0110%Xuna%Z di loro, vedo...\nA ogni modo, non puoi stare qui!\nSciò! Sciò! Pussa via!\n@c0@"
  ja: "@a@b＊「ともかく　仕事のジャマだ！\n\tさっさと出ていってくれ！\n@c0@"
288:
  de: "@a@b*: Ich steh hier Tag und Nacht Wache, um zu verhindern, dass irgendwelches Monstergesocks ins Dorf eindringt.\n@c0@"
