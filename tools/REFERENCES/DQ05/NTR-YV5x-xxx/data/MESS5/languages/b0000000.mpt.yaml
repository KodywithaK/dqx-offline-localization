43:
  de: "@a@b*: Graaargh!\n@c0@"
  en: "@a@b*: Graaargh!\n@c0@"
  es: "@a@b*: ¡Yeeeeepa!\n@c0@"
  fr: "@a@b*ⓢ Grooooarⓠ\n@c0@"
  it: "@a@b*: Graaargh!\n@c0@"
  ja: "@a@b＊「がおーっ！\n@c0@"
44:
  de: "@a@b*: Hey! Du hast ja gar nich' geschrien!\nDich kann man nich' so leicht erschrecken, wa'?\n@c0@"
  en: "@a@b*: Hey! You didn't scream or nuffin'!\r\nBit of an 'ard nut, are ya?\n@c0@"
  es: "@a@bEres un machote, ¿eh?\n@c0@"
  fr: "@a@b*ⓢ Eh benⓠ T'as même pas crié, ni rienⓠ\nT'es un dur à cuire, toi, gaminⓠ\n@c0@"
  it: "@a@b*: Anvedi, ahò! Nun te sei spaventato!\nTe devi da esse' 'n duro mica da ride', eh?\nEh eh eh!\n@c0@"
  ja: "@a@b＊「お！？　泣かなかったな！\n\tえらいぞ　坊主！\n@c0@"
45:
  de: "@a@b*: Hallo, Junge.\nKleiner Hunger zwischendurch, oder was?\n@c0@"
  en: "@a@b*: Hello there, laddie!\r\nFeeling a bit peckish, are we?\n@c0@"
  es: "@a@b*: ¡Hola, muchacho!\r\nTienes un poco de hambre, ¿verdad?\n@c0@"
  fr: "@a@b*ⓢ Salut, mon garsⓠ\nAlors, on a un petit creuxⓡ\n@c0@"
  it: "@a@b*: Salve, ragazzino! Scommetto che sei qui perché hai sentito il profumino di quello che sto preparando da mangiare...\n@c0@"
  ja: "@a@b＊「おっ　坊や！\n\tもう　おなかが　すいたのかな？\n@c0@"
46:
  de: "@a@b*: Das Essen hier ist gar nicht so schlecht, wenn ich das mal selbst so sagen darf. Ich frage mich, wer der bessere Koch ist... dein Vater oder ich?\n@c0@"
  en: "@a@b*: The food here's not bad, even if I do say so myself. I wonder who's the better cook, me or\r\nyour pa?\n@c0@"
  es: "@a@b*: Aquí se come bastante bien, aunque esté mal que yo lo diga. No sé quién será mejor cocinero, si tu padre o yo.\n@c0@"
  fr: "@a@b*ⓢ La nourriture à bord n'est pas mal du tout. Enfin, je ne suis pas très objectif... Je me demande qui cuisine le mieuxⓢ ton père ou moiⓡ\n@c0@"
  it: "@a@b*: Non dovrei essere io a dirlo, ma il rancio a bordo non è affatto male. La mia cucina non ha ammazzato nessuno! Almeno fino a ora... Eh eh eh!\n@c0@"
  ja: "@a@b＊「おじさんの料理は　うまいだろ。\n\t坊やの父さんと　どっちが\n\t上手だろうね。\n@c0@"
47:
  de: "@a@b*: Also reist dein Vater durch die ganze Welt, auf der Suche nach irgendetwas, wie?\n@c0@"
  en: "@a@b*: So your father's travelling the world looking for something, eh?\n@c0@"
  es: "@a@b*: Así que tu padre recorre el mundo en busca de algo, ¿eh?\n@c0@"
  fr: "@a@b*ⓢ Alors comme ça, ton père voyage à travers le monde à la recherche de quelque choseⓡ\n@c0@"
  it: "@a@b*: Dicono che tuo padre stia girando il mondo alla ricerca di qualcosa.\n@c0@"
  ja: "@a@b＊「坊やの父さんは　何かを探して\n\t世界中を　旅してるんだってな。\n@c0@"
48:
  de: "@a@b*: Tja, ich weiß zwar nicht, worauf er es abgesehen hat, aber ich hoffe, dass er es bald findet.\n@c0@"
  en: "@a@b*: Well, I don't know what it is he's after, but I hope he manages to find it soon.\n@c0@"
  es: "@a@b*: Bueno, no sé lo que será, pero espero que lo encuentre pronto.\n@c0@"
  fr: "@a@b*ⓢ Je ne sais pas ce qu'il cherche, mais j'espère qu'il le trouvera rapidement.\n@c0@"
  it: "@a@b*: Non ho idea di cosa stia cercando, ma gli auguro di trovarlo.\nIl tuo papà mi è simpatico!\n@c0@"
  ja: "@a@b＊「それが　何だか知らないけど\n\t早く　見つかるといいなっ。\n@c0@"
49:
  de: "@a@b*: Wenn ich dran denke, dass Ludwig einen kleinen Jungen wie dich alleine aufziehen muss, ohne deine Mutter...\n@c0@"
  en: "@a@b*: When I think of Pankraz raising a small boy like you without your mother around...\n@c0@"
  es: "@a@b*: Cuando pienso en Teudis criando a un niño como tú sin la ayuda de una madre...\n@c0@"
  fr: "@a@b*ⓢ Quand je pense que Petros élève seul un petit bonhomme comme toi, sans sa mère...\n@c0@"
  it: "@a@b*: Russel è stato in grado di crescere un bambino da solo, senza il supporto e il conforto della moglie...\n@c0@"
  ja: "@a@b＊「しかし　こんな小さい子を\n\t母親がいなくて　男手ひとつで\n\t育てたなんて……。\n@c0@"
50:
  de: "@a@b*: Er ist ein besserer Mann als ich, so viel steht schon mal fest.\n@c0@"
  en: "@a@b*: He's more of a man than I am, that's for sure.\n@c0@"
  es: "@a@b*: Es más hombre que yo, eso seguro.\n@c0@"
  fr: "@a@b*ⓢ Il est bien plus courageux que moi, ça, c'est certain.\n@c0@"
  it: "@a@b*: Beh, non so se io sarei stato in grado di riuscirci.\n@c0@"
  ja: "@a@b＊「坊やの父さんは\n\tえらいよなあ。\n@c0@"
51:
