252:
  de: "@a@b*: Gut gemacht, Junge! Was für ein Glück, dass du vorbeigekommen bist. Ich heiße übrigens Unterlieger. Schön, dich kennenzulernen!\n@c0@"
  en: "@a@b*: Nice work, boy! I'm lucky you come along.\r\nThe name's Rockefeller, by the way.\r\nPleased to meet you!\n@c0@"
  es: "@a@b*: ¡Bien hecho, chico! Menuda suerte que pasases por aquí.\r\nPor cierto, soy el señor Roca, ¡encantado!\n@c0@"
  fr: "@a@b*ⓢ Beau travail, p'tit garsⓠ J'ai de la veine que tu sois passé par là. Au fait, je m'appelle Gauthier Krazé. Ravi de te rencontrerⓠ\n@c0@"
  it: "@a@b*: Grazie! Per mia fortuna sei arrivato tu! Io sono Travolto. No, non dalla roccia... Cioè, sì, sono stato travolto dalla roccia, ma il mio nome è Travolto.\n@c0@"
  ja: "@a@b＊「やれやれ　助かった！\n\t坊や　ありがとう！\n@c0@"
253:
  de: "@aHerr Unterlieger@bJetzt kann ich Frau Weißner die Medizin bringen, nach der sie gefragt hat.\n@c0@"
  en: "@aMr Rockefeller@bNow I can get that medicine to Mrs Whitaker like she asked.\n@c0@"
  es: "@aSr. Roca@bAhora podré llevar a la Sra. Doptada la medicina que me pidió.\n@c0@"
