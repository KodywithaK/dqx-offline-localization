  en: "@aPankraz@bRight. Well, we'd better be on our way early in the morning. Otherwise the folk back in Whealbrook will be wonderin' where we've got to.\n@c0@"
  es: "@aTeudis@bDe acuerdo. Bueno, será mejor que nos pongamos en marcha temprano o la gente de Arroyofrío se preguntará qué nos ha pasado.\n@c0@"
