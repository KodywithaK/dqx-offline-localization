  it: "@aRussel@bCapitano, grazie di tutto.\nVi auguro una buona navigazione.\n@c0@"
  ja: "@a@bパパス「じゃあ　船長！\n\tずいぶん世話になった……。\n\t身体に　気をつけてな！\n@c0@"
101:
  de: "@a@b*: Hey! Wenn das mal nicht Ludwig ist!\n@c0@"
