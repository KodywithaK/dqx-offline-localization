  es: "@a@b*: ¡Buah! Me paso todo el día aquí para que los monstruos no entren en la ciudad.\n@c0@"
  fr: "@a@b*ⓢ Je monte la garde ici jour et nuit pour m'assurer qu'aucun monstre ne pénètre en ville.\n@c0@"
  it: "@a@b*: Io monto la guardia giorno e notte, per evitare che i mostri entrino in città.\n@c0@"
  ja: "@a@b＊「おじさんは　こうして\n\t町に怪物が入って来ないように\n\t見張っているのだ。\n@c0@"
289:
  de: "@a@b*: Du bist doch ein aufgewecktes Jüngelchen, nicht? Lass es dir bloß nicht einfallen, außerhalb des Ortes rumzuspazieren, klar?\n@c0@"
