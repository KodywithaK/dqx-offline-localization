  fr: "@a@b*ⓢ Si tu veux le chat, tu ferais mieux d'aller dans les tours Karpatt pour commencer à t'occuper des fantômesⓠ\n@c0@"
  it: "@a@b*: Se ci tieni tanto al gatto, farai meglio a pensare a come sconfiggere gli spettri del Palazzo delle Ombre!\nChiaro?!\n@c0@"
  ja: "@a@b＊「このネコが　欲しけりゃ\n\tレヌール城の　お化けを\n\t退治して来るんだぜっ。\n@c0@"
300:
  de: "@a@b*: Grrr!\n@c0@"
  en: "@a@b*: Grrrr!\n@c0@"
  es: "@a@b*: ¡Grrrr!\n@c0@"
  fr: "@a@b*ⓢ Grrrrⓠ\n@c0@"
  it: "@a@b*: Grrrr!\n@c0@"
  ja: "@a@b＊「ガルルルルー！\n@c0@"
301:
  de: "@a@b*: Ah, was für ein eifriges junges Bürschchen du doch bist. Gehst ganz allein zur Kirche!\n@c0@"
  en: "@a@b*: Ah, what a diligent young thing you are, comin' along to the church by yourself.\n@c0@"
  es: "@a@b*: Qué %A0120%Xjovencito más cumplidor%Z%B0120%Xjovencita más cumplidora%Z%C0120%X%Z, que viene a la iglesia de motu proprio.\n@c0@"
  fr: "@a@b*ⓢ Ah, voilà une jeune personne qui ne perd pas son temps. Tu viens déjà à l'église %A0110%Xtout seul%Z%B0110%Xtoute seule%Zⓡ\n@c0@"
  it: "@a@b*: Ah, che gioia vedere un giovane fedele qui in chiesa!\n@c0@"
  ja: "@a@b＊「おう　おう\n\t小さいのに　教会にくるとは\n\t感心な子じゃのう。\n@c0@"
302:
  de: "@a@b*: Du erinnerst mich an mich selbst, als ich in deinem Alter war.\nHa ha ha!\n@c0@"
  en: "@a@b*: You remind me of me when I was your age.\r\nHa ha ha!\n@c0@"
  es: "@a@b*: Me recuerdas a mí cuando tenía tu edad.\r\n¡Ja, ja, ja!\n@c0@"
  fr: "@a@b*ⓢ Tu me fais penser à moi quand j'avais ton âge.\nHa ha haⓠ\n@c0@"
  it: "@a@b*: Alla tua età, anch'io visitavo spesso la casa della dea, sai?\n@c0@"
