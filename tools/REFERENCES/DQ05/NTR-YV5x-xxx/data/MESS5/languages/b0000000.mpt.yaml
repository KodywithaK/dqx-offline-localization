  fr: "@a@b*ⓢ Prends bien soin de ton père, petit.\n@c0@"
  it: "@a@b*: Abbi cura di tuo padre, piccolo.\n@c0@"
  ja: "@a@b＊「坊や。　お父さんを\n\t大事にしろよっ。\n@c0@"
