192:
  de: "@a@b*: Ich hab in jungen Jahren in der Höhle rumgestöbert, auf der Suche nach einem der berühmten Steinach-Blausteine.\n@c0@"
  en: "@a@b*: I went huntin' about in the cave back in my younger days, lookin' for some of them famous Whealbrook bluestones.\n@c0@"
  es: "@a@b*: En mis tiempos fui a explorar la cueva en busca de las famosas aguamarinas de Arroyofrío.\n@c0@"
  fr: "@a@b*ⓢ Quand j'étais plus jeune, je suis allé explorer\nla caverne à la recherche d'une gemme bleue de Ruycelieu.\n@c0@"
  it: "@a@b*: Ricordo che, qualche anno fa, mi venne la voglia di trovare qualche pietra nobile di Valcava.\r\nLe cercai nella grotta, convinto che lì ce ne fossero.\n@c0@"
  ja: "@a@b＊「オラも　昔は　サンタローズ名産の\n\t聖なる原石を　もとめて\n\t洞くつ掘ったもんよ。\n@c0@"
193:
  de: "@a@b*: Ach ja. Ich erinnere mich gut daran, wie ich zwischen den großen Felsen nach Erz Ausschau hielt. Das waren noch Zeiten...\n@c0@"
  en: "@a@b*: Ah, yes. I remember pokin' about them big\r\nrocks hopin' for a sign of some ore.\r\nIt doesn't half take me back.\n@c0@"
  es: "@a@b*: Ah, sí. Recuerdo cómo picaba las rocas esperando encontrar la señal de alguna veta.\n¡Qué recuerdos!\n@c0@"
  fr: "@a@b*ⓢ Ah, oui. Je me souviens très bien avoir fouillé partout dans ces gros rochers en espérant en trouver une. Ça ne me rajeunit pas, tout ça.\n@c0@"
  it: "@a@b*: Scavai ovunque!\nRidussi le pareti della caverna a un colabrodo, ma non trovai nemmeno l'ombra di una pietra!\n@c0@"
  ja: "@a@b＊「でっけえ　岩　掘り出しては\n\tぶちわって　原石さがしてなあ。\n\tなつかしい話だべ。\n@c0@"
194:
  de: "@a@b*: Meine armen Pflänzchen leiden wirklich unter dieser Kälte. Ich weiß nicht mehr, was ich machen soll.\n@c0@"
  en: "@a@b*: My poor plants are really sufferin' here with this cold. I'm at my wits' end, I am.\n@c0@"
  es: "@a@b*: Mis pobres plantas están sufriendo con tanto frío. Ya no sé qué hacer.\n@c0@"
  fr: "@a@b*ⓢ Mes pauvres plantes souffrent vraiment, avec ce froid. Je ne sais plus quoi faire.\n@c0@"
  it: "@a@b*: Questo dannato freddo sta rovinando tutte le mie piante!\nNon so proprio cosa fare!\n@c0@"
  ja: "@a@b＊「こう寒くっちゃ\n\t作物が　育たないよ。\n\tこまったことだわい。\n@c0@"
195:
  de: "@a@b*: Außerhalb des Dorfes ist es äußerst gefährlich. Sei ein guter Junge und geh zurück nach Hause, wo du in Sicherheit bist.\n@c0@"
  en: "@a@b*: It's extremely dangerous outside of the village. You be a good boy now and go back home where you'll be nice and safe.\n@c0@"
  es: "@a@b*: Es muy peligroso salir del pueblo. Sé un buen chico y vuelve a casaⓓ allí estarás a salvo.\n@c0@"
  fr: "@a@b*ⓢ Il est très dangereux de s'aventurer hors du village. Sois un brave garçon et rentre chez toi.\nTu y seras bien en sécurité.\n@c0@"
  it: "@a@b*: Uscire dal villaggio è troppo pericoloso.\nDa bravo, torna a casa.\n@c0@"
  ja: "@a@b＊「村の外は　とてもキケンだ。\n\t坊や　いい子だから\n\tおうちに　もどりなさい。\n@c0@"
196:
  de: "@a@b*: Du bist doch ein braves Kind, oder, Junge? Dann solltest du deinem Vater keine Steine in den Weg legen.\n@c0@"
  en: "@a@b*: You're a good child, aren't you, boy?\r\nThen make sure you don't get in the way of that father of yours.\n@c0@"
  es: "@a@b*: Eres un buen chico, seguro, ¿a que sí?\r\nPues entonces ten cuidado de no molestar a tu padre.\n@c0@"
  fr: "@a@b*ⓢ Tu es un brave petit, n'est-ce pas mon garçonⓡ\nAlors fais bien attention à ne pas causer d'ennuis à ton père.\n@c0@"
  it: "@a@b*: Tu sei un bravo bambino, io lo so.\nMi raccomando, ubbidisci sempre a tuo padre.\n@c0@"
  ja: "@a@b＊「坊やは　いい子じゃな？\n\tだったら　お父さんの　ご用の\n\tジャマは　せんようにな。\n@c0@"
197:
  de: "@a@b*: Da geht's zum Höhleneingang, Junge, weißt du. Glaub bloß nicht, dass ich dir da rein nachlaufe, wenn du dich verirrst.\n@c0@"
  en: "@a@b*: This here's the cave entrance, you know, boy. Don't expect me to come in after you if you get yourself lost.\n@c0@"
  es: "@a@b*: Vas hacia la entrada de la cueva, ¿sabes, chico? No esperes que vaya a buscarte si te pierdes.\n@c0@"
  fr: "@a@b*ⓢ Tu te diriges vers l'entrée de la caverne, mon garçon. Ne compte pas sur moi pour aller te chercher si tu t'y perds.\n@c0@"
  it: "@a@b*: Questa grotta è molto pericolosa!\nSapessi quante persone si sono perse qui dentro...\n@c0@"
  ja: "@a@b＊「坊や　この先は　洞くつだ。\n\t迷子になっても\n\tおじさんは　知らないぞ。\n@c0@"
198:
  de: "@a@b*: Ah, du bist wieder zu dir gekommen.\n@c0@"
  en: "@a@b*: Ah, you've come to.\n@c0@"
  es: "@a@b*: Ah, ya has vuelto en ti.\n@c0@"
  fr: "@a@b*ⓢ Ah, tu reviens à toi.\n@c0@"
  it: "@a@b*: Finalmente hai ripreso i sensi...\n@c0@"
  ja: "@a@b＊「おお　気がついたようだな。\n@c0@"
199:
  de: "@a@b*: Ich habe für dich getan, was ich konnte, aber du solltest jetzt wirklich nach Hause gehen und dich etwas ausruhen.\n@c0@"
  en: "@a@b*: I did what I could for you, but you really should go home and get some rest now.\n@c0@"
  es: "@a@b*: He hecho por ti lo que he podido, pero ahora deberías ir a casa y descansar un rato.\n@c0@"
  fr: "@a@b*ⓢ J'ai fait ce que j'ai pu pour toi, mais tu devrais vraiment rentrer chez toi pour te reposer, maintenant.\n@c0@"
  it: "@a@b*: Ringrazia la dea che ti ho aiutato!\nForza, torna a casa e riposa un po'...\n@c0@"
  ja: "@a@b＊「いちおうの　手当てはしたが\n\t家で　ゆっくりと\n\t休むことだな。\n@c0@"
200:
  de: "@a@b*: Ich habe gehört, die Engel hätten deine arme Mutter mitgenommen, als du noch ein Baby warst.\n@c0@"
  en: "@a@b*: I hear your poor mother was taken away by the angels when you were still a little baby.\n@c0@"
  es: "@a@b*: Dicen que los angelitos se llevaron a tu pobre madre cuando tú no eras más que un bebé.\n@c0@"
  fr: "@a@b*ⓢ J'ai entendu dire que ta pauvre mère avait été emmenée par les anges quand tu n'étais encore qu'un bébé.\n@c0@"
  it: "@a@b*: Gli angeli hanno portato via tua madre che tu eri ancora piccolo piccolo, sai?\n@c0@"
  ja: "@a@b＊「坊やの　お母さんは\n\t坊やが小さい頃\n\tお亡くなりになったそうね。\n@c0@"
201:
  de: "@a@b*: Aber davon solltest du dich nicht entmutigen lassen. Schließlich hast du einen wunderbar starken Vater, der sich um dich kümmert.\n@c0@"
  en: "@a@b*: But you mustn't let that make you lose heart.\r\nYou have such a wonderfully strong father there to support you, after all.\n@c0@"
  es: "@a@b*: Pero no debes desanimarte por ello.\r\nAl fin y al cabo, tienes un padre fuerte que te protege.\n@c0@"
  fr: "@a@b*ⓢ Mais cela ne doit pas te décourager.\nAprès tout, tu as la chance d'avoir un père très fort pour te soutenir.\n@c0@"
  it: "@a@b*: Però non devi preoccuparti per lei.\nLa tua mamma ora sta bene, su in cielo.\nE poi, c'è sempre tuo padre accanto a te.\n@c0@"
  ja: "@a@b＊「でも　負けちゃダメよ。\n\tあんなに強くて　たくましい\n\tお父さまが　いるんだもん。\n@c0@"
202:
  de: "@a@b*: Ich frage mich, was das ist, nach dem Ludwig sucht. Wieso nimmt er wohl eine derart lange und gefährliche Reise auf sich?\n@c0@"
  en: "@a@b*: I wonder what it could be that Pankraz is\r\nlookin' for. Why would he make such long\r\nand dangerous journeys?\n@c0@"
  es: "@a@b*: Me pregunto qué es lo que estará buscando Teudis. ¿Por qué se embarcará en esos viajes tan largos y peligrosos?\n@c0@"
  fr: "@a@b*ⓢ Je me demande ce que Petros peut bien chercher. Pourquoi se lancer dans des voyages aussi longs et périlleuxⓡ\n@c0@"
  it: "@a@b*: Chissà cosa sta cercando Russel...\r\nCosa lo avrà spinto a intraprendere un viaggio tanto lungo e pericoloso?\n@c0@"
  ja: "@a@b＊「パパスさんは　いったい\n\tなんのために　なにをさがして\n\t旅に出ていたんだろうねえ。\n@c0@"
203:
  de: "@a@b*: Ich frage mich oft, welches Leben Ludwig geführt hat, ehe er nach Steinach kam.\n@c0@"
  en: "@a@b*: I often wonder what sort of life Pankraz led before he came here to Whealbrook.\n@c0@"
  es: "@a@b*: A menudo me pregunto qué vida llevaba Teudis antes de venir a Arroyofrío.\n@c0@"
  fr: "@a@b*ⓢ Je me demande souvent quel genre de vie menait Petros avant d'arriver ici, à Ruycelieu.\n@c0@"
  it: "@a@b*: Mi chiedo come fosse la vita di Russel prima di stabilirsi a Valcava...\n@c0@"
  ja: "@a@b＊「パパスどのは　村に来る前は\n\tなにを　やってたんじゃろな？\n@c0@"
204:
  de: "@a@b*: Er redet wohl nicht gerne darüber. Aber ich wette, er war kein gewöhnlicher Mann.\nLass dir das gesagt sein!\n@c0@"
  en: "@a@b*: He doesn't seem to want to talk about it much,\r\nbut I'd wager he was no ordinary man.\r\nYou mark my words!\n@c0@"
  es: "@a@b*: No parece que le apetezca mucho hablar del tema, pero seguro que no era un hombre corriente.\r\n¡Sé lo que me digo!\n@c0@"
  fr: "@a@b*ⓢ Il n'a pas l'air d'avoir envie d'en parler, mais je parierais que ce n'était pas un homme ordinaire. Souviens-toi de ce que je disⓠ\n@c0@"
  it: "@a@b*: Raramente l'ho sentito parlare del suo passato.\nDi sicuro non faceva l'impiegato al catasto!\nMi ci giocherei la pensione!\n@c0@"
  ja: "@a@b＊「あんまり　いいたがらないが\n\tわしが思うに　パパスどのは\n\tただ者では　ないはずじゃ！\n@c0@"
205:
  de: "@a@b*: Du warst noch ein kleines Baby, als du und dein Vater nach Steinach gekommen seid und euch hier niedergelassen habt.\n@c0@"
  en: "@a@b*: You were just a little baby when you and your father came here to live in Whealbrook.\n@c0@"
  es: "@a@b*: Cuando tu padre y tú vinisteis a Arroyofrío no eras más que un bebé.\n@c0@"
  fr: "@a@b*ⓢ Tu n'étais qu'un tout petit bébé quand ton père et toi êtes venus vivre ici, à Ruycelieu.\n@c0@"
  it: "@a@b*: Tu eri un bambinetto piccino piccino quando tuo padre venne a vivere qui a Valcava.\n@c0@"
  ja: "@a@b＊「坊やが　お父さんと\n\tこの村に　住みはじめたとき\n\tまだ赤ちゃんだったのに……。\n@c0@"
206:
  de: "@a@b*: Kaum zu glauben, wie schnell die Zeit verfliegt.\n@c0@"
  en: "@a@b*: I can hardly believe how the time's flown by.\n@c0@"
  es: "@a@b*: No puedo creer cómo ha pasado el tiempo.\n@c0@"
  fr: "@a@b*ⓢ Je n'en reviens pas comme le temps a passé.\n@c0@"
  it: "@a@b*: E ora sei un vero ometto!\nAh, come passa il tempo... A proposito!\nStamattina ho dimenticato la crema antirughe!\n@c0@"
  ja: "@a@b＊「年月のたつのは早いものね。\n@c0@"
207:
  de: "@a@b*: Du bist Ludwigs Sohn, nicht wahr?\n@c0@"
  en: "@a@b*: You're Pankraz's son, aren't you?\n@c0@"
  es: "@a@b*: Tú eres el hijo de Teudis, ¿verdad?\n@c0@"
  fr: "@a@b*ⓢ Tu es le fils de Petros, c'est çaⓡ\n@c0@"
  it: "@a@b*: Tu sei il figlio di Russel, non è vero?\n@c0@"
  ja: "@a@b＊「おや　あんたは　パパスさんの\n\tむすこさんだね。\n@c0@"
208:
  de: "@a@b*: Es muss ganze fünf Jahre her sein, dass Ludwig hier in Steinach aufgetaucht ist.\n@c0@"
  en: "@a@b*: It must be a good five years now since Pankraz turned up here in Whealbrook.\n@c0@"
  es: "@a@b*: Deben de haber pasado cinco años desde que Teudis vino a Arroyofrío.\n@c0@"
  fr: "@a@b*ⓢ Ça doit bien faire plus de cinq ans maintenant que Petros est arrivé ici, à Ruycelieu.\n@c0@"
  it: "@a@b*: Se non ricordo male, tuo padre si trasferì qui a Valcava circa cinque anni fa...\n@c0@"
  ja: "@a@b＊「パパスさんが　この村に\n\t来たのは　５年くらい前\n\tだったかね。\n@c0@"
209:
  de: "@a@b*: Ein wirklich sympathischer Kerl, dein Vater. Die Menschen hier haben ihn gleich in ihr Herz geschlossen.\n@c0@"
  en: "@a@b*: He's a real grafter, your father.\r\nFolk here took to him the moment he arrived.\n@c0@"
  es: "@a@b*: Tu padre es un hombre muy trabajador.\r\nLa gente enseguida le tomó cariño.\n@c0@"
  fr: "@a@b*ⓢ Il sait comment se faire aimer, ton père.\nLes gens du coin l'ont adopté dès qu'il est arrivé.\n@c0@"
  it: "@a@b*: Russel è una gran brava persona.\nNon ci mise molto a stringere amicizia con la gente del posto.\n@c0@"
  ja: "@a@b＊「なかなかの　はたらき者で\n\tたちまち　村の人気者だよ。\n@c0@"
210:
  de: "@aFrau Weißner@bDieser Mann, den ich losgeschickt habe, um nach Kräutern zu suchen, ist immer noch nicht zurück.\n@c0@"
  en: "@aMrs Whitaker@bThat man I sent lookin' for herbs still ain't back yet.\n@c0@"
  es: "@aSra. Doptada@bEse hombre al que envié a por las yerbas esas aún no ha vuelto.\n@c0@"
  fr: "@aMadame Alba@bL'homme que j'ai envoyé chercher des plantes n'est toujours pas revenu.\n@c0@"
  it: "@aSignora Whitblanche@bAvevo mandato un uomo a cercare delle erbe, ma non è ancora di ritorno...\n@c0@"
  ja: "@a@b＊「薬を　とりにいってくれた人が\n\tまだ　もどって来ないのよ。\n@c0@"
211:
  de: "@aFrau Weißner@bIch wünschte, ich hätte jemanden, den ich da reinschicken könnte, um nach ihm zu sehen.\n@c0@"
  en: "@aMrs Whitaker@bI wish I could send somebody in after him to see he's alright and everythin'.\n@c0@"
  es: "@aSra. Doptada@bMe gustaría poder mandar a alguien a buscarlo y comprobar que está bien y todo eso.\n@c0@"
  fr: "@aMadame Alba@bSi seulement quelqu'un pouvait partir à sa recherche pour voir s'il ne lui est rien arrivé.\n@c0@"
  it: "@aSignora Whitblanche@bForse dovrei chiedere a qualcuno di andare a vedere che fine ha fatto.\n@c0@"
  ja: "@a@b＊「本当は　だれかに\n\tさがしに　いってもらいたいけど……。\n@c0@"
212:
  de: "@aFrau Weißner@bAber dein Vater scheint gerade so beschäftigt zu sein.\n@c0@"
  en: "@aMrs Whitaker@bBut your father seems so busy at the minute.\n@c0@"
  es: "@aSra. Doptada@bPero parece que tu padre está liadísimo.\n@c0@"
  fr: "@aMadame Alba@bMais ton père semble très occupé, pour l'instant.\n@c0@"
  it: "@aSignora Whitblanche@bAvrei voluto dirlo a tuo padre, ma al momento mi sembra molto impegnato.\n@c0@"
  ja: "@a@b＊「あんたの父さんの　パパスも\n\tいそがしそうだしね。\n@c0@"
213:
  de: "@aFrau Weißner@bUnd ich bezweifle, dass jemand anderes Lust hätte, für mich in den Tiefen der Höhle herumzutrotten.\n@c0@"
  en: "@aMrs Whitaker@bAnd I doubt there's anyone else who'd be willin' to go traipsin' into the depths of the cave for me.\n@c0@"
  es: "@aSra. Doptada@bY dudo que haya alguien que tenga ganas de meterse en la cueva esa por mí.\n@c0@"
  fr: "@aMadame Alba@bEt ça m'étonnerait que quiconque soit prêt à s'aventurer au fin fond de la caverne pour moi.\n@c0@"
  it: "@aSignora Whitblanche@bE dubito che troverò altre persone disposte ad andare in quella caverna per vedere cosa sia successo...\n@c0@"
  ja: "@a@b＊「だれか　洞くつの奥まで\n\tようすを　見にいってくれる人は\n\tいないものかねえ……。\n@c0@"
214:
  de: "@aFrau Weißner@bImmer noch keine Spur von dem Mann, den ich losgeschickt habe, um Kräuter zu holen. Langsam fange ich an, mir Sorgen zu machen.\n@c0@"
  en: "@aMrs Whitaker@bThere's still no sign of that man I sent lookin' for herbs. I'm startin' to get a bit worried now.\n@c0@"
  es: "@aSra. Doptada@bNi rastro del hombre ese al que envíe por yerbas. Me estoy empezando a preocupar.\n@c0@"
  fr: "@aMadame Alba@bToujours pas de nouvelles de l'homme que j'ai envoyé chercher des plantes. Je commence à m'inquiéter sérieusement.\n@c0@"
  it: "@aSignora Whitblanche@bL'uomo che avevo mandato nella caverna per cercare le erbe non è ancora tornato.\nComincio a essere un po' preoccupata...\n@c0@"
  ja: "@a@b＊「薬を　とりにいってくれた人が\n\tまだ　もどって来ないのよ。\n\t心配だわ……。\n@c0@"
215:
  de: "@aFrau Weißner@bMeine Güte! Du warst in der Höhle und hast einen Kerl gerettet, der unter einem großen Felsen feststeckte?\n@c0@"
  en: "@aMrs Whitaker@bDearie me! You went into the cave and saved a chap out from under a big rock?\n@c0@"
  es: "@aSra. Doptada@b¡Ay, por la Diosa! ¿Has entrado en la cueva y has sacado a un tipo de debajo de una roca?\n@c0@"
  fr: "@aMadame Alba@bCommentⓡ Tu es allé dans la caverne et tu as sauvé un homme coincé sous un gros rocherⓡ\n@c0@"
  it: "@aSignora Whitblanche@bChe cosa?! Sei andato nella grotta e hai salvato un uomo che era rimasto bloccato sotto una roccia?!\nOh, santi numi!\n@c0@"
  ja: "@a@b＊「ええっ？　洞くつの奥で\n\t岩の下じきになってた　おじさんを\n\t助けたって？\n@c0@"
216:
  de: "@aFrau Weißner@bUm Himmels willen! Das muss er sein!\n@c0@"
  en: "@aMrs Whitaker@bGood heavens! That must be my man!\n@c0@"
  es: "@aSra. Doptada@b¡Madre mía! ¡Debe de ser mi hombre!\n@c0@"
  fr: "@aMadame Alba@bAu nom du cielⓠ Ce doit être luiⓠ\n@c0@"
  it: "@aSignora Whitblanche@bDev'essere lui!\nSì, dev'essere la persona a cui avevo chiesto di trovare le erbe!\n@c0@"
  ja: "@a@b＊「まあ！　おどろいた！\n\tそれはきっと　薬をとりにいった\n\t親方だよ！\n@c0@"
217:
  de: "@aFrau Weißner@bTja, vielen herzlichen Dank, Junge! Das heißt, dass ich meine Medizin vermutlich morgen früh bekomme.\n@c0@"
  en: "@aMrs Whitaker@bWell, thanks ever so much, boy! That means I'll probably get my medicine by tomorrow mornin'.\n@c0@"
  es: "@aSra. Doptada@b¡Muchísimas gracias, chaval! Puede ser que mañana por la mañana tenga mi medicina lista.\n@c0@"
  fr: "@aMadame Alba@bEh bien, merci infiniment, mon garçonⓠ Cela signifie que j'aurai sûrement mon remède d'ici demain matin.\n@c0@"
  it: "@aSignora Whitblanche@bGrazie, piccolo!\r\nOra potrò avere la medicina che mi serve!\r\nSe tutto va bene, sarà pronta per domattina.\n@c0@"
  ja: "@a@b＊「ありがとうねえ！\n\tこれで　きっと　明日の朝には\n\t薬がもらえるわ。\n@c0@"
218:
  de: "@aBianca@bWir leben in dem Ort westlich von hier.\nEr heißt Wittenhausen.\n@c0@"
  en: "@aBianca@bWe live in the town west of here.\r\nIt's called Roundbeck.\n@c0@"
  es: "@aBianca@bVivimos en una ciudad al oeste de aquí, ¿sabes?\r\nSe llama Golfo Blanco.\n@c0@"
  fr: "@aBianca@bNous vivons dans la ville à l'ouest d'ici.\r\nElle s'appelle Blanchecombe.\n@c0@"
  it: "@aBianca@bNoi viviamo a Blankenburg, un villaggio che si trova a ovest.\n@c0@"
  ja: "@a@bビアンカ「わたしの住んでる町は\n\tここから西にいったアルカパ。\n@c0@"
219:
  de: "@aBianca@bDein Vater hat dich früher immer zum Spielen zu uns rübergebracht, als du noch klein warst.\n@c0@"
  en: "@aBianca@bYour dad used to bring you over to my house to play lots when you were little.\n@c0@"
  es: "@aBianca@bTu papá solía traerte a mi casa a jugar cuando eras pequeño y eso.\n@c0@"
  fr: "@aBianca@bQuand tu étais petit, ton papa t'emmenait souvent chez moi pour qu'on joue ensemble.\n@c0@"
  it: "@aBianca@bQuando eri piccolo... Cioè, quando eri ancora più piccolo, tuo padre ti portava spesso a casa mia e noi due giocavamo insieme.\n@c0@"
  ja: "@a@bビアンカ「あなたが　小さい頃\n\tお父さんに連れられて　よく\n\tわたしの家に　来てたのよ。\n@c0@"
220:
  de: "@a@b*: Schau an, wen haben wir denn da!\nMeinen bislang jüngsten Kunden, würde ich sagen!\n@c0@"
  en: "@a@b*: Look what we have here!\r\nMy youngest customer yet, I'd say!\n@c0@"
  es: "@a@b*: Vaya, ¿qué tenemos aquí?\r\n¡Mi cliente más joven, sin duda!\n@c0@"
  fr: "@a@b*ⓢ Regardez qui voilàⓠ\nJe n'ai encore jamais eu de client aussi jeuneⓠ\n@c0@"
  it: "@a@b*: Guarda chi c'è!\nIl mio cliente più giovane!\n@c0@"
  ja: "@a@b＊「ありゃりゃ\n\tかわいいお客さんが　来たぞ。\n@c0@"
221:
  de: "@a@b*: Das hier ist die Schänke, Junge. Du bist vielleicht ein paar Jahre zu früh dran, meinst du nicht auch? \n@c0@"
  en: "@a@b*: This is the pub, laddie. You might be gettin' a little bit ahead of your years, don't you think?\n@c0@"
  es: "@a@b*: Esto es la taberna, muchacho. ¿No crees que te estás adelantando un poco a tu edad?\n@c0@"
  fr: "@a@b*ⓢ On est à la taverne ici, mon petit gars.\nTu es un peu jeune pour ça, tu ne crois pasⓡ\n@c0@"
  it: "@a@b*: Cosa posso servirti?\nUn latte caldo? Un'orzata? Un tamarindo?\n@c0@"
  ja: "@a@b＊「ここは　酒場。\n\t坊やには　まだ　ちょっと\n\t早すぎるなあ……。\n@c0@"
222:
  de: "@a@b*: Ich kann mir nicht helfen, ich mach mir einfach Sorgen. Wegen meines Vaters. Er ist losgezogen, um Kräuter zu suchen, und noch nicht zurückgekehrt.\n@c0@"
  en: "@a@b*: I can't help but worry, you know. It's my\r\nold dad. He went off lookin' for herbs and\r\nhasn't come back.\n@c0@"
  es: "@a@b*: No puedo evitar preocuparme. Es mi padre. Salió a buscar plantas y aún no ha vuelto.\n@c0@"
  fr: "@a@b*ⓢ Je ne peux pas m'empêcher d'être inquiet.\nC'est mon père. Il est parti chercher des plantes et il ne revient pas.\n@c0@"
  it: "@a@b*: Sono in ansia per mio padre.\nÈ andato a cercare delle erbe, e non è ancora tornato...\n@c0@"
  ja: "@a@b＊「こまった　こまった。\n\t親方が　薬の原料をとりにいったまま\n\tもどらないんだ。\n@c0@"
223:
  de: "@a@b*: Er wollte wahrscheinlich in der Höhle hier danach suchen, dem Steinach-Stollen. Hoffentlich ist alles in Ordnung mit ihm.\n@c0@"
  en: "@a@b*: He probably went searchin' for them in the cave here, Whealbrook Adit. I hope he's alright.\n@c0@"
  es: "@a@b*: Probablemente fue a buscarlas a esa cueva de por aquí, Boca de Arroyofrío. Espero que esté bien.\n@c0@"
  fr: "@a@b*ⓢ Il est sans doute allé les chercher dans la caverne de Ruycelieu, juste à côté.\nJ'espère qu'il va bien.\n@c0@"
  it: "@a@b*: Mi aveva detto che si sarebbe recato nella Grotta di Valcava.\nSpero che non gli sia successo nulla di male!\n@c0@"
  ja: "@a@b＊「たぶん　この村の洞くつに\n\t入っていったと思うけど\n\tどうしたんだろうなあ……。\n@c0@"
224:
  de: "@a@b*: Mein Vater ist endlich mit den Kräutern zurückgekommen, nach denen er gesucht hat.\n@c0@"
  en: "@a@b*: My old dad finally came back with those herbs he was after.\n@c0@"
  es: "@a@b*: Mi padre ha vuelto por fin con las plantas que buscaba.\n@c0@"
  fr: "@a@b*ⓢ Mon vieux père est finalement revenu avec les plantes qu'il cherchait.\n@c0@"
  it: "@a@b*: Mio padre è tornato e ha trovato le erbe che era andato a cercare!\n@c0@"
  ja: "@a@b＊「親方が　やっと\n\t薬草をとって　帰ってきたんだ！\n@c0@"
225:
  de: "@a@b*: Er wird jetzt wohl darangehen, die Medizin herzustellen. Ich schätze, dass er sie bis morgen früh fertig hat.\n@c0@"
  en: "@a@b*: He'll be gettin' to work on makin' the medicine now.\r\nI should think he'll probably have it done and dusted by mornin'.\n@c0@"
  es: "@a@b*: Ahora se pondrá a trabajar en la medicina.\r\nYo creo que la tendrá lista y a punto por la mañana.\n@c0@"
  fr: "@a@b*ⓢ Il va pouvoir se mettre à préparer le remède, à présent. Il l'aura sans doute terminé et réduit en poudre d'ici demain matin.\n@c0@"
  it: "@a@b*: Ora preparerà la medicina che gli hanno richiesto.\nA occhio e croce, dovrebbe essere pronta per domani mattina.\n@c0@"
  ja: "@a@b＊「さっそく　薬を　調合してるから\n\t明日の朝には\n\tできるかもしれないな。\n@c0@"
226:
  de: "@aHerr Unterlieger@bAh! Du bist doch der Bursche aus der Höhle, nicht wahr, Junge? Du hast mich da wirklich aus der Klemme gezogen.\n@c0@"
  en: "@aMr Rockefeller@bAh! You're the young laddie from the cave, aren't you, boy? You really helped me out of a tight spot back there.\n@c0@"
  es: "@aSr. Roca@b¡Ah! Eres el muchacho de la cueva, ¿verdad? Me sacaste de un verdadero aprieto.\n@c0@"
  fr: "@aGauthier Krazé@bAh, c'est toi le jeune homme de la caverne, n'est-ce pasⓡ\nTu m'as vraiment tiré d'un mauvais pas, là-bas.\n@c0@"
  it: "@aJohn Travolto@bToh! Ma tu sei il bambino che mi ha aiutato nella grotta! Sai una cosa? Senza di te, probabilmente, ora non sarei qui a raccontare la mia disavventura!\n@c0@"
  ja: "@a@b＊「おお　坊やは\n\t洞くつで　会った……\n\tあの時は　世話になったな。\n@c0@"
227:
  de: "@aHerr Unterlieger@bTatsächlich würde ich sagen, du hast dir eine Belohnung verdient! Wirf mal einen Blick in die Schublade da drüben.\n@c0@"
  en: "@aMr Rockefeller@bIn fact, I'd say you deserve a reward!\r\nHave a look in that drawer just there.\n@c0@"
  es: "@aSr. Roca@b¡De hecho, creo que mereces una recompensa!\r\nMira en ese cajón de ahí.\n@c0@"
  fr: "@aGauthier Krazé@bJe dirais même que tu mérites une récompenseⓠ\nRegarde dans ce tiroir, juste là.\n@c0@"
  it: "@aJohn Travolto@bTi meriti una bella ricompensa!\nForza, dai un'occhiata in quel cassetto!\n@c0@"
  ja: "@a@b＊「お礼に　いい物をあげよう。\n\tそこの引出しを\n\t調べてごらん。\n@c0@"
228:
  de: "@aLudwig@bAh, du bist ja wach, %a000090.\n@c0@"
  en: "@aPankraz@bAh, you're awake, %a000090.\n@c0@"
  es: "@aTeudis@bAh, %a000090, estás despierto.\n@c0@"
  fr: "@aPetros@bAh, tu es réveillé, %a000090.\n@c0@"
  it: "@aRussel@bBen svegliato, %a000090.\n@c0@"
  ja: "@a@bパパス「起きてきたか　%a000090！\n@c0@"
229:
  de: "@aLudwig@bFrau Weißner hat jetzt die Medizin, wegen der sie hier ist, also kehren sie und Bianca heute wieder nach Hause zurück.\n@c0@"
  en: "@aPankraz@bMrs Whitaker has got the medicine she came for now, so she and Bianca will be going home today.\n@c0@"
  es: "@aTeudis@bLa Sra. Doptada ya tiene la medicina que vino a buscar, así que hoy se volverá a su casa con Bianca.\n@c0@"
  fr: "@aPetros@bMadame Alba a récupéré le remède qu'elle était venue chercher. Elle et Bianca vont donc repartir aujourd'hui.\n@c0@"
  it: "@aRussel@bLa signora Whitblanche ha ritirato la medicina che le serviva, così lei e Bianca torneranno a casa oggi.\n@c0@"
  ja: "@a@bパパス「薬が手に入ったので\n\tおかみさんと　ビアンカは\n\t今日　帰ってしまうらしい。\n@c0@"
230:
  de: "@aLudwig@bIch lasse sie aber nur ungern alleine reisen.\n@c0@"
  en: "@aPankraz@bI'm a bit worried about them travelling\r\non their own, though.\n@c0@"
  es: "@aTeudis@bPero me preocupa que viajen solas.\n@c0@"
  fr: "@aPetros@bMais cela m'inquiète un peu de les laisser voyager seules.\n@c0@"
  it: "@aRussel@bSe devo essere sincero, l'idea che quelle due donne viaggino da sole non mi entusiasma affatto...\n@c0@"
  ja: "@a@bパパス「しかし　女ふたりでは\n\tなにかと　あぶない。\n@c0@"
231:
  de: "@aLudwig@bDaher habe ich vor, sie sicher nach Wittenhausen zurückzubringen. Möchtest du mitkommen?\n@c0@"
  en: "@aPankraz@bI was thinking I might see them back to Roundbeck safely. Do you want to come along?\n@c0@"
  es: "@aTeudis@bEstaba pensando que las podría acompañar a Golfo Blanco. ¿Quieres venir conmigo?\n@c0@"
  fr: "@aPetros@bJe me disais qu'il serait plus sûr que je les raccompagne à Blanchecombe.\nVeux-tu venir avec moiⓡ\n@c0@"
  it: "@aRussel@bStavo pensando di accompagnarle a Blankenburg.\nVuoi venire anche tu?\n@c0@"
  ja: "@a@bパパス「ふたりを　アルカパまで\n\tおくっていこうと思うのだが\n\tお前も　ついてくるか？\n@c0@"
232:
  de: "@aLudwig@bGut, gut. Dann machen wir uns mal auf den Weg!\n@c0@"
  en: "@aPankraz@bGood, good. Let's be off then, shall we?\n@c0@"
  es: "@aTeudis@bBien, bien. En marcha, pues, ¿de acuerdo?\n@c0@"
  fr: "@aPetros@bParfait. Dans ce cas, allons-y.\n@c0@"
  it: "@aRussel@bPerfetto! Vai a prepararti...\nTra un po' partiamo!\n@c0@"
  ja: "@a@bパパス「よし　そうと決まったら\n\tさっそく　出かけることに\n\tしよう！\n@c0@"
233:
  de: "@aSancho@bAdiós, Señor Ludwig.\nGebt acht, dass Ihr Euss keine Schwierigkeiten einhandelt!\n@c0@"
  en: "@aSancho@bAdiós, señor Pankraz.\nNo get een no trouble, eh!\n@c0@"
  es: "@aSancho@bAdiós, señor Teudis.\r\n¡No se me meta ni tantito en problemas!\n@c0@"
  fr: "@aSancho@bAdiós, señor Petros.\nEt ne vous attirez pas d'ennuis, s-surtoutⓠ\n@c0@"
  it: "@aSancho@bAdiós, señor Russel.\n¡Y no metterte en los guaios!\n¿Claro?\n@c0@"
  ja: "@a@bサンチョ「だんなさま\n\tどうか　お気をつけて\n\tいってらっしゃいませ！\n@c0@"
234:
  de: "@a@b*: Du willst doch nicht etwa schon wieder aufbrechen, Ludwig?\n@c0@"
  en: "@a@b*: Not leaving us already, are you, Pankraz?\n@c0@"
  es: "@a@b*: ¿Nos dejas ya, Teudis?\n@c0@"
  fr: "@a@b*ⓢ Tu ne nous quittes pas déjà, Petrosⓡ\n@c0@"
  it: "@a@b*: Russel, vai già via?\n@c0@"
  ja: "@a@b＊「やや！　パパスさん\n\tお出かけですか？\n@c0@"
235:
  de: "@aLudwig@bIch unternehme nur einen kurzen Ausflug nach Wittenhausen, mein Guter!\n@c0@"
  en: "@aPankraz@bJust a short trip to Roundbeck, my man, that's all!\n@c0@"
  es: "@aTeudis@b¡Será solo un viaje corto a Golfo Blanco, nada más!\n@c0@"
  fr: "@aPetros@bJe vais juste faire un tour à Blanchecombe, l'ami, rien de plusⓠ\n@c0@"
  it: "@aRussel@bVado a fare un giro a Blankenburg, amico mio.\nSarò di ritorno tra breve.\n@c0@"
  ja: "@a@bパパス「うん　ちょっと\n\tアルカパの町までな。\n@c0@"
236:
  de: "@a@b*: Ach so. Na dann wünsche ich eine gute Reise!\n@c0@"
  en: "@a@b*: I see. Well, have a safe journey!\n@c0@"
  es: "@a@b*: Comprendo. Bueno, ¡que tengas un buen viaje!\n@c0@"
  fr: "@a@b*ⓢ Je vois. Bon voyage, alorsⓠ\n@c0@"
  it: "@a@b*: Capisco.\nBeh, allora fai buon viaggio!\n@c0@"
  ja: "@a@b＊「では　お気をつけて！\n@c0@"
237:
  de: "@aLudwig@bAch, sei doch nicht so! Ich nehme dich trotzdem mit. Du wirst sicher deinen Spaß haben!\n@c0@"
  en: "@aPankraz@bOh, don't be like that! I'm taking you along anyway. I'm sure you'll enjoy it in the end!\n@c0@"
  es: "@aTeudis@b¡Vamos, no seas así! Bueno, te vienes de todas formas. Seguro que al final te lo pasas bien.\n@c0@"
  fr: "@aPetros@bOh, ne fais pas ta tête de muleⓠ Je t'emmène de toute façon. Je suis sûr que tu seras ravi, au finalⓠ\n@c0@"
  it: "@aRussel@bMa davvero?\nE invece ti porterò con me ugualmente!\r\nAllora, vogliamo andare?\n@c0@"
  ja: "@a@bパパス「まあ　そう言わずに\n\t一緒に　行こうではないか！\n@c0@"
238:
  de: "@a@bEs sieht aus wie eine Art Warnschild.\n@c0@"
  en: "@a@bIt looks like it might be some kind of warning sign.\n@c0@"
  es: "@a@bParece una especie de señal de aviso.\n@c0@"
  fr: "@a@bOn dirait une sorte de panneau d'avertissement.\n@c0@"
  it: "@a@bQuesto ha tutta l'aria di essere un avviso importante...\n@c0@"
  ja: "@a@b“危険！　入るな！”\nと書いてあるようだ。\n@c0@"
239:
  de: "@a@bAber %a000090 hat das Lesen noch nicht gelernt!\n@c0@"
  en: "@a@bBut %a000090 hasn't learnt how to read yet!\n@c0@"
  es: "@a@b¡Pero %a000090 aún no sabe leer!\n@c0@"
  fr: "@a@bMais %a000090 ne sait pas encore lireⓠ\n@c0@"
  it: "@a@bMa %a000090 non ha ancora imparato a leggere!\n@c0@"
  ja: "@a@bしかし　%a000090には\nまだ文字が　読めなかった……。\n@c0@"
240:
  de: "@a@b*: Ha-püh... Ha-püh...\n@c0@"
  en: "@a@b*: Ah-phew, ah-phew...\n@c0@"
  es: "@a@b*: Ah, fiuuu, ah, fiuuu...\n@c0@"
  fr: "@a@b*ⓢ Ron-pfff... Ron-pfff...\n@c0@"
  it: "@a@b*: Ronf! Ronf! Argh! Anf...\n@c0@"
  ja: "@a@b＊「ぐうぐう……。\n@c0@"
241:
  de: "@a@b*: Hach! Ich bin so ein Idiot! Mir wurde langweilig, weil ich mich nicht rühren konnte, da bin ich glatt eingeschlafen!\n@c0@"
  en: "@a@b*: Yikes! I'm such a fool! I got bored not being able to move and ended up fallin' asleep!\n@c0@"
  es: "@a@b*: ¡Huy! ¡Qué tonto soy! Como no me puedo mover, me aburría y he acabado por dormirme.\n@c0@"
  fr: "@a@b*ⓢ Heinⓡⓐ Oh, quel idiot je faisⓠ Je m'ennuyais tellement à force de ne pas pouvoir bouger que j'ai fini par m'endormirⓠ\n@c0@"
  it: "@a@b*: Ma tu guarda in che razza di situazione mi sono cacciato! A furia di star qui senza potermi muovere, mi sono addormentato!\n@c0@"
  ja: "@a@b＊「は！　いかん　いかん！\n\t動けないので　いつの間にか\n\tねむってしまったらしい！\n@c0@"
242:
  de: "@a@b*: Ich bin hier nichtsahnend langgelaufen, als plötzlich dieser riesige Felsen auf mich runtergeplumpst ist, weißt du.\n@c0@"
  en: "@a@b*: I was just walkin' along mindin' my own business when this huge rock came tumblin' down on me, y'see.\n@c0@"
  es: "@a@b*: Estaba paseando a mi bola, cuando este enorme pedrusco me cayó encima.\n@c0@"
  fr: "@a@b*ⓢ Je me promenais tranquillement, perdu dans mes pensées, quand cet énorme rocher m'est tombé dessus.\n@c0@"
  it: "@a@b*: Me ne stavo andando in giro per i fatti miei, quando sono stato travolto da questo masso.\n@c0@"
  ja: "@a@b＊「歩いていたら　とつぜん\n\t上から　大きな岩が\n\t落ちてきて……。\n@c0@"
243:
  de: "@a@b*: Wärst du so gütig, dem Brocken einen kleinen Schubs zu geben, Junge? Es braucht sicher nicht viel, um mich zu befreien.\n@c0@"
  en: "@a@b*: I don't suppose I could trouble you to give it a shove, could I, boy? It won't take much to get me free.\n@c0@"
  es: "@a@b*: ¿No te importaría darle un empujoncito, chico? No te costará mucho liberarme.\n@c0@"
  fr: "@a@b*ⓢ Tu ne pourrais pas me donner un coup de main par hasard, mon garçonⓡ Ça ne devrait pas être trop difficile de me libérer.\n@c0@"
  it: "@a@b*: Senti, piccino, non è che potresti dargli una bella spintarella?\nPer favore, dammi una mano...\n@c0@"
  ja: "@a@b＊「坊や　わるいが　この岩を\n\tちょっと　押してくれるか！\n\tもう少しで動かせそうなんだ。\n@c0@"
244:
  de: "@a@b%0%a000090 untersucht den Felsbrocken. Er sieht recht schwer aus, aber es könnte sein, dass er sich bewegen lässt.\n@c0@"
  en: "@a@b%0%a000090 investigates the large rock. It looks quite heavy, but it might just be possible to get it moving.\n@c0@"
  es: "@a@b%0%a000090 investiga la gran roca. Parece pesada, pero quizá sea posible moverla.\n@c0@"
  fr: "@a@b%0%a000090 examine le gros rocher. Il semble assez lourd, mais il devrait être possible de le déplacer.\n@c0@"
  it: "@a@b%0%a000090 osserva la roccia con attenzione.\nAnche se è molto pesante, potrebbe riuscire a spostarla.\n@c0@"
  ja: "@a@b%a000090は　大きな岩を　しらべた。\nかなり重そうだが　なんとか\n動かせるかもしれない！\n@c0@"
245:
  de: "@a@bAllerdings wäre es nicht ratsam, ihn von dieser Seite anzuschieben. Der Mann, der darunter gefangen liegt, würde sonst noch mehr gequetscht werden!\n@c0@"
  en: "@a@bPushing it from this side won't help matters, though. The man trapped underneath would be squashed even more!\n@c0@"
  es: "@a@bEmpujar desde este lado no es una buena idea. ¡Aún sería peor para el hombre que está atrapado debajo!\n@c0@"
  fr: "@a@bCependant, le pousser dans ce sens-là ne servirait pas à grand-chose, sinon à écraser davantage l'homme coincé dessousⓠ\n@c0@"
  it: "@a@bNon spingerla da questo lato!\nIl poveretto che è intrappolato sotto di essa finirebbe per essere schiacciato ancora di più!\n@c0@"
  ja: "@a@bしかし　こちらがわから　押すと\n岩の下じきになってる者を　なおさら\n下じきに　してしまうだろう……。\n@c0@"
