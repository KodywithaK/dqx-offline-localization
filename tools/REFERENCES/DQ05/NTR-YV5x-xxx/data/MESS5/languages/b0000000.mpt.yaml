  en: "@aMrs Whitaker@bHere you go, Pankraz.\nYou have a good night's sleep, eh?\n@c0@"
  es: "@aSra. Doptada@bAquí es, Teudis.\r\nA soñar con los angelitos ¿vale?\n@c0@"
  fr: "@aMadame Alba@bEt voilà, Petros.\nDormez bien, surtout.\n@c0@"
  it: "@aSignora Whitblanche@bEcco qui, Russel.\nBuonanotte, e buon riposo!\n@c0@"
