  es: "@aTeudis@bEs demasiado peligroso que te alejes solo. Debes tener más cuidado en el futuro.\n@c0@"
  fr: "@aPetros@bC'est très dangereux d'aller trop loin tout seul.\r\nTu dois faire plus attention à l'avenir.\n@c0@"
  it: "@aRussel@bQuesta è un'area pericolosa.\nNon puoi andartene in giro da solo, sai?\nSei ancora piccolo! Devi fare più attenzione.\n@c0@"
  ja: "@a@bパパス「まだまだ　おもての\n\tひとり歩きは　キケンだ。\n\tこれからは　気をつけるんだぞ。\n@c0@"
131:
  de: "@aLudwig@bAlso dann, sollen wir aufbrechen?\n@c0@"
  en: "@aPankraz@bNow then, shall we get going?\n@c0@"
  es: "@aTeudis@bBueno, ¿nos vamos?\n@c0@"
  fr: "@aPetros@bBien, si on y allait, cette foisⓡ\n@c0@"
  it: "@aRussel@bForza, andiamo.\n@c0@"
  ja: "@a@bパパス「では　行くとしよう！\n@c0@"
132:
  de: "@a@b*: Du stehst mir im Weg, Alter!\n@c0@"
  en: "@a@b*: You're in my way, old man!\n@c0@"
  es: "@a@b*: ¡Quita del mezzo, vejestorio!\n@c0@"
  fr: "@a@b*ⓢ Pousse-toi de là, vieux bonhommeⓠ\n@c0@"
  it: "@a@b*: E levati di mezzo!\n@c0@"
  ja: "@a@b＊「おじさん　ジャマよ！\n@c0@"
133:
  de: "@aRodrigo Onassetti@bOder sollte ich ⓞTochterⓟ sagen? Eine von ihnen ist unhöflicherweise schon vorgelaufen.\n@c0@"
  en: "@aMr Briscoletti@bOr should I say daughter? One of them has rudely gone on ahead.\n@c0@"
  es: "@aDon Rimaldi@bMa, quizás debería decir hija. Una se ha marchado ya.\n@c0@"
  fr: "@aRodrigo Oscuroni@bOu plutôt ma fille, devrais-je dire. L'une d'elles est déjà partie devant. C'est très malpoli de sa part.\n@c0@"
  it: "@aRick Fosconi@bAnzi, ti appresento solo una figlia, perché altra è già assalita a bordo di nave pochi istanti fa, yes.\n@c0@"
  ja: "@a@bルドマン「と　言っても　一人はもう\n\t奥に行ってしまったが……。\n@c0@"
134:
  de: "@a@b*: Hör zu, heute ist nicht Tag der offenen Tür. Du kannst hier nicht einfach so rumlaufen, als ob dir die Bude gehören würde. Das ist meine Aufgabe.\n@c0@"
  en: "@a@b*: Look, this isn't an open house, you know. You can't just wander around like you own the place. That's my job.\n@c0@"
  es: "@a@b*: Allora, esto no es la jornada de puertas abiertas, ¿capisci? No puedes ir por ahí como si fueras el dueño del lugar. Eso es cosa mía.\n@c0@"
  fr: "@a@b*ⓢ Dis donc, on n'est pas dans un moulin, iciⓠ\nTu n'as pas à te balader partout comme si c'était chez toi. C'est mon boulot, ça.\n@c0@"
  it: "@a@b*: Ehi! Ma che fai?!\nQuesta non è mica casa tua!\n@c0@"
  ja: "@a@b＊「ちょっと　あなた。\n\t勝手に　入ってこないでくれる？\n@c0@"
135:
  de: "@a@b*: Das ist meine Kabine, verstanden?\nAlso gehst du jetzt besser, meinst du nicht?\n@c0@"
  en: "@a@b*: This is my room, got it?\r\nSo you'd better leave, don't you think?\n@c0@"
  es: "@a@b*: Este es il mio camarote.\r\nMejor será que te marches si sabes lo que te conviene, ¿eh?\n@c0@"
  fr: "@a@b*ⓢ Et ici, c'est ma chambre, comprisⓡ\nAlors va voir ailleurs si j'y suis.\n@c0@"
  it: "@a@b*: Questa è la mia stanza, chiaro?\nE adesso vattene.\n@c0@"
  ja: "@a@b＊「ここは　私の部屋なの。\n\tわかったら　早く　出て行って。\n@c0@"
136:
  de: "@a@b%0%a000090%K0090%X'%Ys%Z Wunden werden geheilt!\n@c0@"
  en: "@a@b%0%a000090's wounds are healed!\n@c0@"
  es: "@a@b¡Las heridas de %0%a000090 se curan!\n@c0@"
  fr: "@a@bLes blessures %G0090%Xd'%Yde %Z%a000090 guérissentⓠ\n@c0@"
  it: "@a@b%0%a000090 è guarito!\n@c0@"
  ja: "@a@b%a000090のキズが　かいふくした！\n@c0@"
137:
  de: "@a@b%0%a000090%K0090%X'%Ys%Z Wunden werden geheilt!\n@c0@"
  en: "@a@b%0%a000090's wounds are healed!\n@c0@"
  es: "@a@b¡Las heridas de %0%a000090 se curan!\n@c0@"
  fr: "@a@bLes blessures %G0090%Xd'%Yde %Z%a000090 guérissentⓠ\n@c0@"
  it: "@a@b%0%a000090 è guarito!\n@c0@"
  ja: "@a@b%a000090のキズが　かいふくした！\n@c0@"
138:
  de: "@a@b*: Da soll mich doch...! Wenn das nicht der gute alte Ludwig ist! Wo hast du denn in den letzten beiden Jahren gesteckt?\n@c0@"
  en: "@a@b*: Goodness me! If it isn't old Pankraz!\r\nWherever have you been these past two years?\n@c0@"
  es: "@a@b*: ¡Por la Diosa! ¡Pero si es el viejo Teudis!\r\n¿Qué ha sido de ti estos últimos dos años?\n@c0@"
  fr: "@a@b*ⓢ Mince alorsⓠ Mais c'est ce bon vieux Petrosⓠ\nOù étais-tu passé, ces deux dernières annéesⓡ\n@c0@"
  it: "@a@b*: Santo cielo! Ma tu sei Russel!\nSaranno due anni che non ci vediamo!\nMa dov'eri finito?\n@c0@"
  ja: "@a@b＊「やや！　パパスさんでは！？\n\t２年も　村を出たまま\n\tいったい　どこに……！？\n@c0@"
139:
  de: "@a@b*: Aber egal. Es ist schön, dass du wieder hier bist, und das ist alles, was zählt.\n@c0@"
  en: "@a@b*: Never mind that. It's good to see you back,\r\nand that's all that matters.\n@c0@"
  es: "@a@b*: Es igual. Me alegro de verte, eso es lo que importa.\n@c0@"
  fr: "@a@b*ⓢ Bah, peu importe. Tout ce qui compte, c'est que tu sois de retour.\n@c0@"
  it: "@a@b*: Ah, non importa.\nQuello che conta è che sei tornato.\nChe piacere rivederti!\n@c0@"
  ja: "@a@b＊「ともかく　お帰りなさい！\n@c0@"
140:
  de: "@a@b*: Aber ich sollte hier nicht einfach nur rumstehen und quasseln. Ich muss allen von dieser guten Neuigkeit berichten!\n@c0@"
  en: "@a@b*: I mustn't just stand here chattin' away,\r\nthough. I need to tell everyone the good\r\nnews that you're back!\n@c0@"
  es: "@a@b*: Pero no debo quedarme aquí parado de cháchara. Tengo que avisar a todos de la buena nueva: ¡has vuelto!\n@c0@"
  fr: "@a@b*ⓢ Mais je ne peux pas rester là à bavarder. Il faut que j'annonce la bonne nouvelle à tout le mondeⓠ\n@c0@"
  it: "@a@b*: Vado subito a dare la buona notizia agli altri!\nCi vediamo dopo!\n@c0@"
  ja: "@a@b＊「おっと　こうしちゃいられない。\n\tみんなに　知らせなくっちゃ！\n@c0@"
141:
  de: "@a@b*: Leute, hört mal her!\nLudwig ist zurück!\n@c0@"
  en: "@a@b*: Attention everyone!\r\nPankraz has returned!\n@c0@"
  es: "@a@b*: ¡Prestadme atención!\r\n¡Teudis ha regresado!\n@c0@"
  fr: "@a@b*ⓢ Écoutez-moi, tout le mondeⓠ\nPetros est de retourⓠ\n@c0@"
  it: "@a@b*: Ehi! Ho una grande notizia!\nRussel è tornato!\n@c0@"
  ja: "@a@b＊「おーい！　パパスさんが\n\t帰ってきたぞーっ！！\n@c0@"
142:
  de: "@a@b*: Da bist du ja, Ludwig!\nAlso lebst du noch!\n@c0@"
  en: "@a@b*: There you are, Pankraz!\r\nSo you're still alive!\n@c0@"
  es: "@a@b*: Vaya, si es Teudis.\r\n¿Así que estás vivo?\n@c0@"
  fr: "@a@b*ⓢ Te voilà de retour, Petrosⓠ\nEt bien vivant, à ce que je voisⓠ\n@c0@"
  it: "@a@b*: Ecco il nostro Russel!\r\nMi fa piacere vedere che stai bene!\n@c0@"
  ja: "@a@b＊「パパスさん！\n\tあんた　生きてたんだね！\n@c0@"
143:
  de: "@a@b*: Ach du meine Güte! Das ist doch nicht etwa dein kleiner Junge? Wie groß er geworden ist!\n@c0@"
  en: "@a@b*: My, oh my! That can't be that little lad of yours, surely? Hasn't he grown!\n@c0@"
  es: "@a@b*: ¡Vaya, vaya! ¿No será este tu chiquillo? ¡Lo que ha crecido!\n@c0@"
  fr: "@a@b*ⓢ Nom de nomⓠ Ne me dis pas que c'est ton petit garçon qui est làⓠ Qu'est-ce qu'il a grandiⓠ\n@c0@"
  it: "@a@b*: Non mi dire che questo giovanotto è tuo figlio...!\nAccidenti, quant'è cresciuto!\n@c0@"
  ja: "@a@b＊「おや　その子が　あのときの？\n\t大きくなったね　坊や。\n@c0@"
144:
  de: "@a@b*: Wie dem auch sei, wieso kommst du nicht mal abends in meine Kneipe und trinkst 'nen Schluck, Ludwig? \n@c0@"
  en: "@a@b*: Anyway, why don't you pop in for a drink at my pub one night, eh, Pankraz?\n@c0@"
  es: "@a@b*: En fin, ¿por qué no te pasas a tomar algo por mi taberna una noche, Teudis?\n@c0@"
  fr: "@a@b*ⓢ Mais bref... Que dirais-tu de passer prendre un verre dans ma taverne, un de ces soirs, hein, Petrosⓡ\n@c0@"
  it: "@a@b*: Senti, perché una di queste sere non vieni a bere un succo d'uva nel mio locale, eh?\r\nOffre la casa!\n@c0@"
  ja: "@a@b＊「パパスさん　夜にでも\n\tうちの酒場に　よっておくれよ。\n@c0@"
145:
  de: "@a@b*: Meine Stammgäste würden sich bestimmt freuen, wenn du ihnen ein bisschen von deinen Abenteuern erzählst.\n@c0@"
  en: "@a@b*: I'm sure the regulars would love to hear a few tales about your adventures.\n@c0@"
  es: "@a@b*: Seguro que a los habituales les encantará oír unas cuantas de tus aventuras.\n@c0@"
  fr: "@a@b*ⓢ Je suis sûr que les habitués adoreraient t'entendre parler un peu de tes aventures.\n@c0@"
  it: "@a@b*: Siamo tutti curiosi di sapere cos'hai fatto in tutto questo tempo.\nChissà quante ne avrai da raccontare...\n@c0@"
  ja: "@a@b＊「みんな　あんたの旅の話を\n\t聞きたがるはずだ！\n@c0@"
146:
  de: "@a@b*: Du bist wieder da, Ludwig!\nSchön dich zu sehen, Kumpel!\n@c0@"
  en: "@a@b*: You're back, Pankraz!\r\nGood to see ya, mate!\n@c0@"
  es: "@a@b*: ¡Has vuelto, Teudis!\r\n¡Me alegro de verte, amigo!\n@c0@"
  fr: "@a@b*ⓢ T'es de retour, Petrosⓠ\nÇa fait plaisir de te revoir, vieuxⓠ\n@c0@"
  it: "@a@b*: Ahò, ma è Russel!\r\nAnvedi che sorpresa!\n@c0@"
  ja: "@a@b＊「よう！　パパス！\n\tやっと帰って来たな！\n@c0@"
147:
  de: "@a@b*: Ich weiß, dass wir nicht immer einer Meinung waren, aber du hast mir trotzdem irgendwie gefehlt.\n@c0@"
  en: "@a@b*: I know we didn't always see eye to eye,\r\nbut I've bin missin' seein' you around.\n@c0@"
  es: "@a@b*: Ya sé que no siempre estábamos de acuerdo, pero te he echado de menos.\n@c0@"
  fr: "@a@b*ⓢ J'sais bien qu'on n'avait pas toujours les mêmes idées, toi et moi, mais ça m'a manqué de plus te voir dans les parages.\n@c0@"
  it: "@a@b*: 'Mmazza ahò! Era 'na cifra che nun te vedevo!\n'O sai?\nMe mancaveno 'e litigate che ce facevamo...\n@c0@"
  ja: "@a@b＊「あんたとは　ケンカばかり\n\tしてたけどよう\n\tいなくなると　さびしくて……。\n@c0@"
148:
  de: "@a@b*: Komm vorbei, wenn sich die Lage etwas beruhigt hat, dann können wir 'n paar alte Rechnungen begleichen, hm?\n@c0@"
  en: "@a@b*: Come by when things 'ave calmed down a bit and we'll settle old scores, eh?\n@c0@"
  es: "@a@b*: Pásate cuando todo esté más tranquilo y hablamos, ¿eh?\n@c0@"
  fr: "@a@b*ⓢ Viens m'voir quand les choses se seront un peu calmées, et on réglera nos vieux comptes, d'accordⓡ\n@c0@"
  it: "@a@b*: Fatte vede' quanno c'hai tempo, così ripijamo a discute'...\nStamme bene!\n@c0@"
  ja: "@a@b＊「おちついたら　また\n\tつもる話を　聞かせてくれよな。\n@c0@"
149:
  de: "@a@b*: Also stimmt es! Du bist wirklich zurück,\nLudwig! Willkommen daheim!\n@c0@"
  en: "@a@b*: So it's true! You really are back, Pankraz! Welcome home!\n@c0@"
  es: "@a@b*: ¡Era verdad! ¡Has vuelto, Teudis! ¡Bienvenido a casa!\n@c0@"
  fr: "@a@b*ⓢ C'est donc vraiⓠ Tu es vraiment revenu, Petrosⓠ Bienvenue chez toiⓠ\n@c0@"
  it: "@a@b*: Ma allora è vero!\nRussel, sei proprio tu!\nBentornato a casa!\n@c0@"
  ja: "@a@b＊「やあ　本当に　パパスさんだ！\n\tどうも　お帰りなさい！\n@c0@"
150:
  de: "@a@b*: Im Dorf kursierten die wildesten Gerüchte, als du weg warst, das kann ich dir sagen!\n@c0@"
  en: "@a@b*: The village was full of gossip about you while you were away, I can tell you!\n@c0@"
  es: "@a@b*: ¡El pueblo fue un hervidero de rumores sobre ti mientras estuviste fuera!\n@c0@"
  fr: "@a@b*ⓢ Je peux te dire que les rumeurs allaient bon train au village, en ton absenceⓠ\n@c0@"
  it: "@a@b*: Qui al villaggio se ne sono dette di tutti i colori sulla tua partenza, sai?\n@c0@"
  ja: "@a@b＊「パパスさんが　いないあいだ\n\tみんな　パパスさんの\n\tウワサばかり　してたんですよ。\n@c0@"
151:
  de: "@a@b*: Ah, der Herr Ludwig.\nWie wunderbar, Euch in so guter Verfassung zu sehen.\n@c0@"
  en: "@a@b*: Ah, Mr Pankraz, sir.\nHow wonderful it is to see you lookin' so well.\n@c0@"
  es: "@a@b*: Ah, Sr. Teudis.\r\nEs fantástico verle en tan buen estado de salud.\n@c0@"
  fr: "@a@b*ⓢ Ah, Monsieur Petros.\nC'est merveilleux de vous voir si bien portant.\n@c0@"
  it: "@a@b*: Ah, Russel! Che piacere rivederti!\nSono felice di vedere che stai bene.\n@c0@"
  ja: "@a@b＊「これは　パパスどの。\n\tよくぞ無事で　もどられました。\n@c0@"
152:
  de: "@a@b*: Der Göttin sei Dank, dass sie Euch heil zu uns zurückgebracht hat! Preiset die Göttin!\n@c0@"
  en: "@a@b*: Praise the Goddess for deliverin' you home to us safe and sound! Glory be to the Goddess!\n@c0@"
  es: "@a@b*: ¡Alabada sea la Diosa por traerle a casa sano y salvo! ¡Gloria a la Diosa!\n@c0@"
  fr: "@a@b*ⓢ Louée soit la Déesse de vous avoir ramené chez nous sain et saufⓠ Gloire à la Déesseⓠ\n@c0@"
  it: "@a@b*: Sia lodata la dea che ti ha fatto tornare a casa sano e salvo!\nRingraziamo la nostra protettrice misericordiosa!\n@c0@"
  ja: "@a@b＊「きっと　神さまが\n\tあなたがた親子を　お守りして\n\tくれたのでしょう。\n@c0@"
153:
  de: "@a@b*: Ich bitte um Verzeihung.\nIch habe mich von meinen Gefühlen mitreißen lassen.\n@c0@"
  en: "@a@b*: I beg your pardon.\r\nI seem to have got rather carried away.\n@c0@"
  es: "@a@b*: Ejem, discúlpeme.\r\nCreo que me he excedido un poco.\n@c0@"
  fr: "@a@b*ⓢ Je vous demande pardon.\nJe me suis laissée emporter.\n@c0@"
  it: "@a@b*: Sei stato via parecchio tempo, e non sapevamo che fine avessi fatto. Ecco, non vorrei lasciarmi trasportare dall'entusiasmo, ma...\n@c0@"
  ja: "@a@b＊「と　かたくるしいことは\n\tやめにしましょう……。\n@c0@"
154:
  de: "@a@b*: Aber Ihr seid wieder zurück! Wieder zurück! Ludwig ist zurück! Ich bin ja so froh! Froh und glücklich!\n@c0@"
  en: "@a@b*: But you're home! You're home! Pankraz is home!\r\nI'm so happy! H-A-P-P-Y! Happy!\n@c0@"
  es: "@a@b*: ¡Pero ha vuelto! ¡Ha vuelto! ¡Teudis ha vuelto!\r\n¡Soy tan feliz! ¡F-E-L-I-Z! ¡Feliz!\n@c0@"
  fr: "@a@b*ⓢ Mais vous voilà de retourⓠ Rentré chez vousⓠ Petros est rentréⓠ Je suis si heureuseⓠ\nH-E-U-R-E-U-S-Eⓠ\n@c0@"
  it: "@a@b*: Ma sei a casa! Sei tornato!\nRussel è tornato!\nChe gioia! Che felicità! Che meraviglia!\n@c0@"
  ja: "@a@b＊「わ～い　パパスさんが\n\t帰ってきた！　うれしい～！\n\tわ～い　わ～い！\n@c0@"
155:
  de: "@aSancho@bS-Señor! Ihr seid zurück!\nEs ist schön, Euss zu sehen!\n@c0@"
  en: "@aSancho@bSeñor! You have returned!\nEes eso good to esee you!\n@c0@"
  es: "@aSancho@b¡Señor! ¡Pos si ya regresó!\r\n¡Estoy retecontento de verlo!\n@c0@"
  fr: "@aSancho@bS-Señorⓠ Vous êtes revenuⓠ\nC'est oun si grand plaisir de vous revoirⓠ\n@c0@"
  it: "@aSancho@b¡Señor Russel!\n¡Sei tornato a casa!\n¡Ay, que bueno!\n@c0@"
  ja: "@a@bサンチョ「だっ　だんなさま！\n\tお帰りなさいませ！\n@c0@"
156:
  de: "@aSancho@bIss habe mit angehaltenem Atem auf Euss gewartet.\n@c0@"
  en: "@aSancho@bI have been waiting for you weeth\r\nbated breath.\n@c0@"
  es: "@aSancho@b¡Órale! Le estuve esperando con ansia.\n@c0@"
  fr: "@aSancho@bJe vous attendais avec oune grande impatienceⓠ\n@c0@"
  it: "@aSancho@b¡Soy muy feliz de rivederte!\n@c0@"
  ja: "@a@bサンチョ「このサンチョ\n\tだんなさまの　おもどりを\n\tどれほど待ちわびたことか……。\n@c0@"
157:
  de: "@aSancho@bKommt! Tretet doch ein, Señor.\n@c0@"
  en: "@aSancho@bCome! Come eenside, señor.\n@c0@"
  es: "@aSancho@b¡Venga! ¡Entre, señor!\n@c0@"
  fr: "@a@bEntrezⓠ Entrez, señor.\n@c0@"
  it: "@aSancho@b¡Entra, señor, entra!\n@c0@"
  ja: "@a@bサンチョ「さあ　ともかく　中へ！\n@c0@"
158:
  de: "@a@b*: Willkommen daheim, Herr Ludwig!\n@c0@"
  en: "@a@b*: Welcome home, Mr Pankraz!\n@c0@"
  es: "@a@b*: ¡Bienvenido a casa, Sr. Teudis!\n@c0@"
  fr: "@a@b*ⓢ Bienvenue, Monsieur Petrosⓠ\n@c0@"
  it: "@a@b*: Bentornato a casa, signor Russel!\n@c0@"
  ja: "@a@b＊「おじさま\n\tお帰りなさい。\n@c0@"
159:
  de: "@aLudwig@b???\n@c0@"
  en: "@aPankraz@b???\n@c0@"
  es: "@aTeudis@b???\n@c0@"
  fr: "@aPetros@bⓡⓑⓑ\n@c0@"
  it: "@aRussel@b???\n@c0@"
  ja: "@a@bパパス「？？？\n@c0@"
160:
  de: "@aLudwig@bUnd wer ist dieses Mädchen, bitteschön?\n@c0@"
  en: "@aPankraz@bAnd who might this girl be?\n@c0@"
  es: "@aTeudis@b¿Y esta chica?, ¿quién es?\n@c0@"
  fr: "@aPetros@bMais qui est cette jeune demoiselleⓡ\n@c0@"
  it: "@aRussel@bE chi è questa bella signorina?\n@c0@"
  ja: "@a@bパパス「この女の子は？\n@c0@"
161:
  de: "@a@b*: Das ist meine Tochter!\n@c0@"
  en: "@a@b*: That's my daughter!\n@c0@"
  es: "@a@b*: ¡Es mi hija!\n@c0@"
  fr: "@a@b*ⓢ C'est ma filleⓠ\n@c0@"
  it: "@a@b*: È mia figlia.\n@c0@"
  ja: "@a@b＊「あたしの娘だよ　パパス！\n@c0@"
162:
  de: "@aLudwig@bOh ja! Ich kenne dich! Du bist doch die Frau vom alten Weißi, aus dem Nachbardorf, nicht?\n@c0@"
  en: "@aPankraz@bOh yes! I know you! You're old Whitey's wife from the village nearby, aren't you?\n@c0@"
  es: "@aTeudis@b¡Ah, sí! ¡Te reconozco! Eres la mujer del viejo Doptada, del pueblo de al lado, ¿verdad?\n@c0@"
  fr: "@aPetros@bMais ouiⓠ Je vous reconnaisⓠ Vous êtes la femme de monsieur Alba, du village voisin, c'est çaⓡ\n@c0@"
  it: "@aRussel@bOh, ma certo! Mi ricordo di te!\nSei la moglie del signor Whitblanche!\n@c0@"
  ja: "@a@bパパス「やあ！　となり町に住む\n\tダンカンの　おかみさん\n\tじゃないか！\n@c0@"
163:
  de: "@aSancho@bSi, Señora Weißner, sie kam aus Wittenhausen hierher, um Medizin zu holen für Señor Weißner, ihren Mann.\n@c0@"
