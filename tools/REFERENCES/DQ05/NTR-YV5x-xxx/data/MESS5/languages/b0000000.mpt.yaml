34:
  de: "@a@b*: Wenn du zur Kombüse oder zum Matrosenquartier willst, dann nimm die Treppe dort und geh die Stufen am Heck des Schiffes runter.\n@c0@"
  en: "@a@b*: If you want to go to the galley or the sailors' quarters, take the stairs just there and then go down the steps at the rear of the ship.\n@c0@"
  es: "@a@b*: Si quieres ir a la cocina o a las dependencias de los marineros, ve por esas escaleras y luego baja por la parte trasera del barco.\n@c0@"
  fr: "@a@b*ⓢ Si tu veux aller dans la cuisine ou dans le quartier de l'équipage, monte ces escaliers, puis descends les marches à l'arrière du navire.\n@c0@"
  it: "@a@b*: Se vuoi fare un giro nella cambusa o negli alloggi dei marinai, vai su per le scale e poi scendi i gradini a poppa.\n@c0@"
