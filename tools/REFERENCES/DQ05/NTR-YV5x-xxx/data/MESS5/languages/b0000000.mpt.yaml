  it: "@aSignora Whitblanche@bRussel!\nNon vorrai mica andartene adesso, eh?!\n@c0@"
  ja: "@a@b＊「パパスさん　パパスさん\n\tこのまま　帰るなんて\n\tとんでもない！\n@c0@"
311:
