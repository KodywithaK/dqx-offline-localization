  en: "@a@b*: I thought so!\r\nSo you made it back safely, did you?\n@c0@"
  es: "@a@b*: ¡Estaba seguro!\r\nHas regresado sano y salvo, pues.\n@c0@"
  fr: "@a@b*ⓢ C'est bien ce que je me disaisⓠ\nAlors tu es revenu sain et sauf, heinⓡ\n@c0@"
  it: "@a@b*: Sì! È proprio Russel!\nBentornato, amico mio!\nNon credevo che avrei rivisto il tuo brutto muso!\n@c0@"
  ja: "@a@b＊「やっぱり　パパスさんじゃないかっ！\n\t無事に　帰ってきたんだね！\n@c0@"
