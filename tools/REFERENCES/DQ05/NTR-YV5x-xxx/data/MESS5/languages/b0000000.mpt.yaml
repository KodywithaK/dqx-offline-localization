277:
  de: "@a@b*: Vor langer, langer Zeit lebten ein mächtiger Graf und seine hübsche Gräfin drüben in den Geisterzinnen.\n@c0@"
  en: "@a@b*: Long, long ago, a mighty count and a beautiful countess lived over at Uptaten Towers.\n@c0@"
  es: "@a@b*: Hace mucho, mucho tiempo, vivían en las Torres Alverres un poderoso conde y una hermosa condesa.\n@c0@"
  fr: "@a@b*ⓢ Il y a de cela bien longtemps, vivaient dans les tours Karpatt un puissant comte et une belle comtesse.\n@c0@"
  it: "@a@b*: Tanti tanti tanti anni fa, nel Palazzo delle Ombre vivevano un potente conte e la sua bellissima consorte...\n@c0@"
  ja: "@a@b＊「むかしむかし　レヌールの城には\n\tたくましい王と　美しい王妃が\n\t住んでいました。\n@c0@"
278:
  de: "@a@b*: Doch sie konnten keine Kinder bekommen, also war der Ort nach ihrem Tod leer und verlassen.\n@c0@"
  en: "@a@b*: But they were unable to have children, and the place was left deserted and empty after their deaths.\n@c0@"
  es: "@a@b*: Pero no pudieron tener hijos y, cuando murieron, el lugar quedó abandonado y desierto.\n@c0@"
  fr: "@a@b*ⓢ Mais ils ne pouvaient avoir d'enfants, et après leur mort, les tours restèrent vides et abandonnées.\n@c0@"
  it: "@a@b*: La coppia non aveva figli e così, alla morte dei due nobili, il Palazzo delle Ombre restò disabitato.\n@c0@"
  ja: "@a@b＊「しかし　２人には　子供ができず\n\tいつしか王家も絶え　お城には\n\t誰もいなくなったのでした……。\n@c0@"
279:
  de: "@a@b*: Dennoch ist des Nachts immer noch ein Schluchzen zu hören, das aus dem Inneren der Schlossmauern zu dringen scheint.\n@c0@"
  en: "@a@b*: And yet, night after night, sounds of crying can still be heard coming from within the castle walls.\n@c0@"
  es: "@a@b*: Sin embargo, cada noche se pueden oír llantos que vienen del interior de los muros del castillo.\n@c0@"
  fr: "@a@b*ⓢ Pourtant, nuit après nuit, on continue d'entendre des pleurs résonner à l'intérieur des murs du château.\n@c0@"
  it: "@a@b*: Ancora oggi, però, ogni notte si odono urla e pianti disperati provenire dal castello...\n@c0@"
  ja: "@a@b＊「ところが　そのレヌール城から\n\t夜な夜な　すすり泣く声が\n\t聞こえてくるという。\n@c0@"
280:
  de: "@a@b*: Damit ist die Geschichte zu Ende! Na, was meinst du, Kleiner! Ziemlich gruselig, nicht?\n@c0@"
  en: "@a@b*: The end! What d'you reckon to that, son? Pretty scary stuff, eh!?\n@c0@"
  es: "@a@b*: ¡Fin! ¿Qué te parece, chaval? Da miedo, ¿que no?\n@c0@"
  fr: "@a@b*ⓢ Fin de l'histoireⓠ\nAlors, qu'est-ce que tu dis de ça, petitⓡ\nPlutôt effrayant, nonⓡⓐ\n@c0@"
  it: "@a@b*: Fine della storia!\nScommetto che stai tremando dalla paura, eh?\n@c0@"
  ja: "@a@b＊「と　お話は　ここまで。\n\tどうだい坊や。　こわかっただろ？\n@c0@"
281:
  de: "@a@b*: Wenn ich du wäre, würde ich mich von den Geisterzinnen fernhalten.\n@c0@"
  en: "@a@b*: I'd steer well clear of Uptaten Towers if\r\nI was you.\n@c0@"
  es: "@a@b*: Yo en tu lugar no me acercaría a las Torres Alverres esas.\n@c0@"
  fr: "@a@b*ⓢ À ta place, je n'irais pas traîner du côté des tours Karpatt.\n@c0@"
  it: "@a@b*: La morale della favola è semplice: non pensare nemmeno di avvicinarti al Palazzo delle Ombre!\n@c0@"
  ja: "@a@b＊「ともかく　レヌール城には\n\t近づいちゃいけないよっ。\n@c0@"
282:
  de: "@a@b*: Ich durchreise die Welt auf der Suche nach ausgefallenem Geschirr und dergleichen.\n@c0@"
  en: "@a@b*: I'm travelling the world collecting unusual tableware and the like.\n@c0@"
  es: "@a@b*: Viajo por el mundo recogiendo cubiertos peculiares y cosas así.\n@c0@"
  fr: "@a@b*ⓢ Je voyage à travers le monde pour trouver de la vaisselle rare et autres choses de ce genre.\n@c0@"
  it: "@a@b*: Io giro per il mondo alla ricerca di stoviglie e posate di gran pregio.\n@c0@"
  ja: "@a@b＊「私は　世界の\n\tめずらしい食器を　集めて\n\t旅をしています。\n@c0@"
283:
  de: "@a@b*: Ich habe gehört, dass Graf Krypto zum Teetrinken das sogenannte ⓞEtepetete-Teeserviceⓟ verwendete. Es war aus Silber.\n@c0@"
  en: "@a@b*: I heard that Count Uptaten used to drink tea from something called a ⓗtoff's tea setⓘ. Made of silver, it was.\n@c0@"
  es: "@a@b*: He oído decir que el conde Alverres solía tomar té en algo llamado ⓕjuego de té repipiⓖ. Y era de plata.\n@c0@"
  fr: "@a@b*ⓢ J'ai entendu dire que le comte Karpatt buvait son thé dans quelque chose appelé ⓥservice à thé de luxeⓦ. Tout en argent, paraît-il.\n@c0@"
  it: "@a@b*: Ho sentito dire che il Conte De' Functis sorbiva il tè usando il ⓕsontuoso servizio da tèⓖ.\nEra tutto in argento, sai?\n@c0@"
  ja: "@a@b＊「かつて　レヌール王は\n\t王家に伝わる　銀のティーセットで\n\tお茶を楽しんでいたとか……。\n@c0@"
284:
  de: "@a@b*: Das ist Wittenhausen. Wenn du nach Norden gehst, kommst du zu den Geisterzinnen.\n@c0@"
  en: "@a@b*: This here's Roundbeck. If you head north from here, you come to Uptaten Towers.\n@c0@"
  es: "@a@b*: Esto es Golfo Blanco. Si vas hacia el norte desde aquí llegarás a las Torres Alverres.\n@c0@"
  fr: "@a@b*ⓢ Nous sommes ici à Blanchecombe. En partant du village vers le nord, on arrive aux tours Karpatt.\n@c0@"
  it: "@a@b*: Qui ci troviamo a Blankenburg.\nProcedendo verso nord, si arriva al misterioso Palazzo delle Ombre.\n@c0@"
  ja: "@a@b＊「ここは　アルカパの町。\n\t北に行くと　レヌールの城が\n\tありますわ。\n@c0@"
285:
  de: "@a@b*: Nicht du schon wieder! Ihr jungen Racker werdet mich noch ins Grab bringen!\n@c0@"
  en: "@a@b*: Not you again! You young hooligans will be the death of me!\n@c0@"
  es: "@a@b*: ¡¿Otra vez vosotros?! ¡Vais a acabar conmigo, gamberros!\n@c0@"
  fr: "@a@b*ⓢ Ah non, encore toiⓠ \n... Ces petits délinquants vont finir par me tuerⓠ\n@c0@"
  it: "@a@b*: Ancora?!\nEh, no!\nQuando è troppo è troppo!\n@c0@"
  ja: "@a@b＊「また　来たなっ！\n\tこの　ワルガキめ！\n@c0@"
286:
  de: "@a@b*: Oh, warte mal! Du bist ja keiner von diesen kleinen Teufeln, die sonst hier reinkommen.\n@c0@"
  en: "@a@b*: Oh, wait a minute! You're not one of the usual little ruffians I have in here.\n@c0@"
  es: "@a@b*: ¡Espera un momento! Tú no eres uno de esos granujas que suelen venir por aquí.\n@c0@"
  fr: "@a@b*ⓢ Oh, attends une secondeⓠ Tu n'es pas l'un de ces petits voyous que je vois passer d'habitude.\n@c0@"
  it: "@a@b*: Oh, scusami.\nTi avevo preso per uno di quei piccoli rompiscatole che vengono a disturbarmi mentre lavoro...\n@c0@"
  ja: "@a@b＊「おや？　坊やは\n\tいつもの子と　ちがうな……。\n@c0@"
287:
  de: "@a@b*: Aber trotzdem stehst du mir im Weg!\nNa los, raus mit dir!\n@c0@"
