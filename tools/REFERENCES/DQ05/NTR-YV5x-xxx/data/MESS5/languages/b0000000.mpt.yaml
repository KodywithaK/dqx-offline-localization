  it: "@a@b*: D'accordo, te lo darò.\nDopotutto, mi ero scocciato di torturarlo...\n@c0@"
  ja: "@a@b＊「そうだなあ。　いじめるのも\n\tあきてきたし　欲しいなら\n\tあげてもいいけどさ。\n@c0@"
296:
