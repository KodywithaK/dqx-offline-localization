  ja: "@a@b＊「かわったネコだろ！？\n\t変な声で　なくから面白いぜっ。\n@c0@"
292:
  de: "@a@b*: Komm schon! Schnurr noch mal, Mieze!\n@c0@"
  en: "@a@b*: Go on! Purr again, puss!\n@c0@"
  es: "@a@b*: ¡Vamos! ¡Haz ron-ron, minino!\n@c0@"
