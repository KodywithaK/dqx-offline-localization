247:
  de: "@a@bDen Felsen schieben?\n@c0@"
  en: "@a@bPush the rock?\n@c0@"
  es: "@a@b¿Empujar la roca?\n@c0@"
  fr: "@a@bPousser le rocherⓡ\n@c0@"
  it: "@a@bVuoi spingere la roccia?\n@c0@"
  ja: "@a@bこの岩を　押してみますか？\n@c0@"
248:
