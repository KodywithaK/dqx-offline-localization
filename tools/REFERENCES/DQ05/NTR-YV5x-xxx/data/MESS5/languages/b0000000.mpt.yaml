  ja: "@a@b＊「そりゃいいや！\n\tレヌール城の　お化け退治と\n\t交換だな！\n@c0@"
298:
  de: "@a@b*: Die Katze gehört dir, sobald du die Gespenster drüben in den Geisterzinnen besiegt hast.\n@c0@"
  en: "@a@b*: The cat's yours as soon as you defeat those ghosts over at Uptaten Towers.\n@c0@"
