  fr: "@a@b*ⓢ Le chat sera à toi dès que tu auras vaincu les fantômes des tours Karpatt.\n@c0@"
  it: "@a@b*: Sconfiggi i fantasmi che vivono nel Palazzo delle Ombre e potrai prenderti quest'affare miagolante!\n@c0@"
  ja: "@a@b＊「レヌール城の　お化けを\n\t退治したら　このネコを\n\tあげるよ！\n@c0@"
299:
  de: "@a@b*: Wenn du die Katze willst, solltest du besser rüber zu den Geisterzinnen latschen und damit anfangen, ein paar Gespenster zu verkloppen!\n@c0@"
