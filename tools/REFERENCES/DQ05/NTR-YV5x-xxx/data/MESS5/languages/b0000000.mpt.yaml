  it: "@aRussel@bDomattina dovremo alzarci presto per tornare a casa, altrimenti i nostri amici di Valcava si chiederanno che fine abbiamo fatto...\n㈡\nNon voglio che stiano in ansia per noi.\n@c0@"
  ja: "@a@bパパス「さてと……。\n\t明日は　早く出るぞ。\n\t村の皆が　待っているからな。\n@c0@"
