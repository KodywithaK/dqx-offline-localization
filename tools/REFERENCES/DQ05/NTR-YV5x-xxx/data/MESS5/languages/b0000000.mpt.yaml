  fr: "@aPetros@bDans ce cas, notre voyage touche à sa fin.\nEs-tu prêt à débarquerⓡ\n@c0@"
  it: "@aRussel@bBene, il nostro viaggio per mare finisce qui.\nAvanti, si torna sulla terraferma!\n@c0@"
  ja: "@a@bパパス「では　長い船旅であったが\n\tこの船とも　お別れだ。\n\t降りるとするか？\n@c0@"
100:
  de: "@aLudwig@bNun, Kapitän! Noch einmal vielen Dank für alles.\nIch wünsche Euch eine sichere Weiterreise!\n@c0@"
  en: "@aPankraz@bWell, Captain! Thanks again for everything.\r\nHave a safe onward journey!\n@c0@"
