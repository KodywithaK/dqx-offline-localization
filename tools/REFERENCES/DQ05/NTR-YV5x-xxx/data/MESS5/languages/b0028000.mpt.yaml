  en: "@a@b*: Well, that's a disappointment. I was planning on giving you some scintillating sinter in return, as well...\n@c0@"
  es: "@a@b*: Vaya, qué decepción. Pensaba dar%H0860%Xte%Yos%Z unas sales destellantes a cambio, pero ya no %H0860%Xte%Yos%Z las doy.\n@c0@"
  fr: "@a@b*ⓢ Je suis vraiment déçu. Je comptais vous donner des sels scintillants pour vous remercier...\n@c0@"
  it: "@a@b*: Ah, ma perché?! In cambio %H0860%Xti%Yvi%Z avrei offerto dei sali da bagno scintillanti!\nNon la volevo mica gratis, %H0860%Xsai%Ysapete%Z?\n@c0@"
  ja: "@a@b＊「それは　残念です。\n\tせっかく　お礼に　秘湯の花を\n\tさしあげようと思ったのに……。\n@c0@"
58:
  de: "@a@b*: Ja, es gibt nichts Hübscheres als eine Wüstenrose.\n@c0@"
  en: "@a@b*: Yep, there's nothing prettier than a desert rose.\n@c0@"
  es: "@a@b*: La rosa del desierto es la cosa más bonita que hay.\n@c0@"
  fr: "@a@b*ⓢ Il n'y a rien de plus beau qu'une rose des sables.\n@c0@"
  it: "@a@b*: Non esiste al mondo nulla di più bello di una rosa del deserto.\n@c0@"
  ja: "@a@b＊「いやいや　さばくのバラは\n\t美しいですね。\n@c0@"
59:
  de: "@a@b*: Apropos, habt Ihr schon mal von einer Treuekarte gehört? Beim Einkaufen soll sie ganz schön nützlich sein.\n@c0@"
  en: "@a@b*: By the way, have you ever heard of a loyalty card? It can make all the difference to your shopping experience, apparently.\n@c0@"
  es: "@a@b*: Por cierto, ¿%H0860%Xsabes%Ysabéis%Z lo que es una tarjeta de cliente? Parece que puede cambiar tu perspectiva sobre las compras.\n@c0@"
  fr: "@a@b*ⓢ À propos, avez-vous déjà entendu parler d'une carte de fidélitéⓡ Il paraît que ça vaut vraiment le coup quand vous faites des achats.\n@c0@"
  it: "@a@b*: %H0860%XHai%YAvete%Z mai sentito parlare della tessera sconto?\nA sentire chi la possiede, è utilissima quando si fanno acquisti!\n@c0@"
  ja: "@a@b＊「ところで　買い物がとっても\n\tおトクになる　ゴールドカードという\n\t便利なモノを　知ってますか？\n@c0@"
60:
  de: "@a@b*: Es heißt, man könne sie als Spezialpreis bei der Tombola gewinnen.\n@c0@"
  en: "@a@b*: Rumour has it that you can win it as a special prize at the tombola.\n@c0@"
  es: "@a@b*: Se rumorea que puedas conseguirla como premio especial en la tómbola.\n@c0@"
  fr: "@a@b*ⓢ D'après la rumeur, on peut gagner cette carte\nen jouant à la tombola. C'est un prix spécial.\n@c0@"
  it: "@a@b*: Se non ricordo male, la tessera sconto è uno dei premi che è possibile vincere alla tombola.\n@c0@"
  ja: "@a@b＊「ウワサでは　ふくびき所の\n\t特賞で　もらえるそうですよ。\n@c0@"
61:
  de: "@a@b*: Seid Ihr nicht der alte Freund von Bianca?\n@c0@"
  en: "@a@b*: En't you that ole friend of Bianca's?\n@c0@"
  es: "@a@b*: ¿Tú no eres %A0110%Xel amigo ese%Z%B0110%Xla amiga esa%Z de la Bianca?\n@c0@"
  fr: "@a@b*ⓢ Vous seriez pas l'vieux copain de Biancaⓡ\n@c0@"
  it: "@a@b*: Guarda un po' chi c'è!\nL'amico di Bianca!\n@c0@"
  ja: "@a@b＊「おめえ　たしか\n\tビアンカさんの　幼なじみ\n\tだったよな。\n@c0@"
62:
  de: "@a@b*: Bringt sie bloß nicht in Gefahr, hört Ihr? Sonst werdet Ihr mir einiges zu erklären haben.\n@c0@"
  en: "@a@b*: Dun't you go puttin' her into any danger, d'you hear? Else you'll have me to answer to.\n@c0@"
  es: "@a@b*: A ver dónde la vas a meter, ¿me escuchas? Como le pase algo te atizo.\n@c0@"
  fr: "@a@b*ⓢ Faites bien attention à elle, sinon c'est à moi que vous aurez affaireⓠ\n@c0@"
  it: "@a@b*: Mi raccomando!\nTienila lontana dai pericoli!\nSe le capiterà qualcosa ti inseguirò col forcone!\n@c0@"
  ja: "@a@b＊「彼女を　危ない目に\n\tあわせたら　オレが\n\tだまっちゃいねえぞ。\n@c0@"
63:
  de: "@a@b*: Bei der Göttin! Bianca! Wo in aller Welt hast du nur gesteckt?! Wir haben dich ja schon seit Jahren nicht gesehen!\n@c0@"
  en: "@a@b*: Blimey! Bianca! Where in the world have you bin!? We en't seen you here in donkey's years!\n@c0@"
  es: "@a@b*: ¡Cuernos! ¡Bianca! ¿Dónde te habías metido? ¡Hace no sé cuánto que no te veíamos!\n@c0@"
  fr: "@a@b*ⓢ Saperlipopetteⓠ Biancaⓠ\nMais où est-ce que t'étais passéeⓡ\nÇa fait un bail qu'on t'avait pas vueⓠ\n@c0@"
  it: "@a@b*: Bianca?! Non credo ai miei occhi!\nMa dov'eri finita, eh?! Erano secoli che non ti facevi vedere da queste parti!\n@c0@"
  ja: "@a@b＊「あっ！　ビアンカさん！\n\tどうしたんだよ？\n\tなん年も　顔を見せないで！\n@c0@"
64:
  de: "@aBianca@bIch weiß, tut mir leid. Wir waren ständig unterwegs und hatten einfach keine Zeit, euch zu besuchen.\n@c0@"
  en: "@aBianca@bI know. Sorry. Things have bin really busy and it was hard to find the time to come back and visit.\n@c0@"
  es: "@aBianca@bLo sé, lo siento. He estado bastante liada y no encontraba tiempo para venir de visita, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe sais. Désolée. J'ai vraiment été très occupée et\r\nça a été difficile de trouver le temps de revenir vous voir.\n@c0@"
  it: "@aBianca@bScusami, hai ragione. Purtroppo ho avuto molto da fare ultimamente e non sono riuscita a trovare il tempo di passare a salutarvi.\n@c0@"
  ja: "@a@bビアンカ「ごめんなさいね。\n\tいろいろ　忙しくて\n\tなかなか　帰れなかったの。\n@c0@"
65:
  de: "@a@b*: Ich versteh schon. Aber bei deinem alten Vater solltest du schon hin und wieder vorbeischauen, ja?\n@c0@"
  en: "@a@b*: Fair 'nough. Just make sure you come and see that old dad of yours once in a while, eh?\n@c0@"
  es: "@a@b*: ¡Ah!, bueno. Pero no dejes de visitar a tu viejo padre de vez en cuando, ¿me entiendes?\n@c0@"
  fr: "@a@b*ⓢ C'est pas grave. Mais essaie quand même de\nvenir voir ton vieux père de temps en temps, d'accordⓡ\n@c0@"
  it: "@a@b*: Va bene, va bene. Non preoccuparti. L'importante è che ogni tanto tu vada a fare una visita a tuo padre, che sente tanto la tua mancanza...\n@c0@"
  ja: "@a@b＊「そうか……。　まあ　旅も　大変\n\tだろうけど　たまには　親父さんに\n\t顔を　見せてやんなよ。\n@c0@"
66:
  de: "@a@b*: Dieser doofe junge Kerl in der Herberge kriegt es einfach nicht gebacken. Und der alte Weißi ist bald am Ende seiner Geduld.\n@c0@"
  en: "@a@b*: That daft young lad at the inn just can't seem to get to grips with his work. Old Whitey's at the end of his tether.\n@c0@"
  es: "@a@b*: Ese cenutrio de la posada no consigue aclararse con su trabajo. El viejo Doptada está que trina.\n@c0@"
  fr: "@a@b*ⓢ Cet imbécile de jeune gars, à l'auberge, n'a pas l'air de s'en sortir avec son boulot.\nLe vieux Al n'en peut plus.\n@c0@"
  it: "@a@b*: Il giovanotto alla locanda non è affatto tagliato per il suo lavoro. Credo che il signor Whitblanche stia per perdere definitivamente la pazienza...\n@c0@"
  ja: "@a@b＊「宿屋のドラ息子が　なかなか　仕事を\n\tおぼえないんで　ダンカンさんも\n\t手を　やいてるみたいだな。\n@c0@"
