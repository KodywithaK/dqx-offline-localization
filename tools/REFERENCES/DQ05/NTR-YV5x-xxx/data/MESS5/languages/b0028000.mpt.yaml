  it: "@a@b*: In giro circola con insistenza la voce che il Gran Maestro di Nadiria voglia distruggere il mondo...\n@c0@"
  ja: "@a@b＊「ウワサに聞いたのだが\n\t闇の大魔王が　この世界を\n\t滅ぼそうと　しているらしい。\n@c0@"
149:
