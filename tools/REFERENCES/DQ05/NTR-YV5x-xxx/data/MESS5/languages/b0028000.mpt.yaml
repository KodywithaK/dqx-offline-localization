  it: "@a@b%0%a000180 prende il seme della magia!\n@c0@"
  ja: "@a@b%a000180は　ふしぎな木の実を\n手に入れた！\n@c0@"
72:
  de: "@a@b*: Und passt schön auf Eure Braut auf, ja? Das mir keine Klagen kommen!\n@c0@"
  en: "@a@b*: You look after that bride of yours, eh?\r\nHere's to the happy ever after!\n@c0@"
  es: "@a@b*: Cuida de esa novia tuya.\r\nVivieron felices y tal, ¿eh?\n@c0@"
  fr: "@a@b*ⓢ Et prenez bien soin de votre femme, surtoutⓠ\nVivez heureux et ayez beaucoup d'enfantsⓠ\n@c0@"
  it: "@a@b*: Ti auguro di vivere sempre felice insieme a tua moglie.\nCerca di non farla arrabbiare troppo! Ah ah ah!\n@c0@"
  ja: "@a@b＊「嫁さんを　大切にしろよ！\n\t幸せになっ。\n@c0@"
