0:
  de: "@a@b*: Ⓠ Ich pflüge meinen Acker\nund spitz' dabei ganz wacker\ndie Ohren nach ein wenig Klatsch und Tratsch Ⓡ\n@c0@"
  en: "@a@b*: Ⓠ With a hand to the soil,\nI work my honest toil,\nand listen out for gossip as I sow Ⓡ\n@c0@"
  es: "@a@b*: Ⓠ ¡Oh, qué satisfacciones\nda el trabajo honesto y sus sudores,\nsiempre bien atento a los rumores! Ⓡ\n@c0@"
  fr: "@a@b*ⓢ Ⓠ Les mains dans la terre,\nJe travaille la tête en l'air\nécoutant les dires des commères Ⓡ\n@c0@"
  it: "@a@b*: Mentre lavoro indefessoooh... Ⓠ\nDei fatti degli altri m'interessoooh... Ⓡ\nAmo l'inciucio e lo pratico spe-e-esso...! Ⓡ\n@c0@"
  ja: "@a@b＊「あ～　それ\n\tトン　トン　トン　っと♪\n@c0@"
1:
  de: "@a@b*: Holz hacken und sein Leben leben kommt eigentlich auf das Gleiche heraus. Bei beiden kommt es auf die Wahl des richtigen Zeitpunkts an.\n@c0@"
  en: "@a@b*: Chopping wood and living your life are just the same, really. The most important thing in both is\r\ngood timing.\n@c0@"
  es: "@a@b*: Talar madera es como la vida misma. Lo importante es la coordinación.\n@c0@"
  fr: "@a@b*ⓢ Couper du bois, c'est comme la vie. Dans les deux cas, le plus important est de choisir le bon moment.\n@c0@"
  it: "@a@b*: Spaccare la legna non è facile, %H0860%Xsai%Ysapete%Z?\nServono muscoli, tecnica e ritmo.\n@c0@"
  ja: "@a@b＊「マキ割りも　人生も\n\t大事なのは　タイミングだ～よ。\n@c0@"
2:
  de: "@a@b*: Ich verrat' Euch ein kleines Geheimnis. Ich hab vor kurzem in einer Höhle westlich von Bauernsiepen mit einem furchtbaren Monster gekämpft.\n@c0@"
  en: "@a@b*: I'll let you in on a little secret. I did battle with a fearful monster in a cave just west of Hay not long ago.\n@c0@"
  es: "@a@b*: %H0860%XTe%YOs%Z contaré un pequeño secreto. Hace poco, en una cueva al oeste de Puebla del Heno, luché con un monstruo temible.\n@c0@"
  fr: "@a@b*ⓢ J'ai un petit secret à vous dire. J'ai combattu un monstre effroyable dans une grotte à l'ouest de Chaumes il n'y a pas longtemps.\n@c0@"
  it: "@a@b*: Voglio %H0860%Xraccontarti%Yraccontarvi%Z una cosa!\nQualche tempo fa, ho affrontato un mostro tremendo in una grotta a ovest di Punta Campestre!\n@c0@"
  ja: "@a@b＊「じつは　カボチ村の西の\n\t洞くつで　とてつもなく\n\t強い魔物と　戦ったのだ。\n@c0@"
3:
  de: "@a@b*: Ihr werdet nie erraten, was das für ein Monster war... Eine Säbelzahnkatze, ausgerechnet!\n@c0@"
  en: "@a@b*: You'll never guess what it was...\nA great sabrecat of all things!\n@c0@"
  es: "@a@b*: Ni %H0860%Xte imaginas%Yos imagináis%Z lo que era...\n¡Un dientes de sable, nada menos!\n@c0@"
  fr: "@a@b*ⓢ Vous ne devinerez jamais ce que c'était...\nun smilodonⓠ\n@c0@"
  it: "@a@b*: Non %H0860%Xindovineresti%Yindovinereste%Z mai di che bestia si trattava...\nEra un Koguar!\nRoba da farsela addosso dalla paura, eh?\n@c0@"
  ja: "@a@b＊「あれは　まさしく\n\tキラーパンサー！\n@c0@"
4:
  de: "@a@b*: Ich sage furchtbar, aber man konnte merken, dass die Säbelzahnkatze früher mal an Menschen gewöhnt war. Vielleicht war sie sogar mal richtig zahm.\n@c0@"
  en: "@a@b*: I say it was fearful, but I could tell it'd had some contact with humans. It might even have been someone's pet once.\n@c0@"
  es: "@a@b*: Ya digo, era temible, pero creo que había tenido contacto con humanos. Hasta podría haber sido la mascota de alguien.\n@c0@"
  fr: "@a@b*ⓢ Il était très impressionnant, mais j'ai senti qu'il avait déjà été en contact avec l'homme. Peut-être même qu'il avait été le compagnon de quelqu'un...\n@c0@"
  it: "@a@b*: In realtà, il mostro non era molto tremendo.\nAnzi, sembrava che fosse già stato domato. Quando mi ci sono imbattuto, però, era tutt'altro che docile!\n@c0@"
  ja: "@a@b＊「しかも　人に\n\t飼われていたことが　あると\n\tオレは　みたぞ！\n@c0@"
5:
  de: "@a@b*: Vielleicht könnte man sie sogar wieder zähmen ... Wenn sie etwas sieht, das sie von früher kennt...\n@c0@"
  en: "@a@b*: Maybe it could be tamed if it recognised something from its younger days.\n@c0@"
  es: "@a@b*: Quizá fuese posible domarlo si reconociese algo de cuando era cachorro.\n@c0@"
  fr: "@a@b*ⓢ Maintenant que j'y repense, je suis sûr que c'est comme ça qu'on pourrait l'apprivoiser, en utilisant un objet qui a appartenu à son ancien propriétaire.\n@c0@"
  it: "@a@b*: Probabilmente è possibile addomesticarlo, magari mostrandogli un oggetto che ha già visto quand'era un cucciolo...\n@c0@"
  ja: "@a@b＊「なにか　その頃の思い出の品でも\n\tつかえば　手なずけられるかも\n\tしれないのだが……。\n@c0@"
6:
  de: "@a@b*: Ich sag Euch was. Wenn Ihr Euch langweilt, warum schaut Ihr nicht mal in das Buch auf der Theke dort hinein?\n@c0@"
  en: "@a@b*: I tell you what. If you're feeling bored, why don't you take a look at that book on the counter there?\n@c0@"
  es: "@a@b*: ¿%H0860%XSabes%YSabéis%Z qué? Si %H0860%Xte aburres%Yos aburrís%Z, ¿por qué no %H0860%Xechas%Yecháis%Z un vistazo al libro del mostrador?\n@c0@"
  fr: "@a@b*ⓢ Je peux vous dire quelque choseⓡ Si vous vous ennuyez, pourquoi vous ne jetteriez pas un œil à ce livre sur le comptoirⓡ\n@c0@"
  it: "@a@b*: %H0860%XTi stai annoiando, non è vero? Perché non dai%YVi state annoiando, non è vero? Perché non date%Z un'occhiata al libro che si trova sul bancone?\n@c0@"
  ja: "@a@b＊「お客さん　たいくつだったら\n\tカウンターの　宿帳でも\n\t見ていくといいですよ。\n@c0@"
7:
  de: "@a@b*: Hierher kommen alle möglichen Leute. Und alle schreiben was in das Buch. Was Tratsch angeht, da seid Ihr Reisenden wohl gern auf dem Laufenden?\n@c0@"
  en: "@a@b*: We have all sorts in here, you know. And they all write things in it. You travellers certainly like to keep up on your gossip, don't you?\n@c0@"
  es: "@a@b*: Aquí viene gente de todo tipo, y todos escriben en él. A los viajeros os gusta estar al día de los cotilleos, ¿eh?\n@c0@"
  fr: "@a@b*ⓢ Des gens du monde entier passent par ici et ils laissent tous un mot dans ce livre. Je vous connais vous, les voyageurs. Vous aimez les commérages.\n@c0@"
  it: "@a@b*: Qui vengono persone da ogni parte del mondo, e chiediamo loro di scrivere i pettegolezzi di cui vengono a conoscenza.\n㈡\n*: Da queste parti abbiamo una vera passione per indiscrezioni, voci di corridoio, chiacchiere da parrucchiera e inciuci in genere!\n@c0@"
  ja: "@a@b＊「ウチは　けっこう　旅人の出入りが\n\t多くて　いろんなウワサ話が\n\t書き残されてますからね。\n@c0@"
8:
  de: "@a@b*: Oh, ist das der Fama-Foliant? Ah ja. Der steckt voller Klatsch und Tratsch.\n@c0@"
  en: "@a@b*: Oh, is that the Scuttlebutt Alledger you've got there? Oh, yes. That's full of tittle-tattle, that is.\n@c0@"
  es: "@a@b*: ¿Eh?, ¿que si eso de ahí es ⓕEl Mentidero Verdaderoⓖ? ¡Ah!, sí. Es un cúmulo de marujeos.\n@c0@"
  fr: "@a@b*ⓢ Mais ce ne serait pas les On-dit de Milleragotsⓡ Eh oui. Un livre plein de commérages.\n@c0@"
  it: "@a@b*: Oh, ma quelle sono le ⓕCronache di Inchucheniaⓖ!\nÈ un testo meraviglioso!\nContiene i più succulenti pettegolezzi del mondo!\n@c0@"
  ja: "@a@b＊「ありゃ　お客さん　それは\n\tうちの宿の　うわさのノートじゃ\n\tないですか。\n@c0@"
9:
  de: "@a@b*: Behaltet ihn ruhig, wenn Ihr wollt. Aber das ist alles nur Geschwätz. Nehmt die Geschichten lieber nicht allzu ernst!\n@c0@"
  en: "@a@b*: Keep it if you want to. It's all gossip, mind. Don't take it too seriously!\n@c0@"
  es: "@a@b*: %H0860%XQuédatelo si quieres%YQuedáoslo si queréis%Z. Solo vienen cotilleos. ¡No %H0860%Xte lo tomes%Yos lo toméis%Z muy en serio!\n@c0@"
  fr: "@a@b*ⓢ Je vous le laisse. N'oubliez pas que ce sont des ragots. Ne prenez pas tout au sérieuxⓠ\n@c0@"
  it: "@a@b*: Se %H0860%Xvuoi, puoi%Yvolete, potete%Z tenerlo. È una lettura interessante, a patto di non prenderla troppo sul serio. Del resto, non contiene altro che inciuci...\n@c0@"
  ja: "@a@b＊「ノートはまだあるから\n\t持って行ってもいいけど　何の役にも\n\t立たないと思いますよ。\n@c0@"
10:
  de: "@a@b*: Wenn man eine Schänke betreibt, macht man sich so seine Gedanken, wisst Ihr...\n@c0@"
  en: "@a@b*: You can't help having a few thoughts on the subject when you run an inn, you know...\n@c0@"
  es: "@a@b*: Cuando llevas una posada es difícil no tener algunas opiniones sobre las cosas...\n@c0@"
  fr: "@a@b*ⓢ C'est le genre de sujet qui vous interpelle quand vous tenez une auberge...\n@c0@"
  it: "@a@b*: Gestisco una locanda e vedo ogni giorno tanti volti nuovi. C'è chi viaggia da solo, e chi lo fa in compagnia.\n@c0@"
  ja: "@a@b＊「こうして　宿をやってると\n\t思うんですよ……。\n@c0@"
11:
  de: "@a@b*: Wenn Ihr mich fragt, dann würde ich viel lieber in Begleitung von ein paar Freunden reisen als allein. Das wäre, als hätte man seine Familie dabei.\n@c0@"
  en: "@a@b*: If you ask me, I'd much rather travel with a few friends than on my own. It'd be like having a family with you.\n@c0@"
  es: "@a@b*: Y para mí que es mejor viajar con amigos que ir por tu cuenta. Es como llevar a la familia contigo.\n@c0@"
  fr: "@a@b*ⓢ Personnellement, je pense que je préférerais voyager avec quelques amis plutôt que tout seul.\nCe serait un peu comme une famille.\n@c0@"
  it: "@a@b*: Se dovessi viaggiare, preferirei farlo insieme ad altre persone, così mi sentirei come in famiglia!\nDico bene, no?\n@c0@"
  ja: "@a@b＊「旅をするのに　仲間がいる人は\n\t幸せだなって。　ましてや　それが\n\t家族ならね。\n@c0@"
12:
  de: "@a@b*: Diese zwei Jungs hier sind meine Söhne.\n@c0@"
  en: "@a@b*: These two lads here are both my boys.\n@c0@"
  es: "@a@b*: Estos dos mozos son mis hijos.\n@c0@"
  fr: "@a@b*ⓢ Ces deux garçons sont mes fils.\n@c0@"
  it: "@a@b*: Questi due ragazzi sono i miei figli.\n@c0@"
  ja: "@a@b＊「ここに　いるのは　２人とも\n\tあたしの息子だよ。\n@c0@"
13:
  de: "@a@b*: Ich wünschte nur, sie kämen bald unter die Haube und würden mir ganz viele Enkelchen schenken.\n@c0@"
  en: "@a@b*: I only wish they'd find themselves a couple of lovely brides and give me some grandchildren.\n@c0@"
  es: "@a@b*: Solo pido que encuentren una buena mujer y que me den muchos nietos.\n@c0@"
  fr: "@a@b*ⓢ Tout ce que je souhaite, c'est qu'ils se trouvent chacun une gentille épouse et qu'ils me donnent des petits-enfants.\n@c0@"
  it: "@a@b*: Sono la luce dei miei occhi, ma confesso che non mi sarebbe affatto spiaciuto avere anche una bambina...\n@c0@"
  ja: "@a@b＊「本当は　お嫁さんをもらって\n\tマゴの顔を　見てみたかったん\n\tだけどねえ。\n@c0@"
