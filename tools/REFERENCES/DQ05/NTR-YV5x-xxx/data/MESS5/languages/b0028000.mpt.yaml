18:
  de: "@a@b*: Bianca! Na, so was! Du hast dich ja schon ewig nicht mehr hier blicken lassen! Ich hab mir schon Sorgen um dich gemacht, weißt du.\n@c0@"
  en: "@a@b*: Bianca! Well, I'll be! We en't see your face 'round these parts in a good long while. I've bin a bit worried about you, so I have.\n@c0@"
  es: "@a@b*: ¡Bianca! ¡Anda mi madre! Hace la tira que no te veíamos por aquí. Ya estaba yo preocupado y todo.\n@c0@"
  fr: "@a@b*ⓢ Biancaⓠ Ça alorsⓠ Ça faisait un bout de temps qu'on ne t'avait pas vue dans les parages.\nJe me suis inquiété pour toi, tu sais.\n@c0@"
  it: "@a@b*: Bianca! Erano anni che non ti vedevo!\nMa dov'eri finita, eh? Temevo che ti fosse successo qualcosa... Mi hai fatto stare in ansia, sai?\n@c0@"
  ja: "@a@b＊「おやまあ！　ビアンカちゃん！\n\tずいぶん　久しぶりでないかい？\n\tどうしてるかと思っただよ。\n@c0@"
19:
  de: "@aBianca@bOh, das tut mir leid. Ich wollte dir keine Sorgen bereiten.\n@c0@"
  en: "@aBianca@bYeah, well. Sorry about that. I didn't mean to make you anxious or nothin'.\n@c0@"
  es: "@aBianca@bSí, bueno. Lo siento. No quería que nadie me se pusiera nervioso, ¿sabes?\n@c0@"
  fr: "@aBianca@bOui, je sais. Désolée. Je ne voulais vraiment pas inquiéter qui que ce soit.\n@c0@"
  it: "@aBianca@bHai ragione, scusami.\nNon volevo farti preoccupare. Diciamo che ho avuto un po' da fare in giro per il mondo...\n@c0@"
  ja: "@a@bビアンカ「うん　ちょっと……。\n\t心配かけて　ごめんなさいね。\n@c0@"
