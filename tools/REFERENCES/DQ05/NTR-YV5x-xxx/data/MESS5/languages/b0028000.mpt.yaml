68:
  de: "@a@b*: So, Ihr habt also das Mädel aus der Stadt geheiratet, ja?\n@c0@"
  en: "@a@b*: So you got wed to that town girl, did ya?\n@c0@"
  es: "@a@b*: Así que te juntaste con esa chica bien, ¿eh?\n@c0@"
  fr: "@a@b*ⓢ Alors comme ça, vous vous êtes marié avec cette fille de la ville, heinⓡ\n@c0@"
  it: "@a@b*: Tu sei il tipo che ha sposato quella ragazza di città, non è vero?\n@c0@"
  ja: "@a@b＊「そういや　町のお嬢さんと\n\t結婚したんだって？\n@c0@"
69:
  de: "@a@b*: Ich weiß, es kommt vielleicht etwas spät, aber ich wollte Euch trotzdem etwas schenken. Hier, bitte.\n@c0@"
  en: "@a@b*: I know it's a bit late, but I want you to have this as a little pressie. It en't much, mind.\n@c0@"
  es: "@a@b*: Sé que es tarde, pero toma un regalo. No es mucho.\n@c0@"
  fr: "@a@b*ⓢ Je sais que j'arrive un peu à la fumée des cierges, mais j'aimerais vous offrir un p'tit cadeau. C'est pas grand-chose, hein.\n@c0@"
  it: "@a@b*: So di essere un po' in ritardo, ma vorrei farti un regalino. È solo una sciocchezza, ma spero che l'apprezzerai...\n@c0@"
  ja: "@a@b＊「おそく　なっちまったけど\n\tこれ　祝いに　受けとってくんな！\n\tつまらないものだけどよ。\n@c0@"
70:
  de: "@a@b%0%a000120 erhält einen Magiesamen!\n@c0@"
  en: "@a@b%0%a000120 receives a seed of magic!\n@c0@"
