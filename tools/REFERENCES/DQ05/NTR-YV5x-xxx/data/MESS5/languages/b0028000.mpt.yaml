  it: "@a@b*: Ma proprio figlio di locandiere dovevo nascere?!\nNon potevo essere, che so io... un ricco ereditiero, o il principe di un regno grande e fiorente?!\n@c0@"
  ja: "@a@b＊「宿屋の息子になんて\n\t生まれたくなかったよ。\n\tぶつ　ぶつ……。\n@c0@"
76:
  de: "@aWeißi@bZzz... Zzz...\n@c0@"
