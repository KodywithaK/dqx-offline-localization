  es: "@aDoptada@bZzzz... Zzzz...\n@c0@"
  fr: "@aAl@bZzzz... Zzzz...\n@c0@"
  it: "@aSignor Whitblanche@bZzz... Zzz...\n@c0@"
  ja: "@a@bダンカン「こっくり　こっくり……。\n@c0@"
77:
  de: "@aWeißi@bUps! Schon wieder eingeschlafen. So geht das nicht weiter!\n@c0@"
  en: "@aWhitey@bOops! I nodded off again. That'll never do!\n@c0@"
  es: "@aDoptada@b¡Huy! Me he quedado transpuesto otra vez. ¡No hay manera!\n@c0@"
  fr: "@aAl@bOupsⓠ J'ai encore piqué du nez.\nJe n'y arriverai donc jamaisⓠ\n@c0@"
  it: "@aSignor Whitblanche@bOps! Mi sono appisolato un'altra volta.\nPovero me, sto proprio invecchiando...\nNon ho più la vitalità di una volta...\n@c0@"
  ja: "@a@bダンカン「……ああ　いかん！\n\tうっかり　眠ってしまった。\n@c0@"
78:
  de: "@aWeißi@bHm? Grundgütige! Du bist's, %a000090!\n@c0@"
  en: "@aWhitey@bHm? Oh! Heavens above! It's you, %a000090!\n@c0@"
  es: "@aDoptada@b¿Mmm? ¡Oh! ¡Subcelestis! ¡Eres tú, %a000090!\n@c0@"
  fr: "@aAl@bMmmⓡ Ohⓠ Par les cieuxⓠ C'est toi, %a000090ⓠ\n@c0@"
  it: "@aSignor Whitblanche@bEh?!\nOh, santissima dea!\nSei proprio tu, %a000090?!\n@c0@"
  ja: "@a@bダンカン「……ん？\n\tおおっ！　%a000090！\n\t%a000090じゃないか！\n@c0@"
79:
  de: "@aWeißi@bWo in aller Welt hast du die ganzen Jahre gesteckt, mein Junge?\n@c0@"
  en: "@aWhitey@bWhere in the world have you bin all these years,\r\nme old friend?\n@c0@"
  es: "@aDoptada@b¿Dónde rayos te has metido todos estos años, viejo amigo?\n@c0@"
  fr: "@aAl@bMais où diable étais-tu passé pendant toutes ces années, mon vieil amiⓡ\n@c0@"
  it: "@aSignor Whitblanche@bMa dove ti eri cacciato, amico mio?\nErano anni che non ti vedevo!\n@c0@"
  ja: "@a@bダンカン「なん年も　顔を見せずに\n\tいったい　どうしてたんだね？\n@c0@"
80:
  de: "@aWeißi@bBei der Göttin! Du wurdest in eine Steinstatue verwandelt?! Himmel noch mal!\n@c0@"
  en: "@aWhitey@bGood grief! You were turned into stone!? Well, of all the things!\n@c0@"
  es: "@aDoptada@b¡Ay mi madre! ¿Te convirtieron en un trozo de piedra? ¡Pero qué me cuentas!\n@c0@"
  fr: "@aAl@bNom de nomⓠ Tu avais été transformé en pierreⓡⓐ\nEh bien, ça alorsⓠ\n@c0@"
  it: "@aSignor Whitblanche@bChe cosa?!\nEri stato trasformato in una statua?!\nMa dici davvero?\n@c0@"
  ja: "@a@bダンカン「……な　なんだって？\n\t石にされて？！　そんな\n\t危ない目に　あっとったのか！！\n@c0@"
81:
  de: "@aWeißi@bDas nennt man wohl Pech, was?\n@c0@"
  en: "@aWhitey@bTalk about bad luck, eh?\n@c0@"
  es: "@aDoptada@bYa es mala suerte, ¿eh?\n@c0@"
  fr: "@aAl@bC'est ce qui s'appelle manquer de bol, heinⓡ\n@c0@"
  it: "@aSignor Whitblanche@bNon avevo mai sentito una storia simile!\nA momenti ci resto... di sasso.\nEhm, scusami. Non volevo mancarti di rispetto.\n@c0@"
  ja: "@a@bダンカン「うーむ……　なんてこった。\n@c0@"
82:
  de: "@aWeißi@bÜber Bianca brauchen wir gar nicht zu diskutieren.\n@c0@"
  en: "@aWhitey@bThere's no need to discuss Bianca.\n@c0@"
  es: "@aDoptada@bNo hay por qué hablar de la Bianca.\n@c0@"
  fr: "@aAl@bInutile de parler de Bianca.\n@c0@"
  it: "@aSignor Whitblanche@bIn quanto a Bianca, non c'è nemmeno bisogno che tu me lo dica...\n@c0@"
  ja: "@a@bダンカン「……ああ　しかし\n\tビアンカのことは\n\t言わんでもいい。\n@c0@"
83:
  de: "@aWeißi@bIch weiß, dass du sie retten wirst. Ich vertraue dir, %a000090.\n@c0@"
  en: "@aWhitey@bI know you'll rescue her. I trust you, see, %a000090.\n@c0@"
  es: "@aDoptada@bSé que la rescatarás. Confío en ti, %a000090.\n@c0@"
  fr: "@aAl@bJe sais que tu la sauveras. Je te fais entièrement confiance, %a000090.\n@c0@"
  it: "@aSignor Whitblanche@bSo che farai di tutto per salvarla.\nMi fido di te, %a000090.\n@c0@"
  ja: "@a@bダンカン「必ずや　%a000090が\n\t助けてくれると言うのだろう？\n\tわしは　信じとるよ。\n@c0@"
84:
  de: "@aWeißi@bAber die beiden Kinderchen da, sind die etwa...?\n@c0@"
  en: "@aWhitey@bBy the way, are these kiddies by any chance...?\n@c0@"
  es: "@aDoptada@bPor cierto, ¿no serán esos chavalines...?\n@c0@"
  fr: "@aAl@bÀ ce propos, est-ce que par hasard, ces minots seraient...ⓑ\n@c0@"
  it: "@aSignor Whitblanche@bDimmi un po', ma non è che questi bambini sono i vostri figli?\n@c0@"
  ja: "@a@bダンカン「……ところで\n\tその子どもは？　もしや……。\n@c0@"
85:
  de: "@aWeißi@bIch wusste es! Dann sind sie also von dir und Bianca, ja?\n@c0@"
  en: "@aWhitey@bI knew it! So they're yours and Bianca's, eh?\n@c0@"
  es: "@aDoptada@b¡Lo sabía! Así que son tuyos y de la Bianca, ¿eh?\n@c0@"
  fr: "@aAl@bJ'en étais sûrⓠ Alors ce sont vos enfants, à toi et\nà Bianca, heinⓡ\n@c0@"
  it: "@aSignor Whitblanche@bLo sapevo!\nSomigliano troppo a te e a Bianca per non essere il sangue del vostro sangue!\n@c0@"
  ja: "@a@bダンカン「ど　どひゃー！！\n\tやっぱり　%a000090と\n\tビアンカの子か！\n@c0@"
86:
  de: "@aWeißi@bJa, das sieht man sofort. Sie sehen genauso aus wie du und Bianca, als ihr in dem Alter wart. Und selbst mir sehen sie ein bisschen ähnlich!\n@c0@"
  en: "@aWhitey@bYeah, I can see it actually. They look just like the two of you when you were little. And a bit like me, oddly enough!\n@c0@"
  es: "@aDoptada@bSí, ya lo veo. Son como vosotros dos cuando erais pequeñajos. ¡Y se parecen a mí, ay mi abuela!\n@c0@"
  fr: "@aAl@bOui, ça se voit, en fait. Ils vous ressemblent quand vous étiez petits, tous les deux. Et bizarrement, ils me ressemblent un peu aussiⓠ\n@c0@"
  it: "@aSignor Whitblanche@bMi ricordano tantissimo te e la mia bambina quando avevate la loro età.\nE ti dirò... Somigliano anche un po' a me! Eh eh eh!\n@c0@"
  ja: "@a@bダンカン「うん　うん。　２人の\n\t小さい頃に　そっくりだよ。　それに\n\tどことなく　わしにも　似とるぞ。\n@c0@"
87:
