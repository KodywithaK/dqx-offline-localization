  ja: "@a@b＊「あーあ　宿屋の修行は\n\tつらいなあ……。\n@c0@"
75:
  de: "@a@b*: Warum wurde ich bloß als Sohn eines Herbergsbesitzers geboren?!\n@c0@"
  en: "@a@b*: Of all the luck, bein' born son of an innkeeper!\n@c0@"
