  ja: "@a@b＊「なにか買うとか　預けるなどして\n\tお金を　へらしてから\n\tおこしください。\n@c0@"
33:
  de: "@a@b*: Es war mir wie immer ein Vergnügen, mit Euch Geschäfte zu machen.\n@c0@"
  en: "@a@b*: It's always a pleasure doing business with you.\n@c0@"
  es: "@a@b*: Siempre es un placer hacer negocios con %H0860%Xusted%Yustedes%Z.\n@c0@"
