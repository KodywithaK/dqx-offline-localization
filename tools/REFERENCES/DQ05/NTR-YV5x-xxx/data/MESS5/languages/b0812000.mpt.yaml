  en: "@a@b*: I'm ever so sorry. I'd love to make a purchase from you, but you appear to have as much gold as you can carry.\n@c0@"
  es: "@a@b*: Lo siento de veras, me encantaría %H0860%Xcomprarle%Ycomprarles%Z algo, pero parece que ya llevan tanto oro como %H0860%Xpuede%Ypueden%Z.\n@c0@"
  fr: "@a@b*ⓢ Je regrette vraiment. J'adorerais vous acheter quelque chose, mais vous transportez déjà tout\nl'or que vous pouvez porter.\n@c0@"
  it: "@a@b*: Vorrei acquistare qualcosa da te, ma credo che tu non possa portare altro denaro.\n@c0@"
  ja: "@a@b＊「すみません…。　買い取らせて\n\tいただきたいのですが　それ以上\n\tお金を　お持ちになれないようです。\n@c0@"
32:
  de: "@a@b*: Wieso kauft Ihr mir nicht erst etwas ab?\n@c0@"
  en: "@a@b*: Why don't you buy something from me first?\n@c0@"
  es: "@a@b*: ¿Por qué no me %H0860%Xcompra%Ycompran%Z algo primero?\n@c0@"
  fr: "@a@b*ⓢ Et si vous commenciez par m'acheter quelque choseⓡ\n@c0@"
