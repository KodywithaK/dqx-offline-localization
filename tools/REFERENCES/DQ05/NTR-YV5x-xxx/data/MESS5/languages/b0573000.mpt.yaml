14:
  de: "@a%0%a001250@bMir würd' es nichts ausmachen, wenn er mitkommt. Ich kann mich doch um ihn kümmern. Kann er nicht mitkommen, Papa?\n@c0@"
  en: "@a%0%a001250@bI don't mind him coming along. I'll look after him.\nCan he really not come, Dad?\n@c0@"
  es: "@a%0%a001250@bNo me importaría que viniera. Yo lo cuidaré.\n¿No puede venir, papi?\n@c0@"
  fr: "@a%0%a001250@bÇa me dérangerait pas qu'il se joigne à nous.\nJe m'occuperai de lui. Il ne peut vraiment pas\nvenir, papaⓡ\n@c0@"
