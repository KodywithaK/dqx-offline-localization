  ja: "@a@b%a001240「ここって　何回ぐらい\n\tサイコロふれば　ゴールできるんだろ？\n\t５０回？　１００回くらいかな？\n@c0@"
6:
  de: "@a%0%a001250@bHmm... Ich versuche, eine gute Strecke zu planen, aber es ist einfach zu kompliziert!\n@c0@"
  en: "@a%0%a001250@bHmm... I'm trying to plot a good route through it all, but it's just too complicated!\n@c0@"
  es: "@a%0%a001250@bMmm... Estoy intentando planear una buena ruta para atravesarlo, pero es muy complicado.\n@c0@"
  fr: "@a%0%a001250@bMmm... Je suis en train d'essayer de trouver le chemin à suivre, mais c'est trop compliquéⓠ\n@c0@"
  it: "@a%0%a001250@bSto cercando di capire qual è il percorso migliore da seguire, ma non ci riesco!\nQuesta Tavola della Sorte è troppo complessa!\n@c0@"
  ja: "@a@b%a001250「う～ん…　今\n\t道順　考えてるんだけど……\n\tわかんないよ～　むずかしい～～！\n@c0@"
7:
  de: "@a%0%a001250@bIch glaube, ich setze lieber aus und sehe zu, wie du spielst, Papa.\n@c0@"
  en: "@a%0%a001250@bI think I'd rather sit this one out and watch you play, Dad.\n@c0@"
  es: "@a%0%a001250@bMejor será que me siente y te vea jugar, papi.\n@c0@"
  fr: "@a%0%a001250@bJe crois que je vais passer mon tour et te regarder jouer, papa.\n@c0@"
  it: "@a%0%a001250@bPapà, vuoi provare a giocare?\nFai pure. Io mi metto qui buona buona a vedere come te la cavi...\n@c0@"
  ja: "@a@b%a001250「ここでは\n\tお父さんが　すごろくしてるの\n\t見てることにします。\n@c0@"
8:
  de: "@aSancho@bDas ist ein schönes T&T-Brett, nisst?\n@c0@"
  en: "@aSancho@bEes a fine T 'n' T board, sí?\n@c0@"
  es: "@aSancho@bTremendo tablero de T y T, ¿no?\n@c0@"
  fr: "@aSancho@bC'est oun j-joli jeu de TNT, siⓡ\n@c0@"
  it: "@aSancho@b¡Ay, esta Tavola della Sorte es maravillosa!\n@c0@"
  ja: "@a@bサンチョ「こりゃまた　ずいぶん\n\tりっぱな　すごろく場ですねえ。\n@c0@"
9:
  de: "@aSancho@bAber das isst nisst das Risstige für deinen Onkel Sancho. Hier brauchst du miss nisst.\n@c0@"
  en: "@aSancho@bEes no the place for your Uncle Sancho, though.\nYou no need me here.\n@c0@"
  es: "@aSancho@bNomás que no es sitio para tu tito Sancho.\nAquí no me necesitas.\n@c0@"
  fr: "@aSancho@bMais ce n'est p-pas oun endroit pour ton\r\ntonton Sancho. Tu n'as p-pas besoin de moi.\n@c0@"
  it: "@aSancho@bEsta Tavola della Sorte no es buena por lo zio Sancho, chico...\nEs troppos complicata...\n@c0@"
  ja: "@a@bサンチョ「ここは　%a000090王に\n\tおまかせしますよ。\n\t私は　ここは　ちょっと……。\n@c0@"
10:
  de: "@aOtto@bMich juckt's schon in den Fingern, die Würfel springen zu lassen, %a000090!\n@c0@"
  en: "@aTuppence@bMy lucky fingers are just itching to get hold of the dice here, %a000090!\n@c0@"
  es: "@aAlazar@b¡Mis afortunados dedos se mueren por tirar el dado, %a000090!\n@c0@"
  fr: "@aInnocent@bJe sens que j'ai la gagne, %a000090ⓠ\nLaissez-moi le dé. Vous allez voir.\n@c0@"
  it: "@aSimon@bMaestà, ho una gran voglia di lanciare il dado...\nMi prudono le dita!\n@c0@"
  ja: "@a@bピピン「ボクの　黄金のウデが\n\tはやく　サイコロをふりたいと\n\tうずきますよ。\n@c0@"
11:
  de: "@aOtto@bÜberlasst nur alles mir! ... Ach, wem will ich was vormachen... Ich wäre gern so zuversichtlich, aber Zuversicht ist bei mir nun mal dünn gesät.\n@c0@"
  en: "@aTuppence@bJust leave everything to me! ...No, I wish I could be that confident, but confidence always seems to be something I'm rather short on.\n@c0@"
  es: "@aAlazar@b¡Yo me ocupo de todo! Bueno, ojalá pudiera tener tanta confianza en mí mismo, pero la confianza es algo de lo que carezco.\n@c0@"
  fr: "@aInnocent@bLaissez-moi faireⓠ ... Non, j'aimerais avoir une telle confiance en moi, mais ce n'est pas tout à fait le cas.\n@c0@"
  it: "@aSimon@bLasci fare a me, Maestà!\nVedrà che riuscirò ad arrivare alla fine prima che lei diventi nonno!\n㈡\nUhm, meglio essere prudenti...\nDiciamo che arriverò al traguardo prima che lei diventi bisnonno...\n@c0@"
  ja: "@a@bピピン「ボクに　おまかせを！\n\tと言いたいところですが\n\tさすがのボクも　自信ありませんね。\n@c0@"
12:
  de: "@aBianca@bOh! Er sieht so traurig aus. Aber wenn du dich bereits entschieden hast...\n@c0@"
  en: "@aBianca@bOh! He looks so sad. Still, if you've made up\r\nyour mind...\n@c0@"
  es: "@aBianca@b¡Oh! Parecía muy triste. Pero si ya has tomado una decisión...\n@c0@"
  fr: "@aBianca@bOhⓠ Il a l'air tellement triste. Mais si tu as pris\nta décision...\n@c0@"
