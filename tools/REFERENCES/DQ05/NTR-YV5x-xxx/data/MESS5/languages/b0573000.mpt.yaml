13:
  de: "@aNera@bDer Arme! Er wirkt so enttäuscht. Ich hätte nicht gedacht, dass ihn das verletzen würde.\n@c0@"
  en: "@aNera@bPoor thing! He looks so disappointed. I didn't think he'd be so hurt.\n@c0@"
  es: "@aNera@b¡Poverello! Parece muy disgustado. No pensé que le sentara tan mal.\n@c0@"
