  it: "@aViola@bPeccato...\nMi avrebbe fatto piacere prendermi cura di quel cucciolone...\n㈡\nCioè, mi avrebbe fatto piacere ordinarti di prenderti cura di quel cucciolone.\n@c0@"
  ja: "@a@bデボラ「仕方ないわね……。\n\t仲間になったら\n\tかわいがってあげたいけど。\n@c0@"
