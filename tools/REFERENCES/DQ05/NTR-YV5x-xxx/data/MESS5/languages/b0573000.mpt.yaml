0:
  de: "@aBianca@bMeine Güte! Ich glaub', ich hab noch nie so 'n großes T&T-Spielbrett gesehen.\n@c0@"
  en: "@aBianca@bBlimey! I dun't think I've ever seen a T 'n' T board\r\nso big.\n@c0@"
  es: "@aBianca@b¡Cuernos! Creo que nunca había visto un tablero de T y T tan grande.\n@c0@"
  fr: "@aBianca@bSaperlipopetteⓠ Je crois que je n'ai jamais vu de jeu de TNT aussi grandⓠ\n@c0@"
  it: "@aBianca@bMi venisse un colpo!\nQuesta Tavola della Sorte è gigantesca!\n@c0@"
  ja: "@a@bビアンカ「なんなの　この\n\t見わたすかぎりの\n\tすごろくのマス目は？\n@c0@"
1:
  de: "@aBianca@bIch glaube, auf dieses sollten wir lieber verzichten. Stell dir nur vor, wie lange es dauern würde, das Ziel zu erreichen!\n@c0@"
  en: "@aBianca@bI think we'd better pass on this one. Imagine how long it'd take to reach the goal!\n@c0@"
  es: "@aBianca@bSería mejor que pasáramos de este. ¡Imagina lo que se tardaría en llegar a la meta!\n@c0@"
  fr: "@aBianca@bJe pense qu'on ferait mieux de laisser tomber.\nTu imagines le temps qu'il faudrait pour arriver\nau boutⓠ\n@c0@"
  it: "@aBianca@bAmore, forse è meglio non giocare a questa Tavola della Sorte...\nCi vorranno degli anni per arrivare al traguardo!\n@c0@"
  ja: "@a@bビアンカ「う～ん…　さすがに\n\tここは　パスするわ。　こんなところ\n\tゴールできそうにないもの。\n@c0@"
2:
  de: "@aNera@bIch hätte nicht damit gerechnet, hier so ein großartiges T&T-Brett zu finden.\n@c0@"
  en: "@aNera@bI didn't expect to find such a splendid T 'n' T\r\nboard here.\n@c0@"
  es: "@aNera@bNo aspettava encontrar aquí un tablero de T y T tan fantástico.\n@c0@"
  fr: "@aNera@bJe ne m'attendais pas à trouver un jeu de TNT aussi beau ici.\n@c0@"
  it: "@aNera@bOoohhh!\nQuesta Tavola della Sorte è di una maestosità senza pari!\n@c0@"
  ja: "@a@bフローラ「まあ　こんなすごい\n\tすごろく場が　あったんですね。\n@c0@"
3:
  de: "@aNera@bMeine Güte! Es dauert bestimmt Tage, um hier ans Ziel zu kommen!\n@c0@"
  en: "@aNera@bGoodness! It would take days to reach the goal in this place.\n@c0@"
  es: "@aNera@b¡Por la Diosa! Llevaría días alcanzar la meta, en questo sitio.\n@c0@"
  fr: "@aNera@bPar la Déesseⓠ Il faudrait des jours pour remporter la partie.\n@c0@"
  it: "@aNera@bA occhio e croce, ci vorranno tre o quattro anni per raggiungere la fine...\nFacciamo cinque, va'...\n@c0@"
  ja: "@a@bフローラ「ここ…　何日くらい\n\tかければ　ゴールできるんでしょうか？\n@c0@"
4:
  de: "@a%0%a001240@bWas für 'n Mega-T&T-Brett! Ist das aufregend!\n@c0@"
  en: "@a%0%a001240@bWhat a ginormous T 'n' T Board! I'm so excited!\n@c0@"
  es: "@a%0%a001240@b¡Vaya tablero de T y T más enorme! ¡Estoy emocionado!\n@c0@"
  fr: "@a%0%a001240@bIl est super grand, ce jeu de TNTⓠ J'ai hâteⓠ\n@c0@"
  it: "@a%0%a001240@bQuesta Tavola della Sorte è ultrasupergigantesca!\nÈ fortissimissima!\n@c0@"
  ja: "@a@b%a001240「すご～～く\n\t広いすごろく場だね！\n\tボク　わくわくしちゃうな！\n@c0@"
5:
  de: "@a%0%a001240@bWie oft man wohl würfeln müsste, um hier ins Ziel zu kommen? Fünfzigmal? Hundermal?\n@c0@"
  en: "@a%0%a001240@bI wonder how many times you'd have to roll the dice to get to the goal here. Fifty? A hundred?\n@c0@"
  es: "@a%0%a001240@b¿Cuántas veces habrá que tirar el dado para llegar a la meta? ¿Cincuenta? ¿Cien?\n@c0@"
  fr: "@a%0%a001240@bJe me demande combien de fois il va falloir lancer le dé pour arriver à la fin. Cinquanteⓡ Centⓡ\n@c0@"
