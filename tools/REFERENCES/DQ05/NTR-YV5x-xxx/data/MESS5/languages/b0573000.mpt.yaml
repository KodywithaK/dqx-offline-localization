  ja: "@a@b%a001250「もしかして　タークくんを\n\t仲間にするには　お父さんの魔物の\n\tだれかと　お別れしないといけないの？\n@c0@"
21:
  de: "@a%0%a001250@bHmm... Das ist wirklich schwierig.\n@c0@"
