15:
  de: "@aSancho@bSí, er ist ein Monster, aber er ist doch noch ein Bebé. Es ist so traurig, ihn so dursseinander zu sehen. Iss... iss... (schluchz)\n@c0@"
  en: "@aSancho@bSí, he ees a monster, but he ees estill just a bebé.\r\nEes eso esad to esee heem looking upset like that. I, I... (sob)\n@c0@"
  es: "@aSancho@bSí, es un monstruo, pero es un bebe, nomás.\nMe da penita verlo tan afligido. Yo, yo... (snif)\n@c0@"
  fr: "@aSancho@bSi, c'est oun m-monstre, mais ce n'est encore qu'oun bébé. C'est t-triste de le v-voir comme ça. Je... Je... (sanglot)\n@c0@"
