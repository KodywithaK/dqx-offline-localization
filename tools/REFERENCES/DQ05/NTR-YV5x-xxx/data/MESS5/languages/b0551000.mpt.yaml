0:
  de: "@a%0%a001240@bSieht so aus, als würde das mit der Kugel nicht funktionieren... Und was machen wir jetzt, Papa?\n@c0@"
  en: "@a%0%a001240@bLooks like that gold bauble just doesn't cut it for some reason. What do we do now, Dad?\n@c0@"
  es: "@a%0%a001240@bParece que esa esfera dorada no acaba de funcionar. ¿Qué hacemos ahora, papi?\n@c0@"
  fr: "@a%0%a001240@bOn dirait que la boule dorée ne fait pas l'affaire. Qu'est-ce qu'on fait maintenant, papaⓡ\n@c0@"
  it: "@a%0%a001240@bPapà, allora la sfera dorata non serve a niente?\nChe facciamo adesso?\n@c0@"
  ja: "@a@b%a001240「やっぱり　このオーブじゃ\n\tダメなんだね……。\n\tどうしよう　お父さん。\n@c0@"
1:
  de: "@a%0%a001250@bHeißt das, wir müssen zurück zum Feenschloss? Hurra! Mann, haben wir ein Glück!\n@c0@"
  en: "@a%0%a001250@bDoes this mean we get to go back to the Faerie Palace? Yay! We're so lucky!\n@c0@"
  es: "@a%0%a001250@b¿Eso quiere decir que volvemos al Palacio de las Hadas? ¡Bien! ¡Qué suerte!\n@c0@"
  fr: "@a%0%a001250@bÇa veut dire que nous devons retourner au palais des Féesⓡ Ouaisⓠ C'est génialⓠ\n@c0@"
  it: "@a%0%a001250@bDobbiamo tornare alla Reggia Fatata?!\nEvviva! Che bellezza!\n@c0@"
  ja: "@a@b%a001250「また　妖精さんのお城へ\n\t行くのよね？\n\tえへへ　うれしいな。\n@c0@"
2:
  de: "@aSancho@bIss kann nisst erkennen, was mit diese Kugel nisst stimmen soll. Sie ist gold und rund. Wo ist die Problema?\n@c0@"
  en: "@aSancho@bI can no esee anytheeng wrong weeth thees bauble.\r\nEes gold and ees round. What ees the problem?\n@c0@"
  es: "@aSancho@bNo le veo nada de malo a esa esfera dorada.\nEs redonda y es dorada. ¿Cuál es el problema?\n@c0@"
  fr: "@aSancho@bJ-Je vois pas ce qui v-va pas avec cette boule d-dorée. Elle est r-ronde et elle est d-dorée. C'est q-quoi el problemaⓡ\n@c0@"
  it: "@aSancho@bNo entiendo por qué esta sfera dorata no es buena...\n¡Es muy esferica, y muy dorata!\n¿Qual es el problema?\n@c0@"
  ja: "@a@bサンチョ「私の目には　ばっちり\n\t金色に光って見えるんですけど。\n\tうーん…　むずかしいですね。\n@c0@"
3:
  de: "@aOtto@bNach all den Mühen, die wir durchgestanden haben! Ein bisschen Anerkennung hätten wir schon verdient.\n@c0@"
  en: "@aTuppence@bAfter all that effort we went to! You'd think we deserved a little credit at least.\n@c0@"
  es: "@aAlazar@b¡Después de tantos esfuerzos! Al menos nos podrían reconocer el mérito.\n@c0@"
  fr: "@aInnocent@bAprès tout ce qu'on a faitⓠ Je pense qu'on devrait peut-être nous remercier un peu.\n@c0@"
  it: "@aSimon@bCome sarebbe a dire che quest'affare è del tutto inutile?!\r\nAbbiamo fatto una fatica incredibile per ottenerlo!\n@c0@"
  ja: "@a@bピピン「あんなに　苦労したのに……。\n\tちょっとくらい　まけてくれても\n\tいいじゃないですか。　ねえ？\n@c0@"
4:
  de: "@a%0%a001240@bGlaubst du wirklich, dass diese winzige Kugel die Macht besitzt, das Schloss wieder in den Himmel aufsteigen zu lassen?\n@c0@"
  en: "@a%0%a001240@bDo you think this tiny little gold orb really has the power to make the castle float up in the sky again?\n@c0@"
  es: "@a%0%a001240@b¿De verdad crees que este pequeño orbe de oro tiene el poder de hacer que el castillo flote de nuevo en el cielo?\n@c0@"
  fr: "@a%0%a001240@bTu crois vraiment que ce petit orbe d'or peut renvoyer le château dans le cielⓡ\n@c0@"
  it: "@a%0%a001240@bCredi davvero che questo globo d'oro abbia il potere di far tornare in cielo Zenithia?\n@c0@"
  ja: "@a@b%a001240「こんなちっちゃい\n\t金色のオーブに　本当に\n\tお城を浮かせる力が　あるのかな？\n@c0@"
5:
  de: "@a%0%a001240@bWir sind ganz schön lange weg gewesen. Ich hoffe, Dr. Ache war nicht zu einsam ohne uns.\n@c0@"
  en: "@a%0%a001240@bWe've been away quite a while now.\nI hope Dr Agon's not too lonely.\n@c0@"
  es: "@a%0%a001240@bHemos estado ausentes mucho tiempo.\nEspero que el Dr. Agón no se haya sentido muy solo.\n@c0@"
  fr: "@a%0%a001240@bÇa fait longtemps qu'on est partis. J'espère que le Dr Agon s'ennuie pas trop.\n@c0@"
  it: "@a%0%a001240@bSiamo stati via per un bel po'.\nSpero che il Dottor Agon non si sia arrabbiato...\n@c0@"
  ja: "@a@b%a001240「ちょっと　おそくなったよね。\n\tプサンさん　さみしくなってないかな？\n@c0@"
6:
  de: "@a%0%a001250@bIch bin sicher, dass sich alles zum Guten wenden wird. Komm, lass uns Dr. Ache die Kugel zeigen!\n@c0@"
  en: "@a%0%a001250@bI'm positive this will make everything okay!\nWe have to hurry and show it to Dr Agon!\n@c0@"
  es: "@a%0%a001250@b¡Estoy segura de que todo se arreglará con esto!\n¡Démonos prisa en enseñárselo al Dr. Agón!\n@c0@"
  fr: "@a%0%a001250@bJe suis sûre que tout va rentrer dans l'ordre avec cet orbe. Dépêchons-nous d'aller le montrer au Dr Agonⓠ\n@c0@"
  it: "@a%0%a001250@bScommetto che ora andrà tutto a posto!\nSbrighiamoci, papà!\nNon vedo l'ora di tornare dal Dottor Agon!\n@c0@"
  ja: "@a@b%a001250「絶対　大丈夫よ！\n\tねえ　プサンさんの所に　行こ？\n@c0@"
7:
  de: "@a%0%a001250@bEs herrscht so eine gespannte Atmosphäre im Schloss... Vielleicht weiß es ja, dass wir die Kugel haben.\n@c0@"
  en: "@a%0%a001250@bThe castle's giving off a really fidgety air, like it's on tenterhooks. Maybe it knows we have the orb.\n@c0@"
  es: "@a%0%a001250@bParece como si el castillo estuviese sobre ascuas esperando algo. A lo mejor sabe que tenemos la esfera dorada.\n@c0@"
  fr: "@a%0%a001250@bLe château a l'air de frémir. C'est comme s'il sentait qu'on a récupéré l'orbe.\n@c0@"
  it: "@a%0%a001250@bSi respira una strana atmosfera nel castello...\nSembra quasi che l'edificio sappia che abbiamo il globo...!\n@c0@"
  ja: "@a@b%a001250「お城も　ソワソワしてるみたい。\n\tゴールドオーブを　持ってるからよね？\n@c0@"
8:
  de: "@aSancho@bHmm... Findest du nisst auch, dass diese Kugel genauso aussieht wie die andere?\n@c0@"
  en: "@aSancho@bHmm... You no theenk thees orb, eet looks exactly the esame, just like the bauble?\n@c0@"
  es: "@aSancho@bMmm... Este orbe es igualito que la esfera dorada.\n@c0@"
  fr: "@aSancho@bMmm... T-Tu crois pas que cet orbe, il a la même t-tête que la b-bouleⓡ\n@c0@"
  it: "@aSancho@bMe sembra que el globo de oro es totalmentes identico alla esfera dorata...\n@c0@"
  ja: "@a@bサンチョ「う～む…　オーブってのは\n\tどれも　同じに見えますけど……。\n\t大丈夫でしょうか？\n@c0@"
9:
  de: "@aSancho@bIss verstehe nissts von all diesen Kugeln. Für miss eine sieht aus wie die andere. Wir müssen sie Dr. Ache zeigen, er weiß schon, was zu tun ist.\n@c0@"
  en: "@aSancho@bI no understand about the orbs and the baubles.\r\nEes all just balls to me. We must eshow thees one to Dr Agon, and esee what he esays.\n@c0@"
  es: "@aSancho@bNo entiendo nada de orbes ni esferas.\nPara mí todo son meras bolas. Vamos a enseñársela al Dr. Agón a ver qué dice él.\n@c0@"
  fr: "@aSancho@bJ-Je comprends rien sur les o-orbes et les b-boules. Ils s-sont tous les d-deux ronds. Il f-faut les montrer au Dr Agon et v-voir ce qu'il d-dit.\n@c0@"
  it: "@aSancho@bNo entiendo qual es la diferencia tra el globo de oro y la esfera dorata.\nMah, vediamo que dice el Dottor Agon...\n@c0@"
  ja: "@a@bサンチョ「ともあれ　プサンさんに\n\tオーブを　見てもらいましょう。\n@c0@"
10:
  de: "@aOtto@bNun werde ich also tatsächlich Zeuge, wie sich dieses legendäre Schloss wieder in den Himmel erhebt!\n@c0@"
  en: "@aTuppence@bWell! It seems I'm about to bear witness to the momentous moment when this legendary castle\r\nonce again takes to the skies!\n@c0@"
  es: "@aAlazar@b¡Vaya! ¡Parece que voy a ser testigo del momento memorable en que este castillo legendario se elevará otra vez a los cielos!\n@c0@"
  fr: "@aInnocent@bEh bienⓠ Je pense que je vais être témoin d'un moment historique quand le château légendaire va retrouver sa place dans le cielⓠ\n@c0@"
  it: "@aSimon@bChe emozione!\nSto per assistere al decollo del castello!\nAl suo ritorno tra le nuvole!\n@c0@"
  ja: "@a@bピピン「伝説の城が浮上する\n\t劇的なシーンに　ボクが立ち会うことに\n\tなるかも知れないんですね。\n@c0@"
11:
  de: "@aOtto@bUnd ich hab bei der Suche nach dieser Kugel einen wichtigen Beitrag g'leistet... Ähm, beachtet mich gar net! Ich hab nur laut g'dacht...\n@c0@"
  en: "@aTuppence@bTo think I was involved in finding the orb...\nEr! Don't mind me! Just thinking out loud.\n@c0@"
  es: "@aAlazar@bY pensar que yo he ayudado a encontrar el orbe...\nEjem... ¡No me hagáis caso! Estaba pensando en voz alta.\n@c0@"
  fr: "@aInnocent@bDire que c'est un peu grâce à moi que l'orbe a été retrouvé... Euh, rienⓠ Je pensais à voix haute.\n@c0@"
  it: "@aSimon@bIl prode e valoroso Simon ha portato a termine un'altra missione pericolosa: il recupero del globo d'oro! Con supremo sprezzo del pericolo, egli...\n㈡\nEhm, cioè, l'umile Simon ha aiutato il coraggioso re %a000090 a entrare in possesso del globo d'oro. Così va meglio, Sire?\n@c0@"
  ja: "@a@bピピン「そのオーブを　見つけたのは\n\tボクだってことに……\n\tいえ！　なんでもないですっ。\n@c0@"
12:
  de: "@a%0%a001240@bHast du gesehen, Papa? Das Schloss schwebt! Es schwebt tatsächlich in der Luft! Komm, wir sehen uns mal draußen um.\n@c0@"
  en: "@a%0%a001240@bDid you see that, Dad? The castle's floating! It really is floating! Let's go and have a look outside.\n@c0@"
  es: "@a%0%a001240@b¿Has visto eso, papi? ¡El castillo está flotando! ¡Flota de verdad! Vamos a echar un vistazo desde afuera.\n@c0@"
  fr: "@a%0%a001240@bT'as vu ça, papaⓡ Le château flotteⓠ Il flotte vraimentⓠ On va voir dehors.\n@c0@"
  it: "@a%0%a001240@bPapà, il castello sta volando davvero!\nAndiamo a dare un'occhiata fuori!\n@c0@"
  ja: "@a@b%a001240「お父さん　見た？\n\tこのお城　本当に浮かんだみたいだよ！\n\tねえ　外に出てみようよ。\n@c0@"
13:
  de: "@a%0%a001250@bDieser Stein bringt das Schloss also zum Fliegen! Wie aufregend!\n@c0@"
  en: "@a%0%a001250@bSo standing on that stone makes the castle fly!\nOoh, how exciting!\n@c0@"
  es: "@a%0%a001250@b¡Así que, cuando te pones sobre esa piedra, el castillo vuela!\n¡Qué emocionante!\n@c0@"
  fr: "@a%0%a001250@bLe château flotte si on se met sur cette pierreⓠ C'est tellement génialⓠ\n@c0@"
  it: "@a%0%a001250@bE così salire su quella pietra fa volare il castello?!\nMi sembra incredibile!\n@c0@"
  ja: "@a@b%a001250「あの石板に乗ると\n\tお城が飛ぶの？　おもしろ～い！\n@c0@"
14:
  de: "@aSancho@bDiese Señor Ache ist schon eine komisse Kerl, no?\n@c0@"
  en: "@aSancho@bThees señor Agon, he ees eslippery like the eel, no?\n@c0@"
  es: "@aSancho@bEse señor Agón es escurridizo como el gusanito del mezcal, ¿no?\n@c0@"
  fr: "@aSancho@bC-Ce señor Agon, il est aussi g-glissant qu'une anguille, nonⓡ\n@c0@"
  it: "@aSancho@bEsto señor Dottor Agon es un hombre muy estrano, chico...\n@c0@"
  ja: "@a@bサンチョ「それにしても\n\tプサンさんは　まったく\n\tつかみどころのない人ですね。\n@c0@"
15:
  de: "@aOtto@bUns allein lassen?\n@c0@"
  en: "@aTuppence@bLeave things up to us?\n@c0@"
  es: "@aAlazar@b¿Nos deja al cargo?\n@c0@"
  fr: "@aInnocent@bNous laisser les commandesⓡ\n@c0@"
  it: "@aSimon@bHa affidato il comando delle operazioni... a noi?!\n@c0@"
  ja: "@a@bピピン「あとは　まかせるって\n\tいったい何を？\n@c0@"
16:
  de: "@aOtto@bEr will uns doch net wirklich an diesem Ort allein lassen?!\n@c0@"
  en: "@aTuppence@bSurely he doesn't mean we can just do whatever we want with the place!?\n@c0@"
  es: "@aAlazar@b¡No querrá decir que podemos hacer lo que nos dé la gana, ¿verdad?!\n@c0@"
  fr: "@aInnocent@bIl ne veut quand même pas dire qu'on peut faire tout ce qu'on veutⓠⓑ\n@c0@"
  it: "@aSimon@bNon vorrà mica lasciarci la responsabilità di tutto il castello, eh?!\nIo non so nemmeno badare a me stesso!\n@c0@"
  ja: "@a@bピピン「この城を　自由に\n\t使っていいってことですかね？\n\tムフフ……。\n@c0@"
17:
  de: "@a%0%a001240@bVielleicht hat Dr. Ache ja auch Winterschlaf gehalten, all die Jahre, wo er im Kreis rumgefahren ist. Sonst wäre er ja vor Hunger umgekommen!\n@c0@"
  en: "@a%0%a001240@bDr Agon must've stopped the clock too, during all those years going round and round in the Diggery Pokery. Otherwise he would've starved to death!\n@c0@"
  es: "@a%0%a001240@bEl Dr. Agón debe de haber parado el tiempo, con los años que se ha pasado dando vueltas en la Cava Excava. ¡Es que, si no, se habría muerto de hambre!\n@c0@"
  fr: "@a%0%a001240@bDr Agon doit aussi avoir arrêté le temps quand il tournait sans fin dans la Vieille mine sinon il serait mort de faim.\n@c0@"
  it: "@a%0%a001240@bCerto che è incredibile che il Dottor Agon sia riuscito a sopravvivere per tanto tempo nell'Excavatorium...\n㈡\nCome ha potuto resistere così a lungo senza mangiare?\n@c0@"
  ja: "@a@b%a001240「プサンさんも　ボクたちが来る前\n\t時間を止めて　回っていたのかもね。\n\tじゃないと　お腹がすいて死んじゃうよ！\n@c0@"
18:
  de: "@a%0%a001250@bSie halten wirklich Winterschlaf? Ich wusste gar nicht, dass Zenithianer so was tun!\n@c0@"
  en: "@a%0%a001250@bSo they stop the clock and go into hibernation?\nI had no idea Zenithians could do such a thing!\n@c0@"
  es: "@a%0%a001250@b¿Así que hibernan?\n¡No sabía que los zenithios pudiesen hacer algo así!\n@c0@"
  fr: "@a%0%a001250@bIls peuvent arrêter le temps et plonger en hibernationⓡ J'aurais jamais pensé que les Zénithiens pouvaient faire un truc comme ça.\n@c0@"
  it: "@a%0%a001250@bGli Zenithiani possono ibernarsi?\nNon sapevo che ne avessero la capacità!\nÈ una cosa straordinaria!\n@c0@"
  ja: "@a@b%a001250「時間を止めて\n\t眠っていたって…　天空人さんて\n\tそんなことができるの！？\n@c0@"
19:
  de: "@aSancho@bDiese Leute von Zenithia, sie sind stark wie die Göttin, no?\n@c0@"
  en: "@aSancho@bThese people from Zenithia, they are estrong like the Goddess, no?\n@c0@"
  es: "@aSancho@bEstos de Zenithia tienen puro poder, como la Diosa, ¿no?\n@c0@"
  fr: "@aSancho@bCes g-gens de Zénithia, ils sont f-forts comme la Déesse.\n@c0@"
  it: "@aSancho@bLos abitantes de Zenithia sono muy fuertes...\n¡Hanno avuto la capacidad de resistere tanto tiempo en condiciónes difícilissimas!\n@c0@"
  ja: "@a@bサンチョ「いやはや\n\t天空人の生命力の強さは\n\t神に近いものを　感じますよ。\n@c0@"
20:
  de: "@aOtto@bDiese Zenithianer scheinen mir ein munteres Völkchen zu sein. Und einfallsreich noch dazu!\n@c0@"
  en: "@aTuppence@bThose Zenithians sound like a crafty bunch.\r\nOr should I say ingenious?\n@c0@"
  es: "@aAlazar@bEstos zenithios son de lo más astuto, ¿eh?\n¿O debería decir ingeniosos?\n@c0@"
  fr: "@aInnocent@bCes Zénithiens ont l'air malins. Peut-être devrais-je dire ingénieuxⓡ\n@c0@"
  it: "@aSimon@bSono in gamba gli Zenithiani, eh?\nComplimenti a loro!\n@c0@"
  ja: "@a@bピピン「天空人って　本当に　しぶとい\n\t…いや　たくましいんですね。\n@c0@"
21:
  de: "@a%0%a001240@bEr kennt Dr. Ache gar nicht? Komisch. Vielleicht ist er nur verwirrt, weil er gerade erst wach geworden ist...\n@c0@"
  en: "@a%0%a001240@bHe doesn't know Dr Agon? That's weird. Maybe he's a bit confused because he just woke up.\n@c0@"
  es: "@a%0%a001240@b¿No conoce al Dr. Agón? ¡Qué raro! A lo mejor está un poco confuso porque se acaba de despertar.\n@c0@"
  fr: "@a%0%a001240@bIl connaît pas le Dr Agonⓡ C'est bizarre. Il est peut-être pas encore bien réveillé.\n@c0@"
  it: "@a%0%a001240@bNon conosce il Dottor Agon? Che strano...\nForse non si ricorda di lui perché s'è appena svegliato ed è ancora confuso...\n@c0@"
  ja: "@a@b%a001240「プサンさんのこと\n\t知らないって？　寝起きだから\n\t頭が　ぼんやりしてるのかな？\n@c0@"
22:
  de: "@aOtto@bIch wusste es! Ich wusste von Anfang an, dass mit diesem Kerl etwas net stimmt! Er hat ja noch net mal Flügel!\n@c0@"
  en: "@aTuppence@bI knew it! I've been thinking he was a bit suspicious all along. I mean, he doesn't have wings for starters!\n@c0@"
  es: "@aAlazar@b¡Lo sabía! Me ha parecido sospechoso desde el principio. ¡Para empezar, ni siquiera tiene alas!\n@c0@"
  fr: "@aInnocent@bJe m'en doutaisⓠ Dès le départ, je l'ai trouvé bizarre. C'est vrai. Pour commencer, il a pas d'ailes.\n@c0@"
  it: "@aSimon@bLo sapevo che il Dottor Agon era un impostore! L'ho capito dal primo momento che l'ho visto! Come fa a essere uno Zenithiano, se non ha nemmeno le ali, eh?!\n@c0@"
  ja: "@a@bピピン「やっぱり！　ボクは　最初から\n\tあやしいと思ってましたよ。\n\tだって　あの人　羽がないし。\n@c0@"
23:
  de: "@a%0%a001240@bEs macht mir ein bisschen Angst, das Schloss so hin und her zu bewegen. Wir könnten doch niemals für den Schaden aufkommen, falls etwas passiert...\n@c0@"
  en: "@a%0%a001240@bIt's a bit nerve-racking moving the castle about\nthe place. We'd never be able to afford to pay\nfor any damage.\n@c0@"
  es: "@a%0%a001240@bEsto de mover el castillo de un lado para otro te deja los nervios destrozados. Si le pasa algo, no podremos pagar los daños ni en un siglo.\n@c0@"
  fr: "@a%0%a001240@bC'est stressant de diriger le château. Comment on fera pour rembourser si on l'abîmeⓡ\n@c0@"
  it: "@a%0%a001240@bPapà, fai attenzione!\nSe danneggiamo il castello, dovremo lavorare per una dozzina di secoli per pagare le riparazioni!\n@c0@"
  ja: "@a@b%a001240「天空城を　動かすなんて\n\tきんちょうするよね。　だって\n\tこわしたら　べんしょうできないもん。\n@c0@"
24:
  de: "@a%0%a001250@bEs kommt mir nicht richtig vor, dass das Schloss wieder unten ist. Schließlich soll Zenithia doch über den Wolken schweben, oder?\n@c0@"
  en: "@a%0%a001250@bI can't help feeling a bit bad about landing the castle on the ground. I mean, Zenithia's supposed to float up above the clouds, after all.\n@c0@"
  es: "@a%0%a001250@bEsto de aterrizar con el castillo me hace sentir un poco mal. Después de todo, se supone que Zenithia debería flotar por encima de las nubes.\n@c0@"
  fr: "@a%0%a001250@bJe me sens un peu mal à l'aise de faire atterrir le château. C'est vrai. Zénithia est censé flotter au-dessus des nuages, nonⓡ\n@c0@"
  it: "@a%0%a001250@bPerché dovremmo portare il castello a terra?\nCredevo che il posto di Zenithia fosse tra le nuvole...\n@c0@"
  ja: "@a@b%a001250「天空城なのに　地面に\n\tおろしておくのは　ちょっと\n\t悪いような気がするの……。\n@c0@"
25:
  de: "@a%0%a001240@bIm hinteren Zimmer? Er meint wohl den Raum hinter dem Kamin, richtig? Ich frage mich, was der alte Mann dort tut...\n@c0@"
  en: "@a%0%a001240@bThe ⓗrearward chamberⓘ? He means at the back of the fireplace, right? I wonder what the old man can be doing back there.\n@c0@"
  es: "@a%0%a001240@b¿Los ⓕaposentos de atrásⓖ? Quiere decir detrás de la chimenea, ¿no? Me pregunto qué estará haciendo el viejo ahí.\n@c0@"
  fr: "@a%0%a001240@bLa ⓥpièce du fondⓦⓡ Il veut dire derrière la cheminéeⓡ Je me demande ce que ce petit vieux peut bien y faire.\n@c0@"
  it: "@a%0%a001240@bLa ⓕsala posterioreⓖ?\nForse intende dietro al camino?\n@c0@"
  ja: "@a@b%a001240「奥って　ダンロの奥だよね？\n\tなんで　そんなところに　いるんだろ…\n\tヘンな　おじいさんだね。\n@c0@"
26:
  de: "@a%0%a001240@bUnd das soll wirklich vom Yggdrasil-Baum sein? So ein kleiner Schössling?\n@c0@"
  en: "@a%0%a001240@bThis is from the Yggdrasil tree?\nA tiny little sapling like this?\n@c0@"
  es: "@a%0%a001240@b¿Es del árbol Yggdrasil?\n¿Un retoño medio enano como este?\n@c0@"
  fr: "@a%0%a001240@bCela vient de l'Yggdrasilⓡ Une petite pousse comme çaⓡ\n@c0@"
  it: "@a%0%a001240@bQuesto piccolo virgulto viene da Ygdrasil, il Grande Albero del Mondo?\nChe meraviglia!\n@c0@"
  ja: "@a@b%a001240「世界樹！？\n\tこんな　ちっちゃな苗が？？\n@c0@"
27:
  de: "@a%0%a001250@bWie klein und zerbrechlich! Soll ich ihn vielleicht gießen, Papa?\n@c0@"
  en: "@a%0%a001250@bIt's so tiny and delicate!\nCan I give it some water, Dad?\n@c0@"
  es: "@a%0%a001250@b¡Es tan minúsculo y delicado!\n¿Puedo ponerlo en agua, papi?\n@c0@"
  fr: "@a%0%a001250@bC'est si joli et si petit. Je peux l'arroser, papaⓡ\n@c0@"
  it: "@a%0%a001250@bQuesto virgulto è così tenero e delicato...\nPapà, che ne diresti di dargli un po' d'acqua?\n@c0@"
  ja: "@a@b%a001250「ちいさくて　かわいいね。\n\tお父さん　わたしが\n\t水やりしてもいい？\n@c0@"
28:
  de: "@a%0%a001250@bDer kleine Schössling hat sich tapfer geschlagen in all dem Wasser. Er ist sehr hartnäckig.\n@c0@"
  en: "@a%0%a001250@bThis tiny sapling's done so well in all that water.\nIt's a determined little thing.\n@c0@"
  es: "@a%0%a001250@bAl retoño le ha sentado muy bien toda ese agua.\nTiene un aspecto fuerte y decidido.\n@c0@"
  fr: "@a%0%a001250@bCette petite pousse a bien grandi dans l'eau. On sent qu'elle veut s'en sortir.\n@c0@"
  it: "@a%0%a001250@bÈ incredibile che questo virgulto sia riuscito a sopravvivere alla catastrofe che aveva colpito Zenithia...\n㈡\nDev'essere molto più forte e resistente di quanto non appaia.\n@c0@"
  ja: "@a@b%a001250「この苗木さん\n\tお水の中でも　しっかり生きてたのね。\n\tおりこうさんだね。\n@c0@"
29:
  de: "@aSancho@bEs heißt, dass man mit eine Yggdrasil-Blatt einen Verstorbenen wieder zum Leben erwecken kann.\n@c0@"
  en: "@aSancho@bThey esay you can breeng esomeone who has passed away back from the dead weeth the leaf of Yggdrasil.\n@c0@"
  es: "@aSancho@bDicen que con la hoja de Yggdrasil puedes traer de vuelta a una persona que murió.\n@c0@"
  fr: "@aSancho@bIl p-paraît qu'on p-peut ressusciter q-quelqu'un qui est m-mort avec cette feuille d'Yggdrasil.\n@c0@"
  it: "@aSancho@bPare que las foglias de Ygdrasil abbiano la capacidad de reportare en vida los muertos...\n@c0@"
  ja: "@a@bサンチョ「世界樹の葉は　死んだ者をも\n\t生きかえらせると言いますが……\n@c0@"
30:
  de: "@aSancho@bAber das ist ja nur eine Schössling. Er hat noch nisst so viel Kraft, glaube iss.\n@c0@"
  en: "@aSancho@bBut thees ees just a sapling. Eet no has esuch estrong power yet, I believe.\n@c0@"
  es: "@aSancho@bPero esto no es más que un retoñitito. Creo que no tiene aún tanto poder.\n@c0@"
  fr: "@aSancho@bM-Mais c'est j-juste une p-pousse. Elle p-peut pas avoir d-des pouvoirs c-comme ça.\n@c0@"
  it: "@aSancho@bPerò esto es solamentes un piccolo virgulto, y pienso que no ha ancoras esto potere incredibile...\n@c0@"
  ja: "@a@bサンチョ「まだ苗木の　この状態では\n\tそのチカラはないでしょうね。\n@c0@"
31:
  de: "@aOtto@bWenn wir diesen Schössling gut pflegen, hätten wir alle Yggdrasil-Blätter, die wir brauchen!\n㈡\nDann könnten wir jedem Kampf ohne Furcht entgegenblicken!\n@c0@"
  en: "@aTuppence@bIf we can keep this sapling going, we'll have all the Yggdrasil leaves we could possibly need! Now we can fight to the death without having to worry!\n@c0@"
  es: "@aAlazar@b¡Si podemos mantener vivo este retoño, tendremos tantas hojas de Yggdrasil como necesitemos!\n㈡\n¡Podremos luchar hasta la muerte sin tener que preocuparnos!\n@c0@"
  fr: "@aInnocent@bSi nous la faisons pousser, nous aurons toutes les pousses d'Yggdrasil qu'il nous fautⓠ Nous pourrons affronter la mort sans nous inquiéterⓠ\n@c0@"
  it: "@aSimon@bSe riuscissimo a far crescere questo virgulto di Ygdrasil, avremmo tutte le foglie che ci servono!\nDiventeremmo imbattibili!\n@c0@"
  ja: "@a@bピピン「この苗木を　育てれば\n\t世界樹の葉が　取り放題ですね！\n\tこれで　死ぬ気で　たたかえますよ！\n@c0@"
32:
  de: "@a%0%a001240@bⓞDie Dunkelheit breitet sich stetig aus...ⓟ Das heißt wohl, dass wir uns beeilen müssen...\n@c0@"
  en: "@a%0%a001240@bⓗThe darkness spreadethⓘ... I think that means\nwe'd better hurry, Dad.\n@c0@"
  es: "@a%0%a001240@bⓕLa oscuridad se propagaⓖ... Creo que eso quiere decir que nos demos prisa, papi.\n@c0@"
  fr: "@a%0%a001240@bⓥL'obscurité s'étendⓦ... Ça veut dire qu'il faut se dépêcher, papa.\n@c0@"
  it: "@a%0%a001240@bLa potenza di Nimzo sta crescendo e l'oscurità minaccia il mondo intero...\nPapà, credo che non ci resti molto tempo...\n@c0@"
  ja: "@a@b%a001240「大地も　闇に……。\n\tねえ　お父さん　ボクたち\n\t急がなくちゃいけないんだね。\n@c0@"
33:
  de: "@a%0%a001250@bDer arme Schössling, wird einfach so in einen Topf gesteckt!\n@c0@"
  en: "@a%0%a001250@bThat poor sapling, confined to such a tiny pot!\n@c0@"
  es: "@a%0%a001250@b¡Pobre retoño, metido en esa maceta tan pequeña!\n@c0@"
  fr: "@a%0%a001250@bCette pauvre pousseⓠ Elle est dans un si petit pot.\n@c0@"
  it: "@a%0%a001250@bPovero virgulto, costretto a stare in un vaso così piccolo...\n@c0@"
  ja: "@a@b%a001250「あの世界樹の苗木さん\n\tちいさい鉢の中で　かわいそう……。\n@c0@"
34:
  de: "@a%0%a001250@bSobald wir Nimzo besiegt haben, müssen wir einen richtig schönen Ort für ihn finden, wo immer die Sonne scheint!\n@c0@"
  en: "@a%0%a001250@bOnce we've defeated Nimzo, we'll have to make\nsure it's moved to a nice big place with lots and\nlots of sunshine!\n@c0@"
  es: "@a%0%a001250@b¡Cuando hayamos derrotado a Nimzo lo trasplantaremos a un sitio bien grande y bonito y con mucho sol!\n@c0@"
  fr: "@a%0%a001250@bUne fois Nimzo vaincu, nous devrons le replanter dans un joli endroit avec le plus de soleil possible.\n@c0@"
  it: "@a%0%a001250@bDopo che avremo sconfitto Nimzo, lo metteremo in un posto pieno di sole, così crescerà robusto e rigoglioso!\n@c0@"
  ja: "@a@b%a001250「ミルドラースを　やっつけたら\n\t広くて　お日さまが　いっぱい\n\t当たる場所に　植え直してあげようね！\n@c0@"
35:
  de: "@aSancho@bSi, das ist eine Schössling von die große Weltenbaum. Wenn du nisst gut auf ihn aufpasst, wird die Göttin sisser böse!\n@c0@"
  en: "@aSancho@bSí, ees just the esapling, but ees from the Great World Tree. Eef you no look after eet well, the Goddess, eshe gonna make you pay!\n@c0@"
  es: "@aSancho@bSí, solo es un retoño, pero es del Gran Árbol del Mundo, híjole. ¡Si no lo cuidas bien, la Diosa te lo hará pagar!\n@c0@"
  fr: "@aSancho@bSi, c'est j-juste oune pousse, mais elle v-vient du Grand arbre du M-Monde Si t-tu y fais pas attention, la D-Déesse te f-fera payer.\n@c0@"
  it: "@aSancho@b¡Esto virgulto viene dal Grande Albero del Mundo!\n¡Es un dono della dea!\nChico, me raccomando: abbine cura.\n@c0@"
  ja: "@a@bサンチョ「苗木でも　世界樹は\n\t世界樹ですから……。\n\t大事にしないと　バチが当たりますよ！\n@c0@"
36:
  de: "@a%0%a001240@bEin Geschenk? Eigentlich sollen wir keine Geschenke von Fremden annehmen. Aber wenn du dabei bist, geht das wohl in Ordnung...\n@c0@"
  en: "@a%0%a001240@bA present? We're not supposed to take presents from strangers. But I suppose it's okay if you're here, Dad.\n@c0@"
  es: "@a%0%a001240@b¿Un regalo? No podemos aceptar regalos de extraños. Pero supongo que no pasa nada si estás tú delante, papá.\n@c0@"
  fr: "@a%0%a001240@bUn cadeauⓡ Je ne suis pas censé accepter de cadeaux d'étrangers, mais je suppose que ça va si tu es là, papa.\n@c0@"
  it: "@a%0%a001240@bRugiada di Ygdrasil?\nChissà che sapore ha...\n\n@c0@"
  ja: "@a@b%a001240「なにか　くれるの？\n\t知らない人だけど　お父さんと\n\tいっしょだから　もらってもいいよね？\n@c0@"
37:
  de: "@a%0%a001240@bIch wusste gar nicht, dass es hier auch Feen gibt. Glaubst du, dass die Zenithianer und Feen befreundet sind?\n@c0@"
  en: "@a%0%a001240@bI didn't know there were faeries here too. Do you think Zenithians and faeries are all good friends?\n@c0@"
  es: "@a%0%a001240@bNo sabía que aquí también hubiera hadas. ¿Crees que los zenithios y las hadas se llevan bien?\n@c0@"
  fr: "@a%0%a001240@bJe savais pas qu'il y avait des fées ici. Tu crois que les Zénithiens et les fées s'entendent bienⓡ\n@c0@"
  it: "@a%0%a001240@bNon sapevo che anche qui ci fossero delle fate.\nEvidentemente, le fate e gli Zenithiani sono amici...\n@c0@"
  ja: "@a@b%a001240「天空城には　妖精もいたんだね。\n\t天空の人と　妖精は　仲よしなのかな？\n@c0@"
38:
  de: "@a%0%a001250@bIst das etwa Yggdrasil...? Oh...\n@c0@"
  en: "@a%0%a001250@bIs that grass Yggdrasil? Ooh...\n@c0@"
  es: "@a%0%a001250@b¿Así que esa hierba es Yggdrasil? Ooh...\n@c0@"
  fr: "@a%0%a001250@bCette rosée provient de l'Yggdrasilⓡ Ooh...\n@c0@"
  it: "@a%0%a001250@bAnche questa proviene dall'albero di Ygdrasil?\n@c0@"
  ja: "@a@b%a001250「あの草って　世界樹なの？\n\tう～ん……。\n@c0@"
39:
  de: "@aSancho@bUi! Der Tau von Yggdrasil ist sehr, sehr wertvoll, Chico.\n@c0@"
  en: "@aSancho@bUf! The dew of Yggdrasil, ees a very valuable theeng.\n@c0@"
  es: "@aSancho@b¡Ay, caramba! El rocío de Yggdrasil es muy muy valioso.\n@c0@"
  fr: "@aSancho@bEh b-bahⓠ De la r-rosée d'Yggdrasil. Ça v-vaut très cher.\n@c0@"
  it: "@aSancho@bLa rugiada de Ygdrasil es una bevanda muy preciosa, chico...\n@c0@"
  ja: "@a@bサンチョ「世界樹のしずくとは　また\n\tすごそうなものですねえ。\n@c0@"
40:
  de: "@a%0%a001240@bWarum kann man denn nicht mehr haben? Es wäre doch viel praktischer, wenn man mehr als einen Tropfen nehmen könnte!\n@c0@"
  en: "@a%0%a001240@bThat's not fair! Why can we only have one lot at\na time? It'd be much better if we could takes loads of it!\n@c0@"
  es: "@a%0%a001240@b¡No es justo! ¿Por qué solo podemos llevar un poquito cada vez? ¡Sería mejor si pudiéramos llevar un montón de golpe!\n@c0@"
  fr: "@a%0%a001240@bC'est pas juste. Pourquoi on peut en avoir qu'une à la foisⓡ Ce serait mieux si on pouvait en avoir plein d'un coupⓠ\n@c0@"
  it: "@a%0%a001240@bPerché non si può avere più di una goccia di rugiada per volta?!\nNon è giusto!\n@c0@"
  ja: "@a@b%a001240「え～っ！\n\tひとつずつしか　持てないの？\n\tいっぱい持てると　便利なのにね！\n@c0@"
41:
  de: "@a%0%a001250@bWir müssen gut aufpassen, dass wir das bisschen Yggdrasil-Tau, das wir haben, nicht verschwenden.\n@c0@"
  en: "@a%0%a001250@bWe'll have to make sure we use the bit of Yggdrasil dew we have carefully then, Dad.\n@c0@"
  es: "@a%0%a001250@bTendremos que usar este poquito de rocío de Yggdrasil con prudencia, papi.\n@c0@"
  fr: "@a%0%a001250@bOn a intérêt de faire attention à la manière dont on utilise la rosée d'Yggdrasil, papa.\n@c0@"
  it: "@a%0%a001250@bPapà, cerchiamo di usare nel migliore dei modi la poca rugiada di Ygdrasil che abbiamo...\nNon possiamo permetterci di sprecarla.\n@c0@"
  ja: "@a@b%a001250「世界樹のしずく\n\t大事に使おうね　お父さん。\n@c0@"
42:
  de: "@aSancho@bSi, das stimmt. Wenn man zu viel von solch eine wertvolle Sache hat, vergisst man seine wahre Wert...\n@c0@"
  en: "@aSancho@bSí. Ees true. Eef you have too much of esometheeng like thees, you forget the true value of life.\n@c0@"
  es: "@aSancho@bEs la puritita verdad. Si tomas demasiada cantidad de una cosa, se olvida el verdadero valor de la vida.\n@c0@"
  fr: "@aSancho@bSi, c'est v-vrai. Si t-tu as quelque chose d'aussi\np-précieux en grande quantité, tu oublies la\nvraie v-valeur de la vie.\n@c0@"
  it: "@aSancho@bLa rugiada de Ygdrasil es un dono muy precioso.\r\nSi se ne potesse avere en gran quantità, dimenticheremmo quanto es importante la vida...\n@c0@"
  ja: "@a@bサンチョ「たしかに　そんなすごいものを\n\tいくつも持てたら　命のありがたみが\n\tなくなってしまいますね。\n@c0@"
43:
  de: "@aOtto@bSie könnte uns doch einfach ein paar Tropfen extra spendieren, oder? Schließlich kämpfen wir für den Weltfrieden...\n@c0@"
  en: "@aTuppence@bYou'd think she could just slip us a few extra lots out of goodwill, wouldn't you? We are fighting for world peace, after all.\n@c0@"
  es: "@aAlazar@bNo estaría mal que nos pasase unas cuantas raciones más por buena voluntad, ¿no? Al fin y al cabo, estamos luchando por la paz en el mundo.\n@c0@"
  fr: "@aInnocent@bVous ne croyez pas qu'elle pourrait en mettre quelques-unes en plusⓡ Nous nous battons pour restaurer la paix dans le monde quand même.\n@c0@"
  it: "@aSimon@bNon potremmo averne qualche goccia in più?\r\nCi farebbe comodo, visto che la missione che stiamo svolgendo è tutt'altro che agevole...\n@c0@"
  ja: "@a@bピピン「えんりょしないで　サービス\n\tしてほしいなあ。　ボクたちは　世界の\n\t平和のために　たたかってるんだし。\n@c0@"
44:
  de: "@a%0%a001240@bDie Kräfte des Zenithdrachen sind verschlossen? Was will er denn damit sagen?!\n@c0@"
  en: "@a%0%a001240@bThe Zenith Dragon? Sealed away powers?\nWhat is the old man on about!?\n@c0@"
  es: "@a%0%a001240@b¿El Dragón de Zenithia? ¿Poderes encerrados?\n¡Pero, ¿de qué está hablando este viejo?!\n@c0@"
  fr: "@a%0%a001240@bLe Dragon du Zénithⓡ Ses pouvoirs sont scellésⓡ Qu'est-ce qu'il raconte ce vieux monsieurⓡ\n@c0@"
  it: "@a%0%a001240@bI poteri del Drago di Zenithia sono custoditi nell'Artiglio Igneo?\nCosa vorrà dire quell'uomo...?\n@c0@"
  ja: "@a@b%a001240「マスタードラゴン？\n\t能力を封印した？？\n\tいったい　どういうこと？？？\n@c0@"
45:
  de: "@a%0%a001250@bDer Zenithdrache ist der Gott der Welt, richtig? Ich habe alles über ihn gelesen.\n@c0@"
  en: "@a%0%a001250@bThe Zenith Dragon is the god of this world, isn't he? I've read all about him.\n@c0@"
  es: "@a%0%a001250@bEl Dragón de Zenithia es el dios de este mundo, ¿no? Lo he leído todo sobre él.\n@c0@"
  fr: "@a%0%a001250@bLe Dragon du Zénith est le dieu de ce mondeⓡ J'ai lu quelque chose sur lui.\n@c0@"
  it: "@a%0%a001250@bIl Drago di Zenithia è la divinità che governa questo mondo.\nL'ho letto su un libro.\n@c0@"
  ja: "@a@b%a001250「マスタードラゴンって\n\tこの世界の神さまのことよね？\n\tわたし　ご本読んだから　知ってるの。\n@c0@"
46:
  de: "@aSancho@bQué? Noch eine Loch? Oh, meine arme Rücken... Aber mach dir keine Sorgen um deine alte Onkel Sancho. Lass uns gehen!\n@c0@"
  en: "@aSancho@bQué? Another tower? My back, ees no een esuch good eshape, you know. But you no worry about me. Olé! Let's go!\n@c0@"
  es: "@aSancho@b¿Qué? ¿Otra torre? Mi espalda ya comenzó a notarlo. Pero no te preocupes por mí. ¡Ándale! ¡Vamos!\n@c0@"
  fr: "@aSancho@bQuéⓡ Encore un t-tourⓡ Mon d-dos, il est pas en b-bon état. T'inquiète p-pas pour moi. Oléⓠ On y v-vaⓠ\n@c0@"
  it: "@aSancho@b¿Que cosa? ¿Un'altra torre?\r\nEstá bien.\r\nSi proprio dobbiamo andare, no me tirerò indietros...\n@c0@"
  ja: "@a@bサンチョ「ううっ　また　塔ですか……。\n\t少々　腰が痛みますが\n\tさあ　はりきって　行くとしましょう！\n@c0@"
47:
  de: "@aOtto@bIhr glaubt doch net, dass er g'fährlich ist, oder? Aber warum sollte man sonst seine Kräfte wegsperren...?\n@c0@"
  en: "@aTuppence@bYou don't think he's dangerous, do you? I mean, why would he be holed up in a place like this?\n@c0@"
  es: "@aAlazar@bNo será peligroso, ¿verdad? Porque, ¿qué hace encerrado en un sitio así?\n@c0@"
  fr: "@aInnocent@bVous ne croyez pas que c'est dangereuxⓡ Pourquoi Il se trouverait dans un endroit comme çaⓡ\n@c0@"
  it: "@aSimon@bMaestà, pensa che possiamo fidarci di quanto dice questo tipo?\nSecondo me, non ce la conta giusta...\n@c0@"
  ja: "@a@bピピン「こんな所に\n\t追いやられているなんて\n\t危ないじいさん　じゃないでしょうね？\n@c0@"
48:
  de: "@a%0%a001240@bJahrhunderte? Wow! Ich hätte nicht gedacht, dass das alles hier so alt ist.\n@c0@"
  en: "@a%0%a001240@bCenturies? Wow! I didn't realise this place\nwas so old.\n@c0@"
  es: "@a%0%a001240@b¿Siglos? ¡Arrea! No pensaba que este sitio fuese tan viejo.\n@c0@"
  fr: "@a%0%a001240@bDes sièclesⓡ Waouhⓠ J'aurais jamais pensé que cet endroit était si vieux.\n@c0@"
  it: "@a%0%a001240@bSecoli dopo?!\nAccipicchia!\nNon pensavo che questo posto fosse tanto vecchio!\n@c0@"
  ja: "@a@b%a001240「数百年かあ……。\n\tこのお城は　そんな昔から\n\tあったんだね。\n@c0@"
49:
  de: "@a%0%a001250@bHast du den Zenithdrachen je getroffen, Papa? Ich hab nur Bilder von ihm gesehen...\n@c0@"
  en: "@a%0%a001250@bHave you ever met the Zenith Dragon, Dad?\nI've only ever seen pictures of him in books.\n@c0@"
  es: "@a%0%a001250@b¿Has visto alguna vez al Dragón de Zenithia, papi?\nYo solo lo he visto en las ilustraciones de los libros.\n@c0@"
  fr: "@a%0%a001250@bTu as déjà rencontré le Dragon du Zénith, papaⓡ J'ai juste vu des illustrations dans les livres.\n@c0@"
  it: "@a%0%a001250@bPapà, hai mai incontrato il Drago di Zenithia?\nUna volta ho letto un libro dove c'erano delle immagini che lo raffiguravano...\n@c0@"
  ja: "@a@b%a001250「お父さんは\n\tマスタードラゴンに　会ったことある？\n\tわたしは　ご本でしか見たことないの。\n@c0@"
50:
  de: "@aSancho@bDann wir müssen diese Zenithdrache finden, si?\n@c0@"
  en: "@aSancho@bThen we must find thees Zenith Dragon, sí?\n@c0@"
  es: "@aSancho@bAsí que tenemos que encontrar ese Dragón de Zenithia, nomás, ¿no?\n@c0@"
  fr: "@aSancho@bOn d-doit trouver ce D-Dragon du Zénith, siⓡ\n@c0@"
  it: "@aSancho@b¿Quindi ahora dobbiamo trovare el Drago de Zenithia, eh?\n@c0@"
  ja: "@a@bサンチョ「そういうことなら\n\t平和のために　マスタードラゴンを\n\t探さねば　なりませんね。\n@c0@"
51:
