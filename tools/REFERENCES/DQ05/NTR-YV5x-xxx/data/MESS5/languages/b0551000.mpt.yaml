54:
  de: "@a%0%a001250@bDas Schloss erscheint mir nun viel fröhlicher. Na ja, es soll ja auch im Himmel schweben. Es hat ihm bestimmt keinen Spaß gemacht, unter Wasser zu sein.\n@c0@"
