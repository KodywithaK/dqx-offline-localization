  ja: "@a@b＊「最近　前にも　まして\n\tおかしな雲が　空を\n\tおおっています。\n@c0@"
307:
  de: "@a@b*: Ah, Eure Majestät.\nGeht ruhig weiter.\n@c0@"
  en: "@a@b*: Ah, Your Majesty.\nPlease, go ahead.\n@c0@"
  es: "@a@b*: ¡Ah!, Majestad.\r\nAdelante, por favor.\n@c0@"
  fr: "@a@b*ⓢ Ah, Votre Majesté.\nAllez-y, je vous en prie.\n@c0@"
  it: "@a@b*: I miei ossequi, Maestà.\nPrego, passi pure.\n@c0@"
  ja: "@a@b＊「闇の世界から　大魔王が\n\tやってくるという　ウワサは\n\t本当なのでしょうか……。\n@c0@"
308:
  de: "@aGertraud@bVater war so damit beschäftigt, %O0960%Xdich%YKönig %a000090%Z zu suchen, dass er überhaupt keine Zeit mehr für mich hatte.\n@c0@"
  en: "@aGertrude@bFather's been so busy looking for %O0960%Xyou%YKing %a000090%Z, he hasn't had any time at all for me, or anything else for that matter.\n@c0@"
  es: "@aFredegunda@bMi padre ha estado tan ocupado %O0960%Xbuscándoos%Ybuscando al rey %a000090%Z que no ha tenido tiempo para mí. Ni para nada más, en realidad.\n@c0@"
  fr: "@aGertrude@bPère a été si occupé à %O0960%Xte chercher%Ychercher le roi %a000090%Z qu'il n'avait presque pas de temps à me consacrer, ni à quoi que ce soit d'autre, d'ailleurs.\n@c0@"
  it: "@aGertrude@bPer troppi anni mio padre non ha avuto tempo per occuparsi di me, perchè è stato troppo impegnato a %O0960%Xcercarti%Ycercare re %a000090%Z e a governare il paese.\n@c0@"
  ja: "@a@b＊「%a001230王妃さまは\n\t昔のまま　美しくて……。\n\tああ　王妃さま……。\n@c0@"
309:
  de: "@aGertraud@bNa ja, wenigstens ist er mir nicht auf die Nerven gegangen.\n@c0@"
