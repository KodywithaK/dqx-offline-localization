  es: "@a@b*: El poder del Gran Maestro del Inframundo ya debe de haberse debilitado.\n@c0@"
  fr: "@a@b*ⓢ La puissance du Grand Maître des Enfers\na déjà dû diminuer.\n@c0@"
  it: "@a@b*: Se così fosse, il Gran Maestro degli Inferi starebbe perdendo parte del proprio potere...\n@c0@"
  ja: "@a@b＊「%a000120さまも　今夜は\n\tお休みに　なられますように。\n@c0@"
415:
  de: "@a@b*: Ha-püh... Ha-püh...\nIhre Hoheit Magda... Zzz...\n@c0@"
  en: "@a@b*: Ah-goo... Ah-goo...\nLady Mada... Zzz...\n@c0@"
  es: "@a@b*: Ah, gluu... Ah, gluu...\r\nLady Perséfone... Zzz...\n@c0@"
  fr: "@a@b*ⓢ Ron-slurp... Ron-slurp...\nDame Magdalena... Zzz...\n@c0@"
  it: "@a@b*: Slurp-rooonf... Slurp-rooonf...\nLady Mada... Zzz...\n@c0@"
  ja: "@a@b＊「まあ！　なんと\n\t天空の城が　ふたたび空に！？\n@c0@"
416:
  de: "@a@b*: Prinz Sebastian hat sich bereits für die Nacht zurückgezogen.\n@c0@"
  en: "@a@b*: Prince Albert has already retired for the night.\n@c0@"
  es: "@a@b*: El príncipe Agila ya se ha retirado a descansar.\n@c0@"
  fr: "@a@b*ⓢ Le prince Albert s'est retiré pour la nuit.\n@c0@"
  it: "@a@b*: Il principe Alberto si è già ritirato nelle sue stanze.\n@c0@"
  ja: "@a@b＊「では　竜の神さまも\n\t復活なされたのですねっ！\n@c0@"
417:
  de: "@a@b*: Ich hoffe, dass auch %O0960%XIhr gut schlaft, Eure Majestät%Y%a000120 gut schläft%Z.\n@c0@"
  en: "@a@b*: I hope you get some rest too, %O0960%XYour Majesty%Y%a000120%Z.\n@c0@"
  es: "@a@b*: Espero que %O0960%Xvos también descanséis, Majestad%Ydescanses, %a000120%Z.\n@c0@"
  fr: "@a@b*ⓢ J'espère que vous allez prendre un peu de repos également, %O0960%XVotre Majesté%Y%a000120%Z.\n@c0@"
  it: "@a@b*: %O0960%XAuguro buon riposo anche a lei, Sire%YBuonanotte, %a000120%Z.\n@c0@"
  ja: "@a@b＊「だとすれば　神の光が\n\t暗黒の魔界にも　えいきょうを\n\tあたえているはず。\n@c0@"
418:
  de: "@a@b*: Zzz... Zzz...\nGeht nicht... Bitte...\nZzz... Zzz...\n@c0@"
  en: "@a@b*: Zzz... Zzz...\nDon't go... Pleazzze...\nZzz... Zzz...\n@c0@"
  es: "@a@b*: Zzz... Zzz...\r\nNo te vayas... Por favor...\r\nZzz... Zzz...\n@c0@"
  fr: "@a@b*ⓢ Zzz... Zzz...\nN'y allez pas... S'il vous plaîzzz... \nZzz... Zzz...\n@c0@"
  it: "@a@b*: Zzz... Zzz...\nRegina Mada... Per favore...\nZzz... Zzz...\n@c0@"
  ja: "@a@b＊「今なら　魔王のチカラも\n\t少しは　弱まっていること\n\tでしょう。\n@c0@"
419:
  de: "@a@b*: Ha-püh... Ha-püh...\nWo ist sie nur...?\nKönigin Magda...\n@c0@"
  en: "@a@b*: Ah-phew... Ah-phew...\nWhere could she be...?\nQueen Mada...\n@c0@"
  es: "@a@b*: Ah, fiuu... Ah, fiuu...\r\n¿Dónde estará...?\r\nReina Perséfone...\n@c0@"
  fr: "@a@b*ⓢ Ron-pfff... Ron-pfff...\nOù peut-elle être...ⓡ\nReine Magdalena...\n@c0@"
  it: "@a@b*: Ronf... Rooonf...\nDove potrebbe essere...?\nLa regina Mada... Zzz... Zzz...\n@c0@"
  ja: "@a@b＊「ムニャ　ムニャ……。\n\tマーサさま……。\n@c0@"
420:
  de: "@a@b*: Endlich habt Ihr eine richtige Familie, jetzt wo Eure Frau gesund und munter wieder heimgekehrt ist, nicht wahr, Eure Majestät?\n@c0@"
  en: "@a@b*: You're finally a family at last, now that your wife's back home safe and sound, eh, Your Majesty?\n@c0@"
  es: "@a@b*: Por fin sois una familia, ahora que vuestra esposa está en casa sana y salva, ¿verdad, Majestad?\n@c0@"
  fr: "@a@b*ⓢ Enfinⓠ Vous formez de nouveau une famille, maintenant que votre épouse est revenue\nsaine et sauve, hein, Votre Majestéⓡ\n@c0@"
  it: "@a@b*: Maestà, ora che la regina %a001230 è tornata sana e salva, la sua famiglia è finalmente riunita.\nImmagino che sia felicissimo...\n@c0@"
  ja: "@a@b＊「オジロンさまは\n\tすでに　お休みです。\n@c0@"
421:
  de: "@a@b*: Ich werde Euch ein wahres Festmahl zubereiten, um ihre Rückkehr gebührend zu feiern!\n@c0@"
  en: "@a@b*: I'll have to cook you all a nice meal to celebrate!\n@c0@"
  es: "@a@b*: ¡Voy a tener que cocinar un suculento banquete para celebrarlo!\n@c0@"
  fr: "@a@b*ⓢ Il va falloir que je vous cuisine un bon repas pour fêter çaⓠ\n@c0@"
  it: "@a@b*: Vi preparerò un banchetto indimenticabile!\nVi farò ingrassare tutti di un paio di taglie, o forse anche tre!\n@c0@"
  ja: "@a@b＊「%a000120さまも　今夜は\n\tお休みに　なられますように。\n@c0@"
422:
  de: "@a@b*: Alle in Humburg sind überglücklich, dass Königin %a001230 wieder da ist.\n@c0@"
  en: "@a@b*: Everyone in Gotha's over the moon to see Queen %a001230 back safe and sound.\n@c0@"
  es: "@a@b*: Todo el mundo en Pankraz está radiante de alegría por el retorno de la reina %a001230.\n@c0@"
  fr: "@a@b*ⓢ À Gotha, tout le monde est aux anges de voir la reine %a001230 de retour saine et sauve.\n@c0@"
  it: "@a@b*: I sudditi di Denim hanno accolto con entusiasmo e commozione la notizia del ritorno della regina %a001230.\n@c0@"
  ja: "@a@b＊「ぐう　ぐう……。　王さま\n\tもう　どこにも　行かないで\n\tください。　ムニャムニャ……。\n@c0@"
423:
  de: "@a@b*: Auf Eure Majestät, König %a000090! Herzlichen Glückwunsch!\n@c0@"
  en: "@a@b*: Your Majesty, King %a000090!\nCongratulations, sir!\n@c0@"
  es: "@a@b*: ¡Majestad, rey %a000090!\n¡Enhorabuena, señor!\n@c0@"
  fr: "@a@b*ⓢ Votre Majesté, roi %a000090ⓠ\nToutes mes félicitationsⓠ\n@c0@"
  it: "@a@b*: Maestà, mi permetta di dirle che sono davvero felice per lei!\nCongratulazioni, re %a000090!\n@c0@"
  ja: "@a@b＊「ぐう　ぐう……。\n\tマーサさまは　いったい\n\tどこに……。\n@c0@"
424:
  de: "@a%0%a001240@bIch bin doch der legendäre Held, nicht wahr?\n@c0@"
  en: "@a%0%a001240@bI'm the legendary hero, aren't I?\n@c0@"
  es: "@a%0%a001240@bYo soy el héroe legendario, ¿no?\n@c0@"
  fr: "@a%0%a001240@bJe suis le héros légendaire, nonⓡ\n@c0@"
  it: "@a%0%a001240@bIo sono l'Eroe Leggendario, non è così?\n@c0@"
  ja: "@a@b＊「奥さまも　おもどりになって\n\tやっと　ご家族がそろいましたね。\n@c0@"
425:
  de: "@a%0%a001240@bWorauf warten wir dann noch?! Lass uns losziehen und all die Bösewichte und Monster da draußen fertigmachen!\n@c0@"
  en: "@a%0%a001240@bLet's go, then! Let's go and make mincemeat out of all the evil monsters and villains out there!\n@c0@"
  es: "@a%0%a001240@b¡Pues entonces, en marcha! ¡Vamos a machacar a todos esos monstruos y villanos!\n@c0@"
  fr: "@a%0%a001240@bEh bien dans ce cas, allons-yⓠ Allons faire de la chair à pâté des vilains monstres et de tous les méchants qui sont là-basⓠ\n@c0@"
  it: "@a%0%a001240@bAllora andiamo! Che stiamo aspettando?!\nFaremo a pezzettini piccoli piccoli tutti i mostri e gli altri cattivoni che girano per il mondo!\n@c0@"
  ja: "@a@b＊「はりきって\n\tおいしい　お食事を\n\t作ってさしあげなきゃ。\n@c0@"
426:
  de: "@a%0%a001240@bAus diesem Grund wurde ich geboren.\nDas ist mein Schicksal!\n@c0@"
  en: "@a%0%a001240@bThat's why I was born.\nThat's my destiny!\n@c0@"
  es: "@a%0%a001240@bPara eso he nacido.\n¡Es mi destino!\n@c0@"
  fr: "@a%0%a001240@bC'est pour ça que je suis né.\nC'est mon destinⓠ\n@c0@"
  it: "@a%0%a001240@bDevo farlo, no?\nÈ scritto nel mio destino!\n@c0@"
  ja: "@a@b＊「%a001230王妃さまが　もどられ\n\t国中の者は　わがことのように\n\tよろこんで　います。\n@c0@"
427:
  de: "@a%0%a001240@bAber Papa! Du kannst mich doch nicht einfach so zurücklassen!\n@c0@"
  en: "@a%0%a001240@bHey, Dad! You can't just leave me behind!\n@c0@"
  es: "@a%0%a001240@b¡Eh, papá! ¡No puedes dejarme aquí!\n@c0@"
  fr: "@a%0%a001240@bHé, papaⓠ Tu ne peux pas partir sans moiⓠ\n@c0@"
  it: "@a%0%a001240@bEhi, papà!\nNon vorrai mica lasciarmi qui, vero?!\n@c0@"
  ja: "@a@b＊「%a000090王！\n\tおめでとうございます。\n@c0@"
428:
  de: "@a%0%a001240@bSprich doch bitte mit Hilda, der Hortmutter, damit ich mit dir kommen kann.\n@c0@"
  en: "@a%0%a001240@bGo and speak to that party planner lady, Patty, so I can come along with you.\n@c0@"
  es: "@a%0%a001240@bVuelve y habla con Cone-Cone, la organizadora de grupos, para que pueda ir contigo.\n@c0@"
  fr: "@a%0%a001240@bVa parler à cette dame chef d'équipe, Tulipe, pour que je puisse t'accompagner.\n@c0@"
  it: "@a%0%a001240@bVai a parlare con la signorina che organizza il gruppo, e dille che vuoi che venga con te!\n@c0@"
  ja: "@a@b%a001240「お父さん\n\t伝説の勇者って　ボクのこと\n\tなんでしょ。\n@c0@"
429:
  de: "@a%0%a001250@b%O0960%XDeine Mutter ist doch meine Großmutter, stimmt's Papa%YPapas Mutter ist doch meine Großmutter, nicht wahr%Z?\n@c0@"
  en: "@a%0%a001250@b%O0960%XYour mum would be my grandma, wouldn't she, Dad?%YDad's mum would be my grandma, wouldn't she?%Z\n@c0@"
  es: "@a%0%a001250@b%O0960%XTu madre será entonces mi abuela, ¿no, papá?%YLa madre de papá será entonces mi abuela, ¿no?%Z\n@c0@"
  fr: "@a%0%a001250@b%O0960%XTa maman, ça serait ma grand-mère,\nn'est-ce pas, papaⓡ%YLa mère de papa, ça serait ma grand-mère,\nn'est-ce pasⓡ%Z\n@c0@"
  it: "@a%0%a001250@b%O0960%XPapà, perché non andiamo a cercare la nonna%YPerché non andiamo a cercare mia nonna%Z?\n@c0@"
  ja: "@a@b%a001240「行こうよ！\n\t行って　悪いヤツを\n\tやっつけようよ！\n@c0@"
430:
  de: "@a%0%a001250@bIch würde sie so gerne mal kennenlernen.\n@c0@"
  en: "@a%0%a001250@bI'd love to meet my grandma.\n@c0@"
  es: "@a%0%a001250@bMe encantaría conocer a mi abuela.\n@c0@"
  fr: "@a%0%a001250@bJ'adorerais rencontrer ma grand-mère.\n@c0@"
  it: "@a%0%a001250@bForza, andiamo!\nMuoio dalla voglia di incontrarla!\n@c0@"
  ja: "@a@b%a001240「ボクは　そのために\n\t生まれてきたと　思うんだ！\n@c0@"
431:
  de: "@a%0%a001250@bWenn du es für das Richtige hältst, bleibe ich natürlich hier, Papa.\n@c0@"
  en: "@a%0%a001250@bIf you think it's for the best, Dad, I'll stay\nbehind here.\n@c0@"
  es: "@a%0%a001250@bSi crees que es lo mejor me quedaré aquí, papá.\n@c0@"
  fr: "@a%0%a001250@bSi tu penses que c'est mieux comme ça, papa, je resterai ici.\n@c0@"
  it: "@a%0%a001250@bPapà, resterò volentieri al Castello, se pensi che sia la cosa migliore da fare...\n@c0@"
  ja: "@a@b%a001240「あっ　お父さん！\n\tボクを　置いてゆくなんて\n\tひどいや！\n@c0@"
432:
  de: "@a%0%a001250@bObwohl ich ja immer noch gerne mit dir kommen würde.\n@c0@"
  en: "@a%0%a001250@bBut I'd really like to go with you if you don't mind.\n@c0@"
  es: "@a%0%a001250@bPero si no te importa, me encantaría ir contigo.\n@c0@"
  fr: "@a%0%a001250@bMais j'aimerais vraiment t'accompagner, si tu es d'accord.\n@c0@"
  it: "@a%0%a001250@bPerò mi piacerebbe tanto venire con te...\nAnzi, ⓕcontigoⓖ, come dice lo zio Sancho!\n@c0@"
  ja: "@a@b%a001240「すぐに\n\tルイーダさんに　言って\n\tボクも　連れて行ってよ！\n@c0@"
433:
  de: "@aBianca@bIch sage ja gar nichts.\n@c0@"
  en: "@aBianca@bI won't say a word.\n@c0@"
  es: "@aBianca@bNo voy a decir ni mu.\n@c0@"
  fr: "@aBianca@bJe ne t'influencerai pas.\n@c0@"
  it: "@aBianca@bNon dirò una sola parola.\n@c0@"
  ja: "@a@b%a001250「お父さんの　お母さんて\n\t私の　おばあちゃんに\n\tなるのよね。\n@c0@"
434:
  de: "@aBianca@bDu musst tun, was du für richtig hältst.\n@c0@"
  en: "@aBianca@bYou should do whatever you feel you have to.\n@c0@"
  es: "@aBianca@bDebes hacer lo que creas correcto, ¿sabes?\n@c0@"
  fr: "@aBianca@bTu dois faire ce qui te semble juste.\n@c0@"
  it: "@aBianca@bDevi fare ciò che credi sia giusto.\nSta a te, e solo a te, decidere come procedere.\n@c0@"
  ja: "@a@b%a001250「私も　おばあちゃんに\n\t会ってみたいなあ……。\n@c0@"
435:
  de: "@aBianca@bDoch es gibt eine Sache, um die ich dich bitten möchte.\n@c0@"
  en: "@aBianca@bThere's just one thing I ask of you.\n@c0@"
  es: "@aBianca@bPero quiero pedirte una cosa.\n@c0@"
  fr: "@aBianca@bJe ne te demande qu'une seule chose.\n@c0@"
  it: "@aBianca@bPerò c'è un favore che voglio chiederti...\n@c0@"
  ja: "@a@b%a001250「お父さんが　言うなら\n\tわたし　お留守番　してます。\n@c0@"
436:
  de: "@aBianca@bWas auch immer passiert und wo auch immer du hingehst ⓚⓛ ich begleite dich!\n@c0@"
  en: "@aBianca@bWhatever happens and wherever you go, you'll take me with you.\n@c0@"
  es: "@aBianca@bPase lo que pase y vayas donde vayas, llévame contigo, ¿me entiendes?\n@c0@"
  fr: "@aBianca@bQuoi qu'il se passe et où que tu ailles,\r\nemmène-moi avec toi.\n@c0@"
  it: "@aBianca@bQualunque cosa tu decida di fare, ovunque tu voglia andare...\n... devi permettermi di accompagnarti.\n@c0@"
  ja: "@a@b%a001250「でも　本当は　わたしも\n\t連れてって　ほしかったな。\n@c0@"
437:
  de: "@aBianca@bIch liebe dich, %a000090!\n@c0@"
  en: "@aBianca@bI love you, %a000090.\n@c0@"
  es: "@aBianca@bTe quiero, %a000090.\n@c0@"
  fr: "@aBianca@bJe t'aime, %a000090.\n@c0@"
  it: "@aBianca@bTi amo, %a000090.\n@c0@"
  ja: "@a@bビアンカ「私は　なにも　言わないわ。\n@c0@"
438:
  de: "@aBianca@bMit dir durch die Weltgeschichte zu reisen, erinnert mich an alte Zeiten, %a000090.\n@c0@"
  en: "@aBianca@bTravellin' around with you certainly takes me back, %a000090.\n@c0@"
  es: "@aBianca@bViajar contigo me hace recordar los viejos tiempos, %a000090, ¿sabes?\n@c0@"
  fr: "@aBianca@bVoyager avec toi me rappelle des souvenirs, %a000090.\n@c0@"
  it: "@aBianca@bViaggiare con te mi riporta indietro negli anni, %a000090.\n@c0@"
  ja: "@a@bビアンカ「%a000090の　好きなように\n\tしたら　いいと思う。\n@c0@"
439:
  de: "@aBianca@bWeißt du noch, wie wir als Kinder auf Geisterjagd gegangen sind? Und als wir damals in den Kaskadenklüften waren...\n@c0@"
  en: "@aBianca@bRemember that time we went ghost-bustin' as kids? And the time we went to Cataract Caves...\n@c0@"
  es: "@aBianca@b¿Recuerdas aquella vez que fuimos a cazar fantasmas cuando éramos unos críos? Y esa otra vez en las Cuevas de las Cataratas...\n@c0@"
  fr: "@aBianca@bTu te souviens de la fois où nous sommes partis chasser les fantômes, quand nous étions enfantsⓡ Et quand nous sommes allés à la grotte du Déluge...\n@c0@"
  it: "@aBianca@bRicordi quando da bambini andammo a caccia di fantasmi?\nE quella volta che esplorammo la Caverna Aqua...?.\n@c0@"
  ja: "@a@bビアンカ「でも　ひとことだけ\n\t言わせて……。\n@c0@"
440:
  de: "@aBianca@bDie Wahrheit ist, dass ich die meiste Zeit furchtbare Angst hatte.\n@c0@"
  en: "@aBianca@bTruth is, I was terrified out of my mind most of\r\nthe time!\n@c0@"
  es: "@aBianca@b¡La verdad es que estaba muerta de miedo casi todo el tiempo!\n@c0@"
  fr: "@aBianca@bLa vérité, c'est que la plupart du temps, j'étais morte de peurⓠ\n@c0@"
  it: "@aBianca@bBeh, ti confesso che all'inizio avevo molta paura.\n@c0@"
  ja: "@a@bビアンカ「どんなことに　なっても\n\t私は　%a000090に\n\tついてゆくからね。\n@c0@"
441:
  de: "@aBianca@bAber das war alles nicht so schlimm, weil du ja an meiner Seite warst.\n@c0@"
  en: "@aBianca@bBut it was all okay because you were by my side.\n@c0@"
  es: "@aBianca@bPero me daba igual porque tú estabas a mi lado.\n@c0@"
  fr: "@aBianca@bMais comme tu étais à mes côtés, tout allait bien.\n@c0@"
  it: "@aBianca@bPoi, però, mi tranquillizzai, perché sapevo che tu mi avresti difesa da tutto e da tutti.\n@c0@"
  ja: "@a@bビアンカ「愛してるよ　%a000090。\n@c0@"
442:
  de: "@aBianca@bNimm mich wieder mit, %a000090.\n@c0@"
  en: "@aBianca@bTake me with you again, %a000090.\n@c0@"
  es: "@aBianca@bLlévame de nuevo contigo, %a000090.\n@c0@"
  fr: "@aBianca@bEmmène-moi à nouveau avec toi, %a000090.\n@c0@"
  it: "@aBianca@bPortami ancora con te, %a000090.\nCon te sarò al sicuro, ne sono certa.\nTi voglio bene, amore mio...\n@c0@"
  ja: "@a@bビアンカ「%a000090と　旅をしてると\n\tいろんなことを　思いだすわ。\n@c0@"
443:
  de: "@aNera@bIch würde nie im Leben etwas gegen deine Pläne sagen.\n@c0@"
  en: "@aNera@bI wouldn't dream of saying anything.\n@c0@"
  es: "@aNera@bPor supuesto que no voy a decir niente.\n@c0@"
  fr: "@aNera@bJe n'ai pas à intervenir.\n@c0@"
  it: "@aNera@bNon sarò certo io a dirti cosa fare, %a000090.\n@c0@"
  ja: "@a@bビアンカ「おばけ退治に　いったり\n\t滝の洞くつに　入ったり……。\n@c0@"
444:
  de: "@aNera@bDu musst tun, was du für richtig hältst, Liebster.\n@c0@"
  en: "@aNera@bYou must do what you want to do, my love.\n@c0@"
  es: "@aNera@bDebes hacer lo que desees, amore mío.\n@c0@"
  fr: "@aNera@bTu dois faire ce que tu veux, mon amour.\n@c0@"
  it: "@aNera@bLeggi nel tuo cuore, e capirai cosa vuoi davvero.\n@c0@"
  ja: "@a@bビアンカ「ホントは　ちょっぴり\n\tこわかったんだ。\n@c0@"
445:
  de: "@aNera@bIch vertraue dir und werde dir überallhin folgen.\n@c0@"
  en: "@aNera@bI trust you, and I'll go with you wherever you say we must go.\n@c0@"
  es: "@aNera@bConfío en ti y te acompañaré allá donde digas que debemos ir.\n@c0@"
  fr: "@aNera@bJe te fais confiance, et je te suivrai où que tu décides d'aller.\n@c0@"
  it: "@aNera@bLa tua scelta sarà anche la mia.\nSe vorrai andare a Nadiria, io verrò con te.\n@c0@"
  ja: "@a@bビアンカ「でも　%a000090が\n\tそばに　いてくれたから……。\n@c0@"
446:
  de: "@aNera@bUnd das gilt natürlich auch für die Kinder.\n@c0@"
  en: "@aNera@bAnd that goes for the children too.\n@c0@"
