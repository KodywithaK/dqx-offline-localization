  ja: "@a@bデボラ「でも　あんたは　私につくすって\n\tあのとき約束したわよね。\n@c0@"
476:
  de: "@a@b*: Dies ist die Heimat der Vergessenen. All jener, die keinen Platz mehr in der Welt haben.\n@c0@"
  en: "@a@b*: This is the home of the forgotten ones.\nThose who the world no longer knows.\n@c0@"
  es: "@a@b*: Este es el reino de los olvidados, aquellos a los que el mundo ya no conoce.\n@c0@"
  fr: "@a@b*ⓢ Vous êtes ici chez les oubliés.\nCeux dont le monde ne connaît plus l'existence.\n@c0@"
  it: "@a@b*: Questa è la casa di chi ha fatto perdere memoria di sé. Qui dimorano coloro che sono stati dimenticati dal mondo.\n@c0@"
  ja: "@a@bデボラ「つくす相手が　そばにいないのに\n\tどうやってつくすつもり？\n@c0@"
477:
  de: "@a@b*: Oh, Ihr seid es, der Spross von Magdalena...\n@c0@"
  en: "@a@b*: It is you, the progeny of Madalena...\n@c0@"
  es: "@a@b*: %H0860%XEres tú.%YSois %R0000%Xvosotras%Yvosotros%Z la familia de Perséfone...%Z\n@c0@"
  fr: "@a@b*ⓢ Vous êtes donc la descendance de Magdalena...\n@c0@"
  it: "@a@b*: Tu sei il figlio di Maddalena...\n@c0@"
  ja: "@a@bデボラ「石になってた分の時間も\n\t今までの分に　足して\n\tちゃんと　つくしなさいよね。\n@c0@"
478:
  de: "@a@b*: Es sind viele Monde vergangen, seit Ihr uns das letzte Mal besucht habt.\n@c0@"
  en: "@a@b*: So many moons it has been since last you\r\nvisited us.\n@c0@"
  es: "@a@b*: Han pasado muchas lunas desde %H0860%Xtu%Yvuestra%Z última visita.\n@c0@"
  fr: "@a@b*ⓢ Tant de lunes se sont écoulées depuis votre dernière visite.\n@c0@"
  it: "@a@b*: È trascorso molto tempo dalla tua ultima visita.\n@c0@"
  ja: "@a@bデボラ「わかったら　ほら　さっさと\n\t私を　連れて行くじゅんびをしなさい。\n@c0@"
479:
  de: "@a@b*: Ich bin auf der Suche nach dem legendären Schlüssel, der so gut wie jede Tür der Welt öffnen kann!\n@c0@"
  en: "@a@b*: I'm travelling around in search of a legendary key that's said to open almost any door in the world!\n@c0@"
  es: "@a@b*: ¡Viajo en busca de una llave legendaria que, según se cuenta, puede abrir casi todas las puertas del mundo!\n@c0@"
  fr: "@a@b*ⓢ Je voyage à la recherche d'une clef dont\non dit qu'elle peut ouvrir presque toutes\nles portes du mondeⓠ\n@c0@"
  it: "@a@b*: Ho sentito dire che esiste una chiave in grado di aprire tutte le porte del mondo!\n@c0@"
  ja: "@a@b＊「ここは　エルヘブン。\n@c0@"
480:
  de: "@a@b*: Der Legende nach befand er sich einst im Besitz eines Meisterdiebs, der der ⓞEhrlicheⓟ Ede genannt wurde.\n@c0@"
  en: "@a@b*: According to the legend, it was once owned by a master thief by the name of M. Bezzler.\n@c0@"
  es: "@a@b*: Según la leyenda, habría pertenecido a un maestro ladrón de nombre Curro Ballaves.\n@c0@"
  fr: "@a@b*ⓢ D'après la légende, elle était autrefois détenue par un maître voleur du nom de monsieur Chourave.\n@c0@"
  it: "@a@b*: Pare che un tempo ce l'avesse un famoso ladro di nome Arsenio Rubìo.\n@c0@"
  ja: "@a@b＊「忘れられた民族の\n\t住む村で　ございます。\n@c0@"
481:
  de: "@a@b*: Was?! Ihr besitzt ihn?! Das ist ja... unglaublich!\n@c0@"
  en: "@a@b*: What? You've already got it!? Wow!\n@c0@"
  es: "@a@b*: ¿Cómo? ¡¿Que ya la %H0860%Xtienes%Ytenéis%Z?! ¡Vaya!\n@c0@"
  fr: "@a@b*ⓢ Commentⓡ Vous la possédez déjàⓠⓑ Waouhⓠ\n@c0@"
  it: "@a@b*: Che cosa?! Adesso quella chiave %H0860%Xce l'hai tu%Yce l'avete voi%Z?!\nDiamine! E io che speravo di trovarla sotto qualche zerbino...\n@c0@"
  ja: "@a@b＊「あら　あなたがたは　たしか\n\tマーサさまの……。\n@c0@"
482:
  de: "@a@b*: Sagt Euch der Name ⓞEhrlicherⓟ Ede was?\n@c0@"
  en: "@a@b*: So you know the name M. Bezzler, do you?\n@c0@"
  es: "@a@b*: Así que el nombre de Curro Ballaves, %H0860%Xte%Yos%Z resulta familiar, ¿no?\n@c0@"
  fr: "@a@b*ⓢ Alors vous connaissez le nom de\nmonsieur Chourave, n'est-ce pasⓡ\n@c0@"
  it: "@a@b*: Il nome di Arsenio Rubìo %H0860%Xti%Yvi%Z suona familiare, vero?\n@c0@"
  ja: "@a@b＊「おひさしぶりで　ございますね。\n@c0@"
483:
  de: "@a@b*: Als ich vor Jahren mal in Bakenmünde war, habe ich von ihm gehört.\n@c0@"
  en: "@a@b*: I heard about the thief years ago now from someone in Lodestar Harbour.\n@c0@"
  es: "@a@b*: Oí hablar de ese ladrón hace años a alguien en Puerto Polaris.\n@c0@"
  fr: "@a@b*ⓢ J'ai entendu parler de ce voleur il y a de nombreuses années à Port-Lanterne.\n@c0@"
  it: "@a@b*: La prima volta che ne sentii parlare fu a Grandport, diversi anni fa.\n@c0@"
  ja: "@a@b＊「私は　どんなトビラでも\n\tあけられるという　伝説のカギを\n\tもとめて　旅をしています。\n@c0@"
484:
  de: "@a@b*: Ihr habt also auch von ihm gehört, ja? Nun, das ist gut zu wissen.\n@c0@"
  en: "@a@b*: But you've heard about him too, eh?\nWell, that's good to know.\n@c0@"
  es: "@a@b*: Pero %H0860%Xtú también has%Y%R0000%Xvosotras%Yvosotros%Z también habéis%Z oído hablar de él, ¿eh?\nMe alegra saberlo.\n@c0@"
  fr: "@a@b*ⓢ Mais vous aussi, vous avez entendu parler\nde lui, heinⓡ C'est bon à savoir.\n@c0@"
  it: "@a@b*: Ma sono certo che quel mariuolo si è fatto conoscere in un bel po' di posti!\n@c0@"
  ja: "@a@b＊「言い伝えでは　その昔\n\tゴロステという　大とうぞくが\n\t持っていたらしいのです。\n@c0@"
485:
  de: "@a@b*: Kommt mit mir, ich führe Euch, %H0860%X%A0110%XReisender%Z%B0110%XReisende%Z%YReisende%Z.\n@c0@"
  en: "@a@b*: Let me guide you, %H0860%Xtraveller%Ytravellers%Z.\n@c0@"
  es: "@a@b*: %H0860%XDéjame que te guíe, %A0110%Xviajero%Z%B0110%Xviajera%Z%YDejadme que os guíe, %R0000%Xviajeras%Yviajeros%Z%Z.\n@c0@"
  fr: "@a@b*ⓢ Laissez-moi vous guider, %H0860%X%A0110%Xvoyageur%Z%B0110%Xvoyageuse%Z%Y%R0000%Xvoyageuses%Yvoyageurs%Z%Z.\n@c0@"
  it: "@a@b*: %H0860%XLascia che %A0110%Xti guidi, viaggiatore%Z%B0110%Xti guidi, viaggiatrice%Z%YLasciate che %R0000%Xvi guidi, viaggiatrici%Yvi guidi, viaggiatori%Z%Z.\n@c0@"
  ja: "@a@b＊「え？　そのカギを　すでに\n\t持っていると？　わーお！\n@c0@"
486:
  de: "@a@b*: Ihr seid hier, um Wahrheit und Vernunft zu finden, habe ich recht?\n@c0@"
  en: "@a@b*: You have come here perhaps in the hope of discovering truth and reason.\n@c0@"
  es: "@a@b*: Quizás hay%H0860%Xas%Yáis%Z venido aquí con la esperanza de descubrir verdad y razón.\n@c0@"
  fr: "@a@b*ⓢ Peut-être êtes-vous %H0860%X%A0110%Xvenu%Z%B0110%Xvenue%Z%Y%R0000%Xvenues%Yvenus%Z%Z ici dans l'espoir de découvrir la vérité et le pourquoi du comment.\n@c0@"
  it: "@a@b*: Forse è la sete di conoscenza e di verità che %H0860%X%A0110%Xti ha spinto%Z%B0110%Xti ha spinta%Z%Y%R0000%Xvi ha spinte%Yvi ha spinti%Z%Z fin qui.\n@c0@"
  ja: "@a@b＊「ほう　あんた　ゴロステの\n\t名を　知っているかね？\n@c0@"
487:
  de: "@a@b*: Dann solltet Ihr mit den vier Weisen von Steile Höh sprechen. Sie werden Euch erleuchten.\n@c0@"
  en: "@a@b*: Then it is the four Elders of Lofty Peak you seek. They will enlighten you.\n@c0@"
  es: "@a@b*: Entonces busc%H0860%Xas%Yáis%Z a los cuatro Ancianos de Cumbre Excelsa.\nEllos %H0860%Xte%Yos%Z iluminarán.\n@c0@"
  fr: "@a@b*ⓢ Dans ce cas, ce sont les quatre Anciens de Haute-Cime que vous cherchez.\nIls vous éclaireront.\n@c0@"
  it: "@a@b*: In tal caso, %H0860%Xdevi%Ydovete%Z parlare con i Quattro Anziani.\nEssi conoscono le risposte che %H0860%Xcerchi%Ycercate%Z.\n@c0@"
  ja: "@a@b＊「わしも　昔　その　とうぞくの\n\tことを　ポートセルミで\n\t聞いたことが　あったのう……。\n@c0@"
488:
  de: "@a@b*: Magdalena war eine von uns. Doch die mächtige Magie, die ihr innewohnte, war ein Fluch. Darum haben die Monster sie uns auch genommen.\n@c0@"
  en: "@a@b*: Madalena belonged to us. She was a Loftinian.\r\nBut the strong power of magic within her was a curse. It's because of this the monsters took her.\n@c0@"
  es: "@a@b*: Perséfone nos pertenecía. Era de Cumbre Excelsa.\r\nPero su gran poder mágico resultaba una maldición. Por ello los monstruos la raptaron.\n@c0@"
  fr: "@a@b*ⓢ Magdalena était l'une des nôtres. C'était une Alticimienne.\n㈡\n*ⓢ Mais la puissance de la magie qu'elle possédait était une malédiction. C'est à cause de cela que les monstres l'ont emmenée.\n@c0@"
  it: "@a@b*: Maddalena era originaria di Picco Maximo. Aveva incredibili poteri magici, e fu proprio a causa di queste sue capacità che venne rapita dai mostri.\n@c0@"
  ja: "@a@b＊「ほう。　あんたも　聞いたか。\n\tそれは　よかったのう。\n@c0@"
489:
  de: "@a@b*: Oh, Magdalena, wo bist du nur?\n@c0@"
  en: "@a@b*: Oh, Madalena! Where are you now?\n@c0@"
  es: "@a@b*: ¡Oh, Perséfone! ¿Dónde estás ahora?\n@c0@"
  fr: "@a@b*ⓢ Oh, Magdalenaⓠ Où es-tu, maintenantⓡ\n@c0@"
  it: "@a@b*: Oh, Maddalena!\nDove sei? Ti rivedremo mai?!\n@c0@"
  ja: "@a@b＊「旅のお人よ。\n@c0@"
490:
  de: "@a@b*: Über uns befindet sich die Ratskammer der Weisen.\n@c0@"
  en: "@a@b*: Above us is the council chamber of the Elders.\n@c0@"
  es: "@a@b*: Sobre nosotros se halla la cámara del Consejo de Ancianos.\n@c0@"
  fr: "@a@b*ⓢ Au-dessus de nous se trouve la salle du conseil des Anciens.\n@c0@"
  it: "@a@b*: Sopra di noi c'è la sala del Consiglio degli Anziani.\n@c0@"
  ja: "@a@b＊「もし　そなたが\n\t世界の道理を　知りたくて\n\tこの村に　来たのなら……\n@c0@"
491:
  de: "@a@b*: Das Volk von Steile Höh wurde von der Göttin auserwählt.\n@c0@"
  en: "@a@b*: We of Lofty Peak are the chosen ones.\nChosen by the Goddess.\n@c0@"
  es: "@a@b*: Los de Cumbre Excelsa somos los elegidos.\r\nElegidos por la Diosa.\n@c0@"
  fr: "@a@b*ⓢ Nous autres, habitants de Haute-Cime, sommes les élus.\nNous avons été choisis par la Déesse.\n@c0@"
  it: "@a@b*: Noi abitanti di Picco Maximo siamo i prescelti della dea.\n@c0@"
  ja: "@a@b＊「われらエルヘブンの\n\t４人の長老に\n\t会うと　いいだろう。\n@c0@"
492:
  de: "@a@b*: Es heißt, dass wir einst eine große Macht besaßen. Die Macht, die Grenzen zur Unterwelt von Nadiria zu überschreiten.\n@c0@"
  en: "@a@b*: It's said that once we possessed a great power.\nThe power to transcend to and from the underworld, Nadiria.\n@c0@"
  es: "@a@b*: Se dice que una vez poseímos gran poder.\r\nEl poder de viajar a y desde el inframundo, Nadiria.\n@c0@"
  fr: "@a@b*ⓢ On raconte que nous possédions autrefois un grand pouvoir.\n㈡\n*ⓢ Celui de pouvoir entrer et sortir à notre gré de Nadiria, le monde souterrain des Enfers.\n@c0@"
  it: "@a@b*: Si dice che un tempo fossimo dotati del potere di entrare e uscire da Nadiria, il Regno degli Inferi.\n@c0@"
  ja: "@a@b＊「かつて　この村にいた\n\tマーサさまは　その能力ゆえに\n\t魔物に　さらわれたのです。\n@c0@"
493:
  de: "@a@b*: Doch die Weisen sind die einzigen von uns, die noch einen Rest dieser Macht besitzen.\n@c0@"
  en: "@a@b*: But the Elders are the only ones of us left with any vestige of that power now.\n@c0@"
  es: "@a@b*: Mas los Ancianos son los únicos que conservan ya vestigios de este poder.\n@c0@"
  fr: "@a@b*ⓢ Mais les Anciens sont les seuls d'entre nous à posséder encore quelques vestiges de ce pouvoir.\n@c0@"
  it: "@a@b*: Oggi, però, nessuno di noi ha più tale capacità.\nNemmeno i Quattro Anziani...\n@c0@"
  ja: "@a@b＊「ああ　マーサさまは\n\tいったい　どこに……。\n@c0@"
494:
  de: "@a@b*: Nur bei einer von uns, einer Frau namens Magdalena, war diese Kraft noch sehr ausgeprägt. Doch sie ist leider schon lange fort.\n@c0@"
  en: "@a@b*: There was one other among us, by the name of Madalena, in whom the power was still strong.\r\nBut alas, she is long gone.\n@c0@"
  es: "@a@b*: Hubo entre nosotros una mujer llamada Perséfone en la que el poder era muy grande.\r\nPero ¡ay!, tiempo ha que marchó.\n@c0@"
  fr: "@a@b*ⓢ Il n'y avait qu'une seule femme, prénommée Magdalena, chez qui ce pouvoir était encore fort. Hélas, voilà bien longtemps qu'elle nous a quittés.\n@c0@"
  it: "@a@b*: L'ultima tra noi che ancora aveva forte in sé quest'abilità era Maddalena, che purtroppo ci ha abbandonati molto tempo fa...\n@c0@"
  ja: "@a@b＊「この上は　長老たちの\n\t部屋で　ございます。\n@c0@"
495:
  de: "@a@b*: Ich war von Anfang an dagegen. Ich wollte nicht, dass eine der unsrigen einen Außenstehenden heiratet.\n@c0@"
  en: "@a@b*: I was against it from the start. I didn't agree with one of our own being married to an outsider.\n@c0@"
  es: "@a@b*: Yo me opuse desde el principio. No acepté que una de nosotras se casara con un forastero.\n@c0@"
  fr: "@a@b*ⓢ J'y étais opposée depuis le début.\nJe n'étais pas d'accord pour que l'une des nôtres épouse un étranger.\n@c0@"
  it: "@a@b*: Io ero stata contraria fin dal primo momento!\nUna donna di Picco Maximo non avrebbe dovuto unirsi in matrimonio con uno straniero!\n@c0@"
  ja: "@a@b＊「エルヘブンの民は\n\t神に　選ばれし　民族。\n@c0@"
496:
  de: "@a@b*: Wie viele Monde ist das wohl jetzt her...\n@c0@"
  en: "@a@b*: How many moons ago must it be now, I wonder...\n@c0@"
  es: "@a@b*: Me pregunto cuántas lunas habrán pasado ya...\n@c0@"
  fr: "@a@b*ⓢ Je me demande combien de lunes ont passé depuis...\n@c0@"
  it: "@a@b*: Quanto tempo sarà passato?\nOh, non lo ricordo con precisione...\n@c0@"
  ja: "@a@b＊「かつては　魔界に通じる\n\t大きな能力を　持っていたと\n\tいわれています。\n@c0@"
497:
  de: "@a@b*: Es war schon einmal ein Reisender hier, der genau wie Ihr zufällig in unser Dorf kam. Er hatte sich verlaufen.\n@c0@"
  en: "@a@b*: There was another traveller who, like you, stumbled across our village. Lost, he was.\n@c0@"
  es: "@a@b*: Hubo otro viajero que, como %H0860%Xtú%Y%R0000%Xvosotras%Yvosotros%Z%Z, apareció en nuestra comunidad. Andaba perdido.\n@c0@"
  fr: "@a@b*ⓢ Un voyageur était, comme vous, arrivé jusqu'à notre village. Il était perdu.\n@c0@"
  it: "@a@b*: Tempo fa ricevemmo la visita di un forestiero.\nDisse che aveva perso la strada, e lo accogliemmo presso di noi...\n@c0@"
  ja: "@a@b＊「しかし　その能力も　今では\n\t長老たちが　わずかに\n\t有するのみ！\n@c0@"
498:
  de: "@a@b*: Doch dann verliebte er sich in eine junge Frau, und die beiden verließen gemeinsam das Dorf.\n@c0@"
  en: "@a@b*: He ended up falling in love with a young woman here, and the two of them left together.\n@c0@"
  es: "@a@b*: Acabó por enamorarse de una joven de aquí y se marcharon juntos.\n@c0@"
  fr: "@a@b*ⓢ Il a fini par tomber amoureux d'une jeune femme d'ici, et ils sont partis tous les deux.\n@c0@"
  it: "@a@b*: Quell'uomo si innamorò di una fanciulla del villaggio e, poco dopo, i due partirono insieme.\n@c0@"
  ja: "@a@b＊「ただ　かつて　この村にいた\n\tマーサさまは　偉大な能力の\n\t持ち主だったとか……。\n@c0@"
499:
  de: "@a@b*: Sie hieß Magdalena. Und wenn meine Erinnerung mich nicht trügt, hörte der junge Mann auf den Namen Ludwig.\n@c0@"
  en: "@a@b*: The young woman was called Madalena.\r\nAnd if my memory serves me correctly, the\r\nyoung man was called Pankraz.\n@c0@"
  es: "@a@b*: La joven se llamaba Perséfone.\r\nY si la memoria no me falla, él se llamaba Teudis.\n@c0@"
  fr: "@a@b*ⓢ La jeune femme s'appelait Magdalena.\nEt si je me souviens bien, le jeune homme se prénommait Petros.\n@c0@"
  it: "@a@b*: La fanciulla si chiamava Maddalena, e l'uomo...\nUhm, se la memoria non m'inganna, il nome dell'uomo era Russel...\n@c0@"
  ja: "@a@b＊「エルヘブンの娘が　外に\n\tお嫁に行くなんて\n\tわしは　反対したのに……。\n@c0@"
500:
  de: "@a@b*: Ihr möchtet wissen, wie man sich Zutritt zur Unterwelt Nadiria verschafft? Nein, oh, nein. Ihr dürft dort nicht hin.\n@c0@"
  en: "@a@b*: You wish to know how to enter Nadiria, the underworld? No, no. You must not do this.\n@c0@"
  es: "@a@b*: ¿%H0860%XQuieres%YQueréis%Z saber cómo se entra a Nadiria, el inframundo? No, no. No %H0860%Xdebes%Ydebéis%Z hacerlo.\n@c0@"
  fr: "@a@b*ⓢ Vous voulez savoir comment pénétrer à Nadiria, le monde souterrainⓡ Non, non. Vous ne devez pas faire cela.\n@c0@"
  it: "@a@b*: %H0860%XHai intenzione di recarti%YAvete intenzione di recarvi%Z a Nadiria?\nMi dispiace %H0860%Xdirtelo%Ydirvelo%Z, ma temo che sia impossibile andarci.\n@c0@"
  ja: "@a@b＊「もう　何年前に\n\tなるかのう……。\n@c0@"
501:
  de: "@a@b*: Das Tor nach Nadiria ist bereits seit Jahrhunderten versperrt.\n@c0@"
  en: "@a@b*: The gateway to Nadiria has been sealed shut for centuries now.\n@c0@"
  es: "@a@b*: La entrada a Nadiria lleva muchos siglos cerrada.\n@c0@"
  fr: "@a@b*ⓢ Les portes de Nadiria ont été scellées\nil y a des siècles.\n@c0@"
  it: "@a@b*: Sono secoli che il varco per Nadiria è chiuso.\n@c0@"
  ja: "@a@b＊「この村に　１人の若者が\n\t迷いこんで来てのう。\n@c0@"
502:
  de: "@a@b*: Einst war ich ein Handwerker in Humburg, wisst Ihr. Meine Talente waren wohl bekannt.\n@c0@"
  en: "@a@b*: I once worked as a craftsman in Gotha, you know. My skills were well-known.\n@c0@"
  es: "@a@b*: Antaño trabajé como artesano en Pankraz.\r\nMi habilidad era bien conocida.\n@c0@"
  fr: "@a@b*ⓢ J'ai autrefois travaillé comme artisan à Gotha, vous savez. Mon travail était réputé.\n@c0@"
  it: "@a@b*: Un tempo lavoravo a Denim come artigiano.\nEro davvero in gamba, %H0860%Xsai%Ysapete%Z?\nEro conosciuto in tutto il Regno.\n@c0@"
  ja: "@a@b＊「村の娘と　恋に落ちて\n\t娘は　その若者に連れられて\n\t村を　出て行ったんじゃよ。\n@c0@"
503:
  de: "@a@b*: Ich verließ die Stadt, um König Ludwig zu folgen.\nDoch dann nahm das Böse seinen Lauf...\n@c0@"
  en: "@a@b*: But I left Gotha to follow King Pankraz.\r\nAlas, the hand of evil had already...\n@c0@"
  es: "@a@b*: Pero me marché en busca del rey Teudis.\r\n¡Ay!, la mano del mal ya había...\n@c0@"
  fr: "@a@b*ⓢ Mais j'ai quitté la ville pour suivre le roi Petros.\nHélas, la main du mal avait déjà...\n@c0@"
  it: "@a@b*: Un giorno decisi di lasciare Denim per seguire re Russel.\nPurtroppo, il destino ha voluto che...\n@c0@"
  ja: "@a@b＊「娘の名は　マーサ。\n\t若者は　たしか　パパスとか\n\tいう名前じゃったな。\n@c0@"
504:
  de: "@a@b*: Nein! Ich kann es immer noch nicht glauben! Ich will einfach nicht glauben, dass König Ludwig nicht mehr ist!\n@c0@"
  en: "@a@b*: No! I still cannot believe it!\r\nI refuse to believe King Pankraz is gone!\n@c0@"
  es: "@a@b*: ¡No! ¡No puedo creerlo!\r\n¡El rey Teudis no puede haber muerto!\n@c0@"
