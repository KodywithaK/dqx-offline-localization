  es: "@a@b*: Todo el mundo en Pankraz está radiante de alegría por el retorno de la reina %a001230.\n@c0@"
  fr: "@a@b*ⓢ À Gotha, tout le monde est aux anges de voir la reine %a001230 de retour saine et sauve.\n@c0@"
  it: "@a@b*: I sudditi di Denim hanno accolto con entusiasmo e commozione la notizia del ritorno della regina %a001230.\n@c0@"
  ja: "@a@b%a001250「そんな人を\n\t旅に　つれ出しちゃうなんて……。\n@c0@"
250:
  de: "@a@b*: Auf Eure Majestät, König %a000090! Herzlichen Glückwunsch!\n@c0@"
  en: "@a@b*: Your Majesty, King %a000090!\nCongratulations, sir!\n@c0@"
  es: "@a@b*: ¡Majestad, rey %a000090!\n¡Enhorabuena, señor!\n@c0@"
  fr: "@a@b*ⓢ Votre Majesté, roi %a000090ⓠ\nToutes mes félicitationsⓠ\n@c0@"
  it: "@a@b*: Maestà, mi permetta di dirle che sono davvero felice per lei!\nCongratulazioni, re %a000090!\n@c0@"
  ja: "@a@b%a001250「お父さんも　けっこう\n\tすみに　おけないわね。\n@c0@"
251:
  de: "@a@bPrinz Sebastian wartet! Er hat bestimmt etwas Wichtiges zu sagen.\n@c0@"
  en: "@a@bPrince Albert is waiting! Better find out what he wants to say.\n@c0@"
  es: "@a@b¡El príncipe Agila está esperando! Será mejor averiguar qué se le ofrece.\n@c0@"
  fr: "@a@bLe prince Albert vous attendⓠ Vous devriez\nécouter ce qu'il a à vous dire.\n@c0@"
  it: "@a@bIl principe Alberto sta aspettando!\nSarà meglio andare a sentire cosa ha da dire.\n@c0@"
  ja: "@a@b＊「%a001240さまも　%a001250さまも\n\tどんなにか　お母さまに\n\t会いたかったことか……。\n@c0@"
252:
  de: "@aPrinz Sebastian@bAh! Da bist du ja endlich, %a000090, altes Haus!\n@c0@"
  en: "@aPrince Albert@bAh-ha! There you are, %a000090, old thing!\n@c0@"
  es: "@aPríncipe Agila@b¡Ajá! ¡Ahí estás, %a000090, chatín!\n@c0@"
  fr: "@aPrince Albert@bAh-ahⓠ Te voilà, mon bon vieux %a000090ⓠ\n@c0@"
  it: "@aPrincipe Alberto@bAh-ah!\nEccoti qui, caro il mio %a000090!\n@c0@"
  ja: "@a@b＊「あたしまで\n\t涙が　でてきちまって……。\n@c0@"
253:
  de: "@aPrinz Sebastian@bIch weiß, es ist grausam von mir, dich von deiner Familie wegzuholen, aber...\n@c0@"
  en: "@aPrince Albert@bI know it's rotten of me calling you away while you're having a family moment and all that, but...\n@c0@"
  es: "@aPríncipe Agila@bYa sé que ha estado muy feo llamarte mientras vivías un momento familiar y esas cosas, pero...\n@c0@"
  fr: "@aPrince Albert@bJe sais que ça n'est pas très correct de ma part de te faire appeler en plein milieu de retrouvailles familiales, mais...\n@c0@"
  it: "@aPrincipe Alberto@bSo di essere dannatamente inopportuno a presentarmi qui proprio adesso che hai finalmente riunito la tua famiglia, ma...\n@c0@"
  ja: "@a@b＊「%a001230王妃さまが　もどられ\n\t国中の者は　わがことのように\n\tよろこんで　います。\n@c0@"
254:
  de: "@aPrinz Sebastian@bNun ja, es gibt da etwas, über das ich unbedingt mit dir reden muss.\n@c0@"
  en: "@aPrince Albert@bWell, there's something I really must ask you.\n@c0@"
  es: "@aPríncipe Agila@bEn fin, que tengo que pedirte algo.\n@c0@"
  fr: "@aPrince Albert@b... il fallait absolument que je te demande quelque chose.\n@c0@"
  it: "@aPrincipe Alberto@bEcco, ho assoluto bisogno di chiederti una cosa, e con la massima urgenza.\n@c0@"
  ja: "@a@b＊「%a000090王！\n\tおめでとうございます。\n@c0@"
255:
  de: "@aPrinz Sebastian@bWie sag' ich's nur...? Am besten einfach grad heraus!\n@c0@"
  en: "@aPrince Albert@bSo I think I'll just come right out and say it, eh?\r\nStraight to the point, if you will.\n@c0@"
  es: "@aPríncipe Agila@bAsí que te lo diré sin más y ya está, ¿de acuerdo?\r\nDirecto al grano, como si dijésemos.\n@c0@"
  fr: "@aPrince Albert@bBon, si je me lançais, heinⓡ\nAlors j'irai droit au but, si tu veux bien.\n@c0@"
  it: "@aPrincipe Alberto@bCosì ho deciso di non perdermi in inutili salamelecchi e di venire dritto al punto.\n@c0@"
  ja: "@a@b今は　オジロンたちが待っている！\n話をして行ったほうが　よいだろう……。\n@c0@"
256:
  de: "@aPrinz Sebastian@b%0%a000090, hast du vor, nach Nadiria zu gehen?\n@c0@"
  en: "@aPrince Albert@b%0%a000090, are you planning on going to Nadiria?\n@c0@"
  es: "@aPríncipe Agila@b%0%a000090, ¿estás planeando ir a Nadiria?\n@c0@"
  fr: "@aPrince Albert@b%0%a000090, envisages-tu d'aller à Nadiriaⓡ\n@c0@"
  it: "@aPrincipe Alberto@b%0%a000090, è vero che hai intenzione di recarti a Nadiria?\n@c0@"
  ja: "@a@bオジロン「おお　%a000090王！\n@c0@"
257:
  de: "@aPrinz Sebastian@bUnmöglich! Nein! Das kannst du net machen!\n@c0@"
  en: "@aPrince Albert@bBut! No! I mean, you can't!\n@c0@"
  es: "@aPríncipe Agila@b¡Pero...! ¡No! ¡Que no puedes ir, digo!\n@c0@"
  fr: "@aPrince Albert@bMaisⓠ Enfin, nonⓠ C'est impossibleⓠ\n@c0@"
  it: "@aPrincipe Alberto@bMa sei matto?!\nLo dico con il rispetto che si deve portare a un Re, ovviamente, ma tu sei matto!\n@c0@"
  ja: "@a@bオジロン「親子水いらずの所を\n\tお呼びたてして　本当に\n\t申しわけないのじゃが……\n@c0@"
258:
  de: "@aPrinz Sebastian@bIch hab g'hört, dass Königin Magda durch den Ring des Lebens zu dir g'sprochen hat.\n@c0@"
  en: "@aPrince Albert@bI've heard the stories about Queen Mada speaking to you through the Circle of Life, you know.\n@c0@"
  es: "@aPríncipe Agila@bSí, ya he oído eso que cuentan de que la reina Perséfone te habló a través del Anillo de Vida.\n@c0@"
  fr: "@aPrince Albert@bJ'ai entendu dire que la reine Magdalena t'avait parlé par l'intermédiaire de l'Anneau de la Vie,\r\ntu sais.\n@c0@"
  it: "@aPrincipe Alberto@bMi hanno raccontato cosa ti ha detto la regina Mada quando ti ha parlato attraverso l'Anello della Vita.\n@c0@"
  ja: "@a@bオジロン「%a000090王に\n\tどうしても　聞いておきたい\n\tことが　あってな。\n@c0@"
259:
  de: "@aPrinz Sebastian@bDu solltest auf deine Mutter hören, weißt du. Lass dir die ganze G'schicht noch einmal durch den Kopf gehen.\n@c0@"
  en: "@aPrince Albert@bYou should listen to your mother, and reconsider the whole idea.\n@c0@"
  es: "@aPríncipe Agila@bDeberías escuchar a tu madre y recapacitar.\n@c0@"
  fr: "@aPrince Albert@bTu devrais vraiment écouter ta mère et revenir sur cette idée.\n@c0@"
  it: "@aPrincipe Alberto@bEbbene, dovresti ascoltare ciò che ti ha detto tua madre.\nNon andare a Nadiria, %a000090.\n@c0@"
  ja: "@a@bオジロン「ずばり　申そう！\n@c0@"
260:
  de: "@aPrinz Sebastian@bDer Göttin sei Dank! Dann ist Humburg in Sicherheit. Gepriesen sei die Göttin!\n@c0@"
  en: "@aPrince Albert@bWell, thank Gladys the Goddess for that!\r\nGotha will be safe, then. Tally ho and glory be!\n@c0@"
  es: "@aPríncipe Agila@b¡Bueno, que la Diosa sea loada!\r\nPankraz estará a salvo. ¡Gloria y victoria!\n@c0@"
  fr: "@aPrince Albert@bOuf, la Déesse soit louéeⓠ Gotha sera en sécurité, dans ce cas. Gloire à la Déesse et tant mieux pour nousⓠ\n@c0@"
  it: "@aPrincipe Alberto@bOh, sia lodata la dea! Mi fa piacere constatare che sul trono del Regno di Denim siede un sovrano che dimostra di avere molto sale in zucca.\n@c0@"
  ja: "@a@bオジロン「%a000090王は\n\t暗黒の魔界に　ゆかれる\n\tおつもりか？\n@c0@"
261:
  de: "@a@b*: Eure Majestät! Humburg war so leer ohne Euch. Ich hoffe doch sehr, dass Ihr von nun an hier bleibt...\n@c0@"
  en: "@a@b*: Your Majesty! Gotha is nothing without you.\r\nYou'll be staying here from now on, I hope.\n@c0@"
  es: "@a@b*: ¡Majestad! Pankraz no es nada sin vos.\r\nEspero que de ahora en adelante os quedéis aquí.\n@c0@"
  fr: "@a@b*ⓢ Votre Majestéⓠ Gotha n'est rien sans vous.\nJ'espère qu'à partir d'aujourd'hui, vous resterez ici.\n@c0@"
  it: "@a@b*: Maestà, il Regno di Denim ha bisogno di lei!\nSpero che non ci abbandonerà mai più...\n@c0@"
  ja: "@a@bオジロン「それは　なりませぬぞ！\n@c0@"
262:
  de: "@aSancho@bChico! N-Nein, iss meine, Señor Majestät...\n@c0@"
  en: "@aSancho@bFriend! No, I mean, señor Majesty...\n@c0@"
  es: "@aSancho@b¡Chamaquito! Quiero decir, Majestad...\n@c0@"
  fr: "@aSancho@bChicoⓠ Euh, Señor Majesté...\n@c0@"
  it: "@aSancho@b¡Chico!\nEhm, volevo dire Maestà...\n@c0@"
  ja: "@a@bオジロン「命のリングからの\n\tマーサさまの言葉　このわしも\n\t人づてに　聞き申した。\n@c0@"
263:
  de: "@aSancho@bSeñor Sebastian ist ein weiser Mann. Vielleisst stimmt es ja, was er sagt, no?\n@c0@"
  en: "@aSancho@bSeñor Albert, he ees a wise man.\nWhat he esays to you, maybe ees right.\n@c0@"
  es: "@aSancho@bEl señor Agila es un hombre retesabio, nomás.\r\nA lo mejor tiene razón en eso que le dijo.\n@c0@"
  fr: "@aSancho@bLe s-señor Albert est oun homme sage.\r\nCe qu'il te d-dit est peut-être juste.\n@c0@"
  it: "@aSancho@bEl señor principe Alberto es un hombre muy saggios.\nPienso que dovresti prestar ascolto a las suas palabras.\n@c0@"
  ja: "@a@bオジロン「どうか　マーサさまを\n\t信じて　お考えを\n\tあらためますように。\n@c0@"
264:
  de: "@aSancho@bAber iss kann auch nisst deinen Padre vergessen. Als er starb, bat er diss, deine Madre zu finden.\n@c0@"
  en: "@aSancho@bBut for me, I no forget your father's dying weesh. He ask you to find your mother.\n@c0@"
  es: "@aSancho@bPero yo no me olvido del último deseo de tu apá. Te pidió que encontrases a tu madre.\n@c0@"
  fr: "@aSancho@bMais en ce qui me c-concerne, je n'oublie p-pas le souhait que ton p-père a émis en m-mourant.\r\nIl t'a demandé de r-retrouver ta mère.\n@c0@"
  it: "@aSancho@b¿Però te recordi l'ultimo desiderio de tuo padre, chico?\nTe aveva chiesto de trovare tua madre...\n@c0@"
  ja: "@a@bオジロン「それを聞いて　安心した。\n\tこれで　この国も　あんたい！\n\tばん　ばんざいじゃ！\n@c0@"
265:
  de: "@aSancho@bWenn du also wieder auf Reisen gehst, Chico... Dann wird dein alter Onkel Sancho diss begleiten, wo immer du auch hingehst.\n@c0@"
  en: "@aSancho@bSo eef you are going esomewhere now, your Uncle Sancho, he go weeth you.\r\nWherever eet ees.\n@c0@"
  es: "@aSancho@bAsí que, si piensas ir a algún lado, órale, tito Sancho te acompaña.\r\nSea donde sea.\n@c0@"
  fr: "@aSancho@bAlors si t-tu décides de p-partir maintenant,\r\ntonton Sancho te suivra. Où que t-tu ailles.\n@c0@"
  it: "@aSancho@bSi deciderai de andare da qualche partes, lo zio Sancho verrà contigo.\n¡Ovunques andrai, yo sarò al tuo fiancos!\n@c0@"
  ja: "@a@b＊「王さま！　もう　どこにも\n\t行かないで　ください！\n@c0@"
266:
  de: "@a@b*: Wie ich hörte, ist das Schloss Zenithia wieder in den Himmel aufgestiegen.\n@c0@"
  en: "@a@b*: I've heard talk that the castle known as Zenithia has been resurrected.\n@c0@"
  es: "@a@b*: He oído rumores de que ese castillo al que llaman Zenithia ha resucitado.\n@c0@"
  fr: "@a@b*ⓢ J'ai entendu dire que le château connu sous le nom de Zénithia était revenu à la vie.\n@c0@"
  it: "@a@b*: Ho saputo che il Castello di Zenithia è tornato in cielo.\n@c0@"
  ja: "@a@bサンチョ「坊っちゃん！\n\tいえ　%a000090王！\n@c0@"
267:
  de: "@a@b*: Dann wird bald wieder Frieden einkehren! Da bin ich mir ganz sicher!\n@c0@"
  en: "@a@b*: Peace isn't far away now!\nI'm quite certain of it!\n@c0@"
