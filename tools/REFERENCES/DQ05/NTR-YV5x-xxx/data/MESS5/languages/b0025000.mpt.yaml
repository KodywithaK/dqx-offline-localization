  it: "@aDr. Agon@b%O0960%XBentornato, %a000090. Mi stavo giusto chiedendo dove fossi finito. Per tutte le fiamme! Vedo che hai%Y%H0860%XOh, eccoti di ritorno. Mi stavo giusto chiedendo che fine avessi fatto. Per tutte le fiamme! Vedo che hai%YOh, eccovi di ritorno. Mi stavo giusto chiedendo che fine aveste fatto. Vedo che avete%Z%Z trovato il Cuore del Dragone...\n@c0@"
