  fr: "@aBianca@bQuoi qu'il se passe et où que tu ailles,\r\nemmène-moi avec toi.\n@c0@"
  it: "@aBianca@bQualunque cosa tu decida di fare, ovunque tu voglia andare...\n... devi permettermi di accompagnarti.\n@c0@"
  ja: "@a@b%a001240「すぐに\n\tルイーダさんに　言って\n\tボクも　連れて行ってよ！\n@c0@"
285:
  de: "@aBianca@bIch liebe dich, %a000090!\n@c0@"
  en: "@aBianca@bI love you, %a000090.\n@c0@"
  es: "@aBianca@bTe quiero, %a000090.\n@c0@"
  fr: "@aBianca@bJe t'aime, %a000090.\n@c0@"
  it: "@aBianca@bTi amo, %a000090.\n@c0@"
  ja: "@a@bビアンカ「私は　なにも　言わないわ。\n@c0@"
286:
  de: "@aBianca@bMit dir durch die Weltgeschichte zu reisen, erinnert mich an alte Zeiten, %a000090.\n@c0@"
  en: "@aBianca@bTravellin' around with you certainly takes me back, %a000090.\n@c0@"
  es: "@aBianca@bViajar contigo me hace recordar los viejos tiempos, %a000090, ¿sabes?\n@c0@"
  fr: "@aBianca@bVoyager avec toi me rappelle des souvenirs, %a000090.\n@c0@"
  it: "@aBianca@bViaggiare con te mi riporta indietro negli anni, %a000090.\n@c0@"
  ja: "@a@bビアンカ「%a000090の　好きなように\n\tしたら　いいと思う。\n@c0@"
287:
  de: "@aBianca@bWeißt du noch, wie wir als Kinder auf Geisterjagd gegangen sind? Und als wir damals in den Kaskadenklüften waren...\n@c0@"
  en: "@aBianca@bRemember that time we went ghost-bustin' as kids? And the time we went to Cataract Caves...\n@c0@"
  es: "@aBianca@b¿Recuerdas aquella vez que fuimos a cazar fantasmas cuando éramos unos críos? Y esa otra vez en las Cuevas de las Cataratas...\n@c0@"
  fr: "@aBianca@bTu te souviens de la fois où nous sommes partis chasser les fantômes, quand nous étions enfantsⓡ Et quand nous sommes allés à la grotte du Déluge...\n@c0@"
  it: "@aBianca@bRicordi quando da bambini andammo a caccia di fantasmi?\nE quella volta che esplorammo la Caverna Aqua...?\n@c0@"
  ja: "@a@bビアンカ「でも　ひとことだけ\n\t言わせて……。\n@c0@"
288:
  de: "@aBianca@bDie Wahrheit ist, dass ich die meiste Zeit furchtbare Angst hatte.\n@c0@"
  en: "@aBianca@bTruth is, I was terrified out of my mind most of\r\nthe time!\n@c0@"
  es: "@aBianca@b¡La verdad es que estaba muerta de miedo casi todo el tiempo!\n@c0@"
  fr: "@aBianca@bLa vérité, c'est que la plupart du temps, j'étais morte de peurⓠ\n@c0@"
  it: "@aBianca@bBeh, ti confesso che all'inizio avevo molta paura.\n@c0@"
  ja: "@a@bビアンカ「どんなことに　なっても\n\t私は　%a000090に\n\tついてゆくからね。\n@c0@"
289:
  de: "@aBianca@bAber das war alles nicht so schlimm, weil du ja an meiner Seite warst.\n@c0@"
  en: "@aBianca@bBut it was all okay because you were by my side.\n@c0@"
  es: "@aBianca@bPero me daba igual porque tú estabas a mi lado.\n@c0@"
  fr: "@aBianca@bMais comme tu étais à mes côtés, tout allait bien.\n@c0@"
  it: "@aBianca@bPoi, però, mi tranquillizzai, perché sapevo che tu mi avresti difesa da tutto e da tutti.\n@c0@"
  ja: "@a@bビアンカ「愛してるよ　%a000090。\n@c0@"
290:
  de: "@aBianca@bNimm mich wieder mit, %a000090.\n@c0@"
  en: "@aBianca@bTake me with you again, %a000090.\n@c0@"
  es: "@aBianca@bLlévame de nuevo contigo, %a000090.\n@c0@"
  fr: "@aBianca@bEmmène-moi à nouveau avec toi, %a000090.\n@c0@"
  it: "@aBianca@bPortami ancora con te, %a000090.\nCon te sarò al sicuro, ne sono certa.\nTi voglio bene, amore mio...\n@c0@"
  ja: "@a@bビアンカ「%a000090と　旅をしてると\n\tいろんなことを　思い出すわ。\n@c0@"
291:
  de: "@aNera@bIch würde nie im Leben etwas gegen deine Pläne sagen.\n@c0@"
  en: "@aNera@bI wouldn't dream of saying anything.\n@c0@"
  es: "@aNera@bPor supuesto que no voy a decir niente.\n@c0@"
  fr: "@aNera@bJe n'ai pas à intervenir.\n@c0@"
  it: "@aNera@bNon sarò certo io a dirti cosa fare, %a000090.\n@c0@"
  ja: "@a@bビアンカ「おばけ退治に　行ったり\n\t滝の洞くつに　入ったり……。\n@c0@"
292:
  de: "@aNera@bDu musst tun, was du für richtig hältst, Liebster.\n@c0@"
  en: "@aNera@bYou must do what you want to do, my love.\n@c0@"
  es: "@aNera@bDebes hacer lo que desees, amore mío.\n@c0@"
  fr: "@aNera@bTu dois faire ce que tu veux, mon amour.\n@c0@"
  it: "@aNera@bLeggi nel tuo cuore e capirai cosa vuoi davvero.\n@c0@"
  ja: "@a@bビアンカ「ホントは　ちょっぴり\n\tこわかったんだ。\n@c0@"
293:
  de: "@aNera@bIch vertraue dir und werde dir überallhin folgen.\n@c0@"
  en: "@aNera@bI trust you, and I'll go with you wherever you say we must go.\n@c0@"
  es: "@aNera@bConfío en ti y te acompañaré allá donde digas que debemos ir.\n@c0@"
  fr: "@aNera@bJe te fais confiance, et je te suivrai où que tu décides d'aller.\n@c0@"
  it: "@aNera@bLa tua scelta sarà anche la mia.\nSe vorrai andare a Nadiria, io verrò con te.\n@c0@"
  ja: "@a@bビアンカ「でも　%a000090が\n\tそばに　いてくれたから……。\n@c0@"
294:
  de: "@aNera@bUnd das gilt natürlich auch für die Kinder.\n@c0@"
  en: "@aNera@bAnd that goes for the children too.\n@c0@"
  es: "@aNera@bY los bambini también.\n@c0@"
  fr: "@aNera@bEt il en va de même pour les enfants.\n@c0@"
  it: "@aNera@bE anche i nostri figli ci accompagneranno.\n㈡\nSo bene che non sarà come fare una scampagnata, ma siamo stati separati per troppo tempo.\nOra voglio che la nostra famiglia resti sempre unita.\n@c0@"
  ja: "@a@bビアンカ「%a000090。\n\tまた　私を　つれて行ってね。\n@c0@"
295:
  de: "@aNera@bIch liebe dich so sehr, %a000090.\n@c0@"
  en: "@aNera@bI love you so much, %a000090.\n@c0@"
  es: "@aNera@bTe quiero tanto, caro %a000090.\n@c0@"
  fr: "@aNera@bJe t'aime tellement, %a000090.\n@c0@"
  it: "@aNera@b%0%a000090, ti amo tantissimo.\n@c0@"
  ja: "@a@bフローラ「私は　なにも　言わないわ。\n@c0@"
296:
  de: "@aNera@bIch kann immer noch nicht fassen, dass ich all die Jahre eine Steinstatue war.\n@c0@"
  en: "@aNera@bI still can't believe I was a stone statue for all\r\nthat time.\n@c0@"
  es: "@aNera@bAún no puedo creer que haya sido una estatua de pietra todo este tiempo.\n@c0@"
  fr: "@aNera@bJe n'arrive toujours pas à croire que j'ai été une statue de pierre pendant tout ce temps.\n@c0@"
  it: "@aNera@bAncora non riesco a credere di essere rimasta pietrificata per tanti anni!\n@c0@"
  ja: "@a@bフローラ「あなたの　好きなように\n\tなさったら　いいと思います。\n@c0@"
297:
  de: "@aNera@bUnd weißt du, was seltsam ist?\n@c0@"
  en: "@aNera@bAnd you know what's strange?\n@c0@"
  es: "@aNera@b¿Sabes lo más raro de tutti?\n@c0@"
  fr: "@aNera@bEt tu sais ce qui est bizarreⓡ\n@c0@"
  it: "@aNera@bSai una cosa?\n@c0@"
  ja: "@a@bフローラ「私は　あなたを信じて\n\tずっと　ついて行くわ。\n@c0@"
298:
  de: "@aNera@bSeit du mich gerettet hast, habe ich so ein komisches Gefühl. Es ist, als ob ich eine geheime Macht besäße, von der ich bisher nichts geahnt habe.\n@c0@"
  en: "@aNera@bEver since you saved me and turned me back to normal, I've had this feeling. Like I have some hidden power that I didn't notice before.\n@c0@"
  es: "@aNera@bDesde que me salvaste y me devolviste a la normalidad, tengo una cierta sensazione...\n㈡\nEs como si tuviese algún poder oculto que no había notado antes.\n@c0@"
  fr: "@aNera@bDepuis que tu m'as sauvée et que j'ai repris ma forme normale, j'ai une drôle d'impression.\n㈡\nComme si je possédais un pouvoir caché que je n'avais jamais remarqué auparavant.\n@c0@"
  it: "@aNera@bDa quando mi hai salvata e sono tornata una persona in carne e ossa, mi sono accorta di avere dei poteri nascosti che non sapevo di possedere.\n@c0@"
  ja: "@a@bフローラ「もちろん\n\t子供たちもよ。\n@c0@"
299:
  de: "@aNera@bEs wäre doch wunderbar, wenn ich dir damit helfen könnte. Wenn ich irgendetwas mit dieser Macht bewirken könnte...\n@c0@"
  en: "@aNera@bIt would make me so happy if I could help\r\nyou, darling. If I could do something useful\r\nwith this power.\n@c0@"
  es: "@aNera@bMe haría muy feliz poder ayudarte, caro mío. Quizá pueda hacer algo útil con este poder.\n@c0@"
  fr: "@aNera@bCela me rendrait tellement heureuse de pouvoir t'aider, mon chéri. De pouvoir faire quelque chose d'utile grâce à ce pouvoir.\n@c0@"
  it: "@aNera@bSono certa che queste mie capacità ti sarebbero molto utili, marito mio!\nPotrei aiutarti nelle situazioni più difficili, sai?\n@c0@"
  ja: "@a@bフローラ「愛してるわ\n\tあなた……。\n@c0@"
300:
  de: "@aNera@bImmerhin habe ich dir ja nichts als Ärger bereitet, seit wir zusammen sind, nicht wahr?\n@c0@"
  en: "@aNera@bI mean, I've been nothing but trouble for you so far, haven't I?\n@c0@"
  es: "@aNera@bHasta ahora, lo único que he hecho ha sido causar problemas.\n@c0@"
  fr: "@aNera@bC'est vrai, jusqu'à présent, je ne t'ai causé\nque des ennuis, nonⓡ\n@c0@"
  it: "@aNera@bSarebbe anche ora che cominciassi a ripagarti di tutto ciò che hai sempre fatto per me, no?\nFinora ti sono stata solo d'impiccio...\n@c0@"
  ja: "@a@bフローラ「長い間　石にされて\n\t眠っていたなんて　今でも\n\t信じられませんわ。\n@c0@"
301:
  de: "@a@b*: König %a000090! Ich hab die Neuigkeiten schon gehört. Gebts auf Euch acht, Eure Majestät!\n@c0@"
  en: "@a@b*: King %a000090! I've heard the news.\nTake care, Your Majesty!\n@c0@"
  es: "@a@b*: ¡Rey %a000090! Ya me he enterado.\n¡Tened cuidado, Majestad!\n@c0@"
  fr: "@a@b*ⓢ Roi %a000090ⓠ J'ai entendu la nouvelle.\nSoyez prudent, Votre Majestéⓠ\n@c0@"
  it: "@a@b*: Re %a000090! Ho saputo tutto...\nLa prego, Maestà, faccia attenzione!\n@c0@"
  ja: "@a@bフローラ「でも　ふしぎなんです。\n@c0@"
302:
  de: "@a@b*: Diese seltsame dunkle Wolke breitet sich immer weiter über dem Himmel aus.\n@c0@"
  en: "@a@b*: That strange, dark cloud is spreading even further over the sky.\n@c0@"
  es: "@a@b*: Esa extraña nube oscura se extiende aún más por el cielo.\n@c0@"
  fr: "@a@b*ⓢ Cet étrange nuage noir ne cesse de s'étendre dans le ciel.\n@c0@"
  it: "@a@b*: Quella strana nuvola oscura diventa sempre più grande... \nSembra quasi che voglia ricoprire tutto il cielo!\n@c0@"
  ja: "@a@bフローラ「あなたに　助けられてから\n\t私の　からだに　新しいチカラが\n\tみなぎっている気がするの。\n@c0@"
303:
  de: "@a@b*: Der Großmeister der Unterwelt soll sie heraufb'schworen haben... Ich weiß net, ob das stimmt, aber g'fallen tut mir das Ganze net.\n@c0@"
  en: "@a@b*: People say it's the coming of the Grandmaster of the Underworld... I, I don't know if there's any truth in it, but I know I don't like the sound of it.\n@c0@"
  es: "@a@b*: La gente dice que anuncia la llegada del Gran Maestro del Inframundo. No sé si será verdad, pero desde luego tiene muy mala pinta.\n@c0@"
  fr: "@a@b*ⓢ Les gens racontent qu'il annonce l'arrivée du Grand Maître des Enfers... Je ne sais pas s'ils ont raison, mais une chose est sûreⓢ je n'aime pas ça.\n@c0@"
  it: "@a@b*: In giro si dice che preannunci la venuta del fantomatico Gran Maestro degli Inferi.\n㈡\n*: Forse è solo una storiella inventata di sana pianta, ma a sentirla vengono i brividi!\n@c0@"
  ja: "@a@bフローラ「このチカラが\n\tあなたの　助けになれば\n\t本当に　うれしいわ。\n@c0@"
304:
  de: "@a@b*: Oh, Königin %a001230...\nSo wunderschön, wie ich sie in Erinnerung hatte...\n@c0@"
  en: "@a@b*: Oh, Queen %a001230...\nEvery bit as beautiful as I remember...\n@c0@"
  es: "@a@b*: ¡Oh!, reina %a001230...\nSois tan bella como recordaba...\n@c0@"
  fr: "@a@b*ⓢ Oh, reine %a001230...\nAussi belle que dans mon souvenir...\n@c0@"
  it: "@a@b*: Oh, la regina %a001230...\nÈ ancora più bella di quanto non ricordassi...\n@c0@"
  ja: "@a@bフローラ「今までは　ずっと\n\tあなたに　迷惑を　かけてばかり\n\tだったものね……。\n@c0@"
305:
  de: "@a@b*: Oh! Äh... Nein!\nIch... Was sage ich da nur?\n@c0@"
  en: "@a@b*: Oh! I, er... No!\nI... What am I saying?\n@c0@"
  es: "@a@b*: ¡Oh! Yo, eh... ¡No!\r\nYo... ¿Pero qué estoy diciendo?\n@c0@"
  fr: "@a@b*ⓢ Ohⓠ Euh, je... nonⓠ\nEuh... mais qu'est-ce que je raconteⓡ\n@c0@"
  it: "@a@b*: Oh! Ecco, ehm... No!\nIo... Io volevo solo dire che...\nEhm, bella giornata, vero?\n@c0@"
  ja: "@a@b＊「%a000090王！\n\tお話は　うかがっています。\n\tどうか　お気をつけて！\n@c0@"
306:
  de: "@a@b*: Ohh! Mein Kopf bringt mich noch um. Das war wohl ein Glas zu viel letzte Nacht.\n@c0@"
  en: "@a@b*: Urgh! My head's killing me.\nThat was one glass too many last night.\n@c0@"
  es: "@a@b*: ¡Argh! La cabeza me mata.\r\nAnoche bebí demasiado.\n@c0@"
