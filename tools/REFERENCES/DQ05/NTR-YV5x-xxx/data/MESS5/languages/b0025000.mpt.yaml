  ja: "@a@b＊「あたしまで\n\t涙が　でてきちまって……。\n@c0@"
276:
  de: "@a%0%a001240@bIch bin doch der legendäre Held, nicht wahr?\n@c0@"
  en: "@a%0%a001240@bI'm the legendary hero, aren't I?\n@c0@"
  es: "@a%0%a001240@bYo soy el héroe legendario, ¿no?\n@c0@"
  fr: "@a%0%a001240@bJe suis le héros légendaire, nonⓡ\n@c0@"
  it: "@a%0%a001240@bIo sono l'Eroe Leggendario, non è così?\n@c0@"
  ja: "@a@b%a001250「お父さんの　お母さんて\n\t私の　おばあちゃんに\n\tなるのよね。\n@c0@"
277:
  de: "@a%0%a001240@bWorauf warten wir dann noch?! Lass uns losziehen und all die Bösewichte und Monster da draußen fertigmachen!\n@c0@"
  en: "@a%0%a001240@bLet's go, then! Let's go and make mincemeat out of all the evil monsters and villains out there!\n@c0@"
  es: "@a%0%a001240@b¡Pues entonces, en marcha! ¡Vamos a machacar a todos esos monstruos y villanos!\n@c0@"
  fr: "@a%0%a001240@bEh bien dans ce cas, allons-yⓠ Allons faire de la chair à pâté des vilains monstres et de tous les méchants qui sont là-basⓠ\n@c0@"
  it: "@a%0%a001240@bAllora andiamo! Che stiamo aspettando?!\nFaremo a pezzettini piccoli piccoli tutti i cattivi che vogliono il male del mondo!\n@c0@"
  ja: "@a@b%a001250「私も　おばあちゃんに\n\t会ってみたいなあ……。\n@c0@"
278:
  de: "@a%0%a001240@bAus diesem Grund wurde ich geboren.\nDas ist mein Schicksal!\n@c0@"
  en: "@a%0%a001240@bThat's why I was born.\nThat's my destiny!\n@c0@"
  es: "@a%0%a001240@bPara eso he nacido.\n¡Es mi destino!\n@c0@"
  fr: "@a%0%a001240@bC'est pour ça que je suis né.\nC'est mon destinⓠ\n@c0@"
  it: "@a%0%a001240@bDevo farlo, no?\nÈ scritto nel mio destino!\n@c0@"
  ja: "@a@b%a001250「お父さんが　言うなら\n\tわたし　お留守番　してます。\n@c0@"
279:
  de: "@a%0%a001240@bAber Papa! Du kannst mich doch nicht einfach so zurücklassen!\n@c0@"
  en: "@a%0%a001240@bHey, Dad! You can't just leave me behind!\n@c0@"
  es: "@a%0%a001240@b¡Eh, papá! ¡No puedes dejarme aquí!\n@c0@"
  fr: "@a%0%a001240@bHé, papaⓠ Tu ne peux pas partir sans moiⓠ\n@c0@"
  it: "@a%0%a001240@bEhi, papà!\nNon vorrai mica lasciarmi qui, vero?!\n@c0@"
  ja: "@a@b%a001250「でも　本当は　わたしも\n\t連れてって　ほしかったな。\n@c0@"
280:
  de: "@a%0%a001240@bSprich doch bitte mit Hilda, der Hortmutter, damit ich mit dir kommen kann.\n@c0@"
  en: "@a%0%a001240@bGo and speak to that party planner lady, Patty, so I can come along with you.\n@c0@"
  es: "@a%0%a001240@bVuelve y habla con Cone-Cone, la organizadora de grupos, para que pueda ir contigo.\n@c0@"
  fr: "@a%0%a001240@bVa parler à cette dame chef d'équipe, Tulipe, pour que je puisse t'accompagner.\n@c0@"
  it: "@a%0%a001240@bVai a parlare con la signorina che organizza il gruppo, e dille che vuoi che venga con te!\n@c0@"
  ja: "@a@b%a001240「お父さん\n\t伝説の勇者って　ボクのこと\n\tなんでしょ。\n@c0@"
281:
  de: "@aBianca@bIch sage ja gar nichts.\n@c0@"
  en: "@aBianca@bI won't say a word.\n@c0@"
  es: "@aBianca@bNo voy a decir ni mu.\n@c0@"
  fr: "@aBianca@bJe ne t'influencerai pas.\n@c0@"
  it: "@aBianca@bNon dirò una sola parola.\n@c0@"
  ja: "@a@b%a001240「行こうよ！\n\t行って　悪いヤツを\n\tやっつけようよ！\n@c0@"
282:
  de: "@aBianca@bDu musst tun, was du für richtig hältst.\n@c0@"
  en: "@aBianca@bYou should do whatever you feel you have to.\n@c0@"
  es: "@aBianca@bDebes hacer lo que creas correcto, ¿sabes?\n@c0@"
  fr: "@aBianca@bTu dois faire ce qui te semble juste.\n@c0@"
  it: "@aBianca@bDevi fare ciò che credi sia giusto.\nSta a te, e solo a te, decidere come procedere.\n@c0@"
  ja: "@a@b%a001240「ボクは　そのために\n\t生まれてきたと　思うんだ！\n@c0@"
283:
  de: "@aBianca@bDoch es gibt eine Sache, um die ich dich bitten möchte.\n@c0@"
  en: "@aBianca@bThere's just one thing I ask of you.\n@c0@"
  es: "@aBianca@bPero quiero pedirte una cosa.\n@c0@"
  fr: "@aBianca@bJe ne te demande qu'une seule chose.\n@c0@"
  it: "@aBianca@bPerò c'è un favore che voglio chiederti...\n@c0@"
  ja: "@a@b%a001240「あっ　お父さん！\n\tボクを　置いてゆくなんて\n\tひどいや！\n@c0@"
284:
  de: "@aBianca@bWas auch immer passiert und wo auch immer du hingehst ⓚⓛ ich begleite dich!\n@c0@"
  en: "@aBianca@bWhatever happens and wherever you go, you'll take me with you.\n@c0@"
