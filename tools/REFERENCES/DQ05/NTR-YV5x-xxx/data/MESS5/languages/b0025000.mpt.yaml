  it: "@a@b*: Purtroppo, quel ritratto non venne mai realizzato... %O0960%XMaestà, sarebbe bello se lei esaudisse il desiderio di suo padre%YSarebbe bello se re %a000090 esaudisse il desiderio di suo padre%Z.\n@c0@"
  ja: "@a@b＊「でも　分かってます。\n\t父は　戻らないつもりなんですよね。\n\tあの通りの　ガンコ者ですから……。\n@c0@"
