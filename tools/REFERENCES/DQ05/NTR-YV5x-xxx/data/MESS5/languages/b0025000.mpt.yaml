  es: "@a@b*: ¿Qué? ¿Que %H0860%X%O0960%Xhabéis%Yhas%Z%Yhabéis%Z conocido a un orfebre legendario que cortó y pulimentó la aguamarina de Arroyofrío que %H0860%X%O0960%Xteníais%Ytenías%Z%Yteníais%Z?\n@c0@"
  fr: "@a@b*ⓢ Commentⓡ Vous dites que vous avez rencontré un bijoutier célèbre qui a taillé et poli la gemme bleue de Ruycelieu que vous possédiezⓡ\n@c0@"
  it: "@a@b*: Cosa?! %O0960%XSua Maestà ha incontrato un abilissimo gioielliere che ha raffinato e tagliato la pietra nobile di Valcava grezza che lei%YRe %a000090 ha incontrato un abilissimo gioielliere che ha raffinato e tagliato la pietra nobile di Valcava grezza che il nostro sovrano%Z aveva con sé?!\n@c0@"
  ja: "@a@b＊「%a000090王が　いないあいだに\n\tこの国も　ずいぶん\n\t人が　へってしまいました。\n@c0@"
