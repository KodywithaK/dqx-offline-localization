0:
  de: "@a@bHier gibt's ein Minispiel, das mansch mit dem Touchpen spielen kann. Wie wär's mit einer Partie?\n@c0@"
  en: "@a@bThere's a minigame that can be played with the stylus. Give it a goo?\n@c0@"
  es: "@a@bHay un minijuego que se puede jugar con el lápiz táctil.\n¿Quieres probarglop?\n@c0@"
  fr: "@a@bIl existe un mini-jeu auquel on peut jouer avec le stylet. L'essayerⓡ\n@c0@"
  it: "@a@bC'è un minigioco a cui puoi giocare usando lo stilo. Vuoi provarlo?\n@c0@"
  ja: "@a@bタッチペンで　あそべるゲーム\nスライムタッチ　がある。\nやりますか？\n@c0@"
1:
  de: "@a@b%0%a000120 schleimt noch keine Bestzahl zu haben. Das ist sehr betrüblich. %A0110%XSeine%Z%B0110%XIhre%Z U-Unterlippe fängt an zu b-b-beben...\n@c0@"
  en: "@a@b%0%a000120 doesn't appear to have a high score yet. It's, it's really very upsetting. %A0110%XHis%Z%B0110%XHer%Z b-bottom lip st-starts to w-w-w-wobble...\n@c0@"
  es: "@a@bParece que %a000120 aún no ha conseguido un récord. ¡Qué fatalidad! Se le ha puesto cara de limo avinagrado.\n@c0@"
  fr: "@a@b%0%a000120 n'apparaît pas encore parmi les meilleurs scores. C'est... C'est vraiment ennuyeux.\nSa l-lèvre inférieure c-commence à t-t-trembloter...\n@c0@"
  it: "@a@b%0%a000120 non ha ancora un punteggio record, e la cosa è alquanto disdicevole. %0%a000120 freme per il disappunto...\n@c0@"
  ja: "@a@bランキングは　まだ　ないようだ。\n%a000120は　ちょっぴり　かなしくなった……。\n@c0@"
2:
  de: "@a@b%0%a000120 liest die Anleitung auf dem Brett:\n@c0@"
  en: "@a@b%0%a000120 reads the explanation on the board:\n@c0@"
  es: "@a@b%0%a000120 lee las instrucciones en el cartel:\n@c0@"
  fr: "@a@b%0%a000120 lit l'explication sur le tableauⓢ\n@c0@"
  it: "@a@b%0%a000120 legge la spiegazione sul tabellone:\n@c0@"
  ja: "@a@b%a000120は　台に書かれている\nせつめいを　読んだ。\n@c0@"
3:
  de: "@a@bⓞSchlag den Schleim und zeig's diesen wabbligen Wichten, die ihre spitzen Schädel aus den acht Öffnungen herausstrecken.\n@c0@"
  en: "@a@bⓗIt's time to Bruise the Ooze, and sock it to the slimes that poke their pointy heads out of the eight apertures!\n@c0@"
  es: "@a@bⓕ¡Llegó la hora de que los limos hagan Glup-Glup! Aplasta a los limos que asoman sus limosas cabecitas por los ocho agujerglopsⓖ.\n@c0@"
  fr: "@a@bⓥCes gluants à gogo sont vraiment collants.\nCollez-les à leur place en leur en collant une quand ils collent leur tête dans l'une des 8 ouverturesⓠ\n@c0@"
  it: "@a@bⓕDivertiti con Schiaccia-Slime! Cerca di colpire gli Slime che mettono le loro testoline blobbose fuori dalle otto aperture.ⓖ\n@c0@"
  ja: "@a@b“８か所の　穴から　つぎつぎと\n　出てくる　スライムたちを\n　タッチペンで　やっつけよう！\n@c0@"
4:
  de: "@a@bDrei verschiedene Arten von schlabberigen Schleimen werden dich aus ihren Löchern listig angrinsen.\n@c0@"
  en: "@a@bⓗThree types of sloppy slimes will be taking cheeky peeks at you from their hidey-hole hoozes.\n@c0@"
  es: "@a@bⓕTres tipos de limosos limos van a asomar la gaita desde sus escondriglopsⓖ.\n@c0@"
  fr: "@a@bTrois types de gluants poisseux vont vous narguer effrontément depuis leur petite cachette.\n@c0@"
  it: "@a@bⓕSono tre i tipi di Slime nei quali ti imbatterai in questo gioco...ⓖ\n@c0@"
  ja: "@a@b“スライムは　ぜんぶで\n　３つの　しゅるいが　登場するぞ。\n@c0@"
5:
  de: "@a@bDa wären die blöden blauen Schleime, die richtig grottenlangweiligen roten Schleime und die schicken superschnellen silbernen Schleime!\n@c0@"
  en: "@a@bⓗThere are boring old blue slimes, run-of-the-mill red slimes and super-slick, lickgooty-split silver slimes!\n@c0@"
  es: "@a@bⓕEstán los típicos limos azules, los llamativos limos rojos, y la lima en limos: ¡los viscosos y limosísimos limos plateados!ⓖ.\n@c0@"
  fr: "@a@bIl y a les banals gluants bleus, les gluants rouges quelconques et les super gluants, gluantissimes gluants argentésⓠ\n@c0@"
  it: "@a@bⓕI cliassici Slime blu, quelli rossi e gli incredibili Slime d'argento.ⓖ\n@c0@"
  ja: "@a@b“青色のスライムと　赤色のスライム\n　そして　超スピーディーな\n　灰色のスライム！\n@c0@"
6:
  de: "@a@bIn jeder Spielstufe musst du dich strecken und in immer anderer Reihenfolge auf die drei verschiedenen Arten der glibberigen Gesellen hauen!\n@c0@"
  en: "@a@bⓗAt each level of the game you'll have to stretch yourself and whack the three types of wobblies in a different order.\n@c0@"
  es: "@a@bⓕEn cada nivel del juego tendrás que ponerte a limificar atizando a los tres tipos de limos en diferentes órdenesⓖ.\n@c0@"
  fr: "@a@bÀ chaque niveau du jeu, vous allez devoir\r\ntendre le bras pour en coller une à ces trois\r\ntype de gluglusses dans un ordre différent.\n@c0@"
  it: "@a@bⓕIn ciascun livello dovrai cercare di colpire i diversi Slime seguendo un ordine diverso.ⓖ\n@c0@"
  ja: "@a@b“この３つの　しゅるいの　スライムたちを\n　ステージごとに決められた順番で\n　タッチするんだ！\n@c0@"
7:
  de: "@a@bBeobachte die vier Felder über den Löchern und knuffe die klebrigen Kleinen der Reihe nach, wenn deren Konterfei dort aufkreuzt.\n@c0@"
  en: "@a@bⓗWatch the four panels above the holes and bop the blobs in turn as their pictures plop up.\n@c0@"
  es: "@a@bⓕPresta atención a los cuatro paneles sobre los agujeros y limifica a los limos en orden seglúp vayan apareciendo sus imágenesⓖ.\n@c0@"
  fr: "@a@bRegardez les quatre panneaux situés au-dessus des trous et frappez ces pots de colle à tour de rôle, lorsque leur image s'affiche.\n@c0@"
  it: "@a@bⓕControlla i pannelli sulle aperture e colpisci gli Slime quando compaiono le loro immagini.ⓖ\n@c0@"
  ja: "@a@b“ステージの上にある　４枚の\n　パネルの絵を見て　左から\n　タッチする順番を　かくにんしよう。\n@c0@"
8:
  de: "@a@bSchaffst du's nicht, die alerten Gallertklumpen in der richtigen Reihenfolge ranzunehmen, rollt die Felsenbombe an... und dann knallt es kräftig! \n@c0@"
  en: "@a@bⓗFail to jab the jelly jinxes in the right order, and the rockbomb will roll your way, so brace yourself for...ka-BOOM!\n@c0@"
  es: "@a@bⓕSi no logras hacer bien la escurridiza combinación, llegará una rocobomba y entonces... ¡BUM!ⓖ.\n@c0@"
  fr: "@a@bSi vous ne frappez pas ces faces de gelée dans le bon ordre, un rochexplosif roulera jusqu'à vous et... BOUMⓠ\n@c0@"
  it: "@a@bⓕSe non colpirai le creaturine blobbose nell'ordine corretto, l'Esplo-sasso rotolerà verso di te con intenzioni... esplosive!ⓖ\n@c0@"
  ja: "@a@b“スライムを　順番どおりに\n　やっつけないと　ばくだんいわが\n　近づいてきて……　ドカーン！\n@c0@"
9:
  de: "@a@bWenn die Zeit um ist, hast du verloren und das Spiel ist aus! Tja, so spielt das Schlicksal!\n@c0@"
  en: "@a@bⓗOnce your time's up, you looze. Game over!\n@c0@"
  es: "@a@bⓕCuando se agote el tiempo, ¡glup!, habrás perdido. Fin de la partidaⓖ.\n@c0@"
  fr: "@a@bUne fois écoulé le temps imparti, c'est perdu.\r\nPartie terminée.\n@c0@"
  it: "@a@bⓕLa partita termina quando scade il tempo a tua disposizione.ⓖ\n@c0@"
  ja: "@a@b“時間切れで　ゲームオーバーに\n　なってしまうぞ。\n@c0@"
10:
  de: "@a@bHaust du kein einziges Mal daneben, darfst du 'ne blubbergute Bonusstufe spielen. Also versuche, neue Rekorde aufzustellen, und schlag den Schleim!ⓟ\n@c0@"
  en: "@a@bⓗIf you muddle through without missing a single slime, you get a goo at a bonus level too. So, try to top the high scores, and...bruise that ooze!ⓘ\n@c0@"
  es: "@a@bⓕSi consigues no dejar limo con cabeza, llegarás a un nivel de bonificaciónⓖ.\n㈡\nⓕAsí que intenta batir un récord y que los limos hagan... ¡Glup-Glup!ⓖ.\n@c0@"
  fr: "@a@bMais si vous ne ratez aucun gluant, vous accéderez à un niveau bonus gelénial.\n㈡\nAlors marquez un maximum de points avec ces gluants à gogoⓠⓦ\n@c0@"
  it: "@a@bⓕSe riuscirai a non mancare nemmeno uno Slime, potrai provare il livello bonus. Prova a migliorare il punteggio record, e... schiaccia quegli Slime!ⓖ\n@c0@"
  ja: "@a@b“ちなみに　いちども　ミスしなければ\n　ボーナスステージに　チャレンジできる。\n　ハイスコアめざして　がんばろう！\n@c0@"
11:
  de: "@a@b%0%a000120 hat %a001490 Punkte geschafft. Schleimzigartig! Damit kommt %A0110%Xer%Z%B0110%Xsie%Z in die Bestenliste!\n@c0@"
  en: "@a@b%0%a000120 achieved a score of %a001490. Gloopendous! That puts %A0110%Xhim%Z%B0110%Xher%Z in the high score table!\n@c0@"
  es: "@a@b%0%a000120 ha logrado la limosa puntuación de %a001490. ¡Tremendglop! Eso le hace aparecer entre los récords.\n@c0@"
  fr: "@a@b%0%a000120 a obtenu un score de %a001490. Gigluantesqueⓠ %A0110%XIl%Z%B0110%XElle%Z intègre donc le tableau des meilleurs scoresⓠ\n@c0@"
  it: "@a@b%0%a000120 ha ottenuto %a001490 punti! Ottimo! %0%a000120 è %A0120%Xentrato%Z%B0120%Xentrata%Z%C0120%X%Z nella classifica dei punteggi record!\n@c0@"
  ja: "@a@b%a000120は\n%a001490点　かくとくした。\nなんと　ランキング入り　したようだ。\n@c0@"
12:
  de: "@a@bUnd %A0110%Xer%Z%B0110%Xsie%Z kriegt auch noch 'nen Bonus!\n@c0@"
  en: "@a@bAnd %A0110%Xhe%Z%B0110%Xshe%Z picks up a bonus to boot!\n@c0@"
  es: "@a@b¡Y consigue una bonificación que limificar!\n@c0@"
  fr: "@a@bEt %A0110%Xil%Z%B0110%Xelle%Z ramasse un super bonusⓠ\n@c0@"
