  en: "@a@b%0%a000120 achieved a score of %a001490. Oh, blubber! That doesn't put %A0110%Xhim%Z%B0110%Xher%Z in the high score table.\n@c0@"
  es: "@a@b%0%a000120 ha logrado una puntuación de %a001490. ¡Maldiglop! No entra en la lista de récords.\n@c0@"
  fr: "@a@b%0%a000120 a obtenu un score de %a001490. Flûteⓠ\n%A0110%XIl%Z%B0110%XElle%Z n'intègre donc pas le tableau des meilleurs scores.\n@c0@"
  it: "@a@b%0%a000120 ha ottenuto %a001490 punti. Che peccato... %0%a000120 non è %A0120%Xriuscito%Z%B0120%Xriuscita%Z%C0120%X%Z a entrare nella classifica dei punteggi record.\n@c0@"
  ja: "@a@b%a000120は\n%a001490点　かくとくした。\nランキング入りは　しなかったようだ。\n@c0@"
