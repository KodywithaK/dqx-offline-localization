0:
  de: "@aBianca@bWir haben auf unserem Umzug nach Utensiel einmal hier übernachtet.\n@c0@"
  en: "@aBianca@bWe stayed here one night when we were\r\nmovin' to Stockenbarrel.\n@c0@"
  es: "@aBianca@bCuando nos mudamos a Clavis pasamos aquí una noche.\n@c0@"
  fr: "@aBianca@bNous avons dormi ici une nuit lorsque nous avons déménagé à Saint Éloi.\n@c0@"
  it: "@aBianca@bUna volta pernottammo qui mentre eravamo in viaggio per raggiungere Aprianuam. \n@c0@"
  ja: "@a@bビアンカ「山奥の村へ\n\t引っこしてくる　とちゅうで\n\tこの宿に　泊まったの。\n@c0@"
1:
  de: "@aBianca@bEs ist sehr bescheiden, aber wir wurden so herzlich aufgenommen! Genau, was Papa brauchte, nachdem er seine Herberge aufgeben musste.\n@c0@"
  en: "@aBianca@bIt's a bit simple, but they gave us such a warm welcome. It was just what Dad needed to cheer\r\nhim up after givin' up the inn.\n@c0@"
  es: "@aBianca@bEs humilde, pero nos acogieron fenomenal. Era lo que papá necesitaba después de renunciar a la posada, ¿sabes?\n@c0@"
  fr: "@aBianca@bL'endroit est sans prétention, mais nous y avons\nété accueillis chaleureusement.\n㈡\nC'était tout ce dont papa avait besoin pour se remonter le moral après avoir laissé l'auberge.\n@c0@"
  it: "@aBianca@bIl posto è un po' spartano, ma ci accolsero con molto calore. Era proprio ciò di cui mio padre aveva bisogno per tirarsi su, dopo aver ceduto la locanda.\n@c0@"
  ja: "@a@bビアンカ「そぼくだけど　心のこもった\n\tもてなしに　宿屋をやめたばかりの\n\t父さんも　すごく満足してたっけ。\n@c0@"
2:
  de: "@aBianca@bWer geschäftlich nach Mostroferrato reist, steigt meist eine Nacht hier ab.\n@c0@"
  en: "@aBianca@bFolk goin' to Mostroferrato for trade and the like usually spend a night here on the way.\n@c0@"
  es: "@aBianca@bLa gente que va camino a Mostroferrato por negocios y eso suele pasar aquí la noche, ¿sabes?\n@c0@"
  fr: "@aBianca@bLes gens qui se rendent à Mostroferrato pour faire du commerce ou autre passent souvent une nuit ici en chemin.\n@c0@"
  it: "@aBianca@bMolta gente in viaggio verso Mostroferrato trascorre la notte qui.\n@c0@"
  ja: "@a@bビアンカ「商売とかで　サラボナへ\n\t行く人は　たいてい　ここの宿で\n\t一泊していくみたいよ。\n@c0@"
3:
  de: "@aNera@bHier haben wir einmal auf dem Weg vom Stift heim nach Mostroferrato übernachtet.\n@c0@"
  en: "@aNera@bWe stayed here one night on the way home to Mostroferrato from the abbey.\n@c0@"
  es: "@aNera@bPasamos una notte aquí de camino a Mostroferrato desde la abadía.\n@c0@"
  fr: "@aNera@bNous avons dormi une nuit ici lors de mon voyage\r\nde retour depuis l'abbaye vers Mostroferrato.\n@c0@"
  it: "@aNera@bQuando tornai a Mostroferrato dall'Abbazia, trascorsi la notte qui.\n@c0@"
  ja: "@a@bフローラ「修道院から　サラボナに\n\t帰るとちゅう　シスターといっしょに\n\tこの宿に　泊まったのですわ。\n@c0@"
4:
  de: "@aNera@bIch wusste, dass ich nach meiner Rückkehr jemanden würde heiraten müssen, den ich mir nicht ausgesucht hatte.\n@c0@"
  en: "@aNera@bI knew that I'd be forced into marrying someone who wasn't of my choosing when I got home.\n@c0@"
  es: "@aNera@bSabía que cuando tornassi a la mia casa me obligarían a casarme con alguien que no hubiera elegido yo.\n@c0@"
  fr: "@aNera@bJe savais que je serais obligée d'épouser quelqu'un que je n'aurais pas choisi une fois de retour à la maison.\n@c0@"
  it: "@aNera@bSapevo che, una volta rientrata a casa, avrei dovuto sposare un uomo che non solo non amavo, ma nemmeno conoscevo!\n@c0@"
  ja: "@a@bフローラ「サラボナに帰れば　誰か\n\t知らない人と　結婚させられることが\n\tわかっていましたけど……\n@c0@"
5:
  de: "@aNera@bTrotzdem habe ich mir überhaupt keine Sorgen gemacht. Es war, als würde ich von einem hellen Licht geführt, und ich hatte keine Angst vor der Zukunft.\n@c0@"
  en: "@aNera@bAnd yet, I didn't feel uneasy at all. It's as if I was being guided by a bright light, and I had no fear\r\nof what was in store.\n@c0@"
  es: "@aNera@bPero no me sentía a disagio. Veramente, era como si me guiara una luz brillante y no temiese per lo que me esperaba.\n@c0@"
  fr: "@aNera@bEt pourtant, je ne me sentais pas mal à l'aise. C'était comme si j'étais guidée par une lumière brillante et que je ne redoutais pas ce qui m'attendait.\n@c0@"
  it: "@aNera@bEppure, non mi sentivo affatto agitata. Era come se una voce celeste parlasse al mio cuore...\r\nMi diceva che il mio futuro sarebbe stato felice.\n@c0@"
  ja: "@a@bフローラ「なにか　大きな光に\n\t導かれて　歩いているような気がして\n\tふしぎと　不安はありませんでしたわ。\n@c0@"
6:
  de: "@aBianca@bDie Wahl des richtigen Zeitpunktes mag ja wichtig sein, aber sie ist nicht alles. Jede Menge Schwung gehört auch dazu.\n@c0@"
  en: "@aBianca@bTimin' might be important, but it en't everythin'.\r\nYou need lots of energy too.\n@c0@"
  es: "@aBianca@bLa coordinación es importante, pero no lo es todo.\r\nTambién hace falta un montonazo energía, ¿sabes?\n@c0@"
  fr: "@aBianca@bChoisir le bon moment est important, bien sûr, mais ça ne fait pas tout. Il faut aussi beaucoup d'énergie.\n@c0@"
  it: "@aBianca@bIo non me la cavo male a spaccare la legna, sai?\nAnzi, sono proprio brava!\n@c0@"
  ja: "@a@bビアンカ「タイミングも　大事だけど\n\tいきおいも　大事よね。\n\t私と%a000090が　そうだったように。\n@c0@"
7:
  de: "@aNera@bHe he he! Was für ein nettes kleines Liedchen! Genau richtig, um einem ein kleines Lächeln ins Gesicht zu zaubern.\n@c0@"
  en: "@aNera@bHe he he! What a funny little ditty! Just what you need to put a smile on your face.\n@c0@"
  es: "@aNera@b¡Ji, ji, ji! ¡Qué canzonetta más graciosa! Es lo que necesitabas para sonreír un po'.\n@c0@"
  fr: "@aNera@bHi hi hiⓠ Quel drôle de dictonⓠ\nExactement ce qu'il faut pour redonner le sourire.\n@c0@"
  it: "@aNera@bNon ho mai provato a spaccar legna in vita mia...\nPapà la comprava già tagliata, pronta per essere messa nel camino.\n@c0@"
  ja: "@a@bフローラ「うふふ。　楽しい歌ですこと！\n\t明るい気分に　なりますわね。\n@c0@"
8:
  de: "@aBianca@b%0%a001210 war eine Säbelzahnkatze und nicht bloß eine normale Katze, oder?\n@c0@"
  en: "@aBianca@b%0%a001210 was a sabrecat and not just a regular cat, eh?\n@c0@"
  es: "@aBianca@bAsí que %a001210 era un dientes de sable y no un gato normal, ¿eh?\n@c0@"
  fr: "@aBianca@b%0%a001210 était un smilodon et pas un simple chat, n'est-ce pasⓡ\n@c0@"
  it: "@aBianca@bOra che ci penso, %a001210 era un Koguar e non un semplice gatto...\n@c0@"
  ja: "@a@bビアンカ「そういえば　%a001210ちゃんは\n\tネコじゃなくて　キラーパンサー\n\tだったって　言ってたよね？\n@c0@"
9:
  de: "@aBianca@bDie Säbelzahnkatze, von der der Typ gerade geredet hat, könnte ja wohl kaum...?\n@c0@"
  en: "@aBianca@bYou dun't think the sabrecat that bloke was just on about could be...?\n@c0@"
  es: "@aBianca@b¿No crees que el dientes de sable del que hablaba ese podría ser...?\n@c0@"
  fr: "@aBianca@bTu ne crois pas que le smilodon que ce type évoquait à l'instant pourrait être...ⓡ\n@c0@"
  it: "@aBianca@bForse il Koguar di cui parlava poco fa quel tizio è proprio...? No, non può essere %a001210.\nSarebbe una coincidenza incredibile!\n@c0@"
  ja: "@a@bビアンカ「さっきの人が　言ってた\n\tキラーパンサーって\n\tもしかして……。\n@c0@"
10:
  de: "@aNera@bRichtig zahm? Du bist doch bestimmt der Einzige, der tapfer genug ist, sich ein Monster als Haustier zu halten, %a000090!\n@c0@"
  en: "@aNera@bSomeone's pet!? Surely you're the only one brave enough to keep a monster as a pet, %a000090!\n@c0@"
  es: "@aNera@b¿Una mascota? ¡Solo tú eres lo bastante coraggioso para tener un monstruo como mascota, %a000090!\n@c0@"
  fr: "@aNera@bLe compagnon de quelqu'unⓡⓐ Tu es sûrement la\nseule personne assez courageuse pour posséder un monstre comme compagnon, %a000090ⓠ\n@c0@"
  it: "@aNera@bNon credo proprio che una belva del genere possa essere domata da qualcuno...\nTranne che da te, ovviamente!\n㈡\nTu sei l'unica persona al mondo che ha tanto coraggio da addomesticare un mostro, %a000090!\n@c0@"
  ja: "@a@bフローラ「人に　飼われていた…って\n\t魔物を飼いならせる方が　あなたの\n\tほかにも　いらっしゃるのかしら？\n@c0@"
11:
  de: "@aBianca@bWas das wohl für Klatsch ist? Wir sollten uns das mal ansehen!\n@c0@"
  en: "@aBianca@bI wonder what kind of gossip it is.\r\nWe should have a look!\n@c0@"
  es: "@aBianca@bMe pregunto qué clase de cotilleos serán.\r\n¡Deberíamos echar un vistazo!\n@c0@"
  fr: "@aBianca@bJe me demande de quels commérages il s'agit.\nOn devrait jeter un œilⓠ\n@c0@"
  it: "@aBianca@bChissà che pettegolezzi ci sono in quel libro...\r\nChe ne diresti di dare un'occhiata, eh?\r\nScommetto che anche tu non vedi l'ora di scoprirlo!\n@c0@"
  ja: "@a@bビアンカ「ウワサって\n\tどんなウワサかしら？\n\tねえ　%a000090　見てみようよ。\n@c0@"
12:
  de: "@aNera@bKlatsch ist ja eigentlich nicht schön. Aber... Ein Blick kann nicht schaden, damit wir einen ungefähren Eindruck bekommen.\n@c0@"
  en: "@aNera@bGossip isn't usually a good thing. But... I wouldn't mind having a look to see what it's about.\n@c0@"
  es: "@aNera@bLos cotilleos no sempre son buenos. Pero... Veramente, no me importaría echar un vistazo para ver qué pasa.\n@c0@"
  fr: "@aNera@bLes commérages sont plutôt néfastes, en général. Mais... j'aimerais quand même y jeter un œil pour savoir de quoi il s'agit.\n@c0@"
  it: "@aNera@bDi solito non amo i pettegolezzi, ma non mi dispiacerebbe dare uno sguardo a quel libro.\r\nCosì, giusto per vedere di che si tratta...\n@c0@"
  ja: "@a@bフローラ「ウワサなんて\n\t良くないですわ。\n\tでも　でも…　気になりますわね。\n@c0@"
13:
  de: "@aBianca@bWahrscheinlich ist er nur überflüssiges Gepäck, aber es kann nicht schaden, ihn mitzunehmen.\n@c0@"
  en: "@aBianca@bIt's probably all just much of a muchness, but it can't hurt to take it with.\n@c0@"
  es: "@aBianca@bProbablemente, no vengan más que exageraciones, pero tampoco hacen daño a nadie.\n@c0@"
  fr: "@aBianca@bTout ce qui est écrit là-dedans doit être du même genre, mais ça ne coûte rien de l'emporter.\n@c0@"
  it: "@aBianca@bMa sì, prendiamolo!\nMal che vada, ci faremo quattro risate!\n@c0@"
  ja: "@a@bビアンカ「たしかに　同じようなことしか\n\t書いてないしね。　でも　まあ\n\tおみやげとして　持っておきましょ。\n@c0@"
14:
  de: "@aNera@bIch habe ihn ganz durchgeblättert, aber ich konnte darin nichts über uns finden. Eigentlich schade.\n@c0@"
  en: "@aNera@bI looked all the way through, but I couldn't see anything in there about us. Shame, really.\n@c0@"
  es: "@aNera@bLo he leído de arriba abajo, pero no he visto nada sobre nosotros. ¡Ma per qué!\n@c0@"
  fr: "@aNera@bJe l'ai entièrement parcouru, mais je n'y ai rien trouvé sur nous. C'est dommage.\n@c0@"
  it: "@aNera@bHo controllato fino all'ultima pagina, e non c'è nemmeno un pettegolezzo su di noi. Meglio così! Non mi piace che gli altri si facciano gli affari miei!\n@c0@"
  ja: "@a@bフローラ「ノートを　全部見てみましたが\n\t私たちについての　ウワサは\n\tありませんでしたわ。　ほっ……。\n@c0@"
15:
  de: "@aBianca@bIch weiß noch, wie mein Vater mal etwas Ähnliches gesagt hat. Die Familie ist ihm heilig.\n@c0@"
  en: "@aBianca@bI remember Dad sayin' somethin' along the same lines. Family's ever so important to him.\n@c0@"
  es: "@aBianca@bRecuerdo que papá decía cosas parecidas. La familia es muy importante para él, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe me souviens avoir entendu papa dire quelque chose du même genre. La famille est vraiment très importante pour lui.\n@c0@"
  it: "@aBianca@bAnch'io la penso così.\nQuando si viaggia insieme, la strada sembra meno lunga e faticosa...\n@c0@"
  ja: "@a@bビアンカ「そういえば　父さんも\n\t同じこと言ってたわ。　なんだか\n\t家族ってことに　こだわってたみたい。\n@c0@"
16:
  de: "@aNera@bLiebling... Ach, nichts. Schon gut. Ich hatte nur gerade daran gedacht, wie glücklich ich bin, das ist alles.\n@c0@"
  en: "@aNera@bDarling... Um, never mind. I was just thinking how happy I am, that's all.\n@c0@"
  es: "@aNera@bCaro... Umm, da igual. Solo pensaba en lo felice que soy, nada más.\n@c0@"
  fr: "@aNera@bMon chéri... hum, non, rien. Je me disais simplement que j'étais très heureuse, c'est tout.\n@c0@"
  it: "@aNera@bAnche secondo me viaggiare in compagnia è meglio che farlo da soli, tesoro. È per questo che ho insistito tanto con mio padre per accompagnarti...\n@c0@"
  ja: "@a@bフローラ「あなた…\n\tいいえ　なんでもないの。\n\t私　幸せだな…　と思って……。\n@c0@"
17:
  de: "@aBianca@bSind ihre Söhne nicht der Priester und der Mann aus der Schänke?\n@c0@"
  en: "@aBianca@bEn't those sons of hers the priest and the bloke from the inn?\n@c0@"
  es: "@aBianca@b¿Sus hijos no son el sacerdote y el tipo de la posada?\n@c0@"
  fr: "@aBianca@bEst-ce que ses fils sont le prêtre et le type de l'aubergeⓡ\n@c0@"
  it: "@aBianca@bMa è la madre del sacerdote e del tizio della locanda?!\n@c0@"
  ja: "@a@bビアンカ「あの人の　ふたりの息子って\n\tまさか　神父さんと　宿屋の\n\tカウンターにいる　おじさん？\n@c0@"
18:
  de: "@aBianca@bWie alt mögen die sein? Sie sieht kaum alt genug aus, um schon so erwachsene Kinder zu haben!\n@c0@"
  en: "@aBianca@bI wonder when she had them! She dun't look old enough to have kids that big!\n@c0@"
  es: "@aBianca@b¿Pero cuándo los tuvo? ¡No parece tener edad para tener hijos tan mayores!\n@c0@"
  fr: "@aBianca@bJe me demande quand elle les a eus. Elle n'a pas l'air assez vieille pour avoir des enfants aussi grandsⓠ\n@c0@"
  it: "@aBianca@bAccidenti! Se li porta proprio bene i suoi anni, eh?!\nNon avrei mai detto che questa donna ha due figli già adulti!\n@c0@"
  ja: "@a@bビアンカ「いったい　いくつの時に\n\t産んだのかしら。\n\tそんなトシに　見えないんだけど……。\n@c0@"
19:
  de: "@aNera@bHättest du lieber einen Jungen oder ein Mädchen? Du wünschst dir doch sicher einen Jungen, der in deine Fußstapfen tritt?\n@c0@"
  en: "@aNera@bWould you prefer to have a boy or a girl? No doubt you want a boy to follow in your footsteps?\n@c0@"
  es: "@aNera@b¿Prefieres un ragazzo o una ragazza? Seguro que prefieres niño para que siga tus pasos.\n@c0@"
  fr: "@aNera@bEt toi, tu préférerais avoir un garçon ou une filleⓡ Je parie que tu voudrais un garçon, pour qu'il marche dans tes traces, j'ai raisonⓡ\n@c0@"
  it: "@aNera@bPreferiresti avere un maschio o una femmina?\nImmagino che vorresti un bell'ometto da portare con te in giro per il mondo, eh?\n@c0@"
  ja: "@a@bフローラ「あなたは　男の子と\n\t女の子　どちらが欲しい？\n\tやっぱり　あとつぎの男の子かしら？\n@c0@"
20:
  de: "@aNera@bJa, die sind so voller Schwung und so unverwüstlich. Es macht Spaß, ihnen beim Herumtollen zuzusehen. Ich hoffe, wir bekommen einen Jungen.\n@c0@"
  en: "@aNera@bYes, they're so rough and tumble. It's fun to watch them play. I'll pray that we have a boy.\n@c0@"
  es: "@aNera@bSí, son muy brutotes. Es divertente verlos jugar. Rezaré para que sea un ragazzo.\n@c0@"
  fr: "@aNera@bOui, ils ont tant d'énergie à revendre. C'est amusant de les regarder jouer. Peut-être que nous en aurons un.\n@c0@"
  it: "@aNera@bCi avrei scommesso, sai? Già ti vedo insegnare a nostro figlio come tirare di spada. Pregherò la dea perché ci faccia avere un maschietto, tesoro mio...\n@c0@"
  ja: "@a@bフローラ「男の子って　元気があって\n\t見ているだけで　楽しいでしょうね。\n\t男の子を産めるよう　がんばりますわ。\n@c0@"
21:
  de: "@aNera@bAber Mädchen können so zart und zerbrechlich sein. Würdest du dir nicht die ganze Zeit Sorgen um sie machen?\n@c0@"
  en: "@aNera@bBut girls can be so delicate. Wouldn't you just be worried about her all the time?\n@c0@"
  es: "@aNera@bPero niñas son molto delicadas. ¿No estarías todo el rato preoccupato per lei?\n@c0@"
  fr: "@aNera@bMais les filles sont parfois si délicates. Tu ne t'inquiéterais pas pour elle en permanenceⓡ\n@c0@"
  it: "@aNera@bAh, no? Secondo me, se avremo una figlia femmina, sarai un padre terribilmente geloso!\nIh ih ih!\n@c0@"
  ja: "@a@bフローラ「女の子だと　かわいすぎて\n\tあなた　心配性に\n\tなるんじゃないかしら？\n@c0@"
22:
  de: "@aNera@bHe he he! Also gut, ich tue mein Bestes, dass es ein Mädchen wird!\n@c0@"
  en: "@aNera@bHe he he! Very well, I'll do my best to give you a girl!\n@c0@"
  es: "@aNera@b¡Ji, ji, ji! ¡Va bene, haré lo que pueda para darte una ragazza!\n@c0@"
  fr: "@aNera@bHi hi hiⓠ Quoi qu'il en soit, nous verrons bien ce que\nle hasard nous réserveⓠ\n@c0@"
  it: "@aNera@bComunque per me va bene, caro.\nCe la metterò tutta per darti una bella femminuccia!\n@c0@"
  ja: "@a@bフローラ「うふふ。\n\t私　女の子を　産めるように\n\tがんばりますわね。\n@c0@"
23:
  de: "@aBianca@bMeine Güte! Damit hatte ich nicht gerechnet! Ich weiß noch, unsere erste Katze war anfangs auch so.\n@c0@"
  en: "@aBianca@bCrikey! That took me by surprise! I remember the cat at our place bein' like that at first.\n@c0@"
  es: "@aBianca@b¡Mi madre! ¡Qué sorpresa! Recuerdo que el gato de mi casa era así al principio.\n@c0@"
  fr: "@aBianca@bBon sangⓠ Ça m'a surpriseⓠ Je me souviens que le chat de chez moi était comme ça au début.\n@c0@"
  it: "@aBianca@bMa che gli è preso a quel gatto, eh?\nForse non riesce a trovare un sorcio da mettere sotto i denti?\n@c0@"
  ja: "@a@bビアンカ「ああ　びっくりした！\n\t私の家に　居ついたネコも\n\t最初は　あんな感じだったっけ。\n@c0@"
24:
  de: "@aNera@bOh weh! Die Katze scheint ja recht schlecht gelaunt zu sein. Na ja, wir haben alle mal solche Tage.\n@c0@"
  en: "@aNera@bOh dear! That cat seems to be in rather a bad mood. I suppose we all have days like that.\n@c0@"
  es: "@aNera@b¡Oh, cielos! Ese gato sembra bastante arisco. Ma tutti tenemos un día malo, ¿no?\n@c0@"
  fr: "@aNera@bOh là làⓠ On dirait que ce chat est de mauvaise humeur. Enfin, on a tous des jours comme ça.\n@c0@"
  it: "@aNera@bQuel micio sembra di pessimo umore.\nChissà, magari ha fame...\n@c0@"
  ja: "@a@bフローラ「あら　ネコさんは\n\tごきげんななめなのね。\n\tまあ　そういう日も　ありますわ。\n@c0@"
25:
  de: "@aGriselda@bIch habe hier schon einmal übernachtet, als ich Nera aus dem Stift abgeholt habe.\n@c0@"
  en: "@aDebora@bI stayed here once before on the way home from collecting Nera from the abbey.\n@c0@"
  es: "@aStefania@bUna notte me quedé aquí tras recoger a Nera en la abadía.\n@c0@"
  fr: "@aPandora@bJ'ai déjà dormi une fois ici, après être allée chercher Nera à l'abbaye pour la ramener à la maison.\n@c0@"
  it: "@aViola@bRicordo di aver trascorso la notte qui durante un viaggio dall'Abbazia di Su'ncyel a Mostroferrato.\n@c0@"
  ja: "@a@bデボラ「修道院から　帰ってくる\n\tフローラを　むかえに\n\tこの宿へ　来たことがあるの。\n@c0@"
26:
  de: "@aGriselda@bEine Nonne hatten wir auch noch dabei. Wir haben ein paar nette Lieder gesungen und sogar noch ein bisschen dazu getanzt.\n@c0@"
  en: "@aDebora@bThere was a nun travelling with us too. We sang some lovely songs and even danced a bit.\n@c0@"
  es: "@aStefania@bCon nosotras venía una monja. Cantamos un po' y hasta bailamos. Estuve estupenda.\n@c0@"
