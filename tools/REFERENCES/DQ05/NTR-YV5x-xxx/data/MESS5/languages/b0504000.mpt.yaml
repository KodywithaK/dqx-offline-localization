  es: "@aStefania@bLos cotilleos son un assurdo. Los que circulan sobre mí en il mio pueblo demuestran que nadie sabe nada de lo dulce que soy en realità.\n@c0@"
  fr: "@aPandora@bLes commérages ne sont qu'une stupide\nperte de temps.\n㈡\nToutes les rumeurs ridicules qui couraient à mon sujet quand je vivais encore à la maison signifiaient seulement que personne ne connaissait la vérité.\n@c0@"
  it: "@aViola@bOdio i pettegolezzi, soprattutto quelli che la gente sparge in giro su di me!\n㈡\nInvece di dirne di cotte e di crude sul mio conto senza nemmeno sapere chi sono, perché le persone non cercano di conoscermi?!\n@c0@"
  ja: "@a@bデボラ「ウワサなんて　あてにならないわ。\n\tサラボナでは　真実とかけはなれた　私の\n\tウワサに　皆がふりまわされてたもん。\n@c0@"
