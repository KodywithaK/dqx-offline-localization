0:
  de: "@aBianca@bDa sind wir also endlich in Humburg. Das war eine ganz schön lange Reise, was?\n@c0@"
  en: "@aBianca@bSo we're finally here in Gotha.\r\nIt was a long old journey, eh?\n@c0@"
  es: "@aBianca@bPor fin estamos en Pankraz.\r\nHa sido un largo viaje, ¿eh?\n@c0@"
  fr: "@aBianca@bAlors nous voici enfin à Gotha.\nLe voyage a été long, heinⓡ\n@c0@"
  it: "@aBianca@bFinalmente siamo a Denim!\nSanto cielo, arrivare fin qui è stata una faticaccia bestiale!\n@c0@"
  ja: "@a@bビアンカ「やっと　たどり着いたわ。\n\tここが　グランバニアなのね。\n\t長い道のりだったわよね。\n@c0@"
1:
  de: "@aBianca@bOb die Mauer wohl ganz um die Burg herumführt?\n@c0@"
  en: "@aBianca@bI wonder why they've got walls all 'round the castle like that.\n@c0@"
  es: "@aBianca@bMe pregunto por qué el castillo estará amurallado.\n@c0@"
  fr: "@aBianca@bJe me demande pourquoi ils ont des murailles\r\ntout autour du château.\n@c0@"
  it: "@aBianca@bChissà come mai hanno deciso di erigere mura tutt'intorno al castello...\n@c0@"
  ja: "@a@bビアンカ「カベが　ぐるりと城を\n\t囲っているのは　どうしてかしら？\n@c0@"
2:
  de: "@aNera@bDas also ist Humburg. Endlich sind wir an deinem Geburtsort. Es war eine ziemlich lange Reise bis hierher.\n@c0@"
  en: "@aNera@bSo this is Gotha. We're here in your birthplace at last. It's been quite a journey to get here.\n@c0@"
  es: "@aNera@bAsí que questo es Pankraz. Tu país natal, al fin. No ha sido un viaggio fácil.\n@c0@"
  fr: "@aNera@bAlors voici Gotha. Nous sommes enfin dans la ville\r\nqui t'a vu naître. Le voyage a été long pour arriver jusqu'ici.\n@c0@"
  it: "@aNera@bIl viaggio è stato ben più lungo e difficile del previsto, ma ce l'abbiamo fatta...\nSiamo arrivati a Denim!\n@c0@"
  ja: "@a@bフローラ「ここが　グランバニア。\n\tあなたの故郷なのね。　今までの\n\t旅の思い出が　頭をよぎりますわ。\n@c0@"
3:
  de: "@aNera@bDie Burg wirkt sehr abweisend. Wie sie wohl von innen aussieht?\n@c0@"
  en: "@aNera@bIt's certainly an impenetrable-looking castle.\r\nI wonder what it's like inside.\n@c0@"
  es: "@aNera@bEl castello tiene aspecto de ser impenetrable.\r\n¿Cómo será por dentro?\n@c0@"
  fr: "@aNera@bC'est une forteresse impénétrable, indiscutablement. Je me demande à quoi ça ressemble, à l'intérieur.\n@c0@"
  it: "@aNera@bVisto da fuori, questo castello sembra una fortezza inespugnabile.\nChissà come sarà all'interno...\n@c0@"
  ja: "@a@bフローラ「がんじょうそうな　お城ね。\n\t中は　どうなっているのかしら？\n@c0@"
4:
  de: "@aBianca@bNoch können wir's nicht beweisen, stimmt's? Na, der kriegt bestimmt einen Riesenschreck, wenn er rausfindet, wer du wirklich bist!\n@c0@"
  en: "@aBianca@bWe can't prove it yet, eh? He'll be in for a shock when he finds out you are royalty, though!\n@c0@"
  es: "@aBianca@bAún no podemos demostrarlo, ¿eh? ¡Pero le espera una buena sorpresa cuando descubra que eres de la realeza!\n@c0@"
  fr: "@aBianca@bNous ne pouvons pas encore le prouver, heinⓡ\nMais ça va lui faire un sacré choc quand il saura que tu fais partie de la famille royaleⓠ\n@c0@"
  it: "@aBianca@bOra non possiamo provarlo, ma vorrei tanto vedere la faccia che farà questo soldatino quando scoprirà chi sei!\n@c0@"
  ja: "@a@bビアンカ「今は　ショウコがないけど\n\tあとで　%a000090が　本当に\n\t王族だと　知ることになるでしょうね。\n@c0@"
5:
  de: "@aNera@bEs ist zum Verzweifeln! Dabei gehörst du doch wirklich zur königlichen Familie! Aber im Moment wird uns das noch niemand glauben.\n@c0@"
  en: "@aNera@bHow frustrating! We can't argue with him at the moment, but the truth is that you really are royalty!\n@c0@"
  es: "@aNera@b¡Qué frustrante! ¡Aún no podemos discutir con él, pero la verità es que tú sí eres de la realeza!\n@c0@"
  fr: "@aNera@bComme c'est frustrantⓠ Nous ne pouvons pas le contredire pour l'instant, mais c'est pourtant la véritéⓢ tu es bien membre de la famille royaleⓠ\n@c0@"
  it: "@aNera@bMa è vero! Tu fai parte della famiglia reale!\nSolo che ora non possiamo dimostrarlo...\n@c0@"
  ja: "@a@bフローラ「く　くやしいですわ。\n\t今は　なにも言えませんけど\n\t%a000090さんは　王族なんですから！\n@c0@"
6:
  de: "@aBianca@bHier kommen wir offenbar nicht weiter. Dann müssen wir es wohl auf anderem Wege versuchen.\n@c0@"
  en: "@aBianca@bLooks like we can't get any further, then. We'll have to try another route.\n@c0@"
  es: "@aBianca@bParece que ya no podemos avanzar más. Tendremos que encontrar otro camino, ¿sabes?\n@c0@"
  fr: "@aBianca@bOn dirait qu'on ne peut pas aller plus loin.\r\nIl va falloir essayer de passer par un autre endroit.\n@c0@"
  it: "@aBianca@bDi qui non si passa.\nDovremo trovare un'altra strada.\n@c0@"
  ja: "@a@bビアンカ「この先には　行けないようね。\n\tほかの場所を　見てまわりましょう。\n@c0@"
7:
  de: "@aNera@bDer König ist bestimmt drinnen. Wie ärgerlich, dass wir ihn nicht erreichen können!\n@c0@"
  en: "@aNera@bThe King is probably just inside. How frustrating not to be able to reach him.\n@c0@"
  es: "@aNera@bProbablemente el Rey esté ahí mismo. Es veramente frustrante no poder acceder a él.\n@c0@"
  fr: "@aNera@bLe roi est sans doute à l'intérieur. Comme c'est frustrant de ne pas pouvoir aller jusqu'à lui.\n@c0@"
  it: "@aNera@bUhm, da questa parte non c'è verso di passare...\nDobbiamo trovare il modo di farci ricevere a corte.\nMa come facciamo a entrare?\n@c0@"
  ja: "@a@bフローラ「あの奥には　王さまが\n\tいらっしゃるでしょうに…\n\tお会いできなくて　ざんねんですわ。\n@c0@"
8:
  de: "@aBianca@bDie hat ja einen ganz schönen Ton am Leibe! Aber eine Prinzessin finde ich trotzdem ziemlich beeindruckend.\n@c0@"
  en: "@aBianca@bShe's got a bit of a mouth on her, but bein' a princess alone is enough to impress me.\n@c0@"
  es: "@aBianca@bLa niña es un poquillo bocazas, pero solo por ser una princesa ya me impresiona, ¿sabes?\n@c0@"
  fr: "@aBianca@bElle a certes la langue bien pendue, mais le seul fait qu'elle soit une princesse suffit à m'impressionner.\n@c0@"
  it: "@aBianca@bQuesta ragazzina è un vero spasso!\nQualsiasi donna vorrebbe essere una principessa,\ne lei che lo è davvero se ne lamenta!\n@c0@"
  ja: "@a@bビアンカ「言葉使いは　ああだけど\n\tお姫さまと　いうだけあって\n\tきれいな人ね。\n@c0@"
9:
  de: "@aNera@bDie arme Prinzessin wirkt ziemlich unglücklich. Ich kann mir vorstellen, wie ihr zumute ist.\n@c0@"
  en: "@aNera@bThat poor princess seems rather down in the dumps. Still, I think I can imagine how she must feel.\n@c0@"
  es: "@aNera@bEsa pobre principessa parece bastante desanimada. Pero imagino cómo se debe de sentir, ¿sabes?\n@c0@"
  fr: "@aNera@bCette pauvre princesse avait l'air plutôt déprimée. Mais je crois que je comprends ce qu'elle ressent.\n@c0@"
  it: "@aNera@bPovera piccola, ha tutta la mia comprensione!\nSo perfettamente cosa significhi essere costrette a rinunciare ai propri sogni...\n@c0@"
  ja: "@a@bフローラ「ずいぶんと　くだけた\n\tお姫さまなのね。\n\tでも　お気持ち　わかる気がするわ。\n@c0@"
10:
  de: "@aBianca@bJe mehr wir hören, desto mehr drängt sich der Gedanke auf, dass wir in deinem Geburtsland sind, stimmt's nicht, %a000090?\n@c0@"
  en: "@aBianca@bThe more things we hear, the harder it is to forget we're here in your birthplace, eh, %a000090?\n@c0@"
  es: "@aBianca@bCuantas más cosas descubrimos más claro está que este es el sitio donde naciste, ¿eh, %a000090?\n@c0@"
  fr: "@aBianca@bPlus on en entend, plus il est difficile d'oublier qu'on est ici à l'endroit où tu es né, hein, %a000090ⓡ\n@c0@"
  it: "@aBianca@bPare che i sudditi di Denim siano ancora molto affezionati a tuo padre, %a000090...\nRussel era davvero una gran brava persona.\n@c0@"
  ja: "@a@bビアンカ「聞けば聞くほど\n\tここが　%a000090のふるさとだって\n\t思わずには　いられないわ。\n@c0@"
11:
  de: "@aNera@bDann sollten wir doch versuchen, diesen Sancho zu finden. Es klingt, als wäre er irgendwo in der Burg.\n@c0@"
  en: "@aNera@bWe should try to find this Sancho character, then.\r\nIt sounds like he's somewhere in the castle.\n@c0@"
  es: "@aNera@bDeberíamos intentar encontrar a ese tal Sancho.\r\nDebe de estar en el castello, en alguna parte.\n@c0@"
  fr: "@aNera@bNous devrions essayer de retrouver ce Sancho, dans ce cas. Il doit vraisemblablement être\r\nquelque part dans le château.\n@c0@"
  it: "@aNera@bDobbiamo trovare questo Sancho, %a000090.\nSecondo me è da qualche parte nel castello...\n@c0@"
  ja: "@a@bフローラ「とにかく　一度　この城にいる\n\tサンチョという方に　会ったほうが\n\tいいようですわね。\n@c0@"
12:
  de: "@aBianca@bUi! Das ist beeindruckend! Da liegt ja eine ganze Stadt hinter den Burgmauern!\n@c0@"
  en: "@aBianca@bWow! This place is amazin'! There's a whole town inside the castle walls!\n@c0@"
  es: "@aBianca@b¡Vaya! ¡Este sitio es bestial! ¡Dentro de los muros del castillo hay toda una ciudad!\n@c0@"
  fr: "@aBianca@bWaouhⓠ Cet endroit est incroyableⓠ\nUne ville toute entière est abritée derrière\nles murailles du châteauⓠ\n@c0@"
  it: "@aBianca@bChe spettacolo incredibile!\r\nC'è un'intera città all'interno delle mura del castello!\r\n@c0@"
  ja: "@a@bビアンカ「わ～　すごいわ。\n\tお城の中に　すっぽり\n\t町が　おさまっているのね。\n@c0@"
13:
  de: "@aBianca@bWahrscheinlich gibt's hier ein paar Leute, die dich kennen, %a000090. Wir sollten mit so vielen Leuten wie möglich sprechen.\n@c0@"
  en: "@aBianca@bThere's prob'ly some folk here who know about you, %a000090. We should talk to as many of 'em as we can.\n@c0@"
  es: "@aBianca@bDebe de haber personas aquí que saben cosas de ti, %a000090. Tenemos que hablar con todos los que podamos, ¿me entiendes?\n@c0@"
  fr: "@aBianca@bIl doit bien y avoir quelqu'un ici qui sait quelque chose à ton sujet, %a000090. On devrait essayer de parler à un maximum de monde.\n@c0@"
  it: "@aBianca@bProbabilmente qualcuno degli abitanti si ricorderà ancora di te, %a000090. Cerchiamo di parlare con quanta più gente è possibile.\n@c0@"
  ja: "@a@bビアンカ「%a000090のことを　知っている\n\t人が　いるかもしれないわ。\n\tいろんな人に　話しかけてみましょう。\n@c0@"
14:
  de: "@aNera@bDann liegt die Stadt also innerhalb der Burgmauern. Ich muss schon sagen, es ist wirklich schön hier, mit all den Gärten und offenen Plätzen.\n@c0@"
  en: "@aNera@bSo the town is inside the castle walls. I must say, it's a lovely place, with all its gardens and light spaces.\n@c0@"
  es: "@aNera@bAsí que la città está dentro del castello. Es un sitio precioso, con sus jardines y sus espacios abiertos.\n@c0@"
  fr: "@aNera@bAinsi, la ville se trouve à l'intérieur des murailles.\r\nJe dois reconnaître que c'est un endroit charmant, avec tous ces jardins et ces espaces ouverts.\n@c0@"
  it: "@aNera@bUn castello che ha al suo interno tutta una città...!\nNon avevo mai visto nulla di simile!\n@c0@"
  ja: "@a@bフローラ「町が　お城の中にあるのね。\n\t緑もあるし　明るいし\n\tすてきなところですわ。\n@c0@"
15:
  de: "@aNera@bKomm, am besten reden wir mit so vielen Leuten wie möglich. Vielleicht treffen wir jemanden, der sich an dich erinnert.\n@c0@"
  en: "@aNera@bLet's try talking to as many people as we can.\r\nWe might just find someone who remembers you.\n@c0@"
  es: "@aNera@bVamos a intentar parlare con tutti las personas que podamos.\r\nQuizá alguien te recuerde.\n@c0@"
  fr: "@aNera@bEssayons de parler à autant de personnes que possible. Nous pourrions peut-être trouver\r\nquelqu'un qui se souviendra de toi.\n@c0@"
  it: "@aNera@bProviamo a parlare con gli abitanti di Denim.\nMagari qualcuno di loro si ricorda di te.\n@c0@"
  ja: "@a@bフローラ「とにかく　いろいろな人と話して\n\tあなたを　知っている人がいないか\n\tきいてみましょうよ。\n@c0@"
16:
  de: "@aBianca@bBei diesem Gruß wird's mir erst so richtig klar, dass wir tatsächlich endlich in Humburg gelandet sind!\n@c0@"
  en: "@aBianca@bHearin' him say that really brings it home to me that we've made it here to Gotha at last!\n@c0@"
  es: "@aBianca@b¡Al oírle decir eso me doy cuenta de verdad de que por fin hemos llegado a Pankraz!\n@c0@"
  fr: "@aBianca@bQuand je l'entends dire ça, je réalise vraiment que nous avons enfin réussi à arriver à Gothaⓠ\n@c0@"
  it: "@aBianca@bGrazie!\n@c0@"
  ja: "@a@bビアンカ「あのセリフを　聞くと\n\tああ　グランバニアに　来たんだって\n\t実感が　こみあげるわね。\n@c0@"
17:
  de: "@aNera@bDann haben wir es also endlich nach Humburg geschafft. Der Göttin sei Dank, dass sie uns sicher bis hierher geleitet hat.\n@c0@"
  en: "@aNera@bSo we've finally made it to Gotha. Thank the Goddess we were able to get here safely.\n@c0@"
  es: "@aNera@bAsí que por fin siamo arrivati a Pankraz. Gracias a la Diosa que hemos llegado sanos y salvos.\n@c0@"
  fr: "@aNera@bNous avons enfin réussi à atteindre Gotha. Grâce à la Déesse, nous y sommes parvenus sains et saufs.\n@c0@"
  it: "@aNera@bGià, finalmente siamo a Denim.\nRingraziamo la dea che ci ha fatti arrivare a destinazione sani e salvi.\n@c0@"
  ja: "@a@bフローラ「私たち　本当に\n\tグランバニアへ　来たのね。\n\tぶじに　来られて　よかった……。\n@c0@"
18:
  de: "@aBianca@bGlaubst du, König Ludwig war wirklich dein Vater, %a000090?\n@c0@"
  en: "@aBianca@bD'you think King Pankraz was really your dad, %a000090?\n@c0@"
  es: "@aBianca@b¿Crees que el rey Teudis era realmente tu padre, %a000090?\n@c0@"
  fr: "@aBianca@bTu crois que le roi Petros était vraiment ton père, %a000090ⓡ\n@c0@"
  it: "@aBianca@bNiente male come pensata, eh?\nTuo padre era una persona molto intelligente, %a000090.\n@c0@"
  ja: "@a@bビアンカ「パパス王って　本当に\n\t%a000090のお父さんの\n\tパパスさんなのかな？\n@c0@"
19:
  de: "@aBianca@bIst gar nicht so leicht, das in den Kopf zu kriegen, was?\n@c0@"
  en: "@aBianca@bIt's a bit hard to get your head 'round it all, eh?\n@c0@"
  es: "@aBianca@bEs un poco difícil hacerse a la idea, ¿no?\n@c0@"
  fr: "@aBianca@bC'est difficile d'intégrer tout ça, heinⓡ\n@c0@"
  it: "@aBianca@bMi sembri disorientato...\nCerto, deve farti uno strano effetto tornare a Denim dopo tanti anni...\n@c0@"
  ja: "@a@bビアンカ「なんだか　あんなに\n\tスケールの大きな話を　聞いたら\n\tわからなく　なってきちゃった。\n@c0@"
20:
  de: "@aNera@bKönig Ludwig muss ein großartiger Mann gewesen sein, wenn er so viel Mühe auf sich genommen hat, um seine Untertanen in Sicherheit zu bringen.\n@c0@"
  en: "@aNera@bKing Pankraz must've been quite a man to go to such trouble to ensure the safety of his people.\n@c0@"
  es: "@aNera@bTeudis debe de haber sido un hombre notabile para tomarse tantas molestias para garantizar la securitá de sus súbditos.\n@c0@"
  fr: "@aNera@bLe roi Petros devait vraiment être quelqu'un de spécial. Il s'est donné tant de mal pour assurer\nla sécurité de son peupleⓠ\n@c0@"
  it: "@aNera@bEvidentemente re Russel aveva molto a cuore la sicurezza dei sudditi... Dev'essere stato un sovrano molto amato dal suo popolo.\n@c0@"
  ja: "@a@bフローラ「そこまで　国民のことを\n\t考えるなんて　パパス王は\n\tすばらしい方　でしたのね。\n@c0@"
21:
  de: "@aBianca@bEs klingt, als wären sie des Wartens auf ihren alten König ein wenig müde geworden, was?\n@c0@"
  en: "@aBianca@bSounds like they all got tired of waitin' for the old king to come home, eh?\n@c0@"
  es: "@aBianca@bParece que se han cansado de esperar a que vuelva el antiguo rey, ¿eh?\n@c0@"
  fr: "@aBianca@bOn dirait qu'ils en ont tous eu assez d'attendre le retour de l'ancien roi, heinⓡ\n@c0@"
  it: "@aBianca@bÈ comprensibile, non credi?\nNon era possibile che il Regno di Denim restasse senza una guida.\n@c0@"
  ja: "@a@bビアンカ「みんな　先代の王の帰りを\n\t待ちわびていたのね。\n@c0@"
22:
  de: "@aNera@bWas für ein Mann ist wohl Prinz Sebastian? Hoffentlich ein guter.\n@c0@"
  en: "@aNera@bI wonder what kind of character this Prince Albert is. I do hope he's not a bad sort.\n@c0@"
  es: "@aNera@bMe pregunto qué clase de persona es el rey Agila. Veramente, espero que no sea malo.\n@c0@"
  fr: "@aNera@bJe me demande quel genre de personnage est ce prince Albert. J'espère qu'il n'est pas méchant.\n@c0@"
  it: "@aNera@bChissà che tipo è il Principe Reggente...\nSpero che sia una persona con la quale è possibile ragionare.\n@c0@"
  ja: "@a@bフローラ「オジロン王って\n\tどんな方でしょう？\n\t悪い人でないと　いいですわね。\n@c0@"
23:
  de: "@aBianca@bEin Kunsthandwerker? Komisch, dass er einfach so weggegangen ist. Er muss sehr an König Ludwig gehangen haben.\n@c0@"
  en: "@aBianca@bA craftsman, eh? It's funny that he left the castle like that. He must've bin ever so attached to\r\nKing Pankraz.\n@c0@"
  es: "@aBianca@bUn artesano, ¿eh? Es curioso que se fuese así del castillo. Debía de estar muy unido al rey Teudis.\n@c0@"
  fr: "@aBianca@bUn artisanⓡ C'est drôle qu'il ait quitté le château comme ça. Il devrait être particulièrement attaché\nau roi Petros.\n@c0@"
  it: "@aBianca@bMi chiedo come mai quell'artigiano abbia lasciato il castello di punto in bianco...\nChe sia partito anche lui alla ricerca di re Russel?\n@c0@"
  ja: "@a@bビアンカ「名工か…　城を出るなんて\n\tよほど　パパス王のことを\n\tしたっていたのかも　知れないわね。\n@c0@"
24:
  de: "@aNera@bEin Goldschmiedegott? Hier muss es sich gut leben lassen, wenn hier Leute dieses Kalibers zu Hause sind.\n@c0@"
  en: "@aNera@bA god among jewellers? This must be a good place to live if they've had people of that kind of calibre here.\n@c0@"
  es: "@aNera@b¿Lo veneraban los orfebres? Este debe de ser un buen sitio para vivir, si hay personas de questa categoría.\n@c0@"
  fr: "@aNera@bLe Roi des joailliersⓡ Ça doit être un endroit agréable à vivre si l'on y trouve des gens de ce calibre.\n@c0@"
  it: "@aNera@bIl tenore di vita a Denim dev'essere decisamente alto, se qui lavorava un orefice tanto bravo.\n@c0@"
  ja: "@a@bフローラ「宝石細工の神さま…\n\tそんな方までが　住んでいらしたなんて\n\tよほど　住みごこちが　いい国なのね。\n@c0@"
25:
  de: "@aBianca@bWas für ein witziger kleiner Bursche! Es wäre bestimmt lustig, den dabei zu haben, wenn er nur ein bisschen älter wäre.\n@c0@"
  en: "@aBianca@bWhat a funny little boy! It could've bin fun to take him along with us if only he was a bit older.\n@c0@"
  es: "@aBianca@b¡Qué muchachito más gracioso! Si fuese algo mayor, sería divertido llevarlo con nosotros, ¿sabes?\n@c0@"
  fr: "@aBianca@bQuel drôle de petit garçonⓠ Ça aurait pu être amusant de l'emmener avec nous s'il avait été\nun peu plus grand.\n@c0@"
  it: "@aBianca@bChe simpatico quel bambino!\nMa non è un po' troppo giovane per pensare alle ragazze...?\n@c0@"
  ja: "@a@bビアンカ「まっすぐで　かわいいね。\n\tあの子が　もう少し大きくなったら\n\tいっしょに　旅するのもいいかもね。\n@c0@"
26:
  de: "@aNera@bBis er erwachsen und Soldat ist, sind wir schon im mittleren Alter.\n@c0@"
  en: "@aNera@bBy the time he's grown up and become a soldier,\r\nwe'll be middle-aged.\n@c0@"
  es: "@aNera@bCuando haya crecido y sea soldato, nosotros ya seremos un poco viejos.\n@c0@"
  fr: "@aNera@bQuand il sera suffisamment grand pour devenir soldat, nous aurons déjà un certain âge.\n@c0@"
  it: "@aNera@bSe fossi quel bambino, da grande farei l'ingegnere.\nE il mio primo lavoro sarebbe costruire una strada più comoda tra Denim e Neviternia...\n@c0@"
  ja: "@a@bフローラ「あの子が　大きくなって\n\t兵士になるころには　私たち\n\tおじさん　おばさんに　なってますわ。\n@c0@"
27:
  de: "@aBianca@bVolle Zustimmung! Wenn ich Kinder hätte, würd' ich genau das Gleiche sagen!\n@c0@"
  en: "@aBianca@bI second that! If I was a mum, I'd be sayin' exactly the same thing.\n@c0@"
  es: "@aBianca@b¡Estoy de acuerdo! Si fuese madre diría exactamente lo mismo, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe suis bien d'accordⓠ Si j'avais des enfants,\nje dirais exactement la même chose.\n@c0@"
  it: "@aBianca@bNon ho figli, ma anch'io vorrei che il mondo fosse un luogo più tranquillo...\n@c0@"
  ja: "@a@bビアンカ「ホントに　そうよね。\n\t私も　お母さんになったら\n\t同じこと　思うだろうな……。\n@c0@"
28:
  de: "@aNera@bRecht hat sie! Ich hoffe, unsere Kinder müssen nie solche Kämpfe und Gefahren durchleben wie wir.\n@c0@"
  en: "@aNera@bI couldn't agree more. I hope our children never have to experience battles and danger like we've had to.\n@c0@"
  es: "@aNera@bNo podría estar más de acuerdo. Espero que nuestros ragazzi nunca tengan que vivir luchas y peligros como nosotros.\n@c0@"
  fr: "@aNera@bJe suis bien d'accord. J'espère que nos enfants n'auront jamais à connaître les combats et le danger auxquels nous avons été nous-mêmes confrontés.\n@c0@"
  it: "@aNera@bSarebbe bello se potessimo lasciare in eredità alle generazioni future un mondo in pace, libero dalle guerre e dall'ingiustizia...\n@c0@"
  ja: "@a@bフローラ「私も　そう思います。\n\t私たちの子にだって　できれば\n\tたたかいなんて　させたくないもの。\n@c0@"
29:
  de: "@aBianca@bWenn das dein Sancho ist, dann war er bestimmt deswegen in der Kirche, um für dich zu beten, %a000090.\n@c0@"
  en: "@aBianca@bIf it's the same Sancho as our Sancho, I'll bet he was in the church the whole time prayin' you'd be safe, %a000090.\n@c0@"
  es: "@aBianca@bSi el Sancho del que habla es nuestro Sancho, seguro que se ha pasado todo el tiempo en la iglesia rezando por ti, %a000090.\n@c0@"
  fr: "@aBianca@bSi ce Sancho est bien notre Sancho, je parie qu'il a passé tout son temps à l'église à prier pour que tu ailles bien, %a000090.\n@c0@"
  it: "@aBianca@bSe sta parlando del ⓕnostroⓖ Sancho, scommetto che andava in chiesa per pregare la dea che tu tornassi a casa sano e salvo, %a000090.\n@c0@"
  ja: "@a@bビアンカ「その人が　私たちの知っている\n\tサンチョさんなら　%a000090の無事を\n\tずっと　祈ってたんだと思うわ……。\n@c0@"
30:
  de: "@aNera@bJeden Tag zur Kirche? Vielleicht hat er darum gebetet, dass jemand, der ihm nahe steht, heil und gesund nach Hause zurückkehrt.\n@c0@"
  en: "@aNera@bIn church every day? Maybe he was praying someone dear to him would come home safe\r\nand sound.\n@c0@"
  es: "@aNera@b¿Cada día a la iglesia? Quizá pregaba para que algún ser querido volviese sano y salvo a casa.\n@c0@"
  fr: "@aNera@bÀ l'église tous les joursⓡ Il priait peut-être pour\nque quelqu'un qui lui est cher rentre chez lui\nsain et sauf.\n@c0@"
  it: "@aNera@bQuesto Sancho si reca in chiesa ogni giorno per pregare? Allora sarà sicuramente una persona molto devota alla nostra amata dea...\n@c0@"
  ja: "@a@bフローラ「毎日のように　お祈りなんて。\n\t大切な方の　無事でも\n\tお祈りなさっていたのかしら……。\n@c0@"
31:
  de: "@aBianca@bWir sollten diesen Sancho so schnell wie möglich finden. Na komm schon!\n@c0@"
  en: "@aBianca@bWe'd better try and find this Sancho character a bit sharpish. Come on!\n@c0@"
  es: "@aBianca@bSerá mejor que encontremos a ese tal Sancho enseguidita. ¡Vamos!\n@c0@"
  fr: "@aBianca@bOn ferait bien d'essayer de retrouver ce Sancho\nau plus vite. Allez, on y vaⓠ\n@c0@"
  it: "@aBianca@bForza, andiamo a cercare Sancho!\n@c0@"
  ja: "@a@bビアンカ「とにかく　そのサンチョさんに\n\t会うのが　いちばん早いわね。\n\tサンチョさんを　さがしましょうよ。\n@c0@"
32:
  de: "@aNera@bWo fangen wir am besten mit der Suche nach diesem Sancho an?\n@c0@"
  en: "@aNera@bI wonder where we have to go to find this\r\nSancho fellow.\n@c0@"
  es: "@aNera@bMe pregunto dove tendremos que ir para encontrar al tal Sancho.\n@c0@"
  fr: "@aNera@bJe me demande où nous pourrions trouver ce Sancho.\n@c0@"
  it: "@aNera@bSecondo te dove sarà questo Sancho?\nDove potremmo trovarlo...?\n@c0@"
  ja: "@a@bフローラ「その　サンチョさんという方は\n\tどこに行けば　会えるのかしら……。\n@c0@"
33:
  de: "@aBianca@bZehntausend Goldmünzen? Das ist irgendwie nicht Fisch, nicht Fleisch. Nicht gerade ein Vermögen, aber immerhin ein stolzes Sümmchen!\n@c0@"
  en: "@aBianca@bTen thousand gold coins? That's a bit neither here nor there, eh? Not a fortune, but not somethin' to be sniffed at neither.\n@c0@"
  es: "@aBianca@b¿Diez mil monedas de oro? Bueno, no es una fortuna, pero tampoco es como para hacerle un desprecio, ¿sabes?\n@c0@"
  fr: "@aBianca@b10000 pièces d'orⓡ C'est un peu ⓥbancalⓦ comme somme, nonⓡ Pas vraiment une fortune, mais pas\nnon plus quelque chose de négligeable.\n@c0@"
  it: "@aBianca@bDiecimila monete d'oro?!\nDiamine! Se avessi tanti soldi trascorrerei il resto della mia vita a godermi il sole su una bella isola!\n@c0@"
  ja: "@a@bビアンカ「１００００ゴールドって\n\tびみょうな金額よね。\n\tだとうなような　少ないような……。\n@c0@"
34:
  de: "@aNera@bEs sieht so aus, als hätte der neue König alles drangesetzt, um das vermisste Königspaar zu finden.\n@c0@"
  en: "@aNera@bIt looks like the new king did what he could to try to find the missing royal couple.\n@c0@"
  es: "@aNera@bParece que il nuovo rey hizo todo lo que pudo para encontrar a la pareja real ausente.\n@c0@"
  fr: "@aNera@bOn dirait que le nouveau roi a fait ce qu'il a pu pour retrouver le couple royal.\n@c0@"
  it: "@aNera@bSembra che il Principe Reggente non abbia lasciato nulla di intentato pur di ritrovare il Re e la Regina...\n@c0@"
  ja: "@a@bフローラ「オジロンという方も\n\t一生けんめい　さがす努力を\n\tなさっていましたのね……。\n@c0@"
35:
  de: "@aBianca@bIch verstehe, dass das Volk König Ludwig in Erinnerung behalten will, aber irgendwann muss das Leben eben weitergehen, findest du nicht?\n@c0@"
  en: "@aBianca@bI can understand folk wantin' to remember King Pankraz, but they're goin' to have to move on\r\nsooner or later.\n@c0@"
  es: "@aBianca@bComprendo que las personas recuerden al rey Teudis, pero antes o después tendrán que pasar página, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe peux comprendre les gens qui souhaitent se souvenir du roi Petros, mais il faudra qu'ils passent à autre chose, un jour ou l'autre.\n@c0@"
  it: "@aBianca@bÈ bello vedere che i sudditi di Denim hanno ancora tanta devozione per il loro Re, ma forse dovrebbero rendersi conto che Russel non tornerà più...\n@c0@"
  ja: "@a@bビアンカ「パパス王を　しのぶ気持ちも\n\tわかるけど　そろそろ　べつの\n\t生きがいを　見つけてほしいわよね。\n@c0@"
36:
  de: "@aNera@bEs ist nicht gut, wenn die Leute der Wahrheit nicht ins Auge blicken wollen.\n@c0@"
  en: "@aNera@bIt's not good for people to be so resistant to\r\nthe truth.\n@c0@"
  es: "@aNera@bNo es buono que las personas nieguen la evidencia.\n@c0@"
  fr: "@aNera@bCe n'est pas bon de se voiler aussi obstinément\r\nla face.\n@c0@"
  it: "@aNera@bQuesta gente dovrebbe guardare in faccia la realtà.\n@c0@"
  ja: "@a@bフローラ「現実を　見なくては\n\tいけませんわ。\n@c0@"
37:
  de: "@aNera@bIch bin sicher, König Ludwig würde nicht wollen, dass er sich so an die Vergangenheit klammert.\n@c0@"
  en: "@aNera@bI'm sure King Pankraz wouldn't want him to be living in the past like that.\n@c0@"
  es: "@aNera@bEstoy sicura de que el rey Teudis no querría que viviesen aferrados al pasado.\n@c0@"
  fr: "@aNera@bJe suis sûre que le roi Petros ne voudrait pas\r\nle voir vivre dans le passé comme ça.\n@c0@"
  it: "@aNera@bSono certa che re Russel non vorrebbe che i suoi sudditi nutrissero ancora vane speranze...\n@c0@"
  ja: "@a@bフローラ「あのように　過去ばかり\n\tふりかえって　生きていては\n\tパパス王も　なげかれるでしょう……。\n@c0@"
38:
  de: "@aBianca@bWas dieser Sebastian wohl für ein Mensch ist? Allmählich mache ich mir etwas Sorgen.\n@c0@"
  en: "@aBianca@bI wonder what this Albert character's like.\r\nI'm startin' to get a bit worried now.\n@c0@"
  es: "@aBianca@bMe pregunto cómo será el tal Agila.\r\nMe estoy empezando a preocupar, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe me demande à quoi ressemble ce fameux Albert.\r\nJe commence à m'inquiéter un peu.\n@c0@"
  it: "@aBianca@bChissà che tipo è il principe Alberto...\r\nTemo che non sarà facile spiegargli la situazione...\n@c0@"
  ja: "@a@bビアンカ「オジロン王って\n\tどんな人なんだろうね。\n\t気になって　きちゃったな。\n@c0@"
39:
  de: "@aNera@bSoll das heißen, dass König Sebastian keine Träume hat? Er scheint ja nicht gerade sehr beliebt zu sein, was?\n@c0@"
  en: "@aNera@bDoes that mean King Albert has no dreams, then?\r\nIt doesn't sound like he's very popular, does it?\n@c0@"
  es: "@aNera@b¿Eso quiere decir que el rey Agila no tiene sueños?\r\nNo parece que sea troppo popular, ¿eh?\n@c0@"
  fr: "@aNera@bEst-ce que ça veut dire que le roi Albert n'a pas de rêvesⓡ Il ne semble pas très populaire, tu ne trouves pasⓡ\n@c0@"
  it: "@aNera@bIl Principe Reggente non gode di grande stima tra i suoi sudditi... Forse il paragone con re Russel lo fa apparire peggiore di quanto sia in realtà.\n@c0@"
  ja: "@a@bフローラ「…ということは　オジロン王は\n\t好きになれなくて　夢のない王さま\n\tということなのかしら？\n@c0@"
40:
  de: "@aBianca@bHast du das gesehen?! Sie hatte Flügel am Rücken! Glaubst du, die waren echt? Was war das denn für ein Wesen?!\n@c0@"
  en: "@aBianca@bDid you see that!? She had wings on her back!\r\nD'you think they were real? Just what kind of a character was she!?\n@c0@"
  es: "@aBianca@b¡¿Has visto eso?! ¡Tenía alas en la espalda!\r\n¿Tú crees que eran de verdad? ¡¿Pero qué clase de criatura será?!\n@c0@"
  fr: "@aBianca@bTu as vu çaⓡⓐ Elle avait des ailes dans le dosⓠ\nTu crois qu'elle était réelleⓡ Mais quel genre de personne pouvait-elle bien êtreⓡⓐ\n@c0@"
  it: "@aBianca@bHai visto?!\nQuella donna aveva un paio d'ali sulla schiena!\nMa com'è possibile?!\n@c0@"
  ja: "@a@bビアンカ「ねえ　見た！？\n\tあの女の人　背中に　羽がはえてるわ。\n\tあれ　本物よね？　何者なのかしら？？\n@c0@"
41:
  de: "@aNera@bDie Dame ist vermutlich Zenithianerin. Von denen habe ich gelesen.\n@c0@"
  en: "@aNera@bI think that lady was probably a Zenithian. I've read about them in the past.\n@c0@"
  es: "@aNera@bCredo que esa signora debía de ser de Zenithia. He leído cosas sobre los habitantes de Zenithia.\n@c0@"
  fr: "@aNera@bÀ mon avis, cette femme était probablement\r\nune Zénithienne. J'ai lu des choses à leur sujet, autrefois.\n@c0@"
  it: "@aNera@bCredo che quella donna appartenga alla mitica stirpe degli Zenithiani. Ricordo di aver letto un libro su di loro, quando studiavo all'Abbazia di Su'ncyel.\n@c0@"
  ja: "@a@bフローラ「あの方は　たぶん\n\t天空人ですわ。\n\t前に　本で読んだことがあります。\n@c0@"
42:
  de: "@aNera@bIch hätte aber nie gedacht, dass ich mal einer aus Fleisch und Blut begegnen würde.\n@c0@"
  en: "@aNera@bI never imagined I'd ever meet one in the\r\nflesh, though.\n@c0@"
  es: "@aNera@bMa nunca imaginé que vería uno en carne y hueso.\n@c0@"
  fr: "@aNera@bMais je n'aurais jamais imaginé en rencontrer une\r\nen chair et en os.\n@c0@"
  it: "@aNera@bMai mi sarei sognata che un giorno avrei incontrato una Zenithiana in carne e ossa...\n@c0@"
  ja: "@a@bフローラ「まさか　じっさいに\n\tお会いするとは\n\t思っていませんでしたが……。\n@c0@"
43:
  de: "@aBianca@bKönigin Magdalena hatte einen Schleim als Haustier? Eine gewisse Ähnlichkeit scheint zwischen euch vorhanden zu sein!\n@c0@"
  en: "@aBianca@bSounds like Queen Mada was a lot like you, if she was the sort to keep a slime as a pet!\n@c0@"
  es: "@aBianca@bOye, la reina Perséfone se parecía mucho a tiⓓ ¡si hasta tenía un limo como mascota!\n@c0@"
  fr: "@aBianca@bOn dirait que la reine Magdalena te ressemblait beaucoup si elle était du genre à avoir un gluant comme animal de compagnieⓠ\n@c0@"
  it: "@aBianca@bNon avrei mai immaginato che la regina Mada avesse uno Slime ⓕda compagniaⓖ.\nIn questo le somigli un po', sai? Eh eh eh!\n@c0@"
  ja: "@a@bビアンカ「スライムを　飼いならすなんて\n\tまるで　%a000090みたいな王妃さまね。\n@c0@"
44:
  de: "@aNera@bHast du diesen Schleim gesehen? Er hat den gleichen Ausdruck in den Augen wie die Monster, mit denen du dich angefreundet hast.\n@c0@"
  en: "@aNera@bDid you see that slime? He has the same kind of look in his eyes as the monsters you've befriended.\n@c0@"
  es: "@aNera@b¿Has visto ese limo? Tiene el mismo brillo en los occhi que los monstruos que se han hecho amigos tuyos.\n@c0@"
  fr: "@aNera@bTu as vu ce gluantⓡ Il a le même genre de regard que les monstres que tu as apprivoisés.\n@c0@"
  it: "@aNera@bHai notato?\nQuello Slime aveva lo stesso sguardo dei mostri che hai addomesticato...\n@c0@"
  ja: "@a@bフローラ「見てください　あのスライム…\n\tあなたが　つれている魔物と同じ\n\tすんだ目を　しているわ。\n@c0@"
45:
  de: "@aBianca@bSchade. Hier kommen wir offenbar nicht weiter.\n@c0@"
  en: "@aBianca@bThat's a shame. Dun't look like we're goin' to get any further this way.\n@c0@"
  es: "@aBianca@b¡Qué lástima! Parece que por este lado no vamos a avanzar más.\n@c0@"
  fr: "@aBianca@bDommage. On ne va pas pouvoir continuer par là, apparemment.\n@c0@"
  it: "@aBianca@bAh, che scalogna!\nDi qua non si passa!\n@c0@"
  ja: "@a@bビアンカ「あーあ　ざんねん。\n\tこの先は　一歩も\n\t通してくれそうにないわね。\n@c0@"
46:
  de: "@aNera@bNun ja. Dann müssen wir es eben anderswo versuchen.\n@c0@"
  en: "@aNera@bOh well. We'll just have to try somewhere else.\n@c0@"
  es: "@aNera@bVaya. Tendremos que probare por otro sitio.\n@c0@"
  fr: "@aNera@bBon, tant pis. Nous allons devoir essayer ailleurs.\n@c0@"
  it: "@aNera@bNon c'è problema.\nPasseremo da un'altra parte.\n@c0@"
  ja: "@a@bフローラ「しかたありませんわ。\n\tほかのところを　見てまわりましょう。\n@c0@"
47:
  de: "@aBianca@bZenithia erforschen, was? König Ludwig war jedenfalls ein Mann mit vielen Geheimnissen.\n@c0@"
  en: "@aBianca@bResearchin' Zenithia, eh? King Pankraz was certainly a man of many secrets.\n@c0@"
  es: "@aBianca@bInvestigando Zenithia, ¿eh? El rey Teudis tenía muchos secretos, eso está claro.\n@c0@"
  fr: "@aBianca@bDes recherches sur Zénithiaⓡ Le roi Petros était plein de mystère, c'est le moins qu'on puisse dire.\n@c0@"
  it: "@aBianca@bRussel doveva essere un vero cultore della storia del mondo, se ha ordinato a uno studioso di svolgere ricerche sul misterioso Castello di Zenithia...\n@c0@"
  ja: "@a@bビアンカ「天空の城のことまで\n\t研究させていたなんて……\n\tパパス王には　ヒミツが　多そうね。\n@c0@"
48:
  de: "@aNera@bWarum wohl König Ludwig Zenithia erforschen lassen wollte?\n@c0@"
  en: "@aNera@bI wonder why King Pankraz was carrying out research on Zenithia.\n@c0@"
  es: "@aNera@bMe pregunto por qué el rey Teudis estaba ricercando Zenithia.\n@c0@"
  fr: "@aNera@bJe me demande pourquoi le roi Petros faisait des recherches sur Zénithia.\n@c0@"
  it: "@aNera@bChissà come mai re Russel ordinò a quello studioso di effettuare ricerche su Zenithia...\n@c0@"
  ja: "@a@bフローラ「パパス王は　どうして\n\t天空の城の　研究をさせていたのか……\n@c0@"
49:
  de: "@aNera@bWenn wir das wüssten, dann könnten wir mit den Ergebnissen vielleicht etwas anfangen.\n@c0@"
  en: "@aNera@bIf only that were clear, then there might be a way of putting the results to good use.\n@c0@"
  es: "@aNera@bSi lo supiésemos quizá podríamos hacer buen uso de los resultados.\n@c0@"
  fr: "@aNera@bSi nous le savions, nous pourrions peut-être faire bon usage de ces renseignements.\n@c0@"
  it: "@aNera@bNon credo che l'abbia fatto per pura curiosità.\nDeve aver avuto dei buoni motivi per fargli una tale richiesta, non credi?\n@c0@"
  ja: "@a@bフローラ「それがわかれば\n\t研究の成果を　いかす方法も\n\tあると思うのですけど……。\n@c0@"
50:
  de: "@aBianca@bWeißt du, wie man das spielt?\n@c0@"
  en: "@aBianca@bDo you know how to play?\n@c0@"
  es: "@aBianca@b¿Sabes jugar a eso?\n@c0@"
  fr: "@aBianca@bTu sais y jouerⓡ\n@c0@"
  it: "@aBianca@bSai come si gioca?\n@c0@"
  ja: "@a@bビアンカ「ねえ　チェスって知ってる？\n@c0@"
51:
  de: "@aBianca@bWirklich? Wann hast du das denn gelernt? Ach ja, Ludwig hat's dir beigebracht, als du noch klein warst, stimmt's?\n@c0@"
  en: "@aBianca@bReally? When did you learn that? Oh right, Pankraz taught you when you were little, eh?\n@c0@"
  es: "@aBianca@b¿En serio? ¿Cuándo has aprendido? ¡Ah!, claro, Teudis te enseñó cuando eras un crío, ¿verdad?\n@c0@"
  fr: "@aBianca@bVraimentⓡ Mais quand as-tu apprisⓡ Oh, mais oui. Petros t'a appris ça quand tu étais petit, c'est çaⓡ\n@c0@"
  it: "@aBianca@bDavvero?\nScommetto che è stato tuo padre Russel a insegnartelo.\n@c0@"
  ja: "@a@bビアンカ「いつの間に　おぼえたの？\n\tそっか　小さい頃\n\tパパスさんが　教えてくれたのね。\n@c0@"
52:
  de: "@aBianca@bIch auch nicht. Ob es wohl wirklich so viel Spaß macht, wie alle sagen?\n@c0@"
  en: "@aBianca@bMe neither. I wonder if it's really as much fun as it's cracked up to be.\n@c0@"
  es: "@aBianca@bYo tampoco. Me pregunto si de verdad es tan divertido como lo pintan, ¿sabes?\n@c0@"
  fr: "@aBianca@bMoi non plus. Je me demande si c'est vraiment aussi drôle qu'on le dit.\n@c0@"
  it: "@aBianca@bNemmeno io.\nPerò ora mi è venuta voglia di imparare, visto che sembra tanto divertente!\n@c0@"
  ja: "@a@bビアンカ「そうよね。　私も知らないわ。\n\tそんなに　おもしろいゲームなのかな？\n@c0@"
53:
  de: "@aNera@bIch weiß noch, wie Mama und Papa es vor sehr langer Zeit mal gespielt haben. Aber mit den Regeln kenne ich mich leider nicht aus.\n@c0@"
  en: "@aNera@bI remember watching Mama and Papa play that a\r\nlong time ago. I'm afraid I've no idea what the rules are, though.\n@c0@"
  es: "@aNera@bRecuerdo que solía mirar a la mia mamma y al mio papino jugar a eso hace tiempo. Pero no tengo ni idea de las reglas.\n@c0@"
  fr: "@aNera@bJe me souviens que je regardais papa et mamma\r\ny jouer, il y a longtemps. Mais je ne connais pas du tout les règles.\n@c0@"
  it: "@aNera@bPurtroppo io non ci so giocare. Quando arrivai all'abbazia, avevano appena soppresso il corso di ⓕScaccologia applicataⓖ per mancanza di iscritti...\n@c0@"
  ja: "@a@bフローラ「昔　父と母が　やっているのを\n\t見ましたわ。　私には　ぜんぜん\n\tルールが　わからなかったけど……。\n@c0@"
54:
  de: "@aGriselda@bFür eine Burg wirkt es recht imposant.\n@c0@"
  en: "@aDebora@bIt's fairly impressive as castles go.\n@c0@"
  es: "@aStefania@bComo castello, es bastante impresionante.\n@c0@"
  fr: "@aPandora@bC'est assez impressionant pour un château.\n@c0@"
  it: "@aViola@bQuesto è uno dei castelli più belli che abbia mai visto...\n@c0@"
  ja: "@a@bデボラ「ずいぶん　立派なお城ね。\n@c0@"
55:
  de: "@aGriselda@bHier gibt es bestimmt Leute, die dich kennen. Los, gehen wir rein.\n@c0@"
  en: "@aDebora@bThere are probably people here who know you.\r\nLet's hurry up and go inside.\n@c0@"
  es: "@aStefania@bSicuro que aquí hay gente que te conoce.\r\nVamos a entrar, presto.\n@c0@"
  fr: "@aPandora@bIl y a sûrement ici des gens qui te connaissent. Dépêchons-nous d'entrer.\n@c0@"
  it: "@aViola@bProbabilmente qui ci sono persone che ti conoscono, o che quanto meno hanno sentito parlare di te.\nDai, entriamo...\n@c0@"
  ja: "@a@bデボラ「あんたのことを　知ってる人が\n\tいるかもしれないんでしょ？\n\tさっさと　中に　入りましょうよ。\n@c0@"
56:
  de: "@aGriselda@bIch kann's kaum erwarten, sein Gesicht zu sehen, wenn er herausfindet, wer du in Wirklichkeit bist!\n@c0@"
  en: "@aDebora@bI can't wait to see his face when he finds out who you really are!\n@c0@"
  es: "@aStefania@b¡No veo la hora de ver su cara cuando descubra quién eres veramente!\n@c0@"
  fr: "@aPandora@bJ'ai hâte de voir sa tête quand il découvrira\nqui tu es en réalitéⓠ\n@c0@"
  it: "@aViola@bQuesto soldatino da strapazzo ti parlerà in maniera ben diversa quando si saprà chi sei davvero!\n@c0@"
  ja: "@a@bデボラ「後で　あんたが　王族だって\n\tわかったときの顔が\n\t見ものだわね。\n@c0@"
57:
  de: "@aGriselda@bTja, es hat keinen Sinn, hier noch ewig herumzuhängen. Gehen wir weiter.\n@c0@"
  en: "@aDebora@bWell there's no point in just hanging around here forever. Let's move on.\n@c0@"
  es: "@aStefania@bNo tiene sentido quedarse aquí esperando. ¡Andiamo!\n@c0@"
  fr: "@aPandora@bBon, ça ne sert à rien de traîner ici éternellement. Allons-nous-en.\n@c0@"
  it: "@aViola@bFacciamo come dice lui, %a000090.\nAndiamo via.\n@c0@"
  ja: "@a@bデボラ「ほら　いつまでも\n\tここにいないで　さっさと\n\t別な場所へ　行くわよ。\n@c0@"
58:
  de: "@aGriselda@bIch glaube, mit der würde ich mich prima verstehen.\n@c0@"
  en: "@aDebora@bI think I could probably get on with her.\n@c0@"
  es: "@aStefania@bCredo que podría llevarme bene con ella.\n@c0@"
  fr: "@aPandora@bJe crois que je pourrais bien m'entendre avec elle.\n@c0@"
  it: "@aViola@bMi piace quella ragazza!\nHa grinta!\n@c0@"
  ja: "@a@bデボラ「あら　なんだか\n\t気のあいそうな　子ね。\n@c0@"
59:
  de: "@aGriselda@bWenn dieser Sancho ein Freund von dir ist, sollten wir ihn suchen gehen.\n@c0@"
  en: "@aDebora@bIf this Sancho's a friend of yours, we should go and hunt him out.\n@c0@"
  es: "@aStefania@bSi ese Sancho es amico tuyo, deberíamos ir en su busca.\n@c0@"
  fr: "@aPandora@bSi ce Sancho est l'un de tes amis, nous devrions essayer de le retrouver.\n@c0@"
  it: "@aViola@bSancho è un tuo amico, no?\nAllora dobbiamo assolutamente trovarlo.\n@c0@"
  ja: "@a@bデボラ「その　サンチョが　あんたの\n\t知り合いなら　会ってみれば？\n@c0@"
60:
  de: "@aGriselda@bInnerhalb der Burgmauern gibt es eine ganze Stadt. Es ist auf jeden Fall ein interessanter Ort.\n@c0@"
  en: "@aDebora@bThere's a whole town inside the castle walls.\r\nIt's quite an interesting place by all accounts.\n@c0@"
  es: "@aStefania@bDentro del castello hay una ciudad entera...\r\nEs molto interesante, no hay duda.\n@c0@"
  fr: "@aPandora@bIl y a une ville entière derrière les murailles du châtau. C'est vraiment un endroit intéressant\r\nà tous points de vue.\n@c0@"
  it: "@aViola@bIl castello contiene un'intera città!\nOooh!\nQuesto posto è favoloso!\n@c0@"
  ja: "@a@bデボラ「城の中に　町があるのね。\n\t変わってて　なかなか\n\t面白いところじゃない。\n@c0@"
61:
  de: "@aGriselda@bOb es hier wohl jemanden gibt, der dich noch kennt? Selbst wenn dir ihre Gesichter nichts sagen, könnten sie sich doch vielleicht an dich erinnern.\n@c0@"
  en: "@aDebora@bI wonder if there's anyone who knows you here.\r\nYou may not recognise them, but maybe they'll recognise you.\n@c0@"
  es: "@aStefania@bMe pregunto si alguien te conocerá aquí.\r\nVeramente, quizá alguien te reconozca, aunque tú no sepas quién es.\n@c0@"
  fr: "@aPandora@bJe me demande si quelqu'un te connaît, ici.\r\nPeut-être que toi tu ne les reconnaîtras pas\r\nmais qu'eux sauront qui tu es.\n@c0@"
  it: "@aViola@bForse qui c'è qualcuno che ti conosce...\nTu vedi qualche faccia nota in giro?\n@c0@"
  ja: "@a@bデボラ「この中に　あんたの知り合いは？\n\tこっちが知らなくても　向こうが\n\t知ってるかもしれないわよ。\n@c0@"
62:
  de: "@aGriselda@bIch bin müde nach all dieser Lauferei durch die Berge. Ich hätte nichts gegen eine kleine Rast.\n@c0@"
  en: "@aDebora@bI'm tired after all that trekking in the mountains.\r\nI wouldn't mind a bit of a rest.\n@c0@"
  es: "@aStefania@bDespués de tanto caminar por las montañas, sonno stanca.\r\nMe vendría bene un descansito, ¿capisci?\n@c0@"
  fr: "@aPandora@bJe suis fatiguée après cette randonnée dans la montagne. Je ne serais pas contre prendre\r\nun peu de repos.\n@c0@"
  it: "@aViola@bIl viaggio per arrivare qui mi ha lasciata senza forze.\nHo bisogno di riposo...\n@c0@"
  ja: "@a@bデボラ「山道を歩いたから　疲れたわ。\n\tとりあえず　どこかで　休みたいわね。\n@c0@"
63:
  de: "@aGriselda@bDas ist großartig! Hier kann man sogar im Regen noch einen Einkaufsbummel machen, ohne nass zu werden!\n@c0@"
  en: "@aDebora@bThis is great. You can even shop here in the rain without getting wet.\n@c0@"
  es: "@aStefania@b¡Benissimo! Hasta puedes salir de compras cuando llueve sin mojarte.\n@c0@"
  fr: "@aPandora@bC'est fantastique. Ici, on peut même faire les boutiques dans se faire mouiller par la pluie.\n@c0@"
  it: "@aViola@bMa è geniale!\nPensa! Si può andare a fare acquisti anche quando piove, tanto qui non ci si bagna!\n@c0@"
  ja: "@a@bデボラ「これなら　雨がふっても\n\tぬれずに　買い物ができるわね。\n@c0@"
64:
  de: "@aGriselda@bEs scheint dem Land nicht geschadet zu haben, dass es all die Jahre ohne König auskommen musste.\n@c0@"
  en: "@aDebora@bIt doesn't seem to have done the place any harm not having a king all these years.\n@c0@"
  es: "@aStefania@bSembra que no les ha afectado no tener un rey verdadero durante tanti anni.\n@c0@"
  fr: "@aPandora@bÇa ne semble pas avoir affecté la cité le moins du monde de ne pas avoir de roi pendant toutes ces années.\n@c0@"
  it: "@aViola@bMi sembra che il Regno di Denim non abbia risentito troppo della prolungata assenza del sovrano...\n@c0@"
  ja: "@a@bデボラ「何年も　王がいなくても\n\tこの国は　大丈夫だったのよね。\n@c0@"
65:
  de: "@aGriselda@bIch weiß wirklich nicht, warum sie sich die Mühe machen sollten, jemand anderen an seine Stelle zu setzen.\n@c0@"
  en: "@aDebora@bI don't really see the need for them to have bothered having someone take his place.\n@c0@"
  es: "@aStefania@bVeramente, no sé qué necesidad tienen de uno.\n@c0@"
  fr: "@aPandora@bJe ne vois vraiment pas quel besoin ils avaient de mettre quelqu'un à cette place.\n@c0@"
  it: "@aViola@bProbabilmente il Principe Reggente è una persona abile e capace, e ha saputo prendere in mano le redini del paese.\n@c0@"
  ja: "@a@bデボラ「なら　別にわざわざ\n\t誰かが　王位をつがなくても\n\tよかったんじゃないの？\n@c0@"
66:
  de: "@aGriselda@bIch weiß noch, wie Papa mir die Geschichte mal erzählt hat.\n@c0@"
  en: "@aDebora@bI remember Papa telling me that story once.\n@c0@"
  es: "@aStefania@bIl mio papino me había contado esa historia.\n@c0@"
  fr: "@aPandora@bJe me souviens que papa m'avait raconté\r\ncette histoire, un jour.\n@c0@"
  it: "@aViola@bIl mio paparino mi ha parlato di questo tal ⓕSir Gioielloⓖ.\n@c0@"
  ja: "@a@bデボラ「その名工の話は\n\tパパから　聞いたことがあるわ。\n@c0@"
67:
  de: "@aGriselda@bIch habe mir schon überlegt, ob ich ihn etwas für mich anfertigen lassen sollte. Ob sein Sohn wohl auch etwas taugt?\n@c0@"
  en: "@aDebora@bI thought about having him make me something.\r\nI wonder if his son's any good.\n@c0@"
  es: "@aStefania@bQuería que me hiciese algo.\r\n¿Será il figlio tan bueno como el padre?\n@c0@"
  fr: "@aPandora@bJ'avais envisagé de lui demander de faire quelque chose pour moi. Je me demande si son fils est doué.\n@c0@"
  it: "@aViola@bAvrei voluto farmi fare un bracciale o una collana da lui, ma purtroppo non è possibile...\n@c0@"
  ja: "@a@bデボラ「なんか作ってもらおうと\n\t思ったけど　息子じゃ\n\tあてにならないわね。\n@c0@"
68:
  de: "@aGriselda@bEr macht einen freundlichen und gefügigen Eindruck. Wenn er Glück hat, stelle ich ihn als Diener ein, wenn er alt genug ist.\n@c0@"
  en: "@aDebora@bHe seems nice and obedient. If he's lucky, I'll hire him as a servant when he's older.\n@c0@"
  es: "@aStefania@bParece gentile y obediente. A lo mejor tiene suerte y lo contrato de sirviente cuando sea mayor.\n@c0@"
  fr: "@aPandora@bIl a l'air gentil et obéissant. S'il a de la chance, je l'embaucherai comme domestique quand il sera\r\nplus grand.\n@c0@"
  it: "@aViola@bChe carino che è!\nGli auguro di riuscire a realizzare il suo sogno.\n@c0@"
  ja: "@a@bデボラ「あの子　従順そうだから\n\t大きくなったら　しもべにするのも\n\t悪くなさそうね。\n@c0@"
69:
  de: "@aGriselda@bDas ist der Grund, weshalb du weitermachen und den legendären Held finden musst.\n@c0@"
  en: "@aDebora@bThat's the reason why you have to get on and find the legendary hero.\n@c0@"
  es: "@aStefania@bPor eso tienes que ponerte en marcha y trobare al héroe legendario, ¿capisci?\n@c0@"
  fr: "@aPandora@bC'est pour ça qu'il faut que tu continues et que tu retrouves le héros légendaire.\n@c0@"
  it: "@aViola@bCaro, il mondo tornerà in pace solo se riusciremo a trovare l'Eroe Leggendario.\nNon possiamo fallire.\n@c0@"
  ja: "@a@bデボラ「そのためには　まずは\n\tあんたが　勇者とやらを\n\t見つけなければ　ならないのよね。\n@c0@"
70:
  de: "@aGriselda@bEr hat den Anblick wahrscheinlich herzlich satt. Meine Obergrenze wären drei Tage.\n@c0@"
  en: "@aDebora@bHe's probably sick of the sight of the place.\nThree days would be about my limit.\n@c0@"
  es: "@aStefania@bDebe de estar hasta il naso de este sitio.\r\nMi límite serían tres días, como máximo.\n@c0@"
  fr: "@aPandora@bIl a dû en avoir marre de voir cet endroit. Je crois que je ne pourrais pas tenir plus de trois jours, personnellement.\n@c0@"
  it: "@aViola@bMagari s'è stufato di frequentare sempre lo stesso posto ed è andato a fare un giro da qualche altra parte... Ogni tanto è bello variare, no?\n@c0@"
  ja: "@a@bデボラ「あきたんじゃないの？\n\t私なら　３日であきるわよ。\n@c0@"
71:
  de: "@aGriselda@bIch bezweifle es, dass dieser Sancho hier aufkreuzen wird. Wir sollten ihn woanders suchen gehen.\n@c0@"
  en: "@aDebora@bI doubt that Sancho character will turn up here.\r\nWe should go and look for him somewhere else.\n@c0@"
  es: "@aStefania@bNo creo que ese tal Sancho aparezca por aquí.\r\nDeberíamos ir a cercarlo a otra parte.\n@c0@"
  fr: "@aPandora@bÇa m'étonnerait que ce Sancho se montre par ici.\r\nOn devrait essayer de le chercher ailleurs.\n@c0@"
  it: "@aViola@bNon possiamo restare impalati ad aspettare Sancho... Chissà quando si farà rivedere da queste parti! Non credi sia meglio andare a cercarlo?\n@c0@"
  ja: "@a@bデボラ「ここで待ってても\n\tサンチョとかいう人は　来なさそうね。\n\t別の場所を　さがしてみるわよ。\n@c0@"
72:
  de: "@aGriselda@bNur knickrige zehntausend Goldmünzen für den, der den König findet?\n@c0@"
  en: "@aDebora@bOnly a measly ten thousand gold coins for whoever finds the King?\n@c0@"
  es: "@aStefania@b¿Diez mil míseras monete de oro para el que encuentre al Rey?\n@c0@"
  fr: "@aPandora@b10000 malheureuses pièces d'or pour qui\nretrouvera le roiⓡ\n@c0@"
  it: "@aViola@bAppena diecimila monete di ricompensa per chi ritroverà il Re di Denim?!\n@c0@"
  ja: "@a@bデボラ「国王を見つけたほうびが\n\tたった　１００００ゴールド？\n@c0@"
73:
  de: "@aGriselda@bDas ist doch ein Bettel! Für die paar Kröten würde ich jedenfalls nicht losziehen und ihn suchen.\n@c0@"
  en: "@aDebora@bThat's nothing! I certainly couldn't be bothered to go looking for him for that paltry reward.\n@c0@"
  es: "@aStefania@b¡Eso no es niente! Por esa porquería de recompensa no me sale a cuenta ponerme a buscar...\n@c0@"
  fr: "@aPandora@bÇa n'est rien du toutⓠ Je ne m'ennuierais sûrement pas à partir à sa recherche pour une récompense aussi misérable.\n@c0@"
  it: "@aViola@bIl mio paparino diede molto di più alla persona che gli riportò Bingo quella volta che quel sacco di pulci perse la strada di casa!\n@c0@"
  ja: "@a@bデボラ「安すぎて　私なら\n\tさがす気も　うせるわ。\n@c0@"
74:
  de: "@aGriselda@bWarum wollen manche Leute unbedingt in der Vergangenheit leben? Das ist der Grund, weshalb ich alte Leute immer so nervtötend finde.\n@c0@"
  en: "@aDebora@bWhy do some people have to insist on living in the past? This is why I always find old folk so annoying.\n@c0@"
  es: "@aStefania@b¿Por qué hay personas que insisten en vivere en el pasado? Es lo que me asquea de los viejos.\n@c0@"
  fr: "@aPandora@bPourquoi certaines personnes s'obstinent-elles à vivre dans le passéⓡ C'est pour ça que je trouve les vieux aussi ennuyeux.\n@c0@"
  it: "@aViola@bNon può continuare a vivere nel passato!\nRe Russel non tornerà più!\nQuell'uomo dovrebbe farsene una ragione...\n@c0@"
  ja: "@a@bデボラ「いつまでも　昔のことばかり\n\tうじうじと……。　これだから\n\t年寄りって　イヤなのよね。\n@c0@"
75:
  de: "@aGriselda@bEs sollte für einen König doch wichtiger sein, einen Realitätssinn zu entwickeln als dauernd seinen Träumen nachzuhängen!\n@c0@"
  en: "@aDebora@bI should think it's more important for a king to be realistic than to be forever chasing dreams.\n@c0@"
  es: "@aStefania@bYo creo que un rey debe ser realista, no pasarse la vita persiguiendo quimeras.\n@c0@"
  fr: "@aPandora@bÀ mon avis, il est plus important pour un roi d'être réaliste que de poursuivre des chimères en permanence.\n@c0@"
  it: "@aViola@bTuo padre era sicuramente una persona straordinaria.\n㈡\nÈ commovente sentire con quanto affetto i sudditi di Denim lo ricordano dopo tanti anni dalla suia scomparsa...\n@c0@"
  ja: "@a@bデボラ「私は　夢を追いかけてるより\n\t現実的なほうが\n\t王に向いてると思うけど。\n@c0@"
76:
  de: "@aGriselda@bIch glaube, sie war wahrscheinlich Zenithianerin. Ich hab mal in einem von Papas Büchern ein Bild von einer Zenithianerin gesehen.\n@c0@"
  en: "@aDebora@bI think she was probably a Zenithian. I saw a picture of one before in a book of Papa's.\n@c0@"
  es: "@aStefania@bCredo que la signora debía de ser de Zenithia. Es por una imagen que vi una vez en un libro del mio papino.\n@c0@"
  fr: "@aPandora@bC'était probablement une Zénithienne. J'ai vu un jour une image de ces gens dans l'un des livres de papa.\n@c0@"
  it: "@aViola@bQuella donna è una Zenithiana! Una volta ho visto l'immagine di un'abitante di Zenithia su uno dei libri del mio paparino, ed era identica a lei!\n@c0@"
  ja: "@a@bデボラ「この人　多分　天空人ね。\n\tパパの持ってた本に\n\t書いてあったもの。\n@c0@"
77:
  de: "@aGriselda@bWas kann eine Zenithianerin denn wohl hierher nach Humburg verschlagen haben?\n@c0@"
  en: "@aDebora@bI wonder what a Zenithian would be doing here in Gotha.\n@c0@"
  es: "@aStefania@bMa qué hará alguien de Zenithia en Pankraz.\n@c0@"
  fr: "@aPandora@bJe me demande ce qu'une Zénithienne\r\npouvait bien faire à Gotha.\n@c0@"
  it: "@aViola@bMa cosa ci farà una Zenithiana a Denim?!\n@c0@"
  ja: "@a@bデボラ「それで　その天空人が\n\tこの城に　何の用が　あったわけ？\n@c0@"
78:
  de: "@aGriselda@bDann bist du also nicht der Einzige, der sich mit Monstern anfreunden kann.\n@c0@"
  en: "@aDebora@bSo you're not the only one who can befriend monsters then.\n@c0@"
  es: "@aStefania@bAsí que no eres el único que puede hacerse amico de los monstruos.\n@c0@"
  fr: "@aPandora@bAlors tu n'es pas le seul capable d'apprivoiser\r\ndes monstres.\n@c0@"
  it: "@aViola@bChissà chi ha addomesticato quello Slime...\n㈡\nDev'essere stato qualcuno dotato del tuo stesso potere di stringere amicizia con i mostri, su questo non c'è dubbio.\n@c0@"
  ja: "@a@bデボラ「あんただけじゃ　ないんだね。\n\t魔物を　飼いならすことができるのは。\n@c0@"
79:
  de: "@aGriselda@bDie Soldatenquartiere starren wahrscheinlich ohnehin vor Dreck. Da drin gibt es nichts, was uns interessieren könnte.\n@c0@"
  en: "@aDebora@bThe soldiers' quarters are bound to be filthy anyway. Nothing in there of interest to us.\n@c0@"
  es: "@aStefania@bSicuro que las dependencias de los soldati están muy sucias. No habrá nada de interés allí.\n@c0@"
  fr: "@aPandora@bLes quartiers des soldats sont toujours dégoûtants, de toute façon. Il n'y a rien d'intéressant pour nous, là-dedans.\n@c0@"
  it: "@aViola@bNon importa, caro.\nNon credo che avremmo trovato niente di interessante lì dentro...\n@c0@"
  ja: "@a@bデボラ「兵士の宿舎なんて\n\tむさくるしいだけよ。\n\t見ても仕方ないわ。\n@c0@"
80:
  de: "@aGriselda@bDas kann er doch sicher selbst herausfinden statt herumzujammern.\n@c0@"
  en: "@aDebora@bSurely he can figure that out for himself rather than just moaning about it.\n@c0@"
  es: "@aStefania@bSicuro que lo puede averiguar él solo en lugar de tanto quejarse.\n@c0@"
  fr: "@aPandora@bIl doit pouvoir trouver la réponse tout seul, au lieu de se plaindre de ça.\n@c0@"
  it: "@aViola@bAl posto suo proseguirei. Un lavoro lasciato a metà non serve a nessuno, mentre se lo finisse prima o poi potrebbe tornare utile per qualche scopo...\n@c0@"
  ja: "@a@bデボラ「グチを言う前に\n\tいかす方法でも　考えなさいよね。\n@c0@"
81:
  de: "@aGriselda@bMama und Papa haben das oft gespielt. Mich hat es nie interessiert.\n@c0@"
  en: "@aDebora@bMama and Papa used to play that a lot.\nI was never interested myself.\n@c0@"
  es: "@aStefania@bLa mia mamma e il mio papino solían jugar mucho a eso.\r\nA mí nunca me ha interesado.\n@c0@"
  fr: "@aPandora@bMamma et papa y jouaient souvent autrefois.\r\nMais ça ne m'a jamais intéressé.\n@c0@"
  it: "@aViola@bIo non so giocare a scacchi.\nLe regole sono molto complicate, e non ho intenzione di farmi venire il mal di testa per impararle...\n@c0@"
  ja: "@a@bデボラ「よく　パパとママが\n\tやっていたわね。\n\t私は　きょうみが　なかったけど。\n@c0@"
