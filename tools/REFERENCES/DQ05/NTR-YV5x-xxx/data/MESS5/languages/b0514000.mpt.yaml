  ja: "@a@bビアンカ「うす暗い物置って\n\tちょっと　不気味だよね。\n@c0@"
30:
  de: "@aNera@bHier also werden die Stücke gelagert, die nicht ausgestellt werden.\n@c0@"
  en: "@aNera@bSo this is where the exhibits that aren't on display are kept.\n@c0@"
