  it: "@aViola@bDa dove arriverà quell'uomo?\nSei riuscito a capirlo, caro?\n@c0@"
  ja: "@a@bデボラ「この人　どこの国の人よ？\n@c0@"
144:
  de: "@aGriselda@bSo wie die aussieht? Unwahrscheinlich!\n@c0@"
