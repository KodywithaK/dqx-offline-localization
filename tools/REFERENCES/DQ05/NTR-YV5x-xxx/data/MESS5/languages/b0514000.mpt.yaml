  ja: "@a@b%a001250「ここのお部屋って\n\t誰かが　階段を使ったら\n\t足音とか聞こえそう。\n@c0@"
39:
  de: "@aSancho@bDieses Zimmer, es ist leisst sauber zu halten, no? Sí, dein Onkel Sancho, der kennt siss mit diesen Dingen aus.\n@c0@"
  en: "@aSancho@bThees room, ees easy to clean, eh? Sí, your Uncle Sancho, he knows about esuch theengs.\n@c0@"
  es: "@aSancho@bEsta habitación es bien fácil de limpiar. Bueno, el tito Sancho sabe de eso, chequeaba si los sirvientes limpiaban bien.\n@c0@"
  fr: "@aSancho@bCette p-p-pièce est f-facile à nettoyer, noⓡ\nTonton Sancho s'y connaît pour ce genre de choses.\n@c0@"
  it: "@aSancho@bA primera vista, esta estanza sembra muy facil da pulire...\n¡Fidate, chico: lo zio Sancho se ne intiende!\n@c0@"
  ja: "@a@bサンチョ「じつに　かたづけやすそうな\n\tお部屋ですね。\n\tおそうじが　らくなことでしょう。\n@c0@"
40:
  de: "@aOtto@bHier drin sieht's ja wirklich tipptopp aus, net wahr? Alles an seinem Platz, und nichts fliegt herum.\n@c0@"
  en: "@aTuppence@bEverything in this room certainly seems to be shipshape and Bristol fashion, eh?\r\nNothing in here that shouldn't be.\n@c0@"
  es: "@aAlazar@bTodo aquí parece marinero y austero, ¿no?\r\nNi una cosa de adorno.\n@c0@"
  fr: "@aInnocent@bTout est parfaitement en ordre et à sa place,\ndans cette pièce, heinⓡ Rien ne dépasse.\n@c0@"
  it: "@aSimon@bCarina, questa stanza.\nPersonalmente l'avrei arredata in modo diverso, ma anche così ha un suo fascino...\n@c0@"
  ja: "@a@bピピン「むだな物が　見事なまでに\n\tいっさい　おいてない部屋ですね。\n@c0@"
41:
  de: "@aBianca@bEs ist ein bisschen unheimlich nachts im Museum, aber es hat irgendwie auch was ganz Besonderes.\n@c0@"
  en: "@aBianca@bIt's a bit scary bein' in a museum of a night, but it's got a special sort of feel to it too.\n@c0@"
  es: "@aBianca@bEl museo de noche da bastante miedo, pero también es bastante especial, ¿sabes?\n@c0@"
  fr: "@aBianca@bC'est un peu effrayant d'être dans un musée la nuit, mais ça donne aussi une impression particulière.\n@c0@"
  it: "@aBianca@bDi notte il Museo ha un'atmosfera un po' sinistra, ma è ancora più affascinante che di giorno...\n@c0@"
  ja: "@a@bビアンカ「夜の博物館って\n\tちょっとこわいけど\n\t幻想的で　ステキね。\n@c0@"
42:
  de: "@aNera@bNachts ist es hier sogar noch stiller, nicht?\n@c0@"
  en: "@aNera@bIt's even quieter at night, isn't it?\n@c0@"
  es: "@aNera@bPer la notte es aún más tranquilo, ¿verdad?\n@c0@"
  fr: "@aNera@bTout est encore plus tranquille de nuit,\ntu ne trouves pasⓡ\n@c0@"
  it: "@aNera@bChe silenzio...\n@c0@"
  ja: "@a@bフローラ「夜になると　よりいっそう\n\t静かになりますね。\n@c0@"
43:
  de: "@a%0%a001240@bMitten in der Nacht sehen die Sachen ganz anders aus, findest du nicht?\n@c0@"
  en: "@a%0%a001240@bThe exhibits look different in the middle of the night, don't they?\n@c0@"
  es: "@a%0%a001240@bLas cosinas tienen un aspecto diferente en mitad de la noche, ¿a que sí?\n@c0@"
  fr: "@a%0%a001240@bLes objets exposés ont l'air différents de nuit,\nhein, papaⓡ\n@c0@"
  it: "@a%0%a001240@bCon l'oscurità i souvenir esposti sembrano diversi rispetto a quando sono illuminati dalla luce del sole...\n@c0@"
  ja: "@a@b%a001240「夜中に見る名産品は\n\tお昼に見るときとは\n\tちがう感じが　するんだ。\n@c0@"
44:
  de: "@a%0%a001250@bJetzt würde ich mir die gruseligen Sachen aber nicht gern ansehen!\n@c0@"
  en: "@a%0%a001250@bI wouldn't like to look at any of the scary\nexhibits now!\n@c0@"
  es: "@a%0%a001250@bAhora mismo no miraría las cosinas terroríficas ni en broma.\n@c0@"
  fr: "@a%0%a001250@bJe n'aimerais pas avoir à regarder un des objets effrayants, là, tout de suiteⓠ\n@c0@"
  it: "@a%0%a001250@bNon ho nessuna intenzione di guardare i souvenir spaventosi in questo momento!\nDi notte devono essere ancor più terrificanti!\n@c0@"
  ja: "@a@b%a001250「この状態で　こわい名産品は\n\tあまり見たくないな……。\n@c0@"
45:
  de: "@aSancho@bJetzt, in der Nacht, fühlt es siss für miss noch mehr so an. Dass du wirkliss der Kurator bist, meine iss, Chico.\n@c0@"
  en: "@aSancho@bNow we are een the place at night, I feel eet even more. That you are really the curator\r\nnow, friend.\n@c0@"
  es: "@aSancho@bAhora que es de noche pues lo siento con más fuerza. Eres el gestor, chamaco.\n@c0@"
  fr: "@aSancho@bMaintenant que nous s-s-sommes dans cet endroit\r\nla nuit, je le sens encore plus, chico. C'est vraiment t-t-toi le conservateur.\n@c0@"
  it: "@aSancho@bEstare nel Museo de noche es un privilegios riservato solo al direttore y a los suos amigos...\n¡Eh eh eh!\n@c0@"
  ja: "@a@bサンチョ「こうして　夜中の博物館にいると\n\tあらためて　%a000090王が博物館の\n\t館長になられたんだと　実感しますよ。\n@c0@"
46:
  de: "@aOtto@bJeder Schritt hallt nachts durch das ganze Gebäude, net wahr? Es ist... nun, es ist direkt ein wenig unheimlich!\n@c0@"
  en: "@aTuppence@bEvery step you take echoes through the whole place at night, doesn't it? It's... Well, it's a bit scary!\n@c0@"
  es: "@aAlazar@bTodos los pasos retumban por la noche, ¿verdad? Es... Bueno, da un poco de miedo.\n@c0@"
  fr: "@aInnocent@bLa nuit, le moindre bruit de pas semble résonner dans tout le bâtiment. Ça, euh... eh bien, ça fiche un peu la trouilleⓠ\n@c0@"
  it: "@aSimon@bDi notte non si sente altro rumore se non quello dei nostri passi, che riecheggiano sinistri nella cupa oscurità del Museo! Eh eh eh! Paura, eh?\n@c0@"
  ja: "@a@bピピン「夜の博物館って　やけに\n\t足音がひびいて　こわいですね……。\n@c0@"
47:
  de: "@aGriselda@bAlso, wenn du unbedingt diesen ganzen Firlefanz-Unfug mitmachen musst, dann von mir aus. Aber das Saubermachen und so weiter ist deine Sache, klar?\n@c0@"
  en: "@aDebora@bIf you must pursue all this knick-knack nonsense,\r\nI suppose I'll allow it. But all the cleaning and polishing and things will be completely down to you, got it?\n@c0@"
  es: "@aStefania@bSi de verdad quieres dedicarte a estas cosinas\ntendré que permitirlo. Ma todo eso de limpiar y abrillantar es cosa tuya, ¿capisci?\n@c0@"
  fr: "@aPandora@bSi tu dois vraiment continuer cette absurdité de Galericabrac, soit, je donnerai mon accord.\n㈡\nMais toutes ces histoires de nettoyage, polissage et autres, c'est toi qui t'en chargeras, c'est clairⓡ\n@c0@"
  it: "@aViola@bSe proprio ci tieni a occuparti del Museo del Souvenir, ti concederò di farlo. Ovviamente, non dovrai sottrarre nemmeno un secondo a me.\n㈡\nInoltre, che non ti salti per la testa l'idea che io ti aiuti a lucidare queste cianfrusaglie!\nMi sono spiegata?!\n@c0@"
  ja: "@a@bデボラ「そうじとか　めんどうな仕事は\n\t全部　%a000090が　やってよね。\n@c0@"
48:
  de: "@aGriselda@bJetzt sagt er, wir haben freie Hand, aber wollen wir wetten, dass er sich bei jeder möglichen und unmöglichen Gelegenheit einmischt? Hmpf. Männer!\n@c0@"
  en: "@aDebora@bHe says we can do things how we want now, but I get the feeling he's going to be sticking his oar in at every available opportunity. Hmph. Men!\n@c0@"
  es: "@aStefania@bDice que ahora podemos hacer las cosas como queramos, ma tengo la sensazione de que no va a dejar de meter el naso a la menor ocasión.\n㈡\nMmm. ¡Hombres!\n@c0@"
  fr: "@aPandora@bPour l'instant, il dit qu'on peut faire les choses comme on veut, mais j'ai l'impression qu'il va venir fourrer son nez dans nos affaires à la moindre occasion.\n㈡\nMmpf. Ah, les hommesⓠ\n@c0@"
  it: "@aViola@bGeremia ha detto che possiamo gestire il Museo come meglio crediamo, ma ho il sospetto che interferirà con le nostre decisioni spesso e volentieri!\n@c0@"
  ja: "@a@bデボラ「自由にって　いいながら\n\tいちいち　クチだしてきそうね。\n\tふゆかいだわ。\n@c0@"
49:
  de: "@aGriselda@bWie teuer ist eigentlich der Eintritt? Ich wette, er ist viel zu hoch.\n@c0@"
  en: "@aDebora@bHow much is the entrance fee, actually?\nI bet this place is seriously overpriced.\n@c0@"
  es: "@aStefania@b¿Cuánto cuesta la entrada? Apuesto a que este sitio está más que sovraprezzato.\n@c0@"
  fr: "@aPandora@bÀ ce propos, c'est combien, l'entréeⓡ Je parie que c'est bien trop cher pour un endroit pareil.\n@c0@"
  it: "@aViola@bChissà quanto costa il biglietto d'ingresso al Museo del Souvenir... Secondo me Geremia fa pagare caro l'accesso alla sua preziosa collezione.\n@c0@"
  ja: "@a@bデボラ「そういえば　ここって\n\t入場料が　いくらなの？\n@c0@"
50:
  de: "@aGriselda@bEndlich! Wie lange braucht denn heutzutage ein Gespenst, um eine Wache anzuheuern? Ewigkeiten, so wie's aussieht!\n@c0@"
  en: "@aDebora@bFinally! How long does it take a ghost to woo a guard these days anyway? Too long, it seems!\n@c0@"
  es: "@aStefania@bVeramente, no sé quién es más fantasma el guardia o el abuelo...\n@c0@"
  fr: "@aPandora@bPas trop tôtⓠ Mais ça prend combien de temps à un fantôme, de nos jours, pour attirer un gardienⓡ Bien trop longtemps, apparemmentⓠ\n@c0@"
  it: "@aViola@bSperiamo che Geremia abbia assunto un tipo in gamba per fare la guardia al Museo.\n㈡\nAnche se non capisco chi potrebbe mai voler rubare queste cianfrusaglie...!\n@c0@"
  ja: "@a@bデボラ「やっと　警備の人を\n\tやとったのね。\n\tちょっと　遅いくらいよ。\n@c0@"
51:
  de: "@aGriselda@bTja, im Vergleich zu dem alten Wischiwaschi-Plappermaul, das bisher an der Rezeption war, ist das sicher ein Fortschritt.\n@c0@"
  en: "@aDebora@bWell it'll be a step up from having that wishy-washy old blabbermouth on reception, that's for sure.\n@c0@"
  es: "@aStefania@bVa bene, es mejor que tener a ese vecchio charlatán y chismoso en recepción, eso seguro.\n@c0@"
  fr: "@aPandora@bÇa sera un gros progrès, c'est certain. Bien mieux que d'avoir ce vieux bavard transparent à l'accueil.\n@c0@"
  it: "@aViola@bUn'addetta alla reception?\nNon so chi sia, ma sarà sempre meglio che essere accolti da quella mummia ambulante di Geremia!\n@c0@"
  ja: "@a@bデボラ「たしかに　あのじいさんが\n\tうけつけにいるよりは\n\tだいぶ　ましよね。\n@c0@"
52:
  de: "@aGriselda@bWarum wollen Männer immer bloß junge Frauen einstellen? Mit Papa ist es genau dasselbe. Ich verstehe einfach nicht, was sie daran so gut finden.\n@c0@"
  en: "@aDebora@bWhy do men always want to take on young women when they're recruiting? Papa's the same. I just can't see the attraction.\n@c0@"
  es: "@aStefania@b¿Por qué los hombres siempre quieren contratar mujeres? Il mio papino es igual. No le veo la gracia.\n@c0@"
  fr: "@aPandora@bPourquoi faut-il que les hommes cherchent toujours des jeunes femmes quand ils font du recrutementⓡ Papa est pareil. Je ne vois vraiment pas l'intérêt.\n@c0@"
  it: "@aViola@bⓕUn gran bel tocco di figliolaⓖ?!\n㈡\nNon oso nemmeno pensare che Geremia possa avere qualche interesse extra-professionale per una donna più giovane di lui di un centinaio d'anni o due!\n@c0@"
  ja: "@a@bデボラ「パパもだけど　どうして\n\t男って　若い娘を\n\tやといたがるのかしらね。\n@c0@"
53:
  de: "@aGriselda@bAber was im Namen der Göttin sieht sie denn bloß in all diesem... Krempel?!\n@c0@"
  en: "@aDebora@bBut what in the name of the Goddess does she see in all this...this junk!?\n@c0@"
  es: "@aStefania@bEn el nombre de la Diosa, ¿qué ve en tutta... en tutta esta chatarra?\n@c0@"
  fr: "@aPandora@bMais au nom de la Déesse, que peut-elle bien voir dans tout ce... fatrasⓡⓐ\n@c0@"
  it: "@aViola@bUn'appassionata di antichità?!\nMa cosa ci troverà in quest'ammasso di paccottiglia?!\n@c0@"
  ja: "@a@bデボラ「あんなものに　きょうみがあるって\n\tこの娘　ふしぎな娘ね。\n@c0@"
54:
  de: "@aGriselda@bNa, die überschlägt sich ja fast vor Begeisterung. Wenn Papa sie hören könnte, würde er sie auf der Stelle abwerben.\n@c0@"
  en: "@aDebora@bWell, she's full of it, isn't she? ...Enthusiasm, I mean. Papa would snap her up in an instant if he saw her in action.\n@c0@"
  es: "@aStefania@bBueno, está bien llena, ¿no? De passione, quiero decir. Si il mio papino la viera en acción, contrataría sus servicios al instante.\n@c0@"
  fr: "@aPandora@bEh bien, elle en est vraiment pleine, nonⓡ\n... D'enthousiasme, je veux dire. S'il la voyait en action, papa lui sauterait dessus tout de suite.\n@c0@"
  it: "@aViola@bCerto che Sue è davvero professionale sul lavoro...\nSe mio padre la vedesse in azione, le offrirebbe subito di lavorare per lui!\n@c0@"
  ja: "@a@bデボラ「元気な娘ね。\n\tパパが見たら　気に入りそう。\n@c0@"
55:
  de: "@aGriselda@bSelber ⓞhaaachⓟ, alter Mann! Vielleicht kommt ja nur deswegen keiner, weil sich alle vor deinem Gestöhne graulen!\n@c0@"
  en: "@aDebora@bⓗHaaaⓘ to you too, old man. Maybe you haven't got any visitors because you're so haaard to please!\n@c0@"
  es: "@aStefania@bYa te daré yo motivos para decire: ⓕAaayⓖ. ¡Quizá no tengas visitantes porque no hay quien te contente!\n@c0@"
  fr: "@aPandora@bⓥAaahⓦ toi-même, vieux bonhomme.\nPeut-être que tu n'as aucun visiteur parce que\ntu es trop difficile aaah satisfaireⓠ\n@c0@"
  it: "@aViola@bⓕAcci e poi dentiⓖ a lui, vecchia mummia che non è altro! Non ho mai conosciuto una persona più lamentosa di Geremia!\n@c0@"
  ja: "@a@bデボラ「ロコツに　ため息を\n\tついてくれるわね。\n@c0@"
56:
  de: "@aGriselda@bFür wen hält der sich?! Komm, wir suchen ihm was, was er ausstellen kann, damit er endlich den Mund hält.\n@c0@"
  en: "@aDebora@bWho does he think he is? Come on, let's find something to put on display just to shut him up!\n@c0@"
  es: "@aStefania@b¿Quién se cree que es? ¡Vamos, encontremos algo para mostrare y así cerrarle la boca!\n@c0@"
  fr: "@aPandora@bIl se prend pour quiⓡ Viens, trouvons quelque chose à exposer, rien que pour lui clouer le becⓠ\n@c0@"
  it: "@aViola@bForza, andiamo a cercare qualche souvenir degno di essere esposto nel Museo, così se ne starà zitto almeno per un po'!\n@c0@"
  ja: "@a@bデボラ「バカにされてるようで\n\t腹立たしいから　さっさと\n\tなんか　かざるわよ！\n@c0@"
57:
  de: "@aGriselda@bDenk nach, bevor du irgendwas an den falschen Platz stellst. Es ist lästig, das Zeug noch groß rumschleppen zu müssen.\n@c0@"
  en: "@aDebora@bIt'll be a real pain having to lug things around if you put them in the wrong places. Think it through before you do anything.\n@c0@"
  es: "@aStefania@bVa a ser una pesadez mover las cosinas si no las pones donde corresponde. Piénsatelo bene antes de hacer nada.\n@c0@"
  fr: "@aPandora@bÇa risque d'être pénible de trimballer les objets d'un endroit à un autre si tu les places au mauvais endroit. Réfléchis avant de faire quoi que ce soit.\n@c0@"
  it: "@aViola@bCaro, pensa bene a cosa fai: arricchire la collezione del Museo non è un gioco da ragazzi...\nCi vorranno impegno e dedizione.\n@c0@"
  ja: "@a@bデボラ「あとで　ずらすのが\n\tめんどうなら　ならべ方も　最初から\n\t考えておいた方が　いいわよ。\n@c0@"
58:
  de: "@aGriselda@bKeiner wird diese winzige Insel mitten im Nirgendwo besuchen wollen. Aber wir können wohl noch ein Weilchen bleiben.\n@c0@"
  en: "@aDebora@bNo one's going to come to a tiny island stuck out in the middle of nowhere like this. But I suppose it'd be alright to stay here a bit longer.\n@c0@"
  es: "@aStefania@bNadie va a venir a una piccola isla en medio de ningún sitio. Pero supongo que no pasa niente por estar aquí un poco más.\n@c0@"
  fr: "@aPandora@bPersonne ne viendra jamais sur une île minuscule comme celle-là, perdue au milieu de nulle part.\r\nMais on peut rester encore un peu quand même.\n@c0@"
  it: "@aViola@bCi vorrebbe un miracolo per far arrivare frotte di visitatori su quest'isoletta sperduta, ma chissà che con qualche souvenir in più non ci si riesca...\n@c0@"
  ja: "@a@bデボラ「こんな　ヘンピな島に\n\t人が来るとは　思えないけど。\n\t期待しないで　まっててあげるわ。\n@c0@"
59:
  de: "@aGriselda@bHatte er nicht gesagt, wir könnten ausstellen, was wir wollen? Für ein Gespenst hat er ganz schön starre Ansichten, was?\n@c0@"
  en: "@aDebora@bWasn't he the one who said we could display whatever we wanted? He's very opinionated for a ghost, isn't he?\n@c0@"
  es: "@aStefania@b¿No era él quien dijo que podíamos exponer lo que quisiéramos? Es un tanto ostinato para ser un fantasma, ¿no?\n@c0@"
  fr: "@aPandora@bCe n'est pas lui qui a dit qu'on pouvait exposer tout ce qu'on voulait, par hasardⓡ Il a des idées plutôt arrêtées, pour un fantôme, nonⓡ\n@c0@"
  it: "@aViola@bMa non aveva detto che avevamo la piena libertà di esporre ciò che volevamo? Pare che il nostro Geremia cambi idea piuttosto facilmente...\n@c0@"
  ja: "@a@bデボラ「好きに　かざれって言ったのは\n\tじいさんじゃないの。\n\tいちいち　文句が　多いわね！\n@c0@"
