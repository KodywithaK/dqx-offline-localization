  es: "@aStefania@bÈ vero. Il mondo es peculiar.\n@c0@"
  fr: "@aPandora@bC'est très vrai. Le monde est facinant.\n@c0@"
  it: "@aViola@bSenti che idea geniale che m'è venuta!\n㈡\nPotremmo aprire un'agenzia di viaggi dove i visitatori del Museo potrebbero acquistare vacanze culturali nei paesi dove sono stati creati i souvenir!\n@c0@"
  ja: "@a@bデボラ「言われてみると　これだけ\n\t世界には　変わったものが\n\tあるのよね。\n@c0@"
148:
