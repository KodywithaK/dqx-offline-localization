62:
  de: "@aGriselda@bSo viel Gemecker von einem einzigen Geist! Ich wünschte, jemand würde ihn und seinen kostbaren Firlefanz in einen Sarg werfen, wo sie hingehören.\n@c0@"
  en: "@aDebora@bMy Goddess! How much complaining can one ghost do? I wish someone would chuck him and his precious knick-knacks in a coffin where they belong.\n@c0@"
  es: "@aStefania@b¡Dea mía! ¿Ma cuánto puede quejarse un fantasma? Ojalá alguien lo metiera a él y a sus preciosas cosinas en un ataúd, que es su sitio.\n@c0@"
  fr: "@aPandora@bQu'est-ce que ça peut se plaindre, un fantômeⓠ Si seulement quelqu'un pouvait le balancer, lui et ses précieux objets, dans un cercueil bien hermétique.\n@c0@"
  it: "@aViola@bSanto cielo! Ma quanto si lamenta Geremia?!\nAvrei quasi voglia di prendere un paio di souvenir belli pesanti e tirarglieli sulla zucca!\n@c0@"
  ja: "@a@bデボラ「ホント　文句ばっかり\n\t多いじいさんね！！\n@c0@"
63:
  de: "@aGriselda@bSo! Mir reicht's! Jetzt kriegt er jeden nur erdenklichen Firlefanz in der Welt vorgesetzt, damit er nichts mehr zu meckern hat!\n@c0@"
  en: "@aDebora@bRight! That's it! It's time we gathered every knick-knack and souvenir in the world, so he won't have anything more to grumble about.\n@c0@"
  es: "@aStefania@b¡Vale! ¡Ya está! Hay que reunir todas las cosinas y souvenirs d'il mondo, para que no tenga de qué quejarse.\n@c0@"
  fr: "@aPandora@bBonⓠ Ça suffitⓠ Il est grand temps de rassembler tous les objets et les souvenirs du monde entier pour qu'il arrête définitivement de nous casser les pieds.\n@c0@"
  it: "@aViola@bTemo che l'unico modo per ridurre al silenzio quel vecchio brontolone sia trovare tutti i souvenir del mondo.\n㈡\nSarà una faticaccia immensa, ma almeno non potrà più lamentarsi!\n@c0@"
  ja: "@a@bデボラ「ああ言われると\n\t早く集めて　じいさんに\n\tギャフンと　言わせたくなるわね！\n@c0@"
64:
  de: "@aGriselda@bFür wen hält der sich?! So mit mir zu reden!\n@c0@"
  en: "@aDebora@bJust who does he think he is, talking to me like that?\n@c0@"
  es: "@aStefania@bMa, ¿quién se cree que es, hablándome de ese modo?\n@c0@"
  fr: "@aPandora@bMais il se prend pour qui, à me parler comme çaⓡ\n@c0@"
  it: "@aViola@bArgh!\nOdio quando qualcuno mi dà degli ordini!\n@c0@"
  ja: "@a@bデボラ「ずいぶん　えらそうな\n\tクチのきき方してくれるじゃない！\n@c0@"
65:
  de: "@aGriselda@bMir erteilt keiner Befehle! Und ein Gespenst schon mal gar nicht!\n@c0@"
  en: "@aDebora@bNo one gives me orders! Especially not a ghost!\n@c0@"
  es: "@aStefania@b¡Nadie me da órdenes! ¡Y menos un fantasma vecchio!\n@c0@"
  fr: "@aPandora@bJe ne reçois d'ordres de personneⓠ\nSurtout pas d'un fantômeⓠ\n@c0@"
  it: "@aViola@bSoprattutto se a farlo è una vecchia mummia ambulante e brontolona!\n@c0@"
  ja: "@a@bデボラ「私に　命令するなんて\n\tホント　いい度胸よ！！\n@c0@"
66:
  de: "@aGriselda@bJetzt, da wir mit der Sammlung so weit gekommen sind, wollen wir sie auch fertigmachen! Na los, %a000090, ab mit dir!\n@c0@"
  en: "@aDebora@bNow we've built up such a collection, I want to see it finished. Go on, %a000090, off you go!\n@c0@"
  es: "@aStefania@bAhora que tenemos esta colezzione quiero verla completa. ¡Vamos, %a000090, manos a la obra!\n@c0@"
  fr: "@aPandora@bMaintenant qu'on a mis sur pied une aussi belle collection, je veux la voir terminée. Allez, %a000090, c'est repartiⓠ\n@c0@"
  it: "@aViola@bLa collezione è quasi completa!\nForza, %a000090! Continua così!\nAncora un piccolo sforzo e ce l'avremo fatta!\n@c0@"
  ja: "@a@bデボラ「ここまで　集めると\n\t最後まで　集めたくなるわね。\n\tさあ　%a000090　さがしに　いくわよ！\n@c0@"
67:
  de: "@aGriselda@bWird er denn niemals Ruhe geben? Die Podeste sind doch alle voll, um Himmels willen! Der ist auch niemals zufrieden!\n@c0@"
  en: "@aDebora@bCan't he just be satisfied? The pedestals are full, for heaven's sake! He's always making us jump through smaller and smaller hoops.\n@c0@"
  es: "@aStefania@b¿Es que nunca está satisfecho? ¡Los pedestales están llenos, por la Diosa! ¡Cada vez lo pone más dificile!\n@c0@"
  fr: "@aPandora@bIl n'est donc jamais contentⓡ\nLes piédestaux sont pleins, nom de nomⓠ\nIl recule chaque fois un peu plus la cible.\n@c0@"
  it: "@aViola@bNon ci posso credere! Abbiamo messo un souvenir su ciascun piedistallo, ma Geremia non è contento!\nMa cosa vuole ancora da noi?! Il sangue?!\n@c0@"
  ja: "@a@bデボラ「台座が　うまったんだから\n\t満足すればいいのに\n\tなかなか　注文の多い　じいさんね！\n@c0@"
68:
  de: "@aGriselda@bNicht einmischen? Das geht Euch überhaupt nichts an! Und selbst wenn's Euch was anginge ⓚⓛ auf Eure Meinung kann ich gut verzichten!\n@c0@"
  en: "@aDebora@bShouldn't go sticking your nose in!? It's none of your business, and even if it was, I wouldn't want your opinion, old man!\n@c0@"
  es: "@aStefania@b¿Que no debería meter la nariz? ¡Ma si no hace otra cosa! ¡Veramente, lo que tiene que oír una!\n@c0@"
  fr: "@aPandora@bLà-dessus, il a bien raison. Ce ne sont pas ses affaires et on ne lui demande pas son avis.\n@c0@"
  it: "@aViola@bNemmeno la più ficcanaso delle suocere troverebbe tanto da ridire quanto quella vecchia mummia ambulante! Mi fa una rabbia...\n@c0@"
  ja: "@a@bデボラ「まかせた　というわりに\n\tけっこう　クチを出してくるわよね。\n@c0@"
69:
  de: "@aGriselda@bJa, aber klar! Der steht doch vor lauter Ärger über uns wieder von den Toten auf! Er bringt es einfach nicht fertig, sich rauszuhalten.\n@c0@"
  en: "@aDebora@bOh, yes. I believe him! He's practically coming back to life, he's so bothered by our display. He just can't help meddling.\n@c0@"
  es: "@aStefania@b¡Vamos, no me credo niente! Está tan aburrido por nuestra exposición que prácticamente va a resucitar. No puede evitar entrometerse.\n@c0@"
  fr: "@aPandora@bBen voyons. Je le croisⓠ Notre exposition le dérange tellement qu'il en reviendrait presque à la vie. Il ne peut pas s'empêcher de s'en mêler.\n@c0@"
  it: "@aViola@bSe non ho fatto male i calcoli,la parola se l'è già rimangiata una trentina di volte.\nDi questo passo, farà indigestione...\n@c0@"
  ja: "@a@bデボラ「ああ　言ってるけど\n\t直せって　オーラが\n\t全身から　出てるわよね。\n@c0@"
70:
  de: "@aGriselda@bWarum erzählt er uns nicht einfach, wie er sich das vorgestellt hat? Dann wüssten wir wenigstens, was wir lieber nicht tun sollten!\n@c0@"
  en: "@aDebora@bWhy doesn't he just tell us what his grand plan is? Then at least we'd know what not to do!\n@c0@"
  es: "@aStefania@b¿Per qué no nos cuenta simplemente cuál es su gran plan? ¡Al menos sabríamos qué no hacer!\n@c0@"
  fr: "@aPandora@bEt pourquoi ne pas nous dire plutôt l'idée qui trotte dans la sienne, de têteⓡ Comme ça, on saurait au moins ce qu'il ne faut pas faireⓠ\n@c0@"
  it: "@aViola@bSe Geremia ci dicesse come preferisce esporre gli oggetti, risparmieremmo un mucchio di tempo...\n@c0@"
  ja: "@a@bデボラ「だったら　じいさんの\n\t考えを　教えなさいよね！\n@c0@"
71:
  de: "@aGriselda@bAh. Vielleicht ⓚⓛ aber auch nur vielleicht ⓚⓛ hätte er uns das ja mal eher sagen können? Oder hat das alte Gespenst das womöglich einfach vergessen, hm?\n@c0@"
  en: "@aDebora@bEr... Do you think maybe ⓚⓛ just maybe ⓚⓛ it would've been a good idea to tell us that earlier?\nOr did the senile old spook just forget, hm?\n@c0@"
  es: "@aStefania@bEsto... ¿No crees que quizás, solo quizás, hubiera sido buona idea contarnos eso antes?\r\n¿O ese fantasma senil se ha olvidado?\n@c0@"
  fr: "@aPandora@bEuh... Tu ne crois pas que peut-être, mais seulement ⓥpeut-êtreⓦ, il aurait pu avoir la bonne idée de nous dire ça plus tôtⓡ\n㈡\nOu bien est-ce que ce vieux spectre sénile a tout simplement oublié, hmⓡ\n@c0@"
  it: "@aViola@bAh, buono a sapersi!\nMa perché non ce l'ha detto prima, eh?!\n@c0@"
  ja: "@a@bデボラ「そういう　大事なことは\n\t初めに　言ってほしいわよ。\n@c0@"
72:
  de: "@aGriselda@bHmm... Umräumen, meint er... Vielleicht könnten wir hübschen Schmuck ausstellen... Oder mich zum Ausstellungsthema machen!\n@c0@"
  en: "@aDebora@bHmm... Switch things around, he says...\r\nPerhaps we could have a display of pretty jewellery... Or a display all about me!\n@c0@"
  es: "@aStefania@bMmm... Cambiar artículos, dice...\r\nVeramente, podríamos tener un expositor de joyería fina... ¡o uno sobre mí!\n@c0@"
  fr: "@aPandora@bMmm... Déplacer des pièces... On pourrait peut-être organiser une exposition de beaux bijoux... Ou une exposition rien que sur moiⓠ\n@c0@"
  it: "@aViola@bCambiare qualche oggetto?\nE perché no?\nForza, caro! Proviamo!\n@c0@"
  ja: "@a@bデボラ「ならべる名産品の　種類ねえ。\n\tキレイなのとか　変なのとか？\n@c0@"
73:
  de: "@aGriselda@bIch wünschte, er würde nicht dauernd so was sagen. Jetzt will ich unbedingt wissen, was er damit gemeint hat.\n@c0@"
  en: "@aDebora@bI wish he wouldn't say things like that. Now I want to know what he means.\n@c0@"
  es: "@aStefania@bOjalá no dijera cosas así. Ahora veramente quiero saber a qué se refiere.\n@c0@"
  fr: "@aPandora@bSi seulement il pouvait dire les choses autrement. Maintenant, j'ai envie de savoir ce qu'il veut dire.\n@c0@"
  it: "@aViola@bQuali cambiamenti avrebbe voluto apportare?\nOh, accidenti!\nSono curiosa! Voglio saperlo!\n@c0@"
  ja: "@a@bデボラ「だったら　気になるから\n\t言わないでほしいわね。\n@c0@"
74:
  de: "@aGriselda@bEr wirkt wie ein trotteliger alter Mann, nicht? Aber wie es scheint, hat er verborgene Tiefen!\n@c0@"
  en: "@aDebora@bHe seems like a doddery old fool, doesn't he?\r\nBut he's got hidden depths, it seems.\n@c0@"
  es: "@aStefania@bTiene pinta de vecchio loco, ¿eh?\r\nMa sembra que tiene facetas ocultas.\n@c0@"
  fr: "@aPandora@bIl a l'air d'un vieux fou cacochyme, heinⓡ\nMais apparemment, il cache des profondeurs insoupçonnées.\n@c0@"
  it: "@aViola@bA me sembra che Geremia straparli sempre, non solo ⓕa volteⓖ...\n@c0@"
  ja: "@a@bデボラ「言うだけ言って　ボケたフリ……。\n\tなかなか　あなどれない　じいさんね。\n@c0@"
75:
  de: "@aGriselda@bEs ist sehr entspannend. Ich muss mich mal wieder entspannen, weißt du. Das ist sehr wichtig für mich. Ruhen wir uns hier eine Weile aus.\n@c0@"
  en: "@aDebora@bIt is very relaxing. I need to relax, you know. It's very important for me. Let's rest here for a while.\n@c0@"
  es: "@aStefania@bEs muy relajante. Necesito relajarme. Es importante per me. Descansemos aquí un attimo.\n@c0@"
  fr: "@aPandora@bC'est très relaxant. J'ai besoin de me détendre,\r\ntu sais. C'est très important pour moi.\r\nReposons-nous un peu ici.\n@c0@"
  it: "@aViola@bAdoro crogiolarmi al sole... Non per troppo tempo, però: ho la pelle delicata, e se mi esponessi troppo a lungo ai raggi solari rischierei di rovinarla!\n@c0@"
  ja: "@a@bデボラ「たしかに　気持ちいいわね。\n\tこのまま　すこし　寝ていこうかしら。\n@c0@"
76:
  de: "@aGriselda@bNa, ist ja schön, dass sich alle so gut amüsieren, aber was ist mit mir?\n@c0@"
  en: "@aDebora@bI'm thrilled that everyone else is having a whale of a time, but what about me?\n@c0@"
  es: "@aStefania@bMe encanta que todos se lo pasen bene, ¿ma qué pasa conmigo?\n@c0@"
  fr: "@aPandora@bJe suis ravie que tout le monde s'amuse vraiment, mais... et moiⓡ\n@c0@"
  it: "@aViola@bI visitatori si stanno divertendo, ma io mi annoio a morte...\n@c0@"
  ja: "@a@bデボラ「他人を　楽しませても\n\t私が　楽しめなきゃ　お話にならないわ。\n@c0@"
77:
  de: "@aGriselda@bIch brauche schon ein bisschen mehr als der simple Spießer von nebenan. Ich brauche mehr Unterhaltung!\n@c0@"
  en: "@aDebora@bI'm rather more sophisticated than the average knick-knack anorak. I need more entertainment\r\nthan this.\n@c0@"
  es: "@aStefania@bYo soy mucho más sofisticata que la gente normal. Necesito más para entretenerme que esto.\n@c0@"
  fr: "@aPandora@bJe suis quand même plus sophistiquée que l'amateur de souvenirs lamba. J'ai besoin d'autres divertissements que ceux-là.\n@c0@"
  it: "@aViola@bPer suscitare l'interesse di una donna sofisticata come me ci vuole ben altro che qualche cianfrusaglia raccattata qua e là.\n@c0@"
  ja: "@a@bデボラ「もっとも\n\t私は　レベルが高いから\n\tこの程度で　楽しいとは　思えないけど。\n@c0@"
78:
  de: "@aGriselda@bWenn man sich den Kram, den wir hier ausstellen, mal ansieht, dann wundert man sich schon über die merkwürdige Welt, in der wir leben, nicht?\n@c0@"
  en: "@aDebora@bLooking at everything that's on display, it makes you think what a peculiar world we live in, doesn't it?\n@c0@"
  es: "@aStefania@bViendo todo lo expuesto empiezas a pensar en il mondo singolare en que vivimos, ¿eh?\n@c0@"
  fr: "@aPandora@bQuand on regarde tout ce qui est exposé, on se dit qu'on vit vraiment dans un monde étrange, nonⓡ\n@c0@"
  it: "@aViola@bPer una volta, sono d'accordo con Geremia: ammirando questi souvenir, i visitatori posso farsi un'idea di quanto sia vario il mondo in cui viviamo.\n@c0@"
  ja: "@a@bデボラ「こうしてみると　世界には\n\tふしぎなものが　いっぱいあるのね。\n@c0@"
79:
  de: "@aGriselda@bJa, klar! Wie hätte es mit meiner Hilfe denn anders werden können als großartig!\n@c0@"
  en: "@aDebora@bWell obviously! I've been helping out, so of course we've done a grand job.\n@c0@"
  es: "@aStefania@b¡No me digas! Yo he colaborado, así que por supuesto es un buen lavoro.\n@c0@"
  fr: "@aPandora@bÉvidemment, voyonsⓠ Je t'ai aidé, alors bien sûr qu'on a fait un boulot incroyable. \n@c0@"
  it: "@aViola@bCerto che abbiamo fatto un buon lavoro!\nEd è tutto merito mio, che ho saputo dirigere le operazioni nel miglior modo possibile!\n@c0@"
  ja: "@a@bデボラ「まあ　この私が\n\t集めるのを　手伝ったんだから\n\tとうぜんよね。\n@c0@"
80:
  de: "@aGriselda@bSie macht einen sehr fähigen Eindruck. Fast so gut wie ich, nur nicht so hübsch. Ihr Talent ist hier vergeudet.\n@c0@"
  en: "@aDebora@bShe seems like a very capable woman. Much like\r\nme, only not as pretty. Her talents are wasted on this place.\n@c0@"
  es: "@aStefania@bParece una donna muy capaz. Un poco como yo, pero no tan bellina. Sus talentos se malgastan aquí.\n@c0@"
  fr: "@aPandora@bCette femme a l'air très compétente.\r\nTout à fait comme moi, mais en moins jolie.\r\nElle gâche son talent dans cet endroit.\n@c0@"
  it: "@aViola@bSue Venir non è solo carina, ma anche efficiente nel lavoro! Un po' mi somiglia, solo che io sono molto più bella e cento volte più in gamba!\n@c0@"
  ja: "@a@bデボラ「なかなか　しっかりした娘ね。\n\tこんなところに　置いておくのが\n\tもったいない気が　するわ。\n@c0@"
81:
  de: "@aGriselda@bOffenbar hat der Alte eine Schwäche für die Empfangsdame, wenn er ihr kleine Zettelchen schreibt!\n@c0@"
  en: "@aDebora@bSeems like the old man's got a bit of a crush, writing notes to the receptionist!\n@c0@"
  es: "@aStefania@b¡Parece que el vecchio esté innamorato, escribiendo notas a la recepcionista!\n@c0@"
  fr: "@aPandora@bOn dirait que le vieux bonhomme a le béguin, pour écrire des petits mots à la réceptionnisteⓠ\n@c0@"
  it: "@aViola@bGeremia le ha lasciato degli appunti?\nNon sarà mica un messaggino d'amore, eh?\nIh ih ih ih ih!\n@c0@"
  ja: "@a@bデボラ「メモを　もらうなんて\n\tそうとう　あのじいさんの\n\tお気に入りのようね。\n@c0@"
82:
  de: "@aGriselda@bWeitere Stücke? Und wo sollen wir die nun wieder auftreiben?\n@c0@"
  en: "@aDebora@bNew articles? Well how do we go about finding\r\nthem, then?\n@c0@"
  es: "@aStefania@b¿Nuevas piezas? Ma, ¿por dónde empezamos a buscarlas?\n@c0@"
  fr: "@aPandora@bD'autres piècesⓡ Bon, mais comment on fait\npour les trouver, alorsⓡ\n@c0@"
  it: "@aViola@bE così Geremia ha trovato dei nuovi souvenir?\nInteressante..\nCome facciamo per trovarli?\n@c0@"
  ja: "@a@bデボラ「新しい名産品って……\n\tどうやって　調べたのかしら？\n@c0@"
83:
  de: "@aGriselda@bIch fand ja gleich, dass er in letzter Zeit ungewöhnlich ruhig war. Er hat sein Meckern offenbar auf Papier verlegt.\n@c0@"
  en: "@aDebora@bI thought he seemed unusually quiet. He's been grumbling on paper instead, it seems.\n@c0@"
  es: "@aStefania@bYa me parecía extrañamente silenzioso. Ma estaba protestando por escrito.\n@c0@"
  fr: "@aPandora@bJe le trouvais bizarrement silencieux, aussi. Apparemment, il a juste décidé de ronchonner\r\nsur le papier.\n@c0@"
  it: "@aViola@bEcco perché Geremia non brontolava più come un tempo! Ha deciso di scrivere le sue lamentele, invece di dircele a voce!\n@c0@"
  ja: "@a@bデボラ「ちょっと静かだと　思ったら\n\tここで　グチを書きためてたのね。\n@c0@"
84:
  de: "@aGriselda@bViel Glück. Das Gespenst hat deine Zeit offenbar schon wieder verplant.\n@c0@"
  en: "@aDebora@bGood luck. It seems the ghost's got plans for you.\n@c0@"
  es: "@aStefania@bBuena suerte. Parece que el fantasma tiene planes per te.\n@c0@"
  fr: "@aPandora@bBonne chance. Apparemment, le fantôme a des projets pour toi.\n@c0@"
  it: "@aViola@bSembra proprio che il caro Geremia abbia grandi progetti per il Museo del Souvenir... e per te.\n@c0@"
  ja: "@a@bデボラ「あんたは　あのじいさんの\n\t夢を　たくされたわけね。\n@c0@"
85:
  de: "@aGriselda@bMir gefällt es so, wie es ist. Das ist mal was anderes.\n@c0@"
  en: "@aDebora@bI like it as it is. It's unusual.\n@c0@"
  es: "@aStefania@bMe gusta como es. Resulta inusitato.\n@c0@"
  fr: "@aPandora@bMoi ça me plaît comme ça. Ça n'est pas commun.\n@c0@"
  it: "@aViola@bA me l'esposizione piace così com'è.\nÈ particolare, forse un po' noiosa, ma di certo è unica nel suo genere.\n@c0@"
  ja: "@a@bデボラ「今のままでも\n\tなかなか　きばつで\n\t私は　気にいってるわよ。\n@c0@"
86:
  de: "@aGriselda@bWenn er uns weiter erzählt, wir hätten freie Hand, und dann über das Ergebnis meckert, bringt ihn das auf schnellstem Weg nach Nadiria.\n@c0@"
  en: "@aDebora@bHe'll be on the fast track to Nadiria if he carries on telling us he's leaving things to us and then cursing us when we don't do what he wants.\n@c0@"
  es: "@aStefania@bComo siga diciendo que deja las cosas en nuestras manos para luego enfadarse si no hacemos lo que quiere, va a ir a Nadiria più presto de lo que cree.\n@c0@"
  fr: "@aPandora@bIl va vite finir à Nadiria s'il continue à nous dire de faire comme on l'entend tout en nous maudissant de ne pas faire ce qu'il veut.\n@c0@"
  it: "@aViola@bSe Geremia non la smette di lamentarsi delle nostre scelte dopo che ci ha detto che possiamo fare come preferiamo, gli stacco la testa e gliela metto in mano!\n@c0@"
  ja: "@a@bデボラ「人に　任せておきながら\n\t天罰なんて　むしろ　そっちに\n\tバチが　あたるわよ。\n@c0@"
87:
  de: "@aGriselda@bⓞLangsam aber sicherⓟ ist eine öde Methode.\n@c0@"
  en: "@aDebora@bI hate slow and steady. It's boring.\n@c0@"
  es: "@aStefania@bOdio las cosas poquito a poco. Es molto aburrido.\n@c0@"
  fr: "@aPandora@bJe déteste ce qui avance lentement mais sûrement. C'est ennuyeux.\n@c0@"
  it: "@aViola@bIo, invece, non voglio perdere troppo tempo con questi souvenir.\n@c0@"
  ja: "@a@bデボラ「私　ゆっくりって\n\tキライなのよね。\n@c0@"
88:
  de: "@aGriselda@bTrödle nicht herum, %a000090. Mach aus der Ausstellung lieber heute als morgen etwas, worauf ich stolz sein kann.\n@c0@"
  en: "@aDebora@bDon't waste any time, %a000090. Hurry up and make the place into something I can be proud of.\n@c0@"
  es: "@aStefania@bNo pierdas el tiempo, %a000090. Apresúrate y convierte esto en algo de lo que esté orgullosa, ¿capisci?\n@c0@"
  fr: "@aPandora@bNe perd pas de temps, %a000090.\nDépêche-toi de transformer cet endroit en\nquelque chose dont je puisse être fière.\n@c0@"
  it: "@aViola@b%0%a000090, sbrigati a trovare qualche oggettino simpatico, così Geremia sarà contento e noi potremo tornare a occuparci degli affari nostri.\n@c0@"
  ja: "@a@bデボラ「%a000090。　あんた　早いところ\n\tこの博物館を　りっぱにしなさいよ。\n@c0@"
89:
  de: "@aGriselda@bNa, der Göttin sei Dank! Beeil dich und treib die letzten paar Andenken auf, die wir brauchen, %a000090.\n@c0@"
  en: "@aDebora@bThank the Goddess! Hurry up and find the last few souvenirs we need, %a000090. I've had about as much knick-knackery as I can handle.\n@c0@"
  es: "@aStefania@b¡Gracias a la Dea! Corre y encuentra los últimos souvenirs que necesitamos, %a000090. Estoy de cosinas hasta el naso.\n@c0@"
  fr: "@aPandora@bLa Déesse soit louéeⓠ Dépêche-toi de trouver les derniers souvenirs qui nous manquent, %a000090.\n㈡\nJe ne suis pas loin d'avoir ma dose de toutes ces pièces de collection.\n@c0@"
  it: "@aViola@bForza, %a000090!\nSbrigati a trovare i pochi souvenir mancanti!\nNon ne posso più di Geremia e del suo Museo!\n@c0@"
  ja: "@a@bデボラ「ホント　もうすぐね。\n\tさあ　%a000090。\n\t次の名産品を　さがしにいくわよ。\n@c0@"
90:
  de: "@aGriselda@bWissen über Firlefanz-Präsentation? Ach was! Das brauchen wir nicht ⓚⓛ wir sind Naturtalente!\n@c0@"
  en: "@aDebora@bKnow-how about knick-knacks is know-how you don't need no how!\n@c0@"
  es: "@aStefania@b¡Para poner cosinas no hace falta saber ni una cosina!\n@c0@"
  fr: "@aPandora@bApprendre à exposer du bazar, c'est un concept\r\nun peu bizarre...\n@c0@"
  it: "@aViola@bZucca vuota sarà lui e tutti i visitatori del suo dannatissimo Museo! Ma come si permette di insultare così il mio fedele maritino?!\n@c0@"
  ja: "@a@bデボラ「あんたの　センスじゃ\n\tあれが　げんかいでしょ。\n@c0@"
91:
  de: "@aGriselda@bJedenfalls ist Kati wohl bestens über seine Ideen informiert.\n@c0@"
  en: "@aDebora@bHe certainly seems to keep Sue abreast of his ideas.\n@c0@"
  es: "@aStefania@bDesde luego, sembra que tiene a Nuray al tanto de sus ideas.\n@c0@"
  fr: "@aPandora@bIl a l'air de tenir Marie-Jo au courant de ses idées.\n@c0@"
  it: "@aViola@bEh eh eh!\nIl vecchio Geremia non riesce a togliersi dalla testa la bella Sue...\n@c0@"
  ja: "@a@bデボラ「あの　受付娘には\n\tいろいろ　教えてあげてるみたいね。\n@c0@"
92:
  de: "@aGriselda@bWollen wir hoffen, dass er nicht auch noch Ideen bekommt, was Kati angeht.\n@c0@"
  en: "@aDebora@bBut he should keep his ideas about Sue's ⓚⓛ Ahem! ⓚⓛ to himself!\n@c0@"
  es: "@aStefania@bMa sus ideas acerca de Nuray... ¡Ejem! ¡Debería guardárselas!\n@c0@"
  fr: "@aPandora@bMais il devrait garder pour lui ses idées\nsur Marie-Joⓠ\n@c0@"
  it: "@aViola@bBeh, immagino che sia un modo come un altro per tenere lo spirito giovane...\n@c0@"
  ja: "@a@bデボラ「やっぱり　あの娘\n\tじいさんの　シュミ？\n@c0@"
93:
  de: "@aGriselda@bⓞSeinⓟ Firlefanzeum? Ist dem Gespenst der Verstand ausgelaufen? Er hat es doch dir übergeben, %a000090! Und was dein ist, soll auch mein sein.\n@c0@"
  en: "@aDebora@bⓗMy knick-knackatoryⓘ!? I don't think so! He gave it to you, %a000090, so it's mine now. What's yours is mine, after all.\n@c0@"
  es: "@aStefania@b¿¡ⓕMi museninoⓖ!? ¡Creo que no! Te lo dio a ti, %a000090, así que es mío. Lo tuyo es mío, ¿capisci?\n@c0@"
  fr: "@aPandora@bⓥMa Galericabracⓦⓡⓐ Je ne crois pasⓠ Il te l'a donnée, %a000090, donc elle m'appartient, maintenant. Après tout, ce qui est à toi est à moi.\n@c0@"
  it: "@aViola@bCome si permette di dire che non sai esporre i souvenir, %a000090?! Ti ho istruito io, quindi è ovvio che sai farlo alla perfezione!\n㈡\nA meno che Geremia non voglia insinuare che nemmeno io so esporli...\nOh, quella serpe velenosa me la pagherà cara!\n@c0@"
  ja: "@a@bデボラ「わしの大事なって？\n\t%a000090が　もらったんだから\n\tもう　私の　博物館なのにっ！\n@c0@"
94:
  de: "@aGriselda@bHätte er sich die Mühe gemacht aufzuschreiben, was ihm nicht gefällt, wären wir jetzt schlauer. Ehrlich, als Tagebuchschreiber ist er 'ne echte Niete!\n@c0@"
  en: "@aDebora@bIf he bothered to write down what he was bothered about, we'd at least know what he wanted. Honestly, he's a hopeless diary writer!\n@c0@"
  es: "@aStefania@bSi se hubiera molestado en escribir lo que le preocupaba, al menos sabríamos lo que quería. ¡Qué scrittore de diarios más disperso!\n@c0@"
  fr: "@aPandora@bS'il avait fait l'effort d'écrire ce qui lui posait problème, on saurait au moins ce qu'il veut.\n㈡\nFranchement, pour ce qui est de tenir un journal,\nil repasseraⓠ\n@c0@"
  it: "@aViola@bMa invece di scrivere una lamentela dietro l'altra, non poteva lasciare qualche indicazione su come preferisce che siano esposti i souvenir?!\n@c0@"
  ja: "@a@bデボラ「どこに問題があるか\n\tついでに　書いててくれればいいのに。\n\t気がきかないわねぇ　まったく。\n@c0@"
95:
  de: "@aGriselda@bMachst dich wohl einigermaßen, was?\n@c0@"
  en: "@aDebora@bAre you having a good bash at it?\n@c0@"
  es: "@aStefania@b¿Te lo estás pasando bene?\n@c0@"
  fr: "@aPandora@bTu sais te débrouillerⓡ\n@c0@"
  it: "@aViola@bE così Geremia pensa che tu ti stia dando da fare, eh? Forse non sa che i tuoi sforzi sarebbero del tutto inutili, senza la mia sapiente supervisione.\n@c0@"
  ja: "@a@bデボラ「あんたにしては\n\tがんばったほうじゃない？\n@c0@"
96:
  de: "@aGriselda@bAber es macht ja keinen großen Unterschied. Mit mir an deiner Seite schindest du auf jeden Fall Eindruck.\n@c0@"
  en: "@aDebora@bI suppose it doesn't really matter. I mean, as long as I'm with you, you can't fail to impress.\n@c0@"
  es: "@aStefania@bDa igual. Mientras esté contigo es imposibile que no impresiones.\n@c0@"
  fr: "@aPandora@bBof, peu importe après tout. Du moment que je suis avec toi, tu ne peux que faire bonne impression.\n@c0@"
  it: "@aViola@bScegliendo te come direttore del Museo, quella mummia ambulante si è anche assicurato la miglior consulente artistica del mondo! Che poi sarei io.\n@c0@"
  ja: "@a@bデボラ「まあ　私が　ならべれば\n\tもっと　美しく　なるだろうけど。\n@c0@"
97:
  de: "@aGriselda@bAch herrje. Jetzt denkst du offenbar schon so wie der alte Tattergreis. Ich hab gleich gedacht, dass du allmählich ein bisschen runzlig wirst.\n@c0@"
  en: "@aDebora@bOh dear. You've started to think like the old dodderer himself. I thought you'd started to look a bit wrinkly.\n@c0@"
  es: "@aStefania@b¡Oh, caro!, has empezado a pensar como ese vecchio senil. Credo que hasta te están saliendo arrugas.\n@c0@"
  fr: "@aPandora@bOh non. Tu t'es mis à penser comme le vieux barbon lui-même. Je trouvais aussi que tu commençais à paraître ridé.\n@c0@"
  it: "@aViola@bNon so se congratularmi con te perché il tuo lavoro è stato finalmente apprezzato...\n㈡\nO se preoccuparmi perché, secondo Geremia, cominci a pensarla come lui! Se la seconda ipotesi fosse vera, sarebbe un dramma!\n@c0@"
  ja: "@a@bデボラ「年寄りと　センスが同じだなんて\n\tあんたって　意外と\n\tジジくさいのね。\n@c0@"
98:
  de: "@aGriselda@bHm? Warum ich keinen Kuchen backe oder so was? Sehe ich etwa aus wie 'ne Küchenfee?\n@c0@"
  en: "@aDebora@bHm? Why don't I bake a cake or something?\nNot likely! Do I look like a servant?\n@c0@"
  es: "@aStefania@b¿Mmm? ¿Que por qué no preparo unos pastelinos?\nCredo que no he oído bene... \n@c0@"
  fr: "@aPandora@bHeinⓡ Pourquoi je ne ferais pas un gâteauⓡ Sûrement pasⓠ J'ai l'air d'une domestiqueⓡ\n@c0@"
  it: "@aViola@bCome dici? Vuoi sapere perché io non ti preparo un dolce ogni tanto? Non sono mica la tua serva!\nSe vuoi un dolce, vai e te lo compri!\n@c0@"
  ja: "@a@bデボラ「は？　この私に\n\t菓子を　作れ　ですって？\n\tイヤよ。　めんどくさいわ。\n@c0@"
99:
  de: "@aGriselda@bWas ist nicht ganz nach seinem Geschmack?\n@c0@"
  en: "@aDebora@bWhat isn't how he'd be liking it?\n@c0@"
  es: "@aStefania@bMa, ¿es que no le gusta?\n@c0@"
  fr: "@aPandora@bQu'est-ce qui ne lui plaît pasⓡ\n@c0@"
  it: "@aViola@bLe cose non sono ancora perfette?! Ma cosa vuole di più quel vecchio rompiscatole?! Che i visitatori piangano di gioia dopo aver visto i suoi souvenir?!\n@c0@"
  ja: "@a@bデボラ「気になることって　なによ？\n@c0@"
100:
  de: "@aGriselda@bWenn ich jetzt so drüber nachdenke ⓚⓛ warum hat uns dieses Biest eine Trophäe gegeben? Ist das nicht ein bisschen... merkwürdig?\n@c0@"
  en: "@aDebora@bNow I come to think of it, why did that beast give us a trophy? Isn't that a bit...odd?\n@c0@"
  es: "@aStefania@bAhora que lo pienso, ¿por qué esa bestia nos dio un trofeo? ¿No es un po'... raro?\n@c0@"
  fr: "@aPandora@bMaintenant que j'y pense, pourquoi ce monstre nous a-t-il remis un trophéeⓡ Ça n'est pas un peu... bizarreⓡ\n@c0@"
  it: "@aViola@bCaro, sai che non ho ancora capito come mai quel mostro ci ha dato il Catas Trofeo? Forse ha voluto premiare la tua abilità in combattimento?\n@c0@"
  ja: "@a@bデボラ「というか　そもそも\n\tなんで　あいつは\n\tトロフィーなんて　もってたわけ？\n@c0@"
101:
  de: "@aGriselda@bTja, du gibst wirklich dein Bestes, das muss man zugeben. Auch wenn's nicht viel ist... Nein, war nur 'n Witz. Das war wirklich gute Arbeit!\n@c0@"
  en: "@aDebora@bWell you are trying, it's true. Very trying indeed!\r\nNo, sorry. I really mean it. You are.\n@c0@"
  es: "@aStefania@bBueno, lo intentas, es cierto. Lo intentas mucho. Perdona, lo digo en serio. Veramente.\n@c0@"
  fr: "@aPandora@bTu es méritant, c'est vrai. Très méritantⓠ\nNon, je suis sérieuse. Je le pense vraiment.\n@c0@"
  it: "@aViola@bVisto? Cosa ti avevo detto? Seguendo i miei preziosi suggerimenti, hai portato il Museo del Souvenir al massimo livello di perfezione! E tutto grazie a me!\n@c0@"
  ja: "@a@bデボラ「あんたにしては　よく\n\tがんばったほうね。\n\tたまには　ほめてあげても　いいわよ。\n@c0@"
102:
  de: "@aGriselda@bWo lebt das Mädel eigentlich? Die ist doch wohl nicht Tag und Nacht hier, oder? Das wäre ja schlimm.\n@c0@"
  en: "@aDebora@bWhere does that girl live, anyway? She's not here all the time, is she? That would just be too sad.\n@c0@"
  es: "@aStefania@b¿Pero dónde vive esa ragazza? No estará aquí tutto el tiempo, ¿no? Sería muy triste.\n@c0@"
  fr: "@aPandora@bOù elle vit d'abord, cette filleⓡ Elle n'est pas ici en permanence, n'est-ce pasⓡ Ça serait trop triste.\n@c0@"
  it: "@aViola@bA proposito...\nMa dove vive Sue Venir? Non trascorrerà mica le notti al Museo, vero?\n㈡\nGeremia ne sarebbe entuasiasta, ma credo che anche lei abbia una vita privata...\nO forse no?\n@c0@"
  ja: "@a@bデボラ「そういえば　あの娘は\n\tどこに住んでるわけ？\n@c0@"
103:
  de: "@aGriselda@bWas für eine schlotterbeinige Memme! Das ist bloß leer, das ist alles. Was soll denn daran unheimlich sein?!\n@c0@"
  en: "@aDebora@bWhat a spineless coward! It's just empty, that's all. It's not creepy.\n@c0@"
  es: "@aStefania@b¡Qué cobarde vigliacco! Está vacío, eso es todo. No da miedo.\n@c0@"
  fr: "@aPandora@bQuelle poule mouilléeⓠ Il est vide, ce musée, c'est tout. Il ne fait pas peur du tout.\n@c0@"
  it: "@aViola@bI brividi? Che esagerazione! L'edificio avrà un aspetto imponente, anche tetro, se vogliamo, ma non credo che faccia tanta impressione!\n@c0@"
  ja: "@a@bデボラ「それはそうよね。\n\t最近　開館したばかりなんだから。\n@c0@"
104:
  de: "@aGriselda@bDas ist so... trist. Hier gehört ein bisschen Leben in die Bude, sonst wird bestimmt keiner hierher kommen. Ich tät's jedenfalls nicht!\n@c0@"
  en: "@aDebora@bIt's too...dull. The place needs livening up,\r\notherwise no one's ever going to bother coming.\r\nI know I wouldn't.\n@c0@"
  es: "@aStefania@bEs troppo... aburrido. Hay que animar este sitio o nadie vendrá. Yo no vendría, veramente.\n@c0@"
  fr: "@aPandora@bCet endroit est trop... triste. Il lui faut un peu d'animation, sinon personne ne viendra jamais le visiter. En tout cas moi, je ne viendrais pas.\n@c0@"
  it: "@aViola@bHa ragione.\nCosì com'è adesso, questo posto non può nemmeno essere definito un museo.\n@c0@"
  ja: "@a@bデボラ「地味すぎるから　もっとハデに\n\tやらないと　人は来ないわよ。\n@c0@"
105:
  de: "@aGriselda@bAch du dickes Huhn. Ein Landei! Für ein Landei ist das hier wahrscheinlich was ganz Tolles.\n@c0@"
  en: "@aDebora@bOh dear! A bumpkin. I suppose a building like this would look grand to a bumpkin.\n@c0@"
  es: "@aStefania@b¡Oh, caro! Un gañán. Supongo que un edificio así le parecerá estupendo a un gañán.\n@c0@"
  fr: "@aPandora@bOh nonⓠ Un péquenaud. C'est sûr qu'un bâtiment pareil, ça doit impressionner les types comme lui.\n@c0@"
  it: "@aViola@bMa che fa? Ci prende in giro?\nOppure l'edificio gli piace davvero?\nNon l'ho mica capito...\n@c0@"
  ja: "@a@bデボラ「見るからに　イナカ者ね。\n\tこんな建物でも　イナカ者には\n\tかなり　りっぱに　見えるでしょうね。\n@c0@"
106:
  de: "@aGriselda@bMeine Güte, der Mann ist ja geradezu besessen mit seinem ⓞunheimlichⓟ hin und ⓞunheimlichⓟ her. Der ist mir selber schon ganz unheimlich.\n@c0@"
  en: "@aDebora@bAll that man's interested in is how creepy the place does or doesn't feel. He gives me the creeps.\n@c0@"
  es: "@aStefania@bA ese hombre solo le interesa el miedo que dé o deje de dar el sitio. Veramente, él sí que da miedo.\n@c0@"
  fr: "@aPandora@bTout ce qui intéresse ce type, c'est de savoir si cet endroit est effrayant ou pas. Ça me fait froid dans le dos.\n@c0@"
  it: "@aViola@bOh, ma che osservazione intelligente!\nDirei che merita il premio ⓕScoperta dell'acqua caldaⓖ dell'anno...\n@c0@"
  ja: "@a@bデボラ「博物館らしくって\n\tこの人　ここ以外の　博物館にも\n\t行ったことが　あるのかしら？\n@c0@"
107:
  de: "@aGriselda@bDas klingt verdächtig nach Beschwerde! Weiß er denn nicht, wie viel Arbeit wir uns machen, um das alles ausstellen zu können?\n@c0@"
  en: "@aDebora@bThat sounds like a complaint! Doesn't he know the lengths we've gone to in order to put all these things on display?\n@c0@"
  es: "@aStefania@b¡Eso suena a queja! Ma, ¿es que no sabe lo que hemos pasado para poder mostrare todas estas cosas?\n@c0@"
  fr: "@aPandora@bMais il se plaint, on diraitⓠ Il ne sait donc pas\ntout ce qu'on a dû faire pour pouvoir exposer\ntous ces objetsⓡ\n@c0@"
  it: "@aViola@bMa che fa?! Si lamenta?! Dopo tutta la fatica che abbiamo fatto per trovare questa roba, ci meriteremmo almeno un bel ⓕgrazieⓖ!\n@c0@"
  ja: "@a@bデボラ「これだけ　ものを　そろえるのも\n\tそこそこ　苦労したわよね？\n@c0@"
108:
  de: "@aGriselda@bGlückwunsch, er hat was gerafft. Darum geht's schließlich bei Andenken... dass sie einen an Orte erinnern, wo man mal gewesen ist.\n@c0@"
  en: "@aDebora@bWell, he's got something right at least. That's what souvenirs are after all... Things to remind you of places you've been.\n@c0@"
  es: "@aStefania@bVa bene. Para eso son los souvenirs, ¿no? Para recordar los lugares donde has estado.\n@c0@"
  fr: "@aPandora@bIl a raison sur ce point. C'est à ça que servent les souvenirs, après tout... Des objets destinés à nous rappeller les endroits où l'on est allés.\n@c0@"
  it: "@aViola@bFinalmente una persona che ha capito lo spirito del Museo del Souvenir!\n㈡\nQuesti oggetti non sono semplici manufatti, ma rappresentano i paesi da cui provenengono.\n@c0@"
  ja: "@a@bデボラ「たしかに　名産品って\n\tその場所の　特性が出てるわよね。\n@c0@"
109:
  de: "@aGriselda@bTja, aber wenn man einem Mann nicht sagt, wo's langgeht, hilft alles nichts, stimmt's, %a000090? Ohne mich hättest du das nie hingekriegt.\n@c0@"
  en: "@aDebora@bA man is nothing without proper guidance, though. Isn't that right, %a000090? You couldn't have done it without me.\n@c0@"
  es: "@aStefania@bPero un uomo no es nada sin la guía apropiada, ¿verdad, %a000090? No podrías haberlo hecho senza me.\n@c0@"
  fr: "@aPandora@bMais un homme n'est rien sans quelqu'un pour le guider dans la bonne direction, n'est-ce pas, %a000090ⓡ Tu n'aurais jamais réussi sans moi.\n@c0@"
  it: "@aViola@bCerto che il direttore del Museo è un tipo in gamba!\nE sua moglie lo è ancora di più!\nNon è vero, %a000090?\n@c0@"
  ja: "@a@bデボラ「この名産品を　集められたのは\n\t私の　的確な指示のおかげだから。\n\tわかるわよね　%a000090。\n@c0@"
110:
  de: "@aGriselda@bSeltene Ausstellungsstücke? Vielleicht sollte ich einfach selbst auf das Podest steigen! Eine seltenere Schönheit wird es wohl kaum geben.\n@c0@"
  en: "@aDebora@bThe rarer the item? Why don't I just climb up on that pedestal then? There could be no rarer beauty.\n@c0@"
  es: "@aStefania@b¿Y por qué no me subo yo al pedestal? No hay belleza più peculiar.\n@c0@"
  fr: "@aPandora@bPlus une pièce est rareⓡ Pourquoi je ne grimperais pas sur un piédestal, dans ce casⓡ Il ne pourrait y avoir de beauté plus rare.\n@c0@"
  it: "@aViola@bMi pare ovvio, no?\nChi vuoi che venga a vedere un oggetto che si trova a ogni angolo di strada, eh?!\n@c0@"
  ja: "@a@bデボラ「レベルの高い　名産品？\n\tだったら　私が　あの台座にのれば\n\t最高レベルになってしまうわね。\n@c0@"
111:
  de: "@aGriselda@bWenn man hier leben müsste, wär's nicht sehr lustig, aber für ein Museum ist die Lage wohl gar nicht so übel. Wem's gefällt...\n@c0@"
  en: "@aDebora@bIt would be a pain if you had to live here, but it's a good location for a museum, I suppose. If you like that kind of thing.\n@c0@"
  es: "@aStefania@bSería una pesadez tener que vivir aquí, ma no es mal sitio para un museo, supongo. Si te gustan esas cosas.\n@c0@"
  fr: "@aPandora@bÇa serait pénible d'être obligé de vivre ici, mais c'est un bon emplacement pour un musée, je crois.\r\nEnfin, si on aime ce genre de trucs.\n@c0@"
  it: "@aViola@bIl posto non è male per un museo, ma non mi piacerebbe affatto vivere in questo luogo dimenticato dalla dea e dagli uomini!\n@c0@"
  ja: "@a@bデボラ「生活には　不便だけど\n\t博物館としてなら\n\tすごく　いい場所よね。\n@c0@"
112:
  de: "@aGriselda@bⓞStilvollⓟ? Kein Mensch sagt heute noch ⓞstilvollⓟ!\n@c0@"
  en: "@aDebora@bⓗChicⓘ? Oh dear. That word is so out of fashion!\n@c0@"
  es: "@aStefania@b¿ⓕEleganteⓖ? Oh cielos. ¡Esa parola está tan pasada de moda...!\n@c0@"
  fr: "@aPandora@bⓥChicⓦⓡ Oh là là, c'est vraiment ringard, comme motⓠ\n@c0@"
  it: "@aViola@bCerto che è unico nel suo genere!\nDopotutto sono io che ho supervisionato la realizzazione del Museo...\n@c0@"
  ja: "@a@bデボラ「ハイカラ？\n\tいまどき　言わないわよ。\n@c0@"
113:
  de: "@aGriselda@bForschungen in einem Museum? Klingt etwas... faul, oder? Soll er sich doch selbst in der Welt umschauen, statt von unserer Arbeit zu schmarotzen!\n@c0@"
  en: "@aDebora@bComing to a museum to do research is a bit...lazy, isn't it? He should be out there discovering things himself, not profiting from our hard work!\n@c0@"
  es: "@aStefania@bVenir a un museo a documentarse es ser un poco... vago, ¿no?\n㈡\n¡Debería estar ahí fuera, descubriendo cosas por su cuenta, y no beneficiarse de il nostro lavoro!\n@c0@"
  fr: "@aPandora@bVenir dans un musée pour faire des recherches, c'est un peu... paresseux, nonⓡ\n㈡\nIl devrait être dehors à essayer de découvrir des choses par lui-même, au lieu de tirer profit de notre dur labeurⓠ\n@c0@"
  it: "@aViola@bBello studioso, che è!\nDovrebbe svolgere le sue ricerche direttamente sul campo, invece di approfittarsi del nostro lavoro!\n@c0@"
  ja: "@a@bデボラ「自分の足で　歩かずに\n\t博物館で　研究するなんて\n\tちょっと　セコイわね。\n@c0@"
114:
  de: "@aGriselda@bEin einzigartiges Stück? Da braucht Ihr gar nicht weiter zu suchen. Nichts ist einzigartiger als das, was Ihr hier vor Euch seht.\n@c0@"
  en: "@aDebora@bA stunning exhibit? Look no further. Nothing is more stunning than what you see before you now.\n@c0@"
  es: "@aStefania@b¿Una exposición espléndida? ¡No busque más! No hay nada più espléndido que lo que tiene ante sus ojos.\n@c0@"
  fr: "@aPandora@bDes collections à la hauteurⓡ Ne cherchez plus.\nRien n'est plus à la hauteur que ce que vous avez devant vous en ce moment même.\n@c0@"
  it: "@aViola@bTutti i souvenir raccolti nel Museo sono splendidi!\nIl direttore ha agito seguendo le mie istruzioni, quindi non potrebbe essere diversamente.\n@c0@"
  ja: "@a@bデボラ「美しい名産品ねえ。\n\t私より　美しいものなんて\n\tこの世に　ないと思うけど。\n@c0@"
115:
  de: "@aGriselda@bSo was würde auch bloß ein Landei hibbelig machen. Armer Kerl.\n@c0@"
  en: "@aDebora@bOnly a bumpkin would feel nervous in a place like this. Poor thing.\n@c0@"
  es: "@aStefania@bSolo un gañán se sentiría nervioso en un sitio así. Poverino.\n@c0@"
  fr: "@aPandora@bIl n'y a qu'un péquenaud pour se sentir nerveux dans un endroit pareil. Pauvre bougre.\n@c0@"
  it: "@aViola@bNon si sente a suo agio? Oh, poverino.\nAnzi, no: non potrebbe importarmene di meno.\nSe il posto non gli piace, tanto peggio per lui!\n@c0@"
  ja: "@a@bデボラ「これしきの　建物で\n\tきんちょうするなんて　やっぱり\n\tイナカ者ね。\n@c0@"
116:
  de: "@aGriselda@bAber klar! Wo könnte es schöner sein für eine frischgebackene Braut?\n@c0@"
  en: "@aDebora@bAbsolutely! What a place to bring your bride!\n@c0@"
  es: "@aStefania@b¡Desde luego! ¡Menudo lugar para traer a la tua mujer!\n@c0@"
  fr: "@aPandora@bElle a raisonⓠ Tu parles d'un endroit où emmener\nson épouseⓠ\n@c0@"
  it: "@aViola@bBen le sta!\nCosì impara a lasciar decidere al marito dove andare in viaggio di nozze!\n㈡\nQuella sprovveduta dovrebbe imparare da me come si tiene a bada il consorte!\n@c0@"
  ja: "@a@bデボラ「新婚旅行先に　博物館。\n\tなんか　しけてるわね。\n@c0@"
117:
  de: "@aGriselda@bNein, bestimmt nicht. Ich würde mich in meinen Flitterwochen jedenfalls nicht mit dem Besuch irgendeines doofen Firlefanzeums abspeisen lassen!\n@c0@"
  en: "@aDebora@bNo, I don't. I wouldn't be fobbed off with a visit to a ridiculous knick-knackatory for my honeymoon!\n@c0@"
  es: "@aStefania@bNo. ¡A mí no me chafan la luna di miele con una visita a un ridículo musenino!\n@c0@"
  fr: "@aPandora@bJe ne crois pas, non. Je ne me ferais sûrement pas duper par une visite dans une ridicule Galericabrac en guise de lune de mielⓠ\n@c0@"
  it: "@aViola@bSe mi avessi fatto trascorrere la luna di miele in questo Museo avrei chiesto il divorzio prima ancora di raggiungere la seconda sala, caro.\n@c0@"
  ja: "@a@bデボラ「気分だけひたるのも\n\t悪くはないわね。\n@c0@"
118:
  de: "@aGriselda@bWas für ein Ausstellungsstück? Wenn wir ihm glauben sollen, dann kann er uns doch ganz leicht noch eins machen, oder nicht?\n@c0@"
  en: "@aDebora@bWhich exhibit? If he wants us to believe him, he should be able to make us another one then,\r\nshouldn't he?\n@c0@"
  es: "@aStefania@b¿Qué trasto? Si quiere que lo creamos debería ser capace di hacernos otro, ¿no?\n@c0@"
  fr: "@aPandora@bQuelle pièceⓡ S'il veut qu'on le croit, il faudrait qu'il soit capable d'en fabriquer une autre, heinⓡ\n@c0@"
  it: "@aViola@bQuale souvenir avrebbe fatto?\nNon è che, per caso, sta raccontando una solenne frottola?\n@c0@"
  ja: "@a@bデボラ「どの　名産品よ。\n\t……っていうか　本当かどうか\n\tもうひとつ　作ってもらいましょうよ。\n@c0@"
119:
  de: "@aGriselda@bWovon redet er denn? Hier ist doch gar nichts drin.\n@c0@"
  en: "@aDebora@bWhat's he talking about? The room's completely empty.\n@c0@"
  es: "@aStefania@bMa, ¿de qué habla? Esta sala está totalmente vacía.\n@c0@"
  fr: "@aPandora@bMais de quoi il parleⓡ La pièce est complètement vide.\n@c0@"
  it: "@aViola@bMa di quale souvenir sta parlando?!\nTu l'hai capito, caro?\n@c0@"
  ja: "@a@bデボラ「何も　かざられてない部屋で\n\t何を　言ってるのかしら。\n@c0@"
120:
  de: "@aGriselda@bDie Wahrheit?! Der lügt doch, ohne rot zu werden!\n@c0@"
  en: "@aDebora@bThe truth!? He's lying through his teeth!\n@c0@"
  es: "@aStefania@b¿La verità? ¡Miente más que habla!\n@c0@"
  fr: "@aPandora@bLa véritéⓡⓐ Il ment comme il respireⓠ\n@c0@"
  it: "@aViola@bAnche secondo me è un bugiardo di prima categoria.\nMa a che scopo sparare una balla del genere?\nForse vuole farsi un po' di pubblicità gratuita?\n@c0@"
  ja: "@a@bデボラ「あの人が　名産品を\n\t作ったっていうのは　きっと　ウソね。\n@c0@"
121:
  de: "@aGriselda@bAlso, das muss man sich mal vorstellen! Dass jemand so in seine Gedanken versunken ist, dass er sein Kind aus dem Auge verliert!\n@c0@"
  en: "@aDebora@bHonestly! Fancy being so wrapped up in your own thoughts that you'd take your eyes off your child!\n@c0@"
  es: "@aStefania@b¡Vamos! ¡Qué bonito, estar tan ensimismada que no vigilas a il tuo bambino!\n@c0@"
  fr: "@aPandora@bFranchementⓡⓐ Tu imagines un peuⓢ être tellement absorbé dans ses pensées qu'on en oublie de surveiller son enfantⓠ\n@c0@"
  it: "@aViola@bCapisco che il Museo del Souvenir sia un luogo estremmente interessante che merita di essere visitato con la massima attenzione...\n㈡\nMa come si fa a perdere di vista il proprio figlio?!\n@c0@"
  ja: "@a@bデボラ「まったく　自分だけ\n\t夢中になって　子供から\n\t目をはなすなんて！\n@c0@"
122:
  de: "@aGriselda@bSo was darf einer Mutter nicht passieren! ... Was starrst du mich denn so an, %a000090? Kannst dich an meiner Schönheit gar nicht satt sehen, was?\n@c0@"
  en: "@aDebora@bThat's just not what being a mother is all about.\n...What is it, %a000090? Why are you staring at me like that? Can't believe how beautiful I am?\n@c0@"
  es: "@aStefania@bSer una mamma no es eso.\n... ¿Qué pasa, %a000090? ¿Por qué me miras así? ¿No puedes creer lo bellina que soy?\n@c0@"
  fr: "@aPandora@bÇa n'est pas ça, être une mère. ... Quoi, qu'est-ce qu'il y a, %a000090ⓡ Pourquoi tu me fixes comme çaⓡ Tu n'en reviens pas que je sois si belleⓡ\n@c0@"
  it: "@aViola@bUna brava madre di famiglia deve sempre trovare il modo di controllare i figli, il marito e gli altri parenti stretti!\n㈡\nCaro, per fortuna io non ti perdo mai d'occhio!\nSo bene che senza di me ti sentiresti perso...\n@c0@"
  ja: "@a@bデボラ「母親だったら　しっかりしてほしいわ。\n\t……って　なに　%a000090？\n\tまた　私に　見とれてるわけ？\n@c0@"
123:
  de: "@aGriselda@bIch weiß zwar nicht, was für ein Kunsthandwerker der Mann ist, aber sicher würde er nur zu gern auch eins davon für mich machen, oder?\n@c0@"
  en: "@aDebora@bI don't know what kind of a craftsman that man is, but I think he'd be only too happy to make whatever it is he makes for me, don't you?\n@c0@"
  es: "@aStefania@bNo sé qué clase de artesano es ese uomo, ma credo que estará encantado de hacer para mí lo que sea que fabrique, ¿verdad?\n@c0@"
  fr: "@aPandora@bJe ne sais pas quel genre d'artisan c'est, mais je crois qu'il ne serait que trop heureux de faire ce qu'il fait rien pour moi, tu ne crois pasⓡ\n@c0@"
  it: "@aViola@bA giudicare da come guarda gli oggetti esposti, si direbbe che quell'uomo sia un artigiano.\n㈡\nChissà, forse è qui per vedere se nella collezione del Museo c'è qualcuno dei suoi manufatti...\n@c0@"
  ja: "@a@bデボラ「何の　職人か分からないけど\n\tせっかくだから　私にも\n\t作ってくれないかしらね。\n@c0@"
124:
  de: "@aGriselda@bStell dir vor, er kommt nicht davon los! Hat der einen an der Waffel?\n@c0@"
  en: "@aDebora@bFancy not being able to stay away from here!\r\nHe must be a bit strange.\n@c0@"
  es: "@aStefania@b¡Mira que no poder dejar de mirar eso...! Debe de ser un po' rarito.\n@c0@"
  fr: "@aPandora@bC'est drôle de ne pas pouvoir se décoller d'iciⓠ\nIl doit être un peu bizarre.\n@c0@"
  it: "@aViola@bCerto, è possibile star qui giorni interi ad ammirare i souvenir esposti.\nAnche settimane o mesi, se proprio vuole.\n㈡\nAl posto suo, però, cercherei di fare qualcosa di più costruttivo nella mia vita...\n@c0@"
  ja: "@a@bデボラ「こんな　場所に通うだなんて\n\t物好きも　いたものね。\n@c0@"
125:
  de: "@aGriselda@bIch hoffe, er wird mir noch danken, wo doch mein Museum ihm geholfen hat, sich wieder am Riemen zu reißen.\n@c0@"
  en: "@aDebora@bI hope he's planning on thanking me, seeing as how my museum's helped him get back on track again.\n@c0@"
  es: "@aStefania@bEspero que esté pensando darme las grazie a me. No se hubiera puesto en marcha de nuevo de no ser por il mio museo.\n@c0@"
  fr: "@aPandora@bJ'espère qu'il a l'intention de me remercier, vu que mon musée l'a aidé à se remettre sur les rails.\n@c0@"
  it: "@aViola@bDavvero crede di poter realizzare oggetti belli quanto quelli esposti?\nNon sarà un'affermazione un po' presuntuosa?\n@c0@"
  ja: "@a@bデボラ「この博物館のおかげで\n\tがんばる気に　なったんだから\n\t感謝してほしいものよね。\n@c0@"
126:
  de: "@aGriselda@bWas ist denn mit dem los?! Wer würde sich denn hier entspannen wollen?\n@c0@"
  en: "@aDebora@bWhat a weirdo! Who in their right mind would want to relax here?\n@c0@"
  es: "@aStefania@b¡Qué bizzarro! ¿Quién en su sano juicio querría relajarse aquí?\n@c0@"
  fr: "@aPandora@bTu parles d'un barjoⓠ Qui de censé pourrait bien avoir envie de se détendre iciⓡ\n@c0@"
  it: "@aViola@bMa come?! Le sale del Museo sono piene di oggetti interessanti e lui se ne sta chiuso nel deposito?!\nSecondo me non ci sta con la testa...\n@c0@"
  ja: "@a@bデボラ「こんな場所で　落ち着けるなんて\n\tこの人　かなりの　変人ね。\n@c0@"
127:
  de: "@aGriselda@bHaben wir hier nicht einfach bloß den Krempel reingestopft, den oben auszustellen sich nicht lohnt? Hat der was an den Augen?\n@c0@"
  en: "@aDebora@bIsn't this room just full of the things that aren't worth putting on display upstairs? Do you think he needs his eyes tested?\n@c0@"
  es: "@aStefania@b¿Esta camera no está llena de las cosas indignas de exponerse arriba? ¿Crees que tendrá problemas de vista?\n@c0@"
  fr: "@aPandora@bEst-ce que cette pièce n'est pas remplie des objets qui ne sont pas dignes d'être exposés dans les étagesⓡ Tu crois qu'il a un problème de vueⓡ\n@c0@"
  it: "@aViola@bDeve avere un gusto molto particolare, per giudicare interessanti i souvenir che non abbiamo reputato degni di essere mostrati al pubblico...\n@c0@"
  ja: "@a@bデボラ「ここにあるのは　上に\n\tかざる価値も　ないものよね。\n\tあの人　目が　おかしいんじゃない？\n@c0@"
128:
  de: "@aGriselda@bDamit hätte ich nicht gerechnet! Ich hätte nie geglaubt, dass jemand deine ziemlich eigenwilligen Firlefanz-Skurrilitäten verstehen würde.\n@c0@"
  en: "@aDebora@bI didn't see that coming! I didn't think there was anyone out there who'd understand your quirky knick-knackery habits.\n@c0@"
  es: "@aStefania@b¡No me lo esperaba! No sabía que existiera alguien que comprendiera tus stranos hábitos museninos.\n@c0@"
  fr: "@aPandora@bAlors ça, je ne l'avais pas vu venirⓠ Je n'imaginais pas qu'il existe une seule personne capable de comprendre tes goûts en matière de bric-à-brac.\n@c0@"
  it: "@aViola@bAccidenti, che analisi approfondita e accurata!\nSotto i suoi panni di buzzurro deve nascondersi uno studioso di fama internazionale!\n@c0@"
  ja: "@a@bデボラ「あんたのセンスを\n\t認める人が　いたなんてね。\n\tまったく　おどろきだわ。\n@c0@"
129:
  de: "@aGriselda@bMoment mal, Zenithianer können Zenithia doch nicht einfach so verlassen, wenn ihnen gerade der Sinn danach steht, oder?\n@c0@"
  en: "@aDebora@bHang on, Zenithians can't just leave Zenithia whenever they feel like it, can they?\n@c0@"
  es: "@aStefania@bEspera, los zenithios no pueden partire da Zenithia cuando les apetece, ¿no?\n@c0@"
  fr: "@aPandora@bAttends... Les Zénithiens ne peuvent quand même\npas quitter Zénithia juste quand l'envie leur en prend, siⓡ\n@c0@"
  it: "@aViola@bCaro, avresti mai immaginato che la notizia dell'apertura del Museo del Souvenir avrebbe raggiunto Zenithia? Sono senza parole...\n@c0@"
  ja: "@a@bデボラ「確か　天空人って\n\t勝手に　地上に降りては\n\tいけないんじゃなかったっけ？\n@c0@"
130:
  de: "@aGriselda@bEin Museum ist ein langweiliges Flitterwochenziel...\nDa fällt mir ein, wo bleibt eigentlich mein Strand und wo bleiben meine Dinner bei Kerzenschein?\n@c0@"
  en: "@aDebora@bA museum is such a boring place for a honeymoon. ...Come to think of it, where's my beach and \r\ncandlelit dinner?\n@c0@"
  es: "@aStefania@bUn museo es tan aburrido para una luna di miele... Ahora que lo pienso, ¿y mi playa y mi cena con velas?\n@c0@"
  fr: "@aPandora@bC'est tellement ennuyeux comme endroit pour une\nlune de miel, une Galericabrac...\n㈡\nTiens, d'ailleurs, maintenant que j'y penseⓢ où sont ma plage et mon dîner aux chandellesⓡ\n@c0@"
  it: "@aViola@bLa signora non ha tutti i torti, però la gioia di essersi sposata dovrebbe farle dimenticare che...\n㈡\nEhi! Aspetta un attimo!\nDov'è la mia spiaggia, %a000090?\nDove sono le mie cenette a lume di candela?!\n@c0@"
  ja: "@a@bデボラ「新婚旅行先に　博物館？\n\tあんたって　たいくつな男よね。\n\tまあ　べつに　いいけどさ。\n@c0@"
131:
  de: "@aGriselda@bEs ist die Pflicht eines Ehemannes, seine Frau glücklich zu machen. Vergiss das lieber nicht, ja?\n@c0@"
  en: "@aDebora@bIt's a husband's duty to keep his wife happy.\r\nDon't forget that, will you?\n@c0@"
  es: "@aStefania@bEs deber de un marito tener feliz a la sua esposa. Como lo olvides te acuerdas, ¿capisci?\n@c0@"
  fr: "@aPandora@bC'est le devoir d'un mari de rendre sa femme heureuse. N'oublie jamais ça, d'accordⓡ\n@c0@"
  it: "@aViola@bQualcuno dovrebbe dirgli che ogni marito dovrebbe sempre cercare di rendere felice la propria moglie. Cerca di non dimenticarlo mai, caro %a000090.\n@c0@"
  ja: "@a@bデボラ「妻を　よろこばせるのは\n\t夫の義務よね。\n\tあんたも　みならいなさいよ。\n@c0@"
132:
  de: "@aGriselda@bWas ist mit dem weiblichen Potenzial? Mein Potenzial kennt keine Grenzen! Das ist alles, was du wissen musst.\n@c0@"
  en: "@aDebora@bWhat about woman's potential? My potential knows no bounds. That's all you need to know.\n@c0@"
  es: "@aStefania@b¿Que qué hay del potencial femenino? El mío no tiene limitaciones. Es cuanto necesitas saber, ¿capisci?\n@c0@"
  fr: "@aPandora@bEt ce dont les femmes sont capables, alorsⓡ\nMoi, je suis capable de tout. C'est tout ce que\ntu as besoin de savoir.\n@c0@"
  it: "@aViola@bHo trovato il modo di esprimere il mio potenziale creativo nel matrimonio, trovando cose sempre nuove da farti fare. Sei contento, caro, nevvero?\n@c0@"
  ja: "@a@bデボラ「私は　可能性の宝庫だから\n\tあれこれ　深く考える　必要はないわ。\n@c0@"
133:
  de: "@aGriselda@bWie kann man denn davon sprechen, wie gut hier alles läuft, ohne der Frau zu danken, die dies alles möglich gemacht hat? Ein Armutszeugnis!\n@c0@"
  en: "@aDebora@bHow can you comment on how successful the place is without even a word of thanks to the woman who made it all possible? Very odd.\n@c0@"
  es: "@aStefania@b¿Cómo puedes hablar del éxito del lugar sin siquiera una palabra de agradecimiento a la donna que lo hizo posible? Qué raro.\n@c0@"
  fr: "@aPandora@bComment peut-on faire des commentaires sur le succès d'un lieu sans glisser un mot de remerciement à la femme qui a rendu tout cela possibleⓡ Bizarre.\n@c0@"
  it: "@aViola@bSono felice quando sento che il Museo del Souvenir incontra il favore dei visitatori. Vuol dire che le mie direttive sono state seguite correttamente.\n@c0@"
  ja: "@a@bデボラ「はんじょうしてるわりに\n\t私たちへの　かんげんが\n\tほとんどないのは　なぜかしらね。\n@c0@"
134:
  de: "@aGriselda@bSiehst du, und darum lasse ich mich hier nicht gern allzu oft blicken. All der hübsche Firlefanz wirkt glanzlos neben mir.\n@c0@"
  en: "@aDebora@bThat's why I don't like to show my face around here too much, you see. All the pretty knick-knacks just look dull next to me.\n@c0@"
  es: "@aStefania@bPor eso no me asomo mucho por aquí. A mi lado, estas preciosas cosinas parecen veramente aburridas.\n@c0@"
  fr: "@aPandora@bC'est pour ça que je n'aime pas trop me montrer\r\npar ici, tu vois. Tous ces jolis objets paraissent\r\nbien fades à côté de moi.\n@c0@"
  it: "@aViola@bCaro, stavo pensando che non dovrei farmi vedere al Museo... Sai, la mia bellezza è tale da mettere in ombra quella dei souvenir...\n@c0@"
  ja: "@a@bデボラ「まあ　どの名産品も\n\t私の美しさには　かなわないけどね。\n@c0@"
135:
  de: "@aGriselda@bSolange es nichts ist, was nach einer Weile schimmelig und eklig wird.\n@c0@"
  en: "@aDebora@bJust so long as it's not something that'll go all mouldy and disgusting after a while.\n@c0@"
  es: "@aStefania@bMientras no sea algo que se ponga verde y asqueroso después de un tempo...\n@c0@"
  fr: "@aPandora@bDu moment que ce n'est pas quelque chose qui finit par devenir tout moisi et répugnant au bout d'un moment.\n@c0@"
  it: "@aViola@bSi potrebbe pensare a un'esposizione gastronomica, con cibi provenienti da ogni parte del mondo...\nUhm, niente male come idea...\n@c0@"
  ja: "@a@bデボラ「日持ちするものなら\n\tかざってあげても　いいわね。\n@c0@"
136:
  de: "@aGriselda@bWenn es ausstellenswert wäre, könnte ich wohl mal drüber nachdenken. Mal schauen...\n@c0@"
  en: "@aDebora@bIf it's something worthy of display, I suppose I could think about it. We'll see...\n@c0@"
  es: "@aStefania@bSi es algo digno di mostrare, podría pensarlo. Ya veremos....\n@c0@"
  fr: "@aPandora@bSi c'est quelque chose digne d'être exposé, je pourrais y réfléchir. Nous verrons...\n@c0@"
  it: "@aViola@bQuella sì che è una ragazza determinata!\nMi piace il suo atteggiamento.\nSono sicura che farà molta strada...\n@c0@"
  ja: "@a@bデボラ「かざるだけの　価値があれば\n\t考えてあげても　いいわよ。\n@c0@"
137:
  de: "@aGriselda@bWieso ist sie denn so hin und weg? Hat vermutlich Urlaub, aber es gibt bessere Orte, um sich zu erholen.\n@c0@"
  en: "@aDebora@bI don't know what she's so pleased about. Presumably she's on holiday, but this is hardly a great place to relax.\n@c0@"
  es: "@aStefania@bNo sé por qué está tan felice. Supuestamente está de vacaciones, ma este no es precisamente un lugar de relax.\n@c0@"
  fr: "@aPandora@bJe ne sais pas ce qui la réjouit autant. Elle est sûrement en vacances, mais cet endroit n'est pas vraiment fait pour la détente.\n@c0@"
  it: "@aViola@bUn'altra visitatrice soddisfatta, un altro implicito apprezzamento per il superlativo lavoro di supervisione svolto dalla sottoscritta.\n@c0@"
  ja: "@a@bデボラ「でも　休むにしても\n\tたいしたところじゃ　なさそうね。\n@c0@"
138:
  de: "@aGriselda@bDu musst mir auch eine Villa bauen, %a000090! Nein, ein Hotel für mich allein! ... Ach was, schon mit einer Scheune wärst du sicher überfordert.\n@c0@"
  en: "@aDebora@bIt's high time I had a place to relax, %a000090. You must build me a villa. No, a hotel, just for me! No...you couldn't build a hovel, let alone a hotel.\n@c0@"
  es: "@aStefania@bYa es hora de que yo tenga un lugar donde relajarme, %a000090.\n㈡\nVas a construirme una villa. ¡No, un hotel solo per me! No... Tú no serías capaz de construir ni una casucha.\n@c0@"
  fr: "@aPandora@bIl est temps que j'aie un endroit où me relaxer, %a000090. Tu vas devoir me construire\nune villa. Non, un hôtel, rien que pour moiⓠ\n㈡\nQuoique... non. Tu ne saurais même pas construire une cabane, alors un hôtel...\n@c0@"
  it: "@aViola@bScusami, %a000090... Non volevo farti pesare il fatto che, senza di me, questo Museo non avrebbe nemmeno un souvenir degno di essere esposto...\n@c0@"
  ja: "@a@bデボラ「%a000090！　私のために\n\tステキな別荘を　建ててちょうだい。\n\tって　あんたには　無理か……。\n@c0@"
139:
  de: "@aGriselda@bForschungen in einem Museum? Klingt etwas... faul, oder? Soll er sich doch selbst in der Welt umschauen, statt von unserer Arbeit zu schmarotzen!\n@c0@"
  en: "@aDebora@bComing to a museum to do research is a bit...lazy, isn't it? He should be out there discovering things himself, not profiting from our hard work!\n@c0@"
  es: "@aStefania@bVenir a un museo a documentarse es ser un poco... vago, ¿no?\n㈡\n¡Debería estar ahí fuera, descubriendo cosas por su cuenta, y no beneficiarse de il nostro lavoro!\n@c0@"
  fr: "@aPandora@bVenir dans un musée pour faire des recherches, c'est un peu... paresseux, nonⓡ\n㈡\nIl devrait être dehors à essayer de découvrir des choses par lui-même, au lieu de tirer profit de notre dur labeurⓠ\n@c0@"
  it: "@aViola@bBello studioso, che è!\nDovrebbe svolgere le sue ricerche direttamente sul campo, invece di approfittarsi del nostro lavoro!\n@c0@"
  ja: "@a@bデボラ「自分の足で　歩かずに\n\t博物館で　研究するなんて\n\tちょっと　セコイわね。\n@c0@"
140:
  de: "@aGriselda@bEs gibt hier keinen Andenkenladen, oder?\n@c0@"
  en: "@aDebora@bThere isn't a souvenir shop here, is there?\n@c0@"
  es: "@aStefania@bMa... aquí no hay una tienda de souvenirs, ¿no?\n@c0@"
  fr: "@aPandora@bIl n'y a pas de boutique de souvenirs, ici, heinⓡ\n@c0@"
  it: "@aViola@bCome mai Geremia non ha pensato di aprire un banco dove vendere cataloghi del Museo e ricordini per i visitatori?\n@c0@"
  ja: "@a@bデボラ「ここには　みやげ物屋は\n\tないのよね。\n@c0@"
141:
  de: "@aGriselda@bWenn man also was sieht, was einem gefällt, müsste man nach die-Göttin-weiß-wohin laufen, um selbst eins zu kaufen. Wie lästig!\n@c0@"
  en: "@aDebora@bSo if you saw something you liked, you'd have to go all the way to goodness-knows-where to buy yourself one. What a pain!\n@c0@"
  es: "@aStefania@bAsí que si ves algo que te gusta, veramente tienes que ir la Diosa sabe dónde a comprártelo. ¡Qué mal!\n@c0@"
  fr: "@aPandora@bAlors si on voit quelque chose qui nous plaît, on est obligé d'aller au diable vauvert pour se l'acheter.\nTu parles d'une plaieⓠ\n@c0@"
  it: "@aViola@bChe idea geniale, eh?\nMia buona dea, ti ringrazio per avermi fatta così intelligente!\n@c0@"
  ja: "@a@bデボラ「ここで選んでも　実際に\n\tそこまで　行かないといけないから\n\tけっこう　不便よね。\n@c0@"
142:
  de: "@aGriselda@bWas ist denn bloß mit dem Dichter los? Das blöde Reimen sollte er meiden, das kann ich nämlich gar nicht leiden!\n@c0@"
  en: "@aDebora@bWhatever's the matter with that poet? He's boring, but he doesn't know it! Bursting into rhyme all the time... It's a crime!\n@c0@"
  es: "@aStefania@b¿Qué pasa con ese poeta? ¡Es un pesado, ma no lo sabe! Todo el rato con esas rimas... ¡Qué horror!\n@c0@"
  fr: "@aPandora@bC'est quoi le problème, avec ce poèteⓡ Il est ennuyeux comme la pluie mais ne le sait pas.\nFaire des vers sans en avoir l'air... quelle misèreⓠ\n@c0@"
  it: "@aViola@bVisti i risultati, sarebbe stato meglio se la sua vena poetica fosse rimasta zitta e muta...\n@c0@"
  ja: "@a@bデボラ「どうして　詩人って\n\t歌いながらじゃないと\n\tしゃべれないのかしら！\n@c0@"
143:
  de: "@aGriselda@bWoher genau kommt der Mann eigentlich?\n@c0@"
  en: "@aDebora@bWhat part of the world does that man come\r\nfrom exactly?\n@c0@"
  es: "@aStefania@b¿De qué parte d'il mondo procede ese hombre exactamente?\n@c0@"
