0:
  de: "@aNera@bEs ist so ein altes Gebäude, aber immer, wenn wir kommen, sieht es so ordentlich und sauber aus.\n@c0@"
  en: "@aNera@bIt's such an old building, but whenever we come,\r\nit always looks so neat and tidy.\n@c0@"
  es: "@aNera@bEs un edificio molto vecchio pero, siempre que venimos, está como una patena.\n@c0@"
  fr: "@aNera@bCe bâtiment est très ancien, et pourtant, chaque\r\nfois qu'on vient, il a toujours l'air bien entretenu.\n@c0@"
  it: "@aNera@bIl palazzo è stato costruito molti anni fa, ma è ancora in condizioni perfette.\n@c0@"
  ja: "@a@bフローラ「古い建物でしょうに\n\tいつ来ても　きれいに\n\t手入れがしてありますわね。\n@c0@"
1:
  de: "@a%0%a001240@bDas ist doch jetzt dein Firlefanzeum, oder, Papa? Ich find's immer toller, je öfter ich es sehe!\n@c0@"
  en: "@a%0%a001240@bThis is your knick-knackatory now, Dad, isn't it?\nIt gets more amazing every time I look at it!\n@c0@"
  es: "@a%0%a001240@bAhora este es tu musenino, ¿verdad papi?\nCuanto más lo miro, más genial me parece.\n@c0@"
  fr: "@a%0%a001240@bElle est à toi, cette Galericabrac, hein, papaⓡ\nÀ chaque fois que je la regarde, je la trouve\nun peu plus exceptionnelleⓠ\n@c0@"
  it: "@a%0%a001240@bPapà, adesso sei tu il direttore del Museo del Souvenir, non è vero? Geremia ha fatto bene a scegliere te: sei troppo forte!\n@c0@"
  ja: "@a@b%a001240「ここって　お父さんの\n\t博物館なんだよね？\n\t見れば見るほど　りっぱだなあ。\n@c0@"
2:
  de: "@a%0%a001250@bIch finde dieses Gebäude wunderbar! Man fühlt sich hier gleich gut aufgehoben.\n@c0@"
  en: "@a%0%a001250@bI love this building. It's got a really warm and comforting feel about it.\n@c0@"
  es: "@a%0%a001250@bMe encanta este edificio. Hay algo cálido y acogedor en él.\n@c0@"
  fr: "@a%0%a001250@bJ'adore ce bâtiment. Il a quelque chose de très chaleureux et de réconfortant.\n@c0@"
  it: "@a%0%a001250@bQuest'edificio mi piace tantissimo.\nÈ grande, maestoso e ricco di storia!\n@c0@"
  ja: "@a@b%a001250「この建物から　おだやかな\n\tふしぎなチカラを感じるの……。\n@c0@"
3:
  de: "@aSancho@bSí. Hier fühlt man siss wohl. Die Luft ist klar. Da kriegt man gleiss Lust auf eine kleine Siesta, no?\n@c0@"
  en: "@aSancho@bSí. Ees muchos fresh here. The air, ees clear.\r\nEet makes you ready for the siesta, no?\n@c0@"
  es: "@aSancho@b¡Ándale! Se está padre aquí. El aire es puro.\r\nTe entran ganas de echar una siesta.\n@c0@"
  fr: "@aSancho@bSi, il y a b-b-beaucoup d'air frais, ici. L'air est pur. Ça donne envie de f-faire la siesta, noⓡ\n@c0@"
  it: "@aSancho@bMe gusta esto luego...\n¡Es muy rilassante, ideale por una bella siesta!\n@c0@"
  ja: "@a@bサンチョ「ここは　ずいぶん\n\t空気もいいですね。\n\tゆったりした気分に　なれますよ。\n@c0@"
4:
  de: "@aOtto@bHier gefällt's mir wirklich gut. Als hätte man die Welt draußen zurückgelassen. Hier kann man richtig die Zeit vergessen!\n@c0@"
  en: "@aTuppence@bThis really is a cracking place. It's like the outside world's just stopped, and you can forget all\r\nabout everything!\n@c0@"
  es: "@aAlazar@bEste sitio es genial de verdad. Es como si el mundo se hubiese parado y pudieras olvidarlo todo.\n@c0@"
  fr: "@aInnocent@bC'est vraiment un endroit super. Comme si le temps\ns'y était arrêté et qu'on pouvait tout oublierⓠ\n@c0@"
  it: "@aSimon@bQuesto posto è fantastico! Mi sembra quasi di stare in un altro mondo, lontano dai problemi che dobbiamo affrontare quotidianamente...\n@c0@"
  ja: "@a@bピピン「ここは　いいところですねえ。\n\t世界の　せっぱつまった状況も\n\t忘れそうになるくらいです。\n@c0@"
5:
  de: "@aBianca@bEs ist schön ordentlich, wenn man bedenkt, dass es ziemlich abseits gelegen ist. Der Alte muss sich gut darum gekümmert haben.\n@c0@"
  en: "@aBianca@bIt's nice and tidy considerin' it was off the beaten track all that time. The old man must've taken care\r\nof the place.\n@c0@"
  es: "@aBianca@bEsta todo limpio y ordenado, sobre todo si se tiene en cuenta que ha estado abandonado tanto tiempo.\n㈡\nEl abuelo ha debido de cuidarlo todo este tiempo, ¿sabes?\n@c0@"
  fr: "@aBianca@bTout est propre et ordonné pour un lieu si isolé.\r\nLe vieil homme a dû en prendre grand soin.\n@c0@"
  it: "@aBianca@bL'edificio è vecchiotto, ma è ancora in perfette condizioni! Si vede che il proprietario ne ha avuto la massima cura...\n@c0@"
  ja: "@a@bビアンカ「長いこと　人がいなかったのに\n\t外も中もきれいね。\n\tおじいさんが　そうじしてたのかしら？\n@c0@"
6:
  de: "@aNera@bEs ist so ruhig hier, nicht? Genau die richtige Atmosphäre, um die Ausstellungsstücke angemessen würdigen zu können.\n@c0@"
  en: "@aNera@bIt's so still, isn't it? It's the perfect atmosphere for enjoying the exhibits.\n@c0@"
  es: "@aNera@bQué pace, ¿verdad? Es la atmósfera perfecta para disfrutar de la exhibición.\n@c0@"
  fr: "@aNera@bTout est si calme, ici. C'est une ambiance idéale pour profiter d'une exposition.\n@c0@"
  it: "@aNera@bL'atmosfera è tranquilla e serena.\nDirei che questo luogo è l'ideale per un museo...\n@c0@"
  ja: "@a@bフローラ「とても静かですね。\n\tこの静寂が　よりいっそう\n\t展示品を引き立てるのでしょうね。\n@c0@"
7:
  de: "@a%0%a001240@bWas für ein riesiger Raum! Hier drin gibt's ein richtiges Echo!\n@c0@"
  en: "@a%0%a001240@bWhat a huge room! My voice is echoing off the ceiling.\n@c0@"
  es: "@a%0%a001240@b¡Qué sala más enorme! Hace eco y todo.\n@c0@"
  fr: "@a%0%a001240@bQuelle salle immenseⓠ J'entends ma voix qui résonne jusqu'au plafond.\n@c0@"
  it: "@a%0%a001240@bChe grande che è questa stanza!\nSenti come rimbomba la mia voce!\n@c0@"
  ja: "@a@b%a001240「すっごく広い　お部屋だね。\n\tボクの声が　天井からひびいてくるよ。\n@c0@"
8:
  de: "@a%0%a001250@bWas meinst du, wer dieses gewaltige Gebäude errichtet hat? Ob das wohl der alte Firle Franz war?\n@c0@"
  en: "@a%0%a001250@bWho do you think put up such an enormous building? Was it Old Man Nick Knack, do you think?\n@c0@"
  es: "@a%0%a001250@b¿Quién construiría un edificio tan enorme? ¿Tú crees que sería el abuelo Nino?\n@c0@"
  fr: "@a%0%a001250@bQui a bâti un édifice aussi gigantesque, à ton avisⓡ Tu crois que c'est le vieux Bricabracⓡ\n@c0@"
  it: "@a%0%a001250@bÈ mai possibile che il vecchio Geremia abbia costruito questo posto tutto da solo?\nSecondo me si sarà fatto aiutare da qualcuno...\n@c0@"
  ja: "@a@b%a001250「こんな大きなお屋敷\n\t誰が建てたの？\n\tやっぱり　あのおじいさん？\n@c0@"
9:
  de: "@aSancho@bHier ist es riesig. Genau wie die Räume in Schloss Humburg.\n@c0@"
  en: "@aSancho@bThees place ees beeg like the rooms een\r\nGotha Castle.\n@c0@"
  es: "@aSancho@bEste lugar es tan grande como las salas del castillo de Pankraz.\n@c0@"
  fr: "@aSancho@bCet endroit est aussi g-g-grand que les salles du château de Gotha.\n@c0@"
  it: "@aSancho@b¡Esto luego es tantos grande como el Castillo de Denim!\n¡Es immenso!\n@c0@"
  ja: "@a@bサンチョ「これは　これは\n\tグランバニア城の一室にも\n\t勝るとも　おとらない　ところですね。\n@c0@"
10:
  de: "@aOtto@bSo ein Haus könnte mir auch gefallen. Das wäre genau das richtige Schloss für König Otto!\n@c0@"
  en: "@aTuppence@bI wouldn't mind a place this big one day.\nIt'd make a fine castle for King Tuppence!\n@c0@"
  es: "@aAlazar@bNo me importaría tener una casa así de grande algún día.\r\n¡Sería un castillo estupendo para el rey Alazar!\n@c0@"
  fr: "@aInnocent@bÇa ne me dérangerait pas d'avoir un jour\nune résidence aussi grande. Ça ferait un\nbeau château pour le roi Innocentⓠ\n@c0@"
  it: "@aSimon@bMi piacerebbe vivere in una ⓕcasettaⓖ del genere...\nCerto, l'edificio è un po' fuori mano, ma è spazioso, tranquillo ed elegante!\n@c0@"
  ja: "@a@bピピン「このぐらい　大きな建物を\n\tいつか　わが城にしてみたいです。\n@c0@"
11:
  de: "@aBianca@bSchön, hier so viele Besucher zu sehen.\n@c0@"
  en: "@aBianca@bIt's good to see so many visitors in the place.\n@c0@"
  es: "@aBianca@bEstá genial tener tantos visitantes, ¿sabes?\n@c0@"
  fr: "@aBianca@bC'est bien de voir qu'il y a autant de visiteurs.\n@c0@"
  it: "@aBianca@bQuanti visitatori!\n@c0@"
  ja: "@a@bビアンカ「お客さんも　いっぱい\n\t来てくれてるみたいね。\n\tなんだか　うれしいな。\n@c0@"
12:
  de: "@aNera@bWenn wir hierherkommen, setzt du immer dein Kuratorengesicht auf! Ich muss sagen, es steht dir!\n@c0@"
  en: "@aNera@bYou always put on your curator face when we come here. It makes you look so handsome!\n@c0@"
  es: "@aNera@bSempre pones la tua cara de gestor cuando venimos. ¡Te da un aire tan atractivo!\n@c0@"
  fr: "@aNera@bTu prends toujours ta tête de conservateur de musée, quand on vient ici. Ça te va très bien, d'ailleursⓠ\n@c0@"
  it: "@aNera@bQuando veniamo qui hai sempre un'aria seria e professionale! Si vede che hai preso sul serio il tuo ruolo di direttore del Museo, tesoro!\n@c0@"
  ja: "@a@bフローラ「ここに来ると　あなたは\n\t館長の顔になりますわね。\n\tそんな　あなたもステキですわ。\n@c0@"
13:
  de: "@a%0%a001240@bEs ist immer noch so still, trotz der vielen Besucher. Ist das an solchen Orten immer so?\n@c0@"
  en: "@a%0%a001240@bIt's still really quiet, even though there are loads of visitors. Is that what these places are always like?\n@c0@"
  es: "@a%0%a001240@bSigue siendo bastante tranquilo aunque hay montones de visitantes. ¿Estos sitios siempre son así?\n@c0@"
  fr: "@a%0%a001240@bC'est très calme, même avec tous ces visiteurs.\nC'est toujours comme ça dans les muséesⓡ\n@c0@"
  it: "@a%0%a001240@bNon c'è confusione, nonostante ci sia una gran folla.\nEvidentemente i visitatori del Museo del Souvenir sono persone ben educate!\n@c0@"
  ja: "@a@b%a001240「お客さんがいても　静かだね。\n\t博物館って　そういう場所なの？\n@c0@"
14:
  de: "@a%0%a001250@bJe mehr Besucher hierherkommen, desto mehr spornt mich das an, aus diesem Museum wirklich was Besonderes zu machen.\n@c0@"
  en: "@a%0%a001250@bSeeing more and more visitors coming makes me want to work even harder at making the place special.\n@c0@"
  es: "@a%0%a001250@bVer que cada vez vienen más visitantes me inspira para trabajar para que este lugar sea especial.\n@c0@"
  fr: "@a%0%a001250@bQuand je vois qu'il y a toujours plus de visiteurs,\nça me donne envie de me démener encore plus\npour rendre cet endroit unique.\n@c0@"
  it: "@a%0%a001250@bVedere tanti visitatori al Museo del Souvenir mi fa venir voglia di impegnarmi ancora di più per rendere questo posto davvero speciale!\n@c0@"
  ja: "@a@b%a001250「お客さんに　来てもらえると\n\tもっと　がんばろうって思います。\n@c0@"
15:
  de: "@aSancho@bWeißt du, zuerst dachte iss nisst, dass die Leute von so weit her kommen, um unsere Schnicks und Schnacks zu sehen.\n@c0@"
  en: "@aSancho@bYou know, at first I no believe the people are gonna come eso far to esee the knicks and\r\nthe knacks.\n@c0@"
  es: "@aSancho@b¿Sabes?, pues al principio no creía que la gente fuera a venire hasta tan lejos para ver las cosinas, nomás.\n@c0@"
  fr: "@aSancho@bTu sais, au début, je ne p-p-pensais pas que les gens allaient venir de si loin pour voir notre\r\nb-b-bric-à-brac.\n@c0@"
  it: "@aSancho@b¡No piensavo que el Museo del Souvenir avrebbe riscosso tantos successos!\n@c0@"
  ja: "@a@bサンチョ「正直　こんなところまで\n\t名産品を　見に来てくれる人がいるとは\n\tちょっと　おどろきました。\n@c0@"
16:
  de: "@aOtto@bMeint Ihr, dass der alte Firle Franz sich ganz allein um das Museum kümmert? So groß, wie es ist, muss das doch eine Menge Arbeit sein!\n@c0@"
  en: "@aTuppence@bDo you think Old Man Nick Knack handles the upkeep of the place all by himself? It must be a lot of work, what with the place being as big as it is.\n@c0@"
  es: "@aAlazar@b¿Crees que el abuelo Nino se encargará del mantenimiento el solo? Con lo grande que es esto, debe de ser un trabajo bastante duro.\n@c0@"
  fr: "@aInnocent@bVous croyez que le vieux Bricabrac se charge seul de l'entretienⓡ Ça doit être un sacré travail, vu comme c'est grand.\n@c0@"
  it: "@aSimon@bChissà se Geremia tiene in ordine il Museo da solo o se si fa aiutare da qualcuno... Pulire un edificio così grande dev'essere un lavoro faticosissimo!\n@c0@"
  ja: "@a@bピピン「ここは　あのおじいさん　ひとりで\n\t手入れしてるんでしょうか？\n\t……大変ですよね　これだけ大きいと。\n@c0@"
17:
  de: "@aBianca@bDas kommt mir hier aber gerade gar nicht wie ein Museum vor. Hier liegt irgendwas Komisches in der Luft.\n@c0@"
  en: "@aBianca@bThis place dun't feel like a museum at the minute. There's somethin' funny in the air.\n@c0@"
  es: "@aBianca@bEste sitio ahora mismo no parece un museo. Algo extraño flota en el ambiente, ¿sabes?\n@c0@"
  fr: "@aBianca@bCet endroit ne donne pas l'impression d'être un musée, pour l'instant. Il flotte quelque chose de bizarre dans l'air.\n@c0@"
  it: "@aBianca@bChe strano... A volte il Museo del Souvenir mi mette un po' di paura...\nTu non hai mai questa sensazione?\n@c0@"
  ja: "@a@bビアンカ「なんだか　博物館とは\n\t思えない　ものものしい空気が\n\tながれてるわよね……。\n@c0@"
18:
  de: "@aNera@bAll diese gruseligen Ausstellungsstücke... Mir ist, als würden sie mich ankreischen. Und am liebsten würde ich zurückkreischen!\n@c0@"
  en: "@aNera@bAll these scary exhibits... I feel like they're screaming at me. And it makes me want to scream back!\n@c0@"
  es: "@aNera@bTutti esas cosinas terroríficas... Siento come si me gritaran. Y me entran ganas de gritar.\n@c0@"
  fr: "@aNera@bTous ces objets effrayants... J'ai l'impression de les entendre hurler. Et ça me donne envie de hurler aussi, mais de peurⓠ\n@c0@"
  it: "@aNera@bTutti questi souvenir spaventosi mi mettono un po' a disagio... Ho quasi l'impressione che mi fissino e mi vogliano sbranare!\n@c0@"
  ja: "@a@bフローラ「なんだか　こわい名産品どうしが\n\t共鳴を　起こしているような気がして\n\tしかたがないですわ……。\n@c0@"
19:
  de: "@a%0%a001240@bDie Leute, die jetzt hier sind, sind ganz anders als unsere üblichen Besucher, findest du nicht?\n@c0@"
  en: "@a%0%a001240@bThe people here at the moment aren't like the normal visitors we get, are they?\n@c0@"
  es: "@a%0%a001240@bLa gente que hay ahora mismo, no son los visitantes habituales, ¿verdad?\n@c0@"
  fr: "@a%0%a001240@bLes visiteurs qu'on a en ce moment ne ressemblent pas exactement à ceux qu'on a d'habitude, heinⓡ\n@c0@"
  it: "@a%0%a001240@bMi sembra che i visitatori che sono qui in questo momento siano diversi da quelli che vengono al Museo di solito...\n@c0@"
  ja: "@a@b%a001240「いつものお客さんとは\n\tちょっと　ちがうお客さんが\n\t来てるみたいだね。\n@c0@"
20:
  de: "@a%0%a001250@bPapa, findest du nicht, wir sollten etwas anderes ausstellen?\n@c0@"
  en: "@a%0%a001250@bDad, don't you think we should put some different things on display?\n@c0@"
  es: "@a%0%a001250@b¿No crees que deberíamos poner algo distinto en la exhibición, papi?\n@c0@"
  fr: "@a%0%a001250@bPapa, tu ne crois pas qu'on devrait exposer\nautre choseⓡ\n@c0@"
  it: "@a%0%a001250@bUhm, forse dovremmo cambiare almeno qualcuno degli oggetti in esposizione...\n@c0@"
  ja: "@a@b%a001250「ねえ　お父さん。\n\tやっぱり　あの名産品のならべ方\n\tやめたほうが　いいかも……。\n@c0@"
21:
  de: "@aSancho@bEs kommt mir gerade nisst wie ein Museum vor, weißt du.\n@c0@"
  en: "@aSancho@bEes no feeling like the museum at the moment, you know.\n@c0@"
  es: "@aSancho@bEsto ahora mismo pues ni parece museo ni nada.\n@c0@"
  fr: "@aSancho@bLe musée me d-d-donne oune drôle d'impression\r\nen ce moment, tu sais.\n@c0@"
  it: "@aSancho@bQue sensación estrana...\nMe pare que el Museo sia avvolto da un'atmosfera inquietantes...\n@c0@"
  ja: "@a@bサンチョ「なにやら\n\t博物館らしからぬ雰囲気に\n\tなっているような気がしますね。\n@c0@"
22:
  de: "@aOtto@bIch hab den Eindruck, viele Besucher wollen sich hier net nur die Ausstellungsstücke anschau'n, wenn Ihr wisst, was ich mein'.\n@c0@"
  en: "@aTuppence@bI get the feeling a lot of these visitors aren't\r\nhere simply to look at the exhibits, if you know\r\nwhat I mean.\n@c0@"
  es: "@aAlazar@bMe da la sensación de que muchos de estos visitantes no están aquí solo para ver la exposición, no sé si me entendéis.\n@c0@"
  fr: "@aInnocent@bJ'ai l'impression que beaucoup de ces visiteurs ne sont pas là simplement pour admirer la collection,\r\nsi vous voyez ce que je veux dire.\n@c0@"
  it: "@aSimon@bNon so come spiegarlo, ma ho come l'impressione che alcuni visitatori non siano qui solo per ammirare i souvenir esposti...\n@c0@"
  ja: "@a@bピピン「今日は　どうも　名産品を\n\tただ見に来たとは思えないような\n\tお客さんが　多いような気がします。\n@c0@"
23:
  de: "@aBianca@bHier drin gibt es nur einen Platz, um etwas auszustellen. Der sollte für etwas ganz Besonderes reserviert werden.\n@c0@"
  en: "@aBianca@bThere's only one spot to put somethin' on display in here. It'll have to be somethin' really special.\n@c0@"
  es: "@aBianca@bAquí solo hay un expositor donde colocar algo. Tendrá que ser algo muy especial, ¿sabes?\n@c0@"
  fr: "@aBianca@bIl n'y a qu'un seul endroit où placer un objet en exposition, dans cette salle. Il faut que ce soit vraiment quelque chose de spécial.\n@c0@"
  it: "@aBianca@bQui c'è un solo posto dove esporre un oggetto.\nSuggerisco di metterci un souvenir davvero speciale!\n@c0@"
  ja: "@a@bビアンカ「ここには　名産品を置く台座が\n\t１つしかないのね。\n\tとっておきの名産を　置くのかしら。\n@c0@"
24:
  de: "@aNera@bDas hier oben ist wie ein Sonderausstellungsraum, nicht? Wir sollten ein Stück suchen, das genau hierher passt, was meinst du?\n@c0@"
  en: "@aNera@bIt's like a special display room up here, isn't it?\nI suppose we'd better find an exhibit that fits the setting, hadn't we?\n@c0@"
  es: "@aNera@bSembra que esta es una sala de exposición especial, ¿verdad?\n㈡\nSupongo que será mejor trovare una cosina que sea digna de este entorno, ¿vero?\n@c0@"
  fr: "@aNera@bOn dirait une salle réservée aux objets très spéciaux. Je suppose qu'il va nous falloir trouver quelque chose de vraiment remarquable à exposer ici.\n@c0@"
  it: "@aNera@bQuesta sembra essere una sala speciale.\r\nCredo che dovremmo esporvi un souvenir di gran pregio, che non stoni con l'esclusività dell'ambiente...\n@c0@"
  ja: "@a@bフローラ「特別展示室のような\n\t造りですわ。　それなりの名産品を\n\t置かなければ　いけませんわね。\n@c0@"
25:
  de: "@a%0%a001240@bDieser Raum muss kleiner sein als die unten, aber er wirkt richtig groß.\n@c0@"
  en: "@a%0%a001240@bThis room must be smaller than the ones below,\nbut it feels really big.\n@c0@"
  es: "@a%0%a001240@bEsta sala es más pequeña que las de abajo, pero da una sensación de grandeza.\n@c0@"
  fr: "@a%0%a001240@bCette pièce doit être plus petite que celles des étages inférieurs, mais elle paraît quand même immense.\n@c0@"
  it: "@a%0%a001240@bQuesta sala è sicuramente più piccola di quelle di sotto, eppure dà l'impressione di essere immensa!\n@c0@"
  ja: "@a@b%a001240「１階よりも小さい　お部屋の\n\tはずなのに　すごく大きく見えるよ。\n@c0@"
26:
  de: "@a%0%a001250@bDieser Raum hat etwas Besonderes. In ihm herrscht irgendwie eine ganz spezielle Atmosphäre.\n@c0@"
  en: "@a%0%a001250@bThere's something special about this room.\nIt feels different somehow.\n@c0@"
  es: "@a%0%a001250@bEsta sala tiene un algo especial.\nDe algún modo, es diferente.\n@c0@"
  fr: "@a%0%a001250@bIl y a quelque chose de particulier dans cette salle. Elle donne une impression étrange.\n@c0@"
  it: "@a%0%a001250@bChe strano...\nQuesta sala sembra diversa dalle altre, anche se non saprei dire in cosa...\n@c0@"
  ja: "@a@b%a001250「ここの部屋に\n\t流れてる空気って　ほかの\n\tお部屋と　ちがう感じがする。\n@c0@"
27:
  de: "@aSancho@bDas ist ein sehr schöner Raum. Es hat sisser lange gedauert und viel gekostet, diesen Bau zu errissten, nisst?\n@c0@"
  en: "@aSancho@bEes a very beautiful room. Eet must take a\r\nlong time and a lot of work to make thees\r\nplace, eh?\n@c0@"
  es: "@aSancho@bEs una sala bien bella. Debe de llevar tremendo tiempo y trabajo construir algo así.\n@c0@"
  fr: "@aSancho@bC'est oune salle v-v-vraiment magnifique. Ça a dû prendre du temps et b-b-beaucoup de travail pour la construire, noⓡ\n@c0@"
  it: "@aSancho@b¡Esto edificio es fantastico!\n¡L'architetto que l'ha progettato deve essere una persona muy en gamba!\n@c0@"
  ja: "@a@bサンチョ「おもむきのある　お部屋ですね。\n\t造るのに　てまひまが\n\tかかったことでしょう。\n@c0@"
28:
  de: "@aOtto@bHier solltet Ihr etwas ausstellen, das die Besucher wirklich beeindruckt, bevor sie wieder gehen.\n@c0@"
  en: "@aTuppence@bYou want to put something on display here that really leaves an impression on people before\r\nthey leave.\n@c0@"
  es: "@aAlazar@bTe dan ganas de poner algo que impresione de verdad a la gente antes de que se marche.\n@c0@"
  fr: "@aInnocent@bIci, il faut exposer une pièce qui impressionne vraiment les visiteurs juste avant leur départ.\n@c0@"
  it: "@aSimon@bQuesta sala è così bella che non basterà esporre un souvenir che susciti un ⓕOoohhh!ⓖ di ammirazione.\n㈡\nNe serve uno che faccia dire almeno ⓕOoooooohhhhh!!!ⓖ\n@c0@"
  ja: "@a@bピピン「ここに置かれた　名産品を見て\n\tお客さんたちに　満足して\n\t帰ってもらえるように　したいですね。\n@c0@"
29:
  de: "@aBianca@bIm Dunkeln ist es hier drin ein bisschen unheimlich, was?\n@c0@"
  en: "@aBianca@bIt's a bit creepy in the dark in here, eh?\n@c0@"
  es: "@aBianca@bAquí, en lo oscuro, da un poco de miedo ¿eh?\n@c0@"
