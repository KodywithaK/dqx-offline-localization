  ja: "@a@bデボラ「私にも　よく分からないわね。\n\tあんなものに　打ち込めるのは。\n@c0@"
147:
  de: "@aGriselda@bDa ist was dran. Die Welt ist wirklich seltsam.\n@c0@"
