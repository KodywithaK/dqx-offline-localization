  fr: "@aNera@bAlors c'est ici que sont conservés les objets qui ne sont pas exposés.\n@c0@"
  it: "@aNera@bQuesto dev'essere il deposito dove sono custoditi i souvenir che non sono esposti...\n@c0@"
  ja: "@a@bフローラ「展示しない　名産品は\n\tここに　しまっておくんですね。\n@c0@"
31:
  de: "@a%0%a001240@bHier unten ist es schön kühl, nicht?\n@c0@"
  en: "@a%0%a001240@bIt's nice and cool down here, isn't it?\n@c0@"
  es: "@a%0%a001240@bAquí abajo se está bien y fresquito, ¿verdad?\n@c0@"
  fr: "@a%0%a001240@bIl fait bon, là en bas, heinⓡ\n@c0@"
  it: "@a%0%a001240@bChe bello questo posto!\n@c0@"
  ja: "@a@b%a001240「地下の物置って\n\tひんやりしてるね。\n@c0@"
32:
  de: "@a%0%a001250@bEs ist schade um die Stücke hier unten, findest du nicht? Ich meine, es ist so dunkel und kalt.\n@c0@"
  en: "@a%0%a001250@bIt's a shame for the exhibits down here, don't you think? I mean, it's so dark and cold.\n@c0@"
  es: "@a%0%a001250@bEs una pena que haya que dejar cosinas aquí abajo, ¿no crees? Bueno, es que hace tanto frío y está tan oscuro.\n@c0@"
  fr: "@a%0%a001250@bC'est dommage de conserver des objets ici,\ntu ne crois pasⓡ Il fait si sombre et si froid.\n@c0@"
  it: "@a%0%a001250@bPoverini, questi souvenir! Sono chiusi in questa stanza buia e fredda mentre i loro ⓕcolleghiⓖ esposti ricevono gli sguardi ammirati dei visitatori...\n@c0@"
  ja: "@a@b%a001250「ここに置かれた名産品って\n\tちょっと　かわいそうかな。\n\tくらいし　寒いし……。\n@c0@"
33:
  de: "@aSancho@bRiessst du das Wasser hier unten? Sí. Es liegt viel Feusstigkeit in der Luft.\n@c0@"
  en: "@aSancho@bYou esmell the water down here?\nSí. There ees muchos moisture een the air.\n@c0@"
  es: "@aSancho@b¿Hueles la humedad aquí abajo?\r\n¡Ándale! Aquí hay tremenda humedad en el aire.\n@c0@"
  fr: "@aSancho@bTu sens cette odeur, chicoⓡ Si, il y a b-b-beaucoup d'houmidité dans l'air, ici.\n@c0@"
  it: "@aSancho@b¡Caramba, que umidità que ce está aquí!\nEsperiamo que a los souvenir no vengano los reumatismos...\n@c0@"
  ja: "@a@bサンチョ「水の　においがします。\n\tしっけが　多いんですね。\n@c0@"
34:
  de: "@aOtto@bEin ganz schön großer Lagerraum, net wahr? So groß wie ein Burgverlies.\n@c0@"
  en: "@aTuppence@bIt's a big storeroom, isn't it?\nAs big as a castle vault, this.\n@c0@"
  es: "@aAlazar@bEs un almacén bastante grande, ¿verdad?\r\nTan grande como la cámara de un castillo.\n@c0@"
  fr: "@aInnocent@bC'est une grande réserve, heinⓡ Au moins aussi vaste que la chambre forte d'un château.\n@c0@"
  it: "@aSimon@bAccidenti, questo deposito è enorme!\nSembra persino più grande della sala del tesoro del Castello di Denim!\n@c0@"
  ja: "@a@bピピン「広いですね。　ここの物置は\n\tお城の倉庫なみに大きいですよ。\n@c0@"
35:
  de: "@aBianca@bIch wette, der alte Mann wollte hier schlafen und das Museum selbst führen.\n@c0@"
  en: "@aBianca@bI'll bet the old man planned on sleepin' here and runnin' the museum himself.\n@c0@"
  es: "@aBianca@bEstoy segura de que el abuelo planeaba dormir aquí y gestionar él mismo el museo, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe parie que le vieil homme a prévu de dormir ici et de diriger lui-même le musée.\n@c0@"
  it: "@aBianca@bScommetto che il vecchio Geremia aveva in mente di usare questa stanza per schiacciare un pisolino di quando in quando!\n@c0@"
  ja: "@a@bビアンカ「きっと　おじいさんは\n\tここに寝泊まりして\n\t自分で　館長をするつもりだったのね。\n@c0@"
36:
  de: "@aNera@bDas ist ein sehr ordentliches Zimmer, nicht? Ich hätte gedacht, hier drin würde es mehr Dinge geben, die mit der Ausstellung zu tun haben.\n@c0@"
  en: "@aNera@bThis is a very neat room, isn't it? I thought there'd be more things in here to do with the exhibits.\n@c0@"
  es: "@aNera@bEste cuarto está veramente limpio. Pensaba que habría más cosas relacionadas con las cosinas aquí.\n@c0@"
  fr: "@aNera@bCette pièce est très bien rangée, nonⓡ J'aurais cru qu'il y aurait plus de choses en rapport avec les pièces exposées.\n@c0@"
  it: "@aNera@bOh, ma che carina questa stanza!\n@c0@"
  ja: "@a@bフローラ「わりと　すっきりした\n\tお部屋ですわね。　もっと名産品に\n\t関する物があるのかと思いましたけど。\n@c0@"
37:
  de: "@a%0%a001240@bToll! Das ist wie eine Geheimkammer, die unter der Treppe verborgen ist.\n@c0@"
  en: "@a%0%a001240@bCool! This is like a secret room, hidden away under the stairs.\n@c0@"
  es: "@a%0%a001240@b¡Genial! Esto es como una habitación secreta, oculta bajo las escaleras.\n@c0@"
  fr: "@a%0%a001240@bSuperⓠ C'est comme une pièce secrète, cachée sous l'escalier.\n@c0@"
  it: "@a%0%a001240@bChe forte questa stanza!\nSembra quasi un nascondiglio segreto nascosto sotto le scale!\n@c0@"
  ja: "@a@b%a001240「階段の下の　お部屋って\n\tかくれ家みたいで　おもしろいよね。\n@c0@"
38:
  de: "@a%0%a001250@bBestimmt hört man die Leute die Treppe hoch- und runterlaufen.\n@c0@"
  en: "@a%0%a001250@bI bet you can hear whenever people go up and down the stairs.\n@c0@"
