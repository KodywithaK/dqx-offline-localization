  de: "@aGriselda@b%0%a000090! Du... Du beäugst sie doch wohl nicht etwa, was?! Nein, das lässt du auch besser bleiben!\n@c0@"
  en: "@aDebora@b%0%a000090! You're not...looking at her, are you!?\nNo, you'd know better than that, wouldn't you?\n@c0@"
  es: "@aStefania@b¡%0%a000090! N-no la... estarás mirando, ¿no?\nImposibile, sabes lo que te conviene, ¿no?\n@c0@"
  fr: "@aPandora@b%0%a000090ⓠ \nTu ne la... regardes pas, n'est-ce pasⓡⓐ\nNon, tu sais que tu n'as pas intérêt, heinⓡ\n@c0@"
  it: "@aViola@b%0%a000090, so bene che non stai guardando quella ragazza con occhi colmi di desiderio...\n㈡\nDel resto, hai accanto a te la donna più bella del mondo. Perché mai dovresti ammirare una ragazzetta mal vestita come lei?\n@c0@"
  ja: "@a@bデボラ「ちょっと　%a000090。\n\tまさか　あんた　あんな娘に\n\tみとれてなんて　いないでしょうね！？\n@c0@"
155:
  de: "@aGriselda@bDas ist wohl der Einfluss des Museums... Es macht die Leute ein bisschen gaga.\n@c0@"
  en: "@aDebora@bThis place seems to do that to people...\nIt makes them go a bit loopy.\n@c0@"
  es: "@aStefania@bEste lugar parece tener ese efecto en la gente.\nVeramente, se empiezan a repetir.\n@c0@"
  fr: "@aPandora@bApparemment, c'est cet endroit qui fait ça aux gens. Ça les rend un peu dingues.\n@c0@"
  it: "@aViola@bSolo esercitandosi di continuo si può raggiungere l'eccellenza! Hai capito? Esercitati senza sosta a servirmi e riverirmi e diventerai un marito perfetto!\n@c0@"
  ja: "@a@bデボラ「いるのよね～　たまに。\n\tこういうところで　変に\n\tかんがいに　ふける人って。\n@c0@"
156:
  de: "@aGriselda@bWas soll denn hier unheimlich sein?\n@c0@"
  en: "@aDebora@bWhat's there to be scared about?\n@c0@"
  es: "@aStefania@b¿De qué hay que asustarse?\n@c0@"
  fr: "@aPandora@bQu'est-ce qui peut bien être effrayant, iciⓡ\n@c0@"
  it: "@aViola@bCosa ci sarà mai di tanto terrificante al Museo del Souvenir, eh?!\n@c0@"
  ja: "@a@bデボラ「あんなもの　ぜんぜん\n\tこわくなんか　ないわよ！\n@c0@"
157:
  de: "@aGriselda@bAber ich sehe schon, dir ist auch nicht ganz wohl dabei, %a000090, also werde ich dich begleiten, wenn wir jemals nachts hierherkommen müssen.\n@c0@"
  en: "@aDebora@bStill, I can see you're not entirely comfortable with it either, %a000090, so I'll escort you if we ever have to come here at night.\n@c0@"
  es: "@aStefania@bAunque veo que no estás del todo cómodo, %a000090, así que te accompañaré si tenemos que venir aquí de notte.\n@c0@"
  fr: "@aPandora@bEnfin, je vois que toi non plus, tu n'es pas tout à fait à l'aise, %a000090, alors je t'accompagnerai si jamais tu dois venir ici de nuit.\n@c0@"
  it: "@aViola@bAh, ho capito!\nQuella donna deve aver visto il caro Geremia...\nIh ih ih ih ih!\n@c0@"
  ja: "@a@bデボラ「でも　%a000090。　あんたは\n\t苦手そうだから　夜に入るときは\n\t一緒に　入ってあげても　いいわよ。\n@c0@"
158:
  de: "@aGriselda@bKeine Sorge. Der Kurator ist definitiv in festen Händen. Aber um das mal klarzustellen: Das ist bestimmt das übelste Flitterwochenziel aller Zeiten!\n@c0@"
  en: "@aDebora@bNo need to worry. The curator is most definitely off-limits. But for the record, this is the worst honeymoon destination in history!\n@c0@"
  es: "@aStefania@bNo tiene por qué preocuparse. El gestor está en buenas manos.\n㈡\n¡Ma que conste que este es el peor destino de luna di miele del mundo!\n@c0@"
  fr: "@aPandora@bIl n'y a pas à s'inquiéter. Le conservateur est totalement hors d'atteinte. En revanche, c'est la pire destination de lune de miel de l'histoireⓠ\n@c0@"
  it: "@aViola@bQuell'uomo può stare tranquillo: mi assicurerò io stessa che sua moglie non si interessi ulteriormente al direttore del Museo del Souvenir...\n@c0@"
  ja: "@a@bデボラ「展示品じゃなくて\n\t博物館って選択そのものが\n\tまちがいに決まってるわよ。\n@c0@"
159:
  de: "@aGriselda@bEine gewisse Schönheit? Redet er von mir? Muss er ja wohl, wenn es um Schönheit geht.\n@c0@"
  en: "@aDebora@bA certain beauty? Could he be talking about me?\r\nI'm certainly a beauty.\n@c0@"
  es: "@aStefania@b¿La belleza? ¿Estará parlando di me?\r\nDesde luego, soy una belleza.\n@c0@"
  fr: "@aPandora@bUn certaine beautéⓡ Est-ce qu'il serait en train de parler de moiⓡ Je suis certainement une beauté.\n@c0@"
  it: "@aViola@bIo sono senz'altro affascinante, ma non sono un souvenir. Se lo fossi, i visitatori non guarderebbero che me, e trascurerebbero gli oggetti...\n@c0@"
  ja: "@a@bデボラ「まがまがしさの中に\n\t一種の美？　私には\n\tそういうのは　わからないわよ。\n@c0@"
160:
  de: "@aGriselda@bWie kann er das sagen?! Weiß er denn nicht, was ich alles durchgemacht habe, um diesen ganzen K... um all diese wertvollen Stücke zu sammeln?\n@c0@"
  en: "@aDebora@bHow can he just stand there and say that!?\r\nDoesn't he know the hardships I've been through\r\nto collect all these, these...things?\n@c0@"
  es: "@aStefania@b¿Cómo puede quedarse ahí y decir eso?\r\n¿No sabe tutto lo que he pasado para reunir todas estas... cosas?\n@c0@"
  fr: "@aPandora@bComment peut-il dire ça comme çaⓡⓐ Il ne sait donc pas tout ce qu'on a dû endurer pour récolter toutes ces... chosesⓡ\n@c0@"
  it: "@aViola@bVisitare un museo arricchisce lo spirito, amplia le conoscenze e allarga gli orizzonti culturali!\nNon è certo una cosa frivola!\n㈡\nNon ci trovo nulla di male a farlo in tempi difficili come quelli che stiamo attraversando...\n@c0@"
  ja: "@a@bデボラ「のんき　とか言われてるわよ！\n\tまったく　どれだけ　集めるのが大変か\n\t教えてあげたいわね！！\n@c0@"
161:
  de: "@aGriselda@bDer muss ja mindestens quer durchs Meer geschwommen sein, so abgerissen, wie er aussieht!\n@c0@"
  en: "@aDebora@bHe must have swum across the ocean to end up looking as terrible as that!\n@c0@"
  es: "@aStefania@b¡Debe de haber nadado todo el mare para terminar así!\n@c0@"
  fr: "@aPandora@bIl a dû traverser l'océan à la nage pour finir\ndans un état pareilⓠ\n@c0@"
  it: "@aViola@bSanta dea!\nAvrà come minimo attraversato l'oceano a nuoto, per essersi ridotto tanto male!\n@c0@"
  ja: "@a@bデボラ「あんなに　ボロボロになるなんて\n\t海を　泳いで　わたってきたわけ？\n@c0@"
162:
  de: "@aGriselda@bNicht alles hier ist furchterregend...\n@c0@"
  en: "@aDebora@bThey're not all frightening...\n@c0@"
  es: "@aStefania@bNo dan miedo.\n@c0@"
  fr: "@aPandora@bIl ne sont pas effrayants du tout...\n@c0@"
  it: "@aViola@bMa no che non sono spaventosi...\n@c0@"
  ja: "@a@bデボラ「別に　全部が全部\n\tおそろしいわけじゃ　ないはずだけど……\n@c0@"
163:
  de: "@aGriselda@bObwohl, wenn man durch meine Schönheit geblendet ist, wirkt wohl alles andere nur noch furchtbar.\n@c0@"
  en: "@aDebora@bAlthough, having been blinded by my beauty, everything else probably looks awful.\n@c0@"
  es: "@aStefania@bAunque, tras quedar cegado por la mia bellezza, todo parece horroroso.\n@c0@"
  fr: "@aPandora@bQuoique, une fois qu'on a été ébloui par ma beauté, tout le reste doit paraître horrible, effectivement.\n@c0@"
  it: "@aViola@bAl limite, possono essere considerati brutti.\nDel resto, tutte le cose esistenti al mondo sembrano brutte, se paragonate al mio fascino sfolgorante...\n@c0@"
  ja: "@a@bデボラ「まあ　ここを見たら\n\tそう思うのも　仕方ないわね。\n@c0@"
164:
  de: "@aGriselda@bIch raube Euch ja nicht gern Eure Illusionen, aber Ihr wirkt auch nicht gerade sehr vertrauenerweckend.\n@c0@"
  en: "@aDebora@bI hate to break it to you, but you're not the most trustworthy-looking man yourself.\n@c0@"
  es: "@aStefania@bVeramente, no eres el uomo de aspecto más digno de confianza que conozco.\n@c0@"
  fr: "@aPandora@bDésolé d'avoir à vous le dire comme ça,\r\nmon vieux, mais vous n'inspirez pas\r\ntellement confiance vous-même.\n@c0@"
  it: "@aViola@bSe qualcuno si azzardasse a tentare un furto al Museo, gli sguinzaglierei contro il mio fedele cane da guardia. Che poi saresti tu, %a000090.\n@c0@"
  ja: "@a@bデボラ「そういう　あんたのかっこうも\n\tじゅうぶん　あやしいわよ！\n@c0@"
165:
  de: "@aGriselda@bHier laufen derart viele verdächtige Gesellen herum, dass man kaum noch abschätzen kann, vor wem man sich in Acht nehmen muss und vor wem nicht.\n@c0@"
  en: "@aDebora@bWith so many shifty-looking types loitering about the place, it's impossible to tell who you need to look out for and who you don't.\n@c0@"
  es: "@aStefania@bCon tantos tipos de pinta intimidatoria por aquí, veramente es imposible saber a quién tienes que vigilar y a quién no.\n@c0@"
  fr: "@aPandora@bAvec autant de personnages louches qui traînent dans cet endroit, impossible de dire de qui il faut se méfier ou non.\n@c0@"
  it: "@aViola@bBah, con tutti i mostri spaventosi che ci sono in giro, non sarà certo qualche tipo losco a impensierirci!\nDico bene, caro?\n@c0@"
  ja: "@a@bデボラ「これだけ　あやしい客が\n\t多いと　どいつが　あぶないか\n\tわからなくなるわ。\n@c0@"
166:
  de: "@aGriselda@bWer im Namen der Göttin ist das? Meinst du, er ist von einem Monster besessen?\n@c0@"
  en: "@aDebora@bWho in the name of the Goddess is that?\r\nHas he been possessed by a monster, do you think?\n@c0@"
  es: "@aStefania@b¿Quién es ese, en nombre de la Diosa?\r\n¿Crees que ha sido poseído por un mostro?\n@c0@"
  fr: "@aPandora@bMais au nom de la Déesse, qui est-ceⓡ\nTu crois qu'il est possédé par un monstreⓡ\n@c0@"
  it: "@aViola@bMa chi è quel tipo?!\nNon sarà mica posseduto da uno spirito malvagio?!\n@c0@"
  ja: "@a@bデボラ「なに　こいつ？\n\t魔物にでも\n\tとりつかれてるんじゃないの？\n@c0@"
167:
  de: "@aGriselda@bWenn du solche Leute ins Museum lässt, ist der Ärger schon vorprogrammiert, weißt du.\n@c0@"
  en: "@aDebora@bIf you're going to let people like that into the place, you're asking for trouble, you know.\n@c0@"
  es: "@aStefania@bSi vas a dejar entrar a tipejos así, vas a tener problemas... ¿capisci?\n@c0@"
  fr: "@aPandora@bEn laissant entrer des gens comme ça dans cet endroit, tu cherches les ennuis, tu sais.\n@c0@"
  it: "@aViola@bIo un tipo come quello non l'avrei mai fatto entrare al Museo... Ma lo vedi come si comporta?!\nSembra l'abbia morso una tarantola!\n@c0@"
  ja: "@a@bデボラ「ああいう人が　入り込んでるなんて\n\tこの博物館　大丈夫かしらね。\n@c0@"
168:
  de: "@aGriselda@bIhr glaubt, Ihr bildet Euch das ein, aber wenn Ihr die Experten fragt, werden sie Euch sagen, dass Ihr... recht habt!\n@c0@"
  en: "@aDebora@bYou think you're imagining these things, but ask the experts and they'll tell you... They're real!\n@c0@"
  es: "@aStefania@bCrees que son imaginaciones tuyas, ma pregunta a los espertos y te lo dirán: ¡son reales!\n@c0@"
  fr: "@aPandora@bOn croit qu'on imagine toute ces choses, mais demande un peu aux spécialistes, et ils te le diront... Elles existent vraimentⓠ\n@c0@"
  it: "@aViola@bE se il sacerdote avesse ragione?\n㈡\nCredevo che la mia fosse solo un'impressione, ma forse qualcuno dei souvenir esposti è davvero contaminato da un potere malvagio...\n@c0@"
  ja: "@a@bデボラ「気のせいだと　思ってたけど\n\t本職に　言われると\n\tやっぱり　そうなのよね。\n@c0@"
169:
  de: "@aGriselda@bWer ist denn das Landei, und woher weiß er von der Katastrophäe?\n@c0@"
  en: "@aDebora@bWho is that bumpkin, and how does he know about the Catas Trophy?\n@c0@"
  es: "@aStefania@bMa, ¿quién es ese gañán, y cómo sabe del Catastrofeo?\n@c0@"
  fr: "@aPandora@bQui est ce péquenaud et comment connaît-il\nle Catas Trophéeⓡ\n@c0@"
  it: "@aViola@bMa chi è quel tipo?!\nCome fa a conoscere il Catas Trofeo?!\n@c0@"
  ja: "@a@bデボラ「トロフィーのことを\n\t知っているって　あの人　何者？\n@c0@"
170:
  de: "@aGriselda@bStimmt, es passt nicht ganz hierher. Aber ich frage mich, was besser passen würde...\n@c0@"
  en: "@aDebora@bIt doesn't quite fit, it's true. But what would be the right exhibit, I wonder...\n@c0@"
  es: "@aStefania@bNo encaja, è vero. Ma dime tú dónde poner algo así...\n@c0@"
  fr: "@aPandora@bC'est vrai que ça ne va pas vraiment, ici. Mais quelle serait la pièce adéquateⓡ Je me le demande.\n@c0@"
  it: "@aViola@bPotremmo anche pensare di esporre un altro oggetto, ma quale?\nTi viene in mente qualcosa, caro?\n@c0@"
  ja: "@a@bデボラ「ここだけ　なんか浮いてるのよね。\n\tふさわしいものって　なにかしら？\n@c0@"
171:
  de: "@aGriselda@bEin Firlefanz-Experte? Dann ist er bestimmt reich! Nicht so reich wie Papa natürlich, aber...\n@c0@"
  en: "@aDebora@bAn expert in knick-knacks? Then he must be rich!\r\nNot as rich as Papa, of course, but still...\n@c0@"
  es: "@aStefania@b¿Un experto en cosinas? ¡Entonces debe de ser rico!\nNo tanto como il mio papino, claro, ma...\n@c0@"
  fr: "@aPandora@bUn expert en objets de collectionⓡ Alors il doit être richeⓠ Pas autant que papa, bien sûr, mais quand même...\n@c0@"
  it: "@aViola@bQuesto tipo sarà davvero un esperto in souvenir, o è solo un fanfarone?\nQuasi quasi direi di metterlo alla prova...\n@c0@"
  ja: "@a@bデボラ「金持ち？　うちのパパと\n\t張り合えるだけの金持ちなんて\n\t聞いたことが　ないわね。\n@c0@"
172:
  de: "@aGriselda@bPah! Der hängt doch immer bloß hier rum und tut gar nichts, und jetzt will er uns erzählen, dass er so wahnsinnig beschäftigt ist?\n@c0@"
  en: "@aDebora@bHuh! He's forever hanging about here doing nothing, and he has the cheek to claim that he's the busy one!\n@c0@"
  es: "@aStefania@b¡Ja! ¡Ahí está siempre sin hacer nada y tiene la faccia tosta de decire que está ocupado!\n@c0@"
  fr: "@aPandora@bTsssⓠ Il passe son temps à traîner ici sans rien faire et il a le culot de nous dire qu'il est très occupéⓠ\n@c0@"
  it: "@aViola@bMa come si permette di ficcare il naso nelle tue scelte che, essendo supervisionate da me, non possono che essere assolutamente perfette?!\n@c0@"
  ja: "@a@bデボラ「こんな場所に　ずっと\n\tいすわってる方が\n\tよっぽど　ヒマ人よ！\n@c0@"
173:
  de: "@aGriselda@bAnfänger? Das ist ja fast schon ein Lob für dich, was? Jedenfalls besser, als Ignorant oder so was genannt zu werden. Aber sein Ton gefällt mir nicht...\n@c0@"
  en: "@aDebora@bAn amateur!? That's practically praise for you, isn't it? Better than being called ignorant or something. Still, I don't like his tone...\n@c0@"
  es: "@aStefania@b¿Aficionado? Eso es casi un plauso per te, ¿no? Es mejor que ignorante, o algo así. Aunque no me gusta su tono...\n@c0@"
  fr: "@aPandora@bUn amateurⓡⓐ C'est presque un compliment pour toi, n'est-ce pasⓡ C'est mieux que de se faire traiter d'ignorant, par exemple.\n㈡\nIl n'empêche que je n'aime pas le ton\nsur lequel il nous parle.\n@c0@"
  it: "@aViola@bHa ragione, caro: sei un principiante.\nPer fortuna ci sono io a guidarti nelle tue scelte.\nNon temere, che con me non sbagli mai.\n@c0@"
  ja: "@a@bデボラ「いさぎよし！　って\n\tあんたに　ほめられても\n\tうれしくないわよ！\n@c0@"
174:
  de: "@aGriselda@bWoher will der wissen, ob sie gut gemacht sind oder nicht? Er ist entweder ein Buddelschiff-Liebhaber oder er hängt an der Flasche. Eins von beiden.\n@c0@"
  en: "@aDebora@bPah! He's transparent! He hasn't got a clue if it's well-made or not. He's just a ship in a bottle freak. Or he's on the bottle. One or the other.\n@c0@"
  es: "@aStefania@bEs transparente. No tiene ni idea de si está bien o mal hecho. Es un obseso de los barcos en bottiglia. O él le da a la bottiglia. Una de las dos.\n@c0@"
  fr: "@aPandora@bOn voit très clair dans son jeu. Il serait incapable\nde savoir si c'est bien fait ou non. C'est juste un\nfou de bateaux en bouteille.\n㈡\nOu alors, un fou de la bouteille tout court.\nL'un ou l'autre.\n@c0@"
  it: "@aViola@bLe navi in bottiglia esposte qui al Museo sono le più graziose del mondo! Le ho scelte io, quindi non potrebbe essere diversamente...\n@c0@"
  ja: "@a@bデボラ「なんだかんだ　言って\n\t実は　ボトルシップが\n\t気になってるんじゃないのかしら？\n@c0@"
175:
  de: "@aGriselda@bAber das ist ein Stein, der von einem megaberühmten Schmuckfachmann geschnitten wurde.\n@c0@"
  en: "@aDebora@bBut this is a gem cut by a super-famous jeweller.\n@c0@"
  es: "@aStefania@bPero esta es una pietra prezziosa tallada por un celebérrimo joyero.\n@c0@"
  fr: "@aPandora@bMais c'est une pierre taillée par un joaillier\r\nhyper célèbre.\n@c0@"
  it: "@aViola@bCredi davvero che possegga pietre preziose più belle di questa?\n@c0@"
  ja: "@a@bデボラ「宝石は宝石でも\n\t伝説の　名工が加工した　宝石よ。\n@c0@"
176:
  de: "@aGriselda@bIch wette, das wurden Eure zu Hause nicht, oder?\n@c0@"
  en: "@aDebora@bI bet the ones you have at home weren't, were they?\n@c0@"
  es: "@aStefania@bLas que tiene ese en casa no, ¿a que no?\n@c0@"
  fr: "@aPandora@bJe parie que ce n'est pas le cas de celles qu'il a\nchez lui, heinⓡ\n@c0@"
  it: "@aViola@bSe fosse così, dobbiamo scoprire dove le ha trovate!\nLe voglio anch'io!\n@c0@"
  ja: "@a@bデボラ「あんたの家と\n\t同じなわけ　ないじゃない。\n@c0@"
177:
  de: "@aGriselda@bSie sind berühmt und basta. Muss er denn an allem was zu kritteln haben?\n@c0@"
  en: "@aDebora@bThey're famous, and that's all there is to it. Does he have to whinge about everything?\n@c0@"
  es: "@aStefania@bSon famosas, y ya está. ¿Por qué tiene que quejarse per tutto?\n@c0@"
  fr: "@aPandora@bIls sont célèbres, un point c'est tout. Il a vraiment besoin de faire des commentaires sur toutⓡ\n@c0@"
  it: "@aViola@bÈ un oggetto tipico, famoso in tutto il mondo, e in quanto tale merita un posto al Museo del Souvenir.\n㈡\nNon c'è altro da aggiungere, se non che questo tipo parla troppo, per i miei gusti.\n@c0@"
  ja: "@a@bデボラ「有名なら　それで\n\tいいじゃないのよ。　いちいち\n\t文句言わないと　気がすまないわけ？\n@c0@"
178:
  de: "@aGriselda@b%0%a000090, warum stellst du denn Sachen aus, die nicht tipptopp in Ordnung sind?\n@c0@"
  en: "@aDebora@b%0%a000090! Why are you putting exhibits on display that aren't up to scratch?\n@c0@"
  es: "@aStefania@b¡%0%a000090! ¿Por qué expones cosas que no están a la altura?\n@c0@"
  fr: "@aPandora@b%0%a000090ⓠ Pourquoi tu exposes des objets qui ne sont pas à la hauteurⓡ\n@c0@"
  it: "@aViola@b%0%a000090! Come ti salta in mente di mettere in esposizione souvenir che non sono perfettamente puliti?!\n@c0@"
  ja: "@a@bデボラ「%a000090！　なんで\n\t汚いままのを　かざるのよ！\n@c0@"
179:
  de: "@aGriselda@bHeute Abend polierst du sie, alles klar?\n@c0@"
  en: "@aDebora@bYou'll polish them tonight, got it?\n@c0@"
  es: "@aStefania@bEsta notte les das lustre, ¿capisci? \n@c0@"
  fr: "@aPandora@bTu vas faire briller ça cette nuit, comprisⓡ\n@c0@"
  it: "@aViola@bVedi di lucidare tutto a dovere stasera, altrimenti te la vedrai con me!\n@c0@"
  ja: "@a@bデボラ「夜になったら　さっさと\n\tみがきなさいよね。\n@c0@"
180:
  de: "@aGriselda@bUnd mein Service, das ich zu Hause verwende, ist bestimmt noch ein klein wenig besser als Eures, alter Angeber!\n@c0@"
  en: "@aDebora@bAnd I'd say the set I use at home is a little better than yours, you big show-off!\n@c0@"
  es: "@aStefania@b¡Y yo digo que el juego que tengo en casa es mejor que el tuyo, ostentatore!\n@c0@"
  fr: "@aPandora@bEt moi, je dirais que le service que j'utilise à la maison est encore un peu plus beau que le tien, espèce de gros crâneurⓠ\n@c0@"
  it: "@aViola@bScommetto che, se gli dicessi che a casa ne ho uno che è ancora meglio del suo, lo farei schiattare d'invidia...\n@c0@"
  ja: "@a@bデボラ「実家で　使っていた\n\tティーセットの方が　もっと　\n\tりっぱだったわよ。\n@c0@"
181:
  de: "@aGriselda@bPapa ist reich und hat auch viel Kram, aber er muss nicht immer das Beste und Größte haben. Vielleicht muss dieser Mann ja... irgendwas ausgleichen.\n@c0@"
  en: "@aDebora@bPapa is rich and owns lots of things too, but he doesn't feel the need to own the biggest and best of everything. Perhaps this man's...lacking somehow.\n@c0@"
  es: "@aStefania@bIl mio papino es rico y también tiene muchas cosas, ma no necesita tener lo mayor y lo mejor de tutto. Quizás a este hombre... le falte algo.\n@c0@"
  fr: "@aPandora@bPapa est riche et possède aussi beaucoup de choses mais il ne ressent pas le besoin d'avoir toujours le plus beau et le meilleur pour tout.\n㈡\nPeut-être que cet homme est... défaillant,\nd'une certaine manière.\n@c0@"
  it: "@aViola@bMio padre è ricco e possiede molti oggetti di gran pregio, ma non si comporta certo da bambino viziato come fa quest'essere odioso!\n@c0@"
  ja: "@a@bデボラ「うちの　パパもお金持ちだけど\n\tあんなふうに　お金に　ものを言わせて\n\tはりあったりは　しなかったわよ。\n@c0@"
182:
  de: "@aGriselda@bWie kann er denn solche Schönheit einfach achtlos abtun? Ich bin zutiefst verletzt!\n@c0@"
  en: "@aDebora@bHow can he just stand there in the presence of such beauty and not acknowledge it? I'm deeply hurt.\n@c0@"
  es: "@aStefania@b¿Cómo puede quedarse ahí ante tanta bellezza y no reconocerla? Me siento profondamente herida.\n@c0@"
  fr: "@aPandora@bComment peut-il rester ici, en présence de tant de beauté, et ne pas s'en apercevoirⓡ Je suis profondément blessée.\n@c0@"
  it: "@aViola@bIl cuore di quest'uomo è più arido della sabbia del deserto di Faraonia...\n@c0@"
  ja: "@a@bデボラ「キレイなものを見て\n\tキレイって言えないなんて……。\n@c0@"
183:
  de: "@aGriselda@bⓞOh wehⓟ? Er versucht wohl, aufrichtig zu klingen, aber... Tja, ich hab schon bessere Vorstellungen gesehen..\n@c0@"
  en: "@aDebora@bⓗWhat a shameⓘ? He's trying to sound sincere, but, well...failing miserably.\n@c0@"
  es: "@aStefania@b¿ⓕUna lástimaⓖ? Intenta parecer honesto, ma... fracasa de forma miserable.\n@c0@"
  fr: "@aPandora@bⓥC'est vraiment dommageⓦⓡ Il essaie de paraître sincère, mais... c'est un échec total.\n@c0@"
  it: "@aViola@bⓕOh, è un vero peccatoⓖ... A sentirlo parlare sembra che la cosa gli dispiaccia, ma gli leggo negli occhi che è felice che il carillon non è stato completato!\n@c0@"
  ja: "@a@bデボラ「かわいそうって\n\tバカにしてるわね。\n@c0@"
184:
  de: "@aGriselda@bIch weiß ja nicht, was für einen Kunsthandwerker er da im Sinn hat, aber unsere Spieldose kann bestimmt niemand übertrumpfen.\n@c0@"
  en: "@aDebora@bI don't know what craftsman he has in mind, but there's no way he'll be able to make something that beats ours.\n@c0@"
  es: "@aStefania@bNo sé qué artesano tendrá en mente, ma es imposible que haga algo que supere esto.\n@c0@"
  fr: "@aPandora@bJe ne sais pas à quel artisan il pense, mais il est impossible qu'il soit capable de faire quelque chose\r\nde plus beau que ce qu'on a.\n@c0@"
  it: "@aViola@bDubito che riuscirà a trovare un artigiano in grado di creare un carillon che possa competere in classe e bellezza con il nostro...\n@c0@"
  ja: "@a@bデボラ「どんな　職人かは\n\t知らないけど　あれ以上のものは\n\tぜったいに　ムリね。\n@c0@"
185:
  de: "@aGriselda@bNicht, dass ich an die Göttin und diese religiöse Salbaderei glaube. Aber ⓞprimitivⓟ ist doch nicht ganz das richtige Wort...\n@c0@"
  en: "@aDebora@bI can't say that I really believe in the Goddess and all those religious ramblings really, either.\nBut I don't think ⓗshabbyⓘ is the right word...\n@c0@"
  es: "@aStefania@bEn realità no puedo decir que crea en la Diosa y todas esas cosas religiosas.\nMa pienso que ⓕcutreⓖ no es la palabra apropiada.\n@c0@"
  fr: "@aPandora@bJe ne crois pas vraiment à la Déesse et à toutes ces divagations religieuses, moi non plus. Mais je ne pense pas que ⓥmiteuseⓦ soit le mot juste...\n@c0@"
  it: "@aViola@bMa che fa?!\nDisprezza anche il lavoro delle suore dell'Abbazia di Su'ncyel?! Quest'uomo è davveo odioso!\n@c0@"
  ja: "@a@bデボラ「まあ　私も　神とかは\n\tあんまり　信じてないけど\n\tみすぼらしいとは　思わないわよ。\n@c0@"
186:
  de: "@aGriselda@bJetzt erinnere ich mich wieder daran, dass Papa auch mal von dieser Schleimschleife gesprochen hat.\n@c0@"
  en: "@aDebora@bI remember now. Papa talked about that slime\r\ncurio too.\n@c0@"
  es: "@aStefania@bAhora ricordo. Il mio papino hablaba también de ese souvenir limoso.\n@c0@"
  fr: "@aPandora@bJe m'en souviens, maintenant. Papa aussi a parlé\r\nde cette breloque de gluants.\n@c0@"
  it: "@aViola@bSe non ricordo male, anni fa il mio paparino mi parlò della cintura degli Slime come di un oggetto raro e bellissimo.\n@c0@"
  ja: "@a@bデボラ「そういえば　パパも\n\tアレ　ほしがってたわね。\n@c0@"
187:
  de: "@aGriselda@bIch weiß nicht, warum reiche Leute es immer auf so merkwürdige Dinge abgesehen haben.\n@c0@"
  en: "@aDebora@bI don't know why rich people always seem to want such strange things.\n@c0@"
  es: "@aStefania@bNo sé por qué los ricos buscan sempre cosas tan raras.\n@c0@"
  fr: "@aPandora@bJe ne comprends pas pourquoi les gens riches semblent toujours vouloir des choses aussi bizarres.\n@c0@"
  it: "@aViola@bSì, è carina, ma non riesco a capire cos'abbia di tanto straordinario. A me sembra solo una normale cintura arricchita da qualche decorazione bizzarra...\n@c0@"
  ja: "@a@bデボラ「金持ちって　どうして\n\t変なものを　ほしがるのかしら？\n@c0@"
188:
  de: "@aGriselda@bⓞEiniges wertⓟ? Weiß er denn nicht, dass sie tausend Goldmünzen pro Stück kosten? Der hat wirklich keine Ahnung, was?\n@c0@"
  en: "@aDebora@bⓗA reasonable amount of goldⓘ!?\nDon't they sell for a thousand gold coins each?\nHe hasn't got a clue, has he?\n@c0@"
  es: "@aStefania@b¿ⓕUna respetable cantidad de oroⓖ?\nMa, ¿no se venden por mil monedas de oro la pieza?\nNo tiene ni idea, ¿eh?\n@c0@"
  fr: "@aPandora@bⓥUne belle sommeⓦⓡⓐ Pourtant, elles sont vendues mille pièces d'or chacune, nonⓡ Il n'en sait rien du tout, en fait.\n@c0@"
  it: "@aViola@bⓕVale un bel po' di soldiⓖ, eh? Pfui! Vuol farci credere di essere un esperto, ma non sa nemmeno che le navi in bottiglia costano mille monete l'una...\n@c0@"
  ja: "@a@bデボラ「まあまあって　あれ\n\t１０００ゴールドで　売ってたのよね？\n\tあの人　目利きができないんじゃないの？\n@c0@"
189:
  de: "@aGriselda@bⓞEtwas ganz Fürchterlichesⓟ? Na, der muss es ja wissen. ... Tut mir leid, %a001210, das ging nicht gegen dich.\n@c0@"
  en: "@aDebora@bⓗA frightful pestⓘ? Takes one to know one!\n...Sorry, %a001210!\n@c0@"
  es: "@aStefania@b¿ⓕUna terrible plagaⓖ? ¡Entre iguales se reconocen!\n¡Lo siento, %a001210!\n@c0@"
  fr: "@aPandora@bⓥDe sacrés rôdeursⓦⓡ C'est l'hôpital qui se fout de la charitéⓠ Euh... pardon, %a001210ⓠ\n@c0@"
  it: "@aViola@bLo spaventamostri non vale una cicca?!\nGlielo dicesse in faccia, se ne ha il coraggio!\n@c0@"
  ja: "@a@bデボラ「よほどの敵って\n\tまあ　ある意味　%a001210は\n\tよほどの敵では　あるわね。\n@c0@"
190:
  de: "@aGriselda@bIch dachte, da kommt man nur dran, wenn die Wunnermühler einen gut leiden können.\n@c0@"
  en: "@aDebora@bI thought you could only lay your hands on Zoomshine if the people of Zoomingale took a\nshine to you. Isn't that why it's called ⓗZoomshineⓘ?\n@c0@"
  es: "@aStefania@bMa creía que solo se podía conseguir telelicor si a la gente de Telele le daba un telele. ¿No es así?\n@c0@"
  fr: "@aPandora@bJe croyais qu'on ne pouvait mettre la main sur du télétord-boyaux que si les gens de Moulinsort vous avaient à la bonne.\n㈡\nEt que ça leur faisait mal au ventre de l'offrir à n'importe qui, d'où le nom.\n@c0@"
  it: "@aViola@bNon riuscirà mai a procurarsi nemmeno una bottiglia di Delizia di Milleventi...\n@c0@"
  ja: "@a@bデボラ「あれは　ルラフェンの人に\n\t認められないと　もらえない\n\t貴重な　お酒よね？\n@c0@"
191:
  de: "@aGriselda@bDann kriegt der bestimmt nie welchen in die Finger.\n@c0@"
  en: "@aDebora@bHe'll never get a case if that's the case.\n@c0@"
  es: "@aStefania@bSi es así, veramente no sé si va a conseguir un poco.\n@c0@"
  fr: "@aPandora@bSi c'est bien ça, il n'est pas près d'en avoir\r\nune caisse.\n@c0@"
  it: "@aViola@bPer ottenere certi oggetti i soldi non bastano: serve savoir-faire, cosa che questo tizio non possiede affatto...\n@c0@"
  ja: "@a@bデボラ「あの人が　もらえるとは\n\tとうてい　おもえないんだけど。\n@c0@"
192:
  de: "@aGriselda@bPapa wirft auch gern mit seinem Gold um sich, aber er macht anderen Leuten damit nicht das Leben schwer.\n@c0@"
  en: "@aDebora@bPapa likes to flash his gold about the place too, but he never makes things difficult for other people.\n@c0@"
  es: "@aStefania@bAl mio papino también le gusta exhibir su oro, ma nunca se dedica a fastidiar a los demás.\n@c0@"
  fr: "@aPandora@bPapa aussi aime bien étaler son argent, mais il ne rend jamais les choses difficiles pour les autres.\n@c0@"
  it: "@aViola@bIl mio paparino non è certo un pezzente, ma non si sognerebbe mai di sbattere la sua ricchezza in faccia agli altri in quel modo.\n@c0@"
  ja: "@a@bデボラ「うちのパパも　お金持ちだけど\n\tあんなふうに　人のことを\n\t考えない使い方は　しなかったわね。\n@c0@"
193:
  de: "@aGriselda@bBringen wir ihn doch mal in die Wüste und überlassen ihn sich selbst. Was meinst du, %a000090?\n@c0@"
  en: "@aDebora@bLet's take him to the desert and leave him there. What do you say, %a000090?\n@c0@"
  es: "@aStefania@bLlevémoslo al desierto y dejémoslo ahí. ¿Capisci, %a000090?\n@c0@"
  fr: "@aPandora@bEmmenons-le dans le désert et laissons-le là-bas. Qu'en penses-tu, %a000090ⓡ\n@c0@"
  it: "@aViola@b%0%a000090, ho avuto un'idea!\nPortiamolo nel deserto, seppelliamolo nella sabbia fino al collo e lasciamolo lì per un paio di settimane...\n@c0@"
  ja: "@a@bデボラ「ねえ　%a000090？\n\tあの人　さばくに置いてこない？\n@c0@"
194:
  de: "@aGriselda@bDann wird er schon merken, wie mühsam das ist. Wie es der Haut zusetzt. Wie einem die Nägel abbrechen. Wie einem dabei das Haar verklebt. Und, und...\n@c0@"
  en: "@aDebora@bThen he'll find out how much hard work it is...\r\nHow it damages your skin. And how your nails get broken. And how your hair gets matted. And, and...\n@c0@"
  es: "@aStefania@bEntonces sabrá el lavoro que es.\r\nCómo te deja la piel. Cómo se te rompen las uñas. Cómo se te apaga el capello. Cómo... cómo...\n@c0@"
  fr: "@aPandora@bIl comprendra peut-être combien c'est difficile... Et combien ça abîme la peau. Et combien on se casse les ongles. Et combien ça emmêle les cheveux. Et, et... \n@c0@"
  it: "@aViola@bPoi torniamo da lui e gli chiediamo quante rose ha trovato...\nAllora? Che ne dici?\n@c0@"
  ja: "@a@bデボラ「さばくのバラを　さがすのが\n\tどれだけ大変か\n\t思い知らせてやりたいわ。\n@c0@"
195:
  de: "@aGriselda@bUnd selbst wenn! Für wen hält der sich, uns das zu erzählen?\n@c0@"
  en: "@aDebora@bEven so, who's he to tell us that?\n@c0@"
  es: "@aStefania@bEn cualquier caso, ¿quién es él para decirnos algo così?\n@c0@"
  fr: "@aPandora@bEt alors, qui il est, lui, pour nous dire des trucs pareilsⓡ\n@c0@"
  it: "@aViola@bLe medaglie di cioccolato non valgono tanto, dice?\nProprio come il suo parere...\n@c0@"
  ja: "@a@bデボラ「まあ　その通りなんだけどね。\n\tでも　この人に言われると\n\tなんか　むかつくわ。\n@c0@"
196:
  de: "@aGriselda@bPapa hat mir nie eine gegeben, also ist es wohl wirklich schwierig, sie zu bekommen.\n@c0@"
  en: "@aDebora@bPapa never gave me one of them, so they must be very hard to come by indeed.\n@c0@"
  es: "@aStefania@bIl mio papino nunca me regaló una, así que debe de ser molto difficoltoso dar con ellas.\n@c0@"
  fr: "@aPandora@bPapa ne m'en a jamais offert une seule, alors elles doivent effectivement être très dures à trouver.\n@c0@"
  it: "@aViola@bSì, le maximedaglie sono oggetti incredibilmente rari!\nPensa che nemmeno mio padre ne possiede una...\n@c0@"
  ja: "@a@bデボラ「パパのところでも\n\t見たことがないから　そうとう\n\t貴重なものよね。\n@c0@"
197:
  de: "@aGriselda@bIch weiß, die kann man überall gut brauchen, nicht nur in den Bergen, aber... was will er denn damit bezwecken, allen Angestellten einen zu geben?\n@c0@"
  en: "@aDebora@bI know they can be useful all over the place, not just up in the mountains, but...what's he hoping to achieve by giving one to everybody he employs?\n@c0@"
  es: "@aStefania@bSé que pueden ser útiles en cualquier parte, no solo en las montañas, ma... ¿qué espera conseguir dando una a todos los que emplea?\n@c0@"
  fr: "@aPandora@bJe sais qu'elles peuvent être utiles partout, pas seulement en montagne, mais... À quoi ça lui sert d'en donner une à tous ceux qu'il emploieⓡ\n@c0@"
  it: "@aViola@bScusa, ma a cosa serve dare una bussola delle nevi a ciascun membro del gruppo?\nForse a soddisfare le sue manie di grandezza?\n@c0@"
  ja: "@a@bデボラ「山歩き以外にも\n\t使えるのは　わかるけど\n\t全員に持たせて　何がしたいのかしら？\n@c0@"
198:
  de: "@aGriselda@bWas war denn das für ein unechtes Lachen? Etwas dick aufgetragen, nicht wahr? Ha ha, schachmatt, Fettsack!\n@c0@"
  en: "@aDebora@bThat was a rather uneasy laugh. Do I detect a hint of a lie? Checkmate, Fatso.\n@c0@"
  es: "@aStefania@bMa, qué risa más fea. ¿Detecto un deje de falsedad? Jaque mate...\n@c0@"
  fr: "@aPandora@bIl riait plutôt jaune. Ça ne serait pas signe de mensongeⓡ Échec et mat, mon gros.\n@c0@"
  it: "@aViola@bSta mentendo spudoratamente.\nGlielo leggo negli occhi.\n@c0@"
  ja: "@a@bデボラ「なんか　ウソっぽい　わらいね。\n\tホントは　持ってないんじゃないの？\n@c0@"
199:
  de: "@aGriselda@bⓞÜberladenⓟ? Pfft. Der würde Schönheit nicht mal erkennen, wenn sie ihn ins Bein beißt. Und wenn er mich weiter ärgert, dann tut sie das auch!\n@c0@"
  en: "@aDebora@bⓗGaudyⓘ? I don't think so. The man wouldn't know beauty if it slapped him in the face. And if he keeps on annoying me, it's about to!\n@c0@"
  es: "@aStefania@b¿ⓕChabacanoⓖ? No creo. Ese es incapaz de reconocer la bellezza. ¡Y si me sigue molestando lo que va a reconocer son las stellas!\n@c0@"
  fr: "@aPandora@bⓥTape-à-l'œilⓦⓡ Tsss. Ce type ne reconnaîtrait pas la beauté même si elle le frappait au visage. Et s'il continue, c'est bien ce qui risque de lui arriverⓠ\n@c0@"
  it: "@aViola@bOra mi sto davvero innervosendo...\nSe non avessi paura di rovinarlo, gli tirerei il libro sulla capoccia!\n@c0@"
  ja: "@a@bデボラ「イヤミかしら？\n\t私は　そうは　思わないわね。\n@c0@"
200:
  de: "@aGriselda@bWenn man von einer Sache nur genügend hat, dann ist das auch was wert, sagt Papa immer.\n@c0@"
  en: "@aDebora@bIf you have enough of anything, it's worth something. That's what Papa used to say.\n@c0@"
  es: "@aStefania@bSi tienes suficiente de tutto, vas por buen camino. Eso dice il mio papino.\n@c0@"
  fr: "@aPandora@bSi on a déjà le nécessaire, ça a de la valeur.\r\nC'est ce que disait toujours papa.\n@c0@"
  it: "@aViola@b%0%a000090, cerchiamo di trovare qualche altro virgulto di Ygdrasil. Mi piacerebbe farci una bella aiuola nel giardino di casa a Mostroferrato.\n@c0@"
  ja: "@a@bデボラ「葉でも　しげっていれば\n\t価値を　みせつけられるのに。\n@c0@"
201:
  de: "@aGriselda@bBah! Männer, die den Wald vor lauter Bäumen nicht sehen, kann ich nicht ausstehen!\n@c0@"
  en: "@aDebora@bUrgh! I detest men who don't realise what's right in front of their eyes!\n@c0@"
  es: "@aStefania@b¡Agh! ¡Veramente, detesto a los hombres incapaces de reconocer las cosas obvias!\n@c0@"
  fr: "@aPandora@bBahⓠ Je déteste les hommes qui ne voient même pas\nce qui saute aux yeuxⓠ\n@c0@"
  it: "@aViola@bSolo un gruppo di ricerca in gamba come il nostro poteva trovare un vero virgulto di Ygdrasil da aggiungere alla collezione del Museo del Souvenir...\n@c0@"
  ja: "@a@bデボラ「あーあ。　モノを見る\n\t目がないって　いやーね。\n@c0@"
202:
  de: "@aGriselda@bIch hab das Gefühl, er würde Feen auch dann noch als Einbildung bezeichnen, wenn sie direkt vor seiner Nase einen Kopfstand machen würden.\n@c0@"
  en: "@aDebora@bI get the impression he'd still say faeries were a figment of the imagination even if there was one\r\nright in front of him!\n@c0@"
  es: "@aStefania@b¡Tengo la impresión de que seguiría diciendo que las hadas son imaginarias aunque tuviera una davanti!\n@c0@"
  fr: "@aPandora@bJ'ai l'impression qu'il serait capable de dire que les fées ne sont que le produit de notre imagination\nmême s'il en avait une juste sous le nezⓠ\n@c0@"
  it: "@aViola@bQuando sento commenti del genere mi passa persino la voglia di rispondere...\n@c0@"
  ja: "@a@bデボラ「きっと　妖精の村に\n\t連れて行っても　幻だとか言いそうね。\n@c0@"
203:
  de: "@aGriselda@bDen würde ich gern nach Nadiria schleppen, damit er sich mit eigenen Augen davon überzeugen kann. Dort würde er sich bestimmt wie zu Hause fühlen!\n@c0@"
  en: "@aDebora@bI'd love to take him to Nadiria and prove it to him.\r\nI'm sure he'd enjoy it there!\n@c0@"
  es: "@aStefania@bMe encantaría llevarlo a Nadiria y demostrárselo.\r\n¡Di sicuro que le gustaba!\n@c0@"
  fr: "@aPandora@bJ'aimerais bien l'emmener à Nadiria et le lui prouver.\nJe suis sûre qu'il adorerait l'endroitⓠ\n@c0@"
  it: "@aViola@bCaro, ne ho abbastanza dei commenti acidi di quest'uomo.\nDelego a te il compito di ascoltare ciò che dice.\n@c0@"
  ja: "@a@bデボラ「ホントかどうか　一度\n\t魔界に　連れて行ってあげたいわね。\n@c0@"
204:
  de: "@aGriselda@bMir gefällt zwar sein Ton nicht, aber er hat recht. Es ist wichtig, nichts zu verschwenden. Es als Schmierpapier zu verwenden ist eine gute Idee.\n@c0@"
  en: "@aDebora@bI don't like the way he's talking to us, but he's absolutely right. It's very important to recycle.\r\nUsing it as scrap paper is a good idea.\n@c0@"
  es: "@aStefania@bNo me gusta cómo nos habla, pero tiene toda la razón. Reciclar es molto importante.\r\nUsarlo como papel sucio es buona idea.\n@c0@"
  fr: "@aPandora@bJe n'aime pas sa manière de nous parler, mais il a raison. C'est très important, le recyclage. C'est une bonne idée de s'en servir comme papier brouillon.\n@c0@"
  it: "@aViola@bSai una cosa?\nPer una volta sono d'accordo con lui.\nChe dici? Forse sono malata?\n@c0@"
  ja: "@a@bデボラ「あのおじさん　エラソーだけど\n\t言ってることは　まともだわ。\n\t資源を大切に　活用してるもの。\n@c0@"
205:
  de: "@aGriselda@bDann muss er ja ein paarmal dort übernachtet haben. Vielleicht hat er nicht kapiert, was sie mit dem Wimpelnamen sagen wollten...\n@c0@"
  en: "@aDebora@bHe must have stayed there a fair few nights, then. Perhaps he didn't get the hint in the name of\r\nthe place...\n@c0@"
  es: "@aStefania@bEntonces se habrá pasado algunas noches ahí. Quizá no entendiera la allusione del nombre del sitio...\n@c0@"
  fr: "@aPandora@bÇa veut donc dire qu'il a passé quelques nuits\r\nlà-bas. Peut-être qu'il n'a pas compris le\r\njeu de mots sur le nom de cet endroit...\n@c0@"
  it: "@aViola@bQuanti anni avrà trascorso in quella locanda, per aver accumulato centinaia di gagliardetti?!\n@c0@"
  ja: "@a@bデボラ「山ほどあるってことは\n\t相当　泊まってるのよね？\n@c0@"
206:
  de: "@aGriselda@bEs klingt, als hätte er selber keine. Ha ha! Ich hab gewonnen!\n@c0@"
  en: "@aDebora@bSounds like he doesn't have any himself.\r\nHa ha! I win!\n@c0@"
  es: "@aStefania@bSembra que no tiene ninguna.\r\n¡Ja, ja! ¡Gané!\n@c0@"
  fr: "@aPandora@bOn dirait qu'il n'en possède pas.\nHa haⓠ J'ai gagnéⓠ\n@c0@"
  it: "@aViola@bNoi, invece, sappiamo benissimo quali sono le particolarissime proprietà di quest'oggetto!\nNon è vero, caro?\n@c0@"
  ja: "@a@bデボラ「ということは　この人は\n\t持ってないわけね。\n\tふふふ　勝ったわ！\n@c0@"
207:
  de: "@aGriselda@bWenn Ihr das für lächerlich haltet, dann versucht's doch mal. Ich halte mir so lange die Ohren zu.\n@c0@"
  en: "@aDebora@bIf you think it's ridiculous, give it a try.\r\nI'll cover my ears...\n@c0@"
  es: "@aStefania@bSi crees que es ridículo, prueba.\r\nMa me taparé los oídos.\n@c0@"
  fr: "@aPandora@bIl n'a qu'à essayer, s'il trouve ça ridicule.\r\nJe vais me boucher les oreilles...\n@c0@"
  it: "@aViola@bAnch'io ho sentito tante sciocchezze in vita mia, e le ha dette quasi tutte lui...\n@c0@"
  ja: "@a@bデボラ「なら　実際に使って見せて\n\tあげなさいよ。\n\t私は　耳を　ふさいでるから。\n@c0@"
208:
  de: "@aGriselda@bDeine Eltern haben diesen Mann zu ihrer Hochzeit eingeladen?!\n@c0@"
  en: "@aDebora@bYour mother and father invited this man to\r\ntheir wedding!?\n@c0@"
  es: "@aStefania@b¿La tua mamma e il tuo pappa invitaron a este hombre a su boda?\n@c0@"
  fr: "@aPandora@bTa mère et ton père ont invité ce type\nà leur mariageⓡⓐ\n@c0@"
  it: "@aViola@bTua madre e tuo padre invitarono quest'essere odioso alle loro nozze?!\n@c0@"
  ja: "@a@bデボラ「あんたの　パパの結婚式に\n\tこの人が　呼ばれた！？\n@c0@"
209:
  de: "@aGriselda@bDas ist ja kaum zu glauben, aber wie sonst sollte er das Medaillon kennen?\n@c0@"
  en: "@aDebora@bIt hardly sounds likely, but how else would he know about the locket?\n@c0@"
  es: "@aStefania@bSembra poco creíble, ¿ma cómo si no iba a saber del camafeo?\n@c0@"
  fr: "@aPandora@bÇa paraît très peu probable, mais dans ce cas, comment connaîtrait-il le pendentifⓡ\n@c0@"
  it: "@aViola@bMa erano impazzit...\n㈡\nEhm, mi chiedevo se per caso gliel'avesse ordinato il sacerdote che celebrò il matrimonio, come penitenza da fare per espiare i peccati commessi...\n@c0@"
  ja: "@a@bデボラ「ウソっぽいけど　でも\n\t絵のことを知ってるってことは\n\t本当かもしれないわね。\n@c0@"
210:
  de: "@aGriselda@bJetzt tut er so, als wäre er zu Tränen gerührt! Was hat er denn auf einmal?\n@c0@"
  en: "@aDebora@bHe's acting as if he's moved to tears now!\r\nWhat's this man's story?\n@c0@"
  es: "@aStefania@b¡Ahora actúa como si estuviera al borde del llanto!\r\n¿Cuál es la historia de este uomo?\n@c0@"
  fr: "@aPandora@bEt voilà qu'il se la joue ému jusqu'aux larmesⓠ\nMais quelle est son histoire, à ce typeⓡ\n@c0@"
  it: "@aViola@bÈ vero: questo medaglione lascia senza fiato, per quant'è bello...\n@c0@"
  ja: "@a@bデボラ「感動して泣いてるようだけど\n\tなんで　この人が　泣くわけ？\n@c0@"
211:
  de: "@aGriselda@bIch glaube, der würde sich in Nadiria gleich wohlfühlen. Was für eine Idee ⓚⓛ direkt unterirdisch! Selbstsüchtiger, gieriger Heide!\n@c0@"
  en: "@aDebora@bI think Nadiria would suit him down to the ground.\nOr should I say ⓗdown under the groundⓘ?\nHe's a selfish, greedy heathen!\n@c0@"
  es: "@aStefania@bCredo que Nadiria le iría que ni pintado.\r\n¡Si es que pinta algo en algún lado!\r\n¡Es un pintamonas egoísta y avaricioso!\n@c0@"
  fr: "@aPandora@bNadiria lui irait comme un gant. Je devrais peut-être dire ⓥcomme un gant de toilette mortuaireⓦ d'ailleurs. C'est un mécréant cupide et égoïsteⓠ\n@c0@"
  it: "@aViola@bA Nadiria dovrebbe andarci di persona.\nE restarci fino a quando non lo richiamiamo qui nel nostro mondo. Cioè mai.\n@c0@"
  ja: "@a@bデボラ「魔界の住人ねぇ……。\n\tこれだけ　ごうよくなんだから\n\tあってるんじゃない？\n@c0@"
212:
  de: "@aGriselda@bIch hoffe, er tut seine Arbeit ordentlich. Ich habe viel Zeit und Geld in das Museum gesteckt.\n@c0@"
  en: "@aDebora@bI hope he's doing his job properly. I've invested an awful lot of time and energy in this place.\n@c0@"
  es: "@aStefania@bEspero que esté haciendo bien il suo lavoro. He invertido mucho tiempo y energía en este lugar.\n@c0@"
  fr: "@aPandora@bJ'espère qu'il fait correctement son travail.\r\nJ'ai consacré beaucoup de temps et d'énergie\r\nà cet endroit.\n@c0@"
  it: "@aViola@bSpero che la guardia del Museo sappia il fatto suo.\n㈡\nSarebbe un peccato se qualche ladro rubasse i souvenir, dopo tutta la fatica che abbiamo fatto per trovarli!\n@c0@"
  ja: "@a@bデボラ「ここには　私たちが\n\t集めたものがあるんだから\n\tしっかり　警備してもらいたいわね。\n@c0@"
213:
  de: "@aGriselda@bWas kostet denn der Eintritt, wenn das hier unser Anteil ist?\n@c0@"
  en: "@aDebora@bHow much is the entrance fee if this is our cut?\n@c0@"
  es: "@aStefania@b¿Cuál es la quota d'ammissione si esta es nuestra parte?\n@c0@"
  fr: "@aPandora@bSi c'est ça, notre part, combien coûtent\nles tickets d'entréeⓡ\n@c0@"
  it: "@aViola@bTutto qui?!\nCerto che Geremia poteva anche dimostrarsi un po' più riconoscente!\n@c0@"
  ja: "@a@bデボラ「いくらの入場料で\n\tこの分けまえなの？\n@c0@"
214:
  de: "@aGriselda@bⓞDas Recht dazu verdientⓟ? Na, der macht mir Spaß! Wir haben doch jetzt schon mehr als unseren gerechten Anteil geleistet!\n@c0@"
  en: "@aDebora@bⓗEarned the rightⓘ? He's got a cheek! We've done more than our fair share of earning already!\n@c0@"
  es: "@aStefania@b¿ⓕGanado el derechoⓖ? ¡Ma qué morro! ¡Nos lo hemos ganado de sobra!\n@c0@"
  fr: "@aPandora@bⓥQuand on sera en droit de le faireⓦⓡ Il ne manque pas d'airⓠ On a déjà fait plus que notre partⓠ\n@c0@"
  it: "@aViola@bAbbiamo tutto il diritto di lamentarci!\n㈡\nCi siamo impegnati al massimo per il Museo del Souvenir, e lui ci ricompensa con una manciata di monete?! Che spilorcio!\n@c0@"
  ja: "@a@bデボラ「一人前にって\n\t人にモノを　頼んでおきながら\n\tずいぶんと　たいどが　でかいわね！！\n@c0@"
215:
  de: "@aGriselda@bJetzt will er auch noch, dass wir Sachen umstellen? Dann wird er uns auch mehr zahlen müssen...\n@c0@"
  en: "@aDebora@bHe wants us to rearrange things now?\r\nHe's going to have to start paying us more...\n@c0@"
  es: "@aStefania@b¿Quiere que reordenemos las cosas ahora?\r\nTendrá que empezar a pagarnos più.\n@c0@"
  fr: "@aPandora@bIl veut qu'on réorganise les choses, maintenantⓡ\nIl va falloir qu'il se mette à nous payer plus...\n@c0@"
  it: "@aViola@bPossiamo cambiare i souvenir esposti anche tre volte al giorno, basta che ci paghi per il disturbo...\n@c0@"
  ja: "@a@bデボラ「展示品の　ならべ方ねぇ。\n\tそれにしても　１０００ゴールドって\n\tずいぶん　安いわね。\n@c0@"
216:
  de: "@aGriselda@bWo will er denn schlafen, wenn er hier übernachtet?\n@c0@"
  en: "@aDebora@bWhere's he going to sleep if he stays the night here?\n@c0@"
  es: "@aStefania@b¿Dónde va a dormir si pasa la notte aquí?\n@c0@"
  fr: "@aPandora@bOù va-t-il dormir s'il passe la nuit iciⓡ\n@c0@"
  it: "@aViola@bBisogna essere pazzi per trascorrere tutto il giorno in questo posto... Persino Geremia ogni tanto esce a prendere una boccata d'aria!\n@c0@"
  ja: "@a@bデボラ「寝泊りって　ベッドは\n\tここにしか　ないでしょ？\n\tどこで寝るつもり？\n@c0@"
217:
  de: "@aGriselda@bEr wirkt einfach nicht wie ein Gespenst. Ich meine, schnarchen Gespenster? Oder meckert er jetzt schon im Schlaf?\n@c0@"
  en: "@aDebora@bHe just doesn't seem like a ghost. I mean, do ghosts normally snore? Or is he grumbling in his sleep now?\n@c0@"
  es: "@aStefania@bVeramente, no parece un fantasma. Es decir, ¿los fantasmas normalmente roncan? ¿O es que está protestando en sueños?\n@c0@"
  fr: "@aPandora@bIl n'a vraiment pas l'air d'un fantôme. C'est vrai, ça ronfle, un fantôme, normalementⓡ Ou est-ce qu'il ronchonne encore dans son sommeilⓡ\n@c0@"
  it: "@aViola@bMa dove avrà imparato a russare in quel modo?!\n@c0@"
  ja: "@a@bデボラ「ゆうれいのくせに\n\tうたたねするなんて　このじいさん\n\t死んでるって　じかくが　ないわね。\n@c0@"
218:
  de: "@aGriselda@bFalls er hierbleibt, kriegt er Ärger, wenn die Putzkolonne anrückt. Soll ich ihn rauswerfen?\n@c0@"
  en: "@aDebora@bHe's going to be in the way when the cleaners turn up if he stays here. Shall I turf him out?\n@c0@"
  es: "@aStefania@bSi se queda aquí, estará en medio cuando vengan a pulire. ¿Lo echo?\n@c0@"
  fr: "@aPandora@bS'il reste ici, il va gêner le passage quand les gens chargés du nettoyage vont passer.\nEst-ce que je le vireⓡ\n@c0@"
  it: "@aViola@bNemmeno quando dorme la smette di dire quante belle cose ha a casa sua... Ma perché non ci torna, a casa sua? Se vuole, ce lo rispedisco io a calci!\n\n@c0@"
  ja: "@a@bデボラ「ここで寝てると\n\tそうじの　ジャマよね。\n\t外に　放り出してやろうかしら？\n@c0@"
219:
  de: "@aGriselda@bEs ist sehr ruhig hier. Ja, das könnte der perfekte Platz für meine Villa sein.\n@c0@"
  en: "@aDebora@bIt's very quiet here. Yes, this could be the perfect spot for my villa.\n@c0@"
  es: "@aStefania@bEsto es molto tranquilo. Sí, sería el sitio ideal para mi villa.\n@c0@"
  fr: "@aPandora@bTout est très calme, ici. Oui, ça pourrait être l'endroit parfait pour ma villa.\n@c0@"
  it: "@aViola@bChe luogo tranquillo...\nSarebbe l'ideale per costruirci la mia casa di villeggiatura.\n@c0@"
  ja: "@a@bデボラ「静かな場所ね。　ここを\n\t別荘にするのも　悪くはないわ。\n@c0@"
220:
  de: "@aGriselda@bEs ist sehr schön eingerichtet, nicht?\n@c0@"
  en: "@aDebora@bIt's very well furnished, isn't it?\n@c0@"
  es: "@aStefania@bEstá muy bien amueblado, ¿no?\n@c0@"
  fr: "@aPandora@bC'est très bien meublé, nonⓡ\n@c0@"
  it: "@aViola@bPerò!\nNiente male questo posto, eh?!\n@c0@"
  ja: "@a@bデボラ「内装も　ずいぶん\n\tりっぱにできてるわね。\n@c0@"
221:
  de: "@aGriselda@bVielleicht war der alte Kauz wohlhabend, bevor er den Löffel abgegeben hat.\n@c0@"
  en: "@aDebora@bPerhaps the old fogey was a man of means before he popped his clogs.\n@c0@"
  es: "@aStefania@bQuizá ese vecchio caduco fuera un hombre de posibles antes de perder la chaveta.\n@c0@"
  fr: "@aPandora@bPeut-être que le vieux bougon avait des biens\r\navant de passer l'arme à gauche.\n@c0@"
  it: "@aViola@bGeremia deve averci speso un bel po' di quattrini per arredarlo.\n@c0@"
  ja: "@a@bデボラ「もしかして　あのじいさん\n\t生きてるうちは　そうとうな\n\tお金持ちだった？\n@c0@"
222:
  de: "@aGriselda@bFür ein winziges, isoliertes Inselchen ist es erstaunlich gut zu erreichen, nicht?\n@c0@"
  en: "@aDebora@bFor a tiny, isolated island, this place is surprisingly accessible, isn't it?\n@c0@"
  es: "@aStefania@bPara ser una diminuta y recondita islita, este sitio es veramente accesible, ¿eh?\n@c0@"
  fr: "@aPandora@bPour une minuscule île isolée, cet endroit est étonnamment accessible, nonⓡ\n@c0@"
  it: "@aViola@bTutto sommato non è complicato raggiungere quest'isola... Meglio così! In questo modo, i visitatori sono ancora più invogliati a venire al Museo.\n@c0@"
  ja: "@a@bデボラ「こんな　孤島に\n\tよく　来る手段があったわね。\n\t感心するわ。\n@c0@"
223:
  de: "@aGriselda@bJetzt kommt es mir eher wie ein Schreckensgruseleum als wie ein Firlefanzeum vor.\n@c0@"
  en: "@aDebora@bIt feels more like a shock-horrortory than a knick-knackatory now.\n@c0@"
  es: "@aStefania@bAhora sembra más un horrorino que un musenino.\n@c0@"
  fr: "@aPandora@bPour l'instant, ça ressemble plus à une petite boutique des horreurs qu'à une Galericabrac.\n@c0@"
  it: "@aViola@bNon trovi anche tu che il Museo abbia un'atmosfera stranamente sinistra...?\n@c0@"
  ja: "@a@bデボラ「博物館というよりは\n\tなんか　きょうふの館って\n\t感じの　ふんいきね。\n@c0@"
224:
  de: "@aGriselda@bDieser Raum ist sogar noch prachtvoller eingerichtet als die anderen.\n@c0@"
  en: "@aDebora@bThis room is even more lavishly decorated than\r\nthe others.\n@c0@"
  es: "@aStefania@bEsta stanza está aún más decorada que las otras.\n@c0@"
  fr: "@aPandora@bLe décor de cette pièce est encore plus somptueux que celui des autres.\n@c0@"
  it: "@aViola@bQuesta stanza è decorata in modo persino più ricco delle altre...\n@c0@"
  ja: "@a@bデボラ「ほかよりも　つくりが\n\tりっぱな部屋に　なってるわね。\n@c0@"
225:
  de: "@aGriselda@bEin Ausstellungsstück in diesem Raum muss genauso prachtvoll sein. Dabei kann ich dir helfen. ⓞPrachtvollⓟ ist genau mein Metier.\n@c0@"
  en: "@aDebora@bAn exhibit for display in here would need to\r\nbe lavish too. I can help with that. I'm very good\r\nat lavish.\n@c0@"
  es: "@aStefania@bUna esposizione aquí debería ser igual de fastuosa. Puedo encargarme. Me encanta lo fastuoso.\n@c0@"
  fr: "@aPandora@bUn objet destiné à être exposé ici doit être tout aussi somptueux. Je peux être utile sur ce point.\r\nJe suis très douée en matière de somptuosité.\n@c0@"
  it: "@aViola@bDovremo esporre un souvenir adeguato a cotanto splendore! Se vuoi un consiglio, chiedi pure a me: sai che sono dotata di un gusto estetico sopraffino!\n@c0@"
  ja: "@a@bデボラ「ここには　できるだけ\n\tごうかなものを　かざった方が\n\tよさそうね。\n@c0@"
226:
  de: "@aGriselda@bIrgendwie komisch, dass Podeste im Lagerraum stehen, oder? Aber wir können hier unten ja den ganzen zweitklassigen Krempel ausstellen.\n@c0@"
  en: "@aDebora@bIt's a bit strange that there are pedestals in the storeroom, isn't it? Still, we can put all the second-rate junk down here, I suppose.\n@c0@"
  es: "@aStefania@bEs un po' raro que haya pedestales en el almacén, ¿no? Aunque supongo que aquí podemos poner la chatarra de segunda.\n@c0@"
  fr: "@aPandora@bC'est un peu étrange qu'il y ait des piédestaux dans la réserve, nonⓡ Enfin, je suppose qu'on peut placer ici tout le bazar de second rang.\n@c0@"
  it: "@aViola@bStrano che ci siano dei piedistalli anche nel deposito...\n㈡\nComunque, suggerisco di usare il deposito per conservare i souvenir che non vogliamo esporre nelle sale principali del Museo.\n@c0@"
  ja: "@a@bデボラ「物置にも　展示台？\n\tちょうど　いいじゃない。　ここには\n\tしょぼいものを　置きなさいよ。\n@c0@"
227:
  de: "@aGriselda@bDas also ist das Zimmer, in dem der alte Kauz lebt ⓚⓛ ich meine, gestorben ist... Ich meine, in Frieden ruht.\n@c0@"
  en: "@aDebora@bSo this is where the old dodderer livesⓚⓛ\nI mean, died...\nI mean...rests in peace...\n@c0@"
  es: "@aStefania@bAsí que ese vecchio malfermo vive aquí...\r\nEs decir, muere aquí...\r\nEs decir, descansa in pace aquí...\n@c0@"
  fr: "@aPandora@bAlors c'est ici que vit le vieux grincheux...\r\nEnfin, qu'il est mort...\r\nEnfin... euh, qu'il reste en paix...\n@c0@"
  it: "@aViola@bAllora è qui che vive Geremia...\n@c0@"
  ja: "@a@bデボラ「ここが　じいさんの部屋？\n\tゆうれいになってからも\n\t使ってるみたいね。\n@c0@"
228:
  de: "@aGriselda@bSo wie's hier aussieht, benutzt er es immer noch. Hier ist alles makellos. Genau wie ich!\n@c0@"
  en: "@aDebora@bHe's still using it, by the look of it. It's immaculate. Just like me!\n@c0@"
  es: "@aStefania@bPor la pinta, aún lo utiliza. Está en perfecto estado. ¡Como yo!\n@c0@"
  fr: "@aPandora@bTout laisse à penser qu'il se sert encore de cette pièce. Elle est impeccable. Tout comme moiⓠ\n@c0@"
  it: "@aViola@bDevo ammetterlo: sarà anche una vecchia mummia, ma quel tipo ha buon gusto.\n@c0@"
  ja: "@a@bデボラ「だって　しっかりと\n\tそうじされてるみたいよ。\n@c0@"
229:
  de: "@aGriselda@bMan kann doch nicht einfach alle Lichter ausschalten, nur weil es Nacht ist.\n@c0@"
  en: "@aDebora@bYou can't put out the lights just because it's night-time, you know.\n@c0@"
  es: "@aStefania@bNo puedes apagar las luces solo porque sea de notte, ¿capisci?\n@c0@"
  fr: "@aPandora@bTu ne peux pas éteindre les lumières juste\r\nparce que c'est la nuit, tu sais.\n@c0@"
  it: "@aViola@bDi notte, la mia bellezza risplende ancor più che di giorno...\n@c0@"
  ja: "@a@bデボラ「夜だからって　灯りを消すこと\n\tないじゃない。\n@c0@"
230:
  de: "@aGriselda@bSo blendend ich auch aussehe, könnte ich doch kein ganzes Museum erhellen!\n@c0@"
  en: "@aDebora@bDazzling as I am, I couldn't light up a whole museum!\n@c0@"
  es: "@aStefania@b¡Por deslumbrante que yo sea, no puedo iluminar tutto un museo!\n@c0@"
  fr: "@aPandora@bJ'ai beau être ébouissante, je ne pourrais quand même pas illuminer tout un muséeⓠ\n@c0@"
  it: "@aViola@bSono così radiosa che potrei illuminare tutto il Museo!\nIh ih ih ih ih!\n@c0@"
  ja: "@a@bデボラ「いくら　私が　輝いても\n\t灯りの代わりまでは　できないわ。\n@c0@"
231:
  de: "@aOtto@bTja, ich bin auch ein Mensch! Und ich hab Potenzial! ... Glaub' ich wenigstens...\n@c0@"
  en: "@aTuppence@bWell, I'm a man and I've got potential!\nI'm...almost sure of it!\n@c0@"
  es: "@aAlazar@bBueno, soy un hombre y tengo potencial.\r\nEstoy casi seguro.\n@c0@"
  fr: "@aInnocent@bEh bien, je suis moi-même un homme, et je suis capable de grandes chosesⓠ J'en suis... presque sûrⓠ\n@c0@"
  it: "@aSimon@bAnch'io ho un immenso potenziale, ma devo ancora capire come esprimerlo...\n@c0@"
  ja: "@a@bピピン「ボクにも……　ボクにも\n\t可能性はある！　信じるんだ！\n@c0@"
232:
  de: "@aGriselda@bKeine Sorge, Otto. Du hast Potenzial.\n@c0@"
  en: "@aDebora@bDon't worry, Tuppence. You do have potential.\n@c0@"
  es: "@aStefania@bNon ti preoccupare, Alazar. Tienes potencial.\n@c0@"
  fr: "@aPandora@bNe t'inquiète pas, Innocent. Tu es effectivement très capable.\n@c0@"
  it: "@aViola@bNon preoccuparti, Simon.\nPrima o poi riuscirai a esprimere il tuo potenziale.\nForse.\n@c0@"
  ja: "@a@bデボラ「大丈夫よ　ピピン。\n\tあんたには　ちゃんと\n\t可能性があるわよ。\n@c0@"
233:
  de: "@aOtto@bWirklich?! Wusst' ich's doch! Danke, Griselda!\nÄh, Potenzial zu... zu was denn?\n@c0@"
  en: "@aTuppence@bReally!? I knew it! Thank you, Debora!\nEr, what...sort of potential?\n@c0@"
