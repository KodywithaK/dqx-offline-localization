  en: "@a@b*: Oh. Well, what do you want, anyway?\n@c0@"
  es: "@a@b*: Vaya. Bueno, pues ¿qué quieres?\n@c0@"
  fr: "@a@b*ⓢ Oh. Bon, qu'est-ce que vous voulezⓡ\n@c0@"
  it: "@a@b*: Oh, questa sì che è una sorpresa!\nBeh, cosa vuoi da me?\n@c0@"
  ja: "@a@b＊「ふ～ん。\n\tで　私に　なにか用かしら？\n@c0@"
12:
  de: "@a%0%a001240@bWir möchten nach Feenaue reisen, ins Reich der Feen.\n@c0@"
  en: "@a%0%a001240@bWe want to get to Faerie Lea in the\nRealm of the Faeries.\n@c0@"
  es: "@a%0%a001240@bQueremos llegar a Hadavilla, en el Reino de las Hadas.\n@c0@"
  fr: "@a%0%a001240@bOn voudrait aller à Féeria, au royaume des Fées.\n@c0@"
  it: "@a%0%a001240@bEcco, noi vorremmo andare a Domus Fatae, nel Regno delle Fate.\nPotresti dirci da che parte dobbiamo andare?\n@c0@"
  ja: "@a@b%a001240「ボクたち\n\t妖精の村に　行きたいんだけど。\n@c0@"
