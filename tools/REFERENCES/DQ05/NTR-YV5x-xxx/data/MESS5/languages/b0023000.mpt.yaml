  fr: "@a@b*ⓢ Bienvenue. Je vous attendais.\nMélissa m'avait dit que vous viendriez.\n@c0@"
  it: "@a@b*: %H0860%X%A0110%XBenvenuto. Ti stavo aspettando. Adusya mi aveva preannunciato la tua visita%Z%B0110%XBenvenuta. Ti stavo aspettando. Adusya mi aveva preannunciato la tua visita%Z%Y%R0000%XBenvenute. Vi stavo aspettando. Adusya mi aveva preannunciato la vostra visita%YBenvenuti. Vi stavo aspettando. Adusya mi aveva preannunciato la vostra visita%Z%Z.\n@c0@"
  ja: "@a@b女王「よくぞ　まいられました。\n\t話は　すでに　ポワンから\n\t聞いております。\n@c0@"
152:
  de: "@a@b*: Ich bin Königin Karamella. Ihr wünscht also, mehr über die zwei Kugeln in Zenithia zu erfahren? Es stimmt, wir Feen haben sie gefertigt.\n@c0@"
  en: "@a@b*: I am Queen Caramel. You wish to know about the two orbs in Zenithia? Yes, we faeries crafted them.\n@c0@"
  es: "@a@b*: Soy la reina Chocolate. ¿Deseas información sobre los dos orbes de Zenithia? Sí, las hadas los creamos.\n@c0@"
  fr: "@a@b*ⓢ Je suis la reine Caramiel. Vous souhaitez avoir des informations sur les deux orbes de Zénithiaⓡ\nOui, ce sont bien les fées qui les ont fabriqués.\n@c0@"
  it: "@a@b*: Sono la regina Caramel.\nSo che %H0860%Xdesideri%Ydesiderate%Z avere informazioni sui due globi di Zenithia. Sì, è vero: li abbiamo creati noi fate.\n@c0@"
  ja: "@a@b女王「たしかに　天空の城にあった\n\t２つのオーブは　私たち妖精の\n\t祖先が　作ったものです。\n@c0@"
153:
