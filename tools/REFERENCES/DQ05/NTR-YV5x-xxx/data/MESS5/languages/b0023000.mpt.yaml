  fr: "@a@b*ⓢ Il vient tout juste d'être changé pour un tableau célébrant la naissance du héros légendaire.\n㈡\n*ⓢ Alors je suppose qu'il ne sera pas remplacé à nouveau avant un bon moment.\n@c0@"
