  it: "@a@b*: Purtroppo non posso %H0860%Xdarti%Ydarvi%Z la mia, perché non ne ho altre.\n@c0@"
  ja: "@a@b＊「悪いが　わしの分は　これひとつしか\n\t残っておらんでな。\n@c0@"
