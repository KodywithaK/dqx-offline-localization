  ja: "@a@b＊「どうか　%a000090さまたちに\n\t天の神の　ご加護が\n\tありますように。\n@c0@"
178:
  de: "@a@b*: Dies ist ein ganz spezielles Bild. Es zeigt, was im Herzen des Betrachters vor sich geht.\n@c0@"
  en: "@a@b*: This is a special picture. It shows what's in the heart of whoever looks at it.\n@c0@"
