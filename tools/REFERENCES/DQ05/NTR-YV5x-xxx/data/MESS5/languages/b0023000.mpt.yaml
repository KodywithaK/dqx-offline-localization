  fr: "@a@b*ⓢ En vérité, l'Yggdrasil, le Grand arbre du Monde, appartient au monde terrestre.\n@c0@"
  it: "@a@b*: Ygdrasil, il Grande Albero del Mondo, è una creatura terrestre. Appartiene al suolo, e lì dovrebbe crescere e prosperare.\n@c0@"
  ja: "@a@b＊「世界樹は　本当は\n\t大地に根ざすものですが……。\n@c0@"
298:
  de: "@a@b*: Doch die Macht Nimzos wuchert stärker, als wir dachten. Die Dunkelheit breitet sich stetig aus.\n@c0@"
  en: "@a@b*: But the power of Nimzo doth grow more briskly than we feared. The darkness spreadeth apace.\n@c0@"
  es: "@a@b*: Pero el poder de Nimzo crece aún más presto de lo que temíamos. La oscuridad se propaga con rapidez.\n@c0@"
