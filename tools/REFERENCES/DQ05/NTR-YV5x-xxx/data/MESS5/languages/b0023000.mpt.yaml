25:
  de: "@a@b*: Ich nehme an, dass Ihr wieder mit Marmela sprechen möchtet, nicht?\n@c0@"
  en: "@a@b*: I expect you want to meet with Treacle again, don't you?\n@c0@"
  es: "@a@b*: Supongo que %H0860%Xquerrás%Yquerréis%Z volver a ver a Miel, ¿verdad?\n@c0@"
  fr: "@a@b*ⓢ Je suppose que vous voulez revoir Mélissa.\n@c0@"
