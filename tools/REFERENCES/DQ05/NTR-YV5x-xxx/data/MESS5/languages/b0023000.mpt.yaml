  ja: "@a@b＊「あら　私としたことが\n\tなにを　いってるのかしら……。\n@c0@"
243:
  de: "@a@b*: Steinach hat leider nicht viel zu bieten, aber fühlt Euch trotzdem ganz wie zu Hause!\n@c0@"
