  es: "@a@b*: Bien. %H0860%XPareces bastante dulce%YParecéis gente dulce%Z, supongo.\n%H0860%XTe%YOs%Z conduciré allí. ¡%H0860%XSígueme%YSeguidme%Z! ¡Ji, ji, ji!\n@c0@"
