  es: "@a@b*: ¡Saludos, %H0860%X%A0110%Xamigo%Z%B0110%Xamiga%Z%Y%R0000%Xamigas%Yamigos%Z%Z! ¡Estamos salvados! Zenithia se ha salvado gracias a %H0860%Xtu%Yvuestro%Z auxilio. No tengo palabras para expresar mi gratitud.\n@c0@"
  fr: "@a@b*ⓢ Salut, %H0860%X%A0110%Xl'ami%Z%B0110%Xl'amie%Z%Y%R0000%Xles amies%Yles amis%Z%Zⓠ Nous sommes sauvésⓠ Zénithia est sauvéⓠ Et c'est grâce à vous. Les mots sont bien faibles pour exprimer notre gratitude.\n@c0@"
