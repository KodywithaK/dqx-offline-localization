285:
  de: "@a@b*: Gepriesen sollt Ihr sein, %H0860%X%A0110%Xmein Freund%Z%B0110%Xmeine Liebe%Z%Ymeine Freunde%Z! Wir sind gerettet! Zenithia ist gerettet! Wie kann ich Euch nur danken?\n@c0@"
