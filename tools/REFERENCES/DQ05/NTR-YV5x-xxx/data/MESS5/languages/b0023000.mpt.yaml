226:
  de: "@a@b*: Unser Dorfchef, Ludwig, ist erst seit kurzem wieder hier. Er war zwei Jahre auf Reisen, wisst Ihr.\n@c0@"
  en: "@a@b*: The village chief, Pankraz, came home from his travels just the other day. He was away for two years, you know.\n@c0@"
  es: "@a@b*: El jefe del pueblo, Teudis, regresó de sus viajes hace solo unos días. Ha estado dos años ausente, ¿sabes?\n@c0@"
  fr: "@a@b*ⓢ Petros, le chef du village, est revenu de ses voyages il y a très peu de temps. Ça faisait\ndeux ans qu'il était parti, vous savez.\n@c0@"
  it: "@a@b*: Russel, il capo del nostro villaggio, è tornato giusto ieri da un viaggio durato ben due anni.\n@c0@"
  ja: "@a@b＊「つい先日　村の長パパスさんが\n\t２年ぶりに　旅から\n\t帰ってきたんですよ。\n@c0@"
227:
  de: "@a@b*: Das muss ganz schön anstrengend gewesen sein, mit einem Kind im Schlepptau.\n@c0@"
  en: "@a@b*: It must've been a tirin' journey for him, travellin' about all that time with a young lad in tow.\n@c0@"
  es: "@a@b*: Debe de haber sido agotador para él, viajando de aquí y para allá junto a su pequeño.\n@c0@"
  fr: "@a@b*ⓢ Ça a dû être fatigant pour lui, de voyager pendant tout ce temps avec un petit garçon\nsur les talons.\n@c0@"
  it: "@a@b*: Scommetto che è stanchissimo: girare per tanto tempo, per di più con un bambino piccolo al seguito, dev'essere stata un'esperienza massacrante...\n@c0@"
  ja: "@a@b＊「でも　あんなに小さい子を\n\t連れて　旅をするなんて\n\t大変だっただろうなあ。\n@c0@"
228:
  de: "@a@b*: Es ist niemand hier, aber trotzdem spüre ich da etwas.\n@c0@"
  en: "@a@b*: There's nobody here and yet I feel like\r\nI can sense someone.\n@c0@"
  es: "@a@b*: No hay nadie aquí, pero siento la presencia de alguien.\n@c0@"
  fr: "@a@b*ⓢ Il n'y a personne ici, et pourtant j'ai l'impression de sentir une présence.\n@c0@"
  it: "@a@b*: Qui non c'è nessuno, eppure mi pare di percepire una presenza estranea...\n@c0@"
  ja: "@a@b＊「誰もいないのに　どうにも\n\t人の気配が　するんだ。\n@c0@"
229:
  de: "@a@b*: Ludwigs Junge stand dort hinten und hat mit einem Geist oder so was gesprochen.\n@c0@"
  en: "@a@b*: Pankraz's boy was just standin' there chattin' away to himself as if someone was right in front of him too.\n@c0@"
  es: "@a@b*: El chico de Teudis estaba ahí mismo hablando solo como si hubiese alguien delante de él.\n@c0@"
  fr: "@a@b*ⓢ Le fils de Petros se tenait juste ici et parlait\ntout seul, comme s'il avait vraiment quelqu'un\nen face de lui.\n@c0@"
  it: "@a@b*: E anche il figlio di Russel prima parlava tra sé e sé ad alta voce, come se stesse dialogando con qualcuno.\n@c0@"
  ja: "@a@b＊「パパスさんとこの　%a000090が\n\t誰かと話してるみたいに\n\tひとりごとを　言ってたし……。\n@c0@"
230:
  de: "@a@b*: Das ist alles sehr seltsam.\n@c0@"
  en: "@a@b*: It's all very odd.\n@c0@"
  es: "@a@b*: Todo esto es muy raro.\n@c0@"
  fr: "@a@b*ⓢ C'est vraiment très bizarre, tout ça.\n@c0@"
  it: "@a@b*: Mah, che strano...\n@c0@"
  ja: "@a@b＊「おかしいなあ……。\n@c0@"
231:
  de: "@a@b*: Gestern Nacht habe ich mir mit einem Kerl namens Ludwig ein paar Gläschen genehmigt.\n@c0@"
  en: "@a@b*: I had a few drinks with a chap called Pankraz in the pub last night.\n@c0@"
  es: "@a@b*: Anoche me tomé unas copas con un tipo llamado Teudis en la taberna.\n@c0@"
  fr: "@a@b*ⓢ J'ai bu quelques verres avec un type appelé Petros, l'autre soir à la taverne.\n@c0@"
  it: "@a@b*: L'altra sera ho scambiato quattro chiacchiere con un tizio di nome Russel...\n@c0@"
  ja: "@a@b＊「ゆうべ　酒場で\n\tパパスという人と　いっしょに\n\t飲んだのですが\n@c0@"
232:
  de: "@a@b*: Er hat mich wirklich beeindruckt. Solch eine Willensstärke... Ein großartiger Mann!\n@c0@"
  en: "@a@b*: He really made an impression on me. So much hardship, and yet so much strength in the face of it. He's no ordinary man!\n@c0@"
  es: "@a@b*: Me dejó realmente impresionado. Tantas dificultades, y tanta entereza para enfrentarse a ellas. ¡No es una persona cualquiera!\n@c0@"
  fr: "@a@b*ⓢ Il m'a vraiment fait forte impression. Tant d'épreuves et en même temps une force incroyable pour y faire face. Ça n'est pas un homme ordinaireⓠ\n@c0@"
  it: "@a@b*: Mi è sembrato una gran brava persona.\nHa molte responsabilità sulle spalle, ma le affronta con energia ed entusiasmo eccezionali.\n㈡\n*: È proprio in gamba!\n@c0@"
  ja: "@a@b＊「いやはや　なかなかの苦労人で\n\t感心させられました。\n\tただ者では　ないですぞ！\n@c0@"
233:
  de: "@a@b*: Na so was! Ich dreh mich einen Augenblick weg, und als ich wieder hingucke, ist der Topf wie sauber geleckt!\n@c0@"
  en: "@a@b*: Dear me! I turn my head for a second, and come back to find the pot practically licked clean!\n@c0@"
  es: "@a@b*: ¡Oh, vaya! ¡Me despisto un segundo y me encuentro la cacerola vacía!\n@c0@"
  fr: "@a@b*ⓢ Ça alorsⓠ J'ai tourné la tête pendant une seconde et quand je suis revenue, la marmite était presque videⓠ\n@c0@"
  it: "@a@b*: Oh, ma tu guarda!\nMi sono assentata un solo istante, e quando sono tornata ho trovato la pentola completamente vuota!\n@c0@"
  ja: "@a@b＊「ありゃ？\n\tおなべの中が　いつの間にか\n\tからっぽだわ。\n@c0@"
234:
  de: "@a@b*: Der Alte könnte ja ruhig was sagen, wenn er so hungrig ist.\n@c0@"
  en: "@a@b*: The old man should just speak up\r\nif he's that hungry.\n@c0@"
  es: "@a@b*: Si ese viejo pellejo tenía tanta hambre, me lo podría haber dicho...\n@c0@"
  fr: "@a@b*ⓢ Si mon mari a si faim que ça, il n'a qu'à me le dire.\n@c0@"
  it: "@a@b*: Se mio marito aveva fame, poteva tranquillamente dirmelo!\n@c0@"
  ja: "@a@b＊「おじいちゃんも\n\tおなかが　すいたなら\n\tそう　言えばいいのに……。\n@c0@"
235:
  de: "@a@b*: Ich hab's nicht gegessen, sag ich dir!\n@c0@"
  en: "@a@b*: I didn't eat it, I tell you!\n@c0@"
  es: "@a@b*: ¡Te digo que yo no me lo he comido!\n@c0@"
  fr: "@a@b*ⓢ Ça n'est pas moi qui ai mangé ce qu'il y avait dedans, je te disⓠ\n@c0@"
  it: "@a@b*: Ti giuro che la pentola non l'ho nemmeno toccata!\n@c0@"
  ja: "@a@b＊「わしゃ　食べとらんぞ！\n@c0@"
236:
  de: "@a@b*: Dieses zickige Weibsbild behandelt mich manchmal wie ein kleines Kind!\n@c0@"
  en: "@a@b*: Honestly! That old dragon of a wife of mine treats me like a child sometimes!\n@c0@"
  es: "@a@b*: ¡Ese viejo dragón que tengo por esposa me trata como a un crío!\n@c0@"
  fr: "@a@b*ⓢ Franchementⓠ Le vieux dragon qui me sert de femme me traite parfois comme un gaminⓠ\n@c0@"
  it: "@a@b*: Roba da pazzi!\nQuella vipera di mia moglie mi tratta come se fossi un furfantello...\n@c0@"
  ja: "@a@b＊「わしのことを　子供あつかいして\n\tうちのヨメも\n\tこまったヤツじゃわい。\n@c0@"
237:
  de: "@a@b*: Dieser Ludwig! Lässt sich zwei Jahre nicht blicken und macht sich sofort wieder nach Wittenhausen auf!\n@c0@"
  en: "@a@b*: That Pankraz! He spends two years away travelling, and then he's straight off again to Roundbeck just like that!\n@c0@"
  es: "@a@b*: ¡Ese Teudis! ¡Se pasa dos años viajando y, nada más llegar, vuelve a salir para Golfo Blanco en seguida!\n@c0@"
  fr: "@a@b*ⓢ Sacré Petrosⓠ Il a passé deux ans loin d'ici\nà voyager, et sitôt revenu, il repart pour Blanchecombe.\n@c0@"
  it: "@a@b*: Russel era appena rientrato da un viaggio durato la bellezza di due anni, ed è già ripartito per Blankenburg! Ma dove le prende tante energie?!\n@c0@"
  ja: "@a@b＊「パパスさんも　２年ぶりに\n\t帰ってきたと思ったら\n\tアルカパに　出かけたりして。\n@c0@"
238:
  de: "@a@b*: Auf jeden Fall ist er ein viel beschäftigter Mann.\n@c0@"
  en: "@a@b*: He's certainly a busy man, that much is for sure.\n@c0@"
  es: "@a@b*: No se puede negar que se trata de un hombre ocupado.\n@c0@"
  fr: "@a@b*ⓢ C'est un homme occupé, c'est le moins\nqu'on puisse dire.\n@c0@"
  it: "@a@b*: Capisco che è una persona molto impegnata, ma gli farebbe bene prendersi un po' di riposo ogni tanto...\n@c0@"
  ja: "@a@b＊「ホントに　いそがしい人\n\tだねぇ……。\n@c0@"
239:
  de: "@a@b*: Ich weiß nicht, ob es stimmt, aber es heißt, dass Ludwigs Frau von Monstern entführt worden wäre.\n@c0@"
  en: "@a@b*: I'm not sure if this is true or not, but people say Pankraz's wife was snatched away by monsters.\n@c0@"
  es: "@a@b*: No estoy seguro de si es verdad o no, pero dicen que a la mujer de Teudis la secuestraron unos monstruos.\n@c0@"
  fr: "@a@b*ⓢ Je ne sais pas si c'est vrai ou pas, mais les gens racontent que la femme de Petros a été enlevée par des monstres.\n@c0@"
  it: "@a@b*: Non so se sia vero o meno, ma in giro corre voce che la moglie di Russel sia stata rapita da una banda di mostri.\n@c0@"
  ja: "@a@b＊「これはウワサじゃが\n\tパパスどのの奥さんは\n\t怪物どもに　さらわれたらしい。\n@c0@"
240:
  de: "@a@b*: Mir tut nur der arme %a000090 leid. Ein kleiner Junge braucht doch seine Mutter.\n@c0@"
  en: "@a@b*: I pity poor %a000090. A boy that small needs his mother around.\n@c0@"
  es: "@a@b*: Me da lástima el pobre %a000090. Un chiquillo necesita estar cerca de su madre.\n@c0@"
