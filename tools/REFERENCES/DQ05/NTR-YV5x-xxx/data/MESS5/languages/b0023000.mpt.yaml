  es: "@a@b*: Estoy escribiendo una crónica completa de la historia del mundo.\n@c0@"
  fr: "@a@b*ⓢ J'écris une histoire complète du monde entier.\n@c0@"
  it: "@a@b*: Sto scrivendo la storia del mondo, dalle origini ai nostri giorni.\n@c0@"
  ja: "@a@b＊「私は　世界の歴史を　すべて\n\t記録しておるのじゃ。\n@c0@"
170:
  de: "@a@b*: Das ist ein sehr wichtiges Zeugnis, wisst Ihr. Darum verwende ich auch die Tinte aus dem Tintenhorn. Sie wird nie verblassen.\n@c0@"
  en: "@a@b*: It's a very valuable record, you know.\r\nThat's why I'm using the ink of an eyevory\r\ntusk-tusk. It never fades, you see.\n@c0@"
  es: "@a@b*: Es un documento muy valioso, %H0860%X¿sabes?%Y¿sabéis?%Z\nPor eso utilizo tinta de tantor, porque es indeleble.\n@c0@"
  fr: "@a@b*ⓢ C'est une œuvre très précieuse. C'est pour cela que j'utilise de l'encre de stigmammouth. Elle ne pâlit jamais, voyez-vous.\n@c0@"
  it: "@a@b*: Sarà un documento di grande importanza, per questo ho deciso di usare l'inchiostro di Chiostrofante.\n㈡\n*: In questo modo, le parole non sbiadiranno mai.\n@c0@"
  ja: "@a@b＊「貴重な記録だから　なん年たっても\n\t消えないよう　パオームのインクで\n\t書いているんじゃよ。\n@c0@"
171:
  de: "@a@b*: Hm? Was man braucht, damit eine Schrift auch nach Tausenden von Jahren noch zu lesen ist?\n@c0@"
  en: "@a@b*: Hm? A pen and ink whose writing doesn't fade for years and years, you say?\n@c0@"
  es: "@a@b*: ¿Mmm? ¿Una pluma y una tinta que no pierda color durante muchos años?\n@c0@"
  fr: "@a@b*ⓢ Mmmⓡ Une plume et une encre dont l'écriture ne pâlirait jamais au cours des années, dites-vousⓡ\n@c0@"
  it: "@a@b*: Come %H0860%Xdici? Vuoi%Ydite? Volete%Z sapere se è possibile scrivere parole che non sbiadiscono con lo scorrere del tempo?\n@c0@"
  ja: "@a@b＊「うん？　なん年たっても　消えない\n\tインクと　ペンじゃと？\n@c0@"
172:
  de: "@a@b*: Wahrscheinlich meint Ihr die Tinte aus dem Tintenhorn. Ihr solltet die Kirche Nordmünster besuchen, wenn Euch das interessiert.\n@c0@"
  en: "@a@b*: Well, obviously you're referring to the ink of the eyevory tusk-tusk. Yes, you should visit the church known as Northminster for that.\n@c0@"
  es: "@a@b*: Seguro que %H0860%Xte refieres%Yos referís%Z a la tinta del tintero de tantor. Para eso %H0860%Xtendrás%Ytendréis%Z que visitar esa iglesia que llaman Silos.\n@c0@"
  fr: "@a@b*ⓢ De toute évidence, vous faites référence à l'encre de stigmammouth.\n㈡\n*ⓢ Pour cela, vous devriez vous rendre dans\nl'église connue sous le nom de Saint Glinglin.\n@c0@"
  it: "@a@b*: Sì, la cosa è fattibile.\nInnanzitutto, è necessario scrivere usando l'inchiostro di Chiostrofante.\n㈡\n*: Se %H0860%Xvuoi saperne di più, ti consiglio di recarti%Yvolete saperne di più, vi consiglio di recarvi%Z al Monastero Scribarum.\n@c0@"
  ja: "@a@b＊「インクは　もちろん\n\tパオームのインクが　よかろう。\n\t北の教会を　たずねるがいい。\n@c0@"
173:
  de: "@a@b*: Und es gibt kein besseres Schreibwerkzeug als eine Feenfeder. Ich glaube, die werden immer noch in der Bibliothek von Feenaue hergestellt.\n@c0@"
  en: "@a@b*: As for a pen, you can't beat a faerie quill. As\r\nfar as I'm aware, they're still being made in Faerie Lea's library.\n@c0@"
  es: "@a@b*: Y, si hablamos de plumas, la mejor es la pluma de hada, sin duda. Por lo que sé, las siguen fabricando en la biblioteca de Hadavilla.\n@c0@"
  fr: "@a@b*ⓢ Et en matière de plume, rien ne vaut une plume féerique. Pour autant que je sache, elles sont toujours fabriquées dans la bibliothèque de Féeria.\n@c0@"
  it: "@a@b*: La mano che vergherà le parole dovrà impugnare una penna fatata, il miglior strumento di scrittura esistente al mondo.\n㈡\n*: A quanto ne so, quelle penne sono realizzate nella biblioteca di Domus Fatae.\n@c0@"
  ja: "@a@b＊「ペンなら　妖精の羽ペンが\n\t何よりじゃ。　妖精の村の図書館で\n\t今も　作られていると聞くぞ。\n@c0@"
174:
  de: "@a@b*: Leider kann ich Euch meine nicht geben, ich habe nämlich nur noch diese eine.\n@c0@"
