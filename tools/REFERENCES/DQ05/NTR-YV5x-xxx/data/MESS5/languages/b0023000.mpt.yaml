  fr: "@a@b*ⓢ Mmmⓡ Je ne vous avais jamais vu dans le coin. Petros, le chef de notre village, est très fort, pour votre gouverneⓠ\n@c0@"
  it: "@a@b*: %H0860%XNon sei%YNon siete%Z di queste parti, vero?\n%H0860%XTi%YVi%Z informo che Russel, il capo del nostro villaggio è un uomo forte e determinato.\n@c0@"
  ja: "@a@b＊「ん？　みかけない顔だな。\n\tこの村の長　パパスどのは\n\tとても　強い！\n@c0@"
