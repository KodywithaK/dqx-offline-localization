  it: "@a@b*: %O0960%XPorta qui la sfera dorata che la regina Caramel ti ha donato, %a000090. Dovrai tenerla tra le mani%Y%0%a000090 deve portare qui la sfera dorata che ha ricevuto dalla regina Caramel. È necessario che egli la tenga tra le mani%Z.\n@c0@"
