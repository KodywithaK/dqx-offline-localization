  fr: "@a@b*ⓢ Si vous désirez nous faire descendre,\nune simple pression sur un bouton suffitⓢ\nle bouton A, le bouton B ou le bouton X.\n@c0@"
  it: "@a@b*: Se %H0860%Xdesideri che Zenithia si posi delicatamente al suolo, non dovrai%Ydesiderate che Zenithia si posi delicatamente al suolo, non dovrete%Z fare altro che premere il pulsante A, il pulsante B o il pulsante X.\n@c0@"
  ja: "@a@b＊「天空城で　空を飛んでいるときは\n\tＡボタンや　Ｂボタン　それに\n\tＸボタンで　陸に　おりられますよ。\n@c0@"
290:
  de: "@a@b*: Aber lasst Vorsicht walten! Das Gelände sollte flach sein, wenn Ihr Zenithia vom Himmel holen wollt. \n㈡\n*: Dazu müsst Ihr eine Ebene oder eine Wüste finden.\n@c0@"
