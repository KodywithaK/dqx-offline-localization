  ja: "@a@b＊「また　ポワンさまに\n\t会いたいのね。\n@c0@"
26:
  de: "@a@b*: Geht einfach durch das Teleportal im Schrein dort hinten. Ihr könnt wieder über die Blätter auf dem See laufen.\n@c0@"
  en: "@a@b*: Just go through the teleportal in the shrine\r\nover there. The leaves are still in the lake for\r\nyou to walk over.\n@c0@"
  es: "@a@b*: Basta con que %H0860%Xuses%Yuséis%Z el portal de teletransporte en ese templo de ahí. Las hojas siguen en el lago para que %H0860%Xpuedas%Ypodáis%Z caminar sobre ellas.\n@c0@"
  fr: "@a@b*ⓢ Empruntez le téléportail qui se trouve dans le sanctuaire, là-bas. Les feuilles permettant de traverser l'étendue d'eau sont toujours en place.\n@c0@"
  it: "@a@b*: %H0860%XEntra nel portale di trasporto che si trova nel tempio. Le foglie sono ancora nel lago, e puoi%YEntrate nel portale di trasporto che si trova nel tempio. Le foglie sono ancora nel lago, e potete%Z camminarci sopra tranquillamente.\n@c0@"
