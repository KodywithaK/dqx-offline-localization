  es: "@a@b*: ¡Pero cuidado! Para hacer descender a Zenithia, el terreno debe ser plano. %H0860%XDebes%YDebéis%Z hallar una llanura, un desierto o una superficie similar.\n@c0@"
  fr: "@a@b*ⓢ Mais faites bien attentionⓠ Le terrain doit être plat pour pouvoir faire descendre Zénithia.\n㈡\n*ⓢ Il vous faut trouver une plaine, un désert\nou une surface équivalente.\n@c0@"
  it: "@a@b*: Ma %H0860%Xricorda!%Yricordate!%Z\nÈ possibile atterrare solo su pianure, deserti o altre aree parimenti vaste e prive di asperità.\n@c0@"
