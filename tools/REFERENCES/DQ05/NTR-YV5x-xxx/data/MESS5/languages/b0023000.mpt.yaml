  it: "@a@b*: Non gli piacciono i piantagrane. Non vogliamo guai nel nostro territorio, quindi %H0860%Xcomportati bene se non vuoi%Ycomportatevi bene se non volete%Z avere problemi. Sono stato chiaro?\n@c0@"
  ja: "@a@b＊「イタイめに　あいたくないなら\n\tさわぎなど　おこさぬようにな。\n@c0@"
199:
  de: "@a@b*: Meine armen Pflänzchen leiden wirklich unter dieser Kälte. Ich weiß nicht mehr, was ich machen soll.\n@c0@"
