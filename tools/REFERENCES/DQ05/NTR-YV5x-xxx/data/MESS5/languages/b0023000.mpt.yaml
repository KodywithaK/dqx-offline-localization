  fr: "@a@b*ⓢ Je sais quelque chose que vous ne savez pasⓠ\nJe sais quelque chose que vous ne savez pasⓠ\nMais d'accord, je vais vous le dire. Ti-hi-hiⓠ\n@c0@"
