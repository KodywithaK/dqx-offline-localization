176:
  de: "@a@b*: Doch leider werden sie uns nicht helfen, Frieden zu stiften. Ihr könnt sie haben, wenn Ihr wollt. Hi hi hi!\n@c0@"
  en: "@a@b*: But boo hoo. They won't bring about peace.\r\nYou can have them if you want. Tee hee!\n@c0@"
