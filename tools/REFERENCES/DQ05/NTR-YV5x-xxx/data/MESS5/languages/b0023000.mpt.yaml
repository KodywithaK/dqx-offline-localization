  it: "@a@b*: %H0860%X%A0110%XSei certo%Z%B0110%XSei certa%Z%Y%R0000%XSiete certe%YSiete certi%Z%Z di ricordare bene?\nNessuno tra noi porta quel nome, %H0860%X%A0110%Xamico%Z%B0110%Xamica%Z%Y%R0000%Xamiche%Yamici%Z%Z.\n@c0@"
