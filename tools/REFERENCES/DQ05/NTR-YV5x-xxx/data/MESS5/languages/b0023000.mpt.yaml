  it: "@aRegina Caramel@bOra %H0860%Xvai! Presto! Corri%Yandate! Presto! Correte%Z alle scale che si trovano qui dietro!\nLe fate %H0860%Xti%Yvi%Z diranno cosa fare.\n@c0@"
  ja: "@a@b女王「さあ　奥の階段へ　お急ぎなさい。\n\tあとは　２階にいる妖精が\n\t%a000090を　案内してくれるでしょう。\n@c0@"
163:
  de: "@aKönigin Karamella@bWir Feen können den Lauf der Zeit nicht beeinflussen.\n@c0@"
