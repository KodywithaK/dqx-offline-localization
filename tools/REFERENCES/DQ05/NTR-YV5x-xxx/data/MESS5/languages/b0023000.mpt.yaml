0:
  de: "@a@b*: Dies ist Nimmerwald, das sagenumwobene Tor zum Feenreich.\n@c0@"
  en: "@a@b*: This is the Neverglade, said to be the gateway to the Realm of the Faeries.\n@c0@"
  es: "@a@b*: Esto es el Claro Oscuro que, según cuentan, es la entrada al Reino de las Hadas.\n@c0@"
  fr: "@a@b*ⓢ Vous êtes ici dans la clairière de Nullepart.\nOn dit que c'est là que se trouve le passage\nvers le royaume des Fées.\n@c0@"
  it: "@a@b*: Questa è la Radura del Novunque dove, secondo una leggenda, si trova il passaggio che conduce nel Regno delle Fate.\n@c0@"
  ja: "@a@b＊「ここは　妖精の村に\n\t通じると　言われている\n\t迷いの森だ。\n@c0@"
1:
  de: "@a@b*: Aber für normale Leute wie Euch ist der Wald gefährlich. Ihr würdet Euch bloß verlaufen.\n@c0@"
  en: "@a@b*: But this isn't a forest for normal folk.\nYou'll get lost.\n@c0@"
  es: "@a@b*: Pero este bosque no es para personas normales.\n%H0860%XTe perderás%YOs perderéis%Z.\n@c0@"
  fr: "@a@b*ⓢ Mais cette forêt n'est pas faite pour les gens normaux. Vous risquez fort de vous y perdre.\n@c0@"
  it: "@a@b*: Bisogna fare attenzione, però, perché questa non è una foresta come tutte le altre: è praticamente impossibile non perdersi!\n@c0@"
  ja: "@a@b＊「しかし　ふつうの人間じゃ\n\tこの森を　ぬけることは\n\tできねえみたいだぜ。\n@c0@"
2:
  de: "@a@b*: Es sei denn, Ihr könnt Feen sehen. Das wäre etwas anderes.\n@c0@"
  en: "@a@b*: Unless you can see faeries, of course.\nThat would be a different matter altogether.\n@c0@"
  es: "@a@b*: A menos que %H0860%Xpuedas%Ypodáis%Z ver a las hadas, claro está.\nEntonces sería otra historia.\n@c0@"
  fr: "@a@b*ⓢ À moins que vous ne puissiez voir les fées, bien sûr. Les choses seraient différentes, dans ce cas.\n@c0@"
  it: "@a@b*: Certo, le cose sarebbero più semplici se %H0860%Xtu potessi%Yvoi poteste%Z vedere le fate...! In quel caso, trovare il passaggio per il loro Regno sarebbe un gioco da ragazzi!\n@c0@"
  ja: "@a@b＊「もっとも　妖精の姿を\n\t見ることが　できるなら\n\t話は　べつだけどよ。\n@c0@"
3:
  de: "@a@b*: Als ich ein kleines Mädchen war, habe ich einmal eine Fee gesehen. Aber das ist schon lange her.\n@c0@"
  en: "@a@b*: I saw a faerie once when I was a little girl.\r\nBut that was a long time ago now.\n@c0@"
  es: "@a@b*: Una vez, cuando era una niña, vi un hada.\r\nPero de eso hace ya mucho tiempo.\n@c0@"
  fr: "@a@b*ⓢ J'ai vu une fée, un jour, quand j'étais petite fille.\nMais c'était il y a très longtemps.\n@c0@"
  it: "@a@b*: Quando ero una bambina, una volta vidi una fata!\nMa sono passati tanti anni da allora...\n@c0@"
  ja: "@a@b＊「私もね　子供のときは\n\t妖精の姿を　見たことが\n\tあったんだけどねえ……。\n@c0@"
4:
  de: "@a%0%a001240@bPapa! Dahinten sitzt jemand am Feuer.\n@c0@"
  en: "@a%0%a001240@bHey! There's someone over by that bonfire, Dad.\n@c0@"
  es: "@a%0%a001240@b¡Eh! Hay alguien junto a esa hoguera, papá.\n@c0@"
  fr: "@a%0%a001240@bHé, papaⓠ Il y a quelqu'un près de ce feu, là-bas.\n@c0@"
  it: "@a%0%a001240@bEhi, papà! Guarda!\nC'è qualcuno accanto a quel falò!\n@c0@"
  ja: "@a@b%a001240「あれ？\n\tお父さん　たき火のところに\n\tだれか　いるよ。\n@c0@"
