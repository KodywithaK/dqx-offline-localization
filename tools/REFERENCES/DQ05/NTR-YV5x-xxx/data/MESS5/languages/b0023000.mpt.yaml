  fr: "@a@b*ⓢ Hélas, ils n'apportent pas la paix.\nVous pouvez les prendre, si vous voulez. Ti-hiⓠ\n@c0@"
  it: "@a@b*: Eppure non capisco come mai agli uomini piacciano tanto: i tesori non portano la pace, e nemmeno la felicità! Se %H0860%Xti va, puoi%Yvi va, potete%Z prenderli. Tee eh eh!\n@c0@"
  ja: "@a@b＊「しかし　世界の平和には\n\tかえられません。\n\tどうか　お持ちくださいませ。\n@c0@"
177:
  de: "@a@b*: Möge die Göttin zuckersüße Segensgrüße auf Euch und Eure Gruppe herabregnen lassen.\n@c0@"
  en: "@a@b*: May the Goddess blow candy kisses down on you and your party.\n@c0@"
