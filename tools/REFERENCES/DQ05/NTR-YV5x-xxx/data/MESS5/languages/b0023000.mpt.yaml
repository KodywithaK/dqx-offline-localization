  it: "@aRegina Caramel@bLi realizzammo tempo fa, quando possedevamo un potere magico che adesso non abbiamo più.\n@c0@"
  ja: "@a@b女王「しかし　もはや　私たちには\n\t同じ物を　作ることは\n\tできないのです。\n@c0@"
