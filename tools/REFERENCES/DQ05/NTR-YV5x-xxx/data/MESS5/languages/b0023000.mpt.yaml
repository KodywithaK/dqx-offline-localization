  de: "@a@b*: Willkommen. Ich habe Euch bereits erwartet. Marmela sagte mir, dass Ihr kommen würdet.\n@c0@"
  en: "@a@b*: Welcome. I've been expecting you.\nTreacle said you would be coming.\n@c0@"
