  it: "@aRegina Caramel@bAdesso %H0860%Xvai%Yandate%Z.\nNon c'è tempo da perdere.\n%H0860%XDevi%YDovete%Z riportare il globo d'oro al suo posto.\n@c0@"
  ja: "@a@b女王「さあ　お行きなさい。\n\tゴールドオーブを　あるべき場所へ\n\t戻す時が　来たのです……。\n@c0@"
169:
  de: "@a@b*: Ich schreibe die komplette Geschichte der Welt nieder.\n@c0@"
