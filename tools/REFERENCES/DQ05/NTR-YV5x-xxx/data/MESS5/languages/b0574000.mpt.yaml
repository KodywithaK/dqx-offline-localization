0:
  de: "@aBianca@bJetzt sind wir nicht mehr weit von Utensiel. Wie es wohl meinem Vater geht?\n@c0@"
  en: "@aBianca@bWe're not far from Stockenbarrel here.\r\nI wonder how Dad's gettin' on.\n@c0@"
  es: "@aBianca@bNo estamos lejos de Clavis.\nMe pregunto cómo le irá a papá, ¿sabes?\n@c0@"
  fr: "@aBianca@bOn n'est pas très loin de Saint Éloi, ici.\r\nJe me demande comment va papa.\n@c0@"
  it: "@aBianca@bNon siamo molto distanti da Aprianuam...\nChissà come sta mio padre...\n@c0@"
  ja: "@a@bビアンカ「ここからなら　お父さんの\n\tいる村も　わりと　近いわね。\n\tお父さん　元気にしてるかな。\n@c0@"
1:
  de: "@aNera@bIch erinnere mich an diesen Ort. Hier habe ich auf der Heimreise vom Stift mit der Schwester übernachtet.\n@c0@"
  en: "@aNera@bI remember this place. I stayed here one night with the sister on my way back home from the abbey.\n@c0@"
  es: "@aNera@bRicordo este sitio. La hermana y yo pasamos una notte aquí volviendo de la abadía.\n@c0@"
  fr: "@aNera@bJe me souviens de cet endroit. J'y suis restée une nuit avec la religieuse qui m'accompagnait pendant mon voyage de retour de l'abbaye vers la maison.\n@c0@"
  it: "@aNera@bMi ricordo di questo posto... Quando lasciai l'Abbazia di Su'ncyel per tornare a Mostroferrato, passai una notte qui.\n@c0@"
  ja: "@a@bフローラ「なつかしいですわ……。\n\t修道院からの帰り道　シスターと\n\tここに　泊まったんですもの。\n@c0@"
2:
  de: "@a%0%a001240@bOh! Eine Herberge hatte ich hier nicht erwartet. Du weißt aber auch wirklich alles, Papa!\n@c0@"
  en: "@a%0%a001240@bOh! I didn't expect there to be an inn here.\nYou know everything, Dad!\n@c0@"
  es: "@a%0%a001240@b¡Ah! No esperaba encontrar una posada aquí.\n¡Tú lo sabes todo, papá!\n@c0@"
  fr: "@a%0%a001240@bOhⓠ Je ne m'attendais pas à ce qu'il y ait une auberge, ici. Tu sais vraiment tout, papaⓠ\n@c0@"
  it: "@a%0%a001240@bNon avevo idea che qui ci fosse una locanda...\nPapà, tu sai sempre tutto!\n@c0@"
  ja: "@a@b%a001240「あれ？　こんな所に\n\t宿屋があったんだ。\n\tお父さんって　もの知りだね！\n@c0@"
3:
  de: "@a%0%a001250@bMeine Beine sind müde. Ich finde es sehr anstrengend, auf Sand zu laufen.\n@c0@"
  en: "@a%0%a001250@bMy legs are tired. It's really hard work\nwalking on sand.\n@c0@"
  es: "@a%0%a001250@bTengo las piernas cansadas. Cuesta mucho esfuerzo andar por la arena.\n@c0@"
  fr: "@a%0%a001250@bJ'ai mal aux jambes. C'est vraiment difficile de marcher sur le sable.\n@c0@"
  it: "@a%0%a001250@bSono stanchissima...\nCamminare sulla sabbia è davvero faticoso!\n@c0@"
  ja: "@a@b%a001250「……足が　つかれちゃった。\n\t砂の上って　歩くのたいへん……。\n@c0@"
4:
  de: "@aSancho@bMösstest du heute hier übernachten, Chico?\n@c0@"
  en: "@aSancho@bYou want to rest here for today, friend?\n@c0@"
  es: "@aSancho@b¿Quieres que paremos aquí por hoy, chamaco?\n@c0@"
  fr: "@aSancho@bTu veux t'arrêter ici p-pour te reposer, chicoⓡ\n@c0@"
  it: "@aSancho@b¿Chico, vuoi fermarte aquí por reposare un po'?\n@c0@"
  ja: "@a@bサンチョ「坊っちゃん\n\t今日は　ここで　休むんですか？\n@c0@"
5:
  de: "@aOtto@bWas für ein abgelegenes Kuhkaff. Hier gibt's wohl kaum irgendwelche netten jungen Damen, mit denen ich mir ein wenig die Zeit vertreiben könnte.\n@c0@"
  en: "@aTuppence@bWhat a remote little place. I don't expect I'll find any nice young ladies to entertain me here.\n@c0@"
  es: "@aAlazar@bQué sitio tan recóndito. No creo que vaya a encontrar bellas damas para distraerme\n@c0@"
  fr: "@aInnocent@bQuel endroit perdu. Je doute qu'il y ait ici de charmantes jeunes femmes pour me divertir.\n@c0@"
  it: "@aSimon@bTemo proprio che in questo luogo sperduto non troverò leggiadre fanciulle su cui gettare il mio sguardo rapace...\n@c0@"
  ja: "@a@bピピン「いや～　さみしいところですね。\n\t若い女性がいないんじゃ\n\tしかたないでしょうか……。\n@c0@"
6:
  de: "@aBianca@bDie Wahl des richtigen Zeitpunktes mag ja wichtig sein, aber sie ist nicht alles. Jede Menge Schwung gehört auch dazu.\n@c0@"
  en: "@aBianca@bTimin' might be important, but it en't everythin'.\r\nYou need lots of energy too.\n@c0@"
  es: "@aBianca@bLa coordinación es importante, pero no lo es todo.\r\nTambién hace falta un montonazo energía, ¿sabes?\n@c0@"
  fr: "@aBianca@bChoisir le bon moment est important, bien sûr, mais ça ne fait pas tout. Il faut aussi beaucoup d'énergie.\n@c0@"
  it: "@aBianca@bIo non me la cavo male a spaccare la legna, sai?\nAnzi, sono proprio brava!\n@c0@"
  ja: "@a@bビアンカ「タイミングも　大事だけど\n\tいきおいも　大事よね。\n\t私と%a000090が　そうだったように。\n@c0@"
7:
  de: "@aNera@bHe he he! Was für ein nettes kleines Liedchen! Genau richtig, um einem ein kleines Lächeln ins Gesicht zu zaubern.\n@c0@"
  en: "@aNera@bHe he he! What a funny little ditty! Just what you need to put a smile on your face.\n@c0@"
  es: "@aNera@b¡Ji, ji, ji! ¡Qué canzonetta más graciosa! Es lo que necesitabas para sonreír un po.\n@c0@"
  fr: "@aNera@bHi hi hiⓠ Quel drôle de dictonⓠ\nExactement ce qu'il faut pour redonner le sourire.\n@c0@"
  it: "@aNera@bNon ho mai provato a spaccar legna in vita mia...\nPapà la comprava già tagliata, pronta per essere messa nel camino.\n@c0@"
  ja: "@a@bフローラ「うふふ。　楽しい歌ですこと！\n\t明るい気分に　なりますわね。\n@c0@"
8:
  de: "@a%0%a001240@bIst denn die Wahl des richtigen Zeitpunkts wichtig im Leben? Erwachsene reden immer so kompliziertes Zeugs.\n@c0@"
  en: "@a%0%a001240@bIs timing important for life? Grown-ups always talk about such difficult things.\n@c0@"
  es: "@a%0%a001240@b¿Tan importante es la coordinación para la vida? Los adultos siempre están hablando de cosas complicadas.\n@c0@"
  fr: "@a%0%a001240@bEst-ce que c'est important de choisir le bon\nmoment, dans la vieⓡ Les grandes personnes\nparlent toujours de choses si compliquées.\n@c0@"
  it: "@a%0%a001240@bPer spaccare la legna servono muscoli, tecnica, ritmo... e un'ascia ben affilata!\nEh eh eh!\n@c0@"
  ja: "@a@b%a001240「人生って\n\tタイミングが　大事なの？\n\tおとなの話って　よくわからないよ。\n@c0@"
9:
  de: "@aSancho@bDie Wahl des risstigen Zeitpunkts? Vielleisst hat dein Onkel Sancho deswegen keine hübsche Ehefrau, no? Weil iss nie den risstigen Zeitpunkt gefunden habe.\n@c0@"
  en: "@aSancho@bTiming? Maybe ees why your Uncle Sancho, he no have a beautiful señora wife, no? Because hees timing, ees no so good.\n@c0@"
  es: "@aSancho@b¿Coordinación? Quizás por eso tu tito Sancho no tiene una linda señora esposa, ¿no?\nNo coordina demasiado.\n@c0@"
  fr: "@aSancho@bLe bon m-momentⓡ C'est peut-être pour ça que tonton S-Sancho n'a pas épousé de belle señora, noⓡ Parce que ce n'était p-pas le bon moment.\n@c0@"
  it: "@aSancho@b¡Lo zio Sancho no ha muscolos, però possiede un bellissimo panzon donde puede mettere muchissima paella!\n@c0@"
  ja: "@a@bサンチョ「ふむ…　タイミングですか。\n\t私が　いまだに　ひとり身なのは\n\tタイミングが良くないせいでしょうか。\n@c0@"
10:
  de: "@aBianca@b%0%a001210 war eine Säbelzahnkatze und nicht bloß eine normale Katze, oder?\n@c0@"
  en: "@aBianca@b%0%a001210 was a sabrecat and not just a regular cat, eh?\n@c0@"
  es: "@aBianca@bAsí que %a001210 era un dientes de sable y no un gato normal, ¿eh?\n@c0@"
  fr: "@aBianca@b%0%a001210 était un smilodon et pas un simple chat, n'est-ce pasⓡ\n@c0@"
  it: "@aBianca@bOra che ci penso, %a001210 era un Koguar e non un semplice gatto...\n@c0@"
  ja: "@a@bビアンカ「そういえば　%a001210ちゃんは\n\tネコじゃなくて　キラーパンサー\n\tだったって　言ってたよね？\n@c0@"
11:
  de: "@aBianca@bDie Säbelzahnkatze, von der der Typ gerade geredet hat, könnte ja wohl kaum...?\n@c0@"
  en: "@aBianca@bYou dun't think the sabrecat that bloke was just on about could be...?\n@c0@"
  es: "@aBianca@b¿No crees que el dientes de sable del que hablaba ese podría ser...?\n@c0@"
  fr: "@aBianca@bTu ne crois pas que le smilodon que ce type évoquait à l'instant pourrait être...ⓡ\n@c0@"
  it: "@aBianca@bForse il Koguar di cui parlava poco fa quel tizio è proprio...? No, non può essere %a001210.\nSarebbe una coincidenza incredibile!\n@c0@"
  ja: "@a@bビアンカ「さっきの人が　言ってた\n\tキラーパンサーって\n\tもしかして……。\n@c0@"
12:
  de: "@aNera@bRichtig zahm? Du bist doch bestimmt der Einzige, der tapfer genug ist, sich ein Monster als Haustier zu halten, %a000090!\n@c0@"
  en: "@aNera@bSomeone's pet!? Surely you're the only one brave enough to keep a monster as a pet, %a000090!\n@c0@"
  es: "@aNera@b¿Una mascota? ¡Solo tú eres lo bastante coraggioso para tener un monstruo como mascota, %a000090!\n@c0@"
  fr: "@aNera@bLe compagnon de quelqu'unⓡⓐ Tu es sûrement la\nseule personne assez courageuse pour posséder un monstre comme compagnon, %a000090ⓠ\n@c0@"
  it: "@aNera@bNon credo proprio che una belva del genere possa essere domata da qualcuno...\nTranne che da te, ovviamente!\n㈡\nTu sei l'unica persona al mondo che ha tanto coraggio da addomesticare un mostro, %a000090!\n@c0@"
  ja: "@a@bフローラ「人に　飼われていた…って\n\t魔物を飼いならせる方が　あなたの\n\tほかにも　いらっしゃるのかしら？\n@c0@"
13:
  de: "@a%0%a001250@bMeinst du, so eine furchterregende Säbelzahnkatze gibt es wirklich? Die würde ich ja gern mal sehen, du nicht auch, Papa?\n@c0@"
  en: "@a%0%a001250@bDo you think such a fearsome sabrecat\nreally exists? I'd like to see it for myself,\nwouldn't you, Dad?\n@c0@"
  es: "@a%0%a001250@b¿Crees que existe un dientes de sable tan temible? Me gustaría verlo con mis propios ojos, ¿a ti no, papi?\n@c0@"
  fr: "@a%0%a001250@bTu crois que ça existe, un smilodon aussi effroyableⓡ J'aimerais bien voir ça de mes\nyeux, pas toi, papaⓡ\n@c0@"
  it: "@a%0%a001250@bPapà, possiamo andare a vedere questo Koguar?\nDai, ti prego! Sono troppo curiosa!\n@c0@"
  ja: "@a@b%a001250「そんな　強い\n\tキラーパンサーさんが　いるの？\n\tお父さん…　わたし　見てみたい。\n@c0@"
14:
  de: "@aBianca@bWas das wohl für Klatsch ist? Wir sollten uns das mal ansehen!\n@c0@"
  en: "@aBianca@bI wonder what kind of gossip it is.\r\nWe should have a look!\n@c0@"
  es: "@aBianca@bMe pregunto qué clase de cotilleos serán.\r\n¡Deberíamos echar un vistazo!\n@c0@"
  fr: "@aBianca@bJe me demande de quels commérages il s'agit.\nOn devrait jeter un œilⓠ\n@c0@"
  it: "@aBianca@bChissà che pettegolezzi ci sono in quel libro...\r\nChe ne diresti di dare un'occhiata, eh?\r\nScommetto che anche tu non vedi l'ora di scoprirlo!\n@c0@"
  ja: "@a@bビアンカ「ウワサって\n\tどんなウワサかしら？\n\tねえ　%a000090　見てみようよ。\n@c0@"
15:
  de: "@aNera@bKlatsch ist ja eigentlich nicht schön. Aber... Ein Blick kann nicht schaden, damit wir einen ungefähren Eindruck bekommen.\n@c0@"
  en: "@aNera@bGossip isn't usually a good thing. But... I wouldn't mind having a look to see what it's about.\n@c0@"
  es: "@aNera@bLos cotilleos no sempre son buenos. Pero... Veramente, no me importaría echar un vistazo para ver qué pasa.\n@c0@"
  fr: "@aNera@bLes commérages sont plutôt néfastes, en général. Mais... j'aimerais quand même y jeter un œil pour savoir de quoi il s'agit.\n@c0@"
  it: "@aNera@bDi solito non amo i pettegolezzi, ma non mi dispiacerebbe dare uno sguardo a quel libro.\r\nCosì, giusto per vedere di che si tratta...\n@c0@"
  ja: "@a@bフローラ「ウワサなんて\n\t良くないですわ。\n\tでも　でも…　気になりますわね。\n@c0@"
16:
  de: "@a%0%a001240@bTratsch? Das will ich sehen!\n@c0@"
  en: "@a%0%a001240@bGossip? I want to see it!\n@c0@"
  es: "@a%0%a001240@b¿Cotilleos? ¡Eso quiero verlo!\n@c0@"
  fr: "@a%0%a001240@bDes comméragesⓡ Je veux lire ce livreⓠ\n@c0@"
  it: "@a%0%a001240@bPettegolezzi?!\nMa sono cose da donne!\n@c0@"
  ja: "@a@b%a001240「ウワサ話？\n\tボク　見たい　見たい！\n@c0@"
17:
  de: "@a%0%a001250@bSancho hat gesagt, es ist nicht recht, über andere zu tratschen.\n@c0@"
  en: "@a%0%a001250@bSancho told us it's not right to gossip about people.\n@c0@"
  es: "@a%0%a001250@bSancho nos dijo que no está bien cotillear sobre la gente.\n@c0@"
  fr: "@a%0%a001250@bSancho nous a dit que ça n'était pas bien de faire des commérages sur les gens.\n@c0@"
  it: "@a%0%a001250@bLo zio Sancho ci ha sempre detto che non è bello fare pettegolezzi.\n@c0@"
  ja: "@a@b%a001250「人のウワサをするのは\n\tよくありませんって\n\tサンチョおじさんが　言ってたの。\n@c0@"
18:
  de: "@a%0%a001250@bAber vielleicht ist es ja was anderes, wenn es schon jemand aufgeschrieben hat...\n@c0@"
  en: "@a%0%a001250@bBut if it's written down already, then maybe that's not so bad...\n@c0@"
  es: "@a%0%a001250@bPero si ya está escrito, tal vez no sea tan malo...\n@c0@"
  fr: "@a%0%a001250@bMais s'ils ont déjà été mis par écrit, peut-être que c'est moins grave...\n@c0@"
  it: "@a%0%a001250@bPerò noi non li faremmo!\nLi leggeremmo e basta, no?\nPerché non diamo un'occhiata?\n@c0@"
  ja: "@a@b%a001250「でも　書いてあるのなら\n\t大丈夫かな？\n@c0@"
19:
  de: "@aBianca@bWahrscheinlich ist er nur überflüssiges Gepäck, aber es kann nicht schaden, ihn mitzunehmen.\n@c0@"
  en: "@aBianca@bIt's probably all just much of a muchness, but it can't hurt to take it with.\n@c0@"
  es: "@aBianca@bProbablemente, no vengan más que exageraciones, pero tampoco hacen daño a nadie.\n@c0@"
  fr: "@aBianca@bTout ce qui est écrit là-dedans doit être du même genre, mais ça ne coûte rien de l'emporter.\n@c0@"
  it: "@aBianca@bMa sì, prendiamolo!\nMal che vada, ci faremo quattro risate!\n@c0@"
  ja: "@a@bビアンカ「たしかに　同じようなことしか\n\t書いてないしね。　でも　まあ\n\tおみやげとして　持っておきましょ。\n@c0@"
20:
  de: "@aNera@bIch habe ihn ganz durchgeblättert, aber ich konnte darin nichts über uns finden. Eigentlich schade.\n@c0@"
  en: "@aNera@bI looked all the way through, but I couldn't see anything in there about us. Shame, really.\n@c0@"
  es: "@aNera@bLo he leído de arriba abajo, pero no he visto nada sobre nosotros. ¡Ma per qué!\n@c0@"
  fr: "@aNera@bJe l'ai entièrement parcouru, mais je n'y ai rien trouvé sur nous. C'est dommage.\n@c0@"
  it: "@aNera@bHo controllato fino all'ultima pagina, e non c'è nemmeno un pettegolezzo su di noi. Meglio così! Non mi piace che gli altri si facciano gli affari miei!\n@c0@"
  ja: "@a@bフローラ「ノートを　全部見てみましたが\n\t私たちについての　ウワサは\n\tありませんでしたわ。　ほっ……。\n@c0@"
21:
  de: "@a%0%a001240@bAber wir nehmen ihn mit, oder? Man kann ja nie wissen, vielleicht ist er uns irgendwann mal von Nutzen.\n@c0@"
  en: "@a%0%a001240@bWe'll take it with us though, won't we?\nYou never know, it could come in useful.\n@c0@"
  es: "@a%0%a001240@bNos lo llevamos, ¿verdad?\nNunca se sabe, podría ser útil.\n@c0@"
  fr: "@a%0%a001240@bOn va quand même l'emmener, heinⓡ\nOn ne sait jamais, ça pourrait être utile.\n@c0@"
  it: "@a%0%a001240@bPapà, io direi di prenderlo.\nMi piace leggere qualcosa quando vado al...\nEhm, prendiamolo e basta...\n@c0@"
  ja: "@a@b%a001240「でも　お父さん\n\tいちおう　持っていくよね？\n\t何かの　役に立つかもしれないし。\n@c0@"
22:
  de: "@a%0%a001250@bEin schönes Märchenbuch fänd' ich viel interessanter als das Ding da.\n@c0@"
  en: "@a%0%a001250@bI think a nice storybook would be much more interesting than that thing.\n@c0@"
  es: "@a%0%a001250@bCreo que un bonito libro de cuentos sería más interesante que eso.\n@c0@"
  fr: "@a%0%a001250@bMoi, je crois qu'un bon livre de contes serait bien plus intéressant que ce truc.\n@c0@"
  it: "@a%0%a001250@bAvrei preferito di gran lunga un testo scientifico, o un bel libro di leggende... Però anche i pettegolezzi hanno il loro fascino! Eh eh eh!\n@c0@"
  ja: "@a@b%a001250「そんなペラペラのノートより\n\tご本のほうが　おもしろいです。\n@c0@"
23:
  de: "@aSancho@bIss lese keinen Tratsch.\n@c0@"
  en: "@aSancho@bI no read these gossips.\n@c0@"
  es: "@aSancho@bYo no leo chismes.\n@c0@"
  fr: "@aSancho@bPas question que je lise ces c-commérages.\n@c0@"
  it: "@aSancho@bNo, los pettegolezzos no me interessano.\n@c0@"
  ja: "@a@bサンチョ「私は　そのようなものは\n\t見ませんからね。\n@c0@"
24:
  de: "@aSancho@bNisst mal zehn Paellas würden miss dazu bringen!\n@c0@"
  en: "@aSancho@bEven eef you try to tempt me like the prestidigitator weeth the paella.\n@c0@"
  es: "@aSancho@bAunque intentes provocarme, como prestidigitador con enchilada.\n@c0@"
  fr: "@aSancho@bMême si tu essaies de me t-tenter comme oun prestidigitateur avec de la paella.\n@c0@"
  it: "@aSancho@b¡A menos que en quel libro no ce sia qualche succoso inciucios sul señor Padellon, el más famoso preparator de paella del mundo!\n@c0@"
  ja: "@a@bサンチョ「たとえ　坊っちゃんが\n\t悪魔のように　甘く\n\tゆうわく　したとしても！\n@c0@"
25:
  de: "@aBianca@bIch weiß noch, wie mein Vater mal etwas Ähnliches gesagt hat. Die Familie ist ihm heilig.\n@c0@"
  en: "@aBianca@bI remember Dad sayin' somethin' along the same lines. Family's ever so important to him.\n@c0@"
  es: "@aBianca@bRecuerdo que papá decía cosas parecidas. La familia es muy importante para él, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe me souviens avoir entendu papa dire quelque chose du même genre. La famille est vraiment très importante pour lui.\n@c0@"
  it: "@aBianca@bAnch'io la penso così.\nQuando si viaggia insieme, la strada sembra meno lunga e faticosa...\n@c0@"
  ja: "@a@bビアンカ「そういえば　父さんも\n\t同じこと言ってたわ。　なんだか\n\t家族ってことに　こだわってたみたい。\n@c0@"
26:
  de: "@aNera@bLiebling... Ach, nichts. Schon gut. Ich hatte nur gerade daran gedacht, wie glücklich ich bin, das ist alles.\n@c0@"
  en: "@aNera@bDarling... Um, never mind. I was just thinking how happy I am, that's all.\n@c0@"
  es: "@aNera@bCaro... Umm, da igual. Solo pensaba en lo felice que soy, nada más.\n@c0@"
  fr: "@aNera@bMon chéri... hum, non, rien. Je me disais simplement que j'étais très heureuse, c'est tout.\n@c0@"
  it: "@aNera@bAnche secondo me viaggiare in compagnia è meglio che farlo da soli, tesoro. È per questo che ho insistito tanto con mio padre per accompagnarti...\n@c0@"
  ja: "@a@bフローラ「あなた…\n\tいいえ　なんでもないの。\n\t私　幸せだな…　と思って……。\n@c0@"
27:
  de: "@a%0%a001240@bMit Sancho herumzureisen hat Spaß gemacht, aber mit dir zusammen ist es noch viel schöner.\n@c0@"
  en: "@a%0%a001240@bIt was fun travelling around with Sancho too, but being with you is much better.\n@c0@"
  es: "@a%0%a001240@bHa sido divertido viajar con Sancho, pero contigo es mucho mejor.\n@c0@"
  fr: "@a%0%a001240@bC'était amusant de voyager avec Sancho, mais c'est bien mieux d'être avec toi.\n@c0@"
  it: "@a%0%a001240@bViaggiare con lo zio Sancho è divertente, ma farlo con te lo è molto di più!\n@c0@"
  ja: "@a@b%a001240「サンチョとの旅も\n\t楽しかったけど　やっぱり\n\tお父さんたちとのが　いちばんだね！\n@c0@"
28:
  de: "@a%0%a001250@bPapa... Ach, es ist so schön, dass ich das endlich auch mal zu jemandem sagen kann!\n@c0@"
  en: "@a%0%a001250@bDad... Aah, it's so nice to be able to call you that after all those years.\n@c0@"
  es: "@a%0%a001250@bPapi... Aaah, qué bonito es poder llamarte así después de tantos años.\n@c0@"
  fr: "@a%0%a001250@bPapa... Aah, c'est tellement bien de pouvoir t'appeler comme ça après toutes ces années.\n@c0@"
  it: "@a%0%a001250@bPapino, mi sei mancato talmente tanto quando eri una statua, che ora non voglio più abbandonarti nemmeno per un minuto!\n@c0@"
  ja: "@a@b%a001250「お父さん…　えへへ……。\n@c0@"
29:
  de: "@aOtto@bMan kann viel daraus lernen, wie andere Leute ihre Herberge führen. Ihr wisst ja, dass meine Leut' zu Hause selbst eine Herberge haben.\n@c0@"
  en: "@aTuppence@bIt's quite useful seeing how various inns are run.\r\nWe run an inn back home, as you know.\n@c0@"
  es: "@aAlazar@bResulta muy útil ver cómo funcionan distintas posadas.\nComo sabéis, tenemos una posada.\n@c0@"
  fr: "@aInnocent@bC'est assez utile de voir la manière dont sont gérées les différentes auberges. Comme vous le savez, ma famille aussi tient un de ces établissements.\n@c0@"
  it: "@aSimon@bAh, che parole sagge...\nMaestà, lei mi è più caro di un parente!\nMi nominerebbe ⓕcugino onorarioⓖ?\n@c0@"
  ja: "@a@bピピン「こうして　宿屋を見るのは\n\t勉強になりますね。\n\tうちは　宿屋ですから。\n@c0@"
30:
  de: "@aBianca@bSind ihre Söhne nicht der Priester und der Mann aus der Schänke?\n@c0@"
  en: "@aBianca@bEn't those sons of hers the priest and the bloke from the inn?\n@c0@"
  es: "@aBianca@b¿Sus hijos no son el sacerdote y el tipo de la posada?\n@c0@"
  fr: "@aBianca@bEst-ce que ses fils sont le prêtre et le type de l'aubergeⓡ\n@c0@"
  it: "@aBianca@bMa è la madre del sacerdote e del tizio della locanda?!\n@c0@"
  ja: "@a@bビアンカ「あの人の　ふたりの息子って\n\tまさか　神父さんと　宿屋の\n\tカウンターにいる　おじさん？\n@c0@"
31:
  de: "@aBianca@bWie alt mögen die sein? Sie sieht kaum alt genug aus, um schon so erwachsene Kinder zu haben!\n@c0@"
  en: "@aBianca@bI wonder when she had them! She dun't look old enough to have kids that big!\n@c0@"
  es: "@aBianca@b¿Pero cuándo los tuvo? ¡No parece tener edad para tener hijos tan mayores!\n@c0@"
  fr: "@aBianca@bJe me demande quand elle les a eus. Elle n'a pas l'air assez vieille pour avoir des enfants aussi grandsⓠ\n@c0@"
  it: "@aBianca@bAccidenti! Se li porta proprio bene i suoi anni, eh?!\nNon avrei mai detto che questa donna ha due figli già adulti!\n@c0@"
  ja: "@a@bビアンカ「いったい　いくつの時に\n\t産んだのかしら。\n\tそんなトシに　見えないんだけど……。\n@c0@"
32:
  de: "@aNera@bManche haben das Glück, immer als Familie zusammenzuleben. Bei dem Gedanken werde ich fast ein wenig neidisch.\n@c0@"
  en: "@aNera@bSome people get to live together as a family all the time. I can't help feeling a little envious.\n@c0@"
  es: "@aNera@bHay gente que vive con su familia tutto el tiempo. Veramente, no puedo evitar sentirme un poco celosa.\n@c0@"
  fr: "@aNera@bCertaines personnes ont la chance de vivre en famille toute leur vie. Je ne peux pas m'empêcher de les envier un peu.\n@c0@"
  it: "@aNera@bQuando vedo una famiglia che ha avuto la fortuna di restare sempre unita, non riesco a non provare un pizzico di invidia...\n@c0@"
  ja: "@a@bフローラ「ああして　ずっと\n\t家族で　暮らせる人たちもいるのね。\n\t……すこし　うらやましいですわ。\n@c0@"
33:
  de: "@a%0%a001240@bDann sind sie also Brüder. Es muss schön sein, einen Bruder zu haben, mit dem man spielen kann.\n@c0@"
  en: "@a%0%a001240@bSo they're brothers. It must be fun having a brother to play with.\n@c0@"
  es: "@a%0%a001240@bAsí que son hermanos. Debe de ser divertido tener un hermano con el que jugar.\n@c0@"
  fr: "@a%0%a001240@bAlors ils sont frères. Ça doit être amusant d'avoir un frère avec qui jouer.\n@c0@"
  it: "@a%0%a001240@bChe bello dev'essere avere un fratello...\n@c0@"
  ja: "@a@b%a001240「男の兄弟かあ。\n\t毎日　いっしょに遊べて\n\tうらやましいなあ……。\n@c0@"
34:
  de: "@a%0%a001240@bNicht, dass ich %a001250 nicht gern hätte! Die ist auch ganz in Ordnung.\n@c0@"
  en: "@a%0%a001240@bNot that I don't like %a001250, of course!\nShe's cool too.\n@c0@"
  es: "@a%0%a001240@b¡Y no es que no me guste %a001250!\nElla también es genial.\n@c0@"
  fr: "@a%0%a001240@bÇa ne veut pas dire que je n'aime pas %a001250, heinⓠ Elle aussi, elle est super.\n@c0@"
  it: "@a%0%a001240@bPapà, non potremmo dar via %a001250 e prendere un bambino al suo posto? Eh eh eh!\nScherzo! %0%a001250 è troppo forte!\n@c0@"
  ja: "@a@b%a001240「あっ！　でも　ボク\n\t%a001250のことも　大好きだよ！\n@c0@"
35:
  de: "@aSancho@bDer Papá, er will immer einen Jungen, und la Madre, sie will immer ein Mädssen, no? Das habe iss schon oft erlebt.\n@c0@"
  en: "@aSancho@bThe papá, always he wants the boy, and the madre, eshe wants the girl, sí? Ees always like thees.\n@c0@"
  es: "@aSancho@bEl apá siempre quiere al hijo y la amá a la hija, ¿verdad? Siempre es así, nomás.\n@c0@"
  fr: "@aSancho@bLe padre, il veut toujours oun garçon, et la madre, toujours oune fille, noⓡ C'est t-toujours comme ça.\n@c0@"
  it: "@aSancho@bTodos los papà desiderano un maschietto, y todas las madres vorrebbero una femminuccia.\n㈡\n¡Chico, tu sei estato más intelligente: hai avuto un niño y una niña, y così hai resolto el problema!\n@c0@"
  ja: "@a@bサンチョ「男親は　男の子を…\n\t女親は　女の子をほしがるって\n\tよく　言いますねえ。\n@c0@"
36:
  de: "@aBianca@bMeine Güte! Damit hatte ich nicht gerechnet! Ich weiß noch, unsere erste Katze war anfangs auch so.\n@c0@"
  en: "@aBianca@bCrikey! That took me by surprise! I remember the cat at our place bein' like that at first.\n@c0@"
  es: "@aBianca@b¡Mi madre! ¡Qué sorpresa! Recuerdo que el gato de mi casa era así al principio.\n@c0@"
  fr: "@aBianca@bBon sangⓠ Ça m'a surpriseⓠ Je me souviens que le chat de chez moi était comme ça au début.\n@c0@"
  it: "@aBianca@bMa che gli è preso a quel gatto, eh?\nForse non riesce a trovare un sorcio da mettere sotto i denti?\n@c0@"
  ja: "@a@bビアンカ「ああ　びっくりした！\n\t私の家に　居ついたネコも\n\t最初は　あんな感じだったっけ。\n@c0@"
37:
  de: "@aNera@bOh weh! Die Katze scheint ja recht schlecht gelaunt zu sein. Na ja, wir haben alle mal solche Tage.\n@c0@"
  en: "@aNera@bOh dear! That cat seems to be in rather a bad mood. I suppose we all have days like that.\n@c0@"
  es: "@aNera@b¡Oh, cielos! Ese gato sembra bastante arisco. Ma tutti tenemos un día malo, ¿no?\n@c0@"
  fr: "@aNera@bOh là làⓠ On dirait que ce chat est de mauvaise humeur. Enfin, on a tous des jours comme ça.\n@c0@"
  it: "@aNera@bQuel micio sembra di pessimo umore.\nChissà, magari ha fame...\n@c0@"
  ja: "@a@bフローラ「あら　ネコさんは\n\tごきげんななめなのね。\n\tまあ　そういう日も　ありますわ。\n@c0@"
38:
  de: "@a%0%a001250@bDie Katze ist verletzt. Siehst du, wie sie sich leckt? Hoffentlich geht's ihr bald besser.\n@c0@"
  en: "@a%0%a001250@bThat cat's injured. See where she's licking?\nI hope she gets better soon.\n@c0@"
  es: "@a%0%a001250@bEse gato está herido. ¿Ves lo que está lamiendo?\nEspero que se cure pronto.\n@c0@"
  fr: "@a%0%a001250@bCe chat est blessé. Tu vois, là, à l'endroit où il se lèche. J'espère qu'il se rétablira vite.\n@c0@"
  it: "@a%0%a001250@bIl gattino mi sembra un po' spaventato...\nNon è che siamo stati noi a fargli paura?\n@c0@"
  ja: "@a@b%a001250「あのネコさん　ケガしてるよ。\n\tあの　なめてるところ…\n\tはやく　よくなるといいね。\n@c0@"
39:
  de: "@aGriselda@bEs ist so ruhig hier, wie immer. Hach, am liebsten würd' ich hier abends herkommen und singen und tanzen, damit es ein bisschen munterer zugeht!\n@c0@"
  en: "@aDebora@bThis place is quiet as usual. I can't help feeling like I want to stay every night and liven the place up a bit with some singing and dancing!\n@c0@"
  es: "@aStefania@bEste sitio está tranquilo, como siempre. ¡Hace que me apetezca quedarme una notte para cantar y bailar y animar un po' el cotarro!\n@c0@"
  fr: "@aPandora@bCet endroit est aussi paisible que d'habitude. J'aurais bien envie d'y rester toutes les nuits pour animer tout ça avec un peu de chant et de danseⓠ\n@c0@"
  it: "@aViola@bChe mortorio...\nMi verrebbe voglia di ordinarti di gridare a squarciagola solo per vivacizzare un po' l'ambiente...\n@c0@"
  ja: "@a@bデボラ「あいかわらず　静かな宿屋ね。\n\t私が　毎日とまって　歌とダンスで\n\tもりあげて　あげたいわ。\n@c0@"
40:
  de: "@aGriselda@bDu solltest auch ein wenig Holz hacken, damit du endlich mal ein paar Muskeln bekommst.\n@c0@"
  en: "@aDebora@bYou'd better do some chopping or the like to build up your muscles a bit.\n@c0@"
  es: "@aStefania@bSerá megliore que cortes un poco de leña o algo así per echar un poco de músculo.\n@c0@"
  fr: "@aPandora@bTu ferais bien de couper un peu de bois, d'ailleurs, ça te ferait les muscles.\n@c0@"
  it: "@aViola@bSpaccar legna è un ottimo esercizio per tonificare i muscoli. A te farebbe un gran bene darti da fare con l'ascia, visto qunto sei deboluccio...\n@c0@"
  ja: "@a@bデボラ「あんた　マキ割りでもして\n\t細っこいウデを　きたえなさいよ。\n@c0@"
41:
  de: "@aGriselda@bEinen Ehemann zu bändigen, das ist eine Sache, aber ein Monster zu zähmen, das ist eine ganz andere Geschichte.\n@c0@"
  en: "@aDebora@bTaming a husband is one thing, but taming a monster is quite another.\n@c0@"
  es: "@aStefania@bDomesticar a un monstruo es mucho más difícil que domesticar a un marito.\n@c0@"
  fr: "@aPandora@bApprivoiser un mari, c'est une chose, mais apprivoiser un monstre, c'en est une autre.\n@c0@"
  it: "@aViola@bDomare un mostro non può essere tanto peggio che domare un marito riottoso.\nSono certa che ci riuscirei senza problemi.\n@c0@"
  ja: "@a@bデボラ「私は　あんたを　手なづけているけど\n\t魔物は　手なづけられないのよね……。\n@c0@"
42:
  de: "@aGriselda@bAber du würdest das wahrscheinlich können, oder? Ich weiß bloß nicht, wie wir es an seinen früheren Herrn erinnern können.\n@c0@"
  en: "@aDebora@bYou'd probably be able to do it, though, wouldn't you? I don't know how we're supposed to remind it of its old owner, mind you.\n@c0@"
  es: "@aStefania@bMa supongo que tú podrás, ¿no? Aunque no sé cómo vamos a lograr algo de cuando era cachorro.\n@c0@"
  fr: "@aPandora@bMais tu devrais sûrement en être capable, nonⓡ N'empêche que je ne vois pas bien comment on pourrait lui rappeler son ancien propriétaire.\n@c0@"
  it: "@aViola@bCome faresti per ricordargli il suo vecchio padrone? Credi che fargli vedere un oggetto conosciuto sia un modo efficace? Mah, io ho i miei dubbi...\n@c0@"
  ja: "@a@bデボラ「あんたなら　魔物を\n\t手なづけられるんじゃない？\n\t思い出の品なんて　知らないけど。\n@c0@"
43:
  de: "@aGriselda@bTratsch ist dumme Zeitvergeudung. Die albernen Gerüchte, die zu Hause über mich im Umlauf waren, bedeuten nur, dass keiner die Wahrheit kannte.\n@c0@"
  en: "@aDebora@bGossip is a stupid waste of time. The silly rumours about me back home just meant no one really knew the truth.\n@c0@"
  es: "@aStefania@bLos cotilleos son un assurdo. Los que circulan sobre mí en il mio pueblo demuestran que nadie sabe nada de lo dulce que soy en realità.\n@c0@"
  fr: "@aPandora@bLes commérages ne sont qu'une stupide\nperte de temps.\n㈡\nToutes les rumeurs ridicules qui couraient à mon sujet quand je vivais encore à la maison signifiaient seulement que personne ne connaissait la vérité.\n@c0@"
  it: "@aViola@bOdio i pettegolezzi, soprattutto quelli che la gente sparge in giro su di me!\n㈡\nInvece di dirne di cotte e di crude sul mio conto senza nemmeno sapere chi sono, perché le persone non cercano di conoscermi?!\n@c0@"
  ja: "@a@bデボラ「ウワサなんて　あてにならないわ。\n\tサラボナでは　真実とかけはなれた　私の\n\tウワサに　皆がふりまわされてたもん。\n@c0@"
44:
  de: "@aGriselda@bHe! Wieso steht da nichts über mich drin?\n@c0@"
  en: "@aDebora@bHey! Why is there nothing about me in here?\n@c0@"
  es: "@aStefania@b¡Eh! ¿Por qué no hay nada sobre me?\n@c0@"
  fr: "@aPandora@bHéⓠ Pourquoi il n'y a rien à propos de moi,\nlà-dedansⓡ\n@c0@"
  it: "@aViola@bEhi!\nNon c'è nemmeno un pettegolezzo su di me!\nNon so se rammaricarmene o esserne felice...\n@c0@"
  ja: "@a@bデボラ「あら……？\n\tなんで　私の　ウワサがないの？\n\t残念ね。\n@c0@"
45:
  de: "@aGriselda@bWenn wir Kinder haben, möchte ich sie tun lassen, was ihnen gefällt. Ich brauche nur einen treu ergebenen Diener, und das bist du, %a000090.\n@c0@"
  en: "@aDebora@bWhen we have children, I want to just let them do as they please. I only need one servant, and that's you, %a000090.\n@c0@"
  es: "@aStefania@bCuando tengamos bambini quiero que hagan lo que les apetezca. Para sirviente ya te tengo a ti, %a000090.\n@c0@"
  fr: "@aPandora@bQuand nous aurons des enfants, je les laisserai faire exactement ce qu'ils veulent. Je n'ai besoin que d'un seul domestique et c'est toi, %a000090.\n@c0@"
  it: "@aViola@bSe un giorno avremo dei figli, li lascerò liberi di fare ciò che vogliono.\nA patto che vogliano quello che dico io, s'intende!\n@c0@"
  ja: "@a@bデボラ「子供たちには　好きなことさせて\n\tのびのびと　育ってほしいわ。\n\tしもべは　%a000090　１人いればいいし。\n@c0@"
46:
  de: "@aGriselda@bMeine Güte, %a000090! Du kannst Monster zähmen, aber du schaffst es nicht, eine Mieze zu streicheln, ohne dir einen Haufen Kratzer zu holen?\n@c0@"
  en: "@aDebora@bFor goodness' sake, %a000090!\nYou can tame monsters, but you can't pet a cat without getting into a fight!?\n@c0@"
  es: "@aStefania@b¡Cielos, %a000090!\n¿Puedes domar un monstruo pero no eres capaz de accarezzare a un gato sin meterte en líos?\n@c0@"
  fr: "@aPandora@bNom de nom, %a000090ⓠ Tu es capable d'apprivoiser des monstres, mais tu ne peux pas t'approcher d'un chat sans te bagarrerⓡⓐ\n@c0@"
  it: "@aViola@bAccidenti, %a000090!\nSaprai anche addomesticare mostri, ma con i gatti non ci sai proprio fare, eh?!\n@c0@"
  ja: "@a@bデボラ「ちょっと　%a000090！\n\tあんた　魔物　なだめられるのに\n\tネコっこ　１匹　なだめられないの？\n@c0@"
47:
  de: "@aGriselda@bDieser Schänkenwirt wusste gleich, dass wir glücklich verheiratet sind, und dabei kennt er uns nicht mal.\n@c0@"
  en: "@aDebora@bThat innkeeper could tell we were a happily married couple, even though he doesn't know us.\n@c0@"
  es: "@aStefania@bAunque no nos conozca, ese posadero puede ver que estamos felizmente casados. Al menos tú.\n@c0@"
  fr: "@aPandora@bCet aubergiste pouvait voir que nous sommes un couple heureux, même s'il ne nous connaît pas.\n@c0@"
  it: "@aViola@bPure io preferisco viaggiare in compagnia.\n@c0@"
  ja: "@a@bデボラ「宿屋の主人から見ても\n\t私たちは　幸せ者な夫婦に\n\t見えるということね。\n@c0@"
48:
  de: "@aGriselda@bSchön, dass es dir ganz offensichtlich gefällt, mein Leibsklave zu sein. Dann bleibst du mir auf immer treu ergeben.\n@c0@"
  en: "@aDebora@bIt's great that you seem nice and happy being my slave. It means you'll stay devoted to me for evermore.\n@c0@"
  es: "@aStefania@bEs genial que te guste tanto ser mi esclavo. Así me adorarás per sempre.\n@c0@"
  fr: "@aPandora@bC'est super que tu aies l'air si heureux d'être\nmon esclave. Ça veut dire que tu me seras\néternellement dévoué.\n@c0@"
  it: "@aViola@bSe sono da sola, vuol dire che non c'è nessuno pronto a servirmi e riverirmi.\n@c0@"
  ja: "@a@bデボラ「うれしいわ。\n\tあんたも　しもべとして　幸せなようで。\n\tこれからも　私に　尽くしてね。\n@c0@"
