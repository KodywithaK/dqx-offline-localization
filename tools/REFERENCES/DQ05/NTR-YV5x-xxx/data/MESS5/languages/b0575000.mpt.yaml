134:
  de: "@a%0%a001240@bEs ist komisch, Leute zu treffen, die dich von früher kennen, Papa.\n@c0@"
  en: "@a%0%a001240@bIt's weird meeting people who know you from\nbefore, Dad.\n@c0@"
  es: "@a%0%a001240@bEs raro encontrarse con gente que conoces de antes, papá.\n@c0@"
  fr: "@a%0%a001240@bÇa fait drôle de rencontrer des gens qui te connaissent d'avant, papa.\n@c0@"
  it: "@a%0%a001240@bPapà, mi fa una strana sensazione incontrare persone che conoscevi da prima che io nascessi... Non sarò mica geloso...?\n@c0@"
  ja: "@a@b%a001240「昔のお父さんを\n\t知ってる人に会うのって\n\tちょっと　へんな感じだね。\n@c0@"
135:
  de: "@a%0%a001250@bDer Opa war ja richtig nett.\n@c0@"
  en: "@a%0%a001250@bHe seems like a nice old man.\n@c0@"
  es: "@a%0%a001250@bParece un anciano encantador.\n@c0@"
  fr: "@a%0%a001250@bIl a l'air d'être un vieux monsieur très gentil.\n@c0@"
  it: "@a%0%a001250@bQuel signore ha la faccia simpatica.\n@c0@"
  ja: "@a@b%a001250「やさしそうな　おじいさん。\n@c0@"
136:
