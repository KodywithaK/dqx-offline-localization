137:
  de: "@aNera@bBianca ist so hübsch wie immer.\n@c0@"
  en: "@aNera@bBianca's as pretty as ever.\n@c0@"
  es: "@aNera@bVeramente, Bianca está tan bella como siempre.\n@c0@"
  fr: "@aNera@bBianca est toujours aussi jolie.\n@c0@"
  it: "@aNera@bBianca è sempre più bella.\n@c0@"
  ja: "@a@bフローラ「ビアンカさん　いつまでたっても\n\t本当に　おきれいですわ。\n@c0@"
138:
  de: "@aNera@bAber es sieht nicht so aus, als sei sie inzwischen verheiratet.\n@c0@"
  en: "@aNera@bIt doesn't seem like she's married yet, though.\n@c0@"
  es: "@aNera@bMa sembra que aún no se ha casado.\n@c0@"
  fr: "@aNera@bMais on dirait pourtant qu'elle n'est pas encore mariée.\n@c0@"
  it: "@aNera@bMi chiedo come mai una ragazza così affascinante non sia ancora sposata...\n@c0@"
  ja: "@a@bフローラ「でも　まだ　結婚は\n\tなさっていないみたいね……。\n@c0@"
139:
  de: "@a%0%a001240@bSie ist wirklich hübsch. Ihr wart Freunde, als ihr noch klein wart, nicht, Papa?\n@c0@"
  en: "@a%0%a001240@bShe's really pretty. You were friends with her when you were little, weren't you, Dad?\n@c0@"
  es: "@a%0%a001240@bEs muy guapa. Erais amigos de pequeños, ¿no, papá?\n@c0@"
  fr: "@a%0%a001240@bElle est vraiment jolie. Tu étais ami avec elle quand tu étais petit, hein, papaⓡ\n@c0@"
  it: "@a%0%a001240@bPapà, è vero che quella bella signorina era una tua amica d'infanzia?\n@c0@"
  ja: "@a@b%a001240「きれいな人だね。\n\tお父さんの幼なじみ　だったんでしょ？\n@c0@"
140:
  de: "@a%0%a001240@bIch frage mich, wie meine Mutter ist. Ich hoffe, ich lerne sie bald kennen.\n@c0@"
  en: "@a%0%a001240@bI wonder what my mum's like.\nI hope I get to meet her soon.\n@c0@"
  es: "@a%0%a001240@bMe pregunto cómo será mi madre.\nEspero verla pronto.\n@c0@"
  fr: "@a%0%a001240@bJe me demande à quoi ressemble ma maman.\nJ'espère qu'on la verra bientôt.\n@c0@"
  it: "@a%0%a001240@bPerché non hai sposato lei?\nEh eh eh! Io lo so! Non l'hai sposata perché la mia mammina è molto ma molto più bella di lei!\n@c0@"
  ja: "@a@b%a001240「ボクの　お母さんって\n\tどんな人かなあ……。\n\tはやく　顔が　見たいよ。\n@c0@"
141:
  de: "@a%0%a001250@bÄhm, Papa... Die Frau und du... Ähm, schon gut.\n@c0@"
  en: "@a%0%a001250@bUm, Dad... That girl and you...\nEr, never mind.\n@c0@"
  es: "@a%0%a001250@bMmm, papi... Esa chica y tú...\nEh, da igual.\n@c0@"
  fr: "@a%0%a001250@bHum, papa... Cette fille et toi...\nEuh, non. Rien.\n@c0@"
  it: "@a%0%a001250@bPapà, ma tu e quella ragazza...\nCioè, voi...? Lei ti piacev...\nOh, ma perché non mi faccio gli affari miei?!\n@c0@"
  ja: "@a@b%a001250「ねえ　お父さん。\n\tあの人　お父さんのこと……\n\tううん…　なんでもないです。\n@c0@"
142:
  de: "@aSancho@bUf! Das... Das ist doch Señorita Bianca! Sie ist wirkliss wunder-wunderschön geworden. Heh heh. Ist es nisst ein wenig heiß hier drin?\n@c0@"
  en: "@aSancho@bUf! Ees, ees señorita Bianca!\r\nShe ees eso, eso beautiful now.\r\nHeh heh. Ees, ees no a bit hot een here?\n@c0@"
  es: "@aSancho@b¡Ay, caramba! ¡Es la señorita Bianca!\nQué chula se ha puesto.\nJe, je. Pues empiezo a tener calor.\n@c0@"
  fr: "@aSancho@bHouⓠ C'est la señorita Biancaⓠ Elle est t-tellement jolie, maintenant. Hé hé. Pfiou, il fait oun peu chaud par ici, noⓡ\n@c0@"
  it: "@aSancho@b¡Ay, que espettacolo!\n¡La señorita Bianca es una vera bellezza!\n㈡\n¡Si lo zio Sancho avesse trenta años de menos, la inviterebbe a mangiare una buena paella... muy piccante!\n@c0@"
  ja: "@a@bサンチョ「おお　なつかしい。\n\tビアンカさんじゃないですか。\n\tきれいになって…　うっうっうっ……。\n@c0@"
143:
  de: "@aOtto@bWas macht denn ein so hübsches Mädchen ganz alleine? Vielleicht sollte ich mich um sie kümmern.\n@c0@"
  en: "@aTuppence@bWhatever is a beautiful girl like her doing all alone? Maybe I should take her on.\n@c0@"
  es: "@aAlazar@b¿Qué hace una chica tan guapa como ella aquí solita? Igual debería ocuparme de ella.\n@c0@"
  fr: "@aInnocent@bMais comment une belle fille comme elle peut-elle\nêtre encore seuleⓡ Je devrais peut-être l'emmener avec moi.\n@c0@"
  it: "@aSimon@bFiu-fiuuuu! Che schianto quella tipa! Che bambola, eh? È uno spettacolo! Una vera bellezza! È il tipo di donna che fa ribollire il sangue nelle vene e...\n@c0@"
  ja: "@a@bピピン「どうして　あんな美人が\n\tいまだに　ひとりで？\n\tボクが　もらってもいいですか！？\n@c0@"
144:
  de: "@aOtto@bHuch! Meine Güte, wenn Blicke töten könnten, %a000090...! Das war doch bloß ein Witz! Ihr braucht net gleich vor Wut zu schnauben!\n@c0@"
  en: "@aTuppence@bYikes! Now there's a look that could kill, %a000090! I was only joking. There's no need to get your knickers in a twist.\n@c0@"
  es: "@aAlazar@b¡Ay! ¡Hay miradas que matan, %a000090! Solo era una broma. No tenéis por qué soliviantaros.\n@c0@"
  fr: "@aInnocent@bOuilleⓠ Ça, c'est un regard qui tue, %a000090ⓠ Je plaisantais, hein. Pas la peine de vous mettre la rate au court-bouillon.\n@c0@"
  it: "@aSimon@bCome dice, Maestà? Quella leggiadra e soave fanciulla è una sua carissima amica d'infanzia?\nEhm...\n@c0@"
  ja: "@a@bピピン「ゾクッ……！\n\tす　すごい殺気ですよ　%a000090さま。\n\tじょうだんですから　怒らないで！\n@c0@"
145:
  de: "@a%0%a001250@bDie Katze wirkt ganz zufrieden. Aber ich bin ziemlich schläfrig.\n@c0@"
  en: "@a%0%a001250@bThe cat seems happy enough.\nI'm pretty sleepy, though.\n@c0@"
  es: "@a%0%a001250@bEl gato parece muy contento.\nPero yo tengo mucho sueño.\n@c0@"
  fr: "@a%0%a001250@bCe chat a l'air plutôt heureux.\nMoi, j'ai un peu sommeil.\n@c0@"
  it: "@a%0%a001250@bQuel gatto è molto più sveglio di me...\nPapà, sto morendo di sonno...\n@c0@"
  ja: "@a@b%a001250「ネコさんは　元気なの。\n\tでも　わたし　眠いの……。\n@c0@"
146:
  de: "@aBianca@bNa, das ist ja reizend! Er scheint uns nicht mal bemerkt zu haben!\n@c0@"
  en: "@aBianca@bCharmin'! He dun't seem to have noticed we're here\r\nat all!\n@c0@"
  es: "@aBianca@b¡Qué simpático! Parece que no se ha dado cuenta ni de que estamos aquí, ¿sabes?\n@c0@"
  fr: "@aBianca@bAh, charmantⓠ Il ne semble même pas avoir remarqué notre présenceⓠ\n@c0@"
  it: "@aBianca@bHah!\nÈ talmente preso dal suo bagno che non s'è nemmeno accorto della nostra presenza!\n@c0@"
  ja: "@a@bビアンカ「もうっ！\n\t私たちが　入ってるっていうのに\n\tしょうのない人ねえ！\n@c0@"
147:
  de: "@aNera@bAlso eigentlich ist er hier ja nicht allein. Und doch findet er nichts dabei, sich so den Rücken zu waschen.\n@c0@"
  en: "@aNera@bThere are actually quite a few people about, and yet he doesn't seem to feel at all self-conscious about washing his back like that.\n@c0@"
  es: "@aNera@bAunque hay bastante gente por aquí, no parece que le importe lavarse la espalda così.\n@c0@"
  fr: "@aNera@bIl y a quand même quelques personnes dans le coin, mais ça n'a pas l'air de le déranger de se frotter le dos comme ça en public.\n@c0@"
  it: "@aNera@bSi sta proprio divertendo, eh?\n@c0@"
  ja: "@a@bフローラ「まわりが　さわがしいですけど\n\t気にせずに　お背中　流しますわね。\n@c0@"
148:
  de: "@aNera@bWenn wir allein wären, könnte ich dir auch den Rücken waschen. Du hast so einen schönen muskulären Rücken!\n@c0@"
  en: "@aNera@bI could wash your back if only we had the place to ourselves. It's so nice and muscular!\n@c0@"
  es: "@aNera@bSi estuviésemos solos aquí yo también te podría lavar la tua espalda. ¡Me gusta tanto, con esos músculos!\n@c0@"
  fr: "@aNera@bMoi aussi je pourrais te frotter le dos si nous étions seuls ici. Il est tellement muscléⓠ Hi hi hiⓠ\n@c0@"
  it: "@aNera@bAh, quanto vorrei fare un bel bagno insieme a te, tesoro mio...\nTu e io, da soli...\n@c0@"
  ja: "@a@bフローラ「あなたの背中って　ひろいわ。\n\tぽっ……。\n@c0@"
149:
  de: "@a%0%a001240@bDarf ich auch baden?\n(Plitsch platsch)\n@c0@"
  en: "@a%0%a001240@bCan I have a splash about too?\n(splish splash)\n@c0@"
  es: "@a%0%a001240@b¿Puedo chapotear un poco?\n(splish, splash)\n@c0@"
  fr: "@a%0%a001240@bEst-ce que je peux barboter, moi aussiⓡ\n(plouf plouf)\n@c0@"
  it: "@a%0%a001240@bChe bello fare il bagno alle terme!\n@c0@"
  ja: "@a@b%a001240「ボクも　泳いでいい？\n\tバシャ　バシャ　バシャ！！\n@c0@"
150:
  de: "@a%0%a001250@bIch bade gern, aber jetzt bin ich schläfrig. Ich hab Angst, dass ich womöglich ertrinke! Gluck... gluck... Ha!\n@c0@"
  en: "@a%0%a001250@bI like having a bath, but I'm sleepy now, so I'm afraid I might drown! Glug...glug... Ha!\n@c0@"
  es: "@a%0%a001250@b¡Me gusta bañarme, pero tengo tanto sueño que podría ahogarme! Glu... glu... ¡Ja!\n@c0@"
  fr: "@a%0%a001250@bJ'aime bien prendre des bains, mais là, je suis fatiguée, alors j'ai peur de boire la tasseⓠ\nGlou... Glou... Ahⓠ\n@c0@"
  it: "@a%0%a001250@bHo talmente tanto sonno che ho paura di addormentarmi in acqua...\n@c0@"
  ja: "@a@b%a001250「温泉　気持ちいいけど\n\t眠いから　おぼれちゃうかも…\n\tブクブク……ガボッ！\n@c0@"
151:
  de: "@aSancho@bDas ist ein schönes Bad. Aber vielleisst ist es noch schöner, wenn es nisst ganz so laut ist, meinst du nisst?\n@c0@"
  en: "@aSancho@bEes a nice bath. But maybe ees nicer eef ees no eso noisy, eh?\n@c0@"
  es: "@aSancho@bEste baño está bien padre. Nomás que estaría mejor si no hubiera tanto ruido.\n@c0@"
  fr: "@aSancho@bC'est oun bain agréable. Mais peut-être que c'est\nm-mieux quand il y a moins de b-bruit, noⓡ\n@c0@"
  it: "@aSancho@b¡Ay, que buenas las termas!\nL'agua es caliente como el brodino della paella...\n@c0@"
  ja: "@a@bサンチョ「ふう…　いいお湯ですねえ。\n\tできれば　もっと　しずかに\n\t入っていたいんですが……。\n@c0@"
152:
  de: "@aBianca@bWir dürfen uns nicht allzu lange aufhalten, aber es ist schließlich schon dunkel. Vielleicht sollten wir hier übernachten?\n@c0@"
  en: "@aBianca@bWe can't hang about too much, but it is dark now, after all. Maybe we should stay here the night?\n@c0@"
  es: "@aBianca@bNo podemos distraernos demasiado, pero resulta que ya ha oscurecido. ¿Pasamos la noche aquí?\n@c0@"
  fr: "@aBianca@bNous ne pouvons pas trop traîner, mais il fait nuit maintenant, de toute façon. Peut-être que nous devrions passer la nuit iciⓡ\n@c0@"
  it: "@aBianca@b%0%a000090, s'è fatto tardi...\nChe ne dici di trascorrere la notte qui?\n@c0@"
  ja: "@a@bビアンカ「ゆっくりは　してられないけど\n\tもう　夜だもんね。\n\t今夜は　ここに泊まりましょうか？\n@c0@"
153:
  de: "@aBianca@bAls wir ganz neu hier waren, hat es mir erst gar nicht gefallen.\n@c0@"
  en: "@aBianca@bI didn't much care for this place when we first moved here.\n@c0@"
  es: "@aBianca@bEste sitio no me hacía mucha gracia cuando nos mudamos aquí.\n@c0@"
  fr: "@aBianca@bQuand nous avons emménagé ici, cet endroit ne signifiait rien de particulier pour moi.\n@c0@"
  it: "@aBianca@bQuando ci trasferimmo qui, questo posto non mi diceva niente.\nPer me era solo un villaggio come un altro.\n@c0@"
  ja: "@a@bビアンカ「最初は　この村のこと\n\tなかなか　好きに　なれなかったわ。\n@c0@"
154:
  de: "@aBianca@bIch weiß nicht, wann sich das geändert hat, aber inzwischen finde ich es hier prima.\n@c0@"
  en: "@aBianca@bI dun't know when my feelins changed, but I really love it here now.\n@c0@"
  es: "@aBianca@bNo sé cuándo cambié de opinión, pero ahora me encanta, ¿me entiendes?\n@c0@"
  fr: "@aBianca@bJe ne sais pas quand ça a commencé à changer, mais j'aime vraiment beaucoup ce village, maintenant.\n@c0@"
  it: "@aBianca@bPoi, all'improvviso, ha iniziato a piacermi, e ora credo che sia il luogo più bello del mondo...\nDopo Denim, s'intende!\n@c0@"
  ja: "@a@bビアンカ「でも　いつだったかな。\n\tこの村のこと　すごく\n\t大好きになったのって……。\n@c0@"
155:
  de: "@aNera@bMach dir keine Gedanken. Es macht mir nichts aus, wenn du nachschauen willst, wie es Bianca geht.\n@c0@"
  en: "@aNera@bDon't worry about me. I don't mind at all if you'd like to go and see how Bianca is doing.\n@c0@"
  es: "@aNera@bNon ti preoccupare per me. No me importa que vayas a ver cómo le va a Bianca.\n@c0@"
  fr: "@aNera@bNe t'inquiète pas. Ça ne m'ennuie pas du tout que tu aies envie d'aller voir comment va Bianca.\n@c0@"
  it: "@aNera@bNon mi arrabbio di certo, se vuoi andare a trovare Bianca.\n@c0@"
  ja: "@a@bフローラ「私のことは　お気になさらず\n\tビアンカさんの　様子を\n\t見てきてあげてくださいな。\n@c0@"
156:
  de: "@aNera@bSchließlich wart ihr doch Sandkastenfreunde, darum weiß ich, dass sie dir viel bedeutet.\n@c0@"
  en: "@aNera@bYou were childhood friends after all, so I know she means a lot to you.\n@c0@"
  es: "@aNera@bErais amigos de la infanciaⓓ sé que es importante per te.\n@c0@"
  fr: "@aNera@bAprès tout, vous êtes des amis d'enfance.\r\nJe sais qu'elle compte beaucoup pour toi.\n@c0@"
  it: "@aNera@bDopotutto siete amici da quando eravate piccoli, ed è normale che tu voglia passare a salutarla...\n@c0@"
  ja: "@a@bフローラ「幼なじみとは　ある意味\n\t特別な存在ですもの。\n\t気になさるお気持ちも　わかりますわ。\n@c0@"
157:
  de: "@aNera@bDieses Dorf ist so herrlich ruhig. Ich fühle mich einfach wohl hier!\n@c0@"
  en: "@aNera@bThis village is so lovely and quiet. Blissful!\n@c0@"
  es: "@aNera@bEste pueblo es tan bello y tranquilo... ¡Qué felicità!\n@c0@"
  fr: "@aNera@bCe village est si beau et si paisible.\nC'est un enchantementⓠ\n@c0@"
  it: "@aNera@bQuesto villaggio è così calmo e tranquillo...\nChe meraviglia!\n@c0@"
  ja: "@a@bフローラ「それにしても　ここは\n\t静かで　いいところですわね。\n@c0@"
158:
  de: "@a%0%a001240@bUi! Sieh dir nur all die Sterne an!\n@c0@"
  en: "@a%0%a001240@bWow! Look at all those stars!\n@c0@"
  es: "@a%0%a001240@b¡Vaya! ¡Mira cuántas estrellas!\n@c0@"
  fr: "@a%0%a001240@bWaouhⓠ Regarde toutes ces étoilesⓠ\n@c0@"
  it: "@a%0%a001240@bPapà, hai visto quante stelle?!\n@c0@"
  ja: "@a@b%a001240「うわあ　すっごいや！\n\tほらほら　星がいっぱい！\n@c0@"
159:
  de: "@a%0%a001240@bHier sieht man viel mehr als in Humburg! Schau doch, Papa! Sind die nicht toll?\n@c0@"
  en: "@a%0%a001240@bThere's loads more than you ever see in Gotha.\nLook, Dad! They're amazing!\n@c0@"
  es: "@a%0%a001240@bSe ven muchísimas más que en Pankraz.\n¡Mira, papá! ¡Son increíbles!\n@c0@"
  fr: "@a%0%a001240@bIl y en a bien plus qu'à Gotha. Regarde, papaⓠ\nElles sont incroyablesⓠ\n@c0@"
  it: "@a%0%a001240@bCe ne sono molte di più di quante se ne vedono a Denim! Forse il cielo di Aprianuam è più grande di quello che c'è sul nostro castello?\n@c0@"
  ja: "@a@b%a001240「グランバニアで見るより\n\tずーっと　いっぱいあるよ！\n\tお父さんも　見て！　ねっ！\n@c0@"
160:
  de: "@a%0%a001240@bHmmm...\n@c0@"
  en: "@a%0%a001240@bMmm...\n@c0@"
  es: "@a%0%a001240@bMmm...\n@c0@"
  fr: "@a%0%a001240@bMmm...\n@c0@"
  it: "@a%0%a001240@bSniff!\nSniff! Sniff!\n@c0@"
  ja: "@a@b%a001240「すーっ　はーっ……。\n@c0@"
161:
  de: "@a%0%a001240@bDie Luft hier ist fantastisch!\n@c0@"
  en: "@a%0%a001240@bThe air here smells amazing!\n@c0@"
  es: "@a%0%a001240@b¡Qué bien huele aquí el aire!\n@c0@"
  fr: "@a%0%a001240@bL'air sent vraiment très bon iciⓠ\n@c0@"
  it: "@a%0%a001240@bAhhh...!\nSenti che aria puraaah...!\n@c0@"
  ja: "@a@b%a001240「すっごく　空気がきれい。\n\tきっもちいーい！\n@c0@"
162:
  de: "@a%0%a001240@bIrgendwie kommt es mir hier so vertraut vor.\n@c0@"
  en: "@a%0%a001240@bThis place feels all familiar for some reason.\n@c0@"
  es: "@a%0%a001240@bEste sitio me suena de algo y no sé por qué.\n@c0@"
  fr: "@a%0%a001240@bJe ne sais pas pourquoi, mais cet endroit me paraît familier.\n@c0@"
  it: "@a%0%a001240@bL'atmosfera di questo posto mi è familiare...\nPerò non riesco a capire perché!\n@c0@"
  ja: "@a@b%a001240「この村　なんだか\n\tなつかしい感じがするね。\n\tどうしてだろう……。\n@c0@"
163:
  de: "@a%0%a001250@bDer Wald spricht mit uns, weißt du. Die Bäume begrüßen uns. Sie sind alle so nett!\n@c0@"
  en: "@a%0%a001250@bThe forest is talking, you know. The trees are saying hello. They're all so friendly!\n@c0@"
  es: "@a%0%a001250@bEl bosque está hablando. Los árboles nos saludan. ¡Son todos muy simpáticos!\n@c0@"
  fr: "@a%0%a001250@bTu sais, la forêt parle. Les arbres nous disent bonjour. Ils sont tous si gentilsⓠ\n@c0@"
  it: "@a%0%a001250@bLa foresta ci sta parlando, papà.\nGli alberi ci dicono ⓕSalve! Come va?ⓖ...\nEhm, no... Non ho preso un'insolazione...\n@c0@"
  ja: "@a@b%a001250「森さんが　お話ししてくるの。\n\tこんにちは　って……。\n\tみんな　やさしいね。\n@c0@"
164:
  de: "@a%0%a001250@bEs ist so... ruhig hier... Ich werde... (gähn)... ganz... schläfrig...\n@c0@"
  en: "@a%0%a001250@bIt's so...quiet here...\nIt's making me...(yawn)...feel all...sleepy.\n@c0@"
  es: "@a%0%a001250@bEsto está... tan silencioso...\nMe está... (aaah)... dando.... sueño.\n@c0@"
  fr: "@a%0%a001250@bTout est si... tranquille, ici...\nÇa me donne... (bâillement)... envie de... dormir.\n@c0@"
  it: "@a%0%a001250@bChe pace... Che silenzio...\nChe tranquillità...\nYaaawn... Mi sta venendo sonno...\n@c0@"
  ja: "@a@b%a001250「こんなに　しずかだと…\n\t眠く…　なっちゃ…　う………。\n@c0@"
165:
  de: "@aSancho@bEs liegt so hoch in den Bergen. Sí, Señor Weißner, er hat sisser ein schweres Leben.\n@c0@"
  en: "@aSancho@bEes eso high een the mountains. Sí, señor Whitaker, he must have a very hard life.\n@c0@"
  es: "@aSancho@bEstá en lo más alto de las montañas. Sí, el señor Doptada debe tener una vida padrísima.\n@c0@"
  fr: "@aSancho@bNous sommes si haut dans les m-montagnes.\r\nLe señor Alba doit avoir oune vie très difficile.\n@c0@"
  it: "@aSancho@bEl señor Whitblanche abita en un luego muy altos, tra las montagnas.\nPienso que no deve essere facil vivere aquí...\n@c0@"
  ja: "@a@bサンチョ「こんな山奥に……。\n\tダンカンさんも　さぞや\n\t苦労されたことでしょうねえ。\n@c0@"
166:
  de: "@aSancho@bIss weiß nisst, ob es an den Monstern liegt oder daran, dass wir so hoch in den Bergen sind, aber iss fühle miss nisst sisser. Wir sollten jetzt rasten.\n@c0@"
  en: "@aSancho@bI no esure eef ees the monsters or being up een the mountains, but I no feel esafe.\r\nEes time we rest for today.\n@c0@"
  es: "@aSancho@bYo no sé si es por los monstruos o por las alturas, pero no estoy tranquilo.\nYa vámonos a descansar, ¿ok?\n@c0@"
  fr: "@aSancho@bJe ne sais pas si c'est à c-cause des monstres ou de la m-m-montagne, mais je ne me sens pas en sécurité. C'est l'heure de se r-reposer.\n@c0@"
  it: "@aSancho@bChico, soy muy estanco...\n¿Por qué no ce facciamo una buena siesta, eh?\n@c0@"
  ja: "@a@bサンチョ「魔物やら　山賊やらで\n\tなにかと　ぶっそうです。\n\t今日は　ここらで休みましょう。\n@c0@"
167:
  de: "@aOtto@bAah, jetzt bin ich aber ziemlich müd'. Vielleicht sollten wir allmählich irgendwo einkehren zum Übernachten, %a000090, net wahr?\n@c0@"
  en: "@aTuppence@bAaah, I must admit that I'm rather tired. Perhaps we could find ourselves a bed for the night before too long, %a000090?\n@c0@"
  es: "@aAlazar@bAaah, he de reconocer que estoy algo cansado. ¿No podríamos buscar camas para pasar la noche, %a000090?\n@c0@"
  fr: "@aInnocent@bAaaah, je dois reconnaître que je suis un peu fatigué.\n㈡\nPeut-être que nous ne devrions pas trop tarder\nà nous chercher un lit pour la nuit, n'est-ce pas, %a000090ⓡ\n@c0@"
  it: "@aSimon@bSire, le confesso che il sottoscritto comincia ad accusare una certa stanchezza. Che ne direbbe di trovare un luogo dove trascorrere la notte?\n@c0@"
  ja: "@a@bピピン「ふわぁ～　つかれた……。\n\t%a000090さま。　そろそろ\n\t宿屋に　入りませんか？\n@c0@"
168:
  de: "@aBianca@bOffenbar hat der Orden vom Zugzwang seine gierigen Schmutzfinger bis hierher ausgestreckt, was?\n@c0@"
  en: "@aBianca@bLooks like the Order of Zugzwang got their dirty mitts on this place too, eh?\n@c0@"
  es: "@aBianca@bParece que la Orden de Zugzwang ha echado su sucio guante a este lugar, ¿sabes?\n@c0@"
  fr: "@aBianca@bOn dirait que l'Ordre du Zugzwang a posé ses sales pattes ici aussi, heinⓡ\n@c0@"
  it: "@aBianca@bPare proprio che la Setta di Zugzwang sia arrivata anche qui...\n@c0@"
  ja: "@a@bビアンカ「光の教団は　この村にまで\n\t手を　のばしてきていたのね……。\n@c0@"
169:
  de: "@aNera@bAllmählich werde ich wirklich unruhig. Wir sollten uns beeilen, nach Nadiria zu kommen, Liebling.\n@c0@"
  en: "@aNera@bI'm starting to feel rather agitated now.\r\nWe should hurry to Nadiria, darling.\n@c0@"
  es: "@aNera@bMe estoy poniendo algo nerviosa.\nDeberíamos volver en seguida a Nadiria, caro.\n@c0@"
  fr: "@aNera@bJe commence à angoisser un peu. Nous devrions nous dépêcher d'aller à Nadiria, mon chéri.\n@c0@"
  it: "@aNera@bHai sentito, tesoro?\nCredo che faremmo bene a raggiungere Nadiria il prima possibile...\n@c0@"
  ja: "@a@bフローラ「私　いてもたっても\n\tいられなくなってきましたわ。\n\tはやく　魔界へ行きましょう？\n@c0@"
170:
  de: "@a%0%a001250@bWas meint er denn damit?\n@c0@"
  en: "@a%0%a001250@bWhat does he mean by the hard sell?\n@c0@"
  es: "@a%0%a001250@b¿Qué ha querido decir con ⓕla barrilaⓖ?\n@c0@"
  fr: "@a%0%a001250@bÇa veut dire quoi, baratinⓡ\n@c0@"
  it: "@a%0%a001250@bⓕZig Zug Zag Zimmerzapⓖ?!\nMa non era ⓕZugzwangⓖ?!\n@c0@"
  ja: "@a@b%a001250「てやんでい　って\n\tどこの言葉？\n@c0@"
171:
  de: "@aSancho@bDer Orden vom Zugzwang? Hier?\nDas kann iss nisst glauben!\n@c0@"
  en: "@aSancho@bThe Order of Zugzwang!? Here?\r\nI no believe eet!\n@c0@"
  es: "@aSancho@b¡¿La Orden de Zugzwang?! ¿Aquí?\n¡Ay, caramba, no puedo creerlo!\n@c0@"
  fr: "@aSancho@bL'Ordre du Zugzwangⓡⓐ Iciⓡ\nJe n'en r-r-reviens pasⓠ\n@c0@"
  it: "@aSancho@b¿Los seguaces della Setta de Zugzwang sono arrivatos anche aquí?\n¡No ce posso credere! ¡Ay, que noticia muy mala!\n@c0@"
  ja: "@a@bサンチョ「ふむ。　こんな所にまで\n\t光の教団が……。\n@c0@"
172:
  de: "@aBianca@bDas ist doch der Mann, der den Brautschleier angefertigt hat, oder?\n@c0@"
  en: "@aBianca@bThe bloke here's the one who made the veil for the weddin', eh?\n@c0@"
  es: "@aBianca@bEste tipo de aquí es el que hizo el velo para la boda, ¿verdad?\n@c0@"
  fr: "@aBianca@bC'est ce type qui a fabriqué le voile pour\nle mariage, nonⓡ\n@c0@"
  it: "@aBianca@bDa queste parti c'è l'artigiano che ha realizzato il velo nuziale, non è così?\n@c0@"
  ja: "@a@bビアンカ「そういえば　結婚式の時の\n\tヴェールは　ここのおじさんが\n\t作ってくれたのよね。\n@c0@"
173:
  de: "@aBianca@bWar der nicht hübsch? Ich hatte ja keine Ahnung, dass er so schöne Sachen machen kann.\n@c0@"
  en: "@aBianca@bIt wasn't half pretty. I had no idea he could make somethin' so lovely.\n@c0@"
  es: "@aBianca@bEra realmente bonito. No tenía ni idea de que fuese capaz de hacer algo tan hermoso, ¿sabes?\n@c0@"
  fr: "@aBianca@bIl était vraiment superbe. Je n'imaginais pas\r\nune seconde qu'il pouvait créer quelque\r\nchose d'aussi beau.\n@c0@"
  it: "@aBianca@bQuell'uomo è un artista!\nNon pensavo che fosse possibile creare un velo così semplice e bello al tempo stesso!\n@c0@"
  ja: "@a@bビアンカ「きれいなヴェールだったわよね。\n\tおじさんが　あんなの　作れるなんて\n\tぜんぜん　知らなかったな。\n@c0@"
174:
  de: "@aNera@bDieser zauberhafte Schleier, den ich bei unserer Hochzeit getragen habe, stammt doch von hier, nicht?\n@c0@"
  en: "@aNera@bThat wonderful veil I wore at our wedding was made here, wasn't it?\n@c0@"
  es: "@aNera@bAquel maravilloso velo que llevé en la nostra boda se fabricó aquí, ¿verdad?\n@c0@"
  fr: "@aNera@bLe merveilleux voile que j'ai porté le jour de notre mariage a été fabriqué ici, n'est-ce pasⓡ\n@c0@"
  it: "@aNera@bIl meraviglioso velo nuziale che ho indossato il giorno del nostro matrimonio è stato fatto qui, non è vero?\n@c0@"
  ja: "@a@bフローラ「結婚式の時に　つけた\n\tあの　すばらしいヴェールは\n\tこちらで作っていただいたんでしょう？\n@c0@"
175:
  de: "@aNera@bDas ist lustig. Er macht gar nicht den Eindruck, als würde er so etwas übernehmen, und dabei hat er seine Arbeit so gut gemacht.\n@c0@"
  en: "@aNera@bIt's funny. He doesn't seem like the kind of fellow to take on work like that, and yet he made such a lovely job of it.\n@c0@"
  es: "@aNera@bEs curioso. No parece el tipo de persona capaz de hacer un trabajo como ese, ma le salió una pieza primorosa.\n@c0@"
  fr: "@aNera@bC'est drôle. Cet homme ne semble pas du tout\ndu genre à se charger de ce type de travail et pourtant, il a réalisé quelque chose de magnifique.\n@c0@"
  it: "@aNera@bPosso dire una cattiveria? La persona che l'ha creato non ha affatto l'aspetto di chi è in grado di realizzare un oggetto tanto bello...\n@c0@"
  ja: "@a@bフローラ「ふだんは　そういう仕事を\n\t受けないそうなのに　お父さまったら\n\t本当に　ごういんで……。\n@c0@"
176:
  de: "@a%0%a001240@bUi! Eine Wohnung in einer Höhle! Ist das toll!\n@c0@"
  en: "@a%0%a001240@bWow! A house inside a cave! That's so cool!\n@c0@"
  es: "@a%0%a001240@b¡Vaya! ¡Una casa dentro de una cueva! ¡Genial!\n@c0@"
  fr: "@a%0%a001240@bWaouhⓠ Une maison à l'intérieur d'une grotteⓠ\nC'est trop génialⓠ\n@c0@"
  it: "@a%0%a001240@bPapà, hai visto?\nC'è una casa dentro la caverna!\nAnch'io voglio una casa ⓕcavernosaⓖ!\n@c0@"
  ja: "@a@b%a001240「わ～　洞くつの　おうちだ。\n\tカッコイイ～～！\n@c0@"
177:
  de: "@a%0%a001250@bSchau mal, Papa. Sieh dir nur all die Blumen an!\n@c0@"
  en: "@a%0%a001250@bLook, Dad. Look at all those flowers.\n@c0@"
  es: "@a%0%a001250@bMira, papi. Mira cuántas flores.\n@c0@"
  fr: "@a%0%a001250@bRegarde, papa. Regarde toutes ces fleurs.\n@c0@"
  it: "@a%0%a001250@bPapà, guarda quanti fiori!\n@c0@"
  ja: "@a@b%a001250「見て　お父さん。\n\tお花　いっぱい　かざってあるの。\n@c0@"
178:
  de: "@a%0%a001250@bMeinst du, der Mann hat sie alle ausgestellt? Wie nett von ihm!\n@c0@"
  en: "@a%0%a001250@bDo you think the man put them all on display?\nWhat a nice thing to do.\n@c0@"
  es: "@a%0%a001250@b¿Crees que ese hombre las ha puesto para que las vea la gente?\nQué detalle tan bonito.\n@c0@"
  fr: "@a%0%a001250@bTu crois que le monsieur les a mises exprès pour\nles montrerⓡ C'est une bonne idée.\n@c0@"
  it: "@a%0%a001250@bSono bellissimi, non è vero?\nQuando torneremo a Denim metterò tanti vasi di fiori a ogni finestra del castello!\n㈡\nE poi ordinerò a %a001240 di innaffiarli tutti i giorni\n!\nEh eh eh!\n@c0@"
  ja: "@a@b%a001250「あのおじさんが\n\tかざったのかな？\n\tやさしい人なのね。\n@c0@"
179:
  de: "@aBianca@bHa ha! Jetzt willst du schon wieder mit den Leuten reden, während sie schlafen! Du bist manchmal wirklich lustig, %a000090.\n@c0@"
  en: "@aBianca@bHa ha! There you go again, tryin' to speak to folk when they're sleepin'! You're a funny one sometimes, %a000090.\n@c0@"
  es: "@aBianca@b¡Ja, ja! ¡Que no puedes hablar con la gente cuando está durmiendo! A veces eres muy gracioso, %a000090.\n@c0@"
  fr: "@aBianca@bHa haⓠ Et c'est reparti. Tu essaies encore de parler aux gens pendant qu'ils dormentⓠ Tu es un drôle de larron, parfois, %a000090.\n@c0@"
  it: "@aBianca@bDimmi una cosa, %a000090...\nPerché ce l'hai con le persone che dormono?\nPerché non le lasci riposare in pace, eh?\n@c0@"
  ja: "@a@bビアンカ「うふふ。　あいかわらず\n\t寝てる人にも　話しかけるんだもん。\n\t%a000090ったら　変わってないね。\n@c0@"
180:
  de: "@aNera@bEr schläft tief und fest. Es muss eine schwere Arbeit sein, tagein, tagaus dafür zu sorgen, dass die Dinge wachsen.\n@c0@"
  en: "@aNera@bHe really is fast asleep. It must be tiring work trying to grow things day in day out.\n@c0@"
  es: "@aNera@bEstá en un sonno profondo. Debe de cansar trabajar cultivando cosas día sí y día también.\n@c0@"
  fr: "@aNera@bIl dort à poings fermés. Ça doit vraiment\r\nêtre un métier fatigant d'essayer de faire\r\npousser des choses en permanence.\n@c0@"
  it: "@aNera@bSta dormendo della grossa.\nCredo che abbia avuto una giornata molto faticosa...\n@c0@"
  ja: "@a@bフローラ「あの方　ぐっすり　ですわ。\n\t作物を育てるって\n\tたいへん　なんでしょうね。\n@c0@"
181:
  de: "@a%0%a001240@bWarum ist er denn so aufgeregt? Es ist ja gut, dass es eine Kirche und alles gibt, aber ich fühle mich trotzdem mies.\n@c0@"
  en: "@a%0%a001240@bWhy's he on the edge like that? It's good that\nthere's a church and everything, but I can't help feeling a bit bad.\n@c0@"
  es: "@a%0%a001240@b¿Por qué está tan alterado? Está bien eso de que haya una iglesia, pero no puedo evitar sentirme un poco mal.\n@c0@"
  fr: "@a%0%a001240@bPourquoi il est làⓡ C'est bien qu'il y ait une église et tout ça, mais je ne peux pas m'empêcher de me sentir un peu mal à l'aise.\n@c0@"
  it: "@a%0%a001240@bMi sento un po' a disagio...\n@c0@"
  ja: "@a@b%a001240「あの人　あんなハジっこで…\n\t教会があるのは　助かるけど\n\tちょっと　悪いことした気分だね。\n@c0@"
182:
  de: "@aSancho@bNein! Weck ihn nisst auf! Irgendwann muss er ja mal schlafen, nisst wahr?\n@c0@"
  en: "@aSancho@bNo! You no wake heem up!\nHe needs to have a siesta esometime, no?\n@c0@"
  es: "@aSancho@b¡No! ¡No lo despiertes!\nNecesita una siesta de vez en cuando, ¿ok?\n@c0@"
  fr: "@aSancho@bNoⓠ Ne le r-réveille pasⓠ Il faut bien qu'il f-fasse oune siesta de temps en temps, noⓡ\n@c0@"
  it: "@aSancho@b¿Que fai, chico?\n¡Por favor, no esvegliarlo!\n@c0@"
  ja: "@a@bサンチョ「ダメですよ！　起こしたら\n\tかわいそうじゃないですか。\n@c0@"
183:
  de: "@aBianca@bSie ist anscheinend hier, um ein Bad zu nehmen. Schön, dass sie so entspannen kann.\n@c0@"
  en: "@aBianca@bLooks like she's come to have a bath. It's nice that she can relax like that.\n@c0@"
  es: "@aBianca@bParece que ha venido a darse un baño. Me alegro de que pueda relajarse así, ¿sabes?\n@c0@"
  fr: "@aBianca@bElle est venue prendre un bain, on dirait. C'est bien qu'elle ait l'occasion de se détendre comme ça.\n@c0@"
  it: "@aBianca@bForse è venuta qui per fare un bagno e rilassarsi un po'.\nBeh, anche lei ha diritto a un po' di riposo, no?\n@c0@"
  ja: "@a@bビアンカ「温泉に　入りに来たのね。\n\tゆっくりしていってほしいな。\n@c0@"
184:
  de: "@aNera@bFindest du es nicht etwas merkwürdig, einer alten Frau beim Schlafen zuzusehen? Du solltest dir ein normaleres Hobby suchen, weißt du!\n@c0@"
  en: "@aNera@bDon't you think it's rather strange to be watching an old woman sleep? You could pick a more normal hobby, you know!\n@c0@"
  es: "@aNera@b¿Non ti sembra extraño mirar como duerme una anciana? ¡Podías elegir una afición más normal!\n@c0@"
  fr: "@aNera@bTu ne trouves pas ça un peu bizarre de regarder une vieille femme dormirⓡ Tu pourrais te choisir\ndes passe-temps un peu plus normaux, tu saisⓠ\n@c0@"
  it: "@aNera@bCaro, perché sei tanto attratto dalle persone che dormono, eh?!\nSei forse invidioso di loro?!\n@c0@"
  ja: "@a@bフローラ「あなたったら\n\tねているおばあさんを　のぞくなんて…\n\tあまりシュミが　良くないですわ。\n@c0@"
185:
  de: "@a%0%a001240@bSie hat gar nicht doll geschnarcht.\n@c0@"
  en: "@a%0%a001240@bShe didn't seem to be snoring too much.\n@c0@"
  es: "@a%0%a001240@bParece que no ronca mucho.\n@c0@"
  fr: "@a%0%a001240@bElle n'avait pas l'air de ronfler trop fort.\n@c0@"
  it: "@a%0%a001240@bLo zio Sancho non russa molto quando dorme, però a volte parla nel sonno e recita la ricetta della paella...\n@c0@"
  ja: "@a@b%a001240「うん。\n\tイビキは　聞こえなかったよ。\n@c0@"
186:
  de: "@a%0%a001250@bIch würde jetzt auch gern schlafen.\n@c0@"
  en: "@a%0%a001250@bI wouldn't mind a sleep now either.\n@c0@"
  es: "@a%0%a001250@bA mí tampoco me vendría mal un sueñecito.\n@c0@"
  fr: "@a%0%a001250@bJe ne serais pas contre dormir un peu, moi non plus.\n@c0@"
  it: "@a%0%a001250@bPapà, posso farmi un sonnellino anch'io?\n@c0@"
  ja: "@a@b%a001250「わたしも　眠りたい……。\n@c0@"
187:
  de: "@aBianca@bDanke, dass du dich immer so lieb um alles kümmerst.\n@c0@"
  en: "@aBianca@bThanks for always takin' care of things about\r\nthe place.\n@c0@"
  es: "@aBianca@bGracias por ocuparte siempre de este sitio.\n@c0@"
  fr: "@aBianca@bMerci d'avoir continué à vous occuper de cet endroit.\n@c0@"
  it: "@aBianca@bTi sono grata per aver tenuto in ordine questo posto...\n@c0@"
  ja: "@a@bビアンカ「いつも　私の家のことを\n\tしてくれて　ありがとう……。\n@c0@"
188:
  de: "@aBianca@bHm? Ach, nichts. Ich hab mich nur gerade bei dem Mann hier bedankt, das ist alles.\n@c0@"
  en: "@aBianca@bHm? Oh, nothin'. I was just sayin' a few words of thanks to that man there, that's all.\n@c0@"
  es: "@aBianca@b¿Mmm? ¡Ah!, nada. Solo estaba dando las gracias a aquel hombre, y ya está, ¿me entiendes?\n@c0@"
  fr: "@aBianca@bHeinⓡ Oh, non, rien. Je remerciais juste l'homme\nqui est là.\n@c0@"
  it: "@aBianca@bEh?\nOh, niente. Stavo solo ringraziando quell'uomo.\nTutto qui.\n@c0@"
  ja: "@a@bビアンカ「ううん。　なんでもない。\n\tあの人に　お礼言ったの。\n@c0@"
189:
  de: "@aNera@bIch hoffe sehr, dass auch Bianca glücklich wird.\n@c0@"
  en: "@aNera@bI do hope Bianca will live happily ever after too.\n@c0@"
  es: "@aNera@bEspero que Bianca también sea felice per sempre.\n@c0@"
  fr: "@aNera@bJ'espère que Bianca aura une vie heureuse,\r\nelle aussi.\n@c0@"
  it: "@aNera@bMa sta sognando Bianca...?\nEh eh eh!\n@c0@"
  ja: "@a@bフローラ「私　ビアンカさんには\n\t幸せになって　ほしいですわ……。\n@c0@"
190:
  de: "@aBianca@bWarum siehst du mich so an, %a000090?\n@c0@"
  en: "@aBianca@bWhy are you lookin' at me like that, %a000090?\n@c0@"
  es: "@aBianca@b¿Por qué me miras así, %a000090?\n@c0@"
  fr: "@aBianca@bPourquoi tu me regardes comme ça, %a000090ⓡ\n@c0@"
  it: "@aBianca@bPerché mi guardi in quel modo, %a000090?\n@c0@"
  ja: "@a@bビアンカ「なによ　%a000090。\n\tどうして　私を　見るのよ？\n@c0@"
191:
  de: "@aBianca@bIch kann doch nichts dafür. Er muss sich selbst über seine Gefühle klar werden. Das ist nicht meine Sache!\n@c0@"
  en: "@aBianca@bThere's nothin' I can do about it. It's up to him to figure out how he feels, not me!\n@c0@"
  es: "@aBianca@bNo puedo hacer nada al respecto. ¡Es él quien tiene que averiguar lo que siente, no yo!\n@c0@"
  fr: "@aBianca@bJe n'y peux rien, moi. C'est à lui de savoir ce qu'il ressent, pas à moiⓠ\n@c0@"
  it: "@aBianca@bNon è certo colpa mia se è innamorato di me, eh!\nNon posso mica controllare i sentimenti altrui, sai?!\n@c0@"
  ja: "@a@bビアンカ「私は　なにも言わないわよ。\n\tあの人が　自分で　決めることでしょ？\n@c0@"
192:
  de: "@aNera@bDu siehst etwas beunruhigt aus, Liebling. Ich glaube, wir denken das Gleiche.\n@c0@"
  en: "@aNera@bYou look a bit troubled, darling. I think we're probably experiencing the same emotion...\n@c0@"
  es: "@aNera@bSe te ve preocupado, caro mio. Creo que estamos sintiendo la misma emozione...\n@c0@"
  fr: "@aNera@bTu sembles un peu troublé, mon chéri. Je crois que nous ressentons un peu la même chose...\n@c0@"
  it: "@aNera@bCosa c'è, caro?!\nTi dà fastidio che qualcuno provi dei sentimenti per la ⓕtuaⓖ Bianca?! Grrrrr!\n@c0@"
  ja: "@a@bフローラ「あなた　ふくざつそうですわね。\n\t……私も　たぶん\n\t同じ気持ちかも　知れません。\n@c0@"
193:
  de: "@a%0%a001240@bWarum muss man anderen Leuten Flausen austreiben? Kapier' ich nicht.\n@c0@"
  en: "@a%0%a001240@bWhy do you have to make people forget about other people? I don't get it!\n@c0@"
  es: "@a%0%a001240@b¿Por qué tienes que hacer que la gente se olvide de los demás? ¡No lo entiendo!\n@c0@"
  fr: "@a%0%a001240@bPourquoi est-ce qu'il faudrait lui faire oublier la personne à laquelle il penseⓡ Je ne comprends pasⓠ\n@c0@"
  it: "@a%0%a001240@bPerché quella signorina vuole fargli dimenticare Bianca?\nForse Bianca è una persona cattiva?\n@c0@"
  ja: "@a@b%a001240「人って　もらったり\n\tもらえなかったりするの？\n\tボク　わかんないや。\n@c0@"
194:
  de: "@a%0%a001250@bSie klingt sehr entschlossen, findest du nicht?\n@c0@"
  en: "@a%0%a001250@bShe sounds very determined, doesn't she?\n@c0@"
  es: "@a%0%a001250@bParece muy decidida, ¿verdad?\n@c0@"
  fr: "@a%0%a001250@bElle a l'air très décidée, n'est-ce pasⓡ\n@c0@"
  it: "@a%0%a001250@bUhm...\nCome può quella ragazza fargli dimenticare Bianca, eh? Oh, forse sono troppo giovane per capirlo...\n@c0@"
  ja: "@a@b%a001250「ああいうお姉さんを\n\tせっきょく的　って言うのよね？\n@c0@"
195:
  de: "@aOtto@bDu kannst mich haben, wenn er dich net will, Herzerl!\n@c0@"
  en: "@aTuppence@bYou can have me if he doesn't want you, dear!\n@c0@"
  es: "@aAlazar@b¡Si él no te quiere, me tienes a mí, querida!\n@c0@"
  fr: "@aInnocent@bSi lui ne veut pas de toi, moi je suis là, ma belleⓠ\n@c0@"
  it: "@aSimon@bPerché quella bella fanciulla perde il suo tempo con un tipo del genere quando può avere il fantastico Simon tutto per sé, eh?\n@c0@"
  ja: "@a@bピピン「おじょうさんっ\n\tボクを　もらってくださいっ！\n@c0@"
196:
  de: "@aOtto@bHmpf! Sie hört gar nicht zu.\n@c0@"
  en: "@aTuppence@bHmph! She's not listening.\n@c0@"
  es: "@aAlazar@b¡Mmm! No me escucha.\n@c0@"
  fr: "@aInnocent@bMmpfⓠ Elle ne m'écoute pas.\n@c0@"
  it: "@aSimon@bTutto per sé, ho detto...?\nForse ho esagerato.\n㈡\nPer un attimo avevo dimenticato che dovrebbe combattere contro le migliaia di ammiratrici che ho in tutto il mondo...\n@c0@"
  ja: "@a@bピピン「……って　聞いてませんね。\n@c0@"
197:
  de: "@aBianca@bMan kann schwer sagen, ob er das nun ernst gemeint hat oder ob das bloß ein Witz war, oder?\n@c0@"
  en: "@aBianca@bIt's hard to tell whether he was bein' serious or whether he was jokin', eh?\n@c0@"
  es: "@aBianca@bEs difícil saber si hablaba en serio o era una broma, ¿sabes?\n@c0@"
  fr: "@aBianca@bDifficile de savoir s'il est sérieux ou s'il plaisante, heinⓡ\n@c0@"
  it: "@aBianca@bL'acqua...!\nLe pinne...!\nWah ah ah ah ah! Buona questa!\n@c0@"
  ja: "@a@bビアンカ「今のは　本気なのか\n\t冗談なのか　ビミョウなところね。\n\t６０点ってところかしら。\n@c0@"
198:
  de: "@aNera@bAber sein Gesicht ist auch schon ganz schrumpelig!\n@c0@"
  en: "@aNera@bBut his face is all wrinkly too!\n@c0@"
  es: "@aNera@b¡Ma su cara también está toda arrugada!\n@c0@"
  fr: "@aNera@bMais son visage aussi est tout ridéⓠ\n@c0@"
  it: "@aNera@bSolo le pinne?\nE le squame...?\nLe branchie...?\n@c0@"
  ja: "@a@bフローラ「まあ！\n\tお顔も　シワシワですわ。\n@c0@"
199:
  de: "@a%0%a001240@bIch bin auch schrumplig, wenn ich zu lange in der Badewanne sitzen bleibe.\n@c0@"
  en: "@a%0%a001240@bI get like that if I stay in the bath too long too.\n@c0@"
  es: "@a%0%a001240@bYo también me pongo así cuando me quedo mucho rato en el baño.\n@c0@"
  fr: "@a%0%a001240@bMoi aussi, ça me fait ça, quand je reste trop longtemps dans le bain.\n@c0@"
  it: "@a%0%a001240@bAnche a me piacerebbe stare in acqua a lungo, ma non abbiamo proprio tempo per farlo...\nSiamo persone impegnate, noi!\n@c0@"
  ja: "@a@b%a001240「お風呂にずっと入ってたら\n\tボクも　ああなるのかな。\n\tゾクッ……。\n@c0@"
200:
  de: "@a%0%a001250@bEr stinkt nach Schnaps. Können wir bitte von ihm weggehen?\n@c0@"
  en: "@a%0%a001250@bHe smells of drink. Can we get away from\nhim, please?\n@c0@"
  es: "@a%0%a001250@bHuele a alcohol. ¿Podemos alejarnos de él, por favor?\n@c0@"
  fr: "@a%0%a001250@bIl sent l'alcool. On pourrait s'éloigner de lui,\ns'il te plaîtⓡ\n@c0@"
  it: "@a%0%a001250@bSarà stato in acqua tutto il tempo che vuole, ma quel tipo puzza di sudore!\n@c0@"
  ja: "@a@b%a001250「お酒くさいよう……。\n\tはやく　出たいの。\n@c0@"
201:
  de: "@aBianca@bSo eine Frechheit! Sie bleibt nächtelang auf vor Sorge um ihn, und er redet so schlecht von ihr!\n@c0@"
  en: "@aBianca@bThe cheek of it! She's waitin' up worryin' about him, and he's talkin' about her like that!\n@c0@"
  es: "@aBianca@b¡Hay que ver qué cara! ¡Ella, esperándole preocupada, y él, hablando así de ella!\n@c0@"
  fr: "@aBianca@bIl est gonfléⓠ Elle reste debout à s'inquiéter pour lui et c'est comme ça qu'il parle d'elleⓡⓐ\n@c0@"
  it: "@aBianca@bPerché certe persone non capiscono che il dialogo è sempre preferibile alla violenza, eh?\n@c0@"
  ja: "@a@bビアンカ「もうっ！　おばさんは\n\tあのおじさんが　帰るまで　心配で\n\t起きて待ってるっていうのに！\n@c0@"
202:
  de: "@aNera@bGlaubst du, seine Frau ist wirklich so Furcht einflößend?\n@c0@"
  en: "@aNera@bDo you think his wife is really all that scary?\n@c0@"
  es: "@aNera@b¿Crees que su mujer veramente da miedo?\n@c0@"
  fr: "@aNera@bTu crois que sa femme est vraiment aussi horribleⓡ\n@c0@"
  it: "@aNera@bPensa quanto deve voler bene a sua moglie, per definirla un'arpia...!\n㈡\nE pensa anche quanto deve comportarsi bene lui, per meritarsi quelle legnate!\nIh ih ih!\n@c0@"
  ja: "@a@bフローラ「あの方の奥さん\n\tそんなに　こわいのかしら……。\n@c0@"
203:
  de: "@a%0%a001250@bIgitt! Betrunkene sind ekelig!\n@c0@"
  en: "@a%0%a001250@bYuck! Drunk people are horrible!\n@c0@"
  es: "@a%0%a001250@b¡Puaj! ¡Los borrachos son horribles!\n@c0@"
  fr: "@a%0%a001250@bBeurkⓠ Les gens saouls sont vraiment répugnantsⓠ\n@c0@"
  it: "@a%0%a001250@bHo il sospetto che quel signore non sia un ottimo marito...\n@c0@"
  ja: "@a@b%a001250「いや～ん！\n\t酔っぱらいさん　こわいっ。\n@c0@"
204:
  de: "@aSancho@bNein, nein, nein. Das ist gar nisst gut. Man muss den Dingen nüsstern entgegentreten.\n@c0@"
  en: "@aSancho@bNo, no, no. Thees ees no good.\nYou must no dreenk for courage.\n@c0@"
  es: "@aSancho@bNo, no, no. Eso no está bueno.\nNo debes beber para reunir valor.\n@c0@"
  fr: "@aSancho@bNo, no, no. Ça n'est p-pas bien. Il ne faut jamais\r\nb-boire pour se donner du c-courage.\n@c0@"
  it: "@aSancho@bChico, no dare mai dell'arpia alla tua mujer...\nNo es una cosa carina da dire a una señora.\n@c0@"
  ja: "@a@bサンチョ「むむむ……。\n\tあまり　いいお酒の飲み方とは\n\tいえないようですね……。\n@c0@"
205:
  de: "@aSancho@bDein Onkel Sancho, er hat keine Frau. Iss weiß nisst, wie es ist, mit jemand anderem zusammenzuleben.\n@c0@"
  en: "@aSancho@bYour Uncle Sancho, he no have a wife.\r\nI no know about the life weeth another.\n@c0@"
  es: "@aSancho@bTu tito Sancho no tiene esposa.\nNo sé como es la vida en pareja.\n@c0@"
  fr: "@aSancho@bTon tonton Sancho, il n'a pas de f-femme.\r\nAlors je ne sais pas c-comment ça fait de\r\nv-vivre avec oune autre personne.\n@c0@"
  it: "@aSancho@bLo zio Sancho no se es mai esposato...\n@c0@"
  ja: "@a@bサンチョ「私は　この年まで\n\tひとり身でしたので\n\t夫婦のことは　よくわかりません。\n@c0@"
206:
  de: "@aSancho@bAber iss kenne miss aus mit Hausarbeit, und iss weiß, wie man aus einem Muchacho einen Macho-Mann macht, no?\n@c0@"
  en: "@aSancho@bBut I know about the housework and I know how to turn a boy eento a macho man, sí?\n@c0@"
  es: "@aSancho@bYo nomás conozco de servir a mi país y de cómo criar chamacos, ¿ok?\n@c0@"
  fr: "@aSancho@bM-Mais je sais m'occuper d'oune maison et je sais comment élever oun petit garçon pour qu'il devienne oun hombre très f-fort, siⓡ\n@c0@"
  it: "@aSancho@bEs por esto motivo que ho dovuto imparare a prepararme la paella da solo. ¡Y sono anche en grados de rammendarme los calzinos!\n㈡\nSì, yo soy un hombre que sabe fare muchas cosas, ma me siento anche muy triste y solitario...\n@c0@"
  ja: "@a@bサンチョ「家事と育児は\n\t得意中の得意なんですが。\n@c0@"
207:
  de: "@aBianca@bIch kann's ihr nicht verdenken, wenn sie verbiestert ist. Sieh ihn dir nur an!\n@c0@"
  en: "@aBianca@bI dun't blame her. Look at the state of him!\n@c0@"
  es: "@aBianca@bNo la culpo. ¡Mira cómo va él!\n@c0@"
  fr: "@aBianca@bJe ne peux pas la blâmer. Regarde dans quel état\nil estⓠ\n@c0@"
  it: "@aBianca@bNon posso darle tutti i torti...\nNon giustifico certo la violenza, ma non è carino che lui si stia divertendo senza di lei!\n@c0@"
  ja: "@a@bビアンカ「奥さんが　怒るのも当然よ。\n\tあんなに　飲んだんじゃ\n\t身体　こわしちゃうわ。\n@c0@"
208:
  de: "@aNera@bHoffentlich kommt es nie dazu, dass ich dir so eine Gardinenpredigt halte, wie sie ihr Mann zu erwarten hat, wenn er nach Hause kommt.\n@c0@"
  en: "@aNera@bI do hope I never have to shout at you like she's going to shout at her hubbie when he gets home.\n@c0@"
  es: "@aNera@bEspero no tener que regañarte nunca come lo va a hacer ella cuando il suo maridito arrivi a casa.\n@c0@"
  fr: "@aNera@bJ'espère ne jamais avoir à te crier dessus comme\r\nelle va crier après son mari quand il rentrera.\n@c0@"
  it: "@aNera@bSpero proprio che non mi lascerai mai da sola a casa, ad aspettare che tu rientri da qualche locale...\n@c0@"
  ja: "@a@bフローラ「私は　あなたを\n\tしかるなんてこと　したくないですわ。\n@c0@"
209:
  de: "@aNera@bDas heißt also, du solltest nie etwas tun, weswegen ich schimpfen müsste. He he he!\n@c0@"
  en: "@aNera@bI suppose that means you'll just have to make sure you never do anything that warrants any shouting. He he he!\n@c0@"
  es: "@aNera@bY claro, eso significa que tendrás que procurar no hacer nunca niente para merecerlo. ¡Ji, ji, ji!\n@c0@"
  fr: "@aNera@bRemarque, il suffira juste que tu évites de faire quoi que ce soit qui mérite de tels cris. Hi hi hiⓠ\n@c0@"
  it: "@aNera@bSe proprio vorrai fare le ore piccole, dovrai portarmi con te!\nEh eh eh!\n@c0@"
  ja: "@a@bフローラ「ですから\n\tしかられるようなことは\n\tなさらないでくださいね。　うふふ。\n@c0@"
210:
  de: "@a%0%a001240@bMeinst du, sie wird ihn ausschimpfen? Verdient hätte er's ja.\n@c0@"
  en: "@a%0%a001240@bIs that man's wife going to tell him off? How funny!\n@c0@"
  es: "@a%0%a001240@b¿La mujer de ese hombre le va a echar la bronca? ¡Qué divertido!\n@c0@"
  fr: "@a%0%a001240@bEst-ce que la femme de ce type va le disputerⓡ C'est rigoloⓠ\n@c0@"
  it: "@a%0%a001240@bQuell'uomo le prenderà da sua moglie, quando tornerà a casa?\nAllora gli conviene non tornarci affatto!\n@c0@"
  ja: "@a@b%a001240「あのおじさん\n\t奥さんに　しかられるの？\n\t……わくわく。\n@c0@"
211:
  de: "@aBianca@bDie schläft nachts immer hier. Was ihr am Haus wohl so gut gefällt, dass sie so gern hier ist?\n@c0@"
  en: "@aBianca@bThat little one's always asleep here of a night. I wonder what it is about our house that it likes so much.\n@c0@"
  es: "@aBianca@bEse pequeñajo siempre duerme aquí. No sé por qué le gustará tanto nuestra casa, ¿sabes?\n@c0@"
  fr: "@aBianca@bCe petit chat vient toujours dormir ici la nuit. Je me demande ce qui lui plaît tant dans notre maison.\n@c0@"
  it: "@aBianca@bQuel gattino dorme sempre vicino casa mia...\nÈ proprio carino, non è vero?\n@c0@"
  ja: "@a@bビアンカ「あの子　夜は\n\tいつも　ここで寝てるの。\n\tそんなに　私の家が好きなのかしら。\n@c0@"
212:
  de: "@a%0%a001250@bSieh sie dir an, wie sie da zusammengekringelt liegt! Ist sie nicht süß?\n@c0@"
  en: "@a%0%a001250@bLook at him all curled up in a ball! How cute!\n@c0@"
  es: "@a%0%a001250@b¡Míralo, enroscado como una bola! ¡Qué tierno!\n@c0@"
  fr: "@a%0%a001250@bRegarde-le, tout roulé en bouleⓠ Comme c'est mignonⓠ\n@c0@"
  it: "@a%0%a001250@bQuel gattino è tutto raggomitolato su sé stesso!\nChe carino! Pare proprio una palla di pelo!\nSembra lo zio Sancho con la pelliccia...\n@c0@"
  ja: "@a@b%a001250「丸くなってる。\n\tかわいいね。\n@c0@"
213:
  de: "@aGriselda@bAußer Bäder gibt es hier wohl nicht viel, was?\n@c0@"
  en: "@aDebora@bThere's hardly anything here apart from the baths, is there?\n@c0@"
  es: "@aStefania@bAquí no hay niente aparte de los baños, ¿no?\n@c0@"
  fr: "@aPandora@bÀ part les bains, il n'y a presque rien ici, heinⓡ\n@c0@"
  it: "@aViola@bIn questo posto ci sono i bagni termali e poco altro...\n@c0@"
  ja: "@a@bデボラ「それにしても　温泉以外は\n\t本当に　何もない場所よね。\n@c0@"
214:
  de: "@aGriselda@bAber warum nutzen sie die Bäder nicht und machen daraus eine Touristenattraktion? Verstehe ich nicht...\n@c0@"
  en: "@aDebora@bDon't they have the brains to figure out they\r\ncould use them to sell the place as a tourist attraction?\n@c0@"
  es: "@aStefania@b¿A nadie se le ha ocurrido que podrían usarlos para atraer a los turistas?\n@c0@"
  fr: "@aPandora@bIls ne sont donc pas assez malins pour comprendre qu'ils pourraient les utiliser pour faire de cet endroit un site touristiqueⓡ\n@c0@"
  it: "@aViola@bSe aggiungessero un po' di servizi in più e qualche negozio d'abbigliamento, potrebbero attirare turisti a frotte!\n@c0@"
  ja: "@a@bデボラ「温泉を生かして　観光地にするとか\n\tそういうことは　考えないのかしら？\n@c0@"
215:
  de: "@aGriselda@bIn Kirchen und Ähnlichem habe ich mich noch nie besonders wohl gefühlt.\n@c0@"
  en: "@aDebora@bI've never been able to get on with the atmosphere in churches and the like.\n@c0@"
  es: "@aStefania@bNunca he podido soportar el ambiente de las iglesias y sitios così.\n@c0@"
  fr: "@aPandora@bJe n'ai jamais pu supporter l'atmosphère qui règne dans les églises ou autres lieux du même genre.\n@c0@"
  it: "@aViola@bMia sorella ha mille difetti, ma riconosco che, almeno una volta nella sua vita, è riuscita a fare qualcosa che va al di là delle mie capacità...\n@c0@"
  ja: "@a@bデボラ「私　教会みたいな\n\tかしこまった場の　ふんいきが\n\t昔から　好きじゃないの。\n@c0@"
216:
  de: "@aGriselda@bIch frage mich, wie Nera das all die Jahre ausgehalten hat. Für mich wäre das nichts gewesen...\n@c0@"
  en: "@aDebora@bNera did well to stay at the abbey all those years. There's no way I could've managed it.\n@c0@"
  es: "@aStefania@bMenos male que fue Nera la que estuvo todos esos anni en la abadía. Yo no lo hubiese aguantado.\n@c0@"
  fr: "@aPandora@bC'est une belle réussite pour Nera d'avoir passé toutes ces années à l'abbaye. Moi, je n'y serais jamais arrivée.\n@c0@"
  it: "@aViola@bHa resistito per non so quanti anni all'Abbazia di Su'ncyel.\n㈡\nA me sarebbe venuto un esaurimento nervoso dopo la prima ora di lezione, mentre lei ha frequentato l'intero corso di preparazione al matrimonio!\n@c0@"
  ja: "@a@bデボラ「フローラは　よく　修道院みたいな所で\n\t何年も　すごせたわよね。\n\t私には　絶対ムリよ。\n@c0@"
217:
  de: "@aGriselda@bOh, diese Katze ist so freundlich und bezaubernd! Genau wie ich...\n@c0@"
  en: "@aDebora@bOh, that cat's so charming and friendly!\r\nTwo of my own qualities, I might add.\n@c0@"
  es: "@aStefania@b¡Qué amabile y encantador es ese gato!\nDos de las cualidades que me caracterizan, por cierto.\n@c0@"
  fr: "@aPandora@bOh, ce chat est si mignon et si amicalⓠ Deux qualités dont je peux me targuer moi-même, d'ailleurs.\n@c0@"
  it: "@aViola@bI gatti mi sono simpatici, a patto che non mi riempiano gli abiti di peli! Voglio loro un gran bene, purché mi stiano a qualche metro di distanza...\n@c0@"
  ja: "@a@bデボラ「あら　ひとなつっこくて\n\tかわいい　ネコね。\n\tまるで　私みたいだわ。\n@c0@"
218:
  de: "@aGriselda@bUnverschämtheit! Ich weiß, bei dem ganzen Dampf kann man nicht viel sehen, aber deshalb sehe ich noch lange nicht aus wie ein ⓞaltes Mädchenⓟ!\n@c0@"
  en: "@aDebora@bThe cheek of it! I know it's steamy and hard to see, but I still look nothing like an ⓗold girlⓘ!\n@c0@"
  es: "@aStefania@b¡Hay que ver qué maleducato! ¡Ya sé que hay mucho vapor y todo eso, pero a mí nadie me llama ⓕla mayorⓖ!\n@c0@"
  fr: "@aPandora@bQuel culotⓠ Je sais qu'il y a beaucoup de vapeur et qu'il est difficile de voir quoi que ce soit, mais je ne ressemble certainement pas à sa femmeⓠ\n@c0@"
  it: "@aViola@bChe cosa?!\nMa l'hai sentito?!\nMi ha scambiata per un'altra persona!\n㈡\nQuesto è il peggior affronto che io abbia subito in vita mia! Io sono unica e inconfondibile! Voglio la testa di quell'uomo, %a000090!\n@c0@"
  ja: "@a@bデボラ「ちょっと！　いくら　湯気で\n\t見えづらいからって　私を　おばあさんと\n\tまちがえるだなんて　ありえないわ！\n@c0@"
219:
  de: "@aGriselda@bWer hätte gedacht, dass es in solch einem kleinen Ort auch Kriminelle gibt? Hach, wo soll das noch hinführen?\n@c0@"
  en: "@aDebora@bYou wouldn't have thought you'd have to put up with his sort in a quiet little place like this. What is the world coming to?\n@c0@"
  es: "@aStefania@bNo pensaba que fuésemos a encontrar a alguien così en un lugar tranquilo como este. ¿A dónde vamos a ir a parar?\n@c0@"
  fr: "@aPandora@bQui aurait cru qu'on pouvait tomber sur un voyou pareil dans un petit coin aussi tranquilleⓡ\nMais où va le mondeⓡ\n@c0@"
  it: "@aViola@bMa ci sono ladri anche qui?!\nChe tempi...\nChe tempi!\n@c0@"
  ja: "@a@bフローラ「こんな　静かな村にまで\n\tあのような　人たちが……　世界は\n\tこんなにまで　すさんでしまったのですね。\n@c0@"
220:
  de: "@aGriselda@bIch frage mich, wen er bestohlen hat. Du solltest das Ding erst mal behalten, %a000090.\n@c0@"
  en: "@aDebora@bI wonder who he stole that from.\nYou'd better hang onto it, %a000090.\n@c0@"
  es: "@aStefania@b¿A quién se lo habrá robado?\nSerá mejor que lo vigiles bene, %a000090.\n@c0@"
  fr: "@aPandora@bJe me demande à qui il a volé ça. Tu ferais bien de le garder pour l'instant, %a000090.\n@c0@"
  it: "@aViola@bConserva tu la refurtiva, %a000090.\nLa restituiremo al legittimo proprietario quando lo troveremo.\n㈡\nNel caso non lo trovassimo, la terrò io.\n@c0@"
  ja: "@a@bデボラ「あの男……\n\tどこで盗んできたのかしら？\n\tとりあえず　%a000090が持っておくのよ。\n@c0@"
221:
  de: "@aGriselda@bHier lebt doch diese Kindheitsfreundin von dir, oder, %a000090?\n@c0@"
  en: "@aDebora@bThis is where that childhood friend of yours lives, isn't it, %a000090?\n@c0@"
  es: "@aStefania@bAquí es donde vive esa amiga tuya de la infanzia, ¿no, %a000090?\n@c0@"
  fr: "@aPandora@bC'est ici que vit ton amie d'enfance, n'est-ce pas %a000090ⓡ\n@c0@"
  it: "@aViola@bSe non sbaglio, qui è dove vive quella tua amica d'infanzia, %a000090...\n@c0@"
  ja: "@a@bデボラ「たしか　この村だったわね\n\t%a000090の幼なじみが　住んでいたのって。\n@c0@"
222:
  de: "@aGriselda@bWenn du möchtest, kannst du kurz bei ihr vorbeischauen. Ich bin auch nicht sauer, keine Bange.\n@c0@"
  en: "@aDebora@bYou can drop in on her briefly if you want.\nI won't be angry, don't worry.\n@c0@"
  es: "@aStefania@bSi quieres, puedes pasar a verla un ratito.\nNo me enfadaré, non ti preoccupare.\n@c0@"
  fr: "@aPandora@bTu peux aller lui rendre une petite visite rapide,\r\nsi tu veux. Je ne me mettrai pas en colère,\r\nne t'inquiète pas.\n@c0@"
  it: "@aViola@bSe vuoi passare a salutarla, vai pure. Ti concedo tre minuti e mezzo di libertà. Cerca di non farci l'abitudine, però: non sono sempre così generosa...\n@c0@"
  ja: "@a@bデボラ「少しくらいなら\n\t様子を　見に行ってきてもいいわよ。\n\t私は　別に　怒ったりしないから。\n@c0@"
223:
  de: "@aGriselda@bWo wir schon mal hier sind, kann ich ja eigentlich auch die Bäder testen. Ein wenig Entspannung schadet nie...\n@c0@"
  en: "@aDebora@bNow we've come all this way, I may as well try out the baths. It's good to relax from time to time.\n@c0@"
  es: "@aStefania@bYa que hemos venido hasta aquí, podría pasar a probar los bagni. Relajarse de vez en cuando va bene.\n@c0@"
  fr: "@aPandora@bPuisque nous avons fait tout ce chemin jusqu'ici, autant essayer les bains. C'est bon de se détendre de temps en temps.\n@c0@"
  it: "@aViola@bQuasi quasi provo le terme.\nUn bel bagno rilassante è proprio quello che mi ci vuole per rimettermi in sesto.\n㈡\nSai, impartire ordini continuamente è un'attività stancante...\n@c0@"
  ja: "@a@bデボラ「せっかくここまで来たんだし\n\t温泉に入っていくわよ。\n\t少しだけでも　息ぬきは　しないとね。\n@c0@"
224:
  de: "@aGriselda@bWirklich? Er hat den Schleier für mein Brautkleid angefertigt?\n@c0@"
  en: "@aDebora@bReally? He made the veil for my wedding dress?\n@c0@"
  es: "@aStefania@b¿Veramente? ¿Él hizo el velo del mio vestito de boda?\n@c0@"
  fr: "@aPandora@bVraimentⓡ C'est lui qui a fait le voile de ma robe\nde mariéeⓡ\n@c0@"
  it: "@aViola@bQuesto tizio ha realizzato il velo nuziale che ho indossato il giorno del nostro matrimonio...\n@c0@"
  ja: "@a@bデボラ「結婚式の時に　私がつけた\n\tヴェールは　ここのおじさんが\n\t作ったもの　ですって？\n@c0@"
225:
  de: "@aGriselda@bJa, jetzt erinnere ich mich, da war irgendwas.... Aber ich war ja auch sehr beschäftigt mit der Hochzeit und allem...\n@c0@"
  en: "@aDebora@bCome to think of it, I do remember being told something along those lines. I was too busy to think about it at the time.\n@c0@"
  es: "@aStefania@bAhora que pienso, ricordo que alguien me dijo algo al respecto. Ma estaba demasiado ocupada y no le presté atención.\n@c0@"
  fr: "@aPandora@bMaintenant que j'y pense, je me souviens qu'on m'a\r\ndit quelque chose à ce propos, effectivement. Mais j'étais trop occupée pour y réfléchir, sur le moment.\n@c0@"
  it: "@aViola@bEra un accessorio splendido, ma venne messo in ombra dalla sfolgorante bellezza della sposa... Ih ih ih!\n@c0@"
  ja: "@a@bデボラ「そういえば　そんなことを\n\t聞いたような　覚えがあるわね。\n\tこのところ　忙しすぎて　忘れていたわ。\n@c0@"
226:
  de: "@aGriselda@bKeine Sorge. Ich weiß, dass du es nicht gewesen bist, also brauchst du auch gar nicht so ängstlich zu gucken.\n@c0@"
  en: "@aDebora@bDon't worry. I know it wasn't your doing, so you don't have to look so panicky.\n@c0@"
  es: "@aStefania@bNon ti preoccupare. Ya sé que no fue cosa tuya, así que borra esa cara de espanto, ¿capisci?\n@c0@"
  fr: "@aPandora@bNe t'inquiète pas. Je sais que ça n'était pas toi. Inutile de prendre cet air paniqué.\n@c0@"
  it: "@aViola@bNon preoccuparti, so che non sei stato tu.\nNon ti perdo mai d'occhio, proprio per evitare che tu possa fare sciocchezze del genere...\n@c0@"
  ja: "@a@bデボラ「大丈夫よ。\n\t私は　あんたのしわざじゃないって\n\tちゃんと　わかっているから　安心なさい。\n@c0@"
227:
  de: "@aGriselda@bWenn man in dieser Herberge übernachtet, kann man in die Bäder gehen, so oft man will, richtig? Wir bleiben hier heute Nacht.\n@c0@"
  en: "@aDebora@bIf you stay at this inn, you can go in the baths whenever you want, can't you?\r\nWe'll stay here tonight.\n@c0@"
  es: "@aStefania@bLos que se alojan en esta posada pueden ir a los bagni siempre que quieran, ¿no?\nEsta notte nos quedamos aquí.\n@c0@"
  fr: "@aPandora@bSi on dort dans cette auberge, on peut profiter des bains à n'importe quel moment, c'est çaⓡ Nous allons rester ici cette nuit, alors.\n@c0@"
  it: "@aViola@bDalla locanda si può accedere direttamente alle terme.\nComodo, no? Ho deciso: stanotte dormiremo qui.\n@c0@"
  ja: "@a@bデボラ「この宿屋なら　好きな時に\n\t温泉に入れて　いいわね。\n\t今夜は　ここに泊まるわよ　%a000090。\n@c0@"
228:
  de: "@aGriselda@bSelbst wenn wir gewollt hätten, wäre das nicht möglich gewesen. Es ist ein wenig schwierig zu reisen, wenn man eine Steinstatue ist...\n@c0@"
  en: "@aDebora@bWe couldn't have come even if we'd wanted to.\r\nIt's a bit tricky to travel when you've been turned\r\nto stone.\n@c0@"
  es: "@aStefania@bAunque hubiésemos querido, no habríamos podido venir.\nViajar convertido en piedra es un po' difficile.\n@c0@"
  fr: "@aPandora@bMême si on l'avait voulu, on n'aurait pas pu venir ici. C'est un peu compliqué de voyager quand on est transformé en pierre.\n@c0@"
  it: "@aViola@bAvremmo potuto dirle che, essendo stati trasformati in statue, ci era difficile passare per un saluto, ma avrebbe pensato che la stavamo prendendo in giro...\n@c0@"
  ja: "@a@bデボラ「まあ　来たいと思っても\n\t来られなかったけどね。\n\t私たち　石になっていたから。\n@c0@"
229:
  de: "@aGriselda@bEs überrascht mich, in solch einem kleinen Dorf eine Schänke zu sehen. Ist wahrscheinlich für die Badegäste.\n@c0@"
  en: "@aDebora@bI'm a bit surprised to see a pub in such a small village. I suppose it's for the bath-goers.\n@c0@"
  es: "@aStefania@bSonno un poco sorprendida de ver una taberna en un pueblo tan piccolo. Será para los bañistas.\n@c0@"
  fr: "@aPandora@bJe suis un peu surprise de voir une taverne dans\r\nun si petit village. Ça doit être pour ceux qui vont\r\naux bains.\n@c0@"
  it: "@aViola@bNon credevo che un villaggio piccolo come questo avesse anche una taverna! Probabilmente, gli avventori sono tutti clienti delle terme...\n@c0@"
  ja: "@a@bデボラ「こんな小さな村にも\n\t酒場があるのね。　温泉客用かしら。\n@c0@"
230:
  de: "@aGriselda@bWenn die Welt weiter im Chaos versinkt, wird bald ein neuer dummer Kult den Platz des Ordens vom Zugzwang einnehmen...\n@c0@"
  en: "@aDebora@bIf the world stays in chaos for too long, then another silly cult might spring up in Zugzwang's place.\n@c0@"
  es: "@aStefania@bSi il mondo sigue sumido en el caos, otro culto idiota podría aparecer en lugar del de Zugzwang.\n@c0@"
  fr: "@aPandora@bSi le monde reste plongé dans le chaos trop\r\nlongtemps, un autre culte stupide pourrait bien naître pour remplacer celui du Zugzwang.\n@c0@"
  it: "@aViola@bSe la situazione di pericolo in cui si trova il mondo continuerà ancora a lungo, sbucherà fuori qualche altro culto sul genere della Setta di Zugzwang.\n㈡\nCi scommetterei la camicia!\nOvviamente una delle tue, caro. Non mi giocherei mai uno dei miei deliziosi capi firmati...\n@c0@"
  ja: "@a@bデボラ「ずっと　世界が　すさんだままだと\n\tまた　光の国の教団と同じような\n\tエセ教団が　出てくるかもしれないわね。\n@c0@"
231:
  de: "@aGriselda@bBlitzendes Badesalz ist eine berühmte regionale Spezialität, wenn ich mich recht erinnere.\n@c0@"
  en: "@aDebora@bScintillating sinter is a famous local speciality,\r\nif I remember rightly.\n@c0@"
  es: "@aStefania@bLas sales destellantes son una famosa especialità local, si mal no recuerdo.\n@c0@"
  fr: "@aPandora@bLes sels scintillants sont une spécialité locale réputée, si je me souviens bien.\n@c0@"
  it: "@aViola@bI sali da bagno scintillanti sono il prodotto tipico di Aprianuam.\n@c0@"
  ja: "@a@bデボラ「秘湯の花って　たしか\n\tこの村の　名産品だったはずよ。\n@c0@"
232:
  de: "@aGriselda@bEs klingt aber nicht so, als käme er von hier. Auf mich wirkt er ein wenig suspekt.\n@c0@"
  en: "@aDebora@bIt doesn't sound like he's from around here, though. He's a bit of a dodgy character, I'd say.\n@c0@"
  es: "@aStefania@bAunque no parece ser de por aquí. A mí me parece un personaggio sospechoso.\n@c0@"
  fr: "@aPandora@bIl n'a pourtant pas l'air d'être du coin. Il est un peu louche, comme type, je trouve.\n@c0@"
  it: "@aViola@bSono famosi in tutto il mondo per le loro proprietà rilassanti e tonificanti.\nAh, dimenticavo: sono anche estremamente rari...\n@c0@"
  ja: "@a@bデボラ「この村の　住人じゃないみたいだし\n\tどうも　うさんくさいわね　あの男。\n@c0@"
233:
  de: "@aGriselda@bDie Bäder duften ganz herrlich. Ob das wohl an dem Blitzenden Badesalz liegt?\n@c0@"
  en: "@aDebora@bThere is a lovely smell coming off the baths, actually. I wonder if that's the scintillating sinter.\n@c0@"
  es: "@aStefania@bDe los baños llega un olor veramente agradable. Me pregunto si será por las sales destellantes.\n@c0@"
  fr: "@aPandora@bLes bains dégagent un délicieux parfum.\r\nJe me demande si ça vient des sels scintillants.\n@c0@"
  it: "@aViola@bSenti come profumano i sali da bagno scintillanti!\nSono meravigliosi...\n@c0@"
  ja: "@a@bデボラ「そういえば　この村の温泉に近づくと\n\tふわっと　いい香りがしていたわね。\n\tこの秘湯の花と　同じにおいだったわ。\n@c0@"
234:
  de: "@aGriselda@bWarum steigt er denn dann nicht einfach aus dem Brunnen raus? Oder sitzt er fest? Ist er zu schwach, um allein rauszuklettern?\n@c0@"
  en: "@aDebora@bWhy doesn't he just get out of the well then?\r\nOr is he stuck? Too weak to climb out on his own?\n@c0@"
  es: "@aStefania@bMa entonces, ¿por qué no sale del pozo?\r\n¿Está atascado?\n¿Es demasiado débil para salir solo?\n@c0@"
  fr: "@aPandora@bPourquoi il ne sort pas de ce puits, alorsⓡ\nÀ moins qu'il soit coincéⓡ Trop faible pour\nressortir tout seul en grimpantⓡ\n@c0@"
  it: "@aViola@bCome mai non esce dal pozzo?\nAspetta che qualcuno lo tiri fuori con la forza?\n@c0@"
  ja: "@a@bデボラ「あんなことを　言うくらいなら\n\tさっさと　ここから　出ればいいのに。\n\tもしかして　自力で　外に出られないとか？\n@c0@"
235:
  de: "@aGriselda@bAber er kann wohl nicht gut um Hilfe bitten, wenn er sich hier heimlich das ganze Blitzende Badesalz unter den Nagel reißt.\n@c0@"
  en: "@aDebora@bI suppose he can't ask anyone for help if he is, though, what with being here picking scintillating sinter on the sly.\n@c0@"
  es: "@aStefania@bSembra que no puede pedir ayuda a nadieⓓ al fin y al cabo, ha venido a llevarse las sales destellantes a hurtadillas.\n@c0@"
  fr: "@aPandora@bSi c'est le cas, j'imagine qu'il ne peut demander de l'aide à personne, vu qu'il était en train de ramasser des sels scintillants en cachette.\n@c0@"
  it: "@aViola@bSecondo me è un delinquente e ha paura di essere scoperto. Altrimenti non si spiega come mai se ne sta qui senza chiedere aiuto a nessuno!\n@c0@"
  ja: "@a@bデボラ「だとしても　村の人に助けてもらう\n\tわけには　いかないわよね。\n\tナイショで　秘湯の花を取ってるんだし。\n@c0@"
236:
  de: "@aGriselda@bEr hat recht, das kommt reichlich spät. Und deshalb möchte ich nieⓚⓛ\n@c0@"
  en: "@aDebora@bHe's right about it being late.\nThis is why I alwaysⓚⓛ\n@c0@"
  es: "@aStefania@bTiene razón, es tarde.\nPor eso io sempre...\n@c0@"
  fr: "@aPandora@bIl a raison de dire qu'il est en retard. C'est pour ça que moi, j'arrive toujours...\n@c0@"
  it: "@aViola@bPrega di non farmi mai arrabbiare, %a000090.\nImpegnati con tutte le tue forze per accontentarmi sempre.\n@c0@"
  ja: "@a@bデボラ「たしかに　おそいわね。\n\tこんなことだから　いつまでも……。\n@c0@"
237:
  de: "@aGriselda@bAch egal, %a000090. Vergiss es. Tu einfach so, als hätte ich nichts gesagt.\n@c0@"
  en: "@aDebora@bNever mind, %a000090. Forget it.\nJust pretend I didn't say anything.\n@c0@"
  es: "@aStefania@bNon ti preoccupare, %a000090. Olvídalo.\nComo si no hubiese dicho niente.\n@c0@"
  fr: "@aPandora@bEuh, non, rien, %a000090.\nFais comme si je n'avais rien dit.\n@c0@"
  it: "@aViola@bSe pensi che a volte io sia un po' brusca e dispotica, ti garantisco che quando mi incavolo divento una vera belva. E non dire che non t'avevo avvertito!\n@c0@"
  ja: "@a@bデボラ「ううん　別に…　何でもないわ。\n\t%a000090は　気にしなくていいから。\n@c0@"
238:
  de: "@aGriselda@bBist du froh, dass du deine alte Freundin wiedersehen kannst, %a000090?\n@c0@"
  en: "@aDebora@bSo, are you happy to meet up with your old friend again, %a000090?\n@c0@"
  es: "@aStefania@bBueno, ¿estás felice de volver a ver a tu amica, %a000090?\n@c0@"
  fr: "@aPandora@bAlors, tu es heureux de revoir ta vieille amie, %a000090ⓡ\n@c0@"
  it: "@aViola@bAllora, %a000090, sei felice di rivedere la tua vecchia amica?\n@c0@"
  ja: "@a@bデボラ「%a000090。\n\tあんたも　幼なじみに会えて\n\tうれしいんじゃないの？\n@c0@"
239:
  de: "@aGriselda@bVerstehe... Tja, das ist schön. Und es ist auch schön, dass es ihr gut zu gehen scheint.\n@c0@"
  en: "@aDebora@bI see... Well, that's good. And it's good that she\r\nseems well.\n@c0@"
  es: "@aStefania@bYa veo... Va bene. Y también va bene que ella parezca estar bene.\n@c0@"
  fr: "@aPandora@bJe vois... C'est une bonne chose, en effet. Et c'est aussi une bonne chose qu'elle ait l'air d'aller bien.\n@c0@"
  it: "@aViola@bUhm... Non so se essere contenta per la tua sincerità o arrabbiarmi come una iena perché sei contento di incontrare un'altra donna...\n@c0@"
  ja: "@a@bデボラ「そう……。\n\tよかったわね　%a000090。\n\tビアンカ　元気そうじゃないの。\n@c0@"
240:
  de: "@aGriselda@bSag mir doch einfach die Wahrheit! Ich bin auch nicht wütend. Ich sehe doch, wie froh du bist, das kannst du nicht leugnen.\n@c0@"
  en: "@aDebora@bJust tell me the truth! I won't be angry. I can see you're happy, it's written all over your face.\n@c0@"
  es: "@aStefania@b¡Dime la verità! No me enfadaré. Ya veo que estás contento, se te nota en la cara.\n@c0@"
  fr: "@aPandora@bDis-moi plutôt la véritéⓠ Je ne vais pas me mettre en colère. Je le vois bien, que tu es content. Ça se lit sur ton visage.\n@c0@"
  it: "@aViola@bRazza di bugiardo...\n@c0@"
  ja: "@a@bデボラ「もう　すなおじゃないわね。\n\tうれしい　って　顔に書いてあるのに。\n\t私は　怒ったりしないから　安心なさい。\n@c0@"
241:
  de: "@aGriselda@bBiancas Vater scheint wohl ziemlich erschöpft zu sein.\n@c0@"
  en: "@aDebora@bBianca's father seems to have let his exhaustion get the better of him.\n@c0@"
  es: "@aStefania@bParece que il papino de Bianca está veramente agotado.\n@c0@"
  fr: "@aPandora@bOn dirait que le père de Bianca est totalement épuisé.\n@c0@"
  it: "@aViola@bIl padre di Bianca mi ha dato l'impressione di essere un uomo molto provato.\n@c0@"
  ja: "@a@bデボラ「ビアンカのパパ……\n\tかなり　つかれが\n\tたまっている　みたいだわ。\n@c0@"
242:
  de: "@aGriselda@bWahrscheinlich macht er sich Sorgen um sie. Das kann ich verstehen.\n@c0@"
  en: "@aDebora@bI suppose he's worried about her.\nI can understand that.\n@c0@"
  es: "@aStefania@bSupongo que está preocupado per ella.\nEs comprensibile.\n@c0@"
  fr: "@aPandora@bJe suppose qu'il s'inquiète pour elle.\r\nJe peux le comprendre.\n@c0@"
  it: "@aViola@bLo capisco, sai?\nCon una figlia come la sua, quel poveretto avrà preoccupazioni a non finire...\n@c0@"
  ja: "@a@bデボラ「やっぱり　娘のことが\n\t心配なのかしらね。　もちろん　私にも\n\tその気もちは　わかるわ。\n@c0@"
243:
  de: "@aGriselda@bBiancas Vater scheint wohl ziemlich erschöpft zu sein.\n@c0@"
  en: "@aDebora@bBianca's father seems to have let his exhaustion get the better of him.\n@c0@"
  es: "@aStefania@bParece que il papino de Bianca está veramente agotado.\n@c0@"
  fr: "@aPandora@bOn dirait que le père de Bianca est totalement épuisé.\n@c0@"
  it: "@aViola@bIl padre di Bianca mi ha dato l'impressione di essere un uomo molto provato.\n@c0@"
  ja: "@a@bデボラ「ビアンカのパパ……\n\tかなり　つかれが\n\tたまっている　みたいだわ。\n@c0@"
244:
  de: "@aGriselda@bWahrscheinlich macht er sich Sorgen um sie. Das kann ich verstehen.\n@c0@"
  en: "@aDebora@bI suppose he's worried about her.\nI can understand that.\n@c0@"
  es: "@aStefania@bSupongo que está preocupado per ella.\nEs comprensibile.\n@c0@"
  fr: "@aPandora@bJe suppose qu'il s'inquiète pour elle.\r\nJe peux le comprendre.\n@c0@"
  it: "@aViola@bLo capisco, sai?\nCon una figlia come la sua, quel poveretto avrà preoccupazioni a non finire...\n@c0@"
  ja: "@a@bデボラ「やっぱり　娘のことが\n\t心配なのかしらね。　もちろん　私にも\n\tその気もちは　わかるわ。\n@c0@"
245:
  de: "@aGriselda@bBianca hat sich kein bisschen verändert.\n@c0@"
  en: "@aDebora@bBianca hasn't changed a bit.\n@c0@"
  es: "@aStefania@bBianca no ha cambiado niente.\n@c0@"
  fr: "@aPandora@bBianca n'a pas changé d'un pouce.\n@c0@"
  it: "@aViola@bBianca non è invecchiata affatto.\n...\nVuoi sapere se sono invidiosa della sua avvenenza?\n@c0@"
  ja: "@a@bデボラ「ビアンカ……　昔と　ちっとも\n\t変わっていないわね。\n@c0@"
246:
  de: "@aGriselda@bIch frage mich, ob es von den vielen Bädern kommt, dass sie immer noch so jung aussieht.\n@c0@"
  en: "@aDebora@bI wonder if it's the baths that have kept her looking so young.\n@c0@"
  es: "@aStefania@b¿Serán los bagni los que la han mantenido así de joven tanto tiempo?\n@c0@"
  fr: "@aPandora@bJe me demande si ce sont les bains qui lui ont permis de garder cet air juvénile.\n@c0@"
  it: "@aViola@bCertochesìcomepotreinoninvidiareunadonnacosìbella.\n㈡\nCome dici?\nNon hai capito quello che ho detto?\nMi spiace, l'ho dimenticato. Non posso ripeterlo.\n@c0@"
  ja: "@a@bデボラ「もしかして　あの温泉に\n\tそういう　効きめが　あるのかしら……？\n@c0@"
247:
  de: "@aGriselda@bDu hast dich wieder verletzt, oder?\n@c0@"
  en: "@aDebora@bYou've got more wounds, haven't you?\n@c0@"
  es: "@aStefania@bTienes más heridas, ¿vero?\n@c0@"
  fr: "@aPandora@bTu as plus de cicatrices qu'avant, heinⓡ\n@c0@"
  it: "@aViola@bSei stato ferito molte volte in battaglia, caro?\n@c0@"
  ja: "@a@bデボラ「あんた　生キズが\n\t増えているわね。\n@c0@"
248:
  de: "@aGriselda@bWie stehe ich denn da, wenn du der einzige Verwundete bist, hm? Willst du, dass die Leute glauben, ich würde dich schlagen?\n@c0@"
  en: "@aDebora@bIt doesn't look good for me if you're the only one injured, you know. Do you want people to think I'm bullying you?\n@c0@"
  es: "@aStefania@bNo queda bene que el único herido seas tú, ¿capisci? La gente va a pensar que te maltrato.\n@c0@"
  fr: "@aPandora@bÇa n'est pas bon pour mon image que tu sois le seul\nà être blessé, tu sais. Tu veux vraiment que les gens croient que je te maltraiteⓡ\n@c0@"
  it: "@aViola@bDevi fare attenzione. Non voglio che la gente pensi che ti mando allo sbaraglio per evitare di correre la mia parte di pericoli.\n㈡\nVuoi che gli altri pensino che sono una vigliacca, maritino mio?\n@c0@"
  ja: "@a@bデボラ「あんたばっかり　キズだらけだと\n\t私が　いじめてるみたいじゃない。\n@c0@"
249:
  de: "@aGriselda@bHm? Was war das? Ich kann dich nicht hören.\n@c0@"
  en: "@aDebora@bHm? What was that?\nI couldn't quite hear you.\n@c0@"
  es: "@aStefania@b¿Mmm? ¿Cosa dices?\nNo te he oído bene.\n@c0@"
  fr: "@aPandora@bMmmⓡ Pardonⓡ\nJe crois que je t'ai mal entendu.\n@c0@"
  it: "@aViola@bChe hai detto?!\nVuoi un cazzotto sul muso, %a000090?!\n@c0@"
  ja: "@a@bデボラ「は？　なにそれ。\n\t聞こえなかったけど。\n@c0@"
250:
  de: "@aGriselda@bHmm, manchmal bist du wirklich ein Tollpatsch.\n@c0@"
  en: "@aDebora@bHmm, you really are incredibly clumsy.\n@c0@"
  es: "@aStefania@bUff, eres veramente torpe.\n@c0@"
  fr: "@aPandora@bMmm, tu es vraiment d'une maladresse incroyable.\n@c0@"
  it: "@aViola@bRisposta esatta, %a000090.\nAllora ascoltami bene...\n@c0@"
  ja: "@a@bデボラ「そうよね。\n\t%a000090が　とてつもなく\n\tドンくさいのよね。\n@c0@"
251:
  de: "@aGriselda@bDu solltest in Zukunft ein wenig vorsichtiger sein beim Kämpfen...\n@c0@"
  en: "@aDebora@bYou'll have to be a bit more careful when you fight\r\nin future.\n@c0@"
  es: "@aStefania@bDebes poner más attenzione cuando luches en el futuro.\n@c0@"
  fr: "@aPandora@bIl faudra que tu fasses un peu plus attention quand tu te battras, à l'avenir.\n@c0@"
  it: "@aViola@bDa questo momento in avanti, ti proibisco di farti ferire in battaglia. Se non eseguirai questo mio ordine, ti spezzerò personalmente le gambe. Chiaro?\n@c0@"
  ja: "@a@bデボラ「いいかげん　戦闘なれしなさいよ。\n\tわかったわね。\n@c0@"
252:
  de: "@aGriselda@bWo wir schon mal hier sind, können wir auch über Nacht bleiben. Ich nehme noch ein Bad vor dem Schlafengehen.\n@c0@"
  en: "@aDebora@bWe may as well stay the night now we're here.\nI think I'll have a bath before bed.\n@c0@"
  es: "@aStefania@bYa que estamos aquí, podríamos quedarnos a pasar la notte.\nCredo que tomaré un bagno antes de acostarme.\n@c0@"
  fr: "@aPandora@bMaintenant que nous sommes ici, autant y passer\r\nla nuit. Je crois que je vais prendre un bain avant d'aller me coucher.\n@c0@"
  it: "@aViola@bFermiamoci qui, caro.\nVoglio concedermi un bel bagno caldo e un lungo sonno ristoratore...\n@c0@"
  ja: "@a@bデボラ「せっかく来たんだし\n\t今夜は　ここに泊まるわよ。\n\t私　寝る前に　温泉に入りたいわ。\n@c0@"
253:
  de: "@aGriselda@bDie Sterne sind wunderschön, nicht? Fast so schön wie ich.\n@c0@"
  en: "@aDebora@bThe stars are beautiful, aren't they?\nAlmost as beautiful as me.\n@c0@"
  es: "@aStefania@bLas estrellas están preciosas, ¿vero?\n¡Casi tanto come io!\n@c0@"
  fr: "@aPandora@bLes étoiles sont magnifiques, n'est-ce pasⓡ\nPresque autant que moi.\n@c0@"
  it: "@aViola@bLe stelle sono bellissime...\nMa io sono più bella di tutte le stelle del firmamento messe insieme!\n@c0@"
  ja: "@a@bデボラ「星が　キレイね。\n\t私の　次にね。\n@c0@"
254:
  de: "@aGriselda@bAlso konnte dieser vermaledeite Kult seinen Einfluss bis hierhin ausweiten.\n@c0@"
  en: "@aDebora@bSo that no-good cult even managed to extend its influence here.\n@c0@"
  es: "@aStefania@bAsí que la influencia de ese culto maledetto ha llegado hasta aquí.\n@c0@"
  fr: "@aPandora@bAlors ce culte maléfique a même réussi à étendre\r\nson emprise jusqu'ici.\n@c0@"
  it: "@aViola@bDannazione!\nQuei delinquenti di Zugzwang sono riusciti a estendere la loro influenza fin qui...\n@c0@"
  ja: "@a@bデボラ「あのエセ教団は　こんな山奥まで\n\t手をのばしていたのね。\n@c0@"
255:
  de: "@aGriselda@bDann bleibt uns wohl keine Zeit für Entspannung. Wir müssen weiter nach Nadiria.\n@c0@"
  en: "@aDebora@bLooks like we don't have time to relax here.\r\nWe need to hurry to Nadiria.\n@c0@"
  es: "@aStefania@bSembra que no podremos descansar aquí.\nHabrá que darse prisa en ir a Nadiria.\n@c0@"
  fr: "@aPandora@bOn dirait que nous n'allons pas avoir le temps de\r\nnous détendre ici. Nous devons nous dépêcher\r\nd'aller à Nadiria.\n@c0@"
  it: "@aViola@bNon c'è tempo da perdere, maritino mio...\nDobbiamo correre a Nadiria!\n@c0@"
  ja: "@a@bデボラ「あまり　のんびりも\n\tしていられないわね。\n\t急いで　魔界へ　行かなければ。\n@c0@"
256:
  de: "@aGriselda@bWirklich? Er hat den Schleier für mein Brautkleid angefertigt?\n@c0@"
  en: "@aDebora@bReally? He made the veil for my wedding dress?\n@c0@"
  es: "@aStefania@b¿Veramente? ¿Él hizo el velo del mio vestito de boda?\n@c0@"
  fr: "@aPandora@bVraimentⓡ C'est lui qui a fait le voile de ma robe\nde mariéeⓡ\n@c0@"
  it: "@aViola@bQuesto tizio ha realizzato il velo nuziale che ho indossato il giorno del nostro matrimonio...\n@c0@"
  ja: "@a@bデボラ「結婚式の時に　私がつけた\n\tヴェールは　ここのおじさんが\n\t作ったもの　ですって？\n@c0@"
257:
  de: "@aGriselda@bJa, jetzt erinnere ich mich, da war irgendwas.... Aber ich war ja auch sehr beschäftigt mit der Hochzeit und allem...\n@c0@"
  en: "@aDebora@bCome to think of it, I do remember being told something along those lines. I was too busy to think about it at the time.\n@c0@"
  es: "@aStefania@bAhora que pienso, ricordo que alguien me dijo algo al respecto. Ma estaba demasiado ocupada y no le presté atención.\n@c0@"
  fr: "@aPandora@bMaintenant que j'y pense, je me souviens qu'on m'a\ndit quelque chose à ce propos, effectivement. Mais j'étais trop occupée pour y réfléchir, sur le moment.\n@c0@"
  it: "@aViola@bEra un accessorio splendido, ma venne messo in ombra dalla sfolgorante bellezza della sposa... Ih ih ih!\n@c0@"
  ja: "@a@bデボラ「そういえば　そんなことを\n\t聞いたような　覚えがあるわね。\n\tこのところ　忙しすぎて　忘れていたわ。\n@c0@"
258:
  de: "@aGriselda@bEr schläft tief und fest. Wenn wir ihn wecken, wird er bestimmt nicht begeistert sein... Los, lass uns gehen.\n@c0@"
  en: "@aDebora@bHe's fast asleep. We won't be very popular if we wake him, so let's get out of here.\n@c0@"
  es: "@aStefania@bEstá dormido come un tronco. Si le despertamos sicuro que nos miran con mala cara, así que vámonos de aquí.\n@c0@"
  fr: "@aPandora@bIl dort à poings fermés. On risque de se faire mal voir si on le réveille, sortons d'ici.\n@c0@"
  it: "@aViola@bDev'essere stanco morto...\nAvrei voglia di fargli il solletico, ma temo che non apprezzerebbe affatto...\n@c0@"
  ja: "@a@bデボラ「このおじさん　ぐっすり　眠ってるわ。\n\t起こしたら　めんどうなことになりそうだし\n\t早く　行くわよ。\n@c0@"
259:
  de: "@aGriselda@bDu weckst sie noch auf, wenn du zu nah rangehst! Komm jetzt!\n@c0@"
  en: "@aDebora@bYou'll wake her up if you get too close!\nCome away!\n@c0@"
  es: "@aStefania@b¡Si te acercas troppo la despertarás!\n¡Andiamo!\n@c0@"
  fr: "@aPandora@bTu vas la réveiller si tu t'approches tropⓠ\nÉcarte-toiⓠ\n@c0@"
  it: "@aViola@bNon voglio che parli con altre donne mentre dormono! E nemmeno quando sono sveglie!\nAllontanati subito da lei!\n@c0@"
  ja: "@a@bデボラ「そんなに　近付いたら\n\t起こしてしまうでしょう？\n\tさっさと　そこから　はなれなさい。\n@c0@"
260:
  de: "@aGriselda@bIch frage mich, wie lange der Kerl noch warten will. Er sollte den Stier bei den Hörnern packen, jawohl!\n@c0@"
  en: "@aDebora@bI wonder how long this man will carry on messing about. He needs to take the bull by the horns!\n@c0@"
  es: "@aStefania@bMe pregunto hasta cuando estará este uomo mareando la perdiz. ¡Tiene que coger el toro por los cuernos!\n@c0@"
  fr: "@aPandora@bJe me demande combien de temps cet homme va continuer à tourner autour du pot. Il faut qu'il prenne le taureau par les cornesⓠ\n@c0@"
  it: "@aViola@bScommetto che sta sognando qualcosa di molto interessante...\n@c0@"
  ja: "@a@bデボラ「この男　いつまで\n\tグズグズしているのかしら……。\n\tさっさと　行動に　出ればいいのに。\n@c0@"
261:
  de: "@aGriselda@bWie interessant. Wahrscheinlich kannst du die Leute gut verstehen, die solche Gefühle für Bianca hegen, was, %a000090?\n@c0@"
  en: "@aDebora@bHow interesting. You probably sympathise with people who have those kind of feelings towards Bianca, don't you, %a000090?\n@c0@"
  es: "@aStefania@bInteresante. Supongo que te llevas bene con las personas que tienen estos sentimientos per Bianca, ¿no, %a000090?\n@c0@"
  fr: "@aPandora@bC'est très intéressant. Tu dois sûrement compatir avec les gens qui ont ce genre de sentiments pour Bianca, n'est-ce pas, %a000090ⓡ\n@c0@"
  it: "@aViola@bToh!\nPare che abbiamo un altro spasimante di Bianca...\n㈡\nOvvero, un altro sempliciotto che preferisce la sua scialba graziosità alla mia sfolgorante bellezza...\n@c0@"
  ja: "@a@bデボラ「おもしろそう。\n\tビアンカへの気もちが　どの程度か\n\tわかるじゃない。\n@c0@"
262:
  de: "@aGriselda@b...\n@c0@"
  en: "@aDebora@b............\n@c0@"
  es: "@aStefania@b...\n@c0@"
  fr: "@aPandora@b............\n@c0@"
  it: "@aViola@b...\n@c0@"
  ja: "@a@bデボラ「……。\n@c0@"
263:
  de: "@a@bGriselda versucht, ein Lachen zu unterdrücken. Mit Erfolg!\n@c0@"
  en: "@a@bDebora is trying to stifle a laugh.\nIt seems to have worked!\n@c0@"
  es: "@a@bStefania está intentando contener la risa.\n¡Parece que lo ha conseguido!\n@c0@"
  fr: "@a@bPandora essaie d'étouffer un éclat de rire.\nÇa a marché, on diraitⓠ\n@c0@"
  it: "@a@bViola trattiene a stento una risata...\n@c0@"
  ja: "@a@bデボラは　笑いを　こらえている！\nどうやら　ツボに　ハマったようだ……。\n@c0@"
264:
  de: "@aGriselda@bWenn er hier sitzt und trinkt und seine Frau zu Hause auf ihn wartet, hat er die Hosen an. Nicht wie du...\n@c0@"
  en: "@aDebora@bHe must be the dominant one if he's here drinking while his wife's waiting at home. Not like you.\n@c0@"
  es: "@aStefania@bSi él está aquí bebiendo mientras la sua sposa le espera en casa, debe de ser un tipo dominante. No como tú.\n@c0@"
  fr: "@aPandora@bÇa doit être lui le dominant, s'il est ici en train de boire pendant que sa femme l'attend à la maison.\r\nPas comme toi.\n@c0@"
  it: "@aViola@bUn'altra coppia felice, nella quale le redini del rapporto sono tenute con mano esperta e pesante dalla donna, vera spina dorsale del nucleo familiare!\n@c0@"
  ja: "@a@bデボラ「奥さんを　家で待たせておいて\n\tこんな所で　酔っぱらっているだなんて\n\t本当に　いいご身分だこと。\n@c0@"
265:
  de: "@aGriselda@bIch würde schon nicht ausrasten, wenn du mal einen über den Durst trinken würdest. Ich würde dir lediglich verbieten, je wieder etwas zu trinken!\n@c0@"
  en: "@aDebora@bI wouldn't get angry like that if you ever had too much to drink. I'd just forbid you from ever\r\ndrinking again!\n@c0@"
  es: "@aStefania@bSi un día tú bebieses troppo, yo no me enfadaría. Ma la gente que bebe, a veces tiene accidentes, ¿capisci?\n@c0@"
  fr: "@aPandora@bJe ne me mettrais jamais dans une telle colère si ça t'arrivait de trop boire, un jour. Je me contenterais de t'interdire définitivement de boireⓠ\n@c0@"
  it: "@aViola@bCaro, non prendere esempio dai cattivi mariti.\nLe persone come lui sono solo sciocchi che non conosceranno mai le gioie della vita di coppia...\n@c0@"
  ja: "@a@bデボラ「%a000090が　こんなふうに\n\t飲み過ぎても　怒ったりはしないわ。\n\t２度と飲むな！　って　命令するだけよ。\n@c0@"
266:
  de: "@aGriselda@bAber das wird wohl nicht nötig sein, oder?\n@c0@"
  en: "@aDebora@bI doubt I'll ever need to, though.\n@c0@"
  es: "@aStefania@bMa credo que no hacía falta decírtelo.\n@c0@"
  fr: "@aPandora@bMais ça m'étonnerait ça arrive.\n@c0@"
  it: "@aViola@bIl segreto per un matrimonio felice è incredibilmente semplice: IO comando, e TU ubbidisci.\nTutto qui.\n@c0@"
  ja: "@a@bデボラ「まあ　あんたには\n\tそんなこと　する必要はないと思うけど。\n@c0@"
267:
  de: "@aOtto@bMmm, dieses Dorf gefällt mir! Hier liegt so ein besonderer Duft in der Luft ⓚⓛ ich kann förmlich riechen, dass es hier hübsche Mädchen gibt!\n@c0@"
  en: "@aTuppence@bMmm, this village is definitely to my liking. I can almost smell the beautiful girls in the air!\n@c0@"
  es: "@aAlazar@bMmm, definitivamente, esta aldea es de mi gusto. ¡Tiene toda la pinta de que va a haber chicas guapas!\n@c0@"
  fr: "@aInnocent@bMmm, ce village me plaît, c'est certain.\nJe peux presque sentir dans l'air la présence\ndes jolies fillesⓠ\n@c0@"
  it: "@aSimon@bBagni termali?! Cioè quei posti dove si incontrano tante belle fanciulle poco vestite, pronte a immergersi in acqua?!\n㈡\nMaestà, non è che potrebbe nominarmi Ambasciatore di Denim per questo villaggio?!\n@c0@"
  ja: "@a@bピピン「ん～　ここは　いい村ですね……。\n\tすごい美人の　ニオイがします！\n@c0@"
268:
  de: "@aGriselda@bMöchtest du damit etwa andeuten, dass es hier Mädchen gibt, die hübscher sind als ich, Otto?\n@c0@"
  en: "@aDebora@bAre you implying that there are girls here more beautiful than my good self, Tuppence?\n@c0@"
  es: "@aStefania@b¿Acaso quieres decir que aquí habrá mujeres più belle que io, Alazar?\n@c0@"
  fr: "@aPandora@bInsinuerais-tu qu'il y a ici des filles plus belles que moi, Innocentⓡ\n@c0@"
  it: "@aViola@bPerché dovresti guardare delle belle fanciulle alle terme quando viaggi con me, Simon?\nForse non mi reputi sufficientemente bella?\n@c0@"
  ja: "@a@bデボラ「ねえ　ピピン。\n\tそれは　私以上の美人が\n\tこの村には　いるって言いたいの？\n@c0@"
269:
  de: "@aOtto@bIch, äh, nein! Natürlich net! Ihr seid die Schönste von allen, ganz ohne Zweifel!\n@c0@"
  en: "@aTuppence@bEr, I, er, no! Absolutely not!\nYou're the fairest of them all, without a doubt!\n@c0@"
  es: "@aAlazar@bMmm, yo... ¡No! ¡Claro que no!\n¡Vos sois la más hermosa de todas, no hay duda!\n@c0@"
  fr: "@aInnocent@bEuh, je... euh, nonⓠ Absolument pasⓠ Vous êtes\nla plus belle de toutes, sans aucun douteⓠ\n@c0@"
  it: "@aSimon@bTutt'altro, regina Viola! Lei è meravigliosa!\nMa è pure sposata. Con il mio Sire, per giunta!\nMe lo spiega che la guardo a fare, eh?!\n@c0@"
  ja: "@a@bピピン「い　いえ！\n\tデボラ様以上に　美しいお方は\n\tこの世には　おりませんですっ！！\n@c0@"
270:
  de: "@aOtto@bDas Gefühl kenn' ich! Oh, das Gefühl kenn' ich nur allzu gut!\n@c0@"
  en: "@aTuppence@bI know that feeling! Oh, I know that feeling so well.\n@c0@"
  es: "@aAlazar@b¡Conozco esa sensación! ¡Ya lo creo que la conozco!\n@c0@"
  fr: "@aInnocent@bJe connais ce sentimentⓠ Oh que ouiⓠ\n@c0@"
  it: "@aSimon@bBeh, lavorare in una locanda ha i suoi vantaggi...\n@c0@"
  ja: "@a@bピピン「わかる！　わかるぞ！\n\tあいつの気持ち……。\n@c0@"
271:
  de: "@aOtto@bAber ich muss g'steh'n, dass ich ein wenig neidisch bin. So schlimm kann eine Ausbildung doch net sein, mit einer hübschen Dame in der Nähe.\n@c0@"
  en: "@aTuppence@bBut I must admit I'm rather envious. It can't be such a hardship doing your training with a beautiful lady close by.\n@c0@"
  es: "@aAlazar@bDebo admitir que siento un poco de envidia. No puede ser tan duro ser aprendiz con una bella dama tan cerca.\n@c0@"
  fr: "@aInnocent@bMais je dois admettre que je l'envie un peu. Ça ne doit pas être si dur que ça de suivre une formation avec une belle femme dans les parages.\n@c0@"
  it: "@aSimon@bPer esempio, si conoscono tante belle fanciulle in viaggio di lavoro o di piacere!\n@c0@"
  ja: "@a@bピピン「でも　あんな美人のいる家で\n\t修行できるとは……\n\tうっ　うらやましいっ！\n@c0@"
272:
  de: "@aGriselda@bWas, du bist neidisch, Otto? Bin ich etwa nicht mehr schön genug für dich?!\n@c0@"
  en: "@aDebora@bEnvious, are you, Tuppence?\nAm I no longer beautiful enough for you?\n@c0@"
  es: "@aStefania@bTienes envidia, ¿eh. Alazar?\n¿Ya no soy lo bastante bella per te?\n@c0@"
  fr: "@aPandora@bAlors comme ça, tu l'envies, Innocentⓡ Je ne suis donc plus assez belle pour toiⓡ\n@c0@"
  it: "@aViola@bCos'hai detto, Simon?\nTi spiacerebbe ripetere?\n@c0@"
  ja: "@a@bデボラ「あら　ピピン。\n\t私の供をするのは　不満ってわけ？\n@c0@"
273:
  de: "@aOtto@bIch, äh, ich... Aber natürlich seid Ihr das! Ich bin sehr glücklich, Euch begleiten zu dürfen!\n@c0@"
  en: "@aTuppence@bI, er, I mean... Of course you are! I'm thrilled to be accompanying you.\n@c0@"
  es: "@aAlazar@bBueno, en realidad yo... ¡Claro que lo sois! Estoy encantado de acompañaros.\n@c0@"
  fr: "@aInnocent@bJe, euh... je veux dire. Bien sûr que siⓠ Je suis positivement enchanté de vous accompagner.\n@c0@"
  it: "@aSimon@bMa certo, regina Viola. Pensavo che, quando mi congederò dall'esercito, potrei aprire una locanda, perché è un genere di attività che mi attrae molto...\n@c0@"
  ja: "@a@bピピン「い　いえ　そんなっ。\n\tデボラ様のような方の　お供ができて\n\tボクは　幸せものだなあっ！！\n@c0@"
