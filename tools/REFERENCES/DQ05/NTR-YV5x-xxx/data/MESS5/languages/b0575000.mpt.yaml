0:
  de: "@aNera@bDie Bäder hier sind wirklich herrlich. Ein schönes entspannendes Bad wäre jetzt wunderbar, aber dafür reicht die Zeit nicht.\n@c0@"
  en: "@aNera@bI really love the baths here. I wish I could have\r\na nice, relaxing soak now, but there's just not\r\nenough time.\n@c0@"
  es: "@aNera@bMe encantan los baños que hay aquí. Ojalá pudiera darme un bañito relajante, ma no hay suficiente tempo.\n@c0@"
  fr: "@aNera@bJ'adore les bains d'ici. Si seulement je pouvais m'y plonger un peu pour me détendre... Mais je sais que nous n'avons pas le temps pour ça.\n@c0@"
  it: "@aNera@bAdoro le terme, %a000090!\nMi piacerebbe tanto fermarmi un po' per fare un bel bagno, ma mi rendo conto che non abbiamo tempo...\n@c0@"
  ja: "@a@bフローラ「私　ここの温泉　大好きなの。\n\tゆっくり　入りたいところだけど……\n\tまた　今度にしましょう。\n@c0@"
1:
  de: "@a%0%a001240@bDiese Bäder sind eigentlich nix anderes als Teiche mit heißem Wasser. Siehst du, ich kenn' mich aus!\n@c0@"
  en: "@a%0%a001240@bThese baths are basically just lakes full of hot water. I know my stuff, see!\n@c0@"
  es: "@a%0%a001240@bEsos baños son simples lagos llenos de agua caliente. ¡Que lo sé yo!\n@c0@"
  fr: "@a%0%a001240@bEn fait, ces bains sont simplement de petits lacs d'eau chaude. Tu vois, j'ai bien appris ma leçonⓠ\n@c0@"
  it: "@a%0%a001240@bI bagni termali non sono altro che laghetti pieni d'acqua calda, no?\nCos'hanno di tanto speciale?\n@c0@"
  ja: "@a@b%a001240「温泉って　お湯でできてる\n\t池のことだよね？\n\tボク　知ってるんだ！\n@c0@"
2:
  de: "@a%0%a001250@bUtensiel. Was für ein niedlicher Name für so ein niedliches kleines Dorf!\n@c0@"
  en: "@a%0%a001250@bStockenbarrel. What a sweet little name for a sweet little village.\n@c0@"
  es: "@a%0%a001250@bClavis. Un nombre muy lindo para una linda aldea.\n@c0@"
  fr: "@a%0%a001250@bSaint Éloi. Quel joli nom pour un joli petit village.\n@c0@"
  it: "@a%0%a001250@bAprianuam è proprio un nome grazioso!\nChissà chi avrà avuto l'idea di chiamare così questo villaggio...\n@c0@"
  ja: "@a@b%a001250「村に名前がないと\n\tこまるよね？　…こまらないの？\n@c0@"
3:
  de: "@aBianca@bIch kann ihm ja schlecht sagen, dass ich mich nicht habe blicken lassen, weil ich ein paar Jahre als Statue in der Gegend rumgestanden hab, oder?\n@c0@"
  en: "@aBianca@bI can hardly tell him I en't bin by because I spent all them years as a statue, eh?\n@c0@"
  es: "@aBianca@bMe resulta difícil decirle que no me ha visto porque me he pasado estos años en forma de estatua, ¿sabes?\n@c0@"
  fr: "@aBianca@bDifficile de lui expliquer que je ne suis pas venue ici parce que j'ai passé plusieurs années transformée en statue, heinⓡ\n@c0@"
  it: "@aBianca@bNon potevo mica dirgli che non mi ero fatta vedere da queste parti perché ero stata trasformata in una statua, eh?!\n@c0@"
  ja: "@a@bビアンカ「いくらなんでも\n\t石になってたなんて\n\t本当のことは　言えないわ……。\n@c0@"
4:
  de: "@aBianca@bEin richtig gutes Bad heilt nicht nur den Körper, sondern erfrischt auch die Seele.\n@c0@"
  en: "@aBianca@bThe really good baths dun't just heal your body. They heal your mind too.\n@c0@"
  es: "@aBianca@bLos baños buenos de verdad no solo son buenos para el cuerpo. También lo son para la mente, ¿me entiendes?\n@c0@"
  fr: "@aBianca@bLes bains vraiment efficaces sont ceux qui ne soignent pas seulement le corps, mais aussi\r\nl'esprit.\n@c0@"
  it: "@aBianca@bI bagni termali non servono solo per curare il corpo, ma anche per rilassare lo spirito.\n@c0@"
  ja: "@a@bビアンカ「本当に　いい温泉はね\n\t病気を　治すだけじゃなくて\n\t心も　おだやかにしてくれるのよ。\n@c0@"
5:
  de: "@aBianca@bAber im Moment ist dazu keine Zeit.\n@c0@"
  en: "@aBianca@bNot that we've got time for either at the minute, mind.\n@c0@"
  es: "@aBianca@bAunque no tenemos tiempo para nada de eso, ya sabes.\n@c0@"
  fr: "@aBianca@bMais pour l'instant, nous n'avons de temps\r\nni pour l'un ni pour l'autre, de toute façon.\n@c0@"
  it: "@aBianca@bPeccato che non abbiamo tempo per immergerci in acqua...\n@c0@"
  ja: "@a@bビアンカ「もちろん　今は　温泉で\n\tなごんでる場合じゃないけどね。\n@c0@"
6:
  de: "@a%0%a001240@bDiese Bäder sind eigentlich nix anderes als Teiche mit heißem Wasser. Siehst du, ich kenn' mich aus!\n@c0@"
  en: "@a%0%a001240@bThese baths are basically just lakes full of hot water. I know my stuff, see!\n@c0@"
  es: "@a%0%a001240@bEsos baños son simples lagos llenos de agua caliente. ¡Que lo sé yo!\n@c0@"
  fr: "@a%0%a001240@bEn fait, ces bains sont simplement de petits lacs d'eau chaude. Tu vois, j'ai bien appris ma leçonⓠ\n@c0@"
  it: "@a%0%a001240@bI bagni termali non sono altro che laghetti pieni d'acqua calda, no?\nCos'hanno di tanto speciale?\n@c0@"
  ja: "@a@b%a001240「温泉って　お湯でできてる\n\t池のことだよね？\n\tボク　知ってるんだ！\n@c0@"
7:
  de: "@a%0%a001240@bⓞBiancaⓟ! Das hört sich ja lustig an, wenn jemand Mama beim Vornahmen ruft! Für mich ist sie immer nur ⓞMamaⓟ.\n@c0@"
  en: "@a%0%a001240@bBianca! It's funny to hear Mum being called by her name like that. She's always just ⓗMumⓘ to me.\n@c0@"
  es: "@a%0%a001240@b¡Bianca! Qué gracioso es oír llamar a mamá por su nombre. Para mí siempre es ⓕmamáⓖ.\n@c0@"
  fr: "@a%0%a001240@bBiancaⓠ C'est rigolo d'entendre maman se faire appeler par son prénom. Pour moi, c'est toujours ⓥmamanⓦ, et rien d'autre.\n@c0@"
  it: "@a%0%a001240@bLa mia mamma conosce tanta gente qui.\n@c0@"
  ja: "@a@b%a001240「ビアンカちゃん　だって！\n\tお母さんが　そんなふうに\n\t呼ばれるなんて　なんか　おかしいや！\n@c0@"
8:
  de: "@a%0%a001250@bUtensiel. Was für ein niedlicher Name für so ein niedliches kleines Dorf!\n@c0@"
  en: "@a%0%a001250@bStockenbarrel. What a sweet little name for a sweet little village.\n@c0@"
  es: "@a%0%a001250@bClavis. Un nombre muy lindo para una linda aldea.\n@c0@"
  fr: "@a%0%a001250@bSaint Éloi. Quel joli nom pour un joli petit village.\n@c0@"
  it: "@a%0%a001250@bAprianuam è proprio un nome grazioso!\nChissà chi avrà avuto l'idea di chiamare così questo villaggio...\n@c0@"
  ja: "@a@b%a001250「村に名前がないと\n\tこまるよね？　…こまらないの？\n@c0@"
9:
  de: "@aOtto@bMmm, dieses Dorf gefällt mir! Hier liegt so ein besonderer Duft in der Luft ⓚⓛ ich kann förmlich riechen, dass es hier hübsche Mädchen gibt!\n@c0@"
  en: "@aTuppence@bMmm, this village is definitely to my liking. I can almost smell the beautiful girls in the air!\n@c0@"
  es: "@aAlazar@bMmm, definitivamente, esta aldea es de mi gusto. ¡Tiene toda la pinta de que va a haber chicas guapas!\n@c0@"
  fr: "@aInnocent@bMmm, ce village me plaît, c'est certain.\nJe peux presque sentir dans l'air la présence\ndes jolies fillesⓠ\n@c0@"
  it: "@aSimon@bBagni termali?! Cioè quei posti dove si incontrano tante belle fanciulle poco vestite, pronte a immergersi in acqua?!\n㈡\nMaestà, non è che potrebbe nominarmi Ambasciatore di Denim per questo villaggio?!\n@c0@"
  ja: "@a@bピピン「ん～　ここは　いい村ですね……。\n\t美人のニオイがします！\n@c0@"
10:
  de: "@a%0%a001250@bHach, es muss herrlich sein, in der Sonne zu liegen und zu faulenzen! Der Katze scheint's jedenfalls zu gefallen.\n@c0@"
  en: "@a%0%a001250@bIt's nice to be able to laze about in the sun. That cat certainly seems to be enjoying it, anyway.\n@c0@"
  es: "@a%0%a001250@bEs estupendo holgazanear al sol. Al menos, ese gato parece estar disfrutando.\n@c0@"
  fr: "@a%0%a001250@bC'est sympa de pouvoir paresser au soleil.\nEn tout cas, ce chat a l'air d'apprécier.\n@c0@"
  it: "@a%0%a001250@bI gatti adorano starsene sdraiati al sole.\nBeato lui che può permettersi di farlo!\nAh, quanto lo invidio...\n@c0@"
  ja: "@a@b%a001250「ひなたぼっこ　いいね。\n\tネコさん　うれしそうなの。\n@c0@"
11:
  de: "@aBianca@bAuch wenn er sich noch so sehr beklagt ⓚⓛ was sein Sohn tut, ist wahrscheinlich eine große Hilfe.\n@c0@"
  en: "@aBianca@bThat bloke may moan, but what his son's doin' is probably a big help.\n@c0@"
  es: "@aBianca@bEl tipo se queja, pero lo que hace su hijo es de gran ayuda, ¿sabes?\n@c0@"
  fr: "@aBianca@bCe type a beau râler, ce que fait son fils est sûrement très utile.\n@c0@"
  it: "@aBianca@bNon capisco perché quell'uomo si lamenti tanto!\nSuo figlio ha deciso di intraprendere la via della fede, mica quella del crimine!\n@c0@"
  ja: "@a@bビアンカ「おじさんは\n\tああ言ってるけど　息子さんの\n\tおかげで　助かってるのよね。\n@c0@"
12:
  de: "@aNera@bOh! Ein Priester! Wenn ich nicht Rodrigo Onassetti zum Vater hätte, wäre ich womöglich auch Nonne geworden.\n@c0@"
  en: "@aNera@bOoh! A priest. I probably would've become a\r\nnun myself, if I hadn't had Rodrigo Briscoletti\r\nfor a father.\n@c0@"
  es: "@aNera@b¡Oooh! Un sacerdote. Probablemente yo hubiese sido monja si Santino Rimaldi no hubiese sido il mio papino.\n@c0@"
  fr: "@aNera@bOohⓠ Un prêtre. Je serais moi-même sûrement devenue religieuse si je n'avais pas eu Rodrigo Oscuroni pour père.\n@c0@"
  it: "@aNera@bUn sacerdote?! Ah! Anche a me sarebbe piaciuto diventare suora, ma mio padre non avrebbe mai approvato la mia scelta...\n@c0@"
  ja: "@a@bフローラ「まあ！　神父さまに……。\n\t私も　ルドマンの娘でなかったら\n\tシスターになっていたかも知れないわ。\n@c0@"
13:
  de: "@a%0%a001240@bIch dachte immer, alle Kinder müssten den gleichen Beruf ergreifen wie ihr Vater!\n@c0@"
  en: "@a%0%a001240@bI thought all kids were supposed to end up doing the same job as their fathers!\n@c0@"
  es: "@a%0%a001240@b¡Yo creía que todos los hijos tenían que dedicarse a lo mismo que sus padres!\n@c0@"
  fr: "@a%0%a001240@bJe croyais que tous les enfants étaient censés faire le même travail que leur pèreⓠ\n@c0@"
  it: "@a%0%a001240@bCredevo che ogni ragazzo volesse fare il lavoro del proprio padre! Evidentemente per lui non è così, a meno che... No no no! Cosa vado a pensare?!\n@c0@"
  ja: "@a@b%a001240「子どもって　みんな\n\tお父さんと　同じ仕事に\n\tなるんじゃなかったの！？\n@c0@"
14:
  de: "@a%0%a001240@bMuss ich dann etwa nicht König werden, sondern könnte Händler oder ein Priester oder was ganz anderes werden?\n@c0@"
  en: "@a%0%a001240@bDoes this mean I don't have to become king, and\nthat I could be a trader or a priest or something totally different?\n@c0@"
  es: "@a%0%a001240@bEntonces, ¿no tengo que hacerme rey y puedo ser comerciante o sacerdote o algo totalmente distinto?\n@c0@"
  fr: "@a%0%a001240@bEst-ce que ça veut dire que je ne suis pas obligé de devenir roi et que je pourrai devenir commerçant, prêtre ou autre choseⓡ\n@c0@"
  it: "@a%0%a001240@bTutto sommato, è meglio che i figli non debbano per forza seguire le orme dei loro papà: non sono sicuro di voler fare il re da grande.\n㈡\nPreferirei aprire un ristorante con lo zio Sancho.\nHo già pensato al nome ⓕPaelleria da %0%a001240 y Sanchoⓖ! Bello, eh?\n@c0@"
  ja: "@a@b%a001240「ボクも　王さまじゃなくって\n\t商人や　神父さんになれる？\n@c0@"
15:
  de: "@aSancho@bJe mehr Priester und Kirssen es gibt, desto besser für Reisende wie miss und diss, no? Aber es tut mir leid für diesen Señor.\n@c0@"
  en: "@aSancho@bFor the travellers like you and me, ees good\r\nto have more churches, sí? But ees esad for\r\nthees señor.\n@c0@"
  es: "@aSancho@bA los viajeros como tú y yo nos viene de pelos tener más iglesias. Pero es triste para ese señor.\n@c0@"
  fr: "@aSancho@bPour les v-voyageurs comme toi et moi, c'est b-bien d'avoir plus d'églises, noⓡ Mais c'est oun peu triste p-pour ce señor.\n@c0@"
  it: "@aSancho@b¿Por los viaggiatores como nosotros, es bueno que ce estanno muchas chiesas, no?\nSì, es muy bueno.\n@c0@"
  ja: "@a@bサンチョ「旅人の身としては\n\t教会があるのは助かりますが\n\tいやはや　かわいそうに。\n@c0@"
16:
  de: "@aOtto@bNicht selten wachsen Kinder über die Erwartungen ihrer Eltern hinaus. Nehmt nur einmal mich als Beispiel!\n@c0@"
  en: "@aTuppence@bChildren do tend to surpass their parents in their endeavours. I'm a prime example, obviously!\n@c0@"
  es: "@aAlazar@bLos hijos tienden a superar a sus padres. ¡Evidentemente, yo soy buen ejemplo de ello!\n@c0@"
  fr: "@aInnocent@bLes enfants ont tendance à surpasser leurs parents dans leurs entreprises. J'en suis l'exemple parfait, de toute évidenceⓠ\n@c0@"
  it: "@aSimon@bCapita sovente che i genitori non siano d'accordo con le scelte dei figli, ma secondo me questo tipo esagera!\n@c0@"
  ja: "@a@bピピン「子供は　親を\n\t乗りこえてゆくものです。\n\tこのボクのように！\n@c0@"
17:
  de: "@aBianca@bDiese Katze ist nicht direkt unser Haustier, aber es gefällt ihr anscheinend, sich bei uns herumzutreiben.\n@c0@"
  en: "@aBianca@bThat cat's not exactly a pet of ours, but it seems to like hangin' around our place all the time.\n@c0@"
  es: "@aBianca@bNo es que el gato sea nuestra mascota, pero se pasa el día por nuestra casa.\n@c0@"
  fr: "@aBianca@bCe chat n'est pas vraiment à nous, mais il a l'air d'aimer traîner autour de la maison.\n@c0@"
  it: "@aBianca@bQuel gatto non è mio, ma ama gironzolare intorno a casa nostra.\n@c0@"
  ja: "@a@bビアンカ「あのネコは　うちで\n\t飼ってるわけじゃないんだけど\n\tすっかり　居ついちゃってるの。\n@c0@"
18:
  de: "@aBianca@bDa fällt mir ein ⓚⓛ wie es wohl %a001210 ergangen ist?\n@c0@"
  en: "@aBianca@bCome to think of it, I wonder how %a001210's\ngettin' along.\n@c0@"
  es: "@aBianca@bAhora que lo pienso, me pregunto cómo le irá a %a001210, ¿sabes?\n@c0@"
  fr: "@aBianca@bMaintenant que j'y pense, je me demande comment va %a001210.\n@c0@"
  it: "@aBianca@bA proposito di felini!\nChissà come sta %a001210...\n@c0@"
  ja: "@a@bビアンカ「そういえば　%a001210ちゃんは\n\tどうしているかしら……。\n@c0@"
19:
  de: "@aNera@bOb das wohl Biancas Katze ist? Sie ist wirklich niedlich.\n@c0@"
  en: "@aNera@bI wonder if this cat belongs to Bianca.\r\nIt really is very sweet.\n@c0@"
  es: "@aNera@bMe pregunto si este gato es de Bianca.\r\nEs veramente carino.\n@c0@"
  fr: "@aNera@bJe me demande si ce chat appartient à Bianca.\r\nIl est vraiment mignon.\n@c0@"
  it: "@aNera@bQuel gatto è di Bianca?\nÈ un micino davvero adorabile!\n@c0@"
  ja: "@a@bフローラ「この子は　ビアンカさんの家の\n\tネコさんかしら？　あいきょうがあって\n\tかわいい　ネコさんですね。\n@c0@"
20:
  de: "@a%0%a001250@bIch find's toll hier. All die süßen kleinen Miezekatzen!\n@c0@"
  en: "@a%0%a001250@bI really like this place.\nThere are lots of cute little cats.\n@c0@"
  es: "@a%0%a001250@bMe gusta mucho este sitio.\nHay montones de gatitos preciosos.\n@c0@"
  fr: "@a%0%a001250@bJ'adore cet endroit. Il y a plein de mignons\npetits chats.\n@c0@"
  it: "@a%0%a001250@bMi piace questo posto...\nÈ pieno di gatti carinissimi!\n@c0@"
  ja: "@a@b%a001250「この村　ネコさん　いっぱい\n\tうっれしいなっ♪\n@c0@"
21:
  de: "@aBianca@bDer ändert sich auch nie, was? Nicht, dass ich mich beklagen will.\n@c0@"
  en: "@aBianca@bHe dun't change, eh? Not that I'm complainin'\r\nor nothin'.\n@c0@"
  es: "@aBianca@bNo cambia, ¿eh? No es que me queje ni nada.\n@c0@"
  fr: "@aBianca@bIl ne change pas.\r\nMais je ne dis pas ça pour me plaindre, hein.\n@c0@"
  it: "@aBianca@bBah!\nE io che lo sto anche a sentire...\n@c0@"
  ja: "@a@bビアンカ「おじいさん\n\t変わらないなあ……。\n\tま　いいけどね。\n@c0@"
22:
  de: "@aNera@bMeine Güte, Liebling! Ich dachte, wir hätten es eilig, und da sitzt du hier und genießt in aller Gemütsruhe ein Bad!\n@c0@"
  en: "@aNera@bDear me, darling! I thought we were supposed to be in a hurry, and yet there you go taking a bath!\n@c0@"
  es: "@aNera@b¡Cielos, caro! ¡Pensaba que teníamos mucha prisa, y ahí te encuentro dándote un baño!\n@c0@"
  fr: "@aNera@bÇa alors, mon chériⓠ Je croyais que nous étions pressés, et voilà que tu prends le temps de te baignerⓠ\n@c0@"
  it: "@aNera@bTesoro, guarda che andiamo di fretta...\nNon credo che abbiamo tempo per un bagno.\n@c0@"
  ja: "@a@bフローラ「あなた……\n\tいそいでいるというのに\n\t温泉に　入ってしまいましたわね。\n@c0@"
23:
  de: "@aNera@bAber wenn wir nun schon einmal hier sind...\n@c0@"
  en: "@aNera@bBut I suppose, now we're here...\n@c0@"
  es: "@aNera@bPero bene, ya que siamo aquí...\n@c0@"
  fr: "@aNera@bEnfin, maintenant que nous sommes là...\n@c0@"
  it: "@aNera@bBeh, tutto sommato...\nGià che ci siamo...\nViste le circostanze...\n@c0@"
  ja: "@a@bフローラ「でも　せっかく\n\t入ったんだから　すこしだけ……\n@c0@"
24:
  de: "@aNera@bAaah! Das tut gut!\n@c0@"
  en: "@aNera@bAaah! That does feel good.\n@c0@"
  es: "@aNera@b¡Aaah! Qué bien sienta.\n@c0@"
  fr: "@aNera@bAaaahⓠ Ça fait vraiment du bien.\n@c0@"
  it: "@aNera@bAhhh...!\nChe meravigliahhh...!\n@c0@"
  ja: "@a@bフローラ「あ～っ！\n\t気持ちいいですわ～～！！\n@c0@"
25:
  de: "@a%0%a001240@bUi! Schau dir nur den ganzen Dampf an! Der ist ja ganz weiß!\n@c0@"
  en: "@a%0%a001240@bWow! Look at all that steam! It's totally white!\n@c0@"
  es: "@a%0%a001240@b¡Vaya! ¡Mira cuánto vapor! ¡Todo está blanco!\n@c0@"
  fr: "@a%0%a001240@bWaouhⓠ Regarde toute cette vapeurⓠ\nC'est tout blancⓠ\n@c0@"
  it: "@a%0%a001240@bQuanto vapore!\nNon si vede un tubo!\n@c0@"
  ja: "@a@b%a001240「うわあ　すごいユゲ！\n\tまっしろだよっ。\n@c0@"
26:
  de: "@a%0%a001250@bWir sind nicht im Haus und doch kann man hier ein Bad nehmen! Ist das wirklich ein Bad? ist das toll!\n@c0@"
  en: "@a%0%a001250@bWe're outside...and yet people are having a bath!\nIs it really a bath? What fun!\n@c0@"
  es: "@a%0%a001250@bEstamos en el exterior... ¡y la gente se está dando un baño!\n¿Pero eso es un baño? ¡Qué divertido!\n@c0@"
  fr: "@a%0%a001250@bOn est à l'extérieur... et pourtant, les gens prennent un bainⓠ Mais c'est vraiment un bainⓡ\nC'est amusantⓠ\n@c0@"
  it: "@a%0%a001250@bChe divertente fare il bagno all'aria aperta!\n@c0@"
  ja: "@a@b%a001250「……外なのに　おふろ？\n\tほんとに　おふろなの？\n\tなんだか　たのしいね。\n@c0@"
27:
  de: "@aSancho@bAnda! Vielleisst stehen wir im Weg, no? Hier ist es viel zu dampfig für diss!\n@c0@"
  en: "@aSancho@bAnda! Maybe we are een the way of esometheeng, no? Ees too esteamy een here for you!\n@c0@"
  es: "@aSancho@b¡Ándale! Tal vez andemos en medio, ¿no? ¡Aquí hay demasiado vapor para ti!\n@c0@"
  fr: "@aSancho@bAndaⓠ On est peut-être en t-train de gêner le passage, noⓡ Il y a trop de vapeur ici pour t-toiⓠ\n@c0@"
  it: "@aSancho@b¡Ay, quantos vapor!\nLo zio Sancho no vede nada.. Ehm, chico, dimme una cosa... ¿Ce está qualche bella muchacha aquí?\n@c0@"
  ja: "@a@bサンチョ「おやおや　坊っちゃん。\n\tおジャマのようですよ？\n@c0@"
28:
  de: "@a%0%a001240@bIst der alte Mann wirklich so jung, wie er tut? Er kommt mir ein bisschen runzlig vor, aber ist er etwa gar kein alter Mann?\n@c0@"
  en: "@a%0%a001240@bIs the old man really young? He seems a bit wrinkly to me, but is he not actually old?\n@c0@"
  es: "@a%0%a001240@b¿Ese anciano es en realidad joven? Yo lo veo un poco arrugado, pero ¿de verdad no es viejo?\n@c0@"
  fr: "@a%0%a001240@bEst-ce qu'il est vraiment jeune, ce vieux monsieurⓡ Il m'a l'air un peu ridé, mais il n'est pas vraiment vieux, c'est çaⓡ\n@c0@"
  it: "@a%0%a001240@bMa quale piede nella fossa! Quel signore non è mica vecchio come lo zio Sancho, eh?!\nIh ih ih! Che cattiveria che ho detto!\n@c0@"
  ja: "@a@b%a001240「おじいさん　若いの？\n\tだって　シワシワだよ。\n\tおじいさんじゃないの？\n@c0@"
29:
  de: "@aBianca@bWas hat so ein Kerl an so einem Ort zu suchen? Wo soll das noch alles hinführen, was?\n@c0@"
  en: "@aBianca@bFancy a character like him bein' in a place like this! The world's in a sorry old state, eh?\n@c0@"
  es: "@aBianca@b¡Un personaje como él, en un lugar como este! El mundo anda fatal, ¿sabes?\n@c0@"
  fr: "@aBianca@bC'est étonnant de voir un personnage comme lui dans un endroit pareilⓠ Le monde est dans un bien triste état, heinⓡ\n@c0@"
  it: "@aBianca@bMa hai visto che tipaccio?!\nChe tempi... Che tempi!\n@c0@"
  ja: "@a@bビアンカ「この村にまで\n\tあんなヤツが来るなんて……。\n\t世界が　すさんでる　ショウコね。\n@c0@"
30:
  de: "@a%0%a001240@bDer nimmt ja schnell Reißaus.\n@c0@"
  en: "@a%0%a001240@bHe's a quick one at getting away.\n@c0@"
  es: "@a%0%a001240@bEs rápido dándose a la fuga.\n@c0@"
  fr: "@a%0%a001240@bIl s'est éclipsé en un clin d'œil.\n@c0@"
  it: "@a%0%a001240@bQuel tizio se l'è filata più in fretta di un Corniglio viola!\n@c0@"
  ja: "@a@b%a001240「逃げ足の\n\tはやいヤツだったね。\n@c0@"
31:
  de: "@a%0%a001240@bAber dem werden wir's schon zeigen, wenn wir ihn einholen! Im Dorf meiner Mutter macht niemand Ärger!\n@c0@"
  en: "@a%0%a001240@bWe'll make him pay when we catch up with him, though. No one causes trouble in my mum's village!\n@c0@"
  es: "@a%0%a001240@bYa nos las pagará cuando lo alcancemos. ¡Nadie crea problemas en la aldea de mi madre!\n@c0@"
  fr: "@a%0%a001240@bMais on lui réglera son compte quand on le rattrapera. Personne ne cause d'ennuis dans\nle village de ma mamanⓠ\n@c0@"
  it: "@a%0%a001240@bSe lo ritrovo, gli annodo le orecchie dietro il collo!\nCosì imparerà a comportarsi bene, quando viene al villaggio della mia mamma!\n@c0@"
  ja: "@a@b%a001240「お母さんの村で\n\t悪さするなんて…　ゆるせないよ！\n@c0@"
32:
  de: "@a%0%a001250@bHab ich mich erschreckt!\nWas will der denn hier?\n@c0@"
  en: "@a%0%a001250@bThat was a bit of a shock! What was someone like him doing here?\n@c0@"
  es: "@a%0%a001250@b¡Qué susto! ¿Qué hacía alguien así en este lugar?\n@c0@"
  fr: "@a%0%a001250@bQuel chocⓠ Qu'est-ce que quelqu'un comme lui pouvait bien faire iciⓡ\n@c0@"
  it: "@a%0%a001250@bPapà, quello era un ladro, non è vero?\n@c0@"
  ja: "@a@b%a001250「びっくりした……。\n\tなんで　あんな人いるの？\n@c0@"
33:
  de: "@aSancho@bWir wissen nisst, wo oder wem dieser Señor das gestohlen hat. Du musst es behalten, bis wir herausfinden, wem es gehört.\n@c0@"
  en: "@aSancho@bWe no know who or where thees señor, he estole thees from. You must keep eet unteel we find out who ees the owner.\n@c0@"
  es: "@aSancho@bNo sabemos a quién o de dónde robó esto ese señor. Debes conservarlo hasta que sepamos de quién es, nomás.\n@c0@"
  fr: "@aSancho@bOn ne sait p-pas où, ni à qui ce señor a v-volé ça.\r\nIl faut le garder jusqu'à ce qu'on s-sache qui en est le p-propriétaire.\n@c0@"
  it: "@aSancho@bChico, no sappiamo chi sia el derubato, quindi no possiamo restituir el maltoltos.\n㈡\nCe conviene tenerlo fino a cuando no troveremo el legittimo proprietario...\n@c0@"
  ja: "@a@bサンチョ「あやつ　いったい\n\tどこから　盗んできたんでしょうね。\n\tとりあえず　あずかっておきましょう。\n@c0@"
34:
  de: "@aOtto@bAlles in Ordnung, %a000090? Ihr seid doch hoffentlich net verletzt?\n@c0@"
  en: "@aTuppence@bAre you alright, %a000090?\nYou're not injured, I hope?\n@c0@"
  es: "@aAlazar@b¿Estáis bien, %a000090?\nEspero que no estéis herido.\n@c0@"
  fr: "@aInnocent@bÇa va, %a000090ⓡ\nVous n'êtes pas blessé j'espèreⓠ\n@c0@"
  it: "@aSimon@bSta bene, re %a000090?\nNon è ferito, vero?\n@c0@"
  ja: "@a@bピピン「%a000090さま　大丈夫ですか？\n\tおケガは　ありませんか？\n@c0@"
35:
  de: "@aBianca@bWas wollen wir denn jetzt hier, %a000090?\n@c0@"
  en: "@aBianca@bWhat are we doing here at a time like this, %a000090?\n@c0@"
  es: "@aBianca@b¡¿Qué hacemos aquí en un momento como este, %a000090?!\n@c0@"
  fr: "@aBianca@bQu'est-ce qu'on fait ici à un moment pareil, %a000090ⓡ\n@c0@"
  it: "@aBianca@bScusa la domanda, %a000090...\nMa perché siamo venuti qui?!\n@c0@"
  ja: "@a@bビアンカ「ねえ　%a000090っ！\n\tなんだって　こんなときに\n\tこんな所に来るのよっ！！\n@c0@"
36:
  de: "@aBianca@bWeißt du, wieder hier zu sein macht mich ganz nostalgisch.\n@c0@"
  en: "@aBianca@bComin' back to this place makes me feel all nostalgic for the past, y'know.\n@c0@"
  es: "@aBianca@bVolver a este lugar me hace sentir nostalgia del pasado, ¿sabes?\n@c0@"
  fr: "@aBianca@bRevenir dans cet endroit me rend toute nostalgique, tu sais.\n@c0@"
  it: "@aBianca@bForse volevi farmi respirare aria di casa?\nOh, amore mio!\nSei sempre così premuroso nei miei riguardi!\n@c0@"
  ja: "@a@bビアンカ「ここに来たら\n\t私だって　人なみに　里心の\n\tひとつくらい　ついちゃうわ……。\n@c0@"
37:
  de: "@aBianca@bAls wir ganz neu hier waren, hat es mir erst gar nicht gefallen.\n@c0@"
  en: "@aBianca@bI didn't much care for this place when we first moved here.\n@c0@"
  es: "@aBianca@bEste sitio no me hacía mucha gracia cuando nos mudamos aquí.\n@c0@"
  fr: "@aBianca@bQuand nous avons emménagé ici, cet endroit ne signifiait rien de particulier pour moi.\n@c0@"
  it: "@aBianca@bQuando ci trasferimmo qui, questo posto non mi diceva niente.\nPer me era solo un villaggio come un altro.\n@c0@"
  ja: "@a@bビアンカ「最初は　この村のこと\n\tなかなか　好きに　なれなかったわ。\n@c0@"
38:
  de: "@aBianca@bIch weiß nicht, wann sich das geändert hat, aber inzwischen finde ich es hier prima.\n@c0@"
  en: "@aBianca@bI dun't know when my feelins changed, but I really love it here now.\n@c0@"
  es: "@aBianca@bNo sé cuándo cambié de opinión, pero ahora me encanta, ¿me entiendes?\n@c0@"
  fr: "@aBianca@bJe ne sais pas quand ça a commencé à changer, mais j'aime vraiment beaucoup ce village, maintenant.\n@c0@"
  it: "@aBianca@bPoi, all'improvviso, ha iniziato a piacermi, e ora credo che sia il luogo più bello del mondo...\nDopo Denim, s'intende!\n@c0@"
  ja: "@a@bビアンカ「でも　いつだったかな。\n\tこの村のこと　すごく\n\t大好きになったのって……。\n@c0@"
39:
  de: "@aNera@bMach dir keine Gedanken. Es macht mir nichts aus, wenn du nachschauen willst, wie es Bianca geht.\n@c0@"
  en: "@aNera@bDon't worry about me. I don't mind at all if you'd like to go and see how Bianca is doing.\n@c0@"
  es: "@aNera@bNon ti preoccupare per me. No me importa que vayas a ver cómo le va a Bianca.\n@c0@"
  fr: "@aNera@bNe t'inquiète pas. Ça ne m'ennuie pas du tout que tu aies envie d'aller voir comment va Bianca.\n@c0@"
  it: "@aNera@bNon mi arrabbio di certo, se vuoi andare a trovare Bianca.\n@c0@"
  ja: "@a@bフローラ「私のことは　お気になさらず\n\tビアンカさんの　様子を\n\t見てきてあげてくださいな。\n@c0@"
40:
  de: "@aNera@bSchließlich wart ihr doch Sandkastenfreunde, darum weiß ich, dass sie dir viel bedeutet.\n@c0@"
  en: "@aNera@bYou were childhood friends after all, so I know she means a lot to you.\n@c0@"
  es: "@aNera@bErais amigos de la infanciaⓓ sé que es importante per te.\n@c0@"
  fr: "@aNera@bAprès tout, vous êtes des amis d'enfance.\r\nJe sais qu'elle compte beaucoup pour toi.\n@c0@"
  it: "@aNera@bDopotutto siete amici da quando eravate piccoli, ed è normale che tu voglia passare a salutarla...\n@c0@"
  ja: "@a@bフローラ「幼なじみとは　ある意味\n\t特別な存在ですもの。\n\t気になさるお気持ちも　わかりますわ。\n@c0@"
41:
  de: "@aNera@bDieses Dorf ist so herrlich ruhig. Ich fühle mich einfach wohl hier!\n@c0@"
  en: "@aNera@bThis village is so lovely and quiet. Blissful!\n@c0@"
  es: "@aNera@bEste pueblo es tan bello y tranquilo... ¡Qué felicità!\n@c0@"
  fr: "@aNera@bCe village est si beau et si paisible.\nC'est un enchantementⓠ\n@c0@"
  it: "@aNera@bQuesto villaggio è così calmo e tranquillo...\nChe meraviglia!\n@c0@"
  ja: "@a@bフローラ「それにしても　ここは\n\t静かで　いいところですわね。\n@c0@"
42:
  de: "@a%0%a001240@bIch klettere so gern auf Bäume! Darf ich, Papa?\n@c0@"
  en: "@a%0%a001240@bI love climbing trees! Can I climb up, Dad?\n@c0@"
  es: "@a%0%a001240@b¡Me encanta trepar a los árboles! ¿Puedo trepar, papá?\n@c0@"
  fr: "@a%0%a001240@bJ'adore grimper aux arbresⓠ\nJe peux monter, papaⓡ\n@c0@"
  it: "@a%0%a001240@bPapà, voglio arrampicarmi su un albero!\n@c0@"
  ja: "@a@b%a001240「ボク　木のぼり　大好き！\n\tお父さん　のぼってきていい？\n@c0@"
43:
  de: "@a%0%a001240@bHmmm...\n@c0@"
  en: "@a%0%a001240@bMmm...\n@c0@"
  es: "@a%0%a001240@bMmm...\n@c0@"
  fr: "@a%0%a001240@bMmm...\n@c0@"
  it: "@a%0%a001240@bSniff!\nSniff! Sniff!\n@c0@"
  ja: "@a@b%a001240「すーっ　はーっ……。\n@c0@"
44:
  de: "@a%0%a001240@bDie Luft hier ist fantastisch!\n@c0@"
  en: "@a%0%a001240@bThe air here smells amazing!\n@c0@"
  es: "@a%0%a001240@b¡Qué bien huele aquí el aire!\n@c0@"
  fr: "@a%0%a001240@bL'air sent vraiment très bon iciⓠ\n@c0@"
  it: "@a%0%a001240@bAhhh...!\nSenti che aria puraaah...!\n@c0@"
  ja: "@a@b%a001240「すっごく　空気がきれい。\n\tきっもちいーい！\n@c0@"
45:
  de: "@a%0%a001240@bIrgendwie kommt es mir hier so vertraut vor.\n@c0@"
  en: "@a%0%a001240@bThis place feels all familiar for some reason.\n@c0@"
  es: "@a%0%a001240@bEste sitio me suena de algo y no sé por qué.\n@c0@"
  fr: "@a%0%a001240@bJe ne sais pas pourquoi, mais cet endroit me paraît familier.\n@c0@"
  it: "@a%0%a001240@bL'atmosfera di questo posto mi è familiare...\nPerò non riesco a capire perché!\n@c0@"
  ja: "@a@b%a001240「この村　なんだか\n\tなつかしい感じがするね。\n\tどうしてだろう……。\n@c0@"
46:
  de: "@a%0%a001250@bDer Wald spricht mit uns, weißt du. Die Bäume begrüßen uns. Sie sind alle so nett!\n@c0@"
  en: "@a%0%a001250@bThe forest is talking, you know. The trees are saying hello. They're all so friendly!\n@c0@"
  es: "@a%0%a001250@bEl bosque está hablando. Los árboles nos saludan. ¡Son todos muy simpáticos!\n@c0@"
  fr: "@a%0%a001250@bTu sais, la forêt parle. Les arbres nous disent bonjour. Ils sont tous si gentilsⓠ\n@c0@"
  it: "@a%0%a001250@bLa foresta ci sta parlando, papà.\nGli alberi ci dicono ⓕSalve! Come va?ⓖ...\nEhm, no... Non ho preso un'insolazione...\n@c0@"
  ja: "@a@b%a001250「森さんが　お話ししてくるの。\n\tこんにちは　って……。\n\tみんな　やさしいね。\n@c0@"
47:
  de: "@a%0%a001250@bOh! Hast du das Eichhörnchen gesehen, das da gerade vom Zweig hüpfte?\n@c0@"
  en: "@a%0%a001250@bOoh! Did you see that squirrel jump out on the branch of that tree just then?\n@c0@"
  es: "@a%0%a001250@b¡Oooh! ¿Has visto cómo ha saltado la ardilla en la rama de ese árbol?\n@c0@"
  fr: "@a%0%a001250@bOhⓠ Tu as vu l'écureuil sauter sur cette branche d'arbre, à l'instantⓡ\n@c0@"
  it: "@a%0%a001250@bOoohhh! Papà, hai visto?!\nUno scoiattolino ha fatto capolino su quell'albero!\nChe carino!\n@c0@"
  ja: "@a@b%a001250「あ……！\n\tいま　木の枝をリスさんが\n\tぴょーんって　いったのよ。\n@c0@"
48:
  de: "@aSancho@bEs liegt so hoch in den Bergen. Sí, Señor Weißner, er hat sisser ein schweres Leben.\n@c0@"
  en: "@aSancho@bEes eso high een the mountains. Sí, señor Whitaker, he must have a very hard life.\n@c0@"
  es: "@aSancho@bEstá en lo más alto de las montañas. Sí, el señor Doptada debe tener una vida padrísima.\n@c0@"
  fr: "@aSancho@bNous sommes si haut dans les m-montagnes.\r\nLe señor Alba doit avoir oune vie très difficile.\n@c0@"
  it: "@aSancho@bEl señor Whitblanche abita en un luego muy altos, tra las montagnas.\nPienso que no deve essere facil vivere aquí...\n@c0@"
  ja: "@a@bサンチョ「こんな山奥に……。\n\tダンカンさんも　さぞや\n\t苦労されたことでしょうねえ。\n@c0@"
49:
  de: "@aSancho@bIss weiß nissts über diesen Ort außer dem, was du mir erzählst, Chico.\n@c0@"
  en: "@aSancho@bI no know anytheeng about thees place unteel you tell me about eet, friend.\n@c0@"
  es: "@aSancho@bNo sabía nada de este lugar hasta que tú me hablaste de él, chamaco.\n@c0@"
  fr: "@aSancho@bJe ne s-savais rien de cet endroit avant que tu\r\nne m'en p-parles, chico.\n@c0@"
  it: "@aSancho@bYo no conoscevo esto luego, chico...\n¿Como hai fatto a escoprirlo?\n@c0@"
  ja: "@a@bサンチョ「坊っちゃんから聞くまで\n\tこの村のことは　ちっとも\n\t知りませんでしたよ。\n@c0@"
50:
  de: "@aOtto@bDie Aussicht ist ja net so toll, aber inmitten all der Berge war das wohl zu erwarten.\n@c0@"
  en: "@aTuppence@bThe view's not so great, but I suppose that's to be expected, considering we're in the middle of all these mountains.\n@c0@"
  es: "@aAlazar@bLas vistas no son muy buenas, pero era de esperar, ya que estamos en medio de todas esas montañas.\n@c0@"
  fr: "@aInnocent@bLa vue n'est pas terrible. Mais ça n'a rien de surprenant, étant donné que ce village est\r\nencaissé dans les montagnes.\n@c0@"
  it: "@aSimon@bChe bel panorama montagnoso!\nⓕMontagnosoⓖ...\nSi dice così, vero? Oppure mi sono sbagliato?\n@c0@"
  ja: "@a@bピピン「山の中だから　あんまり\n\tながめは　よくないですねえ。\n@c0@"
51:
  de: "@aBianca@bDas ist doch der Mann, der den Brautschleier angefertigt hat, oder?\n@c0@"
  en: "@aBianca@bThe bloke here's the one who made the veil for the weddin', eh?\n@c0@"
  es: "@aBianca@bEste tipo de aquí es el que hizo el velo para la boda, ¿verdad?\n@c0@"
  fr: "@aBianca@bC'est ce type qui a fabriqué le voile pour\nle mariage, nonⓡ\n@c0@"
  it: "@aBianca@bDa queste parti c'è l'artigiano che ha realizzato il velo nuziale, non è così?\n@c0@"
  ja: "@a@bビアンカ「そういえば　結婚式の時の\n\tヴェールは　ここのおじさんが\n\t作ってくれたのよね。\n@c0@"
52:
  de: "@aBianca@bWar der nicht hübsch? Ich hatte ja keine Ahnung, dass er so schöne Sachen machen kann.\n@c0@"
  en: "@aBianca@bIt wasn't half pretty. I had no idea he could make somethin' so lovely.\n@c0@"
  es: "@aBianca@bEra realmente bonito. No tenía ni idea de que fuese capaz de hacer algo tan hermoso, ¿sabes?\n@c0@"
  fr: "@aBianca@bIl était vraiment superbe. Je n'imaginais pas\r\nune seconde qu'il pouvait créer quelque\r\nchose d'aussi beau.\n@c0@"
  it: "@aBianca@bQuell'uomo è un artista!\nNon pensavo che fosse possibile creare un velo così semplice e bello al tempo stesso!\n@c0@"
  ja: "@a@bビアンカ「きれいなヴェールだったわよね。\n\tおじさんが　あんなの　作れるなんて\n\tぜんぜん　知らなかったな。\n@c0@"
53:
  de: "@aNera@bDieser zauberhafte Schleier, den ich bei unserer Hochzeit getragen habe, stammt doch von hier, nicht?\n@c0@"
  en: "@aNera@bThat wonderful veil I wore at our wedding was made here, wasn't it?\n@c0@"
  es: "@aNera@bAquel maravilloso velo que llevé en la nostra boda se fabricó aquí, ¿verdad?\n@c0@"
  fr: "@aNera@bLe merveilleux voile que j'ai porté le jour de notre mariage a été fabriqué ici, n'est-ce pasⓡ\n@c0@"
  it: "@aNera@bIl meraviglioso velo nuziale che ho indossato il giorno del nostro matrimonio è stato fatto qui, non è vero?\n@c0@"
  ja: "@a@bフローラ「結婚式の時に　つけた\n\tあの　すばらしいヴェールは\n\tこちらで作っていただいたんでしょう？\n@c0@"
54:
  de: "@aNera@bDas ist lustig. Er macht gar nicht den Eindruck, als würde er so etwas übernehmen, und dabei hat er seine Arbeit so gut gemacht.\n@c0@"
  en: "@aNera@bIt's funny. He doesn't seem like the kind of fellow to take on work like that, and yet he made such a lovely job of it.\n@c0@"
  es: "@aNera@bEs curioso. No parece el tipo de persona capaz de hacer un trabajo como ese, ma le salió una pieza primorosa.\n@c0@"
  fr: "@aNera@bC'est drôle. Cet homme ne semble pas du tout\r\ndu genre à se charger de ce type de travail et pourtant, il a réalisé quelque chose de magnifique.\n@c0@"
  it: "@aNera@bPosso dire una cattiveria? La persona che l'ha creato non ha affatto l'aspetto di chi è in grado di realizzare un oggetto tanto bello...\n@c0@"
  ja: "@a@bフローラ「ふだんは　そういう仕事を\n\t受けないそうなのに　お父さまったら\n\t本当に　強引で……。\n@c0@"
55:
  de: "@a%0%a001240@bUi! Ein Laden und eine Wohnung in einer Höhle! Toll!\n@c0@"
  en: "@a%0%a001240@bWow! A shop and a house inside a cave! That's cool!\n@c0@"
  es: "@a%0%a001240@b¡Vaya! ¡Una tienda y una casa dentro de una cueva! ¡Es genial!\n@c0@"
  fr: "@a%0%a001240@bWaouhⓠ Un magasin et une maison à l'intérieur\nd'une grotteⓠ C'est génialⓠ\n@c0@"
  it: "@a%0%a001240@bUna caverna con dentro una casa e un negozio?!\nTroppo forte!\n@c0@"
  ja: "@a@b%a001240「わ～\n\t洞くつの　お店と　おうちだ。\n\tカッコイイ～～！\n@c0@"
56:
  de: "@a%0%a001250@bSchau mal, Papa. Sieh dir nur all die Blumen an!\n@c0@"
  en: "@a%0%a001250@bLook, Dad. Look at all those flowers.\n@c0@"
  es: "@a%0%a001250@bMira, papi. Mira cuántas flores.\n@c0@"
  fr: "@a%0%a001250@bRegarde, papa. Regarde toutes ces fleurs.\n@c0@"
  it: "@a%0%a001250@bPapà, guarda quanti fiori!\n@c0@"
  ja: "@a@b%a001250「見て　お父さん。\n\tお花　いっぱい　かざってあるの。\n@c0@"
57:
  de: "@a%0%a001250@bMeinst du, der Mann hat sie alle ausgestellt? Wie nett von ihm!\n@c0@"
  en: "@a%0%a001250@bDo you think the man put them all on display?\nWhat a nice thing to do.\n@c0@"
  es: "@a%0%a001250@b¿Crees que ese hombre las ha puesto para que las vea la gente?\nQué detalle tan bonito.\n@c0@"
  fr: "@a%0%a001250@bTu crois que le monsieur les a mises exprès pour\nles montrerⓡ C'est une bonne idée.\n@c0@"
  it: "@a%0%a001250@bSono bellissimi, non è vero?\nQuando torneremo a Denim metterò tanti vasi di fiori a ogni finestra del castello!\n㈡\nE poi ordinerò a %a001240 di innaffiarli tutti i giorni\n!\nEh eh eh!\n@c0@"
  ja: "@a@b%a001250「あのおじさんが\n\tかざったのかな？\n\tやさしい人なのね。\n@c0@"
58:
  de: "@aBianca@bD-Das warst doch nicht du, %a000090, oder?\n@c0@"
  en: "@aBianca@bY-You didn't, did you, %a000090?\n@c0@"
  es: "@aBianca@bN-no fuiste tú, ¿verdad, %a000090?\n@c0@"
  fr: "@aBianca@bCe... Ce n'est pas toi qui as fait ça, %a000090ⓡ\n@c0@"
  it: "@aBianca@b%0%a000090, per favore...\nDimmi che non sei stato tu a rubarle i vestiti...!\n@c0@"
  ja: "@a@bビアンカ「ま　まさか　%a000090……。\n@c0@"
59:
  de: "@aBianca@bAber natürlich nicht! Das hab ich mir doch gleich gedacht! Ha... Ha ha ha!\n@c0@"
  en: "@aBianca@bNah, I'm sure it weren't you, really. Ha... Ha ha ha!\n@c0@"
  es: "@aBianca@bNo, estoy segura de que no fuiste tú. Ja... ¡Ja, ja, ja!\n@c0@"
  fr: "@aBianca@bMais non, je suis sûre que ce n'était pas toi. Ha...\nHa ha haⓠ\n@c0@"
  it: "@aBianca@bWah ah ah ah ah! Sto scherzando, sciocchino!\nSo bene che non faresti mai una cosa del genere, vero? Vero?!\n@c0@"
  ja: "@a@bビアンカ「そ　そんなはず\n\tないわよねえ。　ほ…　ほほほ……。\n@c0@"
60:
  de: "@aNera@bMeine Güte! Ja, wer macht denn so was?\n@c0@"
  en: "@aNera@bDear me! What a terrible thing for someone to do!\n@c0@"
  es: "@aNera@b¡Oh, cielos! ¡Es terribile que alguien haga algo così!\n@c0@"
  fr: "@aNera@bPar la Déesseⓠ C'est vraiment méchant de faire une chose pareilleⓠ\n@c0@"
  it: "@aNera@bChe scherzo di pessimo gusto!\nE poi, perché prendere i vestiti di una bella ragazza che sta facendo il bagn...\n㈡\n...\nHo capito.\nRitiro la domanda.\n@c0@"
  ja: "@a@bフローラ「まあ！\n\tいやらしい人が　いますのね。\n\tどうしましょう？\n@c0@"
61:
  de: "@a%0%a001240@bIch hätte auch nichts gegen ein langes heißes Bad.\n@c0@"
  en: "@a%0%a001240@bI wouldn't mind a nice, long soak myself.\n@c0@"
  es: "@a%0%a001240@bNo me importaría darme también un buen remojón.\n@c0@"
  fr: "@a%0%a001240@bJ'aimerais bien prendre un long bain, moi aussi.\n@c0@"
  it: "@a%0%a001240@bNon mi dispiacerebbe affatto fare un bel bagno...\n@c0@"
  ja: "@a@b%a001240「あ～　ボクも\n\tゆっくり　温泉に入りたいなあ。\n@c0@"
62:
  de: "@aOtto@bWas für ein verabscheuungswürdiger Schurke würd' denn einer verletzlichen jungen Frau wie ihr die Kleidung stehlen?\n@c0@"
  en: "@aTuppence@bWhat despicable creature would steal clothes from a poor vulnerable young woman like that?\n@c0@"
  es: "@aAlazar@b¿Qué horrible criatura robaría la ropa de una pobre joven desprotegida?\n@c0@"
  fr: "@aInnocent@bQuelle misérable créature peut bien voler ses vêtements à une pauvre femme sans défense\ncomme elleⓡ\n@c0@"
  it: "@aSimon@bSolo a un villano maleducato potrebbe venire in mente di sottrarre gli abiti a una splendida fanciulla che fa il bagno per poter ammirare le sue grazie!\n@c0@"
  ja: "@a@bピピン「かよわき女性の着がえを\n\t盗むなんて　なんてことだ！\n@c0@"
63:
  de: "@aOtto@bWär ich doch nur früher hier gewesen! Ich hätt' mir den Schurken schon geschnappt und zu Brei geschlagen!\n@c0@"
  en: "@aTuppence@bIf only I'd arrived here sooner. Why, I'd take that scoundrel and beat him to a pulp!\n@c0@"
  es: "@aAlazar@bOjalá hubiera llegado antes. ¡Habría atrapado a ese bribón y lo habría hecho papilla!\n@c0@"
  fr: "@aInnocent@bSi j'étais arrivé ici plus tôt, j'aurais mis une belle raclée à cette fripouilleⓠ\n@c0@"
  it: "@aSimon@bPerò...!\nNiente male come idea!\nStrano che non mi sia venuta prima...\n@c0@"
  ja: "@a@bピピン「ボクが　もっとはやく来ていれば\n\tこのボクが……！\n@c0@"
64:
  de: "@aBianca@bEs ist ein bisschen lästig, an der Schänke vorbeilaufen zu müssen, wenn man ins Bad will.\n@c0@"
  en: "@aBianca@bIt's a bit of a pain havin' to traipse past the inn to get to the baths.\n@c0@"
  es: "@aBianca@bEs un peñazo tener que pasar por la posada para ir a los baños, ¿sabes?\n@c0@"
  fr: "@aBianca@bC'est un peu ennuyeux d'avoir à passer par l'auberge pour rejoindre les bains.\n@c0@"
  it: "@aBianca@bPer accedere ai bagni termali si deve necessariamente passare dalla locanda.\n@c0@"
  ja: "@a@bビアンカ「温泉に入るのに　いちいち\n\t宿屋を通らないと　いけないのが\n\tちょっと　めんどうだけど……\n@c0@"
65:
  de: "@aBianca@bAber die Inhaber der Schänke kümmern sich um die Bäder, also kann man eigentlich nicht meckern.\n@c0@"
  en: "@aBianca@bBut they're the ones takin' care of them, so I s'pose it's fair enough.\n@c0@"
  es: "@aBianca@bPero ellos son los que lo gestionan, así que qué se le va a hacer.\n@c0@"
  fr: "@aBianca@bMais comme ce sont eux qui les entretiennent,\r\nc'est un peu normal.\n@c0@"
  it: "@aBianca@bSecondo me, dovrebbero creare un ingresso indipendente...\n@c0@"
  ja: "@a@bビアンカ「温泉の管理をしてるのが\n\t宿屋さんだから　しかたないよね。\n@c0@"
66:
  de: "@aNera@bWas für eine wunderhübsche Schänke, mit den heißen Quellen direkt nebenan! Hier kann man wirklich herrlich entspannen.\n@c0@"
  en: "@aNera@bWhat a lovely inn this is, with the baths nearby and everything. It's certainly nice and relaxing.\n@c0@"
  es: "@aNera@bQué posada más linda, junto a los baños. Es veramente agradable y relajante.\n@c0@"
  fr: "@aNera@bCette auberge est vraiment adorable, avec ses\r\nbains tout proches. C'est vraiment un endroit\r\ncalme et apaisant.\n@c0@"
  it: "@aNera@bQuesta locanda è proprio carina...\nE le terme sono appena a un passo!\nMi piacerebbe trascorrerci una bella vacanza...\n@c0@"
  ja: "@a@bフローラ「温泉もあるし　いい宿ですわね。\n\tなんだか　落ちつきますわ。\n@c0@"
67:
  de: "@a%0%a001240@bIch finde es immer total aufregend, zu einer Herberge zu kommen. Das heißt wohl, ich bin fürs Reisen wie geschaffen, oder nicht?\n@c0@"
  en: "@a%0%a001240@bI always get really excited when we come to an inn. I suppose that means I'm cut out for travelling, doesn't it?\n@c0@"
  es: "@a%0%a001240@bSiempre me emociona llegar a una posada.\nEso querrá decir que estoy hecho para viajar, ¿verdad?\n@c0@"
  fr: "@a%0%a001240@bJe suis toujours très excité quand on va à l'auberge. Ça doit sûrement vouloir dire\nque je suis fait pour voyager, heinⓡ\n@c0@"
  it: "@a%0%a001240@bMi piace dormire nelle locande, papà.\nPerò solo in quelle dove per colazione servono sfilatini con prosciutto di Cinghialorco!\n@c0@"
  ja: "@a@b%a001240「ボク　宿屋さんに来ると\n\tわくわくするんだ。\n\tボクには　旅が　あってるのかな？\n@c0@"
68:
  de: "@aBianca@bDiese alte Frau war wie eine Mutter für mich, seit Mama gestorben ist.\n@c0@"
  en: "@aBianca@bThat old woman's bin like a mother to me ever since Mum died.\n@c0@"
  es: "@aBianca@bEsa anciana fue para mí una segunda madre desde que murió la mía, ¿sabes?\n@c0@"
  fr: "@aBianca@bDepuis la mort de maman, cette vieille femme a été comme une seconde mère pour moi.\n@c0@"
  it: "@aBianca@bDa quando mia madre non c'è più, quella donna si preoccupa per me come se fossi sua figlia...\n@c0@"
  ja: "@a@bビアンカ「あの　おばさんは　母さんが\n\t亡くなってから　私にとって\n\tお母さんみたいな人なの。\n@c0@"
69:
  de: "@a%0%a001240@bAlles in Ordnung, Papa? Da hast du ja ordentlich eins übergebraten bekommen!\n@c0@"
  en: "@a%0%a001240@bAre you alright, Dad? You got quite a whacking on your back there.\n@c0@"
  es: "@a%0%a001240@b¿Estás bien, papá? Te llevaste un buen golpe en la espalda.\n@c0@"
  fr: "@a%0%a001240@bÇa va, papaⓡ Tu viens de te prendre une bonne remontée de bretelles.\n@c0@"
  it: "@a%0%a001240@bMa che ha quella donna da strillare tanto, eh?!\nPerché non pensa agli affari suoi?!\n@c0@"
  ja: "@a@b%a001240「お父さん　大丈夫？\n\t今　いっぱい背中　たたかれて\n\tすっごく痛そうだったよ。\n@c0@"
70:
  de: "@aSancho@bKennst du die Señora, Chico?\n@c0@"
  en: "@aSancho@bYou know thees señora, friend?\n@c0@"
  es: "@aSancho@b¿Conoces a esta señora, chamaco?\n@c0@"
  fr: "@aSancho@bTu c-connais cette señora, chicoⓡ\n@c0@"
  it: "@aSancho@b¿Chico, conosci quella señora?\n@c0@"
  ja: "@a@bサンチョ「おや。　この方は\n\t坊っちゃんの　お知り合いで？\n@c0@"
71:
  de: "@aSancho@bWarum hast du mir nisst vorher von ihr erzählt? Dann hätte iss ihr doch ein schönes Geschenk mitbringen können. Vielleisst eine Paella, eh?\n@c0@"
  en: "@aSancho@bWhy you no tell me before we came here?\r\nThen I could prepare esome nice geeft for her. Maybe a paella, eh?\n@c0@"
  es: "@aSancho@b¿Por qué no me lo dijiste antes de venir?\nLe habría preparado un lindo regalo. Unos burritos, acaso.\n@c0@"
  fr: "@aSancho@bPourquoi tu ne me l'as pas d-d-dit avant qu'on vienneⓡ J'aurais pu lui préparer oun joli cadeau. Oune paella, par exemple.\n@c0@"
  it: "@aSancho@b¡Si me avessi detto que era tanto nervosa, le avrei preparato una bella paella con camomilla!\n@c0@"
  ja: "@a@bサンチョ「先に言ってくだされば\n\tおみやげのひとつも\n\t用意してまいりましたのに。\n@c0@"
72:
  de: "@aNera@bSie hat recht, Liebling. Da waren schließlich all die Jahre, in denen du nirgendwo hingehen konntest.\n@c0@"
  en: "@aNera@bShe's right, darling. There were all those years you couldn't go anywhere, after all.\n@c0@"
  es: "@aNera@bTiene razón, caro. Después de tutto, pasaron muchos años sin que pudieras ir a ningún sitio.\n@c0@"
  fr: "@aNera@bElle a raison, mon chéri. Après tout, tu as passé\r\ntant d'années sans pouvoir aller nulle part.\n@c0@"
  it: "@aNera@bBianca è stata in ansia per te?!\nMa lo sa che sei sposato?! Eh?! Lo sa?!\nSe non lo sa, vado subito a dirglielo!\n@c0@"
  ja: "@a@bフローラ「それは　そうですわ。\n\tだって　何年も\n\t動けなかったんですものね。\n@c0@"
73:
  de: "@aNera@bIch habe so ein schlechtes Gewissen, dass wir Bianca und unseren Kindern und all den anderen solche Sorgen bereitet haben.\n@c0@"
  en: "@aNera@bI feel so guilty for making Bianca and our children and other people so worried about us.\n@c0@"
  es: "@aNera@bVeramente, me siento muy culpable por hacer que Bianca, nuestros hijos y los demás se preocuparan tanto.\n@c0@"
  fr: "@aNera@bJe me sens tellement coupable d'avoir causé\r\ntant d'inquiétude à Bianca, à nos enfants et à\r\ntout le monde.\n@c0@"
  it: "@aNera@bOh, santa dea! Scusami. A volte non riesco a controllare la mia gelosia... Se vuoi passare a salutare Bianca, fai pure... Ma io verrò con te!\n@c0@"
  ja: "@a@bフローラ「ビアンカさんにも\n\t子供たちにも　いっぱい心配かけて\n\t本当に　悪かったわ……。\n@c0@"
74:
  de: "@a%0%a001250@bÄhm, hast du womöglich Geheimnisse vor uns, Papa? ... Schon gut. Ich will's gar nicht wissen.\n@c0@"
  en: "@a%0%a001250@bUm, have you got a few secrets, Dad?\n...It's okay. Never mind.\n@c0@"
  es: "@a%0%a001250@bMmm, ¿tienes algunos secretos, papi?\n... Está bien. No importa.\n@c0@"
  fr: "@a%0%a001250@bHum, tu aurais des petits secrets, papaⓡ\n... Euh, non. J'ai rien dit.\n@c0@"
  it: "@a%0%a001250@bBianca è stata in ansia per te?\nOooooh! Bianca è stata in ansia per te?!\nCosa ci nascondi, papino, eh?\n@c0@"
  ja: "@a@b%a001250「お父さんって　もしかして\n\tヒミツが　いっぱいあるの？\n\t……ううん　なんでもないです。\n@c0@"
75:
  de: "@aSancho@bKennst du die Señora, Chico?\n@c0@"
  en: "@aSancho@bYou know thees señora, friend?\n@c0@"
  es: "@aSancho@b¿Conoces a esta señora, chamaco?\n@c0@"
  fr: "@aSancho@bTu c-connais cette señora, chicoⓡ\n@c0@"
  it: "@aSancho@b¿Chico, conosci quella señora?\n@c0@"
  ja: "@a@bサンチョ「おや。　この方は\n\t坊っちゃんの　お知り合いで？\n@c0@"
76:
  de: "@aSancho@bWarum hast du mir nisst vorher von ihr erzählt? Dann hätte iss ihr doch ein schönes Geschenk mitbringen können. Vielleisst eine Paella, eh?\n@c0@"
  en: "@aSancho@bWhy you no tell me before we came here?\r\nThen I could prepare esome nice geeft for her. Maybe a paella, eh?\n@c0@"
  es: "@aSancho@b¿Por qué no me lo dijiste antes de venir?\nLe habría preparado un lindo regalo. Unos burritos, acaso.\n@c0@"
  fr: "@aSancho@bPourquoi tu ne me l'as pas d-d-dit avant qu'on vienneⓡ J'aurais pu lui préparer oun joli cadeau. Oune paella, par exemple.\n@c0@"
  it: "@aSancho@b¿Como no la conosci?\n¡Ma si te ha detto che Bianca es estata en ansia por ti! ¡No devi dire bugias allo zio Sancho, chico!\n@c0@"
  ja: "@a@bサンチョ「先に言ってくだされば\n\tおみやげのひとつも\n\t用意してまいりましたのに。\n@c0@"
77:
  de: "@aBianca@bTagsüber in die Schänke zu gehen ist irgendwie was Besonderes. Da scheint es immer ruhiger zu sein als überall sonst, findest du nicht?\n@c0@"
  en: "@aBianca@bThere's somethin' about goin' into a pub durin' the day. It always seems quieter than everywhere else, dun't you think?\n@c0@"
  es: "@aBianca@bEs raro entrar de día en una taberna. Hay un silencio como muy especial, ¿no crees?\n@c0@"
  fr: "@aBianca@bC'est toujours un peu particulier d'aller dans une taverne en journée.\n㈡\nÇa semble beaucoup plus tranquille que n'importe\nquel autre endroit, tu ne trouves pasⓡ\n@c0@"
  it: "@aBianca@bDi giorno le taverne sono semivuote...\n@c0@"
  ja: "@a@bビアンカ「昼間の　酒場って\n\t他の場所より　ずっと静かに\n\t感じない？　ふしぎよね。\n@c0@"
78:
  de: "@aNera@bIch bin überrascht, in einem so kleinen Dorf eine Schänke zu finden. Sicher ist sie ideal, um nach der Arbeit hier auszuspannen.\n@c0@"
  en: "@aNera@bI'm surprised to find a pub in a small village like\r\nthis. I suppose it's a good place for people to relax after work.\n@c0@"
  es: "@aNera@bMe sorprende que haya una taberna en una aldea tan piccola como esta. Debe de ser un sitio ideal para que la gente descanse después del lavoro.\n@c0@"
  fr: "@aNera@bJe suis surprise de trouver une taverne dans un petit village comme ça. J'imagine que c'est un endroit idéal pour venir se détendre après le travail.\n@c0@"
  it: "@aNera@bC'è anche una taverna!\nAh, a questo villaggio non manca proprio nulla!\nBeh, più o meno...\n@c0@"
  ja: "@a@bフローラ「こんな小さな村にも\n\t酒場が　あるのね。\n\t仕事のつかれを　いやすためかしら。\n@c0@"
79:
  de: "@a%0%a001240@bWarum ist es in Schänken immer so finster? Haben die Leute dort etwa keinen Spaß, wenn alles hell ist?\n@c0@"
  en: "@a%0%a001240@bWhy are pubs always so dark?\nIs it no fun if they're bright?\n@c0@"
  es: "@a%0%a001240@b¿Por qué las tabernas están siempre tan oscuras?\n¿La luz no es divertida?\n@c0@"
  fr: "@a%0%a001240@bPourquoi les tavernes sont-elles toujours aussi sombresⓡ C'est moins drôle s'il y a de la lumière, c'est çaⓡ\n@c0@"
  it: "@a%0%a001240@bQuesto locale è troppo buio.\nPerché non accendono qualche lampada?\n@c0@"
  ja: "@a@b%a001240「どうして　酒場って\n\tくらいのかな？\n\t明るいと　楽しくないの？\n@c0@"
80:
  de: "@a%0%a001250@bSchänken riechen selbst am Tag noch nach Alkohol, findest du nicht?\n@c0@"
  en: "@a%0%a001250@bPubs smell of drink even during the daytime,\ndon't they?\n@c0@"
  es: "@a%0%a001250@bLas tabernas huelen a alcohol incluso de día, ¿verdad?\n@c0@"
  fr: "@a%0%a001250@bLes tavernes sentent la boisson même en journée, hein que c'est vraiⓡ\n@c0@"
  it: "@a%0%a001250@bPapà, posso ordinare un succo di pesca?\n@c0@"
  ja: "@a@b%a001250「酒場って　夜じゃなくても\n\tお酒くさいのね。\n@c0@"
81:
  de: "@aSancho@bHeh heh heh! Hast du all diese verschiedenen Getränke gesehen? Hier ist für jeden etwas dabei. Sí, sí, das ist eine schöne Sammlung.\n@c0@"
  en: "@aSancho@bHeh heh heh! You esee all thees dreenks?\r\nEes a collection for the lovers of the alcohol.\r\nSí, sí. Ees a fine collection.\n@c0@"
  es: "@aSancho@b¡Je, je, je! ¿Ves todas esas bebidas?\nEs una colección para amantes del trago.\nSí, sí. Una linda colección.\n@c0@"
  fr: "@aSancho@bHé hé héⓠ T-Tu as vu toutes ces b-boissonsⓡ\nOune vraie c-collection pour les amateurs d'alcool.\nSi, si. Oune collection très f-fournie.\n@c0@"
  it: "@aSancho@b¿Chico, piensi que aquí servano una buena paella?\n@c0@"
  ja: "@a@bサンチョ「ふむふむ。\n\tずいぶん　通ごのみのお酒を\n\tそろえてありますねえ。\n@c0@"
82:
  de: "@aBianca@bNachdem wir diesen Korol zum Teufel gejagt haben, fällt hoffentlich niemand mehr auf diesen Schwindel herein, was?\n@c0@"
  en: "@aBianca@bHopefully there won't be any more folk gettin' taken in like that now we've seen off Korol, eh?\n@c0@"
  es: "@aBianca@bEspero que no engañen a más gente ahora que hemos ahuyentado a Korol, ¿sabes?\n@c0@"
  fr: "@aBianca@bEspérons que plus personne ne se fera embrigader, maintenant que nous avons réglé son compte à Korol, heinⓡ\n@c0@"
  it: "@aBianca@bSpero che la Setta di Zugzwang abbia finito di fare proseliti, ora che abbiamo tolto di mezzo Krocorov...\n@c0@"
  ja: "@a@bビアンカ「イブールも　たおしたんだし\n\tもう　これ以上　だまされる人が\n\t出ないといいわよね。\n@c0@"
83:
  de: "@aNera@bIch habe immer noch die Stimmen von Korols Gefolgsleuten im Ohr, wie sie gebetet haben. Was war das für ein schreckensvoller Ort!\n@c0@"
  en: "@aNera@bI can still hear the followers' voices ringing in\r\nmy ears as they prayed. What a terrifying place that was.\n@c0@"
  es: "@aNera@bAún posso oír en la mia cabeza los rezos de los seguidores. ¡Era un lugar terrorífico!\n@c0@"
  fr: "@aNera@bJ'entends encore les voix des adeptes en prière résonner à mes oreilles. C'était un lieu réellement terrifiant.\n@c0@"
  it: "@aNera@bHo ancora nelle orecchie le preghiere dei seguaci della Setta di Zugzwang...\nSanta dea! Che cosa orribile!\n@c0@"
  ja: "@a@bフローラ「信者たちの　祈りの声が　まだ\n\t耳に　のこっているような気がするの。\n\tあそこはこわい所だったわ。　本当に。\n@c0@"
84:
  de: "@a%0%a001240@bWas stand da? Die Handschrift war ein bisschen undeutlich, so dass ich's nicht richtig lesen konnte.\n@c0@"
  en: "@a%0%a001240@bWhat did it say? The handwriting was a bit messy, so I couldn't figure it out.\n@c0@"
  es: "@a%0%a001240@b¿Qué decía? La caligrafía era desastrosa, no pude averiguarlo.\n@c0@"
  fr: "@a%0%a001240@bQu'est-ce que ça disaitⓡ L'écriture était un peu brouillonne, alors je n'ai pas compris.\n@c0@"
  it: "@a%0%a001240@bUhm, chissà se chi ha scritto questo messaggio è ancora vivo...\n@c0@"
  ja: "@a@b%a001240「なんか書いてあったの？\n\tきたない字だったから\n\tボク　読めなかったよ。\n@c0@"
85:
  de: "@a%0%a001250@bEs ist ungezogen, auf Wänden herumzuschmieren!\n@c0@"
  en: "@a%0%a001250@bIt's naughty to graffiti things like that!\n@c0@"
  es: "@a%0%a001250@b¡Está feo escribir cosas así!\n@c0@"
  fr: "@a%0%a001250@bCe n'est pas bien de faire des graffitis sur\nles mursⓠ\n@c0@"
  it: "@a%0%a001250@bÈ incredibile quanta gente abbia creduto alle falsità della Setta di Zugzwang...\n@c0@"
  ja: "@a@b%a001250「あんなところに\n\t落書きしちゃダメなのに……。\n@c0@"
86:
  de: "@aBianca@bDas Blitzende Badesalz, das er meinte, sind die Kristallablagerungen im Badewasser. Es ist alles ganz natürlich, und es gibt nicht allzu viel davon.\n@c0@"
  en: "@aBianca@bThat scintillating sinter he was on about is the crystal deposits left behind in the bath water. It's all natural stuff, and there's not a lot of it.\n@c0@"
  es: "@aBianca@bEsas sales destellantes de las que hablaba son los depósitos de cristales que quedan en los baños. Es un recurso natural, y no hay muchas.\n@c0@"
  fr: "@aBianca@bLes sels scintillants dont il parlait sont les dépôts cristallisés qui restent dans l'eau des bains. Ce sont des sels naturels et il n'y en a pas beaucoup.\n@c0@"
  it: "@aBianca@bI sali da bagno scintillanti di cui parla sono i depositi naturali lasciati dalle acque termali.\nSono molto pregiati, e non è facile procurarsene.\n@c0@"
  ja: "@a@bビアンカ「秘湯の花っていうのは\n\t温泉の結晶なの。　天然のものだから\n\tすこししか　とれないんだけど……。\n@c0@"
87:
  de: "@aBianca@bDafür ist Utensiel weithin bekannt.\n@c0@"
  en: "@aBianca@bIt's the most famous thing about Stockenbarrel by far.\n@c0@"
  es: "@aBianca@bEs de lejos lo que da más fama a Clavis, ¿sabes?\n@c0@"
  fr: "@aBianca@bC'est de loin la spécialité la plus connue de Saint Éloi.\n@c0@"
  it: "@aBianca@bSono senz'altro il prodotto tipico più famoso di Aprianuam.\n@c0@"
  ja: "@a@bビアンカ「この村で　ゆいいつ　名産と\n\tよべるものかも知れないわね。\n@c0@"
88:
  de: "@a%0%a001240@bIch glaub', das ist gar kein netter Mann.\n@c0@"
  en: "@a%0%a001240@bI get the feeling that man isn't a very nice character.\n@c0@"
  es: "@a%0%a001240@bMe da la impresión de que ese hombre no es muy agradable.\n@c0@"
  fr: "@a%0%a001240@bJ'ai l'impression que ce type n'est pas très agréable.\n@c0@"
  it: "@a%0%a001240@bQuel signore non mi dà l'idea di essere una brava persona...\n@c0@"
  ja: "@a@b%a001240「あの人　あんまり\n\tいい人じゃないかも　しれないね……。\n@c0@"
89:
  de: "@a%0%a001240@bWarum ist er denn bei Mamas Anblick so in Panik geraten?\n@c0@"
  en: "@a%0%a001240@bWhy did he panic like that when he saw Mum?\n@c0@"
  es: "@a%0%a001240@b¿Por qué le entró pánico al ver a mamá?\n@c0@"
  fr: "@a%0%a001240@bPourquoi il a paniqué comme ça en voyant mamanⓡ\n@c0@"
  it: "@a%0%a001240@bHai visto con che occhi guardava la mamma?\nUhm, quel tipo mi puzza...\n@c0@"
  ja: "@a@b%a001240「お母さんを見て\n\tあわててたよ？\n@c0@"
90:
  de: "@a%0%a001250@bWas führt er denn in diesem dunklen Brunnen im Schilde? Meinst du, er will sich verstecken?\n@c0@"
  en: "@a%0%a001250@bWhat could he be doing down a dark well like this?\nDo you think he's trying to hide?\n@c0@"
  es: "@a%0%a001250@b¿Qué estaría haciendo en un pozo tan oscuro?\n¿Crees que intenta esconderse?\n@c0@"
  fr: "@a%0%a001250@bQu'est-ce qu'il peut bien faire au fond d'un puits sombre comme celui-làⓡ Tu crois qu'il essaie\nde se cacherⓡ\n@c0@"
  it: "@a%0%a001250@bMa cosa ci fa quel tizio in fondo a un pozzo?\nSecondo te si sta nascondendo da qualcuno?\n@c0@"
  ja: "@a@b%a001250「こんなくらい\n\t井戸の底で　なにしてるの？\n\tかくれてしないと　いけないことなの？\n@c0@"
91:
  de: "@aNera@bOh ja. Utensiel ist berühmt für sein Blitzendes Badesalz.\n@c0@"
  en: "@aNera@bOh yes. Stockenbarrel is famous for its\r\nscintillating sinter.\n@c0@"
  es: "@aNera@b¡Ah, sí! Clavis es famoso per le sue sales destellantes.\n@c0@"
  fr: "@aNera@bOui. Saint Éloi est connu pour ses sels scintillants.\n@c0@"
  it: "@aNera@bAh, certo!\nI sali da bagno scintillanti di Aprianuam sono rinomati in tutto il mondo!\n@c0@"
  ja: "@a@bフローラ「秘湯の花って　たしか\n\tこの村の　名産でしたわよね。\n@c0@"
92:
  de: "@aNera@bIch glaube, es ist sogar recht wertvoll. Ich frage mich, ob der Mann hier aus der Gegend stammt. Er hört sich nicht danach an.\n@c0@"
  en: "@aNera@bI think it's quite a valuable thing, in fact. I wonder if that man's from around these parts. It doesn't seem like he is.\n@c0@"
  es: "@aNera@bCredo que son muy valiosas. Me pregunto si este uomo es de por aquí. No parece que lo sea.\n@c0@"
  fr: "@aNera@bJe crois que c'est quelque chose d'assez précieux. Je me demande si cet homme est de la région.\r\nOn ne dirait pas.\n@c0@"
  it: "@aNera@bE sono anche molto cari!\nForse quel tipo è venuto ad Aprianuam proprio per procurarsene un po'.\n@c0@"
  ja: "@a@bフローラ「わりと　貴重な物だったと\n\t思いますけど　あの方…\n\tこの村の方なのかしら？\n@c0@"
93:
  de: "@a%0%a001240@bIch glaub', das ist gar kein netter Mann.\n@c0@"
  en: "@a%0%a001240@bI get the feeling that man isn't a very nice character.\n@c0@"
  es: "@a%0%a001240@bMe da la impresión de que ese hombre no es muy agradable.\n@c0@"
  fr: "@a%0%a001240@bJ'ai l'impression que ce type n'est pas très agréable.\n@c0@"
  it: "@a%0%a001240@bQuel signore non mi dà l'idea di essere una brava persona...\n@c0@"
  ja: "@a@b%a001240「あの人　あんまり\n\tいい人じゃないかも　しれないね……。\n@c0@"
94:
  de: "@a%0%a001250@bWas führt er denn in diesem dunklen Brunnen im Schilde? Meinst du, er will sich verstecken?\n@c0@"
  en: "@a%0%a001250@bWhat could he be doing down a dark well like this?\nDo you think he's trying to hide?\n@c0@"
  es: "@a%0%a001250@b¿Qué estaría haciendo en un pozo tan oscuro?\n¿Crees que intenta esconderse?\n@c0@"
  fr: "@a%0%a001250@bQu'est-ce qu'il peut bien faire au fond d'un puits sombre comme celui-làⓡ Tu crois qu'il essaie\nde se cacherⓡ\n@c0@"
  it: "@a%0%a001250@bMa cosa ci fa quel tizio in fondo a un pozzo?\nSecondo te si sta nascondendo da qualcuno?\n@c0@"
  ja: "@a@b%a001250「こんなくらい\n\t井戸の底で　なにしてるの？\n\tかくれてしないと　いけないことなの？\n@c0@"
95:
  de: "@aBianca@bHm. Kein Wunder, dass es in letzter Zeit so schwierig geworden ist, Blitzendes Badesalz zu bekommen. Der hat sich einfach alles geschnappt!\n@c0@"
  en: "@aBianca@bHuh! No wonder it's bin so tricky findin' any scintillatin' sinter lately. That bloke's got it all!\n@c0@"
  es: "@aBianca@b¡Mmm! No me extraña que últimamente no hubiese manera de encontrar ni un grano de sales destellantes. ¡Ese tipo tiene todas las existencias!\n@c0@"
  fr: "@aBianca@bPfffⓠ Pas étonnant que ce soit si dur de trouver des sels scintillants, dernièrement.\nC'est ce type qui a tout prisⓠ\n@c0@"
  it: "@aBianca@bQuel tipo aveva una gran quantità di sali da bagno scintillanti... Come avrà fatto a procurarsene tanti?\nQuei sali sono molto rari!\n@c0@"
  ja: "@a@bビアンカ「秘湯の花が　こんなに……！\n\t最近　とれないと思ったら\n\tあの人が　取っていたのね。\n@c0@"
96:
  de: "@aNera@bBlitzendes Badesalz duftet so gut.\n@c0@"
  en: "@aNera@bScintillating sinter has a lovely distinct smell to it.\n@c0@"
  es: "@aNera@bLas sales destellantes tienen il suo aroma característico.\n@c0@"
  fr: "@aNera@bLes sels scintillants possèdent une délicieuse odeur, très caractéristique.\n@c0@"
  it: "@aNera@bAdoro i sali da bagno scintillanti!\nHanno un profumo delizioso!\n@c0@"
  ja: "@a@bフローラ「秘湯の花って\n\tふわっと　いい香りがしますのね。\n@c0@"
97:
  de: "@a%0%a001250@bDas also ist Blitzendes Badesalz? Schüttet man sich das ins Badewasser oder wie?\n@c0@"
  en: "@a%0%a001250@bSo this is scintillating sinter? Are you supposed to put it in the bath or something?\n@c0@"
  es: "@a%0%a001250@b¿Estas son las sales destellantes? ¿Son para ponerlas en el baño o algo así?\n@c0@"
  fr: "@a%0%a001250@bAlors c'est ça, les sels scintillantsⓡ On est censés\nles mettre dans le bain, ou quelque chose du\ngenre, nonⓡ\n@c0@"
  it: "@a%0%a001250@bQuesti sono sali da bagno?\nNon farli vedere allo zio Sancho, altrimenti li userà per condirci la paella!\n@c0@"
  ja: "@a@b%a001250「これが　秘湯の花？\n\tお風呂にいれると　いいんでしょ？\n@c0@"
98:
  de: "@aOtto@bDiese Wüstenrosen waren spottbillig. Wer hätte gedacht, dass man sie gegen Blitzendes Badesalz eintauschen könnte?\n@c0@"
  en: "@aTuppence@bThose desert roses were two a penny.\r\nWho'd have thought you could exchange\r\nthem for scintillating sinter?\n@c0@"
  es: "@aAlazar@bEstas rosas del desierto se vendían a dos por uno.\n¿Quién iba a pensar que las podríamos cambiar por sales destellantes?\n@c0@"
  fr: "@aInnocent@bCes roses des sables coûtaient 1 pièce d'or les deux. Qui aurait cru qu'on pourrait les échanger contre des sels scintillantsⓡ\n@c0@"
  it: "@aSimon@bNon è poi così difficile trovare qualche rosa del deserto...\n㈡\nOvviamente quel tipo non lo sa, altrimenti non ci avrebbe mai dato dei preziosi sali da bagno scintillanti per ottenerne una!\n@c0@"
  ja: "@a@bピピン「おっ　砂漠に行けば\n\tごろごろしているものが\n\t秘湯の花に　かわりましたねっ！\n@c0@"
99:
  de: "@aOtto@bWas kriegen wir dann erst für das Blitzende Badesalz? Oder vielleicht sollten wir uns vorsichtshalber lieber damit zufriedengeben?\n@c0@"
  en: "@aTuppence@bI wonder what we could exchange the\r\nscintillating sinter for. Or should we just\r\nquit while we're ahead?\n@c0@"
  es: "@aAlazar@bMe pregunto por qué podríamos cambiar las sales destellantes. ¿O sería mejor dejarlo ahora que salimos ganando?\n@c0@"
  fr: "@aInnocent@bJe me demande contre quoi on pourrait échanger\nles sels scintillants. Mais peut-être qu'il vaudrait mieux s'arrêter là, nonⓡ\n@c0@"
  it: "@aSimon@bMaestà, lei è proprio un gran furbone!\nDetto con rispetto, sia chiaro!\n@c0@"
  ja: "@a@bピピン「この　秘湯の花は\n\tなんに　かわるのかな？　…って\n\tそこまでは　うまくいかないか。\n@c0@"
100:
  de: "@aBianca@bWenn ihm die Welt da draußen so am Herzen liegt, wieso steigt er dann nicht aus seinem Brunnen raus?\n@c0@"
  en: "@aBianca@bIf he's that fussed about the outside world,\r\nthen why dun't he get out of this well?\n@c0@"
  es: "@aBianca@bSi tanto habla del mundo, ¿por qué no sale de ese agujero?\n@c0@"
  fr: "@aBianca@bS'il fait aussi grand cas du monde extérieur et\ndes voyages, pourquoi est-ce qu'il ne sort pas\nde ce trouⓡ\n@c0@"
  it: "@aBianca@bSe ha tanta voglia di visitare un paese lontano, perché non fa la valigia e parte?\n@c0@"
  ja: "@a@bビアンカ「さっさと　ここから\n\t出ればいいのに！\n@c0@"
101:
  de: "@aBianca@bVielleicht war er darum so hinter dem Blitzenden Badesalz her.\n@c0@"
  en: "@aBianca@bMaybe that's why he was after the scintillatin' sinter all the while.\n@c0@"
  es: "@aBianca@bA lo mejor es por eso que andaba detrás de las sales destellantes, ¿sabes?\n@c0@"
  fr: "@aBianca@bEn fait, c'est peut-être pour ça qu'il tenait tant\r\nà obtenir des sels scintillants.\n@c0@"
  it: "@aBianca@bComunque, adesso ho capito a cosa gli servivano tutti quei sali da bagno scintillanti: voleva barattarli con una rosa del deserto!\n@c0@"
  ja: "@a@bビアンカ「そんな思いまでして\n\t秘湯の花を　取りたいのかしら。\n@c0@"
102:
  de: "@aNera@bVielleicht bin ich da auf dem Holzweg, aber meinst du, der Mann sitzt hier unten fest?\n@c0@"
  en: "@aNera@bI could be wrong, but is that fellow stuck down here, do you think?\n@c0@"
  es: "@aNera@bA lo mejor me equivoco, ma ¿no crees que el tipo ese está atrapado ahí abajo?\n@c0@"
  fr: "@aNera@bJe me trompe peut-être, mais... crois-tu que\ncet homme est coincé iciⓡ\n@c0@"
  it: "@aNera@bNon capisco cosa ci faccia qui sotto quel tipo...\nPossibile che non riesca a uscire?!\n@c0@"
  ja: "@a@bフローラ「よく　わかりませんけど\n\tあの方　ここから\n\t出られないのでしょうか？\n@c0@"
103:
  de: "@a%0%a001240@bÄhm, Papa... Was hat denn der Mann mit Mama zu tun?\n@c0@"
  en: "@a%0%a001240@bUm, Dad... What's that man got to do with Mum?\n@c0@"
  es: "@a%0%a001240@bMmm, papá... ¿Qué tiene que ver ese hombre con mamá?\n@c0@"
  fr: "@a%0%a001240@bHum, papa... Qu'est-ce que ce type a à voir\navec mamanⓡ\n@c0@"
  it: "@a%0%a001240@bPapà, perché quel signore si preoccupa tanto per la mamma?\nCredi che sia innamorato di lei?\n@c0@"
  ja: "@a@b%a001240「ねえ　お父さん\n\tあの人　お母さんの何なの？\n@c0@"
104:
  de: "@a%0%a001250@bDu und Mama kanntet euch schon als Kinder, oder, Papa?\n@c0@"
  en: "@a%0%a001250@bYou and Mum were childhood friends, weren't\nyou, Dad?\n@c0@"
  es: "@a%0%a001250@bMamá y tú erais amigos de la infancia, ¿no, papi?\n@c0@"
  fr: "@a%0%a001250@bToi et maman, vous étiez des amis d'enfance,\nhein, papaⓡ\n@c0@"
  it: "@a%0%a001250@bPapà, è vero che tu e mamma vi conoscete fin da bambini?\n@c0@"
  ja: "@a@b%a001250「お父さんと　お母さんって\n\t幼なじみ　だったのね。\n@c0@"
105:
  de: "@a%0%a001250@bIch hoffe, es geht ihr gut. Hoffentlich finden wir sie bald.\n@c0@"
  en: "@a%0%a001250@bI hope she's okay. I wish we could find her soon.\n@c0@"
  es: "@a%0%a001250@bEspero que esté bien. Ojalá la encontremos pronto.\n@c0@"
  fr: "@a%0%a001250@bJ'espère qu'elle va bien. Si seulement on pouvait\nla retrouver très vite.\n@c0@"
  it: "@a%0%a001250@bAllora sono tanti anni che le vuoi bene, non è vero?\nNon preoccuparti! La troveremo presto!\n@c0@"
  ja: "@a@b%a001250「お母さん　大丈夫かな。\n\tはやく　会いたいね……。\n@c0@"
106:
  de: "@aOtto@bIhr seid doch net bloß ein alter Freund, Ihr seid ihr Ehemann!\n@c0@"
  en: "@aTuppence@bYou're not just old friends, you're her husband!\n@c0@"
  es: "@aAlazar@b¡No solo sois amigos, vos sois su marido!\n@c0@"
  fr: "@aInnocent@bVous n'êtes pas seulement de vieux amis, vous êtes mari et femmeⓠ\n@c0@"
  it: "@aSimon@bMaestà, Bianca non è solo sua amica!\nÈ sua moglie, ricorda?\n@c0@"
  ja: "@a@bピピン「幼なじみだけじゃなくて\n\t結婚相手なのに……。\n@c0@"
107:
  de: "@aOtto@bHmm. Vielleicht hat er was für Bianca übrig, wisst ihr. Vielleicht steckt er darum seinen Kopf in den Sand.\n@c0@"
  en: "@aTuppence@bHmm. I think he might have a bit of a thing for Bianca, you know. That's probably why he's burying his head in the sand.\n@c0@"
  es: "@aAlazar@bMmm. Creo que él tal vez sienta algo por Bianca, ya sabéis. Seguramente por eso es por lo que se esconde.\n@c0@"
  fr: "@aInnocent@bMmm. Je crois qu'il en pince un peu pour Bianca,\r\nvous savez. C'est sans doute pour ça qu'il essaie\r\nde noyer le poisson.\n@c0@"
  it: "@aSimon@bSe mi consente di dirlo, quel bel tomo è invaghito della Regina, caro il mio Sire!\n㈡\n\nFossi in lei, gli tirerei una bella bastonata in testa, così imparerà a non alzare lo sguardo sulla sua consorte! Maestà, vuole che me ne occupi io...?\n@c0@"
  ja: "@a@bピピン「ははあ…　あの人\n\tビアンカさまが　好きだから\n\t現実を　見ないようにしてるんですね。\n@c0@"
108:
  de: "@aBianca@bIch hätte nicht gedacht, dass sich so viele Leute Sorgen um mich machen. Ich hoffe, so was passiert nie wieder.\n@c0@"
  en: "@aBianca@bI didn't imagine so many folk would be worried about me. I hope nothin' like that ever happens again.\n@c0@"
  es: "@aBianca@bNunca pensé que se preocuparía por mí tanta gente. Espero que no vuelva a suceder algo así, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe ne pensais pas qu'autant de gens s'inquiéteraient pour moi. J'espère que ce qui est arrivé ne se reproduira plus jamais.\n@c0@"
  it: "@aBianca@bDa un lato mi spiace aver fatto stare in ansia tante persone, ma dall'altro sono felice che si preoccupino per me. Vuol dire che mi vogliono bene, no?\n@c0@"
  ja: "@a@bビアンカ「思った以上に　いろんな人に\n\t心配かけちゃったね……。\n\tもう　ああいうことが　ないといいな。\n@c0@"
109:
  de: "@a%0%a001250@bLass uns nicht wieder allein, Mama, ja?\n@c0@"
  en: "@a%0%a001250@bDon't leave us again, will you, Mum?\n@c0@"
  es: "@a%0%a001250@bNo vuelvas a dejarnos, ¿vale, mami?\n@c0@"
  fr: "@a%0%a001250@bNe nous laisse plus jamais, d'accord, mamanⓡ\n@c0@"
  it: "@a%0%a001250@bMammina, non ci abbandonare più!\n@c0@"
  ja: "@a@b%a001250「お母さん　もう\n\tいなくならないでね。\n@c0@"
110:
  de: "@aBianca@bNatürlich nicht, %a001250! Da kannst du ganz beruhigt sein.\n@c0@"
  en: "@aBianca@bOf course I won't, %a001250.\nDun't you worry.\n@c0@"
  es: "@aBianca@bPues claro que no, %a001250.\nNo te preocupes.\n@c0@"
  fr: "@aBianca@bJe te le promets, %a001250. Ne t'inquiète pas.\n@c0@"
  it: "@aBianca@bOh, %a001250...\nNon lo farò. Ti prometto che d'ora in poi resterò sempre accanto a te.\n@c0@"
  ja: "@a@bビアンカ「うん。\n\tごめんね　%a001250……。\n@c0@"
111:
  de: "@aBianca@bEine Herberge zu führen ist viel Arbeit.\n@c0@"
  en: "@aBianca@bRunnin' an inn is a tough old job.\n@c0@"
  es: "@aBianca@bLlevar una posada es un trabajo de esclavos.\n@c0@"
  fr: "@aBianca@bTenir une auberge est un métier difficile.\n@c0@"
  it: "@aBianca@bGestire una locanda non è facile...\n@c0@"
  ja: "@a@bビアンカ「宿屋の仕事って\n\t大変なのよね。\n@c0@"
112:
  de: "@aBianca@bMan hat immer alle Hände voll zu tun, um die Gäste bei Laune zu halten.\n@c0@"
  en: "@aBianca@bTryin' to keep all the customers happy is a\r\nnever-endin' task.\n@c0@"
  es: "@aBianca@bLo de mantener satisfechos a los clientes no es fácil, ¿sabes?\n@c0@"
  fr: "@aBianca@bOn passe son temps à essayer de satisfaire\r\nles clients.\n@c0@"
  it: "@aBianca@bCercare di accontentare i clienti sempre e comunque può essere più arduo che trovare l'Equipaggiamento Zenithiano!\n@c0@"
  ja: "@a@bビアンカ「お客さんみんなに\n\tよろこんでもらおうと思ったら\n\tきりが　なくなっちゃって。\n@c0@"
113:
  de: "@a%0%a001240@bEs klingt so, als hätte Opa ein paar Probleme. Sollten wir nicht versuchen, ihm zu helfen?\n@c0@"
  en: "@a%0%a001240@bIt sounds like Grandpa's having a few problems.\nDo you think we should try and do something to\nhelp out?\n@c0@"
  es: "@a%0%a001240@bParece que el abuelo tiene algunos problemas.\n¿Igual deberíamos ayudarle?\n@c0@"
  fr: "@a%0%a001240@bOn dirait que grand-père a quelques soucis.\nTu crois qu'on devrait essayer de faire\nquelque chose pour l'aiderⓡ\n@c0@"
  it: "@a%0%a001240@bIl nonno ha qualche problema?\nPerché non andiamo ad aiutarlo, allora?\n@c0@"
  ja: "@a@b%a001240「おじいさま　こまってるんだ。\n\tう～ん…　どうしよう。\n\tなにか　してあげられるかな？\n@c0@"
114:
  de: "@aNera@bWie nett von ihm, uns ein Hochzeitsgeschenk zu machen!\n@c0@"
  en: "@aNera@bHow nice of him to give us a wedding present!\n@c0@"
  es: "@aNera@b¡Ma qué detalle, darnos un regalo de boda!\n@c0@"
  fr: "@aNera@bComme c'est gentil de sa part de nous offrir un cadeau de mariageⓠ\n@c0@"
  it: "@aNera@bBeh, è un po' in ritardo, ma il suo regalo di nozze è comunque ben accetto!\nGrazie!\n@c0@"
  ja: "@a@bフローラ「うれしいですわね。\n\tこうして　祝っていただけると。\n@c0@"
115:
  de: "@a%0%a001240@bWas hast du gekriegt? Einen Magiesamen? Nicht schlecht!\n@c0@"
  en: "@a%0%a001240@bWhat did you get? A seed of magic? Nice!\n@c0@"
  es: "@a%0%a001240@b¿Qué has conseguido? ¿Una simiente de magia? ¡Genial!\n@c0@"
  fr: "@a%0%a001240@bQu'est-ce que tu as euⓡ Une graine de Magieⓡ Génialⓠ\n@c0@"
  it: "@a%0%a001240@bChe cosa ti ha dato?\nUn seme della magia?\nOh, che bello!\n@c0@"
  ja: "@a@b%a001240「なに　もらったの？\n\t不思議な木の実？　いいなあ～！\n@c0@"
116:
  de: "@aNera@bEs muss ziemlich schwer sein zu lernen, wie man eine Herberge führt.\n@c0@"
  en: "@aNera@bIf he's training to run an inn, it must be jolly\r\nhard work.\n@c0@"
  es: "@aNera@bSi se está preparando para llevar una posada, debe ser un lavoro duro.\n@c0@"
  fr: "@aNera@bS'il apprend à tenir une auberge, ça doit être\r\ntrès difficile.\n@c0@"
  it: "@aNera@bEh, sì... Portare avanti una locanda non è certo roba da poco! Quel poverino dev'essere pieno di lavoro fino al collo!\n@c0@"
  ja: "@a@bフローラ「宿屋さんの　お勉強ですか……。\n\tきっと　大変なんでしょうね。\n@c0@"
117:
  de: "@a%0%a001240@bIch bin auch nicht sehr gut im Lernen. %0%a001250 kann sich Sachen immer viel schneller merken als ich.\n@c0@"
  en: "@a%0%a001240@bI'm not very good at learning things either. %0%a001250 always picks things up faster than I do.\n@c0@"
  es: "@a%0%a001240@bNo se me da muy bien aprender cosas. %0%a001250 siempre lo entiende todo antes que yo.\n@c0@"
  fr: "@a%0%a001240@bMoi non plus, je ne suis pas très bon quand il s'agit d'apprendre. %0%a001250 comprend toujours tout bien plus vite que moi.\n@c0@"
  it: "@a%0%a001240@bUh!\nNon ho capito bene cos'ha detto...\nChi si è tagliato? Si è fatto molto male?\n@c0@"
  ja: "@a@b%a001240「ボクも　おぼえるのは\n\tあんまり……。\n\t%a001250は　得意なんだけど。\n@c0@"
118:
  de: "@aOtto@bDas Gefühl kenn' ich! Oh, das Gefühl kenn' ich nur allzu gut!\n@c0@"
  en: "@aTuppence@bI know that feeling! Oh, I know that feeling so well.\n@c0@"
  es: "@aAlazar@b¡Conozco esa sensación! ¡Ya lo creo que la conozco!\n@c0@"
  fr: "@aInnocent@bJe connais ce sentimentⓠ Oh que ouiⓠ\n@c0@"
  it: "@aSimon@bMi piacerebbe governare un regno ricco e fiorente!\r\nChissà che un giorno i sudditi di Denim non si stufino dell'attuale re e decidano di dare a me la corona...\n@c0@"
  ja: "@a@bピピン「わかる！　わかるぞ！\n\tあいつの気持ち……。\n@c0@"
119:
  de: "@aOtto@bEr und ich können uns wahrscheinlich stundenlang unser Leid klagen, wenn wir erst mal anfangen. Ich weiß ganz genau, wie ihm zumute ist.\n@c0@"
  en: "@aTuppence@bHe and I could probably bend each other's ears all night long if we had the chance. Yes, I certainly know how he feels.\n@c0@"
  es: "@aAlazar@bÉl y yo podríamos pasar la noche contándonos nuestras penas. Sí, sé perfectamente lo que siente.\n@c0@"
  fr: "@aInnocent@bOn pourrait sans doute en discuter toute la nuit,\r\nlui et moi, si on en avait l'occasion. Oui, vraiment,\r\nje sais très bien ce qu'il ressent.\n@c0@"
  it: "@aSimon@bOps!\nMaestà, facevo per scherzare, eh!\nEhm...\n@c0@"
  ja: "@a@bピピン「いつか　ヤツとは\n\t朝まで　語りあかしたいですよ。\n\tうーん。　わかるなあっ。\n@c0@"
120:
  de: "@aBianca@bDie Zeit, in der ich fort war, ist an meinem Vater nicht spurlos vorbeigegangen.\n@c0@"
  en: "@aBianca@bDad seems to have aged a bit while I've bin away.\n@c0@"
  es: "@aBianca@bParece que papá ha envejecido un poco en este tiempo.\n@c0@"
  fr: "@aBianca@bOn dirait que papa a pris un petit coup de vieux pendant que je n'étais pas là.\n@c0@"
  it: "@aBianca@bMi è sembrato che mio padre sia un po' stanco...\nDev'essere l'età.\nEh, il tempo passa, caro il mio %a000090!\n@c0@"
  ja: "@a@bビアンカ「お父さん　しばらく\n\t見ないうちに　また　ちょっと\n\t老けこんじゃったみたい……。\n@c0@"
121:
  de: "@aBianca@bHoffentlich haben wir bald alles erledigt, damit ich mich besser um ihn kümmern kann.\n@c0@"
  en: "@aBianca@bHopefully we'll be able to finish everythin' off before long so that I can take better care of him.\n@c0@"
  es: "@aBianca@bCon suerte, terminaremos con esto en seguida y podré prestarle más atención, ¿sabes?\n@c0@"
  fr: "@aBianca@bJ'espère que nous pourrons terminer ce que nous avons à faire assez vite afin que je puisse mieux m'occuper de lui.\n@c0@"
  it: "@aBianca@bSpero che il nostro viaggio finisca presto, così potrò prendermi cura di lui...\n@c0@"
  ja: "@a@bビアンカ「はやく　いろいろ片付けて\n\t私も　親孝行がしたいわ……。\n@c0@"
122:
  de: "@a%0%a001240@bEr ist Mamas Vater. Also ist er mein Großvater, stimmt's?\n@c0@"
  en: "@a%0%a001240@bHe's Mum's dad. That makes him my grandad, right?\n@c0@"
  es: "@a%0%a001240@bEs el padre de mamá. Por lo tanto, es mi abuelo, ¿verdad?\n@c0@"
  fr: "@a%0%a001240@bC'est le papa de maman. Donc c'est mon grand-père, c'est bien çaⓡ\n@c0@"
  it: "@a%0%a001240@bPapà, il babbo della mamma è mio nonno, non è vero?\n@c0@"
  ja: "@a@b%a001240「お母さんのお父さんだから\n\tあの人も　ボクのおじいさまなんだね。\n@c0@"
123:
  de: "@a%0%a001240@bOpa Weißi... Er hat ein nettes lächelndes Gesicht.\n@c0@"
  en: "@a%0%a001240@bGrandpa Whitey... He's got a nice smiley face. \n@c0@"
  es: "@a%0%a001240@bAbuelo Doptada... Tiene una cara muy sonriente.\n@c0@"
  fr: "@a%0%a001240@bGrand-père Alba... Il a un visage très souriant.\n@c0@"
  it: "@a%0%a001240@bHai visto che sorriso allegro che ha?\nÈ proprio simpatico!\n@c0@"
  ja: "@a@b%a001240「ダンカンおじいさま　かあ……。\n\t笑顔が　やさしいね。\n@c0@"
124:
  de: "@a%0%a001250@bOpa ist bestimmt einsam, wenn wir unterwegs auf unseren Reisen sind. Wir sollten ihn öfter besuchen.\n@c0@"
  en: "@a%0%a001250@bGrandpa must be all lonely when we're off on our travels. We should pay him a visit more often.\n@c0@"
  es: "@a%0%a001250@bEl abuelo debe sentirse muy solo cuando estamos de viaje. Deberíamos visitarlo más.\n@c0@"
  fr: "@a%0%a001250@bGrand-père doit se sentir seul quand nous sommes en voyage. On devrait lui rendre visite plus souvent.\n@c0@"
  it: "@a%0%a001250@bPenso che il nonno soffra un po' di solitudine... Non sarebbe una cattiva idea se ogni tanto passassimo a salutarlo e a vedere se ha bisogno di qualcosa.\n@c0@"
  ja: "@a@b%a001250「おじいさま　わたしたちが\n\t旅してると　さみしいよね？\n\tまた　遊びに来ようね。\n@c0@"
125:
  de: "@aSancho@bSeñor Weißner, er sieht so viel älter aus als iss ihn in Erinnerung habe. Dein Onkel Sancho, er wird mal eine runzlige Haut wie ein Alligator haben, weißt du.\n@c0@"
  en: "@aSancho@bSeñor Whitaker, he ees eso much older than I remember. Sí, your Uncle Sancho, he gonna have the wrinkly eskin of the alligator too, you know.\n@c0@"
  es: "@aSancho@bEl señor Doptada está mucho más viejito de lo que recordaba. Sí, a tu tito Sancho también se le pondrá la piel como una pasa, chamaco.\n@c0@"
  fr: "@aSancho@bLe señor Alba est b-bien plus vieux que dans mon\r\ns-souvenir. Tonton Sancho lui aussi finira par avoir oune peau ridée de crocodile, si, si.\n@c0@"
  it: "@aSancho@bEl señor Whitblanche es muy invecchiato, chico.\nEsperiamo que la dea lo conservi ancoras a lungo y en buena salud...\n@c0@"
  ja: "@a@bサンチョ「ダンカンさんも\n\tすっかり　老け込んで……。\n\t私も　年を取るはずですね。\n@c0@"
126:
  de: "@aNera@bAlle scheinen Bianca gern zu haben, nicht?\n@c0@"
  en: "@aNera@bEverybody seems to love Bianca, don't they?\n@c0@"
  es: "@aNera@bSembra que tutti quieren a Bianca, ¿vero?\n@c0@"
  fr: "@aNera@bOn dirait que tout le monde apprécie Bianca, heinⓡ\n@c0@"
  it: "@aNera@bSembra che tutti vogliano bene a Bianca, eh?\n@c0@"
  ja: "@a@bフローラ「ビアンカさんって\n\t誰にでも　好かれますものね。\n@c0@"
127:
  de: "@aNera@bHe he. Du siehst etwas besorgt aus, Liebling. Bianca geht dir wirklich nicht aus dem Kopf, nicht?\n@c0@"
  en: "@aNera@bHe he. You look a bit worried, darling. Bianca really plays on your mind, doesn't she?\n@c0@"
  es: "@aNera@bJi, ji. Se te ve preocupado, caro mio. Bianca es especial per te, ¿no?\n@c0@"
  fr: "@aNera@bHi hi. Tu as l'air un peu inquiet, mon chéri.\nTu penses beaucoup à elle, n'est-ce pasⓡ\n@c0@"
  it: "@aNera@bQuindi, lei riceve già affetto a sufficienza!\nNon è necessario che anche tu gliene dimostri!\nMi sono spiegata, tesoro?!\n@c0@"
  ja: "@a@bフローラ「うふふ。　あなた\n\t心配そうな顔　なさってますわ。\n\tビアンカさんが　気になりますわね。\n@c0@"
128:
  de: "@a%0%a001240@bEr lernt also, wie man das Geschäft leitet? Dabei muss man sich doch bestimmt jede Menge Zeugs merken!\n@c0@"
  en: "@a%0%a001240@bSo he's learning how to run the place? There must be loads of things he has to remember for that!\n@c0@"
  es: "@a%0%a001240@b¿Que está aprendiendo a llevar el negocio? ¡Debe haber montones de cosas que recordar!\n@c0@"
  fr: "@a%0%a001240@bAlors il apprend à diriger cet endroitⓡ Il doit sûrement y avoir plein de choses à retenirⓠ\n@c0@"
  it: "@a%0%a001240@bA me non sembra che gestire una locanda sia particolarmente difficile...\n㈡\nCerto è molto meno faticoso che viaggiare da un posto all'altro senza sosta, affrontando una miriade di mostri! Non so se mi spiego...\n@c0@"
  ja: "@a@b%a001240「修行って　お勉強でしょ？\n\t……お勉強かあ。\n@c0@"
129:
  de: "@aNera@bDas also ist Biancas Vater. Er wirkt ziemlich erschöpft.\n@c0@"
  en: "@aNera@bSo that's Bianca's father. He seems rather\r\nrun-down.\n@c0@"
  es: "@aNera@bAsí que ese es el papino de Bianca. Está un poco estropeado.\n@c0@"
  fr: "@aNera@bAlors c'est le père de Bianca. Il a l'air plutôt fatigué.\n@c0@"
  it: "@aNera@bAllora quell'uomo è il padre di Bianca, eh?\n@c0@"
  ja: "@a@bフローラ「ビアンカさんの　お父さま…\n\tずいぶん　つかれたご様子ですわね。\n@c0@"
130:
  de: "@aNera@bHoffentlich können wir dafür sorgen, dass bald wieder Frieden einkehrt, dann kann er sich etwas entspannen.\n@c0@"
  en: "@aNera@bHopefully we'll bring peace to the world before long, and then he'll be able to relax more.\n@c0@"
  es: "@aNera@bConfío en que traigamos pronto la paz al mundo y pueda descansar più.\n@c0@"
  fr: "@aNera@bEspérons que nous ramènerons vite la paix dans le monde et qu'il pourra se détendre davantage.\n@c0@"
  it: "@aNera@bNon mi sembra che se la passi tanto bene, sai?\nChissà, forse qualche pensiero lo preoccupa...\n@c0@"
  ja: "@a@bフローラ「はやく　平和を　とりもどして\n\tのんびりと暮らしていただきましょう？\n@c0@"
