  de: "@aPlotz@bBruder! Was ist denn mit der anderen Statue? Willst du die nicht verkaufen?\n@c0@"
  en: "@aHuckster@bEh, bruv! Wot about that other statue? Ain't you sellin' that one, an' all?\n@c0@"
  es: "@aChema@b¡Eh, hermano! ¿Y la otra estatua? ¿Esa no la vendes?\n@c0@"
