  ja: "@a@b兄「おっと　きたぜ！\n\t１２０００　１２０００！\n\tほかに　ないかっ？\n@c0@"
8:
  de: "@a@b*: Fünfzehntausend!\n@c0@"
  en: "@a@b*: Fifteen thousand!\n@c0@"
  es: "@a@b*: ¡Quince mil!\n@c0@"
  fr: "@a@b*ⓢ Quinze milleⓠ\n@c0@"
  it: "@a@b*: Quindicimila!\n@c0@"
  ja: "@a@b＊「１５０００　じゃ！\n@c0@"
