  it: "@a@b*: Il primo era Zenithia, il regno sacro.\nPoi c'era il regno terreno, abitato dagli esseri umani.\n㈡\n*: Infine Nadiria, il Regno degli Inferi, dove ella confinò i demoni.\n@c0@"
  ja: "@a@b＊「しかし　２人の子　%a000090には\n\tなんの罪も　ありませんものね。\n@c0@"
526:
  de: "@a@b*: Einigen Wesen trug Sie auf, als Torwächter zu fungieren, auf dass niemand die Grenzen zwischen diesen Reichen ungehindert passieren möge.\n@c0@"
  en: "@a@b*: And She tasked some to be gatekeepers, to prevent free passage between these realms.\n@c0@"
  es: "@a@b*: Después encargó a algunos guardianes que impidieran el libre paso entre los reinos.\n@c0@"
  fr: "@a@b*ⓢ Elle confia ensuite à quelques-uns la tâche de gardiens, afin d'empêcher le passage d'un\nroyaume à l'autre.\n@c0@"
  it: "@a@b*: Successivamente, la dea pose dei guardiani ai varchi dei regni, per impedire che le creature attraversassero gli accessi liberamente.\n@c0@"
  ja: "@a@b＊「今こそ　すべてを\n\t教えましょう。\n@c0@"
527:
  de: "@a@b*: Diese Wesen sind wir. Das Volk von Steile Höh.\n@c0@"
  en: "@a@b*: We are those people.\nThe people of Lofty Peak.\n@c0@"
  es: "@a@b*: Nosotros somos esa gente.\r\nEl pueblo de Cumbre Excelsa.\n@c0@"
  fr: "@a@b*ⓢ Nous, habitants de Haute-Cime, sommes ces gardiens.\n@c0@"
  it: "@a@b*: Noi, popolo di Picco Maximo, siamo quei guardiani, e Maddalena è stata l'ultima detentrice del potere di aprire e chiudere il varco per Nadiria.\n@c0@"
  ja: "@a@b＊「太古の昔　神は　この世界を\n\t３つに　わけたのです。\n@c0@"
528:
  de: "@a@b*: Die alte Macht war bei Eurer Mutter sehr ausgeprägt. Magdalena war etwas ganz Besonderes.\n@c0@"
  en: "@a@b*: The ancient power was strong in your mother. Madalena was very special.\n@c0@"
  es: "@a@b*: El antiguo poder era fuerte en tu madre. Perséfone era muy especial.\n@c0@"
  fr: "@a@b*ⓢ Ce pouvoir ancestral était très puissant en votre mère. Magdalena était très spéciale.\n@c0@"
  it: "@a@b*: L'antico potere era molto forte in tua madre.\nMaddalena era una persona speciale.\n@c0@"
  ja: "@a@b＊「神自身が住む　天空界\n\t人間たちが住む　この世界\n\t魔物らを封じた　暗黒世界。\n@c0@"
529:
  de: "@a@b*: Wir glauben, dass die Monster sie entführten, um die Tore zur Unterwelt Nadiria zu öffnen.\n@c0@"
  en: "@a@b*: We believe the monsters took her in order to open the gates to the underworld, Nadiria.\n@c0@"
  es: "@a@b*: Creemos que los monstruos se la llevaron para abrir las puertas del inframundo, Nadiria.\n@c0@"
  fr: "@a@b*ⓢ Nous pensons que les monstres l'ont enlevée pour qu'elle ouvre les portes menant au monde souterrain de Nadiria.\n@c0@"
  it: "@a@b*: Riteniamo che i mostri l'abbiano rapita per farle aprire il varco che conduce a Nadiria, il Regno degli Inferi.\n@c0@"
  ja: "@a@b＊「そして　その３つの世界が\n\tたがいに　交わることのないよう\n\t門番を　もうけました。\n@c0@"
530:
  de: "@a@b*: Es heißt, dass wir, das Volk aus Steile Höh, einst die Macht besaßen, die Tore zwischen dieser Welt und Nadiria öffnen und schließen zu können.\n@c0@"
  en: "@a@b*: It is said that we of Lofty Peak were once bestowed with the power to open and close\r\nthe gates between here and Nadiria.\n@c0@"
  es: "@a@b*: Se dice que los de Cumbre Excelsa tuvimos antaño el poder de abrir y cerrar las puertas entre Nadiria y este mundo.\n@c0@"
  fr: "@a@b*ⓢ On dit que nous, habitants de Haute-Cime, avons autrefois reçu le pouvoir d'ouvrir et de fermer les portes qui séparent ce monde de celui de Nadiria.\n@c0@"
  it: "@a@b*: Un tempo, noi abitanti di Picco Maximo eravamo dotati del potere di aprire e chiudere il varco tra il nostro mondo e Nadiria, il Regno degli Inferi.\n@c0@"
  ja: "@a@b＊「その門番を　命じられたのが\n\tわれら　エルヘブンの民なのです。\n@c0@"
531:
  de: "@a@b*: Doch mit der Zeit ist diese Macht verloren gegangen.\n@c0@"
  en: "@a@b*: But over time, our people have lost this power.\n@c0@"
  es: "@a@b*: Pero, con el tiempo, perdimos esta capacidad.\n@c0@"
  fr: "@a@b*ⓢ Mais avec le temps, notre peuple a perdu ce pouvoir.\n@c0@"
  it: "@a@b*: Oggi, però, abbiamo perso completamente questa capacità.\n@c0@"
  ja: "@a@b＊「%a000090の母上　マーサさまは\n\t我が民の　太古の能力を\n\tとくに強く　宿しておられました。\n@c0@"
532:
  de: "@a@b*: Selbst das Tor des Tümpeltempels, der sich an der Wasserstraße nördlich von hier befindet, können wir nicht mehr öffnen.\n@c0@"
  en: "@a@b*: No longer can we open the gates even of\r\nthe Estuary Sanctuary in the watery corridor\r\nnorth of here.\n@c0@"
  es: "@a@b*: Ya no podemos siquiera abrir las puertas del Santuario Estuario en el canal, al norte de aquí.\n@c0@"
  fr: "@a@b*ⓢ Nous ne pouvons même plus ouvrir les portes du Sanctuaire de l'estuaire, situé dans le corridor inondé, au nord d'ici.\n@c0@"
  it: "@a@b*: Non possiamo più aprire nemmeno i cancelli del Tempio dell'Estuario, che si trova nel canale a nord.\n@c0@"
  ja: "@a@b＊「魔物らが　マーサさまを\n\tさらったのは　暗黒世界の門を\n\t開かせるためでしょう。\n@c0@"
533:
  de: "@a@b*: Ich spüre es.\n@c0@"
  en: "@a@b*: I feel it.\n@c0@"
  es: "@a@b*: Puedo sentirlo.\n@c0@"
  fr: "@a@b*ⓢ Je le sens.\n@c0@"
  it: "@a@b*: Lo percepisco chiaramente.\n@c0@"
  ja: "@a@b＊「我々　エルヘブンの民は　門を\n\t閉めることも　そして　開くことも\n\tできたと　言われています。\n@c0@"
534:
  de: "@a@b*: Mit jedem weiteren Jahr öffnen sich die Tore ein wenig mehr.\n@c0@"
  en: "@a@b*: The gates open more with each passing year.\n@c0@"
  es: "@a@b*: Las puertas se abren un poco más con cada año que pasa.\n@c0@"
  fr: "@a@b*ⓢ Les portes s'entrouvrent un peu plus chaque année.\n@c0@"
  it: "@a@b*: Il varco si apre sempre di più ogni anno che passa...\n@c0@"
  ja: "@a@b＊「しかし　時がたつに　つれて\n\tその能力は　しだいに\n\t失われていったのです。\n@c0@"
535:
  de: "@a@b*: Wenn das so weitergeht, wird selbst der Großmeister der Unterwelt, diese gewaltige Gestalt des Bösen, in unsere Welt überwechseln können.\n@c0@"
  en: "@a@b*: If it continues so, even the colossal evil of the Grandmaster of the Underworld himself will manage to transcend into our world.\n@c0@"
  es: "@a@b*: Si esto continúa, la colosal maldad del mismísimo Gran Maestro del Inframundo logrará trascender hasta nuestro reino.\n@c0@"
  fr: "@a@b*ⓢ Si cela continue ainsi, le mal colossal du Grand Maître des Enfers lui-même réussira à passer dans notre monde.\n@c0@"
  it: "@a@b*: Di questo passo, ben presto l'infinita malvagità del Gran Maestro degli Inferi invaderà il nostro mondo.\n@c0@"
  ja: "@a@b＊「今では　この北の水路に浮かぶ\n\t海の神殿の門も　我々には\n\t開くことができません。\n@c0@"
536:
  ja: "@a@b＊「私は　感じることが　できます。\n@c0@"
537:
  ja: "@a@b＊「開かれた門は　年ごとに\n\tその開け口を　大きくしています。\n@c0@"
538:
  ja: "@a@b＊「このままでは　やがて\n\t巨大な魔界の王ですら\n\tこちらに　やって来るでしょう。\n@c0@"
