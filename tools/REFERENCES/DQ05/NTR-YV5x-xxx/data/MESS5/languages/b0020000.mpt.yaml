  de: "@aHerr Schicki@bIch wollte sie als Glückbringer in den Garten stellen. Sie würde uns stets an die Geburt des kleinen Mickis erinnern.\n@c0@"
  en: "@aMr Porgie@bI thought it might be a nice good luck charm to put in the garden to commemorate little Georgie's birth.\n@c0@"
  es: "@aSr. Pirulero@b¿No sé, no? Se me ocurrió que podría ser un amuleto de buena suerte para conmemorar el nacimiento de Antón. La podemos poner en el jardín.\n@c0@"
