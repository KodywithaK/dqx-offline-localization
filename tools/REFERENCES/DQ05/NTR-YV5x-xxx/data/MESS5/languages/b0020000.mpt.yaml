  en: "@aTuppence@bIt's a chess set. Apparently all the soldiers in the castle were completely hooked on it once.\n@c0@"
  es: "@aAlazar@bEs una especie de ajedrez. Parece que todos los guardias estaban enganchados a él.\n@c0@"
  fr: "@aInnocent@bC'est un jeu d'échecs. Apparemment, tous les soldats du château en étaient complètement fous, autrefois.\n@c0@"
  it: "@aSimon@bÈ una scacchiera.\nAnni fa, ci fu un periodo in cui nessun soldato del Regno riusciva a fare a meno di giocare a scacchi!\n@c0@"
  ja: "@a@bピピン「かつて　父をはじめ　兵士たち\n\tみんなが夢中になった　チェスの\n\tコマだそうです。\n@c0@"
213:
  de: "@aOtto@bIrgendein Kanzler hat es eingeführt. Und die Figuren hat ein hiesiger Handwerker geschnitzt. Er war anscheinend sehr berühmt.\n@c0@"
  en: "@aTuppence@bA former chancellor introduced it, I think.\r\nThe pieces were made by a castle craftsman.\r\nHe was a bit of a legend, I hear.\n@c0@"
  es: "@aAlazar@bCreo que lo introdujo un antiguo canciller.\r\nLas piezas las hizo un artesano del castillo.\r\nHe oído que era una leyenda.\n@c0@"
  fr: "@aInnocent@bJe crois que c'est un ancien chancelier qui l'avait introduit.\n㈡\nLes pièces avaient été réalisées par un artisan du château. Une vraie légende, apparemment.\n@c0@"
  it: "@aSimon@bFu un Ministro a donare la scacchiera ai soldati.\nI pezzi erano stati realizzati da un abilissimo artigiano, se non ricordo male.\n@c0@"
  ja: "@a@bピピン「なんでも　お城の名工の細工に\n\tよるもので　昔の大臣が\n\t持ち込んだとか。\n@c0@"
214:
  de: "@aOtto@bDoch laut Testament meines Vaters ist das Spiel gefährlich. Es macht die Leute träge und faul. Da dachte ich...\n@c0@"
  en: "@aTuppence@bBut according to my father's last will and testament, the game's infectious. It makes people bone idle.\r\nSo I've been thinking...\n@c0@"
  es: "@aAlazar@bPero según el testamento de mi padre, el juego es infeccioso. Vuelve a la gente indolente.\r\nY he estado pensando...\n@c0@"
  fr: "@aInnocent@bMais d'après les dernières volontés de mon père et les notes laissées dans son testament, ce jeu est néfaste. Il rend les gens fainéants.\n㈡\nAlors j'ai réfléchi...\n@c0@"
  it: "@aSimon@bLeggendo le ultime volontà di mio padre, ho scoperto che questa scacchiera è maledetta. Una volta che si inizia a giocare, non si riesce a smettere.\n㈡\nMio padre mi raccontava che i soldati trascuravano i propri doveri, pur di non staccarsi dagli scacchi!\n@c0@"
  ja: "@a@bピピン「父の遺言によると　このコマは\n\t遊ぶ者の心を　だらくさせるとか。\n@c0@"
215:
  de: "@aOtto@bVielleicht nehmt Ihr es, dann besteht nicht mehr die Gefahr, dass hier Müßiggang herrscht. Und, was sagt Ihr?\n@c0@"
  en: "@aTuppence@bPerhaps you ought to take it so there's no danger of any slacking off again in the future.\r\nWhat do you say?\n@c0@"
  es: "@aAlazar@bQuizá %O0960%Xdeberíais quedároslo%Ydeberías quedártelo%Z para que no haya peligro de que alguien lo use en el futuro.\n¿Qué %O0960%Xdecís%Yme dices%Z?\n@c0@"
  fr: "@aInnocent@bPeut-être devriez-vous l'emporter, afin d'écarter tout risque de relâchement à l'avenir.\n㈡\nPensez-vous que c'est une bonne idéeⓡ\n@c0@"
  it: "@aSimon@b%O0960%XMaestà, forse sarebbe meglio se la prendesse lei%YForse sarebbe meglio se la %H0860%Xprendessi tu%Yprendeste voi%Z%Z, così non rischieremo di trovarci nuovamente in quella situazione.\n㈡\n%O0960%XSire, accetta%Y%H0860%XAccetti%YAccettate%Z%Z il mio dono?\n@c0@"
  ja: "@a@bピピン「%a000090王！　これが　ふたたび\n\t兵士たちの目に　ふれないよう\n\t持ち出していただけませんか？\n@c0@"
216:
  de: "@aOtto@bAusgezeichnet! Dann gehört es Euch, Eure Majestät.\nMit meinen besten Empfehlungen.\n@c0@"
  en: "@aTuppence@bExcellent! Then it's yours, Your Majesty.\r\nWith my compliments.\n@c0@"
  es: "@aAlazar@b¡Excelente! Pues %O0960%Xvuestro es, Majestad%Ytuyo es%Z.\n¡Con mi más sincero agradecimiento!\n@c0@"
  fr: "@aInnocent@bParfaitⓠ Dans ce cas, il est à vous%O0960%X, Votre Majesté%Y%Z. Félicitations.\n@c0@"
  it: "@aSimon@bPerfetto!\n%O0960%XGrazie, Maestà! È tutta sua%YÈ tutta %H0860%Xtua%Yvostra%Z%Z!\n@c0@"
  ja: "@a@bピピン「ありがとうございます！\n\tでは　たしかに　お渡しします！\n@c0@"
