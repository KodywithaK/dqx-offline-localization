  de: "@aHotz@bDas macht dann zwanzigtausend Goldmünzen. Die Statue gehört nun Euch!\n@c0@"
  en: "@aHeister@bThat's twenty grand you've paid there then, me old friend. The statue's yours!\n@c0@"
  es: "@aChimo@bPues veinte mil del ala, amigo. ¡Paⓘ ti paⓘ siempre!\n@c0@"
  fr: "@aMontenlair@bC'est un super investissement qu'vous avez fait, l'ami. La statue est à vousⓠ\n@c0@"
  it: "@aRuberto@bPer sole ventimila monete lei si porta nella su' hasa un'opera d'arte come 'un ce n'è altre.\n@c0@"
  ja: "@a@b兄「たしかに　２００００ゴールド\n\t受けとったぜ。\n\tさあ　持っていってくんな！\n@c0@"
19:
  de: "@aHotz@bDanke für Eure Gebote, Leute. Wie heißt es doch so schön? Manchmal verliert man, manchmal gewinnt man. Bis bald!\n@c0@"
  en: "@aHeister@bThanks for biddin', folks. You win some, you lose some, eh? That's 'Uckster and 'Eister done wiv the auction lark for one day, any'ow.\n@c0@"
  es: "@aChimo@bGracias por pujar, amigos. Unas veces se gana, otras se pierde. Se acabó por hoy la subasta del Chimo y el Chema.\n@c0@"
  fr: "@aMontenlair@bMerci pour ces enchères, m'sieurs-dames.\nParfois on gagne, parfois non, c'est comme çaⓠ\nLes enchères sont finies pour aujourd'hui.\n@c0@"
  it: "@aRuberto@bSignore e signori, grazie di esse' stati huì per la nostra asta.\nCi si rivede, gente!\n@c0@"
  ja: "@a@b兄「みんな　ありがとうよ！\n\tオレたち　お宝兄弟の売り物は\n\tこれで　おしまいだ！\n@c0@"
