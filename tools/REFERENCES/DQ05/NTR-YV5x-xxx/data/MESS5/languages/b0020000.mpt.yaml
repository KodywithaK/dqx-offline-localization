27:
  de: "@aMicki@b(ga ga)\n@c0@"
  en: "@aGeorgie@bGoo goo!\n@c0@"
  es: "@aAntón@b(gu gu)\n@c0@"
  fr: "@aÉdouard@bAreuh areuh...\n@c0@"
  it: "@aLino@bGooo eh eh eh!\n@c0@"
  ja: "@a@bジージョ「バブバブ……。\n@c0@"
28:
  de: "@aFrau Schicki@bWas hast du denn da für eine Statue, Liebster?\n@c0@"
  en: "@aMrs Porgie@bWhat is that statue you have there, my dear?\n@c0@"
