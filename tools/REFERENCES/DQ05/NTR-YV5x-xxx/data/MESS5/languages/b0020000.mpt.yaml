  it: "@aMalandro@bOh, fratello! E l'altra scultura?!\n'Un la voi vende' quella?\n@c0@"
  ja: "@a@b弟「あれれ？　兄さん\n\tもう　ひとつの石像は\n\t売らなくて　よかったの？\n@c0@"
