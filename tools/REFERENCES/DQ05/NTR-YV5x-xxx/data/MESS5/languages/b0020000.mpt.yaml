  ja: "@a@bサンチョ「坊っちゃんの　今の姿を\n\tだんなさまにも　見せて\n\tあげたかったです……。\n@c0@"
293:
  de: "@a%0%a001240@bAber Papa! Du kannst mich doch nicht einfach so zurücklassen!\n@c0@"
  en: "@a%0%a001240@bHey, Dad! You can't just leave me behind!\n@c0@"
  es: "@a%0%a001240@b¡Eh, papá! ¡No puedes dejarme aquí!\n@c0@"
  fr: "@a%0%a001240@bHé, papaⓠ Tu ne peux pas partir sans moiⓠ\n@c0@"
  it: "@a%0%a001240@bEhi, papà!\nNon vorrai mica lasciarmi qui, vero?!\n@c0@"
  ja: "@a@b%a001240「あっ　お父さん！\n\tボクを　置いてゆくなんて\n\tひどいや！\n@c0@"
294:
  de: "@a%0%a001240@bSprich doch bitte mit Hilda, der Hortmutter, damit ich mit dir kommen kann.\n@c0@"
  en: "@a%0%a001240@bGo and speak to that party planner lady, Patty, so I can come along with you.\n@c0@"
  es: "@a%0%a001240@bVuelve y habla con Cone-Cone, la organizadora de grupos, para que pueda ir contigo.\n@c0@"
  fr: "@a%0%a001240@bVa parler à cette dame chef d'équipe, Tulipe, pour que je puisse t'accompagner.\n@c0@"
  it: "@a%0%a001240@bVai a parlare con la signorina che organizza il gruppo, e dille che vuoi che venga con te!\n@c0@"
  ja: "@a@b%a001240「すぐに\n\tルイーダさんに　言って\n\tボクも　連れて行ってよ！\n@c0@"
295:
  de: "@a%0%a001250@bWenn du es für das Richtige hältst, bleibe ich natürlich hier, Papa.\n@c0@"
  en: "@a%0%a001250@bIf you think it's for the best, Dad, I'll stay\nbehind here.\n@c0@"
  es: "@a%0%a001250@bSi crees que es lo mejor me quedaré aquí, papá.\n@c0@"
  fr: "@a%0%a001250@bSi tu penses que c'est mieux comme ça, papa, je resterai ici.\n@c0@"
  it: "@a%0%a001250@bPapà, resterò volentieri al castello, se pensi che sia la cosa migliore da fare...\n@c0@"
  ja: "@a@b%a001250「お父さんが　言うなら\n\tわたし　お留守番　してます。\n@c0@"
296:
  de: "@a%0%a001250@bObwohl ich ja immer noch gerne mit dir kommen würde.\n@c0@"
  en: "@a%0%a001250@bBut I'd really like to go with you if you don't mind.\n@c0@"
  es: "@a%0%a001250@bPero si no te importa, me encantaría ir contigo.\n@c0@"
  fr: "@a%0%a001250@bMais j'aimerais vraiment t'accompagner, si tu es d'accord.\n@c0@"
  it: "@a%0%a001250@bPerò mi piacerebbe tanto venire con te...\nAnzi, ⓕcontigoⓖ, come dice lo zio Sancho!\n@c0@"
  ja: "@a@b%a001250「でも　本当は　わたしも\n\t連れてって　ほしかったな。\n@c0@"
297:
  de: "@a@b*: Welch eine Erleichterung, mitten in der Wüste auf eine Oase zu stoßen, nicht wahr?\n@c0@"
  en: "@a@b*: It makes you breathe a huge sigh of relief finding this oasis in the middle of the desert, doesn't it?\n@c0@"
  es: "@a@b*: Encontrar este oasis en medio del desierto es todo un alivio, ¿verdad?\n@c0@"
  fr: "@a@b*ⓢ On pousse un grand soupir de soulagement lorsqu'on arrive à cette oasis en plein milieu du désert, heinⓡ\n@c0@"
  it: "@a@b*: Trovare un'oasi nel bel mezzo del deserto è un vero sollievo, non è così?\n@c0@"
  ja: "@a@b＊「つらい　砂漠の旅の中で\n\tこのような　オアシスを　見つけると\n\tホッと　しますなあ。\n@c0@"
298:
  de: "@a@b*: Doch lasst uns nun zum Geschäftlichen kommen!\n@c0@"
  en: "@a@b*: Right, so now the sighs are out of the way, let's get down to business!\n@c0@"
  es: "@a@b*: Y ahora que estamos aliviados, ¡manos a la obra!\n@c0@"
  fr: "@a@b*ⓢ Bon, mais assez soupiré, il faut se mettre au travail, maintenantⓠ\n@c0@"
  it: "@a@b*: Bene!\nE ora vediamo se mi riesce di combinare qualche buon affare...\n@c0@"
  ja: "@a@b＊「さてと　ひと息ついたところで\n\t商売をさせて　もらいましょうか。\n@c0@"
299:
  de: "@a@b*: Meine Schwester ist endlich zurück. Es kommt mir vor, als wäre sie eine Ewigkeit fort gewesen.\n@c0@"
  en: "@a@b*: My sister's finally come back. It seems like she was away for an eternity.\n@c0@"
  es: "@a@b*: Por fin ha vuelto mi hermana, sí. Pariece que hubiera estiado fuera una etiernidad.\n@c0@"
  fr: "@a@b*ⓢ Ma sœur est enfin revenue. J'ai l'impression que cela faisait une éternité qu'elle était partie.\n@c0@"
  it: "@a@b*: Che gioia!\nMia sorella è finalmente tornata a casa!\nMi sembra che sia stata via per una vita...\n@c0@"
  ja: "@a@b■道具屋チャートへ\n@c0@"
300:
  de: "@a@b*: Sie sagte, in einem Badeort, den sie besucht hatte, habe jemand über eine Wüstenrose gesprochen, und da habe sie plötzlich Heimweh bekommen!\n@c0@"
  en: "@a@b*: She said she heard someone talking about a desert rose in a spa town she visited and it made her feel homesick!\n@c0@"
  es: "@a@b*: Dice que oyó a alguien habliar de una rosa del diesierto en una ciudad balneario que visitó, y que sintió nostalgia del hogar, sí.\n@c0@"
  fr: "@a@b*ⓢ Elle a dit qu'elle avait entendu quelqu'un parler d'une rose des sables dans une ville thermale qu'elle a visitée et que ça lui avait donné le mal du paysⓠ\n@c0@"
  it: "@a@b*: Mi ha detto che le è venuta nostalgia del suo villaggio natale quando qualcuno, in una cittadina termale, le ha parlato delle rose del deserto...\n@c0@"
  ja: "@a@b＊「ずっと　家を出てた\n\tボクの　姉ちゃんが\n\t帰って来たんだ。\n@c0@"
301:
  de: "@a@b*: Sind wir uns schon einmal begegnet? Mein Name ist Nofretutti.\n@c0@"
  en: "@a@b*: Have we met somewhere before?\nI'm Cleo.\n@c0@"
  es: "@a@b*: ¿No nos conociemos de algo?\r\nSoy Nefertita.\n@c0@"
  fr: "@a@b*ⓢ On ne se serait pas déjà %A0110%Xrencontrés%Z%B0110%Xrencontrées%Zⓡ\nJe suis Néferlili.\n@c0@"
  it: "@a@b*: Uhm... Ho l'impressione che ci siamo già incontrati da qualche parte...\nIo sono Nefertitty.\n@c0@"
  ja: "@a@b＊「なんでも　遊びに行った温泉で\n\t砂漠のバラの　うわさを聞いて\n\tなつかしくなったんだってさ。\n@c0@"
302:
  de: "@aNofretutti@bMeine Jugend ist längst verblasst, und so beschloss ich, in meine Heimat zurückzukehren, bevor es Zeit wird, mich zu mumifizieren.\n@c0@"
  en: "@aCleo@bYouth is a fading memory for me now. I decided to return to the place I belong before it's time to mummify me.\n@c0@"
  es: "@aNefertita@bLa juventud es ya para mí un riecuerdo lejano, sí. Diecidí volver a mi hogar antes de que llegara la hora de miomificarme.\n@c0@"
  fr: "@aNéferlili@bLa jeunesse est pour moi un lointain souvenir, désormais. J'ai décidé de rentrer chez moi avant que l'heure soit venue pour moi d'être momifiée.\n@c0@"
  it: "@aNefertitty@bOra che non sono più tanto giovane, ho deciso di tornare al mio villaggio. Voglio trascorrere il resto della vita nel luogo dove sono nata.\n@c0@"
  ja: "@a@b＊「あら？　どこかで\n\tお会いしましたっけ？\n\t私の名は　クラリス。\n@c0@"
303:
  de: "@aNofretutti@bObwohl das Leben in der Wüste schwer ist, liegt viel Schönes in ihr verborgen.\n@c0@"
  en: "@aCleo@bThough life in the desert is hard, there is much beauty here.\n@c0@"
  es: "@aNefertita@bAunque la vida en el diesierto es dura, aquí hay mucha bielleza.\n@c0@"
  fr: "@aNéferlili@bMême si la vie est rude dans le désert, c'est un endroit plein de beauté.\n@c0@"
  it: "@aNefertitty@bQuesto luogo apparentemente arido in realtà nasconde molte bellezze...\n@c0@"
  ja: "@a@bクラリス「もう　私も　若くないし\n\tこれからは　故郷で暮らそうと\n\t思って　帰って来たんです。\n@c0@"
304:
  de: "@aNofretutti@bWas könnte es Eindrucksvolleres geben als die Morgenröte über der Wüste? Das erinnert mich immer an die Zeit, als ich noch tanzte.\n@c0@"
  en: "@aCleo@bFor me, nothing is more evocative than dawn over the desert. It reminds me of my dancing days.\n@c0@"
  es: "@aNefertita@bNo coniozco nada más evocador que un amaniecer en el diesierto. Mi riecuerda a mis días de bailiarina, sí.\n@c0@"
  fr: "@aNéferlili@bPour moi, rien n'est plus saisissant que le soleil qui se lève sur le désert. Ça me rappelle l'époque où j'étais danseuse.\n@c0@"
  it: "@aNefertitty@bPer me, l'alba nel deserto è uno degli spettacoli più meravigliosi della natura.\n㈡\nMi ricorda il periodo in cui ero una famosa ballerina, all'alba del mio splendore. Ora, invece, la mia bellezza volge inesorabilmente al tramonto...\n@c0@"
  ja: "@a@bクラリス「砂漠の生活は　きびしいけど\n\t美しいものも　たくさんあるんです。\n@c0@"
305:
  de: "@a@b*: Die Leute sagen, dass der legendäre Held bald zurückkehren und hierher nach Helmunaptra kommen wird.\n@c0@"
  en: "@a@b*: People are saying the time is near when the legendary hero will return and come here to Helmunaptra.\n@c0@"
  es: "@a@b*: Se dice que se acerca la hora en que el héroe legendario regresará y vendrá a Ayelmandría.\n@c0@"
  fr: "@a@b*ⓢ Les gens racontent que le héros légendaire reviendra bientôt ici, à Helmunaptra.\n@c0@"
  it: "@a@b*: Molti ritengono che tra non molto l'Eroe Leggendario tornerà qui a Faraonia.\n@c0@"
  ja: "@a@bクラリス「私は　夜明けの砂漠が好き。\n\tいつも　心に　思い浮かべながら\n\tステージで踊ったものですわ。\n@c0@"
306:
  de: "@a@b*: Ich bin ein fahrender Musikant, habe aber beschlossen, eine Weile hier zu bleiben.\n@c0@"
  en: "@a@b*: I'm a travelling minstrel, but I've decided to stay here for a while.\n@c0@"
  es: "@a@b*: Soy un juglar errante, pero he decidido quedarme un tiempo aquí.\n@c0@"
  fr: "@a@b*ⓢ Je suis un troubadour itinérant, mais j'ai décidé de m'arrêter quelque temps ici.\n@c0@"
  it: "@a@b*: Sono un poeta errante, quindi non mi trattengo mai in un luogo più di qualche giorno, ma stavolta potrei fare un'eccezione.\n@c0@"
  ja: "@a@b＊「伝説の勇者さまが　現れ\n\tこの城へ　やって来る日が\n\t近いという　ウワサです。\n@c0@"
307:
  de: "@a@b*: Es war schon immer mein Traum, den legendären Helden zu treffen und vor ihm aufzutreten.\n@c0@"
  en: "@a@b*: It's always been my dream to meet the legendary hero and perform for him.\n@c0@"
  es: "@a@b*: Siempre he soñado con conocer al héroe legendario y tocar para él.\n@c0@"
  fr: "@a@b*ⓢ J'ai toujours rêvé de rencontrer le héros légendaire et de déclamer pour lui.\n@c0@"
  it: "@a@b*: %H0860%XVedi%YVedete%Z, fin da piccolo ho sognato di incontrare l'Eroe Leggendario e di fargli ascoltare le mie opere, e questa per me è un'occasione unica!\n@c0@"
  ja: "@a@b＊「私は　旅の　ぎんゆう詩人ですが\n\tしばらく　旅は　お休みです。\n@c0@"
308:
  de: "@a@b*: Habt Ihr schon von diesen Wüstenrosendingern gehört?\n@c0@"
  en: "@a@b*: Have you heard of these desert rose things?\n@c0@"
  es: "@a@b*: ¿%H0860%XHas%YHabéis%Z oído hablar de esas rosas del desierto?\n@c0@"
  fr: "@a@b*ⓢ Avez-vous entendu parler des roses des sablesⓡ\n@c0@"
  it: "@a@b*: %H0860%XHai%YAvete%Z già sentito parlare delle rose del deserto?\n@c0@"
  ja: "@a@b＊「勇者さまに　お会いして\n\t勇者さまのために　歌うのが\n\t私の夢　なのです。\n@c0@"
309:
  de: "@a@b*: Darum bin ich hier, ich möchte auch eine finden. Leider habe ich meinen Hut vergessen, und tagsüber ist es viel zu heiß zum Suchen.\n@c0@"
  en: "@a@b*: That's why I'm here. I came looking for one. The only trouble is, I forgot my hat, and it's far too hot during the day to go exploring without a hat.\n@c0@"
  es: "@a@b*: Por eso estoy aquí. He venido a buscar una.\r\nLo que pasa es que me olvidé el sombrero, y de día hace demasiado calor para salir a explorar sin él.\n@c0@"
  fr: "@a@b*ⓢ C'est pour ça que je suis venu... pour en trouver une.\n㈡\n*ⓢ Le problème, c'est que j'ai oublié mon chapeau et qu'il fait trop chaud pour se promener tête nue.\n@c0@"
  it: "@a@b*: Ero venuto qui per procurarmene una, ma ho dimenticato il cappello. Non posso certo andarmene in giro a capo scoperto con questa temperatura, eh!\n@c0@"
  ja: "@a@b＊「さばくのバラって　知ってるかい？\n@c0@"
310:
  de: "@a@b*: Warum bin ich nur immer so schusselig?\n@c0@"
  en: "@a@b*: Aaah... Will I never ever learn?\n@c0@"
  es: "@a@b*: Aaah... Nunca aprenderé.\n@c0@"
  fr: "@a@b*ⓢ Aaaah... Je suis incorrigible.\n@c0@"
  it: "@a@b*: Aaah... Accidenti alla mia distrazione!\nE ora come faccio?!\n@c0@"
  ja: "@a@b＊「ボクも　それを取りに来たんだけど\n\t昼間は　日差しが強いのに\n\tぼうしを　忘れてきちゃったよ。\n@c0@"
311:
  de: "@a@b*: Eigentlich sind es Steine, die die Form von Rosen haben.\n@c0@"
  en: "@a@b*: They're actually rocks that are shaped like\r\nroses, apparently.\n@c0@"
  es: "@a@b*: Al parecer, son piedras con forma de rosa.\n@c0@"
  fr: "@a@b*ⓢ Apparemment, il s'agirait de pierres en forme de roses.\n@c0@"
  it: "@a@b*: Comunque, si tratta di accumuli di sabbia a cui il vento ha dato la forma di una rosa.\n@c0@"
  ja: "@a@b＊「あ～　ボクって　昔から\n\tダメなんだよなあ。\n@c0@"
312:
  de: "@a@b*: Meist sind sie tief im Sand vergraben, aber in diesem Gebiet gibt es jede Nacht Sandstürme, durch die der Sand aufgewirbelt wird.\n@c0@"
  en: "@a@b*: Most of the time they're buried under piles of sand, but there are sandstorms in this area every night that shift the sand about.\n@c0@"
  es: "@a@b*: Casi siempre están enterradas bajo una tonelada de arena...\n㈡\n*: ... pero en esta zona cada noche hay tormentas que mueven la arena de un lado para otro.\n@c0@"
  fr: "@a@b*ⓢ En général, on les trouve sous des monceaux de sable, mais ici, le vent souffle toutes les nuits et brasse le sable.\n@c0@"
  it: "@a@b*: Di solito sono nascoste sotto le dune, ma possono venire alla luce in seguito alle tempeste di vento che si scatenano in quest'area quasi ogni notte.\n@c0@"
  ja: "@a@b＊「なんでも\n\tこのあたりでしか　とれない\n\tバラの形の　石らしいよ。\n@c0@"
313:
  de: "@a@b*: Wenn Ihr die Nacht in der Herberge verbringt und früh morgens hinausgeht, dann werdet Ihr fast sicher irgendwo eine finden können.\n@c0@"
  en: "@a@b*: If you spend the night at the inn and go out looking early in the morning, you're almost guaranteed to find one lying around.\n@c0@"
  es: "@a@b*: Si %H0860%Xpasas%Ypasáis%Z la noche en la posada y %H0860%Xsales%Ysalís%Z temprano a buscar, lo más seguro es que %H0860%Xencuentres%Yencontréis%Z alguna.\n@c0@"
  fr: "@a@b*ⓢ Si vous passez la nuit à l'auberge et que vous sortez tôt le lendemain, vous pouvez être pratiquement %A0110%Xsûr%Z%B0110%Xsûre%Z d'en trouver une.\n@c0@"
  it: "@a@b*: Quindi, il momento migliore per trovarle è di mattina. Conviene trascorrere la notte alla locanda e alzarsi di buon'ora per cercare le rose.\n@c0@"
  ja: "@a@b＊「たいていは　砂に　埋まっていたり\n\tするみたいだけど　このあたりは\n\t毎夜　砂嵐が　舞うから……。\n@c0@"
314:
  de: "@a@b*: Vor langer, langer Zeit stieg einmal eine Zenithianerin vom Himmel herab.\n@c0@"
  en: "@a@b*: Far in the dim and distant past, a Zenithian woman descended from the heavens.\n@c0@"
  es: "@a@b*: En la noche de los tiempos, una mujier de Zenithia diescendió de los cielos, sí.\n@c0@"
  fr: "@a@b*ⓢ En des temps sombres et lointains, une femme zénithienne descendit des cieux.\n@c0@"
  it: "@a@b*: Molto tempo fa, una donna proveniente da Zenithia scese nel nostro mondo.\n@c0@"
  ja: "@a@b＊「宿に泊まって　よく朝\n\t砂漠を歩いてみれば　きっと\n\t見つけられるんじゃないかな。\n@c0@"
315:
  de: "@a@b*: Ihr Kind sollte zu einem Helden werden. Zum Retter der Welt.\n@c0@"
  en: "@a@b*: Her child was to become a hero.\r\nThe saviour of the world.\n@c0@"
  es: "@a@b*: Su hijo si conviertiría en un héroe.\r\nEl sialvador del mundo, sí.\n@c0@"
  fr: "@a@b*ⓢ Son enfant allait devenir un héros.\nLe sauveur de notre monde.\n@c0@"
  it: "@a@b*: Era la madre di un bambino che sarebbe diventato un eroe, il salvatore dell'umanità.\n@c0@"
  ja: "@a@b＊「いにしえの昔\n\t天空より　ひとりの女\n\t舞い降りき……。\n@c0@"
316:
  de: "@a@b*: Das ist nur eine der Geschichten, die sich die Leute von dem legendären Helden erzählen.\n@c0@"
  en: "@a@b*: That is but one of the many folk tales about the legendary hero.\n@c0@"
  es: "@a@b*: Esta no es más que una de las muchias historias que si cuentan sobre el héroe liegendario.\n@c0@"
  fr: "@a@b*ⓢ Ce n'est là qu'une des nombreuses histoires qui courent sur le héros légendaire.\n@c0@"
  it: "@a@b*: Questa è solo una delle tante storie che si raccontano a proposito dell'Eroe Leggendario...\n@c0@"
  ja: "@a@b＊「その子供　勇者となり\n\t世界を救う……。\n@c0@"
317:
  de: "@a@b*: Seid mir tausendmal willkommen, %H0860%X%A0110%XWanderer%Z%B0110%XWanderin%Z%YWanderer%Z der Wüste.\nDies ist das Wüstenreich Helmunaptra.\n@c0@"
  en: "@a@b*: A thousand welcomes, %H0860%Xwanderer%Ywanderers%Z of the desert.\nThis is the queendom of Helmunaptra.\n@c0@"
  es: "@a@b*: %H0860%XTi%YOs%Z doy la más caluriosa de las bienvienidas, %H0860%X%A0110%Xviajero%Z%B0110%Xviajera%Z%Y%R0000%Xviajeras%Yviajeros%Z%Z del diesierto.\n㈡\n*: %H0860%XEstás%YEstáis%Z en Ayelmandría, el rieino de la rieina Leopatra, sí.\n@c0@"
  fr: "@a@b*ⓢ Soyez %H0860%X%A0110%Xle bienvenu%Z%B0110%Xla bienvenue%Z%Yles %R0000%Xbienvenues%Ybienvenus%Z%Z, %H0860%X%A0110%Xvoyageur%Z%B0110%Xvoyageuse%Z%Y%R0000%Xvoyageuses%Yvoyageurs%Z%Z du désert.\nVous êtes dans le royaume d'Helmunaptra.\n@c0@"
  it: "@a@b*: %H0860%X%A0110%XBenvenuto, viaggiatore%Z%B0110%XBenvenuta, viaggiatrice%Z%Y%R0000%XBenvenute, viaggiatrici%YBenvenuti, viaggiatori%Z%Z del deserto. Questo è il Regno di Faraonia.\n@c0@"
  ja: "@a@b＊「これは\n\t伝説の勇者に　まつわる\n\t言い伝えの　ひとつですわ。\n@c0@"
318:
  de: "@a@b*: Kleohutra, die Königin der Wüste, heißt alle Besucher der Wüste willkommen.\n@c0@"
  en: "@a@b*: Cleohatra, Queen of the Desert, embraces all visitors of the desert.\n@c0@"
  es: "@a@b*: Leopatra, la Rieina del Desierto, acoge a tiodos los visitiantes del diesierto, sí.\n@c0@"
  fr: "@a@b*ⓢ Toutankhanon, reine du désert, accueille chaleureusement tous les visiteurs du désert.\n@c0@"
  it: "@a@b*: Cleo, la Regina del Deserto, accoglie con il sorriso sulle labbra e la gioia nel cuore tutti i visitatori delle sue terre.\n@c0@"
  ja: "@a@b＊「ようこそ！\n\tテルパドールの　お城へ！\n@c0@"
319:
  de: "@a@b*: Ich forsche nach dem legendären Helden.\n@c0@"
  en: "@a@b*: I'm researching the legendary hero.\n@c0@"
  es: "@a@b*: Estoy haciendo avieriguaciones sobre el héroe liegendario, sí.\n@c0@"
  fr: "@a@b*ⓢ J'effectue des recherches sur le héros légendaire.\n@c0@"
  it: "@a@b*: Sto svolgendo delle ricerche sull'Eroe Leggendario.\n@c0@"
  ja: "@a@b＊「われらが女王　アイシスさまは\n\t旅人の訪問を　心より\n\tかんげい　いたします。\n@c0@"
320:
  de: "@a@b*: Jetzt ist mir klar, dass er tatsächlich zenithianischer Herkunft sein muss.\n@c0@"
  en: "@a@b*: It is now clear to me that he did indeed come from Zenithian blood.\n@c0@"
  es: "@a@b*: Ya tiengo muy claro que tienía sangre de Zenithia.\n@c0@"
