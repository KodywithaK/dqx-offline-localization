  fr: "@aMadame de Matuvu@bVous ne pensez décidément qu'à Édouardⓠ\nEt mon présent, où est-ilⓡ\n@c0@"
  it: "@aMadame Pourcel@bMa pensi solo al nostro Lino?!\nE a me non hai portato un regalino?\n@c0@"
