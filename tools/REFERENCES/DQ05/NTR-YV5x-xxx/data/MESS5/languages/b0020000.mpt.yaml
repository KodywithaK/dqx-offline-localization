  en: "@a@b*: But do you know what my little angel said to me?\n@c0@"
  es: "@a@b*: ¿Pero %H0860%X%O0960%Xsabéis%Ysabes%Z%Ysabéis%Z qué me contestó el angelito?\n@c0@"
