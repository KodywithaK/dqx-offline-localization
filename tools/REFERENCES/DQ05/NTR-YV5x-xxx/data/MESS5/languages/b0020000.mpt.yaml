  de: "@aHotz@bFantastisch! Sechzehntausend! Und, wer legt noch einen drauf?\n@c0@"
  en: "@aHeister@bLike it! Sixteen grand! Anyone reckon they can do better than that?\n@c0@"
  es: "@aChimo@b¡Muy bien! ¡Dieciséis de los grandes! ¿Quién lo supera?\n@c0@"
  fr: "@aMontenlair@bVoilà qui me plaît mieuxⓠ Seize mille, c'est bienⓠ\nQui peut faire mieux que çaⓡ\n@c0@"
  it: "@aRuberto@bE ora siamo a sedicimila!\nL'asta sta entrando ne'vvivo!\nC'è qualcuno che offre di più?\n@c0@"
  ja: "@a@b兄「おっと出ました　１６０００！\n\tもう　ないかっ？\n\t１６０００　１６０００　１６０００…\n@c0@"
12:
  de: "@aHotz@bNa los, Leute, schaut noch mal in Euren Hosentaschen nach!\n@c0@"
  en: "@aHeister@bCome on, folks, dig yer 'ands down\r\ninto yer pockets!\n@c0@"
  es: "@aChimo@b¡Venga amigos, rascaos un poco el bolsillo!\n@c0@"
  fr: "@aMontenlair@bAllez, allez, braves gens, cherchez bien au fond de vos poches, vous pouvez faire mieuxⓠ\n@c0@"
  it: "@aRuberto@bGniamo, gente! Frugatevi nelle tasche!\nUna statua come huesta ci farà un figurone a casa vostra!\n@c0@"
  ja: "@a@b兄「はやく　しないと\n\t買われちまうよ！\n@c0@"
13:
  de: "@aHotz@bSolch eine feine Statue wird Euch nur einmal im Leben geboten!\n@c0@"
  en: "@aHeister@bThis is a once-in-a-lifetime chance to get yer mitts on such a pukka-lookin' statue.\n@c0@"
  es: "@aChimo@b¡Es una oportunidad única, de verdad de la buena!\n@c0@"
  fr: "@aMontenlair@bUne occasion pareille ne s'représentera sans doute jamais. Visez un peu cette statueⓠ\n@c0@"
  it: "@aRuberto@bMa quando la rivedrete una scultura tanto bella, eh? Oggi van di moda huelle robe astratte che 'un si hapisce dove iniziano e dove finiscano!\n@c0@"
  ja: "@a@b兄「めったに　手に入らない\n\tみごとな芸術品だ！\n@c0@"
14:
  de: "@aHotz@bHab ich eigentlich erwähnt, dass sie Glück bringt? Jawohl, Leute, sie ist ein echter Glücksbringer, also wo bleiben Eure Gebote?\n@c0@"
  en: "@aHeister@bOh, and I ain't mentioned about 'ow it brings good luck. Yep, you'd best make yer bid now if that's wot you're after.\n@c0@"
  es: "@aChimo@b¡Ah!, y además trae buena suerte. Si la queréis, ya estáis pujando.\n@c0@"
  fr: "@aMontenlair@bOh, et j'ai oublié de vous dire qu'elle portait chance.\nEh ouiⓠ Vous avez intérêt à augmenter la mise si c'est ce que vous cherchez.\n@c0@"
  it: "@aRuberto@bMaremma smemorata! A momento ci si scordava di divvelo! Huesta statua porta anche fortuna!\nForza, 'un siate timidi e fate le vostre offerte!\n@c0@"
  ja: "@a@b兄「そのうえ　この石像は\n\t幸運を呼ぶという　予言つき！\n\tさあさあ　買わなきゃ　ソンだよ！\n@c0@"
15:
  de: "@a@b*: Zwanzigtausend!\n@c0@"
  en: "@a@b*: Twenty thousand!\n@c0@"
  es: "@a@b*: ¡Veinte mil!\n@c0@"
  fr: "@a@b*ⓢ Vingt milleⓠ\n@c0@"
  it: "@a@b*: Offro ventimila monete!\n@c0@"
  ja: "@a@b＊「２００００！\n@c0@"
16:
  de: "@aHotz@bZwanzigtausend! Ich werd' verrückt! Zum ersten, zum zweiten ... und verkauft! Für zwanzigtausend Goldmünzen!\n@c0@"
  en: "@aHeister@bTwenty thousand! Cor blimey! Goin'...goin'...gone! \r\nFor twenty thousand gold coins!\n@c0@"
  es: "@aChimo@b¡Veinte mil! ¡Ay mi madre! A la una, a las dos... ¡paⓘ ti! \n¡Por veinte mil monedas de oro!\n@c0@"
  fr: "@aMontenlair@bVingt milleⓠ Saperlipopetteⓠ\nVingt mille une fois... Vingt mille deux fois... Adjugéeⓠ\nPour vingt mille pièces d'orⓠ\n@c0@"
  it: "@aRuberto@bVen... Ventim... Ventimila monete?! Gulp!\nAggiudihata aggiudihata aggiudihata!\n㈡\nEhm, no. Devo di' hosì: ventimila e uno... ventimila e due... ventimila e tre!\nLa statua l'è venduta pe'vventimila monete!\n@c0@"
  ja: "@a@b兄「２００００！\n\tよーし　売ったあっ！\n@c0@"
17:
  de: "@aHotz@bEs ist ein Vergnügen, mit Euch Geschäfte zu machen, Sir. Gebt Euer Geld dem geschniegelten Typ dort.\n@c0@"
  en: "@aHeister@bNice doin' business wiv ya, mate. Just 'and over yer readies to that fancy-lookin' geezer there.\n@c0@"
  es: "@aChimo@bUn placer hacer negocios contigo, amigo. Dale la pasta al viejo pomposo ese de ahí.\n@c0@"
