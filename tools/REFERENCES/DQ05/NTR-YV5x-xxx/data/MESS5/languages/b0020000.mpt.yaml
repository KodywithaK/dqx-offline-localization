  it: "@a@b*: Tuo padre Russel colmò i nostri cuori di dispiacere, portando via con sé una di noi.\n@c0@"
  ja: "@a@b＊「今は亡き　このエルヘブンの画家も\n\t当時は　王の味方をして　長老たちの\n\tいかりを買ったとか……。\n@c0@"
