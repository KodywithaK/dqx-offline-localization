  en: "@aHeister@bNice! That's twelve thou. Twelve thousand to start the ball rollin'. Advances on twelve, folks?\n@c0@"
  es: "@aChimo@b¡Genial! Van doce. Doce mil y que siga la bola. ¿Nadie sube, amigos?\n@c0@"
  fr: "@aMontenlair@bBienⓠ J'ai douze mille. Douze mille pour ouvrir le bal.\nQui dit mieux, braves gensⓡ\n@c0@"
