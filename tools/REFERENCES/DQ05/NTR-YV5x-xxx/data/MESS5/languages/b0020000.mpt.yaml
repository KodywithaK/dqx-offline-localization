  es: "@aChimo@b¡Y ahora, amigos, el momento que todos estabais esperando! Hoy la estrella es...\n@c0@"
  fr: "@aMontenlair@bEt maintenant, mesdames et messieurs, l'moment que vous attendiez tousⓠ Le clou d'la journée...\n@c0@"
  it: "@aRuberto@bE ora, signore e signori, arriva i'ppezzo forte della giornata...\n@c0@"
  ja: "@a@b兄「さあさあ\n\tいよいよ　今日の　１ばんの\n\t売り物だよ！\n@c0@"
1:
  de: "@aHotz@bJetzt bring sie schon her!\n@c0@"
  en: "@aHeister@bBring it over then, mush!\n@c0@"
  es: "@aChimo@b¡Traela, colega!\n@c0@"
  fr: "@aMontenlair@bApproche-le, cocoⓠ\n@c0@"
  it: "@aRuberto@bGniamo, Malandro!\nTocca a te!\n@c0@"
  ja: "@a@b兄「おい！\n@c0@"
2:
  de: "@aPlotz@bSchon gut!\n@c0@"
  en: "@aHuckster@bYes, bruv!\n@c0@"
  es: "@aChema@b¡Sí, hermano!\n@c0@"
  fr: "@aVidegousset@bOui, franginⓠ\n@c0@"
  it: "@aMalandro@bSì, subito!\n@c0@"
  ja: "@a@b弟「あいよ　兄さん。\n@c0@"
3:
  de: "@aHotz@bDa staunt Ihr, was Leute? Solch eine lebensechte Statue ist Euch noch nie unter die Augen gekommen, stimmt's?\n@c0@"
  en: "@aHeister@bWhat d'ya reckon to that, folks? I'll bet you ain't never seen a statue so lifelike, eh?\n@c0@"
  es: "@aChimo@b¿Qué os parece, amigos? ¿A que nunca habían visto una estatua igual?\n@c0@"
  fr: "@aMontenlair@bAlors, qu'est-ce que vous en dites, braves gensⓡ\nJ'parie que vous aviez jamais vu d'statue aussi vivante, heinⓡ\n@c0@"
  it: "@aRuberto@bE allora, gente? Scommetto che 'un l'avete mai vista una statua hosì bella! È fatta tanto bene che le manca solo la parola!\n@c0@"
  ja: "@a@b兄「どうだい！\n\tみごとな石像だろう！\n@c0@"
4:
  de: "@aHotz@bNoch mal bekommt Ihr nicht die Chance, solch ein Prachtexemplar zu ersteigern!\n@c0@"
  en: "@aHeister@bYou won't get another chance to get yer mits on somethin' of this kind o' quality!\n@c0@"
  es: "@aChimo@b¡No habrá otra ocasión de echar el guante a algo de semejante calidad!\n@c0@"
  fr: "@aMontenlair@bVous aurez jamais l'occasion de r'mettre la main sur une marchandise de cette qualitéⓠ\n@c0@"
  it: "@aRuberto@bIo vi diho che 'un l'avrete un'altra possibilità di hompra' un'opera d'arte tanto... artistiha!\nL'è un pezzo davvero uniho!\n@c0@"
  ja: "@a@b兄「これほどの物は　めったに\n\tよそじゃ　手に入らないぜ！\n@c0@"
5:
  de: "@aHotz@bDann wollen wir mal loslegen. Wie wär's mit einem Eröffnungsgebot von zehntausend Goldstücken?\n@c0@"
  en: "@aHeister@bSo let's 'ear it then. 'Ow's about we start the\r\nol' biddin' at ten thousand gold coins? Do I 'ear ten thousand?\n@c0@"
  es: "@aChimo@bAsí que a vamos. ¿Y si empezamos la subasta con diez mil de oro? ¿He oído diez mil?\n@c0@"
  fr: "@aMontenlair@bBien, à vous maintenant. Si on commençait les enchères à dix mille pièces d'orⓡ\nDix mille, c'est partiⓠ\n@c0@"
  it: "@aRuberto@bGniamo, gente! Fatemi senti' le vostre offerte!\nSi parte da diecimila monete!\nChi offre diecimila monete, eh?\n@c0@"
  ja: "@a@b兄「さあ　１００００ゴールドからだ！\n\t１００００ゴールド\n\t１００００ゴールド！\n@c0@"
6:
  de: "@a@b*: Zwölftausend!\n@c0@"
  en: "@a@b*: Twelve thousand!\n@c0@"
  es: "@a@b*: ¡Doce mil!\n@c0@"
  fr: "@a@b*ⓢ Douze milleⓠ\n@c0@"
  it: "@a@b*: Dodicimila!\n@c0@"
  ja: "@a@b＊「１２０００！\n@c0@"
