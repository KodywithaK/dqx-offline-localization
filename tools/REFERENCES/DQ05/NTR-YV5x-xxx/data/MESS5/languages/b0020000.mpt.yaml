  fr: "@aMonsieur de Matuvu@bElle est très impressionnante, ne trouvez-vous pasⓡ\n@c0@"
  it: "@aCommendator Pourcel@bBella, vero?\n@c0@"
  ja: "@a@b夫「どうだ\n\tなかなか　みごとな石像だろう。\n@c0@"
