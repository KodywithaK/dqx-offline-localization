  it: "@aRuberto@bGrazie per la tu' offerta, bisch... Ehm, grazie per la sua offerta, gentile signore. Pe' i'ppagamento, passi alla hassa. Cioè da i'mmi' fratello.\n@c0@"
  ja: "@a@b兄「お客さん　いい買い物をしたね。\n\tじゃあ　支払いは　そこの男に\n\tよろしくたのむよ。\n@c0@"
