  ja: "@a@b兄「よ！　じいさん　お目が高い！\n\tさあ　１５０００だよ！\n\t１５０００　１５０００　１５０００…\n@c0@"
10:
  de: "@a@b*: Sechzehntausend!\n@c0@"
  en: "@a@b*: Sixteen thousand!\n@c0@"
