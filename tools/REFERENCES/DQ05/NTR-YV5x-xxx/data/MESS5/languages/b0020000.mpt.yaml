  it: "@a@b*: Ebbene, %O0960%Xsa cosa mi rispondeva il mio piccolo, Maestà%Y%H0860%Xsai cosa mi rispondeva il mio piccolo%Ysapete cosa mi rispondeva il mio piccolo%Z%Z?\n@c0@"
  ja: "@a@b＊「あの子　言ったんですよ。\n@c0@"
226:
  de: "@a@b*: Er sagte, es sei sinnlos, auf Frieden zu hoffen, denn vielleicht komme er nie. Es sei besser, Frieden mit sich selbst zu schließen, sagte er.\n@c0@"
  en: "@a@b*: He said there's no point waiting for peace, because it might never come. We have to make\r\nour own peace, he said.\n@c0@"
  es: "@a@b*: Que no tiene sentido esperar la paz, ya que nunca llegará. Dijo que la paz hay que buscarla.\n@c0@"
  fr: "@a@b*ⓢ Il a dit qu'il ne servait à rien d'attendre la paix, car elle pourrait ne jamais venir. Nous devons faire notre paix nous-mêmes, a-t-il ajouté.\n@c0@"
