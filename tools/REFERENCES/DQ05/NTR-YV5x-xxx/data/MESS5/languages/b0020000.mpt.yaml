  fr: "@a@b*ⓢ Oh, je vois... Mais cela n'est guère surprenant, au fond. Ma petite auberge n'est pas vraiment faite pour un monarque.\n@c0@"
  it: "@a@b*: Oh, mi spiace.\nComunque, mi sarei stupita del contrario.\n㈡\n*: Abituato com'è alle lussuose comodità dei suoi alloggi, non si sarebbe certo trovato a suo agio nella mia modesta locanda.\n@c0@"
  ja: "@a@b＊「そうですか……。\n\tでは　どうぞ　ご無理を\n\tなさいませんように。\n@c0@"
224:
  de: "@a@b*: Ich habe immer gehofft, dass es friedlicher in der Welt zugeht, wenn mein kleiner Junge groß ist.\n@c0@"
  en: "@a@b*: I used to say I hope the world's a more peaceful place by the time my little boy grows up.\n@c0@"
  es: "@a@b*: Antes decía que esperaba que el mundo fuera más pacífico cuando mi pequeño creciera.\n@c0@"
  fr: "@a@b*ⓢ J'avais l'habitude de dire que j'espérais que le monde serait plus paisible lorsque mon petit garçon serait grand.\n@c0@"
  it: "@a@b*: Un tempo speravo che il mondo potesse diventare un posto tranquillo e sicuro, in cui mio figlio avrebbe potuto crescere sereno...\n@c0@"
  ja: "@a@b＊「うちの子が　大きくなるまでに\n\t平和な時代が　来てくれたらと\n\t思っていたけど……。\n@c0@"
