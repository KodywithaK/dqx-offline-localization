  es: "@aAlazar@b¡Por favor%O0960%X, Majestad!%Y!%Z\nDe verdad que me parece una buena idea que lo tenga alguien responsable.\n@c0@"
  fr: "@aInnocent@bJe vous en prie%O0960%X, Votre Majesté%Y%Zⓠ Je crois qu'il serait vraiment sage que vous le preniez.\n@c0@"
  it: "@aSimon@b%O0960%XMaestà, scusi se mi permetto di insistere, forse sarebbe meglio se lei la prendesse%YComprendo la %H0860%Xtua titubanza, ma credo sia meglio per tutti se te la prendi%Yvostra titubanza, ma credo sia meglio per tutti se ve la prendete%Z%Z...\n@c0@"
  ja: "@a@bピピン「そんなこと　おっしゃらずに\n\tどうか　お願いです！\n@c0@"
220:
  de: "@a@b*: Oh, Eure Majestät, König %a000090! Ihr wollt Euer Haupt auf einer meiner bescheidenen Schlafstätten betten?\n@c0@"
  en: "@a@b*: Well! Your Majesty, King %a000090!\nCould it be that you're planning to grace one of my humble beds with your stately frame?\n@c0@"
  es: "@a@b*: ¡Bueno! ¡Su Majestad, el rey %a000090!\n¿Es posible que queráis honrar una de mis humildes camas con vuestro regio cuerpo?\n@c0@"
  fr: "@a@b*ⓢ Eh bienⓠ Votre Majesté, roi %a000090ⓠ\nEnvisageriez-vous par hasard d'honorer l'un de mes humbles lits de votre royale statureⓡ\n@c0@"
  it: "@a@b*: I miei ossequi, re %a000090!\nHa forse intenzione di onorare uno dei miei umili letti della sua presenza?\n@c0@"
  ja: "@a@b＊「これは　%a000090王さま！\n\tうちの宿に　泊まって\n\tいただけるんですか？\n@c0@"
221:
  de: "@a@b*: Welch eine Ehre! Es ist nichts Besonderes, aber ich hoffe trotzdem, dass Ihr eine angenehme Nacht verbringt.\n@c0@"
  en: "@a@b*: What an honour! It's just a tiny little place,\r\nreally, but I hope you'll have a comfortable\r\nnight's sleep nonetheless.\n@c0@"
  es: "@a@b*: ¡Qué honor! Este es un sitio muy modesto, pero espero que tengáis una buena noche de descanso.\n@c0@"
  fr: "@a@b*ⓢ Quel honneurⓠ Cet endroit est tout petit, vous savez, mais j'espère que vous y passerez néanmoins une nuit confortable.\n@c0@"
  it: "@a@b*: Oh, che meraviglia!\n㈡\n*: La sistemazione che posso offrirle non è paragonabile alle sue splendide stanze, ma le assicuro che la troverà comoda e tranquilla!\n@c0@"
  ja: "@a@b＊「光栄ですわ！\n\tせまいところですが　ごゆっくり\n\tお休みください……。\n@c0@"
222:
