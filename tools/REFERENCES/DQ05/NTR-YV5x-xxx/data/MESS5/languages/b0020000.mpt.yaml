  it: "@a@b*: Molta gente ha abbandonato il Regno di Denim durante %O0960%Xla sua assenza forzata, Maestà%Yl'assenza forzata di re %a000090%Z.\n@c0@"
  ja: "@a@b＊「%a000090王が　いないあいだに\n\tこの国も　ずいぶん\n\t人が　へってしまいました。\n@c0@"
181:
  de: "@a@b*: Mein Vater war einer von ihnen. Er verließ die Stadt und kam nie wieder. Er war ein berühmter Handwerker, wisst Ihr.\n@c0@"
  en: "@a@b*: My father's one of them. He left and never came back. He was a bit of a legend here in Gotha, you know. A famous craftsman.\n@c0@"
  es: "@a@b*: Mi padre está entre ellos. Se marchó y no volvió. Era casi una leyenda en Pankraz, un famoso artesano.\n@c0@"
  fr: "@a@b*ⓢ Mon père en fait partie. Il a quitté la ville définitivement. Il était très connu à Gotha, vous savez. C'était un artisan célèbre.\n@c0@"
  it: "@a@b*: Un tempo, anche mio padre viveva a Denim, poi se n'è andato e non ha più fatto ritorno. Era un abilissimo artigiano, un vero maestro nel suo campo.\n@c0@"
  ja: "@a@b＊「伝説の名工だった\n\t私の父も　けっきょく　戻っては\n\t来ませんでしたし……。\n@c0@"
182:
  de: "@a@b*: Ich habe gehört, dass %O0960%XIhr und Euer Vater in einem Ort namens Steinach gelebt habt%YKönig %a000090 und der alte König Ludwig in einem Ort namens Steinach gelebt haben%Z.\n@c0@"
  en: "@a@b*: Actually, I hear %O0960%Xyou and your father%YKing %a000090 and the late King Pankraz%Z used to live in a place called Whealbrook.\n@c0@"
  es: "@a@b*: He oído que %O0960%Xvos y vuestro padre vivíais%Yel rey %a000090 y el difunto rey Teudis vivían%Z en un sitio llamado Arroyofrío.\n@c0@"
  fr: "@a@b*ⓢ D'ailleurs, j'ai entendu dire que %O0960%Xvotre père et vous viviez%Yle roi %a000090 et feu le roi Petros vivaient%Z autrefois dans un village appelé Ruycelieu.\n@c0@"
  it: "@a@b*: So che %O0960%Xlei e suo padre avete%YRe %a000090 e il povero re Russel hanno%Z vissuto in un paesino chiamato Valcava per un certo periodo...\n@c0@"
  ja: "@a@b＊「そういえば　%a000090王は　かつて\n\tパパス王と　サンタローズで\n\t暮らしていたそうですね。\n@c0@"
183:
  de: "@a@b*: Mein Vater hat oft von Steinach gesprochen. Er wollte unbedingt dorthin, weil es da wohl einen schönen Edelstein oder so etwas gab.\n@c0@"
  en: "@a@b*: My father used to talk about Whealbrook. He said he wanted to visit the place because it was the home of a beautiful gemstone ore or something.\n@c0@"
  es: "@a@b*: Mi padre me hablaba de Arroyofrío. Decía que quería visitarlo porque allí había una hermosa gema, o algo así.\n@c0@"
  fr: "@a@b*ⓢ Mon père parlait beaucoup de ce village. Il disait qu'il voulait s'y rendre, car c'était là que se trouvait une magnifique pierre précieuse, je crois.\n@c0@"
  it: "@a@b*: Mio padre mi parlava spesso di quel villaggio.\n㈡\n*: Mi diceva che avrebbe voluto visitarlo perché da quelle parti era possibile trovare delle splendide pietre preziose.\n@c0@"
  ja: "@a@b＊「あそこの洞くつは　美しい宝石の\n\t原石がとれるとかで　父もいつか\n\t行きたいと　話していましたっけ。\n@c0@"
184:
  de: "@a@b*: Was? Ihr seid einem berühmten Handwerker begegnet, der den Steinach-Blaustein geschliffen hat, den Ihr dabei hattet?\n@c0@"
  en: "@a@b*: What? You say you met a legendary jeweller who cut and polished a rough Whealbrook bluestone\r\nyou had?\n@c0@"
  es: "@a@b*: ¿Qué? ¿Que %H0860%X%O0960%Xhabéis%Yhas%Z%Yhabéis%Z conocido a un orfebre legendario que cortó y pulimentó una aguamarina de Arroyofrío que %H0860%X%O0960%Xteníais%Ytenías%Z%Yteníais%Z?\n@c0@"
  fr: "@a@b*ⓢ Commentⓡ Vous dites que vous avez rencontré un bijoutier célèbre qui a taillé et poli la gemme bleue de Ruycelieu que vous possédiezⓡ\n@c0@"
  it: "@a@b*: Cosa?! %O0960%XSua Maestà ha incontrato un abilissimo gioielliere che ha raffinato e tagliato la pietra nobile di Valcava grezza che%YRe %a000090 ha incontrato un abilissimo gioielliere che ha raffinato e tagliato la pietra nobile di Valcava grezza che il nostro sovrano%Z aveva con sé?!\n@c0@"
  ja: "@a@b＊「なんと　聖なる原石を\n\t伝説の名工に\n\t加工してもらったですって？\n@c0@"
185:
  de: "@a@b*: Dann... ist mein Vater noch am Leben?\n@c0@"
  en: "@a@b*: Then...my father is alive?\n@c0@"
  es: "@a@b*: Entonces... ¿mi padre está vivo?\n@c0@"
  fr: "@a@b*ⓢ Mais alors... mon père est en vieⓡ\n@c0@"
  it: "@a@b*: Ma allora...\nAllora mio padre è vivo...?\n@c0@"
  ja: "@a@b＊「そうですか……。\n\t父は　生きていたんですね！\n@c0@"
186:
  de: "@a@b*: Aber ich sollte mir keine Hoffnungen machen. Er wird nicht zurückkommen. Dafür ist er viel zu stur.\n@c0@"
  en: "@a@b*: But there's no point deluding myself.\r\nI know he's not coming back.\r\nHe's far too stubborn for that.\n@c0@"
  es: "@a@b*: Pero no tiene sentido engañarse.\r\nSé que no va a volver.\r\nEs demasiado tozudo.\n@c0@"
  fr: "@a@b*ⓢ Enfin, inutile de me faire des illusions.\nJe sais qu'il ne reviendra pas.\nIl est bien trop buté pour ça.\n@c0@"
  it: "@a@b*: Ah, non importa. È inutile che io mi faccia illusioni.\nMio padre ha deciso di non tornare più a Denim, ed è troppo cocciuto per cambiare idea.\n@c0@"
  ja: "@a@b＊「でも　分かってます。\n\t父は　戻らないつもりなんですよね。\n\tあの通りの　ガンコ者ですから……。\n@c0@"
187:
  de: "@a@b*: Doch was er kann, kann ich schon lange! Ich bleibe hier und beweise ihm, dass ich mehr drauf habe als er!\n@c0@"
  en: "@a@b*: Well two can play at that game! I'm going to stay right here and prove to the old man that I can be better than him!\n@c0@"
  es: "@a@b*: ¡Pues a esto pueden jugar dos! ¡Voy a quedarme aquí y a demostrar a mi padre que puedo ser mejor que él!\n@c0@"
  fr: "@a@b*ⓢ Mais on peut être deux à jouer à ce petit jeu-làⓠ\nJe vais rester ici et prouver à ce vieil entêté que je peux devenir meilleur que luiⓠ\n@c0@"
  it: "@a@b*: Anch'io sono cocciuto, però! Quanto e più di mio padre! Lui non vuole tornare a Denim? Perfetto! Io non muoverò un solo passo per andare a cercarlo!\n㈡\n*: Così impara a dimenticarsi di suo figlio!\nNon si tratta così il sangue del proprio sangue...\n@c0@"
