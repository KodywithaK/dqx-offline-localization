  it: "@a%0%a001240@bE se incontreremo qualche mostro cattivo, lo affronteremo e lo sconfiggeremo, come dei veri guerrieri! Yaaah!\n@c0@"
  ja: "@a@b%a001240「それから　悪いヤツを\n\tやっつけて　ボクたちが\n\t世界を　すくうんだよね！\n@c0@"
103:
  de: "@a%0%a001240@bUnd weißt du was?\n@c0@"
  en: "@a%0%a001240@bOh! And guess what...\n@c0@"
  es: "@a%0%a001240@b¡Ah! ¿Y sabes qué?\n@c0@"
  fr: "@a%0%a001240@bOhⓠ Et tu sais quoiⓡ\n@c0@"
  it: "@a%0%a001240@bSai?\nHo imparato a fare una bella cosa...\n@c0@"
  ja: "@a@b%a001240「お父さん　聞いて！\n@c0@"
104:
  de: "@a%0%a001240@bDu erinnerst dich doch noch an das Zenithiaschwert, das du zurückgelassen hast, nicht wahr? Ich kann es ausrüsten!\n@c0@"
  en: "@a%0%a001240@bYou know the Zenithian Sword you left behind?\nI can equip myself with it!\n@c0@"
  es: "@a%0%a001240@b¿Te acuerdas de la Espada de Zenithia que dejaste?\n¡Puedo usarla!\n@c0@"
  fr: "@a%0%a001240@bTu te souviens de l'Épée zénithienne que tu as laisséeⓡ Eh bien, je peux m'en équiperⓠ\n@c0@"
  it: "@a%0%a001240@bHo imparato ad aggiungere al mio equipaggiamento la Spada Zenithiana che avevi lasciato allo zio Sancho!\nOra so usare quell'arma!\n@c0@"
  ja: "@a@b%a001240「お父さんが　残して行った\n\t天空のつるぎ。\n\tボク　装備できたんだよ！\n@c0@"
105:
  de: "@aSancho@bAber, aber, nisst alle auf einmal!\nLasst euren Padre doch auch mal zu Wort kommen.\n@c0@"
  en: "@aSancho@bEh, ees like the stampede from your mouths!\r\nYou no geeve your father the chance to esay esometheeng back to you.\n@c0@"
  es: "@aSancho@b¡Eh!, chamaquitos, a ver si paráis para respirar, nomás.\n㈡\nNo habéis dado a vuestro padre ocasión de responder.\n@c0@"
  fr: "@aSancho@bQuels moulins à p-parolesⓠ\nVous ne laissez même pas à votre p-père le temps de vous répondre.\n@c0@"
  it: "@aSancho@bCalma, niños, calma.\nComprendo el vostro entusiasmo, ma date a vostro padre el tiempo de risponderve.\n@c0@"
  ja: "@a@bサンチョ「まあまあ　坊っちゃんたち。\n\tそんなに　いっぺんに\n\tいろんなことを　言われても。\n@c0@"
106:
  de: "@aSancho@bVielleisst sollten wir nach Humburg zurückkehren, no? Im Castillo sind wir sisser und k-können in Ruhe reden.\n@c0@"
  en: "@aSancho@bMaybe ees better we return to Gotha, no?\r\nThen we are all talking together een the\r\ncastle, where ees esafe.\n@c0@"
  es: "@aSancho@bAhorita deberíamos volver a Pankraz.\r\nPlaticaremos en el castillo, cuando estemos a salvo.\n@c0@"
  fr: "@aSancho@bNous ferions mieux de retourner à Gotha, noⓡ\nOn p-pourra parler t-tous ensemble dans le château, en sécurité.\n@c0@"
  it: "@aSancho@bForse dovremmo tornare a Denim.\nNel castillo potremo hablar tranquillamentes y en toda sicurezza.\n@c0@"
  ja: "@a@bサンチョ「ここは　ひとまず\n\tグランバニアの　お城に\n\tもどることに　しましょう。\n@c0@"
107:
  de: "@aSancho@bBringst du uns dorthin, %a001250?\n@c0@"
  en: "@aSancho@bYou weell take us there, %a001250?\n@c0@"
  es: "@aSancho@b¿Nos llevas, nomás, %a001250?\n@c0@"
  fr: "@aSancho@bTu nous y emmènes, %a001250ⓡ\n@c0@"
  it: "@aSancho@b¿Ce pensi tu, %a001250?\n@c0@"
  ja: "@a@bサンチョ「さあ　%a001250さま。\n@c0@"
108:
  de: "@a%0%a001250@bKlar!\n@c0@"
  en: "@a%0%a001250@bGot it.\n@c0@"
  es: "@a%0%a001250@bClaro.\n@c0@"
  fr: "@a%0%a001250@bD'accord.\n@c0@"
  it: "@a%0%a001250@bCerto!\n@c0@"
  ja: "@a@b%a001250「はい。\n@c0@"
109:
  de: "@a@b%0%a001250 wirkt den Zauber Teleportation!\n@c0@"
  en: "@a@b%0%a001250 casts Zoom!\n@c0@"
  es: "@a@b%0%a001250 lanza Telerregreso.\n@c0@"
  fr: "@a@b%0%a001250 lance le sort Téléportationⓠ\n@c0@"
  it: "@a@b%0%a001250 Lancia Teletrasporto!\n@c0@"
  ja: "@a@b%a001250は　ルーラを　となえた！\n@c0@"
110:
  de: "@a@b%3Im Laufe des Tages verbreitet sich die Nachricht, dass König %a000090 zurückgekehrt ist, wie ein Lauffeuer in Humburg.%4\n@c0@"
  en: "@a@b%3During the day, the news of King %a000090's return spreads throughout Gotha.%4\n@c0@"
  es: "@a@b%3Ese mismo día, la noticia del regreso del rey %a000090 se extiende por Pankraz.%4\n@c0@"
  fr: "@a@b%3Dans la journée, l'annonce du retour du roi %a000090 se répandit dans tout Gotha.%4\n@c0@"
  it: "@a@b%3La notizia del ritorno di %a000090 raggiunge ben presto ogni angolo del Regno di Denim.%4\n@c0@"
  ja: "@a@b　　　　%a000090王が　もどったという\n　　　　　知らせは　その日のうちに\n　　　　　　国中に　知れわたった。\n@c0@"
111:
  de: "@a@b%3Die Bürger sind überglücklich und wissen gar nicht, ob sie vor Freude lachen oder weinen sollen.%4\n@c0@"
  en: "@a@b%3Overcome with joy, the citizens don't know whether to cry, or to hug their treasured monarch.%4\n@c0@"
  es: "@a@b%3Abrumados por la dicha, los ciudadanos no saben si llorar o abrazar a su querido monarca.%4\n@c0@"
  fr: "@a@b%3Ne se tenant plus de joie, les habitants ne savaient plus s'ils devaient pleurer ou embrasser leur monarque bien-aimé.%4\n@c0@"
  it: "@a@b%3I sudditi dimostrano al Re tutta la gioia per la sua ricomparsa con grida di entusiasmo e lacrime di felicità.%4\n@c0@"
  ja: "@a@b　　　　人々は　あるいは　抱き合い\n　　　　　　あるいは　涙を流して\n　　　　王の帰りを　よろこびあった。\n@c0@"
112:
  de: "@a@b%3Lang lebe König %a000090!\nDie Feierlichkeiten zu Ehren des zurückgekehrten Königs halten noch die ganze Nacht lang an.%4\n@c0@"
  en: "@a@b%3Long live King %a000090!\n Celebrations in honour of the King's\n return continue long into the night.%4\n@c0@"
  es: "@a@b%3¡Larga vida al rey %a000090!\nLas celebraciones por el regreso del Rey prosiguen hasta la madrugada.%4\n@c0@"
  fr: "@a@b%3Vive le roi %a000090ⓠ\nLes festivités en l'honneur du roi et de son retour se poursuivirent tard dans la nuit.%4\n@c0@"
  it: "@a@b%3Lunga vita a re %a000090!\nLa festa per il ritorno del sovrano prosegue per tutta la notte.%4\n@c0@"
  ja: "@a@b　　　　　　%a000090王　ばんざい！\n　　　グランバニア国あげての　まつりが\n　　　　その夜　おそくまで　ひらかれ……\n@c0@"
113:
  de: "@a@b%3Dann, am nächsten Morgen...%4\n@c0@"
  en: "@a@b%3Then, the following morning...%4\n@c0@"
  es: "@a@b%3Y a la mañana siguiente...%4\n@c0@"
  fr: "@a@b%3Le lendemain matin...%4\n@c0@"
  it: "@a@b%3Il mattino seguente...%4\n@c0@"
  ja: "@a@b　　　　　そして　夜が　明けた……。\n@c0@"
114:
  de: "@a@b*: Guten Morgen, Eure Majestät! Ihr habt bestimmt wie ein Stein geschlafen, nicht wahr?\n@c0@"
  en: "@a@b*: Good morning, Your Majesty!\nYou slept like a log last night, didn't you?\n@c0@"
  es: "@a@b*: ¡Buenos días, Majestad!\r\nHabéis dormido como un tronco, ¿eh?\n@c0@"
  fr: "@a@b*ⓢ Bonjour, Votre Majestéⓠ\nVous avez dormi comme un loir la nuit dernière, n'est-ce pasⓡ\n@c0@"
  it: "@a@b*: Buongiorno, Maestà!\nHa dormito bene?\n@c0@"
  ja: "@a@b＊「おはようございます。\n\tゆうべは　本当に　よく\n\tお休みで　ございましたね。\n@c0@"
115:
  de: "@a@b*: Eure Kinder und Herr Sancho sind ja so glücklich, dass Ihr wieder da seid.\n@c0@"
  en: "@a@b*: Your little ones and Mr Sancho don't know what to do with themselves, they're so happy.\n@c0@"
  es: "@a@b*: Vuestros pequeños y el señor Sancho no caben en sí de gozo.\n@c0@"
  fr: "@a@b*ⓢ Vos petits et monsieur Sancho ne cessent de s'agiter dans tous les sens. Ils sont si heureux.\n@c0@"
  it: "@a@b*: I suoi figli e il signor Sancho non stanno più nella pelle, per la felicità di averla ritrovata.\n@c0@"
  ja: "@a@b＊「サンチョどのも　王子さまたちも\n\t本当に　およろこびで……。\n@c0@"
116:
  de: "@a@b*: Ach ja! Herr Sancho hat mich gebeten, Euch das hier zu geben.\n@c0@"
  en: "@a@b*: Oh, yes! Speaking of Mr Sancho, he asked me to give you this.\n@c0@"
  es: "@a@b*: ¡Ah, sí! Hablando del señor Sancho, me ha pedido que os dé esto.\n@c0@"
  fr: "@a@b*ⓢ Ah, ouiⓠ En parlant de monsieur Sancho.\nIl m'a demandé de vous remettre ceci.\n@c0@"
  it: "@a@b*: Il signor Sancho mi ha chiesto di darle questo.\n@c0@"
  ja: "@a@b＊「……そうそう　これは\n\tサンチョどのから　%a000090王にと。\n@c0@"
117:
  de: "@a@b*: Es ist ein Anhänger, den ein berühmter Handwerker eigens für die Hochzeit Eures Vaters und Eurer Mutter angefertigt hat.\n@c0@"
  en: "@a@b*: It's a pendant made by a famous Gothan jeweller for the wedding of your father, King Pankraz, and your mother, Queen Mada.\n@c0@"
  es: "@a@b*: Es un colgante elaborado por un famoso orfebre de Pankraz para la boda de vuestros padres, el rey Teudis y la reina Perséfone.\n@c0@"
  fr: "@a@b*ⓢ C'est un pendentif fabriqué par un célèbre joaillier de Gotha pour le mariage de votre père, le roi Petros, et de votre mère, la reine Magdalena.\n@c0@"
  it: "@a@b*: È un medaglione realizzato da un famoso artigiano di Denim in occasione delle nozze tra re Russel e Lady Mada.\n@c0@"
  ja: "@a@b＊「かつて　パパス王が　マーサさまと\n\tご結婚されたとき　お城の名工が\n\t記念に作った　ペンダントです。\n@c0@"
118:
  de: "@a@b*: König Ludwig wollte eigentlich ein Bild von Eurer Mutter für das Medaillon malen lassen.\n@c0@"
  en: "@a@b*: King Pankraz had meant to put a picture of her in the locket, you see.\n@c0@"
  es: "@a@b*: El rey Teudis quería poner una imagen de ella en el camafeo.\n@c0@"
  fr: "@a@b*ⓢ Le roi Petros avait prévu de placer un portrait d'elle dans le médaillon.\n@c0@"
  it: "@a@b*: Suo padre avrebbe voluto inserire un'immagine all'interno del medaglione...\n@c0@"
  ja: "@a@b＊「パパス王は　そのロケットペンダントに\n\tマーサさまの絵を　入れるおつもり\n\tだったようなのですが……\n@c0@"
119:
  de: "@a@b*: Doch dann verschwand sie, bevor ein Gemälde von ihr angefertigt werden konnte.\n@c0@"
  en: "@a@b*: But she was taken before he could have an artist paint a picture of her.\n@c0@"
  es: "@a@b*: Pero la raptaron antes de que un artista pudiera retratarla.\n@c0@"
  fr: "@a@b*ⓢ Mais elle a été enlevée avant qu'un artiste ait eu le temps de réaliser l'œuvre.\n@c0@"
  it: "@a@b*: La regina Mada, però, venne rapita prima che il pittore incaricato di dipingere il suo ritratto avesse terminato l'opera.\n@c0@"
  ja: "@a@b＊「マーサさまが　さらわれてしまい\n\t画家に　絵を描かせることが\n\tできなかったのです。\n@c0@"
120:
  de: "@a@b*: Es ist die ganze Zeit leer geblieben. Welch eine traurige Geschichte! Zum Heulen!\n@c0@"
  en: "@a@b*: So it's remained empty all this time.\nHonestly, it's so sad, it's enough to turn the taps on!\n@c0@"
  es: "@a@b*: Así que ha permanecido vacío todo este tiempo.\r\n¡Lo cierto es que dan ganas de llorar!\n@c0@"
  fr: "@a@b*ⓢ Le médaillon est donc resté vide pendant tout ce temps. C'est tellement triste, j'en ai les larmes aux yeuxⓠ\n@c0@"
  it: "@a@b*: Così, questo merviglioso medaglione è vuoto.\nOh, mi viene da piangere! Sob! Povera regina Mada!\nSob! Scusi le lacrime, Maestà... Sob!\n@c0@"
  ja: "@a@b＊「ですから　このロケットペンダントは\n\t空っぽのまま……。\n@c0@"
121:
  de: "@a@b*: Ich glaube, Herr Sancho hat lange überlegt, ob er es Euch geben soll oder nicht.\n@c0@"
  en: "@a@b*: I think Mr Sancho's been terribly worried about whether he should give it to you or not.\n@c0@"
  es: "@a@b*: Creo que el señor Sancho estaba preocupadísimo por si debía dároslo o no.\n@c0@"
  fr: "@a@b*ⓢ Je crois que monsieur Sancho était terriblement embêté, car il ne savait pas s'il devait vous le donner ou non.\n@c0@"
  it: "@a@b*: È da molto che il signor Sancho si chiedeva se fosse giusto o meno darle questo ricordo dei suoi genitori...\n@c0@"
  ja: "@a@b＊「サンチョどのは　%a000090さまが\n\t王になられたとき　これを\n\tお渡しするか　悩んだそうですわ。\n@c0@"
122:
  de: "@a@b*: Er hat Angst, dass Ihr Euch sofort auf die Suche nach ihr begebt, wenn er Euch das Medaillon zeigt.\n@c0@"
  en: "@a@b*: He said he thought it might make you leave to go off in search of her if he showed it to you.\n@c0@"
  es: "@a@b*: Pensaba que al verlo querríais partir en busca de ella.\n@c0@"
  fr: "@a@b*ⓢ Il a dit qu'il craignait que cela vous incite à partir à sa recherche s'il vous le montrait.\n@c0@"
  it: "@a@b*: Ha detto che forse l'avrebbe spinta a partire nuovamente alla ricerca di sua madre.\n@c0@"
  ja: "@a@b＊「%a000090さまが　ごらんになれば\n\tきっと　すぐにでも　マーサさまを\n\tさがしに行ってしまうだろうと。\n@c0@"
123:
  de: "@a@b*: Und der Arme möchte Euch keinesfalls in Gefahr bringen. Ich glaube, er gibt sich die Schuld am Tod Eures Vaters.\n@c0@"
  en: "@a@b*: And the poor man doesn't want to put you in danger. I think he blames himself for what happened to your father.\n@c0@"
  es: "@a@b*: Y el pobre no quiere que os pongáis en peligro. Creo que se culpa por lo que le sucedió a vuestro padre.\n@c0@"
  fr: "@a@b*ⓢ Et le pauvre homme ne veut pas vous mettre en danger. Je crois qu'il se sent coupable de ce qui est arrivé à votre père.\n@c0@"
  it: "@a@b*: Quel brav'uomo non vuole che lei corra alcun pericolo. Credo che Sancho, in cuor suo, si senta responsabile di ciò che accadde a suo padre.\n@c0@"
  ja: "@a@b＊「サンチョどのは　%a000090王を\n\tパパス王のような　危険な目に\n\tあわせたくなかったんですね。\n@c0@"
124:
  de: "@a@b*: Überlegt gut, was Ihr tut, Eure Majestät. Ihr solltet nichts überstürzen.\n@c0@"
  en: "@a@b*: So you be careful, Your Majesty.\nDon't do anything rash.\n@c0@"
  es: "@a@b*: Así que tened cuidado, Majestad.\r\nNo hagáis ninguna tontería.\n@c0@"
  fr: "@a@b*ⓢ Alors soyez prudent, Votre Majesté.\nNe prenez pas de décision hâtive.\n@c0@"
  it: "@a@b*: La prego, Maestà...\nFaccia attenzione.\nNon prenda decisioni affrettate.\n@c0@"
  ja: "@a@b＊「どうか　%a000090王\n\t無理だけは　なさらずに……。\n@c0@"
125:
  de: "@a@b*: Aber hier ist erst einmal das Medaillon.\n@c0@"
  en: "@a@b*: Anyway, pet, here's the locket.\n@c0@"
  es: "@a@b*: Bueno, pues aquí está el camafeo.\n@c0@"
  fr: "@a@b*ⓢ Bref, voici le médaillon.\n@c0@"
  it: "@a@b*: Ecco, prenda...\n@c0@"
  ja: "@a@b＊「さあ　この　パパス王の\n\t思い出のロケットペンダントを\n\tお受け取りくださいな。\n@c0@"
126:
  de: "@a@b%0%a000090 erhält Magdalenas Medaillon.\n@c0@"
  en: "@a@b%0%a000090 receives Madalena's locket.\n@c0@"
  es: "@a@b%0%a000090 recibe el camafeo de Perséfone.\n@c0@"
  fr: "@a@b%0%a000090 reçoit le pendentif de Magdalena.\n@c0@"
  it: "@a@b%0%a000090 ha ricevuto il medaglione di Mada!\n@c0@"
  ja: "@a@b%a000090は　思い出のロケットを\n受けとった！\n@c0@"
127:
  de: "@a@b%0%a000180 steckt Magdalenas Medaillon ein.\n@c0@"
  en: "@a@b%0%a000180 takes Madalena's locket.\n@c0@"
  es: "@a@b%0%a000180 guarda el camafeo de Perséfone.\n@c0@"
  fr: "@a@b%0%a000180 récupère le pendentif de Magdalena.\n@c0@"
  it: "@a@b%0%a000180 prende il medaglione di Mada.\n@c0@"
  ja: "@a@b%a000180は　思い出のロケットを\n手に入れた！\n@c0@"
128:
  de: "@a@b*: Und jetzt beeilt Euch. Seine Majestät, Prinz Sebastian, wartet bereits auf Euch.\n@c0@"
  en: "@a@b*: Go along, now. His Majesty, Prince Albert is waiting for you, you know.\n@c0@"
  es: "@a@b*: Proseguid, por favor. Su Alteza el príncipe Agila os está esperando.\n@c0@"
  fr: "@a@b*ⓢ Allez-y, à présent.\nSa Majesté, le prince Albert, vous attend.\n@c0@"
  it: "@a@b*: Ora vada, Maestà.\nSua Altezza il principe Alberto desidera vederla.\n@c0@"
  ja: "@a@b＊「さあ　オジロンさまが\n\tお待ちかねで　ございますよ。\n@c0@"
129:
  de: "@a@b*: Prinz %a001240 und Prinzessin %a001250 haben sich prächtig entwickelt.\n@c0@"
  en: "@a@b*: Both Prince %a001240 and Princess %a001250 have grown up to be such fine children.\n@c0@"
  es: "@a@b*: Los príncipes %a001240 y %a001250 se han convertido en unas personitas estupendas.\n@c0@"
  fr: "@a@b*ⓢ Le prince %a001240 et la princesse %a001250 sont des enfants si gentils.\n@c0@"
  it: "@a@b*: Il principino %a001240 e la principessina %a001250 sono due bellissimi bambini.\n@c0@"
  ja: "@a@b＊「%a001240さまも　%a001250さまも\n\t本当に　立派に　お育ちで。\n@c0@"
130:
  de: "@a@b*: Was könnte sich eine alte Amme wie ich mehr wünschen? Sie sind mein ganzer Stolz, wisst Ihr.\n@c0@"
  en: "@a@b*: It's more than an old maid like me could ask for!\r\nThey mean the world to me, you know.\n@c0@"
  es: "@a@b*: ¡Una vieja doncella como yo no puede pedir más!\r\nPara mí son el mundo entero.\n@c0@"
  fr: "@a@b*ⓢ C'est bien plus que ce qu'une vieille servante comme moi pouvait espérerⓠ Vous savez, ils sont tout pour moi.\n@c0@"
  it: "@a@b*: Sono come due raggi di sole che illuminano la mia vita! Per me è come se fossero figli miei, ma forse non dovrei permettermi di dire una cosa simile...\n@c0@"
  ja: "@a@b＊「私は　もう\n\tうれしくって……。\n@c0@"
131:
  de: "@a%0%a001240@bPapa! Du wirst doch Mama suchen gehen, oder?\n@c0@"
  en: "@a%0%a001240@bDad! You're going to look for Mum, right?\n@c0@"
  es: "@a%0%a001240@b¡Papá! Vas a buscar a mamá, ¿no?\n@c0@"
  fr: "@a%0%a001240@bPapaⓠ Tu vas partir à la recherche de maman, heinⓡ\n@c0@"
  it: "@a%0%a001240@bCiao, papà!\nAllora, quando vai a cercare la mamma, eh?\n@c0@"
  ja: "@a@b%a001240「お父さん！\n\tお母さんを　さがしに\n\tゆくんでしょ！\n@c0@"
132:
  de: "@a%0%a001240@bUnd gegen alle bösen Monster kämpfen, die die Welt bedrohen!\n@c0@"
  en: "@a%0%a001240@bAnd you're going to beat up all the bad monsters that are trying to destroy the world on the way!\n@c0@"
  es: "@a%0%a001240@b¡Y de paso vas a derrotar a todos los monstruos malos que intentan destruir el mundo!\n@c0@"
  fr: "@a%0%a001240@bEt au passage, tu vas battre tous les méchants monstres qui essaient de détruire le mondeⓠ\n@c0@"
  it: "@a%0%a001240@bE già che ci sei, togli di mezzo tutti i mostri malvagi che vogliono ditruggere il mondo!\n@c0@"
  ja: "@a@b%a001240「それで　世界をほろぼす\n\t悪いヤツを　やっつけに\n\tゆくんだよねっ！\n@c0@"
133:
  de: "@a%0%a001240@bNimm uns mit, Papa! Bitte!\n@c0@"
  en: "@a%0%a001240@bTake us with you, Dad!\nPlease!\n@c0@"
  es: "@a%0%a001240@b¡Llévanos contigo, papá!\n¡Por favor!\n@c0@"
  fr: "@a%0%a001240@bEmmène-nous avec toi, papaⓠ\nS'il te plaîtⓠ\n@c0@"
  it: "@a%0%a001240@bPapà, senti...\nPossiamo venire con te?\n@c0@"
  ja: "@a@b%a001240「ねえ　ボクたちも\n\t連れていってよ。\n@c0@"
134:
  de: "@a%0%a001250@bSancho hat mir alles erzählt.\n@c0@"
  en: "@a%0%a001250@bSancho told me all about it.\n@c0@"
  es: "@a%0%a001250@bSancho me lo contó todo.\n@c0@"
  fr: "@a%0%a001250@bSancho m'a tout raconté.\n@c0@"
  it: "@a%0%a001250@bLo zio Sancho ce l'ha detto, sai?\n@c0@"
  ja: "@a@b%a001250「わたし\n\tサンチョの　おじさんから\n\t聞いたの。\n@c0@"
135:
  de: "@a%0%a001250@bAls du in unserem Alter warst, bist du auch mit Großvater auf Reisen gegangen.\n@c0@"
  en: "@a%0%a001250@bWhen you were our age, you went travelling\nwith Grandpa.\n@c0@"
  es: "@a%0%a001250@bCuando tenías nuestra edad te fuiste de viaje con el abuelo.\n@c0@"
  fr: "@a%0%a001250@bQuand tu avais notre âge, tu voyageais avec grand-père.\n@c0@"
  it: "@a%0%a001250@bQuando tu eri piccolo come noi, sei andato in giro per il mondo insieme a nonno Russel.\n@c0@"
  ja: "@a@b%a001250「お父さんも　わたしたち\n\tくらいの頃　パパスおじいちゃんに\n\t連れられて　旅をしたって。\n@c0@"
136:
  de: "@a%0%a001250@bAlso kannst du nicht sagen, dass wir zu jung sind!\n@c0@"
  en: "@a%0%a001250@bSo you can't say you're not taking us with you now!\n@c0@"
  es: "@a%0%a001250@b¡Así que ahora no puedes dejarnos aquí!\n@c0@"
  fr: "@a%0%a001250@bAlors tu n'as pas le droit de refuser de nous emmenerⓠ\n@c0@"
  it: "@a%0%a001250@bQuindi ora ci devi portare con te!\nNon sarebbe giusto se ci lasciassi qui!\n@c0@"
  ja: "@a@b%a001250「だから　わたしたちも\n\tお父さんに　ついてゆくって\n\t決めちゃったんだ！\n@c0@"
137:
  de: "@a%0%a001250@bWir können dir sogar helfen, wenn du in Schwierigkeiten gerätst.\n@c0@"
  en: "@a%0%a001250@bWe'll be able to help you when you get in trouble.\n@c0@"
  es: "@a%0%a001250@bPodemos ayudarte si te metes en líos.\n@c0@"
  fr: "@a%0%a001250@bOn pourra t'aider quand tu auras des ennuis.\n@c0@"
  it: "@a%0%a001250@bE poi potremmo aiutarti se ti trovassi in difficoltà!\n@c0@"
  ja: "@a@b%a001250「わたしたち　きっと\n\tお父さんの　力になるからねっ。\n@c0@"
138:
  de: "@a%0%a001250@bSiehst du, %a001240, ich wusste, dass er nicht Nein sagen würde. Los!\n@c0@"
  en: "@a%0%a001250@bSee, I knew he wouldn't say no, %a001240.\nCome on!\n@c0@"
  es: "@a%0%a001250@b¿Ves, %a001240? Sabía que no diría que no.\n¡Vamos!\n@c0@"
  fr: "@a%0%a001250@bTu vois, je savais qu'il ne dirait pas non, %a001240. Viensⓠ\n@c0@"
  it: "@a%0%a001250@bHai visto, %a001240?\nTe l'avevo detto che non ci avrebbe risposto di no!\nForza!\n@c0@"
  ja: "@a@b%a001250「さあ　%a001240！\n@c0@"
139:
  de: "@a%0%a001240@bGut!\n@c0@"
  en: "@a%0%a001240@bOkay!\n@c0@"
  es: "@a%0%a001240@b¡Vale!\n@c0@"
  fr: "@a%0%a001240@bD'accordⓠ\n@c0@"
  it: "@a%0%a001240@bVa bene!\n@c0@"
  ja: "@a@b%a001240「うん！\n@c0@"
140:
  de: "@a@b*: Oh, König %a000090! Ohne Euch war Humburg ein trostloser Ort. Alle haben gehofft, dass Ihr zurückkehrt.\n@c0@"
  en: "@a@b*: Your Majesty, King %a000090!\nGotha hasn't been the same without you.\nEveryone's been eagerly awaiting your return.\n@c0@"
  es: "@a@b*: ¡Su Majestad, rey %a000090!\nPankraz no ha sido el mismo sin vos.\nTodos ansiábamos vuestro regreso.\n@c0@"
  fr: "@a@b*ⓢ Votre Majesté, roi %a000090ⓠ\nGotha n'était plus le même, sans vous. \n㈡\n*ⓢ Tout le monde attendait votre retour avec impatience.\n@c0@"
  it: "@a@b*: Maestà, siamo felicissimi di rivederla a Denim!\nL'abbiamo attesa a lungo, ma sapevamo che sarebbe tornato!\n@c0@"
  ja: "@a@b＊「%a000090王！\n\t国の者は皆　あなたさまの\n\tお帰りを　待っていました！\n@c0@"
141:
  de: "@a@b*: Lang lebe König %a000090!\nFriede und Wohlstand für Humburg!\n@c0@"
  en: "@a@b*: Long live King %a000090!\nPeace and prosperity to Gotha!\n@c0@"
  es: "@a@b*: ¡Larga vida al rey %a000090!\n¡Paz y prosperidad para Pankraz!\n@c0@"
  fr: "@a@b*ⓢ Vive le roi %a000090ⓠ\nPaix et prospérité à Gothaⓠ\n@c0@"
  it: "@a@b*: Lunga vita a re %a000090!\nViva il nostro sovrano!\nViva il Regno di Denim!\n@c0@"
  ja: "@a@b＊「%a000090王　ばんざい！\n\tグランバニアに　栄光あれ！\n@c0@"
142:
  de: "@a@bWas ist mit Prinz Sebastian und den anderen?\nMan sollte sie nicht zu lange warten lassen.\n@c0@"
  en: "@a@bWhat about Prince Albert and the others?\nBetter not keep them waiting.\n@c0@"
  es: "@a@b¿Qué hay del príncipe Agila y los otros?\r\nMejor no hacerlos esperar.\n@c0@"
  fr: "@a@bEt le prince Albert et les autresⓡ\nIl vaudrait mieux ne pas les faire attendre.\n@c0@"
  it: "@a@bIl principe Alberto e gli altri stanno aspettando!\nSarebbe da veri maleducati andar via senza passare prima da loro...\n@c0@"
  ja: "@a@bオジロンたちが待っている！\n話をして行ったほうが　よいだろう……。\n@c0@"
143:
  de: "@a@b*: Ah, da bist du ja, %a000090!\n@c0@"
  en: "@a@b*: Ah, there you are, %a000090!\n@c0@"
  es: "@a@b*: ¡Ah, %a000090, ahí estás!\n@c0@"
  fr: "@a@b*ⓢ Ah, te voilà, %a000090ⓠ\n@c0@"
  it: "@a@b*: Eccoti qui, %a000090!\n@c0@"
  ja: "@a@b＊「お！　目が　さめたようだな\n\t%a000090王！\n@c0@"
144:
  de: "@a@b*: Was denn? Hast du etwa vergessen, wer ich bin? Ich bin's, Bastl, dein alter Onkel Sebastian!\n@c0@"
  en: "@a@b*: I say! You don't mean to say you've forgotten who I am, do you? It's me, Bertie! Your old Uncle Albert!\n@c0@"
  es: "@a@b*: ¡Pero bueno, chatín! No me digas que no recuerdas quién soy, ¿eh? ¡Soy yo, Agila! ¡Tu viejo tío Agila!\n@c0@"
  fr: "@a@b*ⓢ Voyonsⓠ Ne me dis pas que tu as oublié qui je suisⓠ C'est moi, Bébertⓠ Ton vieil oncle Albertⓠ\n@c0@"
  it: "@a@b*: Non ti sei dimenticato di me, vero? Sono tuo zio Alberto! Sono davvero tuo zio, non come quel ⓕbugiardoⓖ di Sancho! Ah ah ah!\n@c0@"
  ja: "@a@b＊「ん？　まさか　わしを\n\t忘れたのでは　あるまいな？\n\tわしじゃよ　オジロンじゃよ。\n@c0@"
145:
  de: "@aPrinz Sebastian@bNa ja, kein Wunder. Schließlich warst du die letzten acht Jahre eine Statue. Ein Fossil weit vor deiner Zeit!\n@c0@"
  en: "@aPrince Albert@bWell, I suppose I shouldn't be surprised.\r\nYou have spent the last eight years as a stone statue. A fossil before your time!\n@c0@"
  es: "@aPríncipe Agila@bBueno, no debería sorprenderme.\r\nTe has pasado ocho años como una estatua de piedra. ¡Estás hecho un fósil, ja ja, ja!\n@c0@"
  fr: "@aPrince Albert@bEnfin, cela n'a rien de surprenant. Tu as tout de même passé huit ans transformé en statue de pierre.\nUn fossile avant l'âgeⓠ\n@c0@"
  it: "@aPrincipe Alberto@bHo saputo che eri stato trasformato in una statua, e che sei rimasto in quello stato per otto anni.\n㈡\nScommetto che ti saranno venuti i crampi, a furia di stare nella stessa posizione per tanto tempo, eh?\nAh ah ah!\n@c0@"
  ja: "@a@bオジロン「まあ　８年ものあいだ\n\t石に　なっていたのでは\n\t無理も　ないかも知れんが……。\n@c0@"
146:
  de: "@aPrinz Sebastian@bNun gut, %a000090...\n@c0@"
  en: "@aPrince Albert@bWell anyway, %a000090...\n@c0@"
  es: "@aPríncipe Agila@bBueno, %a000090...\n@c0@"
  fr: "@aPrince Albert@bQuoi qu'il en soit, %a000090...\n@c0@"
  it: "@aPrincipe Alberto@bD'accordo, ora passiamo ad argomenti più seri.\nAscolta, %a000090...\n@c0@"
  ja: "@a@bオジロン「ところで　%a000090王。\n@c0@"
147:
  de: "@aPrinz Sebastian@bAls wir dich g'sucht haben, haben wir ein paar unglaubliche Entdeckungen g'macht.\n@c0@"
  en: "@aPrince Albert@bWhile we were looking for you, we stumbled across something rather incredible.\n@c0@"
  es: "@aPríncipe Agila@bMientras te buscábamos encontramos algo increíble.\n@c0@"
  fr: "@aPrince Albert@bPendant que nous étions à ta recherche, nous avons découvert quelque chose d'assez incroyable.\n@c0@"
  it: "@aPrincipe Alberto@bMentre ti cercavamo per mari e per monti, siamo venuti a conoscenza di una cosa molto interessante.\n@c0@"
  ja: "@a@bオジロン「わしらは　長い間\n\t%a000090王を　さがしていたが\n\tそのとちゅうで……　\n@c0@"
148:
  de: "@aPrinz Sebastian@bWir haben den Geburtsort deiner Mutter g'funden!\n@c0@"
  en: "@aPrince Albert@bWe found your mother's birthplace!\n@c0@"
  es: "@aPríncipe Agila@b¡Hallamos el sitio donde nació tu madre!\n@c0@"
  fr: "@aPrince Albert@bNous avons retrouvé l'endroit où est née ta mèreⓠ\n@c0@"
  it: "@aPrincipe Alberto@bAbbiamo scoperto il luogo di nascita di tua madre!\n@c0@"
  ja: "@a@bオジロン「ぐうぜんにも\n\tマーサどのの　ふるさとを\n\t発見したのじゃ！\n@c0@"
149:
  de: "@aPrinz Sebastian@bLudwig scheint dort nicht besonders beliebt g'wesen zu sein, aber das ist längst Vergangenheit.\n@c0@"
  en: "@aPrince Albert@bPankraz wasn't very popular there, apparently, but that's all in the past now.\n@c0@"
  es: "@aPríncipe Agila@bParece que Teudis no era muy popular por allí, pero eso es agua pasada.\n@c0@"
  fr: "@aPrince Albert@bPetros n'y était pas très apprécié, apparemment, mais tout cela appartient désormais au passé.\n@c0@"
  it: "@aPrincipe Alberto@bPare che lì Russel non fosse molto popolare, ma ciò non dovrebbe ostacolarti nelle tue ricerche.\n@c0@"
  ja: "@a@bオジロン「先代の　パパス王は\n\tずいぶん　きらわれていた\n\tらしいが　それも昔の話。\n@c0@"
150:
  de: "@aPrinz Sebastian@bIch glaube, die Leute dort würden dem Sohn einer der ihrigen nur zu gerne helfen.\n@c0@"
  en: "@aPrince Albert@bI should think the people there would be only too happy to help the son of one of their own.\n@c0@"
  es: "@aPríncipe Agila@bPienso que esas gentes ayudarán de buen grado al hijo de uno de los suyos.\n@c0@"
  fr: "@aPrince Albert@bJe crois que les gens de là-bas seraient plus qu'heureux d'aider le fils de l'une des leurs.\n@c0@"
  it: "@aPrincipe Alberto@bImmagino che gli abitanti del luogo saranno più che felici di aiutare il figlio di una di loro.\n@c0@"
  ja: "@a@bオジロン「マーサどのの　子供の\n\t%a000090王になら　チカラに\n\tなってくれるかも知れん。\n@c0@"
151:
  de: "@aPrinz Sebastian@bHier, ich zeig dir, wo es ist...\nGenau dort wurde Königin Magda g'boren.\n@c0@"
  en: "@aPrince Albert@bHere, I'll show you where it is...\r\nRight there is where Queen Mada was born.\n@c0@"
  es: "@aPríncipe Agila@bMira, te mostraré dónde está.\r\nJusto aquí nació la reina Perséfone.\n@c0@"
  fr: "@aPrince Albert@bTiens, je vais te montrer où ça se trouve...\r\nC'est juste ici. Voilà l'endroit où est née\r\nla reine Magdalena.\n@c0@"
  it: "@aPrincipe Alberto@bGuarda, ti mostro il punto esatto...\r\nQuesto è il luogo dove nacque la regina Mada.\n@c0@"
  ja: "@a@bオジロン「マーサどのの　ふるさとは\n\tたしか　このあたりだったぞ！\n@c0@"
152:
  de: "@aPrinz Sebastian@bAber sei vorsichtig, hörst du, %a000090? Bring dich nicht in Schwierigkeiten.\n@c0@"
  en: "@aPrince Albert@bBe careful, won't you, %a000090?\nDon't land yourself in a fix.\n@c0@"
  es: "@aPríncipe Agila@bTen cuidado, chatín, ¿quieres?\r\nNo te me metas en líos.\n@c0@"
  fr: "@aPrince Albert@bSois prudent, surtout, %a000090.\nNe te mets pas dans le pétrin.\n@c0@"
  it: "@aPrincipe Alberto@b%0%a000090, promettimi che starai attento.\nCerca di non metterti nei guai. Questa volta non credo che sopravviverei alla preoccupazione...\n@c0@"
  ja: "@a@bオジロン「%a000090王よ。\n\tどうか　お気をつけてな。\n@c0@"
153:
  de: "@a@b*: Ehrlich gesagt, Eure Majestät, wären wir alle froh, wenn Ihr hier bleiben würdet.\n@c0@"
  en: "@a@b*: To be honest, Your Majesty, everyone would much rather you stayed here.\n@c0@"
  es: "@a@b*: Para ser sincero, Majestad, todos preferimos que os quedéis aquí.\n@c0@"
  fr: "@a@b*ⓢ Pour être honnête, Votre Majesté, tout le monde préférerait que vous restiez ici.\n@c0@"
  it: "@a@b*: Maestà, noi sudditi di Denim vorremmo che lei non partisse...\n@c0@"
  ja: "@a@b＊「本当は　もう　王さまに\n\tどこにも　行ってほしくは\n\tありません。\n@c0@"
154:
  de: "@a@b*: Andererseits haben wir bereits acht Jahre g'wartet. Da macht ein Monat mehr oder weniger auch nichts mehr aus, meint Prinz Sebastian.\n@c0@"
  en: "@a@b*: But we've been waiting eight years already.\r\nA little longer won't hurt. That's what His Majesty, Prince Albert, says.\n@c0@"
  es: "@a@b*: Pero ya hemos esperado ocho años.\r\nPor un poco más no pasa nada. O eso dice Su Alteza, el príncipe Agila.\n@c0@"
  fr: "@a@b*ⓢ Mais nous avons déjà attendu huit ans.\nNous pouvons bien attendre encore un peu.\nC'est ce que dit Sa Majesté, le prince Albert.\n@c0@"
  it: "@a@b*: Il principe Alberto, però, ha fatto notare che lei già è stato lontano per otto anni, quindi dovremmo poter sopportare qualche giorno in più di assenza...\n@c0@"
  ja: "@a@b＊「しかし　８年も待ったのだから\n\tもう少し　待とうではないかと\n\tオジロンさまが……。\n@c0@"
155:
  de: "@a@b*: Aber passt gut auf Euch auf, hört Ihr?\n@c0@"
  en: "@a@b*: But do be careful, Your Majesty!\n@c0@"
  es: "@a@b*: ¡Pero tened cuidado, Majestad!\n@c0@"
  fr: "@a@b*ⓢ Mais soyez prudent, Votre Majestéⓠ\n@c0@"
  it: "@a@b*: Forse ha ragione lui.\nComunque sia, Maestà, cerchi di fare attenzione.\n@c0@"
  ja: "@a@b＊「%a000090王！\n\tどうか　お気をつけて！\n@c0@"
156:
  de: "@aSancho@bChico! Äh, iss meine, König %a000090!\n@c0@"
  en: "@aSancho@bFriend! Eh, I mean, King %a000090!\n@c0@"
  es: "@aSancho@b¡Chamaquito! Esto... ¡rey %a000090!\n@c0@"
  fr: "@aSancho@bChicoⓠ Euh... Je veux dire, r-roi %a000090ⓠ\n@c0@"
  it: "@aSancho@b¡Chico!\nCioè, volevo dire rey %a000090...\n@c0@"
  ja: "@a@bサンチョ「%a000090坊っちゃん！\n\tじゃなかった　%a000090王。\n@c0@"
157:
  de: "@aSancho@bPrinz Sebastian hat den Palastwachen aufgetragen, das Boot zu holen, mit dem du immer gesegelt bist.\n@c0@"
  en: "@aSancho@bPrince Albert, he ordered the castle esoldiers to breeng for you the boat you used to esail.\n@c0@"
  es: "@aSancho@bEl príncipe Agila ordenó a los soldados del castillo que le trajesen el barco que usaba, nomás.\n@c0@"
  fr: "@aSancho@bLe prince Albert a ordonné aux s-soldats du château de te r-rapporter le navire dans lequel tu voyageais.\n@c0@"
  it: "@aSancho@bEl principe Alberto ha ordinato a los soldados de prepararte la nave que avevi usato qualche año fa.\n@c0@"
  ja: "@a@bサンチョ「%a000090王が　使っていた船は\n\tオジロンどのが　兵士に命じて\n\t近くへ　移動してくださいました。\n@c0@"
158:
  de: "@aSancho@bUnd er hat den Monsterhüter, Señor Monty, gebeten, ins Castillo zu kommen. Er ist in der Schänke.\n@c0@"
  en: "@aSancho@bAnd he ees asking the monster monitor, señor Monty, to come here to the castle. You find heem now een the pub.\n@c0@"
  es: "@aSancho@bY pidió a Moncho, el monitor de monstruos, que viniera al castillo. Está en la taberna.\n@c0@"
  fr: "@aSancho@bEt il a demandé au señor Ciobair, le berger, de venir au château. Tu les trouveras à la t-taverne.\n@c0@"
  it: "@aSancho@bHa anche chiesto al señor Mister Muster, el Maestro dei Mostri, de venire aquí al castillo.\nAhora está alla tavernas.\n@c0@"
  ja: "@a@bサンチョ「２階の酒場には\n\tモンスターじいさんも\n\t呼ばれて来ています。\n@c0@"
159:
  de: "@aSancho@bDort findest du auch Hilda die Hortmutter. Sie hilft dir, Soldaten aus dem Castillo für deine Gruppe zu finden.\n@c0@"
  en: "@aSancho@bAnd you find Patty, the party planner there too.\r\nEshe geeves to you the esoldiers from the castle to join your party.\n@c0@"
  es: "@aSancho@bPues allí está también Cone-Cone, la organizadora de grupos.\n㈡\nElla le dará los soldados del castillo que formarán parte de su grupo, nomás.\n@c0@"
  fr: "@aSancho@bTu y trouveras aussi Tulipe, la chef d'équipe.\r\nElle permet aux s-soldats du château de se joindre à ton équipe.\n@c0@"
  it: "@aSancho@bLì ce troverai anche Greta l'Organizzagruppo.\r\nLei te dirà quali soldados potranno unirse al tuo gruppo.\n@c0@"
  ja: "@a@bサンチョ「それから　酒場にいる\n\tルイーダさんに　たのめば　城の者を\n\t連れて出られるでしょう。\n@c0@"
160:
  de: "@aSancho@bAber iss hoffe, dass du auch deinen alten Onkel Sancho bittest, diss zu begleiten, Chico.\n@c0@"
  en: "@aSancho@bI hope you weell ask your Uncle Sancho to accompany you esometimes too, friend.\n@c0@"
  es: "@aSancho@bEspero que alguna vez pidas al menzo de tu tito Sancho que te acompañe, chamaquito.\n@c0@"
  fr: "@aSancho@bJ'espère que tu demanderas aussi à tonton Sancho de t'accompagner de temps en temps, chico.\n@c0@"
  it: "@aSancho@bEspero que qualche vez permetterai allo zio Sancho de accompagnarte, chico.\n@c0@"
  ja: "@a@bサンチョ「たまには　この私も\n\t旅のお供を　させてくださいね。\n@c0@"
161:
  de: "@aSancho@bSi, iss bin alt geworden, aber mit diesen jungen Kerlen werde iss immer noch fertig!\n@c0@"
  en: "@aSancho@bSí, I am old these days, but the young ones, they no beat me! No, no, no, señor!\n@c0@"
  es: "@aSancho@b¡Sí, ya estoy bien ruco, pero ni modo me van a ganar! ¡No, no, no, señor!\n@c0@"
  fr: "@aSancho@bJe commence à me faire vieux, c'est sûr, mais je ne vaux pas moins qu'oun jeuneⓠ No, no, no, señorⓠ\n@c0@"
  it: "@aSancho@bForse no soy muy giovane, ma ho mucha experiencia.\n¡Pienso que potrei esserte muy utile, chico!\n@c0@"
  ja: "@a@bサンチョ「年老いたといえども\n\tこのサンチョ　まだまだ\n\t若い者には　負けませんぞ！\n@c0@"
162:
  de: "@a@b*: Mir wurde von Eurem Vater, König Ludwig, aufgetragen, Nachforschungen über ein Schloss namens Zenithia anzustellen.\n@c0@"
  en: "@a@b*: I was ordered by your father, King Pankraz, to carry out research into a castle called Zenithia.\n@c0@"
  es: "@a@b*: Vuestro padre, el rey Teudis, me ordenó que investigara acerca del castillo de un reino llamado Zenithia.\n@c0@"
  fr: "@a@b*ⓢ Votre père, le roi Petros, m'avait chargé de mener des recherches sur un royaume appelé Zénithia.\n@c0@"
  it: "@a@b*: Suo padre, il povero re Russel, mi ordinò di effettuare delle ricerche su un castello chiamato Zenithia.\n@c0@"
  ja: "@a@b＊「私は　王さまの父上　パパスさまに\n\t命じられ　天空の城について\n\t長い間　研究してきました。\n@c0@"
163:
  de: "@a@b*: Bisher habe ich Folgendes herausgefunden...\n@c0@"
  en: "@a@b*: So far, I've discovered this...\n@c0@"
  es: "@a@b*: De momento he descubierto esto:\n@c0@"
  fr: "@a@b*ⓢ Pour l'instant, voici ce que j'ai découvert...\n@c0@"
  it: "@a@b*: Ho scoperto qualche altra cosa interessante...\n@c0@"
  ja: "@a@b＊「そして　分かったことは……\n@c0@"
164:
  de: "@a@b*: Früher lag Zenithia oben im Himmel, doch nun ist es weg. Und auch der Drachengott, der dort einst lebte, ist verschwunden.\n@c0@"
  en: "@a@b*: Zenithia's supposed to be up in the sky, but it isn't any more. And the whereabouts of the Dragon God who used to live there are a mystery.\n@c0@"
  es: "@a@b*: Zenithia se encontraba en el cielo, pero ya no está ahí. Y el paradero del Dios Dragón que allí vivía es un misterio.\n@c0@"
  fr: "@a@b*ⓢ Zénithia devrait flotter dans le ciel, mais ce n'est plus le cas. Et personne ne sait où est passé le dieu dragon qui y vivait. C'est un vrai mystère.\n@c0@"
  it: "@a@b*: Zenithia non fluttua più in cielo, come invece dovrebbe fare.\n㈡\n*: Inoltre il Drago Divino, che un tempo viveva nel Castello di Zenithia, è sparito e non si sa dove si trovi adesso.\n@c0@"
  ja: "@a@b＊「天空には　すでに城はなく　そこに\n\t住んでいた　竜の神さまも　いずこへか\n\t姿を　消してしまったということです。\n@c0@"
165:
  de: "@a@b*: Vielleicht kehrt ja wieder Frieden in der Welt ein, wenn das Schloss und der Gott wieder an ihrem angestammten Platz sind.\n@c0@"
  en: "@a@b*: Perhaps if the castle and its Dragon God were restored to their rightful places, the world would\r\nbe restored to peace.\n@c0@"
  es: "@a@b*: Si el castillo y el Dios Dragón fueran devueltos al lugar que les corresponde, quizás el mundo podría recobrar la paz.\n@c0@"
  fr: "@a@b*ⓢ Peut-être que si le château et son dieu dragon retrouvaient leur place, le monde connaîtrait à nouveau la paix.\n@c0@"
  it: "@a@b*: Continuo a credere che, se il Castello di Zenithia e il Drago Divino tornassero al loro posto, il mondo ritroverebbe la pace.\n@c0@"
  ja: "@a@b＊「もし再び　天空の城を\n\t存在せしめられたなら……\n@c0@"
166:
  de: "@a@b*: Das ist natürlich nur eine Theorie, aber man kann ja nie wissen.\n@c0@"
  en: "@a@b*: It's just a theory of course, but you never know.\n@c0@"
  es: "@a@b*: Solo es una teoría, claro, pero nunca se sabe.\n@c0@"
  fr: "@a@b*ⓢ Ça n'est qu'une théorie, bien sûr, mais on ne sait jamais.\n@c0@"
  it: "@a@b*: Ovviamente, la mia è solo una teoria, e non ci sono prove che possano confermarne la fondatezza...\n@c0@"
  ja: "@a@b＊「平和な時代が　やってくるのかも\n\t知れませんが……。\n@c0@"
167:
  de: "@a@b*: Eure Majestät! Prinz Sebastian hat uns von Euren Plänen erzählt. Bitte seid vorsichtig!\n@c0@"
  en: "@a@b*: Your Majesty! Prince Albert has informed us of the situation. Take care, sir!\n@c0@"
  es: "@a@b*: ¡Majestad! El príncipe Agila nos ha informado de la situación. ¡Cuidaos, señor!\n@c0@"
  fr: "@a@b*ⓢ Votre Majestéⓠ Le prince Albert nous a informés de la situation. Soyez prudent, Sireⓠ\n@c0@"
  it: "@a@b*: Maestà, il principe Alberto ci ha spiegato la situazione fin nei minimi dettagli. Non si esponga a rischi inutili, Sire! Lo faccia per i suoi sudditi!\n@c0@"
  ja: "@a@b＊「%a000090王！　オジロンさまから\n\t話は　うかがっております。\n\tどうか　お気をつけて！\n@c0@"
168:
  de: "@a@b*: Diese seltsame dunkle Wolke breitet sich immer weiter über dem Himmel aus.\n@c0@"
  en: "@a@b*: That strange, dark cloud is spreading even further over the sky.\n@c0@"
  es: "@a@b*: Esa extraña nube oscura se extiende aún más por el cielo.\n@c0@"
  fr: "@a@b*ⓢ Cet étrange nuage noir ne cesse de s'étendre dans le ciel.\n@c0@"
  it: "@a@b*: Quella strana nuvola oscura diventa sempre più grande...\nSembra quasi che voglia ricoprire tutto il cielo!\n@c0@"
  ja: "@a@b＊「最近　前にも　まして\n\tおかしな雲が　空を\n\tおおっています。\n@c0@"
169:
  de: "@a@b*: Der Großmeister der Unterwelt soll sie heraufb'schworen haben... Ich weiß net, ob das stimmt, aber g'fallen tut mir das Ganze net.\n@c0@"
  en: "@a@b*: People say it's the coming of the Grandmaster of the Underworld... I, I don't know if there's any truth in it, but I know I don't like the sound of it.\n@c0@"
  es: "@a@b*: La gente dice que anuncia la llegada del Gran Maestro del Inframundo. No sé si será verdad, pero desde luego tiene muy mala pinta.\n@c0@"
  fr: "@a@b*ⓢ Les gens racontent qu'il annonce l'arrivée du Grand Maître des Enfers... Je ne sais pas s'ils ont raison, mais une chose est sûreⓢ je n'aime pas ça.\n@c0@"
  it: "@a@b*: In giro si dice che preannunci la venuta del Gran Maestro degli Inferi.\n㈡\n*: Forse è solo una storiella inventata di sana pianta, ma a sentirla vengono i brividi!\n@c0@"
  ja: "@a@b＊「闇の世界から　大魔王が\n\tやってくるという　ウワサは\n\t本当なのでしょうか……。\n@c0@"
170:
  de: "@a@b*: Die Leute kommen in Scharen nach Humburg, um %O0960%XEure Rückkehr zu feiern, Eure Majestät%Ydie Rückkehr von König %a000090 zu feiern%Z.\n@c0@"
  en: "@a@b*: People are coming to Gotha in droves to celebrate %O0960%Xyour return, Your Majesty%Ythe return of King %a000090%Z.\n@c0@"
  es: "@a@b*: La gente viene en masa a Pankraz para celebrar %O0960%Xvuestro regreso, Majestad%Yel regreso del rey %a000090%Z.\n@c0@"
  fr: "@a@b*ⓢ Les gens affluent en masse vers Gotha pour célébrer %O0960%Xvotre retour, Votre Majesté%Yle retour du roi %a000090%Z.\n@c0@"
  it: "@a@b*: Stanno giungendo moltissime persone per celebrare %O0960%Xil suo ritorno, Maestà%Yil ritorno di re %a000090%Z.\n@c0@"
  ja: "@a@b＊「いろんな人たちが\n\t%a000090王の帰りを　よろこび\n\tこの城に　やってきています。\n@c0@"
171:
  de: "@a@b*: Ich hoffe, dass die Vorbereitungen für Eure Reise gut vorangehen.\n@c0@"
  en: "@a@b*: I hope the preparations for your trip go well.\n@c0@"
  es: "@a@b*: Espero que los preparativos de vuestro viaje vayan bien.\n@c0@"
  fr: "@a@b*ⓢ J'espère que les préparatifs de votre voyage se passent bien.\n@c0@"
  it: "@a@b*: Arrivano proprio ora che %O0960%Xlei%Yil nostro sovrano%Z sta per ripartire.\nMi auguro che il suo viaggio vada nel migliore dei modi...\n@c0@"
  ja: "@a@b＊「どうか　ここで\n\t旅のしたくを　ととのえて\n\tいかれますように！\n@c0@"
172:
  de: "@a@b*: Ohh! Mein Kopf bringt mich noch um. Das war wohl ein Glas zu viel letzte Nacht.\n@c0@"
  en: "@a@b*: Urgh! My head's killing me.\nThat was one glass too many last night.\n@c0@"
  es: "@a@b*: ¡Argh! La cabeza me mata.\r\nAnoche bebí demasiado.\n@c0@"
  fr: "@a@b*ⓢ Ouilleⓠ Ma tête va exploser.\nJ'ai bu un verre de trop, hier soir.\n@c0@"
  it: "@a@b*: Urgh! Questo mal di testa mi sta uccidendo...\nNon avrei dovuto fare tanto tardi la notte scorsa...\n@c0@"
  ja: "@a@b＊「うう　頭が　いたい……。\n\tゆうべは　飲みすぎたかなあ……。\n@c0@"
173:
  de: "@a@b*: Seit der Kanzler weg ist und Ihr König von Humburg seid, bewohnen Seine Majestät Prinz Sebastian und seine Familie diese Gemächer.\n@c0@"
  en: "@a@b*: Now that the Chancellor's gone and you've become King of Gotha, His Majesty Prince Albert and his family occupy these chambers.\n@c0@"
  es: "@a@b*: Ahora que el canciller no está y sois el rey de Pankraz, Su Alteza, el príncipe Agila, y su familia ocupan estos aposentos.\n@c0@"
  fr: "@a@b*ⓢ Maintenant que le chancelier est parti et que vous êtes devenu roi de Gotha, Sa Majesté le prince Albert et sa famille occupent ces pièces.\n@c0@"
  it: "@a@b*: Da quando il Ministro è sparito e %O0960%Xlei è diventato Re di Denim%Yre %a000090 è salito sul trono di Denim%Z, queste camere sono occupate dal principe Alberto e dalla sua famiglia.\n@c0@"
  ja: "@a@b＊「ここは　昔は大臣の部屋でしたが\n\t今は　オジロンさま一家が\n\tお住まいです。\n@c0@"
174:
  de: "@aGertraud@bVater war so damit beschäftigt, %O0960%Xdich%YKönig %a000090%Z zu suchen, dass er überhaupt keine Zeit mehr für mich hatte.\n@c0@"
  en: "@aGertrude@bFather's been so busy looking for %O0960%Xyou%YKing %a000090%Z, he hasn't had any time at all for me, or anything else for that matter.\n@c0@"
  es: "@aFredegunda@bMi padre ha estado tan ocupado %O0960%Xbuscándoos%Ybuscando al rey %a000090%Z que no ha tenido tiempo para mí. Ni para nada más, en realidad.\n@c0@"
  fr: "@aGertrude@bPère a été si occupé à %O0960%Xte chercher%Ychercher le roi %a000090%Z qu'il n'avait presque pas de temps à me consacrer, ni à quoi que ce soit d'autre, d'ailleurs.\n@c0@"
  it: "@aGertrude@bNegli ultimi otto anni mio padre non ha avuto tempo per occuparsi di me, perchè è stato troppo impegnato a %O0960%Xcercarti%Ycercare re %a000090%Z e a governare il paese.\n@c0@"
  ja: "@a@bドリス「%a000090王が　城を\n\t留守にしてばっかりだから　パパが\n\tちっともヒマに　ならないのよ。\n@c0@"
175:
  de: "@aGertraud@bNa ja, wenigstens ist er mir nicht auf die Nerven gegangen.\n@c0@"
  en: "@aGertrude@bAt least it meant he wasn't nagging at me all\r\nthe time, though.\n@c0@"
  es: "@aFredegunda@bLo que también significa que no me ha estado fastidiando, claro.\n@c0@"
  fr: "@aGertrude@bEnfin, au moins, il n'était pas tout le temps sur mon dos.\n@c0@"
  it: "@aGertrude@bMi sono sentita sola e abbandonata.\nA una figlia fa sempre piacere sentire accanto a sé la presenza di suo padre...\n@c0@"
  ja: "@a@bドリス「でも　そのぶん　あたしは\n\tうるさく言われなくて\n\tすむけどね。\n@c0@"
176:
  de: "@a@b*: Seit %O0960%XEurem Verschwinden, Eure Majestät,%Ydem Verschwinden von König %a000090%Z hat Humburg eine Menge Leute verloren.\n@c0@"
  en: "@a@b*: Gotha's lost a lot of people since %O0960%Xyou went missing, Your Majesty%YKing %a000090 went missing%Z.\n@c0@"
  es: "@a@b*: Pankraz ha perdido mucha población desde que %O0960%Xdesaparecisteis, Majestad%Ydesapareció el rey %a000090%Z.\n@c0@"
  fr: "@a@b*ⓢ Gotha a perdu beaucoup d'habitants depuis %O0960%Xvotre disparition, Votre Majesté%Yla disparition du roi %a000090%Z.\n@c0@"
  it: "@a@b*: Molta gente ha abbandonato il Regno di Denim durante %O0960%Xla sua assenza forzata, Maestà%Yl'assenza forzata di re %a000090%Z.\n@c0@"
  ja: "@a@b＊「%a000090王が　いないあいだに\n\tこの国も　ずいぶん\n\t人が　へってしまいました。\n@c0@"
177:
  de: "@a@b*: Mein Vater war einer von ihnen. Er verließ die Stadt und kam nie wieder. Er war ein berühmter Handwerker, wisst Ihr.\n@c0@"
  en: "@a@b*: My father's one of them. He left and never came back. He was a bit of a legend here in Gotha, you know. A famous craftsman.\n@c0@"
  es: "@a@b*: Mi padre está entre ellos. Se marchó y no volvió. Era casi una leyenda en Pankraz, un famoso artesano.\n@c0@"
  fr: "@a@b*ⓢ Mon père en fait partie. Il a quitté la ville définitivement. Il était très connu à Gotha, vous savez. C'était un artisan célèbre.\n@c0@"
  it: "@a@b*: Un tempo, anche mio padre viveva a Denim, poi se n'è andato e non ha più fatto ritorno. Era un abilissimo artigiano, un vero maestro nel suo campo.\n@c0@"
  ja: "@a@b＊「伝説の名工だった\n\t私の父も　けっきょく　戻っては\n\t来ませんでしたし……。\n@c0@"
178:
  de: "@a@b*: Ich würde sehr gerne mit %O0960%XEuch gehen, Eure Majestät%YKönig %a000090 gehen%Z.\n@c0@"
  en: "@a@b*: In all honesty, I'd like to go with %O0960%Xyou, Your Majesty%YKing %a000090%Z.\n@c0@"
  es: "@a@b*: Con el corazón en la mano, me gustaría ir con %O0960%Xvos, Majestad%Yel rey %a000090%Z.\n@c0@"
  fr: "@a@b*ⓢ Très sincèrement, j'aimerais bien %O0960%Xvous accompagner, Votre Majesté%Yaccompagner le roi %a000090%Z.\n@c0@"
  it: "@a@b*: Mi piacerebbe molto %O0960%Xaccompagnarla, Maestà%Yaccompagnare re %a000090 nella sua ricerca%Z, ma non credo di poterlo fare.\n@c0@"
  ja: "@a@b＊「本当なら　%a000090王を助けて\n\tいっしょに　旅に出たいところ\n\tですが……\n@c0@"
179:
  de: "@a@b*: Aber leider gibt es so wenige Soldaten hier, dass wir ganz schön ranklotzen müssen, um das Schloss zu bewachen.\n@c0@"
  en: "@a@b*: But there are so few soldiers here at the castle now, we've got our work cut out just making sure the place is secure.\n@c0@"
  es: "@a@b*: Pero quedan muy pocos soldados, y bastante nos cuesta ya mantener la seguridad en el castillo.\n@c0@"
  fr: "@a@b*ⓢ Mais il reste tellement peu de soldats au château qu'en assurer la sécurité nous rajoute encore du travail.\n@c0@"
  it: "@a@b*: In questo periodo al castello ci sono pochi soldati, e c'è bisogno di uomini validi per garantire la sicurezza del Regno.\n@c0@"
  ja: "@a@b＊「残った兵士たちや　私たちでは\n\tこの国を守るのが\n\t精いっぱいなんです。\n@c0@"
180:
  de: "@a@b*: Seit %O0960%XEurem Verschwinden, Eure Majestät,%Ydem Verschwinden von König %a000090%Z hat Humburg eine Menge Leute verloren.\n@c0@"
  en: "@a@b*: Gotha's lost a lot of people since %O0960%Xyou went missing, Your Majesty%YKing %a000090 went missing%Z.\n@c0@"
  es: "@a@b*: Pankraz ha perdido mucha población desde que %O0960%Xdesaparecisteis, Majestad%Ydesapareció el rey %a000090%Z.\n@c0@"
