  it: "@aCommendator Pourcel@bHo deciso di abbellire il nostro giardino con questa scultura per celebrare la nascita del nostro Lino.\n@c0@"
  ja: "@a@b夫「ジージョも　生まれたことだし\n\tわが家の　守り神として\n\t庭に　かざろうと思ってな。\n@c0@"
