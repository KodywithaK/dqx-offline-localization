  it: "@aBonocore@bQuando %H0860%Xsei stato portato qui, i soldi e gli oggetti di cui eri%Ysiete stati portati qui, i soldi e gli oggetti di cui eravate%Z in possesso sono stati messi in quel barile.\n@c0@"
