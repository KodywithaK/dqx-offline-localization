  fr: "@aAbbesse du Firmament@bGardez bien en tête que vous n'êtes jamais seul.\nLa Déesse veille sur vous. À chaque instantⓠ\n@c0@"
  it: "@aMadre superiora@bMa ricorda che non sei solo.\nLa dea misericordiosa è sempre accanto agli spiriti nobili, e non fa mai mancare loro la sua protezione.\n@c0@"
  ja: "@a@b＊「しかし　神さまが\n\t見守っていてくださることを\n\t忘れずに……。\n@c0@"
