221:
  de: "@a@b%0%a000090 erhält eine Schlichte Statuette.\n@c0@"
  en: "@a@b%0%a000090 receives a crude image.\n@c0@"
  es: "@a@b%0%a000090 recibe una imagen tosca.\n@c0@"
  fr: "@a@b%0%a000090 reçoit une statuette grossière.\n@c0@"
  it: "@a@b%0%a000090 ha ricevuto una statuetta grezza.\n@c0@"
  ja: "@a@b%a000090は　木ぼりの女神像を\n受けとった！\n@c0@"
222:
  de: "@a@b%0%a000180 steckt die Schlichte Statuette ein.\n@c0@"
  en: "@a@b%0%a000180 acquires a crude image.\n@c0@"
  es: "@a@b%0%a000180 obtiene una imagen tosca.\n@c0@"
  fr: "@a@b%0%a000180 récupère la statuette grossière.\n@c0@"
  it: "@a@b%0%a000180 prende la statuetta grezza.\n@c0@"
  ja: "@a@b%a000180は　木ぼりの女神像を\n手に入れた！\n@c0@"
223:
  de: "@aNonne von Obendroben@bDie Statuette haben wir Nonnen des Stifts Obendroben mit Liebe und Gebeten erschaffen.\n@c0@"
  en: "@aNun of the Above@bThat statue was carved with love and prayers by we nuns of Heaven's Above Abbey.\n@c0@"
  es: "@aHermana subcelestial@bEsta estatua fue tallada con amor y plegarias por las monjas de la Abadía Subcelestis.\n@c0@"
  fr: "@aSœur du Firmament@bMes sœurs de l'abbaye du Firmament et moi-même avons mis beaucoup d'amour et de prières dans la réalisation de cette statuette.\n@c0@"
  it: "@aSuora di Su'ncyel@bQuesta statuetta è stata realizzata da noi suore dell'Abbazia.\nIn essa c'è tutto l'amore che proviamo per la dea.\n@c0@"
  ja: "@a@b＊「それは　私たち　修道院に暮らす者が\n\t祈りをこめて　彫ったものです。\n@c0@"
224:
  de: "@aNonne von Obendroben@bSie hat keine besonderen Kräfte oder dergleichen, aber sie wird Euch hoffentlich an Eure Zeit hier erinnern.\n@c0@"
  en: "@aNun of the Above@bIt doesn't have any special powers or anything like that, but I hope it will at least make a nice keepsake of your time here.\n@c0@"
  es: "@aHermana subcelestial@bNo tiene poderes especiales ni nada parecido, pero espero que te sirva como un bonito recuerdo de tu estancia aquí.\n@c0@"
  fr: "@aSœur du Firmament@bElle n'a aucun pouvoir particulier, mais j'espère qu'au moins, elle vous rappellera agréablement votre séjour parmi nous.\n@c0@"
  it: "@aSuora di Su'ncyel@bNon ha alcun potere magico, ma spero che per %H0860%Xte%Yvoi%Z sia un bel ricordo del tempo che %H0860%Xhai%Yavete%Z trascorso qui.\n@c0@"
  ja: "@a@b＊「とくべつなチカラが　宿るものでは\n\tありませんが　この修道院へいらした\n\t記念に　どうぞ　お持ちください。\n@c0@"
225:
  de: "@aNonne von Obendroben@bSeht Ihr, wir hier im Stift nähen unsere eigene Kleidung und versorgen uns selbst mit Nahrung.\n@c0@"
  en: "@aNun of the Above@bWe make all of our own clothes and grow our own food here at the abbey, you see.\n@c0@"
  es: "@aHermana subcelestial@bComo ves, en la abadía confeccionamos nuestra ropa y cultivamos nuestra comida.\n@c0@"
  fr: "@aSœur du Firmament@bNous tissons nos propres vêtements et nous cultivons tout ce que nous mangeons.\n@c0@"
  it: "@aSuora di Su'ncyel@bQui all'Abbazia di Su'ncyel cuciamo gli abiti che indossiamo, e coltiviamo i campi per produrre il cibo che serve per il nostro sostentamento.\n@c0@"
  ja: "@a@b＊「修道院では　衣服も食事も\n\tすべて　自分たちが作ったもので\n\tまかなっています。\n@c0@"
226:
  de: "@aNonne von Obendroben@bDarum sind wir es gewohnt, Dinge selbst zu machen.\n@c0@"
  en: "@aNun of the Above@bSo we're used to making things for ourselves.\n@c0@"
  es: "@aHermana subcelestial@bEstamos acostumbradas a cuidar de nosotras mismas.\n@c0@"
  fr: "@aSœur du Firmament@bNous sommes habituées à tout fabriquer\r\nnous-mêmes.\n@c0@"
  it: "@aSuora di Su'ncyel@bFacciamo del nostro meglio per essere autosufficienti.\n@c0@"
  ja: "@a@b＊「ですから　自然と　何かを作ることに\n\tなれて行くのですわ。\n@c0@"
227:
  de: "@a@b*: Ich bin hier, weil ich meinem Mann davongelaufen bin. Er ist ein gemeiner alter Grobian, und was für einer.\n@c0@"
  en: "@a@b*: I'm here 'cos I ran away from my husband. He's a mean old ruffian, so he is.\n@c0@"
  es: "@a@b*: Vine aquí huyendo de mi marido. Es un rufián y un malvado.\n@c0@"
  fr: "@a@b*ⓢ Je suis ici parce que je suis partie de chez moi. Mon mari n'est qu'un méchant bon à rien. \n@c0@"
  it: "@a@b*: Sono arrivata qui dopo essere scappata da quel mascalzone di mio marito.\n@c0@"
  ja: "@a@b＊「あたしゃ　亭主から\n\t逃げて来たんだよ。\n\tとんでもない　らんぼう者でね。\n@c0@"
228:
  de: "@a@b*: Was? Ihr seid auch von irgendwo weggelaufen? Tja, die Welt ist klein, nicht wahr?\n@c0@"
  en: "@a@b*: Eh? You run away from somewhere an' all, did you? It's a small world!\n@c0@"
  es: "@a@b*: ¿Eh? ¿Llegaste aquí huyendo de alguien? ¡Qué coincidencia!\n@c0@"
  fr: "@a@b*ⓢ Commentⓡ Toi aussi, tu t'es enfui de quelque partⓡ C'est fouⓠ\n@c0@"
  it: "@a@b*: Come %H0860%Xdici? Anche tu sei finito qui dopo essere scappato%Ydite? Anche voi siete finiti qui dopo essere scappati%Z da un posto orribile?\nCapisco...\n@c0@"
  ja: "@a@b＊「おや？　あんたも　どこかから\n\t逃げてきたのかい？\n\tそりゃ　きぐうだねえ。\n@c0@"
229:
  de: "@aNonne von Obendroben@bIch habe schon von Eurem Schicksal gehört, armer Junge! Zehn Jahre lang ein Sklave! Aber wenigstens seid Ihr jetzt frei.\n@c0@"
  en: "@aNun of the Above@bI've heard all about what happened to you, you poor thing. A slave for ten years! But now you're free at last.\n@c0@"
  es: "@aHermana subcelestial@bHe oído todo lo que te ha sucedido, pobre muchacho. ¡Diez años de esclavitud! Pero al fin eres libre.\n@c0@"
  fr: "@aSœur du Firmament@bJ'ai appris ce qui vous était arrivé, mon pauvre enfant. Esclave pendant dix longues annéesⓠ\nAu moins, vous êtes libre maintenant.\n@c0@"
  it: "@aSuora di Su'ncyel@bHo saputo cosa ti è successo... Lavorare come uno schiavo per dieci anni dev'essere un'esperienza orribile. Però ora sei finalmente libero.\n@c0@"
  ja: "@a@b＊「お話は聞いています。\n\t１０年以上も　ドレイとして　はたらき\n\tやっと　自由の身になったとか。\n@c0@"
230:
  de: "@aNonne von Obendroben@bIch bin sicher, Ihr werdet Euch nie wieder dem Willen eines anderen beugen müssen.\n@c0@"
  en: "@aNun of the Above@bI'm sure there will never again come a time when you are forced to submit to the will of another.\n@c0@"
  es: "@aHermana subcelestial@bSeguro que no volverás a verte obligado a someterte a la voluntad de otro.\n@c0@"
  fr: "@aSœur du Firmament@bJe suis certaine que plus personne ne pourra vous soumettre à sa volonté.\n@c0@"
  it: "@aSuora di Su'ncyel@bSono certa che non vivrai più la disumana condizione di essere assoggettato al volere di un altro individuo.\n@c0@"
  ja: "@a@b＊「あなたは　もう誰からも\n\t命令されないでしょう。\n@c0@"
231:
  de: "@aNonne von Obendroben@bEuer Vater ist jetzt ein Engel im Himmel.\n@c0@"
  en: "@aNun of the Above@bYour father is an angel in heaven now.\n@c0@"
  es: "@aHermana subcelestial@bAhora tu padre es un ángel del cielo.\n@c0@"
  fr: "@aSœur du Firmament@bVotre père est au ciel désormais.\n@c0@"
  it: "@aSuora di Su'ncyel@bTuo padre ora è in cielo, tra gli angeli.\n@c0@"
  ja: "@a@b＊「父上も　亡くなられた今\n\tどこへ行き　何をするか……\n@c0@"
232:
  de: "@aNonne von Obendroben@bDarum ist es an Euch allein zu entscheiden, was die Zukunft Euch bringt, wo Ihr hingehen und was Ihr tun wollt.\n@c0@"
  en: "@aNun of the Above@bSo it's for you and you alone to decide what the future holds, where you'll go and what you'll do.\n@c0@"
  es: "@aHermana subcelestial@bAsí que tú y solo tú debes decidir tu futuro: dónde irás, qué quieres hacer...\n@c0@"
  fr: "@aSœur du Firmament@bAlors c'est à vous seul de décider ce que le futur vous réserve, où vous irez et ce que vous ferez.\n@c0@"
  it: "@aSuora di Su'ncyel@bAdesso solo tu puoi decidere cosa fare della tua vita, e come costruire il tuo futuro.\n@c0@"
  ja: "@a@b＊「これからは　すべて　自分で\n\t考えなくては　なりません。\n@c0@"
233:
  de: "@aNonne von Obendroben@bAber das ist kein Grund zur Panik. Die Freiheit ist die Essenz des Lebens, und Ihr müsst sie genießen.\n@c0@"
  en: "@aNun of the Above@bBut don't let this overwhelm you. This freedom is the essence of life, and you must savour it.\n@c0@"
  es: "@aHermana subcelestial@bPero no te sientas abrumado. Esta libertad es la esencia de la vida, y debes saborearla.\n@c0@"
  fr: "@aSœur du Firmament@bMais que cette idée ne vous panique pas.\r\nCette liberté est la quintessence de la vie et vous devez l'apprécier à sa juste valeur.\n@c0@"
  it: "@aSuora di Su'ncyel@bNon lasciare che il peso di questa possibilità opprima il tuo spirito. La libertà di scelta rende la vita meravigliosa, e devi assaporarla fino in fondo.\n@c0@"
  ja: "@a@b＊「しかし　負けないでくださいね。\n\tそれが　生きるということ\n\tなのですから。\n@c0@"
234:
  de: "@aNonne von Obendroben@bAls ich damals auf Reisen war und einmal eine Rast machte, habe ich vom Orden vom Zugzwang gehört.\n@c0@"
  en: "@aNun of the Above@bI heard talk of the Order of Zugzwang a little while ago when I was staying at a town on my travels.\n@c0@"
  es: "@aHermana subcelestial@bOí hablar de la Orden de Zugzwang hace tiempo en una ciudad, durante un viaje.\n@c0@"
  fr: "@aSœur du Firmament@bJ'ai entendu parler de l'Ordre du Zugzwang il y a quelque temps, lors de l'un de mes voyages.\n@c0@"
  it: "@aSuora di Su'ncyel@bHo sentito parlare della Setta di Zugzwang un po' di tempo fa, quando mi fermai in un villaggio per riposare durante un lungo pellegrinaggio.\n@c0@"
  ja: "@a@b＊「光の教団のウワサは\n\tしばらく前に　旅先の町で\n\t聞いたことがあります。\n@c0@"
235:
  de: "@aNonne von Obendroben@bSie streben offenbar eine Art Utopia an, wo jeder glücklich und in Frieden leben kann.\n@c0@"
  en: "@aNun of the Above@bIt seems they want to create some kind of utopia where everyone can live in happiness and peace.\n@c0@"
  es: "@aHermana subcelestial@bParece que quieren crear una utopía en la que todos puedan vivir felices y en paz.\n@c0@"
  fr: "@aSœur du Firmament@bJ'ai cru comprendre que leur objectif était de créer une sorte de monde utopique, dans lequel tout le monde pourrait vivre dans la joie et la paix.\n@c0@"
  it: "@aSuora di Su'ncyel@bSe non ricordo male, il suo scopo è la creazione di una società felice.\nSecondo me, è pura utopia.\n@c0@"
  ja: "@a@b＊「なんでも　すべての人が\n\t幸せになれる　理想の国を\n\t作るのだとか。\n@c0@"
236:
  de: "@aNonne von Obendroben@bEine wundervolle Vorstellung, wirklich. Aber das Glück seiner eigenen Familie und Freunde muss Vorrang vor allem anderen haben.\n@c0@"
  en: "@aNun of the Above@bIt would be wonderful if this ideal world was possible, but the happiness of one's family and friends has to be one's first priority.\n@c0@"
  es: "@aHermana subcelestial@bSería maravilloso que ese mundo ideal fuera posible, pero la principal prioridad debe ser la felicidad de la familia y los amigos.\n@c0@"
  fr: "@aSœur du Firmament@bCe serait merveilleux si ce monde idéal existait, mais en attendant, le bonheur de sa famille et de ses amis doit être la priorité de chacun.\n@c0@"
  it: "@aSuora di Su'ncyel@bSarebbe meraviglioso vivere in un mondo dove tutti sono felici, ma il punto di partenza dev'essere l'armonia tra noi e le persone che amiamo.\n㈡\nNon è possibile pianificare a priori la realizzazione di una società come quella vagheggiata dalla Setta di Zugzwang...\n@c0@"
  ja: "@a@b＊「理想をかかげるのは　すばらしいこと\n\tですが　まずは　自分の家族や\n\t身近な人々を　幸せにすることが……\n@c0@"
237:
  de: "@aNonne von Obendroben@bKönnten sie auch nur das gewährleisten, so würde das schon reichen, um alle glücklich zu machen!\n@c0@"
  en: "@aNun of the Above@bIf people could just ensure that much, then everyone would end up happy that way too!\n@c0@"
  es: "@aHermana subcelestial@b¡Si todo el mundo lograra eso, también así se alcanzaría la felicidad general!\n@c0@"
  fr: "@aSœur du Firmament@bSi tout le monde veillait à cela, nous pourrions déjà tous être très heureuxⓠ\n@c0@"
  it: "@aSuora di Su'ncyel@bSe ciascuno di noi amasse davvero il proprio prossimo, allora sì che si realizzerebbe il sogno della pace e dell'armonia universali!\n@c0@"
  ja: "@a@b＊「やがては　すべての人々の幸せに\n\tつながるのでは　ないでしょうか。\n@c0@"
238:
  de: "@aNonne von Obendroben@bDiesen Raum nutzen wir, um besonders wichtige weibliche Gäste unterzubringen.\n@c0@"
  en: "@aNun of the Above@bThis room is set aside for when we receive important lady guests.\n@c0@"
  es: "@aHermana subcelestial@bEsta habitación está reservada para invitadas especiales.\n@c0@"
  fr: "@aSœur du Firmament@bCette pièce est réservée à nos invitées de marque.\n@c0@"
  it: "@aSuora di Su'ncyel@bQuesta è una stanza riservata per le ospiti ⓕspecialiⓖ che vengono alla nostra abbazia.\n@c0@"
  ja: "@a@b＊「ここは　特別な　おじょうさまを\n\tおあずかりする時のための\n\tお部屋です。\n@c0@"
239:
  de: "@aNonne von Obendroben@bWir hatten bis vor kurzem ein junges Mädchen hier, das in den häuslichen Tugenden unterwiesen wurde.\n@c0@"
  en: "@aNun of the Above@bWe had a young rich girl here until just the other day undergoing her domestic goddess training.\n@c0@"
  es: "@aHermana subcelestial@bHasta hace unos días tuvimos aquí a una rica heredera que había venido a recibir un curso de economía doméstica de la Diosa.\n@c0@"
  fr: "@aSœur du Firmament@bIl y a encore quelques jours, elle était occupée par une jeune fille riche venue faire son éducation domestique et religieuse.\n@c0@"
  it: "@aSuora di Su'ncyel@bFino all'altro giorno era usata da una fanciulla proveniente da una ricca famiglia. Era qui per seguire il nostro corso di preparazione al matrimonio.\n@c0@"
  ja: "@a@b＊「つい　この間まで　お金持ちの\n\tおじょうさまが　花嫁修業に\n\tいらしていたんですが……\n@c0@"
240:
  de: "@aNonne von Obendroben@bSie war so hübsch und sanftmütig. Ich glaube, wir haben von ihr vielleicht noch mehr gelernt als sie von uns!\n@c0@"
  en: "@aNun of the Above@bShe was such a beautiful and kind-hearted girl. I think we probably learnt more from her than she did from us!\n@c0@"
  es: "@aHermana subcelestial@bEra muy hermosa y tenía un gran corazón. ¡Quizá aprendimos más nosotras de ella que al revés!\n@c0@"
  fr: "@aSœur du Firmament@bElle était si belle et si douce. Je pense que nous avons plus appris d'elle qu'elle n'a appris de nousⓠ\n@c0@"
  it: "@aSuora di Su'ncyel@bÈ una ragazza dolce e intelligente, oltre che bella.\nForse abbiamo appreso più cose da lei di quante non gliene abbiamo insegnate!\n@c0@"
  ja: "@a@b＊「それはもう　心のやさしい　美しい\n\t娘さんで　私たちこそ　勉強させて\n\tいただきましたわ。\n@c0@"
241:
  de: "@aNonne von Obendroben@bZuerst waren wir mit ihr gesegnet und nun mit Eurer Maria. Was für ein Glück, so wunderbare Menschen um sich zu haben.\n@c0@"
  en: "@aNun of the Above@bFirst we were blessed with her presence, and now we have your Maria. We're so lucky to have such delightful people around us.\n@c0@"
  es: "@aHermana subcelestial@bPrimero contamos con la bendición de su presencia, y ahora con la de María.\n㈡\nSomos muy afortunadas de poder disfrutar de la compañía de tan buenas personas.\n@c0@"
  fr: "@aSœur du Firmament@bMaintenant, c'est Maria qui nous fait la grâce de sa présence. Nous avons beaucoup de chance d'avoir des personnes si charmantes autour de nous.\n@c0@"
  it: "@aSuora di Su'ncyel@bE non appena quella fanciulla ha lasciato l'Abbazia, la dea ci ha mandato Maria.\nÈ bellissimo avere con noi persone tanto care!\n@c0@"
  ja: "@a@b＊「その娘さんといい　あなたがたが\n\tお連れになった　マリアさんといい\n\tここは　人にめぐまれていますね。\n@c0@"
242:
  de: "@aHarry@bTut mir leid, dass ich eben nichts gesagt habe, %a000090.\n@c0@"
  en: "@aHarry@bSorry I came out without saying anything just then, %a000090.\n@c0@"
  es: "@aFroilán@bSiento haber salido sin decir nada, %a000090.\n@c0@"
  fr: "@aHarry@bDésolé d'être sorti sans prévenir, %a000090.\n@c0@"
  it: "@aRobert@bSai una cosa, %a000090?\n@c0@"
  ja: "@a@bヘンリー「さっきは\n\tだまって　出てきちゃって\n\t悪かったな　%a000090。\n@c0@"
243:
  de: "@aHarry@bIch kenne Maria als Sklave schon so lange, aber mir ist bis heute nie aufgefallen, wie hübsch sie ist.\n@c0@"
  en: "@aHarry@bI knew Maria all that time when we were slaves, and yet I never noticed until today how beautiful she is.\n@c0@"
  es: "@aFroilán@bConocí a María cuando éramos esclavos, pero hasta hoy no me había fijado en lo hermosa que es.\n@c0@"
  fr: "@aHarry@bDire que j'ai côtoyé Maria pendant tout le temps où nous étions esclaves et ce n'est qu'aujourd'hui que je m'aperçois qu'elle est si belle.\n@c0@"
  it: "@aRobert@bConoscevo Maria da quando eravamo schiavi, ma solo oggi mi sono reso conto di quanto sia bella.\n@c0@"
  ja: "@a@bヘンリー「マリアさんって\n\tドレイのときは　気づかなかったけど\n\tキレイな人だよな～。\n@c0@"
244:
  de: "@aHarry@bIch frage mich, ob sie für immer hier bleiben will.\nWir können ja nicht bei ihr bleiben, selbst wenn wir wollten.\n@c0@"
  en: "@aHarry@bI wonder if she's planning on staying here forever. It's not as if we could even stay with her if we were inclined to.\n@c0@"
  es: "@aFroilán@bMe pregunto si tiene pensado quedarse aquí para siempre. Nosotros no podríamos quedarnos aunque quisiésemos.\n@c0@"
  fr: "@aHarry@bJe me demande si elle envisage de s'installer ici\r\npour toujours. L'ennui, c'est qu'on ne pourrait\r\nmême pas rester avec elle si on en avait envie.\n@c0@"
  it: "@aRobert@bPurtroppo, temo che abbia deciso di trascorrere il resto della sua vita rinchiusa qui dentro...\n㈡\nNon è giusto!\nNon potremmo restarle vicini nemmeno se lo volessimo!\n@c0@"
  ja: "@a@bヘンリー「ここで　ずっと　暮らす気かな？\n\tでも　オレたちは　ここには\n\tいられないよなあ……。\n@c0@"
245:
  de: "@aHarry@bAch, ich weiß nicht, was ich jetzt machen werde. Sag Bescheid, wenn du von hier fortgehst, ja?\n@c0@"
  en: "@aHarry@bOh well. I'm not sure what I'm going to do from here. Let me know when you're leaving, won't you?\n@c0@"
  es: "@aFroilán@bBueno. No sé qué voy a hacer ahora. Avísame cuando vayas a marcharte, ¿quieres?\n@c0@"
  fr: "@aHarry@bEnfin... Moi, je ne sais pas trop ce que je vais faire.\r\nViens me prévenir quand tu partiras.\n@c0@"
  it: "@aRobert@bBah, vedremo cosa ci riserva il futuro.\nA proposito... Fammi sapere quando vorrai lasciare l'Abbazia, d'accordo?\n@c0@"
  ja: "@a@bヘンリー「さあてと……。\n\tこれから　どうするかなあ……。\n\t出かける時は　声をかけてくれよ！\n@c0@"
246:
  de: "@aHarry@bBist du reisefertig?\n@c0@"
  en: "@aHarry@bAre you ready to go now?\n@c0@"
  es: "@aFroilán@b¿Estás listo para partir?\n@c0@"
  fr: "@aHarry@bTu es prêt à partirⓡ\n@c0@"
  it: "@aRobert@bVogliamo andarcene?\n@c0@"
  ja: "@a@bヘンリー「いよいよ　旅に出るのか？\n@c0@"
247:
  de: "@aHarry@bJa, es wird vermutlich Zeit, dass du dich auf die Suche nach deiner Mutter machst.\n@c0@"
  en: "@aHarry@bIt's about time you set off in search of your mother, I suppose.\n@c0@"
  es: "@aFroilán@bSupongo que ya es hora de que empieces a buscar a tu madre.\n@c0@"
  fr: "@aHarry@bJe suppose qu'il est temps pour toi de te mettre à la recherche de ta mère.\n@c0@"
  it: "@aRobert@bForse è arrivato il momento che tu ti metta alla ricerca di tua madre...\n@c0@"
  ja: "@a@bヘンリー「そうだよな。　お前には\n\t母親をさがすっていう目的が\n\tあったもんな。\n@c0@"
248:
  de: "@aHarry@bIch weiß nicht so recht, wo ich hin soll. Kann ich mit dir mitkommen?\n@c0@"
  en: "@aHarry@bI don't really have anywhere special to go.\r\nCan I tag along with you?\n@c0@"
  es: "@aFroilán@bYo no tengo ningún sitio en particular al que ir.\r\n¿Quieres que te acompañe?\n@c0@"
  fr: "@aHarry@bJe n'ai nulle part où aller.\nDis-moi, je pourrais venir avec toiⓡ\n@c0@"
  it: "@aRobert@bHo controllato la mia agenda, e non ho molti impegni per questi giorni...\nAh ah ah! Posso venire con te?\n@c0@"
  ja: "@a@bヘンリー「なあ　どうだろうか？\n\tその旅に　オレも\n\tつき合わせてくれないか？\n@c0@"
249:
  de: "@aHarry@bKlasse! Nachdem das jetzt entschieden ist, lass uns aufbrechen!\n@c0@"
  en: "@aHarry@bBrilliant! Now that's decided, let's get going!\n@c0@"
  es: "@aFroilán@b¡Genial! ¡Decidido, en marcha!\n@c0@"
  fr: "@aHarry@bExcellentⓠ Alors en routeⓠ\n@c0@"
  it: "@aRobert@bFantastico!\nAllora è deciso: verrò con te!\n@c0@"
  ja: "@a@bヘンリー「よし　そうと決まったら\n\tさっそく　旅に出よう！\n@c0@"
250:
  de: "@aHarry@bIch gehe und sage allen Bescheid, dass wir abreisen. Warte hier!\n@c0@"
  en: "@aHarry@bI'll go and tell everyone we're leaving.\r\nYou wait here!\n@c0@"
  es: "@aFroilán@bIré a avisar de que nos vamos.\r\n¡Espera aquí!\n@c0@"
  fr: "@aHarry@bJe vais dire à tout le monde que nous partons.\nTu ne bouges pasⓠ\n@c0@"
  it: "@aRobert@bVado a dire agli altri che presto lasceremo l'Abbazia.\nTu aspettami qui.\n@c0@"
  ja: "@a@bヘンリー「今　出かけるって\n\t言ってくるから　お前は\n\tここで　待っていろよ！\n@c0@"
251:
  de: "@aHarry@bNa, das ist ja reizend!\n@c0@"
  en: "@aHarry@bWell, that's just charming!\n@c0@"
  es: "@aFroilán@b¡Vaya! ¡Qué simpático!\n@c0@"
  fr: "@aHarry@bEh bien, c'est aimableⓠ\n@c0@"
  it: "@aRobert@bOh, grazie!\nBell'amico che sei...!\nBah...\n@c0@"
  ja: "@a@bヘンリー「お前は　意外と\n\tつめたいヤツだな。\n@c0@"
252:
  de: "@aHarry@bWenn ich mich recht erinnere, solltest doch du mein Lakai sein, oder?\n@c0@"
  en: "@aHarry@bAnyway, if I remember rightly, you're supposed to be my lackey, aren't you?\n@c0@"
  es: "@aFroilán@bEn cualquier caso, y si mal no recuerdo, tú eres mi lacayo, ¿no?\n@c0@"
  fr: "@aHarry@bMais, si je me souviens bien, tu es censé être mon domestique, n'est-ce pasⓡ\n@c0@"
  it: "@aRobert@bPerò dimentichi una cosa...\nTu sei il mio aiutante!\nVedo che hai la memoria corta, caro mio...\n@c0@"
  ja: "@a@bヘンリー「よくは　覚えてないけど\n\tお前は　たしか　オレの子分に\n\tなったんじゃなかったかなあ。\n@c0@"
253:
  de: "@aHarry@bAlso hörst du wohl besser auf deinen Herrn und Gebieter, verstanden?\n@c0@"
  en: "@aHarry@bSo you'd better start listening to your master, understood?\n@c0@"
  es: "@aFroilán@bAsí que más te vale escuchar a tu señor, ¿entendido?\n@c0@"
  fr: "@aHarry@bIl serait donc temps que tu commences à écouter ton maître. Comprisⓡ\n@c0@"
  it: "@aRobert@bIn qualità di aiutante, devi eseguire alla lettera gli ordini del tuo superiore.\nChe sarei io. Ti è chiaro il concetto?\n@c0@"
  ja: "@a@bヘンリー「親分の　言うことは\n\t聞くもんだぜ。\n\tなっ　いいだろう？\n@c0@"
254:
  de: "@aHarry@bOh...\n@c0@"
  en: "@aHarry@bOh...\n@c0@"
  es: "@aFroilán@bOh...\n@c0@"
  fr: "@aHarry@bAh...\n@c0@"
  it: "@aRobert@bOh...\n@c0@"
  ja: "@a@bヘンリー「そうか……。\n@c0@"
255:
  de: "@aHarry@bWir hatten immerhin großes Glück, es lebend bis hierher geschafft zu haben, meinst du nicht?\n@c0@"
  en: "@aHarry@bStill, we were ever so lucky making it here alive, don't you think?\n@c0@"
  es: "@aFroilán@bQué suerte tuvimos de llegar aquí con vida, ¿no crees?\n@c0@"
  fr: "@aHarry@bEn tout cas, on a vraiment eu de la chance d'arriver ici vivants, tu ne trouves pasⓡ\n@c0@"
  it: "@aRobert@bSiamo stati davvero fortunati ad arrivare qui sani e salvi...\n@c0@"
  ja: "@a@bヘンリー「……しかし　本当に\n\t生きて　ここまで流れ着くなんて\n\tオレたち　運がいいよな。\n@c0@"
256:
  de: "@aHarry@bIch hatte in dem Fass schon fast die Hoffnung aufgegeben. Ich war verzweifelt, und dann habe ich ein Läuten wie von einer Glocke gehört.\n@c0@"
  en: "@aHarry@bI'd almost given up hope back there in the barrel.\r\nI was despairing, and then I heard a noise like a bell ringing.\n@c0@"
  es: "@aFroilán@bEn el barril casi perdí toda esperanza.\r\nEstaba desesperado, pero entonces oí un sonido, como una campana.\n@c0@"
  fr: "@aHarry@bJ'avais presque perdu tout espoir dans ce tonneau.\r\nJ'étais désespéré et, tout à coup, j'ai eu l'impression d'entendre une cloche.\n@c0@"
  it: "@aRobert@bAvevo perso ogni speranza, mentre eravamo in quel barile. Poi, tutt'a un tratto, mi è sembrato di udire i rintocchi di una campana.\n@c0@"
  ja: "@a@bヘンリー「オレさ……　タルの中で\n\tもうダメかもって　思ったとき\n\t鐘の音を聞いたような　気がしたんだ。\n@c0@"
257:
  de: "@aHarry@bDas hat mich beruhigt und meine Sorgen sind von mir abgefallen. Das muss wohl die Glocke dieser Abtei gewesen sein, nicht wahr?\n@c0@"
  en: "@aHarry@bIt relaxed me somehow, made me stop worrying. Now I come to think of it, it was probably the bell from this abbey.\n@c0@"
  es: "@aFroilán@bAquello me relajó, dejé de preocuparme. Ahora que lo pienso, quizá fuera la campana de esta abadía.\n@c0@"
  fr: "@aHarry@bÇa m'a calmé. J'ai arrêté de m'inquiéter.\r\nMaintenant que j'y pense, ça devait être la cloche de l'abbaye.\n@c0@"
  it: "@aRobert@bEra un suono dolce, rilassante, che mi ha rincuorato. Successivamente, ho capito che i rintocchi provenivano dalla campana dell'abbazia.\n@c0@"
  ja: "@a@bヘンリー「すごく　落ち着く音色でさ。\n\tあれって　この修道院の鐘の音\n\tだったのかもしれないな。\n@c0@"
258:
  de: "@a@bDie Katze streift zufrieden durchs Gras.\n@c0@"
  en: "@a@bThe cat is walking happily through the grass.\n@c0@"
  es: "@a@bEl gato pasea feliz por la hierba.\n@c0@"
  fr: "@a@bLe chat se promène tranquillement dans l'herbe.\n@c0@"
  it: "@a@bIl gatto passeggia tranquillamente sul prato.\n@c0@"
  ja: "@a@bネコは　うれしそうに\n草の間を　歩いている。\n@c0@"
259:
  de: "@aNonne von Obendroben@bIhr wollt uns also verlassen. Ich habe gehört, dass Ihr Euch auf die Suche nach Eurer Mutter machen wollt.\n@c0@"
  en: "@aNun of the Above@bSo you're leaving us. I hear you're embarking on a journey in search of your mother.\n@c0@"
  es: "@aHermana subcelestial@bAsí que nos dejas. He oído que vas a dedicarte a buscar a tu madre.\n@c0@"
  fr: "@aSœur du Firmament@bAinsi, vous nous quittez. J'ai entendu dire que vous partiez en voyage à la recherche de votre mère.\n@c0@"
  it: "@aSuora di Su'ncyel@bCosì hai deciso di lasciarci.\nHo saputo che partirai per metterti alla ricerca di tua madre...\n@c0@"
  ja: "@a@b＊「やはり　行ってしまうのですね。\n\tなんでも　お母さまをさがす旅とか。\n@c0@"
260:
  de: "@aNonne von Obendroben@bVielleicht findet Ihr in der großen Stadt nördlich von hier ein paar Hinweise. Gebt auf Euch acht, mein Kind.\n@c0@"
  en: "@aNun of the Above@bPerhaps you might be able to find some clues at the large town to the north of here.\r\nTake care, my child.\n@c0@"
  es: "@aHermana subcelestial@bQuizá puedas encontrar alguna pista en la gran ciudad que hay al norte de aquí.\r\n¡Cuídate, hijo mío!\n@c0@"
  fr: "@aSœur du Firmament@bVous trouverez peut-être des informations dans la grande ville située un peu plus au nord.\r\nPrenez soin de vous, mon enfant.\n@c0@"
  it: "@aSuora di Su'ncyel@bForse potresti trovare qualche informazione utile nella città a nord. Perché non provi ad andarci?\nChe la dea ti protegga sempre, figliolo.\n@c0@"
  ja: "@a@b＊「北にある　大きな町でなら\n\t何か　分かるかもしれませんね。\n\tどうか　お気をつけて。\n@c0@"
261:
  de: "@aMaria@bVielen Dank für alles.\n@c0@"
  en: "@aMaria@bThank you so much for everything.\n@c0@"
  es: "@aMaría@bMuchas gracias por todo.\n@c0@"
  fr: "@aMaria@bMerci du fond du cœur pour tout.\n@c0@"
  it: "@aMaria@bGrazie.\nGrazie di cuore.\n@c0@"
  ja: "@a@bマリア「本当に　いろいろ\n\tありがとうございました。\n@c0@"
262:
