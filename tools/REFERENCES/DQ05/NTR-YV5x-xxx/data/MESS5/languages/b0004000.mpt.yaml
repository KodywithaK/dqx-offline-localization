  en: "@a@b*: Why don't ya take a stroll outside town for a while? You'll soon pass the time till evenin'.\n@c0@"
  es: "@a@b*: ¿Por qué no %H0860%Xvas a darte%Yvais a daros%Z un paseo fuera de la ciudad? La noche llegará enseguida.\n@c0@"
  fr: "@a@b*ⓢ Pourquoi vous n'allez pas faire un tour hors de la villeⓡ Revenez ici ce soir.\n@c0@"
  it: "@a@b*: Adoro passeggiare fuori città!\nNon esiste modo migliore di trascorrere la giornata e attendere l'arrivo della sera...\n@c0@"
  ja: "@a@b＊「町の外に出て　長く歩くと\n\tやがて夜に　なりましょう。\n@c0@"
331:
  de: "@a@b*: Ich sag Euch, hier sieht's abends ganz anders aus.\n@c0@"
  en: "@a@b*: I'm tellin' ya, the place sure looks different\r\nof a night.\n@c0@"
  es: "@a@b*: Ya %H0860%Xverás%Yveréis%Z cómo esto de noche es completamente diferente.\n@c0@"
  fr: "@a@b*ⓢ Je vous assure que cette ville est vraiment différente la nuit.\n@c0@"
  it: "@a@b*: La sera è magica.\nCon il buio, il mondo sembra diverso...\nAnzi, lo è davvero!\n@c0@"
  ja: "@a@b＊「夜ともなると　この町は\n\tまた別の顔を　人々に\n\t見せるのです。\n@c0@"
332:
