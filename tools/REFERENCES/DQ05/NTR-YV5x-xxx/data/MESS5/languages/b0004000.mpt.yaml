  en: "@a@b*: I came here because I'd always dreamt of becoming a dancer.\n@c0@"
  es: "@a@b*: Vine aquí porque mi sueño siempre ha sido ser bailarina.\n@c0@"
  fr: "@a@b*ⓢ Je suis venue à Bonaventure parce que j'ai toujours rêvé de devenir une danseuse.\n@c0@"
  it: "@a@b*: Sono venuta qui per inseguire il mio sogno di diventare una ballerina.\n@c0@"
  ja: "@a@b＊「あたし　踊り娘になりたくて\n\tこの町に　やって来たの。\n@c0@"
