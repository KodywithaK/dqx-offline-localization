  ja: "@a@b＊「あなたは　このマリアさんと\n\t同じタルで　流されてきた方ですね。\n@c0@"
204:
  de: "@aNonne von Obendroben@bJe öfter ich mit diesem Mädchen spreche, desto mehr beeindruckt mich ihre liebenswürdige Art.\n@c0@"
  en: "@aNun of the Above@bThe more I speak with that dear girl, the more I can't fail to be impressed by how sweet she is in her nature.\n@c0@"
  es: "@aHermana subcelestial@bCuanto más hablo con esa bendita muchacha, más me impresionan su talante y su dulzura.\n@c0@"
  fr: "@aSœur du Firmament@bPlus je discute avec cette chère petite, plus je suis impressionnée par sa profonde gentillesse.\n@c0@"
  it: "@aSuora di Su'ncyel@bOgni volta che parlo con quella fanciulla non posso fare a meno di essere stupita dalla bontà e dal candore che dimostra.\n@c0@"
  ja: "@a@b＊「マリアさんと　話せば話すほど\n\tその心の美しさに\n\t感心してしまいますわ。\n@c0@"
205:
