  it: "@aMadre superiora@bTocca a te scegliere quale strada seguire nella tua vita.\n@c0@"
  ja: "@a@b＊「これからは　自分の道を\n\t自分で見つけなくては\n\tならないでしょう。\n@c0@"
266:
  de: "@aOberin Obenhin@bAber Ihr seid nicht allein. Denkt daran, dass die Göttin immer über Euch wacht.\n@c0@"
  en: "@aAbbess Abovall@bBut you must never feel alone. Remember that the Goddess is watching over you, always.\n@c0@"
