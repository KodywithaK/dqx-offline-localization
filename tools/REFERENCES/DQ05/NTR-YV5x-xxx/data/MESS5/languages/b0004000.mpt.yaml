27:
  de: "@a@b*: Es ist eine Schande! Wie gemein, einen alten Mann wie mich zu zwingen, so schwere Säcke durch die Gegend zu schleppen.\n@c0@"
  en: "@a@b*: It's a disgrace, I say! It's just pure evil to force a poor old man like me to carry heavy sacks about like this.\n@c0@"
  es: "@a@b*: ¡Es una vergüenza! Hay que ser malvado para obligar a un viejo como yo a llevar sacos tan pesados.\n@c0@"
  fr: "@a@b*ⓢ Quelle honteⓠ Il faut vraiment être profondément mauvais pour forcer un pauvre vieux comme moi à porter des sacs aussi lourds.\n@c0@"
  it: "@a@b*: Con quale coraggio pretendono che un uomo anziano come me porti dei sacchi tanto pesanti?!\nChe crudeltà...\n@c0@"
  ja: "@a@b＊「ふがふが……。　こんな年寄りに\n\t超重いふくろを　はこばせるなど\n\tヤツらは悪魔じゃ！\n@c0@"
28:
  de: "@a@b*: Du willst ja wohl nicht schon wieder fliehen, oder? Diesmal ohne mich, das sag ich dir!\n@c0@"
  en: "@a@b*: You're not plotting another escape bid, are you? You can count me out this time if you are.\n@c0@"
  es: "@a@b*: No estarás planeando otra fuga, ¿no? Si es así, esta vez no cuentes conmigo.\n@c0@"
  fr: "@a@b*ⓢ Tu vas encore essayer de t'évaderⓡ\nCompte pas sur moi cette fois.\n@c0@"
  it: "@a@b*: Non è che stai progettando un'altra evasione, eh?\nSe fosse così, stavolta io mi chiamo fuori...\n@c0@"
  ja: "@a@b＊「また　ここから\n\t逃げだそうと　いうの？\n\tもう　まきぞえは　ごめんだわ。\n@c0@"
