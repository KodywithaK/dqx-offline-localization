  fr: "@a@bLe chat chasse les insectes dans l'herbe.\n@c0@"
  it: "@a@bIl gatto sta inseguendo gli insetti nel prato.\n@c0@"
  ja: "@a@bネコは　草の間の虫を\nおいかけているようだ。\n@c0@"
281:
  de: "@aNonne von Obendroben@bIch möchte Euch diese Figur der Göttin als Talisman für eine sichere Reise schenken.\n@c0@"
  en: "@aNun of the Above@bI'd like you to have this statue of the Goddess as a good luck charm for your safe onward journey.\n@c0@"
  es: "@aHermana subcelestial@bMe gustaría que llevaras esta estatua de la Diosa como amuleto de buena suerte en tu viaje.\n@c0@"
  fr: "@aSœur du Firmament@bJ'aimerais vous donner cette statuette de la Déesse. Elle vous protégera au cours du voyage qui vous attend.\n@c0@"
  it: "@aSuora di Su'ncyel@bVoglio donarti una statuetta della dea.\nQuest'oggetto sacro ti proteggerà ovunque andrai.\n@c0@"
  ja: "@a@b＊「あなた方の　旅の無事をお祈りして\n\tこの　女神像を　さしあげましょう。\n@c0@"
282:
  de: "@a@b%0%a000120 erhält eine Schlichte Statuette.\n@c0@"
  en: "@a@b%0%a000120 receives a crude image.\n@c0@"
  es: "@a@b%0%a000120 recibe una imagen tosca.\n@c0@"
  fr: "@a@b%0%a000120 reçoit une statuette grossière.\n@c0@"
  it: "@a@b%0%a000120 ha ricevuto una statuetta grezza.\n@c0@"
  ja: "@a@b%a000120は　木ぼりの女神像を\n受けとった！\n@c0@"
283:
  de: "@a@b%0%a000180 steckt die Schlichte Statuette ein.\n@c0@"
  en: "@a@b%0%a000180 acquires a crude image.\n@c0@"
  es: "@a@b%0%a000180 obtiene una imagen tosca.\n@c0@"
  fr: "@a@b%0%a000180 récupère la statuette grossière.\n@c0@"
  it: "@a@b%0%a000180 prende la statuetta grezza.\n@c0@"
  ja: "@a@b%a000180は　木ぼりの女神像を\n手に入れた！\n@c0@"
284:
  de: "@aNonne von Obendroben@bDie Statuette haben wir Nonnen des Stifts Obendroben mit Liebe und Gebeten erschaffen.\n@c0@"
  en: "@aNun of the Above@bThat statue was carved with love and prayers by we nuns of Heaven's Above Abbey.\n@c0@"
  es: "@aHermana subcelestial@bEsta estatua fue tallada con amor y plegarias por las monjas de la Abadía Subcelestis.\n@c0@"
  fr: "@aSœur du Firmament@bMes sœurs de l'abbaye du Firmament et moi-même avons mis beaucoup d'amour et de prières dans la réalisation de cette statuette.\n@c0@"
  it: "@aSuora di Su'ncyel@bQuesta statuetta è stata realizzata da noi suore dell'Abbazia.\nIn essa c'è tutto l'amore che proviamo per la dea.\n@c0@"
  ja: "@a@b＊「それは　私たち　修道院に暮らす者が\n\t祈りをこめて　彫ったものです。\n@c0@"
285:
  de: "@aNonne von Obendroben@bSie hat keine besonderen Kräfte oder dergleichen, aber sie wird Euch hoffentlich an Eure Zeit hier erinnern.\n@c0@"
  en: "@aNun of the Above@bIt doesn't have any special powers or anything like that, but I hope it will at least make a nice keepsake of your time here.\n@c0@"
  es: "@aHermana subcelestial@bNo tiene poderes especiales ni nada parecido, pero espero que te sirva como un bonito recuerdo de tu estancia aquí.\n@c0@"
  fr: "@aSœur du Firmament@bElle n'a aucun pouvoir particulier, mais j'espère qu'au moins, elle vous rappellera agréablement votre séjour parmi nous.\n@c0@"
  it: "@aSuora di Su'ncyel@bNon ha alcun potere magico, ma spero che per %H0860%Xte%Yvoi%Z sia un bel ricordo del tempo che %H0860%Xhai%Yavete%Z trascorso qui.\n@c0@"
  ja: "@a@b＊「とくべつなチカラが　宿るものでは\n\tありませんが　この修道院へいらした\n\t記念に　どうぞ　お持ちください。\n@c0@"
286:
  de: "@aNonne von Obendroben@bSeht Ihr, wir hier im Stift nähen unsere eigene Kleidung und versorgen uns selbst mit Nahrung.\n@c0@"
  en: "@aNun of the Above@bWe make all of our own clothes and grow our own food here at the abbey, you see.\n@c0@"
  es: "@aHermana subcelestial@bComo ves, en la abadía confeccionamos nuestra ropa y cultivamos nuestra comida.\n@c0@"
  fr: "@aSœur du Firmament@bNous tissons nos propres vêtements et nous cultivons tout ce que nous mangeons.\n@c0@"
  it: "@aSuora di Su'ncyel@bQui all'Abbazia di Su'ncyel cuciamo gli abiti che indossiamo, e coltiviamo i campi per produrre il cibo che serve per il nostro sostentamento.\n@c0@"
  ja: "@a@b＊「修道院では　衣服も食事も\n\tすべて　自分たちが作ったもので\n\tまかなっています。\n@c0@"
287:
  de: "@aNonne von Obendroben@bDarum sind wir es gewohnt, Dinge selbst zu machen.\n@c0@"
  en: "@aNun of the Above@bSo we're used to making things for ourselves.\n@c0@"
  es: "@aHermana subcelestial@bEstamos acostumbradas a cuidar de nosotras mismas.\n@c0@"
  fr: "@aSœur du Firmament@bNous sommes habituées à tout fabriquer\r\nnous-mêmes.\n@c0@"
  it: "@aSuora di Su'ncyel@bFacciamo del nostro meglio per essere autosufficienti.\n@c0@"
  ja: "@a@b＊「ですから　自然と　何かを作ることに\n\tなれて行くのですわ。\n@c0@"
288:
  de: "@a@b*: Ich bin hier, weil ich meinem Mann davongelaufen bin. Er ist ein gemeiner alter Grobian, und was für einer.\n@c0@"
  en: "@a@b*: I'm here 'cos I ran away from my husband.\r\nHe's a mean old ruffian, so he is.\n@c0@"
  es: "@a@b*: Vine aquí huyendo de mi marido.\r\nEs un rufián y un malvado.\n@c0@"
  fr: "@a@b*ⓢ Je suis ici parce que je suis partie de chez moi.\nMon mari n'est qu'un méchant bon à rien. \n@c0@"
  it: "@a@b*: Sono arrivata qui dopo essere scappata da quel mascalzone di mio marito.\n@c0@"
  ja: "@a@b＊「あたしゃ　亭主から\n\t逃げてきたんだよ。\n\tとんでもない　らんぼう者でね。\n@c0@"
289:
  de: "@a@b*: Ihr habt aber gütige Augen, ja wirklich. Ihr werdet mal einen wunderbaren Ehemann abgeben, Herzchen!\n@c0@"
  en: "@a@b*: You've got kind eyes, though, you have.\r\nYou'll make someone a nice husband, my lovely!\n@c0@"
  es: "@a@b*: Pero tú tienes ojos bondadosos.\r\n¡Tú serías un buen esposo, querido! \n@c0@"
  fr: "@a@b*ⓢ Mais toi, tu as un regard doux.\nTu feras un gentil mari pour quelqu'un, trésorⓠ\n\n@c0@"
  it: "@a@b*: Tu sembri così diverso da lui... Il tuo sguardo è gentile.\nSono certa che farai felice la persona che ti sposerà!\n@c0@"
  ja: "@a@b＊「でも　あんたは\n\tやさしい目をしてるから\n\tきっと　いい亭主になるよ。\n@c0@"
290:
  de: "@aNonne von Obendroben@bDies ist das Stift Obendroben. An unsere Tür klopfen viele verlorene und trostbedürftige Schäflein.\n@c0@"
  en: "@aNun of the Above@bThis is Heaven's Above Abbey. We have many lost and suffering sheep finding their way to our door.\n@c0@"
  es: "@aHermana subcelestial@bEsta es la Abadía Subcelestis. Muchas ovejas perdidas y que sufren llegan hasta nuestra puerta.\n@c0@"
  fr: "@aSœur du Firmament@bVous êtes à l'abbaye du Firmament. De nombreuses brebis perdues et blessées viennent frapper à notre porte.\n@c0@"
  it: "@aSuora di Su'ncyel@bQuesta è l'Abbazia di Su'ncyel.\nAlla nostra porta bussano spesso pecorelle smarrite del gregge della dea.\n@c0@"
  ja: "@a@b＊「ここは名もない海辺の修道院。\n\tおとずれる人は　みな\n\t悲しみを　背負った人ばかり。\n@c0@"
291:
  de: "@aNonne von Obendroben@bUnd Ihr seid eines davon. So jung, und doch habt Ihr schon so viel Leid erfahren! Oh Göttin, erbarme dich!\n@c0@"
  en: "@aNun of the Above@bAnd you're among them. So young and yet you've seen so much suffering! Oh, dear Goddess, have mercy!\n@c0@"
  es: "@aHermana subcelestial@bY tú estás entre ellos. ¡Tan joven y con tanto sufrimiento a tus espaldas! ¡Oh, Diosa, ten piedad!\n@c0@"
  fr: "@aSœur du Firmament@bEt vous êtes l'une d'entre elles. Vous êtes si jeune et, pourtant, vous avez déjà vu tant de souffrancesⓠ Déesse, aie pitiéⓠ\n@c0@"
  it: "@aSuora di Su'ncyel@b%H0860%XE tu sei una di loro. Così giovane, eppure già provato dalla sofferenza! Non temere, la dea ti%YProprio come voi. Così giovani, eppure già provati dalla sofferenza! Non temete, la dea vi%Z aiuterà!\n@c0@"
  ja: "@a@b＊「あなたも　若いのに\n\tずいぶん大変な経験を\n\tなさいましたね。\n@c0@"
292:
  de: "@aNonne von Obendroben@bDies ist das Stift Obendroben. An unsere Tür klopfen viele verlorene und trostbedürftige Schäflein.\n@c0@"
  en: "@aNun of the Above@bThis is Heaven's Above Abbey. We have many lost and suffering sheep finding their way to our door.\n@c0@"
  es: "@aHermana subcelestial@bEsta es la Abadía Subcelestis. Muchas ovejas perdidas y que sufren llegan hasta nuestra puerta.\n@c0@"
  fr: "@aSœur du Firmament@bVous êtes à l'abbaye du Firmament. De nombreuses brebis perdues et blessées viennent frapper à notre porte.\n@c0@"
  it: "@aSuora di Su'ncyel@bQuesta è l'Abbazia di Su'ncyel.\nAlla nostra porta bussano spesso povere pecorelle smarrite del gregge della dea.\n@c0@"
  ja: "@a@b＊「ここは名もない海辺の修道院。\n\tおとずれる人は　みな\n\t悲しみを　背負った人ばかり。\n@c0@"
293:
  de: "@aNonne von Obendroben@bIch kann sehen, dass selbst du, ein Monster, in deinem Herzen traurig bist. Sei stark, mein Kind.\n@c0@"
  en: "@aNun of the Above@bI can see that even you, a monster, have some sadness in your heart. Be strong, my child.\n@c0@"
  es: "@aHermana subcelestial@bVeo que la tristeza te invade incluso a ti, un monstruo. Sé fuerte, %A0110%Xhijo mío%Z%B0110%Xhija mía%Z.\n@c0@"
  fr: "@aSœur du Firmament@bEt je sais que même un monstre comme vous peut souffrir. Soyez fort, mon enfant.\n@c0@"
  it: "@aSuora di Su'ncyel@bVedo che anche tu, povero mostro, porti la tristezza nel tuo cuore.\nSii forte, anima cara, sii forte.\n@c0@"
  ja: "@a@b＊「あなたがた　モンスターの心にも\n\tなにやら　悲しみがみえますわ。\n\t……苦労してきたのね。\n@c0@"
294:
  de: "@a@b*: Maria ist sooo hübsch!\n@c0@"
  en: "@a@b*: Maria is just so pretty!\n@c0@"
  es: "@a@b*: ¡María es tan hermosa!\n@c0@"
  fr: "@a@b*ⓢ Maria est si jolieⓠ\n@c0@"
  it: "@a@b*: Maria è veramente una fanciulla meravigliosa!\n@c0@"
  ja: "@a@b＊「マリアお姉ちゃんって\n\tきれいだね！\n@c0@"
295:
  de: "@a@b*: Aber sie betet immer bloß, und manchmal sieht sie so traurig und einsam aus.\n@c0@"
  en: "@a@b*: But all she ever does is pray, and she looks so sad and lonely sometimes.\n@c0@"
  es: "@a@b*: Pero no hace más que rezar, y a veces parece tan triste y solitaria...\n@c0@"
  fr: "@a@b*ⓢ Mais elle ne fait que prier. Elle a l'air si triste et si seule, parfois.\n@c0@"
  it: "@a@b*: Ma non fa altro che pregare, pregare e ancora pregare!\nA volte mi sembra triste. Forse si sente sola...\n@c0@"
  ja: "@a@b＊「でも　ずーっと\n\tお祈りしてばかりで\n\tさびしそうなんだよ。\n@c0@"
296:
  de: "@aMaria@bMein Bruder und ich, wir hatten immer nur uns beide, selbst als ich noch ganz klein war.\n@c0@"
  en: "@aMaria@bIt was always just my brother and I, even when I was really small.\n@c0@"
  es: "@aMaría@bYa de pequeños siempre estábamos juntos, mi hermano y yo.\n@c0@"
  fr: "@aMaria@bMon frère est ma seule famille. Nous n'avons toujours été que tous les deux.\n@c0@"
  it: "@aMaria@bDa piccola, io e mio fratello vivevamo da soli.\nNon avevamo nessuno che ci aiutasse.\n@c0@"
  ja: "@a@bマリア「私は　子供の頃から\n\t兄と　ふたりだけで\n\t生きてきたんです。\n@c0@"
297:
  de: "@aMaria@bDas Leben war hart, und wir hatten ziemlich zu kämpfen.\n㈡\nDann haben wir vom Orden vom Zugzwang erfahren, und Josef beschloss, einer ihrer Soldaten zu werden.\n@c0@"
  en: "@aMaria@bLife was hard and we were living on the edge most of the time.\n㈡\nThen we found out about the Order of Zugzwang, and Joshua decided to become one of their soldiers.\n@c0@"
  es: "@aMaría@bLa vida era dura y casi siempre estábamos al límite.\n㈡\nEntonces oímos hablar de la Orden de Zugzwang y Josué decidió convertirse en uno de sus soldados.\n@c0@"
  fr: "@aMaria@bLa vie n'était pas facile tous les jours. Nous ne savions jamais de quoi le lendemain serait fait.\n㈡\nC'est alors que nous avons découvert l'Ordre du Zugzwang et Joshua a décidé de s'engager à leurs côtés.\n@c0@"
  it: "@aMaria@bLa vita era dura a quei tempi, e non era facile tirare avanti.\n㈡\nPoi venimmo a conoscenza dell'esistenza della Setta di Zugzwang, e Bonocore decise di entrare a far parte del loro corpo di guardia.\n@c0@"
  ja: "@a@bマリア「生活がくるしくて　もうダメかって\n\t思ったとき　光の教団に　すすめられ\n\t兄は　兵士になりました。\n@c0@"
298:
  de: "@aMaria@bIch hatte das Glück, unter Bischof Slon studieren zu können. Wir waren ja so dankbar für die Gelegenheit, uns aus dem Sumpf zu ziehen.\n@c0@"
  en: "@aMaria@bI was lucky enough to be able to study under Bishop Ladja, and we were so grateful for the opportunity to pull ourselves out of the mire.\n@c0@"
  es: "@aMaría@bYo tuve la suerte de estudiar con el alfil Ladja, y estuvimos muy agradecidos por la oportunidad de salir de la miseria.\n@c0@"
  fr: "@aMaria@bJ'ai eu la chance de pouvoir suivre les cours d'Erebos le Fou. Nous leur étions si reconnaissants de nous avoir permis de nous en sortir.\n@c0@"
  it: "@aMaria@bIl pope Skriterioska, poi, mi prese a benvolere e mi permise di studiare sotto la sua guida.\n㈡\nGli eravamo grati, perché ci aveva dato la possibilità di migliorare la nostra vita.\n@c0@"
  ja: "@a@bマリア「おかげで　私も　教祖さまの\n\tお世話の仕事を　いただいて\n\tとても　かんしゃしていたのです。\n@c0@"
299:
  de: "@aMaria@bAber ich komme nicht damit zurecht, dass so viele Menschen geopfert werden, nur um einen prachtvollen Tempel zu bauen.\n@c0@"
  en: "@aMaria@bBut I can never come to terms with the idea of sacrificing so many people just to build a grand temple.\n@c0@"
  es: "@aMaría@bPero nunca logré asimilar la idea de sacrificar a tantos solo por construir un gran templo.\n@c0@"
  fr: "@aMaria@bCependant, je n'arrive toujours pas à comprendre pourquoi ils sacrifient tant de gens dans le seul but de construire un grand temple.\n@c0@"
  it: "@aMaria@bOra, però, capisco che Skriterioska è un essere malvagio. Non aveva alcun diritto di ridurre tanta gente in schiavitù solo per costruire un tempio...\n@c0@"
  ja: "@a@bマリア「ですが　多くの人をギセイに\n\tしてまで　りっぱな神殿を作るなんて\n\t私には　理解できません。\n@c0@"
300:
  de: "@aMaria@bIch mache mir solche Sorgen, wie es Josef wohl geht. Aber ich kann nichts tun, außer hier herumzusitzen und jeden Tag für ihn zu beten.\n@c0@"
  en: "@aMaria@bI'm so worried about what's become of Joshua. But there's nothing I can do apart from sit here and pray for him each day.\n@c0@"
  es: "@aMaría@bMe preocupa mucho lo que haya sido de Josué. Pero no puedo hacer otra cosa que esperar y rezar por él todos los días.\n@c0@"
  fr: "@aMaria@bJe m'inquiète beaucoup pour Joshua. Malheureusement, je ne peux pas faire grand-chose à part prier pour lui chaque jour.\n@c0@"
  it: "@aMaria@bSono molto in ansia per mio fratello Bonocore, ma non posso fare niente per lui, tranne che pregare la dea perché lo faccia uscire sano e salvo da quel posto...\n@c0@"
  ja: "@a@bマリア「兄のことも　心配ですが\n\t私に　できるのは\n\tこうして　祈ることだけ……。\n@c0@"
301:
  de: "@a@b*: Du liebe Güte! Du kämpfst an der Seite von %a000090, sagst du?\n@c0@"
  en: "@a@b*: Good heavens! You're fighting alongside %a000090, you say?\n@c0@"
  es: "@aMaría@b¡Por la Diosa! ¿Dices que luchas junto a %a000090?\n@c0@"
  fr: "@a@b*ⓢ Par le cielⓠ Tu dis que tu te bats aux côtés %G0090%Xd'%Yde %Z%a000090ⓡ\n@c0@"
  it: "@a@b*: Santo cielo!\nMa tu combatti al fianco di %a000090?!\n@c0@"
  ja: "@a@bマリア「まあ！　モンスターなのに\n\t%a000090さんたちと\n\tたたかってるの？\n@c0@"
302:
  de: "@aMaria@bWas für eine edle Aufgabe für ein Monster! Gib immer dein Bestes und hilf ihm, so viel du nur kannst!\n@c0@"
  en: "@aMaria@bWhat a noble cause for a monster! Make sure you do your best and give him all the help he needs!\n@c0@"
  es: "@aMaría@b¡Qué noble causa para un monstruo! ¡Asegúrate de hacer cuanto puedas por ayudarlo! \n@c0@"
  fr: "@aMaria@bQuelle noble cause pour un monstreⓠ Fais de ton mieux et apporte-lui toute l'aide dont il a besoinⓠ\n@c0@"
  it: "@aMaria@bQuesta è la prova che anche i mostri possono avere un animo nobile! Cerca di aiutare %a000090 in tutti i modi possibili!\n@c0@"
  ja: "@a@bマリア「えらいわね。\n\tがんばって　%a000090さんたちを\n\tたすけてあげてね。\n@c0@"
303:
  de: "@aNonne von Obendroben@bDies ist die Besucherunterkunft. Es ist etwas beengt, aber möchtet Ihr eine Weile rasten?\n@c0@"
  en: "@aNun of the Above@bThis is the visitors' lodgings. It's rather cramped, but would you like to rest for a while?\n@c0@"
  es: "@aHermana subcelestial@bEstos son los aposentos de los visitantes. Son un poco pequeños, pero si %H0860%Xquieres%Yqueréis%Z descansar un poco...\n@c0@"
  fr: "@aSœur du Firmament@bIl s'agit de la chambre réservée aux visiteurs.\nCe n'est pas très grand, mais voulez-vous tout de même vous y reposer un momentⓡ\n@c0@"
  it: "@aSuora di Su'ncyel@bOffriamo ai nostri visitatori la possibilità di riposare in questi locali. Non è una sistemazione lussuosa, ma %H0860%Xti%Yvi%Z andrebbe di fermarvi per un po'?\n@c0@"
  ja: "@a@b＊「ここは　お客さまの寝室ですわ。\n\tせまい所ですが\n\tお休みになりますか？\n@c0@"
304:
  de: "@aNonne von Obendroben@bSehr gut. Ich wünsche Euch angenehme Träume.\n@c0@"
  en: "@aNun of the Above@bVery well. I wish you pleasant dreams.\n@c0@"
  es: "@aHermana subcelestial@bMuy bien. Dulces sueños.\n@c0@"
  fr: "@aSœur du Firmament@bParfait. Faites de beaux rêves.\n@c0@"
  it: "@aSuora di Su'ncyel@bMolto bene!\n%H0860%XTi%YVi%Z auguro un sonno sereno!\n@c0@"
  ja: "@a@b＊「では　ごゆっくりどうぞ。\n\t良い夢が見られますよう……。\n@c0@"
305:
  de: "@aNonne von Obendroben@bGuten Morgen! Heute ist wieder ein herrlicher Tag.\n@c0@"
  en: "@aNun of the Above@bGood morning! It's another beautiful day outside.\n@c0@"
  es: "@aHermana subcelestial@b¡Buenos días! Hermosa mañana la de hoy.\n@c0@"
  fr: "@aSœur du Firmament@bBonjourⓠ La journée s'annonce magnifique.\n@c0@"
  it: "@aSuora di Su'ncyel@bBuongiorno! Oggi è una splendida giornata.\n@c0@"
  ja: "@a@b＊「おはようございます。\n\t今日も　いい天気ですよ。\n@c0@"
306:
  de: "@aNonne von Obendroben@bJeder unserer Gäste hier in der Abtei liegt uns sehr am Herzen. Ich hoffe doch, dass wir Euch wiedersehen werden.\n@c0@"
  en: "@aNun of the Above@bWe value every guest we have here at the abbey extremely highly. I do hope we'll make your acquaintance again.\n@c0@"
  es: "@aHermana subcelestial@bValoramos muchísimo a todos aquellos que visitan nuestra abadía. Espero que volvamos a vernos.\n@c0@"
  fr: "@aSœur du Firmament@bNous réservons toujours les meilleurs égards aux invités de l'abbaye. J'espère que vous reviendrez nous voir.\n@c0@"
  it: "@aSuora di Su'ncyel@bQui all'Abbazia di Su'ncyel siamo sempre felici di ospitare i pellegrini bisognosi di riposo e di ristoro.\n㈡\n%H0860%XSappi che qui troverai%YSappiate che qui troverete%Z sempre un pasto caldo e un letto pulito.\n@c0@"
  ja: "@a@b＊「この修道院を　おとずれる方は\n\tみな　大切なお客さまですわ。\n\tどうぞ　また　お声をかけてください。\n@c0@"
307:
  de: "@aNonne von Obendroben@bJe öfter ich mit diesem Mädchen spreche, desto mehr beeindruckt mich ihre liebenswürdige Art.\n@c0@"
  en: "@aNun of the Above@bThe more I speak with that dear girl, the more I can't fail to be impressed by how sweet she is in her nature.\n@c0@"
  es: "@aHermana subcelestial@bCuanto más hablo con esa bendita muchacha, más me impresionan su talante y su dulzura.\n@c0@"
  fr: "@aSœur du Firmament@bPlus je discute avec cette chère petite, plus je suis impressionnée par sa profonde gentillesse.\n@c0@"
  it: "@aSuora di Su'ncyel@bPiù parlo con quella fanciulla, più resto ammirata dalla purezza del suo animo.\n@c0@"
  ja: "@a@b＊「マリアさんと　話せば話すほど\n\tその　心の美しさに\n\t感心してしまいますわ。\n@c0@"
308:
  de: "@aNonne von Obendroben@bIch weiß, es ist falsch, an den Menschen zu zweifeln...\n@c0@"
  en: "@aNun of the Above@bI know it's wrong to doubt people...\n@c0@"
  es: "@aHermana subcelestial@bSé que no debo dudar de la gente...\n@c0@"
  fr: "@aSœur du Firmament@bJe sais que ce n'est pas bien de douter des gens...\n@c0@"
  it: "@aSuora di Su'ncyel@bSo che non è giusto esprimere giudizi su chi non si conosce a fondo...\n@c0@"
  ja: "@a@b＊「人を　うたがうのは\n\tよくない事ですけど……\n@c0@"
309:
  de: "@aNonne von Obendroben@bAber ich kann mir schwerlich vorstellen, dass ein geistlicher Anführer, der diese sanftmütige Seele versklavt, die Welt retten könnte.\n@c0@"
  en: "@aNun of the Above@bBut I find it hard to believe that any spiritual leader who'd turn that lovely soul into a slave could ever be good enough to save the world.\n@c0@"
  es: "@aHermana subcelestial@bPero me cuesta creer que un líder espiritual capaz de convertir a esa alma adorable en una esclava sea lo bastante bueno para salvar el mundo.\n@c0@"
  fr: "@aSœur du Firmament@b... mais j'ai du mal à croire qu'un chef spirituel capable de réduire une âme si pure en esclavage soit en mesure de sauver notre monde.\n@c0@"
  it: "@aSuora di Su'ncyel@bMa non credo che chi riduce in schiavitù una creatura della dea possa essere il leader spirituale che condurrà l'umanità alla salvezza...\n@c0@"
  ja: "@a@b＊「マリアさんを　ドレイにするような\n\t教団の人が　世界を救うとは\n\tとても　信じられませんわ。\n@c0@"
310:
  de: "@aNonne von Obendroben@bDiesen Raum nutzen wir, um besonders wichtige weibliche Gäste unterzubringen.\n@c0@"
  en: "@aNun of the Above@bThis room is set aside for when we receive important lady guests.\n@c0@"
  es: "@aHermana subcelestial@bEsta habitación está reservada para invitadas especiales.\n@c0@"
  fr: "@aSœur du Firmament@bCette pièce est réservée à nos invitées de marque.\n@c0@"
  it: "@aSuora di Su'ncyel@bQuesta è una stanza riservata per le ospiti ⓕspecialiⓖ che vengono alla nostra abbazia.\n@c0@"
  ja: "@a@b＊「ここは　特別な　おじょうさまを\n\tおあずかりする時のための\n\tお部屋です。\n@c0@"
311:
