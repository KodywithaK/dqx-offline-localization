  en: "@aMaria@bI'm going to pray here every day for all of those poor slaves still imprisoned at the temple.\n@c0@"
  es: "@aMaría@bRezaré todos los días por esos pobres esclavos, aún prisioneros en el templo.\n@c0@"
  fr: "@aMaria@bTous les jours, je prierai pour ces malheureux esclaves encore emprisonnés au temple. \n@c0@"
  it: "@aMaria@bPregherò ogni giorno per i poveri schiavi che ancora lavorano in condizioni disumane per la costruzione del tempio.\n@c0@"
  ja: "@a@bマリア「私は　ここに残り\n\t多くのドレイの皆さんのために\n\t毎日　祈ることにしました。\n@c0@"
263:
  de: "@aMaria@bUnd ich bete darum, dass du deine Mutter findest, %a000090. Sei vorsichtig auf deinen Reisen. Ich werde dich niemals vergessen.\n@c0@"
  en: "@aMaria@bAnd I shall also be praying that you manage to find your mother, %a000090. Please take care on your travels. I'll never forget you.\n@c0@"
  es: "@aMaría@bY también rezaré por que encuentres a tu madre, %a000090. Por favor, cuídate. Nunca te olvidaré.\n@c0@"
  fr: "@aMaria@bJe prierai aussi pour que tu retrouves ta maman, %a000090. Fais bien attention à toi.\nJe ne t'oublierai jamais.\n@c0@"
