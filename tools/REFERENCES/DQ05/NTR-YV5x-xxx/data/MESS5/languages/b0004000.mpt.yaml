  es: "@a@b*: ¡No puede ser! He vuelto a perder. Eso de hacerse rico rápidamente es un camelo.\n@c0@"
  fr: "@a@b*ⓢ C'est pas vraiⓠ J'ai encore perdu. \nL'argent facile n'est qu'un mythe...\n@c0@"
  it: "@a@b*: Oh, accidenti alla scalogna!\nHo perso di nuovo!\nAddio sogni di ricchezza facile...\n@c0@"
  ja: "@a@b＊「はやあ　負けた　負けた！\n\t人生　やっぱり　楽をして\n\tかせげないもんだなあ。\n@c0@"
330:
