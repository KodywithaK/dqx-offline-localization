  ja: "@a@bヘンリー「オレなんか　まだ\n\tドレイの格好のままだぜ。\n\tまっ　いいけどね。\n@c0@"
194:
  de: "@aHarry@bViel wichtiger ist doch, dass Maria bald an einer Art Taufzeremonie teilnehmen wird, damit sie von nun an hier leben kann!\n@c0@"
  en: "@aHarry@bMuch more important is that Maria's going to take part in some kind of baptism ceremony so that she can live here from now on!\n@c0@"
  es: "@aFroilán@b¡Lo más importante es que María va a tomar parte en una especie de ceremonia de bautismo para poder quedarse a vivir aquí!\n@c0@"
  fr: "@aHarry@bIl y a plus importantⓢ Maria va se faire baptiser au cours d'une petite cérémonie afin de pouvoir vivre ici, désormaisⓠ\n@c0@"
  it: "@aRobert@bQuello che conta è che Maria sta per essere battezzata, o qualcosa del genere.\n㈡\nCredo che le suore le abbiano proposto di vivere all'Abbazia di Su'ncyel, almeno per un po' di tempo.\n@c0@"
  ja: "@a@bヘンリー「それはそうと　マリアさんが\n\tこの修道院の　洗礼を受けて\n\tここに残るらしいぞ。\n@c0@"
195:
  de: "@aHarry@bDu bist vermutlich nicht in der Stimmung dafür, wo du gerade erst aufgewacht bist, aber wir sollten uns das Ganze doch ansehen.\n@c0@"
  en: "@aHarry@bYou're probably not really in the mood having just woken up, but we should go along and watch.\n@c0@"
  es: "@aFroilán@bRecién despierto, lo más probable es que no estés de humor, pero deberíamos acudir.\n@c0@"
  fr: "@aHarry@bTu n'es peut-être pas encore en pleine forme, mais je pense que nous devrions y assister.\n@c0@"
  it: "@aRobert@bSo che ti sei appena rimesso in piedi, e probabilmente ti sentirai ancora un po' confuso, ma credo proprio che dovremmo assistere al rito.\n@c0@"
  ja: "@a@bヘンリー「お前は　目が覚めたばかりで\n\tいまいち　ピンとこないだろうけど\n\tまあ　とにかく　出席しようぜ。\n@c0@"
196:
  de: "@aNonne von Obendroben@bWir werden jetzt die Göttin bitten, unserer neuen Schwester Maria ihren Segen zu geben.\n@c0@"
  en: "@aNun of the Above@bWe will now call upon the Goddess to bestow her blessing on our new friend, Maria.\n@c0@"
  es: "@aHermana subcelestial@bAhora rezaremos a la Diosa para que bendiga a nuestra nueva oveja, María.\n@c0@"
  fr: "@aSœur du Firmament@bNous demandons à la Déesse d'offrir sa bénédiction à notre nouvelle amie, Maria.\n@c0@"
  it: "@aSuora di Su'ncyel@bChiediamo alla nostra adorata dea di far risplendere la sua luce di misericordia sulla nostra nuova amica Maria.\n@c0@"
  ja: "@a@b＊「それでは　これより\n\t私たちの新しい友　マリアさんに\n\t神の祝福が　さずけられます。\n@c0@"
197:
  de: "@aNonne von Obendroben@bWir danken der Göttin, dass du den Weg hierher zum Stift Obendroben gefunden hast, meine liebe Maria.\n@c0@"
  en: "@aNun of the Above@bWe thank the Goddess that you found your way here to us at Heaven's Above Abbey, dear friend Maria.\n@c0@"
  es: "@aHermana subcelestial@bDamos gracias a la Diosa por haberte traído hasta nuestra Abadía Subcelestis, querida María.\n@c0@"
  fr: "@aSœur du Firmament@bNous remercions la Déesse de t'avoir amenée à l'abbaye du Firmament, chère Maria.\n@c0@"
  it: "@aSuora di Su'ncyel@bMaria, cara figliola, ringraziamo la dea di averti fatto trovare la via che ti ha condotta qui all'Abbazia di Su'ncyel.\n@c0@"
  ja: "@a@b＊「わが修道院へ　みちびかれし\n\tわれらの友　マリアよ。\n@c0@"
198:
  de: "@aNonne von Obendroben@bUnd wir bitten die Allmächtige, dir an diesem Tag ihren Segen zu geben.\n@c0@"
  en: "@aNun of the Above@bAnd we call upon the Almighty One to grant you her blessing on this day.\n@c0@"
  es: "@aHermana subcelestial@bY pedimos a la Todopoderosa que te conceda su bendición en este día.\n@c0@"
  fr: "@aSœur du Firmament@bEt nous en appelons à la Toute-Puissante pour qu'elle te bénisse en ce jour.\n@c0@"
  it: "@aSuora di Su'ncyel@bPreghiamo la dea onnipotente di non farti mai mancare la sua benedizione.\n@c0@"
  ja: "@a@b＊「そなたに　聖なる神の\n\t祝福を　さずけましょう。\n@c0@"
199:
  de: "@a@bDie Oberin Obenhin schenkt langsam eine rubinfarbene Flüssigkeit ein und gibt sie Maria.\n@c0@"
  en: "@a@bAbbess Abovall pours ruby-coloured liquid slowly from the glass and hands it to Maria.\n@c0@"
  es: "@a@bLa Madre superiora supercelestial vierte un líquido rojizo en un vaso y se lo da a María.\n@c0@"
  fr: "@a@bL'abbesse du Firmament verse un liquide rubis dans un verre et le tend à Maria.\n@c0@"
  it: "@a@bLa madre superiora di Su'ncyel versa un liquido di colore rosso in un bicchiere, che poi porge a Maria.\n@c0@"
  ja: "@a@bマザーは　グラスに入った\nルビー色の水を　少しずつ\nマリアに　ふりかけた。\n@c0@"
200:
  de: "@aNonne von Obendroben@bMit diesem symbolischen Trank beten wir, dass der Schutz der Göttin nun in dir und um dich herum sei.\n@c0@"
  en: "@aNun of the Above@bWith this symbolic drink, we pray that the protection of the Goddess now flows within and around you.\n@c0@"
  es: "@aHermana subcelestial@bCon esta bebida simbólica pedimos que la protección de la Diosa fluya dentro y fuera de ti.\n@c0@"
  fr: "@aSœur du Firmament@bBois et prions pour que la Déesse te protège aussi bien de l'intérieur que de l'extérieur.\n@c0@"
  it: "@aSuora di Su'ncyel@bQuesto liquido consacrato simboleggia l'amore che la dea ha per tutti i suoi figli, e che ora scorre anche dentro di te.\n@c0@"
  ja: "@a@b＊「……さあ　これで　あなたにも\n\t聖なる加護が　あたえられました。\n@c0@"
201:
  de: "@aNonne von Obendroben@bVon nun an wirst du dich deinen Studien widmen, auf dass die Schönheit deiner gesegneten Seele stets rein bleiben möge.\n@c0@"
  en: "@aNun of the Above@bHenceforth, you will dedicate yourself to your studies such that the beauty of your blessed soul may never be sullied.\n@c0@"
  es: "@aHermana subcelestial@bA partir de ahora te dedicarás al estudio, de modo que la belleza de tu alma bendita nunca sea mancillada.\n@c0@"
  fr: "@aSœur du Firmament@bDésormais, tu te consacreras à l'étude. La beauté de ton âme bénie ne sera plus jamais souillée.\n@c0@"
  it: "@aSuora di Su'ncyel@bChe la tua anima possa restare sempre pura e candida, figliola. Lo sguardo benevolo della dea ti seguirà ovunque andrai.\n@c0@"
  ja: "@a@b＊「これからは　その美しき　たましいが\n\tけがされることの　ないよう\n\t正しき道を　学ぶのですよ。\n@c0@"
202:
  de: "@aNonne von Obendroben@bDamit ist unsere Zeremonie beendet. Kehren wir nun alle zu unseren Pflichten zurück.\n@c0@"
  en: "@aNun of the Above@bThis concludes our ceremony. Now, let us all return to our duties.\n@c0@"
  es: "@aHermana subcelestial@bAsí concluye la ceremonia. Y ahora, a nuestros quehaceres.\n@c0@"
  fr: "@aSœur du Firmament@bAinsi se termine notre cérémonie. Retournons tous et toutes à nos obligations.\n@c0@"
  it: "@aSuora di Su'ncyel@bLa cerimonia del battesimo è terminata.\nTornate alle vostre attività.\n@c0@"
  ja: "@a@b＊「では　これで　儀式を終わります。\n\tさあ皆さん　今日のお仕事に\n\tもどりましょう。\n@c0@"
203:
  de: "@aNonne von Obendroben@bIhr seid einer der Jungen, die mit Maria in einem Fass angespült wurden, nicht wahr?\n@c0@"
