0:
  de: "@a@b*: He! Schwing die Hufe! Hoch mit dem Felsen, aber mal 'n bisschen zackig!\n@c0@"
  en: "@a@b*: Hey! Stop your dawdling!\nHurry up and get that rock moved!\n@c0@"
  es: "@a@b*: ¡Eh! ¡Andando!\r\n¡Date prisa y mueve esa roca!\n@c0@"
  fr: "@a@b*ⓢ Héⓠ Arrête de traînerⓠ\nDépêche-toi de déplacer ce rocherⓠ\n@c0@"
  it: "@a@b*: Forza!\nNon state con le mani in mano!\nPrendete quella roccia e spostatela!\n@c0@"
  ja: "@a@b＊「こらー！　なにをしているっ！\n\tさっさと　岩をはこばんかっ！\n@c0@"
1:
  de: "@a@b*: Du da! Nicht so lahm! Sonst kriegst du meine Peitsche zu schmecken!\n@c0@"
  en: "@a@b*: Oi! Stop yer slackin'! It'll be a whippin' for you if you don't move the next rock a bit smartish.\n@c0@"
  es: "@a@b*: ¡Eh! ¡Se acabó el descanso! ¡Si no mueves más rápido la siguiente roca, saco el látigo!\n@c0@"
  fr: "@a@b*ⓢ Ohⓠ Tu te réveillesⓡ Tu vas goûter de mon fouet si tu ne bouges pas les rochers plus vite que ça.\n@c0@"
  it: "@a@b*: Forza con le braccia!\nSe non vi date una mossa a spostare quella pietra, vi ricamo la schiena a suon di frustate!\n@c0@"
  ja: "@a@b＊「ほらほら　休んでいないで\n\t次の岩を持ってこないと\n\tまたムチで　ぶたれるぞ。\n@c0@"
2:
  de: "@a@b*: Was glotzt du mich so an?\n@c0@"
  en: "@a@b*: What's that look on your face?\n@c0@"
  es: "@a@b*: ¿Qué mirada es esa?\n@c0@"
  fr: "@a@b*ⓢ Pourquoi tu me regardes comme çaⓡ\n@c0@"
  it: "@a@b*: Cos'è quella faccia, eh?\n@c0@"
  ja: "@a@b＊「なんだ　その目つきはっ？\n@c0@"
3:
  de: "@a@b*: Sklaven sollten abgestumpft gucken, als wären sie schon tot!\n@c0@"
  en: "@a@b*: Slaves are supposed to have eyes like the dead!\n@c0@"
  es: "@a@b*: ¡Los esclavos tienen que tener la mirada muerta!\n@c0@"
  fr: "@a@b*ⓢ Les esclaves sont pas censés nous regarder comme çaⓠ\n@c0@"
  it: "@a@b*: Gli schiavi dovrebbero avere lo sguardo morto, senza speranza!\n@c0@"
  ja: "@a@b＊「ドレイはよお\n\tもっと　死んだような目を\n\tしてるもんだぜ。\n@c0@"
4:
  de: "@a@b*: Du machst mich krank! \nLos, zurück an die Arbeit!\n@c0@"
  en: "@a@b*: You make me sick!\nGet back to work!\n@c0@"
  es: "@a@b*: ¡Me pones enfermo!\r\n¡Vamos, a trabajar!\n@c0@"
  fr: "@a@b*ⓢ Tu me dégoûtesⓠ\nRemets-toi au travailⓠ\n@c0@"
  it: "@a@b*: Mi fai vomitare!\nTornatene subito al lavoro!\n@c0@"
  ja: "@a@b＊「ええい　気分の悪いヤツめ！\n\tさあ　はたらくんだっ！\n@c0@"
5:
  de: "@a@bEin gewaltiges Rad wird durch Sklaven angetrieben.\n@c0@"
  en: "@a@bThere's a large wheel turning as the slaves walk.\n@c0@"
  es: "@a@bLos esclavos caminan haciendo girar un gran mecanismo.\n@c0@"
  fr: "@a@bUne grande roue tourne à mesure que les esclaves marchent.\n@c0@"
  it: "@a@bUna grande ruota gira mentre gli schiavi camminano senza sosta...\n@c0@"
  ja: "@a@bドレイの足ぶみに　合わせて\n巨大な輪が　回転している……。\n@c0@"
6:
  de: "@a@b*: Ohhh... Dieser elende Orden vom Zugzwang...\nEhe sie gekommen sind, führten wir ein friedliches, unbeschwertes Leben.\n@c0@"
  en: "@a@b*: Ohhh... That wretched Order of Zugzwang...\r\nBefore they came along, we were just peacefully getting on with our lives.\n@c0@"
  es: "@a@b*: Oooh... Esa maldita Orden de Zugzwang...\r\nAntes de que aparecieran vivíamos tranquilos y en paz.\n@c0@"
  fr: "@a@b*ⓢ Ohhh... Maudit Ordre du Zugzwang...\nAvant qu'ils n'arrivent, nous vivions bien tranquillement.\n@c0@"
  it: "@a@b*: Quei maledetti della Setta di Zugzwang ci hanno rovinato la vita...\n@c0@"
  ja: "@a@b＊「うう……。　なにが　光の国じゃ……。\n\tわしらは　あやつらが来るまで\n\tこの地で平和に暮らしていたのに……。\n@c0@"
7:
  de: "@a@b*: Jetzt haben wir keinerlei Freiheiten mehr. Sie gestatten es uns noch nicht einmal, die Göttin anzubeten.\n@c0@"
  en: "@a@b*: Now we have no freedom whatsoever. They won't even let us carry on worshipping the Goddess.\n@c0@"
  es: "@a@b*: Ahora ya no tenemos ni un respiro. Ni siquiera nos dejan rezarle a la Diosa.\n@c0@"
  fr: "@a@b*ⓢ Et maintenant, nous voilà privés de toute liberté. Ils ne nous laissent même plus vénérer la Déesse.\n@c0@"
  it: "@a@b*: Ci hanno privato di ogni libertà e ci impediscono persino di adorare la nostra cara dea...\n@c0@"
  ja: "@a@b＊「今の　わしらには　なんの\n\t自由もない。　かつての　われらが神を\n\tあがめることさえ　許されぬのじゃ。\n@c0@"
8:
  de: "@a@b*: Haah... Haah...\n@c0@"
  en: "@a@b*: Haah...haah...\n@c0@"
  es: "@a@b*: Aah... aah...\n@c0@"
  fr: "@a@b*ⓢ Pfiou...\n@c0@"
  it: "@a@b*: Haaah... Haaah...\n@c0@"
  ja: "@a@b＊「はあはあ……。\n@c0@"
9:
  de: "@a@b*: Halte mich nicht auf, Kumpel. Ich will nicht ausgepeitscht werden.\n@c0@"
  en: "@a@b*: Don't slow me down, mate.\nI don't want a whipping.\n@c0@"
  es: "@a@b*: No me hagas perder el tiempo, camarada.\r\nNo quiero que me azoten.\n@c0@"
  fr: "@a@b*ⓢ Me retarde pas, mon gars.\nJ'ai pas envie de me faire fouetter.\n@c0@"
  it: "@a@b*: Amico, non rallentarmi...\nNon voglio essere frustato...\n@c0@"
  ja: "@a@b＊「ジャマをしないでください。\n\tムチで打たれたくないんです。\n@c0@"
10:
  de: "@a@b*: Uff! Wie viele Felsen müssen wir noch schleppen, bis wir uns etwas ausruhen können?\n@c0@"
  en: "@a@b*: Ugh! How many more rocks do we have to move before we can get a rest?\n@c0@"
  es: "@a@b*: ¡Ugh! ¿Cuántas rocas más tendré que mover antes de que nos den un descanso?\n@c0@"
  fr: "@a@b*ⓢ Pfffⓠ Combien de rochers il va encore falloir déplacer avant de pouvoir se reposerⓡ\n@c0@"
  it: "@a@b*: Ugh!\nQuante altre rocce dovremo spostare prima di poterci riposare...?\n@c0@"
  ja: "@a@b＊「ううっ……。\n\tいったい　どれだけ岩を運べば\n\t休めるんだ……。\n@c0@"
11:
  de: "@a@b*: Haah... haah... Wir müssen bestimmt noch mindestens tausend Felsen schleppen, bevor sie uns eine Pause gönnen.\n@c0@"
  en: "@a@b*: Haah...haah... I reckon we need to move at least another thousand rocks before they let us rest.\n@c0@"
  es: "@a@b*: Aah... aah... Creo que antes del siguiente descanso hay que mover un millar de rocas más.\n@c0@"
  fr: "@a@b*ⓢ Aah... Aah... Je suis sûr qu'il va falloir déplacer encore des milliers de cailloux avant qu'ils nous laissent nous reposer.\n@c0@"
  it: "@a@b*: Haaah... Haaah...\nMi sa che dovremo muovere altri mille macigni, prima che ci facciano dormire un po'...\n@c0@"
  ja: "@a@b＊「はあ　はあ……。\n\tあと　１０００個くらい　岩を\n\t運べば　休めるだろう……。\n@c0@"
12:
  de: "@a@b*: Ich bin das Wassermädchen. Magst du was trinken, Hübscher?\n@c0@"
  en: "@a@b*: I'm the water girl. Can I offer \r\nyou a drink, handsome?\n@c0@"
  es: "@a@b*: Soy la aguadora. ¿Quieres beber, guapo?\n@c0@"
  fr: "@a@b*ⓢ Je suis la serveuse d'eau.\nJe peux t'offrir à boire, mon mignonⓡ\n@c0@"
  it: "@a@b*: Io sono la ragazza spegni-sete.\nVuoi un po' d'acqua?\n@c0@"
  ja: "@a@b＊「私は　水くみ女よ。\n\tステキなドレイさん\n\t水を　いっぱい　いかが？\n@c0@"
13:
  de: "@a@b*: Hier, bitte.\n@c0@"
  en: "@a@b*: Here you are.\n@c0@"
  es: "@a@b*: Aquí tienes.\n@c0@"
  fr: "@a@b*ⓢ Tiens.\n@c0@"
  it: "@a@b*: Ecco qua.\n@c0@"
  ja: "@a@b＊「はい　どうぞ。\n@c0@"
14:
  de: "@a@b*: Gut. Komm einfach zu mir, wenn du Durst bekommst.\n@c0@"
  en: "@a@b*: Okay. Just come and find me\r\nwhen you get thirsty, then.\n@c0@"
  es: "@a@b*: Muy bien. Cuando tengas sed ven a buscarme.\n@c0@"
  fr: "@a@b*ⓢ N'hésite pas à venir me voir quand tu auras soif.\n@c0@"
  it: "@a@b*: Va bene.\nQuando hai voglia di un goccio d'acqua, vieni pure da me.\n@c0@"
  ja: "@a@b＊「のどが　かわいたときは\n\t私に　いってね。\n@c0@"
15:
  de: "@a@b*: Du da! Beweg dich!\n@c0@"
  en: "@a@b*: Come on! Get movin'!\n@c0@"
  es: "@a@b*: ¡Vamos, en marcha!\n@c0@"
  fr: "@a@b*ⓢ Héⓠ T'es pas là pour te reposerⓠ\n@c0@"
  it: "@a@b*: Forza! Muoversi!\n@c0@"
  ja: "@a@b＊「さあ　とっとと\n\tはこんで　行きやがれ！\n@c0@"
16:
  de: "@a@b*: Oder brauchst du erst einen Stein auf die Nase als Einladung?\n@c0@"
  en: "@a@b*: I'll have to smash your face in with this rock if you don't get back to work!\n@c0@"
  es: "@a@b*: ¡Si no empiezas a trabajar te aplasto la cara con esta roca!\n@c0@"
  fr: "@a@b*ⓢ Tu vas te retrouver le pif dans ce rocher si tu te remets pas immédiatement au boulotⓠ\n@c0@"
  it: "@a@b*: Se non lavorate come si deve, vi spiaccicherò contro il muro come insetti!\n@c0@"
  ja: "@a@b＊「ノタノタしてると\n\tこの岩に　押しつぶされるぞ！\n@c0@"
17:
  de: "@a@b*: Trag diese Steinsäcke nach oben! Der Anführer unseres Ordens verliert langsam die Geduld. Er will den Tempel endlich fertig sehen.\n@c0@"
  en: "@a@b*: Get these bags of stones carried upstairs! The leader of the Order is getting impatient for the temple to be finished.\n@c0@"
  es: "@a@b*: ¡Lleva esos sacos de piedras arriba!\r\nEl líder de la Orden está impaciente, quiere terminar el templo de una vez.\n@c0@"
  fr: "@a@b*ⓢ Faites monter ces sacs de pierres à l'étageⓠ\nLe chef de l'Ordre s'impatiente. Il faut terminer\nle temple.\n@c0@"
  it: "@a@b*: Questi sacchi pieni di pietre devono essere trasportati di sopra!\n㈡\n*: Il nostro supremo signore vuole che la costruzione del tempio sia completata il prima possibile!\n@c0@"
  ja: "@a@b＊「この石の入った袋を　上に運ぶんだ！\n\t光の国の教祖さまは　大神殿の完成を\n\t待ちのぞまれているぞ。\n@c0@"
18:
  de: "@a@b*: Dalli! Los, schuftet schön weiter!\nIst mir doch piepegal, ob ihr dabei vor Erschöpfung krepiert!\n@c0@"
  en: "@a@b*: Keep working! Keep working!\nWork until you drop dead for all I care!\n@c0@"
  es: "@a@b*: ¡Seguid trabajando! ¡Vamos!\r\n¡Trabajad hasta caer muertos!\n@c0@"
  fr: "@a@b*ⓢ T'as pas intérêt à t'arrêterⓠ Tu travailleras\njusqu'à ce que tu t'écroulesⓠ Pour ce que j'en ai à faireⓠ\n@c0@"
  it: "@a@b*: Lavorate! Lavorate, schiavi!\nNon risparmiatevi! Non m'importa un accidenti se siete stanchi! Dovete lavorareee!\n@c0@"
  ja: "@a@b＊「はたらけ！　はたらけ！\n\t死ぬまで　はたらくんだ！\n@c0@"
19:
  de: "@a@b*: Um Mutters willen... Aaaah!\n@c0@"
  en: "@a@b*: For mother's sake...\nYaaah!\n@c0@"
  es: "@a@b*: Por todos los diablos...\n¡Aaah!\n@c0@"
  fr: "@a@b*ⓢ C'est pas possible...\nAaaahⓠ\n@c0@"
  it: "@a@b*: Oh, per la miseria...\n@c0@"
  ja: "@a@b＊「お母ちゃんの　ためなら\n\tエーンヤコーラ！\n@c0@"
