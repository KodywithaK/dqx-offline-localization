  fr: "@a@b*ⓢ Et je vais y arriverⓠ Je ne laisserai personne me décourager. Je serai l'étoile de cette ville. \n@c0@"
  it: "@a@b*: E sono certa che ci riuscirò!\nDiventerò la ballerina più famosa della città!\n@c0@"
  ja: "@a@b＊「きっと　トップダンサーに\n\tなってみせるわ。\n@c0@"
