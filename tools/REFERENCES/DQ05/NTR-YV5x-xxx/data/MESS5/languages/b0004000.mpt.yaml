  it: "@aSuora di Su'ncyel@bTutti i viaggiatori che vengono da queste parti passano di lì. Forse ci troverai qualcuno che ha sentito parlare di tua madre...\n@c0@"
  ja: "@a@b＊「あそこには　旅人もたくさん\n\t立ちよりますから　なにか　役に立つ\n\tお話が　聞けるかもしれませんね。\n@c0@"
