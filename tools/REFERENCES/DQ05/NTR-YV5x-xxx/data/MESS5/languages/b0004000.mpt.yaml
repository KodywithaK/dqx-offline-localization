  fr: "@a@b*ⓢ Je suis venu à Bonaventure parce qu'on m'a dit qu'il y avait une boutique qui vendait des objets vraiment étranges.\n㈡\n*ⓢ Mais apparemment, elle est fermée pendant la journée.\n@c0@"
  it: "@a@b*: Sono venuto a Fortuna perché qui c'è un negozio che vende oggetti molto particolari.\nPerò non sapevo che fosse chiuso durante il giorno...\n@c0@"
  ja: "@a@b＊「めずらしい物を売っている店が\n\tあると　聞いて来たのだが\n\t昼間は　やっていないらしいな。\n@c0@"
