  en: "@aNun of the Above@bVery well. I wish you pleasant dreams.\n@c0@"
  es: "@aHermana subcelestial@bMuy bien. Dulces sueños.\n@c0@"
  fr: "@aSœur du Firmament@bParfait. Faites de beaux rêves.\n@c0@"
  it: "@aSuora di Su'ncyel@bMolto bene!\n%H0860%XTi%YVi%Z auguro un sonno sereno!\n@c0@"
  ja: "@a@b＊「では　ごゆっくりどうぞ。\n\t良い夢が見られますよう……。\n@c0@"
323:
  de: "@aNonne von Obendroben@bGuten Morgen! Heute ist wieder ein herrlicher Tag.\n@c0@"
  en: "@aNun of the Above@bGood morning! It's another beautiful day outside.\n@c0@"
  es: "@aHermana subcelestial@b¡Buenos días! Hermosa mañana la de hoy.\n@c0@"
  fr: "@aSœur du Firmament@bBonjourⓠ La journée s'annonce magnifique.\n@c0@"
  it: "@aSuora di Su'ncyel@bBuongiorno! Oggi è una splendida giornata.\n@c0@"
  ja: "@a@b＊「おはようございます。\n\t今日も　いい天気ですよ。\n@c0@"
324:
  de: "@aNonne von Obendroben@bJeder unserer Gäste hier in der Abtei liegt uns sehr am Herzen. Ich hoffe doch, dass wir Euch wiedersehen werden.\n@c0@"
  en: "@aNun of the Above@bWe value every guest we have here at the abbey extremely highly. I do hope we'll make your acquaintance again.\n@c0@"
  es: "@aHermana subcelestial@bValoramos muchísimo a todos aquellos que visitan nuestra abadía. Espero que volvamos a vernos.\n@c0@"
  fr: "@aSœur du Firmament@bNous réservons toujours les meilleurs égards aux invités de l'abbaye. J'espère que vous reviendrez nous voir.\n@c0@"
  it: "@aSuora di Su'ncyel@bQui all'Abbazia di Su'ncyel siamo sempre felici di ospitare i pellegrini bisognosi di riposo e di ristoro.\n㈡\n%H0860%XSappi che qui troverai%YSappiate che qui troverete%Z sempre un pasto caldo e un letto pulito.\n@c0@"
  ja: "@a@b＊「この修道院を　おとずれる方は\n\tみな　大切なお客さまですわ。\n\tどうぞ　また　お声をかけてください。\n@c0@"
325:
  de: "@aMaria@bIch bedaure wirklich, mich auf den Orden vom Zugzwang eingelassen zu haben.\n@c0@"
  en: "@aMaria@bI really regret the involvement I had with the Order of Zugzwang.\n@c0@"
  es: "@aMaría@bLamento enormemente mi participación en la Orden de Zugzwang.\n@c0@"
  fr: "@aMaria@bJe regrette sincèrement d'avoir fait partie de l'Ordre du Zugzwang.\n@c0@"
  it: "@aMaria@bChe errore ho commesso quando ho accettato di entrare a far parte della Setta di Zugzwang...\nÈ stata un'esperienza devastante.\n@c0@"
  ja: "@a@bマリア「教団に　いたことは\n\t後悔していますけど……。\n@c0@"
326:
  de: "@aMaria@bAber ein Gutes hatte das Ganze, und das ist meine Bekanntschaft mit dir und Harry, %a000090. Darauf möchte ich um nichts in der Welt verzichten.\n@c0@"
  en: "@aMaria@bBut the one good thing to come out of it was meeting you and Harry, %a000090. I wouldn't change that for the world.\n@c0@"
  es: "@aMaría@bPero algo bueno salió de ello: os conocí a ti y a Froilán, %a000090. No lo cambiaría por nada del mundo.\n@c0@"
  fr: "@aMaria@bMais au moins, cela m'aura permis de vous rencontrer, Harry et toi, %a000090. Pour rien au monde, je ne voudrais revenir en arrière.\n@c0@"
  it: "@aMaria@bMa se non l'avessi vissuta, non avrei mai avuto la possibilità di incontrare te e Robert, %a000090...\nSiete due persone meravigliose.\n@c0@"
  ja: "@a@bマリア「ヘンリーさまや\n\t%a000090さんと　お会いできて\n\tうれしかったですわ。　ぽっ。\n@c0@"
327:
  de: "@aNonne von Obendroben@bWie merkwürdig. Maria ist ganz rot geworden. Ich frage mich, was da wohl los ist.\n@c0@"
  en: "@aNun of the Above@bThat's odd. Maria's gone all red. I wonder what's the matter.\n@c0@"
  es: "@aHermana subcelestial@b¡Qué raro! María se ha puesto roja. ¿Qué le pasará?\n@c0@"
  fr: "@aSœur du Firmament@bC'est étrange. Maria est toute rouge.\r\nJe me demande ce qui se passe.\n@c0@"
  it: "@aSuora di Su'ncyel@bChe strano...\nMaria è diventata tutta rossa.\nChissà cosa le è preso...\n@c0@"
  ja: "@a@b＊「あら？　マリアさんったら\n\t顔が　赤いわ。\n\tどうしたのかしら。\n@c0@"
328:
  de: "@a@b*: Dies ist die Stadt Fortuna, wo jeder seines eigenen Glückes Schmied ist!\n@c0@"
  en: "@a@b*: This here's the town of Fortuna, the land of hope and glory!\n@c0@"
  es: "@a@b*: ¡Esta es la ciudad de Fortuna, tierra de gloria y esperanza!\n@c0@"
  fr: "@a@b*ⓢ Voici Bonaventure, la ville où tous vos rêves peuvent devenir réalitéⓠ\n@c0@"
  it: "@a@b*: Questa è Fortuna, 'a città d'a speranza e d'a bbona sorte!\n@c0@"
  ja: "@a@b＊「ここは　誰もが夢を抱き\n\tやって来る\n\tオラクルベリーの都だ。\n@c0@"
329:
  de: "@a@b*: Ach, Menno! Schon wieder verloren. Tja, es gibt einfach kein leicht verdientes Geld.\n@c0@"
