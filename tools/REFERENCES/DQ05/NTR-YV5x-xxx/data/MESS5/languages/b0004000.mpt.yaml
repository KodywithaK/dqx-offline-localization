  en: "@aNun of the Above@bWe had a young rich girl here until just the other day undergoing her domestic goddess training.\n@c0@"
  es: "@aHermana subcelestial@bHasta hace unos días tuvimos aquí a una rica heredera que había venido a recibir un curso de economía doméstica de la Diosa.\n@c0@"
  fr: "@aSœur du Firmament@bIl y a encore quelques jours, elle était occupée par une jeune fille riche venue faire son éducation domestique et religieuse.\n@c0@"
  it: "@aSuora di Su'ncyel@bFino all'altro giorno era usata da una fanciulla proveniente da una ricca famiglia. Era qui per seguire il nostro corso di preparazione matrimoniale.\n@c0@"
  ja: "@a@b＊「つい　この間まで　お金持ちの\n\tおじょうさまが　花嫁修業に\n\tいらしていたんですが……\n@c0@"
312:
  de: "@aNonne von Obendroben@bSie war so hübsch und sanftmütig. Ich glaube, wir haben von ihr vielleicht noch mehr gelernt als sie von uns!\n@c0@"
  en: "@aNun of the Above@bShe was such a beautiful and kind-hearted girl. I think we probably learnt more from her than she did from us!\n@c0@"
  es: "@aHermana subcelestial@bEra muy hermosa y tenía un gran corazón. ¡Quizá aprendimos más nosotras de ella que al revés!\n@c0@"
  fr: "@aSœur du Firmament@bElle était si belle et si douce. Je pense que nous avons plus appris d'elle qu'elle n'a appris de nousⓠ\n@c0@"
  it: "@aSuora di Su'ncyel@bÈ una ragazza dolce e intelligente, oltre che bella.\nForse abbiamo appreso più cose da lei di quante non gliene abbiamo insegnate!\n@c0@"
  ja: "@a@b＊「それはもう　心のやさしい　美しい\n\t娘さんで　私たちこそ　勉強させて\n\tいただきましたわ。\n@c0@"
313:
  de: "@aNonne von Obendroben@bZuerst waren wir mit ihr gesegnet und nun mit Eurer Maria. Was für ein Glück, so wunderbare Menschen um sich zu haben.\n@c0@"
  en: "@aNun of the Above@bFirst we were blessed with her presence, and now we have your Maria. We're so lucky to have such delightful people around us.\n@c0@"
  es: "@aHermana subcelestial@bPrimero contamos con la bendición de su presencia, y ahora con la de María.\n㈡\nSomos muy afortunadas de poder disfrutar de la compañía de tan buenas personas.\n@c0@"
  fr: "@aSœur du Firmament@bMaintenant, c'est Maria qui nous fait la grâce de sa présence. Nous avons beaucoup de chance d'avoir des personnes si charmantes autour de nous.\n@c0@"
  it: "@aSuora di Su'ncyel@bE non appena quella fanciulla ha lasciato l'Abbazia, la dea ci ha mandato Maria.\nÈ bellissimo avere con noi persone tanto care!\n@c0@"
  ja: "@a@b＊「その娘さんといい　%a000090さんが\n\tお連れになった　マリアさんといい\n\tここは　人にめぐまれていますね。\n@c0@"
314:
  de: "@aNonne von Obendroben@bDu liebe Güte! Ein Monster in unserem friedlichen Heiligtum!\n@c0@"
  en: "@aNun of the Above@bGood heavens! A monster in our peaceful sanctuary!\n@c0@"
