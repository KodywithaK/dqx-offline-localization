  de: "@aOberin Obenhin@bIhr seid jetzt erwachsen, %a000090.\n@c0@"
  en: "@aAbbess Abovall@bYou're a grown man now, %a000090.\n@c0@"
  es: "@aMadre superiora supercelestial@bYa eres todo un hombre, %a000090.\n@c0@"
