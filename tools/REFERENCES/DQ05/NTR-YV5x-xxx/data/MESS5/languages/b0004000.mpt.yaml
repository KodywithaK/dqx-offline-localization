  de: "@a@b*: Pfft! Manchen ist echt nicht mehr zu helfen. Glaubst du etwa wirklich an solche Ammenmärchen?\n@c0@"
  en: "@a@b*: Honestly! There's no helping some people. Did they tell you ⓗgullibleⓘ has been removed from the dictionary too!?\n@c0@"
  es: "@a@b*: ¡Venga ya! No tienes remedio. ¿Y sabías que también han eliminado ⓕcréduloⓖ del diccionario?\n@c0@"
  fr: "@a@b*ⓢ Honnêtementⓠ Il faut arrêter de tout gober.\nEst-ce qu'ils ont dit qu'ils allaient nous payer aussiⓡ \n@c0@"
  it: "@a@b*: Certo che lo faranno! E ci daranno anche una casa con giardino, una pensione e pasti gratis.\nBah! Mi fai proprio ridere...\n@c0@"
  ja: "@a@b＊「知らん　知らん！\n\tおめえは　幸せなヤツだよ！\n@c0@"
98:
  de: "@a@b*: Ah, du bist es! Du bist der, dessen Vater von einem der Tempelangehörigen umgebracht wurde, oder nicht?\n@c0@"
  en: "@a@b*: Hah, it's you! You're the one whose old man was killed by one of the people of this temple, eh?\n@c0@"
  es: "@a@b*: ¡Ah, eres tú! Eres ese a cuyo padre mató alguno de los de este templo, ¿no?\n@c0@"
  fr: "@a@b*ⓢ Ah, c'est toiⓠ C'est ton père qui a été tué par un des fidèles de ce culte, nonⓡ\n@c0@"
  it: "@a@b*: Ah! Tu sei quel tizio il cui padre fu ucciso dai padroni di questo tempio, non è così?\n@c0@"
  ja: "@a@b＊「よお　おめえか！\n\tおめえの親父は　この教団の\n\tヤツらに　殺されたんだってな。\n@c0@"
99:
  de: "@a@b*: Du darfst nie den Schmerz vergessen, den du an jenem Tag empfunden hast.\n@c0@"
  en: "@a@b*: Y'know, you must never forget the pain you felt that day.\n@c0@"
  es: "@a@b*: Nunca olvides el dolor que sentiste ese día.\n@c0@"
  fr: "@a@b*ⓢ Écoute-moi bien. Tu ne dois jamais oublier la douleur que tu as ressentie ce jour-là.\n@c0@"
  it: "@a@b*: Voglio darti un consiglio: non dimenticare mai il dolore che hai provato il giorno in cui tuo padre venne ammazzato!\n@c0@"
  ja: "@a@b＊「その時の　くやしさを\n\t忘れちゃいけねえぜ。\n@c0@"
100:
  de: "@a@b*: Es sind starke Gefühle dieser Art, die hier den Unterschied zwischen Leben und Tod ausmachen.\n@c0@"
  en: "@a@b*: It's strong feelings like that that make the difference between life and death here.\n@c0@"
  es: "@a@b*: Son esos sentimientos profundos los que aquí marcan la diferencia entre la vida y la muerte.\n@c0@"
  fr: "@a@b*ⓢ Ici, ce sont ces sentiments forts qui font la différence entre la vie et la mort.\n@c0@"
  it: "@a@b*: Solo i sentimenti forti possono darti la spinta per continuare a vivere, in un posto come questo!\n@c0@"
  ja: "@a@b＊「その思いがあるかぎり\n\tおめえは　きっと\n\t生きてゆけるだろうからな。\n@c0@"
101:
  de: "@a@b*: Ich muss dir was erzählen.\n@c0@"
  en: "@a@b*: I have to tell you something.\n@c0@"
  es: "@a@b*: Tengo algo que decirte.\n@c0@"
  fr: "@a@b*ⓢ Je dois te dire quelque chose.\n@c0@"
  it: "@a@b*: Devo parlarti...\n@c0@"
  ja: "@a@b＊「ちょっと　聞いておくれよ。\n@c0@"
102:
  de: "@a@b*: Siehst du das Mädchen da drüben ⓚⓛ Maria?\nSie war eine Anhängerin des Ordens, aber dann haben sie eine Sklavin aus ihr gemacht.\n@c0@"
  en: "@a@b*: See that girl over there, Maria? She was a follower of the Order, but then they made\r\nher into a slave.\n@c0@"
  es: "@a@b*: ¿Ves a esa chica, María? Era seguidora de la Orden, pero la hicieron esclava.\n@c0@"
  fr: "@a@b*ⓢ Tu vois cette jeune filleⓡ Elle s'appelle Maria.\nC'était une adepte de l'Ordre, mais ils l'ont\nréduite en esclavage.\n@c0@"
  it: "@a@b*: Vedi quella ragazza? Si chiama Maria, e fino a poco fa era una seguace della Setta di Zugzwang.\nPoi, tutt'a un tratto, l'hanno spedita qui...\n@c0@"
  ja: "@a@b＊「そこの　マリアちゃんは\n\t光の教団の信者だったのに\n\tドレイに　されちゃったのよ。\n@c0@"
103:
  de: "@a@b*: Und zwar deswegen, weil sie sich ihren Befehlen widersetzte und versuchte, ein Sklavenkind zu schützen, oder so was in der Art.\n@c0@"
  en: "@a@b*: Something about her going against orders and trying to protect a child slave or suchlike.\n@c0@"
  es: "@a@b*: Fue por desobedecer órdenes e intentar proteger a un niño esclavo o algo por el estilo.\n@c0@"
  fr: "@a@b*ⓢ Elle aurait refusé d'exécuter des ordres et essayé de protéger un enfant esclave,\nou quelque chose comme ça.\n@c0@"
  it: "@a@b*: E sai perché l'hanno ridotta in schiavitù?\nPerché ha disubbidito agli ordini del capo per proteggere un bambino!\n@c0@"
  ja: "@a@b＊「なんでも　教団の教えに　さからい\n\tドレイの子どもを　かばったとかで……。\n@c0@"
104:
  de: "@a@b*: Ihr Bruder ist auch im Orden, als Soldat. Kannst du dir das vorstellen? Kaum zu glauben, dass sie so streng mit ihr sind.\n@c0@"
  en: "@a@b*: Her brother is a soldier for the Order as well, would you believe? I can't believe they'd treat her so harshly.\n@c0@"
  es: "@a@b*: Su hermano es soldado de la Orden, ¿puedes creerlo? ¡Cómo han podido hacerle esto!\n@c0@"
  fr: "@a@b*ⓢ Son frère est un soldat et aussi un adepte de l'Ordre. C'est fouⓠ Je n'arrive pas à croire qu'ils la traitent si mal.\n@c0@"
  it: "@a@b*: E non l'ha salvata nemmeno il fatto che è sorella di uno dei soldati che ci controllano!\n㈡\nÈ incredibile...\nAncora non mi pare possibile che esistano persone tanto crudeli...\n@c0@"
  ja: "@a@b＊「マリアちゃんの　兄さんは\n\t教団の兵士をしてるっていうのに\n\tまったく　ひどい話よねえ……。\n@c0@"
105:
  de: "@aMaria@bEs, äh... ist mir schon immer ein wenig schwergefallen, an die Philosophie des Ordens zu glauben.\n@c0@"
  en: "@aMaria@bI've, er...always found it a little bit difficult to get along with the Order's philosophies.\n@c0@"
  es: "@aMaría@bYo... Esto... Siempre he tenido problemas con la filosofía de la Orden.\n@c0@"
  fr: "@aMaria@bJ'ai, euh... toujours eu un peu de mal avec\r\nla philosophie de l'Ordre.\n@c0@"
  it: "@aMaria@bNon ho mai condiviso del tutto gli insegnamenti del nostro supremo signore...\n@c0@"
  ja: "@a@bマリア「私……　最初から　教団の\n\t考えに　ついていけないところが\n\tあったんです……。\n@c0@"
106:
  de: "@aMaria@bAlso ist es eigentlich ganz gut, dass ich ihn verärgert habe und versklavt wurde.\n@c0@"
  en: "@aMaria@bSo it's actually quite a good thing that I angered him and was made into a slave.\n@c0@"
  es: "@aMaría@bAsí que es buena cosa el que se enfadaran y me hicieran esclava.\n@c0@"
  fr: "@aMaria@bQuelque part, c'est une bonne chose que je l'aie énervé et qu'il ait fait de moi une esclave.\n@c0@"
  it: "@aMaria@bTutto sommato, non mi dispiace troppo averlo fatto arrabbiare, anche se vivere come una schiava è davvero orribile.\n@c0@"
  ja: "@a@bマリア「だから　教祖さまの怒りをかって\n\tドレイにされて　むしろ\n\tよかったのですわ。\n@c0@"
107:
  de: "@aMaria@bJetzt kann ich verstehen, wie so viele Menschen zur Arbeit für den Orden gezwungen werden konnten.\n@c0@"
  en: "@aMaria@bNow I can see how so many people have been forced into working for the good of the Order.\n@c0@"
  es: "@aMaría@bAhora puedo ver a cuántos se obliga a trabajar en beneficio de la Orden.\n@c0@"
  fr: "@aMaria@bMaintenant, je comprends mieux comment ils ont obligé tant de gens à travailler pour l'Ordre.\n@c0@"
  it: "@aMaria@bIn questo modo, però, ho potuto rendermi conto di quanta gente sia costretta a lavorare in condizioni orribili per la gloria della Setta di Zugzwang.\n@c0@"
  ja: "@a@bマリア「こんなに多くの人々が\n\t教団のために　はたらかされて\n\tいることが　分かりましたし……\n@c0@"
108:
  de: "@aMaria@bIch habe außerdem gehört, dass der Orden vom Zugzwang von einer Art furchteinflößender Macht beherrscht wird.\n@c0@"
  en: "@aMaria@bI've also heard talk that the Order of Zugzwang is being controlled by some kind of terrifying power.\n@c0@"
  es: "@aMaría@bTambién he oído que la Orden de Zugzwang la controla un poder terrorífico.\n@c0@"
  fr: "@aMaria@bJ'ai aussi entendu dire que l'Ordre du Zugzwang était contrôlé par une sorte de pouvoir terrifiant.\n@c0@"
  it: "@aMaria@bHo anche sentito dire che la setta è sotto il controllo di una forza misteriosa e malvagia.\n@c0@"
  ja: "@a@bマリア「光の教団が　おそろしいチカラ\n\tによって　うごかされていると\n\tウワサに聞いたことも　あります。\n@c0@"
109:
  de: "@aMaria@bDie Frage lautet, wer wird aufstehen und sich ihr entgegenstellen?\n@c0@"
  en: "@aMaria@bThe question is, who's going to\r\nstand up and confront it?\n@c0@"
  es: "@aMaría@bLa cuestión es: ¿quién se alzará y se enfrentará a ella?\n@c0@"
  fr: "@aMaria@bJe me demande bien qui pourra s'opposer à luiⓡ\n@c0@"
  it: "@aMaria@bCi vorrebbe qualcuno che l'affrontasse e la distruggesse...\nMa chi potrebbe mai compiere un'impresa del genere?\n@c0@"
  ja: "@a@bマリア「でも　いったい誰が\n\tそんな　おそろしいチカラと\n\tたちむかえるのかしら？\n@c0@"
110:
  de: "@a@b%0%a000090 untersucht das Gefäß.\n@c0@"
  en: "@a@b%0%a000090 examines the pot.\n@c0@"
  es: "@a@b%0%a000090 examina la tinaja.\n@c0@"
  fr: "@a@b%0%a000090 examine le pot.\n@c0@"
  it: "@a@b%0%a000090 esamina il contenitore.\n@c0@"
  ja: "@a@b%a000090は　ツボを　のぞきこんだ！\n@c0@"
111:
  de: "@a@bWurks! Was für ein Gestank! Das benutzen anscheinend die Sklaven als Toilette!\n@c0@"
  en: "@a@bUrgh! What a smell! It looks like it must be what the slaves use as their toilet!\n@c0@"
  es: "@a@b¡Agh! ¡Qué peste! ¡Parece que aquí es donde hacen sus necesidades los esclavos!\n@c0@"
  fr: "@a@bBeurkⓠ Quelle odeurⓠ On dirait que c'est là-dedans que les esclaves font leurs besoinsⓠ\n@c0@"
  it: "@a@bBleargh! Che tanfo insopportabile!\nProbabilmente, gli schiavi usano il contenitore per...\nEhm, per espletare i loro bisogni fisiologici.\n@c0@"
  ja: "@a@bすごい　ニオイがする。\nどうやら　ドレイたちの\nトイレのようだ……。\n@c0@"
112:
  de: "@a@b%0%a000090 untersucht das Gefäß.\n@c0@"
  en: "@a@b%0%a000090 examines the pot.\n@c0@"
  es: "@a@b%0%a000090 examina la tinaja.\n@c0@"
  fr: "@a@b%0%a000090 examine le pot.\n@c0@"
  it: "@a@b%0%a000090 esamina il contenitore.\n@c0@"
  ja: "@a@b%a000090は　ツボを　のぞきこんだ！\n@c0@"
113:
  de: "@a@bDas wird sich kaum reparieren lassen, wenn es zerbricht. Daher sollte man es besser nicht durch die Gegend werfen.\n@c0@"
  en: "@a@bThere'll be no fixing this if it gets smashed.\r\nIt might be better not to throw it.\n@c0@"
  es: "@a@bSi se rompe no tendría arreglo.\r\nQuizá sea mejor no arrojarla.\n@c0@"
  fr: "@a@bPersonne ne réparerait ce pot s'il venait à être brisé. Il est préférable de ne pas le lancer.\n@c0@"
  it: "@a@bSe si rompe, non sarà possibile ripararlo. Meglio non scaraventarlo al suolo...\n@c0@"
  ja: "@a@bこんなツボを　投げて割ったら\n取り返しのつかないことに　なるだろう。\nやめておいたほうが　よさそうだ。\n@c0@"
114:
  de: "@a@b*: An die Arbeit! Oder willst du wieder meine Peitsche zu spüren bekommen?\n@c0@"
  en: "@a@b*: Get to work! Or do you want to feel \r\nmy whip again?\n@c0@"
  es: "@a@b*: ¡A trabajar! ¿O queréis probar mi látigo otra vez?\n@c0@"
  fr: "@a@b*ⓢ Remettez-vous au travail si vous ne voulez pas encore goûter à mon fouetⓠ\n@c0@"
  it: "@a@b*: Al lavoro! Al lavoro!\nO preferite che la mia frusta vi morda la schiena?!\n@c0@"
  ja: "@a@b＊「おらおら！　仕事の時間だぞ！\n\tさっさと　いかないと\n\tこのムチが　とぶぞ！\n@c0@"
115:
  de: "@a@b*: Nicht du schon wieder! Du hast vielleicht Nerven, hier dauernd Ärger zu machen.\n@c0@"
  en: "@a@b*: Not you again! You've certainly got some nerve, causing trouble all the time.\n@c0@"
  es: "@a@b*: ¡Otra vez tú! Hay que tener agallas para estar todo el día armando bulla.\n@c0@"
  fr: "@a@b*ⓢ Encore toiⓠ Tu n'as pas froid aux yeux.\nToujours à créer des problèmes...\n@c0@"
  it: "@a@b*: Ancora tu?!\nSei un vero piantagrane, lo sai?\n@c0@"
  ja: "@a@b＊「はーん？　また　お前か……。\n\tなにかにつけて\n\t反抗的なヤツだな！\n@c0@"
116:
  de: "@a@b*: Geh mir aus den Augen!\n@c0@"
  en: "@a@b*: Get out of my sight!\n@c0@"
  es: "@a@b*: ¡Largo de mi vista!\n@c0@"
  fr: "@a@b*ⓢ Hors de ma vueⓠ\n@c0@"
  it: "@a@b*: Sparisci!\n@c0@"
  ja: "@a@b＊「さっさと　出てゆかんかっ！\n@c0@"
117:
  de: "@a@b*: Das hier ist nicht dein Abschnitt! Geh sofort an deinen Platz zurück!\n@c0@"
  en: "@a@b*: This isn't your work area! Get to your correct position at once!\n@c0@"
  es: "@a@b*: ¡Esta no es tu zona! ¡Regresa a tu puesto ahora mismo!\n@c0@"
  fr: "@a@b*ⓢ Ce n'est pas ton secteurⓠ Retourne à ton poste de travail tout de suiteⓠ\n@c0@"
  it: "@a@b*: Questa non è l'area che ti è stata assegnata!\nFila subito alla tua posizione!\n@c0@"
  ja: "@a@b＊「ん？　お前の仕事場は\n\tここじゃないだろう！　さっさと\n\t自分の持ち場に　いかんかっ！\n@c0@"
118:
  de: "@a@b*: Der große Herrscher sagt, die Zeit der Dunkelheit würde bald über uns kommen.\n@c0@"
  en: "@a@b*: The great ruler says that the era of darkness will soon be upon us.\n@c0@"
  es: "@a@b*: El gran líder dice que se acerca una era de tinieblas.\n@c0@"
  fr: "@a@b*ⓢ D'après notre maître vénéré, nous allons bientôt entrer dans un âge de ténèbres.\n@c0@"
  it: "@a@b*: Il nostro supremo signore ha detto che presto l'oscurità scenderà su di noi.\n@c0@"
  ja: "@a@b＊「教祖さまの　お話では\n\tやがて　闇の時代が　来るらしい。\n@c0@"
119:
  de: "@a@b*: Und dann wird der Orden vom Zugzwang uns alle retten.\n@c0@"
  en: "@a@b*: When the time comes, the Order of Zugzwang will save us all.\n@c0@"
  es: "@a@b*: Cuando llegue el momento, la Orden de Zugzwang nos salvará.\n@c0@"
  fr: "@a@b*ⓢ Seul l'Ordre du Zugzwang pourra tous nous sauver.\n@c0@"
  it: "@a@b*: Quando quel momento giungerà, la Setta di Zugzwang ci salverà tutti.\n@c0@"
  ja: "@a@b＊「そこで　教祖さまは\n\t光の国をつくり　人々を\n\t闇から守る　おつもりなのだ。\n@c0@"
120:
  de: "@a@b*: Wir sollten für immer und ewig dankbar für diesen Segen sein.\n@c0@"
  en: "@a@b*: We should all be eternally grateful\r\nfor this blessing.\n@c0@"
  es: "@a@b*: Deberíamos de estar eternamente agradecidos por ello.\n@c0@"
  fr: "@a@b*ⓢ Nous devrions tous être éternellement reconnaissants de cette bénédiction.\n@c0@"
  it: "@a@b*: Dobbiamo essere grati al nostro supremo signore per la magnanimità che ci dimostra!\n@c0@"
  ja: "@a@b＊「なんという　ありがたい\n\tお考えであろうか……。\n@c0@"
121:
  de: "@a@b*: Suchst du jemanden? Wenn du Harry suchst, der ist direkt da unten. Sie haben ihn heute verlegt.\n@c0@"
  en: "@a@b*: You looking for someone? If it's Harry you're after, he's right down below. They moved him down there today.\n@c0@"
  es: "@a@b*: ¿Buscas a alguien? Si es a Froilán, está ahí abajo. Hoy lo han trasladado a allí.\n@c0@"
  fr: "@a@b*ⓢ Tu cherches quelqu'unⓡ Si c'est Harry, il est juste en dessous. Ils l'ont réaffecté aujourd'hui.\n@c0@"
  it: "@a@b*: Stai cercando qualcuno?\nSe sei qui per Robert, è di sotto.\nLo hanno trasferito lì proprio oggi.\n@c0@"
  ja: "@a@b＊「誰かを　さがしているのか？\n\tドレイの　ヘンリーなら\n\t今日は　地下にまわされたぞ。\n@c0@"
122:
  de: "@a@b*: Ob ihr wirklich freigelassen werdet, wenn der Tempel fertig ist? Ja, natürlich!\n@c0@"
  en: "@a@b*: Will you really be freed when the temple is completed? Yes, of course you will!\n@c0@"
  es: "@a@b*: ¿Que si seréis de verdad libres cuando se termine el templo? ¡Pues claro que sí!\n@c0@"
  fr: "@a@b*ⓢ Si on vous libérera tous une fois le temple terminéⓡ Mais bien sûrⓠ\n@c0@"
  it: "@a@b*: Se sarete davvero liberati quando la costruzione del tempio sarà ultimata?\nMa certo che sì!\n@c0@"
  ja: "@a@b＊「神殿が　完成すれば\n\t自由になれるという話か？\n\tああ　もちろん本当だとも！\n@c0@"
123:
  de: "@a@b*: Also denk immer schön daran und leg dich ordentlich ins Zeug, kapiert?\n@c0@"
  en: "@a@b*: So just focus on that and put your back into your work, do you hear?\n@c0@"
  es: "@a@b*: Así que concéntrate y vuelve al trabajo, ¿entendido?\n@c0@"
  fr: "@a@b*ⓢ Gardez bien ça en tête et remettez-vous au travail, c'est comprisⓡ\n@c0@"
  it: "@a@b*: Quindi, più lavorate, prima sarete liberi!\nAvanti! Dateci dentro!\n@c0@"
  ja: "@a@b＊「だから　何も考えず\n\t精いっぱい　はたらくのだぞ！\n@c0@"
124:
  de: "@a@b*: Ich glaube nicht, dass dieser Tempel noch zu meinen Lebzeiten fertig wird.\n@c0@"
  en: "@a@b*: I doubt I'll still be alive by the\r\ntime this temple's finished.\n@c0@"
  es: "@a@b*: Dudo que siga vivo para cuando se acabe el templo.\n@c0@"
  fr: "@a@b*ⓢ Je ne pense pas vivre assez longtemps pour voir ce temple terminé.\n@c0@"
  it: "@a@b*: Non credo che vivrò tanto a lungo da vedere il tempio completato...\n@c0@"
  ja: "@a@b＊「この神殿が　完成するまで\n\tとても　生きておれそうにないのう。\n@c0@"
125:
  de: "@a@b*: Aber wenigstens können sie mich nicht mehr auspeitschen, wenn ich tot bin. Mein Körper und mein Geist werden endlich frei sein.\n@c0@"
  en: "@a@b*: But at least they won't be able to whip me when I'm dead. My body and spirit will be free at last.\n@c0@"
  es: "@a@b*: Pero, al menos, no podrán azotarme una vez muerto. Mi cuerpo y mi espíritu serán libres al fin.\n@c0@"
  fr: "@a@b*ⓢ Au moins, une fois mort, ils ne pourront plus me fouetter. Mon esprit et mon corps seront enfin libres.\n@c0@"
  it: "@a@b*: Ma mi consola pensare che non potranno più torturarmi con le loro fruste, quando sarò morto.\nAllora sarò finalmente libero...\n@c0@"
  ja: "@a@b＊「しかし　死んでしまえば　もう\n\tムチで　打たれることもない。\n\tやっと　自由な身じゃよ……。\n@c0@"
126:
  de: "@a@bWie schrecklich! Eines der Sklavenmädchen wird ausgepeitscht!\n@c0@"
  en: "@a@bWhat a shock! One of the slave girls is being whipped!\n@c0@"
  es: "@a@b¡Es increíble! ¡Están azotando a una esclava!\n@c0@"
  fr: "@a@bQuel chocⓠ L'une des esclaves se fait fouetterⓠ\n@c0@"
  it: "@a@bChe cosa orribile!\nStanno frustando una delle schiave!\n@c0@"
  ja: "@a@bなんと！　ドレイの女が\nムチで　打たれている！\n@c0@"
127:
  de: "@a@b*: Du blöde Gans! Wie kannst du es wagen, meine Schuhe zu beschmutzen?! Dir muss man wohl ein bisschen Verstand einprügeln!\n@c0@"
  en: "@a@b*: You stupid girl! How dare you make my shoes dirty!? You need some sense beating into you!\n@c0@"
  es: "@a@b*: ¡Estúpida! ¿Cómo te atreves a mancharme los zapatos? ¡Vas a aprender a palos!\n@c0@"
  fr: "@a@b*ⓢ Petite idioteⓠ Comment oses-tu salir mes chaussuresⓡ Je vais t'apprendre à ne pas recommencer.\n@c0@"
  it: "@a@b*: Maledetta stupida!\nCome hai osato sporcarmi gli stivali?! Ti darò una lezione che non dimenticherai finché campi!\n@c0@"
  ja: "@a@b＊「オレさまのクツを\n\t土で汚すとは　ふてえ女だ！\n\tその根性を　たたき直してやる！\n@c0@"
128:
