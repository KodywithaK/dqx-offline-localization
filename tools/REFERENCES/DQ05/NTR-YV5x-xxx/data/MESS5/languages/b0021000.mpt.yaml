  ja: "@a@b＊「……し　しまった！\n\t見つかったか！！\n@c0@"
221:
  de: "@a@b*: Angeblich es gibt tief im Westen eine von hohen Bergen geschützte Höhle, in der ein unglaublicher Schatz ist verborgen.\n@c0@"
