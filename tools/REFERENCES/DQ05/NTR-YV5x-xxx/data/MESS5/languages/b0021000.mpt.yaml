  fr: "@a@b*ⓢ Vous avez sans doute entendu parler de moi. C'est moi qui ai aidé le prince Harry à chasser la fausse douairière.\n@c0@"
  it: "@a@b*: Salve, %H0860%X%A0110%Xamico! Sai%Z%B0110%Xamica! Sai%Z%Y%R0000%Xamiche! Sapete%Yamici! Sapete%Z%Z di avere di fronte un eroe?\n㈡\n*: Io sono colui che aiutò il principe Robert a smascherare la falsa Regina Madre!\nProprio così! Sono io in persona!\n@c0@"
