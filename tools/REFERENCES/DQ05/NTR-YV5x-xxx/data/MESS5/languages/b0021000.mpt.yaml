  ja: "@a@b＊「はるか昔……　勇気ある王が\n\t戦いのとき　身につけたマントが\n\t今も　どこかに残されているらしい。\n@c0@"
239:
  de: "@aDarwin@bIch bin mir sicher, dass der Umhang bei Euch in guten Händen wäre, wenn Ihr ihn nur findet.\n@c0@"
