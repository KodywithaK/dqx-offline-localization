  en: "@a@b*: Naturally, my wife is beautiful and young-looking too, of course! Ha ha!\n@c0@"
  es: "@a@b*: ¡Claro que mi mujer también es jovencísima, o eso parece! ¡Ja, ja!\n@c0@"
  fr: "@a@b*ⓢ Évidemment, ma femme aussi est jeune et belleⓠ\nHa haⓠ\n@c0@"
  it: "@a@b*: Ma perché mi stupisco tanto?\nAnche io e mia moglie abbiamo figli, e non sembriamo certo dei matusa, no?! Ah ah ah!\n@c0@"
  ja: "@a@b＊「しかし　わたしの妻も\n\t若くて　美人でしょう！\n\tわっはっはっ。\n@c0@"
142:
  de: "@a@b*: Ich hab gehört, dass es auf diesem Turm einen unglaublichen Schatz geben soll.\n@c0@"
  en: "@a@b*: I 'eard there was some kind of amazin' treasure up this tower.\n@c0@"
  es: "@a@b*: He oído que en lo alto de esta torre había un tesoro alucinante.\n@c0@"
  fr: "@a@b*ⓢ Il paraît qu'il y a un énorme trésor en haut de cette tour.\n@c0@"
  it: "@a@b*: Anvedi che sfortuna, ahò!\nM'aveveno detto che 'ncima a 'sta torre ce sta 'ntesoro fantameravijioso!\n@c0@"
  ja: "@a@b＊「この塔には\n\tすごい宝が　眠っていると\n\t聞いて来たんだけどよ。\n@c0@"
143:
  de: "@a@b*: Aber leider schaff ich's nicht höher rauf.\nIch sitz hier fest.\n@c0@"
  en: "@a@b*: But I can't get any 'igher than this.\r\nI'm stuck.\n@c0@"
  es: "@a@b*: Pero no soy capaz de subir más.\r\nNo encuentro el modo.\n@c0@"
  fr: "@a@b*ⓢ Mais impossible de monter plus haut.\nJ'suis coincé.\n@c0@"
  it: "@a@b*: Però nun me riesco a sali' più in arto de così...\nMa guarda te che razza de jella!\n@c0@"
  ja: "@a@b＊「これ以上は　進めそうに\n\tねえな……。\n@c0@"
144:
  de: "@a@b*: Bei der Göttin! Nie hätte ich mir träumen lassen, dass %H0860%Xein irdisches Wesen die Zenithiatreppe erklimmen würde%Yirdische Wesen die Zenithiatreppe erklimmen würden%Z!\n@c0@"
  en: "@a@b*: By the Goddess! Never did I foresee that %H0860%Xan earthly being%Yearthly people%Z would scale the Stairway to Zenithia!\n@c0@"
  es: "@a@b*: ¡Por la Diosa! ¡Jamás preví que %H0860%Xun ser terrenal pudiera%Yseres terrenales pudieran%Z ascender la Escalera a Zenithia!\n@c0@"
  fr: "@a@b*ⓢ Par la Déesseⓠ Je n'aurais jamais cru %H0860%Xqu'un être humain réussirait à gravir%Yque des êtres humains réussiraient à gravir%Z les Marches de Zénithiaⓠ\n@c0@"
  it: "@a@b*: Oh, santa dea!\nNon avrei mai immaginato che %H0860%Xun essere umano sarebbe riuscito%Ydegli esseri umani sarebbero riusciti%Z a salire la Scalinata di Zenithia!\n@c0@"
  ja: "@a@b＊「なんと　この　あれた塔を\n\tここまで　のぼってくる者が\n\tおったとは！\n@c0@"
145:
  de: "@a@b*: Vor vielen, vielen Monden führte diese erhabene Stiege in das luftige Reich von Zenithia, doch heute sind nur noch Trümmer übrig...\n@c0@"
  en: "@a@b*: Many moons ago, this great stairway did lead\r\nto the lofty heights of Zenithia, yet today, it lies\r\nin ruin...\n@c0@"
  es: "@a@b*: Hace muchas lunas, esta gran escalera llevaba a las cumbres de Zenithia, pero hoy yace en ruinas...\n@c0@"
  fr: "@a@b*ⓢ Il y a de nombreuses lunes, ce gigantesque escalier menait vers les hauteurs de Zénithia.\nMais aujourd'hui, il n'est plus que ruines...\n@c0@"
  it: "@a@b*: Molti anni fa, questa maestosa scalinata conduceva alla sommità di Zenithia.\nOggi, però, di essa non restano che misere rovine...\n@c0@"
  ja: "@a@b＊「かつては　この塔から\n\t天空の城に　行けたものだが\n\t今は　この　ありさま……。\n@c0@"
146:
  de: "@a@b*: Das mächtige Schloss stürzte hinab in die Tiefe. Bis auf den Grund eines Sees, welche Schmach!\n@c0@"
  en: "@a@b*: The mighty castle is toppled from its exalted perch. At the bottom of a lake, for shame!\n@c0@"
  es: "@a@b*: El poderoso castillo ha caído de su exaltada altura. ¡Al fondo de un lago, qué escarnio!\n@c0@"
  fr: "@a@b*ⓢ Le puissant château des cimes est tombé dans les profonds abîmes d'un lac, hélasⓠ\n@c0@"
  it: "@a@b*: Il possente maniero che sovrastava il mondo dal cielo giace in fondo a un lago. Che fine meschina, per il grande Castello di Zenithia!\n@c0@"
  ja: "@a@b＊「天空の城も　今では\n\t湖の底じゃ！\n@c0@"
147:
  de: "@a@b*: Wenn Ihr Eure Reise fortsetzt, nehmt doch den Magmastab, den Ihr dort seht. Er könnte Euch von Nutzen sein.\n@c0@"
