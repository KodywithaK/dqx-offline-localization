  fr: "@a@b*ⓢ Il semblerait que les gens deviennent de plus en plus malhonnêtes, de nos jours. C'est bien triste.\n@c0@"
  it: "@a@b*: In giro c'è un mucchio di gentaglia.\nNon si trova una persona onesta nemmeno a cercarla col lanternino!\n@c0@"
  ja: "@a@b＊「最近は　正直な旅人がへって\n\tなげかわしいのう。\n@c0@"
133:
  de: "@a@b*: Es heißt, dass die Hohepriesterin des Ordens vom Zugzwang nicht nur eine Schönheit ist. Sie soll auch die Sorte Frau sein, der alle folgen wollen.\n@c0@"
  en: "@a@b*: Folk reckon that the high priestess of that Zugzwang Order isn't just a beauty, she's also the kind of lady everyone wants to follow.\n@c0@"
  es: "@a@b*: La gente dice que la sacerdotisa principal de esa Orden de Zugzwang no solo es una belleza, sino que tiene carisma.\n@c0@"
  fr: "@a@b*ⓢ Les gens racontent que la grande prêtresse de l'Ordre du Zugzwang n'est pas seulement une vraie beauté...\n㈡\n... mais que c'est aussi le genre de femme que tout le monde est prêt à suivre.\n@c0@"
  it: "@a@b*: Chi ha visto la Gran Sacerdotessa della Setta di Zugzwang dice che è una donna bellissima e dotata di grande carisma.\n㈡\n*: È impossibile non restarne affascinati.\n@c0@"
  ja: "@a@b＊「うわさでは　光の教団の　大神官は\n\t美しいだけでなく　だれもが\n\tしたがいたくなる　女性だとか。\n@c0@"
