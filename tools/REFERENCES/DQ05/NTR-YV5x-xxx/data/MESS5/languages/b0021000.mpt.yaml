  es: "@a@b*: Debo decir que esa pareja con la que viajáis parece demasiado joven para tener hijos ya.\n@c0@"
  fr: "@a@b*ⓢ Le couple avec lequel vous voyagez me semble bien jeune pour avoir des enfants.\n@c0@"
