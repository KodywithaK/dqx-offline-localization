0:
  de: "@a@b*: Bevor dies jedoch geschieht, muss Magdalena gerettet werden, damit sie die Tore wieder verschließen kann.\n@c0@"
  en: "@a@b*: We must rescue Madalena before that happens,\r\nso that she may once again seal the gates.\n@c0@"
  es: "@a@b*: Debemos rescatar a Perséfone antes de que esto ocurra para que selle las puertas.\n@c0@"
  fr: "@a@b*ⓢ Nous devons sauver Magdalena avant que cela ne se produise, afin qu'elle puisse une fois encore sceller les portes.\n@c0@"
  it: "@a@b*: Dobbiamo ritrovare Maddalena prima che ciò accada. Solo lei ha il potere di chiudere nuovamente il varco.\n@c0@"
  ja: "@a@b＊「そうなる前に　マーサさまを\n\t助け出し　開かれた門を\n\t再び　封印するのです。\n@c0@"
1:
  de: "@a@b*: Ihr seid derjenige, der sie retten kann, %a000090. Als ihrem Sohn obliegt Euch diese Aufgabe.\n@c0@"
  en: "@a@b*: You are the one who must rescue her, %a000090. You, her son, have the power.\n@c0@"
  es: "@a@b*: Y eres tú quien debe hacerlo, %a000090. Tú, su hijo, tienes el poder.\n@c0@"
  fr: "@a@b*ⓢ C'est vous, %a000090, qui devez la sauver. Vous êtes son fils, vous en avez le pouvoir.\n@c0@"
  it: "@a@b*: Tu puoi farcela, %a000090.\nTu, che sei suo figlio, puoi riuscirci.\n@c0@"
  ja: "@a@b＊「大いなるマーサの子　%a000090\n\tあなたには　そのチカラが\n\tあるはずです。\n@c0@"
2:
  de: "@a@b*: Dies war Magdalenas Zimmer.\n@c0@"
  en: "@a@b*: This room was Madalena's.\n@c0@"
  es: "@a@b*: Este era el cuarto de Perséfone.\n@c0@"
  fr: "@a@b*ⓢ Cette chambre était celle de Magdalena.\n@c0@"
  it: "@a@b*: Questa era la stanza di Maddalena.\n@c0@"
  ja: "@a@b＊「ここは　マーサさまの　お部屋。\n@c0@"
3:
  de: "@a@b*: Ich weiß noch genau, was sie immer gesagt hat...\n@c0@"
  en: "@a@b*: Something she used to say has remained firmly in my memory...\n@c0@"
  es: "@a@b*: Recuerdo vivamente algo que solía decir...\n@c0@"
  fr: "@a@b*ⓢ Elle disait une chose qui est restée gravée dans ma mémoire...\n@c0@"
  it: "@a@b*: Ricordo ancora una cosa che diceva spesso...\nÈ una frase che è come scolpita nella mia memoria...\n@c0@"
  ja: "@a@b＊「マーサさまは　いつも\n\tおっしゃっていました。\n@c0@"
4:
  de: "@a@b*: Sie sagte, dass die Dunkelheit einen nie verschlingen könne, wenn man Licht im Herzen trage.\n@c0@"
  en: "@a@b*: She used to say that if light was in your heart, you could never be consumed by darkness.\n@c0@"
  es: "@a@b*: Repetía que mientras hubiera luz en nuestro corazón, nunca nos consumiría la oscuridad.\n@c0@"
  fr: "@a@b*ⓢ Elle répétait sans cesse que si la lumière brillait dans nos cœurs, jamais nous ne pourrions être consumés par les ténèbres.\n@c0@"
  it: "@a@b*: ⓕColui che ha la luce nel cuore non verrà mai vinto dall'oscuritàⓖ.\n@c0@"
  ja: "@a@b＊「心に　光をともしていれば\n\t決して　闇にのまれることはないと。\n@c0@"
5:
  de: "@a@b*: Hier. Ich weiß nicht, ob Ihr es gebrauchen könnt, aber sie hätte sicher gewollt, dass Ihr dieses Buch bekommt.\n@c0@"
  en: "@a@b*: Here. I do not know if this will be of any use to you, but I am sure she would have liked you to have this book.\n@c0@"
  es: "@a@b*: %H0860%XToma%YTomad%Z. No sé si %H0860%Xte%Yos%Z valdrá de algo, pero seguro que ella hubiera querido que %H0860%Xtuvieras%Ytuvierais%Z este libro.\n@c0@"
  fr: "@a@b*ⓢ Tenez. Je ne sais pas si cela vous sera utile, mais je suis certaine qu'elle aurait aimé que vous ayez ce livre.\n@c0@"
  it: "@a@b*: Ecco, %H0860%Xtieni. Non so se potrà esserti utile, ma voglio che tu prenda%Ytenete. Non so se potrà esservi utile, ma voglio che prendiate%Z questo libro.\n@c0@"
  ja: "@a@b＊「あなたがたの　お役に立つか\n\tわかりませんが　この本を\n\tお持ちください。\n@c0@"
6:
  de: "@a@b%0%a000120 erhält ein reich verziertes Buch.\n@c0@"
  en: "@a@b%0%a000120 receives an intricately embroidered book.\n@c0@"
  es: "@a@b%0%a000120 recibe un libro de intrincada decoración.\n@c0@"
  fr: "@a@b%0%a000120 reçoit un livre à la reliure riche et complexe.\n@c0@"
  it: "@a@b%0%a000120 ha ricevuto un volume dalla copertina riccamente decorata.\n@c0@"
  ja: "@a@b%a000120は　美しいししゅうが\nほどこされた　本を　受けとった。\n@c0@"
7:
  de: "@a@b%0%a000180 steckt die ⓞHimmlischen Hymnenⓟ ein.\n@c0@"
  en: "@a@b%0%a000180 acquires ⓗLofty Liltsⓘ.\n@c0@"
  es: "@a@b%0%a000180 obtiene ⓕSalmos Excelsosⓖ.\n@c0@"
  fr: "@a@b%0%a000180 récupère les ⓥPsaumes alticimiensⓦ.\n@c0@"
  it: "@a@b%0%a000180 prende i ⓕSalmi del Sollievoⓖ.\n@c0@"
  ja: "@a@b%a000180は　天の詩篇集を\n手に入れた！\n@c0@"
8:
  de: "@a@b*: Es ist ein Psalmenbuch und sehr beliebt bei den Bewohnern von Steile Höh. Viel Glück. Die Göttin sei mit Euch.\n@c0@"
  en: "@a@b*: It is a book of psalms. We of Lofty Peak read from it from an early age. Good luck. May the Goddess protect you.\n@c0@"
  es: "@a@b*: Es un libro de salmos. En Cumbre Excelsa lo leemos desde muy jóvenes. Buena suerte. Que la Diosa %H0860%Xte%Yos%Z proteja.\n@c0@"
  fr: "@a@b*ⓢ C'est un livre de psaumes. Nous autres, Alticimiens, le lisons dès le plus jeune âge.\nBonne chance. Que la Déesse vous protège.\n@c0@"
  it: "@a@b*: È un libro sacro. Contiene salmi e preghiere che la gente di Picco Maximo recita fin dalla notte dei tempi.\nBuona fortuna, e che la dea %H0860%Xti%Yvi%Z accompagni.\n@c0@"
  ja: "@a@b＊「エルヘブンの民が　子供の頃から\n\t読んでいる　神の言葉の書ですわ。\n\tどうか　ご加護がありますよう……。\n@c0@"
9:
  de: "@a@b*: Meine Türen stehen Euch offen, %H0860%X%A0110%XReisender%Z%B0110%XReisende%Z%YReisende%Z.\n@c0@"
  en: "@a@b*: My doors are open to you, weary %H0860%Xtraveller%Ytravellers%Z.\n@c0@"
  es: "@a@b*: Mis puertas están abiertas, %H0860%X%A0110%Xextenuado viajero%Z%B0110%Xextenuada viajera%Z%Y%R0000%Xextenuadas viajeras%Yextenuados viajeros%Z%Z.\n@c0@"
  fr: "@a@b*ⓢ Mes portes vous sont ouvertes, %H0860%X%A0110%Xvoyageur fatigué%Z%B0110%Xvoyageuse fatiguée%Z%Y%R0000%Xvoyageuses fatiguées%Yvoyageurs fatigués%Z%Z.\n@c0@"
  it: "@a@b*: Le porte sono aperte per %H0860%X%A0110%Xte, stanco viandante%Z%B0110%Xte, stanca viandante%Z%Y%R0000%Xvoi, stanche viandanti%Yvoi, stanchi viandanti%Z%Z.\n@c0@"
  ja: "@a@b＊「よくぞ　まいられた\n\t旅のおかた。\n@c0@"
10:
  de: "@a@b*: Wollt Ihr nicht hier übernachten und Euch ein wenig ausruhen?\n@c0@"
  en: "@a@b*: Won't you rest here for the night, and recover from your weariness?\n@c0@"
  es: "@a@b*: ¿Por qué no descans%H0860%Xas%Yáis%Z aquí esta noche para recobrar fuerzas?\n@c0@"
  fr: "@a@b*ⓢ Et si vous restiez ici pour la nuit, afin de récupérer un peuⓡ\n@c0@"
  it: "@a@b*: %H0860%XDesideri trascorrere qui la notte per riposare un po' le tue%YDesiderate trascorrere qui la notte per riposare un po' le vostre%Z stanche membra?\n@c0@"
  ja: "@a@b＊「今夜は　宿屋に泊まるなどして\n\tぞんぶんに　つかれを\n\tいやすが　よろしかろう。\n@c0@"
11:
  de: "@a@b*: Willkommen in Steile Höh.\n@c0@"
  en: "@a@b*: Welcome to Lofty Peak.\n@c0@"
  es: "@a@b*: Bienvenid%H0860%X%A0110%Xo%Z%B0110%Xa%Z%Y%R0000%Xas%Yos%Z%Z a Cumbre Excelsa.\n@c0@"
  fr: "@a@b*ⓢ Bienvenue à Haute-Cime.\n@c0@"
  it: "@a@b*: %H0860%X%A0110%XBenvenuto%Z%B0110%XBenvenuta%Z%Y%R0000%XBenvenute%YBenvenuti%Z%Z a Picco Maximo.\n@c0@"
  ja: "@a@b＊「ここは エルヘブン。\n@c0@"
12:
  de: "@a@b*: Dies ist die Heimat der Vergessenen. All jener, die keinen Platz mehr in der Welt haben.\n@c0@"
  en: "@a@b*: This is the home of the forgotten ones.\nThose who the world no longer knows.\n@c0@"
  es: "@a@b*: Este es el reino de los olvidados, aquellos a los que el mundo ya no conoce.\n@c0@"
  fr: "@a@b*ⓢ Vous êtes ici chez les oubliés.\nCeux dont le monde ne connaît plus l'existence.\n@c0@"
  it: "@a@b*: Questa è la casa di chi ha fatto perdere memoria di sé. Qui dimorano coloro che sono stati dimenticati dal mondo.\n@c0@"
  ja: "@a@b＊「忘れられた民族の\n\t住む村で　ございます。\n@c0@"
13:
  de: "@a@b*: Ihr seid gekommen, um mit den Weisen zu reden? Aber es ist schon sehr spät.\n@c0@"
  en: "@a@b*: You have come to speak with the Elders?\nBut the hour is already late.\n@c0@"
  es: "@a@b*: ¿%H0860%XVienes%YVenís%Z a hablar con los Ancianos?\nYa es muy tarde.\n@c0@"
  fr: "@a@b*ⓢ Vous êtes là pour parler aux Anciensⓡ\nMais il est déjà tard.\n@c0@"
  it: "@a@b*: %H0860%XSei%YSiete%Z qui per parlare con i Quattro Anziani?\nTemo che non sia possibile a quest'ora...\n@c0@"
  ja: "@a@b＊「長老に　会いに　来たのか？\n\tしかし　すでに　夜もふけた。\n@c0@"
14:
  de: "@a@b*: Warum übernachtet Ihr nicht in der Herberge und kommt morgen früh wieder?\n@c0@"
  en: "@a@b*: Would you not rest at the inn and return to speak with them in the morning?\n@c0@"
  es: "@a@b*: ¿Por qué no descans%H0860%Xas%Yáis%Z en la posada y %H0860%Xvuelves%Yvolvéis%Z por la mañana a hablar con ellos?\n@c0@"
  fr: "@a@b*ⓢ Pourquoi ne pas aller vous reposer à l'auberge et revenir leur parler demain matinⓡ\n@c0@"
  it: "@a@b*: %H0860%XTi%YVi%Z consiglio di riposare alla locanda, e di %H0860%Xripresentarti%Yripresentarvi%Z qui domattina.\n@c0@"
  ja: "@a@b＊「今夜は　宿屋に泊まるなどして\n\t明日　あらためて　長老を\n\tたずねるが　よろしかろう。\n@c0@"
15:
  de: "@a@b*: Die Nacht macht mir immer Angst.\n@c0@"
  en: "@a@b*: Night-time scares me now.\n@c0@"
  es: "@a@b*: Ahora la noche me da miedo.\n@c0@"
  fr: "@a@b*ⓢ La nuit m'effraie, maintenant.\n@c0@"
  it: "@a@b*: Di notte ho paura...\nIl buio mi fa venire in mente l'oscurità che ci minaccia...\n@c0@"
  ja: "@a@b＊「おそろしい……。\n\t夜が　おそろしい……。\n@c0@"
16:
  de: "@a@b*: Wenn die Tore nach Nadiria erst einmal weit geöffnet sind...\n@c0@"
  en: "@a@b*: If the gates of Nadiria are opened fully...\n@c0@"
  es: "@a@b*: Si las puertas de Nadiria se abrieran del todo...\n@c0@"
  fr: "@a@b*ⓢ Si les portes de Nadiria s'ouvrent complètement...\n@c0@"
  it: "@a@b*: Se il varco per Nadiria si aprisse del tutto, il mondo sarebbe avvolto dalle tenebre perenni!\n@c0@"
  ja: "@a@b＊「もし　暗黒世界の門が\n\t限りなく開かれれば……\n@c0@"
17:
  de: "@a@b*: ... wird es in unserer Welt ständig Nacht sein.\n@c0@"
  en: "@a@b*: ...the world will darken in perpetual night!\n@c0@"
  es: "@a@b*: ... ¡el mundo se sumiría en la noche perpetua!\n@c0@"
  fr: "@a@b*ⓢ ... le monde s'enfoncera dans une nuit perpétuelleⓠ\n@c0@"
  it: "@a@b*: Oh, no!\nSarebbe una cosa orribile!\nNon voglio nemmeno pensarci...\n@c0@"
  ja: "@a@b＊「世界は　おそろしい夜の国に\n\tなってしまうでしょう。\n@c0@"
18:
  de: "@a@bEs ist von innen verschlossen. Vielleicht wegen der späten Stunde.\n@c0@"
  en: "@a@bIt's locked from the inside.\nMaybe it's because of the late hour.\n@c0@"
  es: "@a@b¡Está cerrado por dentro!\r\nQuizá sea porque es muy tarde.\n@c0@"
  fr: "@a@bC'est fermé de l'intérieur.\nIl est sûrement trop tard.\n@c0@"
  it: "@a@bA quest'ora è chiuso...\n@c0@"
  ja: "@a@b夜も　おそいせいか\n内側から　カギが　かかっている。\n@c0@"
19:
  de: "@a@b%0%a000120 nimmt %M0100%Xsie%Y%A0100%Xihn%Z%B0100%Xsie%Z%C0100%Xes%Z%Z und steckt %M0100%Xsie%Y%A0100%Xihn%Z%B0100%Xsie%Z%C0100%Xes%Z%Z in den Beutel.\n@c0@"
  en: "@a@b%0%a000120 places %a020100 in the bag.\n@c0@"
  es: "@a@b%0%a000120 pone %a020100 en la bolsa.\n@c0@"
  fr: "@a@b%0%a000120 met %a020100 dans le sac.\n@c0@"
  it: "@a@b%0%a000120 mette %a020100 nella borsa.\n@c0@"
  ja: "@a@b%a000120は　%a000100を\n%a001400に　入れた！\n@c0@"
20:
  de: "@a@b*: In der ganzen Welt findet man Exemplare des heiligen Manuskripts, das unser Priester hier niederschrieb.\n@c0@"
  en: "@a@b*: There are many copies of the holy manuscript our priest here wrote to be found in churches all over the world.\n@c0@"
  es: "@a@b*: En iglesias de todo el mundo hay reproducciones del sagrado manuscrito que escribieron nuestros sacerdotes.\n@c0@"
  fr: "@a@b*ⓢ On trouve de nombreuses copies du manuscrit sacré écrit par notre prêtre dans toutes les églises du monde.\n@c0@"
  it: "@a@b*: In molte chiese del mondo ci sono varie copie del sacro testo scritto dal nostro amato sacerdote.\n@c0@"
  ja: "@a@b＊「ここの教会の　神父さまが　書く\n\t神さまの言葉の書は　いろんな\n\t教会に　くばられているんだよ。\n@c0@"
21:
  de: "@a@b*: Er gebrauchte eine spezielle Tinte, damit die Schrift auch nach tausenden von Jahren nicht verblasst.\n@c0@"
  en: "@a@b*: They're written in a special kind of ink, you see, so the writing in them doesn't fade, no matter how much time passes.\n@c0@"
  es: "@a@b*: Las escribimos con una tinta especial que evita que lo escrito desaparezca, por mucho tiempo que pase.\n@c0@"
  fr: "@a@b*ⓢ Ces copies sont réalisées avec une encre spéciale, voyez-vous. Ainsi, l'écriture ne pâlit jamais, peu importe le temps qui passe.\n@c0@"
  it: "@a@b*: Il libro è stato scritto con uno speciale inchiostro indelebile che resiste allo scorrere del tempo.\n@c0@"
  ja: "@a@b＊「なにしろ　特別なインクで\n\t書かれているから　どんなに　時が\n\tたっても　消えることがないのさ。\n@c0@"
22:
  de: "@a@b*: Ich lebe schon seit ewigen Zeiten hier und versuche, mehr von der Tinte herzustellen, für die diese Kirche so berühmt ist.\n@c0@"
  en: "@a@b*: I've been here for more years than I can remember now, trying to create more of the ink this church has so long been renowned for.\n@c0@"
  es: "@a@b*: Llevo ya más años de los que puedo recordar intentando crear más tinta de la que ha hecho famosa a esta iglesia.\n@c0@"
  fr: "@a@b*ⓢ Je suis là depuis de si nombreuses années que je ne les compte plus. J'essaie de continuer à produire l'encre qui a valu sa renommée à cette église.\n@c0@"
  it: "@a@b*: Non ricordo nemmeno da quanti anni sono qui a cercare di produrre un po' dell'inchiostro speciale per cui questa chiesa è famosa in tutto il mondo...\n@c0@"
  ja: "@a@b＊「ここの教会に　古くから伝わる\n\tふしぎなインクを　作るため\n\tもう　何年を　ついやしただろう。\n@c0@"
23:
  de: "@a@b*: Vor Jahren habe ich die Spezialmischung in ein Horn gefüllt und sie dort reifen lassen.\n@c0@"
  en: "@a@b*: I put the special ink mixture into the tusk of an eyevory tusk-tusk and left it to mature over several years.\n@c0@"
  es: "@a@b*: Puse la mezcla especial en el colmillo de un tantor y la dejé madurar durante varios años.\n@c0@"
  fr: "@a@b*ⓢ J'ai placé le mélange spécial dans une défense de stigmammouth et je l'ai laissé macérer plusieurs années.\n@c0@"
  it: "@a@b*: Ho messo la miscela dell'inchiosto nella zanna di un Chiostrofante e l'ho lasciata a fermentare lì per anni...\n@c0@"
  ja: "@a@b＊「特別に　配合したインクを\n\tパオームのキバに　入れ\n\t何年も　かけて　じゅくせいさせ……\n@c0@"
24:
  de: "@a@b*: Und seit letzter Nacht ist sie endlich, endlich fertig!\n@c0@"
  en: "@a@b*: And finally! Finally, last night, it was ready!\n@c0@"
  es: "@a@b*: ¡Y al fin! ¡Al fin anoche estuvo lista!\n@c0@"
  fr: "@a@b*ⓢ Et enfinⓠ Enfin, la nuit dernière, il était prêtⓠ\n@c0@"
  it: "@a@b*: E...!\nCe l'ho fatta! Finalmente ci sono riuscito!\nLa notte scorsa l'inchiostro era pronto!\n@c0@"
  ja: "@a@b＊「やっと！　やっと　昨夜\n\t出来上がったのだっ！\n@c0@"
25:
  de: "@a@b*: Am liebsten würde ich die ganze Welt vor Freude umarmen! Möchtet Ihr nicht ein wenig von der Wundertinte mitnehmen?\n@c0@"
  en: "@a@b*: Oh! I want to share this joy with everyone\r\nI meet! Would you like to have some of the finished product?\n@c0@"
  es: "@a@b*: ¡Oh! ¡Quiero compartir esta alegría con todo el mundo! ¿%H0860%XQuieres%YQueréis%Z un poco del producto terminado?\n@c0@"
  fr: "@a@b*ⓢ Ohⓠ J'ai envie de partager ma joie avec tous les gens que je croiseⓠ Aimeriez-vous avoir un peu du produit finiⓡ\n@c0@"
  it: "@a@b*: Che gaudio! Che felicità!\nVoglio condividere il mio successo con il mondo intero!\n%H0860%XVuoi%YVolete%Z un po' d'inchiostro?\n@c0@"
  ja: "@a@b＊「ああっ　この感動を\n\t多くの人と　分かち合いたい！\n\tキミ　もらってくれるかね？\n@c0@"
26:
  de: "@a@b*: Dann sollt Ihr einen Teil bekommen! Aber seid bloß schön sparsam damit, hört Ihr?\n@c0@"
  en: "@a@b*: Then it's yours! Don't go wasting it,\r\nthough, will you?\n@c0@"
  es: "@a@b*: ¡Pues aquí está! Pero no la %H0860%Xmalgastes%Ymalgastéis%Z, ¿eh?\n@c0@"
  fr: "@a@b*ⓢ Dans ce cas, il est à vousⓠ\nMais ne le gâchez pas, surtoutⓠ\n@c0@"
  it: "@a@b*: Ecco qui!\n%H0860%XPrendilo e fanne buon uso. Cerca di non sprecarlo%YPrendetelo e fatene buon uso. Cercate di non sprecarlo%Z, mi raccomando!\n@c0@"
  ja: "@a@b＊「では　さしあげよう！\n\t大事に　使ってくれよ。\n@c0@"
27:
  de: "@a@b%0%a000120 erhält ein Tintenhorn!\n@c0@"
  en: "@a@b%0%a000120 receives a tusk-tusk tusk inkwell!\n@c0@"
  es: "@a@b¡%0%a000120 recibe un tintero de tantor!\n@c0@"
  fr: "@a@b%0%a000120 reçoit un encrier d'ivoireⓠ\n@c0@"
  it: "@a@b%0%a000120 ha ricevuto un magicalamaio!\n@c0@"
  ja: "@a@b%a000120は　パオームのインクを\n受けとった！\n@c0@"
28:
  de: "@a@b%0%a000180 steckt das Tintenhorn ein!\n@c0@"
  en: "@a@b%0%a000180 acquires a tusk-tusk tusk inkwell!\n@c0@"
  es: "@a@b¡%0%a000180 obtiene un tintero de tantor!\n@c0@"
  fr: "@a@b%0%a000180 récupère l'encrier d'ivoireⓠ\n@c0@"
  it: "@a@b%0%a000180 prende il magicalamaio!\n@c0@"
  ja: "@a@b%a000180は　パオームのインクを\n手に入れた！\n@c0@"
29:
  de: "@a@b*: N-Nein, nein, Ihr habt schon recht. Ich sollte nicht so verschwenderisch sein, sonst ist schon bald nichts mehr übrig.\n@c0@"
  en: "@a@b*: N-No, you're quite right. I mustn't give it out to all and sundry, otherwise it'll be gone in the blink of an eye.\n@c0@"
  es: "@a@b*: N-no, %H0860%Xtienes%Ytenéis%Z razón. No debo ir regalándola por ahí, o se terminará en un periquete.\n@c0@"
