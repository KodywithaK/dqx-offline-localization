  fr: "@a@b*ⓢ Ce bâton vous permettra de détruire les lourds rochers qui peuvent vous empêcher d'accéder à une grotte.\n@c0@"
  it: "@a@b*: Usando quell'oggetto, %H0860%Xdistruggerai%Ydistruggerete%Z le enormi rocce che bloccano l'accesso a una grotta...\n@c0@"
  ja: "@a@b＊「その杖を　使えば\n\t洞くつを　ふさぐ岩をも\n\tとかすことが　できようぞ！\n@c0@"
149:
  de: "@a@b%0%a000010 hält den Magmastab in die Höhe.\n@c0@"
  en: "@a@b%0%a000010 holds the magma staff aloft.\n@c0@"
  es: "@a@b%0%a000010 alza el báculo de magma.\n@c0@"
  fr: "@a@b%0%a000010 brandit le bâton de lave.\n@c0@"
  it: "@a@b%0%a000010 punta il bastone di magma verso l'alto...\n@c0@"
  ja: "@a@b%a000010は　マグマの杖を\n天に　かざした！\n@c0@"
150:
  de: "@a@b*: Hey-Dideldiii! Hiiilfe!\nKönnte bitte jemand diesen Waaagen stoppen?!\n@c0@"
  en: "@a@b*: Hum-diddly! Heeelp!\nSomeone stop this caaart!\n@c0@"
  es: "@a@b*: ¡Madre mía! ¡Socorrito!\r\n¡Que alguien pare este vagóóón!\n@c0@"
  fr: "@a@b*ⓢ Sapristiⓠ À l'aaaideⓠ\nArrêtez ce wagonneeetⓠ\n@c0@"
  it: "@a@b*: Waaaahhh! Aiuto!\nAiutatemi!\nQualcuno fermi questo dannatissimo carreeellooo!\n@c0@"
  ja: "@a@b＊「わー　助けてくれー！\n\t誰か　このトロッコを\n\t止めてくれー！\n@c0@"
151:
  de: "@a@bHier ist eine rostige alte Weiche.\nVerstellen?\n@c0@"
  en: "@a@bThere are some rusty old points here.\nSwitch them over?\n@c0@"
  es: "@a@bHay una palanca de cambio de agujas oxidada.\r\n¿Moverla?\n@c0@"
  fr: "@a@bIl y a là un vieux système d'aiguillage rouillé.\nInverser les aiguillesⓡ\n@c0@"
  it: "@a@bC'è uno scambio arrugginito.\nVuoi provare ad azionarlo?\n@c0@"
  ja: "@a@bさびついた　ポイントがある。\n切りかえてみますか？\n@c0@"
152:
  de: "@a@bMit all %A0110%Xseiner%Z%B0110%Xihrer%Z Kraft schafft %a000120 es, den rostigen Hebel umzulegen und die Weiche zu verstellen. Doch sie bricht!\n@c0@"
  en: "@a@bPutting all %A0110%Xhis%Z%B0110%Xher%Z strength into it, %a000120 pushes the rusty points lever and switches the points.\nThe points break!\n@c0@"
  es: "@a@bCon toda su fuerza, %a000120 empuja la palanca oxidada y cambia las vías.\n¡El mecanismo se rompe!\n@c0@"
  fr: "@a@bDe toutes ses forces, %a000120 pousse le\nvieux levier d'aiguillage et inverse les aiguilles.\nLes aiguilles cassentⓠ\n@c0@"
  it: "@a@b%0%a000120 spinge la leva dello scambio con tutte le sue forze...\nLa leva si muove... e poi si blocca!\n@c0@"
  ja: "@a@b%a000120は　ちからまかせに\nポイントレバーを　切りかえた！\nポイントは　こわれてしまった！\n@c0@"
153:
  de: "@a@b%0%a000120 lässt das Weichenumstellen lieber bleiben.\n@c0@"
  en: "@a@b%0%a000120 forgets the idea of changing the points.\n@c0@"
  es: "@a@b%0%a000120 abandona la idea de cambiar las vías.\n@c0@"
  fr: "@a@b%0%a000120 abandonne l'idée d'inverser\nles aiguilles.\n@c0@"
  it: "@a@b%0%a000120 decide di non azionare lo scambio.\n@c0@"
  ja: "@a@b%a000120は　ポイントを\n切りかえるのを　やめた。\n@c0@"
154:
  de: "@a@bDie Weiche ist kaputt.\n@c0@"
  en: "@a@bThe points are broken.\n@c0@"
  es: "@a@bLas palancas de cambio de agujas están rotas.\n@c0@"
  fr: "@a@bLes aiguilles sont cassées.\n@c0@"
  it: "@a@bLa leva è bloccata.\n@c0@"
  ja: "@a@bポイントは　こわれている。\n@c0@"
155:
  de: "@a@b*: Oooh... Aua!\n@c0@"
  en: "@a@b*: Oooh... Ouch!\n@c0@"
  es: "@a@b*: Oooh... ¡Ay!\n@c0@"
  fr: "@a@b*ⓢ Ooooh... Ouilleⓠ\n@c0@"
  it: "@a@b*: Oooh...\nAhia! Che maaale...\n@c0@"
  ja: "@a@b＊「うう　いたたた……。\n@c0@"
156:
  de: "@a@b*: Ich weiß zwar nicht, wer Ihr seid, aber ich bin froh, dass es immer noch solch gute Leute wie Euch auf der Welt gibt!\n@c0@"
  en: "@a@b*: I don't know who you are, %H0860%Xfriend%Yfriends%Z, but thank\nthe Goddess there are still good people like\nyou in the world!\n@c0@"
  es: "@a@b*: ¡No sé %H0860%Xquién eres, %A0110%Xamiguito%Z%B0110%Xamiguita%Z%Yquiénes sois, %R0000%Xamiguitas%Yamiguitos%Z%Z, pero gracias a la Diosa que aún queda gente así en el mundo!\n@c0@"
  fr: "@a@b*ⓢ Je ne sais pas qui vous êtes, %H0860%X%A0110%Xl'ami%Z%B0110%Xl'amie%Z%Y%R0000%Xles amies%Yles amis%Z%Z, mais je remercie la Déesse qu'il y ait encore de braves gens comme vous sur cette terreⓠ\n@c0@"
  it: "@a@b*: Non so chi %H0860%X%A0110%Xtu sia, amico mio%Z%B0110%Xtu sia, amica mia%Z%Y%R0000%Xsiate, amiche mie%Ysiate, amici miei%Z%Z ma prego la dea che %H0860%Xti%Yvi%Z conservi sempre in buona salute!\n@c0@"
  ja: "@a@b＊「どなたかは　知りませんが\n\tありがとうございました。\n@c0@"
157:
  de: "@a@b*: Ich Dummerchen bin einfach auf dieses Dings hier geklettert, ohne lang darüber nachzudenken.\nUnd das war vor zwanzig Jahren!\n@c0@"
  en: "@a@b*: Silly old me just climbed aboard that thing without so much as a should-I-diddly-shouldn't-I.\r\nAnd that was twenty years ago!\n@c0@"
  es: "@a@b*: Y pensar que me subí a ese trastito como quien no quiere la cosa...\r\n... ¡hace veinte años!\n@c0@"
  fr: "@a@b*ⓢ Comme un corniaud, j'ai grimpé dans ce truc sans réfléchir une seconde. C'était il y a vingt ansⓠ\n@c0@"
  it: "@a@b*: Accidenti a me e a quando ho avuto la dannatissima idea di salire bordo di quel ⓕcosoⓖ!\nÈ stato più di venti anni fa, %H0860%Xsai%Ysapete%Z?!\n@c0@"
  ja: "@a@b＊「うっかり　乗ってしまい\n\tかれこれ　２０年以上は\n\tまわっていたでしょうか……。\n@c0@"
158:
  de: "@a@b*: Ich hätte es besser wissen müssen. Die Neugier ist der Katze Tod, nicht wahr? Hach, in diesen Volksweisheiten steckt doch viel Wahres...\n@c0@"
  en: "@a@b*: I should've known better. Curiosity killed the cat.\nEvery good citizen knows that wholesome adage, don't they?\n@c0@"
  es: "@a@b*: Debí imaginarlo. La curiosidad mató al gato.\r\nToda personita de bien conoce el refrán, ¿no?\n@c0@"
  fr: "@a@b*ⓢ Quelle idée, heinⓡ La curiosité est un vilain défaut. Tout le monde connaît le dicton, pourtantⓠ\n@c0@"
  it: "@a@b*: Avrei dovuto immaginarlo che mi sarei cacciato in un pasticcio bruciante, visto che non sapevo come manovrare il carrello. Maledetta la mia curiosità!\n@c0@"
  ja: "@a@b＊「いや～　まいった　まいった。\n@c0@"
159:
  de: "@a@b*: Ach, du jemine! Wo bleiben denn meine Manieren? Ich hab mich noch gar nicht vorgestellt! Ich bin Dr. Ache.\n@c0@"
  en: "@a@b*: Oh, dearie! I'm forgetting my manners.\nI haven't even introduced myself.\nThey call me Dr Agon.\n@c0@"
  es: "@a@b*: ¡Oh, cielos! Olvido mis modales.\r\nNi siquiera me he presentado.\r\nMe llaman Dr. Agón.\n@c0@"
  fr: "@a@b*ⓢ Bon sang de boisⓠ J'en oublie les bonnes manières.\nJe ne me suis pas présenté. On m'appelle Dr Agon.\n@c0@"
  it: "@a@b*: Oh, %H0860%Xti%Yvi%Z prego di scusarmi! Preso dalla gioia della ritrovata libertà, ho dimenticato di presentarmi!\nIo sono il Dottor Agon. Piacere di %H0860%Xconoscerti%Yconoscervi%Z!\n@c0@"
  ja: "@a@b＊「あっ　申しおくれました。\n\t私は　プサン。\n@c0@"
160:
  de: "@aDr. Ache@bIch weiß, es ist kaum zu glauben, aber ich bin ein Zenithianer, wisst Ihr. Dideldum, jawohl, das bin ich.\n@c0@"
  en: "@aDr Agon@bYou'll probably find this a bit hard to believe, but I'm actually a Zenithian, you know. Oh, yes indeedy.\n@c0@"
  es: "@aDr. Agón@bQuizá lo %H0860%Xencuentres%Yencontréis%Z un poco dificilillo de creer, pero en realidad soy de Zenithia. ¡Oh!, vaya que sí.\n@c0@"
  fr: "@aDr Agon@bVous aurez sans doute du mal à le croire, mais je suis un Zénithien. Oui, oui, comme je vous le dis.\n@c0@"
  it: "@aDr. Agon@bForse non ci %H0860%Xcrederai%Ycrederete%Z, ma io vengo da Zenithia!\nChe io possa essere incenerito se non è vero!\n@c0@"
  ja: "@a@bプサン「信じられないでしょうが\n\tかつて　天空の民だった者です。\n@c0@"
161:
  de: "@aDr. Ache@bUnd wenn die zwanzig Jahre auf diesem Gefährt meinen Spürsinn nicht getrübt haben, würde ich sagen, dass Ihr genau dorthin wollt.\n@c0@"
  en: "@aDr Agon@bAnd if twenty years on that cart hasn't spoilt\r\nthe old Agon intuition, I'd say that's where\r\nyou're headed.\n@c0@"
  es: "@aDr. Agón@bY si veinte añitos en esa vagoneta no han embotado la vieja intuición de Agón, diría que ahí es adonde %H0860%Xte diriges%Yos dirigís%Z.\n@c0@"
  fr: "@aDr Agon@bEt si les vingt années passées sur ce wagonnet n'ont pas altéré ma bonne vieille intuition, je parie que c'est là que vous allez.\n@c0@"
  it: "@aDr. Agon@bE se i venti anni che ho trascorso su quel carrello non mi hanno mandato in fumo il cervello, direi che %H0860%X%A0110%Xsei diretto%Z%B0110%Xsei diretta%Z%Y%R0000%Xsiete dirette%Ysiete diretti%Z%Z proprio a Zenithia!\n@c0@"
  ja: "@a@bプサン「お見うけしたところ\n\tあなたがたも　天空の城に\n\tむかっていますね。\n@c0@"
162:
  de: "@aDr. Ache@bAch, es gibt doch nichts Erfrischenderes als eine schöne Reise, nicht wahr? Was dagegen, wenn ich mit Euch komme?\n@c0@"
  en: "@aDr Agon@bNothing like a good old fashioned, blister-rubbing trip, is there? Mind if I come along with you, %H0860%Xfriend%Yfriends%Z?\n@c0@"
  es: "@aDr. Agón@bNo hay nada como un viajecito a la antigua, con ampollas y todo, ¿eh? ¿%H0860%XTe%YOs%Z importa si %H0860%Xte%Yos%Z acompaño, amig%H0860%X%A0110%Xuito%Z%B0110%Xuita%Z%Y%R0000%Xuitas%Yuitos%Z%Z?\n@c0@"
  fr: "@aDr Agon@bRien de tel qu'un bon vieux voyage à l'ancienne et quelques ampoules aux pieds, heinⓡ Ça ne vous ennuie pas que je me joigne à vous, %H0860%X%A0110%Xl'ami%Z%B0110%Xl'amie%Z%Y%R0000%Xles amies%Yles amis%Z%Zⓡ\n@c0@"
  it: "@aDr. Agon@bPer tutte le fiamme! Certo che %H0860%X%A0110%Xti aspetta un bel viaggio! Ti spiace se vengo con te, caro amico%Z%B0110%Xti aspetta un bel viaggio! Ti spiace se vengo con te, cara amica%Z%Y%R0000%Xvi aspetta un bel viaggio! Vi spiace se vengo con voi, amiche%Yvi aspetta un bel viaggio! Vi spiace se vengo con voi, amici%Z%Z?\n@c0@"
  ja: "@a@bプサン「よろしい！\n\t私も　おとも　しましょう！\n@c0@"
163:
  de: "@aDr. Ache@bIhr kennt doch %H0860%X%Yalle%Z dieses alte Sprichwort:\nJe mehr, desto besser!\n@c0@"
  en: "@aDr Agon@b%H0860%XYou%YYou all%Z know the other age-old adage.\nThere's safety in num-diddly-umbers!\n@c0@"
  es: "@aDr. Agón@bYa %H0860%Xconoces%Yconocéis%Z el viejo refrán:\n¡El numerito hace la fuerza, tralará!\n@c0@"
  fr: "@aDr Agon@bVous connaissez sans doute cet autre vieux dictonⓢ\nl'union fait la forceⓠ\n@c0@"
  it: "@aDr. Agon@b%H0860%XSai%YSapete%Z come si dice, no? L'unione fa la forza! Più si è, meglio è! Molta brigata, vita beata! Rosso di sera, bel tempo si sper... No, questo non c'entra nulla.\n@c0@"
  ja: "@a@bプサン「人数が　多い方が\n\t心強いですからね。\n\tわっはっはっ。\n@c0@"
164:
  de: "@a@bDer Zenithianer Dr. Ache schließt sich der Gruppe an.\n@c0@"
  en: "@a@bThe Zenithian Dr Agon joins the party.\n@c0@"
  es: "@a@bEl Dr. Agón de Zenithia se une al grupo.\n@c0@"
  fr: "@a@bLe Dr Agon, de Zénithia, rejoint l'équipe.\n@c0@"
  it: "@a@bIl Dr. Agon, l'allegro Zenithiano, si unisce al gruppo!\n@c0@"
  ja: "@a@b天空人プサンが　仲間に\nくわわった！\n@c0@"
165:
  de: "@aDr. Ache@bDideldi-du, ich bin bereit!\nLasst uns aufbrechen!\n@c0@"
  en: "@aDr Agon@bI'm ready for action!\nLet's hit the road!\n@c0@"
  es: "@aDr. Agón@b¡Listo para la acción!\r\n¡En marcha!\n@c0@"
  fr: "@aDr Agon@bJe suis prêt pour l'aventureⓠ\nEn routeⓠ\n@c0@"
  it: "@aDr. Agon@bIo sono pronto!\nQuand'è che ci muoviamo, eh?!\n@c0@"
  ja: "@a@bプサン「では　まいりましょうか。\n@c0@"
166:
  de: "@a@b*: Niemand weiß, was das für ein Ort war. Vielleicht ein von Nimzo erbauter Schrein, um die Göttin zu erreichen, wer weiß...\n@c0@"
  en: "@a@b*: No one knows what this place was. A shrine built by Nimzo to get at the Goddess, perhaps...\n@c0@"
  es: "@a@b*: Nadie sabe qué era este sitio. Un templo creado por Nimzo para llegar hasta la Diosa, quizá...\n@c0@"
  fr: "@a@b*ⓢ Personne ne sait ce qu'était cet endroit.\nUn sanctuaire édifié par Nimzo pour atteindre la Déesse, peut-être...\n@c0@"
  it: "@a@b*: Nessuno sa con certezza per quale motivo sia stato costruito questo posto. C'è chi dice che fosse un tempio edificato da Nimzo per sfidare la dea...\n@c0@"
  ja: "@a@b＊「この遺跡は　かつて　邪悪なる\n\tミルドラースが　神に近づくために\n\t建てた神殿か……\n@c0@"
167:
  de: "@a@b*: Oder ein heiliger Ort der Göttin, um allen Rechtschaffenen den richtigen Weg zu weisen...\n@c0@"
  en: "@a@b*: Or a holy place created by the Goddess to guide the righteous...\n@c0@"
  es: "@a@b*: O un lugar santo creado por la Diosa para guiar a los virtuosos...\n@c0@"
  fr: "@a@b*ⓢ Ou bien un lieu saint créé par la Déesse pour guider les justes...\n@c0@"
  it: "@a@b*: Altri, invece, sostengono che fosse un luogo sacro creato dalla dea in persona per guidare i suoi fedeli.\n@c0@"
  ja: "@a@b＊「あるいは　神が　心正しき者を\n\tみちびくために　残した\n\t神殿か……\n@c0@"
168:
  de: "@a@b*: Im Laufe der Jahre waren zahllose Archäologen hier und ließen Ausgrabungen durchführen, um die Wahrheit zu ergründen.\n@c0@"
  en: "@a@b*: Plenty of archaeologists have put people like me to work over the years excavating the place in the hope of finding out.\n@c0@"
  es: "@a@b*: Muchos arqueólogos han puesto a gente como yo a excavar en el lugar con la esperanza de descubrirlo.\n@c0@"
  fr: "@a@b*ⓢ De nombreux archéologues ont fait travailler des gens comme moi pendant des années, creusant inlassablement dans l'espoir d'obtenir une réponse.\n@c0@"
  it: "@a@b*: Per anni gli archeologi si sono scervellati per scoprire di cosa si tratti...\n㈡\n*: Centinaia di poveracci come me hanno sudato settantasette camicie scavando a destra e a sinistra, in alto e in basso...!\n@c0@"
  ja: "@a@b＊「多くの学者が　ワシのような者を\n\tつかって　発掘を　続けさせた\n\tものだが……。\n@c0@"
169:
  de: "@a@b*: Doch dieser Ort ist und bleibt ein Mysterium.\n@c0@"
  en: "@a@b*: But it's still a mystery.\n@c0@"
  es: "@a@b*: Pero sigue siendo un misterio.\n@c0@"
  fr: "@a@b*ⓢ Mais ça reste un mystère.\n@c0@"
  it: "@a@b*: Ma è stato tutto inutile.\nIl mistero rimane.\nNessuno è riuscito a scoprire quale sia la verità...\n@c0@"
  ja: "@a@b＊「本当のところは　誰にも\n\t分からんかった。\n@c0@"
170:
  de: "@a@b*: Oder die Leute hatten einfach Angst davor, die Wahrheit zu erfahren...\n@c0@"
  en: "@a@b*: Or perhaps people were just too scared to find out the truth.\n@c0@"
  es: "@a@b*: O quizá la gente tema descubrir la verdad.\n@c0@"
  fr: "@a@b*ⓢ À moins qu'en réalité, les gens n'aient eu trop peur de découvrir la vérité.\n@c0@"
  it: "@a@b*: O, forse, la verità è troppo terrificante per essere rivelata al mondo...\n@c0@"
  ja: "@a@b＊「……あるいは　真実をさぐる勇気が\n\t足りなかったのかも　しれんがな。\n@c0@"
171:
  de: "@a@bHier ist eine Weiche.\nVerstellen?\n@c0@"
  en: "@a@bThere are some points here.\nSwitch them over?\n@c0@"
  es: "@a@bAquí hay cambios de aguja.\n¿Moverlos?\n@c0@"
  fr: "@a@bIl y a là un système d'aiguillage.\nInverser les aiguillesⓡ\n@c0@"
  it: "@a@bCi sono degli scambi.\nVuoi azionarli?\n@c0@"
  ja: "@a@bポイントがある。\n切りかえますか？\n@c0@"
172:
  de: "@aDr. Ache@bHeiliger Bimbam! Schaut Euch den Schlamassel an. Das Schloss liegt auf dem Grund dieses Sees, und so gut wie jeder Raum ist überflutet!\n@c0@"
  en: "@aDr Agon@bWell, shoot! Would you look at that? Now the castle's at the bottom of this lake, practically every room's flooded. The whole shebang!\n@c0@"
  es: "@aDr. Agón@b¡Cáspita caspitita! ¡Lo que hay que ver! El castillo está en el fondito del lago, totalmente inundado. ¡De arriba abajo!\n@c0@"
  fr: "@aDr Agon@bMince alorsⓠ Regardez-moi çaⓠ Maintenant que le château se trouve au fond de ce lac, presque toutes les pièces sont inondées.\n@c0@"
  it: "@aDr. Agon@bPer tutte le fiamme! Il castello è finito in fondo al lago, e le stanze sono tutte invase dall'acqua!\nUhm uhm uhm...\n@c0@"
  ja: "@a@bプサン「いやー　ひどいもんですね。\n\t湖に沈んだだけあって\n\t城中　水びたしみたいですよ。\n@c0@"
173:
  de: "@aDr. Ache@bIch hab mir lang den Kopf zerbrochen, aber ich weiß immer noch nicht, wieso das Schloss vom Himmel gefallen ist.\n@c0@"
  en: "@aDr Agon@bI've been scratching my noggin now for a month of Sun-diddly-undays, but I still can't figure out why the place fell out of the sky.\n@c0@"
  es: "@aDr. Agón@bLlevo un mes, con todos sus días y sus noches, rascándome la testuzilla, pero no imagino cómo pudo caer eso del cielo.\n@c0@"
  fr: "@aDr Agon@bJe me suis creusé le ciboulot pendant une paye, mais pas moyen de comprendre pourquoi tout le bataclan est tombé du ciel.\n@c0@"
  it: "@aDr. Agon@bCi ho riflettuto a lungo, ma ancora non sono riuscito a capire come mai il maniero sia precipitato dal cielo.\n@c0@"
  ja: "@a@bプサン「でも　この城が　なぜ\n\t天空から　落ちてしまったので\n\tしょうか……。\n@c0@"
174:
  de: "@aDr. Ache@bHab ich's mir doch gedacht, kein einziger Zenithianer zu sehen...\n@c0@"
  en: "@aDr Agon@bJust as I thought, there isn't a Zen-diddly-ithian in the whole place.\n@c0@"
  es: "@aDr. Agón@bComo pensé, no hay un solo zenithio en todo el lugarcito.\n@c0@"
  fr: "@aDr Agon@bC'est bien ce que je me disais. Pas un seul Zénithien dans cette cambuse.\n@c0@"
  it: "@aDr. Agon@bProprio come pensavo: qui non c'è nemmeno l'ombra di uno Zenithiano.\n@c0@"
  ja: "@a@bプサン「やはり　ここにも\n\t誰も　いないようですね。\n@c0@"
175:
  de: "@aDr. Ache@bBei meinen Baumwollsocken, das hätte ich ja fast vergessen! Hinter dem alten Thron hier müsste eine geheime Treppe verborgen sein...\n@c0@"
  en: "@aDr Agon@bOh, bless my cotton socks, I almost forgot!\r\nThere should be a secret staircase just behind\r\nthe old throne here...\n@c0@"
  es: "@aDr. Agón@b¡Por mis calcetines de algodón, casi me olvido!\r\nJusto detrás del viejo trono debería de haber una escalerita secreta...\n@c0@"
  fr: "@aDr Agon@bOh, mais ça me revient, d'un coup d'un seulⓠ\nIl doit y avoir un escalier secret caché là, juste derrière le vieux trône...\n@c0@"
  it: "@aDr. Agon@bPerò però però...\nSe non sbaglio, dietro il vecchio trono dovrebbe esserci una scala segreta.\n@c0@"
  ja: "@a@bプサン「あっ　そうそう。\n\tたしか　玉座の後ろに　ヒミツの\n\t階段が　あったはずですが……。\n@c0@"
176:
  de: "@aDr. Ache@bWas zum Kuckuck?!\n@c0@"
  en: "@aDr Agon@bWhat in the name of hi-diddly-ho!?\n@c0@"
  es: "@aDr. Agón@bEn nombre del tralará...\n@c0@"
  fr: "@aDr Agon@bAlors ça, par exempleⓠⓑ\n@c0@"
  it: "@aDr. Agon@bChe io sia incenerito!\n@c0@"
  ja: "@a@bプサン「やや！　これは　いったい！\n@c0@"
177:
  de: "@aDr. Ache@bAuf diesem Sockel müsste eine Goldkugel liegen, aber sie ist weg! Ojemine...\n@c0@"
  en: "@aDr Agon@bThere should be a gold orb on this pedestal, but it's as empty as a heart full of sin!\n@c0@"
  es: "@aDr. Agón@b¡En este pedestal debía haber un orbe de oro, pero está vacío como un corazón pecaminoso!\n@c0@"
  fr: "@aDr Agon@bIl devrait y avoir un orbe d'or sur ce piédestal, mais il est aussi vide qu'un cœur plein de péchésⓠ\n@c0@"
  it: "@aDr. Agon@bAvrebbe dovuto esserci un globo d'oro su questo piedistallo, ma io non lo vedo!\n@c0@"
  ja: "@a@bプサン「ここに　あったはずの\n\tゴールドオーブが　なくなって\n\tいるでは　ありませんか！\n@c0@"
178:
  de: "@aDr. Ache@bUnd dieses Loch...\n@c0@"
  en: "@aDr Agon@bAnd this hole...\n@c0@"
  es: "@aDr. Agón@bY este agujerito...\n@c0@"
  fr: "@aDr Agon@bEt ce trou...\n@c0@"
  it: "@aDr. Agon@bQuesto buco...\n@c0@"
  ja: "@a@bプサン「むっ！　この穴は……。\n@c0@"
179:
  de: "@aDr. Ache@bIch schätze, es ist entstanden, als das Böse vor langer Zeit erwachte.\n@c0@"
  en: "@aDr Agon@bI suppose it must've opened up when that evil knievel one awoke long, long ago.\n@c0@"
  es: "@aDr. Agón@bSupongo que se abrió cuando ese villano despertó hace tanto, tanto tiempo.\n@c0@"
  fr: "@aDr Agon@bJe suppose qu'il a dû s'ouvrir quand cette engeance maléfique s'est réveillée, il y a bien longtemps.\n@c0@"
  it: "@aDr. Agon@bScommetto che si è aperto quando quell'essere malefico si risvegliò tanti anni fa.\n@c0@"
  ja: "@a@bプサン「たしか　大昔\n\t邪悪な者が　誕生するときに\n\tあけた穴……。\n@c0@"
180:
  de: "@aDr. Ache@bWelch ein Pech aber auch! Die Kugel muss hindurch gefallen sein!\n@c0@"
  en: "@aDr Agon@bOf all the rotten luck! The gold orb must've fallen out through it!\n@c0@"
  es: "@aDr. Agón@b¡Maldición (con perdón)! ¡El orbe de oro habrá caído por él!\n@c0@"
  fr: "@aDr Agon@bNom d'une pipe en boisⓠ\nL'orbe d'or a dû tomber dans le trouⓠ\n@c0@"
  it: "@aDr. Agon@bAh, che sfortunaccia!\nIl globo d'oro dev'esserci caduto dentro!\n@c0@"
  ja: "@a@bプサン「そうか……。\n\tゴールドオーブは\n\tこの穴から……。\n@c0@"
181:
  de: "@aDr. Ache@bUnd mit nur einer Kugel konnte das Schloss wahrscheinlich nicht...\n@c0@"
  en: "@aDr Agon@bI guess with only one orb left, the poor castle\r\njust couldn't...\n@c0@"
  es: "@aDr. Agón@bSupongo que, con solo un orbe, el pobrecito castillo no pudo...\n@c0@"
  fr: "@aDr Agon@bJ'imagine qu'avec un seul orbe restant, le pauvre château ne pouvait plus...\n@c0@"
  it: "@aDr. Agon@bCiò spiegherebbe tutto.\nCon un solo globo, il castello non poteva certo restare in aria...\n@c0@"
  ja: "@a@bプサン「そして　残りのオーブひとつでは\n\tささえきれずに　やがて\n\tこの城も……。\n@c0@"
182:
  de: "@aDr. Ache@bNun ja, jetzt wissen wir, warum Zenithia vom Himmel gefallen ist.\n@c0@"
  en: "@aDr Agon@bWell, now we know why Zenithia crashed out of the sky at least.\n@c0@"
  es: "@aDr. Agón@bBueno, al menos ya sabemos por qué Zenithia cayó del cielito.\n@c0@"
  fr: "@aDr Agon@bBon, au moins, maintenant, nous savons pourquoi Zénithia est tombé du ciel.\n@c0@"
  it: "@aDr. Agon@bBeh, almeno abbiamo scoperto per quale motivo il castello è precipitato.\n@c0@"
  ja: "@a@bプサン「これで　この城が　天より\n\t落ちてしまった理由が\n\t分かりました。\n@c0@"
183:
  de: "@aDr. Ache@bWenn ich doch nur wüsste, wo die Goldkugel jetzt ist...\n@c0@"
  en: "@aDr Agon@bI just wish to goodness I knew where the\r\ngold orb was.\n@c0@"
  es: "@aDr. Agón@bAunque me encantaría saber dónde está el orbecillo de oro.\n@c0@"
  fr: "@aDr Agon@bSi seulement je savais où se trouve l'orbe d'or.\n@c0@"
  it: "@aDr. Agon@bPerò ora vorrei tanto capire dove sia finito il globo!\nFarei fuoco e fiamme per scoprirlo!\n@c0@"
  ja: "@a@bプサン「しかし　ゴールドオーブは\n\tいったい　どこに\n\t行ったのでしょうか……。\n@c0@"
184:
  de: "@aDr. Ache@bDer Sockel ist immer noch von einer goldenen Aura umgeben.\n@c0@"
  en: "@aDr Agon@bThe pedestal's still got a bit of the old gold orb aura about it, though.\n@c0@"
  es: "@aDr. Agón@bEn el pedestal aún queda un poco del aura del viejo orbe de oro.\n@c0@"
  fr: "@aDr Agon@bCeci dit, le piédestal a encore un peu de l'ancienne aura de l'orbe d'or.\n@c0@"
  it: "@aDr. Agon@bUhm...\nSul piedistallo è rimasta un po' dell'essenza aurea del globo...\n@c0@"
  ja: "@a@bプサン「さいわい　この台には　まだ\n\tオーブのオーラが　かすかに\n\t残っているようです。\n@c0@"
185:
  de: "@aDr. Ache@bVielleicht könnte ich mit ein wenig Meditation herausfinden, wo die Kugel gelandet ist.\n@c0@"
  en: "@aDr Agon@bMaybe with a spot of meditation, I could figure out where in the world the orb ended up.\n@c0@"
  es: "@aDr. Agón@bQuizás meditando pueda descubrir dónde diantritos terminó el orbe.\n@c0@"
  fr: "@aDr Agon@bPeut-être qu'avec un chouïa de méditation, je pourrais découvrir où est passé cet orbe.\n@c0@"
  it: "@aDr. Agon@bMagari, se mi concentrassi, potrei cercare di capire dove si trova adesso quella magica sfera...\nProvare non costa nulla!\n@c0@"
  ja: "@a@bプサン「そのオーラを追って\n\tゴールドオーブのゆくえを\n\tめいそう　してみましょう。\n@c0@"
186:
  de: "@a@bDr. Ache schließt die Augen und beginnt, seine Gedanken zu sammeln...\n@c0@"
  en: "@a@bDr Agon closes his eyes and starts to gather\r\nhis thoughts...\n@c0@"
  es: "@a@bEl Dr. Agón cierra los ojos y empieza a concentrarse...\n@c0@"
  fr: "@a@bLe Dr Agon ferme les yeux et se concentre...\n@c0@"
  it: "@a@bIl Dr. Agon chiude gli occhi e si raccoglie in meditazione...\n@c0@"
  ja: "@a@bプサンは　目をとじて\n気を　あつめはじめた！\n@c0@"
187:
  de: "@aBianca@bNun, so weit, so gut. Jetzt können die beiden endlich in Frieden ruhen.\n@c0@"
  en: "@aBianca@bWell, that's good. Now the two of them can finally sleep peacefully together.\n@c0@"
  es: "@aBianca@bBueno, genial. Ahora los dos pueden descansar en paz juntos.\n@c0@"
  fr: "@aBianca@bTrès bien. Ils peuvent enfin reposer tous les deux en paix, côte à côte.\n@c0@"
  it: "@aBianca@bAh, che bello!\nOra gli abitanti del castello possono riposare in pace!\nCome sono felice!\n@c0@"
  ja: "@a@bビアンカ「よかったわね。\n\tこれからは　２人　幸せに\n\t眠りつづけるはずよ。\n@c0@"
188:
  de: "@aBianca@bDiese Gespenster, die das Schloss eingenommen hatten, waren ziemlich fiese Gesellen, was?\n@c0@"
  en: "@aBianca@bThose ghosts who took over this place were a nasty bunch, eh?\n@c0@"
  es: "@aBianca@bEsos fantasmas que invadían este sitio eran lo peor, ¿a que sí?\n@c0@"
  fr: "@aBianca@bLes fantômes qui s'étaient emparés de cet endroit étaient plutôt méchants, heinⓡ\n@c0@"
  it: "@aBianca@bCerto che quei fantasmi erano davvero cattivi, eh?\n@c0@"
  ja: "@a@bビアンカ「でも　このお城に住みついた\n\tゴーストたちも　ゆるせないけど……\n@c0@"
189:
  de: "@aBianca@bAber die Hauptschuld tragen die Ungeheuer, die mit ihnen gekommen sind und all diese armen, unschuldigen Leute getötet haben.\n@c0@"
  en: "@aBianca@bBut it's the monsters who came along and killed all those poor innocent people who are the most to blame.\n@c0@"
  es: "@aBianca@bPero realmente la culpa era de los monstruos que mataron a todos estos inocentes, ¿sabes?\n@c0@"
  fr: "@aBianca@bMais ce sont les monstres qui sont venus tuer tous ces pauvres innocents qui sont le plus à blâmer.\n@c0@"
  it: "@aBianca@bPerò i mostri che vennero qui e ammazzarono tutti erano ancora più cattivi!\n@c0@"
  ja: "@a@bビアンカ「罪のない　お城の人たちを\n\tおそった　魔物は　もっと\n\tゆるせないわね！\n@c0@"
190:
  de: "@aBianca@bOh! Was ist das? Was für eine schöne Kugel!\n@c0@"
  en: "@aBianca@bOh! What's that? What a pretty ball!\n@c0@"
  es: "@aBianca@b¡Oh! ¿Qué es eso? ¡Qué bonita esfera!\n@c0@"
  fr: "@aBianca@bOhⓠ Qu'est-ce que c'est que çaⓡ Quelle jolie balleⓠ\n@c0@"
  it: "@aBianca@bOh, guarda!\nChe bella sfera!\n@c0@"
  ja: "@a@bビアンカ「あら？　なにかしら？\n\tきれいな　宝玉ね。\n@c0@"
191:
  de: "@aBianca@bDas ist bestimmt eine Art Belohnung.\nWir sollten sie mitnehmen.\n@c0@"
  en: "@aBianca@bI'll bet it's some kind of reward.\nWe should take it with us.\n@c0@"
  es: "@aBianca@bDebe de ser una especie de recompensa.\r\nVamos a llevárnosla.\n@c0@"
  fr: "@aBianca@bJe parie que c'est une sorte de récompense.\nOn devrait l'emporter avec nous.\n@c0@"
  it: "@aBianca@bForse il Conte e la Contessa ce l'hanno lasciata per ricompensarci dell'aiuto che abbiamo dato loro.\nForza, prendiamola!\n@c0@"
  ja: "@a@bビアンカ「きっと　お礼よ。\n\tねえ　持ってゆきましょう。\n@c0@"
192:
  de: "@a@bBianca nimmt die schimmernde Goldkugel und gibt sie %a000090.\n@c0@"
  en: "@a@bBianca takes the glowing gold orb and hands it to %a000090.\n@c0@"
  es: "@a@bBianca toma el reluciente orbe de oro y se lo da a %a000090.\n@c0@"
  fr: "@a@bBianca prend l'orbe d'or étincelant et le donne à %a000090.\n@c0@"
  it: "@a@bBianca prende la sfera scintillante e la dà a %a000090.\n@c0@"
  ja: "@a@bビアンカは　金色に光るオーブを\nひろって　%a000090に　手わたした。\n@c0@"
193:
  de: "@a@b%0%a000090 erhält die Goldkugel!\n@c0@"
  en: "@a@b%0%a000090 acquires the gold orb!\n@c0@"
  es: "@a@b¡%0%a000090 obtiene el orbe de oro!\n@c0@"
  fr: "@a@b%0%a000090 obtient l'orbe d'orⓠ\n@c0@"
  it: "@a@b%0%a000090 ha ottenuto il globo d'oro!\n@c0@"
  ja: "@a@b%a000090は　ゴールドオーブを\n手に入れた！\n@c0@"
194:
  de: "@a@b*: Hallo. Was hast du denn da Schönes? Das sieht ja interessant aus.\n@c0@"
  en: "@a@b*: Hello. That's an interesting-looking gem you've got there.\n@c0@"
  es: "@a@b*: Hola. Esa joya que llevas ahí parece interesante.\n@c0@"
  fr: "@a@b*ⓢ Bonjour.\nC'est une pierre intéressante que tu as là.\n@c0@"
  it: "@a@b*: Salve!\nChe bella pietra che hai lì...\n@c0@"
  ja: "@a@b＊「うん？　坊やは\n\tふしぎな　宝玉を\n\t持っているな。\n@c0@"
195:
  de: "@a@b*: Es ist eine Goldkugel, sagst du?\n@c0@"
  en: "@a@b*: It's a gold orb, you say?\n@c0@"
  es: "@a@b*: ¿Dices que es un orbe de oro?\n@c0@"
  fr: "@a@b*ⓢ C'est un orbe d'or, dis-tuⓡ\n@c0@"
  it: "@a@b*: È un globo d'oro, vero?\n@c0@"
  ja: "@a@b＊「そうか　ゴールドオーブって\n\t言うんだね。\n@c0@"
196:
  de: "@a@b*: Darf ich sie mir mal näher ansehen?\n@c0@"
  en: "@a@b*: Do you mind if I have a closer look?\n@c0@"
  es: "@a@b*: ¿Me dejas examinarlo más de cerca?\n@c0@"
  fr: "@a@b*ⓢ Tu veux bien que je le regarde de plus prèsⓡ\n@c0@"
  it: "@a@b*: Posso guardarlo più da vicino?\n@c0@"
  ja: "@a@b＊「その　オーブを　ちょっと\n\t見せてくれないか？\n@c0@"
197:
  de: "@aPrinz Harry@bIch bin der Prinz von Tifortu. Der Thronanwärter! Ich nehme an, du willst mir dienen, indem du mein Lakai wirst, willst du nicht?\n@c0@"
  en: "@aPrince Harry@bI'm the Prince of Coburg. The next in line to the throne! I expect you want to serve me by being\r\nmy lackey, do you?\n@c0@"
  es: "@aPríncipe Froilán@bSoy el Príncipe de Trastámara, ¡el heredero al trono! Sin duda, querrás servirme como lacayo, ¿verdad?\n@c0@"
  fr: "@aPrince Harry@bMoi, je suis le prince de Cobourg. Le prochain à monter sur le trôneⓠ Je suppose que tu veux me servir en devenant mon laquais, c'est çaⓡ\n@c0@"
  it: "@aPrincipe Robert@bIo sono il Principe di Coburg, futuro sovrano di questo Regno! Scommetto che vorresti essere il mio fedele aiutante, eh?\n@c0@"
  ja: "@a@bヘンリー「オレは　この国の王子。\n\t王さまの次に　えらいんだ。\n\tオレの子分に　してやろうか？\n@c0@"
198:
  de: "@aDr. Ache@bAch, du gute Güte, welch ein Schlamassel!\nDie Kugel wurde zerstört!\n@c0@"
  en: "@aDr Agon@bHoly Goddess, we're done-diddly-doodahed for!\nThe orb's been destroyed!\n@c0@"
  es: "@aDr. Agón@b¡Santa Diosa, estamos aviaditos!\n¡El orbe ha sido destruido!\n@c0@"
  fr: "@aDr Agon@bNom d'une Déesse, nous sommes cuits et recuitsⓠ\nL'orbe a été détruitⓠ\n@c0@"
  it: "@aDr. Agon@bPer tutte le fiamme! Siamo fritti!\nIl globo d'oro è stato distrutto!\n@c0@"
  ja: "@a@bプサン「なんということでしょう！\n\tオーブは　すでに　こわされて\n\tいたようです！\n@c0@"
199:
  de: "@aDr. Ache@bZenithia wird nie wieder hoch über den Wolken thronen...\n@c0@"
  en: "@aDr Agon@bZenithia won't ever fly above the clouds agⓚⓛ\n@c0@"
  es: "@aDr. Agón@bZenithia no volverá a volar entre las nub...\n@c0@"
  fr: "@aDr Agon@bZénithia ne flottera plus jamais au-dessus des nua...\n@c0@"
  it: "@aDr. Agon@bZenithia non potrà più tornare a vol...\n@c0@"
  ja: "@a@bプサン「もはや　この城は\n\t２度と　天空には……。\n@c0@"
200:
  de: "@aDr. Ache@bNein, dideldum! So schnell lassen wir das Schiff nicht sinken!\n@c0@"
  en: "@aDr Agon@bNo! Wait a mo-diddly-oment!\nThis ship isn't sinking that easily!\n@c0@"
  es: "@aDr. Agón@b¡No! ¡Un momentito!\n¡Este barquito no se hundirá sin lucha, ya lo creo!\n@c0@"
  fr: "@aDr Agon@bNonⓠ Attendez une minuteⓠ\nPas question de s'avouer vaincusⓠ\n@c0@"
  it: "@aDr. Agon@bNo!\nForse non tutte le speranze sono andate in fumo!\nMi sta venendo in mente una cosa...\n@c0@"
  ja: "@a@bプサン「いや！\n\tちょっと　まってください！\n@c0@"
201:
  de: "@aDr. Ache@bWenn mich mein altes Köpfchen nicht im Stich lässt, heißt es in einer Legende, dass die beiden Kugeln von den Feen erschaffen wurden.\n@c0@"
  en: "@aDr Agon@bIf my old noggin's not failing me, I seem to remember a legend about the faeries creating the two orbs.\n@c0@"
  es: "@aDr. Agón@bSi la vieja testuzilla no me falla, creo recordar una leyenda sobre las hadas que crearon los dos orbes.\n@c0@"
  fr: "@aDr Agon@bSi ma vieille caboche ne me trompe pas, je crois me souvenir d'une légende racontant que les deux orbes avaient été créés par les fées.\n@c0@"
  it: "@aDr. Agon@bSe non ricordo male, la leggenda dice che furono le fate a creare i globi!\n@c0@"
  ja: "@a@bプサン「たしか　伝説では\n\t２つのオーブは　妖精たちの\n\t祖先が作ったと　言われています。\n@c0@"
202:
  de: "@aDr. Ache@bVielleicht könnte die Feenherrin ihre honigsüße Magie ja wieder anwenden und uns eine neue Kugel zaubern.\n@c0@"
  en: "@aDr Agon@bMaybe we could ask the Faerie Queen to work her honeydew magic again and cook us up another one.\n@c0@"
  es: "@aDr. Agón@bQuizá podamos pedir a la Reina de las Hadas que vuelva a obrar su meliflua magia y nos prepare otro.\n@c0@"
  fr: "@aDr Agon@bNous pourrions peut-être demander à la reine des fées de faire marcher sa magie pour nous en fabriquer un nouveau.\n@c0@"
  it: "@aDr. Agon@bE se provassimo a chiedere alla Regina delle Fate di realizzarne un altro?\n@c0@"
  ja: "@a@bプサン「妖精の女王に　たのめば\n\tまた作ってくれるかも\n\tしれませんね。\n@c0@"
203:
  de: "@aDr. Ache@bIch habe von einem Wald gehört, der direkt ins Feenreich führen soll, wisst Ihr...\n@c0@"
  en: "@aDr Agon@bYou know, I've heard there's a forest somewhere in the world that leads to the Realm of the Faeries.\n@c0@"
  es: "@aDr. Agón@bHe oído que hay un bosquecillo en alguna parte que conduce al Reino de las Hadas.\n@c0@"
  fr: "@aDr Agon@bVous savez, j'ai entendu dire qu'il existe quelque part dans le monde une forêt qui mène au royaume des Fées.\n@c0@"
  it: "@aDr. Agon@bSo che in una certa foresta c'è un passaggio che porta dritto dritto nel Regno delle Fate!\n@c0@"
  ja: "@a@bプサン「世界のどこかに\n\t妖精の村に通じる森がある　と\n\t聞いたことが　あります。\n@c0@"
204:
  de: "@aDr. Ache@bHey-Dideldi-Du! Na, wenn das kein Plan ist, %a000140! Ich warte hier, und Ihr macht Euch auf den Weg und bringt alles wieder in Ordnung!\n@c0@"
  en: "@aDr Agon@bHi-diddly-ho, it's a plan, %a000140! I'll be waiting here. You run along and see what you can do, okay?\n@c0@"
  es: "@aDr. Agón@b¡Tenemos un plan, %a000090! Esperaré aquí. %H0860%XVe%YId%Z a ver qué %H0860%Xpuedes%Ypodéis%Z hacer, ¿de acuerdito?\n@c0@"
  fr: "@aDr Agon@bTip-top, la voilà l'idée, %a000140ⓠ\nJe vous attendrai ici. Vous, vous filez voir ce que vous pouvez faire, d'accordⓡ\n@c0@"
  it: "@aDr. Agon@bPer tutte le fiamme! Proviamoci, %a000140! Io resterò qui ad aspettare, mentre %H0860%Xtu farai un salto dalle fate e chiederai%Yvoi farete un salto dalle fate e chiederete%Z loro di aiutarci.\n@c0@"
  ja: "@a@bプサン「私は　ここで待っています。\n\tたのみましたよ　%a000140！\n@c0@"
205:
  de: "@a@b%0%a000120 sieht sich den Sockel genauer an...\n@c0@"
  en: "@a@b%0%a000120 examines the pedestal...\n@c0@"
  es: "@a@b%0%a000120 examina el pedestal...\n@c0@"
  fr: "@a@b%0%a000120 examine le piédestal...\n@c0@"
  it: "@a@b%0%a000120 esamina il piedistallo...\n@c0@"
  ja: "@a@b%a000120は　しょく台を　調べた。\n@c0@"
206:
  de: "@a@bAuf ihm thront einsam eine schimmernde Silberkugel.\n@c0@"
  en: "@a@bA solitary silver orb shimmers forlornly atop it.\n@c0@"
  es: "@a@bUn solitario orbe de plata brilla desamparado.\n@c0@"
  fr: "@a@bUn orbe d'argent solitaire luit tristement\r\nà son sommet.\n@c0@"
  it: "@a@bUn solitario globo d'argento risplende su di esso...\n@c0@"
  ja: "@a@bシルバーオーブが　さびしげに\nかがやいている……。\n@c0@"
207:
  de: "@a@bDort ist ein Strudel, der wie ein Teleportal aussieht.\nReinspringen?\n@c0@"
  en: "@a@bThere's a whirlpool that looks like a teleportal.\nJump in?\n@c0@"
  es: "@a@bHay un remolino que parece un portal de teletransporte.\n¿Saltar a su interior?\n@c0@"
  fr: "@a@bCe tourbillon ressemble à un téléportail.\nY entrerⓡ\n@c0@"
  it: "@a@bQuesto vortice conduce sicuramente da qualche parte...\nVuoi saltarci dentro?\n@c0@"
  ja: "@a@b旅の扉のような　光の渦だ……。\n中にとびこみますか？\n@c0@"
208:
  de: "@a@bHier ist eine Geheimtreppe, die nach unten führt!\n@c0@"
