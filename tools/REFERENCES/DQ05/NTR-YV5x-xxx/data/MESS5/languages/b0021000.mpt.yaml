  ja: "@a@b＊「ここは　大学者デズモンさまの\n\tお部屋です。\n@c0@"
238:
  de: "@aDarwin@bIch habe gehört, dass Ihr jetzt König von Humburg seid, %a000090.\n@c0@"
  en: "@aDarwin@bI heard the news about you becoming King of Gotha, %a000090.\n@c0@"
