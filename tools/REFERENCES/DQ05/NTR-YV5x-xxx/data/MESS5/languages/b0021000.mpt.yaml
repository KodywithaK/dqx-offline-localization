  ja: "@a@b＊「ああ　びっくりした。\n\tてっきり　コリンズ王子だと……。\n@c0@"
236:
  de: "@aDarwin@bMeinen Forschungen zufolge gibt es irgendwo in der Welt einen Umhang, den einst ein tapferer König in der Schlacht trug.\n@c0@"
  en: "@aDarwin@bMy research tells me that somewhere in the world there still exists a cape that was worn long ago by\r\na brave king in battle.\n@c0@"
  es: "@aDarwin@bMis investigaciones me indican que en alguna parte existe una capa que fue llevada tiempo ha por un valiente rey en batalla.\n@c0@"
  fr: "@aDarwin@bMes recherches indiquent qu'il existe toujours quelque part dans le monde un manteau que portait au combat un roi courageux, il y a fort longtemps.\n@c0@"
  it: "@aMack Kihe@bDi recente ho scoperto che, in un luogo imprecisato, dovrebbe essere custodito un antico mantello che un coraggioso re indossò in battaglia molti anni fa.\n@c0@"
  ja: "@a@b＊「人が　ネズミをきらいなのを\n\t知ってて　頭に　ネズミを\n\tのせるんだよ。　まいるよなあ。\n@c0@"
237:
