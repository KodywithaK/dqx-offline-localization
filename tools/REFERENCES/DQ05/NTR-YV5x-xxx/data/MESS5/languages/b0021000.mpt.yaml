  en: "@a@b*: His latest trick is putting mice on people's heads because he knows everyone hates them. Not very nice at all.\n@c0@"
  es: "@a@b*: Su última broma es ponerle ratones a la gente en la cabeza porque todos los odian. Muy desagradable.\n@c0@"
  fr: "@a@b*ⓢ Sa dernière trouvaille consiste à mettre des souris sur la tête des gens, parce qu'il sait que tout le monde déteste ça. C'est vraiment désagréable.\n@c0@"
  it: "@a@b*: Da quando ha scoperto che alla gente i topi fanno ribrezzo, si diverte a mettere quei ⓕsimpaticiⓖ roditori in testa a chiunque gli capiti a tiro.\n@c0@"
  ja: "@a@b＊「わっ！\n@c0@"
235:
