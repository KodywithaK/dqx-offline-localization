  fr: "@a@b*ⓢ Dans un passé lointain, nous vouions une telle admiration aux pouvoirs magiques de Magdalena...\n㈡\n *ⓢ ... que nous l'avions confinée dans la salle de prière située au-dessus de nous.\n@c0@"
  it: "@a@b*: Quando scoprimmo i poteri di Maddalena, ne restammo talmente impressionati che la rinchiudemmo di sopra, nella stanza per le preghiere.\n@c0@"
