  it: "@aDrago di Zenithia@b%H0860%XHai ancora qualcosa da fare qui? Non c'è problema! Vai pure, e torna da me quando vorrai%YAvete ancora qualcosa da fare qui? Non c'è problema! Andate pure, e tornate da me quando vorrete%Z partire!\n@c0@"
