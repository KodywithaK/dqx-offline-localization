161:
  de: "@aZenithdrache@bNur durch Euch und Eure Familie konnte in der Welt wieder Frieden einkehren. Ich möchte Euch meine tiefste Dankbarkeit aussprechen.\n@c0@"
  en: "@aZenith Dragon@bIt is through the great efforts of you and your family that the world once more enjoys peace.\r\nI thank you from the bottom of my heart.\n@c0@"
  es: "@aDragón de Zenithia@bGracias a vuestros grandes esfuerzos y a los de vuestra familia, en el mundo vuelve a reinar la paz.\r\nOs lo agradezco desde lo más hondo.\n@c0@"
  fr: "@aDragon du Zénith@bC'est grâce à vos efforts, et à ceux de votre famille, que le monde peut à nouveau profiter\r\nde la paix. Je vous remercie du fond du cœur.\n@c0@"
  it: "@aDrago di Zenithia@bGrazie agli indicibili sforzi che tu e la tua famiglia avete compiuto, nel mondo è tornata la pace.\nTi ringrazio dal più profondo del cuore.\n@c0@"
  ja: "@a@b＊「伝説の勇者%a001240と\n\tその父　%a000090\n\tそして　その一族の者たちよ。\n@c0@"
162:
