  de: "@aZenithdrache@bVielleicht bin ich einfach nur zu lange ein Mensch gewesen, aber auf jeden Fall habe ich genug von diesem zeremoniellen Geschwafel!\n@c0@"
  en: "@aZenith Dragon@bMaybe it's because I was a human for such a\r\nlong time, but I'm tired of all that ceremonious\r\nwiffle-waffle!\n@c0@"
