  fr: "@a@b*ⓢ Je comprends... Vous avez pu rencontrer Magdalena, mais une fois seulement.\n@c0@"
  it: "@a@b*: E così %H0860%X%A0110%Xsei riuscito%Z%B0110%Xsei riuscita%Z%Y%R0000%Xsiete riuscite%Ysiete riusciti%Z%Z a incontrare Maddalena, anche se solo per una volta...\n@c0@"
