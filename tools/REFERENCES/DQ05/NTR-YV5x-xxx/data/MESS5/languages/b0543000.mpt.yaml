  it: "@aViola@bMagari sarà stato vero dieci anni fa, ma forse ora avranno disposto diversamente le slot machine...\n@c0@"
  ja: "@a@bデボラ「でも　１０年前の話なんでしょう？\n\t本当かどうか　あやしいものだわ。\n@c0@"
72:
  de: "@aGriselda@bDann lass es eben, wenn du's nicht kaufen willst. Ich kann's mir auch selbst kaufen...\n@c0@"
  en: "@aDebora@bDon't buy it if you don't want it.\nI'll probably buy it myself soon anyway.\n@c0@"
