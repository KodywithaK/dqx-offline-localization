0:
  de: "@aGriselda@bWieso eigenartig? Ich finde ihn interessant. Es gibt immer wieder neue Dinge zu entdecken.\n@c0@"
  en: "@aDebora@bIt's more interesting than strange.\nThere's always something different to see.\n@c0@"
  es: "@aStefania@bMás que extraño, es interesante.\nSempre hay alguna cosa diferente que ver.\n@c0@"
  fr: "@aPandora@bC'est plus intéressant qu'étrange. Il y a toujours quelque chose de nouveau à voir.\n@c0@"
  it: "@aViola@bIn effetti, il negozio è davvero curioso, con tutti gli oggetti particolari che sono in vendita lì.\n@c0@"
  ja: "@a@bデボラ「オラクル屋は\n\t変というより　面白い店という感じね。\n\t見ていて　あきないし。\n@c0@"
1:
  de: "@aGriselda@bDiesen Stab darfst du nie im Leben benutzen, hörst du, %a000090?\n@c0@"
  en: "@aDebora@bYou mustn't ever use that staff, %a000090,\ngot it?\n@c0@"
  es: "@aStefania@bNunca debes usar ese báculo, ¿capisci, %a000090?\n@c0@"
  fr: "@aPandora@bTu ne dois pas te servir de ce bâton, %a000090, Jamais. Comprisⓡ\n@c0@"
  it: "@aViola@bNon voglio che usi quella mazza, %a000090.\nMi sono spiegata?\n@c0@"
  ja: "@a@bデボラ「%a000090は　そんなつえを\n\t使ったりしちゃ　ダメよ。　いいわね？\n@c0@"
2:
  de: "@aGriselda@bEs mag ja ganz nett sein, eine Zeit lang einen Drachen als Diener zu haben.\n㈡\nAber es wäre doch ziemlich unpraktisch, wenn wir dich nicht zurückverwandeln könnten...\n@c0@"
  en: "@aDebora@bIt could be fun to have a dragon as a servant for a while, but it'd be quite an inconvenience if we couldn't turn you back.\n@c0@"
  es: "@aStefania@bSería divertente tener un dragón por sirviente un tiempo, ma sería muy molesto no poder devolverte tu forma.\n@c0@"
  fr: "@aPandora@bÇa pourrait être drôle d'avoir un dragon comme domestique pendant un temps, mais très ennuyeux\r\nsi on ne pouvait pas te rendre ta forme d'origine.\n@c0@"
  it: "@aViola@bMi piacerebbe essere servita e riverita da un drago, ma solo per un periodo limitato.\n㈡\nCosa farei se il mio fedele maritino si trasformasse definitivamente in una belva sputafuoco, eh?!\n@c0@"
  ja: "@a@bデボラ「竜をしもべにするのも　悪くないけど\n\tもし　そのまま　元にもどれなくなったら\n\t私が　いろいろと　困るものね。\n@c0@"
3:
  de: "@aGriselda@bWeißt du denn nicht, welche schrecklichen Umstände es mir bereiten würde, wenn wir dich nicht zurückverwandeln könnten? Ist dir das völlig egal?\n@c0@"
  en: "@aDebora@bAren't you the slightest bit concerned about the inconvenience it would cause me if we couldn't turn you back?\n@c0@"
  es: "@aStefania@b¿Es que non ti preocupa lo más mínimo las molestias que me causaría no poder devolverte a tu forma?\n@c0@"
  fr: "@aPandora@bTu ne penses donc pas une seule seconde à l'inconvénient que ce serait pour moi si on ne\npouvait pas te rendre ta forme d'origineⓡ\n@c0@"
  it: "@aViola@bCome no?! Ma ci pensi ai problemi che mi creeresti se ti trasformassi in drago definitivamente?! Voglio un uomo al mio fianco, non una bestia sputafuoco!\n@c0@"
  ja: "@a@bデボラ「もし　元にもどれなくなったら\n\t私が　困るとは　思わないの？\n@c0@"
4:
  de: "@aGriselda@bIch könnte dir niemals verzeihen, wenn du dich dermaßen aufführen würdest, %a000090. Aber das weißt du ja...\n@c0@"
  en: "@aDebora@bI know this goes without saying, but I'd never forgive you if you behaved like that, %a000090.\n@c0@"
  es: "@aStefania@bYa sé que no hace falta ni que lo diga, ma nunca te perdonaría que te comportases così, %a000090.\n@c0@"
  fr: "@aPandora@bJe sais que cela va de soi, mais je ne te le pardonnerais jamais si tu te comportais comme ça, %a000090.\n@c0@"
  it: "@aViola@bQuel tipo dev'essere la persona meno responsabile del mondo, %a000090.\nSe fosse mio marito, saprei io come metterlo in riga!\n@c0@"
  ja: "@a@bデボラ「言うまでも　ないことでしょうけど\n\t%a000090　あんたが　あんなマネをしたら\n\t私は　許さないわよ。\n@c0@"
5:
  de: "@aGriselda@bMan muss seinen Mann fest an die Kandare nehmen, damit er nicht aufmuckt. So wie ich.\n@c0@"
  en: "@aDebora@bYou have to keep a tight rein on your man if you want to control him properly. Just like I do with you.\n@c0@"
  es: "@aStefania@bA los hombres hay que atarlos corto para que no se te rebelen. Come hago io con te.\n@c0@"
  fr: "@aPandora@bIl faut tenir la bride bien serrée si on veut contrôler son mari correctement. Exactement ce que je fais avec toi.\n@c0@"
  it: "@aViola@bAh, quella donna ha sbagliato tutto con suo marito!\nSono certa che gli ha lasciato troppa libertà, e ora ne paga le conseguenze.\n㈡\nDovrebbe imparare da me come si tratta il proprio uomo!\n@c0@"
  ja: "@a@bデボラ「男をうまく　あやつるには\n\t女が　しっかりと　タヅナをとらないと\n\tダメなのよ。　私みたいに。\n@c0@"
6:
  de: "@aGriselda@bDa hat aber einer ein wenig zu tief ins Glas geschaut. Puh! Wie das stinkt! Aber seinen Schmerz kann ich schon verstehen...\n@c0@"
  en: "@aDebora@bHe's clearly been on the sauce a bit too much.\r\nUgh! You can smell it a mile off. Not that I don't sympathise with his predicament or anything.\n@c0@"
  es: "@aStefania@bEstá claro que se ha pasado un poco con la bottiglia.\n¡Agh! Se huele desde aquí. Aunque comprendo sus problemas.\n@c0@"
  fr: "@aPandora@bIl a clairement forcé sur la bibine. Beurk, ça se sent à des kilomètres. Ça ne veut pas dire pour autant que je ne compatis pas à sa situation, hein.\n@c0@"
  it: "@aViola@bMi spiace molto per lui, ma continuare a rimpiangere il passato non lo aiuterà di certo.\nAh, a volte la vita è così ingiusta...\n@c0@"
  ja: "@a@bデボラ「いくらなんでも　飲みすぎよね。\n\tこっちまで　お酒くさくなりそうだわ。\n\t気持ちは　わからなくはないけど。\n@c0@"
7:
  de: "@aGriselda@bDein trautes Heim ist natürlich überall dort, wo ich bin, das ist ja klar. Ich würde dich auch nicht rauswerfen, %a000090...\n@c0@"
  en: "@aDebora@bYour home's wherever I happen to be, right, %a000090? I won't throw you out, don't worry!\n@c0@"
  es: "@aStefania@bTu casa está donde a mí me apetezca estar, ¿capisci, %a000090? ¡No te echaré de casa, non ti preoccupare!\n@c0@"
  fr: "@aPandora@bTa maison, c'est là où je me trouve, n'est-ce pas %a000090ⓡ Mais je ne te jetterai pas dehors, va, n'aie pas peurⓠ\n@c0@"
  it: "@aViola@bLa tua casa è accanto a me, %a000090.\nSei un uomo fortunato, caro: fin quando mi starai vicino, non soffrirai mai di nostalgia...\n@c0@"
  ja: "@a@bデボラ「%a000090が　帰ってくるところは\n\t私のいる場所よ。\n\t逃げ出そうなんて　思わないことよ。\n@c0@"
8:
  de: "@aGriselda@bLos, schnell raus hier. Ich habe keine Lust, dass er aufwacht...\n@c0@"
  en: "@aDebora@bLet's hurry up and get out of here.\r\nIt'll be a pain if we wake him.\n@c0@"
  es: "@aStefania@bPronto, vámonos de aquí.\nSi lo despertamos será un tormento.\n@c0@"
  fr: "@aPandora@bDépêchons-nous de sortir d'ici. Ça va être pénible,\r\nsi on le réveille.\n@c0@"
  it: "@aViola@bSe parla tanto mentre dorme, figuriamoci quanto chiacchiera quand'è sveglio!\n@c0@"
  ja: "@a@bデボラ「そ～っと　はなれるのよ。\n\t起こすと　めんどうだし。\n@c0@"
9:
  de: "@aGriselda@bIch weiß, man sieht es ihm nicht an, aber Papa war in jungen Jahren auch ein Abenteurer. Unglaublich, oder?\n@c0@"
  en: "@aDebora@bYou may not think it to look at him now, but Papa was an explorer in his day, you know. Unbelievable, right?\n@c0@"
  es: "@aStefania@bAunque ahora no lo parezca, il mio papino fue explorador en sus tiempos. Incredibile, ¿vero?\n@c0@"
  fr: "@aPandora@bOn ne le dirait peut-être pas en le voyant aujourd'hui, mais papa était un explorateur en son temps, tu sais. C'est incroyable, heinⓡ\n@c0@"
  it: "@aViola@bAnche il mio paparino da giovane ha vissuto tantissime avventure in giro per il mondo. Mamma dice che era un gran bell'uomo, forte e muscoloso.\n㈡\nPoi è diventato un imprenditore di successo, e la sua vita s'è fatta sedentaria, così è ingrassato fino a trasformarsi nel tricheco che conosciamo...\n@c0@"
  ja: "@a@bデボラ「うちのパパも　今はあんなふうでも\n\t若い頃は　冒険家だったらしいわ。\n\tとても　信じられないでしょうけど。\n@c0@"
10:
  de: "@aGriselda@bEs ist modrig und dunkel und beklemmend... Könntest du also bitte mal zum Ende kommen, damit wir hier wegkönnen?\n@c0@"
  en: "@aDebora@bIt's mouldy and dark and claustrophobic...\r\nCan you hurry up and finish what you're doing\r\nhere so we can leave?\n@c0@"
  es: "@aStefania@bHay humedad y está oscuro y me está entrando claustrofobia... Acaba lo que tengas que hacer y larguémonos, ¿capisci?\n@c0@"
  fr: "@aPandora@bIl fait sombre, ça sent le moisi et on étouffe, ici...\nTu ne peux pas te dépêcher de terminer ce que\ntu as à faire pour qu'on puisse partirⓡ\n@c0@"
  it: "@aViola@bQuesto posto non mi piace per niente: è buio, umido e puzza come una stalla. %0%a000090, sbrigati a fare quello che devi e andiamo via.\n@c0@"
  ja: "@a@bデボラ「カビくさい…　暗い…　せまい……。\n\tねえ　%a000090\n\t早く用をすませて　ここを出るわよ。\n@c0@"
11:
  de: "@aGriselda@bEin Häschenmädel in einer Höhle? Das ist ja fast wie ein Fisch ohne Wasser!\n@c0@"
  en: "@aDebora@bA bunny girl stuck down in a cave?\nTalk about a fish out of water!\n@c0@"
  es: "@aStefania@bMa, ¿una conejita en una cueva?\nEs como un pez fora del acqua.\n@c0@"
  fr: "@aPandora@bUne serveuse coincée dans une grotteⓡ\nC'est un peu comme un poisson hors de l'eau, nonⓡ\n@c0@"
  it: "@aViola@bMa come fa quella tipa a lavorare in un postaccio del genere?! Io non resisterei qui più di cinque minuti nemmeno se mi dessero un milione di monete d'oro!\n㈡\nBeh, magari per un milione di monete d'oro il sacrificio potrei anche farlo...\n@c0@"
  ja: "@a@bデボラ「こんなところに　バニーとか……\n\t私には　理解できない光景だわ。\n@c0@"
12:
  de: "@aGriselda@bDas dürfte doch kein Problem für dich sein, oder, %a000090? Ich glaube an dich, jawohl!\n@c0@"
  en: "@aDebora@bYou'd easily manage that, right, %a000090?\nI believe in you, in spite of myself.\n@c0@"
  es: "@aStefania@bPara ti sería facile, ¿no, %a000090?\nAl final va a resultar que confío en te y todo.\n@c0@"
  fr: "@aPandora@bTu t'en sortirais très bien, non, %a000090ⓡ\nJe crois en toi, malgré moi.\n@c0@"
  it: "@aViola@bAnche tu saresti in grado di farlo, %a000090.\nNe sono assolutamente certa. Sarai anche un pappamolle, ma sei dannatamente in gamba!\n@c0@"
  ja: "@a@bデボラ「まあ　%a000090になら\n\tカンタンでしょう？　%a000090のウデは\n\t信用しているのよ　私なりに。\n@c0@"
13:
  de: "@aGriselda@bEndlich bekommst du mal ein wenig Anerkennung! Da war die Arbeit, die ich in dich investiert habe, doch nicht ganz umsonst...\n@c0@"
  en: "@aDebora@bYou're finally getting some recognition! At last, the fruits of my labour are beginning to show!\n@c0@"
  es: "@aStefania@b¡Por fin has obtenido el reconocimiento que mereces! ¡Il mio laboro no ha sido en vano!\n@c0@"
  fr: "@aPandora@bTu obtiens enfin un peu de reconnaissanceⓠ\nMon dur labeur commence à porter ses fruitsⓠ\n@c0@"
  it: "@aViola@bCerto che sai un mucchio di cose! E quelle che non sai le imparerai presto: con una guida come me, non potrai non diventare un pozzo di scienza!\n@c0@"
  ja: "@a@bデボラ「ようやく　%a000090のウデが\n\t認められるようになったわね。\n\tこの私の　教育の　たま物ね。\n@c0@"
14:
  de: "@aGriselda@bIch frage mich, ob auch wichtige Leute wie Könige hierhin kommen, wenn sie etwas verbrochen haben. Möchtest du es nicht mal ausprobieren?\n@c0@"
  en: "@aDebora@bI wonder if important people like kings end up in here when they do something wrong. Can you give it a try so we can find out?\n@c0@"
  es: "@aStefania@bMe pregunto si las personas importantes, como los reyes, que hacen algo mal acaban aquí. ¿Lo intentas y así lo averiguamos?\n@c0@"
  fr: "@aPandora@bJe me demande si les gens importants comme les roi finissent dans ce genre d'endroit quand ils font quelque chose de mal.\n㈡\nTu veux bien essayer, pour qu'on le sacheⓡ\n@c0@"
  it: "@aViola@bChissà quale pena viene inflitta a un sovrano che commette un reato... Senti, caro, ti andrebbe di fare qualcosa di male, così mi tolgo questa curiosità?\n@c0@"
  ja: "@a@bデボラ「国王のような　エライ人でも\n\t悪いことをしたら　牢に入れられるの？\n\t%a000090　ちょっと　ためしてみない？\n@c0@"
15:
  de: "@aGriselda@bIch hab doch nur Spaß gemacht! Stell dir mal vor, wie schlimm es für mich wäre, wenn du im Gefängnis sitzen würdest...\n@c0@"
  en: "@aDebora@bI was only joking! Think how annoying it would be for me if you ended up in prison.\n@c0@"
  es: "@aStefania@b¡Era una broma! Sería muy molesto per me que acabases en la cárcel.\n@c0@"
  fr: "@aPandora@bHé, je plaisantaisⓠ Tu imagines à quel point ce serait gênant pour moi si tu finissais en prisonⓡ\n@c0@"
  it: "@aViola@bIh ih ih! Guarda che stavo scherzando!\nPerò sono contenta di aver constatato che la tua devozione per me è totale! Sei proprio un tesoro!\n@c0@"
  ja: "@a@bデボラ「……じょうだんよ。\n\tあんたが　牢屋に入ったりしたら\n\t私に　迷惑がかかるじゃない。\n@c0@"
16:
  de: "@aGriselda@bDu würdest also nichts Schlimmes tun, auch wenn ich es dir befehle? Typisch! Warum bist du nur immer so brav?!\n@c0@"
  en: "@aDebora@bSo you wouldn't do something bad even if I ordered you to? Typical! You're such a good boy, aren't you?\n@c0@"
  es: "@aStefania@b¿Así que no harías nada malo aunque yo te lo ordenase? ¡Ja, claro! Eres un ragazzo buono, ¿vero?\n@c0@"
  fr: "@aPandora@bAlors tu ne ferais rien de mal, même si je t'en donnais l'ordreⓡ C'est tout toi, çaⓠ Tu es un si gentil garçon, heinⓡ\n@c0@"
  it: "@aViola@bCerto che no! Stavo solo scherzando!\nLo sai che non ti chiederei mai di fare qualcosa di sbagliato...\n@c0@"
  ja: "@a@bデボラ「ふ～ん　いくら　私の命令でも\n\t悪いことは　したくないのね。\n\tまあ　マジメな　あんたらしいわ。\n@c0@"
17:
  de: "@aGriselda@bDie Göttin allein weiß, was aus ihm werden wird. Aber ich könnte meiner Fantasie ja mal freien Lauf lassen...\n@c0@"
  en: "@aDebora@bGoddess only knows what'll become of him.\r\nI can hazard a guess, mind you.\n@c0@"
  es: "@aStefania@bSolo la Diosa sabe lo que será de él.\nMa a mí se me ocurren accidentes que podría sufrir, ¿capisci?\n@c0@"
  fr: "@aPandora@bLa Déesse seule sait ce qu'il adviendra de lui.\r\nMais j'ai bien une petite idée, tu vois.\n@c0@"
  it: "@aViola@bChissà cosa farà adesso...\nUhm, forse avremmo dovuto chiedercelo prima di liberarlo...\n@c0@"
  ja: "@a@bデボラ「あとは　神のみぞ知る…　ね。\n\tなんとなく　どうなるのかは\n\t想像が　つくけど。\n@c0@"
18:
  de: "@aGriselda@bIch kann nicht glauben, dass du ihn freigelassen hast! Du bist viel zu gutherzig, weißt du.\n@c0@"
  en: "@aDebora@bI can't believe you let him go!\r\nYou're far too soft, you really are.\n@c0@"
  es: "@aStefania@b¡Non posso credere que lo hayas soltado!\nEres un blandengue, eso es lo que eres.\n@c0@"
  fr: "@aPandora@bJe n'arrive pas à croire que tu l'aies laissé partirⓠ\nTu es bien trop coulant, sincèrement.\n@c0@"
  it: "@aViola@bE così l'hai lasciato andare, eh?\nMah... Speriamo di non doverci pentire di questo gesto...\n@c0@"
  ja: "@a@bデボラ「あの男を　逃がすだなんて……\n\tあんたって　本当に　甘いわね。\n@c0@"
19:
  de: "@aGriselda@bAber egal. Allerdings glaube ich, dass er im Gefängnis besser dran wäre. Wer weiß, was jetzt mit ihm geschieht...\n@c0@"
  en: "@aDebora@bNever mind. I'm sure he'd actually be safer in prison. It's up to the Goddess what becomes of him now.\n@c0@"
  es: "@aStefania@bNon ti preoccupare. Seguro que, en realidad, estaría más a salvo en la cárcel. Solo la Diosa sabe lo que será de él ahora, los accidentes pasan.\n@c0@"
  fr: "@aPandora@bPeu importe. Je suis convaincue qu'il serait pourtant plus en sécurité dans une prison. La Déesse seule sait ce qu'il adviendra de lui, désormais.\n@c0@"
  it: "@aViola@bTuttavia, non sono certa che gli abbiamo fatto un favore a liberarlo: con l'aria che tira di questi tempi, sarebbe stato più al sicuro in cella...\n@c0@"
  ja: "@a@bデボラ「……な～んて　ウソウソ。\n\t今は　牢の中にいたほうが　絶対安全だし。\n\tあとは　神さまにまかせる　ってことね。\n@c0@"
20:
  de: "@aGriselda@bDas war vielleicht vor zehn Jahren so, aber heute...?\n@c0@"
  en: "@aDebora@bThat may have been the case ten years ago, but I doubt it's still true now.\n@c0@"
  es: "@aStefania@bPuede que fuese così hace dieci anni, ma non credo que ahora sea lo mismo.\n@c0@"
  fr: "@aPandora@bC'était peut-être vrai il y a dix ans, mais ça m'étonnerait que ce soit encore le cas aujourd'hui.\n@c0@"
  it: "@aViola@bMagari sarà stato vero dieci anni fa, ma forse ora avranno disposto diversamente le slot machine...\n@c0@"
  ja: "@a@bデボラ「でも　１０年前の話なんでしょう？\n\t本当かどうか　あやしいものだわ。\n@c0@"
21:
  de: "@aGriselda@bKasinos sind lustig, das stimmt, aber ich glaube kaum, dass ich jemals dem Spielrausch verfallen werde. Wahrscheinlich weil ich sowieso genug Geld habe...\n@c0@"
  en: "@aDebora@bCasinos are fun, granted, but I don't think I'd ever get that excited about gambling. Maybe it's because\r\nI have enough money already.\n@c0@"
  es: "@aStefania@bLos casinos son divertenti, pero no creo que pudiese emocionarme nunca così con el juego. Quizá sea porque ya tengo suficiente dinero.\n@c0@"
  fr: "@aPandora@bC'est vrai qu'on s'amuse dans les casinos, mais je ne crois pas être capable de me mettre dans un état pareil pour un pari.\n㈡\nC'est peut-ête parce que j'ai déjà assez d'argent.\n@c0@"
  it: "@aViola@bMi diverte andare al casinò e vedere tanta gente perdere il proprio denaro...\n@c0@"
  ja: "@a@bデボラ「カジノって　楽しいとは思うけど\n\tそれほど　熱中できそうにないわ。\n\tお金に　困っていないからかしら。\n@c0@"
22:
  de: "@aGriselda@bKasinos sollen einfach nur Spaß machen. Wenn man erst mal anfängt, über Geld nachzudenken, ist Schluss mit Lustig.\n@c0@"
  en: "@aDebora@bCasinos are just fun and games. If you start to obsess over money, that's when the fun ends.\n@c0@"
  es: "@aStefania@bLos casinos son divertimento y giocco. Si te obsesionas con el dinero, se acabó el divertimento. \n@c0@"
  fr: "@aPandora@bLes casinos, ça n'est fait que pour jouer et se divertir. Si on commence à ne plus penser qu'à l'argent, c'est la fin du plaisir.\n@c0@"
  it: "@aViola@bIo non ho mai bisogno di soldi, caro.\nQuando mi serve del denaro lo chiedo a te...\n@c0@"
  ja: "@a@bデボラ「あくまで　カジノは　遊びだものね。\n\tお金になってしまったら　もう\n\t遊びじゃなくなるわ。\n@c0@"
23:
  de: "@aGriselda@bWenn viel Geld im Spiel ist, sollte man immer die Ruhe bewahren.\n@c0@"
  en: "@aDebora@bIt's important to be calm when you're betting lots\r\nof money.\n@c0@"
  es: "@aStefania@bCuando apuestas molto oro, es importante mantener la calma.\n@c0@"
  fr: "@aPandora@bC'est important de rester calme quand on parie beaucoup d'argent.\n@c0@"
  it: "@aViola@bMa no!\nQuel tipo non vincerà mai, se si lascia prendere dalla foga del gioco in quel modo!\n@c0@"
  ja: "@a@bデボラ「大きな賭けをする時は\n\t落ち着いていることが　大切なのよ。\n@c0@"
24:
  de: "@aGriselda@bDieser Kerl wird garantiert verlieren, wenn er so weitermacht. Aber das kann mir ja eigentlich egal sein... Ist ja nicht mein Geld, nicht wahr?\n@c0@"
  en: "@aDebora@bThat man's sure to lose if he's in that sort of state. Still, as long as it's not me losing, why should I care?\n@c0@"
  es: "@aStefania@bCon ese estado de nervios, seguro que ese hombre pierde hasta la camicia. Ma ¿qué me importa a mí? Non soy yo la que pierde.\n@c0@"
  fr: "@aPandora@bEn étant dans cet état, ce type est sûr de perdre. Enfin, tant que ce n'est pas moi, qui perds,\r\nje ne vois pas pourquoi je m'en ferais.\n@c0@"
  it: "@aViola@bComunque, per me può perdere quanto gli pare: i soldi sono suoi, mica miei!\n@c0@"
  ja: "@a@bデボラ「あの男は　失敗するでしょうね……\n\tまあ　私が損をするわけじゃないから\n\tどうでもいいけど。\n@c0@"
25:
  de: "@aGriselda@bWenn man sich so von dem Spiel mitreißen lässt, fängt es an, gefährlich zu werden.\n@c0@"
  en: "@aDebora@bGetting carried away like that is when it starts to get dangerous.\n@c0@"
  es: "@aStefania@bLa cosa se pone pericolosa si te dejas llevar de questa forma.\n@c0@"
  fr: "@aPandora@bC'est quand on se laisse emporter comme ça\r\nque les choses deviennent dangereuses.\n@c0@"
  it: "@aViola@bNo, i giochi non sono truccati.\nÈ lei che è sfortunata, o forse non sa giocare...\nO magari entrambe le cose!\n@c0@"
  ja: "@a@bデボラ「こういうふうに\n\t調子に乗りすぎた時が\n\tいちばん　あぶないのよね。\n@c0@"
26:
  de: "@aGriselda@bDie Vorstellung ist gar nicht so übel. Aber mir würde das Kleid natürlich viel besser stehen.\n@c0@"
  en: "@aDebora@bI suppose it's not a bad performance. The dress would obviously suit me much better, though.\n@c0@"
  es: "@aStefania@bNo es un mal espectáculo. Ma, obviamente, el vestido me quedaría mucho megliore a mí.\n@c0@"
  fr: "@aPandora@bÇa n'est pas mal, comme représentation. La robe m'irait quand même bien mieux qu'à elle, évidemment.\n@c0@"
  it: "@aViola@bLo spettacolo non è male, ma quei costumi farebbero tutto un altro effetto se li indossassi io...\n@c0@"
  ja: "@a@bデボラ「まあ…　悪くはないわね。\n\tでも　ああいうドレスは\n\t私が着たほうが　似合うと思うわ。\n@c0@"
27:
  de: "@aGriselda@bRecht hat er. Sobald man ängstlich wird, verliert man seinen Schwung. Er ist klüger, als er aussieht.\n@c0@"
  en: "@aDebora@bHe's right. If you let the fear get to you, it really puts you off your stride. He's wiser than he looks.\n@c0@"
  es: "@aStefania@b¡È vero! Si dejas que el miedo te invada, se acabó la buena racha. Es más listo de lo que parece.\n@c0@"
  fr: "@aPandora@bIl a raison. Si on commence à se laisser gagner\npar la peur, ça éloigne définitivement la chance.\nIl est plus sage qu'il n'en a l'air.\n@c0@"
  it: "@aViola@bVorrebbe una ricompensa per aver detto una cosa tanto ovvia?!\nCerta gente è proprio senza vergogna!\n@c0@"
  ja: "@a@bデボラ「そうね。　弱気になったら\n\tツキは逃げていくものだから。\n\tなかなかいいことを言うわね　この男。\n@c0@"
28:
  de: "@aGriselda@bJeder ist seines Glückes Schmied. Man braucht nur ein wenig Geduld, dann kann man das Blatt zu seinen Gunsten wenden.\n@c0@"
  en: "@aDebora@bYou make your own luck. You just need a bit of patience and courage and you can turn the tide in your favour.\n@c0@"
  es: "@aStefania@bLa suerte se busca. Solo hay que tener un po' de paciencia y las cosas pueden volverse a il tuo favore.\n@c0@"
  fr: "@aPandora@bLa chance, il faut se la créer. Il suffit d'un peu de patience et de courage pour retourner les choses\nen sa faveur.\n@c0@"
  it: "@aViola@bQuel tipo dev'essere matto. Andiamo via, caro.\nNon voglio perdere nemmeno un altro secondo a sentire le sue assurdità.\n@c0@"
  ja: "@a@bデボラ「ツキは　自分で呼び込むものよ。\n\tガマンしていれば　そのうち\n\t流れは　こっちにくるわ。\n@c0@"
29:
  de: "@aGriselda@bDu hättest so enden können wie er, wenn du nicht das Glück gehabt hättest, mich zu heiraten. Ich hoffe, du bist dankbar.\n@c0@"
  en: "@aDebora@bYou could've ended up like him if you hadn't had the good fortune of marrying me. I hope you're grateful.\n@c0@"
  es: "@aStefania@bSi no hubieses tenido la buona fortuna de casarte con me, quizá habrías acabado igual. Ya me puedes dar las gracias.\n@c0@"
  fr: "@aPandora@bTu aurais pu finir comme lui si tu n'avais pas eu la chance de m'épouser. J'espère que tu m'en es reconnaissant.\n@c0@"
  it: "@aViola@bIo me la sto spassando oltre ogni limite da quando ho un fedele maritino che mi serve e mi riverisce come una regina...\n@c0@"
  ja: "@a@bデボラ「私と　結婚していなかったら\n\t%a000090も　この人みたく投げやりに\n\tなっていたかもね。　感謝しなさい。\n@c0@"
30:
  de: "@aGriselda@bMann, was gibt es viele hässliche Leute! Sicher wäre es lustig, eine Weile die Leute zu beobachten. Hier treibt sich wirklich alles mögliche Volk herum.\n@c0@"
  en: "@aDebora@bThere are certainly plenty of uglies!\r\nI suppose it could be quite fun to people-watch.\r\nThe customers here are such a mixed bag.\n@c0@"
  es: "@aStefania@b¡Veramente hay gente regulera!\nSicuro que se lo pasa bien mirando a la gente.\nHay clientes de tutta condición.\n@c0@"
  fr: "@aPandora@bIl y a effectivement pas mal de truandsⓠ Ça doit être assez amusant de regarder les gens. La clientèle d'ici est plutôt mélangée.\n@c0@"
  it: "@aViola@bIo sono buona e bella, ma quando qualcuno mi fa arrabbiare divento MOLTO cattiva. Hai capito, %a000090? A buon intenditor, poche parole...\n@c0@"
  ja: "@a@bデボラ「確かに　見ているだけで\n\tあきない連中が　そろっているものね。\n\tある意味　スリルがあって　面白いわ。\n@c0@"
31:
  de: "@aNera@bWie schrecklich, jetzt setzen die Leute auch schon Geld auf %a001240! Das ist ja widerlich.\n@c0@"
  en: "@aNera@bHow terrible that people are placing bets about %a001240's existence! It's just so distasteful.\n@c0@"
  es: "@aNera@b¡Es terribile que la gente apueste por la existencia de %a001240! Non mi piace niente.\n@c0@"
  fr: "@aNera@bC'est horrible que des gens prennent des paris\nsur l'existence %G1240%Xd'%Yde %Z%a001240ⓠ\nC'est vraiment répugnant.\n@c0@"
  it: "@aNera@bCerto che è davvero di pessimo gusto scommettere sull'esistenza di %a001240!\nTrovo la cosa assolutamente ripugnante!\n@c0@"
  ja: "@a@bフローラ「私たちの%a001240が　かけごとに\n\t使われるだなんて……！\n\t知らないこととはいえ　許せませんわ……！\n@c0@"
32:
  de: "@aGriselda@bWie kann er es wagen, Geld auf meinen Sohn zu setzen! Und Unwissen ist keine Entschuldigung!\n@c0@"
  en: "@aDebora@bHow dare he try to make money by betting on my son! Ignorance is no excuse!\n@c0@"
  es: "@aStefania@b¡¿Cómo se atreve a apostar sobre il mio bambino?! ¡La ignorancia no es excusa!\n@c0@"
  fr: "@aPandora@bComment ose-t-il se faire de l'argent en pariant sur mon filsⓡⓐ L'ignorance n'est pas une excuseⓠ\n@c0@"
  it: "@aViola@bCome osa scommettere su mio figlio, eh?!\n㈡\nSpero che avrà almeno il buon gusto di riconoscermi una percentuale sulla vincita, quando la incasserà.\n@c0@"
  ja: "@a@bデボラ「私の%a001240を　かけごとの\n\tネタにするだなんて……\n\t知らないこととはいえ　アタマにくるわ。\n@c0@"
33:
  de: "@aGriselda@bIch würde eine viel bessere Figur auf der Bühne abgeben. Aber das wusstest du ja bereits, nicht wahr, %a000090?\n@c0@"
  en: "@aDebora@bI'm sure I'd give a much better performance.\nBut of course that goes without saying, doesn't it, %a000090.\n@c0@"
  es: "@aStefania@bSeguro que yo lo haría molto meglio.\nMa eso no hay ni que decirlo, ¿verdad, %a000090.\n@c0@"
  fr: "@aPandora@bJe suis sûre que je ferais mieux qu'elle. Mais cela va sans dire, n'est-ce pas, %a000090ⓡ\n@c0@"
  it: "@aViola@b%0%a000090, non mi dirai che sei attratto da quell'attricetta da strapazzo, vero?! Io sono molto più brava di lei, e infinitamente più bella!\n@c0@"
  ja: "@a@bデボラ「舞台に上がるなんて\n\t私にこそ　ふさわしいことよ。\n\tさすがに%a000090は　わかってるわね。\n@c0@"
34:
  de: "@aGriselda@bIch weiß, dass es nur Theater ist, aber diese Stiefmutter ist wirklich hundsgemein!\n@c0@"
  en: "@aDebora@bI know it's just a play, but that mother character really is a nasty piece of work.\n@c0@"
  es: "@aStefania@bYa sé que es solo teatro, pero el personaggio de la madrastra es un verdadero mal bicho.\n@c0@"
  fr: "@aPandora@bJe sais que ce n'est qu'une pièce, mais le personnage de la mère est vraiment désagréable au possible.\n@c0@"
  it: "@aViola@bSe andassi al Gran Ballo, il principe non avrebbe occhi che per me! Su, caro, non essere geloso: sto parlando per ipotesi...\n@c0@"
  ja: "@a@bデボラ「ただのお芝居だって\n\tわかってはいるけど\n\tこの母親　本当に　イヤな女ね。\n@c0@"
35:
  de: "@aGriselda@bDu würdest mich wahrscheinlich auch mal gerne in einem schicken Kleid sehen, was?\n㈡\nWir müssen unbedingt einen Ball veranstalten, wenn das hier alles vorbei ist.\n@c0@"
  en: "@aDebora@bYou'd probably like to see me in a posh dress, wouldn't you? We'll have to throw a party at the castle as soon as all this is over.\n@c0@"
  es: "@aStefania@bTe gustaría verme con uno de esos vestidos elegantes, ¿vero? Cuando esto termine tendremos que celebrar una fiesta en el castello.\n@c0@"
  fr: "@aPandora@bJe suis sûre que tu aimerais me voir dans une robe élégante, nonⓡ Il faudra qu'on organise une fête au château dès que tout ça sera fini.\n@c0@"
  it: "@aViola@bNon ho bisogno di abiti eleganti per mettere in risalto la mia bellezza.\n㈡\nTuttavia, se tu volessi comprarmi una ventina di vestiti, non ti negherò certo il piacere di farmi qualche regalo!\n@c0@"
  ja: "@a@bデボラ「私のドレス姿　見たいでしょう？\n\t早く　全てを終わらせて\n\tお城で　パーティを開きましょうね。\n@c0@"
36:
  de: "@aGriselda@bWenn du ihn öffnen willst, dann tu's doch einfach. Mich interessiert das nicht.\n@c0@"
  en: "@aDebora@bIf you want to open it, just open it.\nI'm not interested, personally.\n@c0@"
  es: "@aStefania@bSi quieres abrirlos, ábrelos. Ma que parezca un accidente.\n@c0@"
  fr: "@aPandora@bSi tu veux l'ouvrir, ouvre-le, ce vestiaire. Personnellement, ça ne m'intéresse pas.\n@c0@"
  it: "@aViola@bMi piace il tono di quella ragazza!\nHa l'aria di chi non si fa mettere i piedi in testa da nessuno! Brava! Così si fa!\n@c0@"
  ja: "@a@bデボラ「開けたいなら　開ければ？\n\t私は　別に興味ないけど。\n@c0@"
37:
  de: "@aGriselda@bIch frage mich, wo die Darsteller herkommen. Mich wundert's, dass sie überhaupt heil hier angekommen sind.\n@c0@"
  en: "@aDebora@bI wonder where the performers came from.\nThey're lucky they managed to make it here safely.\n@c0@"
  es: "@aStefania@bMe pregunto de dove han venido los artistas.\nHa sido buona fortuna que llegasen aquí a salvo.\n@c0@"
  fr: "@aPandora@bJe me demande d'où viennent les acteurs.\r\nIls ont de la chance d'avoir réussi à arriver\r\njusqu'ici sains et saufs.\n@c0@"
  it: "@aViola@bChissà da dove viene la compagnia teatrale...\n㈡\nA ogni modo, direi che gli attori sono stati fortunati ad arrivare fin qui sani e salvi, visti i mostri che ci sono in giro di questi tempi!\n@c0@"
  ja: "@a@bデボラ「あの劇団は　どこの町から\n\tやってきたのかしら？\n\tよく無事に　たどりつけたわよね。\n@c0@"
38:
  de: "@aGriselda@bHier haben wir nichts verloren, hörst du? Los, gehen wir.\n@c0@"
  en: "@aDebora@bThere's nothing we need to do here, right?\nThen let's hurry up and leave.\n@c0@"
  es: "@aStefania@bNo tenemos niente que hacer aquí, ¿vero? Entonces vámonos, deprisa.\n@c0@"
  fr: "@aPandora@bNous n'avons rien à faire ici, ou je me trompeⓡ\nAlors dépêchons-nous de partir.\n@c0@"
  it: "@aViola@bSe non abbiamo altro da fare qui, suggerisco di andarcene.\nAnzi, non te lo suggerisco. Te lo ordino.\n@c0@"
  ja: "@a@bデボラ「こんなところに　用はないわよね？\n\tだったら　さっさと　外に出るわよ。\n@c0@"
39:
  de: "@aGriselda@bWas für lustige bunte Schleime! Es wäre bestimmt lustig, sich ein paar davon als Haustiere zu halten.\n@c0@"
  en: "@aDebora@bWhat funny-coloured slimes! It could be quite fun to keep a few as pets.\n@c0@"
  es: "@aStefania@b¡Qué colores tan divertenti tienen estos limos! Sería estupendo tener unos cuantos de mascota.\n@c0@"
  fr: "@aPandora@bIls ont de drôles de couleurs, ces gluantsⓠ\nÇa serait rigolo d'en garder quelques-uns\ncomme animaux de compagnie.\n@c0@"
  it: "@aViola@bMa che belli questi Slime colorati!\nCaro, devi assolutamente procurarmene qualcuno!\nLi voglio in tinta con le mie borsette!\n@c0@"
  ja: "@a@bデボラ「めずらしい色の　スライムたちね。\n\tああいう子たちを　ペットにできたら\n\t面白そうだわ。\n@c0@"
40:
  de: "@aGriselda@bEr hat sich da ein bisschen reingesteigert, oder? Obwohl es ganz witzig ist, ihm zuzusehen.\n@c0@"
  en: "@aDebora@bHe's a little bit too carried away with it all, isn't he? It's quite funny to watch him, though.\n@c0@"
  es: "@aStefania@bSe emociona un poco demasiado, ¿no? Aunque es divertente mirarlo.\n@c0@"
  fr: "@aPandora@bIl se laisse un peu emporter avec tout ça, nonⓡ Remarque, c'est assez rigolo de le regarder.\n@c0@"
  it: "@aViola@bTu, invece, sei assolutamente prevedibile: ti comporti sempre come io ti ordino di fare.\n@c0@"
  ja: "@a@bデボラ「あの　おじいさん\n\tスライムレースに　ハマりすぎね。\n\t見ているこっちは　面白いけど。\n@c0@"
41:
  de: "@aGriselda@bManchmal frage ich mich, ob so ein Schleim nicht ein prima Kopfkissen abgeben würde. Aber schleimig sind sie ja trotzdem...\n@c0@"
  en: "@aDebora@bSlimes seem like they'd make quite comfy bedfellows, but they're probably a bit on the...slimy side.\n@c0@"
  es: "@aStefania@bLos limos parecen ser unos compañeros muy mulliditos, aunque un po'... limosos.\n@c0@"
  fr: "@aPandora@bLes gluants donnent l'impression de pouvoir faire des coussins de lit très confortables, mais ils sont sans doute un peu trop... gluants.\n@c0@"
  it: "@aViola@bGli Slime sono morbidi e soffici.\nSe non fossero tanto viscidi, sarebbero dei materassi perfetti!\n@c0@"
  ja: "@a@bデボラ「スライムと　いっしょに寝たら\n\tぷにぷにしていて　気持ち良さそうだけど\n\t実は　べとべとしているのよね……。\n@c0@"
42:
  de: "@aGriselda@bMir ist nie aufgefallen, dass Monster das Wetter auch so sehr beschäftigt wie uns Menschen.\n@c0@"
  en: "@aDebora@bI never realised monsters were as obsessed with the weather as us humans.\n@c0@"
  es: "@aStefania@bNo sabía que los mostri estuvieran tan obsesionados con el tiempo como las personas.\n@c0@"
  fr: "@aPandora@bJe n'avais jamais réalisé que les monstres étaient aussi obsédés par le temps qu'il fait que nous, les humains.\n@c0@"
  it: "@aViola@bE così anche i mostri si interessano di previsioni del tempo... Chissà se sono più o meno bravi dei meteorologi umani...\n@c0@"
  ja: "@a@bデボラ「魔物も　人間みたいに\n\t天気を　気にするものなのね。\n@c0@"
43:
  de: "@aGriselda@bIch bin beeindruckt, dass sie es geschafft haben, so ein großes T&T-Brett zu bauen.\n@c0@"
  en: "@aDebora@bI'm impressed that they managed to build a T 'n' T board this big.\n@c0@"
  es: "@aStefania@bVeramente, impresiona que hayan podido construir un tablero de T y T tan grande.\n@c0@"
  fr: "@aPandora@bJe suis impressionnée que quelqu'un ait réussi à construire un jeu de TNT aussi grand.\n@c0@"
  it: "@aViola@bQuesta Tavola della Sorte è impressionante...\nMa l'hai vista?!\nÈ gigantesca!\n@c0@"
  ja: "@a@bデボラ「よく　こんな大きなすごろく場を\n\tつくったものよね。　感心するわ。\n@c0@"
44:
  de: "@aGriselda@bGewinnen wäre so einfach, wenn der Würfel nur die richtigen Zahlen anzeigen würde. Ich will aber gewinnen!\n@c0@"
  en: "@aDebora@bIt'd be so easy to win if only you could roll what you wanted. I really love winning!\n@c0@"
  es: "@aStefania@bSería molto facile ganare si pudieras sacar lo que quisieses en el dado. ¡Me encanta ganare!\n@c0@"
  fr: "@aPandora@bÇa serait tellement facile de gagner si on pouvait obtenir le chiffre qu'on veut au lancer. J'adore vraiment gagnerⓠ\n@c0@"
  it: "@aViola@bMi piacerebbe ottenere sempre il numero desiderato quando lancio il dado, così non avrei problemi a raggiungere il traguardo.\n@c0@"
  ja: "@a@bデボラ「サイコロの目を　思い通りにできれば\n\tかんたんに　勝てるのに。\n\t私は　勝つことが　大好きなの。\n@c0@"
45:
  de: "@aGriselda@bDer braucht gar nicht so zu feixen ⓚⓛ ich wette, der ist auch schon mal runtergefallen.\n@c0@"
  en: "@aDebora@bHe said ⓗtooⓘ, which implies he fell off as well,\nso he's hardly in a position to be laughing at us.\n@c0@"
  es: "@aStefania@bHa dicho ⓕtambiénⓖ, ¿vero? Entonces no sé de qué se ríe.\n@c0@"
  fr: "@aPandora@bIl a dit ⓥvous aussiⓦ, ce qui implique qu'il est également tombé. Il est plutôt mal placé pour se moquer de nous, dans ce cas.\n@c0@"
  it: "@aViola@bSe quell'idiota si permette di ridere un'altra volta delle nostre disgrazie, gli strappo i denti e ci faccio una collanina!\n@c0@"
  ja: "@a@bデボラ「あなたも…　ってことは\n\t自分だって　落ちたってことじゃないの？\n\t人のことを　笑える立場なのかしら。\n@c0@"
46:
  de: "@aGriselda@bIch kann nichts Lustiges daran finden, dreißig Jahre lang über das Unglück anderer zu lachen. Das ist widerlich, wenn du mich fragst.\n@c0@"
  en: "@aDebora@bThere's nothing funny about spending thirty years laughing at other people's misfortune.\r\nIt's downright creepy, if you ask me.\n@c0@"
  es: "@aStefania@bNo sé qué tiene de divertente pasarse treinta años riéndose de las desgracias de otros.\nMás bien me parece repulsivo.\n@c0@"
  fr: "@aPandora@bIl n'y a vraiment rien d'amusant à passer trente ans de sa vie à rire de la malchance des autres. Ça fait même froid dans le dos, si tu veux mon avis.\n@c0@"
  it: "@aViola@bQuindi sono trent'anni che si diverte a veder cadere gli altri giocatori?\nQuello è tutto matto!\n@c0@"
  ja: "@a@bデボラ「３０年も　ずっと\n\t人が落ちてくるのを　楽しんでいるだなんて\n\tシュミが悪いというより　怖いわね。\n@c0@"
47:
  de: "@aGriselda@bHier tobt das Leben! Hier geht erst abends so richtig die Post ab.\n@c0@"
  en: "@aDebora@bIt's very lively. This place really comes into its own at night.\n@c0@"
  es: "@aStefania@bEstá veramente animado. Este lugar no es el mismo de notte.\n@c0@"
  fr: "@aPandora@bIl y a une sacrée ambiance. C'est vraiment de nuit que cet endroit donne sa pleine mesure.\n@c0@"
  it: "@aViola@bDi notte questo posto è ancora più vivace.\nSi respira proprio una bella atmosfera!\n@c0@"
  ja: "@a@bデボラ「ずいぶんと　にぎやかね。\n\t夜こそが　この町の\n\t本当の顔…　と　いうことかしら。\n@c0@"
48:
  de: "@aGriselda@bDie Leute hier wollen ihre Sorgen vergessen und sich amüsieren. Nicht, dass ich's ihnen verdenken könnte...\n@c0@"
  en: "@aDebora@bThe people here just want to forget all their troubles and let their hair down. Not that I don't sympathise, of course.\n@c0@"
  es: "@aStefania@bEstas personas no quieren más que olvidar sus problemas y divertirse. Y yo lo comprendo, veramente.\n@c0@"
  fr: "@aPandora@bLes gens d'ici ont vraiment envie d'oublier tous leurs soucis et de se détendre. Je peux comprendre ça, bien sûr.\n@c0@"
  it: "@aViola@bQui tutti vogliono divertirsi.\nBeati loro che possono farlo...\n@c0@"
  ja: "@a@bデボラ「イヤなことは　全部忘れて\n\tパーッと遊びたい　って　連中ばかりね。\n\t気持ちは　わからなくもないけど。\n@c0@"
49:
  de: "@aGriselda@bGegen ein wenig Spaß habe ich ja nichts einzuwenden, %a000090, aber lange aufbleiben möchte ich auf keinen Fall.\n㈡\nWir müssen morgen früh raus.\n@c0@"
  en: "@aDebora@bI don't mind having a bit of fun, %a000090, but I refuse to stay up late. We've got an early start in the morning.\n@c0@"
  es: "@aStefania@bNo me importa divertirme un po', %a000090, ma no quiero acostarme tarde. Mañana nos levantamos temprano.\n@c0@"
