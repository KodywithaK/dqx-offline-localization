  fr: "@aPandora@bNe l'achète pas si tu n'en veux pas.\r\nJe l'achèterai sans doute bientôt pour moi.\n@c0@"
  it: "@aViola@bSe l'oggetto non ti convince, fai bene a non comprarlo. Così risparmierai un po' di soldi e potrai comprarmi qualche bel vestitino...\n@c0@"
  ja: "@a@bデボラ「買いたくないのなら　好きにすれば？\n\t私なら　今のうちに　買っておくけど。\n@c0@"
73:
  de: "@aGriselda@bWir haben gutes Geld dafür bezahlt, also können wir es uns genauso gut ansehen. Mich interessiert es nicht unbedingt, aber ich warte, solange du guckst.\n@c0@"
  en: "@aDebora@bWe did pay good money for it, so we should probably have a look. I'm not interested myself, but I'll hang around while you look.\n@c0@"
  es: "@aStefania@bPagamos molto por él, de modo que deberíamos echar un vistazo. A mí no me interesa, ma me quedaré mientras miras.\n@c0@"
  fr: "@aPandora@bOn l'a payé assez cher, alors on devrait peut-être\ny jeter un œil. Moi, ça ne m'intéresse pas trop, mais\nje vais rester à côté pendant que tu le regardes.\n@c0@"
  it: "@aViola@bSono curiosa di sapere di cosa tratta, ma ora non ho voglia di leggere...\n㈡\nFammi un favore, %a000090: guarda un po' di che parla, poi mi farai un riassuntino veloce e dettagliato. Intesi?\n@c0@"
  ja: "@a@bデボラ「わざわざお金を出して買ったんでしょ？\n\tせっかくだし　見てみれば？\n\t私は　興味ないけど　横にいてあげるから。\n@c0@"
74:
  de: "@aGriselda@bIst das zu fassen ⓚⓛ ein König, der noch nicht mal tausend Goldstücke besitzt! Das darf nie jemand erfahren, hörst du?\n@c0@"
  en: "@aDebora@bWho'd have thought there'd ever be a king without even a thousand gold coins to his name? We must never tell anyone about this, do you hear?\n@c0@"
  es: "@aStefania@b¿Quién iba a pensar que un rey no tendría ni mille míseras monete de oro? No se lo digas nunca a nessuno, ¿capisci?\n@c0@"
  fr: "@aPandora@bQui pourrait croire qu'il existe un roi ne possédant même pas 1000 pièces d'or à luiⓡ On ne devra\njamais dire ça à personne, tu m'entendsⓡ\n@c0@"
  it: "@aViola@bNon s'era mai sentito di un re che non ha nemmeno mille monete d'oro in tasca!\n㈡\nCerchiamo di non farlo sapere in giro, altrimenti rideranno di noi da qui all'eternità!\n@c0@"
  ja: "@a@bデボラ「たったの　１０００ゴールドも\n\t出せない国王が　いるなんて……。\n\tこのことは絶対にナイショよ？　いいわね。\n@c0@"
75:
  de: "@aGriselda@bDie haben wohl eine recht große Stammkundschaft. Leute wie du können es sich einfach nicht verkneifen, komischen Kram zu sammeln.\n@c0@"
