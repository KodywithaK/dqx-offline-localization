0:
  de: "@a@bⓞACHTUNG! Giftiger Sumpf.\nBETRETEN VERBOTEN!ⓟ\n@c0@"
  en: "@a@bⓗDANGER! Poisonous swamp.\nKEEP OUT!ⓘ\n@c0@"
  es: "@a@bⓕ¡PELIGRO! Pantano ponzoñoso.\n¡PROHIBIDA LA ENTRADA!ⓖ.\n@c0@"
  fr: "@a@bⓥDANGERⓠ Marais empoisonné.\nDÉFENSE D'ENTRERⓠⓦ\n@c0@"
  it: "@a@bⓕPERICOLO! PALUDE VELENOSA! GIRARE AL LARGO!ⓖ\n@c0@"
  ja: "@a@b“毒のぬまち\n　キケン！　入るな！”\n@c0@"
1:
  de: "@a@bⓞVorsicht wilde Tiere!\nSüdlich von hier liegt das Dorf Bauernsiepen.ⓟ\n@c0@"
  en: "@a@bⓗBeware of beasts!\nSouth of here lies the village of Hay.ⓘ\n@c0@"
  es: "@a@bⓕ¡Cuidado con las bestias!\nAl sur de aquí se encuentra la Puebla del Henoⓖ.\n@c0@"
  fr: "@a@bⓥAttention aux monstresⓠ\nAu sud se trouve le village de Chaumes.ⓦ\n@c0@"
  it: "@a@bⓕAttenzione a li mostri piecuri!\nSud: paesello de Punta Campestreⓖ\n@c0@"
  ja: "@a@b“怪物に　注意！\n　ここより南　カボチの村”\n@c0@"
2:
  de: "@a@bⓞDas ungenehmigte Öffnen der Schleuse ist streng verboten. Wendet Euch an jemanden in Utensiel im Nordosten, falls Ihr sie geöffnet haben wollt.ⓟ\n@c0@"
  en: "@a@bⓗOpening the lock without permission is strictly prohibited. If you need it opened, please notify someone in Stockenbarrel village to the north-east.ⓘ\n@c0@"
  es: "@a@bⓕEstá terminantemente prohibido abrir la cerradura sin permiso. Si necesita abrirla, notifíqueselo a alguien de Clavis, que se encuentra al nordesteⓖ.\n@c0@"
  fr: "@a@bⓥIl est formellement interdit d'ouvrir l'écluse sans permission. Si vous voulez passer, rendez-vous au village de Saint Éloi au nord-est.ⓦ\n@c0@"
  it: "@a@bⓕÈ severamente vietato aprire la Chiusa senza permesso! Per ulteriori informazioni, rivolgersi agli abitanti di Aprianuam, il paese situato a nord-estⓖ\n@c0@"
  ja: "@a@b“無用の者　水門を　あけるべからず。\n　用のある者は　ここより北東\n　山奥の村まで。”\n@c0@"
3:
  de: "@a@bⓞSüdlich von hier liegt das Wüstenreich von Helmunaptra.ⓟ\n@c0@"
  en: "@a@bⓗSouth of here lies the desert queendom of Helmunaptra.ⓘ\n@c0@"
  es: "@a@bⓕAl sur de aquí hallará el reino de la reina del desierto Leopatraⓖ.\n@c0@"
  fr: "@a@bⓦAu sud, vous trouverez le royaume désertique d'Helmunaptra.ⓦ\n@c0@"
  it: "@a@bⓕSud: Regno Desertico di Faraoniaⓖ\n@c0@"
  ja: "@a@b“ここより　南の島\n　テルパドール。”\n@c0@"
4:
  de: "@a@b%0%a000120 versucht, das Schild zu lesen...\nAber %A0110%Xer%Z%B0110%Xsie%Z hat das Lesen noch nicht gelernt!\n@c0@"
  en: "@a@b%0%a000120 tries to read the sign...\nBut %A0110%Xhe%Z%B0110%Xshe%Z doesn't know how to read yet!\n@c0@"
  es: "@a@b%0%a000120 intenta leer el cartel...\n¡Pero aún no sabe leer!\n@c0@"
  fr: "@a@b%0%a000120 essaie de déchiffrer le panneau...\nLe problème, c'est qu'%A0110%Xil%Z%B0110%Xelle%Z ne sait pas lireⓠ\n@c0@"
  it: "@a@b%0%a000120 cerca di capire cosa c'è scritto sul cartello...\nMa non ha ancora imparato a leggere!\n@c0@"
  ja: "@a@b%a000120は　立て札を\n読もうとした……　が\n文字が　読めなかった。\n@c0@"
5:
  de: "@a@b%0%a000120 untersucht das Schild.\n@c0@"
  en: "@a@b%0%a000120 examines the sign.\n@c0@"
  es: "@a@b%0%a000120 examina el cartel.\n@c0@"
  fr: "@a@b%0%a000120 examine le panneau.\n@c0@"
  it: "@a@b%0%a000120 esamina il cartello...\n@c0@"
  ja: "@a@b%a000120は　立て札を　調べた。\n@c0@"
6:
  de: "@a@bAber %A0110%Xer%Z%B0110%Xsie%Z steht auf der falschen Seite und kann nicht lesen, was darauf steht!\n@c0@"
  en: "@a@bBut %A0110%Xhe%Z%B0110%Xshe%Z's standing on the wrong side of it and can't read what it says!\n@c0@"
  es: "@a@b¡Pero lo está mirando desde atrás y no puede leerlo!\n@c0@"
  fr: "@a@bMais %A0110%Xil%Z%B0110%Xelle%Z est du mauvais côté du panneau\net ne peut pas lire ce qui est écritⓠ\n@c0@"
  it: "@a@bMa si trova dietro di esso, e non può leggere cosa c'è scritto!\n@c0@"
  ja: "@a@bしかし　こっちは　うら側。\n書いてある文字が　読めない！\n@c0@"
