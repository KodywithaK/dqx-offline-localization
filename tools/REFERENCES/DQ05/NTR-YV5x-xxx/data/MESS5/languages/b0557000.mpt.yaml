  es: "@a%0%a001250@bDerecha, derecha, izquierda... Mmm, izquierda... derecha, derecha... Ⓠ\n@c0@"
  fr: "@a%0%a001250@bDroite, droite, gauche...\nEuh, gauche... droite, droite... Ⓠ\n@c0@"
  it: "@a%0%a001250@bTrallallero trallallà... Ⓠ\n@c0@"
  ja: "@a@b%a001250「みぎ　みぎ　ひだり……えと\n\tひだり……みぎ　みぎ……♪\n@c0@"
33:
  de: "@a%0%a001250@bDas ist nur ein kleines Lied, das mir %a001240 beigebracht hat, damit ich weiß, wo ich hinspringen muss...\n@c0@"
  en: "@a%0%a001250@bIt's just a little ditty that %a001240 taught me. It's to help me remember how to skip nicely.\n@c0@"
  es: "@a%0%a001250@bNada, es una cancioncilla que me enseñó %a001240 para que saltara con gracia.\n@c0@"
  fr: "@a%0%a001250@bC'est une petite chanson que %a001240 m'a apprise. Ça m'aide à mieux sauter à la corde.\n@c0@"
  it: "@a%0%a001250@bNon riesco a togliermi dalla testa questa canzoncina...\n@c0@"
  ja: "@a@b%a001250「お兄ちゃんに　ならったの。\n\tスキップのときの　歩きかた。\n@c0@"
34:
  de: "@a%0%a001250@bHuhu, Monster! ... Warum antworten sie nicht?\n@c0@"
  en: "@a%0%a001250@bYoohoo! Monsters!\n...Why don't you answer me?\n@c0@"
  es: "@a%0%a001250@b¡Yuujuu! ¡Moooonstruos!...\n¿Dónde os habéis metiiiido?...\n@c0@"
  fr: "@a%0%a001250@bYouhouⓠ Les monstresⓠ\n... Pourquoi vous ne me répondez pasⓡ\n@c0@"
  it: "@a%0%a001250@bMooostriii?!\nDove sieeeteee?!\nPerché non rispondete?\n@c0@"
  ja: "@a@b%a001250「魔物さん\n\tお返事してくれません……。\n@c0@"
35:
  de: "@aSancho@bWeißt du, was los ist, Chico? Die Monster, sie haben Angst vor dir. Weil du kämpfst wie eine Matador!\n@c0@"
  en: "@aSancho@bYou know what eet ees, My Majesty? The monsters, they are escared of you now. Because you fight like the matador!\n@c0@"
  es: "@aSancho@b¿Qué ocurre, Majestad? ¿Los monstruos le tienen miedo? ¡Será porque lucha como un matador!\n@c0@"
  fr: "@aSancho@bT-tu sais quoi, Ma Majestéⓡ En fait, les monstres,\nils ont peur de toi p-parce que tu te bats comme\noun matadorⓠ\n@c0@"
  it: "@aSancho@b¡Chico, yo so que está succedendo!\r\n¡Los mostros sono escappatos por qué te temono!\r\n¡Sanno bien que tu sei imbattibiles!\n@c0@"
  ja: "@a@bサンチョ「そうか！　魔物たち\n\tきっと　%a000090王の強さに\n\tおそれを　なしたんですね！\n@c0@"
36:
  de: "@aSancho@bSi, es ist gut, dass die Monster uns nisst aufhalten. Aber iss mache mir trotzdem Sorgen...\n@c0@"
  en: "@aSancho@bSí, ees good the monsters no bother us.\r\nBut I... I estill worried.\n@c0@"
  es: "@aSancho@bÓrale, pues claro que me alegro de que no haya monstruos.\nPero eso... tampoco me tranquiliza del todo.\n@c0@"
  fr: "@aSancho@bSi, c'est bueno que les m-monstres ne nous embêtent pas. Mais... j-je suis inquiet.\n@c0@"
  it: "@aSancho@bSì, es bueno que no ce estanno mostros aquí, ma yo no me siento muy tranquillo...\n@c0@"
  ja: "@a@bサンチョ「魔物が出ないのは\n\tよろこばしい事なんですが　どうも\n\t落ち着かないというか……うーん。\n@c0@"
37:
  de: "@aOtto@bIrgendwie ist das schon beunruhigend. Kein Monster weit und breit.\n@c0@"
  en: "@aTuppence@bI say! There's something a bit odd here. There's no sign of any monsters whatsoever.\n@c0@"
  es: "@aAlazar@b¡Vaya! Esto sí que es extraño. No hay ni un alma en la cueva...\n@c0@"
  fr: "@aInnocent@bIl y a quelque chose de bizarre, ici.\r\nPas la moindre trace de monstre.\n@c0@"
  it: "@aSimon@bNon ci sono mostri.\nNemmeno uno piccolo piccolo piccolo.\nUn mostriciattolino piccino così.\n@c0@"
  ja: "@a@bピピン「あれ？　どうかしました？\n\t……えっ　魔物の気配がないって？\n@c0@"
38:
  de: "@aOtto@bDas g'fällt mir gar net. Ich hasse Überraschungen. Na, wenigstens ist das hier eine gute...\n@c0@"
  en: "@aTuppence@bI'm not very comfortable with this. I don't much like surprises. Still, at least this is a good one.\n@c0@"
  es: "@aAlazar@bLa verdad, preferiría que hubiera algún que otro monstruo. Esto solo puede significar algo malo.\n㈡\nPero bueno, será mejor disfrutar de este respiro mientras dure.\n@c0@"
  fr: "@aInnocent@bÇa ne me plaît pas. Je n'aime pas beaucoup les surprises. Remarquez, celle-ci est plutôt bonne.\n@c0@"
  it: "@aSimon@bNon è che quelle bestiacce si sono nascoste da qualche parte, in attesa del momento migliore per zomparci addosso?!\n@c0@"
  ja: "@a@bピピン「やだなあ　ぐうぜんですよ。\n\t今日は　運がいいんでしょう。\n@c0@"
39:
  de: "@aOtto@bAh... (Grummel grummel)...\nNein, nein, nein, so geht das net!\n@c0@"
  en: "@aTuppence@bAh... (mumble mumble)...\nOh dear! This won't do!\n@c0@"
  es: "@aAlazar@bAh... (murmullo)\n¡Oh, vaya! ¡Esto no servirá!\n@c0@"
  fr: "@aInnocent@bAh... (marmonnement)...\nOh là làⓠ Il ne faut pasⓠ\n@c0@"
  it: "@aSimon@bNo, c'è qualcosa che non quadra...\n@c0@"
  ja: "@a@bピピン「うと……うと……。\n\t……はっ！？　いかん！！\n@c0@"
40:
  de: "@aOtto@bEs tut mir leid, %a000090, aber hier ist alles so ruhig, dass ich fast schon im Gehen einschlafe.\n@c0@"
  en: "@aTuppence@bSorry, %a000090. Things are so quiet in here that I was almost falling asleep on the spot.\n@c0@"
  es: "@aAlazar@bLo siento, %a000090. Qué silencio tan soporífero. Hace un momento casi me quedo transpuesto.\n@c0@"
  fr: "@aInnocent@bDésolé, %a000090. Tout est si calme que j'ai failli m'endormir.\n@c0@"
  it: "@aSimon@bMaestà, sono perplesso...\nC'è troppa calma qui dentro.\nNon lo trova strano anche lei?\n@c0@"
  ja: "@a@bピピン「すみませんっ。\n\tあまりに　何ごともないので\n\tつい　居眠りしちゃいましたっ。\n@c0@"
41:
  de: "@aOtto@bHabt Ihr Weihwasser verspritzt, als ich net hing'sehen hab, oder so was?\n@c0@"
  en: "@aTuppence@bDid you use holy water while I wasn't looking or something, %a000090?\n@c0@"
  es: "@aAlazar@bNo habréis rociado el lugar con agua bendita a escondidas, ¿no, %a000090?\n@c0@"
  fr: "@aInnocent@bVous avez utilisé de l'eau sacrée ou autre chose pendant que j'avais le dos tourné, %a000090ⓡ\n@c0@"
  it: "@aSimon@bSire, mi dica una cosa...\nNon è che per caso ha innaffiato il terreno con qualche dozzina di fiale d'acqua santa...?\n@c0@"
  ja: "@a@bピピン「%a000090さま。\n\tいつの間に　聖水を\n\t使ったんですか？\n@c0@"
42:
  de: "@aBianca@bWas, glaubst du, ist los mit diesem Ort? Warum sind die Monster hier so aggressiv und hartnäckig?\n@c0@"
  en: "@aBianca@bWhat do you suppose is goin' on with this place?\r\nWhy are the monsters here such pesky, persistent little things?\n@c0@"
  es: "@aBianca@b¿Qué estará pasando en este sitio?\nQué pesados e insistentes son aquí los monstruitos.\n@c0@"
  fr: "@aBianca@bD'après toi, qu'est-ce qui se passe iciⓡ Pourquoi les monstres sont si tenaces et si mauvaisⓡ \n@c0@"
  it: "@aBianca@bMa che succede qui?!\nPerché questi mostri ce l'hanno tanto con noi, eh?!\n@c0@"
  ja: "@a@bビアンカ「さっきから　なんなの？\n\tここの魔物たちは\n\tずいぶん　しつこいわね！！\n@c0@"
43:
  de: "@aBianca@bWenn so viele Monster in der Nähe sind, muss es hier drinnen was ganz Besonderes geben, was sie vor uns schützen wollen.\n@c0@"
  en: "@aBianca@bIf there are this many monsters about, there must be somethin' pretty special in here that they're tryin' to stop us gettin' at.\n@c0@"
  es: "@aBianca@bToda esta jauría de monstruos solo puede significar una cosa: están protegiendo algo muy especial, ¿me entiendes?\n@c0@"
  fr: "@aBianca@bS'il y a autant de monstres ici, c'est qu'il doit y avoir quelque chose de spécial et qu'ils veulent nous empêcher de le découvrir.\n@c0@"
  it: "@aBianca@bScommetto che tutti questi mostri proteggono un oggetto speciale del quale non vogliono che ci impadroniamo!\n@c0@"
  ja: "@a@bビアンカ「これだけの魔物が\n\tいるってことは　きっと奥には\n\tなにかあるってことよね？\n@c0@"
44:
  de: "@aNera@bIn dieser Höhle heißt das Motto wohl ⓞAlles oder nichtsⓟ, wenigstens was die Anzahl der Monster angeht. Das ist mir etwas zu extrem...\n@c0@"
  en: "@aNera@bIt's all or nothing with this cave when it comes to the number of monsters around. Rather too extreme for my liking.\n@c0@"
  es: "@aNera@bDesde luego, los monstruos aquí están veramente coordinados. O están todos o no hay ninguno. Dai, demasiado extremo para mi gusto.\n@c0@"
  fr: "@aNera@bLes monstres, c'est tout ou rien dans cette grotte.\r\nC'est un peu trop intense pour moi.\n@c0@"
  it: "@aNera@bNon trovi anche tu che i mostri che vivono in questa caverna abbiano un comportamento quantomeno bizzarro?! O non ce n'è nessuno, o ce ne sono mille!\n@c0@"
  ja: "@a@bフローラ「この洞くつ　魔物さんが\n\t出るときと　出ないときの差が\n\tありすぎですわ。\n@c0@"
45:
  de: "@aNera@bEs wäre schön, wenn wir schneller vorankommen würden, aber sie tun ja alles, um uns aufzuhalten.\n@c0@"
  en: "@aNera@bIt would be nice to get ahead more quickly, but it looks like they're doing their hardest to stop us.\n@c0@"
  es: "@aNera@bCon questo asedio es imposible avanzar más rápido, veramente. Se están ensañando de lo lindo.\n@c0@"
  fr: "@aNera@bCe serait bien qu'on avance plus rapidement, mais ils semblent bien déterminés à nous arrêter.\n@c0@"
  it: "@aNera@bCerto che queste bestiacce ce la stanno mettendo tutta per impedirci di proseguire!\n@c0@"
  ja: "@a@bフローラ「先を　急ぎたいのですけど…\n\tなかなか　カンタンには\n\t行かせてくれそうに　ありませんわね。\n@c0@"
46:
  de: "@a%0%a001240@bSei vorsichtig, Papa. Die Monster hier drin sind ganz schön unheimlich.\n@c0@"
  en: "@a%0%a001240@bBe careful, Dad. The monsters in here\nare pretty scary.\n@c0@"
  es: "@a%0%a001240@b¡Ten cuidado, papá! Los monstruos de por aquí sí que dan miedo.\n@c0@"
  fr: "@a%0%a001240@bFais attention, papa. Les monstres n'ont pas l'air commodes par ici.\n@c0@"
  it: "@a%0%a001240@bPapà, stai attento...\nI mostri che vivono qui dentro sono molto pericolosi...\n@c0@"
  ja: "@a@b%a001240「お父さん　気をつけてね。\n\tこの洞くつの魔物は　なんだか\n\t手ごわいよ！\n@c0@"
47:
  de: "@a%0%a001240@bDiese Höhle ist nicht weit weg von Wittenhausen, oder?\n@c0@"
  en: "@a%0%a001240@bThis cave isn't far from Roundbeck, is it?\n@c0@"
  es: "@a%0%a001240@bEsta cueva no está lejos de Golfo Blanco, ¿a que no?\n@c0@"
  fr: "@a%0%a001240@bBlanchecombe n'est pas loin d'ici, pas vraiⓡ\n@c0@"
  it: "@a%0%a001240@bBlankenburg non è molto lontana da qui, dico bene?\n@c0@"
  ja: "@a@b%a001240「この洞くつって　たしか\n\tアルカパの町の　近くだよね。\n@c0@"
48:
  de: "@a%0%a001240@bWir müssen allen Leuten dort sagen, dass sie bloß nicht hier reingehen sollen. Das ist viel zu gefährlich!\n@c0@"
  en: "@a%0%a001240@bWe'll have to tell all the townspeople to steer well clear of this place. It's far too dangerous!\n@c0@"
  es: "@a%0%a001240@bHabrá que decirle a la gente del pueblo que eviten pasar por este lugar. ¡Es demasiado peligroso!\n@c0@"
