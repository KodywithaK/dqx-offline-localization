  es: "@a%0%a001250@b... ¡Noventa y ocho, noventa y nueve, cien! ¡Voy!\n@c0@"
  fr: "@a%0%a001250@bQuoi qu'il en soit, on continueⓠ\n@c0@"
  it: "@a%0%a001250@bC'è nessuuuuuno?!\n@c0@"
  ja: "@a@b%a001250「もー　いいかーい？\n@c0@"
31:
  de: "@a%0%a001250@bVielleicht spielen die Monster ja Verstecken mit uns!\n@c0@"
