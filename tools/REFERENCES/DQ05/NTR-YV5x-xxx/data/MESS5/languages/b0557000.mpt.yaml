  it: "@a%0%a001240@bCredo che dovremmo avvisare gli abitanti del villaggio: devono girare alla larga da questa caverna... è troppo pericolosa!\n@c0@"
  ja: "@a@b%a001240「町にもどったら　みんなに\n\tここは危ないから　来ちゃダメって\n\t教えてあげなくちゃ！\n@c0@"
49:
  de: "@a%0%a001250@bAua! ... Schon in Ordnung, ich bin nur gestolpert.\n@c0@"
  en: "@a%0%a001250@bOuch! ...It's alright. I just tripped a bit, that's all.\n@c0@"
  es: "@a%0%a001250@b¡Ay! Mmm... No ha sido nada. Es que casi me tropiezo, nada más.\n@c0@"
  fr: "@a%0%a001250@bOuilleⓠ ... Ce n'est rien. J'ai trébuché, c'est tout.\n@c0@"
  it: "@a%0%a001250@bAhia!\nSono inciampata...\n@c0@"
  ja: "@a@b%a001250「イタッ！\n\t……ちょっと　つまずいただけです。\n\t大丈夫。\n@c0@"
50:
  de: "@a%0%a001250@bDie Monster hier drin sind alle gemein. Fast so, als würden sie von irgendetwas angetrieben...\n@c0@"
  en: "@a%0%a001250@bThe monsters here are really mean. It's like they're being controlled by something.\n@c0@"
  es: "@a%0%a001250@bAquí, los monstruos son malvados de verdad. Parece que siguen órdenes de alguien.\n@c0@"
  fr: "@a%0%a001250@bLes monstres sont vraiment méchants, ici. C'est comme s'ils étaient contrôlés par quelque chose.\n@c0@"
  it: "@a%0%a001250@bQuesti mostri sono davvero cattivi!\nHo la sensazione che siano controllati da qualche altra creatura...\n@c0@"
  ja: "@a@b%a001250「ここの魔物さん\n\tなんだか　こわいね。\n\tなにかに　あやつられてるみたい……。\n@c0@"
51:
  de: "@aSancho@bEine tapfere Conquistador, er weiß, wann er kämpfen muss!\n@c0@"
  en: "@aSancho@bA brave conquistador, he knows when ees the good time to make a fresh estart.\n@c0@"
  es: "@aSancho@bUn gran conquistador siempre sabe cuándo es el mejor momento para comenzar de nuevo.\n@c0@"
  fr: "@aSancho@bOun vrai conquistador, il sait quand c'est le\r\nm-moment de prendre oun nouveau départ.\n@c0@"
  it: "@aSancho@b¿Hai fame, chico?\n¿Vuoi un poco de paella?\n@c0@"
  ja: "@a@bサンチョ「%a000090王。\n\t危ないと思ったときは　いったん\n\t出直すのも　勇気のうちですよ。\n@c0@"
52:
  de: "@aSancho@bDu bist solch eine starke Mann geworden, Chico. Iss bin so stolz!\n㈡\nManchmal wenn iss hinter dir gehe, vergesse iss sogar, dass du gar nisst dein Padre bist!\n@c0@"
  en: "@aSancho@bYou have become esuch a fine man, %a000090. I, I am eso proud! Esometimes when I am walking behind you, I forget you are no your father.\n@c0@"
  es: "@aSancho@b%1%a000090, te hiciste un gran hombre. ¡Qué orgulloso estoy de ti!\n㈡\nA veces, cuando camino atrasito de ti, es como si estuviera siguiendo a tu padre, chamaco.\n@c0@"
  fr: "@aSancho@bT-Tu es devenu oun vrai hombre, %a000090.\nJe suis si f-fier. Parfois, quand je m-marche avec toi, j'oublie que tu n'es p-pas ton padre.\n@c0@"
  it: "@aSancho@bSei diventato un hombre muy fuerte, %a000090.\nCuando viaggio contigo, me siento al seguro.\n@c0@"
  ja: "@a@bサンチョ「%a000090王　立派になって……。\n\t背中を見てると　ときどきパパスさまと\n\tまちがえそうになりますよ。\n@c0@"
53:
  de: "@aSancho@bHeute war eine sehr anstrengende Tag. Iss werde dir ein schönes heißes Bad einlassen und dir etwas Leckeres kochen.\n@c0@"
  en: "@aSancho@bToday, ees been a very exhausting day. I gonna prepare for you a nice, hot bath and esometheeng esalty for dinner.\n@c0@"
  es: "@aSancho@bHíjole, hoy ha sido un día agotador. Voy a prepararte un buen baño caliente y un platillo delicioso para cenar, nomás.\n@c0@"
  fr: "@aSancho@bAujourd'hui, ça a été oun journée f-fatigante.\r\nJe vais te p-préparer oun bon b-bain et oun\r\nbon repas.\n@c0@"
  it: "@aSancho@b¡Ay, que estanchezzas!\n¿Que dici, chico?\n¿Preparo una buena paella tonificante, sì?\n@c0@"
  ja: "@a@bサンチョ「ええと　今日は　\n\tうんと　つかれたから　熱いお風呂と\n\t塩味の濃い　お料理を用意しなくちゃ。\n@c0@"
54:
  de: "@aOtto@bKeine Sorge, %a000090. Falls Euch etwas zustoßen sollte, werd' ich mich selbstverständlich um Eure teure Frau und die Kinder kümmern.\n@c0@"
  en: "@aTuppence@bDon't worry, %a000090. If the worst happens, I'll take good care of your beloved wife and children.\n@c0@"
  es: "@aAlazar@bNo os preocupéis, %a000090. Si ocurriera una desgracia, yo me ocuparía de vuestra amada esposa y de vuestros hijos.\n@c0@"
  fr: "@aInnocent@bNe vous inquiétez pas, %a000090. Si le pire devait arriver, je prendrais bien soin de votre femme et de vos enfants.\n@c0@"
  it: "@aSimon@bNon si preoccupi, Maestà!\nSe dovesse accaderle il peggio, mi prenderò personalmente cura della sua famiglia!\n㈡\nWah ah ah!\nEhm... Scusi, Sire...\nSono un po' stressato...\n@c0@"
  ja: "@a@bピピン「%a000090さま。　もしもの場合は　\n\tのこされた　お子さまと奥さまのことは\n\tボクが　引きうけますから！\n@c0@"
55:
  de: "@aOtto@bHm. Hätten wir doch nur einen Maler mitgenommen...\n@c0@"
  en: "@aTuppence@bHmm. If only I'd brought a painter along with me.\n@c0@"
  es: "@aAlazar@bMmm... Ojalá me hubiera traído a un pintor conmigo.\n@c0@"
  fr: "@aInnocent@bMmm. J'aurais dû faire venir un peintre.\n@c0@"
  it: "@aSimon@bMaestà, come se la cava nel disegno?\n@c0@"
  ja: "@a@bピピン「……やっぱり　画家を\n\t連れてくるべきだよなあ。\n@c0@"
56:
  de: "@aOtto@bEs wäre doch nett, ein Bild von mir und meinen tapferen Heldentaten zu haben, net wahr?\n@c0@"
  en: "@aTuppence@bHow nice it would be if I could show people at home a picture of me in a mighty fighting pose!\n@c0@"
  es: "@aAlazar@b¡Sería genial poder mostrar en casa una pintura en la que saliera yo, espada en ristre!\n@c0@"
  fr: "@aInnocent@bÇa aurait été formidable de pouvoir montrer à tout le monde un tableau de moi en pleine actionⓠ\n@c0@"
  it: "@aSimon@bMi chiedevo se potesse ritrarmi in questo luogo, in una posa eroica...\n㈡\nEcco, prenda la mia matita...\n@c0@"
  ja: "@a@bピピン「たたかってるボクの　かっこよさを\n\tぜひ　みんなに見てほしいのにっ。\n@c0@"
57:
  de: "@aOtto@bIch verstehe diese Höhle einfach net. Zuerst sind überhaupt keine Monster in Sicht und plötzlich wimmelt es nur so von ihnen!\n@c0@"
  en: "@aTuppence@bI just can't keep up with this place. One minute there are no monsters at all, and then the whole place is overrun with them!\n@c0@"
  es: "@aAlazar@bNo soporto ni un minuto más este lugar. Primero no había ningún monstruo por ningún lado. ¡Y acto seguido se llena de enemigos hasta el techo!\n@c0@"
  fr: "@aInnocent@bJ'ai du mal à suivre ce qui se passe, ici. Tout va bien, il n'y a pas de monstres à l'horizon, et voilà que la minute d'après, on ne sait plus où donner de la têteⓠ\n@c0@"
  it: "@aSimon@bQuesto luogo è insopportabile! Un momento trabocca di mostri, e l'attimo successivo non ce n'è nemmeno mezzo! Perché quelle belve sono tanto indecise?!\n@c0@"
  ja: "@a@bピピン「魔物が　出たり出なかったり\n\tいそがしい洞くつですねえ。\n@c0@"
58:
  de: "@aBianca@bHey, was ist denn das jetzt schon wieder?\n@c0@"
  en: "@aBianca@bHey! What d'you s'pose that is?\n@c0@"
  es: "@aBianca@b¡Eh! ¿Qué se supone que es eso?\n@c0@"
  fr: "@aBianca@bHéⓠ Qu'est-ce qui s'est passé, à ton avisⓡ\n@c0@"
  it: "@aBianca@bUhm...\n@c0@"
  ja: "@a@bビアンカ「ん？　なにかしら　あれは？\n@c0@"
59:
  de: "@a%0%a001240@bSind wir bald fertig? Diese Steinplatten sind ganz schön schwer. Ich bin müde!\n@c0@"
  en: "@a%0%a001240@bAre we done yet? Those stone slabs are really heavy. I'm tired!\n@c0@"
  es: "@a%0%a001240@b¿Hemos acabado ya? Esas losas de piedra son muy pesadas. ¡Estoy cansado!\n@c0@"
  fr: "@a%0%a001240@bOn a finiⓡ Ces pierres sont sacrément lourdes.\nJe suis fatigué.\n@c0@"
  it: "@a%0%a001240@bAbbiamo finito?\nNon ce la faccio più...\nQueste lastre di pietra sono pesantissime!\n@c0@"
  ja: "@a@b%a001240「終わったの？\n\t石が　重くて\n\tくたびれちゃったよ　ボク。\n@c0@"
60:
  de: "@a%0%a001250@bIst das dein Umhang dort drüben, Papa?\n@c0@"
  en: "@a%0%a001250@bIs that your robe over there, Dad?\n@c0@"
  es: "@a%0%a001250@b¿No es ese tu manto, papi?\n@c0@"
  fr: "@a%0%a001250@bPapa, c'est ton manteau, là-basⓡ\n@c0@"
  it: "@a%0%a001250@bDi chi è quella specie di mantello?\n@c0@"
  ja: "@a@b%a001250「あそこにあるの\n\tお父さんのマント？\n@c0@"
61:
  de: "@aSancho@bUff! Die Steine durch die engen Gänge zu schieben, ist fast so wie Salsa-Tanzen, no? Das ist schwere Arbeit...\n@c0@"
  en: "@aSancho@bUf! Pushing these estones around these narrow passages, ees like dancing the salsa, no? Ees hard work.\n@c0@"
  es: "@aSancho@b¡Uf! ¡Híjole! De tanto empujar las losas de piedra por esos estrechos pasillos me siento como si me hubieran dado una golpiza. Es un trabajo reteduro.\n@c0@"
  fr: "@aSancho@bPfffⓠ Ce n'est pas f-facile de pousser toutes ces\np-pierres. C'est aussi f-fatigant que de danser la salsa, noⓡ\n@c0@"
  it: "@aSancho@b¡Ay, que mal!\n¡Espingere estas pietras muy pesantes no es bueno por la mia eschiena!\n@c0@"
  ja: "@a@bサンチョ「ふーっ…　やれやれ\n\tこんなせまい通路で　石を運ぶのは\n\t重労働でしたね。\n@c0@"
62:
  de: "@aGriselda@bSchon wieder eine Höhle. Unglaublich, dass es dir immer wieder gelingt, eine zu finden, %a000090...\n@c0@"
  en: "@aDebora@bHere we are in yet another cave. You certainly know how to hunt these places out, don't you, %a000090?\n@c0@"
  es: "@aStefania@bOtra vez en una caverna. Veramente, no te dejas ni una ¿no, %a000090?\n@c0@"
  fr: "@aPandora@bEt nous revoilà dans une nouvelle grotte. Tu es vraiment doué pour dénicher ces endroits, hein, %a000090ⓡ\n@c0@"
  it: "@aViola@bEccoci in un'altra grotta... Ormai ho perso il conto di quante ne abbiamo esplorate.\nNon te ne lasci sfuggire una, eh?!\n@c0@"
  ja: "@a@bデボラ「また　洞くつなの……。\n\t%a000090って　本当に\n\t洞くつをさがすのが　うまいわよね。\n@c0@"
63:
  de: "@aGriselda@bWenn du ihn verrücken möchtest, tu's doch einfach. Mir ist das egal.\n@c0@"
  en: "@aDebora@bJust move it if you want to move it.\nI'm not bothered either way.\n@c0@"
  es: "@aStefania@bSi quieres moverla, muévela.\nA mí me da veramente igual.\n@c0@"
  fr: "@aPandora@bSi tu as envie de la déplacer, fais-le.\r\nÇa m'est égal.\n@c0@"
  it: "@aViola@bVuoi spostare la pietra?\nSe proprio ci tieni, ti autorizzo a farlo.\n@c0@"
  ja: "@a@bデボラ「動かしたいのなら　動かせば？\n\t私は　別に　興味ないわ。\n@c0@"
64:
  de: "@aGriselda@bAh... So was habe ich mir schon gedacht.\nVielleicht hätte ich was sagen sollen.\n@c0@"
  en: "@aDebora@bAh... I thought this might be the case.\nMaybe I should've said.\n@c0@"
  es: "@aStefania@b¡Ah!... Sabía que pasaría esto.\nVeramente, debería habértelo dicho, ¿no?\n@c0@"
  fr: "@aPandora@bAh... Je me doutais que ça allait arriver. J'aurais peut-être dû te le dire.\n@c0@"
  it: "@aViola@bMa che sta succedendo...?\n@c0@"
  ja: "@a@bデボラ「ああ…　やっぱりね。\n\tこんなことだと　思ったわ。\n\t思っていた　だけだけど。\n@c0@"
65:
  de: "@aGriselda@bAnscheinend schließt der Stein die Monster in dieser Höhle ein. Aber darauf bist du sicher auch schon gekommen..\n@c0@"
  en: "@aDebora@bThat stone obviously seals away the monsters in this cave. You probably already figured that out.\n@c0@"
  es: "@aStefania@bEstá claro que la piedra sirve para encerrar a los mostri en esa cueva. Sicuro que ya lo habías averiguado.\n@c0@"
  fr: "@aPandora@bCette pierre est sans doute là pour enfermer\r\nles monstres à l'intérieur de cette grotte.\r\nTu l'avais sans doute déjà compris.\n@c0@"
  it: "@aViola@bNel caso non l'avessi capito, ti informo che quella pietra blocca l'accesso dei mostri a questa caverna. Come faresti senza le mie perle di saggezza, eh?\n@c0@"
  ja: "@a@bデボラ「あの石が\n\tこの洞くつの魔物を　封じていたのね。\n\tちょっと考えれば　わかることだけど。\n@c0@"
66:
  de: "@aGriselda@bEs ist natürlich schön, sich keine Gedanken über Monster machen zu müssen, aber das ist immer noch eine Höhle, und ich hasse Höhlen!\n@c0@"
  en: "@aDebora@bIt's certainly a lot easier without monsters to worry about, but it's still a cave, and I really hate caves.\n@c0@"
  es: "@aStefania@bSicuro que es más fácil sin mostri, ma es una cueva de todos modos, y yo odio las cuevas.\n@c0@"
  fr: "@aPandora@bC'est effectivement beaucoup plus facile quand\r\nil n'y a pas à s'inquiéter des monstres, mais ça\r\nreste une grotte et je déteste les grottes.\n@c0@"
  it: "@aViola@bAnche se non ci sono mostri, questa resta pur sempre una grotta...\nE io odio le grotte con tutte le mie forze!\n@c0@"
  ja: "@a@bデボラ「魔物がいないのは　楽でいいけど\n\tそれでも　洞くつって\n\tやっぱり好きになれないわ。\n@c0@"
67:
  de: "@aGriselda@bEine Höhle ist eine Höhle, mit oder ohne Monster! Hach, wie ich Höhlen verabscheue!\n@c0@"
  en: "@aDebora@bA cave's a cave, monsters or no monsters.\r\nYuck! Being in here makes me feel all clammy.\n@c0@"
  es: "@aStefania@bUna cueva es una cueva, con mostri o sin ellos.\n¡Agh! Me siento asqueada solo de estar aquí.\n@c0@"
  fr: "@aPandora@bUne grotte reste une grotte, avec ou sans monstres. Beurkⓠ Le simple fait d'être là-dedans me donne l'impression d'être toute collante.\n@c0@"
  it: "@aViola@bNon mi piacciono le caverne, nemmeno quando non ci sono mostri in giro. Anche senza quelle belve, restano luoghi bui, umidi e maleodoranti!\n@c0@"
  ja: "@a@bデボラ「魔物が出ようと　出まいと\n\t洞くつは　洞くつなのよ。\n\tああ　ジメジメする……。\n@c0@"
68:
  de: "@aGriselda@bZuerst sind die Monster da, dann wieder nicht... Wahrscheinlich machen die sich einen Spaß daraus!\n@c0@"
  en: "@aDebora@bMonsters everywhere, monsters nowhere to be seen... Are they just trying to wind me up?\n@c0@"
  es: "@aStefania@bMostri a tutti plen, ni un mostri... Credo que lo hacen para fastidiarme.\n@c0@"
  fr: "@aPandora@bDes monstres partout, puis aucun monstre\nnulle part... Ils essaient juste de me mettre\nen colère ou quoiⓡ\n@c0@"
  it: "@aViola@bPrima qui è pieno di mostri, e dopo un istante non c'è nemmeno l'ombra di una bestiolina piccina così!\nMa che fanno?! Giocano a nascondino?!\n@c0@"
  ja: "@a@bデボラ「出たり　出なかったり\n\tなんなのよもうっ　ここの魔物どもは！\n@c0@"
69:
  de: "@aGriselda@bWenn wir hier fertig sind, verschwinden wir sofort wieder, verstanden? Ein Nein akzeptiere ich nicht!\n@c0@"
  en: "@aDebora@bIf we're done here, we're leaving right away. Got it? I'm not taking no for an answer.\n@c0@"
  es: "@aStefania@b¿Hemos acabado aquí? Pues andiamo. ¿Capisci? No acepto un no por respuesta.\n@c0@"
  fr: "@aPandora@bSi on a fini ce qu'on avait à faire ici, on s'en va tout de suite. Comprisⓡ Et ⓥnonⓦ n'est pas une réponse acceptable.\n@c0@"
  it: "@aViola@bAbbiamo finito qui?\nAllora andiamocene subito, perché ne ho fin sopra i capelli di questo posto!\n@c0@"
  ja: "@a@bデボラ「いい？　用がすんだら\n\t急いで　外に出るわよ。\n\t口ごたえは　絶対　許さないから！\n@c0@"
70:
  de: "@aNera@bOh, siehst du den Umhang dort drüben? Der würde dir bestimmt stehen, Liebling.\n@c0@"
  en: "@aNera@bOoh, do you see that robe over there?\nYou'd look lovely in that, darling.\n@c0@"
  es: "@aNera@bOoh, ¿has visto ese manto de ahí?\nTe estaría perfetto, caro mio.\n@c0@"
  fr: "@aNera@bOh, tu vois le manteau, là-basⓡ Tu serais très beau, là-dedans, mon chéri.\n@c0@"
  it: "@aNera@bHai visto che bel mantello, tesoro?\nSembra fatto su misura per te!\n@c0@"
  ja: "@a@bフローラ「あら　あそこにあるマント……\n\tあなたに　よく　似合いそうですわね。\n@c0@"
71:
  de: "@aGriselda@bIst das ein Umhang dort drüben? Wenn wir deswegen hier sind, dann nimm ihn einfach und lass uns verschwinden.\n@c0@"
  en: "@aDebora@bIs that a robe over there? If that's why we're here, just take it and let's get out of here.\n@c0@"
  es: "@aStefania@b¿No es eso de ahí un manto? Si hemos venido por eso, hazte con él y vámonos de aquí, presto.\n@c0@"
  fr: "@aPandora@bC'est un manteau, là-basⓡ Si c'est pour ça que\nnous sommes là, prends-le et sortons d'ici.\n@c0@"
  it: "@aViola@bMa quello lì è un mantello? Se siamo venuti per quell'oggetto, prendiamolo e filiamo. Voglio lasciarmi alle spalle questo postaccio il prima possibile!\n@c0@"
  ja: "@a@bデボラ「あそこにあるのは…　マント？\n\tあれが目的だったのなら\n\tひろって　さっさと　外に出るわよ。\n@c0@"
