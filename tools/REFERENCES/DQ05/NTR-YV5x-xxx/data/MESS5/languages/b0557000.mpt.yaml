  ja: "@a@b%a001250「……あれ？\n\t魔物さん　みんな　いない……。\n\tだーれもいないの。\n@c0@"
30:
  de: "@a%0%a001250@b1, 2, 3 ⓚⓛ wir kommen!\n@c0@"
