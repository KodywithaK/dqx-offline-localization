  ja: "@a@b%a001250「………魔物さん\n\tかくれんぼ　してるんじゃないの？\n@c0@"
32:
  de: "@a%0%a001250@bRechts, rechts, links... Ähm, links... rechts, rechts... Ⓠ\n@c0@"
