43:
  de: "@aBianca@bEs gehört uns? Das ganze Firlefanzeum gehört uns? Ich kann's kaum glauben!\n@c0@"
  en: "@aBianca@bIt's ours? This whole place is ours?\nI can hardly believe it!\n@c0@"
  es: "@aBianca@b¿Nuestro? ¿Todo este sitio es nuestro?\r\n¡No puedo creerlo!\n@c0@"
