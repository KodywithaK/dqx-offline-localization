  it: "@aBianca@bÈ nostro?\nAdesso questo posto è tutto nostro?!\nMi sembra incredibile...\n@c0@"
  ja: "@a@bビアンカ「くれるって……　本当に\n\tこんな　りっぱな建物を\n\tもらっちゃって　いいのかな？\n@c0@"
44:
  de: "@aNera@bEr ist... Er ist einfach durch die Tür gegangen... Ich bin ganz durcheinander.\n@c0@"
  en: "@aNera@bHe j-just... He went right through the d-door...\r\nI feel all giddy.\n@c0@"
  es: "@aNera@bHa... Ha atravesado la p-porta...\r\nNo me sento bene.\n@c0@"
  fr: "@aNera@bIl vient de... Il a t-traversé la p-porte...\r\nJe ne me sens pas très bien.\n@c0@"
  it: "@aNera@bMa... Ma è passato attraverso la porta?!\nNo, no. Non è possibile.\nDevo aver visto male...\n@c0@"
  ja: "@a@bフローラ「おじいさんが　トビラを\n\tすりぬけて…　ああ　めまいが……。\n@c0@"
45:
  de: "@aNera@bEs ist ein wunderhübsches Museum, aber man hat fast den Eindruck, den kalten Hauch der Geschichte im Nacken zu spüren.\n@c0@"
  en: "@aNera@bIt's a delightful museum, but it does feel rather like it has a bit too much history to it.\n@c0@"
  es: "@aNera@bEs un museo fantástico, pero me hace sentire que tiene demasiada historia.\n@c0@"
  fr: "@aNera@bC'est un musée charmant, mais il donne l'impression d'être un peu trop chargé d'histoire.\n@c0@"
  it: "@aNera@bIl Museo è davvero delizioso, ma non mi dispiacerebbe svecchiare un po' l'ambiente...\n@c0@"
  ja: "@a@bフローラ「ステキな　博物館だとは\n\t思いますけど……　何か\n\tいわくつきとかじゃ　ないですよね？\n@c0@"
46:
  de: "@a%0%a001240@bDer alte Mann ist einfach verschwunden! Gehen wir hinein!\n@c0@"
  en: "@a%0%a001240@bThe old man just disappeared! Let's go inside!\n@c0@"
  es: "@a%0%a001240@b¡El viejo ha desparecido! ¡Vamos adentro!\n@c0@"
  fr: "@a%0%a001240@bLe vieux monsieur a disparuⓠ Rentrons à l'intérieurⓠ\n@c0@"
  it: "@a%0%a001240@bIl signore anziano è sparito!\nForza, entriamo!\n@c0@"
  ja: "@a@b%a001240「おじいさんが　消えたよ？\n\tねえ　中に入ってみようよ！\n@c0@"
47:
  de: "@a%0%a001250@bDie Maximedaille hat allen in König Dominicus' Domäne nur Scherereien bereitet.\n@c0@"
  en: "@a%0%a001250@bThe maxi medal was just causing problems for everyone back at King Dominicus's Dominion.\n@c0@"
  es: "@a%0%a001250@bLa maximedalla no hacía más que causar problemas a todo el mundo en los Dominios del rey Dominico.\n@c0@"
  fr: "@a%0%a001250@bLa maxi médaille ne causait que du souci aux gens du domaine du roi Dominicus.\n@c0@"
  it: "@a%0%a001250@bLa maximedaglia aveva creato solo problemi nel Regno di Minikin.\n@c0@"
  ja: "@a@b%a001250「大きなメダルって\n\tメダル王の城の人に\n\tジャマにされてたのよね。\n@c0@"
48:
  de: "@a%0%a001250@bAber sieh dir an, wie glücklich sie den alten Firle Franz gemacht hat! Ich wette, die Medaille selbst ist hier auch viel glücklicher!\n@c0@"
  en: "@a%0%a001250@bAnd yet look how happy it made Old Man Nick Knack! I'll bet the medal itself feels much more contented here too.\n@c0@"
  es: "@a%0%a001250@b¡Y mira lo contento que se ha puesto el abuelo Nino! Seguro que hasta la propia medalla se encuentra mucho más cómoda aquí.\n@c0@"
  fr: "@a%0%a001250@bEt regarde comme elle a rendu le vieux Bricabrac heureuxⓠ Je parie que même la médaille\nse sent mieux ici.\n@c0@"
  it: "@a%0%a001250@bInvece Geremia è impazzito dalla gioia quando l'ha ricevuta! Scommetto che anche la maximedaglia è contenta di essere qui!\n@c0@"
  ja: "@a@b%a001250「でも　おじいさんが\n\tあんなに　よろこんでくれて……\n\t大きなメダルも　よろこんでる　かな？\n@c0@"
49:
  de: "@aSancho@bAber Chico. Iss glaube, wir haben nisst die Zeit, hier den Museumskurator zu spielen, no? Wir haben doch noch so viel zu tun.\n@c0@"
  en: "@aSancho@bBut friend. I no theenk ees the time for us to be playing the museum curator, no? We have muchos, muchos to do.\n@c0@"
  es: "@aSancho@bPero chamaquito, no podemos perder tiempo jugando a conservadores de museo. Tenemos mucho que hacer.\n@c0@"
  fr: "@aSancho@bMais, chico, je ne crois pas que ce soit v-vraiment le moment de jouer au conservateur de m-musée, siⓡ Nous avons t-tellement de choses à faireⓠ\n@c0@"
  it: "@aSancho@bChico, yo no pienso que abbiamo el tiempo por dirigere el Museo del Souvenir.\nAbbiamo cosas más importantes da fare...\n@c0@"
  ja: "@a@bサンチョ「う～む…　しかし　坊っちゃん。\n\t私たちは　今　博物館の館長を\n\tしているヒマなどないはずですが……。\n@c0@"
50:
  de: "@aOtto@bMeine Güte! Dann gehört dieses Museum jetzt mi... Ähm, ich mein', es g'hört jetzt ganz Euch, %a000090. Ich bin wirklich ein wenig neidisch.\n@c0@"
  en: "@aTuppence@bGood heavens! So now this museum is all miⓚⓛ\nEr, I mean, all yours, %a000090.\nI'm rather envious, I must admit.\n@c0@"
  es: "@aAlazar@b¡Cielo santo! Así que ahora el museo es todo m... digooo, todo tuyo, %a000090.\nDebo admitir que siento un poco de envidia.\n@c0@"
  fr: "@aInnocent@bPar la Déesseⓠ Alors maintenant, le musée est tout à m... euh, tout à vous, %a000090. Je dois avouer que je vous envie un peu.\n@c0@"
  it: "@aSimon@bChe bellezza! Ho un museo tutto mio!\r\nEhm... Mi scusi, Maestà. Mi ero lasciato trasportare dall'entusiasmo. Ovviamente, questo è il SUO Museo...\n@c0@"
  ja: "@a@bピピン「えっ！？　この博物館が\n\tボクの…　いえ　%a000090王のものに？\n\tうらやましいなあ……。\n@c0@"
51:
  de: "@aBianca@bDann heißt es wohl Lebwohl, alter Firle Franz. Er hat hier im Museum so viel für uns getan.\n@c0@"
  en: "@aBianca@bSo it's goodbye Old Man Nick Knack.\r\nHe did so much for us here at the museum.\n@c0@"
  es: "@aBianca@bAsí que adiós al abuelo Nino.\r\nNos ha sido de mucha ayuda aquí en el museo, ¿sabes?\n@c0@"
  fr: "@aBianca@bEt voilà... le vieux Bricabrac est parti. Il a fait tellement de choses pour nous au musée.\n@c0@"
  it: "@aBianca@bE così Geremia è andato a riposare.\nQuel vecchietto mi è davvero simpatico...\n@c0@"
  ja: "@a@bビアンカ「おじいさん　消えちゃった……。\n\t博物館のことで　いろいろ\n\tお世話になったのに……\n@c0@"
52:
  de: "@aBianca@bWie schade, dass wir nicht genug Zeit hatten, um ihm richtig zu danken.\n@c0@"
  en: "@aBianca@bShame we didn't have enough time to\r\nthank him properly.\n@c0@"
  es: "@aBianca@bLástima no haber tenido tiempo de darle las gracias como se merecía.\n@c0@"
  fr: "@aBianca@bC'est dommage que nous n'ayons pas eu le temps\r\nde le remercier correctement.\n@c0@"
  it: "@aBianca@bDovremmo ringraziarlo per la sua generosità...\n@c0@"
  ja: "@a@bビアンカ「お礼…\n\t言いそびれちゃったね……。\n@c0@"
53:
  de: "@aNera@bAlso hat der Geist des alten Mannes doch endlich den Weg zur Göttin gefunden.\n@c0@"
  en: "@aNera@bSo the old man's spirit has finally made its way to\r\nthe Goddess.\n@c0@"
  es: "@aNera@bAsí que lo spirito del anciano ha trovato el camino hacia la Diosa.\n@c0@"
  fr: "@aNera@bAlors l'esprit du vieil homme a fini par\r\nrejoindre la Déesse.\n@c0@"
  it: "@aNera@bGeremia è andato a godersi il riposo che tanto agognava...\n@c0@"
  ja: "@a@bフローラ「おじいさんの　たましいは\n\t天に　召されたのですね。\n@c0@"
54:
  de: "@aNera@bEr wird mir fehlen, aber es ist gut, dass er schließlich doch noch seine Reise gen Himmel angetreten hat.\n@c0@"
  en: "@aNera@bI'll miss him, but it's good that he's made his journey to the heavens at last.\n@c0@"
  es: "@aNera@bVeramente, le echaré de menos, pero me alegro de que haya podido viajar hacia los cielos al fin.\n@c0@"
  fr: "@aNera@bIl va me manquer, mais c'est une bonne chose qu'il\r\nait enfin réussi à partir pour les cieux.\n@c0@"
  it: "@aNera@bSono molto felice di aver contribuito a realizzare il suo sogno...\n@c0@"
  ja: "@a@bフローラ「さみしいですけど　これで\n\tよかったんですわ……。\n@c0@"
55:
  de: "@a%0%a001240@bEr ist weg! Heißt das, wir werden ihn nicht wiedersehen?\n@c0@"
  en: "@a%0%a001240@bHe's gone! Does that mean we won't get to see him any more?\n@c0@"
  es: "@a%0%a001240@b¡Se ha ido! ¿Eso quiere decir que ya no lo veremos más?\n@c0@"
  fr: "@a%0%a001240@bIl est partiⓠ Ça veut dire qu'on ne le verra\nplus jamaisⓡ\n@c0@"
  it: "@a%0%a001240@bMa dov'è andato?!\nDov'è finito il vecchietto, eh?!\n@c0@"
  ja: "@a@b%a001240「いなくなっちゃったよ。\n\tおじいさんには　もう会えないの？\n@c0@"
56:
  de: "@a%0%a001250@bDer alte Firle Franz ist vielleicht nicht mehr direkt bei uns...\n@c0@"
  en: "@a%0%a001250@bOld Man Nick Knack may be no longer with us...\n@c0@"
  es: "@a%0%a001250@bPuede que el abuelo Nino ya no esté entre nosotros...\n@c0@"
  fr: "@a%0%a001250@bLe vieux Bricabrac n'est peut-être plus avec nous...\n@c0@"
  it: "@a%0%a001250@bGeremia è andato a dormire...?\n@c0@"
  ja: "@a@b%a001250「おじいさん　もう\n\t消えちゃったけど……\n@c0@"
57:
  de: "@a%0%a001250@bAber ich glaube, er ist irgendwo ganz in unserer Nähe.\n@c0@"
  en: "@a%0%a001250@bBut I can't help feeling that he's not too far away.\n@c0@"
  es: "@a%0%a001250@bPero no puedo evitar tener la sensación de que no está lejos.\n@c0@"
  fr: "@a%0%a001250@b... mais j'ai quand même l'impression qu'il n'est\npas très loin.\n@c0@"
  it: "@a%0%a001250@bO forse no?\nHo la sensazione che ci stia osservando...\n@c0@"
  ja: "@a@b%a001250「なんだか　まだ\n\t近くにいるような気がするね……。\n@c0@"
58:
  de: "@aSancho@bNur wegen deiner Großtaten, Meine Majestät, ist das Firlefanzeum jetzt so ein herrlisser Ort.\n@c0@"
  en: "@aSancho@bEes because of your efforts, My Majesty, that thees knick-knackatory ees esuch a fine place now.\n@c0@"
  es: "@aSancho@bSu esfuerzo nomás, Majestad, ha hecho que este musenino sea el lugar padrísimo que es ahora.\n@c0@"
  fr: "@aSancho@bC'est grâce à tes efforts que la Galericabrac est devenu oun si bel endroit, M-Majesté.\n@c0@"
  it: "@aSancho@bChico, gracias a ti el Museo del Souvenir es diventato una esplendida attrazione visitata da muchissima gente.\n@c0@"
  ja: "@a@bサンチョ「%a000090王の　がんばりで\n\tここも　りっぱな博物館になりました。\n@c0@"
59:
  de: "@aSancho@bDieser alte Señor, er kann nun endliss in Frieden ruhen.\n@c0@"
  en: "@aSancho@bThees old señor, now he can rest at last.\n@c0@"
  es: "@aSancho@bY, al fin, ese abuelito pues puede descansar.\n@c0@"
  fr: "@aSancho@bLe vieux señor peut enfin reposer en paix.\n@c0@"
  it: "@aSancho@bAhora l'anziano señor puede reposare en pace.\n¡Esperiamo que no gli venga en mente de chiederce qualche altros favores!\n@c0@"
  ja: "@a@bサンチョ「あの方も　安心して\n\t眠れることでしょう。\n@c0@"
60:
  de: "@aOtto@bIch wusste immer, dass wir uns eines Tages von ihm würden verabschieden müssen.\n@c0@"
  en: "@aTuppence@bI always knew the time to say goodbye would be upon us one day.\n@c0@"
  es: "@aAlazar@bSiempre supe que algún día llegaría el momento de decir adiós.\n@c0@"
  fr: "@aInnocent@bJe savais qu'il faudrait lui dire au revoir un jour.\n@c0@"
  it: "@aSimon@bOdio gli addii. Sono momenti tristi, deprimenti.\nSembrano quasi la pietra tombale che chiude definitivamente una pagina della nostra vita.\n@c0@"
  ja: "@a@bピピン「いつかは　お別れするんだと\n\tわかってはいましたが……\n@c0@"
61:
  de: "@aOtto@bAber das heißt ja nicht, dass es leichter wird, wenn dieser Tag dann tatsächlich kommt.\n@c0@"
  en: "@aTuppence@bBut that doesn't stop it from being hard to come to terms with when it happens.\n@c0@"
  es: "@aAlazar@bPero no por eso es menos difícil de aceptar cuando llega.\n@c0@"
  fr: "@aInnocent@bMais ça ne rend pas les choses plus faciles\r\npour autant.\n@c0@"
  it: "@aSimon@bPreferisco gli ⓕarrivederciⓖ, perché lasciano la speranza di incontrarsi ancora. Dirsi ⓕarrivederciⓖ è un segno di ottimismo e di fiducia nel futuro!\n@c0@"
  ja: "@a@bピピン「いざ　その時をむかえると\n\tやっぱりつらいです。\n@c0@"
62:
  de: "@aBianca@bNa, so eine Überraschung! Er meinte nur, dass er jetzt ein Nickerchen machen geht!\n@c0@"
  en: "@aBianca@bWell, there's a turn-up! He just meant he was goin' off for a kip!\n@c0@"
  es: "@aBianca@b¡Vaya sorpresa! ¡Resulta que solo iba a echar una cabezadita!\n@c0@"
  fr: "@aBianca@bEh bien, je ne m'y attendais pasⓠ Il a juste dit qu'il allait faire une petite siesteⓠ\n@c0@"
  it: "@aBianca@bSta dormendo come un ghiro...\n@c0@"
  ja: "@a@bビアンカ「なんか\n\tひょうしぬけしちゃった……。\n\t本当に　寝るって意味だったんだ。\n@c0@"
63:
  de: "@aNera@bEs ist schön, dass er so gut schläft, aber...\nIrgendwie bin ich jetzt doch ein wenig durcheinander.\n@c0@"
  en: "@aNera@bIt's good that he's having a nice sleep, but...\nOoh, this is all rather bemusing.\n@c0@"
  es: "@aNera@bVa bene que se eche una siesta pero...\r\n¡Oh!, esto es muy desconcertante.\n@c0@"
  fr: "@aNera@bC'est bien qu'il se repose, mais...\r\nOoh, tout cela est assez déconcertant.\n@c0@"
  it: "@aNera@bGeremia dorme come un bambino...\n@c0@"
  ja: "@a@bフローラ「気持ちよさそうに\n\t眠っていらっしゃいますけど…\n\tちょっと　ふくざつな気分ですわ。\n@c0@"
64:
  de: "@a%0%a001240@bDer alte Mann scheint vergessen zu haben, dass er ein Gespenst ist!\n@c0@"
  en: "@a%0%a001240@bThe old man seems to have forgotten he's a ghost!\n@c0@"
  es: "@a%0%a001240@b¡Parece que el abuelete se ha olvidado de que es un fantasma!\n@c0@"
  fr: "@a%0%a001240@bLe vieux monsieur semble avoir oublié\nqu'il est un fantômeⓠ\n@c0@"
  it: "@a%0%a001240@bMa insomma, quanti anni ha quel signore?!\n@c0@"
  ja: "@a@b%a001240「おじいさん　自分が\n\tゆうれいだって　忘れてたりして。\n@c0@"
65:
  de: "@a%0%a001240@bEr sieht nicht so aus, als wollte er in nächster Zeit aufwachen. Aber jetzt kommen wir allein zurecht, stimmt's?\n@c0@"
  en: "@a%0%a001240@bHe doesn't look like he'll be waking up for a while.\nBut we can cope on our own now, right?\n@c0@"
  es: "@a%0%a001240@bNo parece que se vaya a despertar en un buen rato.\nPero nos las podemos arreglar solos, ¿verdad?\n@c0@"
  fr: "@a%0%a001240@bJe crois qu'il ne va pas se réveiller de sitôt. Mais on peut se débrouiller tout seuls, maintenant, nonⓡ\n@c0@"
  it: "@a%0%a001240@bGeremia dev'essere davvero stanco. Credo che non si sveglierebbe nemmeno se gli urlassi nelle orecchie...\nEh eh eh!\n@c0@"
  ja: "@a@b%a001240「おじいさん　とうぶん\n\t起きそうにないね。　でも　もう\n\tボクたちだけで　大丈夫だよね？\n@c0@"
66:
  de: "@a%0%a001250@bMir war so, als würde ich seine Gegenwart immer noch spüren, aber ich hätte nicht gedacht, dass es deswegen war, weil er noch hier war!\n@c0@"
  en: "@a%0%a001250@bI did feel like I could still sense his presence, but I didn't realise that was because he was still here!\n@c0@"
  es: "@a%0%a001250@bMe parecía sentir su presencia, pero ¡no pensé que fuese porque estaba presente!\n@c0@"
  fr: "@a%0%a001250@bJ'avais l'impression que je pouvais toujours sentir sa présence, mais je n'avais pas réalisé que c'était parce qu'il était toujours làⓠ\n@c0@"
  it: "@a%0%a001250@bNon credo che Geremia si sveglierà tanto presto...\n@c0@"
  ja: "@a@b%a001250「おじいさんの　気配が\n\tのこってたように　感じたけど……\n\t本当に　まだ　いたのね。\n@c0@"
67:
  de: "@a%0%a001250@bEr schläft so tief. Glaubst du, es ist in Ordnung, dass er keine Anstalten macht, zur Göttin zu gehen?\n@c0@"
  en: "@a%0%a001250@bHe's in such a deep sleep. Do you think it's okay that he's not making any moves to go to the Goddess?\n@c0@"
  es: "@a%0%a001250@bEstá sumido en un profundo sueño. ¿Crees que es correcto que no mueva un dedo para ir en busca de la Diosa?\n@c0@"
  fr: "@a%0%a001250@bIl dort si profondément. Tu crois que c'est normal qu'il ne bouge pas du tout pendant qu'il rejoint la Déesseⓡ\n@c0@"
  it: "@a%0%a001250@bNon avevo mai visto nessuno dormire tanto profondamente!\nNon avrà mica perso i sensi, eh?\n@c0@"
  ja: "@a@b%a001250「すご～く　ふかく眠ってる……。\n\t神さまのところに　行かなくて\n\tいいのかな？\n@c0@"
68:
  de: "@aSancho@bSí, er sieht ganz genau gleiss aus wie du, wenn du deine Siesta machst!\n@c0@"
  en: "@aSancho@bSí, thees ees how you take the siesta!\n@c0@"
  es: "@aSancho@b¡Órale, este abuelito sí que sabe lo que es una siesta!\n@c0@"
  fr: "@aSancho@bSi, c'est exactement comme ça qu'il faut\nfaire la siestaⓠ\n@c0@"
  it: "@aSancho@b¡Caramba!\n¡Esta es la mejor siesta que yo abbia mai visto en toda la mia vida!\n@c0@"
  ja: "@a@bサンチョ「まあ　眠っていることに\n\tちがいはありませんけど……。\n@c0@"
69:
  de: "@aSancho@bAlso, wenn dieser alte Señor jetzt schläft, dann bedeutet das sisser, dass du jetzt der Jefe hier bist, Meine Majestät.\n@c0@"
  en: "@aSancho@bNow thees old señor, he ees esleeping, eet means you have become the real man, My Majesty.\n@c0@"
  es: "@aSancho@bSi el abuelito duerme, eso quiere decir que usted es ahora el mero mero, Majestad.\n@c0@"
  fr: "@aSancho@bMaintenant que le vieux señor est endormi, c'est toi qui prends les commandes, M-Majesté.\n@c0@"
  it: "@aSancho@bL'anziano señor está dormendo.\nAhora sei tu el capo aquí, chico.\n@c0@"
  ja: "@a@bサンチョ「デスじいさんが　ゆっくり\n\t眠れるってことは　%a000090王が\n\t一人前になったということですよ。\n@c0@"
70:
  de: "@aOtto@bIch glaub', ich hab noch nie ein schnarchendes G'spenst g'sehen.\n@c0@"
  en: "@aTuppence@bI don't believe I've ever seen a snoring ghost before.\n@c0@"
  es: "@aAlazar@bCreo que es la primera vez que veo roncar a un fantasma.\n@c0@"
  fr: "@aInnocent@bJe crois que je n'avais encore jamais vu\r\nde fantôme qui ronfle.\n@c0@"
  it: "@aSimon@bSe esistessero i campionati mondiali di sonno, il vecchio Geremia vincerebbe di sicuro il primo premio!\n@c0@"
  ja: "@a@bピピン「いびきをかいて　眠る\n\tゆうれいなんて　初めて見ました。\n@c0@"
71:
  de: "@aGriselda@bDas ist ein schönes großes Gebäude. Aber ich würd' hier nicht leben wollen. Hier ist ja weit und breit nichts los.\n@c0@"
  en: "@aDebora@bThat's a decent-sized building.\r\nI wouldn't want to live here, though.\r\nThere's nothing for miles around.\n@c0@"
  es: "@aStefania@bEs un edificio de buen tamaño.\r\nPero no me gustaría vivere ahí.\r\nNo hay niente en kilómetros a la redonda.\n@c0@"
  fr: "@aPandora@bC'est un bâtiment de belle taille. Mais je n'aimerais\r\npas vivre ici. Il n'y a rien à des kilomètres à la ronde.\n@c0@"
  it: "@aViola@bL'edificio non è male, ma non c'è nulla intorno per miglia e miglia! No, non mi piacerebbe vivere qui: il posto è troppo solitario...\n@c0@"
  ja: "@a@bデボラ「ずいぶん　大きな建物ねえ。\n\tでも　周りに何もないから\n\t私は　住みたいとは　思わないわね。\n@c0@"
72:
  de: "@aGriselda@bIch verstehe. Er war noch nicht fertig mit dem, was er tun wollte, als er starb. Darum wurde er zum Gespenst und konnte nicht von hier fort.\n@c0@"
  en: "@aDebora@bI see. He had work left undone when he died. That's why he became a ghost and couldn't leave the place.\n@c0@"
  es: "@aStefania@bCapitto. Murió dejando asuntos sin resolver. Por eso se convirtió en fantasma y no pudo dejar el lugar.\n@c0@"
  fr: "@aPandora@bJe vois. Il avait laissé une tâche inachevée quand il est mort. C'est pour ça qu'il est devenu un fantôme et qu'il n'a pas pu quitter cet endroit.\n@c0@"
  it: "@aViola@bTemo che non riuscirà a trovare pace fino a quando non sarà entrato in possesso del souvenir che tanto sogna...\n@c0@"
  ja: "@a@bデボラ「みれんが　残ったから\n\tゆうれいになってまで\n\tここに　いついてるのね。\n@c0@"
73:
  de: "@aGriselda@bWenn er es so gern sehen will, warum sucht er es nicht selbst? Er ist doch ein Gespenst, da wird ihn die Reise wohl kaum ermüden.\n@c0@"
  en: "@aDebora@bIf he wants to see it that much, why doesn't he just go and find it himself? He's a ghost now, so it's not like the journey would wear him out.\n@c0@"
  es: "@aStefania@bSi tanto le interesa, ¿por qué no va él? Es un fantasma, no va a cansarle el viaggio.\n@c0@"
  fr: "@aPandora@bS'il a si envie que ça de le voir, pouquoi il ne va pas simplement le chercher lui-mêmeⓡ C'est un fantôme, maintenant, le voyage ne risque plus de le tuer.\n@c0@"
  it: "@aViola@bSe ci tiene tanto a quel souvenir, potrebbe anche andare a cercarlo lui stesso, no?\nChi glielo impedisce?\n@c0@"
  ja: "@a@bデボラ「見たいなら　見に行けばいいじゃない。\n\tゆうれいなんだから　疲れないでしょうに。\n@c0@"
74:
  de: "@aGriselda@bIch hab's nicht gern, wenn man mir sagen will, was ich zu tun habe. Komm, wir gehen.\n@c0@"
  en: "@aDebora@bI don't like taking orders from anyone.\nLet's get out of here.\n@c0@"
  es: "@aStefania@bMe dispiace que me den órdenes.\nSalgamos de aquí.\n@c0@"
  fr: "@aPandora@bJe n'aime pas recevoir des ordres. De personne. Sortons d'ici.\n@c0@"
  it: "@aViola@bNon ho una pietra al posto del cuore...\nÈ solo che non mi piace prendere ordini dagli altri.\n@c0@"
  ja: "@a@bデボラ「私　誰かに命令されるのが\n\tとにかく　イヤなのよ。\n\tほっといて　行くわよ。\n@c0@"
75:
  de: "@aGriselda@bDu willst ihn doch wohl nicht suchen gehen, was?\n@c0@"
  en: "@aDebora@bYou're not planning on going in search of it, are you?\n@c0@"
  es: "@aStefania@b¿Tienes intenzione de ir a buscar eso?\n@c0@"
  fr: "@aPandora@bTu as vraiment l'intention de partir à sa rechercheⓡ\n@c0@"
  it: "@aViola@bNon avrai mica intenzione di imbarcarti in questa ricerca?!\n@c0@"
  ja: "@a@bデボラ「あんた　まさか\n\tさがしに行く気？\n@c0@"
76:
  de: "@aGriselda@bNa schön, schon gut, wenn's denn unbedingt sein muss, dann komme ich eben mit, aber ich helf' dir nicht suchen.\n@c0@"
  en: "@aDebora@bFine, fine, if you insist. I'll come with you, but I'm not going to help you look.\n@c0@"
  es: "@aStefania@bVa bene, si insistes te doy permesso. Iré contigo, pero no pienso buscar.\n@c0@"
  fr: "@aPandora@bBon, bon, si tu insistes. Je vais t'accompagner, mais pas question que je t'aide à chercher.\n@c0@"
  it: "@aViola@bBah, come preferisci.\nMa sappi che, se davvero vuoi andare, io verrò con te!\n@c0@"
  ja: "@a@bデボラ「仕方ないわね。\n\tでも　私はついていくだけだから\n\t探すのは　あんた一人で　しなさいよね。\n@c0@"
77:
  de: "@aGriselda@bHm, das ist ja komisch. Und ich hätte gedacht, so eine spannende kleine Aufgabe wäre genau das Richtige für dich.\n@c0@"
  en: "@aDebora@bHm, that's odd. I was sure a little challenge like this would be just your cup of tea.\n@c0@"
  es: "@aStefania@bMmm, qué raro. Pensaba que no dejarías pasar un reto così.\n@c0@"
  fr: "@aPandora@bMmm, c'est bizarre. J'étais certaine qu'un petit défi comme celui-là te plairait.\n@c0@"
  it: "@aViola@bDavvero? Avrei scommesso che non ti saresti lasciato sfuggire l'occasione di vivere una di quelle avventure bislacche che sembrano piacerti tanto...\n@c0@"
  ja: "@a@bデボラ「また　あんたのことだから\n\tひきうけるかと思ったけど……\n\tめずらしいわね。\n@c0@"
78:
  de: "@aGriselda@bDas Souvenir seiner Träume... Es ist ein bisschen lästig, aber wollen wir sehen, ob wir es auftreiben können?\n@c0@"
  en: "@aDebora@bA dream souvenir... Sounds like a bit of a pain, but shall we see if we can find it?\n@c0@"
  es: "@aStefania@bUn espléndido souvenir... Sembra un poco complicado, ¿ma vamos a buscarlo, a ver si damos con él?\n@c0@"
  fr: "@aPandora@bUn souvenir de rêve... Ça a l'air un peu barbant,\nmais est-ce qu'on ne pourrait pas essayer de le retrouverⓡ\n@c0@"
  it: "@aViola@bConfesso di essere curiosa di scoprire per quale motivo Geremia pensa che il souvenir di cui parla sia il più bello di tutti...\n@c0@"
  ja: "@a@bデボラ「幻の名産品ねえ……。\n\tめんどくさいけど　探してみる？\n@c0@"
79:
  de: "@aGriselda@bMuseumskurator? Na, wollen wir hoffen, dass das nicht mit allzu viel Arbeit verbunden ist.\n@c0@"
  en: "@aDebora@bMuseum curator? It'd better not be too much work.\n@c0@"
  es: "@aStefania@b¿Conservador de museo? Espero que no dé mucho lavoro.\n@c0@"
  fr: "@aPandora@bConservateur de muséeⓡ Ça a intérêt à ne pas demander trop de travail.\n@c0@"
  it: "@aViola@bE così saresti il nuovo direttore del Museo?!\nBuon per te!\n㈡\nSpero solo che la cosa non ti impegni molto, perché hai già abbastanza da fare a servirmi e riverirmi ventiquattr'ore su ventiquattro!\n@c0@"
  ja: "@a@bデボラ「博物館の館長って\n\tなにをするのよ。\n@c0@"
80:
  de: "@aGriselda@bJetzt, da er uns als Helfer gewonnen hat, ist seine Arbeit hier offenbar erledigt und er kann endlich gehen.\n@c0@"
  en: "@aDebora@bNow that he's enlisted our help, it looks like his business here is done and he can finally leave.\n@c0@"
  es: "@aStefania@bAhora que cuenta con nuestra ayuda, sembra que sus asuntos terrenales han terminado y al fine puede marcharse.\n@c0@"
  fr: "@aPandora@bMaintenant qu'il s'est assuré de notre aide,\r\non dirait que sa tâche ici est terminée\r\net qu'il peut enfin partir.\n@c0@"
  it: "@aViola@bOra che ha raggiunto il suo scopo, può finalmente concedersi un po' di riposo.\n@c0@"
  ja: "@a@bデボラ「人に集めさせるだけ　集めさせて\n\t自分だけ　満足して　いなくなったわね。\n@c0@"
81:
  de: "@aGriselda@bHmpf. Er hätte sich ein bisschen deutlicher ausdrücken können. Als er sagte, er könne nun in Frieden ruhen, dachte ich schon, wir wären ihn los.\n@c0@"
  en: "@aDebora@bHmph! He could've picked his turn of phrase more carefully. I thought he meant he was gone for good when he said he was going to rest in peace.\n@c0@"
  es: "@aStefania@b¡Mmm! Podría expresarse con más cuidado. Cuando dijo que se iba a descansar en pace pensé que ya era per sempre.\n@c0@"
  fr: "@aPandora@bMmpfⓠ Il aurait pu mieux choisir ses mots. J'ai cru qu'il voulait dire qu'il partait pour de bon quand il a dit qu'il allait reposer en paix.\n@c0@"
  it: "@aViola@bGuardalo, come dorme!\nScommetto che erano anni che non riposava così tranquillamente...\n@c0@"
  ja: "@a@bデボラ「まあ　寝るって　言ったけど……\n\tまぎらわしいまね　しないでほしいわ。\n@c0@"
