0:
  de: "@aBianca@bErstaunlich, mitten im Wald auf ein solches Gebäude zu stoßen, nicht?\n@c0@"
  en: "@aBianca@bIt's pretty amazin' findin' such a huge buildin' in the middle of the woods like this, eh?\n@c0@"
  es: "@aBianca@bEs bastante alucinante encontrarse un edificio así de inmenso aquí, en medio del bosque, ¿eh?\n@c0@"
  fr: "@aBianca@bC'est assez surprenant de tomber sur un bâtiment aussi imposant au milieu des bois, heinⓡ\n@c0@"
  it: "@aBianca@bNon mi sarei mai aspettata di trovare un edificio del genere nel bel mezzo della foresta...\nÈ stupefacente!\n@c0@"
  ja: "@a@bビアンカ「森の中に　こんな\n\t大きな家が　建ってるなんて……\n\tちょっと　あこがれちゃうな。\n@c0@"
1:
  de: "@aNera@bWas für eine wunderschöne Villa. Ob hier wohl jemand Berühmtes lebt?\n@c0@"
  en: "@aNera@bWhat a beautiful mansion. I wonder if someone famous lives here.\n@c0@"
  es: "@aNera@b¡Qué bella mansión! Me pregunto si es la casa de qualcuno famoso.\n@c0@"
  fr: "@aNera@bQuel magnifique manoirⓠ Je me demande s'il appartient à quelqu'un de célèbre.\n@c0@"
  it: "@aNera@bChe bel palazzo!\nA giudicare dall'aspetto, direi che ci vive una persona di un certo rango.\n@c0@"
  ja: "@a@bフローラ「きれいな　お屋敷ですわね。\n\tどなたか　名のある方が\n\t住んでいらっしゃるのかしら？\n@c0@"
2:
  de: "@a%0%a001240@bBoah! Was glaubst du, wer eine so riesige Villa wohl gebaut hat?\n@c0@"
  en: "@a%0%a001240@bWow! Who do you think built such a huge mansion?\n@c0@"
  es: "@a%0%a001240@b¡Vaya! ¿Quién vivirá en una mansión así de inmensa?\n@c0@"
  fr: "@a%0%a001240@bWaouhⓠ Qui est-ce qui a construit un manoir\naussi immense, d'après toiⓡ\n@c0@"
  it: "@a%0%a001240@bAccidenti, che casa grande!\nChissà quanto tempo avranno impiegato per costruirla...\n@c0@"
  ja: "@a@b%a001240「すっごーい！　こんなに大きな\n\tお屋敷　だれが建てたんだろう？\n@c0@"
3:
  de: "@a%0%a001250@bDas ist sehr eindrucksvoll, aber es sieht aus, als sei es schon vor einer ganzen Weile erbaut worden.\n@c0@"
  en: "@a%0%a001250@bIt's a very impressive building, but it looks like it was put up quite a few years ago now.\n@c0@"
  es: "@a%0%a001250@bEs un edificio impresionante, pero parece que ya hace unos cuantos años que lo construyeron.\n@c0@"
  fr: "@a%0%a001250@bC'est un bâtiment très impressionnant, mais on dirait qu'il est un peu vieux, quand même.\n@c0@"
  it: "@a%0%a001250@bQuesto palazzo è davvero bello.\nHa un che di antico, di maestoso...\n@c0@"
  ja: "@a@b%a001250「このお屋敷　きれいだけど\n\t建てられてから　何十年も\n\tたってるみたい。\n@c0@"
4:
  de: "@a%0%a001250@bAuf den ersten Blick wirkt es ganz ruhig, aber hier herrscht eine sehr seltsame Atmosphäre.\n@c0@"
  en: "@a%0%a001250@bIt feels calm on the surface, but there's a very strange air to it.\n@c0@"
  es: "@a%0%a001250@bParece de lo más normal por fuera, pero la sensación que produce es muy extraña.\n@c0@"
  fr: "@a%0%a001250@bIl a l'air paisible comme ça, mais il fait\nune drôle d'impression.\n@c0@"
  it: "@a%0%a001250@bSembra un posto tranquillo, però percepisco una strana sensazione, qualcosa che non riesco nemmeno a definire.\n@c0@"
  ja: "@a@b%a001250「おだやかだけど\n\tふしぎなチカラを感じるの。\n@c0@"
5:
  de: "@aSancho@bSchau dir das an! Iss hätte nie erwartet, dass iss hier auf solsse Schönheit stoße! Das berührt miss zutiefst!\n@c0@"
  en: "@aSancho@bLook at thees! I, I no expect to esee esuch\r\nbeauty een a place like thees.\r\nEes, ees eso moving! (blub)\n@c0@"
  es: "@aSancho@b¡Ay, caramba! Pues no esperaba una belleza semejante en un lugarcito así.\r\n¡Qué emoción! (snif)\n@c0@"
  fr: "@aSancho@bRegarde-moi çaⓠ J-Je ne m'attendais pas à trouver oune telle m-merveille dans oun endroit pareil.\nC-C'est touchantⓠ (snif)\n@c0@"
  it: "@aSancho@b¡Ay, que maravilla! No piensavo de trovare qualcosas de tanto bello en un luego como esto...\nYo... Yo me commuovos... ¡Sob!\n@c0@"
  ja: "@a@bサンチョ「おお！　これは　すばらしい！\n\tこのようなところに　こんな美しい\n\t建物があるとは　思いませんでした。\n@c0@"
6:
  de: "@aOtto@bOh Mann! Ich bin ganz baff! Das sieht ja toll aus!\n@c0@"
  en: "@aTuppence@bGood heavens! I'm rather bowled over by the place, it's so beautiful.\n@c0@"
  es: "@aAlazar@b¡Cielo santo! Me he quedado pasmado, es precioso, de verdad.\n@c0@"
  fr: "@aInnocent@bPar la Déesseⓠ Cet endroit est stupéfiant de beauté.\n@c0@"
  it: "@aSimon@bSanta dea!\nChe bellezza...! Sono senza parole...\n@c0@"
  ja: "@a@bピピン「はっ！　あまりにも\n\tごうかで　美しい建物だったので\n\tつい　見とれてしまいました。\n@c0@"
7:
  de: "@aBianca@bStell dir nur vor, so lange zu warten, dass man darüber stirbt! Vielleicht sollten wir dem alten Mann helfen?\n@c0@"
  en: "@aBianca@bFancy waitin' so long you end up dyin'! Maybe we should try and help the old guy out, eh?\n@c0@"
  es: "@aBianca@b¡Qué curioso, esperar tanto tiempo y acabar muriéndose! Venga, vamos a echarle una mano al pobre abuelo, ¿eh?\n@c0@"
  fr: "@aBianca@bTu te rends compteⓡ Il a attendu si longtemps qu'il\na fini par mourirⓠ Nous devrions peut-être essayer d'aider ce vieil homme, nonⓡ\n@c0@"
  it: "@aBianca@bSe lo facciamo aspettare ancora un po', il poveretto se ne andrà all'altro mondo senza aver realizzato il suo sogno. Perché non lo aiutiamo?\n@c0@"
  ja: "@a@bビアンカ「まちくたびれて　死んだって……\n\tこれも　情熱のひとつとして\n\tうけとったほうが　いいのかな？\n@c0@"
8:
  de: "@aBianca@bDas ist also ein Museum. Tja, der Standort ist ja schön, aber es liegt nicht direkt am Wegesrand, wie?\n@c0@"
  en: "@aBianca@bSo this place is a museum. It's a lovely spot, but it en't exactly on the beaten track, is it?\n@c0@"
  es: "@aBianca@bAsí que este lugar es un museo. Es un sitio muy bello, pero un poco apartado, ¿no crees?\n@c0@"
  fr: "@aBianca@bAlors comme ça, c'est un musée. C'est un bel endroit, mais un peu isolé, heinⓡ\n@c0@"
  it: "@aBianca@bE così quest'edificio è un museo...\nCerto, è molto bello, però è un po' fuori mano.\n@c0@"
  ja: "@a@bビアンカ「ここって　博物館だったのね。\n\tステキな　ところだけど\n\t確かに　目立つ場所じゃないよね。\n@c0@"
9:
  de: "@aNera@bÄhm, meinst du, dass der alte Herr ein echtes G-Gespenst ist?\n@c0@"
  en: "@aNera@bUm, d-do you think that old gentleman is a\r\nreal g-ghost?\n@c0@"
  es: "@aNera@b¿C-crees que ese cavaliere es veramente un f-fantasma?\n@c0@"
  fr: "@aNera@bHum, euh, tu penses que ce vieil homme est un\nv-vrai f-fantômeⓡ\n@c0@"
  it: "@aNera@bAnche se arzillo, quel tipo è decisamente in là con gli anni. Chissà se, quando torneremo a trovarlo, sarà ancora viv... Ops! Che sto dicendo?!\n@c0@"
  ja: "@a@bフローラ「あ　あの　おじいさん\n\t本物の　ゆうれいさん\n\tなんですか……。\n@c0@"
10:
  de: "@aNera@bIch hatte gehofft, ich hätte mich verhört.\n@c0@"
  en: "@aNera@bI was hoping I might have misheard.\n@c0@"
  es: "@aNera@bTenía la speranza de haber oído mal.\n@c0@"
  fr: "@aNera@bJ'espérais avoir mal entendu.\n@c0@"
  it: "@aNera@bDea santissima, perdonami!\nAuguro a quel signore di campare altri cento anni. Anzi, facciamo duecento!\n@c0@"
  ja: "@a@bフローラ「できれば　私の\n\t聞きまちがい　であって\n\tほしかったのですけど。\n@c0@"
11:
  de: "@aNera@bEin altes Museum, in dem es spukt... Kaum verwunderlich, dass die Leute nicht gerade in Scharen herbeigeströmt kommen.\n@c0@"
  en: "@aNera@bA haunted old museum... Hardly the kind of place most people would be happy about going inside.\n@c0@"
  es: "@aNera@bUn museo incantato... No es a la clase de sitio adonde a la gente le apetece intrare...\n@c0@"
  fr: "@aNera@bUn vieux musée hanté... Ce n'est pas vraiment le genre d'endroit qui attire les foules.\n@c0@"
  it: "@aNera@bIl Museo si trova decisamente fuori mano.\nNon sarebbe stato meglio costruirlo in una zona più facile da raggiungere?\n@c0@"
  ja: "@a@bフローラ「古びた博物館に\n\tゆうれいさん……。\n\t中に入るのが　こわいです。\n@c0@"
12:
  de: "@a%0%a001240@bIst der alte Mann also tot?\n@c0@"
  en: "@a%0%a001240@bSo is that old man dead, then?\n@c0@"
  es: "@a%0%a001240@b¿Así que ese abuelete está muerto?\n@c0@"
  fr: "@a%0%a001240@bAlors ce vieux monsieur est mortⓡ\n@c0@"
  it: "@a%0%a001240@bMa quanti anni avrà quel signore?\n@c0@"
  ja: "@a@b%a001240「えっ　あのおじいさん\n\t死んじゃってるの？\n@c0@"
13:
  de: "@a%0%a001240@bFirlefanzeum? Das hört sich lustig an!\n@c0@"
  en: "@a%0%a001240@bThe knick-knackatory? That sounds like fun!\n@c0@"
  es: "@a%0%a001240@b¿El musenino? ¡Suena divertido!\n@c0@"
  fr: "@a%0%a001240@bLa Galericabracⓡ Ça a l'air marrantⓠ\n@c0@"
  it: "@a%0%a001240@bComunque questo Museo mi pare un'ottima idea!\nAnch'io da grande voglio aprirne uno!\n@c0@"
  ja: "@a@b%a001240「幻の名産品　かあ……。\n\tなんだか　おもしろそうだね！\n@c0@"
14:
  de: "@a%0%a001250@bWas für ein komischer alter Mann mit seinem komischen Heiligenschein und seinem komischen Stock.\n@c0@"
  en: "@a%0%a001250@bWhat a funny old man, with his funny-looking halo and his funny old stick.\n@c0@"
  es: "@a%0%a001250@bQué anciano tan curioso, con su extraño bastón y su extraño halo.\n@c0@"
  fr: "@a%0%a001250@bIl est rigolo ce vieux monsieur avec sa drôle d'auréole et son drôle de bâton.\n@c0@"
  it: "@a%0%a001250@bQuel vecchietto è davvero simpatico!\n@c0@"
  ja: "@a@b%a001250「ふしぎな　おじいさんなの。\n\tよく見ると　あたまのワッカに\n\t棒が　ついてるし……。\n@c0@"
15:
  de: "@a%0%a001250@bVielleicht ist er ja noch gar nicht richtig tot.\n@c0@"
  en: "@a%0%a001250@bMaybe he's not properly dead yet.\n@c0@"
  es: "@a%0%a001250@bA lo mejor aún no está muerto-muerto.\n@c0@"
  fr: "@a%0%a001250@bSi ça se trouve, il n'est pas encore tout à fait mort.\n@c0@"
  it: "@a%0%a001250@bPur essendo tanto anziano è ancora pieno di vitalità, no?\n@c0@"
  ja: "@a@b%a001250「まだ　成仏してないからかな？\n@c0@"
16:
  de: "@aSancho@bEs ist nisst einfach, ein Museum zu leiten, weißt du.\n@c0@"
  en: "@aSancho@bEes no easy to run a museum, you know.\n@c0@"
  es: "@aSancho@bNomás que no es fácil llevar un museo.\n@c0@"
  fr: "@aSancho@bC-Ce n'est pas facile de gérer oun museo, tu sais.\n@c0@"
  it: "@aSancho@bPienso que gestire un museo sia una cosa muy difícil...\n@c0@"
  ja: "@a@bサンチョ「博物館とは　また\n\tたいそうなものを……。\n@c0@"
17:
  de: "@aSancho@bAber dieser alte Señor, er sieht sehr gut, no? Er hat gleiss gesehen, was wir bei uns haben.\n@c0@"
  en: "@aSancho@bBut thees old señor, he esees very well, no?\nHe knows what we are carrying estraight away.\n@c0@"
  es: "@aSancho@bPero ese viejito lo hace retebien, ¿verdad?\r\nHa sabido de volada lo que llevábamos.\n@c0@"
  fr: "@aSancho@bMais ce vieux señor est plutôt doué, noⓡ\nIl sait ce que nous t-transportons au premier\nc-coup d'œil.\n@c0@"
  it: "@aSancho@bEppures quell'anziano señor ce riesce muy bien.\n¡Ay, que persona piena de energias!\n@c0@"
  ja: "@a@bサンチョ「それにしても　ひと目で\n\t私たちの持っている名産品を見ぬくとは\n\tあのご老人　なかなかですね。\n@c0@"
18:
  de: "@aOtto@bHmm. Eigentlich haben wir ohnehin schon einiges zu tun.\n@c0@"
  en: "@aTuppence@bHmm. We already have quite a lot on our plates as it is, really.\n@c0@"
  es: "@aAlazar@bMmm. Yo creo que ya estamos hasta arriba de misiones.\n@c0@"
  fr: "@aInnocent@bMmm. Nous avons déjà pas mal de pain sur la planche.\n@c0@"
  it: "@aSimon@bUhm, di cose da fare ne abbiamo già fin troppe...\n@c0@"
  ja: "@a@bピピン「う～ん…　ボクたちには\n\tやらないといけないことが\n\tたくさんあるんですけど……。\n@c0@"
19:
  de: "@aOtto@bAber wenn wir dadurch an ein so fabelhaftes Gebäude gelangen, können wir wohl schlecht Nein sagen!\n@c0@"
  en: "@aTuppence@bBut if agreeing to this means we take control of such a fabulous building, we can't possibly say no!\n@c0@"
  es: "@aAlazar@b¡Pero si aceptar esto significa tomar el control de este edificio maravilloso, no podemos negarnos!\n@c0@"
  fr: "@aInnocent@bMais si en acceptant, nous nous retrouvons à la tête de ce fantastique édifice, comment dire nonⓡ\n@c0@"
  it: "@aSimon@bSe accettassimo la richiesta di quel tipo, però, potremmo diventare suoi soci nella gestione di questo posto! L'idea mi stuzzica...\n@c0@"
  ja: "@a@bピピン「でも　こんな　りっぱな\n\t建物を　もらえるとなると\n\t考えちゃいますよね！\n@c0@"
20:
  de: "@aBianca@bWir haben selbst noch einiges zu tun, also dürfen wir jetzt nicht durch die Weltgeschichte reisen und Andenken nachjagen.\n@c0@"
  en: "@aBianca@bWe've got our own agenda, so we can't very well go travellin' about the place huntin' out souvenirs the whole time.\n@c0@"
  es: "@aBianca@bTenemos nuestras propias obligaciones, así que no podemos pasarnos todo el tiempo recorriendo el mundo en busca de souvenires, ¿sabes?\n@c0@"
  fr: "@aBianca@bOn a déjà beaucoup de choses à faire, alors on\r\nne peut pas passer notre temps à voyager pour trouver des souvenirs.\n@c0@"
  it: "@aBianca@bAbbiamo già molte cose a cui pensare, il che vuol dire che non possiamo perdere tempo a girare il mondo alla ricerca di souvenir.\n@c0@"
  ja: "@a@bビアンカ「私たちの旅には　目的があるから\n\t名産ばかりを　集めてまわるわけには\n\tいかないのよね……。\n@c0@"
21:
  de: "@aBianca@bAber wenn uns unterwegs zufällig das eine oder andere über den Weg läuft, dann wüsste ich nicht, was das schaden könnte.\n@c0@"
  en: "@aBianca@bStill, if we just happen to come across a few along our way, then I dun't see that doin' any harm.\n@c0@"
  es: "@aBianca@bPero, si vamos encontrando alguno, no veo que haya nada de malo en hacernos con ellos.\n@c0@"
  fr: "@aBianca@bCeci dit, si nous tombons sur des objets intéressants en chemin, je ne vois pas en quoi ce serait gênant de les récupérer.\n@c0@"
  it: "@aBianca@bTuttavia, se ne trovassimo qualcuno strada facendo, potremmo portarlo qui non appena ci fosse possibile. Che ne dici?\n@c0@"
  ja: "@a@bビアンカ「でも　ついでの時にでも\n\t手に入ったら　持ってきてあげることに\n\tしましょうか？\n@c0@"
22:
  de: "@aNera@bIch glaube, die meisten wären bei einem so seltsamen Vorschlag skeptisch.\n@c0@"
  en: "@aNera@bI should think most people would question a strange proposition like that.\n@c0@"
  es: "@aNera@bCredo que cualquier persona dudaría ante una propuesta tan peregrina como esa.\n@c0@"
  fr: "@aNera@bJe crois que la plupart des gens seraient assez perplexes devant une telle requête.\n@c0@"
  it: "@aNera@bNon so perché, ma sento che dovremmo aiutarlo...\n@c0@"
  ja: "@a@bフローラ「おじいさんの　お話を聞いたら\n\t誰もが　いだく疑問だと思いますわ。\n@c0@"
23:
  de: "@a%0%a001240@bSancho hat uns immer gesagt, wir sollten tun, was wir können, um Menschen in Not zu helfen.\n@c0@"
  en: "@a%0%a001240@bSancho always told us we should do what we could to help people in need.\n@c0@"
  es: "@a%0%a001240@bSancho siempre nos decía que debíamos ayudar a las personas que lo necesitasen.\n@c0@"
  fr: "@a%0%a001240@bSancho nous a toujours dit qu'on devait faire tout notre possible pour aider les gens dans le besoin.\n@c0@"
  it: "@a%0%a001240@bLo zio Sancho ci ha sempre detto che bisogna aiutare chi è in difficoltà.\n@c0@"
  ja: "@a@b%a001240「サンチョが　こまっている人は\n\t助けてあげなさいって。\n@c0@"
24:
  de: "@a%0%a001240@bZwar ist der alte Mann streng genommen eigentlich kein Mensch mehr, sondern ein Gespenst, aber vielleicht sollten wir ihm trotzdem ein wenig helfen?\n@c0@"
  en: "@a%0%a001240@bThat old man's not exactly a person any more because he's a ghost and everything, but maybe we should still lend a hand?\n@c0@"
  es: "@a%0%a001240@bAunque ese abuelete no es exactamente una persona, porque es un fantasma y tal, creo que le deberíamos echar una mano.\n@c0@"
  fr: "@a%0%a001240@bCe vieux monsieur n'est plus vraiment une personne, vu que c'est un fantôme, mais peut-être qu'on devrait quand même lui donner un coup de mainⓡ\n@c0@"
  it: "@a%0%a001240@bA me sembra che quell'anziano signore abbia bisogno d'aiuto, quindi dovremmo dargli una mano, no?\nE poi è così simpatico!\n@c0@"
  ja: "@a@b%a001240「あの人は　もう　人じゃなくて\n\tゆうれいだけど　助けてあげたほうが\n\tいいよね？\n@c0@"
25:
  de: "@a%0%a001250@bDas Museum oder Firlefanzeum, wie er es nennt, bedeutet ihm offenbar viel. Darum kann er sich nicht davon trennen.\n@c0@"
  en: "@a%0%a001250@bThe museum, or knick-knackatory as he calls it, obviously means a lot to him. That's why he can't tear himself away.\n@c0@"
  es: "@a%0%a001250@bEl museo, o musenino como él lo llama, significa mucho para él. Por eso no puede alejarse de aquí.\n@c0@"
  fr: "@a%0%a001250@bLe musée, ou la Galericabrac, comme il l'appelle, semble avoir beaucoup d'importance à ses yeux. C'est pour ça qu'il n'arrive pas à partir.\n@c0@"
  it: "@a%0%a001250@bCredo che quell'uomo tenga molto al suo Museo...\n@c0@"
  ja: "@a@b%a001250「あのおじいさん\n\t博物館が　大事だから\n\tきっと　はなれられないのね……。\n@c0@"
26:
  de: "@aSancho@bDas ist risstig. Wenn dieser alte Señor selbst den Schnickschnack finden muss, wird das für ihn nisst leisst sein. Noch weniger leisst als wenn er noch lebte.\n@c0@"
  en: "@aSancho@bEes true. For thees old señor to find the knick-knacks heemself, ees gonna be very hard. Harder than when he was alive, even.\n@c0@"
  es: "@aSancho@bEs la puritita verdad. A este señor tan ruco le va a resultar bien difícil encontrar las cosinas. Incluso más difícil que cuando estaba vivo.\n@c0@"
  fr: "@aSancho@bC-C'est vrai. Ça doit être dur pour ce vieux señor de t-trouver des objets lui-même. Et encore plus depuis qu'il est mortⓠ\n@c0@"
  it: "@aSancho@bCerto, por un hombre tanto anziano dev'essere muy difícil andare alla ricercas de souvenir...\n㈡\n¡Pienso que alla sua età no avrò nemmenos la fuerza de morire!\n@c0@"
  ja: "@a@bサンチョ「たしかに　あのお身体では\n\t探すのに　生きているとき以上の\n\t苦労が必要になるかもしれませんね。\n@c0@"
27:
  de: "@aSancho@bFindest du nisst, wir sollten ihm helfen?\n@c0@"
  en: "@aSancho@bYou no theenk we eshould help heem?\n@c0@"
  es: "@aSancho@bDeberíamos ayudarle, órale.\n@c0@"
  fr: "@aSancho@bT-Tu ne crois pas qu'on devrait l'aiderⓡ\n@c0@"
  it: "@aSancho@bDovremmo aiutarlo, chico.\nFaremmo un'opera buena y caritatevole.\n@c0@"
  ja: "@a@bサンチョ「どうです？\n\t少しくらい　手伝ってあげては？\n@c0@"
28:
  de: "@aOtto@bHuch, hat der alte Mann einen abwesenden Blick drauf! Den sollte ich vielleicht auch üben!\n@c0@"
  en: "@aTuppence@bOoh, that old man's eyes were so distant!\r\nThat's quite a trick!\n@c0@"
  es: "@aAlazar@b¡Qué mirada tan distante, la de ese anciano!\r\n¡Qué efecto!\n@c0@"
  fr: "@aInnocent@bOoh, le vieil homme avait un regard si vagueⓠ\nC'est assez perturbantⓠ\n@c0@"
  it: "@aSimon@bChissà quante ne avrà viste quel vecchietto nel corso della sua lunga vita, eh? Tutto sommato, potremmo anche dargli una mano...\n@c0@"
  ja: "@a@bピピン「うわ～　あのおじいさん\n\tめちゃくちゃ　遠い目をしてますね。\n\tかなりの演技派ですよ。\n@c0@"
29:
  de: "@aBianca@bEin verborgener Schatz in einem Schloss! Das macht bestimmt Spaß! Wir sollten uns das mal ansehen, %a000090!\n@c0@"
  en: "@aBianca@bA hidden treasure in a castle! That sounds like fun! We should go and have a look, %a000090.\n@c0@"
  es: "@aBianca@b¡Un tesoro oculto en un castillo! ¡Suena divertido! ¿Vamos a echar un vistazo, %a000090?\n@c0@"
  fr: "@aBianca@bUn trésor caché dans un châteauⓠ Ça a l'air palpitantⓠ On devrait aller jeter un coup d'œil, %a000090.\n@c0@"
  it: "@aBianca@bUn tesoro nascosto nel Regno di Minikin?\nChe ne diresti di dare un'occhiata, %a000090?\nEh, sì! La curiosità è donna! Eh eh eh!\n@c0@"
  ja: "@a@bビアンカ「お城に　かくされてるって\n\tちょっと　おもしろそうね。\n\t%a000090　行ってみましょうよ。\n@c0@"
30:
  de: "@aNera@bWenn der alte Mann es nicht finden konnte, dann bezweifle ich fast, dass wir dabei mehr Glück haben werden.\n@c0@"
  en: "@aNera@bIf the old man was unable to find it, I'm a bit doubtful as to whether we'll have any more luck.\n@c0@"
  es: "@aNera@bSi el vecchio cavaliere no ha podido encontrarlo, dudo que nosotros vayamos a ser más afortunados.\n@c0@"
  fr: "@aNera@bSi le vieil homme n'a pas réussi à le trouver, je doute que nous ayons plus de chance que lui.\n@c0@"
  it: "@aNera@bSe la ricerca di quell'anziano signore è stata infruttuosa, non penso che noi avremo maggior successo. Uhm, forse sono troppo pessimista...\n@c0@"
  ja: "@a@bフローラ「あの　おじいさんにも\n\t見つけられなかった物　ですのに\n\t私たちに見つけられるでしょうか？\n@c0@"
31:
  de: "@a%0%a001240@bKönig Dominicus' Domäne... Ich dachte, die wäre nur wegen ihrer Schokomünzen berühmt.\n@c0@"
  en: "@a%0%a001240@bKing Dominicus's Dominion...\nI thought that place was just famous for its chocolate medalliyums.\n@c0@"
  es: "@a%0%a001240@bLos Dominios de Dominico...\nPensaba que lo único famoso de ese sitio eran sus medallones de chocolate.\n@c0@"
  fr: "@a%0%a001240@bLe domaine du roi Dominicus...\nJe croyais que cet endroit n'était connu\nque pour ses médailles en chocolat.\n@c0@"
  it: "@a%0%a001240@bCredevo che il Regno di Minikin fosse famoso solo per le medaglie di cioccolato!\n@c0@"
  ja: "@a@b%a001240「メダル王の城か……。\n\tあそこって　メダル型チョコだけが\n\t名産じゃなかったんだね。\n@c0@"
32:
  de: "@a%0%a001250@bSancho hat uns mal zu König Dominicus' Domäne mitgenommen. Aber dort habe ich nichts von einem traumhaften Souvenir gehört.\n@c0@"
  en: "@a%0%a001250@bSancho took us to King Dominicus's Dominion before.\nI don't remember hearing anything about a dream souvenir there, though.\n@c0@"
  es: "@a%0%a001250@bSancho nos llevó una vez a los Dominios de Dominico. Pero no recuerdo haber oído nada de un espléndido souvenir.\n@c0@"
  fr: "@a%0%a001250@bSancho nous a déjà emmenés au domaine du roi Dominicus, mais je ne me souviens pas avoir entendu parler d'un souvenir de rêve, là-bas.\n@c0@"
  it: "@a%0%a001250@bLo zio Sancho una volta ci ha portati nel Regno di Minikin, ma non ricordo di aver visto souvenir particolarmente pregiati in quel luogo...\n@c0@"
  ja: "@a@b%a001250「メダル王のお城なら\n\tサンチョおじさんとも　行ったの。\n\tでも　幻の名産なんて　知らなかった。\n@c0@"
33:
  de: "@aSancho@bDas Schloss von König Dominicus ist nisst weit von hier, no? Vielleisst sollten wir dort hingehen und sehen, was wir finden können.\n@c0@"
  en: "@aSancho@bThe castle of King Dominicus, ees no eso far from here, sí? Maybe we eshould go there and esee what we can find.\n@c0@"
  es: "@aSancho@bPues el castillo del rey Dominico no está muy lejos de aquí, ¿verdad? A lo mejor deberíamos ir allá a ver qué encontramos.\n@c0@"
  fr: "@aSancho@bLe ch-château du roi Dominicus n'est pas loin d'ici, noⓡ Peut-être qu'on devrait aller y faire oun\nt-tour pour voir ce qu'on peut t-trouver.\n@c0@"
  it: "@aSancho@bEl Regno de Minikin no es muy lontano da aquí.\n¿Por qué no vamos a dare un'occhiatas?\nPotremmo trovare qualcosas de interessante...\n@c0@"
  ja: "@a@bサンチョ「ここからなら　たしか\n\tメダル王の城は　近いですね。\n\tちょっとだけ　行ってみましょうか？\n@c0@"
34:
  de: "@aOtto@bDas Souvenir seiner Träume! Toll! Es geht doch nichts über eine schöne Schatzsuche!\n@c0@"
  en: "@aTuppence@bA dream souvenir... Wonderful! There's nothing like a good treasure hunt.\n@c0@"
  es: "@aAlazar@bUn espléndido souvenir... ¡Espléndido! No hay nada como una buena caza del tesoro.\n@c0@"
  fr: "@aInnocent@bUn souvenir de rêve... Fabuleuxⓠ Rien ne vaut une bonne chasse au trésor.\n@c0@"
  it: "@aSimon@bUn souvenir pregiatissimo... Uhm...\r\nNon ho la più pallida idea di cosa possa essere, ma... adoro le cacce al tesoro!\n@c0@"
  ja: "@a@bピピン「幻の名産品かあ……。\n\tなんだか　宝さがしみたいですね！\n\tう～ん　わくわく　してきたぞ！\n@c0@"
35:
  de: "@aBianca@bMeinst du, dieses traumhafte Souvenir in König Dominicus' Domäne ist wirklich etwas so Besonderes? Allmählich werde ich neugierig!\n@c0@"
  en: "@aBianca@bD'you reckon this dream souvenir over at King Dominicus's Dominion can really be all that special?\r\nI'm startin' to get a bit curious now!\n@c0@"
  es: "@aBianca@b¿Crees que el espléndido souvenir ese de los Dominios del rey Dominico será tan especial?\r\n¡Me pica la curiosidad!\n@c0@"
  fr: "@aBianca@bTu crois que le souvenir du domaine du roi Dominicus est si spécial que çaⓡ La curiosité commence à me titiller, maintenantⓠ\n@c0@"
  it: "@aBianca@bChissà cos'ha di tanto particolare lo ⓕspecialeⓖ souvenir del Regno di Minikin...\nMi piacerebbe proprio scoprirlo!\n@c0@"
  ja: "@a@bビアンカ「メダル城の　幻の名産品って\n\tそんなに　すごいものなの？\n\tなんだか　気になってきちゃったわ。\n@c0@"
36:
  de: "@aNera@bIch wünschte, wir könnten es ihm bringen, ja wirklich, aber dieses Traumsouvenir wird ziemlich schwer zu finden sein.\n@c0@"
  en: "@aNera@bI wish we could bring it to him, I really do, but this dream souvenir of his is proving rather hard to find.\n@c0@"
  es: "@aNera@bVeramente, me gustaría que se lo pudiésemos traer, pero parece que ese tal espléndido souvenir no es facile di trovare.\n@c0@"
  fr: "@aNera@bJ'aimerais vraiment que nous puissions le lui rapporter, mais ce souvenir de rêve a l'air\r\nbien difficile à trouver.\n@c0@"
  it: "@aNera@bMi piacerebbe portare a quell'uomo il souvenir speciale di cui parla, ma temo che non sarà facile trovarlo...\n@c0@"
  ja: "@a@bフローラ「見つけてさしあげたいけれど\n\t幻と　言うからには　やはり\n\tかんたんには　手に入りませんわよね。\n@c0@"
37:
  de: "@a%0%a001240@bDer alte Mann steht immer noch da und schaut hoffnungsvoll, obwohl er doch tot ist und überhaupt.\n@c0@"
  en: "@a%0%a001240@bThe old man's still standing there looking hopeful, even though he's dead and everything.\n@c0@"
  es: "@a%0%a001240@bEl abuelete sigue ahí de pie con cara de esperanza, por muy muerto que esté.\n@c0@"
  fr: "@a%0%a001240@bLe vieux monsieur est toujours plein d'espoir,\nmême mort.\n@c0@"
  it: "@a%0%a001240@bQuell'uomo è molto in là con gli anni, eppure continua a guardare al futuro con il cuore pieno di speranza.\nÈ una cosa bellissima!\n@c0@"
  ja: "@a@b%a001240「あの　おじいさん\n\tゆうれいになってからも　その名産品が\n\t見たくて　あそこに立ってるんだよね。\n@c0@"
38:
  de: "@a%0%a001240@bEigentlich tut er mir ein bisschen leid. Sollen wir versuchen, sein Traumsouvenir zu finden, von dem er dauernd erzählt, Papa?\n@c0@"
  en: "@a%0%a001240@bI feel a bit sorry for him, really. Shall we try\nand find that dream souvenir he keeps going\non about, Dad?\n@c0@"
  es: "@a%0%a001240@bMe da un poco de lástima, la verdad. ¿Por qué no intentamos encontrar ese souvenir de ensueño del que tanto habla, papá?\n@c0@"
  fr: "@a%0%a001240@bIl me fait vraiment de la peine. On ne pourrait pas essayer de trouver ce souvenir de rêve dont il n'arrête pas de parler, papaⓡ\n@c0@"
  it: "@a%0%a001240@bTuttavia non penso che vivrà in eterno, quindi dovremo sbrigarci a trovare il souvenir speciale che tanto desidera...\n@c0@"
  ja: "@a@b%a001240「ちょっと　かわいそうに\n\tなってきたよ……。\n\tお父さん　さがしてあげよう？\n@c0@"
39:
  de: "@a%0%a001250@bIch glaube, wir sollten dem alten Mann ein wenig helfen, Papa.\n@c0@"
  en: "@a%0%a001250@bI think we should try to help the old man out\na little, Dad.\n@c0@"
  es: "@a%0%a001250@bCreo que deberíamos tratar de ayudar al anciano, papi.\n@c0@"
  fr: "@a%0%a001250@bJe crois qu'on devrait donner un petit coup de main au vieux monsieur, papa.\n@c0@"
  it: "@a%0%a001250@bPapà, penso che dovremmo aiutare quel signore...\n@c0@"
  ja: "@a@b%a001250「お父さん　ちょっとだけ\n\tあの　おじいさんのお手伝い\n\tしてあげよ？\n@c0@"
40:
  de: "@a%0%a001250@bWenn sein Traum nicht in Erfüllung geht, wird er niemals den Weg zur Göttin finden.\n@c0@"
  en: "@a%0%a001250@bHe'll never make his way to the Goddess with his dream unfulfilled like this.\n@c0@"
  es: "@a%0%a001250@bMientras no cumpla su sueño no podrá encontrar el camino a la Diosa.\n@c0@"
  fr: "@a%0%a001250@bIl ne rejoindra jamais la Déesse s'il ne réussit pas\nà réaliser son rêve.\n@c0@"
  it: "@a%0%a001250@bSe non realizzarà il suo sogno, non trascorrerà serenamente gli anni che gli restano da vivere.\n@c0@"
  ja: "@a@b%a001250「あのままじゃ　おじいさん\n\t神さまのところに　行けないの……。\n@c0@"
41:
  de: "@aSancho@bIss kann diesen alten Señor einfach nisst ansehen, wenn er so traurig ist. Iss... Iss...\n@c0@"
  en: "@aSancho@bEes eso esad to look at thees old señor when he ees eso unhappy. I, I... (blub)\n@c0@"
  es: "@aSancho@bQué retetriste es ver a ese abuelito tan apenado. Yo, yo... (snif)\n@c0@"
  fr: "@aSancho@bÇa f-fait de la peine de voir ce vieux señor si triste.\r\nJ-Je... (snif)\n@c0@"
  it: "@aSancho@bEs triste piensare que quell'anziano señor es tanto infeliz... \nYo... Yo me commuovos... ¡Sob!\n@c0@"
  ja: "@a@bサンチョ「あのように　悲しんでおられる\n\tご老人の姿というのは\n\t見ているだけで　つらくなります……。\n@c0@"
