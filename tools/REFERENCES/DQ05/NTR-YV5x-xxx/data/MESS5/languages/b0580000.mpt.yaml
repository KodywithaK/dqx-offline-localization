  ja: "@a@bビアンカ「そうなのよね。\n\tすごろく券が　お金で買えると\n\tいいのにね。\n@c0@"
205:
  de: "@aNera@bDa fällt mir ein, dass ich mal von einer T&T-Freikarte gehört habe, mit der man spielen kann, so oft man will.\n@c0@"
  en: "@aNera@bThat reminds me. I heard once about a T 'n' T free pass that lets you play as many times as you like.\n@c0@"
  es: "@aNera@bEso me recuerda que una vez oí mencionar un abono de T y T con el que puedes jugar tantas veces como quieras.\n@c0@"
  fr: "@aNera@bÇa me rappelle que j'ai entendu parler d'un\r\nlaissez-passer pour le TNT qui permettait\r\nde jouer aussi souvent qu'on le voulait.\n@c0@"
  it: "@aNera@bUna volta ho sentito parlare del Passepartout della Sorte, una preziosa tessera che permette di giocare alla Tavola della Sorte tutte le volte che si vuole...\n㈡\nSe esistesse davvero, un oggetto simile sarebbe il sogno di tutti gli appassionati di quel divertentissimo gioco!\n@c0@"
  ja: "@a@bフローラ「そういえば　何回でも\n\t自由に　すごろくできるパスがあると\n\t聞いたことがありますけど……。\n@c0@"
206:
  de: "@a%0%a001240@bMagiedamias und Nostradanüsse? Dann sollten wir nach denen Ausschau halten.\n@c0@"
  en: "@a%0%a001240@bWiz pips and conkjurers?\nWe should look out for them.\n@c0@"
  es: "@a%0%a001240@b¿Magos belloteros e invocastañadores?\nDeberíamos buscarlos.\n@c0@"
  fr: "@a%0%a001240@bLes graines de mage et les glanvoûteursⓡ\nOn devrait essayer d'en trouver.\n@c0@"
  it: "@a%0%a001240@bSemagic e Stellini? Papà, perché non vediamo di trovarne qualcuno? Mi piacerebbe entrare in possesso di uno o due biglietti della Sorte...\n@c0@"
  ja: "@a@b%a001240「コロマージとか\n\tプチマージが　持ってるんだね。\n\tよし　おぼえたよっ！\n@c0@"
207:
  de: "@aSancho@bDiesen Rat sollten wir nisst vergessen, eh? Präge ihn dir ins Gedässtnis ein und verwahre ihn dort gut und sisser auf.\n@c0@"
  en: "@aSancho@bWe must no forget thees advice, okay?\r\nYou put eet een your head, and you\r\nkeep eet esafe.\n@c0@"
  es: "@aSancho@bNo debemos olvidar este consejo.\nGuárdalo bien en la sesera y que no se te escape.\n@c0@"
  fr: "@aSancho@bOn ne d-doit pas oublier ce conseil, heinⓡ\nIl faut le g-garder bien au chaud d-dans\noun coin de notre tête.\n@c0@"
  it: "@aSancho@b¿Todo claro, sì?\n¡Semagicos y Stellinos: no dementicarlo, chico!\n@c0@"
  ja: "@a@bサンチョ「とりあえず　今の話は\n\t頭に入れておきましょう。\n@c0@"
208:
  de: "@aBianca@bNie im Leben! Ich könnte nicht sinnlos rumhängen und mich amüsieren, wenn es was zu gewinnen gibt.\n@c0@"
  en: "@aBianca@bNope. I could never just laze about havin' fun if there were things to be won.\n@c0@"
  es: "@aBianca@bNo. Soy incapaz de pasearme y divertirme si hay algo que ganar.\n@c0@"
  fr: "@aBianca@bImpossible. Je ne pourrais jamais m'amuser sans rien faire s'il y a des choses à gagner.\n@c0@"
  it: "@aBianca@bRilassarsi e godersela?!\nPfui!\nPiù facile a dirsi che a farsi...\n@c0@"
  ja: "@a@bビアンカ「ダメだわ…。\n\t賭けているものが　あるかぎり\n\t頭をからっぽに…　なんてできないっ。\n@c0@"
209:
  de: "@aNera@bIch glaube nicht, dass ich zu viel nachdenke. Mal gewinne ich und mal verliere ich.\n@c0@"
  en: "@aNera@bI don't think I think too much.\r\nSo I win some and I lose some.\n@c0@"
  es: "@aNera@bPienso que no pienso demasiado.\r\nTalora gano y talora pierdo.\n@c0@"
  fr: "@aNera@bJe ne crois pas que je réfléchisse trop.\r\nParfois je gagne et parfois je perds.\n@c0@"
  it: "@aNera@bE come si fa a non pensare ai gettoni puntati?!\nIo non ci riuscirei mai...\n@c0@"
  ja: "@a@bフローラ「私は　いつも　頭を\n\t使っていませんけど…\n\t結果は　勝ったり　負けたりですわね。\n@c0@"
210:
  de: "@a%0%a001240@bNicht zu viel nachdenken? Das klingt doch machbar!\n@c0@"
  en: "@a%0%a001240@bDon't think too much? Sounds good to me!\n@c0@"
  es: "@a%0%a001240@b¿No buscar el modo de hacer trampas? ¡Pues vale!\n@c0@"
  fr: "@a%0%a001240@bNe pas trop réfléchirⓡ Ça a l'air chouette,\ncomme idéeⓠ\n@c0@"
  it: "@a%0%a001240@bNon riuscirei mai a rilassarmi se avessi puntato un mucchio di gettoni...\n@c0@"
  ja: "@a@b%a001240「頭を　使わずに…　だね？\n\tやってみようっと！\n@c0@"
211:
  de: "@aOtto@bMeinen Kopf nicht gebrauchen? Ich denk', das krieg' ich problemlos hin!\n@c0@"
  en: "@aTuppence@bNot using my head? I should think I could easily manage that!\n@c0@"
  es: "@aAlazar@b¿No buscar el modo de hacer trampas? Pues no sé si voy a poder.\n@c0@"
  fr: "@aInnocent@bNe pas utiliser ma têteⓡ Je devrais y arriver assez facilementⓠ\n@c0@"
  it: "@aSimon@bMaestà, ha sentito?\nIo non sono per niente d'accordo...\n@c0@"
  ja: "@a@bピピン「それなら　ボク\n\tすぐに　できそうですね！\n@c0@"
212:
  de: "@aOtto@b... Also wirklich, %a000090! Jetzt hatte ich eigentlich mit etwas Widerspruch von Euch gerechnet!\n@c0@"
  en: "@aTuppence@b...I say, %a000090! I was rather hoping you'd disagree there.\n@c0@"
  es: "@aAlazar@b... Esto, %a000090. Esperaba que me animaras en mi empeño.\n@c0@"
  fr: "@aInnocent@b... Franchement, %a000090ⓠ J'espérais que vous me contrediriez, sur ce point.\n@c0@"
