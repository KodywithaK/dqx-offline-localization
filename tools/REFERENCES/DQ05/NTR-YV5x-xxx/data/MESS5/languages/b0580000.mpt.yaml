90:
  de: "@aOtto@bAn der Unterkunft und am Essen gibt's wirklich nichts auszusetzen. Ich komme gern wieder hierher!\n@c0@"
  en: "@aTuppence@bYou can't fault the accommodation or the food.\r\nWe should stay here again!\n@c0@"
