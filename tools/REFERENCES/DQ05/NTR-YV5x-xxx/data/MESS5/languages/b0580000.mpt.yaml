94:
  de: "@aBianca@bVielleicht sollte ich es einmal versuchen, was?\n@c0@"
  en: "@aBianca@bMaybe I should give it a go, eh?\n@c0@"
  es: "@aBianca@bPodríamos probar, ¿eh?\n@c0@"
  fr: "@aBianca@bJe devrais peut-être essayer, nonⓡ\n@c0@"
  it: "@aBianca@bE se diventassi anch'io una ballerina?\n@c0@"
  ja: "@a@bビアンカ「私も　ちょっと\n\tやってみようかしら？\n@c0@"
95:
  de: "@aBianca@bHa ha! War doch bloß ein Witz!\n@c0@"
  en: "@aBianca@bHa ha! Only jokin'!\n@c0@"
  es: "@aBianca@b¡Ja, ja! ¡Era una broma!\n@c0@"
  fr: "@aBianca@bHa haⓠ Je plaisanteⓠ\n@c0@"
  it: "@aBianca@bUhm, no...\nLa danza non fa per me.\nE poi non mi piace essere al centro dell'attenzione!\n@c0@"
  ja: "@a@bビアンカ「うふふ。　じょうだんよ。\n@c0@"
96:
  de: "@aNera@bHätte ich nur den Mut, so wie sie vor allen Leuten zu tanzen!\n@c0@"
  en: "@aNera@bIf only I had the courage to dance in front of people like they do.\n@c0@"
  es: "@aNera@bSi yo tuviese el valor de bailar en público come ellas...\n@c0@"
  fr: "@aNera@bSi seulement j'avais le cran de danser devant\r\ndes gens comme elles le font.\n@c0@"
  it: "@aNera@bAmmiro molto le ballerine, sai?\nIo non avrei mai il coraggio di esibirmi davanti a tanta gente...\n@c0@"
  ja: "@a@bフローラ「私にも　こういう場所で\n\t踊る勇気があるといいんですけど……。\n@c0@"
97:
  de: "@a%0%a001240@bWeiter so! Eins, zwei, drei und eins!\n@c0@"
  en: "@a%0%a001240@bWoo hoo! One, two, three, and one!\n@c0@"
  es: "@a%0%a001240@b¡Yuju! ¡Un, dos, tres y un!\n@c0@"
  fr: "@a%0%a001240@bWou houⓠ Un, deux, trois, et unⓠ\n@c0@"
  it: "@a%0%a001240@bE uno, due, tre e quattro!\nTroppo forte!\n@c0@"
  ja: "@a@b%a001240「わ～い！\n\tステップ　ステップ！\n@c0@"
98:
  de: "@aBianca@bWenn sie ihre Köpfe so in den Nacken legen, kann man in ihre Nasenlöcher gucken! Igitt!\n@c0@"
  en: "@aBianca@bYou can see right up everyone's nostrils when they crane their necks up at the stage like that. Yuck!\n@c0@"
  es: "@aBianca@bFíjate, todos estiran el cuello hacia el escenario como si fuesen avestruces. ¡Puaj!\n@c0@"
  fr: "@aBianca@bTout le monde se dévisse tellement la tête pour avoir une bonne vue de ce qui se passe sur la scène qu'on peut même voir leurs poils de nez. Beurkⓠ\n@c0@"
  it: "@aBianca@bGià...\nPer qualcuno il vero spettacolo non sono le slot machine né i tavoli da gioco, ma le ballerine...\n@c0@"
  ja: "@a@bビアンカ「ステージに　上がると\n\t鼻の下をのばして見てる　お客さんの\n\t顔がよく見えて　ちょっとイヤかも。\n@c0@"
99:
  de: "@aNera@bDer Tanz ist wirklich sehr aufregend, aber die Kostüme womöglich noch mehr!\n@c0@"
  en: "@aNera@bThe dance is thrilling, indeed, but I think the outfits might be even more so!\n@c0@"
  es: "@aNera@b¡El baile es emocionante, pero creo que los vestidos aún lo son più!\n@c0@"
  fr: "@aNera@bC'est vrai que sa danse peut donner des frissons, mais je crois que sa tenue n'est pas totalement étrangère au phénomèneⓠ\n@c0@"
  it: "@aNera@bLe ballerine sono proprio brave, caro.\r\nNon c'è bisogno che tu le guardi, sai?\r\nCi penso io a raccontarti come danzano!\n@c0@"
  ja: "@a@bフローラ「ダンスも　すごいですけど\n\t衣装も　すごいですわ。\n\tぽっ……。\n@c0@"
100:
  de: "@aOtto@bIch gebe zu, dass es recht aufregend ist. So hoch möcht' ich meine Beine auch mal kriegen!\n@c0@"
  en: "@aTuppence@bIt is rather thrilling, I admit. It could be even more so if she'd only move her feet a bit faster.\n@c0@"
  es: "@aAlazar@bEs bastante emocionante, la verdad. Pero podría serlo todavía más si moviera las piernas más deprisa.\n@c0@"
  fr: "@aInnocent@bC'est pas mal, je l'admets. Mais de là à avoir le grand frisson... il ne faut pas exagérer.\n@c0@"
  it: "@aSimon@bSì: guardare il suo spettacolo è molto più divertente...\nInfinitamente più divertente!\n@c0@"
  ja: "@a@bピピン「う～ん…　いいんですが\n\tあえて希望を言えば　もっと\n\t足を　高くあげてほしいなあ……。\n@c0@"
101:
  de: "@aBianca@bWas für ein Tanz! Wer hier zu nah ran geht, riskiert glatt eine gebrochene Nase!\n@c0@"
  en: "@aBianca@bWhat a dance! If any bloke fancied a closer look at the footwork, she'd knock him for six, no trouble!\n@c0@"
  es: "@aBianca@b¡Menudo baile! ¡Si cualquiera se le acerca un poco a los pies, seguro que lo deja K.O.!\n@c0@"
  fr: "@aBianca@bQuelle danseⓠ Si quelqu'un s'approchait de plus près pour regarder les pas, je crois qu'elle lui ferait voir trente-six chandellesⓠ\n@c0@"
  it: "@aBianca@bMa non ha calpestato niente! Ha preso a calci un tipo che si era avvicinato troppo per guardarle il...\nEhm, per guardare il suo modo di ballare...\n@c0@"
  ja: "@a@bビアンカ「キレのあるダンスね。\n\tあれなら　足を見ようと　近づく男も\n\t一発で　ノックアウトだわ。\n@c0@"
102:
  de: "@aNera@bIch würde an deiner Stelle nicht zu nahe herantreten, sonst kriegst du auch noch einen Fußtritt ab.\n@c0@"
  en: "@aNera@bI wouldn't get too close if I were you, otherwise you might get kicked too.\n@c0@"
  es: "@aNera@bYo no me acercaría demasiado, caro mio, o quizá tú también recibas una patada.\n@c0@"
  fr: "@aNera@bÀ ta place, je ne m'approcherais pas trop.\r\nTu risquerais de te prendre un coup de pied,\r\ntoi aussi.\n@c0@"
  it: "@aNera@bHa calpestato qualcosa?\nDovrebbe fare più attenzione, altrimenti potrebbe cadere e farsi male...\n@c0@"
  ja: "@a@bフローラ「あなたも　あまり近づくと\n\tけられますわよ。\n@c0@"
103:
  de: "@a%0%a001250@bEs sieht richtig schick aus, wie sie sich alle so genau gleich bewegen.\n@c0@"
  en: "@a%0%a001250@bIt's really clever how they all move in time together like that.\n@c0@"
  es: "@a%0%a001250@bEs fascinante cómo se mueven al compás.\n@c0@"
  fr: "@a%0%a001250@bC'est vraiment fort d'arriver à bouger toutes ensemble, comme ça.\n@c0@"
  it: "@a%0%a001250@bSono proprio brave!\nChissà quanti anni avranno studiato per raggiungere questo livello di abilità...\n@c0@"
  ja: "@a@b%a001250「みんな　動きがそろってて\n\tすごく　きれい……。\n@c0@"
104:
  de: "@aOtto@bMir macht ein kleiner Tritt gar nichts aus! Das riskier' ich gern, wenn ich dafür diesen Schönheiten ein wenig näher sein kann.\n@c0@"
  en: "@aTuppence@bI don't mind being kicked! I'm willing to take that risk if I can get a closer view.\n@c0@"
  es: "@aAlazar@b¡No me importa llevarme una patada! Estoy dispuesto a correr el riesgo si puedo verlas más de cerca.\n@c0@"
  fr: "@aInnocent@bÇa ne me gêne pas de me faire marcher dessusⓠ\nJe suis prêt à prendre le risque si ça me permet d'avoir une meilleure vue.\n@c0@"
  it: "@aSimon@bVorrei ammirare lo spettacolo più da vicino, ma ho paura di beccarmi una gomitata o un calcio... o entrambi!\n@c0@"
  ja: "@a@bピピン「けられても　いいです！\n\t近くで　見られればっ！\n@c0@"
105:
  de: "@aBianca@bVielleicht kann ich mir hier eine Arbeit suchen, wenn uns je das Geld ausgeht, was?\n@c0@"
  en: "@aBianca@bMaybe I should get a job here if ever we run out of money then, eh?\n@c0@"
  es: "@aBianca@bA lo mejor podría conseguir trabajo aquí si alguna vez nos quedamos sin dinero, ¿qué te parece?\n@c0@"
  fr: "@aBianca@bPeut-être que je devrais me trouver un boulot ici,\nsi un jour on était à court d'argent, heinⓡ\n@c0@"
  it: "@aBianca@bSarà anche redditizio, ma io non mi sentirei a mio agio con tutti quegli sguardi voraci addosso!\n@c0@"
  ja: "@a@bビアンカ「お金がなくなったら\n\t私も　ここで　はたらいて\n\t家計の足しに　しようかな……。\n@c0@"
106:
  de: "@aNera@bEs ist schrecklich, dass junge Mädchen nur des Geldes wegen eine solche Arbeit annehmen müssen.\n@c0@"
  en: "@aNera@bIt's a terrible thing that young girls have to do work like this just for the money.\n@c0@"
  es: "@aNera@bEs terrible que las chicas tengan que hacer este lavoro solo por el dinero.\n@c0@"
  fr: "@aNera@bC'est terrible que des jeunes filles doivent faire ce genre de travail pour gagner leur vie.\n@c0@"
  it: "@aNera@bOltre che brave, le ballerine devono essere giovani, belle e in perfetta forma.\n@c0@"
  ja: "@a@bフローラ「若い娘さんたちが　お金のために\n\tこんな場所で　はたらくなんて\n\t本当は　よくないのですが……\n@c0@"
107:
  de: "@aNera@bAber wenn Papa hier die Geschäfte führt, dann geht es hier bestimmt gediegener zu als in anderen Kasinos.\n@c0@"
  en: "@aNera@bBut with Papa running the place, I'm sure it's a lot more highbrow than other establishments.\n@c0@"
  es: "@aNera@bPero, siendo propiedad del mio papino, seguro que es más distinguido que otros lugares similares.\n@c0@"
  fr: "@aNera@bMais comme c'est papa qui dirige cet endroit, je suis sûre que ça reste de meilleur goût que certains autres établissements.\n@c0@"
  it: "@aNera@bUna volta che il fisico cede, bisogna trovarsi un'altra occupazione... Che so io, aprire una locanda o un negozio, o magari sposare un uomo ricco!\n@c0@"
  ja: "@a@bフローラ「ここは　父も管理していますし\n\tほかの　あやしいお仕事よりは\n\tマシかも知れませんわね……。\n@c0@"
108:
  de: "@a%0%a001240@bDann kriegen sie also eine Menge Geld? Vielleicht sollte ich auch versuchen, hier Arbeit zu kriegen!\n@c0@"
  en: "@a%0%a001240@bSo they get paid a lot of money? Maybe I should try getting a job here!\n@c0@"
  es: "@a%0%a001240@b¿Así que les pagan un montón? Igual debería buscar trabajo aquí.\n@c0@"
  fr: "@a%0%a001240@bAlors elles sont bien payéesⓡ Peut-être que je devrais essayer de me trouver un boulot iciⓠ\n@c0@"
  it: "@a%0%a001240@bPapà, stavo pensando che lo zio Sancho potrebbe diventare un ottimo danzatore del ventre.\nAnzi, dei ventri! Di pance ne ha almeno due o tre!\n@c0@"
  ja: "@a@b%a001240「ふ～ん…\n\tいっぱい　お金もらえるんだ。\n\tボクも　やってみようかな？\n@c0@"
109:
  de: "@aOtto@bAch! Wenn ich nur reich wär! Dann könnte ich es mir leisten, sie für mich ganz allein tanzen zu lassen.\n@c0@"
  en: "@aTuppence@bOh! If only I were rich! Then I could pay them to dance for me and me alone.\n@c0@"
  es: "@aAlazar@b¡Ah!, si yo fuera rico. Entonces podría pagarles para que me hicieran un pase privado.\n@c0@"
  fr: "@aInnocent@bOhⓠ Si seulement j'étais richeⓠ Je pourrais les payer pour qu'elles dansent pour moi tout seul.\n@c0@"
  it: "@aSimon@bIl giorno che diventerò ricco assumerò una ventina di ballerine, e ogni sera chiederò loro di danzare per me. Sigh! Temo che quel giorno non arriverà mai...\n@c0@"
  ja: "@a@bピピン「ああっ　ボクが　お金持ちだったら\n\tボクだけのために　踊らせるのにっ！\n@c0@"
110:
  de: "@aBianca@bIch frage mich, ob das wohl jedem so ergeht, der zu lange hier arbeitet.\n@c0@"
  en: "@aBianca@bI wonder if that's what happens to you if you end up doin' that kind of job too long.\n@c0@"
  es: "@aBianca@bMe pregunto si eso es lo que te pasa si haces este trabajo durante demasiado tiempo, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe me demande si c'est ce qui se passe quand on fait ce type de travail trop longtemps.\n@c0@"
  it: "@aBianca@bIl tip-tap sui calli?!\nDiamine, che fantasia!\n@c0@"
  ja: "@a@bビアンカ「長く　こういう仕事をすると\n\tああ　なっちゃうのかしら？\n@c0@"
111:
  de: "@aNera@bMan sagt ja, Frauen würden schöner, wenn man sie bewundernd anschaut. Aber mich macht das ganz verlegen.\n@c0@"
  en: "@aNera@bPeople say that women become more beautiful if they're looked at with appreciation. It makes me\r\nfeel all embarrassed, though.\n@c0@"
  es: "@aNera@bDicen que las mujeres se hacen più belle si las miran con admiración. Pero a mí me da un poco de vergüenza.\n@c0@"
  fr: "@aNera@bOn dit que les femmes deviennent encore plus belles quand elles sont regardées avec admiration. Ça me met quand même mal à l'aise, je dois dire.\n@c0@"
  it: "@aNera@bLe ragazze dovrebbero essere sempre gentili e cortesi, ma capisco che a volte la maleducazione degli uomini richieda una risposta più decisa...\n@c0@"
  ja: "@a@bフローラ「女は見られると　美しくなると\n\t言いますけど…　私には　はずかしくて\n\tとても　ムリですわ……。\n@c0@"
112:
  de: "@a%0%a001250@bSie sieht eigentlich nicht so aus, als würde ihr das was ausmachen. Darf ich auch Tänzerin werden, wenn ich groß bin?\n@c0@"
  en: "@a%0%a001250@bShe doesn't look like she minds really. Can I be a dancing girl when I grow up?\n@c0@"
  es: "@a%0%a001250@bNo parece demasiado preocupada. ¿Puedo ser bailarina cuando crezca?\n@c0@"
  fr: "@a%0%a001250@bÇa n'a pas l'air de la gêner tant que ça. Est-ce que je pourrai être danseuse, quand je serai grandeⓡ\n@c0@"
  it: "@a%0%a001250@bOh, che donna forte e determinata!\nPapà, ho deciso: da grande farò la ballerina!\n@c0@"
  ja: "@a@b%a001250「あのお姉さん\n\tすごく　うれしそう。　わたしも\n\t大きくなったら　やってみて　いい？\n@c0@"
113:
  de: "@aSancho@bAnda! Diese Señorita, sie ist feurig wie eine Jalapeño, eh?\n@c0@"
  en: "@aSancho@bAnda! Thees señorita, eshe ees fiery like the jalapeño, eh?\n@c0@"
  es: "@aSancho@b¡Ándale! Esa señorita es bien brava, cual jalapeño peleón, ¿verdad?\n@c0@"
  fr: "@aSancho@bAndaⓠ Cette señorita, elle est s-sanguine comme\noun chat s-sauvage, siⓡ\n@c0@"
  it: "@aSancho@b¡Ay, que caracter!\nChico, cerca de no far arrabbiare esta señorita, altrimenti te fa a pezzettinos pequeños pequeños...\n@c0@"
  ja: "@a@bサンチョ「いやはや　せっきょく的な\n\t娘さんですね。\n@c0@"
114:
  de: "@aOtto@bMan kann doch sehen, dass es sie im Grunde freut. Wir sollten sie auch anstarren!\n@c0@"
  en: "@aTuppence@bYou can tell she's enjoying it really. We should stare at her too!\n@c0@"
  es: "@aAlazar@bEstá claro que disfruta. Nosotros también deberíamos mirarla.\n@c0@"
  fr: "@aInnocent@bOn dirait que ça lui plaît, en fait.\nNous aussi, on devrait la regarderⓠ\n@c0@"
  it: "@aSimon@bMaestà, anch'io vorrei ammirare quella fanciulla, ma ho paura di ritrovarmi tutti i denti in fondo alla gola...\n@c0@"
  ja: "@a@bピピン「なんという　うれしい言葉！\n\tよし！　もっと見ようっ！\n@c0@"
115:
  de: "@aBianca@bMeinst du, sie ist neu hier? Sie wirkt etwas unsicher.\n@c0@"
  en: "@aBianca@bDo you reckon she's new here? She seems a bit unsure of herself.\n@c0@"
  es: "@aBianca@b¿Crees que es una novata? No parece muy segura de sí misma, ¿sabes?\n@c0@"
  fr: "@aBianca@bTu crois que c'est une débutanteⓡ\nElle n'a pas l'air très sûre d'elle.\n@c0@"
  it: "@aBianca@bMi sembra che balli fuori tempo...\n@c0@"
  ja: "@a@bビアンカ「あの娘　新人かな？\n\tなんだか　ういういしいね。\n@c0@"
116:
  de: "@aNera@bEins, zwei... Eins und zwei...\n@c0@"
  en: "@aNera@bOne, two... One and two...\n@c0@"
  es: "@aNera@bUno, due... Uno y dos...\n@c0@"
  fr: "@aNera@bUn, deux... Un et deux...\n@c0@"
  it: "@aNera@bE uno, e due...\nE uno, due, tre e quattro...\n@c0@"
  ja: "@a@bフローラ「ワンツー　ワンツー！\n@c0@"
117:
  de: "@aNera@bHier könnte ich ein kleines Tänzchen wagen, denn hier kann man mich ja kaum sehen.\n@c0@"
  en: "@aNera@bI can have a little go at dancing here because no one can really see me.\n@c0@"
  es: "@aNera@bAquí puedo bailar un po' porque nadie me puede ver.\n@c0@"
  fr: "@aNera@bJe peux essayer de danser un tout petit peu ici,\r\ncar personne ne peut vraiment me voir.\n@c0@"
  it: "@aNera@bCaro, e se provassi a imparare a ballare?\nMi piacerebbe danzare per te...\n@c0@"
  ja: "@a@bフローラ「ここなら　人カゲになって\n\tあまり見えませんから…\n\tすこしだけなら　踊れますわ。\n@c0@"
118:
  de: "@aSancho@bEs... Es wird resst heiß hier drin, no? All diese jungen Señoritas, sie... sie... Ayayayyy!\n@c0@"
  en: "@aSancho@bEes, ees getting hot een here, no?\r\nAll these young señoritas, they, they...\r\nAnda!\n@c0@"
  es: "@aSancho@bPues empiezo a tener calor.\nTodas esas señoritas, son, son...\n¡Ay, caramba!\n@c0@"
  fr: "@aSancho@bIl c-c-commence à faire chaud, ici, noⓡ Toutes ces jeunes señoritas, elles... elles... Andaⓠ\n@c0@"
  it: "@aSancho@b¡Ay, quantas bellas señoritas!\nChico, si lo zio Sancho avesse una trentina d'años de menos, te farebbe vedere lui, te farebbe...\n@c0@"
  ja: "@a@bサンチョ「こう　若い娘さんに\n\tかこまれていると…\n\t顔が　熱くなってきますね。\n@c0@"
119:
  de: "@aOtto@bEs wär schön, wenigstens eine der Tänzerinnen daheim in unserer Herberge zu haben. Das würd' ordentlich Leben in die Bude bringen!\n@c0@"
  en: "@aTuppence@bIt would be nice if we had at least one of these dancing girls at home at our inn. It would certainly liven the place up a bit.\n@c0@"
  es: "@aAlazar@bEstaría genial que tuviéramos una bailarina de esas en la posada de Pankraz. Animaría bastante el cotarro.\n@c0@"
  fr: "@aInnocent@bCe serait sympa s'il y avait au moins une\r\nde ces danseuses chez moi, à l'auberge.\r\nÇa mettrait un peu d'ambiance.\n@c0@"
  it: "@aSimon@bMaestà, che ne direbbe se ci portassimo a casa due o tre ballerine? Sarebbero un ottimo ⓕsouvenirⓖ del posto, non crede?\n@c0@"
  ja: "@a@bピピン「うちの宿にも\n\tひとり　ほしいなあ。\n\tそしたら　ずっと　華やかになるのに。\n@c0@"
120:
  de: "@aBianca@bDie Tänzerinnen schminken sich alle gleich. Man kann sie kaum auseinanderhalten.\n@c0@"
  en: "@aBianca@bAll these dancin' girls make themselves up the same way, so it's hard to tell 'em apart!\n@c0@"
  es: "@aBianca@b¡Todas esas bailarinas se maquillan igual! ¡No hay quien las distinga!\n@c0@"
  fr: "@aBianca@bToutes ces danseuses sont habillées et maquillées de la même façon, alors il est difficile de les distinguer les unes des autresⓠ\n@c0@"
  it: "@aBianca@bÈ praticamente impossibile distinguere una ballerina dall'altra, visto quanto si somigliano!\nChe dici, sarà il modo in cui si truccano?\n@c0@"
  ja: "@a@bビアンカ「踊り娘さんって　みんな\n\t同じお化粧しているから\n\tどの子も　同じ顔に見えるわね。\n@c0@"
121:
  de: "@aNera@bOh! Ich glaube, dieses Mädchen war auch im Stift, als ich dort war! ... Nein, das kann nicht sein.\n@c0@"
  en: "@aNera@bOh! I think that girl was at the abbey when I was!\r\nNo, I must be imagining it.\n@c0@"
  es: "@aNera@b¡Oh! ¡Credo que esa chica estaba en la abadía cuando estuve yo!\r\nPero no, debe de ser la mia immaginazione.\n@c0@"
  fr: "@aNera@bOhⓠ Je crois que cette fille était à l'abbaye en même temps que moiⓠ Non, je dois me tromper.\n@c0@"
  it: "@aNera@bSe non sbaglio, quella ragazza studiava con me all'Abbazia.\nGià allora sognava di diventare una ballerina...\n@c0@"
  ja: "@a@bフローラ「あら？　あの方…　修道院で\n\tごいっしょした方だと　思うのですけど\n\t気のせいかしら……？\n@c0@"
122:
  de: "@a%0%a001240@bHier arbeiten alle sehr hart. Das sollten wir auch tun.\n@c0@"
  en: "@a%0%a001240@bEveryone works really hard here. We should make sure we do the same.\n@c0@"
  es: "@a%0%a001240@bAquí todo el mundo trabaja un montón. Deberíamos hacer lo mismo.\n@c0@"
  fr: "@a%0%a001240@bTout le monde travaille très dur, ici.\nOn devrait faire pareil.\n@c0@"
  it: "@a%0%a001240@bSilenzio, papà!\nNon disturbiamo...\n@c0@"
  ja: "@a@b%a001240「みんな　一生けんめいだね。\n\tボクも　がんばらなきゃ。\n@c0@"
123:
  de: "@aOtto@bHm? Eine ist anscheinend net ganz so jung wie die anderen.\n@c0@"
  en: "@aTuppence@bHm? It seems one of them isn't quite as young as\r\nthe others.\n@c0@"
  es: "@aAlazar@b¿Mmm? Parece que una no es tan joven como las demás.\n@c0@"
  fr: "@aInnocent@bMmmⓡ On dirait que l'une d'elles n'est pas\ntout à fait aussi jeune que les autres.\n@c0@"
  it: "@aSimon@bNon preoccuparti, dolcezza...\nSe perdi il ritmo, ci pensa il tuo Simon ad aiutarti a ritrovarlo...\n@c0@"
  ja: "@a@bピピン「ん？　なんか　ひとりだけ\n\t若くない人が　まじっているような。\n@c0@"
124:
  de: "@aBianca@bPass doch auf, wo du hinsteigst, %a000090! Oder willst du dir Ärger einhandeln?\n@c0@"
  en: "@aBianca@bHave you got a bit of a thing for her feet\r\nor somethin'!?\n@c0@"
  es: "@aBianca@bPisando con garbo, ¿verdad?\n@c0@"
  fr: "@aBianca@bRegarde où tu marches, %a000090ⓠ\nTu cherches à t'attirer des ennuisⓡ\n@c0@"
  it: "@aBianca@bMa le hai pestato i piedi?!\n@c0@"
  ja: "@a@bビアンカ「もしかして　%a000090\n\tあの子の足に　クギづけになってる？\n@c0@"
125:
  de: "@aBianca@bPah! Wenn du wirklich Ärger suchst, dann bist du bei mir an der richtigen Adresse!\n@c0@"
  en: "@aBianca@bHuh! If it's trouble you're after, I'll give you plenty if you're not careful!\n@c0@"
  es: "@aBianca@bPues duele mucho cuando te pisan, ¿sabes?\n@c0@"
  fr: "@aBianca@bAh, eh bien, si c'est ça, tu vas en avoir si ça continueⓠ Et avec moiⓠ\n@c0@"
  it: "@aBianca@bEh eh eh!\nA volte sei davvero imbranato!\n@c0@"
  ja: "@a@bビアンカ「もうっ！\n\t足なら　いくらでも私の足を\n\t見ればいいでしょっ！\n@c0@"
126:
  de: "@aBianca@bHmmm... Bist du dir sicher?\n@c0@"
  en: "@aBianca@bHmmm...\nAre you sure about that?\n@c0@"
  es: "@aBianca@bMmm...\r\n¿Estás seguro?\n@c0@"
  fr: "@aBianca@bMmm, je préfère ça.\n@c0@"
  it: "@aBianca@bAttento, amore, che ti cresce il naso...\n@c0@"
  ja: "@a@bビアンカ「ふ～～～～～ん…　そう？\n@c0@"
127:
  de: "@aNera@bLiebling...\nBist du diesem Mädchen etwa gerade auf den Fuß getreten?\n@c0@"
  en: "@aNera@bDarling...\nDid you tread on that girl's foot?\n@c0@"
  es: "@aNera@bCaro mio...\r\n¿Le has pisado el pie a esa ragazza?\n@c0@"
  fr: "@aNera@bMon chéri... Tu as vraiment marché sur les pieds de cette demoiselleⓡ\n@c0@"
  it: "@aNera@bCaro, ma hai pestato i piedi a quella ragazza?!\n@c0@"
  ja: "@a@bフローラ「%a000090さん…\n\tあの　踊り娘さんの足を\n\tさわったんですか？\n@c0@"
128:
  de: "@aNera@bWie unhöflich!\n@c0@"
  en: "@aNera@bHow rude!\n@c0@"
  es: "@aNera@b¡Qué grosero!\n@c0@"
  fr: "@aNera@bEh bien, cela ne se fait pas. Et si tu l'avais blessée, elle aurait été obligée d'arrêter de travailler.\n@c0@"
  it: "@aNera@bAh, sì?\nBeh, allora credo che dovresti scusarti con lei...\n@c0@"
  ja: "@a@bフローラ「そんな…　ひどい。\n@c0@"
129:
  de: "@aNera@bGut. Ich glaube nicht, dass ich mit einem Mann verheiratet sein möchte, der anderen Leute auf die Füße tritt.\n@c0@"
  en: "@aNera@bGood. I'm not sure I'd like to be married to the kind of man who goes around treading on people's toes.\n@c0@"
  es: "@aNera@bVa bene. Si te pisan el juanete, veramente es molto doloroso.\n@c0@"
  fr: "@aNera@bBon, tant mieux. Je n'aimerais pas être marié à un homme mal élevé qui écrase les pieds des gens.\n@c0@"
  it: "@aNera@bUhm, sarà...\n@c0@"
  ja: "@a@bフローラ「私の足で　よければ\n\tあとで　お好きなだけ\n\tさわってください。　ぽっ……。\n@c0@"
130:
  de: "@a%0%a001250@bAuf der Bühne ist es wirklich heiß.\n@c0@"
  en: "@a%0%a001250@bIt's really hot up on stage.\n@c0@"
  es: "@a%0%a001250@bEn el escenario hace mucho calor.\n@c0@"
  fr: "@a%0%a001250@bIl fait vraiment très chaud sur la scène.\n@c0@"
  it: "@a%0%a001250@bAh, quanto la capisco!\nUna volta lo zio Sancho mi ha pestato un piede, e ho zoppicato per due settimane!\n@c0@"
  ja: "@a@b%a001250「ステージの上って\n\tあつい……。\n@c0@"
131:
  de: "@aBianca@bAha. Ich bin aber nicht sicher, ob er irgendwelche Schwindeleien aufdecken kann, solange er da steht.\n@c0@"
  en: "@aBianca@bI get it. But I'm not sure he'll catch any cheats standin' there.\n@c0@"
  es: "@aBianca@bYa lo entiendo. Pero no creo que vaya a atrapar a nadie haciendo trampas si se queda ahí plantado, ¿me entiendes?\n@c0@"
  fr: "@aBianca@bJe comprends. Mais je ne suis pas sûre qu'il arrive\r\nà repérer les tricheurs en restant ici sans bouger.\n@c0@"
  it: "@aBianca@bForse dice apertamente di essere un addetto alla sicurezza per scoraggiare eventuali balordi.\r\nDel resto, prevenire è meglio che curare, no?\n@c0@"
  ja: "@a@bビアンカ「事情は　わかったけど\n\tあんな場所にいて\n\tイカサマが　見つけられるのかしら？\n@c0@"
132:
  de: "@aNera@bHeißt das etwa, man kann im Kasino schwindeln?\n@c0@"
  en: "@aNera@bDoes that mean you can cheat at the casino, then?\n@c0@"
  es: "@aNera@b¿Eso significa que es possibile hacer trampas en el casino?\n@c0@"
  fr: "@aNera@bEst-ce que ça veut dire qu'on peut tricher\nau casinoⓡ\n@c0@"
  it: "@aNera@bMio padre mi diceva spesso che alcune persone vengono al casinò con intenzioni truffaldine...\n@c0@"
  ja: "@a@bフローラ「……ということは　カジノって\n\tイカサマが　できるのかしら？\n@c0@"
133:
  de: "@aNera@bHmm, ich wüsste nicht, wie.\n@c0@"
  en: "@aNera@bHmm, I've no idea how.\n@c0@"
  es: "@aNera@b¿Ma come?\n@c0@"
  fr: "@aNera@bMmm, je me demande bien comment.\n@c0@"
  it: "@aNera@bMa non c'è gusto a vincere barando!\nSi perde tutto il divertimento della sfida!\n@c0@"
  ja: "@a@bフローラ「う～ん……\n\tでも　どうすればできるのか\n\tわからないわ……。\n@c0@"
134:
  de: "@a%0%a001240@bEr hat aber gerade in die andere Richtung geguckt. Meinst du, er soll wirklich auf irgendwas aufpassen?\n@c0@"
  en: "@a%0%a001240@bHe was looking the other way just now, though. Do you think he really is on some kind of watch? I'm not so sure.\n@c0@"
  es: "@a%0%a001240@bPero si ahora mismo estaba mirando para otro lado. ¿De verdad crees que está vigilando? No estoy seguro.\n@c0@"
  fr: "@a%0%a001240@bPourtant, à l'instant, il regardait de l'autre côté.\nTu crois vraiment qu'il surveilleⓡ Moi, je n'en suis pas si sûr.\n@c0@"
  it: "@a%0%a001240@bSecondo me tiene d'occhio più le ballerine e le belle clienti del casinò che eventuali tipi sospetti...\n@c0@"
  ja: "@a@b%a001240「あの人　さっき\n\tうしろ向いてたよ？　ホントに\n\t見張ってるのかな？　あやしいな。\n@c0@"
135:
  de: "@aSancho@bKomm diesem Señor besser nisst in die Quere, ja? Er muss arbeiten.\n@c0@"
  en: "@aSancho@bYou no get een thees señor's way, okay?\nHe ees working.\n@c0@"
  es: "@aSancho@bSerá mejor pues que no molestes a este señor, ¿ok?\nEstá trabajando.\n@c0@"
  fr: "@aSancho@bNe d-d-dérange pas ce señor, de acuerdoⓡ\nIl travaille.\n@c0@"
  it: "@aSancho@bChico, no disturbiamo quel señor...\n¡El suo lavoro es muy difícil y importante!\n@c0@"
  ja: "@a@bサンチョ「ああ　おっしゃってるんです。\n\tジャマしちゃ　いけませんよ。\n@c0@"
136:
  de: "@aBianca@bWenn er sich so gut auskennt, wieso geht er dann nicht hin und schwingt selber mal das Tanzbein?\n@c0@"
  en: "@aBianca@bIf he reckons he knows so much, why dun't he get up an' have a go then, eh?\n@c0@"
  es: "@aBianca@bVamos, %a000090. No te conviene andar con gente como esa.\n@c0@"
  fr: "@aBianca@bS'il est si calé, pourquoi est-ce qu'il ne monte pas sur scène pour nous montrer ce qu'il sait faireⓡ\n@c0@"
  it: "@aBianca@bAndiamo, %a000090.\nCredo sia meglio girare al largo da tipi come quello...\n@c0@"
  ja: "@a@bビアンカ「%a000090　行きましょ。\n\tあの人と　目を合わせちゃダメよ。\n@c0@"
137:
  de: "@aNera@bDer Mann hält mit seiner Meinung nicht hinter den Berg, was? Aber er schien zu wissen, wovon er redet.\n@c0@"
  en: "@aNera@bThat man was rather opinionated, wasn't he? It sounded as if he knew what he was talking about, though.\n@c0@"
  es: "@aNera@bEse hombre estaba veramente convencido, ¿vero?\r\nNunca había visto a una persona così antes.\n@c0@"
  fr: "@aNera@bCet homme est un peu sévère, quand même...\r\nCeci dit, il a l'air de savoir de quoi il parle.\n@c0@"
  it: "@aNera@bSecondo te quel tipo sa ballare davvero oppure sta solo facendo lo sbruffone?\n@c0@"
  ja: "@a@bフローラ「女の人みたいな\n\t男の人でしたわね。\n\tああいう方も　いらっしゃるんですか。\n@c0@"
138:
  de: "@a%0%a001240@bKomischer Kerl!\n@c0@"
  en: "@a%0%a001240@bWhat a strange man!\n@c0@"
  es: "@a%0%a001240@b¡Qué hombre más raro!\n@c0@"
  fr: "@a%0%a001240@bQuel drôle de bonhommeⓠ\n@c0@"
  it: "@a%0%a001240@bPapà, a te piacerebbe vederlo ballare?\nA me no! Proprio per niente!\n@c0@"
  ja: "@a@b%a001240「ふしぎな人だね……。\n@c0@"
139:
  de: "@a%0%a001250@bMir sieht er aber nicht gerade wie ein Tanzexperte aus.\n@c0@"
  en: "@a%0%a001250@bHe doesn't look like much of a dance expert to me.\n@c0@"
  es: "@a%0%a001250@bPara mí que no es un experto en danza.\n@c0@"
  fr: "@a%0%a001250@bIl ne m'a pas vraiment l'air d'une danseuse étoile.\n@c0@"
  it: "@a%0%a001250@bVisto così, non mi sembra un gran ballerino...\n@c0@"
  ja: "@a@b%a001250「でも　あの人\n\tあの衣装は　着られそうにないの。\n@c0@"
140:
  de: "@aOtto@bPah! Ich würd' ja gern mal sehen, ob er das besser hinkriegen würd'!\n@c0@"
  en: "@aTuppence@bPah! I'd like to see him do a better job of the dance!\n@c0@"
  es: "@aAlazar@b¡Buah! ¡Ya me gustaría a mí verlo mejorar ese baile!\n@c0@"
  fr: "@aInnocent@bPeuhⓠ J'aimerais bien voir comment\nil s'y prendrait pour faire mieuxⓠ\n@c0@"
  it: "@aSimon@bSarà anche il miglior danzatore del mondo, ma io preferisco le ballerine!\nHanno quel ⓕqualcosaⓖ in più!\n@c0@"
  ja: "@a@bピピン「な　なにを言ってるんだ。\n\tあのダンスに　男は不要ですっ！\n@c0@"
141:
  de: "@aBianca@bHa ha! Das hätt' ich ja echt gern gesehen, wie er von der Bühne runtergesegelt ist! War sicher zum Schreien komisch!\n@c0@"
  en: "@aBianca@bHa ha! I wish I could've seen him get hit, that would've bin funny!\n@c0@"
  es: "@aBianca@b¡Me hubiera gustado ver como le daban la patada!\n@c0@"
  fr: "@aBianca@bCe n'est peut-être pas très charitable, mais j'aurais bien aimé voir çaⓠ Ha haⓠ\n@c0@"
  it: "@aBianca@bSenti che faccia tosta!\nMa si aspetta anche che qualcuno gli creda, eh?!\n@c0@"
  ja: "@a@bビアンカ「私も　あの人が\n\tけられるところ　見てみたかったな。\n@c0@"
142:
  de: "@aNera@bVon der Bühne geflogen? Meine Güte, diese Tänzerinnen haben es wirklich in sich!\n@c0@"
  en: "@aNera@bKnocked off the stage? Goodness, those dancers must be tougher than they look!\n@c0@"
  es: "@aNera@b¿Tenía una carrera en la media? ¡Mamma mia!\n@c0@"
  fr: "@aNera@bIl s'est fait jeter de la scèneⓡ Par la sainte cornetteⓠ Ces danseuses doivent être bien plus robustes qu'elles n'en ont l'airⓠ\n@c0@"
  it: "@aNera@bPoverino!\nVoleva solo essere gentile...\n@c0@"
  ja: "@a@bフローラ「す　スカートの中を……！\n@c0@"
143:
  de: "@a%0%a001250@bWas macht der dumme Kerl auch auf der Bühne?\n@c0@"
  en: "@a%0%a001250@bWell, he shouldn't have tried to get up on the stage, the silly man.\n@c0@"
  es: "@a%0%a001250@bPobre hombre.\n@c0@"
  fr: "@a%0%a001250@bForcément, s'il va déranger les danseuses pendant le spectacle...\n@c0@"
  it: "@a%0%a001250@bCerto che le ballerine hanno a che fare con un sacco di tipi strambi...\nNon le invidio proprio!\n@c0@"
  ja: "@a@b%a001250「えっち……。\n@c0@"
144:
  de: "@aOtto@bSo ein Dummian! Selber schuld, würd' ich sagen. Auf der Bühne hat er ja wohl nix verloren!\n@c0@"
  en: "@aTuppence@bWhat a fool! He should've stayed where he was.\n@c0@"
  es: "@aAlazar@b¡Qué bobo! Se tendía que haber callado.\n@c0@"
  fr: "@aInnocent@bQuelle andouilleⓠ Il aurait mieux fait de rester à sa place.\n@c0@"
  it: "@aSimon@bUhm, niente male come scusa...\nQuasi quasi me la segno, chissà che un giorno non mi torni utile...\n@c0@"
  ja: "@a@bピピン「バカだなあ…\n\tうまくやればいいのに。\n@c0@"
145:
  de: "@aBianca@bDer gute alte Rodrigo steckt voller Überraschungen, was?\n@c0@"
  en: "@aBianca@bOld Briscoletti is full of surprises, eh?\n@c0@"
  es: "@aBianca@bEl viejo Don Rimaldi es un saco de sorpresas, ¿eh?\n@c0@"
  fr: "@aBianca@bSacré Oscuroni... Il est plein de surprises, heinⓡ\n@c0@"
  it: "@aBianca@bMister Fosconi è una gran brava persona...\n@c0@"
  ja: "@a@bビアンカ「ルドマンさんって\n\t本当に　スケールが\n\t大きいのよねえ。\n@c0@"
146:
  de: "@aNera@bPapa hat auch dem Stift, in dem ich war, etwas gespendet.\n@c0@"
  en: "@aNera@bPapa donated some money to the abbey I stayed\r\nat too.\n@c0@"
  es: "@aNera@bIl mio papino donó también dinero a la abadía en la que yo estaba.\n@c0@"
  fr: "@aNera@bPapa a également fait quelques dons à l'abbaye\r\noù j'étais.\n@c0@"
  it: "@aNera@bMio padre ha donato un bel po' di soldi anche all'Abbazia di Su'ncyel.\n@c0@"
  ja: "@a@bフローラ「私がいた　修道院にも\n\t寄付をしていたんですけど……\n@c0@"
147:
  de: "@aNera@bAber ich habe die Mutter Obenhin gebeten, mich trotzdem nicht anders zu behandeln als die anderen. Sie war sehr nett zu allen.\n@c0@"
  en: "@aNera@bBut I asked Abbess Abovall to treat me just like everyone else regardless, which was nice.\n@c0@"
  es: "@aNera@bPero yo le pedí a la madre superiora supercelestial que me tratara come a las demás de todos modos.\n@c0@"
  fr: "@aNera@bMais j'ai demandé à l'Abbesse du Firmament de me traiter exactement comme toutes les autres.\n@c0@"
  it: "@aNera@bDice che luoghi del genere svolgono un'opera meritoria, e che devono avere tutto l'aiuto che è possibile dar loro. E io sono d'accordo con lui!\n@c0@"
  ja: "@a@bフローラ「私は　マザーにお願いして\n\tほかの方と　同じように\n\t扱っていただきましたの。\n@c0@"
148:
  de: "@a%0%a001240@bHast du auch schon mal was gespendet, Papa? Ich noch nie.\n@c0@"
  en: "@a%0%a001240@bHave you ever made a donation, Dad?\nI haven't made any yet.\n@c0@"
  es: "@a%0%a001240@b¿Alguna vez has hecho un donativo, papi?\nYo no.\n@c0@"
  fr: "@a%0%a001240@bTu as déjà fait des dons, toi, papaⓡ Moi, jamais.\n@c0@"
  it: "@a%0%a001240@bPapà, quando sarò grande e avrò un po' di soldi, anch'io farò beneficenza, così la dea mi proteggerà ancora di più!\n@c0@"
  ja: "@a@b%a001240「お父さんは　寄付したことある？\n\tボクは　まだ　ないや……。\n@c0@"
149:
  de: "@aOtto@bWie wär's denn, wenn mir vielleicht auch mal jemand was spenden würd'?\n@c0@"
  en: "@aTuppence@bI don't suppose anyone would fancy donating something to me, would they?\n@c0@"
  es: "@aAlazar@bSupongo que nadie me querrá hacer un donativo a mí, ¿verdad?\n@c0@"
  fr: "@aInnocent@bJ'imagine que personne ne voudrait me faire de dons, à moi, je me trompeⓡ\n@c0@"
  it: "@aSimon@bPerò!\nChe bravo, questo mister Fosconi!\nÈ proprio una persona generosa, eh?\n@c0@"
  ja: "@a@bピピン「ボクには\n\t寄付してくれないですよね。\n@c0@"
150:
  de: "@aBianca@bEr scheint ein wenig durcheinander zu sein, was? Man bekommt sicher einen ganz schönen Schreck, wenn man verliert.\n@c0@"
  en: "@aBianca@bHe seems a bit shook up, eh? It can be a bit of a blow when you lose, I s'pose.\n@c0@"
  es: "@aBianca@bParece un poco alterado, ¿eh? Supongo que perder debe de ser un duro golpe.\n@c0@"
  fr: "@aBianca@bIl a l'air un peu secoué, nonⓡ J'imagine que ça doit faire un coup quand on perd, heinⓡ\n@c0@"
  it: "@aBianca@bOh-oh!\nChissà quanto ha perso quel tizio...\nAh, poco male. I soldi non fanno la felicità...\n㈡\nPerò la povertà rende dannatamente infelici, te lo garantisco!\n@c0@"
  ja: "@a@bビアンカ「すごい　落ちこみようね。\n\tまあ　気持ちは　わかるけど……。\n@c0@"
151:
  de: "@aNera@bPapa hat oft gesagt, es sei eine gute Idee, zur Göttin zu beten, bevor man noch zu viel verliert.\n@c0@"
  en: "@aNera@bPapa often used to say it's a good idea to pray to the Goddess before you end up losing too much.\n@c0@"
  es: "@aNera@bIl mio papino solía decir que es una buena idea rezar a la Diosa antes de acabar perdiendo demasiado.\n@c0@"
  fr: "@aNera@bPapa disait souvent que c'était une bonne idée\r\nde prier la Déesse avant d'en arriver à perdre\r\ntrop d'argent.\n@c0@"
  it: "@aNera@bMio padre dice sempre che la cosa migliore da fare, quando ci si rende conto che la fortuna non è dalla tua parte, è scappare dal casinò a gambe levate!\n@c0@"
  ja: "@a@bフローラ「そういえば父が　大負けする前に\n\t神さまに　お祈りしておくといいと\n\tよく言っていましたけど……。\n@c0@"
152:
  de: "@a%0%a001240@bDer alte Mann war richtig enttäuscht, was? Die Leute wirken immer so niedergeschlagen, wenn sie enttäuscht sind.\n@c0@"
  en: "@a%0%a001240@bThat old man was disappointed, wasn't he? People always look down when they're disappointed.\n@c0@"
  es: "@a%0%a001240@bEse abuelete parecía bastante decepcionado, ¿verdad? La gente siempre parece deprimida cuando está decepcionada.\n@c0@"
  fr: "@a%0%a001240@bCet homme avait l'air déçu, nonⓡ Les gens regardent toujours par terre quand ils sont déçus.\n@c0@"
  it: "@a%0%a001240@bQuel signore ha perso tutti i suoi soldi?\n㈡\nNon lo sapeva che al casinò si può vincere e si può perdere, e che la seconda eventualità è molto più probabile della prima?!\n@c0@"
  ja: "@a@b%a001240「あのおじさん\n\tすごい　ガックリしてるね。\n\tガックリすると　下向くんだね。\n@c0@"
153:
  de: "@aSancho@bSiehst du? Man kann nie wissen, was beim Glücksspiel alles passieren kann.\n@c0@"
  en: "@aSancho@bYou esee? You can no tell what ees gonna\r\nhappen when you gamble.\n@c0@"
  es: "@aSancho@b¿Ves? Nomás nunca se sabe qué puede pasar cuando juegas.\n@c0@"
  fr: "@aSancho@bTu voisⓡ On ne sait j-jamais ce qui peut\nse p-passer quand on joue, chico.\n@c0@"
  it: "@aSancho@b¿Quell'hombre ha perso todo el suo dinero?\nSi yo fossi al puesto suo, affogherei el dispiacer en un padellon de paella...\n@c0@"
  ja: "@a@bサンチョ「まあ　かけごとばかりは\n\t先が　見えませんからね。\n@c0@"
154:
  de: "@aBianca@bJa, klar. Wenn man gegen Monster kämpft, wird man jedenfalls nicht reich.\n@c0@"
  en: "@aBianca@bYeah, I'll bet. He certainly en't gettin' his money together by defeatin' monsters.\n@c0@"
  es: "@aBianca@bYa lo creo. Desde luego, su dinero no lo ha conseguido derrotando a monstruos, ¿me entiendes?\n@c0@"
  fr: "@aBianca@bC'est sûr. J'imagine qu'il n'arrive pas à vivre rien qu'en battant des monstres.\n@c0@"
  it: "@aBianca@bLe persone sulla nave saranno un po' meno ricche, e mister Fosconi lo sarà molto di più!\n@c0@"
  ja: "@a@bビアンカ「たしかに　そうよね……。\n\t魔物をたおして　お金を得てるって\n\tわけでも　なさそうだし……。\n@c0@"
155:
  de: "@aNera@bNun ja, ich habe darüber eigentlich nie wirklich nachgedacht. Ich frage mich, wie es die anderen machen.\n@c0@"
  en: "@aNera@bYes, well, I've never really thought about that before. I wonder how everyone's getting on.\n@c0@"
  es: "@aNera@bBueno, veramente, nunca había prestado demasiada atención a eso antes. Me pregunto cómo le va a tutti.\n@c0@"
  fr: "@aNera@bEh bien, je n'ai jamais vraiment réfléchi à la question jusqu'à présent. Je me demande comment les gens s'en sortent.\n@c0@"
  it: "@aNera@bMagari saranno un po' meno ricche, ma avranno avuto il divertimento che cercavano! I casinò sono imprese private, mica istituzioni di beneficenza!\n㈡\nChi ci va dovrebbe sapere fin dall'inizio che potrebbe lasciarci un bel mucchio di quattrini...\n@c0@"
  ja: "@a@bフローラ「まあ。　そんなこと\n\t考えたことも　ありませんでしたわ。\n\tみなさん　どうなさっているのかしら？\n@c0@"
156:
  de: "@a%0%a001240@bDu glaubst doch nicht, dass die nur so reich sind, weil sie Dinge getan haben, die man eigentlich nicht tun sollte, oder?\n@c0@"
  en: "@a%0%a001240@bYou don't think they all got their money by doing things they shouldn't have, do you?\n@c0@"
  es: "@a%0%a001240@b¿Crees que todos han conseguido el dinero haciendo cosas que no deberían?\n@c0@"
  fr: "@a%0%a001240@bTu ne penses quand même pas qu'ils sont devenus riches en faisant des choses interdites, heinⓡ\n@c0@"
  it: "@a%0%a001240@bPapà, cerchiamo di non andarcene dal casinò più poveri di quanto non fossimo quando siamo entrati...\nI soldi ci servono per il viaggio!\n@c0@"
  ja: "@a@b%a001240「みんな　悪いことして\n\tお金もうけしたんじゃ…　ないよね？\n@c0@"
157:
  de: "@aSancho@bAm besten ist es, hart zu arbeiten und siss seine Monedas als ehrlisser Mann zu verdienen.\n@c0@"
  en: "@aSancho@bThe best way ees to work hard and earn the garbanzos like an honest man.\n@c0@"
  es: "@aSancho@bEl mejor modo de ganar bien, es trabajar duro y ganarse los frijoles como un buen hombre.\n@c0@"
  fr: "@aSancho@bLa m-meilleure chose à faire, c'est de t-t-travailler dur et de gagner de l'argent c-comme oun honnête homme.\n@c0@"
  it: "@aSancho@b¡La gente dovrebbe saber que al casinò es muy más facil perdere que vincere, però de solito se ne recuerda solo después que ha finito todo el dinero!\n@c0@"
  ja: "@a@bサンチョ「地道に　はたらくのが\n\tいちばんですよ。\n\tええ　そうに決まっていますとも。\n@c0@"
158:
  de: "@aOtto@bJa, das wüsste ich ja auch gern, wie die alle so reich geworden sind.\n@c0@"
  en: "@aTuppence@bYes, I wouldn't mind being party to that kind of knowledge myself.\n@c0@"
  es: "@aAlazar@bSí, no me importaría saber cómo lo han logrado.\n@c0@"
  fr: "@aInnocent@bOui, s'ils pouvaient me donner la recette,\r\nje ne serais pas contre.\n@c0@"
  it: "@aSimon@bLe persone più ricche del mondo sono su questa nave?!\nEcco perché mi sento come un pesce fuor d'acqua….\n@c0@"
  ja: "@a@bピピン「あっ　それ\n\tボクも　聞きたいです！\n@c0@"
159:
  de: "@aBianca@bTypisch! Die Leute sind alle so erpicht aufs Gewinnen, und dann räumt eine wie die ganz groß ab!\n@c0@"
  en: "@aBianca@bTypical! There's all them desperate, greedy people\r\nout there, and then someone like her comes along\r\nand wins!\n@c0@"
  es: "@aBianca@b¡No falla! ¡Todo lleno de gente desesperada y con cara de codicia, y llega una como ella y gana!\n@c0@"
  fr: "@aBianca@bC'est typiqueⓠ Il y a plein de gens cupides et désespérés partout autour, et il suffit que quelqu'un comme elle arrive pour gagnerⓠ\n@c0@"
  it: "@aBianca@bLa tipica fortuna dei principianti!\nScommetto che i giocatori professionisti vorrebbero strozzarla!\n@c0@"
  ja: "@a@bビアンカ「やっぱり　ああいう\n\t欲のない人がやると　当たるのね。\n@c0@"
160:
  de: "@aNera@bSo ein Glück, zu gewinnen, ohne es darauf angelegt zu haben! Hoffentlich hat es sie jetzt nicht erwischt. Dann wäre ihre Glückssträhne gleich zu Ende.\n@c0@"
  en: "@aNera@bShe's lucky that she won without even trying. I just hope she doesn't end up addicted as a result. That wouldn't be so lucky.\n@c0@"
  es: "@aNera@bQué suerte ha tenido de ganar sin siquiera intentarlo. Espero que no se convierta en una adicta por eso. Eso ya no sería tan fortunato.\n@c0@"
  fr: "@aNera@bElle a eu de la chance de gagner sans le faire exprès. J'espère qu'elle ne deviendra pas dépendante à cause de ça.\n㈡\nLà, ce serait jouer de malchance.\n@c0@"
  it: "@aNera@bAh, buon per lei!\nChissà on quali oggetti scambierà i gettoni che ha vinto...\n@c0@"
  ja: "@a@bフローラ「わからずに　当てるなんて\n\tラッキーですけど　あれでハマって\n\t大損すると　アンラッキーですわ。\n@c0@"
161:
  de: "@a%0%a001250@bSie hat offenbar einen fetten Gewinn gemacht. Das gönne ich ihr!\n@c0@"
  en: "@a%0%a001250@bSounds like she had a win. Good for her!\n@c0@"
  es: "@a%0%a001250@bParece que ha ganado mucho. ¡Me alegro por ella!\n@c0@"
  fr: "@a%0%a001250@bElle a gagné, on dirait. Tant mieux pour elleⓠ\n@c0@"
  it: "@a%0%a001250@bSembra che quella donna abbia vinto un bel po' di gettoni...\nSono felice per lei!\n@c0@"
  ja: "@a@b%a001250「当たったのね。\n\tおめでとうございます。\n@c0@"
162:
  de: "@aOtto@bAber dann habt Ihr doch gewonnen!\n@c0@"
  en: "@aTuppence@bBut that's a win!\n@c0@"
  es: "@aAlazar@b¡Eso sí que es ganar!\n@c0@"
  fr: "@aInnocent@bMais, ça veut dire qu'elle a gagnéⓠ\n@c0@"
  it: "@aSimon@bNon ha rotto la slot machine...\nHa vinto.\n@c0@"
  ja: "@a@bピピン「それが　当たりなんですよ！\n@c0@"
163:
  de: "@aOtto@b... Oh je! Sie hört überhaupt net zu.\n@c0@"
  en: "@aTuppence@b...Oh dear! She's not listening at all.\n@c0@"
  es: "@aAlazar@b¡Oh!, vaya. No se ha dado cuenta.\n@c0@"
  fr: "@aInnocent@b... Je n'en reviens pasⓠ Elle n'écoute même pas.\n@c0@"
  it: "@aSimon@bSanto cielo...\nQuella donna ha vinto e non se n'è nemmeno accorta.\n@c0@"
  ja: "@a@bピピン「……って　あの人\n\tぜんぜん　聞いてませんよっ！\n@c0@"
164:
  de: "@aBianca@bDeswegen muss man sich doch nicht gleich so aufregen.\n@c0@"
  en: "@aBianca@bGettin' wound up like that en't goin' to help,\r\nthough, eh?\n@c0@"
  es: "@aBianca@bEnfadarse así no le va a ayudar, ¿sabes?\n@c0@"
  fr: "@aBianca@bMais ça n'est pas en réagissant comme ça que\nça arrangera les choses, heinⓡ\n@c0@"
  it: "@aBianca@bSe continua a lamentarsi in questo modo, le verrà un fegato grosso così...\n@c0@"
  ja: "@a@bビアンカ「あ～あ　イライラしても\n\tしょうがないのにね。\n@c0@"
165:
  de: "@aNera@bDie Leute sollten wirklich versuchen, in Kasinos nur eine Vergnügungsstätte zu sehen. Es besteht wirklich kein Grund, sich dermaßen aufzuregen.\n@c0@"
  en: "@aNera@bPeople really must try to just treat casinos as places of fun. It doesn't do to become so upset\r\nby them.\n@c0@"
  es: "@aNera@bLa gente veramente debería considerar los casinos como lugares de entretenimiento. No sirve de niente enfadarse por la sua culpa.\n@c0@"
  fr: "@aNera@bLes gens devraient vraiment s'efforcer de ne voir dans les casinos que des lieux de divertissement.\r\nCe n'est pas bien de se mettre dans un tel état.\n@c0@"
  it: "@aNera@bSe perdere la fa arrabbiare tanto, forse le converrebbe non venirci proprio al casinò...\n\n@c0@"
  ja: "@a@bフローラ「カジノは　あくまでも\n\t遊び　と思ってくださらないと。\n@c0@"
166:
  de: "@a%0%a001240@bIst das Kasino denn jetzt kaputt?\n@c0@"
  en: "@a%0%a001240@bIs the casino here broken, then?\n@c0@"
  es: "@a%0%a001240@bEntonces, ¿el casino no funciona?\n@c0@"
  fr: "@a%0%a001240@bEst-ce que ça veut dire que ce casino est cassé, alorsⓡ\n@c0@"
  it: "@a%0%a001240@bA me il cibo è sembrato ottimo...\n@c0@"
  ja: "@a@b%a001240「ここのカジノ\n\tこわれてるの？\n@c0@"
167:
  de: "@a%0%a001250@bHat die einen Wirbel gemacht! Warum kann sie denn nicht einfach still sein und anderen Leuten ihr Vergnügen lassen?\n@c0@"
  en: "@a%0%a001250@bShe was really noisy. Why can't she just be quiet and let everyone carry on having fun?\n@c0@"
  es: "@a%0%a001250@b¡Qué escándalo ha montado! ¿Por qué no se callará y dejará que los demás se sigan divirtiendo?\n@c0@"
  fr: "@a%0%a001250@bElle faisait vraiment beaucoup de bruit.\nElle ne pourrait pas se taire un peu et\nlaisser tout le monde s'amuserⓡ\n@c0@"
  it: "@a%0%a001250@bChe cosa dice quella signora?!\nIl cibo qui al casinò è davvero buonissimo!\n@c0@"
  ja: "@a@b%a001250「あの人　うるさかった。\n\tみんなが　楽しんでる場所は\n\tうるさくしちゃダメなのに……。\n@c0@"
168:
  de: "@aOtto@bMeine Güte! Was für eine Schreckschraube! Die käm' mir jedenfalls net ins Haus! Da blieb' ich lieber ledig!\n@c0@"
  en: "@aTuppence@bDear me! What a frightening specimen of a woman! Now there's one lady I wouldn't be marrying in\r\na hurry.\n@c0@"
  es: "@aAlazar@b¡Joroba! ¡Qué miedo da esa mujer! Con esa no me casaba yo sin pensármelo dos veces.\n@c0@"
  fr: "@aInnocent@bPar ma lanceⓠ Quel spécimen féminin effrayantⓠ\nEn voilà au moins une que je n'épouserais pas\nsans réfléchirⓠ\n@c0@"
  it: "@aSimon@bDiamine, quant'è nervosa quella tipa!\nNon la sposerei nemmeno se me l'ordinasse il medico!\n@c0@"
  ja: "@a@bピピン「な　なんて　こわい女なんだ。\n\tボク　まちがっても\n\tあんな人とは　結婚しませんよ！\n@c0@"
169:
  de: "@aBianca@bJa, aber aus den zehntausend können genauso gut hundert werden und aus hundert einer. Das funktioniert nicht nur in eine Richtung.\n@c0@"
  en: "@aBianca@bYeah, but ten thousand can turn into a hundred,\r\nand a hundred can turn into one too. It works\r\nboth ways.\n@c0@"
  es: "@aBianca@bSí, pero diez mil pueden convertirse en cien, y cien en uno. Funciona en ambas direcciones.\n@c0@"
  fr: "@aBianca@bOui, mais mille peuvent aussi en donner cent et cent en donner un seul. Ça marche dans les deux sens.\n@c0@"
  it: "@aBianca@bIl problema al casinò è che i gettoni si dividono molto più facilmente di quanto non si moltiplichino, indipendentemente dall'affetto che si dimostra loro!\n@c0@"
  ja: "@a@bビアンカ「１００００枚が　１００枚\n\t１００枚が　１枚になることも\n\tあるんだけどね。\n@c0@"
170:
  de: "@aNera@bWir müssen unsere Jetons langsam und stetig vermehren, so wie er es gesagt hat.\n@c0@"
  en: "@aNera@bWe'll have to keep steadily building up our tokens, just like he said.\n@c0@"
  es: "@aNera@bTendremos que ir acumulando fichas a rilento, como ha dicho.\n@c0@"
  fr: "@aNera@bNous allons devoir continuer à amasser progressivement des jetons, comme il l'a dit.\n@c0@"
  it: "@aNera@bAmare i gettoni?! Ma come si fa a parlare in questi termini di semplici oggetti inanimati?!\nCerta gente non la capisco proprio!\n@c0@"
  ja: "@a@bフローラ「私たちも　順調に\n\tコインをふやせるよう\n\tがんばりましょう。\n@c0@"
171:
  de: "@a%0%a001240@bDas ist ja ein praktischer Rat.\n@c0@"
  en: "@a%0%a001240@bI get it. That's pretty useful advice.\n@c0@"
  es: "@a%0%a001240@bYa lo entiendo. Es un consejo muy útil.\n@c0@"
  fr: "@a%0%a001240@bJ'ai compris. C'est un conseil très utile.\n@c0@"
  it: "@a%0%a001240@bMa che dice quel tipo?\nSecondo me non ci sta con la testa...\n@c0@"
  ja: "@a@b%a001240「なるほど　おじいさんの話は\n\tためになるねっ。\n@c0@"
172:
  de: "@aOtto@bEin Jeton? Ich würde lieber gleich mit hundert anfangen.\n@c0@"
  en: "@aTuppence@bOne token? I'd rather start with at least a hundred.\n@c0@"
  es: "@aAlazar@b¿Una ficha? Pues yo preferiría empezar al menos por cien.\n@c0@"
  fr: "@aInnocent@bUn seul jetonⓡ J'aimerais autant commencer\ntout de suite avec cent.\n@c0@"
  it: "@aSimon@bNon potrei mai amare un gettone!\nTutti i miei sentimenti più nobili sono per le donne!\n@c0@"
  ja: "@a@bピピン「１コインじゃなあ……。\n\tせめて　最初は\n\t１００コインは　ほしいですねっ！\n@c0@"
173:
  de: "@aBianca@bDas ist das erste Mal, dass ich einen Priester im Kasino sehe! Ob die Göttin seine Gebete wohl erhört?\n@c0@"
  en: "@aBianca@bThat's the first time I've seen a priest in a casino!\r\nI wonder if the Goddess'll answer his prayers.\n@c0@"
  es: "@aBianca@b¡Es la primera vez que veo a un sacerdote en un casino!\r\nMe pregunto si la Diosa escuchará sus oraciones.\n@c0@"
  fr: "@aBianca@bC'est la première fois que je vois un prêtre dans un casinoⓠ Je me demande si la Déesse va exaucer ses prières.\n@c0@"
  it: "@aBianca@bVedo che nemmeno i sacerdoti sono immuni dalla febbre del gioco d'azzardo...\n@c0@"
  ja: "@a@bビアンカ「カジノ場で　神父さんなんて\n\t初めて見たわ。　神さまは\n\tあの人の願いを　聞いてくれるかしら？\n@c0@"
174:
  de: "@aNera@bFür so etwas sollte man doch bestimmt kein Gebet verschwenden! Ich würde das jedenfalls nie machen.\n@c0@"
