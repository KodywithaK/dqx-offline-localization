  fr: "@aNera@bIl ne peut y avoir qu'une seule raison d'être aussi triste dans un endroit comme celui-ci.\n㈡\nIl a de toute évidence perdu tout son argent\net ne peut pas se payer le voyage de retour\npour rentrer chez lui.\n@c0@"
