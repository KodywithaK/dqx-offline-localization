91:
  de: "@aBianca@bSo gut habe ich schon lange nicht mehr geschlafen. Und du hast geschlummert wie ein Murmeltier, %a000090.\n@c0@"
  en: "@aBianca@bThat was the best night's sleep I've had in ages.\nYou were out for the count as well, %a000090.\n@c0@"
  es: "@aBianca@bEsta noche he dormido como hacía siglos que no dormía.\n㈡\nY tú también estabas fuera de combate, %a000090, ¿sabes?\n@c0@"
  fr: "@aBianca@bC'est la meilleure nuit de sommeil que j'ai passée depuis bien longtemps. Toi aussi, tu as dormi comme un loir, %a000090.\n@c0@"
  it: "@aBianca@bNon avevo mai dormito tanto bene in vita mia, %a000090.\nStare accanto a te mi rilassa e mi tranquillizza...\n@c0@"
  ja: "@a@bビアンカ「あのベッド　すごく\n\tねごこちが　よかったね。\n\t%a000090も　ぐっすりだったわよ。\n@c0@"
92:
  de: "@a%0%a001250@bDas Bett war so schön kuschelig weich!\n@c0@"
