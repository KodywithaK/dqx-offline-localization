  ja: "@a@bサンチョ「言いたいことは\n\tあるでしょうが　まあ\n\tそういうことにしておきましょうね。\n@c0@"
203:
  de: "@aOtto@bIch an seiner Stelle würd' das Schaukeln des Schiffs zu meinem Vorteil nutzen!\n@c0@"
  en: "@aTuppence@bI'd use the boat's rocking to my advantage if it\r\nwere me!\n@c0@"
  es: "@aAlazar@bYo en su lugar sacaría partido al vaivén del barco.\n@c0@"
  fr: "@aInnocent@bMoi, à sa place, j'aurais utilisé le mouvement du bateau à mon avantageⓠ\n@c0@"
  it: "@aSimon@bAl suo posto, perderei meno tempo a inventare scuse e m'impegnerei di più a studiare il percorso vincente!\n@c0@"
  ja: "@a@bピピン「ボクなら　ゆれも\n\t味方につけてみせますともっ！\n@c0@"
204:
  de: "@aBianca@bJa, schade, dass man sich nicht einfach selbst eine Karte kaufen kann, was?\n@c0@"
  en: "@aBianca@bYeah, it's a pity you can't just buy yourself a\r\nticket, eh?\n@c0@"
