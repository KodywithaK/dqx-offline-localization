0:
  de: "@aBianca@bEigentlich haben wir gar keine Zeit, uns zu vergnügen ⓚⓛ und doch sind wir schon wieder hier, was?\n@c0@"
  en: "@aBianca@bWe dun't really have time to be larkin' about...and yet here we are again, eh?\n@c0@"
  es: "@aBianca@bNo tenemos tiempo que perder... Pero aquí estamos otra vez, ¿eh?\n@c0@"
  fr: "@aBianca@bOn n'a pas vraiment le temps de traîner...\r\net pourtant, nous voici de retour ici.\n@c0@"
  it: "@aBianca@bAmore, scusa la domanda...\nCosa ci siamo venuti a fare qui? Non credo che abbiamo tempo da perdere in gite di piacere...\n@c0@"
  ja: "@a@bビアンカ「遊んでる場合じゃ\n\tないんだけど……\n\tまた　ここに　来ちゃったわね。\n@c0@"
1:
  de: "@aNera@bBist du sicher, dass wir jetzt hier sein sollten, Liebling? Ich weiß nicht, ob wir für so etwas Zeit haben.\n@c0@"
  en: "@aNera@bAre you sure we should really be here, darling?\r\nI don't know that we have time for this kind of thing.\n@c0@"
  es: "@aNera@b¿De verdad crees que deberíamos estar aquí, caro mío?\n¡Non credo que tengamos tiempo para estas cosas!\n@c0@"
  fr: "@aNera@bTu es sûr qu'on devrait vraiment être ici,\nmon chériⓡ Je ne sais pas si nous avons\nle temps pour ce genre de choses.\n@c0@"
  it: "@aNera@bCaro, sei certo di aver fatto la cosa giusta a venire qui? Secondo me avevamo cose ben più importanti a cui pensare...\n@c0@"
  ja: "@a@bフローラ「あなた　いいんですか？\n\tこんなところで　遊んでいて……。\n@c0@"
2:
  de: "@a%0%a001240@bSuper, dass wir hier eine Pause einlegen, Papa! Meinst du, hier gibt's ein Schlürfodrom?\n@c0@"
  en: "@a%0%a001240@bThanks for bringing us here, Dad! Do you think they have a slurpodrome?\n@c0@"
  es: "@a%0%a001240@bGracias por habernos traído aquí, papi. ¿Crees que tendrán un limódromo?\n@c0@"
  fr: "@a%0%a001240@bMerci de nous avoir amenés ici, papaⓠ\nTu crois qu'ils ont un gluodromeⓡ\n@c0@"
  it: "@a%0%a001240@bPapà, grazie per avermi portato qui!\nA proposito... Credi che abbiano anche uno slimodromo in questo posto?\n@c0@"
  ja: "@a@b%a001240「ここに来ると\n\tボク　わくわくしちゃうよ。\n\tスライムレースが　あるからかな？\n@c0@"
3:
  de: "@a%0%a001250@bMit Sancho waren wir noch nie hier.\n@c0@"
  en: "@a%0%a001250@bSancho never brought us here.\n@c0@"
  es: "@a%0%a001250@bSancho nunca nos había traído a un sitio así.\n@c0@"
  fr: "@a%0%a001250@bSancho ne nous avait jamais emmenés ici.\n@c0@"
  it: "@a%0%a001250@bLo zio Sancho non ci aveva mai portati qui...\n@c0@"
  ja: "@a@b%a001250「ここには\n\tサンチョおじさんとは\n\t来たことないです……。\n@c0@"
4:
  de: "@aSancho@bDein Onkel Sancho, er hat noch nie von einen solssen Ort gehört!\n@c0@"
  en: "@aSancho@bYour Uncle Sancho, he has never heard about esuch a place like thees!\n@c0@"
  es: "@aSancho@bTu tito Sancho nunca oyó de un sitio igual.\n@c0@"
  fr: "@aSancho@bTonton Sancho n'avait j-j-jamais entendu\nparler d'oun endroit pareilⓠ\n@c0@"
  it: "@aSancho@b¡Ay, que sorpreson!\n¡No sabevo dell'esistenza de esto luego, chico!\n@c0@"
  ja: "@a@bサンチョ「ふ～む…\n\tこんな所が　あったとは……。\n@c0@"
5:
  de: "@aOtto@bJuchhu! Hier gibt's mehr Häschenmädel, als ich mir je hätte träumen lassen!\n@c0@"
  en: "@aTuppence@bYippee! There are more bunny girls here than I could shake a stick at!\n@c0@"
  es: "@aAlazar@b¡Yupiii! Aquí hay más conejitas de las que puedo cazar.\n@c0@"
  fr: "@aInnocent@bYoupiⓠ Il y a plus de jolies serveuses ici\nque je ne pourrai jamais en courtiserⓠ\n@c0@"
  it: "@aSimon@bQuante belle fanciuuulleee!\nMaestà, grazie per avermi portato in questo paradiso!\n@c0@"
  ja: "@a@bピピン「わ～い！\n\tバニーさんが　いっぱいだ！\n\tうっれしっいなっ！\n@c0@"
6:
  de: "@aBianca@bIch hoffe, sein Wunsch wird wahr und er kann ein bisschen Geld sparen.\n@c0@"
  en: "@aBianca@bI hope he gets his wish and manages to save a bit\r\nof cash.\n@c0@"
  es: "@aBianca@bEspero que se cumpla su deseo y consiga ahorrar un poco de dinero, ¿sabes?\n@c0@"
  fr: "@aBianca@bJ'espère que son souhait sera exaucé et qu'il réussira à économiser un peu d'argent.\n@c0@"
  it: "@aBianca@bMettere da parte dei soldi per poi sprecarli al casinò?!\nComplimenti per la coerenza, eh?!\n@c0@"
  ja: "@a@bビアンカ「う～ん…\n\tがんばって　お金を\n\tためてもらいたいわねえ。\n@c0@"
7:
  de: "@aNera@bWie traurig, ihn so niedergeschlagen zu sehen. Hier soll man doch eigentlich Spaß haben.\n@c0@"
  en: "@aNera@bIt's a shame to see him so despondent. This place is supposed to be for having fun.\n@c0@"
  es: "@aNera@bEs una pena verlo tan disperato. Se supone que este lugar es para divertirse.\n@c0@"
  fr: "@aNera@bC'est vraiment dommage de le voir si abattu.\r\nNormalement, cet endroit est fait pour s'amuser.\n@c0@"
  it: "@aNera@bMa sì, perché non dovrebbe togliersi questo sfizio?\nL'importante è che il gioco non diventi una fissazione...\n@c0@"
  ja: "@a@bフローラ「そんなに　気負わないで\n\t気軽に　遊んでいただきたいですわ。\n@c0@"
8:
  de: "@a%0%a001250@bSeine Kleidung ist so schäbig. Er tut mir richtig leid.\n@c0@"
  en: "@a%0%a001250@bHis clothes are so shabby. I feel really sorry for him.\n@c0@"
  es: "@a%0%a001250@bSu ropa está tan vieja. Me da mucha lástima, ¿sabes?\n@c0@"
  fr: "@a%0%a001250@bSes vêtements sont tellement miteux.\nJ'ai vraiment de la peine pour lui.\n@c0@"
  it: "@a%0%a001250@bForse farebbe meglio a mettere da parte i soldi per qualcosa di più utile...\n@c0@"
  ja: "@a@b%a001250「お洋服　ぼろぼろ…\n\tかわいそう……。\n@c0@"
9:
  de: "@aOtto@bMit solchen Leuten solltet Ihr net reden! Am Ende schert man uns noch über einen Kamm mit ihm.\n@c0@"
  en: "@aTuppence@bYou mustn't talk to people like that! We'll all end\r\nup being tarred with the same brush if we're\r\nnot careful.\n@c0@"
  es: "@aAlazar@b¡No hay que ser así! Todos podemos acabar igual si no tenemos cuidado.\n@c0@"
  fr: "@aInnocent@bVous ne devez pas parler à ce genre de personnesⓠ On va tous nous mettre dans le même panier que lui, si on n'y prend pas garde.\n@c0@"
  it: "@aSimon@bCerta gente prova un'irresistibile attrazione per i casinò...\n@c0@"
  ja: "@a@bピピン「ダメですよ！\n\tああいう人に　話しかけると\n\tツキが　落ちちゃうじゃないですか！\n@c0@"
10:
  de: "@aBianca@bTja, wenn wir reingehen wollen, dann jetzt oder nie!\n@c0@"
  en: "@aBianca@bWell, if we're goin' in, then let's get movin'.\n@c0@"
  es: "@aBianca@bBueno, si vamos a entrar... ¡En marcha!\n@c0@"
  fr: "@aBianca@bBon, eh bien, si c'est là-bas qu'on va, grimpons.\n@c0@"
  it: "@aBianca@bBeh, se vogliamo andare dobbiamo darci una mossa...\n@c0@"
  ja: "@a@bビアンカ「さあ　行くなら　行きましょ。\n@c0@"
11:
  de: "@aNera@bSei vorsichtig, wenn du auf den Ponton steigst, ja, Liebling?\n@c0@"
  en: "@aNera@bMind how you go when you step onto the pontoon, won't you, darling?\n@c0@"
  es: "@aNera@bTen cuidado dónde pisas cuando pases por la pasarela, ¿de acuerdo, caro mio?\n@c0@"
  fr: "@aNera@bFais attention où tu mets les pieds, une fois\nsur le ponton, d'accord mon chériⓡ\n@c0@"
  it: "@aNera@bTesoro, tienimi la mano quando saliamo a bordo di quella barchetta...\nHo paura di cadere in acqua.\n@c0@"
  ja: "@a@bフローラ「あなた。\n\t小舟に　乗るときは\n\t足もとに　気をつけてくださいね。\n@c0@"
12:
  de: "@a%0%a001240@bDas macht ja Spaß, so an Bord zu gehen!\n@c0@"
  en: "@a%0%a001240@bWhat a cool way to get aboard!\n@c0@"
  es: "@a%0%a001240@b¡Que forma tan guay de subir a bordo!\n@c0@"
  fr: "@a%0%a001240@bC'est super comme façon de monter à bordⓠ\n@c0@"
  it: "@a%0%a001240@bTutti a bordo!\n@c0@"
  ja: "@a@b%a001240「小舟で　行くなんて\n\tなんだか　かっこいい～！\n@c0@"
13:
  de: "@a%0%a001250@bDann müssen wir also erst auf das kleine Boot, um auf das große zu gelangen?\n@c0@"
  en: "@a%0%a001250@bSo we have to get on that little boat first, and then we get on the big one?\n@c0@"
  es: "@a%0%a001250@bAsí que, ¿primero tenemos que subirnos en el barquito y luego vamos en él hasta el grande?\n@c0@"
  fr: "@a%0%a001250@bAlors on doit d'abord monter sur ce petit bateau pour aller sur le grandⓡ\n@c0@"
  it: "@a%0%a001250@bAh, ho capito! La barca piccola porta i clienti fino alla Jolly Ace, per evitare che al casinò arrivino ospiti indesiderati... Ottima pensata!\n@c0@"
  ja: "@a@b%a001250「小さいお舟にのって\n\t大きいお船にのるの？\n@c0@"
14:
  de: "@aSancho@bIss mag keine kleinen Boote. Einem Boot ist nisst zu trauen, wenn es kleiner ist als eine Galeone.\n@c0@"
  en: "@aSancho@bI no like the esmall boats. You can no trust a boat eef ees esmaller than a galleon.\r\n@c0@"
  es: "@aSancho@bNo me gustan nada los barquitos. Cualquier barco que sea más chico que un galeón no es digno de confianza.\n@c0@"
  fr: "@aSancho@bJe n'aime p-p-pas les petits bateaux.\r\nOn ne peut pas se fier à oun b-bateau\r\ns'il est plus p-petit qu'oun galion.\n@c0@"
  it: "@aSancho@bNo me gustano las barcas piccolas.\n¡No sono muy estabiles, y yo no so nuotar!\n@c0@"
  ja: "@a@bサンチョ「小さい舟に　のるときは\n\tきんちょうしますよ。\n\t……いえいえ　こちらの話です。\n@c0@"
15:
  de: "@aOtto@bOb sie es wohl deshalb so kompliziert machen, hier rein- oder rauszukommen, damit sich niemand vorzeitig mit seinen Gewinnen aus dem Staub macht?\n@c0@"
  en: "@aTuppence@bI wonder if this rather convoluted way of entering and exiting the place is so that no one can run off before time with their winnings.\n@c0@"
  es: "@aAlazar@bMe pregunto si este modo tan complicado de entrar y salir del casino es para que nadie se escape con las ganancias.\n@c0@"
  fr: "@aInnocent@bJe me demande si cette façon complexe d'entrer et de sortir de cet endroit n'est pas faite pour éviter que les gens se sauvent trop vite avec leurs gains.\n@c0@"
  it: "@aSimon@bCerto che non è facile salire a bordo della Jolly Ace, Maestà.\n㈡\nIn questo modo, però, si riesce a controllare facilmente chi entra nel casinò, ed è possibile lasciare a terra eventuali ospiti sgraditi.\n@c0@"
  ja: "@a@bピピン「小舟をつかわないと\n\t行けないなんて　まさか\n\t勝ち逃げ　できないように…　とか！？\n@c0@"
16:
  de: "@aBianca@bOb er wohl die ganze Zeit hier stehen bleiben und sehnsuchtsvoll dort hinüber starren will?\n@c0@"
  en: "@aBianca@bI wonder if he's just plannin' on stayin' there lookin' longingly at the place, then.\n@c0@"
  es: "@aBianca@bBueno, pues igual pretende quedarse aquí mirando con ansia al lugar, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe me demande s'il a l'intention de rester planté là\r\nà regarder le bateau de loin.\n@c0@"
  it: "@aBianca@bInsomma, che ha intenzione di fare?\nNon ha scelta, no? Se vuole salire sulla Jolly Ace, deve montare sul barchino, che gli piaccia o no!\n@c0@"
  ja: "@a@bビアンカ「あの人　ああやって\n\tずっと　うらめしそうに\n\tカジノ船を　見ているつもりかしら。\n@c0@"
17:
  de: "@aNera@bWer sich nicht manchmal mit einer kleinen Unbequemlichkeit abfinden kann, verpasst vieles im Leben.\n@c0@"
  en: "@aNera@bIf you don't put up with a little discomfort sometimes, you can miss out on a lot of fun.\n@c0@"
  es: "@aNera@bSi no puedes aguantar algún contratiempo de vez en cuando, veramente puedes perderte cosas molto divertenti.\n@c0@"
  fr: "@aNera@bIl faut parfois accepter un petit peu d'inconfort pour pouvoir ensuite profiter d'un bon moment\r\nde divertissement.\n@c0@"
  it: "@aNera@bUhm, potrebbe sempre farsela a nuoto...\nO magari può farsi lanciare sulla Jolly Ace da una catapulta! Ih ih ih!\n@c0@"
  ja: "@a@bフローラ「イヤなことも　ガマンしないと\n\t楽しいことは　おこりませんわ。\n@c0@"
18:
  de: "@a%0%a001240@bAber wie ist er denn überhaupt hierher gekommen? Das ist doch eine Insel, oder nicht?!\n@c0@"
  en: "@a%0%a001240@bBut how did he get here in the first place?\nThis is an island, right!?\n@c0@"
  es: "@a%0%a001240@bPero, ¿cómo ha llegado aquí?\nSi esto es una isla, ¿no?\n@c0@"
  fr: "@a%0%a001240@bMais comment a-t-il fait pour arriver ici, au départⓡ On est sur une île, nonⓡⓐ\n@c0@"
  it: "@a%0%a001240@bForse non sa nuotare...\n@c0@"
  ja: "@a@b%a001240「あの人　どうやって\n\tここまで来たのかな？\n\tここ…　島なのに……。\n@c0@"
19:
  de: "@aSancho@bMansse Menschen, sie mögen nisst die Schaukelbewegung auf dem Meer. Du hast Glück, Chico, nisst? Du kannst sie nisst spüren.\n@c0@"
  en: "@aSancho@bEsome people, they no like the motion of the esea. You are lucky, eh, friend? You no feel eet.\n@c0@"
  es: "@aSancho@bAlguna gente, pues no soporta el vaivén del mar. Tú tienes suerte, chamaco. Ni lo notas.\n@c0@"
  fr: "@aSancho@bCertaines p-personnes n'aiment pas le\nmouvement de la mer. Tu as de la chance,\nhein, chicoⓡ Toi, tu n'as p-pas ce problème.\n@c0@"
  it: "@aSancho@bQuell'hombre ha paura de las barcas piccolas, chico.\n㈡\nForse gli converrebbe chiedere a qualcunos de dargli una botta en testa y farse trasportare sulla Jolly Ace mentre está un poco esvenuto...\n@c0@"
  ja: "@a@bサンチョ「船のゆれに　弱い人は\n\tいるものです。　良かったですね\n\t坊っちゃんは　大丈夫で。\n@c0@"
20:
  de: "@aOtto@bHa ha ha, was für ein Feigling! Dann stecken wir eben seinen Anteil an den Gewinnen gleich mit ein!\n@c0@"
  en: "@aTuppence@bHa ha ha, what a coward! It looks like we'll have to take his share of the winnings, then!\n@c0@"
  es: "@aAlazar@bJa, ja, ja, ¡vaya cobarde! Pues nada, nos tendremos que quedar con su parte de los premios.\n@c0@"
  fr: "@aInnocent@bHa ha ha, quel froussardⓠ Dans ce cas, on va devoir prendre sa part de gains, on diraitⓠ\n@c0@"
  it: "@aSimon@bOgnuno ha le sue paure, Maestà.\nIo, per esempio, ho il terrore di non riuscire a sposare una bella fanciulla!\n@c0@"
  ja: "@a@bピピン「はっはっは　弱虫め！\n\tよし　あの人の分まで\n\tボクたちが　勝ちまくってきましょう！\n@c0@"
21:
  de: "@aBianca@bOh weh. Sie klingt ziemlich enttäuscht, was?\n@c0@"
  en: "@aBianca@bOh dear. Sounds like she's pretty disappointed, eh?\n@c0@"
  es: "@aBianca@b¡Oh!, cielos. Parece que está bastante decepcionada, ¿sabes?\n@c0@"
  fr: "@aBianca@bOuh là là. Elle a l'air drôlement déçue, heinⓡ\n@c0@"
  it: "@aBianca@bChe le serva di lezione: la prossima volta la organizzerà lei, la vacanza, così non avrà brutte sorprese.\n@c0@"
  ja: "@a@bビアンカ「あら　あら…\n\tそれは　かわいそうだったわね。\n@c0@"
22:
  de: "@aNera@bAber am Wasser ist es ruhig und friedlich. Vielleicht würde es ihnen guttun, wenn sie ein wenig schwimmen gehen würden.\n@c0@"
  en: "@aNera@bBut it's nice and peaceful by the water's edge. They'd probably enjoy a nice swim together.\n@c0@"
  es: "@aNera@bMa este lugar junto al mare es relajante y bello. Sicuro que disfrutarían de un chapuzón juntos.\n@c0@"
  fr: "@aNera@bPourtant, le bord de mer est joli et très paisible.\r\nIls pourront sans doute profiter d'un bon bain ensemble.\n@c0@"
  it: "@aNera@bCerto che andare al casinò senza avere nemmeno i soldi per fare una puntatina è un po' triste, eh?\n@c0@"
  ja: "@a@bフローラ「でも　波打ちぎわなら\n\t安全ですもの。\n\tここで　泳ぐのも　悪くないですわ。\n@c0@"
23:
  de: "@a%0%a001240@bDann sind sie also den weiten Weg hierher gekommen, bloß um das Schiff anzugucken?\n@c0@"
  en: "@a%0%a001240@bSo they've come all this way just to look at the boat?\n@c0@"
  es: "@a%0%a001240@bEntonces, ¿han venido hasta aquí solo para contemplar el barco?\n@c0@"
  fr: "@a%0%a001240@bAlors ils ont fait tout ce chemin rien que pour regarder le bateauⓡ\n@c0@"
  it: "@a%0%a001240@bQuella donna ha detto che quasi quasi si butterebbe in acqua...\n@c0@"
  ja: "@a@b%a001240「あの人たち　ここまで来て\n\t船を見てるだけなの？\n@c0@"
24:
  de: "@a%0%a001240@bEs ist natürlich ein ziemlich schickes Schiff. Das könnte ich mir den ganzen Tag lang angucken.\n@c0@"
  en: "@a%0%a001240@bI suppose it is a pretty cool boat. I'd probably be happy to just sit and look at it all day long.\n@c0@"
  es: "@a%0%a001240@bBueno, es un barco genial. Yo estaría encantado de pasarme todo el día mirándolo.\n@c0@"
  fr: "@a%0%a001240@bBon, c'est vrai qu'il est pas mal. Moi aussi, je serais sûrement content de m'asseoir et de le regarder toute la journée.\n@c0@"
  it: "@a%0%a001240@bLa capisco, sai?\nAnch'io mi farei una bella nuotata!\n@c0@"
  ja: "@a@b%a001240「でも　ボク\n\tあんなカッコイイ船なら\n\t一日じゅう　見ててもいいや！\n@c0@"
25:
  de: "@aOtto@bEiner Dame den Hof zu machen kann recht teuer werden.\n@c0@"
  en: "@aTuppence@bCourting a lady can cost quite a lot of money.\n@c0@"
  es: "@aAlazar@bCortejar a una chica cuesta mucho.\n@c0@"
  fr: "@aInnocent@bÇa peut revenir très cher de courtiser une dame.\n@c0@"
  it: "@aSimon@bSe un giorno avrò al mio fianco una bella fanciulla, non la porterò in vacanza in un casinò!\n@c0@"
  ja: "@a@bピピン「女の子とのデートって\n\tお金が　かかるんですねえ……。\n@c0@"
26:
  de: "@aOtto@bHoffentlich finde ich mal eine, der die kleinen Freuden im Leben wichtig sind.\n@c0@"
  en: "@aTuppence@bHopefully I'll be able to find myself one who takes pleasure in the smaller things in life.\n@c0@"
  es: "@aAlazar@bCon un poco de suerte, encontraré a una que sepa apreciar las pequeñas cosas de la vida.\n@c0@"
  fr: "@aInnocent@bEspérons que j'arriverai pour ma part à trouver quelqu'un qui apprécie plutôt les joies simples\r\nde la vie.\n@c0@"
  it: "@aSimon@bMi sembra una destinazione un po' squallida, Maestà.\nNon pensa che sarebbe più divertente andare in montagna, oppure alle terme?\n@c0@"
  ja: "@a@bピピン「どこかに　ちいさなしあわせで\n\t満足してくれる女の子　いないかな？\n@c0@"
27:
  de: "@aBianca@bWas für ein riesiges Schiff! Es ist viel größer als das Schiff, das Rodrigo uns zur Verfügung gestellt hat, oder?\n@c0@"
  en: "@aBianca@bWhat a huge ship! It's much bigger than the boat Briscoletti give us, eh?\n@c0@"
  es: "@aBianca@b¡Qué barco más enorme! Es mucho más grande que el que nos dio Rimaldi, ¿eh?\n@c0@"
  fr: "@aBianca@bQuel bateau immenseⓠ Il est bien plus grand que\ncelui qu'Oscuroni nous a donné, heinⓡ\n@c0@"
  it: "@aBianca@bChe nave gigantesca!\nÈ molto più grande di quella che mister Fosconi ha dato a noi, eh?\n@c0@"
  ja: "@a@bビアンカ「大きな船ね。　私たちが\n\tルドマンさんにもらった船より\n\t大きいんじゃないかしら？\n@c0@"
28:
  de: "@aNera@bIch kenne mich auf dem Schiff auch nicht sehr gut aus. Also können wir es zusammen erkunden.\n@c0@"
