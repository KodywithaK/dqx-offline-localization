  ja: "@a@bビアンカ「やっぱり　ここは\n\tそっとしておいてあげるのが\n\tいいんじゃないかしら。\n@c0@"
298:
  de: "@aNera@bHier kann man doch nur aus einem Grund schlechte Laune haben. Er hat offenbar sein ganzes Geld verloren und kann sich die Heimreise nicht leisten.\n@c0@"
