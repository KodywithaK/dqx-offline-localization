86:
  de: "@aOtto@bNun hör sich das einer an! Eine Last?! Wenn hier wer eine Last trägt, dann sind wir das! Wir tragen das Schicksal der ganzen Welt auf unseren Schultern!\n@c0@"
  en: "@aTuppence@bListen to her! A burden!? We're the ones with\r\nthe burden, having the fate of the world on\r\nour shoulders!\n@c0@"
  es: "@aAlazar@b¿Pero tú la oyes? ¿No podría con más? Nosotros si que no podemos con más, que tenemos que encargarnos de la salvación del mundo.\n@c0@"
  fr: "@aInnocent@bÉcoutez-la un peuⓡⓐ C'est sûr que nous,\non ne risque pas l'ennui avec le sort du\nmonde entre nos mainsⓠ\n@c0@"
  it: "@aSimon@bAh, quanto mi piacerebbe avere tempo per godermi le meraviglie della Jolly Ace...\n@c0@"
  ja: "@a@bピピン「ボクたちが　こんなに\n\t苦労しているというのに……。\n@c0@"
87:
  de: "@aOtto@bDas macht mich jetzt ganz fuchtig!\n@c0@"
  en: "@aTuppence@bHow irritating!\n@c0@"
  es: "@aAlazar@b¡Qué molesta!\n@c0@"
  fr: "@aInnocent@bÇa m'énerve d'entendre çaⓠ\n@c0@"
  it: "@aSimon@bMah, speriamo che prima o poi una simile fortuna tocchi anche a me...\n@c0@"
  ja: "@a@bピピン「ちょっと　キュ～っと\n\tやってきちゃって　いいですか？\n@c0@"
88:
  de: "@aNera@bHe he! Es war, als hätten wir in einer riesigen Wiege geschlafen, findest du nicht, Liebling?\n@c0@"
  en: "@aNera@bHe he he! It was like sleeping in a big rocking cradle last night, wasn't it, darling?\n@c0@"
  es: "@aNera@b¡Je, je, je! Esta noche ha sido como dormir en una gran mecedora, ¿verdad, caro mio?\n@c0@"
  fr: "@aNera@bHi hiⓠ La nuit dernière, c'était un peu comme dormir dans un grand berceau, n'est-ce pas, mon chériⓡ\n@c0@"
  it: "@aNera@bIo ho riposato benissimo, amore mio...\nE, a giudicare da come russavi, anche tu hai dormito come un sasso! Eh eh eh!\n@c0@"
  ja: "@a@bフローラ「うふふ。\n\tゆうべは　大きなゆりかごの中で\n\t眠ったような　気分ですわ。\n@c0@"
89:
  de: "@a%0%a001250@bDas Bett war so schön kuschelig weich!\n@c0@"
  en: "@a%0%a001250@bThe bed was so soft!\n@c0@"
  es: "@a%0%a001250@b¡La cama estaba tan blandita!\n@c0@"
  fr: "@a%0%a001250@bLe lit était tellement confortableⓠ\n@c0@"
  it: "@a%0%a001250@bIl letto era morbidissimo!\nM'è sembrato di dormire su una nuvola...\n@c0@"
