  ja: "@a@bピピン「……%a000090さま\n\tどうして　すぐに\n\t否定してくれないんですか……？\n@c0@"
213:
  de: "@aBianca@bHier also werden die Kasinopreise aufbewahrt? Oh, die sind ja klasse ⓚⓛ ich will auch welche!\n@c0@"
  en: "@aBianca@bSo this is where the casino prizes are kept? Ooh! Gimme, gimme, gimme!\n@c0@"
  es: "@aBianca@b¿Así que aquí es donde se guardan los premios del casino? ¡Oooh! ¡Yo quiero, yo quiero!\n@c0@"
  fr: "@aBianca@bAlors c'est ici que l'on conserve les prix du casinoⓡ Oohⓠ Donne-les-moi, donne-les-moi, donne-les-moiⓠ\n@c0@"
  it: "@aBianca@bAllora è qui che custodiscono i premi con cui vengono scambiati i gettoni?\n@c0@"
  ja: "@a@bビアンカ「ここに　カジノの景品が！？\n\tいいな～　いいな～　ほしいねっ。\n@c0@"
214:
  de: "@aBianca@bJa!\n@c0@"
  en: "@aBianca@bYeah!\n@c0@"
  es: "@aBianca@b¡Sí!\n@c0@"
  fr: "@aBianca@bOuaisⓠ\n@c0@"
  it: "@aBianca@bChissà quanta roba ci sarà dentro...\n@c0@"
  ja: "@a@bビアンカ「ねー。\n@c0@"
215:
  de: "@aBianca@bOch.\n@c0@"
  en: "@aBianca@bOh.\n@c0@"
  es: "@aBianca@b¡Oh!\n@c0@"
  fr: "@aBianca@bOh.\n@c0@"
  it: "@aBianca@bNo?\nForse ho capito male...\n@c0@"
  ja: "@a@bビアンカ「あっ　そう。\n@c0@"
216:
  de: "@aNera@bOnassetti hin oder her: Wenn ich hier was anfassen würde, würde ich mich anscheinend in ziemliche Schwierigkeiten bringen!\n@c0@"
  en: "@aNera@bIt looks like I'd be in a lot of trouble if I messed with anything here, no matter that I'm a Briscoletti myself!\n@c0@"
  es: "@aNera@bCreo que, veramente, me metería en un lío si toco algo de lo que hay aquí, aunque sea una Rimaldi.\n@c0@"
  fr: "@aNera@bApparemment, je risquerais beaucoup d'ennuis si je m'amusais à mettre le bazar ici. Peu importe que je sois moi-même une Oscuroniⓠ\n@c0@"
  it: "@aNera@bA giudicare dalla grinta con cui l'ha detto, il braccio me lo mozzerebbe anche se sapesse che sono la figlia del suo principale!\n@c0@"
  ja: "@a@bフローラ「いくら　ルドマンの家の者でも\n\tここの荷物に　手をつけたら\n\tしかられてしまいそうですわね……。\n@c0@"
217:
  de: "@a%0%a001240@bUi! Sieh dir das nur alles an! Die haben alle mehr Gepäck dabei als wir.\n@c0@"
  en: "@a%0%a001240@bWow! Look at all this stuff. The people here have loads more luggage than we do.\n@c0@"
  es: "@a%0%a001240@b¡Arrea! ¡Mira todo esto! La gente aquí lleva muchísimo más equipaje que nosotros.\n@c0@"
  fr: "@a%0%a001240@bWaouhⓠ Regarde toutes ces affaires. Les gens d'ici ont bien plus de bagages que nous.\n@c0@"
  it: "@a%0%a001240@bQuanta roba che c'è qui!\nPare che i passeggeri della Jolly Ace abbiano persino più bagagli di noi, eh?\n@c0@"
  ja: "@a@b%a001240「すごいね。\n\tボクたちの　旅の荷物より\n\tいっぱい　ありそうだね。\n@c0@"
218:
  de: "@aOtto@bPah! Vom bloßen Ansehen kann man gar net sagen, welche Sachen am wertvollsten sind.\n@c0@"
  en: "@aTuppence@bPah! It's impossible to tell just from looking which things are the most valuable.\n@c0@"
  es: "@aAlazar@b¡Buah! Es imposible saber a simple vista qué cosas son las de más valor.\n@c0@"
  fr: "@aInnocent@bPeuhⓠ Impossible de dire à vue d'œil quels sont\nles objets les plus précieux.\n@c0@"
  it: "@aSimon@bC'è da stupirsi che la Jolly Ace non vada a fondo, con tutta la roba che c'è qui dentro!\n@c0@"
  ja: "@a@bピピン「むむっ　こうして見ただけじゃ\n\tどれが　金目のものか　わからない！\n\tくうっ……！\n@c0@"
219:
  de: "@aBianca@bJedenfalls gibt es hier eine Menge Gepäck. Es sieht aus, als wollten sich alle für eine ganze Weile hier niederlassen, was?\n@c0@"
  en: "@aBianca@bThere's certainly a lot of gear in here. Looks like everyone must've come to stay for a while, eh?\n@c0@"
  es: "@aBianca@bEso es un montón de equipaje. Parece que todo el mundo tiene pensado quedarse aquí un tiempo, ¿eh?\n@c0@"
  fr: "@aBianca@bIl est certain qu'il y a beaucoup d'affaires, ici.\nOn dirait que tout le monde a prévu de rester\nun bon moment, heinⓡ\n@c0@"
  it: "@aBianca@bQui c'è davvero una montagna di roba!\r\nPare quasi che i visitatori della Jolly Ace abbiano intenzione di trasferirsi qui in pianta stabile!\n@c0@"
  ja: "@a@bビアンカ「ホントに　すごい荷物。\n\t何日も　泊まりこむつもりで\n\tきた人ばかりなのかしら？\n@c0@"
220:
  de: "@aNera@bEs ist, als hätten die Leute vor, so lange zu bleiben, bis sie einen dicken Gewinn abräumen können, findest du nicht?\n@c0@"
  en: "@aNera@bIt's as if people are planning on staying as long as it takes to have a big win, don't you think?\n@c0@"
  es: "@aNera@bParece que las personas tienen previsto quedarse aquí tutto il tempo necesario hasta que ganen, ¿no te parece?\n@c0@"
  fr: "@aNera@bC'est comme si les gens prévoyaient de rester\ntout le temps qu'il faudra pour gagner gros,\ntu n'as pas cette impressionⓡ\n@c0@"
  it: "@aNera@bForse i clienti del casinò portano con sé tanta roba per avere qualcosa da vendersi nel caso la fortuna non arrida loro ai tavoli da gioco... Ih ih ih!\n@c0@"
  ja: "@a@bフローラ「なんだか　もうけるまで\n\t帰らないぞっていう　意気込みが\n\t荷物から見えるようですわね。\n@c0@"
221:
  de: "@a%0%a001240@bManche Dinge sind Gewinne von hier, oder? Die Glückspilze!\n@c0@"
  en: "@a%0%a001240@bSome of the stuff is what people have won here, isn't it? They're so lucky!\n@c0@"
  es: "@a%0%a001240@bAlgunas cosas son premios que la gente ha conseguido aquí, ¿verdad? ¡Qué suerte tienen!\n@c0@"
  fr: "@a%0%a001240@bLà-dedans, il y a aussi ce que les gens ont gagné, c'est çaⓡ Ils ont tellement de chanceⓠ\n@c0@"
  it: "@a%0%a001240@bSecondo me qui ci sono anche gli oggetti che i giocatori più fortunati hanno vinto al casinò...\n@c0@"
  ja: "@a@b%a001240「あれって　カジノで\n\t当てたのも　あるんだよね？\n\tうらやましいなあ。\n@c0@"
222:
  de: "@aSancho@bDu solltest dir das Gepäck nisst allzu genau ansehen, Chico. Sonst denken die Leute noch, du wolltest etwas stehlen.\n@c0@"
  en: "@aSancho@bYou must no look at the luggages eso much, friend. People are gonna theenk you want to esteal esometheeng.\n@c0@"
  es: "@aSancho@bPues no mires tanto el equipaje, chamaco.\nLa gente va a pensar que quieres robar, nomás.\n@c0@"
  fr: "@aSancho@bT-Tu ne devrais p-pas regarder les bagages\r\ncomme ça, chico. Les gens vont c-croire que\r\ntu veux v-voler quelque chose.\n@c0@"
  it: "@aSancho@bChico, no guardare los bagaglios con troppas insistenzas, altrimenti penseranno que siamo dei ladrones...\n@c0@"
  ja: "@a@bサンチョ「%a000090王　そんなに\n\tものほしげに見ていると\n\tかんちがいされますよ。\n@c0@"
223:
  de: "@aBianca@bEr geht vielleicht nicht ins Kasino, aber während der Arbeit zu schlafen ist auch nicht besser!\n@c0@"
  en: "@aBianca@bHe may not go off playin' in the casino, but surely sleepin' on the job is just as bad!\n@c0@"
  es: "@aBianca@b¡Aunque no se haya ido a jugar al casino, dormirse en su puesto es igual de malo!\n@c0@"
  fr: "@aBianca@bIl ne va peut-être pas jouer au casino, mais dormir à son poste de travail ne vaut pas beaucoup mieuxⓠ\n@c0@"
  it: "@aBianca@bUhm... Se fossi nei panni di mister Fosconi, terrei d'occhio i miei dipendenti.\nMi sa che ce n'è qualcuno che batte la fiacca...\n@c0@"
  ja: "@a@bビアンカ「カジノで遊んでなくても\n\t居眠りしてたら　さぼってるのと\n\t同じよね。\n@c0@"
224:
  de: "@aNera@bSeeleute wie er tragen die Verantwortung für das Leben der Leute hier. Da sollte man doch meinen, dass sie damit etwas sorgsamer umgehen.\n@c0@"
  en: "@aNera@bSailors like him have people's lives in their hands, so you'd really hope for a little more care to be taken.\n@c0@"
  es: "@aNera@bLos marinos como él veramente tienen las vidas de las personas en sus manosⓓ debería tener más cuidado.\n@c0@"
  fr: "@aNera@bLes marins comme lui ont entre leurs mains la vie de plusieurs personnes. On pourrait s'attendre à ce qu'il soit un peu plus consciencieux.\n@c0@"
  it: "@aNera@bQuesto sì che è un lavoratore indefesso!\nAh, ce ne fossero come lui...!\nDirò a mio padre di dargli una promozione!\n@c0@"
  ja: "@a@bフローラ「船で　はたらく方は\n\tお客さまの命を　預かっている者として\n\tしっかり　やってほしいものですわ。\n@c0@"
225:
  de: "@a%0%a001240@bWas hat er wohl gedacht, mit wem er redet?\n@c0@"
  en: "@a%0%a001240@bWho do you suppose he thought he was talking to?\n@c0@"
  es: "@a%0%a001240@b¿Con quién creería que estaba hablando?\n@c0@"
  fr: "@a%0%a001240@bÀ qui tu crois qu'il pensait parlerⓡ\n@c0@"
  it: "@a%0%a001240@bSecondo me qualche partitina durante il turno di lavoro se la fa...\n@c0@"
  ja: "@a@b%a001240「あの人　誰に\n\t言ってるつもりなの？\n@c0@"
226:
  de: "@a%0%a001250@bWenn er schon unbedingt schlafen muss, ist es schade, dass er das nicht ein bisschen leiser kann.\n@c0@"
  en: "@a%0%a001250@bIf he must sleep, it's a shame he can't do it\nmore quietly.\n@c0@"
  es: "@a%0%a001250@bSi tiene que dormir, podría hacerlo más calladito.\n@c0@"
  fr: "@a%0%a001250@bS'il dort, il pourrait au moins le faire en silence.\n@c0@"
  it: "@a%0%a001250@bMa era sveglio?!\nM'era quasi sembrato che stesse dormendo...\n@c0@"
  ja: "@a@b%a001250「寝てるなら\n\tしずかに　寝てくれないと\n\tびっくり　しちゃうの。\n@c0@"
227:
  de: "@aOtto@bEine echte Kunst ⓚⓛ zu schlafen, während er vorgibt, wach zu sein. Ich muss zugeben, dass auch ich gelegentlich zu diesem Trick greife.\n@c0@"
  en: "@aTuppence@bHe's got sleeping while pretending to be awake down to a fine art, that one. It's a little trick I use myself sometimes, I must admit.\n@c0@"
  es: "@aAlazar@bEse ha perfeccionado el arte de parecer despierto mientras duerme. Debo de admitir que es un truco que he utilizado a veces.\n@c0@"
  fr: "@aInnocent@bIl a élevé au rang d'art la capacité à faire semblant d'être éveillé tout en dormant. C'est une petite astuce que j'utilise moi-même parfois, je l'admets.\n@c0@"
  it: "@aSimon@bSire, quell'uomo dev'essere uno scansafatiche!\r\nIo me ne intendo, sa? Sono uno di lor... Ehm, sono uno che i lavativi li sente a un miglio di distanza!\n@c0@"
  ja: "@a@bピピン「あいつ　起きているように\n\t眠る方法を…　いや\n\tボクも　たまに　つかってますが。\n@c0@"
228:
  de: "@aBianca@bEs wäre sicher nicht schlecht, hier zu heiraten, aber erst müsste man ja all seine Gäste hierher bugsieren.\n@c0@"
  en: "@aBianca@bI s'pose it would be pretty nice gettin' married\r\nhere, but it'd be tricky to get your guests to come\r\nall this way.\n@c0@"
  es: "@aBianca@bSupongo que sería bonito casarse aquí, pero no creo que a los invitados les apetezca venir tan lejos.\n@c0@"
  fr: "@aBianca@bÇa doit être assez agréable de se marier ici, mais un peu compliqué pour faire venir les invités aussi loin.\n@c0@"
  it: "@aBianca@bAh ah ah! Il paragone mi sembra proprio azzeccato!\r\nComunque, se il matrimonio è un azzardo, spero di aver fatto la puntata giusta...\n@c0@"
  ja: "@a@bビアンカ「船での結婚式は　ステキだけど\n\tみんなに　ここまで来てもらうのは\n\t大変そうよね。\n@c0@"
229:
  de: "@aNera@bWenn ich mit Papa auf Schiffen unterwegs war, durfte ich mich immer nur in meiner eigenen Kabine und oben an Deck aufhalten.\n@c0@"
  en: "@aNera@bI was only ever allowed in my own room and out on deck when I rode on ships with Papa.\n@c0@"
  es: "@aNera@bCuando viajaba en barco con il mio papino solo tenía permesso para estar en il mio camarote y en cubierta.\n@c0@"
  fr: "@aNera@bQuand je voyageais en bateau avec papa, je n'avais le droit d'être que dans ma cabine ou sur le pont extérieur.\n@c0@"
  it: "@aNera@bOh, santa dea!\nIl matrimonio è tutt'altro che un azzardo!\n㈡\nÈ un passo importantissimo nella vita di ogni essere umano, una cosa che non si può certo fare a cuor leggero!\n@c0@"
  ja: "@a@bフローラ「私　父と船に乗るときは\n\t私たちの部屋と　甲板ぐらいしか\n\t行かせてもらえなかったの。\n@c0@"
230:
  de: "@aNera@bIch hatte keine Ahnung, dass ihm das so wichtig war.\n@c0@"
  en: "@aNera@bI had no idea that he felt so strongly\r\nabout it, though.\n@c0@"
  es: "@aNera@bPero no tenía ni idea de que se lo tomase tan en serio.\n@c0@"
  fr: "@aNera@bMais je ne pensais pas qu'il y accordait autant d'importance.\n@c0@"
  it: "@aNera@bE spero proprio che il mio matrimonio non naufraghi!\n@c0@"
  ja: "@a@bフローラ「父に　そんな思いがあったなんて\n\t私　知らなかったわ。\n@c0@"
231:
  de: "@aBianca@bDas sind eine Menge Küchengerätschaften, was? Damit könnte man alles kochen, was man nur will.\n@c0@"
  en: "@aBianca@bThat's a fair old load of cookin' utensils there, eh? You could make anythin' you liked with them.\n@c0@"
  es: "@aBianca@bAquí hay utensilios de cocina de todas clases, ¿eh? Se puede preparar cualquier cosa con ellos.\n@c0@"
  fr: "@aBianca@bC'est une sacrée batterie de cuisineⓠ Avec ça,\non doit pouvoir préparer tout ce qu'on veut.\n@c0@"
  it: "@aBianca@bA mister Fosconi piace proprio fare le cose in grande, eh?! Ha persino assunto uno chef di fama internazionale per i suoi ospiti!\n@c0@"
  ja: "@a@bビアンカ「料理道具が　けっこう\n\tそろっているわね。\n\tこれなら　どんな料理も作れそうよ。\n@c0@"
232:
  de: "@aNera@bMmm, wie das duftet! Allmählich bekomme ich Hunger.\n@c0@"
  en: "@aNera@bMmm, what a lovely smell! I'm starting to feel a bit hungry now.\n@c0@"
  es: "@aNera@b¡Mmm, qué bien huele! ¡Ho fame!\n@c0@"
  fr: "@aNera@bMmm, quelle bonne odeurⓠ Ça me donne un peu faim.\n@c0@"
  it: "@aNera@bSenti che profumino...!\nMi sta venendo una fame da lupi...\n@c0@"
  ja: "@a@bフローラ「う～ん…　いいにおい。\n\t私　少し　おなかが\n\tすいてきてしまいましたわ……。\n@c0@"
233:
  de: "@a%0%a001240@bJetzt hab ich Hunger!\n@c0@"
  en: "@a%0%a001240@bNow I'm hungry!\n@c0@"
  es: "@a%0%a001240@b¡Tengo hambre!\n@c0@"
  fr: "@a%0%a001240@bÇa m'a donné faimⓠ\n@c0@"
  it: "@a%0%a001240@bPapà, quel signore m'ha fatto venire fame...\n@c0@"
  ja: "@a@b%a001240「おなか　すいた……。\n@c0@"
234:
  de: "@a%0%a001250@bHmmm. Irgendwas riecht hier lecker.\n@c0@"
  en: "@a%0%a001250@bMmm. Something smells absolutely delicious.\n@c0@"
  es: "@a%0%a001250@bMmm... Hay algo que huele muy bien.\n@c0@"
  fr: "@a%0%a001250@bMmm. Il y a quelque chose qui sent divinement bon.\n@c0@"
  it: "@a%0%a001250@bChissà cosa bolle in pentola...\n@c0@"
  ja: "@a@b%a001250「くん　くん……\n\tおいしそうな　ニオイがしてる。\n@c0@"
235:
  de: "@aBianca@bEigentlich haben wir gar keine Zeit, uns zu vergnügen ⓚⓛ und doch sind wir schon wieder hier, was?\n@c0@"
  en: "@aBianca@bWe dun't really have time to be larkin' about...and yet here we are again, eh?\n@c0@"
  es: "@aBianca@bNo tenemos tiempo que perder... Pero aquí estamos otra vez, ¿eh?\n@c0@"
  fr: "@aBianca@bOn n'a pas vraiment le temps de traîner...\r\net pourtant, nous voici de retour ici.\n@c0@"
  it: "@aBianca@bAmore, scusa la domanda...\nCosa ci siamo venuti a fare qui? Non credo che abbiamo tempo da perdere in gite di piacere...\n@c0@"
  ja: "@a@bビアンカ「遊んでる場合じゃ\n\tないんだけど……\n\tまた　ここに　来ちゃったわね。\n@c0@"
236:
  de: "@aNera@bBist du sicher, dass wir jetzt hier sein sollten, Liebling? Ich weiß nicht, ob wir für so etwas Zeit haben.\n@c0@"
  en: "@aNera@bAre you sure we should really be here, darling?\r\nI don't know that we have time for this kind of thing.\n@c0@"
  es: "@aNera@b¿De verdad crees que deberíamos estar aquí, caro mío?\n¡Non credo que tengamos tiempo para estas cosas!\n@c0@"
  fr: "@aNera@bTu es sûr qu'on devrait vraiment être ici,\nmon chériⓡ Je ne sais pas si nous avons\nle temps pour ce genre de choses.\n@c0@"
  it: "@aNera@bCaro, sei certo di aver fatto la cosa giusta a venire qui? Secondo me avevamo cose ben più importanti a cui pensare...\n@c0@"
  ja: "@a@bフローラ「あなた　いいんですか？\n\tこんなところで　遊んでいて……。\n@c0@"
237:
  de: "@a%0%a001240@bSuper, dass wir hier eine Pause einlegen, Papa! Meinst du, hier gibt's ein Schlürfodrom?\n@c0@"
  en: "@a%0%a001240@bThanks for bringing us here, Dad! Do you think they have a slurpodrome?\n@c0@"
  es: "@a%0%a001240@bGracias por habernos traído aquí, papi. ¿Crees que tendrán un limódromo?\n@c0@"
  fr: "@a%0%a001240@bMerci de nous avoir amenés ici, papaⓠ\nTu crois qu'ils ont un gluodromeⓡ\n@c0@"
  it: "@a%0%a001240@bPapà, grazie per avermi portato qui!\nA proposito... Credi che abbiano anche uno slimodromo in questo posto?\n@c0@"
  ja: "@a@b%a001240「ここに来ると\n\tボク　わくわくしちゃうよ。\n\tスライムレースが　あるからかな？\n@c0@"
238:
  de: "@a%0%a001250@bMit Sancho waren wir noch nie hier.\n@c0@"
  en: "@a%0%a001250@bSancho never brought us here.\n@c0@"
  es: "@a%0%a001250@bSancho nunca nos había traído a un sitio así.\n@c0@"
  fr: "@a%0%a001250@bSancho ne nous avait jamais emmenés ici.\n@c0@"
  it: "@a%0%a001250@bLo zio Sancho non ci aveva mai portati qui...\n@c0@"
  ja: "@a@b%a001250「ここには\n\tサンチョおじさんとは\n\t来たことないです……。\n@c0@"
239:
  de: "@aSancho@bDein Onkel Sancho, er hat noch nie von einen solssen Ort gehört!\n@c0@"
  en: "@aSancho@bYour Uncle Sancho, he has never heard about esuch a place like thees!\n@c0@"
  es: "@aSancho@bTu tito Sancho nunca oyó de un sitio igual.\n@c0@"
  fr: "@aSancho@bTonton Sancho n'avait j-j-jamais entendu\nparler d'oun endroit pareilⓠ\n@c0@"
  it: "@aSancho@b¡Ay, que sorpreson!\n¡No sabevo dell'esistenza de esto luego, chico!\n@c0@"
  ja: "@a@bサンチョ「ふ～む…\n\tこんな所が　あったとは……。\n@c0@"
240:
  de: "@aOtto@bNachts ist es hier ein bisschen einsam.\n@c0@"
  en: "@aTuppence@bThe place feels a little bit lonely at night.\n@c0@"
  es: "@aAlazar@bEste sitio parece un poco solitario por las noches.\n@c0@"
  fr: "@aInnocent@bCet endroit est un peu désolé, la nuit.\n@c0@"
  it: "@aSimon@bDi notte qui non c'è molta gente, eh?\n@c0@"
  ja: "@a@bピピン「夜は　ちょっと\n\tさみしい感じですねえ……。\n@c0@"
241:
  de: "@aBianca@bTja, wenn wir reingehen wollen, dann jetzt oder nie!\n@c0@"
  en: "@aBianca@bWell, if we're goin' in, then let's get movin'.\n@c0@"
  es: "@aBianca@bBueno, si vamos a entrar... ¡En marcha!\n@c0@"
  fr: "@aBianca@bBon, eh bien, si c'est là-bas qu'on va, grimpons.\n@c0@"
  it: "@aBianca@bBeh, se vogliamo andare dobbiamo darci una mossa...\n@c0@"
  ja: "@a@bビアンカ「さあ　行くなら　行きましょ。\n@c0@"
242:
  de: "@aNera@bSei vorsichtig, wenn du auf den Ponton steigst, ja, Liebling?\n@c0@"
  en: "@aNera@bMind how you go when you step onto the pontoon, won't you, darling?\n@c0@"
  es: "@aNera@bTen cuidado dónde pisas cuando pases por la pasarela, ¿de acuerdo, caro mio?\n@c0@"
  fr: "@aNera@bFais attention où tu mets les pieds, une fois\nsur le ponton, d'accord mon chériⓡ\n@c0@"
  it: "@aNera@bTesoro, tienimi la mano quando saliamo a bordo di quella barchetta...\nHo paura di cadere in acqua.\n@c0@"
  ja: "@a@bフローラ「あなた。\n\t小舟に　乗るときは\n\t足もとに　気をつけてくださいね。\n@c0@"
243:
  de: "@a%0%a001240@bDas macht ja Spaß, so an Bord zu gehen!\n@c0@"
  en: "@a%0%a001240@bWhat a cool way to get aboard!\n@c0@"
  es: "@a%0%a001240@b¡Que forma tan guay de subir a bordo!\n@c0@"
  fr: "@a%0%a001240@bC'est super comme façon de monter à bordⓠ\n@c0@"
  it: "@a%0%a001240@bTutti a bordo!\n@c0@"
  ja: "@a@b%a001240「小舟で　行くなんて\n\tなんだか　かっこいい～！\n@c0@"
244:
  de: "@a%0%a001250@bDann müssen wir also erst auf das kleine Boot, um auf das große zu gelangen?\n@c0@"
  en: "@a%0%a001250@bSo we have to get on that little boat first, and then we get on the big one?\n@c0@"
  es: "@a%0%a001250@bAsí que, ¿primero tenemos que subirnos en el barquito y luego vamos en él hasta el grande?\n@c0@"
  fr: "@a%0%a001250@bAlors on doit d'abord monter sur ce petit bateau pour aller sur le grandⓡ\n@c0@"
  it: "@a%0%a001250@bAh, ho capito! La barca piccola porta i clienti fino alla Jolly Ace, per evitare che al casinò arrivino ospiti indesiderati... Ottima pensata!\n@c0@"
  ja: "@a@b%a001250「小さいお舟にのって\n\t大きいお船にのるの？\n@c0@"
245:
  de: "@aOtto@bOb sie es wohl deshalb so kompliziert machen, hier rein- oder rauszukommen, damit sich niemand vorzeitig mit seinen Gewinnen aus dem Staub macht?\n@c0@"
  en: "@aTuppence@bI wonder if this rather convoluted way of entering and exiting the place is so that no one can run off before time with their winnings.\n@c0@"
  es: "@aAlazar@bMe pregunto si este modo tan complicado de entrar y salir del casino es para que nadie se escape con las ganancias.\n@c0@"
  fr: "@aInnocent@bJe me demande si cette façon complexe d'entrer et de sortir de cet endroit n'est pas faite pour éviter que les gens se sauvent trop vite avec leurs gains.\n@c0@"
  it: "@aSimon@bCerto che non è facile salire a bordo della Jolly Ace, Maestà.\n㈡\nIn questo modo, però, si riesce a controllare facilmente chi entra nel casinò, ed è possibile lasciare a terra eventuali ospiti sgraditi.\n@c0@"
  ja: "@a@bピピン「小舟をつかわないと\n\t行けないなんて　まさか\n\t勝ち逃げ　できないように…　とか！？\n@c0@"
246:
  de: "@aBianca@bVielleicht sollte ich mir auch was wünschen! Ich wünsche mir, dass meine Familie nie wieder getrennt wird.\n@c0@"
  en: "@aBianca@bMaybe I should make a wish too! I wish that my family will never be separated again.\n@c0@"
  es: "@aBianca@bA lo mejor yo también debería pedir un deseo. Deseo que mi familia nunca se vuelva a separar.\n@c0@"
  fr: "@aBianca@bPeut-être que je devrais faire un vœu, moi aussiⓠ Je souhaite que ma famille ne soit plus jamais séparée.\n@c0@"
  it: "@aBianca@bAnch'io voglio esprimere un desiderio...\nVoglio che la nostra famiglia resti sempre unita!\n@c0@"
  ja: "@a@bビアンカ「私も　お願いしちゃおうっと！\n\tもう　家族が　ばらばらになったり\n\tしませんように……。\n@c0@"
247:
  de: "@aNera@bSich bei einer Sternschnuppe etwas zu wünschen wird die Welt auch nicht von Großmeister Nimzo befreien. Nein, das müssen wir schon selbst erledigen.\n@c0@"
  en: "@aNera@bWishing upon a star isn't going to rid the\r\nworld of Grandmaster Nimzo. No, we have\r\nto do that ourselves.\n@c0@"
  es: "@aNera@bPedirle un deseo a una estrella fugaz no va a librar il mondo del Gran Maestro Nimzo. No, nosotros tendremos que hacerlo.\n@c0@"
  fr: "@aNera@bCe n'est pas en faisant des vœux sous les étoiles filantes qu'on débarrassera le monde du Grand Maître Nimzo. Il faut qu'on s'en charge nous-mêmes.\n@c0@"
  it: "@aNera@bStella, stella cadente...\nLiberaci da Nimzo, il mostro fetente!\n@c0@"
  ja: "@a@bフローラ「星に　お願いしても\n\t大魔王は　たおせませんものね。\n\t私たちが　がんばらないと……。\n@c0@"
248:
  de: "@a%0%a001250@bOh ja! Sieh nur, wie hübsch die Sterne sind!\n@c0@"
  en: "@a%0%a001250@bOh yes! Look how pretty the stars are!\n@c0@"
  es: "@a%0%a001250@b¡Oh, sí! ¡Qué bonita son las estrellas!\n@c0@"
  fr: "@a%0%a001250@bOh, ouiⓠ Regarde comme les étoiles sont joliesⓠ\n@c0@"
  it: "@a%0%a001250@bPapà, hai visto quanto sono belle le stelle stasera?\nBrillano come i tuoi occhi!\n@c0@"
  ja: "@a@b%a001250「わあ　ホント。\n\tきれいな　お星さま……。\n@c0@"
249:
  de: "@aOtto@bIch hab mir schon Dutzende Male beim Anblick einer Sternschnuppe was gewünscht, und es ist noch net einmal in Erfüllung gegangen!\n@c0@"
  en: "@aTuppence@bI've wished upon stars dozens of times, and not once has my wish come true!\n@c0@"
  es: "@aAlazar@bHe pedido deseos a estrellas fugaces un montón de veces y no se me ha cumplido ni uno.\n@c0@"
  fr: "@aInnocent@bJ'ai fait des vœux sous les étoiles des dizaines de fois, et aucun d'entre eux ne s'est réaliséⓠ\n@c0@"
  it: "@aSimon@bHo espresso centinaia di desideri in vita mia, e non se n'è realizzato nemmeno mezzo!\nPerché le stelle cadenti mi ignorano?!\n@c0@"
  ja: "@a@bピピン「ボク　星に願いを\n\tかなえてもらったこと\n\t一度も　ないですよ！\n@c0@"
250:
  de: "@aBianca@bIst das nicht ein bisschen traurig, so allein zu trinken?\n@c0@"
  en: "@aBianca@bEn't it a bit sad drinkin' on your own like that?\n@c0@"
  es: "@aBianca@b¿No es un poco triste beber sola de esa manera?\n@c0@"
  fr: "@aBianca@bÇa n'est pas un peu triste de boire toute seule, comme çaⓡ\n@c0@"
  it: "@aBianca@bSorseggiare un drink sotto le stelle è senz'altro bello, ma non sarebbe meglio farlo in compagnia?\n@c0@"
  ja: "@a@bビアンカ「ひとりで　お酒を飲むのって\n\tちょっと　さみしいわよね。\n@c0@"
251:
  de: "@aNera@bWir genießen jedenfalls einen schönen Spaziergang bei sternklarem Himmel, nicht wahr, Liebling?\n@c0@"
  en: "@aNera@bWell, we're enjoying a nice walk under the stars, aren't we, darling?\n@c0@"
  es: "@aNera@bBueno, nosotros estamos disfrutando de un agradable paseo soto le stelle, ¿verdad, caro?\n@c0@"
  fr: "@aNera@bEh bien nous, nous profitons d'une agréable promenade sous les étoiles, n'est-ce pas, mon chériⓡ\n@c0@"
  it: "@aNera@bIo preferisco passeggiare sotto le stelle accanto a te, caro...\n@c0@"
  ja: "@a@bフローラ「私たちは　星空の下で\n\t散歩を　たのしむ時間ですわね。\n@c0@"
252:
  de: "@a%0%a001250@b(Gähn) Ich werde auf einmal ganz müde.\n@c0@"
  en: "@a%0%a001250@b(yawn) I've come over all sleepy all of a sudden.\n@c0@"
  es: "@a%0%a001250@bAaaah, de golpe me ha entrado un ataque de sueño.\n@c0@"
  fr: "@a%0%a001250@b(bâillement) Je me sens toute fatiguée, d'un coup.\n@c0@"
  it: "@a%0%a001250@bYaaawn...\nPapà, forse lo immagini di già, ma...\nM'è venuto sonno!\n@c0@"
  ja: "@a@b%a001250「ふわぁ…\n\t眠くなってきちゃった……。\n@c0@"
253:
  de: "@aOtto@bManche haben's gut! Wir rackern uns ab, um unsere Mission zu erfüllen, und die faseln was von Champagner unterm Sternenzelt!\n@c0@"
  en: "@aTuppence@bIt's alright for some! Here we are, struggling away with our quest, while the likes of her swan about drinking champagne!\n@c0@"
  es: "@aAlazar@b¡A algunos les va de maravilla! Nosotros aquí, sufriendo para cumplir nuestra misión, mientras los de su calaña se dedican a beber champán.\n@c0@"
  fr: "@aInnocent@bIl y en a pour qui ça vaⓠ Nous, on est là, à se débattre avec notre quête, pendant que des gens comme elle font les beaux en buvant du champagneⓠ\n@c0@"
  it: "@aSimon@bMaestà, non è giusto!\n㈡\nNoi stiamo mettendo a repentaglio le nostre vite per il bene di tutti, e quella lì se ne sta bella comoda a sorseggiare il suo drink come se nulla fosse!\n@c0@"
  ja: "@a@bピピン「ゆうがですねえ。\n\tボクたちは　こんなに苦労してるのに！\n@c0@"
254:
  de: "@aBianca@bDann liegt dieses Schiff also nur noch vor Anker, was?\n@c0@"
  en: "@aBianca@bSo they dun't sail this ship no more, eh?\n@c0@"
  es: "@aBianca@b¿Así que este barco ya no navega, pues?\n@c0@"
  fr: "@aBianca@bAlors ce bateau ne navigue plusⓡ\n@c0@"
  it: "@aBianca@bScommetto che al Capitano mancano le avventure che viveva quando navigava sull'oceano...\nForse la vita tranquilla della Jolly Ace non fa per lui.\n@c0@"
  ja: "@a@bビアンカ「この船は　外海に\n\t出ないんだ……。\n@c0@"
255:
  de: "@aNera@bWie knuffig! Man braucht sicher viel Hingabe, um zum Schiffskapitän aufzusteigen.\n@c0@"
  en: "@aNera@bHow sweet! It must take a lot of dedication to become a ship's captain.\n@c0@"
  es: "@aNera@b¡Qué encanto! Ser capitán de un barco debe de requerir mucha entrega...\n@c0@"
  fr: "@aNera@bQuelle conscience professionnelleⓠ Ça doit être un vrai sacerdoce de devenir capitaine de navire.\n@c0@"
  it: "@aNera@bCerto che dev'essere triste per un capitano di lungo corso non navigare più in alto mare...\n@c0@"
  ja: "@a@bフローラ「立派な　おこころざしですわ。\n\t船長となられる方は　ちがいますわね。\n@c0@"
256:
  de: "@a%0%a001240@bWas für Sachen er wohl da reinschreibt?\n@c0@"
  en: "@a%0%a001240@bWhat sort of things do you think he writes?\nI wouldn't mind having a read.\n@c0@"
  es: "@a%0%a001240@b¿Qué escribirá?\nMe encantaría poder leerlo.\n@c0@"
  fr: "@a%0%a001240@bQu'est-ce que tu crois qu'il écrit dedansⓡ\nJ'aimerais bien le lire.\n@c0@"
  it: "@a%0%a001240@bCosa scriverà il capitano sul diario di bordo?\nSarei proprio curioso di leggerlo...\n@c0@"
  ja: "@a@b%a001240「どんな日誌なのかな？\n\tボクも　見てみたいな。\n@c0@"
257:
  de: "@aBianca@bMeine Güte! Der ist immer im Dienst, ob er nun schläft oder wach ist, was?\n@c0@"
  en: "@aBianca@bBlimey! It's all go for him whether he's awake or asleep, eh?\n@c0@"
  es: "@aBianca@b¡Cuernos! A este le da igual estar dormido que despierto, ¿eh?\n@c0@"
  fr: "@aBianca@bSaperlipopetteⓠ Il pense à jouer tout le temps,\nmême quand il dortⓠ\n@c0@"
  it: "@aBianca@bCos'è che non può fare?!\nSono curiosa!\nVoglio saperlo!\n@c0@"
  ja: "@a@bビアンカ「寝ても　覚めても…　とは\n\tまさに　あのことね。\n@c0@"
258:
  de: "@aNera@bDas muss ein Spieler mit Leib und Seele sein, wenn ihn der Gedanke sogar noch im Schlaf verfolgt!\n@c0@"
  en: "@aNera@bHe must be a keen gambler to be fretting about it in his sleep!\n@c0@"
  es: "@aNera@bDebe de ser un jugador muy dedicado. ¡Hasta sogna con ello!\n@c0@"
  fr: "@aNera@bÇa doit être un sacré joueur pour que ça le perturbe à ce point dans son sommeilⓠ\n@c0@"
  it: "@aNera@bNon credo che stia sognando qualcosa di piacevole...\n@c0@"
  ja: "@a@bフローラ「夢の中でまで　カジノで\n\t勝負なさっているなんて……\n\tよほど　お好きなのね。\n@c0@"
259:
  de: "@a%0%a001250@bEs ist fast, als würde er sogar im Schlaf noch kämpfen.\n@c0@"
  en: "@a%0%a001250@bIt's like he's fighting even in his sleep.\n@c0@"
  es: "@a%0%a001250@bEs como si estuviera luchando, incluso en sueños.\n@c0@"
  fr: "@a%0%a001250@bOn dirait qu'il se bat même en dormant.\n@c0@"
  it: "@a%0%a001250@bSembra quasi che stia lottando nel sonno...\n@c0@"
  ja: "@a@b%a001250「寝てても\n\tたたかってるみたい……。\n@c0@"
260:
  de: "@aOtto@bWenn er so schläft, wacht er bestimmt mit Kopfschmerzen auf.\n@c0@"
  en: "@aTuppence@bI should imagine he'll wake up with terrible backache, sleeping like that.\n@c0@"
  es: "@aAlazar@bImagino que se levantará con un dolor de espalda tremendo si duerme en esa postura.\n@c0@"
  fr: "@aInnocent@bQuand je le vois dormir comme ça, je me dis qu'il va se réveiller avec un mal de dos terrible.\n@c0@"
  it: "@aSimon@bⓕNon posso farloⓖ... ⓕNon posso farloⓖ...?!\nE poi...? Cosa non può fare, eh?!\nAvanti, dillo! Forza, che sono curioso!\n@c0@"
  ja: "@a@bピピン「ここで寝ると\n\t背中が　痛くなるだろうなあ……。\n@c0@"
