  en: "@a@b*: Oh! You're not my husband!\nI, I do apologise.\n@c0@"
  es: "@a@b*: ¡Oh! ¡No eres mi marido!\r\nP-perdón.\n@c0@"
  fr: "@a@b*ⓢ Ohⓠ Vous n'êtes pas mon mariⓠ\nJ-Je m'excuse.\n@c0@"
  it: "@a@b*: Oh! Ma tu non sei mio marito!\nScusami!\n@c0@"
  ja: "@a@b＊「あら？　主人じゃなかったの？\n\tわるかったわねえ。\n@c0@"
184:
