  fr: "@a@b*ⓢ Si seulement les jeunes d'aujourd'hui ne mettaient pas tant de temps à se marier. Ça cause beaucoup de soucis aux parents, vous savez.\n@c0@"
  it: "@a@b*: Non capisco come mai i giovani abbiano sempre tanti grilli per la testa e non pensino a sposarsi e a metter su famiglia!\n㈡\n*: Per una madre non c'è gioia più grande che cullare un nipotino, o magari tre o quattro!\n@c0@"
  ja: "@a@b＊「早いとこ　花嫁をみつけなきゃ\n\t安心できやしないよ。\n@c0@"
177:
  de: "@a@b*: Aber ich sehe, dass Ihr offenbar auf Reisen seid. Ihr seid wohl schon verheiratet, nicht wahr?\n@c0@"
  en: "@a@b*: Although you're a traveller, I see.\nI expect you're married already, aren't you?\n@c0@"
  es: "@a@b*: Aunque veo que tú eres un viajero.\r\nYa estarás casado, ¿no?\n@c0@"
  fr: "@a@b*ⓢ Mais vous, vous êtes un voyageur.\nJe suppose que vous êtes déjà marié, nonⓡ\n@c0@"
  it: "@a@b*: Tu sei sposato, non è vero?\n@c0@"
  ja: "@a@b＊「あんたは　もう\n\tいい人が　いるのかい？\n@c0@"
178:
  de: "@a@b*: Wusste ich's doch! Sicher trefft Ihr viele passende junge Damen, wenn Ihr so durch die Lande reist.\n@c0@"
  en: "@a@b*: I knew it! You must meet lots of suitable young ladies travelling about the place like you do.\n@c0@"
  es: "@a@b*: ¡Lo sabía! Yendo de un sitio para otro encontrarás montones de jóvenes dispuestas.\n@c0@"
  fr: "@a@b*ⓢ Je le savaisⓠ Vous devez rencontrer beaucoup de jeunes femmes comme il faut au cours de vos périples.\n@c0@"
  it: "@a@b*: L'avevo capito. Un tipino con l'occhio vispo come te avrà certamente già incontrato la ragazza dei suoi sogni, e non se la sarà fatta scappare!\n@c0@"
  ja: "@a@b＊「やっぱりねえ。　旅をしていれば\n\t女の子との出会いも\n\tたくさん　あるんだろうね。\n@c0@"
179:
  de: "@a@b*: Wirklich? Nun, Ihr solltet nicht zu lange warten. Wir Eltern haben erst dann Ruhe, wenn wir unsere Kinder verheiratet haben.\n@c0@"
  en: "@a@b*: Really? Well, you don't want to leave it too long. We parents can't relax until we've seen our children married, you know.\n@c0@"
  es: "@a@b*: ¿De verdad? Pues no lo vayas dejando. Los padres no descansamos hasta que logramos casaros.\n@c0@"
  fr: "@a@b*ⓢ Ah bonⓡ N'attendez pas trop longtemps. Nous, les parents, nous ne sommes tranquilles que lorsque nos enfants sont mariés.\n@c0@"
