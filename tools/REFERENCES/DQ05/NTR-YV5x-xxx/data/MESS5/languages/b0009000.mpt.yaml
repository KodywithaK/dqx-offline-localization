  it: "@a@b*: No? Oh, questa sì che è bella!\nBeh, in tal caso dovrò %H0860%Xchiederti%Ychiedervi%Z di tornare un'altra volta.\n@c0@"
  ja: "@a@b＊「では　申しわけありませんが\n\tお引き取りください。\n@c0@"
193:
  de: "@a@b*: Herr Onassetti ist heute sehr beschäftigt. Er spricht mit allen Kandidaten, die um Fräulein Neras Hand anhalten wollen.\n@c0@"
