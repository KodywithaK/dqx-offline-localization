  it: "@a@b*: Questa è una cosa che una certa ragazza di nome Viola ha capito bene.\nAnzi: fin troppo bene!\n@c0@"
  ja: "@a@b＊「……けど　デボラさんみたいなのは\n\tさすがに　どうかと思うけど。\n@c0@"
138:
  de: "@a@b*: Endlich! Da seid Ihr ja! Ich habe Euch schon überall gesucht!\n@c0@"
  en: "@a@b*: At last! There you are! I've been looking for you all over the place!\n@c0@"
  es: "@a@b*: ¡Al fin! ¡Aquí %H0860%Xestás%Yestáis%Z! ¡%H0860%XTe%YOs%Z he estado buscando por todos lados!\n@c0@"
  fr: "@a@b*ⓢ Vous voilà enfinⓠ Je vous ai cherché%H0860%X%A0110%X%Z%B0110%Xe%Z%Y%R0000%Xes%Ys%Z%Z partoutⓠ\n@c0@"
  it: "@a@b*: Oh, finalmente %H0860%X%A0110%Xti ho trovato%Z%B0110%Xti ho trovata%Z%Y%R0000%Xvi ho trovate%Yvi ho trovati%Z%Z!\nNon sapevo più dove %H0860%Xcercarti%Ycercarvi%Z!\n@c0@"
  ja: "@a@b＊「やや！　あなたさまはっ！？\n\tさ　さがしましたぞ！\n@c0@"
139:
  de: "@a@b*: Ich bin ein Soldat aus Tifortu. Prinz Harry will Euch dringend sehen.\n@c0@"
  en: "@a@b*: I'm a soldier from Coburg.\nPrince Harry is absolutely desperate to see you.\n@c0@"
  es: "@a@b*: Soy un soldado de Trastámara.\nEl príncipe Froilán está desesperado por %H0860%Xverte%Yveros%Z.\n@c0@"
  fr: "@a@b*ⓢ Je suis un soldat de l'armée de Cobourg.\nLe prince Harry veut absolument vous voir.\n@c0@"
  it: "@a@b*: Sono un soldato di Coburg!\nIl principe Robert vuole assolutamente %H0860%Xvederti%Yvedervi%Z!\n@c0@"
  ja: "@a@b＊「私は　ラインハットの兵士。\n\tヘンリーさまが　あなたさまに\n\t会いたがっておられます。\n@c0@"
140:
  de: "@a@b*: Bitte beeilt Euch ⓚⓛ begebt Euch sofort hinüber nach Tifortu!\n@c0@"
  en: "@a@b*: Please hurry over to Coburg at once!\n@c0@"
  es: "@a@b*: ¡%H0860%XDebes%YDebéis%Z ir a Trastámara a toda prisa!\n@c0@"
  fr: "@a@b*ⓢ Vous devez vous rendre immédiatement à Cobourgⓠ\n@c0@"
  it: "@a@b*: %H0860%XDevi%YDovete%Z andare immediatamente a Coburg!\n@c0@"
  ja: "@a@b＊「ど　どうか　ラインハットに\n\tおもどりください！\n@c0@"
141:
  de: "@a@b*: Wau! Wau! Wau!\n@c0@"
  en: "@a@b*: Bau! Bau bau!\n@c0@"
  es: "@a@b*: ¡Guau! ¡Guau, guau!\n@c0@"
  fr: "@a@b*ⓢ Bauⓠ Bau bauⓠ\n@c0@"
  it: "@a@b*: Bau!\nBau bau!\n@c0@"
  ja: "@a@b＊「わん　わん！\n@c0@"
142:
  de: "@a@b*: Bitte! Haltet den Hund auf!\n@c0@"
  en: "@a@b*: Somebody! Please! Stop that dog!\n@c0@"
  es: "@a@b*: ¡Per favore! ¡Ayuda! ¡Detén a ese perro!\n@c0@"
  fr: "@a@b*ⓢ Arrêtez ce chienⓠ Arrêtez-le, s'il vous plaîtⓠ\n@c0@"
  it: "@a@b*: Aiuto!\nAiutatemi a fermare quel cane!\n@c0@"
  ja: "@a@b＊「誰か！　お願いです！\n\tその犬を　つかまえて下さい！\n@c0@"
143:
  de: "@a@b*: Hahh... hahh... Tut... mir leid... Er... ist einfach... weggelaufen...\n@c0@"
  en: "@a@b*: Hahh...hahh...\nI'm...so sorry...\nHe just...hahh...ran off...\n@c0@"
  es: "@a@b*: Aaah..., aaah...\r\nL-lo siento...\r\nS-se... ah... se ha escapatto...\n@c0@"
  fr: "@a@b*ⓢ Han... han...\nJe... suis... désolée...\nIl m'a... han... échappé...\n@c0@"
  it: "@a@b*: Haaahhh... Haaahhh...\nMi sono distratta solo un attimo ed è scappato via...\nHaaah...\n@c0@"
  ja: "@a@b＊「はあ　はあ……。\n\tごめんなさい。　この子が\n\tとつぜん　走り出して……。\n@c0@"
144:
  de: "@a@b*: Was ist denn los mit dir, Bingo?\nNa komm schon. Bei Fuß!\n@c0@"
  en: "@a@b*: What's got into you, Bingo?\nCome on. Come here.\n@c0@"
  es: "@a@b*: ¿Qué te pasa, Bingo?\r\nVamos. Vieni qui.\n@c0@"
  fr: "@a@b*ⓢ Qu'est-ce qui t'a pris, Bingoⓡ\nViens. Viens ici.\n@c0@"
  it: "@a@b*: Bingo! Ehi, Bingo!\nInsomma, si può sapere che ti è preso?\nVieni qui, piccolo.\n@c0@"
  ja: "@a@b＊「いったい　どうしたのかしら？\n\tさあ　いらっしゃい。\n\tリリアン！\n@c0@"
145:
  de: "@aBingo@bWau wau! Wuff, wuuuff.\n@c0@"
  en: "@aBingo@bBau bau!\nArf, aaarf.\n@c0@"
  es: "@aBingo@b¡Guau, guau!\r\nArf, aaarf.\n@c0@"
  fr: "@aBingo@bBau bauⓠ\nOuaf, ouaaaf.\n@c0@"
  it: "@aBingo@bBau!\nArf! Arf! Arf!\n@c0@"
  ja: "@a@bリリアン「わん　わんっ！\n\tく～ん　く～ん。\n@c0@"
146:
  de: "@a@b*: Meine Güte! Er scheint Euch zu mögen. Sonst lässt er nie jemanden an sich heran.\n@c0@"
  en: "@a@b*: Goodness! That's the first time he's ever taken a shine to someone other than me.\n@c0@"
  es: "@a@b*: ¡Per la Diosa! Nunca se había encariñado cosi con otra persona.\n@c0@"
  fr: "@a@b*ⓢ C'est impressionnantⓠ C'est la première fois qu'il se prend d'affection pour quelqu'un d'autre que moi.\n@c0@"
  it: "@a@b*: Ma tu guarda!\nNon l'avevo mai visto fare le feste a un estraneo...\n@c0@"
  ja: "@a@b＊「まあっ！？　リリアンが\n\t私いがいの人に　なつくなんて\n\t初めてですわ。\n@c0@"
