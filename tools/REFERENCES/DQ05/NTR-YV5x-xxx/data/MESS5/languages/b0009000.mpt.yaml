16:
  de: "@a@b*: Ich hab gehört, in Tifortu soll endlich wieder Recht und Ordnung herrschen. Na, wenn das keine guten Neuigkeiten sind!\n@c0@"
  en: "@a@b*: I hear law an' order's been restored in Coburg at last. Well that sure is good news now, isn't it?\n@c0@"
  es: "@a@b*: He oído que por fin ha vuelto el orden a Trastámara. Vaya notición, ¿eh?\n@c0@"
  fr: "@a@b*ⓢ Il paraît que la loi et l'ordre sont enfin revenus à Cobourg. On peut dire que c'est une bonne\nnouvelle, nonⓡ\n@c0@"
  it: "@a@b*: A Coburg sono tornate pace e serenità, ordine e giustizia!\nChe bella cosa!\n@c0@"
  ja: "@a@b＊「うわさでは　ラインハットが\n\t平和な国に　もどったそうです。\n\tめでたいことですね。\n@c0@"
17:
  de: "@a@b*: Ich will unbedingt Tänzerin werden. Tänzerinnen sind die hübschesten Mädchen der Welt!\n@c0@"
  en: "@a@b*: My ambition's to be a dancer. Dancers are the prettiest girls in the world!\n@c0@"
  es: "@a@b*: Yo lo que quiero es ser bailarina. ¡Son las chicas más bonitas del mundo!\n@c0@"
  fr: "@a@b*ⓢ Je veux devenir danseuse. Les danseuses sont les filles les plus jolies au mondeⓠ\n@c0@"
  it: "@a@b*: Voglio diventare una ballerina!\nLe ballerine sono tutte bellissime!\nNon si è mai vista una ballerina racchia, no?\n@c0@"
  ja: "@a@b＊「あたし　踊り娘になりたくて\n\tこの町に　やって来たんだけど……。\n@c0@"
18:
  de: "@a@b*: Darum bin ich hier. Aber es ist gar nicht so leicht, es als Tänzerin zu schaffen.\n@c0@"
  en: "@a@b*: That's what I came here for. But it's really hard trying to make it in the dancing game.\n@c0@"
  es: "@a@b*: Para eso vine aquí. Pero es dificilísimo entrar en el mundo del baile.\n@c0@"
  fr: "@a@b*ⓢ C'est pour ça que je suis venue ici, mais c'est vraiment difficile de percer dans le milieu de la danse.\n@c0@"
  it: "@a@b*: Così sono venuta qui per cercare di entrare in una compagnia di ballo, ma non è facile!\nOh, no! Non lo è affatto!\n@c0@"
  ja: "@a@b＊「プロの道は　なかなか\n\tきびしいものね。\n@c0@"
19:
  de: "@a@b*: Ich bin hier, weil ich einen legendären Schild suche, von dem man mir erzählt hat.\n@c0@"
  en: "@a@b*: I came here looking for a legendary shield I heard about.\n@c0@"
  es: "@a@b*: Vine aquí en busca de un supuesto escudo legendario.\n@c0@"
  fr: "@a@b*ⓢ Je suis venu ici chercher un bouclier légendaire dont j'ai entendu parler.\n@c0@"
  it: "@a@b*: Sono qui perché mi hanno detto che da queste parti è custodito uno scudo molto particolare.\n@c0@"
  ja: "@a@b＊「私は　伝説の盾をさがして\n\t旅をしています。\n@c0@"
20:
  de: "@a@b*: Wenn Fortuna einem hold ist, könnte einem so etwas ein kleines Vermögen einbringen. Ha ha ha! Kapiert? Fortuna!\n@c0@"
  en: "@a@b*: Something like that would go for a small fortuna. Ha ha ha! Get it? Fortuna!\n@c0@"
  es: "@a@b*: Algo que podría valer una pequeña fortuna. ¡Ja, ja, ja! ¿No lo %H0860%Xhas%Yhabéis%Z pillado? ¡Fortuna!\n@c0@"
  fr: "@a@b*ⓢ Un objet dans ce genre vaut bien une bonne aventure. Ha ha haⓠ Vous avez comprisⓡ Bonaventureⓠ\n@c0@"
  it: "@a@b*: Se riuscissi a metterci le mani sopra, potrei farci una... fortuna! Ah ah ah! %H0860%XL'hai%YL'avete%Z capita?\nUna fortuna... a Fortuna! Ah ah ah! Ehm...\n@c0@"
  ja: "@a@b＊「もし　見つけられたら\n\tきっと　高く売れるでしょうな。\n@c0@"
21:
  de: "@a@b*: Verflixt, was gäbe ich nicht dafür, wenn ich jetzt in diesem Kasino sein könnte!\n@c0@"
  en: "@a@b*: Gosh, darn it, I'd give my right arm to be in that casino right now.\n@c0@"
  es: "@a@b*: Maldita sea, daría el brazo derecho por estar en ese casino ahora mismo.\n@c0@"
  fr: "@a@b*ⓢ Quelle plaieⓠ Je donnerais mon bras droit pour être au casino en ce moment.\n@c0@"
  it: "@a@b*: Accidentaccio!\nVorrei tanto andarmene un po' al casinò...\n@c0@"
  ja: "@a@b＊「くそー\n\tカジノに　行きてえなあ。\n@c0@"
22:
  de: "@a@b*: Ach, was soll's. Ich hab die Nase voll von dem Laden. Ich gehe!\n@c0@"
  en: "@a@b*: Oh, what the heck! I'm sick o' this store. I'm goin'!\n@c0@"
  es: "@a@b*: ¡Ah, qué diablos! ¡Ya no aguanto esta tienda! ¡Me largo!\n@c0@"
  fr: "@a@b*ⓢ J'en ai vraiment marreⓠ Ce magasin me sort par les yeux. Je m'en vais.\n@c0@"
  it: "@a@b*: Oh, al diavolo il negozio!\nMe ne vado a fare un paio di puntatine!\n@c0@"
  ja: "@a@b＊「ええい！　いいや！\n\t行っちまえ！\n@c0@"
23:
  de: "@a@b*: Oh, guten Tag. Ach, Ihr seid ein Freund meines Mannes? Dann habt Ihr sicher schon gehört, was er jetzt wieder vorhat, nicht?\n@c0@"
  en: "@a@b*: Why, hello there. Oh, you're a friend of my husband? I suppose you've heard what he's planning now, then?\n@c0@"
  es: "@a@b*: Vaya, hola. ¿Eres %A0110%Xamigo%Z%B0110%Xamiga%Z de mi marido? Entonces habrás oído lo que planea ahora.\n@c0@"
  fr: "@a@b*ⓢ Bonjour, %A0110%XMonsieur%Z%B0110%XMademoiselle%Z. Oh, vous êtes %A0110%Xun ami%Z%B0110%Xune amie%Z de mon mariⓡ J'imagine que vous savez ce qu'il a en tête, alorsⓡ\n@c0@"
  it: "@a@b*: Salve! %H0860%X%A0110%XSei un amico%Z%B0110%XSei un'amica%Z%Y%R0000%XSiete amiche%YSiete amici%Z%Z di mio marito?\nLa %H0860%Xsai%Ysapete%Z l'ultima di quello sciagurato, vero?\n@c0@"
  ja: "@a@b＊「おや　あんた　うちの人の\n\t知り合いかい？\n\tだったら　聞いておくれよ。\n@c0@"
24:
  de: "@a@b*: Jetzt will er gar nicht mehr zu diesem Schloss, um Geschäfte zu machen. Oh nein! Jetzt ist er viel zu beschäftigt im Kasino, um an Arbeit zu denken!\n@c0@"
  en: "@a@b*: He gave up on the idea of goin' away to that castle to do business. Oh, yes! He's far too busy at the casino now to think about work!\n@c0@"
  es: "@a@b*: Ya no quiere largarse a ese castillo a trapichear. ¡Oh, no! ¡Ahora el casino ni le permite pensar en trabajar!\n@c0@"
  fr: "@a@b*ⓢ Il a abandonné l'idée de partir pour ce château pour faire des affaires. Eh ouiⓠ Maintenant, il est bien trop occupé à jouer au casinoⓠ\n@c0@"
  it: "@a@b*: Ha abbandonato l'idea di recarsi in quel castello per concludere qualche nuovo affare.\n㈡\n*: Dice di essere troppo occupato al casinò, per pensare al lavoro!\n@c0@"
  ja: "@a@b＊「うちの人ったら\n\tお城に行くのを　あきらめさせたら\n\t今度は　カジノ通いでね。\n@c0@"
25:
  de: "@a@b*: Also wirklich...! Männer!\n@c0@"
  en: "@a@b*: I don't know! Men!\n@c0@"
  es: "@a@b*: ¡Hay que ver! ¡Hombres!\n@c0@"
  fr: "@a@b*ⓢ Ah, les hommesⓠ Je ne sais plus quoi faireⓠ\n@c0@"
  it: "@a@b*: Quell'uomo mi farà impazzire!\n@c0@"
  ja: "@a@b＊「男って　なんで\n\tああなんだろうねえ……。\n@c0@"
26:
  de: "@a@b*: Tagsüber ist's im Land der unglaublichen Chancen gar nicht so toll, %A0110%XKumpel%Z%B0110%Xmeine Hübsche%Z. Ich steh' mir hier bloß die Beine in den Bauch.\n@c0@"
  en: "@a@b*: The land of opportunity ain't so hot in daylight hours, %A0110%Xbuddy%Z%B0110%Xlady%Z. I ain't doin' no business at all.\n@c0@"
  es: "@a@b*: La tierra de las oportunidades no está demasiado animada durante el día, %A0110%Xamigo%Z%B0110%Xseñorita%Z. Todo está cerrado.\n@c0@"
  fr: "@a@b*ⓢ La ville de tous les rêves est plutôt calme pendant la journée, %A0110%Xmon gars%Z%B0110%Xma p'tite dame%Z. C'est pas le meilleur moment pour les affaires.\n@c0@"
  it: "@a@b*: Di giorno non si batte chiodo, %H0860%X%A0110%Xcaro mio%Z%B0110%Xcara mia%Z%Y%R0000%Xcare mie%Ycari miei%Z%Z!\nNon si vede un cliente a pagarlo oro!\n@c0@"
  ja: "@a@b＊「まいった　まいった。\n\t昼間は　商売　あがったりだよ。\n@c0@"
27:
  de: "@a@b*: Ich bin ja selbst durch die Lande gereist, damals, nicht wahr.\n@c0@"
  en: "@a@b*: I was a traveller myself, you know, back in the day.\n@c0@"
