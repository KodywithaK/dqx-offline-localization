  es: "@a@b*: Y recuerda esto: lo de llevarte a las chicas por la cara se acaba. ¡Cuando se esfuma la juventud, adiós muy buenas!\n@c0@"
  fr: "@a@b*ⓢ Et souvenez-vous bien de çaⓢ vous ne pourrez pas faire la cour aux jeunes filles pendant des années. On ne reste pas jeune éternellement.\n@c0@"
  it: "@a@b*: Ricorda che non si può correre la cavallina per tutta la vita! Una volta che la gioventù se ne sarà andata che farai, eh?\n@c0@"
  ja: "@a@b＊「かわいい娘に\n\tキャーキャー　言われるのは\n\t今のうちだよ。\n@c0@"
181:
  de: "@a@b*: Hört nicht auf meine Frau. Sie weiß nicht, wovon sie redet. Die Ehe ist eine Lotterie, mein Freund. Eine sehr riskante Lotterie.\n@c0@"
  en: "@a@b*: Don't listen to my wife. She doesn't know what she's talking about. Marriage is a lottery, my friend. A very risky lottery.\n@c0@"
  es: "@a@b*: No hagas caso a mi mujer. No sabe de lo que habla. El matrimonio es una lotería. Y muy peligrosa.\n@c0@"
  fr: "@a@b*ⓢ N'écoutez pas ma femme. Elle dit n'importe quoi.\nLe mariage, c'est une loterie. Et on ne gagne pas à tous les coups.\n@c0@"
  it: "@a@b*: Ah, lascia perdere mia moglie!\nNon sa di cosa parla. Il matrimonio è come una lotteria con pochissime probabilità di vittoria!\n@c0@"
  ja: "@a@b＊「女房は　ああ言っとるが\n\t結婚ばっかりは　神さまの\n\tめぐり合わせだからのう。\n@c0@"
182:
  de: "@a@b*: Jetzt rühr dich mal und setz einen Tee auf, du alter Faulenzer!\n@c0@"
