  fr: "@a@b*ⓢ Le mariage est l'union sacrée de deux âmes en présence de la Déesse.\n@c0@"
  it: "@a@b*: Il matrimonio è l'atto d'amore con cui la dea benedice l'unione tra due persone che si vogliono bene.\n@c0@"
  ja: "@a@b＊「結婚とは　神さまも見守る\n\t神聖な儀式……。\n@c0@"
187:
