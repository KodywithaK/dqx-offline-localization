123:
  de: "@a@b*: Hierher kommen alle möglichen Leute. Und alle schreiben was in das Buch. Was Tratsch angeht, da seid Ihr Reisenden wohl gern auf dem Laufenden?\n@c0@"
  en: "@a@b*: We have all sorts in here, you know. And they all write things in it. You travellers certainly like to keep up on your gossip, don't you?\n@c0@"
  es: "@a@b*: Aquí viene gente de todo tipo, y todos escriben en él. A los viajeros os gusta estar al día de los cotilleos, ¿eh?\n@c0@"
  fr: "@a@b*ⓢ Des gens du monde entier passent par ici et ils laissent tous un mot dans ce livre. Je vous connais vous, les voyageurs. Vous aimez les commérages.\n@c0@"
  it: "@a@b*: Qui vengono persone da ogni parte del mondo, e chiediamo loro di scrivere i pettegolezzi di cui vengono a conoscenza.\n㈡\n*: Da queste parti abbiamo una vera passione per indiscrezioni, voci di corridoio, chiacchiere da parrucchiera e inciuci in genere!\n@c0@"
  ja: "@a@b＊「ウチは　けっこう　旅人の出入りが\n\t多くて　いろんなウワサ話が\n\t書き残されてますからね。\n@c0@"
124:
  de: "@a@b*: Oh, ist das der Fama-Foliant? Ah ja. Der steckt voller Klatsch und Tratsch.\n@c0@"
  en: "@a@b*: Oh, is that the Scuttlebutt Alledger you've got there? Oh, yes. That's full of tittle-tattle, that is.\n@c0@"
  es: "@a@b*: ¿Eh?, ¿que si eso de ahí es ⓕEl Mentidero Verdaderoⓖ? ¡Ah!, sí. Es un cúmulo de marujeos.\n@c0@"
  fr: "@a@b*ⓢ Mais ce ne serait pas les On-dit de Milleragotsⓡ Eh oui. Un livre plein de commérages.\n@c0@"
  it: "@a@b*: Oh, ma quelle sono le ⓕCronache di Inchucheniaⓖ!\nÈ un testo meraviglioso!\nContiene i più succulenti pettegolezzi del mondo!\n@c0@"
  ja: "@a@b＊「ありゃ　お客さん　それは\n\tうちの宿の　うわさのノートじゃ\n\tないですか。\n@c0@"
125:
  de: "@a@b*: Behaltet ihn ruhig, wenn Ihr wollt. Aber das ist alles nur Geschwätz. Nehmt die Geschichten lieber nicht allzu ernst!\n@c0@"
  en: "@a@b*: Keep it if you want to. It's all gossip, mind. Don't take it too seriously!\n@c0@"
  es: "@a@b*: %H0860%XQuédatelo si quieres%YQuedáoslo si queréis%Z. Solo vienen cotilleos. ¡No %H0860%Xte lo tomes%Yos lo toméis%Z muy en serio!\n@c0@"
  fr: "@a@b*ⓢ Je vous le laisse. N'oubliez pas que ce sont des ragots. Ne prenez pas tout au sérieuxⓠ\n@c0@"
  it: "@a@b*: Se %H0860%Xvuoi, puoi%Yvolete, potete%Z tenerlo. È una lettura interessante, a patto di non prenderla troppo sul serio. Del resto, non contiene altro che inciuci...\n@c0@"
  ja: "@a@b＊「ノートはまだあるから\n\t持って行ってもいいけど　何の役にも\n\t立たないと思いますよ。\n@c0@"
126:
  de: "@a@b*: Haltet Euch ab hier immer in südlicher Richtung, dann gelangt Ihr an eine Brücke. Mostroferrato liegt gleich auf der anderen Seite.\n@c0@"
  en: "@a@b*: Keep heading south from here, and you'll hit a bridge. Mostroferrato's just on the other side of it.\n@c0@"
  es: "@a@b*: %H0860%XSigue%YSeguid%Z hacia el sur y %H0860%Xllegarás%Yllegaréis%Z a un puente. Mostroferrato está al otro lado.\n@c0@"
  fr: "@a@b*ⓢ Prenez plein sud et vous arriverez à un pont. Mostroferrato est de l'autre côté.\n@c0@"
  it: "@a@b*: %H0860%XProsegui verso sud, e a un certo punto troverai%YProseguite verso sud, e a un certo punto troverete%Z un ponte.\nBasta attraversarlo e si arriva a Mostroferrato.\n@c0@"
  ja: "@a@b＊「ここから　ずっと南に行って\n\t橋を　わたれば\n\tサラボナの町ですよ。\n@c0@"
127:
  de: "@a@b*: Oh, sagt es mir nicht! Lasst mich raten! Ihr habt von der hübschen kleinen Nera gehört, und nun habt Ihr ein Auge auf sie geworfen!\n@c0@"
  en: "@a@b*: Ooh, don't tell me! Let me guess!\nYou've heard about that pretty little Nera and now you're hoping to get married to her!\n@c0@"
  es: "@a@b*: ¡Oh, no me digas más! ¡A ver si lo adivino!\r\n¡Has oído hablar de la hermosa Nera y quieres casarte con ella!\n@c0@"
  fr: "@a@b*ⓢ Attendezⓠ Ne me dites rienⓠ Laissez-moi devinerⓠ\nVous avez entendu parler de la jolie Nera et vous espérez l'épouserⓠ\n@c0@"
  it: "@a@b*: Mio cugggino mi ha riferito un pettegolezzo interessante...\n㈡\n*: In città è giunto un forestiero che ha saputo della bella Nera e vorrebbe sposarla!\nChi sarà mai questo straniero, eh? Eh eh eh!\n@c0@"
  ja: "@a@b＊「あんた　まさか　ウワサを聞いて\n\tフローラさんと　結婚したいなんて\n\t思ったんじゃないだろうねえ。\n@c0@"
128:
  de: "@a@b*: Ach, ich kann's gar nicht erwarten, das allen weiterzuerzählen! Aber macht Euch keine allzu große Hoffnung. Ihr müsstet schon viel Glück haben!\n@c0@"
  en: "@a@b*: Ooh, wait till I tell everyone!\nBut I wouldn't get your hopes up too much. She'd be quite a catch for you!\n@c0@"
  es: "@a@b*: ¡Ay, espera a que lo cuente!\r\nPero yo no me haría ilusiones. ¡Parece demasiado buen partido para ti!\n@c0@"
  fr: "@a@b*ⓢ Faut absolument que je le dise aux autresⓠ\nMais sachez que ce n'est pas gagné d'avance.\nC'est vraiment un beau parti, cette petiteⓠ\n@c0@"
  it: "@a@b*: Devo riferirlo subito a tutti! E devo dire anche a ⓕquelloⓖ straniero di non farsi troppe illusioni... Nera è una preda difficile da catturare!\n@c0@"
  ja: "@a@b＊「でも　あれほどの娘さんだ。\n\t相手にも　されないと思うよ。\n@c0@"
129:
  de: "@a@b*: Ihr werdet nie erraten, was ich gehört habe! Prinz Harry von Tifortu hat geheiratet!\n@c0@"
  en: "@a@b*: Ooh, you'll never guess what I heard!\nPrince Harry of Coburg's got married!\n@c0@"
  es: "@a@b*: ¡Ah!, ¡ni te imaginas lo que he oído!\r\n¡El príncipe Froilán de Trastámara se ha casado!\n@c0@"
  fr: "@a@b*ⓢ Vous ne devinerez jamais ce qu'on m'a ditⓠ\nLe prince Harry de Cobourg s'est mariéⓠ\n@c0@"
  it: "@a@b*: Che notiziona!\nPare che Robert, il Principe di Coburg, si sia sposato! Proprio lui, che era uno scapolo impenitente!\n@c0@"
  ja: "@a@b＊「ラインハットのヘンリーさまが\n\tご結婚なさったらしいわね。\n@c0@"
130:
  de: "@a@b*: Was? Ihr seid ein Freund von ihm? Oh, erzählt schon, wie war es? Wie bitte?! Ihr wisst es nicht?! Dann geht hin und fragt ihn!\n@c0@"
  en: "@a@b*: What's that? You're a friend of his?\nOoh, tell all, tell all!\nWhat!? You didn't know!? Then go and ask him!\n@c0@"
  es: "@a@b*: ¿Cómo? ¿Que eres %A0110%Xamigo suyo%Z%B0110%Xamiga suya%Z?\n¡Qué fuerte, qué fuerte!\n¿Qué? ¿Que no lo sabías? ¡Pues ve y pregúntale!\n@c0@"
  fr: "@a@b*ⓢ Commentⓡ Vous êtes un%A0110%X%Z%B0110%Xe%Z de ses ami%A0110%X%Z%B0110%Xe%Zsⓠ\nAlors, comment était le mariageⓡ Quoiⓠⓑ\nVous ne savez pasⓠⓑ Allez lui demander, alorsⓠ\n@c0@"
  it: "@a@b*: Che cosa? Sei %A0110%Xun suo amico%Z%B0110%Xuna sua amica%Z?!\nForza, parla! Voglio conoscere tutti dettagli!\n㈡\n*: Come sarebbe a dire che non ne sai niente?!\nAllora corri da lui, fatti raccontare tutto e poi riferiscimi com'è andata di preciso!\n@c0@"
  ja: "@a@b＊「え？　あんた　ヘンリーさまと\n\tお知り合いなの？\n\tだったら　行ってあげなよ！\n@c0@"
131:
  de: "@a@b*: Ich habe von einem Kerl in Wunnermühl gehört, der den Teleportationszauber kennt. Das wäre der schnellste Weg, nach Tifortu zu kommen.\n㈡\n*: Also beeilt Euch! Hach, ich kann's gar nicht erwarten, all die saftigen Einzelheiten zu erfahren!\n@c0@"
  en: "@a@b*: I heard of a fellow in Zoomingale who knows the Zoom spell. That'd be the quickest way to get to Coburg.\n㈡\n*: So hurry up! Ooh, I'm dying to know all the juicy details!\n@c0@"
  es: "@a@b*: He oído que en Telele hay un tipo que conoce el conjuro Telerregreso. Sería el modo más rápido de ir a Trastámara.\n㈡\n*: ¡Así que corre! ¡Me muero por saber todos los detalles!\n@c0@"
  fr: "@a@b*ⓢ On m'a dit qu'un monsieur de Moulinsort connaissait le sort Téléportation. Ce serait le moyen le plus rapide d'aller à Cobourg.\n㈡\n*ⓢ Dépêchez-vousⓠ J'ai tellement envie d'entendre les détails les plus croustillantsⓠ\n@c0@"
  it: "@a@b*: La cugggina di un amico del suocero di mio nipote mi ha detto che a Milleventi c'è un tipo che conosce l'incantesimo ⓕTeletrasportoⓖ.\n㈡\n*: Con quello, ci metteresti un attimo ad andare a Coburg e a tornare qui!\nAvanti, che aspetti?!\n㈡\n*: Oh, sto morendo dalla curiosità!\nDevo assolutamente sapere da chi è stato accalappiato quel fusto del Principe!\n@c0@"
  ja: "@a@b＊「ルラフェンで　ルーラっていう\n\t呪文を習えば　ラインハットに\n\tもどれるはずだよ！\n@c0@"
132:
  de: "@a@b*: Ich verrat' Euch ein kleines Geheimnis. Ich hab vor kurzem in einer Höhle westlich von Bauernsiepen mit einem furchtbaren Monster gekämpft.\n@c0@"
  en: "@a@b*: I'll let you in on a little secret. I did battle with a fearful monster in a cave just west of Hay not long ago.\n@c0@"
  es: "@a@b*: %H0860%XTe%YOs%Z contaré un pequeño secreto. Hace poco, en una cueva al oeste de Puebla del Heno, luché con un monstruo temible.\n@c0@"
  fr: "@a@b*ⓢ J'ai un petit secret à vous dire. J'ai combattu un monstre effroyable dans une grotte à l'ouest de Chaumes il n'y a pas longtemps.\n@c0@"
  it: "@a@b*: Voglio %H0860%Xraccontarti%Yraccontarvi%Z una cosa!\nQualche tempo fa, ho affrontato un mostro tremendo in una grotta a ovest di Punta Campestre!\n@c0@"
  ja: "@a@b＊「じつは　カボチ村の西の\n\t洞くつで　とてつもなく\n\t強い魔物と　戦ったのだ。\n@c0@"
133:
  de: "@a@b*: Ihr werdet nie erraten, was das für ein Monster war... Eine Säbelzahnkatze, ausgerechnet!\n@c0@"
  en: "@a@b*: You'll never guess what it was...\nA great sabrecat of all things!\n@c0@"
  es: "@a@b*: Ni %H0860%Xte imaginas%Yos imagináis%Z lo que era...\n¡Un dientes de sable, nada menos!\n@c0@"
  fr: "@a@b*ⓢ Vous ne devinerez jamais ce que c'était...\nun smilodonⓠ\n@c0@"
  it: "@a@b*: Non %H0860%Xindovineresti%Yindovinereste%Z mai di che bestia si trattava...\nEra un Koguar!\nRoba da farsela addosso dalla paura, eh?\n@c0@"
  ja: "@a@b＊「あれは　まさしく\n\tキラーパンサー！\n@c0@"
134:
  de: "@a@b*: Ich sage furchtbar, aber man konnte merken, dass die Säbelzahnkatze früher mal an Menschen gewöhnt war. Vielleicht war sie sogar mal richtig zahm.\n@c0@"
  en: "@a@b*: I say it was fearful, but I could tell it'd had some contact with humans. It might even have been someone's pet once.\n@c0@"
  es: "@a@b*: Ya digo, era temible, pero creo que había tenido contacto con humanos. Hasta podría haber sido la mascota de alguien.\n@c0@"
  fr: "@a@b*ⓢ Il était très impressionnant, mais j'ai senti qu'il avait déjà été en contact avec l'homme. Peut-être même qu'il avait été le compagnon de quelqu'un...\n@c0@"
  it: "@a@b*: In realtà, il mostro non era molto tremendo.\nAnzi, sembrava che fosse già stato domato. Quando mi ci sono imbattuto, però, era tutt'altro che docile!\n@c0@"
  ja: "@a@b＊「しかも　人に\n\t飼われていたことが　あると\n\tオレは　みたぞ！\n@c0@"
135:
  de: "@a@b*: Wenn ich so drüber nachdenke, wäre das wohl die richtige Methode, sie zu zähmen. Indem man etwas benutzt, was sie an ihren alten Eigentümer erinnert...\n@c0@"
  en: "@a@b*: Come to think of it, that'd be the way to tame it again, I suppose. By using something it remembered from its old owner...\n@c0@"
  es: "@a@b*: Quizá fuese posible domarlo si reconociese algo de cuando era cachorro.\n@c0@"
  fr: "@a@b*ⓢ Maintenant que j'y repense, je suis sûr que c'est comme ça qu'on pourrait l'apprivoiser, en utilisant un objet qui a appartenu à son ancien propriétaire.\n@c0@"
  it: "@a@b*: Sono convinto che è possibile addomesticarlo di nuovo, magari mostrandogli un oggetto che apparteneva al suo padrone...\n@c0@"
  ja: "@a@b＊「なにか　その頃の思い出の品でも\n\tつかえば　手なずけられるかも\n\tしれないのだが……。\n@c0@"
136:
  de: "@a@b*: Obwohl, was diese Griselda angeht, weiß ich ja nicht so recht. Die ist dann wieder das andere Extrem. Man kann's auch übertreiben, oder?\n@c0@"
  en: "@a@b*: I ain't sure about that Debora, mind.\r\nIt dun't do to go too far the other way, eh?\n@c0@"
  es: "@a@b*: Aunque lo de Stefania igual ya es exagerado. Tampoco hace falta ser así, ¿no?\n@c0@"
  fr: "@a@b*ⓢ Mais je reste quand même perplexe devant cette Pandora. Ça n'est pas mieux de tomber dans l'excès inverse, vous ne croyez pasⓡ\n@c0@"
  it: "@a@b*: Questa è una cosa che una certa ragazza di nome Viola ha capito bene.\nAnzi: fin troppo bene!\n@c0@"
  ja: "@a@b＊「……けど　デボラさんみたいなのは\n\tさすがに　どうかと思うけど。\n@c0@"
137:
  de: "@a@b*: Obwohl, was diese Griselda angeht, weiß ich ja nicht so recht. Die ist dann wieder das andere Extrem. Man kann's auch übertreiben, oder?\n@c0@"
  en: "@a@b*: I ain't sure about that Debora, mind.\r\nIt dun't do to go too far the other way, eh?\n@c0@"
