  de: "@aMystische Mridula@bJaaah... Jaaah... Kah ha ha hah! Ihr sucht etwas, nicht wahr? Ich sehe eine Frau, die Euch sehr nahe steht.\n@c0@"
  en: "@aMystic Mridula@bYesss... Yesss... Kah ha ha hah!\nYou are looking for something, no?\nI am seeing a woman who is very close to you.\n@c0@"
