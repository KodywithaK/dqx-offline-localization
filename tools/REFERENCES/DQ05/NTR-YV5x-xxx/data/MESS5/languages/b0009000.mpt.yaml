  es: "@a@b*: ¿Ma quién...?\n@c0@"
  fr: "@a@b*ⓢ Qui es...\n@c0@"
  it: "@a@b*: Ma chi...\n@c0@"
  ja: "@a@b＊「あなたは　いったい……。\n@c0@"
148:
  de: "@a@b*: ...\n@c0@"
