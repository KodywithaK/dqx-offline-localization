  ja: "@a@b＊「心から愛する　相手となら\n\tきっと　神さまの祝福を\n\t得られることでしょう。\n@c0@"
188:
  de: "@a@b*: Das ist die Villa von Herrn Onassetti. Aber er kommt nicht mehr oft hierher. Sie ist einfach ein bisschen zu abgelegen.\n@c0@"
  en: "@a@b*: This is Mr Briscoletti's villa. He doesn't get\r\nout here much, though. It's just that little bit\r\ntoo far away.\n@c0@"
