0:
  de: "@a@b*: Da kam ein Prinz auf einem weißen Pferd angeritten, und... er hat Maria gefragt, und... und dann hat Maria Ja gesagt und...\n@c0@"
  en: "@a@b*: A prince on a white horse came and...he came and asked Maria and...then Maria said yes and...\n@c0@"
  es: "@a@b*: Y llegó un príncipe en un caballo blanco y... y propuso matrimonio a María... y María dijo sí y...\n@c0@"
  fr: "@a@b*ⓢ Un prince est arrivé sur un cheval blanc et... il a fait sa demande à Maria et... Maria a dit oui et...\n@c0@"
  it: "@a@b*: È arrivato un principe in groppa a un magnifico cavallo bianco. Il principe ha chiesto a Maria di sposarlo... E Maria ha accettato!\n@c0@"
  ja: "@a@b＊「マリア姉ちゃんを\n\t白馬に　またがった王子さまが\n\tむかえに来たんだよ！\n@c0@"
1:
  de: "@a@b*: Und sie haben geheiratet!\n@c0@"
  en: "@a@b*: They got married!\n@c0@"
  es: "@a@b*: ¡Y se casaron!\n@c0@"
  fr: "@a@b*ⓢ ... ils se sont mariésⓠ\n@c0@"
  it: "@a@b*: E adesso i due innamorati si sono sposati e vivono felici e contenti!\n@c0@"
  ja: "@a@b＊「それで　お嫁に　いっちゃったの。\n\tいいなあ。\n@c0@"
2:
  de: "@aNonne von Obendroben@bMaria war kaum bei uns im Stift zurück, da kreuzte Prinz Harry hier auf.\n@c0@"
  en: "@aNun of the Above@bIt seemed as if Maria had hardly been back with us at the abbey a few days before Prince Harry returned.\n@c0@"
  es: "@aHermana subcelestial@bMaría apenas si había regresado con nosotras a la abadía cuando llegó el príncipe Froilán.\n@c0@"
  fr: "@aSœur du Firmament@bCela faisait à peine quelques jours que Maria était revenue parmi nous que le prince Harry est réapparu.\n@c0@"
  it: "@aSuora di Su'ncyel@bMaria era tornata all'abbazia da pochi giorni, quando il principe Robert si presentò qui per chiederla in moglie.\n@c0@"
  ja: "@a@b＊「マリアが　修道院にもどって来て\n\tいく日も　たたないうちに\n\tヘンリーさまが　いらっしゃって……。\n@c0@"
3:
  de: "@aNonne von Obendroben@bWenn die Göttin wusste, dass er kommen würde, hat sie das in ihrer unergründlichen Weisheit gut vor uns verborgen. Das war ein schöner Schreck!\n@c0@"
  en: "@aNun of the Above@bIf the Goddess knew he was coming, She, in Her infinite wisdom of course, didn't tell any of us about it! It was quite a shock!\n@c0@"
  es: "@aHermana subcelestial@bSi la Diosa sabía que el Príncipe venía, en su infinita sabiduría decidió no decir ni mu. ¡Menuda sorpresa!\n@c0@"
  fr: "@aSœur du Firmament@bSi la Déesse savait qu'il allait venir, dans son infinie sagesse, elle ne nous a rien ditⓠ\nCe fut un sacré chocⓠ\n@c0@"
  it: "@aSuora di Su'ncyel@bOvviamente, la dea onnisciente sapeva già dell'amore che i due giovani provavano l'uno per l'altra.\nPer noi, invece, è stata una sorpresa!\n@c0@"
  ja: "@a@b＊「ヘンリーさまが　ラインハットの\n\t王子さまだと知って　私たちも\n\tとても　おどろきましたのよ。\n@c0@"
4:
  de: "@aNonne von Obendroben@bTja, damit wäre Prinz Harry unter der Haube...\n@c0@"
  en: "@aNun of the Above@bWell that's Prince Harry married...\n@c0@"
  es: "@aHermana subcelestial@bYa está casado el príncipe Froilán.\n@c0@"
  fr: "@aSœur du Firmament@bEt voilà, le prince Harry est marié...\n@c0@"
  it: "@aSuora di Su'ncyel@bLa notizia del matrimonio del principe Robert ha riempito di gioia i cuori di tutte noi...\n@c0@"
  ja: "@a@b＊「ヘンリーさまも\n\tご結婚なさったし……。\n@c0@"
5:
  de: "@aNonne von Obendroben@bSicher würde es die Göttin glücklich machen, wenn Ihr seinem Beispiel folgen würdet, %a000090.\n@c0@"
  en: "@aNun of the Above@bI'm sure it would make the Goddess happy if you were to follow suit, %a000090.\n@c0@"
  es: "@aHermana subcelestial@bSeguro, %a000090, que a la Diosa le haría feliz que siguieras su ejemplo.\n@c0@"
  fr: "@aSœur du Firmament@bJe suis sûre que la Déesse serait heureuse si vous en faisiez autant, %a000090.\n@c0@"
  it: "@aSuora di Su'ncyel@bSono certa che alla dea farebbe molto piacere se anche tu prendessi moglie, %a000090.\n@c0@"
  ja: "@a@b＊「つぎは　%a000090さまの\n\t番ですわね。\n@c0@"
6:
  de: "@aNonne von Obendroben@bWelche Freude Prinz Harry aller Welt bereitet hat, als er um Marias Hand anhielt!\n@c0@"
  en: "@aNun of the Above@bWhat joy Prince Harry has brought to the world, asking Maria for her hand in marriage!\n@c0@"
  es: "@aHermana subcelestial@b¡Cuánta alegría ha traído el príncipe Froilán al pedir en matrimonio a María!\n@c0@"
  fr: "@aSœur du Firmament@bEn demandant la main de Maria, le prince Harry a fait un cadeau au monde entierⓠ\n@c0@"
  it: "@aSuora di Su'ncyel@bIl principe Robert ha compiuto un gesto nobilissimo, chiedendo a Maria di sposarlo!\n@c0@"
  ja: "@a@b＊「ヘンリーさまとマリアが　結婚だなんて\n\t本当に　おめでたいこと。\n@c0@"
7:
  de: "@aNonne von Obendroben@bHoffentlich findet die kleine Onassetti von Mostroferrato auch bald jemanden. Wo ist nur die Schwester abgeblieben, die sie heimbringen sollte?\n@c0@"
  en: "@aNun of the Above@bLet us hope the young Briscoletti girl from Mostroferrato finds someone soon too. Where has the sister who was taking her home got to?\n@c0@"
  es: "@aHermana subcelestial@bEsperemos que la joven Rimaldi de Mostroferrato también encuentre a alguien pronto. ¿Dónde estará la hermana que la fue a acompañar a su casa?\n@c0@"
  fr: "@aSœur du Firmament@bEspérons que la jeune Oscuroni de Mostroferrato trouvera rapidement quelqu'un, elle aussi.\n㈡\nJe me demande ce qu'est devenue la sœur qui l'a raccompagnée chez elleⓡ\n@c0@"
  it: "@aSuora di Su'ncyel@bSperiamo che anche la figlia di mister Fosconi di Mostroferrato trovi presto marito!\n㈡\nA proposito, la nostra sorella che doveva riaccompagnarla a casa non è ancora rientrata all'abbazia...\n@c0@"
  ja: "@a@b＊「そういえば　サラボナのおじょうさまを\n\tお送りした　シスターが　そろそろ\n\t帰って来てもいい頃だけど……。\n@c0@"
8:
  de: "@aNonne von Obendroben@bEs soll ja gerade solche Schwierigkeiten beim Schiffsverkehr geben ⓚⓛ es fahren kaum noch Schiffe. Ich hoffe, sie sitzt nicht irgendwo fest.\n@c0@"
  en: "@aNun of the Above@bPerhaps it's this trouble with the ships I've been hearing about. Hardly any are sailing now, apparently. I hope she isn't stranded.\n@c0@"
  es: "@aHermana subcelestial@bQuizá haya problemas con los barcos, como se dice. Al parecer, casi ninguna nave se hace a la mar. Espero que no esté por ahí, a la deriva.\n@c0@"
  fr: "@aSœur du Firmament@bC'est peut-être à cause des bateaux. Il semblerait qu'ils ne circulent presque plus. J'espère qu'elle n'est pas bloquée.\n@c0@"
  it: "@aSuora di Su'ncyel@bForse è in ritardo a causa dei problemi che le navi stanno incontrando ultimamente. Può darsi che sia rimasta bloccata da qualche parte.\n@c0@"
  ja: "@a@b＊「さいきんは　連絡船も\n\tあまり　出ていないっていうし\n\t大丈夫かしら？\n@c0@"
