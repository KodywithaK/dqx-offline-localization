  it: "@aCandido@bNon è certo per i suoi soldi che sono qui oggi, niente affatto!\n㈡\nHo sempre pensato che Nera è una splendida persona, e la sposerei per ciò che è, non per quello che ha!\n@c0@"
  ja: "@a@bアンディ「ボクは　お金も　宝も\n\tほしくありませんが。　彼女が\n\t妻になってくれるなら……。\n@c0@"
201:
  de: "@a@b*: Ich danke Euch allen für Eure Geduld. Herr Onassetti wird Euch jetzt empfangen. Bitte geht hinein.\n@c0@"
  en: "@a@b*: Thank you all for your patience. Mr Briscoletti is ready to see you now. Please go in.\n@c0@"
