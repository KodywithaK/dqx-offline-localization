  ja: "@a@b＊「やあ　あなたも　フローラと\n\t結婚したくて？\n@c0@"
199:
  de: "@a@b*: Ich bin Lothar. Lothar Lichterlo. Freut mich. Nera und ich sind schon befreundet, seit wir Kinder waren.\n@c0@"
