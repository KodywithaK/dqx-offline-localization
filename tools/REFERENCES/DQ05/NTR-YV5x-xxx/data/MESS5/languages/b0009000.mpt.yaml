  es: "@a@b*: ¿También has comprado una de esas cosas?\n@c0@"
  fr: "@a@b*ⓢ Vous en avez acheté un aussiⓡ\n@c0@"
  it: "@a@b*: Anche %H0860%Xtu ne hai%Yvoi ne avete%Z comprata una?\n@c0@"
  ja: "@a@b＊「あんたも　買いましたか？\n@c0@"
76:
  de: "@a@b*: Dachte ich mir. Ihr seht mir ganz danach aus.\n@c0@"
  en: "@a@b*: I thought so. You look like the type.\n@c0@"
  es: "@a@b*: ¡Lo sabía! Pareces ese tipo de persona.\n@c0@"
  fr: "@a@b*ⓢ J'en étais sûr. Vous avez une tête à acheter ça.\n@c0@"
  it: "@a@b*: Proprio come pensavo.\nImmaginavo che %H0860%X%A0110%Xa un tipo come te%Z%B0110%Xa una tipa come te%Z%Y%R0000%Xa tipe come voi%Ya tipi come voi%Z%Z un oggettino del genere sarebbe piaciuto.\n@c0@"
  ja: "@a@b＊「そうですか　やはりなあ……。\n@c0@"
77:
  de: "@a@b*: Unten am Hafen verkaufen sie Buddelschiffe.\n@c0@"
  en: "@a@b*: They're selling ships in bottles down in the dockyard.\n@c0@"
  es: "@a@b*: En el muelle venden barcos metidos en botellas.\n@c0@"
  fr: "@a@b*ⓢ Ils vendent des bateaux en bouteille sur le quai là-bas.\n@c0@"
  it: "@a@b*: Giù al porto vendono delle splendide navi in bottiglia.\n@c0@"
  ja: "@a@b＊「港のドックで　ボトルシップを\n\t売り出したんですよ。\n@c0@"
78:
  de: "@a@b*: Sie sind ziemlich gut gemacht. Ihr wollt Euch so ein Souvenir aus Bakenmünde doch nicht entgehen lassen, oder?\n@c0@"
  en: "@a@b*: They're pretty well-made. You wouldn't want to miss out on a souvenir of Lodestar Harbour now, would you?\n@c0@"
  es: "@a@b*: Están muy bien hechos. No querrás quedarte sin un souvenir de Puerto Polaris, ¿no?\n@c0@"
  fr: "@a@b*ⓢ Ils sont plutôt bien faits, et puis ce serait dommage de ne pas rapporter un souvenir de\nPort-Lanterne.\n@c0@"
  it: "@a@b*: Sono i souvenir di Grandport, rinomati in tutto il mondo. Non %H0860%Xvorrai mica%Yvorrete mica%Z andar via senza questo grazioso ricordino, eh?\n@c0@"
  ja: "@a@b＊「これが　けっこう　よく出来てて\n\tポートセルミの　お土産には\n\tかかせない品でしょうな。\n@c0@"
79:
  de: "@a@b*: Wer will noch mal, wer hat noch nicht? Tretet näher, und eins der berühmten Bakenmündener Buddelschiffe könnte schon bald Euch gehören!\n@c0@"
  en: "@a@b*: Step right up! Get your souvenirs here! One of these famous Lodestar ships in a bottle could be yours!\n@c0@"
  es: "@a@b*: ¡%H0860%XMira, mira%YMiren, miren%Z, lo traigo fino! ¡Tenemos souvenires, %H0860%Xoiga%Yoigan%Z! ¡%H0860%XLlévese%YLlévense%Z uno de los famosos barcos en botella de Polaris!\n@c0@"
  fr: "@a@b*ⓢ Montez doncⓠ Venez acheter vos souvenirs ici. Repartez avec l'un de ces magnifiques bateaux en bouteille de Port-Lanterneⓠ\n@c0@"
  it: "@a@b*: Avanti, siore e siori! Comprate qui il vostro souvenir! Le originali navi in bottiglia di Grandport le trovate solo da me!\n@c0@"
  ja: "@a@b＊「いらっしゃいませ！\n\tポートセルミ名物　ボトルシップの\n\t売り場は　こちらですよ。\n@c0@"
80:
  de: "@a@b*: Seht Euch die wunderbare Konstruktion an! Die herrliche Lackarbeit! Das Ganze für nur eintausend Goldmünzen! Wie wär's?\n@c0@"
  en: "@a@b*: Look at the superb construction! See the fine finish! And all for just one thousand gold coins! What d'you say?\n@c0@"
  es: "@a@b*: ¡Ojo! %H0860%XMire%YMiren%Z qué bien construido, ¡qué acabado! ¡Y todo al increíble precio de mil monedas de oro! ¿Qué me %H0860%Xdice%Ydicen%Z?\n@c0@"
  fr: "@a@b*ⓢ Regardez comme ils sont bien faitsⓠ Admirez ces détailsⓠ Tout ça pour 1000 pièces d'or.\nJe vous en mets unⓡ\n@c0@"
  it: "@a@b*: Guardate che linea! Che stile! Che finiture!\nE tutto per sole miiille mooonetine d'oro!\n%A0110%XNobile siore,%Z%B0110%XBella siora,%Z vuoi comprarne una?\n@c0@"
  ja: "@a@b＊「これだけ　ていねいに　細工されてて\n\t値段は　たったの　１０００ゴールド！\n\tお買い上げに　なりますね？\n@c0@"
81:
  de: "@a@b*: Recht so! Es wäre verrückt, sich diese unglaubliche Gelegenheit entgehen zu lassen! Ich steck's Euch gleich in den Beutel!\n@c0@"
  en: "@a@b*: That's right! You'd be crazy to pass up this unbelievable offer. I'll just pop it in your bag for you.\n@c0@"
  es: "@a@b*: ¡Así es! Sería una locura dejar pasar este ofertón. Se lo pondré en la bolsa.\n@c0@"
  fr: "@a@b*ⓢ Vous avez bien raisonⓠ Ce serait vraiment idiot de passer à côté d'une affaire comme ça.\nTenezⓠ Je le mets dans votre sac.\n@c0@"
  it: "@a@b*: Ottima scelta, %A0110%Xcaro siore%Z%B0110%Xcara siora%Z. Solo una persona del tutto priva di buon gusto si sarebbe fatta sfuggire un'offerta simile! Ti metto la nave nella borsa.\n@c0@"
  ja: "@a@b＊「まいどあり！　それでは\n\tその　%a001400に\n\t入れておきますね！\n@c0@"
82:
  de: "@a@b*: Oh je! Ihr habt nicht genug Geld. Für einen so hochwertigen Artikel kann ich keinen Rabatt geben, das seht Ihr doch ein?\n@c0@"
  en: "@a@b*: Oh dear! You haven't got enough cash.\nI can't discount something of this quality, you understand, %A0110%Xsir%Z%B0110%Xmadam%Z.\n@c0@"
  es: "@a@b*: ¡Oh, vaya! No %H0860%Xtiene%Ytienen%Z suficiente dinero.\n%H0860%XEntienda%YEntiendan%Z que en algo de esta calidad no puedo hacer descuentos, %H0860%X%A0110%Xcaballero%Z%B0110%Xseñorita%Z%Y%R0000%Xseñoritas%Ycaballeros%Z%Z.\n@c0@"
  fr: "@a@b*ⓢ Aïeⓠ Vous n'avez pas assez d'argent.\nJe ne peux malheureusement pas baisser le prix d'un article de cette qualité, %A0110%Xmon bon monsieur%Z%B0110%Xma bonne dame%Z.\n@c0@"
  it: "@a@b*: Mi spiace, %A0110%Xegregio siore%Z%B0110%Xegregia siora%Z, ma non posso fare sconti su un gioiello del genere.\n@c0@"
  ja: "@a@b＊「おっと　残念！\n\tお金が足りないようです。\n\tまた　来てくださいねっ。\n@c0@"
83:
  de: "@a@b*: Pech! Aber dann vielleicht beim nächsten Mal?\n@c0@"
  en: "@a@b*: Shame. But maybe next time, eh?\n@c0@"
  es: "@a@b*: Qué lástima. Quizá en otra ocasión.\n@c0@"
  fr: "@a@b*ⓢ Dommage. La prochaine fois, peut-êtreⓡ\n@c0@"
  it: "@a@b*: Te ne conserverò una per quando avrai più quattrini, d'aaaccordo?\n@c0@"
  ja: "@a@b＊「それは　残念！\n\tまた　来てくださいねっ。\n@c0@"
84:
  de: "@a@b*: Ihr reist durch die Welt, nicht? Bis vor kurzem war ich selbst noch auf Reisen. Ich wollte zum Paradies des Weißen Königs, von dem alle reden.\n@c0@"
  en: "@a@b*: %H0860%XA traveller%YTravellers%Z, are you? I was on the move myself until recently. Heading for that White King's Paradise everyone's talking about.\n@c0@"
  es: "@a@b*: %H0860%X%A0110%XUn viajero%Z%B0110%XUna viajera%Z%Y%R0000%XViajeras%YViajeros%Z%Z, ¿no? Como yo, hasta hace poco. Iba al Paraíso del Rey Blanco del que todos hablan.\n@c0@"
  fr: "@a@b*ⓢ Vous êtes %H0860%X%A0110%Xun voyageur%Z%B0110%Xune voyageuse%Z%Y%R0000%Xdes voyageuses%Ydes voyageurs%Z%Zⓡ Moi aussi, je voyageais il y a encore peu de temps. Je voulais rejoindre le fameux Paradis du Roi blanc.\n@c0@"
  it: "@a@b*: Anch'io, come tante altre persone, ero in viaggio per raggiungere il Paradiso del Re Bianco di cui si parla tanto in giro...\n@c0@"
  ja: "@a@b＊「おや　旅の方ですな。\n\t私も　しばらく前までは　ウワサの\n\t光の国へ　行こうと思ってましたが……\n@c0@"
85:
  de: "@a@b*: Aber diese Buddelschiffe, die ich aus Jux und Dollerei gebastelt habe, verkaufen sich wie geschnitten Brot, und da hab ich umdisponiert.\n@c0@"
  en: "@a@b*: But these ships in bottles I was making for fun were selling like hot cakes, so I thought to myself, ⓗHow much better can it get!?ⓘ\n@c0@"
  es: "@a@b*: Pero estos barcos en botella que hacía por diversión se venden como rosquillas, y me dije: ⓕ¿qué más se puede pedir?ⓖ.\n@c0@"
  fr: "@a@b*ⓢ Mais ces bateaux en bouteille que je fabriquais pour le plaisir se vendaient comme des petits pains. \n㈡\n*ⓢ Alors je me suis ditⓢ ⓥEst-ce que ça pourrait vraiment aller mieux que çaⓡⓦ\n@c0@"
  it: "@a@b*: Poi ho visto che tutti volevano le navi in bottiglia che costruivo per divertimento e ho cambiato idea.\n@c0@"
  ja: "@a@b＊「しゅみで作った　お土産品の\n\tボトルシップが　売れに売れて！\n@c0@"
86:
  de: "@a@b*: Tja, es kommt immer anders, als man denkt, nicht?\n@c0@"
  en: "@a@b*: Ah, you never know in this life, do you, eh?\n@c0@"
  es: "@a@b*: ¡Ah!, en esta vida nunca se sabe, ¿eh?\n@c0@"
  fr: "@a@b*ⓢ Ah, on ne sait jamais ce que la vie nous réserve.\n@c0@"
  it: "@a@b*: La vita riserva sempre un mucchio di sorprese, %H0860%X%A0110%Xcaro mio%Z%B0110%Xcara mia%Z%Y%R0000%Xcare mie%Ycari miei%Z%Z!\n@c0@"
  ja: "@a@b＊「いや～　人生は\n\t分からないものですな。\n@c0@"
87:
  de: "@a@b*: Was sagt Ihr dazu! Nera, Rodrigo Onassettis Tochter, ist nach sechs Jahren im Stift Obendroben endlich nach Mostroferrato zurückgekehrt!\n@c0@"
  en: "@a@b*: Get this! After six whole years at Heaven's Above Abbey, Rodrigo Briscoletti's daughter, Nera, has finally returned to Mostroferrato!\n@c0@"
  es: "@a@b*: ¡Ojo al dato! ¡Después de pasar seis años en la Abadía Subcelestis, Nera, la hija de Santino Rimaldi, ha vuelto por fin a Mostroferrato!\n@c0@"
  fr: "@a@b*ⓢ Incroyableⓠ Après 6 ans à l'abbaye du Firmament, Nera, la fille de Rodrigo Oscuroni, est enfin retournée à Mostroferratoⓠ\n@c0@"
  it: "@a@b*: Mio cugggino mi ha detto che Nera, la figlia di Rick Fosconi, è tornata a Mostroferrato dopo aver trascorso sei anni all'Abbazia di Su'ncyel.\n@c0@"
  ja: "@a@b＊「サラボナの町の　フローラさんが\n\t６年ぶりに　修道院から\n\t帰ってきたそうじゃ。\n@c0@"
88:
  de: "@a@b*: Wie traurig, nach so langer Zeit Abschied nehmen zu müssen. Wir haben uns lange Jahre um Nera gekümmert, wisst Ihr.\n@c0@"
  en: "@a@b*: It's rather sad parting after such a long time. We looked after Nera for many years, you know.\n@c0@"
  es: "@a@b*: Es muy triste despedirse después de tanto tiempo. Cuidamos de Nera muchos años.\n@c0@"
  fr: "@a@b*ⓢ C'est triste de devoir se quitter après si longtemps. Nous nous sommes occupées de Nera pendant des années, vous savez.\n@c0@"
  it: "@a@b*: È triste dirsi addio dopo aver trascorso tanto tempo insieme a una persona cara...\nNera è stata con noi a lungo.\n@c0@"
  ja: "@a@b＊「修道院で　おあずかりしていた\n\tお嬢さんを　家まで\n\tお送りして来たところです。\n@c0@"
89:
  de: "@a@b*: Ich wollte schon lange zum Stift zurückkehren, aber ihre Familie war so gastfreundlich.\n@c0@"
  en: "@a@b*: I would have returned to the abbey sooner, but her family have been so hospitable.\n@c0@"
  es: "@a@b*: Yo habría vuelto antes a la abadía, pero su familia es de lo más hospitalaria.\n@c0@"
  fr: "@a@b*ⓢ J'avais prévu de repartir plus tôt pour l'abbaye, mais sa famille a été si accueillante.\n@c0@"
  it: "@a@b*: Sarei dovuta tornare all'abbazia da un pezzo, ma non ho saputo dire di no alla squisita ospitalità della famiglia Fosconi.\n@c0@"
  ja: "@a@b＊「もっと早く　失礼するつもり\n\tだったけれど　あまりの　おもてなしに\n\tなかなか　帰れませんでしたわ。\n@c0@"
90:
  de: "@a@b*: Um ganz ehrlich zu sein, wir hätten sie gern bei uns behalten.\n@c0@"
  en: "@a@b*: To be perfectly honest, we would have been glad to have her stay on with us.\n@c0@"
  es: "@a@b*: Para ser del todo sincera, nos hubiera gustado que se quedara con nosotras.\n@c0@"
  fr: "@a@b*ⓢ Pour être sincère, nous aurions été heureuses si elle était restée avec nous à l'abbaye.\n@c0@"
  it: "@a@b*: A essere sincera, avrei preferito che Nera restasse con noi...\n@c0@"
  ja: "@a@b＊「正直なところ　彼女のような人には\n\tシスターとして　修道院に\n\t残ってほしかったのだけど……。\n@c0@"
91:
  de: "@a@b*: Aber ihr Vater hat offenbar Pläne für ihre Zukunft. Er möchte einen netten jungen Mann für sie finden, den sie heiraten kann.\n@c0@"
  en: "@a@b*: But her father has plans for her future, it seems. He's hoping to find a nice young man for her to marry.\n@c0@"
  es: "@a@b*: Pero parece que su padre tiene planes para ella. Espera poder casarla con un buen mozo.\n@c0@"
  fr: "@a@b*ⓢ Mais son père semble avoir des projets pour son avenir. Il espère la marier à un jeune homme bien comme il faut.\n@c0@"
  it: "@a@b*: Suo padre, però, non ne ha voluto sapere. Dice che è giunto il momento che la figlia prenda marito, e sta cercando un bravo giovane che la sposi.\n@c0@"
  ja: "@a@b＊「そろそろ　ステキな男性を探して\n\t彼女と結婚させたいというのが\n\tお父上の　お考えらしいですね。\n@c0@"
92:
  de: "@a@b*: Ⓠ Ich pflüge meinen Acker\nund spitz' dabei ganz wacker\ndie Ohren nach ein wenig Klatsch und Tratsch Ⓡ\n@c0@"
  en: "@a@b*: Ⓠ With a hand to the soil,\nI work my honest toil,\nand listen out for gossip as I sow Ⓡ\n@c0@"
  es: "@a@b*: Ⓠ ¡Oh, qué satisfacciones\nda el trabajo honesto y sus sudores,\nsiempre bien atento a los rumores! Ⓡ\n@c0@"
  fr: "@a@b*ⓢ Ⓠ Les mains dans la terre,\nJe travaille la tête en l'air\nécoutant les dires des commères Ⓡ\n@c0@"
  it: "@a@b*: Mentre lavoro indefessoooh... Ⓠ\nDei fatti degli altri m'interessoooh... Ⓡ\nAmo l'inciucio e lo pratico spe-e-esso...! Ⓡ\n@c0@"
  ja: "@a@b＊「あ～　それ\n\tトン　トン　トン　っと♪\n@c0@"
93:
  de: "@a@b*: Ihr seht etwas verloren aus, %H0860%X%A0110%XReisender%Z%B0110%XReisende%Z%YReisende%Z. Wenn Ihr Mostroferrato sucht, das ist im Süden, durch den Tunnel.\n@c0@"
  en: "@a@b*: You look lost, %H0860%Xtrav'ller%Ytrav'llers%Z. If you're lookin' for Mostroferrato, it's down south, through the tunnel.\n@c0@"
  es: "@a@b*: %H0860%XPareces perdido, %A0110%Xviajero%Z%B0110%Xviajera%Z%YParecéis perdidos, %R0000%Xviajeras%Yviajeros%Z%Z. %H0860%XSi buscas%YSi buscáis%Z Mostroferrato, está al sur, cruzando el túnel.\n@c0@"
  fr: "@a@b*ⓢ Vous m'avez l'air perdu%H0860%X%A0110%X%Z%B0110%Xe%Z%Y%R0000%Xes%Ys%Z%Z, voyageu%H0860%X%A0110%Xr%Z%B0110%Xse%Z%Y%R0000%Xses%Yrs%Z%Z. Si vous comptez aller à Mostroferrato, continuez vers le sud par le tunnel.\n@c0@"
  it: "@a@b*: %H0860%X%A0110%XGiovanotto, ti sei perso? Cerchi%Z%B0110%XSignorina, ti sei persa? Cerchi%Z%Y%R0000%XSignorine, vi siete perse? Cercate%YSignori, vi siete persi? Cercate%Z%Z forse Mostroferrato? Si trova a sud, oltre la galleria.\n@c0@"
  ja: "@a@b＊「ここから　南の洞くつを抜けて\n\t橋を　わたれば\n\tサラボナの町だ～よ。\n@c0@"
94:
  de: "@a@b*: Ich verrat' Euch ein kleines Geheimnis. Ich hab vor kurzem in einer Höhle westlich von Bauernsiepen mit einem furchtbaren Monster gekämpft.\n@c0@"
  en: "@a@b*: I'll let you in on a little secret. I did battle with a fearful monster in a cave just west of Hay not long ago.\n@c0@"
  es: "@a@b*: %H0860%XTe%YOs%Z contaré un pequeño secreto. Hace poco, en una cueva al oeste de Puebla del Heno, luché con un monstruo temible.\n@c0@"
  fr: "@a@b*ⓢ J'ai un petit secret à vous dire. J'ai combattu un monstre effroyable dans une grotte à l'ouest de Chaumes il n'y a pas longtemps.\n@c0@"
  it: "@a@b*: Voglio %H0860%Xraccontarti%Yraccontarvi%Z una cosa!\nQualche tempo fa, ho affrontato un mostro tremendo in una grotta a ovest di Punta Campestre!\n@c0@"
  ja: "@a@b＊「じつは　カボチ村の西の\n\t洞くつで　とてつもなく\n\t強い魔物と　戦ったのだ。\n@c0@"
95:
  de: "@a@b*: Ihr werdet nie erraten, was das für ein Monster war... Eine Säbelzahnkatze, ausgerechnet!\n@c0@"
  en: "@a@b*: You'll never guess what it was...\nA great sabrecat of all things!\n@c0@"
  es: "@a@b*: Ni %H0860%Xte imaginas%Yos imagináis%Z lo que era...\n¡Un dientes de sable, nada menos!\n@c0@"
  fr: "@a@b*ⓢ Vous ne devinerez jamais ce que c'était...\nun smilodonⓠ\n@c0@"
  it: "@a@b*: Non %H0860%Xindovineresti%Yindovinereste%Z mai di che bestia si trattava...\nEra un Koguar!\nRoba da farsela addosso dalla paura, eh?\n@c0@"
  ja: "@a@b＊「あれは　まさしく\n\tキラーパンサー！\n@c0@"
96:
  de: "@a@b*: Ich sage furchtbar, aber man konnte merken, dass die Säbelzahnkatze früher mal an Menschen gewöhnt war. Vielleicht war sie sogar mal richtig zahm.\n@c0@"
  en: "@a@b*: I say it was fearful, but I could tell it'd had some contact with humans. It might even have been someone's pet once.\n@c0@"
  es: "@a@b*: Ya digo, era temible, pero creo que había tenido contacto con humanos. Hasta podría haber sido la mascota de alguien.\n@c0@"
  fr: "@a@b*ⓢ Il était très impressionnant, mais j'ai senti qu'il avait déjà été en contact avec l'homme. Peut-être même qu'il avait été le compagnon de quelqu'un...\n@c0@"
  it: "@a@b*: In realtà, il mostro non era molto tremendo.\nAnzi, sembrava che fosse già stato domato. Quando mi ci sono imbattuto, però, era tutt'altro che docile!\n@c0@"
  ja: "@a@b＊「しかも　人に\n\t飼われていたことが　あると\n\tオレは　みたぞ！\n@c0@"
97:
  de: "@a@b*: Wenn ich so drüber nachdenke, wäre das wohl die richtige Methode, sie zu zähmen. Indem man etwas benutzt, was sie an ihren alten Eigentümer erinnert...\n@c0@"
  en: "@a@b*: Come to think of it, that'd be the way to tame it again, I suppose. By using something it remembered from its old owner...\n@c0@"
  es: "@a@b*: Quizá fuese posible domarlo si reconociese algo de cuando era cachorro.\n@c0@"
  fr: "@a@b*ⓢ Maintenant que j'y repense, je suis sûr que c'est comme ça qu'on pourrait l'apprivoiser, en utilisant un objet qui a appartenu à son ancien propriétaire.\n@c0@"
  it: "@a@b*: Sono convinto che è possibile addomesticarlo di nuovo, magari mostrandogli un oggetto che apparteneva al suo padrone...\n@c0@"
  ja: "@a@b＊「なにか　その頃の思い出の品でも\n\tつかえば　手なずけられるかも\n\tしれないのだが……。\n@c0@"
98:
  de: "@a@b*: Ich will ja nicht neugierig sein, aber wie steht Ihr eigentlich zu Frauen? Findet Ihr, dass Bescheidenheit eine Tugend ist und so?\n@c0@"
  en: "@a@b*: Now I don't mean to pry, but what's your opinion on women? D'you think they should be all demure an' unassumin' an' that?\n@c0@"
  es: "@a@b*: No es por cotillear, ¿pero qué %H0860%Xpiensas%Ypensáis%Z de las mujeres? ¿%H0860%XCrees%YCreéis%Z que deben ser modestas, recatadas y todo eso?\n@c0@"
  fr: "@a@b*ⓢ Je veux pas paraître indiscrète, mais qu'est-ce que vous pensez des femmesⓡ Vous croyez qu'elles devraient toutes être effacées et discrètesⓡ\n@c0@"
  it: "@a@b*: %H0860%XDimmi un po', cosa pensi%YDite un po', cosa pensate%Z delle donne?\n%H0860%XCredi%YCredete%Z che dovrebbero essere riservate e sottomesse?\n@c0@"
  ja: "@a@b＊「ねえ　あんたも\n\t女性は　しとやかで\n\t素直な方が　いいと思う？\n@c0@"
99:
  de: "@a@b*: Dachte ich's mir doch. Vielleicht sollte ich mich am besten sofort für einen Kurs im Stift anmelden, so wie Nera.\n@c0@"
  en: "@a@b*: I thought as much. I s'pose I better sign up for a stint at the old abbey like Nera did, then.\n@c0@"
  es: "@a@b*: Eso me parecía. Creo que será mejor que entre en la vieja abadía, como hizo Nera.\n@c0@"
  fr: "@a@b*ⓢ J'en étais sûre. Dans ce cas, je ferais aussi bien d'aller m'enfermer dans une abbaye comme Nera.\n@c0@"
  it: "@a@b*: Proprio come temevo. Se le cose stanno così, mi conviene fare la valigia e rinchiudermi in un monastero, proprio come ha fatto Nera.\n@c0@"
  ja: "@a@b＊「ふーん　やっぱりね。\n\tあたしも　フローラさんみたいに\n\t修道院で　花嫁修業しようかな。\n@c0@"
100:
  de: "@a@b*: Genau! Wir Frauen haben ja wohl mehr zu bieten als das, oder?!\n@c0@"
  en: "@a@b*: That's right! We women have more to offer than that now, dun't we!?\n@c0@"
  es: "@a@b*: ¡Pues claro! Las mujeres tenemos mucho más que ofrecer, ¿no?\n@c0@"
  fr: "@a@b*ⓢ Vous avez bien raisonⓠ Nous, les femmes, on a bien plus à offrir, pas vraiⓠⓑ\n@c0@"
  it: "@a@b*: Sono d'accordo con %H0860%Xte%Yvoi%Z!\nNoi donne abbiamo diritto a un ruolo di primo piano nella società! Non siamo mica serve degli uomini, eh?!\n@c0@"
  ja: "@a@b＊「そうよね！\n\t本当の女らしさって\n\tそれだけじゃないもの。\n@c0@"
101:
  de: "@a@b*: Ich sag Euch was. Wenn Ihr Euch langweilt, warum schaut Ihr nicht mal in das Buch auf der Theke dort hinein?\n@c0@"
  en: "@a@b*: I tell you what. If you're feeling bored, why don't you take a look at that book on the counter there?\n@c0@"
  es: "@a@b*: ¿%H0860%XSabes%YSabéis%Z qué? Si %H0860%Xte aburres%Yos aburrís%Z, ¿por qué no %H0860%Xechas%Yecháis%Z un vistazo al libro del mostrador?\n@c0@"
  fr: "@a@b*ⓢ Je peux vous dire quelque choseⓡ Si vous vous ennuyez, pourquoi vous ne jetteriez pas un œil à ce livre sur le comptoirⓡ\n@c0@"
  it: "@a@b*: %H0860%XTi stai annoiando, non è vero? Perché non dai%YVi state annoiando, non è vero? Perché non date%Z un'occhiata al libro che si trova sul bancone?\n@c0@"
  ja: "@a@b＊「お客さん　たいくつだったら\n\tカウンターの　宿帳でも\n\t見ていくといいですよ。\n@c0@"
102:
  de: "@a@b*: Hierher kommen alle möglichen Leute. Und alle schreiben was in das Buch. Was Tratsch angeht, da seid Ihr Reisenden wohl gern auf dem Laufenden?\n@c0@"
  en: "@a@b*: We have all sorts in here, you know. And they all write things in it. You travellers certainly like to keep up on your gossip, don't you?\n@c0@"
  es: "@a@b*: Aquí viene gente de todo tipo, y todos escriben en él. A los viajeros os gusta estar al día de los cotilleos, ¿eh?\n@c0@"
  fr: "@a@b*ⓢ Des gens du monde entier passent par ici et ils laissent tous un mot dans ce livre. Je vous connais vous, les voyageurs. Vous aimez les commérages.\n@c0@"
  it: "@a@b*: Qui vengono persone da ogni parte del mondo, e chiediamo loro di scrivere i pettegolezzi di cui vengono a conoscenza.\n㈡\n*: Da queste parti abbiamo una vera passione per indiscrezioni, voci di corridoio, chiacchiere da parrucchiera e inciuci in genere!\n@c0@"
  ja: "@a@b＊「ウチは　けっこう　旅人の出入りが\n\t多くて　いろんなウワサ話が\n\t書き残されてますからね。\n@c0@"
103:
  de: "@a@b*: Oh, ist das der Fama-Foliant? Ah ja. Der steckt voller Klatsch und Tratsch.\n@c0@"
  en: "@a@b*: Oh, is that the Scuttlebutt Alledger you've got there? Oh, yes. That's full of tittle-tattle, that is.\n@c0@"
  es: "@a@b*: ¿Eh?, ¿que si eso de ahí es ⓕEl Mentidero Verdaderoⓖ? ¡Ah!, sí. Es un cúmulo de marujeos.\n@c0@"
  fr: "@a@b*ⓢ Mais ce ne serait pas les On-dit de Milleragotsⓡ Eh oui. Un livre plein de commérages.\n@c0@"
  it: "@a@b*: Oh, ma quelle sono le ⓕCronache di Inchucheniaⓖ!\nÈ un testo meraviglioso!\nContiene i più succulenti pettegolezzi del mondo!\n@c0@"
  ja: "@a@b＊「ありゃ　お客さん　それは\n\tうちの宿の　うわさのノートじゃ\n\tないですか。\n@c0@"
104:
  de: "@a@b*: Behaltet ihn ruhig, wenn Ihr wollt. Aber das ist alles nur Geschwätz. Nehmt die Geschichten lieber nicht allzu ernst!\n@c0@"
  en: "@a@b*: Keep it if you want to. It's all gossip, mind. Don't take it too seriously!\n@c0@"
  es: "@a@b*: %H0860%XQuédatelo si quieres%YQuedáoslo si queréis%Z. Solo vienen cotilleos. ¡No %H0860%Xte lo tomes%Yos lo toméis%Z muy en serio!\n@c0@"
  fr: "@a@b*ⓢ Je vous le laisse. N'oubliez pas que ce sont des ragots. Ne prenez pas tout au sérieuxⓠ\n@c0@"
  it: "@a@b*: Se %H0860%Xvuoi, puoi%Yvolete, potete%Z tenerlo. È una lettura interessante, a patto di non prenderla troppo sul serio. Del resto, non contiene altro che inciuci...\n@c0@"
  ja: "@a@b＊「ノートはまだあるから\n\t持って行ってもいいけど　何の役にも\n\t立たないと思いますよ。\n@c0@"
105:
  de: "@a@b*: Wenn man eine Schänke betreibt, macht man sich so seine Gedanken, wisst Ihr...\n@c0@"
  en: "@a@b*: You can't help having a few thoughts on the subject when you run an inn, you know...\n@c0@"
  es: "@a@b*: Cuando llevas una posada es difícil no tener algunas opiniones sobre las cosas...\n@c0@"
  fr: "@a@b*ⓢ C'est le genre de sujet qui vous interpelle quand vous tenez une auberge...\n@c0@"
  it: "@a@b*: Gestisco una locanda e vedo ogni giorno tanti volti nuovi. C'è chi viaggia da solo, e chi lo fa in compagnia.\n@c0@"
  ja: "@a@b＊「こうして　宿をやってると\n\t思うんですよ……。\n@c0@"
106:
  de: "@a@b*: Wenn Ihr mich fragt, dann würde ich viel lieber in Begleitung von ein paar Freunden reisen als allein. Das wäre, als hätte man seine Familie dabei.\n@c0@"
  en: "@a@b*: If you ask me, I'd much rather travel with a few friends than on my own. It'd be like having a family with you.\n@c0@"
  es: "@a@b*: Y para mí que es mejor viajar con amigos que ir por tu cuenta. Es como llevar a la familia contigo.\n@c0@"
  fr: "@a@b*ⓢ Personnellement, je pense que je préférerais voyager avec quelques amis plutôt que tout seul.\nCe serait un peu comme une famille.\n@c0@"
  it: "@a@b*: Se dovessi viaggiare, preferirei farlo insieme ad altre persone, così mi sentirei come in famiglia!\nDico bene, no?\n@c0@"
  ja: "@a@b＊「旅をするのに　仲間がいる人は\n\t幸せだなって。　ましてや　それが\n\t家族ならね。\n@c0@"
107:
  de: "@a@b*: Oh, sagt es mir nicht! Lasst mich raten! Ihr habt von der hübschen kleinen Nera gehört, und nun habt Ihr ein Auge auf sie geworfen!\n@c0@"
  en: "@a@b*: Ooh, don't tell me! Let me guess!\nYou've heard about that pretty little Nera and now you're hoping to get married to her!\n@c0@"
  es: "@a@b*: ¡Oh, no me digas más! ¡A ver si lo adivino!\r\n¡Has oído hablar de la hermosa Nera y quieres casarte con ella!\n@c0@"
  fr: "@a@b*ⓢ Attendezⓠ Ne me dites rienⓠ Laissez-moi devinerⓠ\nVous avez entendu parler de la jolie Nera et vous espérez l'épouserⓠ\n@c0@"
  it: "@a@b*: Mio cugggino mi ha riferito un pettegolezzo interessante...\n㈡\n*: In città è giunto un forestiero che ha saputo della bella Nera e vorrebbe sposarla!\nChi sarà mai questo straniero, eh? Eh eh eh!\n@c0@"
  ja: "@a@b＊「あんた　まさか　ウワサを聞いて\n\tフローラさんと　結婚したいなんて\n\t思ったんじゃないだろうねえ。\n@c0@"
108:
  de: "@a@b*: Ach, ich kann's gar nicht erwarten, das allen weiterzuerzählen! Aber macht Euch keine allzu große Hoffnung. Ihr müsstet schon viel Glück haben!\n@c0@"
  en: "@a@b*: Ooh, wait till I tell everyone!\nBut I wouldn't get your hopes up too much. She'd be quite a catch for you!\n@c0@"
  es: "@a@b*: ¡Ay, espera a que lo cuente!\r\nPero yo no me haría ilusiones. ¡Parece demasiado buen partido para ti!\n@c0@"
  fr: "@a@b*ⓢ Faut absolument que je le dise aux autresⓠ\nMais sachez que ce n'est pas gagné d'avance.\nC'est vraiment un beau parti, cette petiteⓠ\n@c0@"
  it: "@a@b*: Devo riferirlo subito a tutti! E devo dire anche a ⓕquelloⓖ straniero di non farsi troppe illusioni... Nera è una preda difficile da catturare!\n@c0@"
  ja: "@a@b＊「でも　あれほどの娘さんだ。\n\t相手にも　されないと思うよ。\n@c0@"
109:
  de: "@a@b*: Ihr werdet nie erraten, was ich gehört habe! Prinz Harry von Tifortu hat geheiratet!\n@c0@"
  en: "@a@b*: Ooh, you'll never guess what I heard!\nPrince Harry of Coburg's got married!\n@c0@"
  es: "@a@b*: ¡Ah!, ¡ni te imaginas lo que he oído!\r\n¡El príncipe Froilán de Trastámara se ha casado!\n@c0@"
  fr: "@a@b*ⓢ Vous ne devinerez jamais ce qu'on m'a ditⓠ\nLe prince Harry de Cobourg s'est mariéⓠ\n@c0@"
  it: "@a@b*: Che notiziona!\nPare che Robert, il Principe di Coburg, si sia sposato! Proprio lui, che era uno scapolo impenitente!\n@c0@"
  ja: "@a@b＊「ラインハットのヘンリーさまが\n\tご結婚なさったらしいわね。\n@c0@"
110:
  de: "@a@b*: Was? Ihr seid ein Freund von ihm? Oh, erzählt schon, wie war es? Wie bitte?! Ihr wisst es nicht?! Dann geht hin und fragt ihn!\n@c0@"
  en: "@a@b*: What's that? You're a friend of his?\nOoh, tell all, tell all!\nWhat!? You didn't know!? Then go and ask him!\n@c0@"
  es: "@a@b*: ¿Cómo? ¿Que eres %A0110%Xamigo suyo%Z%B0110%Xamiga suya%Z?\n¡Qué fuerte, qué fuerte!\n¿Qué? ¿Que no lo sabías? ¡Pues ve y pregúntale!\n@c0@"
  fr: "@a@b*ⓢ Commentⓡ Vous êtes un%A0110%X%Z%B0110%Xe%Z de ses ami%A0110%X%Z%B0110%Xe%Zsⓠ\nAlors, comment était le mariageⓡ Quoiⓠⓑ\nVous ne savez pasⓠⓑ Allez lui demander, alorsⓠ\n@c0@"
  it: "@a@b*: Che cosa? Sei %A0110%Xun suo amico%Z%B0110%Xuna sua amica%Z?!\nForza, parla! Voglio conoscere tutti dettagli!\n㈡\n*: Come sarebbe a dire che non ne sai niente?!\nAllora corri da lui, fatti raccontare tutto e poi riferiscimi com'è andata di preciso!\n@c0@"
  ja: "@a@b＊「え？　あんた　ヘンリーさまと\n\tお知り合いなの？\n\tだったら　行ってあげなよ！\n@c0@"
111:
  de: "@a@b*: Ich habe von einem Kerl in Wunnermühl gehört, der den Teleportationszauber kennt. Das wäre der schnellste Weg, nach Tifortu zu kommen.\n㈡\n*: Also beeilt Euch! Hach, ich kann's gar nicht erwarten, all die saftigen Einzelheiten zu erfahren!\n@c0@"
  en: "@a@b*: I heard of a fellow in Zoomingale who knows the Zoom spell. That'd be the quickest way to get to Coburg.\n㈡\n*: So hurry up! Ooh, I'm dying to know all the juicy details!\n@c0@"
  es: "@a@b*: He oído que en Telele hay un tipo que conoce el conjuro Telerregreso. Sería el modo más rápido de ir a Trastámara.\n㈡\n*: ¡Así que corre! ¡Me muero por saber todos los detalles!\n@c0@"
  fr: "@a@b*ⓢ On m'a dit qu'un monsieur de Moulinsort connaissait le sort Téléportation. Ce serait le moyen le plus rapide d'aller à Cobourg.\n㈡\n*ⓢ Dépêchez-vousⓠ J'ai tellement envie d'entendre les détails les plus croustillantsⓠ\n@c0@"
  it: "@a@b*: La cugggina di un amico del suocero di mio nipote mi ha detto che a Milleventi c'è un tipo che conosce l'incantesimo ⓕTeletrasportoⓖ.\n㈡\n*: Con quello, ci metteresti un attimo ad andare a Coburg e a tornare qui!\nAvanti, che aspetti?!\n㈡\n*: Oh, sto morendo dalla curiosità!\nDevo assolutamente sapere da chi è stato accalappiato quel fusto del Principe!\n@c0@"
  ja: "@a@b＊「ルラフェンで　ルーラっていう\n\t呪文を習えば　ラインハットに\n\tもどれるはずだよ！\n@c0@"
112:
  de: "@a@b*: Ssss!\n@c0@"
  en: "@a@b*: Ssss!\n@c0@"
  es: "@a@b*: ¡Ssssh!\n@c0@"
  fr: "@a@b*ⓢ Chhhⓠ\n@c0@"
  it: "@a@b*: Miaaaooo!\n@c0@"
  ja: "@a@b＊「フーッ！\n@c0@"
113:
  de: "@a@b*: Was sagt Ihr dazu! Nera, Rodrigo Onassettis Tochter, ist nach sechs Jahren im Stift Obendroben endlich nach Mostroferrato zurückgekehrt!\n@c0@"
  en: "@a@b*: Get this! After six whole years at Heaven's Above Abbey, Rodrigo Briscoletti's daughter, Nera, has finally returned to Mostroferrato!\n@c0@"
  es: "@a@b*: ¡Ojo al dato! ¡Después de pasar seis años en la Abadía Subcelestis, Nera, la hija de Santino Rimaldi, ha vuelto por fin a Mostroferrato!\n@c0@"
  fr: "@a@b*ⓢ Incroyableⓠ Après 6 ans à l'abbaye du Firmament, Nera, la fille de Rodrigo Oscuroni, est enfin retournée à Mostroferratoⓠ\n@c0@"
  it: "@a@b*: Mio cugggino mi ha detto che Nera, la figlia di Rick Fosconi, è tornata a Mostroferrato dopo aver trascorso sei anni all'Abbazia di Su'ncyel.\n@c0@"
  ja: "@a@b＊「サラボナの町の　フローラさんが\n\t６年ぶりに　修道院から\n\t帰ってきたそうじゃ。\n@c0@"
114:
  de: "@a@b*: Ich würde sie so gern kennenlernen. Ich... würde sie... zzz...\n@c0@"
  en: "@a@b*: I'd love to meet her.\nI'd...love to...zzz...\n@c0@"
  es: "@a@b*: Me encantaría conocerla.\r\nMe... encantaría... zzz...\n@c0@"
  fr: "@a@b*ⓢ J'aimerais tellement la rencontrer.\nJ'aimerais... zzz...\n@c0@"
  it: "@a@b*: Ronf...\nMi piacerebbe molti... zzz... imo incontrarla...\nMi piacerooonf... Zzz...\n@c0@"
  ja: "@a@b＊「わしも　会いたいのう。\n\tぐうぐう……。\n@c0@"
115:
  de: "@a@b*: Wie traurig, nach so langer Zeit Abschied nehmen zu müssen. Wir haben uns lange Jahre um Nera gekümmert, wisst Ihr.\n@c0@"
  en: "@a@b*: It's rather sad parting after such a long time. We looked after Nera for many years, you know.\n@c0@"
  es: "@a@b*: Es muy triste despedirse después de tanto tiempo. Cuidamos de Nera muchos años.\n@c0@"
  fr: "@a@b*ⓢ C'est triste de devoir se quitter après si longtemps. Nous nous sommes occupées de Nera pendant des années, vous savez.\n@c0@"
  it: "@a@b*: È triste dirsi addio dopo aver trascorso tanto tempo insieme a una persona cara...\nNera è stata con noi a lungo.\n@c0@"
  ja: "@a@b＊「修道院で　おあずかりしていた\n\tお嬢さんを　家まで\n\tお送りして来たところです。\n@c0@"
116:
  de: "@a@b*: Ich wollte schon lange zum Stift zurückkehren, aber ihre Familie war so gastfreundlich.\n@c0@"
  en: "@a@b*: I would have returned to the abbey sooner, but her family have been so hospitable.\n@c0@"
  es: "@a@b*: Yo habría vuelto antes a la abadía, pero su familia es de lo más hospitalaria.\n@c0@"
  fr: "@a@b*ⓢ J'avais prévu de repartir plus tôt pour l'abbaye, mais sa famille a été si accueillante.\n@c0@"
  it: "@a@b*: Sarei dovuta tornare all'Abbazia da un pezzo, ma non ho saputo dire di no alla squisita ospitalità della famiglia Fosconi.\n@c0@"
  ja: "@a@b＊「もっと早く　失礼するつもり\n\tだったけれど　あまりの　おもてなしに\n\tなかなか　帰れませんでしたわ。\n@c0@"
117:
  de: "@a@b*: Um ganz ehrlich zu sein, wir hätten sie gern bei uns behalten.\n@c0@"
  en: "@a@b*: To be perfectly honest, we would have been glad to have her stay on with us.\n@c0@"
  es: "@a@b*: Para ser del todo sincera, nos hubiera gustado que se quedara con nosotras.\n@c0@"
  fr: "@a@b*ⓢ Pour être sincère, nous aurions été heureuses si elle était restée avec nous à l'abbaye.\n@c0@"
  it: "@a@b*: A essere sincera, avrei preferito che Nera restasse con noi...\n@c0@"
  ja: "@a@b＊「正直なところ　彼女のような人には\n\tシスターとして　修道院に\n\t残ってほしかったのだけど……。\n@c0@"
118:
  de: "@a@b*: Aber ihr Vater hat offenbar Pläne für ihre Zukunft. Er möchte einen netten jungen Mann für sie finden, den sie heiraten kann.\n@c0@"
  en: "@a@b*: But her father has plans for her future, it seems. He's hoping to find a nice young man for her to marry.\n@c0@"
  es: "@a@b*: Pero parece que su padre tiene planes para ella. Espera poder casarla con un buen mozo.\n@c0@"
  fr: "@a@b*ⓢ Mais son père semble avoir des projets pour son avenir. Il espère la marier à un jeune homme bien comme il faut.\n@c0@"
  it: "@a@b*: Suo padre, però, non ne ha voluto sapere. Dice che è giunto il momento che la figlia prenda marito, e sta cercando un bravo giovane che la sposi.\n@c0@"
  ja: "@a@b＊「そろそろ　ステキな男性を探して\n\t彼女と結婚させたいというのが\n\tお父上の　お考えらしいですね。\n@c0@"
119:
  de: "@a@b*: Ich will ja nicht neugierig sein, aber wie steht Ihr eigentlich zu Frauen? Findet Ihr, dass Bescheidenheit eine Tugend ist und so?\n@c0@"
  en: "@a@b*: Now I don't mean to pry, but what's your opinion on women? D'you think they should be all demure an' unassumin' an' that?\n@c0@"
  es: "@a@b*: No es por cotillear, ¿pero qué %H0860%Xpiensas%Ypensáis%Z de las mujeres? ¿%H0860%XCrees%YCreéis%Z que deben ser modestas, recatadas y todo eso?\n@c0@"
  fr: "@a@b*ⓢ Je veux pas paraître indiscrète, mais qu'est-ce que vous pensez des femmesⓡ Vous croyez qu'elles devraient toutes être effacées et discrètesⓡ\n@c0@"
  it: "@a@b*: %H0860%XDimmi un po', cosa pensi%YDite un po', cosa pensate%Z delle donne?\n%H0860%XCredi%YCredete%Z che dovrebbero essere riservate e sottomesse?\n@c0@"
  ja: "@a@b＊「ねえ　あんたも\n\t女性は　しとやかで\n\t素直な方が　いいと思う？\n@c0@"
120:
  de: "@a@b*: Dachte ich's mir doch. Vielleicht sollte ich mich am besten sofort für einen Kurs im Stift anmelden, so wie Nera.\n@c0@"
  en: "@a@b*: I thought as much. I s'pose I better sign up for a stint at the old abbey like Nera did, then.\n@c0@"
