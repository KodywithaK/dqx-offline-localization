  fr: "@a@b*ⓢ Dans le temps, je voyageais moi aussi.\n@c0@"
  it: "@a@b*: Da giovane ho girato il mondo intero...\n@c0@"
  ja: "@a@b＊「わしも　若い頃は\n\t世界をまたにかけたもんじゃ。\n@c0@"
28:
  de: "@a@b*: Ach, das waren noch Zeiten! Schöne Zeiten waren das!\n@c0@"
  en: "@a@b*: Ah, they were fine times. Fine times!\n@c0@"
  es: "@a@b*: ¡Ah!, y qué tiempos. ¡Vaya que sí!\n@c0@"
  fr: "@a@b*ⓢ Ah, c'était le bon temps. Oh oui, le bon tempsⓠ\n@c0@"
  it: "@a@b*: Bei tempi, quelli!\nSigh!\n@c0@"
  ja: "@a@b＊「あの頃が　なつかしいのう。\n@c0@"
29:
  de: "@aMystische Mridula@bKah ha ha ha hah!\nIch bin die mystische, mystische Mridula. Und ich mag diese Person nicht, die Eure Gruppe anführt.\n@c0@"
  en: "@aMystic Mridula@bKah ha ha ha hah!\nI am mystic-mystic Mystic Mridula. And I don't like this person who is leading your party.\n@c0@"
  es: "@aBruja Lola@b¡Lailololailolá!\nSoy la bruja Lola, la bruja más lolailo. ¡Válgame!, no me gusta nada %A0110%Xel payo%Z%B0110%Xla paya%Z que va al frente del grupo.\n@c0@"
  fr: "@aIrma Cristal@bCra ha ha haⓠ\nJe suis la voyante Irma Cristal. %A0110%XCelui%Z%B0110%XCelle%Z qui dirige cette équipe ne me plaît pas vraiment.\n@c0@"
  it: "@aMaga Circiona@bKah ah ah! Io sono la Maga Circiona, e non mi piace la persona che guida il gruppo.\nEh, no. Eeeh, no. Eeeeeh, no no no.\n@c0@"
  ja: "@a@b占いババ「わしは　占いババじゃ。\n\tしかし　そなたらの　先頭の者は\n\tわしの好みじゃないのう……。\n@c0@"
30:
  de: "@aMystische Mridula@bGebt mir einen Mann, der mir gefällt, dann schaue ich gern in meine Kristallkugel, stochere mit dem Finger in schmutzigen Teeblättern rum ⓚⓛ alles, was Ihr wollt...\n@c0@"
  en: "@aMystic Mridula@bIf you are giving to me a man of my liking, I will gladly look into a crystal ball, poke my finger in dirty tea leaves, whatever you are wanting...\n@c0@"
  es: "@aBruja Lola@bSi me traéis un payo bien guapo, le leo la mano, la buenaventura, la caltilla y lo quⓘhaya que leel.\n@c0@"
  fr: "@aIrma Cristal@bSi vous m'amenez un jeune homme à mon goût, je regarderai dans ma boule de cristal, je lirai dans le marc de café... Enfin, tout ce qui vous fera plaisir...\n@c0@"
  it: "@aMaga Circiona@bSe mi farai parlare con un bel pezzo di giovanotto muscoloso e succulento, chiaroveggerò con piacere, altrimenti nisba. Kah ah ah!\n@c0@"
  ja: "@a@b占いババ「好みの男が　話しかけてくれば\n\t占ってもいいんじゃが。\n@c0@"
31:
  de: "@aMystische Mridula@bKah ha ha hah! Willkommen beim wahnwitzigen Wahrsagerei-Wunder, der Mystischen Mridula! Wollt Ihr es mal mit mir versuchen?\n@c0@"
  en: "@aMystic Mridula@bKah ha ha hah! Welcome to Mystic Mridula's super-duper fortune-telling mumbo-jumbo bonanza!\r\nYou wanna give it a go, no?\n@c0@"
  es: "@aBruja Lola@b¡Lolailolá! ¡%H0860%XBienvenid%A0110%Xo%Z%B0110%Xa%Z%YBienvenid%R0000%Xas%Yos%Z%Z al centlo de echal las cartas de la bruja Lola, %H0860%X%A0110%Xpayo%Z%B0110%Xpaya%Z%Y%R0000%Xpayas%Ypayos%Z%Z!\n¿%H0860%XLe leo la buenaventura%YLes leo la buenaventura%Z?\n@c0@"
  fr: "@aIrma Cristal@bCra ha ha haⓠ Bienvenue dans le petit cabinet discret d'Irma Cristalⓠ\nVous voulez essayerⓡ\n@c0@"
  it: "@aMaga Circiona@bKah ah ah!\nLa Maga Circiona ti dà il benvenuto!\nVuoi che ti chiaroveggio un po' il futuro?\n@c0@"
  ja: "@a@b占いババ「わしは　占いババじゃ。\n\t占ってほしいのか？\n@c0@"
32:
  de: "@aMystische Mridula@bAlso gut! Ihr seid so ein schmucker junger Kerl, für Euch mache ich's umsonst!\n@c0@"
  en: "@aMystic Mridula@bOkey-dokey! You're such a handsome cookie,\r\nI'll do it for free!\n@c0@"
