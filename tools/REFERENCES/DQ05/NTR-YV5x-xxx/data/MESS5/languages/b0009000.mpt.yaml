  it: "@a@b*: Io sono Candido, Candido Roast.\nPiacere di %H0860%Xconoscerti. Sai%Yconoscervi. Sapete%Z, sono amico di Nera da quando eravamo piccoli.\n@c0@"
  ja: "@a@bアンディ「ボクは　アンディ。\n\t彼女とは　幼なじみなんですよ。\n@c0@"
