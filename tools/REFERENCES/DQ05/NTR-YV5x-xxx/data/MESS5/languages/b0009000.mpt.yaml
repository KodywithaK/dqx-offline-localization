  ja: "@a@b＊「それでは　お時間となりましたので\n\t応接間へ　お通しいたします。\n\tどうぞ　お入りください。\n@c0@"
202:
  de: "@aRodrigo Onassetti@bWillkommen, meine jungen Romeos! Wie Ihr sicher wisst, bin ich Rodrigo Onassetti.\n@c0@"
