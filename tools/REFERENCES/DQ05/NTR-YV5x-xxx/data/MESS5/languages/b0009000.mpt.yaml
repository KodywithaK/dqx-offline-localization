  es: "@a@b*: Aunque no te va a valer de nada. No pienso dejar escapar la fortuna de Nera.\n@c0@"
  fr: "@a@b*ⓢ Cela ne changera pas grand-chose, car je ne vais sûrement pas me laisser souffler la fortune de Nera.\n@c0@"
  it: "@a@b*: Questo è senz'altro l'avvenimento dell'anno!\nRick Fosconi sta per scegliere il marito per sua figlia Nera... e l'erede del suo patrimonio!\n@c0@"
