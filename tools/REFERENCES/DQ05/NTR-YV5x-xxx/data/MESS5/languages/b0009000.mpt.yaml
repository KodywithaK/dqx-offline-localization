  fr: "@a@b*ⓢ J'aime bien être marié à quelqu'un qui prend tout en charge. Mais... je suis toujours capable de faire des choses moi-même.\n@c0@"
  it: "@a@b*: Sono felice di essere sposato con una donna di carattere! Anche se a volte mi piacerebbe che ne avesse un po' meno, di carattere...\n@c0@"
  ja: "@a@b＊「いやあ　はたらき者の女房で\n\tうれしいんだか\n\t悲しいんだか……。\n@c0@"
186:
  de: "@a@b*: Die Ehe ist eine gesegnete Verbindung zweier Seelen vor der Göttin.\n@c0@"
  en: "@a@b*: Marriage is a blessed union of two souls in the presence of the Goddess.\n@c0@"
