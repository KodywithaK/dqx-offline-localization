  fr: "@a@b*ⓢ Arrête de traîner et prépare du thé, espèce de vieux bon à rienⓠ\n@c0@"
  it: "@a@b*: Smetti di perdere tempo e prepara il tè, brutto scansafatiche che non sei altro!\n@c0@"
  ja: "@a@b＊「あんた　ぼやぼやしてないで\n\tお茶でも　入れてよ！\n@c0@"
183:
