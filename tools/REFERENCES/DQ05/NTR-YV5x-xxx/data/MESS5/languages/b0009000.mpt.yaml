  fr: "@a@b*ⓢ C'est la villa de monsieur Oscuroni. Mais il n'y vient pas beaucoup. C'est encore un tout petit peu trop loin pour lui.\n@c0@"
  it: "@a@b*: Questa è la villa di mister Fosconi.\nÈ molto bella, ma lui non ci viene molto spesso.\nDice che è troppo lontana da casa sua!\n@c0@"
