  ja: "@a@b＊「おや　そうかい。\n\tそれじゃ　あんたも\n\tそろそろ　探さないと。\n@c0@"
180:
  de: "@a@b*: Und Ihr werdet bei den jungen Damen nicht ewig mit Süßholzraspeln weiterkommen. Ist die Jugend erst vorbei, dann war's das!\n@c0@"
