0:
  de: "@aBianca@bIch habe diese Wüstengeschichte wohl etwas auf die leichte Schulter genommen. Ohne die Oase wäre ich verschrumpelt und eingetrocknet wie eine alte Dattel!\n@c0@"
  en: "@aBianca@bI was a bit too casual about this desert lark.\r\nIf it weren't for this oasis, I'd have prob'ly shrivelled up and died!\n@c0@"
  es: "@aBianca@bNo me tomé muy en serio la mandanga esta del desierto, ¿sabes?\n㈡\n¡Si no hubiera sido por este oasis, ahora estaría toda reseca y muerta!\n@c0@"
  fr: "@aBianca@bJ'ai pris cette étape dans le désert un peu à la légère. S'il n'y avait pas eu cette oasis, je serais sûrement morte déshydratéeⓠ\n@c0@"
  it: "@aBianca@bAccidenti se è faticoso avanzare nel deserto...!\nSe non avessimo trovato quest'oasi, credo che sarei svenuta...\n@c0@"
  ja: "@a@bビアンカ「私　砂漠をあまく見てたわ。\n\tオアシスがなかったら\n\tひからびて　死んじゃってたかも。\n@c0@"
1:
  de: "@aBianca@bHier wächst ja sogar was! Das ist wirklich eine Oase inmitten der Wüste! Leben möchte ich hier aber nicht.\n@c0@"
  en: "@aBianca@bThere's even some greenery here! It really is an oasis in the middle of a desert. Wouldn't want to\r\nlive here, mind.\n@c0@"
  es: "@aBianca@b¡Si hasta hay un poco de vegetación aquí! Es realmente un oasis en mitad de un desierto. Pero no creo que me gustase mucho vivir aquí.\n@c0@"
  fr: "@aBianca@bIl y a même de la verdureⓠ\nC'est vraiment une oasis au milieu du désert.\nCela dit, je n'aimerais pas vivre ici.\n@c0@"
  it: "@aBianca@bIl deserto è persino peggiore di quanto mi aspettassi!\nPer fortuna abbiamo trovato un'oasi...\n@c0@"
  ja: "@a@bビアンカ「緑もあって\n\tまさに　砂漠のオアシスね。\n\tでも　ここで暮らすのは　大変そう…。\n@c0@"
2:
  de: "@aBianca@bIch glaube, ich könnte jetzt einen ganzen See austrinken! Aber ein bisschen muss ich wohl noch übrig lassen.\n@c0@"
  en: "@aBianca@bI reckon I could drink enough water to fill a small lake at the moment! Mustn't drink this place dry, mind.\n@c0@"
  es: "@aBianca@b¡Creo que ahora mismo podría beber agua como para llenar un embalse! Pero será mejor que no deje seco este sitio, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe crois que je pourrais boire l'équivalent d'un petit lacⓠ Il faut quand même que je fasse attention à ne pas assécher l'oasisⓠ\n@c0@"
  it: "@aBianca@bHo una sete tale che mi berrei un lago, alghe, rocce e pesci inclusi!\n@c0@"
  ja: "@a@bビアンカ「今なら　私　いくらでも\n\t水が飲めそう。　でも　オアシスを\n\t枯らさないように　気をつけるわね。\n@c0@"
3:
  de: "@aNera@bMir geht's gut, w-wirklich. Mach dir keine Sorgen um mich. Jetzt, da wir an der Oase sind, geht es mir wieder gut.\n@c0@"
  en: "@aNera@bI'm okay, r-really. Don't worry about me. I'm fine now we're here at the oasis.\n@c0@"
  es: "@aNera@bEstoy bene, d-de verdad. No te preocupes per me: ahora que estamos en el oasis me encuentro mejor.\n@c0@"
  fr: "@aNera@bJ-Je vais bien, je t'assure. Ne t'inquiète pas pour moi. Ça va mieux depuis qu'on est arrivés à l'oasis.\n@c0@"
  it: "@aNera@bSto bene, caro, sto bene...\nCioè, sto bene ora che siamo all'oasi, perché prima ero sul punto di perdere i sensi!\n@c0@"
  ja: "@a@bフローラ「だ　大丈夫ですわ。\n\t私のことは　心配なさらないで。\n\tこうして　オアシスに着きましたもの。\n@c0@"
4:
  de: "@aNera@bWir sollten darauf achten, dass wir ordentlich trinken, so lange wir hier sind, um den Wassermangel auszugleichen.\n@c0@"
  en: "@aNera@bWe should make sure we have some water while we're here so that we can rehydrate a little.\n@c0@"
  es: "@aNera@bMientras estemos aquí tenemos que beber y rehidratarnos un attimo.\n@c0@"
  fr: "@aNera@bNous devrions profiter de notre passage ici pour boire, afin de nous réhydrater un peu.\n@c0@"
  it: "@aNera@bViaggiare nel deserto senz'acqua equivale a suicidarsi lentamente...\n@c0@"
  ja: "@a@bフローラ「せっかくですから\n\t少しだけ　お水を\n\tいただいていこうかしら…。\n@c0@"
5:
  de: "@aNera@bGlaubst du, die Leute haben sich hier angesiedelt, um ermatteten Reisenden wie uns zu helfen?\n@c0@"
  en: "@aNera@bDo you think people set up home here so that they could help weary travellers like us?\n@c0@"
  es: "@aNera@b¿Crees que la gente que vive aquí lo hace para poder ayudare a los viajeros fatigados come noi?\n@c0@"
  fr: "@aNera@bTu crois que les gens se sont installés ici pour pouvoir aider les voyageurs épuisés comme nousⓡ\n@c0@"
  it: "@aNera@bCredi che queste persone si siano stabilite qui per aiutare i poveri viaggiatori in difficoltà come noi?\n@c0@"
  ja: "@a@bフローラ「ここに　家を建てられたのは\n\t私たちのような旅人が\n\t身体を　休められるようにかしら？\n@c0@"
6:
  de: "@aNera@bAber ob das nun der Grund ist oder nicht, ich bin so dankbar, dass sie hier sind!\n@c0@"
  en: "@aNera@bWhether that's the reason or not, I don't think I could be more grateful to find them here!\n@c0@"
  es: "@aNera@b¡De cualquier modo, les estaré veramente agradecida sempre por estar aquí!\n@c0@"
  fr: "@aNera@bQuelle que soit leur motivation, je leur suis profondément reconnaissanteⓠ\n@c0@"
  it: "@aNera@bForse no, ma ciò non toglie che sarò loro grata vita natural durante! Senza di loro, non so proprio che fine avremmo fatto!\n@c0@"
  ja: "@a@bフローラ「いずれにせよ\n\tこの家の存在は　とても\n\tありがたいですわね。\n@c0@"
7:
  de: "@aBianca@bFür einen Hund muss diese Hitze doch fürchterlich sein. Er kann sein Fell schließlich nicht wie einen Mantel ablegen.\n@c0@"
  en: "@aBianca@bIt must be awful bein' a dog in the heat like this.\r\nIt's not like it can take its coat off.\n@c0@"
  es: "@aBianca@bDebe de ser terrible ser perro con este calor tan tremendo.\r\nClaro, ellos no se pueden quitar el abrigo, ¿sabes?\n@c0@"
  fr: "@aBianca@bÇa doit être horrible d'être un chien sous un soleil pareil. Eux, ils ne peuvent rien enlever\r\npour avoir moins chaud.\n@c0@"
  it: "@aBianca@bPovero cane!\nFigurati come soffre, con quel cappotto di pelo che si ritrova addosso...\n@c0@"
  ja: "@a@bビアンカ「犬は　暑くても\n\t毛皮を　ぬげないから　大変よね。\n@c0@"
8:
  de: "@aNera@bDer arme Hund! Der geht sicher bald ein vor Hitze!\n@c0@"
  en: "@aNera@bThat poor dog! It must be absolutely boiling.\n@c0@"
  es: "@aNera@b¡Pobre cane! Se debe de estar muriendo de calor.\n@c0@"
  fr: "@aNera@bPauvre toutouⓠ Il doit bouillirⓠ\n@c0@"
  it: "@aNera@bQuel cucciolo deve soffrire un caldo infernale...\nNon vorrei proprio essere nei suoi... peli!\n@c0@"
  ja: "@a@bフローラ「まあ！\n\t犬さんも　暑そうですわ。\n@c0@"
9:
  de: "@aBianca@bIm Zelt ist es schön kühl. Es geht einem gleich viel besser, wenn man aus der Sonne kommt.\n@c0@"
  en: "@aBianca@bIt's nice and cool inside the tent. If you can just get out of the sun, it makes a big difference.\n@c0@"
  es: "@aBianca@bDentro de la tienda se está fresco y la mar de bien. Con poder resguardarse un poco del sol ya vale, ¿sabes?\n@c0@"
  fr: "@aBianca@bIl fait bon à l'intérieur de la tente. Il faut vraiment échapper au soleil pour se sentir bien.\n@c0@"
  it: "@aBianca@bSotto la tenda non si sta poi tanto male, sai?\nQui all'ombra c'è una discreta frescura...\n@c0@"
  ja: "@a@bビアンカ「テントの中って　涼しいね。\n\t日が　直接　体に当たらないと\n\tこんなに　ちがってくるもんなんだ…。\n@c0@"
10:
  de: "@aNera@bVon außen sieht es nur nach einem kleinen Zelt aus, aber es ist überraschend gut ausgestattet. Es wirkt recht komfortabel.\n@c0@"
  en: "@aNera@bIt only looks like a small tent from the outside, but it's surprisingly well-equipped. You could probably live here quite comfortably.\n@c0@"
  es: "@aNera@bDesde fuera parece solo una piccola tienda, pero está muy bien equipada, ¡qué sorpresa! Creo que se podría vivir en ella con comodittà.\n@c0@"
  fr: "@aNera@bDe l'extérieur, ça ne ressemble qu'à une modeste tente, mais elle est incroyablement bien équipée.\r\nLa vie doit y être assez confortable.\n@c0@"
  it: "@aNera@bVista da fuori sembra solo una piccola tenda, ma dentro non manca proprio nulla!\nLa gente che ci vive s'è attrezzata davvero bene.\n@c0@"
  ja: "@a@bフローラ「小さなテントだと思いましたが\n\t中は　いろいろ　充実していますのね。\n\t立派に　生活できそうですわ。\n@c0@"
11:
  de: "@aBianca@bEs sieht aus, als kämen hier nicht viele Leute vorbei. Das ist ja auch kein Wunder.\n@c0@"
  en: "@aBianca@bLooks like not many people pass by here.\r\nNot surprisin', really.\n@c0@"
  es: "@aBianca@bParece que no pasa mucha gente por aquí, ¿eh?\r\nNo me sorprende, la verdad.\n@c0@"
  fr: "@aBianca@bOn dirait qu'il n'y a pas grand monde qui passe par ici. Remarque, ça ne m'étonne pas...\n@c0@"
  it: "@aBianca@bNon c'è da essere sorpresi che non capitino molti viaggiatori in questo luogo inospitale!\n@c0@"
  ja: "@a@bビアンカ「そっか…\n\tやっぱり　さばくに来る人は\n\t少ないんだね。\n@c0@"
12:
  de: "@aBianca@bIch dachte immer, Leute, die so weit von der Zivilisation entfernt leben, wären ein wenig brummig, aber der war ja total nett.\n@c0@"
  en: "@aBianca@bI always thought people who live out in the sticks like this would be a bit unfriendly, but he was lovely.\n@c0@"
  es: "@aBianca@bSiempre había pensado que la gente que vive en el quinto pino como esta sería más bien seca, pero él ha sido muy amable, ¿sabes?\n@c0@"
  fr: "@aBianca@bJ'ai toujours pensé que les gens qui vivaient au milieu de nulle part devaient être un peu revêches, mais il était adorable.\n@c0@"
  it: "@aBianca@bChe gentile!\nA essere sincera, non credevo che ci avrebbe accolti in maniera tanto amichevole, sai?\n@c0@"
  ja: "@a@bビアンカ「へんぴな場所に　住んでる人は\n\tへんくつな人ばかりだと　思ってたけど\n\t親切な人で　良かったわね。\n@c0@"
13:
  de: "@aNera@bHelmunaptra liegt im Westen und König Dominicus' Domäne im Südosten. Das stimmt doch, oder? Ich habe ein ganz schreckliches Richtungsgedächtnis.\n@c0@"
  en: "@aNera@bHelmunaptra to the west and King Dominicus's Dominion to the south-east. That's right, isn't it?\r\nI'm terrible at remembering directions.\n@c0@"
  es: "@aNera@bAyelmandría al oeste y los Dominios de Dominico al sudeste. Es así, ¿verdad?\r\nLa mia orientazione no es muy buona.\n@c0@"
  fr: "@aNera@bHelmunaptra est à l'ouest et le domaine du roi Dominicus au sud-est, c'est bien çaⓡ\nJ'ai vraiment un sens de l'orientation déplorable.\n@c0@"
  it: "@aNera@bIl Regno di Faraonia è a ovest e quello di Minikin a sud-est, dico bene?\nCerchiamo di non dimenticarcene.\n@c0@"
  ja: "@a@bフローラ「西が　テルパドールで\n\t南東が　メダル王…　だったかしら。\n\t私　方角をおぼえるのが　苦手なの。\n@c0@"
14:
  de: "@aNera@bDu kannst entscheiden, wo wir hingehen. Ich komme mit, egal wofür du dich entscheidest.\n@c0@"
  en: "@aNera@bYou can decide where to go. I'll go along with whatever you choose.\n@c0@"
  es: "@aNera@bTú decides dónde vamos. Me adaptaré a la tua decisione.\n@c0@"
  fr: "@aNera@bC'est toi qui décides de la direction à prendre.\r\nJe te suivrai quoi qu'il arrive.\n@c0@"
  it: "@aNera@bScegli pure dove andare: per me qualunque destinazione va bene.\n@c0@"
  ja: "@a@bフローラ「行き先は　あなたに\n\tおまかせします。\n\t私　どこへでも　ついてゆきますわ。\n@c0@"
15:
  de: "@aBianca@bEr war zuerst etwas aggressiv! Ich würde gerne wissen, was es mit diesen Wüstenrosen-Dingern auf sich hat, von denen er gesprochen hat.\n@c0@"
  en: "@aBianca@bHe was a bit aggressive at first! I wonder what them desert roses he was talkin' about are.\n@c0@"
  es: "@aBianca@b¡Al principio ha sido un poco arisco! Me pregunto qué serán esas rosas del desierto de las que hablaba, ¿sabes?\n@c0@"
  fr: "@aBianca@bIl a été un peu agressif, au débutⓠ\nJe me demande à quoi ressemblent\nles roses des sables dont il parlait.\n@c0@"
  it: "@aBianca@bRose del deserto?\nE che cosa sono?\nNon ne ho mai sentito parlare...\n@c0@"
  ja: "@a@bビアンカ「なによ　感じわる～い！\n\tでも　さばくのバラって\n\tなにかしらね。\n@c0@"
16:
  de: "@aNera@bIch glaube, eine Wüstenrose ist ein besonderes Mineral, das man in dieser Gegend finden kann.\n@c0@"
  en: "@aNera@bI think a desert rose is a special kind of mineral you get around these parts.\n@c0@"
  es: "@aNera@bCredo que una rosa del deserto es una especie de mineral autóctono.\n@c0@"
  fr: "@aNera@bJe crois que la rose des sables est une sorte de minéral qu'on trouve dans la région.\n@c0@"
  it: "@aNera@bCredo che le rose del deserto siano delle sculture naturali in sabbia, tipiche di quest'area. Ne ho sentito parlare quando studiavo all'Abbazia...\n@c0@"
  ja: "@a@bフローラ「さばくのバラとは\n\tこのあたりでとれる\n\t鉱物　だったと思いますわ。\n@c0@"
17:
  de: "@aBianca@bEin Museum. Na, das könnte doch Spaß machen!\n@c0@"
  en: "@aBianca@bA museum. That sounds like it could be\r\na bit of a laugh!\n@c0@"
  es: "@aBianca@b¡Un museo! Suena divertido, ¿verdad?\n@c0@"
  fr: "@aBianca@bUn musée. Ça pourrait être drôleⓠ\n@c0@"
  it: "@aBianca@bUn museo?\nNon ho mai incontrato nessuno che volesse mettere in piedi un museo. Mi piacerebbe conoscerlo, quel tizio...\n@c0@"
  ja: "@a@bビアンカ「名産品の博物館って……\n\tそういうのを建てようとした人が\n\tいたんだね。\n@c0@"
18:
  de: "@aNera@bWann der Mann wohl hier war? Dieses Museum würde ich mir gern mal ansehen, wenn es inzwischen erbaut wurde.\n@c0@"
  en: "@aNera@bI wonder how long ago that man was here. I'd quite like to visit the museum if it's been built by now.\n@c0@"
  es: "@aNera@bMe pregunto cuánto hace desde que ese hombre estuvo aquí. Me gustaría visitare el museo si ya lo ha acabado de construir.\n@c0@"
  fr: "@aNera@bJe me demande quand cet homme est passé par ici.\r\nÇa me plaîrait de visiter son musée s'il était construit.\n@c0@"
  it: "@aNera@bIo adoro i musei!\nSe il tipo ne di cui parla ne ha davvero aperto uno, mi piacerebbe visitarlo...\n@c0@"
  ja: "@a@bフローラ「昔って　いつ頃かしら…。\n\t博物館なんて　おもしろそうですわね。\n@c0@"
19:
  de: "@aBianca@bHah! Wir haben unsere eigene Wüstenrose, vielen Dank auch!\n@c0@"
  en: "@aBianca@bHah! We've got a desert rose of our own,\r\nthanks very much!\n@c0@"
  es: "@aBianca@b¡Ja! ¡Nosotros ya tenemos nuestra propia rosa del desierto, pero gracias de todos modos!\n@c0@"
  fr: "@aBianca@bAhⓠ Merci, mais on a déjà notre propre\nrose des sablesⓠ\n@c0@"
  it: "@aBianca@bGrazie, ma abbiamo già la nostra rosa del deserto...\n@c0@"
  ja: "@a@bビアンカ「ふふ～ん。\n\tさばくのバラなら　私たちだって\n\t持ってるもんねっ。\n@c0@"
20:
  de: "@aNera@bWenn er von einer Sammlung spricht, dann muss er wohl sehr viele Wüstenrosen besitzen.\n@c0@"
  en: "@aNera@bHe must have an awful lot of desert roses for him to call it a collection.\n@c0@"
  es: "@aNera@bSi la llama colección, debe de tener muchas rose del deserto.\n@c0@"
  fr: "@aNera@bIl doit avoir un sacré nombre de roses des sables pour parler de ⓥcollectionⓦ.\n@c0@"
  it: "@aNera@bChissà quante rose del deserto possiederà, per dire che ne ha una collezione intera...\n@c0@"
  ja: "@a@bフローラ「あの方は　コレクションと\n\tいえるほど　たくさん　さばくのバラを\n\t集められたのかしら。\n@c0@"
21:
  de: "@aBianca@bBrr. Nachts ist es in der Wüste ganz schön kalt, nicht?\n@c0@"
  en: "@aBianca@bBrrr. It's quite chilly in the desert of a night, eh?\n@c0@"
  es: "@aBianca@bBrrr... Hace un frío que pela en el desierto de noche, ¿eh?\n@c0@"
  fr: "@aBianca@bBrrr. Il fait frisquet dans le désert la nuit.\n@c0@"
  it: "@aBianca@bCerto che il deserto è davvero freddo di notte, eh?\n@c0@"
  ja: "@a@bビアンカ「ううっ…　夜の砂漠って\n\tかなり冷えこむのね。\n@c0@"
22:
  de: "@aBianca@bIch glaub', ich hab mich erkältet. Ich fühle mich ganz fiebrig.\n@c0@"
  en: "@aBianca@bI reckon I might've caught a cold.\r\nI'm feelin' a bit feverish.\n@c0@"
  es: "@aBianca@bCreo que he pillado un resfriado.\r\nMe parece que tengo fiebre, ¿sabes?\n@c0@"
  fr: "@aBianca@bJ'ai dû prendre un coup de froid.\r\nJe me sens un peu fiévreuse.\n@c0@"
  it: "@aBianca@bCredo di essermi buscata un malanno, sai?\nMi sento la febbre...\n@c0@"
  ja: "@a@bビアンカ「カゼひいちゃったかな。\n\tなんだか　熱っぽいかも…。\n@c0@"
23:
  de: "@aNera@bTagsüber glühend heiß und nachts eiskalt. In der Wüste herrschen wirklich extreme Bedingungen.\n@c0@"
  en: "@aNera@bBoiling hot in the day and freezing cold at night.\r\nThe desert is certainly a place of extremes.\n@c0@"
  es: "@aNera@bSole ardiente por el día y frío glacial por la notte.\r\nEl desierto es un lugar extremo, sin duda.\n@c0@"
  fr: "@aNera@bUne chaleur écrasante le jour et un froid glacial la nuit. On peut dire que le désert ne fait jamais dans la demi-mesure.\n@c0@"
  it: "@aNera@bDi giorno fa un caldo pazzesco, e di notte si gela!\nNel deserto le temperature sono sempre estreme...\n@c0@"
  ja: "@a@bフローラ「昼は暑く　夜は寒く…。\n\t砂漠って　なかなか\n\tカコクな所ですわ。\n@c0@"
24:
  de: "@aNera@bPass auf, dass du dich nicht erkältest, ja?\n@c0@"
  en: "@aNera@bTake care not to catch a cold or anything,\r\nwon't you?\n@c0@"
  es: "@aNera@bStai attento, no vayas a acatarrarte, ¿de acuerdo?\n@c0@"
  fr: "@aNera@bFais attention à ne pas prendre froid, d'accordⓡ\n@c0@"
  it: "@aNera@bCaro, copriti bene, altrimenti ti ammalerai!\n@c0@"
  ja: "@a@bフローラ「あなたも　気を\n\tつけてくださらないと\n\tカゼを　ひいてしまいますわよ。\n@c0@"
25:
  de: "@aBianca@bIm Zelt ist es nicht ganz so kalt. Das hat anscheinend auch der Hund gemerkt!\n@c0@"
  en: "@aBianca@bIt's not quite as cold inside the tent. Looks like the dog has that figured out too!\n@c0@"
  es: "@aBianca@bDentro de la tienda no hace tanto frío ni de lejos. ¡Y parece que el perro también lo sabe!\n@c0@"
  fr: "@aBianca@bIl ne fait pas aussi froid à l'intérieur de la tente.\nEt je crois que le chien l'a bien remarqué aussiⓠ\n@c0@"
  it: "@aBianca@bPer fortuna all'interno della tenda non fa molto freddo...\nL'ha capito anche il cane!\n@c0@"
  ja: "@a@bビアンカ「テントの中だと\n\t少しは　寒さが　しのげるね。\n\t犬も　それを　知ってるのかな。\n@c0@"
26:
  de: "@aNera@bDer Hund versucht wohl, den alten Mann zu schützen. Ist das nicht süß?\n@c0@"
  en: "@aNera@bI think that dog's trying to protect the old man,\r\nyou know. Isn't that sweet?\n@c0@"
  es: "@aNera@bCreo que ese cane intenta proteger al anciano. Qué adorabile, ¿verdad?\n@c0@"
  fr: "@aNera@bJ'ai l'impression que ce chien essaie de protéger le vieil homme. C'est mignon, nonⓡ\n@c0@"
  it: "@aNera@bIl cane e il vecchietto si fanno compagnia a vicenda...\nSono proprio carini!\n@c0@"
  ja: "@a@bフローラ「あの犬さん　きっと\n\tここで　おじいさんを\n\t守っているつもりなのね。\n@c0@"
27:
  de: "@aBianca@bEs sieht aus, als kämen hier nicht viele Leute vorbei. Das ist ja auch kein Wunder.\n@c0@"
  en: "@aBianca@bLooks like not many people pass by here.\r\nNot surprisin', really.\n@c0@"
  es: "@aBianca@bParece que no pasa mucha gente por aquí, ¿eh?\r\nNo me sorprende, la verdad.\n@c0@"
  fr: "@aBianca@bOn dirait qu'il n'y a pas grand monde qui passe par ici. Remarque, ça ne m'étonne pas...\n@c0@"
  it: "@aBianca@bNon c'è da essere sorpresi che non capitino molti viaggiatori in questo luogo inospitale!\n@c0@"
  ja: "@a@bビアンカ「そっか…\n\tやっぱり　砂漠に来る人は\n\t少ないんだね。\n@c0@"
28:
  de: "@aBianca@bIch dachte immer, Leute, die so weit von der Zivilisation entfernt leben, wären ein wenig brummig, aber der war ja total nett.\n@c0@"
  en: "@aBianca@bI always thought people who live out in the sticks like this would be a bit unfriendly, but he was lovely.\n@c0@"
  es: "@aBianca@bSiempre había pensado que la gente que vive en el quinto pino como esta sería más bien seca, pero él ha sido muy amable, ¿sabes?\n@c0@"
  fr: "@aBianca@bJ'ai toujours pensé que les gens qui vivaient au milieu de nulle part devaient être un peu revêches, mais il était adorable.\n@c0@"
  it: "@aBianca@bChe gentile!\nA essere sincera, non credevo che ci avrebbe accolti in maniera tanto amichevole, sai?\n@c0@"
  ja: "@a@bビアンカ「へんぴな場所に　住んでる人は\n\tへんくつな人ばかりだと　思ってたけど\n\t親切な人で　良かったわね。\n@c0@"
29:
  de: "@aNera@bHelmunaptra liegt im Westen und König Dominicus' Domäne im Südosten. Das stimmt doch, oder? Ich habe ein ganz schreckliches Richtungsgedächtnis.\n@c0@"
  en: "@aNera@bHelmunaptra to the west and King Dominicus's Dominion to the south-east. That's right, isn't it?\r\nI'm terrible at remembering directions.\n@c0@"
  es: "@aNera@bAyelmandría al oeste y los Dominios de Dominico al sudeste. Es así, ¿verdad?\r\nLa mia orientazione no es muy buona.\n@c0@"
  fr: "@aNera@bHelmunaptra est à l'ouest et le domaine du roi Dominicus au sud-est, c'est bien çaⓡ\nJ'ai vraiment un sens de l'orientation déplorable.\n@c0@"
  it: "@aNera@bIl Regno di Faraonia è a ovest e quello di Minikin a sud-est, dico bene?\nCerchiamo di non dimenticarcene.\n@c0@"
  ja: "@a@bフローラ「西が　テルパドールで\n\t南東が　メダル王…　だったかしら。\n\t私　方角をおぼえるのが　苦手なの。\n@c0@"
30:
  de: "@aNera@bSag du, wo wir hingehen wollen. Ich komme mit, egal wofür du dich entscheidest.\n@c0@"
  en: "@aNera@bYou can decide where to go. I'll go along with whatever you choose.\n@c0@"
  es: "@aNera@bTú decides dónde vamos. Me adaptaré a la tua decisione.\n@c0@"
  fr: "@aNera@bÀ toi de choisir la direction à prendre.\r\nQuelle qu'elle soit, je te suivrai.\n@c0@"
  it: "@aNera@bScegli pure dove andare: per me qualunque destinazione va bene.\n@c0@"
  ja: "@a@bフローラ「行き先は　あなたに\n\tおまかせするわ。\n\t私　どこへでも　ついてゆきますわ。\n@c0@"
31:
  de: "@aNera@bHoppla! Wir haben den alten Mann aufgeweckt. Wir sollten versuchen, ruhig zu sein, damit er ein wenig schlafen kann.\n@c0@"
  en: "@aNera@bOops! We woke that old man up. We should try to be quiet so that he can get some sleep.\n@c0@"
  es: "@aNera@b¡Huy! Hemos despertado a ese anciano. Vamos a intentar guardar silencio para que pueda dormire un po'.\n@c0@"
  fr: "@aNera@bOupsⓠ Nous avons réveillé le vieil homme. Il faudrait faire moins de bruit pour qu'il puisse dormir.\n@c0@"
  it: "@aNera@bCerchiamo di non fare confusione, così non sveglieremo le persone che dormono...\n@c0@"
  ja: "@a@bフローラ「私たち　おじいさんを\n\t起こしてしまいましたわね。\n\tさあ　静かに　寝かせてあげましょう。\n@c0@"
32:
  de: "@aGriselda@bDu weißt, was du zu tun hast, wenn wir zur Oase kommen, nicht?\n@c0@"
  en: "@aDebora@bYou know what you have to do now we're at the oasis, right?\n@c0@"
  es: "@aStefania@bSabrás lo que tienes que hacer ahora que estamos en el oasis, ¿verdad?\n@c0@"
  fr: "@aPandora@bTu sais ce que tu as à faire, maintenant que nous sommes à l'oasis, n'est-ce pasⓡ\n@c0@"
  it: "@aViola@bImmagino che tu sappia cosa devi fare ora che siamo in quest'oasi, vero?\n@c0@"
  ja: "@a@bデボラ「オアシスに着いたんだから\n\tすることは　わかっているわね？\n@c0@"
33:
  de: "@aGriselda@bGenau. Du bringst mir Wasser. Nicht bloß zum Trinken. Waschen will ich mich auch gleich, also sieh zu, dass du genug bringst.\n@c0@"
  en: "@aDebora@bPrecisely. Bring me some water. Not just to drink, either. I'm going to have a wash too, so make sure you bring plenty.\n@c0@"
  es: "@aStefania@bEsattamente. Tráeme acqua. Y no solo para beber. Quiero bañarme, así que ya estás trayendo suficiente, ¿capisci?\n@c0@"
  fr: "@aPandora@bExactement. Apporte-moi de l'eau. Mais pas juste pour boire, hein. Je vais faire un brin de toilette, alors apportes-en en quantité suffisante.\n@c0@"
  it: "@aViola@bEsatto: ho bisogno di acqua. Voglio bere e darmi una bella rinfrescata, quindi non portarmene solo un bicchiere, ma tre o quattro barili. Mi sono spiegata?\n@c0@"
  ja: "@a@bデボラ「そう。　早く水をくんできてちょうだい。\n\tあ　飲むだけじゃなくて　水浴びもするから\n\t多めによろしくね。\n@c0@"
34:
  de: "@aGriselda@bMuss ich dir denn alles erst erklären? Du bringst mir natürlich Wasser! Ich will was trinken!\n@c0@"
  en: "@aDebora@bDo I have to spell everything out for you? You have to bring me some water. I want a drink, of course!\n@c0@"
  es: "@aStefania@b¿Tengo que explicártelo tutto? ¡Que me traigas acqua! ¡Quiero beber!\n@c0@"
  fr: "@aPandora@bIl faut vraiment que je t'explique tout, décidément. Tu dois m'apporter de l'eau. J'ai envie de boire, évidemmentⓠ\n@c0@"
  it: "@aViola@bAh, non lo immagini?\nVoglio dell'acqua!\nTanta acqua!\n@c0@"
  ja: "@a@bデボラ「ニブい男ね　水をくんでくればいいの。\n\tどうしてって……　私が　飲みたいからに\n\t決まってるでしょう！？\n@c0@"
35:
  de: "@aGriselda@bUnd wenn du schon dabei bist, dann sieh zu, dass du reichlich bringst, denn waschen will ich mich auch.\n@c0@"
  en: "@aDebora@bAnd you'd better bring plenty while you're at it, because I'm going to have a wash as well.\n@c0@"
  es: "@aStefania@bY más te vale traer bastante porque pienso darme un bagno.\n@c0@"
  fr: "@aPandora@bEt tant que tu y es, apportes-en plein, parce que\r\nje vais aussi faire un brin de toilette.\n@c0@"
  it: "@aViola@bAnzi, ne voglio tantissima!\nNon voglio solo bere, ma anche darmi una bella rinfrescata. Spero di essermi spiegata...\n@c0@"
  ja: "@a@bデボラ「念のために　言っておくけど\n\t水浴びもしたいから　多めによろしくね。\n@c0@"
36:
  de: "@aGriselda@bEs ist etwas schäbig, aber wenigstens kommen wir hier ein bisschen aus der größten Hitze raus.\n@c0@"
  en: "@aDebora@bIt's a bit shabby, but at least it should give us a bit of respite from the heat.\n@c0@"
  es: "@aStefania@bEs una porquería ma al menos nos aliviará un poco el calore.\n@c0@"
  fr: "@aPandora@bC'est un peu miteux, mais ça devrait au moins\r\nnous soulager un peu de la chaleur.\n@c0@"
  it: "@aViola@bNon è la sistemazione che speravo di trovare, ma basterà per riposare un po' al fresco.\n@c0@"
  ja: "@a@bデボラ「そまつな　テントだけど\n\t少しは　暑さを　しのげそうね。\n@c0@"
37:
  de: "@aGriselda@bWorauf wartest du denn noch, %a000090? Ich geh rein.\n@c0@"
  en: "@aDebora@bWhat are you waiting for, %a000090?\nI'm going in.\n@c0@"
  es: "@aStefania@b¿A qué esperas, %a000090?\nVoy a entrar.\n@c0@"
  fr: "@aPandora@bQu'est-ce que tu attends, %a000090ⓡ\nMoi, j'entre.\n@c0@"
  it: "@aViola@bIo vado, %a000090.\nAllora, vieni anche tu?\n@c0@"
  ja: "@a@bデボラ「何ぼーっとしてるのよ　%a000090。\n\tさっさと　中に入るわよ。\n@c0@"
38:
  de: "@aGriselda@bJetzt wünschte ich, ich hätte meinen Badeanzug dabei. Es wäre schön, da drin ein bisschen rumzuplanschen und mich abzukühlen.\n@c0@"
  en: "@aDebora@bI wish I'd brought my swimming costume now. It would be lovely to have a splash about and cool off.\n@c0@"
  es: "@aStefania@bQué pena no haberme traído el traje di bagno. Estaría genial un chapuzón para refrescarme.\n@c0@"
  fr: "@aPandora@bSi seulement j'avais apporté mon costume de bain.\r\nCe serait vraiment délicieux de faire trempette\r\npour se rafraîchir.\n@c0@"
  it: "@aViola@bMa perché non hai portato il mio costume da bagno?!\nAvrei potuto approfittarne per fare un bel tuffo rinfrescante!\n@c0@"
  ja: "@a@bデボラ「水着を　もってくればよかったわ。\n\tそうすれば　あのオアシスで\n\tおよぐことができたのに。\n@c0@"
39:
  de: "@aGriselda@bUnter all diesem Fell ist es bestimmt unerträglich heiß. Es ist ja für uns schon schlimm genug.\n@c0@"
  en: "@aDebora@bIt must be unbearably hot with all that fur.\r\nIt's bad enough for us.\n@c0@"
  es: "@aStefania@bQué calore debe dar todo ese pelo.\r\nTenemos suerte los humanos.\n@c0@"
  fr: "@aPandora@bLa chaleur doit être insoutenable avec une fourrure pareille. Déjà que c'est dur pour nous...\n@c0@"
  it: "@aViola@bQuel povero cane deve soffrire un caldo infernale... Perché non si fa dare una spuntatina al pelo?\n@c0@"
  ja: "@a@bデボラ「あの　もこもこした毛皮で\n\tここにいるのは　つらそうね。\n\tえ　私？　もちろんイヤよ。\n@c0@"
40:
  de: "@aGriselda@bHier drin ist es kühler, als ich gedacht hätte. Aah, das ist jetzt genau das Richtige. Bringst du mir bitte ein Glas Wasser, %a000090?\n@c0@"
  en: "@aDebora@bIt's cooler in here than I thought it would be.\nAah, just what I needed. Bring me a glass of water, will you, %a000090?\n@c0@"
  es: "@aStefania@bEsto es más fresco de lo que creía.\nJusto lo que necesitaba. Ya me estás trayendo un vaso de acqua, %a000090.\n@c0@"
  fr: "@aPandora@bIl fait plus frais que je ne l'aurais cru, ici. Aaah, juste ce qu'il me fallait. Apporte-moi un verre d'eau, tu veux, %a000090ⓡ\n@c0@"
  it: "@aViola@bNon credevo che qui dentro si stesse tanto bene, sai? C'è proprio un bel freschetto. %0%a000090, che ne diresti di portarmi un bel bicchier d'acqua?\n@c0@"
  ja: "@a@bデボラ「思っていたより　中は　涼しいのね。\n\tなんとか　ひと息　つけそうだわ。\n\tあ　水を１ぱい　おねがいね　%a000090。\n@c0@"
41:
  de: "@aGriselda@bEs klingt so, als würden nicht viele Leute bis hierher gelangen.\n@c0@"
  en: "@aDebora@bIt doesn't sound like many people make it all the way out here.\n@c0@"
  es: "@aStefania@bSembra que no viene mucha gente por aquí.\n@c0@"
  fr: "@aPandora@bOn dirait qu'il y a assez peu de gens qui\r\nviennent jusqu'ici.\n@c0@"
  it: "@aViola@bA occhio e croce, qui non arrivano molti turisti...\nE la cosa non mi stupisce affatto, considerando quant'è desolato questo posto!\n@c0@"
  ja: "@a@bデボラ「こんな所まで来る　物好きは\n\tやっぱり少ないみたいね　%a000090。\n@c0@"
42:
  de: "@aGriselda@bHelmunaptra im Westen... König Dominicus' Domäne im Südosten, stimmt's? Du schreibst es dir besser auf, damit ich mich nicht damit belasten muss.\n@c0@"
  en: "@aDebora@bHelmunaptra to the west... King Dominicus's Dominion to the south-east, right? You'd better write it down so I don't have to bother remembering it.\n@c0@"
  es: "@aStefania@bAyelmandría al oeste... Los Dominios de Dominico al sureste, ¿no? Ya estás apuntándolo tutto, para que no tenga que molestarme en recordarlo.\n@c0@"
  fr: "@aPandora@bHelmunaptra à l'ouest... le domaine du roi Dominicus au sud-est, c'est çaⓡ Tu ferais bien de l'écrire pour que je ne me fatigue pas à m'en souvenir.\n@c0@"
  it: "@aViola@bDunque, il Regno di Faraonia è a ovest e quello di Minikin si trova a sud-est. Prendi appunti, così non dovrò sforzarmi di ricordarmene, caro.\n@c0@"
  ja: "@a@bデボラ「西にお城…　南東にメダル王の島　ね。\n\tちゃんとメモしておくのよ　%a000090。\n\tそうすれば　私が覚える必要はないから。\n@c0@"
43:
  de: "@aGriselda@bEin Museum? Irgendwie machen mich Museen immer so schläfrig.\n@c0@"
  en: "@aDebora@bA museum? For some reason, I always seem to get very drowsy whenever I visit museums.\n@c0@"
  es: "@aStefania@b¿Un museo? No sé por qué, ma en cuanto entro en un museo me entra sogno.\n@c0@"
  fr: "@aPandora@bUn muséeⓡ Je ne sais pas pourquoi, mais j'ai toujours tendance à somnoler quand j'en visite un.\n@c0@"
  it: "@aViola@bI musei sono una vera barba... Non avrai intenzione di cercare il tipo che vuole fondarne uno, eh?!\nDev'essere una persona terribilmente noiosa!\n@c0@"
  ja: "@a@bデボラ「博物館　ね……\n\t私　ああいう場所に行くと\n\tどういうわけか　眠くなるのよね。\n@c0@"
44:
  de: "@aGriselda@bSeine Art, die Leute zu begrüßen, lässt etwas zu wünschen übrig. Was für ein Rüpel!\n@c0@"
  en: "@aDebora@bHis way of greeting people certainly leaves a lot to be desired. What a yob!\n@c0@"
  es: "@aStefania@bDesde luego, su forma de saludar deja que desear. ¡Sbarbatello!\n@c0@"
  fr: "@aPandora@bSa façon d'accueillir les gens laisse beaucoup\nà désirer. Quelle bruteⓠ\n@c0@"
  it: "@aViola@bA momenti nemmeno ci salutava, desideroso com'era di parlarci della sua collezione di rose del deserto.\n@c0@"
  ja: "@a@bデボラ「こういう　言い方をする人って\n\t本当は　見せたくて　たまらないのよね。\n@c0@"
45:
  de: "@aGriselda@bIch wette, er hätte uns liebend gerne seine ach so tolle Sammlung gezeigt. Tja, ich will sie aber gar nicht sehen, ätsch bätsch!\n@c0@"
  en: "@aDebora@bI bet he was actually desperate to show off his collection. Well, I don't want to see it, so there!\n@c0@"
  es: "@aStefania@bSeguro que estaba disperatto por mostrar su colección. ¡Pues yo no pienso verla!\n@c0@"
  fr: "@aPandora@bJe parie qu'il avait désespérément envie de montrer sa collection. Mais je n'ai pas envie de la voir, naⓠ\n@c0@"
  it: "@aViola@bBeh, con me capita male! Quella roba non m'interessa affatto! Preferisco abiti e gioielli, io.\nNon so cosa farmene dei suoi fiori di sabbia.\n@c0@"
  ja: "@a@bデボラ「すなおに　見てください　って\n\t言えばいいのに。\n\t私は　別に　見たいとも思わないけど。\n@c0@"
