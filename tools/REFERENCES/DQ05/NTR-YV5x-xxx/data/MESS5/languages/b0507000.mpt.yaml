  ja: "@a@bデボラ「すなおに　見てください　って\n\t言えばいいのに。\n\t私は　別に　興味ないけど。\n@c0@"
48:
  de: "@aGriselda@bEs wird allmählich kalt. In der Wüste gibt's kein angenehmes Dazwischen, was? Es ist entweder zu heiß oder zu kalt.\n@c0@"
  en: "@aDebora@bIt's getting cold now. There's no happy medium in the desert, is there? You're either too hot or too cold.\n@c0@"
  es: "@aStefania@bEmpieza a hacer frío. ¿No hay término medio en el deserto, o te asas o te hielas?\n@c0@"
  fr: "@aPandora@bIl commence à faire froid, maintenant.\nIl n'y a pas de juste milieu, dans le désert, heinⓡ\nOn a ou trop chaud, ou trop froid.\n@c0@"
  it: "@aViola@bNel deserto non esistono le mezze misure: o si muore di caldo, o si battono i denti per il troppo freddo!\n@c0@"
  ja: "@a@bデボラ「空気が　冷たくなってきたわね。\n\t暑くなったり　寒くなったり……\n\t砂漠って　ハンパじゃないわ。\n@c0@"
49:
  de: "@aGriselda@bAlso sei besser schön vorsichtig, %a000090. Nicht, dass ich mich noch erkälte oder so.\n@c0@"
  en: "@aDebora@bSo you'd better take care, %a000090. Make sure you don't let me catch a cold or anything.\n@c0@"
  es: "@aStefania@bTú verás, %a000090, como se te ocurra permitir que pille una infreddatura.\n@c0@"
  fr: "@aPandora@bTu vas devoir faire attention, %a000090. Ne me laisse surtout pas attraper un rhume, comprisⓡ\n@c0@"
  it: "@aViola@b%0%a000090, fai in modo che io sia sempre vestita in maniera adeguata: non te lo perdonerei, se dovessi prendermi un'insolazione o un'infreddatura!\n@c0@"
  ja: "@a@bデボラ「だから　%a000090も\n\t気をつけなさいよ。\n\t私に　カゼを　ひかせないようにね。\n@c0@"
50:
  de: "@aGriselda@bWie es wohl Bingo geht? Er hatte immer gern Gesellschaft. Ein bisschen wie ich eigentlich. Vielleicht ist er einsam...\n@c0@"
  en: "@aDebora@bI wonder how Bingo's getting on. He always liked to have company. A bit like me, really. Maybe he's lonely...\n@c0@"
  es: "@aStefania@b¿Cómo le irá a Bingo? Siempre le gustó la compañía. Como a mí. Quizá se sienta solo.\n@c0@"
  fr: "@aPandora@bJe me demande comment va Bingo. Il a toujours aimé avoir de la compagnie. Un peu comme moi, en fait. Peut-être qu'il se sent seul...\n@c0@"
  it: "@aViola@bChissà se Bingo si sente solo, ora che non sono più a casa a fargli compagnia. Beh, non è che gli dedicassi molte attenzioni, quand'ero a Mostroferrato...\n@c0@"
  ja: "@a@bフローラ「リリアンは　どうしているかしら。\n\t私と同じで　さみしがりやだったけど\n\t泣いていたり　しないかしら……。\n@c0@"
51:
  de: "@aGriselda@bTut dir leid? Ha! Ach was! Mir geht's gut. Ich bin ja nicht mehr allein. Du läufst mir doch dauernd vor den Füßen rum.\n@c0@"
  en: "@aDebora@bSorry? Ha! No, I'm fine. I'm not lonely any more.\r\nHow could I be, with you always hanging around?\n@c0@"
  es: "@aStefania@b¿Scusi? ¡Ja! No, estoy bene. Ya no me siento sola.\r\n¿Cómo, si estás todo el día pegado a mí como una mosca cavallina?\n@c0@"
  fr: "@aPandora@bPardonⓡ Pfff, mais non, ça va. Je ne me sens plus seule. Comment je pourrais l'être alors que tu es toujours pendu à mes basquesⓡ\n@c0@"
  it: "@aViola@bIo, invece, ho chi mi dedica tutte le attenzioni di cui ho bisogno: il mio caro maritino, che è sempre accanto a me, pronto a esaudire tutti i miei desideri.\n@c0@"
  ja: "@a@bフローラ「え？　あら　大丈夫ですわ。\n\t今の私は　さびしくありません。\n\tだって　あなたが　いてくれますもの。\n@c0@"
52:
  de: "@aGriselda@bDer Hund versucht, den Alten zu schützen, nicht? Das gefällt mir an Hunden: Sie gehorchen ihrem Herrn aufs Wort.\n@c0@"
  en: "@aDebora@bThis dog's trying to protect the old man, isn't he? That's what I like about dogs: they always obey their masters.\n@c0@"
  es: "@aStefania@bEl perro intenta proteger al vecchio, ¿no? Eso es lo que me gusta de los perros y de ti: obedecéis al capo.\n@c0@"
  fr: "@aPandora@bLe chien essaie de protéger le vieil homme, nonⓡ\nC'est ce que j'aime, chez les chiensⓢ ils obéissent toujours à leur maître.\n@c0@"
  it: "@aViola@bNon amo particolarmente i cani, ma riconosco che sono animali docili, fedeli e ubbidienti. È così che ogni uomo dovrebbe dimostrarsi verso la propria moglie...\n@c0@"
  ja: "@a@bデボラ「この犬　あのおじいさんを\n\t守っているのね。　いいわよね　犬って。\n\t主人に絶対服従で。\n@c0@"
53:
