  ja: "@a@bデボラ「こういう　言い方をする人って\n\t本当は　見せたくて　たまらないのよね。\n@c0@"
47:
  de: "@aGriselda@bIch wette, er hätte uns liebend gerne seine ach so tolle Sammlung gezeigt. Tja, mir ist die aber schnurz, ätsch bätsch!\n@c0@"
  en: "@aDebora@bI bet he was actually desperate to show off his collection. Well, I'm not interested, so there!\n@c0@"
