0:
  de: "@aBianca@bEs ist ja nett, dass du mich überall herumführst, aber eigentlich haben wir dafür doch gar keine Zeit, oder?\n@c0@"
  en: "@aBianca@bIt's nice that you're showin' me around lots of places, but we en't really got time for this, have we?\n@c0@"
  es: "@aBianca@bEstá muy bien que me lleves de paseo por tantos sitios, pero no tenemos tiempo para esto, ¿sabes?\n@c0@"
  fr: "@aBianca@bC'est gentil de me faire visiter plein d'endroits différents, mais on n'a pas vraiment le temps\npour ça, nonⓡ\n@c0@"
  it: "@aBianca@bMi piace che tu mi porti in giro e mi mostri tanti bei posti, ma temo che non abbiamo tempo per fare i turisti, sai?\n@c0@"
  ja: "@a@bビアンカ「私に　いろんな場所を\n\t見せてくれるのは　うれしいんだけど…\n\t今は　あまり　ゆっくりできないわよ。\n@c0@"
1:
  de: "@aBianca@bEs ist einfach wunderbar, wieder gemeinsam herumlaufen zu können.\n@c0@"
  en: "@aBianca@bIt's amazin' to be able to walk around together again like this.\n@c0@"
  es: "@aBianca@bEs increíble poder volver a viajar juntos.\n@c0@"
  fr: "@aBianca@bC'est incroyable de pouvoir se promener de nouveau ensemble, comme ça.\n@c0@"
  it: "@aBianca@bDopo essere rimasta per tanti anni al buio, poter camminare nuovamente alla luce del sole mi sembra una conquista meravigliosa...\n@c0@"
  ja: "@a@bビアンカ「こうして　また　%a000090と\n\tいっしょに　歩けるなんてね。\n@c0@"
2:
  de: "@aBianca@bNach all den Jahren, in denen ich nicht das kleinste bisschen Tageslicht zu Gesicht bekommen habe!\n@c0@"
  en: "@aBianca@bAfter all those years of not even gettin' a glimpse of daylight!\n@c0@"
  es: "@aBianca@b¡Después de tantos años sin ver la luz del día!\n@c0@"
  fr: "@aBianca@bAprès toutes ces années passées sans même apercevoir la lumière du jourⓠ\n@c0@"
  it: "@aBianca@bCerte cose ci sembrano scontate, e ci accorgiamo di quanto sono importanti solo quando siamo costretti a farne a meno...\n@c0@"
  ja: "@a@bビアンカ「だって　私は　何年も\n\t空すら　見られなかったんだもの。\n@c0@"
3:
  de: "@aNera@bSelbst wenn wir an einen Ort kommen, wo wir schon mal gewesen sind, ist es irgendwie ganz anders als früher.\n@c0@"
  en: "@aNera@bEven when we visit somewhere we've been before,\r\nit has a different feel to it now.\n@c0@"
  es: "@aNera@bIncluso cuando visitamos algún lugar que ya conocemos, la sesazione es distinta ahora.\n@c0@"
  fr: "@aNera@bMême quand nous retournons dans des endroits\r\noù nous étions déjà venus, tout semble différent.\n@c0@"
  it: "@aNera@bTesoro, quando andiamo nei posti che abbiamo già visitato, mi sembrano diversi da come li ricordavo...\nHai anche tu questa sensazione?\n@c0@"
  ja: "@a@bフローラ「前に　見たことのある\n\t景色を見ても　あの頃とは\n\t感じ方が　ちがうような気がしますの。\n@c0@"
4:
  de: "@aNera@bVielleicht gehört das zum Älterwerden.\n@c0@"
  en: "@aNera@bMaybe that's part of getting older.\n@c0@"
  es: "@aNera@bVeramente, quizá sea porque nos estamos haciendo mayores.\n@c0@"
  fr: "@aNera@bC'est peut-être ça aussi, vieillir.\n@c0@"
  it: "@aNera@bLe cose cambiano, e quando non sono loro a mutare, sono le nostre sensazioni a essere differenti...\n@c0@"
  ja: "@a@bフローラ「これって　やっぱり\n\t年を　とったってことかしら……。\n@c0@"
5:
  de: "@aNera@bIch freue mich wirklich, dass du mich an so viele verschiedene Orte führst, Liebling.\n@c0@"
  en: "@aNera@bI'm really happy that you're taking me to lots of different places, darling.\n@c0@"
  es: "@aNera@bSono molto felice de que me lleves a tantos sitios distintos, caro mio.\n@c0@"
  fr: "@aNera@bJe suis vraiment heureuse que tu me fasses visiter plein d'endroits, mon chéri.\n@c0@"
  it: "@aNera@bTesoro, sono così felice che mi porti in giro per il mondo!\n@c0@"
  ja: "@a@bフローラ「いろいろな場所へ\n\tつれてきてくださるのは\n\tうれしいんですけど……\n@c0@"
6:
  de: "@aNera@bAber vielleicht sollten wir uns doch lieber auf das Wesentliche konzentrieren.\n@c0@"
  en: "@aNera@bBut I think perhaps we should focus on the\r\ntask at hand.\n@c0@"
  es: "@aNera@bPero quizás deberíamos centrarnos en la nostra misión.\n@c0@"
  fr: "@aNera@bMais je me dis que nous devrions peut-être nous concentrer sur notre mission actuelle.\n@c0@"
  it: "@aNera@bMa non credi che dovremmo concentrarci sulla nostra missione?!\nGuarda che il tempo stringe!\n@c0@"
  ja: "@a@bフローラ「今は　先を　急いだほうが\n\t良さそうですわ。\n@c0@"
7:
  de: "@a%0%a001240@bDu kennst dich aber auch überall aus, Papa, was?\n@c0@"
  en: "@a%0%a001240@bYou know your way around loads of different places, don't you, Dad?\n@c0@"
  es: "@a%0%a001240@bSabes ir a un montón de sitios, ¿verdad, papi?\n@c0@"
  fr: "@a%0%a001240@bTu connais tout un tas d'endroits différents,\nhein, papaⓡ\n@c0@"
  it: "@a%0%a001240@bPapà, è incredibile!\nTu conosci tutti i posti del mondo, e anche qualcuno in più!\n@c0@"
  ja: "@a@b%a001240「お父さんって　本当に\n\tいろんな場所　知ってるんだね。\n@c0@"
8:
  de: "@a%0%a001240@bWir sind viel herumgekommen, als wir dich und Mama gesucht haben.\n@c0@"
  en: "@a%0%a001240@bWe travelled a lot when we were looking for you\nand Mum.\n@c0@"
  es: "@a%0%a001240@bCuando estábamos buscándoos a ti y a mamá viajamos un montonazo.\n@c0@"
  fr: "@a%0%a001240@bOn a beaucoup voyagé quand on vous cherchait, maman et toi.\n@c0@"
  it: "@a%0%a001240@bQuando cercavamo te e la mamma, io, %a001250 e lo zio Sancho abbiamo visitato un mucchio di posti!\nCredevo di aver esplorato il mondo intero!\n@c0@"
  ja: "@a@b%a001240「お父さんたちを　さがして\n\tけっこう　旅したんだけどなあ……\n@c0@"
9:
  de: "@a%0%a001240@bIch hätte nicht gedacht, dass es tatsächlich noch Orte gibt, an denen ich noch nicht war. Ist das aufregend!\n@c0@"
  en: "@a%0%a001240@bI didn't think there was anywhere left I hadn't been to. It's pretty exciting!\n@c0@"
  es: "@a%0%a001240@bCreía que ya había estado en todos lados. ¡Esto es muy emocionante!\n@c0@"
  fr: "@a%0%a001240@bJe ne pensais pas qu'il existait encore des lieux où\nje n'avais jamais mis les pieds. C'est très excitantⓠ\n@c0@"
  it: "@a%0%a001240@bInvece ora mi rendo conto che ci sono tanti luoghi dove ancora non ero stato...\n@c0@"
  ja: "@a@b%a001240「まだ　ボクの\n\t知らない場所が　あったなんて。\n\tわくわく　しちゃうよ！\n@c0@"
10:
  de: "@a%0%a001250@bHach! Ich bin ja so froh! Es ist wirklich schön, dass du uns überall herumführst.\n@c0@"
  en: "@a%0%a001250@bYay! I'm so happy. It's really nice that you take us to all sorts of places with you.\n@c0@"
  es: "@a%0%a001250@b¡Sí! ¡Qué contenta estoy! Está genial que nos lleves a ver todo tipo de sitios.\n@c0@"
  fr: "@a%0%a001250@bYoupiⓠ Je suis si contente. C'est vraiment chouette que tu nous emmènes dans toutes sortes d'endroits avec toi.\n@c0@"
  it: "@a%0%a001250@bPapà, sono troppo contenta di viaggiare con te!\nÈ un'esperienza bellissima!\n@c0@"
  ja: "@a@b%a001250「えへへ…　うれしいの。\n\tお父さんが　どんな場所にでも\n\tわたしのこと　つれてきてくれるから。\n@c0@"
11:
  de: "@a%0%a001250@bIch fühl' mich immer ganz komisch, wenn's irgendwo dunkel ist. Oder ganz weit oben. Und eigentlich auch, wenn's irgendwo heiß ist.\n@c0@"
  en: "@a%0%a001250@bI'm not very good in dark places. Or high places.\nOr hot places, actually.\n@c0@"
  es: "@a%0%a001250@bNo me gustan mucho los sitios oscuros. Ni las alturas.\nNi que haga mucho calor, la verdad.\n@c0@"
  fr: "@a%0%a001250@bJe ne suis pas trop faite pour les endroits où il fait noir. Ni ceux où il fait trop chaud. Ni ceux qui sont en hauteur, d'ailleurs.\n@c0@"
  it: "@a%0%a001250@bNon mi piacciono i luoghi bui.\nE nemmeno quelli caldi.\nQuelli troppo in alto, poi, li odio proprio!\n@c0@"
  ja: "@a@b%a001250「くらいところも　高いところも\n\t暑いところも　苦手だけど……\n@c0@"
12:
  de: "@a%0%a001250@bAber ich möchte trotzdem gern weiter mit dir herumreisen!\n@c0@"
  en: "@a%0%a001250@bBut I'd still like to keep on travelling with you!\n@c0@"
  es: "@a%0%a001250@bPero aún así, me gustaría seguir viajando contigo.\n@c0@"
  fr: "@a%0%a001250@bMais j'aimerais quand même bien continuer à voyager avec toiⓠ\n@c0@"
  it: "@a%0%a001250@bPerò quando sto con te mi faccio coraggio e cerco di vincere le mie paure, così posso andare ovunque ci conduca la nostra ricerca...\n@c0@"
  ja: "@a@b%a001250「それでも　お父さんと\n\tずっと　いっしょに　旅したいです。\n@c0@"
13:
  de: "@aSancho@bSiehst du, Chico? %0%a001240 und %a001250, sie sind wunderbare Kinder, no?\n@c0@"
  en: "@aSancho@bEsee, friend?\n%0%a001240 and %a001250, they are fine children, no?\n@c0@"
  es: "@aSancho@b¿Ves, chamaco?\n%0%a001240 y %a001250 son unos chamaquitos padrísimos ¿no?\n@c0@"
  fr: "@aSancho@bTu v-vois, chicoⓡ %0%a001240 et %a001250, ce sont de g-gentils enfants, noⓡ\n@c0@"
  it: "@aSancho@bChico, %a001240 y %a001250 sono dos niños muy coraggiosos...\n@c0@"
  ja: "@a@bサンチョ「しかし　坊っちゃん。\n\t%a001240さまも　%a001250さまも\n\tいい子に　育ったでしょう？\n@c0@"
14:
  de: "@aSancho@bDein Onkel Sancho hat so viel Glück. Erst sehe iss diss zu einem großen starken Macho-Mann heranwachsen. Und nun sehe iss auch deine Kinder heranwachsen.\n@c0@"
  en: "@aSancho@bYour Uncle Sancho, he ees eso lucky.\r\nFirst, I esee you grow eento the estrong, macho man.\r\nAnd now, I watch your children grow too.\r\n@c0@"
  es: "@aSancho@bTu tito sancho es reteafortunado.\nPrimero, pues te vi convertirte en el mero mero.\nY ahora veo a tus hijos crecer.\n@c0@"
  fr: "@aSancho@bTonton Sancho a b-b-beaucoup de chance. D'abord, je t'ai vu devenir oun hombre fort et c-c-costaud. Et maintenant, je vois aussi g-grandir tes niños.\n@c0@"
  it: "@aSancho@b¡Se vede que sono tuos figlios!\nEhm, tuos y de %a001230, naturalmentes...\n@c0@"
  ja: "@a@bサンチョ「こうして　坊っちゃん……いえ\n\t%a000090王と　そのお子まで\n\tお育てできるなんて……　うっうっ。\n@c0@"
15:
  de: "@aSancho@bUf! Sie ist so groß, die Welt! Jetzt, mit dir zusammen, Meine Majestät, gibt es so viele Orte, wo wir hingehen können.\n@c0@"
  en: "@aSancho@bUf! Ees eso beeg, the world. Now we are together weeth you, My Majesty, ees eso many places we can go.\n@c0@"
  es: "@aSancho@b¡Ay, caramba! El mundo es tan grande.\nAhorita que estamos todos juntos, Majestad, hay tantos lugares que podemos visitar.\n@c0@"
  fr: "@aSancho@bPfiouⓠ Le monde est si g-grand. Maintenant qu'on est avec toi, Ma Majesté, il y a tellement d'endroits où on p-p-peut aller.\n@c0@"
  it: "@aSancho@b¡El mundo es muy grande, ma cuando te cercavamo y no te trovavamo en nessun luego, me pareva addiritturas esconfinato!\n@c0@"
  ja: "@a@bサンチョ「いや～　世界は　広いですねえ。\n\t%a000090王と　いっしょだと\n\t行ける場所が　どんどん広がります。\n@c0@"
16:
  de: "@aOtto@bIch möcht' mir g'schwind ein paar Notizen machen, bevor ich alles vergess'. Ich hab nämlich vor, meine Memoiren zu schreiben, wisst Ihr.\n@c0@"
  en: "@aTuppence@bI must just jot down a memo about this place before I forget about it. I want to include everything in my autobiography, you see.\n@c0@"
  es: "@aAlazar@bTengo que escribir unas notas sobre este sitio antes de que se me olvide. Es que lo quiero incluir todo en mi autobiografía, ¿sabéis?\n@c0@"
  fr: "@aInnocent@bJe dois juste prendre quelques notes sur cet endroit avant d'oublier. Je tiens à ce que mon autobiographie soit la plus complète possible, voyez-vous.\n@c0@"
  it: "@aSimon@bDevo annotare i nomi e le caratteristiche salienti di tutti i luoghi che visito, altrimenti la mia autobiografia risulterà lacunosa.\n㈡\nHo già scelto come intitolarla, Maestà.\nⓕLa grande avventura del prode Simonⓖ.\nBello, nevvero?\n@c0@"
  ja: "@a@bピピン「忘れないうちに　この場所のことを\n\tメモしとかなくちゃ……。\n\t自伝を書くのに　必要ですからねっ！\n@c0@"
17:
  de: "@aBianca@bDieser Turm... Natürlich erinnere ich mich an ihn. Wie könnte ich den vergessen?\n@c0@"
  en: "@aBianca@bThis tower... Of course I remember it.\r\nHow could I possibly forget?\n@c0@"
  es: "@aBianca@bEsta torre... Claro que la recuerdo.\n¿Cómo la iba a olvidar?\n@c0@"
  fr: "@aBianca@bCette tour... Bien sûr que je m'en rappelle.\nComment pourrais-je l'oublierⓡ\n@c0@"
  it: "@aBianca@bQuesta torre...\nAh, ma certo.\nCome potrei dimenticarla...?\n@c0@"
  ja: "@a@bビアンカ「この塔……。\n\tええ　もちろん　おぼえてるわ。\n\t忘れるわけないじゃない……。\n@c0@"
18:
  de: "@aBianca@bWieso bringst du uns ausgerechnet zu diesem Turm?\n@c0@"
  en: "@aBianca@bHow come you brought us to this tower of all places?\n@c0@"
  es: "@aBianca@b¿Per que nos has traído a esta torre con tutti los sitios que hay?\n@c0@"
  fr: "@aBianca@bPourquoi nous as-tu amenés dans cet endroit, exactementⓡ\n@c0@"
  it: "@aBianca@bCome mai siamo venuti proprio qui?\n@c0@"
  ja: "@a@bビアンカ「ねえ　%a000090。\n\tよりによって　この塔に\n\t来るなんて　どういうつもり？\n@c0@"
19:
  de: "@aNera@bHier war es... Ich würde lieber vergessen, dass es diesen Ort je gegeben hat.\n@c0@"
  en: "@aNera@bHere... I'd rather forget this place ever existed.\n@c0@"
  es: "@aNera@bAquí... Veramente, preferiría olvidar que este lugar existió.\n@c0@"
  fr: "@aNera@bHum... J'aurais préféré oublié l'existence même\r\nde cet endroit.\n@c0@"
  it: "@aNera@bQuesto posto...\nUhm...\nL'avevo completamente cancellato dalla memoria.\n@c0@"
  ja: "@a@bフローラ「ここは……\n\t思い出したくもない場所ですわ……。\n@c0@"
20:
  de: "@aNera@bAber man sollte solche Erlebnisse wohl nicht einfach so verdrängen. Die Erinnerung an schwere Zeiten spornt uns an, Großes zu tun, so wie jetzt.\n@c0@"
  en: "@aNera@bBut I suppose it would be wrong to forget. It's difficult memories like that that spur us on to do what we're doing now.\n@c0@"
  es: "@aNera@bMa credo que estaría mal olvidar. Son los malos recuerdos los que veramente nos dan fuerzas para la nostra empresa.\n@c0@"
  fr: "@aNera@bMais ça ne serait pas bien, d'oublier. Ce sont\r\nles souvenirs pénibles tels que celui-là qui\r\nnous poussent à mener à bien notre mission.\n@c0@"
  it: "@aNera@bForse è stato un bene che me ne sia ricordata. Sono proprio i ricordi più dolorosi quelli che ci spingono ad andare avanti quando il cammino si fa difficile...\n@c0@"
  ja: "@a@bフローラ「でも　忘れてはいけないのよね。\n\tあの時の　つらい気持ちがあるからこそ\n\t今　こうして　がんばれるのですわ。\n@c0@"
21:
  de: "@aNera@bKönnen wir jetzt gehen, Liebling? Ich glaube, hier haben wir uns jetzt lange genug aufgehalten.\n@c0@"
  en: "@aNera@bIs it alright if we leave now, darling? I think we've been here long enough.\n@c0@"
  es: "@aNera@b¿Podemos irnos ya, caro mio? Ya hemos pasado tiempo suficiente aquí.\n@c0@"
  fr: "@aNera@bÇa t'ennuie si nous partons maintenant, mon chériⓡ Je crois que nous avons passé suffisamment de temps ici.\n@c0@"
  it: "@aNera@bCaro, che ne diresti di andare?\nNon credi che siamo rimasti qui anche troppo a lungo?\n@c0@"
  ja: "@a@bフローラ「さあ　もう　行きましょう。\n\tあなた……。\n@c0@"
22:
  de: "@a%0%a001240@bMir gefällt die Atmosphäre hier gar nicht. Ich glaube, ich kann sogar Blut an den Wänden riechen. Urgh!\n@c0@"
  en: "@a%0%a001240@bI don't like the feel of this place. I think I can even smell blood on the walls. Urgh!\n@c0@"
  es: "@a%0%a001240@bEste sitio no me da buena espina. Creo que hasta se puede oler la sangre en los muros. ¡Agh!\n@c0@"
  fr: "@a%0%a001240@bJe n'aime pas l'atmosphère de cet endroit.\nJ'ai l'impression de pouvoir sentir l'odeur\ndu sang sur les murs. Beurkⓠ\n@c0@"
  it: "@a%0%a001240@bQuesto posto non mi piace affatto...\nSembra che le pareti siano impregnate di sangue...\n@c0@"
  ja: "@a@b%a001240「いやな感じがする。\n\t血のにおいが　カベに\n\tこびりついてるみたいだ……。\n@c0@"
23:
  de: "@a%0%a001240@bÜber diesen Ort weiß ich Bescheid. Hier seid ihr beide, Mama und du, in Stein verwandelt worden.\n@c0@"
  en: "@a%0%a001240@bI know about this place. This is where you and Mum were turned into stone.\n@c0@"
  es: "@a%0%a001240@b¡Sé dónde estamos! Aquí fue donde a mamá y a ti os convirtieron en estatuas.\n@c0@"
  fr: "@a%0%a001240@bJe connais cet endroit. C'est ici que maman et toi avez été transformés en statues de pierre.\n@c0@"
  it: "@a%0%a001240@bSo tutto di questo luogo.\nÈ qui che tu e la mamma foste trasformati in statue...\n@c0@"
  ja: "@a@b%a001240「うん。　知ってるよ。\n\tここで　お父さんとお母さんが\n\t石にされて　それで……。\n@c0@"
24:
  de: "@a%0%a001240@b...\n@c0@"
  en: "@a%0%a001240@b............\n@c0@"
  es: "@a%0%a001240@b...\n@c0@"
  fr: "@a%0%a001240@b............\n@c0@"
  it: "@a%0%a001240@b...\n@c0@"
  ja: "@a@b%a001240「…………………。\n@c0@"
25:
  de: "@a%0%a001250@bIch fühle mich hier gar nicht wohl.\nIch glaube, mir wird gleich schlecht.\n@c0@"
  en: "@a%0%a001250@bI feel a bit funny in this place.\nI think I'm going to be sick...\n@c0@"
  es: "@a%0%a001250@bNo me encuentro muy bien.\nCreo que voy a vomitar...\n@c0@"
  fr: "@a%0%a001250@bJe me sens un peu bizarre, ici. Je crois que je vais être malade...\n@c0@"
  it: "@a%0%a001250@bPapà, questa torre mi fa venire la nausea...\nMi sento male...\n@c0@"
  ja: "@a@b%a001250「ここにいると\n\tなんだか　気持ちわるい……。\n\tはきそうに…　なっちゃう……。\n@c0@"
26:
  de: "@a%0%a001250@bKönnen wir von hier weggehen, Papa? Hier gefällt's mir nicht.\n@c0@"
  en: "@a%0%a001250@bCan we get out of here, Dad? I don't like it.\n@c0@"
  es: "@a%0%a001250@b¿Podemos irnos, papi? No me gusta.\n@c0@"
  fr: "@a%0%a001250@bEst-ce qu'on peut sortir d'ici, papaⓡ\nJe n'aime pas cet endroit.\n@c0@"
  it: "@a%0%a001250@bPapà, andiamocene...\nHo una bruttissima sensazione...\n@c0@"
  ja: "@a@b%a001250「お父さん　はやく出よう？\n\tここに　いたくないの……。\n@c0@"
27:
  de: "@aSancho@bAls iss zuvor mit den Soldaten zu diesem Turm kam, war niemand hier.\n@c0@"
  en: "@aSancho@bWhen I came here before weeth the esoldiers to thees tower, there was no one here.\n@c0@"
  es: "@aSancho@bCuando vine con la guardia a esta torre, no había nadie.\n@c0@"
  fr: "@aSancho@bQuand je suis v-venu dans cette t-tour autrefois, avec les s-s-soldats, il n'y avait personne.\n@c0@"
  it: "@aSancho@bChico, cuando venni en esta torre con los soldados, aquí no ce estava nessunos...\n@c0@"
  ja: "@a@bサンチョ「兵士たちを　連れて\n\tこの塔に　やって来たときには\n\tもう　誰もいませんでした。\n@c0@"
28:
  de: "@aSancho@bWenn wir in dieser Nacht nisst diese Fiesta gefeiert hätten... Wenn wir nisst getrunken hätten...\n@c0@"
  en: "@aSancho@bThat night, eef we no have thees fiesta...\nEef we no dreenk...\n@c0@"
