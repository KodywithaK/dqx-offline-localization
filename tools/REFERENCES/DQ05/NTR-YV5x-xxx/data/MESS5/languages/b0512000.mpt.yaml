  ja: "@a@bビアンカ「さっそく常連のお客さんが\n\tできたみたい。　よかった。\n@c0@"
455:
  de: "@aNera@bEs ist unsere Aufgabe, ein Museum zu erschaffen, in dem es nicht langweilig wird, so dass die Leute jeden weiteren Besuch genauso genießen wie den ersten.\n@c0@"
  en: "@aNera@bIt's our job to create a museum that's never dull,\r\nso that people can come time and again and still\r\nenjoy it just as much as they did the first time.\n@c0@"
  es: "@aNera@bEs il nostro deber crear un museo que no aburra, para que la gente venga una y otra vez y siga disfrutándolo como la prima volta.\n@c0@"
  fr: "@aNera@bC'est notre travail de créer un musée qui ne soit jamais ennuyeux, afin que les gens y reviennent\r\net en profitent chaque fois comme la première.\n@c0@"
  it: "@aNera@bIl mio sogno è rendere questo Museo un luogo che i visitatori apprezzino dalla prima all'ultima sala, e in cui vogliano tornare più e più volte.\n@c0@"
  ja: "@a@bフローラ「何度来ていただいても\n\tあきることのない　博物館に\n\tしていかなくては　いけませんね。\n@c0@"
456:
  de: "@a%0%a001240@bKlasse! Unser Firlefanzeum gefällt ihm. Also ist es gut, wie wir die Ausstellungsstücke arrangiert haben.\n@c0@"
  en: "@a%0%a001240@bExcellent! He loves our knick-knackatory. That means the way the exhibits are laid out must be good too.\n@c0@"
