  it: "@a%0%a001240@bSe quel tipo è tanto entusiasta, vuol dire che gli piacciono sia gli oggetti sia il modo in cui sono stati esposti, vero?\n@c0@"
  ja: "@a@b%a001240「ここの博物館　気にいって\n\tくれたんだね。　きっと名産品の\n\t展示のしかたが　よかったんだよ。\n@c0@"
457:
  de: "@a%0%a001250@bDas kommt daher, dass die Stücke alle so gut gemacht sind. Darum wird es nie langweilig, egal wie oft man sie sich anschaut.\n@c0@"
  en: "@a%0%a001250@bIt's because the exhibits are all so well-made. That's why it never gets boring, no matter how many times you look at them.\n@c0@"
  es: "@a%0%a001250@bEs porque las cosinas están tan bien hechas. Por eso nunca se aburre uno, aunque las vea muchas veces.\n@c0@"
  fr: "@a%0%a001250@bC'est parce que les objets exposés sont de grande qualité. C'est pour ça que ça n'est jamais ennuyeux, même si on les regarde plusieurs fois.\n@c0@"
  it: "@a%0%a001250@bI souvenir esposti sono di qualità talmente elevata che quasi ipnotizzano i visitatori...\n@c0@"
  ja: "@a@b%a001250「名産品って\n\tすごくよくできてるから\n\t何度見てもあきないね。\n@c0@"
458:
  de: "@aSancho@bFür die Kunsthandwerker es ist nisst schlesst, die Arbeit der anderen zu sehen. So kommen sie auf neue Ideen.\n@c0@"
  en: "@aSancho@bFor the artisans, ees good to esee the work of the others. Ees a way to esharpen your eskills.\n@c0@"
  es: "@aSancho@bPara los artesanos pues es bueno ver el trabajo de otros. Es un modo de mejorar sus habilidades.\n@c0@"
  fr: "@aSancho@bPour les artisans, c'est oune bonne chose de v-voir les œuvres d'autres p-p-personnes. C'est oun moyen d'améliorer son p-propre travail.\n@c0@"
  it: "@aSancho@bPor los artigianos visitare el Museo del Souvenir es un modo de capire como lavorano los loros collegas y de imparare nuevas tecnicas costruttivas.\n@c0@"
  ja: "@a@bサンチョ「芸術にたずさわる人は\n\t自分の感覚を　みがくために\n\tさまざまなものに　ふれるのだそうです。\n@c0@"
459:
  de: "@aSancho@bDiese Stücke, die du gesammelt hast, Chico, sind etwas Besonderes für diese Leute.\n@c0@"
  en: "@aSancho@bThese exhibits you have collected, friend, they are esometheeng especial for these people.\n@c0@"
  es: "@aSancho@bLas cosinas que conseguiste, chamaco, tienen algo especial para esta gente.\n@c0@"
  fr: "@aSancho@bLes objets que tu as rassemblés, chico,\r\nils r-représentent quelque chose de\r\nspécial pour ces gens.\n@c0@"
  it: "@aSancho@bEn praticas, por loro venire aquí es como seguire un corso de aggiornamento profesional.\n@c0@"
  ja: "@a@bサンチョ「%a000090王が集められた\n\t名産品は　そのような人にとって\n\t強くしげきされる　ものなのですね。\n@c0@"
460:
  de: "@aOtto@bIch würd' ja lieber die Arbeit der großen Kunsthandwerkerin im Himmel sehen. Schöpfungen nach ihrem Ebenbild, wenn Ihr wisst, was ich mein'!\n@c0@"
  en: "@aTuppence@bI'd rather see the work of the great craftswoman in the sky, personally. Works in Her own image, if you know what I mean!\n@c0@"
  es: "@aAlazar@bYo preferiría ver el trabajo de la gran artesana de los cielos. Me refiero a obras de arte a su imagen y semejanza, ya me entendéis.\n@c0@"
  fr: "@aInnocent@bJe préfère néanmoins admirer les œuvres de notre grande artiste céleste. Celles qu'elle a créées à son image, si vous voyez ce que je veux direⓠ\n@c0@"
  it: "@aSimon@bAlcuni degli oggetti esposti al Museo del Souvenir sono talmente belli da poter essere considerati vere opere d'arte.\n@c0@"
  ja: "@a@bピピン「ボクは　めずらしいものよりも\n\tいろんな女の人を　見たいなあ。\n@c0@"
461:
  de: "@aBianca@bEs ist nicht leicht, die Meisterschaft in einer Sache zu erlangen, egal, was es ist.\n@c0@"
  en: "@aBianca@bIt's hard gettin' good at somethin', no matter what\r\nit is.\n@c0@"
  es: "@aBianca@bLlegar a ser bueno en algo siempre es difícil, ¿sabes?\n@c0@"
  fr: "@aBianca@bC'est difficile d'exceller dans un domaine,\r\nquel qu'il soit.\n@c0@"
  it: "@aBianca@bCerto, non è facile eccellere nel proprio lavoro, qualunque attività si svolga.\n@c0@"
  ja: "@a@bビアンカ「どんなことでも　修行は\n\tつらいものよ。\n@c0@"
462:
  de: "@aBianca@bHauptsache, man ist eisern entschlossen, sich noch mal aufzuraffen und es erneut zu versuchen, wenn's mal nicht gut läuft.\n@c0@"
  en: "@aBianca@bThe main thing is havin' the oomph to get back up and try again even when things en't gone well.\n@c0@"
  es: "@aBianca@bLo importante es tener la doble potencia necesaria para levantarse e intentarlo de nuevo cuando las cosas no van bien.\n@c0@"
  fr: "@aBianca@bMais l'essentiel, c'est d'avoir assez de volonté pour se remettre à l'ouvrage, même quand les choses ne\r\nse sont pas très bien passées.\n@c0@"
  it: "@aBianca@bCi vogliono pazienza, costanza, dedizione e abilità, oltre alla caparbietà necessaria per non arrendersi di fronte ai primi inevitabili insuccessi...\n@c0@"
  ja: "@a@bビアンカ「へこたれても　また\n\tがんばろうっていう　気持ちがあれば\n\t何度でもやり直せると思うわ。\n@c0@"
463:
  de: "@aNera@bEine gute Einstellung. Es ist besser, es nach einem Fehlschlag noch einmal zu versuchen, als aufzugeben und das später zu bereuen.\n@c0@"
  en: "@aNera@bThat's such a good attitude. It's better to try again after a failure than to regret it later on.\n@c0@"
  es: "@aNera@bEsa actitud me piace. Es mejor volver a intentarlo después de un fracaso que lamentarlo dopo.\n@c0@"
  fr: "@aNera@bC'est une attitude très positive. Mieux vaut réessayer après un échec que d'avoir des\r\nregrets par la suite.\n@c0@"
  it: "@aNera@bProvare, provare e ancora provare!\nQuesta è la chiave per il successo, insieme alla capacità di apprendere dai propri errori.\n@c0@"
  ja: "@a@bフローラ「あとになって　後悔するよりも\n\t何度めげても　なっとくするまで\n\t挑み続けるほうが　自分のためですわ。\n@c0@"
464:
  de: "@a%0%a001240@bIch gebe nie auf! Ich ziehe immer alles bis zum Ende durch!\n@c0@"
  en: "@a%0%a001240@bI never give up on anything! I always stick at it to the end!\n@c0@"
  es: "@a%0%a001240@bYo nunca me rindo. Siempre llego hasta el final.\n@c0@"
  fr: "@a%0%a001240@bJe n'abandonne jamais rienⓠ Je m'y tiens toujours, jusqu'au boutⓠ\n@c0@"
  it: "@a%0%a001240@bIo non mi arrendo mai!\nSe inizio una cosa, la porto avanti fino in fondo!\n@c0@"
  ja: "@a@b%a001240「ボクは　どんなことでも\n\tぜったい　あきらめたりしないよ！\n@c0@"
465:
  de: "@a%0%a001250@bIch hoffe, eines Tages stellen wir hier etwas aus, was dieser Mann erschaffen hat.\n@c0@"
  en: "@a%0%a001250@bI hope one day we'll be able to put one of that man's creations on display here.\n@c0@"
  es: "@a%0%a001250@bEspero que un día podamos exhibir una obra de ese hombre.\n@c0@"
  fr: "@a%0%a001250@bJ'espère qu'un jour, on pourra exposer l'une des œuvres de cet homme.\n@c0@"
  it: "@a%0%a001250@bChissà, magari un giorno il Museo del Souvenir esporrà una creazione di quell'uomo...\n@c0@"
  ja: "@a@b%a001250「いつの日か\n\tあの人が作った　名産品を\n\t展示してあげられたらいいね。\n@c0@"
466:
  de: "@aSancho@bMañana, mañana. Dieser Señor, er ist noch so jung. Er hat noch so viel Zeit.\n@c0@"
  en: "@aSancho@bMañana, mañana. Thees señor, he ees estill eso young. There ees muchos time for heem.\n@c0@"
  es: "@aSancho@bPues no tardará. El señor es muy joven aún. Tiene mucho tiempo por delante.\n@c0@"
  fr: "@aSancho@bMañana, mañana. Ce señor est encore jeune.\r\nIl a b-b-beaucoup de temps devant lui.\n@c0@"
  it: "@aSancho@bQuell'hombre es ancora giovane.\nHa todo el tiempo que vuole por diventare un bravo artigiano...\n@c0@"
  ja: "@a@bサンチョ「くじけても大丈夫！\n\tまだまだ　若いんですから\n\tこれからですよ。\n@c0@"
467:
  de: "@aOtto@bIch weiß, wie sich der arme Kerl fühlt. Ich hätt' bei meiner Ausbildung zum Soldaten auch beinah das Handtuch geworfen.\n@c0@"
  en: "@aTuppence@bI know how the poor chap feels. I had a terrible time of it when I was training to be a soldier.\n@c0@"
  es: "@aAlazar@bEntiendo como se siente el pobre. Yo lo pasé fatal mientras me preparaba para ser soldado.\n@c0@"
  fr: "@aInnocent@bJe sais ce que ressent ce pauvre diable.\r\nMon entraînement pour devenir soldat a\r\nété très dur, lui aussi.\n@c0@"
  it: "@aSimon@bSo bene cosa voglia dire avere un sogno e impegnarsi per realizzarlo. Tutto è possibile, se lo si vuole davvero. Bisogna crederci fino in fondo!\n@c0@"
  ja: "@a@bピピン「ボクも　お城の兵士になったときは\n\t大変だったなあ。\n@c0@"
468:
  de: "@aBianca@bJe mehr Besucher, desto besser, wenn es nach mir geht!\n@c0@"
  en: "@aBianca@bThe more customers the better as far as\r\nI'm concerned!\n@c0@"
  es: "@aBianca@bPor lo que a mí respecta, cuantos más visitantes mejor, ¿sabes?\n@c0@"
  fr: "@aBianca@bEn ce qui me concerne, plus il y a de visiteurs,\nmieux c'estⓠ\n@c0@"
  it: "@aBianca@bPiù visitatori ci sono, meglio è!\n@c0@"
  ja: "@a@bビアンカ「私たちとしては　いっぱい\n\tお客さんが　いた方が\n\tうれしいんだけど……。\n@c0@"
469:
  de: "@aNera@bWenn er sich hier unten verkriecht, verpasst er doch das Beste! Schließlich sind die ganzen Ausstellungsstücke oben zu sehen!\n@c0@"
  en: "@aNera@bWhat a waste, holing himself up down here when there are all those exhibits on display upstairs!\n@c0@"
  es: "@aNera@bMa qué pérdida di tempo, quedarse aquí abajo cuando hay tanto que ver arriba.\n@c0@"
  fr: "@aNera@bQuel gâchis, venir se terrer là en bas alors qu'il y a tous ces objets exposés à l'étageⓠ\n@c0@"
  it: "@aNera@bMi spiace che non sia riuscito a vedere gli oggetti esposti al piano di sopra.\nCe ne sono di veramente splendidi!\n@c0@"
  ja: "@a@bフローラ「せっかく見に来ていただいたのに\n\tこんな　なにも　ないところでは\n\t申しわけないですわ……。\n@c0@"
470:
  de: "@a%0%a001240@bIch hätte gedacht, es ist schwerer, sich im Lager wohlzufühlen. Es ist doch so düster hier!\n@c0@"
  en: "@a%0%a001240@bI would've thought it'd be harder to relax in the storeroom. It's so gloomy.\n@c0@"
  es: "@a%0%a001240@bYo pensaba que relajarse en el almacén sería más difícil. Es muy deprimente.\n@c0@"
  fr: "@a%0%a001240@bJ'aurais plutôt cru que c'était dans la réserve\nqu'il était difficile de se détendre.\nC'est tellement sinistre.\n@c0@"
  it: "@a%0%a001240@bIn effetti, nel deposito di gente ce n'è pochina...\nEh eh eh!\n@c0@"
  ja: "@a@b%a001240「うす暗い　物置のほうが\n\t落ち着かない気がするんだけど……。\n@c0@"
471:
  de: "@a%0%a001250@bHuch! Hat der mich erschreckt! Ich dachte nicht, dass jemand im Lager ist.\n@c0@"
  en: "@a%0%a001250@bOh! He scared me! I wasn't expecting anyone to be in the storeroom.\n@c0@"
  es: "@a%0%a001250@b¡Oh! ¡Menudo susto! No esperaba que hubiese nadie en el almacén.\n@c0@"
  fr: "@a%0%a001250@bOhⓠ Il m'a fait peurⓠ Je ne m'attendais pas\nà ce qu'il y ait quelqu'un dans la réserve.\n@c0@"
  it: "@a%0%a001250@bMa che ci fa quel tipo nel deposito, eh?\n@c0@"
  ja: "@a@b%a001250「びっくりしちゃった！\n\t物置に　お客さんがいるんだもん。\n@c0@"
472:
  de: "@aSancho@bMansse Leute entspannen siss lieber hier, andere lieber dort... Aber der Lagerraum, no, das ist nissts für deinen Onkel Sancho.\n@c0@"
  en: "@aSancho@bEsome people, they can relax here, esome people, they can relax there. But the storeroom...\r\nNo, ees no for your Uncle Sancho.\n@c0@"
  es: "@aSancho@bAlguna gente pues nomás se relaja acá, otra gente se relaja allá. Pero el almacén... No es para tu tito Sancho.\n@c0@"
  fr: "@aSancho@bCertains se détendent à oun endroit, d'autres ailleurs. Mais la r-r-réserve, quand même...\r\nNo, ça c'est pas oun endroit pour tonton Sancho.\n@c0@"
  it: "@aSancho@b¿Capisco que la folla renda la visita al Museo menos rilassante, ma c'era proprio el bisogno de andarsene nel deposito?\n@c0@"
  ja: "@a@bサンチョ「落ち着ける　場所というのは\n\t人それぞれなんですね。　\n\t私は　物置はちょっと……。\n@c0@"
473:
  de: "@aOtto@bEs gibt doch sicher schönere Orte, um sich zu entspannen, als den Lagerraum, net wahr?\n@c0@"
  en: "@aTuppence@bSurely there are better places to relax than the storeroom, aren't there?\n@c0@"
  es: "@aAlazar@bSeguro que hay mejores sitios en los que relajarse que en un almacén, ¿verdad?\n@c0@"
  fr: "@aInnocent@bIl doit quand même y avoir de meilleurs endroits que la réserve pour se détendre, nonⓡ\n@c0@"
  it: "@aSimon@bNel deposito...?\nBah...\nContento lui...\n@c0@"
  ja: "@a@bピピン「いくら落ち着かないからって\n\tなにも　物置にいなくても……。\n@c0@"
474:
  de: "@aBianca@bNa ja, normalerweise hat man selten die Gelegenheit, einen Blick in das Lager eines Museums zu werfen, nicht?\n@c0@"
  en: "@aBianca@bI s'pose it's not often folk get a glimpse inside a museum storeroom, eh?\n@c0@"
  es: "@aBianca@bSupongo que la gente no suele tener la oportunidad de echar un vistazo al almacén de un museo, ¿sabes?\n@c0@"
  fr: "@aBianca@bJ'imagine que les gens n'ont pas souvent l'occasion\r\nde voir la réserve d'un musée.\n@c0@"
  it: "@aBianca@bIn effetti, il Museo è talmente interessante che anche il deposito ha le sue attrattive... Io, però, preferisco le sale dedicate all'esposizione!\n@c0@"
  ja: "@a@bビアンカ「たしかに　博物館の物置って\n\tめったに　見られるものじゃ\n\tないとは思うけどね。\n@c0@"
475:
  de: "@aNera@bDann ist es ja gut, dass wir ein paar Stücke auch im Lagerraum aufgestellt haben, nicht wahr?\n@c0@"
  en: "@aNera@bWell, it's a good job we put some exhibits on display in the storeroom, isn't it?\n@c0@"
  es: "@aNera@bBueno, veramente no fue mala idea exhibir algunas cosinas en el almacén, ¿vero?\n@c0@"
  fr: "@aNera@bEh bien, nous avons bien fait de placer quelques objets en exposition dans la réserve, nonⓡ\n@c0@"
  it: "@aNera@bPer fortuna ha trovato qualcosa di interessante nel deposito, altrimenti avrebbe chiesto di farsi rimborsare il biglietto d'ingresso.\n@c0@"
  ja: "@a@bフローラ「物置にも　名産を置いておいて\n\tよかったですわ。\n@c0@"
476:
  de: "@a%0%a001240@bEs ist großartig, dass die Leute sich alles ansehen, was wir aufgestellt haben, selbst die Stücke im Lagerraum.\n@c0@"
  en: "@a%0%a001240@bIt's great that people are looking at everything we've put on display, even the exhibits in the storeroom.\n@c0@"
  es: "@a%0%a001240@bEs genial que la gente mire todo lo que hemos expuesto, incluso las piezas del almacén.\n@c0@"
  fr: "@a%0%a001240@bC'est super que les gens regardent tous les objets qui sont exposés, même ceux de la réserve.\n@c0@"
  it: "@a%0%a001240@bLa collezione del Museo è talmente vasta e interessante che la gente va ad ammirare persino i pezzi custoditi nel deposito!\n@c0@"
  ja: "@a@b%a001240「ここの部屋まで　すみずみ\n\t見てもらえると　なんだか\n\tうれしくなってくるよ。\n@c0@"
477:
  de: "@a%0%a001250@bEs ist eigentlich gar nicht so schlecht hier, wenn man sich einfach nur in aller Ruhe ein paar Exponate ansehen will.\n@c0@"
  en: "@a%0%a001250@bI suppose this is a good place if you just want\nto look at some exhibits without worrying about\nthe crowds.\n@c0@"
  es: "@a%0%a001250@bSupongo que no es mal lugar para contemplar algunas piezas lejos de la multitud.\n@c0@"
  fr: "@a%0%a001250@bJ'imagine que c'est un bon endroit pour admirer certaines des pièces sans être dérangé par la foule.\n@c0@"
  it: "@a%0%a001250@bPensandoci bene, anch'io farei come lui: nel deposito è possibile guardare gli oggetti con calma, senza la confusione che c'è nelle altre sale.\n@c0@"
  ja: "@a@b%a001250「誰にも　気にしないで\n\t名産品を　見られるってことなら\n\tここでもいいのかな？\n@c0@"
478:
  de: "@aSancho@bDas hier ist kein Ausstellungsraum. Es ist nur ein Lagerraum. \n@c0@"
  en: "@aSancho@bThees room ees no the display room.\r\nEes just the storeroom.\n@c0@"
  es: "@aSancho@bEsta sala no es de exhibición.\r\nNo es más que un almacén.\n@c0@"
  fr: "@aSancho@bCette salle n'est p-p-pas oune salle d'exposition. C'est juste la r-réserve.\n@c0@"
  it: "@aSancho@b¡Ma quella non es una sala da esposizione!\n¡Quello es el deposito!\n@c0@"
  ja: "@a@bサンチョ「ここは　物置であって\n\t展示室ではないのですが……。\n@c0@"
479:
  de: "@aSancho@bAber dieser Señor, dem scheint das nissts auszumachen.\n@c0@"
  en: "@aSancho@bBut thees señor, he no eseem to care.\n@c0@"
  es: "@aSancho@bPero al señor parece no importarle.\n@c0@"
  fr: "@aSancho@bMais ce s-señor n'a pas l'air de s'en préoccuper.\n@c0@"
  it: "@aSancho@bPienso que quel señor es un poco loco...\n@c0@"
  ja: "@a@bサンチョ「あの方は\n\t気にして　いないようですし\n\tよしとしましょうか。\n@c0@"
480:
  de: "@aOtto@bEs ist nur so schad', den ganzen Weg zum Firlefanzeum zu kommen und sich dann nur die Stücke im Lager anzusehen, findet Ihr net?\n@c0@"
  en: "@aTuppence@bIt's a bit of a waste to come all the way out here to the knick-knackatory and only see the exhibits in the storeroom, don't you think?\n@c0@"
  es: "@aAlazar@bEs una pena venir hasta el musenino y solo ver las cosinas del almacén, ¿no?\n@c0@"
  fr: "@aInnocent@bC'est un peu dommage de faire tout ce chemin jusqu'à la Galericabrac pour ne voir que les objets exposés dans la réserve, vous ne trouvez pasⓡ\n@c0@"
  it: "@aSimon@bEhi!\nNon sarà mica che quel tipo vuole rubare gli oggetti custoditi nel deposito, eh?!\n@c0@"
  ja: "@a@bピピン「せっかく博物館に　来ているのに\n\t名産品を見たのが　この部屋だけ\n\tというのは　もったいないですよ。\n@c0@"
481:
  de: "@aBianca@bWas für ein merkwürdiger Kerl! Den scheint mehr zu interessieren, wie wir die Ausstellung aufgebaut haben, als die Stücke selber!\n@c0@"
  en: "@aBianca@bWhat a funny bloke! He seems more interested in\r\nhow we've lined the exhibits up than the actual exhibits 'emselves!\n@c0@"
  es: "@aBianca@b¡Qué tipo más peculiar! Parece que le preocupa más cómo hemos colocado las cosinas que las cosinas, ¿me entiendes?\n@c0@"
  fr: "@aBianca@bIl est marrant, luiⓠ Il a l'air plus intéressé par la manière dont on a disposé les objets que par les objets eux-mêmesⓠ\n@c0@"
  it: "@aBianca@bMa c'ha detto, ahò?!\n@c0@"
  ja: "@a@bビアンカ「名産品よりも\n\tならべかたに　関心があるなんて\n\t変わったお客さんね。\n@c0@"
482:
  de: "@aNera@bEs ist schön zu wissen, dass andere den eigenen Geschmack teilen, findest du nicht, %a000090?\n@c0@"
  en: "@aNera@bIt's nice to know people share your tastes, isn't it, %a000090?\n@c0@"
  es: "@aNera@bEs buono saber que la gente comparte tus gustos, ¿vero, %a000090?\n@c0@"
  fr: "@aNera@bC'est agréable de voir qu'il y a des gens qui ont les mêmes goûts que nous, hein, %a000090ⓡ\n@c0@"
  it: "@aNera@bSono contenta di vedere che i visitatori apprezzano il criterio che abbiamo scelto per esporre i souvenir.\n@c0@"
  ja: "@a@bフローラ「あの方は　%a000090さんと\n\t感性が近いみたいですね。\n@c0@"
483:
  de: "@a%0%a001240@bWahre Inspiration? Was meint er denn damit? Gefällt es ihm nun oder nicht?\n@c0@"
  en: "@a%0%a001240@bWhat do you think he means by ⓗinspiredⓘ?\nDoes he like it or not?\n@c0@"
  es: "@a%0%a001240@b¿Por qué es ⓕgenialⓖ?\n¿Somos genios?\n@c0@"
  fr: "@a%0%a001240@bQu'est-ce qu'il veut dire par ⓥOn sent le génieⓦⓡ\nÇa pourrait être mal pris.\n@c0@"
  it: "@a%0%a001240@bEh?!\nMa c'ha detto, ahò?!\n@c0@"
  ja: "@a@b%a001240「味があるって　きれいに\n\tかざってあるってことでしょ？\n@c0@"
484:
  de: "@a%0%a001250@bHast du das gehört, Papa? Er findet deine Arrangements wirklich gut.\n@c0@"
  en: "@a%0%a001250@bDid you hear that, Dad? He thinks your displays are really good.\n@c0@"
  es: "@a%0%a001250@b¿Has oído eso, papi? Piensa que la distribución es muy buena.\n@c0@"
  fr: "@a%0%a001250@bTu as entendu ça, papaⓡ Il trouve ton exposition vraiment bien faite.\n@c0@"
  it: "@a%0%a001250@bHai sentito?\nPensa che abbiamo fatto un buon lavoro a esporre gli oggetti in questo modo! Che bello!\n@c0@"
  ja: "@a@b%a001250「ほめられちゃったね！\n\tお父さん。\n@c0@"
485:
  de: "@aSancho@bSí. Es stimmt. Wenn man die Ausstellungsstücke an einem anderen Ort platziert, kann das ihr Aussehen total verändern.\n@c0@"
  en: "@aSancho@bSí. Ees true. You can change the way the exhibits look just by changing the places where they are on display.\n@c0@"
  es: "@aSancho@b¡Ándale! Es la puritita verdad. El aspecto de la exposición cambia completamente en cuanto se cambian las cosinas de lugar.\n@c0@"
  fr: "@aSancho@bSi. C'est vrai. On peut changer l'aspect d'oune exposition rien qu'en ch-changeant la disposition\r\ndes p-p-pièces.\n@c0@"
  it: "@aSancho@bSì, claro.\nLos souvenir danno un'impressione diversa en base a como sono espostos.\n@c0@"
  ja: "@a@bサンチョ「ならべかた　ひとつでも\n\t名産品の　見え方が変わって\n\tきますからね。\n@c0@"
486:
  de: "@aOtto@bDie verschiedenen Leute scheinen jedenfalls auf das Arrangement ganz unterschiedlich zu reagieren, net wahr?\n@c0@"
  en: "@aTuppence@bDifferent people certainly seem to react to the displays in different ways, don't they?\n@c0@"
  es: "@aAlazar@bPues sí que es verdad que gente diferente reacciona de forma distinta a la exposición, ¿no?\n@c0@"
  fr: "@aInnocent@bLes gens réagissent vraiment différemment devant une même exposition, n'est-ce pasⓡ\n@c0@"
  it: "@aSimon@bIn effetti, vantiamo un'ineguagliabile conoscenza delle conflittualità culturali delle etnie residenti nei paesi di provenienza. Eh?! Ma che sto dicendo?!\n@c0@"
  ja: "@a@bピピン「お客さんも　人それぞれ\n\t博物館の見かたが　ちがうもの\n\tなんですね。\n@c0@"
487:
  de: "@aBianca@bMeine Güte! Die Kunde von unserem Museum hat sich offenbar inzwischen schon bis zum Himmel herumgesprochen!\n@c0@"
  en: "@aBianca@bBlimey! Looks like talk of this place has reached all the way up to the heavens, eh?\n@c0@"
  es: "@aBianca@b¡Cuernos! Parece que los rumores sobre este sitio han llegado hasta el cielo, ¿sabes?\n@c0@"
  fr: "@aBianca@bSaperlipopetteⓠ On dirait qu'on parle de cet endroit jusque dans les cieux, heinⓡ\n@c0@"
  it: "@aBianca@bSanta dea!\nNon credevo che la popolarità del Museo del Souvenir fosse arrivata tanto in alto!\n@c0@"
  ja: "@a@bビアンカ「%a000090の博物館のウワサって\n\t天にまで　届いてるってこと？\n@c0@"
488:
  de: "@aNera@bEine Zenithianerin! Welche Ehre!\n@c0@"
  en: "@aNera@bA Zenithian! What a great honour!\n@c0@"
  es: "@aNera@b¡Una zenithia! ¡Qué grande honore!\n@c0@"
  fr: "@aNera@bUne Zénithienneⓠ Quel grand honneurⓠ\n@c0@"
  it: "@aNera@bUna Zenithiana al Museo del Souvenir?!\nQuale onore!\n@c0@"
  ja: "@a@bフローラ「天空人の方にまで\n\t来ていただけるなんて　とても\n\t光栄なことですわ。\n@c0@"
489:
  de: "@a%0%a001240@bMeinst du, sie ist den ganzen Weg vom zenithianischen Schloss oben im Himmel bis hierher geflogen? Wär das nicht toll, Flügel zu haben?\n@c0@"
  en: "@a%0%a001240@bDo you think she flew here all the way from the Zenithian castle up in the sky? Wow!\nHaving wings would be amazing!\n@c0@"
  es: "@a%0%a001240@b¿Tú crees que ha bajado aquí desde el castillo de Zenithia en el cielo? ¡Arrea!\nTener alas sería genial.\n@c0@"
  fr: "@a%0%a001240@bTu crois qu'elle a volé jusqu'ici depuis le château zénithien qui flotte dans le cielⓡ Waouhⓠ Ça serait génial d'avoir des ailesⓠ\n@c0@"
  it: "@a%0%a001240@bMa quella signora è volata fin qui dal Castello di Zenithia?! Il Museo del Souvenir dev'essere davvero famoso, per attirare visitatori da tanto lontano!\n@c0@"
  ja: "@a@b%a001240「天空城からここまで\n\t飛んできたのかなあ？\n\tいいなあ　羽があるって。\n@c0@"
490:
  de: "@a%0%a001250@bWenn ich Flügel hätte, könnte ich mich hoch in den Himmel schwingen und fliegen und fliegen und fliegen.\n@c0@"
  en: "@a%0%a001250@bIf only I had wings, I could soar up into the sky and fly free for miles and miles.\n@c0@"
  es: "@a%0%a001250@bSi tuviese alas, podría volar por el cielo e ir a todos lados.\n@c0@"
  fr: "@a%0%a001250@bSi j'avais des ailes, je pourrais m'élever à toute vitesse dans le ciel et parcourir d'immenses distances en volant librement.\n@c0@"
  it: "@a%0%a001250@bChissà come mai gli esseri umani non hanno le ali...\n@c0@"
  ja: "@a@b%a001250「私にも　羽があったら\n\t広いお空を　自由に飛べるのに。\n@c0@"
491:
  de: "@aSancho@bDein Firlefanzeum ist jetzt berühmt, Meine Majestät. Die Señores und Señoras kommen von weit her, um es zu sehen.\n@c0@"
  en: "@aSancho@bYour knick-knackatory, eet ees famous now, My Majesty. The señores and señoras are coming from far and wide.\n@c0@"
  es: "@aSancho@bSu musenino ya es retefamoso, Majestad. Llegan señores y señoras de toditos los lados.\n@c0@"
  fr: "@aSancho@bMa Majesté, ta Galericabrac est très r-r-réputée, maintenant. Les señores et les señoritas viennent de t-t-très loin.\n@c0@"
  it: "@aSancho@b¡La fama del Museo del Souvenir ormai ha superato los confinos del mundo de los humanos!\n@c0@"
  ja: "@a@bサンチョ「%a000090王の　博物館も\n\t多くの人たちの　知るところと\n\tなってきたようですよ。\n@c0@"
492:
  de: "@aOtto@bWenn sogar sie schon davon g'hört hat, dass Ihr der neue Kurator des Firlefanzeums seid, %a000090...\n@c0@"
  en: "@aTuppence@bIf even she's heard the news that you're the new curator of the knick-knackatory, %a000090...\n@c0@"
  es: "@aAlazar@bSi hasta ella sabe que eres el nuevo gestor del musenino, %a000090...\n@c0@"
  fr: "@aInnocent@bSi même elle est au courant que vous êtes le nouveau conservateur de la Galericabrac, %a000090...\n@c0@"
  it: "@aSimon@bAccidenti!\nLa notizia della nomina del nuovo direttore del Museo del Souvenir è arrivata fino a Zenithia!\n@c0@"
  ja: "@a@bピピン「あの方が　%a000090王が\n\t館長をなさっている　ウワサを\n\t聞いたということは\n@c0@"
493:
  de: "@aOtto@bNa ja, man kann ein Gerücht net viel weiter verbreit'n als nach Zenithia, net wahr?\n@c0@"
  en: "@aTuppence@bWell, you can't spread a rumour much further than Zenithia, can you?\n@c0@"
  es: "@aAlazar@bBueno, la noticia no puede llegar mucho más lejos que Zenithia, ¿verdad?\n@c0@"
  fr: "@aInnocent@bDifficile de faire circuler l'information plus loin que Zénithia, vous ne croyez pasⓡ\n@c0@"
  it: "@aSimon@bChissà se anche lì hanno dei musei interessanti...\nSe fosse così mi piacerebbe visitarli.\n@c0@"
  ja: "@a@bピピン「もうすでに　かなり広い範囲に\n\tウワサが　広がっているという\n\tことですかね？\n@c0@"
494:
  de: "@aBianca@bHuch! Die klingt aber ziemlich genervt, was?\n@c0@"
  en: "@aBianca@bYikes! Sounds like she's a bit peeved, eh?\n@c0@"
  es: "@aBianca@b¡Puaj! Parece todo un tostón, ¿sabes?\n@c0@"
  fr: "@aBianca@bAïeⓠ Elle a l'air un peu remontée, heinⓡ\n@c0@"
  it: "@aBianca@bVedo che la signora aveva tutt'altre aspettative per la luna di miele...\nBeh, non ha tutti i torti...\n@c0@"
  ja: "@a@bビアンカ「よかったね。\n\t楽しんでもらえたみたい。\n@c0@"
495:
  de: "@aNera@bNun ja, das ist nicht gerade ein romantisches Örtchen für die Flitterwochen, nicht?\n@c0@"
  en: "@aNera@bI suppose it is a bit of a serious sort of place for a honeymoon really.\n@c0@"
  es: "@aNera@bCredo que esto puede ser demasiado serio para una luna de mele.\n@c0@"
  fr: "@aNera@bC'est vrai que c'est peut-être un peu sérieux comme endroit pour une lune de miel.\n@c0@"
  it: "@aNera@bIn effetti, non è che i musei siano luoghi molto romantici, e il nostro non fa certo eccezione.\n@c0@"
  ja: "@a@bフローラ「ここが　新婚旅行先なんて\n\t責任重大でしたけど　楽しんで\n\tいただけたようで　良かったですわ。\n@c0@"
496:
  de: "@a%0%a001240@bDie Dame ist aber hübsch, nicht?\n@c0@"
  en: "@a%0%a001240@bThat lady's really pretty, isn't she?\n@c0@"
  es: "@a%0%a001240@bEsa mujer es muy guapa, ¿verdad?\n@c0@"
  fr: "@a%0%a001240@bElle est vraiment jolie, cette dame, heinⓡ\n@c0@"
  it: "@a%0%a001240@bMa che carina quella signora!\nÈ bella quasi quanto la mamma, eh?\n@c0@"
  ja: "@a@b%a001240「あのお姉さん\n\tきれいな人だったね。\n@c0@"
497:
  de: "@a%0%a001250@bIch will auch mal heiraten.\n@c0@"
  en: "@a%0%a001250@bI hope I'll get married one day.\n@c0@"
  es: "@a%0%a001250@bEspero casarme algún día.\n@c0@"
  fr: "@a%0%a001250@bJ'espère que je me marierai, un jour.\n@c0@"
  it: "@a%0%a001250@bSe il mio futuro marito mi proponesse di trascorrere la luna di miele in un museo io... gli direi di sì.\nL'importante è che mi ami.\n@c0@"
  ja: "@a@b%a001250「あの人みたいに　私もいつか\n\tきれいなお嫁さんに　なれるといいな。\n@c0@"
498:
  de: "@aSancho@bDas ist wirkliss komisch. Iss dachte, alle jungen Frauen sehen gerne die schönen Sachen, gemacht von Künstlern, no?\n@c0@"
  en: "@aSancho@bEes estrange. I believe all young women, they love to esee the fine theengs made by the artisans, no?\n@c0@"
  es: "@aSancho@bEsto es bien raro. Yo creía que a las jovencitas les gustaba mirar las obras de arte de los artesanos.\n@c0@"
  fr: "@aSancho@bC'est étrange. J'aurais c-c-cru que les jeunes femmes aimaient toutes ces belles choses\nf-fabriquées par les artisans, noⓡ\n@c0@"
  it: "@aSancho@bSi alla señora no dispiace, la porto yo su una bella playa por una romantica cena a lume de candela...\n¡Una cenetta a bases de paella, ovviamentes!\n@c0@"
  ja: "@a@bサンチョ「やはり　いい名産品は\n\t女性をひきつける　もののようですな。\n@c0@"
499:
  de: "@aOtto@bIch hoff', ich find' eines Tages auch eine wunderschöne Braut.\n@c0@"
  en: "@aTuppence@bI hope I'll find myself a beautiful bride one of\r\nthese days.\n@c0@"
  es: "@aAlazar@bEspero conseguir pronto una bella esposa.\n@c0@"
  fr: "@aInnocent@bJ'espère que je me trouverai une belle épouse,\r\nun jour.\n@c0@"
  it: "@aSimon@bAnch'io un giorno mi sposerò...\nSpero solo che quel giorno non arrivi troppo presto!\n@c0@"
  ja: "@a@bピピン「いつかボクも　きれいな\n\t花嫁さんをもらいたいです。\n@c0@"
500:
  de: "@aBianca@bHast du das Strahlen auf seinem Gesicht gesehen, als er seine Frau erwähnte? Für sie ist alles noch so neu und romantisch, nicht?\n@c0@"
  en: "@aBianca@bDid you see the smile on his face when he said ⓗwifeⓘ? It's all so new and romantic for 'em, eh?\n@c0@"
  es: "@aBianca@b¿Has visto la cara de bobo que se le ha puesto cuando ha dicho ⓕmujerⓖ? Todo es nuevo y romántico para ellos.\n@c0@"
  fr: "@aBianca@bTu as vu ce sourire sur son visage quand il a dit ⓥma femmeⓦⓡ C'est encore tout neuf et très romantique pour eux, heinⓡ\n@c0@"
  it: "@aBianca@bHo la sensazione che quel tipo non conosca affatto sua moglie. Gli faccio tanti auguri per il loro matrimonio... Secondo me ne ha un gran bisogno!\n@c0@"
  ja: "@a@bビアンカ「妻って　まだ\n\t言いなれてないのね。\n\tういういしいね。\n@c0@"
501:
  de: "@aBianca@bHa ha! Du schaust ganz verlegen aus, %a000090.\n@c0@"
  en: "@aBianca@bHa ha! You look all embarrassed, %a000090.\n@c0@"
  es: "@aBianca@b¡Ja, ja! Pareces desconcertado, %a000090.\n@c0@"
  fr: "@aBianca@bHa haⓠ Tu sembles tout gêné, %a000090.\n@c0@"
  it: "@aBianca@bPer fortuna tra noi le cose vanno diversamente...\nNon è vero, %a000090?\n@c0@"
  ja: "@a@bビアンカ「%a000090はどう？\n\tうふふ　てれちゃう？\n@c0@"
502:
  de: "@aNera@bEs muss dich als Kurator doch glücklich machen zu hören, wie jemand Lobgesänge auf das Museum anstimmt.\n@c0@"
  en: "@aNera@bIt must make you so happy as curator of the place to hear someone singing its praises like that.\n@c0@"
  es: "@aNera@bDebe de hacerte molto felice como gestor del lugar oír come alguien canta las alabanzas del museo così.\n@c0@"
  fr: "@aNera@bEn tant que conservateur, tu dois être très heureux d'entendre quelqu'un chanter les louanges de cet endroit, nonⓡ\n@c0@"
  it: "@aNera@bNon so se essere contenta perché a quell'uomo piace il Museo del Souvenir o triste perché dimostra di non comoscere affatto i gusti di sua moglie...\n@c0@"
  ja: "@a@bフローラ「ああ言ってもらえると\n\tあなたも　館長として\n\tうれしいでしょう？\n@c0@"
503:
  de: "@a%0%a001240@bEr ist wirklich glücklich. Er glaubt tatsächlich, seine Frau unterhält sich hier gut.\n@c0@"
  en: "@a%0%a001240@bHe's really happy. He actually thinks his wife is having fun.\n@c0@"
  es: "@a%0%a001240@bEstá más contento que unas pascuas. Cree que su mujer se lo está pasando bien.\n@c0@"
  fr: "@a%0%a001240@bIl est vraiment heureux. Il pense sincèrement que\nsa femme s'amuse.\n@c0@"
  it: "@a%0%a001240@bEh eh eh!\nChe stupidotto che è quel tipo!\nPensa che la moglie si stia divertendo! Ah ah ah!\n@c0@"
  ja: "@a@b%a001240「お嫁さんに　よろこんでもらえて\n\tあの人も　うれしそうだったね。\n@c0@"
504:
  de: "@a%0%a001250@bWas für ein netter Mann. Wie schade, dass er nicht merkt, dass es seiner Frau hier nicht gefällt.\n@c0@"
  en: "@a%0%a001250@bWhat a nice man. It's a shame he doesn't realise his wife's not enjoying herself.\n@c0@"
  es: "@a%0%a001250@b¡Qué hombre más simpático! Es una pena que no se dé cuenta de que su mujer no se lo está pasando bien.\n@c0@"
  fr: "@a%0%a001250@bQuel homme attentionné. Dommage qu'il ne se rende pas compte que sa femme ne s'amuse pas du tout.\n@c0@"
  it: "@a%0%a001250@bAh, vuole anche riportarla qui per i prossimi anniversari?! Allora mi sa che di anniversari insieme ne festeggeranno ben pochi...\n@c0@"
  ja: "@a@b%a001250「やさしそうな人だね。\n\tお嫁さんも　幸せなんだろうなあ。\n@c0@"
505:
  de: "@aSancho@bEs gibt doch nissts Schöneres, als den stolzen jungen Señor und seine frisch angetraute Señora zu sehen! Aber... es wäre schöner, wenn sie glückliss wären.\n@c0@"
  en: "@aSancho@bEes notheeng better than to esee the proud young señor and the new señora, sí? But...ees better eef they are happy.\n@c0@"
  es: "@aSancho@b¡Está bien padre ver al joven señor y la señora juntos! Pero, todavía estaría más padre si fueran felices.\n@c0@"
  fr: "@aSancho@bIl n'y a rien de plus agréable que de voir oun jeune couple, siⓡ Ma... c'est encore mieux quand ils\ns-s-sont heureux.\n@c0@"
  it: "@aSancho@bQuellos dos fanno una bella coppia.\nDevono solo imparare a conoscerse un poco más, y avranno un matrimonio feliz.\n@c0@"
  ja: "@a@bサンチョ「仲むつまじい　夫婦というのは\n\t見ている方も　幸せな気分に\n\tなるものですね。\n@c0@"
506:
  de: "@aOtto@bTja, wenigstens gibt er sich Mühe. Aber wie man eine Frau glücklich macht, muss er erst noch lernen.\n@c0@"
  en: "@aTuppence@bWell I'd give the chap marks for effort, I suppose, but I reckon I could teach him a thing or two about keeping his wife happy.\n@c0@"
  es: "@aAlazar@bYo le daría al tipo unos puntos por el esfuerzo, pero creo que le podría enseñar un par de cositas sobre cómo hacer feliz a su mujer.\n@c0@"
  fr: "@aInnocent@bJe félicite ce type pour ses efforts louables, mais je pourrais lui donner un ou deux conseils utiles en matière de psychologie féminine.\n@c0@"
  it: "@aSimon@bQuel poveretto non ha la minima idea di come si rende felice una donna.\nForse dovrei dargli qualche consiglio...\n@c0@"
  ja: "@a@bピピン「幸せそうですね。　\n\tいいなあ　ボクも\n\tはやく　結婚したいですっ！\n@c0@"
507:
  de: "@aBianca@bJa, ich weiß, was sie meint. Und auf meinen Reisen mit dir...\n@c0@"
  en: "@aBianca@bYeah, I know what she means. And travellin 'about with you...\n@c0@"
  es: "@aBianca@bSí, la entiendo perfectamente. Viajar contigo...\n@c0@"
  fr: "@aBianca@bOui, je vois ce qu'elle veut dire. Et en voyageant avec toi...\n@c0@"
  it: "@aBianca@bSì, ha ragione.\nVisitare questo posto è un po' come fare il giro del mondo. Solo che si fa prima e si spende meno!\n@c0@"
  ja: "@a@bビアンカ「名産品もそうだけど\n\t私は　%a000090と旅をしていて\n\tいろいろな人に　会うたびに……\n@c0@"
508:
  de: "@aBianca@bDabei habe ich so viel gelernt. Nicht nur über unsere Ausstellungsstücke, sondern über alles Mögliche.\n@c0@"
  en: "@aBianca@bWell, I've learnt so much. Not just about stuff like these exhibits, but all sorts.\n@c0@"
  es: "@aBianca@bBueno, he aprendido un montonazo, ¿sabes? Y no solo cosas sobre exposiciones, sino de todo.\n@c0@"
  fr: "@aBianca@b... eh bien, j'ai découvert tant de chosesⓠ\nEt pas seulement des choses matérielles, comme ces objets, mais des choses de toutes sortes.\n@c0@"
  it: "@aBianca@bPersonalmente, però, preferisco viaggiare.\nVisitare un posto di persona è molto meglio che non conoscerlo attraverso l'artigianato locale.\n@c0@"
  ja: "@a@bビアンカ「私自身　いろいろな事を\n\t教えて　もらったような……。\n\tそんな気になるの。\n@c0@"
509:
  de: "@aNera@bEs heißt, wenn ein Kunsthandwerker ein Kunstwerk erschafft, legt er ein Stück seiner Seele hinein.\n@c0@"
  en: "@aNera@bThey say that when a craftsman creates a masterpiece, he gives it a life of its own.\n@c0@"
  es: "@aNera@bDicen que cuando un artesano crea una obra maestra, le da vita propia.\n@c0@"
  fr: "@aNera@bOn raconte que quand un artisan crée un\r\nchef-d'œuvre, il lui donne une vie propre.\n@c0@"
  it: "@aNera@bSi dice che gli artigiani più bravi infondano un po' della loro anima negli oggetti che creano.\n@c0@"
  ja: "@a@bフローラ「たんせい込めて　作られた物には\n\t命が宿ると　言われています。\n@c0@"
510:
  de: "@aNera@bNun ja, wenn jemand mit so viel Hingabe bei der Sache ist, dann muss man das ja spüren, nicht?\n@c0@"
  en: "@aNera@bWell, when someone has so much passion for what they do, it's got to rub off, hasn't it?\n@c0@"
  es: "@aNera@bBueno, cuando alguien siente tanta passione per lo que hace, tiene que notarse, ¿verdad?\n@c0@"
  fr: "@aNera@bC'est vrai que quand une personne met autant\nde passion dans ce qu'elle fait, cela transparaît forcément, tu ne crois pasⓡ\n@c0@"
  it: "@aNera@bCredo che sia vero. Quando una persona nutre una passione genuina per il suo lavoro, lascia una traccia inconfondibile e indelebile in quel che fa.\n@c0@"
  ja: "@a@bフローラ「きっと　作られた方々の\n\t強い想いがそうさせるのでしょう。\n@c0@"
511:
  de: "@a%0%a001240@bJeder kann Großes vollbringen. Stimmt's nicht, Papa?\n@c0@"
  en: "@a%0%a001240@bAnyone can become great. Right, Dad?\n@c0@"
  es: "@a%0%a001240@bCualquiera puede llegar a ser grande. ¿Verdad, papi?\n@c0@"
  fr: "@a%0%a001240@bTout le monde peut devenir exceptionnel,\npas vrai, papaⓡ\n@c0@"
  it: "@a%0%a001240@bPapà, pensi che io sia una persona creativa?\n@c0@"
  ja: "@a@b%a001240「どんな人にでも　可能性は\n\tあると思うよ。　ねっ　お父さん？\n@c0@"
