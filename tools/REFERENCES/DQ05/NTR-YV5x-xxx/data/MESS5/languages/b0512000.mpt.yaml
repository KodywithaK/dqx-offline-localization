0:
  de: "@aBianca@bAch, ich verstehe. Das ganze Saubermachen und so wird also nachts erledigt.\n@c0@"
  en: "@aBianca@bOh, I get it. So all the cleanin' and stuff gets done of a night.\n@c0@"
  es: "@aBianca@b¡Ah, entiendo! Así que todo lo de la limpieza hay que hacerlo por la noche.\n@c0@"
  fr: "@aBianca@bOh, je comprends. Alors tout le nettoyage est fait\r\nde nuit.\n@c0@"
  it: "@aBianca@bDunque, le pulizie devono essere fatte durante la notte...\n@c0@"
  ja: "@a@bビアンカ「なるほど……\n\t作業は　夜にするのね。\n@c0@"
1:
  de: "@aBianca@bMan muss ja darauf achten, dass alle Exponate schön sauber sind, nicht? Schließlich kommen die Leute von weit her, um sie sich anzusehen.\n@c0@"
  en: "@aBianca@bGotta keep all the exhibits nice and tidy, eh?\r\nFolk come a long way to see 'em, after all.\n@c0@"
  es: "@aBianca@bHay que mantener todas las cosas bien limpias y ordenadas, ¿sabes?\n㈡\nLa gente viene desde muy lejos para verlas y todo eso.\n@c0@"
  fr: "@aBianca@bIl faut que les objets exposés soient toujours bien propres et bien disposés, heinⓡ Après tout, les gens viennent de loin pour les voir.\n@c0@"
  it: "@aBianca@bGli oggetti in esposizione devono essere tenuti puliti e in ordine, altrimenti i visitatori non saranno soddisfatti...\n@c0@"
  ja: "@a@bビアンカ「お客さんに見せるんだもん。\n\tいつもキレイに　しておかないとね。\n@c0@"
2:
  de: "@aNera@bWenn ich anfange sauberzumachen oder aufzuräumen, finde ich nie ein Ende.\n@c0@"
  en: "@aNera@bWhen I start cleaning or tidying, I never know when to stop.\n@c0@"
  es: "@aNera@bMa cuando empiezo a limpiare ya no sé cuando voy a parar.\n@c0@"
  fr: "@aNera@bQuand je commence à ranger et à nettoyer,\r\nje n'arrive jamais à m'arrêter.\n@c0@"
  it: "@aNera@bMi diverto a pulire, rassettare e mettere in ordine!\n@c0@"
  ja: "@a@bフローラ「私って　おそうじとか\n\t何かの　お手入れをはじめると\n\t止まらなくなってしまうんです。\n@c0@"
3:
  de: "@aNera@bIch finde es so fesselnd, so erfüllend. Es ist fast, als würde ich dabei meine eigene Seele reinigen.\n@c0@"
  en: "@aNera@bI find it so engrossing, so fulfilling. It's almost like I'm cleansing my own soul as I go.\n@c0@"
  es: "@aNera@bLo trovo veramente fascinante y me realiza. Es come si limpiara la mia alma mientras limpio.\n@c0@"
  fr: "@aNera@bC'est tellement captivant, tellement gratifiant. C'est presque comme si je nettoyais mon âme, au passage.\n@c0@"
  it: "@aNera@bMi sento felice e realizzata. È come se purificassi il mio spirito. Oh, insomma! Non guardarmi in quel modo! Sono fanatica dell'ordine e della pulizia, e allora?!\n@c0@"
  ja: "@a@bフローラ「自分の心のくもりも\n\tとれていくようで　すがすがしい\n\t気持ちになりますわ。\n@c0@"
4:
  de: "@a%0%a001240@bDieses riesige Museum gehört jetzt ganz allein dir, Papa? Ui!\n@c0@"
  en: "@a%0%a001240@bIs this huge museum all yours now, Dad? Wow!\n@c0@"
  es: "@a%0%a001240@b¿Este museo tan enorme es tuyo, papi? ¡Arrea!\n@c0@"
  fr: "@a%0%a001240@bCet immense musée est tout à toi, maintenant, papaⓡ Waouhⓠ\n@c0@"
  it: "@a%0%a001240@bPapà, ma è vero che ora questo bellissimo Museo è tutto tuo?\n@c0@"
  ja: "@a@b%a001240「こんな大きな博物館が\n\tお父さんのになったの？\n\tいいなあ～。\n@c0@"
5:
  de: "@a%0%a001250@bDas Tuch riecht gut.\n@c0@"
  en: "@a%0%a001250@bThis cloth smells quite nice.\n@c0@"
  es: "@a%0%a001250@bEste trapo huele muy bien.\n@c0@"
  fr: "@a%0%a001250@bIl sent bon, ce chiffon.\n@c0@"
  it: "@a%0%a001250@bChe buon profumo che ha questo panno!\n@c0@"
  ja: "@a@b%a001250「この布って　少し\n\tいい香りがするね。\n@c0@"
6:
  de: "@aSancho@bWeißt du, die Hausarbeit, das ist etwas, worin dein Onkel Sancho gar nisst schlesst ist.\n@c0@"
  en: "@aSancho@bYou know, the housework, ees esometheeng your Uncle Sancho ees very good at.\n@c0@"
  es: "@aSancho@bPues a tu tito Sancho se le da retebien chainear.\n@c0@"
  fr: "@aSancho@bTu sais, tonton Sancho est très d-d-doué\r\npour le ménage.\n@c0@"
  it: "@aSancho@bLo zio Sancho es muy bravo a fare las pulizias...\n¿Escommetto que no lo sapevi, eh?\n@c0@"
  ja: "@a@bサンチョ「お手入れなど　家事に\n\t関係するものならば　このサンチョも\n\t得意とするところですぞ。\n@c0@"
7:
  de: "@aOtto@bÄhm, ich bin grad zu b'schäftigt mit dem Aufpolier'n meiner Schwertkünste, als dass ich noch etwas anderes polier'n könnt'.\n@c0@"
  en: "@aTuppence@bEr, I'm rather busy polishing my sword skills at the moment to start polishing anything else.\n@c0@"
  es: "@aAlazar@bYo, estooo, es que estoy bastante ocupado sacando brillo a mi espada y no puedo sacar brillo a nada más.\n@c0@"
  fr: "@aInnocent@bEuh, pour l'instant, je suis un peu trop occupé à tenter de faire briller mes talents d'épéiste pour m'attaquer à quoi que ce soit d'autre.\n@c0@"
  it: "@aSimon@bSono davvero desolato, ma in questo momento sono troppo impegnato ad affinare le mie tecniche di combattimento per mettermi a fare le pulizie...\n@c0@"
  ja: "@a@bピピン「いえ……　私はまず\n\t剣のウデを　みがかないと……。\n@c0@"
8:
  de: "@aBianca@bIch habe immer bei den Blumenarrangements und so geholfen, als wir die Herberge in Wittenhausen hatten.\n@c0@"
  en: "@aBianca@bI often used to help out with flower arrangements and the like back when we ran that inn in Roundbeck.\n@c0@"
  es: "@aBianca@bCuando trabajaba en la posada de Golfo Blanco ayudaba a colocar las flores y todo eso, ¿sabes?\n@c0@"
  fr: "@aBianca@bÀ l'époque où on tenait l'auberge à Blanchecombe, j'aidais souvent à composer les bouquets pour la décoration, et tout ça.\n@c0@"
  it: "@aBianca@bRicordo che, quando gestivamo la locanda a Blankenburg, mi occupavo spesso della disposizione dei fiori e dei soprammobili...\n@c0@"
  ja: "@a@bビアンカ「アルカパにいた頃は\n\tよく　お店にお花とか　かざり付ける\n\tお手伝いをしてたんだけど\n@c0@"
9:
  de: "@aBianca@bAber Museumsstücke zu sortieren ist wohl nicht ganz das Gleiche, was?\n@c0@"
  en: "@aBianca@bI s'pose it's a bit different to sortin' out museum exhibits, though, eh?\n@c0@"
  es: "@aBianca@bClaro, que lo de colocar piezas de museo es un poco distinto, ¿no?\n@c0@"
  fr: "@aBianca@bMais je suppose que la disposition d'une collection dans un musée, ce n'est pas tout à fait pareil, nonⓡ\n@c0@"
  it: "@aBianca@bPerò mi rendo conto che curare l'esposizione degli oggetti in un museo è tutt'altro paio di maniche!\n@c0@"
  ja: "@a@bビアンカ「名産品の　ならべかたとは\n\tちがうしね……。\n@c0@"
10:
  de: "@aNera@bDu solltest die Dinge so arrangieren, dass sie dir gefallen.\n@c0@"
  en: "@aNera@bYou should lay things out just as you want them.\n@c0@"
  es: "@aNera@bDeberías colocar las cosas a il tuo gusto.\n@c0@"
  fr: "@aNera@bTu devrais disposer les objets comme tu l'entends.\n@c0@"
  it: "@aNera@bNon esiste un modo giusto e uno sbagliato di esporre gli oggetti. La disposizione dei manufatti riflette lo stato d'animo e la sensibilità di chi la cura.\n@c0@"
  ja: "@a@bフローラ「こういうのは\n\t好きなところに　好きな物を\n\t置いたほうが　いいんですのよ。\n@c0@"
11:
  de: "@aNera@bEs gibt dabei kein Richtig oder Falsch. Folge einfach deinem Gefühl.\n@c0@"
  en: "@aNera@bThere's no right or wrong way to do it, so just go with your instincts.\n@c0@"
  es: "@aNera@bVeramente, no hay una forma buena o mala de hacerlo, déjate llevar por tu instinto.\n@c0@"
  fr: "@aNera@bIl n'y a pas de bonne ou de mauvaise manière de faire, suis simplement ton instinct.\n@c0@"
  it: "@aNera@bSegui il tuo istinto e il tuo buon gusto, e vedrai che otterrai splendidi risultati.\n@c0@"
  ja: "@a@bフローラ「あなたの　思ったとおりに\n\t置けばいいと思いますわ。\n@c0@"
12:
  de: "@a%0%a001240@bIch würde lauter komisches Zeugs sammeln und daraus ein richtig tolles Museum machen.\n@c0@"
  en: "@a%0%a001240@bI'd collect all kinds of weird things and turn the place into a really good, fun museum.\n@c0@"
  es: "@a%0%a001240@bYo recogería todo tipo de cosas raras y haría un museo divertido.\n@c0@"
  fr: "@a%0%a001240@bMoi, je récupérerais plein de trucs bizarres et je transformerais cet endroit en un musée vraiment rigolo.\n@c0@"
  it: "@a%0%a001240@bSe fossi il direttore del Museo del Souvenir, esporrei un sacco di oggetti insoliti e divertenti, così verrebbero tante persone a visitarlo.\n@c0@"
  ja: "@a@b%a001240「ボクだったら\n\tおかしな物とか　いっぱいならべて\n\tおもしろい博物館にするよ。\n@c0@"
13:
  de: "@a%0%a001240@bWas hast du denn damit vor, Papa?\n@c0@"
  en: "@a%0%a001240@bWhat kind of plans have you got for it, Dad?\n@c0@"
  es: "@a%0%a001240@b¿Tú qué piensas hacer, papi?\n@c0@"
  fr: "@a%0%a001240@bEt toi, papa, est-ce que tu as des projets particuliersⓡ\n@c0@"
  it: "@a%0%a001240@bAnche tu la pensi così, papà?\n@c0@"
  ja: "@a@b%a001240「お父さんだったら\n\tどんなふうにしたい？\n@c0@"
14:
  de: "@a%0%a001250@bAnscheinend können wir hier tagsüber nicht viel tun. Nachts ist es mir in einem großen Museum aber nicht so ganz geheuer.\n@c0@"
  en: "@a%0%a001250@bLooks like we can't do much here during the day. I'm a bit scared of being in a big museum at night, though.\n@c0@"
  es: "@a%0%a001250@bParece que no hay mucho que hacer durante el día. Y por la noche me da un poco de miedo estar en un museo.\n@c0@"
  fr: "@a%0%a001250@bOn n'a pas le droit de faire grand-chose ici en journée, on dirait. Mais venir dans un musée la\nnuit, ça me fait un peu peur.\n@c0@"
  it: "@a%0%a001250@bQuesto posto mi annoia di giorno e mi spaventa di notte... Ho deciso: da grande NON farò la direttrice di un museo!\n@c0@"
  ja: "@a@b%a001250「いろいろするのは\n\t夜じゃないと　ダメなのね。　でも\n\t夜の博物館って　ちょっとこわいな。\n@c0@"
15:
  de: "@aSancho@bWeißt du nisst, was die Leute sagen? Man erkennt viel über einen Menschen, wenn man sieht, wie er die Dinge arrangiert.\n@c0@"
  en: "@aSancho@bYou know what people esay... You can tell muchos about a person by the way he arranges hees theengs.\n@c0@"
  es: "@aSancho@b¿Sabes lo que dice el dicho? Que el modo en que colocan las cosas las personas dice mucho sobre ellas.\n@c0@"
  fr: "@aSancho@bTu sais ce qu'on d-dit... on peut apprendre beaucoup de choses sur oune personne à la manière dont elle r-r-range ses affaires.\n@c0@"
  it: "@aSancho@bSe puede escoprire mucho de un hombre osservando el modo en cui mette en ordine las suas cosas.\n@c0@"
  ja: "@a@bサンチョ「物の　ならべ方によっても\n\tその人の　性格がわかると\n\t聞いたことがありますが……\n@c0@"
16:
  de: "@aSancho@bIss weiß, du machst das schon, Chico. Da habe iss gar keinen Zweifel.\n@c0@"
  en: "@aSancho@bI know you make the beautiful exhibits, friend. Ees no question een my mind.\n@c0@"
  es: "@aSancho@bSé que organizarás una exhibición bien linda, chamaco. No me cabe ni la menor duda.\n@c0@"
  fr: "@aSancho@bJe sais que tu f-f-feras oune exposition magnifique, chico. Je n'ai aucun d-doute là-dessus.\n@c0@"
  it: "@aSancho@b¡Basta guardare como disponi los souvenir por capire que sei una persona en gamba, chico!\n@c0@"
  ja: "@a@bサンチョ「%a000090王なら　どのように\n\tならべても　きっとすばらしい\n\t博物館になるでしょうな。\n@c0@"
17:
  de: "@aOtto@bAnscheinend können wir nur regionale Ausstellungsstücke zeigen. Das ist etwas schade.\n@c0@"
  en: "@aTuppence@bSounds like we can only exhibit regional souvenirs. That's a bit of a shame.\n@c0@"
  es: "@aAlazar@bParece que solo podemos exhibir souvenires regionales. Es una pena.\n@c0@"
  fr: "@aInnocent@bOn ne peut exposer ici que des souvenirs régionaux, apparemment. C'est un peu dommage.\n@c0@"
  it: "@aSimon@bNel Museo del Souvenir si possono esporre solo oggetti particolari, manufatti tipici delle rispettive aree geografiche di provenienza.\n@c0@"
  ja: "@a@bピピン「名産品　以外のものは\n\t置くことができないんですね。\n\tちょっと　ざんねんです。\n@c0@"
18:
  de: "@aBianca@bMeint er, dass er von unterschiedlichen Leuten unterschiedlich hohe Eintrittsgelder verlangt?\n@c0@"
  en: "@aBianca@bDoes he mean that he charges different entrance fees to different people?\n@c0@"
  es: "@aBianca@b¿Quiere decir que cobra entrada?\n@c0@"
  fr: "@aBianca@bMais alors, ça veut dire que le prix de l'entrée est\nà la tête du clientⓡ\n@c0@"
  it: "@aBianca@bUn museo è un luogo aperto al pubblico, mica un club privato dove inviti chi ti pare!\n@c0@"
  ja: "@a@bビアンカ「それって　人によって\n\t入場料がちがうってこと？\n@c0@"
19:
  de: "@aBianca@bDas ist ja wohl ganz schön frech, was? Aber schlau ausgedacht.\n@c0@"
  en: "@aBianca@bHe's a cheeky old thing, eh?\r\nPretty clever with it, mind!\n@c0@"
  es: "@aBianca@bQué tipo más espabilado, ¿eh?\r\n¡Muy listo!, ¿sabes?\n@c0@"
  fr: "@aBianca@bIl ne manque pas d'air, le papi, heinⓡ Mais c'est un malin, il faut le reconnaîtreⓠ\n@c0@"
  it: "@aBianca@bSe qualcuno paga per entrare, non puoi certo mandarlo via!\nA meno che non combini qualche guaio, ovvio...\n@c0@"
  ja: "@a@bビアンカ「あの　おじいさん\n\tけっこう　ずるい……　じゃなくて\n\tしっかりしてるのね。\n@c0@"
20:
  de: "@aNera@bIch finde, für sein Geld muss einem was geboten werden. Er sollte sich alle Ausstellungsstücke ruhig nach Herzenslust ansehen.\n@c0@"
  en: "@aNera@bI suppose you have to make the most of the\r\nmoney you pay out. He should have a good\r\nlook at all the exhibits.\n@c0@"
  es: "@aNera@bCredo que se debe sacar el máximo partido al dinero que se gasta. Debería disfrutar de las piezas del museo todo lo que quiera.\n@c0@"
  fr: "@aNera@bIl faut rentabiliser le prix de l'entrée, je suppose.\r\nIl a intérêt à bien regarder tous les objets.\n@c0@"
  it: "@aNera@bForse il tipo che gironzola al piano superiore si sta divertendo moltissimo, e vuole prolungare la visita al Museo il più possibile...\n@c0@"
  ja: "@a@bフローラ「それだけ　お金を出しても\n\t見る価値が　あるということですよね。\n\tよく考えればですけど……。\n@c0@"
21:
  de: "@a%0%a001240@bMir war nicht klar, dass der Eintritt so teuer ist.\n@c0@"
  en: "@a%0%a001240@bI didn't realise the entrance fee was that pricey.\n@c0@"
  es: "@a%0%a001240@bNo sabía que entrar en el museo era tan caro.\n@c0@"
  fr: "@a%0%a001240@bJe ne m'étais pas rendu compte que l'entrée était\nsi chère.\n@c0@"
  it: "@a%0%a001240@bMa quanto costa il biglietto per entrare al Museo?\n@c0@"
  ja: "@a@b%a001240「ここの博物館って　そんなに\n\t入場料が高かったの？\n@c0@"
22:
  de: "@a%0%a001250@bWahrscheinlich hat er beschlossen, so lange wie nur möglich zu bleiben, damit er für sein Geld so viel wie möglich bekommt.\n@c0@"
  en: "@a%0%a001250@bHe's probably decided to stay as long as he can so that he can get his money's worth.\n@c0@"
  es: "@a%0%a001250@bProbablemente haya decidido quedarse todo lo que pueda para sacarle partido a la entrada.\n@c0@"
  fr: "@a%0%a001250@bIl a probablement décidé de rester le plus longtemps possible afin d'en avoir pour son argent.\n@c0@"
  it: "@a%0%a001250@bProbabilmente ha deciso di restare più a lungo possibile, per sfruttare al massimo il biglietto d'ingresso che ha acquistato.\n@c0@"
  ja: "@a@b%a001250「お金を　いっぱい\n\tはらったから　ずっといるように\n\tなっちゃったのよ　きっと……。\n@c0@"
23:
  de: "@aSancho@bDas ist ein großes Museum, sí? Iss glaube, man braucht muchas Monedas, um es zu unterhalten. Sí, muchas Monedas.\n@c0@"
  en: "@aSancho@bEes a beeg place, sí? I believe eet takes\r\nmuchos garbanzos for upkeeping.\r\nSí, muchos, muchos garbanzos.\n@c0@"
  es: "@aSancho@bEste lugar es bien grande, ¿verdad? Creo que hace falta muchísimo dinero para mantenerlo.\r\nSí, chorroscientos de oro o algo.\n@c0@"
  fr: "@aSancho@bC'est oun très grand endroit, noⓡ J'imagine que ça coûte mucho à entretenir. Si, mucho mucho d'argent.\n@c0@"
  it: "@aSancho@bPor far funzionare un luego tanto grande, serve seguramentes mucho dinero. ¡Muchissimo dinero!\nYo me comm... No, esta vez no soy commossos.\n@c0@"
  ja: "@a@bサンチョ「これだけ大きな　建物ですから\n\t維持していくのに　お金が\n\tかかってしまうのでしょうか……。\n@c0@"
24:
  de: "@aOtto@bWer Geld nehmen will, nimmt Geld. Und wer wo bleiben will, bleibt da. So einfach ist das.\n@c0@"
  en: "@aTuppence@bPeople who take the money take the money.\r\nAnd people who want to stay in the same spot\r\nstay in the same spot. Simple as that.\n@c0@"
  es: "@aAlazar@bLa gente que cobra, cobra.\r\nY los que quieren quedarse, se quedan. Así de sencillo.\n@c0@"
  fr: "@aInnocent@bLes gens qui empochent l'argent, empochent l'argent, et les gens qui veulent rester au même endroit, restent au même endroit. C'est aussi simple que ça.\n@c0@"
  it: "@aSimon@bChi ha pagato per entrare nel Museo del Souvenir ha il diritto di restare fin quando vuole.\nIl ragionamento non fa una grinza, direi...\n@c0@"
  ja: "@a@bピピン「お金を　とる方も　とる方ですけど\n\tいすわる方も　いすわる方ですね。\n@c0@"
25:
  de: "@aBianca@bLangsam wird's ernst, was? Wenn wir jetzt auch noch eine Wache haben und so.\n@c0@"
  en: "@aBianca@bThat's a bit serious, en't it? Employin' a security guard and everythin'!\n@c0@"
  es: "@aBianca@bDa un poco de miedo, ¿eh? Un guardia de seguridad y todo.\n@c0@"
  fr: "@aBianca@bÇa ne plaisante pas, heinⓡ Il a même employé un gardien, et toutⓠ\n@c0@"
  it: "@aBianca@bAccidenti!\nAdesso al Museo c'è anche un sorvegliante!\nGli affari devono andar bene, eh?\n@c0@"
  ja: "@a@bビアンカ「警備の人を　やとうなんて\n\tだんだん　本格的になってきたわね。\n@c0@"
26:
  de: "@aNera@bEine Wache? Ja, das ist vermutlich keine dumme Idee. Es wäre schrecklich, wenn gestohlen würde, was wir unter solchen Mühen zusammengetragen haben.\n@c0@"
  en: "@aNera@bA security guard? Yes, I suppose it makes sense.\r\nIt would be terrible if things we went to so much effort to collect were stolen.\n@c0@"
  es: "@aNera@b¿Un guardia di sicurezza? Supongo que es lógico.\r\nSería terribile que robaran las cosas que ha costado tanto conseguir.\n@c0@"
  fr: "@aNera@bUn gardienⓡ Oui, finalement... ça se tient. Ce serait terrible si quelqu'un volait tous ces objets que nous avons mis tant de cœur à rassembler.\n@c0@"
  it: "@aNera@bAssumere un sorvegliante è stata un'ottima mossa: sarebbe un vero peccato se qualche ladro portasse via gli oggetti che abbiamo raccolto con tanta fatica.\n@c0@"
  ja: "@a@bフローラ「警備の人を……。\n\tそうですね。　せっかく集めたのに\n\t盗まれてしまっては　大変ですもの。\n@c0@"
27:
  de: "@a%0%a001240@bOb unser Neuzugang wohl überrascht war, als sich herausstellte, was der Alte Firle Franz in Wirklichkeit ist?\n@c0@"
  en: "@a%0%a001240@bI wonder if the person he employed was surprised when he saw what Old Man Nick Knack was like.\n@c0@"
  es: "@a%0%a001240@bMe pregunto si la persona que ha empleado se sorprendió cuando vio al abuelo Nino.\n@c0@"
  fr: "@a%0%a001240@bJe me demande si la personne qu'il a employée\na été surprise quand elle a vu à quoi ressemblait\nle vieux Bricabrac.\n@c0@"
  it: "@a%0%a001240@bChissà se il guardiano ha anche il compito di vegliare sul sonno di Geremia, oltre che sugli oggetti esposti al Museo... Eh eh eh!\n@c0@"
  ja: "@a@b%a001240「やとわれた人って\n\tあの　おじいさんの姿を見て\n\tビックリ　しなかったのかなあ？\n@c0@"
28:
  de: "@a%0%a001250@bDu bist wirklich schlau, dass du so wertvolle Sachen gesammelt hast, Papa!\n@c0@"
  en: "@a%0%a001250@bYou're really clever at collecting valuable items, Dad!\n@c0@"
  es: "@a%0%a001250@b¡Eres único para conseguir objetos de valor, papi!\n@c0@"
  fr: "@a%0%a001250@bTu es très doué pour récupérer des objets précieux, papaⓠ\n@c0@"
  it: "@a%0%a001250@bPapà, sei davvero bravo a trovare oggetti preziosi!\nSei un trovatesori eccezionale!\n@c0@"
  ja: "@a@b%a001250「お父さんって　貴重な物とか\n\t集めるの得意なんだね　すごい！\n@c0@"
29:
  de: "@aSancho@bIss hoffe nur, dass es hier keine Problemas gibt. Aber weißt du, manssmal müssen wir alle mit sslessten Umständen kämpfen.\n@c0@"
  en: "@aSancho@bI hope to the Goddess there are no problems here. But you know, esometimes the bad theengs, they come for us all.\n@c0@"
  es: "@aSancho@bPues espero que por la Diosa no haya problemas aquí, nomás.\r\nPero, a veces, a todos nos toca verla fea.\n@c0@"
  fr: "@aSancho@bJe p-p-prie la Déesse pour qu'il n'y ait pas de\r\np-problèmes ici. Mais tu sais, les mauvaises choses peuvent tomber sur t-t-tout le monde.\n@c0@"
  it: "@aSancho@b¿Sabe como se dice?\nⓕEsperiamo que el diablo no ce metta el codonⓖ.\nMe auguro que aquí non succeda nada de males...\n@c0@"
  ja: "@a@bサンチョ「何事もないことが　いいのですが\n\t万が一ということも　ありますからね。\n@c0@"
30:
  de: "@aOtto@bIch hab ja als Wache in der Burg gearbeitet, wie Ihr wisst.\n@c0@"
  en: "@aTuppence@bI worked as a guard at the castle, as you know.\n@c0@"
  es: "@aAlazar@bComo bien sabéis, era guardia del castillo.\n@c0@"
  fr: "@aInnocent@bComme vous le savez, j'ai travaillé comme garde\r\nau château.\n@c0@"
  it: "@aSimon@bCome ben sa, a Denim ero una guardia posta a protezione del castello...\n@c0@"
  ja: "@a@bピピン「私も　お城の警備を\n\tしたことがありますよ。\n@c0@"
31:
  de: "@aOtto@bAber mit Euch herumzureisen, das ist bisher das Beste, %a000090!\n@c0@"
  en: "@aTuppence@bBut travelling with you is my best job yet, %a000090!\n@c0@"
  es: "@aAlazar@bPero, por el momento, trabajar para vos ha sido el mejor trabajo que he tenido nunca, %a000090.\n@c0@"
  fr: "@aInnocent@bMais voyager avec vous est mon meilleur poste\nà ce jour, %a000090ⓠ\n@c0@"
  it: "@aSimon@bMa viaggiare insieme a lei è un compito molto più gratificante, re %a000090!\n@c0@"
  ja: "@a@bピピン「でも　今は　%a000090王との旅が\n\t何よりの務めです！\n@c0@"
32:
  de: "@aBianca@bGut, dass immer mehr Besucher kommen, nicht?\n@c0@"
  en: "@aBianca@bIt's good that we're gettin' more and more\r\ncustomers, eh?\n@c0@"
  es: "@aBianca@bEstá genial que cada vez tengamos más visitantes, ¿eh?\n@c0@"
  fr: "@aBianca@bC'est bien que l'on ait de plus en plus de clients, heinⓡ\n@c0@"
  it: "@aBianca@bAl Museo stanno arrivando sempre più visitatori.\nEvidentemente gli oggetti esposti riscontrano il favore del pubblico!\n@c0@"
  ja: "@a@bビアンカ「よかった。\n\tお客さんも　けっこう\n\t来てくれるようになったのね。\n@c0@"
33:
  de: "@aBianca@bDamals in der Herberge fand ich es auch immer schön, wenn wir viele Gäste hatten.\n@c0@"
  en: "@aBianca@bIt was always nice to see lots of customers back when we ran the inn too.\n@c0@"
  es: "@aBianca@bTambién me encantaba tener montones de huéspedes en la posada, ¿sabes?\n@c0@"
  fr: "@aBianca@bQuand on tenait l'auberge, c'était toujours agréable de voir arriver beaucoup de monde.\n@c0@"
  it: "@aBianca@bQuando avevamo la locanda, eravamo felici di avere tanti ospiti. Era bello vedere che la gente apprezzava il servizio che offrivamo.\n@c0@"
  ja: "@a@bビアンカ「うちが宿屋をやってた頃も\n\tお客さんが　いっぱい来てくれると\n\tすごく　うれしかったな。\n@c0@"
34:
  de: "@aNera@bDas muss die neue Empfangsdame sein. Das sieht hier immer mehr nach einem richtigen Museum aus!\n@c0@"
  en: "@aNera@bThat must be the receptionist there. This place is becoming more like a proper museum every day!\n@c0@"
  es: "@aNera@bDebe de ser la recepcionista. Este lugar, veramente, cada vez se parece più a un museo.\n@c0@"
  fr: "@aNera@bÇa doit être la réceptionniste, là-bas.\nCet endroit ressemble chaque jour un peu plus\nà un véritable muséeⓠ\n@c0@"
  it: "@aNera@bOra che c'è anche un'addetta alla reception, questo posto somiglia sempre di più a un vero museo.\n@c0@"
  ja: "@a@bフローラ「あちらの方が　受付なのね。\n\tこれで　すいぶん\n\t博物館らしくなりましたわ。\n@c0@"
35:
  de: "@a%0%a001240@bOb unser Neuzugang wohl überrascht war, als sich herausstellte, was der Alte Firle Franz in Wirklichkeit ist?\n@c0@"
  en: "@a%0%a001240@bI wonder if the person he employed was surprised when he saw what Old Man Nick Knack was like.\n@c0@"
  es: "@a%0%a001240@bMe pregunto si la persona que ha empleado se sorprendió cuando vio al abuelo Nino.\n@c0@"
  fr: "@a%0%a001240@bJe me demande si la personne qu'il a employée\na été surprise quand elle a vu à quoi ressemblait\nle vieux Bricabrac.\n@c0@"
  it: "@a%0%a001240@bChissà se l'addetta alla reception si troverà a suo agio a lavorare con Geremia...\n@c0@"
  ja: "@a@b%a001240「やとわれた人って\n\tあの　おじいさんの姿を見て\n\tビックリ　しなかったのかなあ？\n@c0@"
36:
  de: "@a%0%a001250@bOch! Ich wollte doch den Empfang übernehmen! Es hätte mir Spaß gemacht, die Leute im Museum zu begrüßen.\n@c0@"
  en: "@a%0%a001250@bOh! I wanted to be the receptionist. It'd be fun welcoming people to the museum.\n@c0@"
  es: "@a%0%a001250@b¡Ah! Yo quiero ser recepcionista. Debe de ser divertido dar la bienvenida a la gente al musenino.\n@c0@"
  fr: "@a%0%a001250@bOhⓠ Je voulais que ce soit moi, la réceptionniste.\nÇa aurait été amusant d'accueillir les gens au musée.\n@c0@"
  it: "@a%0%a001250@bLavorare alla reception di un museo dev'essere divertente.\nSi vedono tante facce nuove ogni giorno!\n@c0@"
  ja: "@a@b%a001250「わたしも　受付したかったな。\n\tいらっしゃいませ～　って。\n@c0@"
37:
  de: "@aSancho@bSí. Hätten die Leute bei der Ankunft gleiss als erstes dieses alte Gespenst gesehen, wäre das nisst gut fürs Geschäft gewesen.\n@c0@"
  en: "@aSancho@bSí. Eef the clientes, they are eseeing thees\r\nold espirit when they arrive, ees no eso good\r\nfor business.\n@c0@"
  es: "@aSancho@bPues sí. Que los clientes vean a ese ruco cuando llegan, no es bueno para el changarro.\n@c0@"
  fr: "@aSancho@bSi. Ça n'est pas t-t-très bon pour les affaires\r\nsi ce que voient les clients en arrivant, c'est\r\noun vieux fantôme.\n@c0@"
  it: "@aSancho@bEspero que los visitatores del Museo no se lascino impressionare dall'aspetto bizzarro del señor Geremia...\n@c0@"
  ja: "@a@bサンチョ「お客さんも　ここに来て\n\tはじめに会う人が　デスじいさんでは\n\tおどろいてしまいますからね。\n@c0@"
38:
  de: "@aOtto@bJetzt können wir uns entspannen in dem Wissen, dass alles wie von selbst lauf'n wird. Net, dass der alte Herr net Hervorragendes g'leistet hätte!\n@c0@"
  en: "@aTuppence@bNow we can relax in the knowledge that things will run themselves. Not that the old man wasn't doing a splendid job, of course.\n@c0@"
  es: "@aAlazar@bAhora podemos estar tranquilos sabiendo que las cosas irán como la seda. No es que el abuelo no estuviera haciéndolo bien, ni mucho menos.\n@c0@"
  fr: "@aInnocent@bOn peut maintenant souffler en sachant que les choses vont tourner toutes seules.\n㈡\nCela ne veut pas dire que le vieil homme ne faisait pas un bon travail, bien sûr.\n@c0@"
  it: "@aSimon@bOrmai il Museo del Souvenir è un'attrazione che richiama visitatori da tutto il mondo.\nDirei che abbiamo fatto proprio un ottimo lavoro.\n@c0@"
  ja: "@a@bピピン「これで安心して　博物館を\n\tまかせられます。　いえ　おじいさんが\n\t頼りないというわけでは……。\n@c0@"
39:
  de: "@aBianca@bEs wird sich lohnen, wenn sie uns mehr Besucher bringt. Ich will nur hoffen, dass das wirklich der Grund ist, weswegen er sie eingestellt hat!\n@c0@"
  en: "@aBianca@bIt'll be good if she brings in more customers. I just hope that's the only reason he's put her there!\n@c0@"
  es: "@aBianca@bSería estupendo si atrajese a más visitantes. Solo espero que ese sea el único motivo por el que la ha puesto aquí, ¿me entiendes?\n@c0@"
  fr: "@aBianca@bÇa serait bien si elle faisait venir plus de visiteurs. Et j'espère que c'est la seule raison qui l'a poussé\r\nà employer cette jeune fille.\n@c0@"
  it: "@aBianca@bSpero che quella tipa sappia accogliere i visitatori nel migliore dei modi... Del resto, è proprio per questo motivo che è stata assunta, no? \n@c0@"
  ja: "@a@bビアンカ「華やかに　なるのはいいけど\n\tまさか　おじいさんの個人的な\n\t好みとかじゃ……。\n@c0@"
40:
  de: "@aNera@bDer alte Firle Franz ist ein wenig rot geworden. Oder bilde ich mir das nur ein?\n@c0@"
  en: "@aNera@bOld Man Nick Knack's gone a little red in the face.\r\nOr am I just imagining it?\n@c0@"
  es: "@aNera@bSembra que el abuelo Nino se ha puesto un poco rosso.\r\n¿O es la mia immaginazione?\n@c0@"
  fr: "@aNera@bJ'ai rêvé ou le vieux Bricabrac a légèrement rougiⓡ\n@c0@"
  it: "@aNera@bÈ solo una mia impressione o il caro Geremia ha una certa simpatia per la ragazza della reception?\n@c0@"
  ja: "@a@bフローラ「おじいさんの　顔が\n\t少し　赤いような気がしたんですが\n\t気のせいでしょうか？\n@c0@"
41:
  de: "@a%0%a001240@bMit einer jungen Frau am Empfang wird hier also mehr los sein? Und was wäre gewesen, wenn wir einen Mann dafür eingestellt hätten?\n@c0@"
  en: "@a%0%a001240@bSo it'll get busier now we've got a young woman in reception? What would happen if we had a man?\n@c0@"
  es: "@a%0%a001240@bAsí que ahora que tenemos a una chica en la recepción, ¿la cosa irá mejor? ¿Qué hubiera pasado si hubiésemos tenido un hombre?\n@c0@"
  fr: "@a%0%a001240@bAlors il va y avoir plus de monde maintenant qu'il y a une jeune fille à la réceptionⓡ Et si ça avait été un homme, qu'est-ce qui se serait passéⓡ\n@c0@"
  it: "@a%0%a001240@bMa ora che c'è una ragazza alla reception, al Museo verranno più visitatori maschi?\n@c0@"
  ja: "@a@b%a001240「女の人だと　華やかに\n\tなるんだよね。　それじゃ\n\t男の人だとどうなるの？\n@c0@"
42:
  de: "@a%0%a001250@bHat sich der alte Firle Franz etwa verliebt?\n@c0@"
  en: "@a%0%a001250@bThe way Old Man Nick Knack's behaving...\nIs that what you'd call love-struck?\n@c0@"
  es: "@a%0%a001250@bEse comportamiento del abuelo Nino...\n¿Es eso lo que llaman amor a primera vista?\n@c0@"
  fr: "@a%0%a001250@bLe vieux Bricabrac se conduit bizarrement...\nEst-ce que c'est ça, un coup de foudreⓡ\n@c0@"
  it: "@a%0%a001250@bIl vecchio Geremia si sta comportando in modo strano... Secondo me la ragazza della reception lo ha fatto ringiovanire di colpo!\n@c0@"
  ja: "@a@b%a001250「あの　おじいさんの様子を\n\tデレデレしてる　って言うのよね？\n@c0@"
43:
  de: "@aSancho@bSí, sí. Durss die junge Señorita, die Atmosphäre hier wird gleiss viel netter, no? Irgendwie gleiss viel fröhlisser.\n@c0@"
  en: "@aSancho@bSí, sí. The young señorita, eshe makes a beeg difference to how the place feels, no?\r\nEes esomehow much more...happy.\n@c0@"
  es: "@aSancho@b¡Sí, sí! La señorita nomás que marca la diferencia en este lugar ¿verdad?\r\nAhorita este lugar está retechido.\n@c0@"
  fr: "@aSancho@bSi, si. La jeune señorita fait oune grande différence pour l'ambiance de cet endroit, noⓡ C'est oun peu plus... enjoué.\n@c0@"
  it: "@aSancho@b¡La bella señorita alla reception porterà seguramentes moltos nuevos visitatores al Museo!\nTodos hombres masculos, ovviamentes...\n@c0@"
  ja: "@a@bサンチョ「女性がいるのと　いないのとでは\n\tやはり　印象が大きくちがってくる\n\tものなのでしょうなあ。\n@c0@"
44:
  de: "@aOtto@bOh! Darf ich sie am Empfang unterstütz'n? ... Oh. Pardon. Ich hab nichts g'sagt.\n@c0@"
  en: "@aTuppence@bOh! Let me man reception with her!\n...Sorry. Forget I said a word.\n@c0@"
  es: "@aAlazar@b¡Oh! ¡Dejadme llevar la recepción con ella!\r\nEh, lo siento. Olvidad lo que he dicho.\n@c0@"
  fr: "@aInnocent@bOhⓠ Laissez-moi me charger de l'accueil avec elleⓠ\n... Désolé. Faites comme si je n'avais rien dit.\n@c0@"
  it: "@aSimon@bSecondo me la reception è diventata la parte più interessante di tutto il Museo del Souvenir...\n@c0@"
  ja: "@a@bピピン「ボクも　いっしょに　受付を……！\n\t…いえ　なんでもありません。\n@c0@"
45:
  de: "@aBianca@bSie bringt wirklich Schwung in den Laden, nicht? Die meisten Mädchen in ihrem Alter wollen lieber Tänzerin oder so was in der Art werden.\n@c0@"
  en: "@aBianca@bShe's a breath of fresh air, eh? Most girls of her type want to become dancin' girls and the like.\n@c0@"
  es: "@aBianca@bDa frescura al lugar, ¿eh? La mayoría de las chicas de su tipo quieren convertirse en bailarinas y cosas así.\n@c0@"
  fr: "@aBianca@bElle amène effectivement un peu de fraîcheur, heinⓡ\nLa plupart des filles comme elle veulent plutôt devenir danseuses, en général.\n@c0@"
  it: "@aBianca@bQuella ragazza ha cervello, oltre a tutto il resto... Molte sue coetanee sognano di diventare ballerine, invece lei ha scelto di lavorare in un museo.\n@c0@"
  ja: "@a@bビアンカ「めずらしい娘ね。\n\t踊り娘になりたいとかなら\n\tよく聞くんだけど。\n@c0@"
46:
  de: "@aNera@bEs ist wichtig, bei allem, was man tut, mit ganzem Herzen dabeizusein. So kann man wirklich brillieren.\n@c0@"
  en: "@aNera@bIt's important to throw yourself into whatever interests you have. That's how people really shine.\n@c0@"
  es: "@aNera@bEs molto importante sumergirse en todo lo que te interese. Così es como la gente brilla.\n@c0@"
  fr: "@aNera@bC'est important de se consacrer entièrement à ses centres d'intérêt. C'est comme ça que les gens révèlent leurs vrais talents.\n@c0@"
  it: "@aNera@bNon c'è nulla di meglio che lavorare nel campo del quale si è appassionati!\nÈ allora che si dà il meglio di sé!\n@c0@"
  ja: "@a@bフローラ「どんなことでも　興味を持って\n\t取り組むことは　大切です。\n\t人がいちばん　かがやける時ですもの。\n@c0@"
47:
  de: "@a%0%a001240@bHm, ich frage mich, wonach ich ganz verrückt bin. Mal sehen...\n@c0@"
  en: "@a%0%a001240@bI wonder what I'm crazy about. Let me see...\n@c0@"
  es: "@a%0%a001240@bMe pregunto qué me chiflará a mí. Déjame pensar...\n@c0@"
  fr: "@a%0%a001240@bJe me demande ce que j'adore, moi... Voyons un peu...\n@c0@"
  it: "@a%0%a001240@bMa io di cosa sono appassionato?\nAspetta che ora ci penso, eh!\n@c0@"
  ja: "@a@b%a001240「ボクが　興味あるのはね\n\tうーんと　うーんと……\n@c0@"
48:
  de: "@a%0%a001240@bHmpf! Jetzt bin ich ganz durcheinander! Die Auswahl ist einfach zu groß.\n@c0@"
  en: "@a%0%a001240@bHmph! Now I'm confused. There are far too many things to choose from.\n@c0@"
  es: "@a%0%a001240@b¡Mmm! ¡Estoy muy confuso! Hay demasiadas cosas entre las que elegir.\n@c0@"
  fr: "@a%0%a001240@bMmpfⓠ Je ne sais plus.\nJ'adore trop de choses, en fait.\n@c0@"
  it: "@a%0%a001240@bNo, non riesco a decidermi.\nCi sono troppe cose che mi piacciono...\n@c0@"
  ja: "@a@b%a001240「いっぱい　ありすぎて\n\t迷っちゃうな。\n@c0@"
49:
  de: "@a%0%a001250@bIhre Augen haben richtig geleuchtet. Sie muss wirklich glücklich über ihre neue Arbeit sein.\n@c0@"
  en: "@a%0%a001250@bHer eyes were really shiny. She must be ever so happy about getting her job.\n@c0@"
  es: "@a%0%a001250@bLe brillaban mucho los ojos. Debe de estar muy feliz por haber conseguido el puesto.\n@c0@"
  fr: "@a%0%a001250@bSes yeux brillaient beaucoup. Elle doit vraiment être très contente d'avoir obtenu ce travail.\n@c0@"
  it: "@a%0%a001250@bHai visto come brillavano gli occhi dell'addetta alla reception? Sembra proprio contenta di aver ottenuto questo lavoro!\n@c0@"
  ja: "@a@b%a001250「あの人　すごく目が\n\tキラキラしてたよ。\n\t本当に　うれしいのね。\n@c0@"
50:
  de: "@aSancho@bDiese Señorita, sie ist noch so jung, aber sie ist ein gutes Mädssen.\n@c0@"
  en: "@aSancho@bThees señorita, eshe ees young, but eshe ees esuch a good woman.\n@c0@"
  es: "@aSancho@bPues la señorita es bien joven, pero es una buena persona.\n@c0@"
  fr: "@aSancho@bCette s-s-señorita est jeune, mais c'est oune\r\nbonne fille.\n@c0@"
  it: "@aSancho@bQuella señorita es muy giovane, ma ha todas...\nEhm, todas las qualità por emergere nel lavoro.\n¡Caramba, que qualità que tiene la señorita!\n@c0@"
  ja: "@a@bサンチョ「ほう　まだお若いのに\n\t感心ですなあ。\n@c0@"
51:
  de: "@aOtto@bEs ist schön zu sehen, dass jemand so voller Leidenschaft von etwas spricht. Sie glüht ja förmlich vor Begeisterung!\n@c0@"
  en: "@aTuppence@bIt's lovely to see someone so passionate about something. She's practically aglow with excitement!\n@c0@"
  es: "@aAlazar@bMe encanta ver a alguien a quien le gusta tanto su trabajo. ¡Casi resplandece de alegría!\n@c0@"
  fr: "@aInnocent@bC'est charmant de voir une personne aussi passionnée. Elle s'illumine littéralement tant\nelle est enthousiasteⓠ\n@c0@"
  it: "@aSimon@bChissà se la ragazza alla reception nutre per le guardie di palazzo la stessa passione che sembra avere per il suo lavoro...\n@c0@"
  ja: "@a@bピピン「一生けんめいな人って\n\tステキですよね。\n\tとても　かがやいて見えます。\n@c0@"
52:
  de: "@aBianca@bWenn ich sie so sehe, dann erinnert mich das an die Zeit, als wir unsere Herberge hatten.\n@c0@"
  en: "@aBianca@bLooking at her reminds me of when we used to run the inn.\n@c0@"
  es: "@aBianca@bAl verla me acuerdo de cuando teníamos la posada, ¿sabes?\n@c0@"
  fr: "@aBianca@bQuand je la vois, ça me rappelle l'époque où on tenait l'auberge.\n@c0@"
  it: "@aBianca@bRicordo quando lavoravo nella nostra locanda...\n@c0@"
  ja: "@a@bビアンカ「あの子を見てると\n\tうちが宿屋だった頃を　思い出すわ。\n@c0@"
53:
  de: "@aBianca@bIch habe die Gäste oft begrüßt, so wie sie jetzt.\n@c0@"
  en: "@aBianca@bI often used to welcome the customers just like she's doin' now.\n@c0@"
  es: "@aBianca@bMuchas veces recibía a los clientes igual que ella y todo eso.\n@c0@"
  fr: "@aBianca@bJ'accueillais souvent les clients comme elle le fait ici.\n@c0@"
  it: "@aBianca@bAccoglievo i clienti nello stesso modo in cui l'addetta alla reception dà il benvenuto ai visitatori del Museo del Souvenir.\n@c0@"
  ja: "@a@bビアンカ「私も　よく　お客さんに\n\tいらっしゃいませって　言ってたっけ。\n@c0@"
54:
  de: "@aNera@bEiner der wichtigsten Regeln im Geschäftsleben besteht darin, die Kunden mit einem Lächeln zu begrüßen. Das sagt Papa jedenfalls immer.\n@c0@"
  en: "@aNera@bOne of the fundamentals of business is greeting your customers with a smile. That's what Papa says.\n@c0@"
  es: "@aNera@bUna de las cosas più importantes para un negozio es recibir a los clientes con una sonrisa. Eso es lo que dice il mio papino.\n@c0@"
  fr: "@aNera@bEn affaires, l'un des principes de base est de toujours accueillir ses clients avec le sourire.\r\nC'est ce que dit papa.\n@c0@"
  it: "@aNera@bMio padre dice che accogliere i clienti con un sorriso è fondamentale per avere successo, qualunque attività si svolga.\n@c0@"
  ja: "@a@bフローラ「元気なあいさつは　商売の基本。\n\t父がよくそう言ってましたわ。\n@c0@"
55:
  de: "@a%0%a001240@bSie ist wirklich mit Hingabe dabei, nicht? Wir sollten darauf achten, dass wir nicht von ihr ausgestochen werden.\n@c0@"
  en: "@a%0%a001240@bShe's really getting into it, isn't she? We'd better make sure we pull our weight too.\n@c0@"
  es: "@a%0%a001240@bSe lo está tomando en serio, ¿verdad? Será mejor que nosotros también cumplamos con nuestra parte.\n@c0@"
  fr: "@a%0%a001240@bElle se donne vraiment à fond, heinⓡ\nOn a intérêt à être à la hauteur, nous aussi.\n@c0@"
  it: "@a%0%a001240@bChe brava che è quella ragazza, eh?\nLavora qui da poco e ha già imparato a dire ⓕbuongiornoⓖ ai visitatori!\n@c0@"
  ja: "@a@b%a001240「はりきってるね　あのお姉さん。\n\tボクたちも　がんばらなきゃ！\n@c0@"
56:
  de: "@a%0%a001250@bDie Atmosphäre im Museum ist viel fröhlicher geworden, seit Kati Krams hier arbeitet.\n@c0@"
  en: "@a%0%a001250@bThe museum suddenly feels a lot brighter now that Sue Veneer's working here.\n@c0@"
  es: "@a%0%a001250@bEl museo parece resplandecer desde que Nuray Niada trabaja aquí.\n@c0@"
  fr: "@a%0%a001250@bLe musée semble d'un seul coup bien plus attrayant, maintenant que Marie-Jo Konde y travaille.\n@c0@"
  it: "@a%0%a001250@bNon c'è che dire: Sue Venir ha portato una ventata di freschezza e di gioventù nel Museo del Souvenir...\n@c0@"
  ja: "@a@b%a001250「お姉さんのおかげで\n\t博物館が　少し明るくなったような\n\t気がします。\n@c0@"
57:
  de: "@aSancho@bDie Möglisskeit, hier zu arbeiten, ist für diese Señorita viel wisstiger als die Ausstellungsstücke, no?\n@c0@"
  en: "@aSancho@bThe chance to work here, ees worth more to thees señorita than the exhibits themselves, no?\n@c0@"
  es: "@aSancho@bLa chanza de trabajar aquí vale más para la señorita que las mismísimas cosinas del museo, ¿verdad?\n@c0@"
  fr: "@aSancho@bLa possibilité de travailler ici signifie bien plus\npour cette señorita que les c-c-collections\nelles-mêmes, noⓡ\n@c0@"
  it: "@aSancho@bAlcunos visitatores danno l'impressione de essere venutos al Museo por ammirare el sorriso della señorita piuttosto que los oggettos en esposiziones...\n@c0@"
  ja: "@a@bサンチョ「ここで　はたらく　経験が\n\tあの方にとって　名産品をもしのぐ\n\t大きな財産になるといいですね。\n@c0@"
58:
  de: "@aOtto@bWas für eine schöne Stimme sie hat! Zählt mich zu ihren geheimen Verehrern!\n@c0@"
  en: "@aTuppence@bWhat a sweet voice she has.\r\nConsider me her secret admirer!\n@c0@"
  es: "@aAlazar@b¡Qué voz tan dulce!\r\nConsideradme su admirador secreto.\n@c0@"
  fr: "@aInnocent@bQuelle voix magnifique elle possède. Considérez que je suis l'un de ses admirateurs secretsⓠ\n@c0@"
  it: "@aSimon@bAh, la voce della bella addetta alla reception è soave come quella di un usignolo... Temo di essere caduto vittima dei dolci strali di Cupido!\n@c0@"
  ja: "@a@bピピン「かわいい声でしたね。\n\tボクも　カゲながら\n\tおうえんしちゃいますよっ！\n@c0@"
59:
  de: "@aBianca@bWir sollten besser versuchen, etwas zum Ausstellen zu finden, nicht? Schließlich hat er uns sein Museum anvertraut.\n@c0@"
  en: "@aBianca@bWe'd better try and find somethin' to put on show, eh? He's trusted us with this place, after all.\n@c0@"
  es: "@aBianca@bSerá mejor que encontremos algo que exhibir y tal. Al fin y al cabo, nos ha confiado este lugar, ¿sabes?\n@c0@"
  fr: "@aBianca@bOn a intérêt à trouver quelque chose à exposer, heinⓡ C'est à nous qu'il a confié cet endroit,\naprès tout.\n@c0@"
  it: "@aBianca@bDovremmo darci da fare per trovare qualche souvenir...\nNon vorrai mica deludere il caro Geremia, eh?!\n@c0@"
  ja: "@a@bビアンカ「やっぱり　何かかざった方が\n\tいいんじゃない？　せっかく\n\tゆずってもらった博物館なんだし。\n@c0@"
60:
  de: "@aNera@bJa, ohne Ausstellungsstücke macht das schönste Museum nicht viel her.\n@c0@"
  en: "@aNera@bYes, it's not much of a museum without any exhibits, I suppose.\n@c0@"
  es: "@aNera@bSin niente que exhibir no es veramente un museo.\n@c0@"
  fr: "@aNera@bOui, un musée sans rien d'exposé n'est pas vraiment un musée, c'est vrai.\n@c0@"
  it: "@aNera@bBeh, ha ragione.\nSenza oggetti da esporre questo posto non si può certo definire un museo, no?\n@c0@"
  ja: "@a@bフローラ「博物館なのに\n\t何も置かれてないというのは\n\tやはり　さみしいですわよね……。\n@c0@"
61:
  de: "@a%0%a001240@bMeinst du nicht, wir sollten etwas ausstellen, Papa? Der alte Mann schien etwas unglücklich zu sein.\n@c0@"
  en: "@a%0%a001240@bDon't you think we should put something on display, Dad? The old man seems a bit unhappy.\n@c0@"
  es: "@a%0%a001240@b¿No crees que deberíamos exhibir algo, papi? El abuelete parece triste.\n@c0@"
  fr: "@a%0%a001240@bTu ne crois pas qu'on pourrait mettre quelque chose en exposition, papaⓡ Le vieil homme n'a pas l'air\ntrès content.\n@c0@"
  it: "@a%0%a001240@bPapà, il vecchio signore ha ragione: dovremmo trovare qualche oggetto da esporre...\n@c0@"
  ja: "@a@b%a001240「お父さん　何もかざらないの？\n\tおじいさん　かわいそうだよ。\n@c0@"
62:
  de: "@a%0%a001250@bIch weiß! Warum packen wir heute Abend nicht ganz viele Stücke in die Ausstellung und überraschen den alten Firle Franz damit?\n@c0@"
  en: "@a%0%a001250@bI know! Why don't we put lots of things on display tonight and give Old Man Nick Knack a nice surprise? \n@c0@"
  es: "@a%0%a001250@b¡Ya sé! ¿Y si ponemos un montón de cosas en los pedestales esta noche y le damos una sorpresa al abuelo Nino?\n@c0@"
  fr: "@a%0%a001250@bJe saisⓠ Et si on venait cette nuit mettre plein d'objets en exposition pour faire une jolie surprise au vieux Bricabracⓡ\n@c0@"
  it: "@a%0%a001250@bFacciamo una bella sorpresa a Geremia?\nRiempiamogli il Museo di tanti bei souvenir!\n@c0@"
  ja: "@a@b%a001250「ねえ　お父さん。\n\t夜になったら　いっぱいならべて\n\tおじいさんを　びっくりさせよう？\n@c0@"
63:
  de: "@aSancho@bDas ist doch eine Verschwendung, oder etwa nisst? Dieses Museum, es ist so leer.\n@c0@"
  en: "@aSancho@bEes a waste, no? The place, ees eso empty.\n@c0@"
  es: "@aSancho@bMenudo desperdicio. Este lugar está retevacío.\n@c0@"
  fr: "@aSancho@bC'est oun gâchis, noⓡ Cet endroit est t-tout vide.\n@c0@"
  it: "@aSancho@bVedere esto luego todo vuoto me riempie el corazon de tristezza...\nYo... Yo... ¡Sob! Soy commossos...\n@c0@"
  ja: "@a@bサンチョ「う～ん　このままですと\n\t宝の持ちぐされという　感じですね。\n@c0@"
64:
  de: "@aOtto@bEs ist so ein riesiger Bau. Man könnt' so viel damit anfangen, wenn man es net als Museum nutz'n würd'.\n@c0@"
  en: "@aTuppence@bIt's such a huge building. There are so many things you could do with it apart from making it a museum.\n@c0@"
  es: "@aAlazar@bEs un edificio inmenso. Podríamos hacer tantas cosas con él además de usarlo como museo.\n@c0@"
  fr: "@aInnocent@bCe bâtiment est si grand. On pourrait en faire tellement d'autres choses qu'un musée.\n@c0@"
  it: "@aSimon@bQuest'edificio è enorme, ed è anche molto bello.\nSecondo me, è sprecato come museo.\n@c0@"
  ja: "@a@bピピン「これだけ　大きな建物なんですから\n\tなにも　博物館でなくても……。\n@c0@"
65:
  de: "@aOtto@bIch würd' mir hier einen herrlichen Palast einricht'n... Hoppala! Da hab ich mich wohl ein wenig mitreiß'n lass'n.\n@c0@"
  en: "@aTuppence@bI'd turn it into my own delicious-looking castle.\r\n...Oops! Listen to me getting carried away!\n@c0@"
  es: "@aAlazar@bPodría convertirse en mi propio castillo.\r\n¡Uuuy! ¡No digo más que tonterías!\n@c0@"
  fr: "@aInnocent@bJe pourrais le transformer en splendide château privé... Oupsⓠ Écoutez-moi donc divaguer tout seulⓠ\n@c0@"
  it: "@aSimon@bAl posto di Geremia, lo trasformerei in un albergo di lusso dotato di sauna, palestra e...\nOps! Devo smetterla di sognare a occhi aperti...\n@c0@"
  ja: "@a@bピピン「ボクだったら\n\tやっぱり　自分の城を…\n\tあっ　いえ　何でもありません。\n@c0@"
66:
  de: "@aBianca@bEr hat recht. Es hat keinen Zweck, sich über die Anordnung Gedanken zu machen, wenn es gar nicht viel anzuordnen gibt.\n@c0@"
  en: "@aBianca@bHe has a point. It's no good worryin' about how things are laid out if we don't have much to lay\r\nout in the first place.\n@c0@"
  es: "@aBianca@bLleva algo de razón, ¿sabes? No tiene mucho sentido preocuparse de cómo colocar las cosas si casi no tenemos cosas que colocar.\n@c0@"
  fr: "@aBianca@bIl marque un point. Ça ne rime pas à grand-chose\r\nde réfléchir à la disposition de la collection s'il n'y a presque rien à exposer.\n@c0@"
  it: "@aBianca@bHa ragione.\nDobbiamo arricchire la collezione del Museo.\nA come sistemare gli oggetti penseremo dopo...\n@c0@"
  ja: "@a@bビアンカ「そうよね。　ならべようにも\n\tかんじんの　名産品がなければ\n\tならべられないし。\n@c0@"
67:
  de: "@aNera@bIch muss zugeben, ich bin mit meinen Gedanken immer beim Arrangieren der Exponate, obwohl wir noch gar nicht viel zum Ausstellen haben.\n@c0@"
  en: "@aNera@bI'm afraid I can't help becoming preoccupied with how to display things, even when we don't have much to display in the first place.\n@c0@"
  es: "@aNera@bMe temo que no puedo evitare preocuparme sobre cómo colocar las cosinas, aunque no tengamos casi niente que colocar.\n@c0@"
  fr: "@aNera@bJe ne peux pas m'empêcher de m'inquiéter de la façon dont seront disposés les objets, même si nous n'avons pas grand-chose à exposer pour l'instant.\n@c0@"
  it: "@aNera@bCurare l'esposizione degli oggetti non sarà facile.\nIn ogni caso al momento non abbiamo molti souvenir da sistemare sui piedistalli...\n@c0@"
  ja: "@a@bフローラ「私は　たとえ少なくても\n\tいいならべ方を　考えてしまいます。\n\tこういう事は　気になってしまって。\n@c0@"
68:
  de: "@a%0%a001240@bEs macht Spaß, viele Ausstellungsstücke zu sammeln. Los, suchen wir noch ein paar!\n@c0@"
  en: "@a%0%a001240@bIt's fun trying to collect lots of exhibits.\nLet's go off hunting for some more!\n@c0@"
  es: "@a%0%a001240@bEs diver conseguir un montón de cosinas que exhibir.\n¡Vamos por más!\n@c0@"
  fr: "@a%0%a001240@bC'est rigolo d'essayer de trouver plein d'objets. Allez, on part en chercher d'autresⓠ\n@c0@"
  it: "@a%0%a001240@bMi diverto tantissimo a cercare i souvenir per il Museo!\nPerché non vediamo di trovarne qualche altro?\n@c0@"
  ja: "@a@b%a001240「物を集めていくのって\n\t楽しいよね！\n\tもっと　たくさん集めようよ！\n@c0@"
69:
  de: "@a%0%a001250@bIch hoffe, wir finden viele Andenken, die wir ausstellen können.\n@c0@"
  en: "@a%0%a001250@bI hope we manage to find lots of souvenirs to put\non display.\n@c0@"
  es: "@a%0%a001250@bEspero que podamos encontrar montones de souvenires que exhibir.\n@c0@"
  fr: "@a%0%a001250@bJ'espère qu'on arrivera à trouver plein de pièces de collection pour les exposer ici.\n@c0@"
  it: "@a%0%a001250@bSpero che troveremo tanti oggetti da aggiungere alla collezione del Museo del Souvenir.\n@c0@"
  ja: "@a@b%a001250「ここを　名産品で\n\tいっぱいに　できたらいいね。\n@c0@"
70:
  de: "@aSancho@bEs ist nisst wisstig, ob man viele Exponate hat oder nisst so viele. Hauptsache, man arrangiert alles so, wie es einem gefällt, nisst wahr?\n@c0@"
  en: "@aSancho@bEes no important eef you have many exhibits or no eso many. The fun, ees een making your own especial collection, sí?\n@c0@"
  es: "@aSancho@bNo es importante si tienes muchas cosas que exhibir o no. La diversión está en crear tu propia colección.\n@c0@"
  fr: "@aSancho@bÇa n'est p-pas important d'avoir beaucoup d'objets ou non. Ce qui est amusant, c'est de c-c-créer sa propre collection espéciale, noⓡ\n@c0@"
  it: "@aSancho@bEs bueno que abbiamo la libertà de aggiungere alla collezione del Museo todos los oggettos que vogliamo, senza dover rendere conto a nessunos...\n@c0@"
  ja: "@a@bサンチョ「多くても　少なくても\n\tこだわりをもって　ならべてゆくのも\n\tひとつの　楽しみ方ですよ。\n@c0@"
71:
  de: "@aOtto@bJe mehr wir find'n können, desto besser. Abwechslung ist das halbe Leben, net wahr?\n@c0@"
  en: "@aTuppence@bThe more things we can find, the merrier.\r\nVariety is the spice of life and all that.\n@c0@"
  es: "@aAlazar@bCuantas más cosinas encontremos, mejor.\r\nEn la variedad está el gusto y todo eso.\n@c0@"
  fr: "@aInnocent@bPlus on trouvera d'objets, mieux ce sera.\r\nC'est la diversité qui fait l'intérêt.\n@c0@"
  it: "@aSimon@bPiù souvenir troveremo, meglio sarà per il Museo.\nDopotutto la varietà è l'essenza della vita, no?\n@c0@"
  ja: "@a@bピピン「こういう物は　多ければ\n\t多いほど　いいですよね。\n@c0@"
72:
  de: "@aBianca@bJa, aber es wäre schön, wenn die Leute von weither kämen, um sich die Sachen anzusehen, nachdem wir nun schon so viel Arbeit hineingesteckt haben, oder?\n@c0@"
  en: "@aBianca@bYeah, but it would be nice if people did come flockin' to see after all the effort we've gone to, eh?\n@c0@"
  es: "@aBianca@bSí, pero esperemos que venga un montón de gente después de todo lo que nos ha costado, ¿sabes?\n@c0@"
  fr: "@aBianca@bOui, mais après tous les efforts qu'on a fournis,\nce serait bien que les gens fassent quand même\nla queue pour venir admirer ces objets, nonⓡ\n@c0@"
  it: "@aBianca@bSe arriveranno molti visitatori, sapremo che i nostri sforzi non saranno stati vani!\n@c0@"
  ja: "@a@bビアンカ「せっかく　ならべたんだから\n\tやっぱり　たくさんのお客さんに\n\t見てもらいたいな。\n@c0@"
73:
  de: "@aNera@bIch kann's kaum abwarten, die Besucher herbeiströmen zu sehen!\n@c0@"
  en: "@aNera@bI can hardly wait until we start to see the customers flooding in!\n@c0@"
  es: "@aNera@b¡Veramente, estoy deseando ver a los visitantes viniendo en manada!\n@c0@"
  fr: "@aNera@bJ'ai hâte de voir la file d'attente s'allonger devant\nla porteⓠ\n@c0@"
  it: "@aNera@bNon vedo l'ora che arrivino tanti visitatori ad ammirare gli oggetti che abbiamo raccolto!\n@c0@"
  ja: "@a@bフローラ「お客さんが　来てくださる日が\n\t待ちどおしいですわね。\n@c0@"
74:
  de: "@a%0%a001240@bIch hoffe, wir bekommen bald jede Menge Besucher.\n@c0@"
  en: "@a%0%a001240@bI hope we get lots of customers soon.\n@c0@"
  es: "@a%0%a001240@bEspero que pronto tengamos montones de visitantes.\n@c0@"
  fr: "@a%0%a001240@bJ'espère qu'on aura bientôt plein de clients.\n@c0@"
  it: "@a%0%a001240@bSpero che al Museo arrivino tante persone, così Geremia sarà contento!\n@c0@"
  ja: "@a@b%a001240「はやく　お客さんが\n\t来るといいね。\n@c0@"
75:
  de: "@a%0%a001250@bWas meinst du, wie er die Ausstellung bekannt gemacht hat, wo er doch ein Gespenst ist und so?\n@c0@"
  en: "@a%0%a001250@bHow do you suppose he's started the news spreading, what with being a ghost and everything?\n@c0@"
  es: "@a%0%a001250@b¿Cómo crees que va a hacer correr la voz?\nComo es un fantasma y todo eso.\n@c0@"
  fr: "@a%0%a001250@bTu crois qu'il s'y est pris comment pour répandre\nla nouvelle, vu que c'est un fantômeⓡ\n@c0@"
  it: "@a%0%a001250@bCredo che al Museo serva un bel po' di pubblicità, oltre a tanti oggetti interessanti da mettere in esposizione...\n@c0@"
  ja: "@a@b%a001250「おじいさん　ゆうれいなのに\n\tどうやって　ウワサを流したのかな？\n@c0@"
76:
  de: "@aSancho@bWenn die Leute reden, verbreiten siss die Gerüsste in Windeseile, weißt du. Iss glaube, du wirst bald viele, viele Besucher haben.\n@c0@"
  en: "@aSancho@bWhen people talk, eet espreads like the wild fires, you know. I believe you gonna have many, many clientes esoon.\n@c0@"
  es: "@aSancho@bPues cuando la gente platica, los rumores se extienden como la pólvora. Pronto vendrán chorroscientos visitantes.\n@c0@"
  fr: "@aSancho@bLe bouche à oreille va t-t-très vite, tu sais. Je crois que tu auras rapidement oun paquet de visiteurs.\n@c0@"
  it: "@aSancho@bLa mejor publicidad por el Museo del Souvenir sarà el ⓕpassapalabraⓖ. ¿Sabe como se dice?\n¡Un visitator soddisfatto ne attira muchos altros!\n@c0@"
  ja: "@a@bサンチョ「ウワサというのは　広がるのが\n\t早いですからね。　きっと近いうちに\n\tお客さんが来てくれますよ。\n@c0@"
77:
  de: "@aOtto@bAlso, ich glaub', dass ein g'spensterhafter alter Mann Gerüchte verbreitet, ist schon Gerücht genug!\n@c0@"
  en: "@aTuppence@bI should think the fact that a ghostly old man has been spreading rumours about the place is enough\r\nof a rumour in itself!\n@c0@"
  es: "@aAlazar@bSupongo que el que un abuelo fantasmal haya estado corriendo la voz sobre el lugar ya es como para que corra la voz de por sí.\n@c0@"
  fr: "@aInnocent@bÀ mon avis, le fait qu'un vieux fantôme ait fait circuler des informations sur cet endroit est déjà une rumeur en soiⓠ\n@c0@"
  it: "@aSimon@bUn tipo originale e ⓕanticoⓖ come il vecchio Geremia è di per sé un'attrazione da museo, no? Eh eh eh!\nEhm, ho detto antico? Intendevo dire longevo...\n@c0@"
  ja: "@a@bピピン「ゆうれいの　おじいさんが\n\tウワサを流してること自体が\n\tウワサになりそうですね。\n@c0@"
78:
  de: "@aBianca@bDas sieht auf jeden Fall sehr hübsch aus, aber es ist vielleicht nicht jedermanns Sache.\n@c0@"
  en: "@aBianca@bIt certainly makes the place look nice and pretty,\r\nbut it might not be everyone's cup of tea.\n@c0@"
  es: "@aBianca@bLa verdad es que mejora el aspecto del lugar y todo eso, pero igual no es del gusto de todos, ¿sabes?\n@c0@"
  fr: "@aBianca@bC'est vrai que ça donne un certain cachet\r\nà cet endroit, mais que ça peut ne pas\r\nplaire à tout le monde.\n@c0@"
  it: "@aBianca@bCerto, così il museo ha un fascino tutto particolare, ma...\nEcco, direi che un po' di varietà non guasterebbe.\n@c0@"
  ja: "@a@bビアンカ「これは　これでキレイだけど\n\t見に来てくれる人が\n\tかぎられちゃうかも知れないわね。\n@c0@"
79:
  de: "@aNera@bEs ist ungewöhnlich, dass ein Museum nur eine Sache ausstellt. Aber ich bin nicht sicher, dass es eine so gute Idee ist.\n@c0@"
  en: "@aNera@bIt's unusual for a museum to only display one thing. I'm not so sure it's a good idea, though.\n@c0@"
  es: "@aNera@bNo es muy normale que en un museo se exhiba solo una cosa. Non credo que sea una buona idea.\n@c0@"
  fr: "@aNera@bC'est original pour un musée de n'exposer qu'un seul type d'objet. Mais je ne suis pas sûre que ce soit une bonne idée pour autant.\n@c0@"
  it: "@aNera@bEhm, non penso sia una buona idea esporre tante copie dello stesso oggetto...\nSistemato così, il Museo è incredibilmente noioso!\n@c0@"
  ja: "@a@bフローラ「展示する物を　限定した博物館も\n\tめずらしいとは　思いますが……。\n@c0@"
80:
  de: "@a%0%a001240@bBei so vielen Wüstenrosen auf einmal komme ich mir vor wie in der Wüste. Jetzt fühle ich mich total erhitzt und verschwitzt.\n@c0@"
  en: "@a%0%a001240@bLooking at so many desert roses reminds me of being in the desert. Now I feel all hot and bothered!\n@c0@"
  es: "@a%0%a001240@bVer tantas rosas del desierto juntas me recuerda al desierto. ¡Ahora me siento todo acalorado!\n@c0@"
  fr: "@a%0%a001240@bQuand je regarde toutes ces roses des sables, ça me rappelle le désert. Maintenant, j'ai l'impression d'avoir chaud et d'être tout en sueurⓠ\n@c0@"
  it: "@a%0%a001240@bCon tutte queste rose, mi sembra di stare in una serra!\nNon potremmo aggiungere qualcosa di diverso?\n@c0@"
  ja: "@a@b%a001240「さばくのバラを　見てたら\n\t本当の砂漠を　思い出して\n\t暑くなってきちゃった。\n@c0@"
81:
  de: "@a%0%a001250@bEs ist so hübsch und meditativ, nur Dinge aus der Natur in der Ausstellung zu haben. Mir gefällt unser Museum so, wie es ist.\n@c0@"
  en: "@a%0%a001250@bIt's nice and spiritual just having natural things on display. I like our museum just the way it is.\n@c0@"
  es: "@a%0%a001250@bEstá bien y es muy espiritual exhibir solo cosas naturales. Me gusta el museo tal y como está.\n@c0@"
  fr: "@a%0%a001250@bN'exposer que des objets naturels, je trouve ça plutôt beau et ça donne une dimension spirituelle. J'aime bien notre musée tel qu'il est.\n@c0@"
  it: "@a%0%a001250@bA me piace essere circondata da rose del deserto, ma forse i visitatori vorrebbero vedere anche altri tipi di souvenir...\n@c0@"
  ja: "@a@b%a001250「自然の芸術品て　神秘的ね。\n\t私はこのままでも　いいと思うけどな。\n@c0@"
82:
  de: "@aSancho@bSí, sí. Es sind viele Rosen. Viele, viele, viele Rosen. ... Es sind wirkliss sehr viele Rosen... no?\n@c0@"
  en: "@aSancho@bSí, sí. Ees many roses. Many, many roses.\nEes, er...time for felicitations...sí?\n@c0@"
  es: "@aSancho@b¡Ándale! Demasiadas rosas. Parece árbol de navidad.\r\n¿Es que es la fiesta de la rosa?\n@c0@"
  fr: "@aSancho@bSi, si. Beaucoup de roses. Vraiment beaucoup, beaucoup de r-roses. C'est, euh... le moment\ndes félicitations, siⓡ\n@c0@"
  it: "@aSancho@b¡Caramba, quantas rosas del desierto!\n¿Sono muy bellas, ma non piensi que dovremmo rendere el Museo del Souvenir un poco más vario?\n@c0@"
  ja: "@a@bサンチョ「しかし　よくぞこれだけ\n\t集められましたね。\n\tさすがというか　なんというか……。\n@c0@"
83:
  de: "@aOtto@bDer alte Mann sieht ein bisserl grantig im G'sicht aus. Ich würd' sagen, er ist net allzu zufried'n mit Euch, %a000090.\n@c0@"
  en: "@aTuppence@bThe old man looks a bit pinched there. I'd say he's none too pleased with you, %a000090.\n@c0@"
  es: "@aAlazar@bA mí me da que el abuelo está algo enfadado. Parece que no está demasiado satisfecho con vos, %a000090.\n@c0@"
  fr: "@aInnocent@bLe vieil homme avait un air un peu pincé.\nJ'ai l'impression qu'il n'est pas tellement\ncontent de vous, %a000090.\n@c0@"
  it: "@aSimon@bMaestà, temo che il vecchio Geremia non condivida affatto la sua scelta di dedicare l'intero Museo del Souvenir alle pur splendide rose del deserto...\n@c0@"
  ja: "@a@bピピン「おじいさん　ため息ついてますよ。\n\tあんまり　うれしくないみたいですね。\n@c0@"
84:
  de: "@aBianca@bHier sieht's eher aus wie in einem Schokomünzen-Laden als wie in einem Museum!\n@c0@"
  en: "@aBianca@bThe place is more like a chocolate medalliyum sweet shop than a museum!\n@c0@"
  es: "@aBianca@b¡Este sitio parece más una tienda de medallones de chocolate que un museo, ¿sabes?!\n@c0@"
  fr: "@aBianca@bCet endroit ressemble plus à un magasin de médailles en chocolat qu'à un muséeⓠ\n@c0@"
  it: "@aBianca@bMa questo è il Museo del Souvenir o ⓕil paradiso dei ghiottoniⓖ?!\n@c0@"
  ja: "@a@bビアンカ「これじゃあ　博物館というより\n\tメダル型チョコ専門店ね……。\n@c0@"
85:
  de: "@aNera@bWir müssen aufpassen, dass uns der süße Geruch nicht zu Kopf steigt.\n@c0@"
  en: "@aNera@bWe'll have to be careful not to let the sweet smell go to our heads.\n@c0@"
  es: "@aNera@bDebemos andare con cuidado para que no se nos suba el olor a dolce a la testa.\n@c0@"
  fr: "@aNera@bNous avons intérêt à ne pas laisser le parfum du chocolat nous monter à la tête.\n@c0@"
  it: "@aNera@bTroppo cioccolato, troppe calorie...\nNon credo che le visitatrici apprezzeranno questa particolarissima e ⓕdolcissimaⓖ esposizione.\n@c0@"
  ja: "@a@bフローラ「甘いにおいで\n\tのぼせてしまわないように\n\t気をつけてくださいね。\n@c0@"
86:
  de: "@a%0%a001240@bDu magst Schokolade, Papa, nicht? Ich kann nie genug davon kriegen!\n@c0@"
  en: "@a%0%a001240@bYou like chocolate, don't you, Dad?\nI can't get enough of it!\n@c0@"
  es: "@a%0%a001240@bTe gusta el chocolate, ¿a que sí papi?\nA mí es que me vuelve loco.\n@c0@"
  fr: "@a%0%a001240@bTu aimes le chocolat, hein, papaⓡ\nMoi, j'en mangerais tout le tempsⓠ\n@c0@"
  it: "@a%0%a001240@bPapà, vedo che anche a te piace il cioccolato.\nIo ne vado pazzo!\n@c0@"
  ja: "@a@b%a001240「お父さんも\n\tチョコが　好きなんだね。\n\tボクも　チョコレートは　大好きだよ！\n@c0@"
87:
  de: "@a%0%a001250@bWie viel hast du für all die Schokolade ausgegeben, Papa? Findest du nicht, dass das eine ziemliche Verschwendung ist?\n@c0@"
  en: "@a%0%a001250@bHow much did you spend on all that chocolate, Dad? Don't you think it was a bit of a waste?\n@c0@"
  es: "@a%0%a001250@b¿Cuánto oro te has gastado en todo ese chocolate, papi? ¿No te parece que es un desperdicio?\n@c0@"
  fr: "@a%0%a001250@bCombien as-tu dépensé pour acheter tout ce chocolat, papaⓡ Tu ne crois pas que c'est\nun peu du gâchisⓡ\n@c0@"
  it: "@a%0%a001250@bQuesto posto trabocca di cioccolato!\nNon riuscirei a mangiarlo tutto nemmeno se campassi fino all'età di Geremia!\n@c0@"
  ja: "@a@b%a001250「お父さん　あのチョコ買うのに\n\tいくら　つかったの？\n\tちょっと　もったいないと思います。\n@c0@"
88:
  de: "@aSancho@bIss weiß nisst. Für miss, das riesst alles nur nach Monedas. Nach Schokoladen-Monedas!\n@c0@"
  en: "@aSancho@bI no esure. For me, these exhibits, they esmell only like money. Like the chocolate garbanzos!\n@c0@"
  es: "@aSancho@bPues no estoy seguro. A mí esta exposición nomás me huele a dinero. ¡Como feria de chocolate!\n@c0@"
  fr: "@aSancho@bJe ne suis pas sûr. Pour moi, cette exposition sent oun peu l'argent. Comme les p-p-pièces en chocolatⓠ\n@c0@"
  it: "@aSancho@bMe gusta el cioccolatos, ma preferirei visitare un museo donde sono espostos anche oggettos diversos...\n@c0@"
  ja: "@a@bサンチョ「なぜでしょう。　お金に\n\tものをいわせて　集めた感じが\n\tぬぐえないのですが……。\n@c0@"
89:
  de: "@aOtto@bDa werd'n mir die Zähne ja schon vom bloßen Anblick faul!\n@c0@"
  en: "@aTuppence@bI can feel my teeth decaying just from looking at them all!\n@c0@"
  es: "@aAlazar@b¡Siento cómo se me pican los dientes solo de mirarlos!\n@c0@"
  fr: "@aInnocent@bJe sens les caries venir rien qu'en regardant toutes ces médailles.\n@c0@"
  it: "@aSimon@bC'è cioccolato ovunque si guardi!\nMaestà, ho paura che mi venga una carie agli occhi...\n@c0@"
  ja: "@a@bピピン「見ているだけで　虫歯に\n\tなってしまいそうですね。\n@c0@"
90:
  de: "@aBianca@bJetzt sieht es hier mehr aus wie in einem Buddelschiff-Museum als wie in einem Firlefanzeum, so viel ist mal sicher.\n@c0@"
  en: "@aBianca@bThis place does look more like a ship in a bottle museum than a knick-knackatory, that's for sure.\n@c0@"
  es: "@aBianca@bEste lugar parece más una fábrica de barcos en botella que un musenino, ¿sabes?\n@c0@"
  fr: "@aBianca@bCet endroit ressemble plus à un musée de bateaux\r\nen bouteille qu'à une Galericabrac, c'est certain.\n@c0@"
  it: "@aBianca@bChe carine che sono le navi in bottiglia!\nNe abbiamo talmente tante che potremmo varare la nostra flotta personale!\n@c0@"
  ja: "@a@bビアンカ「たしかに　これじゃ\n\t名産博物館じゃなくて\n\tボトルシップ博物館ね。\n@c0@"
91:
  de: "@aNera@bDer alte Firle Franz sieht nicht allzu erfreut aus. Das hat er sich vielleicht doch etwas anders vorgestellt.\n@c0@"
  en: "@aNera@bOld Man Nick Knack doesn't look too happy. Maybe this wasn't quite what he had in mind.\n@c0@"
  es: "@aNera@bEl abuelo Nino no está molto felice. Quizás no era lo que tenía en mente.\n@c0@"
  fr: "@aNera@bLe vieux Bricabrac n'a pas l'air très satisfait.\r\nPeut-être que ce n'est pas ce qu'il avait en tête.\n@c0@"
  it: "@aNera@bGeremia non mi sembra molto soddisfatto.\nNon credo che avesse voglia di trasformare il Museo del Souvenir in una mostra monotematica...\n@c0@"
  ja: "@a@bフローラ「デスじいさんが\n\tため息を　ついておられますわ。\n\tお気に召さないのね……。\n@c0@"
92:
  de: "@a%0%a001240@bIch wollte sehen, wie es wirkt, wenn wir hier überall Buddelschiffe aufstellen würden. Ich find's klasse!\n@c0@"
  en: "@a%0%a001240@bI wanted to see what it would look like if we filled the place with ships in bottles. It's fun!\n@c0@"
  es: "@a%0%a001240@bQuería ver que pinta tenía esto si lo llenábamos de barcos en botella. ¡Es muy divertido!\n@c0@"
  fr: "@a%0%a001240@bJe me demandais à quoi ça ressemblerait si on remplissait cet endroit de bateaux en bouteille.\nC'est rigoloⓠ\n@c0@"
  it: "@a%0%a001240@bHo sempre desiderato possedere una nave in bottiglia, e adesso guarda quante ne ho!\nTroppo forte!\n@c0@"
  ja: "@a@b%a001240「ボク　一度やって\n\tみたかったんだよね。\n\t全部　ボトルシップ　ってやつ！\n@c0@"
93:
  de: "@a%0%a001250@bBuddelschiffe sind nicht schlecht, aber es wäre schön, wenn wir auch ein paar hübschere Sachen ausstellen würden.\n@c0@"
  en: "@a%0%a001250@bI don't mind ships in bottles, but it would be nice to put some prettier things on display.\n@c0@"
  es: "@a%0%a001250@bMe gustan los barcos en botella, pero igual estaría bien exhibir algo más bonito.\n@c0@"
  fr: "@a%0%a001250@bJe n'ai rien contre les bateaux en bouteille, mais ça serait bien d'exposer des choses un peu plus jolies.\n@c0@"
  it: "@a%0%a001250@bSecondo me in un museo dovrebbe essere esposta una varietà di oggetti diversi...\n@c0@"
  ja: "@a@b%a001250「ボトルシップは\n\tキライじゃないけど　もっと\n\tかわいい名産品も　置いてほしいな。\n@c0@"
94:
  de: "@aSancho@bIss weiß nisst. Für miss, das riesst alles nur nach Monedas. Nach Schokoladen-Monedas!\n@c0@"
  en: "@aSancho@bI no esure. For me, these exhibits, they esmell only like money. Like the chocolate garbanzos!\n@c0@"
  es: "@aSancho@bPues no estoy seguro. A mí esta exposición nomás me huele a dinero. ¡Como feria de chocolate!\n@c0@"
  fr: "@aSancho@bJe ne suis pas sûr. Pour moi, cette exposition sent oun peu l'argent. Comme les p-p-pièces en chocolatⓠ\n@c0@"
  it: "@aSancho@bChico, no pienso que los visitatores saranno contentos de pagare el biglietto solo por vedere una serie infinita de naves en bottiglias...\n@c0@"
  ja: "@a@bサンチョ「なぜでしょう。　お金に\n\tものをいわせて　集めた感じが\n\tぬぐえないのですが……。\n@c0@"
95:
  de: "@aOtto@bNo, da haben wir den alten Firle Franz doch schön verulkt, oder?\n@c0@"
  en: "@aTuppence@bWell, we've managed to wind Old Man Nick Knack\r\nup, eh?\n@c0@"
  es: "@aAlazar@bVaya, pues hemos chinchado a base de bien al abuelo Nino, ¿eh?\n@c0@"
  fr: "@aInnocent@bEh bien, on a réussi à énerver\nle vieux Bricabrac, heinⓡ\n@c0@"
  it: "@aSimon@bAh ah ah! Complimenti, Maestà!\nQuesto è proprio un bello scherzetto per il caro Geremia!\n@c0@"
  ja: "@a@bピピン「とりあえず　デスじいさんに\n\tいやがらせが　できましたね。\n@c0@"
96:
  de: "@aOtto@bOh! Das war gar nicht Eure Absicht? Hoppala. Pardon, da hab ich mich wohl getäuscht.\n@c0@"
  en: "@aTuppence@bOh! That wasn't your intention? Oops.\r\nSorry, my mistake.\n@c0@"
  es: "@aAlazar@b¡Oh! ¿Que no era lo que pretendíamos? Vaya.\r\nPerdón, me he equivocado.\n@c0@"
  fr: "@aInnocent@bOhⓠ Ça n'était pas votre butⓡ\nOups. Désolé...\n@c0@"
  it: "@aSimon@bFacezie a parte, credo che dovremmo trovare qualche altro oggetto per il Museo del Souvenir.\n@c0@"
  ja: "@a@bピピン「えっ？　いやがらせじゃない！？\n\tし　失礼しましたっ！\n@c0@"
97:
  de: "@aBianca@bIch frage mich, wie viele Souvenirs es wohl in der weiten Welt gibt, die wir sammeln könnten?\n@c0@"
  en: "@aBianca@bI wonder how many souvenirs there are out there for us to collect.\n@c0@"
  es: "@aBianca@bMe pregunto cuántas cosinas habrá por ahí...\n@c0@"
  fr: "@aBianca@bJe me demande combien il existe d'objets\r\nà collectionner dans le monde.\n@c0@"
  it: "@aBianca@bMi chiedo quanti siano in totale i souvenir che Geremia vuole che troviamo...\n@c0@"
  ja: "@a@bビアンカ「そういえば　名産品って\n\tどのくらいあるのかしら？\n@c0@"
98:
  de: "@aNera@bWir haben noch viele freie Podeste, auf denen wir etwas ausstellen könnten, also muss es da draußen noch mehr Souvenirs geben, die wir sammeln könnten.\n@c0@"
  en: "@aNera@bWe have lots of pedestals left to display things on, so there must be lots more souvenirs out there for us to find.\n@c0@"
  es: "@aNera@bHay un montón de exhibidores vacíos, veramente, debe de haber muchas cosinas ahí fuera que no hemos trovato.\n@c0@"
  fr: "@aNera@bIl nous reste beaucoup de piédestaux libres, c'est donc qu'il doit rester beaucoup d'autres objets de collection à trouver.\n@c0@"
  it: "@aNera@bCi sono ancora tanti piedistalli vuoti, quindi immagino che dovremo portare a Geremia ancora parecchi souvenir.\n@c0@"
  ja: "@a@bフローラ「空いている台座が　まだこれだけ\n\tありますから　名産品もきっと\n\tまだいっぱいあるのでしょうね。\n@c0@"
99:
  de: "@a%0%a001240@bWäre das nicht toll, wenn wir für jedes Podest etwas finden könnten?\n@c0@"
  en: "@a%0%a001240@bWouldn't it be amazing if we could find something to display on every single pedestal?\n@c0@"
  es: "@a%0%a001240@b¿No estaría genial tener algo que exhibir en todos los pedestales?\n@c0@"
  fr: "@a%0%a001240@bCe serait super si on pouvait trouver quelque chose à exposer sur chacun des piédestauxⓠ\n@c0@"
  it: "@a%0%a001240@bQuanto mi piacerebbe mettere un oggetto diverso su ciascun piedistallo! Sarebbe bellissimo riempire tutto il Museo con oggetti diversi!\n@c0@"
  ja: "@a@b%a001240「ここにある　台座ぜんぶに\n\t名産品を置けたらすごいよね。\n@c0@"
100:
  de: "@a%0%a001250@bDer alte Firle Franz ist manchmal fast wie ein Kind. Ich finde ihn süß!\n@c0@"
  en: "@a%0%a001250@bOld Man Nick Knack can be a bit childlike sometimes.\nI think he's cute!\n@c0@"
  es: "@a%0%a001250@bEl abuelo Nino a veces es muy infantil.\nCreo que es adorable.\n@c0@"
  fr: "@a%0%a001250@bLe vieux Bricabrac est un peu puéril, parfois.\nIl est tout mignon, je trouveⓠ\n@c0@"
  it: "@a%0%a001250@bChissà se riusciremo mai a trovare tutti i souvenir che Geremia sogna di esporre nel Museo...\n@c0@"
  ja: "@a@b%a001250「おじいさん\n\t子どもみたい。\n\tちょっと　かわいいかも……。\n@c0@"
101:
  de: "@aSancho@bEin esster Mann gibt niemals auf, wenn er erst einmal etwas angefangen hat.\n@c0@"
  en: "@aSancho@bA true man, he no ever geeve up on esometheeng once he estarts.\n@c0@"
  es: "@aSancho@bUn puro macho nunca abandona lo que ha comenzado.\n@c0@"
  fr: "@aSancho@bOun vrai homme, il n'abandonne j-j-jamais\r\nquelque chose oune fois qu'il a commencé.\n@c0@"
  it: "@aSancho@b¡Un vero hombre porta siempre a termines las cosas que inizia!\n@c0@"
  ja: "@a@bサンチョ「一度　やりはじめたことを\n\t最後まで　やり通すことは\n\tすばらしいことです。\n@c0@"
102:
  de: "@aSancho@bDu musst noch viele, viele Souvenirs sammeln, Chico. Und dein Onkel Sancho, er wird dir helfen.\n@c0@"
  en: "@aSancho@bYou must collect many, many esouvenirs, friend.\r\nAnd your Uncle Sancho, he weell help you.\n@c0@"
  es: "@aSancho@bNomás debes hacerte con todititas las cosinas, chamaco.\r\nY tu tito Sancho pues te va a ayudar.\n@c0@"
  fr: "@aSancho@bTu dois c-c-collectionner beaucoup d'objets, chico.\r\nEt tonton Sancho va t'aider.\n@c0@"
  it: "@aSancho@b¡Chico, es tuo dovere trovare muchos souvenir!\nNon temere, lo zio Sancho te aiuterà nella ricercas...\n@c0@"
  ja: "@a@bサンチョ「名産品集めも　またしかり。\n\t%a000090王　がんばってください！\n\t私も　お手伝いさせていただきますぞ。\n@c0@"
103:
  de: "@aOtto@bDer kann immer nur mosern, findet Ihr net? Ich mein', es ist ja net, als würd' er selbst sich auch mal auf die Suche mach'n.\n@c0@"
  en: "@aTuppence@bHe's a bit of a moaner at times, don't you think?\r\nIt's not as if he's helping find things to display.\n@c0@"
  es: "@aAlazar@bA veces se comporta como un llorón, ¿verdad?\r\nNo es que esté ayudando a encontrar cosinas que exhibir ni nada por el estilo.\n@c0@"
  fr: "@aInnocent@bIl a un peu tendance à se plaindre, nonⓡ Ça n'est pas comme s'il nous aidait beaucoup à trouver des objets à exposer, aussi.\n@c0@"
  it: "@aSimon@bCerto che quel vecchiaccio potrebbe anche aiutarci a trovare qualche souvenir, invece di starsene lì a lagnarsi!\n@c0@"
  ja: "@a@bピピン「ほしいのう　ほしいのう…　って。\n\t……いるんですよね\n\t弱気なのに　おしの強い人って。\n@c0@"
104:
  de: "@aBianca@bEs kann einen richtig runterziehen, wenn er so redet. Mir kommt's langsam so vor, als würden wir hier nie fertig.\n@c0@"
  en: "@aBianca@bIt's depressin' hearin' him talk like that. It makes it feel like it'll be ages 'til we'll get the place all set.\n@c0@"
  es: "@aBianca@bMe da rabia oírle decir eso. Me hace sentir como si fuéramos a tardar años en tener todo esto listo, ¿sabes?\n@c0@"
  fr: "@aBianca@bC'est déprimant de l'entendre tenir ce genre de discours. Ça donne l'impression qu'il va falloir des siècles avant que le musée ne soit terminé.\n@c0@"
  it: "@aBianca@bAh, che bella prospettiva!\nA sentire Geremia, ci vorrà un mucchio di tempo per riempire di souvenir il Museo!\n@c0@"
  ja: "@a@bビアンカ「なんだか　そんなふうに\n\t言われると　ホントに先のような\n\t気がしてくるわね……。\n@c0@"
105:
  de: "@aNera@bWenn er einfach nur alle Podeste belegt haben will, könnten wir ihm den Gefallen wohl tun. Aber ich nehme an, ganz so simpel ist es nicht.\n@c0@"
  en: "@aNera@bIf he just wants them all full, then I suppose we could oblige there, but I'm guessing he's a bit\r\nfussier than that.\n@c0@"
  es: "@aNera@bSi quiere que tutti este ripieno, non credo que haya problema, pero sembra que puede tener alguna que otra exigencia más.\n@c0@"
  fr: "@aNera@bS'il tient seulement à ce que tout soit rempli, on doit pouvoir y arriver, mais j'imagine qu'il est bien plus difficile que ça.\n@c0@"
  it: "@aNera@bNon trovi anche tu che a volte Geremia sia un po' troppo esigente? Qualcuno dovrebbe spiegargli che trovare souvenir sempre nuovi non è cosa da poco!\n@c0@"
  ja: "@a@bフローラ「ただ　うめるだけで\n\tいいんでしたら　方法はありますけど。\n\tそれでは　ダメでしょうね……。\n@c0@"
106:
  de: "@a%0%a001240@bEs wäre toll, wenn wir auf jedem Podest etwas hätten. Ich helf' dir dabei, Papa!\n@c0@"
  en: "@a%0%a001240@bIt'd be cool if there was something on display on every pedestal. I'll help you do it, Dad!\n@c0@"
  es: "@a%0%a001240@bEstaría genial que hubiera algo que exhibir en todos los pedestales. Yo te ayudaré a lograrlo, papi.\n@c0@"
  fr: "@a%0%a001240@bCe serait super qu'il y ait un objet exposé\nsur chaque piédestal. Je vais t'aider, papaⓠ\n@c0@"
  it: "@a%0%a001240@bPresto ci sarà un souvenir su ciascun piedistallo, perché noi troveremo tanti oggetti belli e preziosi!\n@c0@"
  ja: "@a@b%a001240「ぜんぶの台座がうまったら\n\tすごいだろうね。\n\tお父さん　ボクも　お手伝いするよ！\n@c0@"
107:
  de: "@a%0%a001250@bSo lange wird es doch nicht dauern, nicht, Papa?\n@c0@"
  en: "@a%0%a001250@bYou won't let it take that long, will you, Dad?\n@c0@"
  es: "@a%0%a001250@b¿No tardarás tanto, verdad, papá?\n@c0@"
  fr: "@a%0%a001250@bAvec toi, ça ne prendra pas si longtemps,\nhein, papaⓡ\n@c0@"
  it: "@a%0%a001250@bSpero di non dover trascorrere il resto della mia vita a dare la caccia a souvenir sparsi in giro per il mondo!\n@c0@"
  ja: "@a@b%a001250「お父さんなら　きっと\n\tそんなに　先の先の先の先…\n\tなんてことには　ならないよね？\n@c0@"
108:
  de: "@aSancho@bAber wir können nisst alles andere stehen- und liegenlassen und uns nur noch auf den Schnickschnack konzentrieren, weißt du.\n@c0@"
  en: "@aSancho@bBut we can no just forget everytheeng else and espend all our time finding the knick-knacks, you know.\n@c0@"
  es: "@aSancho@bNo podemos olvidarnos de todito lo demás y pasárnosla buscando cosinas...\n@c0@"
  fr: "@aSancho@bMais on ne peut p-p-pas non plus oublier tout le reste et passer tout notre tiempo à chercher des objets, quand même.\n@c0@"
  it: "@aSancho@b¡Por todas las paellas! ¿Mica podemos dementicarce della nuestra missione por dedicarce anima y cuerpo alla ricercas de los souvenir, eh?\n@c0@"
  ja: "@a@bサンチョ「…とは　いっても\n\tこちらのほうばかりに　チカラを\n\t注ぐわけには　いきませんからねえ。\n@c0@"
109:
  de: "@aOtto@bIst ihm denn net klar, wie viel Gfrett wir damit haben? Also wirklich!\n@c0@"
  en: "@aTuppence@bDoesn't he realise how much hard work all this is for us? Honestly!\n@c0@"
  es: "@aAlazar@b¿Es que no se da cuenta de cuánto nos cuesta? ¡Hay que ver!\n@c0@"
  fr: "@aInnocent@bIl ne se rend pas compte du travail que ça nous demande, franchementⓡⓐ\n@c0@"
  it: "@aSimon@bCerto che quel tipo ne ha di pretese! Non crederà mica che riempire un museo di oggetti sempre nuovi e interessanti sia un lavoretto da nulla, eh?!\n@c0@"
  ja: "@a@bピピン「あの人　ボク達の苦労を\n\tわかって　言ってるんですかね？\n@c0@"
110:
  de: "@aBianca@bPfft! Er könnte sich ruhig ein wenig dankbarer für alles zeigen, was wir bisher für ihn getan haben, oder nicht?\n@c0@"
  en: "@aBianca@bHuh! You'd think he'd show a bit more gratitude for everythin' we've done so far, eh?\n@c0@"
  es: "@aBianca@b¡Oh! Se podría esperar un poco de gratitud después de todo lo que hemos hecho, ¿me entiendes?\n@c0@"
  fr: "@aBianca@bPfffⓠ Il ne pourrait pas être un tout petit peu plus reconnaissant pour tout ce qu'on a déjà fait, nonⓡ\n@c0@"
  it: "@aBianca@bChi si offre volontario per spiegare a Geremia il significato delle parole ⓕgratitudineⓖ e ⓕpazienzaⓖ?\n@c0@"
  ja: "@a@bビアンカ「いちおう　これだけ集めたんだし\n\tお礼ぐらい言ってくれても\n\tいいと思わない？\n@c0@"
111:
  de: "@aNera@bEs ist nicht leicht, Dinge für die Sammlung zu finden, aber wir sollten tun, was wir können, um die Besucher zufriedenzustellen.\n@c0@"
  en: "@aNera@bIt's hard work finding things for the collection, but we should do our best to keep the visitors happy.\n@c0@"
  es: "@aNera@bEs un lavoro molto cansado encontrar cosinas para la collezione, pero haremos lo possibile para satisfacer a nuestros visitantes.\n@c0@"
  fr: "@aNera@bC'est difficile de trouver des objets pour enrichir\r\nla collection, mais on doit faire de notre mieux\r\npour contenter les visiteurs.\n@c0@"
  it: "@aNera@bCercare souvenir per il Museo è un lavoro duro, ma la soddisfazione di veder arrivare tanti visitatori ripaga di tutti gli sforzi fatti!\n@c0@"
  ja: "@a@bフローラ「集めるのは　大変ですけど\n\tお客さんの　ためですもの。\n\tがんばりましょう。\n@c0@"
112:
  de: "@a%0%a001240@bEr hat nur gesagt, dass es anfängt, wie ein richtiges Firlefanzeum auszusehen. Heißt das, es ist eigentlich immer noch keins?\n@c0@"
  en: "@a%0%a001240@bHe only said it's starting to look like a real\nknick-knackatory. Does that mean it's still\nnot actually a real one?\n@c0@"
  es: "@a%0%a001240@bDice que ya comienza a tener pinta de musenino de verdad. ¿Eso significa que todavía no es uno de verdad?\n@c0@"
  fr: "@a%0%a001240@bIl a dit que ça commençait à ressembler à une véritable Galericabrac. Est-ce que ça veut dire que ça n'en est pas encore une vraie de vraieⓡ \n@c0@"
  it: "@a%0%a001240@bVuol dire che stiamo facendo un buon lavoro?\nO che dovremmo darci da fare ancora di più?\nUhm, magari tutte e due le cose...\n@c0@"
  ja: "@a@b%a001240「博物館らしくっていうことは\n\tまだ博物館じゃないってことなの？\n@c0@"
113:
  de: "@a%0%a001250@bEr braucht uns gar nicht so zu drängeln. Wir hätten doch sowieso noch weitergesucht, stimmt's, Papa?\n@c0@"
  en: "@a%0%a001250@bHe doesn't need to pester us like that. We were going to add to the collection anyway, right, Dad?\n@c0@"
  es: "@a%0%a001250@bNo es necesario agobiarnos tanto. Vamos a mejorar la colección igual, ¿verdad, papi?\n@c0@"
  fr: "@a%0%a001250@bIl n'a pas besoin de ronchonner comme ça. On avait l'intention de compléter la collection de toute façon, hein, papaⓡ\n@c0@"
  it: "@a%0%a001250@bCredo che siamo sulla buona strada per completare la collezione di oggetti del Museo del Souvenir...\n@c0@"
  ja: "@a@b%a001250「そんなに　せかさなくても\n\tちゃんと　集めてくるのにな。\n@c0@"
114:
  de: "@aSancho@bNisst schlesst, diese Señor. Er ist so voller Begeisterung für seine Schnick und Schnack, nisst? Aber wir haben auch noch anderes zu tun, no?\n@c0@"
  en: "@aSancho@bEes good thees señor, he ees eso excited by hees knicks and knacks, but you know, we have other theengs to do too, sí?\n@c0@"
  es: "@aSancho@bEste señor está bien loco. Se emocionó tanto con las cosinas que se olvidó de que tenemos más cosas que hacer.\n@c0@"
  fr: "@aSancho@bC'est bien que ce s-s-señor soit tout excité par ses objets de c-collection, mais on a aussi d'autres choses à faire, noⓡ\n@c0@"
  it: "@aSancho@bSoy feliz que el Museo del Souvenir está diventando siempre más ricco y vario, ma cerchiamo de no dementicarce della nuestra missione...\n@c0@"
  ja: "@a@bサンチョ「あの方の　情熱は分かりますが\n\tこちらの　都合も\n\t考えていただきませんと……。\n@c0@"
115:
  de: "@aOtto@bIst ja gut und schön, das zu sagen. Das Schwierige daran ist, es auch zu tun.\n@c0@"
  en: "@aTuppence@bIt's all very well just saying that. It's the doing that's the hard part.\n@c0@"
  es: "@aAlazar@bLo de hablar es fácil. Hacerlo es lo difícil.\n@c0@"
  fr: "@aInnocent@bC'est bien gentil de nous dire ça, mais c'est beaucoup plus simple à dire qu'à faire.\n@c0@"
  it: "@aSimon@bIl nostro lavoro sarebbe molto più gradevole se quel vecchio tarantolato ci trattasse con più gentilezza...\n@c0@"
  ja: "@a@bピピン「言うのは　かんたん\n\tなんですけどね……。\n@c0@"
116:
  de: "@aBianca@bEs sieht aus, als hätten wir's fast geschafft, nicht? Es war ein gutes Stück Arbeit. Noch ein kleines bisschen, dann haben wir's.\n@c0@"
  en: "@aBianca@bLooks like we're nearly there, eh? We've done\r\na lot of work here. Just a bit more effort and\r\nwe're finished.\n@c0@"
  es: "@aBianca@bYa casi está, ¿sabes? Hemos trabajado un montonazo. Un último esfuerzo y ya...\n@c0@"
  fr: "@aBianca@bOn y est presque, nonⓡ On a déjà fait pas mal de travail, ici. Encore un tout petit effort, et ce sera terminé.\n@c0@"
  it: "@aBianca@bCi siamo quasi, eh?\nDirei che il più è fatto...\nAncora un po' e avremo finito.\n@c0@"
  ja: "@a@bビアンカ「あとちょっとかあ……\n\tやっと　ここまで集まったんだね。\n\tもうちょっとだから　がんばろう。\n@c0@"
117:
  de: "@aNera@bDie leeren Podeste fallen einem jetzt richtig ins Auge, nachdem wir schon so viele Exponate haben. Aber nun fehlt nicht mehr viel.\n@c0@"
  en: "@aNera@bThe empty pedestals are looking all the more obvious now we have so many things on display. We're not far off now, though.\n@c0@"
  es: "@aNera@bLos pedestales vacíos se ven più ahora que tenemos tantas cosas. Ma ya no quedan muchos.\n@c0@"
  fr: "@aNera@bMaintenant qu'il y a tant d'objets exposés, on remarque d'autant plus les piédestaux encore vides. Mais on y est presque, maintenant.\n@c0@"
  it: "@aNera@bOrmai i piedistalli ⓕin usoⓖ sono più numerosi di quelli vuoti!\nStiamo facendo un ottimo lavoro!\n@c0@"
  ja: "@a@bフローラ「これだけ集まると　空いている\n\t台座の方が　目立ってしまいますね。\n\t全てうまるまで　もう一息ですわ。\n@c0@"
118:
  de: "@a%0%a001240@bJetzt dauert es nicht mehr lange, bis jedes Podest belegt ist. Das ist ganz schön aufregend!\n@c0@"
  en: "@a%0%a001240@bIt won't be long now before we have something displayed on every single pedestal. It's pretty exciting stuff!\n@c0@"
  es: "@a%0%a001240@bFalta poco para tener algo en cada pedestal. ¡Qué emocionante!\n@c0@"
  fr: "@a%0%a001240@bIl va bientôt y avoir un objet exposé sur chacun des piédestaux. C'est drôlement excitantⓠ\n@c0@"
  it: "@a%0%a001240@bPresto non ci sarà più nemmeno un piedistallo vuoto!\nChe bello!\nNon vedo l'ora che il Museo sia pieno zeppo di oggetti!\n@c0@"
  ja: "@a@b%a001240「もう少しで　全部の台座に\n\t展示できるんだね。\n\tなんだか　ワクワクしてきたよ。\n@c0@"
119:
  de: "@a%0%a001250@bIch weiß, du wirst die Sammlung im Handumdrehen vervollständigt haben. Du kannst einfach alles!\n@c0@"
  en: "@a%0%a001250@bI know you'll finish the collection in no time, Dad.\nYou can do anything!\n@c0@"
  es: "@a%0%a001250@bSé que completarás la colección en un pis-pas.\n¡Puedes hacerlo!\n@c0@"
  fr: "@a%0%a001250@bJe sais que tu arriveras à terminer la collection en un rien de temps, papa. Tu peux tout faireⓠ\n@c0@"
  it: "@a%0%a001250@bPapà, sono sicura che tra poco completerai la collezione di souvenir!\nSei troppo bravo!\n@c0@"
  ja: "@a@b%a001250「お父さんなら　きっと\n\tすぐに　できちゃうと思うの。\n\tだって　お父さん　すごいんだもん。\n@c0@"
120:
  de: "@aSancho@bWir gehen es einfach langsam an, sí? Dann wir finden die letzten Andenken auch noch.\n@c0@"
  en: "@aSancho@bWe just take eet eslow, sí? Then I esure we gonna find the last few esouvenirs.\n@c0@"
  es: "@aSancho@bPues tomémonoslo con calmita. Así, daremos de volada con las últimas cositas.\n@c0@"
  fr: "@aSancho@bOn p-p-prend notre temps, noⓡ Mais je suis sûr\nqu'on va t-t-trouver ces derniers objets.\n@c0@"
  it: "@aSancho@b¡Si no ce facciamo prendere dall'ansia de no riuscire a completare la collezione, soy seguro que troveremo todos los souvenir mancantes!\n@c0@"
  ja: "@a@bサンチョ「なかなか　集まらなくとも\n\tあせらず探してゆけば　きっと\n\t見つかりますとも。\n@c0@"
121:
  de: "@aOtto@bEs ist ung'schickt, dass mitten drin immer noch leere Podeste steh'n, auch wenn es nur ein paar wenige sind.\n@c0@"
  en: "@aTuppence@bIt's rather irritating still having empty pedestals dotted about, even though they're few and far between.\n@c0@"
  es: "@aAlazar@bEs bastante molesto que aún queden pedestales vacíos, aunque sean pocos y estén separados.\n@c0@"
  fr: "@aInnocent@bC'est assez énervant d'avoir encore quelques piédestaux vides ici et là, même s'ils sont\r\nde moins en moins nombreux.\n@c0@"
  it: "@aSimon@bNon mi piacciono i piedistalli vuoti.\nOrmai sono pochi, ma proprio per questo motivo risaltano ancora di più!\n@c0@"
  ja: "@a@bピピン「少しだけ　何もない台座が\n\t残ってるのは　すっきりしませんよね。\n@c0@"
122:
  de: "@aBianca@bDie Andenken, die wir zusammen gesammelt haben, sind für mich so kostbar, dass sie mit Geld gar nicht zu bezahlen sind.\n@c0@"
  en: "@aBianca@bThe souvenirs we collected together are more precious to me than any price tag could make 'em.\n@c0@"
  es: "@aBianca@bLas cosinas que hemos conseguido juntos son más valiosas para mí de lo que ponga en cualquier etiqueta, ¿sabes?\n@c0@"
  fr: "@aBianca@bLes objets que nous avons trouvés ensemble sont pour moi plus précieux que la valeur marchande qu'on peut leur attribuer.\n@c0@"
  it: "@aBianca@bChe splendida raccolta, eh?\nÈ una meraviglia! Certo che aggiungere qualche oggetto più pregiato non guasterebbe affatto...\n@c0@"
  ja: "@a@bビアンカ「私にとって　%a000090と集めた\n\t名産品は　ぜんぶ　お金なんかよりも\n\t価値の高い物よ。\n@c0@"
123:
  de: "@aNera@bJetzt ist es wirklich ein echtes Museum! Und alles nur dank deiner harten Arbeit, Liebling.\n@c0@"
  en: "@aNera@bNow it really is a proper museum! And it's all thanks to your hard work, darling.\n@c0@"
  es: "@aNera@b¡Allora, esto es veramente un museo! Y todo gracias al tuo duro lavoro, caro mio.\n@c0@"
  fr: "@aNera@bCette fois, c'est un véritable muséeⓠ\nEt tout ça grâce à ton travail, mon chéri.\n@c0@"
  it: "@aNera@bAdesso sì che questo posto può essere considerato un vero museo!\nEd è tutto merito tuo, tesoro mio!\n@c0@"
  ja: "@a@bフローラ「これで　名実ともに\n\t博物館となりましたわね。　すべて\n\tあなたの努力の　たまものですわ。\n@c0@"
124:
  de: "@a%0%a001240@bWer entscheidet überhaupt, was unsere Ausstellungsstücke wert sind? Ich finde sie alle total klasse.\n@c0@"
  en: "@a%0%a001240@bWho decides how much the exhibits are worth, anyway? I think they're all really good.\n@c0@"
  es: "@a%0%a001240@b¿Quién decide lo que vale cada pieza? Yo creo que todas valen un montón.\n@c0@"
  fr: "@a%0%a001240@bQui décide du prix des objets exposés, d'abordⓡ\nMoi, je les trouve tous très beaux.\n@c0@"
  it: "@a%0%a001240@bChi è che decide quanto valgono i souvenir?\nPer me sono tutti bellissimi!\n@c0@"
  ja: "@a@b%a001240「名産品の　価値って\n\tどこで決まるの？　ボクは全部\n\tりっぱな　名産品だと思うけどなあ。\n@c0@"
125:
  de: "@a%0%a001250@bJedes der Exponate hier ist wertvoll, weil sie alle mit viel Mühe hergestellt wurden.\n@c0@"
  en: "@a%0%a001250@bEvery one of the exhibits on display here is valuable because of the effort the local people went to in making them.\n@c0@"
  es: "@a%0%a001250@bTodas la piezas en exhibición son valiosas por el esfuerzo de la gente que las hizo.\n@c0@"
  fr: "@a%0%a001250@bCe sont les efforts déployés par les artisans locaux pour les fabriquer qui donnent leur valeur à tous les objets exposés ici.\n@c0@"
  it: "@a%0%a001250@bSecondo me tutti i souvenir esposti nel Museo sono di pari importanza, perché esprimono i valori delle culture che li hanno prodotti!\n@c0@"
  ja: "@a@b%a001250「ここにある　名産品\n\tひとつひとつに　その土地の人々の\n\t思い入れがあるのよね。\n@c0@"
126:
  de: "@aSancho@bJetzt kommen die essten Koryphäen, die Schnickschnack-Experten, um siss deine Sammlung anzusehen, Chico.\n@c0@"
  en: "@aSancho@bNow the aficionados, the experts of the\r\nknick-knacks, they gonna come to esee\r\nyour collection, friend.\n@c0@"
  es: "@aSancho@bAhorita sí que vendrán los aficionados a las cosinas para ver tu colección, chamaco.\n@c0@"
  fr: "@aSancho@bMaintenant, les aficionados, tous les experts en objets de c-c-collection, vont venir admirer ton\r\nm-musée, chico.\n@c0@"
  it: "@aSancho@bAhora al Museo del Souvenir verranno muchos criticos por valutare los oggettos que abbiamo raccolto, chico...\n@c0@"
  ja: "@a@bサンチョ「これからは　目のこえた\n\tお客さんも　%a000090王の集めた\n\t名産品を見に来られるのでしょうね。\n@c0@"
127:
  de: "@aOtto@bEs gibt da draußen noch mehr regionale Souvenirs, die man sammeln kann?!\n@c0@"
  en: "@aTuppence@bSo there are still more regional souvenirs out there to collect!?\n@c0@"
  es: "@aAlazar@b¿Así que aún quedan cosinas que conseguir?\n@c0@"
  fr: "@aInnocent@bAlors il reste encore des objets de collection\nà trouverⓡⓐ\n@c0@"
  it: "@aSimon@bAllora non abbiamo ancora finito di cercare souvenir?!\n@c0@"
  ja: "@a@bピピン「これだけ　集めても\n\t世界には　まだまだ名産品が\n\tあるんですか。\n@c0@"
128:
  de: "@aOtto@bTja, die Welt ist ganz schön groß, net wahr?\n@c0@"
  en: "@aTuppence@bIt's a big old world, isn't it?\n@c0@"
  es: "@aAlazar@bEl mundo es enorme, ¿verdad?\n@c0@"
  fr: "@aInnocent@bLe monde est bien vasteⓠ\n@c0@"
  it: "@aSimon@bMa quanti ne esisteranno al mondo, eh?!\n@c0@"
  ja: "@a@bピピン「広いんですね　世界って……。\n@c0@"
129:
  de: "@aBianca@bJa, vermutlich wäre es schlauer, unsere wertvollen Sachen dort auszustellen, wo die Besucher sie auch sehen können, was?\n@c0@"
  en: "@aBianca@bYeah, I s'pose it's stupid not to put our valuable stuff out where the visitors can see it, eh?\n@c0@"
  es: "@aBianca@bSí, supongo que no exhibir las cosas de valor donde las puedan ver los visitantes es una tontería, ¿me entiendes?\n@c0@"
  fr: "@aBianca@bOui, c'est vrai. C'est bête de ne pas exposer\nnos plus beaux objets dans un endroit où\nles visiteurs peuvent les admirer, nonⓡ\n@c0@"
  it: "@aBianca@bBisogna ammettere che è vero: che senso ha non esporre i souvenir più pregiati?\n@c0@"
  ja: "@a@bビアンカ「やっぱり　価値のある物は\n\tここに置いておくより　お客さんに\n\t見てもらった方が　いいんじゃない？\n@c0@"
130:
  de: "@aNera@bDer alte Mann hat mich wirklich erschreckt, als er so im Halbdunkel auftauchte! Ich dachte, mir bleibt das Herz stehen.\n@c0@"
  en: "@aNera@bThe old man really took me by surprise, appearing in the gloom like that! I thought my heart was going to stop for a minute.\n@c0@"
  es: "@aNera@bEl vecchio me ha sorprendido saliendo de la nada così. Por un instante, veramente pensé que il mio cuore se iba a parar.\n@c0@"
  fr: "@aNera@bLe vieux bonhomme m'a surprise en sortant\nde nulle part, comme çaⓠ J'ai bien cru que\nmon cœur allait s'arrêter.\n@c0@"
  it: "@aNera@bPer attirare un numero sempre maggiore di visitatori bisogna mettere in esposizione gli oggetti più belli e interessanti...\n@c0@"
  ja: "@a@bフローラ「うす暗い物置に\n\tおじいさんがいて　びっくりしました。\n\t心臓が止まるかと　思いましたわ。\n@c0@"
131:
  de: "@a%0%a001240@bWieso hast du es überhaupt dorthin getan, Papa? Kannst du es nicht leiden?\n@c0@"
  en: "@a%0%a001240@bHow come you put it there anyway, Dad?\nDon't you like it?\n@c0@"
  es: "@a%0%a001240@b¿Y cómo es que has puesto esa cosina ahí?\n¿No te gusta?\n@c0@"
  fr: "@a%0%a001240@bD'ailleurs, pourquoi tu as mis ça là, papaⓡ\nÇa ne te plaît pasⓡ\n@c0@"
  it: "@a%0%a001240@bPapà, come mai quell'oggetto l'hai messo lì?\nNon ti piace?\n@c0@"
  ja: "@a@b%a001240「お父さんは　どうしてアレを\n\t物置に　おいたの？\n\tアレ　あんまり　好きじゃないの？\n@c0@"
132:
  de: "@a%0%a001250@bEr wollte ja eigentlich alles uns überlassen, aber er macht sich immer noch Gedanken, nicht?\n@c0@"
  en: "@a%0%a001250@bHe said he'd leave everything to us, but he can't help worrying about it, can he?\n@c0@"
  es: "@a%0%a001250@bDijo que lo iba a dejar todo en nuestras manos pero no puede evitar meter las narices en el asunto, ¿verdad?\n@c0@"
  fr: "@a%0%a001250@bIl a dit qu'il nous laisserait nous occuper de tout, mais il ne peut pas s'empêcher de s'inquiéter, heinⓡ\n@c0@"
  it: "@a%0%a001250@bAveva detto che non avrebbe messo lingua nelle nostre decisioni, e invece non fa altro che lamentarsi!\n@c0@"
  ja: "@a@b%a001250「まかせるって　言っても\n\tおじいさん　やっぱり気になるのね。\n@c0@"
133:
  de: "@aSancho@bSí, aber manssmal, man kann nisst weiter schweigen. Das ist so, als wenn jemand die Paella nisst ganz risstig macht.\n@c0@"
  en: "@aSancho@bSí, but esometimes, you can no hold your tongue. Ees like when esomeone, they make the paella een the wrong way.\n@c0@"
  es: "@aSancho@b¡Órale! A veces pues se te escapa la lengua. Es como si alguien quisiera cocinar frijoles en una paellera.\n@c0@"
  fr: "@aSancho@bSi. Ma, parfois, c'est difficile de t-t-tenir sa langue. Oun peu comme quand quelqu'un ne p-prépare pas\r\nla paella comme il faut.\n@c0@"
  it: "@aSancho@bNo entiendo...\r\n¿Si a quel señor no gli gusta como gestiamo el Museo, por qué ce ha dato l'incarico de dirigerlo?\n@c0@"
  ja: "@a@bサンチョ「口を出したいという　気持ちは\n\tなんとなく　わかりますけどね。\n@c0@"
134:
  de: "@aOtto@bDer Geist eines alten Mannes, der im Lagerraum eines Museums herumspukt... Das klingt doch ganz nach einem Stoff für G'spensterg'schichten, net wahr?\n@c0@"
  en: "@aTuppence@bThe spirit of an old man lurking in a museum storeroom... It's standard ghost story material,\r\ndon't you think?\n@c0@"
  es: "@aAlazar@bEl espíritu de un anciano merodeando en el almacén de un museo... Es material de primera para un cuento de terror, ¿verdad?\n@c0@"
  fr: "@aInnocent@bL'esprit d'un vieil homme qui hante la réserve d'un musée... Voilà un ingrédient parfait pour une bonne vieille histoire de fantômes, vous ne trouvez pasⓡ\n@c0@"
  it: "@aSimon@bQuell'uomo è un immenso rompiscatole!\nNon so se sia mai stato sposato, ma dubito che al mondo esista una donna in grado di sopportarlo!\n@c0@"
  ja: "@a@bピピン「博物館の物置に　ゆうれいの\n\tおじいさん……。　いかにもですね。\n@c0@"
135:
  de: "@aBianca@bEs gefällt ihm also nicht, wie wir unsere Ausstellung präsentieren? Was stimmt denn daran nicht?\n@c0@"
  en: "@aBianca@bSo now he dun't like the way we've arranged things, eh? I wonder what's wrong with it.\n@c0@"
  es: "@aBianca@bAhora no le gusta como hemos colocado las cosas, ¿sabes? A saber qué hemos hecho mal.\n@c0@"
  fr: "@aBianca@bAlors il n'aime pas la manière dont on a arrangé\nles choses, heinⓡ Je me demande bien ce qui\nne va pas.\n@c0@"
  it: "@aBianca@bNon gli piace il modo in cui abbiamo disposto gli oggetti...\r\nUffà! Quel tipo è davvero incontentabile!\n@c0@"
  ja: "@a@bビアンカ「今度は　ならべ方かあ…\n\tあのおじいさん　このならべ方じゃ\n\t気に入らないんだ……。\n@c0@"
136:
  de: "@aNera@bIch glaube, der arme alte Franz fühlt sich gar nicht wohl bei dem Gedanken, dass er uns die Leitung des Museums überlassen hat.\n@c0@"
  en: "@aNera@bI think poor Old Man Nick Knack is feeling rather troubled about having left the running of this place to us.\n@c0@"
  es: "@aNera@bCredo que el pobre nono Nino está un poco incómodo con haber dejado el lugar en nuestras manos.\n@c0@"
  fr: "@aNera@bJ'ai l'impression que le vieux Bricabrac est inquiet depuis qu'il nous a confié la gestion de cet endroit.\n@c0@"
  it: "@aNera@bCredo che Geremia si sia pentito di averci affidato la gestione del Museo del Souvenir...\n@c0@"
  ja: "@a@bフローラ「おじいさんは　私たちに\n\tまかせておくのが不安なんでしょうか？\n@c0@"
137:
  de: "@a%0%a001240@bDann können wir die Stücke also nicht präsentieren, wie es uns gerade passt? Museen sind komplizierter, als ich dachte.\n@c0@"
  en: "@a%0%a001240@bSo we can't just exhibit things any old how? Museums are trickier to run than I thought.\n@c0@"
  es: "@a%0%a001240@b¿Así que no podemos exhibir las cosinas de cualquier forma? ¡Los museos son más difíciles de llevar de lo que pensaba!\n@c0@"
  fr: "@a%0%a001240@bAlors on ne peut pas juste exposer les objets comme on en a envieⓡ Les musées sont plus compliqués\nà gérer que je ne l'imaginais.\n@c0@"
  it: "@a%0%a001240@bAllora non possiamo disporre i souvenir come meglio crediamo? Ma Geremia non ci aveva detto che potevamo decidere liberamente?\n@c0@"
  ja: "@a@b%a001240「ただ置くだけじゃ　ダメなんだ。\n\t博物館て大変だね。\n@c0@"
138:
  de: "@a%0%a001250@bAber wir haben so hart daran gearbeitet, die Exponate zusammenzustellen! Allmählich kommt's mir vor, als wollte sich der alte Franz überall einmischen.\n@c0@"
  en: "@a%0%a001250@bBut we worked so hard at putting the exhibits together! I'm starting to think Old Man Nick Knack\nis a bit of a fusspot.\n@c0@"
  es: "@a%0%a001250@b¡Después de todo lo que hemos trabajado para lograr todas las cosinas! Empiezo a creer que el abuelo Nino es todo un tiquismiquis.\n@c0@"
  fr: "@a%0%a001250@bMais on a travaillé tellement sur pour monter l'expositionⓠ Je commence à me dire que le vieux Bricabrac est un peu un enquiquineur.\n@c0@"
  it: "@a%0%a001250@bGestire un museo è più complicato di quanto credessi. Non è facile scegliere la disposizione più corretta per tutti gli oggetti...\n@c0@"
  ja: "@a@b%a001250「一生けんめい　ならべたのにね。\n\tおじいさんって　もしかして\n\tけっこう　うるさい人だったのかな？\n@c0@"
139:
  de: "@aSancho@bDas ist nisst weiter überraschend, no? Wir sind schließliss keine Experten.\n@c0@"
  en: "@aSancho@bEes no esurprising, eh? We are no the experts.\n@c0@"
  es: "@aSancho@bPues no es ninguna sorpresa. No somos expertos.\n@c0@"
  fr: "@aSancho@bPas étonnant, noⓡ On n'est p-pas des experts.\n@c0@"
  it: "@aSancho@bE te pareva que el señor Geremia no aveva qualcosas de cui lamentarse...\n@c0@"
  ja: "@a@bサンチョ「まあ　しかたありませんよ。\n\t私たちは　しろうと　なんですから。\n@c0@"
140:
  de: "@aSancho@bAber wir müssen die Stücke so ausstellen, dass sie all unseren Besuchern gefallen.\n@c0@"
  en: "@aSancho@bBut we must try to make the displays eso all our guests, they can enjoy them.\n@c0@"
  es: "@aSancho@bPero hay que intentar colocar las cosinas de forma que los visitantes las disfruten.\n@c0@"
  fr: "@aSancho@bMais on doit essayer de m-monter l'exposition de manière à ce qu'elle plaise à t-t-tous nos visiteurs.\n@c0@"
  it: "@aSancho@bPazienza, ce vuole mucha pazienza. Però forse ha ragione: dovremmo disporre los oggettos en modo tale da attrarre ancor más visitatores...\n@c0@"
  ja: "@a@bサンチョ「でも　お客さんに\n\tよろこんでいただけるように\n\tがんばりたいものですねえ。\n@c0@"
141:
  de: "@aOtto@bIch fühl' mich jetzt ziemlich unter Druck g'setzt. Ihr net?\n@c0@"
  en: "@aTuppence@bI feel rather under pressure now, don't you?\n@c0@"
  es: "@aAlazar@bYo me siento de lo más presionado, ¿y tú?\n@c0@"
  fr: "@aInnocent@bJe commence à avoir la pression, maintenant,\npas vousⓡ\n@c0@"
  it: "@aSimon@bAvrei tanta voglia di rispondergli a tono, ma forse è meglio se conto fino a dieci prima di farlo!\nAnzi, facciamo fino a mille...\n@c0@"
  ja: "@a@bピピン「あんなこと言われると\n\tプレッシャーに　なりませんか？\n@c0@"
142:
  de: "@aBianca@bEs würde uns helfen, wenn er uns sagen würde, was er im Sinn hat, oder?\n@c0@"
  en: "@aBianca@bIt would help if he told us what it was he was\r\nafter, eh?\n@c0@"
  es: "@aBianca@bAyudaría bastante que dijese qué demonios quiere, ¿sabes?\n@c0@"
  fr: "@aBianca@bÇa nous aiderait s'il nous disait vraiment\nce qu'il veut, nonⓡ\n@c0@"
  it: "@aBianca@bMa non farebbe meglio a dirci chiaro e tondo come vuole che procediamo?!\n@c0@"
  ja: "@a@bビアンカ「だったら　おじいさんの考えを\n\t教えてくれてもいいと思うけど……。\n@c0@"
143:
  de: "@aNera@bHmm... Ich würde gern wissen, wie er die Stücke dann stattdessen angeordnet haben möchte.\n@c0@"
  en: "@aNera@bHmm... I wonder how he wants us to arrange\r\nthings, then.\n@c0@"
  es: "@aNera@bMmm... Ma come querrá que coloquemos las cosas...\n@c0@"
  fr: "@aNera@bMmm... Je me demande bien comment il veut qu'on arrange les choses, dans ce cas.\n@c0@"
  it: "@aNera@bImmagino che abbia in mente una disposizione diversa per i souvenir...\nMa quale?!\n@c0@"
  ja: "@a@bフローラ「う～ん…\n\tおじいさんは　どんなふうに\n\t展示してほしいのでしょうか？\n@c0@"
144:
  de: "@a%0%a001240@bIch dachte, den Besuchern würde das gefallen. Da habe ich mich wohl geirrt.\n@c0@"
  en: "@a%0%a001240@bI thought the visitors would like it like this.\nLooks like I was wrong.\n@c0@"
  es: "@a%0%a001240@bYo creía que a los visitantes les gustaría así.\nParece que me equivocaba.\n@c0@"
  fr: "@a%0%a001240@bMoi je me disais que ça plairait aux visiteurs,\ncomme ça. J'avais tort, apparemment.\n@c0@"
  it: "@a%0%a001240@bA me piace il modo in cui abbiamo esposto gli oggetti, e penso che anche i visitatori siano soddisfatti!\nPerò Geremia dice che così non va bene...\n@c0@"
  ja: "@a@b%a001240「これでも　よろこんでくれてる\n\tお客さんが　いると思うんだけど…\n\tダメなのかなあ……。\n@c0@"
145:
  de: "@a%0%a001250@bIch kann es nicht leiden, wenn die Leute so mit dir sprechen.\n@c0@"
  en: "@a%0%a001250@bIt really upsets me hearing people talk to you\nlike that.\n@c0@"
  es: "@a%0%a001250@bMe molesta mucho cuando la gente te habla así.\n@c0@"
  fr: "@a%0%a001250@bÇa m'embête vraiment d'entendre quelqu'un te parler comme ça.\n@c0@"
  it: "@a%0%a001250@bOh, mia buona dea!\nTi prego, non farmi diventare una vecchia brontolona incontentabile come Geremia!\n@c0@"
  ja: "@a@b%a001250「お父さんが\n\tあんな言い方されると\n\t悲しくなっちゃう……。\n@c0@"
146:
  de: "@aSancho@bVielleisst sind wir nisst engagiert genug, meinst du nisst?\n@c0@"
  en: "@aSancho@bMaybe we are no dedicated enough,\r\nyou theenk?\n@c0@"
  es: "@aSancho@bPues igual es que no le dedicamos suficiente atención.\n@c0@"
  fr: "@aSancho@bPeut-être qu'on ne s'investit pas assez, tu c-crois que c'est ça, chicoⓡ\n@c0@"
  it: "@aSancho@b¿Forse no ce estiamo impegnando abbastanzas?\n¿Oppure el señor es el campeón del mundo dei rompiscatoles?\n@c0@"
  ja: "@a@bサンチョ「私たちには　まだ\n\t精進がたりないと\n\tいうことでしょうか。　う～む……。\n@c0@"
147:
  de: "@aOtto@bWie sollen wir denn ahnen, was dem alten Mann vorschwebt? Also wirklich!\n@c0@"
  en: "@aTuppence@bHow are we supposed to know what's going on in the old man's head? I ask you!\n@c0@"
  es: "@aAlazar@b¿Cómo vamos a saber lo que tiene ese viejo en la cabeza? ¡A ver!\n@c0@"
  fr: "@aInnocent@bEt comment est-on censés deviner ce qui se passe dans la tête de ce vieux bonhomme, je vous demande un peuⓡⓐ\n@c0@"
  it: "@aSimon@bDovremmo riuscire a scoprire cos'ha in testa il ⓕcaroⓖ Geremia... E se provassi a spaccargliela in due per vedere cosa c'è dentro?!\n@c0@"
  ja: "@a@bピピン「ボクたちにだって\n\t老人の考えは　わかりませんよっ！\n@c0@"
148:
  de: "@aBianca@bEr hatte wirklich klare Vorstellungen, als er sein Museum plante, nicht?\n@c0@"
  en: "@aBianca@bHe really had fixed ideas in his head when he planned this place, eh?\n@c0@"
  es: "@aBianca@bTenía las ideas claras cuando planeó este lugar, ¿eh?\n@c0@"
  fr: "@aBianca@bIl avait vraiment des idées très arrêtées quand\nil a conçu cet endroit, dis doncⓠ\n@c0@"
  it: "@aBianca@bSogno o son desta?\nSbaglio o Geremia comincia a gradire la disposizione che abbiamo scelto?\n@c0@"
  ja: "@a@bビアンカ「ちゃんと　そこまで考えて\n\t造られていたのね…　この博物館って。\n@c0@"
149:
  de: "@aNera@bVielleicht müssen wir sorgfältiger entscheiden, welche Ausstellungsstücke in welchen Räumen ausgestellt werden sollen.\n@c0@"
  en: "@aNera@bPerhaps we need to be more careful about deciding which items to display in which rooms.\n@c0@"
  es: "@aNera@bQuizás necesitemos prestar più attenzione cuando decidamos qué objetos exhibir en qué salas.\n@c0@"
  fr: "@aNera@bPeut-être que nous devrions faire plus attention aux objets que nous choisissons de disposer\r\ndans telle ou telle salle.\n@c0@"
  it: "@aNera@bCredo che dovremmo riflettere meglio su quali souvenir esporre in ciascuna sala.\n@c0@"
  ja: "@a@bフローラ「部屋ごとに　ならべかたを\n\t考えて　かざっていかなくては\n\tならないのですね。\n@c0@"
150:
  de: "@a%0%a001240@bAber es macht doch Spaß, die Sachen so anzuordnen, wie es uns gefällt! Es ist schließlich dein Museum.\n@c0@"
  en: "@a%0%a001240@bBut it's fun just displaying things wherever we want! It is your museum, after all.\n@c0@"
  es: "@a%0%a001240@bPero es diver poner las cosas donde nos apetece. Al fin y al cabo, es tu museo.\n@c0@"
  fr: "@a%0%a001240@bMais c'est rigolo d'exposer des objets justement là où on en a envieⓠ Il est à toi, ce musée, après tout.\n@c0@"
  it: "@a%0%a001240@bIo disporrei gli oggetti a casaccio...\nD'altra parte sei tu il direttore del Museo, no?\nPuoi fare quello che ti pare!\n@c0@"
  ja: "@a@b%a001240「でも　好きなように置くのも\n\t楽しいと思うんだけどな！\n\tお父さんの博物館だもん　いいよね？\n@c0@"
151:
  de: "@a%0%a001250@bHeißt das, wir müssen alles umstellen? Och! Und dabei haben wir uns doch solche Mühe gegeben.\n@c0@"
  en: "@a%0%a001250@bDoes that mean we have to switch everything around? Oh! I thought we'd done a good job.\n@c0@"
  es: "@a%0%a001250@b¿Quiere decir que vamos a tener que cambiar todo de sitio? ¡Oh! Creía que lo habíamos hecho bien.\n@c0@"
  fr: "@a%0%a001250@bÇa veut dire qu'il va falloir tout changer de placeⓡ Ohⓠ Et moi qui croyais qu'on avait fait du bon travail.\n@c0@"
  it: "@a%0%a001250@bQuindi dobbiamo cambiare la disposizione degli oggetti?\nEro convinta che avessimo fatto un buon lavoro...\n@c0@"
  ja: "@a@b%a001250「もう一度　ならべなおしなの？\n\tせっかく　かざったのに……。\n@c0@"
152:
  de: "@aSancho@bIss hatte das vorher nie bemerkt. Je größer der Wert des Ausstellungsstücks, desto weiter oben im Gebäude sollten wir es ausstellen, sí?\n@c0@"
  en: "@aSancho@bI no realise thees before. The more ees the value of the exhibit, the more higher the floor we eshould put eet on display, sí?\n@c0@"
  es: "@aSancho@bNo me había dado cuenta antes. Cuanto más cara sea una cosina, más alto la tenemos que poner...\n@c0@"
  fr: "@aSancho@bJe n'avais pas c-c-compris ça avant. Plus oun objet a de la v-valeur, plus il doit être exposé dans oun étage élevé, siⓡ\n@c0@"
  it: "@aSancho@bNo avevo capito que los oggettos de mayor pregio devono essere espostos a los pianos más altos...\n@c0@"
  ja: "@a@bサンチョ「なるほど　上の部屋に行くほど\n\t価値の高い　名産品を\n\t展示してゆくということですか。\n@c0@"
153:
  de: "@aOtto@bWenn er eine fixe Idee hat, was wohin g'hört, wäre es nett g'wesen, wenn er uns das gleich von Anfang an g'sagt hätt'.\n@c0@"
  en: "@aTuppence@bIf he's got fixed ideas about what goes where, then it would be helpful if he let us know at the beginning.\n@c0@"
  es: "@aAlazar@bSi ya tenía pensado cómo colocar las cosas, podría haber tenido el detalle de decírnoslo al principio.\n@c0@"
  fr: "@aInnocent@bS'il a des idées aussi arrêtées sur l'endroit où doit aller chaque objet, pourquoi ne pas nous l'avoir dit dès le départⓡ\n@c0@"
  it: "@aSimon@bVisto che lui sa dove mettere gli oggetti, non sarebbe un bel risparmio di tempo per tutti se ce lo dicesse chiaramente?!\n@c0@"
  ja: "@a@bピピン「そういうことは　もっと早く\n\t言ってくれれば……。\n@c0@"
154:
  de: "@aBianca@bSo, das wird jetzt der Moment der Wahrheit. Wir haben getan, was wir konnten, um aus dem Ganzen ein richtiges Museum zu machen.\n@c0@"
  en: "@aBianca@bThis'll be the real moment of truth now. We have to do our best to make this place into a decent museum.\n@c0@"
  es: "@aBianca@bEste es el momento de la verdad. Tenemos que hacer todo lo posible para convertir esto en un museo decente, ¿sabes?\n@c0@"
  fr: "@aBianca@bÇa va être le moment de vérité. On doit faire\r\nde notre mieux pour transformer cet endroit\r\nen un beau musée.\n@c0@"
  it: "@aBianca@bAdesso viene il bello!\nDobbiamo rendere questo posto un museo in grado di attirare visitatori di ogni genere!\n@c0@"
  ja: "@a@bビアンカ「これからが　大事なのね。\n\tもっといい　博物館になるように\n\tがんばろうね。\n@c0@"
155:
  de: "@aNera@bDann müssen wir jetzt also überlegen, was für Dinge wir zeigen... Mir dreht sich der Kopf bei all dem, was wir jetzt zu bedenken haben!\n@c0@"
  en: "@aNera@bSo now we need to consider the types of things we have on display... My head's starting to spin with all these different things to think about!\n@c0@"
  es: "@aNera@bAllora, tenemos que considerar qué tipo de cosas estamos exhibiendo... La mia testa me está dando vueltas con tanto pensare.\n@c0@"
  fr: "@aNera@bAlors maintenant, il faut qu'on prenne en compte le type d'objets qu'on expose...\n㈡\nJ'ai la tête qui tourne avec toutes ces choses auxquelles il faut penser en même tempsⓠ\n@c0@"
  it: "@aNera@bQuindi ora ci tocca anche prendere in considerazione che tipo di oggetti esporre?\nOh, mi gira la testa... Santa dea, aiutaci tu!\n@c0@"
  ja: "@a@bフローラ「名産品の種類ですか…\n\tいろいろ　考えることが　多くて\n\t頭が　痛くなってきましたわ……。\n@c0@"
156:
  de: "@a%0%a001240@bDas Museum steckt voller richtig toller Ausstellungsstücke, Papa! Selbst der alte Franz wirkt ganz zufrieden!\n@c0@"
  en: "@a%0%a001240@bThe museum's full of really cool exhibits, Dad!\nEven Old Man Nick Knack seems quite happy.\n@c0@"
  es: "@a%0%a001240@bEl museo está lleno de cosinas geniales, papi.\nHasta el abuelo Nino parece estar satisfecho.\n@c0@"
  fr: "@a%0%a001240@bCe musée est plein d'objets vraiment super, papaⓠ Même le vieux Bricabrac a l'air plutôt content.\n@c0@"
  it: "@a%0%a001240@bIl Museo del Souvenir ora è pieno di oggetti.\nSpero che Geremia sia finalmente contento!\n@c0@"
  ja: "@a@b%a001240「お父さん　博物館が\n\t名産品で　いっぱいだね。\n\tおじいさんも　少し　うれしそうだよ！\n@c0@"
157:
  de: "@a%0%a001250@bNeue Besucher? Da bin ich ja mal gespannt.\n@c0@"
  en: "@a%0%a001250@bDifferent types of visitors?\nI wonder what they'll be like.\n@c0@"
  es: "@a%0%a001250@b¿Gente distinta?\nMe pregunto cómo será.\n@c0@"
  fr: "@a%0%a001250@bUn public différentⓡ Je me demande à quoi ces nouveaux visiteurs ressembleront.\n@c0@"
  it: "@a%0%a001250@bChissà a quali tipi di visitatori si riferisce Geremia...\n@c0@"
  ja: "@a@b%a001250「ちがうお客さんって\n\tどんな人が　来るのかな？\n@c0@"
158:
  de: "@a%0%a001250@bWenn wir die Ausstellung verändern, müssen wir erst jede Menge gute Andenken sammeln.\n@c0@"
  en: "@a%0%a001250@bIf we're going to change the displays, we'll have to collect up lots of good souvenirs first.\n@c0@"
  es: "@a%0%a001250@bSi vamos a cambiar la exhibición, primero necesitamos hacernos con montones de cosinas chulas.\n@c0@"
  fr: "@a%0%a001250@bSi on doit modifier l'exposition, on a d'abord intérêt\nà rassembler beaucoup d'objets intéressants.\n@c0@"
  it: "@a%0%a001250@bSe dobbiamo variare l'esposizione, ci toccherà trovare altri souvenir.\n@c0@"
  ja: "@a@b%a001250「でも　ならべかえるんだったら\n\tたくさん　名産を\n\t用意しておかないと……。\n@c0@"
159:
  de: "@aSancho@bJetzt kommen die essten Koryphäen, die Schnickschnack-Experten, um siss deine Sammlung anzusehen, Chico.\n@c0@"
  en: "@aSancho@bNow the aficionados, the experts of the\r\nknick-knacks, they gonna come to esee\r\nyour collection, friend.\n@c0@"
  es: "@aSancho@bAhorita sí que vendrán los aficionados a las cosinas para ver tu colección, chamaco.\n@c0@"
  fr: "@aSancho@bMaintenant, les aficionados, tous les experts en objets de c-c-collection, vont venir admirer ton\r\nm-musée, chico.\n@c0@"
  it: "@aSancho@bAhora al Museo del Souvenir verranno muchos criticos por valutare los oggettos que abbiamo raccolto, chico...\n@c0@"
  ja: "@a@bサンチョ「これからは　目のこえた\n\tお客さんも　%a000090王の集めた\n\t名産品を見に来られるのでしょうね。\n@c0@"
160:
  de: "@aOtto@bManche unserer Besucher sind vielleicht net ganz leicht zufriedenzustell'n, darum ist es gar net so leicht, sich zu überleg'n, was wir zeigen woll'n.\n@c0@"
  en: "@aTuppence@bSome of our visitors may be a little hard to please, so it's going to be hard figuring out which articles to put on display.\n@c0@"
  es: "@aAlazar@bAlgunos de nuestros visitantes pueden ser difíciles de contentar, así que va a ser difícil saber qué artículos exhibir.\n@c0@"
  fr: "@aInnocent@bCertains de nos visiteurs seront peut-être difficiles à satisfaire. Ça risque d'être dur de savoir quels articles il faut exposer.\n@c0@"
  it: "@aSimon@bImmagino che al Museo verranno anche visitatori molto esigenti, quindi dovremmo capire quali sono i souvenir preferiti da questi ⓕpalati finiⓖ...\n@c0@"
  ja: "@a@bピピン「もの好きな　お客さんも\n\tいるでしょうから　かざる品物を\n\tえらぶのが　むずかしいですよ。\n@c0@"
161:
  de: "@aBianca@bDen Besuchern gefällt's hier, aber der alte Firle Franz ist immer noch nicht ganz zufrieden, nicht?\n@c0@"
  en: "@aBianca@bThe visitors are enjoyin' the place, but Old Man Nick Knack still en't quite happy, eh?\n@c0@"
  es: "@aBianca@bLos visitantes disfrutan de la visita, pero el abuelo Nino no parece demasiado feliz, ¿verdad?\n@c0@"
  fr: "@aBianca@bLes visiteurs aiment cet endroit, mais le vieux Bricabrac n'est toujours pas content, heinⓡ\n@c0@"
  it: "@aBianca@bI visitatori sembrano contenti.\nPer una volta, quella lingua lunga di Geremia non ha avuto molto da ridire...\n@c0@"
  ja: "@a@bビアンカ「お客さんには　よくても\n\tおじいさんの気には\n\tそぐわないみたいね……。\n@c0@"
162:
  de: "@aNera@bAlso wirklich! Es wäre eine große Hilfe, wenn er einfach mal Klartext reden würde!\n@c0@"
  en: "@aNera@bHonestly! It would help if he just told it like it is one of these days!\n@c0@"
  es: "@aNera@b¡Hay que ver! Estaría bene que hablase claro un día de estos.\n@c0@"
  fr: "@aNera@bFranchementⓠ Ça nous aiderait s'il pouvait se mettre à parler un peu plus clairementⓠ\n@c0@"
  it: "@aNera@bChissà se Geremia comincia a essere soddisfatto del nostro lavoro o se ha solo deciso di prendersi una pausa dal suo solito brontolare...\n@c0@"
  ja: "@a@bフローラ「もう！　たまには　はっきり\n\t言っていただきたいですわね。\n@c0@"
163:
  de: "@a%0%a001240@bEs sieht so aus, als wäre der alte Mann mit irgendetwas immer noch nicht ganz zufrieden. Aber den Besuchern gefällt's, also wen kümmert's?\n@c0@"
  en: "@a%0%a001240@bLooks like something's still troubling the old man.\nBut the customers seem happy, so who cares?\n@c0@"
  es: "@a%0%a001240@bParece que aún hay algo que preocupa al abuelete.\nPero los visitantes están satisfechos así que, ¿qué más dará?\n@c0@"
  fr: "@a%0%a001240@bOn dirait que quelque chose tracasse toujours le vieux monsieur. Mais les visiteurs ont l'air content, alors pourquoi s'en faireⓡ\n@c0@"
  it: "@a%0%a001240@bLa gente che viene al Museo del Souvenir è contenta, quindi lo sono anch'io!\nSiamo troppo forti!\n@c0@"
  ja: "@a@b%a001240「おじいさん　なにか\n\t言いたそうだね。　でも　いっか。\n\tお客さんは　よろこんでるもん！\n@c0@"
164:
  de: "@a%0%a001250@bWird der alte Franz etwa blind? Oder meint er, es gefällt ihm nicht, was wir gemacht haben?\n@c0@"
  en: "@a%0%a001250@bIs Old Man Nick Knack going blind? Or does he mean that he doesn't like what we've done?\n@c0@"
  es: "@a%0%a001250@b¿Es que el abuelo Nino se ha vuelto ciego? ¿O es que no le gusta lo que hemos hecho?\n@c0@"
  fr: "@a%0%a001250@bEst-ce qu'il est en train de perdre la vueⓡ\nOu bien est-ce qu'il est en train de dire\nqu'il n'aime pas ce qu'on a faitⓡ\n@c0@"
  it: "@a%0%a001250@bStiamo facendo proprio un buon lavoro!\nAnche Geremia comincia a essere contento, il che è tutto dire...\n@c0@"
  ja: "@a@b%a001250「おじいさん\n\t目を　つぶってるの？　それって\n\tなにか　気に入らないってこと？\n@c0@"
165:
  de: "@aSancho@bDer alte Señor, er weiß, was er will, eh?\n@c0@"
  en: "@aSancho@bThees old señor, he knows what he likes, eh?\n@c0@"
  es: "@aSancho@bEl abuelo tiene bien claro lo que quiere.\n@c0@"
  fr: "@aSancho@bCe vieux señor, il a des g-g-goûts bien arrêtés, noⓡ\n@c0@"
  it: "@aSancho@b¡Estiamo andando bien, chico!\n@c0@"
  ja: "@a@bサンチョ「デスじいさんは　いろいろと\n\tこだわりが　あるみたいですねえ。\n@c0@"
166:
  de: "@aOtto@bIch wünscht', der Alte würd' endlich einmal die Karten auf den Tisch leg'n und uns sag'n, was ihm net g'fällt.\n@c0@"
  en: "@aTuppence@bI do wish the old man would just lay his cards on the table and tell us what the problem is.\n@c0@"
  es: "@aAlazar@bMe gustaría que el viejo pusiese las cartas sobre la mesa y nos dijera cuál es el problema.\n@c0@"
  fr: "@aInnocent@bJ'aimerais bien que ce vieux bonhomme joue cartes sur table et nous dise une bonne fois pour toutes quel est le problème.\n@c0@"
  it: "@aSimon@bTemo che la soddisfazione di Geremia non durerà a lungo.\n㈡\nScommetto che tra non molto la vecchia cariatide ci assillerà con un'altra delle sue lamentele...\n@c0@"
  ja: "@a@bピピン「奥歯に　物の　はさまったような\n\t言い方をして…　気になるなあ……。\n@c0@"
167:
  de: "@aBianca@bEr nimmt ja kein Blatt vor den Mund, was? Der kann einem richtig auf die Nerven gehen!\n@c0@"
  en: "@aBianca@bHe certainly didn't hold back, eh!\r\nWhat a tirin' old fella he is!\n@c0@"
  es: "@aBianca@bNo se ha cortado un pelo, ¿eh?\r\nEste viejo es un tostón.\n@c0@"
  fr: "@aBianca@bIl n'a pas pris de pincettes, dis doncⓠ\nIl commence à me fatiguerⓠ\n@c0@"
  it: "@aBianca@bCi risiamo!\nA Geremia non ne va mai bene una! Io gli... Io lo...\nGrrr! Dea mia, fammi star zitta che è meglio!\n@c0@"
  ja: "@a@bビアンカ「思いっきり言ってたわよ！\n\tもうっ　しょうのない　おじいさんね！\n@c0@"
168:
  de: "@aNera@bDarauf also wollte er hinaus. Aber das Arrangement kommt doch ganz auf den persönlichen Geschmack an. Da hat jeder seine eigenen Vorstellungen.\n@c0@"
  en: "@aNera@bSo that's his problem. But choosing a layout comes down to personal preference. Everyone has their different ideas.\n@c0@"
  es: "@aNera@bAsí que ese es il suo problema. Pero elegir un orden es cuestión de gustos. Cada cual tiene sus preferencias.\n@c0@"
  fr: "@aNera@bAlors c'est ça, son problème... Mais le choix d'une disposition est une affaire de goût. À chacun ses préférences.\n@c0@"
  it: "@aNera@bPerché contesta il nostro criterio di esposizione dei souvenir? Dovrebbe sapere che queste sono scelte personali!\n@c0@"
  ja: "@a@bフローラ「まあ　そんなことでしたのね。\n\tでも　ならべ方が　人それぞれなのは\n\t当たり前のことですわ。\n@c0@"
169:
  de: "@a%0%a001240@bDer alte Nick hat mich gerade mehr erschreckt als ein gruseliges Monster!\n@c0@"
  en: "@a%0%a001240@bOld Man Nick Knack was scarier than a scary monster just then!\n@c0@"
  es: "@a%0%a001240@bEl abuelo Nino daba más miedo que un monstruo.\n@c0@"
  fr: "@a%0%a001240@bLe vieux Bricabrac vient de se montrer plus effrayant qu'un horrible monstreⓠ\n@c0@"
  it: "@a%0%a001240@bMamma mia, che impressione!\nMa perché Geremia si arrabbia tanto, eh?\nNon gli fa bene alla salute strillare in quel modo!\n@c0@"
  ja: "@a@b%a001240「今のおじいさん\n\t魔物より　こわかったよ……。\n@c0@"
170:
  de: "@a%0%a001250@bAuch wenn es ihm nicht gefällt, ich finde jedenfalls, es sieht sehr schön aus, wie du alles angeordnet hast, Papa.\n@c0@"
  en: "@a%0%a001250@bWell, he might not like it, but I think the way you've arranged everything is really nice, Dad.\n@c0@"
  es: "@a%0%a001250@bBueno, igual a él no le gusta, pero yo creo que lo has colocado todo genial, papi.\n@c0@"
  fr: "@a%0%a001250@bÇa ne lui plaît peut-être pas, mais moi je trouve\nque la façon dont tu as tout organisé est très jolie.\n@c0@"
  it: "@a%0%a001250@bSecondo me Geremia non ci sta più con la testa.\nÈ partito, andato, totalmente perso.\nPerché non se ne va in pensione?\n@c0@"
  ja: "@a@b%a001250「おじいさんは　ああ言ってるけど\n\tわたし　お父さんの展示品のならべ方\n\t好きです。\n@c0@"
171:
  de: "@aSancho@bHeh heh heh! Vielleisst hält er es jetzt nisst mehr für so eine gute Idee, dass er dir sein Museum übergeben hat, Chico?\n@c0@"
  en: "@aSancho@bHeh heh heh! Maybe he no theenk ees esuch a good idea to geeve to you thees museum now, eh, friend?\n@c0@"
  es: "@aSancho@b¡Je, je, je! Pues igual ya no piensa que fue una buena idea encargarte este museo, chamaco.\n@c0@"
  fr: "@aSancho@bHé hé héⓠ Il se dit peut-être que ce n'était pas\noune si b-b-b-bonne idée de te donner ce musée finalement, hein, chicoⓡ\n@c0@"
  it: "@aSancho@bForse avremmo potuto pensare a un altro modo de esporre los souvenir...\n@c0@"
  ja: "@a@bサンチョ「はっはっは。\n\tここは　坊っちゃんに博物館をまかせた\n\tデスじいさんも悪かったということで。\n@c0@"
172:
  de: "@aSancho@bAber das ist ganz normal. Man kann ja nisst über Nacht zu einem Experten werden, nisst wahr?\n@c0@"
  en: "@aSancho@bBut ees normal. You can no become an expert over the night, sí?\n@c0@"
  es: "@aSancho@bPero es lo normal. Uno no se convierte en un experto de la noche a la mañana...\n@c0@"
  fr: "@aSancho@bMais c'est normal. On ne d-d-devient pas oun expert en oune nuit, siⓡ\n@c0@"
  it: "@aSancho@b¿Ma el señor Geremia potrebbe anche rivolgerse a nosotros en maniera más gentile, no?\n@c0@"
  ja: "@a@bサンチョ「しかたありませんよ。\n\t誰だって　最初から\n\tうまくできるはずなんて　ありません。\n@c0@"
173:
  de: "@aOtto@bJetzt sehen wir, aus welchem Holz er g'schnitzt ist! Also, ich hätt's ja lieber nie erfahr'n.\n@c0@"
  en: "@aTuppence@bSo now we see his true character! I think it was nicer to be blissfully ignorant.\n@c0@"
  es: "@aAlazar@b¡Ahora ha mostrado su verdadero rostro! Creo que era mejor vivir en la ignorancia.\n@c0@"
  fr: "@aInnocent@bOn connaît maintenant son véritable caractèreⓠ\nJe préférais notre bienheureuse ignorance d'avant.\n@c0@"
  it: "@aSimon@bQual è la pena per chi commette un ⓕGeremiacidioⓖ?!\n㈡\nTutto sommato, non è necessario arrivare a tanto: sarebbe sufficiente annodargli le corde vocali tra loro...\n@c0@"
  ja: "@a@bピピン「ついに　本音が\n\tばくはつしたという　感じですね。\n\t思わず　のけぞってしまいました。\n@c0@"
174:
  de: "@aBianca@bHa ha! Wie ein Gespenst verhält sich der alte Mann nicht gerade, was?\n@c0@"
  en: "@aBianca@bHa ha! The old fella dun't act much like a ghost, eh?\n@c0@"
  es: "@aBianca@b¡Ja, ja! El abuelo no actúa como un fantasma, ¿eh?\n@c0@"
  fr: "@aBianca@bHa haⓠ Ce vieux bonhomme ne se conduit pas du tout comme un fantôme, heinⓡ\n@c0@"
  it: "@aBianca@bNon è certo la vitalità che gli manca, eh?\nE nemmeno la voglia di parlare!\n@c0@"
  ja: "@a@bビアンカ「うふふ。\n\tなんか　あらためて思うけど\n\tゆうれいらしくない　おじいさんよね。\n@c0@"
175:
  de: "@aNera@bDas Sonnenlicht ist ein göttliches Geschenk. Es verleiht allen Wesen unserer Welt Leben.\n@c0@"
  en: "@aNera@bSunlight is a gift from above. It gives life to all sorts of creatures in our world.\n@c0@"
  es: "@aNera@bIl sole es un regalo del cielo. Da vita a todo tipo de criaturas de nuestro mundo.\n@c0@"
  fr: "@aNera@bLa lumière du soleil est un cadeau des cieux.\r\nElle donne la vie à toutes sortes de créatures\r\nde notre monde.\n@c0@"
  it: "@aNera@bLa luce e il calore del sole sono doni che la dea fa quotidianamente a tutti gli esseri viventi.\n@c0@"
  ja: "@a@bフローラ「日の光は　天の恵み。\n\tあらゆるものに　生きるチカラを\n\t与えてくれます。\n@c0@"
176:
  de: "@aNera@bIch bin allerdings nicht sicher, wie es einem Gespenst guttun könnte.\n@c0@"
  en: "@aNera@bI'm not sure what good it does for ghosts, mind you.\n@c0@"
  es: "@aNera@bMa no sé qué bien le hará a los fantasmas.\n@c0@"
  fr: "@aNera@bMais je ne sais pas bien en quoi elle est bénéfique\r\npour les fantômes, je dois l'admettre.\n@c0@"
  it: "@aNera@bAgli uomini, alle piante, ai mostri e ai vecchi rompiscat...\nOh, mia buona dea! Perdona la mia insolenza!\n@c0@"
  ja: "@a@bフローラ「でも　ゆうれいさんには\n\tどうなんでしょう？\n@c0@"
177:
  de: "@a%0%a001240@bEs ist schön, die Sonne am Himmel zu sehen. Jetzt fühle ich mich ganz warm und schläfrig.\n@c0@"
  en: "@a%0%a001240@bIt's nice to see the sun shining. I feel all warm and sleepy now.\n@c0@"
  es: "@a%0%a001240@bEs agradable estar al sol. Ahora estoy calentito y me ha entrado sueño.\n@c0@"
  fr: "@a%0%a001240@bC'est agréable de voir le soleil briller.\nÇa me réchauffe et ça m'endort un peu.\n@c0@"
  it: "@a%0%a001240@bOggi è davvero una bella giornata.\nPerché non andiamo a fare un picnic?\n@c0@"
  ja: "@a@b%a001240「お日さまの光は\n\t気持ちいいね……。\n\tなんだか　眠くなってきちゃった。\n@c0@"
178:
  de: "@a%0%a001250@bEs fühlt sich so schön warm an. Ich liebe den Geruch eines Sonnentages!\n@c0@"
  en: "@a%0%a001250@bIt feels so nice and warm. I love the smell of the sun!\n@c0@"
  es: "@a%0%a001250@bSe está tan calentito. ¡Me encanta el olor del sol!\n@c0@"
  fr: "@a%0%a001250@bIl fait si beau et si chaud. J'adore l'odeur du soleilⓠ\n@c0@"
  it: "@a%0%a001250@bIl sole che splende in cielo è uno degli spettacoli più belli che gli occhi degli uomini possano ammirare!\n@c0@"
  ja: "@a@b%a001250「あたたかくて　いい気持ち。\n\tお日さまのにおいって大好き！\n@c0@"
179:
  de: "@aSancho@bSí. Alles Unwisstige sollten wir auf mañana verschieben. Es ist sehr wisstig, siss manssmal zu erholen, weißt du.\n@c0@"
  en: "@aSancho@bSí. Thees ees mañana. Ees very important.\r\nEes good to relax esometimes, you know.\n@c0@"
  es: "@aSancho@b¡Ándale! Ya es por la mañana. Es reteimportante.\r\nHace bien relajarse de vez en cuando.\n@c0@"
  fr: "@aSancho@bSi. C'est le m-matin. C'est muy important.\r\nIl faut prendre le temps de se r-r-reposer,\r\nparfois.\n@c0@"
  it: "@aSancho@bSotto esto sole es bello canticchiareeeh... Ⓠ\nY es bueno camminare-eeeh... Ⓠ\n¡Y una paella cucinareeeh! Ⓡ\n@c0@"
  ja: "@a@bサンチョ「たまにはこうして\n\tひと息いれるのも　必要ですね。\n\tしばしの休息です。\n@c0@"
180:
  de: "@aOtto@bZzz... Jöh! Ich muss eingenickt sein... Zzz... zzz...\n@c0@"
  en: "@aTuppence@bZzz... Oh dear! I seem to have fallen asleep... Zzz...zzz...\n@c0@"
  es: "@aAlazar@bZzz... ¡Oh, vaya! Me he quedado transpuesto. Zzz..., zzz...\n@c0@"
  fr: "@aInnocent@bZzz... Oh, par mon épéeⓠ Je me suis endormi, on dirait... Zzz...zzz...\n@c0@"
  it: "@aSimon@bZzz... Eh? Cosa?\nOh, temo di essermi addormentato...\nÈ successo qualcosa? È già ora di colazione?\n@c0@"
  ja: "@a@bピピン「ウトウト……　はっ！\n\tいけない　思わず眠って……。\n\tウトウト……。\n@c0@"
181:
  de: "@aBianca@bEs ist schön zu sehen, dass die Ausstellung den Besuchern Spaß macht. Das haben wir gut hingekriegt.\n@c0@"
  en: "@aBianca@bIt's nice to see folk havin' a fun time of it.\r\nWe did a good job here.\n@c0@"
  es: "@aBianca@bMe gusta ver a la gente disfrutando aquí.\r\nHemos hecho un buen trabajo, ¿sabes?\n@c0@"
  fr: "@aBianca@bC'est bien de voir que les gens passent un bon moment. On a fait du bon travail.\n@c0@"
  it: "@aBianca@bSono felice che la gente si diverta al Museo del Souvenir.\nÈ bello sapere che apprezzano il nostro lavoro!\n@c0@"
  ja: "@a@bビアンカ「楽しんで見てもらえてるんだ。\n\tがんばって　集めてよかったよね。\n@c0@"
182:
  de: "@aNera@bDas Lächeln auf den Gesichtern der Leute ist die schönste Belohnung für unsere ganzen Mühen hier.\n@c0@"
  en: "@aNera@bSeeing people's smiling faces is the best reward for our efforts there could ever be.\n@c0@"
  es: "@aNera@bVer las caras sonrientes de la gente es veramente la mejor recompensa a tutti nuestros esfuerzos.\n@c0@"
  fr: "@aNera@bVoir un sourire sur le visage des gens est la plus belle récompense qui soit pour tous nos efforts.\n@c0@"
  it: "@aNera@bLe espressioni soddisfatte dei visitatori del Museo sono la ricompensa migliore che potessimo mai ricevere per ciò che abbiamo fatto per questo posto!\n@c0@"
  ja: "@a@bフローラ「みなさんの笑顔が　何よりも\n\tはげみになりますわ。\n@c0@"
183:
  de: "@a%0%a001240@bMir macht's Spaß, wenn's den Besuchern Spaß macht!\n@c0@"
  en: "@a%0%a001240@bIt feels great to give people a good time like this!\n@c0@"
  es: "@a%0%a001240@b¡Me encanta ver a la gente disfrutando así!\n@c0@"
  fr: "@a%0%a001240@bC'est super de faire passer un bon moment\naux gensⓠ\n@c0@"
  it: "@a%0%a001240@bSapere che la gente è contenta di come abbiamo organizzato il Museo mi rende orgoglioso!\nEh, sì! Siamo stati proprio bravi!\n@c0@"
  ja: "@a@b%a001240「人に　よろこんでもらえるのって\n\tすごく気分がいいね！\n@c0@"
184:
  de: "@a%0%a001250@bEs war nicht leicht, sich auszudenken, wie alles platziert werden sollte, aber es hat sich gelohnt.\n@c0@"
  en: "@a%0%a001250@bIt was hard work figuring out how to display everything, but it was well worth it.\n@c0@"
  es: "@a%0%a001250@bHa sido difícil averiguar cómo colocar todo, pero ha merecido la pena.\n@c0@"
  fr: "@a%0%a001250@bÇa a été dur de trouver comment exposer tous les objets, mais ça en valait la peine.\n@c0@"
  it: "@a%0%a001250@bTrasformare questo posto in un vero museo è stata un'impresa veramente dura, ma ne è valsa la pena!\n@c0@"
  ja: "@a@b%a001250「名産品を　ならべかえるのは\n\t大変だったけど　今は\n\tすごく　すっきりした気分！\n@c0@"
185:
  de: "@aSancho@bEs ist ein gutes Gefühl, erfolgreiss zu sein, no?\n@c0@"
  en: "@aSancho@bEsuccess, ees a good feeling, sí?\n@c0@"
  es: "@aSancho@b¡El éxito es lo más, nomás!\n@c0@"
  fr: "@aSancho@bC'est oun sentiment agréable, la r-r-réussite, noⓡ\n@c0@"
  it: "@aSancho@bPienso que ahora el señor Geremia no potrà proprio lamentarse...\n㈡\n¿Que esto dicendo?\n¡Quel vecchio brontolon troverà siempre qualcosas que no gli va a genios!\n@c0@"
  ja: "@a@bサンチョ「何かを　なしとげることは\n\tとても心地がよいものですね。\n@c0@"
186:
  de: "@aOtto@bNach all Eurer harten Arbeit kommen hoffentlich noch mehr B'sucher, um sich daran zu erfreu'n.\n@c0@"
  en: "@aTuppence@bAfter all the hard work you did, I should hope we have even more visitors come along to enjoy it.\n@c0@"
  es: "@aAlazar@bDespués del duro trabajo que habéis tenido que hacer, espero que vengan todavía más visitantes a disfrutarlo.\n@c0@"
  fr: "@aInnocent@bAprès tous les efforts que vous avez fournis, j'espère que nous aurons toujours plus de visiteurs pour en profiter.\n@c0@"
  it: "@aSimon@bSpero che i visitatori soddisfatti dicano ai loro amici e conoscenti quanto si sono divertiti qui, così tutto il mondo saprà quant'è bello il Museo del Souvenir!\n@c0@"
  ja: "@a@bピピン「%a000090王が　あれだけ\n\tがんばったんですから　もっと多くの\n\tお客さんに来てもらいたいです。\n@c0@"
187:
  de: "@aBianca@bWir haben wirklich ein paar richtig gute Sachen in der Ausstellung, nicht?\n@c0@"
  en: "@aBianca@bWe've certainly got a rare old bunch of stuff on display at the moment, eh?\n@c0@"
  es: "@aBianca@bLa verdad es que estamos exhibiendo un montón de cosinas de lo más singulares, ¿sabes?\n@c0@"
  fr: "@aBianca@bC'est vrai qu'on a des pièces sacrément rares d'exposées, en ce moment.\n@c0@"
  it: "@aBianca@bIl Museo del Souvenir espone oggetti davvero interessanti.\nCredo che sia una delle più belle collezioni esistenti al mondo.\n@c0@"
  ja: "@a@bビアンカ「たしかに　今　展示している物は\n\tめったに　見られないものばかりよね。\n@c0@"
188:
  de: "@aBianca@bDafür hat sich die Mühe gelohnt, %a000090.\n@c0@"
  en: "@aBianca@bIt was worth all the effort, %a000090.\n@c0@"
  es: "@aBianca@bHa merecido la pena, %a000090.\n@c0@"
  fr: "@aBianca@bÇa valait bien tous ces efforts, %a000090.\n@c0@"
  it: "@aBianca@bAbbiamo fatto un ottimo lavoro, %a000090.\nAnzi, abbiamo fatto un lavoro ⓕspaventosamenteⓖ buono! Ih ih ih!\n@c0@"
  ja: "@a@bビアンカ「がんばったかいが\n\tあったわね　%a000090。\n@c0@"
189:
  de: "@aNera@bDas ist das Großartige an einem Museum. Hier können die Leute Dinge sehen, die sie normalerweise nie zu Gesicht bekommen würden.\n@c0@"
  en: "@aNera@bThat's what's so great about a museum. It gives people the opportunity to see things they would never normally come across.\n@c0@"
  es: "@aNera@bVeramente, esto es lo mejor de un museo. Le da a la gente la oportunità de ver cosas que nunca tendrían occasione de ver.\n@c0@"
  fr: "@aNera@bC'est ce qu'il y a de formidable, avec un musée.\r\nIl offre aux gens l'occasion de découvrir des pièces qu'ils ne verraient jamais ailleurs.\n@c0@"
  it: "@aNera@bI musei sono istituzioni importantissime. Permettono a chiunque di entrare in contatto con culture diverse e di ampliare la propria conoscenza del mondo.\n@c0@"
  ja: "@a@bフローラ「ふだん　目にすることが\n\tできないものを　見に来られるのが\n\t博物館の　いいところですわ。\n@c0@"
190:
  de: "@a%0%a001240@bEs gibt so viele verschiedene Dinge, die man sammeln kann. Das macht echt Spaß!\n@c0@"
  en: "@a%0%a001240@bThere are so many different types of things to collect. This is really good fun!\n@c0@"
  es: "@a%0%a001240@bHay tantas cosinas distintas que conseguir. ¡Esto es divertidísimo!\n@c0@"
  fr: "@a%0%a001240@bIl y a tellement de types d'objets différents\nà collectionner. On s'amuse vraiment bienⓠ\n@c0@"
  it: "@a%0%a001240@bNon avrei mai immaginato che al mondo esistessero tanti oggetti diversi...\nAlcuni di essi sono veramente strani!\n@c0@"
  ja: "@a@b%a001240「名産品って　本当にたくさんの\n\t種類があって　集めてて楽しいよ！\n@c0@"
191:
  de: "@a%0%a001250@bWer nicht viel Gelegenheit hat zu reisen, kann sich das Museum ansehen und bekommt das Gefühl, er wäre auf der ganzen Welt herumgekommen.\n@c0@"
  en: "@a%0%a001250@bPeople who don't have much chance to travel\ncan come here and feel like they've travelled the whole world.\n@c0@"
  es: "@a%0%a001250@bLa gente que no puede viajar, puede venir aquí y sentirse como si hubieran viajado por todo el mundo.\n@c0@"
  fr: "@a%0%a001250@bLes gens qui n'ont pas beaucoup d'occasions de voyager et qui viennent ici ont un peu l'impression d'avoir parcouru le monde entier.\n@c0@"
  it: "@a%0%a001250@bLe persone che non hanno la possibilità di viaggiare possono venire al Museo del Souvenir e ammirare oggetti creati in paesi lontani. È fantastico!\n@c0@"
  ja: "@a@b%a001250「旅に出られない人でも\n\tここに来れば　世界をまわってる\n\t気分になれるよね。\n@c0@"
192:
  de: "@aSancho@bSí. Diese Ausstellungsstücke, sie zeigen die Kulturen der ganzen Welt. Wir haben hier jetzt so viele verschiedene Dinge.\n@c0@"
  en: "@aSancho@bSí. These exhibits, they eshow the cultures from all over the world. We have eso many different theengs here now.\n@c0@"
  es: "@aSancho@b¡Ándale! Las cosinas son de todito el mundo entero. Tenemos tantas cosas distintas aquí.\n@c0@"
  fr: "@aSancho@bSi. Ces expositions, elles m-montrent des cultures\r\ndu monde entier. On a tellement de p-p-pièces différentes, maintenant.\n@c0@"
  it: "@aSancho@bVisitare el Museo del Souvenir es como fare el giro del mundo.\nAquí ce sono oggettos provenientes da todo el planeta!\n@c0@"
  ja: "@a@bサンチョ「名産品というものは　その土地の\n\t文化を　あらわしていますから\n\t特色のある物が多いのですね。\n@c0@"
193:
  de: "@aOtto@bIch kannte vieles von dem, was wir hier zeigen, vorher selbst noch net. Ich würd' sie mir gern selbst einmal genauer ansehen, wenn wir etwas Zeit haben.\n@c0@"
  en: "@aTuppence@bI hadn't seen a lot of the things we have on display before myself. I wouldn't mind having a closer look when there's more time.\n@c0@"
  es: "@aAlazar@bNi yo mismo había visto muchas de las cosas que se exhiben. Me gustaría verlas mejor cuando tengamos tiempo.\n@c0@"
  fr: "@aInnocent@bJe n'avais moi-même encore jamais vu une bonne partie des pièces qui sont exposées.\n㈡\nJe les admirerais volontiers de plus près, quand nous aurons plus de temps.\n@c0@"
  it: "@aSimon@bIo stesso non sapevo dell'esistenza della maggior parte degli oggetti esposti qui. Quando avrò un po' di tempo farò un giro per ammirarli con calma.\n@c0@"
  ja: "@a@bピピン「ボクも　見たことのない物が\n\tたくさんありましたよ。\n\tいつか　じっくり見てみたいです。\n@c0@"
194:
  de: "@aBianca@bMeine Güte! Wir müssen richtig gut gewesen sein, wenn er uns jetzt in den höchsten Tönen lobt!\n@c0@"
  en: "@aBianca@bBlimey! We must've done a good job for him to be\r\nso complimentary!\n@c0@"
  es: "@aBianca@b¡Cuernos! Debemos de haberlo hecho genial para que nos dedique esos halagos, ¿sabes?\n@c0@"
  fr: "@aBianca@bSaperlipopetteⓠ On a dû faire un sacré bon travail pour qu'il nous fasse un compliment pareilⓠ\n@c0@"
  it: "@aBianca@bGeremia ci ha fatto un complimento?!\nChiama un medico, credo che il nostro anziano amico non si senta tanto bene... Eh eh eh!\n@c0@"
  ja: "@a@bビアンカ「あの　デスじいさんが\n\tここまで　ほめてくれるなんて……。\n\tよかったね　%a000090。\n@c0@"
195:
  de: "@aNera@bIch glaube, das ist womöglich das erste Mal, dass er uns ein Kompliment gemacht hat!\n@c0@"
  en: "@aNera@bI think that's possibly the first time he's ever paid us a compliment!\n@c0@"
  es: "@aNera@bCredo que es la prima volta que nos hace un cumplido.\n@c0@"
  fr: "@aNera@bJe crois que c'est la première fois qu'il nous fait\nun complimentⓠ\n@c0@"
  it: "@aNera@bDevo avere un problema d'udito.\nM'è parso che Geremia ci abbia detto una cosa gentile, ma è evidente che devo aver sentito male...\n@c0@"
  ja: "@a@bフローラ「デスじいさんに\n\tほめていただいたのって\n\t初めてじゃないかしら……？\n@c0@"
196:
  de: "@a%0%a001240@bHurrah! Klar sieht es hier jetzt toll aus. Mein Vater kann so was eben, darum!\n@c0@"
  en: "@a%0%a001240@bYay! Of course the place looks cool.\nMy dad did it, that's why!\n@c0@"
  es: "@a%0%a001240@b¡Sí! Pues claro que este sitio es genial.\nLo hizo mi padre, ese es el motivo.\n@c0@"
  fr: "@a%0%a001240@bYoupiⓠ Évidemment que cet endroit est super.\nC'est mon papa qui l'a fait, c'est pour çaⓠ\n@c0@"
  it: "@a%0%a001240@bMi sembra quasi impossibile che siamo stati noi a mettere in piedi il Museo del Souvenir...\nE invece è proprio così! È tutto merito nostro!\n@c0@"
  ja: "@a@b%a001240「えっへん！\n\tボクの　お父さんだもん。\n\tすごいに決まってるよ！\n@c0@"
197:
  de: "@a%0%a001250@bHoffentlich werde ich mal wie du, Papa. Du gibst dir immer solche Mühe und gibst niemals auf.\n@c0@"
  en: "@a%0%a001250@bI hope I grow up like you, Dad. You always try so hard, and you never give up.\n@c0@"
  es: "@a%0%a001250@bEspero crecer y ser como tú, papi. Siempre lo das todo y nunca te rindes.\n@c0@"
  fr: "@a%0%a001250@bJ'espère que quand je serai grande, je serai comme toi, papa. Tu fais toujours tout ton possible et tu n'abandonnes jamais.\n@c0@"
  it: "@a%0%a001250@bPapà, spero che da grande sarò come te: forte, coraggiosa e determinata!\n@c0@"
  ja: "@a@b%a001250「わたしも\n\tお父さんに　負けないくらい\n\tがんばり屋さんになります。\n@c0@"
198:
  de: "@aSancho@bDu hast es dir nie leisst gemacht, Chico. Nisst mal, als du noch klein warst.\n@c0@"
  en: "@aSancho@bYou have always been the hard worker, friend. Even from when you are esmall.\n@c0@"
  es: "@aSancho@bPues siempre fuiste retetrabajador, chamaquito. Incluso cuando eras chico.\n@c0@"
  fr: "@aSancho@bTu as toujours t-t-travaillé dur, chico. Même quand tu étais oun petit garçon.\n@c0@"
  it: "@aSancho@bChico, sapevo que ce l'avresti fatta...\n¡Hai trasformato el Museo del Souvenir en una attrazione de livello mundial! ¡Es maravilloso!\n@c0@"
  ja: "@a@bサンチョ「%a000090王は　小さな時から\n\t努力を　おこたらない方でしたね。\n@c0@"
199:
  de: "@aOtto@bSicher galt das Kompliment zum Teil auch mir, weil ich mich so ang'strengt habe. Da werd' ich ja ganz verlegen.\n@c0@"
  en: "@aTuppence@bI'm sure part of his compliment there was directed at me for my efforts too. How embarrassing!\n@c0@"
  es: "@aAlazar@bEstoy seguro de que parte del cumplido iba para mí por todos mis esfuerzos. ¡Qué vergüenza!\n@c0@"
  fr: "@aInnocent@bJe suis certain qu'une partie de ce compliment m'était directement adressée en remerciement de mes efforts. J'en suis tout gênéⓠ\n@c0@"
  it: "@aSimon@bNon vorrei sembrare presuntuoso, ma credo che Geremia abbia apprezzato in particolare il lavoro che il sottoscritto ha svolto con perizia e dedizione.\n@c0@"
  ja: "@a@bピピン「なんだか　ボクまで\n\tほめられてる　気になってきました。\n\tてれちゃうな……。\n@c0@"
200:
  de: "@aBianca@bDie ist ja ganz schön engagiert, was? Ich glaube, ihr können wir den Empfang unbesorgt überlassen.\n@c0@"
  en: "@aBianca@bShe's pretty keen, eh? I dun't think we'll have any problems leavin' the reception to her.\n@c0@"
  es: "@aBianca@bSe lo toma muy en serio, ¿verdad? No, creo que no tendremos problemas con ella en la recepción.\n@c0@"
  fr: "@aBianca@bElle est vraiment gentille, nonⓡ Je crois que nous n'aurons aucun problème en lui confiant l'accueil\ndes visiteurs.\n@c0@"
  it: "@aBianca@bQuella ragazza è in gamba.\nSono certa che farà bene il suo lavoro.\n@c0@"
  ja: "@a@bビアンカ「すごく　やる気が感じられるわ。\n\tあの子に　まかせておけば\n\t受付は　問題ないでしょうね。\n@c0@"
201:
  de: "@aNera@bDer alte Franz hat gut daran getan, sie einzustellen. Sie ist ja mit Hingabe dabei.\n@c0@"
  en: "@aNera@bOld Man Nick Knack did well employing her.\r\nShe's certainly dedicated to the job.\n@c0@"
  es: "@aNera@bEl abuelo Nino hizo bene al contratarla.\r\nVeramente, está entregada a su trabajo.\n@c0@"
  fr: "@aNera@bLe vieux Bricabrac a bien fait de l'embaucher.\r\nElle est vraiment très impliquée dans ce qu'elle fait.\n@c0@"
  it: "@aNera@bIl vecchio Geremia ha scelto un'ottima addetta alla reception. Non solo è carina e intelligente, ma ha anche molta passione per il suo lavoro.\n@c0@"
  ja: "@a@bフローラ「おじいさんの　えらんだ方に\n\tまちがいは　ないようですわね。\n\tしっかりした　娘さんですわ。\n@c0@"
202:
  de: "@a%0%a001240@bSie ist wirklich mit Hingabe dabei, nicht? Wir sollten darauf achten, dass wir nicht von ihr ausgestochen werden.\n@c0@"
  en: "@a%0%a001240@bShe's really getting into it, isn't she? We'd better make sure we pull our weight too.\n@c0@"
  es: "@a%0%a001240@bSe lo está tomando en serio, ¿verdad? Será mejor que nosotros también cumplamos con nuestra parte.\n@c0@"
  fr: "@a%0%a001240@bElle se donne vraiment à fond, heinⓡ\nOn a intérêt à être à la hauteur, nous aussi.\n@c0@"
  it: "@a%0%a001240@bCerto che Sue Venir si sta dando da fare...\n@c0@"
  ja: "@a@b%a001240「はりきってるね　あのお姉さん。\n\tボクたちも　がんばらなきゃ！\n@c0@"
203:
  de: "@a%0%a001250@bDie Atmosphäre im Museum ist viel fröhlicher geworden, seit Kati Krams hier arbeitet.\n@c0@"
  en: "@a%0%a001250@bThe museum suddenly feels a lot brighter now that Sue Veneer's working here.\n@c0@"
  es: "@a%0%a001250@bEl museo parece resplandecer desde que Nuray Niada trabaja aquí.\n@c0@"
  fr: "@a%0%a001250@bLe musée semble d'un seul coup bien plus attrayant, maintenant que Marie-Jo Konde y travaille.\n@c0@"
  it: "@a%0%a001250@bNon c'è che dire: Sue Venir ha portato una ventata di freschezza e di gioventù nel Museo del Souvenir...\n@c0@"
  ja: "@a@b%a001250「お姉さんのおかげで\n\t博物館が　少し明るくなったような\n\t気がします。\n@c0@"
204:
  de: "@aSancho@bDiese Señorita, sie ist noch so jung, aber sie ist ein gutes Mädssen.\n@c0@"
  en: "@aSancho@bThees señorita, eshe ees young, but eshe ees esuch a good woman.\n@c0@"
  es: "@aSancho@bPues la señorita es bien joven, pero es una buena persona.\n@c0@"
  fr: "@aSancho@bCette s-s-señorita est jeune, mais c'est oune\r\nbonne fille.\n@c0@"
  it: "@aSancho@bQuella señorita es muy giovane, ma ha todas...\nEhm, todas las qualità por emergere nel lavoro.\n¡Caramba, que qualità que tiene la señorita!\n@c0@"
  ja: "@a@bサンチョ「ほう　まだお若いのに\n\t感心ですなあ。\n@c0@"
205:
  de: "@aOtto@bEs ist schön zu sehen, dass jemand so voller Leidenschaft von etwas spricht. Sie glüht ja förmlich vor Begeisterung!\n@c0@"
  en: "@aTuppence@bIt's lovely to see someone so passionate about something. She's practically aglow with excitement!\n@c0@"
  es: "@aAlazar@bMe encanta ver a alguien a quien le gusta tanto su trabajo. ¡Casi resplandece de alegría!\n@c0@"
  fr: "@aInnocent@bC'est charmant de voir une personne aussi passionnée. Elle s'illumine littéralement tant\nelle est enthousiasteⓠ\n@c0@"
  it: "@aSimon@bChissà se la ragazza alla reception nutre per le guardie di palazzo la stessa passione che sembra avere per il suo lavoro...\n@c0@"
  ja: "@a@bピピン「一生けんめいな人って\n\tステキですよね。\n\tとても　かがやいて見えます。\n@c0@"
206:
  de: "@aBianca@bWir sollten uns wohl lieber seine Notizen ansehen, wenn wir das nächste Mal etwas ausstellen wollen.\n@c0@"
  en: "@aBianca@bI s'pose we'd better have a look at that note next time we're thinkin' of exhibitin' somethin'.\n@c0@"
  es: "@aBianca@bSerá mejor que echemos un vistazo a esas notas la próxima vez que queramos exhibir algo, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe crois qu'on ferait bien de jeter un coup d'œil à cette note la prochaine fois qu'on voudra exposer quelque chose.\n@c0@"
  it: "@aBianca@bDegli appunti?\nCosa ci sarà scritto?\n@c0@"
  ja: "@a@bビアンカ「今度から　展示する時は\n\tあのメモを　見せてもらえばいいのね。\n@c0@"
207:
  de: "@aNera@bKati macht einen sehr eifrigen Eindruck. Gut, dass der alte Firle Franz jetzt jemanden hat, dem er seine Ideen anvertrauen kann.\n@c0@"
  en: "@aNera@bSue seems like a very studious type. It's good for Old Man Nick Knack to have someone to pass his\r\nideas on to.\n@c0@"
  es: "@aNera@bNuray parece ser molto aplicada. Es buono que el nono Nino tenga alguien a quien comunicar sus ideas.\n@c0@"
  fr: "@aNera@bMarie-Jo semble très appliquée. C'est bien pour\r\nle vieux Bricabrac d'avoir quelqu'un à qui faire passer ses idées.\n@c0@"
  it: "@aNera@bAnche Sue è una vera appassionata di souvenir.\r\nSembra che lei e Geremia siano proprio sulla stessa lunghezza d'onda.\n@c0@"
  ja: "@a@bフローラ「ミミさんは　勉強熱心だから\n\tデスじいさんも\n\t教えがいがあるんでしょうね。\n@c0@"
208:
  de: "@a%0%a001240@bHat die ein Glück! Hätten wir die Notizen gehabt, wäre es viel leichter gewesen, die Platzierung der Ausstellungsstücke zu planen.\n@c0@"
  en: "@a%0%a001240@bShe's so lucky! If only we had that note, it would be much easier to know how to plan the exhibits.\n@c0@"
  es: "@a%0%a001240@b¡Qué suerte tiene! Si tuviera esas notas, me resultaría mucho más fácil saber cómo colocar la exhibición.\n@c0@"
  fr: "@a%0%a001240@bQuelle chance elle aⓠ Si seulement on avait cette note, ça serait bien plus facile de savoir comment organiser les expositions.\n@c0@"
  it: "@a%0%a001240@bScommetto che quegli appunti contengono informazioni su come esporre gli oggetti nel Museo...\n@c0@"
  ja: "@a@b%a001240「いいなあ～　お姉さん。\n\tボクたちに　そのメモがあったら\n\tもっと　らくに　ならべられるのにね！\n@c0@"
209:
  de: "@a%0%a001250@bWer wohl entscheidet, was die einzelnen Stücke wert sind? Glaubst du, es ist der alte Firle Franz?\n@c0@"
  en: "@a%0%a001250@bI wonder who decides what the different articles are worth. Do you think it's Old Man Nick Knack?\n@c0@"
  es: "@a%0%a001250@bMe pregunto quién decidirá el valor de los artículos. ¿Crees que será cosa del abuelo Nino?\n@c0@"
  fr: "@a%0%a001250@bJe me demande qui décide de la valeur des différentes pièces. Tu crois que c'est le vieux Bricabrac lui-mêmeⓡ\n@c0@"
  it: "@a%0%a001250@bChi è che stabilisce il valore dei souvenir che portiamo al Museo? Lo fa Geremia in persona oppure ci pensa qualcun altro?\n@c0@"
  ja: "@a@b%a001250「名産の価値って\n\t誰が　決めたの？\n\tやっぱり　あの　おじいさん？\n@c0@"
210:
  de: "@aSancho@bIss hatte das vorher nie bemerkt. Je größer der Wert des Ausstellungsstücks, desto weiter oben im Gebäude sollten wir es ausstellen, sí?\n@c0@"
  en: "@aSancho@bI no realise thees before. The more ees the value of the exhibit, the more higher the floor we eshould put eet on display, sí?\n@c0@"
  es: "@aSancho@bNo me había dado cuenta antes. Cuanto más cara sea una cosina, más alto la tenemos que poner...\n@c0@"
  fr: "@aSancho@bJe n'avais pas c-c-compris ça avant. Plus oun objet a de la v-valeur, plus il doit être exposé dans oun étage élevé, siⓡ\n@c0@"
  it: "@aSancho@bNo avevo capito que los oggettos de mayor pregio devono essere espostos a los pianos más altos...\n@c0@"
  ja: "@a@bサンチョ「なるほど　上の部屋に行くほど\n\t価値の高い　名産品を\n\t展示してゆくということですか。\n@c0@"
211:
  de: "@aOtto@bDas wertvollere Stück bekommt also eine höhere Einstufung. Richtig?\n@c0@"
  en: "@aTuppence@bSo the more valuable items get a higher rating. Correct?\n@c0@"
  es: "@aAlazar@bAsí que los objetos más valiosos reciben una mejor puntuación, ¿no?\n@c0@"
  fr: "@aInnocent@bAlors plus les objets sont précieux, plus leur évaluation est haute, c'est çaⓡ\n@c0@"
  it: "@aSimon@bSe non ho capito male, gli oggetti più pregiati hanno una valutazione più alta.\nBeh, mi pare logico...\n@c0@"
  ja: "@a@bピピン「貴重な　名産品ほど\n\t格付けも高くなるわけですね。\n@c0@"
212:
  de: "@aBianca@bWeitere Stücke? Es klingt, als sei der alte Firle Franz schwer bei der Arbeit, um neue Stücke für uns zu finden, nicht?\n@c0@"
  en: "@aBianca@bNew articles? Sounds like Old Man Nick Knack's hard at work findin' out stuff for us, eh?\n@c0@"
  es: "@aBianca@b¿Piezas nuevas? Parece que el abuelo Nino se está esforzando en investigar por nosotros, ¿sabes?\n@c0@"
  fr: "@aBianca@bDe nouvelles piècesⓡ On dirait que le vieux Bricabrac se donne du mal pour nous dénicher\ndes objets.\n@c0@"
  it: "@aBianca@bNuovi souvenir?\nChissà quant'è lunga la ⓕlista della spesaⓖ del caro Geremia...\n@c0@"
  ja: "@a@bビアンカ「新しい名産品だって。\n\tおじいさんも　いろいろ\n\t調べてくれているのね。\n@c0@"
213:
  de: "@aNera@bOoh. Was das wohl für neue Stücke sind?\n@c0@"
  en: "@aNera@bOoh. I wonder what these new articles might be.\n@c0@"
  es: "@aNera@bVaya. Me pregunto qué serán esas nuovi piezas.\n@c0@"
  fr: "@aNera@bOoh, je me demande bien quelles peuvent être\r\nces nouvelles pièces.\n@c0@"
  it: "@aNera@bOh, come sono curiosa!\nCosa saranno mai questi nuovi souvenir, eh?\n@c0@"
  ja: "@a@bフローラ「新しい　名産品とは\n\tどんなものなのでしょう？\n@c0@"
214:
  de: "@a%0%a001240@bOh! Das wird bestimmt lustig, auf die Jagd nach neuen Stücken zu gehen. Ich hoffe, wir finden bald welche!\n@c0@"
  en: "@a%0%a001240@bOoh! It'll be fun going off hunting for new items.\nI hope we find them soon!\n@c0@"
  es: "@a%0%a001240@b¡Oooh! Va a ser diver ir en busca de nuevas piezas.\n¡Espero que demos con ellas rápido!\n@c0@"
  fr: "@a%0%a001240@bOhⓠ Ce serait rigolo de partir chasser de nouveaux trésors. J'espère qu'on les découvrira viteⓠ\n@c0@"
  it: "@a%0%a001240@bChe bello!\nAndremo a caccia di tanti oggetti nuovi!\nNon vedo l'ora di partire!\n@c0@"
  ja: "@a@b%a001240「まだ持ってない物って\n\t集めたくなるよね。\n\t早く　見つけたいな！\n@c0@"
215:
  de: "@a%0%a001250@bWir sollten auf jeden Fall versuchen, sie zu finden. Der alte Firle Franz hat sich so sehr bemüht, für uns alles darüber herauszufinden.\n@c0@"
  en: "@a%0%a001250@bWe should definitely try and find them if we can.\nOld Man Nick Knack went to all that effort to find out about them for us, after all.\n@c0@"
  es: "@a%0%a001250@bPues está claro que tendremos que ir a buscarlas si podemos.\n㈡\nAl fin y al cabo, el abuelo Nino se ha tomado muchas molestias para encontrarlas.\n@c0@"
  fr: "@a%0%a001250@bOn devrait vraiment essayer de les découvrir.\nAprès tout, le vieux Bricabrac s'est donné beaucoup de mal pour trouver ces informations pour nous.\n@c0@"
  it: "@a%0%a001250@bSono sicura che Geremia impazzirebbe dalla gioia se trovassimo tutti gli oggetti che ha inserito nell'elenco.\n@c0@"
  ja: "@a@b%a001250「せっかく　おじいさんが\n\t調べてくれたんだもの。\n\tさがしに行くよね？　お父さん。\n@c0@"
216:
  de: "@aSancho@bEs gibt also noch mehr Andenken, die wir noch nisst gefunden haben. Iss hoffe, wir finden sie bald.\n@c0@"
  en: "@aSancho@bEso there are more esouvenirs we no find yet. I hope we find them esoon.\n@c0@"
  es: "@aSancho@bEntonces, ¿hay muchas cosinas que no encontramos? Espero dar con ellas pronto.\n@c0@"
  fr: "@aSancho@bAlors il y a d'autres s-s-souvenirs qu'on n'a p-pas encore trouvés. J'espère qu'on les découvrira vite.\n@c0@"
  it: "@aSancho@bUhm...\n¡Esperiamo que la ricerca de los nuevos souvenir no ce faccia perdere troppos tiempo!\n@c0@"
  ja: "@a@bサンチョ「まだ見ぬ　名産品が\n\tどこかにあるんですね。\n\t私も　見てみたいものです。\n@c0@"
217:
  de: "@aOtto@bWeitere Stücke? Wie viele von diesen Souvenirs sind denn nun in der Weltg'schichte verteilt?\n@c0@"
  en: "@aTuppence@bMore articles? Just how many of these souvenirs are there dotted about the world?\n@c0@"
  es: "@aAlazar@b¿Más piezas? ¿Pero cuántas cosinas de esas hay desperdigadas por el mundo?\n@c0@"
  fr: "@aInnocent@bD'autres piècesⓡ Mais combien d'objets peuvent bien être dispersés à travers le mondeⓡ\n@c0@"
  it: "@aSimon@bAncora?!\r\nMa quanti souvenir ci sono in giro per il mondo, eh?!\n@c0@"
  ja: "@a@bピピン「新しい物が　まだあるなんて\n\tいったい　名産品は\n\tどのくらいあるんでしょう？\n@c0@"
218:
  de: "@aBianca@bHuch! Das haben wir doch nicht gewollt, nicht? Was haben wir denn falsch gemacht?\n@c0@"
  en: "@aBianca@bThat weren't our intention, eh? I wonder what it is we've done wrong.\n@c0@"
  es: "@aBianca@bNo tenemos nada contra él, ¿verdad?\r\nMe pregunto qué habremos hecho mal.\n@c0@"
  fr: "@aBianca@bCe n'est pourtant pas ce que nous voulions.\r\nJe me demande ce que nous avons fait de travers.\n@c0@"
  it: "@aBianca@bMa questo Geremia per caso soffre di manie di persecuzione?!\n@c0@"
  ja: "@a@bビアンカ「そんな　つもりじゃ\n\tないんだけど……。\n\t悪いことしちゃったかな？\n@c0@"
219:
  de: "@aNera@bNun, dieses Gefühl wollten wir ihm nicht vermitteln. Jetzt hat er offenbar Schwierigkeiten, uns noch zu vertrauen.\n@c0@"
  en: "@aNera@bWell, we didn't mean for him to feel that way. It looks like he's finding it rather hard to trust us now.\n@c0@"
  es: "@aNera@bMa, nosotros no queríamos que se sintiese così. Sembra que ahora le cuesta confiar en nosotros.\n@c0@"
  fr: "@aNera@bNous ne voulions pas qu'il ait cette impression.\r\nOn dirait qu'il a du mal à nous faire confiance, désormais.\n@c0@"
  it: "@aNera@bSanti numi! Non era certo nostra intenzione urtare la sua suscettibilità! Credo che dovremmo dimostrargli che ha fatto bene a fidarsi di noi...\n@c0@"
  ja: "@a@bフローラ「けっして　いやがらせ\n\tしているわけでは　ないのですが……。\n\t誤解を　うんでしまったようですね。\n@c0@"
220:
  de: "@a%0%a001240@bHoppla. Er klingt gar nicht glücklich. Wir sollten etwas ausstellen. Egal, was es ist. Das ist wahrscheinlich besser, als nichts zu haben.\n@c0@"
  en: "@a%0%a001240@bOops. He doesn't sound happy. We should put something on display. One thing would probably\nbe better than nothing.\n@c0@"
  es: "@a%0%a001240@bVaya. No parece muy contento. Deberíamos exhibir algo. Aunque sea una cosina... Mejor que nada.\n@c0@"
  fr: "@a%0%a001240@bOups. Il n'a pas l'air content. On devrait mettre quelque chose en exposition. Même un seul objet...\nce serait mieux que rien du tout.\n@c0@"
  it: "@a%0%a001240@bQuel signore anziano ha scritto che lo abbiamo deluso, non è vero? Forse se mettiamo in esposizione un oggetto sarà contento. Uno è meglio di niente, no?\n@c0@"
  ja: "@a@b%a001240「なんか　かわいそうだよ。\n\t１つくらい　展示した方が\n\tいいんじゃない？\n@c0@"
221:
  de: "@a%0%a001250@bDu hast sicher deine Gründe dafür, Papa. Er versteht sie nur nicht, das ist alles.\n@c0@"
  en: "@a%0%a001250@bI'm sure you must have your reasons, Dad.\nHe just can't understand them, that's all.\n@c0@"
  es: "@a%0%a001250@bSeguro que hay un motivo.\nLo que pasa es que él no lo entiende.\n@c0@"
  fr: "@a%0%a001250@bJe suis sûre que tu as tes raisons, papa.\nC'est juste qu'il n'arrive pas à les comprendre.\n@c0@"
  it: "@a%0%a001250@bSembra che tra noi e Geremia ci sia qualche incomprensione.\nSpero che col tempo ci capiremo meglio...\n@c0@"
  ja: "@a@b%a001250「お父さんが　することだもの。\n\tきっと意味があるんだよね？\n@c0@"
222:
  de: "@aSancho@bEs tut dem alten Señor wirkliss weh zu sehen, dass all diese Dinge im Lager sind, nisst wahr?\n@c0@"
  en: "@aSancho@bEes really hurting thees old señor to esee all these theengs een the storeroom, eh?\n@c0@"
  es: "@aSancho@bPues tener toditas las cosas en el almacén le está haciendo daño al abuelo...\n@c0@"
  fr: "@aSancho@bÇa a l'air de le b-b-blesser vraiment, ce vieux señor, de voir t-t-toutes ces choses dans la réserve, heinⓡ\n@c0@"
  it: "@aSancho@bForse dovremmo mettere en esposiziones qualcunos de los oggettos que estanno nel deposito, chico...\n¿Que ne pensi?\n@c0@"
  ja: "@a@bサンチョ「やはり　物置に\n\tすべて置かれるのは　おじいさんも\n\tつらいのでは？\n@c0@"
223:
  de: "@aOtto@bNun, ich will mich ja nicht einmischen, net wahr. Aber...\n@c0@"
  en: "@aTuppence@bIt's really not my place to question your reasoning. Nonetheless...\n@c0@"
  es: "@aAlazar@bNo me corresponde poner en duda vuestra lógica. Pero...\n@c0@"
  fr: "@aInnocent@bCe n'est certes pas mon rôle de remettre en question votre manière de faire, toutefois...\n@c0@"
  it: "@aSimon@bUhm, credo che il vecchio rompiscatole non abbia tutti i torti...\n@c0@"
  ja: "@a@bピピン「ボクは　%a000090王の\n\tなさることに　口出しするつもりは\n\tありませんが……。\n@c0@"
224:
  de: "@aBianca@bEr macht sich große Hoffnungen, nicht? Wir müssen diese Sache einfach zum Laufen bringen!\n@c0@"
  en: "@aBianca@bHe's certainly got high hopes, eh? We'll have to make sure we make a go of this place.\n@c0@"
  es: "@aBianca@bTiene muchas esperanzas puestas en nosotros, ¿verdad? Tenemos que conseguir que este sitio salga adelante.\n@c0@"
  fr: "@aBianca@bIl a de grands rêves, heinⓡ Il faut vraiment qu'on fasse quelque chose de cet endroit.\n@c0@"
  it: "@aBianca@bGeremia ci tiene davvero al suo Museo.\nCerchiamo di aiutarlo, se possiamo...\n@c0@"
  ja: "@a@bビアンカ「期待されてるね。　がんばって\n\tいい博物館にしてあげようね。\n@c0@"
225:
  de: "@aNera@bEr hofft offenbar, dass wir seine Träume wahr machen. Nun, wir werden es versuchen, nicht wahr?\n@c0@"
  en: "@aNera@bIt sounds like he's hoping we'll fulfil his dream for him. Well, we'll try our best, won't we?\n@c0@"
  es: "@aNera@bSembra que espera que cumplamos il suo sogno por él. Va bene, haremos lo que podamos, ¿verdad?\n@c0@"
  fr: "@aNera@bOn dirait qu'il espère que nous réaliserons son rêve pour lui. Eh bien, nous ferons de notre mieux,\nn'est-ce pasⓡ\n@c0@"
  it: "@aNera@bQuell'anziano signore ha bisogno del nostro aiuto per realizzare il suo sogno. Per quanto mi riguarda, sono disposta a dargli una mano.\n@c0@"
  ja: "@a@bフローラ「私たちが　おじいさんの\n\t夢を引きつぐことに　なるんですね。\n\tがんばりましょう！\n@c0@"
226:
  de: "@a%0%a001240@bIch freue mich wirklich auch schon darauf zu sehen, was du aus diesem Museum machst!\n@c0@"
  en: "@a%0%a001240@bI'm really looking forward to seeing what you'll do with the place too!\n@c0@"
  es: "@a%0%a001240@bYo también estoy deseando ver qué harás con este sitio.\n@c0@"
  fr: "@a%0%a001240@bMoi aussi j'ai hâte de voir ce que tu feras de\ncet endroit.\n@c0@"
  it: "@a%0%a001240@bQuindi io sono il figlio del direttore di un museo?\nChe bello!\nMa il direttore di un museo è più importante di un re?\n@c0@"
  ja: "@a@b%a001240「ボクも　お父さんが\n\tどんな博物館にするのか\n\tすごく　楽しみだよ！\n@c0@"
227:
  de: "@a%0%a001250@bHe he! Dann bist du jetzt nicht nur ein König, sondern auch noch ein Museumskurator!\n@c0@"
  en: "@a%0%a001250@bHe he! So now you're a museum curator as well as\na king!\n@c0@"
  es: "@a%0%a001250@b¡Ji, ji! Así que ahora además de rey eres gestor de museo.\n@c0@"
  fr: "@a%0%a001250@bHé héⓠ Alors maintenant, tu es conservateur de musée en plus d'être roiⓠ\n@c0@"
  it: "@a%0%a001250@bE così, oltre che Re di Denim, ora sei anche il direttore del Museo del Souvenir! Papà, ti ci vorrà un biglietto da visita molto grande! Eh eh eh!\n@c0@"
  ja: "@a@b%a001250「お父さんは　王さまでもあって\n\t館長でもあるのよね。　すごいな！\n@c0@"
228:
  de: "@aSancho@bDiese Maximedaille, sie ist komisch, nisst wahr? Mösstest du nisst mehr darüber erfahren?\n@c0@"
  en: "@aSancho@bThees maxi medal, ees estrange, sí?\nYou no want to know more about eet?\n@c0@"
  es: "@aSancho@bEso de la maximedalla es reteraro.\r\n¿Qué pasó?\n@c0@"
  fr: "@aSancho@bCette maxi médaille, elle est b-b-bizarre, noⓡ\nTu ne veux pas en s-savoir plus sur elleⓡ\n@c0@"
  it: "@aSancho@b¿Esta es una buena noticia, no?\n@c0@"
  ja: "@a@bサンチョ「大きなメダルですか。\n\t私も　何か気になるんですよ。\n@c0@"
229:
  de: "@aOtto@bIhr seid der Chef! Natürlich werd' ich Euch bei allem unterstützen.\n@c0@"
  en: "@aTuppence@bYou're the boss! Naturally, I'll support you in all of your endeavours.\n@c0@"
  es: "@aAlazar@b¡Vos mandáis! Yo os apoyo en todo lo que hagáis, por supuesto.\n@c0@"
  fr: "@aInnocent@bC'est vous le chefⓠ Évidemment, je vous soutiendrai dans toutes vos entreprises.\n@c0@"
  it: "@aSimon@bAltezza, preferisce che la chiami ⓕMaestàⓖ oppure ⓕsignor direttoreⓖ?\nEh eh eh! Ehm... Era solo una battuta...\n@c0@"
  ja: "@a@bピピン「%a000090王が\n\t館長を　なさるんです。\n\t成功するに　決まってますよ。\n@c0@"
230:
  de: "@aBianca@bIch bin sicher, du tust das nicht, um ihn aufzuregen... oder?\n@c0@"
  en: "@aBianca@bI'm sure you en't doin' this to try and wind him up...are you?\n@c0@"
  es: "@aBianca@bEstoy seguro de que haces esto para enfadarlo, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe suis sûre que tu ne fais pas ça exprès pour l'énerver... heinⓡ\n@c0@"
  it: "@aBianca@bNon credo che tu l'abbia fatto di proposito, né per prendere in giro quel povero vecchietto...\n@c0@"
  ja: "@a@bビアンカ「%a000090が　イジワルしてるとは\n\t思わないけど……\n@c0@"
231:
  de: "@aBianca@bAllerdings ist es tatsächlich nicht besonders interessant, im ganzen Museum immer nur das Gleiche zu sehen.\n@c0@"
  en: "@aBianca@bStill, it's not much of a museum if it just has the same old thing on display all the way through.\n@c0@"
  es: "@aBianca@bPero aún así no es que sea un museo muy interesante si solo exhibe lo mismo en todos lados.\n@c0@"
  fr: "@aBianca@bN'empêche, c'est vrai que ça ne ressemble pas\r\nà un musée si on ne voit toujours qu'un seul et\r\nmême objet en exposition.\n@c0@"
  it: "@aBianca@bPerò Geremia ha ragione: nessun museo degno di questo nome si sognerebbe di riempire le sue sale con lo stesso oggetto!\n@c0@"
  ja: "@a@bビアンカ「でも　同じものばっかりの\n\t博物館もちょっとね……。\n@c0@"
232:
  de: "@aNera@bWir sollten vermutlich versuchen, ein paar unterschiedlichere Dinge auszustellen. So läuft es jedenfalls normalerweise in Museen.\n@c0@"
  en: "@aNera@bWe should probably try to exhibit a wider variety of things, I suppose. That's how museums usually work.\n@c0@"
  es: "@aNera@bSupongo que, veramente, deberíamos exhibir más cosas. Normalmente es lo que se hace en los museos.\n@c0@"
  fr: "@aNera@bNous devrions sans doute essayer d'exposer une plus grande diversité d'objets. C'est comme ça que fonctionnent les musées, en général.\n@c0@"
  it: "@aNera@bDi solito nei musei sono esposti oggetti di vario tipo.\nPenso che anche noi dovremmo fare la stessa cosa, non trovi?\n@c0@"
  ja: "@a@bフローラ「せっかくの　博物館なのですから\n\tいろいろな　名産品を展示してみても\n\tいいかもしれませんわ。\n@c0@"
233:
  de: "@a%0%a001240@bMir gefällt es eigentlich so, wie es ist, aber ich schätze, wir müssen auch an die Besucher denken.\n@c0@"
  en: "@a%0%a001240@bI quite like how it is now, but I suppose we have to think about our visitors too.\n@c0@"
  es: "@a%0%a001240@bA mí me gusta bastante como está, pero supongo que también tenemos que pensar en los visitantes.\n@c0@"
  fr: "@a%0%a001240@bMoi, je l'aime bien comme il est, ce musée,\nmais je suppose qu'on doit aussi penser\naux gens qui viennent le visiter.\n@c0@"
  it: "@a%0%a001240@bA me il Museo piace così com'è adesso, ma non sono sicuro che i visitatori apprezzino un'esposizione tanto monotona...\n@c0@"
  ja: "@a@b%a001240「ボクは　けっこう好きなんだけど\n\tお客さんのこと考えると　変えた方が\n\tいいかもしれないよ。\n@c0@"
234:
  de: "@a%0%a001250@bIm Moment sieht es eher aus wie ein Laden als wie ein Museum.\n@c0@"
  en: "@a%0%a001250@bIt looks more like a shop than a museum\nat the moment.\n@c0@"
  es: "@a%0%a001250@bAhora mismo parece más una tienda que un museo.\n@c0@"
  fr: "@a%0%a001250@bPour l'instant, ça ressemble plus à un magasin\nqu'à un musée.\n@c0@"
  it: "@a%0%a001250@bEhm, senza offesa per nessuno, ma...\nNello stato in cui si trova ora, questo posto è di una noia mortale!\n@c0@"
  ja: "@a@b%a001250「今は　博物館というより\n\tお店屋さんっぽいよね。\n@c0@"
235:
  de: "@aSancho@bVielleisst ist es besser, ein paar Dinge zu ändern, um den alten Señor glückliss zu machen, no?\n@c0@"
  en: "@aSancho@bMaybe ees better eef we change esome theengs to make thees old señor happy, no?\n@c0@"
  es: "@aSancho@bPues igual pues es mejor si, nomás, cambiamos algunas cosinas para que el abuelo esté contento...\n@c0@"
  fr: "@aSancho@bPeut-être que ce serait b-bien de changer\noune ou deux choses pour faire plaisir\nà ce v-vieux señor, noⓡ\n@c0@"
  it: "@aSancho@b¿Y si provassimo a cambiare qualcosas por cercare de accontentare el señor Geremia?\nProviamoce, chico.\n@c0@"
  ja: "@a@bサンチョ「おじいさんの　気持ちも\n\t考えてあげてみても　よろしいかと\n\t思いますが　いかがでしょう？\n@c0@"
236:
  de: "@aOtto@bWenn Euch das Museum so anspricht, dann solltet Ihr alles so lass'n, wie es ist. Es gibt nun mal keine festen Regeln für Museen.\n@c0@"
  en: "@aTuppence@bIf this is what suits your fancy, then you should keep it as it is. There's no hard and fast rule when\r\nit comes to museums.\n@c0@"
  es: "@aAlazar@bSi es así como os gusta, entonces deberíais dejarlo así. Cuando se trata de museos no hay ninguna regla preestablecida.\n@c0@"
  fr: "@aInnocent@bSi cela vous convient, gardez les choses telles qu'elles sont. Il n'y a pas de règles absolues en matière de musées.\n@c0@"
  it: "@aSimon@bEsistono i musei dell'arte, quelli delle scienze, quelli archeologici... Questo potrebbe essere il ⓕMuseo dell'oggetto ripetuto all'infinitoⓖ.\n@c0@"
  ja: "@a@bピピン「%a000090王がよろしければ\n\t今のままでも　いいと思いますよ。\n\t博物館といっても　いろいろですから。\n@c0@"
237:
  de: "@aBianca@bMan muss ihn einfach lieb haben, auch wenn er ein alter Grantler ist.\n@c0@"
  en: "@aBianca@bYou can't help but find him endearin', even though he is a grumpy old soul.\n@c0@"
  es: "@aBianca@bAunque es un gruñón, es un gruñón entrañable, ¿sabes?\n@c0@"
  fr: "@aBianca@bMême si ce n'est qu'un vieux grincheux, il est impossible de ne pas le trouver attachant.\n@c0@"
  it: "@aBianca@bDevo ammettere che Geremia ha ragione. Così non va. Se restasse così com'è, al Museo del Souvenir verrebbero solo marinai o appassionati di bottiglie...\n@c0@"
  ja: "@a@bビアンカ「これだから　デスじいさんって\n\tなんだか　にくめないのよね。\n\tかわいいっていうか……。\n@c0@"
238:
  de: "@aNera@bDer alte Mann war vermutlich noch nie in einer solchen Situation.\n@c0@"
  en: "@aNera@bThe old man probably never had to deal with this kind of thing before.\n@c0@"
  es: "@aNera@bEl nono nunca antes se había visto en una situación parecida, porbabilemente.\n@c0@"
  fr: "@aNera@bCe vieil homme n'a sans doute jamais eu à gérer\r\nce genre de choses auparavant.\n@c0@"
  it: "@aNera@bNon penso che Geremia avesse in mente una collezione di questo genere per il suo Museo...\n@c0@"
  ja: "@a@bフローラ「デスじいさんって　きっと\n\t今まで　人を　にくんだりすることなく\n\t生きていらっしゃったんでしょうね。\n@c0@"
239:
  de: "@a%0%a001240@bDank der Göttin sind wir nun vorgewarnt! Ich wäre bestimmt zu Tode erschrocken, wenn er mir plötzlich entgegenspränge.\n@c0@"
  en: "@a%0%a001240@bThank the Goddess we've got a bit of advance warning! It could be quite scary having him jump\nout on you unannounced.\n@c0@"
  es: "@a%0%a001240@bGracias a la Diosa que esta vez ha avisado. Da bastante miedo cuando aparece así, de pronto.\n@c0@"
  fr: "@a%0%a001240@bOufⓠ Heureusement qu'on est prévenus, maintenantⓠ Ça pourrait faire drôlement peur s'il nous sautait dessus sans prévenir.\n@c0@"
  it: "@a%0%a001240@bSe continua così, temo che il Museo del Souvenir avrà presto un nuovo direttore...\n@c0@"
  ja: "@a@b%a001240「よかった～。\n\tおじいさんが　天罰のあたえ方\n\t知らなくて！\n@c0@"
240:
  de: "@a%0%a001250@bAuch wenn du jetzt die Museumsleitung hast, Papa, solltest du dir vielleicht trotzdem anhören, was der alte Firle Franz will.\n@c0@"
  en: "@a%0%a001250@bYou may be in charge of the museum now, Dad, but I think you still have to try and listen to what Old Man Nick Knack wants.\n@c0@"
  es: "@a%0%a001250@bPuede que estés a cargo del museo ahora, papi, pero creo que deberías escuchar lo que te dice el abuelo Nino.\n@c0@"
  fr: "@a%0%a001250@bC'est toi qui es en charge du musée, maintenant,\nmais je crois qu'il faut quand même que tu essaies\nde tenir compte de ce que veut le vieux Bricabrac.\n@c0@"
  it: "@a%0%a001250@bNon siamo esperti di musei né di raccolte di souvenir.\nForse faremmo meglio ad ascoltare i suggerimenti di Geremia...\n@c0@"
  ja: "@a@b%a001250「ここは　お父さんの博物館だけど\n\tおじいさんの言うこと\n\t聞いてあげないと　ダメなのね。\n@c0@"
241:
  de: "@aSancho@bWir tun das doch nisst, um den alten Señor unglückliss zu machen! Er braucht uns nisst zu erschrecken!\n@c0@"
  en: "@aSancho@bWe no do thees to make thees señor unhappy. Ees no need to escare us.\n@c0@"
  es: "@aSancho@bNo hacemos esto para enojar a este señor.\r\nNo es necesario que se ponga así con nosotros.\n@c0@"
  fr: "@aSancho@bOn ne f-f-fait pas ça pour rendre ce vieux señor malheureux. Pas la peine de nous faire oune peur bleue.\n@c0@"
  it: "@aSancho@bSì, el señor Geremia no ha todos los tortos.\nDovremmo cercare de diversificare los oggettos en esposiziones...\n@c0@"
  ja: "@a@bサンチョ「いやがらせのつもりでは\n\tなかったんですが…\n\t天罰とは　おだやかじゃないですね。\n@c0@"
242:
  de: "@aOtto@bIch hielt ihn immer für einen harmlosen alten Mann, aber nachdem ich nun sein Tagebuch g'sehen hab, bin ich mir net mehr so sicher!\n@c0@"
  en: "@aTuppence@bI thought he was just a harmless old man, but now I've seen his diary, I'm not so sure!\n@c0@"
  es: "@aAlazar@bCreía que era un abuelete inofensivo, pero después de leer su diario ya no estoy tan seguro.\n@c0@"
  fr: "@aInnocent@bMoi qui le prenais pour un vieil homme inoffensif... Après avoir vu ce journal, je n'en suis plus si sûrⓠ\n@c0@"
  it: "@aSimon@bPensavo che Geremia fosse un vecchietto bizzarro ma innocuo. Ora, però, non sono più sicuro che sia tanto innocuo! Meglio non farlo arrabbiare!\n@c0@"
  ja: "@a@bピピン「ため息ばかり　ついてる\n\tおじいさんかと思えば　日記には\n\tこんなに　カゲキなことを……！？\n@c0@"
243:
  de: "@aBianca@bDie erste Hürde hätten wir geschafft! Aber es liegt noch ein weiter Weg vor uns.\n@c0@"
  en: "@aBianca@bSo we've finally crossed the first hurdle.\r\nThere's still a long way to go, mind.\n@c0@"
  es: "@aBianca@bBueno, ya hemos superado el primer escollo.\r\nPero anda que no nos quedan cosas por hacer ni nada, ¿sabes?\n@c0@"
  fr: "@aBianca@bOn a enfin franchi le premier obstacle.\r\nMais il y a encore du chemin à faire.\n@c0@"
  it: "@aBianca@bEvviva! Sembra che ci stiamo muovendo nella direzione giusta! La meta è ancora lontana, ma pian piano ci arriveremo, ne sono certa!\n@c0@"
  ja: "@a@bビアンカ「ようやく\n\tはじめの一歩って　ところかな。\n\tまだまだ　先は長そうね。\n@c0@"
244:
  de: "@aNera@bAller Anfang ist schwer. Wir dürfen jetzt nur nicht den Mut verlieren.\n@c0@"
  en: "@aNera@bIt's always hard at the beginning. We mustn't let it make us lose heart.\n@c0@"
  es: "@aNera@bLos principios nunca son fáciles. Veramente, no debemos desanimarnos.\n@c0@"
  fr: "@aNera@bC'est toujours difficile, au début. Mais cela ne doit pas nous décourager.\n@c0@"
  it: "@aNera@bGli inizi sono sempre difficili, ma almeno adesso sappiamo di essere sulla strada giusta.\n@c0@"
  ja: "@a@bフローラ「どんなことでも\n\tはじめが　かんじんですわ。\n\t気をぬかず　がんばりましょうね。\n@c0@"
245:
  de: "@a%0%a001240@bDer alte Firle Franz wird sich freuen, wenn wir noch mehr Dinge für die Ausstellung finden.\n@c0@"
  en: "@a%0%a001240@bOld Man Nick Knack will be pleased when we get more things to put on display.\n@c0@"
  es: "@a%0%a001240@bEl abuelo Nino estaría encantado si consiguiéramos más cosinas que exhibir.\n@c0@"
  fr: "@a%0%a001240@bLe vieux Bricabrac sera content quand nous aurons récupéré plus d'objets à exposer.\n@c0@"
  it: "@a%0%a001240@bPiù souvenir porteremo, più il vecchio Geremia sarà contento.\n@c0@"
  ja: "@a@b%a001240「おじいさんも　展示されていく\n\t名産品がふえると　うれしいんだよ。\n@c0@"
246:
  de: "@a%0%a001250@bDer alte Firle Franz scheint sich mit seinem Tagebuch viel Mühe zu geben. Vielleicht sollte ich auch eins anfangen.\n@c0@"
  en: "@a%0%a001250@bOld Man Nick Knack must work very hard at writing his diary. Maybe I should start one too.\n@c0@"
  es: "@a%0%a001250@bEl abuelo Nino se debe de tomar en serio lo de escribir su diario. Igual, yo debería empezar a escribir uno.\n@c0@"
  fr: "@a%0%a001250@bÇa doit lui demander beaucoup de travail, au vieux Bricabrac, d'écrire son journal. Peut-être que je devrais en commencer un, moi aussi.\n@c0@"
  it: "@a%0%a001250@bNon sapevo che Geremia tenesse un diario.\nVista la sua età, avrà già scritto un'infinità di pagine! Eh eh eh!\n@c0@"
  ja: "@a@b%a001250「おじいさんは\n\tこまめに日記を　つけてるのね。\n\t私も　書いてみようかな……。\n@c0@"
247:
  de: "@aSancho@bSí. Es ist nisst gut, die Dinge zu überhasten. Wir werden immer schön einen Schritt nach dem anderen machen.\n@c0@"
  en: "@aSancho@bSí. Ees right no to go too fast, or maybe you\r\nput yourself een weeth the horses' feet, eh?\r\nEes a dangerous place, comprende?\n@c0@"
  es: "@aSancho@b¡Órale! Pues como se dice, ándale despacio que tengo prisa.\r\nLas prisas no son buenas, ¿sabes?\n@c0@"
  fr: "@aSancho@bSi, c'est vrai. Inutile de se p-p-précipiter.\nIl ne faut pas m-mettre la charrue avant\nles bœufs, c'est d-dangereux, comprendeⓡ\n@c0@"
  it: "@aSancho@bEl señor Geremia ha ragione. Como dice el proverbio, ⓕel museo non se fa en un diaⓖ. ¿No conosce esto proverbio, chico? ¡Es muy famoso nel mio país!\n@c0@"
  ja: "@a@bサンチョ「物事をいそぐと\n\tつまづいてしまう　場合もあります。\n\tあせりは禁物ということですね。\n@c0@"
248:
  de: "@aOtto@bIch bin sicher, Ihr werdet draus bald ein g'scheites Museum machen, %a000090.\n@c0@"
  en: "@aTuppence@bI'm sure you'll soon turn the place into a fine museum, %a000090.\n@c0@"
  es: "@aAlazar@bEstoy convencido de que haréis de este lugar un gran museo, %a000090.\n@c0@"
  fr: "@aInnocent@bJe suis convaincu que vous réussirez rapidement\nà transformer cet endroit en un beau musée, %a000090.\n@c0@"
  it: "@aSimon@bMaestà, non ho dubbi che saprà trasformare il Museo del Souvenir nel più interessante polo culturale che il mondo abbia mai visto! E io l'aiuterò!\n@c0@"
  ja: "@a@bピピン「%a000090王の　手にかかれば\n\tすぐにりっぱな博物館になりますよ。\n@c0@"
249:
  de: "@aBianca@bWir freuen uns alle auf den Moment, wenn die Ausstellung hier komplett ist, nicht?\n@c0@"
  en: "@aBianca@bWe're all lookin' forward to when this place is a full house, eh?\n@c0@"
  es: "@aBianca@bTodos estamos deseando llenarlo todo, ¿eh?\n@c0@"
  fr: "@aBianca@bOn a tous hâte de voir cet endroit rempli d'objets,\nn'est-ce pasⓡ\n@c0@"
  it: "@aBianca@bLe cose stanno andando bene.\n@c0@"
  ja: "@a@bビアンカ「楽しみにしてるのは\n\tおじいさん　だけじゃなくて\n\tきっと　お客さんもよ。\n@c0@"
250:
  de: "@aBianca@bJetzt dauert es nicht mehr lange.\n@c0@"
  en: "@aBianca@bNot far to go now.\n@c0@"
  es: "@aBianca@bYa no queda mucho.\n@c0@"
  fr: "@aBianca@bOn y est presque, maintenant.\n@c0@"
  it: "@aBianca@bAncora un po' e il nostro lavoro sarà terminato.\n@c0@"
  ja: "@a@bビアンカ「あと　ひと息ね！\n@c0@"
251:
  de: "@aNera@bIch kann es auch kaum noch erwarten, bis alle Podeste voll sind.\n@c0@"
  en: "@aNera@bI can't wait to see all the pedestals full, either.\n@c0@"
  es: "@aNera@bYo también estoy deseando ver tutti los pedestales llenos.\n@c0@"
  fr: "@aNera@bMoi aussi, j'ai hâte de voir tous les piédestaux occupés.\n@c0@"
  it: "@aNera@bNon vedo l'ora che su ogni piedistallo ci sia un pregiato souvenir!\nSarà uno spettacolo splendido!\n@c0@"
  ja: "@a@bフローラ「全部の台座に　展示されるのを\n\t楽しみにしているのは\n\t私も　同じですわ。\n@c0@"
252:
  de: "@a%0%a001240@bIch freue mich schon lange darauf, dass die Podeste irgendwann mal alle belegt sind. Ich hoffe, bald ist es so weit.\n@c0@"
  en: "@a%0%a001240@bI've been looking forward to filling the whole place up for ages. I hope we manage it soon.\n@c0@"
  es: "@a%0%a001240@bYo llevo queriendo ver todo lleno desde ni se sabe. Espero que pronto lo logremos.\n@c0@"
  fr: "@a%0%a001240@bÇa fait déjà très longtemps que j'ai envie que la collection soit complète. J'espère qu'on y arrivera bientôt.\n@c0@"
  it: "@a%0%a001240@bTra un po' questo posto sarà pieno zeppo di bellissimi oggetti!\nTroppo forte!\n@c0@"
  ja: "@a@b%a001240「ボクは　ずっと前から\n\t楽しみにしてたよ。\n\t早く　うまるといいな。\n@c0@"
253:
  de: "@a%0%a001250@bIch bin sicher, wir haben das Museum im Nu voll. Ich kann's kaum noch erwarten!\n@c0@"
  en: "@a%0%a001250@bI'm sure you'll have the place full in no time, Dad.\nI can't wait!\n@c0@"
  es: "@a%0%a001250@bEstoy segura de que tendrás este sitio lleno en un periquete, papi.\n¡Estoy deseándolo!\n@c0@"
  fr: "@a%0%a001250@bJe suis sûre que tu auras rempli cet endroit en un rien de temps, papa. Je suis pressée de voir çaⓠ\n@c0@"
  it: "@a%0%a001250@bNon ci vorrà molto prima che ogni piedistallo del Museo del Souvenir ospiti un oggetto prezioso!\nLa collezione attirerà persone da tutto il mondo!\n@c0@"
  ja: "@a@b%a001250「お父さんなら　すぐよね。\n\t私も　楽しみ！\n@c0@"
254:
  de: "@aSancho@bNur noch ein kleines bisssen, Chico. Das schaffst du doch, nisst? Du bist doch noch nisst erschöpft?\n@c0@"
  en: "@aSancho@bYou need just a leettle more effort, friend.\nCan you do eet? You are no too tired?\n@c0@"
  es: "@aSancho@bNomás un último esfuerzo, chamaquito.\r\n¿Podrás hacerlo? ¿No estarás al cuas?\n@c0@"
  fr: "@aSancho@bIl ne te reste plus qu'oun petit effort, chico. Tu y arriverasⓡ Tu n'es p-pas trop fatiguéⓡ\n@c0@"
  it: "@aSancho@bChico, ancora un esforzo e avremo finito...\n¿Sarebbe un peccatos ritirarse dopo aver fatto tanta fatica, no?\n@c0@"
  ja: "@a@bサンチョ「あとひと息と　いうところが\n\t大事なのですが…\n\t%a000090王ならば　大丈夫でしょうね。\n@c0@"
255:
  de: "@aOtto@bEs ist nur noch eine Frage der Zeit, bis alle Podeste voll sind.\n@c0@"
  en: "@aTuppence@bIt's just a matter of time before all the pedestals are full now.\n@c0@"
  es: "@aAlazar@bEs solo cuestión de tiempo llenar todos los pedestales.\n@c0@"
  fr: "@aInnocent@bCe n'est qu'une question de temps avant que tous\r\nles piédestaux soient remplis, désormais.\n@c0@"
  it: "@aSimon@bCi siamo quasi...\nNon sono molti i piedistalli ancora vuoti.\nAncora un po' e avremo finito!\n@c0@"
  ja: "@a@bピピン「すべての台座が　うまるのも\n\t時間の問題ですね。\n@c0@"
256:
  de: "@aBianca@bDas ist eigentlich nur eine nette Art zu sagen, dass du keinen Geschmack hast, oder? \n@c0@"
  en: "@aBianca@bThat's basically a roundabout way of him sayin' you en't got no taste, en't it?\n@c0@"
  es: "@aBianca@bEstá diciendo disimuladamente que no sabes organizar, ¿no?\n@c0@"
  fr: "@aBianca@bC'est juste sa manière à lui de dire que tu n'as aucun goût, je me trompeⓡ\n@c0@"
  it: "@aBianca@bOh, ma che bel complimento ci ha fatto quel vecchiaccio! E se invece fosse il ⓕcaroⓖ Geremia ad avere la zucca vuota, eh?!\n@c0@"
  ja: "@a@bビアンカ「これって　遠まわしに\n\tセンスがないって　意味で\n\t書いてるのかしら？\n@c0@"
257:
  de: "@aNera@bIch bin überrascht, dass er immer noch nicht zufrieden ist. Schließlich sind jetzt alle Podeste belegt, genau wie er es wollte.\n@c0@"
  en: "@aNera@bI'm surprised he's still not satisfied. We filled up all the pedestals like he wanted, after all.\n@c0@"
  es: "@aNera@bNo me puedo creer que todavía no esté satisfecho. Al fin y al cabo, hemos llenado tutti los pedestales como quería.\n@c0@"
  fr: "@aNera@bJe suis surprise qu'il ne soit toujours pas satisfait. Nous avons rempli tous les piédestaux, comme il le souhaitait, après tout.\n@c0@"
  it: "@aNera@bNon ci posso credere! Abbiamo posto un souvenir su ciascun piedistallo, eppure Geremia non è ancora soddisfatto! Quel tipo è davvero incontentabile!\n@c0@"
  ja: "@a@bフローラ「せっかく　全部の台座に\n\t展示したのに　あのようなこと\n\t書かれるとショックです……。\n@c0@"
258:
  de: "@a%0%a001240@bSind wir denn immer noch nicht fertig? Museen machen wirklich eine Menge Arbeit!\n@c0@"
  en: "@a%0%a001240@bAre we still not done yet, then?\nMuseums are really hard work!\n@c0@"
  es: "@a%0%a001240@bEntonces, ¿aún no hemos terminado?\n¡Los museos dan mucho trabajo!\n@c0@"
  fr: "@a%0%a001240@bOn n'a pas encore finiⓡ C'est vraiment un gros travail, de faire un muséeⓠ\n@c0@"
  it: "@a%0%a001240@bMa come?!\nC'è ancora del lavoro da fare?!\nCredevo che avessimo completato la collezione...\n@c0@"
  ja: "@a@b%a001240「まだまだ　やらなきゃ\n\tいけないことがあるの？\n\t博物館て　大変だね。\n@c0@"
259:
  de: "@a%0%a001250@bIch dachte, wir könnten die Stücke so ausstellen, wie es uns gefällt!\n@c0@"
  en: "@a%0%a001250@bI thought he said we could just exhibit things how\nwe wanted!\n@c0@"
  es: "@a%0%a001250@bCreía que había dicho que podíamos colocar las cosas como quisiéramos.\n@c0@"
  fr: "@a%0%a001250@bJe croyais qu'il avait dit qu'on pouvait exposer\nles objets comme on voulaitⓠ\n@c0@"
  it: "@a%0%a001250@bSono io che ricordo male o aveva detto che potevamo esporre tutto ciò che volevamo, nel modo in cui preferivamo?!\n@c0@"
  ja: "@a@b%a001250「おじいさん　名産品は\n\t自由に　置いていいって\n\t言ってなかったっけ？\n@c0@"
260:
  de: "@aSancho@bDieses Wissen kann man siss aber nisst im Handumdrehen aneignen, no? Solsse Dinge brauchen ihre Zeit.\n@c0@"
  en: "@aSancho@bThees know-how, ees no esometheeng you can just pick eet up, eh? Ees gonna take time.\n@c0@"
  es: "@aSancho@bEl trabajar nunca acaba. Nos va a llevar un tiempito.\n@c0@"
  fr: "@aSancho@bOun tel savoir-faire, ça ne s'apprend pas en\nc-c-claquant des doigts, heinⓡ Ça va prendre\ndu temps.\n@c0@"
  it: "@aSancho@bTu sei un hombre intelligente, chico, ma pienso que ce vorrà comunque del tiempo por capire como se espongono los oggettos nel modo mejor...\n@c0@"
  ja: "@a@bサンチョ「展示するセンスは\n\tすぐに　どうにかなるものじゃ\n\tないところが　問題ですね……。\n@c0@"
261:
  de: "@aOtto@bKaum hat man eine Arbeit fertig, lauert schon die nächste. Das nimmt hier ja kein Ende!\n@c0@"
  en: "@aTuppence@bWhen one job ends, there's always another one waiting in the wings. The work here is never-ending!\n@c0@"
  es: "@aAlazar@bCuando acabas con una cosa, siempre hay otra esperando a la vuelta de la esquina. Esto es un no parar.\n@c0@"
  fr: "@aInnocent@bÀ peine a-t-on terminé une tâche qu'une autre nous attend. Le travail ne s'arrête jamais, iciⓠ\n@c0@"
  it: "@aSimon@bNon abbiamo nemmeno fatto in tempo a finire il lavoro precedente che il malefico nonnetto ce ne ha appioppato subito un altro! Che schiavista!\n@c0@"
  ja: "@a@bピピン「ひとつ何かを　終えるたびに\n\tひとつ注文が　ついていきそうで\n\tこわいですね。\n@c0@"
262:
  de: "@aBianca@bWenn er uns auch etwas darüber erzählen würde, wäre das eine große Hilfe.\n@c0@"
  en: "@aBianca@bIf only he'd give us that kind of information, it'd be a big help.\n@c0@"
  es: "@aBianca@bSi nos lo hubiera dicho a nosotros también, hubiera sido de gran ayuda, ¿sabes?\n@c0@"
  fr: "@aBianca@bSi seulement il nous les avait données à nous,\r\nces informations, ça nous aurait été utile.\n@c0@"
  it: "@aBianca@bSe le informazioni le avesse date a noi sarebbe stato meglio, no?! A volte non riesco proprio a capire cosa passi per la testa di Geremia!\n@c0@"
  ja: "@a@bビアンカ「私たちには　いろいろと\n\t教えてくれないのかな？\n@c0@"
263:
  de: "@aNera@bEs klingt ganz so, als sei der alte Firle Franz von Kati Krams sehr angetan.\n@c0@"
  en: "@aNera@bIt sounds like Old Man Nick Knack is quite taken with Sue Veneer.\n@c0@"
  es: "@aNera@bSembra que el nono Nino está encandilado con Nuray Niada.\n@c0@"
  fr: "@aNera@bOn dirait que le vieux Bricabrac a un gros faible pour Marie-Jo Konde.\n@c0@"
  it: "@aNera@bEh eh eh!\nIl caro Geremia s'è preso una bella cotta per Sue Venir!\n@c0@"
  ja: "@a@bフローラ「おじいさん　ミミさんのことが\n\tそうとう　お気にめしたようですね。\n@c0@"
264:
  de: "@a%0%a001240@bKati Krams ist echt clever, weißt du.\n@c0@"
  en: "@a%0%a001240@bSue Veneer's really clever, you know.\n@c0@"
  es: "@a%0%a001240@bNuray Niada es muy inteligente, ¿sabes?\n@c0@"
  fr: "@a%0%a001240@bMarie-Jo est vraiment maligne, tu sais.\n@c0@"
  it: "@a%0%a001240@bSue Venir è proprio brava. Ed è anche molto carina!\nSe avessi qualche anno in più, le chiederei di uscire con me! Eh eh eh!\n@c0@"
  ja: "@a@b%a001240「あのお姉さん　勉強熱心だって\n\tえらいなあ。\n@c0@"
265:
  de: "@a%0%a001250@bEs klingt, als würde er Kati Krams jede Menge Anweisungen geben. Die arbeitet bestimmt sehr hart.\n@c0@"
  en: "@a%0%a001250@bIt sounds like he's giving Sue lots and lots of instructions. She must be working hard too.\n@c0@"
  es: "@a%0%a001250@bParece que a Nuray le está dando un montón de instrucciones. La chica debe de estar trabajando un montón.\n@c0@"
  fr: "@a%0%a001250@bApparemment, il donne beaucoup de consignes\nà Marie-Jo. Elle aussi, elle doit travailler dur.\n@c0@"
  it: "@a%0%a001250@bProprio non capisco come mai Geremia abbia dato le istruzioni a Sue invece che a noi...\nAnzi, no. Lo capisco fin troppo bene! Eh eh eh!\n@c0@"
  ja: "@a@b%a001250「お姉さんには　いろいろ\n\t教えてあげてるんだね。\n\tお姉さんも　がんばってるんだ。\n@c0@"
266:
  de: "@aSancho@bZu sehen, wie diese junge Señorita siss so viel Mühe gibt, das ist wirkliss ein schöner Anblick, nisst wahr?\n@c0@"
  en: "@aSancho@bWhen you esee the young señorita working eso hard, ees a beautiful esight, sí?\n@c0@"
  es: "@aSancho@bVer a la señorita trabajando reteduro es bien bello.\n@c0@"
  fr: "@aSancho@bC'est vraiment oune belle chose de v-voir cette jeune s-señorita travailler autant, noⓡ\n@c0@"
  it: "@aSancho@bLa señorita Sue Venir es una gran lavoratrice.\nEs un piacere guardare quantos se empegna.\n@c0@"
  ja: "@a@bサンチョ「若者が　がんばってる姿は\n\tとても美しいものです。\n@c0@"
267:
  de: "@aSancho@bDer alte Señor, ihm gefällt das auch.\n@c0@"
  en: "@aSancho@bThees old señor, he ees enjoying eet too.\n@c0@"
  es: "@aSancho@bEl abuelo también lo está disfrutando.\n@c0@"
  fr: "@aSancho@bLe vieux señor aussi, il aime ça.\n@c0@"
  it: "@aSancho@bY pienso que al señor Geremia gli gusta guardare anche altras cosas de Sue...\n@c0@"
  ja: "@a@bサンチョ「おじいさんも　その姿に\n\t心打たれたのでしょうね。\n@c0@"
268:
  de: "@aOtto@bDer wird doch net heimlich für sie schwärmen, oder? Nein, b'stimmt net!\n@c0@"
  en: "@aTuppence@bSurely he's not secretly carrying a torch for her,\r\nis he? No, surely not!\n@c0@"
  es: "@aAlazar@b¿Estás seguro de que no está enamorado en secreto de ella? ¡No, seguro que no!\n@c0@"
  fr: "@aInnocent@bIl n'en pince quand même pas pour elle en secret, dites-moiⓡ Non, c'est impossibleⓠ\n@c0@"
  it: "@aSimon@bMa non è che per caso Geremia...?\nE Sue Venir...?\r\nMa no, cosa vado a pensare...!\n@c0@"
  ja: "@a@bピピン「まさかとは　思いますが\n\t下心があるわけでは　ないですよね？\n@c0@"
269:
  de: "@aBianca@bGespött? Was meint er denn damit? Was soll denn hier nicht in Ordnung sein?\n@c0@"
  en: "@aBianca@bI hardly think the place looks like a joke!\r\nI wonder what it is that's so wrong with it.\n@c0@"
  es: "@aBianca@bPues yo no creo que este lugar tenga un aspecto ridículo, ¿me entiendes?\r\n¿Pero qué tiene de malo este sitio ahora?\n@c0@"
  fr: "@aBianca@bJe ne trouve pas que cet endroit n'a l'air de rienⓠ\nJe me demande ce qui ne va pas.\n@c0@"
  it: "@aBianca@bCome sarebbe a dire che non ci sappiamo fare?!\nMa cosa si aspetta noi quel velenosissimo vecchiaccio?!\n@c0@"
  ja: "@a@bビアンカ「そんなに　ヒドイの？\n\tあの展示のしかたって……。\n\tちょっと　ショックね。\n@c0@"
270:
  de: "@aNera@bOffenbar lässt der alte Firle Franz in seinen Tagebüchern gern ein wenig Dampf ab und sagt all das, was er einem nicht ins Gesicht sagen kann.\n@c0@"
  en: "@aNera@bI'm afraid Old Man Nick Knack obviously likes to let off steam in his diary and say all the hurtful things he can't say to our faces.\n@c0@"
  es: "@aNera@bMe temo que al nono Nino le gusta soltar en su diario todas las cosas horribles que no se atreve a decirnos a la cara.\n@c0@"
  fr: "@aNera@bJ'ai bien l'impression que le vieux Bricabrac se défoule dans son journal en y déversant toutes les choses blessantes qu'il n'ose pas nous dire en face.\n@c0@"
  it: "@aNera@bHo la sensazione che Geremia scriva nel suo diario tutte le cose che non ha il coraggio di dirci in faccia. Forse ha paura di urtare la nostra sensibilità...\n@c0@"
  ja: "@a@bフローラ「おじいさんは　私たちに\n\t言えないことを　こうして\n\t日記に　書いてるんですね……。\n@c0@"
271:
  de: "@a%0%a001240@bMeinst du, die Besucher lachen über die Ausstellung? Das wäre aber nicht gut.\n@c0@"
  en: "@a%0%a001240@bDo you think the visitors see the place as a joke too? That wouldn't be very good.\n@c0@"
  es: "@a%0%a001240@b¿Crees que los visitantes también pensarán que este sitio es ridículo? Eso no estaría bien.\n@c0@"
  fr: "@a%0%a001240@bTu crois que les visiteurs trouvent eux aussi\nque cet endroit ne ressemble à rienⓡ\nÇa ne serait pas terrible.\n@c0@"
  it: "@a%0%a001240@bSpero che i visitatori non pensino anche loro che non ci sappiamo fare!\nPer il Museo del Souvenir sarebbe la fine!\n@c0@"
  ja: "@a@b%a001240「それって　お客さんも\n\tメチャクチャに　見えてるってこと？\n\tそれはこまるよね。\n@c0@"
272:
  de: "@a%0%a001250@bIch dachte, wir könnten die Stücke so ausstellen, wie es uns gefällt!\n@c0@"
  en: "@a%0%a001250@bI thought he said we could just exhibit things how\nwe wanted!\n@c0@"
  es: "@a%0%a001250@bCreía que había dicho que podíamos colocar las cosas como quisiéramos.\n@c0@"
  fr: "@a%0%a001250@bJe croyais qu'il avait dit qu'on pouvait exposer\nles objets comme on voulaitⓠ\n@c0@"
  it: "@a@bSono io che ricordo male o aveva detto che potevamo esporre tutto ciò che volevamo, nel modo in cui preferivamo?!\n@c0@"
  ja: "@a@b%a001250「おじいさん　名産品は\n\t自由に　置いていいって\n\t言ってなかったっけ？\n@c0@"
273:
  de: "@aSancho@bErst sagt er uns, wir können unseren Schnick und Schnack hinstellen, wo wir wollen, no? Und dann findet er an allem etwas auszusetzen.\n@c0@"
  en: "@aSancho@bHe esay to us, we put these knicks and knacks where we want, no? But he no like eet when we do eet.\n@c0@"
  es: "@aSancho@bPues, ¿no dijo que pusiéramos las cosinas donde nos gustara? Y luego no le gusta donde las pusimos.\n@c0@"
  fr: "@aSancho@bIl nous a dit qu'on p-p-pouvait placer ces objets comme on v-voulait, noⓡ Mais quand on le fait,\nil n'est pas c-content.\n@c0@"
  it: "@aSancho@b¡Por todas las paellas! ¿Ma no ce aveva detto que podemos esporre los souvenir como preferiamo?\n¡Chi lo entiende, quell'hombre!\n@c0@"
  ja: "@a@bサンチョ「自由に置いていいと　いっても\n\t限度があるようですね。　う～む……。\n@c0@"
274:
  de: "@aOtto@bWir sollten lieber etwas umstellen, bevor der alte Mann sich noch um den Verstand bringt!\n@c0@"
  en: "@aTuppence@bWe'd better do something about the place before the poor old man drives himself delirious!\n@c0@"
  es: "@aAlazar@bSerá mejor que hagamos algo con este sitio antes de que el vejete se vuelva loco.\n@c0@"
  fr: "@aInnocent@bOn ferait bien de faire quelques changements avant que le vieil homme ne devienne complètement dingueⓠ\n@c0@"
  it: "@aSimon@bCerchiamo di accontentare quel povero pazzo, altrimenti sprecherà fiumi d'inchiostro a scrivere della nostra incapacità di gestire il Museo...\n@c0@"
  ja: "@a@bピピン「おじいさんが本格的に\n\tひがまないうちに　なんとかしたほうが\n\tよろしいかと思います……。\n@c0@"
275:
  de: "@aBianca@bEs klingt, als wäre der alte Firle Franz nicht sehr begeistert darüber, wie wir die Stücke hier ausstellen.\n@c0@"
  en: "@aBianca@bIt dun't sound like Old Man Nick Knack is too pleased with the way we're displayin' things.\n@c0@"
  es: "@aBianca@bPara mí que el abuelo Nino no está demasiado satisfecho con el modo en el que estamos colocando las cosas, ¿sabes?\n@c0@"
  fr: "@aBianca@bOn dirait que le vieux Bricabrac n'est pas très content de la façon dont on expose les pièces.\n@c0@"
  it: "@aBianca@bGeremia non sembra affatto contento di come abbiamo esposto i souvenir...\n@c0@"
  ja: "@a@bビアンカ「なんか　おじいさんは\n\t%a000090の展示のしかたを\n\tよく思って　ないみたいだけど。\n@c0@"
276:
  de: "@aBianca@bOb das Seufzen, das manchmal ertönt, wenn wir etwas Neues aufstellen, wohl ein Zeichen seiner Missbilligung ist?\n@c0@"
  en: "@aBianca@bI wonder if the sigh we sometimes hear when\r\nwe put somethin' new on display is him showin'\r\nhis disapproval.\n@c0@"
  es: "@aBianca@bMe pregunto si el suspiro que oímos cuando colocamos una nueva pieza es su forma de demostrar su disgusto.\n@c0@"
  fr: "@aBianca@bJe me demande si le soupir qu'on entend parfois quand on installe un nouvel objet est sa manière\r\nà lui d'exprimer sa désapprobation.\n@c0@"
  it: "@aBianca@bSe non troviamo il modo di accontentarlo, non la finirà mai di lamentarsi.\n@c0@"
  ja: "@a@bビアンカ「展示品を　置いたときに\n\tときどき聞こえてくる　ため息って\n\tおじいさんの　だったのかしら？\n@c0@"
277:
  de: "@aNera@bOffenbar müssen wir unsere Exponate etwas sorgfältiger platzieren.\n@c0@"
  en: "@aNera@bSounds like we need to be a bit more careful about how we arrange our displays.\n@c0@"
  es: "@aNera@bSembra que debemos ser más cuidadosos con el modo en el que colocamos la exhibición.\n@c0@"
  fr: "@aNera@bOn dirait qu'il va nous falloir être plus attentifs\r\nà la disposition des objets.\n@c0@"
  it: "@aNera@bPare proprio che dovremo trovare altri modi di esporre gli oggetti nel Museo. Almeno, questo è ciò che vorrebbe il lamentevole Geremia...\n@c0@"
  ja: "@a@bフローラ「あまり　自由に置いてしまっても\n\tいけないという　ことでしょうか？\n@c0@"
278:
  de: "@a%0%a001240@bKeine Sorge, Papa. Ich bin sicher, du kriegst es über kurz oder lang raus.\n@c0@"
  en: "@a%0%a001240@bDon't worry, Dad. I'm sure you'll have it cracked before long.\n@c0@"
  es: "@a%0%a001240@bNo te preocupes, papi. Seguro que lo tendrás todo controlado muy pronto.\n@c0@"
  fr: "@a%0%a001240@bNe t'inquiète pas, papa. Je suis sûr que\ntu y arriveras très vite.\n@c0@"
  it: "@a%0%a001240@bSono fiducioso! Prima o poi scopriremo cosa vuole da noi Geremia! Spero solo che ciò avvenga presto, perché non ne posso più...\n@c0@"
  ja: "@a@b%a001240「大丈夫だよ。　お父さんなら\n\tすぐに　いい展示のしかたができるよ。\n@c0@"
279:
  de: "@a%0%a001250@bEr sollte es uns ehrlich sagen, wenn er nicht mit dem einverstanden ist, was wir hier tun.\n@c0@"
  en: "@a%0%a001250@bHe should tell us to our faces if he has a problem with what we're doing here.\n@c0@"
  es: "@a%0%a001250@bSi tiene un problema con lo que estamos haciendo, debería decírnoslo a la cara.\n@c0@"
  fr: "@a%0%a001250@bIl ferait mieux de nous le dire en face si ce qu'on fait ici ne lui convient pas.\n@c0@"
  it: "@a%0%a001250@bInvece di continuare a lamentarsi di ciò che facciamo, Geremia potrebbe dirci cosa desidera davvero. Così la finiremmo con questa storia!\n@c0@"
  ja: "@a@b%a001250「問題があるなら\n\tちゃんと　言ってくれれば\n\tいいと思うんだけど……。\n@c0@"
280:
  de: "@aSancho@bDieser Señor, er würde uns so gern sagen, dass ihm nisst gefällt, was wir tun, no?\nEr ist wie ein Barrakuda ohne Zähne.\n@c0@"
  en: "@aSancho@bThees señor, he wants to esay to us eso bad that he no like how we arrange the exhibits, eh?\r\nEes like the barracuda weeth no teeth.\n@c0@"
  es: "@aSancho@bEl abuelo nomás está muriéndose por decirnos que no le gusta como colocamos las cosinas.\r\nEs como tiburón desdentado.\n@c0@"
  fr: "@aSancho@bCe señor, il a t-très envie de nous dire qu'il n'aime pas la f-façon dont on expose les choses, noⓡ\nIl est comme oun barracuda sans dents.\n@c0@"
  it: "@aSancho@bEs evidente que el señor Geremia no condivide el nuestro criterio de esporre los oggettos nel Museo... ¡Santa paella, que hombre incontentabiles!\n@c0@"
  ja: "@a@bサンチョ「おじいさんも　本当は\n\t言いたくて　しょうがないんですね。\n@c0@"
281:
  de: "@aOtto@bWenn wir die Ausstellungsstücke nur ein wenig umstell'n, ist er sicher zufried'n. Etwas mehr Mühe, dann werden wir's schon schaffen.\n@c0@"
  en: "@aTuppence@bIf we just tweak the displays, then I'm sure he'll be happy. Just a little more effort and we'll be there.\n@c0@"
  es: "@aAlazar@bSi cambiamos la exhibición un poco, estará contento. Un último esfuerzo y lo habremos logrado.\n@c0@"
  fr: "@aInnocent@bSi on modifiait légèrement la disposition, je suis certain qu'il serait satisfait. Encore un petit effort et nous y serons.\n@c0@"
  it: "@aSimon@bIl mio intuito mi dice che quasi ci siamo. Un ritocchino qui, una modifica là e...\nVoilà! L'esposizione sarà perfetta!\n@c0@"
  ja: "@a@bピピン「展示のしかたが　良くなれば\n\t問題はないんですよね？\n\tこれからですよ。　これから。\n@c0@"
282:
  de: "@aBianca@bWenn wir so weitermachen, dann wird das bestimmt ein ganz tolles Museum.\n@c0@"
  en: "@aBianca@bI reckon it'll be a great museum if we keep goin' at this rate.\n@c0@"
  es: "@aBianca@bCreo que este va a convertirse en un gran museo si seguimos así, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe crois que ça sera un musée fantastique\r\nsi on continue comme ça.\n@c0@"
  it: "@aBianca@bSu con la vita!\nPresto il Museo del Souvenir sarà assolutamente perfetto!\n@c0@"
  ja: "@a@bビアンカ「この調子で　いけば\n\tいい博物館にできそうね。\n@c0@"
283:
  de: "@aNera@bDas ist das erste Mal, dass wir ein Museum leiten, und da haben wir natürlich Anfangsschwierigkeiten, aber ich glaube, jetzt haben wir's.\n@c0@"
  en: "@aNera@bThis is our first time running a museum, so there's obviously a learning curve, but I think we're getting there now.\n@c0@"
  es: "@aNera@bEsta es la prima volta que llevamos un museo, así que obviamente tendremos que aprender poco a poco, ma credo que ya casi lo tenemos.\n@c0@"
  fr: "@aNera@bC'est la première fois que nous gérons un musée, alors nous avons des choses à apprendre, mais je crois que nous sommes sur la bonne voie.\n@c0@"
  it: "@aNera@bNessuno di noi aveva mai gestito un museo in vita sua, quindi direi che non ce la stiamo cavando male, per essere al nostro primo tentativo!\n@c0@"
  ja: "@a@bフローラ「博物館を　まかせられるのは\n\t初めてなんですし　このような感じで\n\tいけば　いいと思いますわ。\n@c0@"
284:
  de: "@a%0%a001240@bEr sagt, wir machen uns nicht schlecht, aber so ganz ist es noch nicht das, was er sich vorstellt, oder?\n@c0@"
  en: "@a%0%a001240@bHe says we're having a good bash, but we clearly haven't quite got it how he wants yet, have we?\n@c0@"
  es: "@a%0%a001240@bDice que te lo montas muy bien, pero aún no hemos acabado de comprender cómo quiere que lo hagamos, ¿verdad?\n@c0@"
  fr: "@a%0%a001240@bIl dit qu'on se débrouille bien, mais il est clair\nqu'on n'a pas fait les choses exactement comme\nil voulait, heinⓡ\n@c0@"
  it: "@a%0%a001240@bGeremia ha lasciato intendere che il Museo del Souvenir non è ancora come lo vorrebbe lui.\nMa allora perché non se lo gestisce da solo, eh?!\n@c0@"
  ja: "@a@b%a001240「がんばってるって書いてあるけど\n\tまだなっとく　いってないことが\n\tあるみたいだね……。\n@c0@"
285:
  de: "@a%0%a001250@bWie sollen wir uns denn besser einarbeiten? Das ist gar nicht so einfach.\n@c0@"
  en: "@a%0%a001250@bI wonder how we're supposed to get a better feel for the job. That sounds like hard work.\n@c0@"
  es: "@a%0%a001250@bMe pregunto cómo se supone que debemos mejorar poco a poco en nuestro trabajo. Parece complicado.\n@c0@"
  fr: "@a%0%a001250@bJe me demande comment on est censés apprendre le métier. Ça m'a l'air d'être bien difficile.\n@c0@"
  it: "@a%0%a001250@bVorrei tanto sapere cos'è che ancora non convince quell'anziano signore...\n@c0@"
  ja: "@a@b%a001250「展示品を置く\n\tセンスをみがくのって　むずかしそう。\n@c0@"
286:
  de: "@aSancho@bDiese Schnickschnack-Gessisste, das ist nissts, was man in ein paar Tagen meistern kann. Aber du lernst jeden Tag ein bisssen dazu, no?\n@c0@"
  en: "@aSancho@bEes no esometheeng you master een a few days, thees knick-knack esport. But you get a leettle better every day, sí?\n@c0@"
  es: "@aSancho@bPues esto de las cosinas no se aprende en un día. Pero vamos mejorando día a día.\n@c0@"
  fr: "@aSancho@bÇa n'est pas oune chose qu'on p-p-peut maîtriser\ndu jour au lendemain, ce bric-à-brac. Mais on s'améliore oun petit peu chaque jour, noⓡ\n@c0@"
  it: "@aSancho@bNo es facil essere el responsabile de un museo como esto, chico. Credo que abbiamo ancora un poco de cosas da imparare...\n@c0@"
  ja: "@a@bサンチョ「センスでも　なんでも\n\tつみ重ねが大事です。　少しずつ\n\tみがいていけば　いいのですよ。\n@c0@"
287:
  de: "@aOtto@bDas ist seine Art zu sagen, dass er mit uns ganz zufrieden ist? Überschwänglich kann man das ja net grad nennen.\n@c0@"
  en: "@aTuppence@bThis is his version of being fairly pleased with us,\r\nis it? It's rather hard to tell.\n@c0@"
  es: "@aAlazar@b¿En su idioma eso viene a significar que está bastante satisfecho con nuestro trabajo?\r\nNo es fácil saberlo.\n@c0@"
  fr: "@aInnocent@bSerait-ce sa manière à lui de nous dire qu'il est plutôt satisfait de nousⓡ Difficile d'en être sûr.\n@c0@"
  it: "@aSimon@bMi sbaglio o il vecchio Geremia è stato meno acido del solito nei suoi commenti? Vuoi vedere che stiamo imparando come si porta avanti questa baracca?\n@c0@"
  ja: "@a@bピピン「これは　ほめられてるんですよね？\n\tちがうんですか？\n@c0@"
288:
  de: "@aBianca@bWunderbar! Endlich haben wir es geschafft, dass der alte Mann zufrieden mit uns ist!\n@c0@"
  en: "@aBianca@bBrilliant! We've finally made the old man happy at\r\nlong last!\n@c0@"
  es: "@aBianca@b¡Genial! Por fin hemos hecho feliz al viejales, ¿sabes?\n@c0@"
  fr: "@aBianca@bExcellentⓠ\nOn a enfin réussi à contenter ce vieil hommeⓠ\n@c0@"
  it: "@aBianca@bNon ci credo...\nGeremia è finalmente soddisfatto del nostro lavoro.\nQui c'è qualcosa che non va.\n@c0@"
  ja: "@a@bビアンカ「よかった！\n\tおじいさんの　期待に\n\tこたえられたみたいね。\n@c0@"
289:
  de: "@aNera@bDa fällt mir aber ein Stein vom Herzen! Offenbar ist der alte Firle Franz endlich mit dem zufrieden, was wir gemacht haben.\n@c0@"
  en: "@aNera@bWhat a relief! It sounds like Old Man Nick Knack is finally satisfied with what we've done.\n@c0@"
  es: "@aNera@b¡Ma qué alivio! Sembra que el nono Nino por fin está satisfecho con lo que hemos hecho.\n@c0@"
  fr: "@aNera@bQuel soulagementⓠ Le vieux Bricabrac semble enfin satisfait de notre travail.\n@c0@"
  it: "@aNera@bOh, era ora! Quell'anziano gentiluomo dimostra di apprezzare quanto stiamo facendo per lui.\nSia ringraziata la dea!\n@c0@"
  ja: "@a@bフローラ「よかったですね。\n\tおじいさんの　期待に\n\tこたえられたようですわ。\n@c0@"
290:
  de: "@a%0%a001240@bIch habe immer gewusst, dass du es schaffen würdest, Papa.\n@c0@"
  en: "@a%0%a001240@bI always knew you could do it, Dad!\n@c0@"
  es: "@a%0%a001240@bSabía que podías hacerlo, papi.\n@c0@"
  fr: "@a%0%a001240@bJ'ai toujours su que tu y arriverais, papaⓠ\n@c0@"
  it: "@a%0%a001240@bSapevo che ci saremmo riusciti!\nSiamo troppo forti!\n@c0@"
  ja: "@a@b%a001240「ボクは　お父さんは\n\tセンスがあるって　初めから\n\tわかってたよ！\n@c0@"
291:
  de: "@a%0%a001250@bDer alte Firle Franz sagt, du hättest es so gemacht, wie er es auch gemacht hätte. Aber du hast es bestimmt viel besser gemacht.\n@c0@"
  en: "@a%0%a001250@bOld Man Nick Knack says you did it just as he would've done it himself. I think you probably\ndid it even better than that!\n@c0@"
  es: "@a%0%a001250@bEl abuelo Nino dice que es como si él mismo dirigiera el musenino. Yo creo que incluso lo diriges mejor.\n@c0@"
  fr: "@a%0%a001250@bLe vieux Bricabrac a dit que tu avais fait les choses comme il les aurait faites lui-même. Moi, je crois\nque tu as même fait mieux que çaⓠ\n@c0@"
  it: "@a%0%a001250@bSono convinta che abbiamo fatto un lavoro addirittura migliore di quanto si aspettasse il nostro Geremia! Gli allievi hanno superato il maestro!\n@c0@"
  ja: "@a@b%a001250「おじいさんと　センスが\n\tぴったりだって。　私はお父さんの方が\n\tセンスは上だと思うな。\n@c0@"
292:
  de: "@aSancho@bSiehst du, Chico? Dieser Señor, er mag diss jetzt. Weil du so ein guter Kurator bist!\n@c0@"
  en: "@aSancho@bYou esee, friend? Thees señor, he likes you now because you are esuch a good curator.\n@c0@"
  es: "@aSancho@b¿Ves, chamaquito? Le gustas al abuelito. Es que eres un gestor bien padre.\n@c0@"
  fr: "@aSancho@bTu vois, chicoⓡ Ce señor, il t'apprécie parce que\ntu es oun b-bon conservateur.\n@c0@"
  it: "@aSancho@b¿El señor Geremia es soddisfatto de nosotros?\n¡Esto es un miracolo!\n@c0@"
  ja: "@a@bサンチョ「どうやら　%a000090王は\n\t館長としておじいさんの　おめがねに\n\tかなったようですね。\n@c0@"
293:
  de: "@aOtto@bPrima. Jetzt seid Ihr ein echter Kurator, %a000090.\n@c0@"
  en: "@aTuppence@bThat's the way. You're a proper curator now, %a000090.\n@c0@"
  es: "@aAlazar@b¡Así se hace! Estás hecho todo un gestor, %a000090.\n@c0@"
  fr: "@aInnocent@bEt voilà, vous êtes un véritable conservateur, désormais, %a000090.\n@c0@"
  it: "@aSimon@bNon avevo dubbi che avremmo portato a termine il lavoro nel migliore dei modi. Certo, c'è voluto un po' di tempo, ma ce l'abbiamo fatta!\n@c0@"
  ja: "@a@bピピン「そうでした。　%a000090王は\n\tここでは館長なんでしたね。\n@c0@"
294:
  de: "@aBianca@bDas hätte ich ihr nie zugetraut.\n@c0@"
  en: "@aBianca@bI didn't know she had that kind of side to her too.\n@c0@"
  es: "@aBianca@bDesconocía esa faceta suya, ¿sabes?\n@c0@"
  fr: "@aBianca@bJ'ignorais qu'elle était aussi douée pour ça.\n@c0@"
  it: "@aBianca@bSue Venir è una vera sorpresa.\nPiù la conosco, più mi accorgo che è piena di qualità.\nNon QUELLE qualità!\n@c0@"
  ja: "@a@bビアンカ「あの娘って　そんな\n\tいち面があるんだ。\n@c0@"
295:
  de: "@aNera@bIch kann auch ganz gut Kuchen backen. Ich muss dir wirklich mal einen backen.\n@c0@"
  en: "@aNera@bI'm not too bad when it comes to baking cakes myself. You'll have to have a taste one of these days.\n@c0@"
  es: "@aNera@bCuando de repostería se trata veramente lo hago bien. Debería hacerte un tiramisú un giorno de estos.\n@c0@"
  fr: "@aNera@bJe ne suis moi-même pas mauvaise en pâtisserie.\r\nIl faudra que tu goûtes à ce que je fais, un jour.\n@c0@"
  it: "@aNera@bAnch'io sono brava a preparare dolci. Chissà, magari potrei portarne qualcuno a Geremia... Uhm, meglio di no. Non vorrei che gli venissero strane idee!\n@c0@"
  ja: "@a@bフローラ「私も　お菓子作りは\n\t得意なんですよ。\n\t今度　食べてみてくださいね。\n@c0@"
296:
  de: "@a%0%a001240@bOh! Ich wünschte, wir hätten auch was von ihrem Kuchen abgekriegt!\n@c0@"
  en: "@a%0%a001240@bOh! I wish I could've tried some of her cakes!\n@c0@"
  es: "@a%0%a001240@b¡Oh! ¡Ojalá hubiese podido probar uno de sus pastelinos!\n@c0@"
  fr: "@a%0%a001240@bOhⓠ Si seulement j'avais pu goûter\nun de ses gâteauxⓠ\n@c0@"
  it: "@a%0%a001240@bDolci?!\nDove sono?! Ho fame!\n@c0@"
  ja: "@a@b%a001240「へー　ボクもお姉さんの\n\t作ったお菓子　食べてみたかったなあ。\n@c0@"
297:
  de: "@a%0%a001250@bDann bäckt Kati also Kuchen? Ich will auch schon ewig einen Kuchen backen!\n@c0@"
  en: "@a%0%a001250@bSo Sue's been baking cakes? I've been wanting to do some baking of my own for ages now.\n@c0@"
  es: "@a%0%a001250@b¿Así que Nuray ha preparado pastelinos? Yo siempre he querido cocinar unos.\n@c0@"
  fr: "@a%0%a001250@bAlors Marie-Jo fait des gâteauxⓡ Ça fait longtemps que j'ai envie d'essayer d'en faire, moi aussi.\n@c0@"
  it: "@a%0%a001250@bAllora Sue sa anche cucinare?\nAccidenti!\nÈ una ragazza davvero in gamba!\n@c0@"
  ja: "@a@b%a001250「お菓子作りかあ……。\n\tわたしも　前から\n\tやってみたかったの。\n@c0@"
298:
  de: "@aSancho@bDein Onkel Sancho ist auch ein prima Kuchenbäcker, weißt du? Sí, sí. Und er ist ein noch besserer Kuchenesser!\n@c0@"
  en: "@aSancho@bYour Uncle Sancho, he ees good at baking the cakes too, you know. Sí, sí. And he ees good at eating them too.\n@c0@"
  es: "@aSancho@bA tu tito Sancho se le da de miedo hornear pasteles, ¿lo sabías? ¡Ándale! Y se le da mejor aún comérselos.\n@c0@"
  fr: "@aSancho@bTonton Sancho lui aussi est d-doué pour faire\r\ndes g-g-gâteaux, tu sais. Si, si. Et il est aussi\r\nt-t-très fort pour les manger.\n@c0@"
  it: "@aSancho@b¿Dolci?\n¿Por qué Sue ha portato dei dolci?\n¡Yo preferivo una paella!\n@c0@"
  ja: "@a@bサンチョ「このサンチョ　実は\n\tお菓子を　作るのも\n\t得意なんですよ。\n@c0@"
299:
  de: "@aOtto@bSie ist also gut im Kuchenbacken? Mmm... Also, das ist eine Fähigkeit, die ich an Frauen zutiefst bewundere.\n@c0@"
  en: "@aTuppence@bSo she's good at baking cakes, is she? Mmm...\r\nNow there's a quality I admire in a woman.\n@c0@"
  es: "@aAlazar@b¿Así que se le da bien la repostería? Mmm...\r\nEso es algo que me encanta en las mujeres.\n@c0@"
  fr: "@aInnocent@bAlors comme ça, elle sait bien faire les gâteaux.\r\nMmm... Voilà une qualité que j'admire chez une femme.\n@c0@"
  it: "@aSimon@bÈ intelligente, è una gran lavoratrice, è simpatica, è bella, sa cucinare... Diamine! Questo spazio non è sufficiente per elencare tutte le qualità di Sue!\n@c0@"
  ja: "@a@bピピン「お菓子作りの得意な女性……\n\tう～ん…　ステキです……。\n@c0@"
300:
  de: "@aBianca@bIch glaube, du leistest hier wirklich gute Arbeit, %a000090.\n@c0@"
  en: "@aBianca@bI reckon you're doin' a really good job of runnin' this place, %a000090.\n@c0@"
  es: "@aBianca@bCreo que estás haciendo un trabajo excelente llevando este sitio, %a000090.\n@c0@"
  fr: "@aBianca@bTu dois vraiment faire du très bon travail ici, %a000090.\n@c0@"
  it: "@aBianca@bOra sono certa che Geremia non rimpiange di averti nominato direttore del Museo del Souvenir, %a000090.\n@c0@"
  ja: "@a@bビアンカ「館長として　１人前になれたって\n\tことかしらね。\n@c0@"
301:
  de: "@aNera@bKunden durch die Tür zu bekommen ist wirklich eine Gabe. Das sagt jedenfalls Papa immer.\n@c0@"
  en: "@aNera@bGetting customers in through the doors is a real skill. That's what Papa always says.\n@c0@"
  es: "@aNera@bConseguir que vengan visitantes es veramente una habilidad. Eso es lo que dice il mio papino.\n@c0@"
  fr: "@aNera@bSavoir faire franchir la porte aux clients est un vrai talent. C'est ce que papa dit toujours.\n@c0@"
  it: "@aNera@bMio padre lo dice sempre: non è facile far partire una nuova attività.\n@c0@"
  ja: "@a@bフローラ「お客さんに　来てもらえるのも\n\tひとつの才能だと　父から\n\t聞いたことがあります。\n@c0@"
302:
  de: "@aNera@bUnd dir gelingt das ganz großartig, Liebling.\n@c0@"
  en: "@aNera@bAnd you've certainly managed to do that\r\nhere, darling.\n@c0@"
  es: "@aNera@bY desde luego tú lo has conseguido, caro mío.\n@c0@"
  fr: "@aNera@bEt c'est ce que tu as réussi à faire ici, mon chéri.\n@c0@"
  it: "@aNera@bEppure tu ci sei riuscito in maniera splendida, amore mio...\n@c0@"
  ja: "@a@bフローラ「これも　%a000090さんの\n\t才能なのだと思いますわ。\n@c0@"
303:
  de: "@a%0%a001240@bDu hast wirklich hart gearbeitet, Papa. Das erkennen die Besucher bestimmt auch.\n@c0@"
  en: "@a%0%a001240@bYou worked really hard, Dad. The visitors can see that, I'm sure.\n@c0@"
  es: "@a%0%a001240@bHas trabajado mucho, papi. Los visitantes lo notarán, seguro.\n@c0@"
  fr: "@a%0%a001240@bTu as travaillé très dur, papa. Je suis sûr que\nles visiteurs le voient.\n@c0@"
  it: "@a%0%a001240@bPapà, hai fatto un ottimo lavoro!\nSono sicuro che i visitatori apprezzeranno tutti gli sforzi che hai compiuto!\n@c0@"
  ja: "@a@b%a001240「お父さん　がんばったもんね。\n\tそれが　お客さんに伝わったんだよ。\n@c0@"
304:
  de: "@a%0%a001250@bWas dem alten Firle Franz wohl jetzt noch auf dem Herzen liegt? Bei so vielen Besuchern kann es doch bestimmt nichts mehr auszusetzen geben.\n@c0@"
  en: "@a%0%a001250@bI wonder what could be bothering Old Man Nick Knack. Surely nothing can be wrong if we have this many visitors.\n@c0@"
  es: "@a%0%a001250@bMe pregunto qué le preocupará al abuelo Nino. Todo debe de andar bien si tenemos tantos visitantes.\n@c0@"
  fr: "@a%0%a001250@bJe me demande ce qui peut gêner le vieux Bricabrac. Il ne peut pas y avoir le moindre problème si nous avons autant de visiteurs.\n@c0@"
  it: "@a%0%a001250@bSperiamo solo che adesso il nostro amico Geremia non cominci a lamentarsi che le cose vanno troppo bene!\nEh eh eh!\n@c0@"
  ja: "@a@b%a001250「あんなに　たくさんの\n\tお客さんが来てくれたのに\n\t気になることって　なにかな？\n@c0@"
305:
  de: "@aSancho@bEs wimmelt? Ja, risstig, es wimmelt. Wie bei Ameisen.\n@c0@"
  en: "@aSancho@bEes black? Sí, ees dark. But ees no black.\n@c0@"
  es: "@aSancho@b¿Hasta arriba? Bueno, igual hasta el medio. Pero hasta arriba no.\n@c0@"
  fr: "@aSancho@bIl est n-noirⓡ C'est vrai qu'il est oun peu sombre.\nMa il n'est pas n-noir.\n@c0@"
  it: "@aSancho@bSì, claro.\nLa soddisfazione de los visitatores es la cosa más importante de todas...\n@c0@"
  ja: "@a@bサンチョ「なにはともあれ\n\t博物館としては　成功という\n\tことでしょう。\n@c0@"
306:
  de: "@aOtto@bManchmal ist mir, als hätten wir mit dieser G'schichte schon vor Ewigkeiten begonnen, und manchmal ist mir, als wär's gestern g'wesen. Seltsam.\n@c0@"
  en: "@aTuppence@bIt sometimes feels so long since we embarked on all this, and yet sometimes it feels like only yesterday. It's very odd.\n@c0@"
  es: "@aAlazar@bA veces parece que ha pasado tanto tiempo desde que nos metimos en esto, y otras veces parece que fue ayer. Es muy raro.\n@c0@"
  fr: "@aInnocent@bJ'ai parfois l'impression qu'il y a très longtemps que nous nous sommes embarqués là-dedans et parfois que ça date seulement d'hier. C'est très bizarre.\n@c0@"
  it: "@aSimon@bMi sembra ieri che abbiamo iniziato a lavorare per il Museo del Souvenir, e invece sappiamo bene quanto tempo abbiamo impiegato per farlo decollare...\n@c0@"
  ja: "@a@bピピン「ここまで　長かったような\n\t短かったような……。\n\tふしぎな感じです。\n@c0@"
307:
  de: "@aBianca@bEr hat die Katastrophäe erkannt! Er kennt sich wirklich gut aus, der alte Firle Franz.\n@c0@"
  en: "@aBianca@bHe recognised the Catas Trophy! He certainly knows his stuff, does Old Man Nick Knack.\n@c0@"
  es: "@aBianca@b¡Ha reconocido el Catastrofeo! Este abuelo Nino es todo un experto, sí señor.\n@c0@"
  fr: "@aBianca@bIl a reconnu le Catas Trophéeⓠ On peut dire qu'il connaît son affaire, le vieux Bricabrac.\n@c0@"
  it: "@aBianca@bHa persino riconosciuto il Catas Trofeo!\nAvrà anche un carattere orribile, ma bisogna riconoscere che Geremia è un vero intenditore!\n@c0@"
  ja: "@a@bビアンカ「でも　闇のトロフィーを\n\t知ってるなんて…　やっぱり\n\tあのおじいさんって　すごいのかもね。\n@c0@"
308:
  de: "@aNera@bHe he he! Meinst du, er wird wirklich aufhören zu meckern?\n@c0@"
  en: "@aNera@bHe he he! Do you think he'll really be able to stop himself from grumbling?\n@c0@"
  es: "@aNera@b¡Ji, ji, ji! ¿Crees que podrá dejar de enfadarse algún giorno?\n@c0@"
  fr: "@aNera@bHi hi hiⓠ Tu crois qu'il sera un jour capable d'arrêter de pesterⓡ\n@c0@"
  it: "@aNera@bAh ah ah!\nDa come ne parla, sembra che a Geremia avrebbe fatto piacere vincerlo lui, il Catas Trofeo!\n@c0@"
  ja: "@a@bフローラ「うふふ。\n\tおじいさん　本当に\n\t文句言わないつもりなのかしら。\n@c0@"
309:
  de: "@a%0%a001240@bWenn er nicht mehr meckern würde, dann wäre er nicht mehr der alte Firle Franz. Da würde mir direkt was fehlen.\n@c0@"
  en: "@a%0%a001240@bIf he stopped grumbling, then he wouldn't be like Old Man Nick Knack any more. That'd be a bit sad.\n@c0@"
  es: "@a%0%a001240@bSi dejase de enfadarse, no sería el abuelo Nino. Es una pena.\n@c0@"
  fr: "@a%0%a001240@bS'il arrêtait de ronchonner, ça ne serait plus\nle vieux Bricabrac. Ce serait un peu triste.\n@c0@"
  it: "@a%0%a001240@bChissà da quanti anni Geremia tiene un diario...\nSe ha iniziato da giovane, con tutti gli anni che ha, deve aver usato una montagna di carta!\n@c0@"
  ja: "@a@b%a001240「文句言わないって　いつもの\n\tおじいさんじゃ　なくなるのかな？\n\t……それはそれで　さみしいね。\n@c0@"
310:
  de: "@a%0%a001250@bDer alte Firle Franz wirkt ganz überrascht. Die Katastrophäe ist sicher sehr wertvoll.\n@c0@"
  en: "@a%0%a001250@bOld Man Nick Knack seems really surprised.\nThe Catas Trophy must be really valuable.\n@c0@"
  es: "@a%0%a001250@bEl abuelo Nino parece muy sorprendido.\nEl Catastrofeo debe de ser muy valioso.\n@c0@"
  fr: "@a%0%a001250@bLe vieux Bricabrac a l'air très surpris.\nLe Catas Trophée doit vraiment avoir\nbeaucoup de valeur.\n@c0@"
  it: "@a%0%a001250@bGeremia non si aspettava che gli portassimo il Catas Trofeo...\nDeve trattarsi di un oggetto veramente raro.\n@c0@"
  ja: "@a@b%a001250「おじいさんが　おどろいてる。\n\tあれって　やっぱり　貴重な物なのね。\n@c0@"
311:
  de: "@aSancho@bIss konnte es auch nisst glauben, als du die Katastrophäe gefunden hast, Chico. Du bist jetzt stark und macho, Meine Majestät.\n@c0@"
  en: "@aSancho@bI no believe eet too, when you get thees Catas Trophy, friend. You are estrong and macho now,\r\nMy Majesty.\n@c0@"
  es: "@aSancho@bPues yo ni me lo creía tampoco cuando conseguiste el Catastrofeo. Eres bien macho y bien fuerte, chamaco.\n@c0@"
  fr: "@aSancho@bMoi non plus, je n'y ai p-p-pas cru, quand tu as obtenu le Catas Trophée, chico. Tu es vraiment\r\nf-f-fort, maintenant, Ma Majesté.\n@c0@"
  it: "@aSancho@b¡Ma que modo orribile de esprimerse!\nA ti no te gusta ⓕmenare le maniⓖ, chico...\n¡Tu sei un guerrero de primero ordine!\n@c0@"
  ja: "@a@bサンチョ「私も　闇のトロフィーに関しては\n\t本当に　おどろいていますよ。\n\t%a000090王も　強くなりましたねえ。\n@c0@"
312:
  de: "@aOtto@bSicher würd' es kein anderer schaffen, so etwas für die Ausstellung zu finden, %a000090.\n@c0@"
  en: "@aTuppence@bI doubt anyone other than you would be able to get hold of something like that to display, %a000090.\n@c0@"
  es: "@aAlazar@bDudo que ninguna otra persona hubiera logrado algo así para el museo, %a000090.\n@c0@"
  fr: "@aInnocent@bÀ part vous, je crois que personne n'aurait pu mettre la main sur une pièce pareille, %a000090.\n@c0@"
  it: "@aSimon@bMaestà, se non fosse stato per lei, il Museo del Souvenir non avrebbe mai potuto esporre un oggetto tanto raro come il Catas Trofeo!\n@c0@"
  ja: "@a@bピピン「%a000090王　以外に\n\t持ってこられる人なんて\n\tいないんじゃ　ないですか？\n@c0@"
313:
  de: "@aBianca@bJa, ich glaube, unser Museum kann sich in Museumskreisen inzwischen sehen lassen!\n@c0@"
  en: "@aBianca@bYep, I reckon our museum could hold its head up high in the museum world now!\n@c0@"
  es: "@aBianca@bSí, creo que nuestro museo puede codearse con los mejores, ¿sabes?\n@c0@"
  fr: "@aBianca@bOui, je suis sûre que notre établissement tient bien son rang dans le monde des musées, maintenantⓠ\n@c0@"
  it: "@aBianca@bCe l'abbiamo fatta!\nIl Museo del Souvenir è ormai rinomato in tutto il mondo!\n@c0@"
  ja: "@a@bビアンカ「もう誰が見ても\n\tおかしくない　博物館に\n\tなったってことよね。\n@c0@"
314:
  de: "@aNera@bEs ist schön zu hören, dass der alte Mann mit uns so zufrieden ist. Das Museum ist inzwischen ein echter Erfolg.\n@c0@"
  en: "@aNera@bIt's nice to hear the old man so happy with us.\r\nThe museum really is a success now.\n@c0@"
  es: "@aNera@bMe alegra molto oír al nono tan contento con nosotros.\r\nEl museo es todo un éxito.\n@c0@"
  fr: "@aNera@bC'est agréable d'entendre que le vieil homme\r\nest si content de nous. Le musée est un vrai\r\nsuccès, maintenant.\n@c0@"
  it: "@aNera@bSono contenta che Geremia abbia realizzato il suo sogno.\nÈ bello vederlo finalmente felice...\n@c0@"
  ja: "@a@bフローラ「おじいさんに\n\tよろこんで　いただけたようですね。\n\tこれで　正真正銘の博物館ですわ。\n@c0@"
315:
  de: "@a%0%a001240@bAch ja. Ich hatte ja ganz vergessen, dass der alte Firle Franz ein Geist ist.\n@c0@"
  en: "@a%0%a001240@bOh yeah. I'd kind of forgotten that Old Man Nick Knack was a ghost.\n@c0@"
  es: "@a%0%a001240@b¡Ah!, sí. Casi se me había olvidado que el abuelo Nino es un fantasma.\n@c0@"
  fr: "@a%0%a001240@bOh, mais oui. J'avais presque oublié que le vieux Bricabrac était un fantôme.\n@c0@"
  it: "@a%0%a001240@bⓕNon piangevo tanto dal giorno del mio centocinquantesimo compleannoⓖ?!\nMa quanti anni ha Geremia?! Anzi, quanti secoli ha?!\n@c0@"
  ja: "@a@b%a001240「そういえば　おじいさんって\n\tゆうれいだったんだっけ。\n@c0@"
316:
  de: "@a%0%a001250@bWenn ich höre, dass der alte Firle Franz so zufrieden mit uns ist, könnte ich glatt vergessen, wie viel Arbeit wir in das Museum gesteckt haben.\n@c0@"
  en: "@a%0%a001250@bHearing Old Man Nick Knack so happy with us is enough to make me forget about all the hard work we put in.\n@c0@"
  es: "@a%0%a001250@bVer que el abuelo Nino habla así de bien de nosotros me hace olvidar todas las penurias que hemos tenido que pasar hasta lograrlo.\n@c0@"
  fr: "@a%0%a001250@bSavoir que le vieux Bricabrac est si content de nous suffit à me faire oublier tout le travail que ça nous a demandé.\n@c0@"
  it: "@a%0%a001250@bPoverino, si è commosso... Ho sempre immaginato che dietro la sua aria burbera si nascondesse un sognatore sensibile e gentile...\n@c0@"
  ja: "@a@b%a001250「こんなに　よろこんでもらえたら\n\t苦労したことも　忘れちゃうね。\n@c0@"
317:
  de: "@aSancho@bSí. Du hast so gute Arbeit geleistet, Chico. Du hast so viel schönen Krimskrams gesammelt.\n@c0@"
  en: "@aSancho@bSí. You do esuch a good job, friend.\nYou collect eso many knick-knacks.\n@c0@"
  es: "@aSancho@b¡Ándale! Hiciste un trabajo retepadre.\r\nConseguiste tantas cosinas.\n@c0@"
  fr: "@aSancho@bSi, tu as f-f-fait oun très bon travail, chico.\r\nTu as rassemblé p-p-plein d'objets différents.\n@c0@"
  it: "@aSancho@bHo perso el conto de quantos souvenir abbiamo raccoltos por el Museo...\n¡Beh, almeno ahora el señor Geremia es feliz!\n@c0@"
  ja: "@a@bサンチョ「あれだけの名産品を\n\t集めなさった　%a000090王は\n\tすごいです！\n@c0@"
318:
  de: "@aOtto@bSo gerührt war er nicht mehr seit dem Tag, an dem es ihn dahingerafft hat? Also, das ist ein Satz, den man sich mal auf der Zunge zergehen lassen muss!\n@c0@"
  en: "@aTuppence@bHe's not been so moved since the day he died?\r\nNow there's a sentence you don't read every day!\n@c0@"
  es: "@aAlazar@b¿El corazón en la mano, muerto y palpitando?\r\nEso no se lee todos los días.\n@c0@"
  fr: "@aInnocent@bIl n'a jamais été aussi ému depuis le jour de sa mortⓡ C'est le genre de phrase qu'on n'entend\npas tous les joursⓠ\n@c0@"
  it: "@aSimon@bCentocinquantesimo compleanno?! Devono avergli preparato una torta grande quanto tutto il Museo, per metterci sopra tutte quelle candeline!\n@c0@"
  ja: "@a@bピピン「死んでからも　初めてって……\n\t何気に　こわいことが\n\t書いてありますね。\n@c0@"
319:
  de: "@aBianca@bWenn man dem alten Mann glauben will, kann Kati Krams nichts falsch machen, nicht? \n@c0@"
  en: "@aBianca@bSue Veneer can never do anythin' wrong in the old man's eyes, eh?\n@c0@"
  es: "@aBianca@bNada de lo que haga Nuray Niada le parecerá mal al abuelete, ¿eh?\n@c0@"
  fr: "@aBianca@bMarie-Jo Konde ne fera jamais rien de travers,\naux yeux du vieil homme, heinⓡ\n@c0@"
  it: "@aBianca@bScommetto che mi verranno i capelli bianchi prima che Geremia trovi un difetto a Sue Venir!\nEh eh eh!\n@c0@"
  ja: "@a@bビアンカ「おじいさんにとっては\n\tミミちゃんは　何をしても\n\tかわいいのね。\n@c0@"
320:
  de: "@aNera@bIch glaube, mir wäre an ihrer Stelle sehr unbehaglich, wenn ich mitten in der Nacht in einem Museum mit einem gespensterhaften alten Mann reden müsste!\n@c0@"
  en: "@aNera@bI think I would've been rather afraid if I were her, chatting away to a ghostly old man in a museum in the dead of night!\n@c0@"
  es: "@aNera@bCredo que si fuera ella estaría bastante asustada, charlando con el fantasma de un vecchio en un museo tutta la notte.\n@c0@"
  fr: "@aNera@bJe crois que j'aurais plutôt peur, à sa place, à l'idée de discuter avec un vieil homme fantomatique dans un musée, au beau milieu de la nuitⓠ\n@c0@"
  it: "@aNera@bCredo che a Sue non dispiacciano le attenzioni di Geremia. Forse è sensibile al fascino della vecchiaia... Ops! Volevo dire ⓕdella maturitàⓖ...\n@c0@"
  ja: "@a@bフローラ「ゆうれいの　おじいさんと\n\t夜の博物館で　お話なんて\n\t私だったらちょっと……。\n@c0@"
321:
  de: "@a%0%a001240@bWer am Empfang ist, muss immer ein offenes Ohr für alle haben. Das gehört zur Arbeit.\n@c0@"
  en: "@a%0%a001240@bReceptionists have to be good talkers.\nIt goes with the job.\n@c0@"
  es: "@a%0%a001240@bLas recepcionistas deben tener mucha conversación.\nGajes del oficio.\n@c0@"
  fr: "@a%0%a001240@bLes personnes chargées de l'accueil doivent savoir faire la conversation. Ça fait partie du travail.\n@c0@"
  it: "@a%0%a001240@bMa Geremia è il trisnonno di Sue Venir?\n@c0@"
  ja: "@a@b%a001240「受付の人は　お話も\n\t上手じゃなきゃいけないんだね。\n@c0@"
322:
  de: "@a%0%a001250@bDer alte Firle Franz kann Kati Krams wirklich gut leiden, nicht?\n@c0@"
  en: "@a%0%a001250@bOld Man Nick Knack really does like Sue Veneer, doesn't he?\n@c0@"
  es: "@a%0%a001250@bEl abuelo Nino adora a Nuray Niada, ¿verdad?\n@c0@"
  fr: "@a%0%a001250@bLe vieux Bricabrac aime vraiment beaucoup\nMarie-Jo Konde, n'est-ce pasⓡ\n@c0@"
  it: "@a%0%a001250@bGeremia è follemente innamorato di Sue.\nLa cosa è talmente palese che anche i souvenir esposti al Museo se ne saranno accorti!\n@c0@"
  ja: "@a@b%a001250「おじいさんは　よっぽど\n\tお姉さんのことが　好きみたい。\n@c0@"
323:
  de: "@aSancho@bDiese junge Señorita, sie sprisst gern. Sie ist nisst dumm, no?\n@c0@"
  en: "@aSancho@bThees young señorita, eshe likes to espeak. Eshe ees no estupid, eh?\n@c0@"
  es: "@aSancho@bA la señorita le encanta platicar. Pues no es menza, ¿verdad?\n@c0@"
  fr: "@aSancho@bCette jeune s-señorita, elle aime p-p-parler.\nElle n'est pas b-bête, heinⓡ\n@c0@"
  it: "@aSancho@bAnche a mi me gustaria scambiare quattro chiacchieres con la señorita Sue ma, si ce provassi, el señor Geremia me inseguirebbe con el forcon...\n@c0@"
  ja: "@a@bサンチョ「ミミさんも　世話上手な\n\t方のようですね。\n@c0@"
324:
  de: "@aOtto@bDann kann man also gut mit ihr reden? Wie angenehm!\n@c0@"
  en: "@aTuppence@bSo she's a good talker, is she? How delightful!\n@c0@"
  es: "@aAlazar@b¿Así que tiene conversación? ¡Qué encanto!\n@c0@"
  fr: "@aInnocent@bEt en plus, elle sait tenir une conversationⓡ\nComme c'est charmantⓠ\n@c0@"
  it: "@aSimon@bMa perché Sue perde tempo con quel vecchiaccio quando potrebbe avere me? Io sono bello, giovane e... modesto. La facevo più intelligente, la ragazza.\n@c0@"
  ja: "@a@bピピン「お話の上手な女性ですか……\n\tステキです……。\n@c0@"
325:
  de: "@aBianca@bDas kann man ihm wohl kaum verdenken. Ich meine, es ist immer noch ziemlich leer hier.\n@c0@"
  en: "@aBianca@bI s'pose you can't blame him for thinkin' that.\r\nI mean, the place is still pretty empty.\n@c0@"
  es: "@aBianca@bSupongo que no se le puede echar en cara pensar eso, ¿sabes?\n㈡\nBueno, es que este sitio todavía está bastante vacío.\n@c0@"
  fr: "@aBianca@bOn peut difficilement lui reprocher de penser ça. C'est vrai, cet endroit est encore bien vide.\n@c0@"
  it: "@aBianca@bQuel tipo non ha tutti i torti, però credo che il Museo avrà un'aria più rassicurante, quando sarà pieno di oggetti.\n@c0@"
  ja: "@a@bビアンカ「そう思われても　しかたないわ。\n\tだって　まだ　ほとんど\n\t準備中に近いんだもの。\n@c0@"
326:
  de: "@aNera@bWie schade. Er findet es hier unheimlich. Hoffentlich haben wir es bald ein wenig netter hier.\n@c0@"
  en: "@aNera@bIt's a shame he thinks the place feels a bit creepy. Hopefully we'll have it looking nicer before long.\n@c0@"
  es: "@aNera@bEs una pena que piense que este lugar pone los capelli de punta. Con un po' de suerte tendrá mejor aspecto pronto.\n@c0@"
  fr: "@aNera@bC'est dommage qu'il trouve que l'endroit fasse peur. Espérons que nous réussirons rapidement à l'embellir.\n@c0@"
  it: "@aNera@bI brividi?!\nSanto cielo! Forse dovremmo accendere l'impianto di riscaldamento? Non credevo facesse tanto freddo...\n@c0@"
  ja: "@a@bフローラ「さびしい感じが　あるからこそ\n\tこの博物館が引き立つ…　とは　やはり\n\t思っていただけないでしょうか。\n@c0@"
327:
  de: "@a%0%a001240@bEin Besucher! Ob das wohl dem alten Firle Franz zu verdanken ist, der die Neuigkeit verbreitet hat?\n@c0@"
  en: "@a%0%a001240@bA customer! I wonder if that's thanks to Old Man Nick Knack spreading the news.\n@c0@"
  es: "@a%0%a001240@b¡Un visitante! Me pregunto si será porque el abuelo Nino ha hecho correr la voz.\n@c0@"
  fr: "@a%0%a001240@bUn visiteurⓠ Je me demande si c'est parce que le vieux Bricabrac a fait circuler l'information.\n@c0@"
  it: "@a%0%a001240@bSbaglio o stanno arrivando i primi visitatori?\nMa dopo i visitaTORI verranno anche i visitaMUCCHE? Eh eh eh!\n@c0@"
  ja: "@a@b%a001240「お客さんが来たよ。\n\tおじいさんが　ウワサを流してくれた\n\tおかげかな？\n@c0@"
328:
  de: "@a%0%a001250@bEs mag ein wenig unheimlich sein, aber es ist doch wunderschön gelegen, so mitten im Wald.\n@c0@"
  en: "@a%0%a001250@bIt might be a little bit creepy, but it's in a lovely spot, surrounded by the forest like it is.\n@c0@"
  es: "@a%0%a001250@bPues igual pone los pelos de punta, pero es un lugar encantador rodeado por un bosque y todo.\n@c0@"
  fr: "@a%0%a001250@bIl fait peut-être un peu peur, mais ce musée est situé dans un très bel endroit, au milieu de la forêt.\n@c0@"
  it: "@a%0%a001250@bMagari questo posto farà anche venire i brividi, ma non credo che al mondo esista un altro museo immerso nel verde di una foresta incontaminata!\n@c0@"
  ja: "@a@b%a001250「さびしい所かも　しれないけど\n\t森につつまれて　この建物は\n\tうれしそうよ。\n@c0@"
329:
  de: "@aSancho@bDas ist ein Besucher! Du musst nett zu ihm sein, Chico, ja?\n@c0@"
  en: "@aSancho@bEes a customer! You must be nice to\r\nheem, okay?\n@c0@"
  es: "@aSancho@b¡Un visitante! Pues tiene que ser amable con él ¿ok?\n@c0@"
  fr: "@aSancho@bC'est oun visiteurⓠ Il faut être g-g-gentil avec lui, de acuerdoⓡ\n@c0@"
  it: "@aSancho@b¡Me raccomando!\n¡Maxima gentilezza con los clientes!\n@c0@"
  ja: "@a@bサンチョ「おや　お客さんですよ！\n\t丁重におもてなし　しませんと。\n@c0@"
330:
  de: "@aOtto@bIch hoff', er kriegt keinen Schreck, wenn er den alten Mann sieht!\n@c0@"
  en: "@aTuppence@bI hope he doesn't see the old man and get a fright!\n@c0@"
  es: "@aAlazar@bEspero que no vea al abuelo y se lleve un susto.\n@c0@"
  fr: "@aInnocent@bJ'espère qu'il ne verra pas le vieil homme,\nil risquerait d'avoir la frousseⓠ\n@c0@"
  it: "@aSimon@bSe al tipo sono venuti i brividi nel vedere il Museo, quando si troverà davanti quella mummia ambulante di Geremia gli prenderà come minimo una sincope!\n@c0@"
  ja: "@a@bピピン「あの人　おじいさんを見て\n\tビックリしなければ　いいんですが……。\n@c0@"
331:
  de: "@aBianca@bDas Gebäude an sich ist schon eine gute Reklame für das Museum, wenn die Leute so unverhofft darauf stoßen.\n@c0@"
  en: "@aBianca@bThis building in itself is a good advert for the museum if people are just stumblin' across it like that.\n@c0@"
  es: "@aBianca@bEl edificio en sí debe de ser un buen anuncio para el museo si la gente se lo está encontrando así, de casualidad, ¿sabes?\n@c0@"
  fr: "@aBianca@bC'est vrai que le bâtiment en lui-même est une bonne vitrine pour le musée, si les gens tombent dessus comme ça, par hasard.\n@c0@"
  it: "@aBianca@bIn effetti, nessun museo può chiamarsi tale se all'interno non c'è nulla da ammirare!\n@c0@"
  ja: "@a@bビアンカ「この建物自体が　博物館の\n\tいい宣伝に　なってるみたいね。\n@c0@"
332:
  de: "@aNera@bIch glaube nicht, dass die Leute hier herkommen, weil sie schon einmal von dem Bau gehört haben. Jedenfalls noch nicht.\n@c0@"
  en: "@aNera@bI don't think people are coming because they've heard of the place. Not yet, anyway.\n@c0@"
  es: "@aNera@bNon credo que la gente esté viniendo porque hayan oído hablar de este lugar. Aún no, en cualquier caso.\n@c0@"
  fr: "@aNera@bJe ne crois pas que les gens viennent ici\r\nparce qu'ils ont entendu parler du musée.\r\nPas encore, en tout cas.\n@c0@"
  it: "@aNera@bAl Museo stanno arrivando i primi visitatori. Chissà se sono venuti di proposito o se passavano di qua e hanno deciso di dare un'occhiata...\n@c0@"
  ja: "@a@bフローラ「まだ　ここを博物館だと知って\n\t来る方は　少ないようですね。\n@c0@"
333:
  de: "@a%0%a001240@bLos, wir sammeln jede Menge tolle Andenken und machen diese Bude zum besten Museum aller Zeiten!\n@c0@"
  en: "@a%0%a001240@bLet's collect up lots of cool souvenirs and make this place into the best museum ever!\n@c0@"
  es: "@a%0%a001240@bVamos a conseguir montones de cosinas geniales y a hacer de este lugar el mejor sitio del mundo mundial.\n@c0@"
  fr: "@a%0%a001240@bRassemblons plein d'objets de collection pour faire\nde cet endroit le plus beau de tous les muséesⓠ\n@c0@"
  it: "@a%0%a001240@bSe porteremo al Museo un mucchio di souvenir, saremo sommersi da una marea di visitatori!\n@c0@"
  ja: "@a@b%a001240「博物館に　負けないぐらいの\n\t名産品を集めようよ！\n@c0@"
334:
  de: "@a%0%a001250@bEs ist sehr eindrucksvoll, aber noch weiß niemand, dass sich hier auch ein Museum befindet.\n@c0@"
  en: "@a%0%a001250@bIt is very grand, but no one really knows about there being a museum here yet.\n@c0@"
  es: "@a%0%a001250@bEs bastante aparente, pero la gente aún no sabe que aquí hay un museo.\n@c0@"
  fr: "@a%0%a001250@bC'est impressionnant, mais personne ne sait encore qu'il s'agit d'un musée, en fait.\n@c0@"
  it: "@a%0%a001250@bSono ancora poche le persone che sanno dell'esistenza di questo posto. Credo che Geremia dovrebbe iniziare a fare pubblicità al suo Museo...\n@c0@"
  ja: "@a@b%a001250「ここは　そういう場所なんだけど\n\tまだ博物館だって　わからないのね。\n@c0@"
335:
  de: "@aSancho@bEs ist nisst resst, dass dieser Señor nur hier ist, um das Gebäude zu besisstigen und nisst die Ausstellung!\n@c0@"
  en: "@aSancho@bEes no right that thees señor, he has come here to esee the building and no the exhibits.\n@c0@"
  es: "@aSancho@bPues no me parece bien. Este señor vino para ver el edificio y no la exposición.\n@c0@"
  fr: "@aSancho@bÇa n'est p-p-pas bien que ce señor soit venu ici pour admirer le b-b-bâtiment, et pas l'exposition.\n@c0@"
  it: "@aSancho@bEsto edificio da solo attira gente.\n¡Figuriamoci quantos visitatores accorreranno quando ce saranno muchos souvenir en esposiziones!\n@c0@"
  ja: "@a@bサンチョ「まだ　展示品ではなく\n\t建物を見に来ていただいているようで\n\tちょっと　申しわけないですね。\n@c0@"
336:
  de: "@aOtto@bEs ist wohl recht überraschend, mitten im Wald auf ein solches Gebäude zu stoßen.\n@c0@"
  en: "@aTuppence@bI suppose it is a surprisingly grand building to find in the middle of a forest like this.\n@c0@"
  es: "@aAlazar@bSupongo que no es el tipo de edificio que uno se espera encontrar en mitad de un bosque.\n@c0@"
  fr: "@aInnocent@bJe suppose que l'on ne s'attend pas à trouver un aussi grand bâtiment au beau milieu d'une forêt.\n@c0@"
  it: "@aSimon@bNessuno si aspetterebbe di trovare un palazzo tanto maestoso nel cuore di una foresta.\r\nFa davvero un gran bell'effetto, eh?\n@c0@"
  ja: "@a@bピピン「森の中だと　建物が\n\tよりいっそう　りっぱに見えるんですね。\n@c0@"
337:
  de: "@aBianca@bOb er von weit her kommt? Hoffentlich beeindrucken wir die Leute bald genauso sehr mit unseren Ausstellungsstücken wie mit dem Gebäude.\n@c0@"
  en: "@aBianca@bI wonder if he came from a long way away. Hopefully it won't be long before we dazzle folk with our exhibits as well as just the buildin' itself.\n@c0@"
  es: "@aBianca@bMe pregunto si habrá venido desde muy lejos, ¿sabes?\n㈡\nCon un poco de suerte dentro de poco impresionaremos a la gente con la exposición además de con el edificio.\n@c0@"
  fr: "@aBianca@bJe me demande s'il vient de loin. Espérons que nous arriverons bientôt à éblouir les gens avec notre collection, et pas juste avec le bâtiment.\n@c0@"
  it: "@aBianca@bSpero che presto i visitatori del Museo resteranno colpiti dai souvenir esposti almeno tanto quanto lo sono dall'edificio...\n@c0@"
  ja: "@a@bビアンカ「遠くから　来てくれたのかな？\n\tそのうち　展示品にも\n\tおどろいてもらえるようにしたいわね。\n@c0@"
338:
  de: "@aNera@bMeinst du, der Mann ist extra deswegen hierher gekommen, weil er von dem Museum gehört hat?\n@c0@"
  en: "@aNera@bDo you think that man came here especially because he heard about the museum?\n@c0@"
  es: "@aNera@b¿Crees que ese uomo vino aquí a propio intento porque oyó hablar del museo?\n@c0@"
  fr: "@aNera@bTu crois que cet homme est venu jusqu'ici spécialement parce qu'il avait entendu\nparler du muséeⓡ\n@c0@"
  it: "@aNera@bQuel tipo non sembra di queste parti. Chissà se è venuto qui appositamente per il Museo o se era già in zona ed è passato a vedere di cosa si tratta...\n@c0@"
  ja: "@a@bフローラ「あの方は　ここを\n\t博物館だと　知って　\n\t来てくださったのでしょうか？\n@c0@"
339:
  de: "@a%0%a001240@bJeder, der zum ersten Mal hierher kommt, scheint von dem Gebäude total beeindruckt zu sein.\n@c0@"
  en: "@a%0%a001240@bEveryone who comes here for the first time seems really impressed by the building.\n@c0@"
  es: "@a%0%a001240@bTodos los que vienen por primera vez se quedan muy impresionados con el edificio.\n@c0@"
  fr: "@a%0%a001240@bTous ceux qui viennent ici pour la première fois sont vraiment très impressionnés par le bâtiment.\n@c0@"
  it: "@a%0%a001240@bTutti coloro che vengono qui per la prima volta restano affascinati dall'edificio.\nIn effetti, è una costruzione davvero singolare...\n@c0@"
  ja: "@a@b%a001240「初めて　ここに来る人は\n\tやっぱり建物を見て　ビックリするね。\n@c0@"
340:
  de: "@a%0%a001250@bHoffentlich beeindrucken wir die Leute bald noch mehr mit unseren Ausstellungen.\n@c0@"
  en: "@a%0%a001250@bHopefully we'll impress people even more with our displays before long.\n@c0@"
  es: "@a%0%a001250@bCon un poco de suerte, también impresionaremos a la gente con nuestra colección dentro de poco.\n@c0@"
  fr: "@a%0%a001250@bEspérons que bientôt, nous impressionnerons encore plus les gens avec notre exposition.\n@c0@"
  it: "@a%0%a001250@bTra non molto i visitatori resteranno a bocca aperta di fronte agli oggetti che esporremo.\nNe sono sicura!\n@c0@"
  ja: "@a@b%a001250「中に展示してある\n\t名産品を見て　もっと\n\t感動してもらいたいな。\n@c0@"
341:
  de: "@aSancho@bDie Besucher kommen wirkliss schon in hellen Scharen, nisst?\n@c0@"
  en: "@aSancho@bThe clientes, they are coming fat and fast now, sí?\n@c0@"
  es: "@aSancho@bPues ya van viniendo visitantes poco a poco, ¿verdad?\n@c0@"
  fr: "@aSancho@bIl y a de plus en plus de v-visiteurs,\nmaintenant, noⓡ\n@c0@"
  it: "@aSancho@b¿Los visitatores cominciano ad arrivare, eh?\n¡Ay, que bueno!\n@c0@"
  ja: "@a@bサンチョ「じょじょに　お客さんの数も\n\tふえてきているようですよ。\n@c0@"
342:
  de: "@aOtto@bNach seinem Dialekt zu urteilen, würd' ich sagen, der hat einen weiten Weg zurückgelegt, um hierher zu gelangen.\n@c0@"
  en: "@aTuppence@bBy the sound of his accent, I'd say he's travelled a fair old way to get here.\n@c0@"
  es: "@aAlazar@bPor cómo hablaba, yo diría que ha viajado mucho para llegar hasta aquí.\n@c0@"
  fr: "@aInnocent@bÀ son accent, je dirais qu'il a fait un bon bout\r\nde chemin pour venir jusqu'ici.\n@c0@"
  it: "@aSimon@bNon sono riuscito a capire da dove venga, ma quell'uomo deve aver fatto un bel po' di strada per arrivare qui...\n@c0@"
  ja: "@a@bピピン「あの方は　遠くのほうから\n\t来てくださったようですね。\n\tしゃべり方で　なんとなく……。\n@c0@"
343:
  de: "@aBianca@bWir sollten noch mehr Sachen ausstellen, wenn wir die Besucher zufriedenstellen wollen, nicht?\n@c0@"
  en: "@aBianca@bWe should put even more things on display if we want to keep the customers happy, eh?\n@c0@"
  es: "@aBianca@bHay que exhibir más cosas si queremos tener contentos a nuestros visitantes, ¿me entiendes?\n@c0@"
  fr: "@aBianca@bOn devrait exposer encore plus de pièces si on veut que les visiteurs soient contents.\n@c0@"
  it: "@aBianca@bPiù souvenir esporremo nel Museo, più i visitatori saranno contenti e lo consiglieranno ai loro amici.\n@c0@"
  ja: "@a@bビアンカ「お客さんに　満ぞくして\n\tもらうためにも　もっと\n\t名産品を集めてこなくちゃ。\n@c0@"
344:
  de: "@aNera@bVielleicht sollten wir die Anzahl an Exponaten erhöhen, wenn wir das Interesse unserer Besucher aufrechterhalten wollen.\n@c0@"
  en: "@aNera@bI think we need to increase the number of exhibits if we want to keep our visitors interested.\n@c0@"
  es: "@aNera@bPenso que necesitamos aumentar la colección si queremos mantener el interés de nuestros visitantes.\n@c0@"
  fr: "@aNera@bJe crois que nous devrions augmenter le nombre\r\nde pièces exposées si nous voulons continuer à intéresser nos visiteurs.\n@c0@"
  it: "@aNera@bSe vogliamo rendere il Museo del Souvenir più interessante dobbiamo incrementare il numero di oggetti in esposizione.\n@c0@"
  ja: "@a@bフローラ「お客さんに\n\tよろこんで　いただくためには\n\tもっと名産品が　必要ですわね。\n@c0@"
345:
  de: "@a%0%a001240@bEs ist aber immer noch viel zu tun. Hoffentlich haben wir bald ein ganzes Museum voller Ausstellungsstücke!\n@c0@"
  en: "@a%0%a001240@bThere's still a long way to go, though. Hopefully we'll have the place full of exhibits before too long!\n@c0@"
  es: "@a%0%a001240@bAún nos queda mucho por hacer. Con un poco de suerte pronto tendremos una colección completa.\n@c0@"
  fr: "@a%0%a001240@bIl nous reste encore beaucoup à faire, pourtant. J'espère que cela ne prendra pas trop de temps avant que cet endroit soit rempli d'objetsⓠ\n@c0@"
  it: "@a%0%a001240@bSe vogliamo davvero arricchire la collezione del Museo, dobbiamo darci da fare!\nI piedistalli non si riempiono mica da soli, eh?!\n@c0@"
  ja: "@a@b%a001240「でも　まだまだ　だよね。\n\tはやく　この博物館を\n\t展示品で　いっぱいにしたいなあ。\n@c0@"
346:
  de: "@a%0%a001250@bFühlt sich so ein echtes Museum an? Ich war noch nie in einem, darum kann ich es nicht sagen.\n@c0@"
  en: "@a%0%a001250@bIs this what a real museum feels like? I've never been to one before, so I don't really know.\n@c0@"
  es: "@a%0%a001250@b¿Así es como es un museo de verdad? Nunca había estado en uno y no lo sé.\n@c0@"
  fr: "@a%0%a001250@bEst-ce que c'est ça, l'impression que donne un vrai muséeⓡ Je n'en avais encore jamais visité un, alors je ne sais pas vraiment.\n@c0@"
  it: "@a%0%a001250@bQuesto Museo attirerà turisti da tutto il mondo!\nSempre che riusciamo ad aggiungere alla collezione un bel po' di oggetti interessanti, ovvio...\n@c0@"
  ja: "@a@b%a001250「博物館って　こんな感じなの？\n\tわたし　ここしか　博物館\n\t知らないから　よくわからない……。\n@c0@"
347:
  de: "@aSancho@bDie Besucher kommen wirkliss schon in hellen Scharen, nisst?\n@c0@"
  en: "@aSancho@bThe clientes, they are coming fat and fast now, sí?\n@c0@"
  es: "@aSancho@bPues ya van viniendo visitantes poco a poco, ¿verdad?\n@c0@"
  fr: "@aSancho@bIl y a de plus en plus de v-visiteurs,\nmaintenant, noⓡ\n@c0@"
  it: "@aSancho@b¿Los visitatores cominciano ad arrivare, eh?\n¡Ay, que bueno!\n@c0@"
  ja: "@a@bサンチョ「じょじょに　お客さんの数も\n\tふえてきているようですよ。\n@c0@"
348:
  de: "@aOtto@bEs ist wohl recht überraschend, mitten im Wald auf ein solches Gebäude zu stoßen.\n@c0@"
  en: "@aTuppence@bI suppose it is a surprisingly grand building to find in the middle of a forest like this.\n@c0@"
  es: "@aAlazar@bSupongo que no es el tipo de edificio que uno se espera encontrar en mitad de un bosque.\n@c0@"
  fr: "@aInnocent@bJe suppose que l'on ne s'attend pas à trouver un aussi grand bâtiment au beau milieu d'une forêt.\n@c0@"
  it: "@aSimon@bNessuno si aspetterebbe di trovare un palazzo tanto maestoso nel cuore di una foresta.\r\nFa davvero un gran bell'effetto, eh?\n@c0@"
  ja: "@a@bピピン「森の中だと　建物が\n\tよりいっそう　りっぱに見えるんですね。\n@c0@"
349:
  de: "@aBianca@bIch bin nicht sicher, ob das heißt, dass er es mag oder nicht!\n@c0@"
  en: "@aBianca@bI'm not sure if that means he likes it or he dun't!\n@c0@"
  es: "@aBianca@bNo sé si eso significa que le gusta o que no, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe ne sais pas si ça veut dire que ça lui plaît\nou nonⓠ\n@c0@"
  it: "@aBianca@bD'accordo, ma a lui l'arte moderna piace o non piace?!\nNon l'ho mica capito!\n@c0@"
  ja: "@a@bビアンカ「いい意味で　言ってくれてるのか\n\t悪い意味　で言ってるのか\n\t判断が　むずかしいわ。\n@c0@"
350:
  de: "@aNera@bNun, wir scheinen ihn auf jeden Fall überrascht zu haben!\n@c0@"
  en: "@aNera@bWell, we certainly seem to have surprised him!\n@c0@"
  es: "@aNera@bBene, al menos lo hemos sorprendido.\n@c0@"
  fr: "@aNera@bEh bien, au moins, nous l'avons surpris, on diraitⓠ\n@c0@"
  it: "@aNera@bSpero che il suo sia un complimento e non una critica...\n@c0@"
  ja: "@a@bフローラ「あの方\n\tいろいろな意味で　おどろいて\n\tいらっしゃるようですわ。\n@c0@"
351:
  de: "@a%0%a001240@bWas meint er denn damit? Ist er jetzt zufrieden oder nicht?\n@c0@"
  en: "@a%0%a001240@bWhat does he mean by that? Is he happy or not?\n@c0@"
  es: "@a%0%a001240@b¿Qué ha querido decir? ¿Está satisfecho o no?\n@c0@"
  fr: "@a%0%a001240@bQu'est-ce qu'il veut dire par làⓡ\nÇa lui plaît ou pasⓡ\n@c0@"
  it: "@a%0%a001240@bCioè?\nChe vuol dire?\nL'esposizione gli è piaciuta oppure no?\n@c0@"
  ja: "@a@b%a001240「あの人　なんか\n\tふくざつな表情してたよ。\n@c0@"
352:
  de: "@a%0%a001250@bIch glaube, vielleicht meint der Mann, dass es kein echtes Museum ist.\n@c0@"
  en: "@a%0%a001250@bI think maybe that man thought the place wasn't like a proper museum.\n@c0@"
  es: "@a%0%a001250@bCreo que ese hombre pensaba que esto no parecía un museo.\n@c0@"
  fr: "@a%0%a001250@bJe crois que cet homme voulait dire que ça n'est pas comme dans un vrai musée.\n@c0@"
  it: "@a%0%a001250@bNon penso che sia rimasto particolarmente impressionato dal nostro Museo...\n@c0@"
  ja: "@a@b%a001250「あの人　博物館らしくないって\n\t思ったのかも……。\n@c0@"
353:
  de: "@aSancho@bDiese Ausstellung, iss glaube, sie wird jedem Besucher das gleisse Gefühl vermitteln.\n@c0@"
  en: "@aSancho@bThese displays, I theenk ees gonna make every cliente feel thees way.\n@c0@"
  es: "@aSancho@bPues con lo que tenemos expuesto, creo que todititos los visitantes se van a sentir igual.\n@c0@"
  fr: "@aSancho@bJe crois que ces objets v-v-vont donner la même impression à tous les clients.\n@c0@"
  it: "@aSancho@bEh, ancoras no ce siamo...\nUn vero museo deve offrire más variedad, si vuole impressionare los visitatores.\n@c0@"
  ja: "@a@bサンチョ「あの方でなくても\n\tこの展示の　しかただと\n\tおどろかれるでしょうね。\n@c0@"
354:
  de: "@aOtto@bDa legst dich nieder! Es ist ziemlich überwältigend, so viel von einer Sache ausg'stellt zu sehen.\n@c0@"
  en: "@aTuppence@bIt is rather overwhelming to see so many of the same thing on display.\n@c0@"
  es: "@aAlazar@bLa verdad es que apabulla ver tantas cosas iguales expuestas.\n@c0@"
  fr: "@aInnocent@bC'est vrai que c'est impressionnant de voir exposés autant d'exemplaires d'un même objet.\n@c0@"
  it: "@aSimon@bNon capita tutti i giorni di visitare un museo che espone lo stesso oggetto in ogni sala.\n㈡\nCome varietà siamo messi maluccio, ma l'originalità non ci manca di certo!\n@c0@"
  ja: "@a@bピピン「これだけ　同じ物が\n\tそろっているんです。\n\t迫力がありますよ。\n@c0@"
355:
  de: "@aBianca@bWenn ich all diese Dinge ausgestellt sehe, dann erinnert mich das an all die Orte, die wir schon besucht haben.\n@c0@"
  en: "@aBianca@bSeein' all these things on display reminds me of all the places we've visited.\n@c0@"
  es: "@aBianca@bVer todas esas cosas expuestas me recuerda a todos los sitios que hemos visitado, ¿sabes?\n@c0@"
  fr: "@aBianca@bVoir tous ces objets exposés me rappelle\r\ntous les endroits que nous avons visités.\n@c0@"
  it: "@aBianca@bVedere tutti questi souvenir mi fa tornare in mente i nostri viaggi.\nÈ una bella sensazione.\n@c0@"
  ja: "@a@bビアンカ「こうして　集めた名産品を\n\t見てると　いろんな場所を\n\t旅してきたのを思い出すね。\n@c0@"
356:
  de: "@aNera@bJedes dieser Dinge ist etwas Besonderes, weil diejenigen, die sie angefertigt haben, sich dabei so große Mühe gegeben haben.\n@c0@"
  en: "@aNera@bEvery one of the items we have here is special because of the effort the local people put into\r\nmaking them.\n@c0@"
  es: "@aNera@bTutti las piezas expuestas son valiosas por el esfuerzo de la gente que las hizo.\n@c0@"
  fr: "@aNera@bChacun de ces objets est spécial, car il représente\r\nle travail fourni par les artisans locaux pour le fabriquer.\n@c0@"
  it: "@aNera@bCiascuno degli oggetti esposti nel Museo esprime la creatività e le capacità tecniche di chi lo ha realizzato.\n@c0@"
  ja: "@a@bフローラ「名産品のひとつ　ひとつに\n\tその土地の　人たちの想いが\n\tこめられているように……\n@c0@"
357:
  de: "@aNera@bUnd sie alle erinnern mich an die verschiedenen Orte, die wir gemeinsam besucht haben, um sie zu sammeln.\n@c0@"
  en: "@aNera@bAnd they all remind me of the different places we went to together to collect them.\n@c0@"
  es: "@aNera@bY, veramente, me recuerdan los distintos lugares a los que hemos ido para conseguirlas.\n@c0@"
  fr: "@aNera@bEt tous me rappellent les divers endroits où nous sommes allés ensemble les chercher.\n@c0@"
  it: "@aNera@bInoltre, sono la dimostrazione tangibile della cultura e delle tradizioni tipiche dei paesi da cui provengono.\n@c0@"
  ja: "@a@bフローラ「私たちの　旅の思い出も\n\tつまっているんですよね。\n@c0@"
358:
  de: "@a%0%a001240@bIch wette, da draußen gibt's noch jede Menge Andenken an Orten, an denen ich noch nie gewesen bin.\n@c0@"
  en: "@a%0%a001240@bI bet there are still lots more souvenirs out there in places I haven't been to yet.\n@c0@"
  es: "@a%0%a001240@bSeguro que hay montones de souvenires más en sitios a los que todavía no he ido.\n@c0@"
  fr: "@a%0%a001240@bJe parie qu'il existe encore plein d'objets de collection dans des endroits où je ne suis pas encore allé.\n@c0@"
  it: "@a%0%a001240@bScommetto che al mondo ci sono ancora tanti souvenir che non abbiamo trovato.\n@c0@"
  ja: "@a@b%a001240「まだ　ボクが行ったことない\n\t場所の名産品も　たくさんあるね。\n@c0@"
359:
  de: "@a%0%a001240@bIrgendwann müssen wir uns einmal zusammen auf die Suche danach machen!\n@c0@"
  en: "@a%0%a001240@bWe'll have to go off hunting for them\ntogether sometime!\n@c0@"
  es: "@a%0%a001240@b¡Tendremos que ir a conseguirlos juntos algún día!\n@c0@"
  fr: "@a%0%a001240@bIl va falloir qu'on parte ensemble à leur recherche, un de ces quatreⓠ\n@c0@"
  it: "@a%0%a001240@bSpero che presto partiremo alla caccia di qualche altro oggetto interessante!\n@c0@"
  ja: "@a@b%a001240「今度いっしょに　つれてってよ。\n@c0@"
360:
  de: "@a%0%a001250@bWenn man so besondere Andenken wie diese anschaut, dann spürt man, welche Mühe sich die Leute bei ihrer Herstellung gegeben haben.\n@c0@"
  en: "@a%0%a001250@bWhen you look at special souvenirs like this, you can really feel the effort that went into making them.\n@c0@"
  es: "@a%0%a001250@bCuando contemplas cosinas especiales como estas, te das cuenta del trabajo que llevaron.\n@c0@"
  fr: "@a%0%a001250@bQuand on regarde ces objets particuliers, on sent réellement le travail qu'a demandé leur réalisation.\n@c0@"
  it: "@a%0%a001250@bQuesti manufatti non sono semplici oggetti, ma vere e proprie opere d'arte.\nSono assolutamente fantastici!\n@c0@"
  ja: "@a@b%a001250「名産品を　じっと見てるとね\n\tこめられた想いが　伝わってくるの。\n\tふしぎね……。\n@c0@"
361:
  de: "@aSancho@bBei den Souvenirs geht es nisst nur darum, wie viel man für sie gezahlt hat.\n@c0@"
  en: "@aSancho@bFor the esouvenirs, ees no just about how much you pay for them.\n@c0@"
  es: "@aSancho@bLo que importa de las cosinas no es lo que costaron.\n@c0@"
  fr: "@aSancho@bLa v-v-valeur de ces objets ne tient pas seulement au p-prix auquel on les a achetés.\n@c0@"
  it: "@aSancho@bCuando guardo estos souvenir no pienso al loro valore economico...\n@c0@"
  ja: "@a@bサンチョ「名産品というのは　高価であれば\n\tいいというものでは　ありません。\n@c0@"
362:
  de: "@aSancho@bEs geht auch um das Gefühl des Künstlers, das er in das Andenken steckt, wenn er es anfertigt. Das macht seinen eigentlissen Wert aus.\n@c0@"
  en: "@aSancho@bEes about the feeling the artisan, he puts eenside thees esouvenir when he ees making eet.\r\nEes from thees where comes the real value.\n@c0@"
  es: "@aSancho@bLo importante es ver el sentimiento que le puso el artesano para hacerlos.\r\nAhí es donde está el verdadero valor.\n@c0@"
  fr: "@aSancho@bElle tient aussi aux s-sentiments que celoui\r\nqui les a fabriqués a mis d-d-dedans. C'est là\r\nqu'est leur v-v-vraie valeur.\n@c0@"
  it: "@aSancho@bMe vengono en mente l'abilità dell'artigiano que l'ha realizzato y la sua capacità de mettere en un oggetto toda la cultura del proprio país.\n@c0@"
  ja: "@a@bサンチョ「作り手や　人々の気持ちが\n\tものの価値を　高めるのですよ。\n@c0@"
363:
  de: "@aOtto@bDa draußen gibt's alle möglichen Souvenirs, von ungemein praktischen bis zu ungeheuer albernen!\n@c0@"
  en: "@aTuppence@bThere are all kinds of souvenirs out there, from the useful to the utterly ridiculous!\n@c0@"
  es: "@aAlazar@bHay todo tipo de cosinas ahí fuera, desde las más útiles a las más ridículas.\n@c0@"
  fr: "@aInnocent@bIl y a vraiment toutes sortes d'objets à collectionner dans le monde, des plus utiles aux plus ridiculesⓠ\n@c0@"
  it: "@aSimon@bCi sono souvenir di ogni genere: ce ne sono di utili e di preziosi, di misteriosi e di ridicoli.\nIl Museo del Souvenir: di tutto, di più!\n@c0@"
  ja: "@a@bピピン「名産品って　実用的なものから\n\tそうでない物まで\n\tじつに　さまざまですよね。\n@c0@"
364:
  de: "@aBianca@bUnd wie der was auf dem Kasten hat! Wenn es einen auch ein bisschen verlegen macht, so gelobt zu werden, nicht?\n@c0@"
  en: "@aBianca@bHe certainly is quite a man! It's a bit embarrassin' bein' praised like that, though, eh?\n@c0@"
  es: "@aBianca@b¡Desde luego es todo un personaje! Aunque que te halaguen tanto, es un poco incómodo, ¿sabes?\n@c0@"
  fr: "@aBianca@bC'est quelqu'un, en effetⓠ Mais c'est un peu gênant d'être complimenté comme ça, nonⓡ\n@c0@"
  it: "@aBianca@bSanto cielo! E chi sarà mai questo ⓕmisteriosoⓖ direttore del Museo?! Eh eh eh!\nSperiamo che le lodi non gli diano alla testa!\n@c0@"
  ja: "@a@bビアンカ「すごいだって　%a000090。\n\tなんだか照れちゃうね。\n@c0@"
365:
  de: "@aNera@bEs ist wirklich sehr ermutigend zu hören, dass die Leute unsere ganze harte Arbeit zu schätzen wissen.\n@c0@"
  en: "@aNera@bIt really is very encouraging to hear people being so appreciative of all the hard work we've done here.\n@c0@"
  es: "@aNera@bEs veramente alentador escuchar que la gente aprecia tutto el trabajo que hemos hecho aquí.\n@c0@"
  fr: "@aNera@bC'est vraiment motivant d'entendre des gens qui apprécient autant le travail que nous avons fait ici.\n@c0@"
  it: "@aNera@bFa piacere vedere che la gente apprezza il duro lavoro che stiamo svolgendo per il Museo del Souvenir.\n@c0@"
  ja: "@a@bフローラ「努力をちゃんと\n\t認めてくださる方が　いらっしゃると\n\tはげみになりますわね。\n@c0@"
366:
  de: "@a%0%a001240@bJa, er hat recht. Es gibt nicht einmal mehr so viele Leute, die die Welt bereisen.\n@c0@"
  en: "@a%0%a001240@bYeah, he's right. There aren't even that many people just travelling the world now.\n@c0@"
  es: "@a%0%a001240@b¡Sí, tiene razón! Ya no hay tanta gente que se atreva a viajar por el mundo.\n@c0@"
  fr: "@a%0%a001240@bOuais, il a raison. Il n'y a d'ailleurs pas beaucoup de gens qui voyagent à travers le monde, en ce moment.\n@c0@"
  it: "@a%0%a001240@bCerto che abbiamo raccolto personalmente gli oggetti esposti qui!\nNon li abbiamo mica ordinati per posta!\n@c0@"
  ja: "@a@b%a001240「そうだよね。\n\t今　世界中を　まわれる人って\n\tそんなにいないもんね。\n@c0@"
367:
  de: "@a%0%a001250@bMeinst du, der alte Firle Franz hat ihm erzählt, dass du es warst, der all die ausgestellten Andenken gezeigt hat?\n@c0@"
  en: "@a%0%a001250@bDo you think Old Man Nick Knack told him that it's you who's been collecting up all the souvenirs to display?\n@c0@"
  es: "@a%0%a001250@b¿Crees que el abuelo Nino le habrá explicado que eras tú el que has estado consiguiendo todas las piezas de la exposición?\n@c0@"
  fr: "@a%0%a001250@bTu crois que c'est le vieux Bricabrac qui lui a dit\nque tu rassemblais en personne toutes les pièces exposéesⓡ\n@c0@"
  it: "@a%0%a001250@bCredo sia stato Geremia a rivelare che è stato il direttore stesso a trovare tutti gli oggetti esposti.\n㈡\nDeve aver pensato che è un buon modo per far parlare del Museo.\n@c0@"
  ja: "@a@b%a001250「お父さんが　名産品を\n\t集めてるって　おじいさんに\n\t聞いたのかな？\n@c0@"
368:
  de: "@aSancho@bDass sie so viel Respekt vor dir haben, Chico, das kommt daher, dass du all diese Ausstellungsstücke selbst zusammengetragen hast, nisst?\n@c0@"
  en: "@aSancho@bEes because you find them yourself that these exhibits, they have eso much meaning for you, sí, friend?\n@c0@"
  es: "@aSancho@bSerá porque tú las encontraste que estas cosinas significan tanto para ti, ¿verdad, chamaco?\n@c0@"
  fr: "@aSancho@bC'est parce que tu les as t-t-trouvés toi-même que tous ces objets ont oune si grande valeur pour toi, hein, chicoⓡ\n@c0@"
  it: "@aSancho@bGuardare todos estos souvenir me recuerda quanta fatica abbiamo fatto por entrarne en possessos...\n@c0@"
  ja: "@a@bサンチョ「自分の足で　探すからこそ\n\t意味があるのですよ。\n\tねえ　坊っちゃん？\n@c0@"
369:
  de: "@aOtto@bEs ist eine sehr große Verantwortung für jemanden, der König und Kurator zugleich ist.\n@c0@"
  en: "@aTuppence@bIt's quite a responsibility for people who are kings and curators and the like.\n@c0@"
  es: "@aAlazar@bEs una responsabilidad muy grande ser rey, gestor y esas cosas.\n@c0@"
  fr: "@aInnocent@bC'est une lourde responsabilité d'être roi, conservateur ou autre.\n@c0@"
  it: "@aSimon@bMi chiedo se sia più faticoso fare il re o il direttore di un museo... In ogni caso, sono entrambi lavori di grande responsabilità!\n@c0@"
  ja: "@a@bピピン「王様とか館長といった　\n\t責任のある立場の人は　大変ですよね。\n@c0@"
370:
  de: "@aBianca@bJe seltener die Ausstellungsstücke sind? Ich würde sagen, der Krempel, der hier oben gezeigt wird, ist viel seltener als das Zeug unten, oder?\n@c0@"
  en: "@aBianca@bThe rarer the exhibits? I reckon the stuff on\r\ndisplay up here's quite a bit rarer than what's downstairs, eh?\n@c0@"
  es: "@aBianca@b¿Cuánto más peculiares?\nSupongo que las cosas de aquí arriba son más peculiares que las de abajo, ¿sabes?\n@c0@"
  fr: "@aBianca@bPlus les pièces sont raresⓡ On peut dire que ce qui est exposé dans les étages est nettement plus rare que ce qu'il y a au rez-de-chaussée, nonⓡ\n@c0@"
  it: "@aBianca@bChe tipo originale, e che commento simpatico!\nDirei proprio che il Museo comincia a piacere.\n@c0@"
  ja: "@a@bビアンカ「名産レベル……。\n\tそういえば　上の階の台座は\n\t１階のより　ずいぶん　りっぱね。\n@c0@"
371:
  de: "@aNera@bIch finde, die alltäglichen Ausstellungsstücke haben einen ganz eigenen Charme. Sicher würden auch viele Besucher ihretwegen kommen.\n@c0@"
  en: "@aNera@bI think the more common exhibits are full of charm.\r\nI'm sure plenty of people would come to see them too.\n@c0@"
  es: "@aNera@bCreo que las piezas più comunes también rebosan encanto. Seguro que mucha gente también viene a verlas.\n@c0@"
  fr: "@aNera@bJe trouve que les objets les plus simples sont pleins de charme. Je suis certaine qu'il y a plein de gens qui viendront les voir aussi.\n@c0@"
  it: "@aNera@bConcordo in pieno.\nAnch'io penso che i souvenir rari attirino un maggior numero di visitatori.\n@c0@"
  ja: "@a@bフローラ「レベルがひくくても　いろんな\n\t土地の名産品が　ならんでいるだけで\n\t楽しそうに思いますけど……。\n@c0@"
372:
  de: "@a%0%a001240@bDieser Raum ist so faszinierend, dass die Leute bei seinem Anblick in Gesang ausbrechen! Den sollten wir uns besser für unsere besten Sachen aufsparen.\n@c0@"
  en: "@a%0%a001240@bThis room's so amazing it makes people want to sing! We'd better save it for our best exhibits.\n@c0@"
  es: "@a%0%a001240@b¡Esta sala es tan alucinante que a la gente le dan ganas de cantar! Es mejor reservarla para nuestras mejores exposiciones.\n@c0@"
  fr: "@a%0%a001240@bCette pièce est incroyable. Elle donne aux gens envie de chanterⓠ On a intérêt à la réserver à nos plus belles pièces.\n@c0@"
  it: "@a%0%a001240@bLa melodia e il testo non sono male, ma quel tizio è davvero stonato!\n@c0@"
  ja: "@a@b%a001240「この部屋は　りっぱだから\n\tやっぱり　すごいものを　かざらないと\n\tだめなのかなあ。\n@c0@"
373:
  de: "@a%0%a001250@bIch weiß nicht, was schöner ist: der Gesang dieses Mannes oder die Einrichtung hier. Ich mag hübsche Sachen. Lass uns hier hübsche Sachen ausstellen!\n@c0@"
  en: "@a%0%a001250@bI can't decide which is prettier: that man's singing voice or this room's decoration. I like pretty things. Let's put lots of pretty things on display!\n@c0@"
  es: "@a%0%a001250@bNo sé qué es más bello, si la voz de ese hombre o la decoración de la sala. Me gustan las cosas bonitas. ¡Expongamos muchas cosas bonitas!\n@c0@"
  fr: "@a%0%a001250@bJe n'arrive pas à choisir ce que je trouve le plus beauⓢ la voix de ce chanteur ou la décoration\nde cette pièce.\n㈡\nJ'aime bien les beaux objets.\nExposons plein de beaux objetsⓠ\n@c0@"
  it: "@a%0%a001250@bOh, che splendida voce!\nSi sposa alla perfezione con la mirabile bellezza di questa sala!\n@c0@"
  ja: "@a@b%a001250「わたしは　きれいな名産品を\n\tたくさん　かざりたいな。\n@c0@"
374:
  de: "@aSancho@bSí. Mansse Sachen, sie sind seltener als andere. Man muss seine Sachen sorgfältig anschauen, um zu wissen, ob sie gut sind oder nisst.\n@c0@"
  en: "@aSancho@bSí, sí. Esome items, they are more rare than the others. You must look at your item carefully to know eef ees a good one or no.\n@c0@"
  es: "@aSancho@b¡Órale! Pues este lugar está bien repletito de cosinas retepeculiares. Hay que mirarlas bien para saber cuáles son buenas.\n@c0@"
  fr: "@aSancho@bSi, si. Certains objets sont p-p-plus rares que d'autres. Tu dois examiner ton objet de p-p-près pour savoir s'il est bueno ou pas.\n@c0@"
  it: "@aSancho@bDevo recordarme de preparare un cartellon...\nⓕ¡Silencio por favor!ⓖ\n@c0@"
  ja: "@a@bサンチョ「ふむふむ。\n\t名産品にも　いろいろなレベルが\n\tあるということですな……。\n@c0@"
375:
  de: "@aSancho@bDein Onkel Sancho, er ist gut im Beurteilen von Andenken, weißt du.\n@c0@"
  en: "@aSancho@bYour Uncle Sancho, he ees good at judging the esouvenirs, you know.\n@c0@"
  es: "@aSancho@bAl tito Sancho se le da padre juzgar las cosinas.\n@c0@"
  fr: "@aSancho@bTonton Sancho est très d-d-doué pour évalouer les souvenirs, tu sais.\n@c0@"
  it: "@aSancho@b¡Esto es un museo, por todas la paellas!\nLa gente no puede mica gridare o cantar...\n¡Ops! ¿Sto hablando troppo ad alta voce?\n@c0@"
  ja: "@a@bサンチョ「芸術品の　かんていなら\n\tこの　サンチョめにも\n\tいささか　心得が……。\n@c0@"
376:
  de: "@aOtto@bIch fühle mich nie sehr wohl, wenn ein Raum zu überladen eingerichtet ist.\n@c0@"
  en: "@aTuppence@bI'm afraid I find it rather hard to relax if the decor in a room is too much on the grand side.\n@c0@"
  es: "@aAlazar@bMe temo que me resulta difícil relajarme si la decoración de una sala es demasiado pomposa.\n@c0@"
  fr: "@aInnocent@bJe suis désolé, mais j'ai personnellement du mal à me sentir à l'aise quand le décor d'une pièce est un peu trop grandiloquent.\n@c0@"
  it: "@aSimon@bLe decorazioni di questa sala sono davvero splendide, Maestà.\nFinora non ci avevo prestato attenzione...\n@c0@"
  ja: "@a@bピピン「りっぱすぎる部屋は\n\tどうも　落ち着きません。\n@c0@"
377:
  de: "@aBianca@bDas Museum ist selbst ein richtiges Ausstellungsstück, nicht? Schön und natürlich von außen und im Innern wohltuend.\n@c0@"
  en: "@aBianca@bThe museum itself is quite a display piece, eh?\r\nThe outside is all nice and natural, and the inside\r\nis really relaxin'.\n@c0@"
  es: "@aBianca@bEl mismo museo ya es digno de verse, ¿eh?\r\nEl exterior es bonito y natural y el interior relajante.\n@c0@"
  fr: "@aBianca@bLe bâtiment en lui-même est déjà une pièce de collection, heinⓡ Entouré d'une jolie nature à l'extérieur et très relaxant à l'intérieur.\n@c0@"
  it: "@aBianca@bL'edificio è di per sé un'attrazione, e poi si trova in un luogo bellissimo. Credo proprio che il Museo del Souvenir avrà molto successo!\n@c0@"
  ja: "@a@bビアンカ「博物館の中は名産品。\n\t外は自然の芸術で　あふれてるし\n\tここはとても　おちつけるところよ。\n@c0@"
378:
  de: "@aNera@bEs gibt doch nichts Schöneres als Kunst inmitten der Natur, in einem Meer sonnlichtbetupfter Blätter, die in einer leichten Brise rascheln.\n@c0@"
  en: "@aNera@bThere's nothing more beautiful than art that's filled with leaves rustling in the wind on sun-bathed branches.\n@c0@"
  es: "@aNera@bNo hay niente più bello que el arte rodeado de hojas al viento y ramas bañadas por el sole.\n@c0@"
  fr: "@aNera@bRien n'est plus beau que de l'art entouré de feuilles qui bruissent dans le vent, baignées par le soleil.\n@c0@"
  it: "@aNera@bArte e natura: esiste un binomio più esaltante e rilassante al tempo stesso?\n@c0@"
  ja: "@a@bフローラ「木もれ日も\n\t風にゆれる　葉の音も\n\t自然がおりなす芸術は　美しいです。\n@c0@"
379:
  de: "@a%0%a001240@bEs riecht hier wirklich schön grün.\n@c0@"
  en: "@a%0%a001240@bIt does smell nice and green here.\n@c0@"
  es: "@a%0%a001240@bHuele bien y a verde.\n@c0@"
  fr: "@a%0%a001240@bC'est vrai que ça sent bon la verdure, par ici.\n@c0@"
  it: "@a%0%a001240@bSe fossi un visitatore, verrei a vedere il Museo e poi farei un bel picnic nella foresta.\n@c0@"
  ja: "@a@b%a001240「ここは　緑のいい\n\tにおいがするね。\n@c0@"
380:
  de: "@a%0%a001250@bEs ist schön, im Wald zu sein, umgeben von lebenden Bäumen.\n@c0@"
  en: "@a%0%a001250@bIt feels nice to be in the forest, surrounded by living trees all around.\n@c0@"
  es: "@a%0%a001250@bEs agradable estar en el bosque rodeada de árboles.\n@c0@"
  fr: "@a%0%a001250@bC'est agréable d'être dans la forêt, entourés d'arbres pleins de vie.\n@c0@"
  it: "@a%0%a001250@bSembra che i visitatori apprezzino il fatto che il Museo del Souvenir si trovi immerso nel verde.\nMolto bene!\n@c0@"
  ja: "@a@b%a001250「森の中にいると\n\t木の命に　つつまれているみたいで\n\tとても気持ちいい。\n@c0@"
381:
  de: "@aSancho@bDas Museum wirkt im Wald nisst fehl am Platz. Es ist fast wie ein mässtiger Baum!\n@c0@"
  en: "@aSancho@bThees museum, eet no eseems to be out of place een the forest. Ees like ees just a beeg tree!\n@c0@"
  es: "@aSancho@bEste museo encaja de maravilla con el bosque. ¡Es como un gran árbol!\n@c0@"
  fr: "@aSancho@bCe musée, il a sa p-p-place dans oune forêt.\nC'est comme si c'était lui-même oun grand arbreⓠ\n@c0@"
  it: "@aSancho@bEs estrano, ma el Museo no sembra fuori luego en la foresta. Sembra quasi que sia una especie de grande albero... \n@c0@"
  ja: "@a@bサンチョ「森と違和感なく　建てられている\n\t博物館は　いつ見ても見事です。\n@c0@"
382:
  de: "@aOtto@bMitten in einem Wald zu sein ist wirklich ein ganz ungewöhnliches Gefühl.\n@c0@"
  en: "@aTuppence@bBeing in the middle of a forest is certainly an unusual sensation.\n@c0@"
  es: "@aAlazar@bEstar en mitad del bosque es una sensación poco común.\n@c0@"
  fr: "@aInnocent@bIl est certain que c'est une sensation inhabituelle de se retrouver comme ça, au beau milieu de la forêt.\n@c0@"
  it: "@aSimon@bLo ammetto: chi ha avuto la pensata di aprire un museo nel bel mezzo di un bosco è un vero genio!\n@c0@"
  ja: "@a@bピピン「森の中って　どこも\n\t不思議な　感覚がするんですよね。\n@c0@"
383:
  de: "@aBianca@bSo etwas sieht man wirklich nicht alle Tage, nicht? Vielleicht ist es sogar einzigartig auf der Welt.\n@c0@"
  en: "@aBianca@bYou certainly dun't often come across places like this, eh? Maybe this is the only one in the world.\n@c0@"
  es: "@aBianca@bNo es muy normal encontrarse sitios como este, ¿verdad? Quizá sea el único del mundo entero.\n@c0@"
  fr: "@aBianca@bC'est vrai qu'on ne voit pas souvent d'endroits\r\ncomme ça. Il est peut-être unique au monde.\n@c0@"
  it: "@aBianca@bÈ proprio vero: il Museo del Souvenir è unico nel suo genere. Non parlo solo degli oggetti esposti, ma anche dell'edificio e del luogo in cui si trova.\n@c0@"
  ja: "@a@bビアンカ「たしかに　博物館って\n\tめずらしいわよね。　もしかして\n\t世界に　ここだけだったりして。\n@c0@"
384:
  de: "@aNera@bAll die Mühe hat sich gelohnt, wenn die Leute von weit und fern hierher geströmt kommen, um sich das Museum anzusehen.\n@c0@"
  en: "@aNera@bIt's very rewarding to have people coming to visit from far and wide.\n@c0@"
  es: "@aNera@bEs veramente gratificante que venga gente de tutto il mondo a visitar este museo.\n@c0@"
  fr: "@aNera@bC'est très gratifiant de voir que les gens viennent\r\nde loin pour visiter cet endroit.\n@c0@"
  it: "@aNera@bOra che il Museo sta guadagnando popolarità, arrivano turisti da tutto il mondo per visitarlo.\n@c0@"
  ja: "@a@bフローラ「遠くの方も　興味を持って\n\t来てくださるのは　とても\n\tうれしいです。\n@c0@"
385:
  de: "@a%0%a001240@bStilvoll? Was heißt das, stilvoll?\n@c0@"
  en: "@a%0%a001240@bChic? What does that mean?\n@c0@"
  es: "@a%0%a001240@b¿Elegante? ¿Esto es elegante?\n@c0@"
  fr: "@a%0%a001240@bChicⓡ Qu'est-ce que ça veut direⓡ\n@c0@"
  it: "@a%0%a001240@bPerché Geremia non apre un altro museo in un posto insolito?\nChe so, potrebbe sistemarlo in cima a una montagna...\n@c0@"
  ja: "@a@b%a001240「ハイカラ？\n\tハイカラって　どういう意味なの？\n@c0@"
386:
  de: "@a%0%a001250@bIch seh hier keine Stiele!\n@c0@"
  en: "@a%0%a001250@bDoes chic just mean pretty? Or was she trying to speak like Sancho does?\n@c0@"
  es: "@a%0%a001250@b¿Elegante esto? Yo creía que solo la ropa era elegante.\n@c0@"
  fr: "@a%0%a001250@bEst-ce que chic, ça veut simplement dire joliⓡ\nÀ moins qu'elle essaie juste de parler comme Sancho...\n@c0@"
  it: "@a%0%a001250@bNon riconosco l'accento di quella signora.\nChissà da dove viene...\n@c0@"
  ja: "@a@b%a001250「ハイカラって\n\tキレイっていうこと？\n\tそれとも　ごうかっていう意味？\n@c0@"
387:
  de: "@aSancho@bDiese Señora, sie ist so elegant. Sie weiß, was ssick ist und was nisst.\n@c0@"
  en: "@aSancho@bThees señora, eshe ees eso elegant. Eshe knows what ees chic and what ees no chic.\n@c0@"
  es: "@aSancho@bLa señora sí que es bien elegante. Ella sabe de esas cosas.\n@c0@"
  fr: "@aSancho@bCette señora est si élégante. Elle sait muy bien\r\nce qui est chic et c-ce qui ne l'est pas.\n@c0@"
  it: "@aSancho@b¡Que señora elegante y raffinata!\nQuién sabe si es venuta aquí con el marito...\n@c0@"
  ja: "@a@bサンチョ「ハイカラという　言葉を\n\tおつかいなるとは\n\tむかし気質な方のようですね。\n@c0@"
388:
  de: "@aOtto@bJa, das Museumsgebäude an sich ist schon etwas ganz B'sonderes.\n@c0@"
  en: "@aTuppence@bYes, the museum building itself is quite a curiosity.\n@c0@"
  es: "@aAlazar@bSí, el mismo edificio ya es bastante curioso.\n@c0@"
  fr: "@aInnocent@bOui, le bâtiment en lui-même est déjà un objet\r\nde curiosité.\n@c0@"
  it: "@aSimon@bFinora i visitatori mi sembrano contenti del Museo, Maestà. Vuol dire che ho fatto un ottimo lav...\nEhm, vuol dire che lei ha fatto un ottimo lavoro...\n@c0@"
  ja: "@a@bピピン「博物館自体が　めずらしい\n\t建物ということなんでしょうね。\n@c0@"
389:
  de: "@aBianca@bIch frage mich, ob er hier wohl etwas ganz Besonderes erforschen wollte. Ich hoffe, er findet, was er sucht.\n@c0@"
  en: "@aBianca@bI wonder if he was here researchin' somethin' or other. I hope the place can be of use to him.\n@c0@"
  es: "@aBianca@bMe pregunto si estará aquí investigando algo. Espero que el sitio le sea útil, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe me demande s'il est ici pour voir quelque chose\r\nen particulier. J'espère en tout cas que notre musée pourra l'aider.\n@c0@"
  it: "@aBianca@bUhm, quel tipo sembra uno scienziato o uno studioso.\nMagari è venuto al Museo per svolgere delle ricerche...\n@c0@"
  ja: "@a@bビアンカ「研究でも　してる人なのかしら？\n\tなんにしろ　この博物館が\n\tあの人の　役に立つといいわね。\n@c0@"
390:
  de: "@aNera@bIch habe gehört, dass manche Leute gern Forschungen zu den Andenken aus den verschiedenen Regionen der Welt betreiben.\n@c0@"
  en: "@aNera@bI heard that some people like to carry out research on the world's various regional souvenirs.\n@c0@"
  es: "@aNera@bHe oído que hay gente que investiga sobre las cosinas de il mondo.\n@c0@"
  fr: "@aNera@bJ'ai entendu dire que certaines personnes faisaient des recherches sur les différentes formes d'artisanat local à travers le monde.\n@c0@"
  it: "@aNera@bSo che numerosi studiosi si interessano di souvenir.\nCome dar loro torto? Sono oggetti così affascinanti!\n@c0@"
  ja: "@a@bフローラ「名産品も　研究の対象に\n\tなることが　あると聞いたことが\n\tありますわ。\n@c0@"
391:
  de: "@a%0%a001240@bAus Büchern zu lernen ist gut und schön, aber noch besser ist es, sich die Dinge selbst anzusehen.\n@c0@"
  en: "@a%0%a001240@bStudying from books is all well and good, but\nit's better if you can actually get to see the real thing too.\n@c0@"
  es: "@a%0%a001240@bEstudiar cosas en los libros está bien y todo eso, pero es mucho mejor si puedes ver las cosas por ti mismo.\n@c0@"
  fr: "@a%0%a001240@bC'est bien d'étudier dans les livres, mais c'est encore mieux quand on peut aller voir les choses en vrai.\n@c0@"
  it: "@a%0%a001240@bStudiare sui libri sarà anche bello, ma esaminare un oggetto da vicino è tutta un'altra cosa! Per questo i musei sono belli: puoi vedere le cose con i tuoi occhi.\n@c0@"
  ja: "@a@b%a001240「本とかで　勉強するのも\n\tいいけど…　どうせ勉強するなら\n\t本物を見てのほうが　いいもんね。\n@c0@"
392:
  de: "@a%0%a001250@bMeinst du, er ist hierher gekommen, um zu forschen?\n@c0@"
  en: "@a%0%a001250@bDo you think he came here to study?\n@c0@"
  es: "@a%0%a001250@b¿Crees que ha venido a estudiar?\n@c0@"
  fr: "@a%0%a001250@bTu crois qu'il est venu ici pour faire\ndes recherchesⓡ\n@c0@"
  it: "@a%0%a001250@bPenso che sia uno studioso venuto qui per svolgere qualche ricerca...\n@c0@"
  ja: "@a@b%a001250「あの人　ここに\n\tお勉強しに来てるのかな……？\n@c0@"
393:
  de: "@aSancho@bSí, sí. Das Museum ist genau das Risstige zum Erforschen der Kulturen und fremden Orte, no?\n@c0@"
  en: "@aSancho@bSí, sí. Thees museum ees just right for estudying the cultures and the foreign places, no?\n@c0@"
  es: "@aSancho@b¡Ándale! Este museo es el lugar ideal para estudiar culturas y sitios lejanos.\n@c0@"
  fr: "@aSancho@bSi, si. Ce musée est p-p-parfait pour l'étude des cultures et des endroits étrangers, noⓡ\n@c0@"
  it: "@aSancho@bEl Museo del Souvenir diventerà un luego muy popolare tra los estudiosos que esvolgono ricercas sulle diversas culturas del mundo. ¡Soy seguro!\n@c0@"
  ja: "@a@bサンチョ「地域や文化を研究するのでしたら\n\tここの博物館は　もってこいの\n\t場所ですからね。\n@c0@"
394:
  de: "@aOtto@bEr scheint mir zu denen zu gehören, die die Dinge bis in den letzten Winkel erforschen, wenn ihr Interesse erst einmal g'weckt ist.\n@c0@"
  en: "@aTuppence@bHe seems the type to study something to the nth degree once it's piqued his interest.\n@c0@"
  es: "@aAlazar@bParece del tipo de personas que estudia a fondo algo una vez ha llamado su atención.\n@c0@"
  fr: "@aInnocent@bIl a l'air du genre à étudier les choses dans leurs moindres détails une fois qu'elles ont suscité son intérêt.\n@c0@"
  it: "@aSimon@bDev'essere un secchione.\nScommetto che a scuola non parlava mai con le ragazze...\n@c0@"
  ja: "@a@bピピン「あのような人は　いったん\n\t興味を持つと　とことん\n\tつきつめるんでしょうね。\n@c0@"
395:
  de: "@aBianca@bEin einzigartiges Ausstellungsstück, was? Es ist ganz schön schwierig, sich zu überlegen, was man in einem so prachtvollen Raum ausstellen sollte.\n@c0@"
  en: "@aBianca@bA stunnin' exhibit, eh? It's pretty tricky figurin' out what to put on display in such a grand-lookin' room.\n@c0@"
  es: "@aBianca@b¿Una exposición espléndida? Es bastante difícil saber qué exhibir en una sala tan exquisita y tal, ¿sabes?\n@c0@"
  fr: "@aBianca@bUne exposition somptueuse, heinⓡ C'est difficile\nde savoir quoi mettre en valeur dans une salle\naussi remarquable.\n@c0@"
  it: "@aBianca@bUn souvenir di bellezza assoluta, eh?\nNon è facile trovare un oggetto degno di questa splendida sala...\n@c0@"
  ja: "@a@bビアンカ「美しい名産品か……。\n\tあまりごうかな部屋だと\n\t展示するにも　迷っちゃうわね。\n@c0@"
396:
  de: "@aNera@bHier passt sicher nicht nur etwas Wunderschönes hin. Etwas Interessantes dürfte auch gehen. Wir sollten ein wenig herumexperimentieren.\n@c0@"
  en: "@aNera@bI'm sure that doesn't mean only a beautiful exhibit would work. Something interesting would work too. We should experiment with a few ideas.\n@c0@"
  es: "@aNera@bEstoy sicura de que no es necesaria una cosina espléndida.\n㈡\nAlgo interesante podría funcionar también, sin ir più lontano. Deberíamos probare algunas combinaciones.\n@c0@"
  fr: "@aNera@bÇa ne veut sûrement pas dire que seule une exposition somptueuse pourra marcher.\n㈡\nÇa pourrait aussi être quelque chose d'intéressant, tout simplement. On devrait faire quelques essais.\n@c0@"
  it: "@aNera@bNon credo si riferisca solo alla bellezza dell'oggetto, ma anche all'interesse che suscita nei visitatori. Io proverei qualche souvenir diverso...\n@c0@"
  ja: "@a@bフローラ「美しい名産だけが　ぴったりとは\n\tかぎらないかも知れませんわ。\n\tいろいろと　ためしてみましょうよ。\n@c0@"
397:
  de: "@a%0%a001240@bEin einzigartiges Ausstellungsstück? Warum muss es denn einzigartig sein?\n@c0@"
  en: "@a%0%a001240@bA stunning exhibit? Why would it need to\nbe stunning?\n@c0@"
  es: "@a%0%a001240@b¿Una exposición espléndida? ¿Por qué espléndida?\n@c0@"
  fr: "@a%0%a001240@bUne exposition à la hauteurⓡ\nMais à quelle hauteurⓡ\n@c0@"
  it: "@a%0%a001240@bQuel tizio mi sta antipatico!\nEsporrei in questa sala il più brutto dei souvenir solo per fargli dispetto!\n@c0@"
  ja: "@a@b%a001240「美しい　名産品がいいって。\n\t何がいいかなあ？\n@c0@"
398:
  de: "@a%0%a001250@bEin einzigartiges Ausstellungsstück, das klingt nach einem teuren Ausstellungsstück.\n@c0@"
  en: "@a%0%a001250@bA stunning exhibit sounds like an expensive exhibit\nto me.\n@c0@"
  es: "@a%0%a001250@bUna exposición espléndida a mí me suena a caro.\n@c0@"
  fr: "@a%0%a001250@bPour moi, exposition somptueuse rime avec\nexposition coûteuse.\n@c0@"
  it: "@a%0%a001250@bUn souvenir di bellezza assoluta?\nForse intende un souvenir molto costoso?\n@c0@"
  ja: "@a@b%a001250「美しい名産品って…\n\t高そうな名産品　ってことよね……。\n@c0@"
399:
  de: "@aSancho@bDas ist risstig. Das hier ist der Ehrenplatz für den ganzen Stolz des Museums.\n@c0@"
  en: "@aSancho@bEes true. Thees exhibit you put on display een here, ees the pride of the museum.\n@c0@"
  es: "@aSancho@bEs la puritita verdad. La exhibición que pongas aquí será el orgullo del museo.\n@c0@"
  fr: "@aSancho@bC'est vrai. Cette salle, c'est la f-f-fierté du musée.\n@c0@"
  it: "@aSancho@bPienso que abbia ragiones.\nEl souvenir que verrà esposto en esta sala deventerà la estrella del Museo.\n@c0@"
  ja: "@a@bサンチョ「ここにかざられる　名産品は\n\tまちがいなく　この博物館の\n\t目玉となることでしょう。\n@c0@"
400:
  de: "@aOtto@bHier sieht bestimmt alles gut aus, was wir ausstellen, egal, was es ist.\n@c0@"
  en: "@aTuppence@bI'm sure that anything we put on display in here would look quite lovely.\n@c0@"
  es: "@aAlazar@bEstoy seguro de que cualquier cosa que pongamos aquí quedará estupenda.\n@c0@"
  fr: "@aInnocent@bN'importe quel objet qu'on exposera ici aura l'air splendide, j'en suis convaincu.\n@c0@"
  it: "@aSimon@bSecondo me questa sala è talmente bella che qualunque souvenir decidiamo di esporre ci farà un figurone.\n@c0@"
  ja: "@a@bピピン「どんな名産品を　かざっても\n\t美しく見えそうな　気もするんですが。\n@c0@"
401:
  de: "@aBianca@bDas Museum ist für alle gedacht. Ich hoffe, sie fühlen sich nicht allzu eingeschüchtert davon.\n@c0@"
  en: "@aBianca@bThe museum's here for everyone to enjoy, so I hope they dun't feel too overwhelmed by the place.\n@c0@"
  es: "@aBianca@bEl museo está aquí para que todo el mundo lo disfrute, espero que no se sienta intimidado por el lugar, ¿sabes?\n@c0@"
  fr: "@aBianca@bLe musée est destiné à tout le monde. J'espère que personne ne se sent trop impressionné par les lieux.\n@c0@"
  it: "@aBianca@bNon sarà stato il commento più entusiasta che ho sentito, ma almeno è stato sincero e obbiettivo.\n@c0@"
  ja: "@a@bビアンカ「博物館は　みんなの\n\t場所でもあるんだから\n\tえんりょなく　入ってほしいな。\n@c0@"
402:
  de: "@aNera@bWir sollten versuchen, darauf achten, dass sich hier jedermann willkommen fühlt, meinst du nicht, Liebling?\n@c0@"
  en: "@aNera@bWe should try and make sure it's the kind of place everyone feels welcome in, don't you think, darling?\n@c0@"
  es: "@aNera@bDebemos asegurarnos de que este lugar haga sentir a tutti cuanti benvenutti, ¿no crees, caro mío?\n@c0@"
  fr: "@aNera@bNous devrions nous assurer que c'est un endroit\noù tout le monde se sent à l'aise, tu ne crois pas,\nmon chériⓡ\n@c0@"
  it: "@aNera@bIn effetti, la bellezza di questo posto è fuori dal comune.\nDa restare senza fiato.\n@c0@"
  ja: "@a@bフローラ「ねえ　あなた。　どなたにでも\n\t気軽に入っていただける博物館を\n\tめざすというのは　どうかしら？\n@c0@"
403:
  de: "@a%0%a001240@bWarum sollte denn hier jemand hibbelig werden? Ich find's toll hier!\n@c0@"
  en: "@a%0%a001240@bWhy would anyone feel nervous here?\nI think the place is cool!\n@c0@"
  es: "@a%0%a001240@b¿Por qué se tendría que poner nadie nervioso aquí?\nYo creo que está genial.\n@c0@"
  fr: "@a%0%a001240@bPourquoi les gens se sentiraient nerveux, iciⓡ\nMoi je le trouve super, cet endroitⓠ\n@c0@"
  it: "@a%0%a001240@bPerché quell'uomo si sente a disagio in un posto tanto bello?\nForse gli piacciono le cose brutte?\n@c0@"
  ja: "@a@b%a001240「ドキドキ　かあ……。\n\tボクは　ワクワク　だけどね！\n@c0@"
404:
  de: "@a%0%a001250@bWenn man richtig hibbelig ist, dann kriegt man so ein Rauschen im Kopf.\n@c0@"
  en: "@a%0%a001250@bWhen you feel really nervous like that, you start to hear your own heart beating.\n@c0@"
  es: "@a%0%a001250@bCuando te pones muy nervioso, comienzas a oír como te late el corazón.\n@c0@"
  fr: "@a%0%a001250@bQuand on se sent nerveux comme ça, on sent très bien les battements de son propre cœur.\n@c0@"
  it: "@a%0%a001250@bLo capisco. A volte anch'io provo disagio di fronte alla bellezza di una persona o di una cosa. È come se mi sentissi sopraffatta dal suo splendore...\n@c0@"
  ja: "@a@b%a001250「きんちょうすると　自分の\n\tドキドキする音が　聞こえるのよね。\n@c0@"
405:
  de: "@aSancho@bSí, das stimmt. Es ist nisst leisst, siss in einem so prässtigen Gebäude zu entspannen. Mansse Leute wollen nisst mal hineingehen.\n@c0@"
  en: "@aSancho@bSí, ees true. Ees no easy to relax een a building when ees eso grand. Esome people, they no even want to go eenside.\n@c0@"
  es: "@aSancho@bBueno, es la puritita verdad. Cuando un edificio es retelujoso es difícil relajarse. Hay gente pues que ni quiere entrar.\n@c0@"
  fr: "@aSancho@bSi, c'est vrai. Ça n'est p-p-pas facile de se détendre dans oun bâtiment aussi somptueux. Il y en a qui ne v-veulent même pas entrer.\n@c0@"
  it: "@aSancho@b¿No vorrà mica que imbruttiamo el nuestro maravilloso Museo solo por fargli un piaceres, eh?\n@c0@"
  ja: "@a@bサンチョ「りっぱな　建物というのは\n\tなかなか　おちつけない所ですから\n\t入りづらいものなのですよ。\n@c0@"
406:
  de: "@aOtto@bOffenbar kennen sie so etwas noch net.\n@c0@"
  en: "@aTuppence@bLooks like they're not very well acquainted with places like this.\n@c0@"
  es: "@aAlazar@bParece que no está acostumbrado a los sitios así.\n@c0@"
  fr: "@aInnocent@bOn dirait qu'il n'est pas habitué aux lieux comme celui-ci.\n@c0@"
  it: "@aSimon@bIn gamba, quel tipo: anche se il posto lo mette a disagio, ha ammesso che è oggettivamente molto bello.\n@c0@"
  ja: "@a@bピピン「あの人　あまり　こういう所に\n\t入ったことが　ないんでしょうねえ。\n@c0@"
407:
  de: "@aBianca@bHochzeitsreise, wie? Das erinnert mich an die Zeit, als wir beiden frisch verheiratet waren, %a000090.\n@c0@"
  en: "@aBianca@bHoneymoon, eh? Reminds me of when you and me had just got married, %a000090.\n@c0@"
  es: "@aBianca@bLuna de miel, ¿eh? Me recuerda a cuando tú y yo nos acabábamos de casar, %a000090.\n@c0@"
  fr: "@aBianca@bEn lune de mielⓡ Ça me rappelle l'époque où nous étions jeunes mariés, %a000090. \n@c0@"
  it: "@aBianca@bTrascorrere la luna di miele in un museo?!\nSuo marito dev'essere un tipo estremamente originale...\n@c0@"
  ja: "@a@bビアンカ「新婚旅行だって。\n\tなんだか　私たちが　結婚した時のこと\n\t思い出しちゃうね。\n@c0@"
408:
  de: "@aNera@bMir ist es egal, wo wir hingehen. Solange ich mit dir zusammen bin, bin ich glücklich.\n@c0@"
  en: "@aNera@bI don't mind where we go. As long as I'm with you, I'm happy\n@c0@"
  es: "@aNera@bVeramente, no me importa adónde vayamos. Sempre que este al tuo lado, estaré felice.\n@c0@"
  fr: "@aNera@bPeu m'importe où nous allons. Dès lors que je suis avec toi, je suis heureuse.\n@c0@"
  it: "@aNera@bPer me qualunque posto è il paradiso, se ci sei tu accanto a me...\n@c0@"
  ja: "@a@bフローラ「私は　あなたと\n\tいっしょに　行く所なら\n\tどんな所でも　うれしいです。\n@c0@"
409:
  de: "@aNera@bUnd das schließt natürlich auch unsere gemeinsamen Reisen ein.\n@c0@"
  en: "@aNera@bAnd that includes our travels together now,\r\nof course.\n@c0@"
  es: "@aNera@bY eso incluye nuestros viaggi juntos, claro.\n@c0@"
  fr: "@aNera@bEt cela inclut les voyages que nous faisons maintenant ensemble, évidemment.\n@c0@"
  it: "@aNera@bÈ anche per questo che ho deciso di accompagnarti ovunque tu vada, amore mio.\n@c0@"
  ja: "@a@bフローラ「もちろん　旅をしている\n\t今この時も幸せですわ。\n@c0@"
410:
  de: "@a%0%a001240@bHe, mir fällt da gerade was ein. Ist Sancho nicht verheiratet?\n@c0@"
  en: "@a%0%a001240@bHey, I just had a thought. Isn't Sancho married?\n@c0@"
  es: "@a%0%a001240@b¡Eh! Se me acaba de ocurrir algo. ¿Sancho no está casado?\n@c0@"
  fr: "@a%0%a001240@bHé, je viens de penser à un truc.\nIl n'est pas marié, Sanchoⓡ\n@c0@"
  it: "@a%0%a001240@bA proposito!\nMa lo zio Sancho è sposato?\n@c0@"
  ja: "@a@b%a001240「そういえば　サンチョって\n\t結婚してないの？\n@c0@"
411:
  de: "@a%0%a001250@bOb ich wohl eines Tages auch heiraten werde?\n@c0@"
  en: "@a%0%a001250@bI wonder if I'll get married one day.\n@c0@"
  es: "@a%0%a001250@bMe pregunto si yo me casaré algún día.\n@c0@"
  fr: "@a%0%a001250@bJe me demande si je me marierai un jour.\n@c0@"
  it: "@a%0%a001250@bChissà dove andrò in luna di miele quando mi sposerò...\n@c0@"
  ja: "@a@b%a001250「私もいつか　お嫁さんに\n\tなれるかな？\n@c0@"
412:
  de: "@aSancho@bWenn iss jemanden von Hochzeiten reden höre, wünschte iss, iss hätte deine Hochzeit sehen können, Chico. Iss... iss... (Schnüff)\n@c0@"
  en: "@aSancho@bWhen I hear esomeone talking about the\r\nweddings, I weesh I could esee your\r\nwedding, friend. I, I... (sniff)\n@c0@"
  es: "@aSancho@bCuando alguien habla de casorios, me apena no haber visto el tuyo. Yo, yo... (snif)\n@c0@"
  fr: "@aSancho@bQuand j'entends quelqu'un p-parler de mariage,\r\nje me dis que j'aurais aimé assister au t-tien, chico. Je-Je... (snif)\n@c0@"
  it: "@aSancho@b¡Ay, que bueno! ¡El Museo del Souvenir es perfecto por todos los viaggios, de piaceres, culturales o de nozzes que siano!\n@c0@"
  ja: "@a@bサンチョ「あらためて　思いますが\n\t%a000090王の結婚式を\n\t私も　見たかったです。\n@c0@"
413:
  de: "@aOtto@bIch hoff', ich find' eines Tages auch eine wunderschöne Braut.\n@c0@"
  en: "@aTuppence@bI hope I'll find myself a beautiful bride one of\r\nthese days.\n@c0@"
  es: "@aAlazar@bEspero conseguir pronto una bella esposa.\n@c0@"
  fr: "@aInnocent@bJ'espère que je me trouverai une belle épouse,\r\nun jour.\n@c0@"
  it: "@aSimon@bAnch'io un giorno mi sposerò...\nSpero solo che quel giorno non arrivi troppo presto!\n@c0@"
  ja: "@a@bピピン「いつかボクも　きれいな\n\t花嫁さんをもらいたいです。\n@c0@"
414:
  de: "@aBianca@bDas kann ich nachvollziehen. Er will nicht zu weit herumreisen, um seine Frau nicht in Gefahr zu bringen.\n@c0@"
  en: "@aBianca@bFair enough. You can see why he wouldn't want to travel too much if it'd put his wife in danger.\n@c0@"
  es: "@aBianca@bYa, bueno. Entiendo que no quiera viajar mucho si puede poner a su esposa en peligro.\n@c0@"
  fr: "@aBianca@bC'est raisonnable. Je comprends pourquoi\r\nil ne veut pas trop voyager s'il a peur de\r\nmettre sa femme en danger.\n@c0@"
  it: "@aBianca@bChe marito premuroso!\nHa deciso di trascorrere qui la luna di miele per non far correre rischi alla moglie!\n@c0@"
  ja: "@a@bビアンカ「そうよね。\n\t危険がともなう旅に\n\t奥さんを　つれていけないもの。\n@c0@"
415:
  de: "@aBianca@bAber um mich brauchst du dir keine Sorgen zu machen, %a000090. Ich bleibe an deiner Seite, egal, wo du hingehst.\n@c0@"
  en: "@aBianca@bYou dun't need to worry about me, though, %a000090. I'll stick by your side wherever\nyou go.\n@c0@"
  es: "@aBianca@bPero por mí no tienes por qué preocuparte, %a000090. Allá donde vayas, iré yo, ¿sabes?\n@c0@"
  fr: "@aBianca@bMais tu n'as pas à t'inquiéter pour moi, %a000090. Je resterai à tes côtés,\noù que tu ailles.\n@c0@"
  it: "@aBianca@bPerò qualcuno dovrebbe fargli capire che lei non è esattamente ⓕentusiastaⓖ della scelta...\n@c0@"
  ja: "@a@bビアンカ「私は　平気よ。\n\tずっと%a000090と　いっしょだからね。\n@c0@"
416:
  de: "@aNera@bWenn man jemanden liebt, dann geht man frohen Herzens mit ihm, egal wohin. Das finde ich jedenfalls.\n@c0@"
  en: "@aNera@bIf you love a person, then you'll gladly go anywhere with them. That's the way I feel, anyway.\n@c0@"
  es: "@aNera@bSi amas veramente a alguien, irías con él hasta el fin del mondo. Así es como yo me siento.\n@c0@"
  fr: "@aNera@bQuand on aime quelqu'un, on est prêt à suivre cette personne, où qu'elle aille. C'est mon opinion,\r\nen tout cas.\n@c0@"
  it: "@aNera@bSe ami davvero qualcuno, sei felice di andare con lui in qualunque posto.\nAlmeno, questo è il mio punto di vista...\n@c0@"
  ja: "@a@bフローラ「愛する人となら　どこへ\n\t行っても　うれしいものですわ。\n\t私もそうですもの。\n@c0@"
417:
  de: "@a%0%a001240@bEs ist unsere Aufgabe, die Welt zu retten und wieder zu einem friedlichen Ort zu machen, damit die Leute überall hingehen können, wohin sie wollen.\n@c0@"
  en: "@a%0%a001240@bIt's up to us to save the world and make it peaceful again so that people can go wherever they want.\n@c0@"
  es: "@a%0%a001240@bEstá en nuestras manos salvar el mundo y restablecer la paz para que la gente pueda ir donde le plazca.\n@c0@"
  fr: "@a%0%a001240@bC'est à nous de sauver le monde et de rétablir\nla paix pour que les gens puissent de nouveau voyager là où ils veulent.\n@c0@"
  it: "@a%0%a001240@bEcco un altro motivo per far tornare la pace nel mondo! Quando il male sarà sconfitto, la gente potrà viaggiare quanto vorrà!\n@c0@"
  ja: "@a@b%a001240「誰でも　自由に世界を\n\t旅行できるように　平和な世界に\n\tしなきゃいけないね！\n@c0@"
418:
  de: "@a%0%a001250@bAndenken erzählen aber nicht die ganze Geschichte, oder? Ich meine, es gibt in der Welt doch mehr zu sehen als das, was hier ausgestellt wird.\n@c0@"
  en: "@a%0%a001250@bSouvenirs don't tell the whole story though, do they? I mean, there's more to the world than what's on display here.\n@c0@"
  es: "@a%0%a001250@bPero las cosinas no lo dicen todo, ¿verdad?\nQuiero decir, en el mundo hay más cosas de las que se ven aquí.\n@c0@"
  fr: "@a%0%a001250@bMais les souvenirs ne disent pas tout, n'est-ce pasⓡ Il y a beaucoup d'autres choses dans le monde que celles qui sont exposées ici.\n@c0@"
  it: "@a%0%a001250@bCapisco cosa voglia dire quell'uomo, ma non penso che vedere dei souvenir sia proprio come visitare i loro paesi di provenienza...\n@c0@"
  ja: "@a@b%a001250「でも　本当は　世界って\n\t名産を見ただけじゃわからないほど\n\tいろいろなところが　あるのよね。\n@c0@"
419:
  de: "@a%0%a001250@bIch hoffe, bald ist es wieder sicher genug, damit die Leute überall herumreisen und sich all die faszinierenden Orte selbst ansehen können.\n@c0@"
  en: "@a%0%a001250@bI hope it's safe again soon for people to travel all over and see all the amazing places there are.\n@c0@"
  es: "@a%0%a001250@bEspero que pronto el mundo vuelva a ser un lugar seguro y que la gente pueda viajar para ver todos los fantásticos lugares que existen.\n@c0@"
  fr: "@a%0%a001250@bJ'espère que les gens pourront bientôt voyager de nouveau en toute sécurité et voir de leurs propres yeux tous les endroits merveilleux qui existent.\n@c0@"
  it: "@a%0%a001250@bSperiamo che nel mondo torni presto la tranquillità, così chi vuole viaggiare potrà farlo senza tante preoccupazioni.\n@c0@"
  ja: "@a@b%a001250「はやく　みんなが\n\t自分の目で　好きな場所を\n\t見られるようになるといいな。\n@c0@"
420:
  de: "@aSancho@bWenn dieser Señor seine Frau beeindrucken will, muss er sie in jede dunkle Ecke dieses Museums führen.\n@c0@"
  en: "@aSancho@bEef thees señor, he ees hoping to impress hees wife, he must take her to every dark corner of thees place.\n@c0@"
  es: "@aSancho@bPues si el señor quiere impresionar a su esposa, debería llevarla a los rincones más oscuros de este lugar.\n@c0@"
  fr: "@aSancho@bSi ce señor veut impressionner sa femme,\r\nil f-faut qu'il l'emmène dans tous les r-recoins obscurs de cet endroit.\n@c0@"
  it: "@aSancho@bSi quel señor piensa que la moglie sia feliz de trascorrere la luna de miele en esto posto se sbaglia de grossos...\n@c0@"
  ja: "@a@bサンチョ「そのような　理由でしたら\n\t博物館をくまなく見て\n\tいただきたいですね。\n@c0@"
421:
  de: "@aOtto@bEs ist auf jeden Fall nicht leicht, heutzutage durch die Welt zu reisen, das ist mal sicher.\n@c0@"
  en: "@aTuppence@bIt's certainly not easy travelling about the place these days, that's for sure.\n@c0@"
  es: "@aAlazar@bLa verdad es que lo de viajar hoy en día no es fácil.\n@c0@"
  fr: "@aInnocent@bIl n'est pas facile de voyager en ce moment,\r\nc'est certain.\n@c0@"
  it: "@aSimon@bÈ la triste verità: oggi come oggi viaggiare è davvero pericoloso!\n@c0@"
  ja: "@a@bピピン「旅行するにも\n\t大変な時代ですからねえ。\n@c0@"
422:
  de: "@aBianca@bMeinst du, er ist den ganzen weiten Weg gekommen, um seine Arbeit ausgestellt zu sehen?\n@c0@"
  en: "@aBianca@bD'you reckon he come all this way to see his work\r\non display?\n@c0@"
  es: "@aBianca@b¿Crees que habrá viajado desde muy lejos para ver su trabajo expuesto?\n@c0@"
  fr: "@aBianca@bTu crois qu'il a fait tout ce chemin pour voir son œuvre exposéeⓡ\n@c0@"
  it: "@aBianca@bQuale souvenir avrebbe realizzato?\nNon l'ho mica capito!\n@c0@"
  ja: "@a@bビアンカ「あの人　自分が作った名産品を\n\t見に来てくれたのかな？\n@c0@"
423:
  de: "@aNera@bSicherlich ist der Mann hellauf begeistert, seine eigene Arbeit hier ausgestellt zu sehen.\n@c0@"
  en: "@aNera@bI should think that man's over the moon to see something he made with his own hands on\r\ndisplay here.\n@c0@"
  es: "@aNera@bCredo que ese uomo estará en una nube al ver algo que ha hecho él mismo expuesto aquí.\n@c0@"
  fr: "@aNera@bÀ mon avis, cet homme ne se tient plus de joie de voir exposé ici un objet fabriqué de ses propres mains.\n@c0@"
  it: "@aNera@bMa davvero al Museo abbiamo il creatore di uno dei souvenir esposti?\nVoglio il suo autografo!\n@c0@"
  ja: "@a@bフローラ「自分の作った物が\n\t展示されると　やっぱり\n\tうれしいものですよね。\n@c0@"
424:
  de: "@a%0%a001240@bWas? Dieser Mann hat eines der Ausstellungsstücke angefertigt? Welches denn?\n@c0@"
  en: "@a%0%a001240@bWhat? That man made one of the exhibits?\nWhich one?\n@c0@"
  es: "@a%0%a001240@b¿Qué? ¿Ese hombre hizo una de las cosinas?\n¿Cuál?\n@c0@"
  fr: "@a%0%a001240@bQuoiⓡ Ce type a fabriqué l'une des piècesⓡ Laquelleⓡ\n@c0@"
  it: "@a%0%a001240@bQuale oggetto ha creato, eh?\nQuale?\n@c0@"
  ja: "@a@b%a001240「あのおじさんが\n\t名産品を作ったの？　どれだろう？\n@c0@"
425:
  de: "@a%0%a001250@bEr sagt, dass er eins der Ausstellungsstücke angefertigt hat, aber er will nicht sagen, welches.\n@c0@"
  en: "@a%0%a001250@bHe says he made one of the exhibits, but he won't tell anyone which one it is.\n@c0@"
  es: "@a%0%a001250@bDice que él hizo una de las cosinas, pero no le cuenta a nadie cuál.\n@c0@"
  fr: "@a%0%a001250@bIl dit qu'il a fabriqué l'une des pièces, mais il ne dit\nà personne laquelle c'est.\n@c0@"
  it: "@a%0%a001250@bQuell'uomo dice di aver realizzato uno dei souvenir esposti, ma non dice quale!\nNon è che ci sta prendendo in giro?\n@c0@"
  ja: "@a@b%a001250「でも　あのおじさん\n\tどの名産品を　作ったのか\n\t教えてくれないのね……。\n@c0@"
426:
  de: "@aSancho@bDieser Mann sprisst nisst wie ein großer Künstler. Iss frage miss, welsses Stück er angefertigt hat.\n@c0@"
  en: "@aSancho@bThees señor, he no espeak like the great artisan.\r\nI wonder which ees the exhibit that he made...\n@c0@"
  es: "@aSancho@bEste hombre no habla como un artesano...\r\nNomás me pregunto que cosina hizo...\n@c0@"
  fr: "@aSancho@bCe señor, il ne p-p-parle pas vraiment comme\r\noun grand artisan. Je me demande quel objet\r\nil a f-f-fabriqué...\n@c0@"
  it: "@aSancho@bQuel señor no sembra affattos un artigiano...\nPotrei sbagliarme, ma pienso que no abbia realizzato alcun souvenir.\n@c0@"
  ja: "@a@bサンチョ「なにやら　ごうかいな方ですが…\n\tいったい　どのような名産を\n\t作られたんでしょうね。\n@c0@"
427:
  de: "@aOtto@bEr muss überzeugt sein, ein ganz wunderbares Stück Nippes ang'fertigt zu haben, wenn er damit so angibt.\n@c0@"
  en: "@aTuppence@bHe must be pretty convinced he's made a marvel of a knick-knack to be showing off about it like that.\n@c0@"
  es: "@aAlazar@bDebe de estar muy convencido de que ha hecho una cosina de primera para presumir tanto.\n@c0@"
  fr: "@aInnocent@bIl doit vraiment être persuadé d'avoir fabriqué quelque chose d'exceptionnel pour s'en vanter\r\ncomme ça.\n@c0@"
  it: "@aSimon@bAnch'io andrei in giro a vantarmi del mio lavoro, se avessi realizzato un souvenir tanto bello da essere esposto in un museo.\n@c0@"
  ja: "@a@bピピン「あれだけ　じまんするということは\n\tよっぽど自分の　名産品に\n\t自信があるんだなあ……。\n@c0@"
428:
  de: "@aBianca@bIch wüsste nicht, dass ich hier drin schon mal irgendwas gesehen hätte.\n@c0@"
  en: "@aBianca@bI dun't remember seein' anythin' in here\r\nbefore, personally.\n@c0@"
  es: "@aBianca@bNo recuerdo haber visto nunca nada aquí, ¿sabes?\n@c0@"
  fr: "@aBianca@bPersonnellement, je ne me souviens pas avoir déjà vu quoi que ce soit ici.\n@c0@"
  it: "@aBianca@bPerché, qui prima c'era qualcosa?\nA me sembra di no...\n@c0@"
  ja: "@a@bビアンカ「この部屋には　最初から\n\tなにもなかったと思うけど……。\n@c0@"
429:
