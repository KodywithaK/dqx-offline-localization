2:
  de: "@a@b*: Es ist sicher sehr strapaziös, alleine zu reisen.\nUnser Tarif ist %a000510 Goldmünzen pro Nacht.\nMöchtet Ihr hier übernachten?\n@c0@"
  en: "@a@b*: It must be tiring for you travelling alone.\nOur rate is %a000510 gold coins per night.\nWould you like to stay?\n@c0@"
  es: "@a@b*: Debe de ser muy cansado viajar %A0110%Xsolo%Z%B0110%Xsola%Z.\nNuestra tarifa es de %a000510 monedas de oro por noche.\n㈡\n*: ¿Le gustaría quedarse?\n@c0@"
  fr: "@a@b*ⓢ Ce doit être fatigant de voyager seul%A0110%X%Z%B0110%Xe%Z, nonⓡ\nNous demandons %a000510 pièces d'or la nuit.\nVous voulez resterⓡ\n@c0@"
  it: "@a@b*: Dev'essere faticoso viaggiare da %A0110%Xsolo, amico mio%Z%B0110%Xsola, amica mia%Z.\nChe ne diresti di riposarti un po' qui?\nIl costo della sistemazione è di %a000510 monete d'oro.\n@c0@"
  ja: "@a@b＊「ひとり旅で　おつかれでしょう。\n\t%a000510ゴールド　いただきますが\n\tご休けい　なさいますか？\n@c0@"
3:
  de: "@a@b*: Ich wünsche Euch einen angenehmen Aufenthalt.\n@c0@"
  en: "@a@b*: I hope you enjoy your stay.\n@c0@"
  es: "@a@b*: Espero que disfrute de su estancia.\n@c0@"
  fr: "@a@b*ⓢ J'espère que vous vous plairez ici.\n@c0@"
  it: "@a@b*: %H0860%XTi%YVi%Z auguro una serena permanenza!\n@c0@"
  ja: "@a@b＊「それでは　どうぞ　ごゆっくり。\n@c0@"
4:
  de: "@a@b*: Ich hoffe, dass Ihr gut geschlafen habt.\nMöge Euch das Glück im Kampf hold sein!\n@c0@"
  en: "@a@b*: I trust you had a good night's sleep.\nMay the fortunes of battle be with you!\n@c0@"
  es: "@a@b*: Espero que haya descansado durante la noche. ¡Que la suerte le sonría en la batalla!\n@c0@"
  fr: "@a@b*ⓢ J'espère que vous avez bien dormi.\nQue la Déesse se batte à vos côtésⓠ\n@c0@"
  it: "@a@b*: Spero che %H0860%Xtu abbia%Yabbiate%Z riposato bene.\nBuona fortuna, e a presto!\n@c0@"
  ja: "@a@b＊「よく　お休みに\n\tなられたようですね。\n\tでは　ご武運を！\n@c0@"
5:
  de: "@a@b*: Ach du meine Güte!\nWie es aussieht, könnt Ihr Euch das nicht leisten.\n@c0@"
  en: "@a@b*: Oh dear! It looks like you don't have the necessary funds.\n@c0@"
  es: "@a@b*: ¡Oh, vaya! Parece que carece de los fondos necesarios.\n@c0@"
  fr: "@a@b*ⓢ Par la Déesseⓠ On dirait bien que vous n'avez pas assez d'argent.\n@c0@"
  it: "@a@b*: Uhm... Temo che %H0860%Xtu non abbia%Ynon abbiate%Z denaro a sufficienza.\n@c0@"
  ja: "@a@b＊「おや？　残念ですが\n\tお金が　たりないようですね。\n@c0@"
6:
