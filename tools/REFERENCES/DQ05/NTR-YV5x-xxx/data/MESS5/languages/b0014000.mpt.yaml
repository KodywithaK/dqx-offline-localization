  it: "@a@b*: Uhm...\nDove %H0860%Xhai%Yavete%Z trovato questo bel trofeo, eh?\n@c0@"
  ja: "@a@b＊「う～ん　あの　カッコイイ\n\tトロフィーは　何だ？\n@c0@"
218:
