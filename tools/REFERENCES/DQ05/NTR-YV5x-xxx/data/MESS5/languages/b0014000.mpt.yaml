  es: "@a@b*: ¿Qué? ¿Que viene de Nadiria?\nNo tenía ni idea que tuviesen objetos tan delicados.\n㈡\n*: Me pregunto qué hay que hacer para obtener un permiso de residencia allí.\n@c0@"
  fr: "@a@b*ⓢ Pardonⓡ Ça vient de Nadiriaⓡ Je n'aurais jamais pensé qu'ils puissent avoir de si belles pièces là-bas.\n㈡\n*ⓢ Je me demande ce qu'il faut faire pour avoir l'autorisation d'y établir une résidence secondaire.\n@c0@"
  it: "@a@b*: Che cosa?!\nÈ un souvenir di Nadiria?! Non avrei mai immaginato che lì sapessero realizzare manufatti tanto belli!\n㈡\n*: Mi sa che ordinerò a qualche mio servitore di andare a fare un giro da quelle parti e di portarmi un po' di ricordini...\n@c0@"
  ja: "@a@b＊「えっ？　魔界の品物？\n\tう～ん　すばらしい！\n\tわしも　魔界の住人になりたいものだ。\n@c0@"
