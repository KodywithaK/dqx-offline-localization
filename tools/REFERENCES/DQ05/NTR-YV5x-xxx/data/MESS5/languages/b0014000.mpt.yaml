0:
  de: "@a@bIch kann ganz ehrlich sagen, dass ich nicht mehr so gerührt war seit dem Tag, an dem es mich dahingerafft hat.ⓟ\n@c0@"
  en: "@a@bⓗI can honestly say I've not been so deeply moved since the day I died.ⓘ\n@c0@"
  es: "@a@bⓕCon el corazón en la mano, estoy tan emocionado que lo notaría palpitar si no fuese porque estoy ligeramente muertoⓖ.\n@c0@"
  fr: "@a@bJe dois reconnaître que je n'avais encore jamais été aussi ému depuis le jour de ma mort.ⓦ\n@c0@"
  it: "@a@bⓕNon riesco a trattenere le lacrime per l'emozione... Non piangevo tanto dal giorno del mio centocinquantesimo compleanno...ⓖ\n@c0@"
  ja: "@a@b“感無量じゃ。\n　こんなにうれしいことは\n　死んでからも　初めてじゃ。”\n@c0@"
1:
  de: "@a@bEs ist das Tagebuch von Franz Firle. %0%a000120 beginnt, darin zu lesen...\n@c0@"
  en: "@a@bIt's Old Man Nick Knack's diary.\n%0%a000120 starts to read it...\n@c0@"
  es: "@a@bEs el diario del abuelo Nino.\n%0%a000120 empieza a leerlo...\n@c0@"
  fr: "@a@bIl s'agit du journal du vieux Bricabrac.\n%0%a000120 se met à le lire...\n@c0@"
  it: "@a@bÈ il diario del vecchio Geremia.\n%0%a000120 inizia a leggerlo...\n@c0@"
  ja: "@a@bデスじいの日記がある。\n%a000120は　こっそり\n日記を　読んでみた。\n@c0@"
2:
  de: "@a@bⓞHaaach... Werde ich je wissen, was für einen Tag wir haben?!\n㈡\nJedenfalls habe ich einen kleinen Schwatz mit Kati gehalten, nachdem heute das Museum geschlossen war.\n@c0@"
  en: "@a@bⓗAaah... Will I ever remember what day it is, will I?\n㈡\nⓗAnyway, I had a little chinwag with Sue after the museum closed today.\n@c0@"
  es: "@a@bⓕAaay... Nunca, nunca recuerdo qué día es...ⓖ.\n㈡\nⓕEn fin, hoy he tenido una charla con Nuray después de cerrar el museninoⓖ.\n@c0@"
  fr: "@a@bⓥAaah... Est-ce qu'un jour je me souviendrai du jour qu'on estⓡ\n㈡\nAujourd'hui, on a discuté un peu, Marie-Jo et moi, après la fermeture du musée.\n@c0@"
  it: "@a@bⓕCaro diario, ho pensato che forse potrei assumere un assistente che mi ricordi che giorno è.ⓖ\n㈡\nⓕComunque, oggi ho fatto quattro chiacchiere con Sue, dopo la chiusura del Museo.ⓖ\n@c0@"
  ja: "@a@b“○月×日\n　今日は　博物館を閉めてから\n　ミミちゃんと　おしゃべりをした。\n@c0@"
3:
  de: "@a@bDie kann vielleicht reden! Und hübsch ist sie auch noch.ⓟ\n@c0@"
  en: "@a@bⓗShe's a grand talker, than wan. And fair as a spring daisy too.ⓘ\n@c0@"
  es: "@a@bⓕLa chica es una gran conversadora. Y muy moninaⓖ.\n@c0@"
  fr: "@a@bQu'est-ce qu'elle cause bien et qu'est-ce qu'elle est jolieⓠⓦ\n@c0@"
  it: "@a@bⓕQuella ragazza è molto intelligente, oltre a essere un vero schianto. Se solo avessi novant'anni di meno, io... Beh, ci siamo capiti.ⓖ\n@c0@"
  ja: "@a@b“ミミちゃんは　お話が上手じゃのう。\n　かわいいのう。”\n@c0@"
4:
  de: "@a@b*: Wer hätte gedacht, dass es an einem solchen Ort ein Museum geben könnte?\n@c0@"
  en: "@a@b*: Whoever would have thought there'd be a museum in a place like this?\n@c0@"
  es: "@a@b*: ¿Quién iba a pensar que habría un museo en un sitio así?\n@c0@"
  fr: "@a@b*ⓢ Je n'aurais jamais pensé qu'il y avait un musée dans un endroit pareil.\n@c0@"
  it: "@a@b*: A chi sarà mai venuta l'idea di costruire un museo in un luogo del genere?\n@c0@"
  ja: "@a@b＊「こんなところに\n\t名産の　博物館が\n\tあったとはね。\n@c0@"
5:
  de: "@a@b*: Allerdings ist es irgendwie unheimlich, findet Ihr nicht?\n@c0@"
  en: "@a@b*: Mind you, it feels a bit creepy, don't you think?\n@c0@"
  es: "@a@b*: La verdad es que pone los pelos de punta, ¿no %H0860%Xcrees%Ycreéis%Z?\n@c0@"
  fr: "@a@b*ⓢ Pour dire la vérité, ça fait presque peur.\n@c0@"
  it: "@a@b*: Brrr!\nMi fa venire i brividi!\n@c0@"
  ja: "@a@b＊「しかし　ずいぶん\n\tさみしい感じだなあ…。\n@c0@"
6:
  de: "@a@b*: Ich bin auf diesen Ort gestoßen, als ich auf Reisen war, wisst Ihr.\n@c0@"
  en: "@a@b*: I just stumbled upon this place while I was on my travels, you know.\n@c0@"
  es: "@a@b*: Me tropecé con este lugar durante uno de mis viajes.\n@c0@"
  fr: "@a@b*ⓢ J'ai découvert cet endroit pendant l'un de mes voyages professionnels.\n@c0@"
  it: "@a@b*: Ero in viaggio di lavoro, quando mi hanno detto di questo posto.\n@c0@"
  ja: "@a@b＊「いやはや　ぐうぜん\n\tこのような建物を　発見して\n\tやってきたのですが…\n@c0@"
7:
  de: "@a@b*: Es ist ein sehr eindrucksvolles Gebäude, nicht? Wenn sie nun auch noch ein paar Sachen ausstellen würden, wäre das sensationell!\n@c0@"
  en: "@a@b*: It's a very grand building, isn't it? If they\r\njust had some things on display, this place\r\nwould be sensational!\n@c0@"
  es: "@a@b*: El edificio es magnífico, ¿verdad? ¡Si tuviesen alguna cosa expuesta, sería sensacional!\n@c0@"
  fr: "@a@b*ⓢ Le bâtiment est vraiment impressionnant, nonⓡ\nJe pense que ce serait encore mieux s'il y avait quelques pièces en exposition.\n@c0@"
  it: "@a@b*: L'edificio è molto bello.\nSe ci fosse anche qualche oggetto in esposizione, sarebbe un museo meraviglioso...\n@c0@"
  ja: "@a@b＊「ずいぶん　りっぱな建物ですね。\n\tこういう場所に　品物を展示すれば\n\tさぞかし　見ばえがするでしょうな。\n@c0@"
8:
  de: "@a@b*: Dat is' 'n mächtig feines Gebäude, nich'?\n@c0@"
  en: "@a@b*: 'E's a proper fine buildin' 'e is, en't 'e?\n@c0@"
  es: "@a@b*: Eⓘ un edificio muⓘ bonico, ¿a que sín?\n@c0@"
  fr: "@a@b*ⓢ Eh bahⓠ C'est du bâtiment comme on n'en fait plus, pas vraiⓡ\n@c0@"
  it: "@a@b*: Accidempoli, che bello che è 'sto palazzo!\n@c0@"
  ja: "@a@b＊「いやあ～\n\tこりゃ　りっぱな建物だなや！\n@c0@"
9:
  de: "@a@b*: Jetzt, wo hier tatsächlich ein paar Stücke gezeigt werden, kommt es einem gar nicht mehr so unheimlich vor, nicht?\n@c0@"
  en: "@a@b*: The place doesn't feel so creepy now there are actually a few exhibits on display, don't you think?\n@c0@"
  es: "@a@b*: Este sitio ya no da tanto miedo ahora que hay unas cuantas piezas expuestas, ¿verdad?\n@c0@"
  fr: "@a@b*ⓢ À dire vrai, cet endroit est moins effrayant maintenant qu'il y a quelques pièces en exposition.\n@c0@"
  it: "@a@b*: Ora che hanno esposto degli oggetti, l'edificio ha assunto un'aria decisamente più gradevole, no?\n@c0@"
  ja: "@a@b＊「だいぶ　名産品の数もふえ\n\t博物館らしく\n\tなってきましたね。\n@c0@"
10:
  de: "@a@b*: Tja, damit hatte ich nicht gerechnet. Es gibt zwar viele Ausstellungsstücke, aber sie sind ja alle genau gleich!\n@c0@"
  en: "@a@b*: Well, I wasn't expecting this. There are plenty of things on display, but they're all exactly the same!\n@c0@"
  es: "@a@b*: Vaya, no esperaba algo así. ¡Hay un montón de piezas en exposición, pero son todas iguales!\n@c0@"
  fr: "@a@b*ⓢ Eh bien, je ne m'attendais pas à ça.\nIl y a beaucoup de pièces en exposition, mais ce sont toutes les mêmesⓠ\n@c0@"
  it: "@a@b*: Hanno riempito le sale con più copie dello stesso oggetto. Dev'essere una di quelle incomprensibili mostre di arte moderna...\n@c0@"
  ja: "@a@b＊「こりゃあ　びっくりですなあ！\n\t全部　同じ物ばっかりだ！\n@c0@"
11:
  de: "@a@b*: Mit diesen Ausstellungsstücken kann man sich direkt vorstellen, wie die Menschen anderswo leben, nicht? Das ist wirklich faszinierend.\n@c0@"
  en: "@a@b*: You can start to imagine what people's lives in different places are like when you look at these exhibits, can't you? It's really quite fascinating.\n@c0@"
  es: "@a@b*: Uno puede imaginarse cómo son las vidas de las personas en distintos lugares con solo visitar la exposición, ¿no %H0860%Xcrees%Ycreéis%Z? Es fascinante.\n@c0@"
  fr: "@a@b*ⓢ Quand on regarde ces pièces, on peut imaginer la vie des gens partout dans le monde.\nJe trouve ça vraiment fascinant.\n@c0@"
  it: "@a@b*: Avere la possibilità di ammirare souvenir provenienti da terre lontane è davvero un'ottima cosa! Consiglierò questo museo a tutti i miei amici!\n@c0@"
  ja: "@a@b＊「こうして名産品を　見ていると\n\tその地域の人々の生活が\n\tうかがえるようですなあ。\n@c0@"
12:
  de: "@a@b*: Anscheinend wurden all diese Stücke vom Kurator selbst gesammelt. Höchstpersönlich! Der muss ja ganz schön was auf dem Kasten haben, nicht?\n@c0@"
  en: "@a@b*: Apparently all these articles were collected by\r\nthe curator himself. Personally! He must be quite\r\na man, eh?\n@c0@"
  es: "@a@b*: Parece que estos artículos los ha recopilado el propio gestor del museo. ¡Él mismo en persona! Debe de ser un personaje notable, ¿eh?\n@c0@"
  fr: "@a@b*ⓢ Apparemment, toutes ces pièces ont été rassemblées par le conservateur en personne.\nOui, en personneⓠ Ça doit être quelqu'unⓠ\n@c0@"
  it: "@a@b*: Pare che il direttore abbia raccolto personalmente tutti i souvenir esposti.\nDev'essere un tipo veramente in gamba!\n@c0@"
  ja: "@a@b＊「ここの名産品は　館長　自らが\n\t集めていらっしゃるようですよ。\n\tすごいですよねえ。\n@c0@"
13:
  de: "@a@b*: Je seltener die Ausstellungsstücke sind, umso mehr Besucher zieht ein Museum an. Ⓠ La-la, la-lah! Im Museum ist es fein! Da will ich für immer sein! Ⓡ\n@c0@"
  en: "@a@b*: The rarer the exhibits in a museum, the more visitors it attracts. Ⓠ La-la, la-lah! And I say to myself, what a won-der-ful knackatoriiie! Ⓡ\n@c0@"
  es: "@a@b*: Cuanto más peculiares son las piezas de un museo, más visitantes atrae. Ⓠ La-la-la, la-la-la... Ⓡ ¡Bonito, todo me parece bonitoooo! Ⓡ\n@c0@"
  fr: "@a@b*ⓢ Plus les pièces exposées dans un musée sont rares, plus elles attirent de visiteurs. Ⓠ La, la, laⓠ Belles, belles, belles comme le jourⓠ Ⓡ\n@c0@"
  it: "@a@b*: Più gli oggetti esposti sono rari, più un museo attrae visitatori. Ⓠ Trovareeeh... Oh-oh! Ⓠ\nⓇI souveniiir... Di rarità su-u-uperiooor...Ⓡ\n@c0@"
  ja: "@a@b＊「名産博物館　というくらいだから\n\t名産レベルの高いものが　かざってあると\n\tお客さんも　増えるでしょうね。\n@c0@"
