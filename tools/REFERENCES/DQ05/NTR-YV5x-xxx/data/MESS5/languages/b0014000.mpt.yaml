  fr: "@a@b*ⓢ Mais il devrait y avoir un portrait à l'intérieur.\nJe me demande ce qu'il est devenu.\n@c0@"
  it: "@a@b*: Ma non doveva esserci un ritratto all'interno del medaglione...?\nUhm, forse ricordo male...\n@c0@"
  ja: "@a@b＊「しかし　あのペンダントにぴったりの\n\t姿絵を　描かせていたはずだが……\n\tあの絵は　どうしたんだろうな。\n@c0@"
214:
  de: "@a@b*: Na! Das ist das Medaillon von Königin Magda von Humburg.\n@c0@"
