  es: "@a@bPero parece haber unas palabras talladas en el fondo. %0%a000090 empieza a leer.\n@c0@"
  fr: "@a@bEn revanche, un message est gravé au fond. %0%a000090 déchiffre ce qui est inscrit.\n@c0@"
  it: "@a@bSul fondo dello scrigno, però, sono scritte delle parole.\n%0%a000090 comincia a leggere...\n@c0@"
  ja: "@a@bしかし　宝箱の底に　なにやら\n文字がきざんである……。\n%a000090は　その文字を読んだ。\n@c0@"
382:
  de: "@a@bⓞEs war mir zu peinlich, dir das ins Gesicht zu sagen, %a000090, darum dachte ich, ich schreibe es lieber hier auf.\n@c0@"
  en: "@a@bⓗI was too embarrassed to say this to your\nface, %a000090, so I thought I'd write it\nhere instead.\n@c0@"
  es: "@a@bⓕMe da vergüenza decírtelo en persona, %a000090, así que pensé que sería mejor escribirlo aquíⓖ.\n@c0@"
  fr: "@a@bⓥJ'aurais été trop gêné de te dire ça de vive voix, %a000090. Alors j'ai préféré te l'écrire.\n@c0@"
  it: "@a@bⓕ%0%a000090, amico mio, non avrei mai avuto il coraggio di dirti queste cose di persona, così ho pensato di scriverle qui.ⓖ\n@c0@"
  ja: "@a@b“%a000090。　お前に　ちょくせつ\n　話すのは　照れくさいから\n　ここに　書きのこしておく。\n@c0@"
383:
  de: "@a@bEs vergeht immer noch kein Tag, an dem ich mich nicht einen Moment besinne und an deinen Vater denke.\n@c0@"
  en: "@a@bⓗThere's not a day goes by even now when I don't spare a moment to remember your father.\n@c0@"
  es: "@a@bⓕTodavía no pasa un solo día sin que me acuerde de tu padreⓖ.\n@c0@"
  fr: "@a@bEncore maintenant, tous les jours, je me réserve quelques instants pour penser à ton père.\n@c0@"
  it: "@a@bⓕNon c'è giorno della mia vita in cui io non dedichi un pensiero a quell'uomo forte e coraggioso che era tuo padre.ⓖ\n@c0@"
  ja: "@a@b“お前の　親父さんのことは　今でも\n　１日だって　忘れたことはない。\n@c0@"
384:
  de: "@a@bAls wir Sklaven waren, verspürte ich immer den Drang, das wiedergutzumachen: die Tatsache, dass ich weiterleben durfte, während er starb.\n@c0@"
  en: "@a@bⓗDuring our time as slaves, I always had an urge to make it up to you, the fact that I'd lived when he died.\n@c0@"
  es: "@a@bⓕDurante el tiempo que fuimos esclavos quise pagarte el que él muriera para que yo pudiera vivirⓖ.\n@c0@"
  fr: "@a@bLorsque nous étions esclaves, j'ai toujours tout fait pour me faire pardonner le fait d'être encore en vie alors que ton père s'était fait tuer.\n@c0@"
  it: "@a@bⓕQuando eravamo schiavi, mille volte avrei voluto chiederti perdono. Perché io ero vivo, e lui non c'era più...ⓖ\n@c0@"
  ja: "@a@b“あの　ドレイの日々に\n　オレが生き残れたのは　いつか\n　お前に　借りを返さなくてはと……\n@c0@"
385:
  de: "@a@bDieser Drang hat mir geholfen, einen Tag nach dem anderen zu überstehen und die ganze schreckliche Zeit zu überleben.\n@c0@"
  en: "@a@bⓗIt was that urge that took me through each day and helped me survive that awful time.\n@c0@"
  es: "@a@bⓕEso me hizo soportar el día a día y me ayudó a sobrevivir a aquel horrorⓖ.\n@c0@"
  fr: "@a@bC'est ce qui m'a poussé à me lever chaque jour et m'a permis de résister tout ce temps.\n@c0@"
  it: "@a@bⓕIl desiderio di ottenere il tuo perdono mi ha dato la forza per sopravvivere in quell'inferno per dieci lunghi anni...ⓖ\n@c0@"
  ja: "@a@b“そのために　がんばれたからだと\n　思っている。\n@c0@"
386:
  de: "@a@bIch glaube, ich kann nichts tun, was dich bei deiner Suche nach dem legendären Helden weiterbringen würde.\n@c0@"
  en: "@a@bⓗI don't imagine there's anything in my power I can do to assist you in your quest for the legendary hero.\n@c0@"
  es: "@a@bⓕNo se me ocurre qué hacer para ayudarte en tu búsqueda del héroe legendarioⓖ.\n@c0@"
  fr: "@a@bJe ne pense pas pouvoir faire quoi que ce soit pour t'aider dans ta quête du héros légendaire.\n@c0@"
  it: "@a@bⓕNon credo di poter far molto per aiutarti a trovare l'Eroe Leggendario.ⓖ\n@c0@"
  ja: "@a@b“伝説の勇者をさがすという　お前の目的は\n　オレの力など　とても　役に\n　立ちそうにないものだが……\n@c0@"
387:
  de: "@a@bAber ich hoffe aufrichtig, dass es dir doch irgendwie hilft, wenn ich dieses Reich klug regiere und mein Volk beschütze.\n@c0@"
  en: "@a@bⓗBut it's my sincere hope that ruling this kingdom wisely and protecting my people will be of some help to you in some way or other.\n@c0@"
  es: "@a@bⓕPero tengo la sincera esperanza de que ayudar a regir sabiamente este reino y proteger a mi pueblo sirva de algo, de un modo u otroⓖ.\n@c0@"
  fr: "@a@bMais j'espère sincèrement que diriger ce royaume et protéger mes sujets sera une façon de t'aider.\n@c0@"
  it: "@a@bⓕMa cercherò di essere un vero uomo e un saggio governante, nella speranza che, un giorno, io possa supportarti nella tua ricerca.ⓖ\n@c0@"
  ja: "@a@b“この国を守り　人びとを\n　見守ってゆくことが　やがて　お前の\n　助けになるんじゃないかと思う。\n@c0@"
388:
  de: "@a@bDu wirst immer mein Lakai sein, %a000090... Ha ha ha! Nein, du wirst mir immer ein lieber Freund sein.ⓟ\n@c0@"
  en: "@a@bⓗYou'll always be my lackey, %a000090... Ha ha ha! No, you'll always be my dear friend.ⓘ\n@c0@"
  es: "@a@bⓕSiempre serás mi lacayo, %a000090... ¡Ja, ja, ja! No. Siempre serás mi querido amigoⓖ.\n@c0@"
  fr: "@a@bTu seras toujours mon laquais, %a000090...\nHa ha haⓠ\nNon, tu seras toujours mon plus cher ami.ⓦ\n@c0@"
  it: "@a@bⓕSarai per sempre il mio aiutante, %a000090... Ah ah ah! No, sarai per sempre il mio miglior amico.ⓖ\n@c0@"
  ja: "@a@b“%a000090　お前は　いつまでも\n　オレの子分……　じゃなかった\n　友だちだぜ。　　　　ヘンリー”\n@c0@"
389:
  de: "@aHarry@bWie? Du konntest das Hochzeitsandenken nicht in der Schatztruhe finden?\n@c0@"
