456:
  de: "@a@b*: Was? Ihr seid ein Freund von Bianca?\n@c0@"
  en: "@a@b*: Eh? You're a friend of Bianca's, are you?\n@c0@"
  es: "@a@b*: ¿Cómo? Eres %A0110%Xamigo%Z%B0110%Xamiga%Z de Bianca, ¿eh?\n@c0@"
  fr: "@a@b*ⓢ Commentⓡ Vous êtes un%A0110%X%Z%B0110%Xe%Z ami%A0110%X%Z%B0110%Xe%Z de Biancaⓡ\n@c0@"
  it: "@a@b*: Eh?!\nMa tu sei un amico di Bianca?!\n@c0@"
  ja: "@a@b＊「ん？　なんじゃと？\n\tお前さんは　ビアンカちゃんの\n\t知り合い？\n@c0@"
457:
  de: "@a@b*: Und Bianca und Weißi geht es gut? Das freut mich!\n@c0@"
  en: "@a@b*: And Bianca and Whitey are both keepin' well? That's good to hear!\n@c0@"
  es: "@a@b*: ¿Así que a Bianca y a Doptada les va bien, dices? ¡Me alegro de oírlo!\n@c0@"
  fr: "@a@b*ⓢ Et Bianca et Al vont bien tous les deuxⓡ\nVoilà une bonne nouvelleⓠ\n@c0@"
  it: "@a@b*: E così Bianca e suo padre stanno bene? Ah, sono proprio felice di saperlo!\n@c0@"
  ja: "@a@b＊「そうか　そうか！\n\tダンカンさんも　ビアンカちゃんも\n\t元気じゃったか……。\n@c0@"
458:
  de: "@a@b*: Da bin ich jetzt aber sehr erleichtert. Dann will ich die Tage mal rüber nach Utensiel gehen und bei ihnen vorbeischauen.\n@c0@"
  en: "@a@b*: Now I can breathe a big sigh of relief. I'll have to pop over to that Stockenbarrel one of these days and pay them a visit.\n@c0@"
  es: "@a@b*: Ahora ya puedo respirar tranquilo. Un día de estos me pasaré por Clavis a hacerles una visita.\n@c0@"
  fr: "@a@b*ⓢ Je suis vraiment soulagé. Il faudra que j'aille les voir à Saint Éloi un de ces jours.\n@c0@"
  it: "@a@b*: Sì, è davvero una buona notizia.\nUn giorno o l'altro andrò ad Aprianuam e farò una visita a sorpresa al caro Whitblanche.\n@c0@"
  ja: "@a@b＊「それを聞いて　わしも\n\t安心したわい。　いつか　その\n\t山奥の村にも　行きたいのう。\n@c0@"
459:
  de: "@a@b*: Meine Güte! Ihr wollt den legendären Helden suchen? Ist das denn eine gute Idee?\n@c0@"
  en: "@a@b*: Good heavens! You're goin' off in search of the legendary hero!? Are you sure that's wise?\n@c0@"
  es: "@a@b*: ¡Cielo santo! ¿Vas a buscar al héroe legendario? ¿Te parece una buena idea?\n@c0@"
  fr: "@a@b*ⓢ Par la Déesseⓠ Tu vas partir à la recherche de ce héros légendaireⓡ Tu es sûr de ce que tu faisⓡ\n@c0@"
  it: "@a@b*: %H0860%XVuoi%YVolete%Z trovare l'Eroe Leggendario?!\nOh, mia buona dea!\nMa %H0860%Xparli sul serio%Yparlate sul serio%Z?!\n@c0@"
  ja: "@a@b＊「まあ！　伝説の勇者さまを\n\tさがし出すですって！？\n\t本気なの？\n@c0@"
460:
  de: "@a@b*: Da fällt mir ein, ich habe vor kurzem drüben in Wittenhausen Gerede von einem legendären Helden gehört.\n@c0@"
  en: "@a@b*: Actually, I seem to remember hearin' some talk about the legendary hero over in Roundbeck long ago.\n@c0@"
  es: "@a@b*: En realidad, recuerdo haber oído algo acerca del héroe legendario en Golfo Blanco, hace tiempo.\n@c0@"
  fr: "@a@b*ⓢ Je me souviens avoir entendu parler de ce héros légendaire il y a bien longtemps, alors que je séjournais à Blanchecombe.\n@c0@"
  it: "@a@b*: Uhm, forse posso %H0860%Xaiutarti%Yaiutarvi%Z...\nSe non ricordo male, molto tempo fa sentii parlare dell'Eroe Leggendario a Blankenburg...\n@c0@"
  ja: "@a@b＊「そうなの……。　そういえば昔\n\tアルカパの町で　勇者さまの\n\t話を聞いたことがあるわ。\n@c0@"
461:
  de: "@a@b*: Da hat Eure alte Freundin Bianca gelebt. Was wohl aus ihr geworden ist?\n@c0@"
  en: "@a@b*: That's where that old friend of yours, Bianca, lived. I wonder how she's doin' now.\n@c0@"
  es: "@a@b*: Ahí vivía esa vieja amiga tuya, Bianca. Me pregunto cómo le irá.\n@c0@"
  fr: "@a@b*ⓢ C'est là que ta vieille amie Bianca habitait. Je me demande comment elle va d'ailleurs.\n@c0@"
  it: "@a@b*: A Blankenburg viveva la tua vecchia amica Bianca. Ti ricordi di lei, vero?\nChissà come sta adesso...\n@c0@"
  ja: "@a@b＊「アルカパといえば　%a000090の\n\tおさななじみの　ビアンカさんも\n\tいたわね。　お元気かしら。\n@c0@"
462:
  de: "@a@b*: Oh! Du liebe Güte! Ihr beide habt geheiratet?\n@c0@"
  en: "@a@b*: Oh! Goodness me! The two of you were married, you say?\n@c0@"
  es: "@a@b*: ¡Ah!, ¡por la Diosa! ¿Que os habéis casado, dices?\n@c0@"
  fr: "@a@b*ⓢ Ohⓠ Par la Déesseⓠ Vous vous êtes mariésⓠⓑ\n@c0@"
  it: "@a@b*: Vi siete sposati?!\nSiete marito e moglie?!\nQuesta sì che è una notizia!\n@c0@"
  ja: "@a@b＊「え？　なんですって？\n\t%a000090と　ビアンカさんが\n\t結婚を！？\n@c0@"
463:
  de: "@a@b*: Dann ist dieses hübsche Mädchen an Eurer Seite wohl Bianca selbst?\n@c0@"
  en: "@a@b*: Then this lovely thing with you\r\nmust be Bianca herself!\n@c0@"
  es: "@a@b*: ¡Entonces, esta chica tan guapa debe de ser la mismísima Bianca!\n@c0@"
  fr: "@a@b*ⓢ Donc, cette jolie jeune fille doit être Biancaⓠ\n@c0@"
  it: "@a@b*: Allora la splendida ragazza che è al tuo fianco è proprio Bianca!\n@c0@"
  ja: "@a@b＊「まあ！　それじゃ\n\tその　ステキな人が\n\tビアンカさんね！\n@c0@"
464:
  de: "@aBianca@bDas stimmt, Schwester! Wir haben uns ja lange nicht gesehen! %0%a000090 und ich ziehen jetzt gemeinsam durch die Welt.\n@c0@"
  en: "@aBianca@bThat's right, sister! Long time no see. %0%a000090 and I are travellin' the world together now.\n@c0@"
  es: "@aBianca@b¡Eso es, hermana! ¡Cuánto tiempo! Yo y %a000090 estamos viajando juntos por el mundo y tal.\n@c0@"
  fr: "@aBianca@bC'est bien ça, ma sœurⓠ Ça faisait longtemps qu'on ne s'était pas vues. %0%a000090 et moi parcourons le monde ensemble, maintenant.\n@c0@"
