  es: "@a@b*: ¡Por la Diosa! ¡Un horrorizacuervos!\n@c0@"
  fr: "@a@b*ⓢ Quelle horreurⓠ Un épouvanteurⓠ\n@c0@"
  it: "@a@b*: Santi numi! Uno spaventamostri!\nMamma mia, quant'è brutto!\n@c0@"
  ja: "@a@b＊「あわわわ…\n\tなんだ　あの　カカシは！\n@c0@"
157:
  de: "@a@b*: Was hat man sich nur dabei gedacht, eine derart furchteinflößende Vogelscheuche anzufertigen?\n@c0@"
