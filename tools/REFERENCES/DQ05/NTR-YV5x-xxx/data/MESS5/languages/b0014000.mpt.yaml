  es: "@a@b*: La Puebla del Heno debió de sufrir una terrible plaga si necesitaron eso para espantarla. No vale nada, estoy bastante convencido.\n㈡\n*: ¡Sin valor, pero impresionante!\n@c0@"
  fr: "@a@b*ⓢ Les gens de Chaumes doivent avoir de sacrés rôdeurs pour en venir à de telles extrémités. Ça ne vaut rien... à part une belle frayeurⓠ\n@c0@"
  it: "@a@b*: Quegli zoticoni di Punta Campestre avranno dovuto tenere alla larga un mostro di quelli tosti, per realizzare una roba tanto orribile!\n㈡\n*: Comunque, questo coso non vale una cicca.\n@c0@"
  ja: "@a@b＊「あれを作った　カボチ村には\n\tよほどの敵が　いたんだな。\n\t価値はないが　すごいカカシだ！\n@c0@"
159:
  de: "@a@b*: Oh, das Zeug ist der absolute Knüller! Sprungsprudel ist der Stoff, aus dem die Legenden sind, wisst Ihr.\n@c0@"
