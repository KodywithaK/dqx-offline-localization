  ja: "@a@b＊「いったい　どうしたら\n\tあんなに　恐ろしい　カカシを\n\t作れるんだ？\n@c0@"
158:
  de: "@a@b*: Die Bauernsiepener mussten offenbar etwas ganz Fürchterliches abschrecken, wenn sie so etwas erschaffen haben. Das ist sicher wertlos. Und wie!\n@c0@"
