  es: "@aFroilán@b¿Mmm? ¿No encontraste el recuerdo de boda en el cofre del tesoro?\n@c0@"
  fr: "@aHarry@bCommentⓡ Tu n'as pas trouvé ton cadeau dans le coffreⓡ\n@c0@"
  it: "@aRobert@bChe cosa? Non hai trovato la bomboniera nello scrigno? Oh, ma che strano... Ah ah ah!\n@c0@"
  ja: "@a@bヘンリー「え？　宝箱に\n\t結婚式の記念品なんて\n\t入ってなかったって？\n@c0@"
390:
  de: "@aHarry@bHa ha ha! Du bist genauso leicht hereinzulegen wie früher!\n@c0@"
  en: "@aHarry@bHa ha ha! You're just as easy to trick as you\r\never were!\n@c0@"
  es: "@aFroilán@b¡Ja, ja, ja! ¡Igual de crédulo que siempre!\n@c0@"
  fr: "@aHarry@bHa ha haⓠ Tu tombes toujours aussi facilement dans le panneauⓠ\n@c0@"
  it: "@aRobert@bAccidenti, %a000090! Ma ci caschi sempre, eh? Ah ah ah!\n@c0@"
  ja: "@a@bヘンリー「わっはっは！\n\tお前は　あいかわらず\n\tだまされやすいヤツだな。\n@c0@"
391:
  de: "@aHarry@bAlso gut. Diesmal gebe ich es dir, wie es sich gehört.\n@c0@"
  en: "@aHarry@bVery well. I'll give it to you properly this time.\n@c0@"
  es: "@aFroilán@bMuy bien. Te lo daré como corresponde.\n@c0@"
  fr: "@aHarry@bAllez. Cette fois, je vais te le donner pour de bon.\n@c0@"
  it: "@aRobert@bCome vedi, non ho perso l'abitudine di fare qualche innocente scherzetto! Ora, però, voglio darti davvero la bomboniera.\n@c0@"
  ja: "@a@bヘンリー「じゃあ　今度こそ　本当に\n\tわたすよ。　この　記念オルゴールだ。\n@c0@"
392:
  de: "@a@bHarry überreicht eine wunderschön gefertigte Spieldose!\n@c0@"
  en: "@a@bHarry proffers a beautifully crafted marital organ!\n@c0@"
  es: "@a@b¡Froilán te ofrece una hermosa caja de música nupcial!\n@c0@"
  fr: "@a@bHarry lui tend une magnifique boîte à musiqueⓠ\n@c0@"
  it: "@a@bRobert porge a %a000090 un bellissimo carillon.\n@c0@"
  ja: "@a@bヘンリーは　美しく細工された\nオルゴールを　さしだした！\n@c0@"
393:
  de: "@a@b%0%a000090 erhält die Spieldose!\n@c0@"
  en: "@a@b%0%a000090 receives the marital organ!\n@c0@"
  es: "@a@b%0%a000090 recibe la caja de música nupcial.\n@c0@"
