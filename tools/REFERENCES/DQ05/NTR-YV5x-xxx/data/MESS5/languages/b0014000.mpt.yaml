  fr: "@a@b*ⓢ Quand on regarde ces pièces, on peut imaginer la vie des gens partout dans le monde.\nJe trouve ça vraiment fascinant.\n@c0@"
  it: "@a@b*: Avere la possibilità di ammirare souvenir provenienti da terre lontane è davvero un'ottima cosa! Consiglierò questo Museo a tutti i miei amici!\n@c0@"
  ja: "@a@b＊「こうして名産品を　見ていると\n\tその地域の人々の生活が\n\tうかがえるようですなあ。\n@c0@"
56:
  de: "@a@b*: Ach, so viele nette kleine Dinge! Da wird einem erst klar, wie schön es doch auf unserer Welt ist.\n@c0@"
  en: "@a@b*: My, what a lot of pretty little knick-knacks!\nIt makes you realise what a world we live in.\n@c0@"
  es: "@a@b*: ¡Vaya, cuántas cosinas, y qué preciosas!\r\nAl verlas se da una cuenta del mundo en que vivimos.\n@c0@"
  fr: "@a@b*ⓢ Eh bien, quelle jolie collection d'objetsⓠ Ils nous permettent de réaliser dans quel monde on vit.\n@c0@"
  it: "@a@b*: Che splendida raccolta di oggetti!\nVisitare il Museo del Souvenir è un po' come fare il giro del mondo. È un'esperienza meravigliosa!\n@c0@"
  ja: "@a@b＊「きれいな名産品が　あるもんだねえ。\n\t世界は　広いねえ。\n@c0@"
57:
  de: "@a@b*: Wenn ich berühmt genug werde, wird hier vielleicht mal eines meiner Gerichte ausgestellt. Was? Ich muss erst ⓞHau Kusineⓟ und ⓞKordo blödⓟ beherrschen?\n@c0@"
  en: "@a@b*: Maybe I'll get one o' my prize dishes on display in 'ere if I get famous enough. Wot's that? I'll 'ave to master ⓗoat cuisineⓘ and ⓗcord on blueⓘ first?\n@c0@"
  es: "@a@b*: A lo mejor, si me hago famoso de verdad, acaban poniendo uno de mis platos aquí.\n㈡\n*: ¿Qué %H0860%Xte%Yos%Z parece? ¿Tendré que estudiar para hacer ⓕcroquetas líquidasⓖ y ⓕtortilla sin huevosⓖ?\n@c0@"
  fr: "@a@b*ⓢ Peut-être qu'une de mes créations gastronomiques sera exposée ici si je deviens assez célèbre. Comment ça, c'est pas pour demainⓡ\n@c0@"
  it: "@a@b*: Mi chiedo pourquoi non abbiano desciso di esporre uno dei miei famosi piatti in questo Museo...\nForse il directeur teme che i visitatori lo mansgino?\n@c0@"
  ja: "@a@b＊「ウデをあげたら\n\t私の料理も　名産になるかなあ。\n@c0@"
58:
  de: "@a@b*: Wenn ich groß bin, will ich auch was machen. Kann ich das dann auch hier ausstellen?\n@c0@"
  en: "@a@b*: When I grow up, I'm going to make something too. Can I put it on display here?\n@c0@"
  es: "@a@b*: Cuando sea mayor también construiré alguna cosa. ¿La podré poner aquí para que la vean?\n@c0@"
  fr: "@a@b*ⓢ Quand je serai grande, moi aussi je fabriquerai quelque chose. Est-ce que je pourrai l'exposer iciⓡ\n@c0@"
  it: "@a@b*: Da grande creerò un oggetto tanto bello che il direttore del Museo mi implorerà di permettergli di esporlo! Che dici, ci riuscirò?\n@c0@"
  ja: "@a@b＊「あたしも　大きくなったら\n\tなにか　つくるー！\n\tできたら　ここに　かざってくれる？\n@c0@"
59:
  de: "@a@b*: Toll! Ich werde berühmt!\n@c0@"
  en: "@a@b*: Cool! I'm going to be famous!\n@c0@"
  es: "@a@b*: ¡Genial! ¡Voy a ser famosa!\n@c0@"
  fr: "@a@b*ⓢ Génial, je vais devenir célèbreⓠ\n@c0@"
  it: "@a@b*: Che bello!\nTutti vorranno comprare le mie creazioni!\nDiventerò ricca e famosa!\n@c0@"
  ja: "@a@b＊「わ～い　ありがとー！\n@c0@"
60:
  de: "@a@b*: Och, wieso denn nicht? Das ist gemein!\n@c0@"
  en: "@a@b*: Oh, why not? That's not fair!\n@c0@"
  es: "@a@b*: ¿Y por qué no? ¡No es justo!\n@c0@"
  fr: "@a@b*ⓢ Ah bonⓡ Pourquoi pasⓡ C'est pas justeⓠ\n@c0@"
  it: "@a@b*: Grazie per l'incoraggiamento, eh?!\n@c0@"
  ja: "@a@b＊「うえ～ん！\n@c0@"
61:
  de: "@a@b*: Dieser Schnickschnack ist so bezaubernd, ist er nicht?\n@c0@"
  en: "@a@b*: These knick-knacks are all so pretty, aren't they?\n@c0@"
  es: "@a@b*: Todas estas cosinas son preciosas, ¿verdad que sí?\n@c0@"
  fr: "@a@b*ⓢ Toutes ces pièces de collection sont vraiment jolies.\n@c0@"
  it: "@a@b*: Che belli che sono questi souvenir...\n@c0@"
  ja: "@a@b＊「名産品とは\n\tきれいなもんやのう。\n@c0@"
62:
  de: "@a@b*: Ich hätte niemals erwartet, auf Erden auf einen so wundervollen Ort zu stoßen. Da sieht man mal wieder: Die Wege der Göttin sind unergründlich.\n@c0@"
  en: "@a@b*: I never expected to happen across such a marvellous place on an earthly journey.\r\nThe Goddess works in mysterious ways.\n@c0@"
  es: "@a@b*: No creí que me fuese a cruzar con un lugar tan maravilloso durante un viaje terrenal.\r\nLos caminos de la Diosa son misteriosos.\n@c0@"
  fr: "@a@b*ⓢ Je n'aurais jamais pensé voir un endroit si joli sur notre terre. Les voies de la Déesse sont impénétrables.\n@c0@"
  it: "@a@b*: Non credevo che al mondo esistessero oggetti tanto belli! È evidente che la dea ha ispirato i creatori di questi capolavori...\n@c0@"
  ja: "@a@b＊「旅のとちゅうで　このような場所に\n\t出会えて　思わぬ　休息になりました。\n\tありがたいことですわ。\n@c0@"
63:
  de: "@a@b*: Dass eine Zivilisation derart exquisit gearbeitete, wunderbare Kunstgegenstände hervorbringt ⓚⓛ hmm. Interessant. Höchst interessant.\n@c0@"
  en: "@a@b*: For a civilisation to create such finely-crafted, beautiful works of art...\r\nHmm. Interesting, most interesting.\n@c0@"
  es: "@a@b*: Y pensar que una civilización ha sido capaz de crear estas bellísimas obras de arte...\r\nMmm... Interesante, muy interesante.\n@c0@"
  fr: "@a@b*ⓢ Une civilisation capable de créer des œuvres d'art si fines et si délicates... Mmm. C'est vraiment très intéressant.\n@c0@"
  it: "@a@b*: Gli artigiani che hanno creato oggetti di fattura tanto squisita sono dotati di capacità artistiche fuori dal comune. Bravissimi!\n@c0@"
  ja: "@a@b＊「こんなに　美しい名産を作る\n\t地域の人々の　生活とは…\n\tう～ん　じつに　興味深いですな。\n@c0@"
64:
  de: "@a@b*: Ich bin schon lange in Rente, aber es ist tröstlich zu sehen, dass die Arbeit von uns Kunsthandwerkern für die Jugend bewahrt wird.\n@c0@"
  en: "@a@b*: I've been retired for many a long year now, but it's a comfort to know the work of us craftsmen will be preserved for the young ones to see.\n@c0@"
  es: "@a@b*: Ya llevo muchos años jubilado, pero es un alivio ver que el trabajo de los artesanos se va a conservar para que los jóvenes puedan verlo.\n@c0@"
  fr: "@a@b*ⓢ J'ai pris ma retraite il y a longtemps, mais ça fait plaisir de savoir que notre travail à nous, les artisans, est exposé pour que les jeunes le voient.\n@c0@"
  it: "@a@b*: Questo Museo è meraviglioso! Aver realizzato un luogo per la conservazione delle opere di noi artigiani è stata un'idea davvero geniale.\n@c0@"
  ja: "@a@b＊「わしは　とうに　引退したが\n\tわしらの技は　りっぱに\n\t受けつがれておるようじゃわい。\n@c0@"
65:
  de: "@a@b*: Ich kann mich wirklich nicht entscheiden, welches Kunststück ich für meine Gattin zu Hause kaufen soll. Vielleicht sollte ich einfach alles nehmen!\n@c0@"
  en: "@a@b*: I really can't decide which artefact I should purchase for my little precious back home.\r\nMaybe I'll just buy the lot!\n@c0@"
  es: "@a@b*: No soy capaz de decidir qué quiero comprar para mi amor, que me espera en casa.\r\n¡Quizá será mejor que me lo lleve todo!\n@c0@"
  fr: "@a@b*ⓢ Je ne sais toujours pas quel objet je vais acheter à ma petite femme. Peut-être que je vais tout prendreⓠ\n@c0@"
  it: "@a@b*: Vorrei portarmi a casa un regalino, ma non so quale di questi graziosi ninnoli acquistare.\nUhm, forse mi comprerò tutto il Museo!\n@c0@"
  ja: "@a@b＊「娘の　おみやげに\n\tなにを　買って帰ろうか\n\t参考にさせてもらってますよ。\n@c0@"
66:
  de: "@a@b*: Nun sieh sich einer diese bezaubernden Stücke an... Oh, ich spüre schon, wie mich die Muse küsst! War einst ein Kurator namens %a000090...\n@c0@"
  en: "@a@b*: Look at all these beautiful items! I feel a poem coming on... There once was a curator called %a000090...\n@c0@"
  es: "@a@b*: ¡Qué objetos tan bellos! Siento que me llega la inspiración... Había una vez un gestor llamado %a000090...\n@c0@"
  fr: "@a@b*ⓢ Admirez toutes ces pièces magnifiquesⓠ\nJe sens l'inspiration venir... Il était une fois un conservateur appelé %a000090...\n@c0@"
  it: "@a@b*: Questi oggetti stimolano la mia vena poetica!\nOh, %a000090, nobile signore... \nDel Museo del Souvenir tu sei il direttore!\n@c0@"
  ja: "@a@b＊「ラララ　美しい名産品に\n\tかこまれる　私は\n\t幸せ～　ラララ～～！\n@c0@"
67:
  de: "@a@b*: Gut, gut! Ich freue mich zu sehen, dass mein Land ordnungsgemäß vertreten ist.\n@c0@"
  en: "@a@b*: Good, good! I'm glad to see my country's been properly represented.\n@c0@"
  es: "@a@b*: ¡Bien, muy bien! Me alegra ver que mi país está representado de forma adecuada.\n@c0@"
  fr: "@a@b*ⓢ C'est bienⓠ Je suis heureux de voir que ma contrée est correctement représentée.\n@c0@"
  it: "@a@b*: Bene, molto bene.\nSono lieto di vedere che la mia nazione è degnamente rappresentata nel Museo del Souvenir.\n@c0@"
  ja: "@a@b＊「我が国が　ほこる品も\n\tかざられて　おりましたわい。\n@c0@"
68:
  de: "@a@b*: Da unsere Spezialität hier ausgestellt wird, kommen sicher bald ein paar Touristen mehr zu uns.\n@c0@"
  en: "@a@b*: With our speciality on display here, we should see a few more tourists visiting!\n@c0@"
  es: "@a@b*: ¡Con nuestras especialidades expuestas, seguro que ahora vendrán más turistas!\n@c0@"
  fr: "@a@b*ⓢ Nous devrions voir plus de touristes maintenant que notre production est exposée ici.\n@c0@"
  it: "@a@b*: Il manufatto tipico esposto qui farà certamente crescere il numero di turisti che visiteranno il mio paese!\n@c0@"
  ja: "@a@b＊「これで　我が国への\n\t旅人も　ふえるかもしれませんな。\n@c0@"
69:
  de: "@a@b*: Ich wünschte, jemand würde mir mal was Kleines Hübsches schenken.\n@c0@"
  en: "@a@b*: I wish someone would give me a pretty little\r\ntrinket sometime.\n@c0@"
  es: "@a@b*: Me gustaría que alguien me regalase una baratija alguna vez.\n@c0@"
  fr: "@a@b*ⓢ J'aimerais bien que quelqu'un m'offre une jolie petite babiole un jour.\n@c0@"
  it: "@a@b*: Quanto vorrei avere un fidanzato che mi regalasse uno di questi graziosi oggettini!\n@c0@"
  ja: "@a@b＊「わたしも　いつか\n\tきれいな名産品を　持ってみたいな。\n@c0@"
70:
  de: "@a@b*: 'ne ganz schön schicke Bude is' dat hier, aber dat Zeug, wat sie hier zeigen, is' ziemlich komisch.\n@c0@"
  en: "@a@b*: 'E's a proper posh place this, but them things on display is all right funny stuff.\n@c0@"
  es: "@a@b*: Sí, sí, el sitio es muⓘ fino, pero las cosas que tienen aquí paⓘ que las vea la gente son bien raras.\n@c0@"
  fr: "@a@b*ⓢ C'est un endroit un peu chic pour moi, mais il y a de chouettes objets étonnants d'exposés.\n@c0@"
  it: "@a@b*: L'edificio è un po' troppo ricercato per i miei gusti, ma i souvenir esposti sono divertenti...\n@c0@"
  ja: "@a@b＊「りっぱな建物だけんど\n\tかざってあるのは\n\t面白いものばっかり　だっただよ。\n@c0@"
71:
  de: "@a@b*: Hi hi hi! Ein Museum mitten im Wald! Das ist ja lustig!\n@c0@"
  en: "@a@b*: Tee hee hee!\r\nA museum in the middle of the forest.\r\nThis is fun!\n@c0@"
  es: "@a@b*: ¡Ji, ji, ji!\r\nUn museo en mitad del bosque.\r\n¡Qué curioso!\n@c0@"
  fr: "@a@b*ⓢ Hi hi hiⓠ Un musée en plein milieu de la forêt, c'est vraiment marrantⓠ\n@c0@"
  it: "@a@b*: Un museo in mezzo a una foresta? Forse vogliono promuovere il turismo cultural-ecologico?\n@c0@"
  ja: "@a@b＊「森の中の　博物館って\n\tス・テ・キ！\n@c0@"
72:
  de: "@a@b*: Das ist ja nicht mal ein richtiges Museum! Schaut Euch doch bloß all diese komischen Sachen an. Das sind die schlimmsten Flitterwochen, die ich je hatte!\n@c0@"
  en: "@a@b*: It's not even a proper museum, you know! I mean, look at all these weird exhibits. This is the worst honeymoon I've ever had!\n@c0@"
  es: "@a@b*: ¡Ni siquiera es un museo de verdad! Vamos, %H0860%Xmira%Ymirad%Z qué objetos tan extraños tienen. ¡Esta es la peor luna de miel que he pasado en mi vida!\n@c0@"
  fr: "@a@b*ⓢ Ce n'est même pas un vrai musée, en plusⓠ\nC'est vraiⓠ Regardez tous ces trucs bizarres.\nC'est la pire lune de miel que j'aie jamais eueⓠ\n@c0@"
  it: "@a@b*: Ma che razza di museo è questo?! Guarda che cianfrusaglie ci sono in giro! Come si fa a scegliere un posto come questo per la luna di miele, eh?!\n@c0@"
  ja: "@a@b＊「新婚旅行で　来たんだけど\n\tかわった名産品ばかりで\n\tおもしろかったわ。\n@c0@"
73:
  de: "@a@b*: Nichts macht mich glücklicher, als das Lächeln auf dem Gesicht meiner frisch Angetrauten zu sehen!\n@c0@"
  en: "@a@b*: Nothing makes me happier than seeing my new wife with a smile on her face!\n@c0@"
  es: "@a@b*: ¡No hay nada que me haga más feliz que ver sonreír a mi nueva esposa!\n@c0@"
  fr: "@a@b*ⓢ Rien ne me fait plus plaisir que de voir ma femme avec le sourireⓠ\n@c0@"
  it: "@a@b*: A giudicare dalla sua espressione, mia moglie è entusiasta di questo posto!\nEh, sì! Io la conosco bene...\n@c0@"
  ja: "@a@b＊「彼女…　いえ　妻のうれしそうな顔を\n\t見るのが　いちばんの幸せです。\n@c0@"
74:
  de: "@a@b*: Ich wusste doch, dass das ein wunderbares Flitterwochenziel sein würde. Ich kann mir keinen besseren Start in ein gemeinsames Leben vorstellen!\n@c0@"
  en: "@a@b*: I knew this would be a great place for a honeymoon. I can't think of a better start to\r\nour life together!\n@c0@"
  es: "@a@b*: Sabía que iba a ser el lugar ideal para pasar una luna de miel. ¡Creo que es la mejor forma de iniciar nuestra vida en común!\n@c0@"
  fr: "@a@b*ⓢ Je savais que c'était l'endroit parfait pour notre lune de miel. Notre vie de couple ne pouvait pas mieux commencerⓠ\n@c0@"
  it: "@a@b*: Torneremo al Museo del Souvenir per ogni nostro anniversario, fino alla fine dei nostri giorni! Ah, già immagino la faccia che farà quando glielo dirò!\n@c0@"
  ja: "@a@b＊「ここに来て　よかったですよ。\n@c0@"
75:
  de: "@a@b*: Hier drin sieht alles ziemlich merkwürdig aus, wenn Ihr mich fragt. Was soll das Ganze überhaupt?\n@c0@"
  en: "@a@b*: Everything in here looks pretty weird if you ask me. What's that about, eh?\n@c0@"
  es: "@a@b*: A decir verdad, todo esto tiene un aspecto más bien raro. ¿Qué se proponen?\n@c0@"
  fr: "@a@b*ⓢ Si vous voulez mon avis, tout est un peu bizarre là-dedans. Ça sert à quoiⓡ\n@c0@"
  it: "@a@b*: E io che me penzavo che nei musei ce stavano solo capolavori belli come er sole!\n@c0@"
  ja: "@a@b＊「オレが　見たところじゃ\n\tヘンな名産品が　多かったけど\n\tよく考えると　おかしいよな。\n@c0@"
76:
  de: "@a@b*: Ich meine, wer würde sich denn die Mühe machen, so komisches Zeugs herzustellen? Und wieso ist das überhaupt berühmt geworden, häh?\n@c0@"
  en: "@a@b*: I mean, who'd bother going to the effort of making funny stuff like this? And how'd it get to be famous anyway, eh?\n@c0@"
  es: "@a@b*: ¿Quién se tomaría la molestia de fabricar estas cosas tan raras? ¿Y por qué se ha hecho famoso? Me gustaría saberlo.\n@c0@"
  fr: "@a@b*ⓢ C'est vraiⓠ Je comprends pas pourquoi des gens s'acharnent à faire des trucs pareils. Et puis comment ils font pour que ça devienne célèbreⓡ\n@c0@"
  it: "@a@b*: E invece guarda te che razza de robba che c'hanno! Ahò, certo che chi ha fatto l'oggetti esposti qui dentro nun stava troppo bbene c'a capoccia!\n@c0@"
  ja: "@a@b＊「ああいうヘンな物を　一生けんめい\n\t作ってる人たちが　いるなんて。\n\tしかも　名産になってるんだぜ！\n@c0@"
77:
  de: "@a@b*: Mann, hier ist ja was los, wie? Es scheint allen zu gefallen.\n@c0@"
  en: "@a@b*: Wow! The place is bustling, isn't it?\r\nEveryone seems to love it.\n@c0@"
  es: "@a@b*: ¡Vaya! Está repleto de gente, ¿verdad?\r\nParece que a todo el mundo le encanta.\n@c0@"
  fr: "@a@b*ⓢ Ouahⓠ Le musée est plein à craquer.\nTout le monde a l'air de l'adorer.\n@c0@"
  it: "@a@b*: Accidenti! Questo posto è favoloso! Non avevo mai visto nulla del genere in vita mia!\n@c0@"
  ja: "@a@b＊「ずいぶん　にぎやかになって。\n\t大はんじょうですな！\n@c0@"
78:
  de: "@a@b*: Mit diesen Ausstellungsstücken kann man sich direkt vorstellen, wie die Menschen anderswo leben, nicht? Das ist wirklich faszinierend.\n@c0@"
  en: "@a@b*: You can start to imagine what people's lives in different places are like when you look at these exhibits, can't you? It's really quite fascinating.\n@c0@"
  es: "@a@b*: Uno puede imaginarse cómo son las vidas de las personas en distintos lugares con solo visitar la exposición, ¿no %H0860%Xcrees%Ycreéis%Z? Es fascinante.\n@c0@"
  fr: "@a@b*ⓢ Quand on regarde ces pièces, on peut imaginer la vie des gens partout dans le monde.\nJe trouve ça vraiment fascinant.\n@c0@"
  it: "@a@b*: Avere la possibilità di ammirare souvenir provenienti da terre lontane è davvero un'ottima cosa! Consiglierò questo Museo a tutti i miei amici!\n@c0@"
  ja: "@a@b＊「こうして名産品を　見ていると\n\tその地域の人々の生活が\n\tうかがえるようですなあ。\n@c0@"
79:
  de: "@a@b*: Meine Güte, was für eine Menge seltsamen kleinen Schnickschnacks! Da wird einem bewusst, in was für einer Welt wir leben.\n@c0@"
  en: "@a@b*: My, what a lot of peculiar little knick-knacks!\nIt makes you realise what a world we live in.\n@c0@"
  es: "@a@b*: ¡Vaya, cuántas cosinas, y qué singulares!\r\nAl verlas se da una cuenta del mundo en que vivimos.\n@c0@"
  fr: "@a@b*ⓢ Eh bien, quelle jolie collection d'objetsⓠ Ils nous permettent de réaliser dans quel monde on vit.\n@c0@"
  it: "@a@b*: Questi souvenir sono bellissimi!\nFanno venir voglia di visitare i paesi dai quali provengono...\n@c0@"
  ja: "@a@b＊「変わった名産品が　あるもんだねえ。\n\t世界は　広いねえ。\n@c0@"
80:
  de: "@a@b*: So was hab ich noch nie gesehen!\n@c0@"
  en: "@a@b*: Never seen that one before!\n@c0@"
  es: "@a@b*: ¡Nunca había visto una cosa así!\n@c0@"
  fr: "@a@b*ⓢ C'est la première fois que je vois çaⓠ\n@c0@"
  it: "@a@b*: Non avevo mai visto nulla del genere!\n@c0@"
  ja: "@a@b＊「あんな名産\n\t初めて　見たなあ。\n@c0@"
81:
  de: "@a@b*: Ich hab immer gedacht, Museen, dat wär 'ne steife Angelegenheit. Aber die ha'm hier ja richtig reelles Zeug drin.\n@c0@"
  en: "@a@b*: I's always thought musli-eums woz stuck-up nonsenses. But 'e's got a fair ole dollop o' normal thingjiggamies in 'ere.\n@c0@"
  es: "@a@b*: Siempre había pensaⓘo que los museos esos eran tonterías paⓙ gente estiráⓘ. Pero esto está lleno de cacharricos bien normales.\n@c0@"
  fr: "@a@b*ⓢ En général, y'a que des bidules qu'on comprend pas dans les musées, mais là, y'a une belle brouettée de trucs normaux.\n@c0@"
  it: "@a@b*: In passato ho visitato altri musei, ma questo è sicuramente il più interessante di tutti!\n@c0@"
  ja: "@a@b＊「博物館なんて　きどったもんかと\n\t思っとったんだけんど\n\tこういうのも　あっただね。\n@c0@"
82:
  de: "@a@b*: Dieser Schnickschnack ist ja so interessant, ist er nicht?\n@c0@"
  en: "@a@b*: These knick-knacks are all so interesting,\r\naren't they?\n@c0@"
  es: "@a@b*: Todas estas cosinas son muy interesantes, ¿verdad que sí?\n@c0@"
  fr: "@a@b*ⓢ Ces curiosités sont vraiment intéressantes,\nn'est-ce pasⓡ\n@c0@"
  it: "@a@b*: Gli oggetti esposti in questo Museo sono davvero molto interessanti! Ognuno di loro ha un gusto particolare, insolito. Oserei dire... esotico!\n@c0@"
  ja: "@a@b＊「名産品とは\n\tおもしろいもんやのう。\n@c0@"
83:
  de: "@a@b*: Ein Kerl hat mir neulich von dem Ort hier erzählt, als er drauf gewartet hat, dass ich ihm seinen trockenen Gigantini mixe.\n@c0@"
  en: "@a@b*: A gent told me about this place as he was waiting for me to mix his dry Gigantini the other day.\n@c0@"
  es: "@a@b*: Un caballero me habló de este sitio hace unos días, mientras esperaba que le sirviese su Dry Gigantini.\n@c0@"
  fr: "@a@b*ⓢ C'est un client à qui je préparais un Gigantini qui m'a parlé de cet endroit, l'autre jour.\n@c0@"
  it: "@a@b*: Ho deciso di visitare questo Museo dopo che un amico me ne aveva parlato in termini entusiastici.\nDevo dire che non aveva esagerato affatto!\n@c0@"
  ja: "@a@b＊「お客さん相手の　話のネタに\n\t来てみたんですよ。\n@c0@"
84:
  de: "@a@b*: Dass eine Zivilisation derart ungewöhnliche Kunstgegenstände hervorbringt ⓚⓛ hmm. Interessant. Höchst interessant.\n@c0@"
  en: "@a@b*: For a civilisation to create such unusual works of art... Hmm. Interesting, most interesting.\n@c0@"
  es: "@a@b*: Y pensar que una civilización ha sido capaz de crear estas singulares obras de arte... Mmm... Interesante, muy interesante.\n@c0@"
  fr: "@a@b*ⓢ Une civilisation capable de créer des œuvres d'art si originales... Mmm. C'est vraiment très intéressant.\n@c0@"
  it: "@a@b*: Gli artigiani che hanno creato questi capolavori non hanno nulla da invidiare agli artisti più celebrati del mondo. Sono dei veri geni!\n@c0@"
  ja: "@a@b＊「こんなに　変わった名産を作る\n\t地域の人々の　生活とは…\n\tう～ん　じつに　興味深いですな。\n@c0@"
85:
  de: "@a@b*: Ich bin schon lange in Rente, aber es ist tröstlich zu sehen, dass die Arbeit von uns Kunsthandwerkern für die Jugend bewahrt wird.\n@c0@"
  en: "@a@b*: I've been retired for many a long year now, but it's a comfort to know the work of us craftsmen will be preserved for the young ones to see.\n@c0@"
  es: "@a@b*: Ya llevo muchos años jubilado, pero es un alivio ver que el trabajo de los artesanos se va a conservar para que los jóvenes puedan verlo.\n@c0@"
  fr: "@a@b*ⓢ J'ai pris ma retraite il y a longtemps, mais ça fait plaisir de savoir que notre travail à nous, les artisans, est exposé pour que les jeunes le voient.\n@c0@"
  it: "@a@b*: Questo Museo è meraviglioso! Aver realizzato un luogo per la conservazione delle opere di noi artigiani è stata un'idea davvero geniale.\n@c0@"
  ja: "@a@b＊「わしは　とうに　引退したが\n\tわしらの技は　りっぱに\n\t受けつがれておるようじゃわい。\n@c0@"
86:
  de: "@a@b*: Die Leute kommen schon auf komische Ideen, was?\n@c0@"
  en: "@a@b*: People don't 'alf make some funny stuff, eh?\n@c0@"
  es: "@a@b*: Hay que ver la de cosas raras que hace la gente, ¿eh?\n@c0@"
  fr: "@a@b*ⓢ Y'a des gens qui font des trucs bizarres, moi je vous l'dis.\n@c0@"
  it: "@a@b*: Non immaginavo che in un museo ci fosse roba del genere. Mi sarei aspettato di trovare oggetti decisamente più belli!\n@c0@"
  ja: "@a@b＊「こう言っちゃなんだけど…\n\tおかしな名産を　作ってる人たちが\n\tいるもんだね。\n@c0@"
87:
  de: "@a@b*: Nun sieh sich einer diese seltsamen Stücke an... Oh, ich spüre schon, wie mich die Muse küsst! War einst ein Kurator namens %a000090...\n@c0@"
  en: "@a@b*: Look at all these odd items! I feel a poem coming on... There once was a curator called %a000090...\n@c0@"
  es: "@a@b*: ¡Qué objetos tan insólitos! Siento que me llega la inspiración... Había una vez un gestor llamado %a000090...\n@c0@"
  fr: "@a@b*ⓢ Admirez toutes ces pièces étrangesⓠ\nJe sens l'inspiration venir... Il était une fois un conservateur appelé %a000090...\n@c0@"
  it: "@a@b*: La bizzarria di questi oggetti ha ridestato la mia arte...\n㈡\n*: Oh, %a000090!\nDirettore sapiente di questo Museo interessante...\n@c0@"
  ja: "@a@b＊「ラララ　おかしな　名産にも\n\tそれなりの　価値がある。\n\t生活の　意味がある　ラララ～！\n@c0@"
88:
  de: "@a@b*: Findet Ihr, dass es komisch aussieht, wenn ich so angezogen in ein Museum gehe?\n@c0@"
  en: "@a@b*: Do you think I look funny coming to a museum dressed like this?\n@c0@"
  es: "@a@b*: ¿%H0860%XCrees%YCreéis%Z que tengo un aspecto así como raro por venir a un museo vestida así?\n@c0@"
  fr: "@a@b*ⓢ Vous trouvez que j'ai l'air bizarre habillée comme ça dans un muséeⓡ\n@c0@"
  it: "@a@b*: Non so perché, ma mi sento osservata...\nNon sarà mica colpa del mio ⓕvestitinoⓖ?\n@c0@"
  ja: "@a@b＊「こんなかっこうで\n\t博物館に　来るなんて\n\t変わってると思う？\n@c0@"
89:
  de: "@a@b*: Hmpf!\n@c0@"
  en: "@a@b*: Hmph!\n@c0@"
  es: "@a@b*: ¡Umf!\n@c0@"
  fr: "@a@b*ⓢ Mmpfⓠ\n@c0@"
  it: "@a@b*: In effetti sono anch'io un'opera d'arte, no?\nCi sto proprio bene in un museo!\n@c0@"
  ja: "@a@b＊「………プンプン！\n@c0@"
90:
  de: "@a@b*: Hi hi! Aber ich sehe auch niedlich aus, oder? Nicht wahr?\n@c0@"
  en: "@a@b*: Hee hee! But I look cute too, don't I? Right?\n@c0@"
  es: "@a@b*: ¡Ji, ji! ¿A que estoy monísima? ¿A que sí?\n@c0@"
  fr: "@a@b*ⓢ Hi hiⓠ Ça me va bien, nonⓡ \n@c0@"
  it: "@a@b*: Sono carina, non è vero?\nEh eh eh eh eh!\n@c0@"
  ja: "@a@b＊「うふふ。\n\tいちばん　かわいい服を着てきたの！\n@c0@"
91:
  de: "@a@b*: Hmm. Das hier hat mir die Augen geöffnet. Nun weiß ich, dass ich meine Arbeit noch verbessern kann. Ich muss noch besser werden.\n@c0@"
  en: "@a@b*: Hmm. This has been a bit of an eye-opener. I see now that there's room for improvement in my work. I need to hone my skills.\n@c0@"
  es: "@a@b*: Mmm... Esto ha sido una especie de revelación. Ahora veo que mi trabajo aún puede mejorar. Tengo que pulir mi técnica.\n@c0@"
  fr: "@a@b*ⓢ Mmm. Cette exposition m'a vraiment ouvert les yeux. Je me rends compte que je peux faire beaucoup mieux. Il va falloir que je m'entraîne.\n@c0@"
  it: "@a@b*: Uhm, la visita al Museo del Souvenir mi ha aperto gli occhi... D'ora in avanti m'impegnerò per creare oggetti ancora più belli!\n@c0@"
  ja: "@a@b＊「なかなか　勉強になったよ。\n\tわしも　さらなる高みをめざして\n\tウデをみがくとしよう。\n@c0@"
92:
  de: "@a@b*: Ich fühl mich komisch, wenn ich in so 'n schickes Etepe-, Etati- Etabla- ähm, Gebäude gehe.\n@c0@"
  en: "@a@b*: I don't feel right goin' in a place as posh as this.\n@c0@"
  es: "@a@b*: No me sienta naⓘ bien meterme en un sitio asín de finolis.\n@c0@"
  fr: "@a@b*ⓢ J'me sens pas à ma place dans un endroit aussi chic que ça.\n@c0@"
  it: "@a@b*: Non mi piace questo posto.\nÈ troppo elegante per i miei gusti.\n@c0@"
  ja: "@a@b＊「りっぱな建物だから\n\tなんだか　入りづらいっぺ。\n@c0@"
93:
  de: "@a@b*: Hi hi hi! Ein Museum mitten im Wald! Das ist ja lustig!\n@c0@"
  en: "@a@b*: Tee hee hee!\r\nA museum in the middle of the forest.\r\nThis is fun!\n@c0@"
  es: "@a@b*: ¡Ji, ji, ji!\r\nUn museo en mitad del bosque.\r\n¡Qué curioso!\n@c0@"
  fr: "@a@b*ⓢ Hi hi hiⓠ Un musée en plein milieu de la forêt, c'est vraiment marrantⓠ\n@c0@"
  it: "@a@b*: Un museo in mezzo a una foresta? Forse vogliono promuovere il turismo cultural-ecologico?\n@c0@"
  ja: "@a@b＊「森の中の　博物館って\n\tス・テ・キ！\n@c0@"
94:
  de: "@a@b*: Mein Mann hat mich zu den Flitterwochen hierher geschleppt, ist das zu fassen?\n@c0@"
  en: "@a@b*: My husband brought me here on our honeymoon, can you believe?\n@c0@"
  es: "@a@b*: Mi marido me ha traído aquí de luna de mielⓓ increíble, ¿verdad?\n@c0@"
  fr: "@a@b*ⓢ Mon mari m'a amenée ici pour notre lune de miel. J'arrive à peine à y croire.\n@c0@"
  it: "@a@b*: Mio marito ha deciso che trascorreremo l'intera luna di miele in questo terrificante Museo del Souvenir. Vorrei strozzarlo!\n@c0@"
  ja: "@a@b＊「私たち　新婚旅行で\n\tこの博物館に　来たんですけど…\n@c0@"
95:
  de: "@a@b*: Irgendwie unheimlich, oder? Aber der Kurator musste angeblich Monster bekämpfen, um diese Dinge zu ergattern. Er muss ein wunderbarer Mann sein!\n@c0@"
  en: "@a@b*: It's a bit scary, isn't it? But they say the curator fought monsters to get all these things, you know.\r\nHe sounds like a wonderful man!\n@c0@"
  es: "@a@b*: Da un poco de miedo, ¿verdad? Pero dicen que el gestor derrotó a monstruos para conseguir todo esto.\n㈡\n*: ¡Debe de ser un hombre fantástico!\n@c0@"
  fr: "@a@b*ⓢ Cet endroit est un peu effrayant, vous ne trouvez pasⓡ\n㈡\n*ⓢ On dit que le conservateur a battu plein de monstres pour trouver tous ces trucs. Ce doit être quelqu'un de merveilleuxⓠ\n@c0@"
  it: "@a@b*: Comunque, ho sentito dire che il direttore di questo posto ha combattuto contro un mucchio di mostri per ottenere gli oggetti da esporre.\n㈡\n*: Dev'essere un bel fusto forte e coraggioso.\nMi piacerebbe tanto conoscerlo.\nOh, sì! Mi piacerebbe davvero tanto...\n@c0@"
  ja: "@a@b＊「なんだか　こわい展示物が\n\t多かったような…。\n\t館長さんの　趣味なのかしら。\n@c0@"
96:
  de: "@a@b*: Meine Frau kann gar nicht genug über den Kurator hören. Langsam frage ich mich, ob sie vielleicht lieber ihn geheiratet hätte!\n@c0@"
  en: "@a@b*: My wife won't stop asking questions about the curator. I'm starting to wonder if she wishes she'd married him!\n@c0@"
  es: "@a@b*: Mi esposa no deja de hacerme preguntas sobre el gestor. ¡Igual hubiera preferido casarse con él!\n@c0@"
  fr: "@a@b*ⓢ Ma femme n'arrête pas de me poser des questions sur ce conservateur. Je commence à me demander si elle n'aurait pas préféré se marier avec lui.\n@c0@"
  it: "@a@b*: Lo sapevo! A mia moglie il Museo del Souvenir è piaciuto da impazzire! Non fa altro che chiedere a tutti notizie del direttore!\n@c0@"
  ja: "@a@b＊「ああっ　妻の顔が\n\tくもっている…。\n@c0@"
97:
  de: "@a@b*: Vielleicht war das doch keine so gute Wahl für die Flitterwochen...\n@c0@"
  en: "@a@b*: Maybe this wasn't such a good choice for a honeymoon destination after all...\n@c0@"
  es: "@a@b*: A lo mejor no ha sido una buena idea venir aquí de luna de miel...\n@c0@"
  fr: "@a@b*ⓢ Finalement, ce n'était peut-être pas une si bonne idée de venir ici pour notre lune de miel...\n@c0@"
  it: "@a@b*: Anche se non mi è del tutto chiaro come mai si interessi più del suo aspetto fisico che della sua formazione culturale e artistica...\n@c0@"
  ja: "@a@b＊「旅行先に　この場所を\n\t選んだのは　失敗だったかな…。\n@c0@"
98:
  de: "@a@b*: Tja, mit einem Museum voller finsterer Ausstellungsstücke mit unheilvoller Bedeutung hätte ich nicht gerechnet.\n@c0@"
  en: "@a@b*: Well! I wasn't expecting a museum full of sinister, ill-omened exhibits.\n@c0@"
  es: "@a@b*: ¡Bueno! No esperaba un museo lleno de piezas siniestras y sombrías como este.\n@c0@"
  fr: "@a@b*ⓢ Je dois dire que je ne m'attendais pas à trouver un musée rempli de pièces aussi sinistres.\n@c0@"
  it: "@a@b*: Gli oggetti esposti sono sinistri e minacciosi, ma non mi spaventano affatto.\n@c0@"
  ja: "@a@b＊「この博物館は　まがまがしい\n\t展示物が　目立ったね。\n@c0@"
99:
  de: "@a@b*: Aber es hat sich gelohnt. Um ehrlich zu sein, habe ich in all dem Finsteren eine gewisse Schönheit entdecken können.\n@c0@"
  en: "@a@b*: But it was worth seeing. I found a certain beauty amongst all the sinisterness, if the truth be known.\n@c0@"
  es: "@a@b*: Pero ha valido la pena visitarlo. A decir verdad, he logrado encontrar la belleza dentro de la... ⓕsiniestrezⓖ.\n@c0@"
  fr: "@a@b*ⓢ Mais ça valait quand même le coup.\nPour être sincère, je trouve qu'il y a une certaine beauté derrière tout ce côté lugubre.\n@c0@"
  it: "@a@b*: Anzi, li trovo persino affascinanti!\n@c0@"
  ja: "@a@b＊「しかし　まがまがしさの中にも\n\t一種の美が　かいま見えたような…\n\t見ごたえが　ありましたよ。\n@c0@"
100:
  de: "@a@b*: Mann, hier ist ja was los, wie? Es scheint allen zu gefallen.\n@c0@"
  en: "@a@b*: Wow! The place is bustling, isn't it?\r\nEveryone seems to love it.\n@c0@"
  es: "@a@b*: ¡Vaya! Está repleto de gente, ¿verdad?\r\nParece que a todo el mundo le encanta.\n@c0@"
  fr: "@a@b*ⓢ Ouahⓠ Le musée est plein à craquer.\nTout le monde a l'air de l'adorer.\n@c0@"
  it: "@a@b*: Accidenti! Questo posto è favoloso! Non avevo mai visto nulla del genere in vita mia!\n@c0@"
  ja: "@a@b＊「ずいぶん　にぎやかになって。\n\t大はんじょうですな！\n@c0@"
101:
  de: "@a@b*: Mit diesen Ausstellungsstücken kann man sich direkt vorstellen, wie die Menschen anderswo leben, nicht? Das ist wirklich faszinierend.\n@c0@"
  en: "@a@b*: You can start to imagine what people's lives in different places are like when you look at these exhibits, can't you? It's really quite fascinating.\n@c0@"
  es: "@a@b*: Uno puede imaginarse cómo son las vidas de las personas en distintos lugares con solo visitar la exposición, ¿no %H0860%Xcrees%Ycreéis%Z? Es fascinante.\n@c0@"
  fr: "@a@b*ⓢ Quand on regarde ces pièces, on peut imaginer la vie des gens partout dans le monde.\nJe trouve ça vraiment fascinant.\n@c0@"
  it: "@a@b*: Avere la possibilità di ammirare souvenir provenienti da terre lontane è davvero un'ottima cosa! Consiglierò questo Museo a tutti i miei amici!\n@c0@"
  ja: "@a@b＊「こうして名産品を　見ていると\n\tその地域の人々の生活が\n\tうかがえるようですなあ。\n@c0@"
102:
  de: "@a@b*: Museen sind doch in diesen Zeiten nichts als eine kindische Frivolität, findet Ihr nicht?\n@c0@"
  en: "@a@b*: Museums are just childish frivolity at times like these really, aren't they?\n@c0@"
  es: "@a@b*: En estos tiempos que corren, un museo no es más que una frivolidad.\n@c0@"
  fr: "@a@b*ⓢ Vous ne trouvez pas qu'en des temps aussi troublés, aller au musée est le comble de l'insoucianceⓡ\n@c0@"
  it: "@a@b*: Non mi capacito di come la gente possa pensare a divertirsi in un museo in tempi tanto pericolosi!\nMa dove hanno la testa queste persone, eh?\n@c0@"
  ja: "@a@b＊「こんな時代に\n\t博物館とは　のんきですなあ。\n@c0@"
103:
  de: "@a@b*: Seht Ihr das Ausstellungsstück dort? Das hab ich selbst gemacht, müsst Ihr wissen! Nicht schlecht, was?\n@c0@"
  en: "@a@b*: See that exhibit there? I made that meself, y'know. Pretty impressive, eh?\n@c0@"
  es: "@a@b*: ¿Ves ese trasto dⓘahí? Pues lo he hecho yo mismico.\nBestial, ¿a que sí?\n@c0@"
  fr: "@a@b*ⓢ Vous voyez cet objet là-basⓡ C'est moi qui l'ai fait. Impressionnant, heinⓡ\n@c0@"
  it: "@a@b*: 'O %H0860%Xvedi%Yvedete%Z quer souvenir? L'ho fatto io me medesimo in persona con le mani mie. Bbello, eh?\n@c0@"
  ja: "@a@b＊「あの名産品は　オレっちが\n\t作ったんだぞ。　すごいだろ！\n@c0@"
104:
  de: "@a@b*: Moment mal... Wo is' es denn?\n@c0@"
  en: "@a@b*: 'Ang on... Where'd it go?\n@c0@"
  es: "@a@b*: Un momento... ¿Ande está ahora?\n@c0@"
  fr: "@a@b*ⓢ Attendez... où il est passéⓡ\n@c0@"
  it: "@a@b*: Ahò, ma che fine ha fatto?!\n@c0@"
  ja: "@a@b＊「…って　ありゃ？\n\tなくなっちまったぞ。\n@c0@"
105:
  de: "@a@b*: Ihr würdet kaum glauben, wie weit ich gereist bin, um dieses Museum zu besuchen. Seht Euch nur meine Kleidung an. Die hat die Reise nicht gut überstanden!\n@c0@"
  en: "@a@b*: You wouldn't believe how far I've come to visit this museum. Just look at my clothes. They haven't stood up to the journey very well, have they?\n@c0@"
  es: "@a@b*: He venido desde tan lejos para visitar este museo que no %H0860%Xte lo ibas%Yos lo ibais%Z a creer.\n㈡\n*: No hay más que ver mi ropa. No ha aguantado demasiado bien el viaje, ¿a que no?\n@c0@"
  fr: "@a@b*ⓢ Vous n'imaginez même pas le chemin que j'ai fait pour venir jusqu'à ce musée. Regardez seulement mes habits. Ils n'ont pas résisté au voyage.\n@c0@"
  it: "@a@b*: Ho affrontato un viaggio lungo e pericoloso per visitare il Museo del Souvenir! Non ci %H0860%Xcredi? Guarda%Ycredete? Guardate%Z in che stato sono i miei vestiti!\n@c0@"
  ja: "@a@b＊「いや～　ここは遠くて…。\n\t見てくださいよ　長旅で\n\t服が　こんなに　ボロボロ。\n@c0@"
106:
  de: "@a@b*: Dieser Schnickschnack jagt einem richtig Angst ein, tut er nicht?\n@c0@"
  en: "@a@b*: These knick-knacks are all so frightening,\r\naren't they?\n@c0@"
  es: "@a@b*: Todas estas cosinas dan un poco de miedo, ¿verdad que sí?\n@c0@"
  fr: "@a@b*ⓢ Tous ces objets me font peur, pas vousⓡ\n@c0@"
  it: "@a@b*: Questi souvenir mi fanno tremare dalla paura!\nSono spaventosi!\n@c0@"
  ja: "@a@b＊「名産品とは\n\tおっそろしいもんやのう。\n@c0@"
107:
  de: "@a@b*: Was meint Ihr? Lauter zwielichtige Gesellen laufen hier rum, was? Gut, dass das nicht mein Laden ist, kann ich da nur sagen!\n@c0@"
  en: "@a@b*: Wot d'ya reckon? This place is full o' dodgy characters, eh? I wouldn't like to be the boss,\r\nI can tell ya!\n@c0@"
  es: "@a@b*: ¿Qué %H0860%Xte%Yos%Z parece? Esto está lleno de gente chunga, ¿que no? ¡No me cambiaría por el jefe de esto, por nada del mundo!\n@c0@"
  fr: "@a@b*ⓢ Vous savez quoiⓡ Y'a plein de gens bizarres dans ce muséeⓠ J'aimerais pas en être le patron.\nÇa, c'est sûrⓠ\n@c0@"
  it: "@a@b*: Ho visto un paro de tipi loschi qui dentro. Seconno me, se vonno frega' quarche souvenir. Se fossi er capo d'a baracca, terrebbi l'occhi bbelli spalancati!\n@c0@"
  ja: "@a@b＊「あやしい客ばかりだな。\n\tこの博物館　大丈夫かい？\n@c0@"
108:
  de: "@a@b*: Dass eine Zivilisation derart furchteinflößende Kunstgegenstände hervorbringt ⓚⓛ hmm. Interessant. Höchst interessant.\n@c0@"
  en: "@a@b*: For a civilisation to create such terrifying works of art... Hmm. Interesting, most interesting.\n@c0@"
  es: "@a@b*: Y pensar que una civilización ha sido capaz de crear estas terroríficas obras de arte... Mmm... Interesante, muy interesante.\n@c0@"
  fr: "@a@b*ⓢ Une civilisation capable de créer des œuvres d'art si effrayantes... Mmm. C'est vraiment très intéressant.\n@c0@"
  it: "@a@b*: Che splendore, questi souvenir!\nTrasmettono tutta la cultura delle civiltà che li hanno prodotti!\n@c0@"
  ja: "@a@b＊「こんなに　恐ろしい名産を作る\n\t地域の人々の　生活とは…\n\tう～ん　じつに　興味深いですな。\n@c0@"
109:
  de: "@a@b*: Der Mann da drüben ist mir gar nicht geheuer. Wenn ich Ihr wäre, würde ich dem aus dem Weg gehen. Ich habe das jedenfalls vor!\n@c0@"
  en: "@a@b*: I don't feel comfortable around that man over there. I'd steer clear of him if I were you. I know\r\nI'm going to!\n@c0@"
  es: "@a@b*: Ese tipo de allí no me da buena espina. Yo que %H0860%Xtú%Y%R0000%Xvosotras%Yvosotros%Z%Z no me acercaría a él. ¡Desde luego, yo no me voy a acercar!\n@c0@"
  fr: "@a@b*ⓢ Le bonhomme là-bas ne me dit rien qui vaille.\nÀ votre place, je garderais mes distances.\nEn tout cas, moi, c'est ce que je vais faireⓠ\n@c0@"
  it: "@a@b*: Quell'uomo ha un'aria poco raccomandabile. Credo proprio che gli girerò al largo. E, se fossi in %H0860%Xte%Yvoi%Z, farei la stessa cosa!\n@c0@"
  ja: "@a@b＊「あそこにおる男\n\tなんだか　不気味じゃのう。\n\t近よらんように　しとこう。\n@c0@"
110:
  de: "@a@b*: Hwa ha ha hah! Eines Tages wird die ganze Welt von solchen Objekten des Schreckens überzogen sein!\n@c0@"
  en: "@a@b*: Hwa ha ha ha hah! One fine day will see the whole world overrun with such objects of terror!\n@c0@"
  es: "@a@b*: ¡Muaja, ja, ja, ja! ¡Llegará un día en que el mundo estará abarrotado de estos objetos terroríficos! ¡Estoy deseándolo!\n@c0@"
  fr: "@a@b*ⓢ Ha ha ha ha haⓠ Un jour, le monde sera envahi d'objets aussi terrifiantsⓠ\n@c0@"
  it: "@a@b*: Wah ah ah ah ah!\nUn giorno tutto il mondo sarà invaso da questi oggetti terrificanti!\n@c0@"
  ja: "@a@b＊「ぐははは…\n\tいつの日か　恐ろしい物ばかりで\n\t世界を　うめつくしたいものですな！\n@c0@"
111:
  de: "@a@b*: Das ist ja eine wahre Fundgrube hier! Nun sieh sich einer das hier an! Und das hier! Heh heh! Das ist alles gutes Zeug!\n@c0@"
  en: "@a@b*: This place is a treasure trove!\r\nLook at this 'ere! And that!\r\nHeh heh! It's all good stuff!\n@c0@"
  es: "@a@b*: ¡Este sitio es un verdadero tesoro escondido!\n¡%H0860%XMira%YMirad%Z esto! ¡Y eso de ahí!\n¡Je, je! ¡Es todo genial!\n@c0@"
  fr: "@a@b*ⓢ Cet endroit est une vraie caverne d'Ali Baba.\nRegardez çaⓠ Et çaⓠ Hé héⓠ C'est vraiment génialⓠ\n@c0@"
  it: "@a@b*: Questo posto è una vera favola!\nÈ pieno di oggetti preziosi!\n%H0860%XGuarda%YGuardate%Z questo...! E quello...! E quell'altro...!\n@c0@"
  ja: "@a@b＊「ここは　お宝の山だぜ！\n\tあれも　これも　いいぜえ～！\n@c0@"
112:
  de: "@a@b*: Hmm... Mir ist fast so, als gingen von diesen Ausstellungsstücken finstere Schwingungen aus. Aber nein, das bilde ich mir sicher nur ein.\n@c0@"
  en: "@a@b*: Hmm... I almost feel as if there's a dark\r\naura emanating from these exhibits.\r\nNo, I... I must be imagining it.\n@c0@"
  es: "@a@b*: Mmm... Casi puedo sentir el aura tenebrosa que emana de estas piezas.\r\nPero no, deben de ser imaginaciones mías.\n@c0@"
  fr: "@a@b*ⓢ Mmm... C'est comme si je sentais une aura maléfique émaner de ces pièces.\nNon, je... je dois me faire des idées.\n@c0@"
  it: "@a@b*: Uhm, questi oggetti sembrano emanare un'aura malvagia.\nPaiono quasi posseduti da uno spirito demoniaco.\n@c0@"
  ja: "@a@b＊「う～む。　名産品から\n\t闇のチカラを　感じるような…。\n\t気のせいだろうか。\n@c0@"
113:
  de: "@a@b*: Ich ⓚⓛ ich hab nich' erwartet, dat dat hier ausgestellt wird! Und ich bin gar nich' sicher, dat et mir gefällt!\n@c0@"
  en: "@a@b*: I, I didn't expect this to be on display here!\nI d-don't know that I like it!\n@c0@"
  es: "@a@b*: ¡N-no mⓙesperaba yo ver esto aquí en el museo!\n¡C-creo que no me gusta naⓘ de naⓘ!\n@c0@"
  fr: "@a@b*ⓢ J-Je m'attendais pas à voir ça exposé iciⓠ\nJ-Je suis pas sûr d'aimerⓠ\n@c0@"
  it: "@a@b*: Ma io 'o conosco 'st'oggetto!\nComm'hanno fatto a trovallo?!\nE perché l'hanno mettuto a esposizione qua?!\n@c0@"
  ja: "@a@b＊「あわわ…　あれが　ここに\n\tかざられているということは…\n\tあわわわわ……。\n@c0@"
114:
  de: "@a@b*: Also wirklich! Würde wat anderes hier nich' besser herpassen?\n@c0@"
  en: "@a@b*: Really! Wouldn't something else look better exhibited here?\n@c0@"
  es: "@a@b*: ¡Hay que ver! ¿No sería mejor ponéⓘ otra cosa aquí a la vista?\n@c0@"
  fr: "@a@b*ⓢ Vraimentⓠ Il y a sûrement quelque chose qui irait mieux à cette placeⓠ\n@c0@"
  it: "@a@b*: Dico davero!\nNun tenevano n'artro oggetto da mettecelo qua?!\n@c0@"
  ja: "@a@b＊「う～む…\n\tこの場所には　もっと似合いの品が\n\tあるのではないかなあ…。\n@c0@"
115:
  de: "@a@b*: Hah hah! Amateure haben anfangs immer etwas Schwierigkeiten, aber ein Experte wie ich kann die Spreu natürlich gleich vom Weizen trennen.\n@c0@"
  en: "@a@b*: Hah hah! Amateurs often struggle a bit at the start, but a proper expert like me can instantly sort the diamonds from the crystals.\n@c0@"
  es: "@a@b*: ¡Ja, ja! Para los aficionados es complicado, pero un experto como yo enseguida sabe diferenciar el oro de lo que reluce.\n@c0@"
  fr: "@a@b*ⓢ Ha haⓠ Les amateurs ont souvent du mal au début, mais un expert comme moi sait distinguer les petites merveilles de la camelote.\n@c0@"
  it: "@a@b*: Ah ah ah! Agli occhi di un principiante è tutto oro quello che luccica, ma un esperto come me sa riconoscere al volo le cose davvero preziose.\n@c0@"
  ja: "@a@b＊「ふふん！　わしは　金持ちだからな。\n\tめずらしいものなら　いっぱい\n\tわしの家に　あるわい。\n@c0@"
116:
  de: "@a@b*: Wenn Ihr wissen wollt, was etwas wert ist, dann gebe ich Euch gern ein paar Tipps.\n@c0@"
  en: "@a@b*: If you need to know what anything's worth,\r\nI don't mind giving you a few pointers.\n@c0@"
  es: "@a@b*: Si %H0860%Xquieres%Yqueréis%Z saber el valor de algo, no me importa dar%H0860%Xte%Yos%Z unos cuantos consejos.\n@c0@"
  fr: "@a@b*ⓢ Si vous voulez savoir ce que vaut un objet, je suis tout à fait disposé à vous donner quelques explications.\n@c0@"
  it: "@a@b*: Se %H0860%Xvuoi avere informazioni su un oggetto, io posso aiutarti%Yvolete avere informazioni su un oggetto, io posso aiutarvi%Z.\n@c0@"
  ja: "@a@b＊「まあ　お前たちが\n\t物の価値を　知りたいというなら\n\t教えてやっても　いいぞ。\n@c0@"
117:
  de: "@a@b*: Stellt einfach alles, was Euch besonders interessiert, auf das Podest dort, dann schaue ich es mir mal für Euch an.\n@c0@"
  en: "@a@b*: Just pop whatever you're curious about up on that pedestal, and I'll go over it for you.\n@c0@"
  es: "@a@b*: Basta con que %H0860%Xpongas%Ypongáis%Z el objeto en cuestión encima de ese pedestal y yo lo examinaré.\n@c0@"
  fr: "@a@b*ⓢ Il vous suffit de placer l'objet qui vous intéresse sur ce piédestal et je l'examinerai.\n@c0@"
  it: "@a@b*: %H0860%XMetti su quel piedistallo l'oggetto che vuoi farmi analizzare, e ti%YMettete su quel piedistallo l'oggetto che volete farmi analizzare, e vi%Z dirò vita, morte e miracoli del manufatto.\n@c0@"
  ja: "@a@b＊「価値が知りたいものを\n\tそこの台座に　置くんだな。\n@c0@"
118:
  de: "@a@b*: Das ganze Gebäude ist voller Wüstenrosen!\n@c0@"
  en: "@a@b*: You've filled the whole place up with desert roses!\n@c0@"
  es: "@a@b*: ¡Lo %H0860%Xhas%Yhabéis%Z llenado todo de rosas del desierto!\n@c0@"
  fr: "@a@b*ⓢ Vous avez rempli le musée de roses des sablesⓠ\n@c0@"
  it: "@a@b*: Ma in questo Museo ci sono solo rose del deserto?!\n@c0@"
  ja: "@a@b＊「博物館中に　さばくのバラを\n\tかざったようだな。\n@c0@"
119:
  de: "@a@b*: Ihr müsst ja eine Menge Zeit haben. Nicht, dass ich wüsste, wie es wäre, Zeit zu haben. Wir Experten sind ja immer sehr beschäftigt, wisst Ihr.\n@c0@"
  en: "@a@b*: You must have a lot of time on your hands. Mind you, that's not something I'd know about. We experts are always busy, you see.\n@c0@"
  es: "@a@b*: Para mí que %H0860%Xtienes%Ytenéis%Z demasiado tiempo libre. Aunque no sé mucho de eso. Los expertos estamos siempre muy ocupados.\n@c0@"
  fr: "@a@b*ⓢ Vous devez avoir beaucoup de temps libre. Entre nous, ça ne m'arrive jamais. Nous, les experts, nous sommes toujours débordés.\n@c0@"
  it: "@a@b*: Che scelta bislacca!\nLa varietà è l'essenza della vita! Lo sanno anche i bambini...\n@c0@"
  ja: "@a@b＊「なんというか…　ヒマそうで\n\tうらやましいわい。\n\tほれ　わしなんて　忙しい　忙しい！\n@c0@"
120:
  de: "@a@b*: Habt Ihr auf jedes Podest im Museum eine Schokomünze gelegt? Das riecht hier ja wie in einer Schokoladenfabrik!\n@c0@"
  en: "@a@b*: Have you put a chocolate medalliyum on every pedestal in the museum? It smells like a sweet shop\r\nin here!\n@c0@"
  es: "@a@b*: Has colocado un medallón de chocolate en todos los pedestales del museo? ¡Huele como una confitería!\n@c0@"
  fr: "@a@b*ⓢ Vous avez mis des médailles en chocolat sur tous les piédestaux du muséeⓡ J'ai l'impression de me retrouver dans une confiserieⓠ\n@c0@"
  it: "@a@b*: Ma %H0860%Xhai%Yavete%Z messo una medaglia di cioccolato su ogni piedistallo? Più che in un museo, mi sembra di stare in una pasticceria!\n@c0@"
  ja: "@a@b＊「メダル型チョコを\n\t博物館中に　展示したのか？\n\t甘いかおりで　いっぱいだ。\n@c0@"
121:
  de: "@a@b*: Natürlich sind sie ziemlich wertlos. Aber keine schlechte Idee, nehme ich an, für einen Anfänger. Nicht schlecht.\n@c0@"
  en: "@a@b*: Of course, they're pretty much worthless. But still, it's not a bad effort I suppose, for an amateur. Good for you.\n@c0@"
  es: "@a@b*: La verdad es que apenas valen nada. Sin embargo, ha sido un buen intento para %A0110%Xun aficionado%Z%B0110%Xuna aficionada%Z, supongo. Muy bien.\n@c0@"
  fr: "@a@b*ⓢ Bien sûr, elles ne valent pas grand-chose, mais ce n'est pas trop mal pour %A0110%Xun amateur%Z%B0110%Xune amatrice%Z.\nContinuez comme ça.\n@c0@"
  it: "@a@b*: Non valgono molto, ma sono un buon risultato per un principiante.\nDiciamo che %H0860%Xpuoi%Ypotete%Z fare di meglio...\n@c0@"
  ja: "@a@b＊「価値のない　名産だが\n\tここまでやるとは　まあ\n\tいさぎよし！　というところか。\n@c0@"
122:
  de: "@a@b*: Ich sehe, Ihr habt hier alles mit Buddelschiffen vollgestellt.\n@c0@"
  en: "@a@b*: I see you've filled the whole place up with\r\nships in bottles.\n@c0@"
  es: "@a@b*: Veo que %H0860%Xhas%Yhabéis%Z llenado el museo de barcos en botella.\n@c0@"
  fr: "@a@b*ⓢ Je constate que tout le musée est rempli de bateaux en bouteille.\n@c0@"
  it: "@a@b*: Uhm, %H0860%Xhai%Yavete%Z riempito questo posto con navi in bottiglia.\n@c0@"
  ja: "@a@b＊「博物館中に　ボトルシップを\n\tかざったようだな。\n@c0@"
123:
  de: "@a@b*: Ihr veralbert Eure Besucher wohl gern, was, wenn Ihr auf jedem Podest das Gleiche ausstellt!\n@c0@"
  en: "@a@b*: You must enjoy making fun of your visitors, eh, displaying the same item on every pedestal!\n@c0@"
  es: "@a@b*: Supongo que %H0860%Xte%Yos%Z divierte tomar el pelo a los visitantes, ¿no? ¡Mira que poner el mismo objeto en cada pedestal!\n@c0@"
  fr: "@a@b*ⓢ Ça doit vous plaire de vous moquer des visiteurs et de mettre le même objet sur tous les piédestaux...\n@c0@"
  it: "@a@b*: Ma cos'è?! Uno scherzo?!\nNon mi pare una buona idea mettere lo stesso oggetto su tutti i piedistalli!\n@c0@"
  ja: "@a@b＊「同じ展示物を　ただ\n\t並べただけとは　まったく\n\t客を　バカにしと～る！\n@c0@"
124:
  de: "@a@b*: Nun, mir kann das ja egal sein. Ich kann einem schönen Buddelschiff durchaus etwas abgewinnen. So lange es gut gemacht ist, natürlich.\n@c0@"
  en: "@a@b*: Well, I don't mind. I'm quite partial to a good ship in a bottle. Er, as long as it's well-made, of course.\n@c0@"
  es: "@a@b*: Bueno, a mí no me importa. Soy amigo de un buen barco en botella. Siempre que esté bien hecho, claro.\n@c0@"
  fr: "@a@b*ⓢ Moi, ça ne me dérange pas. J'apprécie toujours un beau bateau en bouteille. S'il est bien fait, s'entend...\n@c0@"
  it: "@a@b*: Mah, se sta bene a %H0860%Xte%Yvoi%Z, sta bene anche a me.\nComunque, le navi in bottiglia sono oggetti molto graziosi, a patto che siano ben fatte.\n@c0@"
  ja: "@a@b＊「まあ　わしも　キライじゃないがな。\n\tボトルシップは……。\n@c0@"
125:
  de: "@a@b*: Ah, einer der berühmten Steinach-Saphire!\n@c0@"
  en: "@a@b*: Ah, a fine example of a Whealbrook sapphire, if I'm not mistaken!\n@c0@"
  es: "@a@b*: ¡Ah, veo que %H0860%Xtienes%Ytenéis%Z el famoso Zafiro de Arroyofrío!\n@c0@"
  fr: "@a@b*ⓢ Ah, l'un des célèbres saphirs de Ruycelieuⓠ\n@c0@"
  it: "@a@b*: Ah, ma questo è uno zaffiro di Valcava!\nMolto bello!\n@c0@"
  ja: "@a@b＊「あれは　サンタローズの名産\n\t聖なる宝石だな。\n@c0@"
126:
  de: "@a@b*: Und da sagen die Leute, man findet heutzutage keine hochwertigen Gegenstände mehr. Ein schöner Stein. Groß und glänzend. Was will man mehr?\n@c0@"
  en: "@a@b*: And people say you can't find good quality items these days. This is a fine gem. Large and shiny.\nWhat more could you want?\n@c0@"
  es: "@a@b*: Y dicen que ya no se encuentran artículos de calidad. Pues esta gema es espléndida. Grande y brillante.\n㈡\n*: ¿Qué más se puede pedir?\n@c0@"
  fr: "@a@b*ⓢ Quand j'entends les gens dire qu'on ne trouve plus d'objets de qualité... C'est une pierre magnifique. Grosse et brillante. Que demander de plusⓡ\n@c0@"
  it: "@a@b*: E pensare che, secondo qualche incompetente, di questi tempi non si trovano oggetti preziosi...\n㈡\n*: Questa è una splendida gemma, grande e lucente.\nÈ davvero bella!\n@c0@"
  ja: "@a@b＊「最近は　良いものが取れなくなったと\n\t聞いているが　あれは　大きさも\n\tかがやきも　すばらしい！\n@c0@"
127:
  de: "@a@b*: Nun, zumindest würden das die meisten Leute sagen. Aber ich habe viele Steine, die besser sind als dieser. Daheim, wisst Ihr.\n@c0@"
  en: "@a@b*: Well, that's what most people would tell you.\nBut I've got plenty of gems that outclass this one.\nBack at the house, you know.\n@c0@"
  es: "@a@b*: Bueno, eso es lo que %H0860%Xte%Yos%Z diría casi todo el mundo.\nPero yo tengo muchas gemas que superan a esta.\nEn casa, claro.\n@c0@"
  fr: "@a@b*ⓢ Enfin, c'est ce que la plupart des gens vous diraient, mais je possède des pierres encore bien plus belles chez moi.\n@c0@"
  it: "@a@b*: Certo, io ne posseggo diverse di qualità molto superiore. Le tengo a casa mia, ovviamente.\nNon le porto mica con me!\n@c0@"
  ja: "@a@b＊「…というのは　一般論だがな。\n\tあれくらいの宝石なら\n\tわしの家にも　あるわい。\n@c0@"
128:
  de: "@a@b*: Ein Schlummerkissen aus Wittenhausen, wenn ich nicht irre.\n@c0@"
  en: "@a@b*: A Zizzwizz Pillow from Roundbeck,\r\nif I'm not mistaken.\n@c0@"
  es: "@a@b*: Una almohada afelpada de Golfo Blanco, si no me equivoco.\n@c0@"
  fr: "@a@b*ⓢ Si je ne me trompe pas, c'est un oreiller de Morphée de Blanchecombe.\n@c0@"
  it: "@a@b*: Se non erro, questo è un cuscino Buonriposo di Blankenburg...\nSì, proprio così.\n@c0@"
  ja: "@a@b＊「あれは　アルカパの\n\t安眠まくらじゃないか。\n@c0@"
129:
  de: "@a@b*: Die sind natürlich sehr berühmt, aber warum etwas als kostbar gelten sollte, wenn man es umsonst nachgeworfen bekommt, ist mir ein Rätsel!\n@c0@"
  en: "@a@b*: They're very famous, of course, but why people put any value on something you can get for free is beyond me!\n@c0@"
  es: "@a@b*: ¡Son muy célebres, pero no comprendo cómo la gente valora tanto algo que se puede conseguir gratis!\n@c0@"
  fr: "@a@b*ⓢ Ils sont très réputés, mais je ne vois pas pourquoi les gens accordent autant d'importance à quelque chose qu'ils peuvent avoir gratuitement.\n@c0@"
  it: "@a@b*: Si tratta di un souvenir molto rinomato, ma proprio non riesco a capire perché la gente dia tanto valore a un oggetto che si può avere gratis!\n@c0@"
  ja: "@a@b＊「名産としては　有名だが\n\tあんな　タダで貰えるようなもの\n\t価値があるわけないだろう。\n@c0@"
130:
  de: "@a@b*: Hm. Was ist das denn? Was für ein schmuddeliges Teeservice!\n@c0@"
  en: "@a@b*: Hm. What's this?\r\nWhat a grubby tea set!\n@c0@"
  es: "@a@b*: Mmm. ¿Qué es esto?\r\n¡Vaya juego de té más repugnante!\n@c0@"
  fr: "@a@b*ⓢ Mmm. Qu'est-ce que c'estⓡ\nCe service à thé est dégoûtant.\n@c0@"
  it: "@a@b*: Cos'è questa robaccia, eh?!\nChe brutto, questo servizio da tè!\n@c0@"
  ja: "@a@b＊「なんだ？\n\tあの汚い　ティーセットは？\n@c0@"
131:
  de: "@a@b*: Nun, ich vermute, man könnte die Kunstfertigkeit bewundern, mit der es gefertigt wurde, aber... Ich weiß nicht.\n@c0@"
  en: "@a@b*: I suppose there's something to be said for the craftsmanship that's gone into it perhaps, but...\r\nI don't know.\n@c0@"
  es: "@a@b*: Aunque supongo que se puede valorar el trabajo del artesano que lo hizo, pero...\r\nNo sé, no sé...\n@c0@"
  fr: "@a@b*ⓢ J'imagine que je devrais rendre hommage au travail effectué, mais... je ne vois pas.\n@c0@"
  it: "@a@b*: La fattura non è affatto malvagia, lo ammetto.\nPerò non mi sembra nulla di speciale...\n@c0@"
  ja: "@a@b＊「なにやら　細工が\n\tほどこされているようだが\n\tよくわからんな。\n@c0@"
132:
  de: "@a@b*: Gibt es denn hier niemanden, der die Ausstellungsstücke poliert?\n@c0@"
  en: "@a@b*: Isn't anyone employed to polish\r\nthe exhibits around here?\n@c0@"
  es: "@a@b*: ¿Es que no hay ningún empleado que limpie las piezas?\n@c0@"
  fr: "@a@b*ⓢ Vous n'avez embauché personne pour nettoyer les objets exposésⓡ\n@c0@"
  it: "@a@b*: Forse, con una bella pulitina, assumerebbe un altro aspetto. Ma al Museo del Souvenir non c'è un addetto alla lucidatura degli oggetti?!\n@c0@"
  ja: "@a@b＊「この博物館では\n\t展示品を　みがくことも\n\tしないのかね。\n@c0@"
133:
  de: "@a@b*: Ah! Das berühmte Teeservice von den Geisterzinnen. \n@c0@"
  en: "@a@b*: Ah! The famous tea set from Uptaten Towers.\n@c0@"
  es: "@a@b*: ¡Ah! El famoso juego de té de las Torres Alverres.\n@c0@"
  fr: "@a@b*ⓢ Ahⓠ Le célèbre service à thé des tours Karpatt.\n@c0@"
  it: "@a@b*: Ah!\nMa questo è il famoso servizio da tè delle Torri delle Ombre!\n@c0@"
  ja: "@a@b＊「ふふん　あれは\n\tレヌール王家の　ティーセットだな。\n@c0@"
134:
  de: "@a@b*: Ja, es ist exquisit. Natürlich muss man heutzutage auf Qualität bestehen. Mein Service daheim ist... ja, vielleicht noch ein klein wenig besser als dies hier.\n@c0@"
  en: "@a@b*: Yes, it's splendid. Of course, you have to insist on quality these days. The set I use at home is... Yes, I'd say it's even a little better than this one.\n@c0@"
  es: "@a@b*: Es espléndido, sí. Por supuesto, en estos tiempos en que vivimos la calidad es imprescindible.\n㈡\n*: El juego de té que uso en casa es... Yo diría que un poco mejor que este.\n@c0@"
  fr: "@a@b*ⓢ Il est splendide. C'est vrai qu'il faut insister sur la qualité de nos jours. Le service que j'utilise à la maison... je pense qu'il est un peu plus beau encore.\n@c0@"
  it: "@a@b*: È una meraviglia, non è vero? Per oggetti di questo genere, la qualità è tutto. Anch'io ne ho uno simile a casa, ma il mio è decisamente più raffinato.\n@c0@"
  ja: "@a@b＊「すばらしい出来だが　うちで\n\t普段使いにしているものと\n\t同じくらいの　品物だな。\n@c0@"
135:
  de: "@a@b*: Gute Göttin! Graf Kryptos Krone!\n@c0@"
  en: "@a@b*: Good Goddess! The Crown of Count Uptaten!\n@c0@"
  es: "@a@b*: ¡Santa Diosa! ¡La corona del conde Alverres!\n@c0@"
  fr: "@a@b*ⓢ Par la Déesseⓠ La couronne des Karpattⓠ\n@c0@"
  it: "@a@b*: Oh, santa dea!\nLa Corona delle Ombre!\n@c0@"
  ja: "@a@b＊「あれは　まさしく\n\tレヌールの名君　エリック王の王冠！\n@c0@"
136:
  de: "@a@b*: Diese Qualität findet man nur in der Gegend der Geisterzinnen. Ein wunderbares Stück!\n@c0@"
  en: "@a@b*: You only find quality like this in the region of Uptaten. It's an absolutely wonderful piece.\n@c0@"
  es: "@a@b*: Solo en la región de Alverres se encuentra artesanía de esta calidad. Es una pieza maravillosa.\n@c0@"
  fr: "@a@b*ⓢ On ne trouve cette qualité que dans la région des Karpatt. C'est une pièce absolument magnifique.\n@c0@"
  it: "@a@b*: Souvenir di tale qualità si trovano esclusivamente nella Regione delle Ombre.\nQuesto diadema è un vero capolavoro.\n@c0@"
  ja: "@a@b＊「レヌールは　工芸のさかんな\n\t地域だけあって\n\t細工も　すばらしい！\n@c0@"
137:
  de: "@a@b*: Und ich würde sagen, es ist auch recht wertvoll. Ich muss für meine Sammlung ein ähnlich gutes Stück bestellen. Man will sich ja nicht ausstechen lassen!\n@c0@"
  en: "@a@b*: I'd say it's rather valuable too. I'll have to order a crown of similar stature for my collection. Don't like to be outdone, you know!\n@c0@"
  es: "@a@b*: Y diría que muy valiosa. Tendré que pedir que me hagan una corona de categoría parecida para mi colección. ¡No me gusta que me superen!\n@c0@"
  fr: "@a@b*ⓢ Elle doit valoir cher. Il va falloir que je commande une couronne comme celle-là pour ma collection.\nJe déteste qu'on fasse mieux que moi.\n@c0@"
  it: "@a@b*: Ovviamente, si tratta di un oggetto preziosissimo!\nNe ordinerò subito uno uguale per la mia collezione personale!\n㈡\n*: %H0860%XSai%YSapete%Z, non potrei sopportare di non avere una meraviglia simile...\n@c0@"
  ja: "@a@b＊「これは　かなり高そうだ。\n\tよし　わしも　あれより　りっぱな\n\t冠を　作らせることにしよう！\n@c0@"
138:
  de: "@a@b*: Was um Himmels willen ist das denn? Das ist doch bloß ein Blütenzweig, oder nicht?\n@c0@"
  en: "@a@b*: What on earth's that? It's just a blooming branch, isn't it?\n@c0@"
  es: "@a@b*: ¿Pero qué demonios es eso? No es más que una rama en flor, ¿verdad?\n@c0@"
  fr: "@a@b*ⓢ Qu'est-ce que c'est que çaⓡ Une vulgaire branche en fleur, c'est toutⓡ\n@c0@"
  it: "@a@b*: E questo cos'è?\nÈ un semplicissimo ramo in fiore, vero?\n@c0@"
  ja: "@a@b＊「あれは　ただの\n\t桜のひと枝だろう？\n@c0@"
139:
  de: "@a@b*: Es ist zwar etwas recht Rätselhaftes an ihm, aber dennoch, ein Zweig ist ein Zweig. Der hat gar keinen Wert.\n@c0@"
  en: "@a@b*: There's certainly something rather enigmatic\r\nabout it, but still, a branch is a branch. It doesn't have any value.\n@c0@"
  es: "@a@b*: Hay algo misterioso en ella, pero en fin, una rama es una rama. No tiene valor alguno.\n@c0@"
  fr: "@a@b*ⓢ Certes, elle a quelque chose d'assez énigmatique, mais ce n'est qu'une branche. Ça ne vaut strictement rien.\n@c0@"
  it: "@a@b*: Certo, è carino, e ha anche un non so che di affascinante, ma resta pur sempre un ramoscello senza alcun valore.\n@c0@"
  ja: "@a@b＊「神秘的な感じはするが\n\t桜は　桜。\n\tそれ以上　何の価値もないな。\n@c0@"
140:
  de: "@a@b*: Was? Es ist ein Blütenzweig aus einem Dorf voller Feen? Seid doch nicht albern! Es gibt keine Feen. Das ist bloß ein Zweig, sonst nichts.\n@c0@"
  en: "@a@b*: What? It's a sprig of blossom from a village full of faeries? Don't be absurd! There's no such thing as faeries. It's just a branch.\n@c0@"
  es: "@a@b*: ¿Qué? ¿Que la rama en flor viene de un poblado de hadas? ¡Menuda sandez! Las hadas no existen. No es más que una rama.\n@c0@"
  fr: "@a@b*ⓢ Commentⓡ Elle vient d'un village de féesⓡ\nUn peu de sérieux, voyonsⓠ Les fées n'existent pas.\nC'est juste une branche.\n@c0@"
  it: "@a@b*: Come %H0860%Xdici%Ydite%Z?\nÈ un ramoscello incantato proveniente dalla terra delle fate?!\n㈡\n*: Certo, come no?! E io sono l'uomo più ricco del mondo! Ehm, in realtà lo sono davvero...\nVolevo dire che le fate non esistono. Lo sanno tutti!\n@c0@"
  ja: "@a@b＊「なに？　妖精の村の桜？\n\tそんな村　あるわけないだろう。\n\tどう見ても　ふつうの桜だよ。\n@c0@"
141:
  de: "@a@b*: Ah, die erlesen geformte Spieldose von Tifortu. Ja, sie wurde von einem der besten Kunsthandwerker Tifortus angefertigt.\n@c0@"
  en: "@a@b*: Ah, the beautifully formed marital organ of Coburg. Yes, it was made by one of Coburg's\r\nfinest craftsmen.\n@c0@"
  es: "@a@b*: ¡Ah!, una caja de música nupcial de Trastámara bellamente labrada. La fabricó uno de los mejores artesanos de aquella región.\n@c0@"
  fr: "@a@b*ⓢ Ah, une délicate boîte à musique de Cobourg.\nÇa se voit qu'elle a été fabriquée par l'un des meilleurs artisans de la ville.\n@c0@"
  it: "@a@b*: Che bello questo carillon nuziale.\nSe la memoria non m'inganna, si tratta di un souvenir realizzato da un artigiano di Coburg.\n@c0@"
  ja: "@a@b＊「あれは　ラインハットの工芸師の\n\t手による　オルゴールだな。\n@c0@"
142:
  de: "@a@b*: Das weiß ich, weil er auch die hervorragende Uhr angefertigt hat, die bei mir zu Hause im Eingang hängt.\n@c0@"
  en: "@a@b*: I know because he also made the exquisite timepiece I have in the hallway at home.\n@c0@"
  es: "@a@b*: Lo sé porque también hizo un exquisito reloj que tengo en el vestíbulo de mi casa.\n@c0@"
  fr: "@a@b*ⓢ Je le sais parce qu'il a également fabriqué la très belle horloge qui orne l'entrée de ma maison.\n@c0@"
  it: "@a@b*: Conosco bene quel bravo artista, perché ha anche realizzato alcuni dei trecentosessantadue orologi da tavolo che tengo a casa.\n@c0@"
  ja: "@a@b＊「わが家の　時計も\n\t同じ者に　作らせているので\n\tすぐにわかったよ。\n@c0@"
143:
  de: "@a@b*: Oh weh! Die Einfassung ist leer! Da ist wohl das Geld ausgegangen, bevor der Stein eingesetzt werden konnte. Das mindert den Wert natürlich.\n@c0@"
  en: "@a@b*: Oh dear! Look at this empty setting. It looks like the money ran out before the jewel could be set in place. What a shame, it really rather spoils it.\n@c0@"
  es: "@a@b*: ¡Vaya! Fíjate en ese engaste vacío.\n㈡\n*: Se debieron quedar sin dinero antes de poder engastar la joya. Es una lástima, la verdad es que echa a perder el objeto.\n@c0@"
  fr: "@a@b*ⓢ Oh nonⓠ Regardez cet emplacement vide.\nOn n'avait plus assez d'argent pour mettre la pierre. C'est vraiment dommage parce que cela gâche tout.\n@c0@"
  it: "@a@b*: Toh, %H0860%Xguarda%Yguardate%Z qui!\nC'è uno spazio vuoto!\n㈡\n*: Sembra che chi ha commissionato questo gioiellino abbia finito i quattrini prima di potervi incastonare una pietra preziosa. Oh, è un vero peccato...\n@c0@"
  ja: "@a@b＊「おや？　この　くぼみは…\n\t宝石を入れるお金が　なかったのか？\n\tかわいそうに！\n@c0@"
144:
  de: "@a@b*: Oh ja! Eine schöne Spieldose! Und der Stein, mit dem sie besetzt ist, ist wirklich faszinierend.\n@c0@"
  en: "@a@b*: Oh, yes! A fine organ! And the gem set into it is absolutely stunning.\n@c0@"
  es: "@a@b*: ¡Oh, %H0860%Xmira%Ymirad%Z! ¡Una espléndida caja de música! Y la gema que tiene engarzada es deslumbrante.\n@c0@"
  fr: "@a@b*ⓢ Ohⓠ Quelle magnifique boîte à musiqueⓠ\nEt la pierre qui est incrustée dessus est à couper\nle souffle.\n@c0@"
  it: "@a@b*: Questo carillon nuziale è assolutamente delizioso, e la pietra preziosa che vi è incastonata lo rende un pezzo davvero unico!\n@c0@"
  ja: "@a@b＊「むむ　みごとな　オルゴール。\n\t中に　はめられた宝石も\n\tなかなか！\n@c0@"
145:
  de: "@a@b*: Es schmerzt mich, zugeben zu müssen, dass ich damit nicht mithalten kann. Ich habe nichts Vergleichbares daheim.\n@c0@"
  en: "@a@b*: It pains me to say that I can't compete. I don't have anything like this at home.\n@c0@"
  es: "@a@b*: A mi pesar, no puedo competir con esto. En casa no tengo nada parecido.\n@c0@"
  fr: "@a@b*ⓢ Ça me fait mal de le dire, mais je m'incline.\nJe n'ai rien de tel chez moi.\n@c0@"
  it: "@a@b*: Io non... Io non ho...\nUrgh! Non ci riesco!\n%H0860%XAspetta%YAspettate%Z, ci riprovo...\n㈡\n*: Io non ho nulla del genere a casa.\nArgh! Penso di non aver mai detto una frase del genere prima d'ora...\n@c0@"
  ja: "@a@b＊「くやしいが　あれだけのものは\n\tうちにはないな…。\n@c0@"
146:
  de: "@a@b*: Da muss ich wohl meinen Kunsthandwerker antreiben, mir etwas Besseres zusammenzubasteln, das Euch den Atem verschlagen wird!\n@c0@"
  en: "@a@b*: I'll have to whip my craftsman into action and get him to knock up something better that'll knock your socks off!\n@c0@"
  es: "@a@b*: ¡Tendré que decirle a mi artesano que espabile y me salga con alguna cosa mejor que %H0860%Xte%Yos%Z deje patidifus%H0860%X%A0110%Xo%Z%B0110%Xa%Z%Y%R0000%Xas%Yos%Z%Z!\n@c0@"
  fr: "@a@b*ⓢ Il va falloir que j'exige de mon artisan qu'il me fabrique quelque chose d'encore mieux qui vous laissera bouche béeⓠ\n@c0@"
  it: "@a@b*: Chiamerò subito il miglior artigiano del mondo e gli chiederò di realizzare un capolavoro che farà sembrare il %H0860%Xtuo%Yvostro%Z carillon roba da poveracci!\n@c0@"
  ja: "@a@b＊「よし！　さっそく\n\tうちの　おかかえ職人に\n\tあれ以上のものを　作らせるとしよう！\n@c0@"
147:
  de: "@a@b*: Oh ja, das ist eine der Schlichten Statuetten, welche die Nonnen vom Stift Obendroben als Glücksbringer für Reisende anfertigen.\n@c0@"
  en: "@a@b*: Oh yes, that's one of the rather crude images the sisters of Heaven's Above Abbey make as charms for travellers.\n@c0@"
  es: "@a@b*: ¡Ah!, sí, es una de esas imágenes más bien toscas que las hermanas de la Abadía Subcelestis tallan como amuletos para los viajeros.\n@c0@"
  fr: "@a@b*ⓢ Ah oui, c'est l'une des statuettes grossières que les sœurs de l'abbaye du Firmament fabriquent et offrent aux voyageurs pour leur porter chance.\n@c0@"
  it: "@a@b*: Questa è una delle statuette grezze che le suore dell'Abbazia di Su'ncyel realizzano per i pellegrini che visitano il loro monastero.\n㈡\n*: Si dice che queste immagini sacre garantiscano la protezione della dea...\n@c0@"
  ja: "@a@b＊「あれは　修道院のシスターたちが\n\t旅のお守りに　ひとつひとつ\n\t作っているという　木ぼりの女神像。\n@c0@"
148:
  de: "@a@b*: Ich will natürlich nicht unhöflich sein. Sicher tun sie ihr Bestes. Die Statuetten sind nur, nun... recht primitiv, nicht wahr?\n@c0@"
  en: "@a@b*: I don't mean to be rude, of course. I'm sure they work very hard at them. They're just rather, well...shabby, aren't they?\n@c0@"
  es: "@a@b*: Con esto no pretendo ser grosero, evidentemente. Estoy seguro de que las hacen con todo cariño. Pero son un poco... cutres, ¿verdad?\n@c0@"
  fr: "@a@b*ⓢ Ne voyez rien de méchant dans mes propos.\nJe suis sûr qu'elles y passent du temps, mais... elles sont un peu miteuses quand même, nonⓡ\n@c0@"
  it: "@a@b*: Non voglio certo mancare di rispetto a quelle sante donne e al frutto del loro impegno, ma questo non mi pare proprio un capolavoro!\n@c0@"
  ja: "@a@b＊「ていねいに　作られてはいるが\n\tなんというか…\n\tみすぼらしい　品物だな。\n@c0@"
149:
  de: "@a@b*: Oh, gut. Ich bin froh, dass Ihr mir zustimmt. Ich glaube nicht an die Göttin und all dieses Gebrabbel über göttliche Fügung und so.\n@c0@"
  en: "@a@b*: Oh good, I'm glad you agree. I don't believe in the Goddess and all that divine guidance mumbo-jumbo.\n@c0@"
  es: "@a@b*: Bien, menos mal que %H0860%Xestás%Yestáis%Z de acuerdo conmigo. Yo no creo en la Diosa ni en todas esas paparruchadas sobre divinidades.\n@c0@"
  fr: "@a@b*ⓢ Oh, je suis heureux que vous soyez d'accord.\nJe ne crois pas du tout à la Déesse et à toutes ces sornettes divines.\n@c0@"
  it: "@a@b*: Inoltre, non penso affatto che una semplice statuetta possa attirare la protezione della dea.\n@c0@"
  ja: "@a@b＊「お前たちも　そう思うか。\n\tわしも　神とか　ごりやくとかは\n\t信じんのだよ。\n@c0@"
150:
  de: "@a@b*: Oh! Haltet Ihr sie denn für wertvoll? Dann passt lieber gut darauf auf. Die Göttin hilft denen, die an sie glauben... so sagt man.\n@c0@"
  en: "@a@b*: Oh! What, you think it's got some value, do you?\r\nThen you'd better keep it safe. The Goddess comes to help Her believers...or so I've heard.\n@c0@"
  es: "@a@b*: ¡Ah! ¿Que %H0860%Xcrees%Ycreéis%Z que tiene algún valor, %H0860%Xdices%Ydecís%Z?\nPues será mejor que la %H0860%Xguardes%Yguardéis%Z bien. La Diosa acude a la ayuda de sus fieles... dicen.\n@c0@"
  fr: "@a@b*ⓢ Ohⓠ Vous pensez qu'elle a une certaine valeurⓡ\nDans ce cas, prenez-en soin. La Déesse aide toujours ses disciples... à ce qu'on dit.\n@c0@"
  it: "@a@b*: Come? Secondo %H0860%Xte%Yvoi%Z quest'affare ha davvero dei poteri soprannaturali?! Buon per %H0860%Xte che ci credi! Allora vedi di tenertelo%Yvoi che ci credete! Allora vedete di tenervelo%Z stretto!\n@c0@"
  ja: "@a@b＊「ふん！　価値があるというのか？\n\tなら　大事に持っているんだな。\n\t信じる者は　救われるかもしれんし！\n@c0@"
151:
  de: "@a@b*: Ist das die Schleimschleife aus der Geheimniskrämerei in Fortuna?\n@c0@"
  en: "@a@b*: Isn't that the slime curio from the Old Curiosity Shop in Fortuna?\n@c0@"
  es: "@a@b*: ¿No es eso el souvenir limoso de la Vieja Tienda de Curiosidades de Fortuna?\n@c0@"
  fr: "@a@b*ⓢ Ce ne serait pas la breloque de gluants de la Petite boutique des curiosités de Bonaventureⓡ\n@c0@"
  it: "@a@b*: Cosa vedono i miei occhi?!\nUna mitica cintura degli Slime della Bottega Rari & Antichi di Fortuna?!\n@c0@"
  ja: "@a@b＊「あ　あ　あれは！\n\tオラクル屋ののれん　ではないか！\n@c0@"
152:
  de: "@a@b*: Ja, ich habe mir mal etwas Ähnliches anfertigen lassen, aber es hatte irgendwie nicht das gewisse Etwas.\n@c0@"
  en: "@a@b*: Yes, I had someone make me a similar thing once, but it just didn't have the same ⓗje ne sais quoiⓘ...\n@c0@"
  es: "@a@b*: Sí, una vez hice que me fabricaran uno igual, pero le faltaba ese ⓕje ne sais quoiⓖ...\n@c0@"
  fr: "@a@b*ⓢ J'avais demandé à quelqu'un de m'en faire une semblable, mais il lui manquait ce petit je-ne-sais-quoi... \n@c0@"
  it: "@a@b*: Ricordo che qualche tempo fa me ne feci realizzare una simile, ma devo riconoscere che questa è molto più bella.\n@c0@"
  ja: "@a@b＊「わしも　以前　同じようなものを\n\t作らせたが　あの　びみょうな\n\t雰囲気が　だせなくて…。\n@c0@"
153:
  de: "@a@b*: Dafür würde ich sofort dreihunderttausend Goldmünzen locker machen. Auf der Stelle! Ihr habt wirklich Glück.\n@c0@"
  en: "@a@b*: I'd pay three hundred thousand gold coins for that any day of the week. No, every day of the week! You're a lucky %A0110%Xfellow%Z%B0110%Xlady%Z.\n@c0@"
  es: "@a@b*: Pagaría tres mil monedas de oro por él sin pestañear. ¡Qué digo!, ¡sin respirar siquiera! Eres %A0110%Xun muchacho afortunado%Z%B0110%Xuna chica afortunada%Z.\n@c0@"
  fr: "@a@b*ⓢ Je serais prêt à donner 300000 pièces d'or pour cette breloque.\n㈡\n*ⓢ Rectificationⓢ je SUIS prêt à vous donner cette somme quand vous voulezⓠ Vous avez de la chance, mon ami%A0110%X%Z%B0110%Xe%Z.\n@c0@"
  it: "@a@b*: Pagherei anche trecentomila monete d'oro per quest'oggetto, se solo trovassi qualcuno disposto a vendermelo! Sei %A0110%Xfortunato ad averlo, amico mio%Z%B0110%Xfortunata ad averla, amica mia%Z...\n@c0@"
  ja: "@a@b＊「わしなら　あれに\n\t３０００００ゴールド　出しても\n\tおしくない！　う　うらやましい！！\n@c0@"
154:
  de: "@a@b*: Eines der berühmten Bakenmünder Buddelschiffe, was?\n@c0@"
  en: "@a@b*: One of Lodestar Harbour's famous\r\nships in bottles, eh?\n@c0@"
  es: "@a@b*: Uno de los célebres barcos en botella de Puerto Polaris, ¿eh?\n@c0@"
  fr: "@a@b*ⓢ C'est l'un des célèbres bateaux en bouteille de Port-Lanterne, n'est-ce pasⓡ\n@c0@"
  it: "@a@b*: Uhm, questa è una nave in bottiglia, il famoso souvenir di Grandport.\n@c0@"
  ja: "@a@b＊「あれは　港町ポートセルミの\n\t名産　ボトルシップだな。\n@c0@"
155:
  de: "@a@b*: Bei der Detailtreue des Schiffes muss es von einem recht erfahrenen Kunsthandwerker geschaffen worden sein. Das ist vermutlich einiges wert.\n@c0@"
  en: "@a@b*: Judging by the detail on the ship, it must have been made by a fairly skilled craftsman. It's probably worth a reasonable amount of gold.\n@c0@"
  es: "@a@b*: A juzgar por el nivel de detalle del barco, el artesano que lo hizo era realmente hábil. Probablemente valga una respetable cantidad de oro.\n@c0@"
  fr: "@a@b*ⓢ À en juger par la finesse des détails, il a été fabriqué par un très bon artisan. Vous pourriez sûrement en tirer une belle somme.\n@c0@"
  it: "@a@b*: A giudicare dall'elevato livello di dettaglio, quest'oggetto è stato realizzato da un artigiano veramente in gamba. Direi che vale un bel po' di soldi.\n@c0@"
  ja: "@a@b＊「中に　入っている船の細工からすると\n\tかなりの腕前の　職人の作品…\n\tまあまあの値段が　つくだろう。\n@c0@"
156:
  de: "@a@b*: Oh, du meine Güte! Eine Schreckensscheuche!\n@c0@"
