186:
  de: "@a@b*: Ich liege bestimmt total daneben, aber ist das ein echter Yggdrasil-Schössling?\n@c0@"
  en: "@a@b*: I'm sure I'm way off here, but is that a genuine Yggdrasil sapling?\n@c0@"
  es: "@a@b*: Seguro que me equivoco, pero ¿es eso un genuino retoño de Yggdrasil?\n@c0@"
  fr: "@a@b*ⓢ Je me trompe sûrement, mais serait-ce une véritable pousse d'Yggdrasil que vous avez làⓡ\n@c0@"
  it: "@a@b*: Ho le traveggole, o quello che vedo è proprio un virgulto di Ygdrasil?!\n@c0@"
  ja: "@a@b＊「まさかと思うが　あれは\n\t世界樹の苗木じゃないだろうね？\n@c0@"
187:
  de: "@a@b*: Na so was! Das hätte ich jetzt nicht erwartet! Ihr steckt voller Überraschungen, wie?\n@c0@"
  en: "@a@b*: Well! I didn't expect that! You're full of surprises, aren't you?\n@c0@"
  es: "@a@b*: ¡Vaya! ¡Esto sí que no me lo esperaba! %H0860%XEres%YSois%Z una caja de sorpresas, ¿eh?\n@c0@"
  fr: "@a@b*ⓢ Eh bienⓠ Je ne m'attendais pas à çaⓠ Vous êtes vraiment quelqu'un de surprenant, pas vraiⓡ\n@c0@"
  it: "@a@b*: Questa sì che è una sorpresa!\nComplimenti! Bel colpo!\n@c0@"
  ja: "@a@b＊「ふふん！　このわしを\n\tびっくりさせおって。\n@c0@"
188:
  de: "@a@b*: Ich dachte, es wäre vielleicht künstlich oder so. Ein so wertvolles Stück Grünzeug findet man nicht jeden Tag in einer Museumsausstellung.\n@c0@"
  en: "@a@b*: I thought maybe it was plastic or something.\r\nYou don't see such a valuable piece of greenery\r\non display in a museum like this every day!\n@c0@"
  es: "@a@b*: Pensaba que sería de plástico o algo así.\r\n¡Una planta así de valiosa no se ve todos los días en un museo!\n@c0@"
  fr: "@a@b*ⓢ Je me disais que ce devait être une fausse ou quelque chose comme ça. Ce n'est pas tous les jours qu'on voit des plantes aussi précieuses en exposition.\n@c0@"
  it: "@a@b*: Pensavo che fosse una riproduzione in plastica, o qualcosa del genere. Confesso che non avevo mai visto un oggetto simile in un museo!\n@c0@"
  ja: "@a@b＊「ニセモノだと　思っておったよ。\n\tあんな貴重な苗木が\n\tここに　あるわけがない！\n@c0@"
189:
  de: "@a@b*: Ha ha ha! Nein, einen Yggdrasil-Schössling würde man wohl kaum in einem staubigen alten Museum vermuten, was?\n@c0@"
  en: "@a@b*: Ha ha ha! No, you wouldn't expect to see an Yggdrasil sapling in a dingy old museum like this, would you?\n@c0@"
  es: "@a@b*: ¡Ja, ja, ja! No, uno no se espera encontrar un retoño de Yggdrasil en un museo viejo y destartalado como este, ¿a que no?\n@c0@"
  fr: "@a@b*ⓢ Ha ha haⓠ Non, bien sûr, personne ne s'attendrait à voir une pousse d'Yggdrasil dans un musée aussi minable, pas vraiⓡ\n@c0@"
  it: "@a@b*: Ah ah ah! Ma certo! Non avrei nemmeno dovuto chiedertelo... Figuriamoci se in un museo come questo poteva esserci un vero virgulto di Ygdrasil!\n@c0@"
  ja: "@a@b＊「はっはっは　世界樹の苗木が\n\tこんな場所に　あるわけないだろう。\n@c0@"
190:
  de: "@a@b*: Ich meine, nicht mal ich habe einen.\n@c0@"
  en: "@a@b*: I mean, even I don't own one of them.\n@c0@"
  es: "@a@b*: Vamos, ni siquiera yo tengo uno de esos.\n@c0@"
  fr: "@a@b*ⓢ C'est vrai, même moi, je n'en ai pas.\n@c0@"
  it: "@a@b*: %H0860%XPensa%YPensate%Z che nemmeno io ne ho uno a casa!\n@c0@"
  ja: "@a@b＊「この　わしですら持っていない\n\t大変　貴重なものなんだぞ。\n@c0@"
191:
  de: "@a@b*: Oh, ist das eine sogenannte Feenfeder?\n@c0@"
  en: "@a@b*: Oh, is that what they call a faerie quill?\n@c0@"
  es: "@a@b*: Vaya, ¿no es eso que llaman una pluma de hada?\n@c0@"
  fr: "@a@b*ⓢ Oh, c'est bien ça qu'on appelle une plume féeriqueⓡ\n@c0@"
  it: "@a@b*: Oh, ma quella è una penna fatata?\n@c0@"
  ja: "@a@b＊「あれは？\n\t妖精の羽ペンだと　いうのかね？\n@c0@"
192:
  de: "@a@b*: Sie ist unglaublich kunstfertig gemacht. Sie sieht ja fast echt aus. Aber sie ist natürlich künstlich, nicht wahr?\n@c0@"
  en: "@a@b*: The plumage looks incredibly well-made. Almost real, even. Obviously it's manufactured though, isn't it?\n@c0@"
  es: "@a@b*: La pluma parece excepcionalmente bien hecha. Casi parece real. Pero, obviamente, es artificial, ¿verdad?\n@c0@"
  fr: "@a@b*ⓢ Cette plume est vraiment très bien faite.\nOn croirait presque une vraie.\nMais c'est une fausse, n'est-ce pasⓡ\n@c0@"
  it: "@a@b*: La piuma è fatta talmente bene da sembrare vera. Questa, però, è una riproduzione fatta da un artigiano, vero?\n@c0@"
  ja: "@a@b＊「確かに　羽の細工は\n\tよくできているが\n\t作り物に　きまっているよ。\n@c0@"
193:
  de: "@a@b*: Beeindruckend. Natürlich fertigen meine Kunsthandwerker die ganze Zeit solche Dinge an, aber das ist dennoch sehr beeindruckend.\n@c0@"
  en: "@a@b*: Impressive. Naturally, my craftsmen make things like this all the time, but it's still very impressive.\n@c0@"
  es: "@a@b*: Impresionante. Por supuesto, mis artesanos crean cosas parecidas continuamente, pero sigue siendo impresionante.\n@c0@"
  fr: "@a@b*ⓢ Je suis impressionné. Bien sûr, mes artisans font ce genre de choses tous les jours, mais ça reste impressionnant.\n@c0@"
  it: "@a@b*: È davvero splendida.\nNon ha nulla da invidiare a quelle che acquisto dai miei fornitori.\n@c0@"
  ja: "@a@b＊「まあ　あれくらいなら\n\tうちの　おかかえ職人にも\n\t作れるだろうね。\n@c0@"
194:
  de: "@a@b*: Ihr wollt mir auf die Nase binden, dass sie echt ist? Na, also ich weiß nicht. Vielleicht könnt Ihr mir das ja irgendwann einmal beweisen, hm?\n@c0@"
  en: "@a@b*: You're trying to tell me it's real? I don't know about that. Perhaps you'd like to prove that to me sometime, hm?\n@c0@"
  es: "@a@b*: ¿Quieres decir que es real? No sé, no sé... Me lo %H0860%Xtendrías%Ytendríais%Z que demostrar un día, ¿qué %H0860%Xte%Yos%Z parece?\n@c0@"
  fr: "@a@b*ⓢ Vous êtes en train de me dire que c'est une vraieⓡ Je ne suis pas convaincu. Si un jour vous êtes en mesure de m'apporter des preuves...\n@c0@"
  it: "@a@b*: %H0860%XVorresti%YVorreste%Z darmi a bere che si tratta di una vera penna fatata? È impossibile! Ci crederò solo dopo che me lo %H0860%Xavrai%Yavrete%Z provato!\n@c0@"
  ja: "@a@b＊「なんと　本物だというのかね！\n\tこりゃ　おどろきだ。　いつかそれを\n\t証明してもらいたいものだね。\n@c0@"
195:
  de: "@a@b*: Wer würde denn so gruselige Illustrationen anfertigen?\n@c0@"
  en: "@a@b*: Who on earth would illustrate something\r\nso creepily?\n@c0@"
  es: "@a@b*: ¿Quién sería capaz crear estas ilustraciones tan espantosas?\n@c0@"
  fr: "@a@b*ⓢ Je me demande bien qui peut être à l'origine d'illustrations aussi terrifiantes.\n@c0@"
  it: "@a@b*: Diamine! Queste illustrazioni sono spaventose!\n@c0@"
  ja: "@a@b＊「あの　気味の悪い絵が\n\t描かれたものは　なんだね？\n@c0@"
196:
  de: "@a@b*: Was? Es ist aus einer Stadt in Nadiria? Ihr meint, der Unterwelt?!\n@c0@"
  en: "@a@b*: What? It's from a town in Nadiria?\nYou mean, the underworld!?\n@c0@"
  es: "@a@b*: ¿Qué? ¿Que es de una ciudad de Nadiria?\r\n¡¿Te refieres al inframundo?!\n@c0@"
  fr: "@a@b*ⓢ Pardonⓡ Cela vient d'une ville de Nadiriaⓡ\nDes Enfers, vous voulez direⓠⓑ\n@c0@"
  it: "@a@b*: Come %H0860%Xdici%Ydite%Z? Proviene da un villaggio che si trova a Nadiria?\nDal Regno degli Inferi, %H0860%Xintendi%Yintendete%Z?\n@c0@"
  ja: "@a@b＊「なに？\n\t魔界の町の名産品だと？\n@c0@"
197:
  de: "@a@b*: Ha ha ha! Sehr lustig. Aber Ihr müsst Euch schon mehr anstrengen, um mich aufs Glatteis zu führen!\n@c0@"
  en: "@a@b*: Ha ha ha! Very funny. But you'll have to try harder than that to fool me, I'm afraid.\n@c0@"
  es: "@a@b*: ¡Ja, ja, ja! Muy gracioso. Pero vas a tener que esforzarte más si pretendes tomarme el pelo.\n@c0@"
  fr: "@a@b*ⓢ Ha ha haⓠ Très drôle, mais je ne me fais pas rouler aussi facilement. Désolé.\n@c0@"
  it: "@a@b*: Ah ah ah! %H0860%XTi faccio i complimenti per la tua%YVi faccio i complimenti per la vostra%Z immaginazione! Sono troppo cresciuto per credere a panzane del genere!\n@c0@"
  ja: "@a@b＊「ふふん！　わしを\n\tからかおうとしおって！\n\tわしは　だまされんぞ！\n@c0@"
198:
  de: "@a@b*: Das dachte ich mir. Da hat jemand ein bisschen herumgekrakelt, was? Aber unheimlich ist es schon. Richtig unheimlich.\n@c0@"
  en: "@a@b*: I didn't think so. Someone's just been having a bit of fun doodling, haven't they? It is creepy, though. Really creepy.\n@c0@"
  es: "@a@b*: Eso me parecía. Alguien se lo ha pasado en grande haciendo garabatos, ¿eh? Pero es espantoso. Espantoso de verdad.\n@c0@"
  fr: "@a@b*ⓢ Effectivement, ça m'aurait étonné. Ce doit être un amateur qui s'est amusé à griffonner. Ça me fait quand même froid dans le dos, remarquez.\n@c0@"
  it: "@a@b*: Lo sapevo. Questo souvenir è solo semplicemente l'opera di qualche buontempone che si diverte a fare disegni terrificanti...\n@c0@"
  ja: "@a@b＊「そうだろう　そうだろう。\n\tあんなの　ただの落書きだよ。\n\tしかし　気持ちの悪い　絵だな。\n@c0@"
199:
  de: "@a@b*: Meine Güte! Ist das ein Exemplar des Fama-Folianten?\n@c0@"
  en: "@a@b*: Goodness! Isn't that a copy of the\r\nScuttlebutt Alledger?\n@c0@"
  es: "@a@b*: ¡Por la Diosa! ¡Una copia de ⓕEl Mentidero Verdaderoⓖ!\n@c0@"
  fr: "@a@b*ⓢ Par la Déesseⓠ Mais c'est un exemplaire des\nOn-dit de Milleragotsⓡ\n@c0@"
  it: "@a@b*: Santo cielo!\nMa quella è una copia delle ⓕCronache di Inchucheniaⓖ?\n@c0@"
  ja: "@a@b＊「まさか　あれは\n\tうわさのほこらにある\n\tうわさのノートではないのか？\n@c0@"
200:
  de: "@a@b*: Hah hah hah! Und Ihr glaubt, so etwas sollte man in einem Museum ausstellen?\n@c0@"
  en: "@a@b*: Hah hah hah! And you think that's something to put on display in the museum?\n@c0@"
  es: "@a@b*: ¡Ja, ja, ja! ¿Y %H0860%Xtú crees%Y%R0000%Xvosotras%Yvosotros%Z creéis%Z que una cosa así se puede exponer en el museo?\n@c0@"
  fr: "@a@b*ⓢ Ha ha haⓠ Et vous croyez que c'est quelque chose qui a sa place dans un muséeⓡ\n@c0@"
  it: "@a@b*: Ah ah ah!\n%H0860%XCredi%YCredete%Z che un oggetto del genere meriti di essere esposto in un museo?!\n@c0@"
  ja: "@a@b＊「はっはっは！　この博物館に\n\tあのようなものを\n\tかざろうと　言うのかね？\n@c0@"
201:
  de: "@a@b*: Meine Angestellten nutzen so etwas als Schmierpapier! Zu mehr taugt es nicht!\n@c0@"
  en: "@a@b*: My staff use that kind of thing as scrap paper! It's not good for anything more than that!\n@c0@"
  es: "@a@b*: ¡Mis empleados usan esta clase de revistas para limpiar las ventanas! ¡No vale para nada más que para eso!\n@c0@"
  fr: "@a@b*ⓢ Mes employés s'en servent comme papier brouillonⓠ\nJe ne vois pas à quoi ça peut servir d'autreⓠ\n@c0@"
  it: "@a@b*: Quella pubblicazione è utile per accendere il fuoco nel camino, e poco altro!\nÈ un vero spreco di carta!\n@c0@"
  ja: "@a@b＊「あんなもの　わしの屋敷では\n\t召使いの　ちり紙にしておるよ。\n\tそれくらいしか　使い道もないわ！\n@c0@"
202:
  de: "@a@b*: Nein? Nun ja, jedenfalls ist es total wertlos. Wenn Ihr so etwas ausstellen würdet, würde man Euch nur auslachen.\n@c0@"
  en: "@a@b*: No? Well anyway, it's utterly worthless.\nYou'll be laughed off the premises if you put something like that on display.\n@c0@"
  es: "@a@b*: ¿No? Bueno, de todos modos, no tiene valor alguno.\n㈡\n*: Si %H0860%Xexpones%Yexponéis%Z algo así la gente se morirá de risa.\n@c0@"
  fr: "@a@b*ⓢ Nonⓡ De toute façon, ça ne vaut strictement rien.\nTout le monde se paierait votre tête si vous exposiez ce torchon.\n@c0@"
  it: "@a@b*: No? Meglio così.\nQuel testo sarà anche un souvenir caratteristico, ma non vale assolutamente nulla.\n@c0@"
  ja: "@a@b＊「どのみち　価値のないものよ。\n\tあんなものを　この博物館に\n\tかざったら　笑い者だよ。\n@c0@"
203:
  de: "@a@b*: Das ist doch der Wimpel der Wiederkehr, den man bekommt, wenn man ein paarmal im Gasthaus Berge absteigt, nicht?\n@c0@"
  en: "@a@b*: That's the Forget-me-Knot flag you get for staying a certain number of nights in the Knot Welcome Inne, isn't it?\n@c0@"
  es: "@a@b*: Eso es el banderín de Pasada que te dan si te alojas unas cuantas noches en la Posada Pasada, ¿verdad?\n@c0@"
  fr: "@a@b*ⓢ C'est le fanion de mamie Pie, le petit drapeau qu'elle donne si vous passez plusieurs nuits à l'auberge de la Pie, c'est çaⓡ\n@c0@"
  it: "@a@b*: Questo è il gagliardetto di Serena, il souvenir che si riceve dopo aver trascorso un certo numero di notti alla Locanda Serena.\n@c0@"
  ja: "@a@b＊「あれは　ネッドの宿屋に\n\t何度か　泊まるともらえるという\n\tネッドのペナント　かな？\n@c0@"
204:
  de: "@a@b*: Er ist interessant als Kunsthandwerksarbeit, aber ansonsten total wertlos. Ich habe einen ganzen Haufen davon zu Hause.\n@c0@"
  en: "@a@b*: It's interesting as a piece of craftsmanship, but it's completely worthless. I've got a mountain of\r\nthem at home.\n@c0@"
  es: "@a@b*: Es una pieza de artesanía interesante, pero no tiene ningún valor. En casa tengo un montón de ellos.\n@c0@"
  fr: "@a@b*ⓢ La méthode de fabrication est intéressante, mais ça ne vaut strictement rien. J'en ai des tonnes à la maison.\n@c0@"
  it: "@a@b*: Non nego che sia ben fatto, ma non vale nulla.\nCredo di averne alcune centinaia in uno dei miei magazzini...\n@c0@"
  ja: "@a@b＊「手作りで　味はあるが\n\t名産としての価値は　全くないね！\n\tうちの物置にも　山ほどあるわい。\n@c0@"
205:
  de: "@a@b*: Ist das etwa ein Elefantasten-Tintenhorn? Das ist äußerst wertvoll, wisst Ihr.\n@c0@"
  en: "@a@b*: Is that a tusk-tusk tusk inkwell? And did I get\nthe right number of ⓗtusksⓘ? It's extremely valuable, you know.\n@c0@"
  es: "@a@b*: ¡Tate! ¿Un tintero de tantor? ¿Y he sido capaz de decir todas esas ⓕtⓖ seguidas?\nPues es extraordinariamente valioso.\n@c0@"
  fr: "@a@b*ⓢ Pincez-moiⓠ C'est bien un encrier d'ivoireⓡ\nÇa vaut très cher, vous savez.\n@c0@"
  it: "@a@b*: Oh, un magicalamaio!\nBeh, questo sì che è un bel souvenir!\nBello e prezioso.\n@c0@"
  ja: "@a@b＊「パオームのインクかね。\n\tあれは　なかなかの価値が\n\tあるんだよ。\n@c0@"
206:
  de: "@a@b*: Es soll ungewöhnliche Kräfte besitzen. Das kommt durch eine uralte Herstellungsmethode, die nur in Nordmünster bekannt ist.\n@c0@"
  en: "@a@b*: They say it has unusual powers too. On account of some ancient production method known only to\r\nthe people of Northminster.\n@c0@"
  es: "@a@b*: También dicen que tiene singulares poderes. Es por ese método de fabricación artesana que solo conoce la gente de Silos.\n@c0@"
  fr: "@a@b*ⓢ Il paraît que l'encre qu'il contient a aussi des pouvoirs particuliers. Ils seraient dus à sa méthode de fabrication,\nque seuls les gens de Saint Glinglin connaissent.\n@c0@"
  it: "@a@b*: Pare che il processo con cui l'inchiostro del magicalamaio viene creato, noto solo ai monaci del Monastero Scribarum, gli doni poteri magici.\n@c0@"
  ja: "@a@b＊「北の教会に　古くから伝わる製法で\n\t作られたインクで　なんでも\n\tふしぎな力が　あるのだとか…。\n@c0@"
207:
  de: "@a@b*: Natürlich weiß niemand, ob das wirklich stimmt oder nicht. Dass es besondere Kräfte besitzt, meine ich.\n@c0@"
  en: "@a@b*: Of course, no one really knows if it really does or not. Have special powers, I mean.\n@c0@"
  es: "@a@b*: Claro que, en realidad, nadie sabe si los tiene o no. Si tiene poderes especiales, digo.\n@c0@"
  fr: "@a@b*ⓢ Bien entendu, personne n'a apporté la preuve qu'elle en avait. Des pouvoirs spéciaux, je veux dire.\n@c0@"
  it: "@a@b*: Ovviamente, questa è solo una diceria!\nNessuno sa con certezza se questo souvenir sia realmente dotato di proprietà soprannaturali.\n@c0@"
  ja: "@a@b＊「というのは　ウワサで\n\t本当に　そんな力があるのか\n\t誰にも　わからないんだがね。\n@c0@"
208:
  de: "@a@b*: Ist das eine Art Musikinstrument? Vielleicht das, was die Leute eine Schrillerpfeife nennen?\n@c0@"
  en: "@a@b*: Is that some kind of musical instrument?\nThat may be what people call the ghoulroarer.\n@c0@"
  es: "@a@b*: ¿Eso es una especie de instrumento musical?\r\nPodría ser eso que llaman bramadera.\n@c0@"
  fr: "@a@b*ⓢ C'est une sorte d'instrument de musiqueⓡ\nJe ne suis pas totalement sûr, mais ce doit être un appeau de chagrin.\n@c0@"
  it: "@a@b*: È uno strumento musicale, non è vero?\nCredo che si chiami ⓕrombo tonanteⓖ, se non erro.\n@c0@"
  ja: "@a@b＊「あれは　楽器？\n\t呪いのうなり木　というのかね。\n@c0@"
209:
  de: "@a@b*: Was? Wenn man es herumwirbelt, macht es ein Geräusch, als wenn Leute kreischen?\n@c0@"
  en: "@a@b*: What? If you whirl it around, it makes the sound of people screaming?\n@c0@"
  es: "@a@b*: ¿Qué? ¿Que si la haces girar, suena como personas gritando?\n@c0@"
  fr: "@a@b*ⓢ Commentⓡ Si vous le faites tournoyer, il émet un son de gens qui crientⓡ\n@c0@"
  it: "@a@b*: Come %H0860%Xdici%Ydite%Z?\nSuonandolo si sentono grida umane disperate?\n@c0@"
  ja: "@a@b＊「それで　奏でると\n\t人々の叫び声のような\n\t音が出る…　と？\n@c0@"
210:
  de: "@a@b*: Das ist ja lächerlich!\n@c0@"
  en: "@a@b*: How ridiculous!\n@c0@"
  es: "@a@b*: ¡Ridículo!\n@c0@"
  fr: "@a@b*ⓢ C'est complètement idiotⓠ\n@c0@"
  it: "@a@b*: Di sciocchezze ne ho sentite tante in vita mia, ma questa è davvero grossa!\n@c0@"
  ja: "@a@b＊「ふん！　ばかばかしい！\n@c0@"
211:
  de: "@a@b*: Ah, ein Medaillon. Und nach der Machart zu urteilen, würde ich sagen, es gehörte Prinzessin Magda.\n@c0@"
  en: "@a@b*: Ah, a locket. And judging by the design, I'd say it belonged to Princess Mada.\n@c0@"
  es: "@a@b*: ¡Ah!, un camafeo. Y, a juzgar por su forma, debió de pertenecer a la princesa Perséfone.\n@c0@"
  fr: "@a@b*ⓢ Ah, un pendentif. Et si j'en juge par le dessin, je dirais qu'il a appartenu à la princesse Magdalena.\n@c0@"
  it: "@a@b*: Ah, che bel medaglione!\nA giudicare dalla foggia, direi che sia appartenuto alla regina Mada.\n@c0@"
  ja: "@a@b＊「あれは　思い出のロケットペンダント。\n\tあの　おしるしからすると\n\tマーサ妃の持ち物と　思われるな。\n@c0@"
212:
  de: "@a@b*: Hah hah hah! Überrascht? Ich war bei ihrer Hochzeit, müsst Ihr wissen. Darum kenne ich es.\n@c0@"
  en: "@a@b*: Hah hah hah! Surprised? I attended her wedding, you see. That's how I know.\n@c0@"
  es: "@a@b*: ¡Ja, ja, ja! ¿Sorprendid%A0110%Xo%Z%B0110%Xa%Z? Fui invitado a su boda. Por eso lo sé.\n@c0@"
  fr: "@a@b*ⓢ Ha ha haⓠ Je vous ai surpris%A0110%X%Z%B0110%Xe%Zⓡ J'ai assisté à son mariage. C'est pour ça que je le sais.\n@c0@"
  it: "@a@b*: Non %H0860%Xti aspettavi%Yvi aspettavate%Z che lo sapessi, eh? Fui invitato al matrimonio della Principessa, e in tale occasione ebbi la possibilità di vedere questo souvenir.\n@c0@"
  ja: "@a@b＊「ふふん！　よく知っておるだろう。\n\tじつは　あの　成婚式には\n\tわしも　出席したんだ。\n@c0@"
213:
  de: "@a@b*: Aber dazu gehört eigentlich ein Bild. Was daraus wohl geworden ist?\n@c0@"
