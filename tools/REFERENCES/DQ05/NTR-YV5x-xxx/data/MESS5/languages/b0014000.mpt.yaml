  de: "@aKati Krams@bNun ja, Silber ist ziemlich kostspielig. So etwas findet man sicher in einem Schloss oder so.\n@c0@"
  en: "@aSue Veneer@bWell, silverware's a bit pricey. It's the sort of thing ye'd find in a castle or the like, I should think.\n@c0@"
  es: "@aNuray Niada@bBueno, la viajilla de plata es un poco cara. Creo que si pueden encontrar cosas así en castillos y sitios pariecidos, sí.\n@c0@"
  fr: "@aMarie-Jo Konde@bGénéralement, l'argenterie coûte cher. Je suppose que c'est le genre de vaisselle que vous trouveriez dans un château ou quelque chose comme ça.\n@c0@"
  it: "@aSue Venir@bNon tutti possono permettersi delle stoviglie d'argento di questo tipo. Direi che roba del genere si possa trovare in un castello, o in luoghi simili...\n@c0@"
  ja: "@a@bミミ「銀の食器は　高価なものだから\n\tきっと　どこかのお城に\n\t伝わるものじゃ　ないかしら？\n@c0@"
242:
  de: "@aKati Krams@bDas Teeservice? Das habt Ihr doch schon, Schnellmerker!\n@c0@"
  en: "@aSue Veneer@bThe tea set? Y'already have it, ye daft eejit.\n@c0@"
  es: "@aNuray Niada@b¿El juego de té? Ya lo tienes, %A0110%Xtiarugo%Z%B0110%Xtiaruga%Z.\n@c0@"
  fr: "@aMarie-Jo Konde@bLe service à théⓡ Vous l'avez déjà, gros%A0110%X malin%Z%B0110%Xse maligne%Z.\n@c0@"
  it: "@aSue Venir@bIl servizio da tè?\nGuarda che già ce l'hai!\n@c0@"
  ja: "@a@bミミ「銀のティーセット？\n\tあなたは　もう\n\t手に入れているわよね。\n@c0@"
243:
  de: "@aKati Krams@bAllerdings ⓚⓛ liegt das nur an mir oder sieht es wirklich ein wenig vernachlässigt aus?\n@c0@"
  en: "@aSue Veneer@bAlthough, is it just me, or does it look like it's been neglected a wee bit?\n@c0@"
  es: "@aNuray Niada@bIgual es cosa mía, pero pariece que está un poco diescuidado.\n@c0@"
  fr: "@aMarie-Jo Konde@bÀ ce propos, c'est moi ou il a connu des jours meilleursⓡ\n@c0@"
  it: "@aSue Venir@bA proposito del servizio da tè, sbaglio o è un po' malridotto?\n@c0@"
  ja: "@a@bミミ「でも　なにかもっと……\n\t見落としているような気がするのは\n\t私だけかしら？\n@c0@"
244:
  de: "@aKati Krams@bEin Blütenzweig?! Ich habe da mal von einem besonderen immerblühenden Zweig oder so gehört...\n@c0@"
  en: "@aSue Veneer@bA blooming branch!? I did hear sometin' about a special branch that was always in bloom or sometin' like that...\n@c0@"
  es: "@aNuray Niada@b¡¿Una riama en flor?! Sí, algo he oído por ahí de una riama que estaba siempre en flor o algo así...\n@c0@"
  fr: "@aMarie-Jo Konde@bUne branche en fleurⓠⓑ Effectivement, j'ai entendu parler d'une branche spéciale qui était toujours en fleur ou quelque chose dans ce goût-là...\n@c0@"
  it: "@aSue Venir@bIl ramo in fiore?\nSe non sbaglio, avevo sentito parlare di un ramo particolare che è sempre in fiore.\n@c0@"
  ja: "@a@bミミ「桜のひと枝ね……。\n\tずっと花が　咲き続ける　ふしぎな\n\t枝だって　聞いたことがあるけど……\n@c0@"
245:
  de: "@aKati Krams@bIch dachte, Ihr hättet mir mal erzählt, dass Ihr so etwas habt. Habt ihn wohl irgendwo liegenlassen, was?\n@c0@"
  en: "@aSue Veneer@bI thought ye told me ye had one yerself once.\r\nHave ye forgotten it somewhere, have ye?\n@c0@"
  es: "@aNuray Niada@bCreo que una vez mi dijiste que tú tienías una de esas.\r\n¿La has olvidiado en alguna parte?\n@c0@"
  fr: "@aMarie-Jo Konde@bJe crois que c'est vous qui m'avez dit que vous en aviez eu une, un jour. Vous l'avez perdue quelque partⓡ\n@c0@"
  it: "@aSue Venir@bPensavo mi avessi detto che una volta tu ne avevi uno.\nL'hai forse dimenticato da qualche parte?\n@c0@"
  ja: "@a@bミミ「あなたなら　見たことが\n\tあるんじゃなくて？　どこかに\n\t忘れていないかしら。\n@c0@"
246:
  de: "@aKati Krams@bEine Schlichte Statuette? Von der Göttin, meint Ihr?\n@c0@"
  en: "@aSue Veneer@bA crude image? Of the Goddess, ye mean?\n@c0@"
  es: "@aNuray Niada@b¿Una imagien tosca? ¿De la Diosa, quieres diecir?\n@c0@"
  fr: "@aMarie-Jo Konde@bUne statuette grossièreⓡ De la Déesse, vous voulez direⓡ\n@c0@"
  it: "@aSue Venir@bLa statuetta grezza?\nUna statuetta della dea, intendi?\n@c0@"
  ja: "@a@bミミ「木ぼりの女神像ね。\n@c0@"
247:
  de: "@aKati Krams@bIch habe mal von einer Abtei gehört, in der die Nonnen den lieben langen Tag beim Beten Statuetten der Göttin anfertigen.\n@c0@"
  en: "@aSue Veneer@bI did hear about an abbey somewhere where the nuns spend all day makin' images o' the Goddess\r\nwhile they pray.\n@c0@"
  es: "@aNuray Niada@bSí, he oído hablar de una abadía en donde las monjas si pasan todo el día haciendo imágienes de la Diosa mientras riezan, sí.\n@c0@"
  fr: "@aMarie-Jo Konde@bOn m'a parlé d'une abbaye où les sœurs fabriquent des statuettes de la Déesse pendant qu'elles prient.\n@c0@"
  it: "@aSue Venir@bMi è giunta voce che le suore che vivono in una certa abbazia trascorrono le giornate pregando e realizzando statuette della dea...\n@c0@"
  ja: "@a@bミミ「そういえば　どこかの修道院では\n\t祈りをこめて　女神像を彫るのが\n\t日課だって　聞いたことがあるけど。\n@c0@"
248:
  de: "@aKati Krams@bEin Schlummerkissen? Die sind total bequem. Ich nehme nichts anderes mehr.\n@c0@"
  en: "@aSue Veneer@bA Zizzwizz Pillow?\r\nThey're mighty comfortable.\r\nI'm a total convert.\n@c0@"
  es: "@aNuray Niada@b¿Una almohada afielpada?\r\nSon muy cómodas.\r\nYo soy una fan de ellas.\n@c0@"
  fr: "@aMarie-Jo Konde@bUn oreiller de Morphéeⓡ\nIls sont vraiment confortables.\nJe suis une inconditionnelle.\n@c0@"
  it: "@aSue Venir@bIl cuscino Buonriposo è comodissimo.\nUna volta che lo provi, non puoi più farne a meno.\n@c0@"
  ja: "@a@bミミ「安眠まくらね。\n\tフカフカで　私も　大好きよ。\n@c0@"
249:
  de: "@aKati Krams@bAber wo hab ich meins noch gleich her? Ehrlich, ich weiß es einfach nicht mehr. Wahrscheinlich irgendwo in einer Herberge, wo es doch ein Kissen ist und so.\n@c0@"
  en: "@aSue Veneer@bNow where in the world did I lay me hands on my one? Honest to the Goddess, I can't remember. It must've been an inn, I s'pose, bein' a pillow an' all.\n@c0@"
  es: "@aNuray Niada@b¿Dónde consieguí yo la mía? Por la Profieta que no mi acuerdo. Supongo que siería en una posadaⓓ claro, al sier una almohada...\n@c0@"
  fr: "@aMarie-Jo Konde@bOù est-ce que j'ai bien pu trouver le mienⓡ\nPour être tout à fait sincère, je ne m'en souviens plus. Sans doute dans une auberge...\n@c0@"
  it: "@aSue Venir@bA me ne hanno regalato uno, però non so bene dove l'abbiano preso. A occhio e croce, direi che proveniva da una locanda...\n@c0@"
  ja: "@a@bミミ「ええと　私のは　どこで\n\t手に入れたんだったかしら？\n\tまくらって言うくらいだから　宿屋？\n@c0@"
250:
  de: "@aKati Krams@bOh ja, mit einer solchen Schreckensscheuche jagt Ihr den Leuten bestimmt einen Mordsschrecken ein! Die ist ja wirklich zum Fürchten.\n@c0@"
  en: "@aSue Veneer@bOh, ye'd put the fear o' the Goddess in people with a terrorcrow like that! It's awful scary, so it is.\n@c0@"
  es: "@aNuray Niada@b¡Con un horrorizacuervos como ese sieguro que metes el tiemor de la Diosa en el cuerpo de la giente! Ti hace morir de miedo, ¿vierdad?\n@c0@"
  fr: "@aMarie-Jo Konde@bOh, il y a de quoi filer la frousse à tout le monde avec un épouvanteur comme çaⓠ\nIl fait vraiment peurⓠ\n@c0@"
  it: "@aSue Venir@bSe vuoi spaventare qualcuno, non c'è niente di meglio di un bello spaventamostri!\nBello, eh? Beh, si fa per dire!\n@c0@"
  ja: "@a@bミミ「いや～ん　コワモテかかしね？\n\tなんでも　すっごくこわい　かかし\n\tらしいから……\n@c0@"
251:
  de: "@aKati Krams@bWer die gemacht hat, hat auf den Feldern bestimmt etwas Fürchterliches abschrecken müssen.\n@c0@"
  en: "@aSue Veneer@bWhoever made it must've been havin' a terrible time of it in the fields.\n@c0@"
  es: "@aNuray Niada@bSieguro que la piersona que lo hizo debía estar tieniendo dificultades en los campos.\n@c0@"
  fr: "@aMarie-Jo Konde@bSon propriétaire devait avoir un gros problème dans ses champs pour fabriquer quelque chose d'aussi horrible.\n@c0@"
  it: "@aSue Venir@bNon so chi lo abbia realizzato, ma di certo quel poverino deve aver avuto degli ospiti terrificanti sui suoi campi!\n@c0@"
  ja: "@a@bミミ「よほど　こまってる畑の持ち主が\n\t使ってるんじゃ　ないかしら？\n@c0@"
252:
  de: "@aKati Krams@bDas ist das Lokalbräu von Wunnermühl. Ich habe die Leute oft davon reden hören, aber ich habe noch nie selbst welchen zu Gesicht bekommen.\n@c0@"
  en: "@aSue Veneer@bⓙTis the local brew of Zoomingale, that.\nI've heard talk about it often enough, but I've never actually seen it meself.\n@c0@"
  es: "@aNuray Niada@bEs el licor típico de Telele, sí.\r\nHe oído hablar mucho de él, pero nunca lo había visto.\n@c0@"
  fr: "@aMarie-Jo Konde@bC'est l'alcool local de Moulinsort. J'en ai souvent entendu parler, mais je n'en ai jamais vu de mes propres yeux.\n@c0@"
  it: "@aSue Venir@bLa ⓕDeliziaⓖ è la bevanda tipica di Milleventi.\nNe ho sentito parlare spesso, ma non ne ho mai vista nemmeno una goccia...\n@c0@"
  ja: "@a@bミミ「ルラフェンの地酒ね。\n\tうわさには　聞いたことあるけど\n\t見たことはないわ。\n@c0@"
253:
  de: "@aKati Krams@bDie guten Leutchen von Wunnermühl tun fast so, als wäre es Goldstaub. Er ist praktisch nicht zu kriegen, außer über Beziehungen, hab ich mir sagen lassen.\n@c0@"
  en: "@aSue Veneer@bThe good folk of Zoomingale treat it like gold dust, so they do. Ye can only lay yer hands on it if ye know someone from there, or so I hear.\n@c0@"
  es: "@aNuray Niada@bPara la giente de Telele es tan valioso como agua en mitad del diesierto, sí. Dicen que solo si puede consieguir si conoces a alguien de allí.\n@c0@"
  fr: "@aMarie-Jo Konde@bPour les gens de là-bas, il n'y a pas plus précieux. Il paraît que vous ne pouvez vous en procurer que si vous connaissez quelqu'un du pays.\n@c0@"
  it: "@aSue Venir@bLa gente di Milleventi ne è golosissima. E gelosissima, anche! È possibile procurarsene qualche bottiglia solo se si è molto amici di qualche abitante del posto.\n@c0@"
  ja: "@a@bミミ「地元の人が　大事にしてるから\n\t知り合いでもないと\n\tもらえないんじゃないかしら？\n@c0@"
254:
  de: "@aKati Krams@bIch habe keine Ahnung, was das sein soll. Sieht merkwürdig aus, oder? Hat vielleicht was mit einem Eurer Freunde zu tun.\n@c0@"
  en: "@aSue Veneer@bI don't know what in the world this is.\nIt's a strange-looking thing, isn't it? Probably sometin' to do with one of yer friends, I should think.\n@c0@"
  es: "@aNuray Niada@bNo tiengo ni idea de qué es esto.\r\nTiene un aspiecto muy extriaño, ¿vierdad? Diebe de ser cosa de alguno de tus amigos, sieguro.\n@c0@"
  fr: "@aMarie-Jo Konde@bJe n'ai aucune idée de ce que ça peut être.\r\nC'est assez bizarre. Je suppose que ça doit avoir un rapport avec l'un de vos amis.\n@c0@"
  it: "@aSue Venir@bAh, non ho proprio idea di cosa sia quella roba.\nForse ha a che fare con qualcuno dei tuoi amici?\n@c0@"
  ja: "@a@bミミ「それは　私にも　分からないわ。\n\tでも　たぶん　あなたのお友だちに\n\t関係のあるものじゃ　ないかしら？\n@c0@"
255:
  de: "@aKati Krams@bIst das nicht diese hübsche Spieldose? Ich dachte, die hättet Ihr schon, oder?\n@c0@"
  en: "@aSue Veneer@bIsn't that that nice marital organ?\nI thought y'already had that, didn't ye?\n@c0@"
  es: "@aNuray Niada@b¿No es eso una bonita caja de música nupcial?\r\nPiensaba que ya tienías una de esas, sí.\n@c0@"
  fr: "@aMarie-Jo Konde@bCe n'est pas cette jolie boîte à musiqueⓡ\nJe croyais que vous l'aviez déjàⓡ\n@c0@"
  it: "@a@bIl carillon nuziale è un oggetto carinissimo!\nNon ne avevi già uno?\n@c0@"
  ja: "@a@bミミ「記念オルゴール？\n\tあなたは　もう\n\t手に入れているわよね。\n@c0@"
256:
  de: "@aKati Krams@bAber ich weiß nicht. Es ist wundervoller Schnickschnack, aber mir kommt es so vor, als fehlte da etwas.\n@c0@"
  en: "@aSue Veneer@bI don't know, though. 'Tis a wonderful knick-knack, but I just feel like there's sometin' missin'.\n@c0@"
  es: "@aNuray Niada@bNo sé, no sé. Es una cosina muy monina, pero pariece como si le faltiase algo.\n@c0@"
  fr: "@aMarie-Jo Konde@bIl y a un truc qui me chiffonne. C'est une pièce magnifique, mais j'ai l'impression qu'il manque quelque chose.\n@c0@"
  it: "@a@bHo come la sensazione che gli manchi qualcosa.\nNon so, mi sembra incompleto...\n@c0@"
  ja: "@a@bミミ「でも　なにかもっと……\n\t大事なものが　少し\n\t足りない気も　するわね。\n@c0@"
257:
  de: "@aKati Krams@bDie ist aus Fortuna, oder? Auf die bin ich selbst total neugierig. Ich frage mich, ob sie Euch nicht eine verkaufen würden?\n@c0@"
  en: "@aSue Veneer@bThat's from Fortuna, isn't it? I'm dead curious about it meself. I wonder if they wouldn't sell ye one there.\n@c0@"
  es: "@aNuray Niada@bViene de Fortuna, ¿vierdad? Yo misma mi muero de curiosidad. ¿Tú crees que mi vienderían una allá?\n@c0@"
  fr: "@aMarie-Jo Konde@bC'est un objet de Bonaventure, pas vraiⓡ Moi-même, je serais très curieuse de le voir. Je me demande si vous ne pourriez pas le trouver en vente là-bas.\n@c0@"
  it: "@aSue Venir@bChe oggetto curioso!\nViene da Fortuna, non è vero?\nNon sapevo che lì vendessero cose di questo tipo...\n@c0@"
  ja: "@a@bミミ「オラクル屋ののれん　かあ……。\n\t私も　とっても気になるのよね。\n\tなんとか　売ってもらえないかしらね。\n@c0@"
258:
  de: "@aKati Krams@bDer Tratschinger Fama-Foliant? Angeblich liegt er in einer Schänke, wo sich die Leute gern auf einen Schwatz treffen, aber ich weiß nicht, ob das stimmt.\n@c0@"
  en: "@aSue Veneer@bThe Scuttlebutt Alledger? Now allegedly, it's kept in an inn where folk like to get together fer a chinwag, but I don't know the truth of it.\n@c0@"
  es: "@aNuray Niada@b¿ⓕEl Mentidiero Vierdaderoⓖ? Dicen que lo guardan en una posada donde la giente si reúne para marujiear, pero no ti lo puedo asiegurar.\n@c0@"
  fr: "@aMarie-Jo Konde@bLes On-dit de Milleragotsⓡ Ils seraient conservés dans une auberge où les gens se retrouvent pour papoter, mais je n'en suis pas complètement sûre.\n@c0@"
  it: "@aSue Venir@bPare che sia possibile trovare le ⓕCronache di Inchucheniaⓖ in una certa locanda dove la gente si ritrova per scambiarsi pettegolezzi.\n㈡\nIo, però, non saprei dirti se la cosa sia vera o meno!\n@c0@"
  ja: "@a@bミミ「うわさのノートね。\n\tなんでも　うわさ好きのお客さんが\n\t集まる宿に　置いてあるらしいわよ。\n@c0@"
259:
  de: "@aKati Krams@bDie rotweißen Honigbrötchen? Das muss ich Euch doch bestimmt nicht erklären.\n@c0@"
  en: "@aSue Veneer@bThe red and white honey buns?\nSurely ye don't need to ask me about them.\n@c0@"
  es: "@aNuray Niada@b¿Los bollitos rojos y blancos?\r\nPiero yo no sé nada de ellos que tú no siepas, ¿vierdad?\n@c0@"
  fr: "@aMarie-Jo Konde@bLes gâteaux au miel rouge et blancⓡ\nC'est à moi que vous posez la questionⓡ\n@c0@"
  it: "@aSue Venir@bI panini dolci rossi e bianchi?\nE devo essere io a darti informazioni su di essi?!\n@c0@"
  ja: "@a@bミミ「紅白まんじゅうですって？\n\tあらっ　それなら\n\t私に　聞くまでもないんじゃない？\n@c0@"
260:
  de: "@aKati Krams@bDie waren doch ein Gastgeschenk auf Eurer Hochzeit mit %a001230, %a000090, wisst Ihr nicht mehr? Sie sind eine Spezialität von Mostroferrato.\n@c0@"
  en: "@aSue Veneer@bThey were a gift at yer weddin', %a000090, remember? When ye married %a001230? They're a speciality of Mostroferrato.\n@c0@"
  es: "@aNuray Niada@bFueron un riegalo de tu boda, ¿no ti acuerdas, %a000090? ¿Cuando ti casaste con %a001230? Son una espiecialidad de Mostrofierrato.\n@c0@"
  fr: "@aMarie-Jo Konde@bC'était l'un des souvenirs de votre mariage, %a000090. De votre mariage avec %a001230.\nC'est une spécialité de Mostroferrato.\n@c0@"
  it: "@aSue Venir@bSono stati offerti in occasione del tuo matrimonio con %a001230, %a000090! Non mi dirai che hai dimenticato di esserti sposato, eh?!\n㈡\nComunque sia, i panini dolci sono una specialità di Mostroferrato.\n@c0@"
  ja: "@a@bミミ「%a000090さんと　%a001230さんの\n\t記念の品ですもの。　それに\n\tサラボナの名産まんじゅうでしょ。\n@c0@"
261:
  de: "@aKati Krams@bIch habe gehört, dass sie seit kurzem in einer Stadt am Meer Buddelschiffe verkaufen. Wo war das denn noch gleich?\n@c0@"
  en: "@aSue Veneer@bI heard they started sellin' ships in bottles in some town by the sea recently. Where was it now?\n@c0@"
  es: "@aNuray Niada@bDicen que hace poco si han empiezado a viender barcos en botellas en una ciudad de la costa. ¿Dónde era?\n@c0@"
  fr: "@aMarie-Jo Konde@bJ'ai entendu dire que quelqu'un vendait des\nbateaux en bouteille dans une ville côtière.\nOù est-ce que ça pouvait bien être, déjàⓡ\n@c0@"
  it: "@aSue Venir@bSecondo le mie informazioni, recentemente hanno iniziato a vendere navi in bottiglia in un villaggio costiero. Purtroppo non so dirti altro...\n@c0@"
  ja: "@a@bミミ「ボトルシップなら　最近\n\tどこかの　港町で　売り出したらしいわ。\n@c0@"
262:
  de: "@aKati Krams@bEine Wüstenrose? Puh, das ist jetzt aber ganz schön romantisch, oder?\n@c0@"
  en: "@aSue Veneer@bA desert rose? Phew! That's a bit romantic now,\r\nisn't it?\n@c0@"
  es: "@aNuray Niada@b¿Una rosa del diesierto? ¡Ufff! Es un poco romántico, ¿no?\n@c0@"
  fr: "@aMarie-Jo Konde@bUne rose des sablesⓡ Comme c'est romantique.\n@c0@"
  it: "@aSue Venir@bLa rosa del deserto è il più romantico di tutti i souvenir.\n@c0@"
  ja: "@a@bミミ「さばくのバラ……\n\tロマンティックよね。\n@c0@"
263:
  de: "@aKati Krams@bSie sind sehr schwer zu kriegen, habe ich gehört. Dazu muss man anscheinend in einer Herberge mitten in der Wüste übernachten.\n@c0@"
  en: "@aSue Veneer@bThey're mighty hard to come by, so I hear.\r\nYe have to take lodgin's in some inn in the\r\nmiddle o' the desert, apparently.\n@c0@"
  es: "@aNuray Niada@bDicen que son muy difíciles de encontrar.\r\nParece que ti tienes que alojar en una posada en mitad del diesierto, sí.\n@c0@"
  fr: "@aMarie-Jo Konde@bIl paraît que ce n'est pas facile d'en trouver.\r\nApparemment, il faut prendre une chambre dans une auberge en plein milieu du désert.\n@c0@"
  it: "@aSue Venir@bLe rose del deserto non sono facili da trovare.\nSecondo me ti conviene trascorrere la notte in una locanda nel deserto, e poi dare un'occhiata in giro.\n@c0@"
  ja: "@a@bミミ「でも　とるのは　大変なのよ。\n\tなんたって　暑い砂漠の国で\n\t宿を　とらなきゃいけないし……。\n@c0@"
264:
  de: "@aKati Krams@bBlitzendes Badesalz? Das gab's mal in einem Kurort oben in den Bergen zu kaufen.\n@c0@"
  en: "@aSue Veneer@bScintillating sinter? They used to sell it in a spa town up in the mountains, ye know.\n@c0@"
  es: "@aNuray Niada@b¿Sales destiellantes? Las solían viender en una ciudad balneario de las montañas.\n@c0@"
  fr: "@aMarie-Jo Konde@bDes sels scintillantsⓡ Autrefois, on pouvait en acheter dans une ville thermale située dans les montagnes.\n@c0@"
  it: "@aSue Venir@bI sali da bagno scintillanti?\nSe non erro, tempo fa li vendevano in un villaggio termale che si trova tra i monti.\n@c0@"
  ja: "@a@bミミ「秘湯の花ね。\n\t昔は　山奥の温泉地でも\n\t売ってたようだけど……\n@c0@"
265:
  de: "@aKati Krams@bAber jetzt ist da kaum noch dranzukommen. Niemand verkauft einem mehr was. Sicher hat noch irgendwer etwas davon, aber ich weiß nicht, wer.\n@c0@"
  en: "@aSue Veneer@bBut it's murder to get hold of now. No one's sellin' it at all at all. I s'pose someone must still have some,\r\nbut I don't know who.\n@c0@"
  es: "@aNuray Niada@bPero ahora no hay quien las consiga. Nadie las viende. Supongo que alguien diebe de tener algunas, pero no sé quien podrá ser.\n@c0@"
  fr: "@aMarie-Jo Konde@bMais aujourd'hui, c'est presque impossible à trouver. Plus personne n'en vend. Je suppose que quelqu'un doit encore en avoir, mais je ne sais pas qui.\n@c0@"
  it: "@aSue Venir@bOra, però, credo che non siano più commercializzati.\nSono difficilissimi da trovare, sai? Comunque, pare che un tizio ne abbia ancora un po'...\n@c0@"
  ja: "@a@bミミ「最近では　あまり　とれなくなって\n\t普通には　売ってないみたいよ。\n\t誰か　持っている人がいるかしら。\n@c0@"
266:
  de: "@aKati Krams@bEine Schokomünze? Die sehen aus wie Minimedaillen, also gibt's nur einen Ort, wo man danach suchen würde, oder?\n@c0@"
  en: "@aSue Veneer@bA chocolate medalliyum? They look like mini medals,\r\nso there's only one place ye'd go to buy them now, isn't there?\n@c0@"
  es: "@aNuray Niada@b¿Un miedallón de chocolate? Pariecen minimiedallas, así que solo si deben podier comprar en un sitio, ¿no?\n@c0@"
  fr: "@aMarie-Jo Konde@bUne médaille en chocolatⓡ Elles ont exactement la même forme que les mini médailles. Je suppose que vous avez compris où vous pouvez en acheterⓡ\n@c0@"
  it: "@aSue Venir@bLe medaglie di cioccolato hanno tutto l'aspetto delle minimedaglie, no? Quindi, secondo me, c'è solo un posto dove è possibile procurarsene!\n@c0@"
  ja: "@a@bミミ「メダル型チョコねえ。　メダルの\n\t形をしているチョコなら　きっと\n\tあの人のお城で　売ってるんじゃない？\n@c0@"
267:
  de: "@aKati Krams@bEin Wimpel der Wiederkehr?\n@c0@"
  en: "@aSue Veneer@bA Forget-me-Knot flag?\n@c0@"
  es: "@aNuray Niada@b¿Un bandierín de Pasada?\n@c0@"
  fr: "@aMarie-Jo Konde@bUn fanion de mamie Pieⓡ\n@c0@"
  it: "@aSue Venir@bIl gagliardetto di Serena?\n@c0@"
  ja: "@a@bミミ「ネッドのペナントね。\n@c0@"
268:
  de: "@aKati Krams@bGibt es so etwas nicht in diesem berühmten Gasthaus am Fuß der hohen Berge? Also in der Herberge von Frau Berge?\n@c0@"
  en: "@aSue Veneer@bKnot? Isn't that the name o' the famous inn at the foot o' those tall mountains?\n@c0@"
  es: "@aNuray Niada@b¿Pasada? Así si llama esa famosa posada al pie de esas montañas tan altas, ¿vierdad?\n@c0@"
  fr: "@aMarie-Jo Konde@bLa Pieⓡ Ce n'est pas le nom de la célèbre auberge située au pied de ces grandes montagnesⓡ\n@c0@"
  it: "@aSue Venir@bUhm...\nIl nome mi ricorda quella famosa locanda che si trova ai piedi delle montagne.\n@c0@"
  ja: "@a@bミミ「ネッドって　たしか……\n\t高山のふもとの　有名な宿屋の\n\t名前だったと思うわ。\n@c0@"
269:
  de: "@aKati Krams@bEin Bussolinger Kompass? Die waren mal sehr berühmt, wisst Ihr.\n@c0@"
  en: "@aSue Veneer@bA Batten binnacle? They were ever so famous before, ye know.\n@c0@"
  es: "@aNuray Niada@b¿Una bitácora de Habs? Antes eran objetos muy populiares, sí.\n@c0@"
  fr: "@aMarie-Jo Konde@bUne boussole de Técarloⓡ\nElles étaient très célèbres dans le temps.\n@c0@"
  it: "@aSue Venir@bLa bussola delle nevi?\nTempo fa era possibile procurarsi questi oggetti senza troppe difficoltà.\n@c0@"
  ja: "@a@bミミ「チゾットのコンパスね。\n\t昔は　有名な　名産品\n\tだったのよ。\n@c0@"
270:
  de: "@aKati Krams@bAber jetzt ist der Mann, der sie angefertigt hat, nicht mehr da, und darum sind sie ziemlich selten geworden.\n@c0@"
  en: "@aSue Veneer@bBut the fella who used to make them's no longer about, and they're pretty rare now.\n@c0@"
  es: "@aNuray Niada@bPero el tipo que las hacía ya no está, así que ahora son más bien escasas.\n@c0@"
  fr: "@aMarie-Jo Konde@bMais l'artisan qui les fabriquait a disparu et on n'en trouve plus beaucoup.\n@c0@"
  it: "@aSue Venir@bIl tizio che le costruiva, però, è sparito dalla circolazione, e le sue bussole sono diventate pezzi da collezionisti.\n@c0@"
  ja: "@a@bミミ「でも　作る職人さんが　いなくなって\n\tほとんど　残っていないらしいわ。\n@c0@"
271:
  de: "@aKati Krams@bEin Monsterschachspiel? Tut mir leid, darüber weiß ich auch nicht viel.\n@c0@"
  en: "@aSue Veneer@bA monster chess set? I'm sorry, I don't know much about them meself.\n@c0@"
  es: "@aNuray Niada@b¿Un juego de monstriajiedrez? Pierdona, pero de eso no entiendo.\n@c0@"
  fr: "@aMarie-Jo Konde@bUn jeu d'échecs monstrueuxⓡ Désolée, mais je n'y connais pas grand-chose.\n@c0@"
  it: "@aSue Venir@bCome dici? La scacchiera dei mostri?\nMi spiace, ma non ne so nulla.\nNon posso aiutarti.\n@c0@"
  ja: "@a@bミミ「モンスターチェスね。\n\t実は　私も　よく知らないのよ。\n\tごめんなさい。\n@c0@"
272:
  de: "@aKati Krams@bDarüber weiß ich selbst nicht viel. Aber es sieht sehr wertvoll aus, wenn Ihr mich fragt.\n@c0@"
  en: "@aSue Veneer@bI don't know much about that meself.\nBut it looks mighty precious if y'ask me.\n@c0@"
  es: "@aNuray Niada@bNo sé mucho de esto.\r\nPero pariece un objeto bastiante valioso, sí.\n@c0@"
  fr: "@aMarie-Jo Konde@bJe ne sais pas trop ce que c'est, mais ça m'a l'air précieux.\n@c0@"
  it: "@aSue Venir@bNon saprei cosa dirti a proposito di quest'oggetto, se non che mi sembra molto prezioso!\n@c0@"
  ja: "@a@bミミ「それは　私にも　よく\n\t分からないわ。　でも　とっても\n\t大事なもののような気がする……。\n@c0@"
273:
  de: "@aKati Krams@bDas ist eine Art Medaillon, oder? Es ist wirklich sehr schön gemacht.\n@c0@"
  en: "@aSue Veneer@bIt's some kind of locket, is it?\n'Tis ever so beautifully made.\n@c0@"
  es: "@aNuray Niada@bEs como un camafieo, ¿no?\r\nEl trabajo de artiesanía es magnífico.\n@c0@"
  fr: "@aMarie-Jo Konde@bC'est une sorte de pendentif, n'est-ce pasⓡ\nIl est vraiment magnifique.\n@c0@"
  it: "@aSue Venir@bMi sembra un medaglione, no?\nÈ di ottima fattura.\n@c0@"
  ja: "@a@bミミ「思い出のロケットペンダントね。\n\tすばらしい　細工がされた\n\tペンダントよね。\n@c0@"
274:
  de: "@aKati Krams@bAber irgendwie traurig, oder? Ich meine, dass es darin kein Bild oder so was gibt.\n@c0@"
  en: "@aSue Veneer@bBut it's a wee bit sad, isn't it?\nI mean, there's no picture in it or anytin'.\n@c0@"
  es: "@aNuray Niada@bPero es un poquito triste, ¿vierdad?\r\nNi siquiera tiene una imagien dentro.\n@c0@"
  fr: "@aMarie-Jo Konde@bMais je le trouve un peu triste, pas vousⓡ\nRegardez, il n'y a pas de portrait à l'intérieur.\n@c0@"
  it: "@aSue Venir@bÈ un po' spoglio, però.\nAll'interno non c'è nemmeno un'immagine!\n@c0@"
  ja: "@a@bミミ「でも　なんだか　さみしそう。\n\tだって　中は　空っぽ\n\tなんですものね……。\n@c0@"
275:
  de: "@aKati Krams@bEin Tintenhorn? Mit denen kenne ich mich auch nicht sehr gut aus.\n@c0@"
  en: "@aSue Veneer@bA tusk-tusk tusk inkwell?\nI'm not so familiar with them meself.\n@c0@"
  es: "@aNuray Niada@b¿Un tintiero de tantor?\r\nNo los conozco diemasiado, la vierdad.\n@c0@"
  fr: "@aMarie-Jo Konde@bUn encrier d'ivoireⓡ Je ne suis pas très calée en la matière.\n@c0@"
  it: "@aSue Venir@bA essere sincera, non ho molte informazioni sui magicalamai.\n@c0@"
  ja: "@a@bミミ「パオームのインクね。\n\t私も　くわしくは　知らないけど……\n@c0@"
276:
  de: "@aKati Krams@bIch habe gehört, dass sie aus den Hörnern von Elefantasten gemacht werden, die im Norden leben. Mehr weiß ich auch nicht.\n@c0@"
  en: "@aSue Veneer@bI hear folk use the tusks of the tusk-tusk monster that lives in the north to make inkwells.\r\nThat's all I know about it.\n@c0@"
  es: "@aNuray Niada@bDicen que la giente usa los colmillos del tantor que vive en el norte para hacer tintieros.\r\nNo sé nada más.\n@c0@"
  fr: "@aMarie-Jo Konde@bSi j'ai bien compris, on utilise l'ivoire du stigmammouth qui vit dans le nord pour fabriquer des encriers. C'est tout ce que je sais.\n@c0@"
  it: "@aSue Venir@bSo solo che per realizzarli vengono usate le zanne di Chiostrofante.\nNon posso dirti di più.\n@c0@"
  ja: "@a@bミミ「ずっと　北の地で　パオームの\n\tキバが　インクつぼに使われる話は\n\t聞いたことが　あるわ。\n@c0@"
277:
  de: "@aKati Krams@bⓞHimmlische Hymnenⓟ? Das dürften wohl Gebete, Lieder und Gedichte und dergleichen sein, nicht?\n@c0@"
  en: "@aSue Veneer@bⓗLofty Liltsⓘ? I expect it's a collection of prayer songs and poems and the like, isn't it?\n@c0@"
  es: "@aNuray Niada@b¿ⓕSalmos Excielsosⓖ? Debe de ser una colección de cantos y poemas para riezar, ¿no?\n@c0@"
  fr: "@aMarie-Jo Konde@bLes ⓥPsaumes alticimiensⓦⓡ Je suppose que c'est un recueil de prières et de chants religieux.\n@c0@"
  it: "@aSue Venir@bSe le informazioni in mio possesso sono corrette, i ⓕSalmi del Sollievoⓖ sono una raccolta di canti e poemi sacri.\n@c0@"
  ja: "@a@bミミ「天の詩篇集ね。\n\tたぶん　祈りの言葉を集めた\n\t詩集のようなものでしょうね。\n@c0@"
278:
  de: "@aKati Krams@bDas ist sicher eine mächtig fromme Gegend, in der so etwas erschaffen wird.\n@c0@"
  en: "@aSue Veneer@bIt must be an almighty holy place where they put sometin' like that together.\n@c0@"
  es: "@aNuray Niada@bEl sitio donde elaboran este objieto diebe de ser muy sagrado y tiodo eso.\n@c0@"
  fr: "@aMarie-Jo Konde@bUn livre comme ça doit sans doute se trouver dans un endroit sacré où sont rassemblés des objets de ce genre.\n@c0@"
  it: "@aSue Venir@bIntuisco che chi li ha composti vive in un luogo santo, toccato dalla grazia della dea...\n@c0@"
  ja: "@a@bミミ「きっと　天にもとどきそうな場所で\n\t書かれた詩篇集に　ちがいないわよ。\n@c0@"
279:
  de: "@aKati Krams@bEin Steinach-Saphir? Das ist eines meiner Lieblingsstücke.\n@c0@"
  en: "@aSue Veneer@bA Whealbrook sapphire? 'Tis one of me favourite knick-knacks.\n@c0@"
  es: "@aNuray Niada@b¿Un zafiro de Arroyofrío? Es una de mis cosinas prieferidas.\n@c0@"
  fr: "@aMarie-Jo Konde@bUn saphir de Ruycelieuⓡ\nC'est l'un de mes objets préférés.\n@c0@"
  it: "@aSue Venir@bLo zaffiro di Valcava è uno dei miei souvenir preferiti!\n@c0@"
  ja: "@a@bミミ「聖なる宝石ね。\n\tそのかがやきは　誰の心でも\n\tときめかせるんですって。\n@c0@"
280:
  de: "@aKati Krams@bIch glaube, Ihr müsst erst den unbearbeiteten Stein finden und ihn einem Kunsthandwerker geben, der ihn dann schneidet und poliert und alles.\n@c0@"
  en: "@aSue Veneer@bI think ye have to find the rough stone first, an' then give it to a craftsman who can cut it and polish it an' all that stuff.\n@c0@"
  es: "@aNuray Niada@bCreo que primiero hay que encontrar la piedra en bruto y luego llievarla a un artiesano para que la talle y la pula y todo eso.\n@c0@"
  fr: "@aMarie-Jo Konde@bVous devez tout d'abord trouver la gemme, puis la confier à un artisan qui la taillera et la polira.\n@c0@"
  it: "@aSue Venir@bCredo che la prima cosa da fare per ottenerlo sia trovare una pietra grezza, e poi darla a un valente artigiano che sappia come pulirla e tagliarla.\n@c0@"
  ja: "@a@bミミ「まずは　宝石の原石をさがして……\n\tそれから　ウデのいい職人さんに\n\tみがきあげてもらうことね。\n@c0@"
281:
  de: "@aKati Krams@bDie Krone von Krypto? Nach allem, was ich gehört habe, sind die Geisterzinnen ein trauriger Ort. Dort sollen sich Monster eingenistet haben.\n@c0@"
  en: "@aSue Veneer@bThe Crown of Uptaten? Uptaten's a sad place\r\nfrom what I hear. 'Twas overrun by monsters,\r\nso they say.\n@c0@"
  es: "@aNuray Niada@b¿La corona del conde Alvierres? Según cuentan, Alvierres es un lugar muy triste. Pariece que los monstruos lo invadieron todo.\n@c0@"
  fr: "@aMarie-Jo Konde@bLa couronne des Karpattⓡ De ce que j'ai entendu, la région des Karpatt n'est pas un coin très gai.\nIl paraît qu'elle a été envahie par des monstres.\n@c0@"
  it: "@aSue Venir@bLa Corona delle Ombre? Per quanto ne so io, la Regione delle Ombre è un luogo maledetto.\nCredo che in passato fosse controllato dai mostri.\n@c0@"
  ja: "@a@bミミ「レヌールの王冠ね。\n\tレヌール城といえば　魔物におそわれて\n\tかわいそうなお城　だったみたいね。\n@c0@"
282:
  de: "@aKati Krams@bEs wäre eine nette Geste gegenüber dem Grafen und der Gräfin Krypto, die Krone hier im Museum auszustellen.\n@c0@"
  en: "@aSue Veneer@bIt'd be a nice gesture to the Count and Countess to have the crown on display here in the museum.\n@c0@"
  es: "@aNuray Niada@bSiería un bonito homienaje para el Conde y la Condiesa mostrar la corona aquí en el museo, sí.\n@c0@"
  fr: "@aMarie-Jo Konde@bCe serait un bel hommage au comte et à la comtesse d'exposer leur couronne dans le musée.\n@c0@"
  it: "@aSue Venir@bSarebbe bello se potessimo esporre la Corona al Museo del Souvenir...\n@c0@"
  ja: "@a@bミミ「王さまと　王妃には　せめて\n\t生前の　思い出の品でも\n\tおそなえ　してあげたいわよね。\n@c0@"
283:
  de: "@aKati Krams@bEine Feenfeder? Man könnte vermuten, dass ein Gelehrter in einem Feenschloss oder dergleichen so etwas benutzt.\n@c0@"
  en: "@aSue Veneer@bA faerie quill? Ye can imagine a scholar usin' sometin' like this in a faerie palace or some such place.\n@c0@"
  es: "@aNuray Niada@b¿Una pluma de hada? Mi imagino a un sabio escribiendo con eso en un palacio de hadas o algún sitio así, sí.\n@c0@"
  fr: "@aMarie-Jo Konde@bUne plume féeriqueⓡ J'imagine bien un savant utiliser ce type d'objet dans un palais de fées ou un endroit dans ce genre.\n@c0@"
  it: "@aSue Venir@bLa penna fatata? A giudicare dal nome, mi aspetterei che un oggetto simile sia usato da uno studioso che vive in un palazzo incantato...\n@c0@"
  ja: "@a@bミミ「妖精の羽ペンね。\n\t妖精のお城でも　あれば　学者さんが\n\t使っていそうよね。\n@c0@"
284:
  de: "@aKati Krams@bEin Yggdrasil-Schössling? Also, das ist ein Exponat, das ich selbst gern hätte. Das heißt, wenn es so etwas wirklich gibt.\n@c0@"
  en: "@aSue Veneer@bAn Yggdrasil sapling? That's one knick-knack I'd like fer meself. If they really exist, that is.\n@c0@"
  es: "@aNuray Niada@b¿Un rietoño de Yggdrasil? Esa cosina sí que mi gustaría tienerla. Si es que existie, claro.\n@c0@"
  fr: "@aMarie-Jo Konde@bUne pousse d'Yggdrasilⓡ C'est une pièce que j'adorerais avoir moi-même... si tant est qu'elle existe vraiment.\n@c0@"
  it: "@aSue Venir@bIl virgulto di Ygdrasil?\nNe ho sentito parlare, ma non ne ho mai visto uno...\n@c0@"
  ja: "@a@bミミ「世界樹の苗木ねえ。\n\tそんなものが　あったら\n\t私も　ほしいけど……\n@c0@"
285:
  de: "@aKati Krams@bSo was hat nicht jeder.\n@c0@"
  en: "@aSue Veneer@bIt's not the sort o' thing ye'll find many folk with.\n@c0@"
  es: "@aNuray Niada@bNo es un objieto que tienga mucha giente.\n@c0@"
  fr: "@aMarie-Jo Konde@bVous ne risquez pas de trouver beaucoup de monde qui en possède.\n@c0@"
  it: "@aSue Venir@bAnzi, non so nemmeno se esistano davvero...\n@c0@"
  ja: "@a@bミミ「普通の人が　持ってるはず\n\tないわよね。\n@c0@"
286:
  de: "@aKati Krams@bEin Yggdrasil-Schössling? So einen habt Ihr doch schon, oder?\n@c0@"
  en: "@aSue Veneer@bAn Yggdrasil sapling? Y'already have yerself one o' these, don't ye?\n@c0@"
  es: "@aNuray Niada@b¿Un rietoño de Yggdrasil? Pero ¿no tienes ya uno de esos?\n@c0@"
  fr: "@aMarie-Jo Konde@bUne pousse d'Yggdrasilⓡ Vous en avez déjà une, je me trompeⓡ\n@c0@"
  it: "@aSue Venir@bSe non sbaglio, hai già un virgulto di Ygdrasil...\n@c0@"
  ja: "@a@bミミ「世界樹の苗木？\n\tあなたは　もう\n\t手に入れているわよね。\n@c0@"
287:
  de: "@aKati Krams@bAber ich weiß nicht... Solltet Ihr ihn nicht pflegen und sein Wachstum anregen und so?\n@c0@"
  en: "@aSue Veneer@bBut I don't know... Shouldn't ye be nurturin' it and helpin' it to grown an' that?\n@c0@"
  es: "@aNuray Niada@bNo sé... ¿No dieberías plantarlo y cuidarlo para que criezca sano y fuerte?\n@c0@"
  fr: "@aMarie-Jo Konde@bCe n'est peut-être pas mes affaires, mais... vous ne devriez pas vous en occuper pour qu'elle grandisseⓡ\n@c0@"
  it: "@aSue Venir@bCredo che dovresti curarlo e averne cura, altrimenti non crescerà mai.\n@c0@"
  ja: "@a@bミミ「でも　なにかもっと……\n\tこのままにしておいて　いいのか\n\t気になるわね。　育てるとか？\n@c0@"
288:
  de: "@aKati Krams@bDas Prekaria-Pergament? Das habe ich selbst noch nie gesehen, darum kann ich Euch eigentlich nicht viel darüber erzählen.\n@c0@"
  en: "@aSue Veneer@bThe Annalum Retentium? I've never seen it meself,\r\nso I can't tell ye much about it really.\n@c0@"
  es: "@aNuray Niada@b¿El ⓕAnnalum Retentiumⓖ? Nunca lo he visto, así que no ti puedo contar nada sobre él.\n@c0@"
  fr: "@aMarie-Jo Konde@bLes Annales de Précariaⓡ Je ne les ai jamais lues, alors je ne peux pas vous en dire grand-chose.\n@c0@"
  it: "@aSue Venir@bNon ho mai avuto modo di vedere gli Annali della Mostruosità, quindi non ho molte informazioni su di loro.\n@c0@"
  ja: "@a@bミミ「禁断の巻物ね。\n\t私も　見たこともないから\n\tよく分からないわ。\n@c0@"
289:
  de: "@aKati Krams@bIch glaube, es ist eine Art Warnung oder so. Nicht die Art Souvenir, die man in einer normalen Stadt auftreiben kann, wenn Ihr mich fragt.\n@c0@"
  en: "@aSue Veneer@bI think it was written as a kind o' warnin' or sometin'. 'Tisn't the kind o' souvenir ye'd expect to pick up in a normal town, if y'ask me.\n@c0@"
  es: "@aNuray Niada@bMi pariece que es una especie de adviertencia o algo así. No es la clase de souvenir que si puede encontrar en una ciudad normal, creo yo.\n@c0@"
  fr: "@aMarie-Jo Konde@bElles auraient été écrites pour nous prévenir de quelque chose. Ce n'est pas le genre de souvenir que vous trouverez dans une ville normale, à mon avis.\n@c0@"
  it: "@aSue Venir@bCredo che siano una specie di guida, un elenco di avvertenze e consigli. Secondo me proviene da un villaggio molto particolare...\n@c0@"
  ja: "@a@bミミ「なにかを　いましめるために\n\t書いたものでしょうから　普通の町の\n\t名産では　ないわよね。　きっと。\n@c0@"
290:
  de: "@aKati Krams@bEs tut mir leid, darüber weiß ich überhaupt nichts. Es ist anders als alles andere, was Ihr in dieser Welt findet, glaube ich.\n@c0@"
  en: "@aSue Veneer@bI'm sorry. I don't know the first thing about that. 'Tisn't like anytin' ye'd find in this world, if y'ask me.\n@c0@"
  es: "@aNuray Niada@bLo siento. No tiengo ni idea de qué es eso. No pariece algo de este mundo, eso sieguro.\n@c0@"
  fr: "@aMarie-Jo Konde@bJe suis désolée, mais je n'ai aucune idée de ce que ça peut être. Selon moi, ce n'est pas quelque chose qu'on peut trouver dans notre monde.\n@c0@"
  it: "@aSue Venir@bMi spiace, ma non ne so assolutamente nulla.\nNon credo che sia un souvenir che è possibile trovare in questo mondo.\n@c0@"
  ja: "@a@bミミ「ごめんなさいね。\n\tそれは　私にも　よく分からないの。\n\tきっと　この世のものじゃ　ないわよ。\n@c0@"
291:
  de: "@aKati Krams@bÜber dieses Stück kann ich Euch nicht viel sagen, außer dass Ihr vermutlich sehr froh wäret, wenn Ihr so etwas besäßet.\n@c0@"
  en: "@aSue Veneer@bI can't tell ye much about that knick-knack,\nother than that ye'd probably be mighty happy\r\nif y'owned it.\n@c0@"
