  ja: "@a@bビアンカ「あら　%a000090。\n\tごめんね　起こしちゃった？\n@c0@"
437:
  de: "@aBianca@bEs ist nur ⓚⓛ ich habe in letzter Zeit viel über die Vergangenheit nachgedacht.\n@c0@"
  en: "@aBianca@bIt's just, I've bin thinkin' a lot\r\nabout things in the past.\n@c0@"
  es: "@aBianca@bEs que estaba pensando en el pasado, ¿sabes?\n@c0@"
  fr: "@aBianca@bC'est juste que j'ai beaucoup réfléchi sur tout ce qui s'est passé autrefois.\n@c0@"
  it: "@aBianca@bStavo pensando al passato...\n@c0@"
  ja: "@a@bビアンカ「ちょっとね\n\tいろいろ　昔のことを\n\t思い出しちゃって……。\n@c0@"
438:
  de: "@aBianca@bNicht, dass ich traurig wäre oder so. Das ist jetzt alles vorbei und vorüber, das weiß ich.\n@c0@"
  en: "@aBianca@bIt's not that I'm feelin' sad or nothin'. That's all done and dusted now, I know that.\n@c0@"
  es: "@aBianca@bNo, triste no estoy ni nada. Ya sé que son cosas que pasan.\n@c0@"
  fr: "@aBianca@bJe ne suis pas triste ni mélancolique.\r\nC'est du passé, je le sais.\n@c0@"
  it: "@aBianca@bNon che io mi senta triste o che abbia dei rimpianti, anzi...\nInsomma, il passato è passato.\n@c0@"
  ja: "@a@bビアンカ「ううん　別に\n\t悲しいわけじゃないのよ。\n\t昔は昔　今は今だもの。\n@c0@"
439:
  de: "@aBianca@bÄhm, kann ich zu dir rüberkommen, %a000090?\n@c0@"
  en: "@aBianca@bUm, can I come over to you, %a000090?\n@c0@"
  es: "@aBianca@bEsto, ¿puedo acercarme a ti, %a000090?\n@c0@"
  fr: "@aBianca@bMmm, est-ce que je peux venir auprès de toi, %a000090ⓡ\n@c0@"
  it: "@aBianca@b%0%a000090, posso avvicinarmi?\n@c0@"
  ja: "@a@bビアンカ「ねえ　%a000090……。\n\tそっちに　行ってもいい？\n@c0@"
440:
  de: "@aBianca@bIch möchte, dass du eins weißt...\nIch liebe dich.\n@c0@"
  en: "@aBianca@bI want you to know...\nI love you.\n@c0@"
  es: "@aBianca@bQuiero que sepas que...\r\nTe quiero.\n@c0@"
  fr: "@aBianca@bJe voulais simplement te dire que... je t'aime.\n@c0@"
  it: "@aBianca@bIo voglio che tu sappia che...\nTi amo, %a000090.\n@c0@"
  ja: "@a@bビアンカ「愛してるわ　%a000090。\n@c0@"
441:
  de: "@aBianca@bSei doch nicht so! Ich komme trotzdem rüber.\n@c0@"
  en: "@aBianca@bDon't be mean! I'm comin' anyway.\n@c0@"
  es: "@aBianca@b¡No seas malo! Voy a ir de todas formas.\n@c0@"
  fr: "@aBianca@bPas la peine d'être méchantⓠ Je viens de toute façon.\n@c0@"
  it: "@aBianca@bOh, ma quanto sei antipatico!\nBeh, io mi avvicino lo stesso!\n@c0@"
  ja: "@a@bビアンカ「いじわる。\n\tでも　行っちゃおうっと。\n@c0@"
442:
  de: "@a@b*: Es scheint, als sei in Tifortu alles wieder in bester Ordnung.\n@c0@"
  en: "@a@b*: Sounds like all's well over in Coburg again.\n@c0@"
  es: "@a@b*: Parece que en Trastámara todo vuelve a ir como la seda.\n@c0@"
  fr: "@a@b*ⓢ On dirait que tout va beaucoup mieux à Cobourg.\n@c0@"
  it: "@a@b*: Pare che a Coburg la situazione sia tornata calma.\n@c0@"
  ja: "@a@b＊「ラインハットのお城が\n\tまた　平和になったらしいな。\n@c0@"
443:
  de: "@a@b*: Jetzt kann ich dort in aller Ruhe wieder Geschäfte machen. Allerdings ist der Weg dorthin nicht ganz ungefährlich.\n@c0@"
  en: "@a@b*: Now I can start up my tradin' there again with no worries. Mind you, the trip between here and there could be a bit hairy.\n@c0@"
  es: "@a@b*: Ahora puedo volver a mi negocio allí sin problemas. Claro que el viaje puede ser complicado.\n@c0@"
  fr: "@a@b*ⓢ Je peux désormais y retourner faire des affaires sans avoir peur. Le problème, c'est que le voyage est loin d'être évident jusque là-bas.\n@c0@"
  it: "@a@b*: Ora potrò ricominciare a fare affari da quelle parti. Confesso, però, che l'idea di fare avanti e indietro non mi riempie di gioia...\n@c0@"
  ja: "@a@b＊「これで　安心して\n\t商売に行けるよ。　……といっても\n\t途中の旅が　大変なんだけどね。\n@c0@"
444:
  de: "@a@b*: Ich bin ein alter Freund von Weißi, der den Laden früher geführt hat. Ich wollte ihm schon länger mal einen Besuch abstatten, deshalb bin ich hier.\n@c0@"
  en: "@a@b*: I'm an old friend of Whitey who used to run this place. I came by to pay him a long overdue visit.\n@c0@"
  es: "@a@b*: Soy un viejo amigo de Doptada, el que llevaba este sitio. He venido a hacerle una visita, que ya hace tiempo que se la debía.\n@c0@"
  fr: "@a@b*ⓢ Je suis un vieil ami d'Al, l'ancien propriétaire de l'auberge. Ça faisait des années que je me disais qu'il fallait que je revienne le voir.\n@c0@"
  it: "@a@b*: Sono un vecchio amico del signor Whitblanche, il precedente gestore della locanda.\n㈡\n*: Era da parecchio che non avevo notizie di lui, così ero passato a fargli una visita.\n@c0@"
  ja: "@a@b＊「わしは　昔ここの宿をやってた\n\tダンカンさんの知り合いでの。\n\t久しぶりに会いに来たのじゃ。\n@c0@"
445:
  de: "@a@b*: Aber er hat die Bude wohl aus gesundheitlichen Gründen verkauft und ist in ein Bergdorf hinter dem Meer gezogen, weit weg von hier.\n@c0@"
  en: "@a@b*: But I'm told he had problems with his health so he sold up and moved to a village in the mountains far across the sea from here.\n@c0@"
  es: "@a@b*: Pero me han dicho que tenía problemas de salud, así que vendió la posada y se fue a una aldea en las montañas, al otro lado del mar.\n@c0@"
  fr: "@a@b*ⓢ Mais on m'a dit qu'il avait eu des problèmes de santé et qu'il avait vendu pour s'installer par-delà les océans, dans un village de montagne.\n@c0@"
  it: "@a@b*: Però ho saputo che ha avuto problemi di salute.\n㈡\n*: Pare che abbia ceduto la sua attività e che si sia trasferito in un villaggio tra i monti, dall'altro lato dell'oceano.\n@c0@"
  ja: "@a@b＊「けど　ダンカンさんは身体を悪くして\n\t宿屋をやめ　はるか海の向こうの\n\t山奥の村に引っこして行ったらしい。\n@c0@"
446:
  de: "@a@b*: Ich hatte eigentlich gehofft, ich könnte seine Tochter wiedersehen. Ach, schade!\n@c0@"
  en: "@a@b*: I was hoping to see that daughter of his again. What a shame!\n@c0@"
  es: "@a@b*: Esperaba poder ver a su hija. ¡Es una lástima!\n@c0@"
  fr: "@a@b*ⓢ J'espérais aussi revoir sa fille.\nC'est vraiment dommageⓠ\n@c0@"
  it: "@a@b*: Mi dispiace non averlo potuto incontrare.\nMi avrebbe anche fatto piacere rivedere sua figlia!\n@c0@"
  ja: "@a@b＊「あの　かわいい娘さんにも\n\t会いたかったのう。\n\tざんねんじゃわい……。\n@c0@"
447:
  de: "@aBianca@bHallo! Ich bin's! Bianca!\n@c0@"
  en: "@aBianca@bHey! It's me! Bianca!\n@c0@"
  es: "@aBianca@b¡Eh! ¡Soy yo! ¡Bianca!\n@c0@"
  fr: "@aBianca@bMais c'est moiⓠ Biancaⓠ\n@c0@"
  it: "@aBianca@bEhi! Sono io, Bianca!\n@c0@"
  ja: "@a@bビアンカ「おじいさん！\n\t私よ　ビアンカよ。\n@c0@"
448:
  de: "@a@b*: Na so was! Unsere kleine Bianca! Was für eine Überraschung! Bist du aber groß geworden, Kind!\n@c0@"
  en: "@a@b*: Beggar me! So it is! What a surprise!\nHaven't you grown, dear?\n@c0@"
  es: "@a@b*: ¡Pero qué narices! ¡Es verdad! ¡Qué sorpresa!\r\n¡Pero cuánto has crecido, guapa!\n@c0@"
  fr: "@a@b*ⓢ Par la Déesseⓠ Mais oui, c'est toiⓠ\nPour une surpriseⓠ Comme tu as grandiⓠ\n@c0@"
  it: "@a@b*: Oh, santi numi! Sei proprio tu!\nScusami, ma non ti avevo riconosciuta!\nAccidenti, quanto sei cresciuta! Vedo che stai bene...\n@c0@"
  ja: "@a@b＊「なんと！　ビアンカちゃんかね？\n\tこりゃ　おどろいた！\n\t大きくなったのう。\n@c0@"
449:
  de: "@aBianca@bPapa geht's auch gut. Es geht ihm schon viel besser, seit er in eine friedlichere Gegend gezogen ist.\n@c0@"
  en: "@aBianca@bDad's doin' just fine too. He's much better now since movin' to somewhere more peaceful.\n@c0@"
  es: "@aBianca@bA papá también le va muy bien. Está mucho mejor desde que se fue a vivir a un sitio más tranquilo.\n@c0@"
  fr: "@aBianca@bPapa est en pleine forme. Il va beaucoup mieux depuis qu'il a déménagé dans un endroit plus tranquille.\n@c0@"
  it: "@aBianca@bNon mi lamento...\nPer fortuna, nemmeno mio padre se la passa male.\nSi sente molto meglio, da quando ci siamo trasferiti.\n@c0@"
  ja: "@a@bビアンカ「父さんも　元気よ。\n\t引っ越したおかげで　病気も\n\tだんだん　よくなってるわ。\n@c0@"
450:
  de: "@a@b*: Tja, es freut mich, das zu hören. Dieser Ort hat ihm viel bedeutet, nicht?\n@c0@"
  en: "@a@b*: Well, that's good to hear. This place meant a lot to him, didn't it?\n@c0@"
  es: "@a@b*: Me alegro de oírlo. Estaba muy apegado a este sitio, ¿verdad?\n@c0@"
  fr: "@a@b*ⓢ Je suis content de l'apprendre. Il tenait beaucoup à cet endroit, heinⓡ\n@c0@"
  it: "@a@b*: Ah, mi fa piacere sentirlo!\nQuesta sì che è una buona notizia! Sai, lui è sempre stato molto affezionato a questi luoghi...\n@c0@"
  ja: "@a@b＊「そうかい　そうかい。\n\tいや　なにしろ　ここの宿屋は\n\tダンカンさんの宝じゃったから。\n@c0@"
451:
  de: "@a@b*: Da hatte ich mir schon Sorgen gemacht, dass es zu hart für ihn sein würde, von hier wegzugehen.\n@c0@"
  en: "@a@b*: I was a bit worried that it might be too hard on him, havin' to give it up like that.\n@c0@"
  es: "@a@b*: Me preocupaba que eso de tener que abandonarlo todo le afectase mucho.\n@c0@"
  fr: "@a@b*ⓢ J'avais un peu peur que ce ne soit trop dur pour lui d'avoir dû le quitter.\n@c0@"
  it: "@a@b*: Temevo che non sarebbe riuscito ad adattarsi a vivere altrove, ma pare che io sia stato troppo pessimista.\n@c0@"
  ja: "@a@b＊「それを　手ばなすとは\n\tよっぽどのことと\n\t心配しとったんじゃよ。\n@c0@"
452:
  de: "@a@b*: Aber ich bin erleichtert, dich zu sehen und zu hören, dass alles in Ordnung ist. Grüß ihn schön von mir, wenn du ihn wiedersiehst, ja?\n@c0@"
  en: "@a@b*: But it's bin a relief seein' you and hearin' that all's well. Send him my regards next time you see him, eh?\n@c0@"
  es: "@a@b*: Pero oye, qué alegría oír que todo le va genial. Dale recuerdos de mi parte cuando lo veas, ¿eh, guapa?\n@c0@"
  fr: "@a@b*ⓢ Mais je suis soulagé de t'avoir vue et d'avoir eu de ses nouvelles. Tu lui passeras le bonjour la prochaine fois que tu le verras, d'accordⓡ\n@c0@"
  it: "@a@b*: Mi ha fatto piacere rivederti e sapere che le cose vi vanno bene. Ricordati di portare i miei saluti a tuo padre quando lo rivedrai, d'accordo?\n@c0@"
  ja: "@a@b＊「でも　ビアンカちゃんに会えて\n\t本当に　よかったわい。\n\tダンカンさんにも　よろしくな。\n@c0@"
