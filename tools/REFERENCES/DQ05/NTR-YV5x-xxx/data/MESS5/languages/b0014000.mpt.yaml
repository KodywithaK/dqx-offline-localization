  es: "@a@b*: ¡Oh, esto es lo mejor de lo mejor! El telelicor es legendario, ¿%H0860%Xsabes%Ysabéis%Z?\n@c0@"
  fr: "@a@b*ⓢ Oh, c'est le summumⓠ Le télétord-boyaux est une boisson légendaire, vous savez.\n@c0@"
  it: "@a@b*: Oh, questo sì che è un souvenir prezioso!\nLo Delizia di Milleventi è una bevanda deliziosa e rarissima.\n@c0@"
  ja: "@a@b＊「う～ん　あれはいい！\n\tルラフェンの地酒は\n\t伝説とまで　いわれている品物！\n@c0@"
160:
  de: "@a@b*: Er ist so köstlich, dass mir schon beim bloßen Anblick das Wasser im Mund zusammenläuft.\n@c0@"
  en: "@a@b*: It tastes so good, just looking at it gets your mouth watering.\n@c0@"
  es: "@a@b*: Su sabor es tan exquisito que con solo mirarlo se te hace la boca agua.\n@c0@"
