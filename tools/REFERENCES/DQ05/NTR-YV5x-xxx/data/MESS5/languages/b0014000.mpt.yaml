  ja: "@a@b%a000090は　記念オルゴールを\nうけとった！\n@c0@"
394:
  de: "@a@b%0%a000180 steckt die Spieldose ein!\n@c0@"
  en: "@a@b%0%a000180 acquires the marital organ!\n@c0@"
  es: "@a@b%0%a000180 obtiene la caja de música nupcial.\n@c0@"
  fr: "@a@b%0%a000180 récupère la boîte à musiqueⓠ\n@c0@"
  it: "@a@b%0%a000180 prende il carillon nuziale!\n@c0@"
  ja: "@a@b%a000180は　記念オルゴールを\n手に入れた！\n@c0@"
395:
  de: "@aHarry@bEigentlich wollten wir in den Deckel einen Edelstein einsetzen lassen, aber wir haben niemanden gefunden, der das konnte.\n@c0@"
  en: "@aHarry@bWe actually intended to have a jewel set in the lid, but we couldn't find anyone able to do it.\n@c0@"
  es: "@aFroilán@bQueríamos incrustar una joya en la tapa, pero no encontramos a nadie capaz de hacerlo.\n@c0@"
  fr: "@aHarry@bNous voulions faire incruster une pierre dans le couvercle, mais nous n'avons trouvé personne capable de le faire.\n@c0@"
  it: "@aRobert@bAvremmo voluto far incastonare un gioiello nel coperchio del carillon, ma non siamo riusciti a trovare un artigiano tanto abile da riuscirci.\n@c0@"
  ja: "@a@bヘンリー「実は　フタのところに\n\t宝石を埋め込むはず　だったんだけど\n\t職人が　見つからなくて……。\n@c0@"
396:
  de: "@aHarry@bJedenfalls ist es großartig, dich zu sehen. Nach der weiten Reise solltest du dich ausruhen und eine Weile hierbleiben.\n@c0@"
  en: "@aHarry@bAnyway, it's great to see you. You should relax and stay a while now you've come all this way.\n@c0@"
  es: "@aFroilán@b¡Pero me alegro de verte! Relájate y quédate un tiempo, ya que has venido hasta aquí.\n@c0@"
  fr: "@aHarry@bEn tout cas, ça fait vraiment du bien de te voir. Après un tel périple, tu devrais rester ici et te détendre un peu.\n@c0@"
  it: "@aRobert@bComunque, sono felicissimo di averti rivisto.\nPuoi restare al Castello tutto il tempo che vuoi, per prepararti per i tuoi prossimi viaggi.\n@c0@"
  ja: "@a@bヘンリー「ともかく　せっかく来たんだから\n\tゆっくり　していってくれよなっ。\n@c0@"
397:
  de: "@aHarry@bTja, die Liebe deines Lebens hast du nun gefunden. Dann kannst du dich ja jetzt auf die Suche nach dem legendären Helden machen.\n@c0@"
  en: "@aHarry@bSo now you have your partner in life, and it's finally time for you to set about finding the legendary hero.\n@c0@"
  es: "@aFroilán@bAhora que has encontrado compañía, ya es hora de que te pongas en marcha para encontrar al héroe legendario.\n@c0@"
  fr: "@aHarry@bMaintenant que tu as quelqu'un à tes côtés, il est temps que tu te mettes à la recherche du héros légendaire.\n@c0@"
  it: "@aRobert@bOra che hai trovato la donna della tua vita, puoi concentrarti sulla ricerca dell'Eroe Leggendario.\n@c0@"
  ja: "@a@bヘンリー「これで　人生の\n\tパートナーも　できたことだし\n\tいよいよ　勇者を探す旅か……。\n@c0@"
398:
  de: "@aHarry@bIch wünschte, ich könnte mit dir gehen, aber ich kann ja Maria nicht im Stich lassen.\n@c0@"
  en: "@aHarry@bI wish I could go with you, but I have Maria\r\nto think about.\n@c0@"
  es: "@aFroilán@bMe gustaría poder acompañarte, pero debo pensar en María.\n@c0@"
  fr: "@aHarry@bJe serais bien venu avec toi, mais il y a Maria, maintenant.\n@c0@"
  it: "@aRobert@bVorrei tanto venire con te, ma non posso abbandonare la mia amatissima moglie.\n@c0@"
  ja: "@a@bヘンリー「オレも　一緒に\n\t行きたいところだけど\n\tマリアがいるしな。\n@c0@"
399:
  de: "@aHarry@bAber du schaust hoffentlich von Zeit zu Zeit vorbei und erzählst uns, was es Neues gibt, ja? Hier im Schloss geschieht nicht viel Aufregendes.\n@c0@"
  en: "@aHarry@bStill, hopefully you'll drop in from time to time and keep us posted, eh? It can get a bit boring being stuck here in the castle all the while.\n@c0@"
  es: "@aFroilán@bPero espero que nos visites de vez en cuando y nos mantengas al corriente de tus aventuras, ¿eh?\n㈡\nEstar siempre aquí encerrado en el castillo puede ser aburrido.\n@c0@"
  fr: "@aHarry@bJ'espère quand même que tu passeras de temps en temps pour nous tenir au courant. C'est parfois un peu ennuyeux de rester tout le temps au château.\n@c0@"
  it: "@aRobert@bPerò promettimi che passerai a trovarmi, ogni tanto!\nSai com'è, a star sempre qui al Castello ci si annoia, e vedere una faccia amica fa sempre piacere.\n@c0@"
  ja: "@a@bヘンリー「まあ　たまには\n\t遊びに来てくれよ。\n\tお城の暮らしは　退屈でさっ。\n@c0@"
400:
  de: "@aMaria@bEs ist so schön, dich wiederzusehen, %a000090.\n@c0@"
  en: "@aMaria@bIt's lovely to see you again, %a000090.\n@c0@"
  es: "@aMaría@bMe alegro de verte de nuevo, %a000090.\n@c0@"
  fr: "@aMaria@bJe suis heureuse de te revoir, %a000090.\n@c0@"
  it: "@aMaria@bCiao, %a000090!\nChe bello rivederti!\n@c0@"
  ja: "@a@bマリア「%a000090さま\n\tお久しぶりで　ございます。\n@c0@"
401:
  de: "@aMaria@bHarry redet in letzter Zeit immerzu davon, was ihr auf euren gemeinsamen Reisen erlebt habt.\n@c0@"
  en: "@aMaria@bAll Harry ever talks about just lately is the time he spent travelling with you.\n@c0@"
  es: "@aMaría@bÚltimamente Froilán no habla más que del tiempo que pasó viajando contigo.\n@c0@"
  fr: "@aMaria@bCes derniers temps, Harry n'arrête pas de me parler de tout ce qui vous est arrivé pendant vos pérégrinations.\n@c0@"
  it: "@aMaria@bUltimamente Robert non fa altro che raccontarmi delle avventure che avete vissuto insieme.\n@c0@"
  ja: "@a@bマリア「最近は　主人ったら\n\tあなたと旅をしたときの\n\tお話ばかり　するんですのよ。\n@c0@"
402:
  de: "@aMaria@bIch höre mir seine Geschichten ja ganz gern an, aber es ist doch lustig zu sehen, wie sehr Männer ihre Abenteuer lieben.\n@c0@"
  en: "@aMaria@bI don't mind hearing his tales, but it's funny to see how men love their adventures so much.\n@c0@"
  es: "@aMaría@bNo me importa escucharle, pero es curioso cuánto le gusta a los hombres contar sus batallitas.\n@c0@"
  fr: "@aMaria@bÇa ne me dérange pas d'écouter ses histoires, mais je trouve ça drôle que les hommes aiment tant revenir sur leurs aventures.\n@c0@"
  it: "@aMaria@bNon che mi dispiaccia, ovviamente.\nSolo che mi piacerebbe anche parlare d'altro con lui!\n@c0@"
  ja: "@a@bマリア「私は　楽しく聞いていますけど\n\t男の人って　いつになっても\n\t旅が　好きなんですね。\n@c0@"
403:
  de: "@a@b*: Tja, was bleibt einem schon groß übrig? Ich hab mich aus dem Staub gemacht, als es in Tifortu immer schlimmer wurde, wisst Ihr.\n@c0@"
  en: "@a@b*: What's a man to do, eh? I ran away from Coburg when things took a turn for the worse, you see.\n@c0@"
  es: "@a@b*: ¿Y ahora qué? Huí de Trastámara en cuanto las cosas empezaron a ponerse feas.\n@c0@"
  fr: "@a@b*ⓢ Si c'est pas malheureuxⓠ Je me suis enfui de Cobourg quand tout a commencé à mal tourner.\n@c0@"
  it: "@a@b*: Accidenti, che razza di sfortuna!\nQuando a Coburg la situazione si fece drammatica, disertai dall'esercito e lasciai il paese!\n@c0@"
  ja: "@a@b＊「まいっちゃったなあ……。\n\tお城が　ヤバくなったときに\n\t逃げ出して来ちゃったから……。\n@c0@"
404:
  de: "@a@b*: Und jetzt sitze ich in der Patsche, denn nachdem ich einmal davongelaufen bin, werden sie mich als Soldat wohl kaum wieder aufnehmen.\n@c0@"
  en: "@a@b*: So now I'm stuck because I can't possibly go back to soldierin' after doin' a runner like that.\n@c0@"
  es: "@a@b*: Así que ahora no sé qué hacer, porque no puedo volver a ser soldado después de haber desertado de esa forma.\n@c0@"
  fr: "@a@b*ⓢ Alors maintenant, je suis coincé parce que je ne peux pas y retourner pour reprendre mon poste après avoir déserté comme ça.\n@c0@"
  it: "@a@b*: E adesso non posso certo aspettarmi che mi riaccolgano a braccia aperte!\nChe faccio, eh?!\n@c0@"
  ja: "@a@b＊「もう　今さら　兵士には\n\tもどれないもんなあ。\n@c0@"
405:
  de: "@a@b*: Offenbar hat sich die Lage in Tifortu wieder normalisiert. Wie das wohl gekommen ist?\n@c0@"
  en: "@a@b*: Sounds like it's all back to normal over in Coburg.\r\nI wonder what fixed everythin'.\n@c0@"
  es: "@a@b*: Parece que las cosas han vuelto a la normalidad en Trastámara.\r\nMe pregunto cómo se habrá arreglado todo.\n@c0@"
  fr: "@a@b*ⓢ On dirait que la vie a repris son cours normal à Cobourg. Je me demande ce qui a bien pu se passer.\n@c0@"
  it: "@a@b*: Pare che la situazione a Coburg sia tornata alla normalità.\nChissà chi è stato a rimettere le cose a posto...\n@c0@"
  ja: "@a@b＊「ラインハットのお城が\n\t平和になったんだってな。\n\tでも　どうしてだろ？\n@c0@"
406:
  de: "@a@b*: Ich bin ein alter Freund von Weißi, der damals hier die Herberge geführt hat.\n㈡\n*: Nach all den Jahren wollte ich mal wieder bei ihm vorbeischauen.\n@c0@"
  en: "@a@b*: I'm an old friend of Whitey who used to run the inn. I came back after all these years to pay him a visit.\n@c0@"
  es: "@a@b*: Soy un viejo amigo de Doptada, el que llevaba la posada. Vine tras todos estos años para visitarlo.\n@c0@"
  fr: "@a@b*ⓢ Je suis un vieil ami d'Al, l'ancien propriétaire de l'auberge. Après toutes ces années, je me suis décidé à revenir ici pour lui rendre visite.\n@c0@"
  it: "@a@b*: Sono un vecchio amico del signor Whitblanche, il precedente gestore della locanda.\n㈡\n*: Era da parecchio che non avevo notizie di lui, così ero passato a fargli una visita.\n@c0@"
  ja: "@a@b＊「わしは　昔この宿をやってた\n\tダンカンさんの知り合いでの。\n\t久しぶりに会いに来たのじゃ。\n@c0@"
407:
  de: "@a@b*: Aber er hat die Bude wohl aus gesundheitlichen Gründen verkauft und ist in ein Bergdorf hinter dem Meer gezogen, weit weg von hier.\n@c0@"
  en: "@a@b*: But I'm told he had problems with his health so he sold up and moved to a village in the mountains far across the sea from here.\n@c0@"
  es: "@a@b*: Pero me han dicho que tenía problemas de salud, así que vendió la posada y se fue a una aldea en las montañas, al otro lado del mar.\n@c0@"
  fr: "@a@b*ⓢ Mais on m'a dit qu'il avait eu des problèmes de santé et qu'il avait vendu pour s'installer par-delà les océans, dans un village de montagne.\n@c0@"
  it: "@a@b*: Però ho saputo che ha avuto problemi di salute.\n㈡\n*: Pare che abbia ceduto la sua attività e che si sia trasferito in un villaggio tra i monti, dall'altro lato dell'oceano.\n@c0@"
  ja: "@a@b＊「けど　ダンカンさんは身体を悪くして\n\t宿屋をやめ　はるか海の向こうの\n\t山奥の村に引っこして行ったらしい。\n@c0@"
408:
  de: "@a@b*: Ich hatte eigentlich gehofft, ich könnte seine Tochter wiedersehen. Ach, schade!\n@c0@"
  en: "@a@b*: I was hoping to see that daughter of his again. What a shame!\n@c0@"
  es: "@a@b*: Esperaba poder ver a su hija. ¡Es una lástima!\n@c0@"
  fr: "@a@b*ⓢ J'espérais aussi revoir sa fille.\nC'est vraiment dommageⓠ\n@c0@"
  it: "@a@b*: Mi dispiace non averlo potuto incontrare.\nMi avrebbe anche fatto piacere rivedere sua figlia!\n@c0@"
  ja: "@a@b＊「あの　かわいい娘さんにも\n\t会いたかったのう。\n\tざんねんじゃわい……。\n@c0@"
409:
  de: "@aBianca@bHallo! Ich bin's! Bianca!\n@c0@"
  en: "@aBianca@bHey! It's me! Bianca!\n@c0@"
  es: "@aBianca@b¡Eh! ¡Soy yo! ¡Bianca!\n@c0@"
  fr: "@aBianca@bMais c'est moiⓠ Biancaⓠ\n@c0@"
  it: "@aBianca@bEhi!\nSono io, Bianca!\n@c0@"
  ja: "@a@bビアンカ「おじいさん！\n\t私よ　ビアンカよ。\n@c0@"
410:
  de: "@a@b*: Na so was! Unsere kleine Bianca! Was für eine Überraschung! Bist du aber groß geworden, Kind!\n@c0@"
  en: "@a@b*: Beggar me! So it is! What a surprise!\nHaven't you grown, dear?\n@c0@"
  es: "@a@b*: ¡Pero qué narices! ¡Es verdad! ¡Qué sorpresa!\r\n¡Pero cuánto has crecido, guapa!\n@c0@"
  fr: "@a@b*ⓢ Par la Déesseⓠ Mais oui, c'est toiⓠ\nPour une surpriseⓠ Comme tu as grandiⓠ\n@c0@"
  it: "@a@b*: Oh, santi numi! Sei proprio tu!\nScusami, ma non ti avevo riconosciuta!\nAccidenti, quanto sei cresciuta! Vedo che stai bene...\n@c0@"
  ja: "@a@b＊「なんと！　ビアンカちゃんかね？\n\tこりゃ　おどろいた！\n\t大きくなったのう。\n@c0@"
411:
  de: "@aBianca@bPapa geht's auch gut. Es geht ihm schon viel besser, seit er in eine friedlichere Gegend gezogen ist.\n@c0@"
  en: "@aBianca@bDad's doin' just fine too. He's much better now since movin' to somewhere more peaceful.\n@c0@"
  es: "@aBianca@bA papá también le va muy bien. Está mucho mejor desde que se fue a vivir a un sitio más tranquilo.\n@c0@"
  fr: "@aBianca@bPapa est en pleine forme. Il va beaucoup mieux depuis qu'il a déménagé dans un endroit plus tranquille.\n@c0@"
  it: "@aBianca@bNon mi lamento...\nPer fortuna, nemmeno mio padre se la passa male.\nSi sente molto meglio, da quando ci siamo trasferiti.\n@c0@"
  ja: "@a@bビアンカ「父さんも　元気よ。\n\t引っ越したおかげで　病気も\n\tだんだん　よくなってるわ。\n@c0@"
412:
  de: "@a@b*: Tja, es freut mich, das zu hören. Dieser Ort hat ihm viel bedeutet, nicht?\n@c0@"
  en: "@a@b*: Well, that's good to hear. This place meant\r\na lot to him, didn't it?\n@c0@"
  es: "@a@b*: Me alegro de oírlo. Estaba muy apegado a este sitio, ¿verdad?\n@c0@"
  fr: "@a@b*ⓢ Je suis content de l'apprendre. Il tenait beaucoup à cet endroit, heinⓡ\n@c0@"
  it: "@a@b*: Ah, mi fa piacere sentirlo!\nQuesta sì che è una buona notizia! Sai, lui è sempre stato molto affezionato a questi luoghi...\n@c0@"
  ja: "@a@b＊「そうかい　そうかい。\n\tいや　なにしろ　この宿屋は\n\tダンカンさんの宝じゃったから。\n@c0@"
413:
  de: "@a@b*: Da hatte ich mir schon Sorgen gemacht, dass es zu hart für ihn sein würde, von hier wegzugehen.\n@c0@"
  en: "@a@b*: I was a bit worried that it might be too hard on him, havin' to give it up like that.\n@c0@"
  es: "@a@b*: Me preocupaba que eso de tener que abandonarlo todo le afectase mucho.\n@c0@"
  fr: "@a@b*ⓢ J'avais un peu peur que ce ne soit trop dur pour lui d'avoir dû le quitter.\n@c0@"
  it: "@a@b*: Temevo che non sarebbe riuscito ad adattarsi a vivere altrove, ma pare che io sia stato troppo pessimista.\n@c0@"
  ja: "@a@b＊「それを　手ばなすとは\n\tよっぽどのことと\n\t心配しとったんじゃよ。\n@c0@"
414:
  de: "@a@b*: Aber ich bin erleichtert, dich zu sehen und zu hören, dass alles in Ordnung ist. Grüß ihn schön von mir, wenn du ihn wiedersiehst, ja?\n@c0@"
  en: "@a@b*: But it's bin a relief seein' you and hearin' that all's well. Send him my regards next time you see him, eh?\n@c0@"
  es: "@a@b*: Pero oye, qué alegría oír que todo le va genial. Dale recuerdos de mi parte cuando lo veas, ¿eh, guapa?\n@c0@"
  fr: "@a@b*ⓢ Mais je suis soulagé de t'avoir vue et d'avoir eu de ses nouvelles. Tu lui passeras le bonjour la prochaine fois que tu le verras, d'accordⓡ\n@c0@"
  it: "@a@b*: Mi ha fatto piacere incontrarti e sapere che le cose vi vanno bene. Ricordati di portare i miei saluti a tuo padre quando lo rivedrai, d'accordo?\n@c0@"
  ja: "@a@b＊「でも　ビアンカちゃんに会えて\n\t本当に　よかったわい。\n\tダンカンさんにも　よろしくな。\n@c0@"
415:
  de: "@a@b*: Ich bin ein alter Freund von Weißi, der den Laden früher geführt hat. Ich wollte ihm schon länger mal einen Besuch abstatten, deshalb bin ich hier.\n@c0@"
  en: "@a@b*: I'm an old friend of Whitey who used to run this place. I came by to pay him a long overdue visit.\n@c0@"
  es: "@a@b*: Soy un viejo amigo de Doptada, el que llevaba este sitio. He venido a hacerle una visita, que ya hace tiempo que se la debía.\n@c0@"
  fr: "@a@b*ⓢ Je suis un vieil ami d'Al, l'ancien propriétaire de l'auberge. Ça faisait des années que je me disais qu'il fallait que je revienne le voir.\n@c0@"
  it: "@a@b*: Sono un vecchio amico del signor Whitblanche, il precedente gestore della locanda.\n㈡\n*: Era da parecchio che non avevo notizie di lui, così ero passato a fargli una visita.\n@c0@"
  ja: "@a@b＊「わしは　昔ここの宿をやってた\n\tダンカンさんの知り合いでの。\n\t久しぶりに会いに来たのじゃ。\n@c0@"
416:
  de: "@a@b*: Aber er hat die Bude wohl aus gesundheitlichen Gründen verkauft und ist in ein Bergdorf hinter dem Meer gezogen, weit weg von hier.\n@c0@"
  en: "@a@b*: But I'm told he had problems with his health so he sold up and moved to a village in the mountains far across the sea from here.\n@c0@"
  es: "@a@b*: Pero me han dicho que tenía problemas de salud, así que vendió la posada y se fue a una aldea en las montañas, al otro lado del mar.\n@c0@"
  fr: "@a@b*ⓢ Mais on m'a dit qu'il avait eu des problèmes de santé et qu'il avait vendu pour s'installer par-delà les océans, dans un village de montagne.\n@c0@"
  it: "@a@b*: Però ho saputo che ha avuto problemi di salute.\n㈡\n*: Pare che abbia ceduto la sua attività e che si sia trasferito in un villaggio tra i monti, dall'altro lato dell'oceano.\n@c0@"
  ja: "@a@b＊「けど　ダンカンさんは身体を悪くして\n\t宿屋をやめ　はるか海の向こうの\n\t山奥の村に引っこして行ったらしい。\n@c0@"
417:
  de: "@a@b*: Ich hatte eigentlich gehofft, ich könnte seine Tochter wiedersehen. Ach, schade!\n@c0@"
  en: "@a@b*: I was hoping to see that daughter of his again. What a shame!\n@c0@"
  es: "@a@b*: Esperaba poder ver a su hija. ¡Es una lástima!\n@c0@"
  fr: "@a@b*ⓢ J'espérais aussi revoir sa fille.\nC'est vraiment dommageⓠ\n@c0@"
  it: "@a@b*: Mi dispiace non averlo potuto incontrare.\nMi avrebbe anche fatto piacere rivedere sua figlia!\n@c0@"
  ja: "@a@b＊「あの　かわいい娘さんにも\n\t会いたかったのう。\n\tざんねんじゃわい……。\n@c0@"
418:
  de: "@a@b*: Was? Ihr seid ein Freund von Bianca?\n@c0@"
