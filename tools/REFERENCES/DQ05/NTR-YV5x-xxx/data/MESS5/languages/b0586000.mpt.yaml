  fr: "@a%0%a001240@bPourquoi est-ce qu'on continue à marcherⓡ\nAvec le château zénithien, on pourrait aller\npartout en volant, maintenantⓠ\n@c0@"
  it: "@a%0%a001240@bMa perché perdiamo ancora tempo a camminare?!\nPossiamo volare ovunque, ora che abbiamo a disposizione il Castello di Zenithia!\n@c0@"
  ja: "@a@b%a001240「せっかく　天空城で\n\t空を飛べるようになったのに\n\tなんで　歩くの？\n@c0@"
102:
  de: "@a%0%a001240@bKomm schon, Papa! Na los! Und ich bin der Pilot!\n@c0@"
