  it: "@a%0%a001240@bPapà, ma da dov'è sbucato questo globo d'oro?\nNon ho capito bene cos'è successo...\n@c0@"
  ja: "@a@b%a001240「お父さん。\n\tいつのまにゴールドオーブを\n\t手に入れたの？　ふしぎだなあ。\n@c0@"
91:
  de: "@a%0%a001240@bGlaubst du wirklich, dass diese Kugel Zenithia zurück in den Himmel befördern kann?\n@c0@"
  en: "@a%0%a001240@bDo you think this will really make Zenithia fly back up to the sky?\n@c0@"
  es: "@a%0%a001240@b¿Crees de verdad que con esto Zenithia volverá a volar por el aire?\n@c0@"
