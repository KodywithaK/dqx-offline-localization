0:
  de: "@a%0%a001240@bMeinen Namen hast du mir gegeben, nicht wahr, Papa?\n@c0@"
  en: "@a%0%a001240@bYou named me, didn't you, Dad?\n@c0@"
  es: "@a%0%a001240@bTú elegiste mi nombre, ¿no, papá?\n@c0@"
  fr: "@a%0%a001240@bC'est toi qui m'as donné mon nom, hein, papaⓡ\n@c0@"
  it: "@a%0%a001240@bPapà, è vero che sei stato tu a scegliere il mio nome?\n@c0@"
  ja: "@a@b%a001240「ボクの名前　お父さんが\n\tつけてくれたんだよね。\n@c0@"
1:
  de: "@a%0%a001240@bIch liebe den Namen %a001240. Der ist echt klasse. Danke!\n@c0@"
  en: "@a%0%a001240@bI love the name %a001240.\nIt's so cool. Thanks!\n@c0@"
  es: "@a%0%a001240@bMe encanta %a001240.\nEs genial. ¡Gracias!\n@c0@"
  fr: "@a%0%a001240@bJ'adore le prénom %a001240.\nIl est super classe. Merciⓠ\n@c0@"
  it: "@a%0%a001240@bⓕ%0%a001240ⓖ mi piace tantissimo!\nÈ troppo forte! Grazie!\n@c0@"
  ja: "@a@b%a001240「ボクね　%a001240って名前\n\tすごく好きだよ。\n\tえへへ　ありがとう　お父さん！\n@c0@"
2:
  de: "@a%0%a001240@bUi! Wo hast du denn diese Karte her, Papa? Das ist die unglaublichste Karte, die ich je gesehen habe!\n@c0@"
  en: "@a%0%a001240@bWow! Where did you get that map, Dad?\nIt's the most amazing map I've ever seen!\n@c0@"
  es: "@a%0%a001240@b¡Vaya! ¿Dónde has conseguido ese mapa, papá?\n¡Es el más alucinante que he visto nunca!\n@c0@"
  fr: "@a%0%a001240@bWaouhⓠ Où est-ce que tu as eu cette carte, papaⓡ\nC'est la carte la plus incroyable que j'aie jamais vueⓠ\n@c0@"
  it: "@a%0%a001240@bDove hai preso quella mappa, papà?\nNon ne avevo mai vista una così bella, sai?\n@c0@"
  ja: "@a@b%a001240「うわ～！　お父さんって\n\tすごい地図　持ってるんだね。\n@c0@"
3:
  de: "@a%0%a001240@bWenn wir die gehabt hätten, hätten wir dich schon früher befreien können.\n@c0@"
  en: "@a%0%a001240@bIf we'd had that, we probably could've saved you a bit sooner.\n@c0@"
  es: "@a%0%a001240@bDe haberlo tenido seguro que te hubiéramos salvado un poco antes.\n@c0@"
  fr: "@a%0%a001240@bSi on l'avait eue avant, on aurait sûrement réussi à te sauver un peu plus tôt.\n@c0@"
  it: "@a%0%a001240@bSe ne avessimo avuta una simile, probabilmente ci avremmo messo molto meno a trovarti!\n@c0@"
  ja: "@a@b%a001240「それがあったら\n\tボクたちも　もうすこし　はやく\n\tお父さんを　助けてあげられたかも！\n@c0@"
4:
  de: "@a%0%a001240@bSancho sagt, dass ich ein bisschen wie du aussehe, als du jünger warst. Findest du das auch?\n@c0@"
  en: "@a%0%a001240@bSancho says I look just like you when you were younger. Do you think so too?\n@c0@"
  es: "@a%0%a001240@bSancho dice que soy como tú cuando tenías mi edad. ¿Es verdad?\n@c0@"
  fr: "@a%0%a001240@bSancho dit que je te ressemble quand tu étais plus jeune. C'est ce que tu penses, toi aussiⓡ\n@c0@"
  it: "@a%0%a001240@bPapà, lo zio Sancho dice che somiglio molto a te quando avevi la mia età.\nHa ragione?\n@c0@"
  ja: "@a@b%a001240「サンチョがね　ボクのこと\n\tお父さんの小さい頃に\n\tそっくりだって。　ホントかな？\n@c0@"
5:
  de: "@a%0%a001250@bIch wollte immer schon auf Abenteuerreise mit dir gehen, Papa. Das ist wie ein Traum, der in Erfüllung geht!\n@c0@"
  en: "@a%0%a001250@bI always wanted to go on an adventure with you, Dad. This is like a dream come true!\n@c0@"
  es: "@a%0%a001250@bSiempre he querido ir de aventuras contigo, papá. ¡Esto es un sueño hecho realidad!\n@c0@"
  fr: "@a%0%a001250@bJ'ai toujours voulu partir à l'aventure avec toi, papa. C'est comme un rêve qui se réaliseⓠ\n@c0@"
  it: "@a%0%a001250@bPapà, avevo sempre desiderato partire con te per una splendida avventura! Per me questo è un sogno che diventa realtà! Evviva!\n@c0@"
  ja: "@a@b%a001250「わたし　お父さんと\n\tいっしょに旅が　したかったの。\n\tやっと　夢が　かなった……。\n@c0@"
6:
  de: "@a%0%a001250@bWie findest du meine Kleider, Papa? Kusine Traudl hat sie für mich ausgesucht.\n@c0@"
  en: "@a%0%a001250@bWhat do you think of my outfit, Dad?\nCousin Gertie picked it out for me.\n@c0@"
  es: "@a%0%a001250@b¿Qué te parece mi traje, papá?\nMe lo eligió la prima Frede.\n@c0@"
  fr: "@a%0%a001250@bQu'est-ce que tu penses de ma tenue, papaⓡ\nC'est cousine Gégé qui l'a choisie pour moi.\n@c0@"
  it: "@a%0%a001250@bPapà, ti piace il mio vestito?\nMe l'ha consigliato Gertrude, la mia cuginetta!\n@c0@"
  ja: "@a@b%a001250「ねえ　お父さん。\n\tこの服どう？　ドリスお姉ちゃんが\n\tえらんでくれたんだけど……。\n@c0@"
7:
  de: "@aSancho@bIss kann immer noch nisst glauben, dass du wirkliss zurück bist, Chico! Und dann mit dir zu reisen... Iss bin ja so glückliss!\n@c0@"
  en: "@aSancho@bI, I estill no believe ees really you, friend!\r\nAnd travelling together again like thees...\r\nI, I eso happy!\n@c0@"
  es: "@aSancho@b¡Aún no puedo creer que seas tú, chamaquito!\nY viajando de nuevo juntos.\n¡Qué padre!\n@c0@"
  fr: "@aSancho@bJe n'arrive t-toujours pas à c-croire que c'est vraiment toi, chicoⓠ Et voyager de nouveau\nensemble, c-comme ça... Je suis si c-contentⓠ\n@c0@"
  it: "@aSancho@b¡Ancora no me sembra vero, chico!\n¡Estiamo viaggiando insieme!\nYo... Yo me commuovos... ¡Sob!\n@c0@"
  ja: "@a@bサンチョ「本当に　本物の坊っちゃんだ。\n\tしかも　こうして　また\n\tいっしょに旅を…　うれしいですねえ。\n@c0@"
8:
  de: "@aSancho@bMach dir keine Sorgen über die Niños.\n@c0@"
  en: "@aSancho@bYou no worry about your leettle ones.\n@c0@"
  es: "@aSancho@bNo os preocupéis por los chavitos.\n@c0@"
  fr: "@aSancho@bNe t'inquiète pas p-pour tes p-petits.\n@c0@"
  it: "@aSancho@bNo preoccuparte por los tuos figlios...\nEstanno crescendo sanos y fuertes.\n¡Lo zio Sancho se es siempre preso cura de loros!\n@c0@"
  ja: "@a@bサンチョ「お子さんがたのことは\n\tなんにも　心配ありませんよ。\n@c0@"
9:
  de: "@aSancho@bAls du ein kleiner Niño warst, Chico, hab iss viel über Kindererziehung gelernt, weißt du.\n@c0@"
  en: "@aSancho@bWhen you are growing up, friend, I learn muchos about raising the bebés.\n@c0@"
  es: "@aSancho@bCuando vos erais chiquito aprendí mucho sobre cómo criar bebes.\n@c0@"
  fr: "@aSancho@bAvec toi, chico, j'ai appris b-beaucoup de choses sur la m-manière d'élever les enfants.\n@c0@"
  it: "@aSancho@bQuando eri piccolo, me occupavo espessos de ti,\ny ho imparato muchas cosas su como se bada a los niños.\n@c0@"
  ja: "@a@bサンチョ「子育てに　関しては\n\t坊っちゃんのときに\n\tいろいろ　経験してますから。\n@c0@"
10:
  de: "@aSancho@bDanke, dass du miss mit auf deine Reise genommen hast, Chico. Dein alter Onkel Sancho gehört schließliss noch nisst zum alten Eisen.\n@c0@"
  en: "@aSancho@bI, I thank you for taking me weeth you on your quest thees time. Your Uncle Sancho, he gonna earn hees garbanzos.\n@c0@"
  es: "@aSancho@bQué padre que me hayáis traído a la misión, chamaquito. El tito Sancho va a ganarse los garbanzos.\n@c0@"
  fr: "@aSancho@bMerci de m'avoir permis de t'accompagner d-dans ta quête, cette fois. Ton t-tonton Sancho va pouvoir gagner sa c-croûte.\n@c0@"
  it: "@aSancho@bTe ringrazio de averme portato contigo en esto viaggio, chico. ¡Lo zio Sancho te promette que te aiuterà en todos los modos possibiles!\n@c0@"
  ja: "@a@bサンチョ「しかし　こうして\n\t新たなる旅のお供に　私を……。\n\tこのサンチョ　必ずお役に立ちますぞ！\n@c0@"
11:
  de: "@aSancho@bEs ist so schön, dass du jetzt bei uns bist, Chico.\n@c0@"
  en: "@aSancho@bEes eso easy travelling now you are\r\nweeth us, friend.\n@c0@"
  es: "@aSancho@bContigo es bien fácil viajar, chamaquito.\n@c0@"
  fr: "@aSancho@bC'est t-tellement facile de voyager m-maintenant\r\nque tu es avec nous, chico.\n@c0@"
  it: "@aSancho@bViaggiare contigo es divertentes, chico.\n¡Y es anche muy más facile que andare en giros da solo con dos niños!\n@c0@"
  ja: "@a@bサンチョ「しかし　坊っちゃんとの旅は\n\t楽ちんですね。\n@c0@"
12:
  de: "@aSancho@bAls deine Niños noch kleiner waren, sind sie mir immer weggelaufen, weißt du.\n@c0@"
  en: "@aSancho@bWhen your eson ees more esmall, he and hees esister, always they are getting away from me.\n@c0@"
  es: "@aSancho@bCuando tus hijos eran más menudos pues siempre se me escapaban.\n@c0@"
  fr: "@aSancho@bQuand t-ton fils était plus p-petit, lui et sa sœur\r\nse s-sauvaient tout le temps.\n@c0@"
  it: "@aSancho@bCuando erano más piccoli, los tuos figlios cercavano siempre de escappare via, y dovevo sudar settes camicias por riprenderlos...\n@c0@"
  ja: "@a@bサンチョ「%a001240さまたちは\n\tすぐに　どこかへ行ってしまって……\n\tお小さいときは　苦労しましたよ。\n@c0@"
13:
  de: "@aOtto@bJ-Ja? W-Was kann ich für Euch tun, Eure Majestät?\n@c0@"
  en: "@aTuppence@bY-Yes!? Wh-What can I do for you, Your Majesty?\n@c0@"
  es: "@aAlazar@b¿S-Sí? ¿Q-Qué puedo hacer por vos, Majestad?\n@c0@"
  fr: "@aInnocent@bOuiⓡⓐ Que puis-je faire pour vous, Votre Majestéⓡ\n@c0@"
  it: "@aSimon@bComandi, Maestà!\nCosa posso fare per lei?\n@c0@"
  ja: "@a@bピピン「は　はいっ！\n\tな　なんでしょうかっ！？\n@c0@"
14:
  de: "@aOtto@bTut mir leid... Ich bin ein wenig nervös! Immerhin reise ich mit dem König!\n@c0@"
  en: "@aTuppence@bSorry... I-I'm a bit nervous!\nI mean, I'm travelling with the King!\n@c0@"
  es: "@aAlazar@bLo siento... ¡E-estoy un poco nervioso!\n¡Viajo con el Rey!\n@c0@"
  fr: "@aInnocent@bPardon... J-Je suis un peu nerveuxⓠ\nC'est que je voyage avec le roi, quand mêmeⓠ\n@c0@"
  it: "@aSimon@bChiedo scusa, ma sono un po' nervoso...\nViaggiare con il mio Re non è cosa da tutti i giorni!\n@c0@"
  ja: "@a@bピピン「……いえ　ボク\n\tちょっと　きんちょう　してるんです。\n\t王さまの　お供だなんて。\n@c0@"
15:
  de: "@aOtto@bIhr seid viel jünger, als ich gedacht hatte, Eure Majestät. Ich glaube sogar, dass wir ungefähr im gleichen Alter sind.\n@c0@"
  en: "@aTuppence@bYou're quite a bit younger than I expected, Your Majesty. In fact, you look about the same age as me.\n@c0@"
  es: "@aAlazar@bSois bastante más joven de lo que esperaba, Majestad. De hecho, parecéis de mi edad.\n@c0@"
  fr: "@aInnocent@bVous êtes un peu plus jeune que ce que je croyais, Votre Majesté. En fait, vous devez avoir à peu près le même âge que moi.\n@c0@"
  it: "@aSimon@bMaestà, credevo che lei fosse più maturo...\nCioè, che fosse più anziano...\n㈡\nMa che sto dicendo?!\nVolevo dire che non pensavo che lei fosse tanto giovane...\n@c0@"
  ja: "@a@bピピン「%a000090さまって\n\t思ったより　お若いんですね。\n\tボクと　同じぐらいに見えますよ。\n@c0@"
16:
  de: "@aOtto@bIch mag der Aufgabe nicht gewachsen sein, trotzdem würde ich mein Leben für Euch opfern, Eure Majestät. \n㈡\nWenn ich in der Nähe bin, habt Ihr nichts zu befürchten!\n@c0@"
  en: "@aTuppence@bI'm probably not really up to the task, but I'd lay my life on the line to protect you, Your Majesty.\r\nHave no fear!\n@c0@"
  es: "@aAlazar@bProbablemente no esté a la altura, pero daré mi vida por protegeros, Majestad.\n¡No temáis!\n@c0@"
  fr: "@aInnocent@bJe ne suis sans doute pas à la hauteur de la tâche, mais je suis prêt à sacrifier ma vie pour vous protéger, Votre Majesté. Ne craignez rienⓠ\n@c0@"
  it: "@aSimon@bNon tema, Maestà! Per lei darei la vita!\nAnche se, detto in tutta franchezza, preferirei non dover ricorrere a misure tanto estreme...\n@c0@"
  ja: "@a@bピピン「ボク　ウデには　あまり\n\t自信がありませんが　精いっぱい\n\t%a000090さまを守らせていただきます！\n@c0@"
17:
  de: "@a%0%a001240@bKönnen wir den fliegenden Teppich nicht öfter benutzen, Papa? Es ist so ein schönes Gefühl, auf ihm dahin zu schweben!\n@c0@"
  en: "@a%0%a001240@bCan we use the flying carpet more, Dad?\nPlease! I love that floating feeling you get on it.\n@c0@"
  es: "@a%0%a001240@b¿Podemos seguir usando la alfombra mágica, papá?\n¡Por favor! Me encanta esa sensación de volar.\n@c0@"
  fr: "@a%0%a001240@bEst-ce qu'on pourrait utiliser le tapis volant un peu plus souvent, papaⓡ S'il te plaîtⓠ On a l'impression de flotter quand on est dessus, j'adoreⓠ\n@c0@"
  it: "@a%0%a001240@bPapà, perché non usiamo più spesso il tappeto volante? È troppo divertente stare con la testa tra le nuvole! Eh eh eh!\n@c0@"
  ja: "@a@b%a001240「ねえねえ　歩くより\n\tまほうのじゅうたんを　つかおうよ！\n\tびゅ～ん　って飛んだら気持ちいいよ！\n@c0@"
18:
  de: "@a%0%a001240@bIch habe gerade an Steile Höh gedacht. Irgendwann würde ich gerne dorthin zurück. Schließlich ist Großmutter da geboren, nicht wahr?\n@c0@"
  en: "@a%0%a001240@bI was just thinking about Lofty Peak. I'd like to go back there sometime. I mean, that's where Grandma was born, isn't it?\n@c0@"
  es: "@a%0%a001240@bPensaba en Cumbre Excelsa. Me gustaría volver algún día. Ahí es donde nació la abuela, ¿no?\n@c0@"
  fr: "@a%0%a001240@bJ'étais en train de penser à Haute-Cime.\nJ'aimerais bien y retourner un jour. C'est bien\nlà que grand-mère est née, n'est-ce pasⓡ\n@c0@"
  it: "@a%0%a001240@bPerché non torniamo a Picco Maximo qualche volta? Quel posto mi piace tanto!\nE poi mia nonna è nata là, non è vero?\n@c0@"
  ja: "@a@b%a001240「エルヘブンかあ……\n\tまた　行きたいなあ。\n\tおばあちゃんの故郷。\n@c0@"
19:
  de: "@a%0%a001240@bEs macht Spaß, mit dir zu reisen, Papa. Wenn jetzt noch Mama bei uns wäre, wär's der beste Ausflug überhaupt!\n@c0@"
  en: "@a%0%a001240@bTravelling with you is great, Dad. If Mum was with us now too, it'd be the best trip ever!\n@c0@"
  es: "@a%0%a001240@bMe encanta viajar contigo, papá. ¡Si también estuviera mamá sería el mejor viaje del mundo!\n@c0@"
  fr: "@a%0%a001240@bC'est super de voyager avec toi, papa. Si maman était avec nous aussi en ce moment, ce serait le meilleur voyage du mondeⓠ\n@c0@"
  it: "@a%0%a001240@bMi piace tanto andare in giro con te, papà.\nSe ci fosse anche la mamma, questo sarebbe il più bel viaggio della mia vita!\n@c0@"
  ja: "@a@b%a001240「お父さんと　旅するのって\n\t楽しいね。　これに　お母さんが\n\tくわわったら　きっと　最高だよね！\n@c0@"
20:
  de: "@a%0%a001250@bDu gehst wirklich schnell, Papa. Ist das, weil du so lange Beine hast?\n@c0@"
  en: "@a%0%a001250@bYou walk really fast, Dad.\nIs it because you've got long legs?\n@c0@"
  es: "@a%0%a001250@bAndas muy rápido, papá.\n¿Es porque tienes las piernas muy largas?\n@c0@"
  fr: "@a%0%a001250@bTu marches vraiment vite, papa.\nC'est parce que tu as de grandes jambesⓡ\n@c0@"
  it: "@a%0%a001250@bQuanto cammini veloce, papà!\nÈ normale, no? Hai le gambe così lunghe!\n@c0@"
  ja: "@a@b%a001250「お父さんって\n\t歩くの　はやいのね。\n\t足が長いから…　かな？\n@c0@"
21:
  de: "@a%0%a001250@bAuf dem fliegenden Teppich fühle ich mich immer wie ein Vogel. Es ist so ein schönes Gefühl.\n@c0@"
  en: "@a%0%a001250@bBeing on the flying carpet's a bit like being a bird.\nIt's a funny feeling.\n@c0@"
  es: "@a%0%a001250@bIr en la alfombra mágica es un poco como ser un pájaro.\nEs muy divertido.\n@c0@"
  fr: "@a%0%a001250@bÊtre sur le tapis volant, c'est un peu comme être un oiseau. C'est marrant.\n@c0@"
  it: "@a%0%a001250@bQuando sono sul tappeto volante mi sembra di essere un uccello!\nÈ una sensazione bellissima!\n@c0@"
  ja: "@a@b%a001250「じゅうたんが　あると\n\tお空が　飛べるのね。\n\t小鳥さん　みたい。\n@c0@"
22:
  de: "@a%0%a001250@bIch liebe Monster. Es ist gar nicht lustig, dauernd gegen sie kämpfen zu müssen.\n@c0@"
  en: "@a%0%a001250@bI love monsters. I really hate having to fight them\nall the time.\n@c0@"
  es: "@a%0%a001250@bMe gustan los monstruos. No me gusta nada estar todo el día luchando contra ellos.\n@c0@"
  fr: "@a%0%a001250@bJ'adore les monstres. Je déteste être obligée de les combattre tout le temps.\n@c0@"
  it: "@a%0%a001250@bA me i mostri piacciono tanto.\nMi sento un po' in colpa quando dobbiamo combattere contro quelle povere creaturine...\n@c0@"
  ja: "@a@b%a001250「わたし　魔物さん　大好き。\n\tだから　魔物さんと　たたかうのは\n\tちょっと　つらいの……。\n@c0@"
23:
  de: "@aSancho@bDu bist so groß und stark geworden wie ein risstiger Macho, no, Chico? Aber du musstest ja auch viel durchmachen...\n@c0@"
  en: "@aSancho@bYou have become estrong, like the true\r\nmacho man, eh, friend? You have\r\ngone through eso much...\n@c0@"
  es: "@aSancho@bEstás hecho un puro macho, ¿eh, chamaquito? Pasaste por tantas cosas...\n@c0@"
  fr: "@aSancho@bT-tu es devenu f-fort comme oun vrai hombre, hein, chicoⓡ Tu as t-traversé tant d'épreuves...\n@c0@"
  it: "@aSancho@bChico, sei diventato un hombre muy fuerte y coraggioso.\n¡Somigli muchissimo al señor Russel!\n@c0@"
  ja: "@a@bサンチョ「しかし　坊っちゃんは\n\tたのもしくなられましたね。\n\t今までのご苦労が　しのばれます……。\n@c0@"
24:
  de: "@aSancho@bWir haben auch nach Hinweisen gesucht, um Señorita %a001230 aufzuspüren. Aber wir haben nissts gefunden. Nada!\n@c0@"
  en: "@aSancho@bWe have been esearching for the clues to find señora %a001230 too. But we find notheeng. Nada!\n@c0@"
  es: "@aSancho@bÁndale, nosotros también buscamos pistas sobre la señora %a001230. Pero nada. No encontramos nada.\n@c0@"
  fr: "@aSancho@bNous avons cherché d-des indices pour\nr-retrouver la señorita %a001230 aussi.\nMais nous n'avons rien t-trouvé. Nadaⓠ\n@c0@"
  it: "@aSancho@bAbbiamo cercato ovunques la señora %a001230, ma no l'abbiamo trovata...\n@c0@"
  ja: "@a@bサンチョ「私たちも　ずっと%a001230さまの\n\t手がかりを　さがしていたのですが…\n\t今のところは　何も。　はあーっ……。\n@c0@"
25:
  de: "@aSancho@bAhh... Ahh... Vielleisst werde iss ja alt, aber ⓚⓛ Ahh ⓚⓛ iss werde immer so schnell müde in letzter Zeit. \n㈡\nKönnen wir nisst den fliegenden Teppich nehmen, Chico?\n@c0@"
  en: "@aSancho@bHahh...hahh... Maybe ees my years, but ⓚⓛ hahh ⓚⓛ\nI ees tired eso quickly these days.\nYou no wanna use the flying carpet?\n@c0@"
  es: "@aSancho@bAaah..., aaah... Quizá sea nomás que estoy ruco, pero... Aah... Me canso muy deprisa, si seré flojo...\n¿No quieres usar la alfombra mágica?\n@c0@"
  fr: "@aSancho@bHan han... C'est peut-être que je me f-fais vieux, mais ⓚ han han ⓚ je me fatigue si vite, ces temps-ci. Tu ne v-voudrais pas utiliser le t-tapis volantⓡ\n@c0@"
  it: "@aSancho@bHahhh... Hahhh...\n¡Soy estanco muerto!\n¿Por qué no usiamo el tappeto volante? Hahhh...\n@c0@"
  ja: "@a@bサンチョ「ふう　ふう…\n\tトシのせいか　つかれが……。\n\tまほうのじゅうたんで　行きませんか？\n@c0@"
26:
  de: "@aOtto@bIch bin nie über Humburg und Umgebung hinausgekommen. Ich hätte nie gedacht, dass ich einmal die Welt bereisen würde!\n@c0@"
  en: "@aTuppence@bAll I ever knew of the world was Gotha and places nearby. I never thought I'd get the chance to travel the world!\n@c0@"
  es: "@aAlazar@bSolo conocía Pankraz y alrededores. ¡Nunca pensé que viajaría por todo el mundo!\n@c0@"
  fr: "@aInnocent@bJe ne connaissais du monde que Gotha et ses alentours. Je n'aurais jamais pensé avoir l'occasion de voyager à travers le mondeⓠ\n@c0@"
  it: "@aSimon@bIn tutta la mia vita non ero mai uscito dal Regno di Denim. Non credevo che avrei mai avuto la possibilità di girare il mondo come sto facendo adesso!\n@c0@"
  ja: "@a@bピピン「グランバニア周辺しか\n\t知らなかった　このボクが……\n\t世界中を　旅できるなんて！\n@c0@"
27:
  de: "@aOtto@bIch dachte, fliegende Teppiche gibt es nur im Märchen. Das ist ja unglaublich!\n@c0@"
  en: "@aTuppence@bI thought carpets that flew only existed in faerie tales. It's incredible!\n@c0@"
  es: "@aAlazar@bCreía que las alfombras voladoras eran cosa de los cuentos. ¡Es increíble!\n@c0@"
  fr: "@aInnocent@bJe croyais que les tapis volants n'existaient que dans les contes de fée. C'est incroyableⓠ\n@c0@"
  it: "@aSimon@bCredevo che i tappeti volanti esistessero solo nelle fiabe!\n@c0@"
  ja: "@a@bピピン「しかし　じゅうたんが\n\t空を飛ぶなんてねえ……。\n\tうーん　信じられないなあ。\n@c0@"
28:
  de: "@a%0%a001240@bIch werde bestimmt mal groß und stark. Dann kann niemand mehr dir oder %a001250 etwas antun, Papa!\n@c0@"
  en: "@a%0%a001240@bI'm going to become big and strong so that no one can ever hurt you or %a001250 again, Dad!\n@c0@"
  es: "@a%0%a001240@b¡Voy a ser grande y fuerte para que nadie pueda haceros daño a ti o a %a001250, papi!\n@c0@"
  fr: "@a%0%a001240@bJe vais devenir si grand et si fort que personne ne pourra plus jamais te faire de mal, ni à toi ni à %a001250, papaⓠ\n@c0@"
  it: "@a%0%a001240@bPapà, ti prometto che diventerò grande e grosso, così nessuno si permetterà più di torcere un capello né a %a001250!\n@c0@"
  ja: "@a@b%a001240「お父さん　ボク\n\tすごく強くなって　お父さんと\n\t%a001250のこと　守ってあげるね！\n@c0@"
29:
  de: "@a%0%a001240@bDie Orte scheinen gar nicht mehr so weit auseinander zu liegen, wenn man viel unterwegs ist.\n@c0@"
  en: "@a%0%a001240@bTravelling so much makes places that seemed far away feel much closer.\n@c0@"
  es: "@a%0%a001240@bViajar tanto acerca sitios que parecían estar muy lejos.\n@c0@"
  fr: "@a%0%a001240@bEn voyageant autant, on a l'impression que les endroits qui paraissaient très loin avant sont beaucoup plus près.\n@c0@"
  it: "@a%0%a001240@bPensavo che il mondo fosse un posto grandissimo, e invece ora mi sembra tanto piccolo...\n@c0@"
  ja: "@a@b%a001240「ずーっと　旅をしてると\n\t最初は　とおいなって思った町も\n\tなんとなく　近く感じるんだ。\n@c0@"
30:
  de: "@a%0%a001240@bAber mit dem fliegenden Teppich oder dem Teleportationszauber ist ja sowieso kein Weg zu weit, nicht wahr?\n@c0@"
  en: "@a%0%a001240@bI mean, using the flying carpet or Zoom, nowhere's very far away, is it?\n@c0@"
  es: "@a%0%a001240@bPorque con la alfombra mágica o Telerregreso las distancias se acortan, ¿a que sí?\n@c0@"
  fr: "@a%0%a001240@bC'est vrai, quand on utilise le tapis volant ou\nle sort Téléportation, rien n'est très loin,\nfinalement, heinⓡ\n@c0@"
  it: "@a%0%a001240@bVoglio dire che usando il tappeto volante o lanciando ⓕTeletrasportoⓖ è possibile andare ovunque in un batter d'occhio! È una cosa fantastica!\n@c0@"
  ja: "@a@b%a001240「まほうのじゅうたんや\n\tルーラなら　ひとっとびだしね！\n@c0@"
31:
  de: "@a%0%a001250@bKann ich heute wieder neben dir laufen, Papa?\n@c0@"
  en: "@a%0%a001250@bCan I walk next to you again today, Dad?\n@c0@"
  es: "@a%0%a001250@b¿Puedo ir contigo hoy, papi?\n@c0@"
  fr: "@a%0%a001250@bEst-ce que je peux encore marcher à côté de toi\naujourd'hui, papaⓡ\n@c0@"
  it: "@a%0%a001250@bPapà, posso camminare accanto a te?\n@c0@"
  ja: "@a@b%a001250「お父さん　今日も\n\tいっしょに　歩こうね。\n@c0@"
32:
  de: "@a%0%a001250@bKusine Traudl hat gesagt, dass man dicke Knöchel bekommt, wenn man zu viel läuft.\n@c0@"
  en: "@a%0%a001250@bCousin Gertie said that if you walk too much, you get fat ankles.\n@c0@"
  es: "@a%0%a001250@bLa prima Frede dice que si caminas mucho te engordan los tobillos.\n@c0@"
  fr: "@a%0%a001250@bCousine Gégé a dit que quand on marchait trop,\nles chevilles grossissaient.\n@c0@"
  it: "@a%0%a001250@bLa cugina Gertrude dice che se cammini troppo ti vengono i polpacci grossi...\n@c0@"
  ja: "@a@b%a001250「ドリスお姉ちゃんがね……\n\tあんまり　歩いてばっかりだと\n\t足が　太くなるよって。\n@c0@"
33:
  de: "@a%0%a001250@bSind meine Knöchel dick, Papa?\nOder sind sie normal?\n@c0@"
  en: "@a%0%a001250@bAre my ankles fat?\nOr are they normal?\n@c0@"
  es: "@a%0%a001250@b¿Tengo gruesos los tobillos?\n¿O son normales?\n@c0@"
  fr: "@a%0%a001250@bEst-ce que j'ai des grosses chevilles ou est-ce qu'elles sont normalesⓡ\n@c0@"
  it: "@a%0%a001250@bHo già i polpacci grossi?\nOppure sono ancora normali?\n@c0@"
  ja: "@a@b%a001250「わたしの足　……ふとい？\n\t……　ふつう？\n@c0@"
34:
  de: "@aSancho@bWenn iss diss von hinten sehe, Chico, siehst du aus wie dein Padre. Du bist genauso stark, wie er es war.\n@c0@"
  en: "@aSancho@bWhen I esee you from behind, friend, you look\r\njust like your father. You are estrong like heem now.\n@c0@"
  es: "@aSancho@bCuando te veo desde atrás, chamaquito, eres nomás igual que tu padre. Te volviste retefuerte como él.\n@c0@"
  fr: "@aSancho@bQuand je t-te vois de d-derrière, chico,\r\ntu ressembles à t-ton père. Tu es aussi\r\nf-fort que lui, maintenant.\n@c0@"
  it: "@aSancho@bChico, visto da dietros sei identico a tuo padre Russel.\nTe guardo, y me pare de vedere lui...\n@c0@"
  ja: "@a@bサンチョ「坊っちゃんの　後ろ姿\n\tパパスさまに　似てきましたねえ。\n\tごりっぱに　なられました……。\n@c0@"
35:
  de: "@aSancho@bDieser Magmastab soll die gleisse Kraft haben wie ein Ausbruch eines Volcán!\n@c0@"
  en: "@aSancho@bThees magma estaff, I hear eet has the esame power like the eruption of the volcano!\n@c0@"
  es: "@aSancho@b¡He oído que ese báculo de magma nomás tiene el poder de un volcán en erupción!\n@c0@"
  fr: "@aSancho@bJ'ai entendu d-dire que ce b-bâton de lave\navait la même p-puissance que l'éruption\nd'oun v-v-volcanⓠ\n@c0@"
  it: "@aSancho@bHo sentito dire que el bastone de magma ha el mismo potere distruttivo de un vulcano...\n¡Babooom!\n@c0@"
  ja: "@a@bサンチョ「マグマの杖には\n\t火山の噴火と同じチカラがあると\n\t聞いたことがあります。\n@c0@"
36:
  de: "@aSancho@bWenn man weiß, wie man ihn verwendet, kann er ganze Montañas zerstören. Ganz schön unheimliss, no?\n@c0@"
  en: "@aSancho@bEef you know how you are using eet, you can destroy entire mountains even.\r\nEes escary, no?\n@c0@"
  es: "@aSancho@bSi sabes usarlo pues puedes destruir montañas enteras\n¡Da miedo!\n@c0@"
  fr: "@aSancho@bSi on sait c-comment l'utiliser, on p-peut même\ndétruire des montagnes entières.\nC'est effrayant, noⓡ\n@c0@"
  it: "@aSancho@b¡Si se sabe usarlo, se puede distruggere persinos una parete de roccias!\n¡Es una cosa impressionante!\n@c0@"
  ja: "@a@bサンチョ「使い方によっては\n\t山をも　くだくとか。\n\t……おそろしいですね。\n@c0@"
37:
  de: "@aOtto@bAll die Erfahrungen, die ich hier beim Reisen und Kämpfen sammle, werden mir zu Hause in Humburg sehr zugute kommen.\n@c0@"
  en: "@aTuppence@bAll this travelling and battle experience surely means promotion for me when I get back to Gotha.\n@c0@"
  es: "@aAlazar@bDespués de tantos viajes y batallas, seguro que me ascienden cuando regrese a Pankraz.\n@c0@"
  fr: "@aInnocent@bToute l'expérience que j'ai acquise au combat et en voyageant me vaudra sûrement une promotion quand je reviendrai à Gotha.\n@c0@"
  it: "@aSimon@bCon tutta l'esperienza che sto acquisendo in viaggio e in battaglia, sarà un gioco da ragazzi ottenere una promozione quando tornerò a Denim.\n@c0@"
  ja: "@a@bピピン「こうして　キャリアを積んで\n\tグランバニアへ帰れば\n\t出世　まちがいなしだ！\n@c0@"
38:
  de: "@aOtto@bHa ha! Das gute alte Leben!\n@c0@"
  en: "@aTuppence@bAh ha ha!\nIt's a tough old life!\n@c0@"
  es: "@aAlazar@b¡Ja, ja, ja!\n¡Es una vida dura!\n@c0@"
  fr: "@aInnocent@bHa ha haⓠ\nC'est pas facile, comme vieⓠ\n@c0@"
  it: "@aSimon@bChissà, magari mi faranno capitano...\n@c0@"
  ja: "@a@bピピン「ふふふっ　がんばるぞ！\n@c0@"
39:
  de: "@aOtto@bIch wette, dass Ihr in jedem zweiten Dorf eine Freundin sitzen habt, was? Oh! ... Tut mir leid, ich wollt' Euch net zu nahe treten, Eure Majestät!\n@c0@"
  en: "@aTuppence@bI bet you've got a few girlfriends hidden away in some of these towns and villages, eh?\r\nEr! I mean... Sorry, Your Majesty!\n@c0@"
  es: "@aAlazar@bSeguro que tenéis algunas novias escondidas por esos pueblos y aldeas, ¿eh?\nEr... Es decir... ¡Lo siento, Majestad!\n@c0@"
  fr: "@aInnocent@bJe parie que vous avez quelques petites amies cachées dans ces villes et villages, heinⓡ\nEuh... enfin... Pardon, Votre Majestéⓠ\n@c0@"
  it: "@aSimon@bMaestà, scommetto che lei ha una ragazza in ogni villaggio che ha visit...\n㈡\nEhm...\nEcco, intendevo che lei avrà sicuramente molti amici, in giro per il mondo...\n@c0@"
  ja: "@a@bピピン「%a000090さまって　行く先々の町に\n\tガールフレンドが　いるんですか？\n\t……いえっ　何でもないです！\n@c0@"
40:
  de: "@aOtto@bWenn man so gemeinsam durch die Lande zieht wie wir, muss man den anderen helfen und beistehen, net wahr?\n㈡\nIhr seid mir ein echter Freund geworden, %a000090.\n@c0@"
  en: "@aTuppence@bTravelling's all about helping each other out, and encouraging each other really, isn't it?\nI think of you as a true friend now, %a000090.\n@c0@"
  es: "@aAlazar@bEn realidad, viajar consiste en ayudarse y animarse unos a otros, ¿no?\nCreo que sois un verdadero amigo, %a000090.\n@c0@"
  fr: "@aInnocent@bVoyager, ça revient surtout à s'entraider et à s'encourager mutuellement, nonⓡ Je vous considère maintenant comme un véritable ami, %a000090.\n@c0@"
  it: "@aSimon@bViaggiare insieme vuol dire condividere ogni esperienza e aiutarsi quando ce n'è bisogno. Questo è ciò che sto imparando dalla nostra avventura...\n@c0@"
  ja: "@a@bピピン「ともに助け合い\n\tはげましあって　旅をする……。\n\t%a000090さまは　心の友です！\n@c0@"
41:
  de: "@a%0%a001240@bHm? Wo ist Dr. Ache hin? Er ist einfach verschwunden.\n@c0@"
  en: "@a%0%a001240@bHuh? Where did Dr Agon go?\nHe just disappeared.\n@c0@"
  es: "@a%0%a001240@b¿Eh? ¿Adónde ha ido el Dr. Agón?\nHa desaparecido.\n@c0@"
  fr: "@a%0%a001240@bHeinⓡ Où est parti le Dr Agonⓡ\nIl vient de disparaître.\n@c0@"
  it: "@a%0%a001240@bMa dov'è andato il Dottor Agon?!\nÈ sparito! Sembra quasi che sia volato via...\n@c0@"
  ja: "@a@b%a001240「あれ？　プサンさん\n\tいなくなっちゃったよ。\n\t……どこ　行っちゃったのかなあ。\n@c0@"
42:
  de: "@a%0%a001240@bIch dachte, dass alle Leute aus Zenithia echt gut drauf wären. Aber anscheinend ist das hier die Ausnahme, die die Regel bestätigt...\n@c0@"
  en: "@a%0%a001240@bI thought everyone from Zenithia was supposed to be really cool. Looks like there are always exceptions, though.\n@c0@"
  es: "@a%0%a001240@bCreía que todos los de Zenithia serían gente genial. Parece que siempre hay excepciones.\n@c0@"
  fr: "@a%0%a001240@bJe croyais que tous les gens de Zénithia étaient vraiment super. Il y a toujours des exceptions,\non dirait.\n@c0@"
  it: "@a%0%a001240@bPensavo che gli Zenithiani fossero tutti dei tipi tosti, ma evidentemente anche questa regola ha la sua eccezione...\n@c0@"
  ja: "@a@b%a001240「天空人って　もっと\n\tかっこよかったよね？\n\tうーん…　例外もいるのかな。\n@c0@"
43:
  de: "@a%0%a001240@bIch habe über dieses Zenithia-Schloss nachgedacht... Schlösser sind doch eigentlich richtig groß und schwer, oder?\n@c0@"
  en: "@a%0%a001240@bI've been thinking about this Zenithia castle thing... Castles are really big and heavy, aren't they?\n@c0@"
  es: "@a%0%a001240@bHe estado pensando en eso del castillo de Zenithia. Los castillos son muy grandes y pesados, ¿no?\n@c0@"
  fr: "@a%0%a001240@bJ'ai réfléchi à ce château de Zénithia...\nUn château, c'est très gros et très lourd, nonⓡ\n@c0@"
  it: "@a%0%a001240@bStavo pensando a quello che è successo al Castello di Zenithia...\nI castelli sono grandi e pesanti, no?\n@c0@"
  ja: "@a@b%a001240「天空のお城が\n\t地面に落ちたって言うけど\n\t……うーん。\n@c0@"
44:
  de: "@a%0%a001240@bNa, dann ist es doch ganz logisch, dass sie aus dem Himmel fallen...\n@c0@"
  en: "@a%0%a001240@bSo isn't it obvious that it would fall out of the sky?\n@c0@"
  es: "@a%0%a001240@bEntonces, ¿no es obvio por qué se cayó del cielo?\n@c0@"
  fr: "@a%0%a001240@bAlors c'était évident qu'il allait finir par tomber\ndu ciel, tu ne crois pasⓡ\n@c0@"
  it: "@a%0%a001240@bE allora perché la gente si meraviglia che il Castello di Zenithia è precipitato? C'era da stupirsi del fatto che galleggiava in cielo, non che sia caduto!\n@c0@"
  ja: "@a@b%a001240「お城みたいな\n\t大きくて　重たいものが\n\tホントに浮かんでたのかな？\n@c0@"
45:
  de: "@a%0%a001240@bSollten wir nicht nach Dr. Ache schauen? Vielleicht hat er sich verlaufen.\n@c0@"
  en: "@a%0%a001240@bShouldn't we look for Dr Agon, Dad?\nMaybe he's lost.\n@c0@"
  es: "@a%0%a001240@b¿No deberíamos buscar al Dr. Agón, papá?\nQuizá se haya perdido.\n@c0@"
  fr: "@a%0%a001240@bOn ne devrait pas chercher le Dr Agon, papaⓡ\nIl s'est peut-être perdu.\n@c0@"
  it: "@a%0%a001240@bPapà, perché non cerchiamo il Dottor Agon?\nSecondo me si è perso.\nQuel tipo non mi sembra molto sveglio, sai?\n@c0@"
  ja: "@a@b%a001240「お父さん　プサンさんを\n\tさがさなくていいの？\n\t迷子になってるかも知れないよ。\n@c0@"
46:
  de: "@a%0%a001250@bIrgendwie ist Dr. Ache ein wenig unheimlich. Findest du nicht auch, Papa?\n@c0@"
  en: "@a%0%a001250@bThere's something a bit scary about Dr Agon.\nDon't you think so, Dad?\n@c0@"
  es: "@a%0%a001250@bHay algo en el Dr. Agón que da miedo.\n¿No te parece, papá?\n@c0@"
  fr: "@a%0%a001250@bIl y a quelque chose d'un petit peu effrayant chez\nle Dr Agon. Tu ne trouves pas, papaⓡ\n@c0@"
  it: "@a%0%a001250@bPapà, non credi anche tu che il Dottor Agon sia un po' strano?\nNon so, quel tipo non la racconta giusta...\n@c0@"
  ja: "@a@b%a001250「プサンさんって\n\tなんだか　こわい……。\n\tお父さんも　そう感じない？\n@c0@"
47:
  de: "@a%0%a001250@bVielleicht wartet Dr. Ache in der großen Grube auf uns, wo all diese Minenwagen sind...\n@c0@"
  en: "@a%0%a001250@bMaybe Dr Agon's waiting for us in that Diggery Pokery place with all the mine carts...\n@c0@"
  es: "@a%0%a001250@bQuizá el Dr. Agón nos esté esperando en esa Cava Excava, con los vagones...\n@c0@"
  fr: "@a%0%a001250@bPeut-être que le Dr Agon nous attend dans la\nVieille mine, là où il y a tous les wagonnets...\n@c0@"
  it: "@a%0%a001250@bForse il Dottor Agon ci sta aspettando nell'Excavatorium, quel posto strano pieno di carrelli...\n@c0@"
  ja: "@a@b%a001250「プサンさん…\n\tもしかして　あのトロッコの洞くつで\n\t待ってるのかな……。\n@c0@"
48:
  de: "@aSancho@bEs ist schön, mit solch vielen Leuten unterwegs zu sein, no, Chico? Qué? Wo ist Señor Ache?\n@c0@"
  en: "@aSancho@bEes fun travelling weeth eso many people, eh, friend? Qué? Where ees señor Agon?\n@c0@"
  es: "@aSancho@bEstá padre viajar con tanta gente, ¿eh, chamaco?\n¡Ándale! ¿Dónde se metió el señor Agón?\n@c0@"
  fr: "@aSancho@bC'est amusant de v-voyager avec autant de\nm-monde, hein, chicoⓡ\nQuéⓡ Où est le s-señor Agonⓡ\n@c0@"
  it: "@aSancho@bViaggiare en compagnia es divertentes, chico.\n¿A propositos, donde está el Dottor Agon?\n@c0@"
  ja: "@a@bサンチョ「道づれが多いほど\n\t旅は　楽しいものですよ。\n\tところで　そのプサンさんは　どこへ？\n@c0@"
49:
  de: "@aSancho@bDas alles ist so kompliziert, nisst wahr, Chico? Zenithia, die Treppe, das Castillo... Man muss über so vieles nachdenken.\n@c0@"
  en: "@aSancho@bEes become complicated, sí, friend?\r\nZenithia, thees estairway, thees castle...\r\nEes eso much to theenk about.\n@c0@"
  es: "@aSancho@bEstá retedifícil, ¿eh, chamaquito?\nZenithia, la escalera, el castillo...\nEs mucho en lo que pensar.\n@c0@"
  fr: "@aSancho@bÇa se c-complique, hein, chicoⓡ\nZénithia, ces marches, ce château...\nÇa fait beaucoup de choses auxquelles p-penser.\n@c0@"
  it: "@aSancho@bLa situazione se está complicando, chico.\nZenithia, las escalas, el castillo... Ce sono muchas cosas que dobbiamo tenere en considerazione.\n@c0@"
  ja: "@a@bサンチョ「天空の塔に　天空の城ですか。\n\tずいぶん　話が大きくなって\n\tきましたねえ。　うーむ……。\n@c0@"
50:
  de: "@aSancho@bDer arme Señor Ache... ganz alleine und das zwanzig Jahre lang!\n@c0@"
  en: "@aSancho@bThees poor señor Agon, he ees all alone for\r\ntwenty years!\n@c0@"
  es: "@aSancho@b¡Ese pobre señor Agón, solitito veinte años...!\n@c0@"
  fr: "@aSancho@bCe p-pauvre señor Agon... tout seul p-pendant\nvingt ansⓠ\n@c0@"
  it: "@aSancho@b¡El povero señor Agon es estato todo solo por venti años! ¡Venti años!\nMe sembra incredibiles...\n@c0@"
  ja: "@a@bサンチョ「２０年間も　ずっと\n\tひとりぼっちだったなんて……。\n@c0@"
51:
  de: "@aSancho@bEs muss wirkliss schlimm für ihn gewesen sein! (Schluchz)\n@c0@"
  en: "@aSancho@bEet, eet must be eso hard for heem!\n(sob)\n@c0@"
  es: "@aSancho@b¡Debió de ser bien complicado para él!\n(snif)\n@c0@"
  fr: "@aSancho@bÇa... Ça a dû être si dur p-pour luiⓠ (sanglot)\n@c0@"
  it: "@aSancho@bDev'essere estata una experiencia terribile por quel poverino...\nYo... Yo me commuovos... ¡Sob!\n@c0@"
  ja: "@a@bサンチョ「プサンさん　さぞや\n\tつらかったでしょうね。　うっうっ。\n@c0@"
52:
  de: "@aOtto@bEr ist ein wenig seltsam, dieser Dr. Ache, net wahr? Ist einfach so verschwunden, als wir aus der Höhle kamen.\n@c0@"
  en: "@aTuppence@bHe's a bit of a mystery, that Dr Agon fellow, isn't he? He just disappeared once we got out of the cave.\n@c0@"
  es: "@aAlazar@bEse Dr. Agón es un poco misterioso, ¿no?\nDesapareció en cuanto salimos de la cueva.\n@c0@"
  fr: "@aInnocent@bIl est un peu énigmatique, ce Dr Agon, nonⓡ\nIl a disparu dès que nous sommes sortis de la grotte.\n@c0@"
  it: "@aSimon@bQuel Dottor Agon è un tipo un po' sospetto...\nNon appena siamo usciti dalla grotta, è svanito come fumo nel vento!\n@c0@"
  ja: "@a@bピピン「それにしても　プサンさんって\n\tどういう人なんでしょうねえ。\n\t洞くつを出たら　いなくなるなんて。\n@c0@"
53:
  de: "@aOtto@bZenithia, was? Hört sich an wie Ort voller schöner junger Frauen!\n@c0@"
  en: "@aTuppence@bZenithia, eh? Sounds like the sort of place that would be full of beautiful young maidens!\n@c0@"
  es: "@aAlazar@bZenithia, ¿eh? ¡A mí me suena a sitio lleno de jóvenes y hermosas doncellas!\n@c0@"
  fr: "@aInnocent@bZénithia, heinⓡ Ça sonne comme un endroit où\nil y aurait plein de belles jeunes fillesⓠ\n@c0@"
  it: "@aSimon@bZenithia... Non so perché, ma credo che in quel luogo mitico vivano tante belle fanciull... Ehm, in quel luogo vivranno senz'altro donne intelligenti e sensibili.\n@c0@"
  ja: "@a@bピピン「天空城か……。\n\tきっと　ものすごい美女が\n\t暮らしてるんだろうな。\n@c0@"
54:
  de: "@a%0%a001240@bIch frage mich, an was für einem Ort die Feen leben. Weißt du das, Papa?\n@c0@"
  en: "@a%0%a001240@bI wonder what sort of place the faeries live in.\nDo you know, Dad?\n@c0@"
  es: "@a%0%a001240@bMe pregunto en qué clase de sitio viven las hadas.\n¿Tú lo sabes, papá?\n@c0@"
  fr: "@a%0%a001240@bJe me demande dans quel genre d'endroit vivent les fées. Tu le sais, toi, papaⓡ\n@c0@"
  it: "@a%0%a001240@bPapà, ma dove vivono le fate?\n@c0@"
  ja: "@a@b%a001240「妖精って　どこに\n\t住んでるんだろ？\n\tお父さん　知ってる？\n@c0@"
55:
  de: "@a%0%a001240@bWas? Im Keller des Hauses, in dem du gewohnt hast? Nie im Leben! Du willst mich nur veräppeln!\n@c0@"
  en: "@a%0%a001240@bWhat? In the cellar in your house before?\nNo way! I'm not falling for that!\n@c0@"
  es: "@a%0%a001240@b¿Qué? ¿En el sótano de tu antigua casa?\n¡Ni hablar! ¡No me lo trago!\n@c0@"
  fr: "@a%0%a001240@bCommentⓡ Dans la cave de ton ancienne maisonⓡ\nPfffⓠ Tu ne penses pas que je vais croire çaⓡⓐ\n@c0@"
  it: "@a%0%a001240@bChe cosa?!\nNella cantina della tua vecchia casa?!\nMa perché mi prendi in giro, eh?!\n@c0@"
  ja: "@a@b%a001240「……えっ！？\n\t家の　地下室にいるの？\n\tうっそだーっ。\n@c0@"
56:
  de: "@a%0%a001240@bDie Feen aus den Märchen haben Flügel. Und sie spielen ständig Streiche.\n@c0@"
  en: "@a%0%a001240@bFaeries in story books have wings. And they always like playing tricks on people too.\n@c0@"
  es: "@a%0%a001240@bLas hadas de los cuentos tienen alas. Y siempre están engañando a la gente.\n@c0@"
  fr: "@a%0%a001240@bDans les livres de contes, les fées ont des ailes.\nEt elles adorent jouer des tours aux gens, aussi.\n@c0@"
  it: "@a%0%a001240@bLe fate delle fiabe hanno le ali e fanno tanti scherzetti alle persone.\n@c0@"
  ja: "@a@b%a001240「絵本の中の妖精は\n\t羽が　はえてて　イタズラ好き\n\tっていうのが多いけど……\n@c0@"
57:
  de: "@a%0%a001240@bOb sie auch im wirklichen Leben so sind?\n@c0@"
  en: "@a%0%a001240@bI wonder if they're really like that...\n@c0@"
  es: "@a%0%a001240@b¿Serán así de verdad?\n@c0@"
  fr: "@a%0%a001240@bJe me demande si elles sont vraiment comme ça...\n@c0@"
  it: "@a%0%a001240@bChissà se sono davvero così...\n@c0@"
  ja: "@a@b%a001240「本物の妖精も\n\tそうなのかな？\n@c0@"
58:
  de: "@a%0%a001250@bDie Burg von Humburg wird doch nicht auch in einem See versinken, oder?\n@c0@"
  en: "@a%0%a001250@bGotha Castle's not going to sink to the bottom of a lake too, is it?\n@c0@"
  es: "@a%0%a001250@bEl castillo de Pankraz no irá a hundirse en el fondo de un lago, ¿no?\n@c0@"
  fr: "@a%0%a001250@bLe château de Gotha ne va pas plonger au fond\nd'un lac, lui aussi, heinⓡ\n@c0@"
  it: "@a%0%a001250@bNon è che anche il Castello di Denim finirà in fondo a un lago, vero?\n@c0@"
  ja: "@a@b%a001250「グランバニアは　大丈夫よね。\n\t湖に　沈んだりしないよね？\n@c0@"
59:
  de: "@a%0%a001250@bWerden wir auch ein paar Feen treffen? Das fände ich großartig!\n@c0@"
  en: "@a%0%a001250@bAre we going to meet faeries?\nI'd love it if we really did!\n@c0@"
  es: "@a%0%a001250@b¿Vamos a conocer hadas?\n¡Me encantaría!\n@c0@"
  fr: "@a%0%a001250@bEst-ce qu'on va rencontrer des féesⓡ\nJ'adorerais en voir en vraiⓠ\n@c0@"
  it: "@a%0%a001250@bHo voglia di incontrare una fata!\nSono curiosa di scoprire se hanno davvero le ali!\n@c0@"
  ja: "@a@b%a001250「妖精さんに　会いにいくの？\n\t会えたら　うれしいな……。\n@c0@"
60:
  de: "@a%0%a001250@bDa war doch diese Nonne in der Abtei... Hat die nicht was von Feen gesagt?\n@c0@"
  en: "@a%0%a001250@bActually, wasn't there a nun at the abbey who was talking about faeries?\n@c0@"
  es: "@a%0%a001250@b¡Eh!, ¿no había una monja en la abadía que hablaba de las hadas?\n@c0@"
  fr: "@a%0%a001250@bAu fait, il n'y a pas une religieuse qui a parlé des fées, à l'abbayeⓡ\n@c0@"
  it: "@a%0%a001250@bSe non sbaglio, all'abbazia c'è una suora che dice che le fate non esistono...\nDico bene?\n@c0@"
  ja: "@a@b%a001250「そういえば\n\t修道院のシスターさんが\n\t妖精の村の　お話ししてたっけ。\n@c0@"
61:
  de: "@aSancho@bDein Onkel Sancho glaubt ja nisst an dieses Reich der Feen. Das ist doch alles nur Aberglaube, no? Das gibt es doch gar nisst...\n@c0@"
  en: "@aSancho@bYour Uncle Sancho, he no believe een thees\r\nRealm of the Faeries. Ees a joke, sí?\r\nEes no eserious.\n@c0@"
  es: "@aSancho@bEl tito Sancho pues no cree en ese Reino de las Hadas. Es una broma, ¿no?\nCotorreos.\n@c0@"
  fr: "@aSancho@bTon tonton Sancho ne c-croit pas à ce r-royaume des Fées. C'est oune blague, noⓡ\nÇa n'est pas sérieux.\n@c0@"
  it: "@aSancho@bLo zio Sancho piensa que el Regno de las Fatas no esiste. Segundo me es solo una favola por far addormentare los niños... \n@c0@"
  ja: "@a@bサンチョ「しかし　妖精の村とは\n\tどうも信じられませんねえ。\n\tだまされているのでは……？\n@c0@"
62:
  de: "@aSancho@bIss glaube ja nisst daran, aber wir versuchen doch trotzdem, dieses Feenaue zu finden, oder, Chico?\n@c0@"
  en: "@aSancho@bI no theenk ees gonna happen, but we try to find thees Fearie Lea place, sí?\n@c0@"
  es: "@aSancho@bNo ocurrirá, pero nomás buscamos esa Hadavilla, ¿no?\n@c0@"
  fr: "@aSancho@bJe ne c-crois pas qu'on y arrivera, mais on va essayer de t-trouver cet endroit, Féeria, siⓡ\n@c0@"
  it: "@aSancho@bYo pienso que esta Domus Fatae non la troveremo mai, ma possiamo comunque provare a cercarla...\n@c0@"
  ja: "@a@bサンチョ「う～む…　どうも\n\tピンとこないんですが　とりあえず\n\t妖精の村というのを　めざしましょう。\n@c0@"
63:
  de: "@aOtto@bFeen, ja? Das sind bestimmt süße kleine Dinger.\n@c0@"
  en: "@aTuppence@bFaeries, eh? I bet they're pretty little things.\n@c0@"
  es: "@aAlazar@bHadas, ¿eh? Seguro que son muy pequeñas y monas.\n@c0@"
  fr: "@aInnocent@bDes fées, heinⓡ Je parie qu'elles sont très mignonnes.\n@c0@"
  it: "@aSimon@bFate, eh?\nScommetto che sono delle creaturine dolci e gentili.\nAmmesso e non concesso che esistano, sia chiaro.\n@c0@"
  ja: "@a@bピピン「妖精かあ……。\n\tかわいいんだろうなあ。\n@c0@"
64:
  de: "@aOtto@bMeine Mutter hat immer g'sagt, dass Feen an Orten leben, wo die Luft rein ist und net viele Menschen sind.\n@c0@"
  en: "@aTuppence@bMy mother always used to say that faeries live\r\nin places where the air is clear and there aren't many people.\n@c0@"
  es: "@aAlazar@bMi madre me decía que las hadas viven en sitios donde el aire es limpio y no hay mucha gente.\n@c0@"
  fr: "@aInnocent@bMa mère disait toujours que les fées vivent\r\ndans des lieux où l'air est pur et où il n'y a\r\npas beaucoup de monde.\n@c0@"
  it: "@aSimon@bDa piccolo mia madre mi diceva che le fate non amano farsi vedere dagli uomini. Vivono in un mondo fantastico dove l'aria ha il profumo dei fiori.\n@c0@"
  ja: "@a@bピピン「妖精は　空気がきれいで\n\t人のあまりいない場所にいると\n\t子供の頃　母がよく言っていたっけ。\n@c0@"
65:
  de: "@a%0%a001240@bPapa! Darf ich gleich mal ins Elfenhorn blasen?\n@c0@"
  en: "@a%0%a001240@bDad! Will you let me blow the faerie horn later?\n@c0@"
  es: "@a%0%a001240@b¡Papi! ¿Luego me dejas hacer sonar el cuerno de las hadas?\n@c0@"
  fr: "@a%0%a001240@bPapaⓠ Tu me laisseras sonner la corne des fées,\nplus tardⓡ\n@c0@"
  it: "@a%0%a001240@bPapà, dopo mi lasceresti suonare il corno fatato?\n@c0@"
  ja: "@a@b%a001240「お父さん！　ねえ！\n\t妖精のホルン　あとで\n\tボクにも　吹かせてねっ。\n@c0@"
66:
  de: "@a%0%a001240@bDu warst einmal mit einer Fee befreundet, stimmt's, Papa? Meinst du, ich werde auch mal eine Feen-Freundin haben?\n@c0@"
  en: "@a%0%a001240@bYou made friends with a faerie once, didn't you, Dad? I wonder if I'll make any faerie friends...\n@c0@"
  es: "@a%0%a001240@bUna vez te hiciste amigo de un hada, ¿no, papá? Me preguntó si yo seré amigo de alguna...\n@c0@"
  fr: "@a%0%a001240@bTu es déjà devenu ami avec une fée, hein, papaⓡ\nJe me demande si je vais me faire des amies fées,\nmoi aussi...\n@c0@"
  it: "@a%0%a001240@bPapà, ma è vero che sei diventato amico di una fata? Anche a me piacerebbe tanto fare amicizia con una di loro, sai?\n@c0@"
  ja: "@a@b%a001240「お父さんって\n\t妖精に　友だちがいたんだね。\n\tボクも　友だち　つくれるかな？\n@c0@"
67:
  de: "@a%0%a001240@bKönnen wir bald wieder nach Feenaue und dort spielen, Papa? Bitte, bitte!\n@c0@"
  en: "@a%0%a001240@bCan we go and play in Faerie Lea as often as we want? Can we, Dad? Can we?\n@c0@"
  es: "@a%0%a001240@b¿Podemos ir a jugar a Hadavilla cuando queramos? ¿Podemos, papá? ¿Podemos?\n@c0@"
  fr: "@a%0%a001240@bEst-ce qu'on pourra aller jouer à Féeria aussi souvent qu'on voudraⓡ Hein, dis, papaⓡ\nOn pourraⓡ\n@c0@"
  it: "@a%0%a001240@bPapà, qualche volta mi porti a giocare a Domus Fatae?\nDai, papà! Mi porti?\nQuel posto è troppo forte!\n@c0@"
  ja: "@a@b%a001240「今度は　ボクたちだけで\n\t妖精の村に　遊びに行きたい！\n\tねっ　いいでしょ？\n@c0@"
68:
  de: "@a%0%a001250@bDas Elfenhorn ist wunderschön. Glaubst du, ich könnte auch so hübsche Dinge machen, wenn ich eine Fee wäre?\n@c0@"
  en: "@a%0%a001250@bThe faerie horn's so pretty. Do you think if I became a faerie, I could make things like that too?\n@c0@"
  es: "@a%0%a001250@bEl cuerno de las hadas es muy bonito. ¿Crees que si me convirtiera en hada podría hacer cosas así?\n@c0@"
  fr: "@a%0%a001250@bLa corne des fées est tellement jolie... Tu crois que\nsi je devenais une fée, je pourrais fabriquer des objets comme ça, moi aussiⓡ\n@c0@"
  it: "@a%0%a001250@bIl corno fatato è meraviglioso.\nForse, se diventassi una fata, anch'io imparerei a realizzare oggetti tanto belli...\n@c0@"
  ja: "@a@b%a001250「妖精のホルンって　きれいね。\n\tわたしも　妖精になったら\n\tこういうの　つくれるのかな？\n@c0@"
69:
  de: "@a%0%a001250@bWir sind auf der Suche nach dem Feenschloss, oder? Hm, ein See, der von Bergen umgeben ist... wo könnte das nur sein?\n@c0@"
  en: "@a%0%a001250@bWe're looking for the Faerie Palace, aren't we?\nWhere's a lake that's surrounded by mountains,\nI wonder.\n@c0@"
  es: "@a%0%a001250@bBuscamos el Palacio de las Hadas, ¿no?\n¿Dónde habrá un lago rodeado de montañas?\n@c0@"
  fr: "@a%0%a001250@bOn cherche le palais des Fées, c'est çaⓡ\nJe me demande où il peut y avoir un lac\nentouré de montagnes.\n@c0@"
  it: "@a%0%a001250@bLa nostra destinazione è la Reggia Fatata, dico bene? Allora dobbiamo cercare un lago circondato dalle montagne...\n@c0@"
  ja: "@a@b%a001250「妖精さんのお城\n\tさがさないと…\n\t山にかこまれた湖って　どこ？\n@c0@"
70:
  de: "@aSancho@bIss wollte es ja nisst glauben, aber diese Feen sind wirkliss echt!\n@c0@"
  en: "@aSancho@bI no believe eet, but these faeries,\r\nthey are real!\n@c0@"
  es: "@aSancho@b¡Ándale, resulta que las hadas sí existían! ¡Qué chido!\n@c0@"
  fr: "@aSancho@bJe n'arrive p-pas à y c-croire, mais ces fées sont bien r-réellesⓠ\n@c0@"
  it: "@aSancho@b¡Yo no ce credevo, ma pare que las fatas esistano davveros!\n¡Ay, que cosa maravillosa!\n@c0@"
  ja: "@a@bサンチョ「ふむ。　妖精というのは\n\t本当に　いるんですねえ……。\n@c0@"
71:
  de: "@aSancho@bWenn iss so zurückdenke, erinnere iss miss, dass du als Niño oft im Keller gespielt hast. Und iss glaube, du warst nisst allein!\n@c0@"
  en: "@aSancho@bNow when I am theenking back, I remember you are eso often playing een the cellar. And I theenk you are on your own!\n@c0@"
  es: "@aSancho@bAhora que lo pienso jugabas mucho en el sótano... ¡Y yo que creía que estabas solo!\n@c0@"
  fr: "@aSancho@bM-Maintenant que j'y repense, je me s-souviens\nque tu jouais très s-souvent à la cave. Et moi qui\nc-c-croyais que tu jouais tout seulⓠ\n@c0@"
  it: "@aSancho@bOra que ce pienso, da piccolo escendevi espessos en cantina, y ero seguro que tu estava da solo...\n@c0@"
  ja: "@a@bサンチョ「そういえば　坊っちゃんは\n\t子供の頃　よく\n\t地下室で遊んでましたっけ。\n@c0@"
72:
  de: "@aSancho@bHättest du mir das nur früher gesagt, Chico, dann wäre iss mit dir gekommen!\n@c0@"
  en: "@aSancho@bEef only you esay to me then, friend, your Uncle\r Sancho, he come weeth you!\n@c0@"
  es: "@aSancho@b¡Si me lo hubieras dicho, el tito Sancho hubiera ido con su chamaquito!\n@c0@"
  fr: "@aSancho@bSi seulement tu me l'avais dit à l'époque, chico,\nton t-tonton Sancho serait v-venu avec toiⓠ\n@c0@"
  it: "@aSancho@bYo no capivo por qué passavi tanto tiempo laggiù inveces de giocare con los altros niños.\nMe pareva una cosa estrana...\n@c0@"
  ja: "@a@bサンチョ「まさか　あの時にねえ。\n\t言ってくれれば\n\t私も　お供しましたのに！\n@c0@"
73:
  de: "@aOtto@bSind diese Feen net fabelhaft? Einfach unglaublich.\n@c0@"
  en: "@aTuppence@bAren't faeries just wonderful?\nI think they're amazing.\n@c0@"
  es: "@aAlazar@b¿No son maravillosas las hadas?\nMe parecen asombrosas.\n@c0@"
  fr: "@aInnocent@bLes fées ne sont-elle pas merveilleusesⓡ\nMoi, je les trouve incroyables.\n@c0@"
  it: "@aSimon@bChe belle le fate!\nSono delle creature davvero meravigliose!\n@c0@"
  ja: "@a@bピピン「妖精って　いいですねえ……。\n@c0@"
74:
  de: "@aOtto@bEigentlich ist es doch langweilig, wenn man seine Frau dort kennenlernt, wo man aufg'wachsen ist.\n@c0@"
  en: "@aTuppence@bIt's rather lazy just settling for a mate from the place you grew up in.\n@c0@"
  es: "@aAlazar@bParece un poco cómodo buscarse una pareja del sitio donde creciste.\n@c0@"
  fr: "@aInnocent@bC'est assez paresseux de se contenter de chercher une compagne à l'endroit où l'on a grandi.\n@c0@"
  it: "@aSimon@bNon sono d'accordo con il proverbio ⓕmogli e buoi dei paesi tuoiⓖ. Perché dovrei cercare la mia compagna di vita solo nel posto in cui sono nato?\n@c0@"
  ja: "@a@bピピン「同じ城の中で\n\tてきとうに　相手をみつくろうのは\n\t手ぬきだと思うんですよ。\n@c0@"
75:
  de: "@aOtto@bNein, ich bereise die Welt und werde eine junge, schöne ⓚⓛ und natürlich nette ⓚⓛ Frau kennen und lieben lernen. Das ist viel romantischer.\n@c0@"
  en: "@aTuppence@bNo, you've got to travel the world and find a beautiful, young ⓚⓛ and kind, of course ⓚⓛ woman to fall in love with. That's the romantic way.\n@c0@"
  es: "@aAlazar@bNo, hay que recorrer el mundo y encontrar una joven hermosa (y gentil, claro) de la que enamorarse. Eso sí que es romántico.\n@c0@"
  fr: "@aInnocent@bNon, il faut voyager à travers le monde et trouver une jeune, belle, et bien sûr gentille, femme de qui tomber amoureux. Ça, c'est romantique.\n@c0@"
  it: "@aSimon@bE se la mia anima gemella vivesse all'altro capo del mondo? No, no... Preferisco viaggiare e ampliare i confini della mia ricerca per la compagna perfetta!\n@c0@"
  ja: "@a@bピピン「やっぱり　旅の中で\n\t美しく　やさしい人を見つける！\n\tこれぞロマンですっ。\n@c0@"
76:
  de: "@aOtto@bWie sehe ich eigentlich im Profil aus? Wenn ich mich so hinstelle... und dann so lächle...\nUnd? Ja! Ich finde mich unwiderstehlich!\n@c0@"
  en: "@aTuppence@bHow do I look from this angle?\nI strike a pose like this...and smile like this...\nWell? I think I look irresistible!\n@c0@"
  es: "@aAlazar@b¿Qué pinta tengo desde este ángulo?\nSi me pongo así... y sonrío asá...\n¿Y bien? ¡Creo que soy irresistible!\n@c0@"
  fr: "@aInnocent@bComment je suis sous cet angleⓡ Je prends la pose, comme ça... Et je souris, comme ça... Alorsⓡ\nMoi, je me trouve irrésistibleⓠ\n@c0@"
  it: "@aSimon@bSto bene in questa posizione? È meglio se sorrido o dovrei assumere un'espressione più seria? Ah, non importa! Tanto sono sempre un gran bel fusto!\n@c0@"
  ja: "@a@bピピン「この角度　どうですか？\n\tこう立って　こう笑うんです。\n\t自信あるんですけど。\n@c0@"
77:
  de: "@a%0%a001240@bWarum soll diese Kugel denn nicht gut sein? Sie glänzt doch so schön!\n@c0@"
  en: "@a%0%a001240@bWhy isn't this gold bauble any good?\nIt's really shiny!\n@c0@"
  es: "@a%0%a001240@b¿Por qué no funciona esta esfera dorada?\n¡Brilla mucho!\n@c0@"
  fr: "@a%0%a001240@bPourquoi cette boule dorée ne sert à rienⓡ\nElle est vraiment brillante, pourtantⓠ\n@c0@"
  it: "@a%0%a001240@bPerché questa sfera dorata non funziona?!\nEppure è così bella!\n@c0@"
  ja: "@a@b%a001240「……どうして\n\tこのオーブじゃダメなんだろ。\n\tきれいな金色なのになあ。\n@c0@"
78:
  de: "@a%0%a001240@bOh, nein. Die Feenherrin kann keine Goldkugel für uns anfertigen.\n@c0@"
  en: "@a%0%a001240@bOh, no. The Faerie Queen can't make a\ngold orb for us.\n@c0@"
  es: "@a%0%a001240@b¡Oh, no! La Reina de las Hadas no puede hacernos un orbe de oro.\n@c0@"
  fr: "@a%0%a001240@bOh, non. La reine des fées ne peut pas nous fabriquer d'orbe d'or.\n@c0@"
  it: "@a%0%a001240@bLe fate non possono realizzare altri globi d'oro...\nChe peccato...\n@c0@"
  ja: "@a@b%a001240「妖精の女王さまも\n\tゴールドオーブは\n\t作れないなんて……。\n@c0@"
79:
  de: "@a%0%a001240@bDr. Ache wird sehr traurig sein. Was sollen wir nur tun, Papa?\n@c0@"
  en: "@a%0%a001240@bDr Agon will be really upset.\nWhat are we going to do, Dad?\n@c0@"
  es: "@a%0%a001240@bEl Dr. Agón se va a disgustar.\n¿Qué vamos a hacer, papá?\n@c0@"
  fr: "@a%0%a001240@bLe Dr Agon va vraiment être embêté.\nQu'est-ce qu'on va faire, papaⓡ\n@c0@"
  it: "@a%0%a001240@bIl Dottor Agon ci resterà malissimo!\nChe facciamo adesso, papà?\n@c0@"
  ja: "@a@b%a001240「プサンさん　きっと\n\tがっかりするね。\n\tどうしよう　お父さん？\n@c0@"
80:
  de: "@a%0%a001240@bDen Lauf der Zeit ändern? Was soll das bedeuten?\n@c0@"
  en: "@a%0%a001240@bChanging the course of time?\nWhat does that mean?\n@c0@"
  es: "@a%0%a001240@b¿Cambiar el curso del tiempo?\n¿Qué significa eso?\n@c0@"
  fr: "@a%0%a001240@bModifier l'écoulement du tempsⓡ\nQu'est-ce que ça veut direⓡ\n@c0@"
  it: "@a%0%a001240@bCambiare il corso del tempo?!\nE che vuol dire?!\n@c0@"
  ja: "@a@b%a001240「時の流れを変える……って\n\tどういうことなの？\n@c0@"
81:
  de: "@a%0%a001240@bMan kann doch nicht etwas ändern, das schon geschehen ist... oder?\n@c0@"
  en: "@a%0%a001240@bYou can't change what's already\nhappened...can you?\n@c0@"
  es: "@a%0%a001240@bNo se puede cambiar lo que ya ha sucedido, ¿no?\n@c0@"
  fr: "@a%0%a001240@bOn ne peut pas changer ce qui est déjà arrivé... siⓡ\n@c0@"
  it: "@a%0%a001240@bNon si può mica modificare quello che è già successo, no?\nDico bene?\n@c0@"
  ja: "@a@b%a001240「これまで　あった事を\n\t変えちゃうの？\n\t……そんなの　ムリだよっ。\n@c0@"
82:
  de: "@a%0%a001250@bIch weiß, dass du eine Lösung finden wirst, Papa. Du weißt immer, wie es weitergeht. Du bist fantastisch!\n@c0@"
  en: "@a%0%a001250@bI know you'll find a way out of this, Dad. Just when it looks impossible, you'll think of something.\nYou always do.\n@c0@"
  es: "@a%0%a001250@bSé que encontrarás el modo de salir de esta, papá. Cuando todo parezca imposible se te ocurrirá algo.\nComo siempre.\n@c0@"
  fr: "@a%0%a001250@bJe sais que tu trouveras une solution, papa.\nMême si ça a l'air infaisable, tu auras une idée.\nÇa se passe toujours comme ça.\n@c0@"
  it: "@a%0%a001250@bPapà, lo so che la situazione sembra drammatica, ma sono certa che troverai una soluzione.\nCi riesci sempre! Eh eh eh!\n@c0@"
  ja: "@a@b%a001250「もうダメって思っても\n\tきっと　出口を見つけられると思うの。\n\tだって　お父さん　すごいんだもん。\n@c0@"
83:
  de: "@a%0%a001250@bWenn wir diese vergoldete Kugel nur in eine Goldkugel verwandeln könnten... Aber das ist wohl unmöglich, nicht wahr?\n@c0@"
  en: "@a%0%a001250@bIf only we could just turn this gold bauble into a gold orb... But I suppose that's impossible, isn't it?\n@c0@"
  es: "@a%0%a001250@bSi pudiera convertir esta esfera dorada en un orbe de oro... Pero supongo que es imposible, ¿no?\n@c0@"
  fr: "@a%0%a001250@bSi seulement on pouvait simplement transformer\ncette boule dorée en orbe d'or... Mais j'imagine\nque c'est impossible, heinⓡ\n@c0@"
  it: "@a%0%a001250@bDovremmo trovare la maniera di trasformare questa sfera dorata in un globo d'oro.\nUhm... Come potremmo fare?\n@c0@"
  ja: "@a@b%a001250「この光るオーブを\n\tゴールドオーブに　かえられると\n\tいいのに…。　ムリよね　そんなこと。\n@c0@"
84:
  de: "@a%0%a001250@bIch denke nach...\nEs muss doch einen Weg geben...\n@c0@"
  en: "@a%0%a001250@bOkay... I'm thinking...\nThere's got to be a way somehow...\n@c0@"
  es: "@a%0%a001250@bVale... Estaba pensando...\nTiene que haber algún modo.\n@c0@"
  fr: "@a%0%a001250@bBon... Je suis en train de réfléchir...\nIl doit bien y avoir un moyen...\n@c0@"
  it: "@a%0%a001250@bDev'esserci un modo...\nSolo che non mi viene in mente!\n@c0@"
  ja: "@a@b%a001250「うん……\n\tわたし　考えてます。\n\tがんばります。\n@c0@"
85:
  de: "@aSancho@bWeißt du, wie oft dein Onkel Sancho siss schon gewünscht hat, die Vergangenheit rückgängig zu machen? Si... Viele, viele Male...\n@c0@"
  en: "@aSancho@bYou know how many times your Uncle Sancho, he weeshes he can change the past?\r\nSí... Many, many times...\n@c0@"
  es: "@aSancho@b¿Sabes cuántas veces el tito Sancho quiso cambiar el pasado?\nÁndale. Muchas, muchas veces.\n@c0@"
  fr: "@aSancho@bSi tu s-savais combien de f-fois tonton Sancho\r\na eu envie de changer le p-passé...\r\nSi, beaucoup, beaucoup de fois...\n@c0@"
  it: "@aSancho@bAllo zio Sancho piacerebbe tornare indietros y cambiare el passato...\nSì, ce sono muchas cosas que no rifarei.\n@c0@"
  ja: "@a@bサンチョ「過去を　変えられればって\n\t私も　何度も思いましたよ。\n\t……ええ　そりゃあ何度も。\n@c0@"
86:
  de: "@aSancho@bSie sieht zwar so aus, aber diese Kugel ist keine risstige Goldkugel, no?\n@c0@"
  en: "@aSancho@bEes looking the esame, but thees gold bauble, ees no use, eh?\n@c0@"
  es: "@aSancho@bParece lo mismo nomás, pero esta esfera dorada es inútil, ¿eh?\n@c0@"
  fr: "@aSancho@bÇa ressemble b-beaucoup, mais cette b-boule dorée ne sert à rien, heinⓡ\n@c0@"
  it: "@aSancho@bLa sfera dorata es muy simile al globo de oro, ma no tiene las mismas caracteristicas.\n@c0@"
  ja: "@a@bサンチョ「見た目だけ　同じでも\n\t役に立たないもんですかねえ。\n\tうーむっ。\n@c0@"
87:
  de: "@aOtto@bVielleicht sollten wir Königin Karamella einfach noch mal fragen...\n@c0@"
  en: "@aTuppence@bMaybe we should try asking Queen Caramel again?\n@c0@"
  es: "@aAlazar@b¿Y si le preguntamos otra vez a la reina Chocolate?\n@c0@"
  fr: "@aInnocent@bPeut-être qu'on devrait essayer de redemander\nà la reine Caramielⓡ\n@c0@"
  it: "@aSimon@bE se provassimo a tornare dalla regina Caramel?\nCredo che dovremmo insistere un po' con lei.\n@c0@"
  ja: "@a@bピピン「妖精の女王さまに\n\tもういっぺん　たのめば\n\tうまくいくかも　しれないですよ。\n@c0@"
88:
  de: "@aOtto@bEs gibt viele Leute, die mal etwas Großartiges erschaffen haben und dann meinen, sie könnten es net mehr.\n㈡\nUnd schlussendlich schaffen sie es dann doch...\n@c0@"
