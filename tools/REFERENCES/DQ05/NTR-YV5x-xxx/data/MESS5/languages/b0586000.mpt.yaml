  es: "@aAlazar@bEs decir, mucha gente hace alharacas diciendo que no pueden conseguir algo, cuando en realidad sí que pueden.\n@c0@"
  fr: "@aInnocent@bC'est vrai, après tout. Il y a plein de gens qui font tout un cirque en disant qu'ils ne peuvent rien faire au début, alors qu'ils peuvent, en fait.\n@c0@"
