  it: "@aSancho@b¿Ma davveros esto piccolo globo ha el potere de far volare el Castillo de Zenithia?\n@c0@"
  ja: "@a@bサンチョ「このちいさなオーブに\n\tお城を浮かせるチカラが\n\t本当に　あるんでしょうかねえ。\n@c0@"
95:
  de: "@aSancho@bChico... Bist du in Ordnung?\n@c0@"
  en: "@aSancho@bFriend... Are you alright?\n@c0@"
  es: "@aSancho@bChamaquito... ¿estás bien?\n@c0@"
  fr: "@aSancho@bChico... Tu es sûr que ça v-vaⓡ\n@c0@"
  it: "@aSancho@b¿Todo bien, chico?\n@c0@"
  ja: "@a@bサンチョ「……坊っちゃん\n\tどうかしましたか？\n@c0@"
96:
  de: "@aSancho@bNo. Perdone, du musst natürliss nissts sagen, wenn du nisst mösstest...\n@c0@"
  en: "@aSancho@bNo. I esorry. You no have to esay notheeng to me eef you no want to.\n@c0@"
  es: "@aSancho@bNo, lo siento. No tienes por qué decirme nada.\n@c0@"
  fr: "@aSancho@bNo, pardon. Tu n'es p-pas obligé de me r-raconter\r\nsi tu n'en as pas envie.\n@c0@"
  it: "@aSancho@bSi hai qualcosas que no va, puoi parlarne con lo zio Sancho. A volte confidarse con qualcunos aiuta a superare los momentos difíciles...\n@c0@"
  ja: "@a@bサンチョ「いえ　言いたくないなら\n\tいいんですよ。　行きましょう。\n@c0@"
97:
  de: "@aSancho@bDas ist bueno, no? Señor Ache wird sehr glückliss sein!\n@c0@"
  en: "@aSancho@bEes good, sí?\nSeñor Agon, he be eso happy!\n@c0@"
  es: "@aSancho@bEstá chide, ¿eh?\n¡El señor Agón se pondrá bien contento!\n@c0@"
  fr: "@aSancho@bC'est bien, noⓡ\nLe señor Agon sera si c-contentⓠ\n@c0@"
  it: "@aSancho@b¡Ay, que bueno!\n¡El Dottor Agon es muy feliz ahora!\n@c0@"
  ja: "@a@bサンチョ「とりあえず　これで\n\tプサンさんも満足してくれるでしょう。\n\tねっ　坊っちゃん！\n@c0@"
98:
  de: "@aOtto@bHabt Ihr etwas auf dem Herzen, %a000090, Eure Majestät?\n@c0@"
  en: "@aTuppence@bIs something on your mind, %a000090,\nYour Majesty?\n@c0@"
  es: "@aAlazar@b¿Os preocupa algo, Majestad?\n@c0@"
  fr: "@aInnocent@bQuelque chose vous tracasse, %a000090,\nVotre Majestéⓡ\n@c0@"
  it: "@aSimon@bMaestà, c'è qualche pensiero che la preoccupa?\n@c0@"
  ja: "@a@bピピン「%a000090さま　さっきから\n\tなにか　考え事ですか？\n@c0@"
99:
  de: "@aOtto@bIch möcht' ja net, dass Ihr Euch vor lauter Sorgen nimmer auf den Weg konzentrieren könnt und stolpert.\n@c0@"
  en: "@aTuppence@bI'm only asking in case it was distracting you from looking where you were going. I wouldn't want you to trip up.\n@c0@"
  es: "@aAlazar@bSolo lo digo por si os distrae de vuestro camino. No quiero que tropecéis.\n@c0@"
  fr: "@aInnocent@bJe vous demande seulement au cas où cela vous empêcherait de regarder où vous allez. Je ne voudrais pas que vous trébuchiez.\n@c0@"
  it: "@aSimon@bNon vorrei che si distraesse e inciampasse!\nSa, bisogna sempre prestare attenzione a dove si mettono i piedi...\n@c0@"
  ja: "@a@bピピン「それはいいですけど\n\t足もとには　気をつけてくださいね。\n@c0@"
100:
  de: "@aOtto@bZurück nach Zenithia, also. Dann nichts wie los!\n@c0@"
  en: "@aTuppence@bIt's back to Zenithia then, I suppose?\nLet's go!\n@c0@"
  es: "@aAlazar@bEntonces hay que volver a Zenithia, ¿no?\n¡Vamos!\n@c0@"
  fr: "@aInnocent@bOn retourne à Zénithia alorsⓡ\nAllons-yⓠ\n@c0@"
  it: "@aSimon@bAllora si torna a Zenithia, non è così?\nPerfetto! Andiamo!\n@c0@"
  ja: "@a@bピピン「さあ　天空城へ\n\tもどるんですよね？\n\t行きましょう！\n@c0@"
101:
  de: "@a%0%a001240@bWarum laufen wir eigentlich immer noch? Wir könnten doch genauso gut mit dem Zenithia-Schloss fliegen!\n@c0@"
  en: "@a%0%a001240@bWhy are we still walking around?\nWe could fly anywhere now in the Zenithian castle!\n@c0@"
