  it: "@a%0%a001240@bDai, papà!\nMi metto io ai comandi!\n@c0@"
  ja: "@a@b%a001240「ねえ　お父さん！\n\t天空城で　行こうよ。\n\tボク　そうじゅうしてあげるから！\n@c0@"
103:
  de: "@a%0%a001240@bDr. Ache ist schon ein komischer Mann, oder?\n@c0@"
  en: "@a%0%a001240@bDr Agon's a really weird man, isn't he?\n@c0@"
  es: "@a%0%a001240@bEl Dr. Agón es rarísimo, ¿eh?\n@c0@"
  fr: "@a%0%a001240@bLe Dr Agon est vraiment un monsieur très\nbizarre, nonⓡ\n@c0@"
  it: "@a%0%a001240@bIl Dottor Agon è una persona molto bizzarra.\n@c0@"
  ja: "@a@b%a001240「それにしても\n\tプサンさんって　ホントに\n\tおっかしいよねー。\n@c0@"
104:
  de: "@a%0%a001240@bWohin gehen wir jetzt, Papa?\n@c0@"
  en: "@a%0%a001240@bWhere do we go now, Dad?\n@c0@"
  es: "@a%0%a001240@b¿Adónde vamos ahora, papá?\n@c0@"
  fr: "@a%0%a001240@bOù on va, maintenant, papaⓡ\n@c0@"
  it: "@a%0%a001240@bPapà, adesso dove andiamo?\n@c0@"
  ja: "@a@b%a001240「ねえ　お父さん。\n\tこれから　どこに行ったら\n\tいいのかな？\n@c0@"
105:
  de: "@a%0%a001250@bIch habe keine Angst davor, mit dem Zenithia-Schloss zu fliegen. Man sieht ja nicht, was unter einem ist.\n@c0@"
  en: "@a%0%a001250@bI'm not scared of flying in the Zenithian castle.\nYou can't see outside, so it's fine.\n@c0@"
  es: "@a%0%a001250@bNo me da miedo volar en el castillo de Zenithia.\nNo puedes ver lo que hay fuera, así que da igual.\n@c0@"
  fr: "@a%0%a001250@bJe n'ai pas peur de voler dans le château zénithien. On ne voit pas dehors, alors ça va.\n@c0@"
  it: "@a%0%a001250@bMi piace volare con il Castello di Zenithia!\nE poi spostarsi in questo modo presenta un altro vantaggio...\n@c0@"
  ja: "@a@b%a001250「わたし　天空城なら\n\tのってても　こわくないの。\n\tお外　見えないから……。\n@c0@"
106:
  de: "@a%0%a001250@bUnd den fliegenden Teppich brauchen wir ja dann auch nicht mehr, oder?\n@c0@"
  en: "@a%0%a001250@bAnd it means there's no need to use the flying carpet any more, doesn't it?\n@c0@"
  es: "@a%0%a001250@bY eso significa que ya no hay que usar la alfombra mágica, ¿no?\n@c0@"
  fr: "@a%0%a001250@bEt ça veut dire qu'on n'a plus besoin d'utiliser le\ntapis volant, n'est-ce pasⓡ\n@c0@"
  it: "@a%0%a001250@bNon siamo costretti a usare il tappeto volante!\nQuel coso sì che mi fa soffrire le vertigini!\n@c0@"
  ja: "@a@b%a001250「だから　まほうのじゅうたんは\n\tもう　あんまり　使わないでね？\n@c0@"
107:
  de: "@a%0%a001250@bKannst du mir eine Geschichte über Mama erzählen, bevor ich schlafen gehe, Papa?\n@c0@"
  en: "@a%0%a001250@bWill you tell me a story about Mum before I go to sleep tonight, Dad?\n@c0@"
  es: "@a%0%a001250@bPapá, ¿me cuentas una historia sobre mamá antes de irme a la cama?\n@c0@"
  fr: "@a%0%a001250@bTu pourras me raconter une histoire sur maman avant que je m'endorme ce soir, papaⓡ\n@c0@"
  it: "@a%0%a001250@bPapà, questa sera mi racconti qualcosa della mamma?\n@c0@"
  ja: "@a@b%a001250「ねえ　お父さん。\n\t今日は　寝る前に\n\tお母さんの話　ききたいな……。\n@c0@"
108:
  de: "@a%0%a001250@bOh, Mama...\nWo bist du nur?\n@c0@"
  en: "@a%0%a001250@bOh, Mum...\nWhere are you?\n@c0@"
  es: "@a%0%a001250@b¡Oh!, mamá...\n¿Dónde estás?\n@c0@"
  fr: "@a%0%a001250@bOh, maman...\nOù es-tuⓡ\n@c0@"
  it: "@a%0%a001250@bMamma, dove sei?\n@c0@"
  ja: "@a@b%a001250「お母さん…　どこにいるの……？\n@c0@"
109:
  de: "@aSancho@bQué? Wir laufen immer noch, obwohl wir mit diesem Castillo fliegen könnten?\n@c0@"
  en: "@aSancho@bQué? We estill walking even when we have thees castle to ride eenside?\n@c0@"
  es: "@aSancho@b¿Eh? ¿Seguimos caminando cuando podemos ir adentro del castillo?\n@c0@"
  fr: "@aSancho@bQuéⓡ On c-continue de marcher alors qu'on\np-pourrait utiliser ce château pour se d-déplacerⓡ\n@c0@"
  it: "@aSancho@b¿Eh?\n¿Ma por qué camminiamo cuando podemos volare con el castillo?\n@c0@"
  ja: "@a@bサンチョ「やれやれ。　せっかく\n\t天空城で　移動ができるように\n\tなったのに　また徒歩ですか。\n@c0@"
110:
  de: "@aSancho@bHa ha ha! Das ist wohl ein Witz, si?\nSehr komiss, Chico!\n@c0@"
  en: "@aSancho@bHa ha ha! Ees a joke, sí?\nVery funny, friend!\n@c0@"
  es: "@aSancho@b¡Ja, ja, ja! Es una broma, ¿no?\n¡Muy buena, chamaquito!\n@c0@"
  fr: "@aSancho@bHa ha haⓠ C'est oune blague, siⓡ\nT-Très drôle, chicoⓠ\n@c0@"
  it: "@aSancho@bChico, no entiendo por qué dobbiamo estancarce inutilmentes...\n@c0@"
  ja: "@a@bサンチョ「トホホ……。\n\tむむっ？　こりゃダジャレですな。\n@c0@"
111:
  de: "@aSancho@bZenithia ist erst risstig Zenithia, wenn es oben im Himmel ist, no?\n@c0@"
  en: "@aSancho@bEes no Zenithia unless eet ees up een the esky, no?\n@c0@"
  es: "@aSancho@bÁndale, si no vuela no es Zenithia, ¿no?\n@c0@"
  fr: "@aSancho@bTant que le château n'est p-pas de nouveau dans le ciel, ça n'est p-pas vraiment Zénithia, heinⓡ\n@c0@"
  it: "@aSancho@bZenithia es realmentes Zenithia solo cuando está en cielos...\n@c0@"
  ja: "@a@bサンチョ「それにしても\n\t今の姿では　天空城という名は\n\t似合いませんな。\n@c0@"
112:
  de: "@aSancho@bEine Paella ist schließliss auch keine Paella ohne Meeresfrüchte.\n@c0@"
  en: "@aSancho@bEes like the paella weeth no eseafood.\n@c0@"
  es: "@aSancho@bEs como unas fajitas sin picante, nomás.\n@c0@"
  fr: "@aSancho@bC'est oun peu comme oune p-paella sans\r\nf-fruits de mer.\n@c0@"
  it: "@aSancho@b¡Proprio como la paella!\n¡Si no es preparata con el riso y los fruttos de mar, no es realmentes paella!\n@c0@"
  ja: "@a@bサンチョ「あれじゃ　いいところ\n\t上空城とか　空中城くらいですよ。\n@c0@"
113:
  de: "@aOtto@bDiese Zenithianer müssen ganz schön hart im Nehmen sein, wenn sie all die Jahre unter Wasser gelebt haben...\n@c0@"
  en: "@aTuppence@bThose Zenithians must be a hardy lot living underwater for so many years, eh?\n@c0@"
  es: "@aAlazar@bEsos de Zenithia deben de ser gente dura para haber sobrevivido tantos años bajo el agua.\n@c0@"
  fr: "@aInnocent@bCes Zénithiens doivent être sacrément résistants pour avoir survécu sous l'eau pendant tant d'années, heinⓡ\n@c0@"
  it: "@aSimon@bCerto che gli abitanti di Zenithia devono essere dei veri duri per aver resistito tanto a lungo sott'acqua.\n@c0@"
  ja: "@a@bピピン「それにしても　水の中で\n\t何年も　生き続けるとは\n\t天空の人たちは　すごいですね。\n@c0@"
114:
  de: "@aOtto@bDie könnten mir bestimmt so einiges beibringen!\n@c0@"
  en: "@aTuppence@bI bet they could teach me a trick or two.\n@c0@"
  es: "@aAlazar@bSeguro que se saben un par de trucos.\n@c0@"
  fr: "@aInnocent@bJe parie qu'ils pourraient m'apprendre un ou\r\ndeux trucs.\n@c0@"
  it: "@aSimon@bChissà, magari potrebbero insegnarmi qualche utile tecnica di sopravvivenza...\n@c0@"
  ja: "@a@bピピン「ボクも　そんな芸の\n\tひとつや　ふたつ\n\t身に　つけておきたいものです。\n@c0@"
115:
  de: "@aOtto@bSo, %a000090. Und wohin jetzt?\nGeht einfach vor, ich folge Euch.\n@c0@"
  en: "@aTuppence@bWell, %a000090? Where to next?\nJust lead the way, and I'll follow.\n@c0@"
  es: "@aAlazar@b¿Y bien, %a000090? ¿Adónde vamos ahora?\nAbrid el camino.\n@c0@"
  fr: "@aInnocent@bAlors, %a000090ⓡ Où va-t-on, maintenantⓡ\nOù que vous alliez, je vous suivrai.\n@c0@"
  it: "@aSimon@bMaestà, dove andiamo adesso? Dica pure quale sarà la nostra prossima destinazione: la seguirò fino in capo al mondo! E anche oltre, se necessario!\n@c0@"
  ja: "@a@bピピン「さあ　%a000090さまっ！\n\t今度は　どこですか？\n\tどこへなりと　お供しますよっ！\n@c0@"
116:
  de: "@a%0%a001240@bWo kann Mama nur sein? Wir waren doch wirklich schon überall!\n@c0@"
  en: "@a%0%a001240@bWhere can Mum be? Is there anywhere we haven't looked yet?\n@c0@"
  es: "@a%0%a001240@b¿Dónde estará mamá? ¿Hemos dejado algún sitio sin mirar?\n@c0@"
  fr: "@a%0%a001240@bOù maman peut-elle bien êtreⓡ Est-ce qu'il y a des endroits où on n'a pas encore cherchéⓡ\n@c0@"
  it: "@a%0%a001240@bMa dove sarà la mamma?\nC'è ancora qualche posto che non abbiamo controllato?\n@c0@"
  ja: "@a@b%a001240「お母さん　どこにいるのかな？\n\tさがしてない場所って\n\tまだ　あったっけ……？\n@c0@"
117:
  de: "@a%0%a001240@bWem sollen wir eigentlich diese Drachenkugel geben? Sollen wir sie nach Zenithia bringen?\n@c0@"
  en: "@a%0%a001240@bWho are we supposed to give this dragon orb to, though? Shall we take it to Zenithia?\n@c0@"
  es: "@a%0%a001240@b¿A quién hay que darle este orbe de dragón? ¿Lo llevamos a Zenithia?\n@c0@"
  fr: "@a%0%a001240@bMais à qui est-ce qu'on est censés donner cet orbe du Dragonⓡ On devrait peut-être l'apporter à Zénithia, nonⓡ\n@c0@"
  it: "@a%0%a001240@bA chi dobbiamo consegnare il Cuore del Dragone?\nLo portiamo a Zenithia?\n@c0@"
  ja: "@a@b%a001240「このドラゴンオーブって\n\t誰に　わたせばいいの？\n\tとりあえず　天空城に持ってってみる？\n@c0@"
118:
  de: "@a%0%a001250@bDiese Drachenkugel ist wirklich seltsam. Wenn man sie zu lange anguckt, hat man den Eindruck, sie würde einen jeden Moment verschlingen.\n@c0@"
  en: "@a%0%a001250@bThere's something really funny about that dragon orb. If you look at it for too long, you feel like it's going to swallow you up.\n@c0@"
  es: "@a%0%a001250@bEs gracioso este orbe de dragón. Si lo miras mucho tiempo parece que vaya a tragarte.\n@c0@"
  fr: "@a%0%a001250@bIl y a quelque chose de vraiment rigolo avec cet\norbe du Dragon. Si on le regarde trop longtemps,\non a l'impression qu'il va nous avaler.\n@c0@"
  it: "@a%0%a001250@bIl Cuore del Dragone è un oggetto molto strano...\nSe lo fissi a lungo, ti dà l'impressione che voglia inghiottirti!\n@c0@"
  ja: "@a@b%a001250「ドラゴンオーブって　ふしぎね。\n\tじっと見てると　なんだか\n\t吸いこまれちゃいそう……。\n@c0@"
119:
  de: "@a%0%a001250@bGlaubst du, dass sich die Macht des Zenithdrachen in der Drachenkugel befindet?\n@c0@"
  en: "@a%0%a001250@bDo you think the power of the Zenith Dragon is inside the dragon orb?\n@c0@"
  es: "@a%0%a001250@b¿Crees que el poder del Dragón de Zenithia está dentro del orbe de dragón?\n@c0@"
  fr: "@a%0%a001250@bTu crois que le pouvoir du Dragon du Zénith se trouve à l'intérieur de l'orbe du Dragonⓡ\n@c0@"
  it: "@a%0%a001250@bCredi che il Cuore del Dragone contenga il potere del Drago di Zenithia?\n@c0@"
  ja: "@a@b%a001250「このオーブの中に\n\tマスタードラゴンさんのチカラが\n\t入ってるの？\n@c0@"
120:
  de: "@a%0%a001250@bIch frage mich, wo der Zenithdrache ist...\n@c0@"
  en: "@a%0%a001250@bI wonder where the Zenith Dragon is...\n@c0@"
  es: "@a%0%a001250@bMe pregunto dónde estará el Dragón de Zenithia.\n@c0@"
  fr: "@a%0%a001250@bJe me demande où se trouve le Dragon du Zénith...\n@c0@"
  it: "@a%0%a001250@bMa dove si sarà nascosto il Drago, eh?\nDove se ne sarà andato?\nNon sarà mica stato rapito anche lui?!\n@c0@"
  ja: "@a@b%a001250「マスタードラゴンさんって\n\t今　どこにいるのかな……。\n@c0@"
121:
  de: "@aSancho@bWir kommen unserem Ziel immer näher, no? Bald werden wir den Tod von Señor Ludwig rächen können.\n@c0@"
  en: "@aSancho@bWe are close now, no?\nEsoon, we have the chance to avenge señor Pankraz's death.\n@c0@"
  es: "@aSancho@bYa estamos cerca, ¿no?\nAhorita podremos vengar la muerte del señor Teudis.\n@c0@"
  fr: "@aSancho@bOn se r-rapproche, noⓡ\nBientôt, on va p-pouvoir venger\nla m-mort du señor Petros.\n@c0@"
  it: "@aSancho@bPienso que ormai manchi pocos...\nPrestos potremo vendicare la muerte del povero señor Russel.\n@c0@"
  ja: "@a@bサンチョ「パパスさまの　カタキと\n\tあいまみえたと　いうことは\n\tずいぶん近くまで来ているのでしょう。\n@c0@"
122:
  de: "@aSancho@bSi...\nDas Böse ist nisst mehr fern...\n@c0@"
  en: "@aSancho@bSí...\nThe bad guys, they are close...\n@c0@"
  es: "@aSancho@bÁndale... \nLos villanos están cerca...\n@c0@"
  fr: "@aSancho@bSi...\r\nLes m-méchants, ils sont tout p-près...\n@c0@"
  it: "@aSancho@bSì.\nSiento que las creaturas malvagias sono vicinas...\n@c0@"
  ja: "@a@bサンチョ「ええ…\n\t悪の親玉の　近くまで……。\n@c0@"
123:
  de: "@aSancho@bJetzt ist es nisst mehr weit, Chico. Dein Onkel Sancho spürt, dass du deine %a001230 bald wiederhaben wirst.\n@c0@"
  en: "@aSancho@bEes no eso far away now. Your Uncle Sancho, he feels you gonna meet %a001230 again esoon, friend.\n@c0@"
  es: "@aSancho@bYa no queda lejos.\nEl tito Sancho siente que pronto te reunirás con %a001230, chamaquito.\n@c0@"
  fr: "@aSancho@bNous ne sommes p-plus très loin, maintenant.\nTonton Sancho sent que tu vas b-bientôt retrouver %a001230, chico.\n@c0@"
  it: "@aSancho@bChico, prestos rivedremo la tua amata %a001230.\nSoy seguro que la troveremo.\n¡Fidate dello zio Sancho!\n@c0@"
  ja: "@a@bサンチョ「なんとなくですが\n\t%a001230さまに　お会いできる日も\n\t近いような気がしてきましたぞ。\n@c0@"
124:
  de: "@aOtto@bWie lange ist es jetzt her, seit wir Humburg verlassen haben? Es kommt mir wie eine Ewigkeit vor.\n@c0@"
  en: "@aTuppence@bHow long's it been now since we went back to Gotha? It feels like ages.\n@c0@"
  es: "@aAlazar@b¿Cuánto hace que no volvemos a Pankraz? Me parecen siglos.\n@c0@"
  fr: "@aInnocent@bÇa fait combien de temps que nous ne sommes pas retournés à Gothaⓡ J'ai l'impression que ça fait des siècles.\n@c0@"
  it: "@aSimon@bMi sembra che sia passato un secolo da quando abbiamo lasciato il Regno di Denim...\n@c0@"
  ja: "@a@bピピン「そういえば　長らく\n\tグランバニアに\n\t帰ってない気がしますね。\n@c0@"
125:
  de: "@aOtto@bWas? Oh, tut mir leid. Hoffentlich haltet Ihr mich jetzt net für einen Jammerlappen, der unbedingt nach Hause will!\n@c0@"
  en: "@aTuppence@bWhat? It's not? Oh, sorry. I hope I didn't sound like a little sissy who wants to go home!\n@c0@"
  es: "@aAlazar@b¿Qué? ¿No? Lo siento. ¡Espero no haber sonado como un miedoso que quiere volver a casa!\n@c0@"
  fr: "@aInnocent@bCommentⓡ Ça ne fait pas si longtempsⓡ Oh, désolé. J'espère que je n'ai pas eu l'air d'une petite poule mouillée qui voulait rentrer chez elleⓠ\n@c0@"
  it: "@aSimon@bCome? Siamo partiti da poco?!\nPensavo che avrei resistito più a lungo prima di farmi prendere dalla nostalgia di casa...\n@c0@"
  ja: "@a@bピピン「え？　そんなことない？\n\tあわわっ！　軟弱なことを言って\n\t失礼しましたっ！\n@c0@"
126:
  de: "@aOtto@bDiese Treppe ist net der einzige Weg nach Zenithia. Wir sollten nach einer anderen Möglichkeit Ausschau halten.\n@c0@"
  en: "@aTuppence@bThat tower of stairs isn't the only way to get to Zenithia. We should look for another route.\n@c0@"
  es: "@aAlazar@bEsa torre llena de escaleras no es el único modo de llegar a Zenithia. Deberíamos buscar otro camino.\n@c0@"
  fr: "@aInnocent@bCette tour d'escaliers n'est pas le seul moyen d'atteindre Zénithia. Nous devrions chercher\r\nune autre route.\n@c0@"
  it: "@aSimon@bQuella scalinata potrebbe non essere l'unica via d'accesso a Zenithia...\n@c0@"
  ja: "@a@bピピン「天空城で　行ける場所が\n\tあの塔だけとは限りません。\n\tほかにもないか　さがしてみましょう。\n@c0@"
127:
  de: "@aOtto@bReisen kann ganz schön unheimlich sein... Ich meine, manchmal weiß man noch net mal, ob man in die richtige Richtung läuft!\n@c0@"
  en: "@aTuppence@bTravelling can be a bit scary at times, can't it?\nI mean, you don't even know if you're going the right way sometimes.\n@c0@"
  es: "@aAlazar@bA veces los viajes dan un poco de miedo, ¿eh?\nMe refiero a que en ocasiones no sabes siquiera si vas bien orientado.\n@c0@"
  fr: "@aInnocent@bVoyager est parfois un peu effrayant,\nn'est-ce pasⓡ C'est vrai, parfois on ne sait\nmême pas si on va dans la bonne direction.\n@c0@"
  it: "@aSimon@bViaggiare può essere un'incognita. A volte non si ha la certezza di aver preso la strada giusta fin quando non si raggiunge la destinazione.\n@c0@"
  ja: "@a@bピピン「旅って　こわいですよね。\n\t自分が進んでる道が　本当に\n\t正しい道なのか　わかりませんから。\n@c0@"
128:
  de: "@a%0%a001240@bIch kann es immer noch nicht glauben. Ich weiß gar nicht, was ich sagen soll!\n@c0@"
  en: "@a%0%a001240@bI still can't believe it.\nI don't know what to say!\n@c0@"
  es: "@a%0%a001240@bTodavía no puedo creerlo.\n¡No sé qué decir!\n@c0@"
  fr: "@a%0%a001240@bJe n'arrive toujours pas à le croire.\nJe ne sais pas quoi direⓠ\n@c0@"
  it: "@a%0%a001240@bNon ci posso credere!\nSono senza parole!\n@c0@"
  ja: "@a@b%a001240「びっくりしすぎちゃって\n\tまだ　なんて言っていいのか\n\tわかんないよ……。\n@c0@"
129:
  de: "@a%0%a001240@bDr. Ache ist der Zenithdrache, und wir hatten die ganze Zeit keine Ahnung!\n@c0@"
  en: "@a%0%a001240@bDr Agon was the Zenith Dragon all along, and we had no idea!\n@c0@"
  es: "@a%0%a001240@b¡El Dr. Agón era el Dragón de Zenithia y no teníamos ni idea!\n@c0@"
  fr: "@a%0%a001240@bDepuis le début, le Dr Agon était le Dragon du Zénith et on ne s'en doutait pas du toutⓠ\n@c0@"
  it: "@a%0%a001240@bIl Dottor Agon era il Drago di Zentihia!\n@c0@"
  ja: "@a@b%a001240「プサンさんが\n\tあの　マスタードラゴンだったなんて。\n@c0@"
130:
  de: "@a%0%a001240@bAlso müssen wir nur das Zenithiageläut erklingen lassen, und schon kommt Dr. Ache angeflogen?\n@c0@"
  en: "@a%0%a001240@bSo all we have to do is ring the Zenithian Tintinnabulum, and Dr Agon will come?\n@c0@"
  es: "@a%0%a001240@bEntonces, ¿solo tenemos que tocar el tintiniábulo de Zenithia para que venga el Dr. Agón?\n@c0@"
  fr: "@a%0%a001240@bAlors tout ce qu'on a à faire, c'est sonner le tintinnabulum zénithien et le Dr Agon viendraⓡ\n@c0@"
  it: "@a%0%a001240@bSe ho capito bene, ci basterà suonare il campanellino Zenithiano per far accorrere il Dottor Agon.\nEsatto?\n@c0@"
  ja: "@a@b%a001240「天空のベルを鳴らすと\n\tプサンさんが　来てくれるんだよね？\n@c0@"
131:
  de: "@a%0%a001240@bWahrscheinlich kommt er in einem dieser Minenwagen! Das würde ich ihm echt noch zutrauen...\n@c0@"
  en: "@a%0%a001240@bI half expect him to come in a mine cart!\nThat'd make everyone laugh.\n@c0@"
  es: "@a%0%a001240@b¡Casi espero verlo llegar en una vagoneta!\nSería graciosísimo.\n@c0@"
  fr: "@a%0%a001240@bJe m'attends presque à le voir arriver dans un wagonnet de mineⓠ Ça ferait rire tout le monde.\n@c0@"
  it: "@a%0%a001240@bEh eh eh!\nScommetto che arriverà a bordo di un carrello!\nEh eh eh eh eh!\n@c0@"
  ja: "@a@b%a001240「トロッコに乗って来たら\n\t笑っちゃうね！\n@c0@"
132:
  de: "@a%0%a001240@bIch wette, der Zenithdrache denkt sich nichts dabei, wenn er so hoch droben ist. Er fliegt doch über den Wolken? Da muss die Freiheit echt grenzenlos sein!\n@c0@"
  en: "@a%0%a001240@bI bet the Zenith Dragon doesn't think anything about being high up. I mean, he flies right up above the clouds, doesn't he?\n@c0@"
  es: "@a%0%a001240@bSeguro que el Dragón de Zenithia no le da importancia a estar en el cielo. Puede volar sobre las nubes, ¿no?\n@c0@"
  fr: "@a%0%a001240@bJe parie que le Dragon du Zénith n'a aucun problème de vertige. C'est vrai, après tout, il vole au-dessus des nuages, nonⓡ\n@c0@"
  it: "@a%0%a001240@bIl Drago di Zenithia può volare più in alto delle nuvole, vero?\nÈ troppo forte!\n@c0@"
  ja: "@a@b%a001240「マスタードラゴンなら\n\t高い所でも　へっちゃらだよね！\n\tだって　雲の上まで飛ぶんだよ！\n@c0@"
133:
  de: "@a%0%a001250@bSeit kurzem habe ich immer wieder diesen Traum. Ich sehe Mama. Sie ist irgendwo hoch oben und sieht ziemlich traurig aus.\n@c0@"
  en: "@a%0%a001250@bI've been having this dream recently. I see Mum.\nShe's up really high, and she looks really sad.\n@c0@"
  es: "@a%0%a001250@bÚltimamente tengo un sueño. Veo a mamá.\nEstá muy arriba, y parece muy triste.\n@c0@"
  fr: "@a%0%a001250@bDepuis quelque temps, je fais un rêve où je vois maman. Elle est très très haut et elle a l'air vraiment triste.\n@c0@"
  it: "@a%0%a001250@bLa notte scorsa ho sognato la mamma.\nEra molto triste...\n@c0@"
  ja: "@a@b%a001250「わたしね　最近になって\n\t夢を　見たの。　お母さんが\n\t高いところにいて　悲しそうなの……。\n@c0@"
134:
  de: "@a%0%a001250@bMüssen wir bald auf einen Berg hinauf oder so? Ich werde auch versuchen, keine Angst zu haben.\n@c0@"
  en: "@a%0%a001250@bAre we going somewhere high up next, then?\nI'll try not to get too scared.\n@c0@"
  es: "@a%0%a001250@bEntonces, ¿ahora nos toca viajar muy alto?\nIntentaré no asustarme.\n@c0@"
  fr: "@a%0%a001250@bEst-ce qu'on va dans un endroit très très haut, maintenantⓡ J'essaierai de ne pas avoir trop peur.\n@c0@"
  it: "@a%0%a001250@bIo soffro di vertigini, quindi i luoghi alti mi mettono a disagio. Quando sono accanto al mio papà, però, mi passano tutte le paure! O quasi...\n@c0@"
  ja: "@a@b%a001250「わたしたち　今度は\n\t高いところに　行くことになるのかな？\n\t………がんばります。\n@c0@"
135:
  de: "@a%0%a001250@bHoffentlich finden wir dich bald, Mama...\n@c0@"
  en: "@a%0%a001250@bI hope we find you soon, Mum...\n@c0@"
  es: "@a%0%a001250@bEspero que te encontremos pronto, mamá...\n@c0@"
  fr: "@a%0%a001250@bJ'espère qu'on te retrouvera bientôt, maman...\n@c0@"
  it: "@a%0%a001250@bMamma, spero che ti ritroveremo presto...\n@c0@"
  ja: "@a@b%a001250「お母さん…\n\tはやく　会いたい……。\n@c0@"
136:
  de: "@aSancho@bDa der Zenithdrache jetzt unser Amigo ist, sind wir so stark wie hundert Burros!\n@c0@"
  en: "@aSancho@bNow the Zenith Dragon, he ees our amigo, we have the estrength of one hundred burros!\n@c0@"
  es: "@aSancho@b¡Ahora que ese dragón es amigo nuestro tenemos la fuerza de cien burros, nomás!\n@c0@"
  fr: "@aSancho@bM-Maintenant que le Dragon du Zénith est notre amigo, nous avons la f-force de cent burrosⓠ\n@c0@"
  it: "@aSancho@b¡Ahora que el Drago de Zenithia es diventato nuestro amigo, podemos contar su un alleato formidabiles!\n@c0@"
  ja: "@a@bサンチョ「マスタードラゴンの\n\tチカラを得たとなれば\n\t百人力ですね！\n@c0@"
137:
  de: "@aSancho@bKomm, Chico. Wir brauchen vor nissts und niemandem Angst zu haben!\n@c0@"
  en: "@aSancho@bCome, friend. We no need to be escared of\r\nanytheeng now!\n@c0@"
  es: "@aSancho@bVamos, chamaco. ¡Ya no hay nada que temer!\n@c0@"
  fr: "@aSancho@bViens, chico. On n'a p-plus à avoir p-peur de rien, maintenantⓠ\n@c0@"
  it: "@aSancho@b¡Su con la vida, chico!\n¡Nosotros no temiamo nada y nessunos!\n@c0@"
  ja: "@a@bサンチョ「さあ　行きましょう！\n\t今さら　恐れるものなど\n\tないですもんねっ！\n@c0@"
138:
  de: "@aSancho@bIss bin so stolz, an deiner Seite zu sein, Chico!\n@c0@"
  en: "@aSancho@bI feel eso proud to be by your eside, friend!\n@c0@"
  es: "@aSancho@b¡Me siento orgulloso de estar a tu lado, chamaquito!\n@c0@"
  fr: "@aSancho@bJe suis si f-fier d'être à tes c-côtés, chicoⓠ\n@c0@"
  it: "@aSancho@bChico, soy muy orgoglioso de estare al tuo fiancos.\n@c0@"
  ja: "@a@bサンチョ「このサンチョを\n\tお供に　えらんでくれたこと\n\t感謝しますぞ！\n@c0@"
139:
  de: "@aSancho@bGracias, Chⓚⓛ\nNo, iss meine gracias, meine Majestät.\nIss werde diss nie im Stich lassen!\n@c0@"
  en: "@aSancho@bGracias, frⓚⓛ\nNo, I mean gracias, My Majesty.\nI no let you down.\n@c0@"
  es: "@aSancho@bGracias, ch...\nNo. Gracias, Majestad.\nNo le defraudaré.\n@c0@"
  fr: "@aSancho@bGracias, ch...\r\nNo, je veux dire, gracias, Ma Majesté.\r\nJe ne te laisserai pas t-tomber.\n@c0@"
  it: "@aSancho@bPerò forse te dovrei chiamare ⓕMaestàⓖ, o magari ⓕrey %a000090ⓖ...\n¿Como preferisce que me revolga a ti?\n@c0@"
  ja: "@a@bサンチョ「絶対に　坊っちゃん…\n\tいえ　%a000090王の\n\tお役に立ってみせますとも！\n@c0@"
140:
  de: "@aOtto@bDa denkt man, man kennt jemanden, und dann stellt sich heraus, dass Dr. Ache der Zenithdrache ist!\n@c0@"
  en: "@aTuppence@bJust when you think you know someone!\nI can't believe Dr Agon's really the Zenith Dragon.\n@c0@"
  es: "@aAlazar@b¡Justo cuando crees que conoces a alguien!\nNo puedo creer que el Dr. Agón sea el Dragón de Zenithia.\n@c0@"
  fr: "@aInnocent@bDire qu'on croit connaître les gensⓠ\nJe n'arrive pas à réaliser que le Dr Agon\nest vraiment le Dragon du Zénith.\n@c0@"
  it: "@aSimon@bCerto che è stata proprio una sorpresa, eh?\nChi avrebbe mai immaginato che il Dottor Agon è in realtà il Drago di Zenithia?!\n@c0@"
  ja: "@a@bピピン「プサンさんが\n\tマスタードラゴンだったなんて\n\tまいったな……。\n@c0@"
141:
  de: "@aOtto@bWenn ich das gewusst hätte, wär ich freundlicher zu ihm g'wesen...\n@c0@"
  en: "@aTuppence@bI mean, I'd have tried to butter him up a bit more if I'd known.\n@c0@"
  es: "@aAlazar@bDe haberlo sabido le hubiera hecho un poco más la pelota.\n@c0@"
  fr: "@aInnocent@bC'est vrai, si je l'avais su, j'aurais essayé de le caresser un peu plus dans le sens du poil. \n@c0@"
  it: "@aSimon@bSe l'avessi saputo, avrei cercato di diventare suo buon amico! Voglio dire, un tipo importante come lui conoscerà sicuramente un mucchio di belle fanciulle...\n@c0@"
  ja: "@a@bピピン「はじめから　そうだと\n\tわかっていれば　もっと\n\tコビを　売っておいたものを……。\n@c0@"
142:
  de: "@aOtto@bSo... Und wohin gehen wir jetzt?\n@c0@"
  en: "@aTuppence@bSo then... Where to next?\n@c0@"
  es: "@aAlazar@bEntonces... ¿adónde vamos ahora?\n@c0@"
  fr: "@aInnocent@bAlors... Où va-t-on, maintenantⓡ\n@c0@"
  it: "@aSimon@bAllora, qual è la nostra prossima destinazione?\n@c0@"
  ja: "@a@bピピン「さて……　これから\n\tどこへ行きますか？\n@c0@"
143:
  de: "@aOtto@bGanz egal wohin, auf jeden Fall sollte uns der Zenithdrache hinbringen.\n㈡\nMan hat schließlich net jeden Tag die Gelegenheit, auf einem Drachen zu fliegen, net wahr?\n@c0@"
  en: "@aTuppence@bWherever it is, we should get the Zenith Dragon to take us there. It's not every day you get to be given a lift by a dragon, is it?\n@c0@"
  es: "@aAlazar@bSea donde sea, deberíamos llevar al Dragón de Zenithia con nosotros. No todos los días se viaja a lomos de un dragón, ¿eh?\n@c0@"
  fr: "@aInnocent@bOù que ce soit, on devrait demander au Dragon du Zénith de nous y emmener. Ça n'est pas tous les jours qu'on peut se faire promener par un dragonⓠ\n@c0@"
  it: "@aSimon@bOvunque andremo, mi piacerebbe che fosse il Drago di Zenithia a portarci là. Non capita tutti i giorni di poter chiedere un passaggio a un drago, no?\n@c0@"
  ja: "@a@bピピン「せっかくですから\n\tマスタードラゴンの背中に\n\tのせてもらいましょうよ！\n@c0@"
144:
  de: "@aBianca@bIst es nicht fantastisch, dass wir alle wieder zusammen sind?\n@c0@"
  en: "@aBianca@bIt's funny bein' back together again like this, eh?\n@c0@"
  es: "@aBianca@bEs gracioso volver a estar juntos así, no sé.\n@c0@"
  fr: "@aBianca@bC'est drôle d'être de nouveau ensemble comme ça, heinⓡ\n@c0@"
  it: "@aBianca@bChe bello essere di nuovo insieme!\n@c0@"
  ja: "@a@bビアンカ「また　こんなふうに\n\t%a000090といっしょに\n\t歩けるなんてね……。\n@c0@"
145:
  de: "@aBianca@bIch habe immer gewusst, dass dieser Tag irgendwann kommen würde...\n@c0@"
  en: "@aBianca@bI always believed the day would come sooner or later, though.\n@c0@"
  es: "@aBianca@bPero siempre creí que antes o después llegaría el día, ¿sabes?\n@c0@"
  fr: "@aBianca@bJ'ai toujours été convaincue que ça finirait par arriver un jour ou l'autre, de toute façon.\n@c0@"
  it: "@aBianca@bDentro di me sentivo che prima o poi ci saremmo riuniti!\n@c0@"
  ja: "@a@bビアンカ「ううん。\n\tいつか　こんな日が来るって\n\tずっと　信じてたわよ。\n@c0@"
146:
  de: "@aBianca@bKomm, %a000090. Deine Mutter erwartet uns in Nadiria.\n@c0@"
  en: "@aBianca@bCome on, %a000090.\nYour mum's waitin' for us in Nadiria.\n@c0@"
  es: "@aBianca@b¡Vamos, %a000090!\nTu madre nos espera en Nadiria.\n@c0@"
  fr: "@aBianca@bViens, %a000090.\nTa maman nous attend à Nadiria.\n@c0@"
  it: "@aBianca@bForza, %a000090.\nTua madre ci sta aspettando a Nadiria.\n@c0@"
  ja: "@a@bビアンカ「行きましょ　%a000090。\n\tお母さまが　魔界で待ってるわ。\n@c0@"
147:
  de: "@aBianca@bDie Frage ist nur, wie wir überhaupt nach Nadiria kommen...\n@c0@"
  en: "@aBianca@bThe problem is knowin' how to get to Nadiria in the first place, eh?\n@c0@"
  es: "@aBianca@bEl problema es cómo llegar a la Nadiria esa, claro.\n@c0@"
  fr: "@aBianca@bLe problème, c'est déjà de savoir comment faire\npour atteindre Nadiria, heinⓡ\n@c0@"
  it: "@aBianca@bDobbiamo scoprire come fare per andare a Nadiria.\n@c0@"
  ja: "@a@bビアンカ「それにしても\n\t問題なのは　どこから\n\t魔界へ行けばいいかよね……。\n@c0@"
148:
  de: "@aBianca@bIrgendwelche Vorschläge, %a000090?\n@c0@"
  en: "@aBianca@bYou got any ideas up your sleeve, %a000090?\n@c0@"
  es: "@aBianca@b¿Tienes alguna idea de las tuyas, %a000090?\n@c0@"
  fr: "@aBianca@bTu aurais une idée sur la question, %a000090ⓡ\n@c0@"
  it: "@aBianca@bHai qualche idea, %a000090?\n@c0@"
  ja: "@a@bビアンカ「%a000090は　なにか\n\t思い当たることないの？\n@c0@"
149:
  de: "@aNera@bUnsere Kinder sind schon so groß... Ich bin froh, jetzt bei ihnen sein zu können, aber ist es nicht schrecklich, was ich alles verpasst habe?\n@c0@"
  en: "@aNera@bOur children have grown up so much...\r\nI'm so glad to be with them now, but so sad about all the time I've missed.\n@c0@"
  es: "@aNera@bNuestros bambini han crecido tanto...\nMe alegro de estar con ellos, pero estoy addolorata por el tiempo que he perdido.\n@c0@"
  fr: "@aNera@bNos enfants ont tellement grandi... Je suis si heureuse d'être avec eux maintenant, mais si triste pour toutes ces années que j'ai manquées.\n@c0@"
  it: "@aNera@bI nostri bambini sono diventati grandi!\nSono così felice di averli di nuovo accanto a me!\n@c0@"
  ja: "@a@bフローラ「子供たちが　本当に\n\t大きくなっていて　びっくりして\n\tうれしくて　悲しかったわ……。\n@c0@"
150:
  de: "@aNera@bIch war so lange von ihnen getrennt...\n@c0@"
  en: "@aNera@bI was out of their lives for such a long time...\n@c0@"
  es: "@aNera@bPasé tanto tiempo lontano de ellos...\n@c0@"
  fr: "@aNera@bJe n'ai pas fait partie de leur vie pendant tellement longtemps...\n@c0@"
  it: "@aNera@bI nostri due angeli erano rimasti per troppo tempo senza la loro mamma...\n@c0@"
  ja: "@a@bフローラ「それだけ　長い間\n\tそばに　いられなかったって\n\tことですものね……。\n@c0@"
151:
  de: "@aNera@bLass uns unseren Auftrag zu Ende führen, Liebling. Lass uns nach Nadiria gehen und diesen Großmeister der Unterwelt aus dem Weg räumen!\n@c0@"
  en: "@aNera@bLet's get the job done now, darling.\nLet's go to Nadiria and get this Grandmaster of the Underworld out of the way, shall we?\n@c0@"
  es: "@aNera@bVamos a terminar con esto, caro.\nVolvamos a Nadiria y quitemos de en mezzo a ese Gran Maestro del Inframundo.\n@c0@"
  fr: "@aNera@bMettons-nous au travail, maintenant, mon chéri. Allons à Nadiria et débarrassons-nous de ce\nGrand Maître des Enfers, d'accordⓡ\n@c0@"
  it: "@aNera@bNon perdiamo tempo!\nAndiamo a Nadiria e togliamo di mezzo il perfido Signore degli Inferi! Forza!\n@c0@"
  ja: "@a@bフローラ「さあ　あなた。\n\t魔界へ行って　魔王をたおし\n\t平和を　取りもどしましょう？\n@c0@"
152:
  de: "@aNera@bIch möchte endlich gemütlich mit Sancho zusammensitzen und mir von ihm berichten lassen, wie unsere Kinder aufgewachsen sind.\n@c0@"
  en: "@aNera@bI want to sit down with Sancho and hear all about our children and how they were as they were growing up.\n@c0@"
  es: "@aNera@bQuiero que Sancho me lo cuente todo de nuestros figli, y de cómo han ido creciendo.\n@c0@"
  fr: "@aNera@bJ'ai envie de m'asseoir avec Sancho pour qu'il me parle des enfants, qu'il me raconte comment ils étaient quand ils étaient plus petits. \n@c0@"
  it: "@aNera@bPoi chiederò a Sancho di raccontarmi com'erano i nostri figli da piccoli!\n㈡\nNon immagini nemmeno quanto mi dispiaccia essere stata lontana durante la loro infanzia!\n@c0@"
  ja: "@a@bフローラ「私　サンチョさんや\n\tおばさんから　子供たちの\n\t１０年間の話を　ゆっくり聞きたいの。\n@c0@"
153:
  de: "@aNera@bEs ist wunderbar, mit dir zusammen durch die Welt zu reisen.\n@c0@"
  en: "@aNera@bIt's so wonderful to be able to walk side by side like this again.\n@c0@"
  es: "@aNera@bEs maravilloso estar juntos di nuovo.\n@c0@"
  fr: "@aNera@bC'est tellement merveilleux de pouvoir de nouveau marcher côte à côte, comme ça.\n@c0@"
  it: "@aNera@bAvevo dimenticato quant'è bello camminare accanto a te...\n@c0@"
  ja: "@a@bフローラ「また　こうして　いっしょに\n\t歩けるなんて……\n@c0@"
154:
  de: "@aNera@bAber ich weiß, dass wir erst ein paar Dinge erledigen müssen, bevor wir endlich zur Ruhe kommen und unser Leben genießen können.\n@c0@"
  en: "@aNera@bBut I know there are things to be done before we can relax and enjoy our time together.\n@c0@"
  es: "@aNera@bMa sé que hay cosas que hacer antes de poder relajarse y disfrutar.\n@c0@"
  fr: "@aNera@bMais je sais qu'il y a certaines choses à faire avant que nous puissions nous détendre et profiter de ce temps ensemble.\n@c0@"
  it: "@aNera@bMa so che non è ancora arrivato il momento di riposarci e rilassarci.\nAbbiamo ancora molti problemi da risolvere...\n@c0@"
  ja: "@a@bフローラ「でも　今は　まだ\n\tよろこびに　ひたっている時間は\n\tありませんわね……。\n@c0@"
155:
  de: "@a%0%a001240@bMama ist... Sie erscheint mir viel netter, als ich sie mir vorgestellt hatte.\n@c0@"
  en: "@a%0%a001240@bMum's... She seems much kinder than I'd imagined.\n@c0@"
  es: "@a%0%a001240@bMamá... es mucho más gentil de como la imaginaba.\n@c0@"
  fr: "@a%0%a001240@bMaman est... Elle a l'air encore plus gentille que\nce que j'imaginais.\n@c0@"
  it: "@a%0%a001240@bMamma è molto più bella di quanto immaginassi...\n@c0@"
  ja: "@a@b%a001240「お母さんって……\n\tボクが思ってたより　うんと\n\tやさしそうな人だったよ！\n@c0@"
156:
  de: "@a%0%a001240@bIch bin wirklich glücklich, so Eltern wie euch zu haben.\n@c0@"
  en: "@a%0%a001240@bI'm really lucky to have parents like you.\n@c0@"
  es: "@a%0%a001240@bSoy muy afortunado por tener unos padres así.\n@c0@"
  fr: "@a%0%a001240@bJ'ai vraiment de la chance d'avoir des parents comme vous.\n@c0@"
  it: "@a%0%a001240@bSono un bambino fortunato ad avere dei genitori come voi!\n@c0@"
  ja: "@a@b%a001240「ふたりの子供に生まれて\n\tボク　よかった！\n@c0@"
157:
  de: "@a%0%a001240@bWas ist Nadiria für ein Ort, Papa?\n@c0@"
  en: "@a%0%a001240@bWhat's this Nadiria place like, Dad?\n@c0@"
  es: "@a%0%a001240@b¿Cómo es esa Nadiria, papá?\n@c0@"
  fr: "@a%0%a001240@bÀ quoi ressemble Nadiria, papaⓡ\n@c0@"
  it: "@a%0%a001240@bPapà, com'è Nadiria?\nÈ un posto bello o brutto?\n@c0@"
  ja: "@a@b%a001240「ねえ　お父さん。\n\t魔界って　どんなとこなんだろ？\n@c0@"
158:
  de: "@a%0%a001240@bWas? Nein! Ich habe keine Angst! Ich wollte nur wissen, vor welchen Monstern ich dich beschützen muss, das ist alles.\n@c0@"
  en: "@a%0%a001240@bWhat? No! I'm not scared!\nI just want to know what kind of monsters I'm going to have to protect you from, that's all.\n@c0@"
  es: "@a%0%a001240@b¿Qué? ¡No! ¡No tengo miedo!\nSolo quiero saber de qué clase de monstruos tendré que protegeros, nada más.\n@c0@"
  fr: "@a%0%a001240@bQuoiⓡ Nonⓠ J'ai pas peurⓠ\nJe veux seulement savoir de quel genre de\nmonstres je vais devoir te protéger, c'est tout.\n@c0@"
  it: "@a%0%a001240@bNo che non ho paura!\nL'ho chiesto solo per sapere da che tipo di mostri dovrò difendervi! Eh eh eh!\n@c0@"
  ja: "@a@b%a001240「えっ？　ボク　こわくないよ。\n\tどんな敵がいたって　ボクが\n\tお父さんを　守ってあげるよ！\n@c0@"
159:
  de: "@a%0%a001240@bEndlich machen wir uns nach Nadiria auf. Endlich werden wir dem Großmeister Nimzo gegenübertreten.\n@c0@"
  en: "@a%0%a001240@bSo we're finally going to Nadiria, after all\nthis travelling. We'll finally get to meet this Grandmaster Nimzo.\n@c0@"
  es: "@a%0%a001240@bAsí que, después de tantos viajes, llegamos a Nadiria. Por fin conoceremos a ese Gran Maestro Nimzo.\n@c0@"
  fr: "@a%0%a001240@bAlors on va enfin à Nadiria, après tout ce voyage. On va enfin rencontrer ce Grand Maître Nimzo.\n@c0@"
  it: "@a%0%a001240@bE così andiamo a Nadiria! Finalmente l'attesa è finita! Non vedo l'ora di incontrare il Gran Maestro Nimzo e di conciarlo per le feste!\n@c0@"
  ja: "@a@b%a001240「いよいよ\n\t魔界へ　行くんだよね。\n\t大魔王は　もう　近くだ……。\n@c0@"
160:
  de: "@a%0%a001250@bIch bin gar nicht mehr so ängstlich wie früher, oder? Und ich nerve dich auch nicht mehr so sehr, nicht wahr, Papa? ... Nicht wahr?\n@c0@"
  en: "@a%0%a001250@bI'm tougher than I used to be, aren't I?\nI don't get in your way any more, do I?\n...Do I?\n@c0@"
  es: "@a%0%a001250@bSoy más dura que antes, ¿a que sí?\nYa no te molesto nunca, ¿a que no?\n¿A que no?\n@c0@"
  fr: "@a%0%a001250@bJe suis plus forte qu'avant, heinⓡ Je ne suis plus dans tes pattes comme avant, heinⓡ\n... Heinⓡ\n@c0@"
  it: "@a%0%a001250@bSono diventata più forte, non è così?\nAdesso non sono più solo un impiccio, vero? Vero...?\nUffà! Dimmi che è vero! Sob!\n@c0@"
  ja: "@a@b%a001250「わたし　強くなったよね？\n\tもう　お父さんに\n\tめいわく　かけてない……よね？\n@c0@"
161:
  de: "@a%0%a001250@bGuck mal! Mama hat mir diese Schleife ins Haar getan.\n@c0@"
  en: "@a%0%a001250@bLook! Mum put this ribbon in my hair for me.\n@c0@"
  es: "@a%0%a001250@b¡Mira! Mamá me puso este lazo en el pelo.\n@c0@"
  fr: "@a%0%a001250@bRegardeⓠ Maman m'a mis ce ruban dans les cheveux.\n@c0@"
  it: "@a%0%a001250@bGuarda!\nMamma mi ha messo un fiocco fra i capelli!\n@c0@"
  ja: "@a@b%a001250「あのね。\n\tこの髪のリボン　お母さんに\n\tむすんでもらったの。\n@c0@"
162:
  de: "@a%0%a001250@bSie ist so schön, ich kann gar nicht mehr aufhören zu lachen! Hi hi hi!\n@c0@"
  en: "@a%0%a001250@bMy head's so happy, it can't stop smiling!\nHee hee hee!\n@c0@"
  es: "@a%0%a001250@b¡Estoy tan contenta que no puedo dejar de sonreír!\n¡Ji, ji, ji!\n@c0@"
  fr: "@a%0%a001250@bJe suis tellement contente que je ne peux pas m'empêcher de sourireⓠ Hi hi hiⓠ\n@c0@"
  it: "@a%0%a001250@bOra sono ancora più carina!\nEh eh eh eh eh!\n@c0@"
  ja: "@a@b%a001250「だから　今日は\n\tあたまが　うれしいの。　えへへ……。\n@c0@"
163:
  de: "@a%0%a001250@bJetzt, wo wir Mama endlich gefunden haben, möchte ich Großmutter nur noch umso mehr finden.\n@c0@"
  en: "@a%0%a001250@bNow that we've found Mum, it makes me want to find Grandma even more.\n@c0@"
  es: "@a%0%a001250@bAhora que hemos encontrado a mamá tengo más ganas de buscar a la abuela.\n@c0@"
  fr: "@a%0%a001250@bMaintenant qu'on a retrouvé maman, ça me donne encore plus envie de retrouver grand-mère.\n@c0@"
  it: "@a%0%a001250@bOra che abbiamo salvato mamma, voglio trovare anche nonna Mada!\n@c0@"
  ja: "@a@b%a001250「お母さんに会えたら\n\tおばあちゃんにも　会いたくなったの。\n@c0@"
164:
  de: "@a%0%a001250@bDas verstehst du sicher gut. Du vermisst Großmutter doch auch, nicht wahr?\n@c0@"
  en: "@a%0%a001250@bYou don't think I'm being greedy, do you, Dad?\nYou want to find Grandma too, don't you?\n@c0@"
  es: "@a%0%a001250@b¿Crees que estoy siendo ambiciosa, papá?\nTú también quieres encontrar a la abuela, ¿no?\n@c0@"
  fr: "@a%0%a001250@bTu ne trouves pas que j'en veux trop, hein, papaⓡ Toi aussi tu veux retrouver grand-mère,\nn'est-ce pasⓡ\n@c0@"
  it: "@a%0%a001250@bPapà, anche tu vuoi trovare nonna Mada, vero?\nPerché mia nonna è la tua mamma, e ogni figlio vuole stare con la propria madre...\n@c0@"
  ja: "@a@b%a001250「でも　わたし\n\tわがままじゃないよね？\n\tお父さんも　同じこと　思ってるよね？\n@c0@"
165:
  de: "@aSancho@bWenn mir deine Madre finden, Chico, und sie heil nach Humburg zurückbringen...\n@c0@"
  en: "@aSancho@bEef we find your mother, friend, and we breeng her back to Gotha esafely...\n@c0@"
  es: "@aSancho@bSi encontramos a vuestra amá, chamaco, y la llevamos a Pankraz nomás...\n@c0@"
  fr: "@aSancho@bSi on r-retrouve ta mère, chico, et qu'on la\r\nr-ramène à Gotha saine et s-sauve...\n@c0@"
  it: "@aSancho@bChico, dobbiamo trovare tua madre y ricondurla a Denim sana y salva...\n@c0@"
  ja: "@a@bサンチョ「もしも　マーサさまを\n\t無事に　グランバニアに\n\t連れもどすことができれば……\n@c0@"
166:
  de: "@aSancho@bDann wird dein Padre, Señor Ludwig, sehr sehr glückliss sein, wo immer er jetzt auch ist!\n@c0@"
  en: "@aSancho@bThen your dear father, señor Pankraz, he be eso happy at last!\n@c0@"
  es: "@aSancho@b... ¡vuestro apá, el señor Teudis, será al fin chide feliz!\n@c0@"
  fr: "@aSancho@b... alors ton cher p-papá, le señor Petros,\nil sera enfin si c-contentⓠ\n@c0@"
  it: "@aSancho@b¡Solo così potremo realizzare el sueño de tuo padre, el señor Russel!\n@c0@"
  ja: "@a@bサンチョ「そのとき　はじめて\n\tパパスさまも　心から\n\tよろこんでくださるでしょうね。\n@c0@"
167:
  de: "@aSancho@bIss weiß, dass du kein kleiner Niño mehr bist, Chico...\n@c0@"
  en: "@aSancho@bI know you are no a bebé no more, friend, but anyway I esay eet...\n@c0@"
  es: "@aSancho@bSé que no eres un chavito, chamaco, pero lo diré.\n@c0@"
  fr: "@aSancho@bJe sais que tu n'es plus oun bébé, chico, mais\r\nje te le d-dis quand même...\n@c0@"
  it: "@aSancho@bChico, yo so que no sei más un niño, ma te lo chiederò ugualmentes...\n@c0@"
  ja: "@a@bサンチョ「初心を忘れず\n\tあれを　言っておきましょう！\n@c0@"
168:
  de: "@aSancho@bAber hast du diss auch gut vorbereitet? Hast du die Heilkräuter und die Chimärenflügel?\n@c0@"
  en: "@aSancho@bHave you prepared properly for your\r\njourney? You have the medicinal herbs\r\nand the chimaera wings?\n@c0@"
  es: "@aSancho@b¿Te preparaste para el viaje? ¿Tienes las hierbas medicinales y las alas de quimera?\n@c0@"
  fr: "@aSancho@bEst-ce que tu t'es p-préparé comme il faut pour ton v-voyageⓡ Tu as bien pris les herbes m-médicinales et les ailes de chimèreⓡ \n@c0@"
  it: "@aSancho@b¿Sei pronto por el viaggio?\n¿Hai preso las erbas medicinales y las alas de chimera?\n@c0@"
  ja: "@a@bサンチョ「坊っちゃん！　旅のしたくは\n\tすべて　すみましたか？\n\t薬草と　キメラの翼は持ちましたか？\n@c0@"
169:
  de: "@aSancho@bDu bist ein großartiger Mann, Chico. Selbst jetzt, wo du der König bist, hast du diss nisst verändert.\n@c0@"
  en: "@aSancho@bYou are a great man, friend. Even now you are the king, you no change, eh?\n@c0@"
  es: "@aSancho@bEres un gran hombre, chamaquito. Eres el Rey, pero no me vayas a cambiar, ¿eh?\n@c0@"
  fr: "@aSancho@bTu es oun garçon super, chico. Même maintenant\nque t-tu es roi. Tu ne changes pas, heinⓡ\n@c0@"
  it: "@aSancho@bSei proprio una brava persona, chico.\nEssere diventato Rey de Denim no te ha cambiato affattos. ¡Sei siempre un hombre fuerte y generoso!\n@c0@"
  ja: "@a@bサンチョ「さすがは　坊っちゃん！\n\t王になっても　すこしも\n\t変わりませんね！\n@c0@"
170:
  de: "@aSancho@bUnd iss weiß, dass du nissts lieber möchtest, als endliss Señora Magda zu finden.\n@c0@"
  en: "@aSancho@bEef I am you, friend, I know I am wanting to go and find señora Mada.\n@c0@"
  es: "@aSancho@bYo que tú, chamaquito, estaría ansioso por partir en busca de la señora Perséfone.\n@c0@"
  fr: "@aSancho@bSi j'étais toi, chico, je sais que je v-voudrais partir chercher la señora Magdalena.\n@c0@"
  it: "@aSancho@bYo so que no hai perso la esperanza de trovare la señora Mada.\n¡La salveremo, chico! ¡Vedrai que ce la faremo!\n@c0@"
  ja: "@a@bサンチョ「私は　坊っちゃんなら\n\t必ずや　マーサさまを\n\t助けに行くと思ってましたよ！！\n@c0@"
171:
  de: "@aOtto@bIch weiß, es steht mir vielleicht net zu, dass zu sagen, aber ich hab mit allen Humburgern über die Angelegenheit g'sprochen.\n@c0@"
  en: "@aTuppence@bI know it's probably not my place to say anything, but I think I speak for all Gothans about this.\n@c0@"
  es: "@aAlazar@bProbablemente me esté excediendo, pero creo hablar por todos en Pankraz al decir esto...\n@c0@"
  fr: "@aInnocent@bJe sais que ce n'est sans doute pas mon rôle de\r\ndire ça, mais je pense parler au nom de tous les habitants de Gotha.\n@c0@"
  it: "@aSimon@bVorrei dire una cosa a nome di tutti i sudditi del Regno di Denim...\n@c0@"
  ja: "@a@bピピン「ボクごときが言うのも\n\tなんですが　グランバニアの民の\n\t代表として　言わせてもらえば……\n@c0@"
172:
  de: "@aOtto@bWir alle unterstützen Euch, Eure Majestät! Auf nach Nadiria!\n@c0@"
  en: "@aTuppence@bWe support you, Your Majesty, in your quest to storm Nadiria!\n@c0@"
  es: "@aAlazar@b¡Majestad, estamos con vos en vuestra misión de atacar Nadiria!\n@c0@"
  fr: "@aInnocent@bNous vous soutenons dans votre combat contre Nadiria, Votre Majestéⓠ\n@c0@"
  it: "@aSimon@bMaestà, appoggiamo in pieno la sua decisione di recarsi a Nadiria! Siamo tutti con lei!\nGli altri solo in spirito, io in carne e ossa...\n@c0@"
  ja: "@a@bピピン「%a000090さまが　魔界へ\n\t行くのは　大さんせい　ですよっ！\n@c0@"
173:
  de: "@aOtto@bI-Ich weiß net, was ich sagen soll... Es macht mich sehr stolz, dass Ihr mich für diese riskante Mission auserwählt habt! Wir werden Königin Magda retten!\n@c0@"
  en: "@aTuppence@bI, I don't know what to say...\nI'm delighted that you'd choose me to accompany you on this daring mission to save Queen Mada!\n@c0@"
  es: "@aAlazar@bN-no sé qué decir... ¡Qué bien que me hayáis elegido para acompañaros en esta audaz misión para salvar a la reina Perséfone!\n@c0@"
  fr: "@aInnocent@bJe... Je ne sais pas quoi dire... Je suis ravi que vous m'ayez choisi pour vous accompagner dans cette dangereuse mission pour sauver la reine Magdalenaⓠ\n@c0@"
  it: "@aSimon@bMaestà, sono onorato che lei mi abbia chiesto di accompagnarla nella difficile missione di salvare la regina Mada!\n@c0@"
  ja: "@a@bピピン「太后さまを　助けに行くのに\n\tボクなんかを　えらんでくださって…\n\t本当に　かんげきですっ！\n@c0@"
174:
  de: "@aOtto@bIhr möchtet jetzt nach Nadiria aufbrechen?\nHa ha ha ha! Findet Ihr das net ein bisserl seltsam?\n@c0@"
  en: "@aTuppence@bYou're planning on setting off for Nadiria right now? Ah ha ha ha! Wouldn't that be a bit odd?\n@c0@"
  es: "@aAlazar@b¿Planeáis partir ya mismo hacia Nadiria?\n¡Ja, ja, ja! ¿No sería un poco raro?\n@c0@"
  fr: "@aInnocent@bVous envisagez de partir pour Nadiria immédiatementⓡ Ha ha haⓠ\nÇa ne serait pas un peu fouⓡ\n@c0@"
  it: "@aSimon@bMaestà, vuole partire immediatamente per Nadiria?\nNe è proprio certo?\n@c0@"
  ja: "@a@bピピン「魔界に行くのは\n\t今かい？　わはははっ！　\n\tおかしいでしょう！？\n@c0@"
175:
  de: "@aBianca@bDer Eingang nach Nadiria ist nun offen. Wir sollten aufbrechen.\n@c0@"
  en: "@aBianca@bThe entrance to Nadiria is open now. Looks like it's time to go through.\n@c0@"
  es: "@aBianca@bLa entrada de Nadiria está abierta. Parece que es la hora.\n@c0@"
  fr: "@aBianca@bLes portes de Nadiria sont maintenant ouvertes.\r\nOn dirait que le moment est venu de les franchir.\n@c0@"
  it: "@aBianca@bIl varco per Nadiria è aperto!\nQuesto è il momento giusto per entrare.\n@c0@"
  ja: "@a@bビアンカ「%a000090\n\t魔界への入り口は　開いているのよ。\n\tさあ　行きましょう。\n@c0@"
176:
  de: "@aBianca@bWer hätte gedacht, dass einer der Schlüssel für das Nadiria-Tor mein Ehering sein würde?\n@c0@"
  en: "@aBianca@bWho'd have thought that one of the keys to enterin' Nadiria would be my weddin' ring?\n@c0@"
  es: "@aBianca@bA quien le digan que una de las llaves para entrar en Nadiria era mi anillo de bodas...\n@c0@"
  fr: "@aBianca@bQui aurait cru que l'une des clefs pour entrer dans Nadiria serait mon alliance de mariageⓡ\n@c0@"
  it: "@aBianca@bChi avrebbe mai detto che la mia fede nuziale era una delle chiavi necessarie per entrare a Nadiria, eh?\n@c0@"
  ja: "@a@bビアンカ「魔界のトビラを開く\n\tリングのうち　２つが　私たちの\n\t結婚指輪だったなんて……。\n@c0@"
177:
  de: "@aBianca@bDas muss einfach Schicksal sein!\n@c0@"
  en: "@aBianca@bI feel like it must be fate or somethin'.\n@c0@"
  es: "@aBianca@bEsto es el destino o yo qué sé.\n@c0@"
  fr: "@aBianca@bÇa doit être le destin, ou quelque chose comme ça.\n@c0@"
  it: "@aBianca@bCredevo fosse un semplice anello, e invece ci ha aperto le porte del Regno degli Inferi!\n@c0@"
  ja: "@a@bビアンカ「なんだか\n\t運命を　感じちゃうわね。\n@c0@"
178:
  de: "@aBianca@bWir sollten uns besser beeilen. Wir haben keine Zeit zu verlieren.\n@c0@"
  en: "@aBianca@bIf we're ready to go, then we'd better get a move on. There's no time to lose.\n@c0@"
  es: "@aBianca@bSi ya estamos listos, arreando. No hay tiempo que perder, ¿sabes?\n@c0@"
  fr: "@aBianca@bSi nous sommes prêts à y aller, alors nous\r\nferions bien de partir maintenant.\r\nIl n'y a pas de temps à perdre.\n@c0@"
  it: "@aBianca@bDirei di muoverci non appena saremo pronti.\nNon abbiamo nemmeno un istante da perdere!\n@c0@"
  ja: "@a@bビアンカ「準備を　ととのえたら\n\tもう　行かなくちゃ……。\n\tあまり　時間はないわよ。\n@c0@"
179:
  de: "@aNera@bBist du bereit, nach Nadiria zu gehen, Liebling?\n@c0@"
  en: "@aNera@bAre you ready to go to Nadiria then, darling?\n@c0@"
  es: "@aNera@b¿Estás listo para partir hacia Nadiria, caro?\n@c0@"
  fr: "@aNera@bAlors, es-tu prêt à partir pour Nadiria, mon chériⓡ\n@c0@"
  it: "@aNera@bAmore, sei pronto per entrare a Nadiria?\n@c0@"
  ja: "@a@bフローラ「さあ　あなた…\n\t行きましょう　魔界へ……。\n@c0@"
180:
  de: "@aNera@bEs ist fast so wie damals, als ich noch nicht in eine Steinstatue verwandelt worden war, nur dass die Lage jetzt bedeutend ernster ist...\n@c0@"
  en: "@aNera@bEverything looks more or less the same as before I was turned to stone, but the situation's much more serious now, isn't it?\n@c0@"
  es: "@aNera@bTodo parece más o menos igual que cuando me convertí en estatua, ma la situación es mucho más grave, ¿no?\n@c0@"
  fr: "@aNera@bTout est plus ou moins identique à ce qui existait avant que je ne sois transformée en pierre...\n㈡\nSi ce n'est que la situation est bien plus grave aujourd'hui, n'est-ce pasⓡ\n@c0@"
  it: "@aNera@bA prima vista non si direbbe, ma la situazione attuale è decisamente peggiore rispetto a prima che io fossi tramutata in una statua...\n@c0@"
  ja: "@a@bフローラ「こうして見ていると\n\t石にされる前と　同じ景色なのに…\n\t状況は　きんぱく　していますのよね。\n@c0@"
181:
  de: "@aNera@bIst das nicht erstaunlich? Zwei der Ringe, die wir brauchten, um das Tor nach Nadiria zu öffnen, waren unsere Trauringe!\n@c0@"
  en: "@aNera@bIsn't it amazing? Two of the rings we need to\r\nopen the gateway to Nadiria are our very own wedding rings!\n@c0@"
  es: "@aNera@b¿No es asombroso? ¡Dos de los anillos necesarios para abrir el portal a Nadiria son los de la nostra boda!\n@c0@"
  fr: "@aNera@bN'est-ce pas incroyableⓡ Deux des anneaux dont nous avons besoin pour ouvrir les portes de Nadiria sont nos propres alliances de mariageⓠ\n@c0@"
  it: "@aNera@bNon trovi che sia strano?\nLe nostre fedi nuziali sono due degli anelli necessari per entrare a Nadiria...\n@c0@"
  ja: "@a@bフローラ「魔界のトビラを開く\n\tリングのうち　２つが　私たちの\n\t結婚指輪だったなんて……。\n@c0@"
182:
  de: "@aNera@bSiehst du, es war von Anfang an vorherbestimmt, dass wir zusammenkommen!\n@c0@"
  en: "@aNera@bYou see, it was destiny that we should be together, right from the start.\n@c0@"
  es: "@aNera@bDesde el principio estábamos destinados a estar in sieme.\n@c0@"
  fr: "@aNera@bTu vois, c'est le destin qui a décidé que nous\r\ndevions être ensemble, depuis le début.\n@c0@"
  it: "@aNera@bEvidentemente era scritto nel destino che noi due dovessimo stare insieme, amore mio.\n@c0@"
  ja: "@a@bフローラ「あのときから　すでに\n\t運命は　決まっていたんでしょうか。\n@c0@"
183:
  de: "@a%0%a001240@bIch glaube, unsere Welt gefällt mir besser als die Unterwelt.\n@c0@"
  en: "@a%0%a001240@bI think I prefer our world to the underworld.\n@c0@"
  es: "@a%0%a001240@bCreo que prefiero nuestro mundo al inframundo.\n@c0@"
  fr: "@a%0%a001240@bJe crois que je préfère notre monde au monde souterrain.\n@c0@"
  it: "@a%0%a001240@bIl nostro mondo è molto più bello del Regno degli Inferi!\n@c0@"
  ja: "@a@b%a001240「ボクは　やっぱり\n\t魔界より　こっちの世界の方が\n\t好きだな。\n@c0@"
184:
  de: "@a%0%a001240@bAber du gehst doch zurück nach Nadiria, nicht wahr, Papa? Und ich komme mit!\n@c0@"
  en: "@a%0%a001240@bBut you're going back to Nadiria, aren't you, Dad?\nAnd I'm coming with you!\n@c0@"
  es: "@a%0%a001240@bPero vas a volver a Nadiria, ¿no, papá?\n¡Y yo iré contigo!\n@c0@"
  fr: "@a%0%a001240@bMais tu vas retourner à Nadiria, n'est-ce pas papaⓡ Et moi, je viens avec toiⓠ\n@c0@"
  it: "@a%0%a001240@bPapà, se hai intenzione di tornare a Nadiria, io verrò con te. Non voglio farti andare in quel postaccio tutto da solo!\n@c0@"
  ja: "@a@b%a001240「でも　お父さん。\n\tまた　行くんでしょ？\n\tうん。　もちろん　ボクも行くよ。\n@c0@"
185:
  de: "@a%0%a001240@bDas mit den drei Ringen an der Statue hat tatsächlich funktioniert, genau, wie die Leute in Steile Höh gesagt hatten.\n@c0@"
  en: "@a%0%a001240@bPutting the three rings on the statue really worked, just like the people in Lofty Peak said.\n@c0@"
  es: "@a%0%a001240@bLo de los tres anillos en la estatua ha funcionado, como nos dijeron en Cumbre Excelsa.\n@c0@"
  fr: "@a%0%a001240@bPlacer les trois anneaux sur la statue a\nvraiment marché, exactement comme\nles gens de Haute-Cime l'avaient dit.\n@c0@"
  it: "@a%0%a001240@bMettere i tre anelli sulla statua ha funzionato, proprio come avevano detto gli abitanti di Picco Maximo.\n@c0@"
  ja: "@a@b%a001240「３つのリングを像に……\n\tエルヘブンの人たちが\n\t言ってたこと　本当だったね。\n@c0@"
186:
  de: "@a%0%a001250@bSolange ich bei dir, Mama und %a001240 bin, habe ich keine Angst.\n@c0@"
  en: "@a%0%a001250@bI'm not scared as long as I'm with you and Mum and %a001240.\n@c0@"
  es: "@a%0%a001250@bNo tendré miedo mientras esté contigo, con mamá y con %a001240.\n@c0@"
  fr: "@a%0%a001250@bDu moment que je suis avec toi, maman et %a001240, je n'ai pas peur.\n@c0@"
  it: "@a%0%a001250@bQuando tu, la mamma e %a001240 siete con me mi passano tutte le paure.\nEhm, quasi tutte le paure...\n@c0@"
  ja: "@a@b%a001250「わたし　お父さんと\n\tお母さんと　お兄ちゃんが\n\tいっしょなら　こわくないの……。\n@c0@"
187:
  de: "@a%0%a001250@bGlaubst du, dass auch alle guten Monster verschwinden, wenn wir den Großmeister von Nadiria besiegen?\n@c0@"
  en: "@a%0%a001250@bDo you think all the good monsters will vanish if we manage to defeat the Grandmaster of Nadiria?\n@c0@"
  es: "@a%0%a001250@b¿Crees que los monstruos buenos desaparecerán si ganamos al Gran Maestro de Nadiria?\n@c0@"
  fr: "@a%0%a001250@bTu crois que tous les gentils monstres vont disparaître si on réussit à vaincre le Grand\nMaître de Nadiriaⓡ\n@c0@"
  it: "@a%0%a001250@bCredi che i mostri buoni scompariranno se sconfiggeremo il Gran Maestro di Nadiria?\n@c0@"
  ja: "@a@b%a001250「大魔王を　たおしたら\n\tいい魔物さんも\n\tいなくなっちゃうのかな……。\n@c0@"
188:
  de: "@a%0%a001250@bUuuh... Ganz schön unheimlich, dass die Macht des Großmeisters von Nadiria auch in unsere Welt überschwappt...\n@c0@"
  en: "@a%0%a001250@bUh-hu-hurgh... It's scary thinking that the Grandmaster of Nadiria's power is seeping\ninto our world too.\n@c0@"
  es: "@a%0%a001250@bUh-hu-hurgh... Da miedo pensar que el poder del Gran Maestro de Nadiria se está filtrando a nuestro mundo.\n@c0@"
  fr: "@a%0%a001250@bOuh là là... Ça fiche vraiment la frousse d'imaginer que le pouvoir du Grand Maître de Nadiria s'insinue aussi dans notre monde.\n@c0@"
  it: "@a%0%a001250@bIl pensiero che il potere malvagio del Gran Maestro di Nadiria sta contaminando il nostro mondo mi fa venire i brividi...\n@c0@"
  ja: "@a@b%a001250「こわい……\n\tこっちの世界にも　大魔王の\n\tチカラが　届いてるみたい……。\n@c0@"
189:
  de: "@aSancho@bDu wirst deinen alten Onkel Sancho doch jetzt nisst zurücklassen, Chico!\n@c0@"
  en: "@aSancho@bYou no leave your Uncle Sancho behind at thees, the last hour!\n@c0@"
  es: "@aSancho@b¡Ándale, no dejes atrás a tu tito Sancho en esta última hora!\n@c0@"
  fr: "@aSancho@bNe laisse pas t-tonton Sancho derrière t-toi\nm-maintenant, dans ces d-derniers instantsⓠ\n@c0@"
  it: "@aSancho@b¡Por favor, no lasciare indietros el tuo caro zio Sancho proprio en los momentos más importantes!\n@c0@"
  ja: "@a@bサンチョ「今さら　私を留守番になんて\n\tしないでくださいよ！\n@c0@"
190:
  de: "@aSancho@bIss muss das Ganze zu Ende bringen, sonst werde iss nie Ruhe finden.\n@c0@"
  en: "@aSancho@bI must esee the end of thees now, or I no die\r\nhappy.\n@c0@"
  es: "@aSancho@b¡Debo ver cómo acaba esta historia o no moriré feliz!\n@c0@"
  fr: "@aSancho@bJe dois voir la fin de t-tout ça, ou je ne mourrai\r\np-pas heureux.\n@c0@"
  it: "@aSancho@b¡Voglio vedere con los mios ojos la fine de esta avventura!\n@c0@"
  ja: "@a@bサンチョ「ここまで来たら\n\t最後まで見届けなければ\n\t死んでも　死にきれません！\n@c0@"
191:
  de: "@aSancho@bIss habe miss noch nie so mächtig gefühlt, selbst damals nisst, als iss mit Señor Ludwig unterwegs war.\n@c0@"
  en: "@aSancho@bI never feel the power like thees before, even when I am travelling weeth señor Pankraz.\n@c0@"
  es: "@aSancho@bNi siquiera al viajar con el señor Teudis sentí un poder como este.\n@c0@"
  fr: "@aSancho@bJe n'avais j-jamais ressenti une p-puissance pareille, même quand je v-voyageais avec\r\nle señor Petros.\n@c0@"
  it: "@aSancho@bNemmeno quando viaggiavo con el señor Russel me sentivo tanto fuerte y seguro.\n¡Ho un presentimento muy bueno, chico!\n@c0@"
  ja: "@a@bサンチョ「パパスさまの　お供のときも\n\tこれほどの　チカラは\n\t感じたことがありませんよ！\n@c0@"
192:
  de: "@aSancho@bMeine Majestät! Dein Onkel Sancho ist bereit! Sollen die Monster nur kommen! Iss fühle miss wieder wie ein junger Muchacho!\n@c0@"
  en: "@aSancho@bMy Majesty! Your Uncle Sancho, he ees ready to fight! I feel like I am the young man again!\n@c0@"
  es: "@aSancho@b¡Majestad! ¡Su tito Sancho está listo para luchar! ¡Me siento como mero chaval!\n@c0@"
  fr: "@aSancho@bMa Majestéⓠ Tonton Sancho est p-prêt à se battreⓠ Je me sens de nouveau c-comme oun jeune muchachoⓠ\n@c0@"
  it: "@aSancho@b¡Lo zio Sancho está pronto por la battaglia!\n¡Me sembra de essere tornato giovane!\n@c0@"
  ja: "@a@bサンチョ「%a000090王！\n\tこのサンチョ　なにやら\n\t若返ったようですぞ！！\n@c0@"
193:
  de: "@aSancho@bAuf nach Nadiria! Das Eisen muss schließliss geschmiedet werden, solange es heiß ist, no?\n@c0@"
  en: "@aSancho@bTo Nadiria!\nWe must beat the hot iron now!\n@c0@"
  es: "@aSancho@b¡A Nadiria!\n¡No dejemos pasar la ocasión!\n@c0@"
  fr: "@aSancho@bEn route pour N-N-Nadiriaⓠ\nIl faut b-battre le fer p-pendant qu'il est chaudⓠ\n@c0@"
  it: "@aSancho@b¡A Nadiria!\n¡Dobbiamo battere el fierro finché es caliente!\n@c0@"
  ja: "@a@bサンチョ「さあ　魔界へ行きましょう！\n\tこのサンチョ　ウデがなりますよ！\n@c0@"
194:
  de: "@aOtto@bAlso zurück nach Nadiria, was, %a000090?\n@c0@"
  en: "@aTuppence@bBack to Nadiria, is it, %a000090?\n@c0@"
  es: "@aAlazar@b¿De vuelta a Nadiria, %a000090?\n@c0@"
  fr: "@aInnocent@bOn retourne à Nadiria, n'est-ce pas, %a000090ⓡ\n@c0@"
  it: "@aSimon@bAllora torniamo a Nadiria, re %a000090?\n@c0@"
  ja: "@a@bピピン「%a000090さま　また\n\t魔界へ　行くんですよね？\n@c0@"
195:
  de: "@aOtto@bIhr habt eine gute Wahl mit mir getroffen, Eure Majestät!\n@c0@"
  en: "@aTuppence@bYou've made a wise choice picking me to come with you, Your Majesty!\n@c0@"
  es: "@aAlazar@b¡Habéis hecho bien en elegirme para acompañaros, Majestad!\n@c0@"
  fr: "@aInnocent@bVous avez pris la bonne décision en me choisissant pour vous accompagner, Votre Majestéⓠ\n@c0@"
  it: "@aSimon@bMaestà, ha fatto la cosa giusta a prendermi con lei, glielo garantisco!\nNon la deluderò, Sire!\n@c0@"
  ja: "@a@bピピン「魔界へのお供に\n\tボクを　えらんでくださるなんて\n\t%a000090さまも　お目が高い！\n@c0@"
196:
  de: "@aOtto@bIch bin wohl der einzige normale Humburger, der in die Unterwelt darf, was? Hach, was bin ich für ein Glückspilz!\n@c0@"
  en: "@aTuppence@bI'm the only regular Gothan who gets to go to the underworld, aren't I? What a lucky chap I am!\n@c0@"
  es: "@aAlazar@bSoy el único en Pankraz que va a conocer el inframundo, ¿no? ¡Qué suerte tengo!\n@c0@"
  fr: "@aInnocent@bJe suis le seul habitant de Gotha à aller dans le monde souterrain, n'est-ce pasⓡ\nQuel veinard je faisⓠ\n@c0@"
  it: "@aSimon@bSono l'unico suddito di Denim che ha la possibilità di visitare il Regno degli Inferi. Non so se ritenermi molto onorato o dannatamente sfortunato...!\n@c0@"
  ja: "@a@bピピン「魔界へ行けるなんて\n\t一般の民では　ボクぐらいですよね！\n\tふっふっふっふ。\n@c0@"
197:
  de: "@aGriselda@bIch habe immer darauf vertraut, dass du mich retten würdest, %a000090.\n@c0@"
  en: "@aDebora@bI always had faith that you'd come and rescue me, %a000090.\n@c0@"
  es: "@aStefania@bSiempre confié en que vendrías al mio rescate, %a000090.\n@c0@"
  fr: "@aPandora@bJ'ai toujours eu la certitude que tu viendrais me sauver, %a000090.\n@c0@"
  it: "@aViola@bSapevo che saresti venuto a salvarmi, %a000090.\n@c0@"
  ja: "@a@bデボラ「私　%a000090なら\n\t絶対に　助けに来るって　信じていたわ。\n@c0@"
198:
  de: "@aGriselda@bWeil ich dich ja zu meinem Diener ausgebildet habe.\n㈡\nLeute auszubilden, ist eine meiner zahlreichen Stärken, weißt du. Ich bin praktisch so was wie ein Mentor.\n@c0@"
  en: "@aDebora@bI trained you well as my servant, so I had faith. Teaching people is one of my many fortes, you know. I'm something of a mentor.\n@c0@"
  es: "@aStefania@bTe enseñé bien como sirviente, así que tenía fe en ti. Enseñar a las personas es una de mis muchas virtudes. Sonno una especie de maestra.\n@c0@"
  fr: "@aPandora@bJe t'ai donné une bonne formation de serviteur,\nalors je n'avais aucun doute. Former les gens\nest l'un de mes nombreux points forts, tu sais.\n㈡\nJe suis un peu une sorte de mentor.\n@c0@"
  it: "@aViola@bNon avevo dubbi, perché ho instillato in te lo spirito del marito devoto che si getterebbe nel fuoco per la propria adorata mogliettina.\n@c0@"
  ja: "@a@bデボラ「しもべとしての　教育は\n\tしっかりと　してきたわけだしね。\n\t私　人にモノを教えるのが　上手なのよ。\n@c0@"
199:
  de: "@aGriselda@bIch hab meinen Augen kaum getraut, als ich sah, wie groß unsere Babys schon sind. Das macht mich ganz traurig.\n@c0@"
  en: "@aDebora@bI couldn't believe it when I saw how big the babies have grown. It makes me feel so sad.\n@c0@"
  es: "@aStefania@bCuando vi cómo habían crecido los bambini, no podía creerlo. Me hizo sentir triste.\n@c0@"
  fr: "@aPandora@bJe n'en croyais pas mes yeux quand j'ai vu\r\nà quel point nos bébés avaient grandi.\r\nÇa me rend tellement triste.\n@c0@"
  it: "@aViola@bI nostri figli sono diventati un ometto e una signorina grandi e forti...\n@c0@"
  ja: "@a@bデボラ「赤ん坊だった　あの子たちが\n\tずいぶん　大きくなっていて\n\t本当に　おどろいたし　くやしかったわ。\n@c0@"
200:
  de: "@aGriselda@bIch hätte sie doch so gerne aufwachsen sehen. Das einzig Positive an der ganzen Sache ist, dass ich immer noch so jung wie damals bin...\n@c0@"
  en: "@aDebora@bI wish I could've been there to see them grow up.\r\nThe only saving grace of the situation is that I'm still as young as I was all those years ago.\n@c0@"
  es: "@aStefania@bVeramente, me gustaría haberlos visto crecer.\nLo único positivo de la situazione es que yo sigo igual de joven que entonces.\n@c0@"
  fr: "@aPandora@bSi seulement j'avais pu être là pour les voir grandir.\n㈡\nLa seule chose qui rattrape un peu cette situation, c'est que je suis toujours aussi jeune qu'il y a toutes ces années.\n@c0@"
  it: "@aViola@bRimanere pietrificata per tanti anni mi ha tolto la gioia di vederli crescere, e ciò mi fa soffrire molto...\nPerò c'è anche un lato positivo!\n㈡\nLa roccia non invecchia, quindi ho lo stesso aspetto che avevo il giorno in cui venni trasformata in una statua! Non tutto il male viene per nuocere, eh?\n@c0@"
  ja: "@a@bデボラ「子供たちが　育つところを\n\t自分の目で　見られなかったわけだし。\n\t若いままで　いられたことだけが　救いよ。\n@c0@"
201:
  de: "@aGriselda@bWir müssen alles tun, um nach Nadiria zu gelangen und deine Mutter zu retten, %a000090.\n@c0@"
  en: "@aDebora@bWe have to do all we can to go to Nadiria and rescue your mother, %a000090.\n@c0@"
  es: "@aStefania@bTenemos que hacer cuanto podamos para llegar a Nadiria y rescatar a la tua mamma, %a000090.\n@c0@"
  fr: "@aPandora@bNous devons faire tout notre possible pour nous rendre à Nadiria et sauver ta mère, %a000090.\n@c0@"
  it: "@aViola@bDobbiamo andare a Nadiria, %a000090.\nVedrai che troveremo tua madre.\n@c0@"
  ja: "@a@bデボラ「なんとしてでも　魔界へ行って\n\t%a000090のママを　助けるわよ。\n@c0@"
202:
  de: "@aGriselda@bDann kann ich diesen Kerlen endlich heimzahlen, was sie mir angetan haben!\n@c0@"
  en: "@aDebora@bThen I'll be able to make those fiends pay for what they did to me.\n@c0@"
  es: "@aStefania@bEntonces podré hacer que esos perfidi paguen caro lo que me hicieron.\n@c0@"
  fr: "@aPandora@bEnsuite, je pourrai faire payer ces démons pour ce qu'ils m'ont fait.\n@c0@"
  it: "@aViola@bE la faremo pagare cara a coloro che ci hanno causato tante sofferenze!\n@c0@"
  ja: "@a@bデボラ「それがすんだら　この私を\n\tあんな目に　あわせてくれた連中に\n\tこの怒りを　思い知らせてやるの。\n@c0@"
203:
  de: "@aGriselda@bDas Tor nach Nadiria ist offen. Zeit, aufzubrechen, %a000090.\n@c0@"
  en: "@aDebora@bThe entrance to Nadiria is open.\nIt's time to go, %a000090.\n@c0@"
  es: "@aStefania@bLa entrada a Nadiria está aperta.\nEs hora de partire, %a000090.\n@c0@"
  fr: "@aPandora@bL'entrée de Nadiria est ouverte.\nIl est temps d'y aller, %a000090.\n@c0@"
  it: "@aViola@bSiamo riusciti ad aprire il varco per Nadiria, %a000090.\nSe sei pronto, direi di andare.\n@c0@"
  ja: "@a@bデボラ「魔界への入り口は　開いたわ。\n\t行くわよ　%a000090。\n@c0@"
204:
  de: "@aGriselda@bBisher habe ich ja nie an das Glück geglaubt.\n@c0@"
  en: "@aDebora@bI never believed in luck until now.\n@c0@"
  es: "@aStefania@bHasta ahora, no creía en il destino.\n@c0@"
  fr: "@aPandora@bJe n'avais jamais cru au destin jusqu'à présent.\n@c0@"
  it: "@aViola@bNon avevo mai creduto al destino...\n@c0@"
  ja: "@a@bデボラ「私　運命なんてものは\n\tこれまで　信じていなかったけど……\n@c0@"
205:
  de: "@aGriselda@bAber zwei der Ringe, die das Tor nach Nadiria öffnen, sind unsere Hochzeitsringe!\n@c0@"
  en: "@aDebora@bBut two of the rings that open the path to Nadiria are our wedding rings!\n@c0@"
  es: "@aStefania@b¡Pero due de los anillos que han abierto el camino a Nadiria son nuestras alianzas de boda!\n@c0@"
  fr: "@aPandora@bMais deux des anneaux qui ouvrent le chemin vers Nadiria sont nos alliancesⓠ\n@c0@"
  it: "@aViola@bPoi ho scoperto che le nostre fedi nuziali erano due degli anelli che servivano per aprire il varco per Nadiria!\n@c0@"
  ja: "@a@bデボラ「魔界のトビラを開くリングのうち\n\t２つが　私たちの　結婚指輪なのよね。\n@c0@"
206:
  de: "@aGriselda@bSo viel Zufall kann es nicht geben! Offenbar wollte es das Schicksal, dass du mein Diener wirst.\n@c0@"
  en: "@aDebora@bIt seems a little too much of a coincidence to me.\r\nYou were obviously destined to become my servant.\n@c0@"
  es: "@aStefania@bNo puede ser una coincidencia.\nTú estabas predestinato a convertirte en mi sirviente.\n@c0@"
  fr: "@aPandora@bC'est un peu trop énorme pour n'être qu'une coïncidence. Tu étais de toute évidence destiné\r\nà devenir mon serviteur.\n@c0@"
  it: "@aViola@bNon può essere una semplice coincidenza, %a000090. Era scritto nel destino che quegli anelli dovevano essere uniti...\n㈡\nCosì com'è ugualmente scritto nel destino che devi servirmi e riverirmi come una regina!\n@c0@"
  ja: "@a@bデボラ「なんか　出来すぎてるわ。\n\tやっぱり　あんたは　私のしもべに\n\tなるべき男だったのね。\n@c0@"
207:
  de: "@aGriselda@bWenn die Vorbereitungen abgeschlossen sind, sollten wir aufbrechen. Die Zeit steht schließlich nicht still.\n@c0@"
  en: "@aDebora@bIf the preparations are done, then we should get going. Time waits for no man.\n@c0@"
  es: "@aStefania@bSi hemos finito los preparativos, tenemos que ponernos en marcha. El tiempo no espera a nadie.\n@c0@"
  fr: "@aPandora@bSi les préparatifs sont terminés, nous devrions\r\ny aller. Le temps presse.\n@c0@"
  it: "@aViola@bSe pensi di aver finito con i preparativi, suggerisco di muoverci.\nNon credo che abbiamo molto tempo...\n@c0@"
  ja: "@a@bデボラ「用意が　整ったのなら\n\tさっさと　行くわよ。\n\t時間は　待ってくれないんだから。\n@c0@"
