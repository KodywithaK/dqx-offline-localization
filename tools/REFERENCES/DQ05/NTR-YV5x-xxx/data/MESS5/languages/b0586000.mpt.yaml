  ja: "@a@bピピン「ほら　もったいつけて\n\t最初はムリだって言う人\n\tよく　いるじゃないですか。\n@c0@"
89:
  de: "@aOtto@bWenn wir Zeit zum Nachdenken brauchen, %a000090, könnten wir das doch in Gegenwart der hübschen Elfen von Feenaue machen, oder?\n@c0@"
  en: "@aTuppence@bIf you need some time to mull things over, %a000090, at least let's mull them over in the presence of the pretty little faeries of Faerie Lea.\n@c0@"
  es: "@aAlazar@bSi necesitáis tiempo para pensaros las cosas, %a000090, mejor hacerlo en presencia de las hermosas moradoras de Hadavilla.\n@c0@"
  fr: "@aInnocent@bS'il vous faut un peu de temps pour réfléchir, %a000090, allons au moins réfléchir en présence des jolies petites fées de Féeria.\n@c0@"
  it: "@aSimon@bMaestà, se ha bisogno di riflettere, perché non lo fa a Domus Fatae? Così lei potrà pensare con calma, mentre io parlerò con le belle fatine che vivono lì!\n@c0@"
  ja: "@a@bピピン「%a000090さま。\n\tどうせなやむなら　妖精の城で。\n\t美女のそばで　なやみましょう！\n@c0@"
90:
  de: "@a%0%a001240@bPapa... Woher kommt diese Goldkugel so plötzlich? Ich verstehe das nicht...\n@c0@"
  en: "@a%0%a001240@bDad... Where did this gold orb suddenly appear from? I don't get it.\n@c0@"
  es: "@a%0%a001240@bPapá... ¿de dónde ha salido de repente este orbe de oro? No lo entiendo.\n@c0@"
