  it: "@a%0%a001240@bCredi che adesso il Castello di Zenithia tornerà a volare in cielo?\n@c0@"
  ja: "@a@b%a001240「でも　これで\n\t天空城が　浮かぶんだよね……。\n\t……ホントかなあ。\n@c0@"
92:
  de: "@a%0%a001250@bDu siehst ein wenig traurig aus, Papa.\n@c0@"
  en: "@a%0%a001250@bYou look a bit sad, Dad.\n@c0@"
  es: "@a%0%a001250@bPareces triste, papá.\n@c0@"
  fr: "@a%0%a001250@bTu as l'air un peu triste, papa.\n@c0@"
  it: "@a%0%a001250@bPapà, mi sembri triste...\n@c0@"
  ja: "@a@b%a001250「お父さん　ちょっと\n\t元気ないね……。\n@c0@"
93:
  de: "@a%0%a001250@bHier. Du kannst mich an der Hand nehmen.\n@c0@"
  en: "@a%0%a001250@bHere. I'll let you hold my hand.\n@c0@"
  es: "@a%0%a001250@bToma. Te dejo que me cojas la mano.\n@c0@"
  fr: "@a%0%a001250@bTiens. Je vais te tenir la main, si tu veux.\n@c0@"
  it: "@a%0%a001250@bDai, prendimi la mano.\n@c0@"
  ja: "@a@b%a001250「えへへ…　お父さん。\n\t手を　つないであげるね。\n@c0@"
94:
  de: "@aSancho@bDiese kleine Kugel... Glaubst du wirkliss, dass sie die Macht hat, das Castillo in die Lüfte zu heben?\n@c0@"
  en: "@aSancho@bThees esmall orb, you believe eet really has the power to make the castle fly?\n@c0@"
