0:
  de: "@a%0%a001240@bGluck... Gluck... Moment mal! Ich kann ja atmen! Und das, obwohl ich unter Wasser bin!\n@c0@"
  en: "@a%0%a001240@bGlug... Glug... Hang on! I can breathe! I was sure\nI wouldn't be able to, what with being underwater and all.\n@c0@"
  es: "@a%0%a001240@bGlub... Glub... ¡Un momento! ¡Puedo respirar! Estaba seguro de que no podríaⓓ claro, al estar debajo del agua...\n@c0@"
  fr: "@a%0%a001240@bGlou... Glou... Attendsⓠ Je peux respirerⓠ Je croyais que je ne pourrais pas, vu qu'on est sous l'eau.\n@c0@"
  it: "@a%0%a001240@bGlug... Glug...\nEhi! Ma qui si respira!\nCom'è possibile, eh?! Siamo sott'acqua...\n@c0@"
  ja: "@a@b%a001240「う…　うくくっ…　ぷはぁ！\n\tあれ？　息ができるよ。\n\t水の中だから　ボク　てっきり……。\n@c0@"
1:
  de: "@a%0%a001250@bSieh nur! Hast du den riesigen Fisch gesehen?\n@c0@"
  en: "@a%0%a001250@bLook! Did you see that huge fish just swim past?\n@c0@"
  es: "@a%0%a001250@b¡Mira! ¿Has visto pasar a ese enorme pez?\n@c0@"
  fr: "@a%0%a001250@bHéⓠ Tu as vu ce gros poisson qui vient de passerⓡ\n@c0@"
  it: "@a%0%a001250@bQuel pesce era gigantesco!\nSe lo avessimo preso, lo zio Sancho ci avrebbe preparato una paella per un intero esercito!\n@c0@"
  ja: "@a@b%a001250「見て！\n\t今　大きなお魚さんが　とおったよ！\n@c0@"
2:
  de: "@aOtto@bDieses Schloss ist ziemlich schwer zu verteidigen. Na ja, wahrscheinlich schwebt es deshalb normalerweise im Himmel...\n@c0@"
  en: "@aTuppence@bThis looks rather a tricky place to defend.\r\nAaah! I suppose that's why they had it floating\r\nup in the sky.\n@c0@"
  es: "@aAlazar@bEste sitio no parece fácil de defender.\n¡Aaah! Supongo que es por eso que lo tenían flotando en el cielo.\n@c0@"
  fr: "@aInnocent@bÇa ne doit pas être facile à défendre comme château. Aaah, mais c'est sans doute pour ça\r\nqu'ils l'avaient fait flotter dans le ciel.\n@c0@"
  it: "@aSimon@bUhm, a occhio e croce questo posto non è facilmente difendibile. Dev'essere per questo motivo che avevano deciso di farlo fluttuare in cielo...\n@c0@"
  ja: "@a@bピピン「警備しにくそうなお城ですねえ。\n\tそうか！　だから\n\t空に浮かんでいたのか！\n@c0@"
3:
  de: "@aDr. Ache@bDas ist einfach zu viel für einen alten Zenithianer wie mich, i-ich... (Schluchz)\n㈡\nHa ha ha! Hab mir nur ein kleines Scherzchen erlaubt! Ich würde doch nicht vor Euren Augen flennen, oder?\n@c0@"
  en: "@aDr Agon@bIt's, it's enough to make an old fella cry, I, I... (sob)\r\nAh ha ha! Just joshin' with ya!\r\nI'm not really blubbing!\n@c0@"
  es: "@aDr. Agón@bEs para hacer llorar a cualquiera. Yo... Yo... (snif)\n¡Ja, ja, ja! ¡Te estaba tomado el pelito!\n¡No lloraba ni nada!\n@c0@"
  fr: "@aDr Agon@bC'est le genre de spectacle qui vous met la larme à l'œil... (sanglot) Ha ha haⓠ Je vous faisais marcherⓠ Je ne vais pas me mettre à pleurerⓠ\n@c0@"
  it: "@aDr. Agon@bAh, che bello essere a casa!\n@c0@"
  ja: "@a@bプサン「うっ　うっ。\n\tなつかしくて　つい涙が……\n\tいえ　ウソ泣きですけど。\n@c0@"
4:
  de: "@aDr. Ache@bSo, dem alten Schloss steht das Wasser ganz schön bis zum Hals, was? Ha ha! Wird das ein Spaß, es trockenzulegen!\n@c0@"
  en: "@aDr Agon@bSo the old castle's as waterlogged as a log full of water, eh? It's gonna be fun, fun, fun drying the place out. Away with you mould! Away!\n@c0@"
  es: "@aDr. Agón@bAsí que el castillito está inundado como... como un castillito inundado, ¿no? Va a ser divertido divertidísimo secarlo. ¡Fuera de aquí, moho! ¡Adiós!\n@c0@"
  fr: "@aDr Agon@bAlors comme ça, ce vieux château a pris le bouillonⓡ On va bien s'amuser à faire sécher tout ça.\nSus au moisiⓠ\n@c0@"
  it: "@aDr. Agon@bSanta fiamma!\nIl castello è un po' umido, eh?!\nChissà quanto ci vorrà per farlo asciugare...\n@c0@"
  ja: "@a@bプサン「天空城も　水びたしか。\n\tあとで　よーく干さなくては。\n\tカビだらけは　イヤですからね。\n@c0@"
5:
  de: "@a%0%a001240@bDas soll Zenithia sein, das Schloss im Himmel? Das hab ich mir irgendwie anders vorgestellt...\n@c0@"
  en: "@a%0%a001240@bIs this Zenithia, the castle in the sky?\nIt's a bit different to how I expected.\n@c0@"
  es: "@a%0%a001240@b¿Esto es Zenithia, el castillo del cielo?\nEs un poco distinto de lo que esperaba.\n@c0@"
  fr: "@a%0%a001240@bC'est Zénithia, le château qui flottait dans le cielⓡ\nCe n'est pas vraiment ce à quoi je m'attendais.\n@c0@"
  it: "@a%0%a001240@bQuesto è il Castello di Zenithia, il maniero che prima svolazzava tra le nuvole?\nChe delusione... Credevo che fosse molto più bello...\n@c0@"
  ja: "@a@b%a001240「これが　天空城？\n\tちょっと　想像してたのとは\n\tちがったかなあ……。\n@c0@"
6:
  de: "@a%0%a001250@bWarum können wir hier eigentlich atmen? Und warum ist es hier so hell, wo doch alles unter Wasser ist?\n@c0@"
  en: "@a%0%a001250@bIs it just around the castle that there's air?\nIt's a lot brighter than you'd expect for\nsomewhere that's underwater.\n@c0@"
  es: "@a%0%a001250@b¿Solo hay aire alrededor del castillo?\nHay mucha más luz de lo que uno esperaría para estar debajo del agua.\n@c0@"
  fr: "@a%0%a001250@bIl n'y a qu'autour du château qu'il y a de l'airⓡ\nEt il fait beaucoup plus clair que ce à quoi je m'attendais à une telle profondeur.\n@c0@"
  it: "@a%0%a001250@bSembra che intorno al castello ci sia una bolla d'aria...\nE non credevo che sott'acqua filtrasse tanta luce!\n@c0@"
  ja: "@a@b%a001250「お城のまわりだけ\n\t空気があるの？\n\t水の中って　思ったより明るいのね。\n@c0@"
7:
  de: "@aSancho@bAber es ist doch gut, dass es in die See gefallen ist, no?\n@c0@"
  en: "@aSancho@bBut ees good ees een the lake, no?\n@c0@"
  es: "@aSancho@bÁndale, pues está bien que esté en el lago.\n@c0@"
  fr: "@aSancho@bMais c-c'est bueno qu'il soit dans le lac, noⓡ\n@c0@"
  it: "@aSancho@bPer fortunas el castillo es precipitato en un lagos...\n@c0@"
  ja: "@a@bサンチョ「しかし　うまいこと\n\t湖に落ちて　よかったですよ。\n@c0@"
8:
  de: "@aSancho@bWenn es gelandet wäre auf Land oder eine Stadt, wären vielleisst Menschen verletzt worden...\n@c0@"
  en: "@aSancho@bEef ees falling on the land or on a town, maybe ees a beeg problem, sí?\n@c0@"
  es: "@aSancho@bSi hubiese caído sobre tierra o sobre ciudad, sería un problema de verdad.\n@c0@"
  fr: "@aSancho@bS'il était t-t-tombé par terre ou sur oune ville,\nça aurait fait de g-gros problèmesⓠ\n@c0@"
  it: "@aSancho@b¡Si se fosse eschiantato su un terreno roccioso o su un villaggio sarebbe estato un vero macellos!\n@c0@"
  ja: "@a@bサンチョ「村や町の上に\n\t落ちていたら　ひどいことに\n\tなっていたでしょう。\n@c0@"
9:
  de: "@aDr. Ache@bNanu? Lag das Schloss vor zwanzig Jahren auch schon hier? Ich kann mich einfach nicht erinnern...\n@c0@"
  en: "@aDr Agon@bWhat's that? Was this castle airborne twenty years ago? I can't tell you, friend.\n@c0@"
  es: "@aDr. Agón@b¿Cómo dices? ¿Que si este castillito estaba en el aire hace veinte años? No te lo sabría decir, amiguito.\n@c0@"
  fr: "@aDr Agon@bCommentⓡ Si ce château était dans le ciel il y a une vingtaine d'annéesⓡ Je n'en sais strictement rien.\n@c0@"
  it: "@aDr. Agon@bNon so dire con precisione quanto tempo fa il castello sia precipitato nel lago...\n@c0@"
  ja: "@a@bプサン「２０年前は　この城も\n\t浮かんでたのかって？\n\tさあ　知りません。\n@c0@"
10:
  de: "@aDr. Ache@bMal überlegen... Vor wie vielen Jahrzehnten hab ich Zenithia überhaupt verlassen? Ach, ich Dummerchen! Ich hab ganz vergessen zu zählen!\n@c0@"
  en: "@aDr Agon@bLet me see... How many decades ago did I leave now? Oooh... I guess I wasn't counting!\n@c0@"
  es: "@aDr. Agón@bVeamos... ¿Cuántas décadas hace que me fui?\nOooh... ¡Creo que he perdido la cuentecilla!\n@c0@"
  fr: "@aDr Agon@bVoyons... Depuis combien d'années je suis partiⓡ Oooh... Je crois que je n'ai pas comptéⓠ\n@c0@"
  it: "@aDr. Agon@bLo abbandonai molti decenni fa per...\nPer... Ehm...\nPer ⓕmotivi personaliⓖ. Ehm, proprio così...\n@c0@"
  ja: "@a@bプサン「私が　この城を出たのは\n\tええと　何十年前だっけ？\n\tそういや　数えてなかったな。\n@c0@"
11:
  de: "@a%0%a001240@bWelch ein schauriger Anblick. Es ist doch schrecklich, solch ein schönes Schloss in so einem Zustand zu sehen...\n@c0@"
  en: "@a%0%a001240@bI can't help feeling a bit down in the dumps here. It's sad to see something that was once so grand in such a state.\n@c0@"
  es: "@a%0%a001240@bMe siento un poco abatido aquí, no puedo evitarlo. Es triste ver algo que era magnífico en este estado.\n@c0@"
  fr: "@a%0%a001240@bCet endroit met un peu le moral dans les chaussettes. C'est triste de voir un bâtiment autrefois si grandiose en si mauvais état.\n@c0@"
  it: "@a%0%a001240@bCom'è ridotto male questo posto!\nE pensare che un tempo era un meraviglioso castello volante...\n@c0@"
  ja: "@a@b%a001240「なんだか　ここにいると\n\tさみしくなるよ。　天空のお城が\n\tこんなにボロボロだなんて……。\n@c0@"
12:
  de: "@a%0%a001250@bWahrscheinlich ist es nur Einbildung, aber ich hab den Eindruck, als sei es hier etwas heller geworden. Vielleicht weil wir gekommen sind, wer weiß?\n@c0@"
  en: "@a%0%a001250@bI could be wrong, but it feels like things have brightened up a little bit here. Maybe it's because\nwe came along.\n@c0@"
  es: "@a%0%a001250@bPuede que me equivoque, pero parece que las cosas se han animado. Quizá sea porque hemos venido nosotros.\n@c0@"
  fr: "@a%0%a001250@bJe me trompe peut-être, mais j'ai l'impression que tout est plus clair par ici. C'est peut-être parce qu'on vient d'arriver.\n@c0@"
  it: "@a%0%a001250@bNon so se è solo una mia impressione, ma mi pare che questo posto sia diventato un po' più luminoso da quando siamo arrivati...\n@c0@"
  ja: "@a@b%a001250「でも　このお城……\n\t少しだけだけど　元気　出たみたいよ。\n\tわたしたちが　来たからかな？\n@c0@"
13:
  de: "@aSancho@bWenn iss sehe solss eine Ort, verlassen und verfallen, muss iss immer an Steinach denken. Das ist so traurig...\n@c0@"
  en: "@aSancho@bWhen I esee thees kind of place, eso deserted and een the ruins, I can no help but theenk of Whealbrook. Ees, ees very painful.\n@c0@"
  es: "@aSancho@bCuando veo un sitio así, abandonado y en ruinas, nomás me acuerdo de Arroyofrío. Me duele el corazón...\n@c0@"
  fr: "@aSancho@bQuand j-je vois des endroits de ce genre, d-désert et en ruines, ça me rappelle R-R-Ruycelieu.\r\nEt ça fait de la peine.\n@c0@"
  it: "@aSancho@bEsto luego es muy malridotto y desolato...\nMe fa pensare a Valcava...\nYo... Yo me commuovos... ¡Sob!\n@c0@"
  ja: "@a@bサンチョ「こういう　くちはてた場所を\n\t見ると　サンタローズを\n\t思い出してしまって　いやですね……。\n@c0@"
14:
  de: "@aOtto@bIch frage mich, wo all die Zenithianerinnen hin sind. Äh... und die Zenithianer natürlich auch.\n@c0@"
  en: "@aTuppence@bI wonder where all the Zenithian ladies are hiding themselves. Er, and the men as well, of course.\n@c0@"
  es: "@aAlazar@bMe pregunto dónde se esconden las damas de Zenithia. Bueno, y los hombres, claro.\n@c0@"
  fr: "@aInnocent@bJe me demande où sont cachées toutes les Zénithiennes. Euh, et les Zénithiens aussi, bien sûr...\n@c0@"
  it: "@aSimon@bDove sono le Zenithiane, eh?! Dove sono?! Voglio vederle! Ehm, intendo dire che voglio vedere se sono in buone condizioni di salute... Già, proprio così...\n@c0@"
  ja: "@a@bピピン「天空人の女性　……いえ\n\t天空人さんは　どこにいるのかな？\n@c0@"
15:
  de: "@aDr. Ache@bEs heißt jetzt nicht mehr Zenithia, sondern Seenithia! Ha ha ha ha haⓚⓛ Oh. Hat Euch der Witz etwa nicht gefallen?\n@c0@"
  en: "@aDr Agon@bIt's not Zenithia now, eh?\nIt's Beneathia! Hah hah hah haⓚⓛ\nOh, you didn't like that one?\n@c0@"
  es: "@aDr. Agón@bAhora ya no será Zenithia, claro.\n¡Será Bajithia! ¡Ja, ja, ja, ja, ja!... Oh, vaya, ¿no te ha gustado?\n@c0@"
  fr: "@aDr Agon@bÇa ne ressemble plus vraiment à Zénithia, heinⓡ\nCe serait plutôt Abyssiaⓠ Ha ha ha ha...\nOh, visiblement, ça ne vous fait pas rire.\n@c0@"
  it: "@aDr. Agon@bSono certo che prima o poi il castello riprenderà il suo posto tra le nuvole... La fiamma di Zenithia tornerà ad ardere più calda e splendente che mai!\n@c0@"
  ja: "@a@bプサン「これじゃ　天空城じゃなくて\n\t水没城ですね。\n\tえ？　そのまんますぎですか？\n@c0@"
16:
  de: "@aDr. Ache@bIch kraule nicht so gerne, wisst ihr, Brustschwimmen ist mir viel lieber-didu.\n@c0@"
  en: "@aDr Agon@bI'm more of a breaststroke man than a crawler, myself. The crawl's so gosh-darned hard.\n@c0@"
  es: "@aDr. Agón@bYo prefiero la braza al crol, la verdad. El crol es muy cansadito.\n@c0@"
  fr: "@aDr Agon@bJe préfère la brasse au crawl.\r\nLe crawl, c'est vraiment trop dur.\n@c0@"
  it: "@aDr. Agon@bL'acqua non è il mio elemento preferito, lo confesso.\n@c0@"
  ja: "@a@bプサン「私　クロールよりも\n\t平泳ぎが得意なんです。\n@c0@"
17:
  de: "@aDr. Ache@bWie schade, dass ich meinen Badeanzug nicht dabei habe, sonst hätte ich Euch meine Schwimmkünste zeigen können!\n@c0@"
  en: "@aDr Agon@bShame I don't have my aqua jammies with me. I could've shown you my moves!\n@c0@"
  es: "@aDr. Agón@b¡Qué lastimilla haberme olvidado el traje de baño! ¡Te podría haber demostrado lo bien que lo hago!\n@c0@"
  fr: "@aDr Agon@bDommage que je n'ai pas mes braies de natation.\nVous auriez pu admirer ma techniqueⓠ\n@c0@"
  it: "@aDr. Agon@bPreferisco il fuoco. Il fuoco è caldo, è bello...\r\nIl fuoco brucia, arde, incendia...!\nEhm, forse mi sono lasciato prendere dalla foga...\n@c0@"
  ja: "@a@bプサン「あいにく　今日は水着を\n\t持っていないので\n\tお見せできませんけど。　ふふふ……。\n@c0@"
18:
  de: "@a%0%a001240@bIch hasse es ja, mein Zimmer aufzuräumen, aber ich glaube, von nun an werd' ich's immer tun.\n@c0@"
  en: "@a%0%a001240@bI've always hated tidying my room, but I'm going to make sure I do it from now on.\n@c0@"
  es: "@a%0%a001240@bNunca me ha gustado ordenar mi cuarto, pero a partir de ahora lo haré.\n@c0@"
  fr: "@a%0%a001240@bJ'ai toujours détesté ranger ma chambre, mais je promets que je ferai plus attention, maintenant.\n@c0@"
  it: "@a%0%a001240@bGiuro che d'ora in avanti controllerò sempre di aver chiuso tutti i rubinetti dell'acqua prima di uscire di casa!\n@c0@"
  ja: "@a@b%a001240「ボク　部屋のかたづけ\n\tキライだったんだけど\n\tこれからは　ちゃんとやるよ。\n@c0@"
19:
  de: "@a%0%a001240@bSchlösser sehen einfach viel besser aus, wenn sie aufgeräumt sind.\n@c0@"
  en: "@a%0%a001240@bCastles look much better when they're kept all nice.\n@c0@"
  es: "@a%0%a001240@bLos castillos tienen mucho mejor aspecto si están cuidados.\n@c0@"
  fr: "@a%0%a001240@bLes châteaux sont beaucoup plus jolis quand ils sont entretenus.\n@c0@"
  it: "@a%0%a001240@bNon voglio che il Castello di Denim faccia la fine di questo posto...\n@c0@"
  ja: "@a@b%a001240「お城は　きれいなほうが\n\tいいもんね。\n@c0@"
20:
  de: "@aSancho@bGlaubst du wirkliss, dass diese Castillo mal in die Luft war? Iss kann mir das nisst vorstellen...\n@c0@"
  en: "@aSancho@bYou really believe thees castle, eet was once floating een the air? I no eso esure...\n@c0@"
  es: "@aSancho@b¿De verdad crees que este castillo flotaba antes en el aire? Yo no estoy muy seguro...\n@c0@"
  fr: "@aSancho@bTu crois vraiment que le castel, il f-f-flottait dans l'airⓡ Je n'en suis pas convaincu...\n@c0@"
  it: "@aSancho@b¿Chico, piensi veramentes que esto castillo un tiempo fluttuava nel cielo?\nYo no soy tanto seguro...\n@c0@"
  ja: "@a@bサンチョ「本当に　このお城が\n\t空に　浮かんでいたんですかね？\n\tどうも　私には　信じられませんよ。\n@c0@"
21:
  de: "@aOtto@bIch hoffe sehr, dass meine Waffen und Rüstung nicht bald zu rosten anfangen bei all dem Wasser hier.\n@c0@"
  en: "@aTuppence@bI can't help worrying that my weapons and\r\narmour will rust away to nothing with all this\r\nwater about.\n@c0@"
  es: "@aAlazar@bCon toda esta agua, me preocupa que mis armas y mi armadura se oxiden.\n@c0@"
  fr: "@aInnocent@bJ'ai peur que mes armes et mon armure ne rouillent en un rien de temps avec toute cette eau.\n@c0@"
  it: "@aSimon@bCon tutta l'acqua che c'è in giro, dovrò passare una dose quadrupla di antiruggine sulle armi!\n@c0@"
  ja: "@a@bピピン「こう　水の多い所ばかり\n\t歩いていると　剣やよろいが\n\tサビそうで　イヤだなあ。\n@c0@"
22:
  de: "@aDr. Ache@bDideldum, dieser maritime Stil fängt an, mir zu gefallen!\n@c0@"
  en: "@aDr Agon@bYou know, I think I'm starting to like this\r\nunderwater look!\n@c0@"
  es: "@aDr. Agón@b¡Le estoy empezando a encontrar el gustillo a esta decoración submarina!\n@c0@"
  fr: "@aDr Agon@bVous savez quoiⓡ Je commence à bien aimer cette atmosphère sous-marine.\n@c0@"
  it: "@aDr. Agon@bNon amo l'acqua, ma riconosco che sia un elemento che presenta qualche innegabile vantaggio...\n@c0@"
  ja: "@a@bプサン「私は　今の水びたしも\n\tけっこう気に入ってますよ。\n@c0@"
23:
  de: "@aDr. Ache@bAber Ihr hättet das Schloss vorher sehen sollen. Der putzige Garten und dann erst der Thronsaal...\nHach, was war das hübsch!\n@c0@"
  en: "@aDr Agon@bBut you should have seen the place before.\r\nThe beautiful garden, the great throne room...\r\nIt was to die-diddly-eye for!\n@c0@"
  es: "@aDr. Agón@bPero deberías haber visto el lugar antes.\nEse precioso jardincillo, el gran salón del trono...\n¡Era para morirse de bonito!\n@c0@"
  fr: "@aDr Agon@bMais vous auriez dû voir cet endroit avant. Les jardins magnifiques, la grande salle du trône... C'était tellement beau, nom d'une pipeⓠ\n@c0@"
  it: "@aDr. Agon@bIn effetti, se non ci fosse l'acqua, non si potrebbero fare alcune cosine interessanti come bere, nuotare, lavarsi...\n@c0@"
  ja: "@a@bプサン「昔は　美しい庭園に\n\tりっぱな玉座の間の\n\tきれいな　お城でしたけど。\n@c0@"
24:
  de: "@aDr. Ache@bVielleicht ein wenig feucht hier unten, aber das Schloss ist immer noch dasselbe. Keine Monster weit und breit!\n@c0@"
  en: "@aDr Agon@bIt's a bit damp, but it's still the same old castle.\nNo monsters around here!\n@c0@"
  es: "@aDr. Agón@bHay un poco de humedadcilla, pero es el mismo castillo que era.\n¡No hay monstruitos por aquí!\n@c0@"
  fr: "@aDr Agon@bC'est un peu plus humide, mais c'est toujours le même château. Il n'y a pas de monstres par iciⓠ\n@c0@"
  it: "@aDr. Agon@bAnche se è un po' umidino, il castello è sicuro come sempre: non c'è nemmeno l'ombra di un mostro.\n@c0@"
  ja: "@a@bプサン「しけっても　天空城。\n\tさすがに　魔物たちは\n\t近づけないみたいですね。\n@c0@"
25:
  de: "@a%0%a001240@bEine geheime Treppe? Ich werde sie finden, Papa! Wehe, du findest sie vor mir...\n@c0@"
  en: "@a%0%a001240@bA secret staircase? I'll find it, Dad!\nDon't you go finding it first, okay?\n@c0@"
  es: "@a%0%a001240@b¿Una escalera secreta? ¡Yo la encontraré, papá!\nNo la vayas a encontrar tú antes, ¿vale?\n@c0@"
  fr: "@a%0%a001240@bUn escalier secretⓡ Je vais le trouver, papaⓠ\nTu me laisses chercher, d'accordⓡ\n@c0@"
  it: "@a%0%a001240@bUna scala segreta?\nPapà, facciamo a chi la trova prima, dai!\n@c0@"
  ja: "@a@b%a001240「えっ？　ヒミツの階段？\n\tボクが見つけるから\n\tお父さんは　見つけないでね！\n@c0@"
26:
  de: "@a%0%a001250@bGlaubst du, er darf uns solch ein Geheimnis erzählen?\n@c0@"
