46:
  de: "@aSancho@b...\n@c0@"
  en: "@aSancho@b............\n@c0@"
  es: "@aSancho@b...\n@c0@"
  fr: "@aSancho@b............\n@c0@"
  it: "@aSancho@b...\n@c0@"
  ja: "@a@bサンチョ「………………。\n@c0@"
