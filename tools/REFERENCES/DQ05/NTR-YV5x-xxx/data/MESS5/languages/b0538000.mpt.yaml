  it: "@a%0%a001250@bPerché mai ci avrà rivelato un segreto del genere?\nForse ci è grato perché lo abbiamo fatto scendere dal carrello?\n@c0@"
  ja: "@a@b%a001250「そんな　ヒミツなこと\n\tわたしたちに　言っていいの？\n@c0@"
27:
  de: "@aOtto@bHier solltet Ihr besser net auf mich zählen, %a000090. Ich war nie besonders gut darin, Dinge zu finden. \n@c0@"
  en: "@aTuppence@bYou'd better count me out. I was never any good at finding things. I never liked it.\nOver to you, %a000090...\n@c0@"
  es: "@aAlazar@bNo contéis conmigo. Siempre he sido un desastre encontrando cosas. No me gusta hacerlo.\nTodo vuestro, %a000090...\n@c0@"
  fr: "@aInnocent@bNe comptez pas trop sur moi. J'ai toujours été nul pour trouver des trucs. Et je n'ai jamais aimé ça.\nJe laisse ça à vos bons soins, %a000090...\n@c0@"
