  ja: "@a@b%a001250「妖精さんに　会えるの？\n\tうれしい　わたし　楽しみ！\n@c0@"
54:
  de: "@a%0%a001250@bIch hoffe, dass wir bald ein paar Feen sehen werden. Oh! Du hast schon ein paar kennengelernt, als du klein warst, stimmt's, Papa? Hast du ein Glück!\n@c0@"
  en: "@a%0%a001250@bI hope we get to meet some faeries soon. Ooh! You met some when you were little, Dad? You're so lucky!\n@c0@"
  es: "@a%0%a001250@bEspero que encontremos pronto a las hadas. ¡Oooh! ¿Que tú conociste unas hadas cuando eras niño, papá? ¡Qué suerte!\n@c0@"
