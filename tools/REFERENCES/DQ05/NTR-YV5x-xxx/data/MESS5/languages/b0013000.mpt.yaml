  ja: "@a@bデスじい「なんと！　たった\n\tそれっぽっちしか\n\t名産品を　持っておらんのか！\n@c0@"
215:
  de: "@aFranz Firle@bAber ich würde es gern mal sehen, dieses schönste aller Souvenirs. Ich glaube, es ist irgendwo in König Dominicus' Domäne.\n@c0@"
