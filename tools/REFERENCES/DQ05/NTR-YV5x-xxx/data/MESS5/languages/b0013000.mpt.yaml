  it: "@a@b*: Salve! %H0860%XStai cercando la banca? Allora sei%YState cercando la banca? Allora siete%Z nel posto giusto!\n@c0@"
  ja: "@a@b＊「つけもの石がわりにしたら\n\tおもすぎて　おつけものが\n\tコナゴナ…。\n@c0@"
171:
  de: "@a@b*: Ich verwahre alle Einzahlungen der Kunden ganz sorgsam auf. In meiner eigenen Tasche, genauer gesagt!\n@c0@"
  en: "@a@b*: I keep all customer deposits very carefully indeed. Inside my own pocket, in fact!\n@c0@"
  es: "@a@b*: Soy muy cuidadoso con los depósitos de mis clientes. ¡Los guardo en mis propios bolsillos!\n@c0@"
  fr: "@a@b*ⓢ Je veille avec beaucoup d'attention sur les économies de mes clients. En fait, je les mets dans mes propres pochesⓠ\n@c0@"
  it: "@a@b*: Mi prendo personalmente cura dei depositi dei nostri clienti. Li tengo in un posto sicuro: le mie tasche! E non esiste un posto più sicuro di questo!\n@c0@"
  ja: "@a@b＊「まな板がわりにしたら\n\t包丁が　ボロボロになっちゃって！\n@c0@"
172:
  de: "@a@b*: Also keine Sorge! Euer Geld ist bei mir sicher. Ihr könnt es mir ruhig anvertrauen!\n@c0@"
  en: "@a@b*: So relax, place your trust in me,\r\nand deposit away!\n@c0@"
  es: "@a@b*: ¡Así que %H0860%Xpuedes relajarte%Ypodéis relajaros%Z, confiar en mí y depositar los que %H0860%Xquieras%Yqueráis%Z!\n@c0@"
  fr: "@a@b*ⓢ Alors ne vous inquiétez pas. Faites-moi confiance et déposez vos économiesⓠ\n@c0@"
  it: "@a@b*: %H0860%XRilassati e affidami pure i tuoi risparmi. Con me dormirai%YRilassatevi e affidatemi pure i vostri risparmi. Con me dormirete%Z tra quattro guanciali!\n@c0@"
  ja: "@a@b＊「あんなものは　とっくの昔に\n\t銀行のおじさんに\n\tあげちゃったわよ。\n@c0@"
173:
  de: "@a@b*: Das Ding, das ich von der Frau in der Herberge bekommen habe, war so undurchdringlich, dass ich dachte, es würde einen wunderbaren Schild abgeben.\n@c0@"
  en: "@a@b*: That thing I got from the woman at the inn was so solid that I thought it would make an excellent shield.\n@c0@"
  es: "@a@b*: Ese objeto que me dio la mujer de la posada era tan macizo que pensé que sería perfecto como escudo.\n@c0@"
  fr: "@a@b*ⓢ Le truc que m'a donné la propriétaire de l'auberge était si dur que j'ai pensé que ça ferait un super bouclier.\n@c0@"
  it: "@a@b*: Sì, la locandiera mi aveva regalato un oggetto insolito. Era molto resistente, così avevo pensato che potesse essere usato come scudo.\n@c0@"
  ja: "@a@b＊「いらっしゃいませ。\n\t銀行は　こちらですよ。\n@c0@"
174:
  de: "@a@b*: Aber es war viel zu schwer. Niemand, den ich kenne, könnte so was die ganze Zeit mit sich herumschleppen!\n@c0@"
  en: "@a@b*: But it was far too heavy for anyone I know to be carting around all the time!\n@c0@"
  es: "@a@b*: ¡Pero era demasiado pesado para llevarlo de aquí para allá!\n@c0@"
  fr: "@a@b*ⓢ Le problème, c'est que c'était trop lourd.\nJe ne connais personne qui aurait pu se trimballer avec ça toute la journéeⓠ\n@c0@"
  it: "@a@b*: Niente di più sbagliato!\nEra talmente pesante che nemmeno il più forte dei guerrieri avrebbe mai potuto portarlo in giro!\n@c0@"
  ja: "@a@b＊「お客さまから　預かったお金は\n\t大切に　私のポケットに\n\tしまっています。\n@c0@"
175:
  de: "@a@b*: Hier war es mir im Weg, also habe ich es schließlich rausgeworfen.\n@c0@"
  en: "@a@b*: It was in my way in here, so I dumped it outside in the end.\n@c0@"
  es: "@a@b*: Me estorbaba tenerlo por aquí, así que finalmente lo tiré ahí fuera.\n@c0@"
  fr: "@a@b*ⓢ Finalement, ça m'encombrait plus qu'autre chose, alors j'ai jeté ce truc dehors.\n@c0@"
  it: "@a@b*: Qui dentro era solo d'impiccio, così l'ho gettato via.\n@c0@"
  ja: "@a@b＊「安心して　たくさん\n\tお金を　預けていってくださいね。\n\tムフフ。\n@c0@"
176:
  de: "@a@bEs ist eine Maximedaille!\n@c0@"
  en: "@a@bIt's a maxi medal!\n@c0@"
  es: "@a@b¡Es una maximedalla!\n@c0@"
  fr: "@a@bC'est une maxi médailleⓠ\n@c0@"
  it: "@a@bÈ una maximedaglia!\n@c0@"
  ja: "@a@b＊「おかみさんから　いただいたアレなら\n\tがんじょうなので　とりあえず\n\t盾に　加工してみたんですが…。\n@c0@"
177:
  de: "@a@b*: Uuuuuuh!\n@c0@"
  en: "@a@b*: Ouoooze!\n@c0@"
  es: "@a@b*: ¡Glooouuup!\n@c0@"
  fr: "@a@b*ⓢ Auuuu secooooursⓠ\n@c0@"
  it: "@a@b*: Slimahia!\n@c0@"
  ja: "@a@b＊「いやはや　重くて\n\tそうびできるような\n\tシロモノでは　ないですな。\n@c0@"
178:
  de: "@a@b*: H-Hilfe! Ist da jemansch, der mir helfen kann?\n@c0@"
  en: "@a@b*: S-s-slurp-somebody h-help me!\n@c0@"
  es: "@a@b*: ¡Que alguien me a-glop-yude!\n@c0@"
  fr: "@a@b*ⓢ S-s-slurp. Dégluez-moi de làⓠⓐ\n@c0@"
  it: "@a@b*: Aiuto!\nChe qualcuno mi aiuti, per slurpiacere!\n@c0@"
  ja: "@a@b＊「置いておいても　ジャマになるので\n\t外に　すてちゃいました。\n\tあはは…。\n@c0@"
179:
  de: "@a@bEin gequetschtes Stimmchen scheint von darunter zu kommen. Der Stimme zu Hilfe kommen?\n@c0@"
  en: "@a@bThere seems to be a troubled voice coming from underneath. Go to the rescue?\n@c0@"
  es: "@a@bParece que sale una voz agobiada de debajo. ¿Ir al rescate?\n@c0@"
  fr: "@a@bUne voix paniquée semble provenir d'en dessous. Venir à son aideⓡ\n@c0@"
  it: "@a@bSembra che lì sotto ci sia qualcuno in difficoltà!\nVuoi andare in suo aiuto?\n@c0@"
  ja: "@a@bなんと　巨大なメダルが　落ちている！\n@c0@"
180:
  de: "@a@b*: Das war Rettung in glöbbster Not! Ich dachte schon, mein letztes Schlürflein hätte geschlabbert! Vielen Dank!\n@c0@"
  en: "@a@b*: That was goosome! I thought I was going to ooze it for a minute then. Thanks for helping me out.\n@c0@"
  es: "@a@b*: ¡Ha sido espanglopso! Por un momenglop pensé que no saldría vivo. Glopcias por ayudarme a salir.\n@c0@"
  fr: "@a@b*ⓢ Merci de m'avoir sorti de làⓠ C'était tellement angluoissantⓠ J'ai cru devenir fooou.\n@c0@"
  it: "@a@b*: Ah, c'è mancato uno slurpelo!\nAncora qualche minuto e avrei raggiunto lo slurparadiso degli Slime... Grazie per avermi aiutato.\n@c0@"
  ja: "@a@b＊「キュ～～～～～～っ。\n@c0@"
181:
  de: "@a@b*: Wisst Ihr, ich dachte, es wäre gut fürs Training, aber fast wäre ich Matsch gewesen.\n@c0@"
  en: "@a@b*: I thought it would be goo for my training, you see, but I ended up getting squashed!\n@c0@"
  es: "@a@b*: ¡Pensaba que sería bueno para mi entrenamienglop, pero finalmente casi muero aplastaglop!\n@c0@"
  fr: "@a@b*ⓢ Je croyais que ça serait glutile à mon entraînement, mais je me suis retrouvé coincé dessousⓠ\n@c0@"
  it: "@a@b*: Avevo slurpensato di usare quell'oggetto per slimallenarmi, ma sono rimasto schiacciato!\n@c0@"
  ja: "@a@b＊「だ…　だ…　だれか……\n\tたすけて……！\n@c0@"
182:
  de: "@a@b*: Wir schlürfen das nicht einfach hier liegenlassen! Es ist gefährlich! Nehmt Ihr es! \n@c0@"
  en: "@a@b*: We can't just leave it here. It's dangerous!\r\nYou take it! Goo on!\n@c0@"
  es: "@a@b*: No podemos dejar esto aquí sin más. ¡Es peliglopso!\n¡%H0860%XLlévatelo%YLleváoslo%Z! ¡Vamos!\n@c0@"
  fr: "@a@b*ⓢ On peut pas laisser ça là. C'est dangereuxⓠ\nPrenez-laⓠ Allezⓠ\n@c0@"
  it: "@a@b*: Quest'affare non può restare qui!\nÈ troppo slurpericoloso!\nPerché non lo %H0860%Xslurprendi tu%Yslurprendete voi%Z?\n@c0@"
  ja: "@a@b下のほうから　なにやら\n声が　聞こえる。\nたすけてあげますか？\n@c0@"
183:
  de: "@a@bDer Schleim drückt %a000120 die Maximedaille in die Hand.\n@c0@"
  en: "@a@bThe slime thrusts the maxi medal into\n%a000120's hands.\n@c0@"
  es: "@a@bEl limo levanta la maximedalla y la pone en las manos de %a000120.\n@c0@"
  fr: "@a@bLe gluant pousse la maxi médaille vers %a000120.\n@c0@"
  it: "@a@b%0%a000120 ha ricevuto la maximedaglia dallo Slime!\n@c0@"
  ja: "@a@b＊「あ～　苦しかった。\n\tたすけてくれて　ありがとう！\n@c0@"
184:
  de: "@a@b%0%a000180 erhält die Maximedaille!\n@c0@"
  en: "@a@b%0%a000180 acquires the maxi medal!\n@c0@"
  es: "@a@b¡%0%a000180 obtiene la maximedalla!\n@c0@"
  fr: "@a@b%0%a000180 récupère la maxi médailleⓠ\n@c0@"
  it: "@a@b%0%a000180 prende la maximedaglia!\n@c0@"
  ja: "@a@b＊「ボク　アレで　からだを\n\tきたえようと　したんだけど\n\tうっかり　下じきになっちゃって。\n@c0@"
185:
  de: "@a@b*: Puh! Da fällt mir ein Schleim vom Herzen! Dann will ich jetzt mal weitertrainieren.\n@c0@"
  en: "@a@b*: Phew! That's a weight off my slime.\r\nNow I can get back to my training.\n@c0@"
  es: "@a@b*: ¡Uff! Me quito un peso de enlima.\r\nAhora puedo volver a mi entrenamienglop.\n@c0@"
  fr: "@a@b*ⓢ Pfiouⓠ Vous me débarrassez d'un sacré poids.\nJe vous laisse. Je retourne à mon entraînement.\n@c0@"
  it: "@a@b*: Oh, bene!\nOra posso tornare al mio slimallenamento!\n@c0@"
  ja: "@a@b＊「ここに　おいておくと\n\tあぶないから　持っていってよ！\n\tさあ　ほらほら！\n@c0@"
186:
  de: "@a@b*: Ich w-werde zerquetscht! Schnell, h-helft mir!\n@c0@"
  en: "@a@b*: I'm b-b-being squelched!\nHurry up and h-h-help me!\n@c0@"
  es: "@a@b*: ¡Me está aplastanglop!\r\n¡Deprisa, que alguien me ayude!\n@c0@"
  fr: "@a@b*ⓢ J'en p-p-peux glus... euh plusⓠ\nVenez vite m'ai-m'aiderⓠ\n@c0@"
  it: "@a@b*: Aiuto! Mi sta schiacciando!\nDa solo non ce la faccio a liberarmi!\nSlurpresto, aiutatemi!\n@c0@"
  ja: "@a@bスライムは　大きなメダルを　ごういんに\n%a000120に　おしつけた！\n@c0@"
187:
  de: "@a@b*: Das ist also die berühmte Maximedaille?\n@c0@"
  en: "@a@b*: So that's the famous maxi medal?\n@c0@"
  es: "@a@b*: ¿Así que esta es la famosa maximedalla?\n@c0@"
  fr: "@a@b*ⓢ Voilà donc la fameuse maxi médailleⓡ\n@c0@"
  it: "@a@b*: Allora sarebbe questa la famosa maximedaglia, non è vero?\n@c0@"
  ja: "@a@b%a000180は　大きなメダルを\n手に入れた！\n@c0@"
188:
  de: "@a@b*: Sie ist jedenfalls ziemlich ungewöhnlich. Sie könnte ganz schön was wert sein, wisst Ihr.\n@c0@"
  en: "@a@b*: It's certainly unusual, that's for sure.\r\nCould be worth a fair bit, you know.\n@c0@"
  es: "@a@b*: Es realmente singular, es cierto.\r\nYo creo que debe de ser bastante valiosa.\n@c0@"
  fr: "@a@b*ⓢ On peut dire que c'est pas courant.\nÇa doit valoir pas mal d'argent.\n@c0@"
  it: "@a@b*: Certo, è un oggetto davvero particolare.\nSecondo me, vale un bel po' di quattrini.\n@c0@"
  ja: "@a@b＊「よかった！\n\tこれで　心おきなく\n\tからだを　きたえられるよ！\n@c0@"
189:
  de: "@a@b*: Aber ich finde Minimedaillen viel schöner. Und vor allem viel leichter. Es kommt eben nicht bloß auf die Größe an, was?\n@c0@"
  en: "@a@b*: Give me a mini medal over that any day, though. Far more portable. And pretty too. Size isn't everything, eh?\n@c0@"
  es: "@a@b*: Pero antes prefiero cualquier minimedalla. Es mucho más fácil de llevar. Y más bonita. ¡El minitamaño no lo es todo!\n@c0@"
  fr: "@a@b*ⓢ Mais je préfère quand même les mini médailles.\nC'est plus compact... et plus joli aussi.\nY'a pas que la taille qui compteⓠ\n@c0@"
  it: "@a@b*: Io, però, preferisco le minimedaglie!\nSono molto più pratiche e maneggevoli.\nE anche più carine!\n@c0@"
  ja: "@a@b＊「し…　し…　しんじゃう。\n\tは…　はやく…　たすけて…！\n@c0@"
190:
  de: "@aKönig Dominicus@bAh! Ist das meine alte Maximedaille, die Ihr da bei Euch habt?\n@c0@"
  en: "@aKing Dominicus@bAh! Is that my old maxi medal you have there?\n@c0@"
  es: "@aRey Dominico@b¡Ah! ¿Es eso mi vieja maximedalla?\n@c0@"
  fr: "@aRoi Dominicus@bAhⓠ Ce ne serait pas ma vieille maxi médaille que vous avez làⓡ\n@c0@"
  it: "@aRe Minikin@bAh!\nSe i miei occhi non m'ingannano, quella è la mia vecchia maximedaglia.\n@c0@"
  ja: "@a@b＊「それが\n\t幻の　大きなメダルですか？\n@c0@"
191:
  de: "@aKönig Dominicus@bDie hab ich vor einer ganzen Weile mal in die Finger bekommen. Aber eigentlich habe ich die hübschen kleinen Minimedaillen viel lieber.\n@c0@"
  en: "@aKing Dominicus@bI came by that a long while back now. I'm afraid I much prefer the delightful little mini medals, though.\n@c0@"
  es: "@aRey Dominico@bMe tropecé con ella ya hace minitiempo. Pero me temo que prefiero las encantadoras minimedallas.\n@c0@"
  fr: "@aRoi Dominicus@bJe l'ai récupérée il y a bien longtemps. Mais je préfère de loin les mini médailles. Elles sont tellement plus jolies.\n@c0@"
  it: "@aRe Minikin@bLa trovai molto tempo fa, ma non mi è mai piaciuta molto. Preferisco le mie bellissime e minuscole minimedaglie!\n@c0@"
  ja: "@a@b＊「う～ん…　たしかに\n\tめずらしくて\n\t価値はあるかも　知れないですが……\n@c0@"
192:
  de: "@aKönig Dominicus@bAlso behaltet sie nur, wenn Ihr wollt! Hauptsache, Ihr bringt sie so weit wie möglich fort von meiner Domäne, wenn es Euch nichts ausmacht.\n@c0@"
  en: "@aKing Dominicus@bDo feel free to keep it, won't you? Just take it far away from my dominion, if you don't mind.\n@c0@"
  es: "@aRey Dominico@b%H0860%XTe la puedes%YOs la podéis%Z quedar, claro está. Pero %H0860%Xaléjala%Yalejadla%Z de mi minidominio, por favor.\n@c0@"
  fr: "@aRoi Dominicus@bVous pouvez la garder, si vous voulez. Si vous pouviez même l'emporter loin de mon domaine, ça m'arrangerait.\n@c0@"
  it: "@aRe Minikin@bSe %H0860%Xvuoi, puoi tenerla. Anzi, prendila%Yvolete, potete tenerla. Anzi, prendetela%Z e basta.\nNel mio Regno non c'è posto per medaglie tanto ingombranti!\n@c0@"
  ja: "@a@b＊「ちいさなメダルのほうが\n\tもようも　細かくて\n\tずっと　きれいな感じがしますね。\n@c0@"
193:
  de: "@aKönig Dominicus@bAaah... Jetzt geht's mir schon viel bessser!\nÄh, mal sehen...\n@c0@"
  en: "@aKing Dominicus@bAaah... I feel a minion times better now!\nEr, let's see...\n@c0@"
  es: "@aRey Dominico@bAaah... ¡Ya me siento un minimillón de veces mejor!\r\nA ver...\n@c0@"
  fr: "@aRoi Dominicus@bAaah... Je me sens tellement mieux, maintenantⓠ\nBien. Voyons voir...\n@c0@"
  it: "@aRe Minikin@bAaah...\nOra sì che va meglio!\n@c0@"
  ja: "@a@bメダル王「おお　大きなメダルを\n\t持ってきたか……。\n@c0@"
194:
  de: "@a@b*: Diese Maximedaille ist einfach aus dem Nichts aufgetaucht, als ich den Brunnen gereinigt habe. Das war vor vielen Jahren.\n@c0@"
  en: "@a@b*: That maxi medal just appeared out of nowhere when I was cleaning the fountain. Years and years ago it was.\n@c0@"
  es: "@a@b*: Esa maximedalla apareció de pronto mientras estaba limpiando la fuente. Ya hace muchos años de eso.\n@c0@"
  fr: "@a@b*ⓢ Cette maxi médaille est apparue comme par enchantement alors que je nettoyais la fontaine. C'était il y a des années.\n@c0@"
  it: "@a@b*: Trovai quella maximedaglia molti anni fa.\nStavo pulendo la fontana, quando la vidi che faceva capolino dal fondo...\n@c0@"
  ja: "@a@bメダル王「はるか昔　手に入れたものじゃが\n\tこの　ちいさなメダルの\n\t美しさに　くらべたら……。\n@c0@"
195:
  de: "@a@b*: Sie gehörte zu des Königs Schätzen, bis seine Begeisterung für die Minimedaillen begann. Und jetzt seht Euch nur an, wie sie aussieht!\n@c0@"
  en: "@a@b*: It was one of the King's treasures until he became so infatuated with mini medals. And yet look at the state of it now!\n@c0@"
  es: "@a@b*: Era uno de los tesoros del Rey hasta que se encaprichó de las minimedallas. ¡Pero mira en qué estado está!\n@c0@"
  fr: "@a@b*ⓢ C'était un des trésors du roi jusqu'à ce qu'il ne soit plus obsédé que par les mini médailles.\nRegardez dans quel état elle est, maintenantⓠ\n@c0@"
  it: "@a@b*: Per un po' di tempo il Re l'aveva tenuta tra i suoi tesori, poi gli prese la fissa per le minimedaglie, e se ne sbarazzò, dimenticandosene completamente.\n㈡\n%H0860%XGuarda%YGuardate%Z in che stato è adesso!\n@c0@"
  ja: "@a@bメダル王「それは　そなたたちに　あげよう。\n\tどこへなりと　持ってゆくがよい。\n@c0@"
196:
  de: "@a@b*: Vor langer Zeit hat jemand Maximedaillen auf der ganzen Welt verteilt, fast wie bei einer Schnitzeljagd.\n@c0@"
  en: "@a@b*: Long ago, there was a fellow who scattered maxi medals all over the world as a kind of treasure trail.\n@c0@"
  es: "@a@b*: Hace mucho tiempo, un individuo dispersaba maximedallas por ahí, como si de pistas que condujeran a un tesoro se trataran.\n@c0@"
  fr: "@a@b*ⓢ Il y a très longtemps, un gars a éparpillé des maxi médailles dans le monde entier afin de créer une sorte de piste menant à un trésor.\n@c0@"
  it: "@a@b*: Molto tempo fa, un tizio decise di spargere delle maximedaglie in giro per il mondo. Il suo voleva essere un gesto generoso, ma l'esito fu disastroso.\n@c0@"
  ja: "@a@bメダル王「あ～　すっきりしたわい！\n\tいやいや……\n@c0@"
197:
  de: "@a@b*: Aber er wandte Magie an, damit sie fliegen, und so kamen dabei Menschen und Gebäude zu Schaden.\n@c0@"
  en: "@a@b*: But he used magic to send them flying, and they ended up injuring people and damaging buildings on their way!\n@c0@"
  es: "@a@b*: ¡Pero utilizaba magia para enviarlas volando, y siempre acababan hiriendo a alguien o dañando edificios en su camino!\n@c0@"
  fr: "@a@b*ⓢ Le problème, c'est qu'il a utilisé la magie pour les disperser et elles ont blessé pas mal de gens et abîmé un paquet de maisons en tombant du cielⓠ\n@c0@"
  it: "@a@b*: Infatti, quella persona ebbe la pessima idea di lanciare in aria le maximedaglie. Il risultato?\nCi furono danni a cose e a persone un po' ovunque!\n@c0@"
  ja: "@a@b■メダル王チャートへ\n@c0@"
198:
  de: "@a@b*: Sie wurden zurückgerufen, bevor man noch ⓞKönig Dominicus' Domäneⓟ sagen konnte.\n@c0@"
  en: "@a@b*: They were recalled before you could say ⓗKing Dominicus's Dominionⓘ.\n@c0@"
  es: "@a@b*: Las retiraron en menos de lo que se tarda en decir ⓕDominios de Dominicoⓖ.\n@c0@"
  fr: "@a@b*ⓢ Il les a récupérées avant même que vous ayez eu le temps de dire ⓥdomaine du roi Dominicusⓦ.\n@c0@"
  it: "@a@b*: Per evitare altri disastri, le maximedaglie furono ben presto tolte dalla circolazione e sostituite dalle minimedaglie.\n@c0@"
  ja: "@a@b＊「その　大きなメダルは\n\t何十年ぶりかに　ここの　ふん水の\n\tそうじをしたときに　出てきたのよ。\n@c0@"
199:
  de: "@a@b*: Und danach wollten alle nur noch Minimedaillen haben. Die Maximedaillen sind nirgendwo mehr aufzutreiben.\n@c0@"
  en: "@a@b*: It was mini medals all the way after that. You can't find the maxi ones anywhere any more.\n@c0@"
  es: "@a@b*: A partir de entonces no hubo más que minimedallas. Ya no hay quien encuentre maximedallas.\n@c0@"
  fr: "@a@b*ⓢ Depuis, il n'y a plus que des mini médailles.\nOn ne trouve plus de maxi médaille nulle part, maintenant.\n@c0@"
  it: "@a@b*: Oggi è quasi impossibile trovarne una!\nAnzi, dubito che ne esistano ancora...\n@c0@"
  ja: "@a@b＊「ちいさなメダルを　持つ前は\n\t大事にされていた品物だろうに\n\tあんまりな　ありさまよねえ。\n@c0@"
200:
  de: "@a@b*: Haaach...\nEndlich! Endlich seid Ihr da!\n@c0@"
  en: "@a@b*: Haaaaaaaaa...\nFinally! Ye're finally here, are ye?\n@c0@"
  es: "@a@b*: Aaaaaaaaaa...\n¡Por fin! ¡Por fin has llegado!\n@c0@"
  fr: "@a@b*ⓢ Aaaaaaaaah...\nEnfinⓠ Vous voilàⓠ\n@c0@"
  it: "@a@b*: Aaaaah...\nFinalmente!\nCe ne hai messo di tempo per arrivare, eh?\n@c0@"
  ja: "@a@b＊「はるか昔　宝探しを思いついた人が\n\t世界中に　大きなメダルを\n\tバラまいたそうです。\n@c0@"
201:
  de: "@a@b*: Ich warte schon so lange auf Euch, dass ich darüber glatt gestorben bin!\n@c0@"
  en: "@a@b*: I've been waitin' so long, I've only been an' died,\r\nso I have!\n@c0@"
  es: "@a@b*: ¡Llevo tanto tiempo esperando que casi me muero, bueno en realidad me he muerto!\n@c0@"
  fr: "@a@b*ⓢ Je vous attendais depuis si longtemps que j'en suis mort. Eh ouiⓠ\n@c0@"
  it: "@a@b*: È una vita che ti aspetto!\n@c0@"
  ja: "@a@b＊「しかし　魔法で　大きなメダルを\n\t飛ばしたため　ケガ人はでるわ\n\t建物は　こわれるわで……\n@c0@"
202:
  de: "@a@b*: Wie bitte? Wie ich heiße, wollt Ihr wissen? Nun, mal sehen...\n@c0@"
  en: "@a@b*: What's that? What's me name, ye're askin'?\nWell, let's see now...\n@c0@"
  es: "@a@b*: ¿Cómo? ¿Que cómo me llamo?\nA ver, vamos a ver...\n@c0@"
  fr: "@a@b*ⓢ Comment vous ditesⓡ Comment je m'appelle, c'est çaⓡ Attendez que ça me revienne...\n@c0@"
  it: "@a@b*: Come?\nChe cosa %H0860%Xdici? Vuoi%Ydite? Volete%Z sapere come mi chiamo e perché %H0860%Xti%Yvi%Z sto aspettando? \n@c0@"
  ja: "@a@b＊「あっという間に　大きなメダルは\n\t回収させられたとか……。\n@c0@"
203:
  de: "@a@b*: Mein Name ist Firle. Franz Firle. Und ich habe die Lizenz zum Sammeln.\n@c0@"
  en: "@a@b*: I'm so old, Death's been bored stiff waitin' fer me... And I'm a knick-knackerer... So I s'pose that makes me...Old Man Nick Knack!\n@c0@"
