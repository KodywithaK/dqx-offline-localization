  es: "@aAbuelo Nino@b¡Oh, %H0860%Xeres tú%Ysois %R0000%Xvosotras%Yvosotros%Z%Z! Pensé que no sería mala idea contratar a un guardia, ahora que las piezas de la exposición ya valen una pequeña fortunina.\n@c0@"
  fr: "@aLe vieux Bricabrac@bAh, c'est vousⓠ Je me disais qu'il serait peut-être utile d'embaucher un gardien maintenant que notre collection a pris un peu de valeur.\n@c0@"
  it: "@aGeremia@bEhilà, salve!\nVisto che la collezione è notevolmente aumentata di valore, ho deciso di assumere un sorvegliante.\n@c0@"
  ja: "@a@bデスじい「ああ　ここが\n\t客で　あふれるさまが\n\t目にうかぶようじゃい。\n@c0@"
252:
  de: "@aFranz Firle@bUnd jetzt, wo wir Besucher haben, hab ich mir auch eine Empfangsdame besorgt.\n@c0@"
  en: "@aOld Man Nick Knack@bAnd we've a fair few visitors these days an' all,\r\nso I'm after findin' meself a receptionist too.\n@c0@"
  es: "@aAbuelo Nino@bAhora que tenemos visitantes, necesitamos una recepcionista.\n@c0@"
  fr: "@aLe vieux Bricabrac@bEt à présent que nous avons des visiteurs, je vais aussi devoir engager quelqu'un pour l'accueil.\n@c0@"
  it: "@aGeremia@bInoltre ho trovato una persona per la reception.\nCe n'era un gran bisogno, perché al Museo del Souvenir arrivano sempre più visitatori.\n@c0@"
  ja: "@a@bデスじい「名産品は　お前さんたちの\n\t自由に　ならべてくれい！\n@c0@"
253:
  de: "@aFranz Firle@bSie ist 'n gescheites Mädel. Ein echter Knüller! Die wird frisches Leben in die Bude bringen, da könnt Ihr sicher sein!\n@c0@"
  en: "@aOld Man Nick Knack@bShe's a quare lass. A real corker! 'T'll bring a breath of fresh air into the old place, so it will!\n@c0@"
  es: "@aAbuelo Nino@b¡Una mujer muy, pero que muy guapina! ¡Traerá un poco de vida a este sitio!\n@c0@"
  fr: "@aLe vieux Bricabrac@bC'est une fille bien. En plus, elle est jolieⓠ Elle va amener un peu de jeunesse dans cette vieille maison.\n@c0@"
  it: "@aGeremia@bÈ una ragazza davvero in gamba, e porterà una ventata d'aria fresca in questo posto.\nOh, sì. Mi sarà di grande aiuto!\n@c0@"
  ja: "@a@bデスじい「台座をしらべると\n\t名産品が　置けるぞい！\n@c0@"
254:
  de: "@aFranz Firle@bAch, und im obersten Stockwerk treibt sich so 'n merkwürdiger Kerl rum.\n@c0@"
  en: "@aOld Man Nick Knack@bOh, an' there's a peculiar feen loiterin' up on\r\nthe top floor.\n@c0@"
