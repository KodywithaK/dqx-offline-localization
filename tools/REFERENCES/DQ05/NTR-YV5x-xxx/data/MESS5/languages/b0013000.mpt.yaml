  es: "@aAbuelo Nino@b¡Alabada sea la Diosa! Eso que %H0860%Xllevas%Ylleváis%Z ahí es una maximedalla, ¿verdad?\n@c0@"
  fr: "@aLe vieux Bricabrac@bNom d'une biqueⓠ C'est une maxi médaille que vous avez làⓡ\n@c0@"
  it: "@aGeremia@bAcci e poi denti!\nMa quella è una maximedaglia?!\n@c0@"
  ja: "@a@bデスじい「わしは　世界中の\n\t名産品を　集めるのが夢で\n\tこの博物館を　建てたんじゃ。\n@c0@"
209:
  de: "@aFranz Firle@bGut! Dann ist es endlich so weit! Ihr seid genau die Person, auf die ich gewartet habe! Glückwunsch! Ihr seid %A0110%Xder neue Kurator%Z%B0110%Xdie neue Kuratorin%Z des Firlefanzeums!\n@c0@"
  en: "@aOld Man Nick Knack@bRight! Well, that settles it! Ye're just the %A0110%Xfeen%Z%B0110%Xwan%Z I've been waitin' fer. Congratulations! Ye're the new curator of the knick-knackatory!\n@c0@"
  es: "@aAbuelo Nino@b¡Muy bien! ¡Ya está decidido! A partir de hoy %a000090 será gestor vitalicio de este musesino... He dicho.\n@c0@"
  fr: "@aLe vieux Bricabrac@bInutile de chercher plus loinⓠ Vous êtes %A0110%Xcelui%Z%B0110%Xcelle%Z que j'attendais. Félicitationsⓠ Vous êtes %A0110%Xle nouveau conservateur%Z%B0110%Xla nouvelle conservatrice%Z de la Galericabrac.\n@c0@"
  it: "@aGeremia@bNon ho mai visto nulla di più bello in tutta la mia luuunga vita! %O0960%XCongratulazioni, mio giovane amico: sei il nuovo direttore%YHo deciso: %a000090 sarà il nuovo direttore%Z del Museo del Souvenir!\n@c0@"
  ja: "@a@bデスじい「はぁ～～…　しかし\n\t集めるのを　誰かに頼もうと\n\t待っておったのじゃが……\n@c0@"
210:
  de: "@aFranz Firle@bIst das alles, was Ihr habt? Diese mickrige kleine Sammlung?\n@c0@"
  en: "@aOld Man Nick Knack@bIs that all ye have with ye?\nJust that measly collection?\n@c0@"
  es: "@aAbuelo Nino@b¿Y eso es todo lo que llevas?\n¿Esa miseria de colección?\n@c0@"
  fr: "@aLe vieux Bricabrac@bC'est tout ce que vous aviezⓡ\nVous n'avez rien apporté d'autreⓡ\n@c0@"
  it: "@aGeremia@bBeh? Tutto qui?\nNon %H0860%Xhai%Yavete%Z altro?\n@c0@"
  ja: "@a@bデスじい「ついに　わしが\n\t生きておるあいだには　誰も\n\t来なかったというわけじゃな！\n@c0@"
211:
  de: "@aFranz Firle@bHaaach... Ihr habt noch viel zu lernen, %A0110%Xmein Junge%Z%B0110%XMädchen%Z. Wisst Ihr denn nicht, dass das Schönste am Reisen das Sammeln von Souvenirs ist?\n@c0@"
  en: "@aOld Man Nick Knack@bHaaaaaaaaa...\nYe've still much to learn, %A0110%Xlad%Z%B0110%Xme girl%Z. Don't ye know the real pleasure in trav'llin's collectin' souvenirs as ye go?\n@c0@"
  es: "@aAbuelo Nino@bAaaaaaaaaay...\n㈡\nAún tienes mucho que aprender, %A0110%Xchico%Z%B0110%Xchica%Z. ¿No sabes que lo mejor de viajar es coleccionar recuerdos de los sitios por donde pasas?\n@c0@"
  fr: "@aLe vieux Bricabrac@bAaaaaaaaah...\nVous avez encore beaucoup à apprendre, %A0110%Xmon jeune ami%Z%B0110%Xma jeune amie%Z.\n㈡\nVous ne savez pas que le plus agréable dans les voyages, c'est de dégoter des souvenirsⓡ\n@c0@"
  it: "@aGeremia@bAh, i giovani d'oggi! Possibile mai che %H0860%X%A0110%Xun tipo in gamba come te%Z%B0110%Xuna tipetta in gamba come te%Z%Ygente in gamba come voi%Z non riesca a trovare qualche souvenir interessante durante i suoi viaggi, eh?!\n@c0@"
  ja: "@a@bデスじい「どれどれ…　お前さんは……\n@c0@"
212:
