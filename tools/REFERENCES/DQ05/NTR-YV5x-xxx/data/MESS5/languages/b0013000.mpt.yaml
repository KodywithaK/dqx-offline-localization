  de: "@aFranz Firle@bAber bis alle Podeste belegt sind, werde ich wohl warten müssen, bis sie meine alten Knochen wieder ausbuddeln. Haaach...\n@c0@"
  en: "@aOld Man Nick Knack@bOnly, I s'pose I'll have to wait 'til they're diggin' up me bones before the whole lot's taken care of. Haaa...\n@c0@"
  es: "@aAbuelo Nino@bPero seguro que tengo que esperar hasta que me desentierren para verlos todos ocupados. Aaaay...\n@c0@"
  fr: "@aLe vieux Bricabrac@bCe qui me chagrine, c'est qu'on aura probablement déterré mes os avant que la collection ne soit complète. Aaah...\n@c0@"
  it: "@aGeremia@bAncora un po' e la collezione sarà completa!\nPoi potrò finalmente riposare in pace...\n@c0@"
