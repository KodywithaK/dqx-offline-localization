333:
  de: "@a@bAber der Dummkopf hat das gesamte Gebäude einfach mit Buddelschiffen vollgestopft! Möge ihm die Göttin endlich Hirn verleihen!\n@c0@"
  en: "@a@bⓗBut the dirty maggot's only gone an' filled the place up with ships in bottles! The Goddess strike him down for such tomfoolery!\n@c0@"
  es: "@a@bⓕ¡Pero ese cretino lo ha llenado todo de barcos en botella! ¡Que la Diosa lo confunda por sus majaderías!ⓖ.\n@c0@"
  fr: "@a@bMais ce petit niaiseux a mis des bateaux en bouteillle partout dans le muséeⓠ Que la Déesse lui botte l'arrière-trainⓠ\n@c0@"
  it: "@a@bⓕQuell'accidenti di zucca vuota ha riempito il Museo di navi in bottiglia! Non so proprio cos'abbia in testa... Anzi, comincio a dubitare che ce l'abbia, una testa!ⓖ\n@c0@"
  ja: "@a@b“○月×日\n　わしが　目指したのは　いろいろな\n　名産が見られる　博物館じゃったのに。\n@c0@"
334:
  de: "@a@bOder vielleicht sollte ich ihm eines Tages als Spuk erscheinen? Ich hänge mir ein Laken über und springe ihm aus einem Kleiderschrank entgegen!ⓟ\n@c0@"
  en: "@a@bⓗOr maybe I should spook him one day? I could\nput a sheet over me head and jump out on him\nfrom inside a wardrobe!ⓘ\n@c0@"
  es: "@a@bⓕLo que debería hacer es darle un buen susto. ¡Podría ponerme una sábana en la cabeza y saltar encima de él desde un armario!ⓖ.\n@c0@"
  fr: "@a@bOu peut-être que je devrais lui faire peurⓡ\nJe pourrais me mettre un drap sur la tête et sortir d'un placard par surpriseⓠⓦ\n@c0@"
  it: "@a@bⓕCosa ci faccio io con una sfilza di navi in bottiglia, eh?! Questo è il Museo del Souvenir, mica una cantina o un porto!ⓖ\n@c0@"
  ja: "@a@b“同じものしか　置いてない\n　博物館なんて…　うっうっ…\n　あいつ　イジワルじゃのう。”\n@c0@"
335:
  de: "@a@bEs ist das Tagebuch von Franz Firle. %0%a000120 beginnt, darin zu lesen...\n@c0@"
  en: "@a@bIt's Old Man Nick Knack's diary.\n%0%a000120 starts to read it...\n@c0@"
  es: "@a@bEs el diario del abuelo Nino.\n%0%a000120 empieza a leerlo...\n@c0@"
  fr: "@a@bIl s'agit du journal du vieux Bricabrac.\n%0%a000120 se met à le lire...\n@c0@"
  it: "@a@bÈ il diario del vecchio Geremia.\n%0%a000120 inizia a leggerlo...\n@c0@"
  ja: "@a@bデスじいの日記がある。\n%a000120は　こっそり\n日記を　読んでみた。\n@c0@"
336:
  de: "@a@bⓞHeute ist irgend so ein Tag, ich kann mich gerade nicht so recht erinnern.\n㈡\nIst ja auch egal. Der springende Punkt ist, hier sieht's allmählich aus wie in einem Firlefanzeum. Es geht zwar langsam, aber es geht voran.\n@c0@"
  en: "@a@bⓗToday's some day or other, I can't rightly remember when.\n㈡\nⓗBut it doesn't matter. The point is, the place is finally startin' to look like a knick-knackatory. 'Tis slow progress, but it's gettin' there.\n@c0@"
  es: "@a@bⓕHoy es el día... un día cualquiera, no me acuerdoⓖ.\n㈡\nⓕPero no importa. Lo importante es que este sitio ya casi parece un musenino. Vamos lentos, pero segurosⓖ.\n@c0@"
  fr: "@a@bⓥAujourd'hui est un autre jour, mais je ne me souviens plus lequel.\n㈡\nCe n'est pas grave. Ce qui est important, c'est que cet endroit commence vraiment à ressembler à une Galericabrac. Ça avance lentement, mais sûrement\n@c0@"
  it: "@a@bⓕOggi è il giorno... Uhm, che giorno sarà oggi...? Ah, sì! Oggi è un gran giorno!ⓖ\n㈡\nⓕFinalmente il mio Museo comincia ad assomigliare a un vero museo!ⓖ\n@c0@"
  ja: "@a@b“○月×日\n　わしが　目指したのは　いろいろな\n　名産が見られる　博物館じゃったのに。\n@c0@"
337:
  de: "@a@bAber man darf nichts überstürzen. Langsam aber sicher, das ist die richtige Methode. So kann ich den Kerl im Auge behalten.ⓟ\n@c0@"
  en: "@a@bⓗYe can't be too quick-quack with the knick-knacks, though. Slow and steady, that's the key. That way I can keep an eye on the fella.ⓘ\n@c0@"
  es: "@a@bⓕPero no se puede uno precipitar con las cosinas. Poquito a poco se llega lejos, digo yo. Y así puedo vigilar bien a ese tipoⓖ.\n@c0@"
  fr: "@a@bIl faut prendre son temps avec les objets\nde collection. Inutile de se précipiter.\nEn plus, je peux vérifier, comme ça.ⓦ\n@c0@"
  it: "@a@bⓕNon devo essere troppo impaziente: per raccogliere i migliori souvenir del mondo ci vuole tempo! E di tempo davanti a me ne ho ancora tantissimo.ⓖ\n@c0@"
  ja: "@a@b“ボトルシップだけを　ならべるなんて\n　ぜったい　いやがらせじゃ！\n　やつには　いつか　天罰をあたえてやる。\n@c0@"
338:
  de: "@a@bEs ist das Tagebuch von Franz Firle. %0%a000120 beginnt, darin zu lesen...\n@c0@"
  en: "@a@bIt's Old Man Nick Knack's diary.\n%0%a000120 starts to read it...\n@c0@"
  es: "@a@bEs el diario del abuelo Nino.\n%0%a000120 empieza a leerlo...\n@c0@"
  fr: "@a@bIl s'agit du journal du vieux Bricabrac.\n%0%a000120 se met à le lire...\n@c0@"
  it: "@a@bÈ il diario del vecchio Geremia.\n%0%a000120 inizia a leggerlo...\n@c0@"
  ja: "@a@b“でも　天罰って　どうやったら\n　あたえられるんじゃろう？\n　う～む…　わからんのう……。”\n@c0@"
339:
  de: "@a@bⓞAh, mein gutes altes Tagebuch. Wie geht's? Du weißt nicht zufällig, was heute für ein Tag ist?\n㈡\nNun ja. Jedenfalls hat er inzwischen schon viel Schnickschnack für mich aufgetrieben.\n@c0@"
  en: "@a@bⓗAh, me ole diary. How's she cuttin'? D'ye happen to know what the day is, do ye?\n㈡\nⓗWell anyway, he's found me a fair few knick-knacks now, so he has.\n@c0@"
  es: "@a@bⓕAh, viejo diario mío. ¿Cómo te va la vida? Tú sí que sabes qué día es hoy, ¿a que sí?ⓖ\n㈡\nⓕBueno a lo que iba: el chico me ha encontrado unas cuantas cosinasⓖ.\n@c0@"
  fr: "@a@bⓥAh, mon cher journal. Comment ça vaⓡ\nTu sais quel jour on est, toiⓡ\n㈡\nPeu importe, l'essentiel, c'est qu'il a trouvé pas mal d'objets.\n@c0@"
  it: "@a@bⓕCaro diario, sapresti per caso dirmi che giorno è oggi? Bah, non importa...ⓖ\n㈡\nⓕQuello che conta è che oggi il mio Museo del Souvenir si è arricchito di qualche oggetto davvero interessante.ⓖ\n@c0@"
  ja: "@a@bデスじいの日記がある。\n%a000120は　こっそり\n日記を　読んでみた。\n@c0@"
340:
  de: "@a@bNicht mehr lange, dann sind alle Podeste hier belegt. Ich bin begeistert!ⓟ\n@c0@"
  en: "@a@bⓗIt won't be long 'til every pedestal in the place is taken. I can hardly contain meself!ⓘ\n@c0@"
  es: "@a@bⓕDentro de poco, todos los pedestales estarán llenos. ¡Me muero de impaciencia!ⓖ.\n@c0@"
  fr: "@a@bDans peu de temps, tous les piédestaux du musée seront occupés. J'ai du mal à ne pas hurler de joieⓠⓦ\n@c0@"
  it: "@a@bⓕSe continua di questo passo, tutti i piedistalli saranno presto occupati! Il solo pensiero mi fa ballare la dentiera dall'emozione!ⓖ\n@c0@"
  ja: "@a@b“○月×日\n　少しずつではあるが　名産品が\n　ならべはじめられてきた。\n@c0@"
341:
  de: "@a@bEs ist das Tagebuch von Franz Firle. %0%a000120 beginnt, darin zu lesen...\n@c0@"
  en: "@a@bIt's Old Man Nick Knack's diary.\n%0%a000120 starts to read it...\n@c0@"
  es: "@a@bEs el diario del abuelo Nino.\n%0%a000120 empieza a leerlo...\n@c0@"
  fr: "@a@bIl s'agit du journal du vieux Bricabrac.\n%0%a000120 se met à le lire...\n@c0@"
  it: "@a@bÈ il diario del vecchio Geremia.\n%0%a000120 inizia a leggerlo...\n@c0@"
  ja: "@a@b“ゆっくり　ゆっくり\n　見守ってゆくとしよう。”\n@c0@"
342:
  de: "@a@bⓞ Ein weiterer Tag, ein weiterer Monat... Aber welcher Tag und Monat, tja, da bin ich überfragt!\n㈡\nJedenfalls, jetzt ist jedes Podest im Haus belegt! Ein großer Tag für das Firlefanzeum!\n@c0@"
  en: "@a@bⓗAnother day in another month...though don't go askin' me to write down what day or what month!\n㈡\nⓗAnyway, every pedestal in the house is taken!\n'Tis a grand day for the knick-knackatory!\n@c0@"
  es: "@a@bⓕOtro día de otro mes... ¡y que no me pregunten ni el día ni el mes!ⓖ.\n㈡\nⓕBueno, lo que quería decir es que ¡todos los pedestales están llenos!\n¡Es un día grande para el musenino!ⓖ.\n@c0@"
  fr: "@a@bⓥEncore une journée quelconque d'un mois comme un autre... mais que personne ne me demande quel jour de quel moisⓠ\n㈡\nCe qu'il faut noter, c'est que tous les piédestaux du musée sont utilisésⓠ C'est un grand jour pour la Galericabracⓠ\n@c0@"
  it: "@a@bⓕOggi è il giorno... Non ne ho la più pallida idea, tanto per cambiare.ⓖ\n㈡\nⓕComunque, anche l'ultimo piedistallo adesso ospita un meraviglioso souvenir! Adesso sì che questo è un vero museo!ⓖ\n@c0@"
  ja: "@a@bデスじいの日記がある。\n%a000120は　こっそり\n日記を　読んでみた。\n@c0@"
343:
  de: "@a@bJetzt muss sich der Junge nur noch ein bisschen Wissen über die Präsentation von Ausstellungen aneignen. Ja, daran hapert's im Moment noch.ⓟ\n@c0@"
  en: "@a@bⓗNow the lad just needs to get him a bit of exhibitin' know-how. Aye, that's the problem now, so it is.ⓘ\n@c0@"
  es: "@a@bⓕAhora, el muchacho no tiene más que organizar un poco la exposición de las piezas. Ese es el nuevo objetivoⓖ.\n@c0@"
  fr: "@a@bMaintenant, il va juste falloir lui apprendre comment exposer tout ce bazar. C'est ça le problème.ⓦ\n@c0@"
  it: "@a@bⓕAl ragazzo a cui ho affidato la direzione del Museo non resta che imparare come esporre i souvenir nel migliore dei modi.ⓖ\n㈡\nⓕEssendo una zucca vuota, ci impiegherà probabilmente un mucchio di tempo...ⓖ\n@c0@"
  ja: "@a@b“○月×日\n　名産品の数が　だいぶ　そろってきた。\n@c0@"
344:
  de: "@a@bEs ist das Tagebuch von Franz Firle. %0%a000120 beginnt, darin zu lesen...\n@c0@"
  en: "@a@bIt's Old Man Nick Knack's diary.\n%0%a000120 starts to read it...\n@c0@"
  es: "@a@bEs el diario del abuelo Nino.\n%0%a000120 empieza a leerlo...\n@c0@"
  fr: "@a@bIl s'agit du journal du vieux Bricabrac.\n%0%a000120 se met à le lire...\n@c0@"
  it: "@a@bÈ il diario del vecchio Geremia.\n%0%a000120 inizia a leggerlo...\n@c0@"
  ja: "@a@b“全部　台座がうまるのも\n　もうすぐかもしれん。\n　ああ　楽しみじゃ　楽しみじゃのう。”\n@c0@"
345:
  de: "@a@bⓞIrgendwie finde ich es schwierig, den Tag im Kopf zu behalten. Das ist das Komplizierte am Tagebuchschreiben.\n㈡\nJedenfalls habe ich Kati heute ein bisschen was über den Schnickschnack erzählt, den ich gern im Museum hätte.\n@c0@"
  en: "@a@bⓗYe know, I find it hard to keep track o' the days, so I do. 'Tis a handicap when ye're tryin' to write a diary.\n㈡\nⓗAnyway, I told Sue a quare bit of information about the knick-knacks I'd like in the museum today.\n@c0@"
  es: "@a@bⓕMe resulta un poco difícil saber a qué día estamos. Y es un problema si estás escribiendo un diarioⓖ.\n㈡\nⓕPero bueno, le he dicho a Nuray las piezas que quiero ver hoy en el museoⓖ.\n@c0@"
  fr: "@a@bⓥJ'arrive pas à compter les jours qui passent. C'est un sacré handicap quand on doit écrire un journal.\n㈡\nⓥAujourd'hui, j'ai expliqué à Marie-Jo ce que j'aimerais voir dans le musée.\n@c0@"
  it: "@a@bⓕUltimamente non riesco a ricordare che giorno sia, e la cosa può essere un problema, quando si tiene un diario. Bah, non importa...ⓖ\n㈡\nⓕQuello che conta è che ho detto a Sue di elencare i souvenir che vorrei esporre nel Museo.ⓖ\n@c0@"
  ja: "@a@bデスじいの日記がある。\n%a000120は　こっそり\n日記を　読んでみた。\n@c0@"
346:
  de: "@a@bSie ist 'n feines Mädel, die Kati. Nicht nur niedlich, sondern hat auch noch richtig was drauf!ⓟ\n@c0@"
  en: "@a@bⓗShe's a fine wan, that one. Cute, an' an absolute corker to go with it!ⓘ\n@c0@"
  es: "@a@bⓕEs una chica fenomenal. ¡Muy guapa, y además muy viva!ⓖ.\n@c0@"
  fr: "@a@bElle travaille bien et, en plus, c'est un beau brin de filleⓠⓦ\n@c0@"
  it: "@a@bⓕQuella ragazza è in gamba, e lavorare con lei è davvero un piacere! Se solo avessi una novantina d'anni in meno, le chiederei di uscire con me!ⓖ\n@c0@"
  ja: "@a@b“○月×日\n　すべての台座に　名産品が\n　かざられておる！　う　うれしい！\n@c0@"
347:
  de: "@a@bEs ist das Tagebuch von Franz Firle. %0%a000120 beginnt, darin zu lesen...\n@c0@"
  en: "@a@bIt's Old Man Nick Knack's diary.\n%0%a000120 starts to read it...\n@c0@"
  es: "@a@bEs el diario del abuelo Nino.\n%0%a000120 empieza a leerlo...\n@c0@"
  fr: "@a@bIl s'agit du journal du vieux Bricabrac.\n%0%a000120 se met à le lire...\n@c0@"
  it: "@a@bÈ il diario del vecchio Geremia.\n%0%a000120 inizia a leggerlo...\n@c0@"
  ja: "@a@b“あとは　名産品を\n　展示するセンスじゃが…\n　これが　なかなか問題じゃな。”\n@c0@"
348:
  de: "@a@bⓞIst es denn wirklich so wichtig zu wissen, was wir heute für einen Tag haben?!\n㈡\nEr ist 'n vernünftiger Bursche. Aus dem wird noch mal ein guter Schnickschnacker.\n@c0@"
  en: "@a@bⓗDoes it really matter what day it is now, does it?\n㈡\nⓗHe's a sound lad. He's all the makin's\nof a fine knick-knackerer.\n@c0@"
  es: "@a@bⓕ¿Qué importa qué día sea?ⓖ.\n㈡\nⓕEs un muchacho muy formal. Tiene lo que hay que tener para trabajar en un musenino de cosinasⓖ.\n@c0@"
  fr: "@a@bⓥQu'est-ce que ça peut changer quel jour on estⓡ\n㈡\nIl n'est pas bête. Il a de l'instinct pour ce qui est du bric-à-brac.\n@c0@"
  it: "@a@bⓕCaro diario, ho deciso che, d'ora in avanti, non mi chiederò più che giorno sia!\n㈡\nⓕSono proprio contento del tipo che ho scelto per dirigere il Museo. Si impegna molto, e sta ottenendo degli ottimi risultati.ⓖ\n@c0@"
  ja: "@a@bデスじいの日記がある。\n%a000120は　こっそり\n日記を　読んでみた。\n@c0@"
349:
  de: "@a@bAber was im Namen der Göttin stellt er sich eigentlich unter einer Ausstellung vor? Mein armes Firlefanzeum wird zum Gespött der Leute!\n@c0@"
  en: "@a@bⓗBut what in name of the Goddess does he think he's doin' with the displays!? He's makin' my poor knick-knackatory look like a joke!\n@c0@"
  es: "@a@bⓕPero, ¡¿qué cree que está haciendo con la exposición?! ¡Mi pobre musenino tiene un aspecto ridículo!ⓖ.\n@c0@"
  fr: "@a@bCe que je ne comprends pas, c'est ce qu'il trafique avec l'expositionⓠ Du coup, ma pauvre Galericabrac n'a l'air de rienⓠ\n@c0@"
  it: "@a@bⓕPurtroppo, non ha molta dimestichezza con le modalità di esposizione dei souvenir... Anzi, a dirla tutta, non ci sa proprio fare!ⓖ\n@c0@"
  ja: "@a@b“○月×日\n　今日は　ミミちゃんに　名産品について\n　いろいろ教えてあげた。\n@c0@"
350:
  de: "@a@bWenigstens habe ich jetzt meine Maximedaille. Das ist mehr als genug für mich. Ja, mehr als genug.ⓟ\n@c0@"
  en: "@a@bⓗStill, at least I have me maxi medal. 'Tis more than enough fer me, that. Aye, more than enough.ⓘ\n@c0@"
  es: "@a@bⓕAl menos tengo mi maximedalla. Con eso me basta, no necesito nada másⓖ.\n@c0@"
  fr: "@a@bAu moins, j'ai ma maxi médaille. C'est déjà beaucoup pour moi. Oh que ouiⓠⓦ\n@c0@"
  it: "@a@bⓕComunque, io ho la mia bella maximedaglia. Detto tra noi, non potrei desiderare nulla di più! Tranne, forse, di avere una settantina d'anni in meno.ⓖ\n@c0@"
  ja: "@a@b“ミミちゃんは　勉強熱心じゃのう。\n　かわいいのう。”\n@c0@"
351:
  de: "@a@bEs ist das Tagebuch von Franz Firle. %0%a000120 beginnt, darin zu lesen...\n@c0@"
  en: "@a@bIt's Old Man Nick Knack's diary.\n%0%a000120 starts to read it...\n@c0@"
  es: "@a@bEs el diario del abuelo Nino.\n%0%a000120 empieza a leerlo...\n@c0@"
  fr: "@a@bIl s'agit du journal du vieux Bricabrac.\n%0%a000120 se met à le lire...\n@c0@"
  it: "@a@bÈ il diario del vecchio Geremia.\n%0%a000120 inizia a leggerlo...\n@c0@"
  ja: "@a@bデスじいの日記がある。\n%a000120は　こっそり\n日記を　読んでみた。\n@c0@"
352:
  de: "@a@bⓞMit meinem Gedächtnis steht's nicht mehr zum Besten. Wie soll ein alter Kerl wie ich da wissen, was heute für ein Tag ist, häh?\n㈡\nJedenfalls mache ich mir etwas Sorgen.\n@c0@"
  en: "@a@bⓗMe memory's banjaxed, so it is! How's an ole feen like me supposed to remember what day it is, eh?\n㈡\nⓗAnyway, I'm a little worried, so I am.\n@c0@"
  es: "@a@bⓕMi memoria ya no es la que era. ¿Cómo va a acordarse del día que es un anciano como yo?ⓖ\n㈡\nⓕLo que pasa es que estoy un poco preocupadoⓖ.\n@c0@"
  fr: "@a@bⓥJ'ai le cerveau qui pédale dans la semoule. Comment un bonhomme de mon âge peut se souvenir du jour qu'on estⓡ\n㈡\nEnfin... je suis quand même un peu inquiet.\n@c0@"
  it: "@a@bⓕOggi è un altro giorno in cui non ricordo che giorno sia. Non credo che sia la prima volta che mi accada, ma potrei sbagliarmi...ⓖ\n㈡\nⓕComunque, sono un po' preoccupato.ⓖ\n@c0@"
  ja: "@a@b“○月×日\n　あやつは　価値の高い名産を\n　集めてくる能力は　あるんじゃが……\n@c0@"
353:
  de: "@a@bIch glaube, der Junge kapiert nicht so richtig, was es mit einer richtigen Ausstellung auf sich hat.\n@c0@"
  en: "@a@bⓗI can't help but feel the lad's not quite the full shillin' when it comes to puttin' stuff on display.\n@c0@"
  es: "@a@bⓕMe parece que el muchacho no las tiene todas con él en la cosa esta de poner piezas en los pedestalesⓖ.\n@c0@"
  fr: "@a@bJe me rends bien compte que le p'tit gars n'est pas à l'aise quand il s'agit d'exposer des pièces.\n@c0@"
  it: "@a@bⓕHo la netta sensazione che il direttore del Museo non abbia esposto i souvenir nel migliore dei modi.ⓖ\n@c0@"
  ja: "@a@b“展示の仕方が　まるでメチャクチャ！\n　はぁ～～…　わしの　大事な博物館が\n　こんなことになってしまうとは…。\n@c0@"
354:
  de: "@a@bAllerdings habe ich ihm versprochen, ich würde alles ihm überlassen, da kann ich ihm jetzt ja schlecht dreinreden. Ich stecke in der Klemme, aber wirklich.\n@c0@"
  en: "@a@bⓗOnly, I did say I'd leave it all up to him, so I can't really say anytin' now. I'm up a gum tree good 'n' proper, so I am.\n@c0@"
  es: "@a@bⓕPero dije que le dejaría hacer lo que quisiera, así que ahora no puedo comentarle nada. La preocupación me mataⓖ.\n@c0@"
  fr: "@a@bLe problème, c'est que je lui ai dit que je lui laissais carte blanche, alors je peux difficilement m'en mêler, maintenant. Qu'est-ce que je vais pouvoir faireⓡ\n@c0@"
  it: "@a@bⓕPurtroppo, gli ho promesso che non avrei interferito con le sue scelte, e ora non posso mica rimangiarmi la parola!ⓖ\n@c0@"
  ja: "@a@b“でも　いいんじゃ…\n　わしには　大きなメダルがあるから。\n　それだけで　充分じゃ　充分なんじゃ。”\n@c0@"
355:
  de: "@a@bWenigstens habe ich meine Maximedaille. Das ist mehr als genug für mich. Ja, mehr als genug.ⓟ\n@c0@"
  en: "@a@bⓗStill, at least I have me maxi medal. 'Tis more than enough fer me, that. Aye, more than enough.ⓘ\n@c0@"
  es: "@a@bⓕAl menos tengo mi maximedalla. Con eso me basta, no necesito nada másⓖ.\n@c0@"
  fr: "@a@bAu moins, j'ai ma maxi médaille. C'est déjà beaucoup pour moi. Oh que ouiⓠⓦ\n@c0@"
  it: "@a@bⓕAcci e poi denti! Bah, comunque mi resta sempre la mia meravigliosa maximedaglia. Accontentiamoci, va'.ⓖ\n@c0@"
  ja: "@a@bデスじいの日記がある。\n%a000120は　こっそり\n日記を　読んでみた。\n@c0@"
356:
  de: "@a@bEs ist das Tagebuch von Franz Firle. %0%a000120 beginnt, darin zu lesen...\n@c0@"
  en: "@a@bIt's Old Man Nick Knack's diary.\n%0%a000120 starts to read it...\n@c0@"
  es: "@a@bEs el diario del abuelo Nino.\n%0%a000120 empieza a leerlo...\n@c0@"
  fr: "@a@bIl s'agit du journal du vieux Bricabrac.\n%0%a000120 se met à le lire...\n@c0@"
  it: "@a@bÈ il diario del vecchio Geremia.\n%0%a000120 inizia a leggerlo...\n@c0@"
  ja: "@a@b“○月×日\n　はぁ～～～　不安じゃ…。\n@c0@"
357:
  de: "@a@bⓞDer und der Tag in dem und dem Monat.\n㈡\nDieser junge Bursche, den ich zum Kurator gemacht habe, macht sich gar nicht schlecht, aber wirklich.\n@c0@"
  en: "@a@bⓗSuch an' such a day in such an' such a month...\n㈡\nⓗThat young feen I made curator's certainly havin' a good bash at it, so he is.\n@c0@"
  es: "@a@bⓕDía tal y cual del mes tal y pascual...ⓖ.\n㈡\nⓕEse jovencito al que nombré gestor se lo monta muy bienⓖ.\n@c0@"
  fr: "@a@bⓥDisons qu'on est la veille de demain...\n㈡\nCe p'tit gars que j'ai nommé conservateur, il sait se débrouiller.\n@c0@"
  it: "@a@bⓕOggi è il giorno X. E così il problema di dire che giorno sia è risolto!ⓖ\n㈡\nⓕIl ragazzo che ho scelto per dirigere il Museo del Souvenir si sta dando molto da fare utlimamente.ⓖ\n@c0@"
  ja: "@a@b“あの男の　展示のしかたには\n　問題が　あるような気がするぞい。\n@c0@"
358:
  de: "@a@bAllerdings hat er ein paar komische Ideen. Aber man kann wohl nicht alles haben im Leben...ⓟ\n@c0@"
  en: "@a@bⓗHe's some funny ideas, though. But I s'pose ye can't have everytin' in this life...ⓘ\n@c0@"
  es: "@a@bⓕPero tiene algunas ideas extrañas. En fin, no se puede tener todo en esta vida...ⓖ.\n@c0@"
  fr: "@a@bD'accord, il a parfois des idées bizarres. Mais comme on dit, on ne peut pas avoir le beurre et l'argent du beurre...ⓦ\n@c0@"
  it: "@a@bⓕCerto, ogni tanto ha delle idee un po' bislacche, ma non si può avere tutto dalla vita. A meno che non si abbia una vita lunga quanto la mia, ovviamente...ⓖ\n@c0@"
  ja: "@a@b“とはいえ　まかせると\n　言った手前　クチは出せんし…\n　困ったのう…。\n@c0@"
359:
  de: "@a@bEs ist das Tagebuch von Franz Firle. %0%a000120 beginnt, darin zu lesen...\n@c0@"
  en: "@a@bIt's Old Man Nick Knack's diary.\n%0%a000120 starts to read it...\n@c0@"
  es: "@a@bEs el diario del abuelo Nino.\n%0%a000120 empieza a leerlo...\n@c0@"
  fr: "@a@bIl s'agit du journal du vieux Bricabrac.\n%0%a000120 se met à le lire...\n@c0@"
  it: "@a@bÈ il diario del vecchio Geremia.\n%0%a000120 inizia a leggerlo...\n@c0@"
  ja: "@a@b“でも　いいんじゃ…。\n　わしには　大きなメダルがあるから。\n　それだけで　充分じゃ　充分なんじゃ。”\n@c0@"
360:
  de: "@a@bⓞHeute ist der...\n㈡\nAch! Wen juckt's?! Der springende Punkt ist, dass der junge Bursche, den ich zum Kurator gemacht habe, sich gar nicht schlecht macht, aber wirklich.\n@c0@"
  en: "@a@bⓗToday's...\n㈡\nⓗArgh! What does it matter!? The point is, that young feen I made curator's certainly havin' a good bash, so he is.\n@c0@"
  es: "@a@bⓕHoy es...ⓖ.\n㈡\nⓕ¡Bah! ¡¿Qué más dará?! Lo importante es que ese joven gestor que he encontrado lo está haciendo bastante bienⓖ.\n@c0@"
  fr: "@a@bⓥAujourd'hui, nous sommes...\n㈡\nAaahⓠ Qu'est-ce que ça peut bien faireⓠⓑ\nLe plus important, c'est que le p'tit gars que j'ai nommé conservateur se débrouille pas mal.\n@c0@"
  it: "@a@bⓕOggi è il giorno... Uhm, non lo ricordo. E ho anche dimenticato la soluzione che avevo trovato per ricordare che giorno sia.ⓖ\n㈡\nⓕPrima o poi troverò il modo di ricordare quello che dimentico e che invece dovrei tenere a mente.\nMa che sto dicendo, eh?!ⓖ\n@c0@"
  ja: "@a@bデスじいの日記がある。\n%a000120は　こっそり\n日記を　読んでみた。\n@c0@"
361:
  de: "@a@bZweifellos wird er sich im Laufe der Zeit noch etwas besser einarbeiten. Kein Grund zur Sorge. Nein. Gar kein Grund zur Sorge. Bestimmt nicht. Ach was.ⓟ\n@c0@"
  en: "@a@bⓗNo doubt he'll have a better feel fer the job as time goes on. I'm sure there's no need to worry. No. No need. No, no.ⓘ\n@c0@"
  es: "@a@bⓕY seguro que ira mejorando poco a poco en su trabajo. Creo que no tengo de qué preocuparme. No, ni, seguro. Ni, noⓖ.\n@c0@"
  fr: "@a@bEn plus, il ne peut que continuer à s'améliorer. Pas besoin de s'inquiéter. Non, vraiment pas. Non, non.ⓦ\n@c0@"
  it: "@a@bⓕComunque, il Museo va sempre meglio, grazie al fatto che il direttore sta imparando pian pianino a fare il proprio mestiere.ⓖ\n@c0@"
  ja: "@a@b“○月×日\n　あの　館長にした若者も\n　まあ　よくがんばっとるわい。\n@c0@"
362:
  de: "@a@bEs ist das Tagebuch von Franz Firle. %0%a000120 beginnt, darin zu lesen...\n@c0@"
  en: "@a@bIt's Old Man Nick Knack's diary.\n%0%a000120 starts to read it...\n@c0@"
  es: "@a@bEs el diario del abuelo Nino.\n%0%a000120 empieza a leerlo...\n@c0@"
  fr: "@a@bIl s'agit du journal du vieux Bricabrac.\n%0%a000120 se met à le lire...\n@c0@"
  it: "@a@bÈ il diario del vecchio Geremia.\n%0%a000120 inizia a leggerlo...\n@c0@"
  ja: "@a@b“ちと　センスを\n　疑うところもあるが\n　まあ　こんなもんじゃろう。”\n@c0@"
363:
  de: "@a@bⓞKeine Zeit für Schnickschnack wie ein Datum!\n㈡\nEi der Daus, ich hatte recht, den jungen Burschen zum Kurator zu ernennen!\n@c0@"
  en: "@a@bⓗThere's no time to write down the date!\n㈡\nⓗGive a dog a bone, I was right to appoint that young feen as curator!\n@c0@"
  es: "@a@bⓕ¡No tengo tiempo de escribir la fecha!ⓖ.\n㈡\nⓕ¡Soy el novio de la muerte!, ¡qué gran acierto contratar a ese chico como gestor!ⓖ.\n@c0@"
  fr: "@a@bⓥPas le temps d'écrire la dateⓠ\n㈡\nFaut reconnaître que j'ai eu du flair. J'ai bien eu raison de nommer ce p'tit gars conservateurⓠ\n@c0@"
  it: "@a@bⓕOggi non ho davvero il tempo di chiedermi che giorno sia!ⓖ\n㈡\nⓕDevo congratularmi con me stesso per la scelta del direttore del Museo del Souvenir!ⓖ\n@c0@"
  ja: "@a@bデスじいの日記がある。\n%a000120は　こっそり\n日記を　読んでみた。\n@c0@"
364:
  de: "@a@bEr hat alles bestens arrangiert. Fast, als hätte ich es selbst gemacht, ja wirklich! Hoffen wir mal, dass das eine ganze Weile so bleibt!ⓟ\n@c0@"
  en: "@a@bⓗHe's made everytin' just grand. 'Tis almost like I was runnin' the place meself, so it is! Here's hopin' it lasts a long while.ⓘ\n@c0@"
  es: "@a@bⓕEl musenino tiene un aspecto magnífico. ¡Es casi como si yo mismo lo dirigiese! Espero que dure mucho en el puestoⓖ.\n@c0@"
  fr: "@a@bIl a vraiment fait un boulot fantastique. C'est presque comme si je gérais la Galericabrac\nmoi-mêmeⓠ J'espère que ça va durer.ⓦ\n@c0@"
  it: "@a@bⓕQuel tipo ci sa proprio fare, e le cose vanno a meraviglia! Speriamo che continui così...ⓖ\n@c0@"
  ja: "@a@b“○月×日\n　館長にした若者も\n　がんばっておるようじゃ。\n@c0@"
365:
  de: "@a@bEs ist das Tagebuch von Franz Firle. %0%a000120 beginnt, darin zu lesen...\n@c0@"
  en: "@a@bIt's Old Man Nick Knack's diary.\n%0%a000120 starts to read it...\n@c0@"
  es: "@a@bEs el diario del abuelo Nino.\n%0%a000120 empieza a leerlo...\n@c0@"
  fr: "@a@bIl s'agit du journal du vieux Bricabrac.\n%0%a000120 se met à le lire...\n@c0@"
  it: "@a@bÈ il diario del vecchio Geremia.\n%0%a000120 inizia a leggerlo...\n@c0@"
  ja: "@a@b“館長としてのセンスも\n　しだいに　みがかれていくじゃろう。\n　心配はいらん…　いらん…　いらん…。”\n@c0@"
366:
  de: "@a@bⓞIch bin heute einfach zu gerührt, um mich um das Datum zu kümmern!\n㈡\nKatie hat mir heute Kuchen mitgebracht.\n@c0@"
  en: "@a@bⓗMe heart's too taken to care about the date!\n㈡\nⓗSue brought me some cakes today, so she did.\n@c0@"
  es: "@a@bⓕ¡Estoy demasiado emocionado como para que me importe la fecha!ⓖ.\n㈡\nⓕNuray me ha traído hoy unos pastelinosⓖ.\n@c0@"
  fr: "@a@bⓥJe suis tellement ému que je ne peux pas écrire la dateⓠ\n㈡\nMarie-Jo m'a apporté des gâteaux aujourd'hui.\n@c0@"
  it: "@a@bⓕCaro diario, sai bene che giorno è oggi, quindi non voglio offenderti ripetendotelo.ⓖ\n㈡\nⓕSue ha portato dei dolci al Museo. Erano deliziosi!ⓖ\n@c0@"
  ja: "@a@bデスじいの日記がある。\n%a000120は　こっそり\n日記を　読んでみた。\n@c0@"
367:
  de: "@a@bWas ist sie für ein reizendes Mädel! Sie hat ein gutes Herz und sieht auch noch entzückend aus!ⓟ\n@c0@"
  en: "@a@bⓗWhat a fine wan she is! She's a kind heart and a figure that'd have ye playin' seven knick-knacks all the way up to heaven!ⓘ\n@c0@"
  es: "@a@bⓕ¡Es una chica fantástica! Tiene un corazón tierno y un cuerpo... ¡celestial!ⓖ.\n@c0@"
  fr: "@a@bElle est si gentilleⓠ\nElle est tellement douce et tellement jolie que je l'aime presque autant que tout ce bric-à-bracⓠⓦ\n@c0@"
  it: "@a@bⓕQuella ragazza è un vero angelo! Ha cuore, testa e fisico, e sa anche cucinare: quella tipa ha proprio tutte le qualità! Ah, se avessi ottant'anni di meno...!ⓖ\n@c0@"
  ja: "@a@b“○月×日\n　あの若者を　館長にして\n　正解じゃった！\n@c0@"
368:
  de: "@a@bEs ist das Tagebuch von Franz Firle. %0%a000120 beginnt, darin zu lesen...\n@c0@"
  en: "@a@bIt's Old Man Nick Knack's diary.\n%0%a000120 starts to read it...\n@c0@"
  es: "@a@bEs el diario del abuelo Nino.\n%0%a000120 empieza a leerlo...\n@c0@"
  fr: "@a@bIl s'agit du journal du vieux Bricabrac.\n%0%a000120 se met à le lire...\n@c0@"
  it: "@a@bÈ il diario del vecchio Geremia.\n%0%a000120 inizia a leggerlo...\n@c0@"
  ja: "@a@b“わしと　センスがぴったりじゃ！\n　この調子で　がんばってくれると\n　ええのう。”\n@c0@"
369:
  de: "@a@bⓞWas soll dieses ganze Tagebuchgeschreibsel überhaupt? Es ist schrecklich lästig, einen Überblick über die Tage zu behalten, aber wirklich.\n㈡\nEs ist zwar nicht so ganz nach meinem Geschmack, aber der Junge gibt wirklich sein Bestes.\n@c0@"
  en: "@a@bⓗWhy do folk bother with diaries anyway? 'Tis such a bore tryin' to keep track o' the days, so it is.\n㈡\nⓗ'Tisn't all exactly how I'd be likin' it, but the young fella's done a grand job still an' all.\n@c0@"
  es: "@a@bⓕ¿Por qué escribirá la gente diarios? Eso de preocuparse por saber la fecha es un aburrimientoⓖ.\n㈡\nⓕNo es exactamente como yo querría, pero el muchacho ha hecho un trabajo notableⓖ.\n@c0@"
  fr: "@a@bⓥJe ne comprends pas ce qu'il y a d'intéressant dans un journal. Il faut toujours se rappeler le jour.\nC'est d'un pénibleⓠ\n㈡\nCe n'est pas exactement ce à quoi je m'attendais, mais ce p'tit gars a vraiment fait du bon boulot.\n@c0@"
  it: "@a@bⓕTenere un diario è una cosa difficile. Non è mica roba da poco sforzarsi di ricordare ogni volta che giorno sia, eh?ⓖ\n㈡\nⓕLe cose qui non sono ancora perfette, ma tutto sommato non posso lamentarmi di come sta andando il mio Museo del Souvenir.ⓖ\n@c0@"
  ja: "@a@bデスじいの日記がある。\n%a000120は　こっそり\n日記を　読んでみた。\n@c0@"
370:
  de: "@a@bHier wimmelt es inzwischen von Besuchern. Ja, es ist eine beachtliche Leistung und eine schöne Zeit für uns alle.ⓟ\n@c0@"
  en: "@a@bⓗThe place is black with visitors, so it is. Aye, 'tis a fine achievement and a happy time fer all.ⓘ\n@c0@"
  es: "@a@bⓕEsto está hasta arriba de visitantes. Ha hecho una labor encomiable y todos estamos muy contentosⓖ.\n@c0@"
  fr: "@a@bLe musée est noir de monde. On peut dire que c'est une réussite et tout le monde a l'air de s'amuser.ⓦ\n@c0@"
  it: "@a@bⓕI visitatori non mancano, e questo è ciò che conta davvero: la soddisfazione dei clienti viene prima di ogni altro aspetto!ⓖ\n@c0@"
  ja: "@a@b“○月×日\n　今日は　ミミちゃんが\n　お菓子を　作ってきてくれた。\n@c0@"
371:
  de: "@a@bEs ist das Tagebuch von Franz Firle. %0%a000120 beginnt, darin zu lesen...\n@c0@"
  en: "@a@bIt's Old Man Nick Knack's diary.\n%0%a000120 starts to read it...\n@c0@"
  es: "@a@bEs el diario del abuelo Nino.\n%0%a000120 empieza a leerlo...\n@c0@"
  fr: "@a@bIl s'agit du journal du vieux Bricabrac.\n%0%a000120 se met à le lire...\n@c0@"
  it: "@a@bÈ il diario del vecchio Geremia.\n%0%a000120 inizia a leggerlo...\n@c0@"
  ja: "@a@b“ミミちゃんは　やさしいのう。\n　かわいいのう。”\n@c0@"
372:
  de: "@a@bⓞHeute ist... Ja, ei der Daus, heut' ist einfach mal wieder einer von diesen Tagen!\n㈡\nDer Junge hat die Katastrophäe ausgestellt! Fast wäre ich noch mal gestorben, aber wirklich! Ein weiteres Mal!\n@c0@"
  en: "@a@bⓗToday's... Well, knick-knack, Janey Mac, 'tis one o' those days!\n㈡\nⓗThe lad's put the Catas Trophy on display!\nI nearly died again, so I did! Again!\n@c0@"
  es: "@a@bⓕHoy es... ¡Bueno, uno de esos diínas!ⓖ.\n㈡\nⓕ¡El muchacho ha puesto en exposición el Catastrofeo!\n¡Casi me muero!... ¡Otra vez!ⓖ.\n@c0@"
  fr: "@a@bⓥAujourd'hui... Eh bah, corne de bouc, c'est une journée que je n'oublierai pasⓠ\n㈡\nLe p'tit gars a mis le Catas Trophée en expositionⓠ\nJ'ai failli mourirⓠ À nouveauⓠ\n@c0@"
  it: "@a@bⓕOggi è il giorno. Sì, caro diario, è il giorno... e basta. Così non avrò problemi a ricordare che giorno sia, no?ⓖ\n㈡\nⓕOggi il direttore ha esposto il Trofeo... Oh, come si chiama? Ah, sì! Il Catas Trofeo!ⓖ\n@c0@"
  ja: "@a@bデスじいの日記がある。\n%a000120は　こっそり\n日記を　読んでみた。\n@c0@"
373:
  de: "@a@bDas ist ein zähes Bürschchen. Da kann man nicht meckern. Er rackert sich ganz schön ab, aber wirklich.ⓟ\n@c0@"
  en: "@a@bⓗHe's a tough one, that fella. I can't rightly grumble at him, what with him bein' such a bruiser an' all.ⓘ\n@c0@"
  es: "@a@bⓕEs un tipo duro, ese chico. Y no me puedo enfadar con él con lo fuertote que es, que igual me mataⓖ.\n@c0@"
  fr: "@a@bOn peut dire qu'il est balèze. Je n'ose pas trop lui dire quoi que ce soit, parce qu'il est quand même fort.ⓦ\n@c0@"
  it: "@a@bⓕChe posso dire? È evidente che a quel tipo piace menare le mani. Anche a me, quando avevo la sua età, piaceva farlo...ⓖ\n@c0@"
  ja: "@a@b“○月×日\n　気になることはあるが\n　あの若者も　がんばった。\n@c0@"
374:
  de: "@a@bEs ist das Tagebuch von Franz Firle. %0%a000120 beginnt, darin zu lesen...\n@c0@"
  en: "@a@bIt's Old Man Nick Knack's diary.\n%0%a000120 starts to read it...\n@c0@"
  es: "@a@bEs el diario del abuelo Nino.\n%0%a000120 empieza a leerlo...\n@c0@"
  fr: "@a@bIl s'agit du journal du vieux Bricabrac.\n%0%a000120 se met à le lire...\n@c0@"
  it: "@a@bÈ il diario del vecchio Geremia.\n%0%a000120 inizia a leggerlo...\n@c0@"
  ja: "@a@b“これだけ　たくさんのお客さんを\n　むかえられるように　なったんじゃ。\n　喜ばしいのう。”\n@c0@"
375:
  de: "@a@bⓞIst mir doch schnurzpiepegal, was wir heute für einen Tag haben.\n㈡\nDas Firlefanzeum ist praktisch perfekt.\n@c0@"
  en: "@a@bⓗI couldn't care less what day it is.\n㈡\nⓗThe knick-knackatory's about as perfect as it\ncan be.\n@c0@"
  es: "@a@bⓕMe importa un bledino el día que seaⓖ.\n㈡\nⓕEl musenino está perfecto, no podría estar mejorⓖ.\n@c0@"
  fr: "@a@bⓥJ'en ai strictement rien à faire de quel jour on est.\n㈡\nLa Galericabrac ne pourrait pas être plus belle.\n@c0@"
  it: "@a@bⓕOggi non m'importa un bel niente di che giorno sia!ⓖ\n㈡\nⓕIl Museo del Souvenir ha raggiunto il massimo livello di perfezione! Sono davvero commosso...ⓖ\n@c0@"
  ja: "@a@bデスじいの日記がある。\n%a000120は　こっそり\n日記を　読んでみた。\n@c0@"
376:
  ja: "@a@b“○月×日\n　あの男が　闇のトロフィーを\n　展示したのには　心底おどろいたぞい！\n@c0@"
377:
  ja: "@a@b“あの男は　かなり腕っぷしの\n　強い男とみた。　これからは\n　あまり　文句言わんようにしよう。”\n@c0@"
