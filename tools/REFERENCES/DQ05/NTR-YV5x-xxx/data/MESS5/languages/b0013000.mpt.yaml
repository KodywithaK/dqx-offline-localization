  de: "@a@b*: Ich mach Euch 'nen fairen Preis, Fräulein.\nWenn Ihr mir fünftausend Goldmünzen gebt, sag ich Euch, was Sache ist, ja?\n@c0@"
  en: "@a@b*: Five grand to you, missy. Can't say fairer than that. Give us five thousand gold, an' I'll tell ya the business, okay?\n@c0@"
  es: "@a@b*: Cinco de los grandes, %A0110%Xhijo%Z%B0110%Xhija%Z. Es lo justo. Dame cinco mil de oro y te cuento el asunto, ¿vale?\n@c0@"
  fr: "@a@b*ⓢ J'vous l'dis pour 5000, %A0110%Xfiston%Z%B0110%Xmignonne%Z. C'est un prix honnête. Donnez-moi 5000 pièces d'or et vous saurez tout, ça rouleⓡ\n@c0@"
