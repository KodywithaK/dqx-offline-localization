289:
  de: "@aFranz Firle@bIhr habt jetzt wirklich eine schöne Sammlung beieinander. Nur... Haaach... Ich weiß nicht, aber dieses Arrangement ⓚⓛ also, ich würde ja lieber...\n@c0@"
  en: "@aOld Man Nick Knack@bYe've put a fine collection together, to be sure. Only... Haaa... I don't know about the way ye've arranged things meself. I'd sooner seeⓚⓛ\n@c0@"
  es: "@aAbuelo Nino@bPor la Diosa, %H0860%Xhas%Yhabéis%Z conseguido una buena colección. Pero...\n㈡\nAaaay... No sé si me acaba de gustar cómo %H0860%Xhas%Yhabéis%Z colocado las piezas. Yo preferiría...\n@c0@"
  fr: "@aLe vieux Bricabrac@bOn peut dire que vous avez récupéré des jolies pièces. La seule chose...\n㈡\nAaah... Vous avez organisé tout ça un peu bizarrement. À votre place, j'aurais...\n@c0@"
  it: "@aGeremia@bNon c'è che dire, è proprio una gran bella collezione.\nSolo che, ci fossi io al posto tuo, avrei sistemato gli oggetti diversam...\n@c0@"
  ja: "@a@bデスじい「こんなところに\n\t置いておくには\n\tもったいない品が　あるのう…。\n@c0@"
290:
  de: "@aFranz Firle@bNein, nein und nochmals nein!\nIch wollte das Euch überlassen, und dann muss ich auch dazu stehen! Ich sage kein Wort mehr!\n@c0@"
  en: "@aOld Man Nick Knack@bNo. No, no.\nI said I was leavin' it all up to you, so I did.\nSo I'll leave it all up to you, so I will. Aye.\n@c0@"
  es: "@aAbuelo Nino@bNo. No, no.\nDije que lo dejaría todo en %H0860%Xtus%Yvuestras%Z manos.\nAsí que lo dejaré todo en %H0860%Xtus%Yvuestras%Z manos, sí señor.\n@c0@"
  fr: "@aLe vieux Bricabrac@bNon. Oubliez ça.\r\nJ'ai dit que je vous laissais carte blanche.\r\nAlors il faut que je vous laisse faire.\n@c0@"
  it: "@aGeremia@bNo. Devo star zitto. %O0960%XTi avevo promesso che ti avrei lasciato gestire il Museo liberamente, e non ho alcuna intenzione di rimangiarmi la parola%YAvevo promesso a %a000090 che gli avrei lasciato gestire il Museo liberamente, e non ho alcuna intenzione di rimangiarmi la parola%Z.\n@c0@"
  ja: "@a@bデスじい「いやいや　お前さんに\n\tまかせたんじゃったな。\n@c0@"
291:
  de: "@aFranz Firle@bIhr habt vermutlich eine feste Vorstellung davon, wie Ihr die Stücke arrangieren wollt?\n@c0@"
  en: "@aOld Man Nick Knack@bI s'pose ye're followin' some grand plan are ye, arrangin' the articles in such a way?\n@c0@"
  es: "@aAbuelo Nino@bSi %H0860%Xhas%Yhabéis%Z colocado las piezas así, es por algún motivo misterioso, ¿verdad?\n@c0@"
  fr: "@aLe vieux Bricabrac@bJ'imagine que vous devez avoir une idée en tête pour disposer tout ça comme çaⓡ\n@c0@"
  it: "@aGeremia@bUhm, sì.\nSono certo che hai in mente un ottimo progetto espositivo per la collezione del Museo...\n@c0@"
  ja: "@a@bデスじい「あと　少しで\n\t台座が　全部　うまりそうじゃな。\n@c0@"
292:
  de: "@aFranz Firle@bHaaach... Ich kapiere nur manchmal nicht, was in Euren jungen Köpfen vorgeht.\n@c0@"
  en: "@aOld Man Nick Knack@bHaaa...\nI just don't understand what's goin' on in you young %A0110%Xfellas%Z%B0110%Xwans%Z' heads sometimes.\n@c0@"
  es: "@aAbuelo Nino@bAaaay...\r\nA veces no entiendo qué les pasa por la cabeza a los jóvenes de hoy en día.\n@c0@"
  fr: "@aLe vieux Bricabrac@bAaah, les jeunes...\r\nJ'ai du mal à les suivre des fois.\n@c0@"
  it: "@aGeremia@bSolo che non riesco proprio a capirlo!\nSembra quasi che tu abbia disposto gli oggetti a casaccio!\n@c0@"
  ja: "@a@bデスじい「はぁ…　しかし\n\tこの　あとちょっとが\n\t長かったりするんじゃよなあ…。\n@c0@"
293:
  de: "@aFranz Firle@bIch will ja nix sagen, aber... Na ja, die Ausstellungssäle nehmen ja schon so langsam Gestalt an, wisst Ihr.\n@c0@"
  en: "@aOld Man Nick Knack@bI don't like to say anytin', but...\r\nWell, the exhibition halls are really startin' to take shape now, ye know.\n@c0@"
  es: "@aAbuelo Nino@bNo es por criticar pero...\r\nAunque las salas de exposición ya están tomando forma...\n@c0@"
  fr: "@aLe vieux Bricabrac@bJe ne veux pas critiquer, mais...\r\nEh bien, les salles du musée commencent à prendre forme, vous savez.\n@c0@"
  it: "@aGeremia@bLe sale del Museo cominciano ad avere proprio un bell'aspetto, %H0860%Xsai%Ysapete%Z?\n@c0@"
  ja: "@a@bデスじい「名産を全部\n\tならべてあるには　あるが\n\tこのならべ方は……\n@c0@"
294:
  de: "@aFranz Firle@bNur... Also, verzeiht, dass ich das sage, aber ich fände es schöner, wenn die Ausstellungsstücke zu den Räumen passten, in denen sie stehen.\n@c0@"
  en: "@aOld Man Nick Knack@bOnly, I'd rather see articles befittin' the room they're displayed in, if ye don't mind me sayin'.\n@c0@"
  es: "@aAbuelo Nino@bSi puedo dar mi opinión, preferiría que las piezas combinasen con la sala en la que se exponen.\n@c0@"
  fr: "@aLe vieux Bricabrac@bLa seule chose, si vous me permettez une remarque, c'est que j'aimerais bien que les pièces soient placées dans les salles adéquates.\n@c0@"
  it: "@aGeremia@bSe mi %H0860%Xpermetti%Ypermettete%Z solo un piccolo appunto, suggerirei di esporre ciascun souvenir nel locale che più gli si addice.\n@c0@"
  ja: "@a@bデスじい「いや　まかせると\n\t言ったんじゃからな…。\n\tまかせるんじゃ…　まかせるんじゃ。\n@c0@"
295:
  de: "@aFranz Firle@bGroßartig! Unser Besucherzahlen steigen! Aber ein Schnickschnacker hört nie auf, Dinge zusammenzutragen, wisst Ihr. Das liegt ihm im Blut.\n@c0@"
  en: "@aOld Man Nick Knack@bThat's grand! We've more 'n' more visitors all the time. But a knick-knackerer never stops fiddlin', y'know. 'Tis what we do.\n@c0@"
  es: "@aAbuelo Nino@b¡Genial! Cada vez hay más visitantes. Pero un verdadero Nino nunca deja de buscar. Es nuestra naturaleza.\n@c0@"
  fr: "@aLe vieux Bricabrac@bC'est fantastiqueⓠ Le nombre de visiteurs ne cesse d'augmenter. Mais il ne faut jamais arrêter de chercher des pièces. Parole de Bricabracⓠ\n@c0@"
  it: "@aGeremia@bLe cose vanno alla grande! Abbiamo una marea di visitatori, e mi aspetto che ne arrivino sempre di più!\nMa questo non è il momento di dormire sugli allori...\n@c0@"
  ja: "@a@bデスじい「お前さんには　なにか\n\t考えがあって　こういう\n\t展示のしかたをしておるのかの？\n@c0@"
296:
  de: "@aFranz Firle@bAlso hört auf mich alten Jäger und Sammler: Neues Publikum bekommen wir nur, wenn wir auch mal andere Stücke zeigen.\n@c0@"
  en: "@aOld Man Nick Knack@bSo let this ole paddywhack give y'a bone and tell ye that ye can attract different folk by puttin' different articles on display.\n@c0@"
  es: "@aAbuelo Nino@bAsí que como más sabe el diablo por viejo que por diablo, %H0860%Xte%Yos%Z voy a dar un consejino: distintas piezas en exposición atraen a personas distintas.\n@c0@"
  fr: "@aLe vieux Bricabrac@bJe vais vous donner un tuyau de vieux briscard. Vous pouvez attirer des personnes différentes en exposant d'autres pièces.\n@c0@"
  it: "@aGeremia@bVoglio %H0860%Xdarti%Ydarvi%Z un suggerimento: souvenir diversi attraggono differenti tipi di visitatori.\n@c0@"
  ja: "@a@bデスじい「はぁ～…\n\tわしには　若いもんの考えが\n\tぜんぜん　わからんわい。\n@c0@"
297:
  de: "@aFranz Firle@bNa los, versucht es mal. Räumt ein paar Stücke um und wartet eine Weile. Bald werdet Ihr sehen, dass ganz neue Leute hier auftauchen.\n@c0@"
  en: "@aOld Man Nick Knack@bGo on, give it a try. Switch a few articles around and wait a while. Ye'll soon see different types o' feens turnin' up.\n@c0@"
  es: "@aAbuelo Nino@bVamos, %H0860%Xpruébalo%Yprobadlo%Z. %H0860%XCambia%YCambiad%Z unos cuantos artículos y %H0860%Xespera%Yesperad%Z un ratino. %H0860%XVerás%YVeréis%Z como viene gente distinta.\n@c0@"
  fr: "@aLe vieux Bricabrac@bVous n'avez qu'à essayer. Déplacez des pièces et attendez. En peu de temps, vous aurez un public différent.\n@c0@"
  it: "@aGeremia@bAvanti, %H0860%Xfai%Yfate%Z una prova!\n%H0860%XCambia%YCambiate%Z qualche oggetto, e %H0860%Xguarda%Yguardate%Z quali persone vengono al Museo.\n@c0@"
  ja: "@a@bデスじい「一応　話しておくとな…\n\t見てのとおり　この博物館の部屋は\n\t上に行くほど　りっぱになっておる。\n@c0@"
298:
  de: "@aFranz Firle@bIch fände es schön, wenn Ihr ein bisschen aussortieren würdet, aber die Leute scheinen ja ihren Spaß zu haben.\n@c0@"
  en: "@aOld Man Nick Knack@bI've a fair few things I'd like ye to sort out, but everyone looks like they're havin' a grand craic here.\n@c0@"
  es: "@aAbuelo Nino@bHay algunos asuntos que quería que %H0860%Xarreglaras%Yarreglarais%Z, pero parece que todo el mundo se lo está pasando de muerte aquí.\n@c0@"
  fr: "@aLe vieux Bricabrac@bJ'ai bien vu quelques trucs qui clochent, mais tout le monde a l'air de bien s'amuser ici.\n@c0@"
  it: "@aGeremia@bAvevo pensato di apportare qualche cambiamento ai souvenir in esposizione, ma ho visto che i visitatori sono già soddisfatti.\n@c0@"
  ja: "@a@bデスじい「できれば\n\t部屋にあう価値の　名産品を\n\tかざってほしいんじゃがのう…。\n@c0@"
299:
  de: "@aFranz Firle@bAlso will ich noch ein Weilchen ein Auge zudrücken.\n@c0@"
  en: "@aOld Man Nick Knack@bSo I'll turn a blind eye to the little niggles fer now.\n@c0@"
  es: "@aAbuelo Nino@bAsí que de momento no me preocuparé de cosinas sin importancia.\n@c0@"
  fr: "@aLe vieux Bricabrac@bAlors je ne vais rien dire pour cette fois.\n@c0@"
  it: "@aGeremia@bSe tutto funziona bene, perché cambiare?\nNon sono poi tanto vecchio, ma di certo sono molto saggio!\n@c0@"
  ja: "@a@bデスじい「お客の入りも　上々じゃ。\n\tじゃが　これに満足することなく\n\t日々　精進するのじゃぞ。\n@c0@"
300:
  de: "@aFranz Firle@bDas Arrangement der Stücke im Museum ist einfach abscheulich! Ihr müsst blind sein wie ein Maulwurf!\n@c0@"
  en: "@aOld Man Nick Knack@bThe way ye've arranged the articles in this museum is desperate altogether, ye daft maggot!\n@c0@"
  es: "@aAbuelo Nino@b¡¿Se puede saber cómo se %H0860%Xte%Yos%Z ha ocurrido ordenar las piezas así, %H0860%X%A0110%Xgusano necrófago%Z%B0110%Xgusana necrófaga%Z%Y%R0000%Xguasnas necrófagas%Ygusanos necrófagos%Z%Z?!\n@c0@"
  fr: "@aLe vieux Bricabrac@bJ'arrive pas à comprendre comment vous avez pu arranger ces pièces comme ça, espèce de tête de linotteⓠ\n@c0@"
  it: "@aGeremia@bMa come %H0860%Xti è venuto in mente di sistemare i souvenir in questo modo, brutta zucca vuota che non sei%Yvi è venuto in mente di sistemare i souvenir in questo modo, brutte zucche vuote che non siete%Z altro?!\n@c0@"
  ja: "@a@bデスじい「これからは\n\tならべる名産品の　種類によって\n\tお客さんが　変わってくるじゃろう。\n@c0@"
301:
  de: "@aFranz Firle@bHuch! Ist mir da etwa gerade was rausgerutscht? Was immer es war, ich hab's vermutlich nicht so gemeint!\n@c0@"
  en: "@aOld Man Nick Knack@bWhat theⓚⓛ\nDid I just burst out with sometin' then, did I?\nI'm sure I probably didn't mean it, whatever it was.\n@c0@"
  es: "@aAbuelo Nino@b¡Pero qué digo!\nAcabo de dar%H0860%Xte%Yos%Z un susto de muerte, ¿verdad?\nNo era mi intención, antes muerto que asustar%H0860%Xte%Yos%Z.\n@c0@"
  fr: "@aLe vieux Bricabrac@bPardonⓡ J'ai dit quelque choseⓡ\nJe suis sûr que je ne le pensais pas.\n@c0@"
  it: "@aGeremia@bBisogna cambiare tutto e...\nUhm, cos'è che volevo dire? Ah, non importa.\nAlla mia età a volte si straparla...\n@c0@"
  ja: "@a@bデスじい「いろいろ　ならべかえて\n\t試してみるんじゃ。　しばらくすると\n\tちがう客が　来るかもしれんよ。\n@c0@"
302:
  de: "@aFranz Firle@bDas ist mal wieder ein Wetterchen heute, was? Da werden selbst einem toten alten Kerl wie mir die ollen Knochen noch mal ordentlich durchgewärmt!\n@c0@"
  en: "@aOld Man Nick Knack@bⓙTis some grand weather we're havin', isn't it?\nEven fer a dead fella like meself, 'tis nice to\nwarm yer bones.\n@c0@"
  es: "@aAbuelo Nino@bQué buen tiempo hace, ¿eh?\r\nAunque esté muerto, siempre es agradable calentarse los huesos.\n@c0@"
  fr: "@aLe vieux Bricabrac@bC'est un temps magnifique qu'on a en ce moment, heinⓡ Même pour un mort, c'est pas désagréable de se faire réchauffer les os.\n@c0@"
  it: "@aGeremia@bAh, che splendida giornata di sole! Proprio quello che ci vuole per le mie vecchie ossa! Anzi, per le mie ossa... e basta! Non sono poi tanto vecchio, vero?\n@c0@"
  ja: "@a@bデスじい「言いたいことは\n\tいくつかあるが　お客さんも\n\t楽しんどるようじゃからの。\n@c0@"
303:
  de: "@aFranz Firle@bIhr müsst wirklich auch gelegentlich mal an die Sonne, wisst Ihr.\n@c0@"
  en: "@aOld Man Nick Knack@bYe really ought to get out in the sun yerself sometimes, ye know.\n@c0@"
  es: "@aAbuelo Nino@bCreo que %H0860%Xdeberías%Ydeberíais%Z salir a que %H0860%Xte%Yos%Z diera el aire de vez en cuando.\n@c0@"
  fr: "@aLe vieux Bricabrac@bVous devriez aller prendre le soleil de temps en temps, vous aussi.\n@c0@"
  it: "@aGeremia@bIl sole fa bene al corpo e allo spirito.\nDevo ricordarmi di uscire a fare una passeggiata ogni giorno.\n@c0@"
  ja: "@a@bデスじい「多少のことは\n\t目を　つぶるわい！\n@c0@"
304:
  de: "@aFranz Firle@bDie Besucher sehen so aus, als würden sie sich prima amüsieren. Die werden ganz zufrieden nach Hause gehen.\n@c0@"
  en: "@aOld Man Nick Knack@bAll the visitors look like they're havin' a whale of a time. They'll all go rollin' home happy.\n@c0@"
  es: "@aAbuelo Nino@bParece que todos los visitantes se lo están pasando de muerte. Todos vuelven a casa satisfechos.\n@c0@"
  fr: "@aLe vieux Bricabrac@bOn dirait que tous les visiteurs s'amusent vraiment. Ils repartent chez eux tout contents.\n@c0@"
  it: "@aGeremia@bI visitatori si divertono moltissimo. Torneranno a casa felici e contenti, e diranno a tutti che il Museo del Souvenir è un posto fantastico!\n@c0@"
  ja: "@a@bデスじい「わしは　お前さんの\n\t名産品のならべ方が\n\t気にくわんのじゃ～～～！！\n@c0@"
305:
  de: "@aFranz Firle@bAlle scheinen sehr erfreut über die Möglichkeit, eine so seltene Sammlung seltsamer Sachen zu sehen.\n@c0@"
  en: "@aOld Man Nick Knack@bEveryone seems mighty pleased at havin' the opportunity to see such a rare collection of\r\npeculiar articles, so they do.\n@c0@"
  es: "@aAbuelo Nino@bEstán todos encantados de poder ver una colección de piezas tan singulares.\n@c0@"
  fr: "@aLe vieux Bricabrac@bTout le monde semble très content de pouvoir admirer une collection si rare de pièces exceptionnelles.\n@c0@"
  it: "@aGeremia@bSono davvero felice di aver dato a tanta gente la possibilità di ammirare questa collezione di oggetti molto... Ehm, molto ⓕparticolariⓖ...\n@c0@"
  ja: "@a@bデスじい「……はっ！\n\tわし　なんか言ったかの？\n@c0@"
306:
  de: "@aFranz Firle@bIhr habt wirklich großartige Arbeit geleistet.\n@c0@"
  en: "@aOld Man Nick Knack@bYe've done a grand job, so ye have.\n@c0@"
  es: "@aAbuelo Nino@b%H0860%XHas%YHabéis%Z hecho un gran trabajo aquí.\n@c0@"
  fr: "@aLe vieux Bricabrac@bVous avez fait un boulot incroyable.\n@c0@"
  it: "@aGeremia@b%H0860%XHai%YAvete%Z fatto davvero un ottimo lavoro.\nComplimenti!\n@c0@"
  ja: "@a@bデスじい「ぽかぽかと　いい天気じゃ。\n\t死んでても　気持ちええわい。\n@c0@"
307:
  de: "@aFranz Firle@bIch will ehrlich sein. Ich hätte nie gedacht, dass Ihr diese Sache so groß aufziehen würdet. Ihr habt wirklich was draus gemacht. Ich bin beeindruckt.\n@c0@"
  en: "@aOld Man Nick Knack@bI'll be honest with ye, I never thought ye'd make such a go of it. Ye've played nine on me spine, so ye have. I'm gobsmacked.\n@c0@"
  es: "@aAbuelo Nino@bA decir verdad, no pensaba que lo %H0860%Xfueses%Yfuerais%Z a hacer así de bien. Me he quedado muerto de verlo, sí señor.\n@c0@"
  fr: "@aLe vieux Bricabrac@bJe vais être honnête avec vous. Je n'aurais jamais pensé que vous parviendriez à un tel résultat.\r\nVous m'avez vraiment scié. Je suis baba.\n@c0@"
  it: "@aGeremia@bSarò sincero: non credevo che %H0860%Xfossi%Yfoste%Z tanto in gamba.\nSono senza parole!\n@c0@"
  ja: "@a@bデスじい「お前さんも\n\tたまには　すべてを忘れて\n\t日なたぼっこ　したらどうじゃい？\n@c0@"
308:
  de: "@aKati Krams@bFranz Firle hat mir ein paar kleine Memos darüber geschrieben, was für Ausstellungsstücke er hier im Museum haben möchte.\n@c0@"
  en: "@aSue Veneer@bMr Knack's written me a little note about the sort of exhibits he's hopin' to see in the museum.\n@c0@"
  es: "@aNuray Niada@bEl sieñor Nino me ha escrito unas notas con el tipo de piezas que le gustiaría ver en el musenino.\n@c0@"
  fr: "@aMarie-Jo Konde@bMonsieur Bricabrac m'a écrit un petit mot pour expliquer ce qu'il voulait voir exposé dans le musée.\n@c0@"
  it: "@aSue Venir@bGeremia mi ha dato degli appunti nel quale elenca i souvenir che vorrebbe esporre nel Museo.\n@c0@"
  ja: "@a@bデスじい「お客さんは　みなさん\n\t楽しんでくれているようじゃの。\n\tよかった　よかった。\n@c0@"
309:
  de: "@aKati Krams@bNach dem, was er schreibt, wird jedes Ausstellungsstück sozusagen bewertet.\n@c0@"
  en: "@aSue Veneer@bAccordin' to what he's written, there's a sort of ratin' that goes with every article.\n@c0@"
  es: "@aNuray Niada@bEn la lista hay también como una espiecie de puntuación para cada artículo, sí.\n@c0@"
  fr: "@aMarie-Jo Konde@bSi j'ai bien compris, à chaque pièce correspond une sorte d'évaluation.\n@c0@"
  it: "@aSue Venir@bStando a quanto ha scritto, ciascun oggetto ha una sua valutazione differente.\n@c0@"
  ja: "@a@bデスじい「めったに見られぬ\n\t変わった名産品を見られて\n\tお客さんも　満足そうじゃな。\n@c0@"
310:
  de: "@aKati Krams@bIch glaube, Franz Firle möchte, dass die Stücke auf der zweiten und dritten Etage das prächtige Ambiente in gewisser Weise widerspiegeln.\n@c0@"
  en: "@aSue Veneer@bI think Mr Knack's expectin' the articles on display on the second and third levels to reflect the grandeur of their settin' to some extent.\n@c0@"
  es: "@aNuray Niada@bCreo que el sieñor Nino espiera que las piezas de la exposición rieflejen la grandiosidad de las salas, más o mienos.\n@c0@"
  fr: "@aMarie-Jo Konde@bÀ mon avis, monsieur Bricabrac veut que les pièces exposées au deuxième et au troisième niveaux reflètent la grandeur des salles du musée.\n@c0@"
  it: "@aSue Venir@bCredo che Geremia voglia che gli oggetti esposti al primo e al secondo piano riflettano la bellezza delle sale...\n@c0@"
  ja: "@a@bデスじい「しかし　お前さんも\n\tなかなか　がんばったのう。\n@c0@"
311:
  de: "@aKati Krams@bJedenfalls, wenn Ihr Euch ansehen möchtet, was er geschrieben habt, sagt mir einfach Bescheid.\n@c0@"
  en: "@aSue Veneer@bAnyway, if ye'd like to look at what he's written any time, just give me a nod.\n@c0@"
  es: "@aNuray Niada@bSi en algún momiento %H0860%Xquieres%Yquieréis%Z ver lo que ha escrito, %H0860%Xavísame%Yavisadme%Z, sí.\n@c0@"
  fr: "@aMarie-Jo Konde@bToujours est-il que si vous voulez voir ce qu'il a écrit, n'hésitez pas à me demander.\n@c0@"
  it: "@aSue Venir@bSe %H0860%Xvuoi dare un'occhiata agli appunti che mi ha lasciato Geremia, non devi%Yvolete dare un'occhiata agli appunti che mi ha lasciato Geremia, non dovete%Z fare altro che dirmelo.\n@c0@"
  ja: "@a@bデスじい「正直　言うと\n\tここまで　やってくれるとは\n\t思わんだぞい。\n@c0@"
312:
  de: "@aKati Krams@bFranz Firle möchte seine Anmerkungen über die Ausstellungsstücke im Museum etwas ergänzen.\n@c0@"
  en: "@aSue Veneer@bMr Knack's after addin' a little amendment to his notes about the museum exhibits.\n@c0@"
  es: "@aNuray Niada@bEl sieñor Nino acaba de modificar un poco sus notas sobre las piezas del musenino.\n@c0@"
  fr: "@aMarie-Jo Konde@bMonsieur Bricabrac compte modifier ses notes sur les expositions du musée.\n@c0@"
  it: "@aSue Venir@bGeremia sta aggiornando l'elenco degli oggetti che vorrebbe aggiungere alla collezione del Museo.\n@c0@"
  ja: "@a@bミミ「私　デスじいさんから\n\t名産品について書かれた\n\tメモを　いただいたんです。\n@c0@"
313:
  de: "@aKati Krams@bAnscheinend hat er von weiteren Stücken gehört, die wir ausstellen könnten.\n@c0@"
  en: "@aSue Veneer@bIt seems he's discovered sometin' about some new articles we could be displayin'.\n@c0@"
  es: "@aNuray Niada@bPariece que ha diescubierto algo sobre algunas piezas nuevas que le intieresaría exponier.\n@c0@"
  fr: "@aMarie-Jo Konde@bApparemment, il a découvert quelque chose sur de nouvelles pièces que nous pourrions exposer.\n@c0@"
  it: "@aSue Venir@bHa scoperto l'esistenza di qualche nuovo souvenir, e credo che gli piacerebbe entrarne in possesso.\n@c0@"
  ja: "@a@bミミ「メモによると　名産品には\n\tそれぞれ　格付けが\n\tされているみたいですよ。\n@c0@"
314:
  de: "@aKati Krams@bWürdet Ihr jetzt gern die Notizen von Franz Firle sehen?\n@c0@"
  en: "@aSue Veneer@bWould ye like to see Mr Knack's notes now,\r\nwould ye?\n@c0@"
  es: "@aNuray Niada@b¿%H0860%XQuieres%YQuieréis%Z ver las notas ahora?\n@c0@"
  fr: "@aMarie-Jo Konde@bVoulez-vous voir les notes de monsieur Bricabracⓡ\n@c0@"
  it: "@aSue Venir@b%H0860%XVuoi%YVolete%Z consultare l'elenco dei souvenir di Geremia?\n@c0@"
  ja: "@a@bミミ「デスじいさんは　２階と３階にある\n\tごうかな台座には　レベルの高い品物を\n\t置いてほしいみたいですね。\n@c0@"
315:
  de: "@a@b(SCHNICKSCHNACKLISTE ZEIGEN)\n@c0@"
  en: "@a@b(DISPLAY KNICK-KNACK LIST)\n@c0@"
  es: "@a@b(MOSTRAR LISTA DE COSINAS)\n@c0@"
  fr: "@a@b(AFFICHER LA LISTE DE BRICABRAC)\n@c0@"
  it: "@a@b(MOSTRA L'ELENCO DEI SOUVENIR)\n@c0@"
  ja: "@a@bミミ「メモを　見たいときは\n\t声をかけてくださいね。\n@c0@"
316:
  de: "@aKati Krams@bMöchtet Ihr jetzt gern ein paar Infos zu den Stücken haben, die wir noch suchen?\n@c0@"
  en: "@aSue Veneer@bWould ye like me to fill ye in on some o' the articles ye've yet to find?\n@c0@"
  es: "@aNuray Niada@b¿%H0860%XQuieres%YQuieréis%Z que %H0860%Xti%Yos%Z cuente algo sobre las piezas que %H0860%Xti%Yos%Z quiedan por encontrar?\n@c0@"
  fr: "@aMarie-Jo Konde@bVoulez-vous des informations sur certaines pièces que vous devez encore trouverⓡ\n@c0@"
  it: "@aSue Venir@b%H0860%XVuoi che ti dia qualche informazione sui souvenir che devi%YVolete che vi dia qualche informazione sui souvenir che dovete%Z ancora trovare?\n@c0@"
  ja: "@a@bミミ「この前　デスじいさんが\n\tメモに　書きくわえたんです。\n@c0@"
317:
  de: "@aKati Krams@bUnd welches Stück interessiert Euch da im Besonderen?\n@c0@"
  en: "@aSue Veneer@bAnd what article in particular are ye interested in?\n@c0@"
  es: "@aNuray Niada@b¿Y en qué artículo %H0860%Xestás %A0110%Xintieresado%Z%B0110%Xinteriesada%Z%Yestáis %R0000%Xinteriesadas%Yintieresados%Z%Z?\n@c0@"
  fr: "@aMarie-Jo Konde@bQuelle pièce vous intéresse plus particulièrementⓡ\n@c0@"
  it: "@aSue Venir@bA quale souvenir sei particolarmente interessato?\n@c0@"
  ja: "@a@bミミ「新しい名産品について\n\t何か　わかったみたいですよ！\n@c0@"
318:
  de: "@aKati Krams@bMöchtet Ihr vielleicht noch etwas über einen weiteren Artikel erfahren?\n@c0@"
  en: "@aSue Veneer@bIs there another article ye'd like to\r\nknow about, perhaps?\n@c0@"
  es: "@aNuray Niada@b¿%H0860%XQuieres%YQuieréis%Z saber algo más sobre algún otro artículo?\n@c0@"
  fr: "@aMarie-Jo Konde@bY a-t-il une autre pièce sur laquelle vous voulez des informationsⓡ\n@c0@"
  it: "@aSue Venir@bC'è qualche altro oggetto sul quale %H0860%Xvorresti%Yvorreste%Z avere informazioni?\n@c0@"
  ja: "@a@bミミ「デスじいさんから\n\tいただいたメモを\n\tご覧になりますか？\n@c0@"
319:
  de: "@aKati Krams@bIch bin hier, falls Ihr noch etwas wissen möchtet. Ich finde Krimskrams nämlich echt schnick, wisst Ihr. Das schnacke ich nicht nur so daher.\n@c0@"
  en: "@aSue Veneer@bWell I'm always here if there's sometin' ye'd like to know. Me interest in knick-knacks isn't just a veneer, y'know. 'Tis ever sue deep!\n@c0@"
  es: "@aNuray Niada@bBueno, si %H0860%Xquieres%Yquieréis%Z sabier algo más, ya %H0860%Xsabies%Ysabiéis%Z dónde estoy. Las cosinas mi intieresan de verdad, no es solo una pose.\n@c0@"
  fr: "@aMarie-Jo Konde@bSi vous avez besoin d'informations, sachez que je ne bouge pas d'ici. Mon intérêt pour les objets de collection est bel et bien réel, vous savez.\n@c0@"
  it: "@aSue Venir@bSe %H0860%Xdesideri sapere altro, passa%Ydesiderate sapere altro, passate%Z pure da me.\nSue Venir è una vera esperta di souvenir! Eh eh eh!\n@c0@"
  ja: "@a@b（名産リストを表示）\n@c0@"
320:
  de: "@aKati Krams@bTja. Jetzt haben wir alles gesammelt, was es nur zu sammeln gibt, oder nicht?\n@c0@"
  en: "@aSue Veneer@bAye, well. Ye've collected every article there is to collect, haven't ye?\n@c0@"
  es: "@aNuray Niada@bBueno, de acuerdo. Ya %H0860%Xhas%Yhabiéis%Z encontrado todos los artículos que hay, ¿vierdad?\n@c0@"
  fr: "@aMarie-Jo Konde@bParfait. Vous avez réussi à mettre la main sur toutes les pièces.\n@c0@"
  it: "@aSue Venir@bUhm, mi pare che %H0860%Xtu abbia%Yabbiate%Z portato tutti i souvenir che c'erano da trovare.\n@c0@"
  ja: "@a@bミミ「まだ　見つけていない\n\t名産品について\n\tお話ししましょうか？\n@c0@"
321:
  de: "@aKati Krams@bDa werde ich von jetzt an wohl Euch nach Dingen fragen müssen, nicht?\n@c0@"
  en: "@aSue Veneer@bIt'll be me askin' you about things from now on\r\nI s'pose, won't it?\n@c0@"
  es: "@aNuray Niada@bAhora voy a tiener que sier yo la que %H0860%Xti pregunte a ti%Yos priegunte a %R0000%Xvosotras%Yvosotros%Z%Z, sí.\n@c0@"
  fr: "@aMarie-Jo Konde@bJe suppose que, maintenant, c'est moi qui devrai vous poser des questions si je veux des informations, n'est-ce pasⓡ\n@c0@"
  it: "@aSue Venir@bStando così le cose, %H0860%Xd'ora in poi sarò io a chiederti%Yd'ora in poi sarò io a chiedervi%Z qualche informazione sugli oggetti!\n@c0@"
  ja: "@a@bミミ「どれについて　知りたいの？\n@c0@"
322:
  de: "@a@bEs ist das Tagebuch von Franz Firle. %0%a000120 beginnt, darin zu lesen...\n@c0@"
  en: "@a@bIt's Old Man Nick Knack's diary.\n%0%a000120 starts to read it...\n@c0@"
  es: "@a@bEs el diario del abuelo Nino.\n%0%a000120 empieza a leerlo...\n@c0@"
  fr: "@a@bIl s'agit du journal du vieux Bricabrac.\n%0%a000120 se met à le lire...\n@c0@"
  it: "@a@bÈ il diario del vecchio Geremia.\n%0%a000120 inizia a leggerlo...\n@c0@"
  ja: "@a@bミミ「ほかにも　知りたい名産品が\n\tあるかしら？\n@c0@"
323:
  de: "@a@bⓞHeute ist der... Nun ja, heute ist heute, und basta!\n㈡\nDer Kerl hat gar nichts in die Ausstellung gebracht! Er hat einfach den ganzen Kram in den Lagerraum gestopft...\n@c0@"
  en: "@a@bⓗToday is the... Well, today's today, that's what it is!\n㈡\nⓗSo anyway, the fella hasn't put a single article on display! He's put the whole lot in the box room...\n@c0@"
  es: "@a@bⓕHoy es el día... ¡Bueno, hoy es hoy, eso seguro!ⓖ.\n㈡\nⓕ¡El caso es que ese tipo no ha puesto ni un artículo en la exposición! Lo ha metido todo en el trastero...ⓖ.\n@c0@"
  fr: "@a@bⓥAujourd'hui... Aujourd'hui, nous sommes aujourd'huiⓠ\n㈡\nLe p'tit gars n'a encore exposé aucune pièce. Il a juste tout entreposé dans la réserve...\n@c0@"
  it: "@a@bⓕOggi è il giorno... Uhm, l'ho dimenticato. Bah, non importa. Tanto, alla mia età, ogni giorno è uguale agli altri...ⓖ\n㈡\nⓕComunque, quella zucca vuota non ha sistemato nemmeno un souvenir in esposizione! Ha messo tutto nel deposito! Santi numi, che macello!ⓖ\n@c0@"
  ja: "@a@bミミ「何かありましたら\n\tいつでも　声をかけてくださいね！\n@c0@"
324:
  de: "@a@bIch frage mich allmählich, ob er was gegen mich hat...ⓟ\n@c0@"
  en: "@a@bⓗI'm startin' to wonder if he doesn't have sometin' against me...ⓘ\n@c0@"
  es: "@a@bⓕMe pregunto si será porque tiene algo contra mí...ⓖ.\n@c0@"
  fr: "@a@bJe commence à me demander s'il n'a pas quelque chose contre moi...ⓦ\n@c0@"
  it: "@a@bⓕComincio a pensare che non abbia molta simpatia per me e per il mio Museo...ⓖ\n@c0@"
  ja: "@a@bミミ「そうね。　あなたは　もう\n\tすべての名産品を　手にされたん\n\tですものね。\n@c0@"
325:
  de: "@a@bEs ist das Tagebuch von Franz Firle. %0%a000120 beginnt, darin zu lesen...\n@c0@"
  en: "@a@bIt's Old Man Nick Knack's diary.\n%0%a000120 starts to read it...\n@c0@"
  es: "@a@bEs el diario del abuelo Nino.\n%0%a000120 empieza a leerlo...\n@c0@"
  fr: "@a@bIl s'agit du journal du vieux Bricabrac.\n%0%a000120 se met à le lire...\n@c0@"
  it: "@a@bÈ il diario del vecchio Geremia.\n%0%a000120 inizia a leggerlo...\n@c0@"
  ja: "@a@bミミ「名産品については　今では\n\t私なんかより　あなたの方が\n\tくわしいかも。　ステキね！\n@c0@"
326:
  de: "@a@bⓞHeute ist der... Nun, heute ist der Tag nach gestern, und basta. Genau wie an jedem anderen Tag.\n㈡\nJedenfalls hat mir der Kerl heute eine Maximedaille gebracht! Da habe ich ihn zum Kurator ernannt, das war das Mindeste, was ich tun konnte.\n@c0@"
  en: "@a@bⓗToday is the... Well, today's the day after yesterday, so it is. Just like every other day.\n㈡\nⓗBut anyway, the fella brought me a maxi medal, so he did! 'Twas the least I could do to appoint him as curator.\n@c0@"
  es: "@a@bⓕHoy es el día... Bueno, hoy es pasado ayer. Como cada díaⓖ.\n㈡\nⓕEn fin, lo que quería contar es que: ¡ese tipo me ha traído una maximedalla! ¿No es para morirse?\nNombrarlo gestor del museo es lo mínimoⓖ.\n@c0@"
  fr: "@a@bⓥAujourd'hui... Aujourd'hui, on est le jour après hier. Comme tous les jours.\n㈡\nMais peu importe... le p'tit gars m'a rapporté une maxi médailleⓠ Le moins que je pouvais faire, c'était de le nommer conservateur.\n@c0@"
  it: "@a@bⓕOggi è il giorno... Oggi è il giorno che viene dopo ieri.ⓖ\n㈡\nⓕAl Museo è arrivata una maximedaglia! Ho deciso di ricompensare la persona che l'ha portata affidandole la direzione del Museo.ⓖ\n@c0@"
  ja: "@a@bデスじいの日記がある。\n%a000120は　こっそり\n日記を　読んでみた。\n@c0@"
327:
  de: "@a@bOb er das Museum zum Erfolg führen wird? Vielleicht macht er es ja zu dem großen Firlefanzeum, von dem ich immer geträumt habe.ⓟ\n@c0@"
  en: "@a@bⓗI wonder whether he'll make a go of the museum or not. Maybe he'll make it into the grand knick-knackatory I always dreamt of.ⓘ\n@c0@"
  es: "@a@bⓕMe pregunto si tendrá éxito con el museo. Quizá lo convierta en el musenino que yo siempre he soñadoⓖ.\n@c0@"
  fr: "@a@bJe me demande s'il arrivera à faire quelque chose du musée. Avec un peu chance, ça deviendra la grande Galericabrac dont j'ai toujours rêvé.ⓦ\n@c0@"
  it: "@a@bⓕChissà che con il suo aiuto il mio Museo del Souvenir non diventi l'attrazione mondiale che ho sempre sognato di creare...ⓖ\n@c0@"
  ja: "@a@b“○月×日\n　あの男は　展示室に１つも展示せんと\n　名産品を　全部　物置に入れおった…。\n@c0@"
328:
  de: "@a@bEs ist das Tagebuch von Franz Firle. %0%a000120 beginnt, darin zu lesen...\n@c0@"
  en: "@a@bIt's Old Man Nick Knack's diary.\n%0%a000120 starts to read it...\n@c0@"
  es: "@a@bEs el diario del abuelo Nino.\n%0%a000120 empieza a leerlo...\n@c0@"
  fr: "@a@bIl s'agit du journal du vieux Bricabrac.\n%0%a000120 se met à le lire...\n@c0@"
  it: "@a@bÈ il diario del vecchio Geremia.\n%0%a000120 inizia a leggerlo...\n@c0@"
  ja: "@a@b“ひょっとして\n　わしへの　イヤがらせ……？？\n　ぐすん…。”\n@c0@"
329:
  de: "@a@bⓞHeute ist... Hach! Wem will ich hier eigentlich was vormachen? Ich hab keine Ahnung, was heute für ein Tag ist!\n㈡\nIch habe immer von einem großartigen Firlefanzeum geträumt, angefüllt mit den verschiedensten und begehrtesten Stücken.\n@c0@"
  en: "@a@bⓗToday's... Ara! Who am I trying to kid? I haven't got the foggiest what today is!\n㈡\nⓗI always dreamt of a grand knick-knackatory, full of diverse and sought-after articles.\n@c0@"
  es: "@a@bⓕHoy es... ¡Bah, no sé ni lo que me digo! ¡No tengo ni la más remota idea de qué día es hoy!ⓖ.\n㈡\nⓕSiempre he soñado con un musenino magnífico, lleno de muchas piezas distintas y muy codiciadasⓖ.\n@c0@"
  fr: "@a@bⓥAujourd'hui... nonⓠ Il faut vraiment que j'arrête çaⓠ Je n'ai pas la moindre idée du jour qu'on estⓠ\n㈡\nJ'ai toujours rêvé d'une grande Galericabrac pleine de pièces différentes et précieuses.\n@c0@"
  it: "@a@bⓕOggi... Uhm, tanto per cambiare non ho idea di che giorno sia.ⓖ\n㈡\nⓕHo sempre sognato di esporre nel mio Museo del Souvenir oggetti diversi provenienti da ogni paese del mondo.ⓖ\n@c0@"
  ja: "@a@bデスじいの日記がある。\n%a000120は　こっそり\n日記を　読んでみた。\n@c0@"
330:
  de: "@a@bAber der Trottel hat einfach auf jedes einzelne Podest das Gleiche gestellt! Der bringt mich noch ins Grab, aber wirklich!ⓟ\n@c0@"
  en: "@a@bⓗBut the daft eejit's just put the same thing on every single pedestal! He'll be the death of me, so he will!ⓘ\n@c0@"
  es: "@a@bⓕ¡Pero ese lerdo ha llenado todos los pedestales con el mismo artículo! ¡Un día me va a dar un síncope!ⓖ.\n@c0@"
  fr: "@a@bMais ce satané gamin met la même chose sur chaque piédestalⓠ Je suis sûr qu'il veut ma mortⓠⓦ\n@c0@"
  it: "@a@bⓕE invece mi ritrovo con le sale piene dello stesso dannatissimo souvenir! Ma come pensa di gestire il mio Museo, quella dannata zucca vuota?!ⓖ\n@c0@"
  ja: "@a@b“○月×日\n　幻の名産品　大きなメダルを\n　持ってきた男を　館長にした。\n@c0@"
331:
  de: "@a@bEs ist das Tagebuch von Franz Firle. %0%a000120 beginnt, darin zu lesen...\n@c0@"
  en: "@a@bIt's Old Man Nick Knack's diary.\n%0%a000120 starts to read it...\n@c0@"
  es: "@a@bEs el diario del abuelo Nino.\n%0%a000120 empieza a leerlo...\n@c0@"
  fr: "@a@bIl s'agit du journal du vieux Bricabrac.\n%0%a000120 se met à le lire...\n@c0@"
  it: "@a@bÈ il diario del vecchio Geremia.\n%0%a000120 inizia a leggerlo...\n@c0@"
  ja: "@a@b“わしの　夢であった名産博物館を\n　どのように　もりたててくれるのか？\n　とても　楽しみじゃ。”\n@c0@"
