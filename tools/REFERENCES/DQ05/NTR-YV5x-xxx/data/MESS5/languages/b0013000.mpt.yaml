  fr: "@a@b*ⓢ Je suis si vieux que la Mort en a eu marre d'attendre aussi... Et je suis un vieux briscard... un briscard un peu braque qui aime les bibelots...\n㈡\n*ⓢ On va dire le vieux Bricabracⓠ\n@c0@"
  it: "@a@b*: Il mio nome è Geremia, e sono talmente vecchio che penso che la morte abbia smarrito il mio indirizzo...\n@c0@"
  ja: "@a@b＊「その後　ちいさなメダルに\n\tつくりかえられたそうで…\n\t大きなものは　もう　ないそうですよ。\n@c0@"
204:
  de: "@aFranz Firle@bIch wollte immer schon Dinge aus der ganzen Welt zusammentragen und in meinem Firlefanzeum ausstellen. Dafür habe ich es gebaut.\n@c0@"
  en: "@aOld Man Nick Knack@bⓙTwas me dream to gather famous goods from all over the world and display them in me knick-knackatory here. That's why I built the place.\n@c0@"
  es: "@aAbuelo Nino@bMi sueño era coleccionar objetos famosos de todo el mundo y mostrarlos aquí, en mi musenino. Por eso lo construí.\n@c0@"
  fr: "@aLe vieux Bricabrac@bMon rêve, c'était de rassembler des objets célèbres du monde entier et de les présenter ici, dans ma Galericabrac. C'est pour ça que je l'ai construite.\n@c0@"
  it: "@aGeremia@bQuest'edificio è il famoso ⓕMuseo del Souvenirⓖ, che ospita meravigliosi manufatti rari provenienti da ogni parte del mondo.\n@c0@"
  ja: "@a@b＊「はぁ～～～～～。\n\tやっと　来おったか。\n@c0@"
205:
  de: "@aFranz Firle@bHaaach... Aber ich habe hier darauf gewartet, dass jemand vorbeikommt, den ich fragen könnte, ob er nicht Ausstellungsstücke für mich sammeln könnte.\n@c0@"
  en: "@aOld Man Nick Knack@bHaaaaaaaaa...\r\nBut I've been waitin' here fer someone to come so I could ask them to go collectin' exhibits fer me.\n@c0@"
  es: "@aAbuelo Nino@bAaaaaaaaaay...\n㈡\nPero he estado esperando a que viniese alguien para encargarle que fuese a buscarme objetos que exponer.\n@c0@"
  fr: "@aLe vieux Bricabrac@bAaaaaaaaah...\r\nDepuis, j'attends que quelqu'un vienne ici pour lui demander de rassembler des pièces à exposer.\n@c0@"
  it: "@aGeremia@bEhm... A dirla tutta, non è ancora famoso.\nSono troppo vecchio per andare a cercare in giro oggetti particolari da esporre qui dentro...\n@c0@"
  ja: "@a@b＊「わしゃ　待ちくたびれて\n\t死んでしもうたぞい！\n@c0@"
206:
  de: "@aFranz Firle@bAber zu meinen Lebzeiten hat sich hier nie jemand blicken lassen!\n@c0@"
  en: "@aOld Man Nick Knack@bOnly, not a single feen's turned up in me\r\nentire lifetime!\n@c0@"
  es: "@aAbuelo Nino@b¡Pero en toda mi vida no ha pasado ni un alma por aquí!\n@c0@"
  fr: "@aLe vieux Bricabrac@bLe problème, c'est qu'aucun voyageur n'est venu ici de toute ma vieⓠ\n@c0@"
  it: "@aGeremia@bE qui non è mai venuto nessuno a portarmi nulla!\nCosì il mio Museo del Souvenir è ancora vuoto...\n㈡\nBeh, in realtà ci sono io e, data la mia età, potrei tranquillamente essere considerato un pezzo da museo.\n@c0@"
  ja: "@a@b＊「ん？　わしは　誰かじゃと？\n\t……え～と　誰じゃったっけ…。\n@c0@"
207:
  de: "@aFranz Firle@bAlso... Dann lasst Euch mal ansehen. Mal schauen, ob sich das Warten auf Euch gelohnt hat...\n@c0@"
  en: "@aOld Man Nick Knack@bSo, then... Let's take a look at ye.\r\nSee if ye were worth the wait...\n@c0@"
  es: "@aAbuelo Nino@bMuy bien, pues... A ver qué tienes por aquí.\nVeamos si valía la pena esperar...\n@c0@"
  fr: "@aLe vieux Bricabrac@bVoilà, vous savez tout... Mais parlons de vous, maintenant. Voyons si ça valait le coup d'attendre aussi longtemps...\n@c0@"
  it: "@aGeremia@bMa forse %H0860%Xtu potrai%Yvoi potrete%Z aiutarmi...\n@c0@"
  ja: "@a@b＊「まあ　いいわい。\n\t死んでしまった　じいさんじゃ。\n\tデスじい　とでも呼んでくれい。\n@c0@"
208:
  de: "@aFranz Firle@bNa so was! Das ist doch eine Maximedaille, die Ihr da bei Euch habt, oder?\n@c0@"
