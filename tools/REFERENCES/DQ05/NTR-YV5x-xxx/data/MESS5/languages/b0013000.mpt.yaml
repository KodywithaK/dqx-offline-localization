25:
  de: "@a@b*: Darum bin ich hier. Ich bin auf der Suche nach ihnen. Aber leider habe ich meinen Hut vergessen, und ohne Hut ist es hier einfach viel zu heiß.\n@c0@"
  en: "@a@b*: That's why I'm here. I came looking for one.\r\nThe only trouble is, I forgot my hat, and it's far\r\ntoo hot to go exploring without a hat here.\n@c0@"
  es: "@a@b*: Por eso estoy aquí. He venido a buscar una.\r\nLo que pasa es que me olvidé del sombrero, y aquí hace demasiado calor para salir a explorar sin él.\n@c0@"
  fr: "@a@b*ⓢ C'est pour ça que je suis venu... pour en trouver une. Le problème, c'est que j'ai oublié mon chapeau et qu'il fait trop chaud pour se promener tête nue.\n@c0@"
  it: "@a@b*: Ero venuto qui proprio per procurarmene una, ma ho dimenticato il mio cappello, e fa troppo caldo per andarsene in giro a capo scoperto...\n@c0@"
  ja: "@a@b■道具屋チャートへ\n@c0@"
