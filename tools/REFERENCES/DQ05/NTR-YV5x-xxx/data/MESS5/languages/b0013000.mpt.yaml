  it: "@aGeremia@bOh, %A0110%Xbentornato%Z%B0110%Xbentornata%Z!\nAllora, vediamo un po' cosa mi hai portato questa volta... Uhm, niente male! Davvero niente male!\n@c0@"
  ja: "@a@bデスじい「よし！　決めた！\n\tお前さんに　この博物館をやろう！\n\t今日から　お前さんが　館長じゃ。\n@c0@"
214:
  de: "@aFranz Firle@bEigentlich hatte ich ja gehofft, ich könnte meine Einrichtung jemandem übergeben, der mir das Souvenir meiner Träume bringt.\n@c0@"
