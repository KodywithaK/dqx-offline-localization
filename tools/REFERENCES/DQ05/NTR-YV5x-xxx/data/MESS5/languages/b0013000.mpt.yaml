  de: "@a@b*: Wie's wohl dem alten Knaben ergangen ist? Er ist vor 'ner Weile auf dem Weg nach Norden hier vorbeigekommen. Wollte 'n Museum oder so was bauen.\n@c0@"
  en: "@a@b*: Hey, I wonder how that old geezer's gettin' on. There was this bloke here a while back who said he was headin' north to build a museum or the like.\n@c0@"
  es: "@a@b*: Mi priegunto cómo le irá al viejales ese, sí. Hace poco conocí a un tipo que dijo que si iba hacia el norte a construir un musieo o algo así.\n@c0@"
  fr: "@a@b*ⓢ Je m'demande comment il s'en sort ce vieux type qu'est passé l'autre fois. Il a dit qu'il allait au nord pour construire un musée ou un truc comme ça.\n@c0@"
