  en: "@a@b*: If you spend the night at the inn and go out looking early in the morning, you're almost guaranteed to find one lying around.\n@c0@"
  es: "@a@b*: Si %H0860%Xpasas%Ypasáis%Z la noche en la posada y %H0860%Xsales%Ysalís%Z temprano a buscar, lo más seguro es que %H0860%Xencuentres%Yencontréis%Z alguna.\n@c0@"
  fr: "@a@b*ⓢ Si vous passez la nuit à l'auberge et que vous sortez tôt le lendemain, vous pouvez être pratiquement %A0110%Xsûr%Z%B0110%Xsûre%Z d'en trouver une.\n@c0@"
  it: "@a@b*: Quindi, il momento migliore per trovarne qualcuna è di mattina. Conviene trascorrere la notte alla locanda e alzarsi presto per andarle a cercare.\n@c0@"
  ja: "@a@b＊「なんでも\n\tこのあたりでしか　とれない\n\tバラの形の　石らしいよ。\n@c0@"
30:
  de: "@a@b*: Meine Schwester hat sich mit meinem Vater gestritten und ist davongestürmt. Ich glaube kaum, dass sie je wieder zurückkommt.\n@c0@"
  en: "@a@b*: My sister had a fight with my dad and stormed out. I think she's never coming back.\n@c0@"
  es: "@a@b*: Mi hiermana si pieleó con mi padre y si largó de malos modos. No crieo que vuelva jamás, sí.\n@c0@"
  fr: "@a@b*ⓢ Ma sœur est partie de la maison après s'être disputée avec mon père. Je suis sûr qu'elle reviendra jamais.\n@c0@"
  it: "@a@b*: Mia sorella ha litigato con papà ed è uscita sbattendo la porta.\nSecondo me non tornerà più...\n@c0@"
  ja: "@a@b＊「たいていは　砂に　埋まっていたり\n\tするみたいだけど　このあたりは\n\t毎夜　砂嵐が　舞うから……。\n@c0@"
31:
  de: "@a@b*: Ich hoffe, sie ist wohlauf.\n@c0@"
  en: "@a@b*: I hope she's okay.\n@c0@"
  es: "@a@b*: Espiero que si encuentre bien.\n@c0@"
  fr: "@a@b*ⓢ J'espère qu'il ne lui est rien arrivé.\n@c0@"
  it: "@a@b*: Spero che non le succeda niente di male...\n@c0@"
  ja: "@a@b＊「宿に泊まって　よく朝\n\t砂漠を歩いてみれば　きっと\n\t見つけられるんじゃないかな。\n@c0@"
32:
  de: "@a@b*: Ein wandernder Bänkelsänger wie ich hat schon vieles gesehen, aber dieses Schloss hat mich wirklich verblüfft.\n@c0@"
  en: "@a@b*: A wandering minstrel such as myself has seen many places, but this castle was a complete\r\nsurprise to me.\n@c0@"
  es: "@a@b*: Los juglares ambulantes como yo han visto muchos lugares, pero este castillo consiguió sorprenderme.\n@c0@"
  fr: "@a@b*ⓢ Un ménestrel itinérant comme moi visite bon nombre d'endroits, mais je dois reconnaître que ce château m'a véritablement surpris.\n@c0@"
  it: "@a@b*: Ho girato il mondo in lungo e in largo, e di posti strani ne ho visti tanti in vita mia.\nQuesto castello, però, li batte tutti!\n@c0@"
  ja: "@a@b＊「ボクの　お姉ちゃん\n\tお父さんと　ケンカして\n\t家を　出ちゃったんだよ。\n@c0@"
33:
  de: "@a@b*: Die Menschen hier erzählen sich wundersame Geschichten von einem legendären Helden, die ihnen ihre Ahnen und Urahnen überliefert haben.\n@c0@"
  en: "@a@b*: The people here have wonderful tales about a legendary hero, passed down to them from their parents, and their parents' parents.\n@c0@"
  es: "@a@b*: La gente cuenta historias maravillosas sobre un héroe legendario, historias que les han contado sus padres, y a estos los padres de sus padres.\n@c0@"
  fr: "@a@b*ⓢ Les gens d'ici ont des histoires incroyables sur un certain héros légendaire. Ils se les transmettent de génération en génération.\n@c0@"
  it: "@a@b*: Da queste parti si narrano da sempre le imprese dell'Eroe Leggendario. Si tratta di antiche storie tramandate di generazione in generazione.\n㈡\n*: Chissà se in esse c'è un fondo di verità...\n@c0@"
  ja: "@a@b＊「元気で　やってるかなあ……。\n@c0@"
34:
  de: "@a@b*: Vor langer, langer Zeit stieg einmal eine Zenithianerin vom Himmel herab.\n@c0@"
  en: "@a@b*: Far in the dim and distant past, a Zenithian woman descended from the heavens.\n@c0@"
  es: "@a@b*: En la noche de los tiempos, una mujier de Zenithia diescendió de los cielos, sí.\n@c0@"
  fr: "@a@b*ⓢ En des temps sombres et lointains, une femme zénithienne descendit des cieux.\n@c0@"
  it: "@a@b*: Molto tempo fa, una donna proveniente da Zenithia scese nel nostro mondo.\n@c0@"
  ja: "@a@b＊「私は　旅の　ぎんゆう詩人ですが\n\tこの城に　来てみて\n\t本当に　びっくりしました。\n@c0@"
35:
