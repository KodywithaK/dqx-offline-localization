  fr: "@aLe vieux Bricabrac@bParfaitⓠ C'est décidéⓠ La Galericabrac est à vous.\nFélicitationsⓠ Vous êtes %A0110%Xle nouveau conservateur%Z%B0110%Xla nouvelle conservatrice%Z.\n@c0@"
  it: "@aGeremia@bSono senza parole... Anzi, no: qualcosa da dire ce l'ho! %O0960%XCongratulazioni, mio giovane amico: sei il nuovo direttore%YHo deciso: %a000090 sarà il nuovo direttore%Z del Museo del Souvenir!\n@c0@"
  ja: "@a@bデスじい「しかし　お前さんの\n\t持ち物の中には　わしの求めておる\n\t名産品はないようじゃ。\n@c0@"
