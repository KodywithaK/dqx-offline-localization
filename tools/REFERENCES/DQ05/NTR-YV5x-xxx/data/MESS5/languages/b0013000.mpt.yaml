  it: "@a@bⓕOggi... Uhm, tanto per cambiare non ho idea di che giorno sia.ⓖ\n㈡\nⓕHo sempre sognato che nel mio Museo del Souvenir dovessero essere esposti oggetti diversi provenienti da ogni paese del mondo.ⓖ\n@c0@"
