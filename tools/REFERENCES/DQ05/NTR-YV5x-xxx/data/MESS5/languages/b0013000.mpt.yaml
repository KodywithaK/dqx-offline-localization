263:
  de: "@a@b*: Hallo! Ich bin Kati. Kati Krams. Ich bin ganz verrückt nach Krimskrams, wisst Ihr. Das muss mir wohl im Blut liegen.\n@c0@"
  en: "@a@b*: Hello! I'm Sue. Sue Veneer. I'm absolutely crazy about knick-knacks, you know. It's sort of in me blood, I s'pose.\n@c0@"
  es: "@a@b*: ¡Hola! Soy Nuray. Nuray Niada. Las cosinas mi chiflan. Diebo de llievarlo en la sangre, sí.\n@c0@"
  fr: "@a@b*ⓢ Bonjour, je m'appelle Marie-Jo... Marie-Jo Konde. J'adore les objets de collection. Je dois avoir ça dans le sang.\n@c0@"
  it: "@a@b*: Salve! Io sono Sue Venir, e sono una grandissima appassionata di souvenir.\nCom'è che si dice? ⓕNomen omenⓖ, no?\n@c0@"
  ja: "@a@bデスじい「ところで…\n\tじつは　３階に　変な男が\n\tいすわってしもうたんじゃ。\n@c0@"
264:
  de: "@aKati Krams@bDarum finde ich es toll, dass Franz Firle mir die Chance gibt, hier zu arbeiten. Das wird er bestimmt nicht bereuen!\n@c0@"
  en: "@aSue Veneer@bSo it's grand altogether that old Mr Knack's given me the chance to work here like this. He won't regret it!\n@c0@"
  es: "@aNuray Niada@bAsí que es genial que el abuelo Nino mi haya dado la oportunidad de triabajar aquí. ¡No si arrepientirá!\n@c0@"
  fr: "@aMarie-Jo Konde@bAlors c'est vraiment génial que monsieur Bricabrac m'ait permis de travailler ici. Il ne va pas le regretterⓠ\n@c0@"
  it: "@aSue Venir@bSono anche un'amante delle antichità, quindi mi troverò benissimo con il vecchio Geremia!\n㈡\nEhm, intendo dire che gli sono grata per avermi dato la possibilità di lavorare in questo posto...\n@c0@"
  ja: "@a@bデスじい「高い入場料を\n\t受け取ってしまったからのう。\n\t出ていけとは言えんし　困ったわい。\n@c0@"
265:
  de: "@aFranz Firle@bHaaach... Ohne Ausstellungsstücke taugt das beste Museum nix.\n@c0@"
  en: "@aOld Man Nick Knack@bHaaa...\nA museum's nuttin' without exhibits.\n@c0@"
  es: "@aAbuelo Nino@bAaaay...\r\nUn museo no es nada sin piezas que exponer.\n@c0@"
  fr: "@aLe vieux Bricabrac@bAaah...\r\nUn musée n'est rien sans exposition.\n@c0@"
  it: "@aGeremia@bSono gli oggetti in esposizione che rendono grande un museo.\n@c0@"
  ja: "@a@bデスじい「お客さんが　来るようになったから\n\t受付に　人を　やとったんじゃよ。\n@c0@"
266:
  de: "@aFranz Firle@bIch kann wohl kaum erwarten, dass jemand kommt, wenn es hier gar nichts zu sehen gibt, was? Haaach...\n@c0@"
  en: "@aOld Man Nick Knack@bI can't be expectin' anyone to visit while I don't have any exhibits now, can I? Haaa...\n@c0@"
  es: "@aAbuelo Nino@b¿Cómo va a venir nadie a visitarlo si no hay ninguna pieza expuesta? Aaaay...\n@c0@"
  fr: "@aLe vieux Bricabrac@bC'est normal que personne ne vienne s'il n'y a rien à voir, nonⓡ Aaah...\n@c0@"
  it: "@aGeremia@bAcci e poi denti!\nNon posso certo aspettarmi di avere visitatori, se non espongo un bel po' di souvenir, eh?!\n@c0@"
  ja: "@a@bデスじい「若い娘さんが\n\t受付にいると\n\t華やかでええのう！\n@c0@"
267:
  de: "@aFranz Firle@bEs führen viele Wege zum Ziel, aber wir sollten doch lieber die Sammlung erweitern, anstatt die Ausstellungsstücke herumzuräumen.\n@c0@"
  en: "@aOld Man Nick Knack@bSure and there's more than one way to skin a cat, but we should be concentratin' on expandin' the collection now, not jiggin' about with the displays.\n@c0@"
  es: "@aAbuelo Nino@bSeguro que hay muchas formas de hacer las cosas, pero ahora debemos pensar en aumentar la colección, no en mover las cosinas de acá para allá.\n@c0@"
  fr: "@aLe vieux Bricabrac@bJe sais qu'il y a toujours plusieurs manières de faire, mais il faudrait peut-être se concentrer sur l'extension de la collection.\n@c0@"
  it: "@aGeremia@bIn questo momento dobbiamo concentrarci su come far crescere la collezione di souvenir del Museo.\nI piedistalli senza oggetti non attirano i visitatori!\n@c0@"
  ja: "@a@b＊「はじめまして　ミミです。\n\t名産に　すごーく\n\t興味があるんです。\n@c0@"
268:
  de: "@aFranz Firle@bNur weil wir ein bisschen Schnickschnack ausstellen, wird man uns nicht gleich die Bude einrennen, wisst Ihr.\n@c0@"
  en: "@aOld Man Nick Knack@bJust 'cause we're exhibitin' a few knick-knacks now doesn't mean the world 'n' his wife'll be queuin' up at the door, y'know.\n@c0@"
  es: "@aAbuelo Nino@bAunque ahora tengamos unas pocas cosinas no creo que la gente se ponga a hacer cola en la puerta como si fuese el ni-no va más.\n@c0@"
  fr: "@aLe vieux Bricabrac@bCe n'est pas parce qu'on expose quelques bricoles que la terre entière va faire la queue devant la porte.\n@c0@"
  it: "@aGeremia@bI pochi souvenir che abbiamo in questo momento non attireranno le torme di visitatori che il mio Museo merita di accogliere.\n@c0@"
  ja: "@a@bミミ「ここで働けて　うれしいです。\n\t一生けんめい　がんばりますね！\n@c0@"
269:
  de: "@aFranz Firle@bEs dauert sicher eine Weile, bis sich die Sache herumgesprochen hat, darum müsst Ihr Euch ein bisschen gedulden.\n@c0@"
  en: "@aOld Man Nick Knack@bIt'll take a quare while fer the news to spread,\r\nso ye'll need to be patient.\n@c0@"
  es: "@aAbuelo Nino@bPasará un tiempino hasta que corra la voz, hay que tener paciencia.\n@c0@"
  fr: "@aLe vieux Bricabrac@bLe bouche à oreille va prendre quelque temps, mais il faut savoir être patient.\n@c0@"
  it: "@aGeremia@b%H0860%XDevi%YDovete%Z continuare a portare nuovi oggetti.\nPiù ne arriveranno, più il Museo diventerà famoso.\n@c0@"
  ja: "@a@bデスじい「はぁ～～～～～～……。\n\tみごとに　なにも\n\tかざられておらんのう…。\n@c0@"
270:
  de: "@aFranz Firle@bDie Ausstellungssäle quellen förmlich über vor Wüstenrosen. Haaach... Das Ganze ist eine einzige Wüste voller Rosen.\n@c0@"
  en: "@aOld Man Nick Knack@bThe exhibition halls are overflowin' with desert roses. Haaa... The whole place is just one big\r\ndesert o' roses.\n@c0@"
  es: "@aAbuelo Nino@bLas salas de exposición están repletas de rosas del desierto. Aaaay... Esto no es más que un gran desierto de rosas.\n@c0@"
  fr: "@aLe vieux Bricabrac@bLes salles du musée sont pleines de roses des sables. Aaah... La prochaine fois, rapportez un chameau et deux ou trois dunes, et on s'y croira vraiment.\n@c0@"
  it: "@aGeremia@bMa questo è il Museo del Souvenir o il festival dei fiori, eh?! Acci e poi denti!\nTutte le sale sono piene di rose del deserto...!\n@c0@"
  ja: "@a@bデスじい「これじゃあ\n\tお前さんたちが来る前と\n\t変わらんわい。　はぁ～～……。\n@c0@"
271:
  de: "@aFranz Firle@bMit Schokomünzen können wir uns fast totwerfen.\n@c0@"
  en: "@aOld Man Nick Knack@bThe whole place is overflowin' with chocolate medalliyums.\n@c0@"
  es: "@aAbuelo Nino@bEste sitio está abarrotado de medallones de chocolate.\n@c0@"
  fr: "@aLe vieux Bricabrac@bLe musée est plein de médailles en chocolat.\n@c0@"
  it: "@aGeremia@bIl Museo trabocca di medaglie di cioccolato.\n@c0@"
  ja: "@a@bデスじい「ならべ方は　いろいろ\n\tあるじゃろうが　とにかく今は\n\tたくさん　ならべるのが　先決じゃな！\n@c0@"
272:
  de: "@aFranz Firle@bHier riecht's schon wie in einer Schokoladenfabrik. Allmählich steigt mir der ganze Zucker zu Kopf. Haaach...\n@c0@"
  en: "@aOld Man Nick Knack@bIt smells like a sweet factory in here, so it does.\nAll that sugar's goin' to me head. Haaa...\n@c0@"
  es: "@aAbuelo Nino@bHuele como una fábrica de caramelos.\r\nEl azúcar se me sube a la cabecina. Aaaay...\n@c0@"
  fr: "@aLe vieux Bricabrac@bJ'ai l'impression de me retrouver dans une confiserie. En plus, tout ce sucre, ça m'écœure. Aaah...\n@c0@"
  it: "@aGeremia@bCe ne sono talmente tante che mi sono venute le carie alla dentiera...\n@c0@"
  ja: "@a@bデスじい「名産品をならべても\n\tすぐに　お客さんがくるとは\n\tかぎらんじゃろうな。\n@c0@"
273:
  de: "@aFranz Firle@bDas Museum ist bis obenhin vollgestopft mit Buddelschiffen!\n@c0@"
  en: "@aOld Man Nick Knack@bThe museum's stuffed to the gunwales with\r\nships in bottles!\n@c0@"
  es: "@aAbuelo Nino@b¡El museo está lleno hasta los topes de barcos en botella!\n@c0@"
  fr: "@aLe vieux Bricabrac@bLe musée est plein à craquer de bateaux en bouteille.\n@c0@"
  it: "@aGeremia@bSbaglio o il Museo del Souvenir non contiene altro che navi in bottiglia?!\n@c0@"
  ja: "@a@bデスじい「博物館が　できたという\n\tうわさは　流しておいたから\n\tしばらく　待ってみるとするかのう。\n@c0@"
274:
  de: "@aFranz Firle@bDabei ist diese schöne kleine Insel wie gemacht für einen Souvenirladen. So eine Verschwendung! Die würden uns glatt ein paar Goldmünzen einbringen.\n@c0@"
  en: "@aOld Man Nick Knack@bAnd here we are on this fine little island, the perfect place fer a souvenir shop too. Haaa... What a waste! We could've made a few bob sellin' them.\n@c0@"
  es: "@aAbuelo Nino@bY aquí estamos, en esta islita, el lugar perfecto para una tienda de recuerdos. Aaaay... ¡Qué desperdicio!\n㈡\nPodríamos haberlos vendido y ganado unas cuantas monedas de oro.\n@c0@"
  fr: "@aLe vieux Bricabrac@bVous me direz qu'une petite île est l'endroit idéal pour monter un magasin de souvenirs. Aaah...\n㈡\nC'est dommageⓠ En les vendant, on pourrait au moins se faire un peu d'argent.\n@c0@"
  it: "@aGeremia@bFossero state bottiglie di quello buono, avrei ⓕpersonalmente liquidatoⓖ l'eccedenza...\nMa le navi proprio non riesco a berle!\n@c0@"
  ja: "@a@bデスじい「展示室が　さばくのバラで\n\tうめつくされておる…。　はぁ～…\n\tこれでは　さばくのバラ博物館じゃ。\n@c0@"
275:
  de: "@aFranz Firle@bHaaach... Dieses Ding ein Museum zu nennen ist ja schon peinlich.\n@c0@"
  en: "@aOld Man Nick Knack@bHaaa... 'Tis embarrassin' altogether callin' this place\r\na museum.\n@c0@"
  es: "@aAbuelo Nino@bAaaay... Este sitio no merece que lo llamemos musenino.\n@c0@"
  fr: "@aLe vieux Bricabrac@bAaah... Je trouve ça presque embarrassant d'appeler cet endroit un musée.\n@c0@"
  it: "@aGeremia@bAcci e poi denti!\nQuesto posto non merita nemmeno di essere chiamato ⓕmuseoⓖ!\n@c0@"
  ja: "@a@bデスじい「展示室が　メダル型チョコで\n\tうめつくされておる…。\n@c0@"
276:
  de: "@aFranz Firle@bDas ist allenfalls eine mickrige Ausstellung. Ich gäbe meinen Heiligenschein für mehr Schnickschnack, aber dazu wird es wohl so schnell nicht kommen. Haaach...\n@c0@"
  en: "@aOld Man Nick Knack@bⓙTis a meagre display at best. I'd give up me halo to have more knick-knacks, so I would, but I don't s'pose that'll happen any time soon. Haaa...\n@c0@"
  es: "@aAbuelo Nino@bA lo más es una exposición ridícula. Daría mi vida (que no tengo) por tener unas cuantas cosinas más, pero eso va a llevar su tiempo. Aaaay...\n@c0@"
  fr: "@aLe vieux Bricabrac@bIl n'y a pas grand-chose d'exposé. Ça ferait pas de mal d'avoir quelques pièces en plus, mais j'ai pas l'impression que ça arrivera de sitôt. Aaah...\n@c0@"
  it: "@aGeremia@bLa mia collezione è proprio misera. Venderei l'anima al diavolo per avere qualche oggetto in più, ma è talmente vecchia che nemmeno lui la vuole!\n@c0@"
  ja: "@a@bデスじい「どこも　かしこも\n\t甘いにおいだらけで\n\tはぁ～～…　クラクラするのう。\n@c0@"
277:
  de: "@aFranz Firle@bNa, wenigstens haben wir jetzt etwas mehr Schnickschnack. Aber die leeren Podeste sehen immer noch erbärmlich aus.\n@c0@"
  en: "@aOld Man Nick Knack@bWell at least we've a few more knick-knacks in the place now. But the empty pedestals still stand out like sore thumbs.\n@c0@"
  es: "@aAbuelo Nino@bParece que ya vamos teniendo unas cuantas cosinas, pero los pedestales vacíos destacan más que un oso en una clase de ballet.\n@c0@"
  fr: "@aLe vieux Bricabrac@bOn a déjà quelques pièces en plus, mais voir tous ces emplacements vides me fait un peu mal au cœur.\n@c0@"
  it: "@aGeremia@bOra il Museo ha un po' di oggetti da esibire, ma i piedistalli inutilizzati sono ancora troppi.\n@c0@"
  ja: "@a@bデスじい「展示室が　ボトルシップで\n\tうめつくされておる……。\n@c0@"
278:
  de: "@aFranz Firle@bHaaach... Bis die alle in Gebrauch sind, gibt's mich wahrscheinlich gar nicht mehr. Ach, Unfug. Klar gibt's mich dann noch. Wozu ist man schließlich ein Geist.\n@c0@"
  en: "@aOld Man Nick Knack@bHaaa...\nI s'pose I'll be long gone before they're all in use.\nOh, no. ⓙCourse I won't, I'm a ghost!\n@c0@"
  es: "@aAbuelo Nino@bAaaay...\nSupongo que cuando estén todos llenos yo ya no estaré entre los vivos.\n㈡\nBueno, claro que no, ¡si ya soy un fantasma!\n@c0@"
  fr: "@aLe vieux Bricabrac@bAaah... Je serai sûrement mort et enterré avant qu'ils ne soient tous occupés.\r\nEt c'est même pas possible. Je suis déjà mort.\n@c0@"
  it: "@aGeremia@bAcci e poi denti! Chissà quanto tempo ci vorrà per completare la collezione! Ah, non importa: ho ancora una lunga vita davanti a me...\n@c0@"
  ja: "@a@bデスじい「はあ…　ここは　島なのに…\n\t海も船も　見られるのに…\n\tここは　みやげもの屋じゃないのに。\n@c0@"
279:
  de: "@aFranz Firle@bAllmählich fängt es an, wie ein richtiges Firlefanzeum auszusehen! Ja, das ist eine schöne Sammlung, das kann man nicht anders sagen.\n@c0@"
  en: "@aOld Man Nick Knack@bⓙTis startin' to look like a real knick-knackatory now! Aye, 'tis a fine collection, so it is.\n@c0@"
  es: "@aAbuelo Nino@b¡Esto ya comienza a tener pinta de musenino de verdad!\r\nQué bonita colección.\n@c0@"
  fr: "@aLe vieux Bricabrac@bJe dois admettre que ça commence à ressembler à une véritable Galericabrac.\nC'est une bien belle collection qu'on a là.\n@c0@"
  it: "@aGeremia@bQuesto posto assomiglia sempre di più a un vero Museo del Souvenir, ora che ci sono tanti begli oggettini in esposizione!\n@c0@"
  ja: "@a@bデスじい「はぁ…　博物館というには\n\tまだまだ　展示品の数が\n\t少ないようじゃのう…。\n@c0@"
280:
  de: "@aFranz Firle@bAber nachdem wir die Erwartungen der Besucher hochgeschraubt haben, werden sie neue Stücke sehen wollen, nicht? Also husch, bringt mir mehr!\n@c0@"
  en: "@aOld Man Nick Knack@bBut ye've given the visitors expectations now!\nThey'll be wantin' to see new displays, won't they? Be off with ye now and find sometin' fresh!\n@c0@"
  es: "@aAbuelo Nino@b¡Pero ahora los visitantes esperarán más del musenino!\n㈡\n¡Querrán ver novedades! ¡En marcha! ¡A por más cosinas!\n@c0@"
  fr: "@aLe vieux Bricabrac@bMais, vous connaissez le public. Il en veut toujours plus. Il va falloir agrandir la collection. Repartez trouver de nouvelles pièces.\n@c0@"
  it: "@aGeremia@bLe aspettative dei visitatori, però, sono cresciute, e la gente vuole novità in continuazione! Quindi...\nScat-tarrre! %H0860%XFila%YFilate%Z a cercare altri souvenir!\n@c0@"
  ja: "@a@bデスじい「いろいろな　名産品を\n\t持ってきて　ほしいのう…。\n\tはぁ～　ほしいのう…。\n@c0@"
281:
  de: "@aFranz Firle@bDa soll mich doch der und jener ⓚⓛ! So sicher wie ich ein Geist bin, sind die Podeste fast voll, oder etwa nicht?\n@c0@"
  en: "@aOld Man Nick Knack@bWell I'll play five on yer hive! Sure as I'm a ghost,\r\nthe pedestals are nearly all full, are they not?\n@c0@"
  es: "@aAbuelo Nino@b¡Esto está de muerte! ¡Como que soy un fantasma! ¡Casi todos los pedestales están lleninos!\n@c0@"
  fr: "@aLe vieux Bricabrac@bC'est pas mal du toutⓠ Aussi vrai que je suis un fantôme, les piédestaux me paraissent presque tous utilisés.\n@c0@"
  it: "@aGeremia@bSbaglio o quasi tutti i piedistalli del Museo accolgono un grazioso souvenir?\nEh eh eh! Che spettacolo meraviglioso!\n@c0@"
  ja: "@a@bデスじい「だいぶ　展示品の数も\n\t増えてきたようじゃが\n\tまだまだ　カラの台座が目立つわい。\n@c0@"
282:
  de: "@aFranz Firle@bAber bis alle Podeste belegt sind, werde ich wohl warten müssen, bis sie meine alten Knochen wieder ausbuddeln. Haaach...\n@c0@"
  en: "@aOld Man Nick Knack@bOnly, I s'pose I'll have to wait 'til they're diggin' up me bones before the whole lot's taken care of. Haaa...\n@c0@"
  es: "@aAbuelo Nino@bPero seguro que tengo que esperar hasta que me desentierren para verlos todos ocupados. Aaaay...\n@c0@"
  fr: "@aLe vieux Bricabrac@bCe qui me chagrine, c'est qu'on aura probablement déterré mes os avant que la collection ne soit complète. Aaah...\n@c0@"
  it: "@aGeremia@bAncora un po' e la collezione sarà completa!\nPoi potrò finalmente riposare in pace...\n@c0@"
  ja: "@a@bデスじい「はぁ～～…\n\tすべての台座が　うまるのは\n\tまだ　先の先の先かのう…。\n@c0@"
283:
  de: "@aFranz Firle@bEi der Daus! Ein großartiges Gefühl, alle Podeste in Gebrauch zu sehen!\n@c0@"
  en: "@aOld Man Nick Knack@bWell give a dog a bone! 'Tis a grand feelin' altogether to see every pedestal in use!\n@c0@"
  es: "@aAbuelo Nino@b¡Entre todos la mataron y ella sola se murió! ¡Es espléndido ver todos los pedestales ocupados!\n@c0@"
  fr: "@aLe vieux Bricabrac@bJe dois reconnaître que je suis tout retournéⓠ J'en reviens pas de voir tous les piédestaux occupésⓠ\n@c0@"
  it: "@aGeremia@bMi venisse un colpo secco! Anzi, no. Il colpo secco può aspettare ancora qualche decennio...\nNon c'è un solo piedistallo inutilizzato! Fantastico!\n@c0@"
  ja: "@a@bデスじい「展示品が増えて　だいぶ\n\t博物館らしくなってきたわい！\n@c0@"
284:
  de: "@aFranz Firle@bAber das ist erst der Anfang! Wir brauchen noch mehr und wertvollere Ausstellungsstücke, wenn wir wollen, dass das Museum ernst genommen wird.\n@c0@"
  en: "@aOld Man Nick Knack@bBut this is just the beginnin'! Ye're barely playin' one on me thumb now. We need exhibits that are more valuable if the museum's to be taken seriously.\n@c0@"
  es: "@aAbuelo Nino@b¡Pero esto no es más que el principio! No hemos hecho más que empezar. Necesitamos piezas más valiosas para que la gente se tome el musenino en serio.\n@c0@"
  fr: "@aLe vieux Bricabrac@bMais ce n'est qu'un débutⓠ Il va falloir faire mieux.\nIl va nous falloir des pièces plus précieuses si vous voulez que les gens prennent le musée au sérieux.\n@c0@"
  it: "@aGeremia@bQuesto è solo l'inizio. Adesso dobbiamo trovare altri souvenir ancora più preziosi, così la fama del Museo continuerà a crescere!\n@c0@"
  ja: "@a@bデスじい「ほい　お前さん！\n\tお客さんが　お待ちかねじゃぞ！\n\t新しい名産を　探してこんかい！\n@c0@"
285:
  de: "@aFranz Firle@bEine Schande, so ein schönes Stück an so einem schäbigen Ort zu platzieren!\n@c0@"
  en: "@aOld Man Nick Knack@bⓙTis a shame to put such a fine article in such a dismal place as this.\n@c0@"
  es: "@aAbuelo Nino@bEs una lástima exponer un artículo de calidad en un sitio dejado de la mano de la Diosa como este.\n@c0@"
  fr: "@aLe vieux Bricabrac@bC'est vraiment dommage de mettre des pièces d'une telle valeur dans un endroit pareil.\n@c0@"
  it: "@aGeremia@bUn souvenir tanto bello non può stare in un posto del genere!\n@c0@"
  ja: "@a@bデスじい「あと　少しで\n\t台座が　全部　うまりそうじゃな。\n@c0@"
286:
  de: "@aFranz Firle@bAber still, Firle Franz! Ich wollte das schließlich ganz Euch überlassen, nicht? Da darf ich mich jetzt nicht einmischen.\n@c0@"
  en: "@aOld Man Nick Knack@bAra, be whist, Nick! I said I was leavin' it up to you now, didn't I? I shouldn't be stickin' me nose in.\n@c0@"
  es: "@aAbuelo Nino@bPero, ¡los muertos no hablan! Dije que lo dejaba a tu gusto, ¿no? No debo meter la nariz donde no me llaman.\n@c0@"
  fr: "@aLe vieux Bricabrac@bAaah, je me taisⓠ J'ai dit que je vous laissais vous occuper de ça. Je ne devrais pas fourrer mon nez partout.\n@c0@"
  it: "@aGeremia@bAcci e poi denti! Dimenticavo che questi non sono affari miei... %O0960%XSei tu il direttore del Museo, quindi queste scelte spettano a te%Y%0%a000090 è il direttore del Museo, quindi queste scelte spettano a lui%Z.\n@c0@"
  ja: "@a@bデスじい「はぁ…　しかし\n\tこの　あとちょっとが\n\t長かったりするんじゃよなあ…。\n@c0@"
