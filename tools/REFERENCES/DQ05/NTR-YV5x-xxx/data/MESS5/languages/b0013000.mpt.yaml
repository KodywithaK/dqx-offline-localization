  de: "@aFranz Firle@bDas wird ein wenig frischen Wind in die Bude bringen, wenn ein Mädel wie sie am Empfang sitzt.\n@c0@"
  en: "@aOld Man Nick Knack@bIt'll bring a breath of fresh air to the ole place to have a quare lass like her sat behind the desk.\n@c0@"
  es: "@aAbuelo Nino@bTener una mujer así de guapa en la entrada será como un soplo de vida para este viejo museo.\n@c0@"
