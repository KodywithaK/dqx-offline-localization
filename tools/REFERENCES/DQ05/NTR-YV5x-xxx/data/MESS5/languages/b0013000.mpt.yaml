  ja: "@a@bデスじい「ただし　名産品を置きかえたり\n\tみがくのは　お客さんのいない\n\t夜にするのが　ルールじゃぞ。\n@c0@"
255:
  de: "@aFranz Firle@bAber ich kann ihn ja nicht gut rausschmeißen, oder? Wo doch der Eintritt gar nicht billig ist. Der würde mir was erzählen!\n@c0@"
  en: "@aOld Man Nick Knack@bBut I can't very well throw him out now, can I?\r\nNot with the entrance fee bein' so dear an' all.\r\nHe'd most likely tell me to bog off.\n@c0@"
  es: "@aAbuelo Nino@bPero ahora que la entrada es tan cara, supongo que no puedo echarlo.\r\nSeguro que me tratará de pollino.\n@c0@"
  fr: "@aLe vieux Bricabrac@bMais je ne peux pas vraiment le mettre dehors.\r\nLe billet d'entrée coûte tellement cher.\r\nIl m'enverrait paître.\n@c0@"
  it: "@aGeremia@bPerò non posso certo mandarlo via!\nDopotutto, ha pagato il biglietto d'ingresso, e ha il diritto di girare per le sale tutto il tempo che vuole.\n@c0@"
  ja: "@a@bデスじい「おお　お前さんたちか！\n\t貴重な　名産品が\n\tふえたから　警備の者をやとったよ。\n@c0@"
256:
  de: "@aFranz Firle@bGroßartig, dass wir jetzt eine Wache haben. Da können wir uns entspannen und die Ausstellung genießen. Ihr bringt doch noch mehr Exponate?\n@c0@"
  en: "@aOld Man Nick Knack@bAh, 'tis grand now we've a security guard on the premises. We can all relax an' enjoy the exhibits.\r\nYe'll keep 'em comin' now, won't ye?\n@c0@"
  es: "@aAbuelo Nino@b¡Qué bien!, ahora que tenemos un guardia de seguridad podemos estar tranquilos y disfrutar de la exposición.\n㈡\n%H0860%XVas%YVais%Z a volver por aquí, ¿verdad?\n@c0@"
  fr: "@aLe vieux Bricabrac@bMaintenant qu'il y a un gardien, nous allons pouvoir nous détendre et admirer la collection. De votre côté, continuez à rassembler des pièces, d'accordⓡ\n@c0@"
  it: "@aGeremia@bAver assunto un sorvegliante mi fa sentire molto più tranquillo. Adesso non dobbiamo più temere furti né danneggiamenti.\n@c0@"
  ja: "@a@bデスじい「それから　お客さんが\n\t困らないように　受付にも\n\t人を　やとったんじゃよ。\n@c0@"
