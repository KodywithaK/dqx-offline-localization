  en: "@aRodrigo Briscoletti@bStill, I realise some people find it hard to\r\ninterpret their own emotions. Nevertheless,\r\na decision must be made.\n@c0@"
  es: "@aDon Rimaldi@bPero comprendo que a algunos les cueste interpretar las suas propias emozioni. Sea como sea, hay que decidire.\n@c0@"
  fr: "@aRodrigo Oscuroni@bJe sais que certaines personnes ont parfois du mal à interpréter leurs propres émotions. Mais quoi qu'il en soit, tu dois prendre une décision.\n@c0@"
  it: "@aRick Fosconi@bIo capisce che molta gente ha bisogno di tanto time per accomprendere bene sentimenti che tiene in loro cuore, ma... You devi fare tua scelta!\n@c0@"
  ja: "@a@bルドマン「まあ　自分の気持ちは\n\t自分でも　分かりにくいもの\n\tだからな。　それも　よかろう。\n@c0@"
149:
