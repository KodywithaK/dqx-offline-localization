  de: "@a@b*: Keine Ahnung, wie sich das so entwickelt hat. Es kommt wohl darauf an, wie man gleich am Anfang die Aufgaben verteilt.\n@c0@"
  en: "@a@b*: I don't know how things ended up like this.\r\nIt all depends on what kind of a start you get off to, I think.\n@c0@"
  es: "@a@b*: No sé cómo acabaron así las cosas.\r\nSupongo que todo se fragua en los comienzos.\n@c0@"
  fr: "@a@b*ⓢ Je ne sais pas comment on en est arrivés là.\nJ'imagine que tout dépend de la manière dont ça commence.\n@c0@"
  it: "@a@b*: In altre parole, faccio il ⓕcasalingoⓖ. Avrei dovuto immaginare che sarei finito in questo modo, visto che ho deciso di sposare una donna in carriera...\n@c0@"
  ja: "@a@b＊「思えば　結婚とは\n\t神が　人に　与えたもうた\n\tふしぎの　ひとつですね。\n@c0@"
437:
  de: "@a@b*: Willkommen in der Onassetti-Residenz.\n@c0@"
  en: "@a@b*: Welcome to the Briscoletti residence.\n@c0@"
  es: "@a@b*: Bienvenid%H0860%X%A0110%Xo%Z%B0110%Xa%Z%Y%R0000%Xas%Yos%Z%Z a la residencia Rimaldi.\n@c0@"
  fr: "@a@b*ⓢ Bienvenue au manoir Oscuroni.\n@c0@"
  it: "@a@b*: Salve, e %H0860%X%A0110%Xbenvenuto%Z%B0110%Xbenvenuta%Z%Y%R0000%Xbenvenute%Ybenvenuti%Z%Z a Palazzo Fosconi.\n@c0@"
  ja: "@a@b＊「あんた　ぼやぼやしてないで\n\tお茶でも　入れてよ！\n@c0@"
438:
  de: "@aRodrigo Onassetti@bAh! Die Jungvermählten! Gut seht Ihr zusammen aus! Sehr gut!\n@c0@"
  en: "@aRodrigo Briscoletti@bAh-ha! The happy duo! You look fine together.\r\nYes, very fine!\n@c0@"
  es: "@aDon Rimaldi@b¡Ajá! ¡El feliz duetto! Tenéis buen aspecto. ¡Fenomenal!\n@c0@"
  fr: "@aRodrigo Oscuroni@bAh ahⓠ Voilà nos deux tourtereauxⓠ\nVous formez un joli coupleⓠ Oui, un bien joli coupleⓠ\n@c0@"
  it: "@aRick Fosconi@bAh-ha! Ecco nostri sposini!\nSembrate davvero felici insieme, yes!\n@c0@"
  ja: "@a@b＊「あら？　主人じゃなかったの？\n\tわるかったわねえ。\n@c0@"
439:
  de: "@aRodrigo Onassetti@bPrinz Harry und seine Frau sind heute Morgen schon abgereist.\n@c0@"
  en: "@aRodrigo Briscoletti@bPrince Harry and his wife left early this morning.\n@c0@"
  es: "@aDon Rimaldi@bEl príncipe Froilán y su mujer se fueron di buona mattina.\n@c0@"
  fr: "@aRodrigo Oscuroni@bLe prince Harry et sa femme sont partis à l'aube.\n@c0@"
  it: "@aRick Fosconi@bPrincipe Robert e sua mugliera sono arripartiti questa mattina di buon'ora.\n@c0@"
  ja: "@a@b＊「今日も　女房は仕事。\n\t私は　せっせと\n\tごはんの用意っと。\n@c0@"
440:
  de: "@aRodrigo Onassetti@bEr hatte ein paar sehr interessante Dinge zu sagen über %O0960%Xdich, weißt du, %a000090%Y%a000090%Z.\n@c0@"
  en: "@aRodrigo Briscoletti@bHe had some very interesting things to say about %O0960%Xyou, you know, %a000090%Y%a000090, you know%Z.\n@c0@"
  es: "@aDon Rimaldi@bTenía cosas interesantes que decir de %O0960%Xti, %a000090%Y%a000090%Z.\n@c0@"
  fr: "@aRodrigo Oscuroni@bIl m'a dit des choses très intéressantes sur %O0960%Xtoi, %a000090%Y%a000090%Z.\n@c0@"
  it: "@aRick Fosconi@bLui ha arraccontato a me molte cose %O0960%Xdi te, %a000090%Ydi %a000090%Z, yes.\n@c0@"
  ja: "@a@b＊「でも　どうして　こうなったん\n\tだろうなあ……。\n\tやっぱり　はじめが肝心だったな。\n@c0@"
441:
  de: "@aRodrigo Onassetti@bIch habe gehört, du suchst nach einem legendären Helden.\n@c0@"
  en: "@aRodrigo Briscoletti@bI hear you're travelling in search of a\r\nlegendary hero.\n@c0@"
  es: "@aDon Rimaldi@bHe oído que viajas buscando a un héroe de leyenda.\n@c0@"
  fr: "@aRodrigo Oscuroni@bIl paraît que %O0960%Xtu es%Yvous êtes%Z à la recherche d'un héros légendaire.\n@c0@"
  it: "@aRick Fosconi@bHo saputo che %O0960%Xtu stai%Ylui sta%Z a ricerca di Eroe Leggendario...\n@c0@"
  ja: "@a@b＊「いらっしゃいませ。\n\tここは　ルドマンさまの\n\t屋敷でございます。\n@c0@"
442:
  de: "@aRodrigo Onassetti@bJa, ich glaube, da habe ich genau das Richtige für dich.\n@c0@"
  en: "@aRodrigo Briscoletti@bWell, I believe I have just the thing for you.\n@c0@"
  es: "@aDon Rimaldi@bBene, creo que puedo ayudarte.\n@c0@"
  fr: "@aRodrigo Oscuroni@bEh bien, je crois que j'ai ce qu'il %O0960%Xte%Yvous%Z faut.\n@c0@"
  it: "@aRick Fosconi@bWell, forse %O0960%Xti%Ylo%Z posso aiutare, yes.\n@c0@"
  ja: "@a@bルドマン「よ！　ご両人の\n\tおでましかっ。　なかなか\n\t似合いの　夫婦だぞ。\n@c0@"
443:
  de: "@aRodrigo Onassetti@bIn den zwei Truhen hinter mir findest du ein paar Geschenke für dich.\n@c0@"
  en: "@aRodrigo Briscoletti@bYou'll find some gifts from me in the two chests behind me here. They're both unlocked. The contents are yours.\n@c0@"
  es: "@aDon Rimaldi@bEn los due cofres a la mia espalda encontrarás algunos regalos. Están abiertos. El contenido es para te.\n@c0@"
  fr: "@aRodrigo Oscuroni@b%O0960%XTu trouveras%YVous trouverez%Z quelques bricoles dans les coffres derrière moi. Ils ne sont pas fermés. Tout est pour %O0960%Xtoi%Yvous%Z.\n@c0@"
  it: "@aRick Fosconi@bHo dei regali per %H0860%Xyou. Stanno dentro agli scrigni che si trovano dietro di me. Aprili e apprendi tutto quello che vuoi%Yvoi. Stanno dentro agli scrigni che si trovano dietro di me. Apriteli e apprendete tutto quello che volete%Z.\n@c0@"
  ja: "@a@bルドマン「ヘンリーさんたちは\n\t今朝早く　お帰りになったが……\n@c0@"
444:
  de: "@aRodrigo Onassetti@bIch habe außerdem dafür gesorgt, dass du eines meiner Schiffe benutzen kannst. Du findest es im Hafen von Bakenmünde, wann immer du es brauchst.\n@c0@"
  en: "@aRodrigo Briscoletti@bI've also arranged for you to have the use of one of my ships. It's moored at Lodestar Harbour for you whenever you want.\n@c0@"
  es: "@aDon Rimaldi@bTambién te he concedido el uso de uno de mis barcos. Está en Puerto Polaris, para cuando lo necesites.\n@c0@"
  fr: "@aRodrigo Oscuroni@bJe me suis aussi arrangé pour que %O0960%Xtu puisses utiliser un de mes bateaux à ta guise%Yvous puissiez utiliser un de mes bateaux à votre guise%Z.\nIl est à quai à Port-Lanterne.\n@c0@"
  it: "@aRick Fosconi@bInoltre, %H0860%Xti offro anche una di mie navi. È ancorata a Grandport, e you ti puoi imbarcare quando ti pare%Yvi offro anche una di mie navi. È ancorata a Grandport, e vi potete imbarcare quando vi pare%Z, yes.\n@c0@"
  ja: "@a@bルドマン「%a000090のことを\n\tいろいろと　聞かせてもらった。\n@c0@"
445:
  de: "@aRodrigo Onassetti@bDieses Schiff ist sozusagen das Tiramisu unter den seetüchtigen Schiffen: Es taugt für jede Reise, auf der du es brauchen könntest. Also nimm es ruhig!\n@c0@"
  en: "@aRodrigo Briscoletti@bIt's to sea-faring vessels what tiramisu is to desserts ⓚⓛ the best there is! Ready for any voyage you care to embark on. So make use of it soon!\n@c0@"
  es: "@aDon Rimaldi@bEs a los barcos lo que el tiramisú a los postres: ¡il migliore! Está listo para cualquier viaggio que inicies. ¡No dudes en usarlo!\n@c0@"
  fr: "@aRodrigo Oscuroni@bPlus qu'un bateau, c'est presque une gondola...\nIl n'y a pas mieuxⓠ Il %O0960%Xt'%Yvous %Zemmènera où %O0960%Xtu veux.\nAlors n'hésite%Yvous voulez.\nAlors n'hésitez%Z pas un instant à l'utiliser.\n@c0@"
  it: "@aRick Fosconi@bÈ nave meravigliosa, very beautiful. %H0860%XYou la puoi usare per andare dove vuoi, e aspetta solo te per salpare%YLa potete usare per andare dove volete, e aspetta solo voi per salpare%Z.\n@c0@"
  ja: "@a@bルドマン「なんでも\n\t伝説の勇者を　さがして\n\t旅をしているとか。\n@c0@"
446:
  de: "@aRodrigo Onassetti@bDu gefällst mir%O0960%X, %a000090%Y%Z. Du bist ein solider Kerl. Solide wie altbackene Panini!\n@c0@"
  en: "@aRodrigo Briscoletti@bI like you%O0960%X, %a000090%Y%Z. You're solid.\nAs solid as a stale panini!\n@c0@"
  es: "@aDon Rimaldi@bMe piaces%O0960%X, %a000090%Y%Z. Eres %A0110%Xintegro%Z%B0110%Xintegra%Z. ¡Como un panini di frutti di mare!\n@c0@"
  fr: "@aRodrigo Oscuroni@bJe %O0960%Xt'aime bien, %a000090.%Yvous aime bien.%Z\n%O0960%XTu es digne%YVous êtes dignes%Z de confiance.\nComme le serait le meilleur des pizzaïoli... \n@c0@"
  it: "@aRick Fosconi@b%O0960%XYou sei in gamba, %a000090%Y%0%a000090 è in gamba%Z.\nForte, coraggioso, onesto.\nVery good man, yes!\n@c0@"
  ja: "@a@bルドマン「そこでだ！\n\t私からの　祝いを\n\t受けとってくれい！\n@c0@"
447:
  de: "@aRodrigo Onassetti@bAlso! Ich wünsche euch alles Gute auf euren gemeinsamen Abenteuern.\n@c0@"
  en: "@aRodrigo Briscoletti@bSo! I wish you all the best on your\r\nadventures together.\n@c0@"
  es: "@aDon Rimaldi@b¡Pues venga! Os deseo lo migliore en vuestras aventuras juntos.\n@c0@"
  fr: "@aRodrigo Oscuroni@bJe vous souhaite bonne chance pour les aventures qui vous attendent.\n@c0@"
  it: "@aRick Fosconi@bBuon viaggio, e good luck per %H0860%Xtue%Yvostre%Z avventure!\n@c0@"
  ja: "@a@bルドマン「うしろの　宝箱のカギを\n\tあけておいたから　なかの物を\n\t持ってゆくがいい。\n@c0@"
448:
  de: "@aRodrigo Onassetti@bLegt von Bakenmünde einen südlichen Kurs an, dann kommt ihr schließlich zum sogenannten Wüstenreich von Helmunaptra.\n@c0@"
  en: "@aRodrigo Briscoletti@bSteer a course south from Lodestar Harbour and you should eventually come to what's known as\r\nthe desert queendom of Helmunaptra.\n@c0@"
  es: "@aDon Rimaldi@bSi desde Puerto Polaris vais en direzione sur, al final llegaréis a lo que se conoce como el reino de la regina del desierto Leopatra.\n@c0@"
  fr: "@aRodrigo Oscuroni@bSi %O0960%Xtu prends%Yvous prenez%Z plein sud en partant de\nPort-Lanterne, %O0960%Xtu arriveras%Yvous arriverez%Z au\nroyaume désertique d'Helmunaptra.\n@c0@"
  it: "@aRick Fosconi@bSalpando da Grandport e dirigendosi verso sud, si arriva a Regno Desertico di Faraonia, yes.\n@c0@"
  ja: "@a@bルドマン「それから\n\tポートセルミにある　私の船も\n\t自由に　使っていいぞ。\n@c0@"
449:
  de: "@aRodrigo Onassetti@bAber ihr seid ja schließlich frisch verheiratet, nicht wahr? Da solltet ihr einen Zwischenstopp für die Flitterwochen einlegen.\n@c0@"
  en: "@aRodrigo Briscoletti@bMind you, you're newly-weds, aren't you? You must stop off on the way for a little honeymoon.\n@c0@"
  es: "@aDon Rimaldi@bPorque estáis recién casados, ¿no? Tendréis que disfrutar de una luna di miele.\n@c0@"
  fr: "@aRodrigo Oscuroni@bCeci dit, %O0960%Xtu viens de te%Yvous venez de vous%Z marier... Il faut faire une petite escale pour votre lune de miel.\n@c0@"
  it: "@aRick Fosconi@bPerò due sposini freschi freschi dovrebbero acconcedersi uno poco di honey-moon, no?\nUna bella luna con il miele!\n@c0@"
  ja: "@a@bルドマン「あの船なら　かなりの\n\t長旅にも　たえられるだろうからな。\n\tすぐに　連絡しておこう。\n@c0@"
450:
  de: "@aRodrigo Onassetti@bWenn ihr von Bakenmünde nach Osten segelt, dann kommt ihr zu meinem Kasinoschiff, der Ventuno, und der kleinen Stadt Ponton.\n@c0@"
  en: "@aRodrigo Briscoletti@bIf you head east from Lodestar Harbour instead, you'll come to my casino ship, the Ventuno, and\r\nthe little town of Pontoon.\n@c0@"
  es: "@aDon Rimaldi@bSi desde Puerto Polaris vais en direzione este, llegaréis a mi barco casino, el Musini, y a la pequeña localidad de Órdago.\n@c0@"
  fr: "@aRodrigo Oscuroni@bEn mettant le cap à l'est de Port-Lanterne, %O0960%Xtu tomberas%Yvous tomberez%Z sur mon bateau casino, le Vingt-et-un,\net sur la petite ville de Nacao.\n\n@c0@"
  it: "@aRick Fosconi@bA est di Grandport ci sta la Jolly Ace, my bella nave-casinò.\nLì avvicino ci sta pure villaggio di Robamazz.\n@c0@"
  ja: "@a@bルドマン「ともかく　私は\n\t%a000090たちが　気に入ったのだ。\n@c0@"
451:
  de: "@aRodrigo Onassetti@bNennt dort meinen Namen, dann sorgen meine Leute dafür, dass ihr die beste Suite auf dem Schiff bekommt!\n@c0@"
  en: "@aRodrigo Briscoletti@bMention my name, and my staff will see you're given the best suite on the vessel!\n@c0@"
  es: "@aDon Rimaldi@b¡Mencionad mi nombre y os darán el mejor camarote de tutto il barco!\n@c0@"
  fr: "@aRodrigo Oscuroni@bIl suffira de prononcer mon nom pour que l'équipage %O0960%Xte%Yvous%Z donne la meilleure cabine du bateau.\n@c0@"
  it: "@aRick Fosconi@b%H0860%XFai mio nome, ed equipaggio ti%YFate mio nome, ed equipaggio vi%Z addarà room più bella di tutta nave.\nOh, yesss!\n@c0@"
  ja: "@a@bルドマン「夫婦　仲良く　助け合い\n\tよい旅をなっ！\n@c0@"
452:
  de: "@aRodrigo Onassetti@bUnd ihr solltet auch einige altbekannte Orte noch einmal aufsuchen.\n@c0@"
  en: "@aRodrigo Briscoletti@bAnd you should go and visit some of your old\r\nhaunts too.\n@c0@"
  es: "@aDon Rimaldi@bY también deberíais visitar algunos de los lugares de la vostra infancia.\n@c0@"
  fr: "@aRodrigo Oscuroni@bEt n'hésite%O0960%X%Yz%Z pas à retourner dans les endroits que %O0960%Xtu connais%Yvous connaissez%Z déjà.\n@c0@"
  it: "@aRick Fosconi@bPoi, se %H0860%Xtieni time, potresti pure avvisitare luoghi di tua%Ytenete time, potreste pure avvisitare luoghi di vostra%Z gioventù.\n@c0@"
  ja: "@a@bルドマン「ポートセルミから　船で\n\t南に向かえば　やがて\n\tテルパドールの国に　着くだろう。\n@c0@"
453:
  de: "@aRodrigo Onassetti@bEs gibt doch sicher jede Menge Orte aus deiner Jugend, die du lange nicht besucht hast, oder?\n@c0@"
  en: "@aRodrigo Briscoletti@bThere must be plenty of places from your youth that you haven't visited for a while, hm?\n@c0@"
  es: "@aDon Rimaldi@bHabrá muchos sitios que hace mucho que no veis, ¿no?\n@c0@"
  fr: "@aRodrigo Oscuroni@bIl doit y avoir beaucoup d'endroits de %O0960%Xton%Yvotre%Z enfance que %O0960%Xtu n'as%Yvous n'avez%Z pas revus depuis longtemps, nonⓡ\n@c0@"
  it: "@aRick Fosconi@bIo mi penso che ci stanno molti posti che non %H0860%Xhai%Yavete%Z visto per tanti anni.\nSarà bello tornarci, yes.\n@c0@"
  ja: "@a@bルドマン「しかし　せっかくの新婚だ。\n\t途中すこし　寄り道をして\n\t楽しんで行くといい。\n@c0@"
454:
  de: "@aRodrigo Onassetti@bAlso! Ich wünsche euch alles Gute auf euren gemeinsamen Abenteuern.\n@c0@"
  en: "@aRodrigo Briscoletti@bSo! I wish you all the best on your\r\nadventures together.\n@c0@"
  es: "@aDon Rimaldi@b¡Pues venga! Os deseo lo migliore en vuestras aventuras juntos.\n@c0@"
  fr: "@aRodrigo Oscuroni@bJe vous souhaite bonne chance pour les aventures qui vous attendent.\n@c0@"
  it: "@aRick Fosconi@bBuon viaggio, e good luck per %H0860%Xtue%Yvostre%Z avventure!\n@c0@"
  ja: "@a@bルドマン「まずは　ポートセルミから　東\n\t近くの海にうかぶ　カジノ船。\n@c0@"
455:
  de: "@aRomana@bDu brauchst dir wirklich keine Sorgen um Nera zu machen.\n@c0@"
  en: "@aRomana@bIf you're worried about Nera, there's really no need.\n@c0@"
  es: "@aRomana@bNo debes preocuparte por Nera, de verdad.\n@c0@"
  fr: "@aRomana Oscuroni@bNe vous inquiétez pas pour Nera. Je vous assure.\n@c0@"
  it: "@aRosanna Fosconi@bNon %H0860%Xpreoccuparti per Nera%Ypreoccupatevi per Nera%Z.\nNon ce n'è bisogno.\n@c0@"
  ja: "@a@bルドマン「宿泊するときに\n\t私の名を　出せば\n\t特別室に　泊めてくれるはずだ。\n@c0@"
456:
  de: "@aRomana@bIch weiß, sie wird bald einen wunderbaren Ehemann finden. Nenn es weibliche Intuition, wenn du willst.\n@c0@"
  en: "@aRomana@bI know she'll find a wonderful husband before long. Call it women's intuition.\n@c0@"
  es: "@aRomana@bNo tardará en encontrar un marido estupendo. Intuición femenina.\n@c0@"
  fr: "@aRomana Oscuroni@bVous pouvez appeler ça de l'intuition féminine, mais je suis sûre qu'elle trouvera rapidement un bon mari.\n@c0@"
  it: "@aRosanna Fosconi@bSento che presto anche lei incontrerà l'uomo giusto, colui che diventerà suo marito. %H0860%XChiamalo intuito femminile, se vuoi%YChiamatelo intuito femminile, se volete%Z, ma so che accadrà!\n@c0@"
  ja: "@a@bルドマン「それから　２人で\n\tなつかしい場所を　めぐるのも\n\tいいかもしれんな。\n@c0@"
457:
  de: "@aNera@bIch war gelb vor Neid, als ich euch beide so glücklich zum Altar gehen sah!\n@c0@"
  en: "@aNera@bI was green with envy seeing the two of you so happy as you walked up the aisle!\n@c0@"
  es: "@aNera@b¡Me puse verde de envidia cuando os vi così felices en la iglesia!\n@c0@"
  fr: "@aNera@bJe vous ai vraiment enviés quand je vous ai vus entrer dans l'église. Vous aviez l'air si heureuxⓠ\n@c0@"
  it: "@aNera@bQuando vi ho visti camminare verso l'altare ho provato un pizzico di invidia, lo confesso...\nOra, però, va meglio. Mi sento più serena.\n@c0@"
  ja: "@a@bルドマン「幼なじみ　なのだから\n\tなつかしい場所も　あるだろう？\n@c0@"
458:
  de: "@aNera@bIch hoffe, ihr werdet uns irgendwann noch einmal besuchen. Ihr seid immer willkommen.\n@c0@"
  en: "@aNera@bI hope you'll come and visit us again sometime.\r\nYou're always welcome.\n@c0@"
  es: "@aNera@bEspero que vengáis presto a visitarnos. Seréis benvenuti.\n@c0@"
  fr: "@aNera@bJ'espère que vous reviendrez nous voir.\r\nVous serez toujours les bienvenus.\n@c0@"
  it: "@aNera@bSpero che %H0860%Xtornerai%Ytornerete%Z a trovarci presto.\n%H0860%XTi%YVi%Z accoglieremo a braccia aperte.\n@c0@"
  ja: "@a@bルドマン「夫婦　仲良く　助け合い\n\tよい旅をなっ！\n@c0@"
459:
  de: "@aNera@bVielleicht bin ich das nächste Mal, wenn ihr kommt, schon selbst verheiratet!\n@c0@"
  en: "@aNera@bMaybe I might even be married the next time you come! You never know!\n@c0@"
  es: "@aNera@b¡Può darsi que cuando volváis ya me haya casado! ¡Nunca se sabe!\n@c0@"
  fr: "@aNera@bJe serai peut-être même mariée la prochaine foisⓠ\nQui saitⓡ\n@c0@"
  it: "@aNera@bMagari, quando ci rivedremo, anch'io sarò sposata!\nEh eh eh!\n@c0@"
  ja: "@a@b＊「フローラのことなら\n\t心配なさらないでね。\n@c0@"
460:
  de: "@a@b*: Reisen zu zweit ist schöner als Reisen allein. Und mit dreien noch schöner, falls Ihr wisst, was ich meine.\n@c0@"
  en: "@a@b*: Travelling's better with two than one.\r\nAnd better with three than two, if you see\r\nwhat I mean.\n@c0@"
  es: "@a@b*: Los viajes son mejores en compañía. Y cuanta más compañía mejor, no sé si me entiendes.\n@c0@"
  fr: "@a@b*ⓢ C'est toujours mieux de voyager à deux que tout seul. C'est même encore mieux à trois, si vous voyez ce que je veux dire.\n@c0@"
  it: "@a@b*: Viaggiare in due è più divertente che farlo da soli, no? E in tre è anche meglio!\nNon so se mi sono spiegato... Eh eh eh!\n@c0@"
  ja: "@a@b＊「今に　きっと\n\tいい相手が　見つかりますわ。\n@c0@"
461:
  de: "@a@b*: Je mehr, desto besser!\n@c0@"
