  en: "@aRodrigo Briscoletti@bI, I like you too, but... No! No, no! That's not an option. You will reconsider.\n@c0@"
  es: "@aDon Rimaldi@bTú me gustas también, ma... ¡No! ¡No, no! Ni hablar.\r\nReconsidéralo.\n@c0@"
  fr: "@aRodrigo Oscuroni@bJe-Je t'aime bien, mais... nonⓠ\nNon, nonⓠ Ce n'est pas possible.\nRéfléchis encore.\n@c0@"
  it: "@aRick Fosconi@bAnche io ti voglio bene, ti arrispetto e ti stimo...\nMa non puoi mica sposare me, eh!\n@c0@"
  ja: "@a@bルドマン「そ　それはいかん！\n\tもう１度　考えてみなさい。\n@c0@"
151:
