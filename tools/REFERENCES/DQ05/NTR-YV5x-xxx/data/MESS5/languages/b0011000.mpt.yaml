  es: "@a@b*: ¡Mira quién está aquí! No has podido dormir, ¿eh, %a000090?\n@c0@"
  fr: "@a@b*ⓢ V'là notre Don Juanⓠ Vous arrivez pas à dormir, %a000090ⓡ\n@c0@"
  it: "@a@b*: Anvedi chi c'è!\nEcco er nostro sorgiovanni! Che c'è, %a000090, sei aggitato e nun riesci a ddormi'?\n@c0@"
  ja: "@a@b＊「よう　%a000090さん。\n\t眠れないのかい。\n@c0@"
93:
  de: "@a@b*: Ich kann's Euch nicht verdenken. Das ist eine schwere Entscheidung, so viel ist mal sicher. Eine Ehe muss ein Leben lang halten.\n@c0@"
  en: "@a@b*: I don't blame you. It's a biggie, that's for sure. That marriage lark's a lifetime commitment.\n@c0@"
  es: "@a@b*: No te culpo. Estás en un brete, eso seguro. ¡El matrimonio es todo un compromiso!\n@c0@"
  fr: "@a@b*ⓢ J'vous jette pas la pierre.\nC'est une sacrée décision.\nⓥLe mariage, c'est pour la vieⓠⓦ, comme on dit.\n@c0@"
  it: "@a@b*: E tte credo! Questa è 'na cosa morto seria, bamboccio'. Cor matrimonio nun se scherza. Come se dice? ⓕ'Na mojie è pe'ssempreⓖ, come 'ndiamante.\n㈡\n*: Anzi, no. Si er diamante te viene a nojia, t'o poi sempre venne'.\nA mojie t'a devi da tene'!\n@c0@"
  ja: "@a@b＊「悩むのも　無理ねえよな。\n\t結婚っていやあ\n\t一生の問題だからな。\n@c0@"
94:
  de: "@a@b*: Geht doch ein wenig spazieren, um den Kopf freizubekommen. Dann seht Ihr vielleicht etwas klarer.\n@c0@"
  en: "@a@b*: Go for a walk and clear your head.\nThat'll help you get things straight.\n@c0@"
  es: "@a@b*: Sal a pasear para aclararte las ideas.\r\nAsí podrás ordenar tus preferencias.\n@c0@"
  fr: "@a@b*ⓢ Allez faire un tour pour vous vider la tête.\nComme ça, vous y verrez plus clair.\n@c0@"
  it: "@a@b*: Vatte a ffa' na passeggiata.\nMagaro l'aria fresca t'aiuterà a schiaritte l'idee.\n@c0@"
  ja: "@a@b＊「散歩でもして　頭を冷やせば\n\t考えが　まとまるかも\n\t知れないぜ。\n@c0@"
95:
  de: "@a@b*: Kommt zurück, wenn Ihr müde werdet. Das Zimmer bleibt für Euch reserviert.\n@c0@"
  en: "@a@b*: Come back if you get tired. The room's still yours.\n@c0@"
  es: "@a@b*: Vuelve si estás cansado.\r\nAquí tienes tu habitación.\n@c0@"
  fr: "@a@b*ⓢ Revenez quand vous serez fatigué.\nOn vous garde la chambre.\n@c0@"
  it: "@a@b*: Ricordate che 'a notte porta conziglio, ma è puro fatta pe' ddormi'!\nAnvedi quant'è 'mportante 'a notte, ahò!\n@c0@"
  ja: "@a@b＊「また　眠くなったら\n\tオレに　言いなよ。\n@c0@"
96:
  de: "@a@b*: Und, seht Ihr jetzt klarer? Meint Ihr, Ihr könnt jetzt schlafen?\n@c0@"
  en: "@a@b*: Things any clearer now?\nThink you can get back to sleep?\n@c0@"
  es: "@a@b*: ¿Ya lo tienes claro?\r\n¿Podrás dormir un poco?\n@c0@"
  fr: "@a@b*ⓢ Vous y voyez plus clairⓡ\nVous croyez que vous allez pouvoir fermer l'œilⓡ\n@c0@"
  it: "@a@b*: Te sei schiarito l'idee?\nAllora mo' te ne vai annanna?\n@c0@"
  ja: "@a@b＊「散歩して　少しは\n\t落ちついたろう。\n\tもう　休むかね？\n@c0@"
97:
  de: "@a@b*: Na dann. Ruht Euch vor der großen Bekanntgabe morgen noch ein bisschen aus, hm?\n@c0@"
  en: "@a@b*: Okay, then. Get some rest before the big announcement tomorrow, eh?\n@c0@"
