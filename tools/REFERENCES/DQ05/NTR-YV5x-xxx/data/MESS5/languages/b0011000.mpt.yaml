  fr: "@aRodrigo Oscuroni@bMamma miaⓠ Est-ce que ça voudrait dire que tu en pinces pour moi, %a000090ⓠⓑ\n@c0@"
  it: "@aRick Fosconi@bUè, my boy?!\nSei tutto crazy?!\nTi va di scherzare, yes?!\n@c0@"
  ja: "@a@bルドマン「なんと　この私が\n\t好きと申すか！？\n@c0@"
150:
