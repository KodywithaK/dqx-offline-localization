  es: "@aDon Rimaldi@bSé que habrá sido una decisione molto difficile. ¡Pero no vas a casarte con las due! ¡Ja, ja, ja!\n@c0@"
  fr: "@aRodrigo Oscuroni@bJe sais que c'est une décision difficile à prendre, mais tu ne dois pas avoir les yeux plus grands que le ventre. Tu ne peux pas épouser les deux. Ha ha haⓠ\n@c0@"
  it: "@aRick Fosconi@bIo capisce che questa è decisione difficile da apprendere, ma you non puoi mica sposare tutte due! Tengo ragione, no?\n@c0@"
