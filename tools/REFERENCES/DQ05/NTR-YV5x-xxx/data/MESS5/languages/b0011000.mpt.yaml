  en: "@a@b*: Don't be cheeky, %a000090! I might accept, and then you'd be in all kinds of trouble!\n@c0@"
  es: "@a@b*: ¡No seas descarado, %a000090! ¡Podría aceptar, y entonces estarías en un buen lío!\n@c0@"
  fr: "@a@b*ⓢ Ne soyez pas impertinent, %a000090ⓠ\nJe pourrais accepter et vous seriez dans de sales drapsⓠ\n@c0@"
  it: "@a@b*: Oh, %a000090! Sei proprio un giocherellone!\nSono davvero lusingata... Apprezzo la tua galanteria, ma ora devi scegliere sul serio.\n@c0@"
  ja: "@a@b＊「あら　いやですよ\n\t%a000090さん。　年寄りを\n\tからかわないで下さいな。\n@c0@"
152:
  de: "@aRomana@bAch, das erinnert mich an meine Jugend.\n@c0@"
  en: "@a@b*: All this reminds me of my courting days.\n@c0@"
  es: "@aRomana@bEsto me recuerda mis días de noviazgo.\n@c0@"
  fr: "@a@b*ⓢ Tout cela me rappelle ma jeunesse.\n@c0@"
  it: "@a@b*: Questa situazione mi ha fatto ricordare i giorni in cui molti baldi giovani ambivano a conquistare il mio cuore.\n@c0@"
  ja: "@a@b＊「なんだか　私の若い頃を\n\t思い出すわ。\n@c0@"
153:
  de: "@aRomana@bRodrigo war selbst ein richtiger kleiner Romeo, weißt du. Er musste sich in große Gefahr begeben, um meine Hand zu erlangen.\n@c0@"
  en: "@a@b*: Rodrigo was quite the Romeo himself, you know.\r\nHe had to put himself in great danger to win my hand in marriage.\n@c0@"
  es: "@aRomana@bSantino era todo un Romeo.\r\nTuvo que afrontar muchos peligros para lograr mi mano.\n@c0@"
  fr: "@a@b*ⓢ Rodrigo était aussi un vrai Roméo, vous savez.\nIl a dû prendre de gros risques pour obtenir ma main.\n@c0@"
  it: "@a@b*: Rick era un vero dongiovanni e un uomo coraggioso. Non esitò a correre innumerevoli rischi, pur di convincermi a sposarlo!\n@c0@"
  ja: "@a@b＊「うちの人もね\n\t私と　結婚するために\n\t危険な　冒険をしたのよ。\n@c0@"
154:
