  fr: "@aRodrigo Oscuroni@bCommentⓠⓑ Espèce de petit scaramoucheⓠ Ce n'est pas une décision à prendre à la légèreⓠ\n@c0@"
  it: "@aRick Fosconi@bEhi, boy!\nGuarda che ti devi addecidere, yes!\n@c0@"
  ja: "@a@bルドマン「なんと！　ろくに\n\t考えずに　決めてしまうとは\n\t軽はずみなやつだ。\n@c0@"
148:
