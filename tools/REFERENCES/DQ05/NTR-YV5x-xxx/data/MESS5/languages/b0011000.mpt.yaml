  fr: "@a@b*ⓢ C'est bien. Allez vous reposer avant la grande nouvelle de demain.\n@c0@"
  it: "@a@b*: Bravo, bamboccio'.\nVedi de riposatte, così domani sarai bbello fresco e potrai fa' l'annunciazione ufficiale.\n@c0@"
  ja: "@a@b＊「そうかい。\n\tじゃあ　ごゆっくり！\n@c0@"
98:
  de: "@a@b%3Am folgenden Morgen...%4\n@c0@"
  en: "@a@b%3The following morning...%4\n@c0@"
  es: "@a@b%3A la mañana siguiente...%4\n@c0@"
  fr: "@a@b%3Le lendemain matin...%4\n@c0@"
  it: "@a@b%3Il mattino seguente...%4\n@c0@"
  ja: "@a@b　　　　　　　そして　次の朝……。\n@c0@"
99:
  de: "@a@b%3%0%a000090 wird zur Villa der Onassettis bestellt.%4\n@c0@"
  en: "@a@b%3%0%a000090 is summoned to the Briscoletti mansion.%4\n@c0@"
  es: "@a@b%3%0%a000090 es convocado a la mansión Rimaldi.%4\n@c0@"
  fr: "@a@b%3%0%a000090 fut convoqué au manoir des Oscuroni.%4\n@c0@"
  it: "@a@b%3%0%a000090 è convocato a Palazzo Fosconi.%4\n@c0@"
  ja: "@a@b　　　　　%a000090は　ルドマンの屋敷に\n　　　　　　　　呼びだされた。\n@c0@"
100:
  de: "@a@b*: Ach, Ihr seid doch %a000090, nicht? Die ganze Stadt redet nur von Euch.\n@c0@"
  en: "@a@b*: Oh, you're %a000090, aren't you?\nYou're the talk of the town now, you know.\n@c0@"
  es: "@a@b*: ¡Oh!, eres %a000090, ¿no?\nEres la comidilla del lugar, ¿sabes?\n@c0@"
  fr: "@a@b*ⓢ Oh, vous êtes %a000090, c'est çaⓡ\nTout le monde parle de vous en ville, vous savezⓡ\n@c0@"
  it: "@a@b*: Oh, %a000090, eccoti.\nIn città tutti parlano di te.\n@c0@"
  ja: "@a@b＊「あら　あなた　%a000090さんね。\n\t町中　あなたのウワサで\n\tもちきりよ。\n@c0@"
101:
  de: "@a@b*: Wie soll man sich da entscheiden...\n@c0@"
  en: "@a@b*: What to do, what to do...\n@c0@"
  es: "@a@b*: ¿Qué hacer, qué hacer...?\n@c0@"
  fr: "@a@b*ⓢ Que faire...ⓡ Que faire...ⓡ\n@c0@"
  it: "@a@b*: Certo, la scelta è difficile...\n@c0@"
  ja: "@a@b＊「うーん　悩むよなあ……。\n@c0@"
102:
  de: "@a@b*: Bianca scheint ihren eigenen Kopf zu haben, aber sie ist fröhlich und sieht dazu auch noch toll aus.\n@c0@"
  en: "@a@b*: Bianca seems a bit strong-willed, but she's cheerful, and an absolute stunner to go with it.\n@c0@"
  es: "@a@b*: Bianca parece un poco terca pero es muy alegre, y la verdad es que está de toma pan y moja.\n@c0@"
  fr: "@a@b*ⓢ Bianca semble un peu têtue, mais elle est gaie et super belle, en plus.\n@c0@"
  it: "@a@b*: Bianca ha un carattere molto forte, ma è una persona allegra e vitale.\nE poi è una ragazza di una bellezza senza pari!\n@c0@"
  ja: "@a@b＊「ビアンカさんは\n\tちょっと　気が強そうだけど\n\t明るくて　とびきりの美人だし……\n@c0@"
103:
  de: "@a@b*: Aber ein freundlicheres, ehrlicheres Mädchen als Nera werdet Ihr kaum finden. Sicher wird sie eine wunderbare Ehefrau abgeben.\n@c0@"
  en: "@a@b*: But you won't find a kinder, more honest girl than Nera. There's no doubt she'd make a fine wife.\n@c0@"
  es: "@a@b*: Pero no encontrarás a nadie más honrado y gentil que Nera. No hay duda de que sería una gran esposa.\n@c0@"
  fr: "@a@b*ⓢ Mais vous ne trouverez pas de fille plus douce et plus droite que Nera. Elle ferait sans aucun doute une excellente épouse.\n@c0@"
  it: "@a@b*: Nera, però, è una fanciulla gentile, onesta e sensibile.\nSarebbe senza dubbio una moglie perfetta!\n@c0@"
  ja: "@a@b＊「フローラさんは\n\t素直で　やさしくて\n\tいい奥さんに　なりそうだし……。\n@c0@"
104:
  de: "@a@b*: Onassetti soll den Brautschleier bei einem sehr guten Händler bestellt haben.\n@c0@"
  en: "@a@b*: Apparently, Briscoletti's ordered the bride's veil from a big-shot item trader.\n@c0@"
  es: "@a@b*: Creo que Rimaldi ha encargado el velo de novia a un comerciante muy importante.\n@c0@"
  fr: "@a@b*ⓢ Apparemment, Oscuroni a commandé le voile de mariée à un important marchand d'objets.\n@c0@"
  it: "@a@b*: Mister Fosconi ha ordinato a un famoso commerciante un pregiato velo nuziale per il matrimonio di Nera.\n㈡\nA quell'uomo piace fare le cose in grande...\n@c0@"
  ja: "@a@b＊「なんでも　ルドマンさんは\n\t腕のいい道具屋に　花嫁がかぶる\n\tヴェールを　注文したらしいぜ。\n@c0@"
105:
  de: "@a@b*: Welche werdet Ihr wählen?\n@c0@"
  en: "@a@b*: Who are you going to pick?\n@c0@"
  es: "@a@b*: ¿A quién vas a elegir?\n@c0@"
  fr: "@a@b*ⓢ Qui vous allez choisirⓡ\n@c0@"
  it: "@a@b*: Chi sposerai?\n@c0@"
  ja: "@a@b＊「どちらを　選ぶか……。\n@c0@"
106:
  de: "@a@b*: Wenn Ihr Euch erst entschieden habt, gibt's kein Zurück mehr. Ich würde erst zur Kirche gehen und beichten, damit Euch sonst nichts auf der Seele liegt.\n@c0@"
  en: "@a@b*: You can't go back on it once you've decided. I'd go to church and confess first, so you've got nothing else on your mind.\n@c0@"
  es: "@a@b*: Una vez te decidas no habrá vuelta atrás. Yo que tú iría a la iglesia y me confesaría, para no tener nada más en la cabeza.\n@c0@"
  fr: "@a@b*ⓢ Vous pourrez pas changer d'avis après. À votre place, j'irais d'abord me confesser à l'église. Comme ça, vous aurez plus rien d'autre sur la conscience.\n@c0@"
  it: "@a@b*: Una volta che avrai scelto, non potrai più tornare indietro. Fossi in te, andrei in chiesa a confessarmi.\nCosì, tanto per liberarmi dal peso dei miei peccati...\n@c0@"
  ja: "@a@b＊「一生の問題だからな\n\t教会で　お祈りでもしてから\n\t決めた方が　いいぜ。\n@c0@"
107:
  de: "@aBingo@bWuff, wuff...\n@c0@"
  en: "@aBingo@bAaarf, aaarf...\n@c0@"
  es: "@aBingo@bAaarf, aaarf...\n@c0@"
  fr: "@aBingo@bOuaf, ouaf...\n@c0@"
  it: "@aBingo@bArf! Arf! Arf...\n@c0@"
  ja: "@a@bリリアン「く～ん　く～ん。\n@c0@"
108:
  de: "@a@b*: Warum denken Männer immer nur an sich selbst?\n@c0@"
  en: "@a@b*: Why do men only ever think about themselves?\n@c0@"
  es: "@a@b*: ¿Por qué los hombres solo piensan en sí mismos?\n@c0@"
  fr: "@a@b*ⓢ Pourquoi les hommes pensent-ils toujours à euxⓡ\n@c0@"
  it: "@a@b*: Perché gli uomini sono sempre tanto egoisti?\n@c0@"
  ja: "@a@b＊「男って　どうして\n\t自分のことだけしか\n\t考えないのかしら……。\n@c0@"
109:
  de: "@a@b*: Zählen unsere Gefühle denn gar nichts? Ich wette, Nera und Bianca können auch nicht schlafen.\n@c0@"
  en: "@a@b*: Don't our feelings count for anything?\r\nI bet Nera and Bianca can't sleep, either.\n@c0@"
  es: "@a@b*: ¿Nuestros sentimientos no cuentan?\r\nSeguro que Nera y Bianca tampoco han dormido.\n@c0@"
  fr: "@a@b*ⓢ Nos sentiments à nous ne comptent pasⓡ\nJe suis sûre que Nera et Bianca ne dormiront pas non plus, cette nuit.\n@c0@"
  it: "@a@b*: I nostri sentimenti non contano, per loro.\nSono certa che né Nera né Bianca riusciranno a dormire, questa notte.\n@c0@"
  ja: "@a@b＊「少しは　選ばれる女の子の\n\t気持ちも　考えて欲しいわ。\n@c0@"
110:
  de: "@a@b*: Aber Ihr seid ja anscheinend der ruhige, sensible Typ, nicht wahr? Dann habt Ihr sicher auch schon daran gedacht.\n@c0@"
  en: "@a@b*: Mind you, you're the quiet, sensitive type, aren't you? I suppose you've already thought of that.\n@c0@"
  es: "@a@b*: Tú eres del tipo de hombre callado y sensible, ¿no? Supongo que ya habrás pensado en ello.\n@c0@"
  fr: "@a@b*ⓢ Enfin, vous, vous êtes plutôt du genre sensible.\nVous avez sûrement dû y penser.\n@c0@"
  it: "@a@b*: Però mi sembri diverso dagli altri. Sei una persona sensibile. Credo che tu comprenda bene cosa stiano provando quelle fanciulle...\n@c0@"
  ja: "@a@b＊「もちろん　あなたは\n\tやさしそうだし\n\tそうしてると　思うけどね。\n@c0@"
111:
  de: "@a@b*: Diese Bianca, die Ihr mitgebracht habt, ist eine tolle Frau.\n@c0@"
  en: "@a@b*: That Bianca girl you brought with you here,\r\nshe's a fine specimen, she is.\n@c0@"
  es: "@a@b*: Esa Bianca que trajiste aquí es un bombón, ¿eh?\n@c0@"
  fr: "@a@b*ⓢ Cette fille que vous avez amenée avec vous, Bianca, c'est un beau petit lot.\n@c0@"
  it: "@a@b*: La ragazza che hai portato qui...\nCome si chiama? Oh, sì. Bianca.\nBeh, è davvero uno schianto!\n@c0@"
  ja: "@a@b＊「あんたが　連れてきた\n\tビアンカって子。　あれは\n\tホントに　いい女だねえ。\n@c0@"
112:
  de: "@a@b*: Wenn Ihr sie nicht wollt, dann schubst sie doch mal in meine Richtung, ja? Sie kann jederzeit bei mir anfangen.\n@c0@"
  en: "@a@b*: If you don't pick her, point her in my direction, would you? She can have a job here any day.\n@c0@"
  es: "@a@b*: Si no la eliges mándala a hablar conmigo, ¿quieres? Aquí tendrá trabajo cuando quiera.\n@c0@"
  fr: "@a@b*ⓢ Si vous ne la choisissez pas, envoyez-la-moi.\nElle peut venir travailler ici quand elle veut.\n@c0@"
  it: "@a@b*: Se decidessi di non sposarla, dalle il mio indirizzo. Sarei lieto di avere al mio fianco una donna come lei! Anzi, ci andrei a nozze! Eh eh eh!\n@c0@"
  ja: "@a@b＊「もし　結婚しないなら\n\tうちの酒場で\n\t雇いたい　くらいだよ！\n@c0@"
113:
  de: "@a@b*: Ich an Eurer Stelle würde Nera nehmen.\n@c0@"
  en: "@a@b*: If it was me, I'd pick Nera.\n@c0@"
  es: "@a@b*: Yo elegiría a Nera.\n@c0@"
  fr: "@a@b*ⓢ À votre place, je choisirais Nera.\n@c0@"
  it: "@a@b*: Al posto tuo non avrei dubbi: sceglierei Nera.\n@c0@"
  ja: "@a@b＊「私だったら\n\tフローラさんに決めますな。\n@c0@"
114:
  de: "@a@b*: Wenn Ihr sie nehmt, bekommt Ihr gleichzeitig diesen fantastischen Familienschild.\n@c0@"
  en: "@a@b*: You pick her, and you automatically get yourself that amazing family shield as well.\n@c0@"
  es: "@a@b*: Si la escoges, consigues también ese asombroso escudo familiar.\n@c0@"
  fr: "@a@b*ⓢ Comme ça, vous faites coup double parce que vous récupérez aussi le précieux bouclier de la famille.\n@c0@"
  it: "@a@b*: Oltre a lei, avresti un mucchio di quattrini e lo scudo di famiglia dei Fosconi.\n@c0@"
  ja: "@a@b＊「フローラさんと　結婚すれば\n\t家宝の盾も　もらえるというし。\n@c0@"
115:
  de: "@a@b*: Was gibt's da noch groß zu überlegen?\n@c0@"
  en: "@a@b*: What's there to think about!?\n@c0@"
  es: "@a@b*: ¿Qué duda puede haber?\n@c0@"
  fr: "@a@b*ⓢ Alors qu'est-ce que vous attendezⓠⓑ\n@c0@"
  it: "@a@b*: Serve altro per convincerti?!\n@c0@"
  ja: "@a@b＊「なーんにも　悩むことなんか\n\tないじゃないですか。\n@c0@"
116:
  de: "@a@b*: Die Ehe ist eine gesegnete Verbindung zweier Seelen vor der Göttin.\n@c0@"
  en: "@a@b*: Marriage is a blessed union of two souls in the presence of the Goddess.\n@c0@"
  es: "@a@b*: El matrimonio es la unión sagrada de dos almas en presencia de la Diosa.\n@c0@"
  fr: "@a@b*ⓢ Le mariage est l'union sacrée de deux âmes en présence de la Déesse.\n@c0@"
  it: "@a@b*: Il matrimonio è l'atto d'amore con cui la dea benedice l'unione tra due persone che si vogliono bene.\n@c0@"
  ja: "@a@b＊「結婚とは　神さまも見守る\n\t神聖な儀式……。\n@c0@"
117:
  de: "@a@b*: Sie gewährt allen Paaren Glück, die wahre Liebe füreinander empfinden.\n@c0@"
  en: "@a@b*: She will bestow happiness upon any couple who truly love one another.\n@c0@"
  es: "@a@b*: Ella concede la felicidad a las parejas que se quieren de verdad.\n@c0@"
  fr: "@a@b*ⓢ Elle accordera le bonheur à tout couple qui s'aime véritablement.\n@c0@"
  it: "@a@b*: Ella non farà mai mancare la propria protezione alle coppie che restano sempre unite, qualunque cosa accada.\n@c0@"
  ja: "@a@b＊「心から愛する　相手となら\n\tきっと　神さまの祝福を\n\t得られることでしょう。\n@c0@"
118:
  de: "@a@b*: Stimmt es, dass Herr Onassetti Euch sein Einverständnis gegeben hat, Nera zu heiraten?\n@c0@"
  en: "@a@b*: Is it true that Mr Briscoletti's given you permission to marry Nera?\n@c0@"
  es: "@a@b*: ¿Es cierto que don Rimaldi te ha dado permiso para casarte con Nera?\n@c0@"
  fr: "@a@b*ⓢ C'est vrai que monsieur Oscuroni vous a donné la permission d'épouser Neraⓡ\n@c0@"
  it: "@a@b*: Ma è proprio vero che mister Fosconi ti ha concesso di sposare sua figlia Nera?\n@c0@"
  ja: "@a@b＊「ルドマンさんは　あんたを\n\tフローラの結婚相手として\n\tみとめたんだってね。\n@c0@"
119:
  de: "@a@b*: Ihr habt Euch dafür ja schließlich auch ins Zeug gelegt. Lothar wird natürlich am Boden zerstört sein, aber... ich wünsche Euch alles erdenklich Gute.\n@c0@"
  en: "@a@b*: Well, I suppose you did work for it.\r\nCrispin will be crushed, of course,\r\nbut still... I wish you every happiness.\n@c0@"
  es: "@a@b*: Seguro que te lo has trabajado.\r\nA Crispín le sentará fatal, pero... Os deseo toda la felicidad.\n@c0@"
  fr: "@a@b*ⓢ Enfin, je suppose que vous l'avez mérité.\nGaëtan ne va pas s'en remettre, mais... je vous souhaite tout de même d'être heureux.\n@c0@"
  it: "@a@b*: Te lo sei meritato! So che ti sei impegnato tantissimo per riuscirci! Però mi dispiace per Candido... Avrà il cuore a pezzi...\n@c0@"
  ja: "@a@b＊「アンディは　悲しむだろうけど\n\tあんたも　がんばったんだから\n\tしかたないよ。　幸せにおなり。\n@c0@"
120:
  de: "@a@b*: Ha-püh...\n@c0@"
  en: "@a@b*: Ah-phew...\n@c0@"
  es: "@a@b*: Ah-fiuu...\n@c0@"
  fr: "@a@b*ⓢ Ron-pfff...\n@c0@"
  it: "@a@b*: Rooonf...\n@c0@"
  ja: "@a@b＊「すやすや……。\n@c0@"
121:
  de: "@aLothar@bOh... Nera... Mein Herz ist entbrannt... in Liebe zu dir...\n@c0@"
  en: "@aCrispin@bUrgh... Nera... My heart...burns for you...\n@c0@"
  es: "@aCrispín@bUrg... Nera... Mi corazón... arde por ti...\n@c0@"
  fr: "@aGaëtan Poura@bArgh... Nera... Mon cœur... brûle d'amour... pour toi...\n@c0@"
  it: "@aCandido@bUrgh... Nera...\nArdo di passione per te...\n@c0@"
  ja: "@a@bアンディ「うーん　うーん。\n\tフローラ……。\n@c0@"
122:
  de: "@a@b*: Zzzz...\n@c0@"
  en: "@a@b*: Zzz... Zzz...\n@c0@"
  es: "@a@b*: Zzz... Zzz...\n@c0@"
  fr: "@a@b*ⓢ Zzz... Zzz...\n@c0@"
  it: "@a@b*: Zzz... Zzz...\n@c0@"
  ja: "@a@b＊「こっくり　こっくり……。\n@c0@"
123:
  de: "@a@b*: Jetzt mal Butter bei die Fische, alter Schlawiner! Was glaubst du, welche er nehmen wird?\n@c0@"
  en: "@a@b*: Stop sitting on the fence and give me an answer, you old waster! Who do you think he's going to pick?\n@c0@"
  es: "@a@b*: ¡Deja de irte por la tangente y dame una respuesta, desastre manirroto! ¿A quién crees que va a elegir?\n@c0@"
  fr: "@a@b*ⓢ Mouille-toi un peu et donne-moi ton avis, espèce de bon à rien. Laquelle il va choisir, d'après toiⓡ\n@c0@"
  it: "@a@b*: Ma che, il gatto t'ha mangiato la lingua?!\nVuoi deciderti a darmi una risposta?!\nSecondo te, quel tipo sposerà Bianca oppure Nera?\n@c0@"
  ja: "@a@b＊「あんた　ぼやぼやしてないで\n\t早く　答えなさいよ！\n\tねえ　どっちだと　思う？\n@c0@"
124:
