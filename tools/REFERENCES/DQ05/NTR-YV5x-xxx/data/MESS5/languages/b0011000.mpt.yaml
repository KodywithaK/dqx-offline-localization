0:
  de: "@aBianca@bGanz schön beeindruckend, nicht? Ich hatte ja keine Ahnung, dass es hinter der Schleuse eine solche Höhle gibt.\n@c0@"
  en: "@aBianca@bThis place is pretty impressive, en't it?\nI had no idea there was a cave like this up through the lock.\n@c0@"
  es: "@aBianca@bEste sitio está genial, ¿sabes?\r\nNo tenía ni papa de que tras la barrera hubiera una cueva así.\n@c0@"
  fr: "@aBianca@bCet endroit est vraiment impressionnant, pas vraiⓡ\nJe n'imaginais même pas qu'il pouvait exister un lieu pareil après l'écluse.\n@c0@"
  it: "@aBianca@bChe spettacolo...!\nNon avrei mai immaginato che oltre la Chiusa ci fosse un posto del genere!\n@c0@"
  ja: "@a@bビアンカ「なんだか　すごいところね！\n\t水門の先に　こんな洞くつが\n\tあったなんて……。\n@c0@"
1:
  de: "@aBianca@bAber ein bisschen aufgeregt bin ich schon.\n@c0@"
  en: "@aBianca@bI can't help feelin' a little bit nervous, though.\n@c0@"
  es: "@aBianca@bAunque estoy un poco nerviosa, tú.\n@c0@"
  fr: "@aBianca@bJe ne sais pas pourquoi, mais je suis un peu nerveuse.\n@c0@"
  it: "@aBianca@bNon so perché, ma mi sento un po' nervosa...\n@c0@"
  ja: "@a@bビアンカ「なんだか\n\tどきどき　しちゃうわ。\n@c0@"
2:
  de: "@aBianca@bEs erinnert mich an das eine Mal, als wir beide als kleine Kinder auf Geisterjagd gegangen sind.\n@c0@"
  en: "@aBianca@bReminds me of that time you and me went off ghost-huntin' when we was little kids.\n@c0@"
  es: "@aBianca@bMe recuerda a cuando de pequeños fuimos a cazar fantasmas.\n@c0@"
  fr: "@aBianca@bÇa me rappelle cette fois où on était allés à la chasse aux fantômes quand on était petits.\n@c0@"
  it: "@aBianca@bSto provando la stessa sensazione di tanti anni fa, quando tu e io andammo a caccia di fantasmi...\n@c0@"
  ja: "@a@bビアンカ「小さい頃　ふたりで\n\tお化け退治に　行ったのを\n\t思い出すわね。\n@c0@"
3:
  de: "@aBianca@bIst das hübsch!\n@c0@"
  en: "@aBianca@bIt's so pretty!\n@c0@"
  es: "@aBianca@b¡Qué ideal!\n@c0@"
  fr: "@aBianca@bQu'est-ce que c'est joliⓠ\n@c0@"
  it: "@aBianca@bChe meraviglia!\n@c0@"
  ja: "@a@bビアンカ「わー　きれい！\n@c0@"
4:
  de: "@aBianca@bEs ist schon eine ganze Weile her, dass ich etwas so Faszinierendes gesehen habe.\n@c0@"
  en: "@aBianca@bIt's bin a fair few years since I got to enjoy any scenery this amazin'.\n@c0@"
  es: "@aBianca@bHace mucho que no veo algo tan alucinante, ¿sabes?\n@c0@"
  fr: "@aBianca@bÇa faisait des années que je n'avais pas vu un endroit aussi beau.\n@c0@"
  it: "@aBianca@bErano anni che non mi trovavo davanti un panorama tanto bello...\n@c0@"
  ja: "@a@bビアンカ「こんなふうに\n\t景色に　見とれるなんて\n\t何年ぶりかしら……。\n@c0@"
5:
  de: "@aBianca@bFür so etwas war nicht mehr viel Zeit, nachdem Mutti gestorben war.\n@c0@"
  en: "@aBianca@bThere en't bin time for things like that since Mum died.\n@c0@"
  es: "@aBianca@bDesde que murió mamá no he tenido tiempo para estas cosas.\n@c0@"
  fr: "@aBianca@bJe n'ai pas eu trop de temps à moi depuis la mort de maman.\n@c0@"
  it: "@aBianca@bDal giorno della morte di mia madre, non mi ero più fermata ad ammirare il mondo che mi circonda.\n@c0@"
  ja: "@a@bビアンカ「母さんが　死んでからは\n\tそんな余裕　なかったしね。\n@c0@"
6:
  de: "@a@b*: Die Leute sagen, hier in der Höhle wär 'n ganz besonderer Ring versteckt.\n@c0@"
  en: "@a@b*: Folk say there's some kind of special ring 'idden 'ere in this cave.\n@c0@"
  es: "@a@b*: La gente dice que en esta cueva se esconde un anillo especial y tal.\n@c0@"
  fr: "@a@b*ⓢ Le gens disent qu'il y a un anneau spécial caché dans c'te grotte.\n@c0@"
  it: "@a@b*: Quarcuno dice che dentro a 'sta grotta ce sta n'anello speciale.\n@c0@"
  ja: "@a@b＊「この洞くつには　すごい指輪が\n\tかくされているらしいぜ。\n@c0@"
7:
  de: "@a@b*: Aber Ihr werdet ihn nicht finden. Wenn ich ihn schon nicht gefunden hab, dann hat so 'n Schicki-Typ mit 'nem Mädel im Schlepp erst recht keine Chance.\n@c0@"
  en: "@a@b*: You don't stand a chance of findin' it, though. I ain't 'ad no luck, so a fancy man with a bird in tow definitely ain't got what it takes!\n@c0@"
  es: "@a@b*: Pero tú no lo encontrarías ni en broma. ¡Si yo no lo logré, un cretino con una cualquiera ya se puede ir olvidando!\n@c0@"
  fr: "@a@b*ⓢ Vous avez aucune chance de le trouver. Moi, j'ai pas réussi, alors ça m'étonnerait qu'un p'tit gars et sa copine soient à la hauteurⓠ\n@c0@"
  it: "@a@b*: Io, però, nun l'ho trovato.\nFiguriamoci si ce riesce un bamboccione come te co' 'na regazzina a rimorchio!\n@c0@"
  ja: "@a@b＊「もっとも　このオレにさえ\n\t見つけられないのに　女連れの色男\n\tなどに　探せるとは思えないがな。\n@c0@"
8:
  de: "@aBianca@bWar das ein unangenehmer Typ!\n@c0@"
  en: "@aBianca@bWhat a horrible creature he was!\n@c0@"
  es: "@aBianca@b¡Qué asco de bicho!\n@c0@"
  fr: "@aBianca@bQuel horrible bonhommeⓠ\n@c0@"
  it: "@aBianca@bChe razza di scostumato!\n@c0@"
  ja: "@a@bビアンカ「失礼しちゃうわね！\n@c0@"
9:
  de: "@aBianca@bIch frage mich, was der hier draußen eigentlich macht?\n@c0@"
  en: "@aBianca@bI wonder what he's doing all the way out here.\n@c0@"
  es: "@aBianca@b¡Creo que se ha hecho pis en el agua!\n@c0@"
  fr: "@aBianca@bJe me demande ce qu'il fait ici.\n@c0@"
  it: "@aBianca@bGli faremo rimangiare le sue parole!\nTroveremo l'anello, %a000090!\n@c0@"
  ja: "@a@bビアンカ「さっきの男\n\t私のおしり　さわったのよっ。\n@c0@"
10:
  de: "@aBianca@bOh! Das ist alles so geheimnisvoll und seltsam. Ich habe gar nicht gewusst, dass es solche Höhlen gibt.\n@c0@"
  en: "@aBianca@bWow! It all feels so mystical and strange. I never knew there were caves like this about.\n@c0@"
  es: "@aBianca@b¡Vaya! Todo es como muy místico y extraño. No tenía ni idea de que hubiera cuevas así, ¿sabes?\n@c0@"
  fr: "@aBianca@bWaouhⓠ Tout semble si mystique et si étrange.\nJe n'aurais jamais pensé qu'il existait de telles grottes dans le coin.\n@c0@"
  it: "@aBianca@bL'atmosfera qui ha un che di magico...\nNon avrei mai immaginato che esistessero grotte come questa.\n@c0@"
  ja: "@a@bビアンカ「うわー！\n\tなんだか　とても　神秘的ねっ。\n\tこんな洞くつが　あったなんて……。\n@c0@"
11:
  de: "@aBianca@bAber wenn das so weitergeht, sind wir bald nassgespritzt wie die Pudel. Pass auf, %a000090, ja?\n@c0@"
  en: "@aBianca@bBut the spray from all that water could have us lookin' like drowned rats if we en't careful. Look out, eh, %a000090?\n@c0@"
  es: "@aBianca@bPero si no tenemos cuidado con toda esa agua, acabaremos ahogados como ratas, ¿me entiendes? Mucho ojo, ¿eh, %a000090?\n@c0@"
  fr: "@aBianca@bMais, avec tous ces embruns, on va être trempés jusqu'aux os si on ne fait pas attention. Pas vrai, %a000090ⓡ\n@c0@"
  it: "@aBianca@bDobbiamo fare attenzione all'acqua, %a000090.\nNon voglio annegare come un sorcio!\nE penso che nemmeno tu abbia questa intenzione...\n@c0@"
  ja: "@a@bビアンカ「でも　滝の水しぶきで\n\tビショビショに　なっちゃいそう。\n\t気をつけようね　%a000090。\n@c0@"
12:
  de: "@aBianca@bKomisch. Ich war sicher, wir würden den Ring des Wassers da drin finden.\n@c0@"
  en: "@aBianca@bThat's weird. I was sure we'd find the Circle of Water in there.\n@c0@"
  es: "@aBianca@b¡Qué cosa más rara! Estaba segura de que el Anillo de Agua estaría aquí.\n@c0@"
  fr: "@aBianca@bC'est bizarre. J'étais sûre qu'on trouverait l'Anneau de l'Eau ici.\n@c0@"
  it: "@aBianca@bQuesta sì che è bella!\nAnzi, no. Non lo è affatto.\nEro convinta che avremmo trovato l'Anello d'Acqua...\n@c0@"
  ja: "@a@bビアンカ「へんね……。\n\t水のリングじゃなかったの？\n@c0@"
13:
  de: "@aBianca@bBei dem Namen hätte ich gedacht, dass er an einem solchen Ort versteckt ist.\n@c0@"
  en: "@aBianca@bWith a name like that, I thought it stands to reason it'd be hidden in a place like this.\n@c0@"
  es: "@aBianca@bCon ese nombre, dime tú dónde iban a ponerlo si no.\n@c0@"
  fr: "@aBianca@bAvec un nom pareil, je pensais en toute logique qu'il serait caché dans un endroit de ce genre.\n@c0@"
  it: "@aBianca@bVisto il nome del gioiello, supponevo che fosse nascosto in un posto come questo, ma evidentemente mi sbagliavo.\n@c0@"
  ja: "@a@bビアンカ「水のリングって\n\tいうくらいだから　滝の水に\n\t守られているのかと思ったのに……。\n@c0@"
