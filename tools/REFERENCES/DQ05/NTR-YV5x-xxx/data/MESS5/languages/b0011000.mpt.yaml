  es: "@a@b*: ¿Qué? ¿N-no estarás considerando casarte con Stefania? Diosa mía, debes estar...\nBueno, digamos que yo que tú no lo haría.\n@c0@"
  fr: "@a@b*ⓢ Heinⓡ Vous... Vous ne pensez pas sérieusement à Pandoraⓠⓑ La Déesse me pardonne, mais vous devez être... Enfin, plutôt vous que moiⓠ\n@c0@"
  it: "@a@b*: A meno che...\nA meno che tu non stia pensando a Viola?!\nSanta dea! Contento tu...\n@c0@"
  ja: "@a@b＊「ルドマンさんが　どこで　結婚式を\n\tなさりたいのか　分かりませんが\n\t私どもも　協力いたしますわ。\n@c0@"
217:
  de: "@a@b*: Natürlich ist Griselda auch eine Wucht. Aber wenn ich die hinter der Theke platziere, würde mir die Kundschaft weglaufen!\n@c0@"
  en: "@a@b*: Of course, Debora's a stunner too. But if I were to put her behind the bar, the punters would be so stunned, they'd all go home!\n@c0@"
  es: "@a@b*: Claro que Stefania también es un bombón de los que quitan el hipo.\n㈡\n*: Pero si la pusiera a trabajar detrás de la barra y los clientes se quedaran sin hipo, a ver cómo sabríamos cuándo tienen que parar.\n@c0@"
  fr: "@a@b*ⓢ Bien sûr, Pandora aussi est un beau brin de fille. Mais si je la mettais au bar, les clients seraient tellement secoués qu'ils rentreraient chez euxⓠ\n@c0@"
  it: "@a@b*: Certo, anche Viola è una bella ragazza, ma ha un carattere un po' troppo forte per i miei gusti...\nÈ più forte di un latte d'orco triplo!\n@c0@"
  ja: "@a@b＊「え？　デ　デボラさん？\n\tまさか！　あんな人と結婚したら\n\tとんでもないことに　なりますよ！\n@c0@"
218:
  de: "@aGriselda@bFür wen hältst du dich?\nIst da vielleicht ein Schild an der Tür, auf dem ⓞHier ist jedes Gesindel willkommenⓟ steht?\n@c0@"
  en: "@aDebora@bWho do you think you are?\nIs there a sign on the door saying\nⓗscruffbags welcomeⓘ?\n@c0@"
  es: "@aStefania@b¿Ma quién te has creído que eres?\n¿Es que hay un cartel en la porta que dice: ⓕPalurdos benvenutiⓖ?\n@c0@"
  fr: "@aPandora@bNon mais, tu te prends pour quiⓡ\nTu as vu un panneau sur la porte marqué ⓥbienvenue aux clochardsⓦ ou quoiⓡ\n@c0@"
  it: "@aViola@bScusa, ma hai per caso letto sulla mia porta un cartello con su scritto ⓕAttendo pretendentiⓖ o roba del genere?!\n@c0@"
  ja: "@a@b＊「デボラさんも　美人だけど\n\tあれが店にいたら　お客は\n\tみんな　帰っちまうからなあ。\n@c0@"
219:
  de: "@aGriselda@bOh? Du hast gehört, dass ich Neras ältere Schwester bin, ja?\n@c0@"
  en: "@aDebora@bOh? You heard I was the older sister out of Nera and I, did you?\n@c0@"
  es: "@aStefania@b¿Come? ¿Que te has enterado que io sono la hermana mayor?\n@c0@"
  fr: "@aPandora@bOhⓡ Tu as entendu dire que j'étais\nla sœur aînée de Nera, c'est çaⓡ\n@c0@"
  it: "@aViola@bHo capito. Hai saputo che sono meno giovane di Nera, così hai pensato che io sia alla ricerca spasmodica di un marito...\n@c0@"
  ja: "@a@bデボラ「なによ　あんた？\n\t勝手に　私の部屋に\n\t入って来たりして。\n@c0@"
220:
  de: "@aGriselda@bNa und? Wenn du glaubst, dass ich deswegen als Erste heiraten will, hast du dich aber getäuscht.\n@c0@"
  en: "@aDebora@bSo? What of it? If you think that means I'm looking to get married first, you can think again.\n@c0@"
  es: "@aStefania@b¿Y qué? ¿Crees que per eso me querré casar la primera? ¡Allora! Estás muy ma que muy equivocado.\n@c0@"
  fr: "@aPandora@bEt alorsⓡ Quel rapportⓡ Si tu crois que ça veut dire que j'ai envie de me marier en premier,\ntu te mets le doigt dans l'œil.\n@c0@"
  it: "@aViola@bSe è questo ciò che credi... ti sbagli di grosso!\n@c0@"
  ja: "@a@bデボラ「え？　私のほうが　フローラより\n\tお姉さんでは　ですって？\n@c0@"
221:
  de: "@aGriselda@bWas ist denn jetzt schon wieder? Willst du was von mir, oder wie?\n@c0@"
  en: "@aDebora@bWhat is it now? Do you want something, or not?\n@c0@"
  es: "@aStefania@bAllora, ¿qué pasa? Quieres algo, ¿sí o no?\n@c0@"
  fr: "@aPandora@bQuoi encoreⓡ Tu veux quelque chose, oui ou nonⓡ\n@c0@"
  it: "@aViola@bChe c'è adesso?!\nHai per caso qualcosa da dirmi?!\n@c0@"
  ja: "@a@bデボラ「だから　なに？\n\t結婚には　興味ないから\n\tほっといてくれる？\n@c0@"
222:
  de: "@aGriselda@bHmpf. Ich hab gehört, was hier los ist, weißt du. Aber ich will nichts damit zu tun haben. \n@c0@"
  en: "@aDebora@bHmph. I've heard what's been going on, you know, but I don't want anything to do with it.\n@c0@"
  es: "@aStefania@bMmm. Sé lo que os traéis entre manos. Ma veramente me da lo mismo.\n@c0@"
  fr: "@aPandora@bMmpf. J'ai entendu parler de ce qui se passe, évidemment, mais je ne veux rien avoir à faire\r\navec ça.\n@c0@"
  it: "@aViola@bGuarda, ho saputo cosa sta succedendo e non voglio averci niente a che fare.\n@c0@"
  ja: "@a@bデボラ「なあに？　なんか用？\n@c0@"
223:
  de: "@aGriselda@bKomm mir bloß nicht auf dumme Gedanken, ja? Solche Bürschchen wie dich verspeise ich zum Frühstück. Hm, lecker siehst du schon aus...\n㈡\nAber du bist ja höchstens ein Häppchen!\n@c0@"
  en: "@aDebora@bDon't get any ideas, okay? I step on men like you all the time. But you do look pretty strong... What am I saying? You'd be no match for me.\n@c0@"
  es: "@aStefania@bQue no se te ocurran cosas raras, ¿eh? Con un piccolo ragazzo come te, io no tengo ni para empezar. Bueno, no estás mal del tutto...\n㈡\nMa, ya te digo que no me vales ni de antipasto.\n@c0@"
  fr: "@aPandora@bNe te fais pas d'idées, comprisⓡ Les types comme toi, je les mange en tartine. Remarque, tu es plutôt appétissant...\n㈡\nMais quoi qu'il en soit, je ne ferais de toi\nqu'une bouchée.\n@c0@"
  it: "@aViola@bNon farti venire strane idee, hai capito?! I tipi come te li mangio a colazione. Sarai anche un bel bocconcino, ma non sei certo alla mia altezza...\n@c0@"
  ja: "@a@bデボラ「ふふん。　話は聞いてるわよ。\n\tでも　どっちにしても　私には\n\t関係のない話だわ……。\n@c0@"
224:
  de: "@a@b*: Warte!\n@c0@"
  en: "@a@b*: Wait!\n@c0@"
  es: "@a@b*: ¡Aspetta un attimo!\n@c0@"
  fr: "@a@b*ⓢ Attendsⓠ\n@c0@"
  it: "@a@b*: Aspetta!\n@c0@"
  ja: "@a@bデボラ「あんたって　よく見ると\n\t小魚みたいな　顔してるのね。\n\t小魚は身体にいいし　嫌いじゃないわよ。\n@c0@"
225:
  de: "@aGriselda@bDu bist doch %a000090, oder?\nJa, ein ziemlich rätselhaftes Bürschchen. Keiner scheint wirklich etwas über dich zu wissen.\n@c0@"
  en: "@aDebora@bYou're %a000090, aren't you? Yes, quite the mystery boy. Nobody seems to know anything about you at all.\n@c0@"
  es: "@aStefania@bMa caro %a000090, el ragazzo misterioso. Nadie sabe niente di te.\n@c0@"
  fr: "@aPandora@bTu es %a000090, c'est çaⓡ L'homme mystère. Apparemment, personne ne sait rien sur toi.\n@c0@"
  it: "@aViola@bTu sei %a000090, il pappamolle che si dà arie da duro, dico bene?\n@c0@"
  ja: "@a@b＊「ちょっと　待ちなさいよ！\n@c0@"
226:
  de: "@aGriselda@bTja... Hätte nie gedacht, dass es jemand schaffen würde, den Ring des Feuers und den Ring des Wassers zu beschaffen. Eine reife Leistung!\n@c0@"
  en: "@aDebora@bWell, well... I never imagined anyone would actually manage to retrieve the Circle of Fire and the Circle of Water. Very impressive...\n@c0@"
  es: "@aStefania@bVa bene... Nunca pensé que alguien pudiera lograr el Anillo de Agua y el de Fuego. Veramente impresionante.\n@c0@"
  fr: "@aPandora@bEh bien... Je n'aurais jamais cru que quiconque réussirait à récupérer l'Anneau du Feu et l'Anneau de l'Eau. Très impressionnant...\n@c0@"
  it: "@aViola@bBeh, forse sei meno pappamolle di quanto pensassi...\nDel resto, sei riuscito a recuperare l'Anello di Fuoco e l'Anello d'Acqua.\n㈡\nSono impressionata, sai?\nE io non sono certo una tipa che si lascia impressionare facilmente...\n@c0@"
  ja: "@a@bデボラ「あんた　%a000090だっけ？\n\tどこの　馬の骨かと思ったけど\n\tなかなか　やるじゃない。\n@c0@"
227:
  de: "@aGriselda@bDann muss ich dir wohl gestatten, mich zu heiraten.\n@c0@"
  en: "@aDebora@bI suppose that means I'll have to let you marry me.\n@c0@"
  es: "@aStefania@bSupongo que como me has impresionado, me dignaré a casarme con te.\n@c0@"
  fr: "@aPandora@bJe suppose que ça signifie que je vais devoir\r\nte laisser m'épouser.\n@c0@"
  it: "@aViola@bMolto bene.\nSe le cose stanno così...\n㈡\nTi concederò di sposarmi.\n@c0@"
  ja: "@a@bデボラ「まさか　炎のリングと水のリングを\n\t見つけてくる男が　本当に\n\tいるなんてね……。\n@c0@"
228:
  de: "@aRodrigo Onassetti@bW-Was erzählst du denn da, Griselda? Ma no, que assurdità! Du wärst ja wohl kaum eine geeignete Braut für %a000090.\n@c0@"
  en: "@aRodrigo Briscoletti@bWh-What on earth is all this bologna, Debora?\nYou're hardly a suitable match for %a000090.\n@c0@"
  es: "@aDon Rimaldi@b¿Ma qué dices, Stefania? ¿Tú y %a000090? Non è possibile.\n@c0@"
  fr: "@aRodrigo Oscuroni@bM-Mais qu'est-ce que c'est que ces bêtises, Pandoraⓡ Tu n'es vraiment pas un parti\nconvenable pour %a000090.\n@c0@"
  it: "@aRick Fosconi@bMa cosa stai addicendo, Viola?!\nYou non sei donna adatta per %a000090.\n@c0@"
  ja: "@a@bデボラ「しかたないから　私が\n\tあんたと　結婚してあげるわ。\n\tいいわね？\n@c0@"
229:
  de: "@aGriselda@bAch, armer Papa. Du hast echt keine Ahnung, wie junge Männer heutzutage drauf sind, oder?\n@c0@"
  en: "@aDebora@bOh, poor Papa. You're really not in touch with the way young men think any more, are you?\n@c0@"
  es: "@aStefania@bPoverino papino. Ya no entiendes come piensan hoy en día los hombres, ¿vero?\n@c0@"
  fr: "@aPandora@bMon pauvre papa. Tu n'es vraiment plus dans le\ncoup, heinⓡ Tu ne sais pas comment fonctionnent\nles jeunes gens d'aujourd'hui.\n@c0@"
  it: "@aViola@bPovero paparino...\nSei rimasto sorpreso?\n@c0@"
  ja: "@a@bルドマン「な　なにを　言っておるのだ！\n\t%a000090が　お前のような娘と\n\t結婚するわけが　なかろう。\n@c0@"
230:
  de: "@aGriselda@bWieso fragen wir %a000090 nicht nach seiner Meinung?\n@c0@"
  en: "@aDebora@bWhy don't we see what %a000090 has to say about it?\n@c0@"
  es: "@aStefania@bVediamo qué tiene que decir %a000090 al respecto...\n@c0@"
  fr: "@aPandora@bPeut-être qu'on devrait laisser %a000090 donner son avis, nonⓡ\n@c0@"
  it: "@aViola@bPerché non chiedi direttamente a %a000090 cosa vuole fare?\n@c0@"
  ja: "@a@bデボラ「あら　パパったら\n\t若い男の気もちが　分からないのね。\n@c0@"
231:
  de: "@aGriselda@bAlso, %a000090. Beeil dich und wähle mich. Ich hab keine Lust, einen schusseligen Langweiler zu heiraten.\n@c0@"
  en: "@aDebora@bWell, %a000090? Hurry up and pick me. I've no intention of marrying a dim-witted layabout.\n@c0@"
  es: "@aStefania@bBene, %a000090. Presto, elígeme ya. Non pienso casarme con un uomo que me haga aspettare.\n@c0@"
  fr: "@aPandora@bBon, %a000090. Dépêche-toi de me choisir. Je n'ai pas l'intention d'épouser un lambin bouché à l'émeri.\n@c0@"
  it: "@aViola@bE tu, %a000090, sbrigati a scegliermi, prima che io cambi idea... Non ho nessuna intenzione di sposare un pappamolle indeciso!\n@c0@"
  ja: "@a@bデボラ「まあ　いいわ。\n\tそんなに言うなら　%a000090に\n\tはっきり　決めてもらうから。\n@c0@"
232:
  de: "@aRodrigo Onassetti@bÄhem! Nun, ich, ich muss mich für dieses, äh... plötzliche Fiasko entschuldigen, %a000090.\n@c0@"
  en: "@aRodrigo Briscoletti@bAhem! Well! I, I must apologise for this, er...sudden little fiasco, %a000090.\n@c0@"
  es: "@aDon Rimaldi@b¡Ejem! Bene... Scussi per este piccolo fiasco, %a000090\n@c0@"
  fr: "@aRodrigo Oscuroni@bHumⓠ Bonⓠ Euh... Toutes mes excuses pour ce, euh... mini fiasco inattendu, %a000090.\n@c0@"
  it: "@aRick Fosconi@bEhm...\nSono very sorry per questo imprevisto, %a000090.\n@c0@"
  ja: "@a@bデボラ「さあ　早く　私を選びなさいよ。\n\tグズな男とは　結婚しないからね。\n@c0@"
233:
  de: "@aRodrigo Onassetti@bAber nimm dir ruhig etwas Zeit, sammle dich, und lass dann dein Herz entscheiden. Wirst du meine Nera heiraten oder die junge Bianca?\n@c0@"
  en: "@aRodrigo Briscoletti@bBut take your time, compose yourself, and then let your heart decide. Will you marry my Nera, or young Bianca?\n@c0@"
  es: "@aDon Rimaldi@bTómate tu tempo, recupérate de esta sorpresa y que il tuo cuore decida. ¿Quieres casarte con Nera o con la joven Bianca?\n@c0@"
  fr: "@aRodrigo Oscuroni@bMais prends ton temps, réfléchis bien et laisse\nton cœur décider. Veux-tu épouser ma Nera ou\nla petite Biancaⓡ\n@c0@"
  it: "@aRick Fosconi@bPlease, apprendi tutto time che you vuoi per decidere, e poi fammi assapere se vuoi sposare mia bella Nera oppure tua amica Bianca.\n㈡\nParla a tuo cuore, my boy.\nLui ti dirà cosa fare.\n@c0@"
  ja: "@a@bルドマン「……ゴ　ゴホン！\n 　すまなかったね　%a000090。\n@c0@"
234:
  de: "@aGriselda@bWorauf wartest du noch?\nNa los, mach hin und wähle mich!\n@c0@"
  en: "@aDebora@bWhat are you waiting for?\nJust get on with it and pick me!\n@c0@"
  es: "@aStefania@b¿A que estás esperando?\nAllora, presto, elígeme de una vez.\n@c0@"
  fr: "@aPandora@bQu'est-ce que tu attendsⓡ Allez, décide-toi\net choisis-moiⓠ\n@c0@"
  it: "@aViola@bSi può sapere cosa stai aspettando?!\nDatti una mossa e scegli me!\nAllora? Vuoi essere mio marito?\n@c0@"
  ja: "@a@bルドマン「では　気をとりなおして\n\tフローラか　ビアンカさんか\n\t好きなほうに　プロポーズしてくれ。\n@c0@"
235:
  de: "@aGriselda@bEs ist doch offensichtlich, dass du von Anfang an mich heiraten wolltest. Komm, du kannst es ruhig zugeben.\n@c0@"
  en: "@aDebora@bIt's so obvious it's me you've wanted to marry from the beginning. Go on, admit it.\n@c0@"
  es: "@aStefania@bEstá clarísimo que querías casarte con me desde el principio. Venga, admítelo.\n@c0@"
  fr: "@aPandora@bDe toute évidence, c'est moi que tu as envie d'épouser depuis le début. Admets-le.\n@c0@"
  it: "@aViola@bAvanti, ammettilo: hai sognato di sposarmi fin dal primo momento che mi hai vista.\nTe l'ho letto in quei tuoi occhioni belli! Dico bene?\n@c0@"
  ja: "@a@bデボラ「なにしてるの？\n\t早く　私を　選びなさいよ。\n@c0@"
236:
  de: "@aGriselda@bIch weiß, dass du einige... Mängel hast. Aber keine Bange, dafür bin ich ja da. Ich werde dich auf dem rechten Weg halten!\n@c0@"
  en: "@aDebora@bI know you're a bit...lacking, but don't worry, I'll compensate for that. I'll keep you on the straight and narrow.\n@c0@"
  es: "@aStefania@bYa sé que eres un poco... blandengue per me, ma non ti preoccupare. Yo te enseñaré. Te voy a llevar derecho come una vela.\n@c0@"
  fr: "@aPandora@bJe sais que tu n'es pas tout à fait... à la hauteur, mais ne t'inquiète pas, je compenserai.\r\nJe te maintiendrai sur la bonne voie.\n@c0@"
  it: "@aViola@bSo che sei un pappamolle, ma non temere: ci penserò io a sostenerti e a difenderti tutte le volte che ne avrai bisogno! Con me puoi stare tranquillo!\n@c0@"
  ja: "@a@bデボラ「なんだかんだ言って　最初から\n\t私狙い　だったんでしょ？\n@c0@"
237:
  de: "@aRodrigo Onassetti@bB-Bist du dir auch sicher, dass du weißt, worauf du dich da einläⓚⓛ ich meine, wirklich sicher?\n@c0@"
  en: "@aRodrigo Briscoletti@bA-Are you sure you know what you're letting yourselfⓚⓛ I mean, are you certain?\n@c0@"
  es: "@aDon Rimaldi@b¿Estás sicuro de que quieres meterte...? Quiero decir, ¿estás sicuro?\n@c0@"
  fr: "@aRodrigo Oscuroni@bTu... Tu es sûr de savoir ce que tu es en train de... Je veux dire, tu es sûr de ton choixⓡ\n@c0@"
  it: "@aRick Fosconi@bMa sei assicuro che...?\nCioè, sei avveramente certo...?\n@c0@"
  ja: "@a@bデボラ「ふつつかっぽい　%a000090だけど\n\tめんどうみてあげるわ。\n\tちゃんと　ついてくるのよ。\n@c0@"
238:
  de: "@aRodrigo Onassetti@bB-Bei der Göttin, du bist wahrhaft ein tapferer Bursche, %a000090.\n@c0@"
  en: "@aRodrigo Briscoletti@bB-By the Goddess, you are a lion-hearted man, %a000090.\n@c0@"
  es: "@aDon Rimaldi@bSanta Diosa, tienes un cuore de león, %a000090.\n@c0@"
  fr: "@aRodrigo Oscuroni@bPar la Déesse, tu as le courage d'un lion, %a000090.\n@c0@"
  it: "@aRick Fosconi@bSanta dea!\nYou sei man very coraggioso, %a000090!\n@c0@"
  ja: "@a@bルドマン「な　なんと　デボラを選ぶとは\n\t本気かね？　%a000090よ。\n@c0@"
239:
  de: "@aRodrigo Onassetti@bIch kann dir gar nicht sagen, wie viel Kummer uns Griselda bereitet hat. Ich bin dir wirklich sehr dankbar.\n@c0@"
  en: "@aRodrigo Briscoletti@bI can't tell you what a worry Debora has been to us. I am most grateful to you.\n@c0@"
  es: "@aDon Rimaldi@bNon posso explicar los quebraderos de testa que Stefania nos ha dado. Te estoy veramente agradecido.\n@c0@"
  fr: "@aRodrigo Oscuroni@bTu n'imagines pas tous les soucis que nous a causés Pandora. Je te suis infiniment reconnaissant.\n@c0@"
  it: "@aRick Fosconi@bTi sono davvero grato, boy.\nNon immagini nemmeno quanto ci ha fatti appreoccupare quella scavezzacollo di Viola.\n@c0@"
  ja: "@a@bルドマン「ぬぬ～～　なんという\n\t勇気のある男よ！\n@c0@"
240:
  de: "@aRodrigo Onassetti@bNa, dann wollen wir mal pronto mit den Vorbereitungen beginnen, ehe du es dir anders überlegst!\n@c0@"
  en: "@aRodrigo Briscoletti@bWell, let's get the preparations underway pronto before you have a change of heart!\n@c0@"
  es: "@aDon Rimaldi@bBueno, pongámonos manos a la obra antes de que cambies la tua opinión.\n@c0@"
  fr: "@aRodrigo Oscuroni@bBon, dépêchons-nous de lancer les préparatifs. Pronto, avant que tu ne changes d'avisⓠ\n@c0@"
  it: "@aRick Fosconi@bPerfect!\nAllora accominciamo preparativi prima che you cambi idea!\n㈡\nNo, volevo dire che non vedo time che si accelebra questo matrimonio...\n@c0@"
  ja: "@a@bルドマン「いや　デボラには\n\t本当～～～に　困っておったのだ。\n\t心から　感謝するぞ！\n@c0@"
241:
  de: "@aRodrigo Onassetti@bDie Braut kann sich in meiner Villa fertigmachen.\n@c0@"
  en: "@aRodrigo Briscoletti@bThe bride will get ready in my villa.\n@c0@"
  es: "@aDon Rimaldi@bLa sposina se preparará en la mia villa.\n@c0@"
  fr: "@aRodrigo Oscuroni@bLa mariée va se préparer dans ma villa.\n@c0@"
  it: "@aRick Fosconi@bLa sposa si appreparerà per cerimonia nella my villa.\n@c0@"
  ja: "@a@bルドマン「では　さっそく　式の準備だ！\n@c0@"
242:
  de: "@aBianca@bWarte! Ich komme mit und helfe!\n@c0@"
  en: "@aBianca@bWait! I'll come along an' help.\n@c0@"
  es: "@aBianca@b¡Espera! Echaré una mano.\n@c0@"
