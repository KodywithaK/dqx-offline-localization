  it: "@aRick Fosconi@bYou devi chiedere a una di due fanciulle di sposarti.\nChi vuoi come mugliera?\nMia figlia Nera o tua vecchia amica Bianca?\n@c0@"
  ja: "@a@bルドマン「フローラと　ビアンカさんの\n\tどちらか　本当に好きな方に\n\tプロポーズするのだ。\n@c0@"
146:
  de: "@a@bWenn du gehst, ohne einer von beiden einen Antrag zu machen, würdest du alle enttäuschen!\n@c0@"
