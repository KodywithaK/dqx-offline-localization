0:
  de: "@aBianca@bWer im Namen der Göttin denkt sich denn eine Stadt aus, die derart verzwickt ist? Es muss schrecklich sein, hier zu wohnen.\n@c0@"
  en: "@aBianca@bWho in their right mind would plan a town out to\r\nbe this complicated? It must be an impossible place\r\nto live.\n@c0@"
  es: "@aBianca@b¿A qué loco se le ocurriría diseñar una ciudad tan enrevesada? Me vengo a vivir aquí y me da algo, ¿sabes?\n@c0@"
  fr: "@aBianca@bQuel est le malade qui a bien pu imaginer une ville aussi tordueⓡ Ça doit être un calvaire de vivre ici.\n@c0@"
  it: "@aBianca@bMa quale folle architetto avrà mai progettato una città così complicata?!\nVivere qui dev'essere un incubo!\n@c0@"
  ja: "@a@bビアンカ「だれが　町のかたちを\n\tこんなふうにしたのかしら。\n\tここの町で生活するのは　大変よね。\n@c0@"
1:
  de: "@aBianca@bWenn man hier wohnt, kann man es sich nicht leisten, im Alter ein wenig tatterig zu werden...\n@c0@"
  en: "@aBianca@bYou couldn't afford to get a bit doddery on\r\nyour feet in your old age if you lived here,\r\nthat's for sure.\n@c0@"
  es: "@aBianca@bLos ancianos del lugar deben de tener unas piernas tremendas, ¿sabes?\n@c0@"
  fr: "@aBianca@bCe n'est pas un endroit où passer ses vieux jours. La moindre faiblesse dans les jambes ne pardonne pasⓠ\n@c0@"
  it: "@aBianca@bSpostarsi in questo villaggio è tutt'altro che agevole...\nBeh, almeno ci si tiene in forma!\n@c0@"
  ja: "@a@bビアンカ「こんな町で暮らしてたら\n\t年を取っても　足腰の　弱るヒマが\n\tないでしょうね。\n@c0@"
2:
  de: "@aNera@bEs ist wunderbar, sorglos herumspazieren zu können, selbst an einem Ort, der so kompliziert ist wie dieser hier.\n@c0@"
  en: "@aNera@bIt's so nice to be able to walk around freely, even in a place as tricky to navigate as this.\n@c0@"
  es: "@aNera@bVeramente, estoy disfrutando del lugar, a pesar de lo intrincado del camino.\n@c0@"
  fr: "@aNera@bC'est toujours agréable de se promener sans but, même dans une ville aussi compliquée.\n@c0@"
  it: "@aNera@bMi piace camminare in questo posto, anche se è terribilmente facile perdersi...\n@c0@"
  ja: "@a@bフローラ「自由に歩きまわれるって幸せね。\n\tこの町の　歩きにくさも\n\t気にならないほどですわ。\n@c0@"
3:
  de: "@aNera@bWer auch immer diese Stadt erbaut hat, muss ganz schön viel Zeit gehabt haben!\n@c0@"
  en: "@aNera@bThe person who designed the town layout here must have had a whale of a time!\n@c0@"
  es: "@aNera@b¡La persona que diseñó la distribución de la città se lució enormemente!\n@c0@"
  fr: "@aNera@bLa personne qui a conçu les plans de cette ville a dû bien s'amuserⓠ\n@c0@"
  it: "@aNera@bMi piacerebbe proprio dire qualche parolina alla persona che ha progettato questa città con tanta razionalità...\n@c0@"
  ja: "@a@bフローラ「町をこんなふうに\n\tつくった人って　きっと　遊び心が\n\tいっぱい　だったんでしょうね。\n@c0@"
4:
  de: "@a%0%a001240@bDieser Ort ist einfach fantastisch! Ist das eine Straße? Oder eine Wand? Keine Ahnung ⓚⓛ das reinste Labyrinth!\n@c0@"
  en: "@a%0%a001240@bThis place is cool! Is it a path? Is it a wall?\nWho can tell? It's like a maze!\n@c0@"
  es: "@a%0%a001240@b¡Este lugar es genial! ¿Es un camino? ¿O es un muro?\nNo hay forma de saberlo. ¡Menudo laberinto!\n@c0@"
  fr: "@a%0%a001240@bCette ville est génialeⓠ C'est un passageⓡ\nC'est un cul-de-sacⓡ On ne sait pas.\nC'est comme un labyrintheⓠ\n@c0@"
  it: "@a%0%a001240@bQuesto posto è troppo forte!\nSembra di essere in un labirinto!\n@c0@"
  ja: "@a@b%a001240「おっもしろーい！\n\tねえねえ　あれ　道なの？　カベ？\n\t迷路みたいになってるよ。\n@c0@"
5:
  de: "@a%0%a001240@bErst rechts, dann die Treppen hoch, dann... Ähm... Wo geht's denn dann runter?\n@c0@"
  en: "@a%0%a001240@bFirst turn, then go up the stairs, then... Um... Is this where you're supposed to go down?\n@c0@"
  es: "@a%0%a001240@bDobla en la primera calle, sube las escaleras y luego... Esto... Después había que bajar, ¿no?\n@c0@"
  fr: "@a%0%a001240@bD'abord, on tourne, puis on monte les escaliers. Après... euh... C'est là qu'on redescend ou c'est aprèsⓡ\n@c0@"
  it: "@a%0%a001240@bPrima a sinistra, poi a destra...\nAnzi, no: prima a destra e poi in alto.\nOppure era in basso?\n@c0@"
  ja: "@a@b%a001240「まず曲がって　それから\n\t階段をあがって……あれ？\n\tこっちにおりるのが　いいかな？\n@c0@"
6:
  de: "@a%0%a001240@bHa ha! Ich versuche nur, den kürzesten Weg für einen Stadtrundgang zu finden.\n@c0@"
  en: "@a%0%a001240@bHa ha! I'm just trying to figure out the shortest way to do a circuit around town.\n@c0@"
  es: "@a%0%a001240@b¡Ja, ja! Estoy pensando en el camino más corto para rodear la ciudad.\n@c0@"
  fr: "@a%0%a001240@bHa ha haⓠ J'essaie juste de trouver le trajet le plus court pour faire le tour de la ville.\n@c0@"
  it: "@a%0%a001240@bPapà, te lo ricordi dov'è il bagno?!\n@c0@"
  ja: "@a@b%a001240「エヘヘ…\n\t今　この町を一周する　最短ルートを\n\t考えてるところなんだ。\n@c0@"
7:
  de: "@a%0%a001250@bDieser Ort hat etwas Magisches an sich...\n@c0@"
  en: "@a%0%a001250@bThis place has a sort of magical air to it, I think.\n@c0@"
  es: "@a%0%a001250@bEste lugar tiene como un aire mágico.\n@c0@"
  fr: "@a%0%a001250@bJe trouve que cette ville a quelque chose de magique.\n@c0@"
  it: "@a%0%a001250@bCerto che questo villaggio è davvero unico nel suo genere...\n@c0@"
  ja: "@a@b%a001250「この町…\n\t魔法のにおいがするね。\n@c0@"
8:
  de: "@a%0%a001250@bKannst du dich ab und zu mal umsehen und gucken, ob ich noch da bin, Papa? Ich hab Angst, dass ich verloren gehe...\n@c0@"
  en: "@a%0%a001250@bCan you look back once in a while and make sure I'm still with you, Dad? I'm worried I might get lost.\n@c0@"
  es: "@a%0%a001250@bPapi, llévame de la mano. Tengo miedo de perderme.\n@c0@"
  fr: "@a%0%a001250@bTu peux vérifier de temps en temps si je suis encore là, papaⓡ J'ai un peu peur de me perdre.\n@c0@"
  it: "@a%0%a001250@bPapà, posso chiederti un piacere?\nOgni tanto, controlla che non mi sia persa!\n@c0@"
  ja: "@a@b%a001250「お父さん　ときどき\n\tわたしが　ちゃんとついて来てるか\n\t見てね。　迷子になっちゃいそう……。\n@c0@"
9:
  de: "@aSancho@bDiese Ort, er ist einfach loco! Erst du siehst eine Wand, dann es ist eine Weg. Und jetzt ist da eine Weg, aber es ist nur eine Sackgasse!\n@c0@"
  en: "@aSancho@bThees place, ees loco! First you esee a wall, but then ees a path. Now you esee a path, but ees a dead end!\n@c0@"
  es: "@aSancho@b¡Ándale, qué ciudad tan retecomplicada! Lo que parece un muro acaba siendo el camino.\n㈡\n¡Y cuando crees que encuentras el camino terminas en un callejón sin salida!\n@c0@"
  fr: "@aSancho@bC-Cet endroit est locoⓠ D'abord, tu vois oun mur et c'est oun p-passage. Ensuite, tu vois oun p-passage et c'est oun cul-de-sacⓠ\n@c0@"
  it: "@aSancho@b¡Esto villaggio es totalmentes folle! ¡Es un dedalo de vias, muras, escalas y vicolos ciecos!\n¿Como se fa a capir da que parte se deve andare?\n@c0@"
  ja: "@a@bサンチョ「カベかと思ったら　道で\n\t道かと思えば　いきどまりですよ！\n\tまったく　どうなってるんです！？\n@c0@"
10:
  de: "@aSancho@bDas ist keine Stadt, in der es rápido geht, eh? Du musst die Dinge langsam angehen lassen... Mañana, mañana.\n@c0@"
  en: "@aSancho@bEes no the kind of town you can run around rápido. You must take eet eslowly, sí? Mañana, mañana.\n@c0@"
  es: "@aSancho@bVisitar esta ciudad nomás es como montar un rompecabezas.\nPieza por pieza. ¡Y ya lo acabarás algún día!\n@c0@"
  fr: "@aSancho@bC-Ce n'est pas le genre de ville que tu p-peux traverser en courant. Il f-faut prendre son temps, noⓡ Mañana, mañana.\n@c0@"
  it: "@aSancho@bChico, procediamo con calmas.\nEs muy difícil trovare la strada giusta...\n@c0@"
  ja: "@a@bサンチョ「こういう町では　あせらず\n\t気長にいくしか　ないんでしょうねえ。\n@c0@"
11:
  de: "@aOtto@bKeine Sorge, Eure Majestät. Falls wir uns wirklich verlaufen sollten, können wir immer noch ein Loch in die Wand schlagen...\n@c0@"
  en: "@aTuppence@bThere's no need to worry. If we get really lost,\r\nwe can just knock a hole in the wall and tunnel\r\nour way out.\n@c0@"
  es: "@aAlazar@bNo hay de qué preocuparse. Si no encontramos la salida, siempre podemos derribar los muros para abrirnos paso.\n@c0@"
  fr: "@aInnocent@bNe vous inquiétez pas. Si nous nous perdons, nous pouvons toujours creuser un trou dans le mur pour sortir.\n@c0@"
  it: "@aSimon@bMaestà, non tema!\nQuand'anche dovessimo perderci, ci basterà abbattere qualche muro per ritrovare la strada!\n@c0@"
  ja: "@a@bピピン「大丈夫です。\n\t迷った時は　カベを掘って\n\t穴を開ければ　外に出られます。\n@c0@"
12:
  de: "@aBianca@bIst das nicht der Ort, wo du von diesem alten Mann einen neuen Zauber gelernt hast, %a000090?\n@c0@"
  en: "@aBianca@bEn't this the place you learnt a new spell off that old man, %a000090?\n@c0@"
  es: "@aBianca@b¿No fue aquí donde el viejo ese te enseñó un conjuro, %a000090?\n@c0@"
  fr: "@aBianca@bCe n'est pas là que ce vieil homme t'avait appris un nouveau sort, %a000090ⓡ\n@c0@"
  it: "@aBianca@b%0%a000090, non è qui che un signore anziano ti insegnò un nuovo incantesimo?\n@c0@"
  ja: "@a@bビアンカ「そういえば　%a000090は\n\tこの町のおじいさんに　新しい呪文を\n\tもらったんだったわよね。\n@c0@"
13:
  de: "@aNera@bMama und Papa sagen, sie hätten mich mal hierher mitgenommen, als ich noch klein war, aber davon weiß ich nichts mehr.\n@c0@"
  en: "@aNera@bMama and Papa say they brought me here when I was little, but I don't remember a thing.\n@c0@"
  es: "@aNera@bLa mia mamma e il mio papino dicen que me trajeron aquí cuando era piccola, pero no lo recuerdo.\n@c0@"
  fr: "@aNera@bMamma et papa disent qu'ils m'ont emmenée ici quand j'étais petite, mais je ne me souviens de rien.\n@c0@"
  it: "@aNera@bMolti anni fa venni qui con i miei genitori per una breve vacanza. Ero troppo piccola, però, e non ricordo nulla del posto...\n@c0@"
  ja: "@a@bフローラ「幼いころ　両親が私をつれて\n\tルラフェンへ　旅行したそうですが\n\t私は　まるで覚えてませんの。\n@c0@"
14:
  de: "@a%0%a001240@bIch glaube nicht, dass wir hier mit Sancho durchgekommen sind.\n@c0@"
  en: "@a%0%a001240@bI don't think we came here when we were travelling about with Sancho.\n@c0@"
  es: "@a%0%a001240@bCreo que es la primera vez que Sancho viene por aquí con nosotros.\n@c0@"
  fr: "@a%0%a001240@bJe ne crois pas qu'on soit passés ici quand on voyageait avec Sancho.\n@c0@"
  it: "@a%0%a001240@bNon credo che passammo di qui quando ti cercavamo insieme allo zio Sancho...\n@c0@"
  ja: "@a@b%a001240「サンチョと旅したとき\n\tこの町には　来なかったなあ……。\n@c0@"
15:
  de: "@aBianca@bFrüher kam den ganzen Tag lang Rauch aus dem Schornstein. Das waren noch Zeiten, was?\n@c0@"
  en: "@aBianca@bThere used to be smoke billowin' about the place all day long in the old days. It was quite a sight, eh?\n@c0@"
  es: "@aBianca@bAntiguamente, la ciudad permanecía día y noche envuelta en una extraña humareda. Era digno de verse, ¿sabes?\n@c0@"
  fr: "@aBianca@bIl y avait tout le temps de la fumée qui tourbillonnait dans le temps. C'était impressionnant, heinⓡ\n@c0@"
  it: "@aBianca@bUn tempo dal laboratorio del Professore si alzava sempre una colonna di fumo, ricordi?\n@c0@"
  ja: "@a@bビアンカ「前は　一日じゅう\n\tケムリが出てて　すごかったわよね。\n@c0@"
16:
  de: "@aNera@bIch hoffe, es geht Professor Emsich gut...\n@c0@"
  en: "@aNera@bIt's a worry about Professor Toilen Trubble.\r\nI do hope he's alright.\n@c0@"
  es: "@aNera@bEstoy preoccupata por el profesor Fumata.\nEspero que esté bene, veramente.\n@c0@"
  fr: "@aNera@bJe m'inquiète un peu pour le professeur\r\nFulbert Fumeux. J'espère qu'il va bien.\n@c0@"
  it: "@aNera@bChissà come se la passa il Professor Pitagora...\n@c0@"
  ja: "@a@bフローラ「ベネットさん　心配ですわね。\n\t大丈夫かしら……。\n@c0@"
17:
  de: "@a%0%a001240@bWas dieser Professor Emsich wohl erforscht hat, wenn so viel Rauch aus dem Schornstein gekommen ist...\n@c0@"
  en: "@a%0%a001240@bI wonder what kind of research Professor Toilen Trubble was doing that caused all that smoke.\n@c0@"
  es: "@a%0%a001240@b¿Qué tipo de investigación estaría llevando el profesor Fumata para causar tal humareda?\n@c0@"
  fr: "@a%0%a001240@bJe me demande bien sur quoi le professeur\nFulbert Fumeux travaillait pour qu'il y ait\nautant de fumée.\n@c0@"
  it: "@a%0%a001240@bCome mai dal laboratorio del Professor Pitagora si alzava sempre del fumo?\nA quali esperimenti lavorava?\n@c0@"
  ja: "@a@b%a001240「ケムリが出るなんて\n\tそのベネットじいさんって人\n\tなんの研究してるのかな。\n@c0@"
18:
  de: "@a%0%a001240@bOh, du weißt alles darüber? Na, so was!\n@c0@"
  en: "@a%0%a001240@bOh, you know all about it? Huh!\n@c0@"
  es: "@a%0%a001240@b¡Ah!, ¿tú lo sabes? ¡Vaya!\n@c0@"
  fr: "@a%0%a001240@bOh, tu le saisⓡ C'est vraiⓡ Ouahⓠ\n@c0@"
  it: "@a%0%a001240@bPapà, tu lo sai?\n@c0@"
  ja: "@a@b%a001240「えっ？　お父さんは\n\tもう知ってるの？　ずるい！\n@c0@"
19:
  de: "@aSancho@bDiese Professor, Señor Emsich, er ist deine Amigo, no?\n@c0@"
  en: "@aSancho@bThees professor, señor Trubble, he ees your\r\nfriend, no?\n@c0@"
  es: "@aSancho@b¡Ándale! Ese profesor, el señor Fumata, es amigo tuyo, ¿no?\n@c0@"
  fr: "@aSancho@bCe professeur, le señor Fumeux, c'est ton ami, noⓡ\n@c0@"
  it: "@aSancho@bEl Professor Pitagora es un tuo amigo, chico...\n@c0@"
  ja: "@a@bサンチョ「その　ベネットさんとやら\n\tたしか　%a000090王の\n\tお知り合いの方でしたよね？\n@c0@"
20:
  de: "@aSancho@bDann du musst ihn besuchen und sehen, wie es ihm geht.\n@c0@"
  en: "@aSancho@bYou must visit heem and esee how he ees doing.\n@c0@"
  es: "@aSancho@b¿Por qué no le haces una visita a ver qué tal está?\n@c0@"
  fr: "@aSancho@bT-Tu devrais aller lui rendre v-visite pour voir\r\nc-comment il va.\n@c0@"
  it: "@aSancho@b¿Por qué no vai a trovarlo e vedi como esta?\n@c0@"
  ja: "@a@bサンチョ「この町に　寄ったときくらいは\n\t様子を　見にいってあげては\n\tいかがですか？\n@c0@"
21:
  de: "@aBianca@bWenn solch ein Gerücht erst mal in die Welt gesetzt wird, kann man es nicht mehr aufhalten.\n@c0@"
  en: "@aBianca@bOnce a rumour like that gets about,\r\nthere's no stoppin' it.\n@c0@"
  es: "@aBianca@bCuando un rumor como ese se extiende, corre más que la pólvora, ¿sabes?\n@c0@"
  fr: "@aBianca@bUne fois que ce genre de rumeur commence\r\nà se répandre, on ne peut plus l'arrêter.\n@c0@"
  it: "@aBianca@bCi risiamo con questa storia...\nCerte voci sono come l'erba cattiva: non c'è verso di farle sparire!\n@c0@"
  ja: "@a@bビアンカ「一度　広まった\n\t悪いウワサって　なかなか\n\t消えないものなのね。\n@c0@"
22:
  de: "@aNera@bWir können nur hoffen, dass sich nicht zu viele Leute von solch einem Geschwätz beeindrucken lassen.\n@c0@"
  en: "@aNera@bWe can only pray that not too many people have been taken in by that kind of talk.\n@c0@"
  es: "@aNera@bRecemos per que estas habladurías no hayan calado en la conciencia de mucha gente.\n@c0@"
  fr: "@aNera@bIl ne reste plus qu'à espérer que seules quelques personnes auront été séduites par ces balivernes.\n@c0@"
  it: "@aNera@bPare proprio che le false promesse della Setta di Zugzwang abbiano fatto presa su parecchie persone...\n@c0@"
  ja: "@a@bフローラ「あんなウワサに\n\tまどわされる人が　いないように\n\t祈らずにはいられませんわ。\n@c0@"
23:
  de: "@a%0%a001250@bDas stimmt doch nicht, oder? Die Göttin ist gar nicht so wählerisch, richtig?\n@c0@"
  en: "@a%0%a001250@bThat's not true, right? The Goddess doesn't show favouritism like that, does She?\n@c0@"
  es: "@a%0%a001250@bEso no es cierto... La Diosa no mostraría favoritismos como ese, ¿a que no?\n@c0@"
  fr: "@a%0%a001250@bCe n'est pas vrai, disⓡ La Déesse ne ferait pas de différences comme ça, heinⓡ\n@c0@"
  it: "@a%0%a001250@bMa è una bugia! La dea non fa favoritismi!\nSe davvero l'oscurità dovesse avvolgere il mondo, tutta l'umanità condividerebbe lo stesso destino!\n@c0@"
  ja: "@a@b%a001250「あんな話　ウソよね？\n\t神さまは　えこひいきなんて\n\tしないと思う！\n@c0@"
24:
  de: "@aSancho@bEs gibt eine Menge Gerüchte über diese Orden vom Zugzwang. Ach, was ist nur geworden aus diese Welt...\n@c0@"
  en: "@aSancho@bI hear many rumours about thees Order of Zugzwang these days. The world, ees no esuch a nice place no more.\n@c0@"
  es: "@aSancho@b¡Híjole! ¡Nomás corren los rumores sobre esa Orden de Zugzwang! ¡El mundo ya no es lo que era!\n@c0@"
  fr: "@aSancho@bJ'ai b-beaucoup entendu parler de l'Ordre du Zugzwang d-dernièrement. Le mundo n'est\r\nplus aussi p-paisible qu'avant.\n@c0@"
  it: "@aSancho@bMucha gente parla della Setta de Zugzwang en esto periodo...\n㈡\nAlcunos esprovvedutos piensano que diventare loro seguaces sia l'unico modo por salvarse...\n@c0@"
  ja: "@a@bサンチョ「最近　やたらと\n\t光の教団のうわさを　聞きますね。\n\tイヤな世の中に　なったもんです。\n@c0@"
25:
  de: "@aOtto@bManche Leute sind ganz besessen von dem Gedanken, die Welt könne untergehen. Unter anderem auch dieser Orden vom Zugzwang.\n@c0@"
  en: "@aTuppence@bSome people seem to thrive on the idea that the world may be coming to an end. The Order of Zugzwang are a prime example.\n@c0@"
  es: "@aAlazar@bHay quien se empeña en pensar que el fin del mundo está cerca. La Orden de Zugzwang es la principal precursora de esa creencia.\n@c0@"
  fr: "@aInnocent@bCertaines personnes ont un intérêt à prétendre\r\nque le monde va bientôt disparaître. L'Ordre du Zugzwang en est un bon exemple.\n@c0@"
  it: "@aSimon@bSe non si fosse sparsa la voce che la fine del mondo è imminente, la Setta di Zugzwang non avrebbe fatto proseliti!\n㈡\nChe siano stata la setta stessa a diffonderla, per farsi un po' di pubblicità?!\n@c0@"
  ja: "@a@bピピン「世界の終わり　っていうと\n\tやたら　元気になる人がいますが…\n\t教団の人たちが　そうなんでしょうね。\n@c0@"
26:
  de: "@aBianca@bDas ist kein Gerücht. Wir wissen, dass es wahr ist, nicht?\n@c0@"
  en: "@aBianca@bThat en't no rumour. We know it's the truth, eh?\n@c0@"
  es: "@aBianca@b¡Eso no es ningún rumor! Nosotros sabemos que así es, ¿eh?\n@c0@"
  fr: "@aBianca@bCe n'est pas une rumeur. Nous savons que c'est la vérité, n'est-ce pasⓡ\n@c0@"
  it: "@aBianca@bSì, è vero: molta gente fu costretta in schiavitù per edificare Rettilopolis.\nTu lo sai bene, amore mio... \n@c0@"
  ja: "@a@bビアンカ「あれは　ウワサじゃなくて\n\t本当にあったことなのよね……。\n@c0@"
27:
  de: "@aNera@bAlles in Ordnung, Liebling? Du siehst ein wenig mitgenommen aus.\n@c0@"
  en: "@aNera@bAre you alright, darling? You look a bit troubled.\n@c0@"
  es: "@aNera@b¿Estás bien, caro? Pareces preocupado.\n@c0@"
  fr: "@aNera@bÇa va, chériⓡ Tu as l'air troublé.\n@c0@"
  it: "@aNera@bNon pensarci, tesoro.\nQuell'orribile esperienza è passata...\n@c0@"
  ja: "@a@bフローラ「あなた　大丈夫？\n\tすこし　つらそうですわ……。\n@c0@"
28:
  de: "@a%0%a001240@bWas ist los, Papa? Du bist ganz grün im Gesicht.\n@c0@"
  en: "@a%0%a001240@bWhat's wrong, Dad? You've gone a bit green.\n@c0@"
  es: "@a%0%a001240@b¿Qué ocurre, papá? No tienes buena cara.\n@c0@"
  fr: "@a%0%a001240@bQu'est-ce qu'il y a, papaⓡ\nTu es tout pâle tout à coup.\n@c0@"
  it: "@a%0%a001240@bChe ti succede, papà?\nSei impallidito...\n@c0@"
  ja: "@a@b%a001240「お父さん　どうしたの？\n\t顔が　青いみたいだけど……。\n@c0@"
29:
  de: "@a%0%a001250@bSklaverei ist etwas Schreckliches! Jeder, der andere zwingt, etwas gegen ihren Willen zu tun, ist böse und gemein!\n@c0@"
  en: "@a%0%a001250@bI hate the idea of slavery! Anyone who turns people into slaves must be really, really wicked!\n@c0@"
  es: "@a%0%a001250@b¡Me repugna eso de la esclavitud! ¡Alguien capaz de esclavizar a la gente tiene que ser muy, muy malo!\n@c0@"
  fr: "@a%0%a001250@bL'esclavage me répugneⓠ Celui qui réduit quelqu'un d'autre en esclavage doit être vraiment méchantⓠ\n@c0@"
  it: "@a%0%a001250@bLa schiavitù è una cosa orribile!\nSolo una creatura senza cuore può ridurre in catene altri esseri viventi per i propri scopi!\n@c0@"
  ja: "@a@b%a001250「ドレイって　イヤな言葉！\n\tドレイさんなんて人\n\tつくったら　ダメなの。\n@c0@"
30:
  de: "@aBianca@bDie Leute, die damals nicht in Krokodilopolis waren, scheinen alle einer Gehirnwäsche unterzogen worden zu sein.\n@c0@"
  en: "@aBianca@bIt looks like people who weren't at the Crocodilopolis that time are still brainwashed.\n@c0@"
  es: "@aBianca@bParece que los que no estuvieron en Cocodrilópolis entonces siguen engañados, ¿sabes?\n@c0@"
  fr: "@aBianca@bOn dirait que ceux qui n'étaient pas à Crocodilopolis à l'époque n'ont encore rien compris.\n@c0@"
  it: "@aBianca@bÈ incredibile come tanta gente creda ancora alle menzogne diffuse dai seguaci della Setta di Zugzwang...\n@c0@"
  ja: "@a@bビアンカ「あのとき　大神殿に\n\tいなかった人たちは　まだ\n\t正気を　取りもどしてないのね……。\n@c0@"
31:
  de: "@aNera@bDer Orden vom Zugzwang ist doch am Ende. Aber anscheinend hat sie noch nichts davon gehört.\n@c0@"
  en: "@aNera@bBut the Order of Zugzwang is finished. It looks like she still hasn't heard.\n@c0@"
  es: "@aNera@bMaaa si la Orden de Zugzwang ya se disgregó. Parece que aquí no se han enterado todavía.\n@c0@"
  fr: "@aNera@bMais l'Ordre du Zugzwang n'existe plus.\r\nOn dirait que personne ne le lui a dit.\n@c0@"
  it: "@aNera@bLa Setta di Zugzwang non esiste più.\nForse quella donna ci resterà male, quando lo verrà a sapere...\n@c0@"
  ja: "@a@bフローラ「光の教団なんて\n\tもう　なくなっていますのに……。\n\tあの方　ご存じないのかしら。\n@c0@"
32:
  de: "@a%0%a001250@bDie Augen von der Frau machen mir Angst. Komm, lass uns schnell gehen...\n@c0@"
  en: "@a%0%a001250@bThat woman's eyes are scary. Can we hurry up and get away from her?\n@c0@"
  es: "@a%0%a001250@bLos ojos de esa mujer dan miedo de verdad. Venga, vámonos de aquí cuanto antes.\n@c0@"
  fr: "@a%0%a001250@bLes yeux de cette dame me font peur.\nOn peut se dépêcher de partir, papaⓡ\n@c0@"
  it: "@a%0%a001250@bPapà, lo sguardo di quella donna è inquietante...\nPossiamo allontanarci da lei, per favore?\n@c0@"
  ja: "@a@b%a001250「あの人　目が　こわいよ。\n\t早く　はなれようよ……！\n@c0@"
33:
  de: "@aSancho@bDieses Buch, das du gekauft hast, Chico, wird es uns bei unsere Mission helfen, si?\n@c0@"
  en: "@aSancho@bThees book you have purchased, My Majesty, ees eet to help us on our quest?\n@c0@"
  es: "@aSancho@bMajestad, ¿ese libro que ha comprado nos ayudará en nuestra aventura?\n@c0@"
  fr: "@aSancho@bC-Ce livre que tu as acheté, Ma Majesté, il va nous aider d-dans notre quêteⓡ\n@c0@"
  it: "@aSancho@b¿Chico, hai comprato quel libro por qué credi que ce sarà utile nel nuestro viaggio, oppure avevi solo voglia de esprecare un poco de dinero?\n@c0@"
  ja: "@a@bサンチョ「%a000090王　あの人から\n\t買った本は　役に立ちそうですか？\n@c0@"
34:
  de: "@aOtto@bNein, wenn irgendjemand wieder Frieden in der Welt schafft, dann seid Ihr es, %a000090. Ha ha!\n@c0@"
  en: "@aTuppence@bNo, if anyone's going to bring peace back to the world, it's you, %a000090. Ha ha!\n@c0@"
  es: "@aAlazar@bNi hablar. Si alguien ha de traer la paz al mundo, ese seréis vos, %a000090. ¡Ja, ja!\n@c0@"
  fr: "@aInnocent@bNon. Si quelqu'un doit ramener la paix dans le monde, ce sera vous, %a000090. Ha haⓠ\n@c0@"
  it: "@aSimon@bAh, la signora non ha capito niente...\nSe c'è qualcuno capace di riportare la pace nel mondo, quella persona è lei, re %a000090!\n@c0@"
  ja: "@a@bピピン「いえいえ　%a000090王こそが\n\t世界に　平和をもたらすんですのよ。\n\tおっほっほ。\n@c0@"
35:
  de: "@aBianca@bIn unserem eigenen Interesse?! Anscheinend glaubt sie diesen ganzen Humbug wirklich...\n@c0@"
  en: "@aBianca@bFor your own good!? She really has bin taken in by the whole thing, eh?\n@c0@"
  es: "@aBianca@b¡¿Por nuestro propio bien?! ¡Esta tía está como una regadera!\n@c0@"
  fr: "@aBianca@bPour notre bienⓠⓑ Elle est vraiment bien embrigadée...\n@c0@"
  it: "@aBianca@bPer il nostro bene?!\nQuella donna non sa quello che dice...\n@c0@"
  ja: "@a@bビアンカ「あなたのため　だって！\n\tどっぷり　教団に\n\tハマっているみたいね。\n@c0@"
36:
  de: "@a%0%a001240@bDreitausend Goldmünzen für solch ein blödes Buch?! Sie muss verrückt sein!\n@c0@"
  en: "@a%0%a001240@bThree thousand gold coins for a book of drivel\nlike that? She's got to be joking!\n@c0@"
  es: "@a%0%a001240@b¿Tres mil monedas de oro por un libro lleno de tonterías? ¡Estará de broma!\n@c0@"
  fr: "@a%0%a001240@bTrois mille pièces d'or pour ce torchonⓡ\nC'est une blagueⓠ\n@c0@"
  it: "@a%0%a001240@bTremila monete d'oro per un libro pieno zeppo di sciocchezze?! Lo prenderei solo se me lo regalasse, e non lo leggerei ma lo userei per accenderci il fuoco!\n@c0@"
  ja: "@a@b%a001240「あんな　ペラペラの本が\n\t３０００ゴールド！？　高すぎだよっ！\n@c0@"
37:
  de: "@aSancho@bDu hast Resst, Chico. Wenn du etwas von die Anhänger des Ordens vom Zugzwang kaufst, bekommen sie nur noch mehr Geld...\n@c0@"
  en: "@aSancho@bYou are right, friend. Eef you buy these theengs from the followers of the Order of Zugzwang, they gonna have more money for their evil plans.\n@c0@"
  es: "@aSancho@bTienes razón, chamaco. Comprar esas cosas a los seguidores de la Orden de Zugzwang nomás engrosará más sus arcas para sus malvados planes.\n@c0@"
  fr: "@aSancho@bT-Tu as raison, chico. Si on achète ces trucs à des d-disciples de l'Ordre du Z-Zugzwang, ils auront plus d'argent p-pour leurs plans diaboliques.\n@c0@"
  it: "@aSancho@bBravo, chico.\nComprare quel libro es como gettare el dinero dalla finestra.\n@c0@"
  ja: "@a@bサンチョ「ああやって　信者たちに\n\tお金を集めさせては　教団の金を\n\t増やしていくんですね……。\n@c0@"
38:
  de: "@aOtto@bDie Frau ist im gleichen Alter wie meine Mutter und trotzdem ergeht sie sich in Lobreden auf diesen Korol ⓚⓛ ausgerechnet der!\n@c0@"
  en: "@aTuppence@bThat woman's about the same age as my mother,\r\nand yet there she is, extolling the virtues of Korol\r\nof all people!\n@c0@"
  es: "@aAlazar@b¡Pero si esa mujer podría ser mi madre! ¡Y ahí la tienes, predicando las bondades de Korol al populacho!\n@c0@"
  fr: "@aInnocent@bCette femme a à peu près le même âge que ma mère et pourtant, elle est là à vanter les mérites de Korolⓠ\n@c0@"
  it: "@aSimon@bCome si fa ad avere fede in quel pagliaccio di Krocorov e nelle sue fandonie?!\nEh, sì: il mondo è pieno di creduloni...\n@c0@"
  ja: "@a@bピピン「……あの人　ボクの母さんと\n\t同じぐらいの年なのに。\n\tイブールの本だって……？\n@c0@"
39:
  de: "@a%0%a001240@bDu kannst doch nicht einfach dreitausend Goldmünzen für so ein Buch ausgeben, Papa! Das wäre ja die reinste Verschwendung!\n@c0@"
  en: "@a%0%a001240@bYou can't go spending three thousand gold coins on a book like that, Dad! What a waste!\n@c0@"
  es: "@a%0%a001240@bPapá, ¿cómo vas a gastarte tres mil monedas de oro en un libro como ese? ¡Eso es tirar el dinero!\n@c0@"
  fr: "@a%0%a001240@bTu ne peux pas dépenser trois milles pièces d'or pour ce genre de livre, papaⓠ C'est du gâchisⓠ\n@c0@"
  it: "@a%0%a001240@bPapà, per fortuna non hai i soldi per comprare quel libraccio!\nSarebbe stato come gettare il denaro nella spazzatura!\n@c0@"
  ja: "@a@b%a001240「お父さん　あんな本に\n\t３０００ゴールドも出しちゃダメだよ。\n\tムダづかいだよっ！\n@c0@"
40:
  de: "@a%0%a001250@bIch liebe Bücher, aber dieses da möchte ich nicht lesen. Du brauchst es also nicht zu kaufen, hörst du, Papa?\n@c0@"
  en: "@a%0%a001250@bI love books, but I wouldn't want to read that one. You don't need to worry about buying it, okay, Dad?\n@c0@"
  es: "@a%0%a001250@bA mí me encantan los libros, pero ese nunca lo leería. Así que no te molestes en comprarlo, ¿vale, papi?\n@c0@"
  fr: "@a%0%a001250@bJ'adore les livres, mais je n'ai pas vraiment envie\nde lire celui-là. Pas la peine de l'acheter, d'accord, papaⓡ\n@c0@"
  it: "@a%0%a001250@bIo amo i libri, ma quello non lo leggerei nemmeno sotto tortura! Papà, è un bene che tu non abbia i soldi per comprarlo...\n@c0@"
  ja: "@a@b%a001250「わたし　ご本　好きだけど\n\tあんな本は　読みたくない。\n\tお父さん　買わなくていいからね。\n@c0@"
41:
  de: "@aSancho@bMan sieht sofort, was diese Señora vorhat, eh, Chico? Sie ist eine Buch-Barrakuda und ernährt siss von hungrige Bücherwürmer...\n@c0@"
  en: "@aSancho@bAnyone can esee what thees señora ees doing.\r\nShe ees a book barracuda, eh, friend? Feeding\r\non the hungry bookworms.\n@c0@"
  es: "@aSancho@bEstá claro lo que pretende esta señora.\nVende esos libros abnegadamente, chamaco, para aprovecharse de lectores incautos.\n@c0@"
  fr: "@aSancho@bN'importe qui p-peut voir clair dans le jeu de cette señora. C'est oun rapace, hein, chicoⓡ Elle se nourrit des p-pigeons qui achètent ces livres.\n@c0@"
  it: "@aSancho@b¡Potremmo escrivere un libro sulle menzogne della Setta de Zugzwang, y venderlo por duemilas monedas!\n㈡\nAlmenos los acquirentes imparerebbero que Krocorov es un imbroglione, no comprerebbero el suo volume y risparmierebbero milles monedas...\n@c0@"
  ja: "@a@bサンチョ「なんと　つめたい言葉…\n\tお金もうけのため　というのが\n\t丸見えですね。\n@c0@"
42:
  de: "@aBianca@bMoment mal! Haben wir uns etwa auch verirrt?\n@c0@"
  en: "@aBianca@bHang on a minute! Are we lost too?\n@c0@"
  es: "@aBianca@b¡Espera un momento! ¿También nos hemos perdido?\n@c0@"
  fr: "@aBianca@bAttends une minuteⓠ Nous aussi, on est perdusⓡ\n@c0@"
  it: "@aBianca@bScusa la domanda apparentemente sciocca, ma... ci siamo persi anche noi?\n@c0@"
  ja: "@a@bビアンカ「あれ！？　ひょっとして\n\t私たちも　迷ったんじゃないかしら？\n@c0@"
43:
  de: "@aBianca@bHm, dachte ich mir schon. Könnten wir doch einfach die Mauern hinunterspringen! Dann wäre alles ganz leicht.\n@c0@"
  en: "@aBianca@bHuh, I thought as much. If only we could just jump down off the walls, it'd be dead easy.\n@c0@"
  es: "@aBianca@bVaya, lo sospechaba. Si pudiésemos saltar los muros, sería pan comido, ¿sabes?\n@c0@"
  fr: "@aBianca@bPfff, c'est bien ce que je me disais.\r\nSi seulement on pouvait descendre\r\nen sautant des murs, ce serait facile.\n@c0@"
  it: "@aBianca@bLo sapevo!\nSe solo potessimo saltare giù dai muri, sarebbe tutto più facile!\n@c0@"
  ja: "@a@bビアンカ「はぁ～　やっぱり……。\n\tヘイから　飛びおりられると\n\tラクチンなのにね。\n@c0@"
44:
  de: "@aBianca@bPuh. Na, da bin ich aber erleichtert. Ich verlass' mich auf dich, %a000090, ja?\n@c0@"
  en: "@aBianca@bPhew. That's a relief. I'm countin' on you, okay, %a000090?\n@c0@"
  es: "@aBianca@b¡Uff! Qué alivio. Cuento contigo, ¿vale, %a000090?\n@c0@"
  fr: "@aBianca@bPfiou. Quel soulagement.\nJe compte sur toi, hein, %a000090ⓡ\n@c0@"
  it: "@aBianca@bMeglio così, %a000090.\nSpero che il tuo senso dell'orientamento continui a funzionare come si deve!\n@c0@"
  ja: "@a@bビアンカ「あー　ほっとしたわ。\n\tたよりにしてるからね。　%a000090。\n@c0@"
45:
  de: "@aNera@bIch könnte mich nie verlaufen, nicht mal, wenn ich mit geschlossenen Augen herumlaufen würde.\n@c0@"
  en: "@aNera@bI wouldn't get lost even if I walked around with my eyes closed.\n@c0@"
  es: "@aNera@bNo podría perderme ni aunque cerrase los ojos per caminare.\n@c0@"
  fr: "@aNera@bJe ne pourrais pas me perdre, même en marchant\r\nles yeux fermés.\n@c0@"
  it: "@aNera@bIo mi perdo sempre...\n@c0@"
  ja: "@a@bフローラ「私なんて　目をつむって\n\t歩いていても　迷いませんわよ。\n@c0@"
46:
  de: "@aNera@bDenn ich habe ja dich, der auf mich aufpasst und mich in die richtige Richtung führt!\n@c0@"
  en: "@aNera@bI have you to look after me and guide me in the right direction, after all!\n@c0@"
  es: "@aNera@b¡Al fin y al cabo, te tengo a te para cuidarme y guiarme en la dirección correcta!\n@c0@"
  fr: "@aNera@bAprès tout, tu es là pour me protéger et me guider dans la bonne directionⓠ\n@c0@"
  it: "@aNera@bNon avrei dovuto saltare il corso di ⓕOrientamento local-globaleⓖ che si teneva all'abbazia...\n@c0@"
  ja: "@a@bフローラ「だって　あなたが\n\tみちびいて　くれるんですもの。\n\tぽっ……。\n@c0@"
47:
  de: "@a%0%a001250@bHa ha! Wie lustig, dass Erwachsene sich auch verlaufen können!\n@c0@"
  en: "@a%0%a001250@bHe he he! It's funny to see that an adult\ncan get lost too!\n@c0@"
  es: "@a%0%a001250@b¡Ji, ji, ji! ¡Ni los adultos se salvan de perderse en esta ciudad!\n@c0@"
  fr: "@a%0%a001250@bHé hé héⓠ C'est drôle de voir qu'un adulte peut se perdre aussiⓠ\n@c0@"
  it: "@a%0%a001250@bIh ih ih!\nÈ sempre divertente vedere qualcuno che si perde per strada! A patto che quel qualcuno non sia io, eh!\n@c0@"
  ja: "@a@b%a001250「うふふっ。\n\tおとなの人なのに　迷ってるの。\n\tおもしろーい。\n@c0@"
48:
  de: "@aOtto@bDie Rüstung dieses Mannes ist ganz schön rostig. Und seine Gesichtsbehaarung hat er auch net mehr unter Kontrolle.\n@c0@"
  en: "@aTuppence@bThat man's armour is fairly rusty. And his facial hair is totally out of control.\n@c0@"
  es: "@aAlazar@bEse hombre tiene la armadura bastante oxidada. Y barba.\n@c0@"
  fr: "@aInnocent@bL'armure de cet homme est pas mal rouillée et son visage est mangé par la barbe.\n@c0@"
  it: "@aSimon@bQuell'uomo aveva l'armatura arrugginita e la barba lunga...\n@c0@"
  ja: "@a@bピピン「あの人の　よろい…\n\tかなり　サビついてましたよ。\n\tそれにヒゲも　伸び放題で。\n@c0@"
49:
  de: "@aOtto@bJa, ich würd' sagen, dass er seit mindestens fünf Jahren durch die Gegend irrt!\n@c0@"
  en: "@aTuppence@bYep, I'd say he must've been wandering about lost for at least five years now!\n@c0@"
  es: "@aAlazar@b¡Sí, yo diría que ese tipo lleva unos cinco años perdido!\n@c0@"
  fr: "@aInnocent@bÀ vue de nez, je dirais que ça fait bien cinq ans\nqu'il est perduⓠ\n@c0@"
  it: "@aSimon@bA occhio e croce, si sarà perso almeno cinque o sei anni fa. Se stava andando a un appuntamento, temo che l'abbia perso...\n@c0@"
  ja: "@a@bピピン「…ということは　\n\tやつは　少なくとも５年は\n\t迷い続けてますねっ。\n@c0@"
50:
  de: "@aBianca@bJa, hier weht wirklich die ganze Zeit eine schöne erfrischende Brise, nicht?\n@c0@"
  en: "@aBianca@bYeah, there is a lovely breeze blowin' here all the time, eh?\n@c0@"
  es: "@aBianca@bSí, la brisa que corre por aquí es de lo más agradable.\n@c0@"
  fr: "@aBianca@bOui, il y a une agréable brise qui souffle en permanence, ici, tu ne trouves pasⓡ\n@c0@"
  it: "@aBianca@bSì, è un venticello dolcissimo...\n@c0@"
  ja: "@a@bビアンカ「本当……　この町の風は\n\tやさしい感じがするわね。\n@c0@"
51:
  de: "@aNera@bDer Blick von hier ist einfach atemberaubend. Ich kann mir vorstellen, dass es hier sehr erholsam ist.\n@c0@"
  en: "@aNera@bThe view here is incredible. I can imagine it's a very relaxing spot.\n@c0@"
  es: "@aNera@bLa vista desde aquí es extraordinaria. Veramente, es un paraje molto relajante.\n@c0@"
  fr: "@aNera@bLa vue d'ici est incroyable. Je comprends que ce soit un endroit où l'on vienne se détendre.\n@c0@"
  it: "@aNera@bChe panorama fantastico!\nLascia senza fiato...\n@c0@"
  ja: "@a@bフローラ「ここは　ながめもいいし\n\t最高に　くつろげるでしょうね。\n@c0@"
52:
  de: "@a%0%a001240@bEr hat recht, hier weht ein angenehmes Lüftchen. Aber den ganzen Windmühlen nach zu urteilen, scheint es hier immer windig zu sein...\n@c0@"
  en: "@a%0%a001240@bHe's right, it is a nice breeze. Maybe it's always windy here, judging by all the windmills they have.\n@c0@"
  es: "@a%0%a001240@bTiene razón, corre una brisa agradable. A juzgar por la cantidad de molinos, yo diría que en este sitio siempre hace viento.\n@c0@"
  fr: "@a%0%a001240@bIl a raison. Elle est agréable, cette petite brise.\nMais il doit toujours y avoir du vent ici, vu le\nnombre de moulinsⓠ\n@c0@"
  it: "@a%0%a001240@bA giudicare da quanti mulini a vento ci sono in zona, qui deve spirare sempre una bella arietta...\n@c0@"
  ja: "@a@b%a001240「ホントだ。　風が気持ちいいね。\n\tこの町は　風車も多いし　もしかして\n\t一年じゅう　風がふくのかな？\n@c0@"
53:
  de: "@aBianca@bStadt?! Also für mich ist das alles andere als eine Stadt!\n@c0@"
  en: "@aBianca@bCity!? Dun't look much like a city to me!\n@c0@"
  es: "@aBianca@b¡¿Ciudad?! Qué sabrá este lo que es una ciudad...\n@c0@"
  fr: "@aBianca@bUne villeⓠⓑ Moi je n'appelle pas ça une villeⓠ\n@c0@"
  it: "@aBianca@bCittà?!\nMa dove l'ha vista quel tipo la ⓕcittàⓖ, eh?\n@c0@"
  ja: "@a@bビアンカ「えっ？　ここが都会？？\n@c0@"
54:
  de: "@a%0%a001240@bWenn sie diesen Ort für groß halten, frage ich mich, wie sie denn Fortuna oder Bakenmünde nennen würden!\n@c0@"
  en: "@a%0%a001240@bIf they think this place is big, I wonder what\nthey'd make of somewhere like Fortuna or\nLodestar Harbour!\n@c0@"
  es: "@a%0%a001240@bSi este lugar les parece grande es porque no han visto Fortuna o Puerto Polaris...\n@c0@"
  fr: "@a%0%a001240@bS'ils trouvent que c'est une grande ville, je me demande ce qu'ils diraient de Bonaventure ou\nde Port-Lanterneⓠ\n@c0@"
  it: "@a%0%a001240@bSe quell'uomo pensa che questo posto sia grande, cosa direbbe se visitasse Fortuna o Grandport?\n@c0@"
  ja: "@a@b%a001240「あの人たち\n\tオラクルベリーとか　ポートセルミに\n\t行ったら　気絶しちゃうかもねっ。\n@c0@"
55:
  de: "@aSancho@bDiese Männer, sie sind Reisende wie wir, si?\n@c0@"
  en: "@aSancho@bThese men, they are travellers like us, sí?\n@c0@"
  es: "@aSancho@b¡Órale! Esos hombres también son viajeros, ¿no?\n@c0@"
  fr: "@aSancho@bCes señors, ce sont des v-voyageurs comme\nnous, siⓡ\n@c0@"
  it: "@aSancho@bHo fame...\nQuasi quasi preparo un pocos de paella...\n@c0@"
  ja: "@a@bサンチョ「おや　私たちと同じ\n\t旅の人みたいですね。\n@c0@"
56:
  de: "@aNera@bWie seltsam! Warum darf denn niemand erfahren, dass sie vom Lande sind?\n@c0@"
  en: "@aNera@bHow odd! I wonder why they're so worried about people finding out they're from the country.\n@c0@"
  es: "@aNera@b¡Qué raro! ¿Per qué no querrán que se sepa que son forasteros?\n@c0@"
  fr: "@aNera@bC'est bizarreⓠ Je me demande pourquoi ils ont si peur qu'on découvre qu'ils viennent de la campagne.\n@c0@"
  it: "@aNera@bCredo sia impossibile non accorgersi che quei tipi non sono di queste parti...\n@c0@"
  ja: "@a@bフローラ「……？？？\n\tいなか者と思われると　どうして\n\tいけないのかしら？\n@c0@"
57:
  de: "@a%0%a001250@bIch liebe das Land! Dort ist es viel angenehmer als in der Stadt, und es gibt Flüsse und Felder, auf denen man spielen kann.\n@c0@"
  en: "@a%0%a001250@bI love the country! It's so much more relaxing than being in a town, and there are lots of lovely rivers and fields to play in.\n@c0@"
  es: "@a%0%a001250@b¡Me encanta el campo! Me relajo y olvido el bullicio de la ciudad, y siempre hay un riachuelo o pradera para jugar.\n@c0@"
  fr: "@a%0%a001250@bJ'adore la campagneⓠ C'est tellement plus calme que la ville et il y a plein de rivières et de champs où on peut jouer.\n@c0@"
  it: "@a%0%a001250@bIo preferisco la campagna alla città.\nAdoro correre nei prati e arrampicarmi sugli alberi!\nLa natura è meravigliosa!\n@c0@"
  ja: "@a@b%a001250「わたし　いなかって好きよ。\n\t都会より　ず～っと　のんびりしてるし\n\t川や　原っぱで遊ぶの　楽しいもん！\n@c0@"
58:
  de: "@a%0%a001240@bSolch einen hohen Turm müsste man doch eigentlich von überall sehen, oder? Aber wahrscheinlich ist die Welt doch größer, als ich dachte...\n@c0@"
  en: "@a%0%a001240@bYou'd have thought you'd be able to see a tower that tall from anywhere. I suppose the world's bigger than you'd think.\n@c0@"
  es: "@a%0%a001240@bUna torre así debería de verse desde cualquier parte. Supongo que el mundo es mucho más grande de lo que imaginaba.\n@c0@"
  fr: "@a%0%a001240@bJ'aurais pensé qu'une tour aussi haute se verrait de partout. Le monde doit être plus grand que je\nne le pensais.\n@c0@"
  it: "@a%0%a001240@bUna torre tanto alta da raggiungere il cielo dovrebbe essere visibile da qualsiasi punto del mondo, no?\nAllora forse non è poi tanto alta!\n@c0@"
  ja: "@a@b%a001240「そんな　高い塔なら\n\tどこからでも　見えそうなのに。\n\t世界って　広いよね。\n@c0@"
59:
  de: "@aBianca@bIch verstehe ja, dass er etwas trinken möchte, aber es kommt mir doch ziemlich übertrieben vor, deshalb allein hier zu warten.\n@c0@"
  en: "@aBianca@bI can understand him wantin' a drink, but he must be pretty desperate to be hangin' about waitin' here on his own.\n@c0@"
  es: "@aBianca@bEntiendo que le apetezca echar un trago, pero debe de estar desesperado para estar aquí vagando solo, esperando, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe peux comprendre qu'il ait soif, mais il doit être vraiment désespéré pour attendre ici tout seul.\n@c0@"
  it: "@aBianca@bSe vuole sciacquarsi la gola, perché non si fa una bella bevuta d'acqua di rubinetto? Non è ⓕrobbaⓖ abbastanza ⓕbbonaⓖ per il suo palato raffinato?\n@c0@"
  ja: "@a@bビアンカ「飲みたいのは　わかるけど\n\tこんな　誰もいないところで\n\tよく　ひとりで　待ってられるものね。\n@c0@"
60:
  de: "@aNera@bEr trinkt offenbar sehr gern ein paar Gläschen, wenn er es schon kaum erwarten kann, dass die Schänke ihre Tore öffnet!\n@c0@"
  en: "@aNera@bHe must really love to drink if he's waiting for the pub doors to open!\n@c0@"
  es: "@aNera@b¡Debe de ser molto aficionado a la bebida para estar aquí esperando que abran la taberna!\n@c0@"
  fr: "@aNera@bIl doit vraiment aimer boire pour attendre comme ça l'ouverture des portes de la taverneⓠ\n@c0@"
  it: "@aNera@bMi chiedo come faccia questo poveretto a sopravvivere il giorno di chiusura settimanale del locale...\n@c0@"
  ja: "@a@bフローラ「開店前から　待ってるなんて\n\tよほど　お酒が　お好きなのね。\n@c0@"
61:
  de: "@a%0%a001240@bWenn er so dringend etwas trinken muss, warum nimmt er dann kein Wasser? Das versteh ich nicht...\n@c0@"
  en: "@a%0%a001240@bIf he needs a drink that badly, then why doesn't he just have some water? I don't get it!\n@c0@"
  es: "@a%0%a001240@bSi tan sediento está, ¿por qué no bebe de una fuente? ¡No lo entiendo!\n@c0@"
  fr: "@a%0%a001240@bS'il a la gorge si sèche, pourquoi il ne boit pas un verre d'eauⓡ Je ne comprends pasⓠ\n@c0@"
  it: "@a%0%a001240@bPapà, quell'uomo sta morendo di sete!\nPerché non gli diamo un po' d'acqua, eh?\n@c0@"
  ja: "@a@b%a001240「のどが　かわいてるなら\n\tお水を　飲んでくればいいのに。\n\tへんな人だなあ。\n@c0@"
62:
  de: "@aBianca@bWenn er sich doch nur für etwas anderes so begeistern könnte wie für den Alkohol...\n@c0@"
  en: "@aBianca@bIf only he could channel his enthusiasm for the drink into somethin' more useful, eh?\n@c0@"
  es: "@aBianca@bOjalá se dedicara a algo de provecho en lugar de a la bebida, ¿sabes?\n@c0@"
  fr: "@aBianca@bSi seulement il pouvait reporter sa passion pour la boisson sur quelque chose d'un peu plus utile...\n@c0@"
  it: "@aBianca@bLa bottiglia gliela darei volentieri, ma in test...\nOh, santa dea! Perdonami per questo mio pensiero impulsivo e tutt'altro che caritatevole!\n@c0@"
  ja: "@a@bビアンカ「あの　お酒への情熱を\n\tもっと　有効活用したいわね。\n@c0@"
63:
  de: "@aNera@bIch glaube, so etwas ist uns schon einmal passiert...\n@c0@"
  en: "@aNera@bI seem to remember the same thing happening before.\n@c0@"
  es: "@aNera@bQuesta situación ya la he vivido...\n@c0@"
  fr: "@aNera@bJ'ai l'impression d'avoir déjà vécu cette situation.\n@c0@"
  it: "@aNera@bUhm, questa situazione non mi è nuova...\n@c0@"
  ja: "@a@bフローラ「たしか　以前にも\n\t同じことが　あったような……。\n@c0@"
64:
  de: "@a%0%a001250@bEr war nicht besonders erfreut, was?\n@c0@"
  en: "@a%0%a001250@bHe wasn't very happy, was he?\n@c0@"
  es: "@a%0%a001250@bNo parecía muy feliz, ¿no?\n@c0@"
  fr: "@a%0%a001250@bIl n'était pas très content, heinⓡ\n@c0@"
  it: "@a%0%a001250@bCosa voleva quell'uomo?\n@c0@"
  ja: "@a@b%a001250「ち！　って言われちゃったね。\n@c0@"
65:
  de: "@aOtto@bWelch eine Ungeheuerlichkeit! Schleicht sich einfach an den König heran und verwechselt ihn mit einem simplen Wirt!\n@c0@"
  en: "@aTuppence@bHow rude! Fancy accosting the ruler of a kingdom and treating him like a lowly barman!\n@c0@"
  es: "@aAlazar@b¡Qué grosero! ¡Dirigirse al soberano de un reino como si fuera un simple tabernero!\n@c0@"
  fr: "@aInnocent@bQuel culotⓠ Oser s'adresser au souverain d'un royaume comme à un simple tavernierⓠ\n@c0@"
  it: "@aSimon@bSanta dea, aiutami a restar calmo e a non far polpette di questo buzzurro insolente!\n@c0@"
  ja: "@a@bピピン「なんと　無礼な！\n\t仮にも　一国の王をつかまえて\n\tバーテンよばわりとはっ。\n@c0@"
66:
  de: "@aBianca@bRiech doch mal! Ich wette, hier könnte man allein vom Atmen schon beschwipst werden!\n@c0@"
  en: "@aBianca@bSmell that booze in the air! I reckon you could get a bit tipsy just from breathin' in this place!\n@c0@"
  es: "@aBianca@b¡El ambiente apesta a alcohol! ¡Creo que te puedes poner un poco piripi con solo respirar aquí!\n@c0@"
  fr: "@aBianca@bTu sens un peu cette odeurⓡ Je parie que le simple fait de respirer l'air d'ici fait tourner la têteⓠ\n@c0@"
  it: "@aBianca@bLatte d'orco?!\nBleah!\nNo, grazie! M'è passata la sete!\n@c0@"
  ja: "@a@bビアンカ「うわ～　すごいお酒のニオイ。\n\tここにいるだけで　クラクラ\n\tしちゃいそうだわ。\n@c0@"
67:
  de: "@aNera@bMeinst du, sie verbrauchen an einem Abend wirklich so viel von dem Zeug?\n@c0@"
  en: "@aNera@bDo you think they can really get through that much drink in one night?\n@c0@"
  es: "@aNera@b¿Tú crees que pueden acabar con esa cantidad de bebida en una sola notte?\n@c0@"
  fr: "@aNera@bTu penses vraiment qu'ils arrivent à boire autant rien qu'en une nuitⓡ\n@c0@"
  it: "@aNera@bNiente latte d'orco per me, grazie.\nPreferirei una spremuta d'arancia non filtrata...\n@c0@"
  ja: "@a@bフローラ「あんなに　大量のお酒が\n\tひと晩で　なくなってしまうのかしら。\n@c0@"
68:
  de: "@aBianca@bHmm. Ich habe das Gefühl, er verschweigt uns etwas.\n@c0@"
  en: "@aBianca@bHmm. I can't help feelin' like he's hidin' somethin'.\n@c0@"
  es: "@aBianca@bMmm. Me da la sensación de que oculta algo.\n@c0@"
  fr: "@aBianca@bMmm. Je ne peux pas m'empêcher de penser qu'il nous cache quelque chose.\n@c0@"
  it: "@aBianca@bCredevo che la Delizia di Milleventi fosse una bevanda saporitissima...\n@c0@"
  ja: "@a@bビアンカ「なんか　かくしている\n\tクチぶりね。　あやしいわ。\n@c0@"
69:
  de: "@aNera@bMeinst du nicht, dass er gerade etwas verschlagen geguckt hat? Als würde er uns aus irgendeinem Grund anlügen.\n@c0@"
  en: "@aNera@bDon't you think he looked a little shifty? Almost as if he was fibbing to us for some reason.\n@c0@"
  es: "@aNera@b¿No crees que tenía aspecto sospettoso? Come si nos estuviese queriendo engañar por algún motivo.\n@c0@"
  fr: "@aNera@bIl avait l'air un peu sournois, tu ne trouves pasⓡ Comme s'il nous racontait des craques.\n@c0@"
  it: "@aNera@bLa Delizia di Milleventi è robaccia? Ecco perché mio padre non riesce a trovarla da nessuna parte!\nDevono aver smesso di produrla...\n@c0@"
  ja: "@a@bフローラ「あの方　目をそらしましたわ。\n\tウソを　ついていらっしゃるのね。\n@c0@"
70:
  de: "@a%0%a001240@bDas hört sich aber nicht gerade überzeugend an.\n@c0@"
  en: "@a%0%a001240@bSounds a bit fishy to me.\n@c0@"
  es: "@a%0%a001240@bTodo esto me huele un poco a chamusquina.\n@c0@"
  fr: "@a%0%a001240@bÇa me parait louche, cette histoireⓠ\n@c0@"
  it: "@a%0%a001240@bQuel tipo non me la racconta giusta...\n@c0@"
  ja: "@a@b%a001240「ボク　知ってるよ！\n\tあのおじさんみたいな状態を\n\t目が泳いでる　っていうんだよね。\n@c0@"
71:
  de: "@aSancho@bEs ist besser, wenn du nisst zu viele Fragen stellst, Chico. Das scheint zu sein eine heikle Thema...\n@c0@"
  en: "@aSancho@bEes better eef we no ask too many questions, My Majesty. Eet eseems like a delicate esituation.\n@c0@"
  es: "@aSancho@bSerá mejor que no hagamos muchas preguntas, Majestad. La situación se volvió delicada.\n@c0@"
  fr: "@aSancho@bIl v-vaut mieux ne pas p-poser trop de questions, Ma Majesté. Ça l'air d'être oun sujet délicat.\n@c0@"
  it: "@aSancho@bChico, lasciamo estare...\nNo es una cosa importante...\n@c0@"
  ja: "@a@bサンチョ「なにか　事情がありそうですね。\n\tあまり　しつこく聞いては\n\tいけないというものです　%a000090王。\n@c0@"
72:
  de: "@aBianca@bNormalerweise versucht doch jeder, aus etwas so Leckerem Geld zu machen, oder?\n@c0@"
  en: "@aBianca@bWhen people have a drink that tasty, they usually try to make money out of it.\n@c0@"
  es: "@aBianca@bSi tienes una taberna y sirves una bebida tan rica, lo normal es que quieras sacarle algo de beneficio...\n@c0@"
  fr: "@aBianca@bQuand les gens fabriquent une boisson aussi bonne, ils essaient généralement de se faire de l'argent avec.\n@c0@"
  it: "@aBianca@bDi solito, quando si produce una bevanda tanto prelibata, si cerca di venderla in gran quantità per ricavarci qualche soldino, no?\n@c0@"
  ja: "@a@bビアンカ「ふつう　そんなに\n\tすごく　おいしいお酒があったら\n\tお金もうけを考えたりするもんだけど…\n@c0@"
73:
  de: "@aBianca@bDie Leute hier müssen schon sehr an dem Gebräu hängen, wenn sie es unbedingt geheim halten und für sich behalten wollen!\n@c0@"
  en: "@aBianca@bThe folk here must love the old booze an awful lot if they decided to keep it a secret and enjoy it by themselves instead!\n@c0@"
  es: "@aBianca@bPues ya tiene que gustarle a la gente de aquí para que la tengan tan en secreto. Son unos egoístas, ¿sabes?\n@c0@"
  fr: "@aBianca@bIls doivent vraiment l'adorer s'ils préfèrent que ça reste un secret et que personne d'autre ne puisse\ny goûterⓠ\n@c0@"
  it: "@aBianca@bEvidentemente gli abitanti della zona preferiscono mantenere il segreto perché vogliono berla tutta loro! Ingordi!\n@c0@"
  ja: "@a@bビアンカ「自分たちだけで楽しみたいなんて\n\tこの町には　よほど　お酒好きが\n\tそろっているのね。\n@c0@"
74:
  de: "@a%0%a001240@bBitte trink hier keinen Sprungsprudel, Papa. Warte, bis ich groß bin, dann können wir zusammen trinken.\n@c0@"
  en: "@a%0%a001240@bDon't drink any of the Zoomshine here will you, Dad. If you wait until I grow up, we can drink it together.\n@c0@"
  es: "@a%0%a001240@bPapá, no bebas telelicor aquí. Si esperas a que me haga mayor, podemos beberlo juntos.\n@c0@"
  fr: "@a%0%a001240@bNe bois pas le télétord-boyaux maintenant, papa. Attends que je grandisse et on le boira ensemble\nun jour.\n@c0@"
  it: "@a%0%a001240@bPapà, quando sarò grande mi farai assaggiare la Delizia di Milleventi?\n@c0@"
  ja: "@a@b%a001240「お父さん　ルラフェンの地酒\n\t飲まないでね。　ボクが大きくなったら\n\tいっしょに飲もうね。\n@c0@"
75:
  de: "@aSancho@bPuh, iss wünschte, iss könnte etwas von diese Sprungsprudel kosten... Aber er gehört dir und nisst mir... (Grummel grummel)\n@c0@"
  en: "@aSancho@bUf, I weesh I could try esome of thees Zoomshine...\r\nBut ees, ees yours, no mine...\r\n(mutter mutter)\n@c0@"
  es: "@aSancho@bUf, ya me gustaría probar el telelicor ese...\nPero, ándale, es tuyo...\n(murmullo)\n@c0@"
  fr: "@aSancho@bAh, j'aimerais bien g-goûter le télétord-boyaux...\r\nM-Mais c'est le tien, pas le m-mien... (marmonnement)\n@c0@"
  it: "@aSancho@bMe piacerebbe mucho provare un poco de quella Delizia de Milleventi... ¿Chico, no potrei averne un goccetto, eh? Un goccettino pequeño pequeño...\n@c0@"
  ja: "@a@bサンチョ「ああ…　ルラフェンの地酒が\n\t飲んでみたい……！　でも　あれは\n\t%a000090王のもの…　ブツブツ……。\n@c0@"
76:
  de: "@aOtto@bWenn er so gut schmeckt, wie es den Anschein hat, ließe sich damit bestimmt eine Menge Geld verdienen.\n@c0@"
  en: "@aTuppence@bIf it tastes as good as he says, I should imagine it would fetch a fair old price.\n@c0@"
  es: "@aAlazar@bDe saber tan bien como cuentan, no me extrañaría que alcanzara un precio desorbitado.\n@c0@"
  fr: "@aInnocent@bSi c'est aussi bon qu'ils le disent, je suis sûr que nous pourrions en tirer un bon prix.\n@c0@"
  it: "@aSimon@bSe quella bibita è così buona come dicono, dovrebbero metterla in commercio a carissimo prezzo.\n㈡\nPoi potrebbero investire il ricavato per aumentare la produzione, così ne avrebbero a sufficienza per berne a volontà e vendere l'eccedenza ai forestieri!\n@c0@"
  ja: "@a@bピピン「そんなお酒があったら\n\tすごい値段で　売れるだろうになあ。\n@c0@"
77:
  de: "@aBianca@bEs ist doch interessant, eine Stadt mit so vielen unterschiedlichen Leuten zu sehen, nicht?\n@c0@"
  en: "@aBianca@bIt's interestin' to see a town full of so many different types of folk again, eh?\n@c0@"
  es: "@aBianca@bPues es interesante ver una población con sus gentes variopintas y eso, ¿sabes?\n@c0@"
  fr: "@aBianca@bC'est intéressant de voir à nouveau une ville où vivent tant de personnes différentes.\n@c0@"
  it: "@aBianca@bDorme placida e beata.\nNon facciamo rumore, altrimenti si sveglierà...\n@c0@"
  ja: "@a@bビアンカ「ここって　あいかわらず\n\tいろいろな人たちが\n\tみんなで　住んでいるのね。\n@c0@"
78:
  de: "@aNera@bEs muss Spaß machen, mit so vielen anderen zusammenzuleben. Da wird es bestimmt nie langweilig!\n@c0@"
  en: "@aNera@bIt must be fun living with lots of people like they do here. Never a dull moment!\n@c0@"
  es: "@aNera@bDebe de ser divertente vivir con tanta gente, como hacen aquí. ¡No hay tiempo para aburrirse!\n@c0@"
  fr: "@aNera@bÇa doit être amusant de vivre avec plein de gens, comme ici. On ne s'ennuie jamaisⓠ\n@c0@"
  it: "@aNera@bÈ divertente vivere con tante altre persone!\nNon ci si annoia mai!\n@c0@"
  ja: "@a@bフローラ「ここのように　みんなで\n\tにぎやかに暮らすのって\n\t楽しそうですわ。\n@c0@"
79:
  de: "@aOtto@bWie süß sie aussieht, wenn sie schläft... Sollten wir nicht auch schlafen gehen, %a000090?\n@c0@"
  en: "@aTuppence@bHow sweet she looks when she sleeps!\nPerhaps we should go to sleep too, %a000090!\n@c0@"
  es: "@aAlazar@bYace tan vulnerable entre sueños...\n¡Oooh! ¡Me siento estremecer, %a000090!\n@c0@"
  fr: "@aInnocent@bElle a l'air si paisible quand elle dortⓠ\nEt si nous allions dormir aussi, %a000090ⓡ\n@c0@"
  it: "@aSimon@bQuando dorme, quella fanciulla ha un'espressione dolcissima...\nMi piacerebbe svegliarla con un bacio e una rosa...\n㈡\nE probabilmente lei si metterebbe a urlare e chiamerebbe le guardie per farmi arrestare.\nNo, no. Meglio rinunciare...\n@c0@"
  ja: "@a@bピピン「なんと　無防備なあの寝顔！\n\t%a000090王　ボク　なんだか\n\tドキドキしてきました。\n@c0@"
80:
  de: "@aSancho@bNo, Chico! Es gehört siss nisst, einer Señorita beim Schlafen zuzusehen!\n@c0@"
  en: "@aSancho@bNo, friend! Ees wrong to approach a señorita when eshe ees esleeping.\n@c0@"
  es: "@aSancho@b¡No, chamaco! No está bien acercarse a una señorita cuando duerme.\n@c0@"
  fr: "@aSancho@bNo, chicoⓠ Ce n'est p-pas bien de s'approcher d'une señorita quand elle d-dort.\n@c0@"
  it: "@aSancho@b¿Ma que fai, chico?\n¡No devi hablar con las señoritas que dormono!\n@c0@"
  ja: "@a@bサンチョ「ダメですよ。\n\t寝ている若い女性に　近づくなんて\n\t失礼ですよ。\n@c0@"
81:
  de: "@aBianca@bEltern machen sich immer Sorgen. Das hört nie auf...\n@c0@"
  en: "@aBianca@bParents just can't seem to help worryin', eh?\n@c0@"
  es: "@aBianca@bSer madre es una preocupación constante, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe crois que c'est le lot de tous les parents de s'inquiéter, heinⓡ\n@c0@"
  it: "@aBianca@bAnch'io desidero dei nipotini.\r\nMa non adesso, eh! Diciamo tra venti o trent'anni...\r\nSono troppo giovane per fare la nonna!\n@c0@"
  ja: "@a@bビアンカ「親の心配って\n\tつきないものなのねえ……。\n@c0@"
82:
  de: "@aNera@bKinder sind einfach etwas Wunderbares. Ich wünschte, ich hätte unsere Kinder aufwachsen sehen können...\n@c0@"
  en: "@aNera@bChildren are so adorable. I wish I'd been able to see our children more when they were tiny.\n@c0@"
  es: "@aNera@bNon cⓘè nada como tener hijos. Me hubiera gustado ver más a nuestros hijos de pequeños.\n@c0@"
  fr: "@aNera@bLes enfants sont si mignons. J'aurais bien aimé voir un peu plus les nôtres quand ils étaient petits.\n@c0@"
  it: "@aNera@bSe penso che non ho potuto crescere i miei figli perché ero stata trasformata in una statua, mi viene da piangere...\n㈡\nQuando un giorno avrò dei nipoti, starò sempre con loro! In quel modo potrò recuperare almeno in parte le gioie che il destino mi ha sottratto...\n@c0@"
  ja: "@a@bフローラ「子供って　本当にかわいいもの。\n\t私も　子供たちの　小さな時の顔を\n\tもっともっと　見たかったわ。\n@c0@"
83:
  de: "@a%0%a001240@bWarum soll sie denn keine Enkelkinder bekommen, wenn sie sich um ihren Sohn Sorgen macht? Das verstehe ich nicht.\n@c0@"
  en: "@a%0%a001240@bWhy does it mean she won't get grandchildren just because her son's a worry? I don't get it!\n@c0@"
  es: "@a%0%a001240@b¿Por qué dice que no le va a dar nietos? ¿Y qué es el camino de la amargura? ¡No lo entiendo!\n@c0@"
  fr: "@a%0%a001240@bCe n'est pas parce que son fils lui cause du souci qu'elle ne pourra pas être grand-mère...\nJe ne comprends pasⓠ\n@c0@"
  it: "@a%0%a001240@bQuella donna non dovrebbe essere dispiaciuta.\nMagari suo figlio vorrà dei bambini tra qualche annetto! Ogni cosa a suo tempo, no?\n@c0@"
  ja: "@a@b%a001240「こまった息子だと\n\t孫の顔が　見られないの？\n\tおとなの話って　よくわからないね。\n@c0@"
84:
  de: "@aOtto@bIch hoffe, ich kann meiner Mutter viele Enkelchen schenken. Aber dazu sollte ich erst mal eine Frau finden...\n@c0@"
  en: "@aTuppence@bI hope I manage to produce grandchildren for\r\nmy mother before long. Better find a wife first,\r\nI suppose!\n@c0@"
  es: "@aAlazar@bMe gustaría engendrar cuanto antes más de un hijo para que mi madre se sienta orgullosa. ¡Aunque primero tendría que desposar a una mujer!\n@c0@"
  fr: "@aInnocent@bJ'espère que je pourrai bientôt faire des\npetits-enfants à ma mère. Mais il faut\nd'abord que je trouve une femmeⓠ\n@c0@"
  it: "@aSimon@bIo ho una gran voglia di regalare dei nipotini a mia madre!\r\nPerò prima devo trovare una moglie...\n@c0@"
  ja: "@a@bピピン「ボクも早く　母さんに\n\t孫の顔　見せてあげたいなあ。\n\tお嫁さんさがし　がんばらなくちゃ！\n@c0@"
85:
  de: "@aBianca@bTja, so lange ihn das glücklich macht...! Jedem das Seine.\n@c0@"
  en: "@aBianca@bIf that's what floats his boat, then who are we\r\nto argue?\n@c0@"
  es: "@aBianca@bSi eso es lo que le hace feliz, no creo que tengamos nada que decir, ¿sabes?\n@c0@"
  fr: "@aBianca@bSi c'est ça qui lui permet de garder le moral,\non n'a pas à discuter, heinⓡ\n@c0@"
  it: "@aBianca@bProsciutto di Cinghialorco?! Sì, è buono, ma un po' troppo grasso. Preferisco la carne magra e delicata del Pescetrippa. Ci tengo alla linea, io!\n@c0@"
  ja: "@a@bビアンカ「本人が幸せなら　他人が　\n\tとやかく　言うことはないわね。\n@c0@"
86:
  de: "@aNera@bIch bin am glücklichsten, wenn ich mit meiner Familie zusammen bin. Du nicht auch, %a000090?\n@c0@"
  en: "@aNera@bThe thing that makes me happiest is being with my family. Wouldn't you agree, %a000090?\n@c0@"
  es: "@aNera@bLo que me hace feliz a mí es estar con la famiglia. Estarás de acuerdo conmigo, %a000090...\n@c0@"
  fr: "@aNera@bLa chose qui me rend le plus heureuse, c'est\nd'être avec ma famille. Tu n'es pas d'accord, %a000090ⓡ\n@c0@"
  it: "@aNera@bPer me non c'è nulla di meglio che stare con la mia famiglia, %a000090...\n㈡\nAnche se devo confessare che ti scambierei con uno sfilatino con prosciutto di Cinghialorco... Ih ih ih!\nScherzo! Per te, ne chiederei almeno tre, di sfilatini!\n@c0@"
  ja: "@a@bフローラ「私は　家族みんなでいるときが\n\tいちばん　幸せですわ。\n\tねえ　あなた……。\n@c0@"
87:
  de: "@a%0%a001240@bIch bin glücklich, wenn ich spielen kann! Und besonders, wenn du mit mir spielst, Papa!\n@c0@"
  en: "@a%0%a001240@bI'm happiest when I'm playing! Especially when it's with you, Dad!\n@c0@"
  es: "@a%0%a001240@b¡A mí lo que me hace feliz es jugar! Sobre todo si es contigo, papá.\n@c0@"
  fr: "@a%0%a001240@bMoi, c'est quand je joue que je suis le plus heureuxⓠ Surtout si c'est avec toi, papaⓠ\n@c0@"
  it: "@a%0%a001240@bSe potessi, giocherei tutto il giorno!\nMa non ho mai tempo...\n@c0@"
  ja: "@a@b%a001240「ボクはね　遊んでいるときが\n\tいちばん幸せ！　お父さんと\n\t遊べるときは　最高に　幸せだね！\n@c0@"
88:
  de: "@a%0%a001250@bDieser Mann ist irgendwie unheimlich. Er würde mich bestimmt auffressen, wenn ich ihm zu nah komme!\n@c0@"
  en: "@a%0%a001250@bThat man's a bit scary. I'm sure he'd gobble me up if I got too close!\n@c0@"
  es: "@a%0%a001250@b¡Ese hombre da miedo! ¡Seguro que si me acerco se me zampa!\n@c0@"
  fr: "@a%0%a001250@bCe monsieur me fait un peu peur. Je suis sûre qu'il m'avalerait d'un coup si je m'approchais.\n@c0@"
  it: "@a%0%a001250@bPapà, ho paura che quell'uomo voglia mangiarmi...\nPer favore, digli che non sono uno sfilatino!\n@c0@"
  ja: "@a@b%a001250「あの人　すごいね。\n\t近づいたら　食べられちゃいそう。\n@c0@"
89:
  de: "@aSancho@bFür miss, Glück ist, ist... Das ist schwer zu sagen...\n@c0@"
  en: "@aSancho@bFor me, the happiness, ees, ees, ees, ees...\nEes difficult to esay...\n@c0@"
  es: "@aSancho@bPara mí, la felicidad es...\nEs difícil de explicar...\n@c0@"
  fr: "@aSancho@bPour m-moi, le bonheur, c'est, euh...\r\nC'est pas facile à d-dire...\n@c0@"
  it: "@aSancho@b¿Prosciutto de Cinghialorco?\n¡Oh, no!\n¡Por mi nada es mejor que la paella!\n@c0@"
  ja: "@a@bサンチョ「私の幸せは……\n\tいえ　なんでもありません……。\n@c0@"
90:
  de: "@aOtto@bMich macht es glücklich, wenn ich mir vorstelle, wie respektvoll mich die Leute in Zukunft behandeln werden.\n@c0@"
  en: "@aTuppence@bI'd say I'm at my happiest when I imagine how much more respected I'll be in the future.\n@c0@"
  es: "@aAlazar@bSupongo que soy feliz cuando imagino lo mucho que me respetarán en el futuro.\n@c0@"
  fr: "@aInnocent@bJe pense que je serai vraiment heureux quand, dans quelques années, les gens me respecteront vraiment.\n@c0@"
  it: "@aSimon@bPer me non c'è niente di meglio dello sguardo ammirato di una bella fanciulla...\n@c0@"
  ja: "@a@bピピン「ボクは　将来の自分の\n\tりっぱな姿を　想像してる時が\n\t何より　しあわせですね。\n@c0@"
91:
  de: "@aOtto@bWenn sie sich vor mir verbeugen und mir zu Füßen liegen. ⓞ Ja, Herr Otto! Nein, Herr Otto!ⓟ ... Das wäre fantastisch!\n@c0@"
  en: "@aTuppence@bRoll on the day when people are bowing and scraping at my feet. ⓗYes, Mr Tuppence! No, Mr Tuppence!ⓘ ...That kind of thing.\n@c0@"
  es: "@aAlazar@bLlegará el día en que la gente se inclinará ante mí con reverencias. ⓕ¡Sí, don Alazar! ¡No, don Alazar!ⓖ... y cosas por el estilo.\n@c0@"
  fr: "@aInnocent@bVivement le jour où les gens se prosterneront devant moi et me baiseront les pieds. ⓥOui, Monsieur Innocentⓠ Bien sûr, Monsieurⓠⓦ... Ce genre de choses.\n@c0@"
  it: "@aSimon@bMagari mentre addento uno sfilatino con prosciutto di Cinghialorco e carciofini sott'olio!\r\nAh, quello sarebbe davvero il massimo!\n@c0@"
  ja: "@a@bピピン「ああ！　はやく　みんなから\n\tピピンさま　ピピンさまと\n\tたたえられたい！\n@c0@"
92:
  de: "@aBianca@bWir wissen doch bereits, wo sich das Tor zur Unterwelt befindet, nicht wahr, %a000090? Dann sollten wir uns schnell auf den Weg dorthin machen.\n@c0@"
  en: "@aBianca@bYou already know where the doors to the underworld are, right, %a000090? I suppose we'd better hurry on over there.\n@c0@"
  es: "@aBianca@bTú ya sabes dónde están las puertas del inframundo, ¿eh, %a000090? Pues será mejor nos demos prisa en llegar.\n@c0@"
  fr: "@aBianca@bTu sais déjà où se trouvent les portes du monde souterrain, n'est-ce pas, %a000090ⓡ\nJe pense qu'il faudrait vite y aller.\n@c0@"
  it: "@aBianca@b%0%a000090, tu sai già in quale luogo si trova il varco per il Regno degli Inferi, non è vero?\nCredo che dovremmo sbrigarci ad andare là...\n@c0@"
  ja: "@a@bビアンカ「%a000090は　もう\n\t魔界への扉の場所　わかってるでしょ？\n\tさあ　魔界へ　急がなくちゃね。\n@c0@"
93:
  de: "@aNera@bWas für eine schreckliche Last %a001240 auf seinen jungen Schultern trägt. Wir müssen alles tun, um ihm so gut es geht zu helfen.\n@c0@"
  en: "@aNera@bWhat a terrible burden %a001240 has on his shoulders. We must do all that we can to support him.\n@c0@"
  es: "@aNera@bQué carga tan terribile pesa sobre los hombros de %a001240. Debemos hacer todo lo que podamos para ayudarlo.\n@c0@"
  fr: "@aNera@b%0%a001240 a un tel fardeau sur les épaules... Nous devons faire tout notre possible pour l'aider.\n@c0@"
  it: "@aNera@bSul nostro %a001240 grava una responsabilità grandissima...\nDobbiamo aiutarlo in tutti i modi possibili.\n@c0@"
  ja: "@a@bフローラ「本当に　%a001240は\n\t大変な使命を　負ってしまって……。\n\t私たちも　精いっぱい　支えましょう。\n@c0@"
94:
  de: "@a%0%a001240@bIch werde mein Bestes geben, keine Sorge.\n㈡\nAber wenn wieder Frieden in der Welt herrscht und alles in Ordnung ist, kann ich so viel spielen, wie ich will, nicht wahr?\n@c0@"
  en: "@a%0%a001240@bI'll do my best, don't worry. Then, once the world's\nall peaceful and everything, I can play as much as I like, right?\n@c0@"
  es: "@a%0%a001240@bLo haré lo mejor que pueda, no te preocupes. Y luego, cuando reine la paz en el mundo y todo eso, podré jugar todo lo que quiera, ¿verdad?\n@c0@"
  fr: "@a%0%a001240@bNe t'inquiète pas, je ferai de mon mieux. Une fois la paix revenue, je pourrai jouer autant que je veuxⓠ\n@c0@"
  it: "@a%0%a001240@bFarò del mio meglio per far sì che la pace trionfi!\nPoi tornerò a casa e mi metterò a giocare con i miei amici per sei mesi filati, e guai a chi mi disturberà!\n@c0@"
  ja: "@a@b%a001240「いいんだよ　ボクがんばるから。\n\tそのかわり　世界が平和になったら\n\tいっぱい　いっぱい遊ぼうね！\n@c0@"
95:
  de: "@a%0%a001250@b%0%a001240 tut zwar sein Bestes, aber das alles ist doch sehr schwer für ihn. Der Arme...\n@c0@"
  en: "@a%0%a001250@b%0%a001240's doing his best, but it is really hard on him. It's a bit of a worry.\n@c0@"
  es: "@a%0%a001250@b%0%a001240 lo hará fenomenal, pero es una carga muy pesada. Me preocupa un poco...\n@c0@"
  fr: "@a%0%a001250@b%0%a001240 fait de son mieux, mais c'est une responsabilité lourde à porter. Je m'inquiète un peu.\n@c0@"
  it: "@a%0%a001250@bSono certa che %a001240 ce la sta mettendo tutta per riuscire in quest'incredibile impresa, ma senza l'aiuto di tutti noi non potrà mai farcela...\n@c0@"
  ja: "@a@b%a001250「%a001240　がんばってるよね。\n\tでも　ちょっと　ムリしてるよ。\n\tわたし　心配だな……。\n@c0@"
96:
  de: "@aSancho@bDie Göttin, was hat sie wohl für eine Plan für uns alle? Es ist nisst risstig, dass eine kleine Muchacho solch eine Last tragen muss...\n@c0@"
  en: "@aSancho@bThe Goddess, what plan does eshe have for us all?\nEes no right for one eso young to have esuch weight on hees eshoulders.\n@c0@"
  es: "@aSancho@b¿Qué tendrá planeado la Diosa para nosotros?\nNo es justo que alguien tan chiquito deba llevar tal carga sobre sus hombros.\n@c0@"
  fr: "@aSancho@bJe me d-demande ce que la D-Déesse nous réserve. Ce n'est p-pas juste qu'oun si jeune niño ait oun tel f-fardeau sur les épaules.\n@c0@"
  it: "@aSancho@bNo entiendo por qué la dea misericordiosa ha posto sullas nostras espallas, y su quellas de %a001240 en particular, un peso così gravoso...\n㈡\n¡Però yo so que farò todo quello que puedo por salvar el mundo!\n@c0@"
  ja: "@a@bサンチョ「神さまは　この世界を\n\tどう　なさりたいんでしょう？\n\t人の子に　重荷ばかり背負わせて。\n@c0@"
97:
  de: "@aOtto@bEs ist gewiss eine große Verantwortung, mit etwas derart Wichtigem beauftragt zu sein. Ich bin mir net sicher, ob ich damit zurechtkäm.\n@c0@"
  en: "@aTuppence@bIt's certainly a big responsibility, being trusted with something so important. I'm not sure I'd manage it\r\nif it were me.\n@c0@"
  es: "@aAlazar@bCiertamente es una gran responsabilidad que te confíen una tarea tan importante. Si fuera yo, no creo que lo soportara.\n@c0@"
  fr: "@aInnocent@bC'est une sacrée responsabilité qu'on lui a confiée.\r\nSi j'étais à sa place, je ne suis pas sûr que je serais à la hauteur.\n@c0@"
  it: "@aSimon@bComprendo perfettamente che su di noi grava una responsabilità enorme.\n㈡\nSono onorato di essere stato chiamato a svolgere questa missione, e farò di tutto per portarla a termine! Soldato Simon agli ordini, Maestà!\n@c0@"
  ja: "@a@bピピン「みんなに　たたえられたいけど\n\t実際　そういう使命を負ったら\n\tボク　耐えられないかも知れないなあ。\n@c0@"
98:
  de: "@aBianca@bWenn er so übel ist, wie er klingt, kann ich mir durchaus vorstellen, dass er auch die Kunden abschrecken könnte.\n@c0@"
  en: "@aBianca@bI imagine it'd frighten away the customers too, if it's as bad as it sounds.\n@c0@"
  es: "@aBianca@bSi es tan malo como parece, supongo que también espantará a los clientes...\n@c0@"
  fr: "@aBianca@bJe suppose que ça ferait aussi peur aux clients,\r\nsi c'est aussi mauvais que ça en a l'air.\n@c0@"
  it: "@aBianca@bSe il commento di chi l'ha assaggiato è stato ⓕSbleurghⓖ, non mi stupisco che non se ne trovi più in giro...\n@c0@"
  ja: "@a@bビアンカ「そんな　お酒を出したら\n\tお客さんが　へっちゃうでしょうね。\n@c0@"
99:
  de: "@aBianca@bOffenbar erlauben sich die Leute hier ein kleines Späßchen mit ihrem Sprungsprudel. Wir sagen dazu lieber mal nichts, was?\n@c0@"
  en: "@aBianca@bSeems like the folk here like to have a bit of fun where the old Zoomshine's concerned. Let's just\r\nkeep quiet, eh?\n@c0@"
  es: "@aBianca@bParece que a la gente de por aquí le gusta divertirse con el telelicor ese. Será mejor que no digamos nada, ¿sabes?\n@c0@"
  fr: "@aBianca@bOn dirait que les gens d'ici aiment bien s'amuser\ndès qu'il est question du télétord-boyaux.\nNe faisons pas de commentaires, d'accordⓡ\n@c0@"
  it: "@aBianca@bDelizia di Milleventi... Ⓠ\nChe bevanda misteriosa... Ⓡ\nDa-da-da... Daaa-daaaaah... Ⓡ\n@c0@"
  ja: "@a@bビアンカ「まあ　あのお酒は　この町の人の\n\t楽しみみたいだから　ここは\n\t知らないふりを　しておきましょうよ。\n@c0@"
100:
  de: "@aNera@bWarum sollte der Ort so berühmt dafür sein, wenn er so furchtbar schmeckt?\n@c0@"
  en: "@aNera@bWhy would it be their famous brew if it tastes\r\nso terrible?\n@c0@"
  es: "@aNera@bSi sabe tan male, ¿per qué es su bebida más famosa?\n@c0@"
  fr: "@aNera@bPourquoi leur boisson locale serait aussi célèbre\nsi elle avait aussi mauvais goûtⓡ\n@c0@"
  it: "@aNera@bHo capito, però c'è una cosa che non mi spiego: se questa bevanda è tanto orribile, come ha fatto a diventare tanto famosa in tutto il mondo?\n@c0@"
  ja: "@a@bフローラ「マズイのに　銘酒とは\n\tいったい　どういう品なんでしょう？\n@c0@"
101:
  de: "@aNera@bEr muss nicht gleich übertreiben. Wir wollen ja nicht gerade alle Vorräte der Stadt aufkaufen oder so!\n@c0@"
  en: "@aNera@bThere's no need for him to be quite so vocal.\r\nIt's not like we'd wipe the town out of its supplies\r\nor anything!\n@c0@"
  es: "@aNera@bNo es necesario ponerse così.\r\n¡Tampoco pensábamos acabar con todas sus reservas ni niente parecido!\n@c0@"
  fr: "@aNera@bIl n'a pas besoin d'en faire autant. Ce n'est pas comme si on avait l'intention de vider la ville\nde ses réserves, non plusⓠ\n@c0@"
  it: "@aNera@bPerché non si dà una calmata?\nNon abbiamo nessuna intenzione di prosciugargli le riserve della sua amata bevanda!\n@c0@"
  ja: "@a@bフローラ「あんなに　力説しなくても\n\t私たち　この町のお酒を　根こそぎ\n\t持っていこうなんて　しませんわよね。\n@c0@"
102:
  de: "@a%0%a001240@bDieser alte Mann ist ganz schön starrsinnig, oder? Er will partout nicht, dass wir etwas von dem Sprungsprudel bekommen.\n@c0@"
  en: "@a%0%a001240@bThat old man's pretty determined, isn't he? He really doesn't want us to get hold of any.\n@c0@"
  es: "@a%0%a001240@bEse anciano es muy insistente, ¿no? No quiere que encontremos esa bebida.\n@c0@"
  fr: "@a%0%a001240@bCe vieux monsieur semble vraiment prêt à tout pour nous décourager d'en chercher, heinⓡ\n@c0@"
  it: "@a%0%a001240@bAccidenti, che bel quadro che ci ha dipinto quel signore! È proprio deciso a non farci avere quella bevanda, eh?\n@c0@"
  ja: "@a@b%a001240「あのおじいさん　しんけんだね。\n\t手に入れてほしくないんだね。\n@c0@"
103:
  de: "@aSancho@bMit solch eine Getränk wäre unsere Reise das reinste Kinderspiel, eh, Chico?\n@c0@"
  en: "@aSancho@bWeeth esuch a dreenk, our journey, ees gonna be easy, no?\n@c0@"
  es: "@aSancho@b¡Ándale! Con esa bebida, nuestro viaje será más llevadero, ¿no?\n@c0@"
  fr: "@aSancho@bAvec oune b-boisson comme ça, notre voyage serait plus f-facile, noⓡ\n@c0@"
  it: "@aSancho@bSoy seguro que quella bibita ce sarebbe muy utile nel nuestro viaggio, chico...\r\n¡Y se sposerebbe perfectamentes con la mia paella!\n@c0@"
  ja: "@a@bサンチョ「そんな　お酒があれば\n\t旅も　ラクチンでしょうねえ。\n@c0@"
104:
  de: "@a%0%a001240@bOh! Aber man darf doch gar nicht in Kirchen so herumrennen, oder?\n@c0@"
  en: "@a%0%a001240@bOoh! You're not supposed to run about\nin church, are you?\n@c0@"
  es: "@a%0%a001240@b¡Oooh! ¡Eh!, no está permitido correr por la iglesia. ¿A que no?\n@c0@"
  fr: "@a%0%a001240@bOohⓠ On n'a pas le droit de courir partout dans les églises, pas vraiⓡ\n@c0@"
  it: "@a%0%a001240@bNon si corre in chiesa!\nLa dea non vuole che si faccia confusione in casa sua!\n@c0@"
  ja: "@a@b%a001240「あっ　教会では\n\t走っちゃダメなんだよ　ねっ！\n@c0@"
105:
  de: "@aSancho@bIn diese verrückte Stadt ist es nisst mögliss, draußen herumzulaufen. Das ist zu gefährliss für die Niños.\n@c0@"
  en: "@aSancho@bEen thees loco town, ees no possible to run around outside. Ees too dangerous for the young ones.\n@c0@"
  es: "@aSancho@bEn una ciudad tan retebulliciosa no se podrá correr por la calle. Debe de ser peligroso para los niños.\n@c0@"
  fr: "@aSancho@bD-Dans cette ville, c'est impossible de c-courir dehors. C'est t-trop dangereux pour les enfants..\n@c0@"
  it: "@aSancho@bEn esta città muy estrana, los niños no pueden correre fuori...\n¡Es troppos pericolosos!\n@c0@"
  ja: "@a@bサンチョ「まあ　こんな段差だらけの町じゃ\n\t外では　あぶなくて\n\t走り回れないでしょうね。\n@c0@"
106:
  de: "@a%0%a001240@bDer Junge scheint sich nichts draus zu machen, ausgeschimpft zu werden...\n@c0@"
  en: "@a%0%a001240@bThat kid doesn't seem to care about being told off.\n@c0@"
  es: "@a%0%a001240@bAl chico ese no creo que le importe que le llamen la atención.\n@c0@"
  fr: "@a%0%a001240@bCe garçon a l'air de se moquer complètement de ce que lui dit sa mère.\n@c0@"
  it: "@a%0%a001240@bA quel ragazzino i rimproveri non fanno né caldo né freddo, eh? Dev'essere proprio un bel discolo!\nPerò è simpatico! Eh eh eh eh eh!\n@c0@"
  ja: "@a@b%a001240「あの子　しかられても\n\t平気なのかな？\n@c0@"
107:
  de: "@a%0%a001250@bDer Junge ist doof! Hoffentlich knallt er nicht gegen mich.\n@c0@"
  en: "@a%0%a001250@bThat boy's stupid! I'm worried he's going to\nbang into me.\n@c0@"
  es: "@a%0%a001250@b¡Menudo estúpido, el niño ese! En una de estas me da un golpe.\n@c0@"
  fr: "@a%0%a001250@bCe garçon est idiotⓠ J'ai peur qu'il me rentre dedans.\n@c0@"
  it: "@a%0%a001250@bPapà, ho paura che quel monellaccio sbatta contro di me...\n@c0@"
  ja: "@a@b%a001250「やだ　こわいよう。\n\tあの子　ぶつかってきそう。\n@c0@"
108:
  de: "@aBianca@bIch verstehe ja nicht viel von magischer Forschung, aber es sieht nach einer Menge Arbeit aus.\n@c0@"
  en: "@aBianca@bI dun't know much about magic research, but it looks like it must be hard work.\n@c0@"
  es: "@aBianca@bYo no sé mucho de investigación mágica, pero me da que no es nada fácil, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe n'y connais absolument rien en recherches magiques, mais ça doit être un sacré boulot.\n@c0@"
  it: "@aBianca@bNon ci capisco nulla di studi sulla magia, ma credo che si tratti di un lavoro molto duro...\n@c0@"
  ja: "@a@bビアンカ「魔法の研究って\n\t私には　わからないけど\n\tきっと　大変なんでしょうね。\n@c0@"
109:
  de: "@aNera@bOje, was für ein schlimmer Husten! Wir sollten hin und wieder vorbeischauen und sehen, ob es ihm auch gut geht.\n@c0@"
  en: "@aNera@bOh dear! What an awful cough! We should make\r\nsure we drop in on him from time to time to check\r\nhe's alright.\n@c0@"
  es: "@aNera@b¡Oh, mamma mia! ¡Qué mala pinta tiene esa tos! Deberíamos volver de vez en cuando para ver si sigue bene.\n@c0@"
  fr: "@aNera@bOhⓠ Quelle mauvaise touxⓠ Nous devrions repasser de temps en temps pour voir s'il va bien.\n@c0@"
  it: "@aNera@bSanti numi, che brutta tosse!\nCaro, sarebbe carino se ogni tanto tornassimo a controllare come sta...\n@c0@"
  ja: "@a@bフローラ「まあ　ひどいセキ……。\n\tあなた　これからも　ときどき\n\t様子を見に来ましょう。\n@c0@"
110:
  de: "@a%0%a001240@bRisikooo...\n@c0@"
  en: "@a%0%a001240@bHocus Pocus...\n@c0@"
  es: "@a%0%a001240@bAbracadabra...\n@c0@"
  fr: "@a%0%a001240@bPlouf-plouf...\n@c0@"
  it: "@a%0%a001240@bAbracasualis...\n@c0@"
  ja: "@a@b%a001240「パ　ル　プ　ン……\n@c0@"
111:
  de: "@a%0%a001240@bAllein der Name jagt mir schon einen Schauer über den Rücken. Das muss ein ganz schön mächtiger Zauber sein!\n@c0@"
  en: "@a%0%a001240@bJust the name of it is enough to send tingles down my spine. It must be a pretty powerful spell!\n@c0@"
  es: "@a%0%a001240@bSolo con oírlo se me pone la carne de gallina. ¡Seguro que es un conjuro poderosísimo!\n@c0@"
  fr: "@a%0%a001240@bRien que de le dire, j'en ai la chair de poule.\nÇa doit être un sort très puissant.\n@c0@"
  it: "@a%0%a001240@bAccidenti, che nome minaccioso!\nQuando lo pronuncio mi vengono i brividi sulla punta della lingua!\n@c0@"
  ja: "@a@b%a001240「な　なんだか　この言葉\n\t背中が　ざわざわするよ。\n\tすごい呪文って　ホントなんだ。\n@c0@"
112:
  de: "@aSancho@bEs ist nisst gut, diese alte Señor zu stören ⓚⓛ in seine Zustand! Du musst besser auf die Älteren achtgeben, Chico!\n@c0@"
  en: "@aSancho@bEes no right to make thees old señor esit up\r\neen hees condition! You must be considerate\r\nof the elderly.\n@c0@"
  es: "@aSancho@b¡No deberíamos permitir que este viejito se incorpore en las condiciones en que se encuentra! Hay que ser atento con los mayores, chamaco.\n@c0@"
  fr: "@aSancho@bCe n'est p-pas bien de solliciter ce vieux señor dans son état. Il faut que tu m-montres un peu plus de respect pour les p-personnes âgées.\n@c0@"
  it: "@aSancho@bChico, pienso que esto anziano señor no se sienta muy bien...\nPor favor, cerca de no farlo estancare.\n@c0@"
  ja: "@a@bサンチョ「あんなに　苦しそうなのに\n\t起きあがらせちゃダメですよ！\n\tお年寄りは　いたわらなくちゃ！\n@c0@"
113:
  de: "@aOtto@bRisikooo!\n@c0@"
  en: "@aTuppence@bHocus Pocus!\n@c0@"
  es: "@aAlazar@b¡Abracadabra!\n@c0@"
  fr: "@aInnocent@bPlouf-ploufⓠ\n@c0@"
  it: "@aSimon@bAbracasualis!\n@c0@"
  ja: "@a@bピピン「パルプンテ！\n@c0@"
114:
  de: "@aOtto@bRisikooo! Risikooo!\nRisikooooooooo!\n@c0@"
  en: "@aTuppence@bHocus Pocus! Hocus Pocus!\nHocuuuus Poooocus!\n@c0@"
  es: "@aAlazar@b¡Abracadabra! ¡Abracadabra!\n¡Abracadaaaaabra!\n@c0@"
  fr: "@aInnocent@bPlouf-ploufⓠ Plouf-ploufⓠ Plouuuuf-plouuuufⓠ\n@c0@"
  it: "@aSimon@bAbracasualis! Abracasualis!\n...\nAbracasuaaaliiis!\n@c0@"
  ja: "@a@bピピン「パルプンテ！　パルプンテッ！\n\tパーパパパ　パールプンテッ！！\n@c0@"
115:
  de: "@aOtto@b... Hmpf! Nichts geschieht! Macht der alte Mann sich etwa über uns lustig?!\n@c0@"
  en: "@aTuppence@b...Hmph! Nothing happened!\r\nIs that old man having us on?\n@c0@"
  es: "@aAlazar@b¡Umpf! ¡No pasa nada!\n¿Nos está tomando el pelo el anciano este?\n@c0@"
  fr: "@aInnocent@b... Mmpfⓠ Il ne se passe rienⓠ Ce vieil homme se moque de nousⓡ\n@c0@"
  it: "@aSimon@bMa non succede niente!\nNon è che quel tipo ci sta prendendo in giro?!\n@c0@"
  ja: "@a@bピピン「……あれ？　何も起きないぞ。\n\tあのじいさん　からかってるのか？\n@c0@"
116:
  de: "@aBianca@bWenn wir unsere Mission beendet haben, müssen wir Professor Emsich unbedingt für all die Mühen danken, die er unseretwegen hatte.\n@c0@"
  en: "@aBianca@bWe must do somethin' to repay old Professor\r\nToilen Trubble for all his hard work once\r\neverythin' calms down.\n@c0@"
  es: "@aBianca@bDeberíamos devolverle el favor al profesor Fumata por todo lo que ha hecho por nosotros en cuanto se calme todo, ¿sabes?\n@c0@"
  fr: "@aBianca@bUne fois que le monde sera revenu au calme,\r\nil faudra faire quelque chose pour remercier\r\nle professeur Fumeux de tous ses efforts.\n@c0@"
  it: "@aBianca@bQuando la situazione si sarà finalmente calmata, dovremo trovare il modo di ripagare il Professor Pitagora per tutto ciò che ha fatto per noi.\n@c0@"
  ja: "@a@bビアンカ「いつか　世界が平和になったら\n\tきっと　ベネットさんに　なにか\n\t恩返ししましょうね。\n@c0@"
117:
  de: "@aNera@bIch werde Professor Emsich in meine Gebete einschließen und die Göttin um eine schnelle Genesung bitten.\n@c0@"
  en: "@aNera@bI'll be keeping Professor Toilen Trubble in my\r\nprayers and asking the Goddess to grant him\r\na speedy recovery.\n@c0@"
  es: "@aNera@bIncluiré al professore Fumata en mis plegarias y le pediré a la Diosa que le conceda una pronta recuperación.\n@c0@"
  fr: "@aNera@bLe professeur Fumeux sera dans mes prières.\r\nJe demanderai à la Déesse qu'elle lui accorde\r\nune prompte guérison.\n@c0@"
  it: "@aNera@bPregherò la dea affinché faccia passare la tosse al Professor Pitagora.\n@c0@"
  ja: "@a@bフローラ「私は　ベネットさんの回復を\n\tお祈りいたしますわ。\n@c0@"
118:
  de: "@a%0%a001240@bIst der alte Mann in Ordnung? Er sieht nicht besonders gut aus...\n@c0@"
  en: "@a%0%a001240@bIs that old man alright?\nHe doesn't look very well to me.\n@c0@"
  es: "@a%0%a001240@b¿Está bien ese anciano?\nParece muy enfermo.\n@c0@"
  fr: "@a%0%a001240@bIl va bien, le vieux monsieurⓡ Il n'a pas l'air en grande forme.\n@c0@"
  it: "@a%0%a001240@bMa quel signore sta bene?\nTossisce di continuo!\n@c0@"
  ja: "@a@b%a001240「おじいさん　大丈夫かな？\n\tなんだか　ぐったりしてたよ。\n@c0@"
119:
  de: "@a%0%a001250@bDieser alte Mann ist sehr klug. Man kann die Magie in diesem Haus ja förmlich riechen!\n@c0@"
  en: "@a%0%a001250@bThat old man's really clever. You can almost smell the magic brewing here in his house.\n@c0@"
  es: "@a%0%a001250@b¡Qué inteligente es ese anciano! Casi puedo oler la magia que rezuman las paredes de esta casa.\n@c0@"
  fr: "@a%0%a001250@bCe vieux monsieur est très intelligent. Pour un peu, on sentirait presque la magie à l'œuvre dans sa maison.\n@c0@"
  it: "@a%0%a001250@bIl Professore è molto intelligente.\nNon credo che al mondo ci siano molte persone in grado di recuperare antichi incantesimi come fa lui...\n@c0@"
  ja: "@a@b%a001250「あのおじいさん\n\tとっても　すごい人だよ。\n\tこの家の魔法のにおい　強いもん……。\n@c0@"
120:
  de: "@aOtto@bIch frage mich, wie viel der alte Mann tatsächlich über das Ganze weiß. Irgendwie habe ich da meine Zweifel...\n@c0@"
  en: "@aTuppence@bI wonder how much that old man really knows about all this. I can't help but feel a bit doubtful.\n@c0@"
  es: "@aAlazar@bMe pregunto cuánto sabrá el anciano de todo esto en realidad. No puedo evitar sentir un poco de desconfianza.\n@c0@"
  fr: "@aInnocent@bJe m'interroge sur l'étendue des connaissances de\r\nce vieil homme. Je ne peux pas m'empêcher d'être sceptique. \n@c0@"
  it: "@aSimon@bMa siamo proprio sicuri che questo Professor Pitagora sia davvero uno scienziato in gamba e non un ciarlatano che prende in giro il prossimo?!\n㈡\nIo qualche dubbio ce l'ho...\n@c0@"
  ja: "@a@bピピン「あのじいさん　本当に\n\tどこまで分かっているのか……\n\tあやしいですよ。\n@c0@"
121:
  de: "@aBianca@bOh, ich verstehe! Darum also geht es! Wenn das Zeug so wertvoll ist, dann sollten wir es wohl nicht so einfach wegsüffeln!\n@c0@"
  en: "@aBianca@bOh, I get it! So that's what it's all about. We'd better not go guzzlin' it down if it's that valuable, then!\n@c0@"
  es: "@aBianca@b¡Ah, ya entiendo! Así que eso es lo que pasa. Entonces será mejor que no nos pongamos a tragarlo si cuesta tanto, ¿sabes?\n@c0@"
  fr: "@aBianca@bOh, je comprendsⓠ C'est donc ça. On n'a pas intérêt\nà tout siffler trop vite, si c'est aussi précieuxⓠ\n@c0@"
  it: "@aBianca@bCapperi! Ehm, volevo dire che è proprio un bel regalo! Se questa bottiglia è tanto preziosa, suggerisco di conservarla per un'occasione speciale...\n@c0@"
  ja: "@a@bビアンカ「そういうワケだったのね。\n\tそんな　貴重なお酒なら　飲まずに\n\t大事に持っておきましょう。\n@c0@"
122:
  de: "@aNera@bIch glaube, von diesem Sprungsprudel hat nicht mal Papa gewusst. Wir müssen sorgsam damit umgehen.\n@c0@"
  en: "@aNera@bI don't think even Papa knew about this Zoomshine. We must make sure we look after it carefully.\n@c0@"
  es: "@aNera@bNo creo que il mio papino tuviese ni idea sobre este telelicor. Debemos tener mucho cuidado con él.\n@c0@"
  fr: "@aNera@bJe crois que même papa n'était pas au courant\r\npour ce télétord-boyaux. Nous devons y faire\r\nbien attention.\n@c0@"
  it: "@aNera@bAh-ah!\nAdesso capisco perché gli abitanti della zona parlano male della Delizia di Milleventi!\n@c0@"
  ja: "@a@bフローラ「こんなお酒があったなんて\n\t父も　知らないと思いますわ。\n\t大切に　持っていましょうね。\n@c0@"
123:
  de: "@aSancho@bDeine Onkel Sancho, er hat schon viel getrunken in seine Leben. Aber das noch nie.\n@c0@"
  en: "@aSancho@bYour Uncle Sancho, he has eseen many different espirits een hees time. But thees one, no.\n@c0@"
  es: "@aSancho@bTu tito Sancho ha visto muchos tipos de licor en su vida. Pero ni modo uno como este.\n@c0@"
  fr: "@aSancho@bT-Ton oncle Sancho, il a g-goûté beaucoup de choses dans sa j-jeunesse, mais pas ça.\n@c0@"
  it: "@aSancho@b¡Ay, que bueno!\n¡Lo zio Sancho no vede l'ora de assaggiar esta delicia!\n㈡\nPotrei anche usarla por preparare una nueva ricetta por la mia paella...\n¡Potrei chiamarla ⓕpaella deliciosaⓖ!\n@c0@"
  ja: "@a@bサンチョ「私も　いろんなお酒を見ましたが\n\tこんなお酒を見たのは　初めてですよ。\n@c0@"
124:
  de: "@aBianca@bHuch! Hab ich mir das nur eingebildet oder hat diese Katze gerade wirklich mit uns gesprochen? Vielleicht lernen sie das, wenn sie älter werden.\n@c0@"
  en: "@aBianca@bCrikey! Did I imagine it, or did that cat just talk to us!? Maybe they learn how to do it as they get older.\n@c0@"
  es: "@aBianca@b¡Rayos! ¡¿Son imaginaciones mías, o ese gato acaba de hablarnos?! Puede que aprendan a hacerlo con la edad...\n@c0@"
  fr: "@aBianca@bBon sangⓠ Je rêve ou ce chat vient juste de nous parlerⓡⓐ Peut-être qu'ils finissent par apprendre notre langue en vieillissant.\n@c0@"
  it: "@aBianca@bQuel gatto parla! Ha detto che in quasi tutte le aree del mondo ci sono degli oggetti tipici! Già che c'era poteva anche dire qualcosa di meno scontato, no?!\n@c0@"
  ja: "@a@bビアンカ「うわっ　さっきのネコ\n\tしゃべったわよ。　年とったネコは\n\t話せるって　ホントなのね。\n@c0@"
125:
  de: "@aNera@bUnser Hund Bingo spricht auch manchmal mit mir, wenn wir allein sind, weißt du. He he he!\n@c0@"
  en: "@aNera@bOur dog Bingo chatters away to me sometimes when we're alone, you know. He he he!\n@c0@"
  es: "@aNera@bA veces, il nostro cane, Bingo, charla conmigo cuando estamos solos. ¡Ji, ji, ji!\n@c0@"
  fr: "@aNera@bTu sais, notre chien Bingo me parle aussi parfois, quand nous sommes seuls. Hi hi hiⓠ\n@c0@"
  it: "@aNera@bUn gatto parlante? I gatti di Mostroferrato stanno zitti e muti. Al massimo fanno ⓕmiaoⓖ o ⓕpurrⓖ ogni tanto, ma niente di più...\n@c0@"
  ja: "@a@bフローラ「うちの　リリアンも\n\t私と　ふたりきりの時は　いろいろ\n\t話してくれますのよ。　うふふ。\n@c0@"
126:
  de: "@a%0%a001250@bIch habe ja jetzt schon viele Schleime gesehen, die sprechen können, aber noch nie eine sprechende Katze! Wie süß!\n@c0@"
  en: "@a%0%a001250@bI've seen plenty of slimes now that can speak, but I've never seen a talking cat before! How sweet!\n@c0@"
  es: "@a%0%a001250@b¡He visto un montón de limos que hablaban! ¡Pero un gato nunca! ¡Qué encanto!\n@c0@"
  fr: "@a%0%a001250@bJ'ai vu beaucoup de gluants qui parlaient, mais c'est la première fois que j'entends un chat parler.\nComme c'est mignonⓠ\n@c0@"
  it: "@a%0%a001250@bChe carino quel gatto parlante! Ma dove avrà imparato a esprimersi nella lingua degli uomini?\nForse ha frequentato qualche scuola particolare...?\n@c0@"
  ja: "@a@b%a001250「お話しできるスライムさんは\n\t何度か見たけど　ネコさんは　初めて！\n\tいいなあ　かわいいな～！\n@c0@"
127:
  de: "@aOtto@bAaah! Diese Katze muss besessen sein!\n@c0@"
  en: "@aTuppence@bYikes! That cat must be possessed or something!\n@c0@"
  es: "@aAlazar@b¡Vaya por la Diosa! Ese gato debe de estar poseído o algo así.\n@c0@"
  fr: "@aInnocent@bAaahⓠ Ce chat doit être possédé ou quelque chose du genreⓠ\n@c0@"
  it: "@aSimon@bUn gatto parlante?!\nQuesta è opera del demonio!\n㈡\nNo, ho detto una sciocchezza...\nIl demonio ha senz'altro cose ben peggiori da fare che dare lezioni di lingua ad un micio...\n@c0@"
  ja: "@a@bピピン「ぎゃ～～！\n\t化けネコだ～～～～っ！！\n@c0@"
128:
  de: "@aBianca@bWer im Namen der Göttin denkt sich denn eine Stadt aus, die derart verzwickt ist? Es muss schrecklich sein, hier zu wohnen.\n@c0@"
  en: "@aBianca@bWho in their right mind would plan a town out to\r\nbe this complicated? It must be an impossible place\r\nto live.\n@c0@"
  es: "@aBianca@b¿A qué loco se le ocurriría diseñar una ciudad tan enrevesada? Me vengo a vivir aquí y me da algo, ¿sabes?\n@c0@"
  fr: "@aBianca@bQuel est le malade qui a bien pu imaginer une ville aussi tordueⓡ Ça doit être un calvaire de vivre ici.\n@c0@"
  it: "@aBianca@bMa quale folle architetto avrà mai progettato una città così complicata?!\nVivere qui dev'essere un incubo!\n@c0@"
  ja: "@a@bビアンカ「だれが　町のかたちを\n\tこんなふうにしたのかしら。\n\tここの町で生活するのは　大変よね。\n@c0@"
129:
  de: "@aBianca@bWenn man hier wohnt, kann man es sich nicht leisten, im Alter ein wenig tatterig zu werden...\n@c0@"
  en: "@aBianca@bYou couldn't afford to get a bit doddery on\r\nyour feet in your old age if you lived here,\r\nthat's for sure.\n@c0@"
  es: "@aBianca@bLos ancianos del lugar deben de tener unas piernas tremendas, ¿sabes?\n@c0@"
  fr: "@aBianca@bCe n'est pas un endroit où passer ses vieux jours. La moindre faiblesse dans les jambes ne pardonne pasⓠ\n@c0@"
  it: "@aBianca@bSpostarsi in questo villaggio è tutt'altro che agevole...\nBeh, almeno ci si tiene in forma!\n@c0@"
  ja: "@a@bビアンカ「こんな町で暮らしてたら\n\t年を取っても　足腰の　弱るヒマが\n\tないでしょうね。\n@c0@"
130:
  de: "@aNera@bEs ist wunderbar, sorglos herumspazieren zu können, selbst an einem Ort, der so kompliziert ist wie dieser hier.\n@c0@"
  en: "@aNera@bIt's so nice to be able to walk around freely, even in a place as tricky to navigate as this.\n@c0@"
  es: "@aNera@bVeramente, estoy disfrutando del lugar, a pesar de lo intrincado del camino.\n@c0@"
  fr: "@aNera@bC'est toujours agréable de se promener sans but, même dans une ville aussi compliquée.\n@c0@"
  it: "@aNera@bMi piace camminare in questo posto, anche se è terribilmente facile perdersi...\n@c0@"
  ja: "@a@bフローラ「自由に歩きまわれるって幸せね。\n\tこの町の　歩きにくさも\n\t気にならないほどですわ。\n@c0@"
131:
  de: "@aNera@bWer auch immer diese Stadt erbaut hat, muss ganz schön viel Zeit gehabt haben!\n@c0@"
  en: "@aNera@bThe person who designed the town layout here must have had a whale of a time!\n@c0@"
  es: "@aNera@b¡La persona que diseñó la distribución de la città se lució enormemente!\n@c0@"
  fr: "@aNera@bLa personne qui a conçu les plans de cette ville a dû bien s'amuserⓠ\n@c0@"
  it: "@aNera@bMi piacerebbe proprio dire qualche parolina alla persona che ha progettato questa città con tanta razionalità...\n@c0@"
  ja: "@a@bフローラ「町をこんなふうに\n\tつくった人って　きっと　遊び心が\n\tいっぱい　だったんでしょうね。\n@c0@"
132:
  de: "@a%0%a001240@bDieser Ort ist einfach fantastisch! Ist das eine Straße? Oder eine Wand? Keine Ahnung ⓚⓛ das reinste Labyrinth!\n@c0@"
  en: "@a%0%a001240@bThis place is cool! Is it a path? Is it a wall?\nWho can tell? It's like a maze!\n@c0@"
  es: "@a%0%a001240@b¡Este lugar es genial! ¿Es un camino? ¿O es un muro?\nNo hay forma de saberlo. ¡Menudo laberinto!\n@c0@"
  fr: "@a%0%a001240@bCette ville est génialeⓠ C'est un passageⓡ\nC'est un cul-de-sacⓡ On ne sait pas.\nC'est comme un labyrintheⓠ\n@c0@"
  it: "@a%0%a001240@bQuesto posto è troppo forte!\nSembra di essere in un labirinto!\n@c0@"
  ja: "@a@b%a001240「おっもしろーい！\n\tねえねえ　あれ　道なの？　カベ？\n\t迷路みたいになってるよ。\n@c0@"
133:
  de: "@a%0%a001240@bEs ist schwärzeste Nacht und die Stadt das reinste Labyrinth. Nicht gerade die beste Zeit, um Wunnermühl zu erkunden!\n@c0@"
  en: "@a%0%a001240@bIt's pitch black and the town's made like a maze. Being in Zoomingale is like being in a cave!\n@c0@"
  es: "@a%0%a001240@bEs de noche y la ciudad es como un laberinto. ¡Pasear por Telele es como estar en una cueva!\n@c0@"
  fr: "@a%0%a001240@bIl fait très noir et la ville est un vrai labyrinthe.\nJ'ai presque l'impression d'être dans une grotteⓠ\n@c0@"
  it: "@a%0%a001240@bSecondo me è impossibile non perdersi a Milleventi...\nScommetto che nemmeno cani e piccioni viaggiatori riescono a trovare la strada di casa!\n@c0@"
  ja: "@a@b%a001240「まっくらだし　町中が\n\t迷路みたいだし　ルラフェンって\n\t洞くつの中　みたいだね。\n@c0@"
134:
  de: "@a%0%a001250@bDieser Ort hat etwas Magisches an sich...\n@c0@"
  en: "@a%0%a001250@bThis place has a sort of magical air to it, I think.\n@c0@"
  es: "@a%0%a001250@bEste lugar tiene como un aire mágico.\n@c0@"
  fr: "@a%0%a001250@bJe trouve que cette ville a quelque chose de magique.\n@c0@"
  it: "@a%0%a001250@bCerto che questo villaggio è davvero unico nel suo genere...\n@c0@"
  ja: "@a@b%a001250「この町…\n\t魔法のにおいがするね。\n@c0@"
135:
  de: "@a%0%a001250@bKannst du dich ab und zu mal umsehen und gucken, ob ich noch da bin, Papa? Ich hab Angst, dass ich verloren gehe...\n@c0@"
  en: "@a%0%a001250@bCan you look back once in a while and make sure I'm still with you, Dad? I'm worried I might get lost.\n@c0@"
  es: "@a%0%a001250@bPapi, llévame de la mano. Tengo miedo de perderme.\n@c0@"
  fr: "@a%0%a001250@bTu peux vérifier de temps en temps si je suis encore là, papaⓡ J'ai un peu peur de me perdre.\n@c0@"
  it: "@a%0%a001250@bPapà, posso chiederti un piacere?\nOgni tanto, controlla che non mi sia persa!\n@c0@"
  ja: "@a@b%a001250「お父さん　ときどき\n\tわたしが　ちゃんとついて来てるか\n\t見てね。　迷子になっちゃいそう……。\n@c0@"
136:
  de: "@aSancho@bDiese Ort, er ist einfach loco! Erst du siehst eine Wand, dann es ist eine Weg. Und jetzt ist da eine Weg, aber es ist nur eine Sackgasse!\n@c0@"
  en: "@aSancho@bThees place, ees loco! First you esee a wall, but then ees a path. Now you esee a path, but ees a dead end!\n@c0@"
  es: "@aSancho@b¡Ándale, qué ciudad tan retecomplicada! Lo que parece un muro acaba siendo el camino.\n㈡\n¡Y cuando crees que encuentras el camino terminas en un callejón sin salida, nomás!\n@c0@"
  fr: "@aSancho@bC-Cet endroit est locoⓠ D'abord, tu vois oun mur et c'est oun p-passage. Ensuite, tu vois oun p-passage et c'est oun cul-de-sacⓠ\n@c0@"
  it: "@aSancho@b¡Esto villaggio es totalmentes folle! ¡Es un dedalo de vias, muras, escalas y vicolos ciecos!\n¿Como se fa a capir da que parte se deve andare?\n@c0@"
  ja: "@a@bサンチョ「カベかと思ったら　道で\n\t道かと思えば　いきどまりですよ！\n\tまったく　どうなってるんです！？\n@c0@"
137:
  de: "@aSancho@bWir haben Glück, dass die Schänke so nah ist an die Stadteingang, eh?\n@c0@"
  en: "@aSancho@bEes fortunate that the inn, ees eso close to the town entrance, sí?\n@c0@"
  es: "@aSancho@bÓrale, tenemos suerte de que la posada esté tan cerca de la entrada a la ciudad, ¿no?\n@c0@"
  fr: "@aSancho@bOn a de la chance que l'auberge soit p-près de l'entrée de la v-ville.\n@c0@"
  it: "@aSancho@bPor fortuna la locanda es muy vicina all'ingresso della città...\n@c0@"
  ja: "@a@bサンチョ「でもまあ　宿屋が\n\t町の入り口近くにある\n\tというのだけは　助かりますよ。\n@c0@"
138:
  de: "@aOtto@bKeine Sorge, Eure Majestät. Falls wir uns wirklich verlaufen sollten, können wir immer noch ein Loch in die Wand schlagen...\n@c0@"
  en: "@aTuppence@bThere's no need to worry. If we get really lost,\r\nwe can just knock a hole in the wall and tunnel\r\nour way out.\n@c0@"
  es: "@aAlazar@bNo hay de qué preocuparse. Si no encontramos la salida, siempre podemos derribar los muros para abrirnos paso.\n@c0@"
  fr: "@aInnocent@bNe vous inquiétez pas. Si nous nous perdons, nous pouvons toujours creuser un trou dans le mur pour sortir.\n@c0@"
  it: "@aSimon@bMaestà, non tema!\nQuand'anche dovessimo perderci, ci basterà abbattere qualche muro per ritrovare la strada!\n@c0@"
  ja: "@a@bピピン「大丈夫です。\n\t迷った時は　カベを掘って\n\t穴を開ければ　外に出られます。\n@c0@"
139:
  de: "@aOtto@bDurch das Fenster da scheint Licht, aber es ist schier unmöglich, dorthin zu gelangen! So nah und doch so fern...\n@c0@"
  en: "@aTuppence@bYou can see light coming through the window there, and yet what a pain it is to try and actually get there! So near and yet so far.\n@c0@"
  es: "@aAlazar@b¿Ves la ventana de la que sale la luz? Nadie se imaginaría el fastidio que supone llegar hasta allí. ¡Tan cerca y a la vez tan lejos!\n@c0@"
  fr: "@aInnocent@bOn peut voir de la lumière à travers cette fenêtre et pourtant, c'est presque impossible d'y arriverⓠ Si proche et pourtant si loin.\n@c0@"
  it: "@aSimon@bLì c'è una finestra illuminata. Sembra così vicina, eppure per arrivarci bisogna fare un giro pazzesco... Argh! Che incubo!\n@c0@"
  ja: "@a@bピピン「すぐそこに　窓のあかりが\n\t見えるのに…　まったく\n\tたどり着くのに　ひと苦労ですよ！\n@c0@"
140:
  de: "@aBianca@bDas war mal wieder ein langer Tag, nicht? Vielleicht sollten wir allmählich daran denken, uns aufs Ohr zu legen.\n@c0@"
  en: "@aBianca@bIt's bin another tirin' day, eh? Maybe we should think about gettin' some sleep before long.\n@c0@"
  es: "@aBianca@bUn día menos, ¿eh? Deberíamos pensar en dormir un poco, y pronto, ¿sabes?\n@c0@"
  fr: "@aBianca@bÇa a encore été une rude journée, heinⓡ\nPeut-être qu'on ne devrait pas trop tarder\nà aller dormir un peu.\n@c0@"
  it: "@aBianca@bSono esausta...\nVoglio andare a dormire...\n@c0@"
  ja: "@a@bビアンカ「今日も　いろいろあって\n\tつかれたわね。\n\tそろそろ　やすみましょうか。\n@c0@"
141:
  de: "@aNera@bLass uns Schluss machen für heute und ins Bett gehen. Morgen ist auch noch ein Tag.\n@c0@"
  en: "@aNera@bI think we should call it a day today, and rest now until tomorrow.\n@c0@"
  es: "@aNera@bDeberíamos dar el día por acabado y descansar hasta domani.\n@c0@"
  fr: "@aNera@bJe crois qu'on devrait arrêter pour aujourd'hui et aller se reposer.\n@c0@"
  it: "@aNera@bCaro, perché non andiamo a riposare?\nDomani ci aspetta un'altra giornata molto impegnativa...\n@c0@"
  ja: "@a@bフローラ「今日は　もう　ゆっくりやすんで\n\t明日に　そなえましょう。\n@c0@"
142:
  de: "@aBianca@bEs ist so schön, wenn die Leute glücklich sind, nicht?\n@c0@"
  en: "@aBianca@bIt's nice to see people happy, eh?\n@c0@"
  es: "@aBianca@bQué bien que todos estén contentos, ¿sabes?\n@c0@"
  fr: "@aBianca@bC'est agréable de voir des gens heureux, heinⓡ\n@c0@"
  it: "@aBianca@bL'amore illumina il cuore e fa dimenticare ogni ansia...\r\nAhhh! Io ne so qualcosa...\n@c0@"
  ja: "@a@bビアンカ「幸せそうで　なによりね。\n@c0@"
143:
  de: "@aNera@bJa, Liebe ist etwas Wunderbares! Meine Gefühle für dich sind einfach unbeschreiblich! ... Na ja, meine Worte reichen nicht aus, um sie zu beschreiben...\n@c0@"
  en: "@aNera@bIf anything's love, this is! My feelings for you are second to none! ...Um, or words to that effect.\n@c0@"
  es: "@aNera@b¡Si el amore existe, questo debe serlo! ¡No hay nada comparable a lo que siento per te!... Mmm, no sé si eso expresa bien mis sentimientos.\n@c0@"
  fr: "@aNera@bSi ce n'est pas de l'amour, je ne sais pas ce que c'estⓠ Mais mes sentiments pour toi sont sans égalⓠ\n... Hum, bref.\n@c0@"
  it: "@aNera@bAh, l'amore...\nCosa sarebbe l'essere umano senza amore?\nCosa sarei io senza di te, %a000090?\n@c0@"
  ja: "@a@bフローラ「私だって！\n\tあの方に　負けないくらい\n\tあなたを愛していますわ。　ぽっ……。\n@c0@"
144:
  de: "@a%0%a001240@bMacht dir momentan etwas Sorgen, Papa? Oder ist alles in Ordnung? Schließlich bin ich ja bei dir...\n@c0@"
  en: "@a%0%a001240@bIs anything bothering you at the moment, Dad?\nOr is everything okay because I'm with you?\n@c0@"
  es: "@a%0%a001240@bPapá, ¿estás preocupado por algo?\n¿O todo va bien porque estoy contigo?\n@c0@"
  fr: "@a%0%a001240@bEst-ce que quelque chose te cause du souci,\nen ce moment, papaⓡ Ou est-ce que tout va\nbien parce que je suis làⓡ\n@c0@"
  it: "@a%0%a001240@bPapà, se l'amore tiene lontane le preoccupazioni, anch'io mi voglio innamorare!\nMi spieghi come si fa?\n@c0@"
  ja: "@a@b%a001240「ねえ　お父さんは\n\t今　イヤな事ある？\n\tボクが　ついてるから　平気？\n@c0@"
145:
  de: "@aSancho@bChico, wir müssen jetzt gehen! Wir wollen doch niemanden stören, eh?\n@c0@"
  en: "@aSancho@bOkay, friend, ees time to go!\nWe no want to get een the way, uh?\n@c0@"
  es: "@aSancho@b¡Híjole, chamaco! ¡Vámonos de aquí!\nNo nos entrometamos, ¿eh?\n@c0@"
  fr: "@aSancho@bChico, il est t-temps de s'éclipser. On ne va p-pas les déranger plus longtemps.\n@c0@"
  it: "@aSancho@bVamonos, chico.\nAbbiamo muchas cosas da fare.\n@c0@"
  ja: "@a@bサンチョ「さあ　さあ！\n\tおジャマしちゃいけません。\n\t行きますよっ！\n@c0@"
146:
  de: "@aOtto@bEs sieht net grad so aus, als würde diese Liebe auf Gegenseitigkeit beruhen... Na ja, das ist ja dann wohl sein Problem.\n@c0@"
  en: "@aTuppence@bIt doesn't look like the feeling's mutual, I have to say! Still, that's his problem, I suppose.\n@c0@"
  es: "@aAlazar@b¡Dudo que el sentimiento sea mutuo! Aunque, claro, ese es su problema, no el mío.\n@c0@"
  fr: "@aInnocent@bJe ne suis pas sûr que ce sentiment soit partagé. Ceci dit, c'est son problème.\n@c0@"
  it: "@aSimon@bSe l'amore è ricambiato, non esiste sentimento più bello! Ma se non lo è, il cuore si gonfia di tristezza, e la vita si trascina lenta e pesante...\n@c0@"
  ja: "@a@bピピン「彼女のほうは　男を\n\t愛してないように見えるけど……\n\tまっ　いいか！　人のことだしっ！\n@c0@"
147:
  de: "@aBianca@bWie lange irrt denn dieser Soldat schon hier herum?!\n@c0@"
  en: "@aBianca@bJust how long has that soldier bin lost!?\n@c0@"
  es: "@aBianca@b¡Pero ¿cuánto hace que está perdido ese soldado?!\n@c0@"
  fr: "@aBianca@bDepuis combien de temps ce soldat est-il perduⓡ\n@c0@"
  it: "@aBianca@bEh?!\nAncora non ha scoperto dove andare per andare dove deve andare?!\n@c0@"
  ja: "@a@bビアンカ「あの戦士さん　いったい\n\tいつから　迷っているのかしら……。\n@c0@"
148:
  de: "@aNera@bDie Pfade können noch so kompliziert und verschlungen sein... Wenn ich mit dir zusammen bin, macht mir das gar nichts aus!\n@c0@"
  en: "@aNera@bI don't mind travelling even the most complicated and frustrating of roads as long as I'm with you.\n@c0@"
  es: "@aNera@bNo me importa viajar por los senderos más espinosos y azarosos porque sé que te tengo al mio lado.\n@c0@"
  fr: "@aNera@bCela ne me dérange pas de suivre les chemins les plus tortueux tant que je suis avec toi.\n@c0@"
  it: "@aNera@bTesoro mio, non importa se il nostro viaggio ci conduce lungo strade intricate e faticose...\r\nVerrò con te ovunque tu vada.\n@c0@"
  ja: "@a@bフローラ「あなたと　歩けるなら\n\tどんなに　ふくざつな道でも\n\t私は　楽しいですわ。\n@c0@"
149:
  de: "@a%0%a001250@bHa ha! Wie lustig, dass Erwachsene sich auch verlaufen können!\n@c0@"
  en: "@a%0%a001250@bHe he he! It's funny to see that an adult\ncan get lost too!\n@c0@"
  es: "@a%0%a001250@b¡Ji, ji, ji! ¡Ni los adultos se salvan de perderse en esta ciudad!\n@c0@"
  fr: "@a%0%a001250@bHé hé héⓠ C'est drôle de voir qu'un adulte peut se perdre aussiⓠ\n@c0@"
  it: "@a%0%a001250@bIh ih ih!\nÈ sempre divertente vedere qualcuno che si perde per strada! A patto che quel qualcuno non sia io, eh!\n@c0@"
  ja: "@a@b%a001250「うふふっ。\n\tおとなの人なのに　迷ってるの。\n\tおもしろーい。\n@c0@"
150:
  de: "@aOtto@bDie Rüstung dieses Mannes ist ganz schön rostig. Und seine Gesichtsbehaarung hat er auch nicht mehr unter Kontrolle.\n@c0@"
  en: "@aTuppence@bThat man's armour is fairly rusty. And his facial hair is totally out of control.\n@c0@"
  es: "@aAlazar@bEse hombre tiene la armadura bastante oxidada. Y barba.\n@c0@"
  fr: "@aInnocent@bL'armure de cet homme est pas mal rouillée et son visage est mangé par la barbe.\n@c0@"
  it: "@aSimon@bQuell'uomo aveva l'armatura arrugginita e la barba lunga...\n@c0@"
  ja: "@a@bピピン「あの人の　よろい…\n\tかなり　サビついてましたよ。\n\tそれにヒゲも　伸び放題で。\n@c0@"
151:
  de: "@aOtto@bJa, ich würde sagen, dass er seit mindestens fünf Jahren durch die Gegend irrt!\n@c0@"
  en: "@aTuppence@bYep, I'd say he must've been wandering about lost for at least five years now!\n@c0@"
  es: "@aAlazar@b¡Sí, yo diría que ese tipo lleva unos cinco años perdido!\n@c0@"
  fr: "@aInnocent@bÀ vue de nez, je dirais que ça fait bien cinq ans\nqu'il est perduⓠ\n@c0@"
  it: "@aSimon@bA occhio e croce, si sarà perso almeno cinque o sei anni fa. Se stava andando a un appuntamento, temo che l'abbia perso...\n@c0@"
  ja: "@a@bピピン「…ということは　\n\tやつは　少なくとも５年は\n\t迷い続けてますねっ。\n@c0@"
152:
  de: "@aBianca@bNa, so gemütlich ist das Kissen nun auch wieder nicht. Aber im Vergleich zu einem Heuballen...\n@c0@"
  en: "@aBianca@bIt dun't look all that fancy to me. Still, I suppose anythin's fancy after a hay bale, eh?\n@c0@"
  es: "@aBianca@bPues a mí me parece bastante más cómoda que un montón de paja, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe ne vois pas ce qui ne va pas avec cet oreiller.\r\nEn même temps, tout doit paraître bizarre comparé\r\nà une botte de paille.\n@c0@"
  it: "@aBianca@bUn cuscino con dentro paglia e pulci?!\nBleah!\nPreferisco l'insonnia!\n@c0@"
  ja: "@a@bビアンカ「宿屋のマクラって\n\t低めにしてあるはずなんだけど……。\n\tあの人　どんなので寝てるのかしら。\n@c0@"
153:
  de: "@aNera@bDamit habe ich keine Probleme. Ich kann überall schlafen, egal worauf ich liege!\n@c0@"
  en: "@aNera@bI don't have that problem. I can get to sleep in\r\nan instant, no matter what kind of pillow I lay\r\nmy head on!\n@c0@"
  es: "@aNera@bYo no tengo questo problema. Yo caigo dormida al instante, sin importar el tipo de almohada.\n@c0@"
  fr: "@aNera@bMoi, je n'ai pas ce problème. Je m'endors en un rien\nde temps, quel que soit l'oreiller sur lequel je pose\nma têteⓠ\n@c0@"
  it: "@aNera@bAll'abbazia ho imparato ad apprezzare anche le cose più umili, come i cuscini con l'imbottitura in paglia... Però le pulci no, eh! Il cuscino lo voglio pulito!\n@c0@"
  ja: "@a@bフローラ「まあ！\n\t私なら　どんなマクラでも\n\tあっという間に　ぐっすりですわ。\n@c0@"
154:
  de: "@a%0%a001240@bGroße, weiche Kissen sind die besten! Aber jedes Kissen ist wohl besser als ein Heuballen...\n@c0@"
  en: "@a%0%a001240@bBig, fluffy pillows are the best in my opinion.\nBut any pillow's better than a hay bale!\n@c0@"
  es: "@a%0%a001240@bMis almohadas preferidas son las grandes y blanditas.\n¡Pero cualquier cosa antes que un montón de paja!\n@c0@"
  fr: "@a%0%a001240@bMoi, je préfère les gros oreillers bien moelleux,\nmais n'importe quel oreiller ferait l'affaire par rapport à une botte de pailleⓠ\n@c0@"
  it: "@a%0%a001240@bIo preferisco i cuscini morbidi, comodi e profumati.\nQuelli con la paglia dentro mi pizzicano le guance e non mi fanno dormire bene...\n@c0@"
  ja: "@a@b%a001240「高い　マクラって\n\tおもしろいよね。\n\tボク　どんなマクラも好きだよ！\n@c0@"
155:
  de: "@aBianca@bEr scheint nicht besonders gut zu schlafen.\n@c0@"
  en: "@aBianca@bDun't look like he's enjoyin' his sleep much there.\n@c0@"
  es: "@aBianca@bNo parece que esté demasiado a gusto aquí, ¿sabes?\n@c0@"
  fr: "@aBianca@bIl n'a pas l'air d'apprécier sa nuit ici.\n@c0@"
  it: "@aBianca@bQuasi quasi un pisolino me lo farei anch'io...\n@c0@"
  ja: "@a@bビアンカ「う～ん…\n\t気持ちよく　寝てないみたいね。\n@c0@"
156:
  de: "@a%0%a001250@bSieht aus, als hätte er einen Alptraum. Der arme Mann...\n@c0@"
  en: "@a%0%a001250@bHe looks like he's having a nightmare, poor man.\n@c0@"
  es: "@a%0%a001250@bParece que el pobre tiene pesadillas.\n@c0@"
  fr: "@a%0%a001250@bLe pauvre, on dirait qu'il fait un cauchemar.\n@c0@"
  it: "@a%0%a001250@bQuando vedo una persona che dorme, mi chiedo sempre cosa stia sognando...\n@c0@"
  ja: "@a@b%a001250「うなされてるの\n\tかわいそうね。\n@c0@"
157:
  de: "@aBianca@bEs gibt sicher nicht viele Orte, wo man einen derart derangierten Priester sehen kann, was?\n@c0@"
  en: "@aBianca@bI doubt there's many a place you'd see a priest worse for wear like that, eh?\n@c0@"
  es: "@aBianca@bNo debe de ser muy común ver a un sacerdote así de perjudicado, ¿eh?\n@c0@"
  fr: "@aBianca@bJe ne crois pas qu'il y a beaucoup d'endroits\noù l'on peut voir un prêtre dans cet état, heinⓡ\n@c0@"
  it: "@aBianca@bNumi del cielo! Non avevo mai visto un sacerdote ridursi in quello stato!\nCosa penseranno di lui i suoi parrocchiani, eh?\n@c0@"
  ja: "@a@bビアンカ「あんなに　よっぱらった\n\t神父さまを　見られるのは\n\tここだけでしょうね……。\n@c0@"
158:
  de: "@aNera@bOh weh. Wie kann ein Priester in einer solchen Gemütsverfassung den Leuten noch Halt geben?\n@c0@"
  en: "@aNera@bOh dear. How can a priest possibly give guidance to people when he feels like that?\n@c0@"
  es: "@aNera@b¡Oh, cielos! ¿Come puede un sacerdote guiar a nadie en ese estado?\n@c0@"
  fr: "@aNera@bSeigneur. Comment un prêtre peut-il être un guide pour les autres s'il se sent aussi malⓡ\n@c0@"
  it: "@aNera@bÈ triste vedere un sacerdote che ha perso la fiducia nella nostra amata dea...\n@c0@"
  ja: "@a@bフローラ「神父さまが　あんなことを\n\tおっしゃっては　まよえる者を\n\tみちびけませんわ……。\n@c0@"
159:
  de: "@a%0%a001240@bWenn er doch so denkt, verstehe ich nicht, warum er den ganzen Tag noch betet...\n@c0@"
  en: "@a%0%a001240@bIf he feels that way, then why does he spend his days praying? I don't get it!\n@c0@"
  es: "@a%0%a001240@bSi tan mal está, ¿por qué se pasa todo el día rezando? ¡No lo entiendo!\n@c0@"
  fr: "@a%0%a001240@bSi c'est ce qu'il pense, pourquoi il ne passe pas ses journées à prierⓡ Je ne comprends pasⓠ\n@c0@"
  it: "@a%0%a001240@bMa i sacerdoti non dovrebbero avere fede nella dea in qualsiasi circostanza? Quello non sarà mica un impostore travestito da prete?!\n@c0@"
  ja: "@a@b%a001240「あんなこと　言ってても\n\tあの神父さん　昼間は\n\tお祈りしてるよね？　どうしてだろ？\n@c0@"
160:
  de: "@aSancho@bDiese Padre tut mir leid. Es ist schlimm, wenn man ist ganz alleine...\n@c0@"
  en: "@aSancho@bI, I feel esorry for thees poor padre.\nEet hurts when you feel all alone...\n@c0@"
  es: "@aSancho@bEste señor me da mucha pena.\nDebe de sentirse muy solo...\n@c0@"
  fr: "@aSancho@bJ-Je suis désolé pour ce pauvre p-padre.\r\nC'est d-dur de se sentir seul...\n@c0@"
  it: "@aSancho@bMe espiace mucho por quel sacerdote, ma no credo que comportarse così lo aiuterà a retrovare fede nella dea y fiducia nel futuros...\n@c0@"
  ja: "@a@bサンチョ「……私も　気持ちは\n\tわからないでもないですね。\n\tはぁ……。\n@c0@"
161:
  de: "@aBianca@bEs muss ganz schön anstrengend sein, sich um einen Betrunkenen zu kümmern.\n@c0@"
  en: "@aBianca@bIt must be hard work tryin' to look after a drunk.\n@c0@"
  es: "@aBianca@bCuidar de un borracho tiene que ser muy sacrificado, ¿sabes?\n@c0@"
  fr: "@aBianca@bÇa ne doit pas être facile de veiller sur un\r\nhomme ivre.\n@c0@"
  it: "@aBianca@bPreferirei scomparire sotto terra piuttosto che ridurmi in quello stato...\n@c0@"
  ja: "@a@bビアンカ「酔っぱらい相手の仕事って\n\t大変よね。\n@c0@"
162:
  de: "@a%0%a001240@bIch find's klasse, dass du uns mit in die Schänke nimmst.\n@c0@"
  en: "@a%0%a001240@bIt's funny how you don't mind us coming in here.\n@c0@"
  es: "@a%0%a001240@bMe sorprende que no te importe que entremos aquí.\n@c0@"
  fr: "@a%0%a001240@bC'est drôle que tu nous emmènes dans des endroits comme ça.\n@c0@"
  it: "@a%0%a001240@bSai, papà?\nSono contento che mi hai portato qui dentro con te.\n@c0@"
  ja: "@a@b%a001240「お父さんは\n\tなにも　言わないんだね。\n@c0@"
163:
  de: "@a%0%a001240@bAls wir mit Sancho unterwegs waren, durften wir nie in die Schänke. Er meinte, das sei nichts für Kinder.\n@c0@"
  en: "@a%0%a001240@bSancho would never let us into pubs when\nwe were travelling just with him. He said\nthey weren't for children.\n@c0@"
  es: "@a%0%a001240@bSancho no nos dejaba entrar a las tabernas cuando viajábamos solo con él. Decía que no eran lugar para niños.\n@c0@"
  fr: "@a%0%a001240@bJamais Sancho ne nous aurait laissés entrer dans une taverne quand on voyageait juste avec lui.\nIl disait que ce n'était pas un lieu pour les enfants.\n@c0@"
  it: "@a%0%a001240@bQuando viaggiavamo con lo zio Sancho, non ci ha mai lasciati entrare in una taverna.\nDiceva che non sono luoghi adatti ai bambini.\n@c0@"
  ja: "@a@b%a001240「サンチョは　酒場は\n\t子供の出入りする場所じゃないって\n\t絶対　つれてきてくれなかったよ。\n@c0@"
164:
  de: "@aOtto@bAch, ich hätte auch nichts dagegen, wenn sich diese Dame ein wenig um mich kümmern würd'!\n@c0@"
  en: "@aTuppence@bI wouldn't mind a bit of TLC from that dancing girl myself, you know!\n@c0@"
  es: "@aAlazar@bPobre bailarina. ¡Yo la ayudaría a pasar el mal rato, ya me entendéis!\n@c0@"
  fr: "@aInnocent@bJe ne dirais pas non si cette danseuse voulait bien veiller sur moi aussiⓠ\n@c0@"
  it: "@aSimon@bSono perso nei miei pensieri, Maestà...\nMi chiedo se e quando riuscirò a trovare la donna della mia vita...\n@c0@"
  ja: "@a@bピピン「ボクも　めいっぱい　あれて\n\tあのお姉さんの関心を　クギづけにっ！\n@c0@"
165:
  de: "@aBianca@bDas ist kein Gerücht. Wir wissen, dass es wahr ist, nicht?\n@c0@"
  en: "@aBianca@bThat en't no rumour. We know it's the truth, eh?\n@c0@"
  es: "@aBianca@b¡Eso no es ningún rumor! Nosotros sabemos que así es, ¿eh?\n@c0@"
  fr: "@aBianca@bCe n'est pas une rumeur. Nous savons que c'est la vérité, n'est-ce pasⓡ\n@c0@"
  it: "@aBianca@bSì, è vero: molta gente fu costretta in schiavitù per edificare Rettilopolis.\nTu lo sai bene, amore mio... \n@c0@"
  ja: "@a@bビアンカ「あれは　ウワサじゃなくて\n\t本当にあったことなのよね……。\n@c0@"
166:
  de: "@aNera@bAlles in Ordnung, Liebling? Du siehst ein wenig mitgenommen aus.\n@c0@"
  en: "@aNera@bAre you alright, darling? You look a bit troubled.\n@c0@"
  es: "@aNera@b¿Estás bien, caro? Pareces preocupado.\n@c0@"
  fr: "@aNera@bÇa va, chériⓡ Tu as l'air troublé.\n@c0@"
  it: "@aNera@bNon pensarci, tesoro.\nQuell'orribile esperienza è passata...\n@c0@"
  ja: "@a@bフローラ「あなた　大丈夫？\n\tすこし　つらそうですわ……。\n@c0@"
167:
  de: "@a%0%a001240@bWas ist los, Papa? Du bist ganz grün im Gesicht.\n@c0@"
  en: "@a%0%a001240@bWhat's wrong, Dad? You've gone a bit green.\n@c0@"
  es: "@a%0%a001240@b¿Qué ocurre, papá? No tienes buena cara.\n@c0@"
  fr: "@a%0%a001240@bQu'est-ce qu'il y a, papaⓡ\nTu es tout pâle tout à coup.\n@c0@"
  it: "@a%0%a001240@bChe ti succede, papà?\nSei impallidito...\n@c0@"
  ja: "@a@b%a001240「お父さん　どうしたの？\n\t顔が　青いみたいだけど……。\n@c0@"
168:
  de: "@a%0%a001250@bSklaverei ist etwas Schreckliches! Jeder, der andere zwingt, etwas gegen ihren Willen zu tun, ist böse und gemein!\n@c0@"
  en: "@a%0%a001250@bI hate the idea of slavery! Anyone who turns people into slaves must be really, really wicked!\n@c0@"
  es: "@a%0%a001250@b¡Me repugna eso de la esclavitud! ¡Alguien capaz de esclavizar a la gente tiene que ser muy, muy malo!\n@c0@"
  fr: "@a%0%a001250@bL'esclavage me répugneⓠ Celui qui réduit quelqu'un d'autre en esclavage doit être vraiment méchantⓠ\n@c0@"
  it: "@a%0%a001250@bLa schiavitù è una cosa orribile!\nSolo una creatura senza cuore può ridurre in catene altri esseri viventi per i propri scopi!\n@c0@"
  ja: "@a@b%a001250「ドレイって　イヤな言葉！\n\tドレイさんなんて人\n\tつくったら　ダメなの。\n@c0@"
169:
  de: "@a%0%a001240@bIch wusste gar nicht, dass man in Schänken schlafen darf. Das muss ich mir merken!\n@c0@"
  en: "@a%0%a001240@bI didn't realise you were allowed to sleep over in pubs too. I'll have to remember that!\n@c0@"
  es: "@a%0%a001240@bNo sabía que también se pudiera dormir en las tabernas. Lo tendré presente.\n@c0@"
  fr: "@a%0%a001240@bJe ne savais pas qu'on pouvait aussi dormir dans les tavernes. Il faudra que je m'en souvienneⓠ\n@c0@"
  it: "@a%0%a001240@bNon sapevo che nelle taverne si potesse anche dormire!\nLa prossima volta che non troveremo posto in una locanda, sapremo dove andare per riposare un po'...\n@c0@"
  ja: "@a@b%a001240「酒場って　寝ても\n\tいい場所なんだね。\n\tおぼえとこっと！\n@c0@"
170:
  de: "@a%0%a001250@bIgitt! Der stinkt nach Alkohol!\n@c0@"
  en: "@a%0%a001250@bUrgh! He smells of drink!\n@c0@"
  es: "@a%0%a001250@b¡Agh! Qué peste a alcohol.\n@c0@"
  fr: "@a%0%a001250@bBeurkⓠ Il sent l'alcoolⓠ\n@c0@"
  it: "@a%0%a001250@bBleargh!\nChe alito fetido!\n@c0@"
  ja: "@a@b%a001250「いや～ん！\n\tお酒くさ～い！\n@c0@"
171:
  de: "@a%0%a001240@bWenn diese Legende so alt ist, muss es den Turm ja auch schon lange Zeit geben. Wann er wohl erbaut wurde...\n@c0@"
  en: "@a%0%a001240@bIf it's an ancient legend, then the tower must've been around a long time. I wonder when it was built.\n@c0@"
  es: "@a%0%a001240@bSi es una antigua leyenda, entonces la torre debieron de construirla hace mucho tiempo. Pero, ¿cuándo?\n@c0@"
  fr: "@a%0%a001240@bSi c'est une ancienne légende, la tour doit exister depuis très longtemps. Je me demande quand elle\na été construite.\n@c0@"
  it: "@a%0%a001240@bSe la leggenda è antica, chissà quanto è vecchia quella torre...\n@c0@"
  ja: "@a@b%a001240「伝説っていうことは\n\tずっと　昔からあるってことだよね。\n\tいったい　いつ建てられたんだろう。\n@c0@"
172:
  de: "@a%0%a001240@bDer Mann arbeitet hier, aber sein Gesicht war ganz rot.\n@c0@"
  en: "@a%0%a001240@bThat man works here, but his face was all red.\n@c0@"
  es: "@a%0%a001240@bEse hombre trabaja aquí, pero tiene la cara roja.\n@c0@"
  fr: "@a%0%a001240@bCet homme est là pour travailler, mais il a le visage tout rouge.\n@c0@"
  it: "@a%0%a001240@bQuel signore mi è simpatico!\nHa detto che preferisce credere nell'Eroe Leggendario piuttosto che nella Setta di Zugzwang!\n@c0@"
  ja: "@a@b%a001240「今の人　お店の人なのに\n\t顔が　真っ赤だったよ。\n@c0@"
173:
  de: "@a%0%a001240@bHeißt das, dass man auch trinken muss, wenn man hinter der Theke steht?\n@c0@"
  en: "@a%0%a001240@bDoes that mean people who work behind bars have to drink just like their customers?\n@c0@"
  es: "@a%0%a001240@b¿Significa eso que los taberneros tienen que beber como sus clientes?\n@c0@"
  fr: "@a%0%a001240@bÇa veut dire que les gens qui travaillent dans\nles tavernes doivent boire comme les clientsⓡ\n@c0@"
  it: "@a%0%a001240@bSi vede che è una persona intelligente...\n@c0@"
  ja: "@a@b%a001240「お店の人が\n\tいっしょに　お酒飲んでも\n\tいいのかなあ。\n@c0@"
174:
  de: "@aSancho@bMmm... Das riesst gut... Was das wohl ist...\n@c0@"
  en: "@aSancho@bMmm... Esuch a sweet esmell...\nI wonder what kind of espirit thees ees...\n@c0@"
  es: "@aSancho@bMmm... Qué aroma tan dulce...\n¡Ándale! ¿Qué tipo de bebida será?\n@c0@"
  fr: "@aSancho@bMmm... Ça sent b-bon... Je me d-demande de quelle boisson il peut s'agir.\n@c0@"
  it: "@aSancho@bChico, no me recuerdo que cosa dobbiamo fare ahora...\n@c0@"
  ja: "@a@bサンチョ「う～ん…　さっきから\n\tどうも　かぐわしいカオリが……。\n\tいったい　どのお酒のにおいでしょう？\n@c0@"
175:
  de: "@a%0%a001250@bBesonders begabt scheint er mir nicht zu sein... Oder sollte ich so was nicht sagen?\n@c0@"
  en: "@a%0%a001250@bHe doesn't seem to be all that good...\nOr should I not say that?\n@c0@"
  es: "@a%0%a001250@bTampoco es que lo haga tan bien...\n¿O debería callarme la opinión?\n@c0@"
  fr: "@a%0%a001250@bIl n'a pas l'air très doué... Oh, peut-être que ce genre de chose ne se dit pasⓡ\n@c0@"
  it: "@a%0%a001250@bNon mi pare che abbia una gran voce...\n@c0@"
  ja: "@a@b%a001250「あのおじさん\n\tヘタクソ……　だよね？\n@c0@"
176:
  de: "@aOtto@bHmm, das scheint mir net gerade das passendste Lied für eine Schänke zu sein...\n@c0@"
  en: "@aTuppence@bHmm, it doesn't seem like the most appropriate song for a pub, does it?\n@c0@"
  es: "@aAlazar@bMmm... No parece la canción más apropiada para una taberna, ¿no creéis?\n@c0@"
  fr: "@aInnocent@bMmm, ça n'a pas l'air d'être la chanson idéale pour une taverne.\n@c0@"
  it: "@aSimon@bChissà che canzoni ha quel tipo nel suo repertorio...\n@c0@"
  ja: "@a@bピピン「なんだか　酒場には\n\t不似合いな音楽を　聞いたような……。\n@c0@"
177:
  de: "@aBianca@bBei dem schrecklichen Lärm von nebenan könnte ich auch nicht schlafen! Und die Schänke unten ist auch nicht gerade leise.\n@c0@"
  en: "@aBianca@bI can see why she can't sleep with that awful\r\nnoise comin' from next door! The pub downstairs\r\nen't quiet neither.\n@c0@"
  es: "@aBianca@b¡No me extraña que no pueda dormir con tanto jaleo aquí al lado! Y la taberna de abajo, tampoco se puede decir que sea tranquila, ¿sabes?\n@c0@"
  fr: "@aBianca@bPas étonnant qu'elle n'arrive pas à fermer l'œil avec le bruit qu'il y a à côtéⓠ Et puis la taverne, en bas, n'est pas franchement calme non plus.\n@c0@"
  it: "@aBianca@bCi credo che non riesce a dormire! Dalla stanza accanto proviene un rumore fastidiosissimo, e la taverna di sotto non è certo il posto più silenzioso del mondo!\n@c0@"
  ja: "@a@bビアンカ「これじゃあ　ねられないわ。\n\tとなりの部屋からは　いやな音……\n\t下の酒場も　にぎやかだもんね。\n@c0@"
178:
  de: "@aNera@bDie arme Frau. Nichts zermürbt einen mehr, als wenn man nicht einschlafen kann.\n@c0@"
  en: "@aNera@bThat poor woman. There's nothing more frustrating than not being able to get to sleep.\n@c0@"
  es: "@aNera@bPobre mujer. No hay nada più agotador que no poder conciliar el sueño.\n@c0@"
  fr: "@aNera@bPauvre femme. Il n'y a rien de plus énervant que de ne pas arriver à fermer l'œil.\n@c0@"
  it: "@aNera@bAh, è orribile non riuscire a dormire quando se ne avrebbe voglia.\nPoveretta, mi spiace tanto per lei...\n@c0@"
  ja: "@a@bフローラ「まあ　お気のどくに……。\n\t眠れないって　本当に\n\tつらいことですものね。\n@c0@"
179:
  de: "@a%0%a001240@bIch kann immer schlafen, egal wie laut es ist!\n@c0@"
  en: "@a%0%a001240@bI can sleep through anything, no matter how noisy!\n@c0@"
  es: "@a%0%a001240@bYo puedo dormir en cualquier lugar. ¡El ruido no me afecta!\n@c0@"
  fr: "@a%0%a001240@bMoi, je peux dormir n'importe où, même s'il y a\ndu bruitⓠ\n@c0@"
  it: "@a%0%a001240@bIo riesco a dormire anche se intorno a me c'è confusione...\n@c0@"
  ja: "@a@b%a001240「ボクは\n\tどんなにうるさくても　眠れるよ！\n\tえっへん！\n@c0@"
180:
  de: "@a%0%a001250@bIch bin auch ein wenig müde. Tja, dabei sollte man doch meinen, dass jemand, der eine ganze Herberge voller Betten hat, genug Schlaf kriegt.\n@c0@"
  en: "@a%0%a001250@bI'm a bit sleepy now myself. You'd think an innkeeper would be able to get a decent night's sleep.\n@c0@"
  es: "@a%0%a001250@bPues, ahora que lo dice, a mí me está entrando un poco de sueño.\n㈡\nSiempre supuse que alguien encargado de una posada no tendría el más mínimo problema para dormir.\n@c0@"
  fr: "@a%0%a001250@bJe suis un peu fatiguée, moi aussi. On pourrait croire qu'une aubergiste est la mieux placée pour faire une bonne nuit, mais ça n'a pas l'air d'être le cas.\n@c0@"
  it: "@a%0%a001250@bA me, invece, è venuta una gran voglia di dormire...\nYaaawn...\n@c0@"
  ja: "@a@b%a001250「わたしも　もう　眠いです。\n\t宿屋さんなら　静かに\n\tねられると思うの……。\n@c0@"
181:
  de: "@aBianca@bDass er bei diesem Krach schlafen kann! Er scheint auch keine Ohrstöpsel zu haben...\n@c0@"
  en: "@aBianca@bI'm surprised he can sleep in here! He dun't seem to have any ear plugs or nothin'.\n@c0@"
  es: "@aBianca@b¡No me puedo creer que sea capaz de dormir en un sitio como este! Y ni siquiera tiene tapones en los oídos, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe suis impressionnée qu'il arrive à dormir iciⓠ\nEt il n'a pas l'air d'avoir de bouchons pour les oreilles.\n@c0@"
  it: "@aBianca@bMa come fa a dormire con tutto questo rumore?!\nForse usa dei tappi per le orecchie?!\n@c0@"
  ja: "@a@bビアンカ「うわ～　よく　こんな部屋で\n\tねられるわね。　見たところ\n\t耳せんは　してないみたいだし……。\n@c0@"
182:
  de: "@aBianca@bVielleicht hat er sich tagsüber einfach überanstrengt, mit dieser ganzen Rumtollerei... Ja, das muss es sein.\n@c0@"
  en: "@aBianca@bMaybe he exhausted himself durin' the day from playin' so much. That must be it.\n@c0@"
  es: "@aBianca@bDebe de ser que no ha parado de jugar en todo el día... Sí, eso será, ¿sabes?\n@c0@"
  fr: "@aBianca@bIl doit être épuisé d'avoir joué toute la journée.\r\nÇa doit être ça.\n@c0@"
  it: "@aBianca@bEvidentemente sente tanto la stanchezza che... non sente il frastuono che c'è qui dentro!\r\nIh ih ih! Buona questa, eh?\n@c0@"
  ja: "@a@bビアンカ「昼間　遊びまわって\n\tつかれたのかな？\n@c0@"
183:
  de: "@a%0%a001240@bWenn ich ihn so schlafen sehe, werde ich auch ganz müde.\n@c0@"
  en: "@a%0%a001240@bLooking at him snoozing like that\nmakes me feel sleepy too.\n@c0@"
  es: "@a%0%a001240@bSolo de verle ya me está entrando sueño a mí también.\n@c0@"
  fr: "@a%0%a001240@bLe regarder dormir comme ça me donne envie de dormir aussi.\n@c0@"
  it: "@a%0%a001240@bA vederlo dormire così tranquillo, è venuto sonno anche a me...\n@c0@"
  ja: "@a@b%a001240「あの子見てたら\n\t眠くなってきちゃった……。\n@c0@"
184:
  de: "@aOtto@bDass der Junge bei diesem Lärm überhaupt schlafen kann... Er wird es noch weit bringen, lasst Euch das gesagt sein!\n@c0@"
  en: "@aTuppence@bFancy being able to sleep in a room like this!\r\nThat boy will go far, you mark my words!\n@c0@"
  es: "@aAlazar@b¡Mira que ser capaz de quedarse dormido en un sitio como este!\n¡Ese chico llegará lejos, acordaos de lo que os digo!\n@c0@"
  fr: "@aInnocent@bC'est incroyable qu'il arrive à dormir iciⓠ\nCe garçon ira loin, vous pouvez me croireⓠ\n@c0@"
  it: "@aSimon@bCome riesce a dormire qui dentro?!\nQuel ragazzo è un prodigio della natura!\n@c0@"
  ja: "@a@bピピン「こんな部屋で　ねむれるなんて…\n\tあの子は　きっと大物になりますよ。\n@c0@"
185:
  de: "@aBianca@bDas also ist das Geräusch, dass wir hören, seit wir hier im Haus sind! Was für ein Getöse!\n@c0@"
  en: "@aBianca@bSo that's the noise we've bin hearin' since we come in this buildin'! What a racket!\n@c0@"
  es: "@aBianca@b¡Así que ese es el ruido que se oía desde que hemos entrado! ¡Vaya jaleo!\n@c0@"
  fr: "@aBianca@bAlors c'est ça, le bruit qu'on entend depuis qu'on est entrésⓡ Tu parles d'un boucanⓠ\n@c0@"
  it: "@aBianca@bEcco cos'è era il rumore che sentivamo!\r\nQuesto sì che si chiama russare!\n@c0@"
  ja: "@a@bビアンカ「この建物に　入ったときから\n\t聞こえていた音は　あれだったのね。\n\tまわりの人は　大変だわ。\n@c0@"
186:
  de: "@aNera@bWenn er weiter so mit den Zähnen knirscht, hat er bald keine mehr übrig.\n@c0@"
  en: "@aNera@bHe won't have any teeth left if he keeps grinding them at that rate!\n@c0@"
  es: "@aNera@b¡Si sigue chirriando così los dientes se los va a desgastar!\n@c0@"
  fr: "@aNera@bS'il continue à grincer des dents comme ça,\nil n'en aura bientôt plusⓠ\n@c0@"
  it: "@aNera@bNon credevo fosse possibile russare in questo modo!\nSe urlasse a squarciagola, sarebbe più silenzioso...\n@c0@"
  ja: "@a@bフローラ「あんなに　すごい歯ぎしりをして\n\t歯が　すりきれて　なくなったり\n\tしないんでしょうか？\n@c0@"
187:
  de: "@a%0%a001240@bWas macht der denn für Geräusche?! Komisch, dass er nicht von seinem eigenen Geschnarche aufwacht...\n@c0@"
  en: "@a%0%a001240@bWhat an awful noise he's making! I think I'd wake myself up if I was snoring that loudly!\n@c0@"
  es: "@a%0%a001240@b¡Qué ruido tan tremendo está haciendo! ¡Si yo roncara así, no podría dormir en toda la noche!\n@c0@"
  fr: "@a%0%a001240@bQuel bruit incroyableⓠ Je suis sûr que je me réveillerais si je ronflais aussi fortⓠ\n@c0@"
  it: "@a%0%a001240@bCon tutto il rumore che fa con il suo russare, c'è da stupirsi che non si svegli da solo!\n@c0@"
  ja: "@a@b%a001240「あれって　どうやるの？\n\tこう？　キリキリキリ……\n\tアゴが　おかしくなっちゃうね。\n@c0@"
188:
  de: "@aSancho@bUnd wie ist es, wenn iss schlafe? Mache iss auch so eine Geräusch wie Kastagnetten? Das macht mir ein wenig Sorgen...\n@c0@"
  en: "@aSancho@bHow about me when I am esleeping? Am I making thees noise, like the castanets? When you hear esomeone else, you estart to worry...\n@c0@"
  es: "@aSancho@b¿Me viste dormir a mí? ¿Yo también hago ese ruido de trompetas? Cuando escuchas el ronquido de otro, pues te empiezas a preocupar...\n@c0@"
  fr: "@aSancho@bEt m-moi, quand je dors, je fais du bruitⓡ Comme des c-castagnettesⓡ Quand on entend quelqu'un d'autre comme ça, on s'inquiète t-toujours un peu...\n@c0@"
  it: "@aSancho@bCuando dormo, yo no russo.\nSoy troppos occupato a dormire por fare altros...\n@c0@"
  ja: "@a@bサンチョ「私は　ねてるとき　どうですか？\n\tうるさくないですか？\n\tああいう人を見ると　心配になって。\n@c0@"
189:
  de: "@aBianca@bIch frage mich, wie lange die arme Frau dieses Geschnarche schon aushalten muss...\n@c0@"
  en: "@aBianca@bI wonder how long the poor woman's had to put up with his snorin'.\n@c0@"
  es: "@aBianca@bNo me explico cómo ha podido aguantar tanto esa pobre señora, ¿sabes?\n@c0@"
  fr: "@aBianca@bJe me demande depuis combien de temps cette pauvre femme doit supporter ces ronflements.\n@c0@"
  it: "@aBianca@bPoveretta, ha ragione.\nCon questo russare continuo, c'è da farsi venire un esaurimento nervoso!\n@c0@"
  ja: "@a@bビアンカ「ダンナさんの　イビキなんて\n\t今に始まったコトじゃないでしょうに。\n\t大変ね。\n@c0@"
190:
  de: "@aNera@bSelbst wenn du ganz laut schnarchen würdest, wäre es Musik in meinen Ohren... Ich würde mich davon in den Schlaf lullen lassen.\n@c0@"
  en: "@aNera@bEven if you snored really loudly, I'm sure I'd be able to think of it as a lullaby sending me off to sleep...\n@c0@"
  es: "@aNera@bTus ronquidos per me serían como una nana que me llevaría al sogno più profondo...\n@c0@"
  fr: "@aNera@bMême si tu ronflais aussi fort, je suis sûre que,\r\npour moi, ce serait comme une douce chanson\r\nqui me bercerait...\n@c0@"
  it: "@aNera@bAmore mio, per me il tuo russare è una dolce ninnananna che concilia il sonno...\n㈡\nMa io mi addormento tranquillamente anche senza ninnananna, quindi cerca di non russare, d'accordo?\n@c0@"
  ja: "@a@bフローラ「私　もし　あなたのイビキが\n\tうるさかったとしても　きっと\n\t子守歌だと思って　眠りますわ。\n@c0@"
191:
  de: "@a%0%a001240@bSancho schnarcht ja auch hin und wieder mal, aber solche Geräusche hat er noch nie von sich gegeben!\n@c0@"
  en: "@a%0%a001240@bSancho tends to snore every now and then, but I've never heard him make that much of a racket!\n@c0@"
  es: "@a%0%a001240@b¡Sancho ronca cada dos por tres, pero nunca es tan escandaloso!\n@c0@"
  fr: "@a%0%a001240@bSancho a tendance à ronfler de temps en temps, mais je ne l'ai jamais entendu faire autant de bruitⓠ\n@c0@"
  it: "@a%0%a001240@bLo zio Sancho non russa troppo rumorosamente, però a volte mentre dorme recita la ricetta della paella...\n@c0@"
  ja: "@a@b%a001240「サンチョも　たまに\n\tイビキをかくけど\n\tあそこまでは　ひどくないな。\n@c0@"
192:
  de: "@aBianca@bDer Glückliche! Es klingt, als würde er das wirklich genießen!\n@c0@"
  en: "@aBianca@bThe lucky thing! Sounds like he's really enjoyin' that.\n@c0@"
  es: "@aBianca@b¡Menuda suerte! Parece que se lo está pasando de miedo.\n@c0@"
  fr: "@aBianca@bLe veinardⓠ On dirait qu'il aime vraiment ça...\n@c0@"
  it: "@aBianca@bPreferisco un bagno e un bicchiere di latte di mucca...!\n@c0@"
  ja: "@a@bビアンカ「いいなあ…\n\tなんだか　本当に　おいしそう……。\n\tゴクッ……。\n@c0@"
193:
  de: "@aNera@bWenn ich gebadet habe, trinke ich gern ein schönes Glas kalte Milch.\n@c0@"
  en: "@aNera@bI always like to drink a nice glass of cold milk after I've had a bath.\n@c0@"
  es: "@aNera@bMe gusta beber un vaso de latte fría después de un buen bagno.\n@c0@"
  fr: "@aNera@bJ'aime bien boire un bon verre de lait frais après avoir pris un bain.\n@c0@"
  it: "@aNera@bAnche a me piace bere un bicchiere di latte dopo aver fatto il bagno.\nAiuta a reidratare la pelle.\n@c0@"
  ja: "@a@bフローラ「私は　おフロあがりの\n\tいっぱいは　ミルクと\n\t決めておりますの。\n@c0@"
194:
  de: "@a%0%a001240@bIch hätte jetzt auch gerne ein Bad und einen schönen kühlen Saft!\n@c0@"
  en: "@a%0%a001240@bI'd quite like a bath and a nice, cold juice myself!\n@c0@"
  es: "@a%0%a001240@b¡Yo también quiero un baño y una bebida fría!\n@c0@"
  fr: "@a%0%a001240@bMoi aussi, j'aimerais bien prendre un bon bain et un jus de fruit bien fraisⓠ\n@c0@"
  it: "@a%0%a001240@bA me dopo aver fatto il bagno piace mangiare!\n@c0@"
  ja: "@a@b%a001240「ボクも　おフロに入って\n\tジュースのみたい～！\n@c0@"
195:
  de: "@aSancho@bSei vorsisstig, Chico. Wenn man nach dem Baden trinkt, man bekommt oft Bauchschmerzen. Und das willst du doch wohl nisst, eh, Chico?\n@c0@"
  en: "@aSancho@bBe careful, My Majesty. Thees dreenking after the bath, ees a recipe for the round estomach. And you no wanna have a round estomach, eh, friend?\n@c0@"
  es: "@aSancho@bCuidado, Majestad. Bebiendo después del baño se consigue una oronda figura, nomás. Y eso no es lo que queremos, ¿eh, chamaco?\n@c0@"
  fr: "@aSancho@bAttention, Ma Majesté. B-Boire après le bain, ça donne un v-ventre tout rond. T-Tu ne voudrais\npas voir un estomac r-rebondi, hein, chicoⓡ\n@c0@"
  it: "@aSancho@bYo ho bevuto troppos lattes d'orco nella mia vida.\r\nEcco por qué soy en leggerissimo sovrappesos...\r\n¿Que? ¿La paella? No, la paella no fa engrassare...\n@c0@"
  ja: "@a@bサンチョ「風呂あがりの　いっぱいは\n\tおなかが　出るんですよ。\n\t%a000090王も　気をつけてくださいね。\n@c0@"
196:
  de: "@aSancho@bRiechst du diese köstlisse Duft? Iss glaube, das kommt aus die Topf dort drüben, no?\n@c0@"
  en: "@aSancho@bDo you esmell that delicious escent?\nMaybe ees coming from the pot over there, no?\n@c0@"
  es: "@aSancho@b¡Ayayay! ¿Percibes esa maravillosa esencia?\nCreo que viene de aquella tetera, ¿no, chamaco?\n@c0@"
  fr: "@aSancho@bT-Tu sens cette odeur d-délicieuseⓡ Tu crois que ça vient de cette amphoreⓡ\n@c0@"
  it: "@aSancho@b¿Da donde proviene esto profumo delicioso?\n¿Forse da quel contenidor?\n@c0@"
  ja: "@a@bサンチョ「ふんわりと\n\tいいカオリがしますね。\n\tあのツボの中からでしょうか？\n@c0@"
197:
  de: "@aOtto@bWas trinkt er denn da, das so gut schmeckt? Ich möchte auch mal!\n@c0@"
  en: "@aTuppence@bI wonder what it is he's drinking that's so good.\r\nHmm, I feel like I'm missing out here!\n@c0@"
  es: "@aAlazar@b¿Qué estará bebiendo que tiene tan buena pinta?\n¡Mmm, me doy por vencido!\n@c0@"
  fr: "@aInnocent@bJe me demande ce qu'il peut boire d'aussi bon.\nMmm, j'ai l'impression de louper quelque choseⓠ\n@c0@"
  it: "@aSimon@bChe starà bevendo quel tipo?\nMi sta facendo venire una sete...\n@c0@"
  ja: "@a@bピピン「あの人は　いったい\n\tなにを　飲んでるんだ～？\n\tうう～　気になる～～！\n@c0@"
198:
  de: "@aBianca@bHey! Vielleicht haben sie die Stadt ja wie ein Labyrinth angelegt, um ihren wertvollen Sprungsprudel zu schützen?\n㈡\nOder meinst du, das ist zu weit hergeholt?\n@c0@"
  en: "@aBianca@bHey! Maybe this place was built like a maze so they could protect their precious Zoomshine! Surely not!?\n@c0@"
  es: "@aBianca@b¡Oye! Puede que construyeran este sitio como un laberinto para proteger su preciado telelicor, ¿sabes? ¡Vamos, digo yo!\n@c0@"
  fr: "@aBianca@bHéⓠ Peut-être qu'ils ont construit leur ville comme\nun labyrinthe pour protéger leur télétord-boyauxⓡ\nNon, quand même pasⓠⓑ\n@c0@"
  it: "@aBianca@bHo capito! Questo villaggio è stato costruito come un labirinto per proteggere meglio il segreto della Delizia di Milleventi!\n㈡\nSì, dev'essere così.\nNon esiste altro motivo razionale che spieghi questa follia architettonica...\n@c0@"
  ja: "@a@bビアンカ「もしかして　この町が\n\t迷路みたいに　なっているのって\n\tお酒を守るため？　……まさかね！\n@c0@"
199:
  de: "@a%0%a001240@bErwachsene sind seltsam...\n@c0@"
  en: "@a%0%a001240@bAdults are cheeky!\n@c0@"
  es: "@a%0%a001240@b¡Los mayores son unos caraduras!\n@c0@"
  fr: "@a%0%a001240@bLes adultes sont vraiment arrogantsⓠ\n@c0@"
  it: "@a%0%a001240@bNon voglio acqua nella mia bocca, preferisco un succo di frutta.\n@c0@"
  ja: "@a@b%a001240「おとなって　ずるいや。\n@c0@"
200:
  de: "@a%0%a001250@bHier drin bekomme ich Kopfschmerzen. Können wir nicht irgendwo hingehen, wo es nicht so nach Alkohol riecht?\n@c0@"
  en: "@a%0%a001250@bThis room makes my head hurt. Can we go somewhere that doesn't smell of drink?\n@c0@"
  es: "@a%0%a001250@bEste sitio me da dolor de cabeza. ¿Podemos ir a algún sitio que no huela a alcohol?\n@c0@"
  fr: "@a%0%a001250@bCet endroit me donne mal à la tête. On ne pourrait pas aller quelque part où personne ne boitⓡ\n@c0@"
  it: "@a%0%a001250@bPapà, possiamo uscire da qui?\nQuesto posto mi fa venire il mal di testa...\n@c0@"
  ja: "@a@b%a001250「このお部屋にいると\n\tあたま　いたくなってくる……。\n\tお酒のニオイのしないとこ　行こ？\n@c0@"
201:
  de: "@aOtto@bEr hätte uns ruhig mal probieren lassen können, wo wir das Geheimnis doch sowieso schon kennen!\n@c0@"
  en: "@aTuppence@bYou wouldn't have thought it would hurt to give us a little taste, given that we're in on the secret.\n@c0@"
  es: "@aAlazar@bNo se hubieran muerto por darnos un poco, ya que sabemos su secreto.\n@c0@"
  fr: "@aInnocent@bIl aurait quand même pu nous en offrir une gorgée, étant donné qu'on est au courant.\n@c0@"
  it: "@aSimon@bVisto che sappiamo già tutto, non poteva farcene assaggiare un goccetto? Un goccettino piccolo piccolo, giusto per sentire com'è?\n@c0@"
  ja: "@a@bピピン「話のわかっている者同士\n\tちょっと　飲ませてくれても\n\tよさそうなもんなのに。　ケチだなあ。\n@c0@"
202:
  de: "@a%0%a001250@bWir sind doch keine Fremden, oder? Ach, das macht mich ganz traurig...\n@c0@"
  en: "@a%0%a001250@bWe're not outsiders, are we?\nThat makes me feel all sad.\n@c0@"
  es: "@a%0%a001250@bNosotros no somos forasteros, ¿o sí?\nNo sabes lo que eso me entristece.\n@c0@"
  fr: "@a%0%a001250@bNous, on est des étrangersⓡ\nÇa me rend toute triste.\n@c0@"
  it: "@a%0%a001250@bNon siamo forestieri!\nSiamo cittadini del mondo, noi!\n@c0@"
  ja: "@a@b%a001250「よそ者って　わたしたちのコト？\n\t……さみしいね。\n@c0@"
203:
  de: "@aOtto@bWie ist er denn in diesen Zustand geraten? Ein Mysterium...\n@c0@"
  en: "@aTuppence@bI wonder why he's in such a state.\nHm, it's a mystery.\n@c0@"
  es: "@aAlazar@bMe pregunto por qué estará en ese estado...\nMmm, es un misterio.\n@c0@"
  fr: "@aInnocent@bJe me demande pourquoi il est dans cet état. Mmm. C'est un mystère.\n@c0@"
  it: "@aSimon@bChe starà sognando quel tipo?!\nDarei non so cosa per saperlo!\n㈡\nAnzi, non darei un bel niente.\nNon può importarmene di meno...\n@c0@"
  ja: "@a@bピピン「あの人　なんで　あんな\n\tきたないかっこう　してるんですかね？\n\tう～ん…　なぞだ。\n@c0@"
204:
  de: "@aGriselda@bDiese Stadt ist ein richtiger Irrgarten. Ich verirre mich ja niemals, aber ich mache mir etwas Sorgen um dich, %a000090.\n@c0@"
  en: "@aDebora@bThis town's like a maze. I never lose my way, but I'm a bit worried that you might, %a000090.\n@c0@"
  es: "@aStefania@bEste sitio es come un labirinto. Yo nunca me pierdo, ma temo per te, %a000090.\n@c0@"
  fr: "@aPandora@bCette ville est un vrai labyrinthe. Je ne me perds jamais, mais j'ai bien peur que ça t'arrive, %a000090. \n@c0@"
  it: "@aViola@bQuesta città è un labirinto, %a000090, e io non ho nessuna voglia di procedere alla cieca...\n㈡\nVai avanti tu, caro: tornerai a prendermi dopo che avrai capito che strada fare. Io resterò qui buona buona a limarmi le unghie.\n@c0@"
  ja: "@a@bデボラ「何なのよ　この　迷路みたいな町は。\n\t私なら　迷ったりはしないけど\n\t%a000090は大丈夫かしら。\n@c0@"
205:
  de: "@aGriselda@bHier gefällt's mir. Ich würde gern mal zum höchsten Punkt hinaufklettern und auf all die Leute herabsehen.\n@c0@"
  en: "@aDebora@bI like this place. I'd like to climb up to the highest point and look down on all the people.\n@c0@"
  es: "@aStefania@bMe gusta este sitio. Querría subir hasta el punto más elevato y ver desde arriba a la gente.\n@c0@"
  fr: "@aPandora@bJ'aime bien cet endroit. Ça me plaît de grimper jusqu'au point le plus élevé et de regarder ensuite les gens de haut.\n@c0@"
  it: "@aViola@bQuesto posto non è affatto male, sai?\nChissà se c'è anche qualche bel negozio di abbigliamento...\n@c0@"
  ja: "@a@bデボラ「いい町よね。\n\t一番高いところにのぼって　ずっと\n\t町の人たちを　見下ろしていたいわ。\n@c0@"
206:
  de: "@aGriselda@bIch habe mich hier einmal verlaufen, als ich klein war.\n@c0@"
  en: "@aDebora@bI got lost here once when I was little.\n@c0@"
  es: "@aStefania@bUna volta, cuando era bambina, me perdí aquí.\n@c0@"
  fr: "@aPandora@bJe me suis perdue ici, une fois, quand j'étais petite.\n@c0@"
  it: "@aViola@bDa piccola venni qui in vacanza con i miei genitori.\nMi allontanai da loro per cercare un negozio d'abbigliamento, ma finii per perdermi.\n@c0@"
  ja: "@a@bデボラ「子供のころ　ルラフェンで\n\t迷子になったことがあったの。\n@c0@"
207:
  de: "@aGriselda@bMama und Papa sind fast umgekommen vor Sorge, weil sie ihre kleine Prinzessin nicht finden konnten...\n@c0@"
  en: "@aDebora@bMama and Papa were absolutely frantic that they couldn't find their beautiful little princess.\n@c0@"
  es: "@aStefania@bLa mia mamma e il mio papino se pusieron como locos cuando no encontraban a la sua piccola principessa.\n@c0@"
  fr: "@aPandora@bMamma et papa étaient absolument fous d'inquiétude de ne plus retrouver leur belle petite princesse.\n@c0@"
  it: "@aViola@bRicordo che il mio paparino e la mia mammina erano disperati! Mobilitarono tutti gli abitanti del villaggio per trovarmi! Ih ih ih! Fu una scena divertentissima!\n@c0@"
  ja: "@a@bデボラ「パパたち\n\tかわいい娘を　見つけられなくて\n\tオロオロしていたわね。\n@c0@"
208:
  de: "@aGriselda@bDiese ganzen Forschungen können ja auch nicht gut für die Gesundheit sein.\n㈡\nAm besten entspannt man sich einfach ⓚⓛ dann bleibt man so jung und schön wie ich.\n@c0@"
  en: "@aDebora@bI knew studying was bad for you. Better just to relax and keep yourself young and beautiful like me.\n@c0@"
  es: "@aStefania@bYa sé que no es lo tuyo. Ma lo megliore es descansar y mantenerse joven e bella come io.\n@c0@"
  fr: "@aPandora@bJe savais que ce n'était pas bon, les études.\r\nMieux vaut se contenter de se détendre et de s'entretenir pour rester jeune et belle, comme moi.\n@c0@"
  it: "@aViola@bCaro, ti sembro pallida? Non è che forse mi sto sforzando troppo a darti tanti ordini?\nNon vorrei affaticare le mie corde vocali...\n@c0@"
  ja: "@a@bデボラ「やっぱり　研究って　体に毒ね。\n\tムリせず　勉強しなければ　\n\t若さを保てられるのにね　私のように。\n@c0@"
209:
  de: "@aGriselda@bWas für ein Idiot. Solange ich lebe, wird die Welt garantiert nicht in Finsternis versinken!\n@c0@"
  en: "@aDebora@bWhat an idiot. As long as I'm alive, there's no way the world's going to come to an end.\n@c0@"
  es: "@aStefania@b¡Será lerdo! Mientras yo esté viva, el mundo no se va a acabar, eso sicuro.\n@c0@"
  fr: "@aPandora@bQuel idiot. Moi vivante, jamais on ne verra la fin\r\ndu monde.\n@c0@"
  it: "@aViola@bNon c'è nulla da temere, caro.\nSe le tenebre minacciassero il mondo, la mia bellezza sfolgorante le scaccerebbe all'istante...\n@c0@"
  ja: "@a@bデボラ「おバカさんね。\n\t私が　生きているかぎり\n\t世界に　終わりは　こないわよ。\n@c0@"
210:
  de: "@aGriselda@bEs macht einen großen Unterschied, ob jemand als Diener oder als Sklave arbeitet. Letzteres finde ich einfach abscheulich.\n@c0@"
  en: "@aDebora@bThere's a big difference between having someone as your servant and having them as your slave. I find the latter very distasteful.\n@c0@"
  es: "@aStefania@bHay una gran diferencia entre tener un sirviente y tener un esclavo. Lo segundo es de molto mal gusto.\n@c0@"
  fr: "@aPandora@bIl y a une grosse différence entre un domestique et un esclave. Je trouve que posséder un esclave est de très mauvais goût.\n@c0@"
  it: "@aViola@bCaro, io ti chiedo di esaudire ogni mio desiderio e di servirmi e riverirmi, ma non mi sognerei mai di trattarti come uno schiavo...\n@c0@"
  ja: "@a@bデボラ「ドレイと　しもべは　違うわ。\n\t人をドレイとして　あつかうなんて\n\tゆるせないんだから。\n@c0@"
211:
  de: "@aGriselda@bDu kaufst tatsächlich ein Buch, ohne mich vorher um Erlaubnis gefragt zu haben? Du solltest nicht vergessen, wer bei uns die Hosen anhat...\n@c0@"
  en: "@aDebora@bWhat are you doing, buying a book like that without my permission? Remember who controls the purse strings around here!\n@c0@"
  es: "@aStefania@b¿En qué estabas pensando para comprar un libro así senza il mio permiso? ¡No te olvides de quién controla aquí las finanzas!\n@c0@"
  fr: "@aPandora@bQu'est-ce qui te prend d'acheter un livre comme ça, sans ma permissionⓡ N'oublie pas qui tient les cordons de la bourse, iciⓠ\n@c0@"
  it: "@aViola@bCome ti sei permesso di acquistare quel libro senza prima chiedermi il permesso?!\nHai dimenticato chi è che comanda?!\n@c0@"
  ja: "@a@bデボラ「なんで　私の許可なく\n\tそんな本　買ったの？\n\tあんたのサイフは　私のものよ？\n@c0@"
212:
  de: "@aGriselda@bSehr gut, %a000090. So ein Buch darfst du nicht kaufen. Besitztümer können viel über einen Menschen verraten, weißt du...\n@c0@"
  en: "@aDebora@bQuite right. You mustn't buy a book like that.\r\nYour possessions can speak volumes about what kind of person you are, you know.\n@c0@"
  es: "@aStefania@bAsí es. No debes comprar algo así.\nTus posesiones hablan de la clase de persona que eres come un libro aperto.\n@c0@"
  fr: "@aPandora@bC'est bien. Tu ne dois pas acheter un livre comme celui-là. Les objets que l'on possède en disent long sur qui l'on est, tu sais.\n@c0@"
  it: "@aViola@bBravo, caro.\nSolo un pazzo potrebbe comprare quel libro.\n㈡\nE tu non sei affatto pazzo, anzi sei fin troppo saggio: lo dimostra il fatto che hai deciso di sposare me...\n@c0@"
  ja: "@a@bデボラ「そうそう　そんな本買っちゃダメよ。\n\tなにを買うかで　人の価値がわかるわ。\n@c0@"
213:
  de: "@aGriselda@bDu hast doch nur Ja gesagt, weil du wusstest, dass wir uns das Buch nicht leisten können. Aber das ist auch gut so. Dieses Buch ist pures Gift.\n@c0@"
  en: "@aDebora@bYou only said yes because you knew we couldn't afford it. We don't need a book like that, though.\r\nIt's pure poison, that's what it is.\n@c0@"
  es: "@aStefania@bHas dicho que sí solo porque sabías que no podíamos comprarlo. Ma no necesitamos un libro così.\nPorque es puro veneno, por eso.\n@c0@"
  fr: "@aPandora@bTu n'as dit oui que parce que tu savais qu'on ne pouvait pas se le payer. Mais nous n'avons pas besoin d'un livre comme celui-là.\n㈡\nC'est du poison à l'état pur, voilà ce que c'est.\n@c0@"
  it: "@aViola@bAvevi detto di voler comprare il libro solo perché sapevi di non avere denaro a sufficienza, non è vero? Ih ih ih! Sei un simpatico burlone!\n@c0@"
  ja: "@a@bデボラ「あんた　お金ないの　知ってて\n\tはい　って答えたでしょ。\n\tでも　正解よ。　そんな本　体に毒よ。\n@c0@"
214:
  de: "@aGriselda@bUnd so was will Soldat sein! Als Diener könnte man ihn auch nicht gebrauchen, wenn er sich so leicht verläuft...\n@c0@"
  en: "@aDebora@bWhat a useless excuse for a soldier he is!\r\nHe wouldn't be much good as a servant, either, getting lost that easily.\n@c0@"
  es: "@aStefania@b¡Es el soldato más patético que he visto!\nNo serviría ni de sirviente, si se pierde con tanta facilitá.\n@c0@"
  fr: "@aPandora@bTu parles d'un soldatⓠ Et il ne ferait pas non plus\nun bon domestique s'il se perd aussi facilementⓠ\n@c0@"
  it: "@aViola@bPuah!\nQuel tipo non lo vorrei come servitore nemmeno se me lo regalassero!\n㈡\nScommetto che si perderebbe ogni volta che gli chiedessi di andarmi a comprare qualcosa!\n@c0@"
  ja: "@a@bデボラ「なんじゃくな　戦士さんね。\n\tすぐに　まいった　なんて言う\n\t戦士じゃ　しもべにできないわ。\n@c0@"
215:
  de: "@aGriselda@bAber es ist lustig, ihm zuzusehen, wie er in der Gegend herumirrt.\n@c0@"
  en: "@aDebora@bMind you, it's quite funny watching him dithering about like that.\n@c0@"
  es: "@aStefania@bAunque es divertente verlo vacilar de un lado para otro.\n@c0@"
  fr: "@aPandora@bRemarque, c'est assez rigolo de le regarder\r\nhésiter sur la direction à prendre.\n@c0@"
  it: "@aViola@bTu, per fortuna, hai un discreto senso dell'orientamento.\nE cerca di non smentirmi! D'accordo?!\n@c0@"
  ja: "@a@bデボラ「……でも　オロオロした　すがたを\n\t見るのも　悪くはないわね。\n@c0@"
216:
  de: "@aGriselda@bJa, es ist schön hier, weil es die höchste Stelle ist.\nIch kann auf die Stadtleute hinabblicken und mir vorstellen, dass sie alle meine Dienstboten sind!\n@c0@"
  en: "@aDebora@bYes, it's nice here because it's the highest spot.\r\nI can look down on the townspeople and imagine they're all my servants.\n@c0@"
  es: "@aStefania@bEste sitio mi piace porque es el punto más alto.\nDesde aquí puedo mirar a la gente y pensar que tutti son mis sirvientes.\n@c0@"
  fr: "@aPandora@bOui, cet endroit est agréable car c'est le point le plus élevé. Je peux regarder les habitants d'en haut et m'imaginer que ce sont tous mes domestiques.\n@c0@"
  it: "@aViola@bDa qui si gode un panorama favoloso! È bello guardare gli altri dall'alto in basso e immaginare che siano tutti pronti a eseguire i miei ordini...\n@c0@"
  ja: "@a@bデボラ「そうね　ここが一番高くていいわ。\n\t町を　みわたせるし　町の人　すべてを\n\tしもべにした　気分にひたれるから。\n@c0@"
217:
  de: "@aGriselda@bAm Tag unserer Hochzeit hattest du genau denselben Gesichtsausdruck, %a000090. Ha ha!\n@c0@"
  en: "@aDebora@bJust so you know, you had an expression on your face just like that on the day of our wedding. Ha ha!\n@c0@"
  es: "@aStefania@bPara que lo sepas, la expresión de la tua faccia era como la del día de nuestra boda. ¡Ja, ja!\n@c0@"
  fr: "@aPandora@bJuste pour que tu sois au courant, tu avais exactement la même tête que lui, le jour de\nnotre mariage. Ha haⓠ\n@c0@"
  it: "@aViola@bLe locande di campagna profumano di stalla, eh?\nOttimo motivo per non andarci...\n@c0@"
  ja: "@a@bデボラ「言っとくけど　あんた……。\n\t結婚式のとき　この人のような\n\t表情してたわ。\n@c0@"
218:
  de: "@aGriselda@bEin paar neue Kleider würden ihm auch nicht schaden...\n@c0@"
  en: "@aDebora@bHe could do with a change of clothes for a start.\n@c0@"
  es: "@aStefania@bNo le vendría mal cambiarse de ropa, para empezar.\n@c0@"
  fr: "@aPandora@bPour commencer, il devrait plutôt changer de vêtements.\n@c0@"
  it: "@aViola@bPer capire che quei gentiluomini non sono di queste parti basta sentire come parlano.\nO il ⓕprofumoⓖ di stalla che emanano...\n@c0@"
  ja: "@a@bデボラ「まずは　服を　どうにかすべきね。\n@c0@"
219:
  de: "@aGriselda@bEr hat sicher viel Zeit, wenn er hier herumstehen und darauf warten kann, dass die Schänke aufmacht.\n@c0@"
  en: "@aDebora@bHe must have plenty of time on his hands to be just standing around here waiting for the place to open.\n@c0@"
  es: "@aStefania@bDebe de sobrarle el tempo para estar ahí, dando vueltas esperando a que abran.\n@c0@"
  fr: "@aPandora@bIl doit avoir beaucoup de temps à perdre pour rester ici sans rien faire, à attendre que ça ouvre.\n@c0@"
  it: "@aViola@bPotrebbe bere dell'acqua, no?\nL'acqua è la bevanda della bellezza e della salute: non ingrassa e lava via le impurità.\n@c0@"
  ja: "@a@bデボラ「開店前から　待っているだなんて\n\tこの男　本当に　ヒマなのね。\n@c0@"
220:
  de: "@aGriselda@bIch mag solche Saufbolde nicht.\n㈡\nFalls du mal Lust auf ein Schlückchen haben solltest, %a000090, dann leiste ich dir gern Gesellschaft und pass auf, dass du's nicht übertreibst.\n@c0@"
  en: "@aDebora@bI can't stand rowdy men like him. If you ever want to drink, %a000090, I don't mind being your partner and keeping you in check.\n@c0@"
  es: "@aStefania@bNo soporto a los hombres escandalosos come este.\n㈡\nSi alguna vez quieres beber, %a000090, no me importa acompañarte para mantenerte a raya, ¿capisci?\n@c0@"
  fr: "@aPandora@bJe ne supporte pas les types agités comme lui. \nSi jamais un jour tu veux boire, %a000090, je veux bien rester à côté de toi pour te surveiller.\n@c0@"
  it: "@aViola@bLe persone arroganti come lui mi stanno tremendamente antipatiche. Stagli lontano, caro: non vorrei che tu assorbissi il suo modo di comportarsi...\n@c0@"
  ja: "@a@bデボラ「あらくれた　男は　イヤね。\n\t%a000090。　あんたとなら\n\tお酒の　相手してあげても　いいわよ。\n@c0@"
221:
  de: "@aGriselda@bHier gibt es eine erstaunlich große Auswahl an Getränken.\n@c0@"
  en: "@aDebora@bThey have quite a lot of decent drinks here.\n@c0@"
  es: "@aStefania@bLas bebidas de este sitio, veramente no están mal.\n@c0@"
  fr: "@aPandora@bIls ont pas mal de boissons très bien, ici.\n@c0@"
  it: "@aViola@bChissà se qui servono la spremuta d'arancia con peli di Silvapiteco...\n@c0@"
  ja: "@a@bデボラ「ここの　酒場って　結構いい\n\tお酒が　そろっているのね。\n@c0@"
222:
  de: "@aGriselda@bIch habe zwar nie selbst getrunken, aber ich weiß genau, wovon ich rede.\n㈡\nIch habe nämlich mal eins von Papas Büchern darüber gelesen. Siehst du, ich bin gebildet!\n@c0@"
  en: "@aDebora@bI've never drunk much myself, but I know what I'm talking about because I borrowed one of Papa's books. See, I'm studious!\n@c0@"
  es: "@aStefania@bYo nunca bebo, lo que sé es por un libro que tomé prestado del mio papino. ¡Sonno una ragazza estudiosa!\n@c0@"
  fr: "@aPandora@bJe n'ai jamais beaucoup bu moi-même, mais je sais\nde quoi je parle, parce que j'ai emprunté l'un des livres de papa. Tu vois, je suis studieuse, en faitⓠ\n@c0@"
  it: "@aViola@bÈ una bevanda che ha ottime proprietà depurative.\nI peli di Silvapiteco attirano le impurità presenti nel corpo e le portano con sé quando vengono espulsi.\n㈡\nUhm, a giudicare dalla tua espressione direi che la cosa non t'interessa...\nBah, peggio per te.\n@c0@"
  ja: "@a@bデボラ「お酒は　あまり飲まないけれども\n\tパパから　本かりて　勉強したの。\n\t私って　勉強熱心なのよ。\n@c0@"
223:
  de: "@aGriselda@bDer Mann lügt. So leicht lasse ich mich nicht hinters Licht führen.\n@c0@"
  en: "@aDebora@bThat man's lying. He can't pull the wool over my eyes that easily.\n@c0@"
  es: "@aStefania@bEse uomo es un mentiroso. A mí no me engaña tan facilmente.\n@c0@"
  fr: "@aPandora@bCet homme ment. Je ne me laisse pas embobiner\naussi facilement.\n@c0@"
  it: "@aViola@bPerché ha detto che la Delizia di Milleventi è robaccia? Credevo che fosse una bevanda famosa in tutto il mondo per il suo gusto unico e inimitabile...\n@c0@"
  ja: "@a@bデボラ「あの男……　ウソをついているわね。\n\t私は　そうカンタンに\n\tだまされたりは　しないわよ。\n@c0@"
224:
  de: "@aGriselda@bOje. Ich fürchte, ich kann Geheimnisse nicht besonders gut für mich behalten.\n㈡\nEs ist wie ein Zwang, ich kann einfach nicht anders, als sofort alles auszuplaudern...\n@c0@"
  en: "@aDebora@bOh dear. I'm afraid I'm not very good at keeping things to myself. When I find out a secret, I get this urge to blurt it out to all and sundry.\n@c0@"
  es: "@aStefania@bDiosa mia. Me parece que no se me da bien guardar secretos. Cuando me entero de uno, en seguida me muero de ganas de contárselo a tutto il mondo.\n@c0@"
  fr: "@aPandora@bOh là là. J'ai bien peur de n'être pas très douée pour garder un secret. Dès que j'en découvre un, j'ai aussitôt envie de le répéter à tout le monde.\n@c0@"
  it: "@aViola@bMa per chi mi ha presa, eh?!\nHo forse l'aria di una pettegola che non sa tenersi per sé un segreto?!\n㈡\nÈ una domanda retorica, %a000090.\nNon devi rispondere.\nE se proprio ci tieni a farlo, ti ordino dimentire.\n@c0@"
  ja: "@a@bデボラ「こまったわ　%a000090……。\n\tくれぐれも　ないしょに　って言われると\n\tみんなに　話したくなるの。\n@c0@"
225:
  de: "@aGriselda@bSie sieht ganz nett aus, wenn sie schläft.\n@c0@"
  en: "@aDebora@bShe looks quite sweet when she's asleep.\n@c0@"
  es: "@aStefania@bCuando está dormida parece molto dolce.\n@c0@"
  fr: "@aPandora@bElle a l'air plutôt mignonne quand elle est endormie.\n@c0@"
  it: "@aViola@bCome dorme tranquilla...\n@c0@"
  ja: "@a@bデボラ「まぁ……。\n\tなんて　かわいい寝顔。\n@c0@"
226:
  de: "@aGriselda@bHmmm... Nein, eigentlich nicht. Sie sieht vielmehr so aus, als hätte man sie ins Gesicht geschlagen! Los, wir gehen.\n@c0@"
  en: "@aDebora@bHmmm... Maybe not. She actually looks like she's been slapped across the face over and over! Let's go.\n@c0@"
  es: "@aStefania@bO quizá no. En realità parece que le hayan dado una paliza. Andiamo.\n@c0@"
  fr: "@aPandora@bMmm... Peut-être pas, en fait. Elle a les joues tellement rouges qu'on dirait qu'elle a reçu des centaines de giflesⓠ Allons-nous-en.\n@c0@"
  it: "@aViola@bCaro, sapresti dirmi che espressione ho mentre dormo? Sono bella come da sveglia, o sono ancora più attraente?\n@c0@"
  ja: "@a@bデボラ「って　思ってたら\n\tれんぞく往復ビンタの刑だからね！\n\tさぁ　もう行くわよ。\n@c0@"
227:
  de: "@aGriselda@bIch bin mir sicher, dass unsere Kinder uns nicht so enttäuschen werden. Und unsere Enkel werden mich Signorina Griselda nennen und mich abgöttisch lieben!\n@c0@"
  en: "@aDebora@bI know our children won't disappoint us like that.\r\nAnd our grandchildren will call me Signorina Debora and they'll love me to pieces!\n@c0@"
  es: "@aStefania@bYa sé que nuestros bambini no nos decepcionarán así.\n㈡\n¡Y nuestros nietos me llamarán signora Stefania y me querrán molto!\n@c0@"
  fr: "@aPandora@bJe sais que nos enfants ne nous décevront pas comme ça. Et nos petits-enfants m'appelleront Signorina Pandora et m'adorerontⓠ\n@c0@"
  it: "@aViola@bI nostri figli ci daranno un mare di nipotini, caro.\nE somiglieranno tutti a me, quindi saranno bellissimi, intelligenti, comprensivi.\n㈡\nE modesti.\nOh, sì.\nMolto modesti.\n@c0@"
  ja: "@a@bデボラ「うちの子供たちは　心配ないわね。\n\t早く　孫に　デボラお姉さんと\n\t呼ばせてみたいわ。\n@c0@"
228:
  de: "@aGriselda@bDer arme Mann scheint etwas verwirrt. Vielleicht sollte ich ihm ja zeigen, was wahres Glück ist und ihn zu meinem Dienstboten machen.\n@c0@"
  en: "@aDebora@bThat poor misguided man. Maybe I should show him true happiness and allow him to become one of my servants.\n@c0@"
  es: "@aStefania@b¡Pobre desgraciado! Quizá debería hacerle mi sirviente para enseñarle el verdadero sentido de la felicità.\n@c0@"
  fr: "@aPandora@bCe pauvre homme se trompe. Peut-être que je devrais lui montrer ce qu'est le vrai bonheur en l'autorisant à devenir l'un de mes domestiques.\n@c0@"
  it: "@aViola@bNo, il prosciutto di Cinghialorco è un alimento troppo grasso. Per mantenere la linea è preferibile mangiare pesce e verdure condite con poco olio...\n@c0@"
  ja: "@a@bデボラ「かわいそうな男。\n\tしもべになる　よろこびを\n\t教えてあげようかしら？\n@c0@"
229:
  de: "@aGriselda@bHa ha! Gegen unsere Kinder hat dieser Nimzo doch nicht den Hauch einer Chance!\n@c0@"
  en: "@aDebora@bHa ha! There's no way our children will lose to the likes of Nimzo!\n@c0@"
  es: "@aStefania@b¡Ja, ja! ¡Nuestros bambini no pueden perder contra gente como Nimzo!\n@c0@"
  fr: "@aPandora@bHa haⓠ Jamais nos enfants ne seront battus par quelqu'un comme Nimzoⓠ\n@c0@"
  it: "@aViola@bCome sarebbe a dire ⓕchissà chi raggiungerà per primo il suo scopoⓖ?! Ma mio figlio, no?!\nSotto la mia abile guida, farà polpette di quel Nimzo!\n@c0@"
  ja: "@a@bデボラ「ふふっ　私たちの　子供が\n\tたかが　魔界の王ごときに\n\t負けるはずないわ。\n@c0@"
230:
  de: "@aGriselda@bSchade. Ich hatte mich schon auf dein Gesicht gefreut, wenn er eklig geschmeckt hätte, aber eigentlich schmeckt er ganz gut.\n@c0@"
  en: "@aDebora@bThat's a shame. I was looking forward to\r\nseeing your face if it tasted foul, but it's\r\nactually quite nice.\n@c0@"
  es: "@aStefania@bQué pena. Esperaba verte la cara si sabía mal, pero está bastante buono.\n@c0@"
  fr: "@aPandora@bDommage. J'avais hâte de voir ta tête si ça avait eu un sale goût, mais c'est vraiment bon, en fait.\n@c0@"
  it: "@aViola@bAvrei voluto vedere la tua espressione se il gusto fosse stato pessimo, invece ha proprio un buon sapore! Peccato...\n@c0@"
  ja: "@a@bデボラ「残念……。　マズイお酒を\n\t飲ませてあげようと　思ってたけど\n\tおいしいのよね　このお酒。\n@c0@"
231:
  de: "@aGriselda@bDas hört sich ja lustig an! Risikooo... Diesen Zauber musst du so oft wie möglich verwenden. Das ist ein Befehl, hörst du?\n@c0@"
  en: "@aDebora@bThat sounds like a fun spell! Hocus Pocus...\r\nYou'll have to use it lots. That's an order, got it?\n@c0@"
  es: "@aStefania@b¡Parece un conjuro divertente! Abracadabra...\nTendrás que usarlo muchas veces. Es una orden, ¿capisci?\n@c0@"
  fr: "@aPandora@bÇa a l'air d'être amusant, comme sortⓠ Plouf-plouf... Il faudra que tu t'en serves souvent.\nEt c'est un ordre, comprisⓡ\n@c0@"
  it: "@aViola@bAbracasualis... Ah, che nome carino per un incantesimo! Vedi di impararlo bene, caro, perché voglio che lo usi spesso e volentieri.\n@c0@"
  ja: "@a@bデボラ「楽しそうな呪文ね。\n\tパルプンテ　ガンガンつかいなさい。\n\t私からの　めいれいだからね。\n@c0@"
232:
  de: "@aGriselda@bVergiss bloß nicht, wo dein Platz ist, %a000090. Zuallererst bist du schließlich mein Diener.\n@c0@"
  en: "@aDebora@bDon't go forgetting your place, %a000090.\nYou're my servant first and foremost.\n@c0@"
  es: "@aStefania@bNo olvides cuál es il tuo lugar, %a000090.\nAntes que niente, tú eres il mio sirviente.\n@c0@"
  fr: "@aPandora@bNe va pas oublier là où est ta place, %a000090. Tu es mon domestique avant toute chose.\n@c0@"
  it: "@aViola@b%0%a000090, perché non gli chiedi se può lavorare a un incantesimo che mantenga intatta la mia bellezza per l'eternità?\n㈡\nSe ci pensi, la cosa andrebbe anche a tuo vantaggio, maritino mio...\n@c0@"
  ja: "@a@bデボラ「あんたは　自分が　何者か\n\tわかっているんでしょうね？\n\tもちろん　私のしもべよ。\n@c0@"
233:
  de: "@aGriselda@bEin wertvoller Trank, der einfach nur wunderbar schmeckt... Hm, vielleicht sollte ich dir auch etwas übrig lassen...\n@c0@"
  en: "@aDebora@bA precious brew that tastes just wonderful...\r\nI suppose I'd better save you a mouthful or\r\ntwo then.\n@c0@"
  es: "@aStefania@bUna valiosa bebida de delicioso sapore...\nVa bene, quizá te deje beber un culín.\n@c0@"
  fr: "@aPandora@bUne boisson précieuse qui a un goût meveilleux...\r\nJe ferais bien de t'en garder une ou deux gorgées, alors.\n@c0@"
  it: "@aViola@bNon vedo l'ora di trangugiare questo nettare!\nNon temere, caro: non mi dimenticherò certo di te!\n㈡\nTi permetterò di leggere l'etichetta e ti concederò di annusare la bottiglia vuota...\n@c0@"
  ja: "@a@bデボラ「おいしくて　貴重なお酒なのね。\n\tなら　あんたにも　残してあげるわ。\n\t一口くらいわね。\n@c0@"
234:
  de: "@aGriselda@bIch wusste ja, dass du manchmal ein wenig seltsam bist, aber dass du in Brunnen reinspringst und mit Katzen plauderst, geht dann doch ein wenig zu weit!\n@c0@"
  en: "@aDebora@bI always knew you were weird, but jumping down wells and chatting away with cats is pushing it even for you!\n@c0@"
  es: "@aStefania@bSiempre he sabido que eras raro, ¡pero lo de saltar por pozos y parlare con gatti es demasiado hasta para ti!\n@c0@"
  fr: "@aPandora@bJ'ai toujours su que tu étais bizarre, mais sauter au fond des puits et parler à des chats, c'est pousser un peu loin, même pour toiⓠ\n@c0@"
  it: "@aViola@bFin dal primo momento che ti ho visto ho capito che sei un tipo strano, quindi il fatto che tu parli con un gatto non mi stupisce più di tanto...\n@c0@"
  ja: "@a@bデボラ「あんた　ヘンだと思ってたけど……。\n\tまさか　とつぜん　井戸にもぐって\n\tネコと　会話するなんて……。\n@c0@"
235:
  de: "@aGriselda@bDiese Stadt ist ein richtiger Irrgarten. Ich verirre mich ja niemals, aber ich mache mir etwas Sorgen um dich, %a000090.\n@c0@"
  en: "@aDebora@bThis town's like a maze. I never lose my way, but I'm a bit worried that you might, %a000090.\n@c0@"
  es: "@aStefania@bEste sitio es come un labirinto. Yo nunca me pierdo, ma temo per te, %a000090.\n@c0@"
  fr: "@aPandora@bCette ville est un vrai labyrinthe. Je ne me perds jamais, mais j'ai bien peur que ça t'arrive, %a000090. \n@c0@"
  it: "@aViola@bQuesta città è un labirinto, %a000090, e io non ho nessuna voglia di procedere alla cieca...\n㈡\nVai avanti tu, caro: tornerai a prendermi dopo che avrai capito che strada fare. Io resterò qui buona buona a limarmi le unghie.\n@c0@"
  ja: "@a@bデボラ「何なのよ　この　迷路みたいな町は。\n\t私なら　迷ったりはしないけど\n\t%a000090は大丈夫かしら。\n@c0@"
236:
  de: "@aGriselda@bHier gefällt's mir. Ich würde gern mal zum höchsten Punkt hinaufklettern und auf all die Leute herabsehen.\n@c0@"
  en: "@aDebora@bI like this place. I'd like to climb up to the highest point and look down on all the people.\n@c0@"
  es: "@aStefania@bMe gusta este sitio. Querría subir hasta el punto más elevato y ver desde arriba a la gente.\n@c0@"
  fr: "@aPandora@bJ'aime bien cet endroit. Ça me plaît de grimper jusqu'au point le plus élevé et de regarder ensuite les gens de haut.\n@c0@"
  it: "@aViola@bQuesto posto non è affatto male, sai?\nChissà se c'è anche qualche bel negozio di abbigliamento...\n@c0@"
  ja: "@a@bデボラ「いい町よね。\n\t一番高いところにのぼって　ずっと\n\t町の人たちを　見下ろしていたいわ。\n@c0@"
237:
  de: "@aGriselda@bAaaaah. Ich bin plötzlich so müde. Lass uns bald Halt machen, ja?\n@c0@"
  en: "@aDebora@bAaaaah. I'm tired all of a sudden.\r\nLet's stop for a rest soon.\n@c0@"
  es: "@aStefania@b¡Aaaaah! De pronto me siento cansada.\nVamos a parar pronto a descansar, ¿capisci?\n@c0@"
  fr: "@aPandora@bAaaaaaah. Je suis fatiguée, tout d'un coup.\nArrêtons-nous bientôt pour nous reposer.\n@c0@"
  it: "@aViola@bAccidenti, che stanchezza...\nCaro, fermiamoci da qualche parte.\nHo bisogno di riposare...\n@c0@"
  ja: "@a@bデボラ「ふわぁぁぁ～……。\n\t眠くなってきたわ。\n\tそろそろ　やすみましょ？\n@c0@"
238:
  de: "@aGriselda@bDu musst der glücklichste Mann auf Erden sein. Immerhin hast du mich als Frau. Also solltest du dich mit Leib und Seele für mich einsetzen, hörst du?\n@c0@"
  en: "@aDebora@bYou must be the happiest man alive. You married me, after all. So you'd better devote yourself to me one hundred percent, got it?\n@c0@"
  es: "@aStefania@bDebes de ser el uomo más felice del mundo. Por haberte casado conmigo, claro. Así que ya puedes dedicarte un cento per cento a mí, ¿capisci?\n@c0@"
  fr: "@aPandora@bTu dois être l'homme le plus heureux qui soit.\nAprès tout, tu m'as épousée. Alors tu as intérêt\nà te consacrer à moi à cent pour cent, comprisⓡ\n@c0@"
  it: "@aViola@bSposarti con me ti ha reso automaticamente l'uomo più felice del mondo, %a000090.\n㈡\nPensa, tra gli innumerevoli spasimanti che avevo, ho scelto di farmi servire e riverire da te!\nChe fortuna hai avuto, eh?\n@c0@"
  ja: "@a@bデボラ「あんたは　世界一の　幸せ者よ。\n\tこの私と　結婚したんだからね。\n\t精一杯　私に　尽くしなさいよ。\n@c0@"
239:
  de: "@aGriselda@bIgitt! Er riecht ein wenig streng, findest du nicht? Also, den Weg zur Herberge könnte er ja schon finden!\n@c0@"
  en: "@aDebora@bUgh! He smells a bit, don't you think?\r\nSurely he could at least find his way to the inn!\n@c0@"
  es: "@aStefania@b¡Puaj! Apesta un poco, ¿no?\n¡Sicuro que al menos sabrá encontrar el camino de la posada y a la ducha!\n@c0@"
  fr: "@aPandora@bBeurkⓠ Il sent un peu, tu ne trouves pasⓡ\nIl pourrait au moins trouver son chemin\njusqu'à l'aubergeⓠ\n@c0@"
  it: "@aViola@bA giudicare dall'olezzo proveniente dai suoi abiti, è talmente preso dalla ricerca della sua destinazione che sono secoli che non fa un bagno!\n@c0@"
  ja: "@a@bデボラ「あの人　少し　におうわね。\n\t……まさか　宿屋にも\n\tたどりつけないのかしら？\n@c0@"
240:
  de: "@aGriselda@bDu hast doch mein Spezialkopfkissen dabei, oder? Ohne kann ich einfach nicht schlafen.\n@c0@"
  en: "@aDebora@bYou do have my special pillow with you, don't you?\r\nI can't possibly sleep without my own pillow.\n@c0@"
  es: "@aStefania@bTienes mi almohada speziale, ¿no?\nNo podría dormire sin mi almohada speziale.\n@c0@"
  fr: "@aPandora@bTu as bien mon oreiller spécial avec toi, heinⓡ\nJe ne peux absolument pas dormir sans mon\noreiller personnel.\n@c0@"
  it: "@aViola@bUn cuscino con le pulci?!\nNon lo userei nemmeno se mi regalassero cento vestiti nuovi!\n@c0@"
  ja: "@a@bデボラ「ちゃんと　私専用のマクラを\n\t持ってきてるでしょうね？\n\tマクラが変わると　寝られないのよ。\n@c0@"
241:
  de: "@aGriselda@bDu hast manchmal Alpträume, oder? Ich frage mich, was dir solche Sorgen bereitet.\n@c0@"
  en: "@aDebora@bYou have nightmares sometimes, don't you?\r\nI wonder what they're about.\n@c0@"
  es: "@aStefania@bTú tienes pesadillas algunas veces, ¿no?\nMe pregunto sobre qué... ¡Si aún no te he hecho niente!\n@c0@"
  fr: "@aPandora@bTu fais des cauchemars toi aussi, parfois, nonⓡ\nJe me demande sur quoi ils portent.\n@c0@"
  it: "@aViola@bCaro, tu fai mai brutti sogni?\nIo sì!\n㈡\nNei miei incubi peggiori tu non mi servi e non mi riverisci, e quando ti impartisco un ordine mi rispondi con una sonora pernacchia...\n@c0@"
  ja: "@a@bデボラ「そういえば　あんたも\n\tたまに　うなされているわよね？\n\t何に　うなされているのかしら。\n@c0@"
242:
  de: "@aGriselda@bWie erbärmlich! Er hat eindeutig einen über den Durst getrunken und zerfließt in Selbstmitleid.\n@c0@"
  en: "@aDebora@bHow pathetic! He's had too much to drink and he's making a show of himself.\n@c0@"
  es: "@aStefania@b¡Qué lastimoso! Se ha pasado con la bottiglia y ahora se está poniendo en ridículo.\n@c0@"
  fr: "@aPandora@bC'est pitoyableⓠ Il a trop bu et il se donne\nen spectacle.\n@c0@"
  it: "@aViola@bLe persone che si riducono in quello stato mi fanno una gran pena... Da un uomo di chiesa, poi, non me lo sarei mai aspettato!\n@c0@"
  ja: "@a@bデボラ「なさけない人。\n\tお酒を　飲みすぎて\n\tまわりが　見えてないのね。\n@c0@"
243:
  de: "@aGriselda@bⓞSchon wiederⓟ?! Also ist er öfter hier? Oje, mit dem sollte sich wirklich mal jemand unter vier Augen unterhalten.\n@c0@"
  en: "@aDebora@bⓗAgainⓘ!? So this is a regular thing?\nHe needs a good talking to, he does.\n@c0@"
  es: "@aStefania@b¡¿Fino?! No andará fino, ma se ha puesto fino.\nAlguien tiene que hablar due parole con él.\n@c0@"
  fr: "@aPandora@bⓥCe soirⓦⓡⓐ Ça veut dire qu'il vient régulièrement iciⓡ À mon avis, il a besoin qu'on lui parle sérieusement.\n@c0@"
  it: "@aViola@bSecondo me non sarà in grado di recitare sermoni nemmeno domattina, a giudicare da com'è conciato!\nSarà un miracolo se riuscirà ad alzarsi in piedi...\n@c0@"
  ja: "@a@bデボラ「今夜も？\n\t毎日　お酒におぼれているわけ？\n\tしつけが　必要そうね。\n@c0@"
244:
  de: "@aGriselda@bEs macht einen großen Unterschied, ob jemand als Diener oder als Sklave arbeitet. Letzteres finde ich einfach abscheulich.\n@c0@"
  en: "@aDebora@bThere's a big difference between having someone as your servant and having them as your slave. I find the latter very distasteful.\n@c0@"
  es: "@aStefania@bHay una gran diferencia entre tener un sirviente y tener un esclavo. Lo segundo es de molto mal gusto.\n@c0@"
  fr: "@aPandora@bIl y a une grosse différence entre un domestique et un esclave. Je trouve que posséder un esclave est de très mauvais goût.\n@c0@"
  it: "@aViola@bCaro, io ti chiedo di esaudire ogni mio desiderio e di servirmi e riverirmi, ma non mi sognerei mai di trattarti come uno schiavo...\n@c0@"
  ja: "@a@bデボラ「ドレイと　しもべは　違うわ。\n\t人をドレイとして　あつかうなんて\n\tゆるせないんだから。\n@c0@"
245:
  de: "@aGriselda@bIch würde schon dafür sorgen, dass alle still sind. Eine Frau braucht schließlich ihren Schönheitsschlaf.\n@c0@"
  en: "@aDebora@bI'd go and shut everyone up if it were me.\r\nThen I'd be able to get a good night's sleep.\n@c0@"
  es: "@aStefania@bYo haría callar a tutto il mondo. Así podría conciliar il sogno.\n@c0@"
  fr: "@aPandora@bÀ sa place, je me lèverais pour aller faire taire tout le monde. Comme ça je pourrais enfin passer une bonne nuit.\n@c0@"
  it: "@aViola@bSe intorno a me non c'è il silenzio più totale, non riesco a dormire! Ho bisogno della massima calma per godermi il mio sonno di bellezza...\n@c0@"
  ja: "@a@bデボラ「私だったら\n\t酒場の客も　となりの部屋の人も\n\tだまらせてから　ゆっくり　眠るわ。\n@c0@"
246:
  de: "@aGriselda@bWas für ein Radau! Ich hasse Männer mit solch ungehobelten Manieren!\n@c0@"
  en: "@aDebora@bWhat a din! I can't bear men with such\r\nuncouth habits.\n@c0@"
  es: "@aStefania@b¡Vaya jaleo! Veramente, no soporto a los hombres tan ordinarios.\n@c0@"
  fr: "@aPandora@bQuel vacarmeⓠ Je ne supporte pas les hommes aux manières si peu raffinées.\n@c0@"
  it: "@aViola@bCaro, ti ho già detto che se ti azzardassi a russare in quel modo ti farei ingoiare il cuscino...?\n@c0@"
  ja: "@a@bデボラ「うるさいわね～。\n\tデリカシーのない　男は　キライよ。\n@c0@"
247:
  de: "@aGriselda@bDu schnarchst nicht, oder? Nicht, dass ich es dir erlauben würde...\n@c0@"
  en: "@aDebora@bYou don't snore, do you?\nNot that I'd allow you to.\n@c0@"
  es: "@aStefania@bTú no roncas, ¿vero?\nMás te vale.\n@c0@"
  fr: "@aPandora@bTu ne ronfles pas, dis-moiⓡ\nDe toute façon, je ne t'y autoriserais pas.\n@c0@"
  it: "@aViola@b%0%a000090, te lo ripeto: non ti è consentito russare quando dormi con me.\n㈡\nE siccome dormirai accanto a me per tutta la vita, potrai russare solo da sveglio, e a non meno di trenta metri dalla sottoscritta.\n@c0@"
  ja: "@a@bデボラ「あんたは　イビキかかないわね。\n\tまっ　あんたは　イビキかく\n\t権利なんてないけど。\n@c0@"
248:
  de: "@aGriselda@bNoch lange kein Grund, sich so darüber auszulassen. Ich hätte fast Lust, ihm das Zeug abzunehmen..\n@c0@"
  en: "@aDebora@bThere's no need for him to make quite such a meal of it. I've a good mind to take it off him.\n@c0@"
  es: "@aStefania@bTampoco tiene por qué exagerar. Me dan ganas de quitárselo, veramente.\n@c0@"
  fr: "@aPandora@bPas la peine de nous en faire tout un plat.\r\nJ'ai bien envie de le lui prendre des mains.\n@c0@"
  it: "@aViola@bSe non ha problemi di linea, potrebbe anche aggiungerci uno sfilatino con prosciutto di Cinghialorco...\n@c0@"
  ja: "@a@bデボラ「あそこまで\n\tおいしく飲むなんて　ゆるせないわね。\n\t……とりあげたくなっちゃうわ。\n@c0@"
249:
  de: "@aGriselda@bHier kann man sich ja wirklich schlecht orientieren. Ob sich die Leute hier wohl je beim Einkaufen verirren?\n@c0@"
  en: "@aDebora@bIt is quite a frustrating place to navigate.\r\nI wonder if the people here ever get lost\r\non their way to the shops.\n@c0@"
  es: "@aStefania@bEste sitio puede ser veramente frustrante.\nMe pregunto si la gente se perderá aquí de camino a las tiendas.\n@c0@"
  fr: "@aPandora@bC'est assez pénible de se déplacer dans cet endroit. Je me demande si les gens se perdent parfois quand ils vont faire les boutiques.\n@c0@"
  it: "@aViola@bCaro, non dirmi che ci siamo persi anche noi...\n@c0@"
  ja: "@a@bデボラ「本当に　歩きづらい町よね。\n\tここの住人は　買い物に行くたびに\n\t迷ったりは　しないのかしら？\n@c0@"
250:
  de: "@aGriselda@bJa, das ist wirklich ein nettes Plätzchen. Vielleicht sollte ich hier ein kleines Nickerchen machen. Du passt doch auf mich auf, ja, %a000090?\n@c0@"
  en: "@aDebora@bIt's certainly a pleasant spot. Maybe I'll have a little snooze. You'll keep watch, won't you, %a000090?\n@c0@"
  es: "@aStefania@bEs un sitio molto piacevole. Quizá me eche un sonnellino. Tú vigilas, ¿capisci, %a000090?\n@c0@"
  fr: "@aPandora@bC'est effectivement un endroit agréable. Peut-être que je vais y faire une petite sieste. Tu montes la garde, entendu, %a000090ⓡ\n@c0@"
  it: "@aViola@bQuesto posto è talmente rilassante che quasi quasi mi faccio un pisolino.\n㈡\nSvegliami tra un paio d'ore, %a000090.\nE non dimenticare di portarmi un cappuccino e un paio di brioche.\n@c0@"
  ja: "@a@bデボラ「たしかに　気持ちがいいわね。\n\tここで　お昼寝でもしましょうか。\n\tあ　%a000090は　見はりをよろしくね。\n@c0@"
251:
  de: "@aGriselda@bHa! Er dachte, du würdest in der Schänke arbeiten! Da sieht man mal wieder, dass du tatsächlich der Dienertyp bist, %a000090.\n@c0@"
  en: "@aDebora@bHa! He thought you worked in the pub!\nJust goes to show that you look like the\nserving type, %a000090.\n@c0@"
  es: "@aStefania@b¡Ja! ¡Creía que trabajabas en el bar!\nEso demuestra que tienes pinta de servitore, %a000090.\n@c0@"
  fr: "@aPandora@bHaⓠ Il croyait que tu travaillais à la taverneⓠ Ça prouve que tu as bien l'air du genre à faire le service, %a000090.\n@c0@"
  it: "@aViola@bAh ah ah! Ti ha preso per il cameriere, %a000090!\n...\n㈡\nEhi!\nCome si permette di scambiare il mio adorato maritino per un cameriere?!\n@c0@"
  ja: "@a@bデボラ「店員さんと　まちがえられるなんて\n\tさすが　%a000090は　人に\n\t使われるタイプなだけあるわね。\n@c0@"
252:
  de: "@aGriselda@bDiese ganzen Flaschen hier sind nur für heute Nacht?!\n@c0@"
  en: "@aDebora@bSurely he doesn't mean that all of those bottles are for just one night!?\n@c0@"
  es: "@aStefania@b¡No querrá decir que todas esas bottiglie son para una sola notte, ¿no?!\n@c0@"
  fr: "@aPandora@bIl ne veut quand même pas dire que toutes ces bouteilles seront bues en une seule nuitⓡⓐ\n@c0@"
  it: "@aViola@bQuasi quasi prendo un frullato di mirtilli e Nauseafungus...\n@c0@"
  ja: "@a@bデボラ「今夜のしこみって……\n\tまさか　あんなに大量のお酒が\n\tひと晩で　なくなるの？\n@c0@"
253:
  de: "@aGriselda@bJetzt weiß ich, was hier los ist. Diese Stadt besteht nur aus Betrunkenen, darum sind die Straßen auch so ein Wirrwarr.\n㈡\nSie haben sie gebaut, als alle betrunken waren!\n@c0@"
  en: "@aDebora@bWell, that explains it. This town is full of drunks, and that's why the streets are so manic. They designed the layout when they were squiffy.\n@c0@"
  es: "@aStefania@bAhora todo está perfettamente claro. La città está llena de borrachos, por eso el trazado de las calles es tan loco.\n㈡\nLo diseñaron cuando estaban mezzo piripis.\n@c0@"
  fr: "@aPandora@bTout s'éclaireⓠ Cette ville est pleine d'ivrognes.\nC'est pour ça que les rues sont si embrouillées.\nIls ont tracé les plans avec un coup dans le nez.\n@c0@"
  it: "@aViola@bIl frullato di mirtilli e Nauseafungus fa molto bene alla pelle perché le tossine del fungo provocano una reazione...\n㈡\nInsomma, %a000090!\nFingi almeno di essere interessato quando ti parlo!\n@c0@"
  ja: "@a@bデボラ「なるほど……。　酔っぱらいが多い町\n\tだから　道もあんなに曲がってるのね。\n\t酔いながら　町の設計をしたんだわ。\n@c0@"
254:
  de: "@aGriselda@bMan sagt ja, dass Katzen anfangen zu sprechen, wenn sie alt werden, und es stimmt! Ich finde das gruselig.\n@c0@"
  en: "@aDebora@bPeople say that cats start to talk when they get old, and it's true. That's so creepy.\n@c0@"
  es: "@aStefania@bSe dice que los gatti empiezan a hablar cuando se hacen mayores, y es cierto. ¡Mamma mia!\n@c0@"
  fr: "@aPandora@bLes gens racontent que les chats commencent à parler quand ils deviennent vieux et c'est la vérité. C'est vraiment bizarre.\n@c0@"
  it: "@aViola@bMi piacerebbe avere un gatto parlante come animale da compagnia, ma solo se usasse un linguaggio forbito e sapesse conversare di diversi argomenti.\n@c0@"
  ja: "@a@bデボラ「ネコは　年をとると\n\tしゃべれるようになるって　ウワサだけど\n\t本当なのね……。　気もち悪いわ。\n@c0@"
255:
  de: "@aGriselda@bHm, da fällt mir ein, dass auch Nera immer mit unserem Hund Bingo geredet hat. Wahrscheinlich hat der Arme kein Wort verstanden...\n@c0@"
  en: "@aDebora@bCome to think of it, Nera was always chattering away to our dog Bingo. I'm sure he never understood a word, though.\n@c0@"
  es: "@aStefania@bAhora que recuerdo, Nera estaba siempre de charla con nuestro cane Bingo. Pero sonno sicura de que él no entendía niente.\n@c0@"
  fr: "@aPandora@bMaintenant que j'y repense, Nera parlait toujours à notre chien, Bingo. Mais je suis sûre qu'il n'a jamais rien compris à ce qu'elle disait.\n@c0@"
  it: "@aViola@bSai che Nera diceva di essere in grado di parlare con Bingo, il suo cane? Mia sorella ha sempre avuto una fantasia fin troppo fervida...\n@c0@"
  ja: "@a@bデボラ「そういえば　うちで飼っていた犬に\n\tフローラが　よく　ぶつぶつと\n\tひとりごとを言っていたけど……。\n@c0@"
256:
  de: "@aGriselda@bIch würde es hassen, an solch einem Ort schlafen zu müssen. Aber das hast du dir bestimmt schon gedacht, was, %a000090?\n@c0@"
  en: "@aDebora@bI'd hate having to sleep in a place like this.\nNo doubt you could've guessed that, though.\n@c0@"
  es: "@aStefania@bNo soportaría tener que dormire en un lugar così.\nPero sicuro que ya te lo imaginabas.\n@c0@"
  fr: "@aPandora@bJe détesterais être obligée de dormir dans un endroit pareil. Mais tu dois t'en douter sans que\r\nj'aie besoin de te le dire.\n@c0@"
  it: "@aViola@bNon credo che riuscirei a dormire in un posto del genere. Scommetto che l'avevi capito prima ancora che io lo dicessi, caro...\n@c0@"
  ja: "@a@bデボラ「私だったら　こんな所で寝るのは\n\t絶対に　イヤよ。\n\t言わなくても　わかっているでしょうけど。\n@c0@"
257:
  de: "@aGriselda@bSchon traurig, dass die Leute etwas trinken wollen, das so übel sein soll, dass es die Monster abschreckt.\n@c0@"
  en: "@aDebora@bIt's sad that people want to drink something that's supposed to be so evil it frightens monsters away.\n@c0@"
  es: "@aStefania@bEs triste que la gente quiera beber algo apertamente tan maligno que asusta a los mostri.\n@c0@"
  fr: "@aPandora@bC'est triste que les gens aient envie de boire quelque chose d'apparemment tellement mauvais que ça fait fuir les monstres.\n@c0@"
  it: "@aViola@bChi potrebbe mai voler bere una roba tanto cattiva da allontanare i mostri?!\nE soprattutto, che sapore avrà?!\n@c0@"
  ja: "@a@bデボラ「魔物さえも　にげだす……\n\tと　言われると　ほしくなるのが\n\t人間の悲しい性よね。\n@c0@"
258:
  de: "@aGriselda@bWenn wir es schaffen, welchen aufzutreiben, musst du ihn zuerst probieren und herausfinden, ob er auch gut genug für mich ist.\n@c0@"
  en: "@aDebora@bIf we manage to get hold of some, you'll have to taste it first and make sure it's good enough for me.\n@c0@"
  es: "@aStefania@bSi conseguimos un poco, deberás probarlo antes para comprobar que es adecuado per me.\n@c0@"
  fr: "@aPandora@bSi nous réussissons à en trouver, tu devras y goûter d'abord et t'assurer que c'est assez\r\nbon pour moi.\n@c0@"
  it: "@aViola@bCaro, se riusciremo a entrare in possesso di una bottiglia di Delizia di Milleventi l'assaggerai tu per primo, così potrai dirmi quant'è disgustosa.\n@c0@"
  ja: "@a@bデボラ「手に入れたら　毒見をかねて\n\tまず　あんたが　味見するのよ。\n@c0@"
