  it: "@aSignor Whitblanche@b%0%a001240 e %a001250... Crescerete sani, forti e belli, proprio come i vostri genitori! Cercate di non farli arrabbiare troppo, mi raccomando!\n@c0@"
  ja: "@a@bダンカン「よし　わかった。\n\t%a000090　早く　グランバニアに\n\t帰ってあげるといいぞ。\n@c0@"
90:
  de: "@aBianca@b%0%a000090!\nDu kommst uns besuchen!\n@c0@"
  en: "@aBianca@b%0%a000090!\nYou've come to visit!\n@c0@"
  es: "@aBianca@b¡%0%a000090!\n¡Has venido a visitarnos!\n@c0@"
  fr: "@aBianca@b%0%a000090ⓠ\nTu es venu nous rendre visiteⓠ\n@c0@"
  it: "@aBianca@b%0%a000090!\nChe bella sorpresa!\n@c0@"
  ja: "@a@bビアンカ「お父さん　また\n\t会いに来るからねっ。\n@c0@"
91:
  de: "@aBianca@bWir haben ja eine Menge Geschichten über dich gehört, wie du die Welt gerettet hast und so.\n@c0@"
  en: "@aBianca@bWe've heard all sorts of rumours here about you lot goin' off and savin' the world.\n@c0@"
  es: "@aBianca@bHemos oído toda clase de chismes, que has salvado el mundo o yo qué sé, ¿sabes?\n@c0@"
  fr: "@aBianca@bNous avons entendu toutes sortes de rumeurs par ici, qui disaient que vous étiez partis tous ensemble sauver le monde.\n@c0@"
  it: "@aBianca@bHo saputo che hai compiuto un'impresa incredibile...\nHai salvato il mondo!\nSanta dea! Solo a dirlo mi tremano le ginocchia!\n@c0@"
  ja: "@a@bダンカン「会いに来るのはいいが\n\t%a000090と　ケンカして　家出なんか\n\tしてくるなよ。　わっはっはっはっ。\n@c0@"
92:
  de: "@aBianca@bWer hätte gedacht, dass aus dir mal ein richtiger Held wird?\n@c0@"
  en: "@aBianca@bI never imagined you'd turn out to be such a force to be reckoned with.\n@c0@"
  es: "@aBianca@bNi se me pasó por la cabeza que llegaras a ser tan importante.\n@c0@"
  fr: "@aBianca@bJe n'aurais jamais cru que tu deviendrais une force avec laquelle il faut compter.\n@c0@"
  it: "@aBianca@bNon avrei mai immaginato che un giorno saresti diventato un guerriero tanto forte e coraggioso...\n@c0@"
  ja: "@a@bダンカン「どれ　わしの　かわいい\n\tマゴたちの顔を　よく\n\t見せておくれ。\n@c0@"
93:
  de: "@aBianca@bDamals als wir zusammen auf Geisterjagd gegangen sind, warst du jedenfalls zu nichts zu gebrauchen!\n@c0@"
  en: "@aBianca@bYou were no use to man or beast that time we went off ghost-bustin' together all them years ago!\n@c0@"
  es: "@aBianca@b¡Cuando íbamos a cazar fantasmas hace años no es que fueras gran cosa!\n@c0@"
  fr: "@aBianca@bTu n'étais pas bon à grand-chose la fois où nous sommes allés chasser les fantômes ensemble,\nil y a bien longtempsⓠ\n@c0@"
  it: "@aBianca@bNon prendertela a male, ma ricordo che quando andammo a caccia di spettri tanti anni fa ti dimostrasti una vera frana! Eh eh eh! Scherzo!\n@c0@"
  ja: "@a@bダンカン「%a001240に　%a001250。\n\tお父さんや　お母さん　のような\n\tりっぱな大人に　なるんだよ。\n@c0@"
94:
  de: "@aBianca@bDas ist wahrscheinlich dein guter Einfluss auf ihn, Nera.\n@c0@"
  en: "@aBianca@bI'm sure it must be your influence on him, Nera.\n@c0@"
  es: "@aBianca@bSeguro que la Nera tiene algo que ver, ¿me entiendes?\n@c0@"
  fr: "@aBianca@bÇa doit être votre influence sur lui, Nera.\n@c0@"
  it: "@aBianca@bMa dietro un grande uomo c'è sempre una donna in gamba... Nera, forse %a000090 non ce l'avrebbe fatta senza il tuo aiuto e senza il tuo amore.\n@c0@"
  ja: "@a@bビアンカ「まあ！　%a000090！\n\t会いに来てくれたのね！\n@c0@"
95:
  de: "@aBianca@bDu passt doch gut auf ihn auf, ja?\n@c0@"
  en: "@aBianca@bYou keep takin' good care of him, eh?\n@c0@"
  es: "@aBianca@bSigue cuidándomelo bien, ¿eh?\n@c0@"
  fr: "@aBianca@bPrenez bien soin de lui, d'accordⓡ\n@c0@"
  it: "@aBianca@bMi raccomando, abbi cura di questo discolaccio!\nIh ih ih!\n@c0@"
  ja: "@a@bビアンカ「あなたたちが　世界を\n\tすくったという　ウワサは\n\tこの村にも　とどいているわ。\n@c0@"
96:
  de: "@aWeißi@bIch war ganz schön überrascht, als ich hörte, dass du König von Humburg bist, %a000090.\n@c0@"
  en: "@aWhitey@bI was ever so surprised to find out about you bein' King of Gotha, %a000090.\n@c0@"
  es: "@aDoptada@bMenuda sorpresa cuando me enteré de que eres rey de Pankraz, %a000090.\n@c0@"
  fr: "@aAl@bJ'ai été tellement surpris de découvrir que tu étais roi de Gotha, %a000090.\n@c0@"
  it: "@aSignor Whitblanche@b%0%a000090, per me è stata una vera sorpresa scoprire che sei il Re di Denim.\n@c0@"
  ja: "@a@bビアンカ「でも　びっくり。\n\t%a000090が　こんなにも\n\tたくましくなるなんて……。\n@c0@"
97:
  de: "@aWeißi@bAber es ist schön, dass du dir immer noch Zeit für das einfache Volk nimmst.\n@c0@"
  en: "@aWhitey@bIt's lovely that you still take a bit of time out to come and see us common folk, though.\n@c0@"
  es: "@aDoptada@bMe alegro de que tengas tiempo para venir a visitar a los plebeyos.\n@c0@"
  fr: "@aAl@bC'est très gentil de prendre un peu de temps pour venir voir des gens tout simples comme nous.\n@c0@"
  it: "@aSignor Whitblanche@bMi riempie di gioia vedere che, nonostante la tua posizione, trovi ancora un po' di tempo da dedicare a noi persone comuni.\n@c0@"
  ja: "@a@bビアンカ「ずっと昔　２人で\n\tお化け退治をした頃は\n\tぜんぜん　頼りなかったのにね。\n@c0@"
98:
  de: "@aWeißi@bDu kannst uns jederzeit besuchen kommen, hörst du? Ich bin mir sicher, dass Bianca sich freuen würde.\n@c0@"
  en: "@aWhitey@bStop by whenever you feel like it, eh? I'm sure Bianca'll always be glad to see you.\n@c0@"
  es: "@aDoptada@bDéjate caer cuando quieras, ¿eh? A la Bianca seguro que le encanta.\n@c0@"
  fr: "@aAl@bSurtout, viens nous voir quand tu veux, d'accordⓡ Je suis sûr que Bianca sera toujours ravie de te voir.\n@c0@"
  it: "@aSignor Whitblanche@bCerca di non dimenticarti di noi, eh? Passa a trovarci, ogni tanto.\nIo e Bianca saremo sempre felici di vederti!\n@c0@"
  ja: "@a@bビアンカ「フローラさん。\n\tきっと　あなたの　おかげね。\n@c0@"
99:
  de: "@aBianca@bDu erscheinst mir gar nicht mehr fremd, Nera.\nUnd Griselda auch nicht.\n@c0@"
  en: "@aBianca@bYou dun't feel like a stranger to me any more, Nera. Neither does Debora.\n@c0@"
  es: "@aBianca@bYa no eres una extraña, Nera. Y Stefania también es como de la familia.\n@c0@"
  fr: "@aBianca@bJe n'ai plus l'impression que vous êtes une étrangère pour moi, Nera. Ni Pandora, d'ailleurs.\n@c0@"
  it: "@aBianca@bNera, per me sei una vera amica, e lo è anche Viola.\n@c0@"
  ja: "@a@bビアンカ「これからも\n\t%a000090のことを　よろしく\n\tお願いしますねっ。\n@c0@"
100:
  de: "@aBianca@bEs wäre doch nett, wenn wir alle uns noch besser kennenlernen könnten, nicht wahr?\n@c0@"
  en: "@aBianca@bIt'd be nice if we could all get to know each other even better, eh?\n@c0@"
  es: "@aBianca@bMe gustaría que nos conociéramos aún mejor, ¿me entiendes?\n@c0@"
  fr: "@aBianca@bCe serait bien de faire plus ample connaissance, nonⓡ\n@c0@"
  it: "@aBianca@bSpero che avremo tante altre occasioni per rivederci, così potremo conoscerci ancora meglio.\n@c0@"
  ja: "@a@bダンカン「%a000090が\n\tグランバニアの王さまだったとは\n\tわしも　おどろいたよ。\n@c0@"
101:
  de: "@a@b*: Miau.\n@c0@"
  en: "@a@b*: Meow.\n@c0@"
  es: "@a@b*: Miau.\n@c0@"
  fr: "@a@b*ⓢ Miaou.\n@c0@"
  it: "@a@b*: Miao!\n@c0@"
  ja: "@a@bダンカン「しかし　こうして\n\t気安く　たずねてくれて　そこが\n\t%a000090の　いいところだな。\n@c0@"
102:
  de: "@a@b*: Jetzt, wo wieder Frieden eingekehrt ist, wimmelt es hier bestimmt bald von Touristen...\n@c0@"
  en: "@a@b*: Now it's all peaceful again, the baths'll probably be crawlin' with tourists.\n@c0@"
  es: "@a@b*: Ahora que ha vuelto la paz, seguro que los baños se llenan de jamonas humeantes...\n@c0@"
  fr: "@a@b*ⓢ Maintenant que le calme est revenu, les bains vont être à nouveau bondés de touristes.\n@c0@"
  it: "@a@b*: Adesso che è tornata la tranquillità, probabilmente rivedremo i bagni termali riempirsi di splendide pulzelle! Eh eh eh!\n@c0@"
  ja: "@a@bダンカン「これからも　ちょくちょく\n\t遊びに来ておくれよ。\n\tビアンカも　よろこぶしな。\n@c0@"
103:
  de: "@a@b*: Aber die sollten sich besser hüten, uns Einheimischen den Platz wegzunehmen, sonst setzt es eine Tracht Prügel.\n@c0@"
  en: "@a@b*: Well they'd better leave space for us locals, or I might have to knock some heads together!\n@c0@"
  es: "@a@b*: ¡Ay, que a mí me da algo!\n@c0@"
  fr: "@a@b*ⓢ Alors ils ont intérêt à nous laisser de la place ou je vais en prendre un pour taper sur l'autreⓠ\n@c0@"
  it: "@a@b*: Spero solo che il mio vecchio cuore regga a uno spettacolo tanto emozionante...\n@c0@"
  ja: "@a@bビアンカ「フローラさんも　それに　\n\tデボラさんも　なんだか\n\t他人のような気がしなくて……。\n@c0@"
104:
  de: "@a@b*: Der alte Narr will einfach nicht begreifen, dass er kein junger Hüpfer mehr ist!\n@c0@"
  en: "@a@b*: That one just refuses to accept he's no spring chicken any more, the silly old fool!\n@c0@"
  es: "@a@b*: ¡Ese viejo asno se niega a aceptar que ya no es un polluelo!\n@c0@"
  fr: "@a@b*ⓢ Celui-là, il refuse d'admettre qu'il n'est plus\ndans la fleur de l'âgeⓠ Quel vieil imbécileⓠ\n@c0@"
  it: "@a@b*: Quel fossile d'uomo ha già un piede nella fossa e pensa ancora alle ragazze!\nRoba da non credersi!\n@c0@"
  ja: "@a@bビアンカ「フローラさん。\n\tこれからも　仲よく\n\tしましょうねっ。\n@c0@"
105:
  de: "@a@b*: Schnurr!\n@c0@"
  en: "@a@b*: Purrr!\n@c0@"
  es: "@a@b*: ¡Rrrr!\n@c0@"
  fr: "@a@b*ⓢ Ron-ronⓠ\n@c0@"
  it: "@a@b*: Miao!\n@c0@"
  ja: "@a@b＊「にゃ～う。\n@c0@"
106:
  de: "@a@b*: Jetzt kommt mein Sohn daher und will unbedingt Priester werden!\n@c0@"
  en: "@a@b*: That son of mine's only sayin' he wants to be a priest now, of all things!\n@c0@"
  es: "@a@b*: ¿Pues no le ha dado a mi mocoso por decir que quiere ser sacerdote?\n@c0@"
  fr: "@a@b*ⓢ Mon fiston me dit qu'il veut devenir prêtre, maintenantⓠ C'est pas possibleⓠ\n@c0@"
  it: "@a@b*: Mio figlio ha deciso di diventare sacerdote!\n@c0@"
  ja: "@a@b＊「平和になったし　この温泉にも\n\t今まで以上に　ピチピチギャルが\n\tやって来る　かも知れんのう。\n@c0@"
107:
  de: "@a@b*: Bei uns zu Hause sieht's aus wie in einer Kirche.\n@c0@"
  en: "@a@b*: He's got the inside of our house decked out like it was a church, y'know.\n@c0@"
  es: "@a@b*: Me tieⓘ la casa que parece una iglesia.\n@c0@"
  fr: "@a@b*ⓢ Il a décoré l'intérieur de notre maison comme si c'était une église.\n@c0@"
  it: "@a@b*: Ora ha persino addobbato casa nostra come se fosse una chiesa...\nQuel ragazzo mi manderà al manicomio!\n@c0@"
  ja: "@a@b＊「うひゃー。\n\tこりゃ　まいったわい。\n@c0@"
108:
  de: "@a@b*: Aber in der Welt ist wieder Friede eingekehrt. Vielleicht haben wir das ja meinem Jungen zu verdanken!\n@c0@"
  en: "@a@b*: Still, folk are sayin' the world's at peace again. Maybe it's thanks to my boy!\n@c0@"
  es: "@a@b*: Pero la gente dice que el mundo está en paz. ¡Quizá sea gracias al chaval!\n@c0@"
  fr: "@a@b*ⓢ N'empêche... Les gens disent que le monde est de nouveau en paix. C'est peut-être grâce à mon filsⓠ\n@c0@"
  it: "@a@b*: D'altra parte, potrebbero essere state proprio la sua fede e le sue preghiere a salvare il mondo dalla distruzione, no?\n㈡\n*: Sì, devono essere stati gli sforzi di mio figlio a riportarci la pace!\n@c0@"
  ja: "@a@b＊「おじいさんったら　いつまでも\n\t若いつもりなんだから。\n\tしょうのない人ですよ。\n@c0@"
109:
  de: "@a@b*: Ihr seid wirklich eine beeindruckende Truppe, was Ihr alles geleistet habt!\n@c0@"
  en: "@a@b*: Well, you folks are certainly an impressive team if ever there was one!\n@c0@"
  es: "@a@b*: ¡La verdad es que formáis un equipo impresionante!\n@c0@"
  fr: "@a@b*ⓢ On peut dire que vous formez une équipe impressionnante, ou je ne m'y connais pasⓠ\n@c0@"
  it: "@a@b*: Complimenti per la grandiosa impresa che %H0860%Xhai%Yavete%Z compiuto!\n@c0@"
  ja: "@a@b＊「にゃん　にゃん！\n@c0@"
110:
  de: "@a@b*: Man kann es Bianca wohl nicht verübeln, dass sie sich in Euch verliebt hat. Mal gewinnt man, mal verliert man, nicht wahr?\n@c0@"
  en: "@a@b*: I s'pose I can't blame Bianca for fallin' in love with you. You win some, you lose some, eh?\n@c0@"
  es: "@a@b*: No puedo culpar a la Bianca de prendarse de ti. Unos ganan y otros pierden, ¿eh?\n@c0@"
  fr: "@a@b*ⓢ Je ne peux pas vraiment reprocher à Bianca d'être tombée amoureuse de vous. Une de perdue, dix de retrouvées, heinⓡ\n@c0@"
  it: "@a@b*: Capisco perfettamente per quale motivo Bianca si sia innamorata di %O0960%Xte, %a000090. Sei una persona come non ce ne sono altre al mondo%Y%a000090. È una persona come non ce ne sono altre al mondo%Z!\n@c0@"
  ja: "@a@b＊「オラの息子は　神父に\n\tなりてえなんて　言ってよう。\n@c0@"
111:
  de: "@a@b*: Ich bin sehr, sehr glücklich.\n@c0@"
  en: "@a@b*: I'm pretty happy, I can tell you.\n@c0@"
  es: "@a@b*: Soy de lo más feliz.\n@c0@"
  fr: "@a@b*ⓢ Je suis plutôt content, je peux vous le dire.\n@c0@"
  it: "@a@b*: Sono felice!\nSono strafelice!\nSono strafelicissimo!\n@c0@"
  ja: "@a@b＊「家の中を\n\tまるで　教会みたいに\n\tかざっちまって……。\n@c0@"
112:
  de: "@a@b*: Und es war mein Schleier, den die Mutter des legendären Helden zur Hochzeit getragen hat!\nDie Mutter des Jungen, der die Welt gerettet hat!\n@c0@"
  en: "@a@b*: To think that the veil I made was worn by the mother of the boy who saved the world!\n@c0@"
  es: "@a@b*: ¡Y pensar que hice un velo para la madre del muchacho que salvó al mundo!\n@c0@"
  fr: "@a@b*ⓢ Dire que le voile que j'ai fabriqué a été porté par la mère du garçon qui a sauvé le mondeⓠ\n@c0@"
  it: "@a@b*: Fui io a tessere il velo nuziale che la madre del bambino che ha salvato il mondo indossò il giorno del suo matrimonio!\n@c0@"
  ja: "@a@b＊「けど世界が平和になったって\n\tいうし　ひょっとしたら\n\tそのおかげかも　知れないだよ。\n@c0@"
113:
  de: "@a@b*: Es gibt nicht viele Schleiermacher, die so etwas von sich behaupten können!\n@c0@"
  en: "@a@b*: There's not many veil-makers who can boast that kind o' thing!\n@c0@"
  es: "@a@b*: ¡Pocos en el ramo podrán presumir de algo así!\n@c0@"
  fr: "@a@b*ⓢ Il n'y a pas beaucoup de fabricants de voile qui peuvent se vanter de ce genre de chosesⓠ\n@c0@"
  it: "@a@b*: Non potrei avere pubblicità migliore per la mia attività!\n@c0@"
  ja: "@a@b＊「よう！\n\tまったく　たいした連中だな\n\tあんたらは！\n@c0@"
114:
  de: "@a@b*: Es geschah, wie die Göttin es bestimmt hat.\n@c0@"
  en: "@a@b*: It is all as the Goddess intended.\n@c0@"
  es: "@a@b*: Tal y como la Diosa quería.\n@c0@"
  fr: "@a@b*ⓢ Tout se passe selon le bon vouloir de la Déesse.\n@c0@"
  it: "@a@b*: Si è compiuto il volere della dea. Lei %H0860%Xti%Yvi%Z ha dato la forza e il coraggio per compiere quest'impresa che nessun altro avrebbe mai potuto portare a termine.\n@c0@"
  ja: "@a@b＊「さすがに　ビアンカさんが\n\tホレただけのことは　あるぜ。\n\tいや　負けたよ。\n@c0@"
115:
  de: "@a@b*: Möge die Göttin weiterhin Ihre schützende Hand über den legendären Helden und seine Familie halten.\n@c0@"
  en: "@a@b*: May the Goddess continue to bestow her blessing on the legendary hero and all members of his clan!\n@c0@"
  es: "@a@b*: ¡Que la Diosa siga otorgando su bendición al héroe legendario y a todos los miembros de su clan!\n@c0@"
  fr: "@a@b*ⓢ Puisse la Déesse continuer à accorder sa bénédiction au héros légendaire et à tous les membres de son clanⓠ\n@c0@"
  it: "@a@b*: Possa la luce della dea splendere sempre sull'Eroe Leggendario, sulla sua famiglia e sugli amici che l'hanno assistito nella sua avventura!\n@c0@"
  ja: "@a@b＊「しかし　うれしいねえ。\n@c0@"
116:
  de: "@a@b*: Ich bin viel zu glücklich, um heute arbeiten zu gehen! Viel zu glücklich!\n@c0@"
  en: "@a@b*: I'm too happy to do any work today!\nFar too happy!\n@c0@"
  es: "@a@b*: ¡Estoy demasiado feliz para trabajar!\r\n¡Qué maravilla!\n@c0@"
  fr: "@a@b*ⓢ Je suis bien trop heureux pour travailler aujourd'huiⓠ Bien trop heureuxⓠ\n@c0@"
  it: "@a@b*: Ahò, oggi nun me va de fatica'! So' troppo felice pe' mettermi a lavora'! Me sa che me sentirò troppo felice puro domano e dopodomano... Ah ah ah!\n@c0@"
  ja: "@a@b＊「オレが　ヴェールを　作った\n\t花嫁さんの　息子さんが\n\t世界を　すくったなんて。\n@c0@"
117:
  de: "@a@b*: Ich hätte nie gedacht, dass ich den Frieden noch erleben würde. Wie kann ich Euch jemals danken?\n@c0@"
  en: "@a@b*: I never imagined we'd see peace again in my lifetime. I dun't know how to thank you!\n@c0@"
  es: "@a@b*: Nunca imaginé que volvería a ver la paz. ¡No sé cómo %H0860%Xagradecértelo%Yagradercéroslo%Z!\n@c0@"
  fr: "@a@b*ⓢ Je n'aurais jamais imaginé voir la paix revenir de mon vivant. Je ne sais pas comment vous remercierⓠ\n@c0@"
  it: "@a@b*: Temevo che il mondo fosse spacciato, e invece l'Eroe Leggendario ci ha salvati tutti!\nEvviva il grande guerriero e i suoi compagni!\n@c0@"
  ja: "@a@b＊「オレも　ハナが　たけえや。\n@c0@"
118:
  de: "@a@b*: Gute Göttin! Ihr seid %H0860%X%A0110%Xeiner der Helden%Z%B0110%Xeine von denen%Z%Ydie Helden%Z, die den Großmeister von Nadiria besiegt haben, nicht wahr? Hi hi hi hi! Wie aufregend!\n@c0@"
  en: "@a@b*: Oh my! You're %H0860%Xone of the heroes%Ythe heroes%Z who defeated the Grandmaster of Nadiria, aren't you?\nTee hee hee hee! I'm so embarrassed!\n@c0@"
  es: "@a@b*: ¡Oh, cielos! %H0860%XEres %A0110%Xuno%Z%B0110%Xuna%Z de los héroes%YSois %R0000%Xlas heroinas%Ylos héroes%Z%Z que derrotaron al Gran Maestro de Nadiria, ¿no?\n¡Ji, ji, ji, ji! ¡Qué corte!\n@c0@"
  fr: "@a@b*ⓢ Oh là làⓠ Vous %H0860%Xfaites partie des héros%Yêtes les héros%Z qui ont vaincu le Grand Maître de Nadiria, n'est-ce pasⓡ\nTi-hi-hi-hiⓠ Je me sens si gênéeⓠ\n@c0@"
  it: "@a@b*: L'Eroe Leggendario che ha sconfitto il Gran Maestro Nimzo è un ragazzo bello, coraggioso e forte! Cosa non darei per essere la sua fidanzata...\n@c0@"
  ja: "@a@b＊「すべては　神の　おみちびき。\n@c0@"
119:
  de: "@a@b*: So, so. Dann herrscht wieder Frieden in der Welt, ja?\n@c0@"
