87:
  de: "@a@bⓞManche Bilder können die Seele des Menschen einfangen, der sie gemalt hat. Ich hoffe, dieses Bild ist eines davon.ⓟ\n@c0@"
  en: "@a@bⓗSome pictures manage to portray the very soul of the person who painted them. I hope that this is one such picture.ⓘ\n@c0@"
  es: "@a@bⓕCiertas imágenes son capaces de retratar la propia alma de la persona que las pintó. Espero que esta sea una de ellasⓖ.\n@c0@"
  fr: "@a@bⓥCertains tableaux parviennent à montrer l'âme de la personne qui les a peints. J'espère que ce tableau en fait partie.ⓦ\n@c0@"
  it: "@a@bⓕSpero che quest'immagine riesca a raffigurare la parte più intima dell'anima del suo autore...ⓖ\n@c0@"
  ja: "@a@b“絵は　時として　描いた者の心まで\n　うつし出す場合があります。\n　この絵が　そうであるように……。”\n@c0@"
88:
  de: "@a@bHinten auf einem Buch steht etwas in einer furchtbaren Handschrift:\n@c0@"
  en: "@a@bThere's something written on the back of a book in really terrible handwriting:\n@c0@"
  es: "@a@bEn la contraportada de un libro hay algo escrito con una caligrafía horrorosa:\n@c0@"
  fr: "@a@bQuelque chose est écrit au dos d'un livre.\nL'écriture est presque indéchiffrableⓢ\n@c0@"
  it: "@a@bC'è un volume su cui una mano incerta ha vergato le seguenti parole...\n@c0@"
  ja: "@a@b本の背表紙に　おそろしく\nきたない文字で\n何か　書かれている。\n@c0@"
89:
  de: "@a@bⓞGraaargh... Magdalena! Komm zu uns zurück, graaargh!ⓟ\n@c0@"
  en: "@a@bⓗGrarrrgh...Madalena! Come back to us soon, grarrrgh!ⓘ\n@c0@"
  es: "@a@bⓕGrarrrgh... ¡Perséfone! ¡Vuelve pronto con nosotros, grarrrgh!ⓖ.\n@c0@"
  fr: "@a@bⓥAaah... Magdalenaⓠ Reviens vite parmi nousⓠ Aaahⓠⓦ\n@c0@"
  it: "@a@bⓕGrarrrgh... Maddalena! Torrrna da noi prrresto! Grarrrgh!ⓖ\n@c0@"
  ja: "@a@b“うおーっ　マーサさま！！\n　はやく　この町に\n　帰ってきておくれよーっ！！”\n@c0@"
90:
  de: "@a@bHier steht ein Buch mit dem Titel ⓞMeditationenⓟ.\n@c0@"
  en: "@a@bThere's a book called ⓗMeditationsⓘ.\n@c0@"
  es: "@a@bHay un libro titulado ⓕMeditacionesⓖ.\n@c0@"
  fr: "@a@bIl s'agit d'un livre intitulé ⓥMéditationsⓦ.\n@c0@"
  it: "@a@bTra gli altri volumi, ce n'è uno intitolato ⓕRiflessioni di un potenteⓖ.\n@c0@"
  ja: "@a@b「瞑想の書」　と書かれた本が\n置いてある。\n@c0@"
91:
  de: "@a@bⓞKein Wesen auf dieser Welt kann je hoffen, gegen eine Macht wie die meine ankommen zu können.\n@c0@"
  en: "@a@bⓗNo being in this world may ever enjoy victory against such a formidable might as I possess.\n@c0@"
  es: "@a@bⓕNinguno de los seres de este mundo podrá lograr nunca la victoria contra mi formidable poderíoⓖ.\n@c0@"
  fr: "@a@bⓥAucun être de ce monde ne pourra rien contre ma toute-puissance.\n@c0@"
  it: "@a@bⓕNessuna creatura al mondo può sperare di battermi. Il mio potere è quanto di più grande si possa immaginare.ⓖ\n@c0@"
  ja: "@a@b“我を　倒すよろこびに\n　ふるえることが　できる者\n　この世には　あらず。\n@c0@"
92:
  de: "@a@bWer sich aber dennoch in mein tiefes Versteck wagt, verdient einen Funken Ruhm.\n@c0@"
  en: "@a@bⓗBut those who dare venture into my deep lair deserve a morsel of glory.\n@c0@"
  es: "@a@bⓕPero aquellos que se aventuren a entrar en la profundidad de mi guarida merecen un pedacito de gloriaⓖ.\n@c0@"
  fr: "@a@bMais ceux qui oseront me défier dans mon antre auront droit à un moment de gloire.\n@c0@"
  it: "@a@bⓕTuttavia, è mia intenzione ricompensare chi sarà tanto coraggioso da raggiungermi nella mia tana per sfidarmi...ⓖ\n@c0@"
  ja: "@a@b“しかし　我が地底を\n　おそれずに　進む者\n　栄光を得るべし。\n@c0@"
93:
  de: "@a@bIn mein Versteck im Norden, im giftigen Sumpf südlich vom Schachmatterhorn.ⓟ\n@c0@"
  en: "@a@bⓗThose who dare venture far to the north, to the poisonous swamp that lies south of Mt Zugzwang.ⓘ\n@c0@"
  es: "@a@bⓕMe refiero a los que osen aventurarse en el lejano norte, en el pantano ponzoñoso al sur del monte Zugzwangⓖ.\n@c0@"
  fr: "@a@bQu'ils viennent au nord, dans les marais empoisonnés situés au sud du mont Zugzwang.ⓦ\n@c0@"
  it: "@a@bⓕNell'estremo settentrione, nella palude che si trova a sud del Monte Zugzwang...ⓖ\n@c0@"
  ja: "@a@b“ここより　はるか北\n　エビルマウンテン南の\n　毒の沼地にて。”\n@c0@"
