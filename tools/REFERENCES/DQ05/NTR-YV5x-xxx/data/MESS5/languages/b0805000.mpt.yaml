  fr: "@a@bGénialⓠ C'est un livre sur Zénithia.\n@c0@"
  it: "@a@bUn libro su Zenithia!\nDev'essere interessantissimo!\n@c0@"
  ja: "@a@bなんと　天空の城について書かれた\n本を　発見した！\n@c0@"
11:
  de: "@a@bⓞEinst war hoch droben im Himmel ein Schloss. Doch als es seiner Kugeln beraubt ward, fiel es auf die Erde hernieder.\n@c0@"
  en: "@a@bⓗHigh in the heavens, there existed a castle. But, alas, it fell to the ground when its orbs were plundered.\n@c0@"
  es: "@a@bⓕEn lo alto del cielo había un castillo. Pero, ¡ay!, cuando lo despojaron de sus orbes, el castillo cayó a la tierraⓖ.\n@c0@"
  fr: "@a@bⓥAutrefois, dans le ciel se trouvait un château. Malheureusement, il chût lorsque ses orbes furent pillés.\n@c0@"
  it: "@a@bⓕTanto tempo fa, in cielo c'era un castello. Un brutto giorno, dal castello vennero sottratti dei globi, e il maniero precipitò al suolo...ⓖ\n@c0@"
  ja: "@a@b“空に　高く　存在せし　城ありき。\n　しかし　その城　オーブを失い\n　地に　落ちる……。\n@c0@"
12:
  de: "@a@bWenn die Kugeln an ihren rechtmäßigen Platz zurückgebracht werden, wird sich das Schloss von neuem in den Himmel erheben.ⓟ\n@c0@"
  en: "@a@bⓗWhen the orbs are returned to their rightful home, the castle will once again return to the skies.ⓘ\n@c0@"
  es: "@a@bⓕCuando los orbes sean devueltos a su lugar, el castillo regresará de nuevo a su celestial moradaⓖ.\n@c0@"
  fr: "@a@bLorsque les orbes seront restitués, le château reprendra sa place dans le ciel.ⓦ\n@c0@"
  it: "@a@bⓕQuando i globi torneranno al loro posto, il castello tornerà a fluttuare in cielo!ⓖ\n@c0@"
  ja: "@a@b“オーブを　取りもどす時\n　その城　ふたたび　天空に帰らん……。”\n@c0@"
13:
  de: "@a@bHier ist ein Bilderbuch mit dem Titel ⓞVier Freunde auf sechzehn Pfötchenⓟ. %0%a000120 nimmt es aus dem Regal und schaut es sich etwas genauer an.\n@c0@"
  en: "@a@bThere's a picture book called ⓗThe Four Great Furry Friendsⓘ. %0%a000120 takes it from the shelf and has a closer look.\n@c0@"
  es: "@a@bHay un libro para niños llamado ⓕLos cuatro grandes amigos peludosⓖ. %0%a000120 lo saca del estante y lo examina con más atención.\n@c0@"
  fr: "@a@bSur l'une d'elles se trouve un livre d'images intitulé ⓥLes quatre grands amis à fourrureⓦ.\n%0%a000120 le prend et l'ouvre.\n@c0@"
  it: "@a@bC'è un libro intitolato ⓕAmici per il peloⓖ.\n%0%a000120 lo prende dallo scaffale e lo apre...\n@c0@"
  ja: "@a@b「なかよし４人組」という\n絵本がある。\n%a000120は　手にとってみた。\n@c0@"
14:
  de: "@a@bⓞDies ist die Geschichte von vier Freunden, als da wären: der schlaue Säbel, der liebe Leo, der süße Mohikatz und der tapfere Schnurri.\n@c0@"
  en: "@a@bⓗLet me introduce four great furry friends. There's clever Saber, kind Leo, sweet Mohicat and brave Purrcy.\n@c0@"
  es: "@a@bⓕTe voy a presentar a cuatro grandes amigos peludos: el inteligente Sable, el amable Leopoldo, el amoroso Floro y el valiente Michiⓖ.\n@c0@"
  fr: "@a@bⓥJe vais vous parler de quatre grands amis à fourrure. Il y avait le finaud Smilo, le bon Léon,\nle tendre Crête et le fanfaron Tigron.\n@c0@"
  it: "@a@bⓕAmici lettori, permettetemi di presentarvi i nostri quattro amici di pelo: l'astuto Maculas, il cortese Leo, il dolce Moigatto e il coraggioso Miomao.ⓖ\n@c0@"
  ja: "@a@b“すてきな　なかよし　４にんぐみ。\n　かしこいボロンゴ　やさしいプックル\n　かわいいチロル　ゆうかんなゲレゲレ。\n@c0@"
15:
  de: "@a@bSie sind sich alle kein bisschen ähnlich. Alle sind besonders gut in einer Sache und haben ein Lieblingsessen, aber das ist bei jedem etwas anderes.\n@c0@"
  en: "@a@bⓗNone of them are the slightest bit alike. They're good at different things, and none of their favourite foods are the same.\n@c0@"
  es: "@a@bⓕNo se parecen nada de nada entre ellos. Cada uno sabe hacer cosas distintas, y sus comidas favoritas son también diferentesⓖ.\n@c0@"
  fr: "@a@bIls étaient tous différents. Ils avaient des qualités différentes et aimaient des nourritures différentes.\n@c0@"
  it: "@a@bⓕMaculas, Leo, Moigatto e Miomao sono diversi in tutto: nelle capacità, nelle abilità e nel carattere. Persino i loro gusti alimentari sono differenti!ⓖ\n@c0@"
  ja: "@a@b“みんな　ちっとも　にていない。\n　とくいなことも　すきなたべものも\n　ぜ～んぶ　ちがってる。\n@c0@"
16:
  de: "@a@bUnd doch sind sie die allerbesten Freunde. Natürlich streiten sie sich manchmal, aber es dauert nie lange, bis sie wieder einträchtig miteinander spielen.\n@c0@"
  en: "@a@bⓗAnd yet, they're the very best of friends. They do argue from time to time, of course, but they always make up and play nicely together again.\n@c0@"
  es: "@a@bⓕPero, aun así, son muy buenos amigos. Claro que a veces discuten, pero siempre se reconcilian y siguen jugando sin problemasⓖ.\n@c0@"
  fr: "@a@bMalgré tout, c'étaient les meilleurs amis du monde.\r\nIls se chamaillaient parfois, mais ils se rabibochaient toujours et jouaient à nouveau ensemble.\n@c0@"
  it: "@a@bⓕEppure, quei quattro sono ottimi amici. Certo, ogni tanto litigano tra loro, ma si chiariscono sempre e tornano a giocare insieme più uniti di prima.ⓖ\n@c0@"
  ja: "@a@b“だけど　４にんは　とってもなかよし。\n　たまには　ケンカも　するけれど\n　いつも　いっしょに　あそんでる。\n@c0@"
17:
  de: "@a@bDer schlaue Säbel, der liebe Leo, der süße Mohikatz und der tapfere Schnurri ⓚⓛ so gute Freunde findet man so bald nicht wieder!ⓟ\n@c0@"
  en: "@a@bⓗClever Saber, kind Leo, sweet Mohicat and brave Purrcy. You'll never find four friends so great...or so furry!ⓘ\n@c0@"
  es: "@a@bⓕEl inteligente Sable, el amable Leopoldo, el amoroso Floro y el valiente Michi. ¡Los mejores amigos... y los más peludos!ⓖ.\n@c0@"
  fr: "@a@bFinaud Smilo, bon Léon, tendre Crête et fanfaron Tigron. Jamais vous ne trouverez quatre amis plus fidèles... ni plus poilusⓠⓦ\n@c0@"
  it: "@a@bⓕL'astuto Maculas, il cortese Leo, il dolce Moigatto e il coraggioso Miomao non si separeranno mai!ⓖ\n@c0@"
  ja: "@a@b“かしこいボロンゴ　やさしいプックル\n　かわいいチロル　ゆうかんなゲレゲレ\n　すてきな　なかよし　４にんぐみ。”\n@c0@"
18:
  de: "@a@bDie Geschichte lässt in %a000120 eine Saite erklingen.\n@c0@"
  en: "@a@bThe story strikes something of a chord with %a000120.\n@c0@"
  es: "@a@bLa historia le toca la fibra sensible a %a000120.\n@c0@"
  fr: "@a@bL'histoire touche la corde sensible %G0120%Xd'%Yde %Z%a000120.\n@c0@"
  it: "@a@bChe storia bella e commovente!\n%0%a000120 ha le lacrime agli occhi...\n@c0@"
  ja: "@a@bと　書いてあるようだ。\n%a000120にも　なんとなく\n分かるような気がした。\n@c0@"
19:
