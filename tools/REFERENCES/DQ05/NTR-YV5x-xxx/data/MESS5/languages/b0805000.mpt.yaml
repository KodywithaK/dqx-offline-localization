20:
  de: "@a@bJemand hat eine Widmung hineingeschrieben: \nⓞWie wär' ohne dich die Welt so schal! Ich schenk' dir Küsse ohne Zahl... Für meine liebste Gräfin, in Liebeⓟ\n@c0@"
  en: "@a@bThere's an inscription inside the cover which reads:\nⓗHow dooo I love zee? Let me count ze vays...\nFor my dear Miss Count, viz love.ⓘ\n@c0@"
  es: "@a@bEn el interior de la portada hay una inscripción que dice: ⓕ¿Que cómo te quiero? A contar de cuuuántas formas voy...ⓖ.\n㈡\nⓕPara mi condesa amada, con cariño.ⓖ\n@c0@"
  fr: "@a@bSur la première page, vous pouvez lire cette dédicaceⓢ ⓥComme je vooous aime. Je vais vooous le conter... Pooour ma comtesse. Je vooous aime.ⓦ\n@c0@"
  it: "@a@bAll'interno del libro, c'è una dedica...\nⓕL'amooore veeero, l'amooore eteerno...\nÈ queeello che prooovo per teee, mia Conteeessa.ⓖ\n@c0@"
  ja: "@a@bうら表紙には\n「エリックより　愛するソフィアへ」と\nサインが　のこされている。\n@c0@"
