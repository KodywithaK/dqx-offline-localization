  it: "@a@bⓕIl nostro leader è una persona saggia e giusta, esempio di sapienza, saggezza e virtù per i suoi fedeli seguaci.ⓖ\n@c0@"
  ja: "@a@b“わが師は　賢者の中の賢者にして\n　王者の称号をもつ　唯一の存在。\n　この世に生まれ落ちた　現人神なり。\n@c0@"
78:
  de: "@a@b... wurde von der Dunkelheit geschluckt, bevor sich ihm die Gelegenheit bot, seine zahlreichen Weisheiten an uns weiterzugeben.\n@c0@"
  en: "@a@bⓗAlas, the Darkness did swallow him up before he could impart his many teachings to us.\n@c0@"
  es: "@a@bⓕLa oscuridad, ¡ay!, se lo llevó antes de que pudiese impartirnos sus numerosas enseñanzasⓖ.\n@c0@"
  fr: "@a@bMalheureusement, les ténèbres l'ont avalé avant qu'il puisse nous faire profiter de ses enseignements.\n@c0@"
  it: "@a@bⓕPurtroppo l'oscurità l'ha inghiottito, impedendogli di continuare a guidare ed educare il suo popolo.ⓖ\n@c0@"
  ja: "@a@b“師は　あまたの教えを\n　伝えきれぬまま　災いのチカラをあび\n　無念の死を　とげた。\n@c0@"
79:
  de: "@a@bUnd doch ist sein Wille ewig. Immer noch wartet er, wo kein Strahl der Sonne je hinfällt, auf die Ankunft des großen Helden. Des einen, wahren Helden.''\n@c0@"
  en: "@a@bⓗYet his will is everlasting. Even now, he waits, where no sun shall ever shine, for the Great One to arrive. The one true hero.ⓘ\n@c0@"
  es: "@a@bⓕSu voluntad, empero, es imperecedera. Aún ahora sigue esperando, allá donde los rayos del sol no llegarán jamás, la llegada del Magníficoⓖ.\n㈡\nⓕEl único y verdadero héroeⓖ.\n@c0@"
  fr: "@a@bCependant, il restera à tout jamais parmi nous. Aujourd'hui encore, là où le soleil ne brille jamais,\nil attend l'arrivée de l'Unique, le grand héros.ⓦ\n@c0@"
  it: "@a@bⓕIl nostro leader, però, non ha perso la speranza di tornare tra la sua gente!ⓖ\n㈡\nⓕPrigioniero in un luogo di tenebra eterna, attende fiducioso l'arrivo del Grande Eroe che libererà lui e il mondo intero dalla malvagia oscurità!ⓖ\n@c0@"
  ja: "@a@b“だが　師の意志は絶えず。\n　暗き穴の底にて　真の勇者を\n　今も　待ちつづけている。”\n@c0@"
80:
  de: "@a@bHier steht ein ziemlich eselsohriges Tagebuch, wohl von einem Zenithianer. %0%a000120 nimmt es aus dem Regal und schaut es sich etwas genauer an. \n@c0@"
  en: "@a@bThere's a rather dog-eared diary that looks to have been written by a Zenithian. %0%a000120 takes it from the shelf and has a closer look.\n@c0@"
  es: "@a@bHay un diario bastante ajado que parece haber sido escrito por alguien de Zenithia. %0%a000120 lo saca del estante y lo examina con más atención.\n@c0@"
  fr: "@a@bUn journal aux pages cornées qui semble avoir été écrit par un Zénithien attire le regard %E0120%X%G0120%Xd'%Yde %Z%Y%A0120%X%G0120%Xde l'%Ydu %Z%Z%B0120%X%G0120%Xde l'%Yde la %Z%Z%C0120%X%Z%Z%a000120. %A0120%XIl%Z%B0120%XElle%Z%C0120%X%Z le prend et y jette un coup d'œil.\n@c0@"
  it: "@a@bC'è un vecchio volume malridotto, scritto da uno Zenithiano.\n%0%a000120 lo prende e inizia a leggerne le pagine scolorite...\n@c0@"
  ja: "@a@bボロボロになった\n天空人の日記があった。\n%a000120は　手にとってみた。\n@c0@"
81:
  de: "@a@bⓞDen heiligen Eid gebrochen zu haben! Auf die Welt hinabgestiegen zu sein! Ach! Wie soll der Zenithdrache je vergeben...ⓟ\n@c0@"
  en: "@a@bⓗTo have violated the sacred oath! To descend to the world below! Alack! Howsoever shalt the Zenith Dragon forgive...ⓘ\n@c0@"
  es: "@a@bⓕ¡Violar el voto sagrado! ¡Descender al mundo inferior! ¡Condenación! Comoquiera que el dragón de Zenithia otorgue su perdón...ⓖ.\n@c0@"
  fr: "@a@bⓥVioler le serment sacréⓠ S'abaisser au monde du dessousⓠ Hélasⓠ Que le Dragon du Zénith soit miséricordieux...ⓦ\n@c0@"
  it: "@a@bⓕ... violare il sacro giuramento?! Egli è disceso nel mondo degli umani! Oh, Drago di Zenithia! Perdona coloro che...ⓖ\n@c0@"
  ja: "@a@b“禁をおかして　地に下りた彼女を\n　マスタードラゴンは　どんなに時が\n　たとうとも　お許しに……\n@c0@"
82:
  de: "@a@bDie darauffolgenden Seiten sind zu zerlesen, um noch etwas erkennen zu können.\n@c0@"
  en: "@a@bThe pages that follow are too worn to read.\n@c0@"
  es: "@a@bLas siguientes páginas están demasiado gastadas y no se pueden leer.\n@c0@"
  fr: "@a@bLes pages suivantes sont trop abîmées pour pouvoir être lues.\n@c0@"
  it: "@a@bIl resto del testo è praticamente illeggibile...\n%0%a000120 ripone il libro sullo scaffale.\n@c0@"
  ja: "@a@bそれより先は　ページが\nすりきれていて　読めなかった。\n@c0@"
83:
  de: "@a@bHier steht ein Buch mit dem Titel ⓞDie Sterne am Himmelszeltⓟ. %0%a000120 nimmt es aus dem Regal und schaut es sich etwas näher an.\n@c0@"
  en: "@a@bThere's a book called ⓗHeavenly Starsⓘ. %0%a000120 takes it from the shelf and has a closer look.\n@c0@"
  es: "@a@bHay un libro titulado ⓕCelestiales estrellasⓖ. %0%a000120 lo saca del estante y lo examina con más atención.\n@c0@"
  fr: "@a@bSur l'une d'elles se trouve un livre intitulé\nⓥLes étoiles dans le cielⓦ.\n%0%a000120 le prend et y jette un coup d'œil.\n@c0@"
  it: "@a@bC'è un interessante libro intitolato ⓕStelle celestiⓖ.\n%0%a000120 lo apre...\n@c0@"
  ja: "@a@b「星空のしんぴ」という本がある。\n%a000120は　手にとってみた。\n@c0@"
84:
  de: "@a@bEs enthält lauter Geschichten und Legenden über die Sterne.\n@c0@"
  en: "@a@bIt's full of myths and legends all about the stars.\n@c0@"
  es: "@a@bEstá lleno de mitos y leyendas sobre las estrellas.\n@c0@"
  fr: "@a@bIl s'agit de mythes et de légendes sur les étoiles.\n@c0@"
  it: "@a@bIl volume contiene moltissime informazioni scientifiche e svariate leggende sulle stelle.\n@c0@"
  ja: "@a@b星座に　まつわる\n神話や　言い伝えが\nくわしく書かれている。\n@c0@"
85:
  de: "@a@bEs ist eine alte Sammlung von Gemälden. %0%a000120 nimmt sie aus dem Regal und schaut sie sich etwas genauer an.\n@c0@"
  en: "@a@bIt's an ancient collection of paintings. %0%a000120 takes it from the shelf and has a closer look.\n@c0@"
  es: "@a@bEs una antigua colección de grabados. %0%a000120 la saca del estante y la examina con más atención.\n@c0@"
  fr: "@a@bIl s'agit d'un recueil de tableaux.\n%0%a000120 le prend et y jette un coup d'œil.\n@c0@"
  it: "@a@bQuesto sembra un volume di storia dell'arte.\n%0%a000120 lo prende e inizia a sfogliarlo.\n@c0@"
  ja: "@a@b古びた画集がある。\n%a000120は　手にとってみた。\n@c0@"
86:
  de: "@a@bEines der Gemälde trägt den folgenden Hinweis:\n@c0@"
  en: "@a@bOne of the paintings has the following note:\n@c0@"
  es: "@a@bUno de los grabados lleva la nota siguiente:\n@c0@"
  fr: "@a@bSous l'un des tableaux, il est écritⓢ\n@c0@"
  it: "@a@bIn una delle pagine è raffigurato un dipinto accompagnato dalla seguente nota:\n@c0@"
