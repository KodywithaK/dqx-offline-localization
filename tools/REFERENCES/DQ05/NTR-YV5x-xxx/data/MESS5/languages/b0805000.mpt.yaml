24:
  de: "@a@bHier ist ein Buch mit dem Titel ⓞDer Mensch, das unbekannte Wesenⓟ. %0%a000120 nimmt es aus dem Regal und liest ein paar Zeilen.\n@c0@"
  en: "@a@bThere's a book called ⓗThe Life of Humansⓘ. %0%a000120 takes it from the shelf and reads an excerpt.\n@c0@"
  es: "@a@bHay un libro titulado ⓕLa vida de los humanosⓖ. %0%a000120 lo saca del estante y lee un fragmento.\n@c0@"
  fr: "@a@bSur l'une d'elles se trouve un livre intitulé ⓥLa vie des humainsⓦ. %0%a000120 le prend et en lit un passage.\n@c0@"
  it: "@a@bC'è un libro intitolato ⓕLa vita degli esseri umaniⓖ.\n%0%a000120 lo prende dallo scaffale e ne legge un brano...\n@c0@"
  ja: "@a@b「人間の一生」と　書かれた本がある。\n%a000120は　手にとって読んだ。\n@c0@"
25:
  de: "@a@bⓞDer Mensch ist ein Wesen, das wesentlich schneller altert als wir Feen.\n@c0@"
  en: "@a@bⓗThe human is a creature that ages significantly faster than we faeriekind.\n@c0@"
  es: "@a@bⓕEl humano es una criatura que envejece con bastante rapidez en comparación con nosotras, las hadasⓖ.\n@c0@"
  fr: "@a@bⓥL'être humain est une créature qui vieillit bien plus rapidement que nous autres, les fées.\n@c0@"
  it: "@a@bⓕGli esseri umani sono creature che invecchiano molto più rapidamente di noi fate.ⓖ\n@c0@"
  ja: "@a@b“人間というのは　妖精にくらべると\n　ずっと早く　年をとる生き物である。\n@c0@"
26:
  de: "@a@bSo rasch geht diese Alterung vonstatten, dass zwei Menschen, die einander noch vor kurzem gesehen haben, sich plötzlich nicht mehr wiedererkennen.\n@c0@"
  en: "@a@bⓗIt's not unknown for humans to change so quickly that, even if two parties have met relatively recently, they do not recognise one another.\n@c0@"
  es: "@a@bⓕNo es raro que un humano cambie con tanta rapidez que dos personas que se han visto hace poco no se reconozcanⓖ.\n@c0@"
  fr: "@a@bParfois, il arrive que les êtres humains changent si vite que peu de temps après s'être rencontrés, il ne se reconnaissent pas.\n@c0@"
  it: "@a@bⓕNon di rado capita che due esseri umani che si incontrano a distanza di pochi anni non si riconoscano.ⓖ\n㈡\nⓕIl motivo di ciò è da ricercarsi nel repentino cambiamento che il tempo ha sul loro aspetto.ⓖ\n@c0@"
  ja: "@a@b“ついこの前　会ったはずの相手でも\n　ほんのちょっとの間に　姿が変わり\n　再会しても　気づかないほどだ。\n@c0@"
27:
  de: "@a@bDas ist nur ein Beispiel für die hastige und hektische Art der Menschen ⓚⓛ es liegen Welten zwischen ihr und unserem friedvollen Feenleben.ⓟ\n@c0@"
  en: "@a@bⓗThis is just one example of the hurried and busy lives humans lead, a world apart from our tranquil faerie ways.ⓘ\n@c0@"
  es: "@a@bⓕEsto no es más que un ejemplo de las vidas rápidas y ajetreadas de los humanos, tan alejadas de las costumbres de las hadasⓖ.\n@c0@"
  fr: "@a@bMais ce n'est là qu'un exemple de la vie effrénée que mènent les êtres humains, une vie si différente de la nôtre.ⓦ\n@c0@"
  it: "@a@bⓕI rapidi mutamenti dettati dallo scorrere del tempo dettano il ritmo della frenetica vita degli esseri umani.\n㈡\nNoi fate possiamo ritenerci fortunate di condurre un'esistenza ben più tranquilla e rilassata.ⓖ\n@c0@"
  ja: "@a@b“それだけに　人間の一生は\n　私たち　妖精からすると\n　目が回るほどに　あわただしい。”\n@c0@"
28:
  de: "@a@b%0%a000120 versucht, in einem Buch aus dem Regal zu lesen, aber die Wörter darin sind alle schrecklich lang und unmöglich zu verstehen.\n@c0@"
  en: "@a@b%0%a000120 tries to read a book on the bookshelf, but it's full of long words, and impossible to understand.\n@c0@"
  es: "@a@b%0%a000120 intenta leer un libro del estante, pero está lleno de palabras larguísimas y no lo puede entender.\n@c0@"
  fr: "@a@b%0%a000120 essaie de lire l'un des livres, mais les mots sont trop longs et trop compliqués pour qu'il puisse les comprendre.\n@c0@"
  it: "@a@b%0%a000120 prende un libro dallo scaffale e prova a leggerlo, ma è pieno di parole lunghe e difficili da capire...\n@c0@"
  ja: "@a@b%a000120は　本だなの本を\n読もうとした……　が\n文字が　読めなかった。\n@c0@"
29:
  de: "@a@bHier ist ein Buch mit dem Titel ⓞBaumische Weisheitenⓟ. %0%a000120 nimmt es aus dem Regal und liest ein paar Zeilen.\n@c0@"
  en: "@a@bThere's a book called ⓗFrom the Mouths of Treesⓘ. %0%a000120 takes it from the shelf and reads an excerpt.\n@c0@"
  es: "@a@bHay un libro titulado ⓕDe boca de los árbolesⓖ. %0%a000120 lo saca del estante y lee un fragmento.\n@c0@"
  fr: "@a@bSur l'une d'elles se trouve un livre intitulé ⓥCe que disent les arbresⓦ. %0%a000120 le prend et en lit un passage.\n@c0@"
  it: "@a@bC'è un libro intitolato ⓕGli alberi sono viviⓖ.\n%0%a000120 lo prende dallo scaffale e ne legge un brano...\n@c0@"
  ja: "@a@b「木々は語る」という本がある。\n%a000120は　手にとって読んだ。\n@c0@"
30:
  de: "@a@bⓞBäume sind Lebewesen.\n@c0@"
  en: "@a@bⓗTrees are living beings.\n@c0@"
  es: "@a@bⓕLos árboles son seres vivosⓖ.\n@c0@"
  fr: "@a@bⓥLes arbres sont des êtres vivants.\n@c0@"
  it: "@a@bⓕGli alberi sono esseri viventi.ⓖ\n@c0@"
  ja: "@a@b“木には　それぞれ\n　意思がある。\n@c0@"
31:
  de: "@a@bSie spüren den Wind in ihren Blättern, die Erde zu ihren Wurzeln und ihre höchsten Zweige ragen bis in den Himmel.\n@c0@"
  en: "@a@bⓗThey feel the breeze in their leaves, the ground with their roots, and they touch the sky with their uppermost branches.\n@c0@"
  es: "@a@bⓕSienten la brisa en sus hojas, la tierra en sus raíces, y tocan el cielo con sus ramas más altasⓖ.\n@c0@"
  fr: "@a@bIls sentent la brise dans leurs feuilles, embrassent le sol avec leurs racines et touchent le ciel avec leurs branchages.\n@c0@"
  it: "@a@bⓕSentono il vento con le loro foglie, il terreno con le radici, e il cielo con i rami protesi verso l'alto.ⓖ\n@c0@"
  ja: "@a@b“葉で風を　幹で空を\n　根で大地を感じて　生きている。\n@c0@"
32:
  de: "@a@bWenn sich auf der Welt Veränderungen ereignen, so spüren sie dies stärker als alle anderen Lebewesen.\n@c0@"
  en: "@a@bⓗThey feel more strongly than any other beings when change takes place in the world.\n@c0@"
  es: "@a@bⓕCuando el mundo cambia, sus sensaciones son más intensas que las de otros seresⓖ.\n@c0@"
  fr: "@a@bCe sont eux qui ressentent le plus fortement les changements qui ont lieu dans le monde.\n@c0@"
  it: "@a@bⓕProprio perché gli alberi sono in costante contatto con tutti gli elementi del mondo, essi avvertono prima di chiunque altro i cambiamenti in atto.ⓖ\n@c0@"
  ja: "@a@b“世界の変化を　誰よりも\n　深く　感じながら……\n@c0@"
33:
  de: "@a@bUnd sie sind es, die mit ihren mächtigen Stämmen die Kunde von dem verbreiten, was sich verändert hat.ⓟ\n@c0@"
  en: "@a@bⓗAnd it is they, with their mighty trunks, who tell the tales of all that has passed.ⓘ\n@c0@"
  es: "@a@bⓕY son ellos, en sus poderosos troncos, los que guardan las claves de la historiaⓖ.\n@c0@"
  fr: "@a@bEt ce sont eux, avec leurs troncs puissants, qui racontent les histoires du temps passé.ⓦ\n@c0@"
  it: "@a@bⓕE i tronchi degli alberi sono le pagine dure e vive su cui è scritta la storia di tutto ciò che è avvenuto.ⓖ\n@c0@"
  ja: "@a@b“世界の歴史を\n　大きな体で　語っている。”\n@c0@"
34:
  de: "@a@b%0%a000120 versucht, in einem Buch aus dem Regal zu lesen, aber die Wörter darin sind alle schrecklich lang und unmöglich zu verstehen.\n@c0@"
  en: "@a@b%0%a000120 tries to read a book on the bookshelf, but it's full of long words, and impossible to understand.\n@c0@"
  es: "@a@b%0%a000120 intenta leer un libro del estante, pero está lleno de palabras larguísimas y no lo puede entender.\n@c0@"
  fr: "@a@b%0%a000120 essaie de lire l'un des livres, mais les mots sont trop longs et trop compliqués pour qu'il puisse les comprendre.\n@c0@"
  it: "@a@b%0%a000120 prende un libro dallo scaffale e prova a leggerlo, ma è pieno di parole lunghe e difficili da capire...\n@c0@"
  ja: "@a@b%a000120は　本だなの本を\n読もうとした……　が\n文字が　読めなかった。\n@c0@"
35:
  de: "@a@bHier ist ein Buch mit dem Titel ⓞDas Mädchen vom Hochhinaus-Turmⓟ. %0%a000120 nimmt es aus dem Regal und liest ein paar Zeilen.\n@c0@"
  en: "@a@bThere's a book entitled ⓗThe Maiden of Abovitall Towerⓘ. %0%a000120 takes it from the shelf and reads an excerpt.\n@c0@"
  es: "@a@bHay un libro titulado ⓕLa doncella de la Torre Supremaⓖ. %0%a000120 lo saca del estante y lee un fragmento.\n@c0@"
  fr: "@a@bSur l'une d'elles se trouve un livre intitulé\nⓥLa demoiselle de la tour des Nuéesⓦ.\n%0%a000120 le prend et en lit un passage.\n@c0@"
  it: "@a@bC'è un libro intitolato ⓕLa fanciulla della Tur Magisⓖ.\n%0%a000120 lo prende dallo scaffale e ne legge un brano...\n@c0@"
  ja: "@a@b「神の塔の乙女」という\n題名の本がある。\n%a000120は　手にとってみた。\n@c0@"
36:
  de: "@a@bⓞEinst stieg ein Mädchen den Turm hinauf, in dem, wie es hieß, die Göttin lebte, denn es wollte herausfinden, ob es die Göttin tatsächlich gab.\n@c0@"
  en: "@a@bⓗThere was once a girl who climbed a tower where the Goddess was said to live, because she wanted to find out if the Goddess really existed.\n@c0@"
  es: "@a@bⓕHabía una vez una niña que subió a una torre en la que, según se contaba, vivía la Diosa, porque quería saber si la Diosa existía de verdadⓖ.\n@c0@"
  fr: "@a@bⓥIl était une fois une jeune fille qui gravit une tour où la Déesse était censée résider, car elle voulait savoir si elle existait.\n@c0@"
  it: "@a@bⓕTanti anni fa, una ragazza scalò la torre sulla cui cima si diceva che vivesse la dea. Il suo scopo era vedere se la dea esistesse davvero...ⓖ\n@c0@"
  ja: "@a@b“神の存在をうたがう少女は\n　真実を　たしかめるために\n　神が住むという塔に　のぼった。\n@c0@"
37:
  de: "@a@bDie Göttin legte dem Mädchen viele Hindernisse in den Weg, doch mutig überwand das Mädchen sie alle und gelangte schließlich bis hinauf in die Turmspitze.\n@c0@"
  en: "@a@bⓗThe Goddess put many obstacles in the young girl's path, but she courageously persevered until she reached the top of the tower.\n@c0@"
  es: "@a@bⓕLa Diosa dificultó el camino de la niña con muchos obstáculos, pero esta perseveró con gran valor hasta llegar a lo alto de la torreⓖ.\n@c0@"
  fr: "@a@bLa Déesse dressa de nombreux obstacles sur le chemin de la jeune fille, mais celle-ci persévéra\r\net atteignit le sommet de la tour.\n@c0@"
  it: "@a@bⓕLa dea pose diversi ostacoli lungo il cammino che portava alla sommità della torre, ma la fanciulla li superò tutti e raggiunse la vetta.ⓖ\n@c0@"
  ja: "@a@b“神をうたがう少女に　神は\n　いくつかの　試練をあたえるが\n　少女は　それを乗り越えた。\n@c0@"
38:
  de: "@a@bDort, so erzählt man sich, schenkte ihm die Göttin zum Lohn einen geheimnisvollen Spiegel, der die Wahrheit zeigen konnte.ⓟ\n@c0@"
  en: "@a@bⓗThere, legend has it that the Goddess rewarded her by bestowing on her a mysterious mirror with the power to reflect the truth.ⓘ\n@c0@"
  es: "@a@bⓕAllí, según cuenta la leyenda, la Diosa le otorgó como premio un misterioso espejo con el poder de reflejar la verdadⓖ.\n@c0@"
  fr: "@a@bLà, selon la légende, la Déesse l'aurait récompensée en lui donnant un miroir mystérieux ayant le pouvoir de refléter la vérité.ⓦ\n@c0@"
  it: "@a@bⓕPer ricompensarla dell'impresa compiuta, la dea donò alla ragazza uno specchio misterioso dotato del potere di mostrare il vero aspetto delle cose.ⓖ\n@c0@"
  ja: "@a@b“少女の勇気をたたえ　神は\n　塔の頂上で　真実をうつすという\n　不思議な鏡を　さずけたという。”\n@c0@"
39:
  de: "@a@bEs ist das Tagebuch des Leuchtturmwärters. %0%a000120 nimmt es aus dem Regal und liest ein paar Zeilen.\n@c0@"
  en: "@a@bIt's the lighthouse keeper's diary. %0%a000120 takes it from the shelf and reads an excerpt.\n@c0@"
  es: "@a@bSe trata del diario del farero. %0%a000120 lo saca del estante y lee un fragmento.\n@c0@"
  fr: "@a@bIl s'agit du journal du gardien du phare. %0%a000120 le sort de l'étagère et en lit un passage.\n@c0@"
  it: "@a@bÈ il diario del guaridano del faro.\n%0%a000120 lo prende dallo scaffale e ne legge una pagina...\n@c0@"
  ja: "@a@b灯台の管理人の日記がある。\n%a000120は　手にとって読んだ。\n@c0@"
40:
  de: "@a@bⓞHeute wieder blauer Himmel und ruhige See. Und wieder kam ein Besucher auf der Jagd nach mir, weil er mich für einen Oger oder so etwas hielt.\n@c0@"
  en: "@a@bⓗBlue skies and high seas again today. And there was yet another visitor come huntin' me out, thinkin' I was some kind of ogre or other.\n@c0@"
  es: "@a@bⓕHoy de nuevo cielo azul y mar gruesa. Y vino otro visitante que creía que yo era una especie de ogro o algo asíⓖ.\n@c0@"
  fr: "@a@bⓥCiel dégagé et marée haute à nouveau aujourd'hui. Une fois de plus, quelqu'un s'en est pris à moi parce qu'il croyait que j'étais un cannibale.\n@c0@"
  it: "@a@bⓕOggi la giornata è trascorsa tranquilla, tranne che per l'arrivo dell'enneismo visitatore venuto a chiedermi se io sia un Orco. Ma che domanda è?!ⓖ\n@c0@"
  ja: "@a@b“○月×日　晴天　波高し。\n　今日も　オレを魔物と　カンちがいした\n　旅人がいた。\n@c0@"
41:
  de: "@a@bIch verstehe das einfach nicht! Zugegeben, ich bin nicht gerade eine Schönheit, aber...\n@c0@"
  en: "@a@bⓗI just can't fathom it! I know I'm not the prettiest of folk, but even so...\n@c0@"
  es: "@a@bⓕ¡De verdad que no lo entiendo! Ya sé que no soy ninguna belleza, pero aún así...ⓖ.\n@c0@"
  fr: "@a@bⓥJ'en ai vraiment assezⓠ Soit, je ne suis pas végétarien, mais quand même...\n@c0@"
  it: "@a@bⓕCi sono rimasto malissimo! So bene di non essere la persona più attraente del mondo, ma non sembro mica un Orco, eh?! Grunt! Grunt!ⓖ\n@c0@"
  ja: "@a@b“いったい　なぜだろうか？\n　オレの　顔が　こわいのか？\n@c0@"
42:
  de: "@a@bSo oft ich auch in den Spiegel schaue, um eine Antwort zu finden, die Sache ist und bleibt mir ein Rätsel.ⓟ\n@c0@"
  en: "@a@bⓗI keep lookin' in the mirror to see if I can find me an answer, but I'm still completely stumped.ⓘ\n@c0@"
  es: "@a@bⓕNo dejo de mirarme en el espejo para ver si encuentro una respuesta, pero sigo estando del todo perplejoⓖ.\n@c0@"
  fr: "@a@bJ'ai beau chercher, je ne comprends pas.ⓦ\n@c0@"
  it: "@a@bⓕContinuo a guardarmi nello specchio per capire cosa c'è che non va nel mio aspetto, ma non noto nulla di strano... Grunt! Grunt! Grunt!ⓖ\n@c0@"
  ja: "@a@b“鏡を　ながめてみるが\n　今日も　答えは　みつからない……。”\n@c0@"
43:
  de: "@a@bHier stehen jede Menge schlau aussehender Bücher.\n@c0@"
  en: "@a@bThere are lots of intellectual-looking books lined up.\n@c0@"
  es: "@a@bHay una gran cantidad de libros de lo más cultivado, perfectamente ordenados.\n@c0@"
  fr: "@a@bElles sont pleines de livres qui ont l'air terriblement difficiles.\n@c0@"
  it: "@a@bSu questo scaffale sono allineati diversi libri dai titoli molto difficili...\n@c0@"
  ja: "@a@bむずかしい本が　ならんでいる。\n@c0@"
44:
  de: "@a@bAber bei näherem Hinsehen scheinen sie voller kindlicher Kritzeleien zu sein.\n@c0@"
  en: "@a@bBut, on closer inspection, they appear to be full of children's scribblings.\n@c0@"
  es: "@a@bPero, al examinarlos mejor, parece que están cubiertos de garabatos de niños.\n@c0@"
  fr: "@a@bMais, en y regardant de plus près, ils sont remplis de gribouillages d'enfants.\n@c0@"
  it: "@a@bAll'interno dei volumi, però, ci sono solo scarabocchi fatti da bambini!\n@c0@"
  ja: "@a@b……が　中を　よくみてみると\n子供の落書きだらけ　だった。\n@c0@"
45:
  de: "@a@bHier ist ein Buch über den Orden vom Zugzwang mit dem Titel ⓞKönig Korols Katechismusⓟ. %0%a000120 nimmt es aus dem Regal und liest ein paar Zeilen.\n@c0@"
  en: "@a@bThere's a book of Zugzwang teachings entitled ⓗKing Korol's Catechismⓘ. %0%a000120 takes it from the shelf and reads an excerpt.\n@c0@"
  es: "@a@bHay un libro de enseñanzas de Zugzwang titulado ⓕCatecismo según Korolⓖ. %0%a000120 lo saca del estante y lee un fragmento.\n@c0@"
  fr: "@a@b%0%a000120 trouve un recueil des enseignements du Zugzwang intitulé ⓥLe catéchisme du roi Korolⓦ.\n%A0120%XIl%Z%B0120%XElle%Z%C0120%X%Z le prend et en lit un passage.\n@c0@"
  it: "@a@bC'è un libro sulla Setta di Zugzwang, intitolato ⓕBreviario di Re Krocorovⓖ. %0%a000120 lo prende dallo scaffale e ne legge un brano...\n@c0@"
  ja: "@a@b「イブールの本」と呼ばれる\n光の教団の　教典がある。\n%a000120は　手にとってみた。\n@c0@"
46:
  de: "@a@bⓞErstes Gebot\nWer gegen die Lehren des Ordens verstößt, dem bleibt das Paradies des Weißen Königs verschlossen.\n@c0@"
  en: "@a@bⓗFirst Commandment\nThose who disobey the doctrine of the Order will not be granted access to the White King's Paradise.\n@c0@"
  es: "@a@bⓕPrimer mandamientoⓖ\n㈡\nⓕA aquellos que desobedezcan la doctrina de la Orden se les denegará el acceso al Paraíso del Rey Blancoⓖ.\n@c0@"
  fr: "@a@bⓥPremier commandementⓢ\nCeux qui ne respectent pas la doctrine de l'Ordre ne rejoindront pas le Paradis du Roi blanc.\n@c0@"
  it: "@a@bⓕPrimo Comandamento: a chi non osserverà i comandamenti della Setta di Zugzwang non sarà garantito l'accesso al Paradiso del Re Bianco.ⓖ\n@c0@"
  ja: "@a@b“約束の１\n　教団の教えに　そむく者は\n　光の国へ　たどりつけないだろう。\n@c0@"
47:
  de: "@a@bZweites Gebot\nWer Vertrauen in König Korol hat, der kann der Liebe der Göttin gewiss sein.ⓟ\n@c0@"
  en: "@a@bⓗSecond Commandment\nThose who have faith in King Korol will in turn have the love of the Goddess.ⓘ\n@c0@"
  es: "@a@bⓕSegundo mandamiento\nAquellos que tengan fe en el rey Korol recibirán a su vez el amor de la Diosaⓖ.\n@c0@"
  fr: "@a@bDeuxième commandementⓢ\nCeux qui ont foi en le roi Korol recevront l'amour de la Déesse.ⓦ\n@c0@"
  it: "@a@bⓕSecondo Comandamento: solo a chi dimostrerà di avere fede nel Divino Re Krocorov verrà garantita la salvezza eterna.ⓖ\n@c0@"
  ja: "@a@b“約束の２\n　大教祖イブールを　信じる者は\n　神に　愛されるだろう。\n@c0@"
48:
  de: "@a@bUnd in der Art geht es weiter und weiter.\n@c0@"
  en: "@a@bThe rest of it seems to go on in much the same way.\n@c0@"
  es: "@a@bEl resto tiene aspecto de no ser muy distinto.\n@c0@"
  fr: "@a@bLe reste du livre est du même acabit.\n@c0@"
  it: "@a@bIl resto del volume è pieno di sciocchezze simili...\nNon vale la pena continuare a leggerlo.\n@c0@"
  ja: "@a@b……あとは　同じような内容の\nくりかえしだった。\n@c0@"
49:
  de: "@a@bHier ist ein Buch mit dem Titel ⓞHeilkräuter in Wort und Bildⓟ. %0%a000120 nimmt es aus dem Regal und schaut es sich etwas genauer an.\n@c0@"
  en: "@a@bThere's a book called ⓗAn Illustrated Guide to Medicinal Herbsⓘ. %0%a000120 takes it from the shelf and has a closer look.\n@c0@"
  es: "@a@bHay un libro titulado ⓕGuía ilustrada de plantas medicinalesⓖ. %0%a000120 lo saca del estante y lo examina con más atención.\n@c0@"
  fr: "@a@bSur l'une d'elles se trouve un livre intitulé\nⓥGuide illustré des herbes médicinalesⓦ.\n%0%a000120 le prend et en lit un passage.\n@c0@"
  it: "@a@bC'è un libro intitolato ⓕGuida illustrata alle erbe medicinaliⓖ. %0%a000120 lo prende dallo scaffale e inizia a sfogliarlo...\n@c0@"
  ja: "@a@b「やくそう図鑑」と書かれた本がある。\n%a000120は　手にとってみた。\n@c0@"
50:
  de: "@a@bEs ist voller Bilder und detaillierter Beschreibungen der verschiedenen Arten von Heilkräutern und wie sie wirken.\n@c0@"
  en: "@a@bIt's full of pictures and detailed descriptions of the different types of medicinal herbs and what they do.\n@c0@"
  es: "@a@bEstá lleno de imágenes y descripciones detalladas de los distintos tipos de plantas medicinales y sus efectos.\n@c0@"
  fr: "@a@bIl contient les descriptions détaillées et de nombreuses illustrations des différents types d'herbes médicinales.\n@c0@"
  it: "@a@bCome suggerisce il titolo, il volume contiene numerose illustrazioni di erbe medicinali e informazioni sulle loro proprietà.\n@c0@"
  ja: "@a@bやくそうの種類や　ききめなど\nこまかい説明が　図入りで\n記されている。\n@c0@"
51:
  de: "@a@b%0%a000120 nimmt ein Buch aus dem Regal und schaut es sich etwas genauer an.\n@c0@"
  en: "@a@b%0%a000120 takes a book from the shelf and has a closer look.\n@c0@"
  es: "@a@b%0%a000120 saca un libro del estante y lo examina con más atención.\n@c0@"
  fr: "@a@b%0%a000120 sort un livre d'une étagère et le feuillette.\n@c0@"
  it: "@a@b%0%a000120 prende un libro dallo scaffale e lo apre...\n@c0@"
  ja: "@a@b%a000120は　本だなの本を\n手にとってみた。\n@c0@"
52:
  de: "@a@bZwischen den Seiten steckt ein Chimärenflügel!\n@c0@"
  en: "@a@bTucked in between the pages is a chimaera wing!\n@c0@"
  es: "@a@b¡Oculta entre las páginas encuentra un ala de quimera!\n@c0@"
  fr: "@a@bUne aile de chimère est glissée entre ses pagesⓠ\n@c0@"
  it: "@a@bNascosta tra le pagine c'è un'ala di chimera!\n@c0@"
  ja: "@a@bなんと　本の間に\nキメラのつばさが　はさまっていた！\n@c0@"
53:
  de: "@a@b%0%a000180 erhält den Chimärenflügel.\n@c0@"
  en: "@a@b%0%a000180 acquires the chimaera wing.\n@c0@"
  es: "@a@b%0%a000180 obtiene el ala de quimera.\n@c0@"
  fr: "@a@b%0%a000180 récupère l'aile de chimère.\n@c0@"
  it: "@a@b%0%a000180 prende l'ala di chimera.\n@c0@"
  ja: "@a@b%a000180は　キメラのつばさを\n手に入れた！\n@c0@"
54:
  de: "@a@bHier steht ein Buch mit dem Titel ⓞBekömmlicher Bund fürs Lebenⓟ. %0%a000120 nimmt es aus dem Regal und liest ein paar Zeilen.\n@c0@"
  en: "@a@bThere's a book called ⓗWholesome Matrimonyⓘ. %0%a000120 takes it from the shelf and reads an excerpt.\n@c0@"
