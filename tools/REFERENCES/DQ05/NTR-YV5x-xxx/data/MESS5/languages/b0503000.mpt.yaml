0:
  de: "@aBianca@bDass du dich für mich entschieden hast, und nun findet jetzt schon die Hochzeit statt... Ich weiß nicht, das kommt alles so plötzlich.\n@c0@"
  en: "@aBianca@bYou choosin' me and this weddin' goin' ahead already... I dunno, it all feels so sudden.\n@c0@"
  es: "@aBianca@bVas y me eliges y de repente la boda... No sé, ha sido todo muy repentino.\n@c0@"
  fr: "@aBianca@bTu me choisis et ce mariage est maintenant\r\nsur le point d'être célébré... C'est drôle, tout\r\nparaît si soudain.\n@c0@"
  it: "@aBianca@bE così stiamo per sposarci...\nMi sembra incredibile, sai?\nÈ successo tutto così all'improvviso...\n@c0@"
  ja: "@a@bビアンカ「%a000090に　選んでもらえたと\n\t思ったら　もう　結婚式だなんて…\n\tなんだか　展開が　早すぎよね。\n@c0@"
1:
  de: "@aBianca@bAber das soll nicht heißen, dass ich nicht glücklich bin. Ich habe dich schon immer schrecklich gern gehabt, %a000090.\n@c0@"
  en: "@aBianca@bBut that dun't mean I en't happy about it.\nI've always bin a big fan of yours, %a000090.\n@c0@"
  es: "@aBianca@bPero yo encantada, ¿eh?\nSiempre te he admirado mucho, %a000090.\n@c0@"
  fr: "@aBianca@bMais ça ne veut pas dire que je ne suis pas heureuse. Je t'ai toujours beaucoup aimé, %a000090.\n@c0@"
  it: "@aBianca@bMa sono felice che tu abbia scelto di prendermi in moglie.\nHo sempre avuto un debole per te, %a000090.\n@c0@"
  ja: "@a@bビアンカ「でも　私　うれしいよ。\n\tだって　%a000090のこと\n\tずっと　大好きだったから。\n@c0@"
2:
  de: "@aBianca@bJetzt habe ich zum ersten Mal Schminke verwendet. Sieht das einigermaßen in Ordnung aus?\n@c0@"
  en: "@aBianca@bThis is the first time I've ever tried on any make-up. Do I look alright in it?\n@c0@"
  es: "@aBianca@bEs la primera vez que me pongo maquillaje.\r\n¿Me queda bien?\n@c0@"
  fr: "@aBianca@bC'est la première fois que je me maquille.\nTu trouves que ça me va bienⓡ\n@c0@"
  it: "@aBianca@bQuesta è la prima volta che mi trucco...\nChe dici?\nSto bene?\n@c0@"
  ja: "@a@bビアンカ「お化粧なんて　生まれて初めて\n\tしてもらっちゃった。\n\t私の顔　ヘンじゃないかしら？\n@c0@"
3:
  de: "@aBianca@bDanke, %a000090. Es fühlt sich nur ein wenig komisch an, das ist alles.\n@c0@"
  en: "@aBianca@bThanks, %a000090. It feels a bit funny to me, that's all.\n@c0@"
  es: "@aBianca@bGracias, %a000090. Me resulta raro, nada más.\n@c0@"
  fr: "@aBianca@bMerci, %a000090. C'est juste que ça me fait\nun peu bizarre.\n@c0@"
  it: "@aBianca@bGrazie, %a000090.\nTi confesso che non mi sento molto a mio agio con questa roba in faccia...\n@c0@"
  ja: "@a@bビアンカ「ありがとう…　%a000090。\n@c0@"
4:
  de: "@aBianca@bHa ha! Ja, ich weiß. Es steht mir nicht, oder? Augen zu und durch! Bis die Feier vorbei ist, werde ich es wohl überleben.\n@c0@"
  en: "@aBianca@bHa ha! Yeah, I know. It dun't suit me, eh? I s'pose I'll just have to put up with it until the ceremony's over.\n@c0@"
  es: "@aBianca@b¡Ja, ja! Sí, lo sé. No me pega, ¿eh? Tendré que seguir con él hasta que termine la ceremonia.\n@c0@"
  fr: "@aBianca@bHa haⓠ Oui, je sais. Ça ne me va pas, heinⓡ\nBon, il va seulement falloir que je le supporte\njusqu'à la fin de la cérémonie.\n@c0@"
  it: "@aBianca@bAh ah ah! Hai ragione!\nNemmeno io sono abituata a vedermi conciata in questo modo!\n㈡\nBeh, comunque mi toccherà sopportarlo finché la cerimonia non sarà terminata...\n@c0@"
  ja: "@a@bビアンカ「うふふ　そうよね。\n\tらしくないよね。　でも\n\t式が終わるまでは　ガマンしてね。\n@c0@"
5:
  de: "@aBianca@bIch bin immer noch ganz baff, um ehrlich zu sein. Weißt du, ich war doch so sicher, dass du dich für Nera entscheiden würdest.\n@c0@"
  en: "@aBianca@bI'm still a bit bowled over, to be honest.\r\nI was sure you'd pick Nera, y'see.\n@c0@"
  es: "@aBianca@bAún estoy un poco sorprendida, para ser sincera.\r\nEstaba segura de que te ibas a quedar con Nera, ¿sabes?\n@c0@"
  fr: "@aBianca@bPour être franche, je suis encore un peu stupéfaite. J'étais certaine que tu choisirais Nera.\n@c0@"
  it: "@aBianca@bSono ancora stupita...\n\rVedi, ero convinta che avresti scelto Nera.\n@c0@"
  ja: "@a@bビアンカ「私　じつは　とまどってるの。\n\tだって　%a000090は　フローラさんを\n\t選ぶとばかり　思ってたから……。\n@c0@"
6:
  de: "@aBianca@bHa ha! Das ist jetzt irgendwie komisch, oder? Wir werden uns schon noch daran gewöhnen. Schließlich sind wir von jetzt an immerzu zusammen.\n@c0@"
  en: "@aBianca@bHa ha! This feels a bit awkward, dun't it? We've got time to get used to it, though. We'll be together all the time from now on.\n@c0@"
  es: "@aBianca@b¡Ja, ja! Qué raro es todo, ¿eh? Aunque tenemos tiempo para acostumbrarnos. Desde ahora estaremos siempre juntos, ¿sabes?\n@c0@"
  fr: "@aBianca@bHa haⓠ Ça fait tout drôle, nonⓡ Mais on va avoir le temps de s'habituer. On sera toujours ensemble\nà partir de maintenant.\n@c0@"
  it: "@aBianca@bD'ora in poi saremo sempre insieme!\nÈ una sensazione nuova per me, sai?\nEro sempre stata da sola...\n㈡\nComunque, ora abbiamo tutto il tempo che ci serve per abituarci alla nostra nuova situazione!\n@c0@"
  ja: "@a@bビアンカ「えへへ…　なんだか\n\tテレくさいね。　でも　これからは\n\tずうっと　いっしょだよ。\n@c0@"
7:
  de: "@aBianca@bEin schöner Tag heute, findest du nicht?\nHach, hier zu sein, wo wir geheiratet haben...\nDa wird mir ganz warm ums Herz!\n@c0@"
  en: "@aBianca@bIt's a lovely day today, dun't you think? Bein' here where we got wed makes me feel all...happy inside!\n@c0@"
  es: "@aBianca@bHoy hace un día precioso, ¿no crees? Estar en el sitio donde nos casamos me hace sentir... ¡feliz como una lombriz!\n@c0@"
  fr: "@aBianca@bC'est une belle journée, tu ne trouves pasⓡ\nLe fait d'être à l'endroit où nous nous sommes\nmariés me rend... toute heureuseⓠ\n@c0@"
  it: "@aBianca@bAh, che bella giornata!\nQuesto posto mi mette di buonumore! Del resto, è logico che sia così... È qui che ci siamo sposati!\n@c0@"
  ja: "@a@bビアンカ「今日も　いい天気ね。\n\t結婚式をあげた　町だからかな…\n\tなんだか　心が　ウキウキするわ。\n@c0@"
8:
  de: "@aBianca@bEs war wirklich eine wundervolle Hochzeit. Die werde ich nie vergessen, so lange ich lebe.\n@c0@"
  en: "@aBianca@bIt really was a wonderful weddin'.\nI'll never forget it as long as I live.\n@c0@"
  es: "@aBianca@bFue una boda maravillosa.\r\nNunca la olvidaré.\n@c0@"
  fr: "@aBianca@bÇa a vraiment été un merveilleux mariage.\r\nJe m'en souviendrai aussi longtemps que je vivrai.\n@c0@"
  it: "@aBianca@bNon dimenticherò mai le emozioni che ho provato il giorno delle nostre nozze, amore mio...\n@c0@"
  ja: "@a@bビアンカ「私も…　あんな立派な\n\t結婚式をあげてもらったこと\n\t一生　忘れられないな。\n@c0@"
9:
  de: "@aBianca@bHa ha! Kinder sind ja so süß, findest du nicht? Ich will auch eins!\n@c0@"
  en: "@aBianca@bHa ha! Children are so sweet, don't you think?\r\nI want one!\n@c0@"
  es: "@aBianca@b¡Ja, ja! Los niños son un encanto, ¿no crees?\r\n¡Quiero uno!\n@c0@"
  fr: "@aBianca@bHa haⓠ Les enfants sont si mignons, tu ne trouves pasⓡ Je veux en avoir unⓠ\n@c0@"
  it: "@aBianca@bAh ah ah! I bambini sono così dolci...\r\nNe voglio uno! Anzi, due!\r\nMa no, facciamo tre, e non se ne parli più! Eh eh eh!\n@c0@"
  ja: "@a@bビアンカ「うふふ。　子供ってかわいいね。\n\t私も　欲しくなってきちゃったな。\n\tねっ…　あ　な　た！\n@c0@"
10:
  de: "@aBianca@bTja, Nera muss wohl ganz von vorn anfangen mit der Suche nach einem Mann, nicht?\n@c0@"
  en: "@aBianca@bI s'pose Nera's right back to square one in lookin' for someone to marry now.\n@c0@"
  es: "@aBianca@bNera se habrá vuelto a poner a buscar marido.\n@c0@"
  fr: "@aBianca@bJe suppose que Nera est revenue à la case départ dans sa quête d'un époux, maintenant.\n@c0@"
  it: "@aBianca@bMa senti che razza di cafone maleducato!\nBah, meglio ignorarlo...\n@c0@"
  ja: "@a@bビアンカ「でも　これでまた\n\tフローラさんの　おムコさん探しは\n\tふりだしに　戻ったのよね。\n@c0@"
11:
  de: "@aBianca@bIch hoffe, sie findet genau den Richtigen, so wie ich.\n@c0@"
  en: "@aBianca@bI hope she manages to find a perfect man just\r\nlike I have.\n@c0@"
  es: "@aBianca@bEspero que encuentre un hombre perfecto, como yo, ¿sabes?\n@c0@"
  fr: "@aBianca@bJ'espère qu'elle réussira à trouver un mari parfait, tout comme moi.\n@c0@"
  it: "@aBianca@bComunque, auguro a Nera di trovare presto l'uomo che la renderà felice per tutta la vita...\n@c0@"
  ja: "@a@bビアンカ「フローラさん\n\tちゃんと　いい人と\n\t結婚できると　いいんだけどな……。\n@c0@"
12:
  de: "@aBianca@bUh! Wie schrecklich! Die Leute, die so einen bedienen müssen, tun mir leid!\n@c0@"
  en: "@aBianca@bUrgh! How disgustin'! I feel sorry for people havin' to serve the likes of him!\n@c0@"
  es: "@aBianca@b¡Agh! ¡Qué desagradable! ¡Pobre del que tenga que atenderle esta noche!\n@c0@"
  fr: "@aBianca@bBeurkⓠ C'est dégoûtantⓠ Je plains les gens qui doivent servir les types comme luiⓠ\n@c0@"
  it: "@aBianca@bMa è disgustoso!\nCerta gente non è in grado di capire quand'è il momento di fermarsi...\n@c0@"
  ja: "@a@bビアンカ「きゃっ　きたなーい！\n\tお店の人も　大変よね。\n@c0@"
13:
  de: "@aBianca@bTja, ich schätze, man sieht es mir an ⓚⓛ aber ich finde die Ehe einfach wunderbar. Ich bin so glücklich wie nie.\n@c0@"
  en: "@aBianca@bI s'pose it's pretty obvious, but I think marriage is amazin'. I've never bin happier.\n@c0@"
  es: "@aBianca@bSupongo que es evidente, pero esto del matrimonio está muy bien. Nunca había sido tan feliz, ¿sabes?\n@c0@"
  fr: "@aBianca@bJ'imagine que c'est une évidence, mais je trouve que le mariage est quelque chose d'incroyable. Je n'ai jamais été aussi heureuse.\n@c0@"
  it: "@aBianca@bIl matrimonio è una cosa meravigliosa!\nNon sono mai stata così felice!\nSperiamo che duri, eh?\n㈡\nAh ah ah! Non fare quella faccia, %a000090...\nStavo solo scherzando!\nSai bene che ti starò accanto finché vivrò...\n@c0@"
  ja: "@a@bビアンカ「自分が　結婚したから\n\t言うわけじゃないけど…\n\t結婚って　いいよねっ。\n@c0@"
14:
  de: "@aBianca@bEs ist mir immer ganz peinlich, wenn die Leute so was sagen!\n@c0@"
  en: "@aBianca@bI feel all embarrassed when folk say\r\nthings like that!\n@c0@"
  es: "@aBianca@b¡Me da mucho corte cuando la gente dice cosas así!\n@c0@"
  fr: "@aBianca@bJe suis un peu gênée quand les gens tiennent\nce genre de proposⓠ\n@c0@"
  it: "@aBianca@bOh, ma che bel complimento!\nHa ragione: siamo proprio una splendida coppia!\n@c0@"
  ja: "@a@bビアンカ「うふふ。\n\tあんなふうに　言われると\n\tくすぐったくなっちゃうな。\n@c0@"
15:
  de: "@aBianca@bDas sind gute Nachrichten. Da wird Nera aber erleichtert sein.\n@c0@"
  en: "@aBianca@bThat's good news. Nera will be relieved.\n@c0@"
  es: "@aBianca@bEstupendo. Nera estará aliviada, ¿sabes?\n@c0@"
  fr: "@aBianca@bVoilà de bonne nouvelles. Nera doit être soulagée.\n@c0@"
  it: "@aBianca@bOh, questa sì che è una buona notizia!\nScommetto che adesso Nera si sentirà più tranquilla.\n@c0@"
  ja: "@a@bビアンカ「良かったわ。\n\tこれで　フローラさんも\n\t安心するでしょうね。\n@c0@"
16:
  de: "@aBianca@bIch hoffe, wir bleiben zusammen, bis wir so alt sind wie sie.\n@c0@"
  en: "@aBianca@bI hope we get to stay together until\r\nwe're their age.\n@c0@"
  es: "@aBianca@bEspero que sigamos juntos a su edad, ¿sabes?\n@c0@"
  fr: "@aBianca@bJ'espère que nous serons encore ensemble,\r\nà leur âge.\n@c0@"
  it: "@aBianca@bSpero che rimarremo insieme fino a quando avremo l'età di quell'uomo, e anche oltre...\n@c0@"
  ja: "@a@bビアンカ「私たちも　あんなふうに\n\tおじいさん　おばあさんになるまで\n\tいっしょに　いられるといいわね。\n@c0@"
17:
  de: "@aBianca@bLothar hat sich anscheinend plötzlich erholt.\n@c0@"
  en: "@aBianca@bCrispin seems to have made a sudden recovery.\n@c0@"
  es: "@aBianca@bCrispín se ha recuperado de repente.\n@c0@"
  fr: "@aBianca@bGaëtan semble avoir récupéré très vite.\n@c0@"
  it: "@aBianca@bA quanto pare, lo stato di salute di Candido è migliorato all'improvviso...\n@c0@"
  ja: "@a@bビアンカ「アンディさん　急に\n\tたくましくなったわね。\n@c0@"
18:
  de: "@aBianca@bWenn er so starke Gefühle für sie hegt, dann wird es wohl nicht lange dauern, bis die beiden den Bund fürs Leben schließen.\n@c0@"
  en: "@aBianca@bIf he feels that strongly, then I reckon it's just a matter of time before he and Nera tie the knot.\n@c0@"
  es: "@aBianca@bSi tanto le gusta, a poco tardar él y Nera acaban juntos, ya verás.\n@c0@"
  fr: "@aBianca@bS'il est aussi épris, je parie que ce ne sera qu'une question de temps avant que Nera et lui ne convolent.\n@c0@"
  it: "@aBianca@bHo la sensazione che l'amore che prova per Nera abbia accelerato la sua guarigione... Il mio intuito mi dice che quei due convoleranno presto a nozze!\n@c0@"
  ja: "@a@bビアンカ「あの気持ちがあれば\n\tフローラさんと　結婚できるように\n\tなるのも　時間の問題ね。\n@c0@"
19:
  de: "@aBianca@bUnser Verhältnis ist sicher deswegen so eng, weil wir nicht zusammen aufgewachsen sind. Ich möchte alles nur Mögliche tun, um dir zu helfen, %a000090.\n@c0@"
  en: "@aBianca@bI think it's because we grew up apart that we go so well together now. I want to do everythin' I can to support you, %a000090.\n@c0@"
  es: "@aBianca@bCreo que nos llevamos tan bien porque crecimos separados. Quiero hacer todo lo que pueda para ayudarte, %a000090.\n@c0@"
  fr: "@aBianca@bJe crois que c'est parce que nous avons grandi chacun de notre côté que nous allons si bien\nensemble aujourd'hui.\n㈡\nJe tiens à tout faire pour te soutenir, %a000090.\n@c0@"
  it: "@aBianca@bCredo che abbia ragione, sai?\nNoi due siamo cresciuti lontani l'uno dall'altra, e ora stiamo insieme... Ti amo, %a000090.\n@c0@"
  ja: "@a@bビアンカ「べつべつに　育ったからこそ\n\tおぎなえる部分が　あると思うの。\n\t私は　%a000090を　支えてあげたいな。\n@c0@"
20:
  de: "@aBianca@bWenn ich hier die Augen zumache, kann ich mir ganz genau vorstellen, wie es bei der Hochzeit war.\n@c0@"
  en: "@aBianca@bWhen I close my eyes here, I can imagine exactly how everythin' was durin' our weddin'.\n@c0@"
  es: "@aBianca@bCuando cierro los ojos aquí recuerdo exactamente cómo fue toda la boda.\n@c0@"
  fr: "@aBianca@bQuand je ferme les yeux, je revois très précisément tous les détails de notre mariage.\n@c0@"
  it: "@aBianca@bSe chiudo gli occhi, riesco a rivivere ogni istante del nostro matrimonio...\n@c0@"
  ja: "@a@bビアンカ「この場所で　目を閉じると\n\tいつでも　あの結婚式の場面が\n\tうかんでくるわね。\n@c0@"
21:
  de: "@aBianca@bGlaubst du, ich werde jemals so mit dir reden, %a000090?\n@c0@"
  en: "@aBianca@bD'you think I'll ever end up talkin' to you like that, %a000090?\n@c0@"
  es: "@aBianca@b¿Crees que algún día terminaré hablándote así, %a000090?\n@c0@"
  fr: "@aBianca@bTu crois que je finirai par te parler comme ça,\nun jour, %a000090ⓡ\n@c0@"
  it: "@aBianca@bCredi che finirò anch'io per parlarti in quel modo, %a000090?\n@c0@"
  ja: "@a@bビアンカ「私も　いつか\n\tあんなふうに　%a000090に\n\t言うようになるのかしら。\n@c0@"
22:
  de: "@aBianca@bHa ha! Dann ist es wohl gut, dass du schon darauf vorbereitet bist!\n@c0@"
  en: "@aBianca@bHa ha! I s'pose it's a good thing that you're prepared and expectin' it then!\n@c0@"
  es: "@aBianca@b¡Ja, ja! ¡Hombre precavido, vale por dos!\n@c0@"
  fr: "@aBianca@bHa haⓠ Dans ce cas, c'est une bonne chose que\ntu t'y attendes et que tu t'y prépares déjàⓠ\n@c0@"
  it: "@aBianca@bAh ah ah!\nBuon per te che sai già come andremo a finire!\nAlmeno non sarai impreparato...!\n@c0@"
  ja: "@a@bビアンカ「じゃあ　%a000090は\n\tもう　カクゴできてるってことで\n\tいいかしら？　うふふ。\n@c0@"
23:
  de: "@aBianca@bGenau. Du tust hoffentlich genau das, was ich dir sage, ohne dass ich ständig an dir herumnörgeln muss, nicht? Ha ha!\n@c0@"
  en: "@aBianca@bYeah. Hopefully you'll just do as you're told without me needin' to nag, eh! Ha ha!\n@c0@"
  es: "@aBianca@bSí. Esperemos que hagas lo que te diga sin que te tenga que echar la bronca, ¿eh? ¡Ja, ja!\n@c0@"
  fr: "@aBianca@bOui. Avec un peu de chance, tu feras tout ce que je te dirai sans que j'aie besoin de te harcelerⓠ Ha haⓠ\n@c0@"
  it: "@aBianca@bHai ragione, non lo farò.\nTra noi ci saranno sempre rispetto e comprensione...\n@c0@"
  ja: "@a@bビアンカ「そうよね。　そうならなくて\n\tすむように　%a000090にも\n\tがんばってもらわないとね。　うふふ。\n@c0@"
24:
  de: "@aBianca@bMir macht es nichts aus, dir das Essen zu kochen, %a000090! Wenigstens hin und wieder!\n@c0@"
  en: "@aBianca@bI dun't mind makin' dinner for you, %a000090. Every now and then, anyway!\n@c0@"
  es: "@aBianca@bA mí no me importa hacerte la cena, %a000090. ¡Bueno, al menos de vez en cuando!\n@c0@"
  fr: "@aBianca@bÇa ne m'ennuierait pas de te préparer ton dîner, %a000090. Au moins une fois de temps en temps, en tout casⓠ\n@c0@"
  it: "@aBianca@bA proposito, %a000090...\nTi ho già detto che in cucina sono una vera catastrofe?\n㈡\nNo, credo di non averti parlato di questo dettaglio...\nAltrimenti non mi avresti mai chiesto di sposarti!\nAh ah ah!\n@c0@"
  ja: "@a@bビアンカ「%a000090の　ごはんは\n\tずっと　私が　作ってあげるから\n\t心配しないでね。\n@c0@"
25:
  de: "@aBianca@bDie Uniform dieser Magd ist so hübsch, findest du nicht? Vielleicht lässt Herr Onassetti sie das tragen, um was Hübsches zum Anschauen zu haben!\n@c0@"
  en: "@aBianca@bThis maid's uniform is so pretty, dun't you think? Maybe old Mr Briscoletti had her wear it so he'd have somethin' nice to look at!\n@c0@"
  es: "@aBianca@bEl uniforme de esa doncella es precioso, ¿no crees? ¡Quizá el viejo Rimaldi se lo haga poner para mirarla!\n@c0@"
  fr: "@aBianca@bLa tenue de la bonne est vraiment jolie,\ntu ne trouves pasⓡ\n㈡\nPeut-être que ce bon vieux Oscuroni la lui fait porter pour avoir quelque chose de joli à regarderⓠ\n@c0@"
  it: "@aBianca@bQuella signorina indossa una divisa molto carina, non credi?\r\nSto parlando della DIVISA, non della SIGNORINA!\n@c0@"
  ja: "@a@bビアンカ「前から　思ってたんだけど\n\tここのメイドさんの服　かわいいよね。\n\tルドマンさんの　シュミかしら？\n@c0@"
26:
  de: "@aBianca@bHarry und Maria sind offenbar schon wieder abgereist. Wie schade. Ich hätte mich gern noch ein wenig mit den beiden unterhalten.\n@c0@"
  en: "@aBianca@bLooks like Harry and Maria have gone back already. That's a shame. I was hopin' to have a nice chat with the both of 'em.\n@c0@"
  es: "@aBianca@bParece que Froilán y María se han vuelto ya. ¡Qué lástima! Esperaba poder charlar con ellos, ¿sabes?\n@c0@"
  fr: "@aBianca@bHarry et Maria sont déjà repartis, apparemment. C'est dommage. J'espérais avoir l'occasion de discuter un peu avec eux.\n@c0@"
  it: "@aBianca@bE così Robert e Maria sono già andati via...\r\nPeccato. Mi sarebbe piaciuto scambiare quattro chiacchiere con loro.\n@c0@"
  ja: "@a@bビアンカ「ヘンリーさんたち　もう\n\t帰っちゃったの？　残念ね。\n\tゆっくり　話したかったのに。\n@c0@"
27:
  de: "@aBianca@bOnassetti ist wirklich großzügig, nicht? Hoffentlich meint er nicht, wir wollten das ausnutzen.\n@c0@"
  en: "@aBianca@bBriscoletti's really generous, eh? I hope he dun't think we're takin' advantage of him.\n@c0@"
  es: "@aBianca@bEste Rimaldi es de lo más generoso, ¿eh? Espero que no piense que nos aprovechamos de él, ¿sabes?\n@c0@"
  fr: "@aBianca@bOscuroni est vraiment généreux, heinⓡ\nJ'espère qu'il ne croit pas que nous profitons de lui.\n@c0@"
  it: "@aBianca@bMister Fosconi è proprio una brava personaa, eh?\nSpero che non pensi che stiamo approfittando della sua generosità...\n@c0@"
  ja: "@a@bビアンカ「ルドマンさんって\n\tすごい　太っ腹ね。　いいのかしら\n\tこんなに　よくしてもらっちゃって。\n@c0@"
28:
  de: "@aBianca@bDas also ist der Zenithiaschild? Komisch, mir ist fast so, als hätte ich ihn schon einmal gesehen.\n@c0@"
  en: "@aBianca@bSo this is the Zenithian Shield? I can't\r\nexplain why, but I feel almost like I've\r\nseen it somewhere before.\n@c0@"
  es: "@aBianca@bAsí que este es el Escudo de Zenithia. No puedo explicar por qué, pero siento como si ya lo hubiera visto antes, ¿sabes?\n@c0@"
  fr: "@aBianca@bAlors voilà le Bouclier zénithienⓡ Je ne sais pas pourquoi, mais j'ai presque l'impression de l'avoir déjà vu quelque part.\n@c0@"
  it: "@aBianca@bQuindi questo è lo Scudo Zenithiano?\nUhm... Ho la sensazione di averlo già visto da qualche parte, sai?\n㈡\nPer quanto mi sforzi, però, non riesco a ricordare dove...\n@c0@"
  ja: "@a@bビアンカ「これが…　天空のたて？\n\tなんでか　わからないけど\n\tなつかしい感じがする……。\n@c0@"
29:
  de: "@aBianca@bOoh! Was meinst du, %a000090? Die Ventuno klingt toll, und es wäre schön, noch einmal all die vertrauten Stätten aufzusuchen.\n@c0@"
  en: "@aBianca@bOoh! What d'ya reckon, %a000090? The Ventuno sounds like fun, and I wouldn't mind travellin' around our old haunts a bit.\n@c0@"
  es: "@aBianca@b¡Oh! ¿Qué te parece, %a000090? El Musini ese suena divertido, y no me importaría volver a visitar los sitios de nuestra infancia.\n@c0@"
  fr: "@aBianca@bOohⓠ Qu'en dis-tu, %a000090ⓡ Le Vingt-et-un a l'air d'être sympa et ça ne me déplairait pas de retourner voir les endroits que l'on connaît.\n@c0@"
  it: "@aBianca@bChe ne dici, %a000090? L'idea di visitare la Jolly Ace mi alletta parecchio, e mi piacerebbe anche tornare nei luoghi che frequentavamo da piccoli...\n@c0@"
  ja: "@a@bビアンカ「%a000090　どうする？\n\tカジノ船も　なつかしい場所も\n\t気になるよね。\n@c0@"
30:
  de: "@aBianca@bAber die Entscheidung liegt bei dir. Sag du, wo wir hingehen. Solange wir beisammen sind, ist mir alles recht.\n@c0@"
  en: "@aBianca@bIt's up to you, though. You can decide where we go. I'll be happy as long as I'm with you.\n@c0@"
  es: "@aBianca@bTú decides. ¿Dónde quieres que vayamos? A mí me da igual mientras vaya contigo, ¿sabes?\n@c0@"
  fr: "@aBianca@bMais c'est à toi de voir. Tu peux choisir la destination qui te plaira. Moi, du moment que je suis avec toi, tout me va.\n@c0@"
  it: "@aBianca@bPerò voglio che sia tu a decidere.\nPer me va bene qualsiasi cosa, purché stiamo insieme...\n@c0@"
  ja: "@a@bビアンカ「行き先は\n\t%a000090が　決めてね。\n\t私は　あなたに　ついてゆくから。\n@c0@"
31:
  de: "@aBianca@bJa, ich bin sicher, Nera wird keine Schwierigkeiten haben, einen netten Mann zu finden.\n@c0@"
  en: "@aBianca@bYeah, I'm sure Nera will have no trouble findin' herself a nice bloke.\n@c0@"
  es: "@aBianca@bSí, seguro que Nera no tiene problemas en encontrar un chicarrón fornido.\n@c0@"
  fr: "@aBianca@bOui, je suis certaine que Nera n'aura aucun problème pour trouver quelqu'un de bien.\n@c0@"
  it: "@aBianca@bSì, sono certa che Nera non avrà difficoltà a trovare l'uomo dei suoi sogni.\n@c0@"
  ja: "@a@bビアンカ「そうよね。\n\tフローラさんなら　すぐに\n\tステキな人が　見つかるわ。\n@c0@"
32:
  de: "@aBianca@bÄhm, %a000090... Tut es dir nicht manchmal leid, dass du dich für mich entschieden hast?\n@c0@"
  en: "@aBianca@bUm, %a000090... Do you ever regret not choosin' Nera over me?\n@c0@"
  es: "@aBianca@bMmm, %a000090, ¿alguna vez has lamentado haberme elegido?\n@c0@"
  fr: "@aBianca@bHum, %a000090... Est-ce qu'il t'arrive de regretter de n'avoir pas choisi Nera, plutôt que moiⓡ\n@c0@"
  it: "@aBianca@bEhm, %a000090...\nRimpiangi mai di non aver scelto Nera al posto mio?\n@c0@"
  ja: "@a@bビアンカ「ねえ　%a000090\n\tフローラさんを　選ばなかったこと\n\t後悔してるでしょ？\n@c0@"
33:
  de: "@aBianca@bOh! Pass auf, was du sagst! Sonst geb' ich dir gleich was zu bedauern! Ha ha!\n@c0@"
  en: "@aBianca@bOi! Watch it! Else I'll really give you somethin' to regret! Ha ha!\n@c0@"
  es: "@aBianca@b¡Eh, cuidado! ¡A ver si te voy a dar algo que lamentar de verdad! ¡Ja, ja!\n@c0@"
  fr: "@aBianca@bDis doncⓠ Attention, heinⓠ Ou je vais vraiment te donner des raisons d'avoir des regretsⓠ Ha haⓠ\n@c0@"
  it: "@aBianca@bChe cosa?!\nProva a ridirlo, se ne hai il coraggio, brutto villano che non sei altro!\n@c0@"
  ja: "@a@bビアンカ「もうっ　イジワルね。\n\tホントに　後悔させちゃうわよ。\n\tうふふ。\n@c0@"
34:
  de: "@aBianca@bDann ist ja gut. Und ich werde dafür sorgen, dass das auch so bleibt, so lange ich lebe.\n@c0@"
  en: "@aBianca@bThat's good. I'll make sure you never regret it as long as you live.\n@c0@"
  es: "@aBianca@bFenomenal. Me aseguraré de que no lo lamentes mientras vivas, ¿sabes?\n@c0@"
  fr: "@aBianca@bC'est une bonne chose. Je ferai en sorte que tu ne le regrettes jamais tant que tu vivras.\n@c0@"
  it: "@aBianca@bGrazie, amore mio.\nTi giuro che farò di tutto per renderti felice...\n@c0@"
  ja: "@a@bビアンカ「ありがとう……。\n\t私　%a000090に　一生\n\t後悔させないように　がんばるね。\n@c0@"
35:
  de: "@aBianca@bWenn wir erst Kinder haben, wäre es bestimmt lustig, wenn wir alle zusammen auf Reisen gingen... Oh! Bin ich ein wenig vorschnell?\n@c0@"
  en: "@aBianca@bWhen we have kids, it'd be fun for us all to go travellin' together as a family. ...Sorry! Am I gettin' ahead of myself a bit?\n@c0@"
  es: "@aBianca@bCuando tengamos críos será muy divertido viajar todos juntos, como una familia. ¡Lo siento! ¿Me estoy precipitando?\n@c0@"
  fr: "@aBianca@bQuand nous aurons des enfants, ce sera amusant de pouvoir voyager tous ensemble, en famille...\nOups, désoléeⓠ Je me laisse peut-être emporter.\n@c0@"
  it: "@aBianca@bQuando avremo un bambino, faremo un bel viaggio tutti insieme!\nOh, scusami...! Forse sto correndo un po' troppo...\n@c0@"
  ja: "@a@bビアンカ「わたしたちに　子供ができたら\n\t親子で旅するのも　いいかもね。\n\t…って　ちょっと　気が早かったかな。\n@c0@"
36:
  de: "@aBianca@bWir bleiben immer zusammen, nicht, %a000090?\n@c0@"
  en: "@aBianca@bLet's always stay together, eh, %a000090?\n@c0@"
  es: "@aBianca@bSiempre estaremos juntos, ¿eh, %a000090?\n@c0@"
  fr: "@aBianca@bNous resterons toujours ensemble, hein, %a000090ⓡ\n@c0@"
  it: "@aBianca@bGiurami che resteremo sempre insieme, %a000090...\n@c0@"
  ja: "@a@bビアンカ「%a000090…　私たちは\n\tずっと　いっしょにいようね。\n@c0@"
37:
  de: "@aBianca@bEs ist mir immer ganz peinlich, wenn die Leute so was sagen!\n@c0@"
  en: "@aBianca@bI feel all embarrassed when folk say\r\nthings like that!\n@c0@"
  es: "@aBianca@b¡Me da mucho corte cuando la gente dice cosas así!\n@c0@"
  fr: "@aBianca@bJe suis un peu gênée quand les gens tiennent\nce genre de proposⓠ\n@c0@"
  it: "@aBianca@bOh, ma che bel complimento!\nHa ragione: siamo proprio una splendida coppia!\n@c0@"
  ja: "@a@bビアンカ「うふふ。\n\tあんなふうに　言われると\n\tくすぐったくなっちゃうな。\n@c0@"
38:
  de: "@aBianca@bTja, ich schätze, man sieht es mir an ⓚⓛ aber ich finde die Ehe einfach wunderbar. Ich bin so glücklich wie nie.\n@c0@"
  en: "@aBianca@bI s'pose it's pretty obvious, but I think marriage is amazin'. I've never bin happier.\n@c0@"
  es: "@aBianca@bSupongo que es evidente, pero esto del matrimonio está muy bien. Nunca había sido tan feliz, ¿sabes?\n@c0@"
  fr: "@aBianca@bJ'imagine que c'est une évidence, mais je trouve que le mariage est quelque chose d'incroyable. Je n'ai jamais été aussi heureuse.\n@c0@"
  it: "@aBianca@bIl matrimonio è una cosa meravigliosa!\nNon sono mai stata così felice!\nSperiamo che duri, eh?\n㈡\nAh ah ah! Non fare quella faccia, %a000090...\nStavo solo scherzando!\nSai bene che ti starò accanto finché vivrò...\n@c0@"
  ja: "@a@bビアンカ「自分が　結婚したから\n\t言うわけじゃないけど…\n\t結婚って　いいよねっ。\n@c0@"
39:
  de: "@aBianca@bIgitt, igitt, igitt!\n@c0@"
  en: "@aBianca@bYuck, yuck, yuck!\n@c0@"
  es: "@aBianca@b¡Ay, qué asco!\n@c0@"
  fr: "@aBianca@bBeurk, beurk, beurkⓠ\n@c0@"
  it: "@aBianca@bQuel tipo non mi sembrava del tutto lucido...\n@c0@"
  ja: "@a@bビアンカ「ムカ　ムカ　ムカ　ムカッ……！\n@c0@"
40:
  de: "@aBianca@bIch kann es nicht leiden, wenn jemand so über mich redet, und bei einem Betrunkenen schon gar nicht!\n@c0@"
  en: "@aBianca@bI hate havin' things like that said about me, especially by a drunk!\n@c0@"
  es: "@aBianca@b¡Odio que me digan esas cosas, sobre todo un borracho!\n@c0@"
  fr: "@aBianca@bJe déteste qu'on dise des choses comme ça sur moi, surtout si c'est un type ivreⓠ\n@c0@"
  it: "@aBianca@bMa il suo complimento è comunque ben accetto!\n@c0@"
  ja: "@a@bビアンカ「酔っぱらいに\n\tあんな言い方されても\n\tうれしくないわよ～～～～！！\n@c0@"
41:
  de: "@aBianca@bEr will eine Frau? Klingt ja, als wäre er mit jeder zufrieden, solange es nur eine Frau ist.\n@c0@"
  en: "@aBianca@bHe wants a wife? Sounds like he'd be happy with anyone as long as she was a woman!\n@c0@"
  es: "@aBianca@b¿Quiere una esposa? ¡Pues parece que se conforma con cualquier cosa con escote!\n@c0@"
  fr: "@aBianca@bIl veut se marierⓡ On dirait plutôt qu'il serait prêt\nà se contenter de n'importe qui, pourvu que ce soit une femmeⓠ\n@c0@"
  it: "@aBianca@bVuole una moglie? Una qualsiasi?\r\nBeh, lo capisco: un buzzurro del genere non può certo avere molte pretese!\n@c0@"
  ja: "@a@bビアンカ「嫁さんが　欲しいって…\n\t女の人なら　誰でもいいみたいな\n\t言い方ねっ。\n@c0@"
42:
  de: "@aBianca@bIn letzter Zeit reden viele Leute so, nicht? Wir sollten uns mit der Suche nach dem Helden besser beeilen.\n@c0@"
  en: "@aBianca@bA lot of folk are sayin' things like that\r\nlately, eh? We'd better hurry up with this\r\nhunt for the hero.\n@c0@"
  es: "@aBianca@bLa gente no deja de decir cosas así, ¿eh? Ya podemos darnos prisa con la búsqueda del héroe.\n@c0@"
  fr: "@aBianca@bIl y a pas mal de gens qui parlent de ça,\nen ce moment, nonⓡ On ferait bien de\nse dépêcher de trouver le héros.\n@c0@"
  it: "@aBianca@bUltimamente questa voce circola con una certa insistenza, eh?\nCi conviene sbrigarci a trovare l'eroe...\n@c0@"
  ja: "@a@bビアンカ「最近　よく　そういうウワサを\n\t聞くようになったわ。\n\t勇者探し…　急がなくっちゃね。\n@c0@"
43:
  de: "@aBianca@bDieser Lothar ist ja wirklich ganz schön hartnäckig! Gut, dass er nicht locker lässt.\n@c0@"
  en: "@aBianca@bThat Crispin's certainly a determined one!\r\nIt's good that he's makin' such an effort.\n@c0@"
  es: "@aBianca@b¡Mira que es pertinaz ese Crispín!\r\nEstá bien que se esfuerce, ¿sabes?\n@c0@"
  fr: "@aBianca@bOn peut dire qu'il a de la suite dans les idées,\nce Gaëtanⓠ C'est bien qu'il fasse autant d'efforts.\n@c0@"
  it: "@aBianca@bQuel Candido è certamente un tipo determinato!\r\nLe sta provando tutte pur di conquistare la sua bella...\n@c0@"
  ja: "@a@bビアンカ「アンディさんったら\n\tはりきっちゃって！\n\t努力が　むくわれると　いいわよね。\n@c0@"
44:
  de: "@aBianca@bIhr armer Mann! Ich muss aufpassen, dass mir nicht auch Haare auf den Zähnen wachsen.\n@c0@"
  en: "@aBianca@bHer poor husband! I'll have to make sure I don't end up an old shrew like she is.\n@c0@"
  es: "@aBianca@b¡Pobre marido! Espero no terminar como esa vieja arpía, ¿sabes?\n@c0@"
  fr: "@aBianca@bSon pauvre mariⓠ Il va falloir que je fasse attention à ne pas finir comme elle, en vieille furie.\n@c0@"
  it: "@aBianca@bTi prometto che non diventarò mai una brontolona come quella donna!\nPiuttosto, mi annodo le corde vocali tra loro!\n@c0@"
  ja: "@a@bビアンカ「おじさんが　かわいそうよね。\n\t私は　ああならないように\n\t気をつけようっと。\n@c0@"
45:
  de: "@aBianca@bIch hoffe, Nera ist auch glücklich.\n@c0@"
  en: "@aBianca@bI hope Nera's happy too.\n@c0@"
  es: "@aBianca@bEspero que Nera también sea feliz.\n@c0@"
  fr: "@aBianca@bJ'espère que Nera est heureuse, elle aussi.\n@c0@"
  it: "@aBianca@bCapisco perché tu volevi fermarti qui, %a000090.\n@c0@"
  ja: "@a@bビアンカ「フローラさんには　幸せに\n\tなってもらいたいもんね。\n@c0@"
46:
  de: "@aBianca@bIch kann verstehen, warum du hier vorbeischauen willst, %a000090.\n@c0@"
  en: "@aBianca@bI can understand why you want to stop by here, %a000090.\n@c0@"
  es: "@aBianca@bEntiendo por qué quieres pasarte por aquí, %a000090.\n@c0@"
  fr: "@aBianca@bJe comprends pourquoi tu as envie de t'arrêter ici, %a000090.\n@c0@"
  it: "@aBianca@bAnche a me avrebbe fatto piacere passare a salutare Nera...\n@c0@"
  ja: "@a@bビアンカ「%a000090が　ここに\n\tよりたくなる気持ちも　分かるわ。\n@c0@"
47:
  de: "@aBianca@bWas das wohl für ein Ort ist? Er wirkt unbewohnt.\n@c0@"
  en: "@aBianca@bI wonder what this place is. It dun't look like anyone lives here.\n@c0@"
  es: "@aBianca@b¿Qué lugar será este? No parece que viva nadie.\n@c0@"
  fr: "@aBianca@bJe me demande ce que c'est que cet endroit.\r\nOn dirait que personne n'y vit.\n@c0@"
  it: "@aBianca@bChissà cos'è questo posto...\nSembra completamente disabitato.\n@c0@"
  ja: "@a@bビアンカ「ここって　何なのかしら。\n\t人が住んでるようにも　思えないし\n\t気になるわね。\n@c0@"
48:
  de: "@aBianca@bVielleicht finden wir mehr heraus, wenn wir irgendwie hineingelangen können.\n@c0@"
  en: "@aBianca@bMaybe we'd be able to figure it out if we could get inside somehow.\n@c0@"
  es: "@aBianca@bSi logramos entrar igual lo descubrimos, ¿sabes?\n@c0@"
  fr: "@aBianca@bPeut-être qu'on pourrait le savoir si on trouvait\r\nun moyen d'y entrer.\n@c0@"
  it: "@aBianca@bSe riuscissimo a entrare, potremmo scoprire di che si tratta...\n@c0@"
  ja: "@a@bビアンカ「建物の中に　入ることができれば\n\t何か　わかるんでしょうけど……。\n@c0@"
49:
  de: "@aBianca@bDu glaubst doch nicht, dass Griselda womöglich etwas sauer ist, weil du mich genommen hast, %a000090?\n@c0@"
  en: "@aBianca@bYou dun't think that Debora's a bit angry because you chose me, do you, %a000090?\n@c0@"
  es: "@aBianca@bNo se habrá mosqueado Stefania porque me hayas elegido a mí, ¿no, %a000090?\n@c0@"
  fr: "@aBianca@bTu ne crois quand même pas que cette Pandora\nest en colère parce c'est moi que tu as choisi,\ndis-moi, %a000090ⓡ\n@c0@"
  it: "@aBianca@b%0%a000090, non è che Viola c'è rimasta male perché hai scelto me invece di lei...?\n@c0@"
  ja: "@a@bビアンカ「もしかして　デボラさん\n\t%a000090が　私を選んじゃったから\n\t怒ってるのかな？\n@c0@"
50:
  de: "@aNera@bIch hoffe, du hältst mich nicht für so ein verwöhntes reiches Mädchen, nur weil ich nicht viel sage.\n@c0@"
  en: "@aNera@bI hope you don't think I'm some kind of spoilt little rich girl just because I'm a bit quiet.\n@c0@"
  es: "@aNera@bEspero que no creas que soy una ragazza rica y mimada solo por ser tranquila y callada.\n@c0@"
  fr: "@aNera@bJ'espère que tu ne penses pas que je suis juste une petite fille riche et gâtée parce que je parle peu.\n@c0@"
  it: "@aNera@bProvengo da una famiglia ricca e ho studiato in una prestigiosa abbazia, ma non sono una signorina viziata e con la puzza sotto al naso...\n@c0@"
  ja: "@a@bフローラ「おとなしいと思っていたら\n\tわがままな女だった　などとは\n\t思わないでくださいましね。\n@c0@"
51:
  de: "@aNera@bIch hatte nur über dieses seltsame Gefühl nachgedacht, dass ich dir auf deinen Reisen von großem Nutzen sein könnte.\n@c0@"
  en: "@aNera@bI was just mulling over this strange feeling I have.\r\nA kind of conviction that I could be of great use to you on your travels.\n@c0@"
  es: "@aNera@bEstaba pensando acerca de esta extraña sensazione. La convicción de que puedo serte de mucha utilidad en tus viaggi.\n@c0@"
  fr: "@aNera@bJe réfléchissais juste à cette drôle d'impression que j'ai. Une sorte d'intime conviction que je pourrais t'être très utile pendant tes voyages.\n@c0@"
  it: "@aNera@bAnzi, sono una persona molto dinamica e ho mille interessi! Credo che potrei esserti molto utile nei tuoi viaggi, sai?\n@c0@"
  ja: "@a@bフローラ「よく分からないのですが\n\tあなたの旅の中で　きっと　私が\n\t必要になるような気がするんです。\n@c0@"
52:
  de: "@aNera@bIch weiß, Papa wird der Gedanke gar nicht behagen, dass ich dich auf deinen Reisen begleiten könnte.\n@c0@"
  en: "@aNera@bI know that Papa will be totally against the idea of me joining you on your journey.\n@c0@"
  es: "@aNera@bSé que il mio papino se opondrá a que viaje contigo.\n@c0@"
  fr: "@aNera@bJe sais que papa sera totalement opposé à l'idée que je voyage avec toi.\n@c0@"
  it: "@aNera@bMio papà si opporrà all'idea che io ti accompagni nei tuoi viaggi...\n@c0@"
  ja: "@a@bフローラ「お父さまのことだから\n\t旅に出たいと言ったら　絶対\n\t反対するに　決まっていますわ。\n@c0@"
53:
  de: "@aNera@bAber ich werde mir das von ihm nicht ausreden lassen. Komm, wir gehen zu ihm und sagen es ihm.\n@c0@"
  en: "@aNera@bBut I won't allow him to talk me out of it.\r\nCome on, let's go and tell him the news.\n@c0@"
  es: "@aNera@bMa no permitiré que me disuada.\r\nVamos, contémosle la noticia.\n@c0@"
  fr: "@aNera@bMais je ne le laisserai pas me détourner de cette idée. Viens, allons lui annoncer la nouvelle.\n@c0@"
  it: "@aNera@bMa non gli permetterò di impedirmelo.\r\nCoraggio, andiamo ad avvisarlo.\n@c0@"
  ja: "@a@bフローラ「でも　これだけは\n\tゆずれませんの。\n\tさあ　お父さまの所へまいりましょう。\n@c0@"
54:
  de: "@aNera@bEs tut mir leid, dass mit der Hochzeitsfeier alles so schnell gehen musste.\n@c0@"
  en: "@aNera@bI'm sorry that the wedding ceremony was so rushed.\n@c0@"
  es: "@aNera@bLamento que la ceremonia de boda fuera così veloce.\n@c0@"
  fr: "@aNera@bJe regrette que la cérémonie de mariage\r\nait été si précipitée.\n@c0@"
  it: "@aNera@bMi dispiace che la cerimonia di nozze sia stata organizzata così in fretta...\n@c0@"
  ja: "@a@bフローラ「それにしても\n\tとっても　あわただしい結婚式に\n\tなってしまいましたわね。\n@c0@"
55:
  de: "@aNera@bEs war nicht richtig, dass Papa mit seinen großen Plänen nicht mehr Rücksicht auf deine Wünsche genommen hat.\n@c0@"
  en: "@aNera@bIt was wrong of Papa not to take your feelings more into account with all of his grand plans.\n@c0@"
  es: "@aNera@bIl mio papino se equivocó al no tener más en cuenta tus sentimenti en sus grandes planes.\n@c0@"
  fr: "@aNera@bÇa n'était pas bien de la part de papa de faire si peu de cas de tes sentiments dans son organisation grandiose.\n@c0@"
  it: "@aNera@bPurtroppo mio padre è fatto così...\nQuando prende una decisione, non c'è verso di fargli cambiare idea!\n@c0@"
  ja: "@a@bフローラ「%a000090さんのことを\n\t考えないような提案までして…\n\t本当に　困った父ですわ。\n@c0@"
56:
  de: "@aNera@bDieses Haus wurde erbaut, damit wir Platz genug für Gäste haben, die uns besuchen kommen.\n@c0@"
  en: "@aNera@bThis place was built so that we would have space to house guests when they come to visit.\n@c0@"
  es: "@aNera@bVeramente, esto se construyó para las visitas.\n@c0@"
  fr: "@aNera@bCet endroit a été construit afin que nous puissions héberger les invités qui viennent nous rendre visite.\n@c0@"
  it: "@aNera@bQui accogliamo gli ospiti che ogni tanto vengono a trovarci.\n@c0@"
  ja: "@a@bフローラ「この別荘は　お客さまに\n\t泊まっていただいたりするために\n\t建てられたものですが……\n@c0@"
57:
  de: "@aNera@bAber Mama flüchtet sich manchmal hierher, wenn sie und Papa sich in den Haaren liegen! Hi hi!\n@c0@"
  en: "@aNera@bAlthough, Mama sometimes uses it as a way of escaping from Papa when they have a tiff! He he!\n@c0@"
  es: "@aNera@b¡Aunque la mia mamma a veces lo usa para escapar de il mio papino cuando se enfadan! ¡Ji, ji!\n@c0@"
  fr: "@aNera@bMais mamma s'en sert parfois pour éviter papa quand ils ont eu une disputeⓠ Hi hiⓠ\n@c0@"
  it: "@aNera@bA volte, però, ci viene mia madre per trascorrere qualche ora di riposo, lontano dal perenne brontolare di mio padre.\n@c0@"
  ja: "@a@bフローラ「たまに　母とケンカした父が\n\t逃げこむのにも　使われていますのよ。\n\tうふふ。\n@c0@"
58:
  de: "@aNera@bIch weiß, dass Papa wirklich stur sein kann, aber wir können ihn bestimmt überreden.\n@c0@"
  en: "@aNera@bI know that Papa seems really stubborn, but I'm sure I'll be able to persuade him.\n@c0@"
  es: "@aNera@bSé que il mio papino parece de lo más ostinato, pero seguro que lo persuado.\n@c0@"
  fr: "@aNera@bJe sais que papa a l'air vraiment têtu, mais je suis persuadée que j'arriverai à le convaincre.\n@c0@"
  it: "@aNera@bMio padre è una persona molto cocciuta, ma sono certa che riuscirò a convincerlo...\n@c0@"
  ja: "@a@bフローラ「父は　見た目どおり\n\tガンコな性格なのですが…\n\t私　必ず　説得してみせますわね。\n@c0@"
59:
  de: "@aNera@bWir hatten nicht viel Gelegenheit, einander kennenzulernen, bevor wir geheiratet haben. Aber das werden wir jetzt alles nachholen.\n@c0@"
  en: "@aNera@bWe hardly had much chance to get to know each other before we were wed. But I know we'll make up for that from now on.\n@c0@"
  es: "@aNera@bApenas tuvimos tempo di conocernos antes de casarnos, pero enseguida arreglaremos eso.\n@c0@"
  fr: "@aNera@bNous n'avons guère eu l'occasion de faire vraiment connaissance avant notre mariage. Mais je suis sûre que nous allons nous rattraper.\n@c0@"
  it: "@aNera@bPrima di sposarci non abbiamo avuto molto tempo per conoscerci.\nBeh, cercheremo di recuperare adesso...\n@c0@"
  ja: "@a@bフローラ「私たち　ろくに話もせず\n\t夫婦になってしまいましたけど…\n\tこれからは　いっぱい話しましょうね。\n@c0@"
60:
  de: "@aNera@bIch hätte Papa nie verziehen, wenn dir etwas zugestoßen wäre.\n@c0@"
  en: "@aNera@bI would never have forgiven Papa if anything bad happened to you.\n@c0@"
  es: "@aNera@bNunca se lo hubiera perdonato al mio papino si te hubiera sucedido algo.\n@c0@"
  fr: "@aNera@bJe n'aurais jamais pardonné à papa si quelque chose de grave t'était arrivé.\n@c0@"
  it: "@aNera@bNon avrei mai perdonato mio padre se ti fosse capitata una disgrazia mentre cercavi gli anelli...\n@c0@"
  ja: "@a@bフローラ「あなたに\n\tもしものことがあったら　私\n\t父を　一生　許さないところでしたわ。\n@c0@"
61:
  de: "@aNera@bWie traurig für diesen kleinen Jungen, dass er seine Mutter schon so früh verloren hat.\n@c0@"
  en: "@aNera@bWhat a shame for that boy, losing his mother at his young age.\n@c0@"
  es: "@aNera@bQué pena para ese bambino, perder tan joven a la sua mamma.\n@c0@"
  fr: "@aNera@bComme c'est triste pour un garçon si jeune de perdre sa mère.\n@c0@"
  it: "@aNera@bQuel povero piccolo ha perso sua madre qualche anno fa. La scomparsa di una persona cara è una cicatrice incancellabile...\n@c0@"
  ja: "@a@bフローラ「あの子は　まだ幼いのに\n\t母を亡くしているのです。\n@c0@"
62:
  de: "@aNera@bDer Kleine muss einem einfach leidtun.\n@c0@"
  en: "@aNera@bNo one could fail to feel sorry for the poor thing.\n@c0@"
  es: "@aNera@b¿Quién no sentiría lástima por ese poveretto?\n@c0@"
  fr: "@aNera@bOn ne peut qu'être désolé pour ce pauvre petit.\n@c0@"
  it: "@aNera@bQuando lo vedo mi commuovo, e mi auguro in cuor mio che lo attenda un futuro sereno...\n@c0@"
  ja: "@a@bフローラ「あの子の幸せを\n\t願わずには　いられませんわ。\n@c0@"
63:
  de: "@aNera@bIch war so gegen Papas Wunsch, dass ich den Mann heiraten sollte, der ihm die Ringe bringt.\n@c0@"
  en: "@aNera@bI was so against Papa's idea of me marrying the man who returned the rings to him as he requested.\n@c0@"
  es: "@aNera@bYo estaba totalmente en contra de la idea de il mio papino de casarme con quien le trajera los anillos que pedía.\n@c0@"
  fr: "@aNera@bJ'étais vraiment opposée à l'idée de papa de me faire épouser l'homme qui parviendrait à lui rapporter les anneaux qu'il demandait.\n@c0@"
  it: "@aNera@bL'idea di essere costretta a sposare colui che avrebbe portato a mio padre quei due anelli mi faceva diventare verde dalla rabbia!\n@c0@"
  ja: "@a@bフローラ「父が　リングを持ってきた者と\n\t結婚しろなどと　言い出したときは\n\t正直　あきれたのですが……\n@c0@"
64:
  de: "@aNera@bAber jetzt verstehe ich, dass er mich nur dem besten Mann anvertrauen wollte. Er wollte nur, dass ich glücklich werde.\n@c0@"
  en: "@aNera@bBut now I realise he was doing it so that I'd end up marrying the best possible person. He was just trying to make me happy.\n@c0@"
  es: "@aNera@bPero ahora ho capito que lo hizo para que me casara con la mejor persona posibile. Solo quería que fuera felice.\n@c0@"
  fr: "@aNera@bMais je réalise à présent qu'il a fait ça pour que j'épouse le meilleur homme possible. Il essayait\r\njuste de me rendre heureuse.\n@c0@"
  it: "@aNera@bMa ora mi rendo conto che mio padre aveva organizzato quella stupida competizione per darmi la possibilità di sposare una persona in gamba.\n㈡\nLo ha fatto solo per il mio bene, anche se ha scelto un modo poco ortodosso per trovarmi un marito all'altezza...\n@c0@"
  ja: "@a@bフローラ「今思えば　あれは　最高の男と\n\t結婚させたいという　父なりの\n\t親心　だったのかも知れませんね。\n@c0@"
65:
  de: "@aNera@bOh je! So viel zu trinken scheint keine gute Idee zu sein!\n@c0@"
  en: "@aNera@bOh dear! Drinking to that extent doesn't seem like a very good idea.\n@c0@"
  es: "@aNera@b¡Oh, cielos! Beber così no es una buena idea.\n@c0@"
  fr: "@aNera@bSeigneurⓠ Boire à ce point ne me paraît pas être une très bonne idée.\n@c0@"
  it: "@aNera@bOh, santi numi!\nLe cose andrebbero sempre fatte con moderazione!\n@c0@"
  ja: "@a@bフローラ「まあ！\n\tあんな飲み方をしては\n\tだいなしですわ。\n@c0@"
66:
  de: "@aNera@bWas für eine Vergeudung, wenn ein Getränk so magnifico ist! ... Das sagt jedenfalls Papa immer.\n@c0@"
  en: "@aNera@bWhat a waste when drink is so magnifico!\n...That's what Papa always says, anyway.\n@c0@"
  es: "@aNera@b¡Qué pena, cuando beber es tan superbioso!\r\nO eso es lo que dice sempre il mio papino.\n@c0@"
  fr: "@aNera@bQuel gâchis quand la boisson est si magnificaⓠ\n... Enfin, c'est ce que dit toujours papa.\n@c0@"
  it: "@aNera@bNon si dovrebbe mai esagerare, anche se capisco che, a volte, è facile farsi prendere la mano...\n@c0@"
  ja: "@a@bフローラ「お酒は　おいしく！\n\t…と　父が　よく言ってますのよ。\n@c0@"
67:
  de: "@aNera@bIch hoffe, sie wird auch bald den Richtigen finden.\n@c0@"
  en: "@aNera@bI hope she manages to find her\r\nperfect match before long too.\n@c0@"
  es: "@aNera@bEspero que no tarde en encontrar la sua media naranja.\n@c0@"
  fr: "@aNera@bJ'espère qu'elle réussira elle aussi à trouver rapidement l'homme de sa vie.\n@c0@"
  it: "@aNera@bLe auguro di trovare presto l'uomo della sua vita...\n@c0@"
  ja: "@a@bフローラ「あの女性にも\n\tご自分に　ふさわしい方が\n\t早く　見つかるといいですわね。\n@c0@"
68:
  de: "@aNera@bWas haben wir für ein Glück, dass die Leute in der Stadt uns so viel Gutes wünschen!\n@c0@"
  en: "@aNera@bHow lucky we are, being given all these\r\ngood wishes from the townsfolk!\n@c0@"
  es: "@aNera@b¡Qué suerte tenemos de recibir parabienes de tutti il mondo!\n@c0@"
  fr: "@aNera@bNous avons beaucoup de chance de recevoir tous ces vœux des habitantsⓠ\n@c0@"
  it: "@aNera@bÈ bello vedere tanta gente felice per il nostro matrimonio...\nLa cosa mi riempie il cuore di gioia!\n@c0@"
  ja: "@a@bフローラ「町のみなさんからも\n\t祝福していただいて\n\t私たち　本当に　幸せですわ。\n@c0@"
69:
  de: "@aNera@bIch habe immer ein etwas schlechtes Gewissen, wenn ich Lothars Eltern sehe.\n@c0@"
  en: "@aNera@bI feel a little bit guilty when I see Crispin's parents.\n@c0@"
  es: "@aNera@bCuando veo a los padres de Crispín veramenete me siento culpable.\n@c0@"
  fr: "@aNera@bJe me sens un peu coupable quand je vois les parents de Gaëtan.\n@c0@"
  it: "@aNera@bQuando penso ai genitori di Candido mi sento un po' in colpa...\n@c0@"
  ja: "@a@bフローラ「アンディの　ご両親を見ると\n\t少し　胸が痛みますわ。\n@c0@"
70:
  de: "@aNera@bWahrscheinlich hatten sie gehofft, dass er und ich ein Paar würden.\n@c0@"
  en: "@aNera@bI think they were probably hoping that he and I would be married.\n@c0@"
  es: "@aNera@bProbabilmente esperaban que él y yo nos casásemos.\n@c0@"
  fr: "@aNera@bÀ mon avis, ils espéraient sûrement que nous nous marierions, lui et moi.\n@c0@"
  it: "@aNera@bProbabilmente speravano che io e lui ci saremmo sposati.\n@c0@"
  ja: "@a@bフローラ「なにも　おっしゃらないけど\n\t私が　アンディと　結婚することを\n\tきっと　望まれていたでしょうから。\n@c0@"
71:
  de: "@aNera@bIch muss zugeben, dass ich auch ganz überrascht war. Lothar ist so ein sanftmütiger Kerl. Ich glaube, ich habe nie ein böses Wort von ihm vernommen.\n@c0@"
  en: "@aNera@bI must admit that I was quite surprised too. Crispin's such a gentle sort. I don't think I've ever known him say a word in anger.\n@c0@"
  es: "@aNera@bDebo admitir que me sorprendió bastante. Crispín es molto gentile. Credo que nunca le he oído siquiera levantar la voce.\n@c0@"
  fr: "@aNera@bJe dois reconnaître que j'ai été très surprise, moi aussi. Gaëtan est quelqu'un de si doux. Je crois que je ne l'ai jamais entendu se mettre en colère.\n@c0@"
  it: "@aNera@bDevo ammettere che anch'io sono rimasta sorpresa. Candido è un tipo calmo e gentile... Non credevo che fosse capace di un gesto così audace.\n@c0@"
  ja: "@a@bフローラ「私も　おどろきました。\n\tアンディは　やさしくて\n\t人と競い合うのが　苦手でしたのに…。\n@c0@"
72:
  de: "@aNera@bIch habe immer gewusst, was Lothar für mich empfunden hat.\n@c0@"
  en: "@aNera@bI always knew how Crispin felt about me.\n@c0@"
  es: "@aNera@bSiempre supe lo que Crispín sentía per me.\n@c0@"
  fr: "@aNera@bJ'ai toujours su ce que Gaëtan ressentait pour moi.\n@c0@"
  it: "@aNera@bSono sempre stata a conoscenza dei sentimenti che Candido prova per me...\n@c0@"
  ja: "@a@bフローラ「私は　アンディの気持ちを\n\t知っていました。\n@c0@"
73:
  de: "@aNera@bAber als wir beide uns begegneten, war es, als zöge mich eine unwiderstehliche Macht zu dir.\n@c0@"
  en: "@aNera@bBut when we met, it was like some strange power was drawing me towards you.\n@c0@"
  es: "@aNera@bMa cuando te conocí fue como si un strano poder me atrajera hacia ti.\n@c0@"
  fr: "@aNera@bMais quand nous nous sommes rencontrés, toi et moi, c'est comme si une force étrange m'attirait vers toi.\n@c0@"
  it: "@aNera@bMa mi sono innamorata di te nel momento stesso in cui i nostri sguardi si sono incrociati per la prima volta.\n@c0@"
  ja: "@a@bフローラ「でも　あなたと初めて会ったとき\n\tなにか　ふしぎなチカラを感じて\n\t引きつけられてしまったのですわ。\n@c0@"
74:
  de: "@aNera@bHe he! Genau wie diese komischen Monster, mit denen du herumziehst!\n@c0@"
  en: "@aNera@bHe he! Just like with those funny monsters you take around with you!\n@c0@"
  es: "@aNera@b¡Ji, ji! ¡Como esos mostri tan divertenti que llevas contigo!\n@c0@"
  fr: "@aNera@bHi hiⓠ Exactement comme ces drôles de monstres que tu promènes avec toiⓠ\n@c0@"
  it: "@aNera@bNon potevo andare contro il mio cuore...\n@c0@"
  ja: "@a@bフローラ「そう　あなたが　連れている\n\t魔物さんたちのようにね。　うふふ。\n@c0@"
75:
  de: "@aNera@bLothar hat sich immer um mich gekümmert, als ich noch klein war. Er ist für mich fast wie ein älterer Bruder.\n@c0@"
  en: "@aNera@bCrispin always took care of me when I was small. If anything, I think of him as a sort of elder brother.\n@c0@"
  es: "@aNera@bCuando éramos pequeños, Crispín sempre cuidaba de mí. Si acaso pienso en él como en un fratello mayor.\n@c0@"
  fr: "@aNera@bGaëtan a toujours pris soin de moi quand j'étais petite. Je le considère un peu comme un grand frère, plus qu'autre chose.\n@c0@"
  it: "@aNera@bQuand'ero piccola, Candido si prendeva spesso cura di me. L'ho sempre considerato una specie di fratello maggiore.\n@c0@"
  ja: "@a@bフローラ「アンディは　幼いころの私を\n\t気にかけて　守ってくれました。\n\t大切な…　兄のような存在なのです。\n@c0@"
76:
  de: "@aNera@bBisher sind wir ja erst zu zweit, aber hoffentlich sind wir eines Tages eine große glückliche Familie.\n@c0@"
  en: "@aNera@bIt's just the two of us now, but hopefully we'll be a big happy family one day.\n@c0@"
  es: "@aNera@bAhora estamos los dos, pero con suerte un día seremos una gran famiglia felice.\n@c0@"
  fr: "@aNera@bPour l'instant, nous ne sommes que tous les deux, mais j'espère que nous formerons un jour une grande et heureuse famille.\n@c0@"
  it: "@aNera@bOra siamo solo in due, ma spero che presto la nostra famiglia diventi più numerosa...\n@c0@"
  ja: "@a@bフローラ「今は　私たち\n\t小さな家族ですけど　やがては\n\t大きな家族に　なれるといいですわね。\n@c0@"
77:
  de: "@aNera@bJetzt rühr dich mal und setz einen Tee auf, du alter Faulenzer?!\n@c0@"
  en: "@aNera@bStop lazing about and put some tea on,\r\nyou old waster!?\n@c0@"
  es: "@aNera@bⓕ¡Deja de vaguear y sírveme un té, desastre manirroto!ⓖ\n@c0@"
  fr: "@aNera@bⓥArrête de traîner et prépare du thé, espèce de vieux bon à rienⓦⓡⓐ\n@c0@"
  it: "@aNera@bⓕSmetti di perdere tempo e prepara il tè, brutto scansafatiche che non sei altroⓖ!?\n@c0@"
  ja: "@a@bフローラ「あんた　ぼやぼやしてないで\n\tお茶でも　入れてよ！\n@c0@"
78:
  de: "@aNera@b... Ich kann mir einfach nicht vorstellen, dass ich das jemals zu jemandem sagen könnte!\n@c0@"
  en: "@aNera@b...I just can't imagine ever saying that to anyone!\n@c0@"
  es: "@aNera@b¡Veramente, no me imagino diciéndole eso a nadie!\n@c0@"
  fr: "@aNera@b... Je ne me vois pas dire une chose pareille\nà quiconqueⓠ\n@c0@"
  it: "@aNera@bMa come si fa a rivolgersi in questo modo al proprio marito?!\nIo non ci riuscirei mai!\n@c0@"
  ja: "@a@bフローラ「……なんて　私には\n\tとても言えない　セリフですわ。\n@c0@"
79:
  de: "@aNera@bIch fürchte, das Kochen gehört nicht gerade zu meinen Stärken.\n@c0@"
  en: "@aNera@bI'm afraid that cooking isn't really my forte.\n@c0@"
  es: "@aNera@bMe temo que el cucinare no es mi fuerte.\n@c0@"
  fr: "@aNera@bJ'ai bien peur que la cuisine ne soit pas mon fort.\n@c0@"
  it: "@aNera@bLo sai?\nIo sono molto brava a cucinare...\n@c0@"
  ja: "@a@bフローラ「私…　はずかしいことに\n\tあまり　お料理が上手でないのです…。\n@c0@"
80:
  de: "@aNera@bIch gebe mein Bestes, aber mit dem Hackbeil in der Hand ist unsere Köchin mir um Längen voraus!\n@c0@"
  en: "@aNera@bI try my best, but I don't even come close to our cook when it comes to handling a cleaver!\n@c0@"
  es: "@aNera@b¡Lo intento, pero con los peroles es que ni me acerco a il nostro capocuoco!\n@c0@"
  fr: "@aNera@bJ'ai beau faire de mon mieux, je n'arrive pas à la cheville de notre cuisinier quand il s'agit de\nmanier un couperetⓠ \n@c0@"
  it: "@aNera@bAl corso di preparazione al matrimonio che ho frequentato all'Abbazia di Su'ncyel ci hanno insegnato a preparare piatti squisiti!\n@c0@"
  ja: "@a@bフローラ「がんばっているのですが\n\tなかなか　うちの料理人のような\n\t包丁さばきは　できないのですわ。\n@c0@"
81:
  de: "@aNera@bBianca ist nicht mehr hier. Sie ist schon abgereist. Aber ich kann verstehen, dass du sie gerne sehen würdest.\n@c0@"
  en: "@aNera@bBianca's not here any more. She's gone home. I can understand that you'd want to see her, though.\n@c0@"
  es: "@aNera@bBianca ya no está aquí. Ha ritornato a casa. Aunque entiendo que quieras verla.\n@c0@"
  fr: "@aNera@bBianca n'est plus là, elle est rentrée chez elle.\r\nMais je comprends que tu aies envie de la voir.\n@c0@"
  it: "@aNera@bBianca è già tornata a casa. Capisco che tu volessi salutarla... Dai, non ti preoccupare.\nSono certa che la rivedremo presto!\n@c0@"
  ja: "@a@bフローラ「ビアンカさん　もう\n\tお帰りになって　しまわれたんですね。\n\tでも　お気持ちもわかります。　私…。\n@c0@"
82:
  de: "@aNera@bHier wirkst du nie so richtig zu Hause, weißt du!\n@c0@"
  en: "@aNera@bYou never look like you're able to relax when you're in this house, you know!\n@c0@"
  es: "@aNera@b¡Sembra que no se puede descansar en esta casa!\n@c0@"
  fr: "@aNera@bTu sais, on dirait que tu n'arrives jamais à te détendre quand tu es iciⓠ\n@c0@"
  it: "@aNera@bOrmai dovresti sapere chi abita in questa casa, non è vero?\nIh ih ih!\n@c0@"
  ja: "@a@bフローラ「あなたったら　この家は\n\tどうも　落ちつかないって\n\t顔を　なさっていますわ。　うふふ。\n@c0@"
83:
  de: "@aNera@bIch habe noch nie gehört, dass ein Tiegel an einem so unwahrscheinlichen Ort aufbewahrt wird.\n@c0@"
  en: "@aNera@bI never heard about a jar being located in such an unlikely place.\n@c0@"
  es: "@aNera@bNunca había oído hablar de una tinaja en un sitio tan inverosimile.\n@c0@"
  fr: "@aNera@bJe n'ai jamais entendu parler d'une amphore entreposée dans un lieu aussi improbable.\n@c0@"
  it: "@aNera@bUn'anfora su un'isola...?\nMah...\nCerto che a volte mio padre è davvero strano...\n@c0@"
  ja: "@a@bフローラ「そんなところに　ツボが\n\tあるなんて話　初めて聞きましたわ。\n@c0@"
84:
  de: "@aNera@bAber wenn das zu den Regeln gehört, die Papa aufgestellt hat, um mich mit dir reisen zu lassen, muss es wohl wichtig sein.\n@c0@"
  en: "@aNera@bBut those are the rules Papa has decided on if I'm to travel with you, so it must be important.\n@c0@"
  es: "@aNera@bPero esas son las reglas que ha impuesto il mio papino para dejarme viajar contigo, así que debe de ser importante.\n@c0@"
  fr: "@aNera@bMais si ce sont les règles que papa a fixées pour\r\nque je puisse voyager avec toi, alors ça doit être important.\n@c0@"
  it: "@aNera@bPerò deve trattarsi di una cosa di una certa importanza, se ci ha chiesto di andare a controllare...\n@c0@"
  ja: "@a@bフローラ「でも　旅立ちの条件に\n\t出されるくらいですから\n\tきっと　重要なことなのですわね。\n@c0@"
85:
  de: "@aNera@bDann war der Zenithiaschild also die ganze Zeit hier.\n@c0@"
  en: "@aNera@bSo the Zenithian Shield has been right here all along.\n@c0@"
  es: "@aNera@bAsí que el Escudo de Zenithia ha estado aquí tutto il tempo.\n@c0@"
  fr: "@aNera@bAlors pendant tout ce temps, le Bouclier zénithien était juste là.\n@c0@"
  it: "@aNera@bQuindi lo Scudo Zenithiano è sempre stato qui...\n@c0@"
  ja: "@a@bフローラ「天空のたては　ずっと前から\n\t私とともに　あったものなのです。\n@c0@"
86:
  de: "@aNera@bVielleicht ist es deswegen... Ich habe manchmal gespürt, wie eine seltsame Kraft von ihm ausging, weißt du.\n@c0@"
  en: "@aNera@bMaybe that's why... I've sometimes felt a strange power coming from it, you see.\n@c0@"
  es: "@aNera@bQuizá por eso... alguna vez haya sentido que de él emanaba un strano poder.\n@c0@"
  fr: "@aNera@bC'est peut-être pour ça... J'ai parfois eu l'impression qu'une étrange puissance émanait de ce coffre.\n@c0@"
  it: "@aNera@bLo sai?\nA volte avevo avuto la sensazione che quell'oggetto fosse dotato di uno strano potere...\n@c0@"
  ja: "@a@bフローラ「だからかしら…\n\tたまに　分身のように\n\t感じることが　あるんですのよ。\n@c0@"
87:
  de: "@aNera@bDas bedeutet, ich kann nach Herzenslust mit dir herumreisen! Ich bin ja so froh!\n@c0@"
  en: "@aNera@bThis means I can travel with you for as long as my heart desires. I'm so happy!\n@c0@"
  es: "@aNera@bEsto significa que puedo viajar contigo siempre que quiera. ¡Soy felice!\n@c0@"
  fr: "@aNera@bÇa signifie que je vais pouvoir voyager avec toi aussi longtemps que je le désire. Je suis si contenteⓠ\n@c0@"
  it: "@aNera@bCome sono felice!\r\nMio padre mi ha dato il permesso di viaggiare con te!\r\nÈ troppo bello per essere vero!\n@c0@"
  ja: "@a@bフローラ「これで　あなたと\n\tずっと　旅ができますわ。\n\tああ…　良かった！\n@c0@"
88:
  de: "@aNera@bIch bin eigentlich ganz überrascht, dass Papa so schnell nachgegeben hat.\n@c0@"
  en: "@aNera@bI'm actually quite surprised that\r\nPapa relented so quickly.\n@c0@"
  es: "@aNera@bLa verdad es que me sorprende que il mio papino cediese così de presto.\n@c0@"
  fr: "@aNera@bPour être honnête, je suis assez surprise que papa se soit laissé convaincre aussi vite.\n@c0@"
  it: "@aNera@bUhm, non è da mio padre arrendersi così facilmente...\n@c0@"
  ja: "@a@bフローラ「それにしても\n\t父が　こんなに　簡単に\n\t許してくれるなんて…。\n@c0@"
89:
  de: "@aNera@bVielleicht hat er schon geahnt, dass ich eines Tages auf Reisen gehen würde.\n@c0@"
  en: "@aNera@bMaybe he had some kind of premonition that I'd set off travelling one day.\n@c0@"
  es: "@aNera@bQuizá tuviera la premonición de que algún día partiría de viaggio.\n@c0@"
  fr: "@aNera@bPeut-être qu'il se doutait que je partirais un jour\r\nen voyage.\n@c0@"
  it: "@aNera@bSecondo me aveva accettato fin da subito l'idea che io viaggiassi con te, ma ha voluto farmi sudare un po' prima di dirmi che per lui andava bene!\n@c0@"
  ja: "@a@bフローラ「もしかしたら　父にも\n\t私が　いつか旅立ってゆくという\n\t予感があったのかも　知れませんわね。\n@c0@"
90:
  de: "@aNera@bEs ist mir ganz egal, wohin wir reisen. Solange ich nur an deiner Seite bin, ist mir alles recht.\n@c0@"
  en: "@aNera@bI don't mind where we go. As long as I'm by your side, I'd be perfectly content anywhere.\n@c0@"
  es: "@aNera@bVeramente, no me importa a dónde vayamos. Mientras esté a tu lado seré felice.\n@c0@"
  fr: "@aNera@bPeu importe où nous allons. Dès lors que je suis à tes côtés, je serai heureuse partout.\n@c0@"
  it: "@aNera@bNon m'importa dove andremo, caro!\nPer me conta solo stare accanto a te!\n@c0@"
  ja: "@a@bフローラ「行き先は　あなたに\n\tまかせますわ。　私は　あなたが\n\tいっしょなら　どこでも　いいのです。\n@c0@"
91:
  de: "@aNera@bIch will ganz viele Kinder haben, %a000090. Wir werden eine große glückliche Familie sein!\n@c0@"
  en: "@aNera@bI'll give you as many children as you want, %a000090. Whatever will make you happy.\n@c0@"
  es: "@aNera@bTe daré cuantos hijos desees, %a000090. Solo quiero hacerte felice.\n@c0@"
  fr: "@aNera@bNous aurons autant d'enfants que tu le souhaites, %a000090. Pourvu que nous soyons heureux.\n@c0@"
  it: "@aNera@b%0%a000090, un giorno avremo tanti bei bambini.\nVoglio una famiglia numerosa, unita e felice!\n@c0@"
  ja: "@a@bフローラ「私　あなたが望むんでしたら\n\t何人でも　産んでみせますわ。\n\tぽっ……。\n@c0@"
92:
  de: "@aNera@bWir können sicher in der Villa bleiben, wenn wir wollen. Wir sollten darauf achten, dass wir Rast machen, wann und wo es uns gefällt.\n@c0@"
  en: "@aNera@bWe should be able to stay in the villa if we\r\nwant to. Let's make sure we rest whenever\r\nand wherever we please.\n@c0@"
  es: "@aNera@bSi queremos quedarnos en la villa podemos hacerlo. Veramente, podemos descansar cuando y donde nos apetezca.\n@c0@"
  fr: "@aNera@bNous devrions pouvoir nous reposer dans la villa\r\nsi nous le souhaitons. Faisons en sorte de prendre\r\ndu repos quand nous en avons besoin.\n@c0@"
  it: "@aNera@bSe vuoi, possiamo restare alla villa.\nUn po' di riposo non ci farà certo male...\n@c0@"
  ja: "@a@bフローラ「別荘でも　休めるはずですわ。\n\tお好きなときに　お好きな場所で\n\t休むことにしましょうね。\n@c0@"
93:
  de: "@aNera@bBei unseren gemeinsamen Reisen ist mir klar geworden, wie schön es ist, füreinander da zu sein, %a000090.\n@c0@"
  en: "@aNera@bTravelling together has taught me the joy of being there for one another, %a000090.\n@c0@"
  es: "@aNera@bViajar juntos me ha descubierto la felicidad de apoyarse el uno al otro, %a000090.\n@c0@"
  fr: "@aNera@bEn voyageant ensemble, j'ai découvert la joie d'être toujours là l'un pour l'autre, %a000090.\n@c0@"
  it: "@aNera@bViaggiare insieme mi ha insegnato quanto è bello aiutarsi l'un l'altro, %a000090... Quando si è in due, nessuna difficoltà è insormontabile.\n@c0@"
  ja: "@a@bフローラ「私も　%a000090さんと\n\t旅をするようになって\n\t支えあうことの楽しさを　知りました。\n@c0@"
94:
  de: "@aNera@bHeutzutage ist es überall so gefährlich geworden, in der Stadt wie auf dem Land. Furchtbar.\n@c0@"
  en: "@aNera@bIt's so dangerous everywhere nowadays, both in town and outside. What a terrible thing!\n@c0@"
  es: "@aNera@bVeramente, hoy en día se corre peligro tanto dentro como fuera de las ciudades. ¡Es terribile!\n@c0@"
  fr: "@aNera@bLe danger rôde partout, désormais. Aussi bien à l'intérieur qu'à l'extérieur de la ville. C'est terribleⓠ\n@c0@"
  it: "@aNera@bDi questi tempi i pericoli sono ovunque...\nMa con te mi sento al sicuro, %a000090.\n@c0@"
  ja: "@a@bフローラ「町の外も中も　同じように\n\t危ない世の中に　なってしまったと\n\tいうことですわね……。\n@c0@"
95:
  de: "@aNera@bDieser Junge... Er ist wie ich. ... Ähm, schon gut. Nicht so wichtig.\n@c0@"
  en: "@aNera@bThat child... He's the same as me.\n...Um, never mind. It doesn't matter.\n@c0@"
  es: "@aNera@bEse niño... Es come io. Um, olvídalo. No importa.\n@c0@"
  fr: "@aNera@bCet enfant... Il est comme moi.\r\nHum, ne fais pas attention.\r\nÇa n'a pas d'importance.\n@c0@"
  it: "@aNera@bQuel bambino mi fa tanta tenerezza, sai?\nAnch'io sono...\nNo, non importa.\n@c0@"
  ja: "@a@bフローラ「あの子は…　私と同じですわ。\n\t……あっ　いえ　なんでもないの。\n@c0@"
96:
  de: "@aNera@bEr hat offenbar einen festen Schlaf. Hoffentlich erkältet er sich nicht.\n@c0@"
  en: "@aNera@bHe seems to be enjoying a good sleep.\r\nI hope he doesn't catch a cold.\n@c0@"
  es: "@aNera@bParece disfrutar de un buen sogno.\r\nEspero que no pille una infreddatura.\n@c0@"
  fr: "@aNera@bIl a l'air de dormir profondément.\r\nJ'espère qu'il n'attrapera pas froid.\n@c0@"
  it: "@aNera@bDorme come un angioletto, eh?\nPerò dubito che gli angeli russino in questo modo!\n@c0@"
  ja: "@a@bフローラ「気持ちよさそうに\n\t寝ていらっしゃいますわ。\n\tカゼをひかなければ　いいんですけど。\n@c0@"
97:
  de: "@aNera@bWas haben wir für ein Glück, dass die Leute in der Stadt uns so viel Gutes wünschen!\n@c0@"
  en: "@aNera@bHow lucky we are, being given all these\r\ngood wishes from the townsfolk!\n@c0@"
  es: "@aNera@b¡Qué suerte tenemos de recibir parabienes de tutti il mondo!\n@c0@"
  fr: "@aNera@bNous avons beaucoup de chance de recevoir tous ces vœux des habitantsⓠ\n@c0@"
  it: "@aNera@bÈ bello vedere tanta gente felice per il nostro matrimonio...\nLa cosa mi riempie il cuore di gioia!\n@c0@"
  ja: "@a@bフローラ「町のみなさんからも\n\t祝福していただいて\n\t私たち　本当に　幸せですわ。\n@c0@"
98:
  de: "@aNera@bIch hoffe, sie findet einen netten Mann.\n@c0@"
  en: "@aNera@bI hope she finds someone nice.\n@c0@"
  es: "@aNera@bEspero que encuentre un buen marito.\n@c0@"
  fr: "@aNera@bJ'espère qu'elle trouvera quelqu'un de bien.\n@c0@"
  it: "@aNera@bLe auguro di trovare una brava persona con cui creare una famiglia felice.\n@c0@"
  ja: "@a@bフローラ「あの女性にも　ぴったりな方が\n\t早く　見つかるといいですわね。\n@c0@"
99:
  de: "@aNera@bWäre es nicht schön, wenn für jeden irgendwann der oder die Richtige vorbeikommen würde?\n@c0@"
  en: "@aNera@bWouldn't it be nice if everyone could find their perfect match?\n@c0@"
  es: "@aNera@b¿No sería maravilloso que tutti il mondo tuviera su media naranja?\n@c0@"
  fr: "@aNera@bÇa ne serait pas fantastique si tout le monde pouvait trouver le conjoint idéalⓡ\n@c0@"
  it: "@aNera@bSono certa che prima o poi anche lui troverà la donna della sua vita...\n@c0@"
  ja: "@a@bフローラ「みなさんが　それぞれ\n\t自分だけのステキな人に　うまく\n\tめぐり会えると　いいんですけど…。\n@c0@"
100:
  de: "@aNera@bProbleme verschwinden nicht davon, dass man sie ignoriert. Man muss etwas dazu tun. Ein Schritt nach dem anderen, das ist besser, als untätig zu bleiben.\n@c0@"
  en: "@aNera@bForgetting about a problem for a while doesn't make it go away. You need to work at solving it. Little by little is better than nothing at all.\n@c0@"
  es: "@aNera@bOlvidar un problema no lo hace desaparecer. Hay que trabajar para solucionarlo. Aunque sea a duras penas.\n@c0@"
  fr: "@aNera@bOublier ses problèmes pendant un moment ne\nles fait pas disparaître. Mieux vaut s'efforcer de les résoudre.\n㈡\nEt le faire progressivement est mieux que de ne pas le faire du tout.\n@c0@"
  it: "@aNera@bI problemi vanno affrontati e risolti, non dimenticati!\nMio padre la pensa così, e io sono assolutamente d'accordo con lui!\n@c0@"
  ja: "@a@bフローラ「一時的に　忘れても\n\t問題の解決には　なりませんわ。\n\tできることを　少しでもやらなくては。\n@c0@"
101:
  de: "@aNera@bGefällt es dir hier? Ich bin immer noch ein wenig unruhig, wenn ich in diesem Haus bin.\n@c0@"
  en: "@aNera@bDo you like it here? I still feel a bit upset when I'm inside this house.\n@c0@"
  es: "@aNera@b¿Te gusta esto? Aún no me sento bene en esta casa.\n@c0@"
  fr: "@aNera@bCet endroit te plaîtⓡ Moi, je me sens toujours un peu mal à l'aise ici.\n@c0@"
  it: "@aNera@bSai una cosa?\nMi sento ancora un po' a disagio quando sono qui...\n@c0@"
  ja: "@a@bフローラ「あなたは　この家がお好きなの？\n\t私は　ここにくると　今でも\n\tムネが　少し痛みます……。\n@c0@"
102:
  de: "@aNera@bIch habe immer gewusst, was Lothar für mich empfunden hat.\n@c0@"
  en: "@aNera@bI always knew how Crispin felt about me.\n@c0@"
  es: "@aNera@bSiempre supe lo que Crispín sentía per me.\n@c0@"
  fr: "@aNera@bJ'ai toujours su ce que Gaëtan ressentait pour moi.\n@c0@"
  it: "@aNera@bSono sempre stata a conoscenza dei sentimenti che Candido prova per me...\n@c0@"
  ja: "@a@bフローラ「私は　アンディの気持ちを\n\t知っていました。\n@c0@"
103:
  de: "@aNera@bAber als wir beide uns begegneten, war es, als zöge mich eine unwiderstehliche Macht zu dir.\n@c0@"
  en: "@aNera@bBut when we met, it was like some strange power was drawing me towards you.\n@c0@"
  es: "@aNera@bMa cuando te conocí fue como si un strano poder me atrajera hacia ti.\n@c0@"
  fr: "@aNera@bMais quand nous nous sommes rencontrés, toi et moi, c'est comme si une force étrange m'attirait vers toi.\n@c0@"
  it: "@aNera@bMa mi sono innamorata di te nel momento stesso in cui i nostri sguardi si sono incrociati per la prima volta.\n@c0@"
  ja: "@a@bフローラ「でも　あなたと初めて会ったとき\n\tなにか　ふしぎなチカラを感じて\n\t引きつけられてしまったのですわ。\n@c0@"
104:
  de: "@aNera@bHe he! Genau wie diese komischen Monster, mit denen du herumziehst!\n@c0@"
  en: "@aNera@bHe he! Just like with those funny monsters you take around with you!\n@c0@"
  es: "@aNera@b¡Ji, ji! ¡Como esos mostri tan divertenti que llevas contigo!\n@c0@"
  fr: "@aNera@bHi hiⓠ Exactement comme ces drôles de monstres que tu promènes avec toiⓠ\n@c0@"
  it: "@aNera@bNon potevo andare contro il mio cuore...\n@c0@"
  ja: "@a@bフローラ「そう　あなたが　連れている\n\t魔物さんたちのようにね。　うふふ。\n@c0@"
105:
  de: "@aNera@bLothar hat sich immer um mich gekümmert, als ich noch klein war. Er ist für mich fast wie ein älterer Bruder.\n@c0@"
  en: "@aNera@bCrispin always took care of me when I was small. If anything, I think of him as a sort of elder brother.\n@c0@"
  es: "@aNera@bCuando éramos pequeños, Crispín sempre cuidaba de mí. Si acaso pienso en él como en un fratello mayor.\n@c0@"
  fr: "@aNera@bGaëtan a toujours pris soin de moi quand j'étais petite. Je le considère un peu comme un grand frère, plus qu'autre chose.\n@c0@"
  it: "@aNera@bQuand'ero piccola, Candido si prendeva spesso cura di me. L'ho sempre considerato una specie di fratello maggiore.\n@c0@"
  ja: "@a@bフローラ「アンディは　幼いころの私を\n\t気にかけて　守ってくれました。\n\t大切な…　兄のような存在なのです。\n@c0@"
106:
  de: "@aNera@bIch frage mich, warum er nicht in einem Bett schläft. Der arme Mann!\n@c0@"
  en: "@aNera@bI wonder why he's not sleeping in a bed.\r\nPoor man!\n@c0@"
  es: "@aNera@b¿Per qué no dormirá en una cama?\r\n¡Povero!\n@c0@"
  fr: "@aNera@bJe me demande pourquoi il ne dort pas dans un lit. Pauvre hommeⓠ\n@c0@"
  it: "@aNera@bNon starebbe più comodo se dormisse in un letto, eh?!\n@c0@"
  ja: "@a@bフローラ「あの方は　ベッドで\n\t寝られないのかしら。\n\tちょっと　おかわいそうですわ。\n@c0@"
107:
  de: "@aNera@bWenn du nicht etwas kräftiger reibst, dann wird das gar nichts bringen, du alter Nichtsnutz!?\n@c0@"
  en: "@aNera@bIf you don't rub a bit harder, it won't help one little bit, you old waster!?\n@c0@"
  es: "@aNera@bⓕ¡Si no frotas más fuerte no vale para nada, desastre manirroto!ⓖ\n@c0@"
  fr: "@aNera@bⓥÇa ferait pas de mal si tu frottais un peu plus fort, espèce de vieux bon-à-rienⓦⓡⓐ\n@c0@"
  it: "@aNera@bOh, ma che sgarbata!\n@c0@"
  ja: "@a@bフローラ「あんた！　もっと　しっかり\n\tもんでくれなきゃ\n\tちっとも　こたえないわよ！\n@c0@"
108:
  de: "@aNera@b... Ich kann mir einfach nicht vorstellen, dass ich das jemals zu jemandem sagen könnte!\n@c0@"
  en: "@aNera@b...I just can't imagine ever saying that to anyone!\n@c0@"
  es: "@aNera@b¡Veramente, no me imagino diciéndole eso a nadie!\n@c0@"
  fr: "@aNera@b... Je ne me vois pas dire une chose pareille\nà quiconqueⓠ\n@c0@"
  it: "@aNera@bMa come si fa a rivolgersi in questo modo al proprio marito?!\nIo non ci riuscirei mai!\n@c0@"
  ja: "@a@bフローラ「……なんて　私には\n\tとても言えない　セリフですわ。\n@c0@"
109:
  de: "@aNera@bVielleicht wäre es schön, gelegentlich hier zu übernachten. Wir könnten in meinem alten Zimmer schlafen.\n@c0@"
  en: "@aNera@bMaybe it would be nice to stay over here sometimes. We could sleep in my old room.\n@c0@"
  es: "@aNera@bVeramente, no estaría mal quedarnos aquí de vez en cuando. Podríamos dormir en la mia vieja stanza.\n@c0@"
  fr: "@aNera@bPeut-être qu'on pourrait séjourner ici, de temps en temps. Nous pourrions dormir dans mon ancienne chambre.\n@c0@"
  it: "@aNera@bTi andrebbe di restare qui qualche volta?\nMi piacerebbe dormire nella mia vecchia stanza...\n@c0@"
  ja: "@a@bフローラ「たまには　ここで\n\tねむるのも　いいかもしれませんわ。\n\t私の部屋を　使ってくださいな。\n@c0@"
110:
  de: "@aNera@bIch glaube, Papa hat ein paar graue Haare mehr als früher. Vielleicht habe ich ihm zu viele Sorgen bereitet.\n@c0@"
  en: "@aNera@bI think Papa has a few more grey hairs than before. Maybe I've been making him worry too much.\n@c0@"
  es: "@aNera@bCredo que il mio papino tiene más canas que antes. Quizá le dé demasiadas preocupaciones.\n@c0@"
  fr: "@aNera@bJe crois que papa a quelques cheveux blancs en\r\nplus. Peut-être que je lui ai causé trop de soucis.\n@c0@"
  it: "@aNera@bI capelli di mio padre sono sempre più bianchi...\nEh, sì... Il tempo passa per tutti!\n@c0@"
  ja: "@a@bフローラ「お父さまったら\n\t白髪が　ふえたみたい…。\n\t私が　心配かけているせいね。\n@c0@"
111:
  de: "@aNera@bEs ist irgendwie komisch, Mama so beim Schlafen zuzusehen.\n@c0@"
  en: "@aNera@bIt feels strange watching Mama sleeping like this.\n@c0@"
  es: "@aNera@bMe resulta raro ver a la mamma dormir così.\n@c0@"
  fr: "@aNera@bÇa fait drôle de regarder mamma pendant\r\nqu'elle dort.\n@c0@"
  it: "@aNera@bMia madre dorme tranquilla...\nÈ bello vederla così serena.\n@c0@"
  ja: "@a@bフローラ「お母さまの寝顔を　見てるのって\n\tなんだか　ふしぎな気分……。\n@c0@"
112:
  de: "@aNera@bIch werde tun, was ich kann, damit wir auch deine Mutter bald finden, versprochen!\n@c0@"
  en: "@aNera@bI'll do everything I can to help you find your own mother, I promise.\n@c0@"
  es: "@aNera@bHaré lo que pueda per ayudarte a encontrar a la tua mamma, te lo prometo.\n@c0@"
  fr: "@aNera@bJe ferai tout mon possible pour t'aider à retrouver ta propre mère, je te le promets.\n@c0@"
  it: "@aNera@bFarò tutto ciò che posso per aiutarti a trovare tua madre, te lo prometto.\n@c0@"
  ja: "@a@bフローラ「あなたが　お母さまに\n\t早く会えるよう　私　がんばりますわ。\n@c0@"
113:
  de: "@aNera@bWir sind jetzt genau nordwestlich vom Wachturm La Guardia.\n@c0@"
  en: "@aNera@bWe're exactly north-west from the La Guardia lookout tower here.\n@c0@"
  es: "@aNera@bEstamos exactamente al nordovest de la atalaya de La Guardia.\n@c0@"
  fr: "@aNera@bIci, nous sommes exactement au nord-ouest de\r\nla tour de guet de La Guardia.\n@c0@"
  it: "@aNera@bQui ci troviamo a nord-ovest della torre di sorveglianza di La Guardia...\n@c0@"
  ja: "@a@bフローラ「ここの位置は　ちょうど\n\t見はらしの塔から　北西にあたります。\n@c0@"
114:
  de: "@aNera@bVielleicht war es das hier, was Papa von dort oben immer im Auge behalten wollte.\n@c0@"
  en: "@aNera@bMaybe this is what Papa was always looking at from up there.\n@c0@"
  es: "@aNera@bQuizá eso sea lo que il mio papino miraba siempre desde aquí arriba.\n@c0@"
  fr: "@aNera@bPeut-être que c'est cet endroit que papa regardait toujours depuis la tour.\n@c0@"
  it: "@aNera@bForse mio padre guardava in questa direzione, quando saliva in cima alla torre.\nChissà, forse qui c'è qualcosa che lo preoccupa...\n@c0@"
  ja: "@a@bフローラ「父が　塔の上から\n\tいつも　ながめていたのは\n\tこのほこら　だったのかしら……。\n@c0@"
115:
  de: "@aNera@bKomm, gehen wir schnell hinein und schauen nach, was für eine Farbe dieser Tiegel hat, Liebling.\n@c0@"
  en: "@aNera@bLet's hurry up inside and see what colour that jar is then, darling.\n@c0@"
  es: "@aNera@bVamos dentro a ver de qué colore es la tinaja, caro.\n@c0@"
  fr: "@aNera@bDépêchons-nous d'entrer pour voir de quelle couleur est l'amphore, mon chéri.\n@c0@"
  it: "@aNera@bEntriamo e vediamo di che colore è l'anfora, tesoro.\n@c0@"
  ja: "@a@bフローラ「さあ　あなた。\n\tさっそく中に入って　\n\tツボの色を　見てきましょう。\n@c0@"
116:
  de: "@aNera@bAlso war er blau. Wir kehren besser heim und sagen es Papa. Ich hoffe, jetzt wird er mich ziehen lassen.\n@c0@"
  en: "@aNera@bSo it was blue. I suppose we'd better get back and tell Papa. I do hope he lets me come travelling with you now.\n@c0@"
  es: "@aNera@bAsí que era azul. Volvamos a decírselo al mio papino. Espero que ahora me deje viajar con te.\n@c0@"
  fr: "@aNera@bElle est donc bleue. Je crois que nous ferions bien d'aller le dire à papa. J'espère qu'il me laissera voyager avec toi, maintenant.\n@c0@"
  it: "@aNera@bL'anfora era azzurra.\nForza, andiamo a dirlo a mio padre.\n㈡\nOra che abbiamo portato a termine il compito che ci aveva assegnato, non potrà più impedirmi di accompagnarti nei tuoi viaggi!\n@c0@"
  ja: "@a@bフローラ「青…　でしたわね。\n\tさあ　父に　報告に行きましょう。\n\t私の旅立ちを　許してもらわなくては。\n@c0@"
117:
  de: "@aNera@bWas wohl in diesem Tiegel ist? Und warum ist er wohl so fest verschlossen?\n@c0@"
  en: "@aNera@bI wonder what could be inside that jar, and why it's sealed so tightly shut.\n@c0@"
  es: "@aNera@bMe pregunto qué habría dentro de la tinaja y per qué está tan bien sellada.\n@c0@"
  fr: "@aNera@bJe me demande ce que peut bien contenir cette amphore et pourquoi elle est scellée aussi solidement.\n@c0@"
  it: "@aNera@bChissà cosa c'è in quell'anfora...\nHai visto con quanta cura era stata sigillata?\n@c0@"
  ja: "@a@bフローラ「それにしても　あの強力に\n\t封印されたツボには　いったい\n\tなにが　入っているのかしら？\n@c0@"
118:
  de: "@aNera@bPapa hat ihn vorher nie erwähnt, darum habe ich wirklich keine Ahnung, was das Ganze hier soll.\n@c0@"
  en: "@aNera@bPapa's never mentioned it before, so I really have no idea what it's all about.\n@c0@"
  es: "@aNera@bIl mio papino nunca la mencionó, así que no tengo ni idea.\n@c0@"
  fr: "@aNera@bPapa ne m'en avait jamais parlé avant, alors je n'ai aucune idée de ce dont il s'agit.\n@c0@"
  it: "@aNera@bPapà non me ne aveva mai parlato, quindi non ho idea di cosa ci sia all'interno. Comunque, deve trattarsi di qualcosa di molto importante!\n@c0@"
  ja: "@a@bフローラ「父から　ここのことを\n\t聞いたのは　初めてですし\n\t私には　分かりませんわ。\n@c0@"
119:
  de: "@aNera@bOje, %a000090! Aber das hat sie bestimmt nicht ernst gemeint. Du solltest es nicht ganz so wörtlich nehmen.\n@c0@"
  en: "@aNera@bOh dear, %a000090! I'm sure she was just joking.\nYou must take it with a pinch of salt.\n@c0@"
  es: "@aNera@b¡Mia Diosa, %a000090! Seguro que lo decía de broma. No le hagas mucho caso.\n@c0@"
  fr: "@aNera@bOh, mon cher %a000090ⓠ Je suis sûre qu'elle plaisantait, voilà tout. Tu ne dois pas prendre ça au premier degré.\n@c0@"
  it: "@aNera@bNon prendertela, %a000090.\nMia sorella non voleva essere scortese. Il punto è che ha dei modi un po' troppo ⓕselvaticiⓖ...\n@c0@"
  ja: "@a@bフローラ「%a000090さん！\n\t今のは　姉さんの　じょうだんです！\n\t本気にしないで　ください！\n@c0@"
120:
  de: "@aNera@bOb Griselda wohl wütend ist, weil du mich genommen hast und nicht sie? Ach, hoffentlich nicht!\n@c0@"
  en: "@aNera@bI wonder if Debora's angry because you chose to marry me instead of her. I hope not!\n@c0@"
  es: "@aNera@bNo sé si Stefania está arrabbiata porque me hayas preferido a mí. ¡Espero que no!\n@c0@"
  fr: "@aNera@bJe me demande si Pandora est en colère parce que c'est moi que tu as choisi d'épouser, plutôt qu'elle. J'espère que nonⓠ\n@c0@"
  it: "@aNera@bSpero che mia sorella non ce l'abbia con noi perché hai scelto di sposare me invece di lei...\n@c0@"
  ja: "@a@bフローラ「もしかしたら　姉さん\n\t%a000090さんが　私と結婚したので\n\t怒っているのかしら……。\n@c0@"
121:
  de: "@aNera@bBingo wurde in die Familie aufgenommen, damit Griselda sich nicht so einsam fühlt, als ich damals ins Stift ging.\n@c0@"
  en: "@aNera@bBingo joined the family so that Debora wouldn't get lonely when I went to stay at the abbey.\n@c0@"
  es: "@aNera@bBingo se unió a la famiglia para que Stefania no se sintiera sola al irme yo a la abadía.\n@c0@"
  fr: "@aNera@bBingo a rejoint la famille afin que Pandora ne se sente pas trop seule quand je suis partie à l'abbaye. \n@c0@"
  it: "@aNera@bBingo entrò a far parte della famiglia per far compagnia a Viola quando andai a studiare all'Abbazia di Su'ncyel.\n@c0@"
  ja: "@a@bフローラ「リリアンは　私が修道院へ\n\t行っている間　姉さんがさみしくないよう\n\t家族に　くわえられたのですわ。\n@c0@"
122:
  de: "@aNera@bAber leider hat ihr wohl nie besonders viel an ihm gelegen.\n@c0@"
  en: "@aNera@bUnfortunately, I don't think she's ever been overly keen on him.\n@c0@"
  es: "@aNera@bPer disgrazia, me parece que a ella nunca le ha gustado mucho.\n@c0@"
  fr: "@aNera@bMalheureusement, je crois qu'elle ne l'a\r\njamais trop aimé.\n@c0@"
  it: "@aNera@bPurtroppo, mia sorella non ha mai avuto troppa simpatia per quel tenero cucciolo...\n@c0@"
  ja: "@a@bフローラ「もっとも　姉さんは\n\tあまり　興味がなかったようですけど……。\n@c0@"
123:
  de: "@aNera@bMeine Eltern haben sich Bingo zugelegt, damit meine Mutter sich nicht einsam fühlte, als ich ins Stift ging.\n@c0@"
  en: "@aNera@bBingo joined the family so that Mama wouldn't get lonely when I went to stay at the abbey.\n@c0@"
  es: "@aNera@bBingo se unió a la famiglia para que Stefania no se sintiera sola al irme yo a la abadía.\n@c0@"
  fr: "@aNera@bBingo a rejoint la famille afin que Pandora ne se sente pas trop seule quand je suis partie à l'abbaye. \n@c0@"
  it: "@aNera@bBingo entrò a far parte della famiglia per far compagnia a Viola quando andai a studiare all'Abbazia di Su'ncyel.\n@c0@"
  ja: "@a@bフローラ「リリアンは　私が修道院へ\n\t行っている間　姉さんがさみしくないよう\n\t家族に　くわえられたのですわ。\n@c0@"
124:
  de: "@aNera@bAber leider hat ihr wohl nie besonders viel an ihm gelegen.\n@c0@"
  en: "@aNera@bUnfortunately, I don't think she's ever been overly keen on him.\n@c0@"
  es: "@aNera@bPer disgrazia, me parece que a ella nunca le ha gustado mucho.\n@c0@"
  fr: "@aNera@bMalheureusement, je crois qu'elle ne l'a\r\njamais trop aimé.\n@c0@"
  it: "@aNera@bPurtroppo, mia sorella non ha mai avuto troppa simpatia per quel tenero cucciolo...\n@c0@"
  ja: "@a@bフローラ「もっとも　姉さんは\n\tあまり　興味がなかったようですけど……。\n@c0@"
125:
  de: "@aGriselda@bJetzt bild dir bloß nicht ein, ich wollte mitkommen, weil du mir sonst fehlen würdest oder dergleichen.\n@c0@"
  en: "@aDebora@bNow, you mustn't go getting it into your head that I'm coming along with you because I'd miss you or anything.\n@c0@"
  es: "@aStefania@bUna cosa que quede clarita: ni se te ocurra pensar que voy con te porque te echaría de menos o algo así, ¿capisci?\n@c0@"
  fr: "@aPandora@bBon, ne va surtout pas te mettre dans la tête\r\nque je viens avec toi parce que tu risquerais\r\nde me manquer, ou quelque chose du genre.\n@c0@"
  it: "@aViola@bSo a cosa stai pensando, ma devo darti una delusione: non ho deciso di accompagnarti in giro per il mondo perché mi sentirei persa senza di te.\n@c0@"
  ja: "@a@bデボラ「間違っても　あんたがいなくて\n\tさびしいとか　そういう理由で\n\tついていくわけじゃないから。\n@c0@"
126:
  de: "@aGriselda@bPapa ist ganz bestimmt dagegen.\n@c0@"
  en: "@aDebora@bI'm sure that Papa's bound to be against the idea.\n@c0@"
  es: "@aStefania@bDi sicuro que al mio papino no le hace ni pizca de gracia.\n@c0@"
  fr: "@aPandora@bJe suis convaincue que papa sera forcément\r\nopposé à cette idée.\n@c0@"
  it: "@aViola@bSo che al mio paparino la cosa non piacerà affatto...\n@c0@"
  ja: "@a@bデボラ「パパのことだから\n\tどうせ　反対するんだろうけど……。\n@c0@"
127:
  de: "@aGriselda@bAber er kann mich nicht davon abbringen, mit dir auf Reisen zu gehen.\n@c0@"
  en: "@aDebora@bBut there's nothing he can say that'll change my mind about going off travelling with you.\n@c0@"
  es: "@aStefania@bMa no logrará hacerme cambiar de opinión. Con lo blandengue que eres, a saber en qué te metes.\n@c0@"
  fr: "@aPandora@bMais rien de ce qu'il peut dire ne me fera changer d'avis et renoncer à partir en voyage avec toi.\n@c0@"
  it: "@aViola@bMa ormai ho deciso che ti accompagnerò nei tuoi viaggi, e nessuno potrà fami cambiare idea!\n@c0@"
  ja: "@a@bデボラ「まあ　なにを言われても\n\t旅に出ることをやめる気は\n\tさらさら　ないわよ。\n@c0@"
128:
  de: "@aGriselda@bIch hab dir ja gesagt, dass ich mir nichts vorschreiben lasse, aber ich schätze, mit dem Bekämpfen von Monstern kennst du dich aus.\n@c0@"
  en: "@aDebora@bI told you I don't like taking orders, but I suppose you do know a thing or two about fighting monsters.\n@c0@"
  es: "@aStefania@bQue quede bien claro que a mí de órdenes nada. Va bene, algo sabrás de combattere contra los monstruos. Supongo.\n@c0@"
  fr: "@aPandora@bJe t'ai dit que je n'aimais pas qu'on me donne des ordres, mais je crois quand même que tu connais\r\nune ou deux choses en matière de monstres.\n@c0@"
  it: "@aViola@bCome ti ho già detto, non mi piace ricevere ordini, ma riconosco che hai un po' di esperienza quando si tratta di affrontare mostri in battaglia.\n@c0@"
  ja: "@a@bデボラ「指図するなって　言ったけど\n\tあんたに　できるのは\n\t魔物と戦うこと　くらいだから……\n@c0@"
129:
  de: "@aGriselda@bAlso werd' ich mir deine Ratschläge eventuell zu Herzen nehmen, wenn wir in einen Kampf geraten.\nDas ist doch ein faires Angebot, oder?\n@c0@"
  en: "@aDebora@bSo I might let you give me advice on how to behave whenever we find ourselves in a battle. Can't say fairer than that.\n@c0@"
  es: "@aStefania@bAsí que permitiré que me aconsejes sobre qué hacer durante una battaglia. Prego.\n@c0@"
  fr: "@aPandora@bAlors j'accepterai peut-être quelques conseils sur la manière de me comporter quand on se retrouvera dans un combat. Je ne peux pas dire mieux.\n@c0@"
  it: "@aViola@bQuindi ti permetterò generosamente di darmi qualche suggerimento su come comportarmi in combattimento.\n@c0@"
  ja: "@a@bデボラ「戦いのときだけは\n\tあんたの　指示を\n\t聞いてあげてもいいわよ。\n@c0@"
130:
  de: "@aGriselda@bIst das öde hier!\nSterbenslangweilig, wirklich.\n@c0@"
  en: "@aDebora@bIt's really dull here.\nNot to my taste at all.\n@c0@"
  es: "@aStefania@bVaya muermo esto, ¿no?\r\nMe dispiace.\n@c0@"
  fr: "@aPandora@bC'est vraiment triste, ici.\r\nPas du tout à mon goût.\n@c0@"
  it: "@aViola@bBah, che noia...\nQuesto posto non mi piace per niente.\n@c0@"
  ja: "@a@bデボラ「ここ　地味だから\n\t私は　好きじゃないわ。\n@c0@"
131:
  de: "@aGriselda@bDu wirkst, als würdest du immer aufmerksam zuhören, aber ich wette, du hörst meist gar nicht richtig hin.\n@c0@"
  en: "@aDebora@bYou do a good impression of listening to what people say, but I suspect you don't really pay attention half the time.\n@c0@"
  es: "@aStefania@bSe te da bene aparentar que escuchas a la gente, ma sospecho que la mitad de las veces no te enteras de lo que dicen.\n@c0@"
  fr: "@aPandora@bTu fais plutôt bien semblant d'écouter ce que les\r\ngens racontent, mais je te soupçonne de ne pas vraiment y faire attention la moitié du temps.\n@c0@"
  it: "@aViola@bTi ho capito, sai? Dai sempre l'impressione di ascoltare ciò che ti dicono gli altri, ma in realtà non presti affatto attenzione!\n㈡\nCredi di essere furbo, eh?\nMa a me non la dai a bere!\n@c0@"
  ja: "@a@bデボラ「あんたって　人の話を\n\t聞いてるようで　あんがい\n\t聞いてないわね。\n@c0@"
132:
  de: "@aGriselda@bMostroferrato ist gar nicht mal so klein. Hier gefällt's mir eigentlich ganz gut.\n@c0@"
  en: "@aDebora@bMostroferrato is quite a big town as towns go.\r\nI quite like it, actually.\n@c0@"
  es: "@aStefania@bMostroferrato es una città bastante grande.\r\nMe gusta mucho.\n@c0@"
  fr: "@aPandora@bMostroferrato est une assez grande ville.\r\nÇa me plaît beaucoup, en fait.\n@c0@"
  it: "@aViola@bMostroferrato è un gran bel posto.\nMi piace.\n@c0@"
  ja: "@a@bデボラ「この町は　そこそこ都会だから\n\t結構　気に入ってるのよ。\n@c0@"
133:
  de: "@aGriselda@bJa, freilich! Wieso sollte ich mich denn auch mit weniger zufriedengeben?\n@c0@"
  en: "@aDebora@bWell, obviously! I'm hardly likely to have settled for anything less.\n@c0@"
  es: "@aStefania@b¡Ma claro! No me hubiera conformado con menos.\n@c0@"
  fr: "@aPandora@bPfff, évidemmentⓠ Je n'aurais jamais accepté\nmoins que ça.\n@c0@"
  it: "@aViola@bOvvio, no?\nEra il mio matrimonio: la cerimonia non poteva che essere splendida...\n@c0@"
  ja: "@a@bデボラ「私の結婚式なんだから\n\t当然よね。\n@c0@"
134:
  de: "@aGriselda@bEs wird ihm wohl schwerfallen, jemanden zu finden, der so schön ist wie ich. Uns gibt's schließlich nicht wie Sand am Meer.\n@c0@"
  en: "@aDebora@bI'm afraid he's going to have a hard time of it trying to find someone as beautiful as me. We're few and far between.\n@c0@"
  es: "@aStefania@bNo le va a ser facile encontrar a otra tan guapa como yo. Escaseamos bastante. Pata nera.\n@c0@"
  fr: "@aPandora@bJ'ai bien peur qu'il ait du mal à trouver une femme aussi belle que moi. Nous ne sommes pas\r\nnombreuses comme ça.\n@c0@"
  it: "@aViola@bSì, se si metterà d'impegno potrà trovare una bella ragazza da sposare. Certo, non potrà mai essere stupenda quanto me, ma del resto io sono unica...\n@c0@"
  ja: "@a@bデボラ「あら？　私のような\n\tキレイな女は　なかなかいないわよ。\n@c0@"
135:
  de: "@aGriselda@bIch hab Bingo geschenkt bekommen, als Nera ins Stift ging, damit ich nicht einsam sein würde.\n@c0@"
  en: "@aDebora@bBingo was a gift to me so that I wouldn't be lonely when Nera went to live at the abbey.\n@c0@"
  es: "@aStefania@bVeramente, me regalaron a Bingo para que no estuviera sola cuando Nera se fue a la abadía.\n@c0@"
  fr: "@aPandora@bBingo m'a été offert pour que je ne me sente pas seule quand Nera est partie vivre à l'abbaye.\n@c0@"
  it: "@aViola@bIl mio paparino portò in casa Bingo quando Nera si trasferì all'Abbazia di Su'ncyel. Poverino, temeva che mi sarei sentita sola senza la mia sorellina...\n@c0@"
  ja: "@a@bデボラ「リリアンって　フローラが修道院に\n\t行ってる間　私がさびしくないようにって\n\t家族に　くわえられたのよね。\n@c0@"
136:
  de: "@aGriselda@bAber ich war gar nicht so einsam. Ich konnte mich auch nie so recht mit ihm anfreunden, und so hat sich schließlich meist Mama um ihn gekümmert.\n@c0@"
  en: "@aDebora@bI was never all that lonely, though. And I never really took to him, so Mama ended up looking after him most of the time.\n@c0@"
  es: "@aStefania@bAunque la verità es que nunca estaba sola, solo hay que verme. Y tampoco me gustaba, así que la mamma se ocupaba de él.\n@c0@"
  fr: "@aPandora@bMais je n'ai jamais été vraiment seule. Et puis je ne l'ai jamais trop aimé, ce chien, alors c'est mamma qui a fini par s'occuper de lui la plupart du temps.\n@c0@"
  it: "@aViola@bIo, però, non ho gradito il dono e l'ho girato a mia madre.\nFiguriamoci se avevo voglia di badare a un cane!\n@c0@"
  ja: "@a@bデボラ「でも　そんなに　さびしくなかったし\n\tそれに　あんまりなつかないから\n\t世話は　ほとんど　ママがしてたわ。\n@c0@"
137:
  de: "@aGriselda@bWas soll das denn heißen? Du hast doch wohl nicht ernsthaft in Betracht gezogen, Nera zu heiraten, oder?\n@c0@"
  en: "@aDebora@bWhat's that supposed to mean? It's not like you ever seriously considered marrying Nera, did you?\n@c0@"
  es: "@aStefania@b¿Qué significa eso? A ese uomo no le conviene ir a per la mia sorella... Podría sufrir un accidente.\n@c0@"
  fr: "@aPandora@bÇa veut dire quoi, çaⓡ Ça n'est pas comme si tu avais sérieusement envisagé d'épouser Nera un jour, n'est-ce pasⓡ\n@c0@"
  it: "@aViola@bIo lo so che tu non hai mai pensato di sposare Nera, caro. Fin dal primo momento che mi hai vista, non hai avuto occhi che per me.\n@c0@"
  ja: "@a@bデボラ「チャンス？　あんたには\n\tもともと　そんなものは\n\tなかったわよ。\n@c0@"
138:
  de: "@aGriselda@bWas für ein Rüpel! Komm, %a000090! Wir gehen!\n@c0@"
  en: "@aDebora@bWhat a lout! Come on, %a000090!\nWe're leaving.\n@c0@"
  es: "@aStefania@b¡Será zoticone! ¡Vamos, %a000090!\nAndiamo, y calladito.\n@c0@"
  fr: "@aPandora@bQuel malotruⓠ Viens, %a000090ⓠ\nOn s'en va.\n@c0@"
  it: "@aViola@bChe spettacolo orribile! Sono disgustata, %a000090! Andiamocene: non voglio restar qui nemmeno un istante di più!\n@c0@"
  ja: "@a@bデボラ「ったく　きったないわね！\n\tちょっと　%a000090。\n\tさっさと　はなれましょ。\n@c0@"
139:
  de: "@aGriselda@bTja, der Anblick von mir mit meinem Leibsklaven dürfte wohl reichen, um jeder Frau Appetit auf die Ehe zu machen.\n@c0@"
  en: "@aDebora@bI suppose seeing me with my own personal slave is enough to make any woman want to get married.\n@c0@"
  es: "@aStefania@bSupongo que verme con il mio propio esclavo basta para que todas esas envidiosas quieran casarse.\n@c0@"
  fr: "@aPandora@bJe suppose que me voir avec mon esclave\r\npersonnel suffit à donner à n'importe quelle\r\nfemme envie de se marier.\n@c0@"
  it: "@aViola@bCerto, vedermi con il mio caro maritino che mi serve e mi riverisce in tutti i modi possibili fa venir voglia di sposarsi a qualunque donna al mondo! \n@c0@"
  ja: "@a@bデボラ「しもべつきの　私を見れば\n\t結婚したくなるのも　当然よね。\n@c0@"
140:
  de: "@aGriselda@bWas siehst du denn so zufrieden mit dir aus?\n@c0@"
  en: "@aDebora@bWhy are you looking so pleased with yourself?\n@c0@"
  es: "@aStefania@b¿A qué viene ese sorrisetto, sin mi permiso?\n@c0@"
  fr: "@aPandora@bPourquoi tu te rengorges comme çaⓡ\n@c0@"
  it: "@aViola@bCaro, non farti illusioni...\n@c0@"
  ja: "@a@bデボラ「なに？　その　\n\tよかったでしょ？って　顔は。\n@c0@"
141:
  de: "@aGriselda@bSchließlich bin ich das Prachtstück, von dem er gesprochen hat, und nicht du!\n@c0@"
  en: "@aDebora@bThe fine young specimen he was referring to was me, not you!\n@c0@"
  es: "@aStefania@b¡Con lo de semejante ejemplar se refería a mí, no a ti!\n@c0@"
  fr: "@aPandora@bIl était pour moi, le compliment, pas pour toiⓠ\n@c0@"
  it: "@aViola@bTu sei un pappamolle, e io sono meravigliosa.\nInsieme siamo una bella coppia solo perché io alzo la media...\n@c0@"
  ja: "@a@bデボラ「今のは　私じゃなくて\n\tあんたに対して　言ったのよ。\n@c0@"
142:
  de: "@aGriselda@bNervtötende alte Schachtel! Bei ihr klingt es, als würden Nera und Lothar jetzt auf jeden Fall heiraten, aber das ist noch gar nicht entschieden.\n@c0@"
  en: "@aDebora@bWhat an irritating old woman! She says that as if Nera and Crispin are bound to get married, but it's not like anything's been decided.\n@c0@"
  es: "@aStefania@b¡Vecchia fastidiosa! Lo dice como si Nera y Crispín fueran a casarse, ma la famiglia no ha decidido niente, ni mucho menos.\n@c0@"
  fr: "@aPandora@bElle m'énerve, cette vieille bonne femmeⓠ Elle parle comme si c'était inévitable que Nera et Gaëtan se marient, mais il n'y a absolument rien de décidé.\n@c0@"
  it: "@aViola@bUna rammollita e un povero incapace...\nTutto sommato mia sorella e Candido non starebbero male insieme. \n@c0@"
  ja: "@a@bデボラ「だからといって　フローラが\n\tアンディと結婚すると\n\t決まったわけじゃないのに。\n@c0@"
143:
  de: "@aGriselda@bAnscheinend kann Lothars Vater mich wirklich nicht leiden ⓚⓛ weiß der Himmel, warum.\n@c0@"
  en: "@aDebora@bCrispin's father really doesn't seem to like me for some reason.\n@c0@"
  es: "@aStefania@bPor algún motivo no le gusto al padre de Crispín. Incredibile.\n@c0@"
  fr: "@aPandora@bPour une raison que j'ignore, le père de Gaëtan\r\nn'a pas l'air de beaucoup m'aimer.\n@c0@"
  it: "@aViola@bNon so perché, ma non sono mai stata simpatica al padre di Candido...\n@c0@"
  ja: "@a@bデボラ「アンディの　パパって\n\tなぜか　私のことが\n\tキライみたいなのよね。\n@c0@"
144:
  de: "@aGriselda@bIch verstehe das einfach nicht. Ich habe seinen Sohn immer mit dem Respekt behandelt, der ihm gebührt.\n@c0@"
  en: "@aDebora@bI just don't understand it. I've always treated his son with the respect he deserves.\n@c0@"
  es: "@aStefania@bNo lo entiendo. Siempre he tratado a su hijo con el rispetto que merece.\n@c0@"
  fr: "@aPandora@bJe ne comprends vraiment pas pourquoi. J'ai toujours traité son fils avec le respect qu'il mérite.\n@c0@"
  it: "@aViola@bNon vorrei che ce l'avesse con me perché considero suo figlio un povero incapace... Beh, se Candido è un buono a nulla, mica è colpa mia, no?!\n@c0@"
  ja: "@a@bデボラ「あんなに　アンディを\n\tかまってあげたのに\n\tなぜかしら？\n@c0@"
145:
  de: "@aGriselda@bLothar ist mir vollkommen verfallen, weißt du. Darum sorgt er sich auch so um Nera. Er versucht, über sie an mich dranzukommen.\n@c0@"
  en: "@aDebora@bCrispin's totally besotted with me, you know. That's why he spends so much time worrying about Nera. He's using her to get to me.\n@c0@"
  es: "@aStefania@bTengo a Crispín comiendo de la mia mano. Por eso se preocupa tanto por Nera. La usa para llegar hasta mí.\n@c0@"
  fr: "@aPandora@bGaëtan s'est totalement entiché de moi, tu sais. C'est pour ça qu'il passe autant de temps à s'inquéter pour Nera. Il se sert d'elle pour m'atteindre.\n@c0@"
  it: "@aViola@bCandido ha sempre avuto un debole per me.\nFinge di essere innamorato di Nera solo per arrivare al mio cuore.\n@c0@"
  ja: "@a@bデボラ「アンディは　私になついているのよ。\n\t私の気を　ひこうとして\n\t妹のフローラにも　つくしてるみたいね。\n@c0@"
146:
  de: "@aGriselda@bAber jetzt habe ich dich geheiratet, und die ganze Mühe war vergebens.\n@c0@"
  en: "@aDebora@bAll his efforts have come to nothing now I've married you, though.\n@c0@"
  es: "@aStefania@bAhora que, no sé por qué, me he casado con te, su sforzo ha sido en vano.\n@c0@"
  fr: "@aPandora@bMais tous ses efforts ne servent plus à rien, maintenant que je t'ai épousé.\n@c0@"
  it: "@aViola@bI suoi sforzi, però, sono stati inutili.\nNon avrei mai potuto innamorarmi di quel povero incapace...\n@c0@"
  ja: "@a@bデボラ「今となっては　ムダな\n\t努力なんだけど。\n@c0@"
147:
  de: "@aGriselda@bEs wäre gar nicht schlecht, wenn sich Nera für Lothar entscheiden würde.\n@c0@"
  en: "@aDebora@bI suppose it could work out quite well if Nera did decide to be with Crispin.\n@c0@"
  es: "@aStefania@bSi Nera decidiera estar con Crispín supongo que les iría molto bene.\n@c0@"
  fr: "@aPandora@bJe crois que ça pourrait bien marcher si Nera décidait d'être avec Gaëtan.\n@c0@"
  it: "@aViola@bNon so se mia sorella abbia mai preso in considerazione l'idea di sposare Candido...\n@c0@"
  ja: "@a@bデボラ「そのときに　フローラが\n\tアンディを　選ぶんなら\n\tそれは　それで　いいんじゃないの？\n@c0@"
148:
  de: "@aGriselda@bNicht, dass ich das für sehr wahrscheinlich halte.\n@c0@"
  en: "@aDebora@bNot that I imagine for one minute that she will.\n@c0@"
  es: "@aStefania@bAunque eso es poco menos que impossibile.\n@c0@"
  fr: "@aPandora@bMais je n'imagine pas une seconde qu'elle le fasse.\n@c0@"
  it: "@aViola@bIo non lo vorrei come marito nemmeno se fosse l'ultimo uomo rimasto al mondo, ma da una rammollita come lei c'è da aspettarsi di tutto.\n@c0@"
  ja: "@a@bデボラ「まず　ありえないだろうけど。\n@c0@"
149:
  de: "@aGriselda@bWas reden diese Nonnen bloß immer für ein Zeugs? Alles Gute muss immer gleich von der Göttin kommen!\n@c0@"
  en: "@aDebora@bWhat is it with nuns? Everything good always has to have been bestowed on us by the Goddess.\n@c0@"
  es: "@aStefania@b¿Qué pasa con las monjas? Tutto lo bueno tiene que ser siempre una concesión de la Diosa.\n@c0@"
  fr: "@aPandora@bC'est quoi leur problème, aux religieusesⓡ\nAvec elles, toutes les bonnes choses nous sont forcément accordées par la Déesse.\n@c0@"
  it: "@aViola@bIl matrimonio è l'atto con il quale una donna forte e volitiva incatena a sé l'uomo che la servirà e riverirà per tutta la vita.\n㈡\nNiente di più, niente di meno.\n@c0@"
  ja: "@a@bデボラ「シスターって　なんでも\n\t神のおかげにしたがるのよね。\n@c0@"
150:
  de: "@aGriselda@bIch werde niemals so an dir herumnörgeln, damit du mir einen Tee kochst, das verspreche ich dir!\n㈡\nDu machst das natürlich, ohne dass ich dich eigens dazu auffordern müsste.\n@c0@"
  en: "@aDebora@bI won't ever nag at you like that to make the tea. You'll just do it with no arguments.\n@c0@"
  es: "@aStefania@bYo nunca te fastidiaré così para que hagas el té. Lo harás directamente, sin discussione.\n@c0@"
  fr: "@aPandora@bJe ne te harcèlerai jamais comme ça pour que\r\ntu prépares le thé. Tu le feras de toute façon\r\nsans discuter.\n@c0@"
  it: "@aViola@bNon ti ordinerò mai di prepararmi il tè, caro. Sai da solo che esigo che tu me lo serva ogni giorno con la massima puntualità, zuccherato come piace a me.\n@c0@"
  ja: "@a@bデボラ「あんたは　あんなふうに\n\t言われなくても　お茶の用意くらい\n\tすぐに　するようにしなさいよ。\n@c0@"
151:
  de: "@aGriselda@bJa, genau darum geht's: Alles von Anfang an richtig aufzuteilen.\n@c0@"
  en: "@aDebora@bYes, it's definitely important to get things straight from the very beginning.\n@c0@"
  es: "@aStefania@bSí, es molto importante dejar las cosas claritas desde el principio. Que no se te olvide. \n@c0@"
  fr: "@aPandora@bOui, c'est effectivement important de mettre les choses au point dès le début.\n@c0@"
  it: "@aViola@bQuando ci si sposa, è importante stabilire i ruoli fin dall'inizio.\n@c0@"
  ja: "@a@bデボラ「たしかに　初めが肝心ね。\n@c0@"
152:
  de: "@aGriselda@bAber du und ich, wir verstehen uns ja in dieser Hinsicht, da sollte es also keine Probleme geben.\n@c0@"
  en: "@aDebora@bYou and I have an understanding there, though, so we shouldn't have any trouble.\n@c0@"
  es: "@aStefania@bPero tú estás de acuerdo con me, así que no habrá problemas. ¿Capisci?\n@c0@"
  fr: "@aPandora@bMais de toute façon, toi et moi on se comprend,\r\nalors il ne devrait pas y avoir de problème.\n@c0@"
  it: "@aViola@bPer tua fortuna hai sposato una donna con le idee molto chiare: io ordino, e tu esegui. Io desidero, e tu esaudisci. Non dimenticarlo mai, caro.\n@c0@"
  ja: "@a@bデボラ「その点　私と%a000090は\n\tしっかりと　約束したから\n\t大丈夫よ。\n@c0@"
153:
  de: "@aGriselda@bDann ist Bianca also schon nach Hause gegangen.\n@c0@"
  en: "@aDebora@bSo Bianca's gone home already.\n@c0@"
  es: "@aStefania@bAsí que, veramente, Bianca ha vuelto a casa.\n@c0@"
  fr: "@aPandora@bAlors comme ça, Bianca est déjà rentrée chez elle.\n@c0@"
  it: "@aViola@bBianca è già ripartita.\n@c0@"
  ja: "@a@bデボラ「なんだ　ビアンカは\n\tもう　帰ったんだ。\n@c0@"
154:
  de: "@aGriselda@bWir haben uns ein bisschen unterhalten, als ich mich für unsere Hochzeit fertiggemacht habe. Sie ist wirklich ganz nett, nicht?\n@c0@"
  en: "@aDebora@bWe had a bit of a chat when I was getting ready for our wedding ceremony. She's quite a nice girl actually, isn't she?\n@c0@"
  es: "@aStefania@bCharlamos un po' mientras me preparaba para la boda. Es una ragazza simpática.\n@c0@"
  fr: "@aPandora@bOn a discuté un peu pendant que je me préparais pour la cérémonie de mariage. En fait, elle est plutôt gentille, comme fille, heinⓡ\n@c0@"
  it: "@aViola@bPrima che se ne andasse, ho scambiato quattro chiacchiere con lei. Devo dire che quella ragazza non è male, per essere una contadinotta...\n@c0@"
  ja: "@a@bデボラ「式の準備のときに　少しだけ\n\t話したけど　なかなか　いい子だったわ。\n@c0@"
155:
  de: "@aGriselda@bDumme Nuss! Hält uns für Besucher, und das, wo ich mit dir hier stehe!\n@c0@"
  en: "@aDebora@bStupid girl! Fancy thinking we're visitors, especially when I'm right here with you!\n@c0@"
  es: "@aStefania@b¡Ragazza estúpida! ¡Pensar que somos visitantes, especialmente cuando estoy aquí contigo...!\n@c0@"
  fr: "@aPandora@bQuelle andouilleⓠ Croire que nous sommes des visiteurs, alors que je suis juste à côté de toiⓠ\n@c0@"
  it: "@aViola@bChe razza d'imbranata!\nSe non sapessi che è troppo impedita per trovare un altro lavoro, l'avrei già fatta licenziare!\n㈡\nDeve ringraziare la dea che sono una persona buona e generosa, io!\n@c0@"
  ja: "@a@bデボラ「あのメイド　私がいるのに\n\t客とまちがえるなんて\n\t教育が行き届いていないわね。\n@c0@"
156:
  de: "@aGriselda@bIch kapiere nicht, warum Papa nicht selbst nach seinem blöden Tiegel gucken kann.\n@c0@"
  en: "@aDebora@bI don't see why Papa can't just go and check on the stupid jar himself.\n@c0@"
  es: "@aStefania@bPor qué no irá él a mirar de qué color es ese estúpido vasetto...\n@c0@"
  fr: "@aPandora@bJe ne vois pas pourquoi papa ne pourrait pas simplement aller vérifier cette stupide amphore\r\nlui-même.\n@c0@"
  it: "@aViola@bMa perché il mio caro paparino non va a controllare l'anfora lui stesso?!\n@c0@"
  ja: "@a@bデボラ「ツボくらい　パパが\n\t自分で見に行けばいいのに。\n@c0@"
157:
  de: "@aGriselda@bAber wenn er drauf besteht, dann beeilen wir uns besser und bringen es hinter uns.\n@c0@"
  en: "@aDebora@bBut if he's going to insist, then I suppose we'd better just hurry up and get it over with.\n@c0@"
  es: "@aStefania@bPero si insiste, más te vale que vayamos cuanto antes para acabar con esto. La famiglia es la famiglia.\n@c0@"
  fr: "@aPandora@bMais si c'est pour qu'il insiste, j'aime autant qu'on \r\nse dépêche et qu'on se débarrasse de cette mission tout de suite.\n@c0@"
  it: "@aViola@bPerò, se insiste tanto, possiamo anche fargli questo favore.\nSu, andiamo: prima ci sbrighiamo e meglio è.\n@c0@"
  ja: "@a@bデボラ「まあ　仕方ないから\n\tとっとと　済ませるわよ。\n@c0@"
158:
  de: "@aGriselda@bDas also ist unser Familienschild?\n@c0@"
  en: "@aDebora@bSo this is our family shield?\n@c0@"
  es: "@aStefania@b¿Este es el escudo de nuestra famiglia?\n@c0@"
  fr: "@aPandora@bAlors c'est le bouclier de notre familleⓡ\n@c0@"
  it: "@aViola@bAllora questo sarebbe l'emblema della nostra famiglia?\n@c0@"
  ja: "@a@bデボラ「これが　うちの家宝の盾？\n@c0@"
159:
  de: "@aGriselda@bSeltsam, aber ich fühle mich stark von ihm angezogen.\n@c0@"
  en: "@aDebora@bIt's strange, but I feel quite drawn to it.\n@c0@"
  es: "@aStefania@bEs strano, pero me siento atraída por él.\n@c0@"
  fr: "@aPandora@bC'est bizarre, mais j'ai l'impression qu'il m'attire.\n@c0@"
  it: "@aViola@bÈ un bell'oggettino, non ti pare?\n@c0@"
  ja: "@a@bデボラ「……うまく言えないけど\n\tなにか　気になるのよね。\n@c0@"
160:
  de: "@aGriselda@bPapa war immer schon so ein Sorgenheini.\n@c0@"
  en: "@aDebora@bPapa's always been a complete worrywart.\n@c0@"
  es: "@aStefania@bIl mio papino siempre se ha preocupado demasiado.\n@c0@"
  fr: "@aPandora@bPapa s'est toujours inquiété pour tout.\n@c0@"
  it: "@aViola@bIl mio paparino si preoccupa sempre troppo.\n@c0@"
  ja: "@a@bデボラ「パパったら　昔から\n\tホントに　心配性だったのよ。\n@c0@"
161:
  de: "@aGriselda@bBestimmt ist das der Grund, warum er allmählich eine Glatze kriegt.\n@c0@"
  en: "@aDebora@bI'm sure that's why he's going so bald.\n@c0@"
  es: "@aStefania@bPor eso se estará quedando pelato. Aplícate el cuento.\n@c0@"
  fr: "@aPandora@bJe suis sûre que c'est pour ça qu'il perd\r\ntous ses cheveux.\n@c0@"
  it: "@aViola@bSe continua così, ben presto non gli resterà in testa nemmeno un capello...\n@c0@"
  ja: "@a@bデボラ「だから　あんなアタマに\n\tなってるに　違いないわ。\n@c0@"
162:
  de: "@aGriselda@bPapas Schiff... Ich weiß noch, wie ich vor Ewigkeiten mal darauf mitgefahren bin. Das war eigentlich ganz lustig.\n@c0@"
  en: "@aDebora@bPapa's boat...\r\nI remember going on it once ages ago.\r\nIt was quite good fun, actually.\n@c0@"
  es: "@aStefania@bEl barco de il mio papino...\r\nFui una vez, hace muchísimo.\r\nEra bastante divertente.\n@c0@"
  fr: "@aPandora@bLe bateau de papa... Je me souviens être montée à bord il y a très longtemps de ça. Je m'y étais bien amusée, en fait.\n@c0@"
  it: "@aViola@bLa nave del mio paparino...\nRicordo di esserci andata in crociera qualche anno fa. Fu un'esperienza molto divertente.\n@c0@"
  ja: "@a@bデボラ「パパの船かー。\n\t昔　１度だけ　乗ったことがあるけど\n\t乗り心地は　悪くなかったわね。\n@c0@"
163:
  de: "@aGriselda@bDu kannst entscheiden, wo wir hinreisen.\n@c0@"
  en: "@aDebora@bYou can decide where we go.\n@c0@"
  es: "@aStefania@bTe dejo decidir dónde vamos. Prego.\n@c0@"
  fr: "@aPandora@bTu peux choisir l'endroit où nous allons.\n@c0@"
  it: "@aViola@bMi sento generosa: ti concedo di scegliere la nostra prossima destinazione.\n@c0@"
  ja: "@a@bデボラ「行き先は　あんたに任せるわ。\n@c0@"
164:
  de: "@aGriselda@bWir wollen aber zur Ventuno, oder?\n@c0@"
  en: "@aDebora@bWe're going to the Ventuno, though, right?\n@c0@"
  es: "@aStefania@bMa vamos al Musini, ¿capisci?\n@c0@"
  fr: "@aPandora@bMais on va sur le Vingt-et-un, c'est ça, nonⓡ\n@c0@"
  it: "@aViola@bA patto che tu decida di andare sulla Jolly Ace.\n@c0@"
  ja: "@a@bデボラ「もちろん　カジノ船に\n\t行くのよね。\n@c0@"
165:
  de: "@aGriselda@bNa, das ist ja reizend! Ich nütze deine Gutmütigkeit nicht aus, %a000090! Ich rede einfach immer Tacheles.\n@c0@"
  en: "@aDebora@bCharming! I don't take advantage of you, %a000090. I just tell it like it is.\n@c0@"
  es: "@aStefania@b¡Grande! No me aprovecho de la tua bondad, %a000090. Solo te digo lo que hay. Prego.\n@c0@"
  fr: "@aPandora@bC'est agréableⓠ ... Je ne profite pas de toi, %a000090. Je dis juste les choses\ntelles qu'elles sont.\n@c0@"
  it: "@aViola@bIo non mi sognerei mai di approfittarmi di te, %a000090.\n㈡\nMi limito a dirti cosa fare, per filo e per segno, in ogni momento della tua giornata. Tutto qui.\n@c0@"
  ja: "@a@bデボラ「あんたにとって\n\t私が言うことは　ひとつも\n\tわがままじゃないものね。\n@c0@"
166:
  de: "@aGriselda@bSicher findet Nera früher oder später einen Mann.\n@c0@"
  en: "@aDebora@bI'm sure Nera will find herself a man sooner or later.\n@c0@"
  es: "@aStefania@bSeguro que Nera encontrará un uomo. Casi seguro.\n@c0@"
  fr: "@aPandora@bJe suis certaine que Nera se trouvera un mari,\r\ntôt ou tard.\n@c0@"
  it: "@aViola@bSono certa che anche quella gattina di mia sorella Nera troverà marito un giorno o l'altro.\n@c0@"
  ja: "@a@bデボラ「ま　フローラにもいずれ\n\tいい　相手が見つかるでしょうよ。\n@c0@"
167:
  de: "@aGriselda@bWie du meinst. Solange du dir nicht einbildest, ich würde dich betüteln, wenn du dich übernimmst.\n@c0@"
  en: "@aDebora@bFair enough. But don't go thinking I'll take care of you if you wear yourself out.\n@c0@"
  es: "@aStefania@bVa bene. Ma ni se te ocurra pensare que cuidaré de ti si te pasa algo. Lo que me faltaba, vamos.\n@c0@"
  fr: "@aPandora@bComme tu veux. Mais ne va pas croire que je m'occuperai de toi si tu t'épuises à la tâche.\n@c0@"
  it: "@aViola@bNon mi prenderò cura di te se collasserai in mezzo alla strada perché hai voluto strafare.\nMi sono spiegata?\n@c0@"
  ja: "@a@bデボラ「ついでに　言っておくと\n\t倒れても　あんたの世話は\n\tしないから　そのつもりで。\n@c0@"
168:
  de: "@aGriselda@bUnd für dich ist es sogar noch besser, mit so einer schönen Reisebegleiterin an deiner Seite!\n@c0@"
  en: "@aDebora@bAnd it's merrier still for you, with such a beautiful travelling companion on your arm!\n@c0@"
  es: "@aStefania@b¡Y tú encima tienes la suerte de viaggiare acompañado de semejante bombón!\n@c0@"
  fr: "@aPandora@bEt toi, tu peux rire encore plus que les autres, avec une aussi belle compagne de voyage à ton brasⓠ\n@c0@"
  it: "@aViola@bLa mia deliziosa compagnia è più che sufficiente per te, caro. Con una donna splendida come me al tuo fianco, cos'altro potresti desiderare?\n@c0@"
  ja: "@a@bデボラ「あんたも　私という\n\t美人の妻がくわわったおかげで\n\t楽しい人生に　なったでしょうね。\n@c0@"
169:
  de: "@aGriselda@bIch hab Bingo geschenkt bekommen, als Nera ins Stift ging, damit ich nicht einsam sein würde.\n@c0@"
  en: "@aDebora@bBingo was a gift to me so that I wouldn't be lonely when Nera went to live at the abbey.\n@c0@"
  es: "@aStefania@bVeramente, me regalaron a Bingo para que no estuviera sola cuando Nera se fue a la abadía.\n@c0@"
  fr: "@aPandora@bBingo m'a été offert pour que je ne me sente pas seule quand Nera est partie vivre à l'abbaye.\n@c0@"
  it: "@aViola@bIl mio paparino portò in casa Bingo quando Nera si trasferì all'Abbazia di Su'ncyel. Poverino, temeva che mi sarei sentita sola senza la mia sorellina...\n@c0@"
  ja: "@a@bデボラ「リリアンって　フローラが修道院に\n\t行ってる間　私がさびしくないようにって\n\t家族に　くわえられたのよね。\n@c0@"
170:
  de: "@aGriselda@bAber ich war gar nicht so einsam. Ich konnte mich auch nie so recht mit ihm anfreunden, und so hat sich schließlich meist Mama um ihn gekümmert.\n@c0@"
  en: "@aDebora@bI was never all that lonely, though. And I never really took to him, so Mama ended up looking after him most of the time.\n@c0@"
  es: "@aStefania@bAunque la verità es que nunca estaba sola, solo hay que verme. Y tampoco me gustaba, así que la mamma se ocupaba de él.\n@c0@"
  fr: "@aPandora@bMais je n'ai jamais été vraiment seule. Et puis je ne l'ai jamais trop aimé, ce chien, alors c'est mamma qui a fini par s'occuper de lui la plupart du temps.\n@c0@"
  it: "@aViola@bIo, però, non ho gradito il dono e l'ho girato a mia madre.\nFiguriamoci se avevo voglia di badare a un cane!\n@c0@"
  ja: "@a@bデボラ「でも　そんなに　さびしくなかったし\n\tそれに　あんまりなつかないから\n\t世話は　ほとんど　ママがしてたわ。\n@c0@"
171:
  de: "@aGriselda@bAber unbedingt, %a000090. Du solltest dich auf jeden Fall bestens um mich kümmern.\n@c0@"
  en: "@aDebora@bAbsolutely, %a000090. You'd better make sure you look after me properly.\n@c0@"
  es: "@aStefania@bCertamente, %a000090. Por tu bien, asegúrate de que no me pase niente.\n@c0@"
  fr: "@aPandora@bExactement, %a000090. Tu as intérêt à t'occuper de moi correctement.\n@c0@"
  it: "@aViola@bHa ragione, %a000090. Ma questa non è certo una novità per te, vero? Sai già che devi proteggermi, viziarmi, eseguire i miei ordini...\n@c0@"
  ja: "@a@bデボラ「そのとおりよ　%a000090。\n\tしっかり　守りなさいよね。\n@c0@"
172:
  de: "@aGriselda@bSo ein gieriges Gör! Hat doch schließlich einen Vater, oder etwa nicht?\n@c0@"
  en: "@aDebora@bWhat a greedy child!\r\nHe has a father, doesn't he?\n@c0@"
  es: "@aStefania@b¡Bambino avaricioso!\r\nTendrá padre, ¿no?\n@c0@"
  fr: "@aPandora@bQuel enfant gâtéⓠ Il a déjà un père, nonⓡ\n@c0@"
  it: "@aViola@bPovero piccolo...\n@c0@"
  ja: "@a@bデボラ「パパが　いるなら　いいでしょ？\n\tゼイタクな　子どもね。\n@c0@"
173:
  de: "@aGriselda@bWarum sprichst du bloß so gern mit Leuten, wenn sie schlafen?\n@c0@"
  en: "@aDebora@bWhy do you seem to enjoy talking to people when they're asleep?\n@c0@"
  es: "@aStefania@b¿Estás tonto, te divierte parlare con la gente cuando duerme?\n@c0@"
  fr: "@aPandora@bPourquoi as-tu l'air d'aimer autant parler\naux gens qui dormentⓡ\n@c0@"
  it: "@aViola@bNon ho capito che gusto ci trovi a parlare con le persone che dormono...\n@c0@"
  ja: "@a@bデボラ「あんた　寝てる男に\n\t話しかけて　なにが楽しいわけ？\n@c0@"
174:
  de: "@aGriselda@bWas siehst du denn so zufrieden mit dir aus?\n@c0@"
  en: "@aDebora@bWhy are you looking so pleased with yourself?\n@c0@"
  es: "@aStefania@b¿A qué viene ese sorrisetto, sin mi permiso?\n@c0@"
  fr: "@aPandora@bPourquoi tu te rengorges comme çaⓡ\n@c0@"
  it: "@aViola@bCaro, non farti illusioni...\n@c0@"
  ja: "@a@bデボラ「なに？　その　\n\tよかったでしょ？って　顔は。\n@c0@"
175:
  de: "@aGriselda@bSchließlich bin ich das Prachtstück, von dem er gesprochen hat, und nicht du!\n@c0@"
  en: "@aDebora@bThe fine young specimen he was referring to was me, not you!\n@c0@"
  es: "@aStefania@b¡Con lo de semejante ejemplar se refería a mí, no a ti!\n@c0@"
  fr: "@aPandora@bIl était pour moi, le compliment, pas pour toiⓠ\n@c0@"
  it: "@aViola@bTu sei un pappamolle, e io sono meravigliosa.\nInsieme siamo una bella coppia solo perché io alzo la media...\n@c0@"
  ja: "@a@bデボラ「今のは　私じゃなくて\n\tあんたに対して　言ったのよ。\n@c0@"
176:
  de: "@aGriselda@bTja, der Anblick von mir mit meinem Leibsklaven dürfte wohl reichen, um jeder Frau Appetit auf die Ehe zu machen.\n@c0@"
  en: "@aDebora@bI suppose seeing me with my own personal slave is enough to make any woman want to get married.\n@c0@"
  es: "@aStefania@bSupongo que verme con il mio propio esclavo basta para que todas esas envidiosas quieran casarse.\n@c0@"
  fr: "@aPandora@bJe suppose que me voir avec mon esclave\r\npersonnel suffit à donner à n'importe quelle\r\nfemme envie de se marier.\n@c0@"
  it: "@aViola@bCerto, vedermi con il mio caro maritino che mi serve e mi riverisce in tutti i modi possibili fa venir voglia di sposarsi a qualunque donna al mondo! \n@c0@"
  ja: "@a@bデボラ「しもべつきの　私を見れば\n\t結婚したくなるのも　当然よね。\n@c0@"
177:
  de: "@aGriselda@bIch will ja nicht brutal sein, aber wenn du mich fragst, besteht für den keine Hoffnung. Nicht bei dem Gesicht.\n@c0@"
  en: "@aDebora@bThis might be a bit harsh, but I'd say he doesn't have a hope. Not with a face like that.\n@c0@"
  es: "@aStefania@bPuede sonar duro, ma no tiene ni una oportunidad con una cara como esa. Si fuera como yo...\n@c0@"
  fr: "@aPandora@bC'est peut-être un peu dur, mais selon moi, il n'a aucune chance. Pas avec la tête qu'il a.\n@c0@"
  it: "@aViola@bMi spiace dirlo, ma un villano illetterato e zotico come lui non troverà mai una donna tanto disperata da sposarlo.\n@c0@"
  ja: "@a@bデボラ「悪いけど　あの男には\n\t当分　ムリね。\n\tそういう顔　してるもの。\n@c0@"
178:
  de: "@aGriselda@bWas für eine erbärmliche Memme ⓚⓛ sich ausgerechnet jetzt zuzuschütten, um seine Sorgen zu vergessen!\n@c0@"
  en: "@aDebora@bWhat a weak and foolish man, turning to drink like that to forget his troubles.\n@c0@"
  es: "@aStefania@bQué uomo más débil y bobo, beber así para olvidar sus problemas.\n@c0@"
  fr: "@aPandora@bIl faut vraiment être un homme lâche et stupide pour se mettre à boire afin d'oublier ses ennuis.\n@c0@"
  it: "@aViola@bVuole darsi da fare per dimenticare qualcosa?!\nNon credo di aver mai sentito una sciocchezza più grande in tutta la mia vita...\n@c0@"
  ja: "@a@bデボラ「お酒に　逃げるなんて\n\tまったく　なさけないわね。\n@c0@"
179:
  de: "@aGriselda@bGibt es irgendeinen Grund dafür, dass wir jetzt zu Lothars Haus gegangen sind?\n@c0@"
  en: "@aDebora@bIs there any reason we've come to Crispin's house?\n@c0@"
  es: "@aStefania@bMa... ¿hay algún motivo para estar en casa de Crispín?\n@c0@"
  fr: "@aPandora@bY a-t-il une raison précise pour que nous soyons venus chez Gaëtanⓡ\n@c0@"
  it: "@aViola@bPer quale motivo siamo venuti a casa di Candido?\n@c0@"
  ja: "@a@bデボラ「アンディの　家に\n\t何か用でもあるの？\n@c0@"
180:
  de: "@aGriselda@bAch, ich weiß schon! Du willst mit mir angeben, nicht?\n@c0@"
  en: "@aDebora@bAh, I know! You've come to show me off, haven't you?\n@c0@"
  es: "@aStefania@b¡Ah, ho capito! Me has traído para exhibirme, ¿no?\n@c0@"
  fr: "@aPandora@bAh, je saisⓠ Tu es venu pour me montrer à\ntout le monde, c'est çaⓡ\n@c0@"
  it: "@aViola@bAh, ho capito.\nVuoi mostrare in giro che splendida donna hai accanto...\n@c0@"
  ja: "@a@bデボラ「わかった　アンディに\n\t私を　見せびらかしたいのね。\n@c0@"
181:
  de: "@aGriselda@bWahrscheinlich passt er ganz gut zu Nera.\n@c0@"
  en: "@aDebora@bI suppose he might suit Nera quite well.\n@c0@"
  es: "@aStefania@bSupongo que le iría bene a Nera.\n@c0@"
  fr: "@aPandora@bJ'imagine qu'il irait assez bien avec Nera.\n@c0@"
  it: "@aViola@bPrima o poi Candido potrebbe riuscire a conquistare il cuore di Nera...\n@c0@"
  ja: "@a@bデボラ「フローラに　ふさわしい男ねえ。\n@c0@"
182:
  de: "@aGriselda@bAber er wird sich noch wesentlich mehr anstrengen müssen, wenn er ihr Herz gewinnen will.\n@c0@"
  en: "@aDebora@bBut he'll have to try at least a hundred times harder before he wins her heart.\n@c0@"
  es: "@aStefania@bMa tendrá que esforzarse moltissimo más para ganarse il suo cuore.\n@c0@"
  fr: "@aPandora@bMais il faudrait qu'il fasse cent fois plus d'efforts avant d'arriver à gagner son cœur.\n@c0@"
  it: "@aViola@bA furia di provarci, la prenderà per sfinimento.\n@c0@"
  ja: "@a@bデボラ「アンディは　すくなくとも　あと\n\t１００倍は　努力しないと　ムリね。\n@c0@"
183:
  de: "@aGriselda@bSein Eifer ist ja vielversprechend, das muss man ihm lassen.\n@c0@"
  en: "@aDebora@bHe's certainly got enthusiasm, I'll give him that much.\n@c0@"
  es: "@aStefania@bLe pone passione, lo admito. No como otros.\n@c0@"
  fr: "@aPandora@bIl ne manque pas d'enthousiasme, je dois lui reconnaître ça, au moins.\n@c0@"
  it: "@aViola@bCerto, non è l'entusiasmo che gli manca, devo dargliene atto.\n@c0@"
  ja: "@a@bデボラ「はりきったところで\n\tしょせんは　アンディだからねー。\n@c0@"
184:
  de: "@aGriselda@bWahrscheinlich bleibt uns nichts anderes übrig, als uns rauszuhalten und den Dingen ihren Lauf zu lassen.\n@c0@"
  en: "@aDebora@bI suppose we'll just have to sit back and let things take their course.\n@c0@"
  es: "@aStefania@bHabrá que limitarse a esperar que las cosas sigan il suo curso.\n@c0@"
  fr: "@aPandora@bJe crois qu'on n'a qu'à attendre et laisser\r\nles choses suivre leur cours.\n@c0@"
  it: "@aViola@bPeccato che quel poveretto difetti in personalità, forza, coraggio e altre qualità che rendono un uomo degno di tale nome...\n@c0@"
  ja: "@a@bデボラ「まあ　期待しないで\n\t見ててあげるわ。\n@c0@"
185:
  de: "@aGriselda@bEigentlich tun auch mir die Schultern ein bisschen weh. Kannst du sie mir nicht ein bisschen reiben, %a000090?\n@c0@"
  en: "@aDebora@bActually, my shoulders are aching a bit too.\nYou'll rub them for me, won't you, %a000090?\n@c0@"
  es: "@aStefania@bA mí también me duele un po' la espalda.\nUn masaje, %a000090. Y que no tenga que volver a pedírtelo.\n@c0@"
  fr: "@aPandora@bÀ dire vrai, j'ai un peu mal aux épaules, moi aussi. Tu vas les frotter pour moi, d'accord, %a000090ⓡ\n@c0@"
  it: "@aViola@bDa te mi aspetto sempre il massimo dell'impegno nell'eseguire tutti i miei ordini, caro %a000090.\nNon azzardarti nemmeno a pensare di sgarrare!\n@c0@"
  ja: "@a@bデボラ「そういえば　私も\n\t肩がこったわね。\n\tもんでくれる　%a000090？\n@c0@"
186:
  de: "@aGriselda@bSchon Zeit fürs Bett, was?\n@c0@"
  en: "@aDebora@bTime for bed already, is it?\n@c0@"
  es: "@aStefania@bYa es hora de dormir, ¿capisci?\n@c0@"
  fr: "@aPandora@bC'est déjà l'heure d'aller se coucherⓡ\n@c0@"
  it: "@aViola@bÈ già ora di andare a letto...\n@c0@"
  ja: "@a@bデボラ「なに？　今日はもう休むの？\n@c0@"
187:
  de: "@aGriselda@bWir könnten wohl in meinem Zimmer übernachten.\n@c0@"
  en: "@aDebora@bI suppose we could stay in my room then.\n@c0@"
  es: "@aStefania@bPodemos quedarnos en la mia stanza.\n@c0@"
  fr: "@aPandora@bJe pense qu'on pourrait aller dormir dans ma chambre, dans ce cas.\n@c0@"
  it: "@aViola@bQuasi quasi potremmo riposare in camera mia.\n@c0@"
  ja: "@a@bデボラ「まあ　私の部屋を\n\t使わせてあげてもいいけど。\n@c0@"
188:
  de: "@aGriselda@bWarum schläft Papa denn hier? Warum geht er nicht einfach zu Bett?\n@c0@"
  en: "@aDebora@bWhat's Papa doing asleep here?\r\nWhy doesn't he just go to bed?\n@c0@"
  es: "@aStefania@b¿Qué hace il mio papino aquí dormido?\r\n¿Por qué no se va a la cama?\n@c0@"
  fr: "@aPandora@bQu'est-ce que papa fait endormi iciⓡ\nPourquoi il ne va pas se coucherⓡ\n@c0@"
  it: "@aViola@bPerché il mio paparino sta dormendo qui?\nNon starebbe più comodo nel suo letto?\n@c0@"
  ja: "@a@bデボラ「パパも　こんなところで寝ないで\n\tベッドで寝ればいいのに。\n@c0@"
189:
  de: "@aGriselda@bWenn ich Mama so schlafen sehe, dann werde ich auch ganz schläfrig.\n@c0@"
  en: "@aDebora@bWatching Mama sleeping like that makes me feel all sleepy too.\n@c0@"
  es: "@aStefania@bVer a la mamma dormir así me da sueño.\n@c0@"
  fr: "@aPandora@bRegarder mamma dormir comme ça me donne\r\nmoi aussi envie d'aller me coucher.\n@c0@"
  it: "@aViola@bVedere mia madre che dorme così beatamente mi ha fatto venire sonno...\n@c0@"
  ja: "@a@bデボラ「ママの顔見てたら\n\t私も　眠くなってきたわ。\n@c0@"
190:
  de: "@aGriselda@bHe! Was bildest du dir ein, einfach so in Neras Zimmer zu gehen?!\n@c0@"
  en: "@aDebora@bHey! What do you think you're doing, coming into Nera's room like this!?\n@c0@"
  es: "@aStefania@b¡Eh, baco! ¿Qué te crees que haces, entrando así en la stanza de Nera?\n@c0@"
  fr: "@aPandora@bHéⓠ Mais qu'est-ce que tu faisⓡ Ça ne va pas d'entrer comme ça dans la chambre de Neraⓡⓐ\n@c0@"
  it: "@aViola@bNon voglio che mio marito entri nella stanza di una ragazza che dorme!\n@c0@"
  ja: "@a@bデボラ「ちょっと　%a000090！\n\tなに　フローラの部屋に\n\t入ってんのよ！\n@c0@"
191:
  de: "@aGriselda@bRaus, aber dalli!\n@c0@"
  en: "@aDebora@bGet out right now!\n@c0@"
  es: "@aStefania@b¡Sal! ¡Ahora! No voy a repetirlo, ¿capisci?\n@c0@"
  fr: "@aPandora@bSors d'ici immédiatementⓠ\n@c0@"
  it: "@aViola@bNemmeno se quella ragazza è mia sorella Nera!\n@c0@"
  ja: "@a@bデボラ「ほら　さっさと　出なさい！\n@c0@"
192:
  de: "@aGriselda@bIch wusste gar nicht, dass es hier einen Schrein gibt.\n@c0@"
  en: "@aDebora@bI never knew there was a shrine here.\n@c0@"
  es: "@aStefania@bVeramente, no sabía que había una capilla aquí.\n@c0@"
  fr: "@aPandora@bJe ne savais pas qu'il y avait un sanctuaire, ici.\n@c0@"
  it: "@aViola@bNon avevo idea che qui ci fosse un tempio...\n@c0@"
  ja: "@a@bデボラ「こんなところに\n\tほこらがあったなんて\n\t初めて知ったわ。\n@c0@"
193:
  de: "@aGriselda@bUnd anscheinend gibt's ihn auch schon seit einer ganzen Weile. Hier ist es ja ganz staubig!\n@c0@"
  en: "@aDebora@bIt looks like it's been here a while too.\nThe place is covered in dust.\n@c0@"
  es: "@aStefania@bY parece molto vecchia.\r\nTodo está lleno de polvo.\n@c0@"
  fr: "@aPandora@bOn dirait que ça fait un moment que cet endroit existe. Tout est couvert de poussière.\n@c0@"
  it: "@aViola@bLa costruzione non sembra recentissima, a giudicare dalla polvere che c'è in giro...\n@c0@"
  ja: "@a@bデボラ「それにしても　ずいぶんと\n\t古いわね。\n\t中も　ほこりっぽそうだし。\n@c0@"
194:
  de: "@aGriselda@bAußer diesem blauen Tiegel gibt es hier anscheinend nichts Interessantes.\n@c0@"
  en: "@aDebora@bApart from that blue jar, there doesn't seem to be anything else of interest here.\n@c0@"
  es: "@aStefania@bAparte del vasetto azul, no parece haber nada de interés. Así que no me hagas perder il tempo, ¿capisci?\n@c0@"
  fr: "@aPandora@bÀ part cette amphore bleue, il ne semble\r\nrien y avoir d'intéressant, ici.\n@c0@"
  it: "@aViola@bA parte quell'anfora bluastra, mi sembra che qui non ci sia altro di particolarmente interessante...\n@c0@"
  ja: "@a@bデボラ「青いツボがあっただけで\n\tほかに　変なところは　なさそうね。\n@c0@"
195:
  de: "@aGriselda@bTja, wir haben getan, wozu wir hergekommen sind. Gehen wir zurück zu Papa.\n@c0@"
  en: "@aDebora@bWell, we've done what he wanted.\nTime to get back to Papa.\n@c0@"
  es: "@aStefania@bYa está lo que él quería. Volvamos con il papino.\n@c0@"
  fr: "@aPandora@bBon, on a fait ce qu'il nous avait demandé.\r\nC'est le moment de retourner voir papa.\n@c0@"
  it: "@aViola@bBene, Abbiamo svolto il compito assegnatoci dal mio caro paparino.\nTorniamo a casa, forza.\n@c0@"
  ja: "@a@bデボラ「用も済んだし　さっさと\n\tパパのところへ　戻るわよ。\n@c0@"
