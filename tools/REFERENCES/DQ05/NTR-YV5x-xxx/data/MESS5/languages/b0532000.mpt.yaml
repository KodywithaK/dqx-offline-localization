60:
  de: "@a%0%a001250@bGlaubst du, dass er einen einfachen alten Stein wirklich in etwas Schönes verwandeln kann?\n@c0@"
  en: "@a%0%a001250@bDo you think he can really turn a plain old stone into something beautiful? Really!?\n@c0@"
  es: "@a%0%a001250@b¿Crees que puede realmente convertir una simple piedra en algo hermoso? ¿De verdad?\n@c0@"
  fr: "@a%0%a001250@bTu crois qu'il peut vraiment transformer un vieux caillou tout simple en quelque chose de magnifiqueⓡ Tu crois vraimentⓡⓐ\n@c0@"
  it: "@a%0%a001250@bCi vuole molta abilità per trasformare una pietra grezza in un meraviglioso gioiello...\nCredi che quel signore sia in grado di farlo?\n@c0@"
  ja: "@a@b%a001250「あの石ころが\n\t宝石になっちゃうの？　ホントに？？\n@c0@"
61:
  de: "@aOtto@bDann werden wir also bald die Arbeit eines berühmten Handwerkers bewundern können.\n㈡\nIch glaube kaum, dass ich diese Nacht ein Auge zumachen werde...\n@c0@"
  en: "@aTuppence@bSo we'll soon see the work of a famous\r\ncraftsman. I don't know that I'll be able to\r\nget a wink of sleep tonight.\n@c0@"
  es: "@aAlazar@bAsí que pronto veremos la obra de un artesano famoso. No sé si seré capaz de dormir algo esta noche.\n@c0@"
  fr: "@aInnocent@bNous allons bientôt pouvoir découvrir le travail d'un célèbre artisan. Je ne sais pas si j'arriverai à fermer l'œil, cette nuit.\n@c0@"
  it: "@aSimon@bNon vedo l'ora di scoprire cosa saprà realizzare quell'artigiano!\r\nAh, sono più curioso di una vecchia zitella!\n@c0@"
  ja: "@a@bピピン「名工の作品が　もうすぐ\n\t見られるなんて……\n\t今夜は　眠れそうにないぞ。\n@c0@"
