  fr: "@aInnocent@bAaahⓠ Alors voici le célèbre artisan de Gothaⓠ\nBien, bien, bienⓠ\n@c0@"
  it: "@aSimon@bMa tu guarda! Allora quel tipo è il famoso artigiano che era scomparso da Denim tanti anni fa?!\nMi sembra incredibile averlo ritrovato proprio qui!\n@c0@"
  ja: "@a@bピピン「おお！\n\tあの方が　グランバニアの\n\t偉大なる名工！　おお～！\n@c0@"
