63:
  de: "@aOtto@bBei der Göttin! Wer hätte das gedacht? Gestern war es noch ein alter Stein und jetzt... \nDass dabei so etwas Edles herauskommt!\n@c0@"
  en: "@aTuppence@bGoodness! That's incredible! Who'd have thought that an old bit of rock like that could be transformed into something so exquisite?\n@c0@"
  es: "@aAlazar@b¡Por la Diosa! ¡Es increíble! ¿Quién iba a pensar que un pedrusco así se podría transformar en algo tan exquisito?\n@c0@"
  fr: "@aInnocent@bPar la Déesseⓠ C'est incroyableⓠ Qui aurait cru qu'un vieux caillou comme ça pourrait se transformer en une pierre aussi magnifiqueⓡ\n@c0@"
  it: "@aSimon@bSanti numi, che spettacolo!\nChi avrebbe mai detto che da una vecchia pietra fosse possibile ricavare un gioiello così bello?!\n@c0@"
  ja: "@a@bピピン「おお～！　すばらしい！\n\tあの石ころが　こんなに美しい\n\t宝石に変わるとは！\n@c0@"
64:
  de: "@aSancho@bSi, si. Das ist wahre Kunst. Wenn iss solch eine gute Arbeit sehe, wird mir bewusst, dass es nur noch wenige gute Kunsthandwerker gibt, no?\n@c0@"
  en: "@aSancho@bSí, sí! Thees ees a true craftsman.\r\nWhen you esee the fine work like thees, you no feel like the artisans, they are dying, eh?\n@c0@"
  es: "@aSancho@b¡Sí, sí! Es un verdadero artesano.\r\nViendo obras tan padrísimas como esta ya no parece que la artesanía muriera, ¿eh?\n@c0@"
  fr: "@aSancho@bSi, siⓠ C'est oun véritable artiste. Quand on voit des r-r-réalisations comme celle-là, impossible de dire que l'artisanat est en t-t-train de mourir, noⓡ\n@c0@"
  it: "@aSancho@b¡Que maravilla!\n¡Esto hombre no es un semplice artigiano, es un artista genial!\n@c0@"
  ja: "@a@bサンチョ「さすが　名工！\n\t技術のおとろえを　感じさせない\n\tすばらしい仕事ぶりですね。\n@c0@"
65:
  de: "@a%0%a001250@bWie schön! Glaubst du, dass das die ganze Zeit in dem Stein versteckt war? Wie aufregend!\n@c0@"
  en: "@a%0%a001250@bIt's so pretty! Do you think this was hidden inside the stone all along? Wow!\n@c0@"
  es: "@a%0%a001250@b¡Es una preciosidad! ¿Crees que se ocultaba en el interior de la piedra? ¡Vaya!\n@c0@"
  fr: "@a%0%a001250@bC'est tellement joliⓠ Tu crois que le joyau était caché à l'intérieur de la pierre pendant tout ce tempsⓡ Waouhⓠ\n@c0@"
  it: "@a%0%a001250@bChe meraviglia!\nSfido chiunque a capire che questo capolavoro è stato ricavato da una comune pietra!\n@c0@"
  ja: "@a@b%a001250「すごく　きれいな宝石！\n\tこれが　あの石ころの中に\n\t入ってたの？　ふしぎ～！\n@c0@"
66:
  de: "@a%0%a001240@bDas Warten hat sich wirklich gelohnt, was, Papa? Der Stein ist wunderschön. Du solltest damit etwas verzieren.\n@c0@"
  en: "@a%0%a001240@bThat was worth doing, wasn't it, Dad? It's\nvery pretty. You should probably use it to\ndecorate something.\n@c0@"
  es: "@a%0%a001240@bEso mereció la pena, ¿verdad, papá? Es algo precioso. Te podría servir para decorar algo.\n@c0@"
  fr: "@a%0%a001240@bÇa valait la peine de le faire, hein, papaⓡ\nC'est très joli. Tu devrais t'en servir pour\ndécorer quelque chose.\n@c0@"
  it: "@a%0%a001240@bPapà, è bellissimo...\nPerché non lo usi come decorazione per qualche oggetto che ti è particolarmente caro?\n@c0@"
  ja: "@a@b%a001240「良かったね　お父さん。\n\tきれいな宝石だから　何かに\n\tつけて　かざるといいよね。\n@c0@"
67:
  de: "@aSancho@bSi, si... Señor Ludwig war sehr beliebt. Si, das war er... (Schluchz)\n@c0@"
  en: "@aSancho@bSí, sí... Señor Pankraz, he was loved by everyone.\nHe was, was... (sob)\n@c0@"
  es: "@aSancho@bSí, sí... Al señor Teudis toditos lo querían.\nEra, era... (snif)\n@c0@"
  fr: "@aSancho@bSi, si... Le señor Petros était aimé de tout le monde.\r\nIl était... (snif)\n@c0@"
  it: "@aSancho@bSì, es verdad... Todo el mundo amava el señor Russel...\nYo... Yo me commuovos...\n¡Sob!\n@c0@"
  ja: "@a@bサンチョ「そうですとも　パパスさまは\n\t誰からも　本当に愛されたお方でした。\n\tうっうっ……。\n@c0@"
68:
  de: "@aSancho@bDer Künstler aus Steile Höh...? Wenn die Göttin ihn zu siss geholt hat...\n@c0@"
  en: "@aSancho@bThe artist from Lofty Peak...?\r\nEef he was taken by the Goddess...\n@c0@"
  es: "@aSancho@b¿El artista de Cumbre Excelsa...?\nSi se lo ha llevado la Diosa...\n@c0@"
  fr: "@aSancho@bL'artiste de Haute-Cime...ⓡ\nS'il a r-r-rejoint la Déesse...\n@c0@"
  it: "@aSancho@bSi el famoso pittore de Picco Maximo ahora está en cielo, accantos alla dea...\n@c0@"
  ja: "@a@bサンチョ「それにしても　エルヘブンの\n\t画家が　亡くなっていたとは……。\n@c0@"
69:
  de: "@aSancho@bDann bedeutet das, dass das Medaillon von Señora Magda nisst mehr vollendet werden kann!\n@c0@"
  en: "@aSancho@bThees means ees no possible to complete the locket of señora Mada.\n@c0@"
  es: "@aSancho@bEso significa nomás que no será posible terminar el camafeo de la señora Perséfone.\n@c0@"
  fr: "@aSancho@b... ça veut dire qu'on ne pourra p-p-pas terminer le pendentif de la señora Magdalena.\n@c0@"
  it: "@aSancho@b¡Alloras no sarà più posible completare el madaglione della señora Mada!\n¡Ay, que peccatos!\n@c0@"
  ja: "@a@bサンチョ「これでは　もう　マーサさまの\n\t形見のロケットペンダントを\n\t完成させることは　不可能ですね……。\n@c0@"
70:
  de: "@a%0%a001240@bEs gab hier also jemanden, der Großvater treu ergeben war? Den hätte ich gerne kennengelernt.\n@c0@"
  en: "@a%0%a001240@bSo someone here pledged allegiance to Grandpa?\nI would've liked to have met him.\n@c0@"
  es: "@a%0%a001240@b¿Que alguien de aquí juró lealtad al abuelo?\nMe habría gustado conocerlo.\n@c0@"
  fr: "@a%0%a001240@bAlors quelqu'un d'ici avait juré allégeance\nà grand-pèreⓡ J'aurais bien aimé faire sa connaissance.\n@c0@"
  it: "@a%0%a001240@bQualcuno qui a Picco Maximo aveva stretto amicizia con nonno Russel? Dev'essere stata una gran brava persona! Proprio così!\n@c0@"
  ja: "@a@b%a001240「パパスおじいちゃんの\n\t味方してくれた人が　いたんだね。\n\tボク　その人に　会ってみたかったな。\n@c0@"
71:
  de: "@a%0%a001240@bDie Welt ist in drei Reiche aufgeteilt? Hast du das gewusst, Papa? Ich dachte immer, es gibt nur eine Welt...\n@c0@"
  en: "@a%0%a001240@bThe world's divided into three realms?\nDid you know that, Dad? I always thought\nthere was only one world!\n@c0@"
  es: "@a%0%a001240@b¿El mundo se divide en tres reinos?\n¿Tú sabías eso, papá? ¡Yo siempre creí\nque había un solo mundo!\n@c0@"
  fr: "@a%0%a001240@bLe monde est divisé en trois royaumesⓡ\nTu savais ça toi, papaⓡ J'ai toujours cru\nqu'il n'y avait qu'un seul mondeⓠ\n@c0@"
  it: "@a%0%a001240@bNon avevo idea che il mondo fosse diviso in tre regni!\nPapà, tu lo sapevi?\n@c0@"
  ja: "@a@b%a001240「世界が　３つあるの？\n\tねえねえ　お父さん知ってた！？\n\tだって　世界ってひとつでしょ？\n@c0@"
72:
  de: "@a%0%a001250@bWenn es doch nur eine Welt gäbe, in der Menschen und Monster friedlich zusammenleben könnten.\n@c0@"
  en: "@a%0%a001250@bIf only there was a world where humans and monsters could play together nicely.\n@c0@"
  es: "@a%0%a001250@bOjalá existiera un mundo en el que humanos y monstruos se llevaran bien.\n@c0@"
  fr: "@a%0%a001250@bSi seulement il y avait un monde où les humains et les monstres pouvaient jouer ensemble tranquillement.\n@c0@"
  it: "@a%0%a001250@bSarebbe bello se il mondo fosse un luogo pacifico dove gli esseri umani e i mostri potessero vivere insieme...\n@c0@"
  ja: "@a@b%a001250「わたしは　魔物さんたちと\n\tいっしょに　遊べる世界がいいな。\n@c0@"
73:
  de: "@aSancho@bSi, iss glaube diesen Weisen, sie waren sehr aufgebracht, Señora Magda zu verlieren, weil sie so große Kräfte hatte.\n@c0@"
  en: "@aSancho@bSí, I believe these elders, they would feel eso\r\nangry to lose señora Mada because eshe had\r\nesuch estrong powers.\n@c0@"
  es: "@aSancho@bSí, yo creo que los ancianos se enojaron por\r\nperder a la señora Perséfone, que tenía\r\nun poder tan grande.\n@c0@"
  fr: "@aSancho@bSi. Je comprends p-p-pourquoi ces Anciens étaient très mécontents d'avoir perdu la señora Magdalena, si elle avait autant de p-pouvoirs.\n@c0@"
  it: "@aSancho@bAhora entiendo por qué los abitantes de Picco Maximo se arrabbiarono cuando la señora Mada se ne andò: no volevano perdere los suos poteres...\n@c0@"
  ja: "@a@bサンチョ「大変な能力を　お持ちだった\n\tマーサさまを　連れ出されれば\n\tお怒りも　ごもっともでしょうが……。\n@c0@"
74:
  de: "@aSancho@bAber das ist nisst deine Schuld, Chico. Und auch nisst von deinem Padre, Señor Ludwig. Gegen die Liebe kann man nissts machen.\n@c0@"
  en: "@aSancho@bBut ees no the fault of you, friend. Or your\r\nfather, señor Pankraz. You no can tell love to go away when he comes.\n@c0@"
  es: "@aSancho@bPero no es culpa tuya, chamaco. Ni de tu padre, el señor Teudis. Es nomás que no se puede detener el amor cuando llega.\n@c0@"
  fr: "@aSancho@bMais ça n'est pas de ta faute, chico. Ni de celle du señor Petros. Quand l'amour vous t-t-tombe dessus, on ne peut pas lui dire de s'en aller.\n@c0@"
  it: "@aSancho@bMa no es colpa tua né de tuo padre, chico.\n¡El amor ha unito la señora Mada y el señor Russel, y nada es más fuerte dell'amor!\n@c0@"
  ja: "@a@bサンチョ「坊っちゃんにも\n\tパパスさまにも　罪はありません！\n\t恋愛っていうのは　自由なものですよ。\n@c0@"
75:
  de: "@aOtto@bIch werde Euch bis ans Ende der Welt begleiten, Eure Majestät! Äh, ich meine, bis ans Ende der drei Welten...\n@c0@"
  en: "@aTuppence@bI'm prepared to travel to the ends of all three worlds with you, Your Majesty!\n@c0@"
  es: "@aAlazar@b¡Estoy dispuesto a recorrer los confines de los tres mundos con vos, Majestad!\n@c0@"
  fr: "@aInnocent@bJe suis prêt à vous accompagner jusqu'au bout des trois mondes, Votre Majestéⓠ\n@c0@"
  it: "@aSimon@bMaestà, comandi! Sono pronto a eseguire qualsiasi suo ordine.\nLa seguirò in qualunque regno lei vorrà andare!\n㈡\nAnche se, le dirò, eviterei con piacere di recarmi a Nadiria...\n@c0@"
  ja: "@a@bピピン「%a000090さま！\n\tボク　３つの世界の果てまででも\n\tお供　いたしますからね。\n@c0@"
76:
  de: "@a%0%a001250@bAlso müssen wir in die Welt der Monster gehen, wenn wir Großmutter finden wollen, oder?\n@c0@"
  en: "@a%0%a001250@bSo if we go to the world of the monsters, does that mean we'll find Grandma?\n@c0@"
  es: "@a%0%a001250@bY si vamos al mundo de los monstruos, ¿encontraremos allí a la abuela?\n@c0@"
  fr: "@a%0%a001250@bAlors si on va au royaume des monstres,\non retrouvera grand-mèreⓡ\n@c0@"
  it: "@a%0%a001250@bSe andremo nel regno dei mostri troveremo la nonna?\n@c0@"
  ja: "@a@b%a001250「魔物さんの世界に行けば\n\tおばあちゃんに　会えるの？\n@c0@"
77:
  de: "@aSancho@bSi. Señor Ludwig wusste etwas darüber. Aber er hat es mir nisst erzählt.\n@c0@"
  en: "@aSancho@bSí. Señor Pankraz, he knew esometheeng about thees. But he no want for me to be eenvolved.\n@c0@"
  es: "@aSancho@bSí. El señor Teudis sabía algo de eso.\r\nNomás que no quería que yo me viera implicado.\n@c0@"
  fr: "@aSancho@bSi. Le señor Petros savait quelque chose à ce\r\np-p-propos. Mais il ne voulait pas que je m'en mêle.\n@c0@"
  it: "@aSancho@bSì, pienso que el señor Russel sospettasse que la señora Mada fosse nascosta a Nadiria...\n@c0@"
  ja: "@a@bサンチョ「パパスさまは　何かしら\n\tご存知のようでした。　でも\n\t巻き込みたくなかったのでしょう……。\n@c0@"
78:
  de: "@aSancho@bWeißt du, er hat mir nie etwas über diese Sache gesagt. I-Iss... (Schluchz)\n@c0@"
  en: "@aSancho@bYou know, he never tell me anytheeng about thees. I, I... (sob)\n@c0@"
  es: "@aSancho@bVerás, nunca me contó nadita de todo esto.\r\nYo, yo... (snif)\n@c0@"
  fr: "@aSancho@bTu sais, il ne m'a jamais r-r-rien dit là-dessus.\r\nJe, je... (snif)\n@c0@"
  it: "@aSancho@bPerò no me disse nullas por no coinvolgerme en una avventuras tanto pericolosas. ¡Que hombre generoso! Yo... Yo me commuovos... ¡Sob!\n@c0@"
  ja: "@a@bサンチョ「私たちには　くわしく\n\t話してくださいませんでした。\n\tうっうっ……。\n@c0@"
79:
  de: "@aOtto@bSie mögen sich vielleicht die Weisen nennen, trotzdem sind alle ziemlich jung und gut aussehend. Das ist seltsam...\n@c0@"
  en: "@aTuppence@bThey may call themselves ⓗEldersⓘ, but they're actually quite young and splendid-looking.\nHow odd!\n@c0@"
  es: "@aAlazar@bPuede que se llamen ⓕancianosⓖ, pero lo cierto es que son bastante jóvenes y bien parecidos. ¡Qué raro!\n@c0@"
  fr: "@aInnocent@bIls s'appellent peut-être ⓥAnciensⓦ, mais ils sont plutôt jeunes et ont une allure splendide.\nC'est très bizarreⓠ\n@c0@"
  it: "@aSimon@bPerché mai si faranno chiamare ⓕAnzianiⓖ se hanno un aspetto tanto giovanile? Forse amano sentirsi dire che si portano bene i loro anni?\n@c0@"
  ja: "@a@bピピン「それにしても　長老というわりには\n\tみなさん　若くて　お美しい……。\n\tふしぎだ！\n@c0@"
80:
  de: "@a%0%a001240@bAlso verlieren sie ihre Macht? Und nur Großmutter hat sie noch?\n@c0@"
  en: "@a%0%a001240@bSo they're losing their powers? And it's just Grandma who still has them?\n@c0@"
  es: "@a%0%a001240@b¿Están perdiendo sus poderes?\n¿Y solo la abuela los conserva?\n@c0@"
  fr: "@a%0%a001240@bAlors ils perdent leurs pouvoirsⓡ Et il n'y a plus que grand-mère qui en a encoreⓡ\n@c0@"
  it: "@a%0%a001240@bQuindi gli abitanti di Picco Maximo hanno perso i loro poteri, mentre nonna Mada li ha ancora...\n@c0@"
  ja: "@a@b%a001240「そういう能力って\n\tなくなっていくものなの？\n\tおばあちゃんだけ　なくならなかったの？\n@c0@"
81:
  de: "@a%0%a001250@bHeißt das, dass Großmutter von den Bösen gezwungen wurde, das Tor zu öffnen? Wie schrecklich!\n@c0@"
  en: "@a%0%a001250@bDoes that mean Grandma's being forced by the bad people to open the gates? Poor Grandma!\n@c0@"
  es: "@a%0%a001250@b¿Quiere eso decir que los malos están obligando a la abuela a abrir las puertas? ¡Pobre abuela!\n@c0@"
  fr: "@a%0%a001250@bEst-ce que ça veut dire que des méchants ont obligé grand-mère à ouvrir les portesⓡ\nPauvre grand-mèreⓠ\n@c0@"
  it: "@a%0%a001250@bAllora qualche creatura malvagia vuole costringere la nonna ad aprire il varco tra il nostro mondo e il Regno degli Inferi?! Oh, povera la mia nonnina!\n@c0@"
  ja: "@a@b%a001250「じゃあ　おばあちゃん\n\t悪い人に　ムリヤリ　門を\n\t開けさせられてるの？　かわいそう。\n@c0@"
82:
  de: "@aOtto@bVerstehe. Diese Tore zu bewachen, ist wohl eine große Verantwortung. Net zu vergleichen mit normalem Patrouillieren...\n@c0@"
  en: "@aTuppence@bI see. Guarding those gates must be quite\r\na responsibility. Rather different from your\r\nrun-of-the-mill soldiering.\n@c0@"
  es: "@aAlazar@bEntiendo. Vigilar esas puertas debe ser una responsabilidad importante. Bastante diferente\r\ndel servicio habitual.\n@c0@"
  fr: "@aInnocent@bJe vois. Avoir la garde de ces portes doit être une lourde responsabilité. On est loin de la fonction de soldat lambda.\n@c0@"
  it: "@aSimon@bUhm... Sorvegliare il varco per il Regno degli Inferi dev'essere un compito ben più difficile che montare di guardia al Castello di Denim...\n@c0@"
  ja: "@a@bピピン「うんうん。　門を守る衛兵は\n\t重要な仕事なんですよね。\n\t見まわりとは　格が違うんです。\n@c0@"
83:
  de: "@aOtto@bÄh... hm... gute Güte! Da sind wir aber in eine komplizierte Angelegenheit geraten!\n@c0@"
  en: "@aTuppence@bEr...um...dearie me! What a complicated situation we seem to have found ourselves in.\n@c0@"
  es: "@aAlazar@bMmm... um... ¡Ay, madre! En qué situación tan complicada parece que nos hemos metido.\n@c0@"
  fr: "@aInnocent@bEuh... hum... eh bienⓠ Nous nous retrouvons dans une situation bien compliquée, on dirait.\n@c0@"
  it: "@aSimon@bAccidenti, che storia!\r\nMi sa che siamo in un guaio ben più grosso di quanto potessimo sospettare, eh?\n@c0@"
  ja: "@a@bピピン「えーと　えーと……\n\t話が　大きくなりすぎて\n\tボク　わからなくなってきました。\n@c0@"
84:
  de: "@a%0%a001240@bWenn der Großmeister der Unterwelt hierherkommt, wird er anfangen, die Welt zu zerstören. Das müssen wir unbedingt verhindern!\n@c0@"
  en: "@a%0%a001240@bIf the Grandmaster of the Underworld comes here, he'll start destroying the place. We have to go and stop him before he gets here!\n@c0@"
  es: "@a%0%a001240@bSi viene aquí el Gran Maestro del Inframundo, empezará por destruir el lugar. ¡Tenemos que ir a detenerlo antes de que llegue!\n@c0@"
  fr: "@a%0%a001240@bSi le Grand Maître des Enfers vient ici,\nil va commencer à tout détruire. Il faut\nqu'on l'arrête avantⓠ\n@c0@"
  it: "@a%0%a001240@bSe il Gran Maestro di Nadiria arriverà qui, ci distruggerà tutti! Dobbiamo fermarlo prima che riesca a mettere piede nel nostro mondo!\n@c0@"
  ja: "@a@b%a001240「魔界の王が来たら　この世界は\n\tメチャメチャに　なっちゃうよ。\n\tこっちに来る前に　やっつけないと！\n@c0@"
85:
  de: "@aSancho@bDas hört siss gar nisst gut an, no? Am Ende müssen wir bestimmt gegen diese Großmeister der Unterwelt kämpfen, si?\n@c0@"
  en: "@aSancho@bEes no esounding good, eh? Maybe een the end, ees thees Grandmaster of the Underworld we must fight, sí?\n@c0@"
  es: "@aSancho@bEso no suena bien, ¿eh? Puede que al final sea\r\nese Gran Maestro del Inframundo al que\r\ndebamos combatir, ¿no?\n@c0@"
  fr: "@aSancho@bÇa se p-p-présente plutôt mal, noⓡ Peut-être qu'à la fin, c'est ce G-G-Grand Maître des Enfers que nous devrons combattre, siⓡ\n@c0@"
  it: "@aSancho@b¿La situación no es buena, eh?\nNo me gusta esto Gran Maestro de los Inferos...\n¡Dev'essere un hombre muy malo!\n@c0@"
  ja: "@a@bサンチョ「なんだか　大変な話に\n\tなってきましたね。　最後は\n\t魔界の王と対決ってことになるんじゃ？\n@c0@"
86:
  de: "@a%0%a001250@bDas war also Großmutters Zimmer. Es ist schön und groß, aber irgendwie auch ein wenig einsam.\n@c0@"
  en: "@a%0%a001250@bSo this was Grandma's room. It's nice and big, but it's got a bit of a lonely feel to it.\n@c0@"
  es: "@a%0%a001250@bAsí que este era el cuarto de la abuela. Es grande y bonito, pero da una sensación un poco solitaria.\n@c0@"
  fr: "@a%0%a001250@bAlors c'était la chambre de grand-mèreⓡ\nElle est grande et très jolie, mais elle\ndégage une impression de solitude.\n@c0@"
  it: "@a%0%a001250@bQuesta era la stanza di nonna Mada? Che grande che è! Però dà l'impressione di essere un posto isolato dal resto del mondo...\n@c0@"
  ja: "@a@b%a001250「ここが\n\tマーサおばあちゃんのお部屋。\n\t広いけど　なんだかさみしい所ね……。\n@c0@"
87:
  de: "@aSancho@bEine Psalmenbuch? Eine Buch, das deine Madre, Señora Magda, gelesen hat, si? Du musst es behalten, Chico, als Erinnerung.\n@c0@"
  en: "@aSancho@bEes a book of psalms? A book your madre, señora Mada, eshe used to read, sí? You must\r\nkeep thees memento esafe, friend.\n@c0@"
  es: "@aSancho@b¿Es un libro de salmos? Un libro que solía leer tu amá, la señora Perséfone, ¿no? Debes guardar ese recuerdo a buen recaudo, chamaco.\n@c0@"
  fr: "@aSancho@bC'est oun recueil de p-p-psaumesⓡ Oun livre que ta madre, la señora Magdalena, lisait souvent, siⓡ\nTu dois le garder bien à l'abri, chico.\n@c0@"
  it: "@aSancho@bEs un libro de preghieras, chico. Tua madre deve averlo letto espessos, cuando estava aquí.\nPienso que dovresti tenerlo tu...\n@c0@"
  ja: "@a@bサンチョ「この詩篇集…　マーサさまも\n\tお読みになられたはずです。\n\t坊っちゃん　大事にしましょうね。\n@c0@"
88:
  de: "@a%0%a001240@bIst dir aufgefallen, dass dieses Zimmer an der höchsten Stelle des Dorfes liegt?\n@c0@"
  en: "@a%0%a001240@bDid you notice that this room's the highest room in\nthe village?\n@c0@"
  es: "@a%0%a001240@b¿Te has dado cuenta de que este cuarto es la habitación más alta del pueblo?\n@c0@"
  fr: "@a%0%a001240@bTu as remarqué que cette pièce était la plus haute de tout le villageⓡ\n@c0@"
  it: "@a%0%a001240@bHai notato che questa stanza è la più alta del villaggio?\n@c0@"
  ja: "@a@b%a001240「ねえ　気づいた？\n\tこのお部屋って　この村で\n\tいちばん　高い場所にあるよ。\n@c0@"
89:
  de: "@a%0%a001240@bEin bisschen wie im Märchen, wo die Prinzessin immer im höchsten Turmzimmer eingesperrt ist!\n@c0@"
  en: "@a%0%a001240@bIt's a bit like in faerie stories where they have the princess locked up in the highest room of a tower!\n@c0@"
  es: "@a%0%a001240@b¡Se parece a los cuentos de hadas en los que encierran a la princesa en la estancia más alta de la torre!\n@c0@"
  fr: "@a%0%a001240@bC'est un peu comme dans les contes de fées, où la princesse est toujours enfermée au sommet d'une haute tourⓠ\n@c0@"
  it: "@a%0%a001240@bMi ricorda una di quelle fiabe in cui la bella principessa è tenuta prigioniera in una torre altissima...\n@c0@"
  ja: "@a@b%a001240「塔の上に　とらわれた\n\tお姫さまのお部屋　っていう感じだね。\n@c0@"
90:
  de: "@aOtto@bEin Psalmenbuch? Es wird uns bestimmt noch von Nutzen sein. Ich hoffe sehr, dass die Göttin über uns wacht...\n@c0@"
  en: "@aTuppence@bA book of psalms? I'm sure it will be of use to us in times of need. If only those up on high would be there for us...\n@c0@"
  es: "@aAlazar@b¿Un libro de salmos? Seguro que nos resulta útil en tiempo de necesidad. Ojalá los de arriba quieran escucharnos...\n@c0@"
  fr: "@aInnocent@bUn livre de psaumesⓡ Je suis sûr qu'il nous sera utile en cas de besoin. Si seulement ceux d'en haut pouvaient être là pour nous, à ce moment-là...\n@c0@"
  it: "@aSimon@bUn libro di preghiere? Credo che ci sarà utile!\nSpero solo che la dea non sia troppo occupata, quando le chiederemo di aiutarci!\n@c0@"
  ja: "@a@bピピン「神の言葉ですか。　困ったときに\n\t必ず　助けてくれるなら信じるんですが\n\tそういう神って　なかなか　いなくて。\n@c0@"
91:
  de: "@a%0%a001250@bDas war also Großmutters Zimmer. Es ist schön und groß, aber irgendwie auch ein wenig einsam.\n@c0@"
  en: "@a%0%a001250@bSo this was Grandma's room. It's nice and big, but it's got a bit of a lonely feel to it.\n@c0@"
  es: "@a%0%a001250@bAsí que este era el cuarto de la abuela. Es grande y bonito, pero da una sensación un poco solitaria.\n@c0@"
  fr: "@a%0%a001250@bAlors c'était la chambre de grand-mèreⓡ\nElle est grande et très jolie, mais elle\ndégage une impression de solitude.\n@c0@"
  it: "@a%0%a001250@bQuesta era la stanza di nonna Mada? Che grande che è! Però dà l'impressione di essere un posto isolato dal resto del mondo...\n@c0@"
  ja: "@a@b%a001250「ここが\n\tマーサおばあちゃんのお部屋。\n\t広いけど　なんだかさみしい所ね……。\n@c0@"
92:
  de: "@aSancho@bSi. Señora Magda hatte eine große Herz. Groß, stark und wunderschön.\n@c0@"
  en: "@aSancho@bSí. Señora Mada, eshe has the beeg heart.\r\nBeeg, estrong and beautiful.\n@c0@"
  es: "@aSancho@bSí. La señora Perséfone tenía un gran corazón.\nGrande, fuerte y bello.\n@c0@"
  fr: "@aSancho@bSi. La señora Magdalena avait oun c-cœur immense. Immense, courageux et b-beau.\n@c0@"
  it: "@aSancho@bLa señora Mada era una mujer... ¡No! ¿Que dico?\r\n¡La señora Mada ES una mujer con el corazon puro, nobile y fuerte! ¡Mada es viva, soy seguro!\n@c0@"
  ja: "@a@bサンチョ「そうです。\n\tマーサさまは　強く　美しい心を\n\tお持ちの方でした……。\n@c0@"
93:
  de: "@a%0%a001240@bWas meint sie mit Licht im Herzen? Ich verstehe das nicht...\n@c0@"
  en: "@a%0%a001240@bWhat does she mean by light in your heart?\nIs that the same as just being light-hearted?\n@c0@"
  es: "@a%0%a001240@b¿Qué ha querido decir con lo de luz en el corazón?\n¿Es lo mismo que tener el corazón alegre?\n@c0@"
  fr: "@a%0%a001240@bQu'est-ce qu'elle veut dire en parlant de lumière qui brille dans nos cœursⓡ Ça veut dire qu'on peut s'en servir pour voir la nuitⓡ\n@c0@"
  it: "@a%0%a001240@bⓕColui che ha la luce nel cuore non verrà mai vinto dall'oscuritàⓖ...\nChe bella frase... Ma cosa vorrà dire...?\n@c0@"
  ja: "@a@b%a001240「心に光を　ってどういうこと？\n\t明るい気持ちでいれば　いいって\n\tいうことかな？\n@c0@"
94:
  de: "@a%0%a001240@bEs ist ein bisschen unheimlich im Dunkeln, wenn alles ruhig ist. Können wir nicht endlich in die Herberge gehen, Papa?\n@c0@"
  en: "@a%0%a001240@bIt's a bit scary in the dark when it's all quiet. Can we please go and stay at the inn now, Dad?\n@c0@"
  es: "@a%0%a001240@bLa oscuridad da un poco de miedo cuando\nse hace el silencio. ¿Podemos ir ya a quedarnos\nen la posada, papá?\n@c0@"
  fr: "@a%0%a001240@bC'est un peu effrayant, la nuit, quand il n'y a plus aucun bruit. Est-ce qu'on peut aller s'installer à l'auberge maintenant, papaⓡ\n@c0@"
  it: "@a%0%a001240@bPapà, con il buio non mi sento molto tranquilla...\nPossiamo tornare alla locanda, per favore?\n@c0@"
  ja: "@a@b%a001240「暗くて　静かで\n\tなんだか　こわいね　お父さん。\n\t早く　宿屋に泊まろうよ。\n@c0@"
95:
  de: "@a%0%a001240@bEs ist immer so still hier in Großmutters Dorf. Das macht mich ganz schläfrig...\n@c0@"
  en: "@a%0%a001240@bIt's always so quiet here in Grandma's village.\nIt makes me feel a bit sleepy.\n@c0@"
  es: "@a%0%a001240@bSiempre hay mucho silencio aquí, en el pueblo de la abuela. Eso me da un poco de sueño.\n@c0@"
  fr: "@a%0%a001240@bTout est toujours si silencieux ici, dans le village de grand-mère. Ça m'endort un peu.\n@c0@"
  it: "@a%0%a001240@bYaaawn...\nAh, che sooonnooo...\n@c0@"
  ja: "@a@b%a001240「おばあちゃんの村って\n\tいつ来ても　静かだよね……。\n\tよけい　眠くなっちゃうよ。\n@c0@"
96:
  de: "@a%0%a001250@bIch bin ja sooo müde...\n@c0@"
  en: "@a%0%a001250@bI'm so sleeeepy...\n@c0@"
  es: "@a%0%a001250@bQué sueño tengo...\n@c0@"
  fr: "@a%0%a001250@bJ'ai teeeellement sommeil...\n@c0@"
  it: "@a%0%a001250@bIl villaggio di nonna è così calmo, sereno...\nMi fa venire voglia di dormire...\n@c0@"
  ja: "@a@b%a001250「わたし　すごく　眠いです。\n\tふぁ～……。\n@c0@"
97:
  de: "@aSancho@bEs ist schon spät, no? Gehen wir noch nisst Siesta machen? Früh ins Bett, früh aufstehen. So ist es am besten, weißt du.\n@c0@"
  en: "@aSancho@bEes late, sí? We no go for the siesta yet?\r\nEarly to bed, early to rise. Thees ees the best way, you know.\n@c0@"
  es: "@aSancho@bEs tarde, ¿no? ¿Todavía no dormimos la siesta?\r\nQuien pronto se acuesta, temprano madruga.\r\nEso es lo mejor.\n@c0@"
  fr: "@aSancho@bIl est tard, noⓡ On ne va pas faire oune petite siestaⓡ L'avenir appartient à ceux qui se lèvent tôt et donc à ceux qui se c-c-couchent tôt, tu sais.\n@c0@"
  it: "@aSancho@bEs tarde...\n¿Por qué no facciamo una bella siesta, eh?\n@c0@"
  ja: "@a@bサンチョ「さあさあ　夜も更けました。\n\t今日は休みましょう！\n\t早寝早起きが　いちばんですよ。\n@c0@"
98:
  de: "@aOtto@bAaah, ich bin ziemlich müde heute. Äh, nein, natürlich net! Ich bin putzmunter!\n@c0@"
  en: "@aTuppence@bAah, I'm rather tired today.\nEr, no, no! I'm fine! Fit as a fiddle!\n@c0@"
  es: "@aAlazar@bAaah, hoy estoy bastante cansado.\nDigooo... ¡No! ¡Estoy bien! ¡Estoy en plena forma!\n@c0@"
  fr: "@aInnocent@bAah, je suis un peu fatigué, aujourd'hui.\nEuh, hum... non, nonⓠ Je vais bienⓠ En pleine formeⓠ\n@c0@"
  it: "@aSimon@bAh, che stanchezz... \nNo! Un vero soldato è sempre fresco, riposato e pronto all'azione! Comandi, Maestà!\n@c0@"
  ja: "@a@bピピン「ふーっ　今日も　つかれたなあ。\n\tあっ！　いえ　平気ですよ！\n\tまだまだ　いけますっ！\n@c0@"
99:
  de: "@a%0%a001240@bIch frage mich, wie das Essen hier ist. Ich hab so einen Hunger!\n@c0@"
  en: "@a%0%a001240@bI wonder what the food's like here.\nI'm absolutely starving!\n@c0@"
  es: "@a%0%a001240@b¿Cómo será aquí la comida?\n¡Me muero de hambre!\n@c0@"
  fr: "@a%0%a001240@bJe me demande si la nourriture est bonne, ici.\nJe meurs de faimⓠ\n@c0@"
  it: "@a%0%a001240@bChissà come si mangia qui...\nHo una fame da lupo!\n@c0@"
  ja: "@a@b%a001240「ここの宿屋のごはん\n\tおいしいかな？\n\tボク　おなかペッコペコ！\n@c0@"
100:
  de: "@a%0%a001250@bDie Vergessenen? Wie schrecklich, wenn man vergessen wird! Du wirst mich doch nie vergessen, oder, Papa?\n@c0@"
  en: "@a%0%a001250@bThe forgotten ones? It'd be horrible to be forgotten. You won't forget me, will you, Dad?\n@c0@"
  es: "@a%0%a001250@b¿Los olvidados? Debe de ser horrible que te olviden. No me olvidarás nunca, ¿verdad, papi?\n@c0@"
  fr: "@a%0%a001250@bLes oubliésⓡ Ça serait horrible d'être complètement oubliée. Tu ne m'oublieras pas toi, hein, papaⓡ\n@c0@"
  it: "@a%0%a001250@bDev'essere orribile quando qualcuno si dimentica di te! Papà, giurami che non ti scorderai mai di me, di %a001240 e della mamma!\n@c0@"
  ja: "@a@b%a001250「忘れられるなんて　こわい。\n\tお父さん　わたしのこと\n\t絶対　忘れないでね……。\n@c0@"
101:
  de: "@aSancho@bSi, si. Die Weisen sind schon alt und gehen immer früh ins Bett. Wir kommen morgen wieder, no?\n@c0@"
