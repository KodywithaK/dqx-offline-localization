59:
  de: "@a%0%a001240@bJa! Ich kann es kaum bis morgen abwarten!\n@c0@"
  en: "@a%0%a001240@bYay! I can't wait until tomorrow!\n@c0@"
  es: "@a%0%a001240@b¡Bien! ¡No puedo esperar a mañana!\n@c0@"
  fr: "@a%0%a001240@bYoupiⓠ J'ai hâte d'être à demainⓠ\n@c0@"
  it: "@a%0%a001240@bEvviva!\nNon vedo l'ora che arrivi domani!\n@c0@"
