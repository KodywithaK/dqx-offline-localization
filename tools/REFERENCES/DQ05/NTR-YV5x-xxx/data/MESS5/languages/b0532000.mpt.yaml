0:
  de: "@a%0%a001240@bIst das ein Berg? Oder ein Dorf? Wie auch immer, es ist sehr eindrucksvoll!\n@c0@"
  en: "@a%0%a001240@bIs this a mountain? Or is it a village?\nWhatever it is, it's pretty amazing!\n@c0@"
  es: "@a%0%a001240@b¿Esto es una montaña? ¿O es un pueblo?\n¡Sea lo que sea, es increíble!\n@c0@"
  fr: "@a%0%a001240@bC'est une montagne ou c'est un villageⓡ\nQuoi qu'il en soit, c'est assez incroyableⓠ\n@c0@"
  it: "@a%0%a001240@bMa questo è un villaggio o una montagna?\nA ogni modo, è troppo forte!\n@c0@"
  ja: "@a@b%a001240「ここって　山なの？　村なの？\n\tなんだか　すごいところだね！\n@c0@"
1:
  de: "@a%0%a001250@bDieser Ort ist mir irgendwie sehr vertraut. Mir gefällt es hier.\n@c0@"
  en: "@a%0%a001250@bThis place feels all familiar for some reason.\nI like it here.\n@c0@"
  es: "@a%0%a001250@bEste sitio me suena de algo y no sé de qué.\nMe gusta.\n@c0@"
  fr: "@a%0%a001250@bJe ne sais pas pourquoi, mais j'ai l'impression de\ndéjà connaître cet endroit. Ça me plaît.\n@c0@"
  it: "@a%0%a001250@bNon so spiegarmene il motivo, ma questo luogo mi è familiare...\n@c0@"
  ja: "@a@b%a001250「この村　なんだか\n\tなつかしい感じ。\n\tわたし　すきだな……。\n@c0@"
2:
  de: "@aSancho@bDiese Ort ist die Geburtsstätte von Señora Magda. Man meint, es liegt Magie in der Luft, no?\n@c0@"
  en: "@aSancho@bThees place ees the birthplace of señora Mada. Ees esometheeng like magic een the air, no?\n@c0@"
  es: "@aSancho@bEste lugar es donde nació la señora Perséfone.\r\nHay como magia flotando en el aire, ¿verdad?\n@c0@"
  fr: "@aSancho@bC'est ici qu'est née la señora Magdalena.\nIl y a c-c-comme de la magie dans l'air, noⓡ\n@c0@"
  it: "@aSancho@bAquí es nata la señora Mada.\r\nEn esto villaggios se respira una atmosfera magica...\n@c0@"
  ja: "@a@bサンチョ「ここが　マーサさまの故郷…\n\tなにやら　神秘的というか\n\tふしぎな感じの村ですね。\n@c0@"
3:
  de: "@aOtto@bAn einem Ort wie diesem kann man sich schnell verlaufen, wenn man net achtgibt. Hm, mal sehen. Von wo sind wir eigentlich gekommen?\n@c0@"
  en: "@aTuppence@bIt's easy to get lost in a place like this if you\r\ndon't pay attention. Now, let's see. Which way\r\ndid we come from?\n@c0@"
  es: "@aAlazar@bEs fácil perderse en un lugar así si no pones atención. Veamos. ¿Por dónde hemos venido?\n@c0@"
  fr: "@aInnocent@bC'est facile de se perdre dans un endroit pareil,\nsi l'on n'y prend pas garde. Bon, voyons...\nPar où sommes-nous arrivésⓡ\n@c0@"
  it: "@aSimon@bÈ facile perdersi in un posto del genere, se non si fa attenzione. Uhm, vediamo un po'...\nDa che parte siamo arrivati?\n@c0@"
  ja: "@a@bピピン「ぼんやり歩いてたら\n\t迷っちゃいそうです。\n\tえーと　どっちから来ましたっけ？\n@c0@"
4:
  de: "@a%0%a001250@bDie Vergessenen? Wie schrecklich, wenn man vergessen wird! Du wirst mich doch nie vergessen, oder, Papa?\n@c0@"
  en: "@a%0%a001250@bThe forgotten ones? It'd be horrible to be forgotten. You won't forget me, will you, Dad?\n@c0@"
  es: "@a%0%a001250@b¿Los olvidados? Debe de ser horrible que te olviden. No me olvidarás nunca, ¿verdad, papi?\n@c0@"
  fr: "@a%0%a001250@bLes oubliésⓡ Ça serait horrible d'être complètement oubliée. Tu ne m'oublieras pas toi, hein, papaⓡ\n@c0@"
  it: "@a%0%a001250@bDev'essere orribile quando qualcuno si dimentica di te! Papà, giurami che non ti scorderai mai di me, di %a001240 e della mamma!\n@c0@"
  ja: "@a@b%a001250「忘れられるなんて　こわい。\n\tお父さん　わたしのこと\n\t絶対　忘れないでね……。\n@c0@"
5:
  de: "@aSancho@bQué? Die Vergessenen? Was ist mit Señora Magda?\n@c0@"
  en: "@aSancho@bQué? The forgotten ones?\nWhat has happened to señora Mada?\n@c0@"
  es: "@aSancho@b¿Qué? ¿Los olvidados?\r\n¿Qué sucedió con la señora Perséfone?\n@c0@"
  fr: "@aSancho@bQuéⓡ Les oubliésⓡ\nQu'est-il arrivé à la señora Magdalenaⓡ\n@c0@"
  it: "@aSancho@b¿Que cosa? ¿Los dimenticatos dal mundo?\n¡Ay, esto es un menzognon muy grande!\n¡Yo me recorderò siempre della señora Mada!\n@c0@"
  ja: "@a@bサンチョ「忘れられた民族？\n\tマーサさまは　いったい……。\n@c0@"
6:
  de: "@a%0%a001240@bIch vergesse nie Orte, an denen ich schon mal war. Ich frage mich, wer die Leute hier denn vergessen hat?\n@c0@"
  en: "@a%0%a001240@bI never forget places I've been, even if I've only been once. I wonder who the people here have\nbeen forgotten by.\n@c0@"
  es: "@a%0%a001240@bYo nunca olvido los lugares en los que he estado, aunque solo haya sido una vez. ¿Quién habrá olvidado a esta gente?\n@c0@"
  fr: "@a%0%a001240@bJe n'oublie jamais un endroit, même si je n'y ai été qu'une seule fois. Je me demande par qui ces gens ont été oubliés...\n@c0@"
  it: "@a%0%a001240@bIo mi ricordo sempre dei posti dove sono andato e delle persone che ho incontrato. Come ha fatto il mondo a dimenticarsi di questa gente?\n@c0@"
  ja: "@a@b%a001240「一度行った場所のことは\n\tボク　忘れないよ！\n\tこの村は　だれに忘れられてるの？\n@c0@"
7:
  de: "@aSancho@bDeine Onkel Sancho ist nisst mehr der Jüngste... Aber trotzdem habe iss in meine ganze Leben keinen Ort wie diesen gesehen.\n@c0@"
  en: "@aSancho@bYour Uncle Sancho ees no eso young, you know? But estill, een all of my life, I never esee a village een a place like thees unteel now.\n@c0@"
  es: "@aSancho@bTu tito Sancho ya no es tan joven.\r\nPero, pues ni sabía de este lugar.\n@c0@"
  fr: "@aSancho@bTonton Sancho n'est p-plus tout jeune, tu sais.\r\nMais de toute ma vida, je n'avais j-j-jamais vu\r\ncet endroit avant aujourd'hui.\n@c0@"
  it: "@aSancho@bLo zio Sancho ha girato el mundo en lungos y en largos, ma no era mai estato aquí en esto posto...\n@c0@"
  ja: "@a@bサンチョ「このような場所に\n\t村があるとは　私も\n\tこの年になるまで　知りませんでした。\n@c0@"
8:
  de: "@a%0%a001240@bHört sich an, als wären wir seit langem die ersten Besucher.\n@c0@"
  en: "@a%0%a001240@bSounds like we're the first visitors they've had here in a while.\n@c0@"
  es: "@a%0%a001240@bSe diría que somos los primeros visitantes que tienen en mucho tiempo.\n@c0@"
  fr: "@a%0%a001240@bApparemment, on est les premiers visiteurs qu'ils voient depuis un moment.\n@c0@"
  it: "@a%0%a001240@bPare che il turismo non sia tra le attività economiche principali del posto...\nEh eh eh!\n@c0@"
  ja: "@a@b%a001240「ボクたちが　ひさしぶりの\n\tお客さんなんだね。\n@c0@"
9:
  de: "@a%0%a001240@bHm, in all den Jahren hab ich nie ein Geburtstagsgeschenk von dir bekommen, nicht?\n@c0@"
  en: "@a%0%a001240@bUm, I didn't get a birthday present or anything from you in all those years, right?\n@c0@"
  es: "@a%0%a001240@bEjem, en todos esos años, nunca me has hecho un regalo ni nada, ¿verdad?\n@c0@"
  fr: "@a%0%a001240@bHum, je n'ai pas reçu de cadeau d'anniversaire\nni rien pendant toutes ces années, hein, papaⓡ\n@c0@"
  it: "@a%0%a001240@bPapà, lo sai che non mi hai mai fatto un regalo di compleanno in tutto il periodo che ⓕfacevi la statuaⓖ?\n@c0@"
  ja: "@a@b%a001240「ねえ　ボク　今までずーっと\n\t誕生日のプレゼントとか\n\tもらってないよね？\n@c0@"
10:
  de: "@a%0%a001240@bWie wäre es denn... Wenn du mir zum Beispiel diesen fliegenden Teppich schenken würdest!\n@c0@"
  en: "@a%0%a001240@bSo I was thinking... It'd be great if you could get me that flying carpet!\n@c0@"
  es: "@a%0%a001240@bEstaba pensando que... ¡Sería genial que me consiguieras esa alfombra mágica!\n@c0@"
  fr: "@a%0%a001240@bAlors je me disais... ça serait super si tu pouvais m'offrir ce tapis volantⓠ\n@c0@"
  it: "@a%0%a001240@bPosso chiederti un regalo adesso?\nVorrei tanto avere un bel tappeto volante!\n@c0@"
  ja: "@a@b%a001240「まほうのじゅうたんとか\n\tもらえたら　すっごーく\n\tうれしいんだけどなあ……？\n@c0@"
11:
  de: "@a%0%a001250@bIch dachte, fliegende Teppiche gäbe es nur im Märchen!\n@c0@"
  en: "@a%0%a001250@bI thought flying carpets only existed in folk tales\nand books!\n@c0@"
  es: "@a%0%a001250@b¡Creía que las alfombras mágicas solo existían en los libros de cuentos!\n@c0@"
  fr: "@a%0%a001250@bJe croyais que les tapis volants n'existaient que dans les légendes et dans les livresⓠ\n@c0@"
  it: "@a%0%a001250@bUn tappeto volante?!\nCredevo che meraviglie del genere esistessero solo nelle fiabe!\n@c0@"
  ja: "@a@b%a001250「まほうのじゅうたん　なんて\n\t絵本の中の話だと　思ってた。\n@c0@"
12:
  de: "@aSancho@bWenn wir schon eine fliegende Teppiss gehabt hätten, als iss mit Señor Ludwig unterwegs war, wäre vieles einfacher gewesen.\n@c0@"
  en: "@aSancho@bEef we had the flying carpet when I am\r\ntravelling weeth señor Pankraz, everytheeng would be eso much easier.\n@c0@"
  es: "@aSancho@bSi el señor Teudis y yo hubiéramos tenido la alfombra mágica para nuestros viajes, todito habría sido más sencillo.\n@c0@"
  fr: "@aSancho@bSi on avait eu oun t-t-tapis volant pour voyager, avec le señor Petros, ça aurait été beaucoup plus facile.\n@c0@"
  it: "@aSancho@bPienso que el señor Russel no abbia mai saputo dell'esistenza del tappeto volante, chico, altrimenti avrebbe fatto de todo por trovarlo...\n@c0@"
  ja: "@a@bサンチョ「まほうのじゅうたんが\n\tあれば　パパスさまの旅も\n\tもっと楽でしたでしょうに……。\n@c0@"
13:
  de: "@aOtto@bDieser fliegende Teppich scheint ganz schön wertvoll zu sein. Ich frage mich, wie viel man dafür bekommen würd'...\n@c0@"
  en: "@aTuppence@bIt seems the flying carpet is quite a precious item.\r\nI wonder how much one could sell something like\r\nthat for.\n@c0@"
  es: "@aAlazar@bLa alfombra mágica parece un artículo bastante preciado. Me pregunto por cuánto podría venderse...\n@c0@"
  fr: "@aInnocent@bCe tapis volant a l'air d'être assez précieux.\r\nJe me demande combien il pourrait coûter.\n@c0@"
  it: "@aSimon@bUn oggetto mirabolante come un tappeto volante deve valere un bel po' di quattrini...\n@c0@"
  ja: "@a@bピピン「まほうのじゅうたんって\n\tすごく貴重なものらしいですよ。\n\t売ったら　いくらに　なるんだろう？\n@c0@"
14:
  de: "@a%0%a001240@bIch liebe es, hoch in der Luft zu sein. Wenn wir diesen Turm finden, werde ich nach ganz oben klettern und wie ein Vogel auf die Welt hinabblicken!\n@c0@"
  en: "@a%0%a001240@bI love being in high places. If we find that tower, I'm going to climb right to the top and look down over the whole world!\n@c0@"
  es: "@a%0%a001240@bMe encantan los lugares altos. ¡Si encontramos esa torre, voy a subir hasta arriba para ver el mundo entero desde lo alto!\n@c0@"
  fr: "@a%0%a001240@bJ'adore être en hauteur. Si on trouve cette tour,\nje vais grimper jusqu'en haut pour pouvoir\nregarder le monde entierⓠ\n@c0@"
  it: "@a%0%a001240@bMi piace stare in alto. Se trovassimo quella torre, mi piacerebbe salire fino in cima.\nScommetto che da lassù si può vedere tutto il mondo!\n@c0@"
  ja: "@a@b%a001240「ボク　高い所　大好き！\n\tその塔を見つけたら　のぼって\n\tてっぺんから　世界中を見渡すんだ！\n@c0@"
15:
  de: "@a%0%a001250@bGlaubst du, dieser Turm wurde gebaut, damit man nach Zenithia gelangen kann? Wie seltsam...\n@c0@"
  en: "@a%0%a001250@bDo you think that tower was built so people could get up to Zenithia? How strange!\n@c0@"
  es: "@a%0%a001250@b¿Crees que esa torre se construyó para que la gente pudiera subir hasta Zenithia? ¡Qué raro!\n@c0@"
  fr: "@a%0%a001250@bTu crois que cette tour a été construite pour que les gens puissent atteindre Zénithiaⓡ C'est étrangeⓠ\n@c0@"
  it: "@a%0%a001250@bChi può aver mai costruito una torre che permette di salire tanto in alto da arrivare fino a Zenithia?\n@c0@"
  ja: "@a@b%a001250「その塔って　天空のお城に\n\t入るために　建てられたのかな？\n\tふしぎね……。\n@c0@"
16:
  de: "@aSancho@bNo... Iss erinnere miss nisst an eine solche Turm, als iss mit Señor Ludwig unterwegs war...\n@c0@"
  en: "@aSancho@bNo... I no remember esuch a tower from the time when I travel the world weeth señor Pankraz.\n@c0@"
  es: "@aSancho@bNo... Yo no recuerdo que hubiera una torre así cuando viajaba por el mundo con el señor Teudis.\n@c0@"
  fr: "@aSancho@bNo... Je ne me r-r-rappelle pas d'oune tour pareille quand nous avons voyagé à t-t-travers le monde avec le s-señor Petros.\n@c0@"
  it: "@aSancho@b¿Una torre alta fino al cielo?\nNo ne avevo mai sentito hablare...\n@c0@"
  ja: "@a@bサンチョ「パパスさまの　お供をして\n\t世界中をまわりましたが…　はて\n\tそのような塔　ありましたかな……？\n@c0@"
17:
  de: "@a%0%a001240@bWahrheit und Vernunft kümmern uns nicht, oder? Wir wollen einfach nur was über Großmutter herausfinden.\n@c0@"
  en: "@a%0%a001240@bWe're not bothered about truth and reason, right? We just want to find out more about Grandma.\n@c0@"
  es: "@a%0%a001240@bNo nos ocupamos de la verdad y la razón, ¿eh?\nSolo queremos saber más acerca de la abuela.\n@c0@"
  fr: "@a%0%a001240@bOn s'en moque de la vérité et du pourquoi du comment, nonⓡ Tout ce qu'on veut, c'est en\nsavoir plus sur grand-mère.\n@c0@"
  it: "@a%0%a001240@bA me non importa nulla della conoscenza e della verità.\nSono qui solo per avere notizie di mia nonna.\n@c0@"
  ja: "@a@b%a001240「ボクたち　世界の道理とか\n\tそういうんじゃなくって\n\tお母さんのことが　知りたいのに。\n@c0@"
18:
  de: "@aSancho@bWeißt du, hier ist es sehr hoch. Diese Dorf ist schon sehr unheimliss, no?\n@c0@"
  en: "@aSancho@bYou know, ees very high up here.\nThees village, ees een a scary place, sí?\n@c0@"
  es: "@aSancho@bHíjole, qué alto está esto.\nEste pueblo da tantito miedo, ¿no?\n@c0@"
  fr: "@aSancho@bTu sais, on est t-t-très haut, ici. Ce village est\noun peu effrayant, noⓡ\n@c0@"
  it: "@aSancho@b¿Esto villaggios está muy en altos, sì?\nNo es bueno por las personas que soffrono de vertigines...\n@c0@"
  ja: "@a@bサンチョ「それにしても　この高さ…\n\t恐ろしい場所にある村も\n\tあったものです。\n@c0@"
19:
  de: "@a%0%a001250@bDas ist nicht gerecht! Nicht jedes Monster ist böse. Sie können ja auch nichts dafür, dass einige von ihnen zu schlimmen Sachen angestiftet werden!\n@c0@"
  en: "@a%0%a001250@bIt's not fair! There are loads of monsters about who aren't evil. They can't help it if some of them get ordered to do bad things.\n@c0@"
  es: "@a%0%a001250@b¡No es justo! Hay montones de monstruos que no son malvados. No tienen la culpa de que a algunos les ordenen hacer cosas malas.\n@c0@"
  fr: "@a%0%a001250@bC'est pas justeⓠ Il y a plein de monstres qui ne sont pas méchants. Ce n'est pas leur faute si on ordonne à certains d'entre eux de faire des vilaines choses.\n@c0@"
  it: "@a%0%a001250@bPerché tutti se la prendono sempre con i mostri?! I mostri sono buoni! Non è mica colpa loro se qualcuno li costringe a commettere delle cattive azioni!\n@c0@"
  ja: "@a@b%a001250「悪くない魔物さんも\n\tいっぱい　いるのに！\n\tこわい人が命令するから　いけないの。\n@c0@"
20:
  de: "@aSancho@bSi. Das ist wahr. Danach hat Señor Ludwig beschlossen, sie zu suchen.\n@c0@"
  en: "@aSancho@bSí. Ees true. After thees, señor Pankraz, he decided to leave on the quest to find her.\n@c0@"
  es: "@aSancho@bSí. Es la puritita verdad. Después de eso, el señor Teudis decidió partir con la misión de buscarla.\n@c0@"
  fr: "@aSancho@bSi. C'est vrai. Après ça, le señor Petros a\r\nd-d-décidé de partir à sa recherche.\n@c0@"
  it: "@aSancho@bCuando la povera señora Mada venne rapita, el señor Russel partì subitos por metterse alla sua ricercas...\n@c0@"
  ja: "@a@bサンチョ「……そうです。\n\t以来　パパスさまは　マーサさまを\n\t探す旅に出られたのです。\n@c0@"
21:
  de: "@aSancho@bUnd von diese Suche ist er nie wieder zurückgekehrt...\n@c0@"
  en: "@aSancho@bThe quest from which he never\r\nwould return...\n@c0@"
  es: "@aSancho@bLa misión de la que jamás regresaría...\n@c0@"
  fr: "@aSancho@bOune recherche dont il n'est j-j-jamais revenu...\n@c0@"
  it: "@aSancho@bEl señor Russel no trovò Mada, ma la muerte...\nYo... Yo me commuovos...\n¡Sob!\n@c0@"
  ja: "@a@bサンチョ「二度と　帰れぬ旅に……。\n@c0@"
22:
  de: "@aSancho@bHah... Hah... Hah...\nIss habe noch nie eine Ort gesehen mit so vielen Höhen und so wenigen Tiefen!\n@c0@"
  en: "@aSancho@bHahh...hahh... Hahh...hahh...\nI never esee the place weeth eso many ups and eso few downs!\n@c0@"
  es: "@aSancho@bAaah..., aaah... Aaah..., aaah...\r\n¡Nunca había visto un lugar con tantas subidas\r\ny tan pocas bajadas!\n@c0@"
  fr: "@aSancho@bHaan... haan... haan... haan...\nJe n'avais jamais vu d'endroit où il f-f-fallait autant monter et j-jamais descendreⓠ\n@c0@"
  it: "@aSancho@bHaaahhh... Haaahhh... Haaahhh... Haaahhh...\n¡Esto posto es un saliscendi continuos, però aquí ce sono muchissimos ⓕsaliⓖ y pochissimos ⓕscendiⓖ!\n@c0@"
  ja: "@a@bサンチョ「ヒイ　ヒイ…　ハア　ハア……\n\tいまだかつて　経験したことのないほど\n\tキツイ場所ですなあ……。\n@c0@"
23:
  de: "@a%0%a001240@bMann! Was für eine Aussicht!\n@c0@"
  en: "@a%0%a001240@bWow! Look! Just look at how far you can see from up here!\n@c0@"
  es: "@a%0%a001240@b¡Anda! ¡Mira! ¡Mira todo lo que se puede ver desde aquí!\n@c0@"
  fr: "@a%0%a001240@bWaouhⓠ Regarde jusqu'où on voit, d'iciⓠ\n@c0@"
  it: "@a%0%a001240@bAccidenti...!\nChe panorama incredibile!\n@c0@"
  ja: "@a@b%a001240「うわ～！　すごいよ！\n\tすっごく　遠くまで見えるよ～！\n@c0@"
24:
  de: "@a%0%a001250@bIch trau mich nicht, runterzugucken!\n@c0@"
  en: "@a%0%a001250@bI'm too scared to look down!\n@c0@"
  es: "@a%0%a001250@b¡Estoy demasiado asustada para mirar abajo!\n@c0@"
  fr: "@a%0%a001250@bJ'ai trop peur pour regarder en basⓠ\n@c0@"
  it: "@a%0%a001250@bNon voglio guardare di sotto!\nSoffro di vertigini!\n@c0@"
  ja: "@a@b%a001250「下見ると　こわいから\n\t見ないの！\n@c0@"
25:
  de: "@aOtto@bIch frage mich, ob hier schon mal jemand in die Tiefe gestürzt ist.\n@c0@"
  en: "@aTuppence@bI wonder if anyone's plummeted to their death from up here.\n@c0@"
  es: "@aAlazar@bMe pregunto si habrá muerto alguien cayendo en picado desde aquí.\n@c0@"
  fr: "@aInnocent@bJe me demande si des gens sont déjà tombés dans\r\nle vide.\n@c0@"
  it: "@aSimon@bSe cadessi di sotto, farei un botto che sentirebbero fino a Denim.\nBrrrrr! Meglio non pensarci!\n@c0@"
  ja: "@a@bピピン「ここから　落ちて\n\t死んでしまった人は\n\tいないんでしょうか……？\n@c0@"
26:
  de: "@a%0%a001250@bHatte Großmutter wirklich solch eine Macht? Es muss ganz schön schlimm für die Leute hier gewesen sein, als sie gegangen ist.\n@c0@"
  en: "@a%0%a001250@bWas Grandma really so powerful? It must've been pretty awful when she decided to leave here, then.\n@c0@"
  es: "@a%0%a001250@b¿Es verdad que la abuela tenía tanto poder? Entonces, debió ser terrible\nque decidiera marcharse de aquí.\n@c0@"
  fr: "@a%0%a001250@bGrand-mère était vraiment aussi puissanteⓡ\nÇa a dû être une catastrophe quand elle a\ndécidé de partir d'ici, alors.\n@c0@"
  it: "@a%0%a001250@bDavvero la nonna era così potente? Ora capisco come mai gli abitanti di Picco Maximo si arrabbiarono quando lei se ne andò con nonno Russel...\n@c0@"
  ja: "@a@b%a001250「おばあちゃんって　そんなに\n\tすごい人だったの？　じゃあ\n\tこの村を出るとき　大変だったよね？\n@c0@"
27:
  de: "@a%0%a001240@bAll dieses Gerede über die Göttin und die Unterwelt ist furchtbar kompliziert, findest du nicht?\n@c0@"
  en: "@a%0%a001240@bAll this talk about the Goddess and the underworld is a bit complicated, isn't it?\n@c0@"
  es: "@a%0%a001240@bToda esta charla sobre la Diosa y el inframundo es un poco complicada, ¿no?\n@c0@"
  fr: "@a%0%a001240@bTous ces discours sur la Déesse et sur le monde souterrain sont un peu compliqués, nonⓡ\n@c0@"
  it: "@a%0%a001240@bI prescelti della dea, il Regno degli Inferi, i poteri di nonna Mada...\nNon ci sto capendo più niente!\n@c0@"
  ja: "@a@b%a001240「神さまとか　魔界とか\n\t急に　そんなこと言われても\n\tうーん……。\n@c0@"
28:
  de: "@aSancho@bSiehst du jetzt, was für eine große Mann dein Padre Ludwig war? Er hat siss in diese Señorita verliebt, dabei war sie keine normale Señorita. No, no, no.\n@c0@"
  en: "@aSancho@bYou see how great a man señor Pankraz was? He fell een love weeth thees señorita, but eshe ees no ordinary señorita. No, no, no.\n@c0@"
  es: "@aSancho@b¿Ves qué gran hombre era el señor Teudis?\nSe enamoró de una señorita, pero no una señorita corriente. No, no, no.\n@c0@"
  fr: "@aSancho@bTu vois quel g-g-grand homme était le señor Petrosⓡ Il est tombé amoureux de cette señorita, mais ce n'était pas oune señorita ordinaire. No, no.\n@c0@"
  it: "@aSancho@bCuando el señor Russel se innamorò della señorita Mada, no sabeva que lei aveva dei poteres especiales.\n㈡\nPer lui, era solo la mujer de los suos sueños.\n@c0@"
  ja: "@a@bサンチョ「さすが　パパスさまの\n\tお選びになった方ですよ！\n\tそのへんの女性とは　ちがいます。\n@c0@"
29:
  de: "@aOtto@bOb's wohl wirklich stimmt, dass sie von der Göttin auserwählt wurden? Vielleicht glauben sie das nur, weil sie diese besonderen Kräfte haben...\n@c0@"
  en: "@aTuppence@bDo you think it's true that they were chosen by the Goddess? Maybe they just assume that because they have these special powers.\n@c0@"
  es: "@aAlazar@b¿Crees que es cierto que fueran elegidos por la Diosa? Puede que lo den por hecho porque tienen poderes especiales.\n@c0@"
  fr: "@aInnocent@bCroyez-vous que c'est vrai qu'ils ont été choisis par la Déesseⓡ Peut-être qu'ils le supposent parce qu'ils ont ces pouvoirs particuliers.\n@c0@"
  it: "@aSimon@bChissà se gli abitanti di Picco Maximo sono davvero i prescelti della dea...\nPotrebbero anche sbagliarsi, no?\n@c0@"
  ja: "@a@bピピン「神に選ばれたって　ホントかな？\n\tすごい能力を持っているから　きっと\n\tそうだって　思ってるだけじゃなくて？\n@c0@"
30:
  de: "@a%0%a001240@bHui, was ist das denn für ein Schlüssel! Der hat ja wirklich eine seltsame Farbe!\n@c0@"
  en: "@a%0%a001240@bWow! What an amazing key!\nIt's glowing a really strange colour.\n@c0@"
  es: "@a%0%a001240@b¡Vaya! ¡Qué llave tan extraña!\nBrilla con un color muy raro.\n@c0@"
  fr: "@a%0%a001240@bWaouhⓠ Quelle clef incroyableⓠ Elle brille d'une couleur vraiment étrange.\n@c0@"
  it: "@a%0%a001240@bHai visto questa chiave?\nÈ bellissima!\n@c0@"
  ja: "@a@b%a001240「うわ～！　きれいなカギだね。\n\tふしぎな色に　光ってる！\n@c0@"
31:
  de: "@a%0%a001250@bDas ist der Zauberschlüssel, der alle Schlösser öffnet, nicht wahr? Hm, wo kann man ihn noch mal verwenden?\n@c0@"
  en: "@a%0%a001250@bThat's the magic key that opens all sorts of doors, right? Hmm, now where was it you can use it again?\n@c0@"
  es: "@a%0%a001250@bEsa es la llave mágica que abre todas las puertas, ¿verdad? Mmm, ¿y dónde decías que podía usarse?\n@c0@"
  fr: "@a%0%a001250@bC'est la clef magique qui ouvre toutes sortes de portes, c'est çaⓡ Mmm, où est-ce qu'on peut l'utiliser, déjàⓡ\n@c0@"
  it: "@a%0%a001250@bQuella è la chiave magica che apre tutte le porte, non è vero?\nUhm, dove potremmo usarla?\n@c0@"
  ja: "@a@b%a001250「それって　いろんなトビラが\n\t開けられる　まほうのカギでしょ？\n\tえ～と…　どこで使えるんだっけ……。\n@c0@"
32:
  de: "@a%0%a001240@bIst das der fliegende Teppich? Glaubst du, er ist echt, Papa? Können wir mal mit ihm fliegen? Oh, das ist ja so aufregend!\n@c0@"
  en: "@a%0%a001240@bIs this the flying carpet? Do you think it's the real thing? Is it, Dad? Is it real? Can we have a ride on it? I'm so excited!\n@c0@"
  es: "@a%0%a001240@b¿Es esta la alfombra mágica? ¿Crees que es la auténtica? ¿Lo es, papá? ¿Es de verdad? ¿Podemos montarnos en ella? ¡Estoy entusiasmado!\n@c0@"
  fr: "@a%0%a001240@bC'est le tapis volantⓡ Tu crois que c'est vraiment le vraiⓡ Hein, dis papaⓡ On peut l'essayerⓡ Je suis tellement impatient de monter dessusⓠ\n@c0@"
  it: "@a%0%a001240@bQuesto è un tappeto volante?!\nUn vero tappeto volante?! Papà, perché non lo proviamo subito, eh? Dai, proviamolo!\n@c0@"
  ja: "@a@b%a001240「これが　まほうのじゅうたん？\n\t本物かな？　ねえ　本物かな？？\n\t早く　乗ってみようよ！\n@c0@"
33:
  de: "@a%0%a001250@bSieht wie ein ganz normaler Teppich aus, wenn du mich fragst. Und der soll wirklich fliegen können?\n@c0@"
  en: "@a%0%a001250@bIt looks just like a normal bit of carpet to me.\nDo you think it can really fly?\n@c0@"
  es: "@a%0%a001250@bA mí me parece una alfombra normal.\n¿Crees que puede volar de verdad?\n@c0@"
  fr: "@a%0%a001250@bIl ressemble à un tapis ordinaire, je trouve.\nTu crois qu'il peut vraiment volerⓡ\n@c0@"
  it: "@a%0%a001250@bA me sembra un tappeto come tutti gli altri...\nDavvero pensi che questo pezzo di stoffa possa volare?\n@c0@"
  ja: "@a@b%a001250「こうして見ると　ふつうの\n\tじゅうたんみたいだけど……。\n\t本当に　飛ぶのかな？\n@c0@"
34:
  de: "@aOtto@bDieses Ding sieht wie ein alter, abgenutzter Teppich aus. Und Ihr glaubt wirklich, dass er uns alle tragen kann?\n@c0@"
  en: "@aTuppence@bIt looks like rather an ancient piece of carpet. Do you think it'll stand up to us all trying to ride on it?\n@c0@"
  es: "@aAlazar@bParece una alfombra bastante vieja. ¿Creéis que aguantará que nos montemos todos?\n@c0@"
  fr: "@aInnocent@bIl a l'air plutôt vieux, ce tapis. Vous croyez qu'il supportera notre poids à tous, si on l'essaieⓡ\n@c0@"
  it: "@aSimon@bQuesto tappeto mi sembra vecchio e malridotto.\r\nAmmesso e non concesso che voli davvero, siamo sicuri che riuscirà a sostenere il nostro peso?\n@c0@"
  ja: "@a@bピピン「これはまた　ずいぶんと\n\t古そうな　じゅうたんですね。\n\tみんなで乗って　大丈夫かな？\n@c0@"
35:
  de: "@aSancho@bIss kann verstehen, dass du ihn in deine Beutel steckst, da ist er sisser. Aber du musst ihn ab und zu rausnehmen und lüften, si?\n@c0@"
  en: "@aSancho@bEes okay eef you want to keep eet esafely away een your bag, but you must take eet out esometimes for the airing.\n@c0@"
  es: "@aSancho@bPues no pasa nada porque la guardes en tu bolsa, nomás que tendrás que sacarla de vez en cuando para que se airee.\n@c0@"
  fr: "@aSancho@bÇa n'est pas oun problème de le g-g-garder en sécurité dans le sac, mais il faudra le s-sortir de temps en temps pour l'aérer.\n@c0@"
  it: "@aSancho@bPodemos metterlo en la borsa, ma de cuando en cuando dovremmo fagli prendere un poco d'aria, altrimenti las tarmas lo mangeranno todo.\n@c0@"
  ja: "@a@bサンチョ「大事にしまっておくのは\n\tいいんですが　たまには\n\t日に当てて　ほさないと……\n@c0@"
36:
  de: "@aSancho@bNo! Lass gut sein, Chico! Deine Onkel Sancho wird siss für diss darum kümmern!\n@c0@"
  en: "@aSancho@bEh! You no worry about eet, friend! Your Uncle Sancho, he can do these chores for you.\n@c0@"
  es: "@aSancho@b¡Eh! ¡No te preocupes por eso, chamaquito! Tu tito Sancho puede ocuparse de esas faenas.\n@c0@"
  fr: "@aSancho@bHéⓠ Ne t'inquiète pas pour ça, chicoⓠ Tonton Sancho peut se charger de ces corvées pour toi.\n@c0@"
  it: "@aSancho@b¿No vorrai que un oggetto tantos prezioso diventi el espuntino de qualche insettos troppos voraces, eh?\n@c0@"
  ja: "@a@bサンチョ「ああ　いいです　坊っちゃん。\n\tあとで　私が　やっておきますよ。\n@c0@"
37:
  de: "@a%0%a001250@bVielleicht träumen wir ja von Großmutter, wenn wir hier übernachten. Das wäre schön. Ich würde sie so gern mal sehen.\n@c0@"
  en: "@a%0%a001250@bIf we stay here, maybe we'll dream about Grandma. That'd be nice. I'd really like to see her.\n@c0@"
  es: "@a%0%a001250@bSi nos quedamos aquí, puede que soñemos con la abuela. Sería bonito. Me gustaría mucho verla.\n@c0@"
  fr: "@a%0%a001250@bSi on reste ici, peut-être qu'on rêvera\nde grand-mère. Ce serait bien.\nJ'aimerais vraiment la voir.\n@c0@"
  it: "@a%0%a001250@bSe restassimo qui, forse sogneremo la nonna.\nSono tanto curiosa di scoprire che faccia ha, sai?\n@c0@"
  ja: "@a@b%a001250「ここに　泊まったら\n\tおばあちゃんの夢が見られるといいのに。\n\tわたし　おばあちゃんのお顔　見たいな。\n@c0@"
38:
  de: "@a%0%a001240@bIch frage mich, ob Großmutter hier mal übernachtet hat.\n@c0@"
  en: "@a%0%a001240@bI wonder if Grandma ever stayed here.\n@c0@"
  es: "@a%0%a001240@bMe pregunto si la abuela estuvo aquí alguna vez.\n@c0@"
  fr: "@a%0%a001240@bJe me demande si grand-mère a déjà dormi ici.\n@c0@"
  it: "@a%0%a001240@bChissà se la nonna ha mai trascorso la notte qui...\n@c0@"
  ja: "@a@b%a001240「おばあちゃんも　ここに\n\t泊まったこと　あるかなあ？\n@c0@"
39:
  de: "@a%0%a001240@bAber wahrscheinlich nicht. Wenn sie im Dorf gelebt hat, brauchte sie ja keine Herberge...\nWas bin ich doof!\n@c0@"
  en: "@a%0%a001240@bOh, I suppose not. If she lived in the village, then she wouldn't need a room at the inn. Silly me!\n@c0@"
  es: "@a%0%a001240@bBueno, supongo que no. Si vivía en el pueblo, no necesitaría una habitación en la posada.\n¡Qué tonto soy!\n@c0@"
  fr: "@a%0%a001240@bOh, mais non, bien sûr. Si elle vivait dans le village, elle n'avait pas besoin d'une chambre à l'auberge,\nje suis bêteⓠ\n@c0@"
  it: "@a%0%a001240@bAh, che cosa stupida ho detto! Se viveva a Picco Maximo, avrà avuto una casa nel villaggio, no?\nNon aveva certo bisogno di dormire alla locanda...\n@c0@"
  ja: "@a@b%a001240「あっ　でも\n\tこの村の人だったら\n\t宿には　泊まらないか。　えへへ……。\n@c0@"
40:
  de: "@aSancho@bSelbst hier es gibt Waffen und Rüstungen. Aber die Geschäfte scheinen nisst gut zu laufen, no?\n@c0@"
  en: "@aSancho@bEven here, there are weapon and armour eshops.\r\nBut they no eseem to go well here, you no theenk?\n@c0@"
  es: "@aSancho@bIncluso aquí hay tiendas de armas y armaduras.\nAunque parece que no les va muy bien, ¿sí?\n@c0@"
  fr: "@aSancho@bMême ici, il y a des m-m-magasins d'armes et d'armures. Mais ils n'ont pas l'air très p-prospères, tu ne trouves pasⓡ\n@c0@"
  it: "@aSancho@bAquí ce sono negozios de armas y de armaturas, ma no pienso que facciano muchos affares...\n@c0@"
  ja: "@a@bサンチョ「このような場所にも\n\t武器屋や防具屋が　あるんですね。\n\tなんとも　不似合いな感じがしますが。\n@c0@"
41:
  de: "@a%0%a001240@bEs gibt einen Laden und alles, aber wo sind die Kunden?\n@c0@"
  en: "@a%0%a001240@bThere's a proper shopkeeper and everything, but I wonder if there are ever any customers.\n@c0@"
  es: "@a%0%a001240@bTienen su dependiente y todo, pero me pregunto si tendrán algún cliente.\n@c0@"
  fr: "@a%0%a001240@bIl y a bien quelqu'un pour tenir le magasin, mais je\nme demande s'ils ont des clients.\n@c0@"
  it: "@a%0%a001240@bCarino, questo negozio...\nCredi che abbia molti clienti?\n@c0@"
  ja: "@a@b%a001240「お店屋さんがあるけど\n\tお客さんって　来るのかなあ？\n@c0@"
42:
  de: "@a%0%a001240@bHört sich so an, als würden die Leute hier ihr Dorf nicht besonders oft verlassen. Das muss ganz schön einsam sein.\n@c0@"
  en: "@a%0%a001240@bIt sounds like the people here don't often visit the outside world. That must be a bit lonely.\n@c0@"
  es: "@a%0%a001240@bNo parece que la gente de aquí salga mucho al mundo exterior. Debe resultar un poco solitario.\n@c0@"
  fr: "@a%0%a001240@bOn dirait que les gens d'ici ne sortent pas souvent de leur village. Ils doivent se sentir un peu seuls.\n@c0@"
  it: "@a%0%a001240@bSi direbbe che gli abitanti del posto non abbiano molta simpatia per gli stranieri...\n@c0@"
  ja: "@a@b%a001240「ここの人たちって\n\tあんまり　外に出ないのかなあ？\n\tなんだか　さみしいね……。\n@c0@"
43:
  de: "@aSancho@bQué! Was will diese Frau eigentliss?! Señora Magda war sehr glückliss mit Señor Ludwig!\n@c0@"
  en: "@aSancho@bEh! Who ees thees brazen buckaroo!?\r\nSeñora Mada, eshe was eso happy\r\nmarried to señor Pankraz.\n@c0@"
  es: "@aSancho@b¡Eh! ¿Quién es esa tipa desvergonzada?\r\nLa señora Perséfone estaba felizmente casada\r\ncon el señor Teudis.\n@c0@"
  fr: "@aSancho@bHéⓠ Mais pour qui elle se p-p-prend, celle-làⓡⓐ\nLa señora Magdalena, elle était t-t-très heureuse d'avoir épousé le señor Petros.\n@c0@"
  it: "@aSancho@b¡Quella vecchia mummia no parlerebbe così si sapesse quant'era feliz la señorita Mada con el señor Russel!\n@c0@"
  ja: "@a@bサンチョ「なんたる失礼な！\n\tマーサさまは　ご結婚なされて\n\t本当に　お幸せそうでしたのに！\n@c0@"
44:
  de: "@a%0%a001240@bDas war Großvater Ludwig, ganz sicher!\n@c0@"
  en: "@a%0%a001240@bThat's Grandpa Pankraz!\nGood for him!\n@c0@"
  es: "@a%0%a001240@b¡Ese sería el abuelo Teudis!\n¡Me alegro por él!\n@c0@"
  fr: "@a%0%a001240@bC'est grand-père Petrosⓠ Tant mieux pour luiⓠ\n@c0@"
  it: "@a%0%a001240@bSì!\nEra proprio mio nonno Russel!\n@c0@"
  ja: "@a@b%a001240「パパスおじいちゃん　やるね！\n\tかっこいいなー！\n@c0@"
45:
  de: "@aOtto@bAch, wär ich das nur gewesen...\nÄhm, nichts. Ich hab gar nichts gesagt.\n@c0@"
  en: "@aTuppence@bHopefully it won't be too long for me now...\nEr, nothing. Never mind.\n@c0@"
  es: "@aAlazar@bEspero que a mí no me lleve tanto tiempo...\nMmm, da igual. No importa.\n@c0@"
  fr: "@aInnocent@bEspérons que ça m'arrivera bientôt, à moi aussi...\r\nEuh, non... rien.\n@c0@"
  it: "@aSimon@bChissà che anch'io non m'innamori di una bella fanciulla di Picco Maximo e... Uhm, meglio di no.\r\nLa faccenda sarebbe troppo complicata...\n@c0@"
  ja: "@a@bピピン「ボクも　そろそろ……\n\tいやっ　その\n\tなんでもないですよ！\n@c0@"
46:
  de: "@a%0%a001240@bWas?! Hier gibt es einen fliegenden Teppich?! Wahnsinn! Den müssen wir so schnell wie möglich finden, Papa!\n@c0@"
  en: "@a%0%a001240@bNo way! There's a flying carpet here somewhere? Wow! We'd better find it, Dad!\n@c0@"
  es: "@a%0%a001240@b¡No puede ser! ¿Aquí hay una alfombra mágica? ¡Vaya! ¡Tenemos que buscarla, papá!\n@c0@"
  fr: "@a%0%a001240@bSans rireⓠ Il y a un tapis volant quelque part iciⓡ Waouhⓠ On ferait bien de le trouver, papaⓠ\n@c0@"
  it: "@a%0%a001240@bChe cosa?! Da queste parti c'è un tappeto volante?!\nTroppo forte!\nPapà, dobbiamo assolutamente trovarlo!\n@c0@"
  ja: "@a@b%a001240「えっ？　この村に\n\tまほうのじゅうたんが　あるの？\n\tすごいや！　お父さん　さがそうよ！\n@c0@"
47:
  de: "@a%0%a001240@bHa! Wir haben ihn. Wir haben den fliegenden Teppich!\n@c0@"
  en: "@a%0%a001240@bHa! We've already got it.\nWe've already got the flying carpet!\n@c0@"
  es: "@a%0%a001240@b¡Ja! Ya la tenemos.\n¡Ya tenemos la alfombra mágica!\n@c0@"
  fr: "@a%0%a001240@bAhⓠ On l'a déjà. On a déjà le tapis volantⓠ\n@c0@"
  it: "@a%0%a001240@bHah!\nCe l'abbiamo già, il tappeto volante...\n@c0@"
  ja: "@a@b%a001240「もう持ってるもんねー。\n\tまほうのじゅうたん！\n@c0@"
48:
  de: "@a%0%a001250@bWir können aber nicht beweisen, dass wir mit Großmutter verwandt sind. Meinst du, das ist schlimm?\n@c0@"
  en: "@a%0%a001250@bWe can't prove that we're related to Grandma, though. Do you think it matters?\n@c0@"
  es: "@a%0%a001250@bPero no podemos demostrar que somos familia de la abuela. ¿Crees que importará?\n@c0@"
  fr: "@a%0%a001250@bLe problème, c'est qu'on ne peut pas prouver\nqu'on est bien parents avec grand-mère.\nTu crois que c'est gênantⓡ\n@c0@"
  it: "@a%0%a001250@bNon siamo in grado di dimostrare che siamo parenti di nonna Mada.\nSpero che questo non sia un problema...\n@c0@"
  ja: "@a@b%a001250「おばあちゃん　ゆかりの者って\n\tショウコもないのに　いいのかな？\n@c0@"
49:
  de: "@a%0%a001250@bSancho sagt, dass wir uns vor Leuten in Acht nehmen sollen, die uns etwas umsonst geben wollen. Glaubst du, wir können diesem Mann vertrauen?\n@c0@"
  en: "@a%0%a001250@bSancho said we should always beware of people who try to give us things for free. Does that mean we shouldn't trust that man?\n@c0@"
  es: "@a%0%a001250@bSancho dijo que desconfiáramos siempre de la gente que nos quisiera regalar cosas. ¿Significa eso que no debemos fiarnos de ese hombre?\n@c0@"
  fr: "@a%0%a001250@bSancho nous a toujours dit de nous méfier des\ngens qui essayaient de nous offrir des choses gratuitement.\n㈡\nEst-ce que ça veut dire qu'il ne faut pas faire confiance à cet hommeⓡ\n@c0@"
  it: "@a%0%a001250@bPapà, credi che abbiamo fatto bene a prendere il tappeto volante?\nNon è che appartiene a qualcun altro?\n@c0@"
  ja: "@a@b%a001250「サンチョが　タダで　なにか\n\tくれる人には　気をつけなさいって。\n\tあの人にも　気をつけないとダメ？\n@c0@"
50:
  de: "@aOtto@bWenn ich verwandt mit ihr wär, würd' mir der fliegende Teppich g'hören. Hmpf!\n@c0@"
  en: "@aTuppence@bIf only I were a relative of hers, then the flying carpet would be mine. Hmph!\n@c0@"
  es: "@aAlazar@bSi yo hubiera sido pariente de ella, esa alfombra mágica sería ahora mía. ¡Mmm!\n@c0@"
  fr: "@aInnocent@bSi seulement je faisais partie de sa famille... le tapis volant m'appartiendrait. Mmpfⓠ\n@c0@"
  it: "@aSimon@bSe fossi parente della regina Mada, il tappeto volante sarebbe mio di diritto... Però sono stato un suo suddito! Che regalo mi spetta?\n@c0@"
  ja: "@a@bピピン「ボクが　ゆかりの者だったら\n\tまほうのじゅうたんは\n\tボクのものだったのに。　ああ……。\n@c0@"
51:
  de: "@a%0%a001240@bPapa! Bind ihm doch keinen Bären auf und sag ihm die Wahrheit!\n@c0@"
  en: "@a%0%a001240@bDad! You mustn't tell fibs, you know.\nYou should tell him the truth.\n@c0@"
  es: "@a%0%a001240@b¡Papi! No hay que decir mentirijillas, ¿sabes?\nDeberías decirle la verdad.\n@c0@"
  fr: "@a%0%a001240@bPapaⓠ Il ne faut pas dire de mensonges.\nTu devrais lui dire la vérité.\n@c0@"
  it: "@a%0%a001240@bPapà, perché non gli dici la verità?\n@c0@"
  ja: "@a@b%a001240「……お父さん。\n\tウソはダメだよ。\n\tホントのこと　言わないと。\n@c0@"
52:
  de: "@aSancho@bDu bist nisst nur verwandt mit Señora Magda, Chico. Du bist ihr Sohn!\n@c0@"
  en: "@aSancho@bYou are no just a relative of señora Mada, friend.\nYou, you are her eson!\n@c0@"
  es: "@aSancho@bTú no eres nomás un pariente de la señora Perséfone, chamaco. ¡Tú eres su mero hijo!\n@c0@"
  fr: "@aSancho@bTu n'es pas seulement p-p-parent de la señora Magdalena, chico. T-Tu es son filsⓠ\n@c0@"
  it: "@aSancho@b¡Chico, tu no sei semplicementes un parente della señora Mada!\n¡Tu sei suo figlio!\n@c0@"
  ja: "@a@bサンチョ「坊っちゃん。\n\tゆかりの者　というのは\n\tつながりのある…　という意味ですよ。\n@c0@"
53:
  de: "@aSancho@bDie Leute hier, sie werden gut zu dir sein, weil du Señora Magdas Niño bist.\n@c0@"
  en: "@aSancho@bThe people here, they are good to you because you are her child.\n@c0@"
  es: "@aSancho@bAcá la gente es buena contigo porque eres su hijo.\n@c0@"
  fr: "@aSancho@bLes gens d'ici sont gentils avec toi p-p-parce que\r\ntu es son enfant.\n@c0@"
  it: "@aSancho@bLa gente de aquí te vorrà bien, por qué tu appartieni alla loro stirpes.\n@c0@"
  ja: "@a@bサンチョ「お子である　坊っちゃんは\n\tマーサさまのゆかりの者です。\n\tひとつ　おりこうに　なりましたね！\n@c0@"
54:
  de: "@aSancho@bEine Wunder! Wir haben den verschwundenen Handwerker aus Humburg gefunden! Das hätte iss nie erwartet, no!\n@c0@"
  en: "@aSancho@bEes a miracle! We have found the missing craftsman of Gotha! I never expected to find heem here!\n@c0@"
  es: "@aSancho@b¡Es un milagro! ¡Encontramos al artesano desaparecido de Pankraz! ¡No creí que lo fuéramos a encontrar acá!\n@c0@"
  fr: "@aSancho@bC'est oun miracleⓠ Nous avons r-r-retrouvé l'artisan disparu de Gothaⓠ Je n'aurais j-jamais\ncru qu'on le c-croiserait iciⓠ\n@c0@"
  it: "@aSancho@b¡Es incredibile!\n¡Abbiamo retrovato l'artigiano que era escomparso da Denim mucho tiempo fa!\r\n@c0@"
  ja: "@a@bサンチョ「まさか名工が　こんな場所に\n\tいらっしゃっていたとは……\n\tゆくえが　わからないはずです。\n@c0@"
55:
  de: "@a%0%a001240@bEs ist schön, Leute zu treffen, die Großvater Ludwig und Großmutter Magda so sehr mochten.\n@c0@"
  en: "@a%0%a001240@bIt's nice to meet people who like Grandpa Pankraz and Grandma Mada so much.\n@c0@"
  es: "@a%0%a001240@bEs bonito encontrar gente que quería tanto al abuelo Teudis y la abuela Perséfone.\n@c0@"
  fr: "@a%0%a001240@bC'est chouette de rencontrer des gens qui aiment autant grand-père Petros et grand-mère Magda.\n@c0@"
  it: "@a%0%a001240@bMi fa piacere incontrare persone tanto affezionate a nonno Russel e a nonna Mada...\n@c0@"
  ja: "@a@b%a001240「パパスおじいちゃんや\n\tマーサおばあちゃんを大好きな人に\n\t会えるのって　うれしいね。\n@c0@"
56:
  de: "@a%0%a001250@bAber Großvater Ludwig ist doch mausetot, stimmt's, Papa? Er ist direkt vor deinen Augen gestorben... Oh! (Schluchz)\n@c0@"
  en: "@a%0%a001250@bBut Grandpa Pankraz is definitely dead, right? Killed right before your very eyes... Oh! (sob)\n@c0@"
  es: "@a%0%a001250@bPero el abuelo Teudis está muerto, ¿verdad?\nLo mataron ante tus ojos... ¡Oh! (snif)\n@c0@"
  fr: "@a%0%a001250@bMais grand-père Petros est bien mort, nonⓡ\nTué sous tes propres yeux... Ohⓠ (sanglot)\n@c0@"
  it: "@a%0%a001250@bPurtroppo nonno Russel non c'è più...\nL'hanno mandato in cielo proprio sotto i tuoi occhi...\nNon è così, papà? Sob!\n@c0@"
  ja: "@a@b%a001250「でも　パパスおじいちゃんは\n\t死んでしまったんでしょ？\n\tお父さんの　目の前で…　ぐすん……。\n@c0@"
57:
  de: "@aOtto@bAha! Das ist also der berühmte Handwerker aus Humburg! Sieh an, sieh an!\n@c0@"
  en: "@aTuppence@bAah! So that's the famous craftsman from Gotha!\r\nWell, well, well!\n@c0@"
