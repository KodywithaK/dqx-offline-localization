  en: "@a@bIf you need to take a break right now, you can close your Nintendo DS Series System to put it into Sleep Mode.\n@c0@"
  es: "@a@bSi necesitas hacer una pausa ahora mismo, puedes cerrar la consola Nintendo DS para que entre en modo de espera.\n@c0@"
  fr: "@a@bSi vous devez faire une pause tout de suite, vous pouvez fermer votre console de la série Nintendo DS pour la mettre en mode veille.\n@c0@"
  it: "@a@bSe vuoi interrompere la partita adesso, chiudi la tua console della serie Nintendo DS ed entra in modalità riposo.\n@c0@"
  ja: "@a@b今すぐ　休けいしたいときは\nこのまま　ＤＳシリーズ本体を閉じ\nスリープモードにしてください。\n@c0@"
25:
  de: "@a@bDu kannst dein Abenteuer fortsetzen, indem du deinen DS einfach wieder öffnest. Aber pass auf, dass dir die Batterie nicht ausgeht!\n@c0@"
  en: "@a@bYou can continue your adventure simply by opening your Nintendo DS Series System again, but be careful not to run out of batteries in the meantime.\n@c0@"
  es: "@a@bPodrás continuar tu aventura con tan solo volver a abrir la consola Nintendo DS, pero ten cuidado podrías quedarte sin batería entre tanto.\n@c0@"
  fr: "@a@bPour reprendre votre aventure, rouvrez votre console de la série Nintendo DS, mais veillez à ne pas tomber à court de batterie entre-temps.\n@c0@"
  it: "@a@bPotrai riprendere la partita aprendo nuovamente la console, ma fai attenzione che la batteria non si esaurisca mentre non stai giocando.\n@c0@"
  ja: "@a@bスリープモードからは　本体を\nひらくだけで　冒険を再開できますが\n電池残量には　気をつけましょう。\n@c0@"
