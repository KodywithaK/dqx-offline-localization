22:
  de: "@a@bVerlasse den Level oder schließe deinen DS und wechsle in den Standby-Modus ⓚⓛ aber stelle erst sicher, dass du genug Batterie übrig hast.\n@c0@"
  en: "@a@bYou can leave the dungeon to do so, or close your Nintendo DS Series System to put it into Sleep Mode. Make sure you have enough battery power first.\n@c0@"
  es: "@a@bPara hacerlo, debes salir de la mazmorra o cerrar la consola Nintendo DS para que entre en modo de espera. Pero, antes, asegúrate de que te queda batería.\n@c0@"
  fr: "@a@bQuittez le donjon ou fermez votre console de la\r\nsérie Nintendo DS pour la mettre en mode veille. Avant, vérifiez qu'il vous reste assez de batterie.\n@c0@"
  it: "@a@bPer farlo, esci dalle segrete, o chiudi la tua console della serie Nintendo DS ed entra in modalità riposo, dopo aver verificato il livello di carica della batteria.\n@c0@"
  ja: "@a@b外に出てから中断するか　電池残量に\n気をつけて　ＤＳシリーズ本体を閉じ\nスリープモードにしてください。\n@c0@"
23:
  de: "@a@bHier kannst du kein Schnellsp.-Tagebuch anlegen. Speichere in einer Kirche oder verlasse die Stadt und führe dann eine Schnellspeicherung aus.\n@c0@"
  en: "@a@bYou can't make a quick save log here.\nPlease either save in a church, or leave town and quick save there.\n@c0@"
  es: "@a@bAquí no se puede crear un registro de aventuras rápido. Guarda en una iglesia, o sal de la ciudad y créalo allí.\n@c0@"
  fr: "@a@bVous ne pouvez pas créer de sauvegarde rapide ici. Veuillez sauvegarder dans une église ou sortir de la ville pour créer une sauvegarde rapide.\n@c0@"
  it: "@a@bNon puoi eseguire un salvataggio rapido in questo punto. Salva in una chiesa, oppure esci dalla città ed effettua un salvataggio rapido.\n@c0@"
  ja: "@a@bここでは　冒険を中断できません。\n教会で　おいのりするか\n外に出てから　中断してください。\n@c0@"
