93:
  de: "@aLudwig@bJetzt muss ich nur noch einen Weg finden, an dem Wachmann am Gebetsraum vorbeizukommen.\n@c0@"
  en: "@aPankraz@bNow I just need to think of a way to get past the prayer room guard.\n@c0@"
  es: "@aTeudis@bAhora tengo que buscar el modo de superar al guardia de la sala de oración.\n@c0@"
