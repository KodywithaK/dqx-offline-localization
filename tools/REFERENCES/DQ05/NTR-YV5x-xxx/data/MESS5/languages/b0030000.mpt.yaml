  de: "@aLudwig@bKommt, Remembrandt! Es wird Zeit! Wir müssen schnell zu Magda, bevor der Wachmann wieder da ist!\n@c0@"
  en: "@aPankraz@bCome along, Remembrandt! It's time! We must go to Mada before the guard returns!\n@c0@"
