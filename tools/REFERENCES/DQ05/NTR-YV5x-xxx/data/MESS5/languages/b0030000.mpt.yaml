  it: "@aRussel@bIo... Io non so proprio cosa dire...\nMi sembra impossibile che %H0860%X%A0110%Xti sia dato%Z%B0110%Xti sia data%Z%Y%R0000%Xvi siate date%Yvi siate dati%Z%Z tanto da fare per una persona che %H0860%Xconosci%Yconoscete%Z appena...\n@c0@"
  ja: "@a@bパパス「なんということだ……。\n\tなぜ　そこまで\n\tしてくださるのだ。\n@c0@"
96:
  de: "@aLudwig@b... Aber da Ihr eh schon alles in die Wege geleitet habt, darf ich mir diese Gelegenheit auf keinen Fall entgehen lassen.\n@c0@"
  en: "@aPankraz@b............\r\nAnyway, seeing as you've arranged everything,\r\nI daren't waste the opportunity.\n@c0@"
  es: "@aTeudis@b...\r\nBueno, como veo que lo has dispuesto todo, no pienso desaprovechar la ocasión.\n@c0@"
