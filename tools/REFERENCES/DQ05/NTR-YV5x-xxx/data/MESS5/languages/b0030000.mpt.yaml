105:
  de: "@a@b*: Ich spüre, wie die Macht Nadirias von Tag zu Tag stärker wird. Es brodelt förmlich in der Unterwelt.\n@c0@"
  en: "@a@b*: Day by day, I feel the evil of Nadiria breeding. Fuelling its own expansion.\n@c0@"
  es: "@a@b*: Día a día siento crecer la maldad de Nadiria. Alimenta su propia expansión.\n@c0@"
  fr: "@a@b*ⓢ Jour après jour, je sens croître le mal qui émane de Nadiria. Il alimente son propre développement.\n@c0@"
  it: "@a@b*: Ogni giorno che passa, il male che proviene da Nadiria cresce sempre di più. È come se si autoalimentasse. Sì, lo percepisco con chiarezza...\n@c0@"
  ja: "@a@b＊「日に　日に　邪悪な意思が\n\t魔界で　大きく　育っているのを\n\t感じます。\n@c0@"
106:
  de: "@a@b*: Unsere Arbeit ist noch nicht zu Ende. Steile Höh hat noch eine wichtige Rolle zu spielen.\n@c0@"
  en: "@a@b*: Our work is not yet done. We Loftinians still have our role to play.\n@c0@"
  es: "@a@b*: Nuestro trabajo aún no ha acabado. Cumbre Excelsa aún tiene mucho que decir.\n@c0@"
  fr: "@a@b*ⓢ Notre travail n'est pas encore achevé.\nNous, Alticimiens, avons encore un rôle à jouer.\n@c0@"
  it: "@a@b*: Il nostro lavoro non può considerarsi concluso.\nNoi abitanti di Picco Maximo abbiamo ancora molto da fare.\n@c0@"
  ja: "@a@b＊「まだまだ　われわれ\n\tエルヘブンの民の　つとめは\n\t終わっていないのです。\n@c0@"
107:
  de: "@a@b*: Wir haben gar nichts gegen den zukünftigen König von Humburg.\n@c0@"
  en: "@a@b*: We have no grievance with the future\r\nKing of Gotha.\n@c0@"
  es: "@a@b*: No tenemos querellas contra el futuro rey de Pankraz.\n@c0@"
  fr: "@a@b*ⓢ Nous n'avons aucun grief à l'encontre du futur roi de Gotha.\n@c0@"
  it: "@a@b*: Non proviamo odio verso il futuro Re di Denim.\nNon abbiamo alcun rancore personale verso di lui.\n@c0@"
  ja: "@a@b＊「グランバニアの　次なる国王\n\tパパスどのに　不満があるわけでは\n\tありません。\n@c0@"
108:
  de: "@a@b*: Aber falls er Magdalena zu seiner Königin macht, wird sie sicher nie mehr nach Steile Höh zurückkehren.\n@c0@"
  en: "@a@b*: It is merely that if he were to take Madalena\r\nas his queen, she would surely not return to\r\nLofty Peak again.\n@c0@"
  es: "@a@b*: Solo que si toma a Perséfone como reina, seguramente ya no regrese nunca a Cumbre Excelsa.\n@c0@"
  fr: "@a@b*ⓢ C'est juste que s'il devait emmener Magdalena pour en faire sa reine, elle ne reviendrait sans doute jamais à Haute-Cime.\n@c0@"
  it: "@a@b*: Ci preoccupiamo solo del fatto che, se dovesse prendere in moglie Maddalena, ella lascerebbe per sempre Picco Maximo.\n@c0@"
  ja: "@a@b＊「しかし　王妃とも　なれば\n\tマーサさまは　このエルヘブンに\n\tもどって来られなくなるでしょう。\n@c0@"
109:
  de: "@a@b*: Magdalenas Macht ist eine Bedrohung für die Monster der Unterwelt. Sie fürchten sich vor ihr.\n@c0@"
  en: "@a@b*: Madalena's power threatens the monsters of the underworld. For that very reason, she is in danger from them.\n@c0@"
  es: "@a@b*: El poder de Perséfone es una amenaza para los monstruos del inframundo. Por ese motivo corre peligro de ser atacada.\n@c0@"
  fr: "@a@b*ⓢ Les monstres du monde souterrain redoutent le pouvoir de Magdalena. C'est pourquoi ils représentent pour elle une menace.\n@c0@"
  it: "@a@b*: Il potere di Maddalena è un ostacolo insuperabile per i mostri che vivono nel Regno degli Inferi, e per questo motivo ella è costantemente in pericolo...\n@c0@"
  ja: "@a@b＊「マーサさまの　チカラは　やがて\n\t魔を　おびやかし……　だからこそ\n\t魔に　ねらわれるはず。\n@c0@"
110:
  de: "@a@b*: Aus diesem Grund ist es unsere Pflicht, sie zu beschützen. Ihr darf nichts geschehen.\n@c0@"
  en: "@a@b*: It is our duty to protect her.\nTo see that no harm comes to her.\n@c0@"
  es: "@a@b*: Es nuestro deber protegerla.\r\nDebemos evitar que le suceda algo.\n@c0@"
  fr: "@a@b*ⓢ Il est de notre devoir de la protéger. De veiller à ce qu'il ne lui soit fait aucun mal.\n@c0@"
  it: "@a@b*: Il nostro dovere è di proteggere Maddalena e fare in modo che niente e nessuno possa nuocerle.\n@c0@"
  ja: "@a@b＊「われわれのチカラで\n\tマーサさまを　お守りしなくては。\n@c0@"
111:
  de: "@a@b*: All jene von uns, die von der Göttin auserwählt sind, dürfen sich nicht den Freuden eines normalen Lebens hingeben.\n@c0@"
  en: "@a@b*: For those of us chosen by the Goddess, our destiny does not allow us to enjoy the pleasures\r\nof ordinary beings.\n@c0@"
  es: "@a@b*: A los elegidos por la Diosa el destino no nos permite disfrutar de los placeres de los seres ordinarios.\n@c0@"
  fr: "@a@b*ⓢ La destinée de ceux d'entre nous qui ont été choisis par la Déesse ne nous permet pas d'apprécier les joies des êtres ordinaires.\n@c0@"
  it: "@a@b*: Chi è stato scelto dalla dea per compiere un dovere superiore non può indulgere ai piaceri e alle passioni che sono concesse ai comuni esseri umani.\n@c0@"
  ja: "@a@b＊「神に　選ばれし者は\n\t人なみの暮らし　人なみの幸せは\n\tのぞめないのが　運命……。\n@c0@"
112:
  de: "@a@b*: Magdalena weiß das, genau wie jeder andere hier.\n@c0@"
  en: "@a@b*: Madalena knows this as well as any of us.\n@c0@"
  es: "@a@b*: Perséfone lo sabe tan bien como todos nosotros.\n@c0@"
  fr: "@a@b*ⓢ Magdalena le sait aussi bien que n'importe\nlequel d'entre nous.\n@c0@"
  it: "@a@b*: Maddalena ne è ben consapevole.\n@c0@"
  ja: "@a@b＊「それは　マーサさまも\n\tよく　お分かりのはず\n\tなのですが。\n@c0@"
113:
  de: "@a@b*: Das ist Magdalenas Gebetsraum.\n@c0@"
  en: "@a@b*: This is Madalena's prayer room.\n@c0@"
  es: "@a@b*: Esta es la sala de oración de Perséfone.\n@c0@"
  fr: "@a@b*ⓢ Ceci est la salle de prière de Magdalena.\n@c0@"
  it: "@a@b*: Questa è la sala delle preghiere di Maddalena.\n@c0@"
  ja: "@a@b＊「ここは　マーサさまの\n\t祈りの部屋。\n@c0@"
114:
  de: "@a@b*: Ohne Einverständnis der Weisen ist Fremden der Zutritt strengstens untersagt!\n@c0@"
  en: "@a@b*: Without the consent of the Elders, strangers are not permitted inside.\n@c0@"
  es: "@a@b*: No se permite entrar a extraños sin el consentimiento de los ancianos.\n@c0@"
  fr: "@a@b*ⓢ Sans le consentement des Anciens, aucune personne étrangère n'est autorisée à y pénétrer.\n@c0@"
  it: "@a@b*: A nessuno è consentito entrare senza l'esplicito consenso dei Quattro Anziani.\n@c0@"
  ja: "@a@b＊「長老たちの　許可なく\n\t旅の者を　通すわけには\n\tいかぬ。\n@c0@"
115:
  de: "@a@b*: D-Das ist ja ein T&T-Ticket! Ist das wirklich echt, oder träume ich bloß?\n@c0@"
  en: "@a@b*: Th-That's a T 'n' T ticket!\nIs it really real, or am I dreaming?\n@c0@"
  es: "@a@b*: ¡E-es un boleto de T y T!\r\n¿Es real o estoy soñando?\n@c0@"
  fr: "@a@b*ⓢ C'est... C'est un ticket de TNTⓠ\nSerais-je en train de rêverⓡ\n@c0@"
  it: "@a@b*: Ma quello... Quello è un biglietto della Sorte!\nNon ci posso credere!\nPer favore, %H0860%Xfammelo%Yfatemelo%Z vedere da vicino!\n@c0@"
  ja: "@a@b＊「そ　それは　すごろく券！？\n\tううっ　夢にまで　見た\n\tウワサの……！\n@c0@"
116:
  de: "@a@b%0%a000090 schiebt dem Wachmann das Ticket zu.\n@c0@"
  en: "@a@b%0%a000090 slips the ticket into the guard's hand.\n@c0@"
  es: "@a@b%0%a000090 deposita el boleto en la mano del guardia.\n@c0@"
  fr: "@a@b%0%a000090 glisse le ticket dans la main du garde.\n@c0@"
  it: "@a@b%0%a000090 porge il biglietto della Sorte alla guardia.\n@c0@"
  ja: "@a@b%a000090は　兵士の手に\nすごろく券を　そっと\nにぎらせた。\n@c0@"
117:
  de: "@a@b*: Ähem! Ich, äh... Ja! Natürlich! Ich muss etwas... Wichtiges mit den Weisen besprechen.\n@c0@"
  en: "@a@b*: Ahem! I, er... Yes! Of course! I have some important, er...information to discuss with the Elders.\n@c0@"
  es: "@a@b*: ¡Ejem! Yo, eh... ¡Sí! ¡Por supuesto! Tengo, er... información importante que discutir con los ancianos.\n@c0@"
  fr: "@a@b*ⓢ Humⓠ Je, euh... Ouiⓠ Bien sûrⓠ J'ai une, euh... une information importante à communiquer aux Anciens.\n@c0@"
  it: "@a@b*: Oh! Ehm... Ecco, io... Io devo andare urgentemente dai Quattro Anziani per discutere di certe importantissime questioni... Ehm, sì... Proprio così...\n@c0@"
  ja: "@a@b＊「ご　ごほん！　あ～　私は\n\tちょっと　長老さまに\n\tお話が……。\n@c0@"
118:
  de: "@a@b*: Ich, äh... bin eine Weile unterwegs. Macht's gut!\n@c0@"
  en: "@a@b*: I'll, er...be back later.\nFarewell!\n@c0@"
  es: "@a@b*: Er... volveré más tarde.\r\n¡Adiós!\n@c0@"
  fr: "@a@b*ⓢ Je, euh... Je reviendrai plus tard.\nAu revoirⓠ\n@c0@"
  it: "@a@b*: Se qualcuno passasse a cercarmi, %H0860%Xdigli%Yditegli%Z che torno subito!\n@c0@"
  ja: "@a@b＊「では　これにてっ！\n@c0@"
119:
  de: "@aMagda@bWie ungewöhnlich. Der Wachmann lässt sonst nie Fremde zu mir.\n@c0@"
  en: "@aMada@bHow unusual. The guard never allows strangers\r\nto pass.\n@c0@"
  es: "@aPerséfone@bQué raro. El guardia nunca permite entrar a extraños.\n@c0@"
  fr: "@aMagda@bComme c'est étrange. Le garde ne laisse jamais passer les étrangers.\n@c0@"
  it: "@aMada@bChe strano...\nLa guardia non aveva mai consentito a nessun forestiero di entrare qui...\n@c0@"
  ja: "@a@bマーサ「あら　兵士が\n\tお客さまを　入れるなんて\n\tめずらしいわね。\n@c0@"
120:
  de: "@aMagda@bVielleicht hat er sich in den tiefen Weiten Eurer Augen verloren?\n@c0@"
  en: "@aMada@bPerhaps he was lost in the great depths of\r\nyour eyes?\n@c0@"
  es: "@aPerséfone@bQuizá se perdiera en las profundidades de tus ojos...\n@c0@"
  fr: "@aMagda@bPeut-être s'est-il perdu dans les profondeurs\nde votre regardⓡ\n@c0@"
  it: "@aMada@bForse ha letto nei tuoi occhi profondi e sinceri che non hai intenzione di farmi del male...\n@c0@"
  ja: "@a@bマーサ「それとも　あなたの\n\tその目に　心を\n\tうばわれたのかしら？\n@c0@"
121:
  de: "@aMagda@bWo kommt Ihr her, mein Freund? Ich spüre allerlei merkwürdige Dinge, wenn ich Euch ansehe...\n@c0@"
  en: "@aMada@bWhere have you come from, friend?\nI sense something so strange in you...\n@c0@"
  es: "@aPerséfone@b¿De dónde vienes, %A0110%Xamigo%Z%B0110%Xamiga%Z?\nSiento algo muy extraño en ti...\n@c0@"
  fr: "@aMagda@bD'où venez-vous, mon amiⓡ\nJe sens en vous quelque chose d'étrange...\n@c0@"
  it: "@aMada@bDa dove vieni, %A0110%Xamico viaggiatore%Z%B0110%Xamica viaggiatrice%Z?\nChe sensazione bizzarra... Percepisco in te qualcosa di indefinibile, di familiare e ignoto al tempo stesso...\n@c0@"
  ja: "@a@bマーサ「あなた　どこから来たの？\n\tなんだか　ふしぎな感じが\n\tするわね……。\n@c0@"
122:
  de: "@a@b*: (Schlürf)\nIch liebe Magdalena! Sie ist einfach schlammtastisch!\n@c0@"
  en: "@a@b*: (slurp)\nI love Madalena! She makes me go all gooey!\n@c0@"
  es: "@a@b*: (slurp)\r\n¡Amglop a Perséfone! ¡Me pone viscoso!\n@c0@"
  fr: "@a@b*ⓢ (slurp)\nJ'adore Magdalenaⓠ Elle me rend tout gluantⓠ\n@c0@"
  it: "@a@b*: Slurp!\nHo un debole per Maddalena!\nMi fa venire le farfalle nello stomaco!\n@c0@"
  ja: "@a@b＊「ピキー！\n\tマーサさま　大好き。\n@c0@"
123:
  de: "@aRemembrandt@bNein! Bitte keine Störung jetzt! Ihr unterbrecht den Fluss.\n㈡\nEin Porträt für einen Blaublüter anzufertigen und dann noch in Fingernagelgröße ⓚⓛ das ist wahrlich keine leichte Aufgabe!\n@c0@"
  en: "@aRemembrandt@bNo! Don't disturb me now! You'll interrupt the flow.\r\nDoing a portrait for blue blood that's the size of the nail on your little pinkie is no easy task!\n@c0@"
  es: "@aPablo Nicasso@b¡No! ¡No me molestes ahora! Romperás la inspiración.\r\n¡Hacer un retrato del tamaño de una uña para gente de sangre azul no es moco de pavo!\n@c0@"
  fr: "@aYvan Gogh@bNonⓠ Ne me dérangez pasⓠ\nVous allez couper mon inspiration.\n㈡\nFaire pour une personne de sang bleu un\nportrait de la taille de l'ongle du petit doigt,\nce n'est pas tout roseⓠ\n@c0@"
  it: "@aLeonard@bMaremma silenziosa, 'un mi %H0860%Xdisturba'%Ydisturbate%Z!\nDipinge' un ritratto piccino huanto una briciola di pane 'unn è facile nemmeno pe' un genio come me!\n@c0@"
  ja: "@a@bマティース「悪いが　話しかけないでくれ。\n\tロケットに入れるような　小さい絵は\n\t色づけが　むずかしいんだよ。\n@c0@"
124:
  de: "@aLudwig@bOh, Ihr seid es. Danke noch einmal für Eure Hilfe, das Bild für das Medaillon wird soeben gemalt.\n@c0@"
  en: "@aPankraz@bOh, it's you again. Thanks to your help, I'm going to have a picture of Mada for the locket.\n@c0@"
  es: "@aTeudis@b¡Ah!, eres tú. Gracias por tu ayuda, voy a poner un retrato de Perséfone en el camafeo.\n@c0@"
  fr: "@aPetros@bOh, c'est encore vous. Grâce à votre aide,\r\nje vais avoir un portrait de Magdalena\r\nà placer dans le pendentif.\n@c0@"
  it: "@aRussel@bOh, %H0860%Xsei tu%Ysiete voi%Z!\nGrazie al %H0860%Xtuo%Yvostro%Z aiuto, potrò avere il ritratto di Mada per il mio medaglione!\n@c0@"
  ja: "@a@bパパス「おお　あなたは！\n\tおかげで　このロケットペンダントに\n\t絵を　入れることができます。\n@c0@"
125:
  de: "@aLudwig@bDummerweise wird es noch eine Weile dauern. Warum kommt Ihr nicht später wieder?\n@c0@"
  en: "@aPankraz@bBut I'm afraid it's going to take a while.\nWould you mind coming back later?\n@c0@"
  es: "@aTeudis@bPero me temo que llevará un tiempo.\r\n¿Te importa volver más tarde?\n@c0@"
  fr: "@aPetros@bMais je crains que cela ne prenne du temps.\nPourriez-vous revenir plus tardⓡ\n@c0@"
  it: "@aRussel@bPurtroppo, ci vorrà ancora un po' di tempo.\n%H0860%XTi%YVi%Z dispiacerebbe tornare più tardi?\n@c0@"
  ja: "@a@bパパス「申し訳ないが　少し時間が\n\tかかるので　いったん帰ってから\n\tまた来てくれないだろうか？\n@c0@"
126:
  de: "@aLudwig@bKeine Sorge. Ich werde Euch die Feder und Tinte natürlich wiedergeben, wenn das Bild fertig ist.\n@c0@"
  en: "@aPankraz@bDon't worry. I promise to return the quill and the ink as soon as the job is done.\n@c0@"
  es: "@aTeudis@bNo te preocupes. Te prometo devolverte la pluma y la tinta en cuanto esté acabado.\n@c0@"
  fr: "@aPetros@bNe vous inquiétez pas. Je vous promets\r\nde vous rendre la plume et l'encre dès\r\nque le travail sera terminé.\n@c0@"
  it: "@aRussel@bNon %H0860%Xpreoccuparti: ti%Ypreoccupatevi: vi%Z restituirò la penna fatata e il magicalamaio non appena il ritratto sarà terminato.\n@c0@"
  ja: "@a@bパパス「お借りした道具は\n\t絵が完成したら　すぐに\n\tお返しします。\n@c0@"
127:
  de: "@aMagda@bIch bin so beschämt. Aber Ludwig war hartnäckig, also...\n@c0@"
  en: "@aMada@bI'm so embarrassed.\nBut Pankraz insisted, so...\n@c0@"
  es: "@aPerséfone@bMe da mucha vergüenza.\r\nPero Teudis insistió, así que...\n@c0@"
  fr: "@aMagda@bJe suis si gênée.\nMais Petros a tellement insisté, alors...\n@c0@"
  it: "@aMada@bMi sento in imbarazzo...\nPerò Russel ha insistito tanto...\n@c0@"
  ja: "@a@bマーサ「なんだか　はずかしいわね。\n\tでも　パパスさんが\n\tどうしてもって……。\n@c0@"
128:
  de: "@aMagda@bNoch nie ist mir jemand so nah gekommen.\n@c0@"
  en: "@aMada@bNo one's ever been so close to me before.\n@c0@"
  es: "@aPerséfone@bNunca nadie estuvo tan cerca de mí.\n@c0@"
  fr: "@aMagda@bPersonne n'a jamais été aussi proche\r\nde moi, avant lui.\n@c0@"
  it: "@aMada@bNessun uomo mi era mai stato tanto vicino prima d'ora...\n@c0@"
  ja: "@a@bマーサ「私に　こんなに\n\tまっすぐ　近づいて来る人は\n\tだれも　いなかったわ。\n@c0@"
129:
  de: "@aMagda@bDie meisten Leute fürchten sich vor meiner Macht. Die Macht, die mir von der Göttin verliehen wurde.\n@c0@"
  en: "@aMada@bMost people are afraid of my power. The power bestowed upon me by the Goddess.\n@c0@"
  es: "@aPerséfone@bNormalmente la gente teme mi poder. El poder que me otorgó la Diosa.\n@c0@"
  fr: "@aMagda@bLa plupart des gens ont peur de mon pouvoir.\r\nDu pouvoir que m'a accordé la Déesse.\n@c0@"
  it: "@aMada@bLa maggior parte delle persone ha paura del potere che la dea mi ha donato.\n@c0@"
  ja: "@a@bマーサ「神にさずかった　このチカラが\n\t人びとを　おそれさせるから……。\n@c0@"
130:
  de: "@a@b*: (Schlürf)\nIch liebe Magdalena! Sie ist einfach schlammtastisch!\n@c0@"
  en: "@a@b*: (slurp)\nI love Madalena! She makes me go all gooey!\n@c0@"
  es: "@a@b*: (slurp)\r\n¡Amglop a Perséfone! ¡Me pone viscoso!\n@c0@"
  fr: "@a@b*ⓢ (slurp)\nJ'adore Magdalenaⓠ Elle me rend tout gluantⓠ\n@c0@"
  it: "@a@b*: Slurp!\nHo un debole per Maddalena! Mi fa venire le farfalle nello stomaco!\n@c0@"
  ja: "@a@b＊「ピキー！\n\tマーサさま　大好き。\n@c0@"
131:
  de: "@aRemembrandt@bAh, Ihr möchtet wohl Eure Feder und Tinte wiederhaben?\n@c0@"
  en: "@aRemembrandt@bAh, you've come for your quill and ink?\n@c0@"
  es: "@aPablo Nicasso@b¡Ah!, ¿vienes a por la pluma y la tinta?\n@c0@"
  fr: "@aYvan Gogh@bAh, vous venez récupérer votre plume et votre encreⓡ\n@c0@"
  it: "@aLeonard@b%H0860%XSei%YSiete%Z huì per la penna fatata e i'mmagihalamaio?\n@c0@"
  ja: "@a@bマティース「ああ　もどって\n\t来てくれたんだね。\n@c0@"
132:
  de: "@aRemembrandt@bHier, bitte. Wirklich ausgezeichnetes Arbeitsmaterial. Vielen Dank noch mal.\n@c0@"
  en: "@aRemembrandt@bHere you are. They're really blue ribbon materials. Thank you very much.\n@c0@"
  es: "@aPablo Nicasso@bTen. Este material me pone verde de envidia. Muchas gracias.\n@c0@"
  fr: "@aYvan Gogh@bTenez, les voici. C'est vraiment du matériel de première qualité. Merci infiniment.\n@c0@"
  it: "@aLeonard@bEcco, %H0860%Xprendili%Yprendeteli%Z pure.\nQuell'oggetti son davvero portentosi!\nGrazie mille per avermi dato l'opportunità d'usarli!\n@c0@"
  ja: "@a@bマティース「大事な　道具を\n\tありがとう。　たしかに\n\t返したよ。\n@c0@"
133:
  de: "@a@b%0%a000090 legt die Feenfeder und das Tintenhorn vorsichtig wieder in den Beutel.\n@c0@"
  en: "@a@b%0%a000090 puts the faerie quill and the tusk-tusk tusk inkwell carefully back into the bag.\n@c0@"
  es: "@a@b%0%a000090 guarda con cuidado la pluma de hada y la tinta de tantor en la bolsa.\n@c0@"
  fr: "@a@b%0%a000090 remet soigneusement la plume féerique et l'encrier d'ivoire dans le sac.\n@c0@"
  it: "@a@b%0%a000090 ripone la penna fatata e il magicalamaio nella borsa.\n@c0@"
  ja: "@a@b%a000090は　妖精の羽ペンと\nパオームのインクを　大事に\n%a001400に　しまった！\n@c0@"
134:
  de: "@aRemembrandt@bAch ja, Prinz Ludwig hat Euch eine Nachricht hinterlassen...\n@c0@"
  en: "@aRemembrandt@bOh yes, Prince Pankraz left a message for you...\n@c0@"
  es: "@aPablo Nicasso@b¡Oh!, sí, el príncipe Teudis te dejó un mensaje...\n@c0@"
  fr: "@aYvan Gogh@bOh, j'allais oublier. Le prince Petros a laissé un message à votre intention...\n@c0@"
  it: "@aLeonard@bAh, quasi me ne dimenticavo...\nI'pprincipe Russel ha lasciato un messaggio per %H0860%Xte%Yvoi%Z...\n@c0@"
  ja: "@a@bマティース「そうそう。\n\tパパスから　伝言だ。\n@c0@"
135:
  de: "@a@bⓞNochmals vielen Dank für Eure Hilfe. Wenn wir uns das nächste Mal begegnen, werde ich Euch reich für Eure Güte belohnen. Darauf habt Ihr mein Wort.ⓟ\n@c0@"
  en: "@a@bⓗThank you again for helping me. I shall repay you in full the next time we meet. I stake my life on it.ⓘ\n@c0@"
  es: "@a@bⓕGracias de nuevo por ayudarme. Te compensaré la próxima vez que nos veamos. Te doy mi palabra de honorⓖ.\n@c0@"
  fr: "@a@bⓥMerci encore de m'avoir aidé. Je vous le rendrai au centuple la prochaine fois que nous nous verrons.\nJe le jure sur ma vie.ⓦ\n@c0@"
  it: "@a@bⓕGrazie di tutto. La prossima volta che ci incontreremo, saprò sdebitarmi per l'aiuto che mi %H0860%Xhai%Yavete%Z dato.ⓖ\n@c0@"
  ja: "@a@b“助けてくれて　本当に　ありがとう。\n　次に会うときには　この命にかえても\n　きっと　お礼を　するから”\n@c0@"
136:
  de: "@aRemembrandt@bEr ist ganz rot geworden, als er das Porträt sah. Allerdings sind er und Magdalena bereits aufgebrochen.\n@c0@"
  en: "@aRemembrandt@bHe was tickled pink with the portrait.\nBut he and Madalena have left now.\n@c0@"
  es: "@aPablo Nicasso@bEnrojeció al ver el retrato.\r\nPero él y Perséfone se han marchado.\n@c0@"
  fr: "@aYvan Gogh@bIl était ravi quand il a vu le portrait. Mais lui et Magdalena sont partis, à présent.\n@c0@"
  it: "@aLeonard@bI'pprincipe l'è rimasto parecchio soddisfatto del ritratto, ma parecchio tanto!\nL'ha preso e se n'è andato via con Maddalena.\n@c0@"
  ja: "@a@bマティース「だってさ。\n\t完成した絵を　うれしそうに\n\t持っていったぜ。\n@c0@"
137:
  de: "@aRemembrandt@bWahrscheinlich schippern sie gerade auf den weiten blauen Gewässern des Östlichen Meeres...\n@c0@"
  en: "@aRemembrandt@bI should think they'll just be setting off over the deep blue waters of the Eastern Sea about now...\n@c0@"
  es: "@aPablo Nicasso@bSupongo que a estas alturas navegarán por las aguas azules del Mar Oriental...\n@c0@"
  fr: "@aYvan Gogh@bÀ cette heure, je dirais qu'ils doivent se diriger\r\ntout droit vers les eaux bleues de la mer Orientale.\n@c0@"
  it: "@aLeonard@bCredo avessero intenzione d'imbarcarsi pe' attraversa' l'Oceano Orientale...\n@c0@"
  ja: "@a@bマティース「今ごろ　ふたりは\n\t東の海に　出る頃かな……。\n@c0@"
138:
  de: "@a@b*: Magdalena hat mir etwas Schleimtastisches erzählt!\n@c0@"
  en: "@a@b*: Madalena told me something good!\n@c0@"
  es: "@a@b*: ¡Perséfone me dijo alglop!\n@c0@"
  fr: "@a@b*ⓢ Magdalena m'a dit quelque chose de sluperⓠ\n@c0@"
  it: "@a@b*: Slurp!\nMaddalena mi ha chiesto di %H0860%Xriferirti%Yriferirvi%Z una cosa...\n@c0@"
  ja: "@a@b＊「ピキー！\n\tマーサさま　言ってたよ！\n@c0@"
139:
  de: "@a@b*: Sie sagte, dass sie Euch bestimmt noch mal wiedersehen würde. Und sie lässt ihren Dank ausrichten.\n@c0@"
  en: "@a@b*: She said she was sure she'd slurp into you again. And she said to say thanks too.\n@c0@"
  es: "@a@b*: Dice que le englabtaría verte otra vez. Y que glubchas gracias.\n@c0@"
  fr: "@a@b*ⓢ Elle m'a dit qu'elle était sûre de vous revoir un jour. Et elle m'a aussi demandé de vous dire merci.\n@c0@"
  it: "@a@b*: Ha detto di essere certa che slurprima o slurpoi vi incontrerete di nuovo! Ah, e %H0860%Xti%Yvi%Z ringrazia tanto per tutto ciò che %H0860%Xhai%Yavete%Z fatto per lei!\n@c0@"
  ja: "@a@b＊「キミとは　きっと　また\n\t会える気が　するって！\n\tありがとうって。\n@c0@"
