  ja: "@a@bパパス「なんと！　妖精の羽ペンと\n\tパオームのインクを\n\t持ってきてくださったのか！\n@c0@"
91:
  de: "@aLudwig@bVielen Dank! Und entschuldigt, dass ich Euch die Sachen einfach so aus den Händen reiße!\n@c0@"
  en: "@aPankraz@bThank you. And excuse me if I don't waste any time taking them off your hands!\n@c0@"
  es: "@aTeudis@bGracias. ¡Y discúlpame si te los quito ahora mismo de las manos!\n@c0@"
  fr: "@aPetros@bMerci. Et pardonnez-moi de vous les arracher si vite des mainsⓠ\n@c0@"
  it: "@aRussel@b%H0860%XTi%YVi%Z ringrazio di cuore!\nMi %H0860%Xdaresti%Ydareste%Z gli oggetti, per favore?\n@c0@"
  ja: "@a@bパパス「ありがたい！\n\tさっそく　お借りしますぞ！\n@c0@"
92:
  de: "@a@b%0%a000090 gibt Ludwig die Feenfeder und das Tintenhorn.\n@c0@"
  en: "@a@b%0%a000090 gives the faerie quill and the\ntusk-tusk tusk inkwell to Pankraz.\n@c0@"
  es: "@a@b%0%a000090 da a Teudis la pluma de hada y la tinta de tantor.\n@c0@"
  fr: "@a@b%0%a000090 donne la plume féerique et l'encrier d'ivoire à Petros.\n@c0@"
  it: "@a@b%0%a000090 dà a Russel la penna fatata e il magicalamaio.\n@c0@"
