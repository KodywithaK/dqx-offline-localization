  en: "@aPankraz@bWhat? The guard's not there now?\n@c0@"
  es: "@aTeudis@b¿Cómo? ¿Que el guardia no está ahora?\n@c0@"
  fr: "@aPetros@bCommentⓡ Le garde n'est pas devant la porte\nen ce momentⓡ\n@c0@"
  it: "@aRussel@bChe cosa?!\nLa guardia non è lì in questo momento?!\n@c0@"
  ja: "@a@bパパス「え？　番人の兵士は\n\t出かけてるって？\n@c0@"
95:
  de: "@aLudwig@bIch... Ich weiß gar nicht, was ich sagen soll. Ich bin sprachlos, dass Ihr so viel für mich tut, obwohl Ihr mich ja kaum kennt.\n@c0@"
  en: "@aPankraz@bI... I don't know what to say. I'm stunned that you would do so much for someone you barely know.\n@c0@"
  es: "@aTeudis@bN-no sé qué decir. Me asombra que hagas tanto por alguien a quien apenas conoces.\n@c0@"
