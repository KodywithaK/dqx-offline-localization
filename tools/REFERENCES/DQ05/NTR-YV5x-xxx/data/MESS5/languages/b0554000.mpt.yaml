0:
  de: "@a%0%a001240@bWas, glaubst du, ist das für ein Ort, Papa?\n@c0@"
  en: "@a%0%a001240@bWhat do you suppose this place is, Dad?\n@c0@"
  es: "@a%0%a001240@b¿Qué crees que será este sitio, papá?\n@c0@"
  fr: "@a%0%a001240@bPapa, dans quel genre d'endroit on est, à ton avisⓡ\n@c0@"
  it: "@a%0%a001240@bPapà, che cos'è questo posto?\n@c0@"
  ja: "@a@b%a001240「ここって　なんだろうね？\n\tお父さん。\n@c0@"
1:
  de: "@a%0%a001250@bIch mag diesen Ort nicht. Es ist unheimlich hier.\n@c0@"
  en: "@a%0%a001250@bI don't like this place. It's scary.\n@c0@"
  es: "@a%0%a001250@bNo me gusta este sitio. ¡Me da miedo!\n@c0@"
  fr: "@a%0%a001250@bJe n'aime pas cet endroit. C'est sinistre.\n@c0@"
  it: "@a%0%a001250@bPapà, ho paura...\n@c0@"
  ja: "@a@b%a001250「わたし　ここ　イヤ……。\n\tなんだか　こわいの。\n@c0@"
2:
  de: "@aSancho@bHmmm... Iss weiß nisst, aber... Glaubst du, da drin ist etwas verschlossen, Chico?\n@c0@"
  en: "@aSancho@bHmmm... I no esure, but... You theenk maybe ees estopping esometheeng from coming out?\n@c0@"
  es: "@aSancho@bMmmm... No estoy muy seguro, pero, ¡híjole! ¿No sellará algo en su interior?\n@c0@"
  fr: "@aSancho@bMmm... Je ne suis pas s-sûr, mais... tu ne c-crois\npas que ça empêche peut-être quelque chose de\ns-s-sortirⓡ\n@c0@"
  it: "@aSancho@bUhm...\nChico, ho una muy sensación estrana...\n¿Avanziamo con cautelas, sì?\n@c0@"
  ja: "@a@bサンチョ「ふむ…　あれはたしか……。\n\tなにやら　封印してあるのかも\n\t知れませんが　よく分かりませんね。\n@c0@"
3:
  de: "@aNera@bDu bist also auch neugierig, ja? Ich denke schon eine ganze Weile über diesen Tiegel nach.\n@c0@"
  en: "@aNera@bSo you're curious too? I've been wondering about that jar for a while now myself.\n@c0@"
  es: "@aNera@b¿A ti también te causa curiosità? Yo llevo un tiempo dándole vueltas a lo de la tinaja.\n@c0@"
  fr: "@aNera@bToi aussi, ça t'intrigueⓡ Moi, ça fait un moment que je me pose des questions sur cette amphore.\n@c0@"
  it: "@aNera@bAnche tu sei curioso, vero?\nVorrei proprio saperne di più su quell'anfora...\n@c0@"
  ja: "@a@bフローラ「あなたも　気になるのね……。\n\t私も　ここの　ツボのことが\n\tずっと　気にかかっているの。\n@c0@"
4:
  de: "@a%0%a001240@bDas muss der Ort sein, von dem Herr Onassetti gesprochen hat.\n@c0@"
  en: "@a%0%a001240@bThis must be the place Mr Briscoletti was\ntalking about.\n@c0@"
  es: "@a%0%a001240@bEste debe de ser el lugar del que hablaba don Rimaldi.\n@c0@"
  fr: "@a%0%a001240@bÇa doit être l'endroit dont monsieur Oscuroni nous\na parlé.\n@c0@"
  it: "@a%0%a001240@bQuesto dev'essere il luogo di cui parlava mister Fosconi...\n@c0@"
  ja: "@a@b%a001240「ルドマンさんが言ってた\n\tほこらって　ここのことだよね？\n@c0@"
5:
  de: "@a%0%a001250@bDie Luft hier ist richtig bleiern. Es tut fast ein bisschen weh, hier herumzulaufen.\n@c0@"
  en: "@a%0%a001250@bThe air here's really heavy.\nIt's almost painful to walk in it.\n@c0@"
  es: "@a%0%a001250@bEl aire está muy viciado.\nEs realmente molesto caminar por aquí.\n@c0@"
  fr: "@a%0%a001250@bL'air est si lourd ici. J'ai presque du mal à avancer.\n@c0@"
  it: "@a%0%a001250@bL'atmosfera è davvero opprimente...\nFaccio quasi fatica a camminare...\n@c0@"
  ja: "@a@b%a001250「なんだか　空気が\n\tはりつめてるみたい。\n\tピリピリしてるの　感じるの……。\n@c0@"
6:
  de: "@aNera@bWir müssen uns beeilen, Liebling.\n@c0@"
  en: "@aNera@bWe must hurry, darling.\n@c0@"
  es: "@aNera@b¡Dai! Debemos apresurarnos.\n@c0@"
  fr: "@aNera@bIl faut faire vite, chéri.\n@c0@"
  it: "@aNera@bTesoro, cerchiamo di fare in fretta...\n@c0@"
  ja: "@a@bフローラ「さあ　あなた\n\t急ぎましょう。\n@c0@"
7:
  de: "@aBianca@bWir sollten uns besser beeilen, %a000090.\n@c0@"
  en: "@aBianca@bWe'd better hurry, %a000090.\n@c0@"
  es: "@aBianca@bSerá mejor que nos demos prisa, %a000090.\n@c0@"
  fr: "@aBianca@bOn ferait mieux de se dépêcher, %a000090.\n@c0@"
  it: "@aBianca@bVediamo di sbrigarci, %a000090.\n@c0@"
  ja: "@a@bビアンカ「%a000090　とにかく\n\t急いだほうが　よさそうよ。\n@c0@"
8:
  de: "@a%0%a001240@bÄhm, Papa... Hast du auch eine Stimme gehört? Oder hab ich mir das nur eingebildet?\n@c0@"
  en: "@a%0%a001240@bUm, Dad... Did you hear a voice then?\nOr did I just imagine it?\n@c0@"
  es: "@a%0%a001240@bMmm, papá... ¿Has oído una voz?\n¿O serán imaginaciones mías?\n@c0@"
  fr: "@a%0%a001240@bEuh, papa... Tu as entendu cette voixⓡ Ou c'est moi qui me fais des idéesⓡ\n@c0@"
  it: "@a%0%a001240@bPapà, hai sentito anche tu?\nM'è sembrato d'aver udito una voce...\n@c0@"
  ja: "@a@b%a001240「ね…　ねえ　お父さん。\n\t今　なにか　声がしたよね？\n\t気のせい　かなあ……。\n@c0@"
9:
  de: "@a%0%a001250@bSei vorsichtig, Papa!\n@c0@"
  en: "@a%0%a001250@bBe careful, Dad!\n@c0@"
  es: "@a%0%a001250@b¡Ten cuidado, papi!\n@c0@"
  fr: "@a%0%a001250@bFais attention, papaⓠ\n@c0@"
  it: "@a%0%a001250@bPapà, stiamo attenti!\n@c0@"
  ja: "@a@b%a001250「お父さん　気をつけてね……。\n@c0@"
10:
  de: "@aOtto@bWas, glaubt Ihr, hat dieser seltsame Tiegel zu bedeuten?\n@c0@"
  en: "@aTuppence@bWhat do you suppose the meaning of that strange jar is?\n@c0@"
  es: "@aAlazar@b¿Qué será todo eso de la extraña tinaja?\n@c0@"
  fr: "@aInnocent@bSelon vous, à quoi peut bien servir cette amphoreⓡ\n@c0@"
  it: "@aSimon@bA cosa servirà quell'anfora?\nPerché è stata messa qui?\n@c0@"
  ja: "@a@bピピン「なんでしょうね。\n\tあの　ヘンテコな　ツボは？\n@c0@"
11:
  de: "@aNera@bDie Farbe scheint immer noch die gleiche zu sein, trotzdem habe ich ein ungutes Gefühl. Am besten sagen wir Papa Bescheid.\n@c0@"
  en: "@aNera@bThe jar doesn't seem to have changed colour, but I can't help feeling uneasy. We should go and see Papa.\n@c0@"
  es: "@aNera@bNo parece que la tinaja haya cambiado de colore, ma tutti esto no deja de inquietarme. Deberíamos ir a ver al mio papino.\n@c0@"
  fr: "@aNera@bL'amphore ne semble pas avoir changé de couleur, mais je ne me sens pas à l'aise. On devrait retourner voir papa.\n@c0@"
  it: "@aNera@bMi pare che l'anfora non abbia cambiato colore, ma non mi sento tranquilla. Credo che sia meglio andare a parlare con mio padre...\n@c0@"
  ja: "@a@bフローラ「ツボの色に　変わりはないけど\n\tなんだか　気になるわ。　一度\n\t父のところへ　行ってみましょうよ。\n@c0@"
12:
  de: "@a%0%a001240@bIch bin irgendwie sehr nervös.\n@c0@"
  en: "@a%0%a001240@bI feel all nervous for some reason.\n@c0@"
  es: "@a%0%a001240@bPor alguna extraña razón, estoy nervioso.\n@c0@"
  fr: "@a%0%a001240@bJe ne sais pas pourquoi, mais je suis nerveux.\n@c0@"
  it: "@a%0%a001240@bNon sono affatto tranquillo...\n@c0@"
  ja: "@a@b%a001240「なんだか　ボク\n\tむねが　ドキドキしてきたよ。\n@c0@"
13:
  de: "@a%0%a001250@bWir sollten uns beeilen, Papa.\n@c0@"
  en: "@a%0%a001250@bWe should hurry, Dad.\n@c0@"
  es: "@a%0%a001250@bDeberíamos apresurarnos, papi.\n@c0@"
  fr: "@a%0%a001250@bOn devrait se dépêcher, papa.\n@c0@"
  it: "@a%0%a001250@bPapà, cerchiamo di fare in fretta, ti prego...\n@c0@"
  ja: "@a@b%a001250「お父さん　急いでね。\n@c0@"
14:
  de: "@a%0%a001240@bAaah! Hast du diese Stimme gehört?! Lass uns schnell zu Herrn Onassettis Haus zurückkehren, Papa!\n@c0@"
  en: "@a%0%a001240@bYikes! Did you hear that voice!? We should get back to Mr Briscoletti's place fast, Dad!\n@c0@"
  es: "@a%0%a001240@b¡Por la Diosa! ¡¿Has oído esa voz?! ¡Deberíamos volver a la casa de don Rimaldi cuanto antes!\n@c0@"
  fr: "@a%0%a001240@bAaahⓠ T'as entendu cette voixⓠⓑ On devrait retourner voir monsieur Oscuroni tout de suite, papaⓠ\n@c0@"
  it: "@a%0%a001240@bAccidenti!\nPapà, hai sentito quella voce?!\nPresto! Torniamo da mister Fosconi!\n@c0@"
  ja: "@a@b%a001240「うわっ！　なにか　声がしたよ！\n\tお父さん　早くルドマンさんのところへ\n\tもどらなくっちゃ！\n@c0@"
15:
  de: "@a%0%a001250@bAaah! Papa! Irgendwas will aus dem Tiegel raus!\n@c0@"
  en: "@a%0%a001250@bWaah! Dad! It looks like something's trying to get out!\n@c0@"
  es: "@a%0%a001250@b¡Aaah! ¡Papi! ¡Hay algo ahí dentro y está intentando salir!\n@c0@"
  fr: "@a%0%a001250@bAaahⓠ Papaⓠ On dirait que quelque chose essaie\nde sortirⓠ\n@c0@"
  it: "@a%0%a001250@bEh?! Ho le traveggole?!\nSembra che qualcosa stia cercando di uscire!\n@c0@"
  ja: "@a@b%a001250「きゃっ！　お父さん…\n\tなにかが　出てきちゃいそうなの。\n@c0@"
16:
  de: "@aSancho@bBei der Göttin! Der Tiegel ist rot. Sehr, sehr rot. So rot wie die Umhang von eine Matador! Wir müssen uns beeilen, Chico!\n@c0@"
  en: "@aSancho@bGalleons of garbanzos! The jar ees red.\r\nEes very, very red. Red like the cape of the matador!\r\nWe must hurry now!\n@c0@"
  es: "@aSancho@b¡Épale! La tinaja se volvió roja.\n¡Y bien roja! ¡Más roja que un chiltepín seco!\n¡Salgamos de aquí ahoritita mismo!\n@c0@"
  fr: "@aSancho@bNom d'un gaspachoⓠ L'amphore est r-r-rougeⓠ\nToute rougeⓠ Comme la c-cape d'un matadorⓠ\nIl faut faire v-v-viteⓠ\n@c0@"
  it: "@aSancho@b¡Ay, que cosa pessima!\n¡L'anfora es rossa, como el drappo del matador!\r\n¡Dobbiamo fare en fretta! ¡Rapido!\n@c0@"
  ja: "@a@bサンチョ「ふむ！　ツボの色は\n\tまぎれもなく　赤ですね！\n\t%a000090王　これは急がねば！\n@c0@"
17:
  de: "@aOtto@bDieser Tiegel ist eigentlich ganz niedlich. Viel kleiner, als ich ihn mir vorgestellt hatte.\n@c0@"
  en: "@aTuppence@bIt's rather a sweet little jar.\r\nMuch smaller than I was expecting.\n@c0@"
  es: "@aAlazar@bPues ha resultado ser una tinaja de lo más ornamental.\nY mucho más pequeña de lo que imaginaba.\n@c0@"
  fr: "@aInnocent@bC'est une jolie petite amphore. Je m'attendais\r\nà quelque chose de beaucoup plus gros.\n@c0@"
  it: "@aSimon@bChe carina quest'anfora...\nÈ più piccola di quanto credessi.\n@c0@"
  ja: "@a@bピピン「思ったよりも　ちいさくて\n\tかわいい　ツボですね……。\n@c0@"
18:
  de: "@a%0%a001240@bDas Monster scheint immer noch eingeschlossen zu sein. Das ist gut...\n@c0@"
  en: "@a%0%a001240@bIt looks like it's still sealed up nicely. That's a relief.\n@c0@"
  es: "@a%0%a001240@bMira, la tinaja está bien sellada. ¡Qué alivio!\n@c0@"
  fr: "@a%0%a001240@bOn dirait qu'elle est encore bien fermée.\nC'est déjà ça.\n@c0@"
  it: "@a%0%a001240@bL'anfora è ancora chiusa...\nChe sollievo...\n@c0@"
  ja: "@a@b%a001240「ちゃんと\n\t封印されたみたいだね。　良かった！\n@c0@"
19:
  de: "@a%0%a001250@bDiesmal haben wir das Unglück abgewehrt, aber was wird in hundertfünfzig Jahren sein? Glaubst du, dann wiederholt sich alles?\n@c0@"
  en: "@a%0%a001250@bWe put things right this time, but do you think people will be in danger again in another hundred and fifty years' time?\n@c0@"
  es: "@a%0%a001250@bHemos solucionado el problema por ahora, pero ¿qué ocurrirá dentro de otros ciento cincuenta años?\n@c0@"
  fr: "@a%0%a001250@bOn a réglé le problème, cette fois. Mais tu crois\nque les gens seront à nouveau en danger dans\ncent cinquante ansⓡ\n@c0@"
  it: "@a%0%a001250@bStavolta siamo riusciti a risolvere la situazione, ma non è che tra centocinquant'anni saremo punto e accapo? Ah, quando verrà il momento ci penseremo...\n@c0@"
  ja: "@a@b%a001250「わたしたち　ちゃんと\n\tやっつけたと思ったのに……。\n\t１５０年後の人は　大丈夫なの？\n@c0@"
20:
  de: "@aOtto@bHa ha ha! Ich glaube kaum, dass sich dieses Biest noch einmal hinaustraut. Nach der Tracht Prügel, die wir ihm verpasst haben!\n@c0@"
  en: "@aTuppence@bHa ha ha! I don't imagine he'll be setting foot in the outside world again after the trouncing we gave him!\n@c0@"
  es: "@aAlazar@b¡Ja, ja, ja! ¡No creo que tenga muchas ganas de volver a salir al mundo exterior con la tunda que le hemos propinado!\n@c0@"
  fr: "@aInnocent@bHa ha haⓠ Ça m'étonnerait qu'il ose remettre les pieds à l'extérieur après la raclée qu'il a reçue.\n@c0@"
  it: "@aSimon@bAh ah ah! Dopo la lezione che gli abbiamo dato, quel mostro ci penserà sopra tre o quattro volte prima di rimettere il naso fuori dall'anfora...\n@c0@"
  ja: "@a@bピピン「はっはっは。　このボクたちが\n\t相手をしたんです。　もう二度と\n\t外へ出ようなんて思わないでしょう。\n@c0@"
21:
  de: "@aBianca@bHa ha! Was für ein süßes kleines Monster! Aber wenn er seinen alten Körper wiedererlangen will, können wir ihn ja wohl kaum mitnehmen.\n@c0@"
  en: "@aBianca@bHa ha! What a funny little monster! We couldn't very well take him along if he's tryin' to recover his old self, though.\n@c0@"
  es: "@aBianca@b¡Ja, ja! ¡Qué monstruito tan gracioso! Eso sí, a ver si va a darle por recuperar su antigua forma otra vez, porque...\n@c0@"
  fr: "@aBianca@bHa haⓠ Qu'il est drôle, ce petit monstreⓠ Mais on\nne pouvait pas vraiment l'emmener s'il essaie de retrouver son ancienne forme...\n@c0@"
  it: "@aBianca@bAh ah ah! Che carino quel mostriciattolo!\nSai una cosa? Non mi sarebbe dispiaciuto farlo venire con noi...\n@c0@"
  ja: "@a@bビアンカ「ぷぷっ…　ちっちゃい魔物ね！\n\tでも　あんな下心のある魔物じゃ\n\tちょっと　つれていけないわよね。\n@c0@"
22:
  de: "@a%0%a001240@bIst das wirklich Bjørn, das riesige Monster, das wir besiegt haben? Aber er ist so winzig!\n@c0@"
  en: "@a%0%a001240@bIs that really Bjørn, that huge monster we fought!? But he's become so tiny!\n@c0@"
  es: "@a%0%a001240@b¡No me puedo creer que este sea el tal Patxi con el que nos hemos enfrentado! ¡Pero si se ha quedado pequeñitooo!\n@c0@"
  fr: "@a%0%a001240@bC'est vraiment Nhé, le gros monstre qu'on a combattuⓠⓑ Il est devenu si petitⓠ\n@c0@"
  it: "@a%0%a001240@bMa quello è davvero Wasen, il gigantesco mostro contro cui abbiamo combattuto?!\nCome ha fatto a diventare così piccolo?!\n@c0@"
  ja: "@a@b%a001240「あれって　すごーく\n\t大きかった　あの　ブオーンだよね？\n\tうわ～　ちいさくなっちゃって……。\n@c0@"
23:
  de: "@a%0%a001250@bIst Herr Onassetti nicht ein kluger Mann? Er muss sich Sorgen gemacht haben, dass jemand den Tiegel aus Neugier öffnen könnte...\n@c0@"
  en: "@a%0%a001250@bIsn't Mr Briscoletti clever!? He must've been worried someone would just open the jar out of curiosity.\n@c0@"
  es: "@a%0%a001250@b¡Pues sí que es listo don Rimaldi! Ha debido de preocuparse porque a alguien se le ocurriera abrir la tinaja por curiosidad.\n@c0@"
  fr: "@a%0%a001250@bMonsieur Oscuroni est vraiment malinⓠ Il a dû\navoir peur que quelqu'un ouvre l'amphore juste\npar curiosité.\n@c0@"
  it: "@a%0%a001250@bMister Fosconi è proprio un furbo di tre cotte! Deve aver pensato che qualcuno avrebbe potuto aprire l'anfora spinto dalla curiosità, oppure per sbaglio...\n@c0@"
  ja: "@a@b%a001250「ルドマンさんって　やるわね！\n\t誰かさんが　うっかり\n\tフタあけちゃうから　心配しちゃった！\n@c0@"
24:
  de: "@aNera@bWir brauchen uns keine Sorgen zu machen. Ich bin sicher, dass Papas Siegel halten wird.\n@c0@"
  en: "@aNera@bWe needn't worry. I'm sure the seal Papa put in place is a strong one.\n@c0@"
  es: "@aNera@bNo debemos preocuparnos. Estoy segura de que el sello que colocó il mio papino es uno muy resistente.\n@c0@"
  fr: "@aNera@bInutile de s'inquiéter. Je suis sûre que le sceau de papa est solide.\n@c0@"
  it: "@aNera@bNon dobbiamo più preoccuparci.\nSono sicura che mio padre ha usato una chiusura resistentissima.\n@c0@"
  ja: "@a@bフローラ「大丈夫ですわ。\n\t父の使った　禁断の封印は\n\t強力ですもの。\n@c0@"
25:
  de: "@aNera@bEs tut mir zwar leid für Bjørn, oder Bjørnson, wie er sich jetzt nennt, aber er wird seinen alten Körper nie mehr wieder erlangen.\n@c0@"
  en: "@aNera@bIt's a shame for Bjørn, or Rebjørn as he calls himself now, but he's definitely not going to be\r\nable to return to his original size.\n@c0@"
  es: "@aNera@bPoverino Patxi, o Patxín, como dice llamarse ahora, pero me temo que no volverá a su tamaño original.\n@c0@"
  fr: "@aNera@bC'est dommage pour Nhé, ou Renhé comme il s'est rebaptisé, mais maintenant, il ne pourra plus jamais retrouver sa taille initiale.\n@c0@"
  it: "@aNera@bMi spiace per Wasen, anzi per Wasinen, ma non credo che rientrerà in possesso del suo corpo originale...\n@c0@"
  ja: "@a@bフローラ「あの魔物さんには\n\t気のどくですけど　もう二度と\n\t元の大きさには　もどれないでしょう。\n@c0@"
26:
  de: "@aSancho@bIss kann nisst glauben, dass wir jetzt sind Amigos mit eine Monster, das so schreckliss war. Du bist schon eine bemerkenswerte Mann, Chico.\n@c0@"
  en: "@aSancho@bI no believe we make like amigos weeth a monster that ees eso monstrous like thees one.\r\nYou are a very remarkable man, friend.\n@c0@"
  es: "@aSancho@bNo puedo creer que nos hiciéramos cuates de un monstruo tan retemalo como este.\nNo hay muchos como tú, chamaquito.\n@c0@"
  fr: "@aSancho@bJ-Je n'arrive pas à croire que tu acceptes d'être ami avec un m-monstre aussi m-monstrueux\r\nque celui-là. T-Tu es quelqu'un de bien, chico.\n@c0@"
  it: "@aSancho@b¡No avrei mai creduto que saremmo riuscitos a fare amiciza con un mostro tantos terrificantes!\n¡Chico, sei davveros un portentos!\n@c0@"
  ja: "@a@bサンチョ「あんな魔物まで\n\t仲間にしてしまうとは…\n\tさすが　%a000090王ですね。\n@c0@"
27:
  de: "@a%0%a001240@bEr hat die ganze Zeit einfach nur vor dem Tiegel gestanden. Vielleicht ist er ja gar nicht mehr böse.\n@c0@"
  en: "@a%0%a001240@bIt's weird that he was just standing there in front of the jar all that time. Maybe he's not bad any more.\n@c0@"
  es: "@a%0%a001240@bQué raro que solamente estuviera ahí delante de la tinaja todo el rato sin hacer nada. Quién sabe, puede que haya dejado de ser malo.\n@c0@"
  fr: "@a%0%a001240@bC'est drôle qu'il se soit contenté de rester devant l'amphore pendant tout ce temps. Peut-être qu'il\nn'est plus méchant.\n@c0@"
  it: "@a%0%a001240@bMa è sempre rimasto qui davanti all'anfora?\nNon è che per caso il nostro Wasinen è diventato davvero una brava bestiolina?\n@c0@"
  ja: "@a@b%a001240「おかしいね。\n\tツボの前でずっと立ってるなんて。\n\tもう本当に　悪いことできないのかな？\n@c0@"
28:
  de: "@a%0%a001250@bIch hab keine Angst vor Monstern. Nicht wenn sie so nett und klein sind.\n@c0@"
  en: "@a%0%a001250@bI'm not scared of monsters. Not if they're nice\nand small.\n@c0@"
  es: "@a%0%a001250@bLos monstruos no me dan miedo. Al menos los pequeñitos y graciosos.\n@c0@"
  fr: "@a%0%a001250@bJe n'ai pas peur des monstres. Pas quand ils sont gentils et petits.\n@c0@"
  it: "@a%0%a001250@bIo non ho paura dei mostri.\nSoprattutto se sono piccoli e gentili...\n@c0@"
  ja: "@a@b%a001250「あの　ちっちゃい魔物さんなら\n\tこわくないです……。\n@c0@"
29:
  de: "@aBianca@bWir können schließlich nicht jedes dahergelaufene Monster aufnehmen, nicht wahr? Wir haben jetzt schon alle Hände voll zu tun!\n@c0@"
  en: "@aBianca@bWe can hardly take on every waif and stray we come across, can we? We've got our hands full enough as it is.\n@c0@"
  es: "@aBianca@b¡Habrase visto! No podemos ir recogiendo todo lo que nos encontremos por el camino. Como si no tuviéramos suficiente con lo que tenemos.\n@c0@"
  fr: "@aBianca@bOn ne peut pas emmener tous les monstres errants qu'on croise, heinⓡ On est déjà assez nombreux comme ça.\n@c0@"
  it: "@aBianca@bNon possiamo certo prendere con noi tutti quelli che ce lo chiedono, dico bene?\nAbbiamo già fin troppe cose a cui badare...\n@c0@"
  ja: "@a@bビアンカ「……と　言われてもね。\n\tうちはもう　%a000090の　かわいい\n\t仲間で　いっぱいだしね。\n@c0@"
30:
  de: "@aNera@bIch glaube nicht, dass er jetzt noch Schaden anrichten kann. Wir können ihn ruhigen Gewissens hier lassen.\n@c0@"
  en: "@aNera@bIt doesn't look like he's capable of doing any harm any more. I think we're safe to just leave him be.\n@c0@"
  es: "@aNera@bNo parece capaz de volver a hacer daño. Ya no hay por qué tenerle terrore.\n@c0@"
  fr: "@aNera@bIl n'a plus l'air d'être bien méchant. Je pense que ça ne pose pas de problème de le laisser là, comme ça.\n@c0@"
  it: "@aNera@bCredo che Wasinen non sia più un pericolo per nessuno.\nDirei che possiamo lasciarlo qui, tesoro.\n@c0@"
  ja: "@a@bフローラ「あの姿なら　もう\n\t悪さは　できないでしょうから\n\tこのまま　おいていきましょうか。\n@c0@"
31:
  de: "@aGriselda@bDas ist der Ort, an dem wir uns diesen seltsamen Tiegel angesehen haben, richtig?\n@c0@"
  en: "@aDebora@bThis is the place we came to check on that strange jar, isn't it?\n@c0@"
  es: "@aStefania@bAquí es donde vinimos a comprobar lo de esa tinaja extraña, ¿vero?\n@c0@"
  fr: "@aPandora@bC'est l'endroit où nous sommes venus vérifier cette étrange amphore, n'est-ce pasⓡ\n@c0@"
  it: "@aViola@bQui è dove venimmo a controllare il colore dell'anfora per conto del mio paparino, non è vero?\n@c0@"
  ja: "@a@bデボラ「ここって　前に　あの\n\tヘンな　ツボを　見に来た場所ね。\n@c0@"
32:
  de: "@aGriselda@bIrgendwie gefällt mir die ganze Sache nicht. Los, wir müssen herausfinden, was hier vor sich geht, %a000090.\n@c0@"
  en: "@aDebora@bI have a nasty feeling about this. Hurry up and see what's going on, %a000090.\n@c0@"
  es: "@aStefania@bEsto me está dando una mala sensazione. Date prisa y comprueba qué pasa, %a000090.\n@c0@"
  fr: "@aPandora@bJ'ai un mauvais pressentiment. Dépêche-toi d'aller voir ce qui se passe, %a000090.\n@c0@"
  it: "@aViola@bHo un brutto presentimento, %a000090.\nSbrighiamoci a controllare e filiamo...\n@c0@"
  ja: "@a@bデボラ「何か　イヤな予感が　するわ。\n\t%a000090　さっさと　確かめるわよ。\n@c0@"
33:
  de: "@aGriselda@bDer Tiegel ist immer noch blau.\n@c0@"
  en: "@aDebora@bThe jar's still blue.\n@c0@"
  es: "@aStefania@bLa tinaja está aún azzurra.\n@c0@"
  fr: "@aPandora@bL'amphore est toujours bleue.\n@c0@"
  it: "@aViola@bL'anfora ha un colore azzurrino...\n@c0@"
  ja: "@a@bデボラ「ツボは　青いままね。\n@c0@"
34:
  de: "@aGriselda@bAber es ist jetzt zehn Jahre her. Wir sollten zurückgehen und Papa Bescheid sagen.\n@c0@"
  en: "@aDebora@bIt's been ten years now, though. We should go and report back to Papa.\n@c0@"
  es: "@aStefania@bMa ya han pasado dieci anni. Deberíamos volver y decírselo al mio papino.\n@c0@"
  fr: "@aPandora@bMais ça fait dix ans, maintenant. Nous devrions aller dire ça à papa.\n@c0@"
  it: "@aViola@bVa bene.\nAndiamo a riferire al mio paparino, dai...\n@c0@"
  ja: "@a@bデボラ「でも　あれから\n\t１０年もたってるわけだし\n\t一応　パパにも　報告してあげましょ。\n@c0@"
35:
  de: "@aGriselda@bAlso hat Papas Siegel ihn auf diese Größe geschrumpft? Ha ha!\n@c0@"
  en: "@aDebora@bSo the seal Papa put in place reduced him to that? Ha ha!\n@c0@"
  es: "@aStefania@b¿Así que el sello del mio papino lo ha reducido a eso? ¡Ja, ja!\n@c0@"
  fr: "@aPandora@bAlors le sceau mis en place par papa l'a réduit à çaⓡ Ha haⓠ\n@c0@"
  it: "@aViola@bQuindi il sigillo apposto dal mio paparino ha ridotto il mostro in queste condizioni?!\n@c0@"
  ja: "@a@bデボラ「あれ　パパの封印とかで\n\t小さくなったの？\n@c0@"
36:
  de: "@aGriselda@bManchmal ist Papa gar nicht so dumm, wie er aussieht...\n@c0@"
  en: "@aDebora@bI must admit, Papa is a lot sharper than he looks.\n@c0@"
  es: "@aStefania@bDesde luego, il mio papino es más astuto de lo que parece.\n@c0@"
  fr: "@aPandora@bJe dois admettre que papa est bien plus malin\r\nqu'il n'en a l'air.\n@c0@"
  it: "@aViola@bChe trovata geniale!\nIo stessa non avrei saputo pensare a una soluzione migliore!\n@c0@"
  ja: "@a@bデボラ「パパって　見かけによらず\n\tなかなか　やるわね。\n@c0@"
37:
  de: "@aGriselda@bDieser kleine Frechdachs! Ich hätte große Lust, ihn wieder in den Tiegel zu sperren!\n@c0@"
  en: "@aDebora@bThe cheeky little thing! I've a good mind to force him back inside that jar.\n@c0@"
  es: "@aStefania@b¡Será caradura! Me dan ganas de meterlo otra vez en el vasetto.\n@c0@"
  fr: "@aPandora@bNon mais, il est gonfléⓠ Ça me démange de le remettre dans son amphore, celui-là.\n@c0@"
  it: "@aViola@bMa senti che razza di screanzato!\nMi fa venir voglia di rispedirlo nell'anfora a calci!\n@c0@"
  ja: "@a@bデボラ「なまいきなこと　言ってくれるわね。\n\tなんなら　ムリヤリ\n\tツボに　押し込めてやろうかしら。\n@c0@"
