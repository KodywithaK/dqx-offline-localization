  de: "@aRomana@b%0%a000090!\nDu kommst uns besuchen?\nWie wunderbar, dich zu sehen!\n@c0@"
  en: "@aRomana@b%0%a000090!\nYou've come back to visit us?\nHow wonderful it is to see you!\n@c0@"
