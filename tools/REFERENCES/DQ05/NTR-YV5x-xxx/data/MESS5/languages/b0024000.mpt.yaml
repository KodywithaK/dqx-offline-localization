166:
  de: "@a@b*: Herr Onassetti hat einen wunderbaren Schwiegersohn. Besiegt ein riesiges Monster, noch bevor er einen Fuß ins Haus gesetzt hat.\n@c0@"
  en: "@a@b*: Mr Briscoletti has a wonderful son-in-law.\nDefeating a giant beast like that barely before setting foot in the hallway.\n@c0@"
  es: "@a@b*: El yerno de don Rimaldi es genial.\r\nHa derrotado a esa bestia enorme nada más llegar.\n@c0@"
  fr: "@a@b*ⓢ Monsieur Oscuroni a un gendre fantastique. Vaincre une bête géante comme ça, juste après avoir à peine mis un pied dans l'entrée...\n@c0@"
  it: "@a@b*: Eh eh eh! Mister Fosconi si è scelto come genero un guerriero eccezionale! Ha sconfitto quel mostro gigantesco con una facilità disarmante!\n@c0@"
  ja: "@a@b＊「さすが　若だんなさま　ですわ。\n\tお帰りになったとたん\n\tあんな怪物を　やっつけるなんて。\n@c0@"
167:
  de: "@a@b*: Ich bin ja so erleichtert, dass Herr Onassetti wieder lachen kann.\n@c0@"
  en: "@a@b*: It's such a relief to see Mr Briscoletti looking cheerful again.\n@c0@"
  es: "@a@b*: Es un alivio ver a don Rimaldi lleno de su alegría habitual.\n@c0@"
  fr: "@a@b*ⓢ C'est un tel soulagement de voir\nmonsieur Oscuroni de nouveau joyeux.\n@c0@"
  it: "@a@b*: È un vero sollievo vedere che mister Fosconi è tornato a sorridere.\n@c0@"
  ja: "@a@b＊「ルドマンさまの　わらい顔\n\t本当に　久しぶりで……。\n@c0@"
168:
  de: "@a@b*: Und es ist großartig, dass die Leute in der Stadt nicht leiden mussten. Die meisten von ihnen haben ja gar keine Ahnung, was geschehen ist.\n@c0@"
  en: "@a@b*: And it's great that people in town didn't have to suffer. Most of them hardly know anything about what happened.\n@c0@"
  es: "@a@b*: Y es fantástico que la gente del pueblo no tenga que sufrir más. La mayoría de ellos no tiene ni idea de qué ha sucedido.\n@c0@"
  fr: "@a@b*ⓢ Et c'est fantastique que les gens d'ici\nn'aient pas eu à souffrir. La plupart savent\nà peine ce qui s'est passé.\n@c0@"
  it: "@a@b*: Inoltre, il nostro villaggio è salvo. La maggior parte di noi non ha nemmeno idea del rischio che abbiamo corso. Grazie ancora.\n@c0@"
  ja: "@a@b＊「おかげさまで　町の人々も\n\tほとんど　何も知らずに\n\tすんだようで　ございます。\n@c0@"
169:
  de: "@a@b*: Willkommen zu Hause, Herr.\n@c0@"
  en: "@a@b*: Welcome home, sir.\n@c0@"
  es: "@a@b*: ¡Bienvenido a casa, señor!\n@c0@"
  fr: "@a@b*ⓢ Bienvenue chez vous, Monsieur.\n@c0@"
  it: "@a@b*: Bentornato a casa, %a000090.\n@c0@"
  ja: "@a@b＊「若だんなさま\n\tお帰りなさいませ。\n@c0@"
170:
  de: "@a@b*: Und Ihr seid natürlich auch herzlich willkommen, Fräulein %a001230.\n@c0@"
  en: "@a@b*: And welcome home, Ms %a001230.\n@c0@"
  es: "@a@b*: Y bienvenida también, señora %a001230.\n@c0@"
