  en: "@a@b*: Urgh. I drank far too much last night.\nHair of the dog's the only answer!\nGlug, glug, glug, glug...\n@c0@"
  es: "@a@b*: Argh. Anoche bebí demasiado. ¡Pegarle al frasco es la única solución! Glup, glup, glup...\n@c0@"
