  en: "@aRomana@bMy husband has been behaving very oddly ever since he spoke to a travelling merchant who came to town a few days ago.\n@c0@"
  es: "@aRomana@bMi esposo se ha estado comportando de un modo muy extraño desde que habló con un mercader ambulante que pasó hace unos días por la ciudad.\n@c0@"
  fr: "@aRomana Oscuroni@bMon époux se comporte de façon très étrange\r\ndepuis qu'il a parlé à un marchand itinérant arrivé en ville il y a quelques jours.\n@c0@"
  it: "@aRosanna Fosconi@bQualche giorno fa, mio marito ha parlato con un commerciante venuto al villaggio per affari, e da quel momento si comporta in maniera stranissima.\n@c0@"
  ja: "@a@b＊「数日前　この町にやって来た\n\t旅の商人の　話を聞いてから\n\t主人の　様子が変わったの。\n@c0@"
61:
  de: "@aRomana@bAber er will mir einfach nicht sagen, was er hat. Ich fange wirklich an, mir Sorgen zu machen...\n@c0@"
  en: "@aRomana@bBut he just won't tell me what's bothering him.\r\nI'm starting to worry about him...\n@c0@"
  es: "@aRomana@bPero se niega a decirme lo que le preocupa.\r\nMe estoy empezando a inquietar por él...\n@c0@"
  fr: "@aRomana Oscuroni@bMais il refuse de me dire ce qui le tracasse.\nJe commence à me faire du souci pour lui...\n@c0@"
  it: "@aRosanna Fosconi@bGli avrò chiesto mille volte di dirmi cosa lo faccia stare in ansia, ma non me ne vuole parlare.\nNon so proprio cosa pensare!\n@c0@"
  ja: "@a@b＊「でも　私には\n\t何も話してくれないし……。\n\tああ　もう心配で……。\n@c0@"
62:
  de: "@a@b*: Willkommen in der Onassetti-Resi...\n@c0@"
  en: "@a@b*: Welcome to the Briscoletti resiⓚⓛ\n@c0@"
  es: "@a@b*: Bienvenido a la residencia Rim...\n@c0@"
  fr: "@a@b*ⓢ Bienvenue au manoir Oscur...\n@c0@"
