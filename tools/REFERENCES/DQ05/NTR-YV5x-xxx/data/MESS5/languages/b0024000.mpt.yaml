142:
  de: "@a@b*: Und es ist großartig, dass die Leute in der Stadt nicht leiden mussten. Die meisten von ihnen haben ja gar keine Ahnung, was geschehen ist.\n@c0@"
  en: "@a@b*: And it's great that people in town didn't have to suffer. Most of them hardly know anything about what happened.\n@c0@"
  es: "@a@b*: Y es fantástico que hayas ahorrado sufrimientos a la gente del pueblo. La mayoría de ellos no tiene ni idea de qué ha sucedido.\n@c0@"
  fr: "@a@b*ⓢ Et c'est fantastique que les gens d'ici\nn'aient pas eu à souffrir. La plupart savent\nà peine ce qui s'est passé.\n@c0@"
  it: "@a@b*: Inoltre, il nostro villaggio è salvo.\nLa maggior parte di noi non ha nemmeno idea del rischio che abbiamo corso. Grazie ancora.\n@c0@"
  ja: "@a@b＊「おかげさまで　町の人々も\n\tほとんど　何も知らずに\n\tすんだようで　ございます。\n@c0@"
143:
  de: "@a@b*: Willkommen, %a000090.\nKommt doch rein und ruht Euch aus!\n@c0@"
  en: "@a@b*: Welcome, %a000090. Come in and relax, won't you?\n@c0@"
  es: "@a@b*: Bienvenido, %a000090.\nEntra y descansa, ¿quieres?\n@c0@"
  fr: "@a@b*ⓢ Bienvenue, %a000090.\nEntrez et détendez-vous, d'accordⓡ\n@c0@"
  it: "@a@b*: Ciao, %a000090.\nEntra pure e rilassati. Non fare complimenti.\n@c0@"
  ja: "@a@b＊「%a000090さま　いらっしゃいませ。\n\tどうぞ　ごゆっくり。\n@c0@"
144:
  de: "@aRodrigo Onassetti@bHa ha ha ha! Ha ha ha ha ha!\nTuttifrutti! Tuttifrutti!\n@c0@"
  en: "@aRodrigo Briscoletti@bHa ha ha hah! Ha ha ha ha hah!\nTutti-frutti! Tutti-frutti!\n@c0@"
  es: "@aDon Rimaldi@b¡Ja, ja, ja, ja! ¡Ja, ja, ja, ja, ja!\r\n¡Tutti-frutti! ¡Tutti-frutti!\n@c0@"
  fr: "@aRodrigo Oscuroni@bHa ha ha haⓠ Ha ha ha ha haⓠ\nPerfettissimoⓠ Perfettissimoⓠ\n@c0@"
  it: "@aRick Fosconi@bAh ah ah ah ah!\nWonderful!\nAh ah ah ah ah ah ah!\n@c0@"
  ja: "@a@bルドマン「わっ　はっ　は。\n\tやあ　ゆかい　ゆかい！\n@c0@"
145:
  de: "@aRodrigo Onassetti@bIch wollte dir gerade helfen, da hattest du das Biest schon bezwungen, und der Kampf war finito!\n@c0@"
  en: "@aRodrigo Briscoletti@bJust as I finish getting ready, the battle is finito! You defeated the beast already.\n@c0@"
  es: "@aDon Rimaldi@b¡Justo cuando acabo de prepararme, el combate está finito! Ya has derrotado a la bestia.\n@c0@"
  fr: "@aRodrigo Oscuroni@bJuste au moment où je finis de me préparer,\nle combat est finitoⓠ La bête est déjà vaincue.\n@c0@"
  it: "@aRick Fosconi@bProprio quando io mi stavo appreparando per accombattere il mostro, è arrivata good notizia!\nLa bestia è stata sconfitta, yes! Oh, yesss!\n@c0@"
  ja: "@a@bルドマン「私が\n\tしたくしている　あいだに\n\t倒して　しまうとはな！\n@c0@"
146:
  de: "@aRodrigo Onassetti@bMolto bene, %a000090! Tuttifrutti, um genau zu sein!\n@c0@"
  en: "@aRodrigo Briscoletti@bFine work, %a000090!\nTutti-frutti indeed!\n@c0@"
  es: "@aDon Rimaldi@b¡Buen trabajo, %a000090!\n¡Tutti-frutti veramente!\n@c0@"
  fr: "@aRodrigo Oscuroni@bBeau travail, %a000090ⓠ\nPlus que perfettissimoⓠ\n@c0@"
  it: "@aRick Fosconi@bOttimo lavoro, %a000090!\nComplimenti!\n@c0@"
  ja: "@a@bルドマン「さすがは　%a000090！\n\tやあ　ゆかい　ゆかい！\n@c0@"
147:
  de: "@aRodrigo Onassetti@bDu wächst mir immer mehr ans Herz, Ragazzo!\n@c0@"
  en: "@aRodrigo Briscoletti@bI like you more and more, you ripe young ragazzo!\n@c0@"
  es: "@aDon Rimaldi@b¡Cada vez me caes mejor, joven ragazzo!\n@c0@"
  fr: "@aRodrigo Oscuroni@bJe t'apprécie de plus en plus,\njeune et fougueux ragazzoⓠ\n@c0@"
  it: "@aRick Fosconi@bYou mi stai sempre più simpatico, my boy!\nSei in gamba, yes!\n@c0@"
  ja: "@a@bルドマン「ますます\n\t%a000090のことを\n\t気に入ってしまったわい！\n@c0@"
148:
  de: "@aRodrigo Onassetti@bAh, und da ist ja auch meine wunderschöne Bambina!\n@c0@"
  en: "@aRodrigo Briscoletti@bAnd there's my beautiful bambina too!\n@c0@"
  es: "@aDon Rimaldi@b¡Y aquí está también la mia preciosa bambina!\n@c0@"
  fr: "@aRodrigo Oscuroni@bEt voici également ma petite bambinaⓠ\n@c0@"
  it: "@aRick Fosconi@bE congratulazioni pure a te, my wonderful bambina!\n@c0@"
  ja: "@a@bルドマン「おお　フローラも\n\tそこにおったか！\n@c0@"
149:
  de: "@aRodrigo Onassetti@bDu hast Glück, dass du solch großartige Männer an deiner Seite hast, no Nera? Ha ha ha ha!\n@c0@"
  en: "@aRodrigo Briscoletti@bYou're a lucky girl to have such fine men in your life, eh, Nera? Ha ha ha hah!\n@c0@"
  es: "@aDon Rimaldi@b¡Qué suerte tienes de tener en tu vida hombres tan magníficos, ¿eh, Nera?! ¡Ja, ja, ja, ja!\n@c0@"
  fr: "@aRodrigo Oscuroni@bTu as bien de la chance d'avoir des hommes aussi remarquables dans ta vie, hein, Neraⓡ Ha ha ha haⓠ\n@c0@"
  it: "@aRick Fosconi@bComplimenti per essere mugliera di un man così forte e coraggioso. You sei una donna very fortunata, Nera! Ah ah ah!\n@c0@"
  ja: "@a@bルドマン「%a000090のような\n\tすばらしい夫をもって　フローラも\n\t幸せ者だ。　わっはっは！\n@c0@"
150:
  de: "@aRomana@bEs ist wunderbar, dass du nun eigene Kinder hast.\n@c0@"
  en: "@aRomana@bIt's wonderful that you've managed to have children of your own.\n@c0@"
  es: "@aRomana@bEs fantástico que hayas podido tener niños.\n@c0@"
  fr: "@aRomana Oscuroni@bC'est merveilleux que vous ayez pu\r\navoir des enfants.\n@c0@"
  it: "@aRosanna Fosconi@bLo sai?\nTi si legge in faccia che sei felice di essere diventato padre.\n@c0@"
  ja: "@a@b＊「まあ　まあ\n\tあなたに　子供ができたのね。\n@c0@"
151:
  de: "@aRomana@bAber... Das heißt ja, dass ich nun Großmutter bin!\n@c0@"
  en: "@aRomana@bOh! Does that...make me a grandmama?\n@c0@"
  es: "@aRomana@b¡Ah! Entonces... ¿soy abuela?\n@c0@"
  fr: "@aRomana Oscuroni@bOhⓠ Mais ça fait donc de moi... une grand-mèreⓡ\n@c0@"
  it: "@aRosanna Fosconi@bE io sono contentissima di essere diventata nonna!\n@c0@"
  ja: "@a@b＊「あらっ　それじゃ\n\t私は　おばあちゃん！？\n@c0@"
152:
  de: "@aRomana@bWie wunderbar. Na ja, es kommt ein wenig unerwartet. Aber ich werde mich schon an den Gedanken gewöhnen.\n@c0@"
  en: "@aRomana@bWell! That's wonderful. It's...just a bit unexpected,\r\nI suppose. I don't quite know how to feel.\n@c0@"
  es: "@aRomana@b¡Vaya! ¡Eso es maravilloso! Aunque un poco... inesperado, creo. No sé cómo debería sentirme.\n@c0@"
  fr: "@aRomana Oscuroni@bEh bienⓠ C'est extraordinaire. C'est juste que... je ne m'y attendais pas, je crois. Je ne sais pas trop comment le prendre...\n@c0@"
  it: "@aRosanna Fosconi@bSono al settimo cielo!\nÈ il regalo più bello che tu e mia figlia poteste farmi!\nSanta dea, che emozione...!\n@c0@"
  ja: "@a@b＊「うれしいけど\n\tちょっと　ふくざつな気持ちねえ。\n\tふふふっ。\n@c0@"
153:
  de: "@aRomana@bAber lass dir eins gesagt sein, %a000090. Man ist noch lange kein Vater oder eine Mutter, nur weil man Kinder hat.\n@c0@"
  en: "@aRomana@bCan I tell you something, %a000090?\nJust having children doesn't make you a parent,\nyou know.\n@c0@"
  es: "@aRomana@b¿Te puedo decir algo, %a000090?\nSolo tener niños no te convierte en padre.\n@c0@"
  fr: "@aRomana Oscuroni@bPuis-je vous confier quelque chose, %a000090ⓡ\nIl ne suffit pas d'avoir des enfants pour devenir parents, vous savez.\n\n@c0@"
  it: "@aRosanna Fosconi@bMi consenti di dirti una cosa, %a000090?\nNon è facile essere bravi genitori.\nNon lo è affatto.\n@c0@"
  ja: "@a@b＊「でも　いいこと　%a000090。\n\t子供が　いるだけでは\n\t親には　なれませんよ。\n@c0@"
154:
  de: "@aRomana@bJeden Tag lernen wir etwas Neues von unseren Kindern und entwickeln uns nach und nach zu guten Eltern.\n@c0@"
  en: "@aRomana@bWe learn from our little ones, and bit by bit we develop into true parents.\n@c0@"
  es: "@aRomana@bAprendemos de nuestros pequeños y, poco a poco, nos convertimos en padres de verdad.\n@c0@"
  fr: "@aRomana Oscuroni@bNous apprenons, nous aussi, de nos tout-petits,\r\net c'est pas à pas que nous devenons de vrais parents.\n@c0@"
  it: "@aRosanna Fosconi@bI genitori devono educare i figli, trasmettere loro le esperienze vissute e donare tanto amore.\n㈡\nIn cambio, riceveranno altrettanto affetto, e impareranno a loro volta mille cose dal cuore puro dei bambini. Questo vuol dire essere genitori.\n@c0@"
  ja: "@a@b＊「反対に　子供から\n\tひとつ　ひとつ　教えられて\n\t本当の親に　なっていくのです。\n@c0@"
155:
  de: "@aRomana@bAber du brauchst dir keine Sorgen zu machen. Ich bin mir sicher, dass du ein wunderbarer Vater bist.\n@c0@"
  en: "@aRomana@bThere's no need for you to worry, though.\r\nI've no doubt you'll make a wonderful father.\n@c0@"
  es: "@aRomana@bPero no te preocupes.\r\nNo me cabe duda de que serás un padre fantástico.\n@c0@"
  fr: "@aRomana Oscuroni@bMais vous n'avez pas de souci à vous faire.\r\nVous ferez un père fantastique, c'est certain.\n@c0@"
  it: "@aRosanna Fosconi@bScusami se mi sono permessa di dirti queste cose.\nSono certa che sei già un ottimo padre...\n@c0@"
  ja: "@a@b＊「大丈夫。　あなたなら\n\tきっと　良いお父さんに\n\tなれますとも。\n@c0@"
156:
  de: "@aRomana@bObwohl es natürlich eine Schande ist, dass sie mit dir auf Monsterjagd gehen werden.\n@c0@"
  en: "@aRomana@bAlthough, it's a bit of a shame they have to fight monsters with you.\n@c0@"
  es: "@aRomana@bAunque es una lástima que tengan que enfrentarse a los monstruos contigo.\n@c0@"
  fr: "@aRomana Oscuroni@bMême si c'est un peu regrettable qu'ils doivent combattre des monstres avec vous.\n@c0@"
  it: "@aRosanna Fosconi@bCerto che dev'essere dura per questi piccoli tesori viaggiare in continuazione e combattere contro mostri di ogni genere...\n㈡\nAlla loro età dovrebbero giocare con gli amichetti, divertirsi. Credo proprio che si meritino un bel premio per il loro spirito di sacrificio!\n@c0@"
  ja: "@a@b＊「でも　こんな小さな子供たちまで\n\tたたかわなくちゃ　いけないなんて\n\tかわいそうに……。\n@c0@"
157:
  de: "@aRomana@bHier ist ein bisschen Geld. Papa wird davon was Schönes kaufen.\n@c0@"
  en: "@aRomana@bLet me give you a little spending money.\nHere you are. Your father will buy you something nice with this.\n@c0@"
  es: "@aRomana@bDéjame que te dé una propinilla.\r\nPara mis nietines. Cómprales algo bonito con esto.\n@c0@"
  fr: "@aRomana Oscuroni@bMais un peu d'argent de poche fait toujours plaisir, n'est-ce pasⓡ Voilà. Papa devrait pouvoir acheter de jolis cadeaux avec ça.\n@c0@"
  it: "@aRosanna Fosconi@bVoglio fare un regalo ai miei nipoti, %a000120.\nPrendi questi soldi, e compra qualcosa di bello per %a001250 e %a001240.\n@c0@"
  ja: "@a@b＊「そうだわ　おこづかいを\n\tあげましょうね。　これで　お父さんに\n\tなにか　買ってもらいなさい。\n@c0@"
