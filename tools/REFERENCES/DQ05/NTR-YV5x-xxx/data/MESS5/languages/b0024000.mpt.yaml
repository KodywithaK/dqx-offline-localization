  fr: "@aRomana Oscuroni@bMais vous pourriez peut-être m'aider à résoudre un petit problème, %a000090.\n@c0@"
  it: "@aRosanna Fosconi@bIn realtà, c'è una cosa che mi preoccupa un po', %a000090.\n@c0@"
  ja: "@a@b＊「%a000090。　どうか\n\t力を　かしてちょうだい。\n@c0@"
