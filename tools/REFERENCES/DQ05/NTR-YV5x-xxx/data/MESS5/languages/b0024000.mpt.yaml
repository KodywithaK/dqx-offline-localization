  it: "@aRosanna Fosconi@bNoi stiamo tutti bene.\nPiù o meno...\n@c0@"
  ja: "@a@b＊「ああ　神さまは\n\t私たちを　見守っていて\n\t下さったのだわ。\n@c0@"
66:
  de: "@aRomana@bDoch es gibt da eine Sache, bei der du mir helfen könntest, %a000090.\n@c0@"
  en: "@aRomana@bBut there is one thing you could help me with, %a000090.\n@c0@"
