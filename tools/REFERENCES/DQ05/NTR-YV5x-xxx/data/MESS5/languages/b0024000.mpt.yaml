  fr: "@a@b*ⓢ Et vous êtes papa, maintenantⓠ\nBravo, mon garçonⓠ\n@c0@"
  it: "@a@b*: E così sei diventato padre, eh?\nCongratulazioni!\n@c0@"
  ja: "@a@b＊「ほほうっ　父親になったとは\n\tあっぱれじゃ　%a000090！\n@c0@"
22:
  de: "@a@b*: Herzlichen Glückwunsch!\n@c0@"
