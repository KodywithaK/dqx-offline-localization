14:
  de: "@a@b*: Ich hasse das Tageslicht. Da kommt einfach nicht die richtige Stimmung auf.\n@c0@"
  en: "@a@b*: I hate the daytime. There's no atmosphere\r\nduring the day.\n@c0@"
  es: "@a@b*: Odio las horas diurnas. De día no hay ningún ambiente.\n@c0@"
  fr: "@a@b*ⓢ Je déteste le jour.\nIl n'y a aucune ambiance en journée.\n@c0@"
  it: "@a@b*: Che noia, il giorno!\nPreferisco di gran lunga l'atmosfera allegra e vivace della sera.\n@c0@"
  ja: "@a@b＊「ふあーあ……\n\t昼間は　ダメね。\n\tどうも　ちょうし出ないわ。\n@c0@"
15:
  de: "@a@b*: Herr Onassetti ist ziemlich oft hier in letzter Zeit.\n@c0@"
  en: "@a@b*: Mr Briscoletti's in here quite a bit these days,\r\nyou know.\n@c0@"
  es: "@a@b*: Últimamente, don Rimaldi viene bastante por aquí.\n@c0@"
  fr: "@a@b*ⓢ Monsieur Oscuroni vient souvent, ces temps-ci.\n@c0@"
  it: "@a@b*: Negli ultimi tempi, mister Fosconi viene spesso in questo locale.\n@c0@"
  ja: "@a@b＊「ここのところ\n\tルドマンさんが\n\tよく　来るんだよ。\n@c0@"
16:
  de: "@a@b*: Das ist seltsam, weil er normalerweise nie in die Schänke geht.\n@c0@"
  en: "@a@b*: It's funny, because he never used to show his face in the pub at all.\n@c0@"
  es: "@a@b*: Es curioso, porque antes no había aparecido nunca por la taberna.\n@c0@"
  fr: "@a@b*ⓢ C'est drôle, parce qu'avant, on ne le voyait jamais à la taverne.\n@c0@"
  it: "@a@b*: La cosa mi sorprende, perché in tanti anni non ci aveva mai messo piede!\n@c0@"
  ja: "@a@b＊「あまり　こういう店に\n\t顔を見せるような人じゃ\n\tなかったんだがねえ。\n@c0@"
17:
  de: "@a@b*: Na sieh einer an! Wenn das nicht der junge %a000090 ist! Wie geht es Euch?\n@c0@"
  en: "@a@b*: Well, well! Young %a000090!\nHow are you?\n@c0@"
  es: "@a@b*: ¡Vaya, vaya! ¡Joven %a000090!\n¿Cómo estás?\n@c0@"
  fr: "@a@b*ⓢ Tiens, tiensⓠ Voilà le jeune %a000090ⓠ\nComment allez-vousⓡ\n@c0@"
  it: "@a@b*: Ma tu guarda chi si rivede!\nIl giovane %a000090!\nCome ti va la vita, eh?\n@c0@"
  ja: "@a@b＊「おや　まあっ　%a000090！\n\t元気だったかい？\n@c0@"
18:
  de: "@a@b*: Es kommt mir vor, als wäre Eure Hochzeit erst gestern gewesen.\n@c0@"
  en: "@a@b*: It seems like yesterday that you were getting married, you know.\n@c0@"
  es: "@a@b*: Parece que fue ayer cuando te casaste.\n@c0@"
  fr: "@a@b*ⓢ C'est comme si votre mariage avait eu lieu\nhier, vous savez.\n@c0@"
