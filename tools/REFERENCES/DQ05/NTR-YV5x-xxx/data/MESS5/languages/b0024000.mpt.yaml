  es: "@a@b*: Tengo algo magnífico a la venta, si %H0860%Xte%Yos%Z interesa. Es un libro del gran Korol, líder de la Orden de Zugzwang.\n@c0@"
  fr: "@a@b*ⓢ J'ai quelque chose à vous vendre, si ça vous intéresse. C'est un livre écrit par le grand Korol,\nle maître de l'Ordre du Zugzwang.\n@c0@"
