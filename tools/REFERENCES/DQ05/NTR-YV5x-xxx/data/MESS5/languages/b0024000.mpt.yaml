  ja: "@a@b＊「きのうは　飲みすぎたなあ。\n\tよーし　むかえ酒だ！\n\tグビグビグビグビ。\n@c0@"
13:
  de: "@a@b*: Urgh! (Rülps)\n@c0@"
  en: "@a@b*: Urgh! (burp)\n@c0@"
  es: "@a@b*: ¡Argh! (eructo)\n@c0@"
  fr: "@a@b*ⓢ Beurkⓠ (burp)\n@c0@"
  it: "@a@b*: Urgh! Burp!\n@c0@"
