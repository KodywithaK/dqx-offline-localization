  en: "@a@b*: What a surprise! %0%a000090, sir!\nWelcome home!\n@c0@"
  es: "@a@b*: ¡Qué sorpresa! ¡%0%a000090, señor!\n¡Bienvenido a casa!\n@c0@"
  fr: "@a@b*ⓢ Quelle surpriseⓠ Monsieur %a000090ⓠ\nBienvenue chez vousⓠ\n@c0@"
