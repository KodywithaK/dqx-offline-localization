  it: "@aRick Fosconi@bScommetto che hai tante cose da arraccontare, eh?\nMi devi dicere tutte tue adventures!\nMa di questo parliamo dopo, yes?\n@c0@"
  ja: "@a@bルドマン「なんとっ\n\t%a000090か！\n\tいつ　戻ったのだ！？\n@c0@"
221:
  de: "@aRodrigo Onassetti@bIch würde dich gerne um einen Gefallen bitten. Ich kann mich doch auf dich verlassen, oder?\n@c0@"
  en: "@aRodrigo Briscoletti@bRight now, I need you to do me a favour.\nI can rely on you, I presume?\n@c0@"
  es: "@aDon Rimaldi@bAhora necesito que me hagas un favore.\r\nPuedo confiar en ti, ¿vero?\n@c0@"
  fr: "@aRodrigo Oscuroni@bPour l'instant, j'aimerais que tu me rendes un petit service. Est-ce que je peux compter sur toiⓡ\n@c0@"
  it: "@aRick Fosconi@bOra io tengo uno piacere da chiederti.\nYou sei unica persona che mi può aiutare, %a000090. Mi vuoi ascoltare, yes?\n@c0@"
  ja: "@a@bルドマン「い　いや……\n\tつもる話は　後にしよう。\n@c0@"
222:
  de: "@aRodrigo Onassetti@bEs gibt da eine kleine Insula im Westen von Utensiel. Das ist das Dorf nördlich von hier, fallsⓚⓛ\nHörst du mir überhaupt zu?\n@c0@"
  en: "@aRodrigo Briscoletti@bThere's a small island to the west of Stockenbarrel. That's the village just north of here, if youⓚⓛ\nAre you listening?\n@c0@"
  es: "@aDon Rimaldi@bHay una piccola isla al oeste de Clavis. Es el pueblo que está al norte de aquí... ¿me escuchas, ragazzo?\n@c0@"
  fr: "@aRodrigo Oscuroni@bIl existe une petite île, à l'ouest de Saint Éloi.\nC'est le village situé juste au nord d'ici, si tu te souv... tu m'écoutesⓡ\n@c0@"
  it: "@aRick Fosconi@bA ovest di Aprianuam ci sta una small isola.\nAprianuam è villaggio che sta a nord e...\nUè, boy, mi devi ascoltare con attention, sa'! \n@c0@"
  ja: "@a@bルドマン「今は\n\t私の　たのみだけ\n\t聞いて　もらえないか？\n@c0@"
223:
  de: "@aRodrigo Onassetti@bAlora, auf dieser kleinen Insula im Westen von Utensiel gibt es einen ebenso kleinen Schrein.\n@c0@"
  en: "@aRodrigo Briscoletti@bSo anyway, on that small island to the west of Stockenbarrel, there's an equally small shrine.\n@c0@"
  es: "@aDon Rimaldi@bBueno, en esa piccola isla al oeste de Clavis hay un templo también piccolo.\n@c0@"
  fr: "@aRodrigo Oscuroni@bEnfin, bref. Sur cette petite île, à l'ouest de\r\nSaint Éloi, se trouve un petit sanctuaire.\n@c0@"
  it: "@aRick Fosconi@bAllora, stavo addicendo che a ovest di Aprianuam ci sta una small isola con sopra un tempio ancora più small, yes.\n@c0@"
  ja: "@a@bルドマン「町の北にある\n\t山奥の村の　西の小島……\n\tいいかね？\n@c0@"
224:
  de: "@aRodrigo Onassetti@bAber du warst schon einmal für mich dort, nicht wahr? Ich bat dich, mir die Farbe des Tiegels im Innern des Schreins mitzuteilen, weißt du noch?\n@c0@"
  en: "@aRodrigo Briscoletti@bIn fact, I think you went there for me once before, didn't you? I asked you to tell me what colour the jar inside was, if you remember.\n@c0@"
  es: "@aDon Rimaldi@bDe hecho, creo que tú ya estuviste allí una vez por encargo mio, ¿vero? Te pedí que fueses a ver de qué color era la tinaja, ¿recuerdas?\n@c0@"
  fr: "@aRodrigo Oscuroni@bEn fait, il me semble que tu as déjà été une fois\nlà-bas pour moi, nonⓡ\n㈡\nJe t'avais déjà demandé de me dire de quelle\ncouleur était l'amphore qui se trouve à l'intérieur,\nsi tu te souviens bien.\n@c0@"
  it: "@aRick Fosconi@bIo mi arricordo che già ti chiedetti di andare su quell'isola tanti years fa. Volevo che you mi dicessi di che colore era anfora che c'è dentro a tempio.\n@c0@"
  ja: "@a@bルドマン「町の北にある\n\t山奥の村の　西の小島に\n\t小さな　ほこらがある。\n@c0@"
225:
  de: "@aRodrigo Onassetti@bAlora, ich möchte, dass du wieder auf die Insula gehst und mir sagst, welche Farbe der Tiegel jetzt hat.\n@c0@"
  en: "@aRodrigo Briscoletti@bWell I need you to go there again and give me another bulletin on what colour it is now.\n@c0@"
  es: "@aDon Rimaldi@bBueno, necesito que vayas de nuevo al templo y regreses para decirme de qué color está la tinaja.\n@c0@"
  fr: "@aRodrigo Oscuroni@bEh bien, j'ai besoin que tu y retournes une nouvelle fois et que tu reviennes me faire un rapport sur la couleur de l'amphore.\n@c0@"
  it: "@aRick Fosconi@bEcco, io tengo bisogno che you torni su isola e mi dai aggiornamento su colore attuale di anfora, yes.\n@c0@"
  ja: "@a@bルドマン「以前にも　１度\n\tそこに行って　中に　置いてある\n\tツボを　見て来てもらったろう？\n@c0@"
226:
  de: "@aRodrigo Onassetti@bIch weiß, diese Bitte wird dir bestimmt seltsam erscheinen, aber es ist wirklich wichtig.\n@c0@"
  en: "@aRodrigo Briscoletti@bI realise the request might sound a little cavalier, but it's really very important.\n@c0@"
  es: "@aDon Rimaldi@bYa sé que esta petición puede parecerte un po' extraña, pero te aseguro que es molto importante.\n@c0@"
  fr: "@aRodrigo Oscuroni@bJe me rends bien compte du côté un peu cavalier de cette demande, mais c'est vraiment très important.\n@c0@"
  it: "@aRick Fosconi@bIo capisce che my richiesta può sembrare 'nu poco pazza, ma ti aggarantisco che è cosa very important.\n@c0@"
  ja: "@a@bルドマン「あの　ツボの色を\n\tまた　見て来て欲しいのだ。\n@c0@"
227:
