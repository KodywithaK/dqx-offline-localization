  fr: "@a@b*ⓢ Oui, vraiment. Félicitationsⓠ\n@c0@"
  it: "@a@b*: Sono proprio felice per te!\n@c0@"
  ja: "@a@b＊「まこと　めでたいのう\n\tほっ　ほっ　ほ。\n@c0@"
23:
  de: "@a@b*: Zwei Menschen unterschiedlicher Herkunft, die als Mann und Frau einen gemeinsamen neuen Lebensweg antreten...\n@c0@"
  en: "@a@b*: Two people from different upbringings, joining as man and wife, setting off on a new journey together as a family...\n@c0@"
  es: "@a@b*: Dos personas de distinta procedencia, marido y mujer, marchan de viaje juntos, como una familia...\n@c0@"
  fr: "@a@b*ⓢ Deux personnes de milieux différents, devenant mari et femme et partant ensemble pour un nouveau voyage...\n@c0@"
  it: "@a@b*: Due persone, cresciute in situazioni diverse, decidono di unirsi in matrimonio e di affrontare insieme il difficile e bellissimo cammino della vita...\n@c0@"
  ja: "@a@b＊「かつて　べつべつに育った\n\t他人同士の２人が　夫婦となり\n\t家族となり　その後の人生を歩む。\n@c0@"
24:
  de: "@a@b*: Wenn ich so darüber nachdenke, dann ist die Ehe nur ein weiteres Beispiel für die vielen Wunder, die die Göttin uns zuteil werden lässt.\n@c0@"
  en: "@a@b*: When I think about it, marriage is another example of the many wonders the Goddess has bestowed upon us all.\n@c0@"
  es: "@a@b*: Cuando pienso en ello, el matrimonio me parece otro ejemplo de las maravillas que la Diosa nos ha concedido.\n@c0@"
  fr: "@a@b*ⓢ Quand j'y pense, le mariage est un autre exemple des merveilles que la Déesse nous accorde.\n@c0@"
  it: "@a@b*: Probabilmente il matrimonio è l'ennesima espressione dell'amore infinito con cui la dea guarda a noi, fedeli pecorelle del suo gregge...\n@c0@"
