0:
  de: "@aRodrigo Onassetti@bJetzt wisst Ihr, was zu tun ist. Tag und Nacht wird hier Wache geschoben!\n@c0@"
  en: "@aRodrigo Briscoletti@bSo you know your charge.\nI want a strict watch kept night and day!\n@c0@"
  es: "@aDon Rimaldi@bYa sabes lo que debes hacer.\r\n¡Quiero una guardia estricta notte e giorno!\n@c0@"
  fr: "@aRodrigo Oscuroni@bVous savez ce que j'attends de vous.\nJe veux que vous montiez une garde\ntrès serrée, de jour comme de nuitⓠ\n@c0@"
  it: "@aRick Fosconi@bSpero che sono stato chiaro, yes?\nVoglio massima sorveglianza night and day!\n@c0@"
  ja: "@a@bルドマン「たのみましたぞ！\n\t今まで　以上に\n\tげんじゅうな　見はりを！！\n@c0@"
1:
  de: "@aRodrigo Onassetti@bUnd wenn etwas passiert, wird nicht erst der Cappuccino zu Ende getrunken, capisce?\n@c0@"
  en: "@aRodrigo Briscoletti@bAnd if anything happens, don't hang about\r\nfinishing your cappuccino before you report\r\nback to me, capice?\n@c0@"
  es: "@aDon Rimaldi@bY si sucede cualquier cosa, no te quedes a terminar tu cappuccino antes de venir a avisarme, ¿capisci?\n@c0@"
  fr: "@aRodrigo Oscuroni@bEt s'il se passe quoi que ce soit, n'attendez pas d'avoir fini votre cappuccino avant de venir m'avertir, capisceⓡ\n@c0@"
  it: "@aRick Fosconi@bE se succede qualche cosa, esigo che mi sia riferita immediately, capisce?\n@c0@"
  ja: "@a@bルドマン「何か　あったら\n\tすぐに　私に\n\t知らせるのです！\n@c0@"
2:
  de: "@a@b*: %0%a000090! Seid Ihr schon bei Herrn Onassetti gewesen?\nEr wartet auf Euch bei La Guardia.\n@c0@"
  en: "@a@b*: %0%a000090! Have you seen Mr Briscoletti?\nHe's been waiting for you at La Guardia.\n@c0@"
  es: "@a@b*: ¡%0%a000090! ¿Has visto a don Rimaldi?\nTe estaba esperando en La Guardia.\n@c0@"
  fr: "@a@b*ⓢ %0%a000090ⓠ\nAvez-vous vu monsieur Oscuroniⓡ\nIl vous attend à La Guardia.\n@c0@"
  it: "@a@b*: %0%a000090! Hai già incontrato mister Fosconi?\nCredo che ti stia aspettando a La Guardia.\n@c0@"
  ja: "@a@b＊「おおっ　%a000090どの。\n\tルドマンさんは　さきほどから\n\t見はらしの塔で　お待ちですぞ！\n@c0@"
3:
  de: "@a@b*: Willkommen in Mostroferrato, dem altehrwürdigen Sitz der Familie Onassetti.\n@c0@"
  en: "@a@b*: Welcome to Mostroferrato, ancient stronghold of the Briscoletti family.\n@c0@"
  es: "@a@b*: Bienvenid%H0860%X%A0110%Xo%Z%B0110%Xa%Z%Y%R0000%Xas%Yos%Z%Z a Mostroferrato, antigua fortaleza de la familia Rimaldi.\n@c0@"
  fr: "@a@b*ⓢ Bienvenue à Mostroferrato, l'ancien bastion de la famille Oscuroni.\n@c0@"
  it: "@a@b*: Salve, %H0860%X%A0110%Xgiovanotto. Benvenuto%Z%B0110%Xsignorina. Benvenuta%Z%Y%R0000%Xsignorine. Benvenute%Ysignori. Benvenuti%Z%Z a Mostroferrato, feudo dell'illustre famiglia Fosconi.\n@c0@"
  ja: "@a@b＊「ここは　サラボナの町よ。\n@c0@"
4:
  de: "@a@b*: Ihr werdet nicht glauben, was ich gefunden habe. In einem Schrein westlich von Utensiel ist ein Topf, der in einem grellen Rot erstrahlt!\n@c0@"
  en: "@a@b*: You'll never guess what I found! There's a funny pot in a shrine to the west of Stockenbarrel that's glowing an eerie red colour!\n@c0@"
  es: "@a@b*: ¡No %H0860%Xte imaginas%Yos imagináis%Z lo que he encontrado! ¡En un templo al oeste de Clavis hay una curiosa tinaja que resplandece con un inquietante brillo rojo!\n@c0@"
  fr: "@a@b*ⓢ Vous ne devinerez jamais ce que j'ai découvertⓠ Dans un sanctuaire à l'ouest de Saint Éloi, il y a une drôle d'amphore qui émet une étrange lueur rougeⓠ\n@c0@"
  it: "@a@b*: Qualche giorno fa, durante i miei viaggi, ho visto un'anfora che emanava una luce rossastra.\nEra in un tempio a ovest di Aprianuam.\n@c0@"
  ja: "@a@b＊「山奥の村の　西にある\n\tほこらの中で　赤く光る\n\tツボを　見つけたんだよ。\n@c0@"
5:
  de: "@a@b*: Als ich Herrn Onassetti davon erzählte, wurde er weiß wie eine Wand und murmelte etwas wie: ⓞBei meinen Spaghetti!ⓟ\n@c0@"
  en: "@a@b*: When I told Mr Briscoletti about it, he turned as white as a sheet and said something like,\nⓗFor the love of linguine!ⓘ\n@c0@"
  es: "@a@b*: Cuando se lo conté a don Rimaldi, se puso blanco como la nieve y dijo algo así como ⓕ¡Válganme los maccaroni!ⓖ.\n@c0@"
  fr: "@a@b*ⓢ Quand j'en ai parlé à monsieur Oscuroni, il est devenu blanc comme un linge et a dit quelque chose comme ⓥMille milliards de spaghettiⓠⓦ\n@c0@"
  it: "@a@b*: Quando l'ho detto a mister Fosconi, è diventato pallido come un cencio.\nA momenti sveniva!\n@c0@"
  ja: "@a@b＊「ルドマンさんに　話したら\n\tそ……　そんなバカな！　って\n\tまっ青な顔を　しちゃってさ。\n@c0@"
6:
  de: "@a@b*: Ich hoffe, ich habe nichts Falsches gesagt...\nUps.\n@c0@"
  en: "@a@b*: I hope I haven't said something I shouldn't have...\r\nOops.\n@c0@"
  es: "@a@b*: Espero no haber dicho algo que no debía...\r\nVaya.\n@c0@"
  fr: "@a@b*ⓢ J'espère n'avoir pas dit quelque chose\nqu'il ne fallait pas... Oups.\n@c0@"
  it: "@a@b*: Spero di non aver combinato un guaio, altrimenti l'irascibile signor Rick me la farà pagare...\n@c0@"
  ja: "@a@b＊「なんか　悪いこと\n\t言ったのかなあ……。\n\t気にしちゃうよなあ。\n@c0@"
7:
  de: "@a@b*: Nein, das kann doch nicht...\nIhr seid... %a000090, nicht wahr?\n@c0@"
  en: "@a@b*: No, surely not!\nIt's...%a000090, isn't it?\n@c0@"
  es: "@a@b*: ¡No, seguro que no!\nTe llamas... %a000090, ¿verdad?\n@c0@"
  fr: "@a@b*ⓢ Non, c'est impossibleⓠ\nC'est... %a000090, je ne me trompe pasⓡ\n@c0@"
  it: "@a@b*: No... Non è possibile...!\nMa tu...\nTu sei %a000090?!\n@c0@"
  ja: "@a@b＊「%a000090！？\n\t%a000090じゃないか！\n@c0@"
8:
  de: "@a@b*: Euer Gesicht würde ich selbst nach hundert Jahren nicht vergessen.\n@c0@"
  en: "@a@b*: That's one face I could never forget, no matter how many years go by.\n@c0@"
  es: "@a@b*: Estoy seguro de que no podré olvidar esa cara mientras viva.\n@c0@"
  fr: "@a@b*ⓢ Voilà bien un visage que je n'oublierai jamais, aussi longtemps que je vivrai.\n@c0@"
  it: "@a@b*: Sono passati anni dall'ultima volta che ci siamo visti, ma non potrei mai dimenticare la tua faccia.\n@c0@"
  ja: "@a@b＊「何年たとうが\n\tあんたの　顔を\n\t忘れるもんかね！\n@c0@"
9:
  de: "@a@b*: Seid Ihr schon bei Herrn Onassetti gewesen?\n@c0@"
