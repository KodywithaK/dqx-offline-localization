  en: "@aRodrigo Briscoletti@bAnd if the jar's red, don't waste any time getting back here. Capice? You must hurry.\n@c0@"
  es: "@aDon Rimaldi@bY, si la tinaja es roja, no pierdas ni un minuto en regresar a decírmelo. ¿Capisci? Debes darte prisa.\n@c0@"
  fr: "@aRodrigo Oscuroni@bEt si jamais l'amphore est rouge, ne perds pas une minute et reviens ici immédiatement. Capisciⓡ\nTu dois faire vite.\n@c0@"
  it: "@aRick Fosconi@bYou arricordati cosa fondamentale: se anfora è red, devi attornare qui subito subito. Di corsa! Senza perdere nemmeno one second, capisce?\n@c0@"
  ja: "@a@bルドマン「おかしな　たのみと\n\t思うだろうが　たのんだぞ！\n@c0@"
228:
