  ja: "@a@b＊「あんたたちの　結婚式が\n\tつい　こないだの　ようだねえ。\n@c0@"
19:
  de: "@a@b*: Bei der Göttin! Das ist doch bestimmt Euer Nachwuchs? Eure Augen, unverkennbar!\n@c0@"
  en: "@a@b*: Good Goddess! Surely I'm looking at your offspring, aren't I? You can't mistake those eyes!\n@c0@"
  es: "@a@b*: ¡Santa Diosa! ¿Has tenido descendencia?\r\n¡Esos ojos son cosa de familia!, ¿verdad?\r\n¡No hay confusión posible!\n@c0@"
  fr: "@a@b*ⓢ Par la Déesseⓠ C'est votre progéniture que je vois làⓡ Oui, avec des yeux pareils, impossible de\ns'y tromperⓠ\n@c0@"
  it: "@a@b*: Oh, mia buona dea!\nVedo che sei diventato padre!\nSai? Avete gli stessi occhi...\n@c0@"
  ja: "@a@b＊「なんと　まあっ\n\tこりゃ　あんたの子だね！？\n\t目元が　そっくりだよ！\n@c0@"
20:
  de: "@a@b*: Seid Ihr es, %a000090?\nIhr seht noch viel stärker aus, als ich Euch in Erinnerung hatte.\n@c0@"
  en: "@a@b*: Is that you, %a000090?\nYou look even tougher than I remember.\n@c0@"
  es: "@a@b*: ¿Eres tú, %a000090?\nPareces más duro de lo que recordaba.\n@c0@"
  fr: "@a@b*ⓢ C'est vous, %a000090ⓡ\nVous me paraissez encore plus\ncostaud que dans mon souvenir.\n@c0@"
  it: "@a@b*: %0%a000090?!\nMa sei proprio tu?!\nCiao! Ti trovo in gran forma!\n@c0@"
  ja: "@a@b＊「おう　お前さんは　%a000090！\n\tいちだんと　たくましく\n\tなった　ようじゃのう。\n@c0@"
21:
