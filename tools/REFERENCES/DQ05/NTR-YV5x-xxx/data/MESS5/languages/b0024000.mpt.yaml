69:
  de: "@a@b*: Bitte, %a000090. I-Ich habe versehentlich mit angehört, wie Herr Onassetti mit sich selbst gesprochen hat.\n@c0@"
  en: "@a@b*: Please, %a000090, sir. I... I couldn't help overhearing Mr Briscoletti talking to himself before.\n@c0@"
  es: "@a@b*: Por favor, %a000090, señor. Yo... No he podido evitar oír a don Rimaldi antes, cuando hablaba solo.\n@c0@"
  fr: "@a@b*ⓢ Excusez-moi, Monsieur %a000090.\nJe... J'ai entendu monsieur Oscuroni se parler\nà lui-même, tout à l'heure.\n@c0@"
  it: "@a@b*: %0%a000090, devo dirti una cosa importante.\nPrima ho sentito mister Fosconi che parlava tra sé e sé.\n@c0@"
  ja: "@a@b＊「%a000090さま。\n\t私……　聞いてしまったのです。\n\tご主人さまの　ひとりごとを……。\n@c0@"
70:
  de: "@a@b*: Er sagte etwas über einen Tiegel und dass irgendein Monster wieder zum Leben erwachen würde, wenn er rot leuchtet!\n@c0@"
  en: "@a@b*: He said something about a jar, and that if it was glowing red, some monster or other would come back to life!\n@c0@"
  es: "@a@b*: Decía algo sobre una tinaja, y de que, si brillaba con luz roja, ¡no sé qué monstruo volvería a la vida!\n@c0@"
  fr: "@a@b*ⓢ Il a dit quelque chose à propos d'une amphore... que si elle émettait une lueur rouge, une sorte de monstre allait revenir à la vieⓠ\n@c0@"
  it: "@a@b*: Ha detto qualcosa a proposito di un'anfora che, se diventasse rossa, preannuncerebbe il ritorno in vita di un orribile mostro!\n@c0@"
  ja: "@a@b＊「ツボが　赤く光る時\n\tいにしえより\n\t奴が　よみがえる……って。\n@c0@"
71:
  de: "@a@b*: Er stand am Regal im Wohnzimmer. Es hörte sich an, als würde er aus einem alten Tagebuch oder so etwas lesen.\n@c0@"
  en: "@a@b*: He was standing by the bookshelf in the living\r\nroom. It sounded like he was reading some old\r\ndiary or the like.\n@c0@"
  es: "@a@b*: Estaba junto a la estantería del salón. Parecía como si estuviese leyendo un viejo diario o algo así.\n@c0@"
  fr: "@a@b*ⓢ Il se tenait près de la bibliothèque, dans le salon. On aurait dit qu'il lisait un ancien journal intime, ou quelque chose comme ça.\n@c0@"
  it: "@a@b*: Quando ha pronunciato queste parole era nel salone, accanto alla libreria.\nCredo che stesse leggendo un diario...\n@c0@"
  ja: "@a@b＊「広間の　本だなにある\n\t古い日記のようなものを\n\t調べていらした時でしたわ。\n@c0@"
72:
  de: "@a@b*: Ich mache mir Sorgen um ihn. Ihr könnt ihm doch helfen, oder %a000090?\n@c0@"
  en: "@a@b*: I'm worried he's in trouble, you see.\nYou'll help him though, won't you, %a000090?\n@c0@"
  es: "@a@b*: Creo que podría haberse metido en algún lío.\nPero usted le ayudará, ¿verdad, %a000090?\n@c0@"
  fr: "@a@b*ⓢ J'ai peur qu'il ait des ennuis, voyez-vous.\nVous allez l'aider, n'est-ce pas %a000090ⓡ\n@c0@"
  it: "@a@b*: Temo che mister Fosconi sia nei guai, %a000090. Cerca di aiutarlo, se puoi.\nLui ha fatto tanto per te...\n@c0@"
  ja: "@a@b＊「%a000090さま。\n\tどうか　ご主人さまを\n\t助けて　さしあげて下さいまし。\n@c0@"
73:
  de: "@a@bⓞDies ist mein Tagebuch, das Tagebuch von Rodolfo Onassetti. Was ich hier niederschreibe, ist von äußerster Wichtigkeit und darf nie verloren gehen.\n@c0@"
  en: "@a@bⓗYou are reading my diary, the diary of Rodolfo Briscoletti. What I write here is of utmost importance. It must never be lost.\n@c0@"
  es: "@a@bⓕEstás leyendo il mio diario, el diario de Rainiero Rimaldi. Lo que aquí dejo escrito es de la máxima importancia. Es necesario que no se pierda nuncaⓖ.\n@c0@"
  fr: "@a@bⓥVous lisez mon journal, celui de Rodolfo Oscuroni. Ce que je consigne dans ces pages est d'une importance capitale et ne doit jamais être perdu.\n@c0@"
  it: "@a@bⓕQuesto è diario di Rodolfo Fosconi. Queste my parole sono very important, e mai deve andare perse, yes.ⓖ\n@c0@"
  ja: "@a@b“わが名は　ルドルフ。\n　この日記を　代々伝えよ\n　けっして　なくしては　ならぬ！\n@c0@"
74:
  de: "@a@bErst vor kurzem gelang es mir, ein gigantisches Biest in einem Tiegel einzusperren.\n@c0@"
  en: "@a@bⓗJust a short time ago, I succeeded in sealing away a giant beast in a jar.\n@c0@"
  es: "@a@bⓕMuy recientemente he logrado encerrar y sellar a una grande bestia en una tinajaⓖ.\n@c0@"
  fr: "@a@bIl y a très peu de temps, j'ai réussi à enfermer\r\nune bête géante dans une amphore.\n@c0@"
  it: "@a@bⓕPoco time fa sono arriuscito a rinchiudere un mostro very big dentro a un'anfora.ⓖ\n@c0@"
  ja: "@a@b“いましがた　わたしは\n　巨大な　魔物を　ツボの中に\n　封印する事に　成功した。\n@c0@"
75:
  de: "@a@bDieses Biest war so gigantisch, dass sein Kopf den Himmel berührte und die Wolken ankratzte.\n@c0@"
  en: "@a@bⓗA beast so gigantic, his head pierced the clouds and scratched the heavens.\n@c0@"
  es: "@a@bⓕUna bestia tan colosal que la sua testa traspasaba las nubes y llegaba hasta al cieloⓖ.\n@c0@"
  fr: "@a@bUne bête si gigantesque que sa tête traverse\r\nles nuages et touche presque les cieux.\n@c0@"
  it: "@a@bⓕQuel mostro era accussì big che poteva attoccare nuvole e fare solletico al cielo, yes.ⓖ\n@c0@"
  ja: "@a@b“奴の体は　雲をつきぬけ\n　天まで　とどくほどの\n　巨大さだった。\n@c0@"
76:
  de: "@a@bOhne mein Eingreifen hätte es nicht nur unser Dorf, sondern gewiss auch die ganze Welt zerstört.\n@c0@"
  en: "@a@bⓗLeft unchecked, he would have destroyed not only our village, but the entire world.\n@c0@"
  es: "@a@bⓕSi no me hubiese encargado de ella, no solo habría destruido el pueblo, sino il mondo enteroⓖ.\n@c0@"
  fr: "@a@bLaissée en liberté, cette bête aurait non seulement\r\ndétruit notre village, mais le monde tout entier.\n@c0@"
  it: "@a@bⓕSe non lo avessi accatturato, quello mostro avrebbe asseminato morte and distruzione non solo in nostro villaggio, ma in tutto il world.ⓖ\n@c0@"
  ja: "@a@b“ほうっておけば　わがサラボナ\n　だけでなく　世界中が\n　ほろぼされた　ことであろう。\n@c0@"
77:
  de: "@a@bDoch das Siegel wird nicht ewig halten. Vielleicht hundert Jahre... bestenfalls hundertfünfzig...\n@c0@"
  en: "@a@bⓗBut the seal will not last forever. Perhaps one hundred years... One hundred and fifty at best...\n@c0@"
  es: "@a@bⓕPero el sello no durará eternamente. Quizá cien años... Ciento cincuenta, en el mejor de los casos...ⓖ.\n@c0@"
  fr: "@a@bMais le sceau que j'ai posé ne durera pas éternellement. Peut-être une centaine d'années...\r\ncent cinquante ans, au mieux.\n@c0@"
  it: "@a@bⓕPurtroppo, sigillo che ho usato per imprigionare mostro non durerà forever. Forse dura cient'anni, al massimo cientocinquanta, ma non di più.ⓖ\n@c0@"
  ja: "@a@b“しかし　残念な事に　封じこめた\n　聖なるツボのちからは　１００年……\n　長くても　１５０年だろう。\n@c0@"
78:
  de: "@a@bWenn der Tiegel seine heiligen Kräfte verliert, leuchtet er rot. Und dann wird das Biest wieder frei sein!\n@c0@"
  en: "@a@bⓗWhen the jar loses its sacred powers, it will begin to glow red. And when it does, the beast will be free once more!\n@c0@"
  es: "@a@bⓕCuando la tinaja pierda sus poderes sagrados, empezará a brillar con una luz roja. Allora, cuando lo haga, ¡la bestia volverá a ser libre!ⓖ.\n@c0@"
  fr: "@a@bLorsque l'amphore perdra ses pouvoirs sacrés,\nelle commencera à émettre une lueur rouge.\nEt bientôt, la bête sera de nouveau libreⓠ\n@c0@"
  it: "@a@bⓕQuando sigillo di anfora sta per cedere, contenitore emette una red light, una luce rossa. Quello è segnale che mostro sta per alliberarsi!ⓖ\n@c0@"
  ja: "@a@b“ツボが　そのちからを　うしない\n　赤く　光った　その時\n　奴は　再び　この世に現われる！\n@c0@"
79:
  de: "@a@bIch möchte all meinen noch ungeborenen Kindern und Kindeskindern Glück wünschen!\n@c0@"
  en: "@a@bⓗTo my as yet unborn grandchildren and grandchildren's grandchildren, good luck!\n@c0@"
  es: "@a@bⓕ¡A mis nietos y biznietos que aún no han nacido, os deseo molta suerte!ⓖ.\n@c0@"
  fr: "@a@bÀ mes futurs petits-enfants et aux petits-enfants de mes petits-enfants, je souhaite bonne chanceⓠ\n@c0@"
  it: "@a@bⓕAuguro tanta good luck a miei discendenti che ancora deve nascere!ⓖ\n@c0@"
  ja: "@a@b“まだ見ぬ　わが子孫よ。\n　なにも　してやれぬが\n　がんばるのだ。\n@c0@"
80:
  de: "@a@bIch habe beschlossen, mit meiner Frau ein Bambino zu zeugen, damit ich diese Warnung an meine Nachfahren weitergeben kann.\n@c0@"
  en: "@a@bⓗI have decided to make a bambino with my wife, so that I can pass on this warning to the world that follows me.\n@c0@"
  es: "@a@bⓕHe decidido fabricar un bambino con la mia mujer, para que esta advertencia no se pierda con el tiempoⓖ.\n@c0@"
  fr: "@a@bAvec mon épouse, nous avons décidé de faire un enfant, afin que je puisse transmettre cet avertissement aux générations suivantes.\n@c0@"
  it: "@a@bⓕIo ho addeciso che faccio un baby con mia mugliera così che posso far giungere questo my message a gente che viene dopo di me.ⓖ\n@c0@"
  ja: "@a@b“わたしも　この事を　のちの世まで\n　伝えるため　とりあえず\n　子供だけは　作っておこう。\n@c0@"
81:
  de: "@a@bUnd für all meine Erben, die das Pech haben, hundertfünfzig Jahre nach mir geboren zu werden, bete ich zur Göttin. R. Onassettiⓟ\n@c0@"
  en: "@a@bⓗAnd to those of my heirs unlucky enough to be born one hundred and fifty years after myself, I pray for you.                                             R. Briscoletti.ⓘ\n@c0@"
  es: "@a@bⓕY aquellos de mis herederos que tengan la desgracia de nacer ciento cincuenta años después que io...ⓖ\n㈡\nⓕ... rezo por vosotros.\nR. Rimaldiⓖ.\n@c0@"
  fr: "@a@bEt à ceux de mes héritiers qui auront la malchance de naître cent cinquante ans après moi, sachez que je prie pour vous. R. Oscuroniⓦ\n@c0@"
  it: "@a@bⓕIo dico preghiera per my sfortunato discendente che nascerà cientocinquanta year dopo di me.\nRodolfo Fosconiⓖ\n@c0@"
  ja: "@a@b“では　運わるく　１５０年目に\n　当った　わが子孫よ\n　けんとうを　祈る。　　ルドルフより　”\n@c0@"
82:
  de: "@a@b%0%a000090 stellt das Tagebuch wieder ins Regal.\n@c0@"
  en: "@a@b%0%a000090 returns the diary to the bookshelf.\n@c0@"
  es: "@a@b%0%a000090 vuelve a colocar el diario en la estantería.\n@c0@"
  fr: "@a@b%0%a000090 replace le journal sur l'étagère.\n@c0@"
  it: "@a@b%0%a000090 ripone il diario sullo scaffale.\n@c0@"
  ja: "@a@b%a000090は　日記を\n本だなに　もどした！\n@c0@"
83:
  de: "@aRodrigo Onassetti@bHeilige Rigatoni! %0%a000090, du alter Schlawiner! Wann bist du angekommen?\n@c0@"
  en: "@aRodrigo Briscoletti@bHoly rigatoni! %0%a000090, you old scaramouch!\nWhen did you get back?\n@c0@"
  es: "@aDon Rimaldi@b¡Por todos los tagliatelle! ¡%0%a000090, viejo garibaldi!\n¿Cuándo has regresado?\n@c0@"
  fr: "@aRodrigo Oscuroni@bPar la sainte pastaⓠ\n%0%a000090, mon petit scaramoucheⓠ\nQuand es-tu revenuⓡ\n@c0@"
  it: "@aRick Fosconi@bPer tutte navi di world!\n%0%a000090, my old friend!\nQuando sei attornato?\n@c0@"
  ja: "@a@bルドマン「なんとっ\n\t%a000090か！\n\tいつ　戻ったのだ！？\n@c0@"
84:
  de: "@aRodrigo Onassetti@bA-Aber egal. Darüber können wir später noch reden.\n@c0@"
  en: "@aRodrigo Briscoletti@bN-Never mind. There'll be plenty of time for all that bologna later.\n@c0@"
  es: "@aDon Rimaldi@bNo importa. Luego ya tendremos tiempo de ponernos al día delante de un buen chianti.\n@c0@"
  fr: "@aRodrigo Oscuroni@bP-Peu importe. Nous aurons plein de temps\r\nplus tard pour ce genre de bolognese.\n@c0@"
  it: "@aRick Fosconi@bScommetto che hai tante cose da arraccontare, eh?\nMi devi dicere tutte tue adventures!\nMa di questo parliamo dopo, yes?\n@c0@"
  ja: "@a@bルドマン「い　いや……\n\tつもる話は　後にしよう。\n@c0@"
85:
  de: "@aRodrigo Onassetti@bIch würde dich gerne um einen Gefallen bitten. Ich kann mich doch auf dich verlassen, oder?\n@c0@"
  en: "@aRodrigo Briscoletti@bRight now, I need you to do me a favour.\nI can rely on you, I presume?\n@c0@"
  es: "@aDon Rimaldi@bAhora necesito que me hagas un favore.\r\nPuedo confiar en ti, ¿vero?\n@c0@"
  fr: "@aRodrigo Oscuroni@bPour l'instant, j'aimerais que tu me rendes un petit service. Est-ce que je peux compter sur toiⓡ\n@c0@"
  it: "@aRick Fosconi@bOra io tengo uno piacere da chiederti.\nYou sei unica persona che mi può aiutare, %a000090. Mi vuoi ascoltare, yes?\n@c0@"
  ja: "@a@bルドマン「今は\n\t私の　たのみだけ\n\t聞いて　もらえないか？\n@c0@"
86:
  de: "@aRodrigo Onassetti@bEs gibt da eine kleine Insula im Westen von Utensiel. Das ist das Dorf nördlich von hier, fallsⓚⓛ\nHörst du mir überhaupt zu?\n@c0@"
  en: "@aRodrigo Briscoletti@bThere's a small island to the west of Stockenbarrel. That's the village just north of here, if youⓚⓛ\nAre you listening?\n@c0@"
  es: "@aDon Rimaldi@bHay una piccola isla al oeste de Clavis. Es el pueblo que está al norte de aquí... ¿me escuchas, ragazzo?\n@c0@"
  fr: "@aRodrigo Oscuroni@bIl existe une petite île, à l'ouest de Saint Éloi.\nC'est le village situé juste au nord d'ici, si tu te souv... tu m'écoutesⓡ\n@c0@"
  it: "@aRick Fosconi@bA ovest di Aprianuam ci sta una small isola.\nAprianuam è villaggio che sta a nord e...\nUè, boy, mi devi ascoltare con attention, sa'! \n@c0@"
