  ja: "@a@bビアンカ「お金がなくなったら\n\t私も　ここで　はたらいて\n\t家計の足しに　しようかな……。\n@c0@"
54:
  de: "@aNera@bEs ist schrecklich, dass junge Mädchen nur des Geldes wegen eine solche Arbeit annehmen müssen.\n@c0@"
