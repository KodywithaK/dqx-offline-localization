  it: "@aNera@bSì, i Passepartout della Sorte sono oggetti molto rari. Chi riesce a procurarsene uno, se lo tiene ben stretto!\n@c0@"
  ja: "@a@bフローラ「私も　そのパスのことは\n\t聞いたことがありますわ。　たしか…\n\tセレブリティパスとか　いったような。\n@c0@"
166:
  de: "@aBianca@bNa vielen Dank, ich kann mir was Schöneres vorstellen, um in die Geschichte einzugehen!\n@c0@"
  en: "@aBianca@bI can think of better ways to go down in history, thank you very much!\n@c0@"
  es: "@aBianca@b¡Se me ocurren formas mejores de entrar en los libros de historia, si no te importa!\n@c0@"
  fr: "@aBianca@bMerci bien, mais je connais de meilleurs moyens d'entrer dans l'histoireⓠ\n@c0@"
  it: "@aBianca@bNon sa nuotare?\nAllora non faceva meglio a starsene a terra?!\n@c0@"
  ja: "@a@bビアンカ「そんな　歴史への残り方は\n\t絶対に　やめて欲しいわね。\n@c0@"
167:
  de: "@aNera@bKeine Sorge. Das Meer ist hier nicht sehr tief, also können wir nicht sinken.\n@c0@"
  en: "@aNera@bDon't worry. The sea around here isn't very deep, so there's nothing for us to sink in.\n@c0@"
  es: "@aNera@bNon ti preoccupare. El mar no es muy profundo por aquí, así que en realidad no hay forma de hundirse.\n@c0@"
  fr: "@aNera@bNe t'inquiète pas. La mer n'est pas très profonde ici,\r\nil n'y aurait pas assez d'eau pour qu'on coule.\n@c0@"
  it: "@aNera@bIo so nuotare, e bene!\nEro la prima della classe al corso di ⓕNuotologia acquaticaⓖ che frequentai all'Abbazia di Su'ncyel!\n@c0@"
  ja: "@a@bフローラ「大丈夫です。\n\tこのあたりの海は　深くないですから\n\t沈んだりしませんわ。\n@c0@"
168:
  de: "@aBianca@bUnd das bei einem Seemann! ... Wir werden doch nicht sinken, oder?\n@c0@"
  en: "@aBianca@bWhat a poor excuse for a sailor!\n...We won't sink, will we!?\n@c0@"
  es: "@aBianca@b¡Menudo marinero de pacotilla!\r\n... ¡No nos vamos a hundir!, ¿verdad?\n@c0@"
  fr: "@aBianca@bÇa, un marinⓡⓐ Tu parlesⓠ\n... On ne risque pas de couler, heinⓡⓐ\n@c0@"
  it: "@aBianca@bUn marinaio che non sa nuotare?!\nEh, sì!\nÈ proprio una vergogna!\n@c0@"
  ja: "@a@bビアンカ「なさけない　船員さんね。\n\t大丈夫かしら？\n@c0@"
169:
  de: "@aNera@bIch kann auch nicht schwimmen! Wenn es je zum Schlimmsten kommen sollte, wirst du mich doch retten, ja?\n@c0@"
  en: "@aNera@bI can't swim either. You'll have to rescue me if it ever comes to it, okay?\n@c0@"
  es: "@aNera@bTampoco sé nadar. Si se da el caso, me tendrás que rescatar, ¿va bene?\n@c0@"
  fr: "@aNera@bJe ne sais pas nager non plus. Tu devrais me sauver si jamais ça arrivait, entenduⓡ\n@c0@"
  it: "@aNera@bIn effetti, ci si aspetterebbe che i marinai sappiano nuotare...\n@c0@"
  ja: "@a@bフローラ「私も　泳げません……。\n\tもしもの時は　助けてくださいね。\n@c0@"
170:
  de: "@aBianca@bUnd das sagt er auch noch im Schlaf! Das ist wirklich ein Blaumacher!\n@c0@"
  en: "@aBianca@bFancy sayin' that in his sleep! He really is a shirker!\n@c0@"
  es: "@aBianca@b¡Mira que decir eso en sueños! ¡Vaya holgazán que está hecho!\n@c0@"
  fr: "@aBianca@bTu imagines, dire ça dans ses rêvesⓠ\nC'est vraiment un fumisteⓠ\n@c0@"
  it: "@aBianca@bUhm, a giudicare da come lo dice, non ci crede nemmeno lui!\n@c0@"
  ja: "@a@bビアンカ「寝ながら　あんなこと言うなんて\n\tよっぽど　サボっているのね。\n@c0@"
171:
  de: "@aNera@bIch fürchte, wenn der nicht aufpasst, wird er über kurz oder lang seine Stelle verlieren.\n@c0@"
  en: "@aNera@bI'm afraid that chap's likely to lose his job before long if he's not careful.\n@c0@"
  es: "@aNera@bMe temo que ese tipo se quedará pronto sin lavoro si no se anda con cuidado.\n@c0@"
  fr: "@aNera@bJe crains que ce type ne perde rapidement\r\nson travail s'il ne fait pas attention.\n@c0@"
  it: "@aNera@bLo ripete persino nel sonno!\nQuell'uomo è davvero attaccato al suo lavoro!\n@c0@"
  ja: "@a@bフローラ「残念ですが\n\tあの方は　近いうちに\n\tクビになるような気がします……。\n@c0@"
172:
  de: "@aBianca@bEr redet sogar im Schlaf noch übers Kochen! Der ist sicher Koch mit Leib und Seele !\n@c0@"
  en: "@aBianca@bNow that's dedication, dreamin' about cookin' even in your sleep!\n@c0@"
  es: "@aBianca@b¡Eso es entrega al trabajo, meter la cocina hasta en tus sueños!\n@c0@"
  fr: "@aBianca@bÇa c'est de l'implication, rêver de cuisine même dans son sommeilⓠ\n@c0@"
  it: "@aBianca@bCosà sognerà quell'uomo quando ha un incubo?\nChe gli impazzisce la maionese?\nEh eh eh!\n@c0@"
  ja: "@a@bビアンカ「寝てる間も　夢の中で\n\t料理してるなんて\n\t根っからの　料理人なのね。\n@c0@"
173:
  de: "@aNera@bMir macht Kochen wirklich Spaß. Es ist immer so aufregend zu sehen, was dabei herauskommt.\n@c0@"
  en: "@aNera@bI find cooking really good fun. It's always so exciting to see how things turn out.\n@c0@"
  es: "@aNera@bCreo que la cucina es muy entretenida. Es veramente emocionante ver cómo se cuecen las cosas.\n@c0@"
  fr: "@aNera@bJe trouve ça vraiment amusant de cuisiner.\r\nC'est toujours tellement excitant de voir\r\nce que ça va donner.\n@c0@"
  it: "@aNera@bCosa starà pensando di cucinare?\nSicuramente deve trattarsi di un piatto... da sogno!\nAh ah ah!\n@c0@"
  ja: "@a@bフローラ「お料理って　楽しいですものね。\n\tいろいろ　こりだすと\n\tとまらなくなってしまいますわ。\n@c0@"
174:
  de: "@aGriselda@bIch hatte gar keine Gelegenheit, im Kasino zu spielen, als wir unsere Hochzeit dort gefeiert haben. Das hole ich heute nach!\n@c0@"
  en: "@aDebora@bI didn't have the chance to play at the casino when we were here for our wedding, so I'm really going to have some fun today.\n@c0@"
  es: "@aStefania@bCuando estuvimos para la nostra boda no tuve ocasión de jugar, así que hoy voy a divertirme... per una vez.\n@c0@"
  fr: "@aPandora@bJe n'ai pas eu l'occaion de jouer au casino quand nous sommes venus ici pour notre mariage, alors j'ai bien l'intention de m'amuser un peu, aujourd'hui.\n@c0@"
  it: "@aViola@bIn occasione delle nostre nozze non avemmo l'opportunità di goderci il casinò, con tutte le cose a cui dovevamo pensare!\n㈡\nSpero che stavolta potremo divertirci almeno un po'...\n@c0@"
  ja: "@a@bデボラ「結婚式のときは\n\tぜんぜん　遊べなかったから\n\t今日は　思いっきり　遊ぶわよ。\n@c0@"
175:
  de: "@aGriselda@bArme Leute sind so langweilig! Ich will nicht, dass du knauserst. Verprasse so viel wie nötig!\n@c0@"
  en: "@aDebora@bPoor people are so boring! I don't want you guarding the purse strings. Spend as much as it takes!\n@c0@"
  es: "@aStefania@b¡Los pobres son veramente aburridos! ¡No te cortes y gasta lo que te parezca!\n@c0@"
  fr: "@aPandora@bLes gens pauvres sont tellement ennuyeuxⓠ Je ne veux pas que tu serres les cordons de la bourse. Dépense autant qu'il le fautⓠ\n@c0@"
  it: "@aViola@bSenza soldi non si cantano messe, caro il mio %a000090...\nE senza soldi non si può nemmeno giocare al casinò!\n@c0@"
  ja: "@a@bデボラ「これだから　貧乏人って　いや～ね。\n\tあんたは　ケチケチせずに\n\tバンバン　使いなさいよ！\n@c0@"
176:
  de: "@aGriselda@bEs klingt, als wäre sie selbst gern an Bord. Na, sie wird sich eben damit zufriedengeben müssen, dass ihr Traum zum Greifen nahe ist.\n@c0@"
  en: "@aDebora@bSounds like she'd like to be aboard herself.\r\nShe'll just have to make do with being close by instead.\n@c0@"
  es: "@aStefania@bSembra que le gustaría estar a bordo.\r\nPues tendrá que conformarse con verlo desde ahí.\n@c0@"
  fr: "@aPandora@bOn dirait qu'elle aimerait bien monter à bord. Dommage, elle va devoir se contenter de\r\nrester à proximité.\n@c0@"
  it: "@aViola@bA giudicare dal tono delle sue parole, anche lei vorrebbe essere al casinò a divertirsi. Mi sa che le toccherà accontentarsi di guardarlo da lontano...\n@c0@"
  ja: "@a@bデボラ「行くことができない人は\n\tここで　想いをはせるしか\n\tないのよね。\n@c0@"
177:
  de: "@aGriselda@bWeißt du, normalerweise kostet es auch etwas, auf den Ponton zu steigen. Aber ich hab Papas Namen erwähnt, also lassen sie uns so hinauf.\n@c0@"
  en: "@aDebora@bYou know, they usually charge people just for getting on the pontoon. But I did some name-dropping and mentioned Papa, so we got on for free.\n@c0@"
  es: "@aStefania@bNormalmente cobran a la gente por usar la pasarela, ma dejé caer algunos nombres y mencioné al mio papino y nos sale gratis. A ver si aprendes, inútil.\n@c0@"
  fr: "@aPandora@bTu sais, en général, il font payer les gens rien que pour accéder au ponton. Mais j'ai lâché le nom de papa mine de rien et on a pu monter gratuitement.\n@c0@"
  it: "@aViola@bCerto che il mio paparino poteva anche scegliere una barca più grande e dall'aspetto più rassicurante per trasferire i clienti a bordo del casinò...\n@c0@"
  ja: "@a@bデボラ「ホントは　小舟に乗るのも\n\tお金がかかるんだけど　パパの\n\t名前を出したから　タダなのよ。\n@c0@"
178:
  de: "@aGriselda@b%0%a000090! Ich hoffe, du blamierst mich jetzt nicht!\n@c0@"
  en: "@aDebora@b%0%a000090! I hope you're not going to show me up!\n@c0@"
  es: "@aStefania@b¡%0%a000090! Más te vale que no me dejes en ridículo, ¿capisci?\n@c0@"
  fr: "@aPandora@b%0%a000090ⓠ J'espère que tu n'as pas l'intention de me faire honteⓠ\n@c0@"
  it: "@aViola@bNon temere, %a000090!\nCi penserò io a non farti fare la figura dello sprovveduto! Non sarà facile, ma ci riuscirò.\n@c0@"
  ja: "@a@bデボラ「ちょっと　%a000090！\n\t私に　恥を　かかせないでよね！\n@c0@"
179:
  de: "@aGriselda@bZu arbeiten? Das ist ja wohl kaum Arbeit zu nennen. Wenn du mich fragst, stehen diese Häschenmädel bloß die ganze Zeit in der Gegend herum.\n@c0@"
  en: "@aDebora@bWork? I'd hardly call it work. Looks to me like those bunny girls just stand about the place the whole time.\n@c0@"
  es: "@aStefania@bEso no es un lavoro. A mí me parece que esas conejitas no hacen más que lucirse por ahí tutto il tempo.\n@c0@"
  fr: "@aPandora@bTravaillerⓡ Je n'appelle pas ça du travail. J'ai plutôt l'impression que ces serveuses se contentent de se promener sur place en permanence.\n@c0@"
  it: "@aViola@bIl suo sogno è di lavorare in un casinò?\nCerta gente ha ambizioni davvero misere...\n@c0@"
  ja: "@a@bデボラ「仕事って　何の仕事よ？\n\t私には　ただ　つったってるだけにしか\n\t見えないんだけど。\n@c0@"
180:
  de: "@aGriselda@bPapa ist heute nicht hier, also können wir richtig auf den Putz hauen und uns ein bisschen amüsieren!\n@c0@"
  en: "@aDebora@bPapa's not here today, so we can really go to town and have some fun!\n@c0@"
  es: "@aStefania@bIl mio papino no está hoy, ¡más te vale llevarme al centro a divertirnos!\n@c0@"
  fr: "@aPandora@bPapa n'est pas là aujourd'hui, alors on peut vraiment aller en ville et s'amuserⓠ\n@c0@"
  it: "@aViola@bM'è venuta fame... Caro, perché non vai a prendermi uno sfilatino con prosciutto di Cinghialorco?\nSenza grasso, mi raccomando...\n@c0@"
  ja: "@a@bデボラ「今日は　パパもいないし\n\t思うぞんぶん　楽しむわよ！\n@c0@"
181:
  de: "@aGriselda@bIch habe gehört, dass Papa das hier aufgebaut hat, als Nera im Stift war.\n@c0@"
  en: "@aDebora@bI heard that Papa had this place built back when Nera was away at the abbey.\n@c0@"
  es: "@aStefania@bHe oído que el mio papino hizo construir esto cuando Nera estaba en la abadía.\n@c0@"
  fr: "@aPandora@bJ'ai entendu dire que papa avait fait construire cet endroit à l'époque où Nera était à l'abbaye.\n@c0@"
  it: "@aViola@bMio padre ebbe una grande intuizione quando decise di costruire un casinò galleggiante. Quest'affare gli sta facendo guadagnare una barca di quattrini!\n@c0@"
  ja: "@a@bデボラ「ここは　フローラが修道院に\n\t行ってる間に　パパが\n\t作ったって話は　聞いてたわ。\n@c0@"
182:
  de: "@aGriselda@bUnd ich weiß noch, dass Mama drei Tage lang kein Wort mit ihm gesprochen hat, als sie es herausfand!\n@c0@"
  en: "@aDebora@bAnd as I remember it, Mama refused to speak to him for about three days when she found out!\n@c0@"
  es: "@aStefania@b¡Y creo recordar que la mamma se negó a hablar tres días con él cuando se enteró!\n@c0@"
  fr: "@aPandora@bEt si je me souviens bien, mamma a refusé de lui adresser la parole pendant près de trois jours quand elle a découvert çaⓠ\n@c0@"
  it: "@aViola@bAh ah ah! L'hai capita? La Jolly Ace è una nave, e gli sta facendo guadagnare una ⓕbarcaⓖ di quattr... Ah, non importa. Sei proprio un caso disperato...\n@c0@"
  ja: "@a@bデボラ「そういえば　その話をしてから\n\t３日くらい　ママが　口きいて\n\tあげてなかったわね。\n@c0@"
183:
  de: "@aGriselda@bEs ist leicht, den Seegang zu vergessen, wenn man sich nur fest bemüht.\n@c0@"
  en: "@aDebora@bIt's easy to forget about the motion if you put your mind to it.\n@c0@"
  es: "@aStefania@bExcepto para los blandengues come tú, no es difficile acostumbrarse al movimiento.\n@c0@"
  fr: "@aPandora@bC'est facile d'oublier le mouvement\r\nsi on se concentre vraiment.\n@c0@"
  it: "@aViola@bNon è mica colpa del mio paparino se quel tipo ha scarso senso dell'equilibrio!\n@c0@"
  ja: "@a@bデボラ「熱中してると　きっと\n\tゆれてることも　忘れるわよ。\n@c0@"
184:
  de: "@aGriselda@bJeder, der hierher kommt, ist richtig reich, also wäre es gar nicht gut, wenn den Leuten was zustoßen würde.\n@c0@"
  en: "@aDebora@bEveryone that comes here is really rich, so it would be bad news if anything untoward happened.\n@c0@"
  es: "@aStefania@bAquí solo vienen ricos, así que si sucediera algo malo podría ser veramente grave.\n@c0@"
  fr: "@aPandora@bTous ceux qui viennent ici sont vraiment très riches. Ça serait une très mauvaise nouvelle si quelque chose de fâcheux se produisait.\n@c0@"
  it: "@aViola@bChi viene al casinò desidera solo divertirsi: per questo motivo il mio paparino vuole che non ci siano problemi di alcun genere a bordo.\n@c0@"
  ja: "@a@bデボラ「ここに来られる　人たちは\n\tみんな　金持ちばかりだから\n\t何かあったら　大変よね。\n@c0@"
185:
  de: "@aGriselda@bUnbedingt! Wir sollten uns nach Kräften amüsieren, wenn wir schon mal hier sind.\n@c0@"
  en: "@aDebora@bAbsolutely! We should make the most of it and really enjoy ourselves while we're here.\n@c0@"
  es: "@aStefania@b¡Claro! Debemos aprovechar y tener un buon divertimento mientras estamos aquí.\n@c0@"
  fr: "@aPandora@bAbsolumentⓠ On devrait en profiter au maximum et s'amuser vraiment pendant qu'on est ici.\n@c0@"
  it: "@aViola@bHai sentito, %a000090?\nDivertiamoci!\n@c0@"
  ja: "@a@bデボラ「そうね　せっかくだから\n\tガンガン　楽しむわよ！\n@c0@"
186:
  de: "@aGriselda@bIn der Tat. Nur dass du mir eher immerwährende Ergebenheit als Liebe gelobt hast.\n@c0@"
  en: "@aDebora@bIndeed. Except your promise to me was more one of eternal devotion than love.\n@c0@"
  es: "@aStefania@bÈ vero. Salvo que la promesa que me hiciste fue más de devoción eterna que de amor.\n@c0@"
  fr: "@aPandora@bEn effet. Sauf qu'en ce qui nous concerne,\nta promesse était plus celle d'une éternelle\ndévotion.\n@c0@"
  it: "@aViola@bSu questa nave mi hai giurato amore eterno...\nE hai solennemente promesso che mi servirai e riverirai per tutta la vita!\n@c0@"
  ja: "@a@bデボラ「あんたが　私に誓ったのは\n\t愛っていうより　永遠の\n\tちゅうせいよね。\n@c0@"
187:
  de: "@aGriselda@bWieso hast du mich in dieses Drecksloch gebracht? Wir wollten uns doch amüsieren!\n@c0@"
  en: "@aDebora@bWhat have you brought me to this filthy hole for? We're supposed to be here to have fun.\n@c0@"
  es: "@aStefania@b¿Para qué me has traído a este agujero infecto, zuccone? Hemos venido a divertirnos.\n@c0@"
  fr: "@aPandora@bPourquoi tu m'as amenée dans ce recoin puantⓡ\nOn est censés être ici pour s'amuser.\n@c0@"
  it: "@aViola@bDi' un po', %a000090... Ma non eravamo venuti sulla Jolly Ace per divertirci?! E allora mi spieghi cosa ci facciamo qui dentro, eh?!\n@c0@"
  ja: "@a@bデボラ「ちょっと　こんな\n\tむさくるしいところなんか来て\n\t何が　楽しいのよ。\n@c0@"
188:
  de: "@aGriselda@bPapa hat mal gesagt, er hätte irgendwas so hingebogen, dass die Gewinne an den Spielautomaten sich nicht vorhersagen lassen.\n@c0@"
  en: "@aDebora@bPapa said something once about how he'd fixed it so wins on the slot machines couldn't be predicted.\n@c0@"
  es: "@aStefania@bIl mio papino me dijo una vez que lo arregló para que no se pudieran predecir los resultados de las máquinas.\n@c0@"
  fr: "@aPandora@bPapa a dit un jour qu'il avait réglé le problème afin que les gains sur les machines à sous ne soient pas prévisibles.\n@c0@"
  it: "@aViola@bSe bastasse fare qualche calcolo per vincere al gioco, tutti i matematici sarebbero milionari!\n@c0@"
  ja: "@a@bデボラ「前に　パパが\n\t計算で当てられないように\n\t改良したとか　言ってわね。\n@c0@"
189:
  de: "@aGriselda@bIch werde dir niemals sagen, dass du nicht ins Kasino darfst.\n@c0@"
  en: "@aDebora@bI'll never tell you that you can't visit a casino.\n@c0@"
  es: "@aStefania@bYo nunca te diré que no puedes visitar un casino.\n@c0@"
  fr: "@aPandora@bJe ne t'interdirai jamais de te rendre dans un casino.\n@c0@"
  it: "@aViola@bNon temere, caro: non ti permetterò mai di sperperare i nostri soldi in un casinò.\n@c0@"
  ja: "@a@bデボラ「私は　あんたに\n\tやっちゃダメとかは　言わないわよ。\n@c0@"
190:
  de: "@aGriselda@bAber ich werde dir sagen, dass du mich mitnehmen musst!\n@c0@"
  en: "@aDebora@bI will tell you that you have to take me with you, though!\n@c0@"
  es: "@aStefania@b¡Ma como se te ocurra no llevarme te acuerdas!\n@c0@"
  fr: "@aPandora@bEn revanche, je t'obligerai à m'emmener avec toiⓠ\n@c0@"
  it: "@aViola@bLi terrò di conto io, così potra usarli per comprarmi abiti, cosmetici, mobili di lusso e tante altre belle cosine.\n@c0@"
  ja: "@a@bデボラ「そのかわり　やるときは\n\t私も　カジノに　連れて行きなさいよね。\n@c0@"
191:
  de: "@aGriselda@bSpaß? Ach, wenn man verliert, macht das auf einmal Spaß?\n@c0@"
  en: "@aDebora@bGood fun? There's nothing fun about being a loser.\n@c0@"
  es: "@aStefania@b¿Dónde está el divertimento en ser un fracasado?\n@c0@"
  fr: "@aPandora@bAmusantⓡ Je ne vois pas ce qu'il y a de drôle\nà être un perdant.\n@c0@"
  it: "@aViola@bNei casinò si vince e si perde, è vero.\nDividiamoci i compiti, caro: io vincerò, e tu perderai!\n@c0@"
  ja: "@a@bデボラ「のんびり？\n\tグズグズしてると　ツキを逃がすわよ。\n@c0@"
192:
  de: "@aGriselda@bJa, sobald Papa sich mal was in den Kopf gesetzt hat, lässt er sich nicht mehr davon abbringen.\n@c0@"
  en: "@aDebora@bYep, once Papa makes his mind up about something, there's absolutely no changing it.\n@c0@"
  es: "@aStefania@bSí, cuando il mio papino te hace una oferta que no puedes rechazar, no te conviene rechazarla.\n@c0@"
  fr: "@aPandora@bOuaip. Une fois que papa a décidé quelque chose, il est absolument impossible de le faire changer d'avis.\n@c0@"
  it: "@aViola@bSì, è vero.\nL'apparato uditivo del mio paparino non riconosce la parola ⓕNOⓖ come risposta...\n@c0@"
  ja: "@a@bデボラ「ホント　パパって\n\t１度　こうだと決めたら\n\tなかなか　変えないのよね。\n@c0@"
193:
  de: "@aGriselda@bNur fünf? Das ist ja nicht gerade eine Großtat.\n@c0@"
