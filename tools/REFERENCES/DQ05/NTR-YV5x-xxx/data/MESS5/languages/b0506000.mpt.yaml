  fr: "@aBianca@bOh.\n@c0@"
  it: "@aBianca@bNo?\nForse ho capito male...\n@c0@"
  ja: "@a@bビアンカ「あっ　そう。\n@c0@"
110:
  de: "@aNera@bOnassetti hin oder her: Wenn ich hier was anfassen würde, würde ich mich anscheinend in ziemliche Schwierigkeiten bringen!\n@c0@"
  en: "@aNera@bIt looks like I'd be in a lot of trouble if I messed with anything here, no matter that I'm a Briscoletti myself!\n@c0@"
  es: "@aNera@bCreo que, veramente, me metería en un lío si toco algo de lo que hay aquí, aunque sea una Rimaldi.\n@c0@"
  fr: "@aNera@bApparemment, je risquerais beaucoup d'ennuis si je m'amusais à mettre le bazar ici. Peu importe que je sois moi-même une Oscuroniⓠ\n@c0@"
  it: "@aNera@bA giudicare dalla grinta con cui l'ha detto, il braccio me lo mozzerebbe anche se sapesse che sono la figlia del suo principale!\n@c0@"
  ja: "@a@bフローラ「いくら　ルドマンの家の者でも\n\tここの荷物に　手をつけたら\n\tしかられてしまいそうですわね……。\n@c0@"
111:
  de: "@aBianca@bJedenfalls gibt es hier eine Menge Gepäck. Es sieht aus, als wollten sich alle für eine ganze Weile hier niederlassen, was?\n@c0@"
  en: "@aBianca@bThere's certainly a lot of gear in here. Looks like everyone must've come to stay for a while, eh?\n@c0@"
  es: "@aBianca@bEso es un montón de equipaje. Parece que todo el mundo tiene pensado quedarse aquí un tiempo, ¿eh?\n@c0@"
  fr: "@aBianca@bIl est certain qu'il y a beaucoup d'affaires, ici.\nOn dirait que tout le monde a prévu de rester\nun bon moment, heinⓡ\n@c0@"
  it: "@aBianca@bQui c'è davvero una montagna di roba!\r\nPare quasi che i visitatori della Jolly Ace abbiano intenzione di trasferirsi qui in pianta stabile!\n@c0@"
  ja: "@a@bビアンカ「ホントに　すごい荷物。\n\t何日も　泊まりこむつもりで\n\tきた人ばかりなのかしら？\n@c0@"
112:
  de: "@aNera@bEs ist, als hätten die Leute vor, so lange zu bleiben, bis sie einen dicken Gewinn abräumen können, findest du nicht?\n@c0@"
  en: "@aNera@bIt's as if people are planning on staying as long as it takes to have a big win, don't you think?\n@c0@"
  es: "@aNera@bParece que las personas tienen previsto quedarse aquí tutto il tempo necesario hasta que ganen, ¿no te parece?\n@c0@"
  fr: "@aNera@bC'est comme si les gens prévoyaient de rester\ntout le temps qu'il faudra pour gagner gros,\ntu n'as pas cette impressionⓡ\n@c0@"
  it: "@aNera@bForse i clienti del casinò portano con sé tanta roba per avere qualcosa da vendersi nel caso la fortuna non arrida loro ai tavoli da gioco... Ih ih ih!\n@c0@"
  ja: "@a@bフローラ「なんだか　もうけるまで\n\t帰らないぞっていう　意気込みが\n\t荷物から見えるようですわね。\n@c0@"
113:
  de: "@aBianca@bEr geht vielleicht nicht ins Kasino, aber während der Arbeit zu schlafen ist auch nicht besser!\n@c0@"
  en: "@aBianca@bHe may not go off playin' in the casino, but surely sleepin' on the job is just as bad!\n@c0@"
  es: "@aBianca@b¡Aunque no se haya ido a jugar al casino, dormirse en su puesto es igual de malo!\n@c0@"
  fr: "@aBianca@bIl ne va peut-être pas jouer au casino, mais dormir à son poste de travail ne vaut pas beaucoup mieuxⓠ\n@c0@"
  it: "@aBianca@bUhm... Se fossi nei panni di mister Fosconi, terrei d'occhio i miei dipendenti.\nMi sa che ce n'è qualcuno che batte la fiacca...\n@c0@"
  ja: "@a@bビアンカ「カジノで遊んでなくても\n\t居眠りしてたら　さぼってるのと\n\t同じよね。\n@c0@"
114:
  de: "@aNera@bSeeleute wie er tragen die Verantwortung für das Leben der Leute hier. Da sollte man doch meinen, dass sie damit etwas sorgsamer umgehen.\n@c0@"
  en: "@aNera@bSailors like him have people's lives in their hands, so you'd really hope for a little more care to be taken.\n@c0@"
  es: "@aNera@bLos marinos como él veramente tienen las vidas de las personas en sus manosⓓ debería tener más cuidado.\n@c0@"
  fr: "@aNera@bLes marins comme lui ont entre leurs mains la vie de plusieurs personnes. On pourrait s'attendre à ce qu'il soit un peu plus consciencieux.\n@c0@"
  it: "@aNera@bQuesto sì che è un lavoratore indefesso!\nAh, ce ne fossero come lui...!\nDirò a mio padre di dargli una promozione!\n@c0@"
  ja: "@a@bフローラ「船で　はたらく方は\n\tお客さまの命を　預かっている者として\n\tしっかり　やってほしいものですわ。\n@c0@"
115:
  de: "@aBianca@bEs wäre sicher nicht schlecht, hier zu heiraten, aber erst müsste man ja all seine Gäste hierher bugsieren.\n@c0@"
  en: "@aBianca@bI s'pose it would be pretty nice gettin' married\r\nhere, but it'd be tricky to get your guests to come\r\nall this way.\n@c0@"
  es: "@aBianca@bSupongo que sería bonito casarse aquí, pero no creo que a los invitados les apetezca venir tan lejos.\n@c0@"
  fr: "@aBianca@bÇa doit être assez agréable de se marier ici, mais un peu compliqué pour faire venir les invités aussi loin.\n@c0@"
  it: "@aBianca@bAh ah ah! Il paragone mi sembra proprio azzeccato!\r\nComunque, se il matrimonio è un azzardo, spero di aver fatto la puntata giusta...\n@c0@"
  ja: "@a@bビアンカ「船での結婚式は　ステキだけど\n\tみんなに　ここまで来てもらうのは\n\t大変そうよね。\n@c0@"
116:
  de: "@aNera@bWenn ich mit Papa auf Schiffen unterwegs war, durfte ich mich immer nur in meiner eigenen Kabine und oben an Deck aufhalten.\n@c0@"
  en: "@aNera@bI was only ever allowed in my own room and out on deck when I rode on ships with Papa.\n@c0@"
  es: "@aNera@bCuando viajaba en barco con il mio papino solo tenía permesso para estar en il mio camarote y en cubierta.\n@c0@"
  fr: "@aNera@bQuand je voyageais en bateau avec papa, je n'avais le droit d'être que dans ma cabine ou sur le pont extérieur.\n@c0@"
  it: "@aNera@bOh, santa dea!\nIl matrimonio è tutt'altro che un azzardo!\n㈡\nÈ un passo importantissimo nella vita di ogni essere umano, una cosa che non si può certo fare a cuor leggero!\n@c0@"
  ja: "@a@bフローラ「私　父と船に乗るときは\n\t私たちの部屋と　甲板ぐらいしか\n\t行かせてもらえなかったの。\n@c0@"
117:
  de: "@aNera@bIch hatte keine Ahnung, dass ihm das so wichtig war.\n@c0@"
  en: "@aNera@bI had no idea that he felt so strongly\r\nabout it, though.\n@c0@"
  es: "@aNera@bPero no tenía ni idea de que se lo tomase tan en serio.\n@c0@"
  fr: "@aNera@bMais je ne pensais pas qu'il y accordait autant d'importance.\n@c0@"
  it: "@aNera@bE spero proprio che il mio matrimonio non naufraghi!\n@c0@"
  ja: "@a@bフローラ「父に　そんな思いがあったなんて\n\t私　知らなかったわ。\n@c0@"
118:
  de: "@aBianca@bDas sind eine Menge Küchengerätschaften, was? Damit könnte man alles kochen, was man nur will.\n@c0@"
  en: "@aBianca@bThat's a fair old load of cookin' utensils there, eh? You could make anythin' you liked with them.\n@c0@"
  es: "@aBianca@bAquí hay utensilios de cocina de todas clases, ¿eh? Se puede preparar cualquier cosa con ellos.\n@c0@"
  fr: "@aBianca@bC'est une sacrée batterie de cuisineⓠ Avec ça,\non doit pouvoir préparer tout ce qu'on veut.\n@c0@"
  it: "@aBianca@bA mister Fosconi piace proprio fare le cose in grande, eh?! Ha persino assunto uno chef di fama internazionale per i suoi ospiti!\n@c0@"
  ja: "@a@bビアンカ「料理道具が　けっこう\n\tそろっているわね。\n\tこれなら　どんな料理も作れそうよ。\n@c0@"
119:
  de: "@aNera@bMmm, wie das duftet! Allmählich bekomme ich Hunger.\n@c0@"
  en: "@aNera@bMmm, what a lovely smell! I'm starting to feel a bit hungry now.\n@c0@"
  es: "@aNera@b¡Mmm, qué bien huele! ¡Ho fame!\n@c0@"
  fr: "@aNera@bMmm, quelle bonne odeurⓠ Ça me donne un peu faim.\n@c0@"
  it: "@aNera@bSenti che profumino...!\nMi sta venendo una fame da lupi...\n@c0@"
  ja: "@a@bフローラ「う～ん…　いいにおい。\n\t私　少し　おなかが\n\tすいてきてしまいましたわ……。\n@c0@"
120:
  de: "@aBianca@bMeinst du, das große Schiff da drüben ist das Ventuno-Kasinoschiff, von dem Rodrigo geredet hat?\n@c0@"
  en: "@aBianca@bDo you think that big boat over there is the Ventuno casino ship Briscoletti was on about?\n@c0@"
  es: "@aBianca@b¿Tú crees que ese barco grande de ahí es el barco casino Musini del que hablaba Rimaldi?\n@c0@"
  fr: "@aBianca@bTu crois que ce gros bateau, là-bas,\nest le Vingt-et-un, le bateau casino\ndont parlait Oscuroniⓡ\n@c0@"
  it: "@aBianca@bCredi che quella grande nave sia la Jolly Ace di cui parlava mister Fosconi?\n@c0@"
  ja: "@a@bビアンカ「あそこに見える　大きな船が\n\tルドマンさんの言っていた　カジノ船？\n@c0@"
121:
  de: "@aBianca@bOb wohl das gesamte Schiff in ein Kasino umgewandelt wurde? Das könnte Spaß machen. Komm, wir schauen uns die Sache mal an.\n@c0@"
  en: "@aBianca@bI wonder if the whole boat has bin made into a casino. This could be fun! Come on, let's go and\r\nsee what's what.\n@c0@"
  es: "@aBianca@bMe pregunto si han convertido en casino el barco entero. ¡Puede ser divertido! Venga, vamos a ver qué se cuece.\n@c0@"
  fr: "@aBianca@bJe me demande si l'intégralité du bateau a été transformée en casino. Ça serait drôleⓠ\nViens, allons voir ça de plus près.\n@c0@"
  it: "@aBianca@bNon ho mai visitato un casinò galleggiante!\r\nChe ne diresti di andare a vedere di cosa si tratta?\nDai, ci divertiremo!\n@c0@"
  ja: "@a@bビアンカ「船が　まるごと\n\tカジノに　なっているのかしら。\n\t楽しみね。　さあ　行きましょうよ。\n@c0@"
122:
  de: "@aNera@bEs war so viel los auf unserer Hochzeit. Hoffentlich kannst du dich heute hier etwas genauer umsehen.\n@c0@"
  en: "@aNera@bIt was all so busy when we were here for our wedding. I hope you'll be able to enjoy looking\r\naround a bit more today.\n@c0@"
  es: "@aNera@bCuando estuvimos aquí para la nostra boda tutto bullía de actividad. Espero que hoy puedas divertirte più curioseando por aquí.\n@c0@"
  fr: "@aNera@bIl y avait tellement d'agitation quand nous sommes venus ici pour le mariage. J'espère que tu pourras\r\nen profiter un peu plus tranquillement aujourd'hui.\n@c0@"
  it: "@aNera@bQuando venimmo qui per il nostro matrimonio c'era una confusione incredibile...\r\nQuesta volta potremo rilassarci un po' di più.\n@c0@"
  ja: "@a@bフローラ「結婚式の時は\n\tゆっくり　できなかったから\n\t今日は　楽しんでくださいね。\n@c0@"
123:
  de: "@aBianca@bJa, das Kasino ist nachts manchmal richtig romantisch. Genau richtig für Flitterwöchner, nicht?\n@c0@"
  en: "@aBianca@bYeah, the casino can almost be a bit romantic of a night. Perfect for honeymooners, eh?\n@c0@"
  es: "@aBianca@bSí, una noche en el casino puede ser muy romántica. Perfecta para una luna de miel, ¿eh?\n@c0@"
  fr: "@aBianca@bOui, le casino peut même être assez romantique,\nde nuit. Parfait pour les couples en lune de miel, nonⓡ\n@c0@"
  it: "@aBianca@bDi notte questo posto ha un'atmosfera più intima e riservata...\n@c0@"
  ja: "@a@bビアンカ「夜のカジノ場って\n\tなんだか　ロマンティックかも。\n\t新婚旅行に　ぴったりね。\n@c0@"
124:
  de: "@aNera@bSie ruht sich hier aus? Meinst du, sie hat womöglich ihr ganzes Geld verloren und kann sich keine Unterkunft mehr leisten?\n@c0@"
  en: "@aNera@bShe's resting here? Do you think she lost all her money and can't afford to pay for an inn?\n@c0@"
  es: "@aNera@b¿Está descansando aquí? ¿Crees que ha perdido tutti el dinero y no se puede permitir una posada?\n@c0@"
  fr: "@aNera@bElle vient ici se reposerⓡ Tu crois qu'elle a perdu tout son argent et qu'elle ne peut pas se payer une aubergeⓡ\n@c0@"
  it: "@aNera@bMa ha intenzione di restar qui tutta la notte?!\nNon se ne va a dormire?!\n@c0@"
  ja: "@a@bフローラ「こんなところで　おやすみに？\n\t宿に泊まるお金まで　カジノで\n\tつかってしまったのかしら……？\n@c0@"
125:
  de: "@aBianca@bKomm schon! Worauf warten wir denn noch?\n@c0@"
  en: "@aBianca@bCome on! What are we waitin' for?\n@c0@"
  es: "@aBianca@b¡Vamos!, ¿a qué estamos esperando?\n@c0@"
  fr: "@aBianca@bViensⓠ Qu'est-ce qu'on attendⓡ\n@c0@"
  it: "@aBianca@bForza, andiamo!\nCosa stiamo aspettando?!\n@c0@"
  ja: "@a@bビアンカ「さあ　行きましょ。\n@c0@"
126:
  de: "@aNera@bSei vorsichtig, wenn du auf den Ponton steigst, ja, Liebling?\n@c0@"
  en: "@aNera@bMind how you go when you step onto the pontoon, won't you, darling?\n@c0@"
  es: "@aNera@bTen cuidado dónde pisas cuando pases por la pasarela, ¿de acuerdo, caro mio?\n@c0@"
  fr: "@aNera@bFais attention où tu mets les pieds, une fois\nsur le ponton, d'accord mon chériⓡ\n@c0@"
  it: "@aNera@bTesoro, tienimi la mano quando saliamo a bordo di quella barchetta...\nHo paura di cadere in acqua.\n@c0@"
  ja: "@a@bフローラ「あなた。\n\t小舟に　乗るときは\n\t足もとに　気をつけてくださいね。\n@c0@"
127:
  de: "@aBianca@bVielleicht sollte ich mir auch etwas wünschen. Ich wünsche mir, dass ich den Rest meines Lebens mit dir verbringen kann, %a000090!\n@c0@"
  en: "@aBianca@bMaybe I should make a wish too. I wish I'll spend the rest of my life with %a000090!\n@c0@"
  es: "@aBianca@bA lo mejor yo también debería pedir un deseo. ¡Deseo pasar el resto de mi vida con %a000090!\n@c0@"
  fr: "@aBianca@bPeut-être que je devrais faire un vœu, moi aussi. Je fais le vœu de passer le restant de mes jours avec %a000090ⓠ\n@c0@"
  it: "@aBianca@bAnch'io voglio esprimere un desiderio, %a000090...\nVoglio restare accanto a te per tutta la vita!\n@c0@"
  ja: "@a@bビアンカ「私も　お願いしちゃおうっと！\n\t%a000090と　ずっと　いっしょに\n\tいられますように……。\n@c0@"
128:
  de: "@aNera@bIch habe mir schon öfter etwas beim Anblick einer Sternschnuppe gewünscht, als ich zählen kann.\n@c0@"
  en: "@aNera@bI've wished upon a star more times than I can count.\n@c0@"
  es: "@aNera@bHe formulado tantos deseos después de ver una stella fugaz...\n@c0@"
  fr: "@aNera@bJ'ai fait des vœux en regardant les étoiles\r\nun nombre incalculable de fois.\n@c0@"
  it: "@aNera@bSai una cosa?\nAnch'io, tanti anni fa, espressi un desiderio guardando una stella cadente...\n@c0@"
  ja: "@a@bフローラ「私も流れ星に　何度か\n\tお願いしましたわ。\n@c0@"
129:
  de: "@aNera@bIch habe mir immer gewünscht, dass ich den Jungen wiederfinden würde, dem ich damals auf Papas Schiff begegnet war.\n@c0@"
  en: "@aNera@bI always wished that I'd find the boy I once met on Papa's ship again.\n@c0@"
  es: "@aNera@bSiempre deseaba encontrarme de nuevo con aquel niño a quien conocí en el barco del mio papino.\n@c0@"
  fr: "@aNera@bEt j'ai toujours fait mêmeⓢ celui de retrouver\nle garçon que j'avais un jour croisé sur le bateau\nde papa.\n@c0@"
  it: "@aNera@bChiesi di rivedere il bellissimo bambino che avevo incontrato da piccola su una delle navi di mio padre...\n@c0@"
  ja: "@a@bフローラ「父の船で　一度だけ会った\n\t男の子に　また会えますようにって。\n@c0@"
130:
  de: "@aBianca@bIst das nicht ein bisschen traurig, so allein zu trinken?\n@c0@"
  en: "@aBianca@bEn't it a bit sad drinkin' on your own like that?\n@c0@"
  es: "@aBianca@b¿No es un poco triste beber sola de esa manera?\n@c0@"
  fr: "@aBianca@bÇa n'est pas un peu triste de boire toute seule, comme çaⓡ\n@c0@"
  it: "@aBianca@bSorseggiare un drink sotto le stelle è senz'altro bello, ma non sarebbe meglio farlo in compagnia?\n@c0@"
  ja: "@a@bビアンカ「ひとりで　お酒を飲むのって\n\tちょっと　さみしいわよね。\n@c0@"
131:
  de: "@aNera@bWir genießen jedenfalls einen schönen Spaziergang bei sternklarem Himmel, nicht wahr, Liebling?\n@c0@"
  en: "@aNera@bWell, we're enjoying a nice walk under the stars, aren't we, darling?\n@c0@"
  es: "@aNera@bBueno, nosotros estamos disfrutando de un agradable paseo soto le stelle, ¿verdad, caro?\n@c0@"
  fr: "@aNera@bEh bien nous, nous profitons d'une agréable promenade sous les étoiles, n'est-ce pas, mon chériⓡ\n@c0@"
  it: "@aNera@bIo preferisco passeggiare sotto le stelle accanto a te, caro...\n@c0@"
  ja: "@a@bフローラ「私たちは　星空の下で\n\t散歩を　たのしむ時間ですわね。\n@c0@"
132:
  de: "@aBianca@bDann liegt dieses Schiff also nur noch vor Anker, was?\n@c0@"
  en: "@aBianca@bSo they dun't sail this ship no more, eh?\n@c0@"
  es: "@aBianca@b¿Así que este barco ya no navega, pues?\n@c0@"
  fr: "@aBianca@bAlors ce bateau ne navigue plusⓡ\n@c0@"
  it: "@aBianca@bScommetto che al Capitano mancano le avventure che viveva quando navigava sull'oceano...\nForse la vita tranquilla della Jolly Ace non fa per lui.\n@c0@"
  ja: "@a@bビアンカ「この船は　外海に\n\t出ないんだ……。\n@c0@"
133:
  de: "@aNera@bWie knuffig! Man braucht sicher viel Hingabe, um zum Schiffskapitän aufzusteigen.\n@c0@"
  en: "@aNera@bHow sweet! It must take a lot of dedication to become a ship's captain.\n@c0@"
  es: "@aNera@b¡Qué encanto! Ser capitán de un barco debe de requerir mucha entrega...\n@c0@"
  fr: "@aNera@bQuelle conscience professionnelleⓠ Ça doit être un vrai sacerdoce de devenir capitaine de navire.\n@c0@"
  it: "@aNera@bCerto che dev'essere triste per un capitano di lungo corso non navigare più in alto mare...\n@c0@"
  ja: "@a@bフローラ「立派な　おこころざしですわ。\n\t船長となられる方は　ちがいますわね。\n@c0@"
134:
  de: "@aBianca@bMeine Güte! Der ist immer im Dienst, ob er nun schläft oder wach ist, was?\n@c0@"
  en: "@aBianca@bBlimey! It's all go for him whether he's awake or asleep, eh?\n@c0@"
  es: "@aBianca@b¡Cuernos! A este le da igual estar dormido que despierto, ¿eh?\n@c0@"
  fr: "@aBianca@bSaperlipopetteⓠ Il pense à jouer tout le temps,\nmême quand il dortⓠ\n@c0@"
  it: "@aBianca@bCos'è che non può fare?!\nSono curiosa!\nVoglio saperlo!\n@c0@"
  ja: "@a@bビアンカ「寝ても　覚めても…　とは\n\tまさに　あのことね。\n@c0@"
135:
  de: "@aNera@bEr muss ein begeisterter Spieler sein, wenn er sogar noch davon träumt!\n@c0@"
  en: "@aNera@bHe must be a keen gambler to be fretting about it in his sleep!\n@c0@"
  es: "@aNera@bDebe de ser un jugador muy dedicado. ¡Hasta sogna con ello!\n@c0@"
  fr: "@aNera@bÇa doit être un sacré joueur pour que ça le perturbe à ce point dans son sommeilⓠ\n@c0@"
  it: "@aNera@bNon credo che stia sognando qualcosa di piacevole...\n@c0@"
  ja: "@a@bフローラ「夢の中でまで　カジノで\n\t勝負なさっているなんて…\n\tよほど　お好きなのね。\n@c0@"
136:
  de: "@aBianca@bNa, den hat's ganz schön erwischt!\n@c0@"
  en: "@aBianca@bHe's in a bit of a state, eh?\n@c0@"
  es: "@aBianca@bEstá un poco nerviosillo, ¿eh?\n@c0@"
  fr: "@aBianca@bIl est dans un drôle d'état, heinⓡ\n@c0@"
  it: "@aBianca@bUna fila di rotelle che vanno su e giù?!\nCredo che questo tipo dovrebbe star lontano dalle slot machine per un bel pezzo...\n@c0@"
  ja: "@a@bビアンカ「な　なんで　ここの人たちは\n\t踊ってるの？？　大丈夫かしら……。\n@c0@"
137:
  de: "@aNera@bDer arme Mann! Er scheint sehr durcheinander zu sein.\n@c0@"
  en: "@aNera@bThat poor man! He seems rather disturbed.\n@c0@"
  es: "@aNera@b¡Pobre hombre! Parece bastante alienato.\n@c0@"
  fr: "@aNera@bPauvre hommeⓠ Il a l'air plutôt perturbé.\n@c0@"
  it: "@aNera@bMa l'hai sentito?!\nSecondo me dovrebbe lasciare il casinò prima gli dia completamente di volta il cervello...\n@c0@"
