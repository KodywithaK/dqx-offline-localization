3:
  de: "@aBianca@bJa, man braucht ein ordentliches Sümmchen, um richtig ins Spiel einsteigen zu können. Sonst ist es im Nu vorbei.\n@c0@"
  en: "@aBianca@bYeah, you need a fair bit of cash before you can really have a good go at gamblin'. Otherwise it's\r\nall over in an instant.\n@c0@"
  es: "@aBianca@bSí, se necesita una cantidad importante de dinero para poder siquiera pensar en ponerse a jugar. Si no, se te acaba en un momento, ¿sabes?\n@c0@"
  fr: "@aBianca@bOui, il faut avoir pas mal d'argent avant de pouvoir vraiment commencer à parier. Sinon, tout est fini\r\nen une seconde.\n@c0@"
  it: "@aBianca@bBisogna disporre di un bel po' di quattrini, se ci si vuole divertire un po' in un casinò. Posti del genere possono prosciugare le tue finanze in un baleno!\n@c0@"
  ja: "@a@bビアンカ「そうなのよね。\n\t持ち金が少ないと　チビチビとしか\n\t遊べなくって……。\n@c0@"
4:
  de: "@aBianca@bIch hätte Lust, jetzt in unseren Flitterwochen mal was richtig Verrücktes zu tun. Aber mir ist klar, dass wir auch an unsere Zukunft denken müssen.\n@c0@"
  en: "@aBianca@bPart of me wants to go a bit wild, what with it bein' our honeymoon. But I know we need to be sensible about the future too.\n@c0@"
  es: "@aBianca@bA una parte de mí le apetece desmadrarse un pocoⓓ al fin y al cabo, es nuestra luna de miel.\n㈡\nPero ya sé que tenemos que ser sensatos, por el futuro y eso, ¿me entiendes?\n@c0@"
  fr: "@aBianca@bD'un côté, j'ai envie de me faire un peu plaisir, puisque c'est notre lune de miel.\n㈡\nEt d'un autre, je me dis qu'il faut aussi que nous soyons un peu raisonnables pour l'avenir.\n@c0@"
  it: "@aBianca@bMi piacerebbe provare l'ebbrezza del gioco, almeno una volta nella vita...\nDopotutto siamo in luna di miele, no?\n㈡\nPossiamo anche permetterci una piccola follia...\n@c0@"
  ja: "@a@bビアンカ「新婚旅行の時くらい\n\tパ～ッと遊びたいけど　今後のことを\n\t考えるとそうはできないし。　はぁ…。\n@c0@"
5:
  de: "@aNera@bIch glaube, auch mit wenig Geld kann man Spaß haben, solange man seine Erwartungen nicht zu hoch steckt.\n@c0@"
  en: "@aNera@bI think you can still have fun with a small amount of money, as long as you set your sights accordingly.\n@c0@"
  es: "@aNera@bCredo que, veramente, te puedes divertir de todos modos con una cantidad de dinero moderada, mientras tengas las expectativas adecuadas.\n@c0@"
  fr: "@aNera@bJe crois que même avec une petite somme d'argent,\r\non peut s'amuser, dès lors qu'on garde des ambitions raisonnables.\n@c0@"
  it: "@aNera@bSecondo me è possibile divertirsi in un casinò anche senza spendere troppo. Quel che conta è vivere l'atmosfera del luogo, non vincere o perdere!\n@c0@"
  ja: "@a@bフローラ「所持金が　少ないときは\n\t少ないなりの遊び方を\n\t考えるのが　楽しいと思いますわ。\n@c0@"
6:
