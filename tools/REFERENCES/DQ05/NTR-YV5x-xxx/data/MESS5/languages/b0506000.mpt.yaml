  fr: "@aBianca@bUn mariage sur un bateauⓡ Pour moi, notre mariage était plus beau que celui de n'importe qui d'autreⓠ\n@c0@"
  it: "@aBianca@bSposarsi su una nave dev'essere fantastico!\nMa il nostro matrimonio è stato molto più bello, amore mio...\n@c0@"
  ja: "@a@bビアンカ「船での結婚式か……。\n\tでも　私たちは　誰にも負けないくらい\n\tステキな結婚式をあげてもらったよね。\n@c0@"
26:
  de: "@aNera@bIch glaube, wir waren das erste Paar, das hier geheiratet hat. Und ich weiß, wir werden sehr glücklich sein.\n@c0@"
  en: "@aNera@bI think we were the first couple to be married here. And I know we're going to be really happy.\n@c0@"
  es: "@aNera@bCreo que fuimos la primera pareja que se casó aquí. Y estoy sicura de que vamos a ser molto felices.\n@c0@"
  fr: "@aNera@bJe crois que nous sommes le premier couple\r\nà s'être marié ici. Et je sais que nous allons\r\nêtre très heureux.\n@c0@"
  it: "@aNera@bCredo che noi siamo stati i primi ad aver avuto il privilegio di sposarci su questa nave, tesoro.\nOra so che saremo felici per tutta la vita...\n@c0@"
  ja: "@a@bフローラ「ここで　式をあげたのは\n\t私たちが　初めてなのだそうです。\n\tきっと　幸せになりますわ　あなた。\n@c0@"
27:
  de: "@aBianca@bSeeleute müssen wohl in Schichten arbeiten, damit immer jemand auf Wache ist. Das ist sicher keine leichte Arbeit.\n@c0@"
  en: "@aBianca@bI s'pose sailors have to work shifts so there's always someone on duty at any time of day.\r\nLooks like pretty hard work.\n@c0@"
  es: "@aBianca@bSupongo que los marineros tienen que hacer turnos para que siempre haya alguien de servicio.\r\nParece un trabajo duro, ¿sabes?\n@c0@"
  fr: "@aBianca@bJ'imagine que les marins doivent travailler par équipes afin qu'il y ait toujours quelqu'un de service à n'importe quelle heure.\n㈡\nÇa a l'air assez dur, comme travail.\n@c0@"
  it: "@aBianca@bForse è meglio se lo lasciamo tranquillo...\n@c0@"
  ja: "@a@bビアンカ「そっか　船員さんは\n\t昼夜　交代で　はたらかないと\n\tいけないのね。　大変そう。\n@c0@"
28:
  de: "@aNera@bOh! Wir sind offenbar in die Quartiere der Seeleute eingedrungen.\n@c0@"
  en: "@aNera@bOops! Looks like we've invaded the sailors' quarters.\n@c0@"
  es: "@aNera@b¡Mamma mia! Creo que hemos entrado por error en las dependencias de los marineros.\n@c0@"
  fr: "@aNera@bOupsⓠ Apparemment, nous nous sommes introduits dans les quartiers des marins.\n@c0@"
  it: "@aNera@bOps!\nQueste devono essere le cabine private dell'equipaggio! Andiamo via...\n@c0@"
  ja: "@a@bフローラ「ここは　船員さんたちの\n\tお部屋でしたのね。\n@c0@"
29:
  de: "@aBianca@bJa, es wäre schön, wenn man so viel gewinnen würde, wie man wollte, wie?\n@c0@"
  en: "@aBianca@bYeah, if only we could get in the kind of wins we expected, eh?\n@c0@"
  es: "@aBianca@bSí, sería genial que ganásemos tanto dinero como esperamos ganar, ¿me entiendes?\n@c0@"
  fr: "@aBianca@bEt oui, si seulement on pouvait prévoir ce que qu'on allait gagnerⓠ\n@c0@"
  it: "@aBianca@bAh ah ah! Ma l'hai sentito?!\nSecondo i suoi calcoli avrebbe dovuto vincere un mucchio di gettoni!\n㈡\nForse qualcuno dovrebbe spiegargli come funzionano i giochi d'azzardo...\n@c0@"
  ja: "@a@bビアンカ「私たちも　計算どおりに\n\tスロットを　当てられるといいわよね。\n@c0@"
30:
  de: "@aNera@bPapa hat irgendwas an den Automaten gedreht.\nEr sagt, es wäre doch langweilig, wenn die Gewinne in den Kasinos allzu vorhersehbar wären.\n@c0@"
  en: "@aNera@bPapa did something to the slot machines because he says it's boring if casinos pay out too predictably.\n@c0@"
  es: "@aNera@bIl mio papino modificó las máquinas tragaperras porque dice que es aburrido poder predecir cuándo vas a ganar.\n@c0@"
  fr: "@aNera@bPapa a fait quelque chose sur les machines à sous, parce qu'il dit que c'est ennuyeux si les gains sont trop prévisibles.\n@c0@"
  it: "@aNera@bNon è possibile calcolare il ⓕquandoⓖ e il ⓕquantoⓖ delle vincite in un casinò. L'unica certezza è che, alla lunga, il banco vince sempre!\n@c0@"
  ja: "@a@bフローラ「計算で当てられるカジノは\n\t楽しくないと言って　父が\n\tスロットを　改良したみたいなんです。\n@c0@"
31:
  de: "@aBianca@bJa, man darf sich nicht zu sehr hinreißen lassen. Aber ich bin ja hier, um dir über die Schulter zu schauen, also wird schon alles gut gehen.\n@c0@"
  en: "@aBianca@bYeah, you'll have to make sure you dun't get too carried away, eh? Still, I'm here lookin' over your shoulder, so you should be okay.\n@c0@"
  es: "@aBianca@bTen cuidado de no entusiasmarte mucho, ¿eh? Bueno, como te estoy vigilando, seguro que no pasa nada.\n@c0@"
  fr: "@aBianca@bOui. Il va falloir faire attention à ne pas te laisser emporter, heinⓡ Mais je vais rester à regarder\npar-dessus ton épaule, alors ça devrait aller.\n@c0@"
  it: "@aBianca@bSante parole!\n㈡\nNon temere, amore mio: sorveglierò ogni tua mossa, e ti impedirò di ridurci sul lastrico scommettendo tutti i nostri averi in questa trappola per gonzi...\n@c0@"
  ja: "@a@bビアンカ「%a000090も　あんまり\n\tハマらないようにしてね。\n\tま　私がついてるから　大丈夫か！\n@c0@"
32:
  de: "@aNera@bWelcher von ihnen wohl ihr Mann ist?\n@c0@"
  en: "@aNera@bI wonder which one of them is her husband.\n@c0@"
  es: "@aNera@bMa cuál de ellos será il suo esposo.\n@c0@"
  fr: "@aNera@bJe me demande lequel d'entre eux est son mari.\n@c0@"
  it: "@aNera@bQuella donna è una persona molto saggia...\nSperiamo che riesca a tenere a freno suo marito!\n@c0@"
  ja: "@a@bフローラ「ダンナさんって\n\tどの方かしら……。\n@c0@"
33:
  de: "@aBianca@bMeinst du, es macht ihm wirklich immer noch Spaß, wenn er verliert?\n@c0@"
  en: "@aBianca@bD'you think he'd really be havin' fun if he lost, then?\n@c0@"
  es: "@aBianca@b¿Tú crees que se estaría divirtiendo si perdiese?\n@c0@"
  fr: "@aBianca@bTu crois vraiment qu'il s'amuserait s'il perdaitⓡ\n@c0@"
  it: "@aBianca@bSì, credo che si diverta molto di meno quando perde...\nA dir la verità, mi stupirei del contrario!\n@c0@"
  ja: "@a@bビアンカ「……というわけで\n\tあの人は　負けたから\n\tのんびりしているのね。\n@c0@"
34:
  de: "@aNera@bDas stimmt. Es ist wahrscheinlich eine gute Idee, etwas zur Aufmunterung zu finden, für den Fall, dass man verliert.\n@c0@"
  en: "@aNera@bThat's exactly right. It's probably a good idea to\r\nfind something to do that will lift your spirits\r\nwhen you lose.\n@c0@"
  es: "@aNera@bEso es muy razonable. Probablemente es una buona idea encontrar algo que hacer para animarse cuando pierdes.\n@c0@"
  fr: "@aNera@bC'est très juste. C'est sans doute une bonne idée\r\nde trouver quelque chose à faire pour se remonter le moral quand on perd.\n@c0@"
  it: "@aNera@bRiuscire ad accettare la sconfitta con il sorriso sulle labbra è la prima regola da imparare se ci si vuole divertire in un casinò.\n@c0@"
  ja: "@a@bフローラ「そうですわね。\n\t負けたときは　気分をかえるような\n\tことをすると　いいかも知れませんわ。\n@c0@"
35:
  de: "@aBianca@bTja, einen Kapitän wird man hier wohl brauchen, wo das doch ein Schiff ist und so.\n@c0@"
  en: "@aBianca@bI s'pose the place does need a captain, bein' a boat and all.\n@c0@"
  es: "@aBianca@bSupongo que esto necesita un capitánⓓ bueno, es un barco, ¿no?\n@c0@"
  fr: "@aBianca@bJ'imagine que puisque cet endroit est un bateau,\r\nil lui faut effectivement un capitaine.\n@c0@"
  it: "@aBianca@bAnche se è un casinò, la Jolly Ace resta pur sempre una nave e, in quanto tale, ha bisogno di un comandante!\n@c0@"
  ja: "@a@bビアンカ「カジノとはいえ　船ですもの\n\t船長さんが　必要よね。\n@c0@"
36:
  de: "@aNera@bEr akzeptiert wirklich kein Nein. Manchmal ist das ziemlich peinlich.\n@c0@"
  en: "@aNera@bHe really doesn't take no for an answer. It can be quite embarrassing at times.\n@c0@"
  es: "@aNera@bNunca acepta una negativa per respuesta. A veces te hace sentir incómoda.\n@c0@"
  fr: "@aNera@bC'est vrai qu'il n'abandonne jamais.\r\nC'est parfois un peu embarrassant.\n@c0@"
  it: "@aNera@bIl Capitano ha ragione: mio padre non accetta mai un ⓕnoⓖ come risposta.\nNemmeno dai suoi familiari!\n@c0@"
  ja: "@a@bフローラ「父は　押しが強いというか\n\tわがままなんですわ。\n\tはずかしいです……。\n@c0@"
37:
  de: "@aBianca@bDas ist bestimmt sehr eindrucksvoll, aber du hast doch schon mindestens zehnmal so viele Kämpfe überstanden, oder nicht, %a000090?\n@c0@"
  en: "@aBianca@bThat is pretty impressive, but you've bin through at least ten times that many fights, eh, %a000090?\n@c0@"
  es: "@aBianca@bSí, muy impresionante, pero tú has estado al menos en diez veces más peleas, ¿verdad, %a000090?\n@c0@"
  fr: "@aBianca@bC'est assez impressionnant, mais tu as remporté\nau moins dix fois plus de combats que ça, hein, %a000090ⓡ\n@c0@"
  it: "@aBianca@bIl Capitano è sopravvissuto a ⓕbenⓖ cinque attacchi dei mostri?! Bah, roba da nulla, in confronto a quanti ne hai superati tu! Dico bene, %a000090?\n@c0@"
  ja: "@a@bビアンカ「たしかに　すごいけど\n\t%a000090は　もう　なん十回も\n\tしゅうげきを　乗り切っているのよね。\n@c0@"
38:
  de: "@aNera@b...\n@c0@"
  en: "@aNera@b............\n@c0@"
  es: "@aNera@b...\n@c0@"
  fr: "@aNera@b............\n@c0@"
  it: "@aNera@b...\n@c0@"
  ja: "@a@bフローラ「…………。\n@c0@"
39:
  de: "@aNera@bIch glaube, du hast schon viel mehr erreicht als das.\n@c0@"
  en: "@aNera@bI think you're much more accomplished than that.\n@c0@"
  es: "@aNera@bIo penso que tú estás bastante por encima de eso.\n@c0@"
  fr: "@aNera@bJe crois que tu en as connu bien plus que ça.\n@c0@"
  it: "@aNera@bCinque attacchi dei mostri, eh?\nPiù o meno è lo stesso numero di battaglie che tu affronti nell'arco di una mezz'ora! Ih ih ih!\n@c0@"
  ja: "@a@bフローラ「あなたのほうが\n\tずっと　すごいですわよね。\n@c0@"
40:
  de: "@aBianca@bEs kommt mir in der heutigen Zeit wirklich ein bisschen leichtsinnig vor, nur zum Vergnügen herumzureisen.\n@c0@"
  en: "@aBianca@bIt does seem a bit frivolous to be travellin' about for fun in this day and age.\n@c0@"
  es: "@aBianca@bMe parece una frivolidad viajar por diversión en estos tiempos.\n@c0@"
  fr: "@aBianca@bC'est vrai que ça paraît un peu frivole de voyager pour s'amuser en ces temps troublés.\n@c0@"
  it: "@aBianca@bSì, è vero: di questi tempi, viaggiare può essere davvero pericoloso!\n@c0@"
  ja: "@a@bビアンカ「この　ご時世に\n\t奥さまが旅行なんて　ゆうがね。\n@c0@"
41:
  de: "@aNera@bSie muss eine starke Frau sein, wenn sie unter diesen Umständen reist.\n@c0@"
  en: "@aNera@bShe must be a strong woman to be travelling about under these circumstances.\n@c0@"
  es: "@aNera@bDebe de ser una mujer molto forte para viajar en estas circunstancias.\n@c0@"
  fr: "@aNera@bÇa doit être une femme courageuse pour voyager dans ces circonstances.\n@c0@"
  it: "@aNera@bForse qualcuno dovrebbe dire alla sua padrona che questo non è il periodo più adatto per girare il mondo...\n@c0@"
  ja: "@a@bフローラ「私のほかにも　女の身で\n\t旅をなさっている方がいらっしゃるとは\n\t心強いですわ。\n@c0@"
42:
  de: "@aBianca@bMeine Güte! Ich hätte nicht erwartet, dass sie derart elegante Zimmer auf einem Schiff haben. Du etwa, %a000090?\n@c0@"
  en: "@aBianca@bBlimey! You wouldn't have thought they'd have rooms this grand on a ship, eh, %a000090?\n@c0@"
  es: "@aBianca@b¡Cuernos! A primera vista no parece que vayan a tener camarotes tan enormes en un barco, ¿eh, %a000090?\n@c0@"
  fr: "@aBianca@bBon sangⓠ Qui aurait cru qu'il pouvait y avoir de si grandes pièces sur un bateau, hein, %a000090ⓡ\n@c0@"
  it: "@aBianca@bPerò, quel Fosconi!\r\nLe ha pensate proprio tutte per rendere gradevole il soggiorno dei suoi facoltosi clienti, eh?\n@c0@"
  ja: "@a@bビアンカ「見てよ　%a000090。\n\t船の中とは　思えないぐらい\n\t立派な　お部屋よね。\n@c0@"
43:
  de: "@aNera@bIch mag das Meer, seit wir zusammen auf Reisen sind, %a000090. Der Sternenhimmel sieht an Bord eines Schiffes so wunderbar aus.\n@c0@"
  en: "@aNera@bI've come to like the sea since we started our journey together, %a000090. It's wonderful to look at the stars from onboard a ship.\n@c0@"
  es: "@aNera@bDesde que empezamos il nostro viaje in sieme le he tomado gusto al mar, %a000090. Es maravilloso contemplar las estrellas desde un barco.\n@c0@"
  fr: "@aNera@bJe me suis mise à apprécier la mer depuis que nous avons commencé à voyager ensemble, %a000090.\n㈡\nC'est merveilleux de contempler les étoiles depuis\nle pont d'un navire.\n@c0@"
  it: "@aNera@b%0%a000090, per me ogni esperienza è unica e insuperabile...\nMi basta che ci sia tu al mio fianco.\n@c0@"
  ja: "@a@bフローラ「私も　あなたと旅を始めてから\n\t海が　好きになりましたわ。\n\t船から見る　星空は　最高ですわね。\n@c0@"
44:
  de: "@aNera@bHe he! Es war, als hätten wir in einer riesigen Wiege geschlafen, findest du nicht, Liebling?\n@c0@"
  en: "@aNera@bHe he he! It was like sleeping in a big rocking cradle last night, wasn't it, darling?\n@c0@"
  es: "@aNera@b¡Je, je, je! Esta noche ha sido como dormir en una gran mecedora, ¿verdad, caro mio?\n@c0@"
  fr: "@aNera@bHi hiⓠ La nuit dernière, c'était un peu comme dormir dans un grand berceau, n'est-ce pas, mon chériⓡ\n@c0@"
  it: "@aNera@bIo ho riposato benissimo, amore mio...\nE, a giudicare da come russavi, anche tu hai dormito come un sasso! Eh eh eh!\n@c0@"
  ja: "@a@bフローラ「うふふ。\n\tゆうべは　大きなゆりかごの中で\n\t眠ったような　気分ですわ。\n@c0@"
45:
  de: "@aBianca@bSo gut habe ich schon lange nicht mehr geschlafen. Und du hast geschlummert wie ein Murmeltier, %a000090.\n@c0@"
  en: "@aBianca@bThat was the best night's sleep I've had in ages.\nYou were out for the count as well, %a000090.\n@c0@"
  es: "@aBianca@bEsta noche he dormido como hacía siglos que no dormía.\n㈡\nY tú también estabas fuera de combate, %a000090, ¿sabes?\n@c0@"
  fr: "@aBianca@bC'est la meilleure nuit de sommeil que j'ai passée depuis bien longtemps. Toi aussi, tu as dormi comme un loir, %a000090.\n@c0@"
  it: "@aBianca@bNon avevo mai dormito tanto bene in vita mia, %a000090.\nStare accanto a te mi rilassa e mi tranquillizza...\n@c0@"
  ja: "@a@bビアンカ「あのベッド　すごく\n\tねごこちが　よかったね。\n\t%a000090も　ぐっすりだったわよ。\n@c0@"
46:
  de: "@aBianca@bWas für ein Tanz! Wenn sich den jemand näher ansehen wollte, würde er bestimmt sein blaues Wunder erleben!\n@c0@"
  en: "@aBianca@bWhat a dance! If any bloke fancied a closer look at the footwork, she'd knock him for six no trouble!\n@c0@"
  es: "@aBianca@b¡Menudo baile! ¡Si cualquiera se le acerca un poco más a los pies, seguro que lo deja KO!\n@c0@"
  fr: "@aBianca@bQuelle danseⓠ Si quelqu'un s'approchait de plus près pour regarder les pas, je crois qu'elle lui ferait voir trente-six chandellesⓠ\n@c0@"
  it: "@aBianca@bNon è scivolata! Ha perso l'equilibrio perché ha preso a calci un tipo che si era avvicinato per guardarle il... Ehm, per guardare il suo modo di ballare...\n@c0@"
  ja: "@a@bビアンカ「すごい　ダンスね。\n\tあれなら　足を見ようと　近づく男も\n\t一発で　ノックアウトだわ。\n@c0@"
47:
  de: "@aNera@bIch würde an deiner Stelle nicht zu nahe herantreten, sonst kriegst du auch noch einen Fußtritt ab.\n@c0@"
  en: "@aNera@bI wouldn't get too close if I were you, otherwise you might get kicked too.\n@c0@"
  es: "@aNera@bYo no me acercaría demasiado, caro mio, o quizá tú también recibas una patada.\n@c0@"
  fr: "@aNera@bÀ ta place, je ne m'approcherais pas trop.\r\nTu risquerais de te prendre un coup de pied,\r\ntoi aussi.\n@c0@"
  it: "@aNera@bCaro, cerca di non avvicinarti troppo a quella signorina!\nScommetto che le piacerebbe ⓕscivolareⓖ su di te!\n@c0@"
  ja: "@a@bフローラ「あなたも　あまり近づくと\n\tけられますわよ。\n@c0@"
48:
  de: "@aBianca@bWenn sie ihre Köpfe so in den Nacken legen, kann man in ihre Nasenlöcher gucken! Igitt!\n@c0@"
  en: "@aBianca@bYou can see right up everyone's nostrils when they crane their necks up at the stage like that. Yuck!\n@c0@"
  es: "@aBianca@bFíjate, todos estiran el cuello hacia el escenario como si fuesen avestruces. ¡Puaj!\n@c0@"
  fr: "@aBianca@bTout le monde se dévisse tellement la tête pour avoir une bonne vue de ce qui se passe sur la scène qu'on peut même voir leurs poils de nez. Beurkⓠ\n@c0@"
  it: "@aBianca@bGià...\nPer qualcuno il vero spettacolo non sono le slot machine né i tavoli da gioco, ma le ballerine...\n@c0@"
  ja: "@a@bビアンカ「ステージに　上がると\n\t鼻の下をのばして見てる　お客さんの\n\t顔がよく見えて　ちょっとイヤかも。\n@c0@"
49:
  de: "@aNera@bDer Tanz ist wirklich sehr aufregend, aber die Kostüme womöglich noch mehr!\n@c0@"
  en: "@aNera@bThe dance is thrilling, indeed, but I think the outfits might be even more so!\n@c0@"
  es: "@aNera@b¡El baile es emocionante, pero creo que los vestidos aún lo son più!\n@c0@"
  fr: "@aNera@bC'est vrai que sa danse peut donner des frissons, mais je crois que sa tenue n'est pas totalement étrangère au phénomèneⓠ\n@c0@"
  it: "@aNera@bLe ballerine sono proprio brave, caro.\r\nNon c'è bisogno che tu le guardi, sai?\r\nCi penso io a raccontarti come danzano!\n@c0@"
  ja: "@a@bフローラ「ダンスも　すごいですけど\n\t衣装も　すごいですわ。\n\tぽっ……。\n@c0@"
50:
  de: "@aBianca@bVielleicht sollte ich es einmal versuchen, was?\n@c0@"
  en: "@aBianca@bMaybe I should give it a go, eh?\n@c0@"
  es: "@aBianca@bPodríamos probar, ¿eh?\n@c0@"
  fr: "@aBianca@bJe devrais peut-être essayer, nonⓡ\n@c0@"
  it: "@aBianca@bE se diventassi anch'io una ballerina?\n@c0@"
  ja: "@a@bビアンカ「私も　ちょっと\n\tやってみようかしら？\n@c0@"
51:
  de: "@aBianca@bHa ha! War doch bloß ein Witz!\n@c0@"
  en: "@aBianca@bHa ha! Only jokin'!\n@c0@"
  es: "@aBianca@b¡Ja, ja! ¡Era una broma!\n@c0@"
  fr: "@aBianca@bHa haⓠ Je plaisanteⓠ\n@c0@"
  it: "@aBianca@bUhm, no...\nLa danza non fa per me.\r\nE poi non mi piace essere al centro dell'attenzione!\n@c0@"
  ja: "@a@bビアンカ「うふふ。　じょうだんよ。\n@c0@"
52:
  de: "@aNera@bHätte ich nur den Mut, so wie sie vor allen Leuten zu tanzen!\n@c0@"
  en: "@aNera@bIf only I had the courage to dance in front of people like they do.\n@c0@"
  es: "@aNera@bSi yo tuviese el valor de bailar en público come ellas...\n@c0@"
  fr: "@aNera@bSi seulement j'avais le cran de danser devant\r\ndes gens comme elles le font.\n@c0@"
  it: "@aNera@bAmmiro molto le ballerine, sai?\nIo non avrei mai il coraggio di esibirmi davanti a tanta gente...\n@c0@"
  ja: "@a@bフローラ「私にも　こういう場所で\n\t踊る勇気があるといいんですけど……。\n@c0@"
53:
  de: "@aBianca@bVielleicht kann ich mir hier eine Arbeit suchen, wenn uns je das Geld ausgeht, was?\n@c0@"
  en: "@aBianca@bMaybe I should get a job here if ever we run out of money then, eh?\n@c0@"
  es: "@aBianca@bA lo mejor podría conseguir trabajo aquí si alguna vez nos quedamos sin dinero, ¿qué te parece?\n@c0@"
