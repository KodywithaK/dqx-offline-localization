  es: "@aStefania@bEs megliore ponerse y ver qué pasa que tratar de proyectar una ruta. ¡En este juego nunca se sabe!\n@c0@"
  fr: "@aPandora@bIl vaut mieux se lancer et voir ce qui se passe plutôt que d'essayer de prévoir un itinéraire. On ne sait jamais comment la chance va tournerⓠ\n@c0@"
  it: "@aViola@bLa Tavola della Sorte è un gioco troppo difficile.\nSecondo me l'unico modo per vincere è chiedere una grazia alla dea...\n@c0@"
  ja: "@a@bデボラ「うだうだ　考えるより\n\t思い切って進んだほうが\n\tあんがい　うまくいくと思うわよ。\n@c0@"
223:
  de: "@aGriselda@bDarauf sollten wir bei unserem Wurf besser auch achten.\n@c0@"
  en: "@aDebora@bWe'd better watch out for that when we're rolling too.\n@c0@"
  es: "@aStefania@bHabrá que tenerlo en cuenta cuando nos toque tirar, ¿capito?\n@c0@"
  fr: "@aPandora@bOn a intérêt à se méfier de ça quand on lancera, nous aussi.\n@c0@"
  it: "@aViola@bDavvero la nave si è inclinata?\nIo non me ne sono accorta...\n@c0@"
  ja: "@a@bデボラ「これは　サイコロを\n\t投げるときは　注意したほうが\n\tよさそうね。\n@c0@"
224:
  de: "@aGriselda@bIch würd' ja gern wissen, wer überhaupt die T&T-Tickets herstellt.\n@c0@"
  en: "@aDebora@bI wonder who makes T 'n' T tickets anyway.\n@c0@"
  es: "@aStefania@b¿Quién fabricará los boletos de T y T?\n@c0@"
  fr: "@aPandora@bÀ ce propos, je me demande qui fabrique\r\nles tickets de TNT.\n@c0@"
  it: "@aViola@bNemmeno io so di preciso come si fa per entrare in possesso dei biglietti della Sorte.\nA chi ci si deve rivolgere per ottenerne qualcuno?\n@c0@"
  ja: "@a@bデボラ「そもそも　すごろく券って\n\t誰が　作ってんの？\n@c0@"
225:
  de: "@aGriselda@bGenau! Besser, man geht nach dem Instinkt. So gewinnt man, wenn du mich fragst.\n@c0@"
  en: "@aDebora@bPrecisely! It's better just to go with your gut.\r\nThat's the way to win, if you ask me.\n@c0@"
  es: "@aStefania@b¡È vero! Es mejor dejarse guiar por el instinto.\r\nEs el modo de ganar, si quieres mi opinión. Y si no la quieres.\n@c0@"
  fr: "@aPandora@bExactementⓠ Il vaut mieux y aller avec ses tripes. C'est le meilleur moyen de gagner, d'après moi.\n@c0@"
  it: "@aViola@bSono assolutamente d'accordo!\nInfatti, quando punto i TUOI gettoni, sono totalmente calma e rilassata, e mi diverto tantissimo!\n@c0@"
  ja: "@a@bデボラ「そうそう！　こういうのは\n\t直感で勝負するほうが\n\tいい結果に　つながるのよ！\n@c0@"
226:
  de: "@aGriselda@bAls würde ich so was tun! Wie kann er es wagen, das auch nur anzudeuten!\n@c0@"
  en: "@aDebora@bAs if I would! How dare he insinuate such a thing!\n@c0@"
  es: "@aStefania@b¡Como si fuera a hacerlo! ¿Cómo tiene il coraggio de insinuarlo siquiera?\n@c0@"
  fr: "@aPandora@bComme si j'en avais l'intentionⓠ Comment\nose-t-il insinuer une chose pareilleⓡⓐ\n@c0@"
  it: "@aViola@bNon avrà mica voluto insinuare che volevamo allungare le mani sugli oggetti che ci sono qui dentro, eh?! Non siamo mica dei ladri!\n@c0@"
  ja: "@a@bデボラ「この私が　手をつけるはずが\n\tないじゃない！　失礼ね！！\n@c0@"
227:
  de: "@aGriselda@bAll dieses Gepäck! Sieht ja fast so aus, als wollten manche hier ihren festen Wohnsitz aufschlagen.\n@c0@"
  en: "@aDebora@bIt looks like some people have moved here permanently, what with all this luggage.\n@c0@"
  es: "@aStefania@bSembra que algunos se han mudado aquí permanentemente, con tutto el equipaje.\n@c0@"
  fr: "@aPandora@bOn dirait que certains se sont installés ici définitivement, avec une quantité de\r\nbagages pareille.\n@c0@"
  it: "@aViola@bMa quanti bagagli si portano dietro i clienti del casinò?!\nNemmeno io vado in giro con tanta roba!\n@c0@"
  ja: "@a@bデボラ「まるで　この船に\n\t引っ越してきたみたいな　荷物ね。\n@c0@"
228:
  de: "@aGriselda@bDer hat Nerven, so frech direkt vor meinen Augen blauzumachen!\n@c0@"
  en: "@aDebora@bHe's got some nerve slacking off from his work so blatantly right in front of me!\n@c0@"
  es: "@aStefania@b¡Qué valor tiene para remolonear de ese modo delante del mio naso!\n@c0@"
  fr: "@aPandora@bIl ne manque pas de culot de tirer au flanc\ncomme ça, juste sous mon nezⓠ\n@c0@"
  it: "@aViola@bCredo che quel tipo non si sia reso conto che io sono la figlia del suo datore di lavoro!\n@c0@"
  ja: "@a@bデボラ「私の目の前で\n\t堂々と　サボるって\n\tなかなか　いい度胸ね！！\n@c0@"
229:
  de: "@aGriselda@bEr ist wahrscheinlich der Grund, weshalb Papa nicht wollte, dass ich hier runterkomme.\n@c0@"
  en: "@aDebora@bHe's probably the reason Papa didn't want me down here.\n@c0@"
  es: "@aStefania@bProbabilmente él sea el motivo de que il mio papino no me quisiera aquí abajo.\n@c0@"
  fr: "@aPandora@bC'est sûrement à cause de lui que papa ne voulait pas que je descende ici.\n@c0@"
  it: "@aViola@bSo di aver fatto un azzardo a sposare un pappamolle come te, caro, ma... Che ci vuoi fare?\r\nAl cuore non si comanda!\n@c0@"
  ja: "@a@bデボラ「そういう　理由で\n\tパパが　私を連れてこなかったわけね。\n@c0@"
230:
  de: "@aGriselda@bTja, die sind alle reich, also sind sie bestimmt sehr eigen mit dem Essen.\n@c0@"
  en: "@aDebora@bWell, they're all rich folk, so I suppose they're bound to be quite fussy when it comes to their food.\n@c0@"
  es: "@aStefania@bVa bene, todos son ricos, así que supongo que serán bastante exigentes con la sua comida.\n@c0@"
  fr: "@aPandora@bCe sont tous des gens riches, alors je suppose qu'ils sont assez difficiles en matière de nourriture.\n@c0@"
  it: "@aViola@bIl mio paparino non poteva che assumere uno chef di livello assoluto per soddisfare gli appetiti dei suoi esigentissimi ospiti...\n@c0@"
  ja: "@a@bデボラ「お金持ちが　大勢\n\t乗ってるんだから\n\t味にうるさいのも　当然よね。\n@c0@"
231:
  de: "@aGriselda@bIch hatte gar keine Gelegenheit, im Kasino zu spielen, als wir unsere Hochzeit dort gefeiert haben. Das hole ich heute nach!\n@c0@"
  en: "@aDebora@bI didn't have the chance to play at the casino when we were here for our wedding, so I'm really going to have some fun today.\n@c0@"
  es: "@aStefania@bCuando estuvimos para la nostra boda no tuve ocasión de jugar, así que hoy voy a divertirme... per una vez.\n@c0@"
  fr: "@aPandora@bJe n'ai pas eu l'occaion de jouer au casino quand nous sommes venus ici pour notre mariage, alors j'ai bien l'intention de m'amuser un peu, aujourd'hui.\n@c0@"
  it: "@aViola@bIn occasione delle nostre nozze non avemmo l'opportunità di goderci il casinò, con tutte le cose a cui dovevamo pensare!\n㈡\nSpero che stavolta potremo divertirci almeno un po'…\n@c0@"
  ja: "@a@bデボラ「結婚式のときは\n\tぜんぜん　遊べなかったから\n\t今日は　思いっきり　遊ぶわよ。\n@c0@"
232:
  de: "@aGriselda@bSie redet von der Ventuno des Nachts, aber was kann sie von hier aus schon davon mitkriegen?\n@c0@"
  en: "@aDebora@bShe's going on about the Ventuno at night, but what would she know about it from being stood here?\n@c0@"
  es: "@aStefania@bDe notte merodea cerca del Musini, ¿ma qué puede saber de él si se queda ahí?\n@c0@"
  fr: "@aPandora@bElle parle du Vingt-et-un la nuit, mais\nqu'est-ce qu'elle peut bien en savoir\nsi elle reste ici tout le tempsⓡ\n@c0@"
  it: "@aViola@bLa Jolly Ace non perde il suo fascino nemmeno di notte.\nÈ davvero bellissima...\n@c0@"
  ja: "@a@bデボラ「夜更けのカジノ船って\n\tここは　カジノ船の　外じゃないのよ。\n@c0@"
233:
  de: "@aGriselda@bNormalerweise muss man vorher reservieren, um auf den Ponton zu gelangen, aber sie lassen dich hinauf, weil du in meiner Begleitung bist.\n@c0@"
  en: "@aDebora@bYou usually have to make a reservation to get on the pontoon, but they're letting you on because you're with me.\n@c0@"
  es: "@aStefania@bNormalmente hace falta riserva para entrar al Musini, pero te dejan entrar porque vas con me. No lo olvides.\n@c0@"
  fr: "@aPandora@bIl faut en général faire une réservation pour accéder au ponton, mais ils te laissent y\r\naccéder parce que tu es avec moi.\n@c0@"
  it: "@aViola@bDi solito bisogna prenotarsi con largo anticipo, se si vuole salire sulla Jolly Ace.\n㈡\nPer la figlia del proprietario, però, il personale di bordo farà volentieri un'eccezione!\n@c0@"
  ja: "@a@bデボラ「ホントは　小舟に乗るのも\n\t予約制だけど　私がいるから\n\t顔パスなのよ。\n@c0@"
234:
  de: "@aGriselda@bSich etwas wünschen beim Anblick einer Sternschnuppe? Zeitverschwendung, wenn du mich fragst.\n@c0@"
  en: "@aDebora@bWishing upon a star?\nWaste of time if you ask me.\n@c0@"
  es: "@aStefania@b¿Has pedido un deseo?\nQué blandengue, es una pérdida di tempo.\n@c0@"
  fr: "@aPandora@bFaire un vœu en regardant une étoileⓡ\nUne belle perte de temps, si tu veux mon avis.\n@c0@"
  it: "@aViola@bMa chi s'è inventato che vedere una stella cadente garantisce che un desiderio si avveri?!\nSecondo me è solo una frottola gigantesca!\n@c0@"
  ja: "@a@bデボラ「流れ星に　願い事？\n\tそんな　あたりもしないこと\n\t私はしないわよ。\n@c0@"
235:
  de: "@aGriselda@bHmmm, klingt gut. Aber du siehst aus, als wäre dir eine ordentliche Mahlzeit lieber als ein Glas Champagner.\n@c0@"
  en: "@aDebora@bMmm, sounds nice. You look like you'd prefer a decent meal to a flute of champagne, mind you.\n@c0@"
  es: "@aStefania@bMmm, suena bene. Tú tienes más pinta de preferir una comida rispettabile a una copa de champán.\n@c0@"
  fr: "@aPandora@bMmm, ça a l'air pas mal, en effet. Mais toi, tu m'as l'air de préférer un bon repas à une coupe de champagne.\n@c0@"
  it: "@aViola@bUn drink sotto le stelle? Uhm, perché no?\nForza, vammi a prendere un bel succo d'arancia con ghiaccio. E di corsa!\n@c0@"
  ja: "@a@bデボラ「あら　おいしそうね。\n\tでも　あんたは　お酒より\n\t食事がしたいって　顔してるわね。\n@c0@"
236:
  de: "@aGriselda@bDabei fällt mir ein, machst du eigentlich jeden Tag ordnungsgemäß deine Eintragungen ins Logbuch?\n@c0@"
  en: "@aDebora@bCome to think of it, are you filling out our ship's log properly every day?\n@c0@"
  es: "@aStefania@bAhora que lo pienso, ¿estás rellenando apropiadamente la bitácora del barco tutti los días?\n@c0@"
  fr: "@aPandora@bMaintenant que j'y pense, est-ce que tu remplis correctement le journal de bord de notre bateau tous les joursⓡ\n@c0@"
  it: "@aViola@bA proposito, %a000090...\nStai compilando correttamente il diario di bordo della nostra nave?\n@c0@"
  ja: "@a@bデボラ「そういえば　うちの\n\t船の航海日誌って\n\tちゃんと　つけてる？\n@c0@"
237:
  de: "@aGriselda@bIch hab dich noch nie dabei gesehen. Was soll die Heimlichtuerei?\n@c0@"
  en: "@aDebora@bI've never seen you doing it.\nWhy the secrecy?\n@c0@"
  es: "@aStefania@bNunca te he visto hacerlo, ¿a qué viene tanta discrezione?\n@c0@"
  fr: "@aPandora@bJe ne t'ai jamais vu le faire.\nPourquoi tant de mystèreⓡ\n@c0@"
  it: "@aViola@bDavvero?\nSecondo me stai mentendo. Non ti ho mai visto scriverci sopra nemmeno una parola!\n@c0@"
  ja: "@a@bデボラ「つけてるところを\n\t見たことがないけど\n\tこっそり　つけてたのね。\n@c0@"
238:
  de: "@aGriselda@bWas?! Und was meinst du, wessen Aufgabe das ist, wenn nicht deine?\n@c0@"
  en: "@aDebora@bWhat!? Who do you expect to do it if you don't?\n@c0@"
  es: "@aStefania@b¿Qué? ¿Y quién esperas que lo haga si no, lerdo?\n@c0@"
  fr: "@aPandora@bQuoiⓡⓐ Et d'après toi, qui doit s'en charger,\nsi ce n'est pas toiⓡ Tu peux me le direⓡ\n@c0@"
  it: "@aViola@bAvrei dovuto immaginarlo.\nCos'altro potevo aspettarmi da un pigrone come te?\n@c0@"
  ja: "@a@bデボラ「ちょっと　あんたが\n\tつけなくて　誰が　つけるのよ！？\n@c0@"
239:
  de: "@aGriselda@bHm. Ab jetzt achte darauf, dass du das ordentlich erledigst.\n@c0@"
  en: "@aDebora@bHuh! You'd just better make sure you do it from now on.\n@c0@"
  es: "@aStefania@bSerás... Más te vale no olvidarlo de ahora en adelante, ¿capisci?\n@c0@"
  fr: "@aPandora@bTsssⓠ Tu as intérêt à le faire, à partir de maintenant.\n@c0@"
  it: "@aViola@bDa domani la musica cambia: se non aggiornerai regolarmente il diario di bordo, andrai a letto senza cena!\n@c0@"
  ja: "@a@bデボラ「今日から　ちゃんと\n\tあんたが　つけなさいよね。\n@c0@"
240:
  de: "@aGriselda@bStell dir nur die Enttäuschung vor, wenn man von einem großen Gewinn träumt und dann aufwacht und feststellt, dass es nur ein Traum war!\n@c0@"
  en: "@aDebora@bImagine the disappointment if you dreamt you'd had a big win and then woke up to find it was just a dream!\n@c0@"
  es: "@aStefania@b¡Imagina qué soponcio si sueñas que ganas a lo grande y se esfuma tutto al despertar!\n@c0@"
  fr: "@aPandora@bImagine un peu la déception si tu rêvais que tu gagnais gros et que tu te réveillais pour te rendre compte que ce n'était qu'un rêveⓠ\n@c0@"
  it: "@aViola@bCaro, devo chiederti un favore: voglio che tu resti sveglio le prossime quattro notti, così potrai dirmi se parlo nel sonno oppure no. Grazie.\n@c0@"
  ja: "@a@bデボラ「大勝ちした夢を見て　それで\n\t目が覚めると　むしょうに\n\tくやしいわ。\n@c0@"
241:
  de: "@aGriselda@bWas für ein Trottel! Er hätte aufhören sollen, bevor es so weit mit ihm gekommen ist.\n@c0@"
  en: "@aDebora@bWhat a fool! Surely he could've stopped before he ended up that bad.\n@c0@"
  es: "@aStefania@b¡Menudo lerdo! Debería haber parado antes de acabar così.\n@c0@"
  fr: "@aPandora@bQuel imbécileⓠ Il aurait sûrement pu s'arrêter avant d'en arriver là.\n@c0@"
  it: "@aViola@bSe questo è l'effetto che le slot machine hanno sul cervello degli uomini, ti proibisco categoricamente di giocarci!\n@c0@"
  ja: "@a@bデボラ「なら　踊らなければいいじゃない。\n\tバッカじゃないの？\n@c0@"
242:
  de: "@aGriselda@bWenn ich mich entspannen will, finde ich Einkaufen viel wirkungsvoller als Tanzen.\n@c0@"
  en: "@aDebora@bWhen I need to unwind, I find a good bit of shopping works much better than any gentle dancing could.\n@c0@"
  es: "@aStefania@bCuando necesito relajarme, ir de compras me sienta molto megliore que cualquier baile.\n@c0@"
  fr: "@aPandora@bQuand j'ai besoin de me détendre, je trouve\nqu'une bonne razzia dans les magasins est\nbien plus efficace que n'importe quelle danse.\n@c0@"
  it: "@aViola@bPer me nulla è più rilassante che andare a far spese, accompagnata dal mio caro maritino che si occupa dei piccoli problemini legati allo shopping.\n㈡\nCome pagare gli acquisti e portare i pacchetti...\n@c0@"
  ja: "@a@bデボラ「集中した後は　踊るより\n\t私は　買い物をして\n\t気分転換するわね。\n@c0@"
243:
  de: "@aGriselda@bTja, aber das Problem bei dieser Einstellung ist, dass dieses Morgen niemals eintritt.\n@c0@"
  en: "@aDebora@bAh, but the problem with that philosophy is that tomorrow never comes.\n@c0@"
  es: "@aStefania@b¡Ah!, ma il problema de esa filosofía es que el mañana nunca llega.\n@c0@"
  fr: "@aPandora@bAh, mais le problème avec ce genre de philosophie, c'est que demain n'arrive jamais.\n@c0@"
  it: "@aViola@bForse farebbe meglio a smettere di giocare d'azzardo, visto che non vince mai...\n@c0@"
  ja: "@a@bデボラ「明日こそって　言ってるうちは\n\tぜったいに　勝てないわね。\n@c0@"
244:
  de: "@aGriselda@bSieht aus, als lägen diese Zeiten hinter ihm.\n@c0@"
  en: "@aDebora@bHe certainly doesn't look like he's up to it nowadays.\n@c0@"
  es: "@aStefania@bDesde luego, no parece que le esté yendo molto bene.\n@c0@"
  fr: "@aPandora@bDe toute évidence, il n'en est plus capable, désormais.\n@c0@"
  it: "@aViola@bMi sta venendo da vomitare...\n@c0@"
  ja: "@a@bデボラ「若い頃の　話でしょ？\n\t今は　もう　ムリそうじゃない。\n@c0@"
245:
  de: "@aGriselda@bFürs Haar ist die Seeluft wirklich nichts. Damit werde ich nie klarkommen.\n@c0@"
  en: "@aDebora@bThe sea air is just terrible for messing up my hair.\r\nI'll never get on with it.\n@c0@"
  es: "@aStefania@bEl aire del mare me sienta fatal al pelo.\r\n¿Por qué me habrás tenido que traer aquí?\n@c0@"
  fr: "@aPandora@bMoi, l'air marin m'emmêle les cheveux, c'est terrible.\r\nJe ne m'en sortirai jamais.\n@c0@"
  it: "@aViola@bCaro, devi comprarmi un balsamo per proteggere la mia meravigliosa chioma dalla salsedine...\n@c0@"
  ja: "@a@bデボラ「ホント　潮風って\n\t髪もいたむし　いまだに\n\t好きになれないわね。\n@c0@"
246:
  de: "@aGriselda@bÄhm, ist er nicht der einzige Verantwortliche? Wer passt denn auf das Schiff auf, wenn er schläft?\n@c0@"
  en: "@aDebora@bUm, isn't he the only one in charge?\nWhat happens to the ship when he sleeps?\n@c0@"
  es: "@aStefania@bMmm, ¿no es el único que está al mando?\n¿Ma qué pasa con el barco cuando duerme?\n@c0@"
  fr: "@aPandora@bHum, n'est-il pas le seul responsable, iciⓡ\nQu'arrive-t-il au bateau lorsqu'il dortⓡ\n@c0@"
  it: "@aViola@bNon mi piacerebbe lavorare di notte e dormire di giorno. La notte è fatta per dormire, e il giorno per farmi servire e riverire da te, caro...\n@c0@"
  ja: "@a@bデボラ「でも　この人　１人だけよね？\n\t大丈夫なのかしら？\n@c0@"
247:
  de: "@aGriselda@bWas für ein merkwürdiges Liedchen!\n@c0@"
  en: "@aDebora@bWhat a weird little ditty he's singing!\n@c0@"
  es: "@aStefania@b¡Qué canzonetta más rara!\n@c0@"
  fr: "@aPandora@bQuelle drôle de petite comptineⓠ\n@c0@"
  it: "@aViola@bOh, ma che bella canzoncina!\nCaro, cerca di impararla a memoria, così potrai cantarmela ogni volta che vorrò.\n@c0@"
  ja: "@a@bデボラ「あれは　この場に\n\tいる人たちへの　皮肉かしら？\n@c0@"
248:
  de: "@aGriselda@bMir persönlich gefallen Männer mit schönen tiefen Stimmen am besten.\n@c0@"
  en: "@aDebora@bI always prefer men with nice, deep voices, personally.\n@c0@"
  es: "@aStefania@bYo prefiero a los hombres con voz bonita e profonda. No sé qué hago contigo.\n@c0@"
  fr: "@aPandora@bPersonnellement, j'ai toujours préféré les hommes avec une belle voix grave.\n@c0@"
  it: "@aViola@bAnch'io preferisco le voci maschili.\nSono più forti, più profonde...\n@c0@"
  ja: "@a@bデボラ「どちらかといえば　私も\n\tかん高い　男の声より\n\t低い声のほうが　好きだわね。\n@c0@"
249:
  de: "@aGriselda@bIch weiß ja, es ist seine Aufgabe, aber gemütlicher wird es durch ihn nicht gerade.\n@c0@"
  en: "@aDebora@bI know it's his job, but he's the one ruining the atmosphere if you ask me.\n@c0@"
  es: "@aStefania@bSé que es il suo lavoro, ma él está echando a perder la atmósfera.\n@c0@"
  fr: "@aPandora@bJe sais que c'est son travail, mais si tu veux mon avis, c'est lui qui pourrit l'ambiance.\n@c0@"
  it: "@aViola@bDirei che il personale di sorveglianza fa bene il suo lavoro, visto che l'atmosfera a bordo è serena e rilassata...\n@c0@"
  ja: "@a@bデボラ「仕事なのは　わかるけど\n\tあんたの存在が　ムードを\n\tぶちこわしに　してんのよねー。\n@c0@"
250:
  de: "@aGriselda@bOffenbar hat er sein ganzes Geld verloren, und jetzt kann er sich die Heimreise nicht mehr leisten.\n@c0@"
  en: "@aDebora@bHe's obviously gone and lost all his money and now he can't afford the fare home.\n@c0@"
  es: "@aStefania@bEstá claro que ha perdido tutto il dinero y no tiene ni para volver a la sua casa.\n@c0@"
  fr: "@aPandora@bDe toute évidence, il a perdu tout son argent\r\net ne peut plus se payer le voyage de retour\r\njusque chez lui.\n@c0@"
  it: "@aViola@bPoverino... Scommetto che ha perso fino all'ultimo gettone. Beh, che gli sia di lezione! La prossima volta imparerà a non farsi prendere la mano dal gioco!\n@c0@"
  ja: "@a@bデボラ「あれは　きっと\n\t負けすぎて　家に帰れないから\n\t落ち込んでるのね。\n@c0@"
251:
  de: "@aGriselda@bWarum singst du uns nicht was vor, %a000090? Ach, wenn ich so drüber nachdenke ⓚⓛ lass es lieber.\n@c0@"
  en: "@aDebora@bWhy don't you give us a tune, %a000090?\nOn second thoughts, maybe not.\n@c0@"
  es: "@aStefania@b¿Por qué no nos cantas algo, %a000090?\nBueno, o mejor no, ¡qué orrore!\n@c0@"
  fr: "@aPandora@bEt si tu nous chantais quelque chose, %a000090ⓡ Quoique... non,\npeut-être pas, finalement.\n@c0@"
  it: "@aViola@b%0%a000090, voglio che impari a cantare. Desidero che mi svegli ogni mattino con una dolce canzone d'amore. Ma solo dopo che sarai diventato intonato!\n@c0@"
  ja: "@a@bデボラ「あんたも　歌くらい……って\n\tどうみても　ムリそうね。\n@c0@"
252:
  de: "@aGriselda@bDürfen denn Priester überhaupt Kasinos betreten?\n@c0@"
  en: "@aDebora@bAre priests even allowed in casinos?\n@c0@"
  es: "@aStefania@b¿Ma, dejan entrar sacerdotes en los casinos?\n@c0@"
  fr: "@aPandora@bEst-ce que les prêtres ont le droit d'entrer dans\nles casinos, d'ailleursⓡ\n@c0@"
  it: "@aViola@bSpero che quel sacerdote non voglia giocarsi anche le offerte dei suoi parrocchiani...\n@c0@"
  ja: "@a@bデボラ「神父が　こんなところで\n\t遊んでていいわけ？\n@c0@"
253:
  de: "@aGriselda@bIch frage mich, ob sie die Ventuno wohl wieder auf See schicken, wenn die Zeiten friedlicher werden.\n@c0@"
  en: "@aDebora@bI wonder if they'll put the Ventuno out to sea once it's peaceful again.\n@c0@"
  es: "@aStefania@bMe pregunto si el Musini volverá a navegar cuando ritorne la pace.\n@c0@"
  fr: "@aPandora@bJe me demande si le Vingt-et-un repartira en\nhaute mer, une fois que la paix sera revenue.\n@c0@"
  it: "@aViola@bMio padre vuole organizzare delle vere e proprie ⓕcrociere d'azzardoⓖ in mare aperto, una volta che la situazione sarà tornata alla tranquillità.\n@c0@"
  ja: "@a@bデボラ「平和になったら\n\tまた　海上を　ただようのかしらね。\n@c0@"
254:
  de: "@aGriselda@bAllerdings wäre es dann etwas schwieriger, an Bord zu kommen.\n@c0@"
  en: "@aDebora@bIt'd make it a bit awkward to get to, though.\n@c0@"
  es: "@aStefania@bAunque si está navegando, sería difficile llegar hasta él, claro...\n@c0@"
  fr: "@aPandora@bÇa compliquerait un peu les choses pour y aller, remarque.\n@c0@"
  it: "@aViola@bIn altre parole, la Jolly Ace non resterà più all'ancora davanti all'Isola Tresoria, ma navigherà in mare aperto.\n@c0@"
  ja: "@a@bデボラ「でも　そうすると\n\tカジノ船に行くのが　大変よね。\n@c0@"
255:
  de: "@aGriselda@bDu hast doch T&T-Tickets, oder, %a000090?\n@c0@"
  en: "@aDebora@bYou're good for T 'n' T tickets, right, %a000090?\n@c0@"
  es: "@aStefania@bPodrás conseguir unos boletos de T y T, ¿no, %a000090?\n@c0@"
  fr: "@aPandora@bTu as ce qu'il faut, en matière de tickets de TNT, hein, %a000090ⓡ\n@c0@"
  it: "@aViola@b%0%a000090, hai qualche biglietto della Sorte?\nM'è venuta voglia di fare una partitina...\n@c0@"
  ja: "@a@bデボラ「あんたは　すごろく券は\n\t大丈夫よね？\n@c0@"
256:
  de: "@aGriselda@bDu wirst gleich tief in der Tinte sitzen, wenn du mir jetzt erzählen willst, dass wir keine haben und ich darum nicht spielen kann!\n@c0@"
  en: "@aDebora@bYou'll be in a lot of trouble if you tell me now we don't have any and I can't play!\n@c0@"
  es: "@aStefania@b¡Como me entere de que no tienes y no puedo giocare te acuerdas de esta!\n@c0@"
  fr: "@aPandora@bTu risques d'avoir de sacrés ennuis si tu me dis maintenant que nous n'en avons aucun et que\nje ne peux pas jouerⓠ\n@c0@"
  it: "@aViola@bSe non ne hai, sbrigati a procurartene uno o due, se non vuoi che la tua dolce mogliettina si arrabbi e ti scaraventi in mare!\n@c0@"
  ja: "@a@bデボラ「もってなくて　できないとか\n\tみじめなマネは　ごめんだからね！\n@c0@"
257:
  de: "@aGriselda@bJa, die Freikarte. Ich weiß noch, wie Papa davon geredet hat.\n@c0@"
  en: "@aDebora@bYes, the free pass. I remember Papa talking\r\nabout that.\n@c0@"
  es: "@aStefania@bSí, el abono. He oído hablar al mio papino de él.\n@c0@"
  fr: "@aPandora@bOui, le laissez-passer. Je me souviens d'avoir entendu papa parler de ça.\n@c0@"
  it: "@aViola@bSe non sbaglio, una volta mio padre mi ha parlato di questi Passepartout della Sorte. Sono oggetti rarissimi e incredibilmente preziosi.\n@c0@"
  ja: "@a@bデボラ「パパから　聞いたことがあるけど\n\tたしか　セレブリティパスとかいう\n\t名前じゃなかったかしら？\n@c0@"
258:
  de: "@aGriselda@bHmpf! Es bringt Unglück, so was auf einem Schiff auch nur zu sagen.\n@c0@"
  en: "@aDebora@bHmph! It's bad luck to even say things like that when you're on a boat.\n@c0@"
  es: "@aStefania@b¡Mmm! ¡Decir esas cosas a bordo de un barco veramente da mala suerte!\n@c0@"
  fr: "@aPandora@bMmpfⓠ Ça porte malheur de dire des choses\ncomme ça quand on est sur un bateau.\n@c0@"
  it: "@aViola@bTocchiamo ferro, %a000090!\nParlare di naufragi quando si è a bordo di una nave porta una iella pazzesca!\n@c0@"
  ja: "@a@bデボラ「船に乗ってるときに\n\tそういう　不吉なことは\n\t言わないでほしいわね。\n@c0@"
259:
  de: "@aGriselda@bWer fährt denn zur See, wenn er nicht schwimmen kann? An seiner Stelle würde ich mir eine andere Arbeit suchen.\n@c0@"
  en: "@aDebora@bWhy would anyone become a sailor if they couldn't swim? I'd find another job if I was him.\n@c0@"
  es: "@aStefania@b¿Para qué se hace uno marinero si no sabe nadar? Yo me buscaría otro lavoro.\n@c0@"
  fr: "@aPandora@bPourquoi devenir marin si on ne sait pas nagerⓡ\nJe chercherais un autre travail, si j'étais lui.\n@c0@"
  it: "@aViola@bSe non sa nuotare, avrebbe dovuto fare la guida in montagna, l'oste, il commerciante, il soldato. Avrebbe potuto fare qualsiasi lavoro, ma non il marinaio!\n@c0@"
  ja: "@a@bデボラ「泳げないのに　船員やってんの？\n\t向いてないから　やめたほうが\n\tいいんじゃない？\n@c0@"
260:
  de: "@aGriselda@bVielleicht sollte ich Papa davon erzählen, damit er ihn feuert.\n@c0@"
  en: "@aDebora@bMaybe I should tell Papa and have him fired.\n@c0@"
  es: "@aStefania@bDebería hablar con il mio papino para que lo eche.\n@c0@"
  fr: "@aPandora@bPeut-être que je devrais le dire à papa pour\nqu'il le mette à la porte.\n@c0@"
  it: "@aViola@bCaro, fammi il piacere di scoprire come si chiama quel lavativo: riferirò al mio paparino che è uno scansafatiche e lo farò licenziare.\n@c0@"
  ja: "@a@bデボラ「……パパに言って\n\tこいつ　やめさせようかしら？\n@c0@"
261:
  de: "@aGriselda@bVielleicht sollten wir sein Essen mal probieren, wenn es so lecker ist. Aber du kannst zuerst kosten, damit du weißt, ob's gut genug ist für mich.\n@c0@"
  en: "@aDebora@bMaybe we should sample some of his food if it's that perfect. You can try it first, though, and make sure it's good enough for me.\n@c0@"
  es: "@aStefania@bSi tan buona es su comida podríamos probarla. Tú primero, para asegurarte de que sea digna de mi paladar.\n@c0@"
  fr: "@aPandora@bPeut-être qu'on devrait goûter ce qu'il prépare,\nsi c'est si parfait que ça. Mais tu devras goûter le premier et t'assurer que c'est assez bon pour moi.\n@c0@"
  it: "@aViola@bPresto, %a000090!\nFrugagli nelle tasche, e vedi se riesci a trovare qualcuna delle sue meravigliose ricette!\n@c0@"
  ja: "@a@bデボラ「そんなに　おいしいのなら\n\t食べてあげてもいいけど\n\tまずは　%a000090が毒見してからね。\n@c0@"
