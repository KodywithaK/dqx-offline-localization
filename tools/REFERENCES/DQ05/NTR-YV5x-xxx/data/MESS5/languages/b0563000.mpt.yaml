0:
  de: "@aBianca@bDas ist also Steile Höh... Wo deine Mutter geboren wurde und aufwuchs.\n@c0@"
  en: "@aBianca@bSo this is Lofty Peak... This is where your mum was born and raised.\n@c0@"
  es: "@aBianca@bAsí que esto es Cumbre Excelsa... Aquí es donde nació y creció tu madre, ¿no?\n@c0@"
  fr: "@aBianca@bVoici donc Haute-Cime... là où ta maman est née et\r\na grandi.\n@c0@"
  it: "@aBianca@bQuesto è il villaggio di Picco Maximo.\nTua madre è nata e cresciuta qui, non è vero?\n@c0@"
  ja: "@a@bビアンカ「ここが　エルヘブン……。\n\t%a000090のお母さまが\n\t生まれ育った村なのね。\n@c0@"
1:
  de: "@aNera@bDieses Dorf hat eine ganz besonders mysteriöse Aura. Es macht eher den Eindruck eines heiligen Ortes als den einer Wohnsiedlung...\n@c0@"
  en: "@aNera@bThere's a very mysterious air to this village.\r\nIt feels like more of a holy place than an\r\ninhabited settlement.\n@c0@"
  es: "@aNera@bEsta aldea tiene un aire molto misterioso.\nSembra más un lugar sagrado que un poblado abandonado.\n@c0@"
  fr: "@aNera@bCe village a quelque chose d'assez mystérieux.\r\nIl ressemble plus à un lieu sacré qu'à un endroit habité.\n@c0@"
  it: "@aNera@bA Picco Maximo c'è un'atmosfera quasi mistica.\nSembra più un luogo sacro che un normale villaggio...\n@c0@"
  ja: "@a@bフローラ「ふしぎな空気に　つつまれた\n\t村ですのね。　村というより\n\t一種の　聖地　という感じですわ。\n@c0@"
2:
  de: "@a%0%a001240@bHier ist es ziemlich ruhig, wie immer... Das macht mich ein wenig nervös.\n@c0@"
  en: "@a%0%a001240@bIt's quiet here as usual, isn't it?\nIt makes me feel a bit nervous.\n@c0@"
  es: "@a%0%a001240@bEl mismo silencio de siempre, ¿no?\nMe pone un poco nervioso.\n@c0@"
  fr: "@a%0%a001240@bC'est toujours aussi calme, ici, heinⓡ\nÇa me rend un peu nerveux.\n@c0@"
  it: "@a%0%a001240@bQuesto posto è fin troppo tranquillo per i miei gusti.\nMi piacerebbe che ci fosse un po' più di movimento...\n@c0@"
  ja: "@a@b%a001240「あいかわらず\n\tこの村は　静かだね。\n\tあ　背中ムズムズしてきた。\n@c0@"
3:
  de: "@a%0%a001250@bEs ist schon eine Weile her, seit wir das letzte Mal hier waren. Hoffentlich geht es allen gut.\n@c0@"
  en: "@a%0%a001250@bIt's been a while since we were last here.\nI wonder how everyone is.\n@c0@"
  es: "@a%0%a001250@bHace tiempo que no venimos por aquí.\nMe pregunto cómo estarán todos...\n@c0@"
  fr: "@a%0%a001250@bÇa faisait longtemps que nous n'étions pas venus ici. Je me demande comment vont les habitants.\n@c0@"
  it: "@a%0%a001250@bPapà, da quanto tempo manchiamo da Picco Maximo?\nChissà come vanno qui le cose...\n@c0@"
  ja: "@a@b%a001250「この村に来たの\n\tひさしぶりね。\n\tみんな　元気かな……？\n@c0@"
4:
  de: "@aSancho@bWir müssen alle Leute nach diese Unterwelt befragen. Wir müssen so viel rausfinden wie mögliss.\n@c0@"
  en: "@aSancho@bWe must ask many people about thees underworld. We must find out as much as we can.\n@c0@"
  es: "@aSancho@bHay que preguntar mucho por el Inframundo. Debemos averiguar todito lo que podamos.\n@c0@"
  fr: "@aSancho@bN-Nous devons interroger t-tout le monde sur le monde souterrain. Il f-faut en apprendre le plus\r\np-possible.\n@c0@"
  it: "@aSancho@bChico, dobbiamo fare muchas domandas sul Regno de los Inferos. Es necessario que otteniamo todas las informaciónes posibles.\n@c0@"
  ja: "@a@bサンチョ「暗黒の魔界のことを\n\t知るために　人々から\n\t話を聞かねば　なりませんね。\n@c0@"
5:
  de: "@aSancho@bAber diese Dorf ist kein einfaches Pflaster, eh? Die ganze Steigungen machen meine Rücken schwer zu schaffen...\n@c0@"
  en: "@aSancho@bBut ees no eso easy to walk around een thees town, eh? These eslopes, they are no good for my back, you know.\n@c0@"
  es: "@aSancho@bPero es bien complicado pasear por este pueblo, chamaco. Estas cuestas no me hacen bien a la espalda.\n@c0@"
  fr: "@aSancho@bCe n'est pas f-facile de se déplacer dans ce village, heinⓡ Toutes ces p-pentes, ce n'est pas bueno pour mon dos, tu sais.\n@c0@"
  it: "@aSancho@b¡Vamonos, chico!\n¡No ce está tiempo da perdere!\n@c0@"
  ja: "@a@bサンチョ「この村を　歩き回るのは\n\tちと　腰に　ひびきますが……。\n@c0@"
6:
  de: "@aSancho@bIss weiß, dass du mit die Weisen spressen willst, aber wir haben keine Zeit. Wir müssen zur Unterwelt.\n@c0@"
  en: "@aSancho@bI know you want to talk weeth the village elders, but ees no the time now. We must hurry to the underworld.\n@c0@"
  es: "@aSancho@bYa sé que querías platicar con los ancianos de la aldea, pero no hay tiempo. Hay que apurarse e ir al Inframundo.\n@c0@"
  fr: "@aSancho@bJe sais que tu voudrais p-parler avec les anciens du v-village, mais ce n'est pas le m-moment.\r\nIl faut vite aller dans le m-monde souterrain.\n@c0@"
  it: "@aSancho@bChico, yo so que tu vuoi hablar con los Anzianos del villaggio, ma ahora no abbiamo tiempo por farlo.\n¡Dobbiamo precipitarce nel Regno de los Inferos!\n@c0@"
  ja: "@a@bサンチョ「%a000090王　長老たちに\n\tお礼を言いたいのも　わかりますが\n\t今は　魔界へ　急がねば！\n@c0@"
7:
  de: "@aOtto@bManchmal habe ich den Eindruck, es ist schwieriger, in diesem Dorf herumzuwandern, als in einer Höhle...\n@c0@"
  en: "@aTuppence@bIn some ways, it's harder walking around this village than it is walking around a cave.\n@c0@"
  es: "@aAlazar@bEn cierto modo, es más difícil andar por este pueblo que por una cueva.\n@c0@"
  fr: "@aInnocent@bD'une certaine manière, c'est plus difficile de se déplacer dans ce village que dans une grotte.\n@c0@"
  it: "@aSimon@bCamminare per questo villaggio è più faticoso che avanzare in una grotta...\n@c0@"
  ja: "@a@bピピン「この村を　歩きまわるのは\n\tある意味　洞くつを歩きまわるより\n\t大変ですよねえ。\n@c0@"
8:
  de: "@aBianca@bWie traurig, dass sie alle vergessen sind!\n@c0@"
  en: "@aBianca@bHow sad that they've bin forgotten!\n@c0@"
  es: "@aBianca@b¡Qué pena que estén olvidados!\n@c0@"
  fr: "@aBianca@bC'est triste qu'on les ait oubliésⓠ\n@c0@"
  it: "@aBianca@bCome ha potuto il mondo dimenticare questa gente...?\n@c0@"
  ja: "@a@bビアンカ「忘れられた民族なんて\n\tさみしいこと　言うわねえ。\n@c0@"
9:
  de: "@aNera@bEs ist wohl ganz normal, dass man sie vergessen hat, wo sie doch in aller Abgeschiedenheit leben. Aber ein bisschen tun sie mir schon leid.\n@c0@"
  en: "@aNera@bI suppose it's only to be expected that they'd be forgotten, living all the way out here. It is a bit sad for them, though.\n@c0@"
  es: "@aNera@bO sea, era de esperar que los olvidaran, viviendo aquí tan lontano. Aunque dan un po' de lástima.\n@c0@"
  fr: "@aNera@bJe suppose qu'il fallait s'attendre à ce qu'on les oublie. Ils vivent dans un endroit si reculé.\r\nMais c'est tout de même triste pour eux.\n@c0@"
  it: "@aNera@bForse sono stati loro stessi a volersi far dimenticare dal mondo, scegliendo di vivere in questo posto inaccessibile...\n@c0@"
  ja: "@a@bフローラ「こんな　奥地にある村だから\n\tしかたないのでしょうか……。\n\t忘れられたなんて　さみしいですけど。\n@c0@"
10:
  de: "@a%0%a001250@bDie Vergessenen? Wie schrecklich, wenn man vergessen wird! Du wirst mich doch nie vergessen, oder, Papa?\n@c0@"
  en: "@a%0%a001250@bThe forgotten ones? It'd be horrible to be forgotten. You won't forget me, will you, Dad?\n@c0@"
  es: "@a%0%a001250@b¿Los olvidados? Debe de ser horrible que te olviden. No me olvidarás nunca, ¿verdad, papi?\n@c0@"
  fr: "@a%0%a001250@bLes oubliésⓡ Ça serait horrible d'être complètement oubliée. Tu ne m'oublieras pas toi, hein, papaⓡ\n@c0@"
  it: "@a%0%a001250@bDev'essere orribile quando qualcuno si dimentica di te! Papà, giurami che non ti scorderai mai di me, di %a001240 e della mamma!\n@c0@"
  ja: "@a@b%a001250「忘れられるなんて　こわい。\n\tお父さん　わたしのこと\n\t絶対　忘れないでね……。\n@c0@"
11:
  de: "@a%0%a001240@bIch vergesse nie Orte, an denen ich schon mal war. Ich frage mich, wer die Leute hier denn vergessen hat?\n@c0@"
  en: "@a%0%a001240@bI never forget places I've been, even if I've only been once. I wonder who the people here have\nbeen forgotten by.\n@c0@"
  es: "@a%0%a001240@bYo nunca olvido los lugares en los que he estado, aunque solo haya sido una vez. ¿Quién habrá olvidado a esta gente?\n@c0@"
  fr: "@a%0%a001240@bJe n'oublie jamais un endroit, même si je n'y ai été qu'une seule fois. Je me demande par qui ces gens ont été oubliés...\n@c0@"
  it: "@a%0%a001240@bIo mi ricordo sempre dei posti dove sono andato e delle persone che ho incontrato. Come ha fatto il mondo a dimenticarsi di questa gente?\n@c0@"
  ja: "@a@b%a001240「一度行った場所のことは\n\tボク　忘れないよ！\n\tこの村は　だれに忘れられてるの？\n@c0@"
12:
  de: "@aBianca@bStimmt. Du bist schon einmal hier gewesen...\n@c0@"
  en: "@aBianca@bOh yeah. You lot have bin here before, eh?\n@c0@"
  es: "@aBianca@b¡Ah!, vaya. Vosotros ya habíais estado aquí, ¿eh?\n@c0@"
  fr: "@aBianca@bAh, mais oui. C'est vrai que vous vous êtes déjà venus ici.\n@c0@"
  it: "@aBianca@bGià, a momenti dimenticavo che sei già stato qui...\n@c0@"
  ja: "@a@bビアンカ「そうか……。\n\t%a000090たちは　前にも\n\tこの村に　来たことがあるのね。\n@c0@"
13:
  de: "@aNera@bNatürlich. Du warst schon einmal hier. Offenbar gibt es hier nicht viele Besucher, und du hast bestimmt Eindruck hinterlassen.\n@c0@"
  en: "@aNera@bOf course. You've been here already. It doesn't seem like they have many visitors, so you probably stood out quite a lot.\n@c0@"
  es: "@aNera@bMa claro. Ya habíais estado aquí. No parece que tengan muchas visitas, sicuro que destacabais un montón.\n@c0@"
  fr: "@aNera@bMais oui, tu es déjà venu ici. On dirait qu'ils n'ont pas beaucoup de visites. Ça doit être pour ça qu'ils se souviennent si bien de toi.\n@c0@"
  it: "@aNera@bMi ero del tutto scordata che sei già stato a Picco Maximo. Credo che si ricordi bene di te perché qui non arrivano molti forestieri...\n@c0@"
  ja: "@a@bフローラ「そう。　あなた　前にもここへ\n\tいらしたのね。　旅人が　少ないから\n\t目立つのかも知れませんわ。\n@c0@"
14:
  de: "@a%0%a001240@bHa ha! Vielleicht war es ja mein Gesicht, das sie wiedererkannt hat!\n@c0@"
  en: "@a%0%a001240@bHa ha! I wonder if it was my face she remembered. How cool is that!?\n@c0@"
  es: "@a%0%a001240@b¡Ja, ja! ¿Será mi cara lo que ha recordado? ¡¿Qué te parece?!\n@c0@"
  fr: "@a%0%a001240@bHa haⓠ Je me demande si c'est moi qu'elle a reconnu.\n@c0@"
  it: "@a%0%a001240@bDovrebbe imprimersi il mio volto bene in mente, così la prossima volta si ricorderà anche di me!\n@c0@"
  ja: "@a@b%a001240「えへへへ。\n\tボク　顔おぼえられたのかなあ？\n\tこういうのって　うれしいね！\n@c0@"
15:
  de: "@aOtto@bBei der Göttin! Wahrscheinlich kriegt mich die Arme gar net aus dem Kopf!\n@c0@"
  en: "@aTuppence@bDear me! She obviously just can't get me out of\r\nher head!\n@c0@"
  es: "@aAlazar@b¡Oh, cielos! ¡Está claro que no puede dejar de pensar en mí!\n@c0@"
  fr: "@aInnocent@bPar la Déesseⓠ On dirait qu'elle n'a pas réussi\nà m'oublierⓠ\n@c0@"
  it: "@aSimon@bMa come?! Quella donna non si ricorda di me, del mio sguardo intenso, del mio corpo muscoloso, della mia mascella volitiva?!\n@c0@"
  ja: "@a@bピピン「うわっ　どうしよう！\n\tあの人　きっと　ボクのことが\n\t忘れられないんですよ！\n@c0@"
16:
  de: "@aOtto@b... Hm? Was ist los, %a000090? Warum schaut Ihr mich so an?\n@c0@"
  en: "@aTuppence@b...Hm? What is it, %a000090?\nWhy are you looking at me like that?\n@c0@"
  es: "@aAlazar@b¿Mmm? ¿Qué ocurre, %a000090?\n¿Por qué me miráis así?\n@c0@"
  fr: "@aInnocent@b... Mmmⓡ Qu'est-ce qu'il y a, %a000090ⓡ\nPourquoi vous me regardez comme çaⓡ\n@c0@"
  it: "@aSimon@bNo, evidentemente non se ne ricorda...\nMaestà, sono geloso del successo che lei ha con le donne!\n@c0@"
  ja: "@a@bピピン「……あれ？　%a000090さま。\n\tなんですか　その目は！？\n@c0@"
17:
  de: "@aBianca@bWenn dieser Schlüssel wirklich existiert, täten wir gut daran, ihn uns zu holen.\n@c0@"
  en: "@aBianca@bIf that key really exists, we'd do well to get hold\r\nof it.\n@c0@"
  es: "@aBianca@bSi esa llave existe de verdad, mejor será que le echemos el guante, ¿sabes?\n@c0@"
  fr: "@aBianca@bSi cette clef existe vraiment, ce serait bien de mettre la main dessus.\n@c0@"
  it: "@aBianca@bSe quella chiave esistesse davvero, ci farebbe proprio comodo...\n@c0@"
  ja: "@a@bビアンカ「そんなカギがあるなら\n\t手に入れておいたほうが\n\tいいかも知れないね。\n@c0@"
18:
  de: "@aNera@bBei der Göttin! Ein Schlüssel, der alle Türen öffnen kann, in den Händen eines Meisterdiebs...\n@c0@"
  en: "@aNera@bDear me! A key that can open any door in the hands of a master thief, of all people!\n@c0@"
  es: "@aNera@b¡Oh, cielos! ¡Una llave que lo abre tutto, y tenía que estar en manos de un maestro ladrón!\n@c0@"
  fr: "@aNera@bPar la Déesseⓠ Une clef qui peut ouvrir toutes les portes entre les mains d'un maître voleurⓠ\n@c0@"
  it: "@aNera@bOh, santa dea!\nMa proprio in mano a un ladro doveva finire questa chiave portentosa?!\n@c0@"
  ja: "@a@bフローラ「どんなトビラでも\n\tあけられるなんて　まさに\n\t大とうぞくさんの　持ち物ですわ！\n@c0@"
19:
  de: "@a%0%a001240@bDer ⓞEhrlicheⓟ Ede? Das ist ja ein komischer Name.\n@c0@"
  en: "@a%0%a001240@bM. Bezzler? That's a weird name.\n@c0@"
  es: "@a%0%a001240@b¿Curro Ballaves? Qué nombre más raro.\n@c0@"
  fr: "@a%0%a001240@bM. Chouraveⓡ C'est bizarre comme nom.\n@c0@"
  it: "@a%0%a001240@bArsenio Rubìo...? Il nome è tutto un programma...\nDifficile pensare a questo tizio come a un'integerrima guardia di palazzo, eh?\n@c0@"
  ja: "@a@b%a001240「ゴロステ？\n\tへんな名前だね！\n@c0@"
20:
  de: "@a%0%a001240@bWenn wir diesen Schlüssel hätten, könnten wir vielleicht auch die Tür in der Höhle öffnen, die auf dem Weg hierhin liegt.\n@c0@"
  en: "@a%0%a001240@bIf we had that key, maybe we'd be able to open that door in the cave on the way here.\n@c0@"
  es: "@a%0%a001240@bCon esa llave tal vez podríamos abrir esa puerta de la cueva que hay de camino aquí.\n@c0@"
  fr: "@a%0%a001240@bSi on avait cette clef, peut-être qu'on pourrait ouvrir la porte qu'on a vue dans la grotte en venant.\n@c0@"
  it: "@a%0%a001240@bSe avessimo quella chiave, forse potremmo aprire la porta che abbiamo visto nella caverna mentre venivamo qui a Picco Maximo...\n@c0@"
  ja: "@a@b%a001240「そのカギがあったら\n\tここに来るとき　とおった\n\t洞くつのトビラも　あけられるかな？\n@c0@"
21:
  de: "@a%0%a001250@bWarum sucht der Dichter eigentlich nach dem Schlüssel? Er will doch nicht etwa ein Dieb werden, oder?\n@c0@"
  en: "@a%0%a001250@bWhy do you suppose that poet's looking for the key? You don't think he's planning on becoming a thief, do you?\n@c0@"
  es: "@a%0%a001250@b¿Por qué supones que el poeta busca la llave? No creerás que estará pensando en hacerse ladrón, ¿verdad?\n@c0@"
  fr: "@a%0%a001250@bPourquoi tu crois que ce poète cherche la clefⓡ\nIl ne voudrait quand même pas devenir voleur,\nlui aussiⓡ\n@c0@"
  it: "@a%0%a001250@bCome mai quel tipo è tanto informato sulla chiave?\nNon è che la sta cercando per darsi ad attività criminali, eh?!\n@c0@"
  ja: "@a@b%a001250「どうして　あの詩人さんは\n\tそんなカギを　さがしてるの？\n\tどろぼうさんに　なるつもりなのかな？\n@c0@"
22:
  de: "@aOtto@bWenn ich solch einen Schlüssel besäße, könnte ich die Tür zum Herzen einer schönen Frau aufsperren...\n@c0@"
  en: "@aTuppence@bIf only such a key were mine, I could unlock the door to a beautiful woman's heart...\n@c0@"
  es: "@aAlazar@bSi yo tuviera una llave así, podría abrir la puerta al corazón de una hermosa mujer...\n@c0@"
  fr: "@aInnocent@bSi je possédais cette clef, je pourrais m'ouvrir les portes du cœur d'une jolie femme...\n@c0@"
  it: "@aSimon@bSe avessi quella chiave, la userei per aprire il cuore della fanciulla dei miei sogni!\nOppure la dispensa del Castello di Denim...\n@c0@"
  ja: "@a@bピピン「そ…　そのカギさえあれば\n\tきっと　かわいい　あのコの\n\t心のトビラを　開くことも……\n@c0@"
23:
  de: "@aOtto@bÄhm, ich habe nur laut gedacht! Ignoriert mich einfach.\n@c0@"
  en: "@aTuppence@bI'm only joking! Just ignore me.\n@c0@"
  es: "@aAlazar@b¡Era broma! No me hagáis caso.\n@c0@"
  fr: "@aInnocent@bJe rigoleⓠ Ne faites pas attention à ce que je dis.\n@c0@"
  it: "@aSimon@bEh eh eh! Suvvia, Maestà! Stavo solo scherzando!\nLo sa che sono a dieta per tenermi sempre bello e in forma, no?\n@c0@"
  ja: "@a@bピピン「なんて　じょうだんです！\n\tすみませんでしたー！\n@c0@"
24:
  de: "@aBianca@bKomisch, er ist selbst schon jahrelang auf der Suche danach, aber er scheint kein bisschen böse zu sein, weil wir ihn gefunden haben.\n@c0@"
  en: "@aBianca@bHe said he's bin lookin' for it, and yet he didn't seem fed up we had it. How weird!\n@c0@"
  es: "@aBianca@bDijo que la estaba buscando, pero no parecía enfadado porque la tuviéramos. ¡Qué raro!\n@c0@"
  fr: "@aBianca@bIl a dit qu'il la cherchait, mais il n'a pas eu l'air déçu qu'on l'ait trouvée avant lui. Bizarreⓠ\n@c0@"
  it: "@aBianca@bÈ rimasto deluso quando ha scoperto che la chiave l'abbiamo già trovata noi, non è vero?\nEh eh eh! Peggio per lui!\n@c0@"
  ja: "@a@bビアンカ「あの詩人さん　さがしてたって\n\t言うわりには　ほしがらなかったわね。\n\tまあ　いっか！\n@c0@"
25:
  de: "@aNera@bGlaubst du, dass dieser Schlüssel wirklich alle Türen öffnen kann? Das wäre ja fantastisch!\n@c0@"
  en: "@aNera@bDo you think this key really can open any door?\r\nHow amazing!\n@c0@"
  es: "@aNera@b¿Crees que esta llave apre cualquier porta?\n¡Asombroso!\n@c0@"
  fr: "@aNera@bTu crois que cette clef peut vraiment ouvrir toutes les portesⓡ C'est extraordinaireⓠ\n@c0@"
  it: "@aNera@bDavvero questa chiave è in grado di aprire qualsiasi porta?\nSe fosse così, sarebbe un oggetto preziosissimo!\n@c0@"
  ja: "@a@bフローラ「この　最後のカギって\n\t本当に　どんなトビラでも\n\tあけてしまえるのよね。　ふしぎだわ。\n@c0@"
26:
  de: "@a%0%a001240@bEs war ganz schön schwer, an diesen Schlüssel zu kommen, was, Papa?\n@c0@"
  en: "@a%0%a001240@bIt was pretty hard work getting hold of that key, wasn't it, Dad?\n@c0@"
  es: "@a%0%a001240@bHa costado trabajo conseguir esa llave, ¿verdad, papi?\n@c0@"
  fr: "@a%0%a001240@bÇa n'a pas été facile de récupérer cette clef,\nhein, papaⓡ\n@c0@"
  it: "@a%0%a001240@bNon è stato facile procurarci quella chiave...\n@c0@"
  ja: "@a@b%a001240「あのカギを　手に入れるのは\n\tすっごい　大変だったよね　お父さん！\n@c0@"
27:
  de: "@aSancho@bSiehst du, Chico? Manche Leute missbrauchen gute Dinge für schlesste Zwecke. Du musst gut mit diese Schlüssel umgehen, hörst du?\n@c0@"
