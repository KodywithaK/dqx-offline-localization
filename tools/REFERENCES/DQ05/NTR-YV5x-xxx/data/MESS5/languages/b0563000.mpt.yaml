  it: "@a%0%a001250@bCredi che il Tempio dell'Estuario sia quello strano posto che abbiamo visto nella caverna mentre venivamo qui?\n@c0@"
  ja: "@a@b%a001250「海の神殿って　わたしたちが\n\tここへ来るときにとおった\n\t洞くつの中の　アレよね？\n@c0@"
103:
  de: "@aBianca@bEs heißt doch, dass die Leute hier das Tor bewachen, oder?\n@c0@"
  en: "@aBianca@bEn't these the folk that are supposed to guard\r\nthe gateway?\n@c0@"
