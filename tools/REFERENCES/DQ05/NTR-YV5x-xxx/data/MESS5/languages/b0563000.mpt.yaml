106:
  de: "@aOtto@bSie mögen sich vielleicht die Weisen nennen, trotzdem sind alle ziemlich jung und gut aussehend. Das ist seltsam...\n@c0@"
  en: "@aTuppence@bThey may call themselves ⓗEldersⓘ, but they're actually quite young and splendid-looking.\nHow odd!\n@c0@"
  es: "@aAlazar@bPuede que se llamen ⓕancianosⓖ, pero lo cierto es que son bastante jóvenes y bien parecidos. ¡Qué raro!\n@c0@"
  fr: "@aInnocent@bIls s'appellent peut-être ⓥAnciensⓦ, mais ils sont plutôt jeunes et ont une allure splendide.\nC'est très bizarreⓠ\n@c0@"
  it: "@aSimon@bPerché mai si faranno chiamare ⓕAnzianiⓖ se hanno un aspetto tanto giovanile? Forse amano sentirsi dire che si portano bene i loro anni?\n@c0@"
  ja: "@a@bピピン「それにしても　長老というわりには\n\tみなさん　若くて　お美しい……。\n\tふしぎだ！\n@c0@"
107:
  de: "@a%0%a001240@bDer Zenithdrache ist Dr. Ache, oder?\n@c0@"
  en: "@a%0%a001240@bThe Zenith Dragon is Dr Agon, right?\n@c0@"
  es: "@a%0%a001240@bEl Dragón de Zenithia es el Dr. Agón, ¿no?\n@c0@"
  fr: "@a%0%a001240@bLe Dragon du Zénith est le Dr Agon, c'est bien çaⓡ\n@c0@"
  it: "@a%0%a001240@bIl Drago di Zenithia è una creatura potentissima...\n@c0@"
  ja: "@a@b%a001240「竜の神さまって\n\tプサンさんのことだよね？\n@c0@"
108:
  de: "@a%0%a001240@bIch kann mir kaum vorstellen, dass er wirklich so mächtig ist.\n@c0@"
  en: "@a%0%a001240@bIt's hard to really tell if he's all that powerful or not.\n@c0@"
  es: "@a%0%a001240@bEs difícil saber si es tan poderoso o no.\n@c0@"
  fr: "@a%0%a001240@bOn ne sait toujours pas s'il est si puissant que ça.\n@c0@"
  it: "@a%0%a001240@bMa il caro Dottor Agon non lo è affatto!\nEh eh eh!\n@c0@"
  ja: "@a@b%a001240「プサンさんって\n\tすごいのか　すごくないのか\n\t本当に　わかんない人だよね。\n@c0@"
109:
  de: "@a%0%a001250@bIst es nicht erstaunlich, dass unsere Taten selbst hier draußen in den Bergen Auswirkungen haben? Wenn auch nur indirekt...\n@c0@"
  en: "@a%0%a001250@bIt's amazing that the effect of something we\ndid is being felt all the way out here in the\nmiddle of the mountains.\n@c0@"
  es: "@a%0%a001250@bEs impresionante que el efecto de lo que hemos hecho se deje sentir hasta aquí, en mitad de las montañas.\n@c0@"
  fr: "@a%0%a001250@bJe n'en reviens pas que quelque chose que nous avons fait si loin se ressente jusqu'ici, au milieu\ndes montagnes.\n@c0@"
  it: "@a%0%a001250@bSiamo stati noi ad aiutare il Drago di Zenithia a tornare in vita...\n㈡\nÈ bello vedere che i nostri sforzi portano beneficio a tutto il mondo, incluso questo villaggio sperduto tra i monti...\n@c0@"
  ja: "@a@b%a001250「わたしたちのしたことが\n\tこんな山奥にまで\n\t広まってるなんて　すごーい。\n@c0@"
110:
  de: "@aSancho@bEs ist wegen Señor Ache, si? Wir müssen ihm Gracias sagen...\n@c0@"
  en: "@aSancho@bEes because of señor Agon, sí?\nWe must esay gracias to heem, no?\n@c0@"
  es: "@aSancho@bEs por el señor Agón, ¿verdad?\nPues ahí nomás tenemos que darle las gracias.\n@c0@"
  fr: "@aSancho@bC'est grâce au señor Agon, siⓡ\nIl f-faudrait lui dire gracias, noⓡ\n@c0@"
  it: "@aSancho@b¿Es merito del señor Dottor Agon, eh?\nDobbiamo dir gracias a lui si la situación es un poco migliorata...\n@c0@"
  ja: "@a@bサンチョ「ここは　すなおに　プサンさんに\n\t感謝しようじゃありませんか。　ねえ？\n@c0@"
111:
  de: "@aOtto@bDann ist jetzt wohl der beste Zeitpunkt, nach Nadiria zu gehen und ihm ordentlich eins auf die Mütze zu geben!\n@c0@"
  en: "@aTuppence@bThat means now's the perfect time to go in after him and knock him for six!\n@c0@"
  es: "@aAlazar@b¡Eso significa que es el momento perfecto para entrar y darle una buena tunda!\n@c0@"
  fr: "@aInnocent@bAlors, c'est le bon moment pour se lancer à ses trousses et lui faire sa fête, à ce Grand Maîtreⓠ\n@c0@"
  it: "@aSimon@bEh, sì...\nTutto merito del mio amico, il Drago di Zenithia...\n@c0@"
  ja: "@a@bピピン「ということは\n\t攻め込むなら　今が　まさに\n\t絶好のチャンスってことですね！\n@c0@"
112:
  de: "@aNera@bDas bedeutet wohl, dass wir ein kleines bisschen aufatmen können...\n@c0@"
  en: "@aNera@bI suppose that means we can breathe a small sigh of relief for now.\n@c0@"
  es: "@aNera@bSupongo que eso significa que podemos sospirare de alivio de momento.\n@c0@"
  fr: "@aNera@bJe suppose qu'on peut déjà pousser un premier petit soupir de soulagement, alors.\n@c0@"
  it: "@aNera@bQuesto vuol dire che, almeno per il momento, la situazione è meno drammatica di quanto temevamo...\n@c0@"
  ja: "@a@bフローラ「今の話が　本当なら\n\t少しですが　安心できますわ。\n@c0@"
113:
  de: "@aBianca@bDie drei großen Ringe...\nDie müssen wir erst mal finden.\n@c0@"
  en: "@aBianca@bThree great circles...\nFirst we have to get hold of 'em.\n@c0@"
  es: "@aBianca@bTres grandes anillos...\nPrimero tenemos que hacernos con ellos.\n@c0@"
  fr: "@aBianca@bTrois grands anneaux...\nIl faut d'abord qu'on les trouve.\n@c0@"
  it: "@aBianca@bDobbiamo trovare questi tre grandi anelli.\n@c0@"
  ja: "@a@bビアンカ「３つのリング……。\n\tまずは　それを用意しないと\n\tいけないわね。\n@c0@"
114:
  de: "@aBianca@bWär's nicht schön, wenn wir sie alle schon hätten?\n@c0@"
  en: "@aBianca@bIt'd be handy if we already had 'em, eh?\n@c0@"
  es: "@aBianca@bNos vendría bien tenerlos ya, ¿eh?\n@c0@"
  fr: "@aBianca@bCe serait pratique si on les avait déjà, heinⓡ\n@c0@"
  it: "@aBianca@bSarebbe bello se li avessimo già qui, a portata di mano...\n@c0@"
  ja: "@a@bビアンカ「私たちの　持っているのが\n\tそれだと　いいんだけど……。\n@c0@"
115:
  de: "@aNera@bDie großen Ringe darbieten? Wie wir das wohl anstellen sollen...\n@c0@"
  en: "@aNera@bI wonder how we offer up these great circles.\n@c0@"
  es: "@aNera@bMa me pregunto cómo ofrecer esos grandes anillos.\n@c0@"
  fr: "@aNera@bJe me demande comment il faut utiliser ces grands anneaux.\n@c0@"
  it: "@aNera@bMi chiedo come vadano usati i tre grandi anelli...\nForse devono essere indossati nel Tempio dell'Estuario?\n@c0@"
  ja: "@a@bフローラ「リングの　ささげかた\n\tわかるかしら……。\n@c0@"
116:
  de: "@a%0%a001240@bHört sich einfacher an, als wir dachten, oder, Papa?\n@c0@"
  en: "@a%0%a001240@bSounds easier than we thought to open the gateway, doesn't it?\n@c0@"
  es: "@a%0%a001240@bLo de abrir la puerta suena más fácil de lo que pensábamos, ¿verdad?\n@c0@"
  fr: "@a%0%a001240@bOn dirait que ça va être plus facile que prévu d'ouvrir les portes, nonⓡ\n@c0@"
  it: "@a%0%a001240@bAllora basta avere tre anelli per aprire il varco per Nadiria?!\nCredevo che la cosa fosse molto più complicata!\n@c0@"
  ja: "@a@b%a001240「思ったより　かんたんに\n\tトビラは　開きそうだね？\n@c0@"
117:
  de: "@a%0%a001250@bDas war also Großmutters Zimmer. Es ist schön und groß, aber irgendwie auch ein wenig einsam.\n@c0@"
  en: "@a%0%a001250@bSo this was Grandma's room. It's nice and big, but it's got a bit of a lonely feel to it.\n@c0@"
  es: "@a%0%a001250@bAsí que este era el cuarto de la abuela. Es grande y bonito, pero da una sensación un poco solitaria.\n@c0@"
  fr: "@a%0%a001250@bAlors c'était la chambre de grand-mèreⓡ\nElle est grande et très jolie, mais elle\ndégage une impression de solitude.\n@c0@"
  it: "@a%0%a001250@bQuesta era la stanza di nonna Mada? Che grande che è! Però dà l'impressione di essere un posto isolato dal resto del mondo...\n@c0@"
  ja: "@a@b%a001250「ここが\n\tマーサおばあちゃんのお部屋。\n\t広いけど　なんだかさみしい所ね……。\n@c0@"
118:
  de: "@aSancho@bEine Psalmenbuch? Eine Buch, das deine Madre, Señora Magda, gelesen hat, si? Du musst es behalten, Chico, als Erinnerung.\n@c0@"
  en: "@aSancho@bEes a book of psalms? A book your madre, señora Mada, eshe used to read, sí? You must\r\nkeep thees memento esafe, friend.\n@c0@"
  es: "@aSancho@b¿Es un libro de salmos? Un libro que solía leer tu amá, la señora Perséfone, ¿no? Debes guardar ese recuerdo a buen recaudo, chamaco.\n@c0@"
  fr: "@aSancho@bC'est oun recueil de p-p-psaumesⓡ Oun livre que ta madre, la señora Magdalena, lisait souvent, siⓡ\nTu dois le garder bien à l'abri, chico.\n@c0@"
  it: "@aSancho@bEs un libro de preghieras, chico. Tua madre deve averlo letto espessos, cuando estava aquí.\nPienso que dovresti tenerlo tu...\n@c0@"
  ja: "@a@bサンチョ「この詩篇集…　マーサさまも\n\tお読みになられたはずです。\n\t坊っちゃん　大事にしましょうね。\n@c0@"
119:
  de: "@a%0%a001240@bIst dir aufgefallen, dass dieses Zimmer an der höchsten Stelle des Dorfes liegt?\n@c0@"
  en: "@a%0%a001240@bDid you notice that this room's the highest room in\nthe village?\n@c0@"
  es: "@a%0%a001240@b¿Te has dado cuenta de que este cuarto es la habitación más alta del pueblo?\n@c0@"
  fr: "@a%0%a001240@bTu as remarqué que cette pièce était la plus haute de tout le villageⓡ\n@c0@"
  it: "@a%0%a001240@bHai notato che questa stanza è la più alta del villaggio?\n@c0@"
  ja: "@a@b%a001240「ねえ　気づいた？\n\tこのお部屋って　この村で\n\tいちばん　高い場所にあるよ。\n@c0@"
120:
  de: "@a%0%a001240@bEin bisschen wie im Märchen, wo die Prinzessin immer im höchsten Turmzimmer eingesperrt ist!\n@c0@"
  en: "@a%0%a001240@bIt's a bit like in faerie stories where they have the princess locked up in the highest room of a tower!\n@c0@"
  es: "@a%0%a001240@b¡Se parece a los cuentos de hadas en los que encierran a la princesa en la estancia más alta de la torre!\n@c0@"
  fr: "@a%0%a001240@bC'est un peu comme dans les contes de fées, où la princesse est toujours enfermée au sommet d'une haute tourⓠ\n@c0@"
  it: "@a%0%a001240@bMi ricorda una di quelle fiabe in cui la bella principessa è tenuta prigioniera in una torre altissima...\n@c0@"
  ja: "@a@b%a001240「塔の上に　とらわれた\n\tお姫さまのお部屋　っていう感じだね。\n@c0@"
121:
  de: "@aOtto@bEin Psalmenbuch? Es wird uns bestimmt noch von Nutzen sein. Ich hoffe sehr, dass die Göttin über uns wacht...\n@c0@"
  en: "@aTuppence@bA book of psalms? I'm sure it will be of use to us in times of need. If only those up on high would be there for us...\n@c0@"
  es: "@aAlazar@b¿Un libro de salmos? Seguro que nos resulta útil en tiempo de necesidad. Ojalá los de arriba quieran escucharnos...\n@c0@"
  fr: "@aInnocent@bUn livre de psaumesⓡ Je suis sûr qu'il nous sera utile en cas de besoin. Si seulement ceux d'en haut pouvaient être là pour nous, à ce moment-là...\n@c0@"
  it: "@aSimon@bUn libro di preghiere? Credo che ci sarà utile!\nSpero solo che la dea non sia troppo occupata, quando le chiederemo di aiutarci!\n@c0@"
  ja: "@a@bピピン「神の言葉ですか。　困ったときに\n\t必ず　助けてくれるなら信じるんですが\n\tそういう神って　なかなか　いなくて。\n@c0@"
122:
  de: "@aBianca@bWelch ein großes Zimmer! Magda muss eine einflussreiche Persönlichkeit gewesen sein.\n@c0@"
  en: "@aBianca@bWhat a huge room! Looks like Mada was thought of as someone really special 'round here.\n@c0@"
  es: "@aBianca@b¡Menuda habitación! Parece que a Perséfone la tenían por alguien muy especial aquí, ¿sabes?\n@c0@"
  fr: "@aBianca@bQuelle grande chambreⓠ Apparemment, Magdalena était considérée comme quelqu'un de vraiment spécial, par ici.\n@c0@"
  it: "@aBianca@bQuesta stanza è enorme! Per essere stata alloggiata in un posto simile, Mada doveva essere considerata una persona importantissima!\n@c0@"
  ja: "@a@bビアンカ「うわ～　広いお部屋。\n\tマーサさまって　みんなから　とても\n\t大切にされていたんでしょうね。\n@c0@"
123:
  de: "@a%0%a001250@bDas war also Großmutters Zimmer. Es ist schön und groß, aber irgendwie auch ein wenig einsam.\n@c0@"
  en: "@a%0%a001250@bSo this was Grandma's room. It's nice and big, but it's got a bit of a lonely feel to it.\n@c0@"
  es: "@a%0%a001250@bAsí que este era el cuarto de la abuela. Es grande y bonito, pero da una sensación un poco solitaria.\n@c0@"
  fr: "@a%0%a001250@bAlors c'était la chambre de grand-mèreⓡ\nElle est grande et très jolie, mais elle\ndégage une impression de solitude.\n@c0@"
  it: "@a%0%a001250@bQuesta era la stanza di nonna Mada? Che grande che è! Però dà l'impressione di essere un posto isolato dal resto del mondo...\n@c0@"
  ja: "@a@b%a001250「ここが\n\tマーサおばあちゃんのお部屋。\n\t広いけど　なんだかさみしい所ね……。\n@c0@"
124:
  de: "@aSancho@bSi. Señora Magda hatte eine große Herz. Groß, stark und wunderschön.\n@c0@"
  en: "@aSancho@bSí. Señora Mada, eshe has the beeg heart.\r\nBeeg, estrong and beautiful.\n@c0@"
  es: "@aSancho@bSí. La señora Perséfone tenía un gran corazón.\nGrande, fuerte y bello.\n@c0@"
  fr: "@aSancho@bSi. La señora Magdalena avait oun c-cœur immense. Immense, courageux et b-beau.\n@c0@"
  it: "@aSancho@bLa señora Mada era una mujer... ¡No! ¿Que dico?\r\n¡La señora Mada ES una mujer con el corazon puro, nobile y fuerte! ¡Mada es viva, soy seguro!\n@c0@"
  ja: "@a@bサンチョ「そうです。\n\tマーサさまは　強く　美しい心を\n\tお持ちの方でした……。\n@c0@"
125:
  de: "@a%0%a001240@bWas meint sie mit Licht im Herzen? Ich verstehe das nicht...\n@c0@"
  en: "@a%0%a001240@bWhat does she mean by light in your heart?\nIs that the same as just being light-hearted?\n@c0@"
  es: "@a%0%a001240@b¿Qué ha querido decir con lo de luz en el corazón?\n¿Es lo mismo que tener el corazón alegre?\n@c0@"
  fr: "@a%0%a001240@bQu'est-ce qu'elle veut dire en parlant de lumière qui brille dans nos cœursⓡ Ça veut dire qu'on peut s'en servir pour voir la nuitⓡ\n@c0@"
  it: "@a%0%a001240@bⓕColui che ha la luce nel cuore non verrà mai vinto dall'oscuritàⓖ...\nChe bella frase... Ma cosa vorrà dire...?\n@c0@"
  ja: "@a@b%a001240「心に光を　ってどういうこと？\n\t明るい気持ちでいれば　いいって\n\tいうことかな？\n@c0@"
126:
  de: "@aBianca@bDeine Mutter hatte recht, %a000090! Wir dürfen die Hoffnung nicht aufgeben!\n@c0@"
  en: "@aBianca@bYour mum said it right, eh, %a000090?\nWe mustn't lose hope!\n@c0@"
  es: "@aBianca@bTu madre lo dijo bien claro, ¿eh, %a000090?\n¡No hay que perder la esperanza!\n@c0@"
  fr: "@aBianca@bTa mère avait raison, %a000090.\nIl ne faut pas perdre espoirⓠ\n@c0@"
  it: "@aBianca@bTua madre ha detto una cosa giustissima, %a000090.\nNon dobbiamo perdere la speranza!\n@c0@"
  ja: "@a@bビアンカ「%a000090のお母さまって\n\tさすが　いいことおっしゃるわね。\n\t私たちも　希望をすてないでいましょ！\n@c0@"
127:
  de: "@aNera@bSeit ich dich getroffen habe, trage ich auch Licht im Herzen. Du bist das Licht meines Lebens, Liebling.\n@c0@"
  en: "@aNera@bI've had light in my heart ever since the day I met you. You're the light of my life, darling.\n@c0@"
  es: "@aNera@bLa luz ha inundado il mio cuore desde que te conocí. Eres la luz de mi vida, caro mio.\n@c0@"
  fr: "@aNera@bLa lumière brille dans mon cœur depuis le jour où je t'ai rencontré. Tu illumines ma vie, mon chéri.\n@c0@"
  it: "@aNera@bDal momento che ti ho incontrato, nel mio cuore risplende la calda luce dell'amore.\r\nTesoro, ti prego, non spegnerla mai...\n@c0@"
  ja: "@a@bフローラ「私は　あなたと出会ってから\n\tずっと　心が光で　満たされています。\n\tあなたが　光　そのものなのですわ。\n@c0@"
128:
  de: "@aBianca@bDas ist also Steile Höh... Wo deine Mutter geboren wurde und aufwuchs.\n@c0@"
  en: "@aBianca@bSo this is Lofty Peak... This is where your mum was born and raised.\n@c0@"
  es: "@aBianca@bAsí que esto es Cumbre Excelsa... Aquí es donde nació y creció tu madre, ¿no?\n@c0@"
  fr: "@aBianca@bVoici donc Haute-Cime... là où ta maman est née et\na grandi.\n@c0@"
  it: "@aBianca@bQuesto è il villaggio di Picco Maximo.\nTua madre è nata e cresciuta qui, non è vero?\n@c0@"
  ja: "@a@bビアンカ「ここが　エルヘブン……。\n\t%a000090のお母さまが\n\t生まれ育った村なのね。\n@c0@"
129:
  de: "@aNera@bDieses Dorf hat eine ganz besonders mysteriöse Aura. Es macht eher den Eindruck eines heiligen Ortes als den einer Wohnsiedlung...\n@c0@"
  en: "@aNera@bThere's a very mysterious air to this village.\r\nIt feels like more of a holy place than an\r\ninhabited settlement.\n@c0@"
  es: "@aNera@bEsta aldea tiene un aire molto misterioso.\nSembra más un lugar sagrado que un poblado abandonado.\n@c0@"
  fr: "@aNera@bCe village a quelque chose d'assez mystérieux.\nIl ressemble plus à un lieu sacré qu'à un endroit habité.\n@c0@"
  it: "@aNera@bA Picco Maximo c'è un'atmosfera quasi mistica.\nSembra più un luogo sacro che un normale villaggio...\n@c0@"
  ja: "@a@bフローラ「ふしぎな空気に　つつまれた\n\t村ですのね。　村というより\n\t一種の　聖地　という感じですわ。\n@c0@"
130:
  de: "@a%0%a001240@bHier ist es ziemlich ruhig, wie immer... Das macht mich ein wenig nervös.\n@c0@"
  en: "@a%0%a001240@bIt's quiet here as usual, isn't it?\nIt makes me feel a bit nervous.\n@c0@"
  es: "@a%0%a001240@bEl mismo silencio de siempre, ¿no?\nMe pone un poco nervioso.\n@c0@"
  fr: "@a%0%a001240@bC'est toujours aussi calme, ici, heinⓡ\nÇa me rend un peu nerveux.\n@c0@"
  it: "@a%0%a001240@bQuesto posto è fin troppo tranquillo per i miei gusti.\nMi piacerebbe che ci fosse un po' più di movimento...\n@c0@"
  ja: "@a@b%a001240「あいかわらず\n\tこの村は　静かだね。\n\tあ　背中ムズムズしてきた。\n@c0@"
131:
  de: "@a%0%a001250@bZzz... Ja, ja... Ich bin... wach...\n@c0@"
  en: "@a%0%a001250@bZzz... Yes, yes... I'm...awake...\n@c0@"
  es: "@a%0%a001250@bZzz... Sí, sí... Estoy... despierta...\n@c0@"
  fr: "@a%0%a001250@bZzz... Oui, oui... Je suis... réveillée...\n@c0@"
  it: "@a%0%a001250@bZzz...\nEh? Oh, sì...\nSono sveglia...\n@c0@"
  ja: "@a@b%a001250「むにゃ…　はい……。\n\tわたし　おきてます……。\n@c0@"
132:
  de: "@aSancho@bEs ist schon spät, no? Gehen wir noch nisst Siesta machen? Früh ins Bett, früh aufstehen. So ist es am besten, weißt du.\n@c0@"
  en: "@aSancho@bEes late, sí? We no go for the siesta yet?\r\nEarly to bed, early to rise. Thees ees the best way, you know.\n@c0@"
  es: "@aSancho@bEs tarde, ¿no? ¿Todavía no dormimos la siesta?\r\nQuien pronto se acuesta, temprano madruga.\r\nEso es lo mejor.\n@c0@"
  fr: "@aSancho@bIl est tard, noⓡ On ne va pas faire oune petite siestaⓡ L'avenir appartient à ceux qui se lèvent tôt et donc à ceux qui se c-c-couchent tôt, tu sais.\n@c0@"
  it: "@aSancho@bEs tarde...\n¿Por qué no facciamo una bella siesta, eh?\n@c0@"
  ja: "@a@bサンチョ「さあさあ　夜も更けました。\n\t今日は休みましょう！\n\t早寝早起きが　いちばんですよ。\n@c0@"
133:
  de: "@aOtto@bAaah, ich bin ziemlich müde heute. Äh, nein, natürlich nicht! Ich bin putzmunter!\n@c0@"
  en: "@aTuppence@bAah, I'm rather tired today.\nEr, no, no! I'm fine! Fit as a fiddle!\n@c0@"
  es: "@aAlazar@bAaah, hoy estoy bastante cansado.\nDigooo... ¡No! ¡Estoy bien! ¡Estoy en plena forma!\n@c0@"
  fr: "@aInnocent@bAah, je suis un peu fatigué, aujourd'hui.\nEuh, hum... non, nonⓠ Je vais bienⓠ En pleine formeⓠ\n@c0@"
  it: "@aSimon@bAh, che stanchezz... \nNo! Un vero soldato è sempre fresco, riposato e pronto all'azione! Comandi, Maestà!\n@c0@"
  ja: "@a@bピピン「ふーっ　今日も　つかれたなあ。\n\tあっ！　いえ　平気ですよ！\n\tまだまだ　いけますっ！\n@c0@"
134:
  de: "@a%0%a001240@bWas es wohl heute Abend zu essen gibt in der Herberge... Ich hab so einen Hunger!\n@c0@"
  en: "@a%0%a001240@bI wonder what food they'll be serving at the inn tonight. I'm starving!\n@c0@"
  es: "@a%0%a001240@b¿Qué darán de comer esta noche en la posada? ¡Me muero de hambre!\n@c0@"
  fr: "@a%0%a001240@bJe me demande bien ce qu'on nous servira à dîner,\nà l'auberge. Je meurs de faimⓠ\n@c0@"
  it: "@a%0%a001240@bChissà cosa si mangerà alla locanda questa sera...\nHo così tanta fame che mi papperei un Cinghialorco intero, ossa incluse!\n@c0@"
  ja: "@a@b%a001240「宿屋の今夜の\n\tごはんは　なにかな？\n\tボク　おなかペッコペコ！\n@c0@"
135:
  de: "@aBianca@bWie traurig, dass sie alle vergessen sind!\n@c0@"
  en: "@aBianca@bHow sad that they've bin forgotten!\n@c0@"
  es: "@aBianca@b¡Qué pena que estén olvidados!\n@c0@"
  fr: "@aBianca@bC'est triste qu'on les ait oubliésⓠ\n@c0@"
  it: "@aBianca@bCome ha potuto il mondo dimenticare questa gente...?\n@c0@"
  ja: "@a@bビアンカ「忘れられた民族なんて\n\tさみしいこと　言うわねえ。\n@c0@"
136:
  de: "@aNera@bEs ist wohl ganz normal, dass man sie vergessen hat, wo sie doch in aller Abgeschiedenheit leben. Aber ein bisschen tun sie mir schon leid.\n@c0@"
  en: "@aNera@bI suppose it's only to be expected that they'd be forgotten, living all the way out here. It is a bit sad for them, though.\n@c0@"
  es: "@aNera@bO sea, era de esperar que los olvidaran, viviendo aquí tan lontano. Aunque dan un po' de lástima.\n@c0@"
  fr: "@aNera@bJe suppose qu'il fallait s'attendre à ce qu'on les oublie. Ils vivent dans un endroit si reculé.\nMais c'est tout de même triste pour eux.\n@c0@"
  it: "@aNera@bForse sono stati loro stessi a volersi far dimenticare dal mondo, scegliendo di vivere in questo posto inaccessibile...\n@c0@"
  ja: "@a@bフローラ「こんな　奥地にある村だから\n\tしかたないのでしょうか……。\n\t忘れられたなんて　さみしいですけど。\n@c0@"
137:
  de: "@a%0%a001250@bDie Vergessenen? Wie schrecklich, wenn man vergessen wird! Du wirst mich doch nie vergessen, oder, Papa?\n@c0@"
  en: "@a%0%a001250@bThe forgotten ones? It'd be horrible to be forgotten. You won't forget me, will you, Dad?\n@c0@"
  es: "@a%0%a001250@b¿Los olvidados? Debe de ser horrible que te olviden. No me olvidarás nunca, ¿verdad, papi?\n@c0@"
  fr: "@a%0%a001250@bLes oubliésⓡ Ça serait horrible d'être complètement oubliée. Tu ne m'oublieras pas toi, hein, papaⓡ\n@c0@"
  it: "@a%0%a001250@bDev'essere orribile quando qualcuno si dimentica di te! Papà, giurami che non ti scorderai mai di me, di %a001240 e della mamma!\n@c0@"
  ja: "@a@b%a001250「忘れられるなんて　こわい。\n\tお父さん　わたしのこと\n\t絶対　忘れないでね……。\n@c0@"
138:
  de: "@a%0%a001240@bIch vergesse nie Orte, an denen ich schon mal war. Ich frage mich, wer die Leute hier denn vergessen hat?\n@c0@"
  en: "@a%0%a001240@bI never forget places I've been, even if I've only been once. I wonder who the people here have\nbeen forgotten by.\n@c0@"
  es: "@a%0%a001240@bYo nunca olvido los lugares en los que he estado, aunque solo haya sido una vez. ¿Quién habrá olvidado a esta gente?\n@c0@"
  fr: "@a%0%a001240@bJe n'oublie jamais un endroit, même si je n'y ai été qu'une seule fois. Je me demande par qui ces gens ont été oubliés...\n@c0@"
  it: "@a%0%a001240@bIo mi ricordo sempre dei posti dove sono andato e delle persone che ho incontrato. Come ha fatto il mondo a dimenticarsi di questa gente?\n@c0@"
  ja: "@a@b%a001240「一度行った場所のことは\n\tボク　忘れないよ！\n\tこの村は　だれに忘れられてるの？\n@c0@"
139:
  de: "@aSancho@bSi, si. Die Weisen sind schon alt und gehen immer früh ins Bett. Wir kommen morgen wieder, no?\n@c0@"
  en: "@aSancho@bSí, sí. The elder peoples, they are always going to bed early. We come back een the morning, okay?\n@c0@"
  es: "@aSancho@bSí, sí. Los mayores se van a la cama tempranito. Volvamos por la mañana, ¿ok?\n@c0@"
  fr: "@aSancho@bSi, si. Les Anciens, ils vont t-t-toujours se coucher tôt. On reviendra demain matin tôt, de acuerdoⓡ\n@c0@"
  it: "@aSancho@bClaro, las personas anzianas vanno siempre a dormire muy prestos.\nCe conviene tornare mañana mattina.\n@c0@"
  ja: "@a@bサンチョ「お年寄りは　夜が早いんです。\n\tまた明日　出直しましょう。\n@c0@"
140:
  de: "@a%0%a001250@bSancho sagt, es ist unhöflich, die Leute spät am Abend zu besuchen.\n@c0@"
  en: "@a%0%a001250@bSancho said it's rude to visit people too late in\nthe evening.\n@c0@"
  es: "@a%0%a001250@bSancho dijo que es de mala educación visitar a la gente por la noche.\n@c0@"
  fr: "@a%0%a001250@bSancho dit que c'est malpoli d'aller rendre visite\naux gens trop tard le soir.\n@c0@"
  it: "@a%0%a001250@bLo zio Sancho dice che è da maleducati presentarsi in casa d'altri di sera...\nA meno che non si sia stati invitati per cena!\n@c0@"
  ja: "@a@b%a001250「夜おそくに　たずねるのは\n\t失礼にあたるって\n\tサンチョが　言ってたわよ。\n@c0@"
141:
  de: "@aBianca@bWir sollten Schluss machen für heute. Es ist gefährlich, hier im Dunkeln rumzulaufen. Stell dir doch nur mal vor, du trittst über den Rand!\n@c0@"
  en: "@aBianca@bTime for bed now, I think. It's dangerous walkin' about this place in the dark. Imagine if you stepped over the edge!\n@c0@"
  es: "@aBianca@bHora de ir a la cama, creo. Andar de noche por este sitio es peligroso. ¡Imagina que te cayeras por el borde!\n@c0@"
  fr: "@aBianca@bJe crois que c'est l'heure d'aller se coucher. C'est dangereux de se promener par ici dans le noir. Imagine si tu trébuchais sur le bordⓠ\n@c0@"
  it: "@aBianca@bAndiamo a dormire, amore.\nÈ troppo pericoloso andare in giro di notte da queste parti.\n㈡\nCon tutti i precipizi che ci sono, basta un attimo per ritrovarsi a valle con le ossa rotte!\n@c0@"
  ja: "@a@bビアンカ「今夜は　寝ましょう。　夜に\n\tこの村を歩きまわるのは　キケンだわ。\n\t足を　ふみはずしたら　どうするの？\n@c0@"
142:
  de: "@aNera@bWie schade! Da nehmen wir diese furchteinflößende Reise auf uns, durch das Dunkel hier oben, und dann bekommen wir sie nicht einmal zu Gesicht!\n@c0@"
  en: "@aNera@bWhat a pity! Fancy not being able to see them after that scary journey up here in the dark!\n@c0@"
  es: "@aNera@b¡Qué lástima! ¡Supón que no podamos verlos después de este terrible viaggio ascendiendo en la oscuridad!\n@c0@"
  fr: "@aNera@bQuel dommageⓠ Ne pas pouvoir les voir après avoir fait une telle ascension dans le noirⓠ\n@c0@"
  it: "@aNera@bCerto che torneremo domattina! Con tutta la fatica che abbiamo fatto per arrivare fin qui, di certo non ce ne andremo via senza aver incontrato gli Anziani!\n@c0@"
  ja: "@a@bフローラ「せっかく　こわい思いをして\n\t上まで　あがってきましたのに。\n\tざんねんですわ……。\n@c0@"
143:
  de: "@a%0%a001240@bIch habe keine Angst vor der Nacht! Ich mach nicht mehr ins Bett, wovor sollte ich also Angst haben?\n... Ich mach wirklich nicht mehr ins Bett, ehrlich!\n@c0@"
  en: "@a%0%a001240@bI'm not scared of night-time! I don't wet the bed any more, so what's there to be afraid of?\n...I don't wet it, honest!\n@c0@"
  es: "@a%0%a001240@b¡La noche no me da miedo! Ya no mojo la cama, ¿de qué iba a tener miedo?\n... ¡Que ya no la mojo, de verdad!\n@c0@"
  fr: "@a%0%a001240@bJe n'ai pas peur du noirⓠ Je ne fais plus pipi au lit, alors de quoi j'aurais peurⓡ\n... Je ne mouille plus les draps, promis c'est vraiⓠ\n@c0@"
  it: "@a%0%a001240@bIo non ho paura dell'oscurità.\nÈ una cosa normale, scende ogni notte quando tramonta il sole, no? Perché dovrei temerla?\n@c0@"
  ja: "@a@b%a001240「ボクは　夜　こわくないよ！\n\tもう　おねしょもしないし……\n\tほんとに　してないからね！！\n@c0@"
144:
  de: "@a%0%a001250@bIch weiß, wie er sich fühlt. Nachts treiben sich finstere Kreaturen herum. Manchmal hört man sogar ihre Schritte...\n@c0@"
  en: "@a%0%a001250@bI know how he feels. Scary creatures come out at night. You can hear their footsteps...\n@c0@"
  es: "@a%0%a001250@bSé cómo se siente. Por la noche salen criaturas terroríficas. Se oyen sus pasos...\n@c0@"
  fr: "@a%0%a001250@bJe sais ce qu'il ressent. Il y a des créatures effrayantes qui sortent, la nuit. On les entend marcher...\n@c0@"
  it: "@a%0%a001250@bCapisco perché quel tipo abbia paura delle tenebre. Con il buio, orribili creature escono dalle loro lugubri tane, e attacc... Argh! Mi sto spaventando da sola!\n@c0@"
  ja: "@a@b%a001250「わかるの……。\n\t夜になると　こわい人が　少しずつ\n\tやってくるのが…　足音がするの……。\n@c0@"
145:
  de: "@aBianca@bUnd wenn es uns nicht gelingt, den Großmeister zu besiegen...?\n@c0@"
  en: "@aBianca@bI wonder what'll happen if we dun't manage to defeat the Grandmaster.\n@c0@"
  es: "@aBianca@bMe pregunto qué pasará si no conseguimos derrotar al Gran Maestro.\n@c0@"
  fr: "@aBianca@bJe me demande ce qui se passera si nous ne réussissons pas à battre le Grand Maître.\n@c0@"
  it: "@aBianca@bCosa accadrebbe se non riuscissimo a sconfiggere il Gran Maestro degli Inferi?\n@c0@"
  ja: "@a@bビアンカ「もし　大魔王を\n\tたおせなかったら\n\tどうなっちゃうのかしら……。\n@c0@"
146:
  de: "@aBianca@bNein, Schluss damit, so darf ich nicht reden! Wenn wir alle zusammenhalten, kann uns nichts geschehen, nicht wahr?\n@c0@"
  en: "@aBianca@bListen to me! I mustn't talk like that, eh?\r\nThere's nothin' we can't do if we all stick \r\ntogether as a family!\n@c0@"
  es: "@aBianca@bPero ¡qué digo! No debo hablar así, ¿eh?\n¡Nada es imposible si nos mantenemos como una familia unida!\n@c0@"
  fr: "@aBianca@bOh, je ne devrais pas dire ce genre de chose, heinⓡ\nJe suis sûre qu'on y arrivera si toute la famille se serre les coudesⓠ\n@c0@"
  it: "@aBianca@bAh, che domanda stupida!\nCerto che lo sconfiggeremo!\nSe resteremo uniti, nessuno potrà resisterci!\n@c0@"
  ja: "@a@bビアンカ「ダメよね。　弱気になっちゃ。\n\t私たち　家族が　そろえば\n\tできないことなんて　ないわよね！\n@c0@"
147:
  de: "@aNera@bDas könnte doch ganz schön sein, eine Welt, in der immer nur die Sterne leuchten und der Mond scheint...\n@c0@"
  en: "@aNera@bIt could be quite beautiful, a night-time land of only stars and moons...\n@c0@"
  es: "@aNera@bEsto podría ser precioso, una terra de la notte con solo estrellas y luna...\n@c0@"
  fr: "@aNera@bCela pourrait être joli un monde où il fait toujours nuit et où seules les étoiles et la lune viennent se détacher dans l'obscurité...\n@c0@"
  it: "@aNera@bLa notte è bellissima...\nIl cielo stellato, la luna, il paesaggio ammantato dal velo dell'oscurità...\n@c0@"
  ja: "@a@bフローラ「月と星だけの　夜の国なら\n\tステキなんでしょうけど……\n@c0@"
148:
  de: "@aNera@bAber die Vorstellung einer nächtlichen Welt voller grässlicher Monster ist nicht ganz so einladend.\n@c0@"
  en: "@aNera@bBut the idea of a night-time land full of scary monsters isn't quite so appealing.\n@c0@"
  es: "@aNera@bPero la idea de una terra de la notte llena de monstruos horribles no me atrae tanto.\n@c0@"
  fr: "@aNera@bEn revanche, l'idée d'un monde où il fait toujours nuit et où rôdent des monstres terrifiants ne m'attire pas trop...\n@c0@"
  it: "@aNera@bE i mostri che sembrano sbucare dal nulla!\nI precipizi dei quali rischi di non accorgerti!\n㈡\nNo, no.\nTutto sommato, preferisco la rassicurante luce del giorno!\n@c0@"
  ja: "@a@bフローラ「こわい魔物さんが\n\tぞろぞろ出てくる　夜の国は\n\t想像以上に　おそろしいでしょうね。\n@c0@"
149:
  de: "@aGriselda@bEins, zwei, drei... Nein, Zählen ist langweilig. Wie viele Stufen gibt's hier überhaupt, was meinst du?\n@c0@"
  en: "@aDebora@bOne, two, three... Nope, counting them is boring.\r\nJust how many stairs do you suppose there\r\nare here?\n@c0@"
  es: "@aStefania@bUno, due, tre... Me aburro de contar.\n¿Tú cuántos escalones crees que hay?\n@c0@"
  fr: "@aPandora@bUn, deux, trois... Non, c'est pénible de les compter. Combien crois-tu qu'il y a d'escaliers, iciⓡ\n@c0@"
  it: "@aViola@bCaro, quanti gradini ci saranno qui?\nContali tutti, poi mi dirai il totale.\n@c0@"
  ja: "@a@bデボラ「１　２　３……。\n\t数えるの　めんどう臭いわね。\n\t何段あるのかしら　ここの階段は……。\n@c0@"
150:
  de: "@aGriselda@bSie sollten sich nicht die Vergessenen nennen.\n@c0@"
  en: "@aDebora@bThey shouldn't call themselves the forgotten ones.\n@c0@"
  es: "@aStefania@bYo credo que no deberían llamarse los olvidados.\n@c0@"
  fr: "@aPandora@bIls ne devraient pas s'appeler eux-mêmes les oubliés.\n@c0@"
  it: "@aViola@bGli abitanti di Picco Maximo dicono di essere stati dimenticati dal mondo...\n@c0@"
  ja: "@a@bデボラ「自分から\n\t忘れられた民族なんて\n\t名乗るべきじゃないわ。\n@c0@"
151:
  de: "@aGriselda@bDas ist respektlos den Leuten gegenüber, die sich die Mühe gemacht haben, hierher zu kommen. Leuten wie mir.\n@c0@"
  en: "@aDebora@bIt's disrespectful to people like me who've come all this way to visit the place.\n@c0@"
  es: "@aStefania@bEs una falta di rispetto para personas come io, que han venido de lontano a visitarlos.\n@c0@"
  fr: "@aPandora@bC'est un manque de respect pour les gens comme moi qui se donnent la peine de venir jusqu'ici pour visiter cet endroit.\n@c0@"
  it: "@aViola@bSecondo me essi stessi hanno voluto farsi dimenticare, decidendo di costruire il villaggio in un luogo tanto remoto!\n㈡\nChi vuoi che si ricordi di loro, lontani come sono dalla civiltà?!\n@c0@"
  ja: "@a@bデボラ「忘れずに　ここに訪れる\n\tこの私のような人に　失礼だから。\n@c0@"
152:
  de: "@aGriselda@bSie erinnert sich an dich! Komisch. Ich hätte nicht gedacht, dass sich jemand an dich erinnern würde, wo ich doch gar nicht bei dir war damals...\n@c0@"
  en: "@aDebora@bShe remembers you! That's weird. I wouldn't have thought you'd be that memorable without me by\r\nyour side.\n@c0@"
  es: "@aStefania@b¡Ti ricorda! Qué raro. No pensaba que nadie pudiese acordarse di te sin estar yo a tu lado.\n@c0@"
  fr: "@aPandora@bElle se souvient de toiⓠ C'est bizarre.\nJe n'aurais pas cru que l'on puisse se souvenir\nde toi lorsque je ne suis pas à tes côtés.\n@c0@"
  it: "@aViola@bCome ha fatto a ricordarsi di te?!\nSei un tipo assolutamente anonimo!\nForse ti avrà scambiato per qualcun altro...\n@c0@"
  ja: "@a@bデボラ「あんたのこと\n\t覚えてくれている人がいたんだ。\n\t私が　一緒じゃないのにフシギね。\n@c0@"
153:
  de: "@aGriselda@bWir sollten ihn uns gut ansehen und uns sein Gesicht einprägen. Vielleicht wird er ja auch eines Tages ein Dieb...\n@c0@"
  en: "@aDebora@bWe should take a good look at him and remember his face for future reference. He could well end up becoming a thief.\n@c0@"
  es: "@aStefania@bDebemos fijarnos bien en la sua faccia y recordarla. Podría acabar convirtiéndose en un ladrón.\n@c0@"
  fr: "@aPandora@bOn devrait bien le regarder pour se souvenir de son visage à l'avenir. Il pourrait finir par devenir voleur.\n@c0@"
  it: "@aViola@bUna chiave universale in mano a un ladro?!\nChissà quante ne avrà combinate questo Arsenio Rubìo...\n@c0@"
  ja: "@a@bデボラ「この人の顔\n\tよ～く　覚えておきましょう。\n\tどろぼうになるかも　しれないから。\n@c0@"
154:
  de: "@aGriselda@bHui! Der scheint echt baff zu sein! Wir sollten ihm den Schlüssel mal zeigen. Dann sehen wir, was er alles tun würde, um ihn in die Hände zu kriegen.\n@c0@"
  en: "@aDebora@bWow! He seems impressed! We should flash it about a bit and see what he'd do to have the chance to lay his hands on it.\n@c0@"
  es: "@aStefania@b¡Vaya! ¡Está impresionado! Deberíamos exhibirla un po' y ver lo que está dispuesto a hacer para echarle el guante.\n@c0@"
  fr: "@aPandora@bWaouhⓠ Il a l'air impressionéⓠ On devrait la\nmontrer un peu et voir ce qu'il serait prêt à\nfaire pour mettre la main dessus.\n@c0@"
  it: "@aViola@bLa chiave ce l'abbiamo noi. Per la precisione, la chiave è mia ma la porti tu, caro: non vorrei che il metallo mi grattasse lo smalto via dalle unghie...\n@c0@"
  ja: "@a@bデボラ「わーお！　楽しい反応ね。\n\tカギを　ちらつかせて\n\t手玉に取りたいわ。\n@c0@"
155:
  de: "@aGriselda@bIn Bakenmünde haben wir damals die Segel gesetzt, als du noch ein Diener in der Ausbildung warst.\n@c0@"
  en: "@aDebora@bLodestar Harbour's the place we set sail from back when you were an unaccomplished servant.\n@c0@"
  es: "@aStefania@bPuerto Polaris es el puerto de donde partimos cuando aún no eras un sirviente cualificado.\n@c0@"
  fr: "@aPandora@bPort-Lanterne est l'endroit d'où nous avons pris la mer à l'époque où tu étais encore un domestique peu accompli.\n@c0@"
  it: "@aViola@bGrandport è il luogo da cui salpammo quando avevi appena iniziato a servirmi e riverirmi.\nNe hai fatta di strada da allora...\n@c0@"
  ja: "@a@bデボラ「ポートセルミは　私たちが\n\t船出した町よね。　その頃の%a000090は\n\tまだ不出来な　しもべ　だったわね。\n@c0@"
156:
  de: "@aGriselda@bÄhm... Was war noch gleich mit ihm? Ich hab's vergessen.\n@c0@"
  en: "@aDebora@bEr... What about him? Remind me.\n@c0@"
  es: "@aStefania@bMmm... ¿Qué pasa con él? Ricordamelo.\n@c0@"
  fr: "@aPandora@bEuh... Qu'est-ce qu'il avait de particulier déjàⓡ\nTu peux me le rappelerⓡ\n@c0@"
  it: "@aViola@bQuesto Arsenio Rubìo dev'essere tanto famoso per la sua abilità di ladro quanto io lo sono per la mia sfolgorante bellezza...\n@c0@"
  ja: "@a@bデボラ「……で　どんな　話だったっけ？\n@c0@"
157:
  de: "@aGriselda@bWahrheit und Vernunft? Was meint er damit? Ich glaube, hier überlasse ich dir das Reden, %a000090.\n㈡\nMit Leuten, die in Rätseln sprechen, kann ich nichts anfangen.\n@c0@"
  en: "@aDebora@bTruth and reason? What's he on about? I think you'd better do the talking with this lot, %a000090.\nI can't get on with people who speak in riddles.\n@c0@"
  es: "@aStefania@b¿La verità y la razón? ¿De qué habla? Será mejor que hables tú con esta gente, %a000090.\n㈡\nNo me llevo bene con las personas que hablan en enigmas.\n@c0@"
  fr: "@aPandora@bLa vérité et le pourquoi du commentⓡ De quoi il parleⓡ Je crois que tu ferais bien d'aller parler\nà ce groupe, %a000090.\n㈡\nJ'ai du mal avec les gens qui parlent par énigmes.\n@c0@"
  it: "@aViola@bNo, non ho sete di conoscenza.\nSono venuta qui solo perché ho voluto accompagnarti, caro.\n㈡\nSenza di me non riusciresti nemmeno a saltar giù dal letto quando ti svegli.\n@c0@"
  ja: "@a@bデボラ「世界の道理……。\n\tヘンね　頭が　痛くなってきたわ。\n\t長老の話は　あんたに　まかせたから。\n@c0@"
158:
  de: "@aGriselda@bDeine Mutter war eine starke Frau. Sie hat weitergekämpft, obwohl sie wusste, dass sie in Gefahr war.\n@c0@"
  en: "@aDebora@bYour mother was a strong woman. She carried on fighting even though she knew she was in danger.\n@c0@"
  es: "@aStefania@bLa tua mamma era una mujer muy fuerte. Seguía luchando aunque sabía que estaba en pericolo.\n@c0@"
  fr: "@aPandora@bTa mère était une femme courageuse.\r\nElle a continué à se battre alors qu'elle\r\nsavait qu'elle était en danger.\n@c0@"
  it: "@aViola@bTua madre dev'essere una donna forte e determinata. Non capisco come abbia potuto mettere al mondo un pappamolle come te.\n㈡\nMa non temere, caro: accanto a me diventerai un vero duro!\nDovrai impegnarti molto, ma vedrai che ci riuscirai!\n@c0@"
  ja: "@a@bデボラ「あんたのママは　強い人ね。\n\t魔物に　さらわれるキケンを\n\t承知の上で　戦い続けたのよ。\n@c0@"
159:
  de: "@aGriselda@bHah... Hah... Warum siehst du überhaupt nicht erschöpft aus?! Ich befehle dir, wenigstens ein bisschen müde auszusehen!\n@c0@"
  en: "@aDebora@bHaah... Haah...\r\nWhy do you look so unruffled?\r\nI order you to at least look a little bit tired!\n@c0@"
  es: "@aStefania@bAaah... Aaah...\n¿Ma per qué pareces tan compuesto?\n¡Te ordeno que parezcas al menos un po' cansado!\n@c0@"
  fr: "@aPandora@bHaan... Haan...\nPourquoi tu as l'air si peu affectéⓡ Je t'ordonne d'avoir l'air au moins un peu fatiguéⓠ\n@c0@"
  it: "@aViola@bHaaah... Haaah...\nCome fai a essere così fresco e pimpante?!\nTi ordino di assumere un'aria stanca e sofferente!\n㈡\nNon vorrai mica farmi passare per una rammollita?!\nHaaah... Haaah...\n@c0@"
  ja: "@a@bデボラ「はぁ…　はぁ…\n\tなに…　あんたの　すずしい顔……。\n\t少しは　つかれた顔　しなさいよ！\n@c0@"
160:
  de: "@aGriselda@bHört sich so an, als hätten nicht mal mehr die Weisen die nötigen Fähigkeiten, um den Platz deiner Mutter einzunehmen.\n@c0@"
  en: "@aDebora@bSounds like even the elders didn't have the necessary powers to take your mother's place.\n@c0@"
  es: "@aStefania@bSembra que ni siquiera los ancianos tenían el poder necesario para ocupar el lugar de la tua mamma.\n@c0@"
  fr: "@aPandora@bOn dirait que même les Anciens n'avaient pas les pouvoirs nécessaires pour prendre la place de ta mère.\n@c0@"
  it: "@aViola@bNemmeno i Quattro Anziani hanno i poteri necessari per sostituire quelli persi con la partenza di tua madre...\n@c0@"
  ja: "@a@bデボラ「徳をつんだ　長老たちも\n\tあんたの　ママに　代わるほどの\n\t能力は　持てなかったのね。\n@c0@"
161:
  de: "@aGriselda@bUnd dieser Nimzo hat sie einfach so entführt! Aber wir werden's ihm schon zeigen, verlass dich drauf!\n@c0@"
  en: "@aDebora@bThe nerve of Nimzo, snatching her away like that! We'll make him pay, don't you worry.\n@c0@"
  es: "@aStefania@b¡Nimzo es un desalmado! ¡Mira que secuestrarla de questa forma! Pero se lo haremos pagar, sicuro.\n@c0@"
  fr: "@aPandora@bIl ne manque pas d'air, ce Nimzo, de l'avoir enlevée comme çaⓠ Mais ne t'inquiète pas, il va payer.\n@c0@"
  it: "@aViola@bAbbi fiducia, %a000090: troveremo Mada e la faremo pagare cara ai suoi rapitori!\n@c0@"
  ja: "@a@bデボラ「ママを　恐れて　連れ去るなんて……\n\tそんな　せこい魔王　さっさと\n\tやっつけちゃいましょ！\n@c0@"
162:
  de: "@aGriselda@bDiese Herberge ist nicht gerade sehr ansprechend. Damit meine ich das Haus, nicht den Preis.\n@c0@"
  en: "@aDebora@bThis inn's very appealing. By which I mean the place, not the price.\n@c0@"
  es: "@aStefania@bEsta posada parece atractiva. Y me refiero al lugar, no al prezzo.\n@c0@"
  fr: "@aPandora@bCette auberge est très attrayante.\r\nL'endroit, je veux dire, pas les prix.\n@c0@"
  it: "@aViola@bQuesta locanda non sa di niente.\n㈡\n%0%a000090, la prossima volta che capiteremo da queste parti, dovrai trovare una sistemazione di mio gradimento. Hai capito?\n@c0@"
  ja: "@a@bデボラ「良心的な　宿屋ね。\n\t……値段じゃなくて　場所が。\n@c0@"
163:
  de: "@aGriselda@bMir gefällt diese Herberge. Hier bleiben wir.\n@c0@"
  en: "@aDebora@bI like this inn. We're staying here tonight.\n@c0@"
  es: "@aStefania@bMi piace esta posada. Esta notte nos quedamos aquí.\n@c0@"
  fr: "@aPandora@bJ'aime bien cette auberge. On reste ici cette nuit.\n@c0@"
  it: "@aViola@bQuesta locanda non mi piace molto, ma mi adatterò a dormire qui, se non c'è un posto migliore dove andare. Sono una persona ragionevole, io.\n@c0@"
  ja: "@a@bデボラ「この宿屋　気に入ったわ。\n\t今日は　ここで　泊まるのよ。\n@c0@"
164:
  de: "@aGriselda@bIch liebe Einkaufen! Sieh dir nur diesen Laden an! Vielleicht haben sie ja auch ein paar Kleider im Angebot!\n@c0@"
  en: "@aDebora@bI adore shopping! Just look at this shop! They probably have some lovely dresses on sale.\n@c0@"
  es: "@aStefania@b¡Mi piace molto comprar! ¡Mira esta tienda! Seguro que tienen vestidos preciosos.\n@c0@"
  fr: "@aPandora@bJ'adore faire des emplettesⓠ Regarde un peu\ncette boutiqueⓠ Ils ont sans doute de jolies\nrobes à vendre.\n@c0@"
  it: "@aViola@bCaro, chiedi al gestore del negozio se hanno dei vestitini con motivi geometrici in rosso o in azzurro.\n@c0@"
  ja: "@a@bデボラ「買物って　楽しいわ～。\n\t見て見て　このお店　キレイなドレスや\n\tステキなローブも　売ってそうよ。\n@c0@"
165:
  de: "@aGriselda@bPapa hatte damit kein Problem. Er vertraut mir halt, weißt du.\n@c0@"
  en: "@aDebora@bPapa never had that problem.\nThat's because he trusts me.\n@c0@"
  es: "@aStefania@bIl mio papino nunca tuvo ese problema.\nPorque confiaba en me.\n@c0@"
  fr: "@aPandora@bPapa n'a jamais eu ce problème.\nC'est parce qu'il me fait confiance.\n@c0@"
  it: "@aViola@bLe speranze che ci sia qualche abitino alla moda in questo posto lontano mille miglia dalla civiltà sono pari a zero.\n㈡\nNel migliore dei casi potrò trovare due o tre accessori vintage con cui vivacizzare il mio guardaroba...\n@c0@"
  ja: "@a@bデボラ「その点パパは\n\t反対しなかったわよね。\n\t私　パパに　信頼されているからな～。\n@c0@"
166:
  de: "@aGriselda@bSo so, du scheinst das draufgängerische Wesen von deinen Eltern geerbt zu haben. Jetzt wird mir alles klar...\n@c0@"
  en: "@aDebora@bSo you inherited your recklessness from your parents. Now it all makes sense.\n@c0@"
  es: "@aStefania@bAsí que la tua temerità la has heredado de tus padres. Ahora lo comprendo tutto.\n@c0@"
  fr: "@aPandora@bAlors si tu as la bougeotte, c'est parce que tu tiens de tes parents. Tout s'explique.\n@c0@"
  it: "@aViola@bAnche tuo padre aveva il vizio di smarrire la strada?\nAdesso capisco da chi hai preso...\n@c0@"
  ja: "@a@bデボラ「あんたの　無茶っぷりは\n\tご両親ゆずりだったのね。\n\tなんか　なっとくしたわ。\n@c0@"
167:
  de: "@aGriselda@bEs ist doch nur versperrt, weil niemand es öffnen konnte. Lass dich davon nicht beeindrucken, %a000090. Wir gehen weiter.\n@c0@"
  en: "@aDebora@bIt's only stayed sealed shut because no one could open it. Don't let him put you off. Let's go!\n@c0@"
  es: "@aStefania@bHa permanecido cerrada porque nadie ha podido abrirla. No dejes que te retrase. ¡Andiamo!\n@c0@"
  fr: "@aPandora@bElles ne sont restées fermées que parce que personne ne pouvait les ouvrir. Ne le laisse\npas te décourager. Allons-yⓠ\n@c0@"
  it: "@aViola@bIl varco per Nadiria è chiuso da secoli? Questo non vuol dire che non sia possibile riaprirlo! Fatti coraggio, %a000090! Vedrai che ce la faremo!\n@c0@"
  ja: "@a@bデボラ「だれも　開けてないから\n\t閉じられたまま……　当たり前のことよ。\n\t動じる必要ないわ。　行きましょ。\n@c0@"
168:
  de: "@aGriselda@bLos, wir müssen uns beeilen und das Tor nach Nadiria erreichen.\n@c0@"
  en: "@aDebora@bLet's hurry up and get to the gateway to Nadiria.\n@c0@"
  es: "@aStefania@bDe prisa, andiamo al portal hacia Nadiria.\n@c0@"
  fr: "@aPandora@bDépêchons-nous de nous rendre aux portes\r\nde Nadiria.\n@c0@"
  it: "@aViola@bSbrighiamoci!\nHo una gran voglia di vedere com'è fatto il varco per Nadiria!\n@c0@"
  ja: "@a@bデボラ「じゃあ　さっそく\n\t魔界のトビラに　行きましょう。\n@c0@"
169:
  de: "@aGriselda@bWenn es schon seit Jahrhunderten verschlossen ist, ist es wahrscheinlich ganz rostig und braucht eine Spezialbehandlung.\n@c0@"
  en: "@aDebora@bIf it's been sealed shut for centuries, it's probably rusty and in need of some work by now.\n@c0@"
  es: "@aStefania@bSi ha estado cerrada durante siglos, estará veramente oxidada y necesitará un poco de trabajo.\n@c0@"
  fr: "@aPandora@bSi elles sont scellées depuis des siècles, elles sont sans doute très rouillées et doivent avoir besoin d'être réparées, depuis le temps.\n@c0@"
  it: "@aViola@bSe il varco è chiuso da tantissimi anni, probabilmente sarà tutto arrugginito. Preparati, %a000090: potresti essere costretto a sfondarlo a spallate...\n@c0@"
  ja: "@a@bデボラ「何百年も　閉まったままだと\n\tトビラが　さびついちゃうわ。\n\t手入れが必要そうね。\n@c0@"
170:
  de: "@aGriselda@bWenn Nimzo hier auftauchen und meinen Lieblingsladen zerstören würde, könnte mich nichts mehr aufhalten!\n@c0@"
  en: "@aDebora@bIf Nimzo came along and started to destroy my favourite shop, then I'd really lose my temper.\n@c0@"
  es: "@aStefania@bSi Nimzo viniera a destruire mi tienda favorita, me pondría hecha una furia.\n@c0@"
  fr: "@aPandora@bSi Nimzo débarquait et commençait à détruire ma boutique favorite, je crois que je me mettrais vraiment en colère.\n@c0@"
  it: "@aViola@bQuesto Nimzo comincia a starmi davvero sulle scatole, ma presto lo toglieremo di mezzo!\n㈡\nAscolta il mio piano, %a000090: tu lo affronterai in combattimento, mentre io ti suggerirò cosa fare, tenendomi a distanza di sicurezza. Geniale, vero?\n@c0@"
  ja: "@a@bデボラ「大魔王が　おいそれと　やって来て　\n\t私の好きな　お店を　こわしはじめたら\n\t思いっきり　けっとばしてやるわ。\n@c0@"
171:
  de: "@aGriselda@bⓞDrei große Ringeⓟ ... Glaubst du, er meint diese hier?\n@c0@"
  en: "@aDebora@bⓗThree great circlesⓘ...\nDo you think it's referring to these?\n@c0@"
  es: "@aStefania@bⓕTres grandes anillosⓖ...\n¿Crees que está parlando de estos?\n@c0@"
  fr: "@aPandora@bⓥTrois grands anneauxⓦ...\nTu crois que ça fait référence à ceux-làⓡ\n@c0@"
  it: "@aViola@bTre grandi anelli...\nQuali saranno questi anelli a cui si riferisce la leggenda?\n@c0@"
  ja: "@a@bデボラ「３つの　リング……。\n\t私たちが　持っている　これのことかしら？\n@c0@"
172:
  de: "@aGriselda@bDieses Psalmenbuch ist wirklich einfach zu lesen. Die Wörter ergeben irgendwie alle einen Sinn. Andere Bücher seiner Art nerven mich meistens bloß.\n@c0@"
  en: "@aDebora@bThis book of psalms is really easy to read.\r\nThe words just seem to sink in somehow.\r\nOther books like this usually just irritate me.\n@c0@"
  es: "@aStefania@bEste libro de salmos es molto facile de leer.\nParece como si las palabras entrasen solas.\nOtros libros parecidos me ponen nerviosa.\n@c0@"
  fr: "@aPandora@bCe livre de psaumes est vraiment facile à lire.\r\nLes mots semblent couler tout seuls. Pourtant, les ouvrages comme celui-là m'énervent, en général.\n@c0@"
  it: "@aViola@bChe bel libro!\nDi solito trovo noiosa qualsiasi pubblicazione che non parli di moda, ma questo testo è davvero gradevole.\n@c0@"
  ja: "@a@bデボラ「この詩篇集　読みやすいわ。\n\t頭の中に　言葉が　入ってくる……。\n\tなんでこの本　頭痛くならないのよ！？\n@c0@"
173:
  de: "@aGriselda@bAlso macht mir die Dunkelheit keine Angst, weil ich Licht im Herzen trage!\n@c0@"
  en: "@aDebora@bIn other words, the reason the darkness can't get the better of me is that I have light in my heart!\n@c0@"
  es: "@aStefania@b¡En otras palabras, la oscuridad no puede con me porque tengo luz en el mio cuore!\n@c0@"
  fr: "@aPandora@bEn d'autres termes, si les ténèbres ne m'engloutissent pas, c'est parce qu'une lumière brille dans mon cœurⓠ\n@c0@"
  it: "@aViola@bIn altre parole, l'oscurità non può sconfiggermi perché nel mio cuore c'è la luce...\n㈡\nE io che credevo che le tenebre mi facessero un baffo perché sono di una bellezza sfolgorante...\n@c0@"
  ja: "@a@bデボラ「つまり　闇に　のまれない私は\n\t心に　光がともっている　ということね。\n@c0@"
174:
  de: "@aGriselda@bIch kann heute keine Treppen mehr steigen. Lass uns die Erkundungstour morgen fortsetzen.\n@c0@"
  en: "@aDebora@bI don't have the energy for any more stairs today. Let's carry on exploring tomorrow.\n@c0@"
  es: "@aStefania@bHoy no tengo forza para más escaleras. Sigamos explorando domani.\n@c0@"
  fr: "@aPandora@bJe n'ai plus assez d'énergie pour continuer\r\nà grimper, aujourd'hui. Continuons notre\r\nexploration demain.\n@c0@"
  it: "@aViola@bBasta scale per oggi.\nNon ne posso più.\nCaro, rimandiamo l'esplorazione a domani, ti va?\n㈡\nSe non ti va, non importa, tanto sono io quella che comanda.\n@c0@"
  ja: "@a@bデボラ「今日は　もう\n\t階段のぼる　気力なんてないわ。\n\t明日にしなさい。\n@c0@"
175:
  de: "@aGriselda@bSie sollten sich nicht die Vergessenen nennen.\n@c0@"
  en: "@aDebora@bThey shouldn't call themselves the forgotten ones.\n@c0@"
  es: "@aStefania@bYo credo que no deberían llamarse los olvidados.\n@c0@"
  fr: "@aPandora@bIls ne devraient pas s'appeler eux-mêmes les oubliés.\n@c0@"
  it: "@aViola@bGli abitanti di Picco Maximo dicono di essere stati dimenticati dal mondo...\n@c0@"
  ja: "@a@bデボラ「自分から\n\t忘れられた民族なんて\n\t名乗るべきじゃないわ。\n@c0@"
176:
  de: "@aGriselda@bDas ist respektlos den Leuten gegenüber, die sich die Mühe gemacht haben, hierher zu kommen. Leuten wie mir.\n@c0@"
  en: "@aDebora@bIt's disrespectful to people like me who've come all this way to visit the place.\n@c0@"
  es: "@aStefania@bEs una falta di rispetto para personas come io, que han venido de lontano a visitarlos.\n@c0@"
  fr: "@aPandora@bC'est un manque de respect pour les gens comme moi qui se donnent la peine de venir jusqu'ici pour visiter cet endroit.\n@c0@"
  it: "@aViola@bSecondo me essi stessi hanno voluto farsi dimenticare, decidendo di costruire il villaggio in un luogo tanto remoto!\n㈡\nChi vuoi che si ricordi di loro, lontani come sono dalla civiltà?!\n@c0@"
  ja: "@a@bデボラ「忘れずに　ここに訪れる\n\tこの私のような人に　失礼だから。\n@c0@"
177:
  de: "@aGriselda@bBist du taub?! Ich sagte: ⓞLass uns die Erkundungstour morgen fortsetzenⓟ!\n@c0@"
  en: "@aDebora@bAre you deaf or something? I said we'd carry on exploring tomorrow!\n@c0@"
  es: "@aStefania@b¿Es que estás sordo? ¡Digo que ya seguiremos explorando domani, ¿capisci?!\n@c0@"
  fr: "@aPandora@bTu es sourd ou quoiⓡ J'ai dit qu'on continuerait notre exploration demainⓠ\n@c0@"
  it: "@aViola@bSei sordo o fai l'indiano?!\nTi ho detto che proseguiremo l'esplorazione domani!\n@c0@"
  ja: "@a@bデボラ「あんた　私の言うこと\n\t聞いてなかったでしょ！\n\t明日にしなさいって　言ったでしょ？\n@c0@"
178:
  de: "@aGriselda@bEine Nacht, die nie endet, würde unser Weltbild ganz schön auf den Kopf stellen.\n@c0@"
  en: "@aDebora@bPerpetual night would mean the end of the world as we know it.\n@c0@"
  es: "@aStefania@bLa notte perpetua sería el fine del mondo tal como lo conocemos.\n@c0@"
  fr: "@aPandora@bLa nuit perpétuelle, ça voudrait dire la fin du monde tel que nous le connaissons.\n@c0@"
  it: "@aViola@bL'arrivo dell'oscurità eterna significherebbe la fine del mondo...\n@c0@"
  ja: "@a@bデボラ「夜の国に　なってしまったら\n\t世界は　終わるわ。\n@c0@"
179:
  de: "@aGriselda@bAber warum sich Gedanken über etwas machen, das sowieso nicht eintreffen wird? Wir werden diesen Nimzo besiegen und damit basta!\n@c0@"
  en: "@aDebora@bThere's no need to fret over what'll never happen, though. We'll defeat Nimzo and put a stop to it.\n@c0@"
  es: "@aStefania@bMa no hay que ponerse nervioso, eso no sucederá. Derrotaremos a Nimzo y detendremos el proceso.\n@c0@"
  fr: "@aPandora@bMais ça ne sert à rien de se ronger les sangs pour quelque chose qui ne se produira jamais. Nous arrêterons Nimzo et mettrons un terme à tout ça.\n@c0@"
  it: "@aViola@bDobbiamo sconfiggere Nimzo, %a000090.\nCosti quel che costi.\n@c0@"
  ja: "@a@bデボラ「けど　無用な　心配よね。\n\t私たちが　大魔王を　やっつけるんだから。\n@c0@"
