  ja: "@a@bサンチョ「とにかく　今は\n\t長老たちの言葉に　すがるより\n\tほかに　ありませんね。　%a000090王。\n@c0@"
54:
  de: "@aOtto@bNadiria... Allein der Name lässt mich schon erschaudern. Grässlich!\n@c0@"
  en: "@aTuppence@bNadiria... Hearing it again makes it all seems\r\nscarily real. I, er, I seem to be shaking.\n@c0@"
  es: "@aAlazar@bNadiria... Asusta con solo volverlo a oír. Yo, eh, parece que estoy temblando.\n@c0@"
  fr: "@aInnocent@bNadiria... Le fait d'entendre ce nom ici le rend plus réel et ça me fait peur. J-J'en tremble.\n@c0@"
  it: "@aSimon@bNadiria...\nAh, quel posto non sarà poi così brutto come si dice in giro, eh?!\n㈡\nNo!\nSarà molto, ma molto peggio!\n@c0@"
  ja: "@a@bピピン「魔界か……。\n\tあらためて聞くと　なんていうか……\n\tふ…ふるえが　きましたよ。\n@c0@"
55:
  de: "@aBianca@bIch wusste gar nicht, dass deine Mutter über solche Kräfte verfügt.\n@c0@"
  en: "@aBianca@bI had no idea your mum had powers like that.\n@c0@"
  es: "@aBianca@bNo sabía que tu madre tenía esos poderes.\n@c0@"
  fr: "@aBianca@bJ'ignorais que ta maman avait de tels pouvoirs.\n@c0@"
  it: "@aBianca@bNon avevo idea che tua madre fosse dotata di poteri tanto grandi...\n@c0@"
  ja: "@a@bビアンカ「お母さまに\n\tそんな能力が　あったなんて\n\tわたし　知らなかった。\n@c0@"
56:
  de: "@aBianca@bAber wahrscheinlich hat Nimzo sie deswegen entführen lassen. Er hatte Angst vor ihrer Macht.\n@c0@"
  en: "@aBianca@bThat must be why Grandmaster Nimzo took her away. He was afraid of what she could do.\n@c0@"
  es: "@aBianca@bPor eso se la habrá llevado el Gran Maestro Nimzo. Tendría miedo de lo que pudiera hacer, ¿sabes?\n@c0@"
  fr: "@aBianca@bÇa doit être pour ça que le Grand Maître Nimzo l'a kidnappée. Il avait peur de ce qu'elle aurait pu faire.\n@c0@"
  it: "@aBianca@bEcco perché il Gran Maestro Nimzo la rapì.\nNe aveva paura, e temeva che potesse ostacolare i suoi piani.\n@c0@"
  ja: "@a@bビアンカ「だから　大魔王は\n\tお母さまの存在に　恐れをなして\n\tお母さまを　連れ去ったのね。\n@c0@"
57:
  de: "@aNera@bEs scheint niemanden zu geben, der den Platz deiner Mutter einnehmen könnte. Welch eine schreckliche Last für sie.\n@c0@"
  en: "@aNera@bIt doesn't sound like there's anyone who could take your mother's place. What a terrible burden for her.\n@c0@"
  es: "@aNera@bSembra que no hay nadie que pueda ocupar el lugar de la tua mamma. ¡Qué terrible carga para ella!\n@c0@"
  fr: "@aNera@bOn dirait que personne ne peut prendre la place de ta mère. Quel terrible fardeau pour elle.\n@c0@"
  it: "@aNera@bPare proprio che nessuno degli abitanti di Picco Maximo sia dotato delle capacità necessarie per sostituire tua madre...\n㈡\nSulle spalle di Mada gravava una responsabilità enorme...\n@c0@"
  ja: "@a@bフローラ「お母さまに　代われる人が\n\tいないのね……。\n\tどんなに　重い責任だったでしょう。\n@c0@"
58:
  de: "@a%0%a001250@bWenn wir hier übernachten, träumen wir vielleicht von Großmutter. Das wäre schön...\n@c0@"
  en: "@a%0%a001250@bIf we stay here, maybe we'll dream about Grandma. That'd be nice.\n@c0@"
  es: "@a%0%a001250@bSi nos quedamos aquí, puede que soñemos con la abuela. Sería bonito.\n@c0@"
  fr: "@a%0%a001250@bSi on reste ici, peut-être qu'on rêvera de\ngrand-mère. Ce serait bien.\n@c0@"
  it: "@a%0%a001250@bSe dormiremo qui, forse sognerò la nonna!\nSarebbe bello se succedesse...\n@c0@"
  ja: "@a@b%a001250「ここに　泊まったら\n\tおばあちゃんの夢が\n\t見られるといいのに……。\n@c0@"
59:
  de: "@aNera@bDie Herberge liegt also mitten im Dorf. Ist ja praktisch, dass sie so leicht zu finden ist.\n@c0@"
  en: "@aNera@bSo the inn's right in the middle of the village.\r\nIt's helpful of them to have it in such an easy\r\nplace to reach.\n@c0@"
  es: "@aNera@bO sea, la posada está justo en el centro de la aldea.\nEs molto gentile per la sua parte haberla puesto en un sitio tan a mano.\n@c0@"
  fr: "@aNera@bAlors l'auberge se trouve au centre du village.\r\nC'est gentil de leur part de l'avoir installée dans\r\nun endroit facile d'accès.\n@c0@"
  it: "@aNera@bPer fortuna la locanda è proprio al centro del villaggio... Ma cosa se ne faranno di una locanda qui, visto che non arrivano turisti nemmeno a pagarli?!\n@c0@"
  ja: "@a@bフローラ「村の　真ん中に\n\t宿屋さんがあるのね。\n\t来やすい場所で　助かるわ。\n@c0@"
60:
  de: "@a%0%a001240@bIch frage mich, ob Großmutter hier mal übernachtet hat.\n@c0@"
  en: "@a%0%a001240@bI wonder if Grandma ever stayed here.\n@c0@"
  es: "@a%0%a001240@bMe pregunto si la abuela estuvo aquí alguna vez.\n@c0@"
  fr: "@a%0%a001240@bJe me demande si grand-mère a déjà dormi ici.\n@c0@"
  it: "@a%0%a001240@bChissà se la nonna ha mai trascorso la notte qui...\n@c0@"
  ja: "@a@b%a001240「おばあちゃんも　ここに\n\t泊まったこと　あるかなあ？\n@c0@"
61:
  de: "@a%0%a001240@bAber wahrscheinlich nicht. Wenn sie im Dorf gelebt hat, brauchte sie ja keine Herberge...\nWas bin ich doof!\n@c0@"
  en: "@a%0%a001240@bOh, I suppose not. If she lived in the village, then she wouldn't need a room at the inn. Silly me!\n@c0@"
  es: "@a%0%a001240@bBueno, supongo que no. Si vivía en el pueblo, no necesitaría una habitación en la posada.\n¡Qué tonto soy!\n@c0@"
  fr: "@a%0%a001240@bOh, mais non, bien sûr. Si elle vivait dans le village, elle n'avait pas besoin d'une chambre à l'auberge,\nje suis bêteⓠ\n@c0@"
  it: "@a%0%a001240@bAh, che cosa stupida ho detto! Se viveva a Picco Maximo, avrà avuto una casa nel villaggio, no?\nNon aveva certo bisogno di dormire alla locanda...\n@c0@"
  ja: "@a@b%a001240「あっ　でも\n\tこの村の人だったら\n\t宿には　泊まらないか。　えへへ……。\n@c0@"
62:
  de: "@aBianca@bDas Zimmer ist wirklich sehr gemütlich. Wahrscheinlich hat man hier immer schöne Träume...\n@c0@"
  en: "@aBianca@bIt's very snug, but it's a lovely room. You probably have brilliant dreams when you stay here.\n@c0@"
  es: "@aBianca@bLa habitación es un poco estrechuja, pero tiene encanto. Seguro que aquí se sueñan cosas estupendas, ¿sabes?\n@c0@"
  fr: "@aBianca@bC'est une chambre douillette et jolie. On doit faire des rêves sensationnels, ici.\n@c0@"
  it: "@aBianca@bLa stanza è molto calda e accogliente.\nSperiamo di riposare bene e di fare sogni d'oro...\n@c0@"
  ja: "@a@bビアンカ「こぢんまりしてるけど\n\tステキなお部屋ね。\n\tいい夢が　見られそうだわ。\n@c0@"
63:
  de: "@aSancho@bSelbst hier es gibt Waffen und Rüstungen. Aber die Geschäfte scheinen nisst gut zu laufen, no?\n@c0@"
  en: "@aSancho@bEven here, there are weapon and armour eshops. But they no eseem to go well here, you no theenk?\n@c0@"
  es: "@aSancho@bIncluso aquí hay tiendas de armas y armaduras.\nNomás que parece que no les va muy bien, ¿sí?\n@c0@"
  fr: "@aSancho@bMême ici, il y a des m-m-magasins d'armes et d'armures. Mais ils n'ont pas l'air très p-prospères, tu ne trouves pasⓡ\n@c0@"
  it: "@aSancho@bAquí ce sono negozios de armas y de armaturas, ma no pienso que facciano muchos affares...\n@c0@"
  ja: "@a@bサンチョ「このような場所にも\n\t武器屋や防具屋が　あるんですね。\n\tなんとも　不似合いな感じがしますが。\n@c0@"
64:
  de: "@a%0%a001240@bEs gibt einen Laden und alles, aber wo sind die Kunden?\n@c0@"
  en: "@a%0%a001240@bThere's a proper shopkeeper and everything, but I wonder if there are ever any customers.\n@c0@"
  es: "@a%0%a001240@bTienen su dependiente y todo, pero me pregunto si tendrán algún cliente.\n@c0@"
  fr: "@a%0%a001240@bIl y a bien quelqu'un pour tenir le magasin, mais je\nme demande s'ils ont des clients.\n@c0@"
  it: "@a%0%a001240@bCarino, questo negozio...\nCredi che abbia molti clienti?\n@c0@"
  ja: "@a@b%a001240「お店屋さんがあるけど\n\tお客さんって　来るのかなあ？\n@c0@"
65:
  de: "@aBianca@bDas ist aber ein ziemlich großer Laden. Glaubst du, hier macht man gute Geschäfte?\n@c0@"
  en: "@aBianca@bThis is a pretty big shop.\r\nD'you reckon they do alright here?\n@c0@"
  es: "@aBianca@bEs una tienda muy grande.\n¿Crees que les irá bien aquí?\n@c0@"
  fr: "@aBianca@bCe magasin est assez grand.\nTu crois que les affaires marchent, iciⓡ\n@c0@"
  it: "@aBianca@bAh, però!\nNon mi sarei mai aspettata che in un luogo tanto remoto ci fosse un negozio così grande...\n@c0@"
  ja: "@a@bビアンカ「わりと　大きなお店ね。\n\tはんじょう　してるのかしら？\n@c0@"
66:
  de: "@aNera@bEin Laden in solch einem Ort verkauft bestimmt viele seltsame und interessante Dinge...\n@c0@"
  en: "@aNera@bA shop in a place like this is always bound to have lots of weird and wonderful things on sale.\n@c0@"
  es: "@aNera@bEn un lugar così, es normal que una tienda tenga montones de cosas curiosas e increíbles.\n@c0@"
  fr: "@aNera@bUn magasin situé dans un endroit pareil doit sûrement proposer tout un tas d'objets aussi étranges que merveilleux.\n@c0@"
  it: "@aNera@bVisto che la gente di Picco Maximo ha pochissimi contatti con l'esterno, mi aspetto che in questo negozio vendano oggetti introvabili altrove!\n@c0@"
  ja: "@a@bフローラ「さすがに　こういう場所の\n\tお店屋さんだけあって\n\tふしぎな商品が　多そうですわね。\n@c0@"
67:
  de: "@a%0%a001240@bHört sich so an, als würden die Leute hier ihr Dorf nicht besonders oft verlassen. Das muss ganz schön einsam sein.\n@c0@"
  en: "@a%0%a001240@bIt sounds like the people here don't often visit the outside world. That must be a bit lonely.\n@c0@"
  es: "@a%0%a001240@bNo parece que la gente de aquí salga mucho al mundo exterior. Debe resultar un poco solitario.\n@c0@"
  fr: "@a%0%a001240@bOn dirait que les gens d'ici ne sortent pas souvent de leur village. Ils doivent se sentir un peu seuls.\n@c0@"
  it: "@a%0%a001240@bSi direbbe che gli abitanti del posto non abbiano molta simpatia per gli stranieri...\n@c0@"
  ja: "@a@b%a001240「ここの人たちって\n\tあんまり　外に出ないのかなあ？\n\tなんだか　さみしいね……。\n@c0@"
68:
  de: "@a%0%a001250@bDiese alte Frau sieht sehr traurig aus. Was sie wohl auf dem Herzen hat...\n@c0@"
  en: "@a%0%a001250@bThat old woman always looks really sad.\nI wonder what's wrong with her.\n@c0@"
  es: "@a%0%a001250@bEsa anciana parece siempre muy triste.\nMe pregunto qué le pasa.\n@c0@"
  fr: "@a%0%a001250@bCette vieille femme a toujours l'air si triste.\nJe me demande ce qui ne va pas.\n@c0@"
  it: "@a%0%a001250@bPerché quella vecchia signora è sempre tanto arrabbiata?\nCon chi ce l'ha?\n@c0@"
  ja: "@a@b%a001250「あのおばあさん\n\tいつ見ても　悲しそうよね。\n\tどうしてかなあ……。\n@c0@"
69:
  de: "@aSancho@bAber Señora Magda war sehr glückliss mit Señor Ludwig!\n@c0@"
  en: "@aSancho@bBut señora Mada, eshe was eso happy weeth señor Pankraz!\n@c0@"
  es: "@aSancho@b¡Pero la señora Perséfone era muy feliz con el señor Teudis!\n@c0@"
  fr: "@aSancho@bM-Mais la señora Magdalena, elle était si heureuse avec le señor P-Petrosⓠ\n@c0@"
  it: "@aSancho@b¿Por qué los abitantes de Picco Maximo no vogliono capirlo?\nLa señora Mada era muy feliz con el señor Russel...\n@c0@"
  ja: "@a@bサンチョ「マーサさまは\n\tパパスさまと　ご結婚なされて\n\t本当に　お幸せそうでしたのに！\n@c0@"
70:
  de: "@aSancho@bIss glaube, es wird noch sehr, sehr lange dauern, bis die Leute das verstehen...\n@c0@"
  en: "@aSancho@bAnda! I theenk ees gonna take a long, long time before the people here, they understand thees.\n@c0@"
  es: "@aSancho@b¡Ándale! Creo que va a tomar su tiempo que la gente de aquí entienda eso.\n@c0@"
  fr: "@aSancho@bAndaⓠ Je c-crois qu'il va falloir très longtemps avant que les g-gens, ils comprennent ça.\n@c0@"
  it: "@aSancho@bSi ce pienso, yo...\nSì, chico: Yo me commuovos...\n¡Sob! ¡Sob! ¡Sob!\n@c0@"
  ja: "@a@bサンチョ「……やれやれ。\n\tそれを　理解してもらうには\n\t長い時間が　必要になりそうですね。\n@c0@"
71:
  de: "@a%0%a001240@bDas war Großvater Ludwig, ganz sicher!\n@c0@"
  en: "@a%0%a001240@bThat's Grandpa Pankraz!\nGood for him!\n@c0@"
  es: "@a%0%a001240@b¡Ese sería el abuelo Teudis!\n¡Me alegro por él!\n@c0@"
  fr: "@a%0%a001240@bC'est grand-père Petrosⓠ Tant mieux pour luiⓠ\n@c0@"
  it: "@a%0%a001240@bSì!\nEra proprio mio nonno Russel!\n@c0@"
  ja: "@a@b%a001240「パパスおじいちゃん　やるね！\n\tかっこいいなー！\n@c0@"
72:
  de: "@aOtto@bAch, wär ich das nur gewesen...\nÄhm, nichts. Ich hab gar nichts gesagt.\n@c0@"
  en: "@aTuppence@bHopefully it won't be too long for me now...\nEr, nothing. Never mind.\n@c0@"
  es: "@aAlazar@bEspero que a mí no me lleve tanto tiempo...\nMmm, da igual. No importa.\n@c0@"
  fr: "@aInnocent@bEspérons que ça m'arrivera bientôt, à moi aussi...\r\nEuh, non... rien.\n@c0@"
  it: "@aSimon@bChissà che anch'io non m'innamori di una bella fanciulla di Picco Maximo e... Uhm, meglio di no.\r\nLa faccenda sarebbe troppo complicata...\n@c0@"
  ja: "@a@bピピン「ボクも　そろそろ……\n\tいやっ　その\n\tなんでもないですよ！\n@c0@"
73:
  de: "@a%0%a001250@bÄhm, wenn ich jetzt plötzlich heiraten würde, wärst du dann sehr traurig?\n@c0@"
  en: "@a%0%a001250@bUm, if I suddenly decided to get married, would you be lonely?\n@c0@"
  es: "@a%0%a001250@bMmm, si de repente decidiera casarme, ¿te sentirías solo?\n@c0@"
  fr: "@a%0%a001250@bMmm. Si je décidais de me marier, est-ce que tu te sentirais seulⓡ\n@c0@"
  it: "@a%0%a001250@bPapà, ti sentirai solo quando mi sposerò e andrò a vivere per conto mio?\n@c0@"
  ja: "@a@b%a001250「あの……ね？\n\tもし　わたしが　とつぜん\n\t男の人と結婚したら　さみしい？\n@c0@"
74:
  de: "@a%0%a001250@bGut, dann lass ich's bleiben.\n@c0@"
  en: "@a%0%a001250@bOkay then, I won't do that.\n@c0@"
  es: "@a%0%a001250@bVale, entonces no lo haré.\n@c0@"
  fr: "@a%0%a001250@bD'accord. Dans ce cas, je ne le ferai pas.\n@c0@"
  it: "@a%0%a001250@bDavvero?\nAllora non mi sposerò mai!\n@c0@"
  ja: "@a@b%a001250「そうなの……？\n\tじゃあ　わたしは　とつぜん\n\t結婚するのは　やめるね。\n@c0@"
75:
  de: "@a%0%a001250@bDu wärst glücklich? Dann sollte ich vielleicht auch eine Romanze anfangen und heiraten, genau wie Großmutter Magda!\n@c0@"
  en: "@a%0%a001250@bYou'd be happy? Then maybe I should have a whirlwind romance and get married just like Grandma Mada did!\n@c0@"
  es: "@a%0%a001250@b¿Te alegrarías? ¡Entonces debería tener un idilio loco y casarme, igual que la abuela Perséfone!\n@c0@"
  fr: "@a%0%a001250@bTu serais heureuxⓡ Alors peut-être que je tomberai très amoureuse de quelqu'un et que je me marierai, comme grand-mère l'a faitⓠ\n@c0@"
  it: "@a%0%a001250@bCerto che no!\nTanto avrai sempre accanto a te la mamma e %a001240!\n㈡\nMio fratello è un tale rompiscatole che non troverà mai nessuna tanto disperata da sposarlo!\nEh eh eh!\n@c0@"
  ja: "@a@b%a001250「よろこんでくれる？　じゃあ\n\tわたし　マーサおばあちゃんみたいに\n\t情熱的な　結婚するからね！\n@c0@"
76:
  de: "@aBianca@bSo ist das also alles passiert. Hört sich ziemlich romantisch an, wie sich deine Eltern kennengelernt haben, %a000090.\n@c0@"
  en: "@aBianca@bSo that's how it all happened. It sounds like it was really romantic between your folks, %a000090.\n@c0@"
  es: "@aBianca@bDe modo que eso fue lo que sucedió. Parece muy romántico lo de tus padres, %a000090.\n@c0@"
  fr: "@aBianca@bAlors c'est comme ça que ça s'est passé. C'est une histoire tellement romantique, %a000090.\n@c0@"
  it: "@aBianca@bAllora fu così che i tuoi genitori si conobbero e si innamorarono...\nIl loro incontro fu voluto dal destino, %a000090.\n@c0@"
  ja: "@a@bビアンカ「そんな事情が　あったなんて…\n\t%a000090のご両親って　ステキね。\n@c0@"
77:
  de: "@aNera@bIch war immer überzeugt, dass es das Schicksal war, das uns zusammengeführt hat. Und bei deinen Eltern scheint es nicht anders gewesen zu sein.\n@c0@"
  en: "@aNera@bI've always thought it was fate, the way we met\r\nlike we did. It sounds like it was fate for your parents too.\n@c0@"
  es: "@aNera@bSempre pensé que el destino nos hizo encontrarnos de esa manera. Sembra que con tus padres también fue el destino, %a000090.\n@c0@"
  fr: "@aNera@bJ'ai toujours pensé que c'était le destin qui nous avait réunis. On dirait que c'est aussi ce qui s'est passé pour tes parents.\n@c0@"
  it: "@aNera@bHo sempre pensato che sia stato il destino a volere che le nostre vite si intrecciassero, %a000090...\n㈡\nOra mi rendo conto che anche per i tuoi genitori è stato così.\n@c0@"
  ja: "@a@bフローラ「私と　あなたの出会いも\n\t運命的でしたけれど…　お父さまと\n\tお母さまも　そうでしたのね……。\n@c0@"
78:
  de: "@aBianca@bEs wird wohl kein Zuckerschlecken, das Tor nach Nadiria zu öffnen. Aber wir werden es schaffen!\n@c0@"
  en: "@aBianca@bOpenin' the gateway to Nadiria will be no mean feat, eh? But I'm sure we'll manage.\n@c0@"
  es: "@aBianca@bAbrir la puerta de Nadiria no va a ser cosa fácil, ¿eh? Pero seguro que lo conseguimos...\n@c0@"
  fr: "@aBianca@bOn dirait que ça ne va pas être facile d'ouvrir les portes de Nadiria, heinⓡ Mais je suis persuadée qu'on y arrivera.\n@c0@"
  it: "@aBianca@bPare proprio che non sarà facile raggiungere Nadiria, eh?\n㈡\n\nAh, non temere! Siamo sufficientemente determinati e caparbi da arrivare ovunque, persino nel Regno degli Inferi! Ce la faremo!\n@c0@"
  ja: "@a@bビアンカ「魔界への　トビラを開くのは\n\t簡単なことじゃないのね。\n\tでも　私たちなら　きっとできるわよ！\n@c0@"
79:
  de: "@aNera@bSeit Jahrhunderten versperrt? Dann wird es wohl nicht einfach zu öffnen sein. Aber wir müssen es versuchen.\n@c0@"
  en: "@aNera@bSealed shut for centuries? That sounds like it could be tricky to open. But we have to give it a try.\n@c0@"
  es: "@aNera@b¿Muchos siglos cerrada? Eso suena a que costará abrirla. Ma tenemos que intentarlo.\n@c0@"
  fr: "@aNera@bScellées depuis des sièclesⓡ On dirait qu'on va avoir du mal à les ouvrir. Nous devons quand même essayer.\n@c0@"
  it: "@aNera@bIl varco per Nadiria è stato chiuso secoli fa?!\nOh, santa dea! Sembra proprio che non sarà facile raggiungere il Regno degli Inferi...\n㈡\nBeh, dobbiamo comunque provarci, no?\n@c0@"
  ja: "@a@bフローラ「えっ　何百年もですか……。\n\tでも　行かないわけには　いきませんわ\n\tねっ　あなた。\n@c0@"
80:
  de: "@a%0%a001240@bIch werde nicht aufgeben. Unsere Reise war nie besonders leicht, aber wir haben uns durchgebissen. Und wir werden es auch diesmal schaffen!\n@c0@"
  en: "@a%0%a001240@bI'm not going to give up. We've had our hard times up to now that we've won through, and we will again this time!\n@c0@"
  es: "@a%0%a001240@bNo voy a rendirme. Hemos superado antes malos momentos, ¡y lo volveremos a hacer esta vez!\n@c0@"
  fr: "@a%0%a001240@bJe ne vais pas abandonner. Jusque-là, on a toujours réussi à surmonter les obstacles et\nce n'est pas maintenant que ça va changerⓠ\n@c0@"
