  it: "@a%0%a001240@bMa come fanno i Quattro Anziani a sapere già tutto prima ancora che noi aprissimo bocca?!\n@c0@"
  ja: "@a@b%a001240「さすが　エルヘブンの\n\t長老さんだね。　ボクたちのこと\n\tみんな　お見通しだったね。\n@c0@"
102:
  de: "@a%0%a001250@bDas war bestimmt dieser Tümpeltempel, an dem wir in der Höhle auf dem Weg hierhin vorbeigekommen sind, oder?\n@c0@"
