0:
  de: "@aBianca@bToll, wie sie die Herberge um den schönen Baum herumgebaut haben, nicht?\n@c0@"
  en: "@aBianca@bWow! What a wonderful inn this is, built around such a lovely big tree!\n@c0@"
  es: "@aBianca@b¡Guau! ¡Qué posada más bonita! ¡Si la han construido alrededor de este arbolazo!\n@c0@"
  fr: "@aBianca@bWaouhⓠ Quelle magnifique auberge, construite autour d'un si bel arbreⓠ\n@c0@"
  it: "@aBianca@bChe bella questa locanda!\nSembra essere una cosa sola con l'albero intorno al quale è costruita...\n@c0@"
  ja: "@a@bビアンカ「わ～！\n\t大きな木を　いかして　建てられた\n\tすてきな宿屋ね。\n@c0@"
1:
  de: "@aNera@bWas für eine wunderbare Idee, eine Herberge um einen so hübschen alten Baum herumzubauen! Hier würde ich heute gern übernachten!\n@c0@"
  en: "@aNera@bWhat a lovely idea, building an inn around a nice old tree like this. It would be wonderful if we could stay here tonight.\n@c0@"
  es: "@aNera@bQué idea tan buena, construir una posada alrededor de un vecchio árbol como este. Sería espléndido si pudiésemos pasar la noche aquí.\n@c0@"
  fr: "@aNera@bQuelle belle idée de construire une auberge autour d'un vieil arbre majestueux comme celui-ci. Ce serait fantastique de passer la nuit ici.\n@c0@"
  it: "@aNera@bMi piacerebbe trascorrere la notte in una locanda dall'aspetto così... naturale!\n@c0@"
  ja: "@a@bフローラ「大きな木と　一体になった\n\tすてきな宿屋ですわね。\n\t今夜は　ここに　泊まりたいですわ。\n@c0@"
2:
  de: "@aBianca@bDer Laden fällt wirklich aus dem Rahmen! Ich glaube, ich bin in einer Herberge noch nie von einem Häschenmädel in Empfang genommen worden!\n@c0@"
  en: "@aBianca@bIt's a bit of an odd place. I don't think I've bin to an inn where a bunny girl greets you before!\n@c0@"
  es: "@aBianca@bEs un sitio un poco raro, ¿sabes? ¡Nunca había estado en una posada donde te recibiera una conejita!\n@c0@"
  fr: "@aBianca@bC'est bizarre, comme endroit. Je ne me rappelle pas être jamais allée dans une auberge où l'accueil est confiée à une serveuse en costume de lapinⓠ\n@c0@"
  it: "@aBianca@bA ogni uomo piacerebbe ricevere il benvenuto da una ragazza così carina... Però dovrebbe anche esserci un bel fusto ad accogliere le viaggiatrici, no?\n@c0@"
  ja: "@a@bビアンカ「バニーガールが\n\t呼びこみを　してるなんて\n\tなかなか　変わってるわね。\n@c0@"
3:
  de: "@aNera@bWas genau wird einem hier eigentlich geboten? Wie aufregend!\n@c0@"
  en: "@aNera@bI wonder what kind of offer it is they're running. How exciting!\n@c0@"
  es: "@aNera@bMe pregunto qué clase de servicios ofrecen. ¡Qué emocionante!\n@c0@"
  fr: "@aNera@bJe me demande quel est le genre d'offre spéciale qu'ils proposent. Comme c'est excitantⓠ\n@c0@"
  it: "@aNera@bUna promozione?\nSono proprio curiosa di scoprire di cosa si tratta...\n@c0@"
  ja: "@a@bフローラ「キャンペーンって\n\tどんなのかしら？\n\tわくわく　しますわね。\n@c0@"
4:
  de: "@aBianca@bIch bin gern mit dir auf Reisen, %a000090. Es macht wirklich Spaß, gemeinsam durch die Welt zu ziehen!\n@c0@"
  en: "@aBianca@bI'm really enjoyin' this journey of ours, %a000090. It's great fun travellin' about with you.\n@c0@"
  es: "@aBianca@bMe lo estoy pasando genial contigo, %a000090. Es fantástico esto de viajar los dos juntos.\n@c0@"
  fr: "@aBianca@bJ'apprécie vraiment notre voyage, %a000090.\nC'est très amusant de se promener partout avec toi.\n@c0@"
  it: "@aBianca@bFinora il nostro viaggio è stato decisamente interessante, %a000090.\nMi sto divertendo moltissimo a girare il mondo con te!\n@c0@"
  ja: "@a@bビアンカ「私はもう　じゅうぶん\n\tいい旅を　してると思うの。\n\tだって　%a000090と　いっしょだもの。\n@c0@"
5:
  de: "@aNera@bMan lebt nur einmal. Darum will ich mit dir überall hingehen und alles an deiner Seite erleben.\n@c0@"
  en: "@aNera@bI know we only get to live life once. That's why I want to go with you wherever you go and experience everything with you.\n@c0@"
  es: "@aNera@bSolo se vive una vez, ¿vero? Por eso quiero ir contigo a donde tú vayas y vivirlo todo en tu compañía.\n@c0@"
  fr: "@aNera@bJe sais que l'on ne vit qu'une fois. C'est pour ça que je tiens à t'accompagner où que tu ailles et à partager toutes tes expériences.\n@c0@"
  it: "@aNera@bLa signora ha ragione: la vita è una sola, per cui dovremmo cercare di assaporarla il più possibile.\nE io ho deciso di farlo insieme a te, amore mio...\n@c0@"
  ja: "@a@bフローラ「私も　１度きりの\n\t人生だからこそ　大切な人と\n\tいっしょにゆきたいと思ったのですわ。\n@c0@"
6:
  de: "@aBianca@bEine gute Idee, den Zweig so vom Boden hoch wachsen zu lassen. Hier würde es meinem Vater gefallen!\n@c0@"
  en: "@aBianca@bIt's a nice touch, havin' the branch comin' up\r\nfrom the floor like that. Dad would love to see this place!\n@c0@"
  es: "@aBianca@bQué toque más estético esa rama saliendo del suelo. ¡A mi padre le encantaría este sitio!\n@c0@"
  fr: "@aBianca@bC'est très joli, cette branche qui sort du sol\ncomme ça. Papa adorerait cet endroitⓠ\n@c0@"
  it: "@aBianca@bIl ramo che spunta dal pavimento è una trovata veramente geniale!\nA mio padre questo posto piacerebbe tantissimo.\n@c0@"
  ja: "@a@bビアンカ「床から　のびている木の枝が\n\tいい味だしてるわね。\n\t父さんが見たら　よろこんだかも……。\n@c0@"
7:
  de: "@aNera@bEs ist so schön, innen wie außen Zweige des Baums zu sehen. Ich finde das wunderbar entspannend.\n@c0@"
  en: "@aNera@bIt's so nice seeing branches from the tree indoors as well as outdoors. It's somehow very relaxing.\n@c0@"
  es: "@aNera@bCómo me piace que haya ramas del árbol por dentro y por fuera de la posada. Es muy relajante.\n@c0@"
  fr: "@aNera@bC'est si beau de voir les branches de l'arbre aussi bien à l'intérieur qu'à l'extérieur. C'est très apaisant.\n@c0@"
  it: "@aNera@bI rami dell'albero arrivano fin dentro l'edificio!\nQuesta locanda è veramente unica nel suo genere...\n@c0@"
  ja: "@a@bフローラ「部屋の中でも　なまの\n\t木が見られるって　いいですわね。\n\t気持ちが　安らぎますわ。\n@c0@"
8:
  de: "@aBianca@bEine Vierergruppe... Komm, das machen wir, %a000090 Holen wir alle zusammen!\n@c0@"
  en: "@aBianca@bA group of four... Let's get everyone together and do it right away, %a000090!\n@c0@"
  es: "@aBianca@bUn grupo de cuatro... ¡Vamos a reunir a todos enseguida, %a000090!\n@c0@"
  fr: "@aBianca@bUne équipe de quatre... Rassemblons tout le monde et profitons-en tout de suite, %a000090ⓠ\n@c0@"
  it: "@aBianca@bUn gruppo di quattro persone?\nDai, %a000090! Chiama un po' di gente!\nVoglio sfruttare la promozione!\n@c0@"
  ja: "@a@bビアンカ「４人で泊まると…　か。\n\tねえ　%a000090　さっそく\n\tみんなで　泊まりましょうよ。\n@c0@"
9:
  de: "@aNera@bWas das wohl für ein besonderes Geschenk ist? Ich hoffe, es ist etwas Schönes.\n@c0@"
  en: "@aNera@bI wonder what this special gift is. I hope it's something nice.\n@c0@"
  es: "@aNera@b¿Qué regalo molón será ese? Espero que sea algo veramente bonito.\n@c0@"
  fr: "@aNera@bJe me demande quel est ce cadeau spécial.\r\nJ'espère que c'est joli.\n@c0@"
  it: "@aNera@bChissà qual è il grazioso oggetto che regalano alle comitive che pernottano qui...\n@c0@"
  ja: "@a@bフローラ「オリジナル商品って　何かしら？\n\tもらってうれしいものだと\n\tいいんですけど……。\n@c0@"
10:
  de: "@aBianca@bNa, also... das soll das fantastische besondere Geschenk sein?!\n@c0@"
  en: "@aBianca@bSo...this is the amazin' special gift!?\n@c0@"
  es: "@aBianca@b¡¿Y esto es ese regalo tan molón?!\n@c0@"
  fr: "@aBianca@bAlors... c'est ça, le cadeau si spécialⓡⓐ\n@c0@"
  it: "@aBianca@bEh?!\nSarebbe questo il regalo?!\n@c0@"
  ja: "@a@bビアンカ「こ…　これが　ステキな\n\tオリジナル商品なのね……。\n@c0@"
11:
  de: "@aNera@bEin Wimpel...?! Er reißt einen nicht gerade vom Hocker, aber es kann wohl nicht schaden, ihn mitzunehmen.\n@c0@"
  en: "@aNera@bA flag...!? It's not exactly the prettiest thing I've ever seen, but I suppose it won't hurt to take it with us.\n@c0@"
  es: "@aNera@b¡¿Un banderín?! Veramente, no es lo más bonito que haya visto, pero supongo que no hay nada de malo en llevárnoslo.\n@c0@"
  fr: "@aNera@bUn fanion...ⓡⓐ J'ai déjà vu des cadeaux plus jolis,\nmais ça ne coûte rien de le prendre.\n@c0@"
  it: "@aNera@bUn gagliardetto?! Uhm, è carino, ma mi sarei aspettata qualcosa di diverso. Bah, prendiamolo... Chissà che non ci torni utile, prima o poi...\n@c0@"
  ja: "@a@bフローラ「ペナントですわね……。\n\tあまり　キレイとは　いえませんが\n\tいちおう　持っていましょうか。\n@c0@"
12:
  de: "@aBianca@bDer Renner? Na ja, so hätt' ich's nicht grade ausgedrückt! Aber wenigstens ist die Aktion jetzt vorbei.\n@c0@"
  en: "@aBianca@bA blast? I wouldn't go that far! At least it's all over with now, anyway.\n@c0@"
  es: "@aBianca@b¿Una pasada? ¡Bueno, tampoco es para tanto! Es igual, como ya se ha acabado.\n@c0@"
  fr: "@aBianca@bUn tabacⓡ Je n'irais pas jusque-làⓠ Enfin, maintenant, il n'y en a plus de toute façon.\n@c0@"
  it: "@aBianca@bNon credevo che la promozione avesse avuto tanto successo.\nBeh, buon per loro.\n@c0@"
  ja: "@a@bビアンカ「ふ～ん…　大好評ね……。\n\tとりあえず　キャンペーンが\n\tぶじに　終わってよかったわね。\n@c0@"
13:
  de: "@aNera@bEr wirkt so zufrieden mit sich, findest du nicht? Warum es ihn wohl so freut, dass die Aktion vorbei ist?\n@c0@"
  en: "@aNera@bHe looks so pleased with himself, don't you think? I wonder why he's so happy for the offer to be over.\n@c0@"
  es: "@aNera@bEstá muy satisfecho consigo mismo, veramente. Me pregunto por qué está tan contento de que se haya acabado la oferta.\n@c0@"
  fr: "@aNera@bTu ne trouves pas qu'il a l'air très content de luiⓡ Je me demande pourquoi il est si satisfait que\ncette offre spéciale soit terminée.\n@c0@"
  it: "@aNera@bCome mai l'offerta è terminata?\r\nEra limitata nel tempo? Oppure avranno esaurito gli oggetti da dare in regalo?\n@c0@"
  ja: "@a@bフローラ「あの方　妙に\n\tすっきりした顔を　なさっていますわ。\n\t終わって　そんなにうれしいのかしら？\n@c0@"
14:
  de: "@aBianca@bDa müssen wir uns wohl einen Bergpass suchen, um nach Humburg zu gelangen. Solange wir uns vorher gut ausruhen, sollte das wohl zu schaffen sein.\n@c0@"
  en: "@aBianca@bSounds like we have to cross a mountain pass to get to Gotha. But we'll be fine as long as we have a good rest first.\n@c0@"
  es: "@aBianca@bParece que tendremos que cruzar un paso de montaña para llegar a Pankraz. Pero no hay problema mientras descansemos bien antes, ¿sabes?\n@c0@"
  fr: "@aBianca@bIl va falloir franchir un col montagneux pour atteindre Gotha, on dirait. Mais tout devrait bien se passer si nous commençons par bien nous reposer.\n@c0@"
  it: "@aBianca@bDovremo superare delle montagne per arrivare a Denim? Allora ci conviene fare una sosta, prima di affrontare un viaggio tanto impegnativo.\n@c0@"
  ja: "@a@bビアンカ「グランバニアへは　山ごえ\n\tしないといけないのね。\n\tひと休みして　がんばりましょう。\n@c0@"
15:
  de: "@aNera@bIch glaube, die ganze Herumreiserei hat mich schon viel kräftiger gemacht. Da wird mich so eine kleine Bergwanderung nicht gleich umhauen.\n@c0@"
  en: "@aNera@bI think I've become a lot stronger than I was, travelling around together like this. I'm sure I'll cope with a spot of mountaineering.\n@c0@"
  es: "@aNera@bCredo que viajar contigo me ha hecho più forte. Un poco de montañismo no supondrá ningún problema.\n@c0@"
  fr: "@aNera@bÀ force de voyager, je suis devenue plus résistante que je ne l'étais. Je suis sûre qu'un peu de marche\r\nen montagne ne me posera pas de problème.\n@c0@"
  it: "@aNera@bQuesto viaggio mi ha resa molto più forte di quanto non fossi prima. Attraversare le montagne non sarà facile, ma sono certa che ce la farò!\n@c0@"
  ja: "@a@bフローラ「今までの旅で\n\t私も　ずいぶん　なれましたわ。\n\t山ごえも　大丈夫よ　あなた。\n@c0@"
16:
  de: "@aBianca@bUnheil in der Luft?\nDas klingt aber gar nicht gut!\n@c0@"
  en: "@aBianca@bA sinister feeling?\r\nI dun't much like the sound of that.\n@c0@"
  es: "@aBianca@b¿Ambiente siniestro?\r\nEso no me gusta ni un pelo.\n@c0@"
  fr: "@aBianca@bUne atmosphère pesanteⓡ\nJe n'aime pas tellement ça.\n@c0@"
  it: "@aBianca@bAtmosfera sinistra? Essenza del pericolo?\nSecondo me quella suora si impressiona troppo facilmente...\n@c0@"
  ja: "@a@bビアンカ「いやな気配って　何かしら。\n\t気になるわね……。\n@c0@"
17:
  de: "@aNera@bOh je. Hoffentlich bedeutet das nicht, dass in Humburg etwas passiert ist! Jetzt bin ich ganz unruhig!\n@c0@"
  en: "@aNera@bOh dear. I wonder if that means something bad has happened in Gotha. What a worry!\n@c0@"
  es: "@aNera@b¡Oh, cielos! Me pregunto si habrá pasado qualquna cosa mala en Pankraz. ¡Qué preocupazione!\n@c0@"
  fr: "@aNera@bPar la Déesse. Je me demande si cela signifie qu'il s'est passé quelque chose de grave à Gotha.\nC'est inquiétantⓠ\n@c0@"
  it: "@aNera@bSanti numi! Hai sentito?!\nCosa starà succedendo a Denim?!\n@c0@"
  ja: "@a@bフローラ「グランバニアに　何かが\n\tおこっているのでしょうか？\n\t気になりますわ……。\n@c0@"
18:
  de: "@aBianca@bOffenbar kann Frau Berges Sohn nicht verbergen, dass er nicht gerade die geschicktesten Finger hat. Wie kam er da bloß ausgerechnet aufs Nähen?\n@c0@"
  en: "@aBianca@bSounds like Granny Knot's son is a bit of a clumsy one. I wonder what made him think sewin' would be a good idea!\n@c0@"
  es: "@aBianca@bParece que el hijo de la abuela Jipi es un poco patoso. ¿Por qué se le habrá metido en la cabeza lo de la costura?\n@c0@"
  fr: "@aBianca@bLe fils de mamie Pie n'a pas l'air très habile de ses mains. Je me demande ce qui lui a fait croire que c'était une bonne idée de se mettre à la coutureⓠ\n@c0@"
  it: "@aBianca@bPare che il figlio di Nonna Serena abbia bisogno di qualche lezione di taglio e cucito, eh? Oppure di una decina di ditali molto resistenti! Ah ah ah!\n@c0@"
  ja: "@a@bビアンカ「ネッドの息子さんって\n\t不器用なのね。　なのに　なんで\n\t刺しゅうをしようと　思ったのかしら。\n@c0@"
19:
  de: "@aNera@bWenigstens ist der arme Mann jetzt fertig.\n@c0@"
  en: "@aNera@bAt least the poor man's finished with it all now.\n@c0@"
  es: "@aNera@bAl menos el poverino ya ha terminado.\n@c0@"
  fr: "@aNera@bAu moins, le pauvre homme a fini son ouvrage, maintenant.\n@c0@"
  it: "@aNera@bIo sono una vera maga con ago e filo.\nCucio, rammendo, rattoppo, rappezzo, ricamo e faccio mille altre cose!\n@c0@"
  ja: "@a@bフローラ「この前まで　ということは\n\tもう　終わったんですのね。\n@c0@"
20:
  de: "@aNera@bUnd für alle anderen muss es auch eine Erleichterung sein, seine Schmerzensschreie bei der Arbeit nicht mehr hören zu müssen!\n@c0@"
  en: "@aNera@bIt must be a relief for everyone else not to have to hear him suffering while he works too!\n@c0@"
  es: "@aNera@bY también debe de ser un alivio para tutti no oírle quejarse mientras trabaja.\n@c0@"
  fr: "@aNera@bEt puis ça doit aussi être un soulagement pour tous les autres de ne plus avoir à l'entendre souffrirⓠ\n@c0@"
  it: "@aNera@bNon per niente ero la prima della classe al corso di ⓕFilologia e agologia applicateⓖ organizzato dalle suore all'Abbazia di Su'ncyel!\n@c0@"
  ja: "@a@bフローラ「宿屋には　不似合いな\n\t叫び声が　聞こえなくなって\n\tお客さんたちも　ホッとしたでしょう。\n@c0@"
21:
  de: "@aGriselda@bWas für ein gewaltiger Baum! Ich bin nie viel herumgereist, darum sehe ich so etwas zum ersten Mal. Das haut einen ja glatt um!\n@c0@"
  en: "@aDebora@bWhat an enormous tree! I've never travelled all that much, so it's the first time I've ever seen anything like this. It's amazing!\n@c0@"
  es: "@aStefania@b¡Qué árbol más enorme! No he viajado mucho en la mia vita, pero creo que es la prima volta que veo una cosa así. ¡Es asombroso!\n@c0@"
  fr: "@aPandora@bQuel arbre énormeⓠ Je n'avais jamais voyagé aussi loin, alors c'est la première fois que je vois quelque chose comme ça. C'est incroyableⓠ\n@c0@"
  it: "@aViola@bNon avevo mai visto un albero così grande!\nA dire la verità, non immaginavo nemmeno che ne esistessero di così imponenti!\n@c0@"
  ja: "@a@bデボラ「わ～　大きな木！\n\tサラボナにばかり　いたから\n\tこういう宿屋は　はじめて見るわ～！\n@c0@"
22:
  de: "@aGriselda@bWarum siehst du mich so überrascht an? Selbst ich lasse mich von Zeit zu Zeit mal beeindrucken, weißt du!\n@c0@"
  en: "@aDebora@bWhy are you looking surprised? I have my moments of being impressed every now and then, you know!\n@c0@"
  es: "@aStefania@b¿Ma por qué estás sorprendido? A veces, hasta yo me impresiono, ¿sabes?\n@c0@"
  fr: "@aPandora@bPourquoi tu as l'air surprisⓡ Moi aussi, de temps en temps, je peux être impressionnée par quelque chose, tu saisⓠ\n@c0@"
  it: "@aViola@bTi sono grata, maritino mio.\nDa quando viaggio con te, sto scoprendo moltissime cose nuove. Beh? Cos'è quell'espressione da ebete? \n㈡\nSei sorpreso che mi sia rivolta a te in maniera così gentile? Non temere, non mi sto rammollendo... Ho solo avuto un attimo di debolezza, tutto qui.\n@c0@"
  ja: "@a@bデボラ「……あら　なあに？\n\t私だって　うるわしき　乙女のように\n\t心おどることだって　あるの。\n@c0@"
23:
  de: "@aGriselda@bHäschenkleidung ist gar nicht so übel. Vielleicht könntest du so was eines Tages auch mal anprobieren, %a000090!\n@c0@"
  en: "@aDebora@bI suppose bunny girl outfits aren't all that bad.\nPerhaps you should try one on one day, %a000090!\n@c0@"
  es: "@aStefania@bSupongo que los disfraces de conejita no están mal del todo.\n¡Deberías ponerte uno un giorno, %a000090!\n@c0@"
  fr: "@aPandora@bLes costumes de lapin des serveuses ne sont pas si mal, après tout. Peut-être que tu devrais en essayer un, un jour, %a000090ⓠ\n@c0@"
  it: "@aViola@bScommetto che ti piacerebbe vedermi vestita con un abitino del genere, %a000090... Beh, toglitelo dalla testa! Preferisco vestiti più eleganti, io!\n@c0@"
  ja: "@a@bデボラ「こうしてみると　バニーガールの\n\tカッコウも　悪くないわね。\n\t試しに今度　着てみなよ　%a000090。\n@c0@"
24:
  de: "@aGriselda@bUnbedingt. Man lebt nur einmal! Darum sollte man immer nur das tun, was man will.\n@c0@"
  en: "@aDebora@bAbsolutely. You only live once, so you should just do whatever you want whenever you want.\n@c0@"
  es: "@aStefania@b¡Desde luego! Solo se vive una volta, así que una debe hacer lo que quiera y cuando le apetezca, ¿capisci?\n@c0@"
  fr: "@aPandora@bTout à fait. On ne vit qu'une fois, alors autant faire exactement ce qu'on veut, quand on veut.\n@c0@"
  it: "@aViola@bSono totalmente d'accordo con lei, %a000090!\nLa vita è breve, e bisogna cercare di godersela.\n㈡\nÈ per questo che delego a te i compiti più faticosi e meno divertenti, così io posso rilassarmi e spassarmela.\n@c0@"
  ja: "@a@bデボラ「そうよね。\n\t１度きりの　人生だから　好き勝手に\n\t生きるのが　一番だと思うの。\n@c0@"
25:
  de: "@aGriselda@bDieses Zimmer ist wirklich ganz hübsch. Also ist es abgemacht. Hier bleiben wir heute Nacht. Basta.\n@c0@"
  en: "@aDebora@bThis room's really quite nice. That's decided then. We're staying here tonight. And that's an order.\n@c0@"
  es: "@aStefania@bEsta habitación me piace molto. Decidido, pues. Esta notte nos quedamos aquí, ¿capisci?\n@c0@"
